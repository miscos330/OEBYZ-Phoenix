l_english:
 greek_group_desc: "#Y #color_yellow Ῥωμανία#!, Romania. When the Eastern Romans say '#color_yellow Ῥωμανία#!', they refer to a community of civilization ruled by the Roman Emperor, governed by Roman law, bound by Orthodox faith, and using Greek as its cultural language.#!\n\nThe Roman group gathers the Greek-speaking peoples of the eastern Mediterranean and Black Sea: the Greeks, the Pontic Greeks of the Black Sea coast and the Griko of southern Italy. In the Byzantine Empire they called themselves Romans, heirs of the Roman state.\n\nIn 1337 Andronikos III ruled a shrunken empire at Constantinople. The Pontic Greeks lived under the Komnenos emperors of Trebizond, who survived until 1461. Constantinople fell to the Ottoman sultan Mehmed II in 1453 and the Morea in 1460. Under Ottoman rule the Orthodox Church led the Greek community until the war of independence began in 1821."
 hellenism_religion_desc: "Religio Romana descends from the Capitoline Triad and the classical Olympian pantheon, anchoring the survival of the commonwealth upon Pax Deorum—the Peace of the Gods—upheld through pontifical law, augury, omens, and civic piety.\n\nFrom Augustus's restored sanctuaries, Aurelian's Unconquered Sun, and Emperor Julian's philosophical revival to Georgios Gemistos Plethon's Book of Laws at Mistra, the ancient state faith never truly perished. Through the syncretic breadth of Interpretatio Romana, it weaves Roman ritual, Greek philosophy, and the sacred traditions of the Mediterranean into a single imperial creed.\n\nHellenism is the attempt to revive the worship of the ancient Greek gods. Historians think the old religion had died out by the ninth century. Its first advocate was the late Byzantine philosopher Georgios Gemistos Plethon, who taught in Mystras, in the Despotate of the Morea, and declared in a speech that the Greeks were Hellenes by race and culture.\n\nIn his last work, the Nomoi, or Book of Laws, Plethon rejected Christianity for the worship of the Olympian gods, mixed with the wisdom of Zoroaster and the Magi. Zeus stood at the head as the self-father of all things, with the other gods ranked in orders beneath him.\n\nPlethon died in 1452 or 1454. In 1460 the Patriarch Gennadius II, once his pupil, burned the only copy, though Gennadius's letter summarising it survives."
 miaphysite_desc: "$miaphysite$ teaches that in the person of Christ, His divine and human natures are united into a single, indivisible nature. This doctrine, rooted in the Council of Ephesus, spread widely across regions like Armenia, Egypt, and Ethiopia. $miaphysite_ADJ$ communities have preserved their unique liturgies and traditions, emphasizing Christ's unity as both God and man.\n\nMiaphysitism follows the formula of Cyril of Alexandria, the champion of the Council of Ephesus in 431, and rejects the Council of Chalcedon of 451, which spoke of two natures. Most bishops of Alexandria, Antioch and Armenia refused Chalcedon.\n\nThe Oriental Orthodox churches that followed them were the Coptic Church of Egypt, the Syriac Orthodox Church and the Armenian Apostolic Church, together with the Ethiopian Church. In 1337 the Ethiopian empire was the greatest Miaphysite power, and the faith was also held in the Armenian kingdom of Cilicia, which fell to the Mamluks in 1375.\n\nThe Ethiopian Church held out against Rome. The Jesuits won Emperor Susenyos to Catholicism, but he gave up the throne in 1632 and his son Fasilides restored the old faith and expelled them in 1633.\n\nUnder the Solomonic emperors Amda Seyon I and Zara Yaqob, highland Ethiopia reached a medieval golden age, reforming monastic discipline and liturgical texts while dispatching envoys to the Council of Florence and Mediterranean courts. Across the Nile and the Red Sea, Ethiopia's church maintained ecclesiastical links with the Coptic see of Alexandria and with Constantinople, bridging the Horn of Africa and the eastern Mediterranean."
 nestorianism_desc: "$nestorianism$, named after Nestorius, teaches that Christ's divine and human natures are distinct and exist side by side. This doctrine was rejected by the Council of Ephesus but found a strong following in Persia and beyond. Nestorian Christians spread their faith across $asia$, becoming the largest $christian_ADJ$ religion in land area covered.\n\nNestorianism is the name usually given to the Church of the East. Its namesake Nestorius was Patriarch of Constantinople; after the Council of Ephesus condemned his teaching in 431, the church of the Sasanian Persian empire held to it, and its patriarchs sat at Seleucia-Ctesiphon, later at Baghdad.\n\nIts liturgy was in Aramaic, and it grew under the caliphs. Patriarch Timothy I, who held office from 780 to 823, appointed metropolitans for the Turks of Central Asia, for China and for India.\n\nThe church then shrank. Timur's persecutions after 1370 wiped out Christianity in Central Asia, leaving the church in the mountains of Kurdistan and with the Saint Thomas Christians of Malabar. In the seventeenth century its two patriarchal lines broke off their dealings with Rome.\n\nUnder the Great Yuan, the Church of the East—known in China as the Yelikewen—briefly revived along both land and sea Silk Roads: the Önggüd princes of Zhao guarded the northern Yin Mountains as hereditary Christians, the great maritime port of Quanzhou (Zaytun) left Syriac and Uyghur Christian tombstones, and far out at the mouth of the Red Sea the island of Socotra preserved an East Syriac community linking the Indian Ocean to the wider East."
 orthodox_desc: "$orthodox$, rooted in the traditions of the early $christian_ADJ$ councils, emphasizes the continuity of apostolic teachings and sacred tradition. Centered on the $BYZ_ADJ$ Rite, it places great importance on liturgy, icons, and mysticism. The church is led by patriarchs, with the Ecumenical Patriarch of Constantinople holding a primacy of honor.\n\nThe Orthodox churches are self-governing, each ruled by its bishops in synod. Unlike the pope, the Ecumenical Patriarch of Constantinople has no authority over the others. They hold to the decrees of the seven ecumenical councils and the teaching of the Church Fathers, and parted from Rome in the schism of 1054. Mysticism was strong among the monks of Mount Athos, whose practice of hesychasm was defended by Gregory Palamas.\n\nIn 1337 Orthodoxy was the faith of Byzantium, Serbia, Bulgaria, Georgia, Wallachia and the Russian principalities. The union with Rome agreed at the Council of Florence in 1439 was rejected by most clergy and people in Constantinople, and the city fell to the Ottomans in 1453.\n\nEven under fourteenth- and fifteenth-century crisis, Orthodox intellectual life saw a vibrant revival: Hesychast orthodoxy championed by Gregory Palamas and Gennadios II (George Scholarios), the Neoplatonic circle of Gemistus Plethon at Mystras, and the Graeco-Latin humanist bridge built by scholars such as Cardinal Bessarion. In the north, after rejecting the Union of Florence, the Russian Church elected its own metropolitan in Moscow in 1448 and was raised to the Moscow Patriarchate with Constantinople's recognition in 1589."
 safavid_school_desc: "Founded by Ṣāfī ad-Dīn Isḥāq Ardabīlī upon the [ShowReligiousSchoolName('shafii_school')] teachings, the $safavid_school$ has later gotten close to the [ShowReligiousSchoolName('imamiya_school')] thought. Its zeal and strength of belief make its followers be certain of their place in the universe.\n\nThe Safavid order passed through the family of Safi al-Din after his death in 1334. Under Junayd and Haydar in the fifteenth century, it became a militant movement supported by Qizilbash followers, while its leaders claimed spiritual and political authority.\n\nIn 1501 Haydar's son Ismail captured Tabriz and became shah, establishing the Safavid dynasty. He proclaimed Twelver Shiism the state religion and brought scholars from Syria and Lebanon to help establish it.\n\nBetween the death of Safi al-Din in 1334 and Ismail I's coronation in 1501, the Ardabil order underwent a dramatic transformation from a quietist Sunni Sufi brotherhood into a militant Twelver Shia dynasty. Its Turkoman Qizilbash followers revered the shah as both temporal sovereign and spiritual master, turning sectarian devotion into a formidable military force across Iran and the Caucasus."
 shia_desc: "The basis of the $shia_ADJ$ faith is that Muḥammad designated 'Alī ibn Abī Ṭālib as his successor as the spiritual and political leader of $muslim$. As such, the $imamate$ is to follow 'Alī's line rather than the one established by 'Abū Bakr when he was chosen as $rank_empire_muslim_ruler_male$ at the meeting of Saqīfah by the companions of Muḥammad.\n\nShiism reveres Ali ibn Abi Talib as Muhammad's cousin and son-in-law, and holds that his descendants, the Imams, are infallible guides. The martyrdom of Husayn at Karbala in 680 is mourned every year on Ashura.\n\nThe main branches differ over the line of Imams. Twelvers recognise twelve, the last of whom, the Mahdi, lives hidden in occultation; Ismailis follow Ismail ibn Jafar; Zaydis, the closest to Sunnism, are found in the highlands of Yemen.\n\nIn 1337 the Sarbadars, a Shia-ruled state, were newly established at Sabzevar in Khorasan. The great turning point came in 1501, when Ismail I made Twelver Shiism the official religion of Safavid Iran and a largely Sunni population was converted, often by force. After the Safavids fell in 1736, the Usuli school gained ground over the Akhbari.\n\nThe decisive engine of Iran's shift to Shiism was the Safavid order of Ardabil in Azerbaijan: originally a Sunni Sufi order of the Shafi'i school, it turned under Shaykhs Junayd and Haydar in the fifteenth century into a militant Twelver Shia movement backed by red-capped Turkoman tribesmen known as the Qizilbash. When Ismail I rode that coalition into Tabriz in 1501, he permanently reshaped the confessional map of the Near East."
