 regencies.8.desc: "No heir to the throne has been found, and the [ROOT.GetCountry.GetFlavorRank] remains in the hands of [target_character.GetName], a cleric who can neither take the crown nor provide a successor of [target_character.GetHerHis] own.\n\nWeary of the long regency, the [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] have put forward [council_candidate.GetName] to take the throne and found a new ruling line."
