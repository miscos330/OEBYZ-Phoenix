 flavor_mol.1000.trigger_subject: "[GetCountry('GLH').GetName] has a [ShowCultureName('moldovan')] [subject|e] in [ShowAreaName('moldavia_area')] or with a presence there"
 flavor_nav.6.desc_no_succession: "Although [target_character.GetName]'s health has declined in recent years, the [ROOT.GetCountry.GetGovernment.GetCourtTitle] was still stunned by the news that [target_character.GetSheHe] had died in a fire in [target_character.GetHerHis] chambers the previous night. Rumors swirling in the [ROOT.GetCountry.GetGovernment.GetCourtTitle] whispered that while being treated for [target_character.GetHerHis] illness, a candle fell into [target_character.GetNameWithNoTooltip]'s bed and set it ablaze.\n\nAs the court mourns, many wonder how the scribes of [ROOT.GetCountry.GetName] will remember [target_character.GetNameWithNoTooltip]'s rule."
 flavor_pol.55.desc.no_enemy: "Up until recently, the [ROOT.GetCountry.GetLongName] and the [POL_partner_country.GetLongName] were experiencing the all-too-common tale of two rival powers vying for hegemony in their local area. Now, with rivals on every side that can defeat either one at any given time, the two countries are closer than ever. To solidify this state of affairs, the [POL_partner_country.GetAdjective] [POL_partner_country.GetGovernment.GetEstateName('nobles_estate')] have proposed a marriage between [POL_proposed_polish_candidate.GetName] and [POL_proposed_lithuanian_candidate.GetName]."
