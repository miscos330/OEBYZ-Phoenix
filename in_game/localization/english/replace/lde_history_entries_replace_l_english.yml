l_english:
 abenakian_language_desc: "An Eastern Algonquian branch spoken in much of Northern New England and the Canadian Maritimes.\n\nAbenakian is the speech of the Wabanaki peoples, a dialect chain including Eastern and Western Abenaki and Mi'kmaq. Its speakers call themselves Wôbanakiak, People of the Dawn Land, and the polysynthetic language packs whole sentences into single words.\n\nChamplain met Abenaki farmers on the Kennebec river in 1604, and the English word skunk was borrowed from their speech in the 1630s. Epidemics and pressure from English settlements drove many Abenaki under French protection from 1669, when missions were founded at Odanak and Wôlinak, where Jesuits recorded dialects in grammars and word lists.\n\nAllied with the French, they raided the English frontier through King Philip's War of 1675 and Queen Anne's War, until the Jesuit Sébastien Rale was killed at Norridgewock in 1724 and the Abenaki wars ended the following year."
 anishinabe_language_desc: "A collection of Central Algonquian dialect spoken all over the Great Lakes and Ottawa Valley.\n\nAnishinabe, self-designated Anishinaabemowin, reaches from the lower St Lawrence westward to Lake Winnipeg and the upper Mississippi. Its varieties include Algonquin, Ottawa, Ojibwe, Saulteaux and Oji-Cree, with no single dialect or orthography treated as standard.\n\nBy the early eighteenth century these dialects served as the trade lingua franca of the upper Great Lakes: a report of 1703 describes them in use from the Gulf of St Lawrence to Hudson Bay, and as the Huron declined during the 1700s Ottawa and other Anishinaabe varieties replaced the Huron language in intertribal commerce.\n\nThey were written in local Roman alphabets based on French and English spelling and in the Great Lakes Algonquian syllabics, a French-based syllabary shared with Fox and Potawatomi speakers."
 brythonic_language_desc: "The $brythonic_language$ languages originated amongst the ancient Celtic peoples of Britain, before spreading across the $english_channel_area$ with refugees fleeing the Anglo-Saxon invasions.\n\nThe Brythonic languages form the P-Celtic branch of the Insular Celtic family. They descend from Common Brittonic, spoken across most of Roman Britain; after the Roman withdrawal the Anglo-Saxon advance drove the Britons westward and northward, and the Battle of Dyrham in 577 cut the south-western Britons off from the Welsh. The old common language split into Welsh, Cornish and Breton, the last taking shape in Brittany from the fifth and sixth centuries, together with Cumbric and perhaps Pictish.\n\nCornish ceased to be a living community language by the late eighteenth century. Welsh held its ground, though the Laws in Wales Acts of 1536 and 1542 made English the language of law and administration; William Morgan's Welsh Bible of 1588 and dictionaries in 1632 and from 1770 to 1794 fixed a literary standard."
 cree_language_desc: "A vast collection of Central Algonquian dialects spoken from Newfoundland to Alberta.\n\nCree, or Cree–Montagnais–Naskapi, stretches from Labrador and the Gulf of Saint Lawrence through James Bay to Alberta. Its nine western and eastern groups are distinguished chiefly by their different reflexes of one Proto-Algonquian sound.\n\nIt grew from a Proto-Algonquian dialect whose speakers left the Great Lakes homeland two and a half to three thousand years ago and split into eastern and western branches around James Bay. A polysynthetic language, Cree folds subject and object into the verb and divides nouns into animate and inanimate genders.\n\nAfter 1670, Cree families armed through the fur trade expanded west from James Bay across the boreal forest and onto the plains, and long contact with French and Ojibwe speakers gave rise to the mixed languages Michif and Oji-Cree."
 english_language_desc: "Originating from the Anglo-Saxon dialects brought to Britain by Germanic settlers, English was later influenced by contact with Norse languages due to Viking invasions, leading to significant changes in vocabulary and grammar. Following the Norman conquest, and centuries of rule by continental feudal lords, it became influenced further by French.\n\nOld English, the speech of the Angles, Saxons and Jutes who settled in Britain from the fifth century, produced a written literature from Beowulf to the Anglo-Saxon Chronicle. Its Norse words came from Danish settlers in the north and east.\n\nAfter 1066 French became the language of the court and the law, and English, spoken mainly by the common people, absorbed a large Romance vocabulary. By the fourteenth century it was regaining ground: the Pleading in English Act of 1362 admitted it to the law courts, and Geoffrey Chaucer wrote The Canterbury Tales in the London dialect.\n\nWilliam Caxton's press at Westminster, opened in 1476, helped settle a written standard, later shaped by the King James Bible of 1611 and Samuel Johnson's dictionary of 1755."
 french_language_desc: "The #italic Langues d'oïl#!, or $french_language$, represent a patchwork of Romance dialects originating in the north of France.\n\nFrench grew out of the Vulgar Latin of Roman Gaul, over a Celtic Gaulish substrate that left its mark in liaison and some two hundred rural words. Germanic Franks settled the north from the third century and gave French its name, and a vocabulary of war and lordship; Vikings who took Normandy in the 900s added seafaring terms.\n\nThe oïl dialects, named for their word for yes, included Picard, Norman, Walloon and the Francien of Paris. The earliest surviving French text is the Oaths of Strasbourg of 842, and after 1066 Anglo-Norman ruled the courts of England.\n\nIn 1337 Francien was still one dialect among many. The Ordinance of Villers-Cotterêts of 1539 made French the sole language of legal documents, and Richelieu founded the Académie française in 1634. By 1789 perhaps half the king's subjects still spoke only a regional patois."
 gaelic_language_desc: "$gaelic_language$ (or Goidelic) represents a Celtic family of languages that originated in Ireland, and spread to neighboring islands in the medieval era.\n\nGaelic's oldest form, Primitive Irish, is first attested in Ogham stone inscriptions from about the fourth century; from the thirteenth to the eighteenth century a shared literary standard called Classical Gaelic served writers in Ireland and Scotland.\n\nGaelic reached western Scotland with the kingdom of Dal Riata in the sixth century, and the Picts had adopted it by the eleventh century. In Scotland Gaelic retreated to the Highlands and Islands, where the Statutes of Iona of 1609 forced clan chiefs' heirs into English-speaking schools.\n\nIn Ireland English conquest and the Treaty of Limerick of 1691 marginalized the language. The Scottish Gaelic New Testament appeared in 1767 and the full Bible in 1801, even as English schooling and emigration steadily shrank the Gaelic-speaking world."
 latin_language_desc: "One of the most influential languages in human history, Latin was the tongue of Caesar, Virgil, and Cicero, but also that of Luther, Descartes, and Newton. After the fall of the Western Roman Empire and the Germanic migrations, Latin evolved into the [ShowLanguageFamilyName('romance_language_family')] Languages. However, #italic Roma capta ferum victorem cepit#! — vanquished Rome conquered its ferocious conqueror—and Latin would live on as a language of rite, culture and diplomacy for millennia to come.\n\nLatin is an Italic language of the Indo-European family, first spoken by the Latins of Latium around the lower Tiber and carried across the Mediterranean by Rome. Its alphabet was borrowed from the Etruscans, and between about 75 BC and AD 200 Classical Latin took shape, while the Vulgar Latin of soldiers and settlers spread through the provinces.\n\nBetween the sixth and ninth centuries Vulgar Latin broke up into the Romance languages, yet written Latin lived on in the Church, law and scholarship. From around 1300 Renaissance humanists such as Petrarch revived classical models.\n\nNeo-Latin carried Erasmus's satires, Thomas More's Utopia and, in 1687, Newton's Principia. Until the end of the seventeenth century most books and nearly all diplomatic documents were in Latin; afterwards vernaculars displaced it, though Ecclesiastical Latin remained the liturgical language of the Catholic Church."
 mandarin_language_desc: "Mandarin is the $chinese_language_family$ language more spread across all China\n\nMandarin is native to the North China Plain, its dialects stretching from Yunnan to Heilongjiang. Most have four lexical tones, having lost the final stops of Middle Chinese while often keeping retroflex initials.\n\nThe northern speech of the Jurchen Jin and Mongol Yuan, known as Old Mandarin, bore a flourishing vernacular literature of qu songs and drama from the twelfth to fourteenth centuries. The rime dictionaries Menggu Ziyun of 1308 and Zhongyuan Yinyun of 1324 record its sound system.\n\nBecause the imperial capitals lay in the Mandarin area, a northern koine served officials and the court from at least the fourteenth century; under the Ming and Qing it was called Guanhua, the language of the officials, which the Jesuit missionaries who learned it in the sixteenth century rendered as Mandarin."
 north_italian_language_desc: "The people in the northern part of the Italian Peninsula speak languages in this group.\n\nThe Gallo-Italic languages, with Venetian often added to the group, descend from the Vulgar Latin of Cisalpine Gaul, with a Celtic substrate and a Lombardic superstrate left by the Lombard invasions of the sixth century. Gallo-Italic colonies planted after the Norman conquest of Sicily around 1100 survive as language islands in Sicily and Basilicata.\n\nThe vernaculars long served local administration, but from the fifteenth century literary Tuscan, championed by humanists such as Pietro Bembo, displaced them from writing, a trend encouraged at the Sforza court of Ludovico il Moro in Milan.\n\nLocal literature nonetheless endured: Carlo Maria Maggi standardized Milanese spelling in the seventeenth century and created the stage mask Meneghino, while in Venice Ruzante, Goldoni and Gozzi made Venetian the voice of comedy and the republic made it a Mediterranean lingua franca."
 occitan_language_desc: "The Occitano-Romance group of languages originated in the south of France before becoming a common language of merchant ports in the western Mediterranean.\n\nOccitan, or lenga d'òc, is named for òc, its word for yes, which Dante used in De vulgari eloquentia to mark it off from the oïl languages of the north. Its dialects include Limousin, Auvergnat, Languedocien, Provençal and Gascon.\n\nRooted in the Latin of Gallia Narbonensis of 121 BC, it produced the Boecis poem of around 1000 to 1030, one of Europe's earliest Romance texts, and became the vehicle of the troubadours, whose love poetry made it the first prestigious vernacular literary language of medieval Europe. The Albigensian Crusade of 1209 to 1229 broke the power of the Counts of Toulouse.\n\nFrom the 1300s Occitan lost status, and the Ordinance of Villers-Cotterêts of 1539 confined official business to French. It remained the everyday speech of the south, but with no place in administration, education or print and no single written standard."
 scandinavian_language_desc: "During the Viking Age, Old Norse spread across Scandinavia and into other areas like Iceland, the Faroe Islands, and parts of the British Isles. Over time, it evolved into the distinct but related languages we recognize today, each with their own unique characteristics, while still maintaining a common Scandinavian heritage.\n\nScandinavian, or North Germanic, began as Proto-Norse, from which came Old Norse, the common language of the Viking Age. Norse settlers carried it to Iceland and the Faroes around 800 and, as Norn, to Orkney and Shetland.\n\nMedieval speakers still called it the Danish tongue, and it was written in the Latin alphabet in manuscripts holding the Poetic Edda, the Prose Edda and the Icelandic sagas. West and East Norse gradually diverged, giving Norwegian and Icelandic on one side and Danish and Swedish on the other.\n\nThe Reformation brought printed Bible translations, while political unions, from the Swedish break with the Kalmar Union in 1523 to the end of Denmark–Norway in 1814, sharpened the separate standards. Norn died out around 1700, while Icelandic kept closest to the ancient tongue."
 south_italian_language_desc: "This is the name for the group of languages that cover the mid and southern part of the Italian Peninsula.\n\nThe Italian group, known to scholars as the Italo-Dalmatian languages, also takes in the islands and the vernaculars once spoken on the Dalmatian coast. Its languages descend from Vulgar Latin; the earliest surviving Romance vernacular text, the Placiti Cassinesi of 960 to 963, comes from near Benevento.\n\nSicilian holds the oldest literary tradition: the Sicilian School of 1230 to 1266, led by Giacomo da Lentini at Emperor Frederick II's Palermo court, forged the first Italian literary language and the sonnet. Primacy passed to Florentine Tuscan with Dante, Petrarch and Boccaccio in the fourteenth century. The Renaissance debate favoured Pietro Bembo's Florentine standard and the first Italian dictionary appeared in 1612.\n\nDalmatian served the merchant republic of Ragusa until the late fifteenth century, then yielded to Venetian and Croatian. Sardinian was used in medieval judicates before Catalan and Castilian gained prestige."
 wendat_language_desc: "One of the major branches of the Iroquoian languages, spoken along the Saint Lawrence and to the north of the Great Lakes.\n\nWendat, a name meaning dwellers on an island, is often called Huron in French sources; that nickname referred to the bristling hairstyle of its speakers. It was the language of the Wendat Confederacy in Huronia, between Lake Simcoe and Georgian Bay, maize farmers who lived in bark longhouses, with the related Tionontati or Petun people to their west.\n\nRecollet and Jesuit missionaries learned and wrote the language from the 1620s, leaving dictionaries and grammars, and in 1643 Jean de Brébeuf composed the Huron Carol in Wendat.\n\nEpidemics and defeat by the Haudenosaunee in the Beaver Wars of 1648 to 1650 shattered the confederacy: some refugees settled under French protection at Wendake near Quebec, while others merged with the Tionontati to become the Wyandot."
 bodh_gaya_desc: "The Mahābodhi Mahāvihāra marks the spot where Siddhartha Gautama attained enlightenment under the Bodhi Tree. Originally built by Emperor Ashoka in the 3rd century BC, it has undergone several restorations over time. Its distinctive brick structure is one of the earliest examples of $buddhist_ADJ$ temple architecture in India.\n\nBodh Gaya on the Phalgu River in Magadha, known as Uruvela in the Buddha's lifetime, is where Siddhartha Gautama, after six years of asceticism and rice milk offered by the village woman Sujata, sat beneath a sacred fig tree, found the Middle Way and attained enlightenment. The tree became the Bodhi Tree. Nearby shrines recall the seven weeks he spent in the area after enlightenment.\n\nThe Chinese pilgrims Faxian in the 400s and Xuanzang in the 600s recorded a thriving monastic centre. From the 1000s to the 1200s the Pithipati rajas of Magadha protected it.\n\nTurkic invasions around the end of the 1100s shattered that Buddhist world, and the ruined site passed centuries in obscurity. The name Bodh Gaya came into use in the 1700s, while pilgrims from Sri Lanka, Tibet, Nepal and Myanmar kept its memory alive."
 cholula_holy_city_desc: "The Great Pyramid of [ShowLocationName('cholollan')] was built in successive stages during hundreds of years. Dedicated to the deity [ShowGodName('quetzalcoatl_god')], it is the largest pyramid in the region. Even after the city's decline, it remained a sacred and cultural site for local inhabitants.\n\nCholollan, the place of refuge, was one of the holiest cities of central Mexico, and its pyramid was called Tlachihualtepetl, the hand-made mountain, by later Nahuatl speakers. Six building campaigns from the third century BC to the ninth century AD wrapped one adobe-brick pyramid inside another, producing the largest pyramid on earth by volume, facing the snow-capped volcano Iztaccihuatl.\n\nThe city may have held 100,000 people at its height, but in the eighth century the population collapsed and the pyramid was abandoned, though the devout went on burying their dead around it. In the twelfth century Toltec-Chichimeca invaders seized the city and built a temple to Quetzalcoatl elsewhere.\n\nIn 1594 the Spanish crowned the tree-covered monument with the church of Our Lady of Remedies, turning the sanctuary into a place of Catholic pilgrimage while native rites continued on its slopes."
 enryaku_ji_desc: "Founded in 788 AD on Mount Hiei by the monk Saichō, $enryaku_ji$ became the headquarters of the $SECT_TENDAI_NAME$ school of Japanese [ShowReligionGroupName('buddhist')]. It was a powerful monastic center that housed thousands of warrior monks and influenced the affairs of [ShowLocationName('kyoto')].\n\nEnryaku-ji overlooks Kyoto from the border of Ōmi Province. With Emperor Kanmu's backing, Saichō brought Chinese Tiantai teachings to Japan from here; in 807 he ordained a hundred disciples for twelve years of secluded study.\n\nAt its height the complex held some three thousand sub-temples. In the tenth century a succession feud split Tendai into the Mountain Order at Enryaku-ji and the Temple Order at Mii-dera, and armed monks repeatedly marched on Kyoto. The monastery trained the men who later founded the Pure Land, Shinshū, Sōtō Zen and Nichiren schools.\n\nIn 1571 Oda Nobunaga stormed Mount Hiei, burned the buildings and put the monks to the sword; only the thirteenth-century Ruri-dō survived. Reconstruction followed, and Tokugawa Iemitsu rebuilt the main hall in 1642."
 jerusalem_the_holy_city_catholic_desc: "Built in the 4th century under Emperor Constantine, the Church of the Holy Sepulchre in $jerusalem$ encompasses both Golgotha and the tomb of Christ. It became the holiest site in [ShowReligionGroupName('christian')] and its most important pilgrimage center. Despite periods of destruction and reconstruction, it has remained in shared $christian_ADJ$ custody.\n\nAround 135 the emperor Hadrian buried the tomb beneath what became the Church of the Holy Sepulchre, under a temple of Aphrodite; after Constantine's bishops cleared the site, three crosses were unearthed nearby, one taken for the True Cross, and the basilica was consecrated in 335.\n\nIn 614 Sassanid troops burned the church and carried the True Cross away, and Heraclius restored both in 630. The Fatimid caliph al-Hakim ordered the building demolished in 1009, and reconstruction was completed in 1048. Crusaders rebuilt it, finishing under Queen Melisende in 1149 and uniting the chapels under one roof.\n\nSaladin's forces occupied the church in 1187 yet soon admitted pilgrims again. The Status Quo of 1757 fixed the denominations' rights, and after the fire of 1808 the rotunda and tomb shrine were rebuilt in 1809 to 1810."
 kaaba_desc: "Located in [ShowLocationName('mecca')] and most commonly known as al-Ka'ba, the $kaaba$ is the most sacred shrine of [ShowReligionGroupName('muslim')]. Covered by a black cloth known as Kiswah, it defines the direction of prayer (qibla) for all $muslim_ADJ$ prayers.\n\nThe Kaaba, which Muslims hold to be the House of God, was raised by Ibrahim and his son Ismail. Before Islam it was a Qurayshi sanctuary housing 360 idols; after Muhammad entered Mecca the idols were destroyed and the shrine rededicated to God.\n\nFire gutted the building during the Umayyad siege of 683, and in 693 the caliph Abd al-Malik rebuilt it on Qurayshi foundations, giving it a cube form. In 930 the Qarmatians carried off the Black Stone and held it until 952; after the floods of 1626 the Ottoman sultan Murad IV rebuilt the walls.\n\nCircling the Kaaba seven times is the central rite of the hajj and umrah pilgrimages, and the kiswah that covers it is renewed every year."
 ranganathaswamy_temple_desc: "The Ranganathaswamy Temple in Srirangam is one of the largest and holiest $hindu_ADJ$ temple complexes in India. Dedicated to the god $vishnu_god$ as Ranganatha, it dates at least from the early Chola period, with later extensions by the Pandya and Vijayanagara rulers. By 1337, it is a major pilgrimage center in Southern India, known for its vast precincts, imposing gopurams, and rich religious endowment.\n\nSrirangam, an island town between the Kaveri and Kollidam rivers near Tiruchirappalli, holds the foremost of the 108 Vaishnava Divya Desams: the temple of Ranganatha, Vishnu reclining on the serpent Shesha.\n\nFrom the eleventh century the teachers Nathamuni, Yamunacharya and especially Ramanuja made it the headquarters of the Sri Vaishnava tradition. Disaster came with the Delhi Sultanate: Malik Kafur's raid of 1311 carried off the golden image, and the invasion of Muhammad bin Tughluq in 1327 left the temple deserted; in 1337 the Ranganatha icon was being carried secretly from village to village.\n\nOnly after Kumara Kampana's Vijayanagara forces overthrew the Madurai Sultanate was the image reinstalled in 1371. Vijayanagara kings and their Nayaka governors then fortified and enlarged the complex over two centuries, adding gopurams, the thousand-pillared hall and granaries."
 temple_of_confucius_desc: "The $temple_of_confucius$ in [ShowLocationName('qufu')], was originally built in 478 BC to honor the philosopher Confucius. Expanded repeatedly during successive dynasties, it became one of the largest temple complexes in China.\n\nThe Temple of Confucius stands on the site of Confucius's house, which the Duke of Lu made a shrine soon after his death in 479 BC. Emperor Gao of the Han offered sacrifices there in 205 BC, setting an imperial precedent.\n\nThe original house was replaced during a Sui rebuilding of 611; after a fire of 1214 under the Jin, the Yuan had restored the complex by 1302, and in 1331 it was enclosed by walls modelled on the imperial palace. The Ming rebuilding after another fire in 1499 gave the temple its scale, its nine courtyards and great Dacheng Hall echoing the Forbidden City.\n\nQing repairs following the fire of 1724 were completed by 1730. Together with the Kong Family Mansion and the Cemetery of Confucius, the temple drew scholars and officials to venerate the master and his teachings."
 the_vatican_desc: "The original Papal Basilica of Saint Peter in the Vatican in [ShowLocationName('rome')] was commissioned by Emperor Constantine in the 4th century over the tomb of Saint Peter, the first $catholic_pope$. It became the principal church of Western [ShowReligionGroupName('christian')] and the seat of papal authority. It also is one of the main centers of pilgrimage for [ShowReligionName('catholic')].\n\nSaint Peter's stands on the west bank of the Tiber, on the site of the former Circus of Nero. Constantine I's first basilica was built between 318 and 322. Charlemagne was crowned emperor there in 800.\n\nIn 846 Saracen raiders sacked the shrine and damaged the apostle Peter's tomb, prompting Pope Leo IV to build the Leonine Walls. By the fifteenth century the old church was unsound, and Nicholas V and then Julius II decided on replacement.\n\nWork on the Renaissance basilica began in 1506 under Donato Bramante; Michelangelo took over the design in 1547 and gave the church its great dome, and the building was completed in 1626. Gian Lorenzo Bernini furnished it with the bronze baldachin over the papal altar and the colonnaded square in front."
 a_fat_roog_religion_desc: "The $a_fat_roog_religion$ $common_folk_religion_desc$\n\nA ƭat Roog, the way of the Divine, is the traditional religion of the Serer of Senegambia. It centres on Roog, the supreme deity, and on the pangool, ancestral spirits who intercede between the living and the divine and receive libations.\n\nThe Serer hold that the souls of the righteous enter Jaaniw and may be reborn, and they recognise neither heaven nor hell. Every family keeps a totem that is both guardian and taboo, for example the antelope for the Joof.\n\nThe Serer and the Jola were among the last peoples of the region to accept Islam or Christianity. In the Kingdom of Sine the old faith held out against marabout armies in the 1800s, and after defeats at Naodorou and Ngaye many Serer killed themselves rather than be conquered."
 abu_religion_desc: "The $abu_religion$ $common_folk_religion_desc$\n\nKwaio religion is the traditional ancestor worship of the Kwaio, a people of central Malaita in the Solomon Islands who lived by swidden farming of taro, yams and plantains. The dead were believed to keep the power to intervene in the affairs of the living, and powerful ancestral forces such as La'aka were greatly feared.\n\nLife was ruled by strict taboos, called abu, and any violation had to be redressed with sacrifices. Kwaio oral tradition says that the land was first cleared some twelve to twenty centuries ago. The cleared tracts are marked by shrines, and these shrines established title to the land for the clans descended from the ancestors who made them."
 abwoi_religion_desc: "The $abwoi_religion$ $common_folk_religion_desc$\n\nAbwoi was a cult of male ancestral spirits among the peoples of the central Nigerian plateau, such as the Atyap and Bajju. The spirits were held to be ghosts or reincarnations of the dead, and each people told its own story of where the cult began; the Gwong traced theirs to a village called Agabi, probably in the 1800s.\n\nInitiated men kept strict taboos and guarded the cult's secrets from women on pain of death. The Abwoi ranked below the Heavenly Father, Agwaza, but as demigods nearer to the people they healed the sick and were summoned in crises.\n\nAt the start of the rains each April they were escorted away for the farming year, and a cry heard afterwards foretold epidemic or drought. Once a year the whole community gathered for common worship."
 adamawa_religion_desc: "The $adamawa_religion$ $common_folk_religion_desc$\n\nAdamawa stands for the traditional beliefs of the many non-Muslim peoples of the Adamawa highlands and the Benue valley south of Lake Chad, a land of great ethnic, linguistic and religious variety, much of which the Fulani emir Modibbo Adama's jihad of 1809 subjected or raided for slaves."
 adat_musi_religion_desc: "The $adat_musi_religion$ $common_folk_religion_desc$\n\nAdat Musi is a religion of the Talaud Islands in northern Sulawesi, taught by Bawangin Panahal at the village of Musi on Salibabu Island. His followers held that he received revelation from God, called Mawu Ruata, through an intermediary named Onto'a."
 adat_puun_religion_desc: "The $adat_puun_religion$ $common_folk_religion_desc$\n\nAdat Pu'un is the traditional animist belief of the Kenyah of the interior of Borneo, who held that after death a person ascends with the ancestors, the tepun, to Alo Malau, the seven heavens. When Christian missionaries arrived, the old practices were revived for a time as the Bungan movement."
 ainu_religion_desc: "The $ainu_religion$ $common_folk_religion_desc$\n\nThe Ainu religion is the animist belief of the Ainu of Hokkaidō, Sakhalin and the Kuril Islands. Everything in nature has a kamuy, a spirit or god. Among the most important are Kamuy-huci, the hearth goddess; Kim-un-kamuy, god of bears and mountains; and Ae-oyna-kamuy, a culture hero who taught the Ainu weaving and carving.\n\nThe Ainu have no professional priests; the village chief conducts the rites, which include libations of sake, prayers and offerings of inau, willow sticks with wooden shavings attached. Bears were believed to bring their hide and meat to humans as a gift from the mountain god.\n\nBurials and houses at Ainu settlements of the thirteenth to seventeenth centuries follow these beliefs. After the Matsumae Domain sent an expedition to Sakhalin in 1635, Japanese traders came into closer contact with the Ainu."
 ajok_religion_desc: "The $ajok_religion$ $common_folk_religion_desc$\n\nThe Ajok religion is the traditional faith of the Otuho, or Lotuko, a Nilotic people of the Imatong mountains in what is now South Sudan. It is a religion of nature and ancestor worship. Its chief god is Ajok, who made humans in his own image. He is kind to those who pray and offer sacrifices, though he can be angered.\n\nMyth explains how death became permanent: Ajok revived a woman's dead child at her prayer, but her husband, enraged, killed the child again, and Ajok swore never to raise an Otuho from death again and left the earth. The Otuho say the spirits of the dead plead with Ajok on behalf of the living when rain falls."
 akan_religion_desc: "The $akan_religion$ $common_folk_religion_desc$\n\nAkom is the traditional religion of the Akan of what is now Ghana, and in 1337 the Bono state, Bonoman, practised it. It is built around a distant creator, Nyame, who made the world with Asase Yaa, Mother Earth, and left the daily work to lesser gods, the abosom.\n\nThe abosom are tied to rivers, mountains and forests and are served by priests, the akomfoo, who fall into trance and speak for them. A god is housed in a shrine, a brass pan holding river stones, and honoured with libations. Bono tradition holds that their ancestors emerged from the sacred hole at Amowi, a memory kept alive at the Apɔɔ festival in Takyiman.\n\nThe Asante conquered Bono Manso in 1723, and Akom spread widely on slave ships: in Jamaica, the enslaved Akan kept the names of the abosom."
 akinha_ekugu_religion_desc: "The $akinha_ekugu_religion$ $common_folk_religion_desc$\n\nThe Akinhá Ekugu religion is the belief of the Xingu peoples of central Brazil, in which the world was made by two sibling creators. Among the Kamaiurá of the Upper Xingu, the best-recorded pair of brothers is the divine twin heroes Kwat and Yaì, the Sun and the Moon."
 akuj_religion_desc: "The $akuj_religion$ $common_folk_religion_desc$\n\nAkuj is the traditional religion of the Turkana, semi-nomadic camel and zebu herders around Lake Turkana. For the Turkana religion and culture are one, and the aim of each day is to win the blessings of life: water, food, livestock and children.\n\nAkuj is the single Supreme Being, who created the world and controls these blessings. Ancestors, the ngipean, are seen as dangerous, and an angered ancestor may possess a family member and demand an animal sacrifice.\n\nThe key figures are the diviners, the ngimurok, the most respected of whom receive revelations from Akuj in dreams and say which animal must be sacrificed. Turkana tradition holds that zebu cattle brought them the wealth and power that let them beat other Ateker peoples and, by the end of the eighteenth century, press into the Siger highlands."
 alan_paganism_desc: "The $alan_paganism$ $common_folk_religion_desc$\n\nAlan paganism is the old religion of the Alans, the Iranian-speaking people of the north Caucasus, whose descendants are the Ossetians. It is thought to be of Scythian origin, and later accounts show many Christian elements, with the gods often named after saints. The stories of its gods are woven into the sagas of the Narts, semi-divine heroes.\n\nUastyrdzhi, named for Saint George, was patron of men and travellers and guarantor of oaths; Uacilla, named for Elijah, sent rain, thunder and lightning. The heavenly smith Kurdalægon befriended the Narts. Certain people dreamed their way to Kurys, the meadow of the dead, and returned with seeds of luck.\n\nThe Alan kingdom was Christianized in the early tenth century under Byzantine influence. The Mongols invaded in 1239 or 1240, and Timur broke the Alans in about 1395."
 aluk_religion_desc: "The $aluk_religion$ $common_folk_religion_desc$\n\nAluk, from Aluk Todolo, the Way of the Ancestors, is the traditional religion of the Toraja of the highlands of South Sulawesi. They believed that people, buffalo, rice, iron and rain were sent down from the sky.\n\nThe creator is Puang Matua, who made eight beings from a jar and gave the first of them, Datu' Laukku, the rules called aluk. His descendant Pong Mula Tau, the first man, came down a ladder to the earth.\n\nThe funeral rite Rambu Solo' was central. A dead person who had not yet had the rites was treated as sick, fed and cared for like the living, and the funeral sacrifices to the gods and spirits, of buffalo above all, were made in expectation of a greater gift in return."
 andamanese_religion_desc: "The $andamanese_religion$ $common_folk_religion_desc$\n\nThe Andamanese religion is the animism of the indigenous peoples of the Andaman Islands, in which the worship of ancestors holds an important place. Their creator is Pūluga, who gave the first people his commands.\n\nIn one version recorded by later ethnographers, a happy time ended when a food taboo was broken by eating the forbidden vegetables in Pūluga's garden. When the people ignored his laws, Pūluga sent a great flood. Only four survived, two men and two women, and they had lost their fire; Pūluga made the plants and animals again but did not give it back.\n\nThe British colonial presence on the islands from 1789 brought epidemics of pneumonia, measles and influenza that struck down people with no immunity. Within four years the large Jarawa settlements of south-eastern South Andaman had suffered a massive loss of population."
 anglican_desc: "$anglican$ is a form of $christian$ in which the head of state is also the Supreme Governor of the Church. Theologically and institutionally, $anglican$ retains many elements of $catholic$ while also being influenced by Reformed Puritans and continental $lutheran_ADJ$ beliefs.\n\nAnglicanism grew out of the Church of England after Henry VIII broke with Rome. Parliament's Act of Supremacy of 1534 made him Supreme Head of the Church. The church kept the bishops and much of the Catholic liturgy, but took its doctrine from the Reformation.\n\nUnder Edward VI, Thomas Cranmer wrote the Book of Common Prayer of 1549, the first service book wholly in English. Elizabeth I, who took the title Supreme Governor, restored it in 1559, and the Thirty-nine Articles, adopted in 1571, laid down a moderate Reformed doctrine.\n\nThe civil wars of the 1640s overthrew the church; after the Restoration of 1660 Puritan clergy were forced out, and the prayer book of 1662 became its standard. From Jamestown in 1607, English colonists carried Anglican worship overseas."
 anitism_religion_desc: "The $anitism_religion$ $common_folk_religion_desc$\n\nAnitism is the native religion of the lowland Philippines, best recorded among the Tagalogs of Luzon, where Spanish missionaries described their spirit worship, pag-aanito, from the 1570s. It rests on Austronesian beliefs, to which Hindu and Buddhist elements were added, probably indirectly, through contact with Srivijaya and Majapahit.\n\nAt its head stands Bathala, the creator, who was thought too distant to trouble with daily worship. People instead made offerings to the anito: lesser gods, spirits and the souls of ancestors, called kaluluwa. Feasts to the anito were led by priestesses, the katulunan, who might also stand in for an absent datu. Omen birds, the tigmamanukan, were watched before any journey.\n\nAfter the Spanish conquest the images were destroyed and the missionaries pressed Christianity on the villages, but many of the rites survived inside Catholic practice."
 anna_religion_desc: "The $anna_religion$ $common_folk_religion_desc$\n\nThe Anna religion is the traditional faith of the Kunama, who live between the Gash and Setit rivers on the Eritrean and Ethiopian border. It takes its name from their god Anna, whom the Arab geographer Ibn Hawqal already recorded them worshipping in the tenth century."
 arat_sabulungan_religion_desc: "The $arat_sabulungan_religion$ $common_folk_religion_desc$\n\nArat Sabulungan is the traditional belief of the Mentawai of the islands off West Sumatra. The Mentawai are said to have come from Nias in ancient times, and lived apart until they met the Dutch in 1621. The name comes from sabulungan, leaves, which are always used in the rites as a go-between with the spirits.\n\nEverything in nature holds a spirit. Offended or forgotten spirits bring illness and bad luck, so the Mentawai thank them and take no more than they need.\n\nThe ancestors are revered, as are Tai Kalelu, god of forest and mountain, and Tai Kamanua, the sky god who gives rain and life. The sikerei, shaman and healer, speaks with the dead and treats the sick. During a punen, a communal period of rest, no one works."
 arosi_religion_desc: "The $arosi_religion$ $common_folk_religion_desc$\n\nArosi religion is the traditional belief of the Arosi of western Makira (San Cristobal) in the Solomon Islands. Its chief god was Agunua, also called Hatuibwari, a cosmic serpent and god of the sea, of whom all other gods were held to be aspects. The first coconut of each tree was sacred to him, and he was asked for health and rich harvests.\n\nEach person had two souls: the benevolent aunga, which left at death, and the malignant adaro, which stayed. Adaro ghosts could enter an animal, a tree or a stone, and with the right entreaties they could be commanded to kill or maim the living from afar. Spaniards under Alvaro de Mendana sighted Makira in 1568."
 arutam_religion_desc: "The $arutam_religion$ $common_folk_religion_desc$\n\nArútam is the spirit-vision at the centre of the beliefs of the Shuar, the Jivaroan people of the forested foothills of the Andes. They are warriors who defeated an Inca army sent by Huayna Capac in 1527 and drove the Spaniards from their country in 1599.\n\nTraditionally a boy of about eight was taken to a waterfall and given maikua, a datura brew, in the hope of seeing an arútam, a vision sent by an ancestral spirit called wakaní. Touching it brought great strength, and several made a man invincible, though the power could be lost.\n\nThe Shuar did not believe in natural death. Unexplained illness was blamed on invisible darts, tsentsak, which shamans called uwishin bought and controlled. A slain enemy's soul, the muísak, was sought in the shrunken head, the tsantsa."
 asis_religion_desc: "The $asis_religion$ $common_folk_religion_desc$\n\nAsis is the traditional religion of the Kalenjin, the Southern Nilotic peoples of the Kenyan Rift Valley, among them the Nandi, Kipsigis and Pokot. It is named for the sun, Asis, the sky-dwelling supreme god, all-powerful and the guarantor of right.\n\nThe second great power is Ilat, god of thunder and rain, who lives in deep pools and waterfalls and whose discarded garments are the rainbow. The Nandi split him into a good Ilet ne-mie, whose distant rumbling drives danger away, and a bad Ilet ne-ya, whose crash of near thunder tries to kill people.\n\nThe Kalenjin built no temples, since a building would have limited the god. Each section set aside a hilltop, the kaapkoros, where priests called Tisiik led worship, and each home had a prayer tree or altar east of the door."
 atakapa_religion_desc: "The $atakapa_religion$ $common_folk_religion_desc$\n\nThe Atakapa religion is the traditional belief of the Atakapa, who called themselves Ishak, an Indigenous people of the Gulf coast of Louisiana and Texas whose language is an isolate. Their bands, among them the Akokisa, Bidai, Calcasieu, Opelousa and Vermilion, ranged from the Trinity River to the Vermilion River."
 badimo_religion_desc: "The $badimo_religion$ $common_folk_religion_desc$\n\nBadimo, Sotho-Tswana for ancestors, is the ancestor veneration of the Sotho-Tswana peoples of what are now Botswana, Lesotho and South Africa. Sotho and Tswana are thought to have separated by the fourteenth century, and both kept the veneration of the dead at the centre of religious life.\n\nThe Badimo are not simply the dead but the living dead, who dwell in the underworld and punish those who displease them. Each year before the first rains, a delegation took brewed beer and a slaughtered beast to the hills where the Badimo were thought to hide and brought back their expectations.\n\nFrom 1822 Moshoeshoe I gathered refugees of the difaqane into the Basotho kingdom, while Robert Moffat opened the Kuruman mission among the Tswana in 1824. Christianity did not fully displace the Badimo, which survived beside it."
 bahnar_religion_desc: "The $bahnar_religion$ $common_folk_religion_desc$\n\nThe Bahnar religion is the traditional animism and polytheism of the Bahnar, a Mon-Khmer-speaking people of the Central Highlands of Vietnam, in Gia Lai and Kon Tum, with other groups reaching coastal Binh Dinh and Phu Yen. Their gods are called Yang, and a great festival of thanks to them involves the stabbing of a water buffalo.\n\nThe Jolong, one Bahnar branch, keep a new-year feast of the bamboo rat as an act of worship to the gods of nature. The rat replaced the snake as the sacred animal after the villagers noticed that it never lacks roots to eat. Bahnar warriors fought beside Sedang and Jarai troops in the Tay Son armies that rose in 1771."
 banda_religion_desc: "The $banda_religion$ $common_folk_religion_desc$\n\nThe Banda religion is the traditional belief of the Banda people of the savannas of the Central African Republic. Its best-recorded practice is the sacrifice of offerings to ancestral spirits to win a good harvest, and the Banda were also known for carving wooden ritual objects and large animal-shaped slit drums."
 bantu_religion_desc: "The $bantu_religion$ $common_folk_religion_desc$\n\nBantu religion is the name for the traditional beliefs of the Bantu-speaking peoples of central, eastern and southern Africa, who form several hundred ethnic groups with shared themes. Traditionally these beliefs were passed on by word of mouth, not in scripture.\n\nMany Bantu peoples believed in a supreme god with a name such as Nyambe or Nzambe and honoured their ancestors, who were thought to speak with the gods. Among the Kongo the creator was Nzambi Ampungu, yet ancestor veneration was the core of belief, and healers called banganga trained to consult the dead."
 banunut_religion_desc: "The $banunut_religion$ $common_folk_religion_desc$\n\nBanunut is the name given to the many traditional legends of the Banggai, the people of the Banggai Islands off the east coast of Sulawesi. The islands were already known as Benggawi to the Majapahit poet Prapanca in 1365, and in the early sixteenth century Ternate organised the Banggai kingdom, which is described as an Islamic realm."
 bathou_religion_desc: "The $bathou_religion$ $common_folk_religion_desc$\n\nBathouism is the traditional faith of the Boro, or Bodo, people of the Brahmaputra valley in Assam. The name is read as ba, five, and thou, deep, for the five principles of air, fire, earth, water and ether, created by the high god Bathoubwrai, the Elder. His daughter Mainao guards the rice fields.\n\nThe god is embodied in the sijou, a spurge shrub planted in the courtyard on an altar fenced with eighteen pairs of bamboo strips, one for each pair of lesser gods. Bathou has no scripture and no temples; its priests are the male douri and female doudini.\n\nAfter the Koch kingdom rose in 1515, it kept the Duars open to non-Brahmin cultures. Hindu rites spread among the Boro, and some entered the Ekasarana Vaishnava faith, though Bathou held on in many families."
 besavik_religion_desc: "The $besavik_religion$ $common_folk_religion_desc$\n\nBesavik is the traditional animist belief of the Punan Bah, a people of what is now Sarawak on the island of Borneo. Later the Punan Bah also took up Bungan, a cult religion shared with the Kenyah."
 bimoism_desc: "The $bimoism$ $common_folk_religion_desc$\n\nBimoism is the indigenous religion of the Yi people of the mountains of Yunnan, Sichuan and Guizhou, named after the bimo, shaman-priests and masters of the Yi scriptures. Only the bimo, who can read the Yi script, perform the rituals linked to death.\n\nThe Yi honoured their ancestors and worshipped the gods of fire, water and sky, and also dragons, seen as protectors against the spirits that bring illness. Each person was held to have several souls: one stays to guard the grave and another is reborn into some living form.\n\nYi legend gives the hero Zhyge Alu, son of a dragon and an eagle, who shot down the extra suns. The Torch Festival, on the 24th day of the sixth lunar month, honours the strong man Atilaba, who burned locusts with pine torches."
 blang_religion_desc: "The $blang_religion$ $common_folk_religion_desc$\n\nThe Blang, called the Pu in the Yuan period, are a Mon-Khmer people of southern Yunnan who, by later accounts, keep animism, ancestor worship and Theravada Buddhism side by side. Their religious life centres on rice, water, bees, beeswax and the local spirits tied to them.\n\nMost Blang festivals are religious. The rite of the village god is held for three days in the first or sixth lunar month: a chicken is killed, water is dripped around the village and at its centre, and the young men dig for bamboo rats to offer to the god, asking for good weather and safe herds. The most solemn festival is Sangkan, when the sun is welcomed and the Buddha is bathed."
 bogomilism_desc: "A neo-gnostic and dualist branch of $christian$, $bogomilism$ teaches that existence is divided between a spiritual realm and a material one. Its followers view their bodies as sacred temples and strive for closeness to God through purification rituals. These practices include fasting, dancing, and rejecting material excess to focus on spiritual growth.\n\nBogomilism arose in the First Bulgarian Empire in the tenth century, founded by the priest Bogomil, probably in Macedonia. It drew on the Paulicians. The Bogomils believed that God made the spiritual world and Satan, his fallen son, the material one, so that the body was the work of the devil; they sought purity through fasting and prayer.\n\nThey rejected the church hierarchy, the cross and monasticism, and honoured the Lord's Prayer as the strongest weapon against Satan. The movement helped to give rise to the Cathars of Western Europe.\n\nBulgaria, Serbia and Byzantium suppressed Bogomilism in the twelfth and thirteenth centuries, but it lingered in Hum and Bosnia, where the Hungarians used the charge of heresy to justify crusades. Few traces survived the Ottoman conquest of Bosnia in 1463."
 bon_desc: "Emerging from the religious traditions of $tibet_region$ before the arrival of $buddhist$, it became very influenced by $tibetan_buddhism$. It is especially close to the $SECT_NYIGMA_NAME$, but still preserves many pre-$buddhist$ elements. Its teachings focus on Karma and rebirth, and the ways of achieving enlightenment.\n\nBön is said to have come from the old kingdom of Zhangzhung. Before Buddhism arrived, priests called bon performed rites for the Yarlung kings. Bonpos trace their faith to the Buddha Tönpa Shenrab, and hold that it was driven underground, its scriptures hidden as termas for later discovery.\n\nThe organised tradition known as Yungdrung Bön took shape in the tenth and eleventh centuries, from the same circles of tantric ritualists that produced the Nyingma school. The monk Nyammé Sherab Gyaltsen founded Menri Monastery in 1405 and gave Bön its monastic curriculum. Pushed to the margins by the Buddhist schools, Bön survived chiefly in Kham and Amdo. The Fifth Dalai Lama formally recognised it as a Tibetan religion."
 bori_religion_desc: "The $bori_religion$ $common_folk_religion_desc$\n\nBori, also called Maguzanci or Hausa animism, is the traditional religion of the Hausa of West Africa, built on magic and the possession of mediums by spirits. Only part of the Hausa, mostly urban elites, had accepted Islam before the end of the eighteenth century, and the royal courts practised a mixture of the two. Women held powerful advisory roles as Bori priestesses.\n\nScholars of Islam in the early nineteenth century condemned this mixed faith, and the jihad of Usman dan Fodio around 1800, which founded the Sokoto Caliphate, used it as a reason to overthrow the Hausa sultanates. Bori was partly suppressed, but the possession rituals survived in refuge states such as Konni and Dogondutchi."
 bosnian_church_desc: "A breakaway sect of the $catholic_ADJ$ Church, the $bosnian_church$ developed its distinct theology due to prolonged isolation from mainstream Christianity. It focused heavily on apocalyptic themes, embraced mysticism, and retained many archaic practices of early $christian$. These traits led both $catholic_ADJ$ and $orthodox_ADJ$ authorities to denounce it as heretical.\n\nThe Bosnian Church lasted in Bosnia from the thirteenth to the fifteenth century. Nominally Catholic, Bosnia saw its bishopric break with Rome in the first half of the thirteenth century, when the Hungarian-appointed bishop withdrew to Đakovo and the governor and nobles took over the choice of bishop.\n\nIts head was a bishop called the djed, or grandfather. It kept Slavic liturgy. It was long equated with the Bogomils, a link most scholars now doubt.\n\nHungarian kings repeatedly launched crusades on the pretext of heresy; Pope Nicholas IV sent an Inquisition in 1291. In 1459 King Thomas turned on the church to win papal support against the Turks, and it was dismantled; the Ottomans took Bosnia in 1463."
 bru_religion_desc: "The $bru_religion$ $common_folk_religion_desc$\n\nThe Bru religion is the traditional animism of the Bru, a Katuic-speaking people whose villages stand mostly along rivers, in the uplands of Quang Binh and Quang Tri in Vietnam, in Savannakhet in Laos and in Sakon Nakhon in Thailand. They honour their ancestors and the spirits of rice and fire, and hold relics and fragments of ancient weapons and household objects sacred. In more traditional villages the headman is also the village spiritual adviser.\n\nBru oral tales make the hare the cleverest of animals and the tiger the hero. The Ma Coong, a Bru group in Quang Binh, hold a drum-beating festival on the sixteenth day of the first lunar month to welcome the new moon."
 bua_religion_desc: "The $bua_religion$ $common_folk_religion_desc$\n\nThe Bua religion is the traditional belief of the Bua-speaking peoples of southern Chad, such as the Bua, the Fanian and the Niellim, who live between the Chari River and the Guéra Massif."
 buton_religion_desc: "The $buton_religion$ $common_folk_religion_desc$\n\nButon is the pre-Islamic belief of the Wolio kingdom on Buton Island off southeast Sulawesi, whose small chiefdoms elected Wa Kaa kaa as their first ruler around the fourteenth century. The kingdom later turned to Islam under La Kilaponto."
 buyli_religion_desc: "The $buyli_religion$ $common_folk_religion_desc$\n\nBughli is the old religion of the Dagomba of Dagbon in northern Ghana. Before the descendants of Naa Gbewaa united the Dagomba under one king, each town was led by an earth priest, the tindana, who appeased the earth gods, the lesser gods and the idols. Festivals such as Bugum Chugu, the fire festival that opens the Dagomba lunar year, are traced back to this age.\n\nThe Yaa Naa's court moved to Yendi after Gonja attacks, and there Muslim Dyula and Hausa gathered around the king and said protective prayers for him; by 1788 Yendi was said to be larger than Kumasi and Salaga. The tindaamba nevertheless kept their ritual place beside the chiefs."
 cahita_religion_desc: "The $cahita_religion$ $common_folk_religion_desc$\n\nThe Cáhita religion is the traditional belief of the Cáhita peoples, the Yaqui, Mayo and Tehueco among them, who farmed the river valleys of Sonora and Sinaloa. Jesuit missionaries recorded them in detail from the seventeenth century and counted five main nations: the Sinaloa, Ocoroni, Zuaque, Mayo and Yaqui.\n\nThey worshipped the forces of nature, the wind, the water, the earth, the sun and the sea, and made offerings to them for good harvests and abundant fishing. Above all these forces they believed in something superior that was responsible for all of creation.\n\nTheir ceremonies were simple and without elaborate ritual. Healers, who knew the medicinal herbs and treated the sick with strongly religious practices, held great prestige, and the Jesuits called them both sorcerers and political leaders."
 calvinist_desc: "Named after John Calvin, $calvinist$ is a significant branch of Protestantism rooted in the principles of simplicity in worship and the supremacy of the Holy Bible. Its doctrine emphasizes predestination, asserting that God has preordained the destiny of all creation.\n\nCalvinism, or Reformed Christianity, grew out of the Swiss Reformation of Huldrych Zwingli and Heinrich Bullinger. The Frenchman John Calvin published his Institutes of the Christian Religion in 1536 and made Geneva its centre. Worship is kept free of images, Christ is present in the Eucharist spiritually rather than bodily, and congregations are ruled by pastors and elected elders.\n\nCalvinism spread widely after 1550. The Heidelberg Catechism was drawn up in 1563, Queen Jeanne d'Albret of Navarre publicly turned Calvinist in 1560, and the French Huguenots fought the Wars of Religion from 1562 to 1598. The Dutch Reformed Church adopted its standards in 1571, and the Synod of Dort in 1619 condemned the Arminians on predestination."
 catharism_desc: "$catharism$ is a dualist movement that believes in the existence of two Gods: a benevolent God of Heaven and a malevolent counterpart. Its adherents follow an ascetic lifestyle, holding that souls are trapped in physical bodies as part of a cosmic struggle. Spiritual purification, achieved through strict discipline, is seen as the only path to salvation.\n\nCatharism appeared in the Rhineland, northern France, the Languedoc and northern Italy in the twelfth century; its first confirmed report comes from Cologne in 1143. The Cathars, named from the Greek word for the pure, probably drew on the Bogomils of the Balkans.\n\nSouls were reborn until freed. Only the Perfect, who received the consolamentum, were sure of returning to God.\n\nInnocent III proclaimed the Albigensian Crusade in 1208, the crusaders marched in 1209, and by 1244 Catharism was driven underground in the Languedoc. The Inquisition hunted the survivors, who lasted there until about 1325 and in the Italian cities into the fourteenth century."
 catholic_desc: "Rooted in the Nicene Creed, $catholic$ is the largest denomination of $christian$ and is led by the Pope, who serves as the spiritual successor to Saint Peter. The Pope acts as both the head of the Church and a mediator in conflicts among $christian_ADJ$ rulers. Its doctrine and traditions have shaped much of the Western world's religious and cultural history.\n\nThe Pope is the bishop of Rome, and the Catholic Church holds its bishops to be successors of the apostles. In 1337 it was the faith of nearly all Latin Europe.\n\nWorship centres on the Mass, in which consecrated bread and wine become the body and blood of Christ. Its sacraments number seven. The schism of 1054 divided it from the Orthodox Church.\n\nThe popes lived at Avignon from 1309 to 1376, and rival claimants split the Church from 1378 until the Council of Constance of 1414–1418. Luther's Ninety-five Theses of 1517 took much of northern Europe out of its obedience; the Council of Trent, 1545–1563, led the Counter-Reformation, and Spanish and Portuguese missionaries carried the faith to the Americas and Asia."
 cebil_religion_desc: "The $cebil_religion$ $common_folk_religion_desc$\n\nCebil was the religion of the Atacameños, who farmed oases and herded llamas in the Atacama desert and highlands of what is now northern Chile, north-western Argentina and southern Bolivia. Its heart was the inhaling of cebil, a hallucinogenic snuff laid on carved tablets and drawn in through a tube.\n\nShamans used it to divine and to reach the gods, and the one who inhaled was thought to take on the power of birds, felines and snakes. The tablets spread under the influence of Tiwanaku between 900 and 1200.\n\nThe Atacameños believed in many gods who lived on the volcano Licancabur, and in a life after death. After Topa Inca Yupanqui conquered them in the fifteenth century they adopted the Inca sun cult. Diego de Almagro's Spaniards arrived in 1536."
 chango_religion_desc: "The $chango_religion$ $common_folk_religion_desc$\n\nThe Changos were a loose group of fishing peoples who lived along the Pacific coast from southern Peru to north-central Chile, in the desert country of Atacama. Highlanders called the coastal fog camanchaca, which gave the Camanchacos their name, and the Spaniards later called them Changos. They hunted sea lions and fished from rafts of sea-lion hide, and their way of life grew out of the old Chinchorro tradition.\n\nTheir beliefs are known only in outline. The sea was revered as Mama Cocha, and the dead were buried with their fishing and hunting gear, which suggests a firm belief in a life after death."
 chanka_religion_desc: "The $chanka_religion$ $common_folk_religion_desc$\n\nThe Chanka were a farming people of Andahuaylas and the Ayacucho highlands of Peru, whose chiefdoms formed a loose confederation. Their rulers were two chiefs, the Uscovilca of the Hanan Chanka and the Ancovilca of the Urin Chanka, and the cult of the ancestors gave this religion its name.\n\nThe Chanka said they came from two lakes in what is now Huancavelica. Uscovilca was said to be preserved as a mummy that was venerated at the capital Huaman Karpa until Inca times. Warriors carried the mummies of their grandfathers on their shoulders into battle, painted their faces and shrieked as they fought, and their god was a feline.\n\nIn 1438 the Chanka attacked Cusco and were defeated by the Inca prince Cusi Yupanqui, who later became Pachacuti. The Hurin Chanka submitted to the Incas."
 cheke_holo_religion_desc: "The $cheke_holo_religion$ $common_folk_religion_desc$\n\nCheke Holo is the traditional belief of the Cheke Holo-speaking people of Santa Isabel, also called Maringe, in the Solomon Islands. Alvaro de Mendana's Spaniards landed on the island in 1568, the first European landing in the archipelago, and built a small boat there to chart the neighbouring seas."
 chibcha_religion_desc: "The $chibcha_religion$ $common_folk_religion_desc$\n\nThe Chibcha religion is that of the Muisca, who lived in the central highlands of the Colombian Andes before the Spanish conquest. The supreme being was Chiminigagua, who created light and the Earth but was not worshipped directly; worship went instead to the moon goddess Chía and her husband Sué, the sun god.\n\nThe Muisca made offerings at lakes such as Guatavita, and at the Sun Temple of Suamox. Priests performed sacrifices, sometimes of people. In one tale the goddess Huitaca, who taught pleasure, music and dance, rebelled against the culture hero Bochica and was turned into an owl, or into the moon.\n\nAfter Gonzalo Jiménez de Quesada's conquest of the 1530s, the gold-adorned temples fed the legend of El Dorado. The last public ceremony took place at Ubaque on 27 December 1563."
 chichimecah_religion_desc: "The $chichimecah_religion$ $common_folk_religion_desc$\n\nThe Chichimec religion is the traditional belief of the peoples the Nahua called Chichimeca, the hunters and farmers of the northern highlands, among them the Otomi of Metztitlán. Mixcoatl, the Cloud Serpent, god of the hunt and the Milky Way, was patron of the Chichimecs and the Otomi, and as Camaxtli the central god of Tlaxcala and Huejotzingo. Metztitlán, an Otomi state the Aztecs never conquered, honoured the lunar deity Zäna.\n\nSpanish writers of the late 16th century said the Chichimecs worshipped no idols as their neighbours did, though they made animal sacrifices. The Chichimeca War, begun in 1550, ended in peace treaties and the absorption of the native peoples into New Spain."
 chincha_religion_desc: "The $chincha_religion$ $common_folk_religion_desc$\n\nThe Chincha were a seafaring and trading people of the Chincha Valley on the coast of Peru, whose kingdom flourished in the fourteenth and fifteenth centuries. They believed themselves descended from jaguars, which gave them their warlike and domineering nature, and worshipped a jaguar god.\n\nTheir chief god was Chinchaycamac, who held a rich oracle near the great adobe pyramids of La Centinela. Their merchants sailing the Pacific revered a star called Chundri, perhaps used for navigation, and the gods were said to have come from an island sanctuary called Urpihuachay, She Who Bears Doves.\n\nThe Incas under Pachacuti brought Chincha into their empire peacefully, but its lords kept much of their autonomy. In 1532 the lord of Chincha was carried in a litter to meet Pizarro at Cajamarca, where he was killed."
 chukchi_shamanism_desc: "The $chukchi_shamanism$ $common_folk_religion_desc$\n\nChukchee shamanism is the traditional religion of the Chukchi, the reindeer herders of the inland tundra and the sea-mammal hunters of the coast in far north-eastern Siberia. They hold that every object, living or not, has a spirit, and some of their myths describe a dualistic cosmos.\n\nThe Chukchi often lacked formal political structures, yet had a formal hierarchy of the cosmos. A shaman once told the ethnographer Bogoraz that lamps walk about, house walls have voices, and even the shadows form tribes with lands of their own.\n\nShamans were said to be called by spirits, dreams or omens. In ritual they fell into trances, sometimes helped by hallucinogenic mushrooms, and were believed able to fly, drive out evil spirits and heal. Some took on a woman's dress and role and could even marry men."
 chutia_religion_desc: "The $chutia_religion$ $common_folk_religion_desc$\n\nChutia religion is the folk religion of the Chutia, the Bodo-Kachari people of the kingdom around Sadiya in upper Assam. They worshipped a primordial male deity, Kundi-Mama, and a primordial female deity, Kechai-khaiti, whose worship was officiated by the priestly section later identified as the Deori.\n\nIts rites were tribal-tantric. In the Deo-kuber ceremony, held in the days of the Chutia kings for the welfare of the state, earthen lamps were lit for Kuber and Kundi, and a pair of ducks was sacrificed to the deities Gira-Girasi. Village deities such as Dangoria were honoured at the trees where they were said to dwell.\n\nFrom the late fourteenth century inscriptions show the kings turning Vaishnava, and a section of the Chutia accepted Hinduism. After the Ahoms absorbed the kingdom in 1523, those who had not were initiated into Ekasarana in the seventeenth century."
 coahuilteco_religion_desc: "The $coahuilteco_religion$ $common_folk_religion_desc$\n\nThe Coahuilteco religion is the traditional belief of the Coahuiltecans, a loose network of hunter-gatherer bands who roamed Coahuila, Tamaulipas and southern Texas. On occasion they gathered in large numbers for all-night dances called mitotes, taking peyote as medicine.\n\nFrom 1580 Carvajal, governor of Nuevo León, and his men raided the Rio Grande bands for slaves. In 1718 Spain founded Mission San Antonio de Valero, later the Alamo, to evangelize them, and with four more missions it held about 1,200 Coahuiltecans and other Indians at its height. Many fled, smallpox from 1739 cut the population further, and the San Antonio missions were secularized in 1824."
 cwezi_religion_desc: "The $cwezi_religion$ $common_folk_religion_desc$\n\nThe Cwezi religion is the veneration of the Cwezi, a semi-legendary clan said to have been the second ruling dynasty of the empire of Kitara in the African Great Lakes region. The Rutara peoples honour them as ancestor spirits, and tradition says the spirits left their mark on the region's hills and lakes.\n\nLegend names Mubende as their first capital and calls them skilled blacksmiths, and their shrines are linked with iron tools and anvils. Their spirit mediums opposed later royal dynasties, such as the Biito clan of cattle herders."
 degar_religion_desc: "The $degar_religion$ $common_folk_religion_desc$\n\nThe Degar religion is the traditional animist faith of the Degar, or Montagnards, the Austronesian- and Austroasiatic-speaking highland peoples of Vietnam’s Central Highlands, among them the Jarai, Rade and Bahnar. Ritual buffalo sacrifice was among their customs, and contact with Europeans began in the sixteenth century with Portuguese missionaries."
 dene_religion_desc: "The $dene_religion$ $common_folk_religion_desc$\n\nThe Dene are the Athabaskan-speaking peoples of northwestern Canada, from the Mackenzie Valley to the Yukon. The Gwichʼin, one of their nations, tell that their people and the caribou were once a single being, and that animal anchors both their stories and their subsistence."
 dene_shamanism_desc: "The $dene_shamanism$ $common_folk_religion_desc$\n\nAthabaskanism is the traditional animism and shamanism of the Athabaskan peoples of interior Alaska, whom the Tanana, Gwichʼin and others represent. All creatures and some objects were thought to have active spirits, and an animal whose spirit was offended might stay away from the hunters. Strict rules therefore governed how animals were killed and treated; a man who killed a wolf, for example, should apologise to it before touching the body.\n\nThe shaman was the central religious figure. He or she guarded against evil spirits, diagnosed illness and restored the sick, and could read a scorched shoulder blade to find game when it was scarce.\n\nA winter potlatch, above all the funeral potlatch, marked the dead man’s departure from the world. Russian Orthodox, Catholic and Anglican missionaries converted the Athabaskans, and shamanic practice was suppressed."
 dene_totemism_desc: "The $dene_totemism$ $common_folk_religion_desc$\n\nAmong the Tanana Athabaskans of interior Alaska, society was divided into eight or nine matrilineal clans grouped in two exogamous halves, Raven and Sea Gull (or Wolf), and a person had to marry someone from the opposite half."
 dimasa_religion_desc: "The $dimasa_religion$ $common_folk_religion_desc$\n\nDimasa religion is the ancient animist and shamanic faith of the Dimasa, the Kachari people of the Dhansiri valley and the Assam hills. A typical village had neither idols nor temples; the earth, air and sky were thought to be filled with unseen spirits called Madai.\n\nSix ancestral gods held authority over the whole country as area gods, and their unstructured shrines, called Daikho, were widely held to number twelve; the name means house of the god. Kechai-khaiti was the tutelary goddess of the Kacharis, with a shrine at Sadiya.\n\nIn 1520 King Khorapha struck at Dimapur the first Hindu-style coin of the Brahmaputra valley, naming the goddess Chandi. In the nineteenth century the Dimasa of the Cachar plains turned to Hinduism while the hill Dimasa kept the old faith."
 dogon_religion_desc: "The $dogon_religion$ $common_folk_religion_desc$\n\nDogon villages cling to the Bandiagara escarpment of Mali, where the people by tradition retreated to escape Islamization, reaching the Sanga region in the 1400s. They hold that a single creator, Amma, made the world, and that the Nommo, twin water spirits shown as human above and serpent below, are ancestral beings.\n\nThe dead are honoured with mask dances. Every sixty years the Sigui festival marks the first death of an ancestor, who died in the form of a snake, with a new great mask.\n\nBlacksmiths, said to descend from the first smith, mediate between the living, the ancestors and Amma. Muslim slavers and jihadists treated the Dogon as unbelievers who could be raided, and the cliffs sheltered their villages."
 doi_wahire_religion_desc: "The $doi_wahire_religion$ $common_folk_religion_desc$\n\nThe Xerente, who call themselves Akwê, live on the right bank of the Tocantins River in central Brazil. Their dualist cosmology rests on a creation myth centred on a pair of mythic heroes dwelling in the sun and the moon.\n\nThe same pair divides the people. Society is split into two exogamous moieties, the sun moiety Doí and the moon moiety Wahirê, each made up of three or four clans, and a man must marry into the other half. The Xerente laid out their villages in a semicircle. Jesuit missionaries and the bandeirante expeditions of the interior reached them in the 1600s."
 dongba_religion_desc: "The $dongba_religion$ $common_folk_religion_desc$\n\nThe Nakhi people of northwestern Yunnan, around Lijiang, also call their priests dongba. Their faith is held to descend from the Bön religion of Tibet, and by Nakhi tradition it came to Yunnan with a Bön shaman from eastern Tibet, Dongba Shilo.\n\nDongba priests perform the rites that propitiate the many gods and spirits of nature, among them sacrifices to Heaven and funerals. At the core of the faith is the belief that humans and nature are two half-brothers born of two mothers and one father. The priests alone kept the pictographic Dongba script.\n\nLijiang, the Nakhi heartland, submitted to Khubilai Khan in 1253, and from 1382 its hereditary Mu chieftains ruled it under the Ming until the Qing replaced them in 1723. Nakhi temples mix Dongba and Buddhist art."
 donyi_polo_religion_desc: "The $donyi_polo_religion$ $common_folk_religion_desc$\n\nThe Tani peoples of Arunachal, the Adi, Galo, Nyishi, Apatani, Tagin and Mishing, all trace descent from the ancestor Abotani, and the name Donyi-Polo, meaning Sun-Moon, was later given to their animist beliefs. These were a local oral tradition of myths, with no scripture, priestly hierarchy or fixed shrines.\n\nShamans called nyibu performed the rites in village or household, raising an altar only when needed and taking it down afterwards. Donyi, the Sun, was addressed as Mother and Polo, the Moon, as Father and were called on to witness the truth and punish liars. The Minyong and Padam Adi told of a creator, Sedi, whose eyes became the Sun and Moon; the Galo called him Jimi."
 dreamtime_religion_desc: "The $dreamtime_religion$ $common_folk_religion_desc$\n\nIn the Aboriginal Australian worldview that the Warlpiri call Jukurrpa and English speakers the Dreaming, the land was made and inhabited by ancestral beings, often of heroic size or with supernatural powers. Every place and creature takes its meaning from its origin in the Dreaming, and places such as Uluru hold special potency. The Dreaming is not a distant past but a continuing reality, which the anthropologist William Stanner called everywhen.\n\nA person may own a Dreaming of their country, such as the kangaroo or honey ant, and through it their ancestry runs as one unbroken cycle from which all knowledge comes. The English word Dreamtime renders an Arrernte word that some scholars think is closer to eternal or uncreated."
 druzism_desc: "Although emerging from $ismaili_school$, $druzism_ADJ$ people do not consider themselves $muslim_ADJ$. Besides its obvious influence from $muslim$, it also gets influence from other Abrahamic and non-Abrahamic religions, giving rise to a distinct faith with emphasis on esotericism and the Cosmic Mind which all souls reunite to after many reincarnations.\n\nThe Druze faith arose in Fatimid Cairo in 1017–1018, when the Ismaili preacher Hamza ibn Ali began to teach a doctrine of the unity of God under the patronage of the caliph al-Hakim. It holds that God deals with the world through emanations, with a Cosmic Mind among them, and that the soul is eternal.\n\nThe faith keeps no clergy; only a few initiates are admitted to its secrets, and since 1046 it has been closed to converts. The Druze settled in Mount Lebanon and southern Syria. In 1305 the Mamluks defeated them at Keserwan and forced them to outward Sunni conformity, and Ottoman expeditions such as that of 1585 attacked them."
 dua_nggae_religion_desc: "The $dua_nggae_religion$ $common_folk_religion_desc$\n\nThe Lio, the people of the Ende-Lio region in central Flores, say that their first men came down from Mount Lepembusu, and each village was led by chiefs called mosalaki. Above all stood Du'a Ngga'e, the supreme god, to whom offerings were made in the ritual ground called kanga, around a standing stone. Below him were Nitupa'i, the most feared of the spirits, and the ancestors, who had to be honoured.\n\nEach year after the field rite ka po'o the mosalaki and farmers shared a meal to feed the ancestors and ward off pests and disease. From the sixteenth century the spice trade brought Indian and Portuguese influence to Flores, and the Lio later turned mostly to Catholicism and Islam."
 ebore_religion_desc: "The $ebore_religion$ $common_folk_religion_desc$\n\nEbore belongs to the Gonja, a Guan-speaking people of northern Ghana whose kingdom was founded in 1675 by Sumaila Ndewura Jakpa. Its commoners were animists, while the ruling class and traders were Muslim, and Islam spread among the Gonja in the 1700s."
 emit_religion_desc: "The $emit_religion$ $common_folk_religion_desc$\n\nThe Jola of Senegal and the Gambia recognised a single God, Emit or Ata Emit, the master of the universe, linked to the sky, the rain and the turning year. They honoured charms and sacred precincts without worshipping them, and held that the spirits called Bakin or Eneerti guard families, villages and rice fields, even against conversion to Islam and Christianity.\n\nFuneral rites were essential, for without them a soul could not reach the creator and join the ancestors. Most Jola lived without chiefs, though some, as at Oussouye, had a king who served more as priest than ruler. Some accepted Islam only after the Soninke-Marabout war of the 1800s."
 enggano_religion_desc: "The $enggano_religion$ $common_folk_religion_desc$\n\nThe Enggano people of Enggano Island, off the southwest coast of Sumatra, were first met by Portuguese explorers in the early 1500s. Their faith combined animism, totemism and the worship of ancestors, and on the island these beliefs survived long after contact."
 erzya_religion_desc: "The $erzya_religion$ $common_folk_religion_desc$\n\nThe Erzya are a Mordvinic people of the middle Volga who speak a Uralic language. Their tradition names Nishke, or Nishkepaz, as the originating god.\n\nIn Erzya myth the high gods hatched from an egg. Ange Patiai is the mother of the gods, followed by the Sun god Chipaz, who begot Nishkepaz, the earth god Mastoron Kirdi and the wind god Varmanpaz. From Chipaz and the Harvest Mother Norovava came Mastorpaz, lord of the underworld.\n\nThe Mordvins fell under the Golden Horde in the thirteenth century, and after Russia took Kazan in 1552 they were all Russian subjects. Russian Orthodoxy converted them by force, notably in the seventeenth century, yet a few villages kept the old faith."
 eso_religion_desc: "The $eso_religion$ $common_folk_religion_desc$\n\nEso belongs to the Kabye, mountain farmers of northern Togo. Their young men were initiated into adulthood by a week of seclusion, a pilgrimage over three mountains, the evala wrestling festival and finally circumcision."
 fang_religion_desc: "The $fang_religion$ $common_folk_religion_desc$\n\nThe Fang, forest farmers and hunters who spread across Rio Muni, northern Gabon and southern Cameroon, know their supreme creator god as Mebege, also called Nzeme. In one Fang tradition he was alone but for a spider, Dibobia, who urged him to make the earth.\n\nMebege fashioned an egg, which Dibobia set in the sea, and from it hatched three deities: Zame, the firstborn, linked to the sun, his sister Nyingwan, linked to fertility and the moon, and the youngest, Nlona, who stood for evil. Fang religious life centred on reverence for ancestors, whose skulls and bones were kept in wooden boxes guarded by Byeri reliquary figures."
 fomba_gasy_religion_desc: "The $fomba_gasy_religion$ $common_folk_religion_desc$\n\nFomba Gasy means the Malagasy way, and it has been passed down in oral tales among the peoples of Madagascar. It has no single church.\n\nIts creator is Zanahary, the sky god who gives life and receives the souls of the dead, while the earth god Ratovantany shapes human bodies from clay and takes them back at death. Ancestors are generally a kindly force, but neglected spirits can turn into harmful angatra, so bodies are rewrapped in fresh cloth in the funeral rite of famadihana.\n\nThe Merina kings of Imerina claimed blood of the Vazimba, the island's first inhabitants, through Andriamanelo, whose mother Rafohy was a Vazimba queen. His son Ralambo, who ruled from 1575 to 1612, honoured the sampy, royal amulets that protected the realm."
 formosan_religion_desc: "The $formosan_religion$ $common_folk_religion_desc$\n\nThe beliefs of the Austronesian peoples of Taiwan were never one system: every people kept its own spirits, gods, symbols and myths. The Paiwan and other southern peoples revered the hundred-pace snake and carved its diamond pattern into their designs.\n\nAmong many of the plains peoples only women, called inibs, could speak to the spirit world. The Siraya honoured the ancestral spirit Alid, represented by water jars on household altars. Under Dutch rule from 1624 the inibs were removed from the villages to clear the way for missionaries.\n\nAfter the Zheng regime of 1662 and the Qing conquest of 1683, Han settlers brought Taoism and Buddhism to the plains, and many Siraya took up Han practices. Their fertility spirit Ali-zu entered the local Han pantheon."
 geno_religion_desc: "The $geno_religion$ $common_folk_religion_desc$\n\nGeno belongs to the Fula herders who had not taken up Islam, which most Fula embraced early and made a mark of their identity. As late as the early 1700s these non-Muslim Fula, called Pulli, still lived in Futa Jallon, where Muslim Fula rose against them and the Jallonke and founded the imamate of Timbo."
 ghari_religion_desc: "The $ghari_religion$ $common_folk_religion_desc$\n\nGhari belongs to the Ghari-speaking people of western Guadalcanal in the Solomon Islands, an island called Isatabu by its own people, which Alvaro de Mendana's Spaniards first charted in 1568. Later, the Vaturanga dialect of Ghari was widely used in missionary and liturgical translations."
 godala_religion_desc: "The $godala_religion$ $common_folk_religion_desc$\n\nThe Godala are a Sanhaja Berber tribe of the Atlantic coast of what is now Mauritania, who traded along the lower Senegal. Like other Berber peoples, they inherited an old body of beliefs in which sun and moon were revered, spirits dwelt in caves and springs, and the dead were honoured as ancestors.\n\nBy the middle of the eleventh century the Godala were only superficially Muslim and still kept many pagan practices. Their chief brought the preacher Abdallah ibn Yasin to teach them orthodox Sunni Islam, and the Godala joined the Almoravid alliance.\n\nThey rebelled against its strict rule more than once, and in 1056 they killed the Lamtuna commander Yahya ibn Umar. By 1337 the old rites survived only as remnants beside Islam."
 goma_religion_desc: "The $goma_religion$ $common_folk_religion_desc$\n\nGoma belongs to the Tobelo of Halmahera, and is marked by shamanism and the cult of spirits. When Tomé Pires wrote his Suma Oriental around 1515, the Jailolo kingdom there was still largely heathen, although its king was already a Muslim."
 gorontalo_religion_desc: "The $gorontalo_religion$ $common_folk_religion_desc$\n\nThe traditional faith of the Gorontalo people of northern Sulawesi gave way to Islam from about 1525, in the reign of King Amai. The Gorontalo kingdoms became a centre of Islam in the east of the archipelago, and in 1673 Gorontalo came under the Dutch East India Company."
 gos_religion_desc: "The $gos_religion$ $common_folk_religion_desc$\n\nGos are the spirits of the Vilela, a hunting and gathering people of the Gran Chaco in what is now north-western Argentina. In the fifteenth century the Vilela lived in northern Tucumán and Santiago del Estero and eastern Salta, living on peccary, carob and honey.\n\nAfter the Spanish conquest of Tucumán they moved east into the Chaco, and later the horse-riding Guaycuru pushed them still nearer the Paraná. Jesuits gathered the Vilela into missions from the 1730s until the order's expulsion in 1767.\n\nIn Vilela mythology the gos were the owners of nature. They could harm people, and Jesuit missionaries therefore called them devils, but they could also heal. Traditionally the Vilela shamans cured the sick by invoking the gos in songs whose power made them guarded knowledge."
 gosain_religion_desc: "The $gosain_religion$ $common_folk_religion_desc$\n\nGosain is the spirit worship of the Paharia hill peoples of the Rajmahal Hills, the Sauria and Mal Paharia. The name belongs to a host of local spirits tied to every part of the world around them, male and female. One is the Gomo Gosain of the house pillar, who gives health.\n\nThe chief shrine is the Manjhi Than, where the most important male Gosain lives as five black stones and receives sacrifices twice a year. Female Gosain are fed black fowl and pigs at their own shrines. Ancestors are feasted by the village priest and are held to join the sun god Dharmer Gosain once satisfied.\n\nIn the later eighteenth century the Mal Paharia fought the East India Company until the pacification of 1778. From the 1830s Santal settlers moved into their hills."
 great_plains_shamanism_desc: "The $great_plains_shamanism$ $common_folk_religion_desc$\n\nWakanism is the sacred outlook of the Great Plains peoples, taking its name from the Siouan word wakan, ‘holy’. Among the Lakota, Wakan Tanka denoted a group of sacred powers whose ways were hidden from men, and the Omaha, Osage and other Siouan peoples knew it as Wakanda.\n\nThe Pawnee, who speak a Caddoan language, show the same star-centred religion in its fullest form. They held that the Morning Star and the Evening Star bore the first woman, and the Moon and the Sun the first man, and they offered the stars maize.\n\nThe Skidi Pawnee sacrificed a captive girl to the Morning Star in a rite meant to bring fertile fields. Their chief Knife Chief ransomed captives from it, and in 1817 his kinsman Petalesharo cut a Comanche girl loose from the scaffold."
 guanche_religion_desc: "The $guanche_religion$ $common_folk_religion_desc$\n\nThe Guanche religion is the belief system of the native Canarians, best recorded on Tenerife, where the supreme god was Achamán, the Gleaming One. His consort Chaxiraxi, who bears the sky, was later identified with the Virgin of Candelaria, whose image appeared on the beach at Güímar. The creator god was Acorán on Gran Canaria and Abora on La Palma.\n\nThe Guanches held that the evil Guayota, appearing as a great shaggy dog, dwelt inside Mount Teide. They revered the sun, Magec, swore oaths by it, and buried the dead with offerings, mummifying them on Tenerife. The beliefs are known only from accounts left by the Christian conquerors of the fifteenth century."
 guasave_religion_desc: "The $guasave_religion$ $common_folk_religion_desc$\n\nThe Guasave, also called the Tamazula, were a coastal people of northwestern Sinaloa who lived among the marshes and estuaries on fish, clams and wild fruit, and spoke a language unlike those of their Sinaloan neighbours. This is the traditional belief of that people."
 hani_religion_desc: "The $hani_religion$ $common_folk_religion_desc$\n\nThe traditional religion of the Hani, a Tibeto-Burman people of the Ailao Mountains in southern Yunnan, is polytheist, with nature and soul worship and a special reverence for ancestral spirits. Its priests are of three kinds: those who direct the main celebrations, the beima, who perform exorcisms and magic, and the nima, men or women, who make predictions and give medicinal herbs.\n\nThe past is kept in oral literature: a creation myth, the flood story, and the epic of the ancestors who crossed the river, chanted at festivals and sacrifices. Each Hani learns to recite the names of his ancestors from the first Hani family down to himself."
 hellenism_religion_desc: "The $hellenism_religion$ $common_folk_religion_desc$\n\nHellenism is the attempt to revive the worship of the ancient Greek gods. Historians think the old religion had died out by the ninth century. Its first advocate was the late Byzantine philosopher Georgios Gemistos Plethon, who taught in Mystras, in the Despotate of the Morea, and declared in a speech that the Greeks were Hellenes by race and culture.\n\nIn his last work, the Nomoi, or Book of Laws, Plethon rejected Christianity for the worship of the Olympian gods, mixed with the wisdom of Zoroaster and the Magi. Zeus stood at the head as the self-father of all things, with the other gods ranked in orders beneath him.\n\nPlethon died in 1452 or 1454. In 1460 the Patriarch Gennadius II, once his pupil, burned the only copy, though Gennadius's letter summarising it survives."
 hindu_desc: "A collection of different beliefs rather than a unified religion, $hindu$ is often considered the oldest religious tradition in the world. All its beliefs and practices understood as explanations of the $dharmic$, the cosmic order, it stems from the ancient Vedic literature. Being so varied, it also contains a multitude of gods, although not all of them are equally venerated or even recognized by all $hindu_ADJ$ practitioners, depending on their particular beliefs and orientations. The four main branches of $hindu$ are $vaishnavism$, $shaktism$, $shaivism$, and $smartism$.\n\nHinduism has no founder. Believers uphold dharma through ritual and righteous living as taught in the Vedas, and its scriptures include the Upanishads, the Puranas and the epics Ramayana and Mahabharata. It speaks of karma, the cycle of rebirth and liberation from it, called moksha. Vaishnavism centres on Vishnu, Shaivism on Shiva and Shaktism on the Goddess.\n\nIn 1337 Hinduism was the religion of many kingdoms, from the Hoysalas of Karnataka to Majapahit in Java. The Delhi Sultanate had raided and annexed Deccan kingdoms, and in 1336 the brothers Harihara I and Bukka Raya I founded Vijayanagara as a Hindu power in the south. Between about 1250 and 1750 the Bhakti movement of personal devotion to a chosen god grew ever more prominent, though the Portuguese inquisition at Goa in 1560 persecuted Hindus."
 hmongism_desc: "The $hmongism$ $common_folk_religion_desc$\n\nKev Dab Qhuas, the way of spirit worship, is the traditional religion of the Hmong, or Miao, of southwestern China. It is animistic, built on reverence for unseen spirits called dab.\n\nIn the oral epics of the Qiandong Miao, Mother Butterfly is the ancestral mother: born inside a sacred maple, she laid twelve eggs, from which came the first man, Jang Vang, and the Thunder God. Shamans are chosen by the spirits, not by inheritance, and ride a spirit horse, represented by the shaman's bench, into the spirit world to diagnose and heal.\n\nA household altar to the spirit of good fortune receives rice, chicken and joss paper. Under Ming and Qing rule Miao risings were put down, among them the rising of 1735 against forced assimilation, which ended in 1738."
 hussite_desc: "Founded by Jan Hus, the $hussite_ADJ$ Church emerged as a proto-Protestant movement in $BOH$, blending elements of the $BYZ_ADJ$ Rite with the teachings of John Wycliffe. It emphasized communion under both kinds and the importance of scripture over Church tradition.\n\nHussitism followed Jan Hus, a Czech preacher influenced by John Wycliffe, who held that Scripture stood above Church tradition and that the laity should receive communion in both bread and wine. The Council of Constance burned Hus in 1415, and Bohemia answered with an uprising. The chalice became the emblem of the movement, whose members were called Calixtines or Utraquists.\n\nThe moderates set out their programme in the Four Articles of Prague of 1420. The radical Taborites followed Wycliffe further. Under Jan Žižka the Hussites beat back five crusades in 1419–1434.\n\nIn 1434 the Utraquists and Catholics crushed the Taborites at Lipany, and the Peace of Kutná Hora in 1485 gave Catholics and Utraquists equal rights in Bohemia. Catholicism was reimposed after the Battle of White Mountain in 1620."
 ibadi_desc: "$ibadi_school_desc$\n\nThe Ibadis take their name from Abd Allah ibn Ibad of Basra, who around 683 rejected the extremists among the Kharijites and argued that Muslim opponents were guilty of ingratitude, not idolatry, so that believers could live among them. Ibadis hold that the imam is elected by the community and must be deposed if he sins.\n\nMissionaries from Basra carried the school to Oman, North Africa and East Africa. In 1337 the Nabhani kings ruled inland Oman, leaving the elected imamate a largely symbolic role, while in North Africa Ibadis lived on in the Mzab and the Nafusa Mountains. In 1624 the Yaruba imams replaced the Nabhanis and drove the Portuguese from Muscat; the Al Bu Said took over in 1744."
 ijaw_religion_desc: "The $ijaw_religion$ $common_folk_religion_desc$\n\nIjaw religion is the traditional belief of the Ijaw, or Izon, fishing peoples of the Niger Delta, who were trading along the coast by the 1400s. Ancestors are venerated, and the Owuamapu, water spirits who share human strengths and faults, hold a central place: people are held to live among them before birth, and prayer keeps the living in their favour.\n\nDivination called Igbadai questions the recently dead about the cause of their death. Each year festivals lasting several days honour the spirits, and masked dancers are thought to be possessed by the spirits they represent. Egbesu, whose totems are the leopard, panther and lion, is revered as a god of justice."
 imunu_religion_desc: "The $imunu_religion$ $common_folk_religion_desc$\n\nImunu is the name that Papuan peoples traditionally gave to a power that pervades things, including ritual objects. The Papuans are a Melanesian people of at least 240 groups, each with its own language, living mainly on sago, hunting, fishing and small gardens.\n\nIn masked ceremonies imunu takes visible form, and the masks mostly show humans or ancestors rather than plants or animals. Ancestors matter in this belief but are not necessarily revered, and placating their spirits is a recurring theme. Fear of sorcery and witchcraft was widespread. Before hunting or war, spirits were called on to advise and protect the men, and gope boards were thought to hold the spirits of powerful warriors or to guard the village."
 inti_desc: "$inti_god$, together with $viracocha$, are the main gods that guide and protect the people of the $andes_region$\n\nThe Inca elite claimed descent from Inti, who was shown as a golden disk with a face and rays; his temple at Cusco was the Qorikancha, where a field of golden maize stood. Wiraqucha was said to have made humanity on an island in Lake Titicaca and withdrawn.\n\nAlongside Inti the state sacrificed to Illapa of thunder, to the Moon, Mama Killa, and to the Earth, Pachamama. Sacred places and objects called wak’a, mountains above all, lay across the Andes, with festivals such as the Inti Raymi at the June solstice. Dead rulers were mummified and honoured as if alive, until in 1559 the Spaniard Polo de Ondegardo seized them in Cusco."
 inuit_religion_desc: "The $inuit_religion$ $common_folk_religion_desc$\n\nInuit religion is the traditional belief of the Inuit, who hunt along the Arctic and subarctic coasts from Alaska across northern Canada to Greenland. It had no formal clergy or church, and varied a good deal between communities.\n\nPrey animals were treated as beings whose souls had to be propitiated, and taboos around hunting, birth and death kept the spirits content. Many peoples revered Nuliajuk, or Sedna, mistress of the sea animals, who withheld game when taboos were broken; the angakut, shamans who held helper spirits, travelled to her to plead for it.\n\nEuropean ships began meeting Inuit in the northeast of Canada in the sixteenth century, and Christianity spread slowly. In Greenland the angakut kept practising, sometimes in secret, and in 1746 King Christian VI wrote to the Greenlanders to complain of them."
 ipok_religion_desc: "The $ipok_religion$ $common_folk_religion_desc$\n\nIpok is the traditional belief of the Melanau, the river and coast people of central Sarawak, who worshipped spirits called Ipok. Their land was long under Brunei's influence, and the Melanau who later turned to Islam gave up the old rites, though the Kaul festival still recalls them."
 iroquoian_totemism_desc: "The $iroquoian_totemism$ $common_folk_religion_desc$\n\nOrendism takes its name from orenda, a term scholars have used for a power that the Iroquoian peoples were thought to see in people, songs and natural things. It stands here for the traditional religion of the Haudenosaunee, among them the Mohawk, Oneida and Seneca, of the Northeastern Woodlands.\n\nIn their creation story the ruler Hawëni:yo’ lets the pregnant Sky Woman fall from a floating island above the clouds. Birds bear her down to the Turtle, on whose back Muskrat’s mud grows into the earth. She dies giving birth to the twins Hahgwehdiyu, the Good Mind, and Sawiskera, the Flint, who fought over the world.\n\nEach village had a storyteller, and tales were not told in summer. In the late 1700s the Seneca prophet Handsome Lake gathered elements of the old religion into his Code."
 irritila_religion_desc: "The $irritila_religion$ $common_folk_religion_desc$\n\nThe Irritila, or Laguneros, were the peoples of the lagoon country of the Coahuila and Durango border, around the Mayrán lagoon. They were more than a dozen tribes with different languages who communicated in Nahuatl, and the Jesuits were authorized to begin evangelizing them in 1594."
 isese_religion_desc: "The $isese_religion$ $common_folk_religion_desc$\n\nIsese is the traditional religion of the Yoruba, whose kingdoms of Oyo and Ife lay in what is now southwestern Nigeria. Its creation story tells how the supreme god Olodumare sent the orisha Obatala to make the earth; Oduduwa cast the soil on the primeval waters at Ife, so Ife remained the sacred source of Yoruba kingship.\n\nBelow Olodumare stand the orisha and the ancestors, who return as Egungun masquerades. Priests called babalawo consulted Orunmila through Ifa divination, drawing on 256 Odu, collections of verses.\n\nOyo made Shango, god of thunder and traditionally its third Alaafin, a royal cult. After Ilorin broke away and came under Muslim Fulani leaders, it destroyed Oyo-Ile in 1835. Yoruba captives carried across the Atlantic took the orisha to the Americas, where they became the roots of Candomblé and Santería."
 itaukei_religion_desc: "The $itaukei_religion$ $common_folk_religion_desc$\n\nItaukei religion is the traditional faith of the indigenous Fijians. Its supreme god was Degei, a serpent and the creator of the Fijian world, who judged the newly dead as they passed through the caves of Cibaciba or Drakulu. A few went to the paradise of Burotu; most were thrown into a lake to sink and be rewarded or punished.\n\nBelief was tied to descent from a spiritual ancestor, the vu, and groups who worshipped the same god, the tauvu, were held to share an origin. Families, the tokatoka, formed clans, the mataqali, which formed tribes, the yavusa. The yavusa of one territory made up the vanua under a senior chief, whose spokesmen and advisers were priests, the bete."
 jai_religion_desc: "The $jai_religion$ $common_folk_religion_desc$\n\nThe Jai religion is the traditional belief of the Emberá, a riverside people of the Chocó of western Colombia and Panama, who deal with the jai, the spirits. These include the Wandra, mothers of the animals and plants who live at the river sources. Forest animals are held to be transformed souls of the dead.\n\nThe shaman, the jaibaná, is not hereditary but learns from an experienced teacher. By dealings with the jai he keeps up the hunt and the health of the community, and cures illness by driving out malignant spirits.\n\nIn myth, Caragabí made the first humans from clay borrowed from Tutruicá, and felled the tree Jenené, from whose root the sea sprang and whose branches are the rivers. In the late 1700s, pressed by the Spanish, many Emberá moved into Darién."
 jain_desc: "One of the oldest religions, $jain$ is an Indian $dharmic_ADJ$ religion focusing on attempting self-realization and liberation from the cycle of death and rebirth. It centers in non-violence and asceticism through the teachings of the #italic Tīrthaṅkara#!, the supreme preachers of the $dharma$, and it is divided in the Digambara and Śvetāmbara schools. Digambara, meaning 'sky-clad', is characterized by its rejection to attachment and possession of material goods, and thus its monks do not wear any clothes, and its iconography is more plain. Śvetāmbara, on the other hand, means 'white-clad' due to the white clothes of its monks, and has more equality between male and female monks, in opposition to the more male-oriented Digambara.\n\nThe Jains look to 24 tirthankaras, ford-makers who overcame the cycle of rebirth. The 23rd, Parshvanatha, is dated to about the eighth or seventh century BCE, and the 24th, Mahavira, was a contemporary of the Buddha who rejected the authority of the Vedas. Jain ethics rest on ahimsa, non-violence, anekantavada, the many-sidedness of truth, and aparigraha, non-possession. Because of non-violence Jains avoided farming and war, and many became merchants and bankers.\n\nUnder the Delhi Sultanate Alauddin Khalji, who ruled from 1296 to 1316, received Jain sages. Later Mughal emperors such as Akbar made grants to Jain pilgrimage sites, though Akbar also ordered Jain temples at Chittor destroyed in 1567."
 jama_religion_desc: "The $jama_religion$ $common_folk_religion_desc$\n\nThe Jama belief belongs to the Jama Coaque culture, which developed on the coast of Manabí in Ecuador between the Coaque and Jama rivers from about 355 BC until 1532. It has no written record and has been pieced together from its pottery by comparison with Mesoamerica and the north coast of Peru.\n\nThe cosmos had three levels, the sky, the earth and the underworld. Jama, the chief deity of the earth, has a human body and a reptile face, and is probably an iguana. A bat god of rain and the night sky haunts the underworld waters, and a death god is shown without arms or legs. The moon appears as an opossum.\n\nPriests who were also shamans served as go-betweens and carried out human sacrifice. The dead were buried in jars."
 jingpo_religion_desc: "The $jingpo_religion$ $common_folk_religion_desc$\n\nThe Jingpo, a Tibeto-Burman people of the Kachin Hills of northern Myanmar and neighbouring Yunnan, with the Zaiwa as one of their branches, followed an animist religion before Buddhism and Christianity arrived. They held that spirits reside everywhere and that these bring good or bad luck. All living creatures have souls, and rituals protect almost every activity, from planting crops to warfare.\n\nOne well-known spirit was Madai. Jingpo legend names Ningguanwa as a first ancestor, a cave-dweller and hunter who beat gongs and drums at his wedding to bring home his wife Burenzaren, the daughter of a dragon king.\n\nThe Jingpo and Zaiwa celebrate the great manau dance, in which dancers circle a central post. It is held around the fifteenth day of the first lunar month and again at the new rice harvest."
 jino_religion_desc: "The $jino_religion$ $common_folk_religion_desc$\n\nThe Jino religion is the traditional faith of the Jino, a Tibeto-Burman people of the Jino Mountains in Xishuangbanna, whom Qing records called the Youle. It centres on nature spirits, with Apie'e honoured as the creator god.\n\nIts myths tell of Mahei and Maniu, a brother and sister who married to renew mankind, and of the ancestress Yaobai, who made heaven and earth and scattered the first tea. At a death the village performed a painted-face dance, the face standing for the ghost that would devour the corpse, and a bamboo-pole dance to drive it off."
 juang_religion_desc: "The $juang_religion$ $common_folk_religion_desc$\n\nThe Juang religion is the traditional belief of the Juang, an Austroasiatic people found only in the Gonasika hills of Keonjhar in Odisha, whose tradition places their origin at the source of the Baitarani River. Their ritual year is marked by festivals such as Pusha Purnima, Amba Nuakhia, Pirha Puja and Asarhi."
 judaism_desc: "The original Abrahamic faith, $judaism$ adheres to the covenant made between God and Moses. The $judaism_ADJ$ Bible is the Tānāḵ, of which the first five books are known as the Tōrā, serving as the basis of all $judaism_ADJ$ faith and practice.\n\nJudaism also holds the Oral Torah, recorded in the Mishnah and the Talmud. Rabbis teach and judge by halakha, Jewish law, and worship centres on the synagogue. There is no single hierarchy, only the texts and the scholars who read them, such as Maimonides, whose Mishneh Torah codified the law.\n\nIn 1337 Jews lived as a heavily taxed minority in Christian and Muslim lands. After the Black Death of 1348, violence swept Jewish communities from Barcelona to Strasbourg, and many fled east to Poland, where Casimir III gave them protection. Spain expelled its Jews in 1492. At Safed in Ottoman Palestine, Joseph Karo wrote the Shulchan Aruch in 1563, and the messianic movement of Sabbatai Zevi ended with his conversion to Islam in 1666."
 jurema_religion_desc: "The $jurema_religion$ $common_folk_religion_desc$\n\nJurema is the sacred tradition of the interior peoples of northeastern Brazil, the non-Tupi groups the Portuguese lumped together as Tapuia, who made sacred drinks from parts of the jurema tree. The Kariri and Pankararu, among others, drank it, and their pajés, or shamans, served it at gatherings for religious and healing rites.\n\nThe drink, together with tobacco smoke and ritual song, brought on a trance in which the Encantados, the spirit masters, were thought to speak through the shaman. Early European chroniclers noted the drinking of jurema and these spirit-possession rites.\n\nUnder colonial rule the cult was driven underground. Hybrid Catholic-indigenous movements called Santidades appeared in the 1500s and 1600s, and into the 1800s to drink jurema was held to be witchcraft; many Indians and caboclos were arrested for attending a jurema gathering."
 ka_niam_khasi_religion_desc: "The $ka_niam_khasi_religion$ $common_folk_religion_desc$\n\nKa Niam Khasi is the traditional religion of the Khasi, an Austroasiatic hill people of what is now Meghalaya, in northeastern India. It is monotheistic: U Blei Nongthaw, who is one and formless, is the supreme creator of the universe.\n\nKhasi tradition says that the Lord Master first divided humankind into sixteen heavenly families, of which seven, the Hynñiewtrep, were left on earth. A ladder resting on a sacred peak let people pass to heaven, until they were tricked into cutting down a divine tree and lost the way for ever. Every Khasi village traditionally kept a sacred grove to appease the forest spirit.\n\nThe Khasis lived in about twenty-five independent states, each ruled by a chief, the syiem. They had no script of their own and handed their religion down by word of mouth."
 kachina_religion_desc: "The $kachina_religion$ $common_folk_religion_desc$\n\nThe Kachina religion is the belief of the Pueblo peoples of the American Southwest, the Hopi, Zuni and Keres among them, in kachinas, spirit beings who represent the Pueblo ancestors and the forces of the world. They are not worshipped, but given respect they bring rain, healing, fertility and protection, though they can also cause disease.\n\nTo the Hopi the kachinas live on the San Francisco Peaks and visit the villages in the first half of the year; the Powamu ceremony in February marks the bean planting. Masked men take on the spirits in dances, and kachina dolls are carved for children.\n\nAfter the Spanish brought missions to Pueblo country in the seventeenth century, Diego de Vargas re-entered it in 1692. The Pueblos kept their ceremonies out of Spanish sight behind a veneer of Catholicism."
 kaggen_religion_desc: "The $kaggen_religion$ $common_folk_religion_desc$\n\nKaggen is the best-known figure in the traditional religions of the San, the hunter-gatherers of southern Africa. San beliefs are poorly attested; the myths of Kaggen come mainly from the ǀXam.\n\nKaggen, often called the Mantis, is a creator and a trickster who can take the shape of a praying mantis, an eland bull or a snake. His favourite creature was the eland: when his sons killed it before it was ready to be hunted, he sprinkled its blood and fat to make the herds of wild eland.\n\nThe eland is also the commonest power animal in the trance dance, where shamans enter the spirit world. After the Dutch settled at the Cape in 1652, farmers pushed into San lands from the early eighteenth century, and commandos killed or enslaved thousands by the century's end."
 kaharingan_religion_desc: "The $kaharingan_religion$ $common_folk_religion_desc$\n\nKaharingan is the animist religion of the Dayak peoples of southern Borneo, among them the Ngaju. The name comes from the old Dayak word haring, life. Its symbol is the Batang Garing, a tree of life with a hornbill and the sun at the top.\n\nAncestor spirits and many deities, often under one supreme god, are central. Traditionally the Ngaju held the second funeral, the tiwah, most important: months or years after the burial the bones were placed in a carved tomb, the sandung, and animals were sacrificed so that the soul could travel to the highest heaven. The balian healed the sick by calling back a wandering soul in trance dances.\n\nThe Ngaju were more open to outside influence than other Dayaks. After 1835 the Rhenish Mission began to convert them to Christianity."
 kajoor_ri_majel_religion_desc: "The $kajoor_ri_majel_religion$ $common_folk_religion_desc$\n\nKajoor Ri Majel is the traditional belief of the Marshallese of the Ratak and Ralik island chains. It was polytheistic, but one god stood above the rest, called Iageach, a word meaning god, to whom breadfruit, coconut and fish were offered. Before any serious undertaking a man would make an offering in his family's name.\n\nThe Marshallese also worshipped spirits, including dead relatives who might possess a family member to give advice, and evil spirits called Anjilik, which caused disease. Cures were sought from the spirits, and diviners read the pattern of thrown pebbles or of knots tied in coconut or pandanus leaf. Spanish sailors first reached the islands, at Taongi, in 1526."
 kalge_religion_desc: "The $kalge_religion$ $common_folk_religion_desc$\n\nThe Kalge religion is the traditional faith of the Daju, the people who ruled the first recorded state of Darfur from the southern slopes of Jebel Marra. Their high god was Kalge, to whom they built straw shrines, and the sacred mountain of Par-Kalge took its name from him.\n\nThe geographer al-Idrisi still described the Daju kingdom as pagan in 1154, but Islam gained ground among them, and Islam is said to have become the religion of most Daju by the fifteenth century. After the Tunjur supplanted their dynasty, Daju groups survived in Dar Sila and elsewhere, many of them Muslims who kept the old customs and came to identify Kalge with Allah."
 kam_religion_desc: "The $kam_religion$ $common_folk_religion_desc$\n\nThe worship of Sa Sui centres on the most important deity of the Kam, the Dong of eastern Guizhou, western Hunan and northern Guangxi, a woman ancestor who drives off evil and protects the village. Every traditional village keeps an altar to her, a small walled courtyard near the drum tower.\n\nLegend says she was a girl, Xingni, who led the villagers against a landlord and then against the troops of his official son, until she fell from a cliff in a struggle with the official. When the villagers called her name, echoes answered through the forest.\n\nAround her stand other powers: village-gate and bridge goddesses, land gods, and turtles, snakes and dragons as totems. Kam rebellions broke out under the Ming and Qing, among them Wu Mian's of 1378 and Wu Jinyin's of 1740."
 kan_khwan_religion_desc: "The $kan_khwan_religion$ $common_folk_religion_desc$\n\nKan Khwan is the traditional belief of the Kayan, a Red Karen people of Karenni in Myanmar. In their account the eternal creator god Phu Kabukathin was helped by two creator deities and four messengers, who made heaven, earth, plants, humans and animals.\n\nThe earth was at first fluid, and Phu Kabukathin planted a post in the ground; as it grew, the earth firmed into seven layers. That post is the Kan Htein Bo, and seven commandments came with it.\n\nEvery year, in March or April, the Kayan raise a new Kan Htein Bo pole of Eugenia wood, the first tree created. The pole carries the sun at its peak, the moon and a ladder to heaven. On the morning it is raised the shaman reads chicken bones to foretell the village's year."
 kanak_religion_desc: "The $kanak_religion$ $common_folk_religion_desc$\n\nKanak religion is the traditional belief of the Kanak, the Melanesian people of New Caledonia, who had no single state or common name for themselves before Europeans came. They worshipped their ancestors at the burial place, at sacred stones and at hearths where sacrifices were offered, and held the sea sacred, with oral laws closing fishing when stocks fell.\n\nCarvings of hawks, ancient gods, serpents and turtles, and the flèche faîtière, a carved roof finial like a small totem pole, expressed their beliefs. Captain James Cook landed in 1774, when some 70,000 Kanak were reported to live on the islands, and named them New Caledonia. Missionaries of the London Missionary Society followed about half a century later."
 karachay_balkar_paganism_desc: "The $karachay_balkar_paganism$ $common_folk_religion_desc$\n\nThe Karachay-Balkar religion is the traditional belief of the Karachays and Balkars, the Turkic mountain peoples of the central Caucasus around Mount Elbrus. It never had a fixed canon or an orderly pantheon: it is pieced together from the Nart epic and legends, and scholars find in it Turkic, Alan and common Caucasian layers.\n\nThe supreme god was Tejri, the sky god, and thunder was shared among Choppa, Shibilya and Elia. Myth makes the first smith, Debet, a child of Sky and Earth.\n\nAlania's Christian past left its mark in the names of saints: Elia is the prophet Elijah and Totur is Saint Theodore. After Timur broke Alania in about 1395, Islam spread among the highlanders, and most Balkars adopted it in the eighteenth century. Tejri then became a name for the one God."
 karama_religion_desc: "The $karama_religion$ $common_folk_religion_desc$\n\nKarama is the ritual sacrifice of animals to ward off evil spirits, a pre-Islamic rite that the Zaghawa herders of the eastern Sahel, between Lake Chad and Darfur, kept after their kings had become at least nominally Muslim in the 1000s."
 karankawa_religion_desc: "The $karankawa_religion$ $common_folk_religion_desc$\n\nThe Karankawa were bands of the Gulf coast of southern Texas, among them the Capoque of Galveston Bay. They did not explain their rites to outsiders: when La Salle's companion Joutel asked about their beliefs, they only pointed at the sky.\n\nObservers saw them stare at the sun as it vanished into the sea and smoke tobacco through the nostrils. A chief was chosen by a trial in which candidates were slashed with sea-fish spines and bound to a pole, which a Spanish friar thought might equally be a puberty rite.\n\nThe Capoque nursed Álvar Núñez Cabeza de Vaca and other Narváez survivors on Galveston Island in 1528. A mission, Rosario, was founded among the Karankawa in 1754, but they fled when punished and stayed free of it."
 karbi_religion_desc: "The $karbi_religion$ $common_folk_religion_desc$\n\nKarbi religion, known as Aronban, is followed by the Mikir, or Karbi, of the hills of central Assam. It centres on a trinity of gods: Hemphu, the creator and protector; Mukrang, linked with strength and justice; and the goddess Rasinja.\n\nThe Karbi honour place spirits called Longri Arnam and household and ancestral spirits called Karhi, and have no temples or idols, offering eggs, chickens and pigs at sacred groves. The Rongker festival, held by the village elders in April before the shifting cultivation begins, asks protection from disease and crop failure.\n\nThe Chomangkan, the greatest Karbi ceremony, is a funerary rite held months or years after a death to guide the soul to the land of the ancestors. Ritual singers, the lunsepo, chant the mosera, narrative songs that carry the tribe's migration history."
 karen_religion_desc: "The $karen_religion$ $common_folk_religion_desc$\n\nThe Karen religion is kept most strongly by the highland Sgaw among the Karen peoples of southern and eastern Burma. It is built on the idea that every person is embodied by thirty-seven spirits. Illness and misfortune come when one of them wanders away, and death comes when all thirty-seven have left the body.\n\nBuddhism reached the Karen through the Mon, who dominated Lower Burma until the middle of the eighteenth century, and was brought to the Pwo-speaking Karen in the late 1700s. Many Sgaw stayed heterodox, joining Buddhist merit-making to strong animist belief, and a kind of pagoda worship called duwae kept animist roots inside Buddhist practice."
 kenos_religion_desc: "The $kenos_religion$ $common_folk_religion_desc$\n\nThe Kénos religion belonged to the Selk'nam, who lived on the Isla Grande of Tierra del Fuego and shared their myths with the neighbouring Haush. Its supreme being was Temáukel, who was the only one Selk'nam counted as a true god. Kénos, the first of the mythic ancestors called howenh, was sent down by him to organise the primeval earth and make the beings who shaped it.\n\nSpirits of the underworld, led by the goddess Xalpen and her seven shoorts, were impersonated by men in the great initiation ceremony called Hain, in which boys were frightened by the spirits until they unmasked them. Shaman-like figures were believed able to control the weather."
 khabzeism_desc: "The $khabzeism$ $common_folk_religion_desc$\n\nKhabzeism, the religion of the Circassians, centred on the supreme creator Thashkho, the Great God, with lesser deities under him. Souls were rewarded after death by their deeds. Khabzeism is not to be confused with the Khabze, the Circassian code of conduct.\n\nAmong them Mezytha ruled the forests and the hunt, Psykhe-Guasha the waters and Sozeresh the crops, whose idol, cut from a branch of seven knots, stood in family barns. On a winter night the hero Sosruqo of the Nart epic was honoured with a feast at which any traveller was welcome in his place.\n\nWorship took place in sacred groves, the kudoshi, where in 1637 the missionary Giovanni Luca described weapons and ram heads hung from the branches. As Islam spread, saints and heroes were reworked into Arab warriors and Islamic legends."
 kharia_religion_desc: "The $kharia_religion$ $common_folk_religion_desc$\n\nThe Kharia are a Munda-speaking people of the forested hills of Jharkhand, Odisha and the Chota Nagpur Plateau. They divide into the Hill, Dhelki and Dudh branches, of whom the Hill Kharia lived by hunting and gathering in the forest."
 khond_religion_desc: "The $khond_religion$ $common_folk_religion_desc$\n\nThe Khonds, a Kui-speaking tribal people of the hills of Odisha and the Eastern Ghats, blend totemism, animism, ancestor worship and shamanism, and their worship is aimed above all at the earth, which was held to be the creator and sustainer of the world. The earth deity later came to be addressed as a god, Dharni Deota, with the hunting god Bhatbarsi Deota as his companion.\n\nEach stage of farming and hunting had its rite, among them the Meriah, in which a bought human victim was sacrificed to make the soil fertile. British writers condemned the practice.\n\nLong contact with Odia-speaking Hindus brought Kali and Durga in as forms of Dharani. From 1753 the Khonds of the Ghumsar hills repeatedly rose against the East India Company."
 kilyikhama_religion_desc: "The $kilyikhama_religion$ $common_folk_religion_desc$\n\nThe Kilyikhama religion belongs to the Lengua peoples of the Paraguayan Gran Chaco, such as the Enxet, forest hunter-gatherers who lived in small bands west of the Paraguay River."
 kirat_mundhum_religion_desc: "The $kirat_mundhum_religion$ $common_folk_religion_desc$\n\nKirat Mundhum is followed by the Kirati peoples of the eastern Himalaya, among them the Limbu and Rai, who live from eastern Nepal to Sikkim. Its scripture is the Mundhum, an oral epic first sung by bards and later written down, with the stories of creation, the first human laws and a great flood.\n\nThe faith joins nature worship and ancestor reverence with shamanism. The Limbu honour the supreme power Tagera Ningwaphuma, who appears on earth as the mother goddess Yuma Sammang, while the Rai pray to the earth goddess Sumnima. The Sakela festival, danced twice a year at sowing and harvest, thanks Mother Nature and the ancestors.\n\nIn the 1770s the Limbu confederation Limbuwan was annexed by Prithvi Narayan Shah of Gorkha. Around then the scholar Te-ongsi Sirijunga revived the Limbu script."
 kirin_koda_religion_desc: "The $kirin_koda_religion$ $common_folk_religion_desc$\n\nKirin Koda is held by the Lamaholot, who live on the islands of Lembata, Solor and Adonara and around Larantuka in eastern Flores. Its supreme being is Lera Wulan Tana Ekan, the creator, and worshippers also honour the spirits of ancestors, who intercede between the living and the highest god.\n\nRites were held at the megalithic sanctuaries called korke and nubanara. The sign of the supreme being was a wooden post, the rie lima wana, where people asked for blessing, and in certain ceremonies animals were slaughtered and their blood smeared on it.\n\nWhen the Portuguese arrived, Solor was already held by Muslims, in the Solor Watan Lema league of five Islamic kingdoms. From the sixteenth century Portuguese power brought Catholicism, which came to dominate, while Kirin Koda survived among a minority."
 koch_religion_desc: "The $koch_religion$ $common_folk_religion_desc$\n\nThe Koch of Assam, Meghalaya and northern Bangladesh are nine groups of matrilineal clans, some of which kept the Koch language, who held to non-Hindu customs. They are related to, but distinguished from, the Hindu Koch who founded the Koch kingdom in 1515."
 kolano_religion_desc: "The $kolano_religion$ $common_folk_religion_desc$\n\nBefore Islam, the people of Ternate lived in kin groups, each led by a leader called a momole, and the old belief of the northern Moluccas was bound up with the rule of the kolano, the king. Traditionally in 1257 the momole of Ternate's four villages elected Momole Cico king of Gapi, with the title Baab Mashur Malamo.\n\nA legend told that the ancestors of the Malukan kings were four sons born to the Arab Jafar Sadik and a heavenly nymph, Nurus Safa, who founded the royal lines of Bacan, Jailolo, Tidore and Ternate.\n\nIslam reached the court in the late fifteenth century. Marhum (1465—1486) was the first king of Ternate to embrace it, and his son Zainal Abidin (1486—1500) enacted Islamic law and replaced the title of kolano with sultan."
 komi_paganism_desc: "The $komi_paganism$ $common_folk_religion_desc$\n\nVažesköm was followed by the Komi peoples, the Zyrians, Permyaks and Yazva Komi. The oldest source is the Life of Stephen of Perm, written soon after his death in 1396, which speaks of many gods and the worship of animals, sacred trees and idols.\n\nIn folklore the creator god is Ën; among the Zyrians he is opposed by the evil Omöl, among the Permyaks by Kul. Folklore also gives a person several souls: lovja, the breath, and ort, a double whose sound foretells death.\n\nStephen of Perm, who toured the Vychegda and Vym rivers from 1376, cut down sacred birches, devised an alphabet and became the first bishop of Perm in 1383. The Vychegda Komi were baptised, but Great Perm stayed pagan for about another century."
 koyapunem_religion_desc: "The $koyapunem_religion$ $common_folk_religion_desc$\n\nKoyapunem, meaning the way of nature, is followed by the Gonds, who call themselves Koitur and live in the forested hills of central India. Gond tradition credits its code of conduct, the Gondi Punem, to the ancestor-hero Pari Kupar Lingo, who gathered thirty-three disciples.\n\nAbove all stands the high god Baradeo, also called Bhagwan, who oversees the lesser gods but receives little fervent devotion. Worship goes to clan and village deities, ancestors and totems, among them the village mother goddess and each clan's own persa pen.\n\nBy 1337 the Gonds had founded Chanda, around 1200, and the Garha kingdom followed in the fourteenth century. Contact with Hinduism grew as their courts took Vishnu as patron deity and kings were sometimes cremated by Vedic rites, while the village cults carried on beneath."
 kundism_religion_desc: "The $kundism_religion$ $common_folk_religion_desc$\n\nKundism is followed by the Deori, a Tibeto-Burman people of Sadiya and the upper Brahmaputra valley. It takes its name from Kundi-Mama, the supreme deity, the Old Ones who are the father Kundi-Gira and the mother Kundi-Girasi together.\n\nTheir children are Pisa-Dema, also called Baliya-Baba, and the goddess Pisasi, known as Tamreswari or Kechai-khaiti. Worship, animist and ancestral, centres on sacred groves and clan rituals, without idols.\n\nDeori tradition ties the faith to the Chutia kings. The goddess took the form of a huge stone in the Dibang River, and four Chutia men who prayed to her made it light enough to carry to her temple; the king made them priests, forefathers of the four Deori clans. The Burmese invasions of 1817 to 1826 later killed or carried off many Deori."
 kuru_masaba_religion_desc: "The $kuru_masaba_religion$ $common_folk_religion_desc$\n\nKuru Masaba is the Supreme Being of the Temne of Sierra Leone, whose name joins kuru, God or sky, to a word borrowed from Mandinka meaning the big king. The Temne hold that he cannot be approached directly, only through patrilineal ancestors, to whom sacrifices are made; other spirits, some kindly and some mischievous, are given offerings too.\n\nThe Poro, Ragbenle and Bondo secret societies, brought by the Mandé, initiated boys and girls. The Temne, who say they came from Futa Jallon, were conquered by a Mandé army, the Mane, in the mid-1500s. Portuguese accounts of 1505—1508 describe them as worshippers of clay idols; Islam spread among them in the 1700s and 1800s, almost completely in the north."
 lahu_religion_desc: "The $lahu_religion$ $common_folk_religion_desc$\n\nThe traditional Lahu religion is polytheistic. The Lahu, a Tibeto-Burman people of the mountains along the Lancang River in southern Yunnan, believed in a great number of spirits, against which they held exorcism rites, and the outcome was checked by reading an egg oracle.\n\nTheir creation epic, the Mupa Mipa, whose title means making heaven and earth, runs to seventeen chapters and some 2,300 lines. It was chanted by village singers called pokuo gakuo, and tells how the sky, earth, sun, moon, living things and humankind came to be. Lahu tradition also holds that their ancestors came out of a gourd. Buddhism reached the Lahu in the late seventeenth century and became widespread among them."
 lamatuan_religion_desc: "The $lamatuan_religion$ $common_folk_religion_desc$\n\nLamatuan is followed by the Rotenese, the people of Rote Island south-west of Timor, and centres on a creator god called Lamatuan or Lamatuak, who was also seen as the one who predestines and blesses and was symbolised by a pillar with three branches."
 lamoa_religion_desc: "The $lamoa_religion$ $common_folk_religion_desc$\n\nLamoa is the old worship of the god Pue Mpalaburu among the Bare'e people of Central Sulawesi. Its rite, the Molamoa, was a circle dance known as Dero or Modero, held when a village's warriors came home from battle and when the war leaders, the tadulako, returned from headhunting.\n\nThe Bare'e taught that skulls taken in this way warded off misfortune such as a failed harvest, and the dance was performed around them in the middle of the ceremonial house, the lobo.\n\nIn the days of the Tojo kingdom, in 1770, Lamoa still kept its original form as the mark of the Bare'e. Pilewiti, the first king of Tojo, took over its customs and slowly brought the Bare'e into Islam, and the Dutch East Indies later banned the worship of Pue Mpalaburu."
 lenca_religion_desc: "The $lenca_religion$ $common_folk_religion_desc$\n\nThe Lenca religion belonged to the people of central and southeastern Honduras and eastern El Salvador. Little of its mythology survived the Spanish conquest and conversion to Catholicism.\n\nLying within the Mesoamerican sphere, the Lenca shared many practices with their neighbours, including animal sacrifices offered for good harvests, fair weather or victory in war, and a version of the 365-day calendar. Women were active in Lenca shamanism, and the priestly caste may have included many of them.\n\nRites were held to thank the goddess Ilangipuca and the maize, and spirits who brought rain, wind and fertility, or who guarded rivers and forests, were honoured. In the guancasco ceremony the Lenca lordships agreed truces at set times of the year. Resistance to the Spanish was led by the Lenca ruler Lempira, who died in 1537."
 lezgin_paganism_desc: "The $lezgin_paganism$ $common_folk_religion_desc$\n\nLezgin paganism is kept by the Lezgins of southern Dagestan and northern Azerbaijan. It begins in darkness, where the creator god made the sky and the earth and then the Red Bull Yaru Yats, on whose horns he set the world, standing on the Great Water.\n\nThe universe had three levels. The upper world had seven spheres, with the sun god Rag at the top; the middle world held men, animals and plants; and the underworld held the realm of the dead under the death god Ardav and, deepest, the evil gods led by Sed. A world tree and a rainbow bridge linked them.\n\nIslam may have reached the Lezgins as early as the 700s, but they remained mostly animist until the 1400s, when Persian traders and the Golden Horde strengthened Muslim influence."
 lisu_religion_desc: "The $lisu_religion$ $common_folk_religion_desc$\n\nThe Lisu, a mountain people of northwestern Yunnan and the Salween valley, hold a simple animism: sacrifices go to the spirits of the mountains, and shamans perform the main rituals. At the top of each village lies a sacred grove where the sky spirit, called the Old Grandfather Spirit in China, is given offerings, and each house keeps an ancestor altar at the back.\n\nThe main festival falls at the new year, and new wine is brewed at harvest. The knife-ladder festival of the eighth day of the second lunar month recalls the Lisu soldiers who, under the Ming emperor Zhengtong, climbed ladders of blades and leapt through fire against the Luchuan chieftain."
 lollardy_desc: "Led by John Wycliffe, $lollardy$ was a reformist movement advocating for universal priesthood and rejecting the necessity of sacraments like baptism and confession for salvation. Its teachings emphasized direct access to God through scripture, which was translated into vernacular languages. This made its theology accessible to the common people and fueled early calls for Church reform.\n\nJohn Wycliffe, the Oxford theologian behind Lollardy, was dismissed from the university for heresy in 1381. His followers, nicknamed Lollards, put Scripture into English as the Wycliffite Bible.\n\nAfter the Peasants' Revolt of 1381, their protectors fell away. Henry IV enacted the law De heretico comburendo in 1401, and the knight John Oldcastle, convicted in 1413, escaped from the Tower of London and led an uprising that failed.\n\nDriven underground, the Lollards survived as small secret groups. Around 310 Lollards were prosecuted in the diocese of London between 1510 and 1532, and the movement was largely absorbed into English Protestantism during the Reformation."
 lugbara_religion_desc: "The $lugbara_religion$ $common_folk_religion_desc$\n\nAdroa-Adro is followed by the Lugbara of north-western Uganda and the neighbouring parts of Congo and South Sudan. Its supreme being, Adroa, created the first man and woman, the twins Gborogboro and Meme, whom the Lugbara count as their ancestors, and gave their descendants the laws of society.\n\nAdroa has two aspects: a good, remote god of the sky, and Adro, an earthly spirit of the rivers who shows himself to the dying and was traditionally offered child sacrifice. Every man was believed to carry both, and at death each returned to its own realm."
 lutheran_desc: "Based on Martin Luther's Ninety-five Theses, $lutheran$ began as a call to reform the $catholic_ADJ$ Church but evolved into a distinct Protestant denomination. It teaches that the Old and New Testament scriptures are the sole infallible authority for $christian_ADJ$ doctrine.\n\nThe German friar Martin Luther, whose Ninety-five Theses of 1517 attacked abuses such as the sale of indulgences, began the Reformation. Johann Eck first used the name Lutheran as an insult at the Leipzig Debate of 1519.\n\nLutherans hold that a sinner is justified by grace alone through faith alone. They keep much of the older liturgy and give the Eucharist a central place. Their doctrine was set out in the Augsburg Confession of 1530.\n\nPrussia made Lutheranism its state church in 1525. Gustav Vasa of Sweden took the national church under the crown at the Diet of Västerås of 1527, and Denmark–Norway under Christian III adopted it in 1536. After the Schmalkaldic War of 1547, the Peace of Augsburg of 1555 secured Lutherans legal recognition in the empire."
 maasai_religion_desc: "The $maasai_religion$ $common_folk_religion_desc$\n\nThe Maasai are Nilotic cattle herders who came south into the Rift Valley of Kenya and northern Tanzania. Their Kikuyu neighbours call their own distant high god Ngai, and also know him as Mwene Nyaga.\n\nThe Maasai worship one creator, Enkai, who is both male and female and made the sky, the earth, people and cattle. He shows two faces: Black Enkai, who brings rain and fertility, and Red Enkai, who brings drought and lightning. His first dwelling is Ol Doinyo Lengai, the Mountain of God.\n\nThe laibon, priest, diviner and healer, stands between the living and the creator and leads sacrifices. Cattle are held to be Enkai's gift. Their dead were left in the open, because burial was thought to harm the land."
 mahayana_desc: "Called the 'Great Vehicle', Mahāyāna is a branch of $buddhist$ that accepts not only the early $buddhist_ADJ$ text, but also those known as the Mahāyāna $sutra$. It emphasizes the figure of the $bodhisattva$, understanding the $bodhisattva$ path as available to all as a way to achieve Buddhahood. While originally developing in $india$, it saw much of its expansion through $china$ and the Silk Road, and the $chinese_group$ Canon forms now the basis of all $mahayana$.\n\nMahāyāna arose in India around the first century BCE, and translators such as Kumārajīva carried it into China. From China the faith passed to Korea, Vietnam and Japan. Under Goryeo and the Lý dynasty of Vietnam it enjoyed the favour of the court, and Seon, the Korean form of Chan, became a religion of the state; the Trần emperor Trần Nhân Tông founded the Trúc Lâm school of Vietnamese Thiền in the 1290s.\n\nJoseon Korea, founded in 1392, suppressed Buddhism in favour of Neo-Confucianism until monks helped to repel the Japanese invasions of 1592–98. Under the Qing, the court favoured the Gelug school of Tibetan Buddhism."
 maleiwa_religion_desc: "The $maleiwa_religion$ $common_folk_religion_desc$\n\nThe Maleiwa religion is followed by the Wayuu of the Guajira Peninsula, on the Caribbean coast of what is now Colombia and Venezuela. Its central figure is Maleiwa, creator of everything and founder of Wayuu society. Pulowi, tied to the wind and the dry seasons, and Juya, a roaming hunter, are a married pair of demigods of life, while Wanülu is the evil spirit of sickness and death.\n\nThe dead remained part of Wayuu life. A body was buried with its belongings, and after five years the bones were dug up and reburied in the clan cemetery.\n\nThe Spanish never subdued the Wayuu. They destroyed a Capuchin mission in 1701 and burned the church at El Rincón in 1769."
 maleku_religion_desc: "The $maleku_religion$ $common_folk_religion_desc$\n\nThe Maleku, whom the Spanish called Guatuso, traditionally tell of a world they call the great house, where nothing happened until the gods came. The first to arrive was He of the Source of the Nharíne; he dreamed of a goddess, and she appeared, followed by the other gods, who chose him to rule.\n\nHe created plants, animals and people, and for a time the gods spent their days drinking chocolate. Then the goddess known as She of the Source of the Aóre grew envious of his creation, since she could not create, and pressed for the transformation of the earth. After messengers sent to warn the first people were ignored or speared, the cataclysm wiped out that humanity.\n\nSpanish settlers found the Maleku only around 1750. A lack of permanent missions let their religion survive Catholic efforts."
 malesung_religion_desc: "The $malesung_religion$ $common_folk_religion_desc$\n\nMalesung is followed by the Minahasa of the northern tip of Sulawesi, led by the priests called Tonaas Walian. The Minahasa traced their descent from the first pair, Toar and Lumimuut. Their descendants quarrelled until the tonaas, the leaders, met at a stone called Watu Pinawetengan, where they divided the people into three groups, each with its own language and ritual.\n\nThe walian, shamans, were often women. Until well into the nineteenth century the Minahasa lived in rival warrior societies that practised headhunting, which was believed to give the warrior keter, a spirit substance linked to courage and fertility.\n\nPortuguese Franciscans made some converts in the 1560s, and the Minahasa resisted Islam. A treaty with the Dutch East India Company in 1679 began Dutch rule, and the Minahasa later embraced Protestant Christianity."
 mandeaism_desc: "A gnostic religion considering John the Baptist to be the final prophet, $mandeaism$ also includes $greek_culture$ and $iranian_group$ influences. Although it considers as such some prophets of other Abrahamic religions, it does not consider Abraham, Moses, or Jesus to be $mandeaism_ADJ$ prophets. The God of $mandeaism$ is called $mandeaism_god_name$, meaning 'Great Life', and it represents the creative force of the universe.\n\nMandaeism is practised in the marshlands and along the rivers of southern Mesopotamia, with Jewish influences as well. Its followers take their name from manda, knowledge, and are called Sabians by their neighbours. They revere Adam, Seth, Noah and Shem.\n\nBaptism in flowing water, the masbuta, is repeated every Sunday, so every mandi, or temple, stands beside a river. Being identified with the Sabians of the Quran won the community the protection due to People of the Book.\n\nPortuguese Jesuits in 1559 called them Christians of Saint John. In 1831 cholera killed most of the priests of Shushtar, and two surviving acolytes restored the priesthood at Suq al-Shuyukh."
 manichaeism_desc: "$manichaeism$ is an $iranian_group$ religion founded by the prophet Mani in the Sasanian Empire. It has influences by many other religions, including Gnosticism, $zoroastrian$, $christian$, and $buddhist$ among others, but considers Mani to be the final prophet after Zoroaster, Buddha, and Jesus. Its theology is dualistic, describing the universe as a spiritual struggle between light and darkness.\n\nMani, the prophet of Manichaeism, was born in 216 near Ctesiphon. The Manichaean community was divided into the Elect, ascetic monks and nuns, and the Hearers who supported them. Manichaeism spread west to Roman North Africa, where Augustine was a Hearer for nine or ten years before turning against it, and east to Central Asia, where the Uyghur khagan Bögü made it the state religion in 763.\n\nBy 1337 it survived only in China, where believers sheltered behind Buddhist and Taoist forms and honoured Mani as the Buddha of Light. At Cao'an near Quanzhou a statue of Mani was donated and the temple rebuilt in 1339. The Ming banned it in 1370, and it was soon absorbed into Buddhism and Taoism."
 maonan_religion_desc: "The $maonan_religion$ $common_folk_religion_desc$\n\nThe folk religion of the Maonan, the Kam-Sui-speaking people of northwestern Guangxi, is animist and polytheistic, with heavy Taoist influence and many gods and rites from Chinese folk religion. Among its powers are the Kitchen God and the Earth God, who keeps outdoor work peaceful.\n\nEvery household keeps a shrine, a wooden plate on the wall bearing the names of the gods and ancestors. The birth goddess, called Wansui Niangniang in Chinese, is asked for children at weddings, and a couple who have had a child thank her with a ritual of twenty-six sacrificial animals.\n\nIn the fifth month the Maonan keep the Fenlong festival, when whole villages sacrifice to the gods and ancestors. At a funeral the children buy river water to wash the body, and chicken blood is poured on the grave ground."
 marapu_religion_desc: "The $marapu_religion$ $common_folk_religion_desc$\n\nIn the Marapu faith of Sumba, the word marapu means the inhabitants of the eternal heaven, Prai Marapu, who are the ancestors of the Sumbanese, and also the spirits of the ancestors and of the universe. The balance of the world is symbolised by the Great Mother Ina Kalada and the Great Father Ama Kalada, the moon and the sun, who bore the first ancestors. The Sumbanese believe seven pairs of men and women came down on a ladder of buffalo horns, and that after death they too climb the ladder.\n\nWooden figures with human faces, the marapu, stand on stone altars where betel and sacrificial cattle are offered. Funerals can be delayed for years, and when they take place hundreds of men haul stone slabs in the tarik batu rite."
 mari_paganism_desc: "The $mari_paganism$ $common_folk_religion_desc$\n\nČimarii Jüla is followed by the Mari, a Volga Finnic people. It is henotheistic: most deities are seen as manifestations of the supreme god Kugu Yumo, creator of the laws of the universe. Next to him stands Keremet, the ambiguous lord of the earth and of water, who records human misdeeds and punishes them.\n\nWorship took place in sacred groves or at home, led by a family elder or a kart, a priest. In autumn a goose was sacrificed in thanks for the harvest.\n\nIn the sixteenth century their land lay between Russia and the Kazan Khanate, and passed under Russian control in the wars that ended with the fall of Kazan in 1552. The Mari were nominally baptised but kept their old rites, and some fled to Bashkiria to escape baptism."
 mayan_desc: "The $mayan$ $common_folk_religion_desc$\n\nThe Maya peoples of Yucatán, Chiapas and the Guatemalan highlands kept local cults in every kingdom. Rites at sowing and harvest served the maize, and a 260-day count combined with a 365-day year ordered the ritual calendar.\n\nThe K'iche' Popol Vuh tells of creation and of the Hero Twins' descent into Xibalba. Around 1500 pilgrims from many kingdoms came to the great cenote of Chichen Itza and to shrines of the goddess Ix Chel on the islands off Yucatán.\n\nThe Spanish conquered the Yucatec kingdoms between 1527 and 1546. In 1562 the Franciscan Diego de Landa burned at Maní, by his own count, twenty-seven books and some five thousand cult images. The Itza held out at Nojpetén until 1697, and the Tzeltal rising of 1712 in Chiapas rallied behind the Virgin Mary."
 mbori_religion_desc: "The $mbori_religion$ $common_folk_religion_desc$\n\nThe Mbori religion is followed by the Azande, the conquering people of the upper Uele river region in Central Africa, who took shape in the first half of the 1700s. It centres on Mbori, an all-powerful god who made the universe but does not act like the God of the Christian missionaries who later came to the Azande.\n\nThe Azande traditionally turned to oracles, magic and witchcraft to settle everyday troubles, and the poison oracle, reserved for men, was the most respected of the oracles. Stories of the trickster Ture taught what happened to people who acted rashly."
 mesoamerican_desc: "The $mesoamerican$ $common_folk_religion_desc$\n\nThe Tonal religion covers the Mesoamerican peoples outside the Nahua and Maya cults, chiefly the Purépecha of Michoacán and the Mixtecs and Zapotecs of Oaxaca. Each people had its own gods. The Purépecha worshipped Curicaueri, the Great Fire, god of fire and the sun and patron of their ruling Uacúsecha clan, who in a vision sent Tariácuri to unite the Pátzcuaro basin. The Zapotecs honoured Cocijo, god of lightning and rain, and their high priest, the Uija-tao, lived at Mitla, a sanctuary of the dead. The Mixtecs prayed to the rain god Dzahui and kept royal genealogies in painted codices such as the Zouche-Nuttall.\n\nThe Mixtecs and Zapotecs submitted to Spain in 1521–1522, and in 1530 the Purépecha king Tangaxuan II was executed. In 1553 the Church ordered the temples of Mitla dismantled."
 miaphysite_desc: "$miaphysite$ teaches that in the person of Christ, His divine and human natures are united into a single, indivisible nature. This doctrine, rooted in the Council of Ephesus, spread widely across regions like Armenia, Egypt, and Ethiopia. $miaphysite_ADJ$ communities have preserved their unique liturgies and traditions, emphasizing Christ's unity as both God and man.\n\nMiaphysitism follows the formula of Cyril of Alexandria, the champion of the Council of Ephesus in 431, and rejects the Council of Chalcedon of 451, which spoke of two natures. Most bishops of Alexandria, Antioch and Armenia refused Chalcedon.\n\nThe Oriental Orthodox churches that followed them were the Coptic Church of Egypt, the Syriac Orthodox Church and the Armenian Apostolic Church, together with the Ethiopian Church. In 1337 the Ethiopian empire was the greatest Miaphysite power, and the faith was also held in the Armenian kingdom of Cilicia, which fell to the Mamluks in 1375.\n\nThe Ethiopian Church held out against Rome. The Jesuits won Emperor Susenyos to Catholicism, but he gave up the throne in 1632 and his son Fasilides restored the old faith and expelled them in 1633."
 midewiwin_religion_desc: "The $midewiwin_religion$ $common_folk_religion_desc$\n\nThe Midewiwin, or Grand Medicine Society, is a religious society of the Anishinaabe peoples, among them the Ojibwe, of the Great Lakes, New England and the Maritimes. Ojibwe tradition ascribes its founding to the culture hero Wenaboozho.\n\nOne account tells how the Creator saw that the people he had made suffered sickness and death, and sent the Sun Spirit to earth as a boy who taught them the Sacred Medicine. Initiates rose through degrees by completing the required teachings and ceremonies. The lessons were drawn in pictographs on birch bark scrolls; two scrolls found in Ontario were carbon-dated to about 1560.\n\nCeremonies were held in the domed, oval Grand Medicine Lodge. The cowry, or miigis, shell was a sacred emblem of the society."
 minangkabau_religion_desc: "The $minangkabau_religion$ $common_folk_religion_desc$\n\nThe Minangkabau of the West Sumatran highlands kept an older animist faith that blended with Buddhism. Their tambo, the traditional histories, say the first Minangkabau landed on Mount Marapi when it was no bigger than an egg.\n\nEvery living thing was said to have a vital spirit, the semangat. Illness meant that an evil spirit had caught the semangat, and a shaman, the pawang, was called to appease the spirits. Much of the customary law, adat, drew on these beliefs.\n\nBuddhism was strong in the highlands, and Adityawarman, a Tantric Buddhist, ruled at Pagaruyung from about 1347 to 1375. Islam reached the highlands around the sixteenth century but was weakly practiced until the Padri movement of 1803, whose war against the old customs lasted until 1837."
 mishmi_religion_desc: "The $mishmi_religion$ $common_folk_religion_desc$\n\nThe Mishmi religion is held by the forest peoples of the Mishmi Hills, along the Dibang and Lohit rivers of Arunachal Pradesh and across the border in southern Tibet. It is best recorded among the Idu, one of four Mishmi peoples with the Digaro, the Miju and the Deng.\n\nThe Idu hold that the universe and mankind were created by the supreme deities Ini Mashelo-Zinu and Nani Intaya. They honour the sun and a divine spirit that governs the universe, and worship both kind and malevolent spirits, believing in ghosts, spirit guides and an afterlife. The Idu shaman, the Igu, performs rituals, dances and chants to keep households safe and healthy."
 mississippian_ceremonial_desc: "The $mississippian_ceremonial$ $common_folk_religion_desc$\n\nCeremonialism stands for the shared religious imagery and ritual of the Mississippian chiefdoms of the American Southeast and Midwest, which flourished with maize farming between about 1200 and 1650. Scholars call it the Southeastern Ceremonial Complex; its fullest early expression took shape at Cahokia, a city beside the Mississippi that stood from about 1050 to 1350.\n\nThe cosmos had three levels. The Upper World held the Thunderers and the Morning Star; the cold Under World held the Underwater Panther and the Corn Mother; humans lived between. The falcon-dressed Birdman, shown dancing with a club on copper and shell, was a warrior’s patron.\n\nSuch images marked chiefly office and warfare. As Cahokia and its trade networks collapsed, regional styles drifted apart into the beliefs of the later historic tribes."
 mitu_religion_desc: "The $mitu_religion$ $common_folk_religion_desc$\n\nMitu is followed on the Kei Islands in southeastern Maluku, where the spirits called mitu can bring happiness or misery. A good or failed harvest, prosperity or disaster, was held to come from their power, so people held small rites in the family and each year a village cleansing, the sob-sob, for the settlement, or ohoi. Mitu could also be harnessed through the magic called suanggi.\n\nResearchers describe the old religion of Kei as a mixture of animism, magic and totemism. Beside it stood the customary law of Larvul Ngabal, handed down from the ancestors, which divided the Kei into two groups, the Ursiu of nine and the Lorlim of five."
 mizo_religion_desc: "The $mizo_religion$ $common_folk_religion_desc$\n\nSakhua, or Khua worship, is followed by the Mizo, once called the Lushai, the Tibeto-Burman hill peoples of northeast India. Its creation story tells how the goddess Khuazingnu put a pair from every tribe and animal in a cave and sealed it with the boulder Chhinlung; when she lifted the stone, the clans came out until the noisy Ralte pushed out so loudly that she put it back.\n\nPathian, the kind creator, rewards the righteous and punishes the wicked. Worship is aimed at spirits: the helpful Khuavang on the hilltops and the dangerous ramhuai of caves, springs and big trees.\n\nPriests were called puithiam. The sadawt served a chief, who could appoint or dismiss him, and the bawlpu was called to the sick to name the sacrifice that would appease the spirit."
 moism_desc: "The $moism$ $common_folk_religion_desc$\n\nMo is followed by the Zhuang of Guangxi. It grew from older Zhuang beliefs and took on some Buddhist and Taoist doctrines. Its supreme god is Bu Luotuo, the creator and founder of the religion. Everything is held to have a spirit.\n\nBeside Bu Luotuo stands Mu Liujia, the Flower Mother and goddess of birth, who tends a garden where every child is a flower, golden for boys and silver for girls. The priests, called mogong, may marry and need not leave home. Their sacred epic of Bu Luotuo was first passed on orally.\n\nEach family keeps a hall for the ancestors of the last three generations, whom it fears as well as reveres. The dead are buried twice, but those who died by violence are cremated, lest they release evil spirits."
 moksha_religion_desc: "The $moksha_religion$ $common_folk_religion_desc$\n\nShkayism is followed by the Mokshas, a Mordvinic people who speak a Uralic language and live along the Moksha River and the middle Volga. It takes its name from Shkay, the sun, regarded as the chief divinity; the moon, thunder and water were also worshipped.\n\nIn their creation myth the great bird Ińe Narmon, called the White Swan, made water first; a duck brought sand from the sea floor, and the bird shaped it into the earth and set the Great Tree upon it. Mastoratia ruled the underworld, while the souls of heroes and warriors travelled to the green isle of Usiya to feast with King Ťušťen over pure mead.\n\nAfter 1552 the Mokshas were Russian subjects. Russian rule brought forced conversion to Orthodoxy, but pagan elements long survived inside Christian practice."
 momolianism_religion_desc: "The $momolianism_religion$ $common_folk_religion_desc$\n\nMomolianism is followed by the Kadazan-Dusun, Murut and Rungus peoples of Sabah in northern Borneo. It grew out of the first ancestors' dealings with nature and the spirits at Nunuk Ragang, the legendary ancestral home, and it was woven into the unwritten laws of custom known as adat.\n\nThe creator was worshipped as Kinorohingan, and in one telling Kinoingan and his wife Suminundu are the first pair. The knowledge was handed down by priestesses, the bobolian, who healed the sick. Breaking the rules brought plague and famine on the whole community until the chief punished the offender.\n\nWhen famine threatened, the maiden Huminodun, daughter of Kinoingan and Suminundu, let herself be sacrificed, and her body grew into the food plants that saved her people. The dead went to Nabahu, now Mount Kinabalu."
 monpa_religion_desc: "The $monpa_religion$ $common_folk_religion_desc$\n\nThe Monpa, the people of Mon Yul on the southern slopes of the Himalaya around Tawang, kept an older belief of their own alongside Tibetan Buddhism. In the seventeenth century most Monpa turned to the Gelug school under the Bhutanese-trained Merag Lama, and Tawang Monastery became the centre of their life."
 mororuma_religion_desc: "The $mororuma_religion$ $common_folk_religion_desc$\n\nThe Yuracaré are a forest people of the lowlands between Cochabamba and the Beni in Bolivia. Their language is an isolate with no known relatives.\n\nYuracaré tradition distinguished two kinds of spirits. The first owned the earth and the clay, which was treated with fear: it was not to be urinated on. The mororuma were the owners of the most powerful lightning bolts, and lent that power to Yuracaré shamans to cure illnesses. The dead were buried with their bows and arrows, for they were believed to go to a place underground where game was plentiful.\n\nTo resist Spanish expansion the Yuracaré withdrew into isolation. Only from the end of the eighteenth century did they cease to live outside the colonial world."
 mu_ngava_religion_desc: "The $mu_ngava_religion$ $common_folk_religion_desc$\n\nMu Ngava is followed by the Polynesian people of Rennell Island in the Solomon Islands, whose ancestors are said to have come by canoe from 'Uvea. Oral tradition names a medium, Tahasi, who told the first voyagers of another island yet to be found, and recalls turmeric brought from East 'Uvea for ritual dyeing and anointment."
 muinaisusko_desc: "The traditional beliefs of the $finnish_language$ peoples, it contains a multitude of deities, being the most prevalent one the sky and thunder god Ukko. It also contains veneration of the dead and shamanistic practices, while also sharing some features with other nearby religions.\n\nMuinaisusko, the old faith, was followed by the Baltic Finnic peoples, the Finns, Estonians, Karelians and others, before they were Christianised. Customs differed from region to region and from period to period.\n\nJumala was another sky god, whose name later came to mean the Christian God. Ahti ruled the sea and its fish, and Tapio the forest and the hunt. The tietäjä, the one who knows, was a shaman who could enter a trance and travel to Tuonela, the land of the dead beneath the earth, ruled by Tuoni.\n\nChristianisation began around the twelfth century. Churches were often built on the old holy places, and sacred trees were cut down, but folk magic and oral tradition lingered in the countryside long afterwards."
 muisca_religion_desc: "The $muisca_religion$ $common_folk_religion_desc$\n\nIn the Muisca confederation of the central Colombian Andes, rulers served as both political and religious leaders. The supreme being, Chiminigagua, made light and the Earth, but he was not worshipped directly. Worship went to the moon goddess Chía and her husband Sué, god of the sun. The first Muisca, the chroniclers wrote, came from Lake Iguaque with the mother goddess Bachué, and the teacher Bochica taught them weaving and law.\n\nPriests called ogques led pilgrimages and offerings of gold figures, emeralds and sometimes human lives at holy lakes such as Guatavita and Tota. Ritual use of coca, tobacco and yopo accompanied them.\n\nThe Spanish conquest of the 1530s ended the old order, and the last public ceremony was held at Ubaque on 27 December 1563."
 mulam_religion_desc: "The $mulam_religion$ $common_folk_religion_desc$\n\nThe folk religion of the Mulao, a people of northern Guangxi who trace their ancestry to the old Ling and Liao tribes, was traditionally animist and polytheistic, and Han and Zhuang neighbours shaped it. Shamans led the ceremonies; at the dragon boat festival they performed rites to secure the harvest and drive off harmful insects.\n\nThe great festival was Yifan, a thanksgiving at which animals were sacrificed. In the third lunar month people honoured Huapo, the goddess of birth, whose garden is said to hold flowers that become children, with pigs and oxen killed before her temple. Buddhist monasteries stood near Luocheng, and in sickness or disaster the Mulao called Taoist masters, usually of the Meishan order."
 muong_religion_desc: "The $muong_religion$ $common_folk_religion_desc$\n\nThe Muong are a highland people of northern Vietnam who share ancient roots with the lowland Vietnamese. Their religion is polytheistic and shares many supernatural beings with Vietnamese folk religion; its main festival is the lunar new year, when the Muong pray to their ancestors.\n\nEvery living person is thought to have many souls, and life passes into death in stages. The Muong creation epic traces the first people to a cave in the mountains, from which they spread to the villages; one son, called the king Việt, went down to the plains to build a capital."
 muonyjang_religion_desc: "The $muonyjang_religion$ $common_folk_religion_desc$\n\nMuonyjang is followed by the Dinka, who herd cattle along the White Nile and across the Bahr el-Ghazal plains. Their ancestors left the Gezira as Christian Alodia crumbled in the thirteenth century.\n\nThe supreme being is Nhialic, god of sky and rain, who keeps far from human affairs. In myth he made the first people, Garang and Abuk, and cut the rope joining heaven to earth after Abuk disobeyed him by planting too much grain. Prayers go first to Nhialic, then to clan divinities and ancestral spirits called jok, with a bull or ox sacrificed.\n\nEvery Dinka inherits a totem from both parents; it is not worshipped but treated as kin. The Dinka largely ignored or rejected the Islam and Christianity of their neighbours, among them the Funj Sultanate that arose in 1504."
 musala_religion_desc: "The $musala_religion$ $common_folk_religion_desc$\n\nMusala is the faith of the Nuba Mountains in southern Kordofan, whose religious figure, the kujur, called ta musla in the Kadugli language, was held to be seized by a spirit and led the rites known as sibir."
 naa_wuni_religion_desc: "The $naa_wuni_religion$ $common_folk_religion_desc$\n\nNaa-wuni is followed by the Mamprusi of Mamprugu in northern Ghana, a kingdom founded around the 1200s by Naa Gbewaa at Pusiga, where his tomb remains the ancestral home they revere; most Mamprusi began turning to Islam in the 1600s through Dyula merchants."
 nacuco_religion_desc: "The $nacuco_religion$ $common_folk_religion_desc$\n\nThe Nacuco religion is followed by the Pijao, a loose federation of chiefdoms in the Andes of what is now Tolima, Colombia. The Pijao held the stars, weather, waters, plants and living things to be sacred parts of one divine whole, which human actions could upset. Rituals kept the balance, with offerings that ranged from chicha to human blood, and with idols of gold, clay or wood painted in many colors.\n\nTheir priests, the mohanes, fasted before sacred ceremonies, while the tegua cured the sick. The bodies of caciques and mohanes were mummified so that the people could come to worship at them. The Pijao fought the Spanish for generations before they were overcome."
 naga_religion_desc: "The $naga_religion$ $common_folk_religion_desc$\n\nThe Naga religion is held by the many hill tribes known together as the Naga, who live between Assam, the Manipur valley and the upper Chindwin. They venerated natural elements such as the sun, moon, trees and stones, and believed in a Supreme Being and lesser spirits tied to nature, which they appeased with rituals and sacrifices.\n\nFolk songs and dances belonged to festivals and religious occasions, and headhunting and intertribal raiding were part of the old order. American Baptist missionaries introduced Christianity to the Naga Hills in the mid-nineteenth century, and the British tried in the same century to abolish headhunting; the missionaries opposed the old songs, which they linked with spirit worship, war and immorality."
 nahuatl_desc: "The religion of the $nahua_group$, in which the many $nahuatl_god_name$ or gods are organized under the supreme god Ōmeteōtl. Many other gods, like $huitzilopochtli_god$, $tlaloc_god$, or $quetzalcoatl_god$ are commonly adopted as patron of estates or peoples. One of its key practices is that of human sacrifice, performed in honor of the gods and a necessity to keep their favor.\n\nNahua religion is best known through the Aztecs, who saw the world through teotl, the sacred power that takes form in many gods. Huitzilopochtli was the god of the Mexica and Tlaloc the rain god. Festivals, government and even war were timed by the calendar.\n\nTemples were stepped pyramids buried under a new layer every 52 years. At Tenochtitlan the Great Temple carried twin shrines of Huitzilopochtli and Tlaloc, and the high priests of both bore the title Quetzalcoatl.\n\nTenochtitlan was founded in 1325; in 1519–1521 Cortés and his Tlaxcaltec allies overthrew the Aztec empire, and in 1524 twelve Franciscans arrived to begin the systematic conversion of the Nahuas. The old beliefs live on in Catholic forms in the cult of the Virgin of Guadalupe and the Day of the Dead."
 nallagdigua_religion_desc: "The $nallagdigua_religion$ $common_folk_religion_desc$\n\nThe Nallagdigua belief is that of the Mocoví, or Moqoit, a Guaycuru people of the Gran Chaco who lived by hunting, fishing and gathering and who pictured the cosmos as divided into layers. Jesuit missionaries founded the San Javier reduction for them in 1743."
 namandu_religion_desc: "The $namandu_religion$ $common_folk_religion_desc$\n\nÑamandú, the First, is the supreme being in the cosmology of the Guaraní, kept above all by the Mbyá of Guairá in present-day Paraguay. He is invisible, eternal and all-powerful, and dwells in the Eternal Home; his opposite is Añá, the principle of evil.\n\nÑamandú engendered himself like a tree, and from his heart came the light that dissolved the darkness. With Karai, lord of fire, and Tupã, ruler of water and thunder, he shaped the earth and the first people. Twin boys, raised by jaguars after their mother died, reached the Eternal Home and became the Sun and the Moon.\n\nIn 1610 the Jesuits founded Loreto on the Paranapanema, the first mission of Guayrá. In time the missions gathered more than 100,000 Guaraní."
 naoma_religion_desc: "The $naoma_religion$ $common_folk_religion_desc$\n\nNaoma is the religion of the Tairona, a group of Chibchan chiefdoms of the Sierra Nevada de Santa Marta on Colombia’s Caribbean coast, who built stone-terraced towns such as Teyuna, called Ciudad Perdida. Little is written of their faith itself.\n\nAfter the Spanish founded Santa Marta in 1525 the Tairona fought them for decades, and by 1600 the survivors had retreated to the high mountains. Their descendants, the Kogi, Wiwa, Arhuaco and Kankuamo, are believed to have kept much of the old tradition. The Kogi speak of a creator, the Great Mother, whose thoughts, the aluna, came before the world. Their priests, the mamos, are trained from early childhood in isolation."
 natugu_religion_desc: "The $natugu_religion$ $common_folk_religion_desc$\n\nThe Natugu belief belongs to the Natugu-speaking people of Nendo, also called Santa Cruz, in the Solomon Islands. The name of the language means our language."
 naurus_religion_desc: "The $naurus_religion$ $common_folk_religion_desc$\n\nNaurus is the belief of the Manusela and Nuaulu peoples of Seram in the Moluccas, a syncretic faith in which Hindu elements are mixed into the native religion of the island. They are said to have come from the Hindu kingdom of Butuan on Mindanao in the distant past, and the followers call themselves Hindus.\n\nIts deities may include names taken from the Ramayana, Rabie (Rama) and Hainuwele (Hanuman), together with the naga, although Rabie and Hainuwele, the Coconut Girl, are better seen as native mythical figures. The highest god is called Allahatala."
 naylamp_religion_desc: "The $naylamp_religion$ $common_folk_religion_desc$\n\nNaylamp is the founding hero of the Lambayeque, or Sican, people of Peru’s north coast, known from a Spanish chronicle written in 1586. In the tale he arrived by sea from the south on a raft with his wife and a retinue. He landed on the coast, built a temple called Chot and set up a green jade idol, Yampallec, in his own likeness.\n\nNaylamp founded a dynasty of twelve rulers. At his death his sons said that he had sprouted wings and flown away.\n\nThe last king, Fempallec, tried to move the idol, and a thirty-day flood and then drought and famine followed. The priests blamed him and threw him into the sea. The valley broke into small lordships, and the Chimú conquered it in the late fourteenth century."
 nduke_religion_desc: "The $nduke_religion$ $common_folk_religion_desc$\n\nThe Nduke belief belongs to the people of south-western Kolombangara in the New Georgia Islands of the Solomon Islands, who speak the Duke language and call themselves Dughore. Their oral history says the other peoples of the island were destroyed in warfare, probably in the early nineteenth century, while the south-western people survived in hill fortresses."
 nestorianism_desc: "$nestorianism$, named after Nestorius, teaches that Christ's divine and human natures are distinct and exist side by side. This doctrine was rejected by the Council of Ephesus but found a strong following in Persia and beyond. Nestorian Christians spread their faith across $asia$, becoming the largest $christian_ADJ$ religion in land area covered.\n\nNestorianism is the name usually given to the Church of the East. Its namesake Nestorius was Patriarch of Constantinople; after the Council of Ephesus condemned his teaching in 431, the church of the Sasanian Persian empire held to it, and its patriarchs sat at Seleucia-Ctesiphon, later at Baghdad.\n\nIts liturgy was in Aramaic, and it grew under the caliphs. Patriarch Timothy I, who held office from 780 to 823, appointed metropolitans for the Turks of Central Asia, for China and for India.\n\nThe church then shrank. Timur's persecutions after 1370 wiped out Christianity in Central Asia, leaving the church in the mountains of Kurdistan and with the Saint Thomas Christians of Malabar. In the seventeenth century its two patriarchal lines broke off their dealings with Rome."
 ngacang_religion_desc: "The $ngacang_religion$ $common_folk_religion_desc$\n\nThe traditional religion of the Achang, Tibeto-Burman people of western Yunnan descended from Qiang tribes, varied from place to place. In the Lianghe district they kept a primal belief in the spirits of all things, while the Achang of Husa took up Theravada Buddhism.\n\nThe heart of the old belief is the creation epic Zhepama and Zhemima, in which the first ancestors spin the heavens, weave the earth and make human beings, then outwit the demon king Lahong. They are the highest of the kind gods. At the Wo Luo festival people honour the ancestors with sacrifices, songs of the epic and dancing.\n\nAt a Buddhist funeral the monk leads the soul along a cloth tape tied to the coffin. Nothing metal is buried, since metal is thought to taint the soul."
 ngbandi_religion_desc: "The $ngbandi_religion$ $common_folk_religion_desc$\n\nThe Ngbandi, the river people of the upper Ubangi, follow an animist belief in which seniority within the family and clan shapes religious as well as social life. A serpent cult is recorded among them."
 nhaala_religion_desc: "The $nhaala_religion$ $common_folk_religion_desc$\n\nN'haala is the traditional religion of the Balanta of Guinea-Bissau, rice farmers who by archaeologists' reckoning came to the coast in small groups between the 900s and 1300s. Their name is Mandinka for those who resist, and they kept to egalitarian villages governed by councils of elders, whose members were initiated at the Fanado ceremony.\n\nIn Balanta belief God is far away, and people reach the divine through their own spiritual practices, sacrifice and the worship of spirits such as Djon Cago. In the 1800s they spread across the region to resist the expansion of the Mandinka kingdom of Kaabu."
 nicobarese_religion_desc: "The $nicobarese_religion$ $common_folk_religion_desc$\n\nThe Nicobarese religion is the traditional animism of the people of the Nicobar Islands, a chain in the Bay of Bengal north of Sumatra. They believe in spirits, ghosts and the soul: when a person dies the soul leaves the body and becomes a ghost. Spirits are blamed for every misfortune, and shamans are called in to deal with the bad ones.\n\nPainted sculptures carry the myth of Nicobarese origins and represent the spirits of living beings, natural elements and even everyday objects. In the houses, the spirits of the family's ancestors live in the sculptures.\n\nThe Danish East India Company began European colonisation of the islands in 1754. Moravian missionaries from Tranquebar who tried to settle on Nancowry died in great numbers of disease."
 norse_desc: "The old religion of the $germanic_language_family$ of $scandinavian_region$, it includes a wide array of gods as the Æsir and Vanir, including the most famous Óðinn and Þórr. It considers the universe as nine different realms in the world tree Yggdrasill, of which Miðgarðr is the one in which humans live.\n\nIn Norse paganism the Æsir and the Vanir, after a war, found they were equally powerful. Missionary pressure mounted from the ninth century, and Haakon Sigurdsson's rule in Norway (975–995) made paganism almost a state ideology until Olaf Tryggvason forced the nobility to convert. In about 1000 Iceland accepted Christian law at the Althing, with concessions to the old faith. Sweden was officially Christian by the twelfth century.\n\nBy 1337 the religion survived only in folklore. Its myths had been written down by Christians in Old Norse works of the thirteenth century."
 nu_religion_desc: "The $nu_religion$ $common_folk_religion_desc$\n\nThe Nu religion is the traditional animism of the Nu, a Tibeto-Burman people living in the deep gorges of the Nu (Salween), Dulong and upper Irrawaddy rivers in north-western Yunnan and Kachin State. Their beliefs held that the natural world was full of living powers.\n\nLegend gave the Nu their rope bridges. A girl named A-Rong, watching a spider's web, devised a rope to cross the flooding river, and when a chieftain tried to force her into marriage she fled into the mountains and turned to stone in a cave; the flower-fairy festival in the third lunar month honours her.\n\nThe northern Nu took to Tibetan Buddhism, while most southern and central Nu kept their animist faith. French missionaries reached the south in the second half of the nineteenth century, and a minority became Christian."
 nuo_religion_desc: "The $nuo_religion$ $common_folk_religion_desc$\n\nNuo is the exorcistic religion of central and southern China, most closely tied to the Tujia. Its roots go back to the old rite of driving out plague demons at the turn of the seasons, led in the Zhou dynasty by the fangxiangshi, an official in a bearskin with four golden eyes.\n\nIts gods are shown as carved wooden masks. Mythology makes the highest pair Lord Nuo and Lady Nuo, the first two humans, who were unjustly beheaded and are worshipped as ancestors who answer prayers. Below them come the Taoist Three Pure Ones and then the Jade Emperor, whom the priests summon by blowing an ox horn.\n\nRites in nuo temples include dances, sacrifices and nuo theatre. They aim to strengthen the gods so that they can drive out evil beings."
 nyama_religion_desc: "The $nyama_religion$ $common_folk_religion_desc$\n\nNyama names the spiritual power that the Mandé-speaking peoples of West Africa believe to exist in nature and in every living thing. They guard and use it through initiation associations such as Chiwara and Dwo, which even Muslim Mandinka kept, and through masks, which the Dogon say were made to hold the nyama released by a death.\n\nMany Mandé peoples had been Muslim since the 1200s, but groups such as the Bobo kept their older beliefs entire, and the Bambara did not convert until the 1800s. Around Djenné-Djenno, ancestral cults flourished among the Soninke-related peoples."
 nyang_serai_religion_desc: "The $nyang_serai_religion$ $common_folk_religion_desc$\n\nNyang Serai is the traditional faith of the Rejang, the rice farmers of the Barisan highlands in southwestern Sumatra. It is named for its best-known figure, the goddess of rice and fertility, whom the Rejang saw as their own version of the Javanese goddess Dewi Sri. Her worshippers offered sacrificial animals and incense.\n\nAt the great feast, the kedurai agung, the Rejang raised the punjung, a pile of produce that stood for a mountain, Mount Kaba, and prayed on its slopes. Feared spirits called smat lived in particular places, so people asked their leave before entering or taking anything from nature. The tiger was treated as an ancestor.\n\nIslam arrived from Banten, Aceh and the Minangkabau lands from about the sixteenth century. The Rejang converted later than most of their neighbors."
 nyasaye_religion_desc: "The $nyasaye_religion$ $common_folk_religion_desc$\n\nNyasaye is the traditional faith of the peoples around the Winam Gulf of Lake Victoria in what is now western Kenya, and the word is the name of God among the Luo and the Gusii. The Luo, who moved into the region from about 1490, saw Nyasaye as the creator and called him Obong'o Nyakalaga, the one of a kind and all powerful. Neighbouring Luhya speakers used a similar word, though their high god was also called Wele.\n\nBeside the high god, people traditionally honoured ancestral spirits and spirits tied to rain, healing and misfortune. Diviners mediated with the spirit world, and among the Luo it was the diviner who crowned a chief."
 nyesoa_religion_desc: "The $nyesoa_religion$ $common_folk_religion_desc$\n\nNyesoa is the creator god of the Kru peoples of the Liberian coast, as the early missionaries recorded. Beneath him the world was filled with territorial spirits, family guardians and the souls of the dead, who stayed close by and could influence events. Trained practitioners called deya treated illness and spiritual trouble with medicines and rites."
 obian_paganism_desc: "The $obian_paganism$ $common_folk_religion_desc$\n\nObian Shamanism is the traditional faith of the Ob-Ugric peoples, the Khanty and the Mansi, who lived along the Ob and its tributaries in western Siberia, the land the Russians called Yugra. Torum was the sky god; in a song of the Khanty, he sent his son to rule the earth, but the son forgot his father's advice, lost his immortality, turned into a beast and was killed by hunters.\n\nThe bear was the centre of the ritual year. After a successful bear hunt the people held a celebration lasting five or six days, with songs, dances and plays.\n\nIn the fifteenth century the Khanty princedoms were partly included in the Siberian Khanate. At the end of the sixteenth century Russia, led by the Cossack Yermak, set out to conquer the region."
 odinala_religion_desc: "The $odinala_religion$ $common_folk_religion_desc$\n\nOdinala, also called Omenala or Odinani, is the traditional religion and customary law of the Igbo of southeastern Nigeria, and the kingdom of Nri in the northern Igbo heartland was its ritual centre. The supreme god Chukwu stands over lesser spirits, whose demands diviners called dibia learn through afa divination.\n\nAncestors are held to guard their lineages from the spirit world, and some return by reincarnation within the family. The priest-kings of Nri, the Eze Nri, were said to descend from the sky being Eri, and they spread their authority over roughly a quarter of Igboland by sending out converts who bound communities by ritual oath rather than by force.\n\nNri's influence lasted into the 1500s. It then waned from the 1700s as Benin and Igala rose and the Atlantic slave trade grew."
 omo_religion_desc: "The $omo_religion$ $common_folk_religion_desc$\n\nThe Omo religion stands for the traditional beliefs of the agro-pastoral peoples of the lower Omo valley in southern Ethiopia, such as the Mursi and the Hamar. Among the Mursi, a power greater than themselves, called Tumwi, is located in the sky. An inherited priest, the komoru, speaks for the community to Tumwi and performs public rites to bring rain and to guard people, cattle and crops from disease and raiders.\n\nThe Hamar have two ritual leaders, the bitta, who oversee spiritual matters without holding political power. Purity matters greatly to them and their neighbours: a person or child judged mingi, ritually polluted, was cast out from the community."
 orang_asli_religion_desc: "The $orang_asli_religion$ $common_folk_religion_desc$\n\nThe Orang Asli religion is the animism of the indigenous peoples of the Malay Peninsula, best described among the northern Semang. They hold that people and all natural things have souls, and picture the earth as a disc resting on a huge snake or turtle and joined to the sky by stone pillars.\n\nThe chief god of the Semang, the thunder god Karey, is cruel rather than loved, and punishes those who break taboos with lightning or illness. Each group has a shaman, the hala, who in trance speaks with the spirits and heals with herbs; the greatest halas are said to turn into tigers.\n\nIn the early 1500s the Aceh sultanate sent expeditions to seize slaves. In the 1700s and 1800s Minangkabau and Batak raiders sacked Orang Asli villages."
 orang_laut_religion_desc: "The $orang_laut_religion$ $common_folk_religion_desc$\n\nThe Orang Laut, the ‘sea peoples’, were the boat-dwelling fishers and traders of the Riau Islands, the Strait of Singapore and the coasts of eastern Sumatra and the southern Malay Peninsula. Their traditional belief was the worship of spirits said to live in trees, water, rocks and caves.\n\nUnder Srivijaya, Malacca and Johor the Orang Laut patrolled the straits and guided traders to their rulers’ ports. When the last Malacca-Johor sultan was killed in 1699 they refused to accept the Bendahara family that took the throne, and the Bugis later replaced them as guardians of the straits. Many were drawn into the Malay world and Islam, but some groups, such as the Seletar, kept their old beliefs long afterwards."
 orang_rimba_religion_desc: "The $orang_rimba_religion$ $common_folk_religion_desc$\n\nThe Orang Rimba religion is the animist faith of the ‘people of the forest’, a small nomadic people of the lowland rainforests of Jambi and South Sumatra, known to the Malays as the Kubu. Traditionally they moved camp far away after a death, leaving the place of mourning behind."
 ori_religion_desc: "The $ori_religion$ $common_folk_religion_desc$\n\nOri religion is the ancestor-centred belief of the Madi and the closely related Lugbara, who live in the West Nile lands on the Sudan, Uganda and Congo borders. In the Lugbara record, ori are the ghosts of the patrilineal dead, who are traditionally believed to send sickness to the living when quarrels are left unresolved. A sick person is then assigned an animal, usually a sheep, which is killed after recovery, and its meat is placed at the dead ancestors' shrines before the lineage shares the rest.\n\nAbove the ancestors stands the creator god Adroa, a distant sky god, who is also thought to have an earthly aspect. Diviners, oracles and rainmakers served as intermediaries."
 orthodox_desc: "The $orthodox_ADJ$ Church, rooted in the traditions of the early $christian_ADJ$ councils, emphasizes the continuity of apostolic teachings and sacred tradition. Centered on the $BYZ_ADJ$ Rite, it places great importance on liturgy, icons, and mysticism. The $orthodox_ADJ$ faith is led by patriarchs, with the Ecumenical Patriarch of Constantinople holding a primacy of honor.\n\nThe Orthodox churches are self-governing, each ruled by its bishops in synod. Unlike the pope, the Ecumenical Patriarch of Constantinople has no authority over the others. They hold to the decrees of the seven ecumenical councils and the teaching of the Church Fathers, and parted from Rome in the schism of 1054. Mysticism was strong among the monks of Mount Athos, whose practice of hesychasm was defended by Gregory Palamas.\n\nIn 1337 Orthodoxy was the faith of Byzantium, Serbia, Bulgaria, Georgia, Wallachia and the Russian principalities. The union with Rome agreed at the Council of Florence in 1439 was rejected by most clergy and people in Constantinople, and the city fell to the Ottomans in 1453."
 pabichu_religion_desc: "The $pabichu_religion$ $common_folk_religion_desc$\n\nPabichu is the name the game gives to the traditional religion of the Chiquitano, who call themselves Monkóx and live in the dry forests and savanna of the Chiquitania in eastern Bolivia. From 1692 Jesuit missions gathered them into mission towns, which lasted until the order was expelled in 1767.\n\nTradition gave each person three souls, of breath, blood and shadow. The shadow soul wandered in dreams and went to a paradise after death, though one that lingered had to be persuaded by a shaman to leave. Upayaretu, a giant rhea in the sky, guarded children, and eclipses of the moon, Pama Kuara, were dogs of the sky devouring it, so warriors shot arrows upward to drive them off."
 paiute_shamanism_desc: "The $paiute_shamanism$ $common_folk_religion_desc$\n\nPuhagimism is the traditional shamanism of the Northern Paiute of the Great Basin. Its practitioner is the puhagim, a medicine man, and its central idea is puha, a power that gives life to the physical world and moves the elements, plants and animals alike.\n\nTo draw on this power the puhagim went to sacred places such as mountains, caves and waterways, where he cured the sick, made rain, and acted in war or sorcery. Illness was spiritual as well as bodily, and the shaman retrieved the soul of the sick, calling up power with a rattle, smoke and songs.\n\nThe creation tales were told by the elders around the winter fire. In one, the sagehen alone survives a flood and the Cannibal Nűműzóho then kills nearly all the people."
 palaung_religion_desc: "The $palaung_religion$ $common_folk_religion_desc$\n\nThe Palaung religion is the ethnic animism of the Palaung, who call themselves Ta'ang, an Austroasiatic people of the Shan highlands and the Yunnan frontier. It rests on a system of nature spirits called nats, which the Palaung honoured alongside the Buddhism most of them came to follow.\n\nPalaung girls wear rattan hoops around the waist, and a legend explains them: in ancient times Palaung women could fly through the sky, until the men made rattan hoops and fitted them around the women's waists to keep them on the ground. Most Palaung followed Theravada Buddhism, and boys were sent to monasteries at the age of ten to learn the scriptures."
 paulicianism_desc: "$paulicianism$ is a dualist $christian_ADJ$ sect that rejects the material world as the creation of an evil force. Its followers hold that only the spiritual realm is pure and base their beliefs on the New Testament, rejecting the Old Testament entirely. Persecuted by both $catholic_ADJ$ and $orthodox_ADJ$ authorities, the $paulicianism_ADJ$ movement resisted assimilation and inspired later reformist movements.\n\nPaulicianism arose in Armenia in the seventh century and flourished on the frontier of the Byzantine Empire and the caliphate. Its founder was said to be Constantine of Mananalis, who founded his first congregation about 660 and was stoned to death twenty-seven years later. Byzantine writers also charged the Paulicians with rejecting the cross.\n\nPersecution drove them to found a state around the fortress of Tephrike, whose leader Chrysocheres raided as far as Ephesus in 867. Basil I destroyed it by 878, and emperors then moved Paulicians to Thrace, where they lasted for centuries.\n\nUnder the Second Bulgarian Empire some Thracian Paulicians turned Orthodox. After the Ottoman conquest others became Muslims, and the rest were converted to Catholicism in the sixteenth or seventeenth century."
 pava_religion_desc: "The $pava_religion$ $common_folk_religion_desc$\n\nThe Yurupari tradition belongs to the Tukano, Arawak and Maku peoples of the Vaupés basin in the Colombian and Brazilian Amazon. Its hero is the Son of the Sun, born to the virgin Ceucy, who conceived by eating a fruit.\n\nYurupari means the one who covers the mouth, because men keep the secrets of his religion. The name is Tupi, brought by missionaries who equated the figure with the Devil. He replaces the matriarchal laws of the world with the laws of the Sun.\n\nHis voice lives on in sacred flutes and trumpets of paxiúba palm, which women must not see. The central rite is a male initiation for boys of twelve to fifteen, when flutes roar with the voices of the ancestral Anaconda and Jaguar."
 pech_religion_desc: "The $pech_religion$ $common_folk_religion_desc$\n\nThe Mua Mua religion is that of the Pech, a Chibchan-speaking people of northeastern Honduras, who say they are the children of the lightning god Mua Mua. Lightning bolts are the spirits of the ancient men who rid the earth of the lizard-like Chaca-Chacay and of cannibal giants led by Takascró; the Pech sprang from them.\n\nMua Mua also fathered the god Patakako, conceived through white river foam as his mother washed clothes. With the rainbow god Piritakata, Patakako travelled to the end of the world, where four pillars hold up the universe.\n\nHe later climbed the nine levels of the sky to meet Kako, his nine-eyed counterpart. In the 1620s the Spanish gathered the Pech into mission towns, and Catholic faith replaced the old stories."
 pelebegu_religion_desc: "The $pelebegu_religion$ $common_folk_religion_desc$\n\nThe Pelebegu religion is the traditional faith of the Batak peoples of North Sumatra, among them the Toba and Mandailing. The Toba believed that the first Batak descended from Si Raja Batak, whose family settled on Pusuk Buhit, a volcano by Lake Toba.\n\nIts creator is Mula Jadi Na Bolon, ‘the beginning of becoming’, who lives in an upper world of seven levels. He received no sacrifices. Ritual centered instead on the tondi, the life-soul, and on the begu, the soul of the dead, which stayed near the village and had to be pacified with food and prayers.\n\nPriests called datu healed the sick and foretold the future from the pustaha, a book of bark and wood. During the Minangkabau Padri wars of 1803—1837, the Mandailing Batak of the south were converted to Islam."
 pengarap_asal_religion_desc: "The $pengarap_asal_religion$ $common_folk_religion_desc$\n\nPengarap Asal, the original belief, is the traditional religion of the Iban, a Dayak people of western Borneo. Before expanding into what is now Sarawak, the Iban lived in the Kapuas basin; Benedict Sandin dated their move into the Batang Lupar valley to the 1550s, and they reached the Rejang in the early 1800s.\n\nThe Iban recognised a supreme being, Bunsu Petara, who had no parents and made the worlds, and seven lesser gods beneath him, including Sengalang Burong, god of war and healing. Omens decided much of life: the calls and flights of omen birds, which served Sengalang Burong, were read before a journey, raid or harvest.\n\nGawai Kenyalang, the Hornbill Festival, honoured Sengalang Burong and was held by successful raiders in the days of headhunting. Gawai Antu welcomed the souls of the dead."
 pericu_religion_desc: "The $pericu_religion$ $common_folk_religion_desc$\n\nNiparaya is the creator god of the Pericú, a seafaring people of the Cape Region at the southern tip of Baja California, whose lands ran from Todos Santos to La Paz. They lived on fish, shellfish and agave and never farmed or made pottery.\n\nFragments of their mythology were written down in the early 1730s. Niparaya was an all-powerful master who made heaven and earth. His wife was Amayicoyondi, and they had three sons. Quaayayp made the race of men and was later killed by them; Acaragui was the second.\n\nJesuit missions reached La Paz in 1720 and San José del Cabo in 1730. After the Pericú revolt of 1734 and a long toll of disease and fighting, the Pericú were culturally extinct by the time the Jesuits were expelled in 1768."
 pi_religion_desc: "The $pi_religion$ $common_folk_religion_desc$\n\nPi is the game's name for the moon cult of the Andean highlands of what is now Ecuador, centred on Catequil, a god of thunder and water. In the Cayapa language pi means sacred water, and the springs and lakes where Catequil was thought to live were left untouched except during ritual.\n\nCatequil was shown with a thunderbolt in his hand and the torso of a jaguar, and was tied to the waning moon. On such nights he was believed to release the animals in his care, and a man seeking leadership bathed in his spring in an initiation rite to win courage and fortune.\n\nThe Puruhá and the Caranqui kept lunar calendars. His cult spread north into Colombia and south to the Huamachuco of northern Peru, where he merged with the lightning god Illapa."
 piil_pesenggiri_religion_desc: "The $piil_pesenggiri_religion$ $common_folk_religion_desc$\n\nPiil Pesenggiri is the code of honor of the Lampung people of southern Sumatra, who trace their origin to the kingdom of Sekala Brak under Mount Pesagi and later divided into the coastal Saibatin and the inland Pepadun. It makes pride, and a courage that never retreats from a challenge, the foundation of life.\n\nFour further values go with it: juluk-adok, to live up to the customary title one bears; nemui-nyimah, to visit and receive guests generously; nengah-nyappur, to take an active part in the community; and sakai-sambayan, to help one another. The five are written in the Kuntara Raja Niti manuscript and symbolized by five flowers on the Lampung emblem."
 pomo_shamanism_desc: "The $pomo_shamanism$ $common_folk_religion_desc$\n\nKuksu was the religion of the Pomo, Patwin, Maidu and other peoples of Northern California, from the Sacramento Valley west to the Pacific coast. Its heart was a men’s secret society that met in underground dance rooms and appeared in costume at public dances, enacting spirit beings to secure health, good harvests, fertility and fair weather.\n\nThe Pomo told of Kuksu, a red-beaked supernatural being who lived in a sweathouse at the south end of the world and was a healer. The dancer who played him was often regarded as the medicine man.\n\nAmong the Patwin and Maidu a variant called Hesi admitted women. In the 1820s Spanish missionaries took many southern Pomo into the missions of San Rafael and Sonoma, and a smallpox epidemic from Fort Ross killed many in 1837."
 puntan_religion_desc: "The $puntan_religion$ $common_folk_religion_desc$\n\nPuntan religion is the traditional belief of the Chamorro of the Mariana Islands, named for one of the two creator siblings of their legend. As he lay dying, Puntan told his sister Fu'una to make his body into the world: his eyes became the sun and the moon, his eyebrows rainbows, his chest the sky.\n\nFu'una settled on the island of Guahan and turned herself into a giant rock, which split open and released all human beings. The ancient Chamorro venerated their ancestors but did not, it seems, worship gods in a formal religion.\n\nIn 1623 Christoph Carl Fernberger reported human sacrifice to placate a great fish. In 1672 the priest Diego Luis de San Vitores, who had baptised a child against its father's wishes, was killed together with his catechist Pedro Calungsod."
 qat_religion_desc: "The $qat_religion$ $common_folk_religion_desc$\n\nQat religion is the traditional faith of Vanuatu, an animism built on mana, a transferable spiritual power, on tabu, and on the worship of ancestral spirits. Named figures varied by region: Qat in the Banks Islands, Tagaro on Ambae, Lisepsep across the archipelago.\n\nQat is the principal god of Banks Islands mythology. He was never formally worshipped, yet he was credited with the world itself, night, death and women. He carved the first men and women from dracaena wood and drummed them into life, and he cut through the night with a piece of red obsidian to make dawn.\n\nHis companion was the spider Marawa, and his eleven brothers were all named Tagaro. The Banks Islands were the first part of Vanuatu seen by a European, when Pedro Fernandez de Quiros sailed past in 1606."
 rabha_religion_desc: "The $rabha_religion$ $common_folk_religion_desc$\n\nThe Rabha religion belongs to the Rabha, a Tibeto-Burman people of the plains of Lower Assam and the Dooars. Historically they were matrilineal and lived by farming, shifting cultivation, forest gathering and weaving."
 rebba_religion_desc: "The $rebba_religion$ $common_folk_religion_desc$\n\nThe Rebba religion belongs to the Gumuz, a people of the lowlands along the Blue Nile and its tributaries on the Ethiopian and Sudanese border. They traditionally believe in spirits called mus'a that dwell in houses, granaries, fields, trees and mountains, and ritual specialists called gafea deal with them."
 rmaism_desc: "The $rmaism$ $common_folk_religion_desc$\n\nRmaism is the traditional religion of the Rma, or Qiang, of western Sichuan, a pantheism of gods of nature and human affairs and of Qiang progenitors. The God of Heaven, Mubyasei or Abamubita, is supreme.\n\nIts central rite is the worship of white stones, which ritual is said to invest with the power of gods. Five, seven or nine pieces of white quartz stand on the roof of a house, the largest for the sky god, and cypress boughs are burned before them.\n\nRites are led by priests called shibi, shamans who train for years under a teacher and keep Qiang theology, history and myth. By the Ming dynasty the name Qiang was kept only for the non-Han people of the upper Min valley, and the wars of the 1580s brought heavy official repression."
 rogo_miki_religion_desc: "The $rogo_miki_religion$ $common_folk_religion_desc$\n\nIts followers lived in the Mossi kingdoms of the Volta basin, among them Wagadugu, Yatenga, Tenkodogo and Boussouma."
 romuva_desc: "The traditional beliefs of the $lithuanian_group$ people, it contains a whole pantheon of gods, as well as reverence for nature and the ancestors. Its ceremonies are performed with fire altars, around which ritual hymns or dainos are sung.\n\nThe Romuva pantheon was headed by Dievas, the sky god, with Perkūnas the thunder god, tied to the oak, executing his will. Žemyna was the earth goddess, Velnias lord of the dead, and Laima gave out fate.\n\nLithuania was Europe's last pagan state, and the Teutonic Knights crusaded against it for generations. Mindaugas was baptised in about 1250, but his people did not follow. In 1387 Jogaila, King of Poland, brought baptism to Lithuania proper, and Samogitia was the last region to convert, in 1413.\n\nThe old faith faded slowly. In 1547 Martynas Mažvydas's catechism urged readers to give up the cult of Žemėpatis, and fragments survived into the early 1800s."
 salishan_totemism_desc: "The $salishan_totemism$ $common_folk_religion_desc$\n\nSalishan Totemism is the traditional belief of the Coast Salish peoples, who live along the Salish Sea and Puget Sound from southern Vancouver Island to the Olympic Peninsula. Their nations speak different languages but share a world of guardian spirits and of transformation between human and animal forms.\n\nTraditionally, a person sought a spirit power alone, through isolation and vision quests, and the power was tied to an animal such as the raven, bear or seal. In winter, spirit dances were held on the floors of cedar longhouses, where members showed their powers in song, dance and masks.\n\nA person was thought to have several souls, and a sick man’s soul might be carried towards the underworld. A shaman journeyed there to bring it back; the Duwamish held a ceremony of soul recovery."
 samaritanism_desc: "The traditional faith of the $samaritan_culture$, it emerged from $judaism$ after the fall of the Kingdom of Israel. $samaritanism$ considers itself to be the unchanged faith of the $israelite_group$ people from the times of Moses, in contrast to what they believe is a corruption of the scriptures by $judaism$.\n\nThe Samaritans call themselves Israelites. Scholars place the origin of the community in Samaria, its distinct identity taking shape in Persian and Hellenistic times. Their only scripture is the Samaritan Torah, and they reject the later Jewish canon and rabbinic tradition. Their holy mountain is Gerizim, not the Temple Mount in Jerusalem. A hereditary high priest leads the worship there, and the Passover sacrifice is offered each year.\n\nBy the 14th century the community was small. The high priestly line of Eleazar died out in 1624, passing the office to the descendants of Ithamar, and by 1786 only about a hundred Samaritans remained."
 sammitiya_desc: "One of the many branches of early $buddhist$ in $india$, $sammitiya$ developed in $sindh_area$ becoming a great center of early $buddhist_ADJ$ schools even rivaling the Mahāyāna Nālandā. Being the biggest non-Mahāyāna $buddhist$ in $india$, it was removed from its place of prominence with the $muslim_ADJ$ invasions.\n\nThe Saṃmitīya was a branch of the Vātsīputrīya, themselves descended from the Sthavira order. Its followers were called personalists: they held that a person, or pudgala, is neither the same as the five aggregates nor different from them, and that this person is what is reborn and reaches nirvāṇa. Other schools attacked the idea as a disguised self.\n\nThe school was strongest in Sindh and Gujarat. When Xuanzang travelled in India in the seventh century he found it the largest of the non-Mahāyāna orders, and Yijing, writing in the 690s, reported that its monastic college at Valabhi rivalled Nālandā.\n\nIn Sindh, where it held most of the monasteries, the Arab conquest brought Islam and the school lost its base. It lingered in India until Buddhism itself vanished there."
 samoyedic_paganism_desc: "The $samoyedic_paganism$ $common_folk_religion_desc$\n\nSamoyedic Shamanism is the traditional belief of the Samoyedic peoples of northern Siberia, the Nenets, Enets, Nganasans and Selkups, who lived by hunting, fishing and reindeer herding. It is a shamanistic and animistic system that stresses respect for the land.\n\nAmong the Nenets, the sky god Num was the good creator and high god, while his malevolent son Nga ruled the world below. The shaman, called a tadibya, could travel beneath the earth to Nga. In one tale, one who did so married Nga's daughter and came to hold up the world as the Old Man of the Earth. On the migrations a sacred sleigh carried bear skins and figures, and only elders opened it for rituals.\n\nThe Russians reached the Selkups about 1628 and later tried to convert them. Many kept their old religion."
 sanamahism_desc: "The $sanamahism$ $common_folk_religion_desc$\n\nSanamahism is the ethnic religion of the Meitei people of the Imphal valley in Kangleipak, later Manipur. It takes its name from Lainingthou Sanamahi, the eldest son of the supreme god Sidaba Mapu, and the court chronicle Cheitharol Kumbaba traces it back to King Pakhangba.\n\nThe faith is polytheistic. Its chief deities include Sanamahi, Sidaba Mapu, Pakhangba and the wealth goddess Imoinu, while the umang lai, gods of the sacred groves, are honored at the Lai Haraoba festival. Every house kept a leipung, a mound in the courtyard that stood for the first land of creation.\n\nIn the early eighteenth century Hindu priests from Sylhet won King Pamheiba over to Vaishnavism. He made Hinduism the state religion in 1717, and in 1729 brought nearly all the Meitei into it. Sanamahi nonetheless stayed a household god."
 sangirese_religion_desc: "The $sangirese_religion$ $common_folk_religion_desc$\n\nMasade, called Old Islam by outsiders, is a religion of the Sangihe Islands between Sulawesi and Mindanao. It grew out of the first spread of Islam in the archipelago, brought in the fifteenth century by an Arab named Maulana Moe'min with the support of Lamauge, a Muslim kingdom subject to Tabukan.\n\nUnder King Samangsialang there arose an imam known as Mawu Masade, who gave the faith its name. Its practice kept its own forms: prayer was held once a week, on Friday, with the imam standing among worshippers seated in a circle, and the rite called Diko'u Soro was held three days before the end of Ramadan.\n\nIn the following centuries the Sangihe Islands came under Ternate in the sixteenth century. Spanish rule followed, and from 1677 Dutch rule."
 sanjiao_desc: "Called the 'Three Teachings', it is the combined blend and influences of $confucianism_policy$, $daoism_policy$, and $buddhist$. Being all three present in $china$ for centuries, and also influencing and being influenced by many other $chinese_group$ folk beliefs and deities, they have not always been in harmony among each other, but they have always been part of the $chinese_group$ way of life.\n\nIn the Three Teachings, Confucianism supplied the ethics of family, state and ritual, Daoism the cosmos of the Dao, immortality and the folk gods, and Buddhism the doctrines of karma and rebirth. Under the Song, Neo-Confucianism, which rejected the mystical side of the others, came to dominate learning.\n\nYet the idea that the three were one grew ever stronger. Wang Chongyang of Quanzhen taught that Buddhism and Daoism had always been one family, and halls like the Hanging Temple at Hunyuan enshrined Confucius, Laozi and the Buddha together.\n\nIn the Ming, Lin Zhao'en (1517–1598) founded a society to join the three teachings, which became the Sanyi sect. A local official condemned it as heterodox in 1585, but after his death Lin was worshipped as the Lord of the Three-in-One in over a thousand temples."
 sao_religion_desc: "The $sao_religion$ $common_folk_religion_desc$\n\nThe Sao religion was the traditional belief of the walled city-states that stood around Lake Chad and along the Chari River. Each city was headed by a divine ruler who made few public appearances and then stayed hidden behind a screen, and oral tradition says the Sao clans were united by a single language and a single religion.\n\nThe Sao buried their dead in funerary urns and made bronze and terracotta figures of people and animals. After the Bornu empire expanded in the 1500s the Sao ceased to exist as a separate culture, and conversion to Islam changed their identity; the Kotoko inherited their city-states, and the Sara and other peoples trace their descent to them."
 sapmi_shamanism_desc: "The traditional religions practices of the $sapmi$ people, it contains a multitude of natural and animal spirits, as well as veneration of the dead. Some of the animals are particularly revered, like reindeer and bears.\n\nIn the animism of the Sámi of Sápmi, every notable thing in nature, from animals to rocks, was thought to have a soul. Beliefs varied from region to region. Common figures were Beaivi, the sun goddess and mother of humans, the thunder god Horagalles, and Jahbme-akka, mistress of the dead. Families offered reindeer at sieidis, unusual stones or landforms that were holy places, and the noaidi, or shaman, went into trance with a reindeer-hide drum to reach saivo, the underworld.\n\nCatholic missionaries arrived in the thirteenth century. Pressure grew after the Reformation, when many drums were burned or confiscated in the 1600s and 1700s."
 sarna_religion_desc: "The $sarna_religion$ $common_folk_religion_desc$\n\nSarnaism is the nature religion of the tribal peoples of the Chota Nagpur Plateau in eastern India, among them the Santal, Oraon, Ho and Munda. Its name comes from the Mundari word for a sacred grove, where the faith is practised. Its core principles are reverence for water, forest and land.\n\nEach village has its sacred grove of sal trees, the home of the village deity, Gram Deota, where the whole community gathers for sacrifices twice a year, led by the village priest, the pahan. The groves are strictly protected: felling trees or harming animals is forbidden by custom.\n\nThe main festival is Sarhul, when ancestors are worshipped. The pahan brings three pots of water to the grove; if the level drops, the monsoon will fail, and if it holds, the rains will come."
 satsana_phi_desc: "The $satsana_phi$ $common_folk_religion_desc$\n\nSatsana Phi is the old native religion of the Tai peoples, among them the Shan, the Dai of Yunnan, the Lao and the Ahom of Assam. It is based on the worship of spirits called phi, of the vital forces called khwan, and of ancestors, and it was dominant until Hinduism and Buddhism arrived.\n\nGuardian spirits watched over temples and the town pillar, the lak mueang, while others were old sky gods, the phi thaen. Everyone was thought to hold thirty-two khwan, and in the baci ceremony the lost khwan were called back and cotton strings tied round the wrist.\n\nThe Ahom carried the faith from Möng Mao into Assam with Sukaphaa in 1228. After 1397 Brahmin influence grew at court, and King Suhungmung, who reigned from 1497 to 1539, took the Hindu title Swarganarayana."
 sedang_religion_desc: "The $sedang_religion$ $common_folk_religion_desc$\n\nThe Sedang religion is the traditional animism of the Sedang, a Bahnaric-speaking highland people of Kon Tum and the neighbouring parts of Quang Nam and Quang Ngai in central Vietnam. Their festivals follow the swidden farming year, with one at the sowing in early July and another in early August, when the rice has turned green."
 seri_religion_desc: "The $seri_religion$ $common_folk_religion_desc$\n\nThe Comcaac religion is the traditional belief of the Comcaac, whom the Spanish called Seri, a people of the Gulf of California coast of Sonora. They did not develop a complex system of religious governance. Their view of the world, their rites and their festivals stayed close to nature.\n\nTheir main rites marked the onset of puberty and death, and their songs and stories turned on the sea, the animals and the ancient feats of heroes and warriors. They were never formally evangelized in colonial times, so their beliefs took in none of the Catholic elements found among many neighbouring peoples.\n\nThey fought the Spanish fiercely. In the 1660s a Spanish posse killed most of the adults of one band and handed the children out among the towns of Sonora."
 shamanism_desc: "A shared set of practices and beliefs centering of the figure of the shaman, and individual capable of interacting with the spirit world and access the spirits or the spiritual energy to afect the physical world. Its specifics of spirits, gods, or rituals may vary, but the core concept of the spiritual world and its interactions with the material world remains in all $shamanism_ADJ$ practices.\n\nShamans enter altered states such as trance to deal with the spirit world, and were believed to heal the sick, divine, speak with spirits and escort the souls of the dead to the afterlife. A Buryat epic tells of the first shaman, Kara-Gürgän, who could create life.\n\nThe word shaman itself comes from a Tungusic language, probably Evenki or Manchu, and reached English via Russian. The Dutch statesman Nicolaes Witsen carried it to western Europe in his book of 1692."
 shia_desc: "The basis of the $shia_ADJ$ faith is that Muḥammad designated 'Alī ibn Abī Ṭālib as his successor as the spiritual and political leader of $muslim$. As such, the $imamate$ is to follow 'Alī's line rather than the one established by 'Abū Bakr when he was chosen as $rank_empire_muslim_ruler_male$ at the meeting of Saqīfah by the companions of Muḥammad.\n\nShiism reveres Ali ibn Abi Talib as Muhammad's cousin and son-in-law, and holds that his descendants, the Imams, are infallible guides. The martyrdom of Husayn at Karbala in 680 is mourned every year on Ashura.\n\nThe main branches differ over the line of Imams. Twelvers recognise twelve, the last of whom, the Mahdi, lives hidden in occultation; Ismailis follow Ismail ibn Jafar; Zaydis, the closest to Sunnism, are found in the highlands of Yemen.\n\nIn 1337 the Sarbadars, a Shia-ruled state, were newly established at Sabzevar in Khorasan. The great turning point came in 1501, when Ismail I made Twelver Shiism the official religion of Safavid Iran and a largely Sunni population was converted, often by force. After the Safavids fell in 1736, the Usuli school gained ground over the Akhbari."
 shinto_desc: "The diverse set of beliefs and practices revolving around Kami worship that were present in $japan_region$ before the arrival of $buddhist$ got intrinsically tied to and blended with $buddhist_ADJ$ practices and concepts as $buddhist$ spread through $japan_region$. The Kami and $buddhist_ADJ$ deities were identified with one another, with both sets of beliefs becoming functionally inseparable. This gave rise to a particularly $japanese_group$ flavor of $buddhist$ blended with a $buddhist$-influenced Kami worship.\n\nShintō has no founder or central authority. The kami are believed to dwell in mountains, rivers, trees and ancestors, and the rites are performed at shrines by priests called kannushi. Its oldest written traditions are the Kojiki of 712 and the Nihon Shoki, and the Ise Shrine, home of the sun goddess Amaterasu, is its holiest site.\n\nBuddhism reached Japan in the sixth century, and from the eighth the kami were drawn into Buddhist cosmology. Shrines and temples were joined, and under the theory of honji suijaku the kami were taken to be local manifestations of buddhas, Amaterasu being identified with Dainichi Nyorai.\n\nIn the Sengoku period Yoshida Kanetomo (1435–1511) built Yoshida Shintō, which tried to give the kami an authority independent of Buddhism. It dominated shrine affairs until the late Edo period."
 sikhism_desc: "A religion founded by the teachings of the $character_title_guru$, it originates from the varied $hindu_ADJ$ faiths of $india$, and incorporates many influences from $muslim$. It believes in one creator, $sikhism_god_name$, and to conduct oneself honestly and selflessly for the benefit of all. It encourages connection with the divine through the use of contemplation and meditation, as well as recitation and music as ways to be conscious of God's presence.\n\nSikhism arose in the Punjab around the end of the fifteenth century from the teaching of Guru Nanak, who was born in 1469. It drew on the Sant and Bhakti traditions and won converts from both Hindus and Muslims.\n\nNanak named Lahina his successor in 1539, as Guru Angad. Guru Arjan built the first Harimandir Sahib, compiled the Adi Granth and was tortured to death by the Mughal emperor Jahangir in 1606.\n\nThe sixth guru, Hargobind, took up arms; Guru Tegh Bahadur was beheaded at Delhi in 1675 on Aurangzeb's order; and Guru Gobind Singh founded the Khalsa in 1699 and named the scripture, the Guru Granth Sahib, as the last guru. Later Sikh power rose in the Punjab, with Lahore as its capital."
 sinu_religion_desc: "The $sinu_religion$ $common_folk_religion_desc$\n\nThe Zenú, a farming and goldworking people of the Sinú and San Jorge river valleys on Colombia’s Caribbean coast, held women as the symbol of fertility and wisdom. Clay figurines of women were set in graves to stand for conception and rebirth in the underworld, as a seed germinates and grows.\n\nThe dead were buried with music and dance in mounds crowned with a tree hung with golden bells, and with gold breastplates that stood for the pregnancy of women and the virility of men. Each valley was a province, and the three chiefs of Finzenú, Panzenú and Zenúfana shared complementary political, religious and economic duties.\n\nBetween 1510 and 1535 disease and war destroyed the chiefdoms. The Spanish looted the gold of the tombs."
 songhai_religion_desc: "The $songhai_religion$ $common_folk_religion_desc$\n\nThe Songhai and Zarma peoples along the middle Niger in West Africa centre their traditional belief on the holey, spirits approached through possession rites, and on a creator god, Yarkoy. Each hereditary group traditionally revered its own guardian spirit.\n\nThe rulers of Gao adopted Islam around 1009, yet the old practices survived beside it, even after Mali conquered the region near the end of the thirteenth century.\n\nSonni Ali, who ruled the Songhai from 1464 to 1492 and was taught the old rites by his mother, upheld them, which earned him a hostile name in the Muslim chronicles of Timbuktu. Askia Muhammad, who seized the throne in 1493, promoted Islam, but the spirit cults stayed strong in the villages after Morocco destroyed the empire in 1591."
 songsarek_religion_desc: "The $songsarek_religion$ $common_folk_religion_desc$\n\nSongsarek is also what the Garo of the Meghalaya hills call themselves, the ones obeying the deities. Most Garo followed the faith until Christianity spread through the Garo Hills in the second half of the nineteenth century.\n\nIts highest god is Tatara Rabuga, said to be so high that he cannot be reached. His deputy Misi Saljong, god of the sun, crops and fertility, receives the first harvest at the Wangala festival, Susime is goddess of wealth, and Rokkime the mother goddess of rice is honoured at Agalmaka. The gods are appeased with animal sacrifices, and the flight of the wagtail is watched to foretell the season's rain."
 sora_religion_desc: "The $sora_religion$ $common_folk_religion_desc$\n\nThe Sora, or Savara, are a Munda people of the Eastern Ghats hills in southern Odisha and northern coastal Andhra, whose traditional faith is shamanic. The Sora attribute every natural phenomenon to gods, deities or spirits.\n\nThey revere supernatural beings called kittung, who inhabit forests, mountains, villages, rivers and particular places. Sora shamans, the kuran, are usually women who keep the kittung content with yearly rituals, cattle sacrifices, dances and offerings. Traditionally a shaman in trance travels down to the underworld, leaving her body for the dead to speak through, and mourners argue with the dead, laugh at their jokes and weep at their accusations."
 strigolniki_desc: "Emerging in medieval $russian_region$, the $strigolniki$ is a reformist sect critical of the established $orthodox_ADJ$ Church. They condemn the corruption of priests, the selling of sacraments, and the accumulation of wealth by clergy. Favoring a simpler faith focused on personal piety, the $strigolniki_ADJ$ are a target by the $orthodox_ADJ$ Church and state authorities.\n\nThe strigolniki appeared in Pskov in the middle of the fourteenth century and spread to Novgorod and Tver. They denied that the Orthodox clergy held a lawful priesthood, attacked the ignorance of the priests and the fees charged for baptism, penance and communion, and demanded that laymen be allowed to preach.\n\nThe bishops of Novgorod opposed them, and in 1375 a crowd threw three of them, among them the teachers Karp and Nikita, off the bridge into the Volkhov. Persecution and quarrels brought the movement to an end in the early fifteenth century; the last mention of it dates from 1487."
 sui_religion_desc: "The $sui_religion$ $common_folk_religion_desc$\n\nThe Sui, who live in the southern mountain valleys of Guizhou and whose name, meaning water, was fixed under the Ming, are mainly polytheists who also worship their ancestors. Their religion counts more than nine hundred ghosts and gods, who can bring good fortune or bad.\n\nShamans, hired to pray and sacrifice for the sick and the dying, alone could read the Sui script, shuishu, a logographic script of at least five hundred characters used for divination and geomancy. Tradition credits its invention to a sage named Lu Duogong.\n\nThe year turned with the Duan festival, a harvest feast held from September to November, when bronze drums sounded and ancestors were thanked. On its eve and first morning no meat of land animals may be eaten, since breaking the taboo shows disrespect to the ancestors."
 sula_religion_desc: "The $sula_religion$ $common_folk_religion_desc$\n\nThe Sula people live on the Sula Islands in North Maluku, centred on Sulabesi and the south coast of Mangoli. The islands lay under the Sultanate of Ternate, which kept a governor, the Sangadji Sanana, to collect tribute, and in 1652 the Dutch East India Company built the stone fort De Verwachting at Sanana."
 sunni_desc: "$sunni$ holds that the leadership of $muslim$ was passed to 'Abū Bakr when he was chosen as $rank_empire_muslim_ruler_male$ at the meeting of Saqīfah by the companions of Muḥammad, as the Prophet himself did not appoint any successor. It thus reveres the al-Rāshidūn, the first four $rank_empire_muslim_ruler_male$ after Muḥammad, as a model of governance.\n\nSunnism takes its name from the sunnah, the practice of the Prophet. Law rests on the Quran, the hadith and the consensus of scholars, applied through four schools: Hanafi, Maliki, Shafi'i and Hanbali. In creed, most Sunnis follow the Ashari or Maturidi schools of theology.\n\nIn 1337 Sunni rulers held most of the Islamic world, from Mamluk Egypt and the Sultanate of Delhi to the Golden Horde. After Selim I conquered Egypt in 1517 and ended the Mamluk-controlled Abbasid caliphate, the Ottoman sultans, now masters of Mecca and Medina, claimed the caliphate and led the Sunni world against Safavid Iran and its Shia state. In 1744 Muhammad ibn Abd al-Wahhab, drawing on the Hanbali scholar Ibn Taymiyya, allied himself with Muhammad bin Saud in Najd."
 suwo_religion_desc: "The $suwo_religion$ $common_folk_religion_desc$\n\nSũwõ' is the name the Bribri of Talamanca, in what is now Costa Rica, give to the oral traditions that make up their shamanic religion. At its centre is Sibö, the creator and culture hero, a luminous trickster who, according to the tales, defeated the devils called the Sòrburu and planted the sacred seeds at Suràyum, from which the Bribri grew.\n\nThe awápa, shamans, link the human and spirit worlds. They receive magic stones from Sibö in a ritual at a river. The spirit world is the human one turned upside down: the owner of fish takes the fish for yucca, since to him water is earth.\n\nThe Spanish Franciscan missions of the seventeenth century failed to hold the mountains. In 1709 the leader Pablo Presbere led a rising that burned fourteen mission churches."
 tain_feyentun_religion_desc: "The $tain_feyentun_religion$ $common_folk_religion_desc$\n\nThe Mapuche of south-central Chile and southwest Argentina kept their independence from both the Inca and Spanish empires. Their faith has no formal leadership and varies by family and territory, and since the beliefs were passed down orally and later retold through Spanish missionaries, they are not precisely known.\n\nThe cosmos has three planes: the sky, wenu mapu, home of the gods and the ancestors; the earth, where good and evil contend; and the underworld, home of the harmful wekufe spirits. Nature spirits, the ngen, own particular places and punish trespassers.\n\nCommunities held prayer ceremonies, ngillatun, while machi healers and diviners communicated with the spirits. The god Ngünechen, equated by many with the Christian God, is attested only from the nineteenth century."
 tapu_religion_desc: "The $tapu_religion$ $common_folk_religion_desc$\n\nTapu is the Polynesian idea of what is holy and set apart, with a force of prohibition behind it. The word is shared across Polynesia, in Tonga, Samoa, Hawaii, where it is kapu, and in Māori; the English taboo comes from Captain James Cook's visit to Tonga in 1777.\n\nAnything touched by tapu could not be approached or handled, and breaking it could bring sickness or death. A chief's house and belongings were tapu. Priests, among the Māori called tohunga, could declare a fishery tapu to protect it from overuse. In Hawaii the ʻai kapu forbade men and women to eat together and kept pork, most bananas and coconuts from women.\n\nIn 1819 the new king Kamehameha II, with Queen Keōpūolani and the high priest Hewahewa, ended the ʻai kapu by eating with women."
 tengri_desc: "$tengri$ is a type of $shamanism_ADJ$ beliefs of the $turkic_group$ and $mongolian_group$ peoples, centered around the presence of the sky god $tengri_god_name$, who is worshiped as a personification of the universe. However, it also includes other deities, as it reveres nature and the deities that live in it, as well as the ancestors.\n\nTengri, the Eternal Blue Sky, appears in Chinese chronicles as the sky god of the Xiongnu in the fourth century BC. The Secret History of the Mongols, written in 1240, begins with Borte Chino, the Blue Wolf, born with a destiny from Tengri. In 1290 the Ilkhan Arghun told Pope Nicholas IV that the descendants of Genghis Khan, whether they accepted baptism or not, left that for Eternal Tengri to decide.\n\nTengrism's hold lasted until the fourteenth century, when the Golden Horde converted to Islam. After that it was largely submerged, and among the Mongols it lived on mixed with Tibetan Buddhism."
 tepehuan_religion_desc: "The $tepehuan_religion$ $common_folk_religion_desc$\n\nThe Tepehuán are mountain people of the Sierra Madre Occidental whose northern branch, the Ódami, live in southern Chihuahua. Their belief was a polytheism: gods were thought to dwell in idols and fetishes, and to come from underground, the source of all life, so the people owed them sustenance.\n\nJesuits described a principal idol, Ubumarai, a human head on a stone pillar. Shamans cured the sick and led the fasting, prayer and all-night dances called mitotes, held for rain and crops.\n\nJesuit missions began among the Tepehuán in 1596. In 1616 Quautlatas, a baptized messianic leader who bore a broken cross, preached that the angry gods would bless the land once the Spaniards were killed. His rising began the Tepehuán Revolt, put down by 1620."
 theravada_desc: "Called 'School of the Elders', it adheres to the oldest traditions of $buddhist$. It rejects the Mahāyāna $sutra$ and thus the many $bodhisattva$ and the $bodhisattva$ path itself as being available to all. Instead, it focuses on the monastic community as the superior way of achieving enlightenment.\n\nMissionaries carried Theravāda to Sri Lanka under Ashoka. Its scriptures, the Pāli Canon, were written down in the first century BCE and are its sole authority.\n\nIn the eleventh century Sinhalese monks and Southeast Asian rulers began converting the mainland. Anawrahta of Pagan (1044–1077) and Ram Khamhaeng of Sukhothai in the late thirteenth century made it the faith of Burma and Thailand, and by the fifteenth and sixteenth centuries it was the state religion of Cambodia and Laos.\n\nThe Burmese and Thai kings styled themselves Dhamma kings. Ordination lapsed in Sri Lanka, and in 1753 the Thai monk Upali went to Kandy to ordain a new line of monks, founding the Siam Nikāya."
 tibetan_buddhism_desc: "The form of $buddhist$ developed along and around the mountains of the Himalayas emerged from the Mahāyāna tradition, but incorporated many of the esoteric practices of Vajrayāna due to its close contact with India and the later stages of development of $buddhist$ there.\n\nKing Trisong Detsen made Buddhism the state religion of Tibet in the eighth century, inviting Padmasambhava and Śāntarakṣita, the founders of the Nyingma school, and Samye became its first monastery. In the eleventh century the Kagyu and Sakya schools arose from newer translations from India.\n\nThe Mongols took Tibet in the thirteenth century and made Sakya Paṇḍita their viceroy in 1249, and Buddhism became the de facto state religion of the Yuan dynasty. Bön, the older native faith, borrowed heavily from it and stands closest to the Nyingma school.\n\nAfter the Yuan fell in 1368, rival noble families ruled Tibet. Tsongkhapa (1357–1419) founded the Gelug school, whose Dalai Lamas gained the Mongol title in 1578 from Altan Khan; the Fifth Dalai Lama set up the Ganden Phodrang government in the 1640s."
 tiwa_religion_desc: "The $tiwa_religion$ $common_folk_religion_desc$\n\nThe Tiwa, or Lalung, are a Tibeto-Burman people of central Assam and the Meghalaya hills. Among the Hill Tiwa, seven old villages form the ritual as well as the political centre, and each village's chief, the loro, performs judicial and religious duties for a network of settlements.\n\nEvery clan keeps its own place of worship for its titular god, and festivals such as Sogra Phuja and Langkhon Phuja mark the year. At the Jonbeel fair, said to date from the fifteenth century at the latest, a fire worship is performed before the trading begins."
 tokelauan_religion_desc: "The $tokelauan_religion$ $common_folk_religion_desc$\n\nThe religion of Tokelau centred on Tui Tokelau, the chief god of the atolls of Atafu, Nukunonu and Fakaofo, settled from Samoa about a thousand years ago. He was worshipped beside the usual Polynesian pantheon until Christianity came to the islands.\n\nOn Fakaofo, the chiefly island, the marae held a house containing a monumental slab of coral, covered with mats, that personified the god, and the principal chief, the ariki, was chief priest. In May all the people of Tokelau gathered at Fakaofo, marking the new year with a feast, prayers to Tui Tokelau for protection, and offerings of fish, coconuts and pandanus. A fire was lit in the temple, and the people danced through the night."
 tokuah_religion_desc: "The $tokuah_religion$ $common_folk_religion_desc$\n\nThe Wichí live along the headwaters of the Bermejo and Pilcomayo rivers in Argentina and Bolivia, and anthropologists class their faith as animism and shamanism. They worshipped the beings of nature and held that a supreme being, Tokuah, ruled the world.\n\nShamans fought disease with song and rattles, and some used the hallucinogenic plant Anadenanthera colubrina. The Wichí believed in both a good and an evil spirit, and in the souls of the dead being reborn in animals."
 tolaki_religion_desc: "The $tolaki_religion$ $common_folk_religion_desc$\n\nThe Tolaki, the largest people of Southeast Sulawesi, centre their belief on divine beings called sangia. In oral history a princess who appeared at Unaaha in the early tenth century was greeted as Sangia Ndudu, the descended god, and as Wekoila became the first ruler of Konawe."
 tolotang_religion_desc: "The $tolotang_religion$ $common_folk_religion_desc$\n\nThe Bugis of South Sulawesi kept Tolotang, a pre-Islamic belief, above all around Amparita. Its followers honour a single god, Dewata SeuwaE, titled PatotoE, the one who determines fate, and some sources name La Panaungi as the founder.\n\nWorship was directed at stones, wells and the graves of ancestors, and the Lontara manuscripts served as scripture. Rites were led by priests called Uwa, of whom the Uwatta, a descendant of the founder, officiated at weddings. Yearly the community gathered in the Sipulung at the tomb of I Pabbere, bringing rice and side dishes as provisions for the afterlife.\n\nThe Bugis kingdoms turned to Islam in the early seventeenth century. Part of the Tolotang community accepted it and became known as the Benteng, while the Towani Tolotang held to the old rites."
 tomanuru_religion_desc: "The $tomanuru_religion$ $common_folk_religion_desc$\n\nTomanuru, from the Bugis tomanurung, those who came down, is the belief in rulers sent from the upper world that underlies the founding stories of South Sulawesi's kingdoms. Before the fourteenth century tradition tells of two descents: first the sky being PatotoE, called Tamboro Langi, on Mount Latimojong, then his son Batara Guru with his wife We Nyilittimoq, whose arrival marked the rise of local lords.\n\nBone was founded in the early fourteenth century with the Tomanurung ri Matajang, who became its first ruler, La Ubbi. Gowa's line began about 1320 with the marriage of the Tumanurung, the unknown one, to a noble named Karaeng Bayo, and in Soppeng too the state was tied to such a descent."
 totemism_desc: "The $totemism$ $common_folk_religion_desc$\n\nTotemism is the practice, best known in North America, of linking a family, clan or people to an animal or spirit being that serves as its emblem. The word ‘totem’ is an English form of the Ojibwe doodem, and both the word and the beliefs behind it belong to the Ojibwe, though similar ideas are found among many peoples.\n\nThe Anishinaabe are divided into clans called doodeman, mostly named for animals. In their oral tradition the great Miigis beings rose from the Atlantic and gave them the Mide way of life.\n\nOn the Pacific Northwest coast, peoples carve monumental totem poles with bears, birds, frogs, people and supernatural beings. Like heraldry, the poles show the crest of a family or chief, tell stories the family owns, or mark a special occasion."
 tungusic_shamanism_desc: "The $tungusic_shamanism$ $common_folk_religion_desc$\n\nThe word shaman comes from the language of the Tungusic peoples of Manchuria and the Russian Far East, among them the Jurchens, Manchus and Evenks. Their belief is animistic and polytheistic, led by the sky god Abka Enduri, the source of all life, with many gods who enliven every part of nature.\n\nShamans are men and women of unusual ability who can perceive the ways of the gods, and every kin has its own shaman, who conducts sacrifices. The wilder rites for animal gods were forbidden by Hong Taiji in 1636, and by 1673 every communal shrine except the imperial one was banned.\n\nThe Manchus took the soldier-god Guan Yu as one of their gods. In 1747 the Qianlong Emperor published a manual of Manchu rites, translated into Chinese in 1780."
 tunpa_religion_desc: "The $tunpa_religion$ $common_folk_religion_desc$\n\nThe Chiriguanos, also called the Ava Guaraní, were Guaraní-speaking farmers and warriors of the Andean foothills of south-eastern Bolivia. Tumpa, their word for a god, was also the title of the prophets who proclaimed themselves gods and called their people to fight the Spanish.\n\nThe Chiriguanos came from Guaraní who moved west from Paraguay in the early sixteenth century and mixed with the Chané. The Spanish called them people without religion, and until the nineteenth century they were impervious to missionaries: a Jesuit mission in 1767 had only 268 Chiriguano converts.\n\nIn 1778 and 1779 two prophetic leaders, one at Caiza and one at Mazavi, declared themselves gods and urged the Ava Guaraní to attack the Spanish. Both died between 1780 and 1781 after their attacks failed."
 txapakura_religion_desc: "The $txapakura_religion$ $common_folk_religion_desc$\n\nThe Chapacuran-speaking peoples of the Guaporé and Mamoré basin, on the border of Brazil and Bolivia, are best known through the Wariʼ, whose name means we, the people, and who traditionally lived in semi-nomadic riverside villages that they moved at least once every five years.\n\nIn the traditional Wariʼ view, being human is defined against game animals. Hunted animals can also count as human, since they sometimes act as predators, and the human body is a poor guide to who someone is, for it can be drawn into another being's point of view and changed into it. Tales warn of a mother whose child spotted a jaguar's tail between her legs."
 udmurt_paganism_desc: "The $udmurt_paganism$ $common_folk_religion_desc$\n\nThe Udmurts, a Permic people of what is now Udmurtia in Russia, had as their oldest god Inmar, the god of the sky, inherited from the time when the Finno-Ugric peoples were still one. Prayers began by calling on Inmar, Kyldysin and Kuazh; scholars still argue whether these were separate gods or names of a single one.\n\nThe Udmurts also honoured many lesser spirits, such as Vumurt of the water and Nyulesmurt of the forest. Each clan had its own first ancestor and protector, the vorshud.\n\nIn 1557 Ivan the Terrible granted privileges to baptised Udmurt families. Forced conversion began in earnest only in the middle of the eighteenth century, when churches and schools were built and sacred groves and prayer places were destroyed."
 umina_religion_desc: "The $umina_religion$ $common_folk_religion_desc$\n\nUmiña was the emerald goddess of the Manteño, the coastal chiefdoms of what is now Ecuador. Their stories call her the green-eyed daughter of the chief Tohalli. In one version she was murdered and an emerald was taken from her heart; in another she opened her own breast during a drought and became a jewel.\n\nThe stone, said to be as large as an ostrich egg when the Spaniards arrived, was kept in a shrine at Manta, where a priest rubbed it on the sick, so she became goddess of health, fertility and rain. Her worship reached the Caranqui of the Andes, and the Manteño were said to have preferred death to giving her up."
 utaki_religion_desc: "The $utaki_religion$ $common_folk_religion_desc$\n\nThe indigenous belief of the Ryukyu Islands centres on the utaki, sacred places that are usually a grove, spring, cave or mountain near a village, where ancestors and nature gods were venerated. Its holiest spot, the ibi, could be entered only by the noro, the priestesses. The women of the family were held spiritually superior, a belief called onarigami.\n\nSefa-utaki, where the goddess Amamikyu, who gave birth to the Ryukyu Islands, is said to have come down, was the most sacred official site of the Ryukyu Kingdom. In the traditional accounts Shō Hashi united the three kingdoms of Okinawa into one in the early fifteenth century.\n\nKing Shō En made his daughter the kikoe-ōgimi, the chief priestess, in 1469. After Satsuma invaded in 1609, Confucian thought wore down the priestesses' authority."
 vaghua_religion_desc: "The $vaghua_religion$ $common_folk_religion_desc$\n\nThe Vaghua-speaking people live on Choiseul Island in the Solomon Islands, called Lauru by its inhabitants. Spaniards under Alvaro de Mendana sighted the island in April 1568 and charted it as San Marcos."
 vainakh_paganism_desc: "The $vainakh_paganism$ $common_folk_religion_desc$\n\nThe Vainakh peoples of the North Caucasus, the Chechens, the Ingush and the Batsbi, were polytheists before Christianity and Islam took hold among them. Their roots were the worship of natural forces, ancestors and spirits, with trees thought to be spirits' homes.\n\nDela was the supreme god and creator of the world, and Sela, the thunder god, was honoured beside him. The earth rests on the horns of a bull, and no Chechen or Ingush worked on Tuesday, the day of the bulls.\n\nThe Tkhaba-Yerdy church in what is now Ingushetia, said to have been built over an older pagan temple, was remodelled under Queen Tamar of Georgia between 1184 and 1213. Islam, present among the Chechens since the fourteenth century, spread only slowly, and the old religion was still strong in the nineteenth century."
 vedda_religion_desc: "The $vedda_religion$ $common_folk_religion_desc$\n\nThe traditional religion of the Vedda, who live as hunters and gatherers in the forests of Sri Lanka, is polytheistic and centres on the dead. The Veddas call their ancestors nae yaku and invoke them for success in hunting. These kindred spirits are held to watch over the living and give them flesh in the hunt.\n\nThe dead are neither good nor bad, and the living treat them like friends and relatives. Well-treated spirits remain kind, but neglected ones withdraw their help or turn hostile.\n\nThe Veddas share the shrine of Kataragama with their Buddhist, Hindu and Muslim neighbours, where the god Skanda is held to have met and married Valli, a Vedda girl. Over time many Veddas took on a nominal Buddhism or Hinduism, while the old rites continued."
 vodun_religion_desc: "The $vodun_religion$ $common_folk_religion_desc$\n\nThe Aja, Ewe and Fon peoples of the coast of what are now Benin, Togo and Ghana have worshipped the vodun, the spirits, since before written records. Vodun has no central authority, text or orthodoxy and is split into small cults, each devoted to a particular spirit.\n\nOne creator, Nana-Buluku, stands above countless vodun. His offspring Mawu-Lisa is a two-part deity, Lisa ruling sun and day, Mawu moon and night. Legba of the crossroads opens the way between people and spirits and is consulted first.\n\nDahomey grew from the Fon of the Abomey plateau, an offshoot of Allada founded about 1600. King Agaja took Allada in 1724 and Whydah in 1727. Through the Atlantic slave trade, followers of Vodun were carried to the Americas."
 votian_religion_desc: "The $votian_religion$ $common_folk_religion_desc$\n\nThe Votians, a Finnic people of Ingria between the Gulf of Finland and Lake Peipus, held an old pagan belief and were counted among the founders of Novgorod. The earliest record of them, in 1069, has them joining Polotsk in an attack on Novgorod, and in the twelfth and thirteenth centuries papal bulls listed them among the pagan tribes.\n\nThey long kept their holy shrines. After Novgorod fell in the 1470s, Moscow deported many Votes and pressed conversion harder, and in 1534 the Archbishop of Novgorod, Macarius, complained to Ivan IV that they were still practising their pagan beliefs.\n\nThe monk Ilja, sent to convert them, destroyed many of the old shrines, and the priest Nikifor continued his work. Slowly the Votes were converted and became devout Orthodox Christians."
 wa_religion_desc: "The $wa_religion$ $common_folk_religion_desc$\n\nThe Wa, an Austroasiatic people of the rugged hills between the Mekong and the Salween rivers, are animists. Wa tales say the first Wa were born of two female ancestors, Ya Htawm and Ya Htai, who lived as tadpoles in a lake called Nawng Hkaeo.\n\nRites centred on blood sacrifice: a village spirit healer met sickness with a chicken, a pig or a larger animal, and a buffalo was killed each year at a shrine's Y-shaped post. By local legend a human head made the rice fields fertile, and the Wa of the wilder hills were known as headhunters; those beside the Dai and Shan took up Theravada Buddhism and abandoned the practice."
 waaqeffanna_religion_desc: "The $waaqeffanna_religion$ $common_folk_religion_desc$\n\nAmong the Oromo and other Cushitic-speaking peoples of the Horn of Africa, the followers of Waaqeffanna, the Waaqeffataa, worship one God, Waaqa Tokkicha, who is said to have many names and is also called the Black God. Waaqeffanna has no canonical scripture and was handed down orally.\n\nWaaqa acts through the ayyaana, spirits that carry messages but cannot create; they possess the men and women who become qaalluu, priests and ritual leaders. The Abbaa Muudaa, the Father of Ointment, was the highest qaalluu, and pilgrims travelled far with a bull and a sheep to be anointed.\n\nThe thirty-year struggle of 1529 to 1559 among Waaqeffanna followers, Christians and Muslims weakened all three. Many Oromo were later drawn into Muslim sultanates and the Christian Ethiopian Empire."
 waldensian_desc: "Founded by Peter Waldo, the $waldensian$ is a reformist $christian_ADJ$ movement emphasizing simplicity, poverty, and the authority of scripture. They reject clerical wealth, the veneration of saints, and the necessity of sacraments for salvation. Persecuted as heretics, the $waldensian_ADJ$ movement have endured centuries of oppression while spreading their message across $europe$.\n\nThe Waldensians began in the late twelfth century as the Poor of Lyon, followers of Peter Waldo, a wealthy merchant who gave away his property around 1173 and preached apostolic poverty and lay preaching. Excommunicated in 1184, they were declared heretics in 1215 for refusing to accept the bishops' control over preaching.\n\nThe movement spread to the Cottian Alps, where preachers called barbas met small secret congregations. Persecution never ceased, and Pope Innocent VIII issued a bull in 1487 ordering their extermination.\n\nAt the Synod of Chanforan in 1532 the Waldensians joined the Reformed tradition and began to worship openly in French. Massacres followed, notably the Piedmont Easter of 1655. In 1689 their pastor Henri Arnaud led the exiles in the Glorious Return to their valleys."
 wan_aisa_religion_desc: "The $wan_aisa_religion$ $common_folk_religion_desc$\n\nThe Miskito, whose land runs along the Mosquito Coast from Cape Camarón in Honduras to the Río Grande de Matagalpa in Nicaragua, were in the era before the Miskito kings polytheists, with gods of the sun (Lapta), the moon (Kati), thunder (Alwani) and the sea, lakes and rivers (Lidawanka). No human sacrifices are recorded.\n\nThe shaman, called sukya, healed by finding cures in dreams and blowing smoke on the afflicted place. One leading shaman at a time, the Supreme Sukya or Okuli, spoke for the evil spirits called Lasas and was revered by neighbouring tribes.\n\nIn the seventeenth century English privateers allied with the Miskito and began to crown their leaders as kings, opening a long period of European influence on the coast."
 warao_religion_desc: "The $warao_religion$ $common_folk_religion_desc$\n\nThe Warao, the ‘boat people’ of the Orinoco Delta in northeastern Venezuela, tell of their descent: a sky hunter shot a bird that fell through the floor of heaven, and he followed it down to the earth on a rope of heavenly cotton.\n\nThe world, Hobahi, is a circle ringed by water and filled with spirits, the hebu, who may be helpful, harmful or neutral toward people. The chief of them is Kanobo, ‘our grandfather’, who lives in the sacred stone guarded by the greatest shamans, the wisiratu.\n\nThe hebu were kept content with smoke from ritual tobacco and with shaman-led rituals. Without the hebu and the harmful magic of the hoa and the bahana, the Warao held, a person would be immortal."
 wetarese_religion_desc: "The $wetarese_religion$ $common_folk_religion_desc$\n\nThe Wetar people, also called Wetter, are an Ambon-Timor people living on Wetar, an island in the Banda Sea in eastern Indonesia, who speak Wetarese."
 wu_religion_desc: "The $wu_religion$ $common_folk_religion_desc$\n\nIn China the wu and, for men, the xi, served as shamanic mediators between people and the spirits. The word wu is first recorded under the Shang dynasty, when dance and trance were a way of reaching the ancestors.\n\nAs Confucian thinking gained ground the wu lost their place at court and were pushed into popular religion, where Neo-Confucians branded their ecstatic rites as untutored and disorderly. In village and temple they lived on as healers and diviners, among them the tongji, youth mediums who in trance are possessed by a god to give oracles.\n\nIn the northeast a different shamanism took shape with the Tungusic peoples. In 1747 the Qianlong Emperor ordered the publication of a Shamanic Code to regulate rites he feared were being forgotten."
 yage_religion_desc: "The $yage_religion$ $common_folk_religion_desc$\n\nThe Andaquí were a people of the upper Caquetá basin and the valleys of the Fragua and Suaza in southern Colombia. Their name is tied to the ritual drinking of yagé, a brew for which the shamans add the flowers of the borrachero tree to meet the ‘spirit of the yagé’. In their myth the borrachero’s giant flower became the sun after the yagé entered and fertilized it.\n\nShamanic healing was part of the Andaquí trade between the Andes and the forest. They joined the Pijao against a Spanish settlement in 1637 and the general uprising of the Putumayo and Caquetá tribes in 1721, and resisted into the eighteenth century."
 yanolop_religion_desc: "The $yanolop_religion$ $common_folk_religion_desc$\n\nIn the creation myth of the Yapese, the islanders of Yap in the western Carolines, the god Gavur li yel yel makes the four layers of the cosmos, from his own dark tier to the underworld beneath the sea, and shapes the chief god Yanolop from clay.\n\nYanolop in turn conjures five more sky gods, who marry and beget further generations. Yälfaath the Elder, one of the first sky gods, made the first man and woman, Ganan and Nik, from earth.\n\nTraditionally each person has two souls: one that lives on and wanders the earth, and one that dies and is eaten by the sky god Lug. After death a ritual prayer guides the soul to Gatsam, from where it may go to heaven and be judged in Yanolop's clubhouse."
 yao_religion_desc: "The $yao_religion$ $common_folk_religion_desc$\n\nThe Yao, a Hmong-Mien-speaking people of Hunan and Guangxi, trace their descent to the ancestor Panhu, a dog turned into a man. Since the thirteenth century their faith has been so thoroughly mixed with Taoism that it is often called Yao Taoism: the principal gods are the Three Pure Ones of canonical Taoism.\n\nEvery adult Yao man is initiated into the Taoist clergy through four grades, the first called hanging the lamps. High priests perform the rites for the higher gods.\n\nThe hunter god Zhang Wulang acts as exorcist and guide of souls, because the dead are believed to return to the Caves of Meishan to find peace. After the Miao and Yao risings of the 1370s and 1449 many moved south into Guangxi, Guangdong and Yunnan."
 yastay_religion_desc: "The $yastay_religion$ $common_folk_religion_desc$\n\nYastay was remembered as the protector of the mountain animals and of the hunt in the Andes of north-western Argentina and Chile, where the Diaguita lived. In a legend of their neighbours the Huarpe, Yastay warned the proud hunter Gilanco to stop killing animals for sport. When Gilanco ignored him, Pachamama, the earth mother, swept him away in a whirlwind of hot wind, and the Zonda is said to blow whenever someone disobeys her.\n\nThe Diaguita had no priestly class, only a shaman in each village who led the rites and healed the sick. Their lands fell to the Inca in the late fifteenth century, and from 1560 to 1667 they fought the Calchaquí Wars against the Spaniards."
 yazidism_desc: "Emerging from an $iranian_group$ tradition, it also contains elements from $judaism$, $christian$, and $muslim$. It beliefs that the universe was created by God but that he appointed the 'Peacock Angel' Tawûsî Melek to rule over it. Although it contains many influences by other religions, especially in its esoteric practices, its core is rooted in the ancient $iranian_group$ religions.\n\nThe Yazidis speak Kurdish. Their faith was reshaped in the 12th century by the Sufi mystic Sheikh Adi ibn Musafir, who settled at Lalish, the holiest place of the faith. Yazidis believe that God entrusted the universe to seven angels, chief of whom is Tawusi Melek.\n\nThey hold to the transmigration of souls and revere the sun, sacred springs and fire. The community is divided into three endogamous castes, the murids, sheikhs and pirs.\n\nNeighbouring Sunni Kurds sacked Lalish in 1414. Yazidism was once the religion of Kurdish emirates such as Bohtan, but from 1566 an Ottoman fatwa by the mufti Abu al-Su'ud licensed the killing and enslavement of Yazidis."
 yopo_religion_desc: "The $yopo_religion$ $common_folk_religion_desc$\n\nThe Sikuani, also called Guahibo, live on the savannas of the Orinoco Llanos in eastern Colombia and western Venezuela. Their faith is named for yopo, the ground seeds of the yopo tree, which a shaman, the dopatubinü, inhales to communicate with Tsamani, the giver of traditional medicine.\n\nThe Sikuani say that the goods enjoyed by humanity came from four brothers who climbed to the sky and can be seen as the Pleiades. Life and all the edible plants sprang from a great tree, Kaliawirinai, felled by Kutsikutsi with the help of the squirrels. Every dead Sikuani was honored with a second funeral, the itomo."
 yukaghir_shamanism_desc: "The $yukaghir_shamanism$ $common_folk_religion_desc$\n\nThe Yukaghirs hunted deer, moose and sable in the Kolyma basin of north-eastern Siberia, and their tribal groups reached from the Lena to the mouth of the Anadyr when the Russians arrived in the seventeenth century. They worshipped the spirits of their ancestors, fire, the Sun, hunting, earth and water. The most important was the Sun, the highest judge in every dispute.\n\nEvery clan had a shaman, who after death was treated as a deity: his body was dismembered and the clan kept the parts as relics. Dog sacrifice, a cult of the elk with its hunting taboos, and an epic poem about crows belonged to the old hunting life."
 yuman_religion_desc: "The $yuman_religion$ $common_folk_religion_desc$\n\nThe Yuman-speaking peoples of the lower Colorado River, southern California and Baja California each told their own stories. The Mohave knew a creator, Matavilya, who gave the people their clans. His younger brother Mastamho gave them the river and taught them to plant, and young Mohave took Datura as a sacrament when they came of age. For the Kumeyaay the world was first all salt water and tule; the brothers Tuchaipa and Yokomatis made it, and Tuchaipa raised the heavens by blowing tobacco smoke three times.\n\nKumeyaay sacred mountains such as Kuuchamaa were hubs of spiritual power, and Coyote was the trickster who changed the world with clever and mischievous deeds. Among the Cochimí, shamans wore capes of human hair on ceremonial occasions."
 yupik_shamanism_desc: "The $yupik_shamanism$ $common_folk_religion_desc$\n\nThe Yup'ik of western and south-western Alaska, around the Yukon-Kuskokwim delta and Bristol Bay, were animists. The shaman was the central figure of religious life and the middleman between spirits and people, working through music, dance and masks.\n\nThe Yup'ik believed that the great sea and land mammals they lived on understood human speech and demanded respect, so hunting followed rules to honour and appease their spirits. The qasgiq, the men's communal house, was the ceremonial centre; the shaman told carvers how to make the masks worn in its dances, and the masks were destroyed after use. The Bladder Festival and the Messenger Feast were among the great ceremonies."
 zemi_religion_desc: "The $zemi_religion$ $common_folk_religion_desc$\n\nThe Taíno of the Greater Antilles centred their faith on the zemi, which was both an ancestral spirit or deity and the sculpted object that housed it. Zemis were carved from wood, bone and stone, the most characteristic form being a three-pointed stone. Priests called behikes served them, and myths were sung and danced at ceremonies called areítos.\n\nYúcahu, son of the mother goddess Atabey, gave the cassava harvest. The creator Yaya killed his son Yayael and hung his bones in a gourd, from which fish poured out. The Sun and Moon were said to have come out of the cave of Iguanaboina.\n\nAfter Columbus arrived in 1492 the cult was driven underground. The Taíno are thought to have hidden or destroyed their zemis to keep them from the Spanish."
 zoroastrian_desc: "An ancient $iranian_group$ religion following the teachings of Zoroaster, also called Zarathustra, and the texts of the Avesta. It is based on a dualistic cosmology of good and evil, with the eternal conflict of the deity Ahura Mazdā and the destructive spirit Angra Mainyu, with a predicted ultimate triumph of good over evil.\n\nZoroastrians hold that humans must choose truth over the lie through good thoughts, words and deeds, joining the struggle until good triumphs. Fire is held sacred as the symbol of Ahura Mazda and is tended in temples by priests. Zoroastrianism was the state religion of the Achaemenid and Sasanian empires until the Arab conquest in the seventh century.\n\nUnder Muslim rule Zoroastrians became a minority. After the Mongol conquest the community withdrew to Yazd. The Parsis of Gujarat moved their Iranshah fire to Navsari in 1419, and in 1478 a layman travelled to Yazd with the first of the Rivayats, letters of ritual questions to Iranian priests. From 1501 the Safavid campaign to make Iran Shia bore heavily on the Zoroastrians who remained."
 abenakian_group_desc: "The $abenakian_group$ $group_text$ $abenakian_language$ language.\n\nThe Abenakian peoples are Algonquian-speaking peoples of the Northeastern Woodlands. Abenaki comes from Wôbanakiak, ‘People of the Dawn Land’, the name of the country in what is now New England and the Maritimes. Eastern Abenaki was spoken mainly in Maine, Western Abenaki in Quebec, Vermont and New Hampshire, and the Penobscot, Passamaquoddy, Maliseet and Mi'kmaq are their neighbors in the Wabanaki Confederacy.\n\nThe Abenaki had no central government. After contact with Europeans in the 1600s, colonization, disease and war decimated the original tribes, and the survivors drew together as a single post-contact community."
 aikana_group_desc: "The $aikana_group$ $group_text$ $aikana_language$ language.\n\nThe Aikanã are an Indigenous people of the western Amazonian lowlands, in what is now the Brazilian state of Rondônia. They are also known as the Massacá, Tubarão and Mundé, and their language has no known relatives."
 aingae_group_desc: "The $aingae_group$ $group_text$ $aingae_language$ language.\n\nThe Cofán call themselves the A'i and speak A'ingae. Their homeland lies in northeastern Ecuador and southern Colombia, between the Guamués and Aguarico rivers.\n\nIn the late sixteenth century they resisted Spanish colonization and destroyed the Spanish town of Mocoa. The Jesuit Rafael Ferrer, who arrived in 1602, was driven out only after soldiers and colonists tried to follow him. European diseases then caused their numbers to collapse, from about 15,000 in the mid-sixteenth century."
 algic_group_desc: "The $algic_group$ $group_text$ $algic_language$ language.\n\nThe Wiyot and the Yurok are the westernmost peoples to speak an Algic language. Their languages are only distantly related to the Algonquian languages of the east.\n\nThe Wiyot, who called themselves Ku'wil, ‘the People’, lived from the Mad River through Humboldt Bay to the lower Eel River, in a land of redwood forest, sandy shore and tidal marsh. The Yurok held the Klamath River and the northern California coast from Trinidad almost to Crescent City. The two peoples were culturally similar."
 amazigh_group_desc: "The Amazigh people, also known as Berber, are an ethnic group from North Africa. Their strong sense of identity clashes with the Arabic invaders that have been shaping their home regions since centuries ago.\n\nAmazigh communities stretch from the Atlas and Kabylia to the Tuareg of the Sahara. The Guanches of the Canary Islands were related to them. Ancient Amazigh peoples founded the kingdoms of Numidia and Mauretania.\n\nAfter the Arab conquests of the seventh and eighth centuries the region slowly Arabized, yet the Amazigh kept their languages, and the Almoravids and Almohads ruled the Maghreb and al-Andalus from the eleventh century. In 1337 the Marinids, Zayyanids and Hafsids held the Maghreb, and Castile conquered the Guanches in the fifteenth century."
 andean_group_desc: "Living in or near the Andes, the people of this mountainous region are adapted to a lifestyle that is well suited for the many different climates and terrain of the highlands. This common lifestyle connects the rich cultures and civilizations of the Andes.\n\nAndean peoples ranged from southern Colombia through Ecuador and Peru to northern Chile, along the Andes and on Peru's desert coast. They domesticated potatoes, peppers, manioc and coca, wove fine textiles and built monumental architecture. Caral dates to about 3500 BCE; later came Chavin, Moche, Nazca, Wari and Tiwanaku, and the coastal kingdom of Chimor, which lasted until about 1470.\n\nAround 1230 the Kingdom of Cuzco arose in the highlands. From 1438 the Incas bound most Andean cultures into Tahuantinsuyu, the largest empire the Americas had seen. Spanish conquerors arrived in the sixteenth century and brought the Andes under the Spanish crown."
 anishinabe_group_desc: "The $anishinabe_group$ $group_text$ $anishinabe_language$ language.\n\nThe Anishinabe peoples of the Great Lakes include the Ojibwe, Odawa and Potawatomi, together with the Algonquin and Nipissing, all Algonquian speakers. At first contact with Europeans they lived in the Northeast Woodlands and the Subarctic.\n\nThe Ojibwe are known for birchbark canoes, copper trade, wild rice and maple sugar, and for the Midewiwin society, which keeps their oral history and songs on birchbark scrolls. The Odawa, whose name means ‘to trade’, settled on Manitoulin Island and the Bruce Peninsula and after the 1600s spread along the Ottawa River and into Michigan and Wisconsin. The Ojibwe, Odawa and Potawatomi were allied in the Council of Three Fires."
 apsaalooke_hiraaca_group_desc: "The $apsaalooke_hiraaca_group$ $group_text$ $apsaalooke_hiraaca_language$ language.\n\nThe Crow, or Apsáalooke, and the Hidatsa, or Hiraacá, are two related Missouri River Siouan peoples. Both are said to have come from the Ohio country, and they settled south of Lake Winnipeg in the twelfth or thirteenth century, where they farmed and hunted bison in villages.\n\nThe Hidatsa later settled the Knife River in what is now North Dakota, taking up farming in permanent earthlodge villages. The Ojibwe and Cree drove the Crow west to the upper Missouri in the mid-sixteenth century. In the late seventeenth century they split from the Hidatsa and moved to the Yellowstone valley, and from about 1730 they adopted the horse to hunt buffalo on the Plains."
 arabian_group_desc: "The lands of the Arabian Peninsula are populated by a diverse group of people. From the highlands of Yemen to the oases of the central lands these people have adapted to harsh environments and conditions.\n\nThe Arabs of the peninsula also live in Hadhramaut, the Najd, the Hejaz on the Red Sea, Oman and Bahrain. Before Islam the south held kingdoms such as Saba, Himyar and Hadhramaut, while the centre was largely home to nomadic tribes.\n\nBy his death in 632 the Prophet Muhammad had united the whole peninsula under Islam, and Mecca and Medina in the Hejaz became the holiest cities of the faith. From these lands Arab tribes moved north and west into the Levant, Iraq and the Maghreb, spreading the Arabic language across the region."
 arabic_group_desc: "Since the rise and fall of the Umayyad Caliphate most of the peoples that were under its rule have retained much of their influence and culture even long after its disappearance.\n\nThe Arabic group covers Egypt, the Levant, Iraq, the Maghreb, al-Andalus and Malta. Before Islam, Arabs meant mainly the tribes of Arabia and the Syrian desert, among them the Nabataeans of Petra and the Christian Ghassanids.\n\nThe Rashidun, Umayyad, Abbasid and Fatimid caliphates carried Arab rule as far as southern France and western China, and Arab migrations into the Maghreb and the Levant spread the Arabic language among the conquered peoples. The Umayyad Caliphate of Damascus fell in 750. In 1337 the Mamluk Sultanate ruled Egypt and Syria."
 atacame_group_desc: "The $atacame_group$ $group_text$ $atacame_language$ language.\n\nThe Atacameño live in the Atacama Desert and on the high plateau of northern Chile, northwestern Argentina and southern Bolivia. Their own language was Kunza. They protected their villages with stone-walled forts known as pukara and worked ceramics, copper and gold, and settlements such as San Pedro de Atacama, Quitor and Chiu-Chiu grew up in the oases.\n\nThe Tiwanaku were their first known conquerors, and in the fifteenth century the Inca conquered them and built roads from the Salar de Atacama into northwestern Argentina. Diego de Almagro's Spaniards arrived in 1536, and the region was annexed to Spain in 1557."
 atakapa_group_desc: "The $atakapa_group$ $group_text$ $atakapa_language$ language.\n\nThe Atakapa called themselves the Ishak, ‘the people’. They lived in several bands along the Gulf of Mexico coast of what is now Texas and Louisiana, and spoke a language isolate. Their name was a Choctaw word, taken up by the Europeans who met the Choctaw first."
 atallan_group_desc: "The $atallan_group$ $group_text$ $atallan_language$ language.\n\nThe Manta and Huancavilca peoples of the coast of Ecuador formed the Manteño-Huancavilca culture, one of the last pre-Columbian cultures of the country, which lasted from about 850 to 1600. Their chiefdoms stretched over the coasts of Manabí, Santa Elena and Guayas, as far as La Plata Island.\n\nThey grew maize, peanuts and squash, and dived for Spondylus shells, which they used as currency and traded as far north as Mexico. The Huancavilca are traditionally linked with the legend of the chief Guayas and his wife Quil, from whom Guayaquil is said to take its name."
 atlantic_group_desc: "The Atlantic peoples of West Africa inhabit the coasts and savannas from Senegambia to Sierra Leone, speaking languages of the Atlantic branch of the Niger-Congo family. They include the great horsemen and traders of the Senegambian coast as well as the forest-dwelling Mel peoples of the Sierra Leone hinterland.\n\nThe Atlantic group includes the Wolof, Serer, Jola and Manjak of Senegambia, the Fulbe herders scattered across the Sahel, and the Temne, Bullom and Sherbro of the south. The Wolof formed the Jolof Empire, which emerged from Mali's orbit in the mid-fourteenth century and held much of Senegambia until the defeat at Danki in 1549 left its vassals independent.\n\nPortuguese ships reached the coast in the fifteenth century and found Wolof chiefs advised by Muslim clerics. In the sixteenth century Mande-speaking Mane invaders raided the Sierra Leone coast. In 1725 a Fulbe jihad founded the Imamate of Futa Jallon."
 australian_group_desc: "The Aboriginal peoples of Australia are among the oldest continuous cultures on Earth, having inhabited the continent for at least sixty-five thousand years. Their deep connection to the land, expressed through the concept of the Dreaming, and their sophisticated ecological knowledge make them unique among the world's peoples.\n\nThe ancestors of the Aboriginal Australians crossed from Southeast Asia, by land bridges and short sea crossings, some 50,000 to 65,000 years ago. They formed about 600 nations speaking some 250 languages, complex hunter-gatherers who in places practised fire-stick farming and fish farming. The Dreaming, a sacred account of creation still unfolding, ties each person to the land.\n\nFrom about 1750 Makassarese trepang gatherers visited the northern coast, and a Makassan pidgin became a trade language there. The British landed in 1788, and disease and frontier violence cut the population sharply; in Tasmania the Black War of the 1820s and early 1830s nearly destroyed the Aboriginal Tasmanians."
 austroasiatic_group_desc: "One of the oldest cultural groups in Asia, the $austroasiatic_group$ peoples have developed an array of societies that go from very advanced empires to underdeveloped jungle warring tribes.\n\nThe Austroasiatic peoples speak languages of one of the oldest families of mainland Southeast Asia. They include the great kingdoms of the Khmer, Mon and Vietnamese and forest and hill peoples such as the Wa, Khasi and Santal, scattered from the Red River Delta through Cambodia and Burma to eastern India.\n\nThe Khmer built Angkor, which fell to Ayutthaya in 1431. The Mon founded Hanthawaddy at Pegu in the late thirteenth century, and Burma conquered it in 1757. The Vietnamese of Dai Viet threw off Ming rule in 1427 and then pushed south into Cham lands, taking Vijaya in 1471."
 austronesian_group_desc: "As one of the most widespread cultural and linguistic families, the $austronesian_group$ peoples have populated lands from Madagascar to Easter Island. They have been considered excellent seafarers and brought technologies and animals with them in their colonial efforts.\n\nThe Austronesian peoples descend from a seaborne expansion that left Taiwan between about 3000 and 1500 BCE and reached as far south as New Zealand. With outrigger canoes and crab-claw sails they carried rice, bananas, coconuts, pigs and chickens to new islands. Here the group means the peoples of Java, Sumatra, Borneo, Sulawesi, the Philippines and the Cham coast of Vietnam.\n\nMajapahit, founded in Java in 1293, was rising under Gajah Mada in 1337. Islam spread along the trading ports, and Malacca grew powerful around 1400. Dai Viet destroyed the Cham city of Vijaya in 1471, Spain began ruling the Philippines in 1565, and the Dutch founded Batavia in 1619."
 aymara_group_desc: "The $aymara_group$ $group_text$ $aymara_language$ language.\n\nThe Aymara live in the Andean highlands around Lake Titicaca, and their name is traced to a phrase meaning ‘a place with many communally owned farms’. Their ancestors have lived in the high Andes for thousands of years, and the great city of Tiwanaku, which may have been founded around 110, stood on their lands, though whether the Aymara built it is uncertain.\n\nThe Inca held the area sacred: their emperors made pilgrimages to the Island of the Sun in Lake Titicaca and to the ruins of Tiwanaku. In the late fifteenth or early sixteenth century the Aymara came under Inca rule, and in the sixteenth century under the Spanish Empire."
 bagua_group_desc: "The $bagua_group$ $group_text$ $bagua_language$ language.\n\nThe Bagua were a people of northern Peru. Their language is unclassified and has long been extinct, with no more than three words recorded."
 baltic_group_desc: "The Baltic peoples are those living on the southeastern coast of the Baltic Sea. Originally mainly from the same branch that gave rise to the Slavic peoples, they were already differentiated by the times of the Roman Empire. Over the centuries, interaction with different Germanic peoples, as well as groups of Slavs, created a unique identity. Not only the original Baltic-speaking peoples, still keeping their original religion, but also the many groups of Christian German peoples living on those shores can now be called Baltic.\n\nThe Baltic group includes the Lithuanians, Latvians, Prussians, Curonians and Sudovians, together with the Finnic Estonians and Livs and the Germans who settled among them. In the thirteenth century the Teutonic and Livonian Orders conquered the Prussians, Livs and Latvians.\n\nThe pagan Grand Duchy of Lithuania resisted; Jogaila accepted baptism in 1386, and Samogitia converted only in 1413. The Union of Lublin joined Lithuania with Poland in 1569, Livonia broke up in the war of 1558–1583, and Russia took Estonia and Livonia from Sweden in 1710."
 bantu_group_desc: "The Bantu peoples form the largest linguistic grouping in sub-Saharan Africa, their expansion from a homeland near the Cameroon-Nigeria border carrying Bantu languages and agricultural practices across central, eastern, and southern Africa over three millennia. Today Bantu-speaking peoples inhabit almost the entire southern half of the continent.\n\nBetween about 4000 BC and AD 500 Bantu farming communities spread south in two streams, one reaching central Angola along the coast and Congo rivers, the other east to Lake Victoria. They absorbed or displaced the foragers they met, among them Pygmy and Khoisan peoples.\n\nBy 1337 several large states had arisen from this spread. Great Zimbabwe, the biggest stone city of southern Africa, was a capital from the thirteenth century, Kilwa's sultans held sway along the Swahili coast, and from about 1390 the Kingdom of Kongo ruled the lower Congo."
 barbakoan_group_desc: "The $barbakoan_group$ $group_text$ $barbakoan_language$ language.\n\nThe Barbakoan peoples include the Cara, the Tsáchila, the Awa and the Pasto of Colombia and Ecuador. Pasto and Caranqui are now extinct, replaced by Spanish, while Awa Pit is still spoken."
 besiro_group_desc: "The $besiro_group$ $group_text$ $besiro_language$ language.\n\nThe Chiquitano, who call themselves the Monkóx, have their homeland in the Chiquitania savanna of eastern Bolivia. The Spanish named them Chiquitos, ‘little ones’. Their language may belong to the Macro-Jê family, and its main dialects were Tao, Piñoco and Manasi.\n\nThey farmed and resisted the Spaniards for nearly two centuries after Santa Cruz de la Sierra was founded in 1559. From 1691 the Jesuits set up missions in their country, where the Chiquito language became the common speech and nearly fifty tribes were assimilated, until the Jesuits were expelled in 1767."
 bohemian_group_desc: "The Lands of the Bohemian Crown were populated mainly by different Slavic peoples. However, being not only inside the Holy Roman Empire but one of its biggest constituents, they were also very influenced by German culture and traditions. On top of that, a lot of German settlers were attracted to the lands of Bohemia, which further expanded such influence.\n\nThe Bohemian group comprises the Czechs, Moravians, Silesians and the Sorbs of Lusatia. The Přemyslids made Bohemia a kingdom in the twelfth century; in 1337 the Luxembourg king John ruled it. His son Charles IV bound the crown lands together in 1348, and the Golden Bull of 1356 made the king an imperial elector.\n\nThe Hussite Wars began after the burning of Jan Hus in 1415, and the Habsburgs inherited the crown in 1526. After White Mountain in 1620 the Czech nobility lost its place; Prussia took most of Silesia in 1742."
 bora_huitoto_group_desc: "The $bora_huitoto_group$ $group_text$ $bora_huitoto_language$ language.\n\nThe Huitoto, Bora and related peoples live in the Amazon rainforest of southwestern Colombia and the neighboring parts of Peru and Brazil. Their languages are classed together as the Bora-Witoto family, made up of the Boran and Witotoan branches."
 british_group_desc: "Britannia is called home by many people, its prehistoric makeup disturbed by waves of migration from the Celtic tribes, the Roman Empire, the Germanic world, Ireland, and France. Physical separation from the continent unites all the peoples of their isle.\n\nThe British group includes the English, Welsh, Scots, Highland Gaels and Cornish, and the English settlers of Ireland. Celtic Britons first held the island, and it became the Roman province of Britannia in the first century. After Roman rule ended in the fifth century, Anglo-Saxon settlement displaced the Britons in the east and south, and Gaelic speakers from Ireland settled in the north.\n\nThe Normans conquered England in 1066 and Edward I took Wales in 1283. Scotland's victory at Bannockburn in 1314 led to English recognition of its independence in 1328. In 1337 Edward III opened the Hundred Years' War against France. England and Scotland merged in 1707."
 cacan_group_desc: "The $cacan_group$ $group_text$ $cacan_language$ language.\n\nThe Diaguita and Calchaquí peoples of the northwest of Argentina and the north of Chile spoke the unclassified Cacán language. The name Diaguita is said to come from a Cacán phrase for ‘village inhabitant’. In the sixteenth century they lived in many subtribes, among them the Calchaquí, Pazioca and Quilme, across Catamarca, La Rioja and parts of Salta and San Juan.\n\nThe Diaguita were never a single people but a patchwork of chiefdoms, whose dialects varied from valley to valley. The Inca took their lands by war, which depopulated the valleys of Chile. Diego de Almagro's expedition reached the Copiapó valley in April 1536."
 caddoan_group_desc: "The $caddoan_group$ $group_text$ $caddoan_language$ language.\n\nThe Caddo, whose relatives include the Wichita and Pawnee, lived in what is now northeast Texas, western Louisiana, southwestern Arkansas and southeastern Oklahoma. They were farmers, and in the Piney Woods they were struck by the Great Drought of 1276–1299.\n\nFrom about 800 to 1400 their ancestors, the Caddoan Mississippian culture, raised large platform mounds that served as temples and elite residences. The Spiro Mounds on the Arkansas River, among the grandest in the United States, were built by Mississippian ancestors of the Caddo and Wichita."
 calima_group_desc: "The $calima_group$ $group_text$ $calima_language$ language.\n\nThe Calima culture belongs to the Valle del Cauca in Colombia. The valley was held in succession by the Ilama, Yotoco, Sonso and Malagana societies.\n\nThe Ilama, the first farming and pottery society, lived on the Calima River in chiefdoms that lasted until the Spaniards came, and grew yuca and beans, wove cloth, worked metal and fished. The Sonso culture of 800–1600 was the last of them: its population grew, its government became more centralized, and its goldwork mixed gold with copper and was cast."
 caribe_group_desc: "The $caribe_group$ $group_text$ $cariban_language$ language.\n\nThe Caribe peoples are spread across northern South America from the mouth of the Amazon to the Colombian Andes. Most of them are small peoples, such as the Pemon and Yukpa.\n\nThe best known are the Kalinago, or Island Caribs, of the Lesser Antilles, who may have been related to the mainland Caribs. When the Spaniards arrived they were one of the dominant peoples of the Caribbean, and held the Windward Islands, Dominica and Guadeloupe. They had a reputation as warriors who raided neighboring islands. Columbus recorded the name Caribe in the 1490s, and the sea took its name from it."
 carpathian_group_desc: "The rugged arcs of the Carpathian Mountains have long shaped the lives of those who dwell among their ridges and valleys. Isolated communities adapted to shifting borders and empires, developing a resilience tied to the land itself. Mountain passes and highland fortresses fostered trade and defense alike.\n\nThe Carpathian group includes, in and around the Carpathian Basin, the Magyars, Slovaks, Székelys, Rusyns, Wallachians, Moldovans and Transylvanians, with German settlers and the Cumans, nomads who came west from the steppe. The Magyars arrived in the late ninth century and founded the Kingdom of Hungary.\n\nAfter the Mongol invasion of 1237 many Cumans took refuge in Hungary. Wallachia and Moldavia formed south and east of the mountains in the fourteenth century. The Ottoman victory at Mohács in 1526 split Hungary, and Transylvania became a separate principality. The Habsburgs recovered the Hungarian lands, confirmed by the Treaty of Karlowitz in 1699."
 caucasian_group_desc: "Where Europe and Asia meet, the Caucasus rises as a land of peaks and narrow valleys. Its sheer landscapes shields fiercely independent peoples, while its mountain passes drew the ambitions of empires...\n\nThe Caucasian peoples live between the Black Sea and the Caspian: Armenians and Georgians in the south, Circassians, Abkhaz, Chechens and Avars in the north. Three language families, Kartvelian, Northwest Caucasian and Northeast Caucasian, are native here, with Indo-European Armenian. The passes drew in Persians, Arabs and Mongols.\n\nGeorgia reached its height under David IV and Queen Tamar in the eleventh to thirteenth centuries, but Mongol overlordship, the Black Death and Timur's invasions broke it, and by 1466 it had dissolved into rival realms. In 1555 the Peace of Amasya divided the region between the Ottomans and Safavid Persia, and Russia annexed eastern Georgia in 1801."
 celtic_group_desc: "The Celts, a patchwork of peoples who once stretched from Iberia to Anatolia, lie reduced along the harsh Atlantic coastline, pushed to the craggy fringes of Europe by centuries of invasion and settlement.\n\nThe Celtic group includes the Irish, Bretons, Welsh, Highlanders, Cornish and Norse-Gaels, peoples who still spoke Celtic languages. Their ancestors, the Celts, are known from Iron Age cultures such as Hallstatt and La Tène.\n\nEdward I conquered Wales in 1283, and in 1337 Gaelic lords in Ireland still resisted the English Lordship there. Brittany, drawn into the Hundred Years' War by a succession dispute, was joined to France in 1532. Tudor monarchs reconquered Ireland through the sixteenth century, and the Highland clans' last Jacobite rising was crushed at Culloden in 1746."
 central_african_group_desc: "The peoples of Central Africa inhabit the vast Congo Basin and surrounding highlands, speaking languages of the Adamawa, Ubangian, and related families. Their cultures are as diverse as the rainforests, savannas, and rivers they call home, ranging from the forest-dwelling Baka to the river traders of the great Congo tributaries.\n\nThe Central African group includes the Adamawa, Gbaya, Zande, Banda, Ngbandi and Sara, the Baguirmi near Lake Chad, and the Fang and Bulu of the Atlantic forests, who speak Ubangian, Central Sudanic and Bantu languages. Their lands are the savannas and forests between Lake Chad, the Ubangi and the Congo basin.\n\nThe Sara kept patrilineal clans, and the Gbaya, who had lived in the region since at least the sixteenth century, came from the Lobaye valley. Southeast of Lake Chad the sultanate of Baguirmi was founded in 1522 under the mbang at Massenya and paid tribute to Bornu until the 1700s. In the early 1700s the Zande took shape through the conquests of the Vungara clan."
 charrua_group_desc: "The $charrua_group$ $group_text$ $charrua_language$ language.\n\nThe Charrúa and their neighbors the Guenoa and the Chaná lived in present-day Uruguay and the adjoining parts of Argentina and Brazil. They were semi-nomadic hunters and gatherers, moving with the seasons according to rain and drought. Almost all that is known of them before contact comes from the Spaniards.\n\nSpanish chroniclers accused the Charrúa of killing Juan Díaz de Solís on his voyage up the Río de la Plata in 1515. Together with the Chaná, they resisted the Spanish invaders. In the eighteenth and nineteenth centuries cattle ranching altered their way of life and caused famine, and in 1831 the Uruguayan army massacred many of them at Salsipuedes."
 cherokee_group_desc: "The $cherokee_group$ $group_text$ $cherokee_language$ language.\n\nThe Cherokee, or Tsalagi, spoke an Iroquoian language. Before the eighteenth century they lived in towns along the river valleys of what is now southwestern North Carolina, southeastern Tennessee, northern Georgia and neighboring states, with hunting grounds reaching into Kentucky. A tradition says they came south from the Great Lakes in ancient times, but later scholars place the origin of Iroquoian in the Appalachians.\n\nThe name appears in accounts of the Hernando de Soto expedition of the 1540s. The Cherokee were farmers living in permanent towns, and by the nineteenth century they had adopted many European American practices and created a writing system of their own."
 chibchan_group_desc: "The $chibchan_group$ $group_text$ $chibchan_language$ language.\n\nThe Chibchan languages are a family found from eastern Central America to northern Colombia, and take their name from the Chibcha language of the Colombian highlands. The Huetar and Guna lived in the isthmus, and the Muisca on the high plateau of Cundinamarca and Boyacá.\n\nThe Muisca were not one state but followed three great rulers: the hoa of Hunza, the psihipqua of Muyquytá, and the iraca, the religious ruler of Suamox. Their lands held an estimated one to three million people when the Spaniards invaded in the 1530s. They were then brought into the New Kingdom of Granada, and many of their customs lasted until the early nineteenth century."
 chicham_group_desc: "The $chicham_group$ $group_text$ $chicham_language$ language.\n\nThe Chicham peoples live at the headwaters of the Marañón River and its tributaries, in northern Peru and eastern Ecuador. Among them are the Shuar, whose name means ‘people’. They lived by gardening and by hunting with blowguns and darts tipped with curare, and held to complex spiritual beliefs about souls and the power called arutam. Headhunting raids were part of their culture.\n\nIn the 1500s their warriors halted the expansion of the Inca Empire into the Amazon basin. They also destroyed settlements of the Spanish conquistadors."
 chickasaw_choctaw_group_desc: "The $chickasaw_choctaw_group$ $group_text$ $chickasaw_choctaw_language$ language.\n\nThe Chickasaw and Choctaw of the Southeastern Woodlands spoke Muskogean languages, were related, and shared much of their history. The Chickasaw held northern Mississippi, northwestern and northern Alabama, western Tennessee and southwestern Kentucky, and were divided into two moieties, the Imosak Cha'a' and the Inchokka' Lhipa'. The Choctaw were based in Louisiana, Mississippi and Alabama, and their name is said to mean ‘people of the river’.\n\nThe expedition of Hernando de Soto met the Chickasaw, whom he recorded as Chicaza, in 1540. Both peoples later dealt with French, English and Spanish colonists."
 chinese_group_desc: "China has been broken apart and reunified multiple times over the centuries, but the idea of it has never ceased to exist. Despite being very diverse in terms of culture and language, the many different peoples living in it all share the concept of being inherently Chinese, inhabitants and custodians of the Middle Kingdom.\n\nThe Chinese group is made up of the Han peoples, divided into dozens of regional cultures such as the Wu of the lower Yangtze, the Gan, Jin and Hakka. They shared one written language and the idea of a single China under an emperor.\n\nKublai Khan founded the Mongol-led Yuan dynasty in 1271 and conquered the Southern Song in 1279. The Red Turban Rebellions from 1351 destroyed Yuan rule, and Zhu Yuanzhang founded the Ming dynasty in 1368. The Yongle Emperor made Beijing his capital and sent Zheng He on great sea voyages. The Ming fell in 1644 to the rebel Li Zicheng and the Manchu-led Qing."
 chitimacha_group_desc: "The $chitimacha_group$ $group_text$ $chitimacha_language$ language.\n\nThe Chitimacha lived in Louisiana around the Atchafalaya Basin and Bayou Teche, and spoke a language isolate. Their name is believed to mean ‘people who live on the Grand river’, and they also called themselves ‘men all together red’."
 chiwere_group_desc: "The $chiwere_group$ $group_text$ $chiwere_language$ language.\n\nThe Chiwere group includes the Iowa, Otoe and Missouria, who spoke the Siouan language Chiwere, together with the closely related Ho-Chunk. The three Chiwere peoples were once part of the Ho-Chunk and came from the Great Lakes region. They left their homelands in southern Wisconsin for eastern Iowa, the state that bears the name of one of them, and later spread through the Midwest and the plains.\n\nThe name Chiwere means ‘the home dialect’. The language was first recorded by missionaries in the 1830s, and in 1837 the Iowa were moved from Iowa to reservations in Kansas and Nebraska."
 choco_group_desc: "The $choco_group$ $group_text$ $choco_language$ language.\n\nThe Choco peoples are the Emberá, known in older writing as the Chocó or Katío, and the Wounaan, whose languages together form the Chocó family and are not known to be related to any other family of Central or South America. Their homeland is the rainforest of the Pacific coast of Colombia and Panama.\n\nIn the late 1700s, prompted by the Spanish, the Emberá began to move from the Chocó region into what is now Darién in Panama. There they came into conflict with the Guna and pushed them toward the Caribbean coast."
 chokwe_group_desc: "The Chokwe peoples of the Angolan plateau are renowned for their exceptional artistic traditions, particularly their masks and wood carvings, and for their role in the long-distance trade networks that connected the Atlantic coast to the Central African interior. Originally subjects of the Lunda Empire, they expanded dramatically in the nineteenth century to become one of the dominant peoples of the region.\n\nThe Chokwe, Mbunda, Luvale and Luchazi live on the plateau of what is now Angola and its borders with Congo and Zambia. Their chiefs share a common ancestry that goes back to Lunda migrations of the sixteenth century, and the Chokwe were one of the clans of the Lunda Empire in the seventeenth and eighteenth centuries.\n\nThe Chokwe worked first for Lunda nobles, then broke away after disputes that included refusing tribute to the king, and their trade brought them wealth beyond their neighbours. The Portuguese had almost no contact with them until the 1830s, when the Chokwe began trading wax, rubber and ivory."
 chono_group_desc: "The $chono_group$ $group_text$ $chono_language$ language.\n\nThe Chono, or Guaiteco, were nomadic hunter-gatherers who traveled by canoe among the archipelagos of Chiloé, Guaitecas and Chonos in southern Chile. They are believed to have been the first ethnically identifiable inhabitants of Chiloé. One account has Mapuche groups invading Chiloé in the thirteenth century and pushing them south.\n\nThe Chono first met Europeans in 1553, when Francisco de Ulloa's expedition reached their land. Spanish raids from Chiloé turned into slave raids after Philip III's decree of 1608, though the Chono, unlike the Mapuche, had never rebelled."
 chukotko_kamchatkan_group_desc: "The $chukotko_kamchatkan_group$ $group_text$ $chukotko_kamchatkan_language$ language.\n\nThe Chukotko-Kamchatkan peoples are the Chukchi, Koryak, Alyutor, Kerek and Itelmen of extreme northeastern Siberia and Kamchatka. They were hunter-gatherers and reindeer herders. The Chukchi were divided into Maritime Chukchi, who lived in settled coastal homes and hunted sea mammals, and Reindeer Chukchi, who followed their herds across the inland tundra. They had few formal rulers.\n\nThe Itelmen lived mainly along the Kamchatka River in villages of a few hundred people, each built around a single patriarchal household. After Russian Cossacks arrived in the seventeenth century, their villages shrank, and by the time Georg Steller described them in 1744 many held only forty or fifty people."
 chumashan_group_desc: "The $chumashan_group$ $group_text$ $chumashan_language$ language.\n\nThe Chumash lived on the central and southern California coast, from Morro Bay to Malibu, with the northern Channel Islands. They lived in more than 150 independent villages that spoke variants of one language, and were known as bead makers. The rich waters of the Santa Barbara Channel fed villages that traded with peoples as far away as Arizona.\n\nJuan Cabrillo met the coastal villages in 1542, but Spanish settlement began only in 1769. Between 1772 and 1817 most Chumash entered the Franciscan missions, beginning with San Luis Obispo, and disease and mission life cut their numbers sharply. The Chumash Revolt of 1824 began at Mission Santa Inés."
 ckunsa_group_desc: "The $ckunsa_group$ $group_text$ $ckunsa_language$ language.\n\nKunza was the language of the Atacama people around the Salar de Atacama in northern Chile, an isolate with no proven relatives. The Atacama herded llamas, farmed terraces and kept stone forts such as Quitor. Their neighbors in the group are the Chichas of southern Bolivia and the Omaguaca of the Quebrada de Humahuaca.\n\nThe Inca took the region in the fifteenth century and moved Chichas as settlers to the Loa valley. Diego de Almagro's expedition entered in 1536, and Spain annexed the Atacama in 1557."
 coahuilteco_group_desc: "The $coahuilteco_group$ $group_text$ $coahuilteco_language$ language.\n\nThe Coahuiltecans were small hunter-gatherer bands of the dry brush country of northeastern Mexico and southern Texas, on both sides of the Rio Grande. The name comes from Coahuila, where the Spanish first met them. They spoke several languages, among them Pakawa, Comecrudo and Cotoname, which most linguists doubt were related, and no band formed a political unit larger than its kin.\n\nFrom 1580 slave raiders from Nuevo Leon took captives along the Rio Grande. In 1718 the Spanish founded Mission San Antonio de Valero, the Alamo, and four more missions followed, where Coahuiltecans sought protection from Apache and Comanche raids."
 confucian_group_desc: "A collection of cultures which have been directly or indirectly influenced by the ideas and morals of Confucianism.\n\nThe Confucian-Influenced group includes the Chinese regional cultures, the Japanese, the Koreans and the Vietnamese. Imperial China's tributary relations carried Confucian thought, Daoism and Buddhism to its neighbours. Literary Chinese became their common language of official business, and Chinese characters were borrowed and adapted in Japan, Korea and Vietnam.\n\nLocal scripts followed: the kana syllabaries in Japan, the Nôm script in Vietnam and the hangul alphabet in Korea, promulgated in 1446. Korea's Joseon dynasty, founded in 1392, made Neo-Confucianism its state doctrine. The imperial examination system, modelled on China's, shaped the bureaucracy and social order of Korea and Vietnam."
 cree_group_desc: "The $cree_group$ $group_text$ $cree_language$ language.\n\nThe Cree group includes the Cree, Innu, Naskapi and Atikamekw, Algonquian-speaking peoples of the northern woodlands of eastern and central Canada. They speak a chain of closely related dialects and call themselves by words meaning person or man, such as nehiyaw and innu. Bands were independent, but often joined their neighbors against outside enemies.\n\nThe fur trade brought Europeans: Charles Fort was founded on James Bay in 1668, and a Hudson's Bay Company party reached the Cree on the Nelson River in 1682. With company guns many Cree moved onto the plains as traders and bison hunters, allied with the Assiniboine. On Newfoundland the Beothuk were declared extinct in 1829."
 cuicas_group_desc: "The $cuicas_group$ $group_text$ $cuicas_language$ language.\n\nThe Cuicas were one of the two main tribes of the Timoto–Cuica people of the Andes of western Venezuela, in what are now Trujillo, Mérida and Táchira. They were closely related to the Muisca of the Colombian Andes, who spoke Chibcha, and lived somewhat north of their Timote kin.\n\nBefore the Spanish conquest in the sixteenth century they lived in permanent villages of stone and wood houses with thatched roofs, ringed by irrigated terraces of potatoes, maize and beans. They stored water in tanks, wove fibre textiles and made human-shaped pottery, but left no great monuments. They traded cotton, cacao and salt, and were mostly peaceful farmers."
 cuitlatec_group_desc: "The $cuitlatec_group$ $group_text$ $cuitlatec_language$ language.\n\nThe Cuitlatec lived on the Pacific side of what is now Guerrero, along the Balsas River and the Costa Grande, a land the Nahuas called Cuitlatecapan. Their language is an isolate, and they called themselves aʔnelgái.\n\nIn the late Postclassic their main coastal town was Mexcaltepec, centre of a polity that included Acapulco among its subject towns. The Balsas communities were conquered by the Purépecha and most of the rest by the Aztecs, in whose wars they fought. They farmed maize, cotton and cacao and worshipped the sun and moon. After the Spanish came in 1521 their numbers fell rapidly, yet they resisted for more than sixty years."
 culli_group_desc: "The $culli_group$ $group_text$ $culli_language$ language.\n\nCulli was a poorly attested Andean language of the northern Peruvian highlands, now extinct. It was spoken in La Libertad, southern Cajamarca and northern Ancash, in at least three pre-Inca domains: Conchucos, Huamachuco and part of Cuismanco.\n\nThe lordship of Huamachuco, centred on Marcahuamachuco, worshipped the thunder god Catequil, an oracle. The Inca absorbed the region around 1470, made Huamachuco a provincial seat and brought in settlers called mitmaqkuna. Culli gave way to Spanish and survives mainly in place names, with a few speakers recorded in Pallasca into the twentieth century."
 cushitic_group_desc: "The Cushitic peoples of the Horn of Africa and the Nile Valley speak languages of the Cushitic branch of the Afro-Asiatic family. They encompass the camel nomads of Somalia and the Ogaden, the highland farmers of the Ethiopian Rift Valley, and the ancient Beja of the Red Sea coast.\n\nThe Cushitic group includes the Somali and Afar herders of the lowlands, the Oromo, Sidama and Agaw of Ethiopia, and the Beja nomads of the Eastern Desert, speakers of languages of the Afroasiatic family. In the tenth century the Beja were Christian; Arab migrants later brought them Islam.\n\nFrom about 1415 the Sultanate of Adal, ruling Harar, Zeila and Berbera, fought the Christian emperors of Ethiopia, and the war of 1529—1543 exhausted both sides. After it the Oromo, governed by the gadaa system with its eight-year terms, moved north out of the lands around Lake Chew Bahir and Lake Chamo."
 dakota_group_desc: "The $dakota_group$ $group_text$ $dakota_language$ language.\n\nThe Dakota group is the Sioux, who call themselves the Oceti Sakowin, the Seven Council Fires, and speak the closely related Dakota, Lakota and Nakota dialects, a name meaning friend or ally. They include the Eastern Dakota, or Santee, the Yankton and Yanktonai, and the western Lakota. Before the seventeenth century the Santee lived around Lake Superior, gathering wild rice and fishing from canoes.\n\nIn wars through the 1700s the Ojibwe, armed with French and British muskets, drove the Dakota south and west into southern Minnesota and onto the prairies. In the same century the horse made the Lakota a powerful people of the Northern Plains."
 dhegiha_group_desc: "The $dhegiha_group$ $group_text$ $dhegiha_language$ language.\n\nThe Dhegiha peoples are the Siouan-speaking Osage, Kansa, Omaha, Ponca and Quapaw. Their shared migration story places them together near the confluence of the Ohio and Tennessee rivers before they moved west toward the Missouri and split into separate bands, though some traditions and archaeology suggest an earlier departure.\n\nThe Osage settled on the Osage River in Missouri and had horses by 1690. Marquette and Jolliet met them in 1673, and in the 1720s the French built Fort Orleans on the Missouri in their land. By the early nineteenth century the Osage dominated the region between the Missouri and Red rivers, though smallpox in 1801 and 1802 killed up to two thousand of them."
 dravidian_group_desc: "Concentrated in the southern third of India, the $dravidian_group$ people are the descendants of the natives of the subcontinent before the $indo_aryan_group$ invasions. While these invaders culture eventually permeated $dravidian_group$'s, they have maintained strong regional identities.\n\nThe Dravidian group includes the Telugus, Tamils, Kannadigas and Malayalis, with smaller peoples such as the Gonds, Tuluvas and Kodavas, and the Brahui far to the northwest in Baluchistan. Proto-Dravidian may go back to the third millennium BC, and the Dravidian languages remained distinct from the Indo-Aryan tongues of the north.\n\nIn the early fourteenth century Delhi Sultanate raids shook the south. The brothers Harihara I and Bukka Raya I founded the Vijayanagara Empire in 1336, which under Krishnadevaraya (1509–1529) held primacy across the peninsula. The Deccan sultanates, successors to the Bahmani Sultanate of 1347, defeated it at Talikota in 1565, and Nayak rulers inherited its lands."
 east_african_coast_group_desc: "The peoples of the Swahili Coast have developed a distinctive maritime civilization along the Indian Ocean shore of East Africa, blending Bantu agricultural traditions with the mercantile culture of Arab and Persian traders. Their coral-stone city-states from Mogadishu to Kilwa formed the African terminus of the great Indian Ocean trade network.\n\nThe Swahili Coast group also includes the neighboring Makhuwa and Yao. Medieval writers called the coast Zanj, and its trading towns, reaching south to Sofala, lived by exchanging cloth and spices from Arabia and India for the gold and ivory of the interior.\n\nKilwa took Sofala from Mogadishu in the twelfth century, and under the Mahdali dynasty built the Husuni Kubwa palace. In the fifteenth century its sultans claimed overlordship from Malindi to Sofala. In 1502 Vasco da Gama's fleet forced Kilwa to pay tribute to Portugal."
 east_african_nomad_group_desc: "The pastoralist peoples of East Africa range across the great savannas and semi-arid plains from the Ethiopian highlands to the Tanzanian steppe, herding cattle, camels, and goats between seasonal pastures. Organized through age-grade warrior systems and lacking permanent territorial states, they form a cross-linguistic cultural world spanning Nilotic, Cushitic, and other language families.\n\nThe East African Pastoralist group includes the Somali, Afar, Oromo, Turkana, Maasai and Kalenjin. Somali is often explained as meaning go and milk. The Turkana raised camels and zebu cattle. The Afar appear as the Dankal in a thirteenth-century account.\n\nThe Maasai came from South Sudan and took age-set organisation and circumcision from their Cushitic neighbours, and their warriors were feared as raiders. The Oromo were governed by the gadaa system, with leaders chosen for eight-year terms, and about 1530 began a great expansion out of southern Ethiopia."
 eastern_otomanguean_group_desc: "The $eastern_otomanguean_group$ $group_text$ $eastern_otomanguean_language$ language.\n\nThe Eastern Otomanguean group includes the Mixtec, Zapotec, Popoloca and Amuzgo, peoples of southern Mexico whose tonal languages belong to the Oto-Manguean family, the most diverse in Mesoamerica. The Mixtec, who call their land Ñuu Savi, held the kingdom of Tilantongo in the Oaxaca highlands, and the Zapotec the valleys around Monte Albán and Zaachila. Popoloca is spoken near Tehuacán in Puebla.\n\nThe Aztecs defeated the Mixtecs in 1458 and the last Zapotec war ended at Guiengola between 1497 and 1502. In 1521 both peoples submitted to Cortés, and epidemics then devastated the region."
 ethiopian_group_desc: "The ancient kingdom of Axum brought the people of Ethiopia in contact with the Mediterranean world through Egypt, having trade with Greece and the Roman Empire, and it also brought Christianity. However, after the rise of Islam, the Ethiopians saw themselves cut from that contact and somewhat isolated as the only group of Christian Semitic peoples. This created a shared heritage that survives despite the cultural differences among themselves.\n\nThe Ethiopian group includes the Amhara, Tigrinya, Gurage and Tigre peoples of the Ethiopian highlands, together with the Harla of the east and the Beta Israel, the Jews of Ethiopia. In 1270 Yekuno Amlak overthrew the Zagwe dynasty and founded the Solomonic dynasty, which claimed descent from King Solomon and the Queen of Sheba.\n\nAmda Seyon I (1314–1344) and Dawit I made the empire dominant in the Horn of Africa. Zara Yaqob (1434–1468) built churches and monasteries and centralised imperial rule."
 finnic_group_desc: "The Finnic peoples are living on both sides of the Gulf of Finland. While their strong identity remains intact, they have been under threat of invasion both from Scandinavian and German people.\n\nThe Finnic group includes the Finns, Estonians, Karelians, Livs, Vepsians, Ingrians and Votes. Their languages are thought to have come from the Volga region, and the peoples spread west into northwestern Russia and the Baltic coast.\n\nThe Finnic lands lay between Sweden, Novgorod and the German crusading orders. By the Treaty of Nöteborg in 1323 Sweden and Novgorod divided Karelia. Estonians rose against the German knights and Danes in 1343, and the Livonian War of 1558 broke the order's state. Sweden took Ingria in 1617, and Russia took Estonia, Livonia and Ingria in the Great Northern War and Finland in 1809."
 french_group_desc: "Having its origins in the Germanic Franks that occupied the area after the fall of the Roman Empire, the Kingdom of France later expanded to include other peoples besides them. Despite their differences in customs and languages, all these peoples share the identity of being French.\n\nThe French group runs from the Francien of Paris and the Normans and Picards of the north to the Gascons, Provençals and Languedociens of the south, with Burgundians, Bretons and Walloons. Its Capetian kings slowly absorbed regions with their own dialects.\n\nIn 1337 Edward III of England confronted Philip VI over Aquitaine, opening the Hundred Years' War, which ended in 1453 with only Calais left to England. Brittany joined the crown in 1532, and the Ordinance of Villers-Cotterêts of 1539 made French the language of law. The Wars of Religion of 1562–1598 followed."
 german_group_desc: "Rooted in a rich tapestry of ancient tribes, the Germanic peoples entered history as sometimes rivals, sometimes allies of the Roman Empire. As the centuries passed, Charlemagne's Empire and Feudalism shaped their identity, developing into the creation of the Holy Roman Empire.\n\nThe German group gathers the peoples of the Holy Roman Empire's German lands, divided by dialect and region: Bavarians, Franconians, Saxons, Swabians, Alemanni, Pomeranians and Frisians. Otto I's crowning in 962 made the Kingdom of Germany, the eastern part of the Frankish realm, the Holy Roman Empire.\n\nIn 1337 the Empire was ruled by Louis IV of Bavaria, and the Golden Bull of 1356 fixed seven prince-electors to choose its kings. The Hanseatic League of northern cities dominated Baltic trade. Luther's Reformation from 1517 split Germany by faith, and the Thirty Years' War ended at the Peace of Westphalia in 1648. Prussia rose as a kingdom from 1701, and Napoleon ended the Empire in 1806."
 great_lakes_kingdoms_group_desc: "The peoples of the African Great Lakes region have developed some of the most sophisticated state structures in sub-Saharan Africa, with hierarchical kingdoms centered on cattle wealth and hereditary kingship. From the Buganda kingdom on the northern shore of Lake Victoria to the terraced hills of Rwanda, these interlacustrine societies share a common political culture of tribute, royal courts, and clan organization.\n\nThe Great Lakes Kingdoms group takes in the Rwanda, Baganda, Haya and Shi of the East African lake country and, farther west on the savannas, the Luba, Lunda and Kuba. Cattle-raising Tutsi moved into the Rwandan highlands, where Twa hunters had lived, from the fifteenth to sixteenth centuries, and a chiefdom there grew into the centralized Kingdom of Rwanda.\n\nBuganda traces its kabakas to Kato Kintu in the late 1200s. Bunyoro-Kitara was founded in the late 1500s by Rukidi after the older Kitara empire broke up, and was for a time the region's greatest power. In the west the Luba chiefdoms merged into a kingdom around 1500, a model the Lunda copied."
 greek_group_desc: "The Latins and Hellenes, pioneers of democracy and philosophy, shaped Western civilization with their enduring cultural and intellectual legacy. From epic poetry to classical architecture, their contributions resonate through millennia.\n\nThe Roman group gathers the Greek-speaking peoples of the eastern Mediterranean and Black Sea: the Greeks, the Pontic Greeks of the Black Sea coast and the Griko of southern Italy. In the Byzantine Empire they called themselves Romans, heirs of the Roman state.\n\nIn 1337 Andronikos III ruled a shrunken empire at Constantinople. The Pontic Greeks lived under the Komnenos emperors of Trebizond, who survived until 1461. Constantinople fell to the Ottoman sultan Mehmed II in 1453 and the Morea in 1460. Under Ottoman rule the Orthodox Church led the Greek community until the war of independence began in 1821."
 guahibo_group_desc: "The $guahibo_group$ $group_text$ $guahibo_language$ language.\n\nThe Guahibo, who also call themselves Sikuani, are an Indigenous people of the Llanos, the savanna plains of eastern Colombia and southern Venezuela, speaking Guajiboan languages related to those of the Cuiva. From the late 1700s Colombian and Venezuelan colonists attacked them in sporadic raids."
 haida_group_desc: "The $haida_group$ $group_text$ $haida_language$ language.\n\nThe Haida homeland is Haida Gwaii, an archipelago off the coast of British Columbia, and the southern half of Prince of Wales Island in Alaska. Their language is an isolate. They were skilled carvers of red cedar, seamen and traders. In the early eighteenth century Haida from southern Haida Gwaii crossed north and settled beside the Tlingit as the Kaigani Haida.\n\nJuan Pérez met their canoes in 1774. George Dixon opened the sea-otter fur trade with them in 1787, and the Haida stayed at the centre of the China sea-otter trade for decades, capturing ships such as the Eleanor and the Susan Sturgis in conflicts with traders between 1780 and 1830."
 haudenosaunee_group_desc: "The Haudenosaunee are a diverse group of peoples, but all of them united not only by linguistic similarities but also by their shared sense of community, cooperation, and core beliefs, which are expressed in the many ways their peoples tend to organize themselves together.\n\nThe Haudenosaunee, who call themselves the people of the longhouse and are also known as the Iroquois, lived in what is now New York. Their Confederacy joined the Mohawk, Oneida, Onondaga, Cayuga and Seneca, whom oral tradition says the Great Peacemaker, Hiawatha and Jigonhsasee united under the Great Law of Peace. The date is disputed.\n\nWith muskets from the fur trade, the Confederacy dispersed or absorbed neighbouring peoples in the Beaver Wars, and around 1700 its power reached from the lower Great Lakes to the Ohio Valley. The Tuscarora joined it after 1722, making the Five Nations six. In the American Revolution the Confederacy split, and the Sullivan Expedition of 1779 devastated its towns."
 henia_kamiare_group_desc: "The $henia_kamiare_group$ $group_text$ $henia_kamiare_language$ language.\n\nThe Henia and Kamiare are the two peoples the Spanish lumped together as the Comechingones, who lived in the Sierras Pampeanas of what is now Córdoba and San Luis in Argentina. Hunters there had begun to eat maize some three thousand years earlier, and in the late pre-Hispanic centuries they lived in villages of semi-buried pit houses.\n\nSpanish expeditions came from 1529, among them that of Diego de Rojas in 1543–1546. Jerónimo Luis de Cabrera founded Córdoba in 1573, and the natives of its valley were moved elsewhere. Encomienda labour and the settling of outsiders broke up their communities; by the end of the seventeenth century only six native villages, including Quilino and Soto, still held their lands."
 hibernian_group_desc: "The Emerald Isle was originally inhabited by the Gaels, but conquests and settlements have brought many newcomers from Britain and the continent. Even those of foreign ancestry may feel compelled to answer Ireland's call.\n\nThe Hibernian group takes its name from Hibernia, the Roman name for Ireland: the Gaelic Irish and the Anglo-Irish descended from English settlers. After the Anglo-Norman invasion of 1169 the English Crown claimed a Lordship of Ireland, and Norman families settled the east and south.\n\nAfter the Black Death Gaelic lords had regained ground, and the Statutes of Kilkenny in 1366 tried to stop English settlers from adopting Irish customs. Henry VIII made Ireland a kingdom in 1541. After the Nine Years' War ended in defeat, the Gaelic earls left in 1607 and Ulster was settled with Protestants. Cromwell's army reconquered the island in 1649–1653, and William III's victory at the Boyne in 1690 secured Protestant rule."
 hinonoeitiit_group_desc: "The $hinonoeitiit_group$ $group_text$ $hinonoeitiit_language$ language.\n\nThe Hinonoeitiit group takes in the Arapaho proper, the Southern People and the Haaninin, known to the French as the Gros Ventre, all Algonquian peoples. Their ancestors grew maize in the Red River Valley, in what is now Manitoba and Minnesota. Pushed west by the Ojibwe, who had French guns, they were on the northern plains before 1700.\n\nIn the early 1700s they acquired horses and became nomadic bison hunters and fine horsemen. Around 1811 the Arapaho allied with the Cheyenne, which widened their hunting grounds, and by 1826 they and their allies had driven the Kiowa and Comanche south."
 hmong_mien_group_desc: "The Hmong-Mien peoples inhabit the highlands of southern China and Southeast Asia, speaking languages of the independent Hmong-Mien family unrelated to any of their neighbors. Known for their vibrant textile traditions and fierce independence, they have historically resisted assimilation into the lowland empires surrounding them.\n\nThe Hmong-Mien group is made up of the Hmong, or Miao, and the Yao, or Mien, whose languages are tonal. In the Southern Song the official Zhou Qufei noted the Yao's fine indigo-dyed blue clothes.\n\nMing and Qing officials replaced Yao chieftains with their own tax collectors. The Yao and Miao rose against the Ming in the 1370s and in 1449, and the fighting drove the Yao deeper into the highlands. Conflict with Han settlers grew under the Qing in the eighteenth century, and from the late seventeenth century some Hmong moved into Southeast Asia."
 hokan_group_desc: "The $hokan_group$ $group_text$ $hokan_language$ language.\n\nThe Hokan group gathers peoples of California, Arizona and Baja California whose languages linguists such as Roland Dixon and Alfred Kroeber proposed to be related; the Hokan hypothesis, which some versions extend to Honduras, is still debated. Among them are the Pomo, Karuk, Shasta, Yavapai, Hualapai, Kumeyaay, Cochimí and Seri.\n\nThe Hohokam of the Salt and Gila rivers built irrigation canals between 800 and 1400. In Baja California the Jesuits founded Loreto among the Cochimí in 1697. In 1769 the Spanish founded Mission San Diego de Alcalá in Kumeyaay country, and Kumeyaay villages later burned it. The Seri of Sonora resisted Spanish rule."
 hungarian_group_desc: "The Magyar, or Hungarians, are a group of people originating in the area of the Southern Urals that moved gradually westwards pushed by (and getting influence from) other peoples of the steppes, like the Huns, Avars, Bulgars, and Turks, until they settled in the Carpathian Basin after the fall of the Avar Khaganate. This makes them quite different from the rest of their European neighbors, which only contributes to their sense of unity.\n\nThe Magyar group gathers the Hungarians and the Székelys of eastern Transylvania. Their language belongs to the Ugric branch of the Uralic family, alongside Khanty and Mansi. Their first king, Stephen I, was crowned around 1000, and his Árpád dynasty ruled for three centuries.\n\nThe Árpáds died out in 1301, and the Angevin kings who followed made Hungary a major power. After the defeat at Mohács in 1526 the kingdom was split between Habsburg Royal Hungary, Ottoman Hungary and the semi-independent Principality of Transylvania. Habsburg kings held the throne, and Hungarians rose against them in 1604–1606, 1664–1671 and 1703–1711."
 iberian_group_desc: "The Iberian Peninsula, a land of contrasts and rich history, is home to diverse peoples. The ancient Celts, Iberians, and Basques have been influenced by the Phoenicians, Romans, Visigoths, and Moors. Several distinct identities have merged forging a unique blend of Christian, Muslim, and Jewish cultures. From the vibrant courts of the south to the heroic knights of the north, the Iberian peoples embody a complex tapestry of traditions and aspirations.\n\nThe Iberian group gathers the peoples of the Iberian Peninsula: Castilians, Portuguese, Asturleonese, Catalans, Aragonese, Galicians and Basques, together with the Andalusi Muslims and the Sephardi Jews. The Muslim conquest of 711 ended Visigothic rule, and Christian kingdoms in the north began the Reconquista.\n\nIn 1337 only Granada remained Muslim. Castile and Aragon were united by the marriage of the Catholic Monarchs, who took Granada in 1492 and expelled the Jews the same year. Portugal sent ships round Africa; Castile sent Columbus west. The crowns were joined from 1580 under Philip II until Portugal broke away in 1640, and the Bourbons inherited Spain after the War of the Spanish Succession."
 indian_group_desc: "'Indian' is an umbrella term referring to the vast and diverse cultures that reside on the subcontinent of India. Although each culture is unique and languages are plentiful, the shared geography and distinct separation through natural borders in every direction creates a shared history for these cultures.\n\nThe Indian group gathers the many peoples of the Indian subcontinent: Bengalis, Punjabis, Marathis, Gujaratis and Sindhis in the north and west, Telugus, Tamils, Kannadigas and Malayalis in the south, and forest and hill peoples such as the Gonds and Bhils. In 1337 Muhammad bin Tughluq ruled the Delhi Sultanate, founded in 1206, while the Vijayanagara Empire had risen in the south in 1336.\n\nTimur sacked Delhi in 1398. Babur's victory at Panipat in 1526 began the Mughal Empire, which Akbar expanded, and the Marathas later rose against it. The British East India Company won Bengal at Plassey in 1757."
 indo_aryan_group_desc: "The descendants of the Indo-European people that invaded the Indian Subcontinent, these people became the dominant population in the northern areas. Their settlement shaped early Vedic culture and laid the base for a myriad of languages and empires.\n\nThe Indo-Aryan group gathers the Indo-Aryan speakers of northern India and Sri Lanka: Bengalis, Punjabis, Marathis, Gujaratis, Sindhis, Odias, Rajasthani Marwaris and Mewaris, the Hindi-belt peoples such as the Awadhi and Bhojpuri, and the Sinhalese. Their languages came with groups who migrated from Central Asia into the northern subcontinent, among them the Vedic people.\n\nAfter the Delhi Sultanate was founded in 1206, Persian-using sultans ruled most of the north, and Bengal and Gujarat later formed their own sultanates. Rajput states such as Mewar held out against Delhi. The Mughals took the north from 1526, and in the Punjab the Sikh state of Ranjit Singh arose in 1799. In Sri Lanka the Sinhalese kingdom of Kandy survived until 1815."
 inuit_group_desc: "The $inuit_group$ $group_text$ $inuit_language$ language.\n\nThe Inuit group is the Arctic hunters descended from the Thule, who spoke Eskaleut languages. Thule people emerged in coastal Alaska by 1000 and spread east across northern Canada, reaching west Greenland by 1100. They replaced the earlier Dorset culture, whom Inuit tradition remembers as the Tuniit, strong but timid giants easily driven away. The Dorset were extinct by 1500 at the latest.\n\nNorse settlers called these newcomers Skrælingjar. Intensified contact with Europeans came in the eighteenth century, and the Little Ice Age, which began around 1650, broke up the Thule communities into the peoples later known as Inuit and Yupik."
 iranian_group_desc: "The cultures of Iran are ancient and have a long and complicated origin. The Iranians in the Persia region are the descendants of Western Iranian peoples who ruled over the Middle East like the Achaemenid Empire and Sasanian Empire. After the Muslim conquest of Persia, Islam has become a major pillar of Iranian culture.\n\nThe Iranian group gathers the Iranian-speaking peoples of the Iranian plateau and its borders: the Persians, Afghans, Baluch, Kurds, Tajiks, Lurs and the Caspian peoples. In 1337 Persia was breaking up after the Mongol Ilkhanate collapsed, and Timur conquered it from 1380.\n\nShah Ismail I founded the Safavid dynasty in 1501 and made Twelver Shia Islam the state religion, setting Persia apart from its Sunni neighbours. Nader Shah rose in 1736, and after his death in 1747 the Afghan Durrani Empire emerged in the east. The Qajars took the Persian throne in 1796."
 iroquoian_group_desc: "The $iroquoian_group$ $group_text$ $iroquoian_language$ language.\n\nThe Iroquoian group gathers the northern Iroquoian-speaking peoples outside the Haudenosaunee league: the St. Lawrence Iroquoians, the Neutrals and the Wenro. Jacques Cartier met the first at the villages of Stadacona and Hochelaga in 1535–1536, but by the late sixteenth century they had disappeared from the valley. The Neutrals lived in dozens of villages along the north shore of Lake Erie, from the Niagara Peninsula to the Detroit River.\n\nIn the Beaver Wars the Haudenosaunee, supplied with firearms by the Dutch, destroyed Wendake in 1649 and scattered the Neutrals in 1651. Survivors, including Wenro refugees, merged with other Iroquoian peoples; the Wyandot arose from such mergers."
 italian_group_desc: "Italy, a vibrant patchwork of realms and city-states, is a melting pot of cultures and influences. From the ancient Romans to the Byzantines, Lombards, and Normans, various peoples have left their mark on the Italian Peninsula. Italians compete fiercely for power and prestige, fostering a flourishing culture and artistic patronage.\n\nThe Italian group gathers the peoples of the Italian peninsula and its islands: Neapolitans, Sicilians, Venetians, Lombards, Tuscans, Piedmontese, Ligurians, Friulians and Sardinians. In 1337 the peninsula was divided among the Papal States, the Kingdom of Naples and republics such as Venice, Genoa and Florence.\n\nThe Black Death struck in 1348, and the Medici made Florence a centre of Renaissance art. The Peace of Lodi of 1454 gave some balance until the French invasion of 1494 began the Italian Wars, which ended in 1559 with Spain dominant in the south and in Milan. Napoleon's armies entered Italy in 1796 and swept away the old republics."
 japanese_group_desc: "The people of Japan have inhabited their islands ever since the mythical age of the gods and the first Japanese Emperor, Jinmu-tennō, according to their own narration of their history. Centuries of isolation interrupted by periodical contacts with the continent through Korea and China have made the Japanese into something distinct, and their unique language and native beliefs have no similarity to anything present on the continent. Although diverse among themselves, the Japanese people have developed a shared unique identity.\n\nThe Japanese group gathers the peoples of the Japanese islands, divided by region into the Saigoku of the west, the Tōgoku of the east, the Tōhoku of the north and the Kyūshū of the southwest. China and Korea long supplied the Japanese with writing, Buddhism and Confucian thought.\n\nIn 1336 Ashikaga Takauji set up the Muromachi shogunate in Kyoto, and rival Northern and Southern imperial courts fought until 1392. The Ōnin War of 1467 began a century of warring daimyo. Oda Nobunaga and Toyotomi Hideyoshi reunified the country by 1590, and Tokugawa Ieyasu founded the shogunate at Edo in 1603, which later closed the country to most foreign contact."
 jewish_group_desc: "The $jewish_group$ group refers to the different ethno-religious groups that follow the $jewish_group$ religion.\n\nThe Jewish group includes the Sephardim of Spain and Portugal, the Ashkenazim of Germany and eastern Europe, the Italian and Romaniote Jews, the Teimani of Yemen, the Beta Israel of Ethiopia, and communities in Persia, Georgia, India and Kaifeng in China. Each kept its own liturgy and language.\n\nThe Black Death of 1348 brought massacres of Jews across the Rhineland. England had expelled its Jews in 1290 and France did so in 1394, and Spain expelled those who would not convert in 1492. Many Sephardim found refuge in the Ottoman Empire. In Poland and Lithuania the Ashkenazim formed the largest Jewish community in Europe."
 jirajaran_group_desc: "The $jirajaran_group$ $group_text$ $jirajaran_language$ language.\n\nThe Jirajaran group lived in western Venezuela, in the regions of Falcón and Lara, and their languages are now extinct. The Jirajara lived around the site of Coro and at Siquisique, Baragua and Sanare, and some moved south of Barquisimeto toward the mountains of Trujillo.\n\nIn 1529 the German explorer Ambrosio Alfinger mentioned them as neighbors of the Caquetío. In 1553 enslaved Africans and Jirajara working the gold mines of San Felipe de Buría rose in revolt. From about 1624 they blocked Spanish settlement of the gold province of Nirgua until a governor's army defeated them. Siquisique was founded around 1685, and its census of 1776 still showed an Indigenous majority."
 jurchen_group_desc: "The $jurchen_group$ people, native to the rugged lands of Manchuria, are fierce warriors that forged the mighty Jīn Dynasty and destroyed the Khitan Liáo Dynasty during the 12th century. Masters of horsemanship and archery, they, who once shaped empires, continue to inspire with their resilience and rich heritage.\n\nThe Jurchen group gathers the Tungusic-speaking peoples of Manchuria, among them the Haixi of the Songhua River and the Hūrga. They were hunter-gatherers, semi-nomadic herders or settled farmers, and lacked a central authority. The Jurchens founded the Jin dynasty in 1115, which ruled northern China until the Mongols overthrew it in 1234.\n\nIn 1337 they lived under the Yuan, and the Ming later classed them as Jianzhou, Haixi and Wild Jurchens, whose chiefs paid tribute and held posts as border commanders. Nurhaci united most tribes, organised them in the Eight Banners and founded the Later Jin in 1616. In 1635 Hong Taiji renamed his people the Manchus, and the Qing dynasty followed in 1636."
 kambiwa_group_desc: "The $kambiwa_group$ $group_text$ $kambiwa_language$ language.\n\nThe Kambiwá, also called Cambiuá, are an Indigenous people of the sertão of Pernambuco in Brazil, around Inajá, Ibimirim and Floresta. Their language, unclassified and extinct, is known only from short word lists that were recorded before it died out."
 kanisian_group_desc: "The $kanisian_group$ $group_text$ $kanisian_language$ language.\n\nThe Kanisian are the Canichana, an Amazonian people of the Beni department of Bolivia, whose villages lay on the Mamoré and Machupo rivers. Their language is considered an isolate.\n\nIn 1693 the Jesuit Augustín Zapata was the first to enter their land. In 1695 the Canichana gathered on the Mamoré asking for a mission, and in 1696 Lorenzo Legarda founded San Pedro with twelve hundred of them. Gathered in the Jesuit reduction, they took up farming, woodworking and jewelry making."
 kawesqar_group_desc: "The $kawesqar_group$ $group_text$ $kawesqar_language$ language.\n\nThe Kawesqar group is made up of the canoe nomads of the Patagonian channels. The Kawésqar, called Alacaluf by European sailors, paddled the fjords between the Gulf of Penas and the Strait of Magellan, fishing, hunting seals and gathering shellfish, and never farmed. Their northern neighbors, the Guaiteco or Chono, lived among the archipelagos off southern Chile, harpooning sea lions from wooden dalca boats.\n\nGarcía Jofre de Loaisa's expedition sighted Kawésqar campfires in 1526. Chiloé raiders hunted the Guaiteco for slaves from the late sixteenth century, and in the 1740s Spain emptied their islands and moved them to Chiloé; families that fled south were absorbed by the Kawésqar. British and American sealers brought disease from the late eighteenth century."
 kayambi_group_desc: "The $kayambi_group$ $group_text$ $kayambi_language$ language.\n\nThe Kayambi are an Andean people of the high valley north of Quito, around Cayambe volcano, whose hilltop forts, or pucaras, stood on the Pambamarca ridge and in the Pisque River basin. They resisted the Inca advance so long that the fighting over Pambamarca is said to have lasted seventeen years.\n\nUnder Huayna Capac they joined the northern revolt with the Caranqui, Quitu and Pasto. Tradition places the final slaughter at a lake renamed Yawarkucha, the blood lake. After the Spanish conquest of 1534 their lands were broken into haciendas, whose Kayambi tenants were forced to work, chiefly in wool processing."
 keres_group_desc: "The $keres_group$ $group_text$ $keres_language$ language.\n\nThe Keres are the Pueblo people of seven towns along the Rio Grande and its western tributaries in New Mexico, among them the mesa towns of Acoma and Laguna. Archaeology and Cochiti oral tradition suggest they entered the Rio Grande drainage from the west in the early 1300s.\n\nAcoma had been inhabited for over a thousand years when Estevanico visited in 1539. In 1599 Juan de Oñate's troops sacked it, killing some 800 people and enslaving hundreds more. The Keres joined the Pueblo Revolt of 1680, after which refugees from Acoma and other rebel towns founded Laguna. Through the eighteenth century they kept their clans and kiva rituals under an outward Catholicism, fending off Apache, Comanche and Ute raids."
 khoisan_group_desc: "The Khoisan peoples of southern and eastern Africa are among the oldest surviving populations on Earth, speaking languages distinguished by their remarkable click consonants. They include the San hunter-gatherers of the Kalahari and the Khoikhoi herders of the Cape, peoples who inhabited southern Africa long before the Bantu expansion.\n\nKhoisan is a collective name for the non-Bantu peoples of southern and eastern Africa, and their languages are not demonstrably related. The San of the Kalahari lived in small mobile bands, as did the Hadza of Tanzania around Lake Eyasi, while the Khoikhoi, among them the Nama and Damara, kept cattle and sheep.\n\nTheir largest populations lived where the climate did not suit Bantu sorghum farming, from the Cape to Namibia and Botswana. In 1652 the Dutch East India Company founded a colony at the Cape, where Khoikhoi kept large herds."
 kongo_group_desc: "The Kongo peoples of the lower Congo River basin and the Atlantic coast developed one of the most centralized states in sub-Saharan Africa, the Kingdom of Kongo, with a sophisticated bureaucracy, provincial governors, and an extensive currency system using nzimbu shells. Their early encounter with Portuguese traders in the late fifteenth century made the Kingdom of Kongo one of the first African polities to engage diplomatically with European powers as an equal.\n\nThe Kongo group takes in the Kongo, Yombe, Vili and Bwende, and the Ambundu to the south. From about 1390 the Kingdom of Kongo ruled from M'banza-Kongo, its provincial governors drawn from the royal family and nobles; the nzimbu shells that served as its money came from the island of Luanda.\n\nIn 1483 the Portuguese explorer Diogo Cão reached the coast, and King Nzinga a Nkuwu accepted baptism. His son Afonso I, king from 1509, built a Catholic church and corresponded with the kings of Portugal, protesting in 1526 against Portuguese slave traders. Portugal founded Angola in 1575, and the slave trade slowly wore down the king's power."
 kru_group_desc: "The Kru peoples of the Liberian and Ivorian coasts speak languages of the Kru branch of Niger-Congo and are renowned for their maritime skill and fierce resistance to enslavement. Their seafaring traditions made them valued sailors along the West African coast for centuries.\n\nThe Kru are a cluster of related peoples on the coast of what is now southeastern Liberia and western Ivory Coast, among them the Grebo, Bassa and Krahn. European sailors called their shore the Pepper Coast for its melegueta pepper.\n\nEach village was its own small community; the Kru fished and traded along the coast. Their traditions say they were never enslaved, and Kru men marked their foreheads with an indigo line to show they were free. In the era of the Atlantic slave trade, Europeans hired them as sailors, pilots and interpreters on ships along the coast and called them Krumen, a name tied to the English word crew."
 ktunaxa_group_desc: "The $ktunaxa_group$ $group_text$ $ktunaxa_language$ language.\n\nThe Ktunaxa, also called Kutenai or Kootenay, live on the northern Columbia Plateau along the Kootenay River, in Upper and Lower groups. Their language is an isolate. One account says they began on the prairies and were pushed across the Rockies by the Blackfoot, and each year parties still crossed the mountains to hunt bison, often clashing with the Blackfoot over hunting grounds.\n\nIn the eighteenth century a Lower Kootenay prophet, Shining Shirt, foretold the coming of black-robed missionaries. The North West Company built Kootanae House among them in 1807 but abandoned it in 1812 under hostility from the Peigan."
 kwa_group_desc: "The Kwa peoples of the Gold Coast and the Bight of Benin speak languages of the Kwa branch of Niger-Congo, encompassing the Akan states of the interior and the coastal Ewe and Fon kingdoms. Their societies are marked by matrilineal inheritance among the Akan and the powerful Vodun religious tradition among the Fon and Ewe.\n\nThe Kwa group gathers the Akan of the forests and Gold Coast of what is now Ghana with the Gbe-speaking Ewe, Aja and Fon to the east. The Portuguese reached the coast in 1482 and built Elmina Castle to buy Akan gold, which the Bono state sent south through Begho.\n\nThe Aja say they came from Tado and the Ewe from Notsie; about 1600 three Aja brothers divided the land between Allada, Little Ardra and Abomey. In 1701 the Asante king Osei Tutu defeated Denkyira and founded the Asante Empire. The Fon kingdom of Dahomey took Allada in 1724 and Whydah in 1727."
 kwaza_group_desc: "The $kwaza_group$ $group_text$ $kwaza_language$ language.\n\nThe Kwaza, also called Koaiá, are a people of the high rainforest of southern Rondônia in Brazil, once settled along the São Pedro and Taboca rivers. They were semi-nomadic slash-and-burn farmers who lived beside the Aikanã, Kanoê and Tuparí, and their language is an isolate."
 lenape_group_desc: "The $lenape_group$ $group_text$ $lenape_language$ language.\n\nThe Lenape group gathers the Delawaran-speaking Algonquian peoples of the mid-Atlantic coast: the Munsee, Unami and Unalachtigo, the Lenape or Delaware, whose country around the Delaware River and New York Bay was called Lenapehoking, and the related Mahican of the upper Hudson. They lived in matrilineal clans, grew corn, beans and squash and were never politically unified.\n\nThe Dutch founded New Amsterdam in 1624. William Penn first met the Lenape in 1682, and the fraudulent Walking Purchase of 1737 drove them from their land. Lenape settled in Moravian mission towns in Ohio, where Pennsylvania militia killed 96 of them at Gnadenhutten in 1782. After 1680 Mohawk pressure drove many Mahican east to Stockbridge."
 lithuanian_group_desc: "Among the different Baltic Peoples, the Lithuanians have come together through similarities of language and common threats, forming together the Lithuanian state. Their pagan beliefs while being surrounded by hostile Christians on all fronts further increased their shared sense of unity.\n\nThe Lithuanian group gathers the Aukštaitians of the uplands and the Samogitians of the lowlands near the Baltic coast, who were united in the Grand Duchy of Lithuania. Mindaugas, its first ruler, was crowned king in 1253, but the pagan state was a target of crusades by the Teutonic Knights and the Livonian Order and survived them.\n\nUnder Gediminas and his sons Algirdas and Kęstutis it expanded over former Kievan Rus' lands, and by 1440 it was the largest state in Europe. Jogaila signed the Union of Krewo in 1386, converted to Christianity and became king of Poland. The Union of Lublin in 1569 joined Lithuania and Poland in a Commonwealth, which the partitions ended in 1795."
 luba_group_desc: "The Luba and Lunda peoples of the Katanga plateau and the Kasai basin built an interconnected web of tributary empires that dominated the heart of Central Africa for centuries. The Luba Empire pioneered the Nilotic model of divine kingship in Central Africa, and the Lunda expansion carried their political system of appointed governors across a vast swathe of the continent from Angola to Zambia.\n\nThe Luba came from fishing, farming and metal-working communities in the Upemba Depression, where iron-working farmers had lived since the fourth century. Some scholars date their empire to before the fifteenth century; oral tradition tells how its sacred kingship began with Nkongolo and the hunter Mbidi Kiluwe.\n\nThe Luba model of government, which could absorb foreign leaders, was adopted by the Lunda, whose first paramount ruler took the title Mwane-a-Yamvu about 1665. The Lunda confederation of chiefdoms, bound by tribute, grew across southern Congo, northeastern Angola and Zambia, and its migrants founded the eastern kingdom of Kazembe."
 lule_group_desc: "The $lule_group$ $group_text$ $lule_language$ language.\n\nThe Lule were an Indigenous people of the Gran Chaco, first met in what is now Salta Province in Argentina. They lived mainly by hunting and gathering but also planted maize, potatoes and quinoa, and the villages west of Salta kept llamas. Their language forms a small family with Vilela.\n\nFrom 1670 the Jesuits gathered them into the mission of San José de Lules. After the Chaco campaign of 1708, four hundred Lules were settled at San Juan Bautista de Balbuena and in 1715 moved to San Esteban de Miraflores on the Salado River. The mission was sacked in 1728 and rebuilt in 1752, and passed to the Franciscans after the Jesuits were expelled in 1768."
 macro_je_group_desc: "The $macro_je_group$ $group_text$ $macro_je_language$ language.\n\nThe Macro Je group, the Jê peoples and their wider Macro-Jê relatives, held the highlands and savanna of the Brazilian interior while Tupi–Guarani peoples occupied the coast. Northern Jê peoples include the Timbira and the Mebêngôkre, or Kayapó; the central Jê include the Xavante and Xerente, and the southern Jê include the Kaingang and Xokleng.\n\nWhen the Portuguese founded São Paulo in 1554 the hinterland still belonged to them. In the eighteenth century bandeirantes hunting gold and slaves drove the Kayapó west, the Xavante were enslaved and then withdrew into Mato Grosso from the 1830s, and the Kariri rose in the war of 1683–1713."
 maghrebi_group_desc: "The special characteristics of the north of Africa, the many empires that have risen and fallen on its lands and its unique situation between the calm sea of the Mediterranean to the north and the unforgiving sea of dunes of the Sahara to the south, has created a group of cultures singularly adept on taking care of it.\n\nThe Maghrebi group gathers the Muslim peoples of northwest Africa: Amazigh peoples such as the Zenata, Sanhaja, Masmuda, Kabyles and Tuareg, the Arabic-speaking Moroccans, Algerians, Tunisians and Libyans, and the Andalusi refugees from Iberia. Europeans called the region's Muslims and Jews Moors.\n\nThe Almohad empire had broken into three states, and in 1337 the Marinids of Fez took Tlemcen from the Zayyanids, while the Hafsids held Tunis. Ibn Khaldun, born in Tunis in 1332, wrote his history of these dynasties. The Ottomans took Algiers in 1516 and Tunis in 1574, while the Saadi dynasty of Morocco defeated Portugal at Alcácer Quibir in 1578. The Alaouites took Morocco in 1666."
 malagasy_group_desc: "The diverse people of the island of Madagascar trace their origin from the coast of Southeast Africa to the islands of Southeast Asia.\n\nThe Malagasy group arose over centuries when Austronesian settlers from southern Borneo, who mostly settled the interior, mixed with Bantu migrants from Southeast Africa, who founded communities on the coasts. They speak Malagasy, an Austronesian language.\n\nBy the Middle Ages over a dozen ethnic identities had formed, each under local chieftains. The Sakalava, Merina and Betsimisaraka were later united into kingdoms that grew rich on trade with Europeans and Arabs; pirates were active on the coast from the sixteenth to the eighteenth century. Around 1800 Andrianampoinimerina reunited the highland kingdom of Imerina, and his son Radama I extended its rule over much of the island."
 malibu_group_desc: "The $malibu_group$ $group_text$ $malibu_language$ language.\n\nThe Malibu were riverine peoples of the lower Magdalena wetlands of northern Colombia. Their languages, now extinct and poorly recorded, form a family of their own, once grouped with Chibchan though the kinship is uncertain. They lived by fishing and manioc fields in a country of seasonal floods.\n\nThey had no single king but acted through alliances. At the conquest the most powerful chief was Mompoj, who could bring together some fifty small peoples, among them the Malibues and Kimbayes. Santa Cruz de Mompox, named after him, was founded on 3 May 1537 by Juan Quintero de Heredia after his troops defeated Mompoj. Encomiendas, river traffic and disease then dissolved the Malibu communities."
 manoki_group_desc: "The $manoki_group$ $group_text$ $manoki_language$ language.\n\nThe Manoki, formerly called Irantxe, are an Indigenous people of western Mato Grosso in Brazil, whose villages stood along rivers of the Juruena basin such as the Cravari. Their language is an isolate with no known relatives, shared with the related Mỹky."
 mapudungun_group_desc: "The $mapudungun_group$ $group_text$ $mapudungun_language$ language.\n\nThe Mapudungun group includes the Mapuche of south-central Chile, the Pikunche and Purun awqa of the central valleys, the Williche to the south, and the Pehuenche of the Andes, who took up Mapudungun later. Spaniards invaded from 1541.\n\nThe Mapuche rose in the Arauco War in 1550, killed Pedro de Valdivia in 1553, and in 1598 won the ambush at Curalaba, which cost the Spaniards seven cities and fixed the frontier at the Bío Bío. From the seventeenth century Mapuche bands crossed the Andes and spread their language and horse culture over the Pampas, absorbing the Het."
 maskoy_group_desc: "The $maskoy_group$ $group_text$ $maskoy_language$ language.\n\nThe Maskoy group is made up of the Lengua-Maskoy peoples of the Paraguayan Gran Chaco: the Enlhet, or Northern Lengua, the Enxet, or Southern Lengua, and the Guaná. They were hunter-gatherers of the dry Chaco forest, moving in small kin bands in search of game, wild fruit and honey.\n\nThe Guaná were subjugated by the horse-riding Mbayá. In 1760 the Jesuit Manuel Durán gathered Guaná fleeing Mbayá rule into the San Juan Nepomuceno reduction, which held six hundred people when the Jesuits were expelled in 1768. A second reduction was founded in 1797 at Caazapá, where mixing with Guaraní women soon Guaranized the community."
 massachusett_group_desc: "The $massachusett_group$ $group_text$ $massachusett_language$ language.\n\nThe Massachusett group is made up of the Eastern Algonquian peoples of southern New England: the Massachusett, Wampanoag, Pequot, Narragansett, Quiripi and Pocumtuck. Their villages lay between fishing stations and fields of corn, beans and squash.\n\nAn epidemic in 1616–1619 killed most of the Wampanoag, and the Pilgrims founded Plymouth in 1620. The Pequot War of 1636–1638 ended with the Pequot nation broken. The minister John Eliot founded the praying town of Natick in 1651 and printed an Indian Bible in 1663. King Philip's War of 1675–1676, led by the Wampanoag sachem Metacom, destroyed the praying towns and cost most of the peoples their lands."
 mataco_guaicuru_group_desc: "The $mataco_guaicuru_group$ $group_text$ $mataco_guaicuru_language$ language.\n\nThe Mataco Guaicuru group gathers the Matacoan and Guaicuruan peoples of the Gran Chaco, among them the Wichí, Nivaclé and Maká and the Guaicuru, Moqoit and Abipones. The Guaicuruans were nomadic warriors who took to horses after the Spanish founded Asunción in 1537, while the Matacoans settled along the rivers and lived by fishing, gathering and small-scale farming.\n\nThe Abipones had given up farming for cattle and horse raiding by 1641. On Good Friday 1686 some 800 Moqoit sacked Esteco, and in 1632 the Wichí and Toba destroyed Santiago de Guadalcázar. In 1743 Jesuits opened the San Javier reduction for the Moqoit, and their expulsion in 1768 left the missions without protectors."
 maya_group_desc: "The $maya_group$ $group_text$ $maya_language$ language.\n\nThe Maya group is the peoples of the Mayan language family, spread across southern Mexico, Guatemala and Belize, from the Yucatec of the northern peninsula and the Ch'ol and Itza to the K'iche', Kaqchikel and Mam of the highlands, and the Huastec in the far north. In the Classic period, from about 250 to 900, their scribes left thousands of hieroglyphic inscriptions.\n\nThe K'iche' ruled from Q'umarkaj until Pedro de Alvarado destroyed their army in 1524. The Itza fled south to the Petén lakes and held out at Nojpetén until Martín de Ursúa stormed it in 1697, ending the last independent native kingdom in the Americas. Maya writers produced the Popol Vuh and the Books of Chilam Balam."
 micronesian_group_desc: "As their Polynesian neighbors, the Micronesians excel at seafaring and have managed to colonize hundreds of islands and atolls across the Western Pacific.\n\nThe Micronesian group gathers the Austronesian island peoples of the western Pacific. Micronesia proper has about two thousand small islands in four main archipelagos, the Carolines, Gilberts, Marianas and Marshalls, and the group also takes in the Fijians and the peoples of the Solomons, Vanuatu and New Caledonia.\n\nThe Chamorro of the Marianas, the Chuukese, the Pohnpeians and the Gilbertese lived in small chiefdoms and clans. Magellan reached the Marianas in 1521, and Spain began settling Guam in 1668. Abel Tasman sighted Fiji in 1643, and most other islands met Europeans only in the eighteenth century."
 misumalpan_group_desc: "The $misumalpan_group$ $group_text$ $misumalpan_language$ language.\n\nThe Misumalpan group takes its name from the Miskito, Sumo and Matagalpa languages of the Caribbean lowlands and highlands of Nicaragua and Honduras. The Lenca of southwestern Honduras, whose language is an isolate, are grouped with them.\n\nThe Lenca rose in 1537 under the war leader Lempira, who gathered some 30,000 men at the fortified hill of Cerquín; his death that year broke the revolt. The Matagalpa of the Nicaraguan highlands fought the Spanish from 1525 and rose again in 1643, 1688 and 1773. On the coast the Miskito allied with the English, who crowned their chief king in 1660, and with firearms their raiders seized Mayangna captives for Jamaican plantations."
 mongolian_group_desc: "Originating from the vast steppes of Central Asia, the $mongolian_group$ people embody a nomadic legacy that spans centuries. Renowned for their equestrian prowess and skilled archery, they traverse the open plains, fostering a deep connection with their herds. Through the leadership of historic figures like $genghis_khan_name_no_tooltip$, they have forged one of the largest empires in history, leaving an indelible mark on the annals of conquest. Their enduring cultural richness encompasses traditions of horsemanship, throat singing, and a resilient spirit anchored in the boundless expanses they call home.\n\nThe Mongol group gathers the peoples of the Mongolian steppe: the Mongols proper, the western Oirats, the Kharchin and Tümed of the south, and the Sibe and Daur of Manchuria. Genghis Khan united them in 1206.\n\nIn 1337 Toghon Temür ruled the Yuan dynasty, the Mongol-led realm in China. The Ming drove the Yuan court north in 1368, and its descendants held the Mongolian plateau as the Northern Yuan until 1635. Dayan Khan reunited the eastern Mongols around 1500, and Altan Khan of the Tümed met the Dalai Lama in 1578. The Qing then took over the Mongol lands and destroyed the Oirat Dzungars in the 1750s."
 mordvinic_group_desc: "The Mordvinic peoples of the middle Volga region speak languages of the Mordvinic branch of the Uralic family, forming one of the largest indigenous groups of European Russia. The Moksha and Erzya are closely related but speak distinct languages and maintain separate cultural identities.\n\nThe Mordvinic group gathers the Erzya and Moksha, and the Meschera, a Finno-Ugric tribe between the Oka and Klyazma rivers. Around the 700s the ancestors of the Mordvins met the Bulgars and paid tribute to Volga Bulgaria.\n\nThe Mongols took the region in the 1200s and made it part of the Golden Horde. In the late 1300s Moscow took the western Mordvin lands, and the east passed to the Kazan Khanate; when Kazan fell in 1552, all Mordvins became Russian subjects. After a rising with the Chuvash and Mari in the 1600s was crushed, many Mordvins fled east across the Volga."
 moseten_group_desc: "The $moseten_group$ $group_text$ $moseten_language$ language.\n\nThe Tsimané, also called Chimane, are a forest people of the Bolivian Beni, scattered from the Quiquibey River to the headwaters of the Maniquí. Their language, Tsimané or Mosetén, is an isolate. They lived in villages of twenty to thirty families, farming bananas and manioc and following the fish runs upriver.\n\nJesuits made first recorded contact with them in 1693, when they founded the San Borja mission. Franciscans took up the work later, but epidemics brought the Tsimané to the brink of extinction, and many families dispersed deeper into the forest."
 movima_group_desc: "The $movima_group$ $group_text$ $movima_language$ language.\n\nThe Movima group gathers the Movima and Cayubaba of the Llanos de Moxos, the seasonally flooded savanna of the Bolivian Beni, where each spoke its own isolate. They were semi-sedentary farmers who raised terraces, hunted, fished and gathered wild fruit.\n\nThe priest Gregorio de Bolívar was the first European to reach the Movima, in 1621, and in 1700 Father Altamirano counted some twenty thousand of them in eighty small settlements. The Jesuit Agustín Zapata found seven Cayubaba villages in 1693, and in 1704 the Cayubaba were gathered into the Exaltación de la Santa Cruz mission. The Jesuits then drew both peoples into reductions such as San Lorenzo, opened in 1708."
 muchik_group_desc: "The $muchik_group$ $group_text$ $muchik_language$ language.\n\nThe Muchik group centres on the Xllang, the people of the Sicán, or Lambayeque, culture, who succeeded the Moche in the river valleys of the Peruvian north coast around Chiclayo from about 750 to 1375. They spoke Muchik, later called Mochica or Yunga. Their religious capital at Batán Grande flourished between 900 and 1100, and after its temples were burned a new capital rose at Túcume.\n\nThe Lambayeque polities still ruled their valleys in 1337, but Chimor ended their independence around 1375. Farther south in the Chillón valley lived the Collique and the Canta, whom the Inca subdued. Fernando de la Carrera printed the Arte de la lengua yunga in 1644."
 mura_group_desc: "The $mura_group$ $group_text$ $mura_language$ language.\n\nThe Mura are a riverine people of the central Amazon, moving among the islands, channels and lakes between the Madeira and Purus rivers. They were expert canoeists and fishers who lived in small, dispersed family groups, and called themselves Buhuraen. Their Bohurá language belongs to the Mura family.\n\nThey first appear in records in 1714. After Portuguese slavers raided them, they fought the missions and colonial advance for most of the century, switching from open battle to river ambushes. By 1774 their raids menaced the whole colony of Amazonas, and peace came in 1786, as epidemics and war with the Munduruku wore them down."
 muskogee_group_desc: "The $muskogee_group$ $group_text$ $muskogee_language$ language.\n\nThe Muskogee group gathers the Muskogean-speaking peoples of the southeastern woodlands, among them the Muscogee, Coosa, Koasati, Yamasee and Guale. Their ancestors belonged to the Mississippian culture, which built mound towns and grew maize in present-day Tennessee, Georgia and Alabama. By the mid-sixteenth century many centres had declined, leaving chiefdoms such as Coosa on the Coosa River.\n\nHernando de Soto's army crossed the region in 1540—1543 and defeated Chief Tuskaloosa at Mabila. Epidemics and the Indian slave trade then broke the old chiefdoms, and the survivors regrouped as the Creek Confederacy, which took in Yamasee, Guale and others. Most Muscogee were removed west in the 1830s."
 myaamia_group_desc: "The $myaamia_group$ $group_text$ $myaamia_language$ language.\n\nThe Myaamia group gathers the Algonquian peoples who spoke Miami-Illinois, the Miami and their Illinois neighbours around the southern Great Lakes. The Miami included the Atchakangouen, Wea, Piankeshaw and Pepikokia bands. Maize farmers and hunters, they were driven to the west shore of Lake Michigan by Iroquois raids in the Beaver Wars.\n\nAround 1700 they returned to the Wabash and Maumee valleys with French firearms and trade, and their capital Kekionga stood where Fort Wayne now is. The Miami of Kekionga stayed allied with Britain through the American Revolution, and under Chief Little Turtle they led the Western Confederacy in the Northwest Indian War against the United States. Most were removed west in the 1820s and 1830s."
 nadene_group_desc: "The $nadene_group$ $group_text$ $nadene_language$ language.\n\nThe Nadene peoples include the Tlingit of the Alaskan coast, the many Athabaskan, or Dene, peoples of the northwestern interior, and the Apachean Diné and Indé of the Southwest. The Athabaskans, who include the Chipewyan, held one of the widest territories in North America, from Alaska across the subarctic of Canada.\n\nThe Tlingit lived in the rainforest of the Alexander Archipelago, in matrilineal clans, and first met Europeans in 1741, when Russian explorers arrived. The Apachean peoples are descended from Athabaskans who migrated far south. By the 1600s the Diné lived in Dinétah, New Mexico, and took up farming from their Pueblo neighbours and sheep from the Spaniards."
 nahua_group_desc: "The $nahua_culture$ that inhabit the region of Mexico are famed for their advanced societies, intricate government systems, and warlike relations with their neighbors.\n\nThe Nahua group includes the Mexica, known as Aztecs, their Tlaxcaltec rivals, and the Pipil who carried Nahuat speech south into El Salvador. The Nahua are thought to have come from near Aridoamerica and migrated into central Mexico around 500 CE, settling the Basin of Mexico. Before the Spanish arrived they were divided into many groups without a common identity.\n\nThe Mexica founded Tenochtitlan in 1325 and in 1428 joined Texcoco and Tlacopan in the Triple Alliance, which ruled central Mexico. In 1519 Hernán Cortés landed, and the Tlaxcaltecs, enemies of the Mexica, joined the Spaniards, who took Tenochtitlan in 1521."
 napuruna_group_desc: "The $napuruna_group$ $group_text$ $napuruna_language$ language.\n\nThe Napuruna, or Napo Runa, are the Quijos of the Napo, Aguarico and Putumayo river basins on the eastern slope of the Andes, in present-day Ecuador and Peru. Their original language, Shillipanu, gave way to Quichua, as it spread first through trade between the highlands and the lowlands and then with the Inca conquest of Ecuador.\n\nThe Spaniards entered their country in the sixteenth century and almost wiped the Quijos out. In 1578 the warrior Jumandi led a rising against Spanish rule; he was captured, tortured and killed in 1579."
 natchez_group_desc: "The $natchez_group$ $group_text$ $natchez_language$ language.\n\nThe Natchez group centres on the Natchez and their close kin the Taensa, peoples of the lower Mississippi Valley. Both descend from the Plaquemine culture, which raised platform mounds and farmed maize, and the Natchez spoke a language with no known relatives. The Natchez were ruled by a hereditary paramount chief, the Great Sun, whose title passed through the female line.\n\nHernando de Soto's expedition met a powerful chiefdom on the river in 1542. The Taensa, pressed by Chickasaw and Yazoo raids, moved to Mobile under French protection in 1715. The Natchez rose against French Fort Rosalie in 1729 and were crushed by 1731, and their captives were sold into slavery in Saint-Domingue."
 nepali_group_desc: "The people of the Nepal area are of diverse origins and heritages. While the Gurung and Tamang have their roots in China and Tibet, the Khas and Kumaoni hail from the Indian subcontinent. Nonetheless, the variety of cultures of Nepal claim the Himalayas as their home.\n\nThe Nepali group includes the Newars of the Kathmandu Valley, the Indo-Aryan Khas, the Tharu of the southern plain, and hill peoples of Nepal and Sikkim such as the Magar, Tamang, Gurung, Limbu and Sherpa. In the Kathmandu Valley the Malla dynasty ruled the Newar cities from 1201 to 1769, a rich meeting point on the India–Tibet trade route.\n\nThe valley was united under Jayasthiti Malla in the late fourteenth century, and in 1482 it split into the kingdoms of Kathmandu, Patan and Bhaktapur. The Gorkha king Prithvi Narayan Shah conquered all three in 1768–1769."
 netherlandish_group_desc: "In the low-lying lands marked by rivers and the perpetual struggle with the sea, the diverse Netherlandish people have forged a unique identity. Known for mercantile prowess, maritime exploration, and innovation, they share a common heritage shaped by trade and an unyielding mastery over their watery domain.\n\nThe Netherlandish group includes the Dutch and Flemings of the Low Franconian group, the Frisians of the coast, the Walloons and Picards of the south, and the Westphalians of the eastern border. Flemish and Brabantine cloth towns made the region rich.\n\nThe Dukes of Burgundy gathered the provinces in the fifteenth century, and Mary of Burgundy's marriage brought them to the Habsburgs in 1477. The Dutch Revolt against Philip II began in 1568 under William of Orange, and the northern provinces joined in the Union of Utrecht in 1579. Spain accepted the independence of the Dutch Republic at Münster in 1648, and the East India Company of 1602 built a trading empire."
 nguni_group_desc: "The Nguni peoples of southeastern Africa speak a cluster of closely related Bantu languages distinguished by their rich system of click consonants borrowed from neighboring Khoisan peoples. Organized around cattle wealth, age-grade systems, and powerful chieftaincies, the Nguni gave rise to the great Zulu and Xhosa nations that dominated the eastern coast of southern Africa.\n\nThe forebears of the Nguni came south from Central Africa in the late Iron Age with sheep and cattle. The Xhosa of the Eastern Cape descend from Nguni, Khoe and !Kwi clans under the royal house of the amaTshawe.\n\nIn the sixteenth century the Xhosa formed the Gcaleka, Rharhabe and Gqunukhwebe sub-federations, and their homeland later met the expanding Dutch Cape Colony, which they fought in the Frontier Wars. In the early 1800s the king Shaka founded the Zulu Empire, and in the turmoil called the Mfecane the Ndebele and the Ngoni moved north out of southern Africa."
 nilosahelian_group_desc: "The Nilo-Saharan peoples inhabit a broad belt stretching from the Sahara to the Ethiopian highlands, speaking languages of the diverse Nilo-Saharan family. They include the farmers of the Nuba Mountains, the merchants of the Darfur sultanates, and the nomads of the Saharan fringe.\n\nThe Nilo-Saharan group includes the Daju, Fur and Berta of Sudan, the Toubou of Tibesti, the Kunama of the Eritrean lowlands and the Nuba of the hills of Kordofan. The Toubou, divided into Teda and Daza, were clan-based herders and oasis farmers whose clans each held certain wells and pastures.\n\nThe Nuba lived in some fifty groups in the Nuba Mountains, and spoke languages that were not closely related to each other. In Darfur the Tunjur kingdom gave way in the 1500s to the Fur sultanate of the Keira dynasty, founded, tradition says, by Daali. By the late 1700s Darfur reached east to Kordofan and the White Nile."
 nilotic_group_desc: "The Nilotic peoples are the pastoralist and semi-pastoralist communities of the Nile Valley and the East African plains, speaking languages of the Nilotic branch of Nilo-Saharan. From the cattle-herding Maasai of the Rift Valley to the fishermen of the Sudd, they are united by age-grade social structures and a deep dependence on livestock.\n\nThe Nilotic group includes the Luo, Dinka, Nuer, Shilluk and Anuak of South Sudan and its borderlands, and the Turkana, Maasai and Kalenjin of Kenya and Tanzania. In the early centuries of the second millennium the southern Luo moved south from the Bahr el Ghazal region, and the Maasai also came down from South Sudan.\n\nThe Maasai and Kalenjin adopted age-set organisation from their Cushitic neighbours and absorbed or displaced earlier peoples. On the White Nile, Nyikang founded the Shilluk Kingdom at Fashoda in the late 1400s; its sacred king, the Reth, was bound up with the nation's well-being."
 nuuchi_nuwu_group_desc: "The $nuuchi_nuwu_group$ $group_text$ $nuuchi_nuwu_language$ language.\n\nThe Nuuchi Nuwu group spans the Great Basin and the Colorado Plateau and includes the Nuuchi, or Utes, the Nuwuvi, or Southern Paiute, and the Kawaiisu of the Tehachapi Mountains in California, all Southern Numic peoples. The Utes and Southern Paiute spoke Colorado River Numic, a Uto-Aztecan language, and the two were mutually intelligible.\n\nThe Utes lived in nearly a dozen nomadic bands across Utah and Colorado, traded with Pueblo peoples, and had horses by the late seventeenth century. The Southern Paiute farmed corn and squash by irrigation along the Colorado River; the first Europeans to meet them were Domínguez and Escalante in 1776."
 ob_ugric_group_desc: "The $ob_ugric_group$ $group_text$ $ugrian_language$ language.\n\nThe Ob-Ugric group comprises the Mansi, once called Voguls, and the Khanty, once called Ostyaks. Their two languages belong to the Uralic family and are close relatives of Hungarian. They lived between the Urals and the Ob and Irtysh rivers, where the Khanty are recorded in Russian sources as Yugra from about the eleventh century and traded with Novgorodian hunters and merchants.\n\nTheir tribes each had their own chief, and some Khanty princedoms were partly included in the Khanate of Siberia from the 1440s to the 1570s. The Russians arrived about five hundred years ago, pushing the Mansi and Khanty eastward toward the Ob and Irtysh, while some Mansi stayed west of the Urals."
 otopamean_group_desc: "The $otopamean_group$ $group_text$ $otopamean_language$ language.\n\nThe Otopamean group includes peoples of the Oto-Manguean language stock, mostly the Oto-Pamean peoples of the central Mexican highlands: the Otomi, the Matlatzinca of the Toluca Valley, the Pame, and the Chichimeca bands of the Bajío such as the Guamar. Farther away, Oto-Manguean speakers included the Chorotega, who moved south to Nicaragua around 800, the Chiapanec and the Tlapanec.\n\nThe Otomi lost their lands in the Valley of Mexico to the Mexica, who took the Matlatzinca valley under Axayacatl in 1475. After the conquest of 1521 the Otomi helped colonize the Bajío, while the Guamar and their neighbours fought the Spanish in the Chichimeca War of 1550—1590. Many Chorotega were enslaved."
 paiute_group_desc: "The $paiute_group$ $group_text$ $paiute_language$ language.\n\nThe Paiute group here is the Mono, or Monachi, who lived in the central Sierra Nevada, on its eastern slope and around the Mono Basin. They are often labelled Northern Paiute, but they are a separate Numic people. Their name comes from a Yokuts word for ‘fly people’, because Mono Lake gave them fly larvae to eat and trade.\n\nThe Eastern Mono of the Owens Valley dug irrigation ditches along the Owens River and could store food, while the Western Mono kept to the mountains west of the crest."
 pama_nyungan_group_desc: "The Pama-Nyungan peoples inhabit the vast majority of the Australian continent, speaking languages of the Pama-Nyungan family which covers roughly eighty percent of Australia's land area. Despite the enormous diversity within this family, these peoples share broad cultural patterns including complex kinship systems, the Dreaming cosmology, and hunter-gatherer subsistence.\n\nThe Pama-Nyungan group includes the Noongari of the southwest, the Wiradjurin of central New South Wales and the Gumbaynggirr of the east coast. The family takes its name from pama, the northeastern word for man, and nyungar, the southwestern one.\n\nSome 300 Pama-Nyungan languages were spoken when Europeans arrived. The Dutch navigator Willem Janszoon landed on Cape York in 1606, James Cook charted the east coast in 1770, and the First Fleet reached Botany Bay in 1788."
 panche_group_desc: "The $panche_group$ $group_text$ $panche_language$ language.\n\nThe Panche, also called the Tolima, were a warlike people of the western slopes of the Eastern Andes, between the Muisca plateau and the Magdalena River in present-day Colombia. At the conquest they numbered about 30,000, in a loose confederation of independent chiefdoms.\n\nThey raided the Muisca to the east with clubs and poisoned arrows. In 1538 they were routed at Tocarema by the Spaniards of Gonzalo Jiménez de Quesada, who fought alongside Muisca rivals under Sagipa. Resistance went on until Hernán Venegas Carrillo subdued the chiefdoms, and disease and colonial settlement then greatly reduced the survivors."
 pano_group_desc: "The $pano_group$ $group_text$ $pano_language$ language.\n\nThe Pano group includes peoples of the southwestern Amazon in eastern Peru, northern Bolivia and western Brazil: the Uni, known as Cashibo or Kakataibo, the Pacahuara and the Kaxarari, who speak Panoan languages, together with the Tacanan-speaking Ese Ejja and Tacana. The two language families may be related.\n\nThe Tacana met Inca expansion on the Beni River, and Franciscans entered their country around 1680 and founded missions after 1731. The Uni joined the rebellion of Juan Santos Atahualpa in 1744 and helped destroy the missions; in 1757 they killed a friar and drove off the rest."
 panzaleo_group_desc: "The $panzaleo_group$ $group_text$ $panzaleo_language$ language.\n\nThe Panzaleo group covers the highland peoples of Ecuador around Quito and Latacunga, among them the Quitu, Guayacundo, Chimbus and Hambatus. Their pre-Inca language, Panzaleo, gave way to Kichwa in the seventeenth century.\n\nThe Quitu, who founded Quito, held the valleys beneath the Pichincha volcanoes, which they held sacred. Around 1470 Topa Inca Yupanqui conquered them, and they rose against Huayna Capac with the Cayambis and Caranquis. The Spaniards took Quito in 1534."
 papuan_group_desc: "The Papuan peoples are the indigenous inhabitants of New Guinea and neighboring islands, speaking hundreds of languages from diverse and largely unrelated language families collectively known as Papuan. Their remarkable linguistic and cultural diversity reflects thousands of years of isolated development across the island's rugged terrain.\n\nThe Papuan peoples include those of the Bismarck Archipelago as well as New Guinea. Their roughly 800 languages fall into perhaps sixty small families with unclear relationships, and Papuan is only a geographical label for languages that are not Austronesian. Their ancestors developed one of the earliest agricultures, leaving ancient irrigation systems in the highlands.\n\nEuropeans first sighted the island in the 1520s, when Jorge de Menezes named it ilhas dos Papuas, and Íñigo Ortiz de Retes named it New Guinea in 1545. In the west the Sultans of Tidore claimed the coast, while the highland interior remained unknown to Europeans."
 penutian_group_desc: "The $penutian_group$ $group_text$ $penutian_language$ language.\n\nThe Penutian group rests on a hypothesis, first proposed in the early twentieth century, that linked the languages of the Miwok, Ohlone, Yokuts and Maidu of California, the Chinook of the lower Columbia and the Nimiipuu, or Nez Perce, of the interior. The wider unity is unproven.\n\nThey lived by fishing, gathering and hunting, from acorns in California to Columbia salmon. The Chinook traded between coast and interior, and Chinook Jargon grew from their speech. The Nimiipuu bred Appaloosa horses and met Lewis and Clark in 1805. Spanish missions from 1769 uprooted the Californian peoples, and mission rule ended in 1834."
 permic_group_desc: "The Permic peoples of the Ural Mountains region speak languages of the Permic branch of the Uralic family, closely related to Finnish and Estonian. The Komi and Udmurt peoples have long inhabited the forests between the Volga and the Urals, trading furs with their Slavic and Tatar neighbors.\n\nThe Permic group includes the Komi, who lived in the Vychegda, Pechora and Kama basins, the Udmurts of the Kama and Vyatka country, and the small Besermyan people, probably Tatars absorbed by the Udmurts. From the twelfth century traders from Novgorod came north for furs, and Komi dukes united Great Perm around the stronghold of Cherdyn.\n\nIn 1372 the missionary Stephen of Perm devised a Komi alphabet. The duke of Perm was baptised in 1470, Moscow seized Cherdyn in 1472, and in 1505 a Russian governor replaced the last duke; Russian settlers began moving in."
 pijao_group_desc: "The $pijao_group$ $group_text$ $pijao_language$ language.\n\nThe Pijao were a federation of allied chiefdoms in the central Colombian Andes, spread along the Central Cordillera and the upper valleys of the Magdalena and Cauca rivers. They never formed a centralised state. Their priests, called mohanes, led animist rites centred on rivers and mountains.\n\nThe Pijao fought the Spaniards over control of the Magdalena, Cauca and Saldaña rivers in wars that lasted some eighty years. Between 1605 and 1615 Juan de Borja y Armendia led pacification campaigns, founding Natagaima in 1606 to settle the survivors. War, conversion to Catholicism and mixing with settlers broke the federation."
 polish_group_desc: "Divided among several countries after the fall of the last Polish State, the Polish people share a common western Slavic heritage and a strong Catholic Faith.\n\nThe Polish group includes the Poles of Lesser Poland, Greater Poland, Mazovia and Silesia, and the Kashubians of the Baltic coast. Poland had been reunited as a kingdom in 1320, and in 1337 Casimir III the Great was on the throne. He expanded into Galicia and founded a university at Kraków in 1364.\n\nHis death in 1370 ended the Piast dynasty. Jogaila of Lithuania married Queen Jadwiga in 1386 and founded the Jagiellonian dynasty, and in 1410 the joint army defeated the Teutonic Knights at Grunwald. The Union of Lublin created the Polish–Lithuanian Commonwealth in 1569. Partitions among Russia, Prussia and Austria in 1772, 1793 and 1795 ended it."
 polynesian_group_desc: "The people of Polynesia have always been seafarers, expanding all the many islands in the Pacific over the centuries. Despite being isolated from each other, the many groups living there still can trace their common cultural heritage and linguistic similarities.\n\nThe Polynesian group spans the Polynesian Triangle: the Native Hawaiians, Māori of Aotearoa, Samoans, Tahitians, Tongans and the people of Rapa Nui, or Easter Island. Their ancestors were Austronesian seafarers of Island Southeast Asia who read stars, currents, clouds and birds to cross the ocean.\n\nTheir canoes settled islands as far apart as Hawaii, Rapa Nui and New Zealand, and in the eighteenth century New Zealand held the largest Polynesian population, about 110,000. Tonga's chiefs extended their influence across nearby islands. The islands first met Europeans late: James Cook reached New Zealand in 1769 and Hawaii in 1778, and Kamehameha I united the Hawaiian islands by 1810."
 powhatan_group_desc: "The $powhatan_group$ $group_text$ $powhatan_language$ language.\n\nThe Powhatan group includes the Eastern Algonquian peoples of the Chesapeake tidewater, among them the Powhatan, Rappahannock, Nansemond and Accawmacke. Their language, Virginia Algonquian, was never written down and is known mainly from word lists made by John Smith and William Strachey.\n\nThe paramount chief Wahunsenacawh, called Powhatan by the English, built a confederacy of more than thirty tribes, and he ruled from Werowocomoco when Jamestown was founded in 1607. After his death in 1618 his brother Opechancanough led risings in 1622 and 1644. The treaty of 1646 dissolved the confederacy, and in 1677 the survivors became tributaries on small reservations."
 puebloan_group_desc: "Hailing from the fractured Ancestral Puebloans, the Pueblo people have since diverged into differing tribes across $shiewhibak_area$. Through the harsh lands of $shiewhibak_area$, the Pueblo people have grown resilient, and constructed sophisticated Adobe structures and irrigation systems.\n\nThe Pueblo group includes the Tanoan, Keres, Zuni and Hopi, along with the Hohokam and Hualapai of the Arizona deserts. The Ancestral Puebloans of the Four Corners region lived in pit houses, great pueblos and cliff dwellings and built kivas, round chambers used for ceremonies.\n\nThe Spanish gave the Pueblo peoples the name pueblo, meaning village, when they met multistorey towns of adobe and stone in New Mexico, where Spanish colonization began in 1598. Pueblo nations kept their agriculture, clans and religion, combining them with Christianity. In 1680 they rose in the Pueblo Revolt and drove the Spanish out of New Mexico, which Spain reconquered in 1692."
 pukina_group_desc: "The $pukina_group$ $group_text$ $pukina_language$ language.\n\nThe Pukina group includes the Chiribaya of the Peruvian coast, and the Charka and Yampara of the valleys of Chuquisaca in Bolivia. Puquina, often linked to the builders of Tiwanaku, survives mainly in a ritual book printed in 1607 by the Franciscan Luis Jerónimo de Oré.\n\nThe Chiribaya, fishermen and maize farmers of the Osmore valley, flourished until about 1360. Inca armies of Túpac Yupanqui conquered the Charka in the late fifteenth century. In 1538 Consara, the principal lord of the Charcas, told Hernando Pizarro's Spaniards of the region's mines, and La Plata was founded on Charka land the same year."
 pume_group_desc: "The $pume_group$ $group_text$ $pume_language$ language.\n\nThe Pume, called Yaruro by the Spanish, are a people of the Venezuelan llanos west of the Orinoco. They call themselves Pume, meaning real human, and speak a language isolate that Filippo Gilii found to be unrelated to other known tongues in 1782.\n\nThe River Pume keep manioc gardens in fixed villages, while the Savanna Pume hunt and gather, moving between seasonal camps. Missions and ranches stayed thin on their grasslands, so most bands kept their language and mobile way of life through the colonial centuries."
 purepecha_group_desc: "The $purepecha_group$ $group_text$ $purepecha_language$ language.\n\nThe Purepecha were the people of the Michoacan highlands in western Mexico, farmers and fishermen of the Patzcuaro basin whom the Spanish called Tarascans. Their language is an isolate unrelated to Nahuatl. Around 1300 the chief Tariacuri began uniting the lakeside communities, and by his death about 1350 his lineage held the whole basin.\n\nLater kings made Tzintzuntzan the capital of a tributary kingdom, and the realm reached the Pacific by 1460. It beat back an Aztec invasion in the 1470s. Tangaxuan II submitted to Spain in 1525, but Nuno de Guzman had him executed in 1530. The bishop Vasco de Quiroga then founded hospital towns for the Purepecha."
 pyrenean_group_desc: "Born of the Pyrenees Mountains that separates southern France from Iberia, the Pyrenean people share a bond forged by the shared hardships and unique societal innovations of remote life in rough borderlands.\n\nThe Pyrenean group includes the Gascons, Basques and Aragonese. Basque is unrelated to the Romance speech around it, and the Basques long kept their own laws, called fueros, in remote valleys. The Aragonese held the southern slopes in the Kingdom of Aragon.\n\nBetween them lay the Kingdom of Navarre, a Basque-led realm astride the passes. Ferdinand of Aragon conquered Upper Navarre in 1512, while the northern part stayed independent and passed to the French crown with Henry IV in 1589. The English held Gascony as part of Aquitaine until 1453, when it fell to France after the Battle of Castillon."
 quechuan_group_desc: "The $quechuan_group$ $group_text$ $quechuan_language$ language.\n\nThe Quechuan group includes the Wanka, Chanka, Chincha and the Inka of Cusco. Quechua probably spread before the Incas, possibly with the Wari state, whose cities dominated the Peruvian highlands between about 500 and 1000.\n\nIn 1337 the Inka were a small chiefdom at Cusco. After Prince Cusi Yupanqui broke the Chanka siege in 1438 and took the name Pachacuti, they built Tawantinsuyu, which reached from Quito to central Chile. Pizarro's men seized Atahualpa in 1532, and Manco Inca's rump state at Vilcabamba fell in 1572. Quechua remained the common tongue of the Andes."
 quingnam_group_desc: "The $quingnam_group$ $group_text$ $quingnam_language$ language.\n\nThe Quingnam group includes the Chimú of the northern Peruvian coast with the Tallan, the Cañari and the Puruhá. Quingnam itself was the official language of Chimor, the kingdom that arose around 900 and ruled from the adobe city of Chan Chan.\n\nChimor conquered Lambayeque around 1375 and overran the Tallan. Around 1470 the Incas under Topa Inca Yupanqui took Chimor, and they later subdued the Cañari and Puruhá of highland Ecuador; the Cañari, who backed Huáscar in the Inca civil war, were punished by Atahualpa. The Spaniards arrived in 1532, and Quingnam was extinct by 1763."
 rhaetian_group_desc: "The $rhaetian_group$ people are an ethnolinguistic group composed of three primary Alpine communities: the Romansh, Ladins, and Friulians. While they do not share a single political entity, they are unified by their descent from a common Vulgar Latin substrate mixed with ancient Rhaetian and Celtic influences.\n\nThe Romansh of Graubünden, the Ladins of the Dolomites and the Friulians are often grouped together by linguists as speakers of related languages. Romansh was once spoken far north into Glarus and St. Gallen, but German spread through the Rhine valley, and Chur turned German after a fire in 1465.\n\nGian Travers wrote the first surviving Romansh work in 1527. The Ladins lived under the Tyrolean counts and the bishops of Brixen. Friuli was ruled by the Patriarch of Aquileia until Venice annexed it in 1420."
 romani_group_desc: "The Indic Diaspora encompasses nomadic communities originating in North West India, who have migrated across various regions including the Middle East and Europe. These groups, while retaining elements of their Indian heritage, have adapted to diverse cultures and environments.\n\nThe Dom, Lom and Rom share a westward migration, probably in waves, dated to around 1000 CE, through the Ghaznavid and Byzantine worlds. The Rom reached Europe through the Balkans in the thirteenth and fourteenth centuries, the Dom settled in the Middle East, and the Lom in the Caucasus.\n\nMedieval Europeans took the newcomers for travellers from Egypt, which gave rise to the name Gypsies. In Wallachia and Moldavia, which arose in the thirteenth and fourteenth centuries, many Rom were enslaved by boyars, Orthodox monasteries and the state, and worked as smiths and farm labourers."
 romanian_group_desc: "The $romanian_group$ people, descendants of ancient Dacians and Romans, mostly inhabit the regions of Wallachia, Moldova, and Transylvania, but also across the Balkans. They boast a unique Romance variant surrounded by Slavic languages. They are celebrated for their resilience, and a love for folklore that reflects in their music, traditions, and celebrations.\n\nThe Romanian group includes the Wallachians, Moldavians and Transylvanians north of the Danube, together with the Aromanians of the Balkans and the Istro-Romanians. Wallachia consolidated as a principality by 1330, when Basarab I defeated the Kingdom of Hungary at Posada, and Moldavia emerged around 1359.\n\nWallachia had to accept Ottoman suzerainty in 1417, and Moldavia later did the same, but Stephen the Great held the Ottomans off from 1457 to 1504. Michael the Brave briefly united Wallachia, Moldavia and Transylvania in 1600. Transylvania lay under the Hungarian crown and later became a principality."
 russian_group_desc: "The Rus' people trace their origins to the Varangians, Scandinavian seafarers and warriors who settled in the Russian region around the 9th century. Over time, the Rus' underwent a process of cultural fusion, blending Slavic traditions with Scandinavian influences. Proximity to the Byzantine Empire promoted cultural and economic exchanges, contributing to their unique culture with a diverse mix of art, architecture, and language.\n\nThe East Slavic group includes the Muscovites, Novgorodians, Smolenskians, Ruthenians and others. In 988 Grand Prince Vladimir took Orthodox Christianity from Byzantium.\n\nThe Mongols conquered Rus' in 1237–1240, and the Golden Horde ruled through Moscow's princes. Lithuania took the western lands, and Poland took Halych. Moscow defeated the Horde at Kulikovo in 1380, annexed Novgorod in 1478 and ended Mongol rule in 1480 under Ivan III. Ivan IV became tsar in 1547, the Romanovs followed in 1613, and Peter I declared the Russian Empire in 1721."
 salishan_group_desc: "The $salishan_group$ $group_text$ $salishan_language$ language.\n\nThe Salishan group spans the Pacific Northwest, from the Strait of Georgia and Puget Sound inland to Idaho and Montana: the Coast Salish such as the Lushootseed and Halkomelem, the Tillamook and Tsamosan of the outer coast, and the Interior Salish such as the Secwepemc and the Saleesh.\n\nCoastal peoples lived in cedar-plank longhouses, fished salmon and gave away wealth at the potlatch. The first smallpox epidemic came in the 1680s, long before sustained contact. George Vancouver surveyed the coast in 1792 and Lewis and Clark met the Saleesh in 1805. Forts such as Vancouver, Langley and Nisqually drew them into the Hudson's Bay Company trade."
 samoyedic_group_desc: "The $samoyedic_group$ $group_text$ $nenets_language$ language.\n\nThe Samoyedic group includes the Nenets, Enets, Nganasans and Selkups of northwestern Siberia, called Samoyeds by the Russians. The Nenets, the most numerous, include the Tundra Nenets of the far north and the Forest Nenets, and the Selkups arose in the middle Ob basin.\n\nThe Selkups came under Mongol sway in the thirteenth century. Around 1628 the Russians conquered their lands and subjugated them, and an uprising against Russian rule was gunned down. In the seventeenth century some Selkups moved north to the Taz River."
 scandinavian_group_desc: "Scandinavia is home to a diverse array of peoples, shaped by a rich history of migration, trade, and cultural exchange. The different realms have developed unique identities while maintaining a sense of shared heritage. Renowned for their seafaring skills and vibrant trading networks, the Scandinavians are known for their prowess in seamanship and governance.\n\nThe Scandinavian group includes the peoples of Denmark, Sweden and Norway and their offshoots in Iceland, Gotland and the Northern Isles, together with the Finns, who lived under Swedish rule. In the Viking Age their seafarers raided, traded and settled across Europe, and were the first Europeans to reach North America. Over the following centuries the region was Christianized.\n\nIn 1397 Queen Margaret I of Denmark joined Denmark, Sweden and Norway, with Iceland and the Northern Isles, in the Kalmar Union, partly to counter the Hanseatic League. Sweden left it in 1523 under Gustav Vasa, while Denmark and Norway stayed united until 1814. In the seventeenth century Sweden rose to be an empire."
 scottish_group_desc: "The northern reaches of Britain have long been home to many peoples of diverse backgrounds; the native Picts and Cumbrians abandoned their old ways when they became absorbed into kingships of foreign Gaelic, Anglo-Saxon, and Viking origin. But in times of trial, they still unite against outsiders and become one people: the Scottish.\n\nThe Picts and the Gaels founded the Kingdom of Alba in the ninth century, and over the next two centuries the Cumbrians of Strathclyde and the Angles of Northumbria came under its rule. Norman nobles settled in the Lowlands in the twelfth century, the Norse-Gaels of the Western Isles were absorbed in the thirteenth, and the Norse of the Northern Isles in the fifteenth.\n\nScotland defeated the English at Bannockburn in 1314 and had its independence recognized in 1328. The crowns of Scotland and England were united in 1603, and the kingdoms merged in 1707."
 seeptsa_group_desc: "The $seeptsa_group$ $group_text$ $seeptsa_language$ language.\n\nThe Seeptsa are the Cholon, as the Spanish called them, rainforest people of the left bank of the Huallaga on the eastern slope of the Peruvian Andes. Their Seeptsa language, with the related Hibito, formed a small family. They lived by slash-and-burn farming, hunting and fishing, and traded feathers, wax and honey to the highland Hibito.\n\nFranciscans contacted them and founded mission villages in 1676. In the eighteenth century the friar Pedro de la Mata wrote a Seeptsa grammar. Quechua and Spanish then displaced the language along the Huallaga."
 shan_group_desc: "Although originally an exonym from the Burmese language to refer to a variety of different Tai peoples migrated to the area, and also a cognate of Siam, it has allowed these various Tai groups to develop a shared identity.\n\nThe Shan group includes the Tai peoples of the hills east of the Irrawaddy. The Shan call themselves Tai.\n\nAccording to Tai chronicles the first major Shan state was founded at Möng Kawng in 1215, followed by Möng Nai in 1223. When the Mongols overran Pagan in 1287 the Shan states gained ground, and Möng Mao ended the kingdoms of Sagaing and Pinya in 1364. The Shan were too divided to resist their larger neighbors: the Ming conquered Yunnan in the 1380s, and the Burmese kingdoms to the south later absorbed them."
 shawnee_group_desc: "The $shawnee_group$ $group_text$ $shawnee_language$ language.\n\nThe Shawnee group includes the Central Algonquian peoples of the Ohio Valley and the Great Lakes: the five divisions of the Shawnee, including the Kispoko, Pekowi and Chalahgawtha, with the related Meskwaki, or Fox, and the Sauk. Their homeland probably lay in southern Ohio, where some link the Shawnee to the Fort Ancient culture.\n\nThe Iroquois of the Beaver Wars drove the Shawnee out of Ohio, and they scattered across the Upper South and Pennsylvania in the seventeenth century. The Meskwaki fought France in the Fox Wars of 1701—1742, and a French army killed hundreds in 1730. The Shawnee fought to hold their land until Tecumseh's War of 1810—1813, and removal west began in the 1830s."
 shona_group_desc: "The Shona-speaking peoples of the Zimbabwe plateau and the Limpopo valley built one of Africa's most remarkable pre-colonial civilizations, centered on the great stone enclosures of Great Zimbabwe and its successor states. Their control of the gold trade routes to the Indian Ocean coast made them a commercial power whose wealth reached as far as China and Persia.\n\nThe Shona group includes the Shona themselves, the Kalanga and the Venda. Venda tradition links its first kings to the kingdom of Mapungubwe, which declined around 1300 as power moved north to Great Zimbabwe. From the eleventh century the Karanga formed kingdoms on the plateau, and Great Zimbabwe, the largest stone structure of precolonial southern Africa, became their capital in the thirteenth century.\n\nButua was ruled by the Torwa dynasty, and the Mutapa Empire reached the Mozambique coast, exporting gold to Swahili, Arab and East Asian traders. Succession wars let the Portuguese gain ground in the 1500s, and in the 1830s the Ndebele destroyed the weakened Rozvi Empire."
 shoshoni_group_desc: "The $shoshoni_group$ $group_text$ $shoshoni_language$ language.\n\nThe Shoshoni group spans the Great Basin: the Western Shoshoni, the Kusiutta, or Goshute, of western Utah, the Bannock of the Snake River plains and the Numu bands of western Nevada. Their ancestors were Proto-Numic speakers who spread out of the southern Sierra Nevada.\n\nFamilies lived in small bands that gathered pine nuts each autumn and joined communal rabbit and pronghorn drives. Horses reached the region by 1730, and some eastern bands took to mounted bison hunting and split off as the Bannock. The Comanche, who stayed Shoshoni until about 1700, left for the southern plains."
 sihni_group_desc: "The $sihni_group$ $group_text$ $sihni_language$ language.\n\nThe Sihni are the Itonama of the Bolivian Amazon, who live in the seasonally flooded savannas of the Beni lowlands along the Itonomas River. Their language, sihnipadara, meaning our language, is an isolate with no proven relatives.\n\nThey lived by slash-and-burn farming, fishing and hunting in small communities led by village councils, and honoured a high god called Dijnamu. In 1704 the missionary Lorenzo Legarda counted twenty-six Itonama communities of some six thousand people. Mission towns such as Magdalena then gathered them into Christian parish life."
 siksika_group_desc: "The $siksika_group$ $group_text$ $siksika_language$ language.\n\nThe Siksika group includes the Siksika, whose name means black foot, the Piikani and the Akinaa, the Blackfoot peoples of the northwestern Great Plains. Their dialects of Siksika, an Algonquian language, belong to the nations of the Blackfoot Confederacy.\n\nTheir ancestors were woodland people of the upper Great Lakes who drifted west onto the plains after about 1200 and hunted bison on foot, driving the herds over jumps. They had horses by the early 1700s and became mounted raiders who gathered each summer for the Okan, or Sun Dance. Their chief enemies were the Cree and Assiniboine. Smallpox devastated every Blackfoot nation in 1837."
 sinu_group_desc: "The $sinu_group$ $group_text$ $sinu_language$ language.\n\nThe Sinu, or Zenu, were the farming people of the Sinu and San Jorge river valleys and the Gulf of Morrosquillo in northern Colombia. Their civilization drained seasonally flooded savanna with a network of canals and raised terraces, and its goldsmiths packed the graves of chiefs with gold.\n\nThat gold drew the conquistadors, and between 1510 and 1535 warfare and epidemics broke the Zenu chiefdoms. In 1773 the Spanish crown set aside the reserve of San Andres de Sotavento for them. The Zenu language had died out by the early 1800s."
 skarureh_group_desc: "The $skarureh_group$ $group_text$ $skarureh_language$ language.\n\nThe Skarureh group includes two Iroquoian peoples of the southern Atlantic coastal plain: the Skarureh, called Tuscarora by the English, of North Carolina, and the Nottoway, who call themselves Cheroenhaka, of Virginia. The Skarureh name means hemp gatherers, and their matrilineal clans formed a confederacy of three tribes.\n\nThe Tuscarora War of 1711—1715 ended with the storming of Fort Neoheroka, and most survivors drifted north. In 1722 the Oneida sponsored their admission as the sixth nation of the Haudenosaunee. The Nottoway signed the Treaty of Middle Plantation in 1680, became tributaries of Virginia and lost their lands to settlers."
 slavic_group_desc: "The Slavic peoples, originating on the upper areas of the Vistula and Dnieper rivers in the times of the Roman Empire, expanded over centuries to occupy much of Eastern Europe. Despite being separated into different branches and forming many different states and kingdoms, their shared cultural ancestry remains.\n\nSlavic peoples appear in Byzantine records as the Sclaveni and Antes in the early sixth century, and by the seventh Slavs held much of Central, Eastern and Southeastern Europe. By the twelfth century the East Slavs lived in Kievan Rus', the West Slavs in Bohemia, Moravia and Poland, and the South Slavs in Bulgaria, Serbia, Croatia and Bosnia.\n\nIn 1237 the Mongols began their conquest of the Rus' principalities, and Moscow later rose to lead the northeast. In the Balkans the Ottomans overran Serbia and Bosnia in the fifteenth century, and the Czech lands passed to the Habsburgs in 1526."
 sotho_tswana_group_desc: "The Sotho-Tswana peoples of the southern African highveld speak the closely related Sotho and Tswana languages and share a common heritage of nucleated village life, cattle-based wealth, and sophisticated iron-working traditions. Their large towns on the dry plateau interior were among the most populous settlements in pre-colonial southern Africa.\n\nThe Sotho-Tswana group includes the Sotho, Tswana and Lozi. Their ancestors reached Botswana and the highveld about AD 200—500, and by the fifteenth century they were spreading across the southern Transvaal and forming new chiefdoms. They kept totem clans and lived in round huts with conical thatched roofs.\n\nTswana chiefdoms were ruled by dikgosi with advisory councils and built large towns: Kweneng, a settlement of the fifteenth to nineteenth centuries, and Kaditshwene, the cultural capital of the Bahurutshe, with some 10,000 people. The Lozi kingdom arose in the seventeenth century on the Zambezi floodplain, and about 1830 the Sotho Makololo under Sebetwane invaded and conquered it."
 south_slavic_group_desc: "The Southern Slavs are a diverse group, including several peoples in the Balkan Peninsula. These people share a Slavic heritage and their linguistic roots but have developed distinct cultures over centuries.\n\nThe South Slavic group includes the Slavs of the eastern Alps and the Balkan Peninsula: the Bulgarians, Serbs, Croats, Slovenes and Bosnians, among others. Late Roman writers first mention them in the sixth century as the Sclaveni, who crossed the Danube into the Byzantine provinces. Each people then formed its own realm.\n\nIn 1346 Stefan Dušan was crowned emperor of the Serbs and Greeks, and in 1377 Tvrtko I became king of Bosnia. After the Ottoman victory at Kosovo in 1389, Bulgaria fell in 1396, Serbia in 1459 and Bosnia in 1463. The Slovenes lived under the Habsburgs, and Croatia accepted a Habsburg king in 1527."
 steppe_group_desc: "The $steppe_group$ is formed by various cultures belonging to the $mongolian_group$ and $tatar_group$ that live in the steppes of Eurasia.\n\nThe Steppe group stretches from the Mongolian plateau to the Crimea and the Volga. Temüjin, proclaimed Genghis Khan in 1206, united the nomadic tribes of Mongolia, and his heirs built the largest contiguous empire in history. Its northwestern part became the Golden Horde.\n\nAfter the Great Troubles of 1359 to 1381, Timur's invasion of 1396 broke the Horde into smaller khanates. Moscow threw off the Tatar yoke at the Ugra River in 1480, and the Great Horde disintegrated in 1502, leaving Kazan, Astrakhan, Crimea and the Nogai. In the east the Mongols held the plateau as the Northern Yuan after the Ming drove them from China in 1368."
 swiss_group_desc: "The Swiss are the people who call the Swiss Plateau and the Alps their home. Due to their geographical position, the Swiss group is not exclusively Germanic as French and Italian cultures are part of Switzerland.\n\nThe Swiss group includes the German-speaking High Alemannic, French-speaking Arpitan, the Romansh of the eastern valleys and the Franc-Comtois of the Jura borderland. Their languages differ, but a shared political history united them.\n\nThe Old Swiss Confederacy formed at the end of the thirteenth century from a core in central Switzerland and had added Zurich and Bern by the mid-fourteenth century, joining rural and urban communes of the Holy Roman Empire. Victories in the Burgundy Wars of the 1470s made it a military power, and after the Swabian War of 1499 it was independent in practice. It had thirteen cantons by 1513, and the Reformation then divided them by faith."
 ta_arawakan_group_desc: "The $ta_arawakan_group$ $group_text$ $ta_arawakan_language$ language.\n\nThe Ta Arawakan peoples spread from the Amazon and Orinoco basins across northern South America to the Guianas, Colombia and the Caribbean. They include the Taino of the islands, the Lokono of the Guianas and the Wayuu of the Guajira, and in the interior the Yanesha, Matsigenka and Moxo.\n\nThe Taino lived under hereditary caciques and worshipped spirit images called zemis. In 1492 they were the first Americans Columbus met, and the encomienda and epidemics shattered them; the cacique Enriquillo's revolt ran from 1519 to 1533. The Lokono kept Spain at arm's length and traded with the Dutch and English, who founded Essequibo in 1616."
 takic_group_desc: "The $takic_group$ $group_text$ $takic_language$ language.\n\nThe Takic group includes the Tongva of the Los Angeles Basin, the Taaqtam, or Serrano, and the Cahuilla of southern California. Takic speakers moved south from a desert homeland in the western Mojave into coastal California, and held the Southern Channel Islands and the inland deserts and mountains.\n\nJuan Rodriguez Cabrillo met coastal Takic speakers in 1542. Sustained contact began after 1769, when Spanish missions such as San Gabriel, founded in 1771, were planted in their lands. Resettlement, forced labour and epidemics shattered the mission peoples, who rose in revolts such as Toypurina's in 1785 and the Serrano and Cahuilla rising of 1812. Secularization in the 1830s left most survivors landless."
 tanoan_group_desc: "The $tanoan_group$ $group_text$ $tanoan_language$ language.\n\nThe Tanoan group joins the Pueblo peoples of New Mexico, who speak Tiwa, Tewa and Towa, and the Kiowa of the Great Plains. The Pueblos live in farming towns along the Rio Grande and its tributaries.\n\nCoronado's expedition fought the Tiwa pueblos in the Tiguex War of 1540, and Juan de Oñate founded the first Spanish colony in 1598. In 1680 the Pueblos rose under Popé and drove the Spaniards out of New Mexico. The Kiowa came from western Montana, moved south into the Colorado Rockies in the seventeenth and eighteenth centuries, and reached the Southern Plains by the early nineteenth, hunting bison from horseback."
 tarairiu_group_desc: "The $tarairiu_group$ $group_text$ $tarairiu_language$ language.\n\nThe Tarairiu were a nation of the Brazilian northeast, called Tapuya by the coastal peoples. Their language survives only in a few word lists and is unclassified. They lived in the dry backlands between the Assu and Apodi rivers, in about two dozen groups, among them the Jandui and the Caninde.\n\nThey moved with the seasons of the rivers, came down to the coast for the cashew harvest, and hunted with spear-throwers and clubs while also growing maize and manioc. Albert Eckhout painted a Tarairiu warrior for the Dutch. In the seventeenth century they fought beside the Dutch against the Portuguese, who campaigned against them between about 1630 and 1730."
 tatar_group_desc: "The origin of the Tatar people can be traced to Turkic and Mongol ethnic groups of Central Asia and is broadly used to refer to nomadic tribes, such as the Volga and Crimean Tatars. Each subgroup has its own distinct history, language variations, and cultural traditions, and are mostly connected by Islam, reflecting the influence of Islamic cultures in the regions they inhabit.\n\nThe Tatar group spans the Volga, the Crimea and the Pontic steppe. The name Tatar first belonged to a steppe confederation that Genghis Khan absorbed into the Mongol Empire, and it later became the name for the populations of the Golden Horde. They speak Kipchak Turkic languages.\n\nAs the Golden Horde broke up, the khanates of Kazan, Crimea and Astrakhan emerged in the fifteenth century. The Crimean khans became Ottoman vassals in 1475 and burned Moscow in 1571. Ivan IV of Russia conquered Kazan in 1552 and Astrakhan in 1556, and Russia annexed the Crimea in 1783."
 tayrona_group_desc: "The $tayrona_group$ $group_text$ $tayrona_language$ language.\n\nThe Tayrona were a network of chiefdoms in the Sierra Nevada de Santa Marta, on the Caribbean coast of what is now Colombia by the tenth and eleventh centuries. Their towns stood on stone terraces linked by paved roads, and Ciudad Perdida, founded about 800 on the Buritaca River, may have held several thousand people. They farmed maize and cassava and cast gold in tumbaga, an alloy of gold, silver and copper.\n\nThe name seems to come from Tairo, a chiefdom on the northern slope, which the Spaniards extended to the whole region. Early contacts were tolerated, but conflict grew, and by about 1600 some of the people withdrew to the higher mountains."
 thai_group_desc: "Since their origins in the Southern parts of China to their migrations and subsequent establishing in the Chao Phraya valley, the original Tai peoples have developed a unique identity, merging their original traditions with influences from Mon and Khmer peoples.\n\nThe Thai group gathers the Tai-speaking peoples, who are scattered across southern China and mainland Southeast Asia and are identified chiefly by their language: the Zhuang, Dai, Lao and Thai among them. In 1238 Si Inthrathit revolted against the Khmer and founded the Sukhothai Kingdom.\n\nUnder Ram Khamhaeng (1279–1298) it reached its greatest extent, and he is credited with introducing Theravada Buddhism and the first Thai script. Sukhothai declined afterwards: the neighboring kingdom of Ayutthaya invaded it in 1349 and annexed it in 1438."
 tibetan_group_desc: "As residents of the high plateaus of Tibet and the Himalayas Mountains, the Tibetan people are used to extreme climates and terrain.\n\nThe Tibetan group stretches from Kham and Amdo in the east to Ladakh in the west and Bhutan in the south. Its peoples speak Tibetic languages, are thought to descend from the ancient Qiang, and follow Tibetan Buddhism or the native Bon faith.\n\nIn the seventh century Songtsen Gampo founded the Tibetan Empire, which reached Chang'an. After its collapse the region was divided among monasteries and noble houses. The Sakya school ruled under the Yuan from the thirteenth century, and Changchub Gyaltsen's Phagmodrupa dynasty replaced it in 1354. In 1642 Güshi Khan placed the Fifth Dalai Lama of the Gelug school at the head of Tibet."
 tibeto_burman_group_desc: "Migrations from the Tibetan plateau during the earlier historic periods brought these peoples to several places, including India. Their development has been unequal, though, with some groups developing advanced and complex societies, while others have remained rather tribal.\n\nThe Tibeto-Burman group gathers the speakers of the non-Chinese languages of the Sino-Tibetan family, reaching from the Himalayas through northeastern India and Burma to southwestern China. The largest members are the Burmese, the Tibetan Ü-Tsang and Amdowa, the Yi, the Karen and the Newars of Kathmandu. Tibetan and Burmese literary traditions date from the seventh and twelfth centuries.\n\nThe Pagan Kingdom, which had united the Irrawaddy valley, fell to the Mongols in 1287. In Tibet, the Sakya lamas ruled under Mongol patronage, and in 1642 the Gelug school's Dalai Lama became ruler with the backing of Gushi Khan. The Tangut state of Western Xia, home of the Mi-Niah, was destroyed by the Mongols in 1227."
 timoto_group_desc: "The $timoto_group$ $group_text$ $timoto_language$ language.\n\nThe Timoto are the Andean farming people of western Venezuela, usually grouped with the neighbouring Cuica as the Timoto-Cuica. They lived in the mountain valleys of the Chama and Motatan rivers, in what are now Merida, Trujillo and Tachira, and their language was related to that of the Muisca of Colombia.\n\nThey built irrigated terraces on the hillsides and grew maize, potatoes and beans, lived in permanent stone-and-wood villages with water tanks, and traded cotton, salt and cacao. They left fine pottery but no large monuments. Venezuelan historians report that in 1549 the Timoto and Cuica joined against the Spanish at Escuque and drove them back to El Tocuyo."
 timucua_group_desc: "The $timucua_group$ $group_text$ $timucua_language$ language.\n\nThe Timucua were the largest native people of northeast and north-central Florida and southeast Georgia, about 35 chiefdoms speaking dialects of one language and never united under a single ruler. The group also covers the Calusa of the southwest coast, who built a powerful realm on fishing from their town of Calos, and the Tocobaga around Tampa Bay.\n\nFrench Huguenots founded Fort Caroline among the Saturiwa in 1564, and the Spanish founded St. Augustine in 1565 and planted missions in the Timucua towns. Disease cut the Timucua from about 200,000 to 50,000 by 1595 and to about 1,000 by 1700; in 1703 James Moore of Carolina led slave raids that killed and enslaved hundreds more."
 totozoquean_group_desc: "The $totozoquean_group$ $group_text$ $totozoquean_language$ language.\n\nThe Totozoquean group brings together peoples of southern Mexico whose languages are proposed to share an origin: the Totonac of Veracruz, the Zoque of Chiapas, the Mixe of Oaxaca, and the Ikoot, or Huave, of the Isthmus of Tehuantepec, whose language may be a close relative. Some scholars link the Mixe-Zoque speakers to the Olmec, though the claim is disputed.\n\nFrom the mid-fifteenth century the Totonac of Totonacapan faced Aztec incursions and rebelled often. Cempoala was the first native city Hernán Cortés reached on his march to Tenochtitlan in 1519. Luis Marín began the conquest of the Zoque lands in 1523, and the Zoque were parcelled out to settlers, but the Mixe held their mountains against Spanish attack."
 truka_group_desc: "The $truka_group$ $group_text$ $truka_language$ language.\n\nThe Truka are an indigenous people of northeastern Brazil, living on the islands of the Assunção archipelago in the São Francisco River, at Cabrobó in Pernambuco. Their original language is extinct and was never recorded."
 tsehesenestsestotse_group_desc: "The $tsehesenestsestotse_group$ $group_text$ $tsehesenestsestotse_language$ language.\n\nThe Cheyenne were an Algonquian-speaking people of the Great Plains, formed of two closely related tribes, the Tsitsistas and the Suhtai, who spoke slightly different dialects. In the seventeenth century they lived between the Mississippi and Mille Lacs Lake in Minnesota, gathering wild rice and hunting bison.\n\nThe Assiniboine and later the Lakota pushed them west, and they reached the Missouri River in 1676. There they lived beside the Mandan, Hidatsa and Arikara and adopted much of their way of life. About 1730 they introduced the horse to the Lakota. By 1776 the Lakota had taken much of their land near the Black Hills; around 1811 the Cheyenne allied with the Arapaho and spread over the central Plains."
 tshon_group_desc: "The $tshon_group$ $group_text$ $tshon_language$ language.\n\nThe Tshon group takes its name from the Chonan languages of Patagonia and Tierra del Fuego, whose name comes from the Selk'nam word for man. It covers the Tehuelche, or Aonikenk, of the Patagonian steppe, the Selk'nam of northeastern Tierra del Fuego, the Teushen, and the Gununa Kune and Querandi of the Pampas.\n\nFerdinand Magellan's men met the Tehuelche at San Julian in 1520 and called them Patagones. In 1536 the Querandi routed a Spanish force sent from Pedro de Mendoza's new Buenos Aires with their bolas, and after the Spaniards abandoned their livestock they took to horses. Olivier van Noort's Dutch fleet fought the Selk'nam in the Strait of Magellan in 1599, leaving about forty dead."
 tsimshian_group_desc: "The $tsimshian_group$ $group_text$ $tsimshian_language$ language.\n\nThe Tsimshian, whose name means Inside the Skeena River, are a people of the Pacific Northwest Coast, living along the lower Skeena River and the coast of what is now northern British Columbia. By oral history some once lived far up the Skeena and moved to the coast after disasters, founding Kitkatla, while the Nisga'a and Gitxsan stayed inland.\n\nThey wintered around Prince Rupert Harbour, where people had lived for some 5,000 years, and returned to the Skeena when the salmon ran. Their society was matrilineal, with clans and hereditary chiefs, and rank was confirmed at potlatch feasts. Europeans probably first reached them in 1787, and in 1834 the Hudson's Bay Company moved its fort to Lax Kw'alaams."
 tucanoan_group_desc: "The $tucanoan_group$ $group_text$ $tucanoan_language$ language.\n\nThe Tucanoan group gathers peoples of the northwestern Amazon who speak languages of the Tucanoan family. It includes the Karapana of Colombia and Brazil, the Siona of the Putumayo and the Ecuador border, and the Tama of the Orteguaza River, whose language died out.\n\nThey were swidden farmers who grew manioc in forest clearings and also hunted, fished and foraged. The Siona descend from the people the Spaniards called Encabellados, for their long hair. Jesuits first visited them in 1599 and gathered them into mission villages through the eighteenth century, but the reductions failed and the Jesuits were expelled."
 tungusic_group_desc: "Distributed through most of Manchuria and Eastern Siberia, the $tungusic_group$ peoples have traditionally lived from hunting and trading. Adapted to the harsh climates of their native lands, these groups have usually organized in clannic structures.\n\nThe Tungusic homeland is thought to lie near the Amur River in northeastern Manchuria, and from there the Evenks spread across Siberia. The Jurchens of the south also farmed, and Amur peoples such as the Udege and Ulch took on Chinese customs.\n\nThe Jurchens founded the Jin dynasty in 1115, took northern China in 1127, and were overthrown by the Mongols in 1234. Under the Ming they were classed as Jianzhou, Haixi and Yeren Jurchens. In the early seventeenth century Nurhaci united most of them under the Eight Banners, and in 1635 Hong Taiji renamed them Manchus."
 tupi_group_desc: "The $tupi_group$ $group_text$ $tupi_language$ language.\n\nThe Tupi group covers the many peoples who speak Tupi-Guarani languages, spread over eastern Brazil and the Paraguay basin: the Tupinamba, Tupiniquim, Potiguara and Tabajara of the Atlantic coast, and the Guarani of the Parana and Paraguay rivers. The coastal Tupi were the peoples the Portuguese met first, and Old Tupi became a lingua franca between Europeans and natives, with catechisms, poems and plays.\n\nAndré Thevet in 1572, Jean de Léry in 1578 and Hans Staden described the Tupinamba, including their cannibalism, and these accounts influenced Montaigne's essay on cannibals. In 1537 Gonzalo de Mendoza founded Asunción among the Guarani; Jesuits reached Paraná in 1585 and in 1608 were authorised to convert the tribes of Guayrá."
 turkic_group_desc: "The Turkic peoples have come a long way since they originated centuries ago in the steppes of Asia. Having expanded to cover territories from the Black Sea to the Mongolian Steppes and down into Persia, they have interacted with many other cultures and peoples, and have diverged themselves into many different groups, but the shared Turkic identity remains.\n\nThe Proto-Turkic ancestors of the Turkic peoples probably lived in the Altai-Sayan region, Mongolia or Tuva, and were later nomadic herders. The name Turk was first used for the Göktürks, who are named in inscriptions of the sixth century, and the Orkhon inscriptions of 735 are the oldest Turkic texts.\n\nSeljuk Turks entered Anatolia after Manzikert in 1071, and the Ottomans rose there from about 1300 and took Constantinople in 1453. In the steppe, Turkic-speaking peoples made up much of the Golden Horde. The Sakha lived far to the north in Siberia."
 tutelo_group_desc: "The $tutelo_group$ $group_text$ $tutelo_language$ language.\n\nThe Tutelo group gathers the Native peoples of the Virginia and Carolina piedmont, the Kanawha Valley and the upper Ohio, most of whom spoke Siouan languages. The Tutelo and Monacan lived above the Fall Line in Virginia; the Moneton, whose name means Big Water, in the Kanawha Valley; and the Ofo, or Mosopelea, had villages near the upper Ohio River.\n\nUnder pressure from English settlers and the Haudenosaunee, the Tutelo and related nations joined together as the Nahyssan in the late seventeenth century. The Ofo, driven by Haudenosaunee attacks, moved south to the lower Mississippi and settled in Louisiana among the Tunica and Biloxi. By 1740 the Tutelo had left their homeland, and the Cayuga adopted them in 1753."
 txapakura_group_desc: "The $txapakura_group$ $group_text$ $txapakura_language$ language.\n\nThe Txapakura are the peoples of the Chapacuran language family, once spread along the Blanco, Guaporé and Mamoré rivers of northern Bolivia and Rondônia in Brazil. Their languages include Chapacura, Moré and Wari'."
 uru_group_desc: "The $uru_group$ $group_text$ $uru_language$ language.\n\nThe Uru, who spoke Uchumataqu, were fishermen and reed gatherers of the high Andean lakes: Lake Titicaca, Lake Poopó and the Desaguadero River. They called themselves Lupihaques, sons of the Sun, and held that they owned the lake and its water. On Titicaca they lived on floating islands made of totora reed, which could be moved if a threat arose.\n\nThe Uru traded and intermarried with the Aymara on the mainland and gradually gave up their own language for Aymara. After the Inca conquest they paid tribute and were often enslaved. A conflict between the Uru and the Aymara arose from 1722."
 volta_niger_group_desc: "The Volta-Niger peoples of the Nigerian region speak languages of the Volta-Niger branch of Niger-Congo and include some of the most populous and politically sophisticated societies in West Africa. The Yoruba city-states, the Igbo village republics, and the Benin Kingdom are among the most accomplished polities on the continent.\n\nThe Volta-Niger group includes the Yoruba, Edo, Igbo, Ijaw, Nupe and Igala of southern Nigeria. Ife, the Yoruba holy city, produced naturalistic bronze heads between 1200 and 1400, and the Oyo Empire later became the leading Yoruba power.\n\nIn Benin the Edo Oba Ewuare enlarged his kingdom from 1440, and the Portuguese reached it in 1485. The Igbo lived in village assemblies under the ritual authority of the priest-kings of Nri, while the Ijaw fished and traded in the Niger Delta. The Oyo Empire broke up under civil strife and Fulani pressure in the 1820s and 1830s, and its capital Oyo-Ile fell in 1835."
 wakashan_group_desc: "The $wakashan_group$ $group_text$ $wakashan_language$ language.\n\nThe Wakashan group joins the Northwest Coast peoples of Vancouver Island, the central British Columbia coast and Cape Flattery in Washington. The Nootka, or Nuu-chah-nulth, and the Makah hunted whales on the open coast, while the Kwakiutl, or Kwakwaka'wakw, lived in a society of nobles, commoners and slaves, whose rank was displayed at potlatch feasts. The Heiltsuk and Haisla lived farther north.\n\nJames Cook anchored at Yuquot in 1778, opening the maritime fur trade, and the rivalry between Spain and Britain over Nootka Sound led to the Nootka Crisis of about 1790. The Nuu-chah-nulth chief Maquinna captured the American ship Boston in 1803. Disease killed more than nine in ten Nuu-chah-nulth between first contact and 1830."
 waqha_group_desc: "The $waqha_group$ $group_text$ $waqha_language$ language.\n\nThe Waqha group takes its name from the Vilela, who call themselves Uakambalelte, those who speak Waqha. It also covers two neighbours, the Tonokote of Santiago del Estero and the Sanaviron of Córdoba. The Vilela hunted and gathered in northern Tucumán and Santiago del Estero, while the Tonokote were sedentary farmers.\n\nThe Inca Empire occupied northwestern Argentina by about 1480 and took in part of the Tonokote. The Sanaviron, a branch of the Tonokote, spread southwest into the Córdoba hills and were largely absorbed into the colonial population in the eighteenth century. After the Spanish conquest of Tucumán the Vilela moved east into the Chaco, where Jesuits founded three missions on their lands between 1735 and 1763."
 warao_group_desc: "The $warao_group$ $group_text$ $warao_language$ language.\n\nThe Warao, whose name means the boat people, live in the Orinoco Delta of northeastern Venezuela, where hundreds of streams and marshes make the canoe the main way to travel. Their houses stood on stilts above the water, and their food came mostly from the delta: fish, crabs in season, and the moriche palm, with some basic horticulture by about 1500.\n\nSoon after Columbus reached the Orinoco delta, Alonso de Ojeda sailed up the river and saw the stilted Warao huts. Their resemblance to the water-houses of Sinamaica is said to have given Venezuela, little Venice, its name."
 warpe_group_desc: "The $warpe_group$ $group_text$ $warpe_language$ language.\n\nThe Warpe, or Huarpe, were the farming people of the Cuyo region of central Argentina, at the foot of the Andes. They had lived in permanent villages of 50 to 100 people since the fifth century and grew maize, beans, squash and quinoa. By the fifteenth century their lands ran from the Jáchal River in the north to the Diamante River in the south, and they spoke the related Allentiac and Millcayac.\n\nThey were never fully part of the Inca Empire, but after about 1480 they adopted Inca llama herding and the Quechua language. Under Spanish rule, Chilean encomenderos who held grants in Cuyo took Huarpe workers across the Andes to Chile and hired them out to other Spaniards."
 wendat_group_desc: "The $wendat_group$ $group_text$ $wendat_language$ language.\n\nThe Wendat, called Huron by the French, were an Iroquoian-speaking confederacy of four nations living in Wendake, between Georgian Bay and Lake Simcoe in what is now Ontario. Their palisaded longhouse villages held some 20,000 to 40,000 people. Their relatives the Tionontati, the French Petun or Tobacco, lived to the southwest.\n\nSamuel de Champlain met them in 1615, and Atironta of the Arendarhonon had allied with the French at Quebec in 1609. From 1634 to 1640 measles and smallpox devastated them. Supplied with Dutch firearms, the Haudenosaunee began large attacks in 1647 and destroyed Wendake in 1649, scattering them. The refugees fled west to the Odawa and settled near Detroit around 1701 as the Wyandot."
 west_african_group_desc: "Despite being very diverse in terms of culture, language, and even religion, the people living in West Africa and the Sahel, all have a shared set of traits and characteristics, fueled by centuries of interactions among themselves. The relatively difficult-to-traverse terrains of the Sahara desert to the north and the forest and jungles to the south have promoted a more horizontal contact between peoples, creating this shared identity.\n\nThe West African group includes the Mandinka, Songhai, Mossi, Hausa and Kanembu. Trade in gold and salt linked their lands to North Africa.\n\nThe Ghana Empire gave way to the Mali Empire in the thirteenth century, and its ruler Mansa Musa made a pilgrimage to Mecca in 1324. Songhai replaced Mali as the dominant power in the fifteenth century and fell to a Moroccan army in 1591. Portuguese traders reached the coast in the fifteenth century, opening the Atlantic slave trade."
 xinka_group_desc: "The $xinka_group$ $group_text$ $xinka_language$ language.\n\nThe Xinka are a non-Maya people of the Pacific plain and highlands of southeastern Guatemala, in what is now Santa Rosa and Jutiapa. Their languages have no known relatives, though they borrowed many words from Mayan, and they may have lived there before the Maya and the Pipil arrived.\n\nIn 1524 Pedro de Alvarado crossed their country with 250 Spanish infantry and some 6,000 native allies, and took their chief city, Atiquipaque, near Taxisco, after fierce hand-to-hand fighting. The Xinka then paid tribute in cacao, cotton, salt and vanilla, and many were enslaved and made to join the conquest of El Salvador. After 1575 their culture and language declined rapidly as people were shipped to other regions."
 yaghan_group_desc: "The $yaghan_group$ $group_text$ $yaghan_language$ language.\n\nThe Yaghan, also called Yamana, lived on the islands south of Tierra del Fuego along the Beagle Channel and around Cape Horn, the southernmost people in the world. They were nomads who moved between islands by canoe: the men hunted sea lions, the women dived for shellfish, and they also ate stranded whale meat, berries and mushrooms.\n\nThey lived in several local groups, such as the Wakimaala on both shores of the Beagle Channel. Their language was unrelated to those of the neighbouring Chono and Kawesqar canoe peoples, though they shared a similar way of life. Sailors in the early nineteenth century called them Fuegians, a name credited to James Weddell in 1822."
 yukaghir_group_desc: "The $yukaghir_group$ $group_text$ $yukaghir_language$ language.\n\nThe Yukaghir group gathers the Siberian hunting peoples who speak Yukaghir languages, centered on the basin of the Kolyma River. When Russians arrived in the 1600s, the Yukaghir tribes held land from the Lena to the mouth of the Anadyr, and included the Chuvans and the sedentary Anauls. They are thought to descend from the Neolithic Ymyyakhtakh culture.\n\nThey lived by following deer, moose, wild sheep and sable, and by fishing, and kept reindeer mostly for transport. Their dwelling was the conical chum. Their languages, Tundra and Kolyma Yukaghir, are of unknown origin. Epidemics, wars and Russian rule thinned their numbers, and many were absorbed by the Yakuts, Evens and Russians."
 yuki_group_desc: "The $yuki_group$ $group_text$ $yuki_language$ language.\n\nThe Yuki were a people of northern California, traditionally divided into three groups: the Ukomno'om, or Valley People, the Huchnom, or those outside the valley, and the Coast Yuki, or Ocean People. Their country took in Round Valley and much of what is now northern Mendocino and Lake counties.\n\nThey lived in conical houses of bark, grass and pine needles, with a large dance house, and kept to their own language, which stood apart from those of their neighbours. Their beliefs centred on Taikomol, the one who travels by himself, assisted by Coyote, and on mountain beings who could heal or sicken. Kroeber estimated that about 3,000 Yuki lived in 1770."
 yupik_group_desc: "The $yupik_group$ $group_text$ $yupik_language$ language.\n\nThe Yupik group gathers the Eskimo and Aleut peoples of southwestern and southern Alaska, closely related to the Inuit. The Central Alaskan Yup'ik live on the Yukon-Kuskokwim Delta and along Bristol Bay, with fish camps in summer and villages in winter; the Alutiiq, or Sugpiaq, live on Prince William Sound and the Kodiak Archipelago; and the Unangax, or Aleuts, live along the Aleutian Islands, numbering perhaps 25,000 before European contact.\n\nRussian occupation of the Alutiiq country began in 1784, after Grigory Shelikhov's men killed hundreds of Sugpiat at Refuge Rock. By the early 1800s Kodiak held more than sixty Alutiiq villages. In the 1820s the Russian-American Company moved Aleut families to the Commander and Pribilof Islands."
 yutonahua_group_desc: "The $yutonahua_group$ $group_text$ $southern_yutonahua_language_family$ languages.\n\nThe Yuto-Nahua group gathers the peoples of the Uto-Aztecan language family in northern and western Mexico and the American Southwest: the Cuachichil, Zacatec and Caxcan of the central plateau, the Tepehuan, Yaqui and Raramuri of the northwest, and the Hopi of Arizona.\n\nThe Caxcan rose against the Spanish in the Mixton War of 1540 to 1542, and the Chichimeca War of 1550 to 1600 was the longest and costliest Spanish campaign on this frontier. The Yaqui, met by Diego de Guzmán in 1533, numbered some 30,000 in 80 villages and beat the Spanish in 1608. The Tepehuan rose in 1616 and were crushed by 1620."
 zamuco_group_desc: "The $zamuco_group$ $group_text$ $zamuco_language$ language.\n\nThe Zamuco group joins the Ayoreo and the Ishir, or Chamacoco, peoples of the Gran Chaco who speak Zamucoan languages, a small family of the northeastern Chaco in Paraguay and Bolivia. The Ayoreo lived between the Paraguay, Pilcomayo, Parapeti and Grande rivers, nomadic hunter-gatherers across both countries. The Ishir lived in Paraguay, the Ebytoso along the Paraguay River and the Tomaraho in the forests.\n\nThe Jesuits made the first contact with the Ayoreo when they founded the San Ignacio Zamuco mission in the 1720s to convert them to Catholicism. The mission was abandoned in the 1740s, and the Ayoreo were then left alone for a long time."
 zuni_group_desc: "The $zuni_group$ $group_text$ $zuni_language$ language.\n\nThe Zuni are a Pueblo people of western New Mexico, descended from the Mogollon and Ancestral Pueblo cultures and living by irrigated farming. Their language is an isolate with no known relationship to any other Native American language.\n\nIn 1539 the Spanish expedition of Fray Marcos de Niza sent the slave Estevanico ahead, and the Zuni killed him as a spy. Before the Pueblo Revolt of 1680 they lived in six villages, and in the revolt they took refuge atop the mesa of Dowa Yalanne until 1692. Of their three Spanish missions only Halona was rebuilt after the reconquest, and by the late eighteenth century the Spanish had given up hope of dominating them."
 agwu_nsi_god_desc: "$agwu_nsi_god$ is the god of divination and healing.\n\nAgwu Nsi is worshipped by the Igbo, whose deities are called arusi. Where Igbo religion was carried to the Americas, he is known as Agwo Nsi."
 ak_ana_god_desc: "[ShowGodName('ak_ana_god')] is the goddess of water of the [ShowCultureGroupName('turkic_group')] people.\n\nAk Ana, ‘the Holy Mother’, was the primordial creator goddess of the Turkic peoples, known also to the Khanty and Mansi of Siberia. She was the daughter and consort of Kayra. Water was held to have been made before the earth, so she was the earth’s elder sister.\n\nIn one creation myth, Kayra flew as a white goose over the endless waters until Ak Ana urged him to create. A sacred duck then brought up silt from the bottom, from which the earth was made."
 aki_pen_god_desc: "$aki_pen_god$ is the village guardian of the [ShowReligionAdjective('koyapunem_religion')] pantheon.\n\nAki Pen is worshipped by the Gonds together with the village mother goddess before any festival begins. Among the Gonds, devotion goes above all to such village and clan deities rather than to the high god Baradeo."
 akuj_god_desc: "$akuj_god$ is the supreme being of the [ShowLanguageName('lotuko_language')] speaking people.\n\nAkuj is also the supreme being of the Turkana, the semi-nomadic herders of the Lake Turkana region, who hold that he created the world and governs their water, food, livestock and offspring. Diviners called ngimurok relay his wishes and name the animals to be sacrificed."
 alwet_god_desc: "$alwet_god$ is the goddess of the rain of the [ShowReligionAdjective('muonyjang_religion')] pantheon.\n\nAlwet is counted among the offspring of Nhialic, the Dinka sky god. Nhialic also governs the rains."
 amadioha_god_desc: "$amadioha_god$ is the god of thunder and lightning of the [ShowReligionAdjective('odinala_religion')] pantheon.\n\nAmadioha, whose name means man of the people, is also the Igbo god of justice, among the most popular of Igbo deities. He speaks through thunder and strikes with lightning, made by hurling thunderstones to earth, and avenges the oppressed by striking down their oppressors. His symbol is a white ram, and his main shrine is at Ozuzu.\n\nThose he judges guilty are killed by lightning or by a swarm of bees and left unburied. Oaths are sworn to him."
 anansi_god_desc: "$anansi_god$ is a trickster god and folk hero of the [ShowReligionAdjective('akan_religion')] pantheon.\n\nAnansi, or Ananse, takes the form of a spider, which is what his name means, and stands for stories, wisdom and cunning. In tales from southern Ghana he outwits stronger opponents.\n\nIn one tale he flew in a cloak of bird feathers to learn the name of a yam for the sky god Nyame, and became Nyame's messenger. The tales crossed to the Americas with the Atlantic slave trade."
 andriamahilala_god_desc: "$andriamahilala_god$ is the first woman in the [ShowReligionAdjective('fomba_gasy_religion')] pantheon, who choose to die and be reborn each month and became linked to the moon.\n\nAndriamahilala and her husband Andriambahomanana had many children and grandchildren. Then the creator Zanahary decided that death was needed and asked what kind of death they wanted; her husband chose to die like the banana plant, which puts forth new shoots as it dies."
 andriambahomanana_god_desc: "$andriambahomanana_god$ is the first man in the [ShowReligionAdjective('fomba_gasy_religion')] pantheon.\n\nAndriambahomanana and his wife Andriamahilala had many children, and their children had children of their own. Zanahary saw that death was needed and asked what kind of death they wanted. Andriambahomanana chose to die like the banana plant, which puts forth new shoots when it dies; Andriamahilala chose to die like the moon, dying and being reborn every month."
 andrianerinerina_god_desc: "$andrianerinerina_god$ is the son of [ShowGodName('zanahary_god')] and founder of the royal line.\n\nAndrianerinerina figures in one of several competing origin myths of the Merina of Imerina. He came down to Anerinerina, north of Angavokely, to play with the Vazimba, the island's first inhabitants.\n\nThey cooked one of his sheep despite a warning, and having eaten the forbidden meat he could not go home. Zanahary let the Vazimba choose between destruction and serving him; they chose to serve, and he sent his daughter Andriamanitra to be the wife of Andrianerinerina."
 anyame_god_desc: "$anyame_god$ is the supreme god and sky father of the [ShowCultureName('akan')] people.\n\nNyame, also called Onyame or Nyankopon, is worshipped by the Akan of Ghana, and his name is taken to mean the one who knows and sees everything. In some Akan accounts his wife is the earth goddess Asase Ya.\n\nAs the creator Odomankoma he made the universe, life and death. Death, personified as Owuo, then killed him, and his spirit passed into Nyankopon. In tales his messenger is the spider Anansi."
 aphrodite_god_desc: "[ShowGodNameWithNoTooltip('aphrodite_god')] is the goddess of love, desire, beauty, and social harmony.\n\nAphrodite's main Greek cult centres were Cythera, Cyprus, Corinth and Athens, where the Aphrodisia festival was held each year. The Iliad makes her the daughter of Zeus and Dione, while Hesiod has her born from sea foam.\n\nShe was married to the smith-god Hephaestus but took Ares as a lover, and was one of the three goddesses whose rivalry led to the Trojan War. The Romans knew her as Venus."
 ares_god_desc: "[ShowGodNameWithNoTooltip('ares_god')] is the god of war in its violent and destructive form.\n\nAres, son of Zeus and Hera, was one of the twelve Olympians. He stood for the physical valour and courage needed in war, and many Greeks felt ambivalent towards him. His sister Athena governed strategy.\n\nHe may have originated in Thrace. In myth he is often humiliated: Hephaestus trapped him in a net with Aphrodite, and in the Trojan War he took the Trojan side and lost. The Romans set Mars, a more dignified figure, beside him."
 asase_ya_god_desc: "$asase_ya_god$ is the goddess of love, fertility and the earth of the [ShowCultureName('akan')] people.\n\nAsase Ya is also a goddess of peace and truth. Her name means Earth born on Thursday; the Fante call her Asase Afua, born on Friday. She is the wife of the sky god Nyankopon and the mother of Bea and Tano.\n\nNo temples are dedicated to her. She is worshipped in the fields of the Asante and other Akan with sacrifices, and the Bono are said to be her favoured people. As old Mother Earth she also receives the dead."
 asis_god_desc: "$asis_god$ is the creator god of the [ShowLanguageName('kalenjin_language')] speaking people.\n\nAsis is the sun god and supreme god of the Kalenjin of Kenya. He lives in the sky, is all-powerful and is held to guarantee what is right.\n\nIn the older Kalenjin belief he was only the younger brother of the sky god Tororut and was thought to be angry in the dry season. His worship later superseded it, apparently after contact with Southern Cushitic peoples. In the Nandi creation story, the Sun, married to the moon, went down to earth to prepare the order of the world."
 athena_god_desc: "[ShowGodNameWithNoTooltip('athena_god')] is the goddess of wisdom, strategy, and disciplined warfare.\n\nAthena was the patron goddess of Athens, whose Parthenon on the Acropolis was dedicated to her, and of handicraft. In myth she was born from the forehead of Zeus. She won the city from Poseidon by creating the first olive tree, and her chief festival was the Panathenaia.\n\nShe led soldiers into battle as Athena Promachos and helped heroes such as Perseus, Heracles and Odysseus. Since the Renaissance Western artists have made her a symbol of wisdom, learning and freedom."
 ayum_god_desc: "$ayum_god$ is the winds goddess of the [ShowLanguageName('dinka_language')] speaking people.\n\nAyum is counted among the offspring of Nhialic, the Dinka sky god. She is often described as a force that keeps rain from falling."
 bai_baianai_god_desc: "[ShowGodName('bai_baianai_god')] is the goddess of forests and wildlife of the [ShowCultureGroupName('turkic_group')] people.\n\nBai Baianai was also a goddess of hunting, wealth and fertility, worshipped in the Altai and among the Sakha, or Yakut. Her name means ‘rich’ or ‘fertile’, and she was the daughter of Kayra.\n\nHunters lit fires and prayed to her that their work might pass fruitfully and without accident. Three Baianais are named: Bai Baianai of hunting, Tagh Baianai of forests and Ughu Baianai of fishing. In some places she also protected children and was regarded as a guardian of the lineage."
 baradeo_god_desc: "$baradeo_god$ is the supreme god of the [ShowCultureName('gond')] people.\n\nBaradeo, also called Bhagavan, Badadeo or Persa Pen, is worshipped by the Gonds of central India. He oversees the lesser gods, the clan and village deities and the ancestors, but is respected rather than fervently worshipped. Gond tradition identifies him with the ancestor-hero Kupar Lingo, shown as a clean-shaven young prince in a trident-shaped crown, the munshul.\n\nSome Gonds of Seoni hold that Baradeo lives in a saja tree, and shrines to Kupar Lingo stand across Gondwana."
 bathoubwrai_god_desc: "$bathoubwrai_god$ is the supreme god of the [ShowReligionAdjective('bathou_religion')] pantheon.\n\nBathoubwrai, ‘Bathou the Elder’, is unseen, all-knowing and all-powerful, and is worshipped by the Boro of Assam. He is said to have created the five principles of air, fire, earth, water and ether on which the faith is built.\n\nThe sijou shrub, a kind of spurge, is his living embodiment. Boro families plant it at the northeast corner of the courtyard, and communities fence it with eighteen pairs of bamboo strips, each pair a pair of minor gods. Offerings are animals, fowls and rice beer."
 bura_bagh_raja_god_desc: "$bura_bagh_raja_god$ is a household god of the [ShowReligionAdjective('bathou_religion')] pantheon.\n\nBura Bagh Raja is worshipped by the Boro of Assam. The ethnographer Sidney Endle named him among the prominent household deities, with Bathoubwrai, Mainao and Song Bwrai."
 chinchaycamac_god_desc: "[ShowGodName('chinchaycamac_god')] is the main god of the [ShowCultureName('chincha_culture')] people.\n\nChinchaycamac was worshipped by the Chincha, a seafaring and trading people of the coastal valley of Chincha in Peru. The Chincha kept a rich and prominent oracle of this name, probably near their capital at La Centinela, where great adobe pyramids stand.\n\nThe Chincha believed themselves descended from jaguars and ocelots, and worshipped a feline god. Their kingdom, flourishing from the eleventh century, was absorbed into the Inca empire around 1480."
 coatlicue_god_desc: "[ShowGodName('coatlicue_god')] is the goddess of fertility in the Mesoamerican pantheon.\n\nCoatlicue, ‘Skirt of Snakes’, also called Teteoh Innan, ‘Mother of the Gods’, was the Aztec mother goddess and wife of Mixcoatl. Toci, ‘Our Grandmother’, and Cihuacoatl, patron of women who died in childbirth, were seen as aspects of her.\n\nIn the myth of Coatepec, near Tula, she became pregnant when a ball of feathers touched her as she swept. Her daughter Coyolxauhqui and four hundred sons plotted to kill her, but Huitzilopochtli leapt from her womb in full armour and routed them."
 creator_god_desc: "The $creator_god$ represents the original creation spark that created humanity.\n\nCreation myths tell of many ways in which humanity, the earth or the universe came to be: a world sprouting from a primal seed, a monster slain, or a divine craftsman at work. In Genesis, Elohim makes heaven and earth, the animals and mankind in six days."
 death_god_desc: "The $death_god$ represents the invitable equalizer that patiently waits for all.\n\nDeath deities, gods or divine beings tied to the afterlife or the underworld, appear in some form in most cultures. In religions centred on a single god, death is usually that god's antagonist; in monotheistic faiths it is often personified by an angel or demon."
 dharti_ayo_god_desc: "$dharti_ayo_god$ is the goddess of earth of the [ShowReligionAdjective('sarna_religion')] pantheon.\n\nDharti ayo, also called Chalapachho Devi, is worshipped by the tribal peoples of the Chota Nagpur Plateau as a mother goddess identified with nature. People honour her together with Marang Buru and the village deity."
 donyi_god_desc: "$donyi_god$ is the goddess of the Sun of the [ShowReligionAdjective('donyi_polo_religion')] pantheon.\n\nDonyi is a goddess of the Tani peoples of Arunachal, among them the Adi, Galo and Nyishi. Traditionally she was addressed as Mother, paired with the Moon, Polo, as Father.\n\nThe two were called on to witness the truth and to punish liars. The Minyong and Padam Adi tell of a creator, Sedi, whose eyes became the Sun and Moon."
 doying_bote_god_desc: "$doying_bote_god$ is the god of heaven.\n\nDoying Bote is named among the gods of the Tani peoples of Arunachal, whose oral faith, later called Donyi-Polo, had no scripture or fixed shrines."
 du_chie_god_desc: "$du_chie_god$ is a creator god for the [ShowLanguageName('dinka_language')] speaking people.\n\nSome accounts make Du Chie a precursor of Nhialic, others a co-creator alongside him."
 earth_god_desc: "The $earth_god$ represents the fruits of the soil that allow the growth of our people.\n\nEarth deities are most often goddesses. In Greek myth she is Gaia, matched by Terra in Rome and Prithvi in India, and traced back to an Earth Mother who complemented the Sky Father of Proto-Indo-European religion."
 egbesu_god_desc: "$egbesu_god$ is the god of justice of the [ShowReligionAdjective('ijaw_religion')] pantheon.\n\nAmong the Ijaw of the Niger Delta, Egbesu is also a spiritual force for combating evil. Its symbols are the leopard, the panther and the lion.\n\nTraditionally the Egbesu force could be used only in defence or to correct an injustice, and only by those in harmony with the universe. Under an Egbesu king, the chief priest who alone could declare war, came high priests called Okparans and foot soldiers called Kulikuliwei. The force was believed to protect fighters from enemy bullets."
 erlik_god_desc: "[ShowGodName('erlik_god')] is the god of death and the underworld of the [ShowCultureGroupName('turkic_group')] people.\n\nErlik, also called Erlik Khan, was ruler of the lower world and judge of the dead, sometimes shown as a bear. He is named in the Orkhon inscriptions. From below he sends death, plague and evil spirits to take human souls.\n\nAltai legends say Erlik and his spirits were cast out of heaven when he claimed divinity. In another tale, recorded by Radlov, he was the first human, who tried to hide soil from the primordial water and was cast out by Kayra."
 fertility_god_desc: "The $fertility_god$ represents the caring and nurturing power of a mother.\n\nFertility deities may be gods or goddesses tied to sex, pregnancy, childbirth and crops, sometimes directly and sometimes as an abstract symbol. Fertility rites may accompany the worship. In Vietnamese belief twelve goddesses, the Ba Mu, are each responsible for making one part of a child."
 fire_god_desc: "The $fire_god$ represents the passion of a warm hearth together with the fury of a raging inferno.\n\nFire deities are known to many peoples. In Vietnamese tradition Ong Tao is the god of the stove and fire, and a goddess named Ba Hoa is also counted among the fire spirits."
 freya_god_desc: "$freya_god$ is a member of the Vanir, and worshipped as the Goddess of love, beauty, fertility and seidr.\n\nFreyja, ‘Lady’, also presided over war and gold. Her seiðr was a magic for seeing and shaping the future. Daughter of Njörðr and twin sister of Freyr, she owned the necklace Brísingamen and drove a chariot drawn by two cats.\n\nShe ruled the field Fólkvangr, where she received half of those who died in battle, the other half going to Odin. In Þrymskviða she refused to be given to a giant as a bride, so Thor went in her place."
 freyr_god_desc: "$freyr_god$ is a member of the Vanir, and worshipped for good harvest, pleasure and peace.\n\nFreyr, ‘Lord’, was also a god of kingship and fair weather, son of Njörðr and twin brother of Freyja. He rode the golden boar Gullinbursti and owned the ship Skíðblaðnir, which always had a fair wind and folded into a pouch.\n\nIn his best-known myth he fell in love with the giantess Gerðr and gave away his self-fighting sword to win her; lacking it, he is fated to die to Surtr at Ragnarök. Sweden’s kings were held to descend from him."
 ganesha_god_desc: "$ganesha_god$ is a major [god|e] in [ShowReligionName('hindu')], usually represented with an elephant head and revered as a bringer of luck and wisdom.\n\nGaṇeśa is the elephant-headed son of Shiva and Parvati, honoured by every Hindu denomination. Usually shown with four arms and a broken tusk, he is the Lord of Obstacles and the patron of learning and letters. He is invoked first at the start of any rite.\n\nTexts mention him from the first centuries, and the Ganesha Purana and Mudgala Purana, probably composed between 1100 and 1400, make him the supreme being of the Ganapatya tradition."
 god_desc: "A god is a major deity in a specific religion. While some religions may contain many gods and revere them more or less equally, others may focus their faith into a specific one, while others still may deny the existance of other gods besides their own.\n\nIn Christianity, Judaism and Islam, God is the single, eternal creator of the universe, all-powerful and attentive to individual prayer. All three trace themselves to Abraham and the God of Israel of the Hebrew Bible.\n\nJews know him by the four-letter name YHWH, which observant Jews do not pronounce, saying Adonai instead. Christians pronounce the name freely as Yahweh or Jehovah. Muslims call him Allah and hold his absolute oneness, tawhid, to be the heart of their faith."
 haunu_god_desc: "$haunu_god$ is a god of lightning and brother-in-law of $kagara_god$.\n\nHaunu is a figure in ǀXam San mythology. In the story told to children to explain storms, he threw lightning at Kagara and died slowly, thundering, while Kagara slept, thundering too."
 hermes_god_desc: "[ShowGodNameWithNoTooltip('hermes_god')] is the messenger of the gods, patron of trade, travel, and cunning.\n\nHermes, son of Zeus and the Pleiad Maia, was the herald of the Olympian gods. With his winged sandals he moved freely between the mortal and divine worlds, and he guided souls into the afterlife. He also protected heralds, thieves and orators.\n\nHe was the divine trickster, as the Homeric Hymn to Hermes tells. His chief symbol was the caduceus, a winged staff entwined with two snakes. The Romans identified him with Mercury, whose name comes from merx, merchandise."
 huitzilopochtli_god_desc: "[ShowGodName('huitzilopochtli_god')] is the solar and war deity of sacrifice for the people of [ShowLocationName('tenochtitlan')].\n\nHuitzilopochtli, ‘Hummingbird of the South’, was the patron god of the Mexica. He wielded Xiuhcoatl, the fire serpent.\n\nIn the myth of Coatepec, he sprang from the womb of the goddess Coatlicue fully armed and slew his sister Coyolxauhqui and four hundred brothers, who became the moon and stars. The sun’s daily struggle against them had to be fed with sacrifices. He mattered little to the Nahuas until the Mexica rose."
 hunhunahpu_god_desc: "$hunhunahpu_god$ is the god of fertility and the ballgame of the [ShowReligionName('mayan')] pantheon.\n\nHun-Hunahpú, ‘One Hunahpú’, is a figure of K’iche’ Maya myth in the Popol Vuh, father of the Hero Twins Hunahpú and Xbalanqué. He and his brother Vucub-Hunahpú were tricked into the Dark House by the lords of Xibalba, the underworld, and sacrificed.\n\nHis head, hung in a tree, turned into a calabash, and its spittle made Xquic, a lord’s daughter, pregnant with the Twins. They beat the lords but could not revive their father. Some scholars identify him with the Classic Maya maize god."
 hunntuattatteen_god_desc: "$hunntuattatteen_god$ is the wife of [ShowGodName('kaggen_god')].\n\nHunntuattatteen is shown as a Cape hyrax and known as the mother of bees. In the eland myth she gave birth to the eland and helped churn its blood to make the first herd."
 huracan_god_desc: "$huracan_god$ is the god of wind and storms of the [ShowReligionName('mayan')] pantheon.\n\nHuracán, ‘One-Leg’, also called U K’ux Kaj, ‘Heart of Sky’, was also a K’iche’ Maya god of fire, and one of the creator gods who took part in all three attempts to make humankind. He brought the great flood when the second generation of humans angered the gods.\n\nThe Popol Vuh says he lived in the windy mists above the floodwaters and called out ‘earth’ until land rose from the sea. His name recalls God K, the Classic Maya lightning god with one serpent leg."
 ikenga_god_desc: "$ikenga_god$ is the horned god of fortune.\n\nIkenga, meaning strength of majesty, is the god of the Igbo of southeastern Nigeria. It embodies a man's endeavour and success, resting on the belief that the power to achieve lies in his right hand, and is held to bring wealth and protection. It is also linked with farming and blacksmithing.\n\nAn Ikenga is consecrated by the lineage head before kinsmen, with offerings of yam, cock, wine and kola. The oldest form is two-faced, one face watching the old year and one the new."
 ilat_god_desc: "$ilat_god$ is the god of thunder and rain.\n\nAmong the Kalenjin, Ilat, or Ilet, is said to dwell in deep pools and waterfalls. The rainbow is his discarded clothing. The Nandi split him into two gods. Ilet ne-mie, the good one, drives danger away with distant rumbling; Ilet ne-ya, the bad one, tries to come down and kill people with nearby thunder."
 illapa_god_desc: "[ShowGodName('illapa_god')] is the god of rain and thunder of the people of the [ShowRegionName('andes_region')].\n\nIllapa was also the Inca god of lightning and war, ranked among the highest gods of the Andean pantheon. His worship reached across the Andes under local names: Liviac among the Yaros, Pariacaca among the Yauyos, Apocatequil around Cajamarca. When the Inca state expanded, these gods became regional forms of Illapa.\n\nThe ruler Pachacuti made him his divine brother, and according to Pedro Sarmiento de Gamboa the god gave him a protective idol shaped like a two-headed serpent, possibly an image of the rainbow."
 inti_god_desc: "[ShowGodName('inti_god')] is the sun god of the people of the [ShowRegionName('andes_region')].\n\nInti was the patron deity of the Inca state. He is usually said to be a son of Viracocha, and the brother and husband of the moon goddess Mama Quilla. The Inca ruler was held to be his living representative, and the founding ancestor Manco Capac was thought to be his son.\n\nHis high priest, the Willaq Umu, ranked second only to the Sapa Inca. The ruler Pachacuti is linked with the rise and spread of the Sun cult."
 kagara_god_desc: "$kagara_god$ is a god of lightning and brother-in-law of $haunu_god$.\n\nKagara is a figure in the mythology of the ǀXam San. In a story recorded in the nineteenth century, he came to fetch his sister from her husband Haunu, and the two brothers-in-law threw lightning at each other."
 kaggen_god_desc: "$kaggen_god$ is the creator and trickster god and folk hero of many african tribes.\n\nAmong the San of southern Africa, Kaggen is often called the Mantis. He can take the form of any animal, most often a praying mantis, but also a bull eland, a louse or a snake. His wife is the Cape hyrax, mother of bees.\n\nIn the best known myth, his favourite creature, the eland, was killed by his sons before it was grown. He sprinkled its blood and fat on the ground, and a great herd sprang up for his people to hunt."
 kamuy_huci_god_desc: "$kamuy_huci_god$ is the goddess of the hearth of the [ShowReligionAdjective('ainu_religion')] pantheon.\n\nKamuy-huci is one of the most important kamuy. Her full name means ‘Rising Fire Sparks Woman’, and she is also called Iresu Kamuy, ‘People Teacher’. She guards the gateway between the world of humans and the world of the kamuy.\n\nAinu belief holds that the soul of the dead travels to the afterlife through her hearth. Funerals therefore included prayers and offerings to the fire kamuy and verse laments wishing the dead a smooth journey."
 kayra_god_desc: "[ShowGodName('kayra_god')] is the god of creation of the [ShowCultureGroupName('turkic_group')] people.\n\nKayra, ‘the merciful king’, is described as both father and mother and lives in the seventeenth layer of heaven. He planted the tree of life, Ulukayın.\n\nSome tellings call him the child of Tengri and the supreme god of the pantheon. In Altai tradition the brothers Ülgen and Erlik were created from him, and in a legend recorded by Radlov he cast the first human from heaven, naming him Erlik."
 khuanu_god_desc: "$khuanu_god$ is the god of nature of the [ShowReligionAdjective('mizo_religion')] pantheon.\n\nKhuanu is a protective spirit of the Mizo, the hill people of northeast India, named alongside Khuavang as the watcher and keeper of the village, or khua. Some Mizo writers saw the guardian worshipped in Sakhua as this spirit, the source of protection and blessing."
 kim_un_kamuy_god_desc: "$kim_un_kamuy_god$ is the god of bears and mountains of the [ShowCultureName('ainu_culture')] people.\n\nKim-un-kamuy means ‘god of the mountains’. In one myth he came from the black shavings of Kotan-kar-kamuy’s fire-making, and the Ainu believed that the bear brought its hide and meat to humans as his gift."
 kine_nane_god_desc: "$kine_nane_god$ is the goddess of crops and prosperity.\n\nKine Nane is named among the deities of the Tani peoples of Arunachal, whose rites were led in village or household by shamans called nyibu."
 kotan_kar_kamuy_god_desc: "$kotan_kar_kamuy_god$ is the creator god of the [ShowReligionAdjective('ainu_religion')] pantheon.\n\nKotan-kar-kamuy means ‘the deity who makes villages’. The missionary John Batchelor held that every other kamuy answered to him as eternal ruler of the universe, but later scholars doubt this, noting that he is only rarely worshipped.\n\nOne myth tells how he tried to make fire as a gift for humankind. A poplar drill failed and turned into evil spirits; an elm succeeded, and from its white shavings came the huntress goddess Hasinaw-uk-kamuy, and from the black the Mountain God, the bear."
 legba_god_desc: "$legba_god$ is a spirit of the crossroads, who grants communication to the spirit world.\n\nLegba, in Fon Lɛgbà and in Ewe Elegba, is a vodun and the intermediary between god and humans. He may have been taken over from the Yoruba Eshu-Elegba.\n\nHe is invoked first at every ceremony. He appears as an old man with a crutch, straw hat and pipe, and the dog is sacred to him. In the Atlantic diaspora he became Papa Legba, identified with Saint Peter."
 lisa_god_desc: "$lisa_god$ is goddess of the Sun and the creator goddess of all things together with his twin [ShowGodName('mawu_god')].\n\nLisa is worshipped by the Fon and other Gbe peoples of Dahomey. Lisa and Mawu are children of Nana Buluku and parents of the thunder god Hebioso.\n\nIn the myth Lisa was instructed by Mawu to teach humans how to build civilisation. The name is thought to come from Orisanla, another name of the Yoruba Obatala, so the pair may have been borrowed from Yoruba culture."
 mainao_god_desc: "$mainao_god$ is the goddess protector of the rice fields of the [ShowCultureName('map_bodo')] people.\n\nMainao is the daughter of the supreme god Bathoubwrai and, after him, the most important deity of the Boro. She ranks among the prominent household gods.\n\nHer altar stands in the easternmost part of the main house, and Bathou is always worshipped together with her. Worshippers face east, with Mainao on the left of Bathou, and wave the lamp and incense seven times round her."
 mama_cocha_desc: "[ShowGodName('mama_cocha')] is the goddess of sea of the people of the [ShowRegionName('andes_region')].\n\nMama Qucha, ‘Mother Sea’, was also the goddess of fish and guardian of sailors and fishermen. In Inca belief she was wife of the creator Wiraqucha, mother of the Sun, Inti, and the Moon, Mama Killa, and one of the four Elemental Mothers.\n\nShe was invoked to calm rough waters and bring good fishing, and mattered most to coastal peoples. She dwelt in Hanan Pacha, the world above, and was identified with the rain that waters the fields."
 mamaquilla_desc: "[ShowGodName('mamaquilla')] is the moon goddess of the people of the [ShowRegionName('andes_region')].\n\nMama Quilla, Mother Moon, was the older sister and wife of Inti and daughter of Viracocha. She was mother of Manco Capac and Mama Ocllo, the mythical founders of the Inca state, goddess of marriage and the menstrual cycle, and a defender of women. She mattered for the Inca calendar.\n\nShe was pictured as a beautiful woman who wept silver tears, and a lunar eclipse meant an animal was attacking her. Her temple in Cusco was served by priestesses."
 marang_buru_god_desc: "$marang_buru_god$ is the supreme god of the [ShowReligionAdjective('sarna_religion')] pantheon.\n\nMarang Buru, ‘the Great Mountain’, is worshipped by the Santal, Bhumij, Ho and Munda peoples of eastern India. He is regarded as the cause of all causes, and the Santals hold that a hill is itself the deity."
 mawu_god_desc: "$mawu_god$ is god of the Moon and the creator god of all things together with his twin [ShowGodName('lisa_god')].\n\nMawu is worshipped by the Fon and other Gbe peoples of Dahomey. Her name means the Unsurpassable One. Mawu and Lisa are children of the primal creator Nana Buluku.\n\nMawu shaped humans from clay and asked the serpent Aido Hwedo to coil beneath the earth to hold it up. In the eighteenth century, under King Tegbesu, Dahomey raised the pair to creators of the world."
 mergen_god_desc: "[ShowGodName('mergen_god')] is the god of abundance and wisdom of the [ShowCultureGroupName('turkic_group')] people.\n\nMergen was the son of Kayra and brother of Ülgen, living on the seventh floor of the sky. His name means ‘archer’ in Turkic languages, and in Khalkha ‘wise’ or ‘genius’. He was shown as a young man in a helmet with a bow, riding a white horse, or as a strong bull. White was his colour."
 mindiss_god_desc: "$mindiss_god$ is the manatee shaped protector of th Fatick Region in the [ShowReligionAdjective('odinala_religion')] pantheon.\n\nMindiss is a pangool of the Serer, an ancestral spirit with goddess-like attributes. Offerings are made in her name at the River Sine."
 nat_awal_god_desc: "$nat_awal_god$ is the goddess of fertility of the [ShowCultureName('gond')] people.\n\nAmong the Gonds of central India, worship went chiefly to clan and village deities rather than to the high god Baradeo, among them a village mother goddess."
 nat_awual_god_desc: "$nat_awual_god$ is the mother goddess of the village of the [ShowCultureName('gond')] people.\n\nNat Awual is worshipped with the guardian Aki Pen before every festival. Where she has no shrine of her own, her abode is a saja tree."
 ngai_god_desc: "$ngai_god$ is the creator god of the [ShowCultureName('maasai_culture')] people.\n\nNgai, also called Enkai, is known to the Maasai as both masculine and feminine, and is the creator god of the related Kikuyu, Embu, Meru and Kamba of Kenya and Tanzania. His name is synonymous with rain.\n\nThe Maasai place his first dwelling on Ol Doinyo Lengai, the Mountain of God, and their laibon priests preside over sacrifice. In Kikuyu tradition he brought the ancestors Gikuyu and Mumbi together and made Mount Kenya his seat."
 nhialic_god_desc: "$nhialic_god$ is the main [gods|e] of the [ShowReligionAdjective('muonyjang_religion')] pantheon.\n\nNhialic is the creator and the god of sky and rain of the Dinka of what is now South Sudan. He is seen as distant from humans.\n\nIn the myth of the origin of death, the first humans, Garang and Abuk, were told to pound only a set amount of grain daily. Abuk pounded more, and the grain struck Nhialic in the face. He sent a blue bird to cut the rope joining heaven and earth, and people became mortal."
 niparaya_god_desc: "$niparaya_god$ is the creator god of the [ShowReligionAdjective('pericu_religion')] pantheon.\n\nNiparaya is the all-powerful master of heaven and earth in the mythology of the Pericú of Baja California, recorded in fragments in the early 1730s. His wife was Amayicoyondi, and they had three sons.\n\nThe first, Quaayayp, made the race of men and was later killed by them. The second was Acaragui, and the third was called Wac or Tuparan, depending on the sect."
 njord_god_desc: "$njord_god$ is the of the Vanir, father of $freyr_god$ and $freya_god$. He is worshipped in relation to the seafaring and fishing.\n\nNjörðr was also linked to wind, wealth and the fertility of crops. By his unnamed twin sister he was father of Freyr and Freyja. The poem Grímnismál gives him a hall at Nóatún.\n\nAfter the war between the Æsir and the Vanir he went to the Æsir as a hostage. His marriage to the giantess Skaði was unhappy. His name matches that of Nerthus, a fertility goddess recorded in the first century, and many Scandinavian place names contain it."
 nyambe_god_desc: "$nyambe_god$ is the main [gods|e] and Sky Father for many [ShowLanguageFamilyName('bantu_language_family')] speaking people.\n\nNyambe is the creator of the universe, god of the sun and the source of all life. He is described as all-powerful and all-knowing, and watches over his creation from above.\n\nThe name varies from people to people, as Njambe, Nyambi, Nzambi and other forms, while the idea stays much the same. Only the Bakongo are known to have also seen Nzambi as a goddess and Sky Mother."
 obatala_god_desc: "$obatala_god$ is the creator on mankind in the [ShowReligionName('isese_religion')] religion.\n\nObatala, King of White Cloth, also called Orisanla, is the king of the orisha in Yoruba religion. Sent down from heaven on a gold chain with a snail shell of sand, a white hen and a palm nut, he molded the first people from clay.\n\nIn some versions he drank palm wine while working and made deformed figures, so on sobering he vowed never to drink again and became protector of the disabled. Ife tradition also remembers him as a mortal founder-king of Ife."
 odin_god_desc: "$odin_god$ is the Lord of the Aesir, who sacrificed one eye for wisdom, and hanged from the World Tree for nine days and nine nights to gain knowledge of the runes.\n\nOdin was a god of wisdom, poetry, war and the dead in Norse and wider Germanic paganism; his name means ‘lord of frenzy’. Husband of Frigg and father of Baldr and Thor, he was shown as an old, one-eyed man with a spear, attended by two ravens.\n\nHe received slain warriors in Valhöll and would be killed by the wolf Fenrir at Ragnarök. About 1075 Adam of Bremen saw his statue in the temple at Uppsala."
 ogbunabali_god_desc: "$ogbunabali_god$ is the god of death of the [ShowReligionAdjective('odinala_religion')] pantheon.\n\nOgbunabali, meaning the one who kills at night, is a traditional Igbo deity. He is said to kill his victims in the night, usually criminals or those who have broken an unspeakable taboo."
 olokun_isese_god_desc: "$olokun_isese_god$ is the god of water and wealth of the [ShowReligionAdjective('isese_religion')] pantheon.\n\nOlokun is the orisha of the ocean depths in Yoruba religion, parent of Aje, the orisha of wealth. Worship of Olokun is strongest in the Yoruba and Edo towns of southwestern Nigeria; near the coast the god is male, in the hinterland female. One Ife account makes Olokun the wife of Oduduwa who became the sea after leaving him.\n\nAt Lagos the Oniru chief held an annual festival to Olokun to avert flooding, and in Ife the chief priest is the Oba Ijio."
 olorun_god_desc: "$olorun_god$ is the supreme god of the [ShowReligionAdjective('isese_religion')] pantheon.\n\nOlorun is the ruler of the heavens and creator of the universe. His name contracts oni, owner, and orun, heaven. He is also called Olodumare, read as the all-sufficient.\n\nHe is remote, with no shrine, image or sacrifice of his own. He is approached through the orisa, the divine beings of whom Obatala is king, who govern and sustain the physical world."
 ori_god_desc: "$ori_god$ is the custodian of fate in the [ShowReligionName('isese_religion')] religion.\n\nOri, literally head, is the Yoruba concept of a person's spiritual intuition. It is a spark of consciousness set into the human essence, and is often personified as an orisha in its own right.\n\nWhatever a person becomes, or whatever happens in a life, is held to be as destined by Ori, so Ori is worshipped like the orisha. When things go wrong it is consulted and appeased, and a person with a balanced character is aligned with his Ori, his divine self."
 pachamama_desc: "[ShowGodName('pachamama')] is the Earth Mother of the people of the [ShowRegionName('andes_region')].\n\nPachamama is the Andean goddess of space, time and life, revered by the peoples of the Andes. Some myths make her the wife of Pachacamac and the mother of Mama Quilla and Inti. She was often worshipped as Mama Allpa, goddess of the earth, the source of people's material and spiritual sustenance.\n\nHer shrines were sacred rocks or the trunks of legendary trees, and priests offered her llamas and guinea pigs. After the Spanish conquest, many Indigenous peoples linked the Virgin Mary with her."
 paruhang_god_desc: "$paruhang_god$ is the god of the sky of the [ShowReligionAdjective('kirat_mundhum_religion')] pantheon.\n\nParuhang is worshipped by the Rai, a Kirati people of eastern Nepal. He is the husband of the earth goddess Sumnima. He stands for the celestial powers and the order of creation, and for rain and divine protection. The Rai make offerings to him together with Sumnima at the Sakela festival of sowing and harvest."
 pathian_god_desc: "$pathian_god$ is the supreme god of the [ShowCultureName('zo_culture')] people.\n\nPathian is revered by the Mizo, the Tibeto-Burman hill people once called the Lushai, in what is now Mizoram. He is thought to dwell in heaven as the kind creator, protector and benefactor of all creation, rewarding the righteous and punishing the wicked.\n\nMizo writers differ on whether the traditional faith, Sakhua, involves worshipping him. Some see him as its centre, while others hold that it addresses only the Khuavang, the spirit of blessing and protection."
 phi_earth_god_desc: "$phi_earth_god$ is the god of earth of the [ShowReligionAdjective('satsana_phi')] pantheon.\n\nAmong the Tai peoples, guardian phi watched over particular places, such as temples and the town pillar, the lak mueang, at the heart of each town."
 phi_fire_god_desc: "$phi_fire_god$ is the god of all natural powers of the [ShowReligionAdjective('satsana_phi')] pantheon.\n\nThe Tai peoples honoured many phi alongside the vital forces called khwan and their ancestors, and the old sky gods, the phi thaen, stood above the local spirits."
 phi_heaven_god_desc: "$phi_heaven_god$ is the god of heavens of the [ShowReligionAdjective('satsana_phi')] pantheon.\n\nPhi of Heaven is known to the Tai as Phi Fa or Phi Thaen, giver of rain and creator god. The Tai call him by the word for sky, thaen, which comes from the Chinese tian. He appears in the stories of Khun Borom.\n\nIn the Phi Fa ritual, held for someone recovering from serious illness, a shaman invites him to the altar with khaen music, chanting and an all-night dance, and asks him for healing and protection."
 phi_water_god_desc: "$phi_water_god$ is the god of water of the [ShowReligionAdjective('satsana_phi')] pantheon.\n\nSatsana Phi, the old faith of the Shan, the Dai, the Lao and the Ahom, gave worship to many phi, from the guardians of temples to the old sky gods, the phi thaen."
 polo_god_desc: "$polo_god$ is the god of the Moon of the [ShowReligionAdjective('donyi_polo_religion')] pantheon.\n\nPolo is a god of the Tani peoples of Arunachal, among them the Adi, Galo and Nyishi. Traditionally he was addressed as Father, paired with the Sun, Donyi, as Mother.\n\nThe two were called on to witness the truth and to punish liars. The Minyong and Padam Adi tell of a creator, Sedi, whose eyes became the Sun and Moon."
 poseidon_god_desc: "[ShowGodNameWithNoTooltip('poseidon_god')] is the god of the sea, earthquakes, and the untamed forces of nature.\n\nPoseidon, one of the twelve Olympians, was also the god of storms and horses and the protector of seafarers. When the world was divided by lot among the sons of Cronus, Zeus received the sky, Hades the underworld and Poseidon the sea.\n\nIn Bronze Age Pylos and Thebes he was a chief deity, called Earth Shaker. He lost Athens to Athena, and in the Odyssey his anger over the blinding of his son Polyphemus kept Odysseus at sea for ten years."
 pu_vana_god_desc: "$pu_vana_god$ is the god of thunder and lightning of the [ShowCultureName('zo_culture')] people.\n\nPu Vana, whose name means God in Heaven, is a benevolent spirit of the Mizo, the hill people of northeast India. Traditionally he was counted as the grandfather, and probably the father, of Pathian, the creator, and was worshipped as the god of nature. Scholars compare him to Indra in Hindu belief."
 quetzalcoatl_god_desc: "[ShowGodName('quetzalcoatl_god')] is the god of life, wind and wisdom in the Mesoamerican pantheon.\n\nQuetzalcoatl, ‘Feathered Serpent’, was an Aztec god of the planet Venus, crafts and merchants, a creator who helped make humankind, and patron of the priesthood. As wind god he took human form as Ehecatl. Quetzalcoatl was also the title of the two chief priests of the Great Temple of Tenochtitlan.\n\nIn the legends of Tollan, the ruler Quetzalcoatl was tricked by his rival Tezcatlipoca and driven into exile. Sixteenth-century Spanish writers conflated the god with that ruler."
 ratovantany_god_desc: "$ratovantany_god$ is an earth god of the [ShowReligionAdjective('fomba_gasy_religion')] pantheon that made a pact with [ShowGodName('zanahary_god')] to create humanity.\n\nRatovantany, also called Andriantompo, was self-created, and his creation myth is known across Madagascar. He shaped human beings from soil and takes back the corpse at death to decompose it. The soul belongs to Zanahary and goes to the sky or the sun. Unlike Zanahary, Ratovantany does not appear to have been a prominent deity to any Malagasy people."
 rep_un_kamuy_god_desc: "$rep_un_kamuy_god$ is the god of the sea of the [ShowCultureName('ainu_culture')] people.\n\nRep-un-kamuy was one of the spirits that the Ainu of the coasts of Hokkaidō, Sakhalin and the Kuril Islands looked to for their living."
 sakhua_god_desc: "$sakhua_god$ is the god of the family of the [ShowCultureName('zo_culture')] people.\n\nSakhua is also the name the Mizo of northeast India gave to their traditional faith, and in the view of the writer Zairema it is the guardian spirit of a clan, representing its identity. The word joins sa, the clan or family a person is born into, with khua, the village."
 sakpata_god_desc: "$sakpata_god$ is the god of earth and disease of the [ShowReligionAdjective('vodun_religion')] pantheon.\n\nSakpata is worshipped among the Fon, Ewe, Adja and other Gbe-speaking peoples, from the west of present-day Nigeria to the Volta Region. He is the Dahomean form of the Yoruba Sopona, god of smallpox, and can both heal and inflict illness and madness.\n\nOral history says smallpox decimated their ancestors at Adja Tado until a Yoruba man called Torgbui Anyi cured them. Sakpata is one of the most worshipped of their gods."
 shakti_god_desc: "$shakti_god$ is a major [goddess|e] in [ShowReligionName('hindu')], revered as the fundamental cosmic energy. She is worshiped as the supreme [goddess] or Devī in [ShowPolicyName('shaktism')], and many other [goddesses] are worshiped as different aspects of $shakti_god$. Some of them can even take many other forms themselves.\n\nThe name Śakti comes from the Sanskrit root meaning to be able. Beside Shiva she appears as Uma, Durga, the terrifying Kali and the motherly Parvati; beside Vishnu, as Lakshmi. In nondualist thought Shiva and Shakti are one inseparable being. The name Shakta became popular from the ninth century."
 shiva_god_desc: "$shiva_god$ is one of the main [gods|e] of [ShowReligionName('hindu')], and the supreme being in [ShowPolicyName('shaivism')]. He is the patron of asceticism and yoga.\n\nŚiva is also called Mahadeva, the Great God. He is the yogi who lives an ascetic life on Mount Kailasa, patron of meditation and the arts, and also a householder with his wife Parvati and sons Ganesha and Kartikeya.\n\nHis emblems are the trident, the crescent moon, the river Ganga in his matted hair and a third eye that burns what it looks on. He is mostly worshipped as the lingam."
 sky_god_desc: "The $sky_god$ represents the omnipresent force that watches over and protects humanity.\n\nA male sky god often rules the pantheon as a sky father, paired with an earth mother. In Greek myth the primordial sky god Uranus was succeeded by Zeus, who ruled from Mount Olympus."
 song_bwrai_god_desc: "$song_bwrai_god$ is a household god of the [ShowCultureName('bodo_culture')] people.\n\nThe ethnographer Sidney Endle lists Song Bwrai with Bathoubwrai and Mainao among the prominent gods of the Boro. He is worshipped at an altar inside the house called the dham, chiefly by women, and the offerings made to him are afterwards laid at the sijou tree of Bathou."
 sumnima_god_desc: "$sumnima_god$ is the supreme god and Mother Earth of the [ShowCultureName('kirati_culture')] people.\n\nSumnima is worshipped by the Rai, a Kirati people of eastern Nepal, as the goddess of nature, fertility, agriculture, forests and rivers. She is the wife of the sky god Paruhang.\n\nThe two together stand for the union of heaven and earth in the Kirat Mundhum. The Rai make offerings to Paruhang and Sumnima at the Sakela festival of sowing and harvest."
 supay_god_desc: "[ShowGodName('supay_god')] is the god of the underworld for the people of the [ShowRegionName('andes_region')].\n\nSupay was an ambivalent spirit of the Quechua, Aymara and Inca who ruled the Uku Pacha. He stood for shadow, night, darkness and the inevitable passage of death. The word comes from supa, meaning shadow, illness or death.\n\nIn its early form the name was neutral: the 1560 Quechua–Spanish dictionary of Friar Domingo de Santo Tomás lists a good spirit, allisupa, and a bad one, manaallisupa. Under Spanish rule Supay was turned into the Christian devil."
 surya_god_desc: "$surya_god$ is the Sun [goddess|e] in [ShowReligionName('hindu')], and one of the main deities of [ShowPolicyName('smartism')].\n\nIn Hindu texts Sūrya is a male god, counted among the five equivalent deities of the Smarta tradition, and is shown riding a chariot drawn by seven horses. The oldest Vedic hymns, such as Rigveda 1.115, revere him as the rising sun; in the medieval period he was worshipped with Brahma by day, Vishnu at noon and Shiva in the evening.\n\nHis worship declined greatly around the thirteenth century, perhaps because Muslim invaders destroyed Sun temples in northern India. He was increasingly merged with Vishnu and Shiva."
 takhar_god_desc: "$takhar_god$ is the god of justice and vengeance of the [ShowReligionAdjective('odinala_religion')] pantheon.\n\nTakhar, or Taahkarr, is a demi-god of the Serer of Senegal, the Gambia and Mauritania. Serer appeal to him against injuries, oppression and evil magic.\n\nHe is worshipped at the foot of the tallest trees of a sacred forest, where he and his adversary Tiurakh, god of wealth and property, are believed to dwell. His high priests, the Saltigues, are old men from notable families who judged theft and witchcraft, relying on fear of Takhar more than on the non-lethal poison they gave the accused."
 tano_god_desc: "$tano_god$ is the gof of war of the [ShowReligionAdjective('akan_religion')] pantheon, he represents the Tano river.\n\nTano, whose true name is Ta Kora, is also a god of strife, and among the Asante of thunder and lightning. He is counted the highest of the abosom, the lesser gods, many of whom are his sons.\n\nHe is pictured as a large armed warrior who can change shape, and baboons are said to guard his shrine. Fish are his children, and the Asante do not eat the river's fish."
 tengri_god_desc: "[ShowGodName('tengri_god')] is the god of heaven of the [ShowCultureGroupName('turkic_group')] people.\n\nKök Teŋri, the Eternal Blue Sky, was judge and source of life, eternal and supreme. His oldest recorded form is the Chinese transcription Cheng-li, used of the Xiongnu in the fourth century BC.\n\nHe was the chief god of the steppe ruling classes in the sixth to ninth centuries. The Orkhon inscriptions of the early eighth century say that Tengri creates death, and a khagan called himself ‘Tengri-like, Tengri-born’. The Uighur khagans’ adoption of Manichaeism in the eighth century cost his cult its place at court."
 tepeu_god_desc: "$tepeu_god$ is the sovereign god of the [ShowLanguageName('maya_language')] speaking people.\n\nTepeu, a K’iche’ Maya word meaning ‘sovereign’, was a creator god of the K’iche’ of the Guatemalan highlands. According to the Popol Vuh, he made the world and humanity together with the Feathered Serpent Q’uq’umatz, and was a god of lightning and fire.\n\nThe two were held to be the mythical ancestors of the K’iche’ nobility in the male line. The Popol Vuh was recorded in K’iche’ around 1550, after the Spanish conquest."
 tezcatlipoca_god_desc: "[ShowGodName('tezcatlipoca_god')] is the god of providence, the invisible and darkness in the Mesoamerican pantheon.\n\nTezcatlipoca, ‘Smoking Mirror’, was a central god of the Aztecs, linked to the night sky, obsidian, hurricanes, conflict and divination; the name alludes to the obsidian mirrors used in prophecy. He was one of four sons of the primordial pair Ometecuhtli and Omecihuatl, and his animal form was the jaguar.\n\nHe was Quetzalcoatl’s rival in the myth of the Five Suns and in the legends of Tollan. His festival was Toxcatl, and a new king fasted and prayed to him at his enthronement."
 thunder_god_desc: "The $thunder_god$ represents the immediacy and indiference of fate.\n\nThunder gods have been imagined by peoples in many cultures. In Indo-European religions the thunder god is often male and chief of the gods, as with Indra in Hinduism, Zeus in Greece, Perkunas among the Balts and Perun among the Slavs."
 tlaloc_god_desc: "[ShowGodName('tlaloc_god')] is the rain god of the Mesoamerican pantheon.\n\nTláloc was also the Aztec god of water and earthly fertility, feared for his hail, thunder and lightning. He is shown with fangs and a forked tongue, often holding a vessel of water. A storm god was already worshipped at Teotihuacan, and his great rites were held on the mountain called Cerro Tláloc.\n\nThose killed by drowning or lightning went to his paradise, Tlálocan. At Tenochtitlan his shrine stood beside Huitzilopochtli’s on the Great Temple."
 tor_god_desc: "$tor_god$ is a member of the Aesir, who is worshipped as the God of thunder, storms, protection and free people.\n\nThor was the hammer-wielding Germanic god of strength, patron of farmers, son of Odin and husband of Sif. He drove a cart drawn by two goats, and his great foe was the world serpent Jörmungandr, with whom he was fated to die at Ragnarök.\n\nIn the Viking Age, hammer pendants and names beginning with Þórr were worn in defiance of Christian missionaries. In the 11th century Adam of Bremen described his statue at Uppsala, and a 12th-century runic stick from Bergen still calls on him and Odin."
 tyr_god_desc: "$tyr_god$ is a member of the Aesir, and is the feeder of wolfs, and the battle god.\n\nIn Norse sources Týr fed the wolf Fenrir. When the gods bound the monster, Týr put his right hand in its mouth as a pledge and lost it when Fenrir found himself tricked. At Ragnarök the dog Garmr is foretold to devour him.\n\nThe Romans equated him with Mars, and a third-century inscription names ‘Mars of the Assembly’, linking him with the Germanic thing. His name is the Old English Tiw, and some scholars think he once stood nearer the centre of the Germanic gods."
 u_blei_nong_thaw_god_desc: "$u_blei_nong_thaw_god$ is the creator god of the [ShowReligionAdjective('ka_niam_khasi_religion')] pantheon.\n\nIn Khasi tradition U Blei Nong-thaw, the Lord Master, first divided humankind into sixteen heavenly families, of which seven were left on earth."
 ulei_longspah_god_desc: "$ulei_longspah_god$ is the god of wealth of the [ShowReligionAdjective('ka_niam_khasi_religion')] pantheon.\n\nThe Khasi faith held that one formless supreme creator, U Blei Nongthaw, stood above all such deities."
 ulei_muluk_god_desc: "$ulei_muluk_god$ is the god of the state for the [ShowCultureName('khasi_culture')] people.\n\nThe Khasis lived in about twenty-five independent states, each ruled by a chief called the syiem."
 ulei_umtang_god_desc: "$ulei_umtang_god$ is the god of drinking water of the [ShowReligionAdjective('ka_niam_khasi_religion')] pantheon.\n\nEvery Khasi village traditionally kept a sacred grove to appease the forest spirit, and the religion was handed down by word of mouth."
 ulgen_god_desc: "[ShowGodName('ulgen_god')] is the god of goodness of the [ShowCultureGroupName('turkic_group')] people.\n\nÜlgen, from the Old Turkic words for ‘rich’ and ‘magnificent’, is a creator god believed to be without beginning or end. He is usually distinct from Tengri, though sometimes identified with him.\n\nHe has seven sons, the White Boys, and nine daughters who inspire shamans. In Altai tradition he is the brother of Erlik, lord of the underworld, and both were created by Kayra; Erlik opposed the upper realm of light and was imprisoned in the ninth layer of the earth."
 umay_god_desc: "[ShowGodName('umay_god')] is the goddess of fertility of the [ShowCultureGroupName('turkic_group')] people.\n\nUmay was protector of women, mothers and children. The word umay meant the placenta. She lived in heaven, unseen, and kept the souls of unborn babies on a mount called Ymay-tas. When she left a child for long it fell ill, and shamans called her back.\n\nThe Kül Tigin inscription of the eighth century compares the khagan’s mother to her, and the khagans’ wives were themselves called Umay. She is especially honoured by the Khakas."
 urpihuachac_god_desc: "[ShowGodName('urpihuachac_god')] is the mother of birds and fish for the people of the [ShowRegionName('andes_region')].\n\nUrpihuachac, also written Urpayhuáchac, appears in the Huarochirí Manuscript as the wife of the god Pachacamac and one of five sisters. They had two daughters who lived on islands off the coast.\n\nAccording to the manuscript, fish once existed only in her care, until they were cast into the sea and multiplied. She was pictured with the features of both bird and fish, and at San Francisco de Mangas some clans asked her for rain in the form of a dove carved of bone."
 uscovilca_god_desc: "[ShowGodName('uscovilca_god')] is the creator god of the [ShowCultureName('chanka_culture')] people.\n\nUscovilca was also the title of the chief of the Hanan Chanka, a farming people of Andahuaylas in the Peruvian highlands. The Chanka were defeated by the Inca at Cusco in 1438."
 viracocha_desc: "[ShowGodName('viracocha')] is the creator god of the people of the [ShowRegionName('andes_region')].\n\nWiraqucha was the supreme god in pre-Inca and Inca belief. Pictured as a bearded man, he is said to have ordered the building of Tiwanaku, made the sun, moon and stars, and set time in motion by commanding the sun to cross the sky. Under the Inca he was the most important deity, followed by Inti.\n\nOne account has him make humanity on an island in Lake Titicaca, teach people how to live, then hand them over to lesser gods and vanish."
 vishnu_god_desc: "$vishnu_god$ is one of the main [gods|e] of [ShowReligionName('hindu')], and the main one in [ShowPolicyName('vaishnavism')]. He is regarded as the supreme being, manifesting himself on earth in the form of his ten [avatars|e].\n\nViṣṇu’s name means All Pervasive, and in the Trimurti he is the Preserver beside Brahma and Shiva. Little prominent in the Vedas, he rose to importance in the last centuries BCE, when he was identified with Vasudeva-Krishna and Narayana.\n\nWhenever evil and chaos threaten the world he descends as an avatar to restore order and protect dharma. Of the ten Dashavataras, Rama and Krishna are the most worshipped."
 waaq_god_desc: "$waaq_god$ is the creator god of the [ShowLanguageName('east_cushitic_language')] speaking people.\n\nWaaq, or Waaqa, is a sky god of the Horn of Africa. The word still means God in Oromo, and survives in Konso, Rendille and other Cushitic languages.\n\nAmong the Oromo he is Waaqa Tokkicha, the one God, who acts through the ayyaana, intermediary spirits. After Islam arrived, the Somali largely replaced the name with the Arabic Allaah, but it lives on in the Jidwaaq clan and the town of Ceelwaaq."
 war_god_desc: "The $war_god$ represents the strength and creativity brought by conflict, but also its devastation and calamity.\n\nWar gods are common in polytheistic religions. The Greek Ares embodied both the courage and the brutality of battle, while his sister Athena stood for strategy and generalship."
 water_god_desc: "The $water_god$ represents the strength and rejuvenation brought by rain and river.\n\nWater deities are most prominent among peoples for whom the sea or a great river mattered. Chinese tradition knows Hebo, god of the Yellow River, and Mazu, goddess of the sea and protector of seafarers."
 wind_god_desc: "The $wind_god$ represents the freedom and wonder of youth.\n\nMany polytheistic religions have one or more wind gods. A wind god may double as an air god, and many are linked with one of the four seasons."
 xiuhtecuhtli_god_desc: "[ShowGodName('xiuhtecuhtli_god')] is the god of fire in the Mesoamerican pantheon.\n\nXiuhtecuhtli, ‘Turquoise Lord’ or ‘Lord of Fire’, was the Aztec god of heat, day and the year, lord of volcanoes and one of the oldest gods of Mesoamerica. He was usually shown young, though sometimes identified with the ‘Old God’ Huehueteotl; his wife was Chalchiuhtlicue.\n\nA small fire burned at the centre of every home in his honour, and the first mouthful of each meal was thrown into the hearth. The Aztec emperors were regarded as his living embodiment at their enthronement."
 yuma_sammang_god_desc: "$yuma_sammang_god$ is the supreme god and Mother Earth of the [ShowCultureName('limbu_culture')] people.\n\nYuma Sammang, also called ‘Grandmother’, is revered by the Limbu, or Yakthung, of eastern Nepal. She is the female form in which the supreme power Tagera Ningwaphuma appears on earth, her male form being Theba Sammang, and the Limbu regard her as a maternal figure.\n\nHer worship is carried by the oral Mundhum. In the 1770s the Limbu confederation Limbuwan fell to Gorkha, but the Limbu kept their culture and Mundhum alive."
 zanahary_god_desc: "$zanahary_god$ creator god and sky father of the [ShowReligionAdjective('fomba_gasy_religion')] pantheon.\n\nZanahary is the personified sky and supreme god of Malagasy belief, usually thought of as male. With the earth god Ratovantany he made humanity: at death the soul rises to the firmament and the body returns to the earth, which ties him closely to the soul and to ancestor worship.\n\nHe is a national god of the Merina people of the central highlands. A missionary account records Malagasy saying that he made people's hands and feet, then left them to themselves."
 zeus_god_desc: "[ShowGodNameWithNoTooltip('zeus_god')] is the king of the Olympian gods, ruler of the sky, thunder, law, and cosmic order.\n\nZeus was the son of Cronus and Rhea and the supreme god of the ancient Greeks. He was honoured as a sky father: even gods who were not his children called him Father. His symbols were the thunderbolt and the eagle, and he was married to Hera.\n\nGreek worship had long died out by 1337. In the fifteenth century the philosopher Plethon placed Zeus at the head of his proposed pagan order."
 adamite_services_desc: "The Adamite sect insists upon nakedness during church services. Without the stylings of status or culture, we appear as equals in the eyes of God, a stark reminder of our shared humanity and of the innocence we enjoyed before the Fall.\n\nSources report an Adamite sect in North Africa in the second to fourth centuries. In fifteenth-century Bohemia the Adamites, or Pikarti, broke from the radical Taborites and founded a commune on an island in the Nežárka river. They held goods in common and rejected the priesthood and transubstantiation. In 1421 Jan Žižka attacked and suppressed them."
 adoptionism_desc: "Our belief posits that Jesus Christ became God's Son at his baptism or resurrection, rather than being eternally divine.\n\nSome scholars see adoptionism in the earliest Christian writings, but church leaders condemned it as heresy in the fourth and fifth centuries. In the 780s Elipandus, Archbishop of Toledo, and Felix, Bishop of Urgell, revived it in Spain, calling Christ the adopted son in his humanity. The Council of Frankfurt, called by Charlemagne, condemned it in 794."
 adult_baptism_desc: "Being baptized as an adult on the basis of profession of faith in Jesus Christ and as admission into a local community of faith is made by those who believe that saving grace and Church membership are gifts from God. The recipient's faith must be vocalized and cannot be imparted or transferred from one person to another.\n\nIn Zürich in 1525 Conrad Grebel and his followers began rebaptizing adults and were called Anabaptists. Felix Manz, one of them, was drowned in the Limmat in 1527 under a council ban on rebaptism."
 aniconism_desc: "Symbols are not a proper way to represent our Lord, as they are means to represent idols or people. We will reject any representation, including the cross used by other Christians.\n\nEarly Christians such as Tertullian and Clement of Alexandria held the Ten Commandments to be binding, and the Byzantine iconoclasm of the eighth century turned the question into open conflict.\n\nMedieval dualist groups went further: Byzantine writers charged the Paulicians with rejecting the cross, and the Bogomils discarded it too. In the sixteenth century Calvinists stripped images from their churches."
 arminianism_desc: "Arminianism is based on the pluralistic and humanitarian ideas of the Dutch Reformed theologian Jacobus Arminius.\n\nJacobus Arminius (1560–1609) studied under Calvin's successor Theodore Beza but rejected unconditional election. For Arminius, God's election was of believers, conditional on faith, and grace could be resisted.\n\nAfter his death his followers set out their views in the Five Articles of Remonstrance (1610) and were called Remonstrants. The Synod of Dort of 1618–19 condemned them as heretics; Holland officially tolerated them again about twelve years later."
 asceticism_desc: "Materialistic pursuits blind us to the divine truth. Only by devoting ourselves to live simple lives without luxury can we achieve spiritual enlightenment.\n\nThe Bogomils sought purity through fasting and prayer, convinced that matter was Satan's work. Cathar Perfects renounced property, sex and meat. Around 1173 the rich merchant Peter Waldo gave away his goods to preach apostolic poverty, and his followers, the Waldensians, made voluntary poverty a mark of their movement."
 baptism_by_fire_desc: "Our faith does not believe that baptims by water is permanent, as Saint John the Baptist admited. It is only by touching the four sides of the head of a person with a burning candle that a permanent baptism can happen.\n\nEarly modern Catholic reports say that the Paulicians of the Balkans baptised with fire rather than water, which the English diplomat Paul Rycaut confirmed. Byzantine emperors had moved the sect to Thrace from the eighth century, and some of its members later turned Orthodox, Muslim or Catholic."
 bread_and_wine_desc: "We believe that only a communion which includes both bread and wine is valid, even for lay members. Our clergymen will administer the communion under both kinds to every member of the service.\n\nCommunion under both kinds ran against the Catholic Church of the time, in which only priests drank the consecrated wine. Jakoubek of Stříbro taught the doctrine in Prague in 1414. The chalice became the emblem of the Hussites, who made it one of the Four Articles of Prague in 1420, and later Lutheran and Reformed churches adopted it too."
 civic_religion_aspect_desc: "Honoring the gods is the same as maintaining the well-being of the state. Therefore, religious practices and ceremonies are a civic duty that we must uphold to ensure the prosperity of our polis.\n\nIn the Greek city-states no central authority governed belief, so worship was regulated by each polis. Its priests were mostly drawn from the local elite, and its festivals bound the citizens together.\n\nThe Panathenaia of Athens, put in order by Peisistratos in 566 BC, ended in a procession up the Acropolis and sacrifices to Athena. Rome held the same view, that the peace of the gods depended on traditional rites performed correctly."
 clerical_poverty_desc: "The Clergy should own no riches and give up their material possessions. They should devote their attention to God rather than the secular world.\n\nPeter Waldo's followers practised clerical poverty from the 1170s, and the Oxford theologian John Wycliffe insisted on the radical poverty of all clergy in the fourteenth century. The Hussites carried the idea into Bohemia: the Four Articles of Prague of 1420 called for priests to give up secular power."
 consolamentum_desc: "As the process of living incurs, inevitably, in regret for our sins, the need to receive a consolation to enter Heaven pure and move closer to God becomes obvious. By receiving the #italic Consolamentum#!, our people are absolved of their sins upon impending death,\n\nThe consolamentum, called heretication by its Catholic opponents, was the only sacrament of the Cathars. It was understood as a baptism in the Holy Spirit, bringing absolution and the power to preach.\n\nMen and women alike received it, only twice in a lifetime: on confirmation in the faith and on the point of death. Those consoled became the Cathar Perfect."
 crown_as_head_of_faith_desc: "The Church is no longer subject to one external, corrupt theocrat. Instead, all religious issues shall be now redirected to the ruler who serves as the new Head of the Faith.\n\nParliament's Act of Supremacy of 1534 made Henry VIII Supreme Head of the Church of England, replacing the pope. In 1558 the act under Elizabeth I gave her the title Supreme Governor.\n\nIn the Holy Roman Empire, Lutheran princes took over church government as emergency bishops, and the Peace of Augsburg of 1555 let each prince decide the faith of his territory."
 dii_familiares_aspect_desc: "The domestic and familiar gods play a very important role for the people of our country. They protect and influence everything that happens in a person's domain, which commonly entails a household, but could also encompass roadways, neighborhoods, or even entire cities.\n\nStatues of the household Lares stood at the table during family meals, and their blessing was sought at important family events. Other Lares guarded roads, fields, towns and the state. Neighbourhood Lares had crossroad shrines, the focus of the Compitalia, where freedmen and slaves served as cult officials. Unofficial cults survived into the early fifth century."
 dionysian_mysteries_aspect_desc: "The rituals, dance, and music of those initiated into the mysteries of Dionysus provide liberation and release to its members, without distinction of social classes. The death and rebirth of the god are mirrored by the cycle of the grape vine, growing from the earth, becoming wine, and finally being drunk by the acolytes in glory of Dionysus.\n\nThe Dionysian Mysteries had worshippers dance to drum and pipe by torchlight until they reached ecstasy. Rulers feared the cult, since slaves, outlaws and non-citizens found release there. Initiates were buried with gold tablets that guided them through the underworld."
 eastward_prayer_desc: "It is common practice in all Christendom to pray towards the East, to the rising sun of Christ. Some other confessions may be more loose with this orientation, but for us there is simply no other manner of praying, both in public and in private, and all our churches need to be accomodated to follow that orientation.\n\nTertullian says some pagans thought Christian eastward prayer meant sun worship. Later writers tied it to Christ's return, which Matthew likens to lightning from the east.\n\nThe Apostolic Constitutions of about 375–380 put the sanctuary at the east end of the church; Rome accepted the orientation only in the eighth or ninth century. The Coptic Church prays its seven daily hours facing east and builds or remodels its churches to match."
 eleusinian_mysteries_aspect_desc: "The acolytes of the Eleusinian mysteries follow the myth of the abduction of Persephone from her mother, Demeter, by the king of the underworld, Hades, and her subsequent release and deception. To the initiated, this myth represents the cycle of growth and rebirth of all plant life and the eternity of life as it flows from one generation to the next.\n\nThe Eleusinian Mysteries were yearly initiations into the cult of Demeter and Persephone at Eleusis. They enacted Persephone's ascent and reunion with her mother Demeter, a tale of life's return that promised initiates a reward after death.\n\nUnder Peisistratos the rites drew pilgrims from all Greece. Theodosius I closed them in AD 392, and in 396 Alaric looted the shrines."
 five_doors_desc: "Some among our people practice a meditation style consisting in closing all the doors in a house while opening the #italic five doors#! or the five senses. We will introduce this practice everywhere.\n\nThe Bogomils, who held that the body was Satan's work, built no churches but prayed in private houses and sought to purify the body by fasting and dancing."
 freedom_to_preach_desc: "There is much disagreement among the followers, but each sect shall be given the freedom to preach freely so long as God is in their hearts.\n\nIn January 1568 the Diet of the Three Nations of Transylvania, meeting at Torda at the request of the Antitrinitarian preacher Ferenc Dávid, authorized local communities to elect their own preachers.\n\nThe edict of John Sigismund Zápolya's realm gave the Catholic, Lutheran and Calvinist churches, and the Unitarians around Dávid, room to preach side by side. It did not grant individuals freedom of conscience, but it was an unprecedented act of toleration in sixteenth-century Europe."
 gnosticism_desc: "Gnosticism centers on personal salvation through #italic gnosis#!. We will escape the material world and return to a higher realm by seeking spiritual insight.\n\nGnosticism is the name given to a family of movements, fully developed by the mid-second century. Gnostics generally held that the material world was made by a flawed demiurge, not by the hidden supreme God.\n\nLater dualist Christians echoed this view. The Bogomils taught that matter was Satan's work, and the Cathars, who derived from them, taught that souls were spirits trapped in flesh."
 gomarism_desc: "Franciscus Gomarus opposes the beliefs of Jacobus Arminius who taught Pelagian doctrines and tried to create a new school of theology within the university where the two of them taught.\n\nGomarism is the strict Calvinism of Franciscus Gomarus (1563–1641), born in Bruges and professor of theology at Leiden from 1594. He defended unconditional election.\n\nAfter the Remonstrants stated their case in 1610, Gomarus' followers answered with the Counter-Remonstrance of 1611 and were called Counter-Remonstrants. At the Synod of Dort of 1618–19 they carried the day, and the Canons of Dort rejected the Arminian position."
 hero_cult_aspect_desc: "Our history is full of powerful figures who shaped our society and our character. These were the mortal sons of the gods, humans with extraordinary abilities who often met tragic fates, and who protected and led our ancestors into founding the great nation that we are today. It is now our duty to worship them and learn their lessons.\n\nIn Greek religion a hero was a legendary mortal honoured with rites at a shrine, the heroon, usually over his tomb. A neglected hero might send disease. Draco, the Athenian lawgiver, ordered local heroes honoured with the gods in the late seventh century BC."
 holy_cooperation_desc: "A shift will occur towards promoting and actively participating in productive work. This ethos will extend to our agricultural communities, inspired by the early Christians' model of a sacred cooperative community.\n\nThe Bogomils rejected the church hierarchy and let each congregation ordain its own leaders, in an egalitarian spirit."
 imperial_cult_aspect_desc: "As the ancient emperors of Rome were once regarded as divine by the people and Senate, our ruler and their dynasty are also to be considered as such. Their greatness, majesty, and authority clearly mark them as not only divinely sanctioned, but as gods themselves.\n\nThe Roman imperial cult identified emperors and some of their relatives with the divinely sanctioned authority of the state. Shaped under Augustus, it spread through the provinces, though the Republic had never worshipped a living man.\n\nThe Senate could vote a dead emperor a state god by apotheosis, an honour Vespasian and Septimius Severus used to bolster new dynasties. The cult was bound up with Rome's official gods, and was abandoned when Theodosius I made Christianity the state religion."
 individual_creeds_desc: "Allowing our people to formulate their own creeds will encourage the formation of individual opinions and allow to pave the way for the path to progress!\n\nAfter the Reformation, churches no longer shared one creed but drew up confessions of their own, such as the Augsburg Confession of 1530 and the Gallic Confession of 1559."
 instituionalized_arminianism_desc: "$arminianism_desc$ This religious movement is now institutionalized within our state.\n\nArminianism was one of the first structured Protestant responses to Calvinist predestination. Its followers, the Remonstrants, were condemned at the Synod of Dort in 1618–19, and Arminians across Holland were imprisoned, banished or sworn to silence.\n\nAbout twelve years later Holland officially granted the movement protection as a religion, though hostility with the Calvinists continued. Some early Remonstrants, such as Philipp van Limborch, moved towards rationalism."
 instituionalized_gomarism_desc: "$gomarism_desc$ This religious movement is now institutionalized within our state.\n\nThe strict Calvinism of Franciscus Gomarus won state backing in the Dutch Republic. Prince Maurice of Nassau, siding with the Counter-Remonstrants, systematically removed Arminian magistrates from office and called a national synod at Dordrecht.\n\nThe Synod of Dort of 1618–19 was open mainly to Dutch Calvinists, with 28 delegates from foreign Reformed churches; 13 Remonstrants were barred from voting. It condemned Arminius and his followers as heretics, and its Canons answered the Arminian doctrines point by point."
 justified_conflicts_desc: "The new Church of the country is threatened by heathens and heretics alike. In a war of self-preservation, the Church will justify our conflicts with the Bible.\n\nLutheran theologians held that war could never be holy. In Whether Soldiers, Too, Can Be Saved (1526), Martin Luther held that soldiering is a legitimate calling.\n\nIn On War Against the Turk (1529), he dropped the view that the Turks were God's scourge and urged Charles V and the Germans to resist them, but only in a defensive, secular war, never a crusade. In 1531 Lutheran princes formed the Schmalkaldic League against Charles V."
 mithraic_mysteries_aspect_desc: "The initiates in the Mithraic mysteries who call themselves Syndexioi enjoyed a great deal of popularity in Rome and the Western Roman Empire during the height of the Empire. Their rituals, gatherings, and feasts took place in secret underground temples, but we can bring them back to the light, and revive their traditions for the benefit of our people.\n\nThe Mithraic mysteries, a Roman mystery cult of the god Mithras, were popular in the imperial army from the first to the fourth century. Initiates called themselves syndexioi, 'united by the handshake', and shared communal meals.\n\nThe central image of their temples showed Mithras slaying a bull. Centred on Rome, the cult reached Britain and Dacia. Christians persecuted it in the fourth century, and it was suppressed within the Empire by that century's end."
 modalism_desc: "We believe that God is absolutely one, and the trinitarian concepts like the Father, the Son, and the Holy Spirit are merely different modes in which God manifests Himself.\n\nModalism's main teachers in the late second and third centuries were Noetus, Praxeas and Sabellius, whose name gave it the label Sabellianism. Church leaders condemned the doctrine, and the Nicene settlement of the fourth century affirmed the three persons as distinct."
 monasticism_desc: "The pleasures of fine food and drink only serve to distract us from service to the divine. Isolating ourselves in remote monasteries is the best way to avoid these temptations.\n\nChristian monasticism began in the Egyptian desert in the third century with hermits such as Anthony, and Pachomius organized the first communities there. Egypt's monasteries remained central to the Coptic church.\n\nIn the West the Rule of Benedict became the model. Protestant reformers rejected monastic vows, and between 1536 and 1541 Henry VIII dissolved every monastery in England, Wales and Ireland."
 monism_aspect_desc: "The philosophers of our revival hold that all existence flows from The One — a single transcendent principle from which all gods and all things emanate. The traditional pantheon becomes allegory; the gods are aspects of The One. Omens lose their particular force, but faith in The One suffuses every act of governance.\n\nNeoplatonism, founded by Plotinus (c. 205–271), flourished in the academies of Alexandria and Athens until the sixth century. In the fifteenth century Gemistos Plethon of Mystras drew on it in a pagan revival.\n\nHis Nomoi rejected Christianity for the worship of the Hellenic gods under Zeus, whom he saw as universal principles and planetary powers. After his death the work reached Patriarch Gennadius II, who burned it in 1460."
 mos_maiorum_aspect_desc: "The unwritten code that ruled the lives of Romans from antiquity to the height of the Empire, the 'Way of the Ancestors.' This set of traditions and practices has defined what it means to be a Roman and how to behave both inside the household and in public.\n\nMos maiorum complemented written law as the source of Roman social norms. It governed the household, whose head held great authority yet was expected to use it with moderation, and the bonds of patron and client.\n\nIts virtues included gravitas, shown by Mucius Scaevola, who held his hand in a fire before the Etruscan king Lars Porsenna. Religion belonged to it too: correct rites preserved the peace of the gods."
 name_change_desc: "The power of names is well known by our communities. Our faith leaders often change their names after the names of followers of Saint Paul, as common folks change the name of their settlements to those of places where our patron Saint dwelled.\n\nConstantine of Mananalis founded the Paulician sect at Kibossa about 660 and called himself Silvanus. The officer Simeon, sent to carry out his execution, joined the sect instead and became Titus; he was burned in 690."
 olympiad_aspect_desc: "The Olympic Games are a celebration of the gods and a demonstration of our country's strength and unity. Participation in the games is a civic duty that brings honor to our athletes.\n\nThe Olympic Games were held at Olympia in honour of Zeus, traditionally from 776 BC and repeated every four years. City-states sent their champions, and an Olympic truce let athletes and pilgrims travel in safety; victors won olive wreaths.\n\nAlliances were announced there, and priests sacrificed for victory in war. The last recorded games were held in AD 393, under Theodosius I."
 organized_through_bishops_desc: "Instead of discarding the appointment of bishops entirely, they will serve the Church as the administrators of larger areas.\n\nThe Church of England retained its episcopate after Henry VIII's break with Rome in 1534, and its bishops were appointed by the crown. The Church of Sweden also kept the historic episcopate and claims apostolic succession, retaining priests, vestments and the Mass through its Reformation."
 pacifism_desc: "Blessed are the peacemakers, for they shall be called the children of God.\n\nIn Bohemia the layman Petr Chelčický taught from about 1420 that violence must not be used in religious matters, that even sinners must not be killed, and that Christians should refuse military service. Most Hussites rejected his views, but his writings helped to found the Unity of the Brethren, established in 1457."
 parish_registers_desc: "Details of baptisms, marriages, and burials will from now on be documented in a parish register. Each parish priest will keep a book where they will enter these events and keep it in a sure coffer with two locks.\n\nBefore the sixteenth century only a few priests and religious houses kept informal parish records. In England the system began on 5 September 1538, when Thomas Cromwell, as Henry VIII's Vicar General, ordered every parish to keep a register. The Catholic Council of Trent required registers of baptisms and marriages in 1563."
 participation_women_desc: "While women do participate as equals in our communities, we will adopt a general rule everywhere so that they are treated as men are.\n\nAmong the Cathars the consolamentum was open to women as well as men. Women could therefore become Perfects and teach.\n\nIn 1204 Esclarmonde of Foix, sister of Count Raymond-Roger, received the rite at Fanjeaux from the Cathar bishop Guilhabert de Castres. Three other noblewomen, Aude de Fanjeaux, Fays de Durfort and Raymonde of Saint-Germain, received it with her, in her brother's presence."
 paulician_canon_desc: "Our people reject the Old Testament and its Prophets, as they reject the inclusion of the epistles of Saint Peter. Only the words of Saint Paul are appropriate.\n\nByzantine writers reported that the Paulicians accepted the four Gospels, above all Luke's, fourteen epistles of Paul, those of John, James and Jude, and a letter to the Laodiceans they claimed to hold. Of Peter's epistles they rejected the First.\n\nThe Key of Truth, a text thought to be Paulician and copied in the eighteenth century, accepts the Old Testament. Scholars debate these reports."
 pescatarianism_desc: "Animals are carriers of reincarnated souls, and because of that we cannot eat them. Fishes, beings spontaneously generated, cannot be considered animals and can be eaten.\n\nThe Cathar Perfect avoided cheese, eggs, milk and meat, which they counted as by-products of sexual reproduction that would otherwise perpetuate the cycle of rebirth in the material world. The sect's diet was therefore described as pescatarian."
 pietism_desc: "Pietism focuses on the individual piety of every believer and emphasizes the inner transformation that leads to a devout Christian life.\n\nPietism took shape within German Lutheranism when Philipp Spener began holding Bible meetings in his Frankfurt house about 1670. His Pia Desideria of 1675 urged small study groups within the church, a larger role for the laity and a faith shown in conduct.\n\nAugust Hermann Francke founded the Halle orphanage in 1695, making Halle the movement's centre. His pupil Count Zinzendorf revived the Moravian Church in 1727."
 prima_scriptura_desc: "While the Holy Scripture has to be considered the central source of salvation, it can not be considered the only source of divine revelation.\n\nPrima scriptura, Latin for 'scripture first', is the historic Anglican position, unlike sola scriptura. Tradition and reason help to interpret the Bible, which remains the highest authority.\n\nArticle VI of the Thirty-nine Articles of 1571 declares Scripture sufficient for salvation. Richard Hooker answered the Puritans with a 'three-legged stool' of scripture, tradition and reason, later developed by Methodists into a quadrilateral."
 punishment_by_stoning_desc: "Stoning is a common practice to punish religious dissidents among our communities that stand out from our neighbors. This is most likely an inheritance from our Anatolian origins.\n\nStoning, the penalty the Old Testament prescribes for blasphemy and idolatry, was also used to punish religious dissent in the Christian East. The Paulician tradition remembered it in the fate of its founder, Constantine-Silvanus of Mananalis.\n\nImperial authorities arrested him for heresy and stoned him to death about 687. Simeon, the court official who carried out the sentence, was himself converted, took the name Titus and became Constantine's successor."
 punishment_of_sin_desc: "All who sin must be punished equally, no matter wealth or rank. Even the nobility are not above the laws of God.\n\nPunishment of Sin was the fourth of the Four Articles of Prague, the Hussite programme agreed in July 1420 by the moderate Praguers and the radical Taborites. It required that mortal sins, especially public ones, be checked and put right in every estate by those responsible.\n\nThe diet at Čáslav made the articles law in 1421. They were never fully accepted, however: at Basel in 1436 only the lay chalice was recognised."
 rejection_of_sacraments_desc: "Our doctrine rejects most Christian sacraments as they are mostly physical and are of no importance. The spiritual part is the only one that matters, to make us closer to God.\n\nThe Cathars kept a single sacrament, the consolamentum, a baptism in the Holy Spirit that gave absolution and the power to preach. Their opponents reported that they dismissed the other sacraments of the Church. The Bogomils likewise rejected the church hierarchy. They did not build churches, since the body itself was held to be the temple."
 ritual_purification_desc: "Both the soul and the body of the faithful must be clean and free of impurities if they are to get closer to God.\n\nRitual purity marks the Miaphysite churches. Coptic Christians wash their hands and face and take off their shoes before praying the seven daily hours of the Agpeya, and keep days of ritual purification.\n\nIn Ethiopia, where Old Testament practice weighs heavily, believers wash their hands before prayer and after meals much as Jews do. Women may not enter the church during menstruation, and the unclean stand by the church door and pray from outside during the liturgy."
 samothracian_mysteries_aspect_desc: "On the island of Samothrace, a mystery cult thrived during the height of Hellenism; it famously accepted anybody who wanted to join, no matter their social class. It is said that many mythological heroes, like Heracles, Jason, and Orpheus, were initiated at Samothrace. We can collect and reconstruct these mysteries from the remains and ruins, and bring this cult back to its former glory.\n\nThe Mysteries of the Great Gods were celebrated at a sanctuary on the island of Samothrace. Unlike Eleusis, initiation had no bar of age, sex, status or nationality: men and women, Greeks and foreigners, free and enslaved could all take part.\n\nAlexander's successors vied to endow the site. The cult faded when the temples were closed during the late Roman persecution of pagans."
 sola_fide_desc: "No good deed can satisfy God. We are pardoned by the divine grace alone, which God has granted through His only Son, Jesus Christ.\n\nSola fide, Latin for 'faith alone', holds that good works are the evidence of faith, not its price. Martin Luther made it the centre of the Reformation after he attacked the sale of indulgences in 1517, and Lutheran and Reformed churches adopted it. The Council of Trent rejected it in its decree on justification of 1547."
 sola_scriptura_desc: "The Bible, the word of God delivered unto man, is the sole authority for Christian doctrine. All religious practices that cannot be supported by Biblical reference are to be denounced as heresy.\n\nSola scriptura, Latin for 'by scripture alone', did not mean that Luther and Calvin discarded church tradition entirely; they ranked it beneath scripture. At the Diet of Worms in 1521 Luther refused to recant unless shown his error from scripture and plain reason.\n\nThe principle became the formal foundation of the Lutheran and Reformed churches. It was also a mark of the Hussites, who held the Bible above church tradition."
 soli_deo_gloria_desc: "All human achievements can only be created with the the praise of God as their dedication.\n\nSoli Deo gloria, Latin for 'glory to God alone', directs praise to God rather than to the maker of an achievement. It came to be counted among the five solae summarizing the Reformers' beliefs.\n\nJohann Sebastian Bach (1685—1750) wrote the initials S. D. G. at the end of all his church compositions. George Frideric Handel sometimes used the dedication, as in his Te Deum."
 specialized_canon_desc: "Books inspired by God are all deserving to be revered and studied, even those of less spiritual quality that are outright rejected by other confessions.\n\nThe Miaphysite churches never settled on a single canon of scripture. The Ethiopian Orthodox Tewahedo Church has the broadest, an 81-book canon that includes the Book of Enoch, Jubilees and the three books of Meqabyan.\n\nThe Book of Enoch survives complete only in Ge'ez. The church's New Testament adds eight books drawn from church orders, among them the four books of Sinodos and the Didascalia."
 the_perfects_desc: "Those among us that are specially commited to God and the virtues all human should pursue are called Perfects. These men and women receive #italic Consolamentum#! for their devotion and become Perfects. Contrary to regular folks, Perfects receive #italic Consolamentum#! twice in their lifes: when they are elevated to their new role and before dying.\n\nThe Perfects, or bons hommes, were the Cathar elite, admitted to the consolamentum, the movement's one sacrament, only after a period of probation. They gave up property, sex, oaths and meat, and travelled as preachers.\n\nOrdinary believers often put off the rite until they were dying. The Inquisition made the Perfects its chief quarry in Languedoc after the Albigensian Crusade."
 translated_bibles_desc: "Translating Bibles to a language the people of our country speak gives them the best pathway to God in a way that speaks to their minds and hearts.\n\nThe Wycliffe Bible of 1382 was the first complete English translation, and the Czech Bible of Prague was printed in 1488. Martin Luther's German New Testament appeared in 1522 and William Tyndale's English one in 1526. The King James Bible followed in 1611."
 twelve_emissaries_desc: "Inspired by the organization of some communities, we will elect among our elders and perfect ones twelve wise men to act as a supreme council, without creating a true hierarchy.\n\nThe Bogomils had no priesthood in the Orthodox sense. Each community was said to have its own twelve 'apostles', echoing the twelve disciples of Christ, and ordination was conferred by the congregation rather than by a bishop. Women could be raised to the rank of 'elect'.\n\nThe model fitted a movement that rejected church hierarchy and spread by wandering missionaries. These missionaries healed the sick and cast out evil spirits."
 usury_allowed_desc: "Monetary loans with interest that enrich the lender is now allowed and no longer considered sinful.\n\nMedieval Catholic doctrine treated lending at interest as sinful usury, and the Third Lateran Council of 1179 condemned it. John Calvin allowed moderate interest, stating his view in a letter of 1545 to a friend, Claude de Sachins. In the same year Henry VIII's Parliament made interest up to ten per cent legal in England."
 war_sermons_desc: "In times of conflicts, the faith preserves the hope of our people. The Church of our realm will preach from the Holy Book to keep the morale of the population up even during the darkest hours.\n\nIn the Hussite Wars of the 1420s the armies sang the hymn 'Ye Who Are Warriors of God', led by a priest. It is said to have frightened a crusading army into flight.\n\nIn England the open-air pulpit at Paul's Cross was the most important public pulpit of Tudor times. It carried the crown's message to the people, among them the thanksgiving after the Armada in 1588."
 worship_agwu_nsi_god_desc: "$worship_desc1$ [ShowGodName('agwu_nsi_god')] $worship_desc2$\n\nAgwu Nsi is the Igbo arusi, or spirit, of divination. His sphere is the craft of the diviners, the dibia, who in Igbo religion learn the demands of the spirits through afa divination."
 worship_ak_ana_god_desc: "$worship_desc1$ [ShowGodName('ak_ana_god')] $worship_desc2$\n\nAk Ana, the Holy Mother, was a Turkic goddess of water, who in the Altai creation myth urges Kayra to create the world. The fertility and productivity of the land were held to depend on her."
 worship_aki_pen_god_desc: "$worship_desc1$ [ShowGodName('aki_pen_god')] $worship_desc2$\n\nAki Pen is the village guardian of the Gonds, one of the village deities who receive far more fervent devotion than the high god Baradeo. Before any festival he is worshipped together with the village mother goddess, the anwal."
 worship_akuj_god_desc: "$worship_desc1$ [ShowGodName('akuj_god')] $worship_desc2$\n\nAmong the Turkana, semi-nomadic herders of the Lake Turkana basin, Akuj is the single Supreme Being. He created the world and grants water, food, livestock and children.\n\nWorship is mediated by the diviners, the ngimurok. Turkana tradition credits them, together with zebu cattle, for the wealth and power that let the Turkana defeat their Ateker rivals and, by the 1600s, occupy the whole Turkana basin."
 worship_alwet_god_desc: "$worship_desc1$ [ShowGodName('alwet_god')] $worship_desc2$\n\nAlwet is counted among the offspring of the Dinka sky god Nhialic and is called the goddess of rain. The Dinka ask for rain in prayer along with a good harvest."
 worship_amadioha_god_desc: "$worship_desc1$ [ShowGodName('amadioha_god')] $worship_desc2$\n\nAmadioha, ‘man of the people’, is the Igbo god of thunder and lightning, among the most popular Igbo deities. He does justice for the oppressed by striking their oppressors and their property, and is said to embody the collective will of the people.\n\nHis colour is red and his symbol a white ram. His main shrine is at Ozuzu in Etche, from which his worship is said to have spread through Igboland."
 worship_anansi_god_desc: "$worship_desc1$ [ShowGodName('anansi_god')] $worship_desc2$\n\nAnansi, ‘spider’, is the trickster of Akan religion and folklore, shown as a spider or a man with spider-like features and tied to stories, wisdom and cunning. In some tales he is a son of Asase Ya.\n\nIn one tale he flies on bird feathers gathered from every bird above the sky god Nyame’s village and learns the name of Nyame’s secret yam, becoming Nyame’s messenger. His tales travelled with the slave trade to Jamaica and Suriname."
 worship_andriamahilala_god_desc: "$worship_desc1$ [ShowGodName('andriamahilala_god')] $worship_desc2$\n\nAndriamahilala is the first woman of Malagasy myth, linked with the moon. She chose to die as the moon does, and be reborn each month."
 worship_andriambahomanana_god_desc: "$worship_desc1$ [ShowGodName('andriambahomanana_god')] $worship_desc2$\n\nAndriambahomanana is the first man of Malagasy myth. He chose to die like the banana plant, which puts forth new shoots as it withers."
 worship_andrianerinerina_god_desc: "$worship_desc1$ [ShowGodName('andrianerinerina_god')] $worship_desc2$\n\nIn one of several Merina origin myths, Andrianerinerina is the ancestor of the kings of Imerina. He is a son of the sky god Zanahary who came down to live among the island's first inhabitants."
 worship_anyame_god_desc: "$worship_desc1$ [ShowGodName('anyame_god')] $worship_desc2$\n\nNyame, also called Onyankopɔn, is the supreme sky god of the Akan of Ghana. His name is glossed as ‘the one who knows and sees everything’.\n\nOne account joins Nyame, Nyankopɔn and the creator Odomankoma in a single trinity. Akan sayings hold that Odomankoma made the universe, life and death, and that Death then killed him; Nyame is also said to have fathered Esum, Osrane and Owia, the Darkness, the Moon and the Sun."
 worship_asase_ya_god_desc: "$worship_desc1$ [ShowGodName('asase_ya_god')] $worship_desc2$\n\nAsase Ya, ‘Earth born on Thursday’, is the Akan earth goddess, wife of the sky god Nyankopɔn and mother of Bea and Tano. The Fante call her Asase Afua.\n\nShe is pictured both as an old woman, mother of the dead, consulted by divination on community matters, and as a young woman of fertility and farming. She has no temples; sacrifices are made to her in the fields of the Asante and other Akan."
 worship_asis_god_desc: "$worship_desc1$ [ShowGodName('asis_god')] $worship_desc2$\n\nThe Kalenjin built no temples for Asis, believing that buildings would limit the power of the sun god. Each tribe set aside a hilltop as its place of sacrifice, called a kapkoros, where a priest known as a tisik led the worship, and every household kept a prayer tree or altar east of its door."
 worship_ayum_god_desc: "$worship_desc1$ [ShowGodName('ayum_god')] $worship_desc2$\n\nAyum is counted among the offspring of the Dinka sky god Nhialic and is described as the force that keeps rain from falling. She therefore appears in prayers for mild weather rather than as a god of a clan."
 worship_bai_baianai_god_desc: "$worship_desc1$ [ShowGodName('bai_baianai_god')] $worship_desc2$\n\nBai Baianai was the Yakut spirit of the forest and its animals and the patron of hunters. He was pictured as a cheerful, noisy old man rich in furs.\n\nHunters made sacrifices to him before setting out, after a large catch and after long bad luck, offering kumis, fried cakes and butter. They also lit fires and prayed that the hunt would be fruitful and free of accidents."
 worship_baradeo_god_desc: "$worship_desc1$ [ShowGodName('baradeo_god')] $worship_desc2$\n\nIn Gond folk tradition Baradeo, also called Bhagavan, Kupar Lingo, Badadeo or Persa Pen, is the high god who oversees the lesser gods, the clan and village deities, and the ancestors. He is respected but not fervently worshipped; that devotion goes to clan and village deities, ancestors and totems.\n\nEach Gond clan has its own persa pen, ‘great god’. It is tended by a clan priest and worshipped with sacrifices."
 worship_bathoubwrai_god_desc: "$worship_desc1$ [ShowGodName('bathoubwrai_god')] $worship_desc2$\n\nBathoubwrai, 'the Elder', is the supreme and unseen god of the Boro, said to have created the five principles of air, fire, earth, water and ether. Traditionally he is worshipped through the sijou shrub planted in the courtyard or on common land, and at the household altar, where worshippers face east and turn the lamp five times.\n\nThe Kherai festival is the greatest of the Boro. It is held to appease him together with his daughter Mainao."
 worship_bura_bagh_raja_god_desc: "$worship_desc1$ [ShowGodName('bura_bagh_raja_god')] $worship_desc2$\n\nBura Bagh Raja is one of the four prominent household gods of the Boro of Assam. Sidney Endle lists him together with Bathoubwrai, Mainao and Song Bwrai."
 worship_chaac_god_desc: "$worship_desc1$ [ShowGodName('tlaloc_god')] $worship_desc2$\n\nChaac was the Maya god of rain and thunder, who struck the clouds with a lightning axe. Four Chaacs stood at the cardinal points, each with its own colour, and Chac Xib Chaac, the Chaac of the east, was also said to be a title of a king of Chichen Itza.\n\nIn the Yucatec Ch'a Cháak ceremony, four boys chanted as frogs at a banquet for the rain gods. In the sixteenth century rain was also sought at the cenotes."
 worship_chinchaycamac_desc: "$worship_desc1$ [ShowGodName('uscovilca_god')] $worship_desc2$\n\nChinchaycamac was the chief god of the Chincha, the seafaring and trading people of the Chincha Valley on the coast of Peru. His oracle, probably near the great adobe pyramids of La Centinela, was rich and prominent, receiving offerings from the Chincha and from others.\n\nThe Inca under Pachacuti first approached the Chincha peacefully. Tupac Inca Yupanqui annexed their kingdom, though its lords kept much of their autonomy."
 worship_coatlicue_god_desc: "$worship_desc1$ [ShowGodName('coatlicue_god')] $worship_desc2$\n\nCoatlicue, ‘skirt of snakes’, also called Tēteoh īnnān, ‘mother of the gods’, was the Aztec goddess who gave birth to the moon, the stars and Huitzilopochtli. Toci, ‘our grandmother’, and Cihuacoatl, patron of women who died in childbirth, were seen as aspects of her.\n\nIn one version of the myth of the present sun, women including Coatlicue joined the gods who sacrificed themselves at Teotihuacan. The Aztecs were said to have worshipped their skirts, which came back to life."
 worship_creator_god_desc: "$worship_desc1$ the [ShowGodName('creator_god')] $worship_desc2$\n\nMany peoples held that one creator made the world and everything in it. For the Igbo this was Chukwu, source of all things, to whom every lesser spirit was an emanation or servant. The Akan knew Odomankoma, 'the only one who gives the universe', and the Malagasy Zanahary, who made humanity together with the earth god Ratovantany."
 worship_death_god_desc: "$worship_desc1$ the [ShowGodName('death_god')] $worship_desc2$\n\nMany religions gave death a god of its own, who either took life or ruled the afterlife. The Aztecs worshipped Mictlantecuhtli, king of Mictlan, the lowest part of the underworld, and set two clay statues of him at the House of Eagles north of the Great Temple of Tenochtitlan.\n\nThe Akan of Ghana knew Owuo, created, so the tale goes, to kill humans. In the end he killed even the creator Odomankoma."
 worship_dharti_ayo_god_desc: "$worship_desc1$ [ShowGodName('dharti_ayo_god')] $worship_desc2$\n\nDharti Ayo, also called Chalapachho Devi, is the mother goddess of the Sarna faith, identified with the earth or nature. Her worshippers are the Santal, Oraon, Ho and Munda peoples of the Chota Nagpur Plateau."
 worship_donyi_god_desc: "$worship_desc1$ [ShowGodName('donyi_god')] $worship_desc2$\n\nDonyi is the Sun, addressed by the Tani peoples of Arunachal as Ane Donyi, 'Mother Sun'. The Minyong and Padam Adi told that she and the Moon were the two eyes of the creator Sedi, through which he keeps watch over the world after withdrawing from it.\n\nTani speech calls on her as a witness. A man falsely accused cries out 'Donyi-e!', trusting the Sun to reward the righteous and punish liars."
 worship_doying_bote_god_desc: "$worship_desc1$ [ShowGodName('doying_bote_god')] $worship_desc2$\n\nDoying Bote is a god of the Tani peoples of Arunachal Pradesh. He is named with Donyi, Polo and Kine Nane among the chief gods of nature who are said to watch over the earth and humanity."
 worship_du_chie_god_desc: "$worship_desc1$ [ShowGodName('du_chie_god')] $worship_desc2$\n\nDu Chie is a Dinka creator god, sometimes placed before and sometimes beside Nhialic. The Dinka address Nhialic first in prayer."
 worship_dzahui_god_desc: "$worship_desc1$ [ShowGodName('tlaloc_god')] $worship_desc2$\n\nDzahui, whose name is the Mixtec word for rain, was the rain god and, before the Spanish conquest, the patron deity of the Mixtecs, who called themselves the people of the rain. Codices show him with the goggle mask and fangs of the central Mexican Tláloc.\n\nHis chief cult centre was Achiutla, where his sacred bundle was worshipped. In times of drought, disease and harvest, children were sacrificed to him on hilltops."
 worship_earth_god_desc: "$worship_desc1$ the [ShowGodName('earth_god')] $worship_desc2$\n\nEarth was most often worshipped as a goddess. The Akan raised no temples to Asase Yaa but made offerings to her in their farm fields, and in Inca belief Mama Pacha was the goddess of the earth.\n\nThe Aztec earth deity Tlaltecuhtli was the god whose body created the world, and the Malagasy earth god Ratovantany shaped humans from soil and took back their bodies at death."
 worship_egbesu_god_desc: "$worship_desc1$ [ShowGodName('egbesu_god')] $worship_desc2$\n\nEgbesu is the deity of justice of the Ijaw people of the Niger Delta, and also the spiritual force by which evil is fought. The force may be used only in defence or to correct an injustice, and only by those in harmony with the universe. The leopard, panther and lion are the symbols of this divine power."
 worship_erlik_god_desc: "$worship_desc1$ [ShowGodName('erlik_god')] $worship_desc2$\n\nErlik was the lord of the underworld in Turkic and Altai belief, who sent sickness and death to humankind through his spirits. Traditionally people feared him and, especially among the Altai, offered animal sacrifices when illness struck; those who did not were said to have their dead taken as his slaves.\n\nShamans who venerated him were called black shamans, and their practice was generally frowned upon, since they bargained with demonic spirits."
 worship_fertility_god_desc: "$worship_desc1$ the [ShowGodName('fertility_god')] $worship_desc2$\n\nFertility deities watched over crops and childbirth alike, and their worship was often tied to the earth. The Akan prayed to the goddess Asase Afua for fertility, love and farming, and to Asase Yaa for procreation and peace, with sacrifices in return for favour.\n\nThe Igbo earth goddess Ala was a goddess of fertility and creativity, and the Aztec rain god Tlaloc was worshipped for the fertility of the land."
 worship_fire_god_desc: "$worship_desc1$ the [ShowGodName('fire_god')] $worship_desc2$\n\nThe hearth fire was a god in the Ainu home. They prayed to the fire goddess Kamuy Fuchi, their most important female deity, in times of sickness, saw her hearth as the gateway between the human world and the world of the gods, and believed that the soul of the dead passed through her hearth on its way to the afterlife.\n\nThe Yoruba made Shango the orisha of fire and thunder, a deified third king of Oyo."
 worship_freya_god_desc: "$worship_desc1$ [ShowGodName('freya_god')] $worship_desc2$\n\nFreyja, 'the Lady', was a Vanir goddess of love, fertility, gold and magic, who also took half of those slain in battle to her hall in Fólkvangr. Snorri calls her the easiest of the gods to pray to, above all in matters of love.\n\nIn the poem Hyndluljóð her devotee Óttar builds her a stone altar and often sacrifices to it, and she helps him learn his ancestry. The honorific fruvor, used of noble ladies, comes from her name."
 worship_freyr_god_desc: "$worship_desc1$ [ShowGodName('freyr_god')] $worship_desc2$\n\nFreyr, 'Lord', was a Vanir god of kingship, peace, fertility and good harvests, regarded as an ancestor of the Swedish royal house. Adam of Bremen describes his phallic image at Uppsala, where sacrifices were made to him at weddings, and says his statue at Skara was destroyed by Bishop Egino.\n\nHe owned the boar Gullinbursti and the ship Skíðblaðnir. The skald Egill Skallagrímsson called on Freyr and Njörðr to drive Eric Bloodaxe out of Norway."
 worship_haunu_god_desc: "$worship_desc1$ [ShowGodName('haunu_god')] $worship_desc2$\n\nǃHãunu is a lightning figure in the mythology of the ǀXam, a San people of southern Africa, and the rival of ǂKágára. ǀXam tales tell of their fight in the east."
 worship_huehueteotl_god_desc: "$worship_desc1$ [ShowGodName('xiuhtecuhtli_god')] $worship_desc2$\n\nHuehuetéotl, the Old God, was one of the oldest Mesoamerican deities, a god of fire shown as a bearded, toothless old man carrying a great brazier on his back. His effigies have been found at Cuicuilco and Monte Albán, at Teotihuacan, and as far away as the Guatemalan highlands.\n\nIn Aztec practice the Florentine Codex treats him as another name of Xiuhtecuhtli, and hearts torn from sacrificial victims were burned on coals to win back his favour."
 worship_huitzilopochtli_god_desc: "$worship_desc1$ [ShowGodName('huitzilopochtli_god')] $worship_desc2$\n\nHuitzilopochtli was the solar and war god and the patron god of the Mexica and their capital Tenochtitlan. According to the Aubin Codex, he ordered them to leave Aztlán and guided their migration as the Mexica. Once minor, he was raised by Tlacaelel's reform to rank with Quetzalcoatl, Tlaloc and Tezcatlipoca.\n\nThe Mexica believed the sun needed blood to survive each 52-year cycle and offered him human hearts. The Templo Mayor, begun in 1325, fell to the Spaniards in 1521."
 worship_hunhunahpu_god_desc: "$worship_desc1$ [ShowGodName('hunhunahpu_god')] $worship_desc2$\n\nHun Hunahpu, ‘One Hunahpu’, is a figure of Maya mythology known from the Popol Vuh, the father of the Hero Twins Hunahpu and Xbalanque. Some scholars hold that the Classic Maya saw him reborn as the maize god."
 worship_hunntuattatteen_god_desc: "$worship_desc1$ [ShowGodName('hunntuattatteen_god')] $worship_desc2$\n\nHunntuattatteen is the wife of the San creator Kaggen, shown as a Cape hyrax and called the mother of bees."
 worship_huracan_god_desc: "$worship_desc1$ [ShowGodName('huracan_god')] $worship_desc2$\n\nHuracán, ‘One-Leg’, also called Heart of Sky, is a K'iche' Maya god of wind, storm and fire and one of the creator gods of the Popol Vuh. His name suggests a link with K'awiil, the one-legged god of lightning, and the word hurricane may derive from it."
 worship_ikenga_god_desc: "$worship_desc1$ [ShowGodName('ikenga_god')] $worship_desc2$\n\nIkenga, ‘strength of majesty’, is the horned figure that Igbo men, and women of high reputation, keep as a personal shrine. It joins a person’s Chi, or personal god, with the ancestors, the ndichie, and with the right hand, aka ikenga, the hand of power and achievement; it is activated by prayer and sacrifice.\n\nVariants exist among neighbouring peoples: the Urhobo call it Ivri and the Edo Ikegobo."
 worship_ilat_god_desc: "$worship_desc1$ [ShowGodName('ilat_god')] $worship_desc2$\n\nIlat, the Kalenjin god of thunder and rain, ranks second to the sun god Asis. The Nandi distinguished a good Ilat whose distant rumbling drives danger away from a bad one whose close thunder strikes people dead."
 worship_illapa_god_desc: "$worship_desc1$ [ShowGodName('illapa_god')] $worship_desc2$\n\nIllapa was the Andean god of lightning, thunder, rain and war, among the highest-ranking gods of the Inca. According to Sarmiento de Gamboa, he gave Pachacuti a two-headed serpent idol as a protective talisman, and Pachacuti took him as his divine brother.\n\nTemples to Illapa stood at Toqokachi in Cusco, where the church of San Blas was later built, and at Sacsayhuamán. As the empire grew, regional thunder gods such as Pariacaca and Apocatequil became local forms of him."
 worship_inti_god_desc: "$worship_desc1$ [ShowGodName('inti_god')] $worship_desc2$\n\nInti, the sun, was the national patron of the Inca state. The Sapa Inca and his family were held to descend from him, and his high priest ranked second only to the ruler.\n\nTradition credits Pachacuti with founding the Inti Raymi, the Inca New Year at the June solstice, a nine-day festival of processions, dances and animal sacrifices in Cusco. The last one attended by an Inca emperor was held in 1535, after which the Spaniards banned it."
 worship_ixchel_god_desc: "$worship_desc1$ [ShowGodName('coatlicue_god')] $worship_desc2$\n\nIxchel was the aged jaguar goddess of midwifery and medicine, known by that name in sixteenth-century Yucatán. Bishop Diego de Landa called her the goddess of making children and of medicine.\n\nIn the month of Zip, physicians and shamans celebrated her feast, Ihcil Ixchel, bringing out divination stones and medicine bundles that held little idols of her. Scholars equate her with the Aztec goddess Toci."
 worship_kagara_god_desc: "$worship_desc1$ [ShowGodName('kagara_god')] $worship_desc2$\n\nǂKágára is a lightning figure in the mythology of the ǀXam, a San people of southern Africa. In ǀXam tales he fights his counterpart ǃHãunu in the east."
 worship_kaggen_god_desc: "$worship_desc1$ [ShowGodName('kaggen_god')] $worship_desc2$\n\nKaggen, the Mantis, is the best-known figure of San belief, known mainly from the /Xam. The eland he favoured is the most common helping animal in the trance dance, by which a shaman enters the spirit world."
 worship_kamuy_huci_god_desc: "$worship_desc1$ [ShowGodName('kamuy_huci_god')] $worship_desc2$\n\nKamuy-huci is the Ainu goddess of the hearth, one of the most important kamuy and keeper of the gateway between the human and kamuy worlds. As Iresu Kamuy, ‘People’s Teacher’, she brought fire to humans.\n\nShe also judges domestic affairs, punishing those who pollute a hearth. The hearth is also the abode of the dead: the Ainu word for ancestor means ‘those who dwell in the hearth’."
 worship_kawiil_god_desc: "$worship_desc1$ [ShowGodName('xiuhtecuhtli_god')] $worship_desc2$\n\nK'awiil was the Maya god of power, creation and lightning, shown with a long snout and one leg ending in a snake. Rain gods carried him as a lightning axe, and rulers held him as a scepter.\n\nAt Palenque, rulers and nobles hold infant forms of K'awiil in the stucco reliefs of the Temple of the Inscriptions, and the infant god was one of the city's three patron deities. In sixteenth-century Yucatán he was known as Bolon Dzacab."
 worship_kayra_god_desc: "$worship_desc1$ [ShowGodName('kayra_god')] $worship_desc2$\n\nKayra Khan was the creator god of the Altai peoples, pictured in their creation myth as a white goose flying over the primordial waters. He is held to have made the lesser gods, among them Ülgen, and to rule from the seventeenth level of the universe."
 worship_khuanu_god_desc: "$worship_desc1$ [ShowGodName('khuanu_god')] $worship_desc2$\n\nKhuanu, 'mother of nature', is the wife of the supreme god Pathian in Mizo belief, a kindly goddess who blesses humans as a matriarch and is taken to embody Pathian's loving side. The Reverend Liangkhaia read her, as Khuavang or Khuanu, as the watcher and keeper of the village, khua, in the word Sakhua."
 worship_kim_un_kamuy_god_desc: "$worship_desc1$ [ShowGodName('kim_un_kamuy_god')] $worship_desc2$\n\nKim-un-kamuy, ‘god of the mountains’, also called Metotush Kamuy and Nuparikor Kamuy, is the Ainu god of bears and mountains. Bears are generally regarded as benevolent.\n\nEvery village that could afford it kept a captured bear cub for a year, then shot it with arrows in a bear ceremony. Its flesh was eaten to free its spirit to return to the heavens, where it told Kim-un-kamuy of the humans’ piety."
 worship_kine_nane_god_desc: "$worship_desc1$ [ShowGodName('kine_nane_god')] $worship_desc2$\n\nKine Nane is a goddess of the Tani peoples of Arunachal Pradesh, named with Donyi, Polo and Doying Bote among the chief gods of nature who are said to watch over the earth and humanity."
 worship_kotan_kar_kamuy_god_desc: "$worship_desc1$ [ShowGodName('kotan_kar_kamuy_god')] $worship_desc2$\n\nKotan-kar-kamuy, ‘village-making deity’, is the creator god of the Ainu. The missionary John Batchelor held that every kamuy answers to him and concluded that Ainu faith was originally monotheistic, a view Norbert Adami rejects, since he is rarely worshipped.\n\nIn one myth he tried to make fire for mankind. A poplar drill failed and became evil spirits; an elm succeeded, and its white shavings became the huntress goddess Hasinaw-uk-kamuy, its black shavings the bear Mountain God."
 worship_kukulkan_god_desc: "$worship_desc1$ [ShowGodName('quetzalcoatl_god')] $worship_desc2$\n\nK'uk'ulkan, the Plumed Serpent, was a Maya serpent god whose cult, centred on Chichen Itza, was the first Mesoamerican religion to cross the old ethnic and linguistic divisions, spreading as far as the Guatemalan Highlands and northern Belize.\n\nAfter Chichen Itza fell, Mayapan became the centre of the revived cult. At the Spanish arrival the high priest of K'uk'ulkan was the patriarch of the Xiu lineage."
 worship_legba_god_desc: "$worship_desc1$ [ShowGodName('legba_god')] $worship_desc2$\n\nLegba, in Fon Lɛgbà and in Ewe and Mina Elegba, is the Vodun spirit of the crossroads, who opens communication between people and the spirit world. Elegba may have been taken over from the Yoruba, among whom the figure is called Eshu-Elegba.\n\nHe is the first spirit consulted when a new undertaking begins and is invoked at the start of every ceremony. He is believed to speak all human languages."
 worship_lisa_god_desc: "$worship_desc1$ [ShowGodName('lisa_god')] $worship_desc2$\n\nLisa is the male half of the dual creator deity Mawu-Lisa, worshipped by the Fon of Dahomey and other Gbe-speaking peoples. His name derives from Òrìṣànlá, a name of the Yoruba creator Ọbàtálá, whose traits merged with those of Mawu.\n\nIn Dahomean myth Mawu made humankind, and Lisa was told to teach people to build civilization. The pair are parents of Oba Koso, known as Hebioso among the Fon."
 worship_mainao_god_desc: "$worship_desc1$ [ShowGodName('mainao_god')] $worship_desc2$\n\nMainao is the daughter of the supreme god Bathoubwrai and the protector of the rice fields, sometimes equated with the Hindu Lakshmi. Bathou is never worshipped without her: her altar stands on the left of his, and worshippers turn the lamp seven times before it.\n\nAmong the four kinds of Kherai festival, the Darshan Kherai, held in the first week of Kartik, is meant for her and the winter rice crop."
 worship_mama_cocha_desc: "$worship_desc1$ [ShowGodName('mama_cocha')] $worship_desc2$\n\nMama Qucha, 'Mother Sea', was the Inca goddess of the sea and fish and guardian of sailors and fishermen. She was the wife of Wiraqucha and the mother of Inti and Mamaquilla, and one of the four Elemental Mothers beside Pachamama, Mama Nina and Mama Wayra.\n\nPeople prayed to her to calm rough water and to bring good fishing; in some regions she was thought the goddess of all waters, lakes and rivers included."
 worship_mamaquilla_desc: "$worship_desc1$ [ShowGodName('mamaquilla')] $worship_desc2$\n\nMamaquilla, 'Mother Moon', was the Inca moon goddess, elder sister and wife of Inti and mother of the founders Manco Cápac and Mama Ocllo. She presided over marriage and the menstrual cycle and was seen as a defender of women.\n\nHer temple at Cusco was served by priestesses and held a silver disc covering a whole wall. She was said to weep tears of silver, and a lunar eclipse was taken to mean that an animal was attacking her."
 worship_marang_buru_god_desc: "$worship_desc1$ [ShowGodName('marang_buru_god')] $worship_desc2$\n\nMarang Buru, ‘the Great Mountain’, is the supreme deity of the Santal, Bhumij, Ho and Munda peoples of eastern India. He is regarded as the cause of all causes, which makes the tribal religion both monotheistic and pantheistic. To the Santal the deity is a hill itself.\n\nAmong the names given to the protector of the village in the Sarna faith, Marang Buru stands beside Gram Deoti and Singbonga."
 worship_mawu_god_desc: "$worship_desc1$ [ShowGodName('mawu_god')] $worship_desc2$\n\nMawu, ‘the Unsurpassable One’, is the creator goddess of Gbe-speaking peoples and West African Vodun. With her partner Lisa she forms the dual deity Mawu-Lisa, child of Nana Buluku.\n\nIn myth Mawu alone made humans from clay and set the primeval serpent Aido Hwedo beneath the earth to hold it up. She became the state deity of Dahomey, though the pair may have been borrowed from the Yoruba."
 worship_mergen_god_desc: "$worship_desc1$ [ShowGodName('mergen_god')] $worship_desc2$\n\nMergen was a Turkic deity of abundance and wisdom, a son of Kayra and brother of Ülgen, pictured as a young man with a helmet and bow riding a white horse. His name means archer."
 worship_mesoamerican_quetzalcoatl_god_desc: "$worship_desc1$ [ShowGodName('quetzalcoatl_god')] $worship_desc2$\n\nWorship of a Feathered Serpent is first documented at Teotihuacan around the first century BC or AD and spread across Mesoamerica by the Late Classic period. The pyramid temple of Cholula, built in stages from the third century BC to the ninth century AD, is traditionally said to be dedicated to Quetzalcoatl.\n\nBy the Postclassic period Cholula was the centre of his cult, and in his aspect as Ehecatl he was the god of wind."
 worship_mindiss_god_desc: "$worship_desc1$ [ShowGodName('mindiss_god')] $worship_desc2$\n\nMindiss is a female protector of the Fatick region in Serer religion. Strictly she is not a deity but a pangool, one of the ancestral spirits who intercede between the living and the supreme being Roog, though she has goddess-like attributes. She is a water pangool, yet also a blood pangool.\n\nOfferings are made in her name at the River Sine, and she is said to appear to humans in the form of a manatee."
 worship_nat_awal_god_desc: "$worship_desc1$ [ShowGodName('nat_awal_god')] $worship_desc2$\n\nAmong the Gonds, the village mother goddess, the anwal, is worshipped with the village guardian Aki Pen before any festival, in a pattern shared with other Dravidian folk traditions."
 worship_nat_awual_god_desc: "$worship_desc1$ [ShowGodName('nat_awual_god')] $worship_desc2$\n\nThe anwal is the village mother goddess of the Gonds, worshipped with the village guardian Aki Pen before any festival begins. Like him she receives the fervent devotion that Gond tradition keeps for village and clan deities rather than for the high god Baradeo."
 worship_ngai_god_desc: "$worship_desc1$ [ShowGodName('ngai_god')] $worship_desc2$\n\nThe Gikuyu of Kenya prayed and sacrificed to Ngai, addressing him as Mwene Nyaga, the Owner of Brightness, a name tied to Kirinyaga, Mount Kenya. Traditional worship faced the mountain, where the god was held to look down on the people he had given their founding couple, Gikuyu and Mumbi."
 worship_nhialic_god_desc: "$worship_desc1$ [ShowGodName('nhialic_god')] $worship_desc2$\n\nAmong the Dinka of the Nile plains, prayers are addressed first to Nhialic, the supreme god of sky and rain, and only then to clan divinities and ancestral spirits. People pray for mild weather, a good harvest, the protection of the community, the recovery of sick cattle and success in hunting, and a bull or ox is sacrificed."
 worship_niparaya_god_desc: "$worship_desc1$ [ShowGodName('niparaya_god')] $worship_desc2$\n\nNiparaya is the all-powerful master and creator of heaven and earth in the beliefs of the Pericú, an Indigenous people of the southern tip of Baja California. Fragments of their mythology were recorded in the early 1730s. His wife is Amayicoyondi, and they had three sons. One, Quaayayp, made the race of men and was later killed by them."
 worship_njord_god_desc: "$worship_desc1$ [ShowGodName('njord_god')] $worship_desc2$\n\nNjörðr was a Vanir god of the sea, ships, fishing, wind and wealth, father of Freyr and Freyja, who lived at Nóatún. Snorri writes that he should be invoked in seafaring and fishing and could grant wealth in land and goods to those who asked.\n\nHis name survives in place names such as Njarðvík in Iceland and Närtuna in Sweden. Among Norwegians he was still thanked for a good catch of fish in the eighteenth century."
 worship_nyambe_god_desc: "$worship_desc1$ [ShowGodName('nyambe_god')] $worship_desc2$\n\nMany Bantu-speaking peoples addressed a supreme sky god as Nyambe or by related names such as Nzambi, yet ritual attention fell more often on ancestors, who were thought to speak with the gods."
 worship_obatala_god_desc: "$worship_desc1$ [ShowGodName('obatala_god')] $worship_desc2$\n\nObatala, ‘King of White Cloth’, also called Oriṣanla, is the king of the orisha in Yoruba religion. Olodumare named him sculptor of humankind: he came down from Heaven on a chain and moulded the first humans from clay, and shapes each child in the womb.\n\nIn some versions Eshu tempts him into drinking palm wine and his brother Oduduwa outdoes him. Ife tradition also remembers a mortal Obatala as the city’s founder-king."
 worship_odin_god_desc: "$worship_desc1$ [ShowGodName('odin_god')] $worship_desc2$\n\nOdin was the Norse god of war, the dead and poetic wisdom, who received slain warriors at Valhöll. Tacitus says the Suebi sacrificed on fixed days, human victims included, to a god he calls Mercury, usually taken to be Odin. Adam of Bremen writes that at Uppsala offerings were made to Wodan when war threatened.\n\nA Danish gold bracteate of perhaps the fifth century reads 'He is Odin's man', and Old English royal houses traced their descent from Woden."
 worship_ogbunabali_god_desc: "$worship_desc1$ [ShowGodName('ogbunabali_god')] $worship_desc2$\n\nOgbunabali, ‘one who kills at night’, is the traditional Igbo deity of death. He is said to kill criminals and those who have broken an unspeakable taboo."
 worship_olokun_isese_god_desc: "$worship_desc1$ [ShowGodName('olokun_isese_god')] $worship_desc2$\n\nOlokun is the orisha of the ocean depths and ruler of all waters, held to be parent of Ajé, the orisha of wealth. He is worshipped in Yoruba and Edo cities of south-western Nigeria: in Ife, where the Oba Ijio is his chief priest, and at Badagry and Lagos.\n\nIn early Lagos the Oniru chief held an annual festival for Olokun to avert flooding. In Ife tradition Olokun was Oduduwa’s wife and became the sea after leaving him."
 worship_olorun_god_desc: "$worship_desc1$ [ShowGodName('olorun_god')] $worship_desc2$\n\nỌlọrun, also called Olodumare, is the supreme deity of the Yoruba, ruler of the Heavens and creator of the universe. The name contracts oní, ‘owner’, and ọ̀run, ‘the Heavens’, the abode of the spirits; Olodumare is read as ‘the All Sufficient’ or ‘owner of the pot from which the rainbow shines’.\n\nIn the Ife creation tradition Ọlọrun lets the orisha Obatala shape the first humans from clay, then breathes life into them."
 worship_ori_god_desc: "$worship_desc1$ [ShowGodName('ori_god')] $worship_desc2$\n\nOrí, literally ‘head’, is the Yoruba concept of a person’s spiritual intuition and destiny, and is often personified as an orisha in its own right. Whatever one becomes, the Yoruba hold, is as Orí destined.\n\nOrí is therefore worshipped like an orisha: when things go wrong it is consulted, and appeased to set them right. A person who has built a balanced character, iwa-pele, is said to be aligned with Orí, his or her divine self."
 worship_pachamama_desc: "$worship_desc1$ [ShowGodName('pachamama')] $worship_desc2$\n\nPachamama, the Earth Mother, was the Andean goddess of land, harvest and fertility. Her shrines were sacred rocks or the trunks of legendary trees, and priests offered her llamas, guinea pigs and miniature garments burned in fire.\n\nMyth made her the wife of Pachacamac, or in other tales the mother, and later wife, of Inti. Animal sacrifices at the Inti Raymi thanked her and asked for a good harvest. After the Spanish conquest she was identified with the Virgin Mary."
 worship_paruhang_god_desc: "$worship_desc1$ [ShowGodName('paruhang_god')] $worship_desc2$\n\nParuhang, also called Ninamma, 'Father', is the sky god of the Rai, one of the Kirati peoples of the eastern Himalaya, and the lord of flowers. As the husband of the earth goddess Sumnima he is held to be creator, preserver and sustainer of the Rai, and is sometimes equated with the Hindu Shiva.\n\nIn the silli dances of the Sakela festival, ancestors such as Paruhang and Nayuma are enacted."
 worship_pathian_god_desc: "$worship_desc1$ [ShowGodName('pathian_god')] $worship_desc2$\n\nPathian is the supreme god of the Mizo, creator of the world and all in it, who lives in heaven and was believed to be kind and to help those who sought him. The righteous receive his blessings and good fortune, and the wicked calamities and misfortune.\n\nPu Vana and the goddess Khuanu are counted among his family, but traditionally the Mizo prayed to Pathian alone and not to his other forms."
 worship_phi_earth_god_desc: "$worship_desc1$ [ShowGodName('phi_earth_god')] $worship_desc2$\n\nTai communities kept their guardian spirits close at hand, honouring them at the temple and at the town pillar, the lak mueang."
 worship_phi_fire_god_desc: "$worship_desc1$ [ShowGodName('phi_fire_god')] $worship_desc2$\n\nThe Tai peoples, in their old religion of Satsana Phi, honoured many phi, among them gods tied to the elements of heaven, earth, fire and water. Fire was one of these natural powers, to be appeased with offerings like the other spirits."
 worship_phi_heaven_god_desc: "$worship_desc1$ [ShowGodName('phi_heaven_god')] $worship_desc2$\n\nPhi Fa, or Phi Thaen, is the Tai god of rain and the sky, ruler of the heavens and creator god, prominent in the legends of Khun Borom. Thaen, ‘sky’, comes from the Chinese tian.\n\nIn the Phi Fa ritual, held for someone recovered from serious illness, a shaman invites the god. A night of dance around an altar to the khaen, a bamboo mouth organ, brings trance and calls for healing and protection."
 worship_phi_water_god_desc: "$worship_desc1$ [ShowGodName('phi_heaven_god')] $worship_desc2$\n\nIn the baci ceremony the Tai called back a person's lost khwan, the vital forces, and tied cotton strings round the wrist."
 worship_polo_god_desc: "$worship_desc1$ [ShowGodName('polo_god')] $worship_desc2$\n\nPolo is the Moon, addressed by the Tani peoples of Arunachal as Abu Polo, 'Father Moon', and always paired with Donyi, the Sun. Together they stand for the balance of day and night, heat and cool.\n\nIn sacral speech 'Donyi-Polo' also means truth, and the Tani call themselves Donyi O, Polo Ome, 'children of the Sun and the Moon', trusting the pair to punish wrongdoers."
 worship_pu_vana_god_desc: "$worship_desc1$ [ShowGodName('pu_vana_god')] $worship_desc2$\n\nPu Vana, 'God in Heaven', is a benevolent spirit of the Mizo, said to be the grandfather of the Pathian family and most likely the father of Pathian himself. He was revered as the god of nature, holding the power of thunder and lightning, and so resembles the Hindu Indra."
 worship_quetzalcoatl_god_desc: "$worship_desc1$ [ShowGodName('quetzalcoatl_god')] $worship_desc2$\n\nQuetzalcoatl, the Feathered Serpent, was an Aztec creator god linked to wind, the planet Venus, learning, crafts and merchants, and the patron god of the priesthood. The two chief priests of the Templo Mayor bore the title Quetzalcoatl Tlamacazqui.\n\nHis main cult centre was Cholula, whose Great Pyramid is traditionally held to be dedicated to him. After the Spanish conquest, writers merged him with Ce Acatl Topiltzin, a ruler of Tollan, a conflation historians still debate."
 worship_ratovantany_god_desc: "$worship_desc1$ [ShowGodName('ratovantany_god')] $worship_desc2$\n\nRatovantany is the Malagasy earth god who, with the sky god Zanahary, made the first humans and takes back their bodies at death. He does not appear to have been a prominent god of any Malagasy group."
 worship_rep_un_kamuy_god_desc: "$worship_desc1$ [ShowGodName('rep_un_kamuy_god')] $worship_desc2$\n\nRep-un-kamuy is the Ainu god of the sea, sometimes pictured as an orca and sometimes as a carefree young man with a harpoon. The sea offered fishing, whale hunting and trading voyages that the land could not.\n\nIn one myth he throws a harpooned whale ashore near a village. Told that the humans butcher it with axes, he laughs and lets them have the meat, until he sees that they cut it with ritual swords in the proper manner."
 worship_sakhua_god_desc: "$worship_desc1$ [ShowGodName('sakhua_god')] $worship_desc2$\n\nSakhua is the guardian spirit of a Mizo clan, the mark of its identity. Each clan had its own Sakhua and its own priest, the sadâwt, who made the offerings.\n\nA man who set up a house apart from his parents performed the sakung: a sadâwt chanted and sacrificed a pig over three days, after which the man stood free of his father's Sakhua and held a family religion of his own."
 worship_sakpata_god_desc: "$worship_desc1$ [ShowGodName('sakpata_god')] $worship_desc2$\n\nSakpata is the Vodun god of the earth, wellness and smallpox, worshipped by the Ewe, Fon and Adja peoples, from south-western Nigeria to the Volta region of Ghana. He can heal or inflict disease and madness, and is the Dahomean form of the Yoruba smallpox god Sopona.\n\nOral history says smallpox nearly destroyed these peoples’ ancestors at Adja Tado until a Yoruba man, Torgbui Anyi, cured them."
 worship_sky_god_desc: "$worship_desc1$ the [ShowGodName('sky_god')] $worship_desc2$\n\nMany peoples set their supreme god in the sky and honoured him as protector of all. The Akan knew Nyame as the sky god who sees and knows everything, the Malagasy knew Zanahary, the Dinka Nhialic, and the Oromo Waaqa, the creator of the world.\n\nA sky father was often paired with an earth mother: the Akan made the earth goddess Asase Yaa the wife of Nyame."
 worship_song_bwrai_god_desc: "$worship_desc1$ [ShowGodName('song_bwrai_god')] $worship_desc2$\n\nSong Bwrai, also called Song Raja, is one of the four prominent household gods of the Boro, named by Sidney Endle with Bathoubwrai, Mainao and Bura Bagh Raja. His shrine, the dham, stands inside the house, and it is chiefly women who worship him, with offerings made even during their monthly courses.\n\nThese offerings are afterwards carried out and laid at the sijou tree that represents Bathou."
 worship_sumnima_god_desc: "$worship_desc1$ [ShowGodName('sumnima_god')] $worship_desc2$\n\nSumnima, also called Hengkhamma, is the supreme goddess of the Rai, one of the Kirati peoples of the eastern Himalaya. She is Mother Earth and ancestral mother, wife of the sky god Paruhang, and the pair are the Rai's creator and sustainer deities, sometimes equated with the Hindu Shiva and Parvati.\n\nHer worship belongs to the Sakela festival, held twice a year at sowing and harvest, when the Rai thank Mother Nature and their ancestors with offerings and dance."
 worship_supay_god_desc: "$worship_desc1$ [ShowGodName('supay_god')] $worship_desc2$\n\nSupay, from the Quechua word for 'shadow', was an ambivalent spirit of the Andean underworld, a figure of night, darkness and death. The word itself was neutral: a Quechua-Spanish dictionary of 1560 by Domingo de Santo Tomás uses it for both good and bad spirits. Spanish missionaries afterwards turned Supay into the Christian Devil."
 worship_takhar_god_desc: "$worship_desc1$ [ShowGodName('takhar_god')] $worship_desc2$\n\nTakhar, or Taahkarr, is a demi-god of justice and vengeance in the traditional religion of the Serer of Senegal, the Gambia and Mauritania. He is worshipped at the foot of certain sacred trees in the forest, and the Serer priestly class evokes him and enforces the laws that his devotees must follow."
 worship_tano_god_desc: "$worship_desc1$ [ShowGodName('tano_god')] $worship_desc2$\n\nTano, properly Ta Kora, is the Akan god of war and of the Tano River, regarded as the highest of the abosom. Among the Asante he is also a god of thunder and lightning.\n\nHis titles include ‘The One Who Wins Wars’ and ‘King within the Rock’, after the rock from which the river rises. His shrine on the river, the largest, holds crowns, staffs, umbrellas and a brass pan."
 worship_tengri_god_desc: "$worship_desc1$ [ShowGodName('tengri_god')] $worship_desc2$\n\nTengri, the Eternal Blue Sky, was the patron god of the Turkic khans. The Göktürk rulers of the sixth to eighth centuries based their authority on a mandate from Tengri, bore titles such as tengrikut, from kut, the heavenly fortune he granted, and were regarded as his sons on earth.\n\nA ninth-century divination book, the Irk Bitig, calls him Türük Tängrisi, the god of the Turks. His standing waned when the Uighur khagans adopted Manichaeism in the eighth century."
 worship_tepeu_god_desc: "$worship_desc1$ [ShowGodName('tepeu_god')] $worship_desc2$\n\nTepeu, meaning ‘sovereign’, is a K'iche' Maya title attached to Q'uq'umatz, the Sovereign Plumed Serpent and one of the creator gods of the Popol Vuh. K'iche' rulers such as Tepepul also bore it."
 worship_tezcatlipoca_god_desc: "$worship_desc1$ [ShowGodName('tezcatlipoca_god')] $worship_desc2$\n\nTezcatlipoca, the Smoking Mirror, was a central Aztec god of the night sky, obsidian, conflict and divination. Bernardino de Sahagún's Florentine Codex records some 360 epithets for him, among them the lord of the near and nigh.\n\nHis chief festival was Toxcatl, held each May, in which a young man who had impersonated the god for a year was sacrificed. In May 1520 the Spaniards attacked the celebrants at Toxcatl, igniting open war."
 worship_thunder_god_desc: "$worship_desc1$ the [ShowGodName('thunder_god')] $worship_desc2$\n\nThunder gods were often gods of justice. The Yoruba of West Africa honoured Shango, who as the third Alaafin of Oyo was a warrior king, with a double-headed battle-axe as his emblem; his reign was said to have ended when lightning destroyed his palace.\n\nThe Igbo of southeastern Nigeria turned to Amadioha, the 'man of the people', who avenged the oppressed by striking down their oppressors; his white ram was his symbol, and the main shrine stands at Ozuzu."
 worship_tlaloc_god_desc: "$worship_desc1$ [ShowGodName('tlaloc_god')] $worship_desc2$\n\nTláloc was the Aztec god of rain, water and fertility, feared for his hail, thunder and lightning but honoured as a giver of life. His great rituals were held on Cerro Tláloc, the mountain where he was believed to dwell, and those who died by drowning, lightning or water-borne disease were thought to go to his paradise, Tlálocan.\n\nAt Tenochtitlan the Templo Mayor was dedicated jointly to him and Huitzilopochtli."
 worship_tor_god_desc: "$worship_desc1$ [ShowGodName('tor_god')] $worship_desc2$\n\nThor was the Norse thunder god, who wielded a hammer. In the temple at Uppsala described by Adam of Bremen he sat on the central throne between Odin and Freyr, and sacrifices were made to him in famine or plague.\n\nAbout a thousand hammer pendants have been found from Scandinavia to England and the Baltic, and runestones in Denmark and Sweden call on him to hallow the runes. 'Thor's grove' is a common place name in Denmark."
 worship_tyr_god_desc: "$worship_desc1$ [ShowGodName('tyr_god')] $worship_desc2$\n\nTýr was an ancient Germanic god of war and of the thing, the assembly of free men that made law and judged disputes. Roman writers equated him with Mars, and Frisian soldiers at Housesteads dedicated a third-century altar to Mars Thingsus.\n\nHis name gave Tuesday its name, and place names such as Tislund, 'Týr's grove', in Denmark and Tysnes in Norway point to his cult. Norse sources call him the son of the giant Hymir or of Odin."
 worship_u_blei_nong_thaw_god_desc: "$worship_desc1$ [ShowGodName('u_blei_nong_thaw_god')] $worship_desc2$\n\nU Blei Nong Thaw, the Creator God, is the supreme god of the Khasi, the hill people of Meghalaya. Khasi tradition names him U Blei Trai Kynrad, the Lord Master, who divided humankind into sixteen heavenly families, of which seven, the Hynñiewtrep, were left on earth.\n\nA ladder resting on the sacred Lum Sohpetbneng peak let people pass to heaven until they were tricked into felling a divine tree on Lum Diengiei, which closed the way for ever."
 worship_ulei_longspah_god_desc: "$worship_desc1$ [ShowGodName('ulei_longspah_god')] $worship_desc2$\n\nKhasi tradition said that the Lord Master first divided humankind into sixteen heavenly families, seven of which were left on earth."
 worship_ulei_muluk_god_desc: "$worship_desc1$ [ShowGodName('ulei_muluk_god')] $worship_desc2$\n\nKhasi tradition told of a ladder on a sacred peak that once let people pass to heaven, until they were tricked into cutting down a divine tree."
 worship_ulei_umtang_god_desc: "$worship_desc1$ [ShowGodName('ulei_umtang_god')] $worship_desc2$\n\nThe Khasis had no script of their own and handed their religion down by word of mouth."
 worship_ulgen_god_desc: "$worship_desc1$ [ShowGodName('ulgen_god')] $worship_desc2$\n\nÜlgen was the benevolent sky god of the Altai, Khakas and Shor peoples, who protected humankind against Erlik. Known chiefly from ethnography, he was traditionally honoured with animal sacrifice, above all of horses.\n\nEvery few years a shaman might offer a white horse and ride its soul up through the layers of heaven to Ülgen's golden house. Some Altai clans, such as the Soyon and the Irkit, did not honour him as the supreme god."
 worship_umay_god_desc: "$worship_desc1$ [ShowGodName('umay_god')] $worship_desc2$\n\nUmay was the Turkic goddess of mothers and children. An eighth-century inscription for the prince Kül Tigin praises his mother as being like Umay, and the khagans' wives, the katuns, were themselves counted as Umays, since their sons secured the dynasty.\n\nIn the eleventh century Mahmud al-Kashgari recorded that women who worshipped her bore sons. Traditionally Turkic women hung small cradles on strings to ask her for a child."
 worship_urpihuachac_desc: "$worship_desc1$ [ShowGodName('urpihuachac_god')] $worship_desc2$\n\nUrpihuachac was a goddess of the Chincha, the seafaring people of the Peruvian coast; the name is said to mean 'she who bears doves'. Chincha tradition spoke of an island sanctuary, Urpihuachay, as the place from which their gods had come."
 worship_viracocha_desc: "$worship_desc1$ [ShowGodName('viracocha')] $worship_desc2$\n\nWiraqucha was the creator god of the Andes before and under the Incas, who ranked his cult above even that of the sun. He was said to have made the universe, the sun, moon and stars, time and civilization, and to have ordered Tiwanaku built.\n\nImagined as a bearded man, he was the husband of the sea goddess Mama Qucha and the father of Inti. Commoners were not allowed to speak his name."
 worship_waaq_god_desc: "$worship_desc1$ [ShowGodName('waaq_god')] $worship_desc2$\n\nThe Oromo and related Cushitic peoples worshipped Waaqa as the one god, acting through ayyaana, intermediary spirits that possess chosen men and women and make them qallu priests and qallitti priestesses. These priests were expected to stay out of politics, yet could grant or withhold blessing from the Gadaa leadership.\n\nPilgrims travelled far to be anointed by the Abbaa Muudaa, the highest qallu."
 worship_war_god_desc: "$worship_desc1$ the [ShowGodName('war_god')] $worship_desc2$\n\nWarriors across the world placed their wars under a god. The Yoruba of West Africa honoured Ogun, orisha of iron, metalwork and war, whose worship spread to the Edo and Itsekiri.\n\nFor the Maori, Tumatauenga was the god of war, and every war party was dedicated to him. In Hawaii the war god Ku was worshipped as Kukailimoku, the 'Snatcher of Land', with rituals that included human sacrifice."
 worship_water_god_desc: "$worship_desc1$ the [ShowGodName('water_god')] $worship_desc2$\n\nWater had gods of its own among many peoples. The Yoruba revered Olokun, ruler of all waters and giver of wealth, health and prosperity, whose name passed into the religion of their Edo neighbours.\n\nIn Mexico the rain god Tlaloc was worshipped as a giver of life and sustenance, with mountaintop shrines and great rituals on Cerro Tlaloc, though he was also feared for hail, thunder and lightning."
 worship_wind_god_desc: "$worship_desc1$ the [ShowGodName('wind_god')] $worship_desc2$\n\nWinds were gods in many belief systems. The Aztecs worshipped Ehecatl, an aspect of Quetzalcoatl, and built his temple as a cylinder to lessen the resistance of the air.\n\nIn Maori myth Tawhirimatea, god of wind, storms and weather, took up arms when his brothers separated their parents, sky and earth, and destroyed the forests of Tane and drove Tangaroa, the sea god, into the ocean. The Yoruba orisha Oya ruled storms and strong winds."
 worship_xiuhtecuhtli_god_desc: "$worship_desc1$ [ShowGodName('xiuhtecuhtli_god')] $worship_desc2$\n\nXiuhtecuhtli, the Turquoise Lord or Lord of Fire, was the Aztec god of fire, heat and the year, whom they identified with the North Star. A sacred fire was always kept burning in his temples.\n\nAt each meal the Aztecs flung the first mouthful into the hearth in gratitude for fire. In the feast of Izcalli, boys hunted small water creatures in the swamps and offered them to the elders who guarded the fire god, receiving tamales in return."
 worship_yuma_sammang_god_desc: "$worship_desc1$ [ShowGodName('yuma_sammang_god')] $worship_desc2$\n\nYuma Sammang, 'Mother Earth' or 'Grandmother', also known as Ningwaphuma, is the great goddess of the Limbu, the Kirati people of eastern Nepal and Sikkim, who regard her as a maternal figure. In the Limbu view the supreme power Tagera Ningwaphuma takes female form on earth as Yuma Sammang and male form as Theba Sammang.\n\nTraditionally the Limbu house itself represents her, and her shrine is its central pillar, where prayers and offerings are made twice a year."
 worship_zanahary_god_desc: "$worship_desc1$ [ShowGodName('zanahary_god')] $worship_desc2$\n\nZanahary is the Malagasy creator and sky god, and the national god of the Merina of the central highlands. The souls of the dead are held to return to him."
 buddhist_desc: "Having its origins from the teachings of the Buddha, meaning 'The Awakened One' and also known by his princely name Siddhārtha Gautama or by the title #italic Śākyamuni#!, $buddhist$ expanded far and wide from its source in $india$. Influencing and getting influenced by the many countries and peoples and beliefs it spread to, many different $buddhist_ADJ$ schools emerged within it, with different approaches and interpretations on the path to liberation from Saṃsāra, the cycle of death and rebirth.\n\nBuddhism took different paths across Asia after 1337. In Burma, King Dhammazedi reformed the monastic community between 1476 and 1479 using the Sri Lankan Mahavihara tradition; Theravada also became firmly established in Ayutthaya.\n\nIn 1578 the Mongol leader Altan Khan met Sonam Gyatso and gave him the title Dalai Lama. Their alliance brought patronage to the Gelug school, which spread throughout Mongolia in the following century. In Japan, Zen remained influential under the Ashikaga and Tokugawa rulers."
 christian_desc: "Christianity, a prominent Abrahamic faith, centers on the life and teachings of Jesus Christ, emphasizing salvation through faith and adherence to biblical principles. Its diverse branches, including Catholicism, Protestantism, and Eastern Orthodoxy, wield significant influence across the globe, shaping history, politics, and culture.\n\nChristianity in western Europe underwent a major upheaval after Martin Luther published his Ninety-five Theses in 1517. The Reformation spread from Saxony, while Huldrych Zwingli and John Calvin developed reform movements in Switzerland.\n\nIn England and Scotland, Thomas Cranmer and John Knox led separate reformations. The Catholic Church responded at the Council of Trent, and the religious divisions contributed to wars across Europe. From the fifteenth to seventeenth centuries, missionaries, migration and trade carried Christianity beyond Europe."
 dharmic_desc: "$dharmic_ADJ$ religions have their origin in $india$ and all have in common the concept of 'Dharma', meaning the correct behavior and way of living according to the cosmic laws of the universe.\n\nAmong the communities of the Dharmic religions, devotional movements spread across northern and eastern India from the fifteenth century. In Bengal, Chaitanya, who lived from 1486 to 1534, inspired a tradition centered on devotion to Krishna.\n\nIn Punjab, Guru Nanak, who lived from 1469 to 1539, founded Sikhism. The Sikh scripture later included hymns by Nanak and other Sikh gurus alongside those of devotional poets such as Kabir and Namdev. The movement also influenced devotional practices among Jains."
 druze_group_desc: "The $druze_group$ group covers all the religions that fall under this umbrella.\n\nDruze communities in Mount Lebanon came under Ottoman rule after Sultan Selim I conquered Syria in 1516. The Ma'n family retained local authority, although an Ottoman expedition attacked the Druze in 1585.\n\nThe Druze emir Fakhr al-Din II expanded his power from the Shuf into other parts of the Levant. An Ottoman campaign forced him into exile in 1613, but he returned in 1618 and defeated the governor of Damascus at Anjar in 1623. He surrendered to the Ottomans in 1633 and was executed in Constantinople in 1635."
 folk_african_group_desc: "The $folk_african_group$ $common_folk_religion_group_desc$ $africa$.\n\nIn Kongo, sacred burial grounds linked ruling families to their ancestors. After Portuguese visitors arrived, King Nzinga a Nkuwu was baptized in 1491 as João I, but later abandoned Catholicism.\n\nChristianity also acquired local expressions in Kongo. The prophet Kimpa Vita, trained as a religious medium, taught that Jesus and other Christian figures came from Kongo; King Pedro IV had her burned in 1706."
 folk_argentinian_group_desc: "The $folk_argentinian_group$ $common_folk_religion_group_desc$ $name_argentina$.\n\nAmong the Mapuche of southwestern Argentina and south-central Chile, machi communicated with spirits for healing and divination, while communal ceremonies included offerings and animal sacrifice. Spanish accounts from the sixteenth century onward described these beliefs amid warfare and Catholic missionary efforts.\n\nFarther north, Jesuits established missions among the Guaraní in the early seventeenth century, gathering Indigenous people into settlements for Christian instruction. The Spanish crown expelled the Jesuits from the missions in 1767."
 folk_aridoamerica_group_desc: "The $folk_aridoamerica_group$ $common_folk_religion_group_desc$ $aridoamerica_region$.\n\nAmong the Pueblo peoples of the northern part of arid North America, religious practices were tied to rain and crops. Spanish soldiers reached Pueblo lands in 1540, and Franciscan missionaries later sought to replace local worship with Christianity.\n\nIn New Mexico, Alonso de Posada forbade Kachina dances and ordered ritual objects burned during his tenure from 1656 to 1665. Persecution of Pueblo religion helped provoke the revolt of 1680, which drove the Spanish from the province until their return in 1692."
 folk_asian_group_desc: "The $folk_asian_group$ $common_folk_religion_group_desc$ $asia$.\n\nIn Yunnan, Nakhi Dongba priests preserved ritual writings and performed ceremonies for gods and spirits of the natural world. Nakhi temples brought Dongba imagery together with Buddhist influences, while people at Baidi honoured the Shu nature spirits.\n\nOn Taiwan, Dutch rule from 1624 to 1662 brought a different encounter: missionaries taught Christianity and devised Romanized scripts for Indigenous languages. Among the Siraya, the resulting Sinkang script was still used in land contracts in the eighteenth century."
 folk_australian_group_desc: "The $folk_australian_group$ $common_folk_religion_group_desc$ $australia_region$.\n\nAboriginal ancestral beings were associated with the creation and meaning of places such as Uluru and Kata Tjuta. The Warlpiri called this complex of traditions Jukurrpa; it connected people and their ancestors to places and living things. In New South Wales, the Church Missionary Society established a mission in Wellington Valley in 1832 to convert Aboriginal people to Christianity."
 folk_brazilian_group_desc: "The $folk_brazilian_group$ $common_folk_religion_group_desc$ $brazil_region$.\n\nGuaraní communities in southern Brazil and neighbouring regions passed accounts of gods and spirits down orally, with narratives varying from place to place. In the early seventeenth century, Jesuits established missions among the Guaraní across the region where Brazil, Paraguay and Argentina meet.\n\nThe missions gathered Indigenous people into settlements for Christian instruction and offered some protection from enslavement. Raids by Brazilian slave traders led to the formation of armed Guaraní militias; in 1767 the Spanish crown expelled the Jesuits from its missions."
 folk_caribbean_group_desc: "The $folk_caribbean_group$ $common_folk_religion_group_desc$ $Caribbean$.\n\nAcross the Greater Antilles, Taíno people honoured zemis, ancestral spirits and sacred figures represented in stone, wood and other materials. Ceremonial performances called areitos combined dance, music and speech to preserve stories and mark events such as harvests and the deaths of chiefs.\n\nColumbus encountered Taíno communities in the Bahamas in 1492. Spanish conquest, forced labour and disease devastated their populations, while some ceremonial objects appear to have been hidden in caves from the newcomers."
 folk_central_american_group_desc: "The $folk_central_american_group$ $common_folk_religion_group_desc$ $central_america_region$.\n\nIn Talamanca, spanning southeastern Costa Rica and northern Panama, Bribri communities preserved spiritual practices amid resistance to Spanish rule. In 1709 the Indigenous leader Pablo Presbere led an uprising against forced removal and missionary establishments; rebels burned churches, and the Spanish captured him the following year.\n\nFarther south, the Muisca of the Colombian highlands worshipped at Lake Guatavita and at temples of the sun and moon. Spanish conquest came in 1537–1540; a public Muisca ceremony was still held at Ubaque in 1563."
 folk_european_group_desc: "The $folk_european_group$ $common_folk_religion_group_desc$ $europe$.\n\nIn Lithuania, Grand Duke Jogaila promoted Catholic baptism in 1387; his cousin Vytautas followed in Samogitia in 1413. Older Lithuanian myths nevertheless survived in stories, customs and festivals; from the late sixteenth century Jesuit missionaries also drew on popular beliefs in their work.\n\nFarther north in Sápmi, local sacred places included unusual rocks and other features of the landscape. Sámi ritual specialists known as noaidi used drums in ceremonies to mediate between their communities and the spirit world."
 folk_melanesian_group_desc: "The $folk_melanesian_group$ $common_folk_religion_group_desc$ $melanesia_area$.\n\nMelanesian oral traditions preserved distinct accounts of the origins of land and sea. On New Britain's Gazelle Peninsula, the brothers To-Kabinana and To-Karvuvu were said to have fished the land up from the sea, while a Baining story told how a concealed waterhole spread to become the ocean.\n\nIn Fiji, spiritual leaders known as bete held an important place in communities governed by chiefs and elders. The ceremonial preparation and drinking of yaqona formed part of Fijian community rites. In the early nineteenth century, European missionaries, especially Methodists, began working in Fiji."
 folk_micronesian_group_desc: "The $folk_micronesian_group$ $common_folk_religion_group_desc$ $micronesia_area$.\n\nMicronesian traditions varied from island to island. On Kosrae, stories named Sinlaka as a goddess of breadfruit and Nalik as a patron of canoe building; on Guam, Chamorro beliefs included the spirits of ancestral people known as Taotao Mona.\n\nGuam also had ritual specialists known as makhanas and healers called suruhanus. In 1668 Jesuit missionaries led by Diego Luis de San Vitores arrived on Guam to introduce Christianity, and the Catholic Church became a centre of village life."
 folk_north_american_group_desc: "The $folk_north_american_group$ $common_folk_religion_group_desc$ $north_america$.\n\nNorth American Indigenous traditions included the Algonquian concept of manitou, a spirit or spiritual power, and the Lakota understanding of Wakan Tanka, or Great Sacredness. Stories and oral histories carried beliefs and practices between generations.\n\nIn Spanish New Mexico, Franciscan missionaries sought to replace Pueblo worship with Christianity and forbade traditional ceremonies. Religious persecution helped provoke the Pueblo Revolt of 1680, which expelled the Spanish settlers from the province until their return in 1692."
 folk_papuan_group_desc: "The $folk_papuan_group$ $common_folk_religion_group_desc$ $papua_area$.\n\nIn Papuan traditions, imunu was a power understood to inhabit things, including ritual objects. Masked ceremonies gave this power a human or ancestral form."
 folk_permic_group_desc: "The $folk_permic_group$ $common_folk_religion_group_desc$ Perm.\n\nPermic traditions faced Christian missions in the lands of the Komi and Udmurt peoples. In 1376 Stephen of Perm began preaching along the Vychegda and Vym rivers; he destroyed sacred birches and became the first bishop of Perm in 1383.\n\nAmong the Udmurts, Ivan IV granted privileges to baptized families in 1557. In the mid-eighteenth century, a stronger campaign sent missionaries to build churches and schools, while sacred groves and traditional places of prayer were destroyed."
 folk_peruvian_group_desc: "The $folk_peruvian_group$ $common_folk_religion_group_desc$ Peru.\n\nAndean communities worshipped local and regional sacred beings as well as the gods of the Inca Empire. The Incas promoted the cult of the Sun while allowing local worship and incorporating some conquered peoples' deities into their religious order.\n\nAfter the Spanish conquest, the Taki Unquy movement arose around 1564 in Huamanga and spread across the Andes. Its followers rejected the imposed Christian god and called for renewed worship of the huacas; Spanish officials suppressed the movement, which declined by about 1572."
 folk_polynesian_group_desc: "The $folk_polynesian_group$ $common_folk_religion_group_desc$ $polynesia_area$.\n\nPolynesian oral traditions carried related stories across distant islands. In some island groups Tangaroa was a god of the sea and fishing, while stories of the trickster Māui were widely known.\n\nIn Hawaiʻi, the kapu system regulated food and relations between men and women. In 1819 King Kamehameha II ate with women, breaking the taboo; opponents of the change were defeated at Kuamoʻo that December. Christian missionaries arrived a few months later, hastening the decline of the old religion."
 folk_se_asian_group_desc: "The $folk_se_asian_group$ $common_folk_religion_group_desc$ $south_east_asia$.\n\nIn the Philippines, traditions within South East Asian folk religion included offerings to ancestral spirits and nature deities. Visayan ritual specialists known as babaylan acted as mediums in ceremonies for communicating with spirits.\n\nMiguel López de Legazpi's expedition reached Cebu in 1565, beginning the Spanish conquest of the Philippines. Spanish colonizers subsequently burned some Indigenous religious writings and images of deities, while missionaries sought to spread Christianity."
 folk_south_american_group_desc: "The $folk_south_american_group$ $common_folk_religion_group_desc$ $south_america$.\n\nAmong the Muisca of the Colombian highlands, South American religious traditions included worship at sacred lakes and temples. Their priests honoured the Sun god Sué at Suamox and the Moon goddess Chía at the temple in Chía; rituals also used coca, tobacco and yopo obtained through trade with peoples to the east.\n\nSpanish forces conquered the Muisca between 1537 and 1540. A public Muisca religious ceremony was held at Ubaque in 1563, decades after the conquest."
 israelite_group_desc: "The Jews, descendants of ancient Hebrews, have spread across the known world after the destruction of their homeland. Bound by faith and tradition, they contribute as merchants, scholars, and craftsmen, while maintaining a connection to their shared heritage. Dispersed yet united, they embody a resilient identity, keeping the eternal hope for Zion alive in their hearts.\n\nCommunities of the Israelite traditions faced upheaval in different lands. Spain expelled its Jews in 1492, while Jews were readmitted to England in 1655. In revolutionary France, legal restrictions on Jews were abolished in 1791.\n\nSamaritans maintained a separate tradition centered on Mount Gerizim near Nablus. Ottoman records counted communities in Nablus and Gaza in 1525–1526; by the seventeenth century, persecution and conversion had reduced their numbers. In 1624 the Samaritan high priestly line changed, and access to the mountain's summit was forbidden."
 mandean_group_desc: "The $mandean_group$ faith groups the ethnoreligious communities that follow this gnostic monotheistic religion.\n\nMandaean communities in southern Mesopotamia attracted the attention of European missionaries in the sixteenth century. Portuguese Jesuits encountered Mandaeans near the Strait of Hormuz in 1559 and called them Christians of Saint John. The name reflected their reverence for John the Baptist, although they followed their own religious tradition.\n\nIn Basra, Carmelite missionaries used the same name during the sixteenth and seventeenth centuries. Across the border in Iran, Mandaeans suffered persecution under Qajar rule in the 1780s."
 manichaean_group_desc: "$manichean_group$ refers to those faiths related to the life philosophies that emerged from the teachings of the prophet Mani.\n\nManichaeism revived in China under the Yuan dynasty after centuries of persecution. At Cao'an in Fujian, a temple originally built as a thatched hut was rebuilt in stone in 1339.\n\nThe Ming emperor Hongwu banned the religion in 1370. Its followers increasingly blended their practices with Buddhism and Daoism, and later worshippers regarded Cao'an as a Buddhist temple. In Chinese Manichaean teaching, Mani was called the Buddha of Light, while a Daoist text used by believers described him as a reincarnation of Laozi."
 muslim_desc: "Islam, a monotheistic religion founded by Prophet Muḥammad in the 7th century, espouses the belief in one God (Allāh) and follows the teachings of the $common_string_quran$. With its various denominations like Sunni and Shia, Islam has profoundly impacted societies, fostering cultural, scientific, and political advancements across continents.\n\nIslam spread along Southeast Asian trade routes, with Malacca becoming a center from which the faith traveled to other ports. Sufi orders carried it to Mindanao around 1380, while Muslim traders and missionaries reached the Cham in Vietnam.\n\nIn the west, the Ottoman conquest of Constantinople in 1453 brought the Byzantine capital under Muslim rule. In the sixteenth century, Safavid conversion policies helped establish Shia Islam across much of Iran and Azerbaijan, while the Ottomans extended their rule into Hungary."
 tonal_group_desc: "The $tonal_group$ $common_folk_religion_group_desc$ $mesoamerica_region$.\n\nIn Yucatán, Maní served as a Maya religious centre honouring Kukulcan, with an annual festival held there until 1341. After the Spanish arrived, the Xiu rulers of Maní allied with them; the conversion of a Xiu lord encouraged other western Maya lords to accept Spanish rule.\n\nIn 1562 the Franciscan Diego de Landa ordered Maya books and images burned at Maní. Farther south, the Itza of Petén resisted Franciscan attempts to convert them in 1618 and 1619."
 yazidi_group_desc: "The $yazidi_group$ faiths are those beliefs of the ethnoreligious group known as $yazidism_ADJ$.\n\nYazidi religious life centered on Lalish, where the tomb of Sheikh Adi drew pilgrims to the annual Feast of the Assembly. From the fourteenth century, religious reciters carried sacred peacock emblems from Shekhan to Yazidi villages.\n\nIn 1414 an alliance of neighboring Kurdish tribes raided Lalish. Under Ottoman rule, Yazidi leaders sometimes held provincial offices, but the community also faced military campaigns. An Ottoman expedition attacked the Yazidis of Sinjar in 1613, and another took the mountain in 1640 after heavy fighting."
 zoroastrian_group_desc: "$zoroastrian_group$ is a grouping of religions that follow the faith created by Zoroaster.\n\nZoroastrian communities survived in Iran around Yazd and Kerman, while descendants of Iranian migrants became known as Parsis in Gujarat. Between 1478 and 1766, priests in India exchanged letters with their Iranian counterparts on religious and social questions.\n\nIn 1742 the sacred fire of Sanjan was moved to Udvada after disputes over priestly jurisdiction. Parsi families also followed the East India Company from Surat to Bombay as trade expanded there."
 alawi_school_desc: "The $alawi_school$, also called Nuṣairī, proclaim 'Alī ibn Abī Ṭālib, the first Imām according to [ShowReligionAdjective('shia')] beliefs, to be the manifestation of $muslim_god_name$ Himself. They differ substantially from the rest of the [ShowReligionAdjective('shia')] faith in both rituals and theology, believing in reincarnation and allowing the consumption of alcohol.\n\nThe Alawite community traces its beginnings to Ibn Nusayr, a ninth-century follower of the tenth and eleventh imams. Al-Khasibi organized the community under the Hamdanids in northern Syria, and al-Tabarani moved to Latakia in 1032 and taught in the coastal region.\n\nAlawite communities became established in the Syrian coastal mountains during Mamluk rule. In 1834–1835 Alawites rose against Egyptian rule in the region, but the revolt was suppressed."
 alevism_school_desc: "Following the teachings of Ḥājī Baktāš Walī, $alevism_school$ is a syncretic mystical school, emerging from the [ShowReligiousSchoolName('imamiya_school')] school but incorporating traditions from [ShowReligionName('tengri')] and older [ShowCultureGroupName('turkic_group')] beliefs. It also takes some aspects of Sufism, like the presence of a spiritual leader and mysticism practices.\n\nAlevism developed among Turkmen communities in Anatolia, where Sufi Islam and older customs met during the Seljuk expansion of the eleventh and twelfth centuries. From the late fifteenth century, many Qizilbash in Anatolia and Azerbaijan followed the Safavid leaders, wearing red headgear associated with the Twelve Imams.\n\nIn 1501 Qizilbash forces helped Ismail establish Safavid rule at Tabriz. Their association with the Safavids contributed to the persecution of Qizilbash communities under the Ottomans."
 ashari_school_desc: "The $ashari_school$ School of Theology is focused on the authority of the scriptures and rationalism, and was founded in the 9th century by Abū al-Ḥasan al-Ash'arī. His teachings of all universe being composed of atoms became the basis of the $ashari_school$ School proposition that all matter and time has been created by $muslim_god_name$, believing at the same time in free will and predestination.\n\nAsh'arī theology developed further through scholars such as al-Ghazali, who was appointed to the Nizamiyya of Baghdad in 1091. After a spiritual crisis he left Baghdad in 1095 and wrote works including The Revival of the Religious Sciences.\n\nThe fourteenth-century scholar Ibn Khaldun was also associated with Ash'arism. His Muqaddimah influenced Ottoman historians including Katip Çelebi in the seventeenth century, as they considered the rise and decline of states."
 athari_school_desc: "The $athari_school$ School of Theology rejects a rational interpretation of the scriptures in favor of a stricter reading of the texts of the $common_string_quran$ and Ḥadīth, considering them the sole authorities. Being against any form of religion innovation, refuses any kind of rationality that is not based upon the texts of the $common_string_quran$.\n\nAthari theology took shape among hadith scholars in the late eighth century, and Ahmad ibn Hanbal led the emerging traditionalist movement. The Hanbali scholar Ibn Taymiyya, born in Harran in 1263, became a prominent critic of speculative theology in Damascus.\n\nIn 1326 Ibn Taymiyya and his disciple Ibn al-Qayyim were imprisoned in the citadel of Damascus. Released after his teacher's death in 1328, Ibn al-Qayyim taught scholars of the Mamluk period until his own death in 1350."
 balatkara_gana_school_desc: "A section of [ShowReligiousSchoolName('mula_sangh_school')], the $balatkara_gana_school$ monastic order of [ShowReligionName('jain')] originated in the 8th century with the founder of the $STR_ADJ$ dynasty. As such, it is among the oldest in [ShowReligionNameWithNoTooltip('jain')].\n\nBalatkara Gana was established in northern India by the thirteenth century, as inscriptions at Un, Ahar and Hoshangabad attest. Its teacher Prabhachandra is remembered as the first bhattaraka of Delhi in the fourteenth century.\n\nThe Delhi lineage later produced branches elsewhere: Sakalakirti founded the Idar line in the fifteenth century, and Ratnakirti founded the Nagaur line after studying under Jinachandra."
 bektashi_school_desc: "Named after Ḥājī Baktāš Walī, believed to be descendant of 'Alī ibn Abī Ṭālib, the $bektashi_school$ of Sufism nonetheless respects all companions of Muḥammad. Although originating from the [ShowReligionAdjective('sunni')] faith, it contains many beliefs and practices present also in other traditions, giving it many similarity to them.\n\nThe Bektashi order spread through Anatolia and the Balkans, gaining influence among the Ottoman Janissaries in the fifteenth century. In the sixteenth century Balım Sultan systematized its rituals and teachings and came to be revered as its second elder.\n\nAfter Mahmud II forcibly dissolved the Janissary corps in 1826, he banned the Bektashi order because of its ties to the soldiers. Lodges were destroyed or confiscated, and some dervishes were exiled or executed."
 chishti_school_desc: "Originating from [ShowLocationName('chishti_sarif')], the $chishti_school$ rejects wordly power and promotes tolerance and love. It also promotes music and poetry as a form to connect with the love of $muslim_god_name$.\n\nMu'in al-Din Chishti brought the Chishti order to Ajmer in northern India, where he died in 1236. His tomb became a place of pilgrimage, while the teaching of Nizamuddin Auliya of Delhi helped the order spread across the subcontinent.\n\nFrom the fourteenth century, rulers of the Delhi and Bengal sultanates patronized Chishti shrines. The Mughal emperor Akbar visited Mu'in al-Din's tomb after his victory at Chittorgarh in 1568."
 din_i_ilahi_school_desc: "Adopted from the Mongol code, $din_i_ilahi_school$ treats all religions as different sects, allowing the freedom of thought within the realm.\n\nThe Mughal emperor Akbar promoted Dīn-i Ilāhī in 1582, after inviting scholars of different faiths to debate at his House of Worship in Fatehpur Sikri from 1575. The creed drew on Islam, Indian religions and other traditions, and attracted only a small circle at court.\n\nAkbar's religious policy met opposition from Muslim scholars, including Ahmad Sirhindi. After Akbar's death in 1605, his successor Jahangir moved away from many of his religious policies."
 hanafi_school_desc: "The $hanafi_school$ Madhhab is named after Abū Ḥanīfa Al-Nu'mān ibn Thābit. The school originated in Kufa and is prominent throughout the [ShowCultureName('farsi_culture')] and [ShowCultureGroupName('turkic_group')] world, including northern $india$. Though textual sources in the $common_string_quran$ and Ḥadīth are given preference, $hanafi_school$ followers have an inclusive view of sources and also employ analogy (Qiyās), juristic discretion (Istiḥsan), and local customs ('Urf) in their jurisprudence. Some view it as the most flexible of the schools.\n\nAbu Hanifa's pupils Abu Yusuf and Muhammad al-Shaybani transmitted the teachings that formed the early Ḥanafī school. Under the Abbasids, Abu Yusuf became chief judge during the reign of Harun al-Rashid, who ruled from 786 to 809.\n\nThe Ottoman Empire adopted Hanafi law as its official school. In seventeenth-century Mughal India, the compilation known as the Fatawa Alamgiri served as a legal reference under Emperor Aurangzeb and continued to be used in South Asia in the eighteenth century."
 hanbali_school_desc: "The $hanbali_school$ Madhhab is named after Aḥmad ibn Ḥanbal, and champions withholding from any speculative theology, Kalām. $hanbali_school$ followers maintain that the $common_string_quran$ and Sunnah are the only proper sources of jurisprudence and that they should be interpreted in a literal and traditionalist sense. Though it is accepted as a valid Madhhab, very few states actively promote the $hanbali_school$ school, and it was banned by the Abbasid Caliphs.\n\nThe Ḥanbalī scholar Ibn Taymiyya, born in Harran in 1263, taught in Damascus and challenged practices associated with the veneration of saints. His disputes with scholars and rulers led to repeated imprisonment before his death in 1328.\n\nIn eighteenth-century Arabia, Muhammad ibn Abd al-Wahhab drew on aspects of Ibn Taymiyya's teaching and joined with the house of Saud. The rise of his reform movement brought major changes to the Hanbali school."
 ibadi_school_desc: "Believed to be a descendant of the Al-Khawārij, who first were supporters of 'Alī ibn Abī Ṭālib but later rejected his arbitration. The $ibadi_school$ school distanced itself from the Al-Khawārij following 'Abd Allāh ibn Ibāḍ, taking a more moderate approach and a more positive view towards different $muslim_ADJ$ branches, having similarities with many of the other schools.\n\nThe Ibāḍī community developed in Basra, where Jābir ibn Zayd was an influential early scholar, before spreading to Oman and North Africa. In Oman, religious scholars traditionally selected an imam with both spiritual and temporal authority.\n\nIn 1624 Nāṣir ibn Murshid was elected imam and began uniting Oman's tribes against the Portuguese. His Yaʿrubid successors drove the Portuguese from Muscat and extended Omani power along the East African coast."
 imamiya_school_desc: "Also called 'Twelvers', $imamiya_school$ believes that 'Alī, the successor of Muḥammad, was followed by twelve infallible Imām chosen by divine decree. The last Imām, al-Mahdī, is expected to return as the savior of mankind, finally enforcing justice and peace in the world. They mainly follow [ShowReligiousSchoolName('jafari_school')] jurisprudence.\n\nBefore the Safavid conquest, Imāmīya communities were concentrated in Iranian towns and regions including Qom, Kashan and Sabzevar. In 1501 Shah Ismail I made Twelver Shiism the official religion of his new empire.\n\nThe Safavids promoted conversion across Iran and persecuted Sunni Muslims and other religious communities. Their policy helped establish Twelver Shiism as the dominant confession in Iran and intensified conflict with the Sunni Ottoman Empire."
 isawiyya_school_desc: "Considered the most mystic of the religious schools, the $isawiyya_school$ has its roots from the lands of [ShowRegionName('maghreb_region')] whose heritage of psalms and prayers developed into rituals featuring dance and music.\n\nThe Īsāwī order was founded in Meknes by Muhammad al-Hadi ben Issa, who lived from 1465 to 1526. His teachers included followers of the Shadhili and Jazuli traditions, the latter associated with the Moroccan mystic Muhammad al-Jazuli, author of a widely used prayer book.\n\nBen Issa built his own mausoleum in his Meknes lodge. Some followers attributed the development of the order's trance ceremony to a seventeenth-century disciple, while others placed it in the eighteenth century."
 ismaili_school_desc: "The $ismaili_school$ Madhhab is named after Ismā'īl ibn Ja'far, the successor of Ja'far al-Ṣādiq, and was the dominant school of faith in the Fatimid Caliphate but has lost much ground since its fall. The $ismaili_school$ school encompasses a number of increasingly divergent branches, and in many ways, they focus on the esoteric elements of [ShowReligionAdjective('shia')] faith more than the [ShowReligiousSchoolName('jafari_school')] or [ShowReligiousSchoolName('zaidi_school')].\n\nIsmā'īlī communities followed different lines of authority after earlier disputes over succession. By the fifteenth century Nizari imams had established a centre at Anjudan in Iran, where their community experienced a revival.\n\nA later succession dispute among the Tayyibis produced the Sulaymani branch in 1592. Its Yemeni followers supported Sulayman ibn Hasan, while most Indian Tayyibis recognized Dawud ibn Qutb and became known as Dawoodi Bohras."
 jafari_school_desc: "The $jafari_school$ Madhhab is named after Ja'far al-Ṣādiq, the sixth Imām, and it focuses on independent reasoning by experts of Islamic Law, prefering that over analogy when establishing the Law. It also allows for a temporary marriage lasting a predeterminate period of time.\n\nWithin Ja'farī jurisprudence, the Akhbari movement grew from the writings of Muhammad Amin al-Astarabadi, who died in 1627. Akhbaris challenged jurists' independent reasoning and emphasized the transmitted sayings of the Imams.\n\nIn the late eighteenth century, Muhammad Baqir Behbahani led a counterargument at Karbala and Najaf. His Usuli school, which upheld independent legal reasoning and the scrutiny of reports, gained predominance among Twelver scholars."
 kashtha_sangha_school_desc: "A prominent [ShowReligionAdjective('jain')] Digambara monastic school across Northern and Western $india$, originated with Lohacharya, that is, Sudharmāsvāmī. He was the fifth disciple of Mahāvīra, the 24th (and last) of the Tīrthaṅkara.\n\nKashtha Sangha was associated with several lineages, including the Mathura Sangha, supported by Agrawal Jains. Devasena's Darshanasara attributed its foundation to Kumarasena in Vikram Samvat 753, while other traditions named Lohacharya.\n\nAt Gwalior, inscriptions dated 1441 to 1474 record the consecration of rock-cut Jain images by Kashtha Sangha bhattarakas. The poet Raidhu, a lay disciple in that lineage, supervised many such ceremonies under the Tomara rulers."
 khalwati_school_desc: "The $khalwati_school$ takes its name from the act of retreating oneself for spiritual exercises in solitary. Thus, it emphasizes the individual ritual and spiritual practices, as well as retreat and asceticism.\n\nYahya Shirvani helped spread the Khalwati order from Baku and composed a devotional text used by many of its branches. Under the Ottoman sultan Bayezid II, who came to the throne in 1481, the order gained adherents among officials and soldiers.\n\nChelebi Khalifa moved its center from Amasya to Istanbul, where a former church became a lodge. In the seventeenth century the Khalwati poet Niyazi al-Misri spoke against the government and addressed a wider public."
 kharatara_gaccha_school_desc: "Also called #italic Vidhisangha#! or #italic Vidhimarga#!, meaning 'the Assembly' and 'Path of Proper Conduct' respectively, it is a Śvetāmbara monastic order that sees its own practices as the only spiritual correct ones. It encourages strict adherence to purity and religious doctrine and scriptures without deviation.\n\nKharatara Gaccha traces its founding to Vardhamana Suri. His pupil Jineshvara earned the title Kharatara after defeating a rival in debate at Anahilvada Patan in 1024, giving the order its name.\n\nIn the sixteenth century Jinachandra Suri II met the Mughal emperor Akbar at Lahore through the intercession of the Jain official Karam Chand Bachhawat. In 1595 he travelled to Multan and Uch before returning to Rajasthan."
 maliki_school_desc: "The $maliki_school$ Madhhab is named after Mālik ibn Anas and is prominent in particular throughout [ShowSubContinentName('north_africa')] and [ShowRegionName('iberia_region')]. Jurisprudence is primarily based on the work and interpretations of ibn Anas and his student Saḥnūn as described in the al-Muwaṭṭa' and the Mudawwanah. One of the foremost centers of learning within the $maliki_school$ School is the Great Mosque of Āl Qayrawān, near [ShowLocationName('tunis')].\n\nMālikī law gained state support in al-Andalus under the Umayyads and remained dominant there under the Almoravids. The Almohads that followed favoured the Zahiri school, and the Christian reconquest eventually ended Muslim rule in Iberia.\n\nIn the fourteenth century, the Egyptian jurist Khalil ibn Ishaq taught in Medina and Cairo and wrote a concise manual of Maliki law. His Mukhtasar became an authoritative reference for jurists in North and West Africa."
 maturidi_school_desc: "The $maturidi_school$ School of Theology, taking the name from 'Abū Manṣūr al-Māturīdī, is a [ShowReligionAdjective('sunni')] school of theology emerging from the theological beliefs of the $hanafi_school$ School of Jurisprudence. It promotes the rational interpretation of the scriptures, and the importance of faith over one person's deeds.\n\nMāturīdī teaching spread from Transoxiana with Hanafi scholars who moved west from the late eleventh to the fourteenth century. Their teaching reached western Persia, Iraq, Anatolia, Syria and Egypt as Turkic powers expanded.\n\nMaturidi theology held a prominent place under the Timurids and Ottomans. In Persia, where it had been influential among Sunnis, the Safavid dynasty made Twelver Shiism the state religion and pursued conversions from the sixteenth century."
 mevlevi_school_desc: "Known for its whirling dervishes, the $mevlevi_school$ is formed upon the teachings of Jalāl al-Dīn Muḥammad Rūmī. It proclaims love as central to [ShowReligionGroupName('muslim')], and it also emphasizes Sema, the movement meditation ceremony performed by way of whirling.\n\nAfter Rumi's death in 1273, his son Sultan Walad and Husameddin Chelebi established the Mevlevi order and built his mausoleum at Konya. Sultan Walad, who died in 1312, made the shrine a center for the order.\n\nOttoman patronage helped the Mevlevis spread beyond Anatolia into the Balkans and Arab lands. In 1590 Sultan Murad III commissioned a Turkish translation of a fourteenth-century biography of Rumi, preserving his story for Ottoman readers."
 mimamsa_school_desc: "The $mimamsa_school$ focuses on the methodology of interpretation and critical explanation of texts. As such, it has a greater focus on philology, the philosophy of languages, and linguistic analysis.\n\nMīmāṃsā drew on Jaimini's Mīmāṃsā Sūtra, dated to roughly the third or second century BCE, to interpret Vedic ritual obligations. Kumārila Bhaṭṭa and Prabhākara developed influential branches around the seventh century.\n\nIn the sixteenth century Appayya Dīkṣita argued that the Mīmāṃsā and Vedānta sūtras could not form a single unified work. In the seventeenth century Āpadeva wrote an introductory treatise on Mīmāṃsā."
 mula_sangh_school_desc: "Meaning 'root', it refers to the original practices of [ShowReligionName('jain')] coming from Kundakunda, a [ShowReligionAdjectiveWithNoTooltip('jain')] monk from the second century who authored many texts on [ShowReligionAdjectiveWithNoTooltip('jain')] philosophy, and the most important teacher for Digambara [ShowReligionNameWithNoTooltip('jain')].\n\nMula Sangh developed lineages including the Deshiya Gana, associated with Shravanabelagola, and the Balatkara Gana, associated with Humbaj and northern India. Their institutional heads, called bhattarakas, maintained libraries and supervised religious installations.\n\nOne account attributes the establishment of the Delhi bhattaraka seat to Prabhachandra of Mula Sangh, who travelled from Gujarat during the reign of Muhammad bin Tughlaq in the fourteenth century."
 mustali_school_desc: "The $mustali_school$ stand in opposition to the [ShowReligiousSchoolName('nizari_school')] in that they accept the ascension of Al-Musta'lī bi'llāh to the throne of the Fatimid Caliphate. Although originating in [ShowRegionName('egypt_region')], they later spread to Western $india$ through missionary work.\n\nAmong the Musta'lī, the Tayyibis recognized the infant al-Tayyib as imam after the death of al-Amir in 1130. Queen Arwa of Yemen established the office of da'i al-mutlaq to direct the community on his behalf.\n\nPersecution by a local Zaydi ruler led the Tayyibi mission to move its headquarters from Yemen to India in 1567. In 1592 a dispute over its leadership divided the followers of Dawud ibn Qutb from those of Sulayman ibn Hasan."
 mutazili_school_desc: "The $mutazili_school$ School of Theology developed influenced by Greek and Indian philosophy and rationalism. It rejects the notion that the $common_string_quran$ and $muslim_god_name$ are coexistent, expressing that the scripture must logically come after the originator. It defends reason as long as it serves people to understand religious matters, and it supports that evil originates from errors of humanity due to their free will.\n\nMu'tazili theology arose in eighth-century Basra, where Wasil ibn Ata was remembered for leaving the circle of Hasan al-Basri after a dispute. The Abbasid caliph al-Ma'mun instituted an inquisition in 833 to enforce the doctrine of the created Quran; al-Mutawakkil ended it in 851.\n\nMu'tazili writings and teachings survived among Zaydi scholars in Yemen. There al-Shawkani, appointed chief judge in 1795, challenged Zaydi theological doctrines and advocated a return to scriptural sources."
 naqshbandi_school_desc: "Tracing its origin to Ja'far ibn Muḥammad al-Ṣādiq, the $naqshbandi_school$ places more importance to the $sharia$ than other related schools. Its practices are organized around the silent invocation and conciousness.\n\nThe Naqshbandi order took its name from Baha al-Din Naqshband, who was born near Bukhara in 1318. At the end of the sixteenth century Baqi Billah brought the order to India, where his disciple Ahmad Sirhindi founded the Mujaddidi branch.\n\nSirhindi's letters reached Mughal nobles and argued for stricter religious observance. In the early nineteenth century Khalid of Shahrazur established another influential branch in the Ottoman lands, with followers in Iraq and Syria."
 nizari_school_desc: "The $nizari_school$ claim that Nizār ibn al-Mustanṣir was the true successor to the Fatimid Caliphate after his father death, and oppose al-Afḍal Shāhanshāh's coup to install Al-Musta'lī bi'llāh on the throne. Having originally split from the [ShowReligiousSchoolName('ismaili_school')], they have gained adherents from many other branches, and they follow [ShowReligiousSchoolName('jafari_school')] jurisprudence, focusing on pluralism and acceptance of differences.\n\nNizārī power in Iran centred on Alamut, a fortress taken by Hasan-i Sabbah in 1090. In 1256 the imam Rukn al-Din Khurshah surrendered it to the Mongols, who dismantled the stronghold and destroyed its library.\n\nNizari forces briefly recovered Alamut in 1275, though they held it for only a few years. By the fifteenth century the imams had moved to Anjudan in central Iran, where the community underwent a revival under leaders including Mustansir Billah II."
 nyaya_school_desc: "$nyaya_school$ is a realist school, focusing on methodology and logic as the means of gaining knowledge. It states that our suffering is caused by mistakes due to incorrect knowledge and that liberation will be gained with the correct knowledge.\n\nNyāya took the Nyāya Sūtras, attributed to Akṣapāda Gautama, as a foundational text. In the thirteenth century Gaṅgeśa of Mithila founded the new Nyāya tradition and examined the school's methods in his Tattvacintāmaṇi.\n\nRaghunātha Śiromaṇi of Nabadwip in Bengal carried the new tradition forward. Its precise language for analysing knowledge and reasoning remained in use among Indian philosophers through the eighteenth century."
 qadiri_school_desc: "Founded by 'Abdulqādir Gīlānī, the $qadiri_school$ promote a strict following of [ShowReligionAdjective('sunni')] law. It also has decentralized leadership, allowing each of its centers freedom of interpretation and practice, which has caused it to differenciate in multiple branches.\n\nThe Qadiri order grew around Abdul Qadir Gilani's school in Baghdad, which his son Abdul Razzaq led after his death in 1166. By the end of the fifteenth century its branches had reached places as distant as Morocco, India and present-day Mali.\n\nIn 1535 the Ottoman sultan Suleiman commissioned a new shrine over Gilani's grave in Baghdad. In the eighteenth century al-Mukhtar al-Kunti helped spread the order through the middle Niger region and further west."
 safavid_school_desc: "Founded by Ṣāfī ad-Dīn Isḥāq Ardabīlī upon the [ShowReligiousSchoolName('shafii_school')] teachings, the $safavid_school$ has later gotten close to the [ShowReligiousSchoolName('imamiya_school')] thought. Its zeal and strength of belief make its followers be certain of their place in the universe.\n\nThe Safavid order passed through the family of Safi al-Din after his death in 1334. Under Junayd and Haydar in the fifteenth century, it became a militant movement supported by Qizilbash followers, while its leaders claimed spiritual and political authority.\n\nIn 1501 Haydar's son Ismail captured Tabriz and became shah, establishing the Safavid dynasty. He proclaimed Twelver Shiism the state religion and brought scholars from Syria and Lebanon to help establish it."
 samkhya_school_desc: "Very influential for the other schools of [ShowCultureGroupName('indian_group')] philosophy, $samkhya_school$ is a dualistic school based on rationality. It proposes that the world is composed of both matter and spirit, and that knowledge can only be gained through perception and rational inference.\n\nThe Sāṃkhya system took a definitive form in the Sāṃkhyakārikā of the fourth century. Its account enumerated 25 principles and held that liberation came from distinguishing consciousness from nature. Vijñānabhikṣu, a philosopher from Bihar dated to the fifteenth or sixteenth century, wrote commentaries on Sāṃkhya and argued for a unity between it, Yoga and Vedānta."
 shadhili_school_desc: "Following the teachings of Abū al-Ḥasan al-Shāḏilī, the $shadhili_school$ promotes a life of contemplation and to be constantly mindful of $muslim_god_name$, even during normal everyday activities. Applying the teachings of [ShowReligionGroupName('muslim')] to the follower's own lives is the key to transform their existance.\n\nThe Shadhili order gained a lasting literary tradition in Egypt and the Maghreb. Ibn Ata Allah, its third spiritual master, taught in Cairo and systematized its doctrines; his aphorisms, the Book of Wisdom, are his best-known work. He died in 1309.\n\nIn fifteenth-century Morocco, Muhammad al-Jazuli compiled the prayer book Dala'il al-Khayrat and gathered followers at Safi. In the late eighteenth century Muhammad al-Arabi al-Darqawi founded the Moroccan Darqawi branch."
 shafii_school_desc: "The $shafii_school$ Madhhab is named after Imām Al-Shāfi'ī, and it is prominent in particular among [ShowReligionGroupAdjective('muslim')] believers in [ShowRegionName('arabia_region')], [ShowSubContinentName('east_africa')], and East [ShowContinentName('asia')]. Unlike other Madhhab, the $shafii_school$ reject Istiḥsan and Istislah as sources of $sharia$, instead only relying on what is textually in the $common_string_quran$ or Ḥadīth.\n\nThe Shāfi'ī school became the official legal school of Egypt under the Ayyubids and remained influential under the Mamluks. In Damascus, the Shafi'i jurist al-Nawawi headed the Ashrafiyya hadith school from 1267 until his death in 1277.\n\nMerchants carried Shafi'i jurisprudence across the Indian Ocean to India and Southeast Asia. In the sixteenth century, Ottoman expansion brought Hanafi judges in place of Shafi'i judges in territories under Ottoman rule."
 suhrawardi_school_desc: "The $suhrawardi_school$ follows the teachings of Abū al-Najīb Abd al-Qādir Suhrawardī, but it is also influenced by the philosophy of Junayd of [ShowLocationName('baghdad')]. It states that people should devote themselves to true knownledge and being faithful to $muslim_god_name$, renouncing natural desires in favor of the spiritual needs.\n\nThe Suhrawardī order became prominent in western Iran under the Ilkhanate of 1256–1335, with lodges that carried its influence through Persianate society. Disciples of Umar Suhrawardi established branches in Delhi, Bengal and Multan.\n\nBahauddin Zakariya settled in Multan in 1222 and supported the Delhi sultan Iltutmish against its ruler in 1228. His descendants led the Multan branch, while other followers carried the order to Gujarat and Delhi."
 tapa_gaccha_school_desc: "Founded by Acharya Jagatchandra Suri, called 'The Meditative One', it is a Śvetāmbara monastic order that encourages veneration of religious figures and pilgrimage to holy temples.\n\nTapa Gaccha took its name from a title granted to Jagatchandra Suri by Jaitrasimha, ruler of Mewar, at Aghatpur. The order dates its foundation to 1228.\n\nIn 1556 Hiravijaya became head of its Gujarat congregation. Emperor Akbar invited him to explain Jain teachings in 1582, and later issued decrees restricting animal slaughter during Jain festivals. Hiravijaya left his disciple Shantichandra at the imperial court."
 tristutik_gaccha_school_desc: "Also known as Agama Gaccha, it is a Śvetāmbara monastic order that focuses on devotion and veneration of the Tīrthaṅkara in its rituals, considering them the only worthy of worship.\n\nTristutik Gaccha is recorded as having been established in 1194, before the founding of Tapa Gaccha in 1228. Although its devotion was directed principally to the Tirthankaras, offerings to attendant deities also formed part of major ceremonies."
 upkesa_gaccha_school_desc: "The oldest monastic order of Śvetāmbara [ShowReligionName('jain')], it follows the lineage of Pārasanātha, the 23rd Tīrthaṅkara, unlike most other schools that follow the lineage of Mahāvīra.\n\nUpkeśa Gaccha traced its name to Upkeśapattan, where tradition credits the monk Ratnaprabhasuri with opposing animal sacrifice. In 1336 its monk Kakkasuri wrote the Nabhi-nandana-jinoddhara-prabandha, an account of the renovation of a temple of Rishabhanatha. The work belongs to a medieval Sanskrit genre cultivated by Jain scholars in western India."
 vaisheshika_school_desc: "$vaisheshika_school$ is a naturalist, atomistic school, claiming that all physical universe is formed by atoms and that all our experiences come from the aggregations and interactions of such atoms. A complete understanding of the world of experience is thus what brings us to knowledge.\n\nVaiśeṣika traced its systematic exposition to the Vaiśeṣika Sūtra of Kaṇāda, who is placed between the sixth and second centuries BCE. Although it developed independently, its methods and conclusions later drew close to those of Nyāya. In the second half of the seventeenth century Annambhaṭṭa wrote the Tarka-saṅgraha and his own commentary, presenting the combined Nyāya-Vaiśeṣika system to beginners."
 vedanta_school_desc: "A very influential and diverse school, $vedanta_school$ focuses on the study of the Vedas, claiming that they are the main source of knowledge, arguing that spiritual matters are beyond any kind of perception and inference by humans.\n\nVedānta traditions offered different readings of the Upanishads, the Brahma Sūtras and the Bhagavad Gītā. Vallabha, who lived from 1479 to 1531, founded the pure non-dualist tradition, while Chaitanya, who lived from 1486 to 1534, inspired a tradition of inconceivable difference and non-difference.\n\nThe non-dualist Madhusūdana Sarasvatī, a devotee of Krishna, wrote the Advaitasiddhi in reply to a dualist critique; dualist scholars then answered his work."
 wahhabi_school_desc: "Emerging from the [ShowReligiousSchoolName('hanbali_school')] School as a revivalist movement, the $wahhabi_school$ School of Theology is against common Sufi practices like the veneration of holy people and pilgrimages to their shrines. It encourages a return to the original piety and practices of the first generations of [ShowReligionGroupName('muslim')].\n\nThe Wahhabi movement arose in Najd under Muhammad ibn Abd al-Wahhab, who formed a pact with the ruler of Diriyah, Muhammad ibn Saud, in 1744. Their alliance spread his teachings alongside the expansion of the first Saudi state.\n\nSaudi forces took Mecca and Medina after entering the Hejaz in 1803, challenging Ottoman authority over the holy cities. In 1818 Egyptian forces acting for the Ottoman sultan captured Diriyah, ending the first Saudi state; its surviving adherents and the Saud family founded a second state in 1824."
 yoga_school_desc: "Similar in many ways to the $samkhya_school$ school, $yoga_school$ also sees the universe as a duality and perception and rationality as ways of gaining knowledge. However, it adds that systematic practice and experimentation are also required to attain knowledge and liberation.\n\nYoga drew on Patañjali's Yoga Sutras, compiled in India in the early centuries of the Common Era. The text set out eight limbs of practice, including restraint, posture, breath control, meditation and absorption.\n\nIn the sixteenth century Vijñānabhikṣu wrote a commentary on the Yoga Sutras and sought to reconcile Sāṃkhya and Vedānta. Another commentator of that century was Rāmānanda Sarasvatī, author of the Yogamaṇiprabhā."
 zahiri_school_desc: "The $zahiri_school$ advocates for a strict adherence to the text of the $common_string_quran$, and focus on its external or apparent meaning. According to them, there can not be any conclusion drawn from reading the texts that is not in the texts themselves, otherwise $muslim_god_name$ would have explicitly expressed those already.\n\nThe Ẓāhirī school took its early name from Dawud al-Zahiri, who studied in Baghdad and attracted followers opposed to binding adherence to earlier jurists. By the end of the tenth century, Zahiri judges served in cities from Baghdad and Damascus to Bukhara.\n\nIn al-Andalus, Ibn Hazm of Córdoba, who lived from 994 to 1064, became a leading exponent of the school. The Almohads later gave Zahiri scholars state patronage, but the school declined around the fourteenth century."
 zaidi_school_desc: "Also called 'Fivers', the $zaidi_school$ current is named after Zayd ibn 'Alī, the grandson of Muḥammad's son 'Alī, and follows his teachings as described in the Majmu' al-Fiqh. $zaidi_school$ followers emphasize justice and human responsibility and descend from those who supported Zayd's original revolt against the Umayyad Caliph. $zaidi_school$ people entirely reject religious dissimulation as practiced by many [ShowReligionAdjective('shia')] followers, and it is the most similar to [ShowReligionName('sunni')].\n\nZaydī rule took root in Yemen when al-Hadi ila'l-Haqq Yahya established an imamate at Sa'dah around 893. In northern Iran the Karkiya dynasty ruled eastern Gilan from the 1370s until 1592; Zaydis in the Caspian region were forcibly converted to Twelver Shiism in the sixteenth century.\n\nIn Yemen al-Mansur al-Qasim proclaimed an imamate in 1597 against Ottoman rule. His successor al-Mu'ayyad Muhammad captured Sana'a in 1628, and by 1636 the Ottomans had left Yemen."
 order_of_lebrel_blanco_desc: "The Order of the White Greyhound was established by Charles III the Noble as the highest chivalric distinction of the $NAV$ Crown, selecting from the most loyal and distinguished knights of the realm. Its members, bound by an oath of mutual brotherhood and fidelity, are expected to embody the swiftness and loyalty of the greyhound in all their deeds. The order stands as a mark of royal prestige and trust, binding the Crown's closest allies in perpetual service and honor.\n\nThe Order of the White Greyhound was founded in 1391. Its badge was a gold greyhound suspended from a chain with chestnut-leaf links, and its French motto meant “In good faith”. In 1393 Charles III admitted 56 squires and men-at-arms whom he sent to defend Cherbourg."
 order_of_saint_george_desc: "This order, known as the 'Chivalric Society of Saint George,' embodies a commitment to the ideals of chivalry and honor, promoting these values through knightly tournaments and festivals.\n\nThe Order of Saint George was founded by King Charles I of Hungary and existed by 23 April 1326, its patron's feast. Members wore black hooded mantles inscribed with a pledge of justice to their fellowship. The society prospered under Charles and his son Louis I, but the struggle for the throne after Louis died in 1382 destroyed it."
 order_of_the_band_desc: "The Order of the Band is composed of the most excellent knights, who swear their loyalty and obedience to the ruler of [GetCountry('CAS').GetName]. Its members are held to high standards of scrupulous and impeccable courtly behavior, regularly participate in jousts, and must be above all else supportive and loyal to their ruler.\n\nAlfonso XI of Castile instituted the Order of the Band in 1332, the year of his coronation. Its name came from the red sash worn by its knights, and admission required at least ten years of service at court or in the army. The order declined and was considered extinct by 1474."
 order_of_the_black_eagle_desc: "The secular Order of the Black Eagle is more of a military order than a spiritual one. Members of this Order tend to include members of the royal family, visiting foreign royals, and distinguished generals who have been awarded for their merit.\n\nElector Frederick III of Brandenburg founded the Order of the Black Eagle on 17 January 1701, the day before he crowned himself King Frederick I in Prussia at Königsberg. His son Frederick William was its first member. During Frederick I's reign, which ended in 1713, the order was awarded 57 times."
 order_of_the_dragon_desc: "Also known as the '#italic Societas Draconica#!', this Order was dedicated to defending the [GetCountry('HUN').GetAdjective] monarchy, the [ShowReligionAdjective('catholic')] Church, and [ShowReligionGroupName('christian')] against the threat of the [GetCountry('TUR').GetLongName], heretics, and pagans. Modeled after the Order of St. George and inspired by the crusading spirit of the time, it unites the [ShowEstateTypeName('nobles_estate')] and the [ShowEstateTypeName('crown_estate')] under the symbols of the ouroboros and the red cross, fostering a collective defense against foreign and domestic threats while offering the $nobles_estate$ royal protection and honors in return for their loyalty.\n\nSigismund of Luxembourg and his queen Barbara of Cilli founded the Order of the Dragon on 12 December 1408. Its members included the Orthodox Serbian ruler Stefan Lazarević as well as Catholic nobles.\n\nThe order declined in Western Europe after Sigismund died in 1437, but remained significant in lands facing Ottoman incursions. Vlad II of Wallachia took the name Dracul from it."
 order_of_the_ermine_desc: "The Order of the Ermine draws inspiration from the [GetCountry('ENG').GetAdjective] Order of the Garter. With the ermine as its symbol, representing unwavering personal honor, the order recognizes both men and women, regardless of social status, for exceptional service to the Duchy of [ShowAreaName('brittany_area')].\n\nJohn IV, Duke of Brittany, founded the Order of the Ermine in 1381 after returning from exile in England. In 1448 it became the Order of the Ermine and the Ear of Grain.\n\nDuchess Anne appointed Katherine Potier as an officer of arms after the death of her husband Yves. The order fell into disuse after Anne's daughter Claude died in 1524."
 order_of_the_garter_desc: "Established in the tradition of the legendary Knights of the Round Table, the Order of the Garter is the most prestigious [chivalric_order|e] in the realm. Its motto, '#italic Honi soit qui mal y pense#!', speaks to the honor demanded of its members.\n\nEdward III founded the Order of the Garter around the time he claimed the French throne; the traditional foundation year is 1348. Its founding knights included his son Edward, the Black Prince, and Henry of Grosmont, Earl of Lancaster.\n\nThe order's chapel at Windsor was extensively rebuilt from 1475 under Edward IV and his successors. George III had it restored between 1780 and 1790."
 order_of_the_golden_fleece_desc: "Founded by Philip the Good of Burgundy, the Order of the Golden Fleece is among the most illustrious [chivalric_order|e]s in Christendom. Membership binds its knights by solemn oath to uphold the glory and honor of their lord, and to stand united against all threats to Christendom.\n\nPhilip established the Order of the Golden Fleece at Bruges in 1430 to celebrate his marriage to Isabella of Portugal. Its knights initially numbered 24, rising to 30 in 1433 and 50 in 1516, apart from the sovereign.\n\nAfter the War of the Spanish Succession ended in 1714, the Spanish Bourbons and Austrian Habsburgs each maintained a branch of the order. The order's treasure and archives passed to the Austrian Netherlands."
 order_of_the_jar_desc: "Using the fervor of the people in [ShowRegionName('iberia_region')], the $order_of_the_jar$ is meant to serve as a way to reward knights loyal to the [ShowEstateTypeName('crown_estate')], whilst also playing a prominent role in court ceremonies.\n\nFerdinand of Antequera founded the Order of the Jar at Medina del Campo in 1403 and gave its collar to his sons and favoured knights. Its emblem included a jar of lilies representing the Virgin Mary's purity and a griffin suspended from the collar.\n\nThe order became royal when Ferdinand became king of Aragon in 1412. It lasted until 1516."
 order_of_the_swan_desc: "The Order of the Swan is dedicated to promoting piety and spreading the cult of the Virgin Mary. Members of this Order include many princes from the ruling dynasty as well as the [ShowEstateTypeName('nobles_estate')], all united in perseverance.\n\nElector Frederick II of Brandenburg founded the Order of the Swan on 29 September 1440. Its headquarters stood at St Mary's pilgrimage church near Brandenburg an der Havel, and in 1459 Margrave Albert Achilles established a branch at St Gumbertus in Ansbach. The order had about 330 members in 1464, but disappeared during the Protestant Reformation."
 order_of_the_white_eagle_desc: "The military $order_of_the_white_eagle_policy$ is awarded to the closest supporters of the state and the most brilliant of our citizens as a reward for their service to the country. It is also bestowed upon high-ranking visitors who have graced us with their presence.\n\nAugustus II of Poland instituted the Order of the White Eagle on 1 November 1705. Its original badge bore the Polish white eagle; a Maltese cross replaced it in 1709. The order was abolished in the third partition of Poland in 1795, renewed in the Duchy of Warsaw in 1807, and incorporated into the Russian honours system in 1831."
 society_bengler_mainz_desc: "$noble_society_mainz_desc$\n\nThe Bengler Society was founded on 29 September 1391 by Konrad Spiegel of Desenberg, Frederick of Padberg and other nobles. Archbishop Konrad II of Mainz took the league under his protection and allied with it that November. Its members fought the bishop of Paderborn; in 1396 the bishops of Paderborn and Münster crushed them."
 society_elephant_tyrol_desc: "$noble_society_tyrol_desc$\n\nThe Elefantenbund was formed in 1406 by 21 Tyrolean nobles to defend their privileges against Duke Frederick IV and his governor Henry of Rottenburg. Led by Ulrich of Matsch, its members wore a silver elephant on their breasts; the poet Oswald von Wolkenstein was among them.\n\nAlthough formed for five years, the league ended in 1407. Most members joined the Falcon League founded by Henry of Rottenburg."
 society_furspang_franconia_desc: "$noble_society_franconia_desc$\n\nThe Fürspang Society was founded at Würzburg in 1396 by 26 nobles from twelve Franconian families. Originally a burial and altar brotherhood devoted to Mary, it supported churches in Bamberg, Nuremberg and Würzburg. Its name referred to a brooch understood as a clasp from Mary's girdle.\n\nMembership was hereditary within eligible families and was enlarged in 1505. The society inspired the Unicorn Society of 1481, but dwindled after the Reformation and dissolved in 1648."
 society_hubertus_cologne_desc: "$noble_society_cologne_desc$\n\nThe Order of Saint Hubert was founded by Gerhard of Jülich-Berg in 1444 or 1445 to commemorate his victory over Arnold of Egmond at Linnich on Saint Hubert's day in 1444. Gerhard's son William renewed its statutes in 1475. In 1778 Charles Theodore brought the order to Bavaria when he inherited its electorate."
 society_lion_nassau_desc: "$noble_society_nassau_desc$\n\nSeventeen counts, knights and squires founded the Society with the Lion at Wiesbaden on 17 October 1379. Its members openly supported the Avignon claimant Clement VII, while their opponents backed Urban VI in Rome. The league allied with Basel in 1380 and fought against leagues of cities; its last official mention came with the peace of Ehingen in 1382."
 society_with_the_donkey_desc: "$noble_society_baden_palatine_desc$\n\nThe Society with the Donkey first appears in records in 1387. Its northern and southern branches centred on Frankfurt and Heidelberg respectively, each led by elected kings. Several members served King Rupert of the Palatinate, and the society counted 110 companions in 1408. Its political influence declined after Rupert's death in 1410; the southern branch was refounded in 1478."
