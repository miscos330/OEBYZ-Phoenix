l_simp_chinese:
 greek_group_desc: "#Y #color_yellow Ῥωμανία#!，Romania，当东罗马人说“#color_yellow Ῥωμανία#!”时，他们指代的是由罗马皇帝统治、受罗马法律管辖、以东正教信仰为纽带、以希腊语为文化语言的文明共同体。#!\n\n罗马文化组汇集了东地中海和黑海沿岸说希腊语的诸民族：希腊人、黑海南岸的本都希腊人，以及意大利南部的格里科人。在拜占庭帝国，他们自称罗马人，是罗马国家的继承者。\n\n1337年，安德洛尼卡三世在君士坦丁堡统治着一个缩小了的帝国。本都希腊人生活在特拉布宗的科穆宁皇帝治下，该政权存续到1461年。君士坦丁堡于1453年落入奥斯曼苏丹穆罕默德二世之手，摩里亚在1460年陷落。在奥斯曼统治下，东正教会领导着希腊人社群，直到1821年独立战争爆发。"
 orthodox_desc: "$orthodox$根植于$christian_ADJ$早期大公会议的传统，强调使徒教导与神圣传统的连续性。以$BYZ_ADJ$仪规为中心，教会极为重视礼仪、圣像与神秘主义。教会由诸牧首领导，君士坦丁堡普世牧首享有荣誉上的首席地位。\n\n东正教的各教会实行自治，每个教会由其主教在会议中治理。与教宗不同，君士坦丁堡普世牧首对其他教会没有统辖权。各教会遵奉七次大公会议的决议和教父的教导，并在1054年的大分裂中与罗马分手。阿陀斯山的修士中神秘主义尤其浓厚，他们修行的静修主义由格里高利·帕拉马加以捍卫。\n\n1337年，拜占庭、塞尔维亚、保加利亚、格鲁吉亚、瓦拉几亚和俄罗斯诸公国都信奉东正教。1439年佛罗伦萨会议上达成的与罗马的合一，被君士坦丁堡的大多数神职人员和民众拒绝，该城在1453年陷于奥斯曼人之手。"
