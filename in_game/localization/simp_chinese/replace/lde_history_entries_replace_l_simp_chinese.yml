l_simp_chinese:
 abenakian_language_desc: "在新英格兰北部和加拿大滨海地区大部分区域使用的东阿尔冈昆语分支。\n\n阿贝纳基语是瓦巴纳基诸族的语言，方言连续体包括东西两支阿贝纳基方言和米克马克语。使用者自称沃巴纳基阿克人，意为“黎明之地的人”，这种多式综合语能把整句话压缩进一个词。\n\n1604年，尚普兰在肯纳贝克河畔见到务农的阿贝纳基人；17世纪30年代，英语的“臭鼬”一词借自他们的语言。疫病和英国定居者的挤压迫使许多阿贝纳基人从1669年起投入法国庇护之下，法国在奥达纳克和沃利纳克建立传教站，耶稣会士用语法书和词表记录方言。\n\n他们与法国结盟，在1675年的菲利普国王战争和后来的安妮女王战争中不断袭击英国边疆，直到耶稣会士塞巴斯蒂安·拉勒于1724年在诺里奇沃克被杀，阿贝纳基诸战于次年告终。"
 anishinabe_language_desc: "通用于整个五大湖区和渥太华山谷的中阿尔冈昆语方言的集合。\n\n阿尼希纳贝语自称阿尼希纳贝莫温，分布东起圣劳伦斯河下游、西至温尼伯湖和密西西比河上游。其分支包括阿尔冈昆、渥太华、奥吉布瓦、索尔托和奥吉—克里等方言，没有一种方言或拼写法被奉为标准。\n\n18世纪初，这些方言已是五大湖上游的贸易通用语：1703年的记载称，从圣劳伦斯湾到哈得孙湾都有人使用它们；随着休伦人在18世纪衰落，渥太华等阿尼希纳贝分支在部落间贸易中取代了休伦语。\n\n书写上，各地采用以法语、英语拼法为基础的拉丁字母，也使用与福克斯人、波塔瓦托米人共用的法文字母大湖阿尔冈昆音节文字。"
 brythonic_language_desc: "$brythonic_language$源于不列颠岛的古代凯尔特人，后来随着难民逃离盎格鲁‑撒克逊人入侵传播到$english_channel_area$两岸。\n\n布立吞语是海岛凯尔特语族的P凯尔特分支，源自通行于罗马不列颠大部的共同布立吞语。罗马撤离后，盎格鲁—撒克逊人进逼，迫使不列颠人西迁北徙；577年迪勒姆战役切断西南不列颠人与威尔士人的陆路。共同语分化为威尔士语、康沃尔语和布列塔尼语，后者5—6世纪起在布列塔尼成形，此外还有坎布里克语，皮克特语或许也属此类。\n\n康沃尔语到18世纪后期已不再是社区语言。威尔士语则站稳脚跟，尽管1536年和1542年的《威尔士联合法令》规定英语为法律和行政语言；1588年威廉·摩根的威尔士语圣经，和1632年、1770—1794年的词典确立了书面标准。"
 cree_language_desc: "从纽芬兰到艾伯塔使用的大量中阿尔冈昆方言的集合。\n\n克里语又称克里—蒙塔格奈—纳斯卡皮语，从拉布拉多和圣劳伦斯湾经詹姆斯湾延伸到艾伯塔。它分为东西九支，最显著的区别是对原始阿尔冈昆语同一个音的不同演变。\n\n它源自原始阿尔冈昆语的一种方言，其使用者在两千五百至三千年前离开五大湖故土，在詹姆斯湾一带分成东西两支。克里语是多式综合语，主语和宾语都折进动词之中，名词分有生命与无生命两类。\n\n1670年以后，借助毛皮贸易获得火器的克里人从詹姆斯湾向西扩张，穿过北方针叶林直达平原；长期与法国人和奥吉布瓦人接触，又催生了米奇夫语和奥吉克里语等混合语言。"
 english_language_desc: "英语源于日耳曼定居者带到英国的盎格鲁‑撒克逊方言，后来由于维京人入侵，在与诺斯语接触中受到影响，导致词汇和语法发生了重大变化。诺曼征服后，欧洲大陆的封建领主统治了几个世纪，它又进一步受到法语的影响。\n\n古英语是5世纪起移居不列颠的盎格鲁人、撒克逊人和朱特人的语言，留下了从《贝奥武甫》到《盎格鲁‑撒克逊编年史》的书面文学。其中的诺斯语词汇来自北部和东部的丹麦定居者。\n\n1066年后，法语成为宫廷和法律的语言，英语主要在平民口中流传，吸收了大量罗曼语词汇。14世纪英语重新抬头：1362年的《英语诉讼法》准许在法庭使用英语，杰弗里·乔叟用伦敦方言写成《坎特伯雷故事集》。\n\n1476年威廉·卡克斯顿在威斯敏斯特开设印刷所，帮助确立了书面标准；1611年的钦定版圣经和1755年塞缪尔·约翰逊的词典又进一步塑造了它。"
 french_language_desc: "#italic 奥伊通俗拉丁语#!，或者说后来的$french_language$，代表了罗曼语在法兰西北部的诸多方言的集合。\n\n法语源于罗马高卢的通俗拉丁语，底下是凯尔特语高卢语的底层，它给法语留下了联诵和约两百个乡村生活词汇。3世纪起，日耳曼人的法兰克人定居北方，赋予法语它的名字和大量军事与封建词汇；10世纪占据诺曼底的维京人又添上海事用语。\n\n奥依语诸方言因表示“是”的说法而得名，包括皮卡第语、诺曼语、瓦隆语和巴黎的弗朗西恩语。现存最早的法语文本是842年的《斯特拉斯堡誓言》，1066年后盎格鲁‑诺曼语统治了英格兰的宫廷。\n\n1337年时，弗朗西恩语还只是众多方言中的一支。1539年的《维莱科特雷法令》规定法语为法律文书的唯一语言，1634年黎塞留创立法兰西学术院。直到1789年，法王的臣民中或许仍有一半只会说本乡的土话。"
 gaelic_language_desc: "$gaelic_language$（或戈伊德尔语）代表了起源于爱尔兰并在中世纪传播到邻近岛屿的凯尔特语族。\n\n盖尔语最古老的形态是原始爱尔兰语，最早见于4世纪前后的欧甘文石刻；13—18世纪，一种称为古典盖尔语的共同书面标准服务于爱尔兰和苏格兰两地的写作者。\n\n6世纪，盖尔语随达尔里阿达王国传到苏格兰西部，到11世纪皮克特人已改用这种语言。在苏格兰，盖尔语退居高地和群岛；1609年的《艾奥纳法令》强迫氏族首领的继承人进入英语学校。\n\n在爱尔兰，英格兰的征服和1691年的《利默里克条约》使盖尔语被边缘化。苏格兰盖尔语《新约》于1767年问世，全本《圣经》于1801年出版，但英语教育和移民仍在不断压缩盖尔语的世界。"
 latin_language_desc: "拉丁语作为人类历史上最具影响力的语言之一，曾是凯撒、维吉尔和西塞罗的语言，也是路德、笛卡尔和牛顿的语言。尽管西罗马帝国灭亡和日耳曼民族迁徙后，拉丁语逐渐分化为[ShowLanguageFamilyName('romance_language_family')]下的多种语言，但正如#italic “被征服的罗马征服了野蛮的征服者”#!所言，拉丁语作为仪式、文化和外交的语言，仍将在未来数千年中持续存在。\n\n拉丁语是印欧语系意大利语族的语言，最初由台伯河下游拉丁姆地区的拉丁人使用，随罗马传遍地中海。它的字母借自伊特鲁里亚人，约公元前75年至公元200年间古典拉丁语定型，而士兵与移民口中的通俗拉丁语则通行于各行省。\n\n6—9世纪，通俗拉丁语分化为罗曼诸语，但书面拉丁语延续于教会、法律和学术界。约1300年起，彼特拉克等文艺复兴人文主义者复兴古典范式。\n\n新拉丁语承载了伊拉斯谟的讽刺作品、托马斯·莫尔的《乌托邦》，以及1687年牛顿的《自然哲学的数学原理》。直到17世纪末，大部分书籍和几乎所有外交文书仍用拉丁语写成；此后民族语言取代了它，教会拉丁语继续用于天主教会礼仪。"
 mandarin_language_desc: "官话是$chinese_language_family$在中国流通最广的语言\n\n官话本出于华北平原，方言分布范围从云南直到黑龙江。多数官话方言有四个声调，中古汉语的入声塞音韵尾已经消失，卷舌声母则往往保留。\n\n女真金朝和蒙古元朝时期的北方口语称古官话，12至14世纪间用它写成的曲和杂剧等白话文学十分繁荣。1308年的《蒙古字韵》和1324年的《中原音韵》两部韵书记录了当时的音系。\n\n由于历代帝都多在官话区，至迟14世纪起，一种北方共通语便通行于官场和朝廷；明清两代称之为官话，即官员的语言，16世纪来华学习这种话的耶稣会传教士把它译作曼达林。"
 north_italian_language_desc: "意大利半岛北部的人们使用这一群组的语言。\n\n高卢—意大利语（威尼斯语也常被划入这一群）源自山南高卢的通俗拉丁语，底层是凯尔特语，又带有6世纪伦巴第人入侵留下的伦巴第语上层成分。1100年前后诺曼人征服西西里后迁入的高卢—意大利语移民，在西西里和巴西利卡塔形成语言岛并长期存续。\n\n这些地方语言长期用于当地行政，但从15世纪起，彼得罗·本博等人文主义者推崇的托斯卡纳文学语把它们逐出书面领域，米兰卢多维科·斯福尔扎的宫廷也推动了这一趋势。\n\n地方文学仍然延续：17世纪卡洛·玛丽亚·马吉规范了米兰方言的拼写并创造了舞台面具梅内金；在威尼斯，鲁赞特、哥尔多尼和戈齐让威尼斯语成为喜剧的声音，威尼斯共和国也使它成为地中海的通用语。"
 occitan_language_desc: "起源于南法，后来成为西地中海商港通用语的奥克‑罗曼语支。\n\n奥克语（lenga d'òc）得名于表示“是”的òc，但丁在《论俗语》中正是以此把它同北方的奥依语诸语言区分开来。它的方言包括利穆赞方言、奥弗涅方言、朗格多克方言、普罗旺斯方言和加斯科涅方言。\n\n奥克语植根于公元前121年设立的那尔波嫩西斯高卢的拉丁语，约1000—1030年的长诗《博埃提斯》是欧洲最早的罗曼语书面作品之一；它又成为游吟诗人的载体，他们的爱情诗使奥克语成为中世纪欧洲第一种享有盛誉的俗语文学语言。1209—1229年的阿尔比十字军摧毁了图卢兹伯爵的势力。\n\n从14世纪起，奥克语的地位不断下降，1539年的《维莱科特雷法令》又把一切公务限定为法语。它仍是南方的日常语言，只是在行政、教育和印刷中毫无位置，也没有统一的书面标准。"
 scandinavian_language_desc: "在维京时代，古诺斯语遍布斯堪的纳维亚半岛，并传入了冰岛、法罗群岛和不列颠群岛部分地区。随着时间推移，它演变为我们如今认知中的各种不同但相关的语言，每种语言都有自己的特点，同时仍然保留着共同的斯堪的纳维亚传承。\n\n斯堪的纳维亚语又称北日耳曼语，最早阶段是原始诺斯语，由此发展出的古诺斯语是维京时代的共同语言。诺斯定居者约在800年把它带到冰岛和法罗群岛，又以诺恩语的形式传到奥克尼和设得兰。\n\n中世纪的使用者仍称之为丹麦舌，当时已用拉丁字母抄写手稿，留下了《诗体埃达》《散文埃达》和冰岛萨迦。西诺斯语与东诺斯语逐渐分化，一侧形成挪威语和冰岛语，另一侧形成丹麦语和瑞典语。\n\n宗教改革带来了印刷的圣经译本，而政治联合——从1523年瑞典退出卡尔马联盟到1814年丹麦—挪威联合解体——又促使各书面标准进一步分化。诺恩语约在1700年消亡，冰岛语则最接近古老的诺斯语。"
 south_italian_language_desc: "这是覆盖意大利半岛中南部的语言群组。\n\n这组语言即学界所称的意大利—达尔马提亚语支，还包括各岛屿，以及一度通行于达尔马提亚海岸的语言。它们源自通俗拉丁语，现存最早的意大利通俗语文本是960—963年在贝内文托附近写下的法律文书。\n\n西西里语拥有最古老的文学传统：1230—1266年，皇帝腓特烈二世的巴勒莫宫廷中，雅各布·达·伦蒂尼领导的西西里诗派创立了第一种意大利文学语言和十四行诗。14世纪，但丁、彼特拉克和薄伽丘使用佛罗伦萨方言，文学主导权转入托斯卡纳。文艺复兴时期的语言之争采纳了彼得罗·本博主张的佛罗伦萨标准，1612年第一部意大利语词典问世。\n\n达尔马提亚语曾用于拉古萨商业共和国，15世纪末后被威尼斯语和克罗地亚语排挤。撒丁语曾用于中世纪执政官政权，后来的上层语言是加泰罗尼亚语和卡斯蒂利亚语。"
 wendat_language_desc: "沿圣劳伦斯河直到五大湖北部使用的一种易洛魁语言主要分支。\n\n温达特语的名称意为“岛上的居民”，在法国文献中常称休伦语，这一戏称源于当地人竖起的发式。温达特联盟居住在锡姆科湖与乔治亚湾之间的温达克，以种植玉米、住树皮长屋闻名，西边的蒂翁塔特人（又称佩顿人）说相近的方言。\n\n从17世纪20年代起，法国重整派和耶稣会传教士学习并记录温达特语，留下词典和语法书；1643年，让·德·布雷伯夫还用温达特语创作了《休伦圣诞歌》。\n\n疫病流行，加上1648至1650年海狸战争中被易洛魁联盟击败，温达特联盟瓦解：一部分难民在法国保护下定居魁北克附近的温达克，另一部分与蒂翁塔特人融合为怀安多特人。"
 bodh_gaya_desc: "摩诃菩提大寺标志着释迦牟尼在菩提树下证悟成佛的所在地。它最初由阿育王于公元前3世纪建造，随着时间推移，已经经历了数次修复工程。其独特的砖结构属于印度$buddhist_ADJ$寺庙建筑最早期的范例之一。\n\n菩提伽耶位于摩揭陀的帕尔古河畔，佛陀在世时称优楼频螺。悉达多·乔达摩在此经历六年苦行，又接受村女善生供养的乳糜，最后坐在神圣的榕树下证得中道、觉悟成佛。那棵树后称菩提树。周边圣迹对应他成道后在此停留的七周。\n\n5世纪的法显与7世纪的玄奘都曾记载这座繁盛的僧院中心。11至13世纪，摩揭陀的皮蒂帕蒂王公守护此地。\n\n12世纪末前后突厥人的入侵摧毁了这一佛教世界，荒废的遗址沉寂了数百年。菩提伽耶这一名称直到18世纪才通行，斯里兰卡、西藏、尼泊尔和缅甸的朝圣者维系着对圣地的记忆。"
 cholula_holy_city_desc: "[ShowLocationName('cholollan')]大金字塔历经数百年分阶段建造而成，供奉羽蛇神[ShowGodName('quetzalcoatl_god')]，是该地区规模最宏大的金字塔建筑。即便在城市衰落后，它依然是当地居民心中的圣地与文化象征。\n\n乔卢兰意为避难之地，是墨西哥中部最神圣的城市之一；后世说纳瓦特尔语的人把城中的大金字塔称作特拉奇瓦尔特佩特尔，即人造之山。从公元前3世纪到公元9世纪，六次营建把一座土坯金字塔层层包裹在另一座之中，形成世界体积最大的金字塔，朝向积雪覆盖的伊斯塔西瓦特尔火山。\n\n城市极盛时或有10万人口，但8世纪人口骤减，金字塔被弃置，信徒仍继续在周围安葬死者。12世纪托尔特克‑奇奇梅卡入侵者夺取城市后，另择地点新建了一座魁札尔科亚特尔神庙。\n\n1594年，西班牙人在树木丛生的金字塔顶建起雷梅迪奥斯圣母教堂，把圣所变为天主教朝圣地，而本土仪式仍在山坡上延续。"
 enryaku_ji_desc: "$enryaku_ji$由最澄和尚于公元788年在比睿山建造，成为日本[ShowReligionGroupName('buddhist')]$SECT_TENDAI_NAME$的总本山。这是一座强大的寺院，拥有数千名武僧，影响着[ShowLocationName('kyoto')]的事务。\n\n延历寺坐落于近江国边境，俯瞰京都。最澄在桓武天皇支持下，由此将中国天台教义传入日本；807年他为百名弟子授戒，令其闭关修行十二年。\n\n极盛时山内有约三千座子院。10世纪，天台宗因法统之争分裂为以延历寺为本山的山门派和以三井寺为本山的寺门派，武装僧众多次入京强诉。后来开创净土宗、净土真宗、曹洞宗和日莲宗的祖师，都曾在此修行。\n\n1571年，织田信长攻入比睿山，焚毁堂舍、屠戮僧众，只有13世纪的琉璃堂幸免。此后寺院逐步重建，德川家光于1642年再建正殿。"
 jerusalem_the_holy_city_catholic_desc: "$jerusalem$圣墓教堂建于4世纪君士坦丁大帝时期，建筑群涵盖各各他山与基督墓穴，自此成为[ShowReligionGroupName('christian')]世界的至高圣地与核心朝圣中心。虽历经多次损毁与重建，这座圣殿始终由$christian_ADJ$各教派共同守护。\n\n约135年，皇帝哈德良把受尊崇的墓穴埋在后来的圣墓教堂之下，其上建起阿佛洛狄忒神殿；君士坦丁的主教们清理场地后，在附近发掘出三个十字架，其中一个被认定为真十字架，新的巴西利卡于335年祝圣。\n\n614年，萨珊军队焚毁教堂并掠走真十字架，630年希拉克略将二者恢复。1009年，法蒂玛哈里发哈基姆下令拆毁教堂，重建工程于1048年完工。十字军重建教堂，工程在梅利桑德女王治下的1149年完成，把小堂统一在同一屋顶之下。\n\n1187年萨拉丁的军队占领教堂，但很快重新允许朝圣。1757年的现状协定确定了各教派的权利；1808年大火之后，圆形大厅与墓穴圣龛于1809—1810年重建。"
 kaaba_desc: "$kaaba$位于[ShowLocationName('mecca')]，更广为人知的名字叫做克尔白天房，其上覆盖着被称为罩幕的黑色锦幔，是[ShowReligionGroupName('muslim')]最神圣的圣地。所有$muslim_ADJ$信徒祷告时都要面朝这里。\n\n穆斯林认为克尔白是真主之屋，由易卜拉欣与其子易斯马仪修建。前伊斯兰时代，这里是古莱什人的圣所，供奉着360尊偶像；穆罕默德进入麦加后捣毁偶像，将圣殿重新奉献给真主。\n\n683年伍麦叶军队围攻麦加时大火焚毁殿身，693年哈里发阿卜杜勒‑马利克在古莱什旧基上重建，奠定了克尔白的立方体形制。930年卡尔马特派劫走黑石，直到952年才将其归还；1626年洪水毁墙后，奥斯曼苏丹穆拉德四世加以重修。\n\n环绕克尔白绕行七圈是朝觐和副朝的核心仪式，覆盖殿身的罩幕每年更换。"
 ranganathaswamy_temple_desc: "斯利兰加姆的兰加纳塔斯瓦米神庙是印度规模最宏大、地位最神圣的$hindu_ADJ$寺庙建筑群之一，供奉以兰加纳塔化身形态呈现的$vishnu_god$神。其起源至少可追溯至朱罗王朝早期，后期由潘地亚与毗奢耶那伽罗统治者进行扩建。截至1337年，该庙已成为南印度主要朝圣中心，以其广阔院落、宏伟的瞿布罗塔门和丰厚的宗教捐赠而闻名。\n\n斯里兰加姆是蒂鲁吉拉伯利附近、高韦里河与科利达姆河之间的岛上城镇，拥有毗湿奴派108处圣域中地位最高的一座：兰加纳塔神庙，供奉倚躺在神蛇舍沙身上的毗湿奴。\n\n11世纪起，导师纳塔穆尼、亚穆纳查里雅，尤其是罗摩奴阇，把这里建成室利毗湿奴派的大本营。灾难随德里苏丹国而来：1311年马利克·卡富尔的劫掠把金像掳走，1327年穆罕默德·宾·图格鲁克的入侵又使神庙荒废；1337年时，兰加纳塔神像正被人秘密辗转于各村之间。\n\n直到库马拉·坎帕纳率领毗奢耶那伽罗军队推翻马杜赖苏丹国，神像才于1371年重新安奉。此后两百年间，毗奢耶那伽罗诸王与其纳亚卡总督修筑城墙、扩建庙宇，增建瞿布罗塔门、千柱厅和粮仓。"
 temple_of_confucius_desc: "[ShowLocationName('qufu')]的$temple_of_confucius$最初建于公元前478年以纪念孔夫子。历朝不断扩建，使它成为了中国最大的寺庙建筑群之一。\n\n孔庙建于孔子故宅之上，公元前479年孔子去世后不久，鲁君便将故宅辟为祭祀之所。公元前205年汉高祖亲临曲阜祭孔，开创了皇帝祀孔的先例。\n\n原来的故宅在611年隋代重建时被拆除；1214年金朝时庙毁于火，到1302年元代已将建筑修复，1331年又仿照皇宫修筑围墙。1499年再遭火灾后，明代重建奠定了规模，九进院落和大成殿都仿效紫禁城。\n\n1724年火灾后的清代修缮于1730年完工。孔庙与孔府、孔林吸引历代士人官员前来瞻仰先师及其学说。"
 the_vatican_desc: "最初的[ShowLocationName('rome')]梵蒂冈圣伯多禄宗座圣殿由君士坦丁皇帝于公元4世纪在首任$catholic_pope$圣伯多禄的陵墓上建造。它成为了西方[ShowReligionGroupName('christian')]最重要的教堂，以及教宗权威的所在地。它也是[ShowReligionName('catholic')]的主要朝圣地之一。\n\n圣伯多禄大殿坐落在台伯河西岸，建在昔日尼禄竞技场的遗址上。君士坦丁一世的首座大殿建于318—322年。800年查理曼在此加冕为帝。\n\n846年撒拉森袭掠者洗劫圣所、破坏宗徒伯多禄的陵墓，促使教宗利奥四世修筑利奥城墙。到15世纪，老堂结构已岌岌可危，尼古拉五世继而尤利乌斯二世决定彻底重建。\n\n文艺复兴式大殿于1506年在多纳托·布拉曼特主持下开工；米开朗基罗1547年接掌设计，为教堂留下宏伟穹顶，整座建筑于1626年完工。随后詹洛伦佐·贝尼尼为教堂配上教宗祭坛上方的青铜华盖和殿前带柱廊的广场。"
 a_fat_roog_religion_desc: "$a_fat_roog_religion$$common_folk_religion_desc$\n\n鲁格至大教，意为“神之道”，是塞内冈比亚地区塞雷尔人的传统宗教。它以至高神鲁格和祖灵潘古尔为中心：潘古尔在生者与神之间代为说情，人们向他们奉上祭酒。\n\n塞雷尔人相信，正直者的灵魂进入贾尼乌，还可能转世，他们既不承认天堂，也不承认地狱。每个家族都有图腾，既是守护者，也是禁忌，例如乔夫家的图腾是羚羊。\n\n塞雷尔人和乔拉人是这一地区最晚接受伊斯兰教或基督教的民族。在锡内王国，旧信仰在19世纪顶住了马拉布特的军队；在瑙多鲁和恩加耶遭遇失败后，许多塞雷尔人宁死也不愿被征服。"
 abu_religion_desc: "$abu_religion$$common_folk_religion_desc$\n\n夸约禁戒信仰是夸约人的传统祖先崇拜；夸约人住在所罗门群岛马莱塔岛中部，以刀耕火种的方式种植芋头、山药和大蕉为生。人们相信死者仍有力量干预生者的事务，像拉阿卡这样强大的祖先力量尤其令人敬畏。\n\n生活受严格的禁忌约束，这种禁忌叫阿布，违犯者必须以献祭补救。夸约口述传统说，这片土地大约在十二至二十个世纪以前开始开垦。开垦过的地块以神龛标记，这些神龛为开垦者的父系后裔氏族确立了土地所有权。"
 abwoi_religion_desc: "$abwoi_religion$$common_folk_religion_desc$\n\n阿布沃伊崇拜是尼日利亚中部高原诸族的男性祖灵崇拜，奉行者有阿蒂亚普人和巴朱人等。人们认为这些灵是亡者的鬼魂或转世，各族对崇拜的起源各有一套说法，格翁人把它追溯到一个叫阿加比的村子，时间大概在19世纪。\n\n入会的男子遵守严格的禁忌，不得向妇女泄露崇拜的秘密，违者处死。阿布沃伊的地位在至高的天父阿格瓦扎之下，但作为更贴近人们的半神，它们能治病，危急时受人召请。\n\n每年4月雨季开始时，阿布沃伊被护送离开，让位于农事；此后若再听到它们的哭声，便预示瘟疫或旱灾。全社群每年还要举行一次共同礼拜。"
 adamawa_religion_desc: "$adamawa_religion$$common_folk_religion_desc$\n\n阿达马瓦信仰指乍得湖以南阿达马瓦高地和贝努埃河谷诸多非穆斯林民族的传统信仰，这片土地在民族、语言和宗教上都极为多样，其中大部分地区在1809年起的富拉尼人莫迪博·阿达马圣战中被征服，或沦为抓捕奴隶的对象。"
 adat_musi_religion_desc: "$adat_musi_religion$$common_folk_religion_desc$\n\n穆希教是苏拉威西北部塔劳群岛的一种宗教，由巴旺因·帕纳哈尔在萨利巴布岛的穆希村传授。信徒相信他从称为“马武·鲁阿塔”的神那里，经由名叫翁托阿的使者领受了启示。"
 adat_puun_religion_desc: "$adat_puun_religion$$common_folk_religion_desc$\n\n阿达普恩教是婆罗洲内陆肯雅人的传统万物有灵信仰，相信人死后会同祖先“特普恩”一起升入七重天阿洛马劳。基督教传教士到来后，旧有习俗曾一度以“邦安运动”的名义复兴。"
 ainu_religion_desc: "$ainu_religion$$common_folk_religion_desc$\n\n神威信仰是北海道、库页岛和千岛群岛阿伊努人的万物有灵信仰。自然中的一切都有一位神威，即灵或神。其中最重要的有：灶火女神“神威媪”；山熊神威，熊与山之神；以及阿埃奥伊纳神威，一位文化英雄，教会阿伊努人纺织和雕刻。\n\n阿伊努人没有专职祭司，仪式由村长主持，内容包括献酒、祈祷，以及献上附有木花的柳木棒，即伊瑙。人们相信熊是山神赐给人类的礼物，把毛皮和肉送到人间。\n\n13至17世纪阿伊努聚落的墓葬和房屋，都与这些信仰相符。1635年松前藩派出远征队前往库页岛之后，日本商人与阿伊努人的接触日渐密切。"
 ajok_religion_desc: "$ajok_religion$$common_folk_religion_desc$\n\n阿约克崇拜是奥图霍人（又称洛图科人）的传统信仰，奥图霍人是今南苏丹伊马通山区的尼罗特民族。它是一种以自然和祖先崇拜为基础的宗教。最高神是阿约克，他按自己的样子造出人类；对祈祷献祭的人他是仁慈的，但也会发怒。\n\n神话解释了死亡为何成为永久：阿约克应一位妇女的祈求救活了她死去的孩子，她的丈夫却在盛怒之下又杀死了孩子，阿约克发誓不再让任何奥图霍人死而复生，并离开了大地。奥图霍人说，降雨时是亡者的灵魂在替生者向阿约克恳求。"
 akan_religion_desc: "$akan_religion$$common_folk_religion_desc$\n\n阿科姆教是今加纳阿肯人的传统宗教，1337年信奉它的有博诺国博诺曼。它以一位遥远的创造者尼亚梅为核心：他和大地之母阿萨塞亚造出世界，把日常的事务交给次一级的神灵阿博松。\n\n阿博松与河流、山岭和森林相联系，由进入出神状态、替神灵说话的祭司阿科姆福侍奉。神灵住在神龛里，神龛是一只铜盘，盛着河石，人们用奠酒敬奉它。博诺人的传说称先民从阿莫维圣洞走出，塔基曼的阿波节纪念着这一传说。\n\n1723年阿散蒂攻陷博诺曼索；随着贩奴船，阿科姆教传到了远方：在牙买加，被奴役的阿肯人保留了阿博松的名字。"
 akinha_ekugu_religion_desc: "$akinha_ekugu_religion$$common_folk_religion_desc$\n\n双生创世神话是巴西中部欣古诸族的信仰，认为世界由两位兄弟般的创造者造出。在上欣古的卡马尤拉人当中，记载最清楚的一对兄弟是太阳与月亮，即神圣的孪生英雄夸特与雅伊。"
 akuj_religion_desc: "$akuj_religion$$common_folk_religion_desc$\n\n阿库吉教是图尔卡纳人的传统信仰。图尔卡纳人是图尔卡纳湖一带的半游牧民族，放养骆驼和瘤牛。在他们看来，宗教和文化浑然一体，每天的目标是求得生活的福祉：水、食物、牲畜和子嗣。\n\n阿库吉是唯一的至高存在，创造了世界，掌管这些福祉。祖先恩吉佩安被视为危险的力量，发怒的祖先会附在家人身上，要求献祭牲畜。\n\n关键人物是占卜师恩吉穆罗克，其中最受尊敬的在梦中得到阿库吉的启示，指明该献祭哪种牲畜。图尔卡纳人的传统认为，瘤牛带来了财富和势力，使他们战胜了其他阿特克尔人，到18世纪末又进逼西格尔人的高地。"
 alan_paganism_desc: "$alan_paganism$$common_folk_religion_desc$\n\n阿兰多神教是阿兰人的古老宗教。阿兰人是北高加索讲伊朗语的民族，他们的后裔是奥塞梯人。一般认为它起源于斯基泰人，后来的记载中有许多基督教成分，神灵往往以圣徒命名。这些神灵的故事交织在半神英雄纳特人的传说里。\n\n瓦斯蒂尔吉以圣乔治命名，是男子和旅人的保护者，也是誓言的保证人；瓦齐拉以先知以利亚命名，掌管雨、雷和闪电。天上的铁匠库尔达拉贡与纳特人为友。有些人能在梦中走到死者的草地库雷斯，带回幸运的种子。\n\n阿兰王国在10世纪初受拜占庭影响而基督教化。蒙古人于1239或1240年入侵，约1395年帖木儿又击溃了阿兰人。"
 aluk_religion_desc: "$aluk_religion$$common_folk_religion_desc$\n\n阿鲁克源自“阿鲁克·托多洛”，意为祖先之道，是苏拉威西岛南部高地托拉查人的传统宗教。他们相信人、水牛、稻谷、铁和雨，都是从天上降下来的。\n\n创世者是普昂·马图阿，他用一只陶罐造出八位始祖，并把名为“阿鲁克”的规矩赐给第一位始祖达图·劳库。他的后裔、第一个人彭·穆拉·陶沿着梯子降到人间。\n\n“兰布·索洛”葬礼是仪式的中心。尚未办过丧礼的死者仍被当作病人，像对待活人一样供给饮食、悉心照料；葬礼上向神灵和祖灵献祭，尤其是宰杀水牛，是期望得到更大的回报。"
 andamanese_religion_desc: "$andamanese_religion$$common_folk_religion_desc$\n\n安达曼泛灵论是安达曼群岛土著各族的万物有灵信仰，祖先崇拜在其中占有重要位置。他们的创造者是普卢加，他向最初的人类颁下诫命。\n\n据后世民族志学者记录的一个版本，一段幸福的日子因违反饮食禁忌而告终：吃了普卢加园子里不许吃的蔬菜。后来人们不遵守他的法则，普卢加便降下一场大洪水，只有两男两女幸存，他们还丢了火种；普卢加重新造出了植物和动物，却没有把火还回去。\n\n1789年起，英国人在群岛上建立殖民据点，带来肺炎、麻疹和流感的流行，毫无免疫力的岛民成批倒下；不出四年，南安达曼岛东南部人数众多的加洛瓦人聚落就因此人口锐减。"
 anglican_desc: "$anglican$是$christian$的一种形式，其国家元首同时也是教会的最高领袖。在神学与制度上，$anglican$保留了许多$catholic$的元素，同时也受到改革宗清教徒和欧洲大陆的$lutheran_ADJ$信仰的影响。\n\n圣公宗是亨利八世与罗马决裂后，从英格兰教会发展而来的。1534年，议会通过《至尊法案》，宣布他为教会的最高首脑。教会保留了主教和天主教礼仪的大部分，教义则来自宗教改革。\n\n爱德华六世时，托马斯·克兰麦写成1549年的《公祷书》，这是第一部完全用英语写的礼拜用书。伊丽莎白一世采用“最高管理者”的头衔，于1559年恢复公祷书，1571年通过的《三十九条信纲》确立了温和的改革宗教义。\n\n1640年代的内战推翻了这一教会；1660年王政复辟后，清教徒神职人员被逐出，1662年的公祷书成为教会的标准。1607年起，从弗吉尼亚的詹姆斯敦开始，英国殖民者把圣公宗的礼拜带到了海外。"
 anitism_religion_desc: "$anitism_religion$$common_folk_religion_desc$\n\n阿尼托泛灵论是菲律宾低地的本土信仰，以吕宋的他加禄人记载最详，西班牙传教士自16世纪70年代起便描述了他们敬奉精灵的仪式。它的根基是南岛语族的传统信仰，后来多半是间接经由与室利佛逝和满者伯夷的接触，吸收了印度教和佛教的成分。\n\n其最高神是创世之神巴塔拉，人们认为他太过遥远，不必为日常事务去打扰。人们转而向阿尼托献祭，阿尼托包括位阶较低的诸神、精灵，以及称为卡卢卢瓦的祖先亡魂。祭祀阿尼托的宴会由称为卡图卢南的女祭司主持，达图不在时她还可以代行其职。出行之前要观察被视为征兆的鸟，也就是蒂格马努卡南。\n\n西班牙征服之后，神像被销毁，传教士也向各村强行推广基督教，但许多仪式仍保存在天主教的习俗之中。"
 anna_religion_desc: "$anna_religion$$common_folk_religion_desc$\n\n阿拿教是库纳马人的传统信仰，库纳马人生活在今厄立特里亚与埃塞俄比亚边界的加什河与塞蒂特河之间。它以库纳马人的神阿拿命名，10世纪的阿拉伯地理学家伊本·豪卡勒就已记载他们崇拜这位神。"
 arat_sabulungan_religion_desc: "$arat_sabulungan_religion$$common_folk_religion_desc$\n\n萨布伦甘教是西苏门答腊外海明打威群岛上明打威人的传统信仰。据说明打威人在远古时代从尼亚斯岛迁来，一直与外界隔绝，直到1621年与荷兰人相遇。教名来自“萨布伦甘”，意为树叶，仪式上总要用树叶作为人与神灵之间的中介。\n\n万物都有灵。受到冒犯或被遗忘的神灵会带来疾病和厄运，所以明打威人对它们心怀感谢，只取所需。\n\n人们敬奉祖先，也敬奉森林和山岳之神泰卡莱卢以及赐予雨水和生命的天神泰卡马努阿。锡克雷是萨满和医者，与死者交谈，为人治病。逢“普嫩”，也就是全社群一起歇工的时期，谁也不干活。"
 arosi_religion_desc: "$arosi_religion$$common_folk_religion_desc$\n\n阿罗西泛灵论是所罗门群岛马基拉岛（圣克里斯托瓦尔岛）西部阿罗西人的传统信仰。它的主神是阿古努阿，又名哈图伊布瓦里，是宇宙之蛇和海神，其他诸神被认为只是他的不同侧面。每棵树上结的第一颗椰子都敬献给他，人们向他祈求健康和丰收。\n\n每个人有两个灵魂：善良的昂加在人死后离去，凶险的阿达罗则留下。阿达罗的亡灵可以附在动物、树木或石头里，只要说对祈求的话，就能命令它们远距离杀害或伤残活人。1568年，阿尔瓦罗·德·门达尼亚率领的西班牙人望见了马基拉岛。"
 arutam_religion_desc: "$arutam_religion$$common_folk_religion_desc$\n\n阿鲁塔姆精神是舒阿人信仰的核心，指一种灵视。舒阿人属希瓦罗语系，居住在安第斯山麓的雨林里，以勇武著称：1527年他们击败了瓦伊纳·卡帕克派来的印加军队，1599年又把西班牙人逐出自己的土地。\n\n传统上，男孩长到八岁左右，会被带到瀑布边，服用曼陀罗制成的迈库亚，希望看见阿鲁塔姆，即祖先灵魂瓦卡尼送来的异象。触到它便得到巨大的力量，拥有数个阿鲁塔姆的人刀枪不入，但这种力量可能失去。\n\n舒阿人不相信自然死亡。凡是无法解释的疾病，都被归咎于看不见的毒镖“岑萨克”，乌维欣萨满买下毒镖并加以驾驭。被杀敌人的灵魂穆伊萨克，则被认为留在缩制的人头“灿萨”之中。"
 asis_religion_desc: "$asis_religion$$common_folk_religion_desc$\n\n阿西斯教是卡伦津人的传统信仰。卡伦津人是肯尼亚大裂谷一带的南尼罗特民族，包括南迪人、基普西吉斯人和波科特人。信仰得名于太阳神阿西斯，他居于天上，是全能的至高神，也是正义的保证者。\n\n第二位大神是掌管雷雨的伊拉特，他住在深潭和瀑布里，被丢弃的衣服就是彩虹。南迪人把他分成两位：善的伊莱特·内米耶，远处的隆隆雷声是在驱走危险；恶的伊莱特·内亚，近处的炸雷是想下到人间杀人。\n\n卡伦津人不盖神庙，认为建筑会限制神的力量。各部落划出一座山头作祭祀之所，称为卡普科罗斯，由名叫蒂西克的祭司主持礼拜；每家屋门东侧有祈祷树或祭坛。"
 atakapa_religion_desc: "$atakapa_religion$$common_folk_religion_desc$\n\n阿塔卡帕信仰是阿塔卡帕人的传统信仰。阿塔卡帕人自称伊沙克，是路易斯安那和得克萨斯墨西哥湾沿岸的原住民，语言是孤立语。他们的诸支系包括阿科基萨、比戴、卡尔卡苏、奥佩卢萨和弗米利恩，分布在从特里尼蒂河到弗米利恩河的一带。"
 badimo_religion_desc: "$badimo_religion$$common_folk_religion_desc$\n\n巴迪莫在索托‑茨瓦纳语中意为祖先，是今博茨瓦纳、莱索托和南非一带的索托‑茨瓦纳人的祖灵崇拜。一般认为索托人和茨瓦纳人在14世纪前已经分化，两者都把对死者的敬奉放在宗教生活的中心。\n\n巴迪莫不单指死者，而是“活着的死者”，居住在地下世界，也惩罚惹他们不快的人。每年第一场雨之前，使团带着酿好的啤酒和宰杀的牲畜前往巴迪莫藏身的山丘，带回祖先的期望。\n\n1822年起，莫舒舒一世把逃避迪法卡内战乱的难民聚成巴索托王国；1824年，罗伯特·莫法特在茨瓦纳人中开办库鲁曼传教站。基督教没有完全取代巴迪莫，两者并存下来。"
 bahnar_religion_desc: "$bahnar_religion$$common_folk_religion_desc$\n\n巴拿泛灵论是越南中部高原的巴拿人信奉的传统万物有灵与多神信仰。巴拿人说孟‑高棉语系的语言，居住在嘉莱和昆嵩两省，也有支系分布到平定、富安等沿海省份。他们把诸神称作扬，向神致谢的大祭要刺杀一头水牛。\n\n巴拿人的支系约隆人把祭祀竹鼠的新年节庆当作大节，借此敬拜自然诸神。竹鼠取代了蛇成为圣物，因为村民发现蛇有时吃不饱，而竹鼠以树根为食，一年到头都不愁没有吃的。1771年西山起义兴起后，巴拿人的战士与色当人、嘉莱人的队伍一同加入西山军作战。"
 banda_religion_desc: "$banda_religion$$common_folk_religion_desc$\n\n班达泛灵论是中非共和国草原地带班达人的传统信仰。其中记载最清楚的习俗，是向祖灵献祭、祈求庄稼丰收；班达人还以雕刻礼仪用的木器和大型兽形裂缝鼓著称。"
 bantu_religion_desc: "$bantu_religion$$common_folk_religion_desc$\n\n班图拜物教是对中非、东非和南非讲班图语各民族传统信仰的统称，这些民族有几百个族群，信仰却有共同的主题。传统上，这些信仰靠口耳相传，而非经典。\n\n许多班图民族相信有一位至上神，名字叫尼扬贝或恩赞比之类，并敬奉祖先，认为祖先能与诸神交谈。在刚果人当中，创造者是恩赞比·安普恩古，但信仰的核心是祖先崇拜，称为“班加加”的医者要经过训练，才能与亡者沟通。"
 banunut_religion_desc: "$banunut_religion$$common_folk_religion_desc$\n\n巴奴努是班盖人众多传统传说的统称，班盖人居住在苏拉威西岛东岸外的班盖群岛。1365年满者伯夷诗人普拉潘卡已提到这片岛屿，称之为“本加维”；16世纪初特尔纳特着手组建班盖王国，该王国被称为伊斯兰王国。"
 bathou_religion_desc: "$bathou_religion$$common_folk_religion_desc$\n\n巴图教是阿萨姆布拉马普特拉河谷博多（又称博罗）人的传统信仰。教名可解作“巴”（五）和“图”（深），指空气、火、土、水、以太五大元素，它们由至高神巴图布赖，即“长者”所造。他的女儿买瑙守护稻田。\n\n神的化身是西久树，一种大戟属灌木，种在庭院里的祭坛上，四周用十八对竹片围起，每对代表一对小神。巴图教既无经典，也无神庙；祭司是男性的杜里和女性的杜迪尼。\n\n1515年科赫王国崛起后，把杜阿尔斯留作对非婆罗门文化开放的地区。印度教仪式在博多人中传开，一部分人加入了埃卡沙拉纳毗湿奴派，不过巴图教在许多家庭里延续了下来。"
 besavik_religion_desc: "$besavik_religion$$common_folk_religion_desc$\n\n贝沙威信仰是普南巴人的传统万物有灵信仰，普南巴人居住在婆罗洲岛上今天的沙捞越一带。后来，普南巴人也接受了与肯雅人共有的邦安教。"
 bimoism_desc: "$bimoism$$common_folk_religion_desc$\n\n毕摩教是云南、四川、贵州山区彝族的本土宗教，得名于毕摩，即萨满祭司，也是精通彝文经书的人。只有能读彝文的毕摩才能举行与死亡相关的仪式。\n\n彝人敬奉祖先，崇拜火、水和天空之神，也崇拜龙，视龙为抵挡带来疾病的鬼怪的守护者。人们认为每个人有数个灵魂：一个留下守护坟墓，另一个转生为某种活物。\n\n彝族传说里有英雄支格阿鲁，他是龙与鹰之子，射落了多余的太阳。每年农历六月二十四日的火把节，纪念的是用松木火把烧死蝗虫的大力士阿体拉巴。"
 blang_religion_desc: "$blang_religion$$common_folk_religion_desc$\n\n布朗人元代称蒲人，是滇南的孟高棉语族民族，据后世的记载，万物有灵、祖先崇拜和上座部佛教在他们当中并存。他们的宗教生活格外注重稻米、水、蜜蜂、蜂蜡，以及与它们相关的地方神灵。\n\n布朗人的节日大多与宗教活动有关。祭寨神在农历一月或六月择日举行，为期三天：杀一只鸡，在村寨四周和中心滴水祭祀，青年们去挖竹鼠，用竹鼠肉敬神，祈求风调雨顺、人畜平安。最隆重的是桑衎节，人们迎接太阳，到佛寺浴佛。"
 bogomilism_desc: "$bogomilism$是$christian$的一个新诺斯替主义与二元论分支，其教导存在分为灵性领域与物质领域。其信徒将身体视为神圣的殿堂，并通过净化仪式努力接近上帝。这些实践包括禁食、舞蹈以及拒绝物质享受，以专注于灵性成长。\n\n鲍格米勒派10世纪兴起于第一保加利亚帝国，创始人是神父鲍格米尔，起源地大概在马其顿一带。它受到保罗派的影响。鲍格米勒派信徒相信，上帝创造了精神世界，物质世界则是上帝的堕落之子撒旦所造，因此肉体是魔鬼的作品；他们通过禁食和祈祷来追求洁净。\n\n他们否定教会的等级制度、十字架和修道制度，把主祷文奉为抵御撒旦的最强武器。这一运动也促成了西欧的卡特里派。\n\n保加利亚、塞尔维亚和拜占庭在12、13世纪镇压了鲍格米勒派，但它仍存留在胡姆和波斯尼亚，匈牙利人借异端之名发动十字军。1463年奥斯曼人征服波斯尼亚之后，它几乎没有留下什么痕迹。"
 bon_desc: "苯教起源于$buddhist$传入$tibet_region$地区之前的宗教传统，后来深受$tibetan_buddhism$的影响。它与$SECT_NYIGMA_NAME$尤为接近，但仍保留了许多前$buddhist$时期的元素。其教义专注于业力与轮回，以及实现觉悟的途径。\n\n苯教据说来自古象雄王国。佛教传入以前，被称为“苯”的祭司为雅砻诸王主持仪式。苯教徒把教法追溯到佛陀敦巴辛饶，认为它曾被迫转入地下，经典被当作伏藏埋藏起来，留待后世发掘。\n\n被称为雍仲苯教的有组织的传统在10至11世纪成形，与宁玛派出自同一批密咒仪轨世家。僧人年美·喜绕坚赞于1405年创建曼日寺，为苯教确立了寺院教育的体系。苯教被佛教各派挤向边缘，主要存续在康区和安多。五世达赖喇嘛正式承认苯教为藏人的宗教。"
 bori_religion_desc: "$bori_religion$$common_folk_religion_desc$\n\n博里，又称马古扎人的宗教或豪萨泛灵论，是西非豪萨人的传统宗教，以魔法和灵附身于灵媒为基础。直到18世纪末，豪萨人中只有一部分，主要是城市精英，接受了伊斯兰教，王廷里实行的是二者的混合。女性作为博里的女祭司，担任有权势的顾问。\n\n19世纪初的穆斯林学者谴责这种混合的信仰，奥斯曼·丹·福迪奥在1800年前后发动的圣战建立了索科托哈里发国，并以此为理由推翻了豪萨诸苏丹国。博里被部分压制，但附身仪式在孔尼和多贡杜奇等避难邦国得以保留。"
 bosnian_church_desc: "$bosnian_church$是$catholic_ADJ$会的分裂教派，由于长期与主流基督教隔离，发展出了独特的神学。它着重于末日主题，拥抱神秘主义，同时保留了许多早期$christian$的古老实践。这些特质导致$catholic_ADJ$会与$orthodox_ADJ$会都将其谴责为异端。\n\n波斯尼亚教会存在于13至15世纪的波斯尼亚。波斯尼亚名义上属于天主教，13世纪前期，匈牙利任命的主教退居到贾科沃，总督和贵族改由自己选举主教，主教区就此同罗马决裂。\n\n教会的首领称“祖父”。教会保持斯拉夫语礼拜。人们长期把它等同于鲍格米勒派，大多数学者现在对这一联系持怀疑态度。\n\n匈牙利国王一再以异端为借口发动十字军；1291年教宗尼古拉四世派来了宗教裁判所。1459年，国王托马斯为争取教廷支持以对抗土耳其人，转而迫害该教会，教会被拆散；1463年，奥斯曼人攻占波斯尼亚。"
 bru_religion_desc: "$bru_religion$$common_folk_religion_desc$\n\n布鲁泛灵论是布鲁人的传统万物有灵信仰。布鲁人说卡图语支的语言，村落多沿河而建，分布在越南的广平、广治两省山地，老挝的沙湾拿吉和泰国的沙功那空。他们敬奉祖先以及稻谷和火的神灵，并把古代武器和日用器物的遗物与残片视为圣物；在较传统的村子里，头人往往同时是全村的精神顾问。\n\n布鲁人的口传故事把野兔写成最聪明的动物，把老虎写成英雄。广平省布鲁人的一支马孔人，在正月十六敲鼓庆祝，迎接新月。"
 bua_religion_desc: "$bua_religion$$common_folk_religion_desc$\n\n布阿泛灵论是乍得南部说布阿语支的各族的传统信仰，这些族群包括布阿人、法尼亚人和涅利姆人，居住在沙里河与盖拉山地之间。"
 buton_religion_desc: "$buton_religion$$common_folk_religion_desc$\n\n布敦泛灵论是东南苏拉威西外海布敦岛上沃里奥王国在伊斯兰教传入前的传统信仰。14世纪前后，诸小邦推选瓦·卡卡为第一位统治者；王国后来在拉·基拉蓬托治下改信伊斯兰教。"
 buyli_religion_desc: "$buyli_religion$$common_folk_religion_desc$\n\n布格利崇拜是加纳北部达贡王国达贡巴人的古老宗教。在纳·格贝瓦的后裔把达贡巴人统一在一位国王之下以前，各城镇由土地祭司廷达纳领导，他们安抚地神、诸神和偶像。火节布古姆·丘古是达贡巴历新年的第一个节日，据说可追溯到那个时代。\n\n贡贾人进攻之后，亚·纳的宫廷迁到延迪，穆斯林迪尤拉人和豪萨人聚集在国王周围，为他做护佑祈祷；到1788年，延迪据说比库马西和萨拉加还大。廷达姆巴仍在首领身旁保有祭祀上的地位。"
 cahita_religion_desc: "$cahita_religion$$common_folk_religion_desc$\n\n卡希塔信仰是卡希塔诸民族的传统信仰，亚基人、马约人和特韦科人都在其中，他们在索诺拉和锡那罗亚的河谷里务农。耶稣会传教士从17世纪起对他们作了详细记录，数出五个主要部族：锡那罗亚、奥科罗尼、苏亚克、马约和亚基。\n\n他们崇拜风、水、大地、太阳和海洋等自然力量，向它们献祭，祈求丰收和渔获。在这些力量之上，他们相信有一个更高的存在，创造了万物。\n\n他们的仪式简单，没有繁复的礼节。医者通晓草药，用带有浓厚宗教色彩的方法治病，威望很高，耶稣会士既称他们为巫师，也称他们为政治领袖。"
 calvinist_desc: "$calvinist$以约翰·加尔文命名，是新教的重要分支，根植于崇拜简朴与圣经至上的原则。其教义强调预定论，主张上帝已预先决定了所有造物的命运。\n\n加尔文宗又称改革宗，源于乌利希·慈运理和海因里希·布林格在瑞士开创的宗教改革。法国人约翰·加尔文于1536年发表《基督教要义》，并使日内瓦成为这一宗派的中心。崇拜不用圣像；基督在圣餐中是属灵地而非肉身地临在；教会由牧师和选举产生的长老共同治理。\n\n1550年以后，加尔文宗传播甚广。1563年制定了《海德堡教理问答》；1560年，纳瓦拉女王让娜·达尔布雷公开皈依加尔文宗；法国胡格诺派在1562至1598年的宗教战争中作战。荷兰改革宗教会于1571年采纳了信仰标准，1619年的多特会议则在预定论问题上谴责了阿明尼乌派。"
 catharism_desc: "$catharism$是一个二元论宗教派别，相信存在两位神：一位是仁慈的天堂之神，另一位是邪恶的对立神。其追随者过着禁欲生活，认为灵魂被困在肉体中是宇宙斗争的一部分。通过严格纪律实现的灵性净化被视为唯一的救赎之路。\n\n清洁派于12世纪出现在莱茵兰、法国北部、朗格多克和意大利北部；最早的确切记载来自1143年的科隆。清洁派之名源自希腊语中表示“纯洁者”的词，他们很可能受到巴尔干鲍格米勒派的影响。\n\n灵魂不断转世，直到获得解脱。只有领受了“安慰礼”的“完人”才确定能回到神的身边。\n\n1208年，英诺森三世宣布发动阿尔比十字军，十字军于1209年出征，到1244年，清洁派在朗格多克已转入地下。宗教裁判所继续追捕幸存者，他们在当地坚持到1325年前后，在意大利城市则延续到14世纪。"
 catholic_desc: "$catholic$由教宗领导，以尼西亚信经为基础，是$christian$最大的教派，教宗被视为圣伯多禄的宗教继承者。教宗既是教会的领袖，也是$christian_ADJ$统治者之间冲突的调解者。其教义与传统塑造了西方世界的大部分宗教与文化历史。\n\n教宗是罗马主教，天主教会认为主教是使徒的继承者。1337年，几乎整个拉丁欧洲都信奉天主教。\n\n崇拜以弥撒为中心，经祝圣的饼和酒成为基督的身体和血，圣事共有七件。1054年的大分裂使天主教会与东正教会彻底分道扬镳。\n\n1309至1376年，教宗居住在阿维尼翁；从1378年起几位教宗人选并立，教会分裂，直到1414至1418年的康斯坦茨会议才结束。1517年路德发表《九十五条论纲》，北欧大部分地区不再服从罗马；1545至1563年的特伦托会议主导了反宗教改革，西班牙和葡萄牙的传教士则把这一信仰带到美洲和亚洲。"
 cebil_religion_desc: "$cebil_religion$$common_folk_religion_desc$\n\n塞比尔灵媒信仰是阿塔卡马人的宗教。阿塔卡马人在今智利北部、阿根廷西北部和玻利维亚南部的阿塔卡马沙漠与高地上耕种绿洲、放牧美洲驼。信仰的核心是吸食塞比尔，一种致幻的鼻烟，放在雕刻的小木板上，用吸管吸入。\n\n萨满靠它占卜、接触神灵，吸食者被认为能获得鸟、猫科动物和蛇的力量。这些木板在蒂亚瓦纳科的影响下，于900—1200年间传开。\n\n阿塔卡马人相信有许多神灵居住在利坎卡武尔火山上，也相信死后另有生活。15世纪图帕克·尤潘基征服他们之后，他们接受了印加的太阳崇拜。1536年，迭戈·德·阿尔马格罗率领的西班牙人抵达。"
 chango_religion_desc: "$chango_religion$$common_folk_religion_desc$\n\n昌戈人是对沿太平洋海岸分布的渔民群体的统称，从秘鲁南部一直到智利中北部的阿塔卡马沙漠沿岸。高地居民把沿海的雾叫作卡马恰卡，他们因此也被称为卡马恰科人，后来西班牙人称之为昌戈人。他们猎捕海狮，乘海狮皮制的筏子捕鱼，生活方式源于古老的钦乔罗传统。\n\n关于他们的信仰，只留下了零星的记载。海被敬奉为海母，死者连同渔猎用具一起下葬，说明他们相信死后还有另一种生活。"
 chanka_religion_desc: "$chanka_religion$$common_folk_religion_desc$\n\n昌卡人是居住在秘鲁安达瓦伊拉斯和阿亚库乔高地的农耕民族，他们的酋邦结成松散的联盟。统治者是上昌卡的乌斯科维尔卡和下昌卡的安科维卡两位首领，对祖先的崇拜也由此得名。\n\n昌卡人自称起源于今万卡韦利卡境内的两座湖泊。乌斯科维尔卡据说制成木乃伊保存下来，在都城瓦曼卡尔帕受人崇敬，直到印加时代。战士把祖父们的木乃伊扛在肩上上阵，脸上涂彩，作战时尖声呐喊，他们的神是一种猫科动物。\n\n1438年，昌卡人进攻库斯科，被印加王子库西·尤潘基击败，库西·尤潘基后来成为帕查库特克。下昌卡臣服于印加。"
 cheke_holo_religion_desc: "$cheke_holo_religion$$common_folk_religion_desc$\n\n切克霍洛泛灵论是所罗门群岛圣伊莎贝尔岛上说切克霍洛语（又称马林格语）的居民的传统信仰。1568年，阿尔瓦罗·德·门达尼亚的西班牙人在这座岛上登陆，这是欧洲人首次在该群岛登陆，他们还在岛上造了一艘小船，用来勘测附近海域。"
 chibcha_religion_desc: "$chibcha_religion$$common_folk_religion_desc$\n\n奇布查宗教是穆伊斯卡人的宗教，穆伊斯卡人在西班牙征服前居住在哥伦比亚安第斯山脉中部的高原上。至高之神是奇米尼加瓜，他创造了光和大地，但并不直接受人崇拜；人们崇拜的是月亮女神奇亚和她的丈夫、太阳神苏埃。\n\n穆伊斯卡人在瓜塔维塔湖等湖泊和苏加穆西的太阳神殿供奉神灵。祭司主持献祭，有时用活人。有一则传说讲，教人享乐、音乐和舞蹈的女神惠塔卡反抗文化英雄包查卡，被变成了猫头鹰，或者变成了月亮。\n\n1530年代贡萨洛·希门尼斯·德·克萨达征服此地后，饰满黄金的神殿催生了黄金国的传说。最后一次公开的宗教仪式于1563年12月27日在乌巴克举行。"
 chichimecah_religion_desc: "$chichimecah_religion$$common_folk_religion_desc$\n\n奇奇梅克宗教是纳瓦人称为奇奇梅克的各族群的传统信仰，他们是北部高地的猎人和农民，其中有梅茨蒂特兰的奥托米人。云蛇米斯科亚特尔是狩猎与银河之神，既是奇奇梅克人和奥托米人的守护神，又以卡马什特利之名成为特拉斯卡拉和韦霍钦戈的主神。梅茨蒂特兰是阿兹特克人始终未能征服的奥托米邦国，崇拜月神扎纳。\n\n16世纪后期的西班牙作者说，奇奇梅克人不像邻族那样崇拜偶像，却会用动物献祭。1550年开始的奇奇梅克战争，以和约和土著人口并入新西班牙而告终。"
 chincha_religion_desc: "$chincha_religion$$common_folk_religion_desc$\n\n钦查人是秘鲁海岸钦查河谷一带的航海和贸易民族，王国在14至15世纪十分兴盛。他们相信自己是美洲豹的后裔，因而好战而强横，崇拜美洲豹神。\n\n主神是钦查卡马克，他的神谕所很富有，设在拉森蒂内拉大型土坯金字塔群附近。在太平洋上航行的商人敬奉一颗叫钦德里的星，可能用来导航；据说诸神来自一座叫乌尔皮瓦查伊的圣岛，意为“生出鸽子的女神”。\n\n印加在帕查库特克治下和平地把钦查纳入帝国，但钦查的领主仍保留了很大的自治权。1532年，钦查领主乘轿前往卡哈马卡会见皮萨罗，并在那里被杀。"
 chukchi_shamanism_desc: "$chukchi_shamanism$$common_folk_religion_desc$\n\n楚科奇萨满教是楚科奇人的传统信仰。楚科奇人分布在西伯利亚东北端，内陆苔原上的驯鹿牧民和沿海的海兽猎人都属于这一族。他们认为一切物体，无论有没有生命，都有精灵；有些神话还反映出二元对立的宇宙观。\n\n楚科奇人往往没有正式的政治组织，却有一套正式的宇宙等级。一位萨满曾对民族志学者博戈拉兹说，灯会走动，房屋的墙壁各有声音，连影子也自成部落，在自己的国度里居住。\n\n人们说，萨满是被精灵、梦境或预兆召唤的。作法时他们陷入昏迷状态，有时借助致幻的蘑菇，据信还能飞行、驱邪和治病。有些萨满改着女装、承担女性的角色，甚至可以与男子成婚。"
 chutia_religion_desc: "$chutia_religion$$common_folk_religion_desc$\n\n久蒂亚泛灵论是久蒂亚人的民间信仰。久蒂亚人是博多—卡恰尔族群，在阿萨姆上游萨迪亚一带建有王国。他们崇拜本原男神昆迪—马马和本原女神凯切—凯蒂，女神的祭祀由后来被称为代奥里人的祭司阶层主持。\n\n仪式带有部落密教色彩。在久蒂亚诸王在位时为国家平安举行的德奥—库贝尔仪式上，人们为库贝尔和昆迪点起陶灯，并向吉拉—吉拉西献祭一对鸭子；丹戈里亚等村落之神则在传说中神灵所栖的树下受到祭祀。\n\n14世纪晚期的碑文显示国王已转信毗湿奴派，一部分久蒂亚人也接受了印度教。1523年阿洪人吞并王国后，没有改宗的人在17世纪被引入埃卡萨拉纳派。"
 coahuilteco_religion_desc: "$coahuilteco_religion$$common_folk_religion_desc$\n\n科阿韦尔特科信仰是科阿韦尔特科人的传统信仰。科阿韦尔特科人是一个松散的狩猎采集群体网络，游走在科阿韦拉、塔毛利帕斯和得克萨斯南部。他们有时大批聚集，举行称作米托特的通宵舞会，一边跳舞，一边服用佩奥特仙人掌作为药物。\n\n1580年起，新莱昂总督卡瓦哈尔及其手下为掠奴袭击格兰德河沿岸的各群体。1718年，西班牙创建圣安东尼奥·德·巴莱罗传教站，即后来的阿拉莫，向他们传教，连同后来的四座传教站，鼎盛时容纳了约1200名科阿韦尔特科人和其他印第安人。逃离的人很多，1739年起的天花又使人口进一步减少，圣安东尼奥的传教站于1824年被世俗化。"
 cwezi_religion_desc: "$cwezi_religion$$common_folk_religion_desc$\n\n契韦齐信仰是对契韦齐的崇奉。契韦齐是半传说性的氏族，据说是非洲大湖地区基塔拉帝国的第二个统治王朝。鲁塔拉各民族把他们当作祖灵敬奉，传说这些灵留印在该地区的山丘和湖泊之上。\n\n传说称穆本德是他们的第一个都城，说他们是技艺高超的铁匠，他们的神龛也与铁器和铁砧相关。契韦齐的灵媒反对后来的各个王朝，比如以畜牧为业的比托氏族。"
 degar_religion_desc: "$degar_religion$$common_folk_religion_desc$\n\n德加泛灵论是德加人的传统泛灵信仰。德加人又称高地民族，是越南中部高原上讲南岛语和南亚语的山地民族，包括嘉莱人、埃德人和巴拿人。以水牛献祭是他们的习俗，与欧洲人的接触则始于16世纪的葡萄牙传教士。"
 dene_religion_desc: "$dene_religion$$common_folk_religion_desc$\n\n德内人是加拿大西北部说阿萨巴斯卡语的诸族群，分布在从麦肯齐河谷到育空的地区。其中的格威奇因人讲述，他们的祖先和驯鹿原本是同一个整体，这种动物既是他们故事的核心，也是生计所系。"
 dene_shamanism_desc: "$dene_shamanism$$common_folk_religion_desc$\n\n阿萨巴斯坎萨满教是阿拉斯加内陆阿萨巴斯卡人的传统泛灵论和萨满信仰，塔纳纳人、格威奇因人等都属于这一群体。人们认为万物和部分器物都有活跃的灵魂，动物的灵魂若被冒犯，就会躲开猎人。因此，怎样猎杀和对待动物都有严格的规矩，比如杀死狼的人，应先向它道歉再去碰它的身体。\n\n萨满是核心的宗教人物。他或她抵御恶灵，诊断疾病并使病人康复，在猎物稀少时还能烧灼肩胛骨，据裂纹占卜猎物的方位。\n\n冬季的夸富宴，尤其是葬礼夸富宴，标志着死者离开人世。俄国东正教、天主教和圣公会的传教士使阿萨巴斯卡人改宗，萨满活动受到压制。"
 dene_totemism_desc: "$dene_totemism$$common_folk_religion_desc$\n\n阿拉斯加内陆的塔纳纳阿萨巴斯卡人，社会分为八九个母系氏族，归入乌鸦和海鸥（或狼）两个外婚半族，人必须与对方半族的人通婚。"
 dimasa_religion_desc: "$dimasa_religion$$common_folk_religion_desc$\n\n戴科泛灵论是底马撒人古老的万物有灵和萨满信仰。底马撒人即卡恰尔人，居住在丹西里河谷和阿萨姆山地。典型的底马撒村寨既没有偶像，也没有神庙；人们认为大地、空气和天空中充满看不见的神灵，称为马代。\n\n六位祖先神作为地域神掌管整片国土，他们没有固定建筑的圣所叫戴科，一般认为共有十二处，词义为“神的居所”。凯切—凯蒂是卡恰尔人的守护女神，在萨迪亚有一处神庙。\n\n1520年国王科拉法在迪马布尔铸造了布拉马普特拉河谷第一枚印度教式钱币，上面写有昌迪女神之名。19世纪，卡恰尔平原上的底马撒人改信印度教，山区的底马撒人则保持古老信仰。"
 dogon_religion_desc: "$dogon_religion$$common_folk_religion_desc$\n\n多贡人的村落依傍马里的邦贾加拉悬崖，传统上认为他们为躲避伊斯兰化而退居于此，15世纪抵达桑加地区。他们认为独一的造物主阿马创造了世界，努莫是一对水灵，上半身如人、下半身似蛇，是祖先般的存在。\n\n人们用面具舞蹈纪念亡者。每隔60年的西吉节，各村都要制作新的大面具，纪念最初那位以蛇形死去的祖先。\n\n铁匠据说是第一位铁匠的后裔，在生者、祖先与阿马之间斡旋。穆斯林奴隶贩子和圣战者把多贡人当作可以劫掠的异教徒，悬崖庇护了他们的村落。"
 doi_wahire_religion_desc: "$doi_wahire_religion$$common_folk_religion_desc$\n\n谢伦特人自称阿克韦，居住在巴西中部托坎廷斯河右岸。他们的二元宇宙观以创世神话为基础，神话以一对栖居在太阳和月亮之中的神话英雄为中心。\n\n这一对英雄也把族人一分为二。社会分成两个族外婚的半偶族，太阳半偶族叫多伊，月亮半偶族叫瓦雷，各由三四个氏族组成，男子必须娶另一半的女子。谢伦特人把村庄排成半圆形。17世纪，耶稣会传教士和深入内陆的旗队探险者来到他们那里。"
 dongba_religion_desc: "$dongba_religion$$common_folk_religion_desc$\n\n云南西北部丽江一带的纳西人，也把自己的祭司称作东巴。据说这一信仰源自西藏的苯教，纳西族传说，一位来自西藏东部的苯教巫师东巴什罗把这套教义带到了云南。\n\n东巴祭司举行各种仪式来安抚自然界的诸多神灵，包括祭天和丧葬。这一信仰的核心，是认为人与自然是同父异母的两兄弟。只有祭司掌握象形的东巴文。\n\n纳西人的中心丽江于1253年归附忽必烈，1382年起由世袭的木氏土司在明朝治下统治，直到1723年清廷取代他们。纳西人的寺庙把东巴艺术与佛教艺术结合。"
 donyi_polo_religion_desc: "$donyi_polo_religion$$common_folk_religion_desc$\n\n阿鲁纳恰尔的塔尼诸族，即阿迪人、加洛人、尼西人、阿帕塔尼人、塔金人和米星人，都自称是祖先阿博塔尼的后裔；冬尼波罗意为“日月”，是后来人们给他们的万物有灵信仰起的名字。这些信仰是各地口传的神话，没有经典，没有祭司等级，也没有固定的神庙。\n\n巫师尼布在村里或家中主持仪式，需要时才搭起祭坛，事后拆掉。人们称太阳多尼为母亲，月亮波罗为父亲，请他们为真话作证，惩罚说谎的人。敏荣和帕达姆两支阿迪人说，创造者是塞迪，他的双眼变成了日月；加洛人则称他为吉米。"
 dreamtime_religion_desc: "$dreamtime_religion$$common_folk_religion_desc$\n\n澳大利亚原住民的这种世界观，瓦尔皮里人称作朱库尔帕，英语称作梦创时代。在其中，大地由祖先神灵创造并居住过，这些祖先往往身形英雄般高大，或拥有超自然的力量。每个地方、每种生灵的意义，都来自它们在梦创时代的起源，乌鲁鲁等一些地方更有特殊的灵力。梦创不是遥远的过去，而是持续不断的现实，人类学家威廉·斯坦纳把它称作“无时不在”。\n\n一个人可以拥有自己地域的某一种梦创，比如袋鼠梦创或蜜蚁梦创，他的祖先通过它连成一个不断的循环，一切知识都来自这里。英语里的“梦创时代”译自阿伦特语中的一个词，有些学者认为这个词的意思更接近“永恒、未被创造”。"
 druzism_desc: "尽管$druzism_ADJ$起源于$ismaili_school$，但其信徒并不自视为$muslim_ADJ$。除了明显的$muslim$影响外，它还受到其他亚伯拉罕宗教与非亚伯拉罕宗教的影响，形成了一种强调神秘主义与“宇宙心智”的独特信仰，认为所有灵魂在多次转世后将回归其中。\n\n德鲁兹派于1017至1018年兴起于法蒂玛王朝治下的开罗，当时伊斯玛仪派传教士哈姆扎·伊本·阿里在哈里发哈基姆的庇护下开始宣讲真主独一的教义。这一信仰认为神通过流溢与世界相联，“宇宙心智”即在其中，灵魂不灭。\n\n这一信仰没有神职人员，只有少数入门者才能知晓其奥秘，自1046年起不再接纳皈依者。德鲁兹人定居在黎巴嫩山和叙利亚南部。1305年，马穆鲁克在凯斯鲁万击败他们，迫使其表面上顺从逊尼派；1585年等奥斯曼人的远征也攻击过他们。"
 dua_nggae_religion_desc: "$dua_nggae_religion$$common_folk_religion_desc$\n\n弗洛勒斯岛中部恩德‑利奥地区的利奥人说，他们的第一批人从勒彭布苏山降下，每个村寨由称为“莫萨拉基”的首领主持。至高无上的是至高神杜阿·恩加埃，人们在称为“康加”的仪式场地上、围着竖石向他献祭。其下有最令人畏惧的灵体尼图帕伊，以及必须敬奉的祖先。\n\n每年田间仪式“卡波奥”之后，莫萨拉基和农人共进一餐，以供养祖先、驱除虫害和疾病。16世纪起，香料贸易给弗洛勒斯带来印度和葡萄牙的影响，利奥人后来多数转信天主教和伊斯兰教。"
 ebore_religion_desc: "$ebore_religion$$common_folk_religion_desc$\n\n埃博里属于加纳北部讲关语的贡贾人，贡贾王国由苏迈拉·恩杜拉·贾克帕于1675年创建。平民多信万物有灵，统治阶层和商人则是穆斯林，18世纪伊斯兰教在贡贾人中传播开来。"
 emit_religion_desc: "$emit_religion$$common_folk_religion_desc$\n\n塞内加尔和冈比亚的乔拉人传统上承认唯一的神埃米泰，又称阿塔·埃米泰，意为宇宙的主人，并把他同天空、雨水和岁时流转联系起来。他们敬重护符和圣域而不加崇拜，又认为名为巴金或埃内尔蒂的灵守护家庭、村庄和稻田，甚至能保护人们不被迫皈依伊斯兰教和基督教。\n\n葬礼不可缺少，因为没有葬礼，灵魂就不能到达造物主身边、与祖先团聚。多数乔拉人社会没有首领，有的地方如乌苏耶则有一位国王，作用更像祭司而不是统治者。有些乔拉人到19世纪索宁凯与马拉布特战争之后才接受伊斯兰教。"
 enggano_religion_desc: "$enggano_religion$$common_folk_religion_desc$\n\n苏门答腊西南海岸外恩加诺岛上的恩加诺人，在16世纪初最早遇到了葡萄牙探险家。他们的信仰融合了泛灵论、图腾崇拜和祖先崇拜，在岛上的一些地方，这些信仰在接触之后仍长久延续。"
 erzya_religion_desc: "$erzya_religion$$common_folk_religion_desc$\n\n埃尔齐亚人是伏尔加河中游的莫尔多瓦人的一支，说乌拉尔语系的语言。他们的传统把尼什克，又称尼什克帕兹，奉为创始神。\n\n埃尔齐亚神话里，诸位主神是从一枚蛋中孵化出来的。安盖·帕蒂艾是众神之母，其后是太阳神奇帕兹，他生下了尼什克帕兹、大地神马斯托龙·基尔季和风神瓦尔曼帕兹。奇帕兹与丰收之母诺罗瓦瓦生下冥界之主马斯托尔帕兹。\n\n13世纪，莫尔多瓦人受金帐汗国统治，1552年俄国攻占喀山后，他们全都成了俄国的臣民。俄国东正教以强迫手段使他们改宗，17世纪尤其明显，但仍有少数村庄保留了旧信仰。"
 eso_religion_desc: "$eso_religion$$common_folk_religion_desc$\n\n埃索属于多哥北部山地农民卡比耶人。卡比耶青年要经过一周的隔离、翻越三座山的朝圣、埃瓦拉摔跤节，最后是割礼，才算成年。"
 fang_religion_desc: "$fang_religion$$common_folk_religion_desc$\n\n芳人是务农狩猎的森林居民，分布在赤道几内亚木尼河地区、加蓬北部和喀麦隆南部，他们把至高的创世神称为梅贝格，又称恩泽梅。在芳人的一种说法里，他起初只有一只名叫迪博比亚的蜘蛛作伴，蜘蛛劝他创造大地。\n\n梅贝格造出一枚蛋，由迪博比亚放入海中，孵出三位神：长子扎梅与太阳相关，他的妹妹尼因万与丰产和月亮相关，最小的恩洛纳则象征邪恶。芳人的宗教生活以敬祖为中心，祖先的头骨和骸骨存放在木盒里，由比耶里圣物匣木雕守护。"
 fomba_gasy_religion_desc: "$fomba_gasy_religion$$common_folk_religion_desc$\n\n丰巴加西意为“马达加斯加的习俗”，在马达加斯加各族中靠口传故事代代相传。它没有统一的教会。\n\n创世神是掌管天空的扎纳哈里，他赋予生命，死者的灵魂回到他那里；大地神拉托万塔尼用黏土塑造人的身体，人死后身体又归他所有。祖先通常是庇佑生者的力量，但被怠慢的亡灵会变成作祟的安加特拉，所以人们举行翻尸节，用新布重新包裹先人的遗体。\n\n伊默里纳的梅里纳诸王自称有岛上最早居民瓦济姆巴人的血统：安德里亚马内洛的母亲拉福希是瓦济姆巴女王。他的儿子拉兰博在位于1575—1612年，崇奉保护王国的王室护符桑皮。"
 formosan_religion_desc: "$formosan_religion$$common_folk_religion_desc$\n\n台湾南岛语诸族的信仰从来不是一个体系：各族有各自的神灵、神明、象征和神话。排湾人和南部其他族群敬奉百步蛇，把它背上的菱形花纹刻在各种图案里。\n\n在许多平原族群里，只有被称为尪姨的女性才能与灵界沟通。西拉雅人敬祖灵阿立，家中祖坛上以水壶为象征。1624年起荷兰人统治台湾南部，为了给传教扫清道路，把尪姨从村子里赶了出去。\n\n1662年郑氏政权建立、1683年清朝取得台湾之后，汉人移民把道教和佛教带到平原，许多西拉雅人采用了汉人的信仰；他们的生育之神阿立祖被纳入当地汉人的神谱。"
 geno_religion_desc: "$geno_religion$$common_folk_religion_desc$\n\n格诺属于尚未皈依伊斯兰教的富拉尼牧民；大多数富拉尼人很早就接受了伊斯兰教，并以此作为族群认同的标志。直到18世纪初，被称为普利的非穆斯林富拉尼人仍生活在富塔贾隆，穆斯林富拉尼人在那里起兵反抗他们和贾隆克人，建立了廷博伊玛目国。"
 ghari_religion_desc: "$ghari_religion$$common_folk_religion_desc$\n\n加里属于所罗门群岛瓜达尔卡纳尔岛西部说加里语的居民；这座岛本地人称伊萨塔布，1568年首次由阿尔瓦罗·德·门达尼亚的西班牙人绘入海图。后来，加里语的瓦图兰加方言被广泛用于传教和礼拜用的翻译。"
 godala_religion_desc: "$godala_religion$$common_folk_religion_desc$\n\n戈达拉是桑哈贾柏柏尔人的一支，居住在今毛里塔尼亚的大西洋沿岸，沿塞内加尔河下游贸易。和其他柏柏尔人一样，他们继承了一套古老的信仰：崇拜日月，相信洞穴和泉水中栖居着灵，并把死者当作祖先来敬奉。\n\n11世纪中叶，戈达拉人只是表面上信了伊斯兰教，仍保留许多异教习俗。他们的首领请来传教士阿卜杜拉·本·亚辛，向他们传授正统逊尼派教义，戈达拉人也加入了穆拉比特联盟。\n\n他们不止一次反抗联盟的严格统治，1056年还杀死了拉姆图纳人的统帅叶海亚·本·乌马尔。到1337年，古老的仪式只作为残余存在于伊斯兰教旁边。"
 goma_religion_desc: "$goma_religion$$common_folk_religion_desc$\n\n戈马属于哈马黑拉岛的托贝洛人，带有萨满教色彩和灵体崇拜。约1515年托梅·皮雷斯写《东方概要》时，当地的贾伊洛洛王国虽然国王已信伊斯兰教，境内仍大体是异教徒。"
 gorontalo_religion_desc: "$gorontalo_religion$$common_folk_religion_desc$\n\n苏拉威西北部哥伦打洛人的传统信仰，约1525年，在阿迈国王在位期间，随着伊斯兰教传入而逐渐被取代。哥伦打洛诸王国成为群岛东部的伊斯兰教中心之一；1673年，哥伦打洛归入荷兰东印度公司的管辖。"
 gos_religion_desc: "$gos_religion$$common_folk_religion_desc$\n\n戈斯是维莱拉人信奉的诸灵，维莱拉人是今阿根廷西北部大查科地区以狩猎采集为生的民族。15世纪，他们住在今图库曼省北部、圣地亚哥‑德尔埃斯特罗省和萨尔塔省东部，以野猪、角豆和蜂蜜为食。\n\n西班牙人征服图库曼之后，他们向东迁入查科；后来骑马的瓜伊库鲁人又把他们进一步挤向巴拉那河一带。耶稣会自18世纪30年代起把维莱拉人聚入传教村，直到1767年耶稣会被驱逐。\n\n在维莱拉人的神话里，戈斯是自然的“主人”。他们能加害于人，耶稣会传教士因此把他们称作魔鬼，但他们也能治病。传统上，维莱拉人的萨满通过歌唱召请戈斯来治病，这些歌的力量极大，被视为不可轻易外传的知识。"
 gosain_religion_desc: "$gosain_religion$$common_folk_religion_desc$\n\n戈赛因是拉杰马哈尔山区帕哈里亚人，也就是绍里亚帕哈里亚人和马尔帕哈里亚人的神灵崇拜。戈赛因是一大批与周围万物相连的地方神灵的统称，有男有女。其中有房屋立柱上赐人健康的戈莫戈赛因。\n\n最主要的圣所是曼吉坛，最重要的男性戈赛因化身为五块黑石，每年两次接受献祭。女性戈赛因在各自的圣所里享用黑鸡和猪。祖先由村祭司设宴祭祀，据说得到满足后就能与太阳神达尔梅尔戈赛因合一。\n\n18世纪后期，马尔帕哈里亚人与东印度公司作战，直到1778年的“绥靖”。1830年代起，桑塔尔移民进入他们的山区。"
 great_plains_shamanism_desc: "$great_plains_shamanism$$common_folk_religion_desc$\n\n瓦卡萨满教是大平原诸民族的神圣观念，得名于苏语族中表示“神圣”的词 wakan。在拉科塔人那里，瓦坎·坦卡指一组行事不为人所知的神圣力量；奥马哈人、奥萨格人等苏语族民族则称之为瓦坎达。\n\n说卡多语族语言的波尼人，把这种以星辰为中心的信仰表现得最完整。他们相信晨星和昏星生下了第一个女人，月亮和太阳生下了第一个男人，并向星辰献上玉米。\n\n斯基迪波尼人曾以被俘的少女祭祀晨星，认为这能使田地丰产。他们的酋长“刀酋长”曾多次赎出被俘者，他的亲属佩塔勒沙罗则在1817年把一名科曼奇少女从祭台上解了下来。"
 guanche_religion_desc: "$guanche_religion$$common_folk_religion_desc$\n\n阿查曼教是加那利群岛土著的信仰体系，以特内里费岛上的记载最为详细，那里的至高神是阿查曼，意为“闪耀者”。他的配偶查希拉希承托着苍穹，后来被与出现在吉马尔海滩的坎德拉里亚圣母像等同。创世神在大加那利岛称阿科兰，在拉帕尔马岛称阿博拉。\n\n关切人相信恶神瓜约塔化作巨大的长毛犬，居住在泰德峰内部。他们崇拜太阳神马赫克，对着太阳发誓，并用供品随葬死者，在特内里费岛上还把遗体制成木乃伊。这些信仰只通过15世纪基督教征服者的记述保存下来。"
 guasave_religion_desc: "$guasave_religion$$common_folk_religion_desc$\n\n瓜萨韦人又称塔马苏拉人，是锡那罗亚西北部的滨海民族，生活在沼泽和河口地带，以鱼、蛤和野果为生，所说的语言与锡那罗亚邻族不同。瓜萨韦信仰就是这个民族的传统信仰。"
 hani_religion_desc: "$hani_religion$$common_folk_religion_desc$\n\n哈尼人是滇南哀牢山区的藏缅语族民族。他们的传统信仰是多神崇拜，有自然崇拜和灵魂崇拜，对祖先之灵尤为尊崇。祭司分三类：主持大祭的人，行驱邪和法术的贝玛，以及占卜预言、施用草药的尼玛，尼玛男女都可担任。\n\n过去的事靠口传文学保存：有创世神话、洪水故事，还有讲述祖先渡江而来的史诗，庆典和祭祀上要吟唱。每个哈尼人都要学会背诵祖先的名字，从第一个哈尼家庭一直背到自己。"
 hellenism_religion_desc: "$hellenism_religion$$common_folk_religion_desc$\n\n希腊多神教是复兴古希腊诸神崇拜的尝试。历史学家认为古老的宗教最迟在9世纪已经消亡。最早的倡导者是拜占庭晚期哲学家格弥斯托士·卜列东，他在摩里亚专制公国的米斯特拉讲学，在一次演讲中宣称希腊人在种族和文化上都是希腊人。\n\n卜列东的最后一部著作是《法律书》，书中他否定基督教，主张崇拜奥林匹斯诸神，并融入琐罗亚斯德和祆教祭司的智慧。宙斯居于首位，是万物的自生之父，其他诸神按等级排在他之下。\n\n卜列东死于1452年或1454年。1460年，曾是他学生的君士坦丁堡牧首根纳迪乌斯二世烧毁了仅有的抄本，不过根纳迪乌斯概述该书内容的信保存了下来。"
 hindu_desc: "$hindu$并非统一的宗教，而是多种信仰的集合，通常被认为是世界上最古老的宗教传统。其所有信仰与实践被理解为对“正法”（宇宙秩序）的解释，源自古老的吠陀文献。由于其多样性，$hindu_ADJ$包含众多神祇，但并非所有神祇都受到同等崇拜，甚至并非所有$hindu$信徒都认可这些神祇，这取决于他们的具体信仰与取向。印度教的四大主要分支是$vaishnavism$、$shaktism$、$shaivism$和$smartism$。\n\n印度教没有创始人。信徒通过仪式和正直的生活来维护正法，其依据是吠陀；经典包括奥义书、往世书以及史诗《罗摩衍那》和《摩诃婆罗多》。它讲究业、轮回，以及从轮回中得到的解脱，称为“莫克沙”。毗湿奴派以毗湿奴为中心，湿婆派以湿婆为中心，性力派以女神为中心。\n\n1337年，从卡纳塔克的曷萨拉到爪哇的满者伯夷，许多王国都信奉印度教。德里苏丹国已经劫掠并吞并了德干的多个王国，1336年，哈里哈拉一世和布卡·拉亚一世兄弟建立了毗奢耶那伽罗，成为南方的印度教强国。大约从1250到1750年，崇奉个人所选之神的虔信运动日益兴盛，而1560年葡萄牙人在果阿设立的宗教裁判所则迫害过印度教徒。"
 hmongism_desc: "$hmongism$$common_folk_religion_desc$\n\n章夸教的意思是崇拜神灵之道，是中国西南苗人的传统信仰。它是一种万物有灵的信仰，崇敬看不见的神灵。\n\n黔东苗族的口传史诗里，蝴蝶妈妈是人类的始祖母：她生在一棵神圣的枫树里，产下十二枚蛋，孵出了第一个人姜央和雷神。萨满由神灵选定，不能世袭，骑上象征灵马的法凳，进入灵界诊断和治病。\n\n每家的神坛上供奉福神，祭品有米饭、鸡和纸钱。明清两代，苗人的起义屡遭镇压，其中1735年反对强制同化的起义到1738年才告终。"
 hussite_desc: "$hussite_ADJ$教会由扬·胡斯创立，是$BOH$地区的一个早期新教运动，融合了$BYZ_ADJ$礼要素与约翰·威克里夫的教义。它强调兼领圣体圣血以及圣经高于教会传统的重要性。\n\n胡斯派追随捷克传道者扬·胡斯。胡斯受约翰·威克里夫思想影响，主张圣经高于教会传统，俗人也应兼领饼和酒。1415年，康斯坦茨会议把胡斯烧死，波希米亚随即爆发起义。圣杯成为这一运动的标志，其成员因此被称为圣杯派或兼领派。\n\n温和派在1420年的《布拉格四条款》中提出纲领。激进的塔博尔派则更多地追随威克里夫。1419至1434年间，胡斯派在扬·杰式卡率领下击退了五次十字军。\n\n1434年，兼领派与天主教徒在利潘击溃了塔博尔派；1485年的库特纳霍拉和约使天主教徒与兼领派在波希米亚享有平等权利。1620年白山战役后，天主教被重新强加于波希米亚。"
 ibadi_desc: "$ibadi_school_desc$\n\n伊巴德派得名于巴士拉的阿卜杜拉·本·伊巴德，他约在683年拒绝了哈瓦利吉派中极端派的主张，认为穆斯林对手犯的是忘恩之罪而非多神之罪，因而信徒可以与他们共处。伊巴德派认为伊玛目由社群选举产生，若犯罪就必须罢免。\n\n巴士拉的传教士把这一派带到阿曼、北非和东非。1337年，纳卜汉王朝的国王们统治阿曼内陆，选举产生的伊玛目只剩象征性的角色；在北非，伊巴德派信徒仍生活在姆扎卜和奈富塞山。1624年，亚鲁巴伊玛目取代纳卜汉王朝，把葡萄牙人逐出马斯喀特；1744年，阿尔布赛义德家族接掌政权。"
 ijaw_religion_desc: "$ijaw_religion$$common_folk_religion_desc$\n\n伊乔人的宗教是尼日尔河三角洲伊乔人（又称伊宗人）渔民的传统信仰，他们在15世纪已沿海岸经商。人们崇敬祖先，水灵奥瓦马普占据核心位置：他们和人一样既有长处也有缺点，传统上认为人在出生以前就生活在水灵之间，祈祷是为了让生者保持水灵的眷顾。\n\n当地有一种叫伊格巴代的占卜，向刚去世的人询问死因。每年都有持续数日的节庆敬奉水灵，戴面具的舞者被认为会被所代表的水灵附体。埃格贝苏以豹、黑豹和狮子为图腾，被奉为正义之神。"
 imunu_religion_desc: "$imunu_religion$$common_folk_religion_desc$\n\n伊穆努是巴布亚诸民族传统上对一种力量的称呼，这种力量遍及万物，包括仪式用品。巴布亚人是美拉尼西亚人，至少有240个群体，各有自己的语言，主要靠西米、狩猎、捕鱼和小块园地为生。\n\n在面具仪式中，伊穆努显现出具体的形象，面具大多表现人或祖先，而不是植物或动物。祖先在这种信仰里很重要，却不一定受到崇拜，安抚祖先之灵是反复出现的主题。对妖术和巫术的恐惧也很普遍。出猎或出征之前，人们会请灵来出主意并加以庇佑，戈佩板则被认为附有强大战士的灵魂，或是守护村落。"
 inti_desc: "$inti_god$和$viracocha$是引导和庇佑$andes_region$人的主要神灵。\n\n印加的统治者自称是因蒂的后裔；因蒂的形象是一个带着面孔和光芒的金盘，他在库斯科的神庙是科里坎查，里面有一块黄金制的玉米田。传说维拉科查在的的喀喀湖的一座岛上造出了人类后隐去。\n\n除因蒂外，国家还祭祀掌管雷电的伊利亚帕、月亮玛玛·基利亚和大地帕查玛玛。安第斯各地分布着称为瓦卡的圣地和圣物，山岳尤其如此，节庆则有6月至日举行的因蒂·赖米节。去世的统治者被制成木乃伊，像活人一样受到供奉，直到1559年西班牙人波洛·德·翁德加多在库斯科把它们收走。"
 inuit_religion_desc: "$inuit_religion$$common_folk_religion_desc$\n\n因纽特泛灵论是因纽特人的传统信仰。因纽特人沿北极和亚北极海岸狩猎，从阿拉斯加经加拿大北部一直到格陵兰。它没有正式的神职人员和教会，各地社群之间差别很大。\n\n猎物被看作灵魂必须安抚的生灵，围绕狩猎、生育和死亡的禁忌则用来让诸灵安心。许多族群敬奉海洋动物的主宰努利亚尤克，即塞德娜；有人触犯禁忌时她会扣住猎物不放，掌握辅助灵的萨满安加库特便要前往她那里求情。\n\n16世纪，欧洲船只开始在加拿大东北部遇到因纽特人，基督教的传播则很缓慢。在格陵兰，安加库特继续活动，有时转入暗中；1746年国王克里斯蒂安六世曾致信格陵兰人，抱怨他们的活动。"
 ipok_religion_desc: "$ipok_religion$$common_folk_religion_desc$\n\n伊波克信仰是沙捞越中部河流与海岸地带的梅拉瑙人的传统信仰，信徒敬奉名为伊波克的灵体。梅拉瑙人的土地长期受文莱影响，后来皈依伊斯兰教的人放弃了旧仪式，但凯奥节仍保留着它们的痕迹。"
 iroquoian_totemism_desc: "$iroquoian_totemism$$common_folk_religion_desc$\n\n奥伦迪图腾崇拜得名于奥伦达，这是学者用来称呼易洛魁诸民族认为存在于人、歌曲和自然物之中的一种力量的术语。这里指的是东北林地豪德诺索尼人的传统信仰，其中有莫霍克人、奥奈达人和塞内卡人。\n\n他们的创世故事里，统治者霍韦尼约让怀孕的天女从云上的浮岛坠下，众鸟把她托到海龟背上，麝鼠带来的泥土在龟背上长成大地。她在生下双生子时死去，双生子是代表善念的哈格韦迪尤和代表恶念的“燧石”索维斯凯拉，二人为这个世界争斗。\n\n每个村子都有说书人，夏天不讲故事。18世纪晚期，塞内卡先知汉德萨姆湖把旧宗教的一些内容收进他的《法典》。"
 irritila_religion_desc: "$irritila_religion$$common_folk_religion_desc$\n\n伊里提拉人又称拉古内罗人，生活在科阿韦拉与杜兰戈交界的湖区，环绕迈兰湖一带。他们由十二个以上说不同语言的部落组成，彼此以纳瓦特尔语交流；1594年，耶稣会获准开始对他们传教。"
 isese_religion_desc: "$isese_religion$$common_folk_religion_desc$\n\n奥里沙教即约鲁巴人的传统宗教，约鲁巴人的奥约、伊费等王国位于今尼日利亚西南部。创世传说称，至高神奥洛杜马雷派奥里沙（神祇）奥巴塔拉去造大地；奥杜杜瓦把泥土撒在原初的水面上，伊费因此始终是约鲁巴王权的神圣源头。\n\n奥洛杜马雷之下是奥里沙，以及以埃贡贡假面舞会形式回到人间的祖先。名为巴巴拉沃的祭司通过伊法占卜向奥伦米拉求问，所凭借的是256卷奥杜。\n\n奥约把雷神尚戈奉为王室崇拜的对象，传统上他是奥约的第三位阿拉芬。伊洛林脱离奥约、落入穆斯林富拉尼人首领手中后，于1835年摧毁了奥约伊莱。被贩运过大西洋的约鲁巴俘虏把奥里沙信仰带到美洲，成为坎东布雷教和圣特里亚教的根源。"
 itaukei_religion_desc: "$itaukei_religion$$common_folk_religion_desc$\n\n伊陶凯信仰是斐济原住民的传统信仰。它的最高神是德盖，一条蛇，也是斐济世界的创造者；刚死去的人要穿过奇巴奇巴或德拉库卢洞穴，由他审判灵魂。他把少数人送往布罗图乐园，把大多数人扔进一座湖里，让他们沉下去，各自得到奖赏或惩罚。\n\n信仰同灵性祖先“伍”的血统紧紧相连，崇拜同一位神的群体称作陶伍，被认为有共同的起源。家庭托卡托卡组成氏族马塔卡利，氏族又组成部落亚武萨；同一片土地上的亚武萨组成瓦努亚，由最高酋长领导，祭司贝特是酋长的发言人和顾问。"
 jai_religion_desc: "$jai_religion$$common_folk_religion_desc$\n\n海瓦纳萨满教是恩贝拉人的传统信仰。恩贝拉人是哥伦比亚西部和巴拿马乔科地区的河岸民族，他们沿河而居，与精灵“海”打交道。这些精灵包括住在河流源头、作为动植物之母的万德拉。林中的动物则被认为是死者灵魂的化身。\n\n萨满称为海瓦纳，不是世袭的，而是跟随有经验的师傅学习。他通过与海的交涉，维持狩猎和社群的健康，并通过驱走恶灵来治病。\n\n神话说，卡拉加比用从图特鲁伊卡那里借来的泥土造出最早的人类，又砍倒了杰内内树，海从树根涌出，树枝则变成河流。18世纪晚期，在西班牙人的逼迫下，许多恩贝拉人迁入达连。"
 jain_desc: "$jain$是最古老的宗教之一，是一种印度$dharmic_ADJ$宗教，专注于自我实现与解脱生死轮回。它以非暴力与苦行主义为核心，通过#italic 渡津者#!（$dharmic_ADJ$的至高导师）的教义进行修行，并分为天衣派与白衣派。天衣派意为“以天为衣”，其特点是拒绝物质依附与拥有，因此其僧侣不穿衣物，其圣像也更为朴素。白衣派则因其僧侣身着白衣而得名，男女僧侣地位更为平等，与更偏向男性的天衣派形成对比。\n\n耆那教尊奉二十四位渡津者，即渡过轮回之津的导师。史家认为第二十三位巴湿伐那陀生活在公元前8世纪或7世纪，第二十四位大雄是佛陀的同时代人，否定吠陀的权威。其伦理建立在非暴力、真理多面的“不定论”和不占有三者之上。由于奉行非暴力，耆那教徒避开农耕和战争，许多人成为商人和银行家。\n\n德里苏丹国的阿拉乌丁·卡尔吉（1296—1316年在位）接见过耆那教的圣者。后来的莫卧儿皇帝如阿克巴也给耆那教朝圣地提供捐赠，不过阿克巴在1567年也下令捣毁了奇陶尔的耆那教神庙。"
 jama_religion_desc: "$jama_religion$$common_folk_religion_desc$\n\n哈马信仰属于哈马·科阿克文化。该文化约自公元前355年到1532年，发展于厄瓜多尔马纳比海岸的科阿克河与哈马河之间。它没有文字记录，是学者以陶器为依据，对照中美洲和秘鲁北部海岸的文化拼合出来的。\n\n宇宙分为天界、大地和冥界三层。哈马是大地的主神，人身爬行动物面孔，大概是一只鬣蜥。蝙蝠神掌管雨水和夜空，出没在冥界的水中；死神的形象没有手脚。月亮则以负鼠的形象出现。\n\n兼任萨满的祭司是人神之间的中介，执行人祭。死者装入陶罐埋葬。"
 jingpo_religion_desc: "$jingpo_religion$$common_folk_religion_desc$\n\n景颇人是缅甸北部克钦山区和云南相邻地带的藏缅语族民族，载瓦人是其中的一支。在佛教和基督教传入之前，他们信奉万物有灵的传统宗教：相信灵魂无处不在，会带来吉凶祸福；一切生物都有灵魂，从播种到打仗，几乎每件事都要举行仪式来求得保护。\n\n著名的神灵有马代。景颇传说称宁贯娃是始祖，他住在洞穴里，以狩猎为生，迎娶龙王之女布仁扎仁时敲锣击鼓，把她留在家中。\n\n景颇人和载瓦人举行盛大的目瑙纵歌，舞者绕着中心的柱子起舞。每年正月十五前后和尝新米季节各办一次。"
 jino_religion_desc: "$jino_religion$$common_folk_religion_desc$\n\n基诺泛灵论是基诺人的传统信仰。基诺人是藏缅语族民族，居住在西双版纳的基诺山，清代文献称之为攸乐人。信仰以崇拜自然神灵为核心，阿匹额额被奉为创世之神。\n\n神话讲述兄妹玛黑和玛妞成婚、繁衍人类，以及女始祖尧白开天辟地、撒下最初的茶种。有人去世时，全寨要跳花脸舞和竹竿舞，花脸代表要吃掉尸体的鬼，竹竿舞用来驱鬼。"
 juang_religion_desc: "$juang_religion$$common_folk_religion_desc$\n\n朱昂泛灵论是朱昂人的传统信仰。朱昂人是南亚语系民族，只分布在奥里萨凯翁贾尔的戈纳西卡丘陵，本族传说把发源地定在拜塔拉尼河源头。他们一年的祭祀节庆有普沙月圆节、芒果尝新节、皮尔哈祭和阿萨尔节等。"
 judaism_desc: "$judaism$是最早的亚伯拉罕宗教，遵循上帝与摩西所立的约。$judaism_ADJ$的圣经是《塔纳赫》，其中前五卷被称为《妥拉》，是所有$judaism_ADJ$信徒信仰与实践的基础。\n\n犹太教还有口传妥拉，记录在《密西拿》和《塔木德》中。拉比依据犹太律法“哈拉卡”施教断事，礼拜以会堂为中心。犹太教没有统一的教阶，权威来自经典和解读经典的学者，迈蒙尼德的《密西拿托拉》就系统整理了律法。\n\n1337年，犹太人在基督教和伊斯兰教的国家里是赋税沉重的少数。1348年黑死病之后，从巴塞罗那到斯特拉斯堡的犹太社区都遭到暴力袭击，许多人东迁波兰，卡齐米日三世给予他们保护。1492年，西班牙驱逐了境内的犹太人。在奥斯曼治下巴勒斯坦的采法特，约瑟夫·卡罗于1563年写成《舒尔汉·阿鲁赫》；沙巴泰·泽维的弥赛亚运动则在1666年以他改宗伊斯兰教告终。"
 jurema_religion_desc: "$jurema_religion$$common_folk_religion_desc$\n\n茹雷玛信仰是巴西东北部内陆各族的神圣传统。这些人不是图皮人，被葡萄牙人统称为“塔普亚人”，他们用茹雷玛树的部分枝干调制神圣的饮料。基里里人和潘卡拉鲁人等都饮用它，他们的帕热（萨满）在集会上端出这种饮料，用于宗教和治病的仪式。\n\n饮料配合烟草的烟雾和仪式歌唱，会使人进入出神状态，人们相信被称作“恩坎塔多斯”的神灵主人此时借萨满之口说话。早期的欧洲编年史家记下了饮茹雷玛和这类灵附仪式。\n\n殖民统治下，这种信仰转入地下。16至17世纪出现了天主教与本地信仰混合的运动，称为“桑蒂达德”；直到19世纪，饮茹雷玛仍被当作巫术，许多印第安人和卡波克洛人因参加“茹雷玛集会”被捕。"
 ka_niam_khasi_religion_desc: "$ka_niam_khasi_religion$$common_folk_religion_desc$\n\n卡尼阿姆教是卡西人的传统宗教。卡西人是今印度东北部梅加拉亚邦的南亚语系山地民族。这是一神信仰：至高的创世主乌勃黎·农陀独一无二，没有形体，创造了整个宇宙。\n\n卡西人的传说称，主宰最初把人类分成十六个天上的家族，其中七家，即“海涅乌特雷普”，被留在人间。一架天梯靠在一座圣峰上，人们可以往来天界；后来人们受骗砍倒了一棵神树，从此永远失去了上天的路。传统上，每个卡西村庄都有一片圣林，用来安抚森林之灵。\n\n卡西人生活在约二十五个独立的邦里，各由一位酋长治理，酋长称作“西姆”。他们没有自己的文字，宗教靠口耳相传。"
 kachina_religion_desc: "$kachina_religion$$common_folk_religion_desc$\n\n克契奈人形信仰是美国西南部普韦布洛各民族，包括霍皮人、祖尼人和凯雷斯人，对克契奈的信仰。克契奈是象征普韦布洛祖先和世间各种力量的灵体，人们并不崇拜他们，但受到尊敬时，他们会带来雨水、治愈、丰产和庇护，也可能带来疾病。\n\n在霍皮人看来，克契奈住在旧金山峰上，上半年来访村庄；2月的波瓦穆仪式标志着豆类播种。蒙面的男子在舞蹈中扮演这些灵体，人们还为孩子们雕刻克契奈木偶。\n\n17世纪西班牙人把传教站建到普韦布洛地区之后，迭戈·德·巴尔加斯于1692年重返。普韦布洛人在天主教的外表之下，把自己的仪式藏在西班牙人的视线之外。"
 kaggen_religion_desc: "$kaggen_religion$$common_folk_religion_desc$\n\n卡根是南部非洲狩猎采集民族桑人传统信仰中最著名的形象。桑人信仰留存下来的材料很少，关于卡根的神话主要出自克萨姆人。\n\n卡根常被称为“螳螂”，既是创造者，也是骗子，能变成螳螂、公大角斑羚或蛇。他最宠爱的生灵是大角斑羚：儿子们在它长成可供猎取之前就把它杀了，他便洒下羚羊的血和脂肪，造出大群野生大角斑羚。\n\n大角斑羚也是出神舞中最常见的助灵动物，萨满借此进入灵界。1652年荷兰人在好望角定居；18世纪初起，农场主进入桑人的土地，到该世纪末，殖民者的民团已经杀死或奴役了数以千计的人。"
 kaharingan_religion_desc: "$kaharingan_religion$$common_folk_religion_desc$\n\n卡哈林干信仰是婆罗洲南部达雅克人的万物有灵信仰，信奉者包括恩加朱人。名称来自古达雅克语的“哈林”，意为生命。它的标志是“巴当加林”生命之树，树顶有一只犀鸟和太阳。\n\n祖先之灵和众多神灵居于信仰的中心，往往有一位至高神。传统上，恩加朱人最看重第二次葬礼“蒂瓦”：下葬数月乃至数年后，遗骨被放进雕刻精美的“桑顿”灵屋，并宰杀牲畜，好让灵魂升到最高的天界。“巴里安”萨满则通过入迷的舞蹈召回游离的灵魂，为人治病。\n\n恩加朱人比其他达雅克人更乐于接受外来影响。1835年起，莱茵传教会开始让他们改信基督教。"
 kajoor_ri_majel_religion_desc: "$kajoor_ri_majel_religion$$common_folk_religion_desc$\n\n卡久里‑马绍尔信仰是拉塔克和拉利克两串岛链上马绍尔人的传统信仰。它属于多神信仰，但有一位神高于众神，名叫伊亚盖奇，意思就是“神”，人们向他献上面包果、椰子和鱼。着手任何重大事情之前，人要以全家的名义献上一份供品。\n\n马绍尔人也崇拜灵，其中有可能附在家人身上给予忠告的已故亲人，也有引起疾病的恶灵安吉利克。治病要向灵求助，占卜者从撒在地上的小石子或椰叶、露兜树叶条上所打的结的形状里读出意义。1526年，西班牙水手首次在陶翁伊岛登陆马绍尔群岛。"
 kalge_religion_desc: "$kalge_religion$$common_folk_religion_desc$\n\n卡尔格教是达朱人的传统信仰，达朱人曾在马拉山南麓统治着达尔富尔第一个见诸史籍的国家。他们的至高神叫卡尔格，人们为他修建草编的神龛，圣山帕尔卡尔格山也以他命名。\n\n地理学家伊德里西在1154年仍称达朱王国信奉异教，但伊斯兰教逐渐在他们当中传开，据说到15世纪已成为大多数达朱人的宗教。通朱尔人取代达朱王朝之后，达朱人的一些分支留存在达尔西拉等地，其中许多人是穆斯林，仍保留旧俗，并逐渐把卡尔格等同于安拉。"
 kam_religion_desc: "$kam_religion$$common_folk_religion_desc$\n\n萨岁崇拜以侗人最重要的神灵为中心。侗人分布在贵州东部、湖南西部和广西北部，萨岁是驱邪护寨的女性祖先。每个传统侗寨都设有她的祭坛，是鼓楼附近一座围墙小院。\n\n据传说，她名叫杏妮，带领乡亲先抗击恶霸地主，后来又抗击地主那做官的儿子带来的官军，最后与那位官员搏斗，双双坠崖。乡亲们呼喊她的名字，林子里到处回响着应答声。\n\n她的周围还有别的神灵：寨门神和桥神、土地神，以及作为图腾的龟、蛇和龙。明清两代侗人屡次起事，其中有1378年吴勉和1740年吴金银的起事。"
 kan_khwan_religion_desc: "$kan_khwan_religion$$common_folk_religion_desc$\n\n坎宽神话是卡扬人的传统信仰。卡扬人属红克伦人，居住在缅甸克伦尼邦。在他们的叙述里，永恒的创世神普卡布卡廷由两位创造神和四位使者协助，分别造出天、地、草木、人和兽。\n\n大地起初是流动的，普卡布卡廷在地上栽下一根木桩，木桩长高，大地便凝结成七层。这根木桩就是“坎登波”，七条诫命也随之赐下。\n\n每年3月或4月，卡扬人都要用最先被创造出来的树木——番樱桃属的树木——树立一根新的坎登波柱。柱顶是太阳，往下是月亮和通往天界的梯子。立柱的清晨，萨满要用鸡骨占卜，预言全村这一年的命运。"
 kanak_religion_desc: "$kanak_religion$$common_folk_religion_desc$\n\n卡纳克信仰是新喀里多尼亚的美拉尼西亚人卡纳克人的传统信仰；在欧洲人到来之前，他们既没有统一的国家，也没有统一的自称。他们在墓地、圣石和献祭用的祭火炉旁崇拜祖先，并把大海视为神圣，口头的法则规定鱼类减少时就要封海。\n\n雕成鹰、古代神灵、蛇和海龟的木雕，以及形似小图腾柱的屋顶饰柱，都表达着他们的信仰。1774年詹姆斯·库克船长登岛，据说当时岛上有七万卡纳克人，他把这些岛屿命名为新喀里多尼亚。大约半个世纪后，伦敦传道会的传教士接踵而至。"
 karachay_balkar_paganism_desc: "$karachay_balkar_paganism$$common_folk_religion_desc$\n\n卡拉巴尔多神教是卡拉恰伊人和巴尔卡尔人的传统信仰，这两个突厥语山地民族生活在高加索中部的厄尔布鲁士山周围。它从来没有固定的正典，也没有井然有序的神谱：现在是从纳特史诗和传说中拼合起来的，学者在其中分辨出突厥、阿兰和高加索共有的几个层次。\n\n最高神是天神特伊里，雷电之责则由乔帕、希比利亚和埃利亚分担。神话说第一位铁匠德别特是天与地所生。\n\n阿兰王国的基督教过去在圣徒的名字里留下了痕迹：埃利亚就是先知以利亚，托图尔是圣狄奥多尔。约1395年帖木儿摧毁阿兰王国后，伊斯兰教在山民中传开，大多数巴尔卡尔人在18世纪接受了它；特伊里此后成了对唯一真神的称呼。"
 karama_religion_desc: "$karama_religion$$common_folk_religion_desc$\n\n卡拉玛是宰牲祭祀、驱避恶灵的仪式，属于前伊斯兰时代的习俗；乍得湖与达尔富尔之间的萨赫勒东部牧民扎加瓦人，在他们的国王于11世纪名义上皈依伊斯兰教之后仍保留着它。"
 karankawa_religion_desc: "$karankawa_religion$$common_folk_religion_desc$\n\n卡兰卡瓦人是得克萨斯南部墨西哥湾沿岸的诸游群，包括加尔维斯顿湾一带的卡波克人。他们不向外人解释自己的仪式：拉萨尔的同伴茹泰尔询问他们的信仰时，他们只是指了指天空。\n\n旁观者看到他们凝望太阳沉入大海，又用鼻孔吸烟。选拔首领要经过考验：候选人用海鱼的脊刺划出道道伤口，再被绑在柱子上；一位西班牙修士认为这也可能是成年礼。\n\n1528年，卡波克人在加尔维斯顿岛上照料了阿尔瓦·努涅斯·卡韦萨·德巴卡和其他纳瓦埃斯远征队的幸存者。1754年在卡兰卡瓦人当中建起了罗萨里奥传教站，但他们一受惩罚就逃走，始终没有被它束缚。"
 karbi_religion_desc: "$karbi_religion$$common_folk_religion_desc$\n\n米基尔泛灵论称为阿龙班，由阿萨姆中部山地的米基尔人（即卡尔比人）奉行。它以三位神为核心：创造并保护世界的亨普，与力量和公正相关的穆克朗，以及女神拉辛贾。\n\n米基尔人崇敬称为隆里·阿尔楠的地方神灵，以及称为卡尔希的家神和祖灵，没有神庙和偶像，在圣林献上鸡蛋、鸡和猪。龙克尔节由村中长老在每年4月刀耕火种开始之前举行，祈求免除疾病和歉收。\n\n乔曼坎是米基尔人最重要的仪式，这是一种在人去世数月甚至数年后举行的丧仪，用来引导亡魂前往祖先之地。仪式歌手伦塞波吟唱“莫塞拉”叙事歌，传承本族的迁徙历史。"
 karen_religion_desc: "$karen_religion$$common_folk_religion_desc$\n\n克伦泛灵论在缅甸南部和东部的克伦人中以山地的斯高克伦人保持得最为牢固。它认为每个人身上都有三十七个魂灵。其中一个游离出走，人就会生病遭难；三十七个魂灵全部离开身体，人便死去。\n\n佛教通过孟人传到克伦人中，孟人在18世纪中叶以前一直控制着下缅甸；1700年代后期，佛教又传到说波语的波克伦人中。许多斯高克伦人信奉的是非正统的佛教，把佛教的积功德与浓厚的万物有灵观念结合在一起；一种名为杜维的佛塔崇拜，在佛教的形式里保留着万物有灵的根源。"
 kenos_religion_desc: "$kenos_religion$$common_folk_religion_desc$\n\n科诺斯教属于塞尔克南人，他们生活在火地岛的大岛上，并与邻近的豪什人共有这些神话。最高存在是特毛克尔，塞尔克南人认为只有他才称得上真正的神。科诺斯是称为霍文的神话祖先中的第一位，由特毛克尔派到原初的大地上整顿秩序，创造出塑造大地的各位祖先。\n\n冥界诸灵由女神沙尔彭和她的七位舒尔特统领，在称为海恩的盛大成年礼上由男人扮演，少年们被这些灵吓唬，直到他们揭穿真相。类似萨满的人物据信能够控制天气。"
 khabzeism_desc: "$khabzeism$$common_folk_religion_desc$\n\n哈布泽多神教是切尔克斯人的宗教，以至高的创造者特赫沙霍（意为“大神”）为中心，他之下有许多小神。人的灵魂死后依生前的行为受到回报。哈布泽多神教不应与哈布泽相混，哈布泽是切尔克斯人的行为准则。\n\n其中梅济萨掌管森林和狩猎，普瑟赫—瓜莎掌管水域，索泽雷什掌管庄稼，他的偶像用一根有七个节的树枝削成，立在各家的牲口棚里。冬季的一个夜晚，人们设宴纪念纳特史诗中的英雄索斯鲁科，任何过路的旅人都可以代替他入席。\n\n人们在称作库多希的圣林里礼拜。1637年，传教士乔瓦尼·卢卡描述了那里的树枝上挂着的武器和公羊头。随着伊斯兰教的传播，圣者和英雄被改写成阿拉伯勇士和伊斯兰传说。"
 kharia_religion_desc: "$kharia_religion$$common_folk_religion_desc$\n\n卡里亚人是讲蒙达语族语言的民族，分布在贾坎德、奥里萨和乔塔那格浦尔高原的山林地带。他们分为山地、德尔基和杜德三支，其中山地卡里亚靠山林狩猎采集为生。"
 khond_religion_desc: "$khond_religion$$common_folk_religion_desc$\n\n孔德人是说库伊语的部落民族，居住在奥里萨山地和东高止山。他们的信仰融合了图腾崇拜、万物有灵、祖先崇拜和萨满教，崇拜的对象尤其是大地，被认为是世界的创造者和养育者。后来，大地神被当作男神达尔尼·德奥塔，与他相伴的是狩猎神巴特巴尔西·德奥塔。\n\n农耕与狩猎的每个阶段都有仪式，其中有梅里亚仪式，即用买来的人牲献祭，使土地肥沃。英国作者对这种做法多有谴责。\n\n长期与说奥里亚语的印度教徒接触后，卡莉和杜尔迦被当作达尔尼的化身供奉。1753年起，古姆苏尔山区的孔德人多次起兵反抗东印度公司。"
 kilyikhama_religion_desc: "$kilyikhama_religion$$common_folk_religion_desc$\n\n基利哈玛萨满教属于巴拉圭大查科的伦瓜诸族（如恩科塞特人），这些森林中的狩猎采集者结成小型群体，生活在巴拉圭河以西。"
 kirat_mundhum_religion_desc: "$kirat_mundhum_religion$$common_folk_religion_desc$\n\n门顿教为东喜马拉雅的基拉特诸族所奉行，信徒有林布人和莱人等，分布在尼泊尔东部到锡金一带。经典《门顿》原是吟游诗人口耳相传的史诗，后来被记录成书，内容有创世传说、最初的法规和一场大洪水。\n\n这一信仰把自然崇拜、祖先崇拜与萨满教结合在一起。林布人敬奉至高力量塔格拉·宁瓦普马，他在人间化为母神玉玛桑芒；莱人则祈祷大地女神松米玛。萨克拉节每年在播种和收获时各跳舞一次，感谢大自然和祖先。\n\n18世纪70年代，林布人的林布旺联盟被廓尔喀的普利特维·纳拉扬·沙阿并入。同一时期，学者特翁西·西里章加复兴了林布文字。"
 kirin_koda_religion_desc: "$kirin_koda_religion$$common_folk_religion_desc$\n\n拘陀吉灵教为拉马霍洛特人所信奉，他们居住在弗洛勒斯岛东部的伦巴塔、索洛尔、阿多纳拉诸岛和拉兰图卡一带。它的最高神是创造者勒拉·乌兰·塔纳·埃坎；信徒也敬奉祖先的灵魂，祖灵在生者与最高神之间居中沟通。\n\n仪式在称为“科尔克”和“努巴纳拉”的巨石圣所里举行。最高神的象征是一根名为“里埃·利马·瓦纳”的木柱，人们站在柱前求福，某些仪式上还要宰杀牲畜，把血涂在柱上。\n\n葡萄牙人到来时，索洛尔已被穆斯林控制，那里有由五个伊斯兰王国组成的“索洛尔五邦联盟”。16世纪起，葡萄牙势力带来了天主教，天主教逐渐占据主导，而拘陀吉灵教只在少数人中保存下来。"
 koch_religion_desc: "$koch_religion$$common_folk_religion_desc$\n\n阿萨姆、梅加拉亚和孟加拉国北部的库奇人分为九个行母系制的氏族群，部分保留了库奇语，沿袭非印度教的习俗，与1515年建立库奇王国的印度教库奇人关系相近，但并非一类。"
 kolano_religion_desc: "$kolano_religion$$common_folk_religion_desc$\n\n伊斯兰教传入之前，特尔纳特人以亲族集团为单位，各由称为“莫莫莱”的首领统领，北马鲁古的古老信仰与“科拉诺”即国王的统治紧密相连。按传统说法，1257年特尔纳特四个村寨的莫莫莱推举莫莫莱·奇科为加比国王，称号“巴布·马舒尔·马拉莫”。\n\n传说马鲁古诸王的祖先是阿拉伯人贾法尔·萨迪克与天上仙女努鲁斯·萨法所生的四个儿子，他们成了巴坎、贾伊洛洛、蒂多雷和特尔纳特各支王室的始祖。\n\n伊斯兰教在15世纪后期传入宫廷。马尔胡姆（1465—1486）是特尔纳特第一位皈依伊斯兰教的国王，其子扎因·阿比丁（1486—1500）施行伊斯兰教法，并把“科拉诺”的称号改为苏丹。"
 komi_paganism_desc: "$komi_paganism$$common_folk_religion_desc$\n\n瓦日斯科姆萨满教为科米诸族——济良人、彼尔姆科米人和亚兹瓦科米人——所奉行。最早的来源是斯捷潘1396年去世后不久写成的《彼尔姆的斯捷潘传》，书中提到许多神灵，也提到对动物、圣树和偶像的崇拜。\n\n民间传说中的创世神是约恩；在济良人那里，与他对立的是恶神奥梅尔，在彼尔姆人那里则是库尔。民间传说还说人有几个灵魂：洛维亚是呼吸，奥尔特是人的分身，它的声响预示死亡。\n\n彼尔姆的斯捷潘1376年起走遍维切格达河和维姆河沿岸，砍倒圣桦树，创制了科米文字，并在1383年成为第一任彼尔姆主教。维切格达科米人受了洗，但大彼尔姆又保持了大约一个世纪的异教。"
 koyapunem_religion_desc: "$koyapunem_religion$$common_folk_religion_desc$\n\n拘耶补念教意为“自然之道”，为贡德人所奉行。贡德人自称科伊托尔，生活在印度中部的森林山地。据贡德传说，行为准则《贡德补念》出自祖先英雄帕里·库帕尔·林戈，他召集了三十三名弟子。\n\n至高神是婆罗提乌，又称巴格万，统管众小神，却很少受到热烈的供奉。人们真正祭拜的是氏族和村落的神灵、祖先与图腾，其中有村母神和每个氏族各自的佩尔萨·彭。\n\n1337年前后，贡德人已在约1200年建立昌达，14世纪又有加尔哈王国。随着宫廷奉毗湿奴为守护神、国王有时依吠陀礼仪火葬，印度教的影响日益加深，而村落里的旧有祭祀仍在延续。"
 kundism_religion_desc: "$kundism_religion$$common_folk_religion_desc$\n\n昆迪泛灵论为代奥里人所奉行，他们是萨迪亚和布拉马普特拉河上游河谷的藏缅语族民族。信仰以至上神昆迪—马马得名，这位“老者”是父神昆迪—吉拉与母神昆迪—吉拉西的合称。\n\n他们的子女是皮萨—德马（又称巴利亚—巴巴）和女神皮萨西，后者即塔姆雷斯瓦里或凯切—凯蒂。崇拜融合万物有灵与祖先崇拜，以圣林和氏族仪式为中心，不设偶像。\n\n代奥里人的传统把这一信仰与久蒂亚诸王联系在一起。女神化作一块巨石漂在迪邦河中，向她祈祷的四个久蒂亚人使巨石变轻，得以抬进她的神庙；国王任命他们为祭司，他们成了代奥里四个氏族的祖先。1817至1826年的缅甸入侵又使许多代奥里人被杀或被掳。"
 kuru_masaba_religion_desc: "$kuru_masaba_religion$$common_folk_religion_desc$\n\n库鲁·马萨巴是塞拉利昂滕内人的至高神，名字由库鲁（神或天空）和一个借自曼丁卡语、意为“大王”的词合成。滕内人认为他不能被直接接近，只能通过父系祖先；人们向祖先献祭，对其他或善或恶的灵也献上祭品。\n\n曼德人带来的波罗社、拉格本勒社和邦多社等秘密社团负责少男少女的成年礼。滕内人自称来自富塔贾隆，16世纪中叶被曼德人军队马奈征服。1505—1508年的葡萄牙记载称他们崇拜泥偶；伊斯兰教在18、19世纪间传入，北部几乎全部皈依。"
 lahu_religion_desc: "$lahu_religion$$common_folk_religion_desc$\n\n拉祜人的传统信仰是多神崇拜。拉祜人是藏缅语族民族，世居云南南部澜沧江一带的山地，相信有数量极多的鬼神，要靠驱鬼仪式来禳解，成败则用蛋卜来检验。\n\n他们的创世史诗《牡帕密帕》意为“造天造地”，共17个篇章、约2300行，由称为“波阔嘎阔”的歌手在村寨里演唱，讲述天地日月、万物与人类的由来。拉祜人还传说祖先出自葫芦。17世纪晚期佛教传入拉祜人当中，并在各村寨广为流传。"
 lamatuan_religion_desc: "$lamatuan_religion$$common_folk_religion_desc$\n\n拉马图安教为帝汶西南罗地岛上的罗地人所奉行，以名为拉马图安（又作拉马图亚克）的创世神为中心，这位神也被视为决定命运和赐福的存在，其象征是一根三叉的柱子。"
 lamoa_religion_desc: "$lamoa_religion$$common_folk_religion_desc$\n\n拉莫阿教是中苏拉威西巴雷埃人对神“普埃·姆帕拉布鲁”的古老崇拜。它的仪式“莫拉莫阿”是一种圆圈舞，称为“德罗”或“莫德罗”，在村寨战士从战场归来、作战首领“塔杜拉科”猎头归来时举行。\n\n巴雷埃人相信，用这种方式取得的头骨能驱除歉收之类的灾祸，人们就在礼仪屋“洛博”中央围着头骨起舞。\n\n托霍王国时期的1770年，拉莫阿教仍保持着原貌，被视为巴雷埃人的特征。托霍第一代国王皮莱维蒂接管了它的习俗，并逐步使巴雷埃人改信伊斯兰教；后来荷属东印度禁止了对普埃·姆帕拉布鲁的崇拜。"
 lenca_religion_desc: "$lenca_religion$$common_folk_religion_desc$\n\n伦卡人的宗教属于洪都拉斯中部和东南部以及萨尔瓦多东部的伦卡人。西班牙征服和改信天主教之后，它的神话所存甚少。\n\n伦卡人处在中美洲文化圈内，与邻族有许多共同的习俗，包括为祈求丰收、好天气或战争胜利而举行的动物祭祀，以及一种365天的历法。妇女在伦卡人的萨满活动中十分活跃，祭司阶层中可能有许多女性。\n\n人们举行仪式感谢女神伊兰吉普卡和玉米，也祭祀带来雨水、风和丰产的神灵，以及守护河流和森林的神灵。各伦卡领地每年定期休战，并举行称为关卡斯科的仪式。伦卡人抵抗西班牙人的领袖是伦皮拉，他于1537年去世。"
 lezgin_paganism_desc: "$lezgin_paganism$$common_folk_religion_desc$\n\n列兹金多神教为达吉斯坦南部和阿塞拜疆北部的列兹金人所奉行。它从黑暗讲起：创世神创造了天和地，然后创造了红牛亚鲁·亚茨，把世界安放在它的角上，而红牛立在大水之上。\n\n宇宙分三层。上界有七重天，太阳神拉格居于最高一重；中界是人、动物和植物的世界；下界是死者的国度，由死神阿尔达夫掌管，最深处是塞德率领的恶神。三界由世界树和一道彩虹桥连接。\n\n伊斯兰教最早可能在8世纪传到列兹金人那里，但他们直到15世纪都主要是万物有灵的信徒，那时波斯商人和金帐汗国加强了穆斯林的影响。"
 lisu_religion_desc: "$lisu_religion$$common_folk_religion_desc$\n\n傈僳人是滇西北和怒江流域的藏缅语族山地民族。他们的传统信仰是朴素的万物有灵，向山中的神灵献祭，重要仪式由巫师主持。每个村寨的最高处有一片神林，人们在那里向天神献祭，在中国称为老祖神；家家户户的后部设有祖先神位。\n\n最主要的节日在新年，收获时节要酿新酒。农历二月初八的刀杆节，纪念明正统年间征讨麓川土司的战事中，傈僳将士上刀山、跳火海的事迹。"
 lollardy_desc: "$lollardy$由约翰·威克里夫领导，是一场早期宗教改革运动。它倡导普世祭司职分，并拒绝洗礼与告解等圣事对救赎的必要性。其教义强调通过圣经直接与上帝沟通，圣经被翻译成通俗语言，这使得其神学为普通民众所接受，并推动了早期教会改革的呼声。\n\n罗拉德派背后的约翰·威克里夫是牛津大学的神学家，1381年因异端罪名被逐出大学。他的追随者被讥称为罗拉德派，把圣经译成英语，即威克里夫圣经。\n\n1381年农民起义之后，他们的保护者纷纷离去。1401年亨利四世颁布《焚烧异端法》；骑士约翰·奥尔德卡斯尔1413年被定罪，逃出伦敦塔后发动起义，终告失败。\n\n罗拉德派转入地下，以秘密的小团体延续。1510至1532年间，伦敦教区约有310名罗拉德派信徒受到审判；宗教改革期间，这一运动大多并入了英格兰新教。"
 lugbara_religion_desc: "$lugbara_religion$$common_folk_religion_desc$\n\n阿德罗教为乌干达西北部以及刚果和南苏丹邻近地带的伦古巴人所奉行。它的至上神阿德罗阿创造了第一对男女，即孪生的戈博罗戈博罗和梅梅，伦古巴人把他们视为自己的祖先；阿德罗阿还把社会的法则传给了他们的后代。\n\n阿德罗阿有两个方面：一是善的、遥远的天神，一是地上的河中精灵阿德罗，他会向临终的人显形，传统上人们以童祭崇奉他。人们相信每个男人都兼有二者，死后各归各的领域。"
 lutheran_desc: "$lutheran$基于马丁·路德的《九十五条论纲》，最初是对$catholic_ADJ$会改革的呼吁，后来发展为一个独立的新教教派。它教导旧约与新约圣经是$christian_ADJ$教义唯一无误的权威。\n\n德国修士马丁·路德1517年发表的《九十五条论纲》抨击兜售赎罪券等弊端，由此开启了宗教改革。路德宗这一名称是约翰·埃克在1519年的莱比锡辩论中首次用作贬称的。\n\n路德宗认为罪人唯独因恩典、唯独藉信心称义。它保留了旧礼仪的许多内容，并把圣餐放在核心位置。其教义见于1530年的《奥格斯堡信条》。\n\n1525年，普鲁士以路德宗为国教。1527年，瑞典的古斯塔夫·瓦萨在韦斯特罗斯议会上使国家教会归于王权，克里斯蒂安三世治下的丹麦—挪威则在1536年采纳路德宗。1547年施马尔卡尔登战争之后，1555年的《奥格斯堡和约》使路德宗在帝国内取得合法地位。"
 maasai_religion_desc: "$maasai_religion$$common_folk_religion_desc$\n\n马赛人是尼罗特语系的牧牛民族，南下进入今肯尼亚和坦桑尼亚北部的大裂谷地带。邻近的基库尤人把自己遥远的至高神称作恩加伊，也称他为尼亚加。\n\n马赛人崇拜唯一的创造者恩加伊，他兼有男性和女性两种属性，创造了天空、大地、人类和牛群。他有两副面孔：黑恩加伊带来雨水和丰产，红恩加伊带来干旱和闪电。他最初的居所是神山伦盖伊火山。\n\n莱邦是祭司、占卜者和医者，居于生者与创造者之间，主持献祭。牛被认为是恩加伊的赐予。他们的死者弃置野外，因为人们认为土葬会伤害土地。"
 mahayana_desc: "大乘佛教音译为“摩诃衍那”，是$buddhist$的一个分支，它不仅接受早期$buddhist_ADJ$的经典，还接纳大乘$sutra$。它强调$bodhisattva$的形象，认为$bodhisattva$道是所有人皆可修行的成佛之路。虽然大乘佛教最初在$india$发展，但其主要扩展是通过$china$和丝绸之路实现的，如今汉文大藏经构成了所有$mahayana$的基础。\n\n大乘佛教约公元前1世纪兴起于印度，鸠摩罗什等译经师把它带入中国。佛教自中国传入朝鲜半岛、越南和日本。高丽和越南李朝都得到王室的扶持，朝鲜半岛上的禅宗更成为高丽的国家宗教；越南陈朝的陈仁宗在1290年代创立了越南禅宗的竹林派。\n\n1392年建立的朝鲜王朝推崇新儒学而压制佛教，直到僧人在1592—1598年协助抗击日本入侵，压制才告停止。清朝宫廷则支持藏传佛教的格鲁派。"
 maleiwa_religion_desc: "$maleiwa_religion$$common_folk_religion_desc$\n\n玛雷瓦教为瓜希拉半岛上的瓦尤人所奉行，该半岛位于今哥伦比亚和委内瑞拉的加勒比海岸。信仰的核心是玛雷瓦，他创造了万物，也是瓦尤人社会的奠基者。普洛威与风和旱季相联系，胡亚是四处游荡的猎人，他们是一对主管生命的半神夫妻；万努鲁则是带来疾病与死亡的恶灵。\n\n亡者仍是瓦尤人生活的一部分。遗体与随身物品一同下葬，五年之后骨骸被挖出，再葬入氏族的墓地。\n\n西班牙人始终未能征服瓦尤人；他们在1701年摧毁了一座嘉布遣会传教所，1769年又在埃尔林孔烧毁了教堂。"
 maleku_religion_desc: "$maleku_religion$$common_folk_religion_desc$\n\n瓜图索人（自称马莱库）传统上讲述一个被称作“大屋”的世界，在诸神到来之前什么事也没有发生。最先来到的是“纳里内河源之神”；他梦见一位女神，女神就出现了，随后其他神也陆续到来，并推举他为首领。\n\n他创造了植物、动物和人类，有一阵子，诸神整天聚在一起饮巧克力。后来，“奥雷河源之女神”因为自己不能创造而嫉妒他的作品，不断催促他进行“大地的转变”。他派去警告第一代人类的使者要么被无视，要么被人用长矛刺杀；随后大灾变降临，消灭了那一代人类。\n\n西班牙移民直到1750年前后才发现马莱库人。由于没有常设的传教站，他们的宗教在天主教的传教面前得以延续。"
 malesung_religion_desc: "$malesung_religion$$common_folk_religion_desc$\n\n马莱宗信仰为苏拉威西岛北端的米纳哈萨人所奉行，由称为“托纳阿斯·瓦利安”的祭司主持。米纳哈萨人把自己的血统追溯到最初的一对男女托阿尔与鲁米穆乌特。他们的后代发生争执，各部首领“托纳阿斯”于是在一块名为皮纳韦腾安的石头旁聚会，把人群分成三个群体，各有自己的语言和仪式。\n\n瓦利安是萨满，常常由女性担任。直到19世纪很久之后，米纳哈萨人仍分成彼此敌对的武士社会，盛行猎头，人们相信猎头能让武士获得“凯特”，那是一种与勇气和生育力相连的精神实质。\n\n1560年代，葡萄牙方济各会传教士使一些人改了宗；米纳哈萨人则抵制伊斯兰教。1679年与荷兰东印度公司的条约开启了荷兰的统治，米纳哈萨人后来多信奉基督新教。"
 mandeaism_desc: "$mandeaism$是一种诺斯替宗教，认为施洗约翰是最后的先知，同时也包含$greek_culture$与$iranian_group$文化的影响。尽管它承认其他亚伯拉罕宗教的一些先知，但并不认为亚伯拉罕、摩西或耶稣是$mandeaism_ADJ$的先知。$mandeaism$的神被称为“$mandeaism_god_name$”（哈依·拉比），代表宇宙的创造力量。\n\n曼达派流行于美索不达米亚南部的沼泽与河流一带，也带有犹太文化的影响。信徒的名称出自“曼达”（意为知识），邻近的穆斯林称他们为萨比教徒。他们尊奉亚当、塞特、诺亚和闪。\n\n每个星期日，信徒都要在流动的河水中受洗，称为玛斯布塔，所以每座曼迪（神庙）都建在河边。社群因被认同为《古兰经》中的萨比教徒，获得了“有经人”应得的保护。\n\n1559年，葡萄牙耶稣会士称他们为“圣约翰的基督徒”。1831年，霍乱夺走了舒什塔尔大部分祭司的性命，两名幸存的助祭在苏格·舒尤赫重建了祭司制度。"
 manichaeism_desc: "$manichaeism$是萨珊帝国时期由先知摩尼创立的一种$iranian_group$宗教，受到诺斯替主义、$zoroastrian$、$christian$与$buddhist$等多种宗教的影响，但认为摩尼是继琐罗亚斯德、佛陀与耶稣之后的最后一位先知。其神学是二元论的，将宇宙描述为光明与黑暗之间的灵性斗争。\n\n摩尼教的先知摩尼于216年生在泰西封附近。摩尼教团分为过着禁欲修行生活的男女僧侣“选民”，和供养他们的“听者”。摩尼教向西传入罗马统治下的北非，奥古斯丁曾做过九、十年听者，后来转而反对它；向东传入中亚，回鹘牟羽可汗于763年将它定为国教。\n\n到1337年，它只在中国还有遗存，信徒借佛教和道教的外形自保，把摩尼尊为“光明佛”。泉州附近的草庵里，1339年有人捐造了摩尼像，庙宇也在这一年重建。明朝于1370年禁止摩尼教，不久它就被佛教和道教吸纳。"
 maonan_religion_desc: "$maonan_religion$$common_folk_religion_desc$\n\n毛南人是广西西北部的侗水语支民族。他们的民间信仰既是万物有灵，也是多神崇拜，受道教影响很深，许多神灵和仪式借自汉族民间信仰。其中有灶神，以及保佑户外劳作平安的土地神。\n\n家家设有神龛，是墙上的一块木板，写着诸神和祖先的名字。生育女神汉语称万岁娘娘，成婚时要向她求子；夫妇有了孩子，要用二十六头牲畜还愿。\n\n五月里毛南人过分龙节，全村人一起祭祀神灵与祖先。办丧事时，孝子要到河边“买水”为亡者洗身，下葬前把鸡血洒在墓地上。"
 marapu_religion_desc: "$marapu_religion$$common_folk_religion_desc$\n\n在松巴岛的玛拉甫信仰中，“玛拉甫”一词既指永恒天界普莱玛拉甫的居民，他们是松巴人的祖先；也指祖先的灵魂和宇宙间的灵。世界的平衡由大母伊娜卡拉达和大父阿马卡拉达象征，也就是月亮和太阳，他们生下了最初的祖先。松巴人相信，七对男女沿着水牛角做成的梯子降到人间，人死之后也会爬上这架梯子。\n\n传统上，人们把有人脸的木像玛拉甫放在石祭坛上，供奉槟榔和祭牛。葬礼可以推迟数年，举行时数百名男子用圆木滚杠拉着石板，这是“拉石”仪式。"
 mari_paganism_desc: "$mari_paganism$$common_folk_religion_desc$\n\n奇马里多神教为伏尔加芬兰语民族马里人所奉行。它属于单一主神倾向的多神信仰：多数神灵被视为最高神库古·尤莫的化身，他是宇宙法则的创造者。居于他之下的是克列梅特，这位大地与水之主立场暧昧，会记录人的过错并加以惩罚。\n\n崇拜在圣林或家中进行，由家中长者或祭司卡尔特主持。秋天要献祭一只鹅，感谢收成。\n\n16世纪，他们的土地夹在俄罗斯与喀山汗国之间，在1552年喀山陷落而告终的战争中被置于俄罗斯控制之下。马里人名义上受洗，却保留旧日仪式，一些人逃往巴什基尔以躲避受洗。"
 mayan_desc: "$mayan$$common_folk_religion_desc$\n\n尤卡坦、恰帕斯和危地马拉高地的各玛雅民族，在各个王国都有自己的地方崇拜。播种、收获时的祭仪都为玉米而设，260天计数与365天年历相配，安排着仪式历法。\n\n基切人的《波波尔·乌》讲述了创世，以及英雄双子下到西巴尔巴的故事。1500年前后，各王国的朝圣者前往奇琴伊察的大天然井，也前往尤卡坦外海岛屿上的伊希切尔女神圣所。\n\n西班牙人在1527—1546年间征服了尤卡坦诸王国。1562年，方济各会士迭戈·德·兰达在马尼焚毁了按他自己的说法共27部书和约五千件偶像。伊察人在诺赫佩滕坚守到1697年；1712年恰帕斯的泽套人起义，就是以崇拜圣母马利亚为号召。"
 mbori_religion_desc: "$mbori_religion$$common_folk_religion_desc$\n\n姆博里教为阿赞德人所奉行，阿赞德人是中非乌埃莱河上游一带的征服者，18世纪上半叶才形成。它以姆博里为核心，姆博里是全能的神，创造了宇宙，但和后来来到阿赞德人当中的传教士所说的基督教上帝并不相同。\n\n阿赞德人传统上借助神谕、魔法和巫术解决日常的烦恼，其中只准男子使用的毒药神谕最受尊重。特乌雷是诡计之神，关于他的故事教人知道鲁莽行事的后果。"
 mesoamerican_desc: "$mesoamerican$$common_folk_religion_desc$\n\n托纳利宗教涵盖纳瓦人和玛雅人之外的中美洲诸民族，主要指米却肯的普雷佩查人和瓦哈卡的米斯特克人、萨波特克人。各民族有各自的神。普雷佩查人崇拜“大火”库里卡韦里，他是火神和太阳神，也是统治家族瓦库塞查氏的守护神，据说他在异象中指引塔里亚库里去统一帕茨夸罗湖盆。萨波特克人敬奉闪电和雨神科西霍，他们的大祭司乌伊哈‑塔奥住在米特拉，那里是通往亡者世界的圣所。米斯特克人向雨神扎维祈祷，并把王室谱系绘在祖什‑纳托尔抄本等彩绘手抄本里。\n\n1521—1522年，米斯特克人和萨波特克人先后臣服西班牙；1530年，普雷佩查国王坦加苏安二世被处死。1553年，教会下令拆毁米特拉的神庙。"
 miaphysite_desc: "$miaphysite$教导在基督的位格中，其神性与人性结合为一个不可分割的本性。这一教义源自以弗所大公会议，广泛传播于亚美尼亚、埃及和埃塞俄比亚等地区。$miaphysite_ADJ$社区保留了其独特的礼仪与传统，强调基督作为神与人的合一。\n\n基督合性派遵循亚历山大的济利禄的公式，济利禄是431年以弗所会议的主将；它拒绝451年主张两个本性的卡尔西顿会议。亚历山大、安条克和亚美尼亚的多数主教拒绝了卡尔西顿会议。\n\n追随他们的东方正统诸教会有埃及的科普特教会、叙利亚正教会和亚美尼亚使徒教会，还有埃塞俄比亚教会。1337年，埃塞俄比亚帝国是最强大的合性派政权；亚美尼亚的奇里乞亚王国也信奉这一教义，该国于1375年被马穆鲁克灭亡。\n\n埃塞俄比亚教会顶住了罗马的压力。耶稣会士曾使皇帝苏塞尼奥斯皈依天主教，但他于1632年退位，其子法西利达斯恢复了旧信仰，并在1633年驱逐了耶稣会士。"
 midewiwin_religion_desc: "$midewiwin_religion$$common_folk_religion_desc$\n\n密得微是五大湖、新英格兰和沿海诸省的阿尼什纳比人的宗教社团，奥吉布瓦人也在其中，又称大医药会。奥吉布瓦人的传统把创立之功归于文化英雄韦纳博佐。\n\n一种说法讲，造物主见他造出的人受病痛和死亡折磨，便差太阳神灵化作男孩来到人间，把神圣的医药传给他们。入会者要完成规定的教导和仪式才能逐级晋升。教义以象形图画画在桦树皮卷轴上；安大略发现的两卷经碳测定约为1560年的遗物。\n\n仪式在圆顶椭圆形的大医药棚里举行。宝贝贝，即米吉斯贝壳，是这个社团的神圣标志。"
 minangkabau_religion_desc: "$minangkabau_religion$$common_folk_religion_desc$\n\n苏门答腊西部高地的米南加保人保持着更古老的泛灵信仰，与佛教相融。米南加保人的传统史书《塔博》说，最初的米南加保人在马拉皮火山只有一枚蛋那么大时登陆其上。\n\n据说万物皆有生命之灵“塞芒阿特”。生病意味着邪灵抓住了塞芒阿特，这时要请称为帕旺的巫师安抚精灵。习惯法“阿达特”的许多内容就取材于这些信仰。\n\n佛教曾在高地兴盛，密宗佛教徒阿蒂亚瓦曼约在1347至1375年于帕加鲁永统治。伊斯兰教大约在16世纪传入高地，但直到1803年巴德里运动兴起之前，信徒的礼拜和斋戒一直松懈；这场运动向旧习俗开战，战争持续到1837年。"
 mishmi_religion_desc: "$mishmi_religion$$common_folk_religion_desc$\n\n米什米泛灵论为米什米山区的森林民族所奉行，分布在阿鲁纳恰尔邦的迪邦河和洛希特河流域，以及境外的西藏南部。米什米人分为义都、迪加罗、米久和登四支，其中义都的信仰记载最完整。\n\n义都人认为宇宙和人类是至上神伊尼·马舍洛—济努和纳尼·因塔亚所创造。他们崇敬太阳和主宰宇宙的神灵，既祭祀善灵，也祭祀恶灵，相信有鬼魂、护身灵和来世。义都的萨满称为伊古，用仪式、舞蹈和吟唱来保佑家人平安健康。"
 mississippian_ceremonial_desc: "$mississippian_ceremonial$$common_folk_religion_desc$\n\n仪俗信仰指美国东南部和中西部的密西西比诸酋邦所共有的宗教图像和仪式，它们大约在1200年至1650年间随玉米农业繁盛。学者称之为东南仪典综合体，其早期最完整的表现形成于卡霍基亚。这座城市位于密西西比河畔，存在于约1050年至1350年之间。\n\n宇宙分为三层。上界住着雷霆之灵和晨星；寒冷的下界住着水下豹和玉米母亲；人类居于中间。身披猎鹰装束、手持棍棒起舞的鸟人，常见于铜片和贝壳饰物，是战士的守护者。\n\n这类图像用来标示酋长的职位和战争。随着卡霍基亚及其贸易网络崩溃，各地风格渐行渐远，演变成后来各个历史部落的信仰。"
 mitu_religion_desc: "$mitu_religion$$common_folk_religion_desc$\n\n米图泛灵论流行于马鲁古东南部的凯伊群岛，其中称为“米图”的灵体既能带来幸福，也能带来苦难。收成好坏、安康或灾祸，都被认为来自它们的力量，所以人们在家庭里举行小型仪式，每年还要为聚落（奥霍伊）举行集体的“索布索布”清洁仪式。人也可以借助称为“苏昂吉”的巫术驱使米图。\n\n研究者认为凯伊的古老宗教混合了万物有灵、巫术和图腾信仰。与它并行的是祖先传下的习惯法《拉尔武尔·恩加巴尔》，该法把凯伊人分成两个集团：九邦的乌尔西乌和五邦的洛尔利姆。"
 mizo_religion_desc: "$mizo_religion$$common_folk_religion_desc$\n\n萨库阿，又称库阿崇拜，为米佐人所奉行。米佐人旧称卢塞人，是印度东北部的藏缅语山地民族。创世传说讲女神库阿津努把每个部族和每种动物各一对放进山洞，用大石钦隆封住洞口；她搬开石头，各氏族陆续走出，直到吵闹的拉尔泰人喧哗着挤出来，她便把石头又盖了回去。\n\n帕提安是仁慈的创造者，赏善罚恶。信仰的实际对象是各种灵：山顶上乐于助人的库阿旺，以及住在山洞、泉水和大树里的危险的拉姆怀。\n\n祭司统称普伊蒂亚姆。萨多特服务于首领，首领可以任命或罢免他；生病时请来巴乌普，由他指明要用什么祭品去安抚作祟的灵。"
 moism_desc: "$moism$$common_folk_religion_desc$\n\n麽教为广西壮族所奉行。它从壮族先民更古老的信仰发展而来，也吸收了佛教、道教的一些教义。主神是创造者、也是教派创始人的布洛陀。万物皆有灵。\n\n布洛陀身边有姆六甲。姆六甲是花神和生育女神，掌管一座花园，每个孩子都是园中的一朵花，男孩是金花，女孩是银花。神职人员称为麽公，可以娶妻生子，不必出家。他们的圣典《布洛陀》最初靠口耳相传。\n\n每个家庭都设有祖堂，供奉近三代的祖先，对他们既敬又畏。死者要二次葬，但横死的人则要火化，以免放出恶灵。"
 moksha_religion_desc: "$moksha_religion$$common_folk_religion_desc$\n\n萨卡依崇拜为莫克沙人所奉行。莫克沙人是说乌拉尔语系语言的莫尔多瓦人的一支，居住在莫克沙河和伏尔加河中游一带。信仰得名于太阳什凯，它被视为主神；月亮、雷和水也受到崇拜。\n\n在创世神话中，大鸟伊涅·纳尔蒙，又称白天鹅，最先造出水；一只鸭子从海底衔来沙子，大鸟把它塑成大地，并在上面立起大树。马斯托拉蒂亚统治冥界，英雄和战士的灵魂则前往翠绿的乌西亚岛，同图什坚王一起畅饮纯蜜酒。\n\n1552年以后，莫克沙人成了俄国的臣民。俄国的统治带来了强迫改宗东正教，但异教的成分长期保留在基督教习俗之中。"
 momolianism_religion_desc: "$momolianism_religion$$common_folk_religion_desc$\n\n摩摩利安教为婆罗洲北部沙巴的卡达山‑杜顺人、穆如特人和伦古斯人所奉行。它源于最初的祖先在传说中的祖居地努努克拉冈与自然及神灵打交道的经历，后来融进了被称为“阿达”的不成文习惯法。\n\n创世之神被称为基诺罗欣甘，在一种说法里，基诺英甘和妻子苏米农杜是最初的一对夫妇。这套知识由女祭司“博博利安”代代相传，她们为人治病。若有人触犯禁忌，瘟疫和饥荒就会降到整个社群头上，直到首领惩办了罪人。\n\n饥荒逼近时，基诺英甘与苏米农杜的女儿胡米诺顿自愿献身，她的身体长成了拯救族人的粮食作物。死者前往纳巴胡，即今天的京那巴鲁山。"
 monpa_religion_desc: "$monpa_religion$$common_folk_religion_desc$\n\n门巴人是居住在喜马拉雅南麓达旺一带门域的民族，他们固有的信仰与藏传佛教长期并存。17世纪，多数门巴人在曾赴不丹受学的梅拉格喇嘛影响下皈依格鲁派，达旺寺成为他们生活的中心。"
 mororuma_religion_desc: "$mororuma_religion$$common_folk_religion_desc$\n\n尤拉卡雷人是玻利维亚低地的森林民族，住在科恰班巴与贝尼之间。他们所说的语言是没有已知亲属的孤立语。\n\n尤拉卡雷人的传统把灵分成两类。第一类是土地和黏土的主人，人们对黏土心怀敬畏，不能对着它撒尿。莫罗鲁玛则是最强闪电的主人，他们把这份力量借给尤拉卡雷人的萨满，让萨满治病。死者连同弓箭一起下葬，因为人们相信死者会去到地下一处猎物丰富的地方。\n\n为了抵御西班牙人的扩张，尤拉卡雷人退入与世隔绝的深处。直到18世纪末，他们才不再生活在殖民世界之外。"
 mu_ngava_religion_desc: "$mu_ngava_religion$$common_folk_religion_desc$\n\n穆恩加瓦泛灵论为所罗门群岛伦内尔岛上的波利尼西亚居民所奉行，据说他们的祖先乘独木舟从乌韦阿而来。口述传统提到一位名叫塔哈西的灵媒，他告诉最初的航海者前方还有一座尚未发现的岛；传统中也提到从东乌韦阿带来的姜黄，用于仪式性的染色和涂抹。"
 muinaisusko_desc: "这是$finnish_language$人民的传统信仰，包含众多神祇，其中最普遍的是天神与雷神乌科。它也包含对死者的崇敬与萨满实践，同时与附近其他宗教有一些共同特征。\n\n索米多神教为波罗的海芬兰诸民族——芬兰人、爱沙尼亚人、卡累利阿人等——在基督教化之前所奉行。各地、各时期的习俗并不一致。\n\n尤马拉也是天神，名字后来成了基督教上帝的称呼。阿赫提掌管海洋和鱼，塔皮奥掌管森林和狩猎。蒂塔雅意为“知晓者”，是能够入神、前往地下亡者之地图奥内拉的萨满，那里由图奥尼统治。\n\n基督教化大约从12世纪开始。教堂常建在旧圣地上，圣树被砍倒，但民间法术和口头传统在乡间又延续了很久。"
 muisca_religion_desc: "$muisca_religion$$common_folk_religion_desc$\n\n在哥伦比亚安第斯山中部的穆伊斯卡联盟，统治者兼任政治领袖和宗教领袖。至高者奇米尼加瓜创造了光明和大地，但人们并不直接崇拜他，祭拜的对象是月亮女神奇亚和她的丈夫、太阳神苏埃。据编年史家记载，最早的穆伊斯卡人随母神巴丘埃从伊瓜克湖而来，导师包查卡则教他们纺织和法度。\n\n称为奥克的祭司带领朝圣，并在瓜塔维塔湖、托塔湖等圣湖献上金像、祖母绿，有时还有活人。祭仪中还伴有古柯、烟草和约波的使用。\n\n1530年代的西班牙征服终结了旧秩序，最后一次公开仪式于1563年12月27日在乌巴克举行。"
 mulam_religion_desc: "$mulam_religion$$common_folk_religion_desc$\n\n仫佬人是广西北部的农耕民族，自称先祖是古代的伶人和僚人。他们的民间信仰传统上是万物有灵的多神崇拜，深受汉族和壮族邻人的影响。仪式由巫师主持；端午节时，巫师举行仪式，保佑庄稼丰收，驱除害虫。\n\n最隆重的是依饭节，这是感恩祈愿的节日，要杀牲祭祀。三月里人们敬拜生育女神花婆，传说她的花园里的花都会变成孩子，人们在她的庙前宰杀猪牛。罗城一带有佛寺，遇到生病和灾害时，仫佬人请道教法师，多请梅山教一派。"
 muong_religion_desc: "$muong_religion$$common_folk_religion_desc$\n\n芒人是越南北部的高地民族，与低地的越人有着古老的共同源头。他们的宗教是多神信仰，与越南民间信仰共有许多超自然存在；主要的节日是农历新年，届时芒人向祖先祈祷。\n\n人们认为每个活人都有许多灵魂，从生到死是分阶段完成的。芒人的创世史诗把最初的人追溯到山中的一个洞穴，人们从那里散居到各个村寨；其中一个儿子，称作越王，下到平原建起了都城。"
 muonyjang_religion_desc: "$muonyjang_religion$$common_folk_religion_desc$\n\n坚格信仰为丁卡人所奉行，他们沿白尼罗河放牧牛群，分布在加扎勒河一带的平原上。13世纪基督教国家阿洛迪亚瓦解时，他们的先民离开了杰济拉。\n\n至高神是掌管天空和降雨的尼雅力克，他远离人间事务。神话说他造出最初的人类加朗和阿布克；阿布克违背命令多种了谷物，尼雅力克便割断了连接天地的绳索。祈祷先向尼雅力克诉说，再依次呼唤氏族神灵和被称为乔克的祖先之灵，献祭一头公牛或阉牛。\n\n每个丁卡人从父母双方各继承一个图腾，不拜它，而把它当作亲属。丁卡人对邻近的伊斯兰教和基督教大多置之不理或加以拒绝，其中就有1504年兴起的丰吉苏丹国。"
 musala_religion_desc: "$musala_religion$$common_folk_religion_desc$\n\n穆萨拉教是苏丹南科尔多凡努巴山区的信仰，其宗教人物称为库朱尔，卡杜格利语叫“塔穆斯拉”，人们认为他被神灵附身，主持称为“西比尔”的仪式。"
 naa_wuni_religion_desc: "$naa_wuni_religion$$common_folk_religion_desc$\n\n纳乌尼信仰为加纳北部曼普鲁古的曼普鲁西人所奉行；曼普鲁古王国约在13世纪由纳·格贝瓦在普西加建立，他的陵墓所在之地是曼普鲁西人崇敬的祖地；多数曼普鲁西人从17世纪起经迪尤拉商人开始转信伊斯兰教。"
 nacuco_religion_desc: "$nacuco_religion$$common_folk_religion_desc$\n\n纳库科信仰为皮豪人所奉行。皮豪人是今哥伦比亚托利马一带安第斯山中松散的酋邦联盟。他们认为星辰、天气、水源、植物和生灵都是同一个神圣整体的组成部分，人的行为会扰乱这个整体。人们靠仪式维持平衡，祭品从奇恰酒到人血不等，还制作涂着各种颜色的金、陶或木制神像。\n\n祭司莫汉在神圣仪式之前要斋戒，称为特瓜的人则负责治病。酋长和莫汉的遗体会被制成木乃伊，让人们前来膜拜。皮豪人与西班牙人交战了许多代，最终才被征服。"
 naga_religion_desc: "$naga_religion$$common_folk_religion_desc$\n\n那加泛灵论为统称为那加的众多山地部落所奉行，他们分布在阿萨姆、曼尼普尔河谷和亲敦江上游之间。他们敬奉太阳、月亮、树木和石头等自然之物，相信有一位至上神和与自然相连的诸多小神灵，用仪式和牲祭来安抚它们。\n\n民歌和舞蹈属于节庆和宗教场合，猎头和部落间劫掠是旧秩序的一部分。19世纪中叶美国浸礼会传教士把基督教传入那加山区，同一世纪英国人也试图废止猎头；传教士反对旧的歌曲，认为它们与崇拜神灵、战争和不道德有关。"
 nahuatl_desc: "纳瓦特尔宗教是$nahua_group$人的信仰，其众多$nahuatl_god_name$（意为神祇）在至高神奥梅特奥特的统领下组织起来。其他神祇，如$huitzilopochtli_god$、$tlaloc_god$或$quetzalcoatl_god$，常被选为领地或民族的守护神。其关键实践之一是献祭，以向神祇表示敬意并保持他们的眷顾。\n\n纳瓦人的宗教以阿兹特克人最为人所知，他们透过“特奥特尔”这种神圣力量来看待世界，这种力量化为众多神祇。墨西加人的神是维齐洛波奇特利，雨神是特拉洛克。节庆、政务乃至战争都依历法择期。\n\n神庙是层层垒起的金字塔，每隔52年就在外面加盖一层。特诺奇蒂特兰的大神庙上并列着维齐洛波奇特利和特拉洛克的神殿，两位大祭司的头衔都是魁札尔·科亚特尔。\n\n特诺奇蒂特兰建于1325年；1519—1521年，科尔特斯和特拉斯卡拉盟友推翻了阿兹特克帝国，1524年十二名方济各会士抵达，开始系统地使纳瓦人皈依基督教。旧日信仰以天主教的形式留存下来，见于对瓜达卢佩圣母的崇拜和亡灵节。"
 nallagdigua_religion_desc: "$nallagdigua_religion$$common_folk_religion_desc$\n\n纳拉迪瓜信仰属于大查科地区的瓜伊库鲁人莫科维人（莫科维即莫科伊特人），他们靠狩猎、捕鱼和采集为生，认为宇宙分成若干层。1743年耶稣会传教士为他们建立了圣哈维尔归化区。"
 namandu_religion_desc: "$namandu_religion$$common_folk_religion_desc$\n\n尼亚曼杜意为“最初者”，是瓜拉尼人宇宙观里的至高存在，其神话主要由今巴拉圭瓜伊拉地区的姆比亚瓜拉尼人保存。他无形无相，永恒而全能，居住在永恒居所；与他对立的是代表邪恶本原的阿尼亚。\n\n尼亚曼杜像一棵树那样自己生出自己，他的心中放出光芒，驱散了黑暗。他召来火神卡拉伊和掌管水与雷的图帕，一同造出大地和最初的人类。一对孪生男孩，母亲死后由美洲豹抚养，最终进入永恒居所，成为太阳和月亮。\n\n1610年，耶稣会在帕拉纳帕内马河畔建立洛雷托，这是瓜伊拉的第一个传教区。此后各传教区先后聚集了十万以上的瓜拉尼人。"
 naoma_religion_desc: "$naoma_religion$$common_folk_religion_desc$\n\n纳奥玛教是泰罗纳人的宗教。泰罗纳是哥伦比亚加勒比海岸圣玛尔塔雪山上的一批奇布查语酋长邦，他们建起了特尤纳（后称迷城）等石砌台地城镇。关于他们信仰本身的文字记载很少。\n\n1525年西班牙人建立圣玛尔塔之后，泰罗纳人与他们作战数十年，到1600年幸存者退入高山。他们的后裔科吉人、威瓦人、阿鲁阿科人和坎库阿莫人被认为保留了大量旧传统。科吉人讲述的创世者是大母神，她的思想“阿卢纳”先于世界存在。他们的祭司马莫，从幼年起就要在与世隔绝的环境中接受训练。"
 natugu_religion_desc: "$natugu_religion$$common_folk_religion_desc$\n\n纳图古泛灵论属于所罗门群岛嫩德岛（又称圣克鲁斯岛）上说纳图古语的居民。纳图古在当地语言中的意思就是“我们的语言”。"
 naurus_religion_desc: "$naurus_religion$$common_folk_religion_desc$\n\n诺茹派是马鲁古塞兰岛上马努塞拉人和努奥鲁人的信仰，是在岛上本土宗教里混入印度教因素的混合信仰。据说这些因素在遥远的过去来自棉兰老岛上的武端印度教王国，信徒自称印度教徒。\n\n它的神灵可能包括取自《罗摩衍那》的名字，如拉比（罗摩）和海努韦莱（哈奴曼），还有那伽；不过拉比和被称为“椰子少女”的海努韦莱，更应当视为本地神话中的人物。最高神名为安拉塔拉。"
 naylamp_religion_desc: "$naylamp_religion$$common_folk_religion_desc$\n\n纳扬普是秘鲁北部海岸兰巴耶克人，即锡坎人的建国英雄，传说见于1586年写成的一部西班牙编年史。故事里，他从南方乘筏出海而来，随行有妻子和一批随从。他在海岸登陆，建起名为乔特的神庙，供奉一尊与他形貌相同的绿玉神像扬帕列克。\n\n纳扬普建立了一个共十二位统治者的王朝。他死时，儿子们说他长出了翅膀，飞走了。\n\n最后一位国王费姆帕列克想移走神像，随后便有持续30天的洪水，以及干旱和饥荒。祭司们归咎于他，把他投入大海。山谷由此分裂为许多小领地，14世纪晚期奇穆人征服了这里。"
 nduke_religion_desc: "$nduke_religion$$common_folk_religion_desc$\n\n恩杜克泛灵论属于所罗门群岛新乔治亚群岛中科隆班加拉岛西南部的居民，他们说杜克语，自称杜格雷。口述历史说，岛上其他民族在战争中被消灭，时间大概在19世纪初，而西南部的人靠修建山地堡垒活了下来。"
 nestorianism_desc: "$nestorianism$以聂斯脱里命名，教导基督的神性与人性是完全分离的，并存于一体。这一教义被以弗所大公会议拒绝，但在波斯及其他地区找到了强大的追随者。聂斯脱里派基督徒将其信仰传播至$asia$，成为覆盖地域最广的$christian_ADJ$宗教。\n\n聂斯脱里派是对东方教会的通称。它的得名者聂斯脱里曾任君士坦丁堡牧首；431年以弗所会议谴责他的主张之后，萨珊波斯的教会仍坚持这一教义，其牧首驻在塞琉西亚—泰西封，后来驻巴格达。\n\n它的礼仪用阿拉米语，在哈里发治下发展壮大。牧首提摩太一世在位于780至823年，曾为中亚的突厥人、中国和印度任命都主教。\n\n此后教会衰落。1370年以后，帖木儿的迫害使基督教在中亚绝迹，教会只留存于库尔德斯坦的山区和马拉巴尔的圣多马基督徒之中。17世纪，它的两支牧首世系先后断绝了与罗马的往来。"
 ngacang_religion_desc: "$ngacang_religion$$common_folk_religion_desc$\n\n阿昌人是滇西的藏缅语族民族，源出氐羌部落。他们的传统信仰各地不同：梁河一带保留着万物有灵的原始信仰，户撒的阿昌人则接受了上座部佛教。\n\n旧信仰的核心是创世史诗《遮帕麻和遮咪麻》。诗里的始祖造天织地，创造人类，又智斗魔王腊訇。他们是最受崇拜的善神。窝罗节上，人们献祭祖先，唱诵史诗，跳舞聚会。\n\n佛教葬礼上，僧人引导亡魂沿着系在棺木上的布带前行。入葬时不放任何金属物品，因为金属被认为会玷污灵魂。"
 ngbandi_religion_desc: "$ngbandi_religion$$common_folk_religion_desc$\n\n恩本迪人是乌班吉河上游的河畔居民，他们信奉泛灵信仰，家庭和氏族中的长幼次序同时左右着宗教生活和社会生活。他们当中还有关于蛇崇拜的记载。"
 nhaala_religion_desc: "$nhaala_religion$$common_folk_religion_desc$\n\n纳阿拉信仰是几内亚比绍巴兰塔人的传统宗教。巴兰塔人是稻农，据考古学家推算，他们在10至14世纪间分批小群来到海岸。他们的名字在曼丁卡语中意为“抗拒者”，一直生活在平等的村落里，由长老会议治理，长老须在法纳多仪式上入会。\n\n巴兰塔人认为神远在天边，人们通过自己的灵性实践、献祭和对琼·卡戈等灵的崇拜与神灵相通。19世纪，他们散布到各地，以抵抗曼丁卡人的卡布王国扩张。"
 nicobarese_religion_desc: "$nicobarese_religion$$common_folk_religion_desc$\n\n尼科巴泛灵论是尼科巴群岛居民的传统万物有灵信仰。尼科巴群岛位于孟加拉湾、苏门答腊以北。他们相信有精灵、鬼魂和灵魂：人死后灵魂离开身体，变成鬼魂。一切不幸都被归咎于精灵，遇到恶灵作祟，就请萨满来处置。\n\n彩绘雕像承载着尼科巴人的起源神话，代表生灵、自然元素乃至日常器物的精灵。家中的雕像里住着本家祖先的灵。\n\n1754年，丹麦东印度公司开始在群岛上进行欧洲人的殖民。从特兰奎巴前来、试图在楠考里岛定居的摩拉维亚教会传教士，大批死于疾病。"
 norse_desc: "$scandinavian_region$半岛古日耳曼人的古老信仰，包含众多神祇，如阿萨神族与华纳神族，其中最著名的是奥丁与托尔。它认为宇宙由世界树尤格德拉希尔的九个不同领域组成，其中米德加尔特是人类居住之地。\n\n诺斯多神教里，阿萨神族和华纳神族交战之后，发现彼此势均力敌。9世纪起，传教的压力不断增加：哈康·西居尔松在挪威统治期间（975—995年）使多神信仰几乎成了国家意识形态，直到奥拉夫·特里格瓦松强迫贵族改宗。约1000年，冰岛在阿尔庭通过了基督教法律，同时对旧信仰作出让步。瑞典到12世纪也已正式基督教化。\n\n到1337年，这种宗教只留存在民间传说里。它的神话由基督徒写进13世纪的古诺尔斯语文献。"
 nu_religion_desc: "$nu_religion$$common_folk_religion_desc$\n\n怒族泛灵论是怒人的传统万物有灵信仰。怒人是藏缅语族民族，居住在怒江、独龙江和伊洛瓦底江上游的深山峡谷，分布在云南西北部和克钦邦；他们相信自然界充满有生命的力量。\n\n传说怒人的溜索桥出自一位姑娘之手：阿茸看到蜘蛛网，想出用绳索渡过泛滥的怒江；有头人屡次逼她成婚，她逃入深山，在一个山洞里化作石像。三月的仙女节纪念的就是她。\n\n北部怒人信奉藏传佛教，南部和中部的多数怒人保留了原有的泛灵信仰。19世纪后半叶法国传教士进入南部，少数人皈依基督教。"
 nuo_religion_desc: "$nuo_religion$$common_folk_religion_desc$\n\n傩教是中国中南部驱邪的信仰，与土家人关系最深。它的源头是古时在节令更替之际驱逐疫鬼的仪式；周代由方相氏主持，方相氏披熊皮，戴黄金四目。\n\n傩教的神灵以木雕面具为像。神话里最高的一对神是傩公和傩婆，他们是最初的两个人，被冤杀斩首，后来作为有求必应的祖先受人祭拜。其下是道教三清，再下是玉帝，巫师吹牛角号召请他。\n\n仪式在傩庙举行，包括傩舞、傩祭和傩戏。其目的是增强诸神的力量，让他们驱赶恶灵。"
 nyama_religion_desc: "$nyama_religion$$common_folk_religion_desc$\n\n恩亚马指曼德语诸族相信存在于自然界和一切生灵中的灵力。他们靠奇瓦拉、多沃这样的入会社团来守护和驾驭它，连穆斯林曼丁卡人也保留着这些社团；多贡人还说，面具就是为了承载死亡释放出的恩亚马而造的。\n\n许多曼德人自13世纪起就是穆斯林，但博博人等群体完整保留着更古老的信仰，班巴拉人直到19世纪才皈依。杰内‑杰诺一带的索宁凯相关族群中，祖先崇拜也很兴盛。"
 nyang_serai_religion_desc: "$nyang_serai_religion$$common_folk_religion_desc$\n\n娘瑟莱泛灵论是勒姜人的传统信仰。勒姜人是苏门答腊西南部巴里桑高地的稻农。这一信仰得名于其中最著名的神灵，也就是稻谷与丰产女神，勒姜人把她看作爪哇稻谷女神戴维诗丽的本地版本。信徒向她献上祭牲和焚香。\n\n在盛大的节庆“克杜赖·阿贡”上，勒姜人堆起象征卡巴山的“蓬崇”，并在其山坡上祈祷。令人敬畏的精灵称为斯马特，居住在特定的地方，所以进入或从自然中取物之前要先请求允许。老虎则被当作祖先看待。\n\n伊斯兰教大约从16世纪起自万丹、亚齐和米南加保传入。勒姜人改宗的时间比多数邻族要晚。"
 nyasaye_religion_desc: "$nyasaye_religion$$common_folk_religion_desc$\n\n尼亚萨耶教是今肯尼亚西部维多利亚湖温纳姆湾一带各族的传统信仰，尼亚萨耶一词在卢奥人和古西人那里就是神的名字。卢奥人约从1490年起迁入这一地区，把尼亚萨耶看作创世者，称他为奥邦奥·尼亚卡拉加，意为独一无二、全能者。邻近说卢亚语的各族也用相近的词，不过他们的至高神也被称为韦莱。\n\n除至高神之外，人们传统上还敬奉祖先的灵，以及与降雨、治病、灾祸有关的各种灵。占卜师在人与灵界之间沟通，在卢奥人当中，酋长要由占卜师加冕。"
 nyesoa_religion_desc: "$nyesoa_religion$$common_folk_religion_desc$\n\n尼亚索阿是利比里亚海岸克鲁人的创世神，早期传教士这样记载。在他之下，世间充满地域之灵、家庭守护灵和留在近处、能左右事态的亡魂。经过专门训练的德亚用药物和仪式处理疾病与灵界的麻烦。"
 obian_paganism_desc: "$obian_paganism$$common_folk_religion_desc$\n\n鄂毕萨满教是鄂毕—乌戈尔语民族汉特人和曼西人的传统信仰；他们生活在西西伯利亚的鄂毕河及其支流沿岸，俄罗斯人称这片土地为尤格拉。托鲁姆是天神；在汉特人的一首歌里，他派儿子去统治大地，儿子却忘了父亲的告诫，失去了不死之身，变成野兽，被猎人杀死。\n\n熊是一年祭祀的中心。猎熊成功之后要举行庆典，持续五六天，其间有歌、舞和戏剧。\n\n15世纪，汉特人的几个公国一部分并入西伯利亚汗国。16世纪末，俄罗斯在哥萨克叶尔马克带领下着手征服这一地区。"
 odinala_religion_desc: "$odinala_religion$$common_folk_religion_desc$\n\n奥迪纳拉教又称奥梅纳拉，是尼日利亚东南部伊博人的传统宗教和习惯法，北部伊博腹地的恩里王国是它的仪式中心。至高神丘库之下是较小的神灵，祭司迪比亚通过阿法占卜得知他们的意旨。\n\n人们认为祖先在灵界守护自己的世系，有的还会在家族中转世。恩里的祭司王埃泽·恩里据说是天降之人埃里的后裔，他派出皈依者，以仪式性的誓约而非武力把各社群联结起来，势力遍及伊博地区约四分之一。\n\n恩里的影响一直持续到16世纪。18世纪起，随着贝宁和伊加拉的崛起以及大西洋奴隶贸易的扩大而衰落。"
 omo_religion_desc: "$omo_religion$$common_folk_religion_desc$\n\n奥莫信仰指埃塞俄比亚南部奥莫河下游农牧民的传统信仰，例如穆尔西人和哈马尔人的信仰。穆尔西人相信有一种比自身更强大的力量，名为图姆维，位于天上。世袭的祭司科莫鲁代表群体与图姆维沟通，主持公开仪式求雨，保护人、牛和庄稼免受疾病和袭击。\n\n哈马尔人有两位仪式领袖比塔，他们主管精神事务，不掌政治权力。洁净对他们和邻近族群都很重要：被认定为明吉、即仪式上受污染的人或孩子，会被逐出群体。"
 orang_asli_religion_desc: "$orang_asli_religion$$common_folk_religion_desc$\n\n阿斯里泛灵论是马来半岛土著各族的万物有灵信仰，在北部的塞芒人当中记载得最为详细。他们认为人和一切自然之物都有灵魂，设想大地是一块圆盘，浮在一条巨蛇或一只巨龟之上，并以石柱与天空相连。\n\n塞芒人的主神是雷神卡雷，他不受人爱戴，人们只是畏惧他的残酷；有人违犯禁忌，他就降下雷击或疾病来惩罚。每个群体都有一位称为哈拉的萨满，他在入迷状态中与诸灵交谈，用草药治病；最有本事的哈拉据说能变成老虎。\n\n1500年代初，亚齐苏丹国派出远征队掳掠奴隶。到了1700年代和1800年代，米南佳保人和巴达克人的武装又接连洗劫阿斯里人的村寨。"
 orang_laut_religion_desc: "$orang_laut_religion$$common_folk_religion_desc$\n\n罗越人意为“海上之民”，是廖内群岛、新加坡海峡以及苏门答腊东岸和马来半岛南部沿海一带以船为家的渔民和商人。他们的传统信仰是崇拜据说栖居在树木、水中、岩石和洞穴里的精灵。\n\n在室利佛逝、马六甲和柔佛治下，罗越人巡守海峡，并把往来的商人引向统治者的港口。1699年马六甲—柔佛的末代苏丹被杀，罗越人拒绝承认继位的本达哈拉家族；后来布吉人取代他们成为海峡的守卫者。许多罗越人后来被吸纳进马来世界并接受了伊斯兰教，但也有一些群体，如实里达人，仍长久保留着旧有的信仰。"
 orang_rimba_religion_desc: "$orang_rimba_religion$$common_folk_religion_desc$\n\n库布泛灵论是“森林之民”的泛灵信仰。森林之民是栖居于占碑和南苏门答腊低地雨林的一个小型游猎民族，马来人称他们为库布人。传统上，营地里有人去世，他们就会迁到很远的地方，把哀伤之地留在身后。"
 ori_religion_desc: "$ori_religion$$common_folk_religion_desc$\n\n奥里祖灵崇拜是马迪人及与其关系密切的卢格巴拉人以祖先为中心的信仰，他们生活在苏丹、乌干达和刚果边界的西尼罗一带。据卢格巴拉人的记载，奥里是父系亡者的鬼魂，传统上认为争执未能化解时，他们会让活人生病。这时要为病人指定一头牲畜，通常是绵羊，病愈后宰杀，把肉放在祖先的神龛前，其余由世系群共享。\n\n祖灵之上是创造神阿德罗阿，他是遥远的天神，也被认为有人间的一面。占卜师、神谕者和祈雨师充当沟通的中介。"
 orthodox_desc: "$orthodox_ADJ$教会根植于$christian_ADJ$早期大公会议的传统，强调使徒教导与神圣传统的连续性。以$BYZ_ADJ$仪规为中心，$orthodox_ADJ$极为重视礼仪、圣像与神秘主义。$orthodox_ADJ$信仰由牧首领导，君士坦丁堡普世牧首享有荣誉上的首席地位。\n\n东正教的各教会实行自治，每个教会由其主教在会议中治理。与教宗不同，君士坦丁堡普世牧首对其他教会没有统辖权。各教会遵奉七次大公会议的决议和教父的教导，并在1054年的大分裂中与罗马分手。阿陀斯山的修士中神秘主义尤其浓厚，他们修行的静修主义由格里高利·帕拉马加以捍卫。\n\n1337年，拜占庭、塞尔维亚、保加利亚、格鲁吉亚、瓦拉几亚和俄罗斯诸公国都信奉东正教。1439年佛罗伦萨会议上达成的与罗马的合一，被君士坦丁堡的大多数神职人员和民众拒绝，该城在1453年陷于奥斯曼人之手。"
 pabichu_religion_desc: "$pabichu_religion$$common_folk_religion_desc$\n\n帕比丘教是游戏对奇基托人传统信仰的称呼。奇基托人自称蒙科克斯，居住在玻利维亚东部奇基塔尼亚的干燥森林和稀树草原上。1692年起，耶稣会把他们集中到传教村镇里，这些村镇一直维持到1767年耶稣会士被逐出。\n\n按传统，每个人有呼吸、血液和影子三个灵魂。影子之魂会在梦中游荡，人死后前往乐园，滞留不去的则要由萨满劝离。乌帕亚雷图是住在天上的巨型美洲鸵，守护孩子们；月亮名叫帕马·夸拉，月食被说成是天上的狗在吞吃它，战士们便向天空射箭把狗赶走。"
 paiute_shamanism_desc: "$paiute_shamanism$$common_folk_religion_desc$\n\n普哈吉萨满教是大盆地北派尤特人的传统萨满信仰。从事者称为普哈吉姆，即巫医；其核心观念是普哈，一种赋予物质世界以生命、推动元素、植物和动物运行的力量。\n\n为了借用这种力量，普哈吉姆会前往山岭、洞穴和水道等圣地，在那里治病、求雨，也参与战争或施行巫术。疾病既是身体的，也是精神的，萨满要找回病人的灵魂，并借助响板、烟和歌曲唤来力量。\n\n创世故事由长者在冬夜的篝火边讲述。其中一则说，一场洪水里只有艾草松鸡幸存，食人者努穆佐霍随后杀死了几乎所有人。"
 palaung_religion_desc: "$palaung_religion$$common_folk_religion_desc$\n\n崩龙泛灵论是德昂人的民族传统信仰。德昂人自称塔昂，是掸邦高原和云南边境的南亚语系民族。这种信仰以称为“纳特”的自然神灵为基础，德昂人在后来多数改信佛教之后，仍与之并存。\n\n德昂姑娘腰间戴藤篾腰箍，有一则传说解释了它的来历：古时德昂女子能在天空中飞舞，男人便用藤篾做成圈套在她们腰上，把她们留在地上。多数德昂人信奉南传上座部佛教，男孩到十岁便入寺为僧学习佛经。"
 paulicianism_desc: "$paulicianism$是一个二元论$christian_ADJ$派别，拒绝物质世界，认为其是邪恶力量的创造物。其信徒认为只有灵性领域是纯洁的，并基于新约建立其信仰，完全拒绝旧约。$paulicianism_ADJ$运动受到$catholic_ADJ$会与$orthodox_ADJ$会的迫害，但抵制了同化，并启发了后来的改革派运动。\n\n保禄派7世纪兴起于亚美尼亚，兴盛于拜占庭帝国与哈里发国的边境地带。传说其创始人是马纳纳利斯的君士坦丁，他约在660年建立了第一个会众团体，二十七年后被石头砸死。拜占庭作者还指责保禄派拒绝十字架。\n\n迫害迫使他们围绕特弗里克要塞建立了一个国家，其首领克里索凯雷斯在867年一直劫掠到以弗所。巴西尔一世在878年前摧毁了它，此后皇帝们把保禄派迁往色雷斯，他们在那里延续了几个世纪。\n\n在第二保加利亚帝国治下，一部分色雷斯的保禄派改宗东正教。奥斯曼人征服之后，另一些人成为穆斯林，其余的人在16或17世纪改宗天主教。"
 pava_religion_desc: "$pava_religion$$common_folk_religion_desc$\n\n尤鲁帕里传统属于哥伦比亚与巴西亚马孙地区沃佩斯河流域的图卡诺人、阿拉瓦克人和马库人。传说的主角是太阳之子，母亲是处女塞乌西，她吃下一颗果子而受孕。\n\n尤鲁帕里的意思是“捂住嘴的人”，因为男人要替他的宗教保守秘密。这个名字属于图皮语，由把这位神灵等同于魔鬼的传教士带来。他用太阳的律法取代世间母权制的旧法。\n\n他的声音留存在用帕希乌巴棕榈制成的神圣长笛和号角里，女人不准看见。最核心的仪式是为十二至十五岁男孩举行的成年礼，仪式上笛声如祖先巨蟒和美洲豹的咆哮。"
 pech_religion_desc: "$pech_religion$$common_folk_religion_desc$\n\n穆阿穆阿教属于洪都拉斯东北部讲奇布查语族语言的佩契人。他们自称是雷电之神穆阿穆阿的子孙。天上的闪电是远古人类的灵魂：这些人为大地清除了蜥蜴般的恰卡—恰凯和由塔卡斯克罗率领的食人巨人，佩契人便是由他们而生。\n\n穆阿穆阿还是神帕塔卡科的父亲：帕塔卡科的母亲在河边洗衣时，河面的白色泡沫使她怀了孕。帕塔卡科与彩虹之神皮里塔卡塔一同走到世界的尽头，那里有四根柱子撑起宇宙。\n\n他后来又登上九层天，去见自己在天上的对应者、长着九只眼睛的卡科。1620年代，西班牙人把佩契人集中到传教村镇中，天主教信仰取代了古老的故事。"
 pelebegu_religion_desc: "$pelebegu_religion$$common_folk_religion_desc$\n\n帕玛林教这里指苏门答腊北部巴塔克人的传统信仰，信徒包括托巴人和曼代林人。托巴人相信最早的巴塔克人是西·拉贾·巴塔克的后代，他的家族定居在多巴湖畔的火山普苏克·布希特。\n\n创世神是“万物之始”穆拉·贾迪·纳·博隆，他居住在分为七层的上界，不受祭祀。仪式的重心在于生者的灵魂“通迪”，以及死者的灵魂“贝古”；贝古留在村子附近，要用食物和祷告来安抚。\n\n称为达图的祭司为人治病，并用木皮制成的书“普斯塔哈”占卜未来。在米南加保的巴德里战争（1803—1837）期间，南部的曼代林巴塔克人被转为信奉伊斯兰教。"
 pengarap_asal_religion_desc: "$pengarap_asal_religion$$common_folk_religion_desc$\n\n阿萨尔信仰意为“原始的信仰”，是婆罗洲西部达雅克人中的伊班人的传统宗教。伊班人向今沙捞越扩张之前居住在卡普阿斯河流域；本尼迪克特·桑丁推算他们在1550年代迁入巴丹卢帕尔河谷，并在19世纪初到达拉让江流域。\n\n伊班人承认一位无父无母、创造诸世界的至高神本苏·佩塔拉，其下有七位次级神明，包括主管战争与医治的森加朗·布隆。预兆左右着生活的许多方面：出门、出征和收获之前，人们要留意预兆鸟的鸣叫与飞行，这些鸟听命于森加朗·布隆。\n\n犀鸟节（加外·克尼亚朗）敬奉森加朗·布隆，在猎头盛行的年代由出征得胜者举办。亡灵节（加外·安图）迎接死者的灵魂。"
 pericu_religion_desc: "$pericu_religion$$common_folk_religion_desc$\n\n尼帕拉亚教是佩里库人对创世神尼帕拉亚的信仰。佩里库人是下加利福尼亚半岛南端海角地区的航海民族，领地从托多斯桑托斯延伸到拉巴斯。他们以鱼、贝类和龙舌兰为生，不务农，也不制陶。\n\n他们的部分神话在18世纪30年代初被记录下来。尼帕拉亚是无所不能的主宰，创造了天与地。他的妻子叫阿马伊科永迪，两人生有三个儿子：夸亚伊普造出了人类，后来被人类杀死；第二个是阿卡拉吉。\n\n耶稣会的传教站在1720年进入拉巴斯，1730年进入圣何塞德尔卡沃。1734年佩里库人起义之后，又经历了长期的疾病与战乱，到1768年耶稣会士被逐出时，佩里库人在文化上已经消亡。"
 pi_religion_desc: "$pi_religion$$common_folk_religion_desc$\n\n月神崇拜是游戏对今厄瓜多尔安第斯高地传统月神信仰的称呼，核心是雷电与水之神卡特基尔。在卡亚帕语里，“皮”意为圣水，卡特基尔据说居住的泉水和湖泊平时不许触碰，只在仪式中使用。\n\n卡特基尔的形象是手持雷电、上身为美洲豹，与渐亏的月亮相连。据说在这样的夜晚，他会放出所看管的野兽；想要成为首领的人则在他的泉水中沐浴，通过成年仪式求取勇气与好运。\n\n普鲁瓦人和卡兰基人使用太阴历。他的崇拜向北传入哥伦比亚，向南传到秘鲁北部的瓦马丘科人那里，并与雷电神伊利亚帕合流。"
 piil_pesenggiri_religion_desc: "$piil_pesenggiri_religion$$common_folk_religion_desc$\n\n帕松吉里是苏门答腊南部楠榜人的荣誉准则。楠榜人追溯自己源出佩萨吉山下的色卡拉布拉克王国，后来分成沿海的赛巴廷人和内陆的佩帕敦人。这一准则以自尊和面对挑战绝不退缩的勇气为人生根基。\n\n与之并列的还有四项价值：朱鲁克—阿多克，要与自己所享有的传统头衔相称；内穆伊—尼马赫，以慷慨好客的态度互相拜访、接待宾客；嫩加赫—尼亚普尔，积极参与群体生活；萨凯—桑巴扬，彼此互助。这五项载于《昆塔拉·拉贾·尼蒂》手稿，并以楠榜徽章上的五朵花作为象征。"
 pomo_shamanism_desc: "$pomo_shamanism$$common_folk_religion_desc$\n\n库克苏是北加利福尼亚的波莫人、帕特温人、迈杜人等民族的宗教，分布范围从萨克拉门托河谷向西直到太平洋沿岸。它的核心是男子秘密社团，他们在地下舞室里聚会，并在公开的舞蹈中穿戴服饰出场，扮演诸灵，求取健康、丰收、生育和好天气。\n\n波莫人讲述库克苏，一位红喙的超自然者，住在世界南端的发汗屋里，擅长治病。扮演他的舞者往往被视为巫医。\n\n帕特温人和迈杜人中有一个称为赫西的支派，允许妇女参加。1820年代，西班牙传教士把许多南部的波莫人带进圣拉斐尔和索诺马的传教会；1837年，一场源自罗斯堡的天花疫情夺去了许多人的生命。"
 puntan_religion_desc: "$puntan_religion$$common_folk_religion_desc$\n\n蓬坦崇拜是马里亚纳群岛查莫罗人的传统信仰，得名于他们传说中两位创世兄妹之一的蓬坦。蓬坦临终前吩咐妹妹富乌娜把他的身体造成世界：眼睛变成太阳和月亮，眉毛变成彩虹，胸膛变成天空。\n\n富乌娜在瓜汉岛（今关岛）定居，把自己变成一块巨石，巨石裂开，放出了所有的人类。古代查莫罗人敬奉祖先，似乎并没有正式地崇拜神祇。\n\n1623年，克里斯托夫·卡尔·费恩贝格尔记述说，他们用活人献祭来安抚一条大鱼。1672年，神父迭戈·路易斯·德·圣维托雷斯违背一位父亲的意愿给他的孩子施洗，随后同他的传教助手佩德罗·卡隆索德一起被杀。"
 qat_religion_desc: "$qat_religion$$common_folk_religion_desc$\n\n喀特崇拜是瓦努阿图的传统信仰，属万物有灵论，建立在玛那（可以转移的灵力）、禁忌以及对祖先灵魂的崇拜之上。各地的神祇不同：班克斯群岛有喀特，安巴埃岛有塔加罗，利塞普塞普则见于整个群岛。\n\n喀特是班克斯群岛神话里的主神。人们并未正式崇拜他，却把世界本身、黑夜、死亡和女人都归功于他。他用龙血树木头雕出第一批男女，再用击鼓使他们活过来，又用一片红色黑曜石划开黑夜，造出黎明。\n\n他的伙伴是蜘蛛马拉瓦，他的十一个兄弟都叫塔加罗。班克斯群岛是瓦努阿图最早被欧洲人望见的地方：1606年，佩德罗·费尔南德斯·德·基罗斯的船队驶过这些岛屿。"
 rabha_religion_desc: "$rabha_religion$$common_folk_religion_desc$\n\n拉巴泛灵论属于拉巴人，这是藏缅语族民族，居住在阿萨姆下游平原和杜阿尔斯。传统上他们行母系制，以稻作、山区轮垦、山林采集和纺织为生。"
 rebba_religion_desc: "$rebba_religion$$common_folk_religion_desc$\n\n雷巴教属于古穆兹人，他们居住在埃塞俄比亚与苏丹边界青尼罗河及其支流沿岸的低地。他们传统上相信有名为穆萨的灵栖居在房屋、谷仓、田野、树木和山岭之中，并由称为加费亚的仪式专家与它们打交道。"
 rmaism_desc: "$rmaism$$common_folk_religion_desc$\n\n白石崇拜是四川西部尔玛人，即羌人的传统信仰，是一种泛神论，崇拜自然诸神、人事诸神和羌人的始祖。天神木比塔（也作阿巴木比塔）是至高神。\n\n这一信仰的核心仪式是敬拜白石，据说经过仪式，白石就具有诸神的力量。房顶上摆放五块、七块或九块白石英石，最大的一块代表天神，要在它们面前焚烧柏枝。\n\n仪式由被称为释比的祭司主持，他们是拜师多年才得到这一职位的萨满，保管着羌人的神学、历史和神话。到明代，羌这个名称只用来称呼岷江上游的非汉人群体；1580年代前后的战事给他们带来了官府的严厉镇压。"
 rogo_miki_religion_desc: "$rogo_miki_religion$$common_folk_religion_desc$\n\n信奉者生活在沃尔特河流域的莫西诸国，其中有瓦加杜古、亚滕加、滕科多戈和布苏马。"
 romuva_desc: "这是$lithuanian_group$人的传统信仰，包含完整的神祇体系，以及对自然与祖先的崇敬。其仪式在火坛周围进行，伴随着圣歌或“达伊诺斯”的吟唱。\n\n洛姆瓦多神教的神谱以天神迪耶瓦斯为首，雷神佩尔库纳斯与橡树相联，是迪耶瓦斯意志的执行者。泽米娜是大地女神，韦尔尼亚斯是亡灵之主，莱玛分配命运。\n\n立陶宛是欧洲最后的异教国家，条顿骑士团世世代代对它发动十字军。明道加斯约在1250年受洗，但他的人民并没有跟从。1387年，波兰国王雅盖沃把洗礼带到立陶宛本土；萨莫吉希亚是最后改宗的地区，时间在1413年。\n\n旧信仰消退得很慢。1547年，马尔蒂纳斯·马日维达的教义问答书劝读者放弃对泽米帕蒂斯的崇拜，它的片段一直保留到19世纪初。"
 salishan_totemism_desc: "$salishan_totemism$$common_folk_religion_desc$\n\n萨利什图腾崇拜是沿海萨利什诸民族的传统信仰。他们生活在萨利什海和普吉特海湾沿岸，从温哥华岛南部到奥林匹克半岛。他们的族群语言各异，但共有一个由守护灵和人兽互变构成的世界。\n\n传统上，人要独自通过隔离和幻象追寻获得灵力，灵力与乌鸦、熊或海豹之类的动物相连。冬天，人们在雪松长屋的地板上举行灵舞，成员以歌、舞和面具展示自己的灵力。\n\n人被认为有几重灵魂，病人的灵魂可能被带向冥界，萨满要前往那里把它找回；杜瓦米什人就有招魂的仪式。"
 samaritanism_desc: "撒玛利亚派是$samaritan_culture$人的传统信仰，起源于以色列王国灭亡后的$judaism$。$samaritanism$自认为是从摩西时代以来未改变的$israelite_group$，与他们认为被$judaism$篡改的经典形成对比。\n\n撒玛利亚人自称以色列人。学者认为，这一群体形成于撒玛利亚，独特的身份在波斯和希腊化时期逐渐成形。他们唯一的经典是《撒玛利亚五经》，不承认后来的犹太教正典和拉比传统。他们的圣山是基立心山，而不是耶路撒冷的圣殿山。那里由世袭的大祭司主持礼拜，每年举行逾越节献祭。\n\n到14世纪，这个群体已经很小。1624年，以利亚撒一系的大祭司血脉断绝，职位转到以他玛的后裔手中；到1786年，只剩下约一百名撒玛利亚人。"
 sammitiya_desc: "$sammitiya$是$india$早期$buddhist$的众多分支之一，在$sindh_area$地区发展，成为早期$buddhist_ADJ$的重要中心，甚至可与大乘佛教的那烂陀寺相媲美。作为$india$最大的非大乘$buddhist$派别，它在$muslim_ADJ$入侵后失去了其显赫地位。\n\n正量部出自犊子部，而犊子部又源自上座部。信徒被称为“补特伽罗论者”，主张“补特伽罗”（人）与五蕴既不相同，也不相异，轮回和证得涅槃的就是这个人。其他部派攻击这种主张是变相的“我”。\n\n正量部在信德和古吉拉特最为兴盛。7世纪玄奘游历印度时，发现它是小乘各部中最大的一派；义净在690年代记载，它在古吉拉特的伐腊毗寺院学府可与那烂陀寺相比。\n\n在它拥有大部分寺院的信德，阿拉伯人的征服带来了伊斯兰教，正量部因此失去根基。它在印度一直延续到佛教本身在当地消亡。"
 samoyedic_paganism_desc: "$samoyedic_paganism$$common_folk_religion_desc$\n\n萨摩耶德萨满教是西伯利亚北部萨摩耶德诸民族——涅涅茨人、埃涅茨人、恩加纳桑人和塞尔库普人——的传统信仰。他们以狩猎、捕鱼和放牧驯鹿为生。这是一套萨满教和万物有灵的体系，强调敬重土地。\n\n在涅涅茨人中，天神努姆是善良的创造者和最高神，他邪恶的儿子恩加则统治地下世界。萨满称塔迪比亚，能够潜入地下去找恩加。据故事所说，有个萨满这样做之后娶了恩加的女儿，从此用手托住世界，被称为“大地老人”。迁徙途中，神圣雪橇载着熊皮和神像，只有长者才在举行仪式时打开它。\n\n1628年前后，俄罗斯人到达塞尔库普人的地方，后来曾试图使他们改宗。许多人仍保留着旧日的宗教。"
 sanamahism_desc: "$sanamahism$$common_folk_religion_desc$\n\n萨那玛依教是刚莱博，即后来曼尼普尔的英帕尔河谷中梅泰人的民族宗教。它得名于莱宁图·萨那玛依，他是至高神西达巴·马普的长子；王室编年史《切塔罗尔·库姆巴巴》把这一信仰追溯到帕康巴王。\n\n这是一种多神信仰。主神有萨那玛依、西达巴·马普、帕康巴和财富女神伊莫伊努等，圣林之神乌芒莱则在“莱·哈劳巴”节上受到祭祀。每家每户的院子里都设有一座莱彭土丘，象征创世之初的第一块陆地。\n\n18世纪初，来自锡尔赫特的印度教祭司使帕姆海巴王皈依毗湿奴派。他在1717年把印度教定为国教，1729年又让几乎所有梅泰人都改宗印度教。尽管如此，萨那玛依仍作为家神保留下来。"
 sangirese_religion_desc: "$sangirese_religion$$common_folk_religion_desc$\n\n马萨德派被外人称为“古伊斯兰教”，是苏拉威西与棉兰老之间桑吉赫群岛上的一种宗教。它源自伊斯兰教在群岛的最初传播：15世纪，一位名叫毛拉纳·莫明的阿拉伯人在隶属塔布坎的伊斯兰王国拉毛盖的支持下传入伊斯兰教。\n\n萨曼西亚朗王在位时，出现了一位被称为“马武·马萨德”的伊玛目，信仰因而得名。它的礼仪保留了自己的形式：祈祷每周只在星期五举行，伊玛目站在围坐成圈的信徒中间；斋月结束前三天要举行称为“迪科乌·索罗”的仪式。\n\n此后几个世纪里，桑吉赫群岛在16世纪受特尔纳特控制。随后是西班牙统治，1677年起由荷兰人统治。"
 sanjiao_desc: "$confucianism_policy$思想、$daoism_policy$与$buddhist$相互交融的体系，在$china$被统称为“三教”。千百年来，它们共同植根于华夏沃土，与诸多$chinese_group$民间信仰及神明体系交织影响。虽三教并非始终和谐并存，却始终深刻塑造着$chinese_group$民族的生活方式与精神脉络。\n\n三教之中，儒家提供家庭、国家和礼仪的伦理，道教提供道的宇宙观、长生之道和民间诸神，佛教则带来业报和轮回的教义。宋代，排斥佛道神秘一面的理学逐渐在学术上占据主导。\n\n然而三教归一的主张却越来越盛。全真道的王重阳说佛道从来是一家，悬空寺等处的殿堂则把孔子、老子和释迦牟尼供奉在一起。\n\n明代，林兆恩（1517—1598）创立社团，会通三教，后来发展为三一教。1585年，地方官员曾斥它为异端，林兆恩死后却被奉为三一教主，在一千多座祠庙中受到供奉。"
 sao_religion_desc: "$sao_religion$$common_folk_religion_desc$\n\n萨奥信仰是乍得湖周围和沙里河沿岸那些带城墙的城邦的传统信仰。每座城都由一位神圣的统治者领导，他很少公开露面，露面时也隐在屏风之后；口传说萨奥各氏族由同一种语言和同一种宗教联结在一起。\n\n萨奥人用葬瓮埋葬死者，并制作人和动物的青铜与陶土塑像。16世纪博尔努帝国扩张之后，萨奥作为独立的文化不复存在，改信伊斯兰教改变了他们的身份；科托科人继承了他们的城邦，萨拉人等民族则追溯自己源出萨奥。"
 sapmi_shamanism_desc: "这是$sapmi$人的传统宗教实践，包含众多自然与动物灵体，以及对死者的崇敬。某些动物，如驯鹿与熊，受到特别尊崇。\n\n在萨米人的万物有灵信仰中，自然界一切显要的事物，从动物到岩石，都被认为有灵魂。各地信仰不尽相同。常见的神灵有太阳女神、人类之母贝亚维，雷神霍拉加勒斯，以及死者之主亚布梅—阿卡。各家在西耶迪（形状奇特的石头或地貌，是圣地）献祭驯鹿；诺埃蒂（萨满）敲着驯鹿皮鼓进入出神状态，前往地下世界萨伊沃。\n\n天主教传教士13世纪就来到这里。宗教改革之后压力加大，许多萨米鼓在17和18世纪被烧毁或没收。"
 sarna_religion_desc: "$sarna_religion$$common_folk_religion_desc$\n\n娑罗教是印度东部乔塔那格浦尔高原部族民族的自然宗教，信徒包括桑塔尔人、奥朗人、霍人和蒙达人。它的名字来自蒙达语中的“圣林”，信仰就在圣林中举行。核心是敬畏水、森林和土地。\n\n每个村庄都有一片娑罗树圣林，是村神戈拉姆·德奥塔的居所，全村人每年两次在这里集会献祭，由村中的祭司帕汉主持。圣林受到严格保护，按习俗，不许砍树或伤害动物。\n\n主要的节日是萨尔胡尔节，这时人们祭拜祖先。帕汉把三罐水带到圣林；若罐中水位下降，就预示季风不来，若水位不变，雨水就会降临。"
 satsana_phi_desc: "$satsana_phi$$common_folk_religion_desc$\n\n丕教是泰族诸民族古老的本土宗教，信徒包括掸人、云南的傣族、佬人和阿萨姆的阿洪姆人。它以崇拜称为丕的精灵、称为宽的生命灵气和祖先为基础，在印度教和佛教传来之前，一直是主流信仰。\n\n守护神灵庇佑着寺庙和城镇的立柱“拉勐”，另有一些是古老的天神“丕天”。人们认为每个人身上有三十二个宽，在“巴西”仪式上，走失的宽被召回，并在手腕上拴上棉线。\n\n1228年阿洪姆人随苏卡法从勐卯把这一信仰带入阿萨姆。1397年之后，婆罗门的影响在宫廷中增长；1497至1539年在位的苏洪蒙王取了印度教头衔斯瓦尔加纳拉亚纳。"
 sedang_religion_desc: "$sedang_religion$$common_folk_religion_desc$\n\n色当泛灵论是越南中部色当人的传统万物有灵信仰，色当人说巴拿语支的语言，居住在昆嵩省以及广南、广义两省的邻近山区。他们的节庆随刀耕火种的农事而行：7月初播种时有一次，8月初稻苗转绿时又有一次。"
 seri_religion_desc: "$seri_religion$$common_folk_religion_desc$\n\n科姆卡克信仰是科姆卡克人的传统信仰。科姆卡克人被西班牙人称作塞里人，生活在索诺拉的加利福尼亚湾沿岸。他们没有发展出复杂的宗教组织，对世界的看法、仪式和节庆都贴近自然。\n\n他们最主要的仪式与青春期开始和死亡相关，歌谣和故事围绕大海、动物以及英雄和战士的古老功绩。殖民时期他们始终没有被正式传教，所以信仰中没有许多邻近民族那样的天主教成分。\n\n他们顽强抵抗西班牙人。17世纪60年代，一支西班牙人的队伍杀死了某个游群的大部分成年人，把孩子分送到索诺拉的各个城镇。"
 shamanism_desc: "萨满教是一系列以萨满为核心的信仰与实践，萨满是能够与灵界互动并利用灵体或灵性能量影响物质世界的个体。其灵体、神祇或仪式的具体内容可能有所不同，但灵界与物质世界互动的核心理念存在于所有$shamanism_ADJ$实践中。\n\n萨满通过出神等变换了的意识状态与灵界交往，人们相信萨满能治病、占卜、与灵体交谈，还能护送死者的灵魂前往来世。布里亚特的一首史诗讲到第一位萨满卡拉‑古尔根，他能创造生命。\n\n萨满这个词本身来自某种通古斯语，可能是鄂温克语或满语，经俄语传入英语。荷兰政治家尼古拉斯·维特森在1692年出版的书中把这个词带到了西欧。"
 shia_desc: "$shia_ADJ$信仰的基础是穆罕默德指定阿里·本·阿比·塔利卜为其继任者，作为$muslim$的精神与政治领袖。因此，$imamate$职位应按阿里的血统传承，而非穆罕默德的同伴在塞基法会议上选择阿布·伯克尔作为$rank_empire_muslim_ruler_male$时所确立的继承体系。\n\n什叶派尊阿里·本·阿比·塔利卜为穆罕默德的表弟兼女婿，相信阿里的后裔伊玛目是不会犯错的引路人。680年侯赛因在卡尔巴拉殉难，信徒每年在阿舒拉节哀悼。\n\n各主要支派在伊玛目世系上各有主张。十二伊玛目派承认十二位伊玛目，最后一位马赫迪隐遁于“幽隐”之中；伊斯玛仪派追随伊斯玛仪·本·贾法尔；宰德派与逊尼派最为接近，见于也门高地。\n\n1337年，由什叶派统治的萨尔巴达尔国刚在呼罗珊的萨卜泽瓦尔建立。真正的转折出现在1501年：伊斯玛仪一世宣布十二伊玛目派为萨法维波斯的国教，以逊尼派为主的居民常被强迫改宗。1736年萨法维王朝覆灭后，乌苏勒派压过了阿赫巴尔派。"
 shinto_desc: "神道教是一系列围绕神祇崇拜的信仰与实践，在$buddhist$传入$japan_region$之前就已存在。随着$buddhist$在$japan_region$的传播，这些信仰与$buddhist_ADJ$的实践和教义紧密结合，相互交融。神道教的神祇与$buddhist$的诸佛被视作同一体，两种信仰在功能上变得密不可分。这催生了一种具有$japanese_group$特色的$buddhist_ADJ$形式，同时也形成了受$buddhist$影响的神道崇拜。\n\n神道教没有创始人，也没有统一的权威。人们相信神栖居在山川草木和祖先之中，仪式由神职人员“神主”在神社中主持。最早的书面传统见于712年的《古事记》和《日本书纪》，供奉太阳女神天照大神的伊势神宫是神道教最神圣的地方。\n\n佛教在6世纪传入日本，从8世纪起，诸神被纳入佛教的宇宙观。神社与寺院结合，按照本地垂迹说，神被看作佛的本土化身，天照大神就被等同于大日如来。\n\n战国时代，吉田兼俱（1435—1511）建立了吉田神道，企图赋予神祇独立于佛教的权威。此后直到江户时代后期，吉田神道一直主导着神社事务。"
 sikhism_desc: "锡克教根据$character_title_guru$的教义创立，起源于$india$多样的$hindu_ADJ$信仰，并融合了许多$muslim$的影响。它信仰一位造物主“$sikhism_god_name$”，并倡导诚实无私地行事以造福众生。它鼓励通过冥想与沉思、诵经与音乐等方式与神圣连接，从而感知独一真神的存在。\n\n锡克教大约于15世纪末兴起于旁遮普，源自古鲁那纳克的教导，那纳克生于1469年。它吸收了圣者传统和虔信运动，也赢得了印度教徒和穆斯林的皈依。\n\n1539年，那纳克指定拉赫纳为继承人，即古鲁安加德。古鲁阿尔琼建成第一座哈里曼迪尔·萨希卜，编纂《阿迪·格兰特》，1606年被莫卧儿皇帝贾汉吉尔折磨致死。\n\n第六代古鲁哈尔戈宾德拿起了武器；古鲁得格·巴哈都尔于1675年在德里被奥朗则布下令斩首；古鲁戈宾德·辛格于1699年创立卡尔萨，并指定经典《古鲁·格兰特·萨希卜》为最后的古鲁。此后锡克人的势力在旁遮普崛起，以拉合尔为都城。"
 sinu_religion_desc: "$sinu_religion$$common_folk_religion_desc$\n\n塞努人是哥伦比亚加勒比海岸塞努河与圣豪尔赫河流域从事农耕和金工的民族，以女性为丰产与智慧的象征。墓中放置女性陶俑，代表受孕和在冥界的重生，如同种子萌发生长。\n\n死者下葬时有乐舞相伴，坟丘上栽一棵树，树枝上挂着金铃；陪葬的金胸甲象征女性的怀孕和男性的雄壮。每条河谷自成一省；芬塞努、潘塞努和塞努法纳的三位首领分担互补的政治、宗教和经济职责。\n\n1510至1535年间，疾病和战争摧毁了各个酋邦。西班牙人劫掠了墓中的黄金。"
 songhai_religion_desc: "$songhai_religion$$common_folk_religion_desc$\n\n尼日尔河中游一带的桑海人和扎尔马人，传统信仰以霍莱诸灵为核心，人们通过灵附仪式与它们沟通，并相信有一位造物神亚尔科伊。各个世袭群体传统上都敬奉自己的守护神灵。\n\n加奥的统治者在1009年前后接受了伊斯兰教，但古老的习俗与之并存，13世纪末马里征服该地后也没有消失。\n\n1464年至1492年在位的桑尼·阿里从母亲那里学得古老的仪式并加以维护，因此在廷巴克图的穆斯林编年史里留下恶名。1493年夺位的阿斯基亚·穆罕默德推行伊斯兰教，但1591年摩洛哥摧毁桑海帝国之后，精灵崇拜在乡村依然兴盛。"
 songsarek_religion_desc: "$songsarek_religion$$common_folk_religion_desc$\n\n梅加拉亚山区的加罗人也用“松萨雷”称呼自己，意为“服从神灵的人”。19世纪后半叶基督教在加罗丘陵传开之前，多数加罗人信奉这一信仰。\n\n至高神是塔塔拉·拉布加，据说高得无法企及。他的副手米西·萨尔琼是太阳、庄稼和丰产之神，旺加拉节上要把初收的庄稼献给他；苏西梅是财富女神，稻米之母神洛基梅则在阿加尔马卡节受到祭祀。人们用牲祭安抚诸神，还观察鹡鸰的飞行来预测当季的降雨。"
 sora_religion_desc: "$sora_religion$$common_folk_religion_desc$\n\n萨瓦拉人（又译索拉人）是东高止山脉的蒙达语族民族，分布在奥里萨南部和安得拉北部沿海，传统信仰带有萨满色彩。他们认为一切自然现象都出自神、神灵或精灵之手。\n\n他们敬奉称为基通的超自然存在，基通栖息在森林、山岭、村庄、河流和特定地点。萨瓦拉的萨满称为库兰，通常是女性，通过每年的仪式、宰牛献祭、舞蹈和供品来取悦基通。传统上，萨满入迷后灵魂下到冥界，让亡者借用她的身体说话，送丧的人与亡者争辩，被他们的玩笑逗笑，又因他们的指责落泪。"
 strigolniki_desc: "$strigolniki$兴起于中世纪$russian_region$地区，是一个批判既定$orthodox_ADJ$会的改革派教派。他们谴责神职人员的腐败、圣事的买卖以及教会财富的积累。$strigolniki_ADJ$倾向于一种更简单的信仰，专注于个人虔诚，因此成为$orthodox_ADJ$会与政府当局的目标。\n\n剪裁派14世纪中叶出现在普斯科夫，后来传到诺夫哥罗德和特维尔。他们否认东正教神职人员的圣职合法，抨击神父的无知，以及为洗礼、告解和圣餐收取的费用，要求平信徒享有讲道的权利。\n\n诺夫哥罗德的主教们反对他们，1375年，一群人把其中三人，包括教师卡尔普和尼基塔，从桥上扔进了沃尔霍夫河。迫害和内部争执使这一运动在15世纪初走向终结，对它的最后记载出现在1487年。"
 sui_religion_desc: "$sui_religion$$common_folk_religion_desc$\n\n水族聚居在贵州南部的山谷里，“水”这一族名在明代定下来。他们主要信奉多神，也崇拜祖先。水族的宗教有九百多个鬼神，能带来福，也能带来祸。\n\n人们请巫师为病人和垂危者祈祷献祭，只有巫师能读水书。水书是一种表意文字，至少有五百个字，用来占卜和看风水。传说它由一位叫陆铎公的贤人创制。\n\n水族的新年是端节，是从9月到11月举行的丰收节，届时铜鼓声声，感谢祖先。端节前夜和头一天早晨不能吃陆地牲畜的肉，破了这条禁忌就是对祖先不敬。"
 sula_religion_desc: "$sula_religion$$common_folk_religion_desc$\n\n苏拉人生活在北马鲁古的苏拉群岛，集中在苏拉贝西岛和曼戈利岛南岸。群岛隶属特尔纳特苏丹国，后者派驻名为“桑加吉·萨纳纳”的总督收取贡赋；1652年荷兰东印度公司在萨纳纳修建了石砌的希望堡。"
 sunni_desc: "$sunni$认为$muslim_ADJ$的领导权在穆罕默德的同伴于塞基法会议上选择阿布·伯克尔作为$rank_empire_muslim_ruler_male$时移交给他，因为先知本人并未指定任何继任者。因此，逊尼派尊崇“正统$rank_empire_muslim_ruler_male$”（穆罕默德之后的四位哈里发）作为治理的典范。\n\n“逊尼”之名来自“逊奈”，即先知的行为典范。教法以《古兰经》、圣训和学者的公议为依据，通过哈乃斐、马立克、沙斐仪和罕百里四大教法学派加以运用。在信条上，多数逊尼派遵循艾什尔里派或马图里迪派的神学。\n\n1337年，逊尼派统治者掌握着伊斯兰世界的大部分，从马木留克埃及、德里苏丹国到金帐汗国。1517年塞利姆一世征服埃及，终结了由马木留克控制的阿拔斯哈里发，掌管麦加与麦地那的奥斯曼苏丹随后以哈里发自居，率领逊尼派世界对抗萨法维伊朗的什叶派政权。1744年，穆罕默德·伊本·阿卜杜勒·瓦哈卜承接罕百里派学者伊本·泰米叶的主张，与穆罕默德·本·沙特在内志结盟。"
 suwo_religion_desc: "$suwo_religion$$common_folk_religion_desc$\n\n苏沃是哥斯达黎加塔拉曼卡地区的比布里人给口头传统起的名字，这套传统构成了他们的萨满教。教义的中心是西博，他是创造者和文化英雄，一位光彩夺目的骗子式神灵：传说他击败了称作索尔布鲁的魔鬼，并把神圣的种子种在苏拉尧姆，比布里人就是从种子里长出来的。\n\n阿瓦帕是萨满，沟通人间和灵界。他们在河边的仪式上从西博那里领受魔石。灵界是人间的倒影：鱼的主人把鱼当作木薯，因为在他眼里水就是土地。\n\n17世纪，西班牙方济各会的传教站没能控制这片山区。1709年，首领巴勃罗·普雷斯贝雷领导起义，烧毁了十四座传教士建的教堂。"
 tain_feyentun_religion_desc: "$tain_feyentun_religion$$common_folk_religion_desc$\n\n智利中南部和阿根廷西南部的马普切人始终没有被印加帝国和西班牙帝国征服。他们的信仰没有正式的领袖，各家族和地区各有差异；由于这些信仰靠口耳相传，后来又经西班牙传教士转述，具体面貌已难以确切知晓。\n\n宇宙分为三层：天界韦努马普，是诸神和祖先的居所；大地，善恶在此争斗；冥界，是有害的韦库费诸灵的居所。自然之灵恩根各自拥有特定的地方，会惩罚擅自闯入的人。\n\n人们举行祈祷仪式恩吉拉通，马奇这类医者兼占卜者则与灵界沟通。许多人把神恩格内切恩等同于基督教的上帝，但这位神要到19世纪才见于记载。"
 tapu_religion_desc: "$tapu_religion$$common_folk_religion_desc$\n\n塔布是波利尼西亚人对神圣、被隔离之物的观念，背后有一种禁止的力量。这个词通行于波利尼西亚各地，汤加、萨摩亚和毛利人都用，在夏威夷则读作卡普；英语里的“taboo”一词，就是1777年詹姆斯·库克船长造访汤加后带回去的。\n\n被塔布沾染的人和物，不可接近，也不可触碰，违犯者可能染病或丧命。酋长的房屋和财物都是塔布。祭司在毛利人中称为图洪加，可以宣布某处渔场为塔布，以防止过度取用。在夏威夷，“艾卡普”禁止男女同桌进食，并把猪肉、大多数香蕉和椰子列为女性不得食用之物。\n\n1819年，新王卡美哈梅哈二世与王后凯奥普奥拉尼以及大祭司赫瓦赫瓦一起，通过与女性同席进食，终结了艾卡普。"
 tengri_desc: "$tengri$是$turkic_group$与$mongolian_group$族群的一种$shamanism_ADJ$信仰，以天空之神$tengri_god_name$为中心，将其视为宇宙的化身。然而，它也包含其他神祇，因为它不仅敬仰自然及其栖居其中的神祇，也尊崇祖先的灵魂。\n\n腾格里即永恒的蓝天，在公元前4世纪的中国史书里以匈奴天神的身份出现。1240年写成的《蒙古秘史》开篇就写孛儿帖·赤那，也就是苍狼，他生来带着腾格里赐予的天命。1290年，伊利汗阿鲁浑对教宗尼古拉四世说，成吉思汗的子孙，无论是否受洗，都留待永恒的腾格里去裁断。\n\n腾格里信仰的地位一直延续到14世纪，那时金帐汗国皈依了伊斯兰教。此后它大多被掩盖，在蒙古人当中则与藏传佛教混合着存续下来。"
 tepehuan_religion_desc: "$tepehuan_religion$$common_folk_religion_desc$\n\n特佩万人是西马德雷山脉的山地民族，其北支奥达姆人住在奇瓦瓦南部。他们的信仰是多神的：人们认为神灵居住在偶像与护符中，来自作为一切生命之源的地下，因此人们有义务供养它们。\n\n耶稣会士记述过一尊主要的偶像乌布马赖，是石柱上的一个人头。萨满为人治病，主持斋戒、祈祷和通宵舞蹈，即米托特，用来祈求降雨和丰收。\n\n1596年，耶稣会的传教活动在特佩万人中开始。1616年，受过洗的救世主式领袖夸乌特拉塔斯带着断裂的十字架，宣称只要杀光西班牙人，愤怒的诸神就会赐福这片土地。他的起事引发了特佩万起义，到1620年被镇压。"
 theravada_desc: "上座部佛教直译为“长老部”，坚持$buddhist$最古老的传承。它拒绝接受大乘$sutra$，因此不接受$bodhisattva$，也不认可$bodhisattva$道为普世修行的途径。相反，它强调僧伽团体作为实现觉悟的优越方式。\n\n传教僧人在阿育王时代把上座部佛教带到斯里兰卡。它的经典巴利语三藏公元前1世纪写定，是它唯一的权威。\n\n11世纪，僧伽罗僧人和东南亚的统治者开始让中南半岛的大部分地区改宗。蒲甘的阿奴律陀王（1044—1077）和13世纪后期素可泰的兰甘亨王使它成为缅甸和泰国的主流信仰，15、16世纪它又成为柬埔寨和老挝的国教。\n\n缅甸和泰国的诸王自称护法之王。斯里兰卡的比丘受戒传承断绝，1753年泰国僧人乌帕利前往康提，为新一批僧人授戒，创立了暹罗派。"
 tibetan_buddhism_desc: "藏传佛教是沿喜马拉雅山脉发展起来的$buddhist$形式，源自大乘佛教传统，但由于与印度的密切接触以及$buddhist$在印度后期的发展，它融入了许多密宗实践。\n\n8世纪，赤松德赞定佛教为西藏国教，邀请宁玛派的创始人莲花生和寂护入藏，桑耶寺成为西藏第一座寺院。11世纪，噶举派和萨迦派在新译的印度教法的基础上兴起。\n\n13世纪，蒙古人征服了西藏，并在1249年任命萨迦班智达为卫藏的总督，佛教成为元朝事实上的国教。更古老的本土宗教苯教深受它的影响，与宁玛派最为接近。\n\n1368年元朝灭亡后，西藏由几个贵族家族轮流统治。宗喀巴（1357—1419）创立了格鲁派，1578年，该派的达赖喇嘛一称由俺答汗授予；五世达赖喇嘛于1640年代建立了甘丹颇章政权。"
 tiwa_religion_desc: "$tiwa_religion$$common_folk_religion_desc$\n\n蒂瓦人（又称拉隆）是阿萨姆中部和梅加拉亚丘陵的藏缅语族民族。山地蒂瓦以七个古老的村寨为政治和仪式中心，村寨首领称为洛罗，为周围一片聚落履行司法与宗教职责。\n\n每个氏族都有自己的祭祀地点，供奉本氏族的神，索格拉祭、朗孔祭等节日贯穿一年。乔恩比尔集市据说最晚可上溯到15世纪，开市之前要举行火祭。"
 tokelauan_religion_desc: "$tokelauan_religion$$common_folk_religion_desc$\n\n托克劳人的宗教以图伊·托克劳为中心，他是阿塔富、努库诺努和法考福三座环礁的主神，这三座环礁大约在一千年前由萨摩亚迁来的人定居。在基督教传入之前，人们在崇拜波利尼西亚通行诸神的同时，也崇拜他。\n\n在作为酋长之岛的法考福，祭祀场里有一座房屋，里面立着一块用草席覆盖的巨大珊瑚石板，作为这位神的化身；首席酋长“阿里基”同时是大祭司。每年5月，托克劳各岛的人都聚集到法考福，以宴会、向图伊·托克劳祈求庇护的祈祷，以及鱼、椰子和露兜树果实的供品来庆祝新年。神庙里点起火，人们通宵起舞。"
 tokuah_religion_desc: "$tokuah_religion$$common_folk_religion_desc$\n\n韦奇人生活在阿根廷和玻利维亚境内贝尔梅霍河与皮尔科马约河的上游一带，人类学家把他们的信仰归入泛灵论和萨满教。他们崇拜自然界的各种存在，并认为有一位至上者托克瓦统治着世界。\n\n萨满用歌唱和响器对抗疾病，有些人还使用具有致幻作用的植物。韦奇人既相信有善灵，也相信有恶灵，并相信死者的灵魂会转生为动物。"
 tolaki_religion_desc: "$tolaki_religion$$common_folk_religion_desc$\n\n托拉基人是苏拉威西东南部人数最多的民族，其信仰以称为“桑吉亚”的神性存在为中心。口传历史说，10世纪初一位公主出现在乌纳阿，被尊为“桑吉亚·恩杜杜”，意为降临的神，她取名韦科伊拉，成为科纳维的第一位统治者。"
 tolotang_religion_desc: "$tolotang_religion$$common_folk_religion_desc$\n\n南苏拉威西的布吉人在伊斯兰教传入之前就有托洛唐教，以阿姆帕里塔一带保存得最完整。信徒敬奉唯一的神德瓦塔·塞乌瓦埃，其称号为帕托托埃，意为“决定命运者”，有的材料说创始人是拉·帕瑙吉。\n\n人们向石头、水井和祖先的坟墓礼拜，《拉贡塔拉》手稿是他们的经典。仪式由称为“乌瓦”的祭司主持，其中“乌瓦塔”是创始人的后裔，主持婚礼。每年社群在伊·帕贝雷的墓前举行西普隆聚会，带上米饭和菜肴，作为来世的口粮。\n\n17世纪初，布吉各王国改信伊斯兰教。托洛唐社群中一部分人接受了伊斯兰教，被称为本滕人，而托瓦尼托洛唐仍坚持旧有仪轨。"
 tomanuru_religion_desc: "$tomanuru_religion$$common_folk_religion_desc$\n\n托玛努鲁教的名字出自布吉语“托马努隆”，意为“从天上降下的人”，指南苏拉威西各王国建国传说所依据的、由上界派来的统治者。14世纪之前，传说有两次降临：先是天界的帕托托埃，又称坦博罗·朗伊，降在拉蒂莫荣山顶；其后是他的儿子巴塔拉·古鲁和妻子韦·尼利蒂莫克，他们的到来标志着半岛各地涌现出本地领主。\n\n波尼在14世纪初随着“马塔扬的托马努隆”的降临而建立，其第一位统治者名叫拉·乌比。盖瓦的世系约在1320年始于一位身世不明的“图马努隆”与名叫卡拉恩·巴约的贵族结合；在索佩恩，国家的创立同样与这样的降临相连。"
 totemism_desc: "$totemism$$common_folk_religion_desc$\n\n图腾崇拜指以北美洲最为人所知的一种做法：把一个家族、氏族或民族与某种动物或灵体联系起来、以此作为标志。“图腾”一词是奥吉布瓦语杜登的英语形式，这个词和它背后的信仰本属于奥吉布瓦人，不过类似的观念也见于许多民族。\n\n阿尼什纳比人分为若干称为杜登曼的氏族，大多以动物命名。在他们的口传传统里，伟大的米吉斯诸灵从大西洋中升起，把密得之道传给他们。\n\n在太平洋西北海岸，各民族雕刻巨大的图腾柱，柱上有熊、鸟、蛙、人和超自然的生灵。图腾柱像纹章一样，显示家族或酋长的徽记，讲述该家族拥有的故事，或纪念特殊的场合。"
 tungusic_shamanism_desc: "$tungusic_shamanism$$common_folk_religion_desc$\n\n萨满这个词源自满洲和俄罗斯远东各通古斯民族的语言，这些民族有女真人、满族人和鄂温克人。他们的信仰万物有灵，崇拜多神，以天神阿布卡恩都里为首，他是一切生命的来源，众多神明使自然的每个部分都有了生机。\n\n萨满是有非凡能力的男女，能感知诸神的旨意，每个氏族都有自己的萨满，主持祭祀。以动物神为对象的狂野仪式，皇太极早在1636年就加以禁止；到1673年，除皇家的堂子外，所有公共的祭祀场所一律被禁。\n\n满族把武神关帝奉作神祇之一。1747年，乾隆皇帝颁布满文的满洲祭祀典礼，1780年又有了汉文译本。"
 tunpa_religion_desc: "$tunpa_religion$$common_folk_religion_desc$\n\n奇里瓜诺人又称阿瓦瓜拉尼人，是说瓜拉尼语的农民和武士，居住在玻利维亚东南部的安第斯山麓。屯帕在他们的语言里指神，也是先知的头衔，这些先知自称为神，号召族人与西班牙人作战。\n\n奇里瓜诺人出自16世纪初从巴拉圭西迁的瓜拉尼人，与查内人混居融合而成。西班牙人说他们没有宗教，直到19世纪，他们一直对传教士无动于衷：1767年的一处耶稣会传教点，只有268名奇里瓜诺人皈依。\n\n1778年和1779年，凯萨和马萨维各出现一位先知式的领袖，宣称自己是神，催促阿瓦瓜拉尼人进攻西班牙人。两人在进攻失败后，先后死于1780年至1781年间。"
 txapakura_religion_desc: "$txapakura_religion$$common_folk_religion_desc$\n\n巴西与玻利维亚边境瓜波雷河、马莫雷河流域讲查帕库拉语族语言的各族中，最著名的是瓦里人：瓦里的意思是“我们这些人”，他们传统上住在半游牧的河畔村落，至少每五年迁居一次。\n\n在瓦里人的传统观念里，“人”是相对猎物而言的。被猎的动物有时也算人，因为它们有时会当捕食者；人的身体也不能说明一个人是谁，因为身体会被另一种存在的视角吸引，并变成那种存在。故事里讲过一个母亲，女儿发现她两腿之间露出了美洲豹的尾巴。"
 udmurt_paganism_desc: "$udmurt_paganism$$common_folk_religion_desc$\n\n乌德穆尔特人说彼尔姆语支的语言，居住在今俄罗斯的乌德穆尔特一带。他们最古老的神是天神英马尔，可上溯到芬兰—乌戈尔诸民族尚未分开的时代。祈祷常以呼唤英马尔、基尔迪辛和夸济开头；这些究竟是几位神，还是同一位神的不同称号，学者仍有争论。\n\n乌德穆尔特人还崇敬许多低阶神灵，例如水中的武穆尔特和森林里的纽列斯穆尔特。每个氏族都有自己的始祖和保护者沃尔舒德。\n\n1557年，伊凡雷帝给予受洗的乌德穆尔特家庭特权。直到18世纪中叶才开始大规模强制改宗，教堂和学校被修建起来，圣林和祈祷处被毁。"
 umina_religion_desc: "$umina_religion$$common_folk_religion_desc$\n\n乌米尼亚是曼特尼奥人的翡翠女神，曼特尼奥人是今厄瓜多尔沿海的诸酋邦。据说她是酋长托哈利的绿眼睛女儿。一种说法是她被人杀害，人们从她的心中取出一颗翡翠；另一种说法是，她在干旱中剖开自己的胸膛，化为一块宝石。\n\n西班牙人到来时，这块宝石据说有鸵鸟蛋那么大，供奉在曼塔的神龛里，祭司用它擦拭病人的患处，于是她成了健康、丰产和降雨之神。对她的崇拜还传到安第斯山区的卡兰基人中，曼特尼奥人据说宁死也不肯交出她。"
 utaki_religion_desc: "$utaki_religion$$common_folk_religion_desc$\n\n琉球群岛的本土信仰以御岳为中心。御岳是神圣的场所，通常是村庄附近的树林、泉水、洞穴或山丘，人们在那里敬奉祖先与自然诸神。其中最神圣的地点“伊比”只有祝女，即女祭司才能进入。人们认为家中的女性在灵性上更高一筹，这种信念称作“姐妹之灵”。\n\n斋场御岳相传是生下琉球群岛的女神阿摩美久降临的地方，是琉球王国最神圣的官方场所。按传统史书的说法，尚巴志在15世纪初把冲绳本岛的三个王国统一为一个。\n\n1469年，尚圆王让女儿担任最高女祭司闻得大君。1609年萨摩入侵之后，儒家思想逐渐削弱了女祭司的权威。"
 vaghua_religion_desc: "$vaghua_religion$$common_folk_religion_desc$\n\n说瓦格瓦语（又称塔武拉语）的居民生活在所罗门群岛的舒瓦瑟尔岛上，岛上居民称这座岛为劳鲁。1568年4月，阿尔瓦罗·德·门达尼亚率领的西班牙人望见这座岛，把它标作圣马科斯。"
 vainakh_paganism_desc: "$vainakh_paganism$$common_folk_religion_desc$\n\n北高加索的瓦伊纳赫人——车臣人、印古什人和巴茨比人——在基督教和伊斯兰教扎根之前信奉多神，根基是对自然力量、祖先和精灵的崇拜，树木被认为是精灵的居所。\n\n德拉是最高神和世界的创造者，雷神谢拉与他并受尊崇。大地由一头公牛的角托着，车臣人和印古什人在“牛日”星期二不干活。\n\n位于今印古什境内的特卡巴‑叶尔德教堂，据说建在更古老的异教神庙之上，在格鲁吉亚塔玛尔女王时期的1184至1213年间经过改建。伊斯兰教自14世纪起已在车臣人中出现，但传播缓慢，直到19世纪，古老的信仰仍然很强。"
 vedda_religion_desc: "$vedda_religion$$common_folk_religion_desc$\n\n维达人在斯里兰卡的森林里以狩猎采集为生。他们的传统信仰是多神教，以死者为中心。维达人把祖先称为奈亚库，打猎时要向他们祈求。这些亲人之灵被认为守护着活着的人，还在狩猎时给他们送来猎物。\n\n死者既不算善，也不算恶，活人把他们当作朋友和亲属对待。祖灵受到善待就会一直仁慈，被怠慢则会撤回帮助，甚至变得怀有敌意。\n\n维达人与信奉佛教、印度教和伊斯兰教的邻人共同敬拜卡塔拉伽摩圣地，相传斯堪陀神在那里遇见并迎娶了维达姑娘瓦利。时间一长，不少维达人名义上接受了佛教或印度教，旧有的仪式却照常延续。"
 vodun_religion_desc: "$vodun_religion$$common_folk_religion_desc$\n\n今贝宁、多哥和加纳沿海的阿贾人、埃维人和丰人，对沃敦（灵）的崇拜早于有文字记载的时代。巫毒教没有中央权威、经典和正统教义，分成许多各自供奉某位神灵的小教团。\n\n一位创造神娜娜·布鲁库位于无数沃敦之上。他的后代玛武与莉萨是两部分合一的神，莉萨掌管太阳和白昼，玛武掌管月亮和黑夜。十字路口之神雷格巴沟通人与神灵，凡事先向他求问。\n\n达荷美从阿波美高原的丰人中兴起，是约1600年建立的阿拉达的分支。国王阿贾加1724年攻取阿拉达，1727年攻取维达。随着大西洋奴隶贸易，巫毒教徒被带到了美洲。"
 votian_religion_desc: "$votian_religion$$common_folk_religion_desc$\n\n瓦佳人是居住在芬兰湾与楚德湖（佩普西湖）之间英格里亚的芬兰语族民族，信奉古老的异教，被视为诺夫哥罗德的奠基民族之一。1069年的记载最早提到他们，当时他们随波洛茨克人进攻诺夫哥罗德；12至13世纪的教皇诏书把他们列入异教部落。\n\n他们长期保有自己的圣所。1470年代诺夫哥罗德陷落后，莫斯科流放了许多瓦佳人，并更急迫地推行改宗；1534年，诺夫哥罗德大主教马卡里向伊凡四世抱怨他们仍在奉行异教信仰。\n\n被派去劝化他们的修士伊利亚摧毁了许多旧圣所，司祭尼基福尔继续他的工作。瓦佳人慢慢被改宗，成为虔诚的东正教徒。"
 wa_religion_desc: "$wa_religion$$common_folk_religion_desc$\n\n佤人是南亚语系民族，居住在湄公河与萨尔温江之间崎岖的山地，信奉万物有灵。佤人的起源传说称，最初的佤人是两位女祖先雅托姆和雅泰所生，她们早年在一个叫侬凯奥的湖里以蝌蚪的形态生活。\n\n祭祀以血祭为中心：寨中的灵医遇到疾病，就杀鸡、杀猪或杀更大的牲畜；寨中神庙每年在一根Y形木桩前宰杀一头水牛。据当地传说，献上人头能让稻田丰产，深山里的佤人因此以猎头著称；而与傣族、掸族相邻的佤人接受了南传上座部佛教，不再猎头。"
 waaqeffanna_religion_desc: "$waaqeffanna_religion$$common_folk_religion_desc$\n\n在奥罗莫人和非洲之角其他说库希特语的民族中，瓦格教徒崇拜唯一的神瓦格·托基查；据说他有许多名字，也被称为“黑色的神”。瓦格教没有经典，全靠口耳相传。\n\n瓦格通过阿亚纳行事。阿亚纳是传递讯息却不能创造的灵，它们附在人身上，被附体的男女成为祭司和仪式主持者卡卢。阿巴穆达意为“圣油之父”，是最高的卡卢，朝圣者带着一头公牛和一只绵羊远道前来受膏。\n\n1529至1559年间，瓦格教徒、基督徒和穆斯林之间持续三十年的争斗削弱了三方。许多奥罗莫人后来被卷入穆斯林苏丹国和基督教的埃塞俄比亚帝国。"
 waldensian_desc: "$waldensian$派由彼得·瓦勒度创立，是一个强调简朴、贫穷与圣经权威的$christian_ADJ$改革派运动。他们拒绝神职人员的财富、圣徒崇拜以及圣事对救赎的必要性。$waldensian_ADJ$作为异端受到迫害，但其精神在$europe$传播，并经受住了数个世纪的压迫。\n\n瓦勒度派于12世纪末兴起，最初称为里昂穷人，追随彼得·瓦勒度。瓦勒度是一位富商，约1173年散尽家产，宣讲使徒式的清贫和平信徒传道。1184年被开除教籍，1215年又因拒绝接受主教对传道的控制而被宣布为异端。\n\n这一运动传到科蒂安阿尔卑斯山，被称为“巴尔巴”的传道人在那里与秘密的小型会众聚会。迫害从未停止，1487年教宗英诺森八世还颁布诏书，下令消灭他们。\n\n1532年的尚福朗会议上，瓦勒度派加入改革宗传统，开始用法语公开礼拜。此后屠杀不断，尤以1655年的皮埃蒙特复活节为甚。1689年，牧师亨利·阿尔诺率领流亡者“光荣回归”他们的山谷。"
 wan_aisa_religion_desc: "$wan_aisa_religion$$common_folk_religion_desc$\n\n米斯基托人的土地沿莫斯基托海岸分布，从洪都拉斯的卡马龙角延伸到尼加拉瓜的马塔加尔帕大河。在米斯基托诸王的时代之前，他们是多神信徒，有太阳神拉普塔、月亮神卡蒂、雷神阿尔瓦尼，以及掌管海洋、湖泊和河流的利达万卡。没有人祭的记录。\n\n萨满称作苏基亚，靠在梦中寻得药方来治病，并向患处吹烟。同一时期只能有一位首席萨满，称为至尊苏基亚或奥库利，他代表被称作拉萨的恶灵，邻近各部落也尊崇他。\n\n17世纪，英国私掠者与米斯基托人结盟，开始册封他们的首领为国王，海岸从此长期受到欧洲人的影响。"
 warao_religion_desc: "$warao_religion$$common_folk_religion_desc$\n\n瓦劳人居住在委内瑞拉东北部的奥里诺科河三角洲，名字意为“船民”。关于祖先的来历，他们说有位天上的猎人射中一只鸟，鸟穿过天界的地板坠落，猎人便顺着一根天上棉花搓成的绳子降到了大地。\n\n世界称为霍巴希，是一个被水环绕的圆，里面住满了精灵赫布；他们对人类可能有益、有害，也可能中立。其中最重要的是“我们的祖父”卡诺波，他住在由最大的萨满威西拉图守护的圣石之中。\n\n人们用仪式用的烟草之烟和由萨满主持的仪式来让赫布保持满意。瓦劳人认为，若没有赫布，也没有称为霍阿和巴哈纳的有害巫术，人就会长生不死。"
 wetarese_religion_desc: "$wetarese_religion$$common_folk_religion_desc$\n\n韦塔人又称韦特尔人，属于安汶—帝汶族群，居住在印度尼西亚东部班达海中的韦塔岛上，说韦塔语。"
 wu_religion_desc: "$wu_religion$$common_folk_religion_desc$\n\n在中国，男称觋、女称巫的萨满式修行者在人和神灵之间充当中介。“巫”字最早见于商代的记载，当时舞蹈和入神是与祖先沟通的一种办法。\n\n随着儒家思想占据上风，巫在朝廷里失去了位置，退入民间信仰；理学家称他们的狂迷仪式粗野无序。在乡村和庙宇里，巫仍是医病和占卜的人，如童乩，即青少年灵媒，入神后由神明附体，给出神谕。\n\n东北则形成了另一种与通古斯诸族相关的萨满教。1747年乾隆皇帝下令编纂并刊行一部萨满祭祀典礼，用来规范他担心失传的祭祀。"
 yage_religion_desc: "$yage_religion$$common_folk_religion_desc$\n\n安达基人生活在哥伦比亚南部卡克塔河上游流域以及弗拉瓜河和苏阿萨河谷地。他们的族名本身就与祭礼中饮用雅赫（死藤水）有关：萨满要在药剂里加入曼陀罗树的花，才能与“雅赫之灵”相会。他们的神话说，曼陀罗的巨花在被雅赫穿透并受孕之后，变成了太阳。\n\n萨满的医术也是安达基人在安第斯山与森林之间贸易的一部分。1637年他们同皮豪人一起攻击西班牙人的殖民点，1721年又参加了普图马约和卡克塔各部落的总起义，抵抗一直延续到18世纪。"
 yanolop_religion_desc: "$yanolop_religion$$common_folk_religion_desc$\n\n在居住于西加罗林群岛雅浦岛上的雅浦人的创世神话里，神加武尔·利·耶尔·耶尔造出宇宙的四层，从他自己所在的幽暗一层，直到海下的冥界，又用泥土塑出主神亚诺洛普。\n\n亚诺洛普又以意念化生五位天神，他们彼此婚配，繁衍出后续的几代神。最早一代天神中的老耶尔法特用泥土造出第一对男女加南和尼克。\n\n传统上，人有两个灵魂：一个继续存活并在大地上游荡，另一个会死去，被天神鲁格吞食。人死后，仪式性的祈祷会把灵魂引到加察姆，由那里可以升入天界，并在亚诺洛普的会所接受审判。"
 yao_religion_desc: "$yao_religion$$common_folk_religion_desc$\n\n瑶族说苗瑶语系语言，居住在湖南和广西，自称是祖先盘瓠的后代，盘瓠本是狗，后来变成了人。13世纪以来，他们的信仰与道教深度交融，常被称为瑶族道教：主神是正统道教的三清。\n\n每个瑶族成年男子都要经过四级传度入道，第一级叫“挂灯”。高阶祭司为天上诸神举行仪式。\n\n猎神张五郎既是驱邪者，也是引导亡魂的神，因为人们相信死者要回到梅山洞里才能安息。1370年代和1449年的苗瑶起事之后，许多人向南迁入广西、广东和云南。"
 yastay_religion_desc: "$yastay_religion$$common_folk_religion_desc$\n\n亚斯塔伊被人们记作山中野兽和狩猎的保护神，流传在今阿根廷西北部和智利的安第斯山区，迪亚吉塔人就生活在这里。在邻近的瓦尔佩人的传说里，亚斯塔伊警告骄横的猎手希兰科不要再为取乐而滥杀野兽。希兰科不听，大地之母帕查玛玛便用热风的旋涡把他卷走，据说每当有人违背她的意愿，松达风就会吹起。\n\n迪亚吉塔人没有祭司阶层，每个村落只有一名萨满，主持仪式、为人治病。他们的土地在15世纪后期落入印加手中；1560年至1667年间，他们又与西班牙人打了卡尔查基战争。"
 yazidism_desc: "雅兹迪教起源于$iranian_group$传统，同时也包含$judaism$、$christian$与$muslim$的元素。它认为宇宙由上帝创造，但他任命“孔雀天使”塔乌西·梅莱克统治它。尽管它受到其他宗教的许多影响，尤其是在其神秘实践中，但其核心植根于古代$iranian_group$宗教。\n\n雅兹迪人说库尔德语。他们的信仰在12世纪由苏非神秘主义者谢赫阿迪·本·穆萨菲尔重新塑造；他定居在拉利什，那里是雅兹迪教的圣地。雅兹迪人相信上帝把宇宙托付给七位天使，天使之首是塔乌西·梅莱克。\n\n他们相信灵魂转世，崇敬太阳、圣泉和火。社群分为穆里德、谢赫和皮尔三个内婚种姓。\n\n1414年，邻近的逊尼派库尔德部落洗劫了拉利什。雅兹迪派曾是博赫坦等库尔德公国的宗教，但自1566年起，奥斯曼帝国的穆夫提艾布·苏欧德发布法特瓦，准许杀戮雅兹迪人并奴役他们。"
 yopo_religion_desc: "$yopo_religion$$common_folk_religion_desc$\n\n西夸尼人又称瓜希博人，居住在哥伦比亚东部和委内瑞拉西部的奥里诺科平原草原上。他们的信仰得名于约波树的种子磨成的粉，巫师多帕图比尼吸入约波粉，以便与赐下传统医药的察马尼沟通。\n\n西夸尼人说，人类享有的一切财富来自四位兄弟，他们升上了天空，成为可以看到的昴星团。生命和所有可食用的植物，则出自一棵大树卡利亚维里奈，它由库齐库齐在松鼠的帮助下砍倒。每个去世的西夸尼人，都要举行第二次葬礼“伊托莫”。"
 yukaghir_shamanism_desc: "$yukaghir_shamanism$$common_folk_religion_desc$\n\n尤卡吉尔人在西伯利亚东北部的科雷马河流域猎取鹿、驼鹿和紫貂；17世纪俄国人到来时，他们的部落东西分布，从勒拿河一直到阿纳德尔河口。他们崇拜祖先、火、太阳、狩猎、大地和水的神灵。其中最重要的是太阳，他是一切纠纷的最高裁判。\n\n每个氏族都有自己的萨满，萨满死后被当作神明看待：遗体被肢解，各部分留在氏族中当作圣物。杀狗献祭、带有狩猎禁忌的驼鹿崇拜，以及以乌鸦为主题的史诗，都属于古老的狩猎生活。"
 yuman_religion_desc: "$yuman_religion$$common_folk_religion_desc$\n\n讲尤玛语的各民族分布在科罗拉多河下游、南加利福尼亚和下加利福尼亚，各有各的传说。莫哈维人相信有一位创造者马塔维利亚，他把氏族分给人们。他的弟弟马斯塔姆霍赐予人们河流，并教他们耕种；莫哈维青年成年时要服用曼陀罗作为圣礼。在库米亚伊人的传说里，世界起初只有咸水和香蒲；图柴帕与兄弟约科马蒂斯造出了世界，图柴帕还吹气三次、散出烟草，使天空升起。\n\n库米亚伊人的圣山如库恰马山是灵力的中心，郊狼是用机智和恶作剧改变世界的骗子。科奇米人中，萨满在仪式上披着用人的头发制成的斗篷。"
 yupik_shamanism_desc: "$yupik_shamanism$$common_folk_religion_desc$\n\n阿拉斯加西部和西南部的尤皮克人分布在育空‑库斯科奎姆三角洲和布里斯托尔湾一带，信奉万物有灵。萨满是宗教生活的中心人物，是精灵与人之间的中介，借助音乐、舞蹈和面具来沟通。\n\n尤皮克人相信，赖以为生的大型海兽和陆兽听得懂人的话，要求受到尊重，因此狩猎要遵守规矩，以尊崇并安抚它们的灵魂。男子公屋是举行仪式的中心；萨满指点雕刻者怎样制作公屋舞蹈时戴的面具，面具用后就要销毁。膀胱节和信使宴是其中的大典。"
 zemi_religion_desc: "$zemi_religion$$common_folk_religion_desc$\n\n大安的列斯群岛的泰诺人以“泽米”为信仰核心：它既是祖先之灵或神，也指供奉这些神灵的雕像。泽米用木头、骨头和石头雕成，最典型的形制是三尖石像。服侍它们的是称作贝希克的祭司，神话则在称作阿雷伊托的仪式上歌唱舞蹈。\n\n尤卡胡是地母神阿塔贝之子，主管木薯的收成。创世神亚亚杀死了儿子亚亚埃尔，把他的骨头挂在葫芦里，葫芦里涌出了鱼。传说太阳和月亮从伊瓜纳博伊纳洞穴里出来。\n\n1492年哥伦布到来后，这种信仰被迫转入地下。据信泰诺人把泽米藏起来或毁掉，免得落到西班牙人手里。"
 zoroastrian_desc: "琐罗亚斯德教是一种古老的$iranian_group$宗教，遵循查拉图斯特拉（也称琐罗亚斯德）的教义与《阿维斯塔》经典。它基于善与恶的二元宇宙观，描述了神阿胡拉·马兹达与破坏灵安格拉·曼纽之间的永恒冲突，并预言善将最终战胜恶。\n\n祆教徒认为，人要通过善思、善言、善行选择真理而非谎言，投身斗争，直到善获胜。火被视为阿胡拉·马兹达的象征，十分神圣，由祭司在神庙中看护。祆教曾是阿契美尼德王朝和萨珊帝国的国教，直到7世纪阿拉伯征服。\n\n在穆斯林统治下，祆教徒成为少数。蒙古人征服后，教团退居亚兹德。古吉拉特的帕西人于1419年把伊朗沙圣火迁到瑙萨里；1478年，一位平信徒前往亚兹德，带去第一封“里瓦亚特”，向伊朗祭司询问仪式问题。1501年起，萨法维王朝推行什叶派化，使留在伊朗的祆教徒境况更加艰难。"
 abenakian_group_desc: "$abenakian_group$$group_text$$abenakian_language$的民族构成。\n\n阿贝纳基各族是东北林地上说阿尔衮琴语的民族。阿贝纳基一名出自“瓦巴纳基亚克”，意为“黎明之地的人”，指今天新英格兰和滨海诸省一带。东阿贝纳基语主要通行于缅因，西阿贝纳基语通行于魁北克、佛蒙特和新罕布什尔，佩诺布斯科特人、帕萨马科迪人、马里西特人和米克马克人则是瓦巴纳基联盟里的邻族。\n\n阿贝纳基人没有中央政府。1600年代与欧洲人接触后，殖民、疾病和战争使原有的部落人口锐减，幸存者聚合成了接触后的同一个群体。"
 aikana_group_desc: "$aikana_group$$group_text$$aikana_language$的民族构成。\n\n艾卡纳人是亚马孙西部低地的原住民，居住在今巴西的朗多尼亚州一带。他们又称马萨卡人、图巴朗人和蒙代人，所说的语言找不到已知的亲属语言。"
 aingae_group_desc: "$aingae_group$$group_text$$aingae_language$的民族构成。\n\n科凡人自称“阿伊”，说阿依语（科凡语）。其家园在厄瓜多尔东北部和哥伦比亚南部，介于瓜梅斯河与阿瓜里科河之间。\n\n16世纪晚期，他们抵抗西班牙的殖民，摧毁了西班牙人的莫科阿城。1602年抵达的耶稣会士拉斐尔·费雷尔，直到军人和殖民者想要跟进时才被赶走。此后欧洲传来的疾病使他们人口骤减，16世纪中叶时他们约有1.5万人。"
 algic_group_desc: "$algic_group$$group_text$$algic_language$的民族构成。\n\n维约特人和尤罗克人是说阿尔吉克语的各族中最靠西的两支，语言与东方的阿尔衮琴诸语只有很远的亲缘。\n\n维约特人自称“库维尔”，意为“人”，居地北起马德河，经洪堡湾直到下伊尔河，是一片红杉林、沙滩和潮汐沼泽相间的土地。尤罗克人占据克拉马斯河和加利福尼亚北部海岸，南起特立尼达，几乎北至新月城。两族的文化相近。"
 amazigh_group_desc: "阿马齐格人，又被称为柏柏尔人，是来自北非的一个族群。他们强烈的身份认同与几个世纪前入侵并持续塑造他们家园的阿拉伯人产生了冲突。\n\n阿马齐格人的分布从阿特拉斯山脉、卡比利亚一直到撒哈拉的图阿雷格人。加那利群岛的关切人与他们同源。古代的阿马齐格人建立过努米底亚和毛里塔尼亚王国。\n\n7至8世纪的阿拉伯征服之后，这一地区逐渐阿拉伯化，但阿马齐格人保留了自己的语言；11世纪起，穆拉比特和穆瓦希德王朝统治着马格里布和安达卢斯。1337年，马林、扎扬和哈夫斯三个王朝据有马格里布；15世纪，卡斯蒂利亚征服了关切人。"
 andean_group_desc: "居住于安第斯山脉或其附近地区的山地居民，早已适应了与高原多样气候和复杂地形完美契合的生活方式。这种共同的生活方式维系着安第斯山脉丰富多元的文化与文明。\n\n安第斯诸族群的分布从哥伦比亚南部经厄瓜多尔、秘鲁到智利北部，沿安第斯山脉，也包括秘鲁的沙漠海岸。他们驯化了马铃薯、辣椒、木薯和古柯，织造精美的纺织品，建造宏伟的建筑。卡拉尔可追溯到约公元前3500年；此后有查文、莫切、纳斯卡、瓦里和蒂瓦纳库，以及延续到约1470年的沿海王国奇穆。\n\n约1230年，库斯科王国在高地兴起。1438年起，印加人把大部分安第斯文化联合成美洲有史以来最大的帝国塔万廷苏尤。16世纪西班牙征服者到来，安第斯地区由此归入西班牙王室治下。"
 anishinabe_group_desc: "$anishinabe_group$$group_text$$anishinabe_language$的民族构成。\n\n五大湖地区的阿尼希纳贝诸族包括奥吉布瓦人、渥达瓦人和波塔瓦托米人，以及阿尔衮琴人和尼皮辛人，他们都说阿尔衮琴语。最初与欧洲人接触时，他们生活在东北林地和亚北极地带。\n\n奥吉布瓦人以桦树皮独木舟、铜的贸易、野生稻和枫糖著称，米迪维温会则把他们的口述历史和歌谣记在桦树皮卷上。渥达瓦人的名字意为“做买卖”，他们定居在马尼图林岛和布鲁斯半岛，1600年代以后沿渥太华河扩散，进入密歇根和威斯康星。奥吉布瓦、渥达瓦和波塔瓦托米三族结成了三火联盟。"
 apsaalooke_hiraaca_group_desc: "$apsaalooke_hiraaca_group$$group_text$$apsaalooke_hiraaca_language$的民族构成。\n\n克劳人（阿萨罗克）和希达察人（希拉阿卡）是亲缘相近、同属苏族语系密苏里河谷支的两个民族。据说两族都来自俄亥俄地区，在12或13世纪定居于温尼伯湖以南，在村落里种植作物、猎取野牛。\n\n希达察人后来定居在今北达科他的刀河一带，住进永久的土屋村落，以农耕为生。16世纪中叶，奥吉布瓦人和克里人把克劳人逼向西面的密苏里河上游。17世纪晚期，克劳人与希达察人分开，迁往黄石河谷，约从1730年起，他们学会骑马，在大平原上猎取野牛。"
 arabian_group_desc: "阿拉伯半岛的土地上生活着形形色色的族群。从也门的高地到中部的绿洲，这些民族都已适应了严酷的自然环境和生存条件。\n\n半岛上的阿拉伯人还分布在哈德拉毛、内志、红海沿岸的汉志、阿曼和巴林。伊斯兰教出现以前，半岛南部有萨巴、希木叶尔和哈德拉毛等王国，中部则主要是游牧部落的天地。\n\n632年先知穆罕默德去世时，整个半岛已在伊斯兰教旗下统一，汉志的麦加和麦地那成为这一信仰最神圣的城市。阿拉伯部落从这些地方北上西进，进入黎凡特、伊拉克和马格里布，把阿拉伯语传播到整个地区。"
 arabic_group_desc: "伍麦叶哈里发国的兴衰对其治下的大部分族群产生了深远影响，虽然帝国早已灭亡，但他们的影响力和文化却得到了延续。\n\n阿拉伯文化组涵盖埃及、黎凡特、伊拉克、马格里布、安达卢斯和马耳他。伊斯兰教出现以前，阿拉伯人主要指阿拉伯半岛和叙利亚沙漠的部落，其中有以佩特拉为中心的纳巴泰人，以及信奉基督教的加萨尼人。\n\n正统、伍麦叶、阿拔斯和法蒂玛诸哈里发国把阿拉伯人的统治推进到法国南部和中国西部，阿拉伯人迁入马格里布和黎凡特，也把阿拉伯语传播到被征服的族群中。大马士革的伍麦叶哈里发国于750年灭亡。1337年，马穆鲁克苏丹国统治着埃及和叙利亚。"
 atacame_group_desc: "$atacame_group$$group_text$$atacame_language$的民族构成。\n\n阿塔卡马人生活在智利北部、阿根廷西北部和玻利维亚南部的阿塔卡马沙漠及高原上，传统语言是库恩萨语。他们用石墙围成的堡垒“普卡拉”保护村落，擅长制陶以及铜和黄金的加工，圣佩德罗‑德阿塔卡马、基托尔、丘丘等聚落兴起于绿洲之中。\n\n蒂亚瓦纳科人是已知最早的征服者，15世纪印加人又征服了他们，并修建了从阿塔卡马盐沼通往阿根廷西北部的道路。1536年，迭戈·德·阿尔马格罗率领的西班牙人到达，1557年该地被西班牙吞并。"
 atakapa_group_desc: "$atakapa_group$$group_text$$atakapa_language$的民族构成。\n\n阿塔卡帕人自称“伊沙克”，意为“人”。他们分成若干部落，居住在今得克萨斯和路易斯安那的墨西哥湾沿岸，所说的语言是孤立语言。“阿塔卡帕”这个名字出自乔克托语，是先接触乔克托人的欧洲人沿用下来的。"
 atallan_group_desc: "$atallan_group$$group_text$$atallan_language$的民族构成。\n\n厄瓜多尔海岸的曼塔人和万卡维尔卡人形成了曼塔—万卡维尔卡文化，这是该国最后的前哥伦布文化之一，约从850年延续到1600年。他们的酋邦分布在马纳比、圣埃伦娜和瓜亚斯沿海，远至拉普拉塔岛。\n\n他们种植玉米、花生和南瓜，潜水采集海菊蛤的贝壳，用作货币，贸易北至墨西哥。万卡维尔卡人传统上与酋长瓜亚斯及其妻子基尔的传说联系在一起，据说瓜亚基尔城即由此得名。"
 atlantic_group_desc: "西非的大西洋民族居住于从塞内冈比亚到塞拉利昂的海岸与稀树草原地带，使用尼日尔‑刚果语系大西洋语支的语言。他们既包括塞内冈比亚海岸伟大的骑手与商人，也包括塞拉利昂腹地栖居森林的梅尔诸民族。\n\n大西洋非洲文化组包括塞内冈比亚的沃洛夫人、塞雷尔人、约拉人和曼扎克人，散居萨赫勒各地的富尔贝牧民，以及南部的泰姆内人、布隆人和歇尔布罗人。沃洛夫人建立了乔洛夫帝国。该国14世纪中叶摆脱马里的影响，控制塞内冈比亚大部分地区，直到1549年丹基一役战败，诸附庸随之独立。\n\n15世纪葡萄牙船只抵达这片海岸，发现沃洛夫首领身边有穆斯林学者辅佐。16世纪，讲曼德语的马内人劫掠塞拉利昂海岸。1725年，富尔贝人发动圣战，建立了富塔贾隆伊玛目国。"
 australian_group_desc: "澳大利亚的原住民民族是地球上延续至今最古老的文化之一，已在这片大陆上生活了至少六万五千年。他们通过梦创神话这一观念所表达的对土地的深层联系，以及其精深的生态知识，使他们在世界各民族中独具一格。\n\n澳大利亚原住民的祖先约在5万至6.5万年前，经陆桥和短程海上航行从东南亚来到这片大陆。他们分成约600个族群，说约250种语言，是复杂的采集狩猎者，有的地方实行火耕和养鱼。梦创神话是一个仍在延续的神圣创世叙述，把每个人同土地联系在一起。\n\n18世纪中叶前后，望加锡的海参采集者开始造访北部海岸，一种望加锡洋泾浜语成为当地的贸易语言。1788年英国人登陆，疾病和边疆暴力使人口锐减；在塔斯马尼亚，19世纪20年代到30年代初的黑色战争几乎灭绝了塔斯马尼亚原住民。"
 austroasiatic_group_desc: "作为亚洲最古老的文化群体之一，$austroasiatic_group$各民族发展出了多元化的社会形态——从高度发达的文明帝国，到仍保持原始生活方式的丛林部落。\n\n南亚人说的是东南亚大陆最古老的语系之一的语言。他们既有高棉、孟和越南人的大王国，也有佤、卡西、桑塔尔等山林部族，分布从红河三角洲经柬埔寨、缅甸，一直到印度东部。\n\n高棉人建造了吴哥，吴哥于1431年被大城王国攻陷。孟人在13世纪晚期以勃固为都建立汉萨瓦底王国，1757年被缅甸征服。大越的越南人于1427年摆脱明朝统治，随后向南进入占婆人的土地，1471年攻占阇盘。"
 austronesian_group_desc: "作为分布最广的文化与语系群体之一，$austronesian_group$民族从马达加斯加至复活节岛的辽阔地域皆有定居。他们被誉为卓越的航海者，在殖民过程中传播了技术与物种。\n\n南岛诸民族源于一次海上扩张：他们在约公元前3000至前1500年间离开台湾，最远向南抵达新西兰。凭借舷外浮材独木舟和蟹爪帆，他们把稻米、香蕉、椰子、猪和鸡带到一座座新岛屿。这里的南岛人指爪哇、苏门答腊、婆罗洲、苏拉威西、菲律宾以及越南的占人海岸的诸民族。\n\n1293年建于爪哇的满者伯夷，在1337年正于卡扎·马达治下崛起。伊斯兰教沿着贸易港口传播，满剌加在1400年前后强盛起来。1471年大越攻毁占人的阇盘城，西班牙自1565年起统治菲律宾，荷兰人于1619年建立巴达维亚。"
 aymara_group_desc: "$aymara_group$$group_text$$aymara_language$的民族构成。\n\n艾马拉人生活在的的喀喀湖周围的安第斯高地，其名被追溯到一个意为“有许多公有农田的地方”的词。他们的祖先在高原上生活了数千年，伟大的蒂亚瓦纳科城就在他们的土地上，据信建于110年前后，不过它是否由艾马拉人所建尚无定论。\n\n印加人视这片地方为圣地：他们的皇帝要朝拜的的喀喀湖中的太阳岛和蒂亚瓦纳科遗址。15世纪晚期或16世纪初，艾马拉人归入印加统治，16世纪又处于西班牙帝国治下。"
 bagua_group_desc: "$bagua_group$$group_text$$bagua_language$的民族构成。\n\n巴瓜人是秘鲁北部的一个族群。他们的语言语属不明，早已消亡，只留下三个词。"
 baltic_group_desc: "波罗的人是生活在波罗的海东南岸的诸族群，虽然与斯拉夫人同源，但他们早在罗马帝国的时代便已分化。几个世纪以来，与诸德意志族群以及斯拉夫族群的接触，建立了一种独特的身份认同。不仅那些仍保留着原始宗教的波罗的语族群，甚至众多生活在那里的基督教德意志族群也被冠以“波罗的人”的称呼。\n\n波罗的文化组包括立陶宛人、拉脱维亚人、普鲁士人、库尔兰人和苏多维亚人，此外还有芬兰语族的爱沙尼亚人和利夫人，以及迁来此地的德意志人。13世纪，条顿骑士团和利沃尼亚骑士团征服了普鲁士人、利夫人和拉脱维亚人。\n\n信奉异教的立陶宛大公国顽强抵抗，约盖拉于1386年受洗，萨莫吉蒂亚直到1413年才改宗。1569年的卢布林联合使立陶宛与波兰合并，利沃尼亚在1558—1583年的战争中瓦解，1710年俄国从瑞典手中夺取了爱沙尼亚和利沃尼亚。"
 bantu_group_desc: "班图民族构成了撒哈拉以南非洲最大的语群。他们从喀麦隆—尼日利亚边境附近的故乡向外扩张，在三千年间将班图语言与农耕实践传播至中非、东非和南部非洲。如今，使用班图语言的民族遍及非洲大陆几乎整个南半部。\n\n大约在公元前4000年到公元500年间，班图人的农耕社群分两路南下：一路沿海岸和刚果河流抵达安哥拉中部，另一路向东到达维多利亚湖。他们同化或驱逐了沿途遇到的采集者，其中有俾格米人和科伊桑人。\n\n到1337年，这一扩散已催生出几个大国。大津巴布韦是南部非洲最大的石头城，13世纪起为都城；基卢瓦的苏丹势力远及斯瓦希里海岸；约从1390年起，刚果王国统治着刚果河下游。"
 barbakoan_group_desc: "$barbakoan_group$$group_text$$barbakoan_language$的民族构成。\n\n巴巴科安诸族包括哥伦比亚和厄瓜多尔的卡拉人、察奇拉人、阿瓦人和帕斯托人。帕斯托语和卡兰基语已经消亡，被西班牙语取代，阿瓦语仍在使用。"
 besiro_group_desc: "$besiro_group$$group_text$$besiro_language$的民族构成。\n\n奇基托人自称“蒙科什”，家园在玻利维亚东部的奇基塔尼亚草原。西班牙人称他们为“奇基托斯”，意为“小个子”。他们的语言可能属于马科‑热语系，主要方言有塔奥、皮尼奥科和马纳西。\n\n1559年圣克鲁斯‑德拉谢拉建城之后，他们务农，并抵抗西班牙人近两个世纪。1691年起，耶稣会在他们的地区设立传教区，奇基托语成为通用语，近五十个部落被同化，直到1767年耶稣会士被驱逐。"
 bohemian_group_desc: "波希米亚王冠领的土地上主要生活着各类斯拉夫人。然而，作为神圣罗马帝国内部最大的诸侯之一，他们不可避免地深深受到了德意志文化和传统的影响。除此以外，大量德意志移民来到波希米亚的土地上定居，进一步扩大了这种影响。\n\n波希米亚文化组包括捷克人、摩拉维亚人、西里西亚人和卢萨提亚的索布人。普热米斯尔家族的公爵在12世纪使波希米亚升格为王国；1337年统治它的是卢森堡家族的国王约翰。他的儿子查理四世于1348年把各王冠领地结合在一起，1356年的《金玺诏书》又使波希米亚国王成为神圣罗马帝国的选帝侯。\n\n1415年扬·胡斯被烧死后爆发了胡斯战争，1526年哈布斯堡家族继承了王位。1620年白山战役后，捷克贵族失去了地位；18世纪40年代，普鲁士夺取了西里西亚的大部分。"
 bora_huitoto_group_desc: "$bora_huitoto_group$$group_text$$bora_huitoto_language$的民族构成。\n\n乌伊托托人、博拉人及相关族群生活在亚马孙雨林中，分布在哥伦比亚西南部和秘鲁、巴西的邻近地区。他们的语言合称博拉‑维托托语系，分为博拉语支和维托托语支。"
 british_group_desc: "许多族群都将不列颠尼亚称为家园，凯尔特部落、罗马帝国、日耳曼人、爱尔兰和法兰西的移民潮不断冲击着这片土地，使这里的人口格局自有史以来经历了多重变迁。与欧洲大陆的物理隔绝将岛上的所有民族联系在一起。\n\n不列颠文化组包括英格兰人、威尔士人、苏格兰人、高地盖尔人和康沃尔人，以及迁居爱尔兰的英格兰人。岛上最早的主人是凯尔特的不列吞人，1世纪起这里成为罗马的不列颠尼亚行省。5世纪罗马统治结束后，盎格鲁‑撒克逊人的定居挤占了不列吞人在东部和南部的土地，来自爱尔兰的盖尔语人则迁入北方。\n\n1066年诺曼人征服英格兰，1283年爱德华一世攻取威尔士。苏格兰1314年在班诺克本获胜，1328年英格兰承认其独立。1337年，爱德华三世发动了对法国的百年战争。1707年，英格兰与苏格兰合并。"
 cacan_group_desc: "$cacan_group$$group_text$$cacan_language$的民族构成。\n\n阿根廷西北部和智利北部的迪亚吉塔人与卡尔恰基人说语属不明的卡坎语。迪亚吉塔之名据说出自卡坎语中表示“村中居民”的词。16世纪，他们分成许多支系，如卡尔恰基人、帕西奥卡人和基尔梅人，分布在卡塔马卡、拉里奥哈以及萨尔塔和圣胡安的部分地区。\n\n迪亚吉塔人从来不是统一的民族，而是各自为政的酋邦，方言也因谷地而异。印加人以战争夺取了他们的土地，使智利一侧的谷地人口大减。1536年4月，迭戈·德·阿尔马格罗的远征队抵达科皮亚波谷地。"
 caddoan_group_desc: "$caddoan_group$$group_text$$caddoan_language$的民族构成。\n\n卡多人的亲族有威奇托人和波尼人。卡多人生活在今得克萨斯东北部、路易斯安那西部、阿肯色西南部和俄克拉何马东南部，以农耕为生，在松林地区曾遭遇1276—1299年的大旱。\n\n约800年至1400年间，他们的祖先卡多密西西比文化修筑了大型的平顶土丘，用作神庙和贵族的居所。阿肯色河畔的斯皮罗土丘是美国最宏大的土丘之一，由卡多人和威奇托人的密西西比祖先所建。"
 calima_group_desc: "$calima_group$$group_text$$calima_language$的民族构成。\n\n卡利马文化属于哥伦比亚的考卡山谷。这片山谷先后由伊拉马、约托科、松索和马拉加纳等社会占据。\n\n伊拉马是最早的农耕与制陶社会，生活在卡利马河畔，其酋邦制度一直延续到西班牙人到来，居民种植木薯和豆类，纺织、冶金并捕鱼。800年至1600年的松索文化是其中最后的一支：人口增长，政权更趋集中，金器由金与铜混合铸成。"
 caribe_group_desc: "$caribe_group$$group_text$$cariban_language$的民族构成。\n\n加勒比诸族分布在南美洲北部，从亚马孙河口一直到哥伦比亚的安第斯山。其中大多是小族，如佩蒙人和尤克帕人。\n\n最著名的是小安的列斯群岛的卡利纳戈人，即岛加勒比人，他们可能与大陆上的加勒比人有亲缘。西班牙人到来时，他们是加勒比海的强势族群之一，占据向风群岛、多米尼克和瓜德罗普。他们以袭击邻近岛屿的战士著称。“加勒比”一名由哥伦布在1490年代记录，加勒比海即由此得名。"
 carpathian_group_desc: "喀尔巴阡山脉的嶙峋山脊长久塑造着居住于峰谷间人们的生活。与世隔绝的社群适应着变迁的疆界与帝国，培育出与土地紧密相连的韧性。山间隘口与高地堡垒既促进了贸易往来，也筑起了防御屏障。\n\n喀尔巴阡文化组在喀尔巴阡盆地及其周边包括马札尔人、斯洛伐克人、塞凯伊人、卢森尼亚人、瓦拉几亚人、摩尔多瓦人和特兰西瓦尼亚人，还有德意志移民和从草原西来的游牧民库曼人。马札尔人于9世纪晚期到来，建立了匈牙利王国。\n\n1237年蒙古入侵后，许多库曼人到匈牙利避难。14世纪，瓦拉几亚和摩尔达维亚在山脉以南和以东形成。1526年奥斯曼人在莫哈奇获胜，匈牙利被分裂，特兰西瓦尼亚成为独立的公国。哈布斯堡家族收复了匈牙利各地，1699年的《卡洛维茨和约》确认了这一结果。"
 caucasian_group_desc: "欧亚交汇之处的高加索是一片山峰林立、峡谷遍布的土地。其壮丽的风景为极度独立的民众提供了庇护，而其山口则吸引了帝国的野心……\n\n高加索诸民族生活在黑海与里海之间：南面有亚美尼亚人和格鲁吉亚人，北面山区有切尔克斯人、阿布哈兹人、纳赫人（车臣人）和阿瓦尔人。卡特维尔语系、西北高加索语系和东北高加索语系都是当地原生的语系，此外还有属于印欧语系的亚美尼亚语。山口不断引来波斯人、阿拉伯人和蒙古人。\n\n格鲁吉亚在11至13世纪的大卫四世和塔玛尔女王治下达到鼎盛，但蒙古人的宗主权、黑死病和帖木儿的入侵使它一蹶不振，到1466年王国分裂为几个互相对立的政权。1555年《阿马西亚和约》把这一地区划给奥斯曼帝国和萨法维波斯，俄罗斯则在1801年吞并了格鲁吉亚东部。"
 celtic_group_desc: "曾经，从伊比利亚到安纳托利亚的诸多族群都被统称为凯尔特人，如今，在经历几个世纪的入侵和定居后，凯尔特人被逼到了欧洲崎岖的边缘，蜷缩于大西洋沿岸严苛的一隅之地。\n\n凯尔特文化组包括爱尔兰人、布列塔尼人、威尔士人、苏格兰高地人、康沃尔人和诺斯‑盖尔人，也就是仍说凯尔特语言的族群。他们的祖先凯尔特人见于哈尔施塔特、拉登诺等铁器时代文化。\n\n爱德华一世于1283年征服威尔士；1337年，爱尔兰的盖尔领主仍在抵抗英格兰人的爱尔兰领主权。布列塔尼因自身的继承之争被卷入百年战争，1532年并入法国。都铎诸王在16世纪重新征服爱尔兰，高地氏族最后一次詹姆斯党人起事则于1746年在卡洛登被镇压。"
 central_african_group_desc: "中非民族居住于广阔刚果盆地及周边高地，使用阿达马瓦语、乌班吉语及相关语系的语言。他们的文化与所居的雨林、稀树草原和河流一样多样，从栖居森林的巴卡人到刚果大河支流上的河畔商人，不一而足。\n\n中非文化组包括阿达马瓦人、格巴亚人、阿赞德人、班达人、恩本迪人和萨拉人，乍得湖附近的巴吉尔米人，以及大西洋沿岸森林里的芳人和布鲁人，分别说乌班吉语、中苏丹语和班图语。他们的土地是乍得湖、乌班吉河和刚果盆地之间的稀树草原与森林。\n\n萨拉人保持着父系氏族，格巴亚人至少从16世纪起就生活在这一地区，来自洛巴耶河谷。乍得湖东南的巴吉尔米苏丹国于1522年在姆邦治下的马森亚建立，向博尔努纳贡，直到18世纪。18世纪上半叶，阿赞德人在文加拉氏族的征服中形成。"
 charrua_group_desc: "$charrua_group$$group_text$$charrua_language$的民族构成。\n\n查鲁亚人及其邻族格诺亚人和查纳人居住在今乌拉圭及阿根廷、巴西的相邻地区。他们是半游牧的狩猎采集者，随雨旱季节迁移。接触之前的情况，几乎全部来自西班牙人的记载。\n\n西班牙编年史家指控查鲁亚人在1515年杀死了沿拉普拉塔河上溯的胡安·迪亚斯·德索利斯。他们与查纳人一道抵抗西班牙侵略者。18至19世纪，牧牛业改变了他们的生活方式并造成饥荒，1831年乌拉圭军队又在萨尔西普埃德斯屠杀了大批查鲁亚人。"
 cherokee_group_desc: "$cherokee_group$$group_text$$cherokee_language$的民族构成。\n\n切罗基人（察拉吉人）说易洛魁语族的语言。18世纪以前，他们居住在今北卡罗来纳西南部、田纳西东南部、佐治亚北部及邻近各州的河谷城镇中，猎场远及肯塔基。传说他们在远古时从五大湖地区南迁，但后来的学者认为易洛魁语起源于阿巴拉契亚地区。\n\n切罗基一名见于1540年代赫尔南多·德索托远征的记载。切罗基人以农耕为生，住在永久性的城镇里；到19世纪，他们已经采用了许多欧裔美国人的做法，并创制了自己的文字。"
 chibchan_group_desc: "$chibchan_group$$group_text$$chibchan_language$的民族构成。\n\n奇布查语系分布在从中美洲东部到哥伦比亚北部的地区，得名于哥伦比亚高地的奇布查（穆伊斯卡）语。韦塔尔人和古纳人住在地峡一带，穆伊斯卡人则住在昆迪纳马卡和博亚卡的高原上。\n\n穆伊斯卡人并不是统一的国家，而是追随三位大首领：洪萨的“霍阿”、穆伊基塔的“西希普夸”，以及苏阿莫克斯的宗教首领“伊拉卡”。1530年代西班牙人入侵时，他们的土地上估计有一百万到三百多万人，此后被纳入新格拉纳达王国，许多习俗一直延续到19世纪初。"
 chicham_group_desc: "$chicham_group$$group_text$$chicham_language$的民族构成。\n\n奇查姆诸族居住在秘鲁北部和厄瓜多尔东部马拉尼翁河上游及其支流一带。舒阿尔人便是其中之一，“舒阿尔”意为“人”。他们以园圃耕作和用吹箭、涂有箭毒的飞镖狩猎为生，信奉关于灵魂和“阿鲁坦”之力的复杂精神观念，猎首袭击也是其文化的一部分。\n\n16世纪，他们的战士阻止了印加帝国向亚马孙盆地的扩张。他们还摧毁了西班牙征服者的定居点。"
 chickasaw_choctaw_group_desc: "$chickasaw_choctaw_group$$group_text$$chickasaw_choctaw_language$的民族构成。\n\n东南林地上的奇克索人和乔克托人说马斯科吉语，两族有亲缘关系，历史也多有交集。奇克索人占据密西西比北部、亚拉巴马西北部和北部、田纳西西部及肯塔基西南部，分为“伊莫萨克恰阿”和“因乔卡利帕”两个半族。乔克托人的中心在路易斯安那、密西西比和亚拉巴马，其名据说意为“河边的人”。\n\n1540年，赫尔南多·德索托的远征队遇到了奇克索人，将其记为“奇卡萨”。此后两族都与法国、英国和西班牙的殖民者打过交道。"
 chinese_group_desc: "千年来中华大地分分合合，但中国的概念却从未消失。这里的众多族群虽然语言和文化存在很大差异，但却拥有共同的中华认同，自视为中央王国的居民和看守者。\n\n中华文化组由汉人构成，按地区分成数十个文化，如长江下游的吴人，以及赣人、晋人和客家人。他们共用一套书面语言，并共同认同一个由皇帝统治的统一中国。\n\n忽必烈于1271年建立蒙古人统治的元朝，1279年灭亡南宋。1351年起的红巾军起义推翻了元朝的统治，朱元璋于1368年建立明朝。永乐帝定都北京，并派郑和远航海外。明朝在1644年亡于李自成的起义军和满洲人建立的清朝。"
 chitimacha_group_desc: "$chitimacha_group$$group_text$$chitimacha_language$的民族构成。\n\n奇蒂马查人居住在路易斯安那的阿查法拉亚盆地和泰什河湾一带，所说的语言是孤立语言。其名据信意为“住在大河边的人”，他们也自称“全体红色的人”。"
 chiwere_group_desc: "$chiwere_group$$group_text$$chiwere_language$的民族构成。\n\n奇维雷文化组包括说苏语族奇维雷语的艾奥瓦人、奥托人和密苏里亚人，以及与之关系密切的霍查克人。这三个奇维雷部族曾同属霍查克人，起源于五大湖地区。他们离开威斯康星南部的故土，迁到艾奥瓦东部（该州即以其中一族命名），后来又散布在中西部和平原各地。\n\n“奇维雷”意为“本地话”。传教士在1830年代首次记录了这种语言；1837年，艾奥瓦人被迁出艾奥瓦，安置到堪萨斯和内布拉斯加的保留地。"
 choco_group_desc: "$choco_group$$group_text$$choco_language$的民族构成。\n\n乔科诸族是恩贝拉人（旧文献中称乔科人或卡蒂奥人）和瓦乌纳纳人，他们的语言合成乔科语系，与中美洲和南美洲的其他语系没有已知的亲缘关系。其家园是哥伦比亚和巴拿马太平洋沿岸的雨林。\n\n18世纪晚期，在西班牙人的推动下，恩贝拉人开始从乔科地区迁入今巴拿马的达连。在那里，他们与古纳人发生冲突，把古纳人逼向加勒比海沿岸。"
 chokwe_group_desc: "安哥拉高原的乔奎民族以其卓越的艺术传统而闻名，尤其是其面具与木雕，并因在大西洋海岸与中非内陆之间的长途贸易网络中所扮演的角色而著称。他们原为卢恩达帝国的臣属，后在十九世纪急剧扩张，成为该地区的主导民族之一。\n\n乔奎人、姆本达人、卢瓦勒人和卢查齐人生活在今安哥拉高原及其同刚果、赞比亚交界一带。他们的首领有共同的祖先，可追溯到16世纪隆达人的迁徙；17至18世纪，乔奎人是隆达帝国的氏族之一。\n\n乔奎人起初为隆达贵族效力，后来因争端而脱离，其中包括拒绝向国王纳贡，他们的贸易使他们比邻族富裕。葡萄牙人直到19世纪30年代才同他们有了接触，当时乔奎人开始交易蜡、橡胶和象牙。"
 chono_group_desc: "$chono_group$$group_text$$chono_language$的民族构成。\n\n乔诺人（瓜伊特科人）是在智利南部奇洛埃、瓜伊特卡斯和乔诺斯群岛之间乘独木舟游动的狩猎采集者。他们被认为是奇洛埃岛上最早可以辨认的族群。一种说法认为，马普切人的几个群体在13世纪侵入奇洛埃，把他们向南逼退。\n\n1553年，弗朗西斯科·德乌略亚的远征队抵达其地，乔诺人第一次见到欧洲人。1608年腓力三世颁布法令之后，西班牙人从奇洛埃发动的袭击变成了抓捕奴隶的行动，而乔诺人并不像马普切人那样曾经起兵反抗。"
 chukotko_kamchatkan_group_desc: "$chukotko_kamchatkan_group$$group_text$$chukotko_kamchatkan_language$的民族构成。\n\n楚科奇‑堪察加诸族是西伯利亚东北端和堪察加的楚科奇人、科里亚克人、阿柳托尔人、克列克人和伊捷尔缅人，传统上以渔猎采集和饲养驯鹿为生。楚科奇人分为沿海的海岸楚科奇人和内陆的驯鹿楚科奇人：前者有定居的家园，猎捕海兽；后者随驯鹿群在内陆苔原迁徙。他们几乎没有正式的统治者。\n\n伊捷尔缅人主要沿堪察加河居住，每个村子有几百人，围绕一个父系家户而建。17世纪俄国哥萨克到来之后，他们的村落不断缩小，到1744年格奥尔格·施特勒描述他们时，许多村子只剩四五十人。"
 chumashan_group_desc: "$chumashan_group$$group_text$$chumashan_language$的民族构成。\n\n丘马什人生活在加利福尼亚中部和南部海岸，地域从莫罗湾延伸到马里布，并包括海峡群岛北部诸岛。他们分属150多个互不统属的村落，说同一种语言的各个变体，以制作贝珠闻名。圣巴巴拉海峡物产丰富，供养的村落与远至亚利桑那的民族进行贸易。\n\n1542年胡安·卡布里略与沿海村落接触，但西班牙人到1769年才开始定居。1772至1817年间，大多数丘马什人进入方济各会传教站，先从圣路易斯奥比斯波开始，疾病和传教站的生活使人口锐减。1824年的丘马什起义始于圣伊内斯传教站。"
 ckunsa_group_desc: "$ckunsa_group$$group_text$$ckunsa_language$的民族构成。\n\n昆萨语是智利北部阿塔卡马盐沼一带阿塔卡马人的语言，属于没有已证实亲属的孤立语言。阿塔卡马人牧养美洲驼，耕种梯田，并建有基托尔等石砌堡寨。本组的邻近成员是玻利维亚南部的希沙人和乌马瓦卡峡谷的奥马瓦卡人。\n\n15世纪印加人占领该地，并把希沙人作为移民迁往洛阿河谷。1536年迭戈·德·阿尔马格罗的远征队进入此地，1557年西班牙吞并了阿塔卡马。"
 coahuilteco_group_desc: "$coahuilteco_group$$group_text$$coahuilteco_language$的民族构成。\n\n科阿韦尔特科人是墨西哥东北部和得克萨斯南部干旱灌木地带的小型狩猎采集群，分布在格兰德河两岸。名称来自科阿韦拉，西班牙人最初就是在那里遇见他们的。他们说多种语言，包括帕卡瓦语、科梅克鲁多语和科托纳梅语，多数语言学家怀疑它们是否同源；没有哪个群体形成了比亲族更大的政治单位。\n\n1580年起，来自新莱昂的奴隶掠夺者沿格兰德河抓捕俘虏。1718年西班牙人建立了圣安东尼奥德巴莱罗传教站，即阿拉莫，随后又建了四座传教站，科阿韦尔特科人为躲避阿帕奇人和科曼奇人的袭击，前来寻求庇护。"
 confucian_group_desc: "受儒家思想和道德观直接或间接影响的众多文化的集合。\n\n儒家文化圈包括中华各地区文化，以及日本人、朝鲜人和越南人。中华帝国的朝贡关系把儒家思想、道教和佛教传给了周边邻国。文言成为他们共同的公文语言，汉字则被日本、朝鲜和越南借用并加以改造。\n\n随后各自的文字出现：日本的假名、越南的喃字，以及1446年颁行的朝鲜谚文。1392年建立的朝鲜王朝以朱子学为国家正统思想。仿照中国的科举制度，则塑造了朝鲜和越南的官僚体系与社会秩序。"
 cree_group_desc: "$cree_group$$group_text$$cree_language$的民族构成。\n\n克里族群包括克里人、因努人、纳斯卡皮人和阿提卡梅克人，他们是加拿大东部和中部北方林地里说阿尔衮琴语的民族。他们说一串彼此相近的方言，自称多是“人”或“男人”之意，如nehiyaw和innu。各个群体互不统属，却常联合邻人对付外敌。\n\n皮毛贸易带来了欧洲人：1668年詹姆斯湾边建起查尔斯堡，1682年哈德逊湾公司的一队人在纳尔逊河边遇到克里人。许多克里人靠公司的枪支迁往大平原，成为商人和野牛猎手，并与阿西尼博因人结盟。在纽芬兰，贝奥图克人于1829年被宣布灭绝。"
 cuicas_group_desc: "$cuicas_group$$group_text$$cuicas_language$的民族构成。\n\n奎卡斯人是委内瑞拉西部安第斯山区提莫托—奎卡人的两大主要部落之一，居住在今特鲁希略、梅里达和塔奇拉一带。他们与说奇布查语的哥伦比亚安第斯穆伊斯卡人关系密切，住地略在提莫特亲族的北面。\n\n16世纪西班牙人征服以前，他们住在永久村落里，房屋用石头和木头建成，屋顶覆茅草，四周是种着土豆、玉米和豆类的灌溉梯田。他们用水池储水，纺织植物纤维，制作人形陶器，却没有留下宏大的建筑。他们交易棉花、可可和盐，大体是和平的农耕者。"
 cuitlatec_group_desc: "$cuitlatec_group$$group_text$$cuitlatec_language$的民族构成。\n\n奎特拉特克人居住在今格雷罗州的太平洋一侧，沿巴尔萨斯河和大海岸地区分布，纳瓦人称这片土地为奎特拉特卡潘。他们的语言是孤立语言，自称aʔnelgái。\n\n后古典期晚期，沿海的主要城镇是梅斯卡尔特佩克，是一个政体的中心，阿卡普尔科是其属镇之一。巴尔萨斯河一带的聚落被普雷佩查人征服，其余多数被阿兹特克人征服，并随阿兹特克人出征。他们种植玉米、棉花和可可，崇拜太阳和月亮。1521年西班牙人到来后，人口迅速减少，但他们抵抗了六十多年。"
 culli_group_desc: "$culli_group$$group_text$$culli_language$的民族构成。\n\n库利语是秘鲁北部高地一种资料很少的安第斯语言，现已消亡，通行于拉利伯塔德、卡哈马卡南部和安卡什北部，覆盖至少三个印加之前的领地：孔楚科斯、瓦马丘科，以及部分的奎斯曼科。\n\n瓦马丘科领主国以马尔卡瓦马丘科为中心，崇拜雷神卡特基尔，他同时是一位神谕之神。1470年前后印加人吞并该地，把瓦马丘科设为一个省的治所，并迁入称为米特马克的移民。库利语让位于西班牙语，主要留存在地名中，直到20世纪还有人在帕利亚斯卡说它。"
 cushitic_group_desc: "非洲之角与尼罗河谷的库希特民族使用亚非语系库希特语支的语言。他们包括索马里与欧加登的骆驼游牧民、埃塞俄比亚裂谷的高地农民，以及红海沿岸的古代贝贾人。\n\n库希特文化组包括低地的索马里和阿法尔牧民，埃塞俄比亚的奥罗莫人、锡达莫人和阿高人，以及东部沙漠的贝贾游牧民，他们说的语言都属亚非语系。10世纪时贝贾人信奉基督教，后来阿拉伯移民把伊斯兰教带给了他们。\n\n约从1415年起，阿达尔苏丹国统治哈勒尔、泽拉和柏培拉，同信奉基督教的埃塞俄比亚皇帝作战，1529—1543年的战争使双方筋疲力尽。此后奥罗莫人在任期八年的盖达制度治理下，从楚贝哈赫湖和查莫湖一带北上。"
 dakota_group_desc: "$dakota_group$$group_text$$dakota_language$的民族构成。\n\n达科他族群指苏人，他们自称“奥切蒂沙科温”，即七火会议，说彼此相近的达科他、拉科塔和纳科达方言，这个名称意为朋友或盟友。其中有东部达科他人，也称桑蒂人，有扬克顿人和扬克顿奈人，还有西面的拉科塔人。17世纪以前，桑蒂人生活在苏必利尔湖周围，采集野生稻米，驾独木舟捕鱼。\n\n在18世纪的战争中，持有法国和英国火枪的奥吉布瓦人把达科他人向南、向西逼入明尼苏达南部和草原。同一世纪，马匹使拉科塔人成为北部大平原上的强大民族。"
 dhegiha_group_desc: "$dhegiha_group$$group_text$$dhegiha_language$的民族构成。\n\n德吉哈诸族是说苏语族语言的奥色治人、堪萨人、奥马哈人、庞卡人和夸保人。他们共有的迁徙传说把他们放在俄亥俄河与田纳西河汇流处附近，随后西迁，趋向密苏里河，并分成各自的群体；但也有传统和考古证据表明，他们更早就已离开。\n\n奥色治人定居在密苏里的奥色治河畔，1690年已有马匹。1673年马凯特和若利埃遇见了他们，18世纪20年代法国人在他们的土地上建起密苏里河畔的奥尔良堡。19世纪初，奥色治人称雄于密苏里河与红河之间的地区，但1801至1802年的天花使多达两千人死亡。"
 dravidian_group_desc: "$dravidian_group$人聚集于印度南部三分之一的区域，是$indo_aryan_group$人入侵前次大陆原住民的后裔。尽管入侵者的文化最终渗透到$dravidian_group$社会，他们仍保持着强烈的区域认同特征。\n\n达罗毗荼文化组包括泰卢固人、泰米尔人、卡纳达人和马拉雅拉姆人，以及贡德人、图卢人和科达瓦人等较小的族群，还有远在西北俾路支的布拉灰人。原始达罗毗荼语或可追溯到公元前3千纪，达罗毗荼诸语言与北方的印度‑雅利安语言始终有别。\n\n14世纪初，德里苏丹国的劫掠冲击了南方。哈里哈拉一世和布卡一世兄弟于1336年建立毗奢耶那伽罗帝国，该国在奎师那提婆罗耶（1509—1529年在位）治下称雄半岛。继承1347年巴赫曼尼苏丹国的德干诸苏丹国于1565年在塔利科特击败了它，其领土由纳亚克诸侯接手。"
 east_african_coast_group_desc: "斯瓦希里海岸的僧祇民族在东非印度洋沿岸发展出了独特的海洋文明，将班图农业传统与阿拉伯和波斯商人的商业文化融为一体。从摩加迪沙到基卢瓦，他们的珊瑚石城邦构成了印度洋贸易网络的非洲终点站。\n\n僧祇文化组还包括邻近的马夸人和亚奥人。中世纪的作者称这段海岸为僧祇，沿岸的商业城镇一直南达索法拉，靠用阿拉伯和印度的布匹、香料换取内陆的黄金和象牙为生。\n\n12世纪，基卢瓦从摩加迪沙手中夺得索法拉，并在马赫达利王朝治下建起胡斯尼库布拉宫。15世纪，基卢瓦的苏丹宣称对从马林迪到索法拉的各城拥有宗主权。1502年，瓦斯科·达伽马的舰队迫使基卢瓦向葡萄牙纳贡。"
 east_african_nomad_group_desc: "东非的游牧族群遍布从埃塞俄比亚高原到坦桑尼亚干草原的广阔稀树草原与半干旱平原，在季节性牧场之间放牧牛群、骆驼与山羊。他们通过年龄组战士制度组织起来，没有永久性的领土国家，形成了一个跨越尼罗、库希特及其他语系的跨语言文化世界。\n\n东非游牧族群文化组包括索马里人、阿法尔人、奥罗莫人、图尔卡纳人、马赛人和卡伦津人。“索马里”一名常被解释为“去挤奶”。图尔卡纳人养骆驼和瘤牛。13世纪的记载里已有阿法尔人，称丹卡尔人。\n\n马赛人来自南苏丹，从库希特语邻族那里学到了年龄组制度和割礼，他们的战士以劫掠闻名。奥罗莫人由盖达制治理，领袖任期八年，约1530年起从埃塞俄比亚南部发动了大规模扩张。"
 eastern_otomanguean_group_desc: "$eastern_otomanguean_group$$group_text$$eastern_otomanguean_language$的民族构成。\n\n东欧托曼格族群包括米斯特克人、萨波特克人、波波洛卡人和阿穆斯戈人，他们是墨西哥南部的民族，说的声调语言同属奥托—曼格语系，那是中美洲内部差异最大的语系。米斯特克人称自己的土地为纽萨维，他们在瓦哈卡高地建有蒂兰通戈王国；萨波特克人据有蒙特阿尔班和萨阿奇拉周围的河谷。波波洛卡语通行于普埃布拉的特瓦坎附近。\n\n1458年阿兹特克人击败米斯特克人，与萨波特克人的最后一场战争于1497至1502年在吉恩戈拉结束。1521年两个民族都向科尔特斯臣服，此后瘟疫肆虐了这一地区。"
 ethiopian_group_desc: "古老的阿克苏姆王国使埃塞俄比亚人通过埃及与地中海世界建立了联系，进而和希腊和罗马帝国有了贸易往来，同时也带来了基督教。然而，伊斯兰教崛起后，埃塞俄比亚与地中海的联系被切断了，作为仅存的基督教闪米特族群产生了一定程度上的孤立。这创造了一种无视文化差异的共同传承。\n\n埃塞俄比亚文化组包括埃塞俄比亚高原的阿姆哈拉人、提格利尼亚人、古拉盖人和提格雷人，还有东部的哈尔拉人和埃塞俄比亚的犹太人贝塔以色列。1270年，耶库诺·阿姆拉克推翻扎格维王朝，建立所罗门王朝，自称是所罗门王与示巴女王的后裔。\n\n阿姆达·锡永一世（1314—1344年在位）和达维特一世使帝国称雄非洲之角。扎拉·雅各布（1434—1468年在位）则兴建教堂和修道院，并强化了皇权的集中。"
 finnic_group_desc: "芬兰族群生活中芬兰湾两侧。虽然他们保持着强大的身份认同，但却面临着斯堪的纳维亚和德意志人的双重入侵威胁。\n\n芬兰文化组包括芬兰人、爱沙尼亚人、卡累利阿人、利夫人、韦普斯人、英格里亚人和瓦佳人。他们的语言被认为源自伏尔加河流域，各族后来向西扩散到俄罗斯西北部和波罗的海沿岸。\n\n芬兰诸族的土地夹在瑞典、诺夫哥罗德和德意志十字军骑士团之间。1323年，瑞典与诺夫哥罗德通过《诺特堡条约》瓜分了卡累利阿。爱沙尼亚人于1343年起兵反抗德意志骑士和丹麦人，1558年的利沃尼亚战争则摧毁了骑士团国家。瑞典在1617年取得英格里亚，俄国在大北方战争中夺取了爱沙尼亚、利沃尼亚和英格里亚，并于1809年夺取芬兰。"
 french_group_desc: "法兰西民族起源于西罗马帝国灭亡后占领该地的日耳曼法兰克人，随着时间的推移，法兰西王国逐渐融合了王国内的其他族群。尽管在习俗和语言上存在差异，但这些族群共同形成了法兰西人的身份认同。\n\n法兰西文化组涵盖从巴黎的法兰西人和北方的诺曼人、皮卡第人，到南方的加斯科涅人、普罗旺斯人和朗格多克人，还有勃艮第人、布列塔尼人和瓦隆人。卡佩诸王逐步吸纳了各有方言的地区。\n\n1337年，英格兰的爱德华三世与腓力六世为阿基坦发生冲突，开启了百年战争，战争于1453年结束，英格兰只剩下加来。布列塔尼于1532年并入王室领地，1539年的《维莱科特雷法令》使法语成为法律用语。此后是1562—1598年的宗教战争。"
 german_group_desc: "作为一个历史渊源可追溯至古老部落时代的民族，日耳曼人最初以罗马帝国时敌时友的蛮族身份登上历史舞台。数百年后，查理曼帝国与封建制度的兴起重塑了德意志民族的认同，这一进程最终在神圣罗马帝国的建立中达到顶峰。\n\n德意志文化组汇集了神圣罗马帝国德意志地区的诸民族，按方言和地区区分：巴伐利亚人、法兰克尼亚人、萨克森人、施瓦本人、阿勒曼尼人、波美拉尼亚人和弗里斯兰人。奥托一世于962年加冕，使法兰克帝国东部的德意志王国成为神圣罗马帝国。\n\n1337年帝国由巴伐利亚的路易四世统治，1356年的《金玺诏书》规定由七位选帝侯选举国王。北方城市组成的汉萨同盟主导着波罗的海贸易。1517年起路德的宗教改革使德意志因信仰而分裂，三十年战争于1648年以《威斯特伐利亚和约》结束。普鲁士从1701年起成为王国，拿破仑则在1806年终结了帝国。"
 great_lakes_kingdoms_group_desc: "非洲大湖地区的民族发展出了撒哈拉以南非洲最复杂的一些国家结构，建立起以牛的财富和世袭王权为中心的等级制王国。从维多利亚湖北岸的布干达王国到卢旺达的梯田丘陵，这些湖间社会拥有共同的贡品、宫廷和氏族组织等政治文化。\n\n大湖诸国文化组包括东非湖区的卢旺达人、巴干达人、哈亚人和希人，以及再往西稀树草原上的卢巴人、隆达人和库巴人。特瓦猎人曾居住在卢旺达高地，养牛的图西人在15至16世纪迁入；那里的一个小酋邦逐渐发展成中央集权的卢旺达王国。\n\n布干达的卡巴卡世系追溯到13世纪末的加托·金图。布尼奥罗‑基塔拉由鲁基迪在16世纪晚期建立，此前的基塔拉帝国已经解体，它一度是该地区最强大的国家。在西部，卢巴诸酋邦约1500年合并为一个王国，为隆达人所仿效。"
 greek_group_desc: "民主和哲学的先驱——拉丁人和希腊人以其恒久的文化和知识遗产塑造了西方文明。从史诗到古典建筑，他们的贡献贯穿了千年。\n\n罗马文化组汇集了东地中海和黑海沿岸说希腊语的诸民族：希腊人、黑海南岸的本都希腊人，以及意大利南部的格里科人。在拜占庭帝国，他们自称罗马人，是罗马国家的继承者。\n\n1337年，安德洛尼卡三世在君士坦丁堡统治着一个缩小了的帝国。本都希腊人生活在特拉布宗的科穆宁皇帝治下，该政权存续到1461年。君士坦丁堡于1453年落入奥斯曼苏丹穆罕默德二世之手，摩里亚在1460年陷落。在奥斯曼统治下，东正教会领导着希腊人社群，直到1821年独立战争爆发。"
 guahibo_group_desc: "$guahibo_group$$group_text$$guahibo_language$的民族构成。\n\n瓜希沃人也自称西夸尼人，是哥伦比亚东部和委内瑞拉南部草原平原（亚诺斯）上的原住民，说与奎瓦人相近的瓜希沃语族语言。18世纪后期起，哥伦比亚和委内瑞拉的殖民者不时袭击他们。"
 haida_group_desc: "$haida_group$$group_text$$haida_language$的民族构成。\n\n海达人的家园是不列颠哥伦比亚海岸外的海达瓜伊群岛和阿拉斯加威尔士亲王岛的南半部。他们的语言是孤立语言。他们擅长雕刻红雪松，精于航海和贸易。18世纪初，海达瓜伊南部的海达人北渡，在特林吉特人旁边定居，成为凯加尼海达人。\n\n1774年胡安·佩雷斯的船遇到了海达人的独木舟。1787年乔治·迪克森与他们开启了海獭皮贸易，此后几十年里海达人一直处于对华海獭皮贸易的中心。1780至1830年间，他们与商人发生冲突，夺取过“埃莉诺”号和“苏珊·斯特吉斯”号等船只。"
 haudenosaunee_group_desc: "霍迪诺肖尼人是一系列多元族群构成的群体，他们的团结不仅源于语言上的相似性，更根植于共同的社群意识、协作精神与核心信仰。这些共同观念深刻体现在这些族群丰富多样的组织方式之中。\n\n霍迪诺肖尼人自称“建造长屋的人”，又称易洛魁人，居住在今纽约州一带。他们的联盟由莫霍克、奥奈达、奥农达加、卡尤加和塞内卡组成，口述传统说，伟大的和平缔造者、海华沙和吉贡萨西依据《和平大法》把它们联合起来。具体年代尚有争议。\n\n凭借皮毛贸易得来的火枪，联盟在海狸战争中驱散或吸收了邻近的民族，1700年前后其势力从五大湖下游伸展到俄亥俄河谷。1722年之后，塔斯卡罗拉人加入，五族联盟成为六族。美国独立战争中联盟分裂，1779年的沙利文远征摧毁了它的城镇。"
 henia_kamiare_group_desc: "$henia_kamiare_group$$group_text$$henia_kamiare_language$的民族构成。\n\n赫尼亚人和卡米亚雷人是西班牙人统称为科梅钦贡人的两个民族，居住在今阿根廷科尔多瓦和圣路易斯的潘帕斯山脉一带。这里的猎人早在约三千年前就开始食用玉米，在前西班牙时代晚期，他们住在由半地穴式坑屋构成的村落里。\n\n1529年起，西班牙人的远征队陆续到来，其中有1543至1546年迭戈·德·罗哈斯的远征。1573年赫罗尼莫·路易斯·德·卡夫雷拉建立科尔多瓦，那个山谷里的原住民被迁往别处。委托监护制的劳役和外来者的安置使他们的社群瓦解，到17世纪末，只有基利诺、索托等六个原住民村落仍保有自己的土地。"
 hibernian_group_desc: "尽管翡翠绿岛最初由盖尔人定居，但随着征服与殖民，来自不列颠和欧洲大陆的新移民逐渐融入这片土地。甚至于那些拥有异国血统的后代，也可能感受到爱尔兰的深切召唤，从而产生强烈的归属感。\n\n希伯尼亚文化组得名于罗马人对爱尔兰岛的称呼希伯尼亚，包括盖尔爱尔兰人，以及英格兰移民后裔盎格鲁‑爱尔兰人。1169年盎格鲁‑诺曼人入侵之后，英格兰王室主张拥有爱尔兰领主权，诺曼家族在东部和南部定居。\n\n黑死病之后，盖尔领主收复了一些失地，1366年的《基尔肯尼法令》试图阻止英格兰移民采用爱尔兰习俗。亨利八世于1541年使爱尔兰成为王国。九年战争以失败告终，盖尔伯爵们于1607年出走，阿尔斯特迁入了新教移民。克伦威尔的军队在1649—1653年重新征服全岛，威廉三世1690年在博因河的胜利则确立了新教的统治。"
 hinonoeitiit_group_desc: "$hinonoeitiit_group$$group_text$$hinonoeitiit_language$的民族构成。\n\n希诺诺埃族群包括阿拉帕霍本支、南方人，以及被法国人称为格罗斯文特的汉尼宁人，都是阿尔衮琴语系民族。他们的祖先在红河谷（今马尼托巴和明尼苏达）种植玉米。在持有法国枪支的奥吉布瓦人的逼迫下，他们西迁，1700年以前已在北部大平原活动。\n\n18世纪初，他们获得马匹，成为游牧的野牛猎手和出色的骑手。1811年前后阿拉帕霍人与夏延人结盟，扩大了狩猎地盘；到1826年，他们和盟友把基奥瓦人与科曼奇人赶向南方。"
 hmong_mien_group_desc: "苗瑶民族主要居住在中国南方及东南亚的高地，其语言属于独立的苗瑶语系，与周边民族的语言均无亲属关系。他们以精湛的纺织工艺和鲜明的独立精神著称，在历史上长期抵制周边低地政权的文化同化。\n\n苗瑶族群由苗人（Hmong）与瑶人（Mien）构成，他们说的语言有声调。南宋周去非曾记载瑶人身穿用靛蓝染成的精细青布衣服。\n\n明清官吏取代瑶人首领，直接收税。瑶人和苗人在1370年代和1449年先后起兵反明，战事把瑶人逼进更深的山区。18世纪清朝治下，与汉人移民的冲突加剧；从17世纪后期起，一些苗人开始迁入东南亚。"
 hokan_group_desc: "$hokan_group$$group_text$$hokan_language$的民族构成。\n\n霍坎族群汇集了加利福尼亚、亚利桑那和下加利福尼亚的一些民族，罗兰·迪克森和阿尔弗雷德·克罗伯等语言学家提出这些民族的语言彼此相关；霍坎假说有的版本还把洪都拉斯的语言包括进来，仍有争议。其中有波莫人、卡鲁克人、沙斯塔人、亚瓦派人、瓦拉佩人、库梅亚伊人、科奇米人和塞里人。\n\n盐河与希拉河流域的霍霍坎人在800至1400年间修建灌溉渠网。在下加利福尼亚，耶稣会士于1697年在科奇米人中建立了洛雷托。1769年西班牙人在库梅亚伊人的土地上建起圣迭戈德阿尔卡拉传教站，库梅亚伊人的村落后来将它焚毁。索诺拉的塞里人则抗拒西班牙人的统治。"
 hungarian_group_desc: "马扎尔人，或匈牙利人，是起源于南乌拉尔地区的族群，在匈人、阿瓦尔人、保加尔人和突厥人等其他草原民族的推动河影响下逐渐西迁，最终于阿瓦尔汗国覆灭后在喀尔巴阡盆地定居。这使他们与其欧洲邻国截然不同，而这种差异只会塑造他们的凝聚感。\n\n马扎尔文化组汇集了匈牙利人和特兰西瓦尼亚东部的塞凯伊人。他们的语言属于乌拉尔语系的乌戈尔语支，与汉特语和曼西语同类。首任国王圣伊什特万一世于1000年前后加冕，他的阿尔帕德王朝统治了三个世纪。\n\n阿尔帕德王朝于1301年绝嗣，随后的安茹诸王使匈牙利成为一方强国。1526年莫哈奇战败后，王国分裂为哈布斯堡的王室匈牙利、奥斯曼的匈牙利和半独立的特兰西瓦尼亚公国。哈布斯堡家族的国王保有王位，匈牙利人在1604—1606年、1664—1671年和1703—1711年先后起兵反抗。"
 iberian_group_desc: "伊比利亚半岛，一片充满鲜明对比和丰富历史的土地，孕育了多元的民族群体。从古老的凯尔特人、伊比利亚人和巴斯克人，到后来的腓尼基人、罗马人、西哥特人和摩尔人，这片土地经历了多种文明的浸润。他们在此交融，形成了基督教、穆斯林和犹太人文化共生的独特风貌。从南方生机勃勃的宫廷文化，到北方无畏的骑士精神，伊比利亚的各民族共同编织出一幅传统与抱负交织的画卷。\n\n伊比利亚文化组汇集了伊比利亚半岛的各族：卡斯蒂利亚人、葡萄牙人、阿斯图里亚斯‑莱昂人、加泰罗尼亚人、阿拉贡人、加利西亚人和巴斯克人，以及安达卢斯的穆斯林和塞法迪犹太人。711年穆斯林征服结束了西哥特人的统治，北方的基督教王国由此开始了收复失地运动。\n\n1337年，只有格拉纳达仍属穆斯林。卡斯蒂利亚与阿拉贡因天主教双王的联姻而联合，双王于1492年攻取格拉纳达，同年驱逐犹太人。葡萄牙派船队绕过非洲，卡斯蒂利亚则派哥伦布向西航行。1580年起两国王冠合于腓力二世之下，直到1640年葡萄牙脱离，波旁家族则在西班牙王位继承战争后继承了西班牙。"
 indian_group_desc: "“印度人”这一称谓涵盖了印度次大陆上多元而丰富的文化群体。虽然各民族文化独具特色，语言体系也千差万别，但共同的地理环境与天然的四方疆界所形成的独特隔离，为这些文化编织出了共同的历史脉络。\n\n印度文化组汇集了次大陆的众多民族：北方和西部的孟加拉人、旁遮普人、马拉地人、古吉拉特人和信德人，南方的泰卢固人、泰米尔人、卡纳达人和马拉雅拉姆人，以及贡德人和比尔人等山林民族。1337年，穆罕默德·宾·图格鲁克统治着1206年建立的德里苏丹国，而毗奢耶那伽罗帝国已于1336年在南方兴起。\n\n帖木儿于1398年洗劫德里。1526年巴布尔在帕尼帕特获胜，开创了莫卧儿帝国，阿克巴使之扩张，马拉塔人后来起兵反抗。英国东印度公司于1757年在普拉西取得孟加拉。"
 indo_aryan_group_desc: "作为入侵印度次大陆的印欧语系族群后裔，这些民族成为北部地区的主导人口。他们的定居塑造了早期吠陀文化，并为众多语言与帝国的形成奠定了基础。\n\n印度‑雅利安文化组汇集了印度北部和斯里兰卡说印度‑雅利安语的诸族：孟加拉人、旁遮普人、马拉地人、古吉拉特人、信德人、奥里亚人，拉贾斯坦的马尔瓦尔人和梅瓦尔人，阿瓦德人、博杰普尔人等印地语地区的人群，以及僧伽罗人。他们的语言是随从中亚迁入次大陆北部的人群而来的，吠陀人便是其中之一。\n\n1206年德里苏丹国建立后，使用波斯语的苏丹们统治了北方大部，孟加拉和古吉拉特后来又建立了各自的苏丹国。梅瓦尔等拉其普特邦国一直抵抗德里。莫卧儿人从1526年起占据北方，旁遮普则在1799年兴起了兰吉特·辛格的锡克国家。斯里兰卡的僧伽罗人王国康提存续到1815年。"
 inuit_group_desc: "$inuit_group$$group_text$$inuit_language$的民族构成。\n\n因纽特族群指图勒人的后裔，即说爱斯基摩—阿留申语系语言的北极猎人。图勒人1000年前已在阿拉斯加沿海形成，并向东扩展到加拿大北部，1100年抵达格陵兰西部。他们取代了更早的多尔塞特文化；因纽特人的传说把多尔塞特人记作图尼特人，说他们是强壮却胆小、容易被赶走的巨人。多尔塞特人最迟在1500年已经消亡。\n\n诺尔斯移民把这些新来者称为斯克雷林人。18世纪与欧洲人的接触加深，而始于1650年前后的小冰期使图勒人的社群瓦解，分化成后来所称的因纽特人和育皮克人。"
 iranian_group_desc: "伊朗文化源远流长，起源复杂多样。波斯地区的伊朗人是西伊朗民族的后代，他们的祖先曾建立过统治中东的阿契美尼德王朝和萨珊王朝等帝国。穆斯林征服波斯之后，伊斯兰教逐渐融入伊朗文化的肌理，成为伊朗文化中的重要支柱。\n\n伊朗文化组汇集了伊朗高原及其周边说伊朗语的诸民族：波斯人、阿富汗人、俾路支人、库尔德人、塔吉克人、卢尔人，以及里海沿岸的各族。1337年，蒙古伊儿汗国崩溃后波斯陷入分裂，帖木儿自1380年起征服了这里。\n\n伊斯玛仪一世于1501年建立萨法维王朝，并以十二伊玛目什叶派为国教，使波斯与逊尼派邻国分隔开来。纳迪尔沙在1736年崛起，他于1747年死后，东部出现了阿富汗的杜兰尼帝国。恺加王朝于1796年夺取波斯王位。"
 iroquoian_group_desc: "$iroquoian_group$$group_text$$iroquoian_language$的民族构成。\n\n易洛魁族群汇集了豪德诺索尼联盟以外、说易洛魁语的北方诸民族：圣劳伦斯易洛魁人、中立人和温罗人。1535至1536年，雅克·卡蒂埃在斯塔达科纳和霍切拉加两个村落遇到了第一种人，但到16世纪晚期，他们已从河谷中消失。中立人则住在伊利湖北岸，从尼亚加拉半岛到底特律河分布着几十个村落。\n\n在海狸战争中，豪德诺索尼人靠荷兰人供应的火器于1649年摧毁了温达克，1651年又打散了中立人。幸存者包括温罗难民，与其他易洛魁民族融合，怀恩多特人就由这样的融合而来。"
 italian_group_desc: "意大利半岛不仅是由众多王国与城邦构成的多彩拼图，更是文化和影响力的熔炉。从古罗马人到拜占庭人、伦巴第人以及诺曼人，不同民族都在这片土地上留下了深刻的烙印。意大利的各个城邦为了权力和声望进行了激烈的竞争，这不仅催生了繁荣的文化艺术创作，也孕育了慷慨的赞助传统。\n\n意大利文化组汇集了意大利半岛及其岛屿的各族：那不勒斯人、西西里人、威尼斯人、伦巴第人、托斯卡纳人、皮埃蒙特人、利古里亚人、弗留利人和撒丁人。1337年，半岛分属教皇国、那不勒斯王国以及威尼斯、热那亚和佛罗伦萨等共和国。\n\n黑死病于1348年袭来，美第奇家族使佛罗伦萨成为文艺复兴艺术的中心。1454年的《洛迪和约》带来了一段均势，直到1494年法国入侵开启意大利战争；战争于1559年结束，西班牙在南部和米兰占据主导。1796年拿破仑的军队进入意大利，扫除了旧日的共和国。"
 japanese_group_desc: "根据日本自身的历史记载，自天照大神的神话和初代神武天皇的时代开始，大和民族便世世代代居住在日本列岛。数百年相对孤立的隔绝状态，以及与朝鲜半岛、中华大陆间歇性的交流，共同塑造了日本文明的独特风貌——其语言体系和本土信仰与大陆文明有着显著的差异。尽管内部仍存在多种具有地方特色的文化，但日本民族还是形成了共同而独特的身份认同。\n\n日本文化组汇集了日本列岛的诸族，按地区分为西部的西国人、东部的东国人、北部的东北人和西南的九州人。中国和朝鲜长期为日本人提供文字、佛教和儒家思想。\n\n1336年，足利尊氏在京都建立室町幕府，南北两个朝廷并立交战，直到1392年。1467年的应仁之乱开启了一个世纪的大名混战。织田信长和丰臣秀吉于1590年重新统一全国，德川家康则于1603年在江户建立幕府，幕府后来对绝大多数对外往来关闭了国门。"
 jewish_group_desc: "$jewish_group$人指的是信奉$jewish_group$教的不同种族的宗教群体。\n\n犹太文化组包括西班牙和葡萄牙的塞法迪犹太人，德意志和东欧的阿什肯纳兹犹太人，意大利犹太人和罗曼尼奥特犹太人，也门的也门犹太人，埃塞俄比亚的贝塔以色列，以及波斯、格鲁吉亚、印度和中国开封的社群。各社群保持着自己的礼仪和语言。\n\n1348年黑死病期间，莱茵兰各地发生了屠杀犹太人的事件。英格兰于1290年驱逐了本国犹太人，法国于1394年如此，西班牙则于1492年驱逐了不肯改宗的犹太人。许多塞法迪犹太人在奥斯曼帝国找到庇护。在波兰和立陶宛，阿什肯纳兹犹太人组成了欧洲最大的犹太社群。"
 jirajaran_group_desc: "$jirajaran_group$$group_text$$jirajaran_language$的民族构成。\n\n希拉哈拉族群生活在委内瑞拉西部的法尔孔和拉腊两地，他们的语言现已消亡。希拉哈拉人住在今科罗城一带，以及锡基锡克、巴拉瓜和萨纳雷，其中一些人南迁到巴基西梅托以南，前往特鲁希略的山区。\n\n1529年德国探险家安布罗西乌斯·阿尔芬格提到他们是卡克蒂奥人的邻居。1553年，在圣费利佩德布里亚金矿做工的黑奴和希拉哈拉人发动起义。约从1624年起，他们阻挠西班牙人在富产黄金的尼尔瓜省定居，直到一位总督的军队击败了他们。锡基锡克约在1685年建镇，1776年的人口普查中该镇仍以原住民居多。"
 jurchen_group_desc: "$jurchen_group$人崛起于白山黑水之地，这支骁勇善战的民族在12世纪便灭亡了契丹辽朝，建立起强大的金王朝。作为昔日辉煌帝国的缔造者后裔，他们以精湛的骑射技艺闻名于世。时至今日，这个民族依然以其坚韧不拔的精神底蕴和丰富的历史遗产，不断震撼着世界。\n\n女真文化组汇集了满洲地区说通古斯语的女真人，包括松花江一带的海西女真和虎尔哈。他们过着渔猎采集、半游牧放牧或定居农耕的生活，没有中央权威。女真人于1115年建立金朝，金朝统治华北，直到1234年被蒙古人推翻。\n\n1337年他们处在元朝治下；后来明朝把他们划分为建州、海西和野人女真，首领们向明朝朝贡，并担任边境的卫所指挥官。努尔哈赤统一了大多数部落，把他们编入八旗，并于1616年建立后金。1635年皇太极把本族改称满洲，清朝随后于1636年建立。"
 kambiwa_group_desc: "$kambiwa_group$$group_text$$kambiwa_language$的民族构成。\n\n坎比瓦人又称坎比乌阿人，是巴西伯南布哥内陆荒原（塞尔唐）的原住民，聚居在伊纳雅、伊比米林和弗洛雷斯塔一带。他们的语言未能归类且已消亡，只有它消亡前记录下的几份短词表留存。"
 kanisian_group_desc: "$kanisian_group$$group_text$$kanisian_language$的民族构成。\n\n卡尼西人即卡尼查纳人，是玻利维亚贝尼省的亚马孙民族，村落分布在马莫雷河和马丘波河沿岸。他们的语言被视为孤立语言。\n\n1693年耶稣会士奥古斯丁·萨帕塔首次进入他们的土地。1695年卡尼查纳人聚集到马莫雷河畔，请求建立传教站，1696年洛伦索·莱加尔达率一千二百名卡尼查纳人建立了圣佩德罗。他们被集中到耶稣会的传教村后，学会了农耕、木工和首饰制作。"
 kawesqar_group_desc: "$kawesqar_group$$group_text$$kawesqar_language$的民族构成。\n\n卡韦斯卡尔族群由巴塔哥尼亚水道里操舟的游群构成。卡韦斯卡尔人被欧洲水手称为阿拉卡卢夫，他们划着独木舟往来于佩尼亚斯湾和麦哲伦海峡之间的峡湾，捕鱼、猎海豹、捡贝类，从不务农。北面的邻居瓜伊特科人，即乔诺人，生活在智利南部外海的群岛中，乘木制的达尔卡船捕猎海狮。\n\n1526年，加西亚·霍夫雷·德·洛伊萨的探险队望见了卡韦斯卡尔人的营火。16世纪晚期起，奇洛埃的掠奴者追捕瓜伊特科人；18世纪40年代，西班牙清空了他们的岛屿，把他们迁往奇洛埃，逃往南方的几家则被卡韦斯卡尔人吸收。18世纪末起，英美猎海豹船带来了疾病。"
 kayambi_group_desc: "$kayambi_group$$group_text$$kayambi_language$的民族构成。\n\n卡扬比人是基多以北高河谷地带的安第斯族群，聚居于卡扬贝火山周围，他们的山顶要塞（普卡拉）分布在潘瓦马尔卡山脊和皮斯克河流域。他们对印加的推进抵抗了很长时间，据说争夺潘瓦马尔卡的战争持续了十七年。\n\n瓦伊纳·卡帕克时期，他们联合卡兰基人、基图人和帕斯托人参加北方起义。传说最后的屠杀发生在一座因此得名亚瓦尔科查（意为血湖）的湖畔。1534年西班牙征服后，他们的土地被分割成大庄园，卡扬比佃农被迫服役，主要从事羊毛加工。"
 keres_group_desc: "$keres_group$$group_text$$keres_language$的民族构成。\n\n凯雷斯人是新墨西哥格兰德河及其西部支流沿岸七座普韦布洛的居民，其中有台地上的阿科马和拉古纳。考古发现与科奇蒂口传表明，他们在14世纪初由西方迁入格兰德河流域。\n\n1539年埃斯特万尼科到访时，阿科马已有人居住了一千多年。1599年胡安·德·奥尼亚特的军队洗劫该镇，杀死约八百人，并把数百人掳为奴隶。凯雷斯人参加了1680年的普韦布洛起义，起义后来自阿科马等反叛村镇的难民建立了拉古纳。18世纪，他们在表面的天主教信仰之下保留着氏族和基瓦仪式，同时抵御阿帕奇人、科曼奇人和犹特人的袭扰。"
 khoisan_group_desc: "非洲南部与东部的科伊桑民族是地球上现存最古老的人群之一，其语言以显著的搭嘴辅音为特色。他们包括喀拉哈里沙漠的桑人狩猎采集者以及开普地区的科伊科伊人牧者，这些民族在班图人扩张之前很久便已居住于非洲南部。\n\n科伊桑是对非洲南部和东部非班图民族的统称，这些民族的语言之间并没有可证明的亲缘关系。喀拉哈里的桑人以小型流动群体为单位生活，坦桑尼亚埃亚西湖周围的哈扎人也是如此；科伊科伊人，包括纳马人和达马拉人，则放牧牛羊。\n\n他们人口最多的地方，是气候不宜班图人种植高粱的地区，从开普一直到纳米比亚和博茨瓦纳。1652年荷兰东印度公司在开普建立殖民地，当地的科伊科伊人养着大群牲畜。"
 kongo_group_desc: "刚果河下游盆地与大西洋沿岸的刚果民族，建立了撒哈拉以南非洲最中央集权的国家之一——刚果王国，拥有完善的官僚体系、省级总督以及使用恩津布贝壳的广泛货币系统。他们在十五世纪末与葡萄牙商人的早期接触，使刚果王国成为最早与欧洲列强以平等地位进行外交接触的非洲政权之一。\n\n刚果文化组包括刚果人、永贝人、维利人和布文德人，以及南面的安本杜人。约从1390年起，刚果王国以姆班扎刚果为都，各省总督由王室成员和贵族担任；用作货币的恩津布贝壳产自卢安达岛。\n\n1483年，葡萄牙航海家迪奥戈·康抵达海岸，国王恩津加·恩库武接受洗礼。其子阿方索一世1509年即位，建立了天主教会，并同葡萄牙国王通信，1526年抗议葡萄牙奴隶贩子。葡萄牙于1575年建立安哥拉，奴隶贸易逐渐削弱了国王的权力。"
 kru_group_desc: "利比里亚与科特迪瓦海岸的克鲁民族使用尼日尔‑刚果语系克鲁语支的语言，以其航海技艺和对奴役的强烈抵抗而闻名。数个世纪以来，他们的航海传统使其成为西非海岸备受珍视的水手。\n\n克鲁人是一组相近的族群，分布在今利比里亚东南部和科特迪瓦西部的海岸，包括格雷博人、巴萨人和克兰人。欧洲水手因当地出产几内亚胡椒，称这段海岸为胡椒海岸。\n\n每个村落都是独立的小社群；克鲁人沿海捕鱼和贸易。按他们的传统，克鲁人从未沦为奴隶，克鲁男子在额头上刺一道靛蓝线条，表明自己是自由人。大西洋奴隶贸易时代，欧洲人雇他们在沿海船只上当水手、领航员和翻译，称他们为“克鲁曼”，这个名字与英语的“船员”一词有关。"
 ktunaxa_group_desc: "$ktunaxa_group$$group_text$$ktunaxa_language$的民族构成。\n\n库特内人又称库特奈人，生活在哥伦比亚高原北部的库特内河沿岸，分为上、下两支，所说的语言是孤立语言。一种说法认为他们原住草原，被黑脚人赶过了落基山脉；此后每年仍有队伍翻山捕猎野牛，常为猎场与黑脚人发生冲突。\n\n18世纪，下库特内的先知“闪光之衫”预言黑袍传教士即将到来。西北公司于1807年在他们当中建起库特内贸易站，但在佩甘人的敌对压力下于1812年将其放弃。"
 kwa_group_desc: "黄金海岸与贝宁湾的克瓦民族使用尼日尔‑刚果语系克瓦语支的语言，涵盖内陆的阿肯诸国以及沿海的埃维与丰王国。其社会以阿肯人中的母系继承制以及丰人与埃维人中强大的伏都教宗教传统为标志。\n\n克瓦文化组包括今加纳森林和黄金海岸的阿肯人，以及其东面讲格贝语的埃维人、阿詹人和丰人。葡萄牙人于1482年抵达海岸，修建埃尔米纳城堡收购阿肯人的黄金；阿肯的博诺国经贝戈把黄金向南输送。\n\n阿詹人自称来自塔多，埃维人自称来自诺齐；约1600年，阿詹的三兄弟把土地分给阿拉达、小阿拉达和阿波美。1701年，阿散蒂国王奥塞·图图击败登基拉，建立阿散蒂帝国。丰人的达荷美王国于1724年攻取阿拉达，1727年攻取港口维达。"
 kwaza_group_desc: "$kwaza_group$$group_text$$kwaza_language$的民族构成。\n\n夸扎人又称科阿亚，是巴西朗多尼亚州南部高地雨林中的族群，曾散居在圣佩德罗河和塔博卡河沿岸。他们是半游耕的刀耕火种农人，与艾卡纳人、卡诺埃人和图帕里人为邻，所说的夸扎语是孤立语言。"
 lenape_group_desc: "$lenape_group$$group_text$$lenape_language$的民族构成。\n\n莱纳佩族群汇集了大西洋中部沿海说特拉华语的阿尔衮琴民族：蒙西人、乌纳米人和乌纳拉奇戈人，即莱纳佩人或称特拉华人，他们在特拉华河与纽约湾一带的故土称为莱纳佩霍金；还有哈德逊河上游与之相近的莫希干人。他们实行母系氏族制，种植玉米、豆类和南瓜，从未形成政治上的统一。\n\n1624年荷兰人建立新阿姆斯特丹。1682年威廉·佩恩首次会见莱纳佩人，1737年的“步行购地”骗局把他们赶出了故土。莱纳佩人迁入俄亥俄的摩拉维亚传教镇，1782年宾夕法尼亚民兵在格纳登许滕杀害了其中96人。1680年以后，莫霍克人的压力使许多莫希干人东迁到斯托克布里奇。"
 lithuanian_group_desc: "在波罗的海诸民族中，立陶宛人凭借语言的亲缘关系与共同的外部威胁，凝聚力量建立了自己的国家。即便深陷基督教势力的重重包围，他们仍顽强坚守着古老的多神教信仰，这种独特的文化坚持不仅增强了民族凝聚力，更铸就了鲜明的集体认同。\n\n立陶宛文化组汇集了高地的奥克什泰特人和波罗的海沿岸低地的萨莫吉蒂亚人，他们在立陶宛大公国中联合起来。首位统治者明道加斯于1253年加冕为王，但这个异教国家是条顿骑士团和利沃尼亚骑士团发动十字军的目标，并挺过了这些进攻。\n\n在格迪米纳斯及其子阿尔吉尔达斯和凯斯图蒂斯治下，它向前基辅罗斯的土地扩张，到1440年已是欧洲最大的国家。1386年约盖拉签署《克雷沃联合》，皈依基督教并成为波兰国王。1569年的《卢布林联合》使立陶宛与波兰合为共和国，共和国于1795年在瓜分中终结。"
 luba_group_desc: "加丹加高原与开赛盆地的卢巴与隆达民族，建立了一个相互联结的朝贡帝国网络，数个世纪间主宰了中非的心脏地带。卢巴帝国开创了中非的神圣王权模式，而卢恩达的扩张则将其委任总督的政治体系带到了从安哥拉到赞比亚的广阔大陆区域。\n\n卢巴人出自乌彭巴洼地的捕鱼、农耕和冶金社群，那里从4世纪起就有炼铁的农民定居。有学者认为卢巴帝国建于15世纪以前；口述传统讲述它的神圣王权如何从尼孔戈洛和猎人姆比迪·基卢韦开始。\n\n卢巴人那种能吸纳外来首领的统治模式被隆达人采用，隆达的第一位最高统治者约在1665年取号穆瓦内‑阿‑亚姆武。隆达是由贡赋联结起来的酋邦联盟，势力扩展到刚果南部、安哥拉东北部和赞比亚，其移民还建立了东部的卡曾贝王国。"
 lule_group_desc: "$lule_group$$group_text$$lule_language$的民族构成。\n\n卢莱人是大查科地区的原住民，最早见于今阿根廷萨尔塔省。他们以狩猎采集为主，也种植玉米、马铃薯和藜麦，萨尔塔以西的村落还饲养羊驼。他们的卢莱语与比莱拉语共同构成一个小语系。\n\n1670年起，耶稣会把他们集中到圣何塞‑德卢莱传教区。1708年查科征讨后，四百名卢莱人被安置在圣胡安·包蒂斯塔·德·巴尔武埃纳，1715年又迁至萨拉多河畔的圣埃斯特万·德·米拉弗洛雷斯。该传教区在1728年被毁，1752年重建；1768年耶稣会被驱逐后，转交给方济各会。"
 macro_je_group_desc: "$macro_je_group$$group_text$$macro_je_language$的民族构成。\n\n大热族群包括热语民族及其范围更广的大热语系亲属，当图皮—瓜拉尼人占据海岸时，他们据有巴西内陆的高原和稀树草原。北部热语民族有廷比拉人和卡亚波人；中部有谢伦特人和沙万特人，南部有坎加格人和肖克伦人。\n\n1554年葡萄牙人建立圣保罗时，内陆腹地仍属于他们。18世纪，寻找黄金和奴隶的旗队把卡亚波人赶向西面；沙万特人被奴役，1830年代起撤入马托格罗索；卡里里人则在1683至1713年的战争中起事。"
 maghrebi_group_desc: "北非地区拥有其独特的地理环境，北部毗邻宁静的地中海，南部则与严酷的撒哈拉沙漠接壤。在这里，众多帝国经历了兴衰更迭，孕育出多个极擅适应这一地区生存的独特文化群体。\n\n马格里布文化组汇集了非洲西北部的穆斯林诸民族：泽纳塔、桑哈贾、马斯穆达、卡比尔和图阿雷格等阿马齐格人，说阿拉伯语的摩洛哥人、阿尔及利亚人、突尼斯人和利比亚人，以及来自伊比利亚的安达卢斯难民。欧洲人把该地区的穆斯林和犹太人称为摩尔人。\n\n穆瓦希德帝国分裂为三个国家；1337年，非斯的马林王朝从扎亚尼德人手中夺取了特莱姆森，哈夫斯王朝则据有突尼斯。1332年生于突尼斯的伊本·赫勒敦写下了记述这些王朝的历史。奥斯曼人于1516年夺取阿尔及尔，1574年夺取突尼斯，摩洛哥的萨阿德王朝则在1578年的三王之战中击败了葡萄牙。阿拉维王朝于1666年夺取摩洛哥。"
 malagasy_group_desc: "马达加斯加岛上的多元族群尽管各具特色，但他们共同的起源可追溯至从东非海岸到东南亚群岛的辽阔地域。\n\n马尔加什文化组历经数百年形成，由来自婆罗洲南部、大多定居内陆的南岛语系移民，与来自东非、在沿海建立聚落的班图移民交融而成。他们说马尔加什语，属南岛语系。\n\n到中世纪，岛上已形成十几个族群认同，各由地方首领统治。萨卡拉瓦人、梅里纳人和贝齐米萨拉卡人后来各自统一为王国，靠与欧洲人和阿拉伯人的贸易积累了财富；16至18世纪，海盗在沿海十分活跃。1800年前后，安德里亚南波伊尼梅里纳重新统一了高地上的伊梅里纳王国，其子拉达马一世又把统治扩展到全岛大部。"
 malibu_group_desc: "$malibu_group$$group_text$$malibu_language$的民族构成。\n\n马利布人是哥伦比亚北部马格达莱纳河下游沼泽地带的河畔民族。他们的语言如今已经消亡、记录寥寥，自成语系，过去曾被归入奇布查语系，但亲属关系未定。他们生活在洪水季节性漫溢的地方，靠捕鱼和种木薯为生。\n\n他们没有共主，靠联盟行动。征服时代最强大的酋长蒙波赫能召集约五十个小族群，包括马利布和金巴耶等部。1537年5月3日，胡安·金特罗·德·埃雷迪亚的军队击败蒙波赫后，建立了以他命名的圣克鲁斯‑德蒙波斯城。此后监护征赋制、河上贸易和疫病瓦解了马利布诸社群。"
 manoki_group_desc: "$manoki_group$$group_text$$manoki_language$的民族构成。\n\n马诺基人旧称伊兰特谢人，是巴西马托格罗索州西部的原住民，村落分布在茹鲁埃纳流域的克拉瓦里河等河流沿岸。他们所说的语言是没有已知亲属的孤立语言，与亲缘相近的米基人共用。"
 mapudungun_group_desc: "$mapudungun_group$$group_text$$mapudungun_language$的民族构成。\n\n马普敦贡族群包括智利中南部的马普切人、中部河谷的皮昆切人和普鲁纳瓦卡人、南面的维利切人，以及后来才改说马普敦贡语的安第斯山区佩文切人。1541年起西班牙人入侵。\n\n马普切人在1550年发动阿劳科战争，1553年杀死佩德罗·德·瓦尔迪维亚；1598年在库拉拉巴设伏获胜，使西班牙人丢掉七座城市，边界固定在比奥比奥河。17世纪起，马普切人各支翻越安第斯山，把语言和骑马文化传遍潘帕斯草原，并吸收了赫特人。"
 maskoy_group_desc: "$maskoy_group$$group_text$$maskoy_language$的民族构成。\n\n马斯科伊族群由巴拉圭大查科的伦瓜—马斯科伊诸民族构成：恩列特人（即北伦瓜人）、恩克塞特人（即南伦瓜人）和瓜纳人。他们是干旱查科森林里的狩猎采集者，以亲族小群的形式活动，寻找猎物、野果和蜂蜜。\n\n瓜纳人曾被骑马的姆巴亚人征服。1760年耶稣会士曼努埃尔·杜兰把逃离姆巴亚统治的瓜纳人集中到圣胡安·内波穆塞诺传教村，1768年耶稣会被逐时村里有六百人。1797年又在卡阿萨帕建了第二座传教村，与瓜拉尼妇女通婚使这个社群很快瓜拉尼化。"
 massachusett_group_desc: "$massachusett_group$$group_text$$massachusett_language$的民族构成。\n\n马萨诸塞族群由新英格兰南部的东阿尔冈昆语民族构成：马萨诸塞人、万帕诺亚格人、佩科特人、纳拉甘西特人、奎里皮人和波科姆塔克人。他们的村落分布在渔场与种着玉米、豆类和南瓜的田地之间。\n\n1616至1619年的疫病使大多数万帕诺亚格人丧生，1620年清教徒建立了普利茅斯。1636至1638年的佩科特战争以佩科特人被击溃告终。牧师约翰·埃利奥特于1651年建立内蒂克祈祷镇，1663年印制了《印第安语圣经》。1675至1676年由万帕诺亚格酋长梅塔科姆领导的菲利普国王战争摧毁了祈祷镇，使多数族群失去土地。"
 mataco_guaicuru_group_desc: "$mataco_guaicuru_group$$group_text$$mataco_guaicuru_language$的民族构成。\n\n马塔科—瓜伊库鲁族群汇集了大查科的马塔科诸民族和瓜伊库鲁诸民族，其中有韦奇人、尼瓦克莱人和玛卡人，以及瓜伊库鲁人、莫科维人和阿比庞人。瓜伊库鲁诸部是游牧武士，1537年西班牙人建立亚松森后改用马匹；马塔科诸部则沿河定居，靠渔猎、采集和小规模农耕为生。\n\n到1641年，阿比庞人已放弃农耕，转而劫掠牛马。1686年耶稣受难日，约八百名莫科维人洗劫了埃斯特科；1632年韦奇人与托巴人摧毁了瓜达尔卡萨尔的圣地亚哥城。1743年耶稣会为莫科维人开设了圣哈维尔传教村，1768年耶稣会被逐，传教村从此没有了庇护者。"
 maya_group_desc: "$maya_group$$group_text$$maya_language$的民族构成。\n\n玛雅族群指玛雅语系的诸民族，分布在墨西哥南部、危地马拉和伯利兹，从北部半岛上的尤卡坦人，到乔尔人和伊察人，再到高地上的基切人、卡克奇克尔人和玛姆人，以及远在北方的瓦斯特克人。古典期约250至900年间，他们的书吏留下了数千处象形文字铭文。\n\n基切人在库马尔卡赫建都，直到1524年佩德罗·德·阿尔瓦拉多击溃其军队。伊察人南逃到佩滕湖区，据守诺赫佩滕，直到1697年马丁·德·乌尔苏亚攻克该城，美洲最后一个独立的原住民王国就此终结。玛雅作者留下了《波波尔·乌》和《奇拉姆·巴拉姆之书》。"
 micronesian_group_desc: "与他们的波利尼西亚邻居类似，密克罗尼西亚人擅长航海，并殖民了西太平洋数百个岛屿和环礁。\n\n密克罗尼西亚文化组汇集了西太平洋的南岛语系岛屿民族。狭义的密克罗尼西亚有约两千个小岛，分属加罗林、吉尔伯特、马里亚纳和马绍尔四大群岛；本组还包括斐济人，以及所罗门群岛、瓦努阿图和新喀里多尼亚的各族。\n\n马里亚纳的查莫罗人、楚克人、波纳佩人和吉尔伯特人生活在小型酋邦和氏族之中。麦哲伦于1521年到达马里亚纳，西班牙从1668年起在关岛定居。阿贝尔·塔斯曼于1643年望见斐济，其他多数岛屿到18世纪才与欧洲人相遇。"
 misumalpan_group_desc: "$misumalpan_group$$group_text$$misumalpan_language$的民族构成。\n\n米苏马尔潘族群得名于尼加拉瓜和洪都拉斯加勒比低地与高地上的米斯基托语、苏莫语和马塔加尔帕语。洪都拉斯西南部的伦卡人说的是孤立语言，但也被归入此组。\n\n1537年伦卡人在战争领袖伦皮拉的率领下起事，约三万人聚集在塞尔金的设防山丘上，伦皮拉当年身亡，起义随之瓦解。尼加拉瓜高地的马塔加尔帕人自1525年起与西班牙人交战，1643年、1688年和1773年又接连起义。在海岸一带，米斯基托人与英国人结盟，英国人于1660年立他们的酋长为王，米斯基托的袭掠者靠火器掳走马扬格纳人，卖给牙买加的种植园。"
 mongolian_group_desc: "各个$mongolian_group$族群发源于中亚广袤草原，承载着延续数个世纪的游牧传统。他们以精湛的骑术与箭术闻名于世，驰骋于辽阔原野，与牧群维系着深厚羁绊。在$genghis_khan_name_no_tooltip$等历史人物的统领下，他们建立了史上最庞大的帝国之一，在征服史册上镌刻下不可磨灭的印记。其历久弥新的文化瑰宝包含马背技艺、呼麦艺术，以及根植于无垠故土的坚韧精神。\n\n蒙古文化组汇集了蒙古草原及其边缘的各族：本部蒙古人、西部的瓦剌人、南部的喀喇沁人和土默特人，以及满洲地区的锡伯人和达斡尔人。1206年，成吉思汗统一了他们。\n\n1337年，妥懽帖睦尔统治着元朝，这是蒙古人在中国建立的政权。1368年明朝把元廷赶往北方，其后裔以北元的名义占据蒙古高原，直到1635年。达延汗于1500年前后重新统一了东部蒙古人，土默特的俺答汗于1578年会见了达赖喇嘛。此后清朝接管了蒙古的土地，并在1750年代消灭了瓦剌的准噶尔部。"
 mordvinic_group_desc: "伏尔加河中游地区的莫尔多瓦民族使用乌拉尔语系莫尔多瓦语支的语言，是俄罗斯欧洲部分最大的原住群体之一。莫克沙人与埃尔齐亚人关系密切，但使用不同的语言并保持各自独立的文化认同。\n\n莫尔多瓦文化组包括埃尔齐亚人和莫克沙人，还有梅谢拉人，即奥卡河与克利亚济马河之间的一支芬兰‑乌戈尔部落。约7世纪，莫尔多瓦人的祖先与保加尔人相遇，向伏尔加保加尔纳贡。\n\n13世纪蒙古人征服此地，将其并入金帐汗国。14世纪晚期，莫斯科夺取了西部莫尔多瓦人的土地，东部归入喀山汗国；1552年喀山陷落后，所有莫尔多瓦人都成了俄罗斯臣民。17世纪与楚瓦什人、马里人联合的起义遭镇压后，许多莫尔多瓦人向东逃过伏尔加河。"
 moseten_group_desc: "$moseten_group$$group_text$$moseten_language$的民族构成。\n\n齐马内人又称奇马内人，是玻利维亚贝尼省的森林民族，从基基贝河分布到马尼基河源头。他们的语言齐马内语即莫塞滕语，是孤立语言。他们的村落由二十到三十户人家组成，种植香蕉和木薯，并沿河逆流追随鱼汛。\n\n1693年耶稣会士建立圣博尔哈传教站，这是他们与外界最早的接触记录。后来方济各会接手传教，却带来疫病，使齐马内人濒临灭绝，许多家庭散入森林深处。"
 movima_group_desc: "$movima_group$$group_text$$movima_language$的民族构成。\n\n莫维马族群汇集了莫霍斯平原上的莫维马人和卡尤巴巴人，这片平原是玻利维亚贝尼省每年被洪水淹没的草原，两个民族各说一种孤立语言。他们是半定居的农人，修筑台田，也狩猎、捕鱼和采集野果。\n\n1621年神父格雷戈里奥·德·玻利瓦尔是最早到达莫维马人中间的欧洲人；1700年阿尔塔米拉诺神父统计，莫维马人约两万，分居八十个小聚落。1693年耶稣会士奥古斯丁·萨帕塔在卡尤巴巴人中发现七个村落，1704年卡尤巴巴人被集中到圣十字架升格传教站。此后耶稣会又把两个民族拉进圣洛伦索等传教村，圣洛伦索建于1708年。"
 muchik_group_desc: "$muchik_group$$group_text$$muchik_language$的民族构成。\n\n莫切族群以什扬人为中心，即西坎（兰巴耶克）文化的居民，他们在约750至1375年间继承了莫切文化，生活在秘鲁北部沿海奇克拉约一带的河谷里，说穆奇克语，后来也称莫奇卡语或云加语。他们的宗教都城巴坦格兰德在900至1100年间兴盛，神庙被焚毁后，新都城在图库梅兴起。\n\n1337年兰巴耶克诸政体仍统治着各自的河谷，但约1375年奇穆王国终结了它们的独立。再往南的奇隆河谷里住着科利克人和坎塔人，后来被印加人征服。1644年费尔南多·德拉卡雷拉印行了《云加语语法》。"
 mura_group_desc: "$mura_group$$group_text$$mura_language$的民族构成。\n\n穆拉人是亚马孙河中游的水居民族，在马代拉河与普鲁斯河之间的岛屿、水道和湖泊间往来。他们是出色的独木舟手和渔人，住在小而分散的家庭群中，自称布乌拉恩。他们说的博乌拉语属于穆拉语系。\n\n他们在1714年首次见于记录。葡萄牙奴隶贩子袭击他们之后，他们在整个18世纪的大部分时间里与传教站和殖民推进作战，由公开交战转为河上伏击。到1774年，他们的袭击已威胁整个亚马孙殖民地；1786年双方议和，那时疫病和与蒙杜鲁库人的战争已使他们元气大伤。"
 muskogee_group_desc: "$muskogee_group$$group_text$$muskogee_language$的民族构成。\n\n马斯科吉族群汇集了美国东南部林地中说马斯科吉语系语言的民族，包括马斯科吉人、库萨人、科阿萨蒂人、亚马西人和瓜莱人。他们的先民属于密西西比文化，在今天田纳西、佐治亚和亚拉巴马一带建造土丘城镇，种植玉米。到16世纪中叶，许多中心已经衰落，只剩下库萨河畔库萨这样的酋长国。\n\n1540—1543年，埃尔南多·德索托的军队穿过这片地区，在马比拉击败图斯卡卢萨酋长。疫病和印第安奴隶贸易随后摧毁了旧日的酋长国，幸存者重新聚合为克里克联盟，亚马西人、瓜莱人等也被吸纳进来。19世纪30年代，大部分马斯科吉人被迫西迁。"
 myaamia_group_desc: "$myaamia_group$$group_text$$myaamia_language$的民族构成。\n\n麦阿米亚族群汇集了说迈阿密‑伊利诺伊语的阿尔冈昆人，即迈阿密人及其在五大湖南部的伊利诺伊近邻。迈阿密人包括阿查坎古恩、威亚、皮安克肖和佩皮科基亚等分支。他们种植玉米、兼事狩猎，在海狸战争中被易洛魁人的袭击赶到密歇根湖西岸。\n\n约1700年，他们借助法国人的火器和贸易回到沃巴什河与莫米河流域，首府凯基翁加就在今天的韦恩堡一带。凯基翁加的迈阿密人在美国独立战争期间仍与英国结盟；在小海龟酋长率领下，他们在西北印第安战争中领导西部联盟对抗美国。19世纪20至30年代，大部分人被迫西迁。"
 nadene_group_desc: "$nadene_group$$group_text$$nadene_language$的民族构成。\n\n纳‑德内族群包括阿拉斯加沿海的特林吉特人，西北内陆众多的阿萨巴斯卡人（即德内人），以及西南部阿帕奇语支的迪内人和因德人。阿萨巴斯卡人包括奇佩维安人，他们的疆域是北美最辽阔的之一，从阿拉斯加横跨加拿大的亚北极地带。\n\n特林吉特人生活在亚历山大群岛的雨林里，实行母系氏族制度，1741年俄国探险家到来时才第一次接触欧洲人。阿帕奇语支诸族的祖先是南迁的阿萨巴斯卡人。到17世纪，迪内人居住在新墨西哥的迪内塔，向普韦布洛邻居学会了农耕，又从西班牙人那里得到绵羊。"
 nahua_group_desc: "居住在墨西哥谷地的$nahua_culture$人以其发达的社会文明、复杂的治理体系以及与周边城邦频繁的军事冲突而著称。\n\n纳瓦文化组包括被称为阿兹特克人的墨西哥人、与他们为敌的特拉斯卡拉人，以及把纳瓦特语带到南方萨尔瓦多的皮皮尔人。纳瓦人被认为来自干旱美洲边缘，约在公元500年迁入墨西哥中部，在墨西哥盆地定居。西班牙人到来之前，他们分成许多没有共同认同的群体。\n\n墨西哥人于1325年建立特诺奇蒂特兰，1428年与特斯科科和特拉科潘结成三国同盟，统治墨西哥中部。1519年埃尔南·科尔特斯登陆，与墨西哥人为敌的特拉斯卡拉人加入西班牙人一方，西班牙人在1521年攻陷了特诺奇蒂特兰。"
 napuruna_group_desc: "$napuruna_group$$group_text$$napuruna_language$的民族构成。\n\n纳普鲁纳人又称纳波鲁纳，即生活在安第斯山东麓纳波河、阿瓜里科河和普图马约河流域的基霍斯人，其地在今天的厄瓜多尔和秘鲁境内。他们原本的语言是希利帕努语，后来让位于基奇瓦语：它先是随山地与低地之间的贸易传来，随后又借印加人征服厄瓜多尔而扩散。\n\n16世纪西班牙人进入这片地区，几乎使基霍斯人灭绝。1578年，勇士胡曼迪领导起义反抗西班牙统治，1579年被俘，遭受酷刑后被杀害。"
 natchez_group_desc: "$natchez_group$$group_text$$natchez_language$的民族构成。\n\n纳奇兹族群以密西西比河下游的纳奇兹人及其近亲坦萨人为主。两者都是普拉克明文化的后裔，这种文化修筑平顶土丘，种植玉米；纳奇兹人的语言没有已知的亲属语言。纳奇兹人由世袭的最高首领大太阳统治，这一称号沿女系传承。\n\n1542年，埃尔南多·德索托的远征队在河畔遇见一个强大的酋长国。坦萨人受奇克索人和亚祖人的袭扰，1715年在法国人保护下迁往莫比尔。纳奇兹人1729年攻击法国的罗莎莉堡，到1731年被镇压，被俘者被卖到圣多明各为奴。"
 nepali_group_desc: "尼泊尔地区的居民拥有多元的起源与血统。古隆族与塔芒族的根源可追溯至中国西藏地区，而卡斯族与库马翁族则来自印度次大陆。尽管如此，尼泊尔境内多样的文化群体都将喜马拉雅山脉视为共同的家园。\n\n尼泊尔文化组包括加德满都谷地的尼瓦尔人、说印度‑雅利安语的卡斯人、南部平原的塔鲁人，以及尼泊尔和锡金的马加尔、塔芒、古隆、林布和夏尔巴等山地民族。在加德满都谷地，马拉王朝统治尼瓦尔人的城市，时间从1201年到1769年，该地是印度—西藏商路上富庶的交汇点。\n\n14世纪后期，杰亚斯提提·马拉使谷地统一，1482年又分裂为加德满都、帕坦和巴德岗三个王国。廓尔喀国王普利特维·纳拉扬·沙阿于1768—1769年征服了这三国。"
 netherlandish_group_desc: "在这片河网纵横的低洼之地，尼德兰各族群共生共荣。与海洋的持续抗争铸就了他们独特的民族精神，以商业头脑、航海探索与创新精神著称于世。通过贸易往来与治水智慧，他们共同延续着独特的文化血脉。\n\n尼德兰文化组包括低地法兰克的荷兰人和佛兰德人、沿海的弗里斯兰人、南部的瓦隆人和皮卡第人，以及东部边境的威斯特伐利亚人。佛兰德和布拉班特的呢绒城镇使这一地区富庶。\n\n15世纪勃艮第公爵们把各省聚合在一起，1477年勃艮第的玛丽联姻，使它们归入哈布斯堡家族。反抗腓力二世的尼德兰起义于1568年在奥兰治的威廉领导下爆发，北方各省于1579年结成乌得勒支同盟。1648年西班牙在明斯特承认荷兰共和国独立，1602年成立的东印度公司则建立起贸易帝国。"
 nguni_group_desc: "非洲东南部的恩古尼民族使用一组关系紧密的班图语言，这些语言因从邻近科伊桑民族借入的丰富搭嘴辅音系统而独具特色。恩古尼人建立起以牛的财富和强大酋长领地为中心的组织形式，由此产生了主宰南部非洲东海岸的大祖鲁与科萨民族。\n\n恩古尼人的祖先在晚期铁器时代带着羊和牛从中非南下。东开普的科萨人由恩古尼、科伊和夸（!Kwi）氏族组成，都在阿马特沙韦王室治下。\n\n16世纪，科萨人形成了格卡莱卡、拉哈拉贝和格昆纳韦比三个分联盟；后来他们的家园同不断扩张的荷兰开普殖民地相接，双方在边境战争中交战。19世纪初，国王沙卡建立了祖鲁帝国，在被称为“姆菲卡内”的动荡中，恩德贝莱人和恩戈尼人向北迁出南部非洲。"
 nilosahelian_group_desc: "尼罗‑撒哈拉民族居住于从撒哈拉沙漠到埃塞俄比亚高原的广阔带状区域，使用多样化的尼罗‑撒哈拉语系诸语言。他们包括努巴山脉的农民、达尔富尔苏丹国的商人以及撒哈拉边缘地带的游牧民。\n\n尼罗‑撒哈拉文化组包括苏丹的达朱人、富尔人和贝尔塔人，提贝斯提的图布人，厄立特里亚低地的库纳马人，以及科尔多凡山地的努巴人。图布人分为特达和达扎两支，以氏族为单位，是牧民和绿洲农民，各氏族各占一些水井和牧场。\n\n努巴人在努巴山中分为约五十个群体，所说的语言彼此并不相近。在达尔富尔，腾朱尔王国16世纪被富尔人的凯拉王朝苏丹国取代，据说由达阿利创建。到18世纪晚期，达尔富尔的疆域东达科尔多凡和白尼罗河。"
 nilotic_group_desc: "尼罗民族是尼罗河谷与东非平原上的游牧与半游牧社群，使用尼罗‑撒哈拉语系尼罗特语支的语言。从裂谷地带放牧牛群的马赛人到苏德沼泽的渔民，他们因年龄组社会结构和对牲畜的深度依赖而彼此相连。\n\n尼罗文化组包括南苏丹及其周边的卢奥人、丁卡人、努尔人、希卢克人和阿努亚克人，以及肯尼亚和坦桑尼亚的图尔卡纳人、马赛人和卡伦津人。公元第二个千年的最初几个世纪里，南卢奥人从加扎勒河地区南迁，马赛人也从南苏丹南下。\n\n马赛人和卡伦津人从库希特语邻族那里学到了年龄组制度，并同化或驱逐了先前的居民。在白尼罗河上，尼扬在15世纪晚期于法硕达建立希卢克王国；它的神圣君主“雷特”的安危关系着全国的福祉。"
 nuuchi_nuwu_group_desc: "$nuuchi_nuwu_group$$group_text$$nuuchi_nuwu_language$的民族构成。\n\n努奇努乌族群分布在大盆地和科罗拉多高原，包括努奇人（即尤特人）、努维人（即南派尤特人），以及加利福尼亚特哈查皮山区的卡怀苏人，都是南努米克人。尤特人和南派尤特人说犹他—阿兹特克语系的科罗拉多河努米克语，彼此可以互通。\n\n尤特人分成近十二个游牧游群，分布在犹他和科罗拉多一带，与普韦布洛诸民族通商，17世纪末已有马匹。南派尤特人沿科罗拉多河引水灌溉，种植玉米和南瓜；1776年多明格斯和埃斯卡兰特是最早遇到他们的欧洲人。"
 ob_ugric_group_desc: "$ob_ugric_group$$group_text$$ugrian_language$的民族构成。\n\n鄂毕‑乌戈尔文化组包括曼西人（旧称沃古尔人）和汉特人（旧称奥斯恰克人）。他们的两种语言属乌拉尔语系，与匈牙利语是近亲。他们生活在乌拉尔山与鄂毕河、额尔齐斯河之间，汉特人约从11世纪起在俄国文献中被称为尤格拉，并与诺夫哥罗德的猎人和商人贸易。\n\n他们的部落各有自己的首领，一些汉特人的公国在1440年代至1570年代部分并入西伯利亚汗国。俄罗斯人大约在五百年前到来，把曼西人和汉特人向东推向鄂毕河和额尔齐斯河，一些曼西人则留在乌拉尔山以西。"
 otopamean_group_desc: "$otopamean_group$$group_text$$otopamean_language$的民族构成。\n\n奥托帕梅族群包括欧托‑曼格语系的诸民族，主体是墨西哥中部高原的奥托‑帕梅人：奥托米人、托卢卡谷地的马特拉钦卡人、帕梅人，以及巴希奥一带瓜马尔等奇奇梅克诸部。更远处的欧托‑曼格语民族还有约800年南迁到尼加拉瓜的乔罗特加人、恰帕斯人和特拉帕内克人。\n\n奥托米人在墨西哥谷地丧失土地，墨西加人1475年在阿萨亚卡特尔率领下攻取了马特拉钦卡人的山谷。1521年西班牙征服之后，奥托米人参与殖民巴希奥；瓜马尔人及其邻族则在1550—1590年的奇奇梅克战争中与西班牙人作战。许多乔罗特加人被掳为奴。"
 paiute_group_desc: "$paiute_group$$group_text$$paiute_language$的民族构成。\n\n这里的派尤特族群指莫诺人，即莫纳奇人，他们居住在内华达山脉中部、东麓和莫诺盆地一带。他们常被称为北派尤特人，其实是另一支努米克人。“莫诺”之名来自约库特人的称呼，意为“蝇人”，因为莫诺湖出产的蝇类幼虫既是他们的食物，也是交换的货物。\n\n欧文斯谷的东莫诺人沿欧文斯河开渠灌溉，能够储存粮食；西莫诺人则留在山脊以西的山地。"
 pama_nyungan_group_desc: "帕马‑牛雅族群居住于澳大利亚大陆的绝大部分地区，使用帕马‑牛雅语系的语言，该语系覆盖了澳大利亚大约百分之八十的土地面积。尽管该语系内部存在巨大差异，这些民族共享广泛的文化模式，包括复杂的亲属制度、梦创神话宇宙观以及狩猎采集生计方式。\n\n帕马‑牛雅文化组包括西南的农阿人、新南威尔士中部的威拉朱里人和东海岸的冈比恩格尔人。语系的名字取自东北部的“帕马”和西南部的“牛雅”，两者都是“人”的意思。\n\n欧洲人到来时，帕马‑牛雅诸语有约300种。荷兰航海家威廉·扬松于1606年在约克角登陆，詹姆斯·库克于1770年测绘了东海岸，第一舰队于1788年抵达植物学湾。"
 panche_group_desc: "$panche_group$$group_text$$panche_language$的民族构成。\n\n潘切人又称托利马人，是今天哥伦比亚境内东安第斯山西坡的好战民族，居于穆伊斯卡高原与马格达莱纳河之间。西班牙征服时他们约有3万人，由彼此独立的酋长国松散联合而成。\n\n他们用棍棒和毒箭袭击东边的穆伊斯卡人。1538年，他们在托卡雷马被贡萨洛·希门尼斯·德·克萨达的西班牙人击溃，穆伊斯卡的萨吉帕率军与西班牙人并肩作战。抵抗又持续了一段时间，直到埃尔南·贝内加斯·卡里略平定各酋长国，疾病和殖民定居随后使幸存者大为减少。"
 pano_group_desc: "$pano_group$$group_text$$pano_language$的民族构成。\n\n帕诺族群包括亚马孙西南部的诸族，分布在秘鲁东部、玻利维亚北部和巴西西部：说帕诺语族语言的乌尼人（即卡希博人或卡卡塔伊博人）、帕卡瓦拉人和卡沙拉里人，以及说塔卡纳语族语言的埃塞哈人和塔卡纳人。这两个语族可能有亲缘关系。\n\n塔卡纳人在贝尼河一带遇到了印加人的扩张；约1680年方济各会修士进入其地，1731年之后建立传教村。乌尼人1744年加入胡安·桑托斯·阿塔瓦尔帕的起义，参与捣毁传教站；1757年他们杀死一名修士，赶走了其余的人。"
 panzaleo_group_desc: "$panzaleo_group$$group_text$$panzaleo_language$的民族构成。\n\n潘萨莱奥族群涵盖厄瓜多尔高地基多和拉塔昆加一带的诸族，包括基图人、瓜亚昆多人、钦巴斯人和汉巴图斯人。他们的前印加语言潘萨莱奥语，到17世纪让位于基奇瓦语。\n\n基图人建立了基多城，居住在皮钦查火山脚下的山谷中，视这些山为圣山。约1470年，托帕·印加·尤潘基征服了他们；他们后来与卡扬比人、卡兰基人一起起兵反抗瓦伊纳·卡帕克。1534年，西班牙人攻占基多。"
 papuan_group_desc: "巴布亚民族由新几内亚及周边岛屿的众多原住民族群构成，使用数百种语言，这些语言分属多个不同且基本互不关联的语系，统称为“巴布亚诸语言”。其语言与文化的显著多样性，反映了数千年来在岛屿崎岖地势中相对隔绝的发展历程。\n\n巴布亚族群包括新几内亚和俾斯麦群岛的原住民。他们的约800种语言分属大约六十个关系不明的小语系，“巴布亚语”只是对非南岛语系语言的地理归类。他们的祖先发展出最早的农业之一，高地上留有古代灌溉系统。\n\n欧洲人在16世纪20年代首次望见该岛，豪尔赫·德·梅内塞斯称之为“巴布亚诸岛”；1545年，伊尼戈·奥尔蒂斯·德雷特斯把它命名为新几内亚。在西部，蒂多雷苏丹宣称拥有海岸地区，而内陆高地一直不为欧洲人所知。"
 penutian_group_desc: "$penutian_group$$group_text$$penutian_language$的民族构成。\n\n佩努蒂族群基于20世纪初提出的一种假说，这一假说把加利福尼亚的米沃克人、奥洛内人、约库特人和迈杜人，哥伦比亚河下游的奇努克人，以及内陆的尼米普人（即内兹佩尔塞人）的语言联系在一起。这种更大范围的统一性尚未得到证实。\n\n他们靠渔猎和采集为生，从加利福尼亚的橡子到哥伦比亚河的鲑鱼。奇努克人在沿海与内陆之间做贸易，奇努克行话就源自他们的语言。尼米普人培育阿帕卢萨马，1805年遇到了刘易斯和克拉克。1769年起西班牙传教站使加利福尼亚诸族流离失所，传教站统治于1834年结束。"
 permic_group_desc: "乌拉尔山脉地区的彼尔姆民族使用乌拉尔语系彼尔姆语支的语言，与芬兰语和爱沙尼亚语关系密切。科米人与乌德穆尔特人长期居住在伏尔加河与乌拉尔山之间的森林地带，与他们的斯拉夫与鞑靼邻居进行毛皮贸易。\n\n彼尔姆文化组包括居住在维切格达河、伯朝拉河和卡马河流域的科米人，卡马河与维亚特卡河一带的乌德穆尔特人，以及人数很少的贝谢尔曼人，后者大概是被乌德穆尔特人同化的鞑靼人。12世纪起，诺夫哥罗德的商人北上收购毛皮，科米的公爵们以切尔登要塞为中心统一了大彼尔姆。\n\n1372年，传教士彼尔姆的斯蒂芬创制了科米字母。彼尔姆公爵于1470年受洗，莫斯科于1472年夺取切尔登，1505年俄罗斯总督取代了末代公爵，俄罗斯移民开始迁入。"
 pijao_group_desc: "$pijao_group$$group_text$$pijao_language$的民族构成。\n\n皮豪人是哥伦比亚安第斯山中部由结盟酋长国组成的联合体，分布在中科迪勒拉山脉以及马格达莱纳河和考卡河的上游谷地。他们从未形成集权国家。他们的祭司称为莫哈内斯，主持以河流和山岳为中心的万物有灵仪式。\n\n为争夺马格达莱纳河、考卡河和萨尔达尼亚河的控制权，皮豪人与西班牙人作战，战争持续了大约八十年。1605年至1615年间，胡安·德·博尔哈·阿门迪亚率军平定，并在1606年建立纳塔盖马安置幸存者。战争、改信天主教和与移民混居瓦解了这个联合体。"
 polish_group_desc: "在最后一个波兰国家灭亡后，波兰人被分离在不同国家下，他们拥有共同的西斯拉夫传承和强烈的天主教信仰。\n\n波兰文化组包括小波兰、大波兰、马佐夫舍和西里西亚的波兰人，以及波罗的海沿岸的卡舒比人。波兰于1320年重新统一为王国，1337年在位的是卡齐米日三世大王。他向东扩张到加利西亚，并于1364年在克拉科夫创办大学。\n\n1370年他去世，皮雅斯特王朝绝嗣。立陶宛的约盖拉于1386年与雅德维加女王结婚，创立了雅盖隆王朝；1410年联军在格伦瓦尔德击败了条顿骑士团。1569年的《卢布林联合》建立了波兰—立陶宛共和国。俄国、普鲁士和奥地利在1772年、1793年和1795年的三次瓜分终结了这个国家。"
 polynesian_group_desc: "海洋民族波利尼西亚人几个世纪以来一直在太平洋的众多岛屿上扩张。尽管彼此隔绝，但生活在岛上的众多族群仍可以追溯到共同的文化传承和语言共通之处。\n\n波利尼西亚文化组遍布波利尼西亚三角区：夏威夷原住民、新西兰的毛利人、萨摩亚人、塔希提人、汤加人，以及拉帕努伊（复活节岛）的居民。他们的祖先是来自东南亚岛屿的南岛海洋民族，靠观察星辰、洋流、云和飞鸟渡过大洋。\n\n他们的独木舟把相隔遥远的夏威夷、拉帕努伊和新西兰都变成了定居地，18世纪新西兰的波利尼西亚人口最多，约有11万。汤加的首领们把影响扩展到邻近岛屿。这些岛屿与欧洲人相遇较晚：詹姆斯·库克于1769年到达新西兰，1778年到达夏威夷，卡美哈梅哈一世在1810年前统一了夏威夷群岛。"
 powhatan_group_desc: "$powhatan_group$$group_text$$powhatan_language$的民族构成。\n\n波瓦坦族群包括切萨皮克湾沿岸低地的东阿尔冈昆人，包括波瓦坦人、拉帕汉诺克人、南塞蒙德人和阿卡瓦马基人。他们的语言称弗吉尼亚阿尔冈昆语，从未形成文字，主要靠约翰·史密斯和威廉·斯特雷奇留下的词表为人所知。\n\n最高首领瓦胡森纳卡瓦（英国人称他波瓦坦）建立了包括三十多个部落的联盟，1607年詹姆斯敦建立时，他坐镇韦罗科莫科。1618年他去世后，其弟奥佩昌卡诺于1622年和1644年发动起义。1646年的条约解散了这个联盟，1677年幸存者成为小块保留地上的纳贡者。"
 puebloan_group_desc: "普韦布洛人源自分化前的古普韦布洛族群，后在$shiewhibak_area$地区逐渐演化为多个独立部落。面对这片严酷的土地，他们锤炼出非凡的韧性，不仅创造出精妙的土坯建筑技艺，更发展出$shiewhibak_area$完善的灌溉系统。\n\n普韦布洛文化组包括塔诺人、凯雷斯人、祖尼人和霍皮人，以及亚利桑那沙漠中的霍霍坎人和瓦拉佩人。四角地区的先民普韦布洛人住过竖穴屋、大型村落和崖居，并修建用于仪式的圆形房间基瓦。\n\n西班牙人在新墨西哥遇见了用土坯和石头建成的多层城镇，便称普韦布洛人为“普韦布洛”，意为村庄；西班牙在新墨西哥的殖民始于1598年。普韦布洛各族保持着农耕、氏族和自己的宗教，又将它们与基督教结合起来。1680年他们发动普韦布洛起义，把西班牙人赶出新墨西哥，西班牙于1692年重新征服了那里。"
 pukina_group_desc: "$pukina_group$$group_text$$pukina_language$的民族构成。\n\n普基纳族群包括秘鲁沿海的奇里巴亚人，以及玻利维亚丘基萨卡河谷的查克拉人和扬帕拉人。普基纳语常被认为与蒂瓦纳库的建造者有关，主要靠方济各会修士路易斯·赫罗尼莫·德·奥雷1607年印行的一本礼仪手册保存下来。\n\n奇里巴亚人是奥斯莫尔河谷的渔民和玉米农，兴盛到约1360年。15世纪后期，图帕克·尤潘基的印加军队征服了查克拉人。1538年，查尔卡斯地区的首领孔萨拉向埃尔南多·皮萨罗的西班牙人介绍了当地的矿藏；同年，拉普拉塔城在查克拉人的土地上建立。"
 pume_group_desc: "$pume_group$$group_text$$pume_language$的民族构成。\n\n普梅人被西班牙人称为亚鲁罗人，居住在委内瑞拉奥里诺科河以西的平原上。他们自称普梅，意为“真正的人”，所说的语言是一种孤立语言，1782年菲利波·吉利发现它与已知的其他语言都没有亲缘关系。\n\n河岸普梅人在固定的村落里种植木薯，草原普梅人则在季节性营地之间迁移，靠狩猎和采集为生。传教站和牧场在他们的草原上始终稀疏，因此大多数群体在整个殖民时期保住了自己的语言和游动的生活方式。"
 purepecha_group_desc: "$purepecha_group$$group_text$$purepecha_language$的民族构成。\n\n普雷佩查人是墨西哥西部米却肯高地的居民，是帕茨夸罗湖盆地的农人和渔民，西班牙人称之为塔拉斯科人。他们的语言是一种孤立语言，与纳瓦特尔语没有亲缘关系。约1300年，首领塔里亚库里开始联合湖畔诸社群，到他约1350年去世时，其家系已掌握整个湖盆。\n\n后来的国王以辛特松桑为都城，建立起纳贡王国，到1460年国土已抵太平洋。15世纪70年代，它击退了阿兹特克的入侵。1525年，坦加克森二世向西班牙称臣，但努尼奥·德·古斯曼于1530年将他处死。随后，主教瓦斯科·德·基罗加为普雷佩查人创建了医院村。"
 pyrenean_group_desc: "比利牛斯山脉横亘于法兰西南部与伊比利亚半岛之间，孕育了各个独特的比利牛斯山民民族。这些边陲之地的居民在艰苦环境中形成了紧密纽带，并创造出适应偏远生活的独特社会形态。\n\n比利牛斯文化组包括加斯科涅人、巴斯克人和阿拉贡人。巴斯克语与周围的罗曼语毫无亲缘，巴斯克人在偏远的山谷里长期保有自己的法律，称为福埃罗。阿拉贡人在阿拉贡王国中占据南麓。\n\n两者之间是纳瓦拉王国，一个由巴斯克人主导、横跨隘口的王国。阿拉贡的斐迪南于1512年征服上纳瓦拉，北部仍保持独立，1589年随亨利四世归入法国王室。英格兰人把加斯科涅作为阿基坦的一部分一直占有到1453年，卡斯蒂永战役后它归属法国。"
 quechuan_group_desc: "$quechuan_group$$group_text$$quechuan_language$的民族构成。\n\n克丘亚族群包括万卡人、昌卡人、钦查人和库斯科的印卡人。克丘亚语大概在印加人之前就已传播，可能随瓦里国家扩散，瓦里的城市在约500年至1000年间主宰着秘鲁高原。\n\n1337年，印卡人还只是库斯科的一个小酋邦。1438年，王子库西·尤潘基击破昌卡人对库斯科的围攻，取名帕查库提，随后建立了从基多延伸到智利中部的塔万廷苏尤。1532年皮萨罗的人俘获阿塔瓦尔帕，曼科·印卡在比尔卡班巴的余部于1572年覆亡。克丘亚语仍是安第斯山区的通用语。"
 quingnam_group_desc: "$quingnam_group$$group_text$$quingnam_language$的民族构成。\n\n金南族群包括秘鲁北部沿海的奇穆人与塔阳人、佳纳利人和普鲁哈人。金南语本身是奇穆王国的官方语言，该王国约900年兴起，都城是土坯建成的昌昌城。\n\n奇穆约1375年征服兰巴耶克，并压服塔阳人。约1470年，托帕·印加·尤潘基率印加人攻取奇穆，后来又制服了厄瓜多尔高地的佳纳利人和普鲁哈人；佳纳利人在印加内战中支持瓦斯卡尔，遭到阿塔瓦尔帕的惩罚。1532年西班牙人到来，金南语到1763年已经消亡。"
 rhaetian_group_desc: "$rhaetian_group$民族是一个由罗曼什人、拉定人和弗留利人这三个主要阿尔卑斯社群组成的语言文化共同体。尽管他们并不属于同一政治实体，但由于其语言均源自融合了古雷蒂亚语与凯尔特语元素的通俗拉丁语底层，因而形成了文化上的统一性。\n\n格劳宾登的罗曼什人、多洛米蒂山区的拉定人和弗留利人，常被语言学家归为一组，视为说相关语言的民族。罗曼什语曾远及北面的格拉鲁斯和圣加伦，后来德语沿莱茵河谷扩展，库尔在1465年的一场大火后转用德语。\n\n1527年，吉安·特拉弗斯写下现存最早的罗曼什语作品。拉定人处在蒂罗尔伯爵和布里克森主教治下。弗留利由阿奎莱亚牧首统治，直到1420年被威尼斯吞并。"
 romani_group_desc: "离散印度侨民由发源于印度西北部的游牧社群构成，该族群已迁徙至中东、欧洲等多个区域。这些族群在保留其印度文化源流核心要素的同时，完成了对多元文化与生存环境的适应性调适。\n\n多姆人、洛姆人和罗姆人共同经历了一次西迁，可能分几波进行，学者认为发生在1000年前后，途经伽色尼和拜占庭的世界。罗姆人在13至14世纪经巴尔干进入欧洲，多姆人定居中东，洛姆人则在高加索。\n\n中世纪的欧洲人把这些新来者当作来自埃及的旅人，因而有了“吉卜赛人”之名。在13至14世纪建立的瓦拉几亚和摩尔达维亚，许多罗姆人被波雅尔、东正教修道院和国家奴役，从事铁匠和农业劳动。"
 romanian_group_desc: "作为达契亚人与罗马人的后裔，$romanian_group$人主要聚居在瓦拉几亚、摩尔多瓦和特兰西瓦尼亚地区，同时散居于整个巴尔干半岛。尽管被斯拉夫语民族所包围，这些族群却始终保持着鲜明的罗曼语文化特征。他们以坚韧的民族性格闻名于世，将对民间传说的热爱融入了音乐艺术、传统习俗与节庆活动之中。\n\n罗马尼亚文化组包括多瑙河以北的瓦拉几亚人、摩尔达维亚人和特兰西瓦尼亚人，以及巴尔干的阿罗马尼亚人和伊斯特拉—罗马尼亚人。瓦拉几亚在1330年前后巩固为公国，当年巴萨拉布一世在波萨达击败匈牙利王国，摩尔达维亚约在1359年出现。\n\n瓦拉几亚于1417年被迫接受奥斯曼宗主权，摩尔达维亚后来也是如此，但斯特凡大公在1457年至1504年间挡住了奥斯曼人。勇敢的米哈伊于1600年短暂地统一了瓦拉几亚、摩尔达维亚和特兰西瓦尼亚。特兰西瓦尼亚本属匈牙利王室，后来成为公国。"
 russian_group_desc: "罗斯人的源头可追溯至9世纪定居于罗斯地区的瓦良格人——来自斯堪的纳维亚的水手和战士。随着时间推移，各个罗斯民族将斯拉夫传统与北欧影响结合起来，逐渐实现了文化融合。作为拜占庭帝国的远邻，他们通过与希腊世界的文化交流和经济往来，最终形成了独特的文明风貌，在艺术、建筑和语言等领域都呈现出多元融合的鲜明特征。\n\n东斯拉夫文化组包括莫斯科人、诺夫哥罗德人、斯摩棱斯克人、鲁塞尼亚人等。988年，大公弗拉基米尔从拜占庭接受东正教。\n\n蒙古人在1237—1240年征服罗斯，金帐汗国通过莫斯科诸公统治北方。立陶宛占据了西部的土地，波兰则取得哈利奇。莫斯科于1380年在库利科沃击败金帐汗国，1478年吞并诺夫哥罗德，1480年伊凡三世终结了蒙古的统治。伊凡四世于1547年称沙皇，1613年罗曼诺夫王朝随之而来，彼得一世于1721年宣布成立俄罗斯帝国。"
 salishan_group_desc: "$salishan_group$$group_text$$salishan_language$的民族构成。\n\n萨利什族群分布在太平洋西北地区，从乔治亚海峡和普吉特湾一直延伸到爱达荷和蒙大拿：沿海的海岸萨利什人，如卢舒特西德人和哈尔科梅勒姆人；外海岸的蒂拉穆克人和察莫萨人；以及内陆的塞克维佩姆克人和萨利希人等内陆萨利什人。\n\n沿海居民住在雪松木板的长屋里，捕捞鲑鱼，并在夸富宴上散财。第一场天花疫情发生在1680年代，远早于持续接触。1792年乔治·温哥华勘测海岸，1805年刘易斯和克拉克遇到了萨利希人。温哥华堡、朗利堡和尼斯夸利堡等据点把他们卷入哈德逊湾公司的贸易网。"
 samoyedic_group_desc: "$samoyedic_group$$group_text$$nenets_language$的民族构成。\n\n萨莫耶德文化组包括西伯利亚西北部的涅涅茨人、埃涅茨人、恩加纳桑人和塞尔库普人，俄罗斯人称他们为萨莫耶德人。人数最多的涅涅茨人分为远北的苔原涅涅茨人和森林涅涅茨人，塞尔库普人则形成于鄂毕河中游。\n\n塞尔库普人在13世纪受蒙古人控制。1628年前后俄罗斯人征服并奴役了他们的土地，一次反抗俄罗斯统治的起义被枪杀镇压。17世纪，一些塞尔库普人迁往北方的塔兹河。"
 scandinavian_group_desc: "斯堪的纳维亚半岛孕育了多元的民族群体，其形成深受迁徙、贸易与文化交融的历史影响。半岛各王国在保持共同文化传承的同时，也发展出独特的身份认同。以卓越航海技艺与繁荣贸易网络著称的斯堪的纳维亚人，素以精湛的航海技术与治理能力闻名于世。\n\n斯堪的纳维亚文化组包括丹麦、瑞典和挪威的居民，以及他们在冰岛、哥得兰和北方诸岛的分支，还有处于瑞典统治下的芬兰人。维京时代，他们的航海者在欧洲各地劫掠、通商和定居，并成为最早抵达北美的欧洲人。此后几个世纪里，这一地区逐渐基督教化。\n\n1397年，丹麦女王玛格丽特一世把丹麦、瑞典和挪威连同冰岛、北方诸岛合为卡尔马联盟，部分用意是抵御汉萨同盟。瑞典在1523年随古斯塔夫·瓦萨脱离联盟，丹麦与挪威则一直联合到1814年。17世纪，瑞典崛起为帝国。"
 scottish_group_desc: "不列颠群岛北部的居民向来背景多元。土著皮克特人和坎布里亚人在被盖尔人、盎格鲁‑撒克逊人和维京人等异族吸纳入王权后­，放弃了旧有生活方式。但当面临考验时，他们仍然会团结起来对抗外来者，并发展成了一个民族：苏格兰人。\n\n皮克特人和盖尔人在9世纪建立了阿尔巴王国，此后两个世纪里，斯特拉斯克莱德的坎布里亚人和诺森布里亚的盎格鲁人先后归入其统治。12世纪，诺曼贵族迁入低地；13世纪，西部诸岛的诺斯‑盖尔人并入；15世纪，北方诸岛的诺斯人也并入。\n\n苏格兰1314年在班诺克本击败英格兰人，1328年独立获得承认。1603年苏格兰与英格兰共戴一君，1707年两国合并。"
 seeptsa_group_desc: "$seeptsa_group$$group_text$$seeptsa_language$的民族构成。\n\n塞普尔察人即西班牙人所称的乔隆人，是秘鲁安第斯山东坡瓦亚加河左岸的雨林居民。他们的塞普察语与相关的希比托语构成一个小语系。他们以刀耕火种、狩猎和捕鱼为生，把羽毛、蜂蜡和蜂蜜卖给高地的希比托人。\n\n1676年方济各会修士与他们接触并建立传教村。18世纪，修士佩德罗·德拉马塔编写了塞普察语语法。此后，克丘亚语和西班牙语取代了瓦亚加河沿岸的这种语言。"
 shan_group_desc: "尽管这个称谓最初源自缅甸语，用于指代迁移到当地的各个傣泰族群，并且与“暹”一词同源。但它最终演变成一个被这些不同族群的傣泰民族共同认同的身份标识。\n\n掸文化组包括伊洛瓦底江以东山地的傣泰各族。掸人自称“泰”。\n\n据傣泰编年史，第一个重要的掸邦于1215年建于勐广，1223年又有勐乃。1287年蒙古人攻破蒲甘后，掸邦势力壮大，勐卯在1364年灭亡了实皆和彬牙两个王国。但掸人过于分散，无力抵抗更大的邻国：明朝在1380年代征服云南，南面的缅甸王国后来也将其吞并。"
 shawnee_group_desc: "$shawnee_group$$group_text$$shawnee_language$的民族构成。\n\n肖尼族群包括俄亥俄河谷和五大湖一带的中部阿尔冈昆人：包括基斯波科、佩科维和查拉高萨在内的肖尼五个分支，以及语言相近的梅斯夸基人（福克斯人）和索克人。他们的故乡大概在俄亥俄南部，有人把肖尼人与那里的古堡文化联系起来。\n\n海狸战争中，易洛魁人把肖尼人赶出俄亥俄，他们在17世纪分散到南部高地和宾夕法尼亚。梅斯夸基人在1701—1742年的福克斯战争中与法国交战，1730年一支法军杀死了数百人。肖尼人为保住土地而战，直到1810—1813年的特库姆塞战争，19世纪30年代西迁开始。"
 shona_group_desc: "津巴布韦高原与林波波河谷使用绍纳语的民族，以大津巴布韦及其后继诸国的巨大石建围场为中心，建立了非洲最非凡的殖民前文明之一。他们对通往印度洋海岸的黄金贸易路线的控制，使其成为一个商业强国，其财富远达中国与波斯。\n\n绍纳文化组包括绍纳人、卡兰加人和文达人。文达人的传统把最早的国王同马蓬古布韦王国联系起来，该国约1300年衰落，权力北移到大津巴布韦。11世纪起，卡朗加人在高原上建立诸王国，大津巴布韦是前殖民时期南部非洲最大的石构建筑，13世纪成为他们的都城。\n\n布图阿由托尔瓦王朝统治，穆塔帕帝国则扩展到莫桑比克海岸，向斯瓦希里、阿拉伯和东亚商人出口黄金。继承战争使葡萄牙人在16世纪乘机立足，19世纪30年代恩德贝莱人摧毁了已经衰弱的罗兹维帝国。"
 shoshoni_group_desc: "$shoshoni_group$$group_text$$shoshoni_language$的民族构成。\n\n肖肖尼族群遍布大盆地：内华达西部的肖肖尼人西支和努穆诸部，犹他西部的库西乌塔人（戈休特人），以及蛇河平原的班诺克人。他们的祖先是从内华达山脉南部向外扩散的原始努米克语使用者。\n\n他们以小游群生活，每年秋季采集松子，并参加集体围猎野兔和叉角羚。马匹在1730年前传到这一地区，东部一些游群转向骑马猎野牛，分离出班诺克人。科曼奇人在约1700年前一直是肖肖尼人的一支，后来迁往南部平原。"
 sihni_group_desc: "$sihni_group$$group_text$$sihni_language$的民族构成。\n\n西尼人即玻利维亚亚马孙的伊托纳马人，居住在贝尼低地季节性泛滥的草原上，沿伊托诺马斯河分布。他们的语言自称西尼帕达拉，意为“我们的语言”，是一种没有已证实亲属的孤立语言。\n\n他们以刀耕火种、捕鱼和狩猎为生，社群很小，由村议会主持事务，崇敬名为迪南穆的至高神。1704年，传教士洛伦索·莱加尔达统计出二十六个伊托纳马社群，约六千人。此后马格达莱纳等传教镇把他们纳入基督教堂区生活。"
 siksika_group_desc: "$siksika_group$$group_text$$siksika_language$的民族构成。\n\n西克西卡族群包括西克西卡人（名称意为“黑脚”）、皮卡尼人和阿基纳人，即大平原西北部的黑脚诸族。他们说的西克西卡语是一种阿尔冈昆语，各方言分属黑脚联盟的诸部。\n\n他们的祖先是五大湖上游的林地居民，1200年前后起向西迁入平原，徒步猎野牛，把牛群驱赶过悬崖。18世纪初他们有了马匹，成为骑马的袭击者，每年夏天聚集举行奥坎，即太阳舞。他们的主要敌人是克里人和阿西尼博因人。1837年的天花重创了黑脚诸族。"
 sinu_group_desc: "$sinu_group$$group_text$$sinu_language$的民族构成。\n\n锡努人又称塞努人，是哥伦比亚北部锡努河与圣豪尔赫河谷地以及莫罗斯基略湾沿岸的农耕民族。他们的文明用运河和高台田排干季节性泛滥的草原，金匠把大量黄金放入酋长的墓中。\n\n这些黄金引来了征服者，1510年至1535年间，战争和疫病摧毁了塞努诸酋长国。1773年，西班牙王室为他们划出圣安德烈斯‑德索塔文托保留地。塞努语到19世纪初已经消亡。"
 skarureh_group_desc: "$skarureh_group$$group_text$$skarureh_language$的民族构成。\n\n斯卡鲁雷族群包括大西洋沿岸南部平原上两个说易洛魁语的民族：北卡罗来纳的斯卡鲁雷人（英国人称塔斯卡洛拉人）和弗吉尼亚的诺托韦人（自称切罗恩哈卡）。斯卡鲁雷之名意为“采麻人”，他们的母系氏族组成了三个部落的联盟。\n\n1711—1715年的塔斯卡洛拉战争以新赫罗卡堡被攻陷告终，大部分幸存者向北迁徙。1722年，奥奈达人推荐他们成为豪德诺索尼联盟的第六个成员。诺托韦人在1680年签署《中间种植园条约》，成为弗吉尼亚的纳贡者，土地逐渐被移民夺走。"
 slavic_group_desc: "斯拉夫人在罗马帝国时期起源于维斯瓦河和第聂伯河上游地区，几个世纪以来不断扩张，占领了大半个东欧。尽管分离出了不同分支并建立了众多不同的国家，但他们拥有共同的文化祖先。\n\n斯拉夫诸族在6世纪初以斯克拉维尼人和安特人之名见于拜占庭记载，到7世纪，斯拉夫人已占有中欧、东欧和东南欧的大片土地。到12世纪，东斯拉夫人居于基辅罗斯，西斯拉夫人居于波希米亚、摩拉维亚和波兰，南斯拉夫人居于保加利亚、塞尔维亚、克罗地亚和波斯尼亚。\n\n1237年，蒙古人开始征服罗斯诸公国，后来莫斯科崛起，成为东北罗斯的领袖。在巴尔干，奥斯曼人于15世纪攻占塞尔维亚和波斯尼亚；捷克诸地则在1526年归入哈布斯堡。"
 sotho_tswana_group_desc: "南部非洲高草原的索托‑茨瓦纳民族使用关系紧密的索托语和茨瓦纳语，共享着聚居村落生活、以牛为基础的财富以及精湛的冶铁工艺传统等共同遗产。他们在干旱高原内陆上的大型城镇，是前殖民时期南部非洲人口最多的聚居点之一。\n\n索托‑茨瓦纳文化组包括索托人、茨瓦纳人和洛齐人。他们的祖先约在公元200至500年间到达博茨瓦纳和高草原，到15世纪已散布在特兰斯瓦南部，并形成新的酋邦。他们保持图腾氏族，住带锥形茅草顶的圆屋。\n\n茨瓦纳酋邦由迪克戈西统治，设有咨议会，建有大型城镇：克韦嫩是15至19世纪的聚居地，卡迪茨韦内是巴胡鲁策人的文化中心，人口约一万。洛齐王国17世纪在赞比西河泛滥平原上兴起，1830年前后源自索托的马科洛洛人在塞贝通的率领下入侵并征服了它。"
 south_slavic_group_desc: "南斯拉夫是一个多元的族群，包括巴尔干半岛的数个民族。这些民族拥有共同的斯拉夫传承和语言根源，但经过几个世纪的发展已经成为了不同的文化。\n\n南斯拉夫文化组包括东阿尔卑斯山和巴尔干半岛的斯拉夫人：保加利亚人、塞尔维亚人、克罗地亚人、斯洛文尼亚人和波斯尼亚人等。晚期罗马作家在6世纪首次提到他们，称其为斯克拉维尼人，当时他们渡过多瑙河进入拜占庭诸行省。此后各族分别建国。\n\n1346年，斯特凡·杜尚加冕为塞尔维亚人和希腊人的皇帝；1377年，特瓦尔特科一世成为波斯尼亚国王。1389年奥斯曼人在科索沃获胜之后，保加利亚于1396年陷落，塞尔维亚于1459年陷落，波斯尼亚于1463年陷落。斯洛文尼亚人处于哈布斯堡统治之下，克罗地亚则在1527年接受了哈布斯堡的国王。"
 steppe_group_desc: "$steppe_group$由生活在欧亚大草原上的各种$mongolian_group$和$tatar_group$文化组成。\n\n草原族群东起蒙古高原，西至克里米亚和伏尔加河流域。铁木真于1206年被推为成吉思汗，统一了蒙古的游牧部落，他的后裔建立了史上最大的连续帝国。其西北部成为金帐汗国。\n\n1359年至1381年的大动荡之后，1396年帖木儿入侵，把金帐汗国打成若干小汗国。1480年，莫斯科在乌格拉河对峙中摆脱了鞑靼桎梏；1502年大帐汗国瓦解，留下了喀山、阿斯特拉罕、克里米亚和诺盖。在东方，1368年明朝把蒙古人赶出中国后，他们以北元的名义据有高原。"
 swiss_group_desc: "由于其地理位置，生活在瑞士高原和阿尔卑斯山的瑞士人并不完全是德意志人，因为法兰西和意大利文化在瑞士同时存在。\n\n瑞士文化组包括说德语的高地阿勒曼尼人、说法语的阿尔皮坦人、东部山谷的罗曼什人，以及汝拉边境的弗朗什孔泰人。他们的语言各不相同，却由共同的政治历史联结在一起。\n\n旧瑞士联邦于13世纪末以瑞士中部为核心形成，到14世纪中叶已加入苏黎世和伯尔尼，把乡村与城市的自治体结合起来。1470年代勃艮第战争中的胜利使联邦成为一支军事力量，1499年施瓦本战争之后它实际上已经独立。到1513年联邦已有十三个州，宗教改革又使各州因信仰而分裂。"
 ta_arawakan_group_desc: "$ta_arawakan_group$$group_text$$ta_arawakan_language$的民族构成。\n\n阿拉瓦克诸族从亚马孙和奥里诺科流域扩散到南美洲北部、圭亚那、哥伦比亚和加勒比海。其中有岛上的泰诺人、圭亚那的洛科诺人（阿拉瓦克人）、瓜希拉的瓦尤人，内陆则有亚内沙人、马齐根卡人和莫霍人。\n\n泰诺人由世袭的卡西克统治，崇拜称为泽米的神灵像。1492年他们成为哥伦布遇到的第一批美洲人，监护征赋制和疫病摧毁了他们；卡西克恩里基略的起义持续于1519年至1533年。洛科诺人对西班牙保持距离，与荷兰人和英国人通商，荷兰人1616年建立了埃塞奎博。"
 takic_group_desc: "$takic_group$$group_text$$takic_language$的民族构成。\n\n塔基克族群包括南加利福尼亚的通瓦人、塔克坦人（即塞拉诺人）和卡维拉人，通瓦人分布在洛杉矶盆地。塔基克语使用者从莫哈维沙漠西部的故乡南下进入加利福尼亚沿海，据有南部海峡群岛以及内陆的沙漠和山地。\n\n1542年，胡安·罗德里格斯·卡布里略遇到了沿海的塔基克语居民。1769年之后，圣加百列等西班牙传教站（1771年建立）设在他们的土地上，持续接触由此开始。强制迁居、强制劳动和疫病摧毁了传教站里的居民；他们发动了1785年托伊普里娜起义和1812年塞拉诺人与卡维拉人的起义。1830年代的传教站世俗化使大多数幸存者失去了土地。"
 tanoan_group_desc: "$tanoan_group$$group_text$$tanoan_language$的民族构成。\n\n塔诺族群包括新墨西哥的普韦布洛诸民族，说蒂瓦语、特瓦语和托瓦语，以及大平原上的基奥瓦人。普韦布洛人住在格兰德河及其支流沿岸的农耕城镇。\n\n1540年，科罗纳多的远征军在蒂瓜克斯战争中攻打蒂瓦人的普韦布洛；1598年，胡安·德·奥尼亚特建立了第一个西班牙殖民地。1680年，普韦布洛人在波佩领导下起义，把西班牙人赶出了新墨西哥。基奥瓦人原居蒙大拿西部，17至18世纪南迁进入科罗拉多的落基山，19世纪初到达南部平原，在那里骑马猎捕野牛。"
 tarairiu_group_desc: "$tarairiu_group$$group_text$$tarairiu_language$的民族构成。\n\n塔拉伊留人是巴西东北部的一个民族，沿海居民称他们为塔普亚人。他们的语言只留下少量词表，无法归类。他们住在阿苏河与阿波迪河之间干旱的内陆，分成约二十来个群体，如让杜伊人和卡尼恩代人。\n\n他们随河流的涨落迁移，腰果成熟时下到海岸，用投矛器和棍棒狩猎，也种玉米和木薯。阿尔贝特·艾克霍特为荷兰人画过一名塔拉伊留战士。17世纪，他们与荷兰人并肩对抗葡萄牙人，葡萄牙人在1630年至1730年前后持续对他们用兵。"
 tatar_group_desc: "鞑靼人的起源可以追溯到中亚的突厥和蒙古族群，被广泛用来指代伏尔加河和克里米亚鞑靼人等游牧部落。每一个子族群都拥有自己独特的历史、语言和文化传统，并主要通过伊斯兰教联系在一起，体现了伊斯兰文化在他们居住的区域的影响力。\n\n鞑靼文化组分布在伏尔加河流域、克里米亚和黑海草原。鞑靼最初是一个草原部落联盟的名称，被成吉思汗并入蒙古帝国，后来成为金帐汗国境内居民的通称。他们说钦察突厥语族的语言。\n\n金帐汗国解体之际，喀山、克里米亚和阿斯特拉罕三个汗国在15世纪相继出现。克里米亚汗在1475年成为奥斯曼的附庸，并在1571年焚烧了莫斯科。俄国的伊凡四世于1552年征服喀山，1556年征服阿斯特拉罕，俄国又在1783年吞并克里米亚。"
 tayrona_group_desc: "$tayrona_group$$group_text$$tayrona_language$的民族构成。\n\n泰罗纳人是圣玛尔塔内华达山区的一组酋邦，位于今哥伦比亚的加勒比海岸，至10、11世纪已自成传统。城镇建在石砌台地上，以铺石道路相连；约800年建于布里塔卡河畔的迷城可能住过数千人。他们种植玉米和木薯，用坦巴加合金（金、银、铜的合金）铸造金饰。\n\n泰罗纳这个名称似乎出自北坡的一个酋邦泰罗，西班牙人把它扩大用于整个地区。最初的接触尚能相安，16世纪冲突加剧，约1600年前后，一部分人退入更高的山区。"
 thai_group_desc: "原初的泰人起源于中国南方，后来迁徙到昭披耶河谷定居，发展出了独特的身份认同，将其原始传统与孟人和高棉人的影响融为一体。\n\n泰文化组汇集了说傣泰语的各族，他们散居在中国南方和中南半岛，主要靠语言辨识，其中有壮族、傣族、佬族和泰族。1238年，西·因陀罗提起兵反抗高棉人，建立素可泰王国。\n\n兰甘亨在位期间（1279—1298）素可泰疆域最广，据说是他引入了上座部佛教和最初的泰文。此后素可泰衰落，邻近的阿瑜陀耶王国于1349年入侵，并在1438年将其吞并。"
 tibetan_group_desc: "生活在青藏高原与喜马拉雅山区的藏族人民，早已适应了这里严酷的气候与险峻的地形。\n\n藏文化组东起康区和安多，西至拉达克，南及不丹。组内各族说藏语支语言，一般认为是古代羌人的后裔，信奉藏传佛教或本土的苯教。\n\n7世纪，松赞干布建立吐蕃，鼎盛时势力远及长安。吐蕃瓦解后，各地由寺院和贵族分治。萨迦派在13世纪起于元朝治下执掌藏地，1354年被绛曲坚赞的帕木竹巴政权取代。1642年，固始汗扶立格鲁派的五世达赖喇嘛执掌西藏。"
 tibeto_burman_group_desc: "在历史早期，这些族群从青藏高原迁徙而来，逐渐分布到包括印度在内的多个地区。然而，这些族群的发展轨迹并不一致：有些形成了高度发达的社会体系，而另一些则长期维持着相对原始的部落生存方式。\n\n藏缅文化组汇集了汉藏语系中汉语以外诸语言的使用者，分布从喜马拉雅山区经印度东北部和缅甸，直到中国西南。其中最大的有缅甸人、卫藏和安多等藏人、彝人、克伦人，以及加德满都谷地的尼瓦尔人。藏语和缅甸语的文字传统分别始于7世纪和12世纪。\n\n统一了伊洛瓦底江流域的蒲甘王朝于1287年亡于蒙古人。在西藏，萨迦派喇嘛在蒙古人的扶持下执政，1642年格鲁派的达赖喇嘛在固始汗的支持下成为统治者。党项人建立的西夏则于1227年被蒙古人灭亡。"
 timoto_group_desc: "$timoto_group$$group_text$$timoto_language$的民族构成。\n\n蒂莫托人是委内瑞拉西部安第斯山区的农耕民族，通常与邻近的奎卡人合称蒂莫托‑奎卡人。他们住在查马河与莫塔坦河的山谷中，大致在后来的梅里达、特鲁希略和塔奇拉一带，语言与哥伦比亚的穆伊斯卡人相近。\n\n他们在山坡上修筑灌溉梯田，种植玉米、土豆和豆类，住在带蓄水池的石木结构常住村落里，并交易棉花、盐和可可。他们留下了精美的陶器，却没有大型纪念建筑。据委内瑞拉史家记述，1549年蒂莫托人和奎卡人联合起来，在埃斯库克抵抗西班牙人，把对方赶回了埃尔托库约。"
 timucua_group_desc: "$timucua_group$$group_text$$timucua_language$的民族构成。\n\n蒂穆夸人是佛罗里达东北部、中北部和佐治亚东南部最大的原住民，约有35个酋邦，说同一种语言的不同方言，从未统一在一个首领之下。这一组还包括西南海岸的卡卢萨人，他们以渔业为基础，在卡洛斯城建立了强大的政权；以及坦帕湾一带的托科巴加人。\n\n1564年，法国胡格诺教徒在萨图里瓦人中建立卡罗琳堡；1565年西班牙人建立圣奥古斯丁，并在蒂穆夸人的城镇设立传教站。疫病使蒂穆夸人口到1595年从约20万降至5万，1700年只剩约一千人；1703年，卡罗来纳的詹姆斯·摩尔率队劫掠奴隶，又杀死并掳走数百人。"
 totozoquean_group_desc: "$totozoquean_group$$group_text$$totozoquean_language$的民族构成。\n\n托托索克族群汇集了墨西哥南部几支语言被认为同出一源的民族：韦拉克鲁斯的托托纳克人、恰帕斯的索克人、瓦哈卡的米赫人，以及特万特佩克地峡的伊科奥特人（即休亚韦人，其语言可能是近亲）。一些学者把说米赫‑索克语的人与奥尔梅克人联系起来，但这一说法有争议。\n\n15世纪中叶起，托托纳卡潘的托托纳克人遭阿兹特克人进攻，叛乱不断。1519年，森波阿拉是埃尔南·科尔特斯进军特诺奇蒂特兰途中最先抵达的原住民城邦。1523年，路易斯·马林开始征服索克人的土地，索克人被分配给殖民者；米赫人则守住了山区，抵住了西班牙人的进攻。"
 truka_group_desc: "$truka_group$$group_text$$truka_language$的民族构成。\n\n特鲁卡人是巴西东北部的原住民，居住在伯南布哥州卡布罗博的圣弗朗西斯科河中，阿松桑群岛的岛屿上。他们原来的语言已经消亡，也没有留下记录。"
 tsehesenestsestotse_group_desc: "$tsehesenestsestotse_group$$group_text$$tsehesenestsestotse_language$的民族构成。\n\n夏延人是大平原上说阿尔衮琴语的民族，由两个关系密切的部落构成，即齐齐斯塔斯人和苏泰人，两者口音略有差异。17世纪他们住在密西西比河与明尼苏达米勒拉克斯湖之间，采集野生稻并猎捕野牛。\n\n在阿西尼博因人和后来的拉科他人的压迫下，他们向西迁移，1676年到达密苏里河。他们在那里与曼丹人、希达察人和阿里卡拉人为邻，吸收了对方生活方式的许多内容。约1730年，他们把马引介给拉科他人。到1776年，拉科他人夺取了他们靠近黑山的大片土地；1811年前后，夏延人与阿拉帕霍人结盟，并扩展到中部平原各地。"
 tshon_group_desc: "$tshon_group$$group_text$$tshon_language$的民族构成。\n\n聪族群得名于巴塔哥尼亚和火地岛的聪语系，该名称来自塞尔克南语中的“人”。它包括巴塔哥尼亚草原上的特维尔切人（又称奥尼肯克人）、火地岛东北部的塞尔克南人、特乌申人，以及潘帕斯草原上的古纳库内人和基兰迪人。\n\n1520年，麦哲伦的船员在圣胡利安遇见特维尔切人，称他们为巴塔贡人。1536年，基兰迪人用投石索击溃了佩德罗·德·门多萨新建的布宜诺斯艾利斯派出的西班牙军队；西班牙人丢弃牲畜后，他们学会了骑马。1599年，奥利维尔·范诺尔特率领的荷兰舰队在麦哲伦海峡与塞尔克南人交战，约四十人死亡。"
 tsimshian_group_desc: "$tsimshian_group$$group_text$$tsimshian_language$的民族构成。\n\n钦西安人的名称意为“斯基纳河之内”，是太平洋西北海岸的民族，住在斯基纳河下游和今不列颠哥伦比亚北部的海岸。据口述历史，其中一部分人原先住在斯基纳河上游很远的地方，灾祸之后迁到海岸，建立了基特卡特拉；尼斯加人和吉克桑人则留在内陆。\n\n他们冬天住在鲁珀特王子港周围的村落，那里的人类居住史已有约5000年；鲑鱼洄游时，他们回到斯基纳河上的夏季村落。社会实行母系制，设氏族和世袭酋长，地位在夸富宴上得到确认。欧洲人大约在1787年首次到达，1834年哈德逊湾公司把堡垒迁到拉克夸拉姆斯。"
 tucanoan_group_desc: "$tucanoan_group$$group_text$$tucanoan_language$的民族构成。\n\n图卡诺族群汇集了亚马孙西北部说图卡诺语系语言的民族，包括哥伦比亚与巴西的卡拉帕纳人、普图马约河和厄瓜多尔边界一带的西奥纳人，以及住在奥尔特瓜萨河一带、语言已经消亡的塔马人。\n\n他们是刀耕火种的农民，在林中空地种木薯，也狩猎、捕鱼和采集。西奥纳人是西班牙人称为恩卡贝亚多斯（长发人）的那些人的后裔。耶稣会士1599年首次造访他们，18世纪间把他们聚集到传教村，但这些传教区没有成功，耶稣会士后来也被驱逐。"
 tungusic_group_desc: "$tungusic_group$民族分布于满洲及西伯利亚东部大部分地区，传统上以狩猎与贸易为生。这些群体适应了故土的严酷环境，通常以氏族结构作为社会组织形式。\n\n通古斯人的故地一般认为在满洲东北部的黑龙江一带，鄂温克人由此扩散到整个西伯利亚。南部的女真人也从事农耕，兀狄哈、乌尔奇等黑龙江沿岸的民族则接受了中国的习俗。\n\n女真人于1115年建立金朝，1127年夺取华北，1234年被蒙古人灭亡。明朝时他们被分为建州、海西和野人三部。17世纪初，努尔哈赤把大部分女真人统一在八旗之下；1635年，皇太极将其改称满洲。"
 tupi_group_desc: "$tupi_group$$group_text$$tupi_language$的民族构成。\n\n图皮族群包括说图皮‑瓜拉尼诸语的众多民族，分布在巴西东部和巴拉圭河流域：大西洋沿岸的图皮南巴人、图皮尼金人、波蒂瓜拉人和塔巴雅拉人，以及巴拉那河与巴拉圭河一带的瓜拉尼人。沿海的图皮人就是葡萄牙人最先遇到的居民；古图皮语后来成为欧洲人与原住民之间的通用语，留下了教理问答、诗歌和戏剧。\n\n1572年的安德烈·泰韦、1578年的让·德·莱里和汉斯·施塔登都描写过图皮南巴人，包括他们的食人习俗，这些记述影响了蒙田论食人族的文章。1537年，贡萨洛·德·门多萨在瓜拉尼人中建立亚松森；1585年耶稣会士抵达巴拉那，1608年获准在瓜伊拉诸部中传教。"
 turkic_group_desc: "突厥人自几个世纪以前兴起于亚洲大草原以来已经走过了漫漫长路。他们的土地从黑海到蒙古草原再到波斯，与许多其他文化和族群有了交流，并分化为众多不同的族群，不过仍保留着共同的突厥身份。\n\n突厥人的祖先，即原始突厥语的使用者，很可能生活在阿尔泰—萨彦岭、蒙古或图瓦一带，后来转为游牧。“突厥”一名最先用于6世纪碑铭中提到的阿史那突厥，735年的鄂尔浑碑铭是现存最早的突厥文字。\n\n塞尔柱突厥人在1071年曼齐克特战役后进入安纳托利亚，奥斯曼人约从1300年起在那里崛起，并在1453年攻占君士坦丁堡。在草原上，说突厥语的各族构成了金帐汗国的主体。萨哈人则远居西伯利亚北部。"
 tutelo_group_desc: "$tutelo_group$$group_text$$tutelo_language$的民族构成。\n\n图特洛族群汇集了弗吉尼亚和卡罗来纳山麓、卡诺瓦河谷以及俄亥俄河上游的原住民，其中多数说苏语系语言。图特洛人和莫纳坎人住在弗吉尼亚的瀑布线以西；莫内顿人的名称意为“大水”，住在卡诺瓦河谷；奥夫人（又称莫索佩莱亚人）在俄亥俄河上游一带有村落。\n\n17世纪后期，在英国殖民者和易洛魁人的压力下，图特洛人与相关各族联合，合称纳伊辛人。奥夫人受易洛魁人攻击，南迁到密西西比河下游，在路易斯安那与图尼卡人和比洛克西人同住。1740年，图特洛人已离开家园；1753年，他们被卡尤加人收养。"
 txapakura_group_desc: "$txapakura_group$$group_text$$txapakura_language$的民族构成。\n\n查帕库拉人是查帕库拉语系的各民族，曾分布在玻利维亚北部的布兰科河、瓜波雷河、马莫雷河一带和巴西的隆多尼亚。语言包括查帕库拉语、莫雷语和瓦里语。"
 uru_group_desc: "$uru_group$$group_text$$uru_language$的民族构成。\n\n乌鲁人说乌丘马塔库语，是安第斯高原湖泊的渔民和采芦者，分布在的的喀喀湖、波波湖和德萨瓜德罗河一带。他们自称卢皮哈克斯，意为“太阳之子”，认为湖和湖水属于自己。在的的喀喀湖上，他们住在用托托拉芦苇扎成的浮岛上，遇到威胁时浮岛可以移走。\n\n乌鲁人与岸上的艾马拉人通商通婚，逐渐放弃了自己的语言而改说艾马拉语。印加人征服后，他们要缴纳贡赋，也常被沦为奴隶。从1722年起，乌鲁人与艾马拉人之间发生了冲突。"
 volta_niger_group_desc: "尼日利亚地区的沃尔特‑尼日尔民族使用尼日尔‑刚果语系沃尔特-尼日尔语支的语言，包括西非人口最多、政治组织最为复杂的一些社会。约鲁巴城邦、伊格博乡村共和国以及贝宁王国是非洲大陆上成就最高的政体之列。\n\n沃尔特‑尼日尔文化组包括尼日利亚南部的约鲁巴人、埃多人、伊博人、伊乔人、努佩人和伊加拉人。约鲁巴圣城伊费在1200至1400年间出产写实风格的青铜头像，后来奥约帝国成为约鲁巴人的头号强国。\n\n在贝宁，埃多人的奥巴埃瓦雷自1440年起扩大王国，葡萄牙人于1485年抵达。伊博人以乡村会议自治，奉恩里祭司王为宗教权威；伊乔人则在尼日尔河三角洲捕鱼和贸易。奥约帝国在19世纪20至30年代因内乱和富拉尼人的压力而瓦解，都城奥约伊莱于1835年陷落。"
 wakashan_group_desc: "$wakashan_group$$group_text$$wakashan_language$的民族构成。\n\n瓦卡什族群汇集了西北海岸的民族，分布在温哥华岛、不列颠哥伦比亚中部海岸和华盛顿州的弗拉特里角。努特卡人（努查努尔特人）和马卡人在外海岸猎捕鲸鱼；夸扣特尔人（夸夸嘉夸人）的社会分贵族、平民和奴隶，等级在夸富宴上展示；海尔楚克人和海斯拉人住在更北的地方。\n\n1778年詹姆斯·库克在尤库特停泊，开启了海上皮毛贸易；西班牙与英国争夺努特卡湾，引发约1790年的努特卡危机。1803年，努查努尔特首领马奎纳夺取了美国商船波士顿号。从最初接触到1830年，九成以上的努查努尔特人死于疫病。"
 waqha_group_desc: "$waqha_group$$group_text$$waqha_language$的民族构成。\n\n瓦卡族群得名于比莱拉人，他们自称瓦坎巴莱尔特，意为“说瓦卡语的人”。这一组还包括两个近邻：圣地亚哥‑德尔埃斯特罗的托诺科特人和科尔多瓦的萨纳维龙人。比莱拉人在图库曼北部和圣地亚哥‑德尔埃斯特罗北部狩猎采集，托诺科特人则过定居的农耕生活。\n\n约1480年，印加帝国占领了阿根廷西北部，并纳入了一部分托诺科特人。萨纳维龙人是托诺科特人的一支，向西南扩展进入科尔多瓦山地，18世纪大体融入了殖民地居民。西班牙人征服图库曼后，比莱拉人东迁进入查科；1735年至1763年间，耶稣会在他们的土地上建立了三处传教站。"
 warao_group_desc: "$warao_group$$group_text$$warao_language$的民族构成。\n\n瓦劳人的名称意为“船民”，住在委内瑞拉东北部的奥里诺科河三角洲，那里溪流沼泽交错，独木舟是主要的交通工具。他们的房屋建在水面上的高脚桩上，食物主要取自三角洲：鱼、应季的螃蟹和莫里切棕榈，到1500年前后已有基本的园艺种植。\n\n哥伦布到达奥里诺科河三角洲不久，阿隆索·德·奥赫达溯河而上，看到了瓦劳人的高脚屋。据说它们与锡纳马伊卡的水上房屋相似，使委内瑞拉（“小威尼斯”）得名。"
 warpe_group_desc: "$warpe_group$$group_text$$warpe_language$的民族构成。\n\n瓦尔佩人是阿根廷中部库约地区、安第斯山麓的农耕民族。自5世纪起，他们住在50至100人的固定村落里，种植玉米、豆类、南瓜和藜麦。到15世纪，他们的土地北起哈查尔河，南至迪亚曼特河，说相近的阿连蒂亚克语和米尔卡亚克语。\n\n他们从未完全并入印加帝国，但1480年前后以后采用了印加人放牧美洲驼的做法和克丘亚语。西班牙统治下，在库约持有监护征赋制授地的智利监护主，把瓦尔佩人带过安第斯山运到智利，雇给没有授地的其他西班牙人。"
 wendat_group_desc: "$wendat_group$$group_text$$wendat_language$的民族构成。\n\n温达特人是说易洛魁语的四部落联盟，法国人称之为休伦人，住在温达克，即今安大略省乔治亚湾与辛科湖之间。他们的村落有木栅围护，建有长屋，居民共约2万至4万人。他们的亲族提奥农塔特人，即法国人所称的彼特恩（意为“烟草”人），住在西南方。\n\n1609年，阿伦达罗农部的阿蒂龙塔在魁北克与法国人结盟；1615年，塞缪尔·德·尚普兰与他们会面。1634年至1640年，麻疹和天花重创了他们。1647年，易洛魁人在荷兰火器的供应下发动大规模进攻，1649年摧毁温达克，温达特人与彼特恩人四散。难民西逃到奥达瓦人那里，1701年前后在底特律附近定居，成为怀恩多特人。"
 west_african_group_desc: "尽管在文化、语言乃至宗教信仰方面存在显著差异，但西非与萨赫勒地区的人们却因几个世纪以来的密切互动，孕育出一系列共同的特质。这种独特身份认同的形成，得益于北部的撒哈拉沙漠与南部的茂密丛林所形成的天然屏障——这些相对封闭的地形反而促使当地居民展开了更为频繁的横向交流。\n\n西非文化组包括曼丁戈人、桑海人、莫西人、豪萨人和加奈姆布人。黄金和盐的贸易把他们的地区与北非联系起来。\n\n加纳帝国之后，马里帝国在13世纪兴起，其君主曼萨·穆萨于1324年前往麦加朝圣。桑海在15世纪取代马里成为主导势力，并在1591年败于摩洛哥军队。葡萄牙商人在15世纪抵达沿海，开启了大西洋奴隶贸易。"
 xinka_group_desc: "$xinka_group$$group_text$$xinka_language$的民族构成。\n\n辛卡人是危地马拉东南部太平洋平原和高地上的非玛雅民族，居住在后来的圣罗莎和胡蒂亚帕一带。他们的语言没有已知的亲属，虽然借用了许多玛雅语词汇；他们可能比玛雅人和皮皮尔人更早住在这里。\n\n1524年，佩德罗·德·阿尔瓦拉多率领250名西班牙步兵和约6000名原住民盟军穿过辛卡人的土地，经过激烈的白刃战，攻占了他们最重要的城市阿蒂基帕克，位置大致在塔克西科一带。此后辛卡人以可可、棉花、盐和香草纳贡，许多人被沦为奴隶，被迫参加征服萨尔瓦多的战事。1575年以后，随着人口被送往他处，他们的文化和语言迅速衰落。"
 yaghan_group_desc: "$yaghan_group$$group_text$$yaghan_language$的民族构成。\n\n雅甘人又称亚马纳人，住在火地岛以南沿比格尔海峡和合恩角一带的岛屿上，是世界上最靠南的民族。他们是乘独木舟在岛屿之间迁移的游猎民：男子猎海狮，女子潜水采贝，也吃搁浅的鲸肉、浆果和蘑菇。\n\n他们分成若干地方群体，如分布在比格尔海峡两岸的瓦基马拉人。他们的语言与邻近的乔诺人和卡韦斯卡尔人这两个乘舟民族完全不同，但生活方式相近。19世纪初，水手们称他们为火地人，这个名称据说是詹姆斯·韦德尔在1822年起的。"
 yukaghir_group_desc: "$yukaghir_group$$group_text$$yukaghir_language$的民族构成。\n\n尤卡吉尔文化组汇集了说尤卡吉尔语的西伯利亚狩猎民族，中心在科累马河流域。17世纪俄国人到来时，尤卡吉尔诸部占据着从勒拿河到阿纳德尔河口的土地，其中有楚万人和定居的阿瑙尔人。一般认为他们是新石器时代伊米亚赫塔赫文化的后裔。\n\n他们追逐驯鹿、驼鹿、野羊和紫貂，兼事捕鱼，饲养的驯鹿主要用于运输，住的是锥形的帐篷“楚姆”。他们的语言包括苔原尤卡吉尔语和科累马尤卡吉尔语，来源不明。疫病、战争和俄国统治使其人口减少，许多人被雅库特人、埃文人和俄罗斯人同化。"
 yuki_group_desc: "$yuki_group$$group_text$$yuki_language$的民族构成。\n\n尤基人是加利福尼亚北部的民族，传统上分为三支：乌科姆诺奥姆人（山谷人）、胡奇诺姆人（谷外人）和沿海尤基人（海岸人）。他们的地域包括朗德谷和后来的门多西诺县北部、莱克县的大部分。\n\n他们住在用树皮、草和松针搭成的圆锥形房屋里，还建有大型舞屋，使用自己的语言，与周围邻族的语言不同。他们的信仰以独行者泰科莫尔和他的助手郊狼为中心，也相信山中能治病也能致病的神灵。据克罗伯估计，1770年约有3000名尤基人。"
 yupik_group_desc: "$yupik_group$$group_text$$yupik_language$的民族构成。\n\n尤皮克族群汇集了阿拉斯加西南部和南部的爱斯基摩人与阿留申人，他们与因纽特人关系密切。中阿拉斯加尤皮克人住在育空‑库斯科奎姆三角洲和布里斯托尔湾沿岸，夏季住渔营、冬季住村落；阿卢蒂克人（又称苏格皮亚克人）住在威廉王子湾和科迪亚克群岛；乌南甘人（即阿留申人）沿阿留申群岛分布，在欧洲人到来之前约有2.5万人。\n\n1784年，格里戈里·谢利霍夫的手下在避难岩屠杀了数百名苏格皮亚特人，俄国人随后占据阿卢蒂克人的土地。19世纪初，科迪亚克有六十多个阿卢蒂克村落。19世纪20年代，俄美公司把阿留申人家庭迁到科曼多尔群岛和普里比洛夫群岛。"
 yutonahua_group_desc: "$yutonahua_group$$group_text$$southern_yutonahua_language_family$的民族构成。\n\n犹他‑纳瓦族群汇集了墨西哥北部和西部以及美国西南部说犹他‑阿兹特克语系语言的民族：中部高原的夸奇奇特尔人、萨卡特卡人和卡什坎人，西北部的特佩万人、亚基人和拉拉穆里人，以及亚利桑那的霍皮人。\n\n卡什坎人在1540年至1542年的米克斯顿战争中起兵反抗西班牙人；1550年至1600年的奇奇梅克战争，是西班牙人在这条边疆上打得最久、花费最大的一场战事。1533年迭戈·德·古斯曼遇到的亚基人约有3万人，分住80个村落，1608年击败了西班牙人。特佩万人在1616年起事，到1620年被镇压。"
 zamuco_group_desc: "$zamuco_group$$group_text$$zamuco_language$的民族构成。\n\n萨穆科族群包括阿约雷奥人和伊希尔人（即查马科科人），都是大查科地区说萨穆科诸语的民族；这个小语系分布在巴拉圭和玻利维亚的查科东北部。阿约雷奥人住在巴拉圭河、皮尔科马约河、帕拉佩蒂河和格兰德河之间，是跨两国游荡的狩猎采集者。伊希尔人住在巴拉圭，其中埃比托索人沿巴拉圭河居住，托马拉霍人住在森林里。\n\n耶稣会士在18世纪20年代创建圣伊格纳西奥‑萨穆科传教站，借此首次接触阿约雷奥人，试图使他们皈依天主教。传教站在18世纪40年代废弃，此后阿约雷奥人被长期放任不管。"
 zuni_group_desc: "$zuni_group$$group_text$$zuni_language$的民族构成。\n\n祖尼人是新墨西哥西部的普韦布洛民族，源出莫戈永文化和祖先普韦布洛文化，以灌溉农业为生。他们的语言是孤立语言，与其他美洲原住民语言都没有已知的亲缘关系。\n\n1539年，马科斯·德·尼萨修士的西班牙远征队先派奴隶埃斯特万尼科前行，祖尼人把他当作间谍杀死了。1680年普韦布洛起义之前，他们住在六个村落里；起义期间，他们到多瓦亚兰内台地顶上避难，直到1692年。他们的三处西班牙传教站中只有哈洛纳在重新征服后得到重建；到18世纪晚期，西班牙人已不再指望控制他们。"
 agwu_nsi_god_desc: "$agwu_nsi_god$是占卜和治疗之神。\n\n阿格乌受伊博人供奉，伊博人称神灵为阿鲁西。伊博宗教传到美洲之后，他又被称为阿格沃·恩西。"
 ak_ana_god_desc: "[ShowGodName('ak_ana_god')]是[ShowCultureGroupName('turkic_group')]人的水之女神。\n\n白母意为“神圣的母亲”，是突厥人的原初创世女神，西伯利亚的汉特人和曼西人也知道她。她是凯尔拉的女儿和配偶。水被认为早于大地而生，所以她是大地的姐姐。\n\n在一则创世神话里，凯尔拉化作白鹅，飞越无边的水面，白母催促他去创造。神鸭随后从水底衔来淤泥，大地就由此造成。"
 aki_pen_god_desc: "$aki_pen_god$是[ShowReligionAdjective('koyapunem_religion')]中的乡村守护神。\n\n贡德人在任何节庆开始之前，都要把阿吉宾与村母神一同祭拜。贡德人真正热烈供奉的，主要是这类村神和氏族神，而不是至高神婆罗提乌。"
 akuj_god_desc: "$akuj_god$是$otuho_culture$族群的至高神。\n\n阿库吉同样是图尔卡纳湖一带半游牧的图尔卡纳人的至高存在，他们认为他创造了世界，掌管水、食物、牲畜和子嗣。名叫恩吉穆罗克的占卜师传达他的意愿，并指明该献祭哪些牲畜。"
 alwet_god_desc: "$alwet_god$是[ShowReligionAdjective('muonyjang_religion')]中的雨之女神。\n\n阿尔韦特被算作丁卡人天神尼雅力克的后代。尼雅力克本人也掌管降雨。"
 amadioha_god_desc: "$amadioha_god$是[ShowReligionAdjective('odinala_religion')]中的雷电之神。\n\n阿马迪奥哈的名字意为“人民之人”，也是伊博人的正义之神，是伊博诸神中最受欢迎的之一。他借雷声说话，用闪电打击；闪电由他向大地投下的雷石造成，他击杀压迫者，为受压迫者复仇。他的象征是白公羊，主神龛在奥祖祖。\n\n被他判为有罪的人会被雷劈死，或被蜂群蜇死，尸体不得埋葬。人们向他起誓。"
 anansi_god_desc: "$anansi_god$是[ShowReligionAdjective('akan_religion')]中的诡计之神和民间英雄。\n\n阿南西又作阿南塞，形象是一只蜘蛛，名字就是“蜘蛛”的意思，象征故事、智慧和狡黠。在加纳南部的故事里，他靠机智胜过比他强大的对手。\n\n在一则故事里，他披上鸟的羽毛飞去，为天神尼亚梅探出一个山药的名字，由此成了尼亚梅的信使。这些故事随大西洋奴隶贸易传到美洲。"
 andriamahilala_god_desc: "$andriamahilala_god$是[ShowReligionAdjective('fomba_gasy_religion')]中的第一个女人，每月都会死亡并重生，因此被与月亮联系在一起。\n\n安德里亚玛希拉拉和丈夫安德里亚姆巴霍马纳纳子孙众多。之后创世神扎纳哈里认为需要有死亡，便问他们想要怎样的死法；她的丈夫选择像香蕉树那样死去，香蕉树枯死时会长出新芽。"
 andriambahomanana_god_desc: "$andriambahomanana_god$是[ShowReligionAdjective('fomba_gasy_religion')]中的第一个男人。\n\n安德里亚姆巴霍马纳纳和妻子安德里亚玛希拉拉生了许多孩子，孩子们又有了自己的孩子。扎纳哈里见到死亡不可或缺，便问他们想要怎样的死法。安德里亚姆巴霍马纳纳选择像香蕉树那样死去，枯死时会长出新芽；安德里亚玛希拉拉则选择像月亮那样，每个月死去又重生。"
 andrianerinerina_god_desc: "$andrianerinerina_god$是[ShowGodName('zanahary_god')]的儿子，王室的初祖。\n\n安德里亚内里内里纳出现在梅里纳人几种相互竞争的起源神话之一中。他降到安加沃凯利北面的阿内里内里纳，同岛上最早的居民瓦济姆巴人玩耍。\n\n瓦济姆巴人不顾警告，煮了他的一只羊，他吃下禁忌的羊肉后便无法回家。扎纳哈里让瓦济姆巴人在被毁灭和臣服于他之间选择，他们选择臣服，于是扎纳哈里派女儿安德里亚马尼特拉给他做妻子。"
 anyame_god_desc: "$anyame_god$是[ShowCultureName('akan')]人的至高神和天父。\n\n尼亚梅又称奥尼亚梅或尼扬科蓬，受加纳阿肯人崇拜，他的名字被解释为无所不知、无所不见者。在一些阿肯叙述里，他的妻子是大地女神阿萨塞亚。\n\n作为创造者奥多芒科马，他创造了宇宙、生命和死亡。拟人化为奥乌奥的死亡后来杀死了他，他的灵魂随即归入尼扬科蓬。故事里他的信使是蜘蛛阿南西。"
 aphrodite_god_desc: "[ShowGodNameWithNoTooltip('aphrodite_god')]是爱、欲望、美与社会和谐之神。\n\n阿佛洛狄忒在希腊的主要崇拜中心是基西拉、塞浦路斯、科林斯和雅典，雅典每年举行阿佛洛狄忒节。《伊利亚特》说她是宙斯与狄俄涅之女，赫西俄德则说她由海中泡沫而生。\n\n她嫁给了锻造之神赫淮斯托斯，却以阿瑞斯为情人，还是引发特洛伊战争的三位争执女神之一。罗马人称她为维纳斯。"
 ares_god_desc: "[ShowGodNameWithNoTooltip('ares_god')]司掌战争中暴力和破坏性的一面。\n\n阿瑞斯是宙斯与赫拉之子，奥林匹斯十二主神之一。他代表战争所需的血气之勇，许多希腊人对他心情复杂。他的姐姐雅典娜则掌管谋略。\n\n他可能起源于色雷斯。神话里他常被羞辱：赫淮斯托斯用网把他和阿佛洛狄忒困在一起，特洛伊战争中他站在特洛伊一边，结果战败。罗马人把地位更尊崇的马尔斯与他相对应。"
 asase_ya_god_desc: "$asase_ya_god$是[ShowCultureName('akan')]人的爱情、生育和大地女神。\n\n阿萨塞亚还司掌和平与真理。她的名字意为“星期四出生的大地”；芳蒂人称她为阿萨塞阿芙娃，即星期五出生的。她是天神尼扬科蓬的妻子，生下了贝亚和塔诺。\n\n没有神庙专门供奉她。阿散蒂人和其他阿肯人在田间向她献祭，据说博诺人是她最眷顾的人。作为年迈的大地母亲，她还接纳死者。"
 asis_god_desc: "$asis_god$是$kalenjin_culture$族群信奉的创世神。\n\n阿西斯是肯尼亚卡伦津人的太阳神和至高神，居于天上，全能，也是正义的保证者。\n\n在更早的卡伦津信仰里，阿西斯只是天神托罗鲁特的弟弟，被认为在旱季发怒。后来对阿西斯的崇拜取代了旧信仰，似乎是在接触南部库希特人之后。南迪人的创世故事说，太阳与月亮结为夫妻，下到地上安排世间的秩序。"
 athena_god_desc: "[ShowGodNameWithNoTooltip('athena_god')]是智慧、战略和有序作战之神。\n\n雅典娜是雅典的守护神，也是手工艺女神，卫城上的帕特农神庙就是献给她的。神话中她从宙斯的前额诞生。她创造了第一棵橄榄树，从波塞冬手中赢得了这座城市，主要节日是泛雅典娜节。\n\n她作为“冲锋的雅典娜”引领士兵上阵，也帮助过珀尔修斯、赫拉克勒斯和奥德修斯等英雄。文艺复兴以来，西方艺术家把她塑造成智慧、学问和自由的象征。"
 ayum_god_desc: "$ayum_god$是丁卡族群信奉的风之女神。\n\n阿尤姆被算作丁卡人天神尼雅力克的后代，常被说成阻止降雨的力量。"
 bai_baianai_god_desc: "[ShowGodName('bai_baianai_god')]是[ShowCultureGroupName('turkic_group')]人的森林与野生动物女神。\n\n白白阿奶还司掌狩猎、财富与丰饶，在阿尔泰和萨哈（雅库特）人中受到崇拜。她的名字意为“富有”或“丰饶”，是凯尔拉的女儿。\n\n猎人点起篝火向她祈祷，希望捕猎顺利、平安无事。传说中有三位白白阿奶：司狩猎的白白阿奶、司森林的塔格·白白阿奶和司捕鱼的乌古·白白阿奶。在一些地方她也保护孩子，被视为血脉的守护者。"
 baradeo_god_desc: "$baradeo_god$是[ShowCultureName('gond')]人的至高神。\n\n婆罗提乌受印度中部的贡德人崇拜，又称巴格万、巴达德奥或佩尔萨·彭。他统管众小神，即氏族神、村神和祖先，人们对他是敬重，而不是热烈供奉。贡德传统把他与祖先英雄库帕尔·林戈等同，形象是一位头戴三叉冠“蒙苏尔”、面容光洁的年轻王子。\n\n塞奥尼一带的一些贡德人认为婆罗提乌住在萨贾树里，贡德瓦纳各地还有许多供奉库帕尔·林戈的神龛。"
 bathoubwrai_god_desc: "$bathoubwrai_god$是[ShowReligionAdjective('bathou_religion')]中的至高神。\n\n巴图布赖意为“长者巴图”，无形可见，无所不知，无所不能，受阿萨姆博罗人崇拜。据说他创造了空气、火、土、水和以太五大元素，这套元素是整个信仰的根基。\n\n西久树是一种大戟属灌木，被视为他的活身。博罗人家把它种在庭院东北角，村社则用十八对竹片把它围起，每一对代表一对小神。供品是牲畜、禽类和米酒。"
 bura_bagh_raja_god_desc: "$bura_bagh_raja_god$是[ShowReligionAdjective('bathou_religion')]中的一位家宅神。\n\n布拉巴格王受阿萨姆博罗人供奉。民族志学者悉尼·恩德尔把他与巴图布赖、买瑙和宋布赖并列为主要的家宅神。"
 chinchaycamac_god_desc: "[ShowGodName('chinchaycamac_god')]是[ShowCultureName('chincha_culture')]人的主神。\n\n钦查卡马克受钦查人崇拜，钦查人是秘鲁海岸钦查河谷的航海和贸易民族。钦查人设有一处同名的神谕所，十分富有，声名卓著，可能就在他们的都城拉森蒂内拉附近，那里有大型的土坯金字塔。\n\n钦查人相信自己是美洲豹和虎猫的后裔，崇拜猫科动物神。他们的王国自11世纪起兴盛，约1480年并入印加帝国。"
 coatlicue_god_desc: "[ShowGodName('coatlicue_god')]是美索美洲众神中的丰饶女神。\n\n科瓦特利奎意为“蛇裙”，又称“诸神之母”特特奥·因南，是阿兹特克的母神，米斯科亚特尔的妻子。托茜（“我们的祖母”）和守护死于产褥的妇女的西瓦科亚特尔，都被视为她的化身。\n\n在图拉附近科阿特佩克的神话里，她扫地时被一团羽毛碰到而怀孕。她的女儿科约尔绍基和四百个儿子密谋杀她，维齐洛波奇特利却全副武装地从她腹中跃出，击溃了他们。"
 creator_god_desc: "$creator_god$代表创世之初点亮人类文明的神圣火花。\n\n创世神话讲述了人类、大地或宇宙诞生的许多方式：世界从原初的种子里萌发，由杀死太古怪物而成，或出自神圣工匠之手。在《创世记》中，伊洛欣用六天造出天地、动物和人类。"
 death_god_desc: "$death_god$象征不可抗拒的终极平等，静候众生。\n\n死神是与来世或冥界相联的神或神性存在，大多数文化里都有某种形式的死神。在以单一神为中心的宗教里，死亡通常是那位神的对手；在一神教中，它常被拟人化为天使或魔鬼。"
 dharti_ayo_god_desc: "$dharti_ayo_god$是[ShowReligionAdjective('sarna_religion')]中的大地女神。\n\n陀利底阿瑜又称恰拉帕丘女神，乔塔那格浦尔高原的部族民族把她当作与自然相连的母神来敬拜。人们把她与摩烂迦补卢和村神一同供奉。"
 donyi_god_desc: "$donyi_god$是[ShowReligionAdjective('donyi_polo_religion')]中的日之女神。\n\n冬尼是阿鲁纳恰尔阿迪人、加洛人、尼西人等塔尼诸族的女神。传统上人们称她为母亲，与月亮波罗，即父亲，相配。\n\n人们请这两位神为真话作证，惩罚说谎的人。敏荣和帕达姆两支阿迪人说，创造者是塞迪，他的双眼变成了日月。"
 doying_bote_god_desc: "$doying_bote_god$是天神。\n\n多英波特是阿鲁纳恰尔塔尼诸族所奉的神灵之一；他们口传的信仰后来被称为冬尼波罗，没有经典，也没有固定的神庙。"
 du_chie_god_desc: "$du_chie_god$是丁卡族群信奉的创世神。\n\n有的说法把杜奇耶当作尼雅力克之前的神，有的说法则认为他与尼雅力克共同创世。"
 earth_god_desc: "$earth_god$象征土地的丰饶，滋养万物生生不息。\n\n地神多为女神。希腊神话中是盖亚，对应罗马的特拉和印度的普利提维，可追溯到原始印欧宗教中与天父相配的地母。"
 egbesu_god_desc: "$egbesu_god$是[ShowReligionAdjective('ijaw_religion')]中的正义之神。\n\n在尼日尔河三角洲的伊乔人中，埃格贝苏也是对抗邪恶的精神力量。它的象征是豹、黑豹和狮子。\n\n按照传统，埃格贝苏的力量只能用于防卫或纠正不义，也只有与宇宙和谐的人才能使用。埃格贝苏王是唯一能宣战的大祭司，其下是称为奥克帕兰的高级祭司和称为库利库利韦的步卒。人们相信这种力量能保护战士不中敌人的子弹。"
 erlik_god_desc: "[ShowGodName('erlik_god')]是[ShowCultureGroupName('turkic_group')]人的死亡与冥界之神。\n\n尔力克，又称尔力克汗，是下界的主宰和亡者的审判者，有时以熊的形象出现。鄂尔浑碑铭里已经提到他。他从地下送出死亡、瘟疫和恶灵，来夺取人的灵魂。\n\n阿尔泰人的传说说，尔力克自称神明，与他的灵一起被逐出天界。拉德洛夫记录的另一则传说里，他是第一个人类，想从原初之水里藏起泥土，被凯尔拉逐出。"
 fertility_god_desc: "$fertility_god$象征母性的滋养与生命的绵延。\n\n生育神可以是男神或女神，与性、怀孕、分娩和作物相联，有时直接掌管这些事，有时只是抽象的象征，崇拜时可能伴有求子的仪式。越南信仰里的十二位婆姆各自负责塑造孩子的一部分。"
 fire_god_desc: "$fire_god$既象征温暖炉火的庇护，也代表狂暴烈火的毁灭。\n\n火神许多民族都有。越南传统中有灶君，即炉灶与火之神，另有名为婆火的女神也被算作火神。"
 freya_god_desc: "$freya_god$是华纳神族的重要神祇，被尊奉为爱情、美丽、丰饶与魔法之神。\n\n弗蕾亚意为“夫人”，也掌管战争和黄金。她的赛兹是一种观察和左右未来的魔法。她是尼奥尔德的女儿，弗雷的孪生姐妹，拥有项链布里辛加曼，乘坐两只猫拉的战车。\n\n她统治福尔克范格，接收一半战死者，另一半归奥丁。在《索列姆之歌》里，她不肯被许给巨人为妻，于是托尔扮作新娘，代她前往。"
 freyr_god_desc: "$freyr_god$是华纳神族的重要神祇，因其执掌丰收、欢愉与和平而备受尊崇。\n\n弗雷意为“主人”，也掌管王权和好天气，是尼奥尔德之子，弗蕾亚的孪生兄弟。他骑着金鬃野猪古林布尔斯蒂，拥有总是顺风、又能折叠装进小袋的船斯基德布拉德尼尔。\n\n最有名的神话讲他爱上女巨人格尔德，为了娶她，把能自己作战的剑送了人；没有这把剑，他注定在诸神黄昏时死于苏尔特之手。瑞典诸王被认为是他的后裔。"
 ganesha_god_desc: "$ganesha_god$是[ShowReligionName('hindu')]中的重要[god|e]，通常以象头形象出现，被视为幸运与智慧的象征。\n\n犍尼萨是湿婆与帕尔瓦蒂的象头之子，印度教各个教派都敬奉他。他通常有四臂和一枚断牙，是“障碍之主”，也是学问与文字的守护者。任何仪式开始时，都要先向他祈祷。\n\n从公元最初几个世纪起，文献中就已提到他；很可能成书于1100至1400年间的《犍尼萨往世书》和《穆德伽拉往世书》，则把他奉为犍尼萨派的至高存在。"
 god_desc: "“神”是特定宗教中的主要神祇。虽然一些宗教可能包含许多神，并且或多或少平等地崇拜它们，但其他宗教可能将信仰集中在特定的一个神身上，而还有一些宗教可能否认除了他们自己信仰的神之外的其他神的存在。\n\n在基督教、犹太教和伊斯兰教中，神是宇宙唯一永恒的创造者，全能，并垂听个人的祈祷。三教都追溯到亚伯拉罕，以及《希伯来圣经》所描述的以色列之神。\n\n犹太教徒用四个字母的圣名雅威（YHWH）称呼他，虔诚的犹太教徒不念出这个名字，而以阿多奈代替。基督徒则公开念出雅威或耶和华之名。穆斯林称他为安拉，以真主的绝对独一（认主独一，塔希德）为信仰核心。"
 haunu_god_desc: "$haunu_god$是雷电之神，也是$kagara_god$的姐夫。\n\n豪努是克萨姆桑人神话中的人物。在这则用来向孩子解释暴风雨的故事里，他向卡加拉投掷闪电，自己在雷鸣中慢慢死去，卡加拉则在雷鸣中睡去。"
 hermes_god_desc: "[ShowGodNameWithNoTooltip('hermes_god')]是诸神的信使，贸易、旅行和诡诈的守护者。\n\n赫耳墨斯是宙斯与昴宿七姐妹之一迈亚之子。他穿着带翼的凉鞋，在人界与神界之间来去自如，还负责把亡魂引入来世。他也保护传令官、窃贼和演说家。\n\n他又是神圣的骗子，《荷马颂诗·致赫耳墨斯》讲述了他的故事。他的主要象征是双蛇缠绕的带翼权杖。罗马人把他等同于墨丘利，这个名字出自意为“商品”的拉丁语merx。"
 huitzilopochtli_god_desc: "[ShowGodName('huitzilopochtli_god')]是[ShowLocationName('tenochtitlan')]人的太阳、战争和人祭之神。\n\n维齐洛波奇特利意为“南方的蜂鸟”，是墨西加人的守护神。他手持火蛇修科亚特尔。\n\n在科阿特佩克的神话里，他从女神科瓦特利奎的腹中全副武装跃出，杀死了姐姐科约尔绍基和四百个兄弟，他们化为月亮和星辰。太阳每日与他们的搏斗，需要以祭品供养。墨西加人崛起之前，他在纳瓦人中并不重要。"
 hunhunahpu_god_desc: "$hunhunahpu_god$是[ShowReligionName('mayan')]中的生育和球类运动之神。\n\n胡恩‑胡纳赫普意为“一·胡纳赫普”，是基切玛雅《波波尔·乌》中的人物，英雄双子胡纳赫普和什巴兰克的父亲。他和弟弟乌库布‑胡纳赫普被冥界西巴尔巴的诸王骗进黑暗之屋并献祭。\n\n他的头颅挂在树上，变成了葫芦，唾液使一位冥界之王的女儿什基克怀上双子。双子击败了诸王，却无法使父亲复活。有学者认为他就是古典时期玛雅的玉米神。"
 hunntuattatteen_god_desc: "$hunntuattatteen_god$是[ShowGodName('kaggen_god')]的妻子。\n\n洪图亚塔滕的形象为蹄兔，被称为蜜蜂之母。在大角斑羚的神话里，大角斑羚由她生下，她还帮忙搅动羚羊的血，造出第一群大角斑羚。"
 huracan_god_desc: "$huracan_god$是[ShowReligionName('mayan')]中的风和风暴之神。\n\n胡拉坎意为“独腿”，又称“天心”乌·库克斯·卡赫，也是基切玛雅的火神，三次造人尝试中都出场的创世神之一。第二代人类触怒诸神后，他引来了大洪水。\n\n《波波尔·乌》说他住在洪水之上多风的云雾里，一遍遍呼唤“大地”，直到陆地从海里升起。他的名字让人联想到古典时期玛雅的闪电神K神，后者有一条腿是蛇形。"
 ikenga_god_desc: "$ikenga_god$是幸运的有角之神。\n\n伊肯伽意为“威严之力”，是尼日利亚东南部伊博人的神。它体现一个人的奋斗与成功，信念是成事的力量在人的右手，据说能带来财富和庇护。它还与农耕和铁匠业相关。\n\n伊肯伽要由宗族长在亲属面前举行奉献仪式，供上山药、公鸡、酒和可乐果。最古老的形式是双面的，一张脸看着旧年，一张脸看着新年。"
 ilat_god_desc: "$ilat_god$是雷雨之神。\n\n在卡伦津人中，伊拉特又作伊莱特，据说住在深潭和瀑布里。彩虹是他丢弃的衣服。南迪人把他分成两位神。善的伊莱特·内米耶用远处的隆隆雷声驱走危险；恶的伊莱特·内亚想下到人间，用近处的炸雷杀人。"
 illapa_god_desc: "[ShowGodName('illapa_god')]是[ShowRegionName('andes_region')]人的雷雨之神。\n\n伊利亚帕也是印加人的闪电与战争之神，是安第斯神谱中地位最高的神之一。他的崇拜以各地的名字遍及安第斯：在亚罗人那里叫利维亚克，在亚乌约人那里叫帕里亚卡卡，在卡哈马卡一带叫阿波卡特基尔。印加国家扩张时，这些神成了伊利亚帕的地方形态。\n\n统治者帕查库提奉他为神圣的兄弟；据佩德罗·萨米恩托·德·甘博亚记载，这位神曾赐给他一尊护身偶像，形如双头蛇，可能是彩虹的象征。"
 inti_god_desc: "[ShowGodName('inti_god')]是[ShowRegionName('andes_region')]人所崇拜的太阳神。\n\n因蒂是印加国家的守护神。人们通常说他是维拉科查之子，月亮女神玛玛·基利亚的兄长和丈夫。印加统治者被认为是他在人间的代表，始祖曼科·卡帕克则被认为是他的儿子。\n\n他的大祭司维拉克·乌穆地位仅次于萨帕·印卡。统治者帕查库提与太阳崇拜的兴起和扩张有关。"
 kagara_god_desc: "$kagara_god$是雷电之神，也是$haunu_god$的妹夫。\n\n卡加拉是克萨姆桑人神话中的人物。19世纪记录的一则故事里，他去接回自己的姐姐，姐夫豪努追来，两人互相投掷闪电。"
 kaggen_god_desc: "$kaggen_god$是许多非洲部落的创世神、恶作剧之神和民间英雄。\n\n在南部非洲的桑人中，卡根常被称为“螳螂”。他能变成任何动物，最常见的是螳螂，也可以是公大角斑羚、虱子或蛇。他的妻子是蹄兔，也是蜜蜂之母。\n\n最有名的神话讲的是，他最宠爱的大角斑羚在长成之前就被儿子们杀了。他把羚羊的血和脂肪洒在地上，一大群大角斑羚随即出现，供他的族人猎取。"
 kamuy_huci_god_desc: "$kamuy_huci_god$是[ShowReligionAdjective('ainu_religion')]中的女灶神。\n\n神威媪是最重要的神威之一。她的全名意为“迸射火星之女”，又称“伊雷苏神威”，即“教人之神”。她守卫着人类世界与神威世界之间的门户。\n\n阿伊努人相信，死者的灵魂经由她的火塘前往来世。因此葬礼上要向火神祈祷、献上供品，并吟唱挽歌，祝愿死者一路顺利。"
 kayra_god_desc: "[ShowGodName('kayra_god')]是[ShowCultureGroupName('turkic_group')]民族的创世之神。\n\n凯尔拉意为“仁慈的王”，被描述为既是父亲又是母亲，居于天界第十七层。他种下了生命之树乌鲁卡因。\n\n有的说法称他是长生天之子、诸神之首。在阿尔泰传统里，兄弟于尔根和尔力克由他创造；拉德洛夫记录的一则传说里，他把第一个人逐出天界，称之为尔力克。"
 khuanu_god_desc: "$khuanu_god$是[ShowReligionAdjective('mizo_religion')]中的自然之神。\n\n库阿努是印度东北部山地民族米佐人信奉的守护之灵，与库阿旺并称，被视为村落（库阿）的看守者和保护者。一些米佐学者认为，萨库阿所崇奉的守护者正是这位灵，它是庇护与祝福的来源。"
 kim_un_kamuy_god_desc: "$kim_un_kamuy_god$是[ShowCultureName('ainu_culture')]人的熊与山之神。\n\n山熊神威意为“山之神”。一则神话说他由村作神威造火时落下的黑色木屑化成；阿伊努人相信，熊把毛皮和肉送到人间，是他赐给人类的礼物。"
 kine_nane_god_desc: "$kine_nane_god$是庄稼和繁荣女神。\n\n基内纳内是阿鲁纳恰尔塔尼诸族所奉的神灵之一；塔尼人的仪式由称为尼布的巫师在村里或家中主持。"
 kotan_kar_kamuy_god_desc: "$kotan_kar_kamuy_god$是[ShowReligionAdjective('ainu_religion')]中的创世神。\n\n村作神威意为“造村之神”。传教士约翰·巴彻勒认为其他一切神威都要对他负责，他是宇宙永恒的主宰；后来的学者对此存疑，指出人们很少专门祭祀他。\n\n一则神话讲他想造出火，作为礼物送给人类。他先用白杨木钻火，没有成功，木杵变成了恶灵；改用榆木后成功了，白色的木屑化出女猎神哈西瑙乌克神威，黑色的木屑化出山神，也就是熊。"
 legba_god_desc: "$legba_god$是世界分隔处的神灵，他赋予人们与灵界沟通的能力。\n\n雷格巴在丰语中称勒格巴，在埃维语中称埃莱格巴，是一位沃敦，是神与人之间的中介。他可能是从约鲁巴人的埃舒‑埃莱格巴那里吸收来的。\n\n每场仪式都先向他祈求。他的形象是拄拐杖、戴草帽、抽烟斗的老人，狗对他是神圣的。在大西洋彼岸的侨民宗教里，他成了爸爸雷格巴，与圣彼得相混同。"
 lisa_god_desc: "$lisa_god$是太阳女神，与她的双胞胎[ShowGodName('mawu_god')]一起成为万物的创造女神。\n\n莉萨为达荷美的丰人和其他格贝语民族所崇拜。莉萨与玛武是娜娜·布鲁库的孩子，也是雷神赫比奥索的父母。\n\n神话里，莉萨受玛武之命教人们建立文明。这个名字一般认为出自奥里萨恩拉，即约鲁巴人的奥巴塔拉的另一个名字，所以这一对神可能借自约鲁巴文化。"
 mainao_god_desc: "$mainao_god$是[ShowCultureName('map_bodo')]人的稻田守护女神。\n\n买瑙是至高神巴图布赖的女儿，是博罗人仅次于他的重要神灵。她也是主要的家神之一。\n\n她的祭坛设在正屋最东端，祭拜巴图时总要与她一同祭拜。信徒面朝东方，买瑙在巴图的左侧，献灯焚香时要围着她绕转七次。"
 mama_cocha_desc: "[ShowGodName('mama_cocha')]是[ShowRegionName('andes_region')]人的海洋女神。\n\n玛玛·科查意为“海母”，也是鱼类女神，守护水手与渔民。在印加信仰中，她是创世神维拉科查的妻子，太阳神因蒂和月亮女神玛玛·基利亚的母亲，也是四位元素之母之一。\n\n人们祈求她平息风浪、带来渔获，对沿海民族尤其重要。她居于天上界哈南·帕查，并被等同于浇灌田地的雨水。"
 mamaquilla_desc: "[ShowGodName('mamaquilla')]是[ShowRegionName('andes_region')]人的月之女神。\n\n玛玛·基利亚意为“月母”，是因蒂的姐姐和妻子，维拉科查之女。她是印加国家神话中的创建者曼科·卡帕克和马马·奥克略之母，是婚姻与月经周期之神，也是妇女的保护者，对印加历法十分重要。\n\n她被想象成一位流着银色眼泪的美丽女子，月食被说成是有野兽在攻击她。她在库斯科的神庙由专门的女祭司侍奉。"
 marang_buru_god_desc: "$marang_buru_god$是[ShowReligionAdjective('sarna_religion')]中的至高神。\n\n摩烂迦补卢意为“大山”，受到印度东部桑塔尔人、布米吉人、霍人和蒙达人的崇奉。他被视为万因之因；桑塔尔人认为，有一座山丘本身就是这位神。"
 mawu_god_desc: "$mawu_god$是月亮之神，也是与他的双胞胎[ShowGodName('lisa_god')]一起创造万物的造物主。\n\n玛武为达荷美的丰人和其他格贝语民族所崇拜。她的名字意为“无可超越者”。玛武与莉萨是原初创造者娜娜·布鲁库的孩子。\n\n玛武用黏土造人，并请巨蛇艾多·赫韦多盘在大地下方托住大地。18世纪特格贝苏在位期间，达荷美把这对神抬高为世界的创造者。"
 mergen_god_desc: "[ShowGodName('mergen_god')]是[ShowCultureGroupName('turkic_group')]人的丰裕与智慧之神。\n\n墨尔根是凯尔拉之子，于尔根的兄弟，住在天界第七层。他的名字在突厥诸语中意为“射手”，在喀尔喀蒙古语里意为“聪明”或“天才”。他的形象是戴着头盔、持弓骑白马的青年，或是一头强壮的公牛。白色是他的颜色。"
 mindiss_god_desc: "$mindiss_god$是[ShowReligionAdjective('odinala_religion')]中法蒂克地区的形似海牛的守护者。\n\n门迪丝是塞雷尔人的潘古尔，即祖灵，带有女神的特征。人们在锡内河畔以她的名义献上祭品。"
 nat_awal_god_desc: "$nat_awal_god$是[ShowCultureName('gond')]人的丰饶女神。\n\n在印度中部的贡德人中，人们真正祭拜的是氏族和村落的神灵，而不是至高神婆罗提乌，其中就有村母神。"
 nat_awual_god_desc: "$nat_awual_god$是[ShowCultureName('gond')]人的乡村母神。\n\n捺奥斡尔每逢节庆之前都要与守护神阿吉宾一同祭拜。若村里没有她专属的神龛，她的居所就是一棵萨贾树。"
 ngai_god_desc: "$ngai_god$是[ShowCultureName('maasai_culture')]人的创世神。\n\n恩加伊又称恩凯，马赛人认为他兼有男性和女性两种属性；肯尼亚和坦桑尼亚相邻的基库尤人、恩布人、梅鲁人和坎巴人也奉他为创世神。他的名字与“雨”同义。\n\n马赛人认为他最初的居所是神山伦盖伊火山，他们的莱邦祭司主持献祭。在基库尤人的传统里，他让始祖基库尤和穆姆比结为夫妇，并以肯尼亚山为居所。"
 nhialic_god_desc: "$nhialic_god$是[ShowReligionAdjective('muonyjang_religion')]中的最主要的[gods|e]。\n\n尼雅力克是今南苏丹一带丁卡人的创世神，掌管天空和降雨。人们认为他远离人间。\n\n在死亡起源的神话里，最初的人类加朗和阿布克被命令每天只舂一定数量的谷物。阿布克多舂了些，谷粒打中了尼雅力克的脸。他派一只蓝鸟割断连接天地的绳索，人类从此成为必死之身。"
 niparaya_god_desc: "$niparaya_god$是[ShowReligionAdjective('pericu_religion')]中的创世神。\n\n尼帕拉亚是下加利福尼亚佩里库人神话中无所不能的天地主宰，这些神话在18世纪30年代初被零星记录下来。他的妻子叫阿马伊科永迪，两人生有三个儿子。\n\n长子夸亚伊普造出了人类，后来被人类杀死；次子是阿卡拉吉，三子随教派不同叫瓦克或图帕兰。"
 njord_god_desc: "$njord_god$是华纳神族的海神，亦是$freyr_god$与$freya_god$的父亲。他被尊奉为航海与渔业之神。\n\n尼奥尔德还与风、财富和作物丰收相关。他与未留下名字的孪生姐妹生下了弗雷和弗蕾亚。《格里姆尼尔之歌》说他在诺阿通有一座殿堂。\n\n阿萨神族与华纳神族交战之后，他去阿萨神族那里作人质。他与女巨人斯卡娣的婚姻并不幸福。他的名字与1世纪记载的丰饶女神内尔图斯相对应，斯堪的纳维亚有许多含有这个名字的地名。"
 nyambe_god_desc: "$nyambe_god$是众多[ShowLanguageFamilyName('bantu_language_family')]族群信奉的主要[gods|e]和天父。\n\n尼扬贝是宇宙的创造者、太阳神，也是一切生命的源头。人们说他全能全知，从天上守望着自己的造物。\n\n各族称呼不同，有恩贾贝、尼扬比、恩赞比等形式，观念却大体一致。已知只有刚果人还把恩赞比视为女神和天母。"
 obatala_god_desc: "$obatala_god$是[ShowReligionName('isese_religion')]中的人类创造者。\n\n奥巴塔拉意为“白布之王”，又称奥里萨恩拉，是约鲁巴宗教中诸奥里沙之王。他沿一条金链从天上降下，带着装满沙子的蜗牛壳、一只白母鸡和一颗棕榈果，用黏土捏出了最初的人类。\n\n在某些说法里，他干活时喝了棕榈酒，捏出了残缺的人形，所以清醒后发誓不再饮酒，并成为残障者的保护者。伊费的传统还把他记作伊费的凡人始祖国王。"
 odin_god_desc: "$odin_god$是阿萨神族的众神之父。他为了追求无尽的智慧，不惜献祭一目，更将自己悬挂于世界树九天九夜，终于领悟了卢恩符文的奥秘。\n\n奥丁在诺斯和更广泛的日耳曼多神教中掌管智慧、诗歌、战争与亡者；他的名字意为“狂怒之主”。他是弗丽格的丈夫，巴尔德尔和托尔的父亲，形象是手持长矛的独眼老人，身边有两只渡鸦。\n\n阵亡的战士由他迎入瓦尔哈拉，诸神黄昏时他将被巨狼芬里尔杀死。约1075年，不来梅的亚当记载乌普萨拉神庙里有他的神像。"
 ogbunabali_god_desc: "$ogbunabali_god$是[ShowReligionAdjective('odinala_religion')]中的死亡之神。\n\n奥古纳巴利意为“夜里杀人者”，是伊博人传统的神灵。据说他在夜里取人性命，受害者通常是罪犯或犯下不可言说的禁忌的人。"
 olokun_isese_god_desc: "$olokun_isese_god$是[ShowReligionAdjective('isese_religion')]中的水与财富之神。\n\n奥洛昆是约鲁巴宗教中的海洋深处之神，是财富之神阿杰的父母。对奥洛昆的崇拜在尼日利亚西南部的约鲁巴人和埃多人城镇最盛；近海之处奥洛昆为男性，内陆则为女性。伊费有一种说法，奥洛昆是奥杜杜瓦的妻子，离开他之后变成了大海。\n\n在拉各斯，奥尼鲁酋长每年举行盛大的节日祭祀奥洛昆，以防海岸被淹；在伊费，主祭司是奥巴·伊乔。"
 olorun_god_desc: "$olorun_god$是[ShowReligionAdjective('isese_religion')]中的至高神。\n\n欧洛伦是天界的统治者和宇宙的创造者。他的名字由表示“拥有者”的奥尼和表示“天界”的奥伦缩合而成。他又称奥洛杜马雷，意思被解释为“无所不足者”。\n\n他疏远，没有自己的神龛、神像和祭品。人们通过奥里沙，也就是神圣的存在来接近他，其中奥巴塔拉是王，奥里沙治理并维系物质世界。"
 ori_god_desc: "$ori_god$是[ShowReligionName('isese_religion')]中的命运看管者。\n\n奥里的字面意思是“头”，在约鲁巴人的观念里指一个人的精神直觉。它是嵌入人的本质的一点意识火花，常被拟人化为一位独立的奥里沙。\n\n人最终成为什么样子、一生遇到什么事，都被认为是奥里所注定的，所以人们像崇拜奥里沙一样崇拜奥里。事情不顺时要向它求问并安抚它；品性平衡的人，就与自己的奥里，即神圣的自我相合。"
 pachamama_desc: "[ShowGodName('pachamama')]是[ShowRegionName('andes_region')]人的大地之母。\n\n帕查玛玛是安第斯人崇敬的空间、时间与生命女神。一些神话称她是帕查卡马克的妻子，玛玛·基利亚和因蒂的母亲。她常以大地女神“玛玛·阿尔帕”的形象受到崇拜，是人们物质和精神滋养的来源。\n\n她的神龛是神圣的岩石或传说中的树干，祭司向她献上美洲驼和豚鼠。西班牙征服之后，许多原住民把圣母玛利亚与她联系在一起。"
 paruhang_god_desc: "$paruhang_god$是[ShowReligionAdjective('kirat_mundhum_religion')]中的天空之神。\n\n帕茹夯受到尼泊尔东部基拉特民族莱人的崇奉。他是大地女神松米玛的丈夫。他代表诸天的力量和创世的秩序，也司掌降雨和神的庇护。在播种和收获时的萨克拉节上，莱人把供品献给他和松米玛。"
 pathian_god_desc: "$pathian_god$是[ShowCultureName('zo_culture')]人的至高神。\n\n帕提安受到米佐人的崇奉。米佐人旧称卢塞人，是今米佐拉姆一带的藏缅语山地民族。他被认为居住在天上，是仁慈的创造者，保护并造福万物，赏善罚恶。\n\n米佐学者对传统信仰萨库阿是否包含对他的崇拜意见不一：有人把他看作信仰的中心，也有人认为这一信仰祭祀的只是赐福护佑的库阿旺。"
 phi_earth_god_desc: "$phi_earth_god$是[ShowReligionAdjective('satsana_phi')]中的地神。\n\n在泰族诸民族中，守护各处的丕庇佑着寺庙和城镇中心的立柱“拉勐”。"
 phi_fire_god_desc: "$phi_fire_god$是[ShowReligionAdjective('satsana_phi')]中掌管一切自然力量的神灵。\n\n泰族诸民族在崇拜称为宽的生命灵气和祖先之外，还供奉许多丕；古老的天神“丕天”位在各地的精灵之上。"
 phi_heaven_god_desc: "$phi_heaven_god$是[ShowReligionAdjective('satsana_phi')]中的天神。\n\n丕天在泰族中称丕法，司掌降雨，也是创世神。泰人称他为“滕”，意为天，这个词源自汉语的“天”。他出现在昆博隆的传说中。\n\n在为大病初愈者举行的丕法仪式上，巫师以竹笙音乐、吟唱和通宵的舞蹈把他请到祭坛前，求他治愈疾病、护佑平安。"
 phi_water_god_desc: "$phi_water_god$是[ShowReligionAdjective('satsana_phi')]中的水神。\n\n丕教是掸人、傣族、佬人和阿洪姆人古老的信仰，供奉的丕众多，从寺庙的守护神灵到古老的天神“丕天”都有。"
 polo_god_desc: "$polo_god$是[ShowReligionAdjective('donyi_polo_religion')]中的月神。\n\n波罗是阿鲁纳恰尔阿迪人、加洛人、尼西人等塔尼诸族的神。传统上人们称他为父亲，与太阳冬尼，即母亲，相配。\n\n人们请这两位神为真话作证，惩罚说谎的人。敏荣和帕达姆两支阿迪人说，创造者是塞迪，他的双眼变成了日月。"
 poseidon_god_desc: "[ShowGodNameWithNoTooltip('poseidon_god')]是海洋、地震和自然狂野力量之神。\n\n波塞冬是奥林匹斯十二主神之一，也是风暴和马之神，航海者的保护者。世界由克洛诺斯的三个儿子抽签瓜分时，宙斯得到天空，哈迪斯得到冥界，波塞冬得到大海。\n\n青铜时代的皮洛斯和底比斯奉他为主神，称他“撼地者”。他在争夺雅典的竞赛中输给了雅典娜；《奥德赛》里，他因儿子波吕斐摩斯被刺瞎而愤怒，使奥德修斯在海上漂泊了十年。"
 pu_vana_god_desc: "$pu_vana_god$是[ShowCultureName('zo_culture')]人的雷电之神。\n\n普·瓦纳意为“天上的神”，是印度东北部山地民族米佐人信奉的仁慈之灵。传统上，他被看作创造者帕提安的祖父，很可能也是其父，并被奉为自然之神。学者把他比作印度教的因陀罗。"
 quetzalcoatl_god_desc: "[ShowGodName('quetzalcoatl_god')]是美索美洲众神中的生命、风和智慧之神。\n\n魁札尔·科亚特尔意为“羽蛇”，是阿兹特克的金星、手艺和商人之神，参与创造了人类，也是祭司阶层的守护神。作为风神，他以人形的埃赫卡特尔出现。魁札尔·科亚特尔也是特诺奇蒂特兰大神庙两位大祭司的头衔。\n\n在托兰城的传说里，统治者魁札尔·科亚特尔被对手特斯卡特利波卡欺骗，被迫流亡。16世纪的西班牙作者把这位神与那位统治者混为一谈。"
 ratovantany_god_desc: "$ratovantany_god$是[ShowReligionAdjective('fomba_gasy_religion')]中的地神，与[ShowGodName('zanahary_god')]立约创造人类。\n\n拉托万塔尼又称安德里亚恩托姆波，是自生之神，他的创世神话流传于马达加斯加全岛。他用泥土塑成人的身体，人死后收回遗体使其腐化。灵魂则属于扎纳哈里，去往天空或太阳。与扎纳哈里不同，拉托万塔尼似乎没有成为任何马达加斯加族群崇奉的显要神明。"
 rep_un_kamuy_god_desc: "$rep_un_kamuy_god$是[ShowCultureName('ainu_culture')]人的海神。\n\n北海道、库页岛和千岛群岛沿海的阿伊努人，要仰仗海鲸神威赐予生计。"
 sakhua_god_desc: "$sakhua_god$是[ShowCultureName('zo_culture')]人的家庭之神。\n\n萨库阿也是印度东北部米佐人对其传统信仰的称呼，在作家扎伊雷马看来，它同时是氏族的守护灵，代表这个氏族的身份。这个词由“萨”和“库阿”组成，前者指人出生所属的氏族或家族，后者指村落。"
 sakpata_god_desc: "$sakpata_god$是[ShowReligionAdjective('vodun_religion')]中的大地与疾病之神。\n\n萨克帕塔受丰人、埃维人、阿贾人及其他格贝语民族崇拜，这些民族分布在今尼日利亚西部到沃尔特地区一带。他是约鲁巴天花神索波纳在达荷美的形态，既能治病，也能降下疾病和疯狂。\n\n口述历史说，天花曾在阿贾塔多使他们的祖先大批死去，直到一位名叫托格布伊·安伊的约鲁巴人把他们治好。萨克帕塔是他们崇拜最广的神之一。"
 shakti_god_desc: "$shakti_god$是[ShowReligionName('hindu')]中的重要[goddess|e]，被视为宇宙的根本能量。在[ShowPolicyName('shaktism')]中，她被尊为“提毗”，即至高[goddesses]，许多其他[goddess]也被视为$shakti_god$的不同化身，有些甚至能变化为多种形态。\n\n沙克蒂的名称出自意为“能够”的梵语词根。在湿婆身边，她化为乌玛、杜尔迦、可怖的迦利和慈母般的帕尔瓦蒂；在毗湿奴身边则是拉克什米。在不二论的思想中，湿婆与沙克蒂是不可分割的一体。“沙克塔”之名自9世纪起流行。"
 shiva_god_desc: "$shiva_god$是[ShowReligionName('hindu')]的主要[gods|e]之一，也是[ShowPolicyName('shaivism')]的至高存在。他是苦行与瑜伽的庇护者。\n\n湿婆又称大自在天，即“伟大的神”。他是在凯拉萨山过着苦行生活的瑜伽行者，冥想与艺术的庇护者，又是与妻子帕尔瓦蒂和儿子犍尼萨、鸠摩罗同住的家主。\n\n他的标志是三叉戟、新月、发髻中流出的恒河，以及睁开时会烧毁眼前一切的第三只眼。人们大多以林伽的形式崇拜他。"
 sky_god_desc: "$sky_god$象征无处不在的守护之力，庇佑人间。\n\n男性天神往往统领诸神，成为“天父”，并与“地母”配对。希腊神话中，原初天神乌拉诺斯被宙斯取代，后者在奥林匹斯山上统治天界。"
 song_bwrai_god_desc: "$song_bwrai_god$是[ShowCultureName('bodo_culture')]人的家神。\n\n民族志学者悉尼·恩德尔把宋布赖与巴图布赖、买瑙并列为博罗人的主要神灵。人们在屋内名为“丹”的祭坛上祭拜他，主要是妇女，供品事后还要摆到象征巴图的西久树下。"
 sumnima_god_desc: "$sumnima_god$是[ShowCultureName('kirati_culture')]人的至高神和大地之母。\n\n松米玛受尼泊尔东部基拉特民族莱人崇拜，是自然之神，主管生育、农耕、森林和河流。她是天神帕茹夯的妻子。\n\n两位神合起来象征门顿传统中天与地的结合。在播种和收获时的萨克拉节上，莱人要向帕茹夯和松米玛献祭。"
 supay_god_desc: "[ShowGodName('supay_god')]是[ShowRegionName('andes_region')]人信仰的冥界之神。\n\n苏帕伊是克丘亚人、艾马拉人和印加人信仰中亦善亦恶的灵，统治着内界乌库·帕查。他代表阴影、黑夜、黑暗和死亡的必然降临。这个词出自“苏帕”，意为阴影、疾病或死亡。\n\n这个名字起初是中性的：1560年多明各·德·圣托马斯修士编的克丘亚语—西班牙语词典，既列出了善灵，也列出了恶灵。西班牙人统治时期，苏帕伊被改造成基督教的魔鬼。"
 surya_god_desc: "$surya_god$是[ShowReligionName('hindu')]中的太阳[goddess|e]，也是[ShowPolicyName('smartism')]的主要神祇之一。\n\n在印度教文献中，苏利耶是男神，位列斯马尔塔传统中地位对等的五位神祇之一，形象是驾着七匹马拉的战车。最古老的吠陀颂歌（如《梨俱吠陀》1.115）崇敬升起的太阳；中世纪时，人们白天与梵天同祭，正午与毗湿奴同祭，傍晚与湿婆同祭。\n\n13世纪前后，对他的崇拜大幅衰落，也许是因为北印度的太阳神庙被穆斯林破坏。他越来越多地被并入毗湿奴和湿婆。"
 takhar_god_desc: "$takhar_god$是[ShowReligionAdjective('odinala_religion')]中的正义与复仇之神。\n\n塔卡尔又作塔阿卡尔，是塞内加尔、冈比亚和毛里塔尼亚塞雷尔人的半神。塞雷尔人向他申诉所受的伤害、压迫和邪恶巫术。\n\n人们在神圣森林里最高的树脚下祭拜他，相信他和他的对手财富与财产之神提乌拉赫就住在那里。他的大祭司萨尔蒂格是出身名门的老人，审理盗窃和巫术案件，靠的是人们对塔卡尔的畏惧，多于给被告喝的不致命毒药。"
 tano_god_desc: "$tano_god$是[ShowReligionAdjective('akan_religion')]中的战神，代表着塔诺河。\n\n塔诺的真名是塔·科拉，也是纷争之神，在阿散蒂人那里还是雷电之神。他被视为阿博松，也就是诸次级神灵中地位最高者，许多阿博松是他的儿子。\n\n他的形象是身材高大、手持兵器的战士，能变换形体，据说狒狒守卫着他的神龛。鱼是他的孩子，阿散蒂人不吃这条河里的鱼。"
 tengri_god_desc: "[ShowGodName('tengri_god')]是[ShowCultureGroupName('turkic_group')]人的天神。\n\n长生天（腾格里）即永恒的蓝天，是审判者和生命之源，永恒而至高。他最早的记载是汉文史书的音译“撑犁”，用于公元前4世纪的匈奴。\n\n6至9世纪，他是草原统治阶层的主神。8世纪初的鄂尔浑碑铭说腾格里创造死亡，毗伽可汗自称“如天、天生”。8世纪回鹘可汗改奉摩尼教，使他的崇拜在宫廷里失去了地位。"
 tepeu_god_desc: "$tepeu_god$是玛雅族群的至高神。\n\n特佩乌在基切玛雅语中意为“君主”，是危地马拉高地基切人的创世神。据《波波尔·乌》所述，他与羽蛇古库马兹一同创造了世界和人类，并被视为闪电与火之神。\n\n这两位神被认为是基切贵族男系的神话始祖。《波波尔·乌》在西班牙征服之后，于1550年前后用基切语记录下来。"
 tezcatlipoca_god_desc: "[ShowGodName('tezcatlipoca_god')]是美索美洲众神中的黑暗无常之神。\n\n特斯卡特利波卡意为“冒烟的镜子”，是阿兹特克的核心神祇之一，与夜空、黑曜石、飓风、冲突和占卜相关；名字指占卜时用的黑曜石镜。他是原初配偶奥梅特库特利和奥梅西瓦特尔的四个儿子之一，兽形是美洲豹。\n\n在五个太阳的神话和托兰城的传说里，他都是魁札尔·科亚特尔的对手。他的节日是托什卡特尔，新王登基时要向他斋戒祈祷。"
 thunder_god_desc: "$thunder_god$象征命运无常的威严与雷霆骤降的裁决。\n\n许多文化中的人们都设想过雷神。在印欧人的宗教里，雷神往往是男性，并且是诸神之首，例如印度教的因陀罗、希腊的宙斯、波罗的人的佩尔库纳斯和斯拉夫人的佩伦。"
 tlaloc_god_desc: "[ShowGodName('tlaloc_god')]是美索美洲众神中的雨神。\n\n特拉洛克也是阿兹特克的水与大地丰饶之神，人们敬畏他降下的冰雹、雷鸣和闪电。他的形象长着獠牙和分叉的舌头，常捧着盛水的容器。特奥蒂瓦坎早已奉祀风暴之神，他最盛大的祭仪在特拉洛克山上举行。\n\n死于溺水或雷击的人会去他的乐园特拉洛坎。在特诺奇蒂特兰，他的神殿与维齐洛波奇特利的并立在大神庙上。"
 tor_god_desc: "$tor_god$是阿萨神族中的重要神祇，被尊为雷神与风暴之神，同时也是人类的保护者及自由民的守护神。\n\n托尔是日耳曼人手持战锤的力量之神，是农夫的守护神，奥丁之子，西芙的丈夫。他驾着两只山羊拉的车，大敌是世界之蛇耶梦加得，诸神黄昏时两者注定同归于尽。\n\n维京时代，人们佩戴锤形吊坠、取以托尔为首的名字，以此对抗基督教传教士。11世纪，不来梅的亚当描述了乌普萨拉的托尔神像；12世纪卑尔根的一根卢恩木棍上，还在向他和奥丁求助。"
 tyr_god_desc: "$tyr_god$是阿萨神族的一员，饲狼者以及战神。\n\n在诺斯资料里，提尔饲养着巨狼芬里尔。诸神缚住这头怪物时，提尔把右手放进它口中作担保，芬里尔发觉受骗，咬断了他的手。诸神黄昏时，据预言他将被恶犬加姆吞噬。\n\n罗马人把他等同于战神马尔斯，3世纪的一块拉丁铭文称“议事会的马尔斯”，说明他与日耳曼人的议事会有关。他的名字在古英语里是提乌；有学者认为他早先在日耳曼诸神中地位更为核心。"
 u_blei_nong_thaw_god_desc: "$u_blei_nong_thaw_god$是[ShowReligionAdjective('ka_niam_khasi_religion')]中的创世神。\n\n卡西人的传说称，乌勃黎·农陀，即主宰，最初把人类分成十六个天上的家族，其中七家被留在人间。"
 ulei_longspah_god_desc: "$ulei_longspah_god$是[ShowReligionAdjective('ka_niam_khasi_religion')]中的财富之神。\n\n卡西人的信仰认为，独一无形的至高创世主乌勃黎·农陀位在所有这些神灵之上。"
 ulei_muluk_god_desc: "$ulei_muluk_god$是[ShowCultureName('khasi_culture')]人的国家之神。\n\n卡西人生活在约二十五个独立的邦里，各由一位称作“西姆”的酋长治理。"
 ulei_umtang_god_desc: "$ulei_umtang_god$是[ShowReligionAdjective('ka_niam_khasi_religion')]中的饮用水之神。\n\n传统上，每个卡西村庄都有一片圣林，用来安抚森林之灵；卡西人的宗教靠口耳相传。"
 ulgen_god_desc: "[ShowGodName('ulgen_god')]是[ShowCultureGroupName('turkic_group')]人的善神。\n\n于尔根的名字出自古突厥语中的“富有”和“壮丽”，是创世神，被认为无始无终。他通常与长生天有别，有时又被等同于长生天。\n\n他有七个儿子，称为白衣少年，还有九个女儿，她们是萨满灵感的来源。在阿尔泰传统里，他是冥界之主尔力克的兄弟，二者都由凯尔拉所造；尔力克与光明的上界为敌，被囚禁在大地的第九层。"
 umay_god_desc: "[ShowGodName('umay_god')]是[ShowCultureGroupName('turkic_group')]人的丰饶女神。\n\n乌迈守护妇女、母亲和孩童。乌迈一词原指胎盘。她住在天上，不被常人看见，把未出生婴儿的灵魂保存在一座叫伊迈石的山上。她若久久离开孩子，孩子就会生病，要请萨满把她唤回。\n\n8世纪的阙特勤碑把可汗的母亲比作乌迈，可汗的妻子也被称作乌迈。哈卡斯人尤其敬奉她。"
 urpihuachac_god_desc: "[ShowGodName('urpihuachac_god')]是[ShowRegionName('andes_region')]人的鸟和鱼之母。\n\n乌尔帕伊·瓦查克，又作乌尔皮瓦查克，在《瓦罗奇里手稿》中是神明帕查卡马克的妻子，五姐妹之一。两人有两个女儿，住在近海的岛上。\n\n据手稿所述，鱼起初只由她饲养，后来被抛入海中，才繁衍起来。她的形象兼有鸟和鱼的特征；在圣弗朗西斯科·德·曼加斯，一些氏族以骨头刻成的鸽子向她求雨。"
 uscovilca_god_desc: "[ShowGodName('uscovilca_god')]是[ShowCultureName('chanka_culture')]人的创世神。\n\n乌斯科维尔卡也是秘鲁高地安达瓦伊拉斯农耕民族昌卡人中上昌卡首领的称号。昌卡人于1438年在库斯科被印加击败。"
 viracocha_desc: "[ShowGodName('viracocha')]是[ShowRegionName('andes_region')]人的创世神。\n\n维拉科查是印加以前和印加时代信仰中的至高神。他的形象是一位有胡须的男子；据说他下令修建了蒂瓦纳库，创造了日月星辰，并命令太阳越过天空，由此启动了时间。在印加人那里，他是最重要的神，其后才是因蒂。\n\n一种说法称，他在的的喀喀湖的一座岛上造出人类，教人们如何生活，然后把人类交给较低的神灵，自己隐去。"
 vishnu_god_desc: "$vishnu_god$是[ShowReligionName('hindu')]的主要[gods|e]之一，也是[ShowPolicyName('vaishnavism')]的至高存在。他被视为至高存在，并以十种[avatars|e]的形式显现在地球上。\n\n毗湿奴的名字意为“无所不在者”，在三相神中与梵天、湿婆并列，担任守护者。他在吠陀中并不突出，到公元前最后几个世纪才变得重要，被等同于瓦苏提婆—克里希那和那罗衍那。\n\n每当邪恶与混乱威胁世界，他就化身下凡，恢复秩序，护持正法。十大化身中，罗摩和克里希那最受崇拜。"
 waaq_god_desc: "$waaq_god$是库希特族群信奉的创世神。\n\n瓦格又作瓦加，是非洲之角的天神。这个词在奥罗莫语中仍意为“神”，在孔索语、伦迪勒语等库希特语言里也仍可见到。\n\n奥罗莫人称他为瓦格·托基查，即唯一的神，他通过阿亚纳，即居间传话的灵行事。伊斯兰教传入后，索马里人大多改用阿拉伯语的安拉称呼神，但这个词仍保留在吉德瓦格氏族和埃勒瓦格镇等名称里。"
 war_god_desc: "$war_god$既赋予冲突中的力量与创造，也带来其导致的毁灭与浩劫。\n\n战神在多神宗教中十分常见。希腊的阿瑞斯既体现战斗中的勇气，也体现其中的残暴，而他的姐姐雅典娜则代表谋略与统兵之道。"
 water_god_desc: "$water_god$象征雨水与河流所赐予的力量与复苏。\n\n水神在依赖大海或大河的民族中尤为重要。中国传统中有黄河之神河伯，以及海上女神、航海者的保护者妈祖。"
 wind_god_desc: "$wind_god$象征无拘无束的自由与奇迹般的气息。\n\n许多多神宗教都有一位或几位风神。风神可以兼任空气之神，许多风神还与四季中的某一季相联。"
 xiuhtecuhtli_god_desc: "[ShowGodName('xiuhtecuhtli_god')]是美索美洲众神中的火神。\n\n修特库特利意为“绿松石之主”或“火之主”，是阿兹特克的热、昼和年岁之神，是火山之主，也是中美洲最古老的神祇之一。他通常被画成年轻人的样子，有时又被等同于“老神”韦韦特奥特尔；他的妻子是恰尔丘特利奎。\n\n每家每户的中心都燃着一小堆火来供奉他，每顿饭的第一口食物要投进灶火里。阿兹特克的皇帝在登基时被视为他的化身。"
 yuma_sammang_god_desc: "$yuma_sammang_god$是[ShowCultureName('limbu_culture')]民族的至高神和大地之母。\n\n玉玛桑芒又称“祖母”，受尼泊尔东部林布人，即雅克通人崇奉。至高力量塔格拉·宁瓦普马在人间以她为女性形态，男性形态则是特巴桑芒；林布人把她看作母亲一般的神。\n\n对她的崇拜靠口传的《门顿》流传。18世纪70年代，林布人的林布旺联盟被廓尔喀并吞，但林布人仍保存着自己的文化和《门顿》。"
 zanahary_god_desc: "$zanahary_god$是[ShowReligionAdjective('fomba_gasy_religion')]中的创世神和天父。\n\n扎纳哈里是马达加斯加信仰中人格化的天空与至高神，通常被想象为男性。他与大地神拉托万塔尼共同创造了人类：人死后灵魂升向苍穹，身体回归大地，因此他与灵魂和祖先崇拜关系密切。\n\n他是中部高地梅里纳人的民族神。一份传教士的记录说，马达加斯加人讲述他造出人的手脚之后便离去，任凭人类自行生活。"
 zeus_god_desc: "[ShowGodNameWithNoTooltip('zeus_god')]是奥林波斯诸神的神王，天空、雷霆、律法和宇宙秩序的统治者。\n\n宙斯是克洛诺斯与瑞亚之子，古希腊人的至高神。他被尊为天父，就连并非他亲生的神也称他为父亲。他的象征是雷霆和鹰，妻子是赫拉。\n\n到1337年，希腊人的旧信仰早已消亡。15世纪，哲学家卜列东在他设想的异教秩序中，把宙斯置于首位。"
 adamite_services_desc: "亚当派的信条要求其信徒在进行礼拜时应赤身裸体。洗脱了身份地位和文化的浮饰，我们在上帝的眼里都是平等的，这都提醒着我们，人类在犯下堕落的原罪之前，曾共同享受着人性和天真的愉悦。\n\n史料说2至4世纪的北非曾有亚当派。15世纪的波希米亚，亚当派（又称皮卡尔派）从胡斯派激进的塔博尔派中分裂出来，在内扎尔卡河的一座岛上建立了公社。他们实行财产公有，否认神职和圣餐变体论。1421年，扬·杰式卡进攻并镇压了他们。"
 adoptionism_desc: "我们的信条主张：耶稣基督于受洗或复活后方成为上帝之子，而非永恒具有神性。\n\n有学者认为最早期的基督教文献中就有嗣子论，但教会领袖在4至5世纪把它定为异端。8世纪80年代，托莱多大主教埃利潘杜斯和乌赫尔主教菲利克斯在西班牙使其复兴，称基督在人性上是养子。查理大帝召集的法兰克福会议于794年谴责了它。"
 adult_baptism_desc: "基于对耶稣基督宣示信仰并加入地方信众团体，成人受洗者坚信救赎恩典与教会成员资格乃神所赐。受洗者须亲口表明信仰，此恩无法转移或代受。\n\n1525年，康拉德·格雷贝尔及其追随者在苏黎世开始为成年人重新施洗，被称为再洗礼派。其中的菲利克斯·曼茨因市议会禁止再洗礼，于1527年在林特河中被淹死。"
 aniconism_desc: "任何具象化象征均属偶像崇拜或人为造作，并非表达我主信仰的正确方式。我们拒绝接受所有形象化宗教符号，其他基督教派别使用的十字架亦在此列。\n\n早期基督徒如德尔图良和亚历山大的克雷芒认为十诫对基督徒有约束力，8世纪拜占庭的圣像破坏运动更把这个问题变成了公开冲突。\n\n中世纪的二元论教派走得更远：拜占庭作者指责保禄派拒绝十字架，鲍格米勒派同样弃之不用。16世纪，加尔文宗信徒把图像从自己的教堂中清除出去。"
 arminianism_desc: "阿民念派是以荷兰改革宗神学家雅各·阿民念所提出的人道主义与多元主义神学思想为基础的派别。\n\n雅各·阿民念（1560—1609）曾师从加尔文的继承人西奥多·贝扎，却不接受上帝无条件拣选的说法。在阿民念看来，拣选针对信徒，以信仰为条件，恩典也可以被抗拒。\n\n他去世后，追随者在1610年的《抗辩五条》中陈述主张，因此被称为抗辩派。1618—1619年的多特会议把他们定为异端；约十二年后，荷兰官方重新容许他们存在。"
 asceticism_desc: "物质享受会阻碍我们认识神圣真理。唯有摒弃奢侈、保持简朴生活，才能获得灵性觉醒。\n\n鲍格米勒派相信物质是撒旦的作品，通过禁食和祈祷追求洁净；清洁派的完人则舍弃财产、性和肉食。约1173年，富商彼得·瓦勒度散尽家财，宣讲使徒式的清贫；他的追随者瓦勒度派把自愿守贫当作这一运动的标志。"
 baptism_by_fire_desc: "我们的信仰并不认可水洗礼的永久，正如施洗者圣约翰所承认的那样。只有用燃烧的蜡烛触碰一个人头部的四个方向，才能实现永久的洗礼。\n\n近代早期的天主教徒报告说，巴尔干的保禄派用火而不用水施洗，英国外交官保罗·里科特的记述也证实了这一点。拜占庭皇帝自8世纪起把这一教派迁往色雷斯，其成员后来有的改宗东正教，有的成为穆斯林，有的改信天主教。"
 bread_and_wine_desc: "我们坚信圣餐必须同时领受饼与酒才有效，包括平信徒亦如此。神职人员需向全体信徒分发酒与饼两种形式的圣餐。\n\n兼领圣餐与当时的天主教会相悖，那时只有神父才能饮用圣化的酒。雅各贝克·斯特希布罗于1414年在布拉格宣讲这一教义。圣杯成为胡斯派的标志，1420年它被列为《布拉格四条款》之一；后来路德宗和改革宗教会也采用了饼酒同领。"
 civic_religion_aspect_desc: "敬神等同于维护国家的利好。因此，为确保城邦的繁荣，宗教仪轨与庆典是我们必须履行的公民职责。\n\n在希腊城邦里，信仰没有中央权威管辖，崇拜由各个城邦自行规范。祭司多出自本地的精英家族，节庆则把公民凝聚在一起。\n\n雅典的泛雅典娜节由庇西特拉图在公元前566年整顿定型，节日以列队登上卫城、向雅典娜献祭告终。罗马人也持同样的看法，认为诸神的和平取决于传统仪式被如实举行。"
 clerical_poverty_desc: "神职人员不可积累财富，应当舍弃世俗财物，专注侍奉神而非世俗事务。\n\n彼得·瓦勒度的追随者自12世纪70年代起实行神职清贫，14世纪的牛津神学家约翰·威克里夫则主张所有神职人员都必须彻底守贫。胡斯派把这一主张带到波希米亚：1420年的《布拉格四条款》要求神职人员放弃世俗权力。"
 consolamentum_desc: "因生活过程必然伴随对罪孽的悔恨，为纯洁进入天堂并亲近神，接受#italic 慰藉礼#!成为必要。民众临死前通过此礼得赦罪。\n\n神慰圣事（拉丁语 consolamentum）被天主教的反对者称为“异端化”，是清洁派唯一的圣事。它被理解为圣灵中的洗礼，带来赦罪和传道的权能。\n\n男女都可以领受，一生只有两次：确认入教时和临终前。领受者成为清洁派的“完人”。"
 crown_as_head_of_faith_desc: "教会不再从属于外部腐败的神权机构。所有宗教事务由世俗统治者裁决，君主成为信仰最高领袖。\n\n1534年议会通过《至尊法案》，亨利八世取代教宗成为英格兰教会的最高首脑。1558年伊丽莎白一世时期的法案则授予她“最高管理者”的称号。\n\n在神圣罗马帝国，路德宗诸侯以“紧急主教”的身份接管教会事务，1555年的《奥格斯堡和约》又允许各诸侯决定自己领地的信仰。"
 dii_familiares_aspect_desc: "家宅诸神在我国人民的生活中扮演着极其重要的角色。他们守护并影响着个人领域中的一切，这通常指一个家庭，但也可以延伸至道路、社区，甚至整座城市。\n\n家宅拉尔的神像在家人用餐时摆在餐桌上，家中的一切重要场合都要求得他们的祝福。另一些拉尔守护道路、田地、城镇乃至国家。街坊的拉尔供奉在十字路口的神龛里，那里是十字路口节的中心，被释奴和奴隶都可以担任祭祀人员。非官方的崇拜一直延续到5世纪初。"
 dionysian_mysteries_aspect_desc: "受酒神狄俄尼索斯秘仪启示者的仪式、舞蹈与音乐，为其成员提供解脱与释放，无分社会阶级。神灵的死亡与重生，就如同葡萄藤的生长周期——从大地中萌发，酿成葡萄酒，最终被信徒们饮下，以此荣耀狄俄尼索斯。\n\n狄俄尼索斯秘仪中，信徒在火把下随鼓和笛声起舞，直至进入出神状态。奴隶、亡命者和非公民都能在仪式中得到释放，不少统治者因此忌惮这一崇拜。入会者死后以金片陪葬，金片上写着穿越冥界的指引。"
 eastward_prayer_desc: "在整个基督教世界，面向东方、朝向基督的朝阳祈祷是普遍做法。其他一些教派可能对这一朝向要求不那么严格，但对我们而言，无论是在公开场合还是私下祈祷，都绝无其他方式，我们所有的教堂都必须按照这一朝向来建造。\n\n德尔图良说，有些异教徒因此以为基督徒崇拜太阳。后来的作者把它与基督的再临联系起来，《马太福音》把人子降临比作从东方发出的闪电。\n\n约375—380年的《使徒宪章》规定教堂的圣所设在东端；罗马直到8或9世纪才接受这一朝向。科普特教会每日七次时辰祈祷都面向东方，教堂也按此方向建造或改建。"
 eleusinian_mysteries_aspect_desc: "厄琉息斯秘仪的追随者信奉这样一则神话：珀耳塞福涅被冥界之王哈迪斯从其母亲得墨忒耳身边劫走，珀耳塞福涅随后获释却又遭到欺骗。对已受启示者而言，这神话代表着所有植物生命生长与重生的循环，以及生命世代相传的永恒。\n\n厄琉息斯秘仪是每年在厄琉息斯为得墨忒耳和珀耳塞福涅举行的入会仪式。仪式演绎珀耳塞福涅返回人间、与母亲得墨忒耳重逢的故事，这是一个生命回归的故事，也向入会者许诺死后的回报。\n\n在庇西特拉图治下，仪式吸引了希腊各地的朝圣者。公元392年狄奥多西一世下令关闭秘仪，396年阿拉里克洗劫了圣所。"
 five_doors_desc: "部分民众实践着一种冥想方式：关闭房屋所有门，同时开启#italic 五感之门#!。我们将全面推行此修行法。\n\n鲍格米勒派认为肉体是撒旦的作品，不建教堂，而在私人住宅中祈祷，并通过禁食和舞蹈来净化身体。"
 freedom_to_preach_desc: "尽管信徒存在分歧，各教派都享有宣讲自由，前提是心怀对神的敬畏。\n\n1568年1月，特兰西瓦尼亚三民族议会应反三位一体论传道人费伦茨·达维德的请求在托尔达集会，授权各地方社区自行选举传道人。\n\n这份在约翰·西吉斯蒙德·扎波利亚治下颁布的敕令，使天主教、路德宗、加尔文宗以及达维德周围的一位论派可以并存宣讲。它没有赋予个人良心自由，但在16世纪的欧洲是前所未有的宽容之举。"
 gnosticism_desc: "诺斯替主义以灵知（#italic 诺斯#!）为个人救赎核心。我们通过寻求灵性觉悟脱离物质世界，回归神圣领域。\n\n诺斯替主义是对一系列运动的统称，到2世纪中叶已完全成形。诺斯替派一般认为，物质世界是有缺陷的造物主所造，而非隐藏的至高神。\n\n后来的二元论基督徒与此相呼应。鲍格米勒派教导说物质是撒旦的作品，源出于它的清洁派则称灵魂是被困在肉体里的灵。"
 gomarism_desc: "弗朗西斯·戈马尔反对传播伯拉纠主义的雅各·阿民念，并试图在他们二人共同执教的大学中建立新的神学学院。\n\n戈马尔派是弗朗西斯·戈马尔（1563—1641）所持的严格加尔文主义。他生于布鲁日，1594年起任莱顿大学神学教授，坚持无条件拣选。\n\n1610年抗辩派陈述主张后，戈马尔的追随者在1611年以《反抗辩书》作答，被称为反抗辩派。在1618—1619年的多特会议上，他们占了上风，《多特信经》否定了阿民念派的立场。"
 hero_cult_aspect_desc: "我们的历史中充满了塑造了我们社会与品格的伟人。他们是诸神的凡生子嗣，拥有非凡能力却又常遭逢悲剧命运，他们曾保护并领导我们的祖先，最终建立起我们今天这个伟大的国家。敬拜他们并汲取他们的教训，是我们现在的责任。\n\n在希腊宗教中，英雄是传说中的凡人，人们在他的祠堂（英雄祠）里举行祭仪，祠堂多建在他的墓上。被冷落的英雄会降下疾病。公元前7世纪晚期，雅典立法者德拉古下令把本地英雄与诸神一并祭祀。"
 holy_cooperation_desc: "我们将转向倡导并积极参与生产劳动。此理念将延伸至农业社区，效仿早期基督徒的神圣协作社群模式。\n\n鲍格米勒派否定教会的等级制度，本着平等精神，由各个会众自行任命领袖。"
 imperial_cult_aspect_desc: "正如古罗马的皇帝曾被人民与元老院尊为神明，我们的统治者及其王朝也应被如此看待。他们的伟大、威严与权威，明示着他们不仅获神授之权，其本身即是神。\n\n罗马帝国崇拜把皇帝和部分皇室成员与国家得到神明认可的权威等同起来。它在奥古斯都治下成形，并传遍各行省，尽管共和国从未崇拜过在世之人。\n\n元老院可以通过神化仪式把已故皇帝尊为国家神明；韦斯帕芗和塞普蒂米乌斯·塞维鲁都曾借此巩固新王朝。该崇拜与罗马的官方诸神密不可分，狄奥多西一世以基督教为国教后，它被废弃。"
 individual_creeds_desc: "允许信徒自行制定信纲，以此促进多元观点的形成，推动信仰进步！\n\n宗教改革之后，各教会不再共用同一部信经，而是各自撰写信纲，如1530年的《奥格斯堡信条》和1559年的《高卢信条》。"
 instituionalized_arminianism_desc: "$arminianism_desc$此宗教运动现已在我国制度化。\n\n阿民念派是新教最早对加尔文主义预定论作出的系统回应之一。其追随者抗辩派在1618—1619年的多特会议上受到谴责，荷兰各地的阿民念派被监禁、流放或勒令噤声。\n\n约十二年后，荷兰官方承认这一运动为一种受保护的宗教，但它与加尔文派的敌意仍在继续。早期抗辩派中有人如腓力·范林堡转向理性主义。"
 instituionalized_gomarism_desc: "$gomarism_desc$此宗教运动现已在我国制度化。\n\n弗朗西斯·戈马尔的严格加尔文主义在荷兰共和国得到了国家的支持。拿骚的莫里斯亲王站在反抗辩派一边，有步骤地把阿民念派官员撤职，并召集全国性会议于多德雷赫特。\n\n1618—1619年的多特会议主要向荷兰加尔文派开放，另有28名外国改革宗教会的代表；13名抗辩派被禁止投票。会议把阿民念及其追随者定为异端，会议通过的《多特信经》逐条回应了阿民念派的教义。"
 justified_conflicts_desc: "我国的新教会正遭遇异教和异端的威胁。在自我防卫战争中，教会将以圣经正当化我们的冲突。\n\n路德宗神学家否认战争可以是神圣的。1526年，马丁·路德在《士兵也能得救吗》中主张，从军是正当的职业。\n\n1529年的《论对土耳其人的战争》里，他放弃了把土耳其人看作上帝降下的惩罚的旧看法，敦促查理五世和德意志人起而抵抗，但只能是防御性的世俗战争，绝不是十字军。1531年，路德宗诸侯组成施马尔卡尔登联盟，对抗查理五世。"
 mithraic_mysteries_aspect_desc: "密特拉秘仪的入教者自称为辛德西奥伊（意为“立誓同道者”），在罗马帝国全盛时期于罗马城及西罗马帝国极受欢迎。他们的仪式、集会和宴饮都在秘密的地下神庙中进行，但我们可以将他们重新带回光明，为我们的民众复兴这些习俗。\n\n密特拉秘仪是罗马帝国奉祀密特拉神的秘密教派，1至4世纪在帝国军队中十分流行。入会者自称“辛德西奥伊”，意为“以握手结盟者”，并共享宴饮。\n\n他们神殿的核心画面是密特拉屠牛。该教以罗马城为中心，传到了不列颠和达契亚。4世纪它遭到基督徒迫害，到世纪末在帝国境内被取缔。"
 modalism_desc: "我们坚信上帝是绝对独一的存在，圣三（圣父、圣子、圣灵）只是神在不同时期显现的形态。\n\n2世纪末至3世纪，形态论的主要倡导者是诺埃图斯、普拉克塞亚斯和撒伯里乌，后者之名使它又被称为撒伯里乌主义。教会领袖谴责了这一教义，4世纪的尼西亚体系则确认三个位格各自有别。"
 monasticism_desc: "美食享乐会干扰神圣侍奉。进入偏远修道院隐居是避免此类诱惑的最佳方式。\n\n基督教隐修制度兴起于3世纪的埃及沙漠，最早的隐修者有安东尼，帕科缪随后在那里组织了第一批隐修团体。埃及的修道院此后一直是科普特教会的核心。\n\n在西方，《本笃会规》成为典范。新教改革者否定修道誓愿，1536至1541年间，亨利八世解散了英格兰、威尔士和爱尔兰的全部修道院。"
 monism_aspect_desc: "我国复兴时代的哲人主张，世间一切存在皆源自太一—— 这是唯一超越性本源，诸神与万物皆由其流溢而生。传统万神殿被赋予寓言意义，诸神皆为太一的不同显现。各类神谕预兆不再拥有独立神力，但对太一的信仰将渗透至一切治国理政之中。\n\n新柏拉图主义由普罗提诺（约205—271）创立，在亚历山大里亚和雅典的学园中兴盛，直到6世纪。15世纪，米斯特拉的格弥斯托士·卜列东借助它发起了一场异教复兴。\n\n他在《法律书》中舍弃基督教，主张崇拜以宙斯为首的希腊诸神，并把诸神看作普遍的原理和行星的力量。他去世后，这部著作送到了牧首热那底乌斯二世手中，后者于1460年将其焚毁。"
 mos_maiorum_aspect_desc: "自远古时代直至帝国鼎盛时期，支配罗马人生活的不成文法则便是“祖先之道”。这套传统与习俗定义了何谓罗马人，以及在家中和公共场合应如何行事。\n\n祖宗之法是罗马人社会规范的来源，与成文法相辅相成。它约束着家庭——家长权威极大，却应当有节制地行使——也约束着庇护人与门客之间的关系。\n\n其美德包括庄重，穆奇乌斯·斯凯沃拉便是例证：他在伊特鲁里亚国王拉尔斯·波尔塞纳面前把手伸进火中。宗教也属于其中：正确举行仪式，才能维持与诸神的和平。"
 name_change_desc: "我们社群深知名字的力量。信仰领袖常改为圣保罗追随者之名，民众则用主保圣徒居所地名命名定居点。\n\n马纳纳利斯的君士坦丁约在660年于基博萨创立保禄派，改名为西尔瓦努斯。奉命处决他的军官西门反而加入了该派，改名提多，于690年被烧死。"
 olympiad_aspect_desc: "奥林匹克运动会是敬奉诸神的庆典，也是展示我国实力与团结的盛事。参与运动会是公民的职责，为我们的运动员带来荣耀。\n\n奥林匹克运动会在奥林匹亚举行，为敬奉宙斯而设，传统上始于公元前776年，每四年一届。各城邦派出自己的优胜者，奥林匹克休战令保证运动员和朝圣者能安全前往；胜者获得橄榄枝冠。\n\n各邦在此宣布结盟，战时祭司会为胜利献祭。最后一次有记录的运动会在公元393年举行，当时在位的是狄奥多西一世。"
 organized_through_bishops_desc: "与其完全废除主教任命制度，不如让主教以区域管理者的身份服务教会。\n\n1534年亨利八世与罗马决裂后，英格兰教会保留了主教制，主教由王室任命。瑞典教会同样保留了历史性的主教制，并宣称使徒统绪不断，在宗教改革中仍保留了神父、法衣和弥撒。"
 pacifism_desc: "使人和睦的人有福了，因为他们必称为神的儿子。\n\n在波希米亚，平信徒彼得·切尔契茨基约从1420年起教导说，宗教事务不可使用暴力，连罪人也不可杀害，基督徒应拒绝服兵役。大多数胡斯派拒绝了他的主张，但他的著作促成了1457年成立的兄弟会。"
 parish_registers_desc: "所有洗礼、婚礼、葬礼的详细信息必须记录在教区登记册。各堂区教区需准备专用册籍，保存在双锁保险箱中。\n\n16世纪之前，只有少数神父和修会驻地做过非正式的堂区记录。英格兰的制度始于1538年9月5日，托马斯·克伦威尔以亨利八世教会代理总管的身份，命令每个堂区备置登记册。天主教的特伦托会议则在1563年要求登记洗礼和婚姻。"
 participation_women_desc: "女性在教会中享有与男性平等的参与权，我们将推行普遍规则，确保男女待遇一致。\n\n在清洁派中，慰藉礼对女性和男性同样开放。女性因此也能成为完人并传道。\n\n1204年，富瓦伯爵雷蒙‑罗热的妹妹埃斯克拉蒙德在法尼若，由清洁派主教吉尔哈贝·德·卡斯特尔为她施行慰藉礼。同时受礼的还有三位贵妇，即奥德·德·法尼若、费斯·德·迪尔福尔和雷蒙德·德·圣日耳曼，她的兄长在场。"
 paulician_canon_desc: "我们拒绝《旧约》及其先知，正如他们不接纳彼得的书信一般。唯圣保禄之言方为天启。\n\n拜占庭作者记述，保禄派接受四部福音书，尤其重视《路加福音》，还接受保禄的十四封书信，约翰、雅各和犹大的书信，以及一封他们自称拥有的《致老底嘉人书》。彼得的书信中，他们拒绝的是《彼得前书》。\n\n《真理之钥》是一部被认为属于保禄派、18世纪抄写的文本，却接受《旧约》。学者对这些转述也有争论。"
 pescatarianism_desc: "动物是转世灵魂的载体，因此我们不能食用它们。鱼类是自然生成的生物，并不被视为动物，所以可以食用。\n\n清洁派的完人不吃奶酪、蛋、奶和肉，视之为性繁殖的副产品，吃了就会使物质世界里的轮回延续下去。因此这一教派的饮食被称为鱼素。"
 pietism_desc: "虔敬主义强调每位信徒的个人虔敬，注重内在转变以践行虔诚基督徒生活。\n\n虔敬主义在德意志路德宗内部成形，约1670年，菲利普·雅各布·施本尔开始在法兰克福的家中举行读经聚会。1675年，他出版《敬虔愿望》，主张在教会内设立小型查经团体，扩大平信徒的作用，并让信仰体现在行为上。\n\n奥古斯特·赫尔曼·弗兰克于1695年创办哈勒孤儿院，哈勒由此成为这场运动的中心。他的学生辛岑多夫伯爵在1727年复兴了摩拉维亚教会。"
 prima_scriptura_desc: "尽管《圣经》必须被视为救赎的核心来源，但它不能被视作神圣启示的唯一来源。\n\n圣经首位论（拉丁语 prima scriptura，意为“圣经优先”）是圣公宗历来的立场，不同于“唯独圣经”。传统与理性有助于解释《圣经》，《圣经》仍是最高权威。\n\n1571年的《三十九条信纲》第六条宣布《圣经》足以使人得救。理查德·胡克以圣经、传统、理性构成的“三脚凳”回应清教徒，后来卫理公会又在此基础上发展出自己的四边形。"
 punishment_by_stoning_desc: "在我们的社区，石刑是惩处宗教异见者的常见手段，这一行为可能继承自安纳托利亚传统。\n\n石刑是《旧约》对亵渎和偶像崇拜规定的刑罚，在基督教的东方也被用来惩处宗教异见。保禄派的传统把它记在创始人、马纳纳利斯的君士坦丁（西尔瓦努斯）的结局里。\n\n帝国当局以异端罪名逮捕了他，约在687年用石头将他砸死。执行判决的宫廷官员西蒙后来自己皈依，改名提多，继任为保禄派的领袖。"
 punishment_of_sin_desc: "所有有罪者都将被等量齐观的惩罚，无论财富和地位。即使是尊贵之人也不能逾越天主的法律。\n\n罪罚平等是布拉格四条款中的第四条。该条款是胡斯派的纲领，由温和的布拉格派与激进的塔博尔派于1420年7月议定，要求各个等级里的一切死罪，尤其是公开的死罪，都由负有责任者加以制止和纠正。\n\n1421年，恰斯拉夫议会把四条款定为法律。但它们始终没有被完全接受：1436年的巴塞尔会议只承认了平信徒领杯。"
 rejection_of_sacraments_desc: "我们的教义拒绝大多数基督教圣礼，因其本质为物质形式且无关紧要。唯有灵性部分能使人更亲近神。\n\n清洁派只保留一种圣礼，即慰藉礼，也就是在圣灵中受的洗礼，它带来赦罪和传道的权能。其对手称他们把教会的其他圣礼视为无足轻重。鲍格米勒派同样否定教会等级制度。他们也不建教堂，因为认为身体本身就是神殿。"
 ritual_purification_desc: "信徒如果要更亲近上帝，其灵魂与身体都必须洁净无染。\n\n洁净礼仪是基督合性派教会的鲜明特征。科普特基督徒在诵念《阿格佩亚》每日七次时辰祈祷之前，要洗手洗脸、脱鞋，并遵守洁净日。\n\n埃塞俄比亚的教会深受旧约习俗影响，信徒在祈祷前和饭后洗手，做法与犹太人相近。妇女经期不得进入教堂，不洁者在礼拜时站在教堂门边，在外面祈祷。"
 samothracian_mysteries_aspect_desc: "在萨莫色雷斯岛上，一个神秘教派在希腊化时期蓬勃发展；它以广纳任何想加入的人而闻名，无论其社会阶层如何。据说许多神话英雄，如赫拉克勒斯、伊阿宋和俄耳甫斯，都在萨莫色雷斯接受了入会仪式。我们可以从遗迹和废墟中收集并重构这些奥秘，使该教派重现过去的辉煌。\n\n诸大神的秘仪在萨莫色雷斯岛的圣所举行。与厄琉息斯秘仪不同，入会没有年龄、性别、身份或国籍的限制：男人和女人、希腊人和外邦人、自由人和奴隶都可以参加。\n\n亚历山大的继任者们争相捐建。罗马晚期迫害异教徒、神庙被关闭后，这一崇拜逐渐湮没。"
 sola_fide_desc: "善行无法取悦神。我们仅因神恩得赦免，此恩典通过其独子耶稣基督赐予我们。\n\n唯独信心（拉丁语 sola fide，意为“唯独信仰”）认为善行是信仰的证据，而不是换取救赎的代价。1517年马丁·路德抨击赎罪券之后，把它变成宗教改革的核心，路德宗和改革宗教会都接受了这一教义。特伦托会议在1547年的称义法令中否定了它。"
 sola_scriptura_desc: "圣经是上帝传达给人类的真言，是基督教教义的唯一权威。一切没有引用圣经支持的宗教行为都将被斥为异端。\n\n唯独圣经（拉丁语 sola scriptura，意为“唯凭圣经”）并不意味着路德和加尔文完全抛弃了教会传统，他们只是把它置于圣经之下。1521年的沃尔姆斯会议上，路德声称除非有人用圣经和明白的理性证明他有错，否则绝不收回主张。\n\n这一原则成为路德宗和改革宗教会的形式根基。它也是主张圣经高于教会传统的胡斯派的特征。"
 soli_deo_gloria_desc: "人类的一切成就，都只有以对上帝的赞美为献礼才能创造。\n\n唯独神的荣耀（拉丁语 soli Deo gloria，意为“荣耀唯独归于神”）把赞美归于上帝，而不是成就的创造者。它后来被算作概括宗教改革者基本信念的五个“唯独”之一。\n\n约翰·塞巴斯蒂安·巴赫（1685—1750）在所有教会作品的末尾都写上缩写 S. D. G.。格奥尔格·弗里德里希·亨德尔有时也用这一题献，如他的《感恩赞》。"
 specialized_canon_desc: "受上帝启示而写的书籍都值得敬重与研习，即便是那些灵性价值较低、已被其他教派明确摒弃的书籍也不例外。\n\n基督合性派的教会从未确定唯一的经书正典。埃塞俄比亚正教会的正典最广，共81卷，包括《以诺书》、《禧年书》和三卷《梅卡比安书》。\n\n《以诺书》只有吉兹语译本完整存世。该教会的新约还增添了八卷出自教会规章的书，其中有四卷《西诺杜斯》和《使徒训诲》。"
 the_perfects_desc: "特别虔信神与人类美德者称为“完人”。这些男女因奉献接受#italic 慰藉礼#!成为完人。与常人不同，完人一生接受两次#italic 慰藉礼#!：晋位时与临终前。\n\n完人（拉丁语 perfecti，又称“善人”）是清洁派的精英，经过一段考验期后才获准领受慰藉礼，这是该派唯一的圣礼。他们舍弃财产、性、誓言和肉食，四处传道。\n\n普通信徒往往拖到临终才领受此礼。阿尔比十字军之后，宗教裁判所把朗格多克的完人当作主要追捕对象。"
 translated_bibles_desc: "将圣经译为国民语言，可使其以触及心灵和启迪思想的方式获得通达神的最佳路径。\n\n1382年的威克里夫圣经是第一部完整的英语译本，捷克语的《布拉格圣经》于1488年印行。马丁·路德的德语新约出版于1522年，威廉·廷代尔的英语新约出版于1526年，钦定版圣经则在1611年问世。"
 twelve_emissaries_desc: "受部分社群组织启发，我们将从长者与完人中选举十二名智者组成最高议会，但不建立严格等级制度。\n\n鲍格米勒派没有东正教意义上的神职阶层。据说每个社群各有十二名“使徒”，呼应基督的十二门徒；圣职由会众授予，而不是由主教授予。女性可以晋升为“选民”。\n\n这种组织适合一个否定教会等级制度的运动，其传播靠云游传教士。这些传教士治疗病人，驱赶恶灵。"
 usury_allowed_desc: "收取利息的货币贷款现在已被允许，这种贷款使放贷者致富，不再会被视为罪孽。\n\n中世纪天主教教义把收息放贷视为罪恶的高利贷，1179年第三次拉特兰公会议即加以谴责。约翰·加尔文允许适度的利息，并在1545年写给友人克洛德·德·萨尚的信中表明了这一立场。同一年，亨利八世的议会在英格兰承认年息不超过百分之十为合法。"
 war_sermons_desc: "战乱时期，信仰维系着人们的希望。即使在最黑暗的时刻，我国的教会也将手持圣典，坚持布道，以此鼓舞民众的士气。\n\n15世纪20年代的胡斯战争中，军队高唱《尔等乃上帝的战士》，由一名教士领唱。据说这首歌曾把一支十字军吓得不战而逃。\n\n在英格兰，圣保罗十字是都铎时期最重要的露天公共讲坛。王室的信息由此传达给民众，1588年击败无敌舰队后的感恩布道即在此举行。"
 worship_agwu_nsi_god_desc: "$worship_desc1$[ShowGodName('agwu_nsi_god')]$worship_desc2$\n\n阿格乌是伊博人掌管占卜的阿鲁西，即神灵。他的领域是占卜师迪比亚的技艺；在伊博宗教中，迪比亚通过阿法占卜得知诸神灵的要求。"
 worship_ak_ana_god_desc: "$worship_desc1$[ShowGodName('ak_ana_god')]$worship_desc2$\n\n白母，即“圣母”，是突厥人的水神；在阿尔泰创世神话里，她促使凯尔拉创造世界。人们认为土地的丰饶和产出取决于她。"
 worship_aki_pen_god_desc: "$worship_desc1$[ShowGodName('aki_pen_god')]$worship_desc2$\n\n阿吉宾是贡德人的村落守护神，是受到比高神婆罗提乌热切得多的崇拜的村神之一。每逢节庆之前，人们先要敬奉他，同时敬奉村母神安瓦尔。"
 worship_akuj_god_desc: "$worship_desc1$[ShowGodName('akuj_god')]$worship_desc2$\n\n图尔卡纳人是图尔卡纳湖盆地的半游牧牧民。在他们的信仰中，阿库吉是唯一的至高存在。他创造了世界，赐予水、食物、牲畜和子嗣。\n\n敬奉阿库吉要经由占卜师恩吉穆罗克。图尔卡纳人的传统把财富和势力归功于恩吉穆罗克和瘤牛，正是它们使图尔卡纳人战胜了其他阿特克尔人对手，到17世纪已占据整个图尔卡纳盆地。"
 worship_alwet_god_desc: "$worship_desc1$[ShowGodName('alwet_god')]$worship_desc2$\n\n阿尔韦特被算作丁卡天神尼雅力克的后代，被称为雨之女神。丁卡人在祈祷中祈求降雨，也祈求丰收。"
 worship_amadioha_god_desc: "$worship_desc1$[ShowGodName('amadioha_god')]$worship_desc2$\n\n阿马迪奥哈意为“人民之人”，是伊博人的雷电之神，是最受欢迎的伊博神明之一。他为受压迫者主持公道，用雷击打击压迫者及其财产，据说代表民众的集体意志。\n\n他的颜色是红色，象征物是白公羊。他的主神庙在埃特切的奥祖祖，据说他的崇拜由此传遍伊博地区。"
 worship_anansi_god_desc: "$worship_desc1$[ShowGodName('anansi_god')]$worship_desc2$\n\n阿南西意为“蜘蛛”，是阿肯人宗教和民间故事中的骗子，常被画成蜘蛛或带蜘蛛特征的人，与故事、智慧和机巧相联系。在某些故事里，他是阿萨塞亚之子。\n\n其中一则故事讲他披上从各种鸟身上收集来的羽毛，飞到天神尼亚梅的村子上空，探出了尼亚梅秘密山药的名字，因而成为尼亚梅的信使。他的故事随奴隶贸易传到牙买加和苏里南。"
 worship_andriamahilala_god_desc: "$worship_desc1$[ShowGodName('andriamahilala_god')]$worship_desc2$\n\n安德里亚玛希拉拉是马达加斯加神话中的第一个女人，与月亮相连。她选择像月亮那样死去，并在每个月重生。"
 worship_andriambahomanana_god_desc: "$worship_desc1$[ShowGodName('andriambahomanana_god')]$worship_desc2$\n\n安德里亚姆巴霍马纳纳是马达加斯加神话中的第一个男人。他选择像香蕉树那样死去，枯萎时会长出新芽。"
 worship_andrianerinerina_god_desc: "$worship_desc1$[ShowGodName('andrianerinerina_god')]$worship_desc2$\n\n在梅里纳人的几种起源神话之一中，安德里亚内里内里纳是伊梅里纳诸王的祖先。他是天神扎纳哈里之子，下凡来到岛上最早居民的中间。"
 worship_anyame_god_desc: "$worship_desc1$[ShowGodName('anyame_god')]$worship_desc2$\n\n尼亚梅又称奥尼扬科蓬，是加纳阿肯人的至高天神。他的名字意思是“知晓并看见一切者”。\n\n有一种说法把尼亚梅、尼扬科蓬和创造者奥多曼科马合为一体。阿肯人的谚语说，奥多曼科马造出了宇宙、生命和死亡，随后被死亡杀死；传说尼亚梅还生下了黑暗之神埃苏姆、月神奥斯拉内和日神奥维亚。"
 worship_asase_ya_god_desc: "$worship_desc1$[ShowGodName('asase_ya_god')]$worship_desc2$\n\n阿萨塞亚意为“星期四出生的大地”，是阿肯人的大地女神，天神尼扬科蓬之妻，比亚和塔诺之母。芳蒂人称她为阿萨塞阿芙娅。\n\n她既是亡者之母的老妇形象，人们就社群事务以占卜向她求问，又是掌管生育与农耕的年轻女子。她没有神庙，阿散蒂人和其他阿肯人在田地里向她献祭。"
 worship_asis_god_desc: "$worship_desc1$[ShowGodName('asis_god')]$worship_desc2$\n\n卡伦津人不为阿西斯建神庙，认为建筑会限制太阳神的力量。各部落划出一座山头作为祭祀之所，称为卡普科罗斯，由名叫蒂西克的祭司主持礼拜；每户人家在屋门东侧还设有祈祷树或祭坛。"
 worship_ayum_god_desc: "$worship_desc1$[ShowGodName('ayum_god')]$worship_desc2$\n\n阿尤姆被算作丁卡天神尼雅力克的后代，被说成阻止降雨的力量。因此她出现在祈求风调雨顺的祷词里，而不是哪个氏族的主神。"
 worship_bai_baianai_god_desc: "$worship_desc1$[ShowGodName('bai_baianai_god')]$worship_desc2$\n\n白白阿奶是雅库特人的森林与走兽之灵，也是猎人的守护神。传说中他是住在林中、快活爱吵闹、拥有大量毛皮的老人。\n\n猎人在出猎前、猎获颇丰时以及长久不得猎物时向他献祭，供品有马奶酒、煎饼和黄油。猎人还会点起篝火祈祷，愿狩猎丰收而平安无事。"
 worship_baradeo_god_desc: "$worship_desc1$[ShowGodName('baradeo_god')]$worship_desc2$\n\n在贡德人的民间传统中，婆罗提乌又称巴关、库帕尔·林戈、巴达德奥或佩尔萨·彭，是统辖次级神明的高神，次级神明包括氏族神和村神，也包括祖先。人们敬重他，但并不热切地崇拜他；热切的虔诚献给氏族神和村神、祖先与图腾。\n\n贡德人的每个氏族都有自己的佩尔萨·彭，意为“大神”。它由氏族祭司主持，以献祭敬奉。"
 worship_bathoubwrai_god_desc: "$worship_desc1$[ShowGodName('bathoubwrai_god')]$worship_desc2$\n\n巴图布赖意为“长者”，是博多人至高而不可见的神，相传创造了空气、火、土、水、以太五大元素。传统上人们通过庭院或公地里栽种的西久树，以及家中的祭坛来敬奉他；拜神者面朝东方，把灯转五圈。\n\n凯莱节是博多人最盛大的节日。它就是为取悦他和他的女儿买瑙而举行的。"
 worship_bura_bagh_raja_god_desc: "$worship_desc1$[ShowGodName('bura_bagh_raja_god')]$worship_desc2$\n\n布拉巴格王是阿萨姆博多人四位主要家神之一。西德尼·恩德尔把他与巴图布赖、买瑙和宋布赖并列。"
 worship_chaac_god_desc: "$worship_desc1$[ShowGodName('chaac_god')]$worship_desc2$\n\n恰克是玛雅人的雨与雷之神，用他的闪电斧劈打云层。四位恰克分别镇守四方，各有自己的颜色；据说东方的恰克“恰克·西布·恰克”同时是奇琴伊察一位国王的头衔。\n\n尤卡坦的求雨仪式“恰·恰克”里，四个男孩扮作青蛙吟唱，为雨神们举行宴席。16世纪，人们还在石灰阱边祈雨。"
 worship_chinchaycamac_desc: "$worship_desc1$[ShowGodName('chinchaycamac_god')]$worship_desc2$\n\n钦查卡马克是钦查人的主神，钦查人是秘鲁海岸钦查河谷一带的航海和贸易民族。他的神谕所富有而著名，很可能设在拉森蒂内拉大型土坯金字塔附近，接受钦查人和其他人的供奉。\n\n印加人在帕查库特克治下先以和平方式接触钦查人。托帕·印加·尤潘基随后吞并了这个王国，不过钦查的领主仍保留了大部分自治权。"
 worship_coatlicue_god_desc: "$worship_desc1$[ShowGodName('coatlicue_god')]$worship_desc2$\n\n科瓦特利奎意为“蛇裙”，又名“众神之母”特特奥·因南，是阿兹特克人的女神，生下了月亮、群星和维齐洛波奇特利。“我们的祖母”托奇，以及难产而死的妇女的守护神西瓦科亚特尔，被视为她的不同面相。\n\n在讲述当前太阳诞生的一种说法里，在特奥蒂瓦坎自焚献身的诸神中也有包括科瓦特利奎在内的女性。据说阿兹特克人崇拜她们复活的裙子。"
 worship_creator_god_desc: "$worship_desc1$[ShowGodName('creator_god')]$worship_desc2$\n\n许多民族相信有一位创造者造出了世界和其中的一切。伊博人的创造者是楚库，万物之源，所有次级神灵都是他的化身或仆从。阿坎人称他为奥多芒科马，意为“唯一赐予宇宙者”；马达加斯加人称他为扎纳哈里，他与大地神拉托万塔尼共同创造了人类。"
 worship_death_god_desc: "$worship_desc1$[ShowGodName('death_god')]$worship_desc2$\n\n许多宗教为死亡设了专门的神，他或者夺人性命，或者统治死后世界。阿兹特克人崇拜米克特兰特库特利，他是冥界最深处米克特兰的王，特诺奇蒂特兰大神庙以北的鹰之家入口立有他的两尊陶像。\n\n加纳的阿坎人则有奥乌奥，据说他被创造出来就是为了杀人。最后连造物神奥多芒科马也死在他手里。"
 worship_dharti_ayo_god_desc: "$worship_desc1$[ShowGodName('dharti_ayo_god')]$worship_desc2$\n\n陀利底阿瑜又称查拉帕丘女神，是娑罗教的大地母神，与大地或自然等同。信奉她的是乔塔那格浦尔高原的桑塔尔人、奥朗人、霍人和蒙达人。"
 worship_donyi_god_desc: "$worship_desc1$[ShowGodName('donyi_god')]$worship_desc2$\n\n冬尼是太阳，阿鲁纳恰尔的塔尼诸族称她为“阿内冬尼”，即“太阳母亲”。敏荣和帕达姆两支阿迪人说，她与月亮是创造者塞迪的双眼，塞迪创世后退居幕后，就用这双眼睛注视着世界。\n\n塔尼人的日常话语里会呼求她作证。被人诬为说谎的人高喊“冬尼啊”，相信太阳会奖赏正直者、惩罚说谎者。"
 worship_doying_bote_god_desc: "$worship_desc1$[ShowGodName('doying_bote_god')]$worship_desc2$\n\n多英波特是阿鲁纳恰尔邦塔尼诸族的神。他与冬尼、波罗和基内纳内并列为自然诸神中的主神，相传他们注视着大地和人类。"
 worship_du_chie_god_desc: "$worship_desc1$[ShowGodName('du_chie_god')]$worship_desc2$\n\n杜奇耶是丁卡人的创世神，有的说法把他放在尼雅力克之前，有的把他与后者并列。丁卡人祈祷时首先呼唤的是尼雅力克。"
 worship_dzahui_god_desc: "$worship_desc1$[ShowGodName('dzahui_god')]$worship_desc2$\n\n扎维的名字在米斯特克语中就是“雨”，他是雨神，西班牙征服之前也是米斯特克人的守护神，米斯特克人自称“雨之民”。手抄本里他戴着护目面具、露出獠牙，与墨西哥中部的特拉洛克相似。\n\n他的主要崇拜中心是阿丘特拉，那里供奉着他的神圣包裹。遇到干旱、疫病和收获的时节，人们会在山顶向他献祭儿童。"
 worship_earth_god_desc: "$worship_desc1$[ShowGodName('earth_god')]$worship_desc2$\n\n大地多被当作女神崇拜。阿坎人不为阿萨西·亚建庙，而是在农田里向她献祭；印加人信奉的大地女神是帕查玛玛。\n\n阿兹特克人的大地神特拉尔特库特利，其身体创造了世界；马达加斯加的大地神拉托万塔尼则用泥土塑造人类，人死后又把尸体收回。"
 worship_egbesu_god_desc: "$worship_desc1$[ShowGodName('egbesu_god')]$worship_desc2$\n\n埃格贝苏是尼日尔河三角洲伊乔人的正义之神，也是对抗邪恶的精神力量。这种力量只能用于防卫或纠正不义，并且只有与宇宙和谐相合的人才能使用。豹、黑豹和狮子是这种神力的象征。"
 worship_erlik_god_desc: "$worship_desc1$[ShowGodName('erlik_god')]$worship_desc2$\n\n尔力克是突厥和阿尔泰信仰里的冥界之主，通过他的诸多恶灵给人类带来疾病和死亡。传统上人们敬畏他，尤其在阿尔泰人当中，疾病降临时会献上牲畜祭祀；据说不献祭的人，死后会被他抓去当奴隶。\n\n敬奉他的萨满被称为黑萨满，他们的做法通常不受欢迎，因为他们要与恶灵交涉。"
 worship_fertility_god_desc: "$worship_desc1$[ShowGodName('fertility_god')]$worship_desc2$\n\n生育神既庇佑庄稼，也庇佑人的生产，对他们的崇拜往往与大地相连。阿坎人向女神阿萨西·阿富阿祈求丰产、爱情和农事顺利，向阿萨西·亚祈求子嗣与平安，并献上祭品换取恩惠。\n\n伊博人的大地女神阿拉掌管生育与创造，阿兹特克人的雨神特拉洛克也因土地的丰饶而受崇拜。"
 worship_fire_god_desc: "$worship_desc1$[ShowGodName('fire_god')]$worship_desc2$\n\n在阿伊努人家中，炉火就是神。他们在患病时向火神神威媪祈祷，她是阿伊努人最重要的女神；人们视她的炉灶为人界与神界之间的门户，并相信死者的灵魂要穿过她的炉灶才能到达来世。\n\n约鲁巴人则以桑戈为火与雷的奥里沙，他是被奉为神的奥约第三位国王。"
 worship_freya_god_desc: "$worship_desc1$[ShowGodName('freya_god')]$worship_desc2$\n\n弗蕾亚意为“女主人”，是华纳神族掌管爱情、丰产、黄金与魔法的女神，还把战死者的一半接到自己在福尔克范格的殿堂。斯诺里称她是诸神中最容易向她祈祷的一位，尤其在爱情方面。\n\n在《欣德拉之歌》中，她的信徒奥塔尔为她垒起石坛，经常向她献祭，她也帮他查明了自己的祖先。称呼贵妇的尊称“弗吕尔”便来源于她的名字。"
 worship_freyr_god_desc: "$worship_desc1$[ShowGodName('freyr_god')]$worship_desc2$\n\n弗雷意为“主人”，是华纳神族掌管王权、和平、丰产与丰收的神，被视为瑞典王室的祖先。不来梅的亚当描述过他在乌普萨拉的阳具形神像，婚礼上要向他献祭，还记载他在斯卡拉的神像被主教埃吉诺毁掉。\n\n他拥有野猪古林布斯提和飞船斯基德布拉德尼尔。吟唱诗人埃吉尔·斯卡拉‑格里姆松曾祈求弗雷和尼奥尔德把血斧埃里克逐出挪威。"
 worship_haunu_god_desc: "$worship_desc1$[ShowGodName('haunu_god')]$worship_desc2$\n\n豪努是南部非洲桑人中克萨姆人神话里的闪电角色，是卡加拉的对手。克萨姆人的故事讲述了两者在东方的交战。"
 worship_huehueteotl_god_desc: "$worship_desc1$[ShowGodName('xiuhtecuhtli_god')]$worship_desc2$\n\n休赫特奥特尔意为“老神”，是中美洲最古老的神祇之一，作为火神，形象是背负巨大火盆、留着胡子、没有牙齿的老人。他的神像在奎奎尔科和蒙特阿尔万、特奥蒂瓦坎都有发现，远至危地马拉高地。\n\n在阿兹特克人的实践中，《佛罗伦萨手抄本》把他当作修特库特利的另一个名字；人们把祭牲的心脏放在炭火上焚烧，以重获他的恩宠。"
 worship_huitzilopochtli_god_desc: "$worship_desc1$[ShowGodName('huitzilopochtli_god')]$worship_desc2$\n\n维齐洛波奇特利是太阳与战争之神，也是墨西加人及其首都特诺奇蒂特兰的守护神。据《奥宾手抄本》记载，他命令族人离开阿兹特兰，并以“墨西加”之名引领他们迁徙。他原本只是一位次要的神，经特拉卡埃莱尔的宗教改革，地位提升到与魁札尔·科亚特尔、特拉洛克和特斯卡特利波卡并列。\n\n墨西加人相信太阳需要鲜血才能度过每个52年的周期，因此向他献上人的心脏。大神庙于1325年始建，1521年被西班牙人摧毁。"
 worship_hunhunahpu_god_desc: "$worship_desc1$[ShowGodName('hunhunahpu_god')]$worship_desc2$\n\n胡恩·胡纳赫普意为“一·胡纳赫普”，是玛雅神话中见于《波波尔·乌》的人物，英雄双子胡纳赫普和希巴兰克的父亲。有学者认为，古典时期的玛雅人把他视作重生为玉米神的形象。"
 worship_hunntuattatteen_god_desc: "$worship_desc1$[ShowGodName('hunntuattatteen_god')]$worship_desc2$\n\n洪图亚塔滕是桑人创造者卡根的妻子，形象为蹄兔，被称为蜜蜂之母。"
 worship_huracan_god_desc: "$worship_desc1$[ShowGodName('huracan_god')]$worship_desc2$\n\n胡拉坎意为“独腿”，又称“天之心”，是基切玛雅人的风、暴风和火之神，也是《波波尔·乌》中的创世神之一。他的名字让人联想到独腿的闪电神卡威尔，英语的“飓风”一词可能就源自这个名字。"
 worship_ikenga_god_desc: "$worship_desc1$[ShowGodName('ikenga_god')]$worship_desc2$\n\n伊肯伽意为“威严之力”，是带角的形象，伊博男子和声望高的女子将它作为个人的神龛。它把一个人的奇神（个人神）、祖先恩迪奇与右手阿卡伊肯伽联系在一起，右手代表力量与成就；通过祈祷和献祭使其发挥效力。\n\n邻近民族也有类似的神龛像：乌尔霍博人称伊夫里，埃多人称伊凯戈博。"
 worship_ilat_god_desc: "$worship_desc1$[ShowGodName('ilat_god')]$worship_desc2$\n\n伊拉特是卡伦津人的雷雨之神，地位仅次于太阳神阿西斯。南迪人把他分成两位：远处隆隆的雷声驱走危险的善神，和近处炸雷劈死人的恶神。"
 worship_illapa_god_desc: "$worship_desc1$[ShowGodName('illapa_god')]$worship_desc2$\n\n伊利亚帕是安第斯的闪电、雷鸣、降雨与战争之神，是印加万神殿中地位最高的神明之一。据萨米恩托·德·甘博亚记载，他赐给帕查库特克一尊双头蛇神像作为护身符，帕查库特克便奉他为神圣的兄弟。\n\n库斯科的托科卡奇建有伊利亚帕的神庙，后来的圣布拉斯教堂就建在那里；萨克萨瓦曼也祭祀他。随着帝国扩张，帕里亚卡卡、阿波卡特基尔等地方的雷神都成了伊利亚帕的地方形态。"
 worship_inti_god_desc: "$worship_desc1$[ShowGodName('inti_god')]$worship_desc2$\n\n太阳神因蒂是印加国家的守护神。萨帕·印加及其家族被认为是他的后裔，他的大祭司地位仅次于君主。\n\n传统上认为帕查库特克创立了因蒂·赖米节，即6月至日的印加新年。这个持续九天的节日在库斯科举行，有游行、舞蹈和动物祭祀。印加皇帝亲自参加的最后一次在1535年，此后被西班牙人禁止。"
 worship_ixchel_god_desc: "$worship_desc1$[ShowGodName('coatlicue_god')]$worship_desc2$\n\n伊希切尔是年迈的美洲豹女神，司掌助产与医药，这个名字见于16世纪的尤卡坦。主教雅各伯·德·兰达称她为“生育孩子的女神”和医药女神。\n\n在齐普月，医生和萨满庆祝她的节日“伊希奇尔节”，拿出占卜石和装着她小神像的药包。学者把她与阿兹特克女神托奇相对应。"
 worship_kagara_god_desc: "$worship_desc1$[ShowGodName('kagara_god')]$worship_desc2$\n\n卡加拉是南部非洲桑人中克萨姆人神话里的闪电角色。在克萨姆人的故事中，他在东方与对手豪努交战。"
 worship_kaggen_god_desc: "$worship_desc1$[ShowGodName('kaggen_god')]$worship_desc2$\n\n卡根又称“螳螂”，是桑人信仰中最著名的形象，相关材料主要出自克萨姆人。他最宠爱的大角斑羚，是出神舞中最常见的助灵动物，萨满借此进入灵界。"
 worship_kamuy_huci_god_desc: "$worship_desc1$[ShowGodName('kamuy_huci_god')]$worship_desc2$\n\n神威媪是阿伊努人的火塘女神，是最重要的神威之一，守护着人界与神威界之间的门户。作为伊雷苏神威，即“人类的教师”，她把火带给了人类。\n\n她还裁判家事，惩罚玷污火塘的人。火塘也是亡者的居所：阿伊努语里的“祖先”一词意为“居于火塘者”。"
 worship_kawiil_god_desc: "$worship_desc1$[ShowGodName('xiuhtecuhtli_god')]$worship_desc2$\n\n卡威尔是玛雅人的权力、创造与闪电之神，形象是长吻，一条腿的末端是一条蛇。雨神把他当作闪电斧来持握，统治者则把他当作权杖。\n\n在帕伦克，铭文神殿的灰泥浮雕上，统治者和贵族抱着婴儿形态的卡威尔，这位婴儿神也是该城的三位守护神之一。16世纪的尤卡坦，他被称为博隆·扎卡布。"
 worship_kayra_god_desc: "$worship_desc1$[ShowGodName('kayra_god')]$worship_desc2$\n\n凯尔拉汗是阿尔泰各族的创世神，在创世神话里化为一只飞越原初之水的白鹅。传说他创造了于尔根等次一级的神，居于宇宙的第十七层，统御一切。"
 worship_khuanu_god_desc: "$worship_desc1$[ShowGodName('khuanu_god')]$worship_desc2$\n\n库阿努意为“自然之母”，在米佐人的信仰中是至高神帕提安的妻子，是仁慈的女神，以母亲般的身份赐福人类，被视为帕提安慈爱一面的化身。利昂凯亚牧师把她（称库阿旺或库阿努）解释为萨库阿一词中“库阿”所指的村庄看守者。"
 worship_kim_un_kamuy_god_desc: "$worship_desc1$[ShowGodName('kim_un_kamuy_god')]$worship_desc2$\n\n山熊神威意为“山之神”，又称梅托图什神威和努帕里科神威，是阿伊努人的熊神和山神。熊通常被视为仁慈的。\n\n凡是有条件的村落，都会捕来一只幼熊养上一年，然后在熊祭上用箭将它射杀。人们吃它的肉，让它的灵魂得以返回天界，向山熊神威讲述人类的虔诚。"
 worship_kine_nane_god_desc: "$worship_desc1$[ShowGodName('kine_nane_god')]$worship_desc2$\n\n基内纳内是阿鲁纳恰尔邦塔尼诸族的女神，与冬尼、波罗和多英波特并列为自然诸神中的主神，相传他们注视着大地和人类。"
 worship_kotan_kar_kamuy_god_desc: "$worship_desc1$[ShowGodName('kotan_kar_kamuy_god')]$worship_desc2$\n\n村作神威意为“造村之神”，是阿伊努人的创世神。传教士约翰·巴彻勒认为所有神威都对他负责，由此推断阿伊努信仰原本是一神教；诺伯特·亚当尼不同意，因为他很少受到祭拜。\n\n有一则神话讲他想为人类造出火。杨木钻失败了，变成恶灵；榆木成功了，白色的木屑变成女猎神哈西瑙乌克神威，黑色的木屑变成熊形的山神。"
 worship_kukulkan_god_desc: "$worship_desc1$[ShowGodName('quetzalcoatl_god')]$worship_desc2$\n\n库库尔坎意为“羽蛇”，是玛雅人的蛇神，他的崇拜以奇琴伊察为中心，是中美洲第一个超越旧有族群和语言界限的宗教，一直传到危地马拉高地和伯利兹北部。\n\n奇琴伊察衰落后，玛雅潘成为复兴的库库尔坎崇拜的中心。西班牙人到来时，库库尔坎的大祭司是休族的族长。"
 worship_legba_god_desc: "$worship_desc1$[ShowGodName('legba_god')]$worship_desc2$\n\n雷格巴在丰语中作Lɛgbà，在埃维语和米纳语中作埃莱格巴，是巫毒教中十字路口的灵，沟通人与灵界。埃莱格巴可能借自约鲁巴人，他们称这一形象为埃舒—埃莱格巴。\n\n开始一项新事业时，人们首先向他求问；每场仪式开始时也要先召请他。相传他通晓人类的一切语言。"
 worship_lisa_god_desc: "$worship_desc1$[ShowGodName('lisa_god')]$worship_desc2$\n\n莉萨是双重创世神玛武与莉萨中的男性一半，受达荷美丰人和其他说格贝语的民族崇拜。他的名字源于奥里沙恩拉，即约鲁巴创造神奥巴塔拉的别名，其神性与玛武的神性合并。\n\n达荷美神话中，玛武造出人类，莉萨受命教人建设文明。这一对神是奥巴·科索的父母，奥巴·科索在丰人中称为赫比奥索。"
 worship_mainao_god_desc: "$worship_desc1$[ShowGodName('mainao_god')]$worship_desc2$\n\n买瑙是至高神巴图布赖的女儿，稻田的守护者，有时被等同于印度教的吉祥天女。祭拜巴图时必有买瑙：她的祭坛在巴图左侧，拜神者在她面前把灯转七圈。\n\n凯莱节有四种，其中每年迦底迦月第一周举行的达尚凯莱节就是献给她的，与冬稻的收成相关。"
 worship_mama_cocha_desc: "$worship_desc1$[ShowGodName('mama_cocha')]$worship_desc2$\n\n玛玛·科查意为“海母”，是印加的海洋与鱼类女神，也是水手和渔民的守护者。她是维拉科查的妻子、因蒂和玛玛·基利亚之母，与帕查玛玛、玛玛·尼纳、玛玛·瓦伊拉并称四位元素之母。\n\n人们向她祈求平息波涛、渔获丰盛；在一些地区，她被当作包括湖泊和河流在内的一切水域的女神。"
 worship_mamaquilla_desc: "$worship_desc1$[ShowGodName('mamaquilla')]$worship_desc2$\n\n玛玛·基利亚意为“月母”，是印加的月亮女神，因蒂的姐姐和妻子，也是开国始祖曼科·卡帕克和玛玛·奥克略之母。她掌管婚姻和月经周期，被视为妇女的保护者。\n\n她在库斯科的神庙由女祭司侍奉，里面有一面覆满整堵墙的银盘。传说她流下的眼泪是白银，月食则被认为是有野兽在攻击她。"
 worship_marang_buru_god_desc: "$worship_desc1$[ShowGodName('marang_buru_god')]$worship_desc2$\n\n摩烂迦补卢意为“大山”，是印度东部桑塔尔人、布米吉人、霍人和蒙达人的至高神。他被视为万因之因，因此这些部落的宗教既是一神论的，也是泛神论的。对桑塔尔人来说，这位神就是一座山。\n\n在娑罗教给村落保护神的各种名称中，摩烂迦补卢与村神格拉姆·德奥蒂和辛邦加并列。"
 worship_mawu_god_desc: "$worship_desc1$[ShowGodName('mawu_god')]$worship_desc2$\n\n玛武意为“不可逾越者”，是说格贝语诸民族和西非巫毒教的创世女神。她与伴侣莉萨合为双重神明玛武与莉萨，是娜娜·布鲁库之子。\n\n神话中，玛武独自用黏土造出人类，并让原初巨蛇艾多·赫韦多盘在大地之下将其托起。她成为达荷美的国家神，不过这一对神明可能借自约鲁巴人。"
 worship_mergen_god_desc: "$worship_desc1$[ShowGodName('mergen_god')]$worship_desc2$\n\n墨尔根是突厥人的丰饶与智慧之神，凯尔拉之子，于尔根之弟，形象是头戴头盔、手持弓箭、骑着白马的青年。他的名字在突厥语里意为弓箭手。"
 worship_mesoamerican_quetzalcoatl_god_desc: "$worship_desc1$[ShowGodName('quetzalcoatl_god')]$worship_desc2$\n\n对羽蛇的崇拜，最早见于公元前1世纪或公元1世纪的特奥蒂瓦坎，到古典晚期已传遍中美洲。乔鲁拉的金字塔神庙从公元前3世纪起分阶段建造，直到公元9世纪，传统上认为是献给魁札尔·科亚特尔的。\n\n到后古典时期，乔鲁拉成为他的崇拜中心，而以埃埃卡特尔的面相，他是风神。"
 worship_mindiss_god_desc: "$worship_desc1$[ShowGodName('mindiss_god')]$worship_desc2$\n\n门迪丝是塞雷尔宗教中法蒂克一带的女性保护者。严格说来她不是神，而是潘古尔，即在生者与至高神鲁格之间代为说情的祖灵，只是带有女神般的属性。她属于水系潘古尔，同时也是血缘潘古尔。\n\n人们在锡内河边以她的名义献上祭品，据说她会以海牛的形象出现在人前。"
 worship_nat_awal_god_desc: "$worship_desc1$[ShowGodName('nat_awal_god')]$worship_desc2$\n\n贡德人在每个节庆之前，都要敬奉村母神安瓦尔和村落守护神阿吉宾，这种模式与其他达罗毗荼民族的民间信仰相似。"
 worship_nat_awual_god_desc: "$worship_desc1$[ShowGodName('nat_awual_god')]$worship_desc2$\n\n安瓦尔是贡德人的村母神，在节庆开始之前与村落守护神阿吉宾一同受到敬奉。和他一样，她得到的是贡德传统留给村神和氏族神的热切虔诚，而不是献给高神婆罗提乌的。"
 worship_ngai_god_desc: "$worship_desc1$[ShowGodName('ngai_god')]$worship_desc2$\n\n肯尼亚的基库尤人向恩加伊祈祷和献祭，称他为“姆文内·尼亚加”，意为“光明之主”，这个名字与基库尤人所称的基里尼亚加，即肯尼亚山相连。传统上礼拜时面向这座山，人们相信神从那里俯视他赐给人们的始祖夫妇基库尤和穆姆比的后代。"
 worship_nhialic_god_desc: "$worship_desc1$[ShowGodName('nhialic_god')]$worship_desc2$\n\n在尼罗河平原上的丁卡人中，祈祷先向掌管天空和降雨的至高神尼雅力克诉说，然后才依次呼唤氏族神灵和祖先之灵。人们祈求风调雨顺、庄稼丰收、族人平安、病牛康复和狩猎顺利，并献祭一头公牛或阉牛。"
 worship_niparaya_god_desc: "$worship_desc1$[ShowGodName('niparaya_god')]$worship_desc2$\n\n尼帕拉亚是下加利福尼亚半岛南端的佩里库人信仰中全能的主宰，天地的创造者。佩里库人神话的零星片段在18世纪30年代初被记录下来。他的妻子是阿马伊科永迪，两人生有三个儿子，其中一个名叫夸亚伊普，造出了人类，后来被人类杀死。"
 worship_njord_god_desc: "$worship_desc1$[ShowGodName('njord_god')]$worship_desc2$\n\n尼奥尔德是华纳神族的海洋、航行、渔业、风与财富之神，弗雷和弗蕾亚的父亲，居住在诺阿通。斯诺里写道，航海和捕鱼时应当向他祈求，他也能赐予求告者土地与财富。\n\n他的名字留存在冰岛的尼亚尔德维克和瑞典的内尔图纳等地名中。在挪威民间，直到18世纪还有人在渔获丰盛时向他致谢。"
 worship_nyambe_god_desc: "$worship_desc1$[ShowGodName('nyambe_god')]$worship_desc2$\n\n许多讲班图语的族群用尼扬贝或恩赞比等相近的名字称呼至高的天神，但仪式的重心更多落在祖先身上，人们认为祖先能与诸神交谈。"
 worship_obatala_god_desc: "$worship_desc1$[ShowGodName('obatala_god')]$worship_desc2$\n\n奥巴塔拉意为“白布之王”，又称奥里桑拉，是约鲁巴宗教中诸奥里沙的王。奥洛杜马雷称他为“人类的雕塑者”：他沿着一条锁链从天界降下，用黏土塑出最初的人类，并在母腹中塑造每个孩子。\n\n在某些说法里，埃舒诱他喝下棕榈酒，弟弟奥杜杜瓦胜过了他。伊费的传统还记得一位名叫奥巴塔拉的凡人，是这座城的创建者和国王。"
 worship_odin_god_desc: "$worship_desc1$[ShowGodName('odin_god')]$worship_desc2$\n\n奥丁是北欧的战争、死者与诗性智慧之神，在瓦尔哈拉接纳阵亡的战士。塔西佗记载，苏维汇人在固定的日子向一位他称为墨丘利的神献祭，其中包括人牲，通常认为这位神就是奥丁。不来梅的亚当写道，乌普萨拉在战争临近时向沃坦献祭。\n\n丹麦出土的一枚可能早至5世纪的金箔牌上刻着“他是奥丁之人”，古英格兰的王室也把自己的世系追溯到沃登。"
 worship_ogbunabali_god_desc: "$worship_desc1$[ShowGodName('ogbunabali_god')]$worship_desc2$\n\n奥古纳巴利意为“夜里杀人者”，是伊博人传统上的死神。据说他夜间杀死罪犯和犯下不可言说禁忌的人。"
 worship_olokun_isese_god_desc: "$worship_desc1$[ShowGodName('olokun_isese_god')]$worship_desc2$\n\n奥洛昆是掌管深海的奥里沙，统辖一切水域，被认为是财富之神阿杰的父母。他在尼日利亚西南部的约鲁巴和埃多城市受到崇拜：伊费的主祭司是奥巴·伊乔，巴达格里和拉各斯也有崇拜。\n\n早期的拉各斯，奥尼鲁酋长每年为奥洛昆举行节庆，以免海岸遭水淹。在伊费的传说中，奥洛昆是奥杜杜瓦的妻子，离开他后变成了大海。"
 worship_olorun_god_desc: "$worship_desc1$[ShowGodName('olorun_god')]$worship_desc2$\n\n欧洛伦又称奥洛杜马雷，是约鲁巴人的至高神，统治诸天，创造宇宙。这个名字由表示“拥有者”的oní和表示“诸天”、即灵的居所的ọ̀run缩合而成；奥洛杜马雷则被解释为“全足者”或“彩虹所出之壶的主人”。\n\n在伊费的创世传统中，欧洛伦让奥里沙奥巴塔拉用黏土塑出最初的人类，再给他们吹入生命。"
 worship_ori_god_desc: "$worship_desc1$[ShowGodName('ori_god')]$worship_desc2$\n\n奥里字面意思是“头”，是约鲁巴人对个人精神直觉和命运的概念，常被拟人化为一位独立的奥里沙。约鲁巴人认为，一个人最终成为什么样，都是奥里注定的。\n\n因此人们像敬奉奥里沙一样敬奉奥里：事情不顺时向它求问，并加以安抚，使事情转好。养成了均衡品性伊瓦‑佩莱的人，被认为与自己的神圣自我奥里相合。"
 worship_pachamama_desc: "$worship_desc1$[ShowGodName('pachamama')]$worship_desc2$\n\n帕查玛玛即大地之母，是安第斯的土地、丰收与生育女神。她的神龛是神圣的岩石或传说中的树干，祭司向她献上美洲驼、豚鼠和烧掉的微型衣物。\n\n神话称她是帕查卡马克的妻子，另一些说法里她是因蒂的母亲，又成为他的第二任妻子。因蒂·赖米节上的动物祭祀既是向她致谢，也是祈求丰收。西班牙人征服后，她被与圣母马利亚等同起来。"
 worship_paruhang_god_desc: "$worship_desc1$[ShowGodName('paruhang_god')]$worship_desc2$\n\n帕茹夯又称尼纳玛，意为“父亲”，是东喜马拉雅基拉特诸族之一的莱人的天神，也是花之主。他是大地女神松米玛的丈夫，被奉为莱人的创造者、养育者和守护者，有时被等同于印度教的湿婆。\n\n在萨克拉节的西里舞中，帕茹夯和纳尤玛等祖先的形象会被表演出来。"
 worship_pathian_god_desc: "$worship_desc1$[ShowGodName('pathian_god')]$worship_desc2$\n\n帕提安是米佐人的至高神，世界和其中万物的创造者，居于天上，被认为仁慈，会帮助向他求助的人。他赐福运给正直者，降灾祸给恶人。\n\n普·瓦纳和女神库阿努被视为他的家人，但传统上米佐人只向帕提安祈祷，不祈求他的其他化身。"
 worship_phi_earth_god_desc: "$worship_desc1$[ShowGodName('phi_earth_god')]$worship_desc2$\n\n泰族的村镇把守护神灵供奉在身边，在寺庙和城镇立柱“拉勐”处祭祀它们。"
 worship_phi_fire_god_desc: "$worship_desc1$[ShowGodName('phi_fire_god')]$worship_desc2$\n\n泰族诸民族的古老宗教丕教崇奉众多的丕，其中有与天、地、火、水等元素相联的神灵。火是这些自然力量之一，和其他神灵一样需要用供品来安抚。"
 worship_phi_heaven_god_desc: "$worship_desc1$[ShowGodName('phi_heaven_god')]$worship_desc2$\n\n丕法又称丕天，是泰人的雨神和天神，是诸天的统治者和创世神，在昆博罗姆的传说中占有重要地位。“滕”意为“天”，来自汉语的“天”字。\n\n丕法仪式传统上为大病痊愈的人举行，由萨满邀请神前来。人们围着祭坛伴着竹笙起舞通宵，进入出神状态，祈求治愈与庇护。"
 worship_phi_water_god_desc: "$worship_desc1$[ShowGodName('phi_water_god')]$worship_desc2$\n\n在“巴西”仪式上，泰族人召回一个人走失的宽，即生命灵气，并在手腕上拴上棉线。"
 worship_polo_god_desc: "$worship_desc1$[ShowGodName('polo_god')]$worship_desc2$\n\n波罗是月亮，阿鲁纳恰尔的塔尼诸族称他为“阿布波罗”，即“月亮父亲”，总与太阳冬尼成对出现。两者合起来代表昼夜、冷热的平衡。\n\n在神圣的话语中，“冬尼波罗”也指真理；塔尼人自称“冬尼之子、波罗之子”，相信这一对神明会惩罚作恶者。"
 worship_pu_vana_god_desc: "$worship_desc1$[ShowGodName('pu_vana_god')]$worship_desc2$\n\n普·瓦纳意为“天上的神”，是米佐人信仰中的仁慈神灵，据说是帕提安一家的祖父，很可能就是帕提安的父亲。他被奉为自然之神，掌管雷电，因此与印度教的因陀罗相似。"
 worship_quetzalcoatl_god_desc: "$worship_desc1$[ShowGodName('quetzalcoatl_god')]$worship_desc2$\n\n魁札尔·科亚特尔，即羽蛇，是阿兹特克人的创世神之一，与风、金星、学识、工艺和商人相连，也是祭司阶层的守护神。大神庙的两位大祭司都带有“魁札尔·科亚特尔·特拉马卡兹基”的头衔。\n\n他的主要崇拜中心是乔鲁拉，当地的大金字塔传统上被认为是献给他的。西班牙征服之后，作者们把他与托兰的统治者塞·阿卡特尔·托皮尔钦混为一谈，史学家对这一合并仍有争论。"
 worship_ratovantany_god_desc: "$worship_desc1$[ShowGodName('ratovantany_god')]$worship_desc2$\n\n拉托万塔尼是马达加斯加的大地神，他与天神扎纳哈里共同造人，人死后收回人的身体。他似乎没有成为任何马达加斯加族群崇奉的显要神明。"
 worship_rep_un_kamuy_god_desc: "$worship_desc1$[ShowGodName('rep_un_kamuy_god')]$worship_desc2$\n\n海鲸神威是阿伊努人的海神，有时被画成虎鲸，有时是手持鱼叉、无忧无虑的年轻人。大海提供了陆地上没有的渔获、捕鲸和海上贸易的机会。\n\n一则神话讲他把中了鱼叉的鲸抛到村子附近的岸上。有鸟告诉他人们用斧头粗暴地分割，他一笑置之，说肉本来就归人类，后来才发现人们其实是按规矩用神圣的刀切割鲸肉。"
 worship_sakhua_god_desc: "$worship_desc1$[ShowGodName('sakhua_god')]$worship_desc2$\n\n萨库阿是米佐人氏族的守护神灵，代表氏族的身份。每个氏族都有自己的萨库阿和主持献祭的祭司“萨道特”。\n\n男子另立门户时要举行“萨昆”仪式：萨道特诵经，并在三天里宰杀一头猪，此后这名男子便脱离父亲的萨库阿，有了属于自己家庭的信仰。"
 worship_sakpata_god_desc: "$worship_desc1$[ShowGodName('sakpata_god')]$worship_desc2$\n\n萨克帕塔是巫毒教中掌管大地、健康与天花的神，受埃维人、丰人和阿贾人崇拜，分布从尼日利亚西南部到加纳沃尔特地区。他既能治愈也能降下疾病和疯癫，是约鲁巴天花神索波纳在达荷美的形态。\n\n口述历史称，这些民族的祖先在阿贾塔多一度几乎被天花灭绝，直到一位叫托布伊·阿尼的约鲁巴人治好了他们。"
 worship_sky_god_desc: "$worship_desc1$[ShowGodName('sky_god')]$worship_desc2$\n\n许多民族把至高神安置在天上，奉他为一切人的守护者。阿坎人称天神为尼亚梅，意为洞察一切者；马达加斯加人称扎纳哈里，丁卡人称尼雅力克，奥罗莫人称世界的创造者为瓦卡。\n\n天父常与地母成对出现：阿坎人把大地女神阿萨西·亚奉为尼亚梅的妻子。"
 worship_song_bwrai_god_desc: "$worship_desc1$[ShowGodName('song_bwrai_god')]$worship_desc2$\n\n宋布赖又称宋拉贾，是博多人四位主要家神之一，西德尼·恩德尔把他与巴图布赖、买瑙和布拉巴格王并列。他的神龛“达姆”设在屋内，主要由妇女祭拜，月经期间也要供奉。\n\n这些供品事后会被拿出屋外，放到代表巴图的西久树下。"
 worship_sumnima_god_desc: "$worship_desc1$[ShowGodName('sumnima_god')]$worship_desc2$\n\n松米玛又称亨卡玛，是基拉特诸族之一的莱人的至高女神，居于东喜马拉雅。她是大地之母和祖先之母，天神帕茹夯的妻子；这一对神是莱人的创造者和养育者，有时被等同于印度教的湿婆与帕尔瓦蒂。\n\n对她的崇拜体现在萨克拉节上：每年播种和收获时各举行一次，莱人用供品和舞蹈感谢大自然与祖先。"
 worship_supay_god_desc: "$worship_desc1$[ShowGodName('supay_god')]$worship_desc2$\n\n苏帕伊源自克丘亚语中的“影子”，是安第斯冥界里一个善恶不定的灵体，代表夜晚、黑暗和死亡。这个词本身是中性的：1560年多明戈·德·桑托·托马斯编的克丘亚语—西班牙语词典里，它既可指善灵，也可指恶灵。此后西班牙传教士把苏帕伊变成了基督教的魔鬼。"
 worship_takhar_god_desc: "$worship_desc1$[ShowGodName('takhar_god')]$worship_desc2$\n\n塔卡尔又作塔卡尔尔，是塞内加尔、冈比亚和毛里塔尼亚的塞雷尔人传统信仰中掌管正义与复仇的半神。人们在森林里某些圣树脚下敬拜他，塞雷尔人的祭司阶层负责召请他，并执行信徒必须遵守的律法。"
 worship_tano_god_desc: "$worship_desc1$[ShowGodName('tano_god')]$worship_desc2$\n\n塔诺本名塔科拉，是阿肯人的战神，也是塔诺河之神，被视为诸阿博松中的最高者。在阿散蒂人中他还是雷电之神。\n\n他的称号有“赢得战争者”和“岩中之王”，后者源于塔诺河发源的岩石。河边的神龛最大，供奉着王冠、权杖、华盖和一只铜盘。"
 worship_tengri_god_desc: "$worship_desc1$[ShowGodName('tengri_god')]$worship_desc2$\n\n腾格里，即永恒的蓝天，是突厥诸可汗的守护神。6至8世纪的突厥统治者把权力建立在腾格里的授命之上，使用“腾格里库特”一类头衔，其中的“库特”指他赐予的天命福分，可汗被视为他在人间的儿子。\n\n9世纪的占卜文献《占卜书》称他为“突厥人的腾格里”。8世纪回鹘可汗把摩尼教定为国教后，他在宫廷中的地位随之下降。"
 worship_tepeu_god_desc: "$worship_desc1$[ShowGodName('tepeu_god')]$worship_desc2$\n\n特佩乌在基切语中意为“君主”，是基切玛雅人的称号，与《波波尔·乌》里的创世神之一、“君主羽蛇”古库马茨联系在一起；特佩普尔等基切统治者也使用这一称号。"
 worship_tezcatlipoca_god_desc: "$worship_desc1$[ShowGodName('tezcatlipoca_god')]$worship_desc2$\n\n特斯卡特利波卡，意为“冒烟的镜子”，是阿兹特克人信奉的核心神祇，司掌夜空、黑曜石、冲突与占卜。贝尔纳迪诺·德·萨阿贡的《佛罗伦萨手抄本》记录了他的约360个称号，其中有“近处与邻近之主”。\n\n他的主要节日是每年5月的托什卡特节，节上要献祭一名扮演这位神整整一年的青年。1520年5月，西班牙人在托什卡特节上袭击了庆祝的人群，由此引发公开战争。"
 worship_thunder_god_desc: "$worship_desc1$[ShowGodName('thunder_god')]$worship_desc2$\n\n雷神往往也是正义之神。西非的约鲁巴人敬奉桑戈，他生前是奥约的第三位阿拉芬，一位好战的国王，以双头战斧为标志；据说他的统治因闪电烧毁王宫而告终。\n\n尼日利亚东南部的伊博人则求助阿马迪奥哈，意为“人民之人”，他劈击压迫者，为受压迫的人报仇；白公羊是他的象征，主神庙在奥祖祖。"
 worship_tlaloc_god_desc: "$worship_desc1$[ShowGodName('tlaloc_god')]$worship_desc2$\n\n特拉洛克是阿兹特克人的雨水与丰产之神，人们畏惧他降下的冰雹、雷和闪电，又尊他为生命的赐予者。他的重大仪式在特拉洛克山举行，那里被认为是他的居所；溺水、遭雷击或死于水媒疾病的人，据信会前往他的乐园特拉洛坎。\n\n在特诺奇蒂特兰，大神庙同时奉祀他和维齐洛波奇特利。"
 worship_tor_god_desc: "$worship_desc1$[ShowGodName('tor_god')]$worship_desc2$\n\n托尔是北欧的雷神，手持战锤。在不来梅的亚当描述的乌普萨拉神庙里，他坐在居中的宝座上，奥丁与弗雷分坐两侧；遇到饥荒或瘟疫时便向他献祭。\n\n从斯堪的纳维亚到英格兰和波罗的海沿岸，已发现约一千枚战锤吊坠；丹麦和瑞典的卢恩石碑上也有祈求托尔圣化这些卢恩的铭文。“托尔之林”是丹麦常见的地名。"
 worship_tyr_god_desc: "$worship_desc1$[ShowGodName('tyr_god')]$worship_desc2$\n\n提尔是古日耳曼人的战神，也是“庭”的神；“庭”是自由人制定法律、裁断争端的集会。罗马作者把他等同于玛尔斯，豪斯斯特兹要塞的弗里斯兰士兵在3世纪献上一座祭坛，献给“庭之玛尔斯”。\n\n星期二以他的名字命名；丹麦的蒂斯隆德（意为“提尔之林”）和挪威的蒂斯内斯等地名也指向对他的崇拜。北欧文献称他是巨人许米尔或奥丁之子。"
 worship_u_blei_nong_thaw_god_desc: "$worship_desc1$[ShowGodName('u_blei_nong_thaw_god')]$worship_desc2$\n\n乌勃黎·农陀是创世之神，是梅加拉亚山地的卡西人的至高神。卡西人的传统称他为乌勃黎·特赖·金拉德，即“主宰之主”，他把人类分成十六个天上的家族，其中七个留在了人间，称为欣尼乌特雷普。\n\n一架靠在圣峰隆索佩特贝宁上的梯子本来可以让人上天，直到人们受骗砍倒了隆迪恩吉耶峰上的神树，通往天界的路从此断绝。"
 worship_ulei_longspah_god_desc: "$worship_desc1$[ShowGodName('ulei_longspah_god')]$worship_desc2$\n\n卡西人的传说称，主宰最初把人类分成十六个天上的家族，其中七家被留在人间。"
 worship_ulei_muluk_god_desc: "$worship_desc1$[ShowGodName('ulei_muluk_god')]$worship_desc2$\n\n卡西人的传说讲，圣峰上曾有一架天梯让人往来天界，直到人们受骗砍倒了一棵神树。"
 worship_ulei_umtang_god_desc: "$worship_desc1$[ShowGodName('ulei_umtang_god')]$worship_desc2$\n\n卡西人没有自己的文字，宗教靠口耳相传。"
 worship_ulgen_god_desc: "$worship_desc1$[ShowGodName('ulgen_god')]$worship_desc2$\n\n于尔根是阿尔泰、哈卡斯和绍尔各族的善良天神，保护人类抵御尔力克。关于他的记载主要来自民族志，传统上人们用牲畜祭祀他，尤其是马。\n\n萨满每隔几年会献上一匹白马，骑着它的灵魂穿过一层层天界，前往于尔根的金色宫殿。阿尔泰的一些氏族，如索永和伊尔基特，并不把他尊为至高神。"
 worship_umay_god_desc: "$worship_desc1$[ShowGodName('umay_god')]$worship_desc2$\n\n乌迈是突厥人的母亲与儿童女神。8世纪为阙特勤立的碑文称颂他的母亲如同乌迈，可汗的妻子哈屯也被视为乌迈，因为她们生下的儿子保证了王朝的延续。\n\n11世纪，马赫穆德·喀什噶里记载，向她礼拜的妇女会生下男孩。传统上，突厥妇女会把系着小摇篮的绳子挂起来，向她求子。"
 worship_urpihuachac_desc: "$worship_desc1$[ShowGodName('urpihuachac_god')]$worship_desc2$\n\n乌尔帕伊·瓦查克是秘鲁海岸航海民族钦查人的女神，名字据说意为“生出鸽子的女神”。钦查人相传诸神来自一座叫乌尔皮瓦查伊的圣岛。"
 worship_viracocha_desc: "$worship_desc1$[ShowGodName('viracocha')]$worship_desc2$\n\n维拉科查是印加以前及印加治下安第斯地区的创世神，印加人把对他的崇拜置于太阳崇拜之上。据说他创造了宇宙、日月星辰、时间和文明，并下令修建了提亚瓦纳科。\n\n他被想象为一个蓄须的男子，是海洋女神玛玛·科查的丈夫、因蒂的父亲。平民不得说出他的名字。"
 worship_waaq_god_desc: "$worship_desc1$[ShowGodName('waaq_god')]$worship_desc2$\n\n奥罗莫人和相邻的库希特语民族崇拜作为唯一神的瓦格，神通过阿亚纳这种中介之灵行事，阿亚纳附在被选中的男女身上，使他们成为卡卢祭司和卡里提女祭司。这些祭司按规矩不干预政治，却能向盖达制度的领袖赐福或收回祝福。\n\n朝圣者不远千里前来，请最高的卡卢阿巴穆达为自己涂油。"
 worship_war_god_desc: "$worship_desc1$[ShowGodName('war_god')]$worship_desc2$\n\n世界各地的战士都把战事托付给一位神。西非的约鲁巴人敬奉奥贡，他是铁、金属加工和战争的奥里沙，对他的崇拜后来传到了埃多人和伊策基里人当中。\n\n毛利人的战神是图玛陶恩加，每一支战队都要献给他。在夏威夷，战神库以库卡伊利莫库之名受人崇拜，意为“夺地者”，祭仪中包括人祭。"
 worship_water_god_desc: "$worship_desc1$[ShowGodName('water_god')]$worship_desc2$\n\n水在许多民族那里都有自己的神。约鲁巴人敬奉奥洛昆，他统治一切水域，赐予财富、健康和繁荣，他的名字后来传入邻近的埃多人的宗教。\n\n在墨西哥，雨神特拉洛克被奉为生命和养分的赐予者，人们在山顶设神庙，并在特拉洛克山上举行盛大的仪式，不过人们也畏惧他掌管的冰雹、雷和闪电。"
 worship_wind_god_desc: "$worship_desc1$[ShowGodName('wind_god')]$worship_desc2$\n\n风在许多信仰里都是神。阿兹特克人崇拜埃埃卡特尔，他是羽蛇神的一个侧面，人们把他的神庙建成圆柱形，以减少空气的阻力。\n\n毛利神话里，风、暴风和天气之神塔维里马泰阿因兄弟们分开了天父和地母而大怒，毁掉了森林之神塔内的森林，把海神坦加罗阿赶进大海。约鲁巴人的奥里沙奥雅则掌管风暴和烈风。"
 worship_xiuhtecuhtli_god_desc: "$worship_desc1$[ShowGodName('xiuhtecuhtli_god')]$worship_desc2$\n\n修特库特利意为“绿松石之主”或“火之主”，是阿兹特克人的火、热与年岁之神，他们把他与北极星联系在一起。他的神庙里总有一团圣火长燃不熄。\n\n每餐的第一口食物，阿兹特克人都要扔进炉灶，以感谢火的恩赐。在伊斯卡利节上，男孩们到沼泽里捕捉水中的小动物，献给看守火神的长者，换得玉米粉蒸肉。"
 worship_yuma_sammang_god_desc: "$worship_desc1$[ShowGodName('yuma_sammang_god')]$worship_desc2$\n\n玉玛桑芒意为“大地母亲”或“祖母”，又名宁瓦普马，是尼泊尔东部和锡金的基拉特人林布人的大女神，林布人把她看作母亲般的形象。在林布人看来，至高力量塔格拉·宁瓦普马在人间化为女性的玉玛桑芒和男性的特巴桑芒。\n\n传统上，林布人的房屋本身就象征着她，她的神位是屋子中央的主柱，人们每年在这里祈祷、献供两次。"
 worship_zanahary_god_desc: "$worship_desc1$[ShowGodName('zanahary_god')]$worship_desc2$\n\n扎纳哈里是马达加斯加人的创世神和天神，也是中部高地梅里纳人的民族神，人们认为死者的灵魂回到他那里。"
 buddhist_desc: "$buddhist$源于佛陀（意为“觉者”，本名悉达多·乔达摩，尊称#italic 释迦牟尼#!）的教导。自$india$发源后广传四方。在传播过程中与各地文化交融，形成了不同$buddhist_ADJ$宗派，对如何通过修行从生死轮回中解脱提出了不同的法门和阐释。\n\n1337年后，佛教在亚洲各地的发展各有不同。在缅甸，国王达摩悉提于1476—1479年依照斯里兰卡大寺派传统改革僧团；上座部佛教也在阿瑜陀耶稳固下来。\n\n1578年，蒙古领袖俺答汗会见索南嘉措，授予他达赖喇嘛的称号。双方的结盟为格鲁派带来支持，此派在接下来的一个世纪传遍蒙古。在日本，禅宗在足利和德川统治时期保持影响力。"
 christian_desc: "基督教作为重要的亚伯拉罕系宗教，以耶稣基督的生平与教导为核心，强调因信得救及遵行圣经训导。其包含天主教、新教与东正教等主要分支，在全世界范围内都拥有重大影响力，并对全球历史、政治及文化产生深远影响。\n\n1517年马丁·路德发表《九十五条论纲》后，西欧基督教经历了重大变革。宗教改革从萨克森传播开来，胡尔德里希·茨温利和约翰·加尔文则在瑞士发展了各自的改革运动。\n\n在英格兰和苏格兰，托马斯·克兰麦和约翰·诺克斯分别领导了宗教改革。天主教会在特伦托会议上作出回应，宗教分裂也促成了欧洲各地的战争。15至17世纪，传教、移民和贸易将基督教带到欧洲以外。"
 dharmic_desc: "$dharmic_ADJ$宗教的各个教派起源于$india$，均以“正法”为核心概念，即以宇宙法则为依据的正确行为与生活方式。\n\n在正法宗教的各个社群中，虔信运动从15世纪起传遍印度北部和东部。在孟加拉，1486—1534年在世的柴坦尼亚开创了以虔信黑天为中心的传统。\n\n在旁遮普，1469—1539年在世的古鲁那纳克创立了锡克教。锡克教经典后来收入了那纳克及其他锡克教古鲁的赞歌，也收入了卡比尔和那姆德夫等虔信诗人的作品。这场运动也影响了耆那教徒的虔信活动。"
 druze_group_desc: "$druze_group$宗教组涵盖了信奉严格一神论、遵循伊斯玛仪派原则并蕴含诺斯替主义成分的所有宗教。\n\n1516年苏丹塞利姆一世征服叙利亚后，黎巴嫩山的德鲁兹派社群归于奥斯曼统治。马恩家族保有地方权力，但奥斯曼军队于1585年出兵袭击了德鲁兹人。\n\n德鲁兹埃米尔法赫鲁丁二世从舒夫山区向黎凡特其他地区扩张势力。1613年奥斯曼军队的进攻迫使他流亡，他于1618年返回，并在1623年的安杰尔之战中击败大马士革总督。他于1633年向奥斯曼人投降，1635年在君士坦丁堡被处决。"
 folk_african_group_desc: "$folk_african_group$是$africa$$common_folk_religion_group_desc$。\n\n在刚果，神圣的墓地将统治家族与祖先联系起来。葡萄牙人到来后，国王恩津加·恩库武于1491年受洗，取名若昂一世，但后来放弃了天主教。\n\n基督教在刚果也形成了地方性的表达。接受过灵媒训练的女先知金帕·维塔宣称耶稣和其他基督教人物来自刚果；国王佩德罗四世于1706年将她处以火刑。"
 folk_argentinian_group_desc: "$folk_argentinian_group$是$name_argentina$$common_folk_religion_group_desc$。\n\n在阿根廷西南部和智利中南部的马普切人中，马奇通过与神灵交流治病和占卜；集体仪式则包括献祭和供奉。16世纪起，西班牙人的记载在战争和天主教传教的背景下描述了这些信仰。\n\n更北方的瓜拉尼人地区，耶稣会士于17世纪初建立传教区，将原住民集中到聚居地接受基督教教导。1767年，西班牙王室将耶稣会士逐出传教区。"
 folk_aridoamerica_group_desc: "$folk_aridoamerica_group$是$aridoamerica_region$$common_folk_religion_group_desc$。\n\n在北美干旱地区北部的普韦布洛人中，宗教活动与降雨和作物息息相关。西班牙士兵于1540年抵达普韦布洛人的土地，方济各会传教士后来试图以基督教取代当地的祭祀。\n\n在新墨西哥，阿隆索·德·波萨达于1656—1665年任职期间禁止卡奇那舞蹈，并下令焚烧仪式用品。对普韦布洛宗教的迫害促成了1680年的起义，西班牙人被逐出该省，直到1692年才返回。"
 folk_asian_group_desc: "$folk_asian_group$是$asia$$common_folk_religion_group_desc$。\n\n在云南，纳西族东巴保存仪式经书，并为自然界的神灵举行仪式。纳西族寺庙将东巴神像与佛教影响结合起来，白地的居民则祭祀自然神署。\n\n在台湾，1624—1662年的荷兰统治带来了另一种遭遇：传教士传播基督教，并为原住民语言创制拉丁字母文字。西拉雅人使用的新港文书到了18世纪仍被用来书写土地契约。"
 folk_australian_group_desc: "$folk_australian_group$是$australia_region$$common_folk_religion_group_desc$。\n\n在澳大利亚原住民的传统中，祖先神灵与乌鲁鲁和卡塔丘塔等地点的形成及其意义相联系。瓦尔皮里人称这套传统为梦创神话，将人及其祖先与特定的地方和生灵联系起来。在新南威尔士，教会传教协会于1832年在惠灵顿谷建立传教站，试图使原住民改信基督教。"
 folk_brazilian_group_desc: "$folk_brazilian_group$是$brazil_region$$common_folk_religion_group_desc$。\n\n巴西南部及邻近地区的瓜拉尼人以口述方式传承神灵故事，各地的叙事有所不同。17世纪初，耶稣会士在巴西、巴拉圭与阿根廷交界一带的瓜拉尼人中建立传教区。\n\n传教区将原住民集中到聚居地接受基督教教导，也提供了一定的保护，使他们免遭奴役。巴西奴隶贩子的袭击促使瓜拉尼人组建武装民兵；1767年，西班牙王室将耶稣会士逐出其传教区。"
 folk_caribbean_group_desc: "$folk_caribbean_group$是$Caribbean$$common_folk_religion_group_desc$。\n\n在大安的列斯群岛，泰诺人崇敬泽米、祖灵和神圣人物，并用石头、木头等材料塑造神像。称为阿雷伊托的仪式表演结合舞蹈、音乐和讲述，保存故事，也纪念收获和酋长去世等事件。\n\n1492年，哥伦布在巴哈马遇到泰诺人社群。西班牙人的征服、强迫劳动和疾病使当地人口锐减，一些仪式用品似乎被藏进洞穴，以免落入来者之手。"
 folk_central_american_group_desc: "$folk_central_american_group$是$central_america_region$$common_folk_religion_group_desc$。\n\n在横跨哥斯达黎加东南部和巴拿马北部的塔拉曼卡，布里布里人社群在抵抗西班牙统治的过程中保存了自己的信仰仪俗。1709年，原住民领袖巴勃罗·普雷斯贝雷领导起义，反对强制迁徙和传教机构；起义者焚烧教堂，西班牙人于次年俘获了他。\n\n更南方的哥伦比亚高地，穆伊斯卡人在瓜塔维塔湖以及太阳神庙和月亮神庙祭祀。西班牙人于1537—1540年征服当地，但1563年穆伊斯卡人仍在乌瓦克举行过公开仪式。"
 folk_european_group_desc: "$folk_european_group$是$europe$$common_folk_religion_group_desc$。\n\n在立陶宛，大公约盖拉于1387年推动民众接受天主教洗礼；他的堂兄弟维陶塔斯于1413年在萨莫吉希亚推行洗礼。较早的立陶宛神话仍在故事、习俗和节庆中流传；16世纪末起，耶稣会传教士也在传教中利用民间信仰。\n\n更北方的萨米地区，当地圣地包括形状奇特的岩石等自然景物。被称为诺艾迪的萨米仪式专家在仪式中使用鼓，为社群与灵界沟通。"
 folk_melanesian_group_desc: "$folk_melanesian_group$是$melanesia_area$$common_folk_religion_group_desc$。\n\n美拉尼西亚原始宗教的口传传统保留了各不相同的陆地与海洋起源故事。在新不列颠岛的加泽勒半岛，传说兄弟托卡比纳纳和托卡尔武武从海底钓起陆地；拜宁人的故事则讲述一处藏起来的水坑如何扩展成海洋。\n\n在斐济，被称为贝特的宗教领袖在由酋长和长老治理的社群中占有重要地位。仪式性地制备和饮用卡瓦酒是斐济社群礼仪的一部分。19世纪初，欧洲传教士开始在斐济活动，其中尤以循道宗传教士为多。"
 folk_micronesian_group_desc: "$folk_micronesian_group$是$micronesia_area$$common_folk_religion_group_desc$。\n\n密克罗尼西亚原始宗教的传统因岛屿而异。在科斯雷岛的故事中，辛拉卡是面包果女神，纳利克是造舟的守护神；关岛的查莫罗人则信奉被称为陶陶莫纳的祖灵。\n\n关岛还有被称为马卡纳的仪式专家和被称为苏鲁哈努的医者。1668年，迭戈·路易斯·德·圣比托雷斯率领耶稣会传教士抵达关岛，传播基督教，天主教会逐渐成为村庄生活的中心。"
 folk_north_american_group_desc: "$folk_north_american_group$是$north_america$$common_folk_religion_group_desc$。\n\n北美洲原始宗教的传统包括阿尔冈昆人的马尼图观念，即灵或灵力，以及拉科塔人的瓦坎坦卡观念，即伟大的神圣力量。故事和口述历史使信仰与习俗代代相传。\n\n在西属新墨西哥，方济各会传教士试图用基督教取代普韦布洛人的信仰，禁止传统仪式。宗教迫害促成了1680年的普韦布洛起义，西班牙殖民者被逐出该省，直到1692年才返回。"
 folk_papuan_group_desc: "$folk_papuan_group$是$papua_area$$common_folk_religion_group_desc$。\n\n巴布亚原始宗教中的伊穆努被视为存在于事物之中的力量，仪式物品也具有这种力量。戴面具的仪式赋予它人或祖先的形象。"
 folk_permic_group_desc: "$folk_permic_group$是彼尔姆$common_folk_religion_group_desc$。\n\n彼尔姆原始宗教在科米人和乌德穆尔特人的土地上面临基督教传教活动。1376年，彼尔姆的斯捷潘开始沿维切格达河和维姆河传教；他毁坏神圣的桦树，并于1383年成为首任彼尔姆主教。\n\n1557年，伊凡四世向受洗的乌德穆尔特家庭授予特权。18世纪中叶，力度更大的传教运动派遣传教士修建教堂和学校，神林与传统祈祷场所也遭到破坏。"
 folk_peruvian_group_desc: "$folk_peruvian_group$是秘鲁$common_folk_religion_group_desc$。\n\n安第斯原始宗教的信众既祭拜地方和地区性的神灵，也祭拜印加帝国的神祇。印加人推广太阳崇拜，同时允许地方祭祀，并将部分被征服民族的神祇纳入自己的宗教秩序。\n\n西班牙征服后，塔基翁奎运动约于1564年在瓦曼加兴起，随后传遍安第斯地区。信众拒绝被强加的基督教神，呼吁恢复对瓦卡神灵的祭拜；西班牙官员镇压了这一运动，运动到1572年左右衰落。"
 folk_polynesian_group_desc: "$folk_polynesian_group$是$polynesia_area$$common_folk_religion_group_desc$。\n\n波利尼西亚原始宗教的口传传统在相距遥远的岛屿间流传着相近的故事。在一些岛群，唐加罗阿是海洋和渔业之神，而有关机智善变的毛伊的故事也广为人知。\n\n在夏威夷，卡普禁戒制度规范食物和男女关系。1819年，卡美哈梅哈二世与女子同食，打破了禁戒；反对变革者于同年12月在库阿莫奥战败。基督教传教士数月后抵达，加速了旧信仰的衰落。"
 folk_se_asian_group_desc: "$folk_se_asian_group$是$south_east_asia$$common_folk_religion_group_desc$。\n\n在菲律宾，东南亚原始宗教的传统包括向祖灵和自然神献祭。米沙鄢人称为巴巴伊兰的仪式专家在与灵沟通的仪式中充当媒介。\n\n米格尔·洛佩斯·德莱加斯皮的远征队于1565年抵达宿务，开始了西班牙对菲律宾的征服。此后，西班牙殖民者焚毁了一些原住民宗教文书和神像，传教士则致力于传播基督教。"
 folk_south_american_group_desc: "$folk_south_american_group$是$south_america$$common_folk_religion_group_desc$。\n\n在哥伦比亚高地的穆伊斯卡人中，南美洲原始宗教的传统包括在神圣湖泊和神庙举行祭祀。祭司在苏阿莫克斯祭拜太阳神苏埃，在奇亚的神庙祭拜月神奇亚；仪式中也使用古柯、烟草和通过贸易从东部民族处获得的约波。\n\n西班牙军队于1537—1540年征服了穆伊斯卡人。征服几十年后，穆伊斯卡人于1563年在乌瓦克举行了一场公开宗教仪式。"
 israelite_group_desc: "作为古希伯来人的后裔，犹太人自失去故土以来便散居于世界各地。他们以信仰和传统为纽带，在各国作为商人、学者和工匠活跃，同时坚守着共同的文化传承。尽管流散于天涯海角，他们却始终保持着团结，这个坚韧的民族始终将重返锡安的希望铭记于心。\n\n以色列宗教的社群在不同地区经历了动荡。西班牙于1492年驱逐犹太人，英格兰则于1655年重新准许犹太人定居。法国大革命期间，针对犹太人的法律限制于1791年被废除。\n\n撒玛利亚人保持着独立的传统，以纳布卢斯附近的基利心山为中心。1525—1526年的奥斯曼记录记载了纳布卢斯和加沙的撒玛利亚社群；到17世纪，迫害和改宗使他们的人数减少。1624年，撒玛利亚大祭司的传承谱系发生更替，信徒也被禁止登上山顶。"
 mandean_group_desc: "$mandean_group$宗教组是由多个信奉诺斯替一神论的民族宗教社群所共同组成的宗教团体。\n\n16世纪，美索不达米亚南部的曼达派社群引起了欧洲传教士的注意。1559年，葡萄牙耶稣会士在霍尔木兹海峡附近遇到曼达派信徒，称他们为圣约翰基督徒。这个名称反映出他们对施洗约翰的尊崇，但他们遵循自己的宗教传统。\n\n16至17世纪，巴士拉的加尔默罗会传教士也使用了同一名称。在边境另一侧的伊朗，曼达派信徒于18世纪80年代遭到卡扎尔政权迫害。"
 manichaean_group_desc: "$manichaean_group$是源自先知摩尼所创教义的宗教思想体系，强调光明与黑暗的永恒斗争及灵魂的救赎。\n\n摩尼教在中国经历数百年迫害后，于元朝时期复兴。福建草庵原是一座茅屋，1339年重建为石造寺庙。\n\n明朝洪武皇帝于1370年禁止摩尼教。信徒逐渐将其仪式与佛教、道教融合，后来的礼拜者将草庵视为佛寺。在中国摩尼教的教导中，摩尼被称为光明佛；信徒使用的一部道教经典则称他是老子的化身。"
 muslim_desc: "伊斯兰教是由先知穆罕默德于7世纪创立的一神论宗教，信奉独一真主安拉并遵行$common_string_quran$教导。其包含逊尼派与什叶派等不同教派，深刻影响了各大洲社会，促进了文化、科学及政治的发展。\n\n伊斯兰教沿东南亚的贸易航线传播，马六甲成为信仰传往其他港口的中心。约1380年，苏非教团将它带到棉兰老岛；穆斯林商人和传教士也接触到越南的占婆人。\n\n在西方，奥斯曼人于1453年攻占君士坦丁堡，使拜占庭首都落入穆斯林统治之下。16世纪，萨法维王朝的改宗政策推动什叶派在伊朗和阿塞拜疆大部分地区扎根；奥斯曼人的统治则扩展到匈牙利。"
 tonal_group_desc: "$tonal_group$是$mesoamerica_region$$common_folk_religion_group_desc$。\n\n在尤卡坦，马尼是玛雅人敬奉库库尔坎的宗教中心，每年的祭典一直举行到1341年。西班牙人到来后，马尼的休家族统治者与他们结盟；一位休家族领主皈依天主教，促使其他西部玛雅领主接受西班牙统治。\n\n1562年，方济各会士雅各伯·德·兰达下令在马尼焚烧玛雅书籍和神像。更南方的佩滕地区，伊察人在1618年和1619年抵制了方济各会士的传教。"
 yazidi_group_desc: "$yazidi_group$宗教组涵盖了那些被称为“孔雀天使国度”的独特族裔宗教群体所持守的信仰体系。\n\n雅兹迪派的宗教生活以拉利什为中心，谢赫阿迪的陵墓吸引信徒在一年一度的集会节前来朝圣。14世纪起，宗教赞唱者从谢汉携带神圣的孔雀徽像，走访雅兹迪村落。\n\n1414年，邻近的库尔德部落联军袭击了拉利什。在奥斯曼统治下，雅兹迪领袖有时担任地方官职，但社群也遭到军事征讨。1613年奥斯曼军队进攻辛贾尔的雅兹迪人，1640年另一支军队经过激战攻占了这片山区。"
 zoroastrian_group_desc: "$zoroastrian_group$宗教组（即琐罗亚斯德教）是尊奉先知琐罗亚斯德的教诲、以其启示为核心所建立的信仰体系。\n\n祆教社群在伊朗的亚兹德和克尔曼一带延续下来，移居印度的伊朗人后裔则在古吉拉特被称为帕西人。1478—1766年间，印度的祭司与伊朗的同教者通信，商讨宗教和社会问题。\n\n由于祭司管辖权争议，桑詹的圣火于1742年迁到乌德瓦达。随着贸易发展，帕西家庭也跟随东印度公司从苏拉特迁往孟买。"
 alawi_school_desc: "$alawi_school$又称努赛里派，宣称[ShowReligionAdjective('shia')]信仰中的第一位伊玛目阿里·本·阿比·塔利卜是$muslim_god_name$本身的显现。他们在仪式和神学上与[ShowReligionAdjective('shia')]信仰的其他部分有显著不同，相信轮回并允许饮酒。\n\n阿拉维派社群追溯至9世纪的伊本·努赛尔，他是第十和第十一任伊玛目的追随者。哈西比在叙利亚北部的哈姆丹王朝统治时期组织了这一社群；塔巴拉尼于1032年前往拉塔基亚，在沿海地区传教。\n\n马穆鲁克统治时期，阿拉维派社群在叙利亚沿海山区扎根。1834—1835年，阿拉维派信徒反抗埃及对当地的统治，但起义遭到镇压。"
 alevism_school_desc: "$alevism_school$遵循哈吉·拜克塔什·瓦利的教义，是一种融合神秘学派，源自[ShowReligiousSchoolName('imamiya_school')]，但融入了[ShowReligionName('tengri')]信仰和古老的[ShowCultureGroupName('turkic_group')]信仰传统。它也吸收了苏菲派的一些方面，如精神领袖的存在和神秘主义实践。\n\n阿列维派在安纳托利亚的土库曼社群中形成；11至12世纪塞尔柱人扩张期间，苏菲派伊斯兰教与当地保留的古老习俗在这里相遇。15世纪末起，安纳托利亚和阿塞拜疆的许多奇兹尔巴什人追随萨法维领袖，佩戴与十二伊玛目相关的红色头饰。\n\n1501年，奇兹尔巴什军队帮助伊斯玛仪在大不里士建立萨法维统治。他们与萨法维家族的联系促使奥斯曼政权迫害奇兹尔巴什社群。"
 ashari_school_desc: "$ashari_school$以经典权威和理性主义为核心，由艾布·哈桑·艾什尔里于9世纪创立。他关于宇宙由原子构成的教义成为$ashari_school$主张的基础，即所有物质和时间均由$muslim_god_name$创造，同时相信自由意志与宿命。\n\n艾什尔里派神学经过安萨里等学者进一步发展；安萨里于1091年受任教于巴格达的尼扎米耶学院。经历精神危机后，他于1095年离开巴格达，著有《宗教科学复兴》等作品。\n\n14世纪学者伊本·赫勒敦也与艾什尔里派有关。他的《历史绪论》影响了17世纪的卡蒂普·切莱比等奥斯曼史家，使他们借此思考国家的兴衰。"
 athari_school_desc: "$athari_school$拒绝理性解释经典，主张严格阅读$common_string_quran$和圣训文本，视其为唯一权威。反对任何形式的宗教创新，拒绝任何不基于$common_string_quran$文本的理性。\n\n圣训派神学于8世纪末在圣训学者中形成，艾哈迈德·本·罕百里领导了兴起的传统主义运动。1263年生于哈兰的罕百里派学者伊本·泰米叶后来在大马士革成为思辨神学的著名批评者。\n\n1326年，伊本·泰米叶和弟子伊本·盖伊姆一同被囚禁在大马士革城堡。伊本·盖伊姆在老师于1328年去世后获释，此后教授马穆鲁克时代的学者，直至1350年去世。"
 balatkara_gana_school_desc: "作为[ShowReligiousSchoolName('mula_sangh_school')]的分支，[ShowReligionName('jain')]$balatkara_gana_school$僧团创立于8世纪，由$STR_ADJ$王朝建立者奠基，属于[ShowReligionNameWithNoTooltip('jain')]最古老的传承之一。\n\n勇护伽那至迟在13世纪已传入印度北部，乌恩、阿哈尔和霍尚加巴德的铭文留下了见证。其导师普拉巴旃陀罗被视为14世纪德里的首位跋吒罗迦。\n\n德里传承后来在其他地方产生分支：萨迦罗吉尔蒂于15世纪开创伊达尔传承，拉特那吉尔蒂师从吉那旃陀罗后开创了瑙高尔传承。"
 bektashi_school_desc: "以哈吉·拜克塔什·瓦利命名，据说其是阿里·本·阿比·塔利卜的后裔。苏菲主义的$bektashi_school$同时尊重先知穆罕默德的所有圣门弟子。尽管起源于[ShowReligionAdjective('sunni')]传统，但其教义与实践融合了多种其他传统的信仰实践，形成了独特的综合体系。\n\n拜克塔什教团传播到安纳托利亚和巴尔干地区，15世纪在奥斯曼耶尼切里军团中获得影响。16世纪巴勒姆苏丹将教团的仪式和教义系统化，受到信徒尊崇，被称为第二导师。\n\n1826年，马哈茂德二世强行解散耶尼切里军团后，因拜克塔什教团与军团关系密切而禁止该教团。教团的修院遭毁坏或没收，部分托钵僧被流放或处死。"
 chishti_school_desc: "$chishti_school$发源于[ShowLocationName('chishti_sarif')]，主张远离世俗权力，强调宽容与爱的核心价值。其灵修实践通过音乐与诗歌建立与$muslim_god_name$之爱的连接。\n\n穆因丁·契斯提将契斯提教团带到印度北部的阿杰梅尔，并于1236年在当地去世。他的陵墓成为朝圣地，而德里的尼扎姆丁·奥利亚的教导帮助教团传遍次大陆。\n\n从14世纪起，德里苏丹国和孟加拉苏丹国的统治者资助契斯提教团的圣陵。莫卧儿皇帝阿克巴在1568年攻克吉托尔后，前往穆因丁的陵墓朝拜。"
 din_i_ilahi_school_desc: "$din_i_ilahi_school$借鉴蒙古法典（扎撒），将所有宗教视为通向真理的不同教派。允许在领土范围内的自由思想。\n\n莫卧儿皇帝阿克巴于1582年推行神圣信条，此前他从1575年起邀请不同信仰的学者在法泰赫布尔西格里的礼拜堂辩论。神圣信条吸收了伊斯兰教、印度诸宗教及其他传统的成分，追随者仅限于宫廷中的一小群人。\n\n阿克巴的宗教政策遭到艾哈迈德·锡尔欣迪等穆斯林学者反对。1605年阿克巴去世后，继任者贾汉吉尔放弃了其父的许多宗教政策。"
 hanafi_school_desc: "$hanafi_school$以艾布·哈尼法·努尔曼·本·萨比特命名，起源于库法，在[ShowCultureName('farsi_culture')]和[ShowCultureGroupName('turkic_group')]世界（包括北$india$）占据重要地位。虽然$common_string_quran$和圣训的文本来源被优先考虑，但$hanafi_school$的追随者对来源持包容态度，并在教法学中运用类比（格亚斯）、司法裁量（伊斯提哈桑）和地方习俗（欧尔夫）。一些人认为它是各学派中最灵活的。\n\n艾布·哈尼法的弟子艾布·优素福和穆罕默德·沙巴尼传授了构成早期哈乃斐学派的教义。在阿拔斯王朝时期，艾布·优素福于786—809年在位的哈里发哈伦·拉希德治下担任首席法官。\n\n奥斯曼帝国将哈乃斐教法定为官方法学派。17世纪莫卧儿印度编纂的《阿拉姆吉尔教法汇编》在奥朗则布皇帝治下成为法律依据，18世纪仍在南亚使用。"
 hanbali_school_desc: "$hanbali_school$以艾哈迈德·本·罕百里命名，主张避免任何思辨神学（凯拉姆）。$hanbali_school$的追随者坚持认为$common_string_quran$和圣训是教法学的唯一正确来源，并应以字面意义和传统主义的方式解释。尽管它被认可为有效的教法学派，但很少有国家积极推广$hanbali_school$，甚至一度被阿拔斯王朝哈里发禁止。\n\n罕百里学派学者伊本·泰米叶于1263年生于哈兰，后来在大马士革授课，并批评与圣徒崇敬有关的习俗。他与学者及统治者的争论使他屡次遭到监禁，直至1328年去世。\n\n18世纪的阿拉伯，穆罕默德·伊本·阿卜杜勒·瓦哈卜借鉴了伊本·泰米叶的部分教导，并与沙特家族结盟。他的改革运动兴起后，罕百里学派经历了重大变化。"
 ibadi_school_desc: "该学派起源于哈瓦利吉派，其早期追随者虽支持阿里·本·阿比·塔利卜，但因其接受仲裁而与之决裂。在阿卜杜拉·本·伊巴德领导下，$ibadi_school$逐渐与哈瓦利吉派的激进立场划清界限，形成较为温和的教义体系。伊巴德派对$muslim_ADJ$各教派持包容态度，其法学理念与其他主流学派存在诸多共通之处。\n\n伊巴德派社群在巴士拉形成，贾比尔·本·宰德是当地有影响力的早期学者，教派后来传播到阿曼和北非。在阿曼，宗教学者依照传统推选兼掌宗教与世俗权力的伊玛目。\n\n1624年，纳赛尔·本·穆尔希德当选伊玛目，开始团结阿曼部族对抗葡萄牙人。他的雅鲁巴王朝继任者将葡萄牙人逐出马斯喀特，并将阿曼势力扩展到东非海岸。"
 imamiya_school_desc: "$imamiya_school$又称“十二伊玛目派”，认为穆罕默德的继任者阿里之后有十二位由神意选定的无过错的伊玛目。最后一位伊玛目马赫迪预计将作为人类的救世主回归，最终在世界上实现正义与和平。他们主要遵循[ShowReligiousSchoolName('jafari_school')]教法学。\n\n萨非王朝征服之前，伊玛目派社群集中在库姆、卡尚和萨卜泽瓦尔等伊朗城镇及地区。1501年，沙阿伊斯玛仪一世将十二伊玛目派定为新帝国的官方宗教。\n\n萨非王朝在伊朗各地推动改宗，迫害逊尼派穆斯林和其他宗教社群。这一政策促成十二伊玛目派在伊朗占据主导地位，也加剧了与逊尼派奥斯曼帝国的冲突。"
 isawiyya_school_desc: "$isawiyya_school$被视为最神秘的苏菲传统宗派之一，其根源可追溯至[ShowRegionName('maghreb_region')]地区。其灵修实践以诗篇与祈祷为核心，发展出独特的仪式体系。\n\n伊萨维教团由穆罕默德·哈迪·本·伊萨在梅克内斯创立，他生于1465年，卒于1526年。他的老师包括沙兹里和贾祖里传统的信徒；后者与摩洛哥神秘主义者穆罕默德·贾祖里有关，贾祖里著有广为流传的祈祷书。\n\n本·伊萨在梅克内斯的修道所内建造了自己的陵墓。一些信徒认为教团的出神仪式由一名17世纪的弟子发展而成，另一些人则认为它出现于18世纪。"
 ismaili_school_desc: "$ismaili_school$以伊斯玛仪·本·贾法尔命名，他是贾法尔·萨迪克的继任者，曾是法蒂玛王朝的主要信仰派别，但自其衰落以来已失去许多影响力。$ismaili_school$包含许多日益分歧的分支，并在许多方面比[ShowReligiousSchoolName('jafari_school')]或[ShowReligiousSchoolName('zaidi_school')]更注重[ShowReligionAdjective('shia')]信仰的隐秘元素。\n\n伊斯玛仪派社群在早期继承争议后遵循了不同的权威世系。到15世纪，尼扎里耶派伊玛目已在伊朗的安朱丹建立中心，社群在那里经历了复兴。\n\n后来，塔伊比派内部的继承争议于1592年催生了苏莱曼尼支派。也门的追随者支持苏莱曼·本·哈桑，而印度的大多数塔伊比派信徒承认达伍德·本·库特布，后来被称为达伍德派博赫拉人。"
 jafari_school_desc: "$jafari_school$以第六任伊玛目贾法尔·萨迪克命名，重视伊斯兰教法专家的独立推理，并优先于类比，还允许一种持续预定时间的临时婚姻。\n\n贾法里学派内部的阿赫巴尔派运动兴起于穆罕默德·阿明·阿斯塔拉巴迪的著作；他于1627年去世。阿赫巴尔派质疑法学家的独立推理，强调传述下来的伊玛目言行。\n\n18世纪后期，穆罕默德·巴基尔·贝赫贝哈尼在卡尔巴拉和纳杰夫领导了反驳。他所属的乌苏勒派主张独立法律推理和审查传述，在十二伊玛目派学者中取得优势。"
 kashtha_sangha_school_desc: "一个著名的[ShowReligionAdjective('jain')]天衣派僧团，活跃于北$india$与西印度，由洛哈查里亚（即苏达摩斯瓦米）创立。苏达摩斯瓦米是大雄——第二十四代（即最后一代）渡津者——的第五弟子。\n\n木钵僧团包括多个传承，其中马图拉僧团得到阿格拉瓦尔耆那教徒支持。提婆犀那的《见解精要》认为鸠摩罗犀那于维克拉姆历753年创立了木钵僧团，另一些传统则将创立归于洛哈查里亚。\n\n在瓜廖尔，1441—1474年的铭文记载了木钵僧团跋吒罗迦为耆那教摩崖造像举行开光仪式。该传承的在家弟子、诗人赖杜在托马拉王朝统治下主持了许多此类仪式。"
 khalwati_school_desc: "$khalwati_school$得名于独处隐修（哈尔瓦）的实践，强调个人个人仪式与灵修的重要性，包括了退隐与苦行。\n\n叶海亚·希尔瓦尼帮助哈尔瓦提教团从巴库向外传播，并撰写了一部为教团许多分支使用的祈祷文。奥斯曼苏丹巴耶济德二世于1481年即位，在他统治时期，教团吸引了官员和军人加入。\n\n切莱比·哈里发把教团中心从阿马西亚迁往伊斯坦布尔，在一座旧教堂内建立修院。17世纪，哈尔瓦提派诗人尼亚齐·米斯里公开反对政府，并向更广泛的民众传教。"
 kharatara_gaccha_school_desc: "这是白衣派的一个僧团组织，亦称#italic “正法之会”#!或#italic 正行之道#!。它视自身实践为唯一灵性正道，鼓励严格恪守纯洁性、宗教教义与经典，不容丝毫偏离。\n\n严律伽差追溯至创立者瓦尔达马纳·苏里。他的弟子吉内什瓦拉于1024年在阿纳希尔瓦达帕坦的辩论中击败对手，获得“严律”的称号，僧团也由此得名。\n\n16世纪，吉纳旃陀罗·苏里二世经耆那教官员卡拉姆·旃德·巴恰瓦特引荐，在拉合尔会见莫卧儿皇帝阿克巴。1595年，他前往木尔坦和乌奇，随后返回拉贾斯坦。"
 maliki_school_desc: "$maliki_school$以马立克·本·艾奈斯命名，在[ShowSubContinentName('north_africa')]和[ShowRegionName('iberia_region')]尤为盛行。该学派的教法学主要基于本·艾奈斯及其学生塞赫农的著作和解释，如《穆宛塔》和《穆达瓦纳》所述。$maliki_school$的重要学习中心之一是靠近[ShowLocationName('tunis')]的凯鲁万大清真寺。\n\n马立克学派教法在安达卢斯的倭马亚王朝治下得到国家支持，在穆拉比特王朝统治时期仍居主导地位。其后的穆瓦希德王朝偏重扎希里学派，基督教徒的再征服最终结束了穆斯林在伊比利亚的统治。\n\n14世纪，埃及法学家哈利勒·本·伊斯哈格在麦地那和开罗授课，并写下一部马立克教法简编。他的《简编》成为北非和西非法学家的权威参考书。"
 maturidi_school_desc: "$maturidi_school$神学学派以艾布·曼苏尔·马图里迪命名，是源自$hanafi_school$教法学派的一支[ShowReligionAdjective('sunni')]神学学派，提倡对经典的理性解释，并强调信仰优于个人行为。\n\n马图里迪学派的教义随河中地区的哈乃斐学者传播，这些学者从11世纪末至14世纪陆续西迁。随着突厥政权扩张，他们将教义带到波斯西部、伊拉克、安纳托利亚、叙利亚和埃及。\n\n马图里迪神学在帖木儿帝国和奥斯曼帝国占有重要地位。在该学派曾对逊尼派有影响的波斯，萨法维王朝从16世纪起将十二伊玛目派什叶教定为国教并推行改宗。"
 mevlevi_school_desc: "$mevlevi_school$以旋转舞闻名，其教义基于贾拉勒丁·穆罕默德·鲁米的教导。其核心教义强调爱为[ShowReligionGroupName('muslim')]的本质，并通过旋转仪式（萨玛）实现与安拉的合一。\n\n鲁米于1273年去世后，他的儿子苏丹·瓦拉德和胡萨姆丁·切莱比建立了毛拉维教团，并在科尼亚为他修建陵墓。1312年去世的苏丹·瓦拉德使这座陵墓成为教团的中心。\n\n奥斯曼统治者的资助帮助毛拉维教团从安纳托利亚传播到巴尔干和阿拉伯地区。1590年，苏丹穆拉德三世下令将一部14世纪的鲁米传记译成土耳其语，使奥斯曼读者得以阅读他的生平。"
 mimamsa_school_desc: "$mimamsa_school$专注于文本解释与批判性分析的方法论。因此，它更注重文献学、语言哲学与语言分析。\n\n弥曼差派依据阇弥尼的《弥曼差经》解释吠陀仪式的义务；这部经书约成于公元前3世纪或前2世纪。鸠摩罗罗·跋陀和普拉巴迦罗在约7世纪发展出有影响力的分支。\n\n16世纪，阿帕耶·迪克希塔认为弥曼差与吠檀多的经书不能构成一部统一的著作。17世纪，阿帕提婆写了一部弥曼差入门论著。"
 mula_sangh_school_desc: "意为“根源”，指源自昆达昆达（公元2世纪[ShowReligionAdjectiveWithNoTooltip('jain')]僧侣，著有多部[ShowReligionAdjectiveWithNoTooltip('jain')]哲学文献）的原始[ShowReligionName('jain')]实践，亦是[ShowReligionNameWithNoTooltip('jain')]天衣派最重要的导师传承。\n\n根本僧团发展出多个传承，包括与舍拉瓦那贝尔戈拉有关的地方伽那，以及与洪巴杰和印度北部有关的勇护伽那。这些传承的教团首领称为跋吒罗迦，负责维护藏书并主持宗教安置仪式。\n\n一种说法认为，德里跋吒罗迦席位由根本僧团的普拉巴旃陀罗建立，他在14世纪穆罕默德·本·图格鲁克统治时期从古吉拉特来到德里。"
 mustali_school_desc: "$mustali_school$与[ShowReligiousSchoolName('nizari_school')]对立，接受穆斯塔利·比拉登上法蒂玛王朝王位。尽管起源于[ShowRegionName('egypt_region')]，但后来通过传教活动传播到西$india$。\n\n穆斯塔利耶派中的塔伊比派在阿米尔于1130年去世后，承认年幼的塔伊比为伊玛目。也门女王阿尔瓦设立了全权达伊一职，代表他领导社群。\n\n由于当地栽德派统治者的迫害，塔伊比派传教组织于1567年将总部从也门迁往印度。1592年，领袖继承争议使达伍德·本·库特布和苏莱曼·本·哈桑的追随者分裂。"
 mutazili_school_desc: "$mutazili_school$受希腊和印度哲学及理性主义影响，拒绝$common_string_quran$与$muslim_god_name$共存的观念，主张经典逻辑上应晚于造物主。它捍卫理性，只要其有助于理解宗教事务，并支持邪恶源于人类因自由意志所犯的错误。\n\n穆尔太齐赖派神学兴起于8世纪的巴士拉，瓦绥勒·本·阿塔因一场争论离开哈桑·巴士里的学术圈而为人所知。阿拔斯王朝哈里发马蒙于833年设立宗教裁判，强制推行《古兰经》受造的教义；穆塔瓦基勒于851年终止了这一裁判。\n\n穆尔太齐赖派的著作和教导在也门的宰德派学者中留存下来。1795年出任也门首席法官的肖卡尼质疑宰德派的神学教义，主张回归经典依据。"
 naqshbandi_school_desc: "$naqshbandi_school$可追溯至贾法尔·本·穆罕默德·萨迪克，比其他学派更强调伊斯兰教法（$sharia$）的价值。其核心实践包括默念与意识。\n\n纳格什班迪耶教团得名于巴哈丁·纳格什班德，他于1318年出生在布哈拉附近。16世纪末，巴基·比拉将教团带到印度；他的门徒艾哈迈德·西尔欣迪在那里创立了穆贾迪迪支派。\n\n西尔欣迪致信莫卧儿贵族，主张更严格地遵守宗教规范。19世纪初，沙赫拉祖尔的哈立德在奥斯曼领土上创立了另一个颇有影响的支派，其追随者遍及伊拉克和叙利亚。"
 nizari_school_desc: "$nizari_school$声称尼扎尔·本·穆斯坦绥尔是其父亲去世后法蒂玛王朝的真正继任者，并反对阿夫达尔·沙汗沙拥立穆斯塔利·比拉的政变。他们从[ShowReligiousSchoolName('ismaili_school')]分裂而出，从许多其他分支中获得了追随者，并遵循[ShowReligiousSchoolName('jafari_school')]教法学，注重多元化和接受差异。\n\n尼扎里耶派在伊朗的势力以阿剌模忒堡为中心，哈桑·萨巴赫于1090年取得这座要塞。1256年，伊玛目鲁克恩丁·胡尔沙向蒙古人交出要塞；蒙古人拆毁城堡，摧毁了馆藏。\n\n尼扎里耶派军队于1275年短暂收复阿剌模忒堡，但只据守了几年。到15世纪，伊玛目已迁至伊朗中部的安朱丹，社群在穆斯坦绥尔·比拉二世等领袖治下经历复兴。"
 nyaya_school_desc: "$nyaya_school$是一个现实主义学派，专注于方法论与逻辑作为获取知识的手段。它指出，我们的痛苦源于错误知识导致的误解，而正确的知识将带来解脱。\n\n正理派以传为足目乔答摩所作的《正理经》为基础典籍。13世纪，密提罗的甘盖沙创立新正理传统，在《真实思惟摩尼》中检视本派的方法。\n\n孟加拉纳瓦德维普的拉古纳塔·希罗摩尼进一步发展了新正理传统。印度哲学家直到18世纪仍使用这一传统为分析知识与推理而发展的精密语言。"
 qadiri_school_desc: "$qadiri_school$由阿卜杜勒·卡迪尔·吉拉尼创立，强调严格遵守[ShowReligionAdjective('sunni')]教法。其组织架构采取分散式领导，允许各地中心根据本地传统灵活实践，这一特性促使其发展出多个分支。\n\n卡迪里教团在阿卜杜勒·卡迪尔·吉拉尼的巴格达学校周围发展起来；吉拉尼于1166年去世后，儿子阿卜杜勒·拉扎克继任学校领袖。到15世纪末，教团的分支已传播至摩洛哥、印度和今马里等地。\n\n1535年，奥斯曼苏丹苏莱曼下令在巴格达的吉拉尼墓上新建圣陵。18世纪，穆赫塔尔·昆提帮助教团传播到尼日尔河中游和更西方的地区。"
 safavid_school_desc: "$safavid_school$由萨菲丁·伊斯哈格·阿尔达比勒基于[ShowReligiousSchoolName('shafii_school')]教义创立，后逐渐转向[ShowReligiousSchoolName('imamiya_school')]思想。其核心教义强调灵性热忱与信仰坚定，引导信徒在宇宙秩序中定位自我。\n\n萨菲丁于1334年去世后，萨法维教团的领袖职位在其家族中传承。15世纪，在朱奈德和海达尔领导下，教团成为得到奇兹尔巴什信徒支持的军事运动，其领袖同时主张拥有宗教与政治权威。\n\n1501年，海达尔之子伊斯玛仪攻占大不里士并称沙阿，建立萨法维王朝。他宣布十二伊玛目派什叶派为国教，并请来叙利亚和黎巴嫩的学者协助确立这一信仰。"
 samkhya_school_desc: "$samkhya_school$是基于理性的二元论学派,对其他[ShowCultureGroupName('indian_group')]哲学学派影响深远。它认为世界由物质与精神构成，而知识只能通过感知和理性推理获得。\n\n数论派在4世纪的《数论颂》中形成了确定的体系。它列举了25种原理，认为辨别精神与自然便能获得解脱。来自比哈尔的哲学家毗若那比乞刍生活于15或16世纪，他为数论派著作作注，并主张数论、瑜伽与吠檀多三派存在统一性。"
 shadhili_school_desc: "$shadhili_school$遵循阿布·哈桑·沙兹里的教义，主张通过日常沉思与时刻铭记$muslim_god_name$实现灵性提升。其核心实践强调将[ShowReligionGroupName('muslim')]教义融入日常生活，以此实现存在转变。\n\n沙兹里教团在埃及和马格里布形成了持久的著述传统。教团第三任精神导师伊本·阿塔·安拉在开罗授课并将教义系统化；他的箴言集《智慧书》最为知名。他于1309年去世。\n\n15世纪，摩洛哥的穆罕默德·贾祖利编纂了祈祷书《善行指南》，并在萨菲聚集了追随者。18世纪末，穆罕默德·阿拉比·达尔卡维在摩洛哥创立了达尔卡维支派。"
 shafii_school_desc: "$shafii_school$以伊玛目沙斐仪命名，在[ShowRegionName('arabia_region')]、[ShowSubContinentName('east_africa')]和东[ShowContinentName('asia')]的[ShowReligionGroupAdjective('muslim')]信徒中尤为突出。与其他教法学派不同，$shafii_school$拒绝将司法裁量（伊斯提哈桑）和公共利益（伊斯提斯拉赫）作为$sharia$教法来源，仅依赖$common_string_quran$或圣训中的文本内容。\n\n沙斐仪学派在阿尤布王朝治下成为埃及的官方法学派，在马穆鲁克时期仍有影响。沙斐仪法学家纳瓦维从1267年起主持大马士革的阿什拉菲耶圣训学校，直到1277年去世。\n\n商人将沙斐仪教法传过印度洋，带到印度和东南亚。16世纪奥斯曼帝国扩张后，其统治地区的沙斐仪法官被哈乃斐法官取代。"
 suhrawardi_school_desc: "$suhrawardi_school$遵循艾布·纳吉布·苏哈拉瓦迪的教义，并深受[ShowLocationName('baghdad')]的朱奈德哲学影响。其核心教义强调追求真知与对$muslim_god_name$的忠诚，主张通过克制自然欲望满足灵性需求。\n\n苏哈拉瓦迪耶教团在1256—1335年的伊儿汗国统治下兴盛于伊朗西部，其苏菲修道所将影响传播到波斯文化圈。欧麦尔·苏哈拉瓦迪的弟子在德里、孟加拉和木尔坦建立了支派。\n\n巴哈丁·扎卡里亚于1222年定居木尔坦，并在1228年支持德里苏丹伊勒图特米什对抗当地统治者。他的后裔领导木尔坦支派，其他信徒则将教团传至古吉拉特和德里。"
 tapa_gaccha_school_desc: "由阿阇梨贾·格特旃陀罗·苏里（被称为“禅修者”）创立，此白衣派僧团鼓励对宗教人物的尊崇与圣殿朝圣。\n\n苦行伽差的名称来自梅瓦尔统治者贾伊特拉辛哈在阿加特普尔授予贾·格特旃陀罗·苏里的称号。僧团以1228年为创立之年。\n\n1556年，希拉维贾亚成为僧团古吉拉特教众的领袖。1582年，皇帝阿克巴邀请他讲解耆那教教义，后来颁令限制在耆那教节日期间宰杀动物。希拉维贾亚将弟子尚蒂旃陀罗留在了皇廷。"
 tristutik_gaccha_school_desc: "亦称圣典伽差（阿伽摩伽差），此白衣派僧团在仪式中专注于对渡津者的虔信与尊崇，视其为唯一值得崇拜者。\n\n三颂伽差据载创立于1194年，早于1228年成立的苦行伽差。虽然三颂伽差主要虔奉渡津者，但在大型仪式中也会向辅助神祇献供。"
 upkesa_gaccha_school_desc: "白衣派[ShowReligionName('jain')]最古老的僧团，遵循第二十三代渡津者波栗湿缚（胁尊者）的法脉，与大多数追随大雄法脉的派别不同。\n\n顶髻伽差的名称追溯至乌帕凯沙帕坦；传说僧人拉特纳普拉巴苏里曾在那里反对动物祭祀。1336年，僧团的卡卡苏里写成《纳比之子圣像修复记》，记述一座梨沙婆那他寺庙的修复。这部作品属于印度西部耆那教学者所创作的中世纪梵文传记文学。"
 vaisheshika_school_desc: "$vaisheshika_school$是一个自然主义、原子论的学派，主张所有物质宇宙由原子构成，而我们的所有经验都源于这些原子的聚合与相互作用。因此，对经验世界的完全理解将带来知识。\n\n胜论派的系统论述可追溯到迦那陀的《胜论经》；迦那陀生活的年代约在公元前6世纪至前2世纪之间。胜论派虽独立发展，后来在方法和结论上逐渐接近正理派。17世纪下半叶，安南巴塔写成《论理汇编》及其注释，向初学者介绍合流后的正理与胜论体系。"
 vedanta_school_desc: "$vedanta_school$是一个影响深远且多样化的学派，专注于研究吠陀，主张这些文集是知识的主要来源，并认为灵性事务超越人类的任何感知与推理。\n\n吠檀多派的各个传统对《奥义书》《梵经》和《薄伽梵歌》作出不同解释。1479—1531年在世的伐罗婆创立了纯粹不二论传统，1486—1534年在世的柴坦尼亚则启发了不可思议一异论传统。\n\n不二论者、黑天信徒摩菟苏陀那·萨拉斯瓦蒂撰写《不二论成就》，回应二元论者的批评；二元论学者随后又撰文反驳。"
 wahhabi_school_desc: "$wahhabi_school$脱胎于[ShowReligiousSchoolName('hanbali_school')]，是一场复兴运动，反对常见的苏菲主义实践、如敬礼圣人和朝觐拱北，鼓励回归[ShowReligionGroupName('muslim')]最初世代的虔诚和实践。\n\n瓦哈比派运动在内志由穆罕默德·本·阿卜杜勒·瓦哈卜发起；1744年，他与德拉伊耶统治者穆罕默德·本·沙特结盟。随着第一沙特国扩张，这一联盟也传播了他的教导。\n\n沙特军队于1803年进入汉志后占领麦加和麦地那，挑战了奥斯曼帝国对两座圣城的权威。1818年，为奥斯曼苏丹作战的埃及军队攻占德拉伊耶，第一沙特国覆亡；该运动的幸存追随者与沙特家族于1824年建立了第二沙特国。"
 yoga_school_desc: "$yoga_school$在许多方面与$samkhya_school$相似，同样将宇宙视为二元性，并将感知和理性视为获取知识的途径。然而，它补充道，系统的实践与实验也是获得知识与解脱的必要条件。\n\n瑜伽派以波颠阇利的《瑜伽经》为依据，这部著作在公元最初几个世纪于印度编成。经中列出修行的八支，包括禁制、体位、调息、冥想与三摩地。\n\n16世纪，毗若那比乞刍为《瑜伽经》作注，试图调和数论派与吠檀多派。同世纪的另一位注释家罗摩难陀·萨拉斯瓦蒂著有《瑜伽摩尼光》。"
 zahiri_school_desc: "$zahiri_school$主张严格遵守$common_string_quran$的文本，并专注于其外在或表面意义。他们认为，不能从文本中得出任何未在文本中明确表达的结论，否则$muslim_god_name$早已明确表达。\n\n扎希里学派早期以达乌德·扎希里命名，他在巴格达求学，吸引了反对受早期法学家观点约束的追随者。到10世纪末，从巴格达、大马士革到布哈拉的城市都有扎希里派法官任职。\n\n在安达卢斯，科尔多瓦的伊本·哈兹姆成为学派的主要阐释者，他生于994年，卒于1064年。此后穆瓦希德王朝给予扎希里学者国家支持，但学派在14世纪前后衰落。"
 zaidi_school_desc: "$zaidi_school$又称“五伊玛目派”，以穆罕默德之子阿里的孙子栽德·本·阿里命名，遵循其《教法总集》中的教义。$zaidi_school$追随者强调正义和人类责任，并源自支持栽德反抗伍麦叶王朝的人。$zaidi_school$完全拒绝许多[ShowReligionAdjective('shia')]信徒所实践的塔基亚原则，是与[ShowReligionName('sunni')]最相似的派别。\n\n约893年，哈迪·伊拉勒哈克·叶海亚在萨达建立伊玛目政权，栽德派统治由此在也门扎根。在伊朗北部，卡尔基亚王朝从1370年代统治东吉兰至1592年；里海地区的栽德派信徒在16世纪被迫改宗十二伊玛目派。\n\n在也门，曼苏尔·卡西姆于1597年宣布建立伊玛目政权，反抗奥斯曼统治。其继任者穆阿亚德·穆罕默德于1628年攻占萨那，到1636年奥斯曼人已撤出也门。"
 order_of_lebrel_blanco_desc: "白灵缇骑士团由“高贵者”查理三世创立，作为$NAV$王冠领的最高骑士荣誉，从王国最忠诚、最杰出的骑士中选拔成员。骑士团成员以兄弟情谊与忠诚之誓相互约束，被期望在所有行动中体现灵缇犬的迅捷与忠诚。该骑士团是王室威望与信任的象征，将王冠最亲密的盟友紧密联结于永恒的服务与荣耀之中。\n\n白灵缇骑士团创立于1391年，其徽记是一只金灵缇，悬挂在栗叶形链环组成的项链上；法语格言意为“秉持诚信”。1393年查理三世接纳了56名侍从和披甲战士，并派他们前去保卫瑟堡。"
 order_of_saint_george_desc: "这一组织被称为“圣乔治骑士社团”，体现对骑士精神与荣誉理想的坚守，通过骑士比武与节庆活动来弘扬这些价值观。\n\n圣乔治骑士团由匈牙利国王查理一世创立，至迟在1326年4月23日其主保圣人的节日时已经存在。成员身穿黑色连帽斗篷，上面绣有对团体恪守公正的誓言。骑士团在查理及其子拉约什一世统治下兴盛，但拉约什于1382年去世后的匈牙利王位争夺摧毁了这一团体。"
 order_of_the_band_desc: "绶带骑士团由最卓越的骑士组成，他们宣誓效忠并服从[GetCountry('CAS').GetName]的统治者。其成员须恪守严谨无瑕的宫廷行为准则，定期参与骑枪比武，且首要原则是支持并效忠于统治者。\n\n卡斯蒂利亚国王阿方索十一世于1332年加冕，同年创立绶带骑士团。骑士团以成员佩戴的红色绶带得名，入团者须在宫廷或军中服役至少十年。骑士团后来衰落，到1474年已被认为不复存在。"
 order_of_the_black_eagle_desc: "世俗性质的黑鹰骑士团与其说是精神性团体，不如说是一个军事骑士团。其成员往往包括王室成员、来访的外国王室，以及因功绩受嘉奖的杰出将领。\n\n勃兰登堡选帝侯腓特烈三世于1701年1月17日创立黑鹰骑士团，次日他在柯尼斯堡加冕，成为普鲁士国王腓特烈一世。他的儿子腓特烈·威廉是骑士团的首位成员。在腓特烈一世统治期间，直到1713年他去世为止，骑士团共授予57次。"
 order_of_the_dragon_desc: "龙骑士团又称“#italic 衔尾龙会#!”，致力于保卫[GetCountry('HUN').GetAdjective]君主、[ShowReligionAdjective('catholic')]教会以及整个[ShowReligionGroupName('christian')]世界，抵御[GetCountry('TUR').GetLongName]、异端与异教徒的威胁。该团以圣乔治骑士团为蓝本，受时代十字军精神的激励，以衔尾蛇与红十字为象征，联合[ShowEstateTypeName('nobles_estate')]阶层与[ShowEstateTypeName('crown_estate')]，共同抵御内外威胁，同时以王室保护与荣誉换取$nobles_estate$的忠诚。\n\n卢森堡的西吉斯蒙德与王后采列的芭芭拉于1408年12月12日创立龙骑士团。成员既有天主教贵族，也有信奉东正教的塞尔维亚统治者斯特凡·拉扎列维奇。\n\n西吉斯蒙德于1437年去世后，骑士团在西欧衰落，但在面临奥斯曼入侵的地区仍有影响。瓦拉几亚的弗拉德二世便从骑士团得到了“德拉库尔”的称号。"
 order_of_the_ermine_desc: "银貂骑士团的灵感源自[GetCountry('ENG').GetAdjective]的嘉德骑士团。该团以银貂为象征，代表毫不动摇的个人荣誉，不问社会地位，同时接纳男女成员，以表彰其对[ShowAreaName('brittany_area')]公国的卓越贡献。\n\n布列塔尼公爵约翰四世从英格兰流亡归来后，于1381年创立银貂骑士团。1448年，骑士团改称银貂与麦穗骑士团。\n\n女公爵安妮在伊夫去世后，任命其妻凯瑟琳·波捷为纹章官。安妮的女儿克洛德于1524年去世后，骑士团逐渐停止活动。"
 order_of_the_garter_desc: "建立于传说中的圆桌骑士的传统上的嘉德骑士团是国内最具威望的[chivalric_order|e]。其格言#italic “心怀邪念者蒙羞”#!表达了对其成员的荣誉要求。\n\n爱德华三世在宣称法国王位前后创立了嘉德骑士团，传统上认为创立年份是1348年。创始骑士包括他的儿子“黑太子”爱德华和兰开斯特伯爵格罗斯蒙特的亨利。\n\n骑士团在温莎的礼拜堂从1475年起在爱德华四世及其继任者治下大规模重建。乔治三世又于1780—1790年命人修复了礼拜堂。"
 order_of_the_golden_fleece_desc: "金羊毛骑士团由勃艮第的好人腓力创立，是基督教世界最著名的[chivalric_order|e]之一。骑士受到庄严誓言的约束，以维护其领主的荣誉，并团结起来对抗基督教世界的所有威胁。\n\n腓力于1430年在布鲁日设立金羊毛骑士团，庆祝他与葡萄牙的伊莎贝拉成婚。除团长外，骑士人数最初为24人，1433年增至30人，1516年增至50人。\n\n1714年西班牙王位继承战争结束后，西班牙波旁王朝和奥地利哈布斯堡王朝各自保留了骑士团的一个分支。骑士团的财宝和档案则转到了奥属尼德兰。"
 order_of_the_jar_desc: "借助[ShowRegionName('iberia_region')]民众的热忱，$order_of_the_jar$奖励了骑士对[ShowEstateTypeName('crown_estate')]的忠诚，同时也在宫廷仪式中扮演了重要角色。\n\n安特克拉的斐迪南于1403年在梅迪纳德尔坎波创立罐子骑士团，并将骑士团项链授予自己的儿子和受宠的骑士。徽记包括一只插着百合的罐子，象征圣母玛利亚的纯洁；项链上还悬挂着一只狮鹫。\n\n斐迪南于1412年成为阿拉贡国王后，骑士团成为王室骑士团。它延续至1516年。"
 order_of_the_swan_desc: "天鹅骑士团致力于弘扬虔敬之心并传播圣母玛利亚崇拜。该团成员包括许多统治王朝的王子以及[ShowEstateTypeName('nobles_estate')]阶层，皆以坚忍不拔之心团结一致。\n\n勃兰登堡选帝侯腓特烈二世于1440年9月29日创立天鹅骑士团。骑士团的总部设在哈弗尔河畔勃兰登堡附近的圣玛利亚朝圣教堂；1459年，藩侯阿尔布雷希特·阿喀琉斯在安斯巴赫的圣贡贝图斯教堂建立分部。骑士团在1464年约有330名成员，但在宗教改革期间消亡。"
 order_of_the_white_eagle_desc: "军事气息浓重的$order_of_the_white_eagle_policy$授予国家最忠诚的支持者以及最卓越的公民，作为对其为国效劳的奖赏。该团亦颁赠予为本国增光添彩的高规格来访贵宾。\n\n波兰国王奥古斯特二世于1705年11月1日创立白鹰骑士团。最初的徽章饰有波兰白鹰，1709年改为马耳他十字。1795年波兰第三次被瓜分后，骑士团被废除；1807年华沙公国恢复了它，1831年它又被纳入俄罗斯帝国的荣誉体系。"
 society_bengler_mainz_desc: "$noble_society_mainz_desc$\n\n1391年9月29日，德森贝格的康拉德·施皮格尔、帕德贝格的腓特烈和其他贵族创立棍棒协会。美因茨大主教康拉德二世将协会置于保护之下，并在当年11月与其结盟。协会成员与帕德博恩主教交战；1396年，帕德博恩和明斯特的主教联手将他们击溃。"
 society_elephant_tyrol_desc: "$noble_society_tyrol_desc$\n\n大象协会于1406年由21名蒂罗尔贵族组成，旨在对抗公爵腓特烈四世及其总督罗滕堡的亨利，维护贵族特权。协会由马奇的乌尔里希领导，成员胸前佩戴银象，诗人奥斯瓦尔德·冯·沃尔肯施泰因也是其中一员。\n\n联盟原定存在五年，却在1407年解散。多数成员加入了罗滕堡的亨利创立的猎鹰联盟。"
 society_furspang_franconia_desc: "$noble_society_franconia_desc$\n\n胸针协会于1396年由来自12个法兰克尼亚家族的26名贵族在维尔茨堡创立。它最初是敬奉圣母玛利亚的丧葬与祭坛兄弟会，支持班贝格、纽伦堡和维尔茨堡的教堂；协会名称所指的胸针被认为是圣母腰带上的搭扣。\n\n成员资格在符合条件的家族中世袭，1505年扩大了接纳范围。胸针协会启发了1481年成立的独角兽协会，但在宗教改革后日渐衰落，于1648年解散。"
 society_hubertus_cologne_desc: "$noble_society_cologne_desc$\n\n圣胡贝图斯骑士团由于利希‑贝格公爵格哈德于1444年或1445年创立，以纪念他在1444年的圣胡贝图斯日于利尼希击败埃赫蒙德的阿诺德。格哈德之子威廉于1475年更新了骑士团章程。1778年卡尔·特奥多尔继承巴伐利亚选侯国后，将骑士团带到了巴伐利亚。"
 society_lion_nassau_desc: "$noble_society_nassau_desc$\n\n1379年10月17日，17名伯爵、骑士与侍从在威斯巴登创立雄狮协会。成员公开支持阿维尼翁的教宗克雷芒七世，而对手拥护罗马的乌尔巴诺六世。协会于1380年与巴塞尔结盟，并与城市联盟交战；1382年埃欣根和约是官方记录中最后一次提及该协会。"
 society_with_the_donkey_desc: "$noble_society_baden_palatine_desc$\n\n驴子协会最早见于1387年的记载。其南北两支分别以海德堡和法兰克福为中心，各自由推选出的“国王”领导。数名成员为普法尔茨的国王鲁普雷希特效力，1408年协会有110名同伴。鲁普雷希特于1410年去世后，协会的政治影响力下降；南支于1478年重新成立。"
