# NEW 2026-11-21 v9.8 Worker 1: Religio Romana Renaming & Vanilla 1.4.9 Loc Bugfixes. Generated by gen_romp_pantheon.py. Overrides LDE in_game replace precedence for hellenism_religion_desc.
 hellenism_religion_desc:0 "罗马多神教（Religio Romana）承袭自卡皮托利乌姆三主神与奥林匹斯古典万神殿，以维系「众神和平（Pax Deorum）」、大祭司团礼制、神谕占兆与公民德行作为帝国存续之基石。\n\n从奥古斯都重建神庙、奥勒良尊奉无敌太阳、尤利安在君士坦丁堡复兴古典学园，到十五世纪格弥斯托士·卜列东在米斯特拉斯著《律法汇编》重燃圣火，这门古老的帝国信仰从未真正熄灭。借助「罗马诠释（Interpretatio Romana）」的包容气度，它将罗马古礼、希腊哲思与地中海诸邦神祇融为一炉，成为紫衣帝国的精神脊梁。"
