 flavor_nav.6.desc_no_succession: "尽管[target_character.GetName]的健康近年来每况愈下，[ROOT.GetCountry.GetGovernment.GetCourtTitle]仍对[target_character.GetSheHe]前一晚在[target_character.GetHerHis]寝殿中死于火灾的消息感到震惊。[ROOT.GetCountry.GetGovernment.GetCourtTitle]中流传着窃窃私语，称[target_character.GetNameWithNoTooltip]在接受[target_character.GetHerHis]疾病治疗时，一支蜡烛掉进了床榻并将其点燃。\n\n在宫廷哀悼之际，许多人想知道[ROOT.GetCountry.GetName]的史官将如何记载[target_character.GetNameWithNoTooltip]的统治。" # in_game/events/DHE/flavor_NAV.txt:444
 flavor_pol.55.desc.no_enemy: "直到近来，[ROOT.GetCountry.GetLongName]与[POL_partner_country.GetLongName]一直上演着两个宿敌争夺地区霸权的常见故事。如今，四面环伺着随时可能击败任意一方的强敌，两国比以往任何时候都更加亲密。为了巩固这一局面，[POL_partner_country.GetAdjective]的[POL_partner_country.GetGovernment.GetEstateName('nobles_estate')]提议在[POL_proposed_polish_candidate.GetName]与[POL_proposed_lithuanian_candidate.GetName]之间缔结王室联姻。" # in_game/events/DHE/flavor_pol.txt:3604
