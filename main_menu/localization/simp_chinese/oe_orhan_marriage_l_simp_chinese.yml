l_simp_chinese:
 oe_flavor_byz.1003.t: "奥斯马里斯：虔诚者约翰"
 oe_flavor_byz.1003.d: "（原名：奥尔汗）\n\n初到君士坦丁堡时，他仍是那个失去国土的贝伊。受洗那日，他脱下象征旧日身份的华服，在圣像前俯首，听祭司以圣父、圣子与圣灵之名祝祷。圣水落在额上，他领受了新的教名——约翰。此后，家族也以奥斯马里斯之名见于罗马的簿册。\n\n约翰渐渐成为巴列奥略皇室席间熟悉的宾客，也与坎塔库泽诺斯家保持着亲密的私人往来。旧日战场上的见闻，如今成了宴席上促膝长谈的话题；共同的礼拜与施济，则让这些交情越过了权宜盟约的界限。\n\n在宫廷之外，他出资修缮教堂，为施粥所添置粮食，资助道路与水渠的修葺。起初有人怀疑这些善举不过是讨好皇帝，但无论有没有贵人到场，约翰仍会出现在礼拜和施济之中。久而久之，街巷里开始有人称他为“虔诚者”。\n\n如今，他带着一幅精心装饰的圣像、一份将献给内廷的嫁妆清单，以及亲笔写下的效忠誓言，再次来到御前。他请求皇帝赐婚，迎娶[SCOPE.sCharacter('oe_orhan_bride').GetName]，使两家的结合成为奥斯马里斯融入罗马的见证。若旧婚尚在，他愿依皇帝与教会的裁决解除旧约，再立新盟。"
 oe_flavor_byz.1003.a: "让婚约弥合旧日的战火。"
 oe_flavor_byz.1003.a.tt: "[SCOPE.sCharacter('oe_orhan_groom').GetName]解除现有婚姻（如有），迎娶[SCOPE.sCharacter('oe_orhan_bride').GetName]。\n权威：#G +5#!。\n内帑获得#G 六个月收入#!，合计#G [SCOPE.GetValue('oe_orhan_dowry')|2]#!金币。\n奥斯马里斯家族成为豪族；首次获得这项敕许时，豪族上限#G +1#!。已有豪族地位不会重复登记，已有影响力保留。"
 oe_flavor_byz.1003.b: "信仰可以接纳，皇亲另当别论。"
 oe_flavor_byz.1003.b.tt: "威望：#G +5#!。约翰现有婚姻保持不变。"
 oe_flavor_byz.1003.lapsed: "情势已变，这桩婚事只能作罢。"
 oe_flavor_byz.1003.lapsed.tt: "约翰或原定新娘已不符合条件，不解除旧婚，也不发放联姻奖励。"
 oe_orhan_resolved: "虔诚者约翰的赐婚请求已处理"
 oe_osman_house_capacity_granted: "奥斯马里斯家族已获得额外豪族名额"
 oe_flavor_byz.1003.historical_info: "奥尔汗是奥斯曼王朝的第二位统治者，1324—1362年在位。他夺取布尔萨与尼西亚，巩固奥斯曼人在比提尼亚的统治，并通过介入拜占庭内战与联姻扩大影响。他曾迎娶约翰六世·坎塔库泽诺斯之女狄奥多拉。历史上的奥尔汗并未改宗东正教；受洗与教名属于本模组的架空情节。"
