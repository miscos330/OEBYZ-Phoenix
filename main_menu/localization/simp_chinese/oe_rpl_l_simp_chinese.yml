l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_rpl_yoke_tribute_peace: "萨莱岁贡苟安"
 STATIC_MODIFIER_DESC_oe_rpl_yoke_tribute_peace: "暂且按期纳贡以避草原铁骑南顾，换取休养生息与内政稳固。"
 STATIC_MODIFIER_NAME_oe_rpl_yoke_defiance_stance: "抗贡蓄锐"
 STATIC_MODIFIER_DESC_oe_rpl_yoke_defiance_stance: "暗结东斯拉夫诸公、滞纳草原岁贡，国内军民渐生自立之志。"
 STATIC_MODIFIER_NAME_oe_rpl_steppe_mobilization: "草原大乱备战"
 STATIC_MODIFIER_DESC_oe_rpl_steppe_mobilization: "趁金帐汗廷内讧之际整顿军备，严阵以待决战之日。"
 STATIC_MODIFIER_NAME_oe_rpl_steppe_trade_compact: "伏尔加河商路协约"
 STATIC_MODIFIER_DESC_oe_rpl_steppe_trade_compact: "借草原诸汗争位之隙维持河道通商，国库与商团同蒙其利。"
 STATIC_MODIFIER_NAME_oe_rpl_kulikovo_victory: "库利科沃大捷之威"
 STATIC_MODIFIER_DESC_oe_rpl_kulikovo_victory: "顿河平野一战击碎草原霸主不可战胜的神话，全罗斯为之振奋。"
 STATIC_MODIFIER_NAME_oe_rpl_kulikovo_fortress: "河岸坚壁清野"
 STATIC_MODIFIER_DESC_oe_rpl_kulikovo_fortress: "依托木石堡垒与渡口防线消耗草原骑兵，保全农庄与人口。"
 STATIC_MODIFIER_NAME_oe_rpl_stone_kremlins: "石垣火器防线"
 STATIC_MODIFIER_DESC_oe_rpl_stone_kremlins: "汲取脱脱迷失突袭教训，广筑石城并置备火铳，城防日固。"
 STATIC_MODIFIER_NAME_oe_rpl_unbroken_spirit: "宁折不屈之志"
 STATIC_MODIFIER_DESC_oe_rpl_unbroken_spirit: "虽遭草原烽火摧残仍拒绝屈膝，将士斗志愈发顽强。"
 STATIC_MODIFIER_NAME_oe_rpl_primogeniture_law: "父死子继集权法统"
 STATIC_MODIFIER_DESC_oe_rpl_primogeniture_law: "废除旧式兄终弟及的分裂隐患，大公权柄归于直系长子。"
 STATIC_MODIFIER_NAME_oe_rpl_boyar_compact: "王公波雅尔和议"
 STATIC_MODIFIER_DESC_oe_rpl_boyar_compact: "朝廷与世袭波雅尔达成权力妥协，换取内政安宁与阶层效忠。"
 STATIC_MODIFIER_NAME_oe_rpl_yoke_shattered: "鞑靼枷锁永绝"
 STATIC_MODIFIER_DESC_oe_rpl_yoke_shattered: "乌格拉河畔撕毁汗廷敕令，延续两百余年的草原宗主权就此终结。"
 STATIC_MODIFIER_NAME_oe_rpl_steppe_armistice: "草原体面停贡约"
 STATIC_MODIFIER_DESC_oe_rpl_steppe_armistice: "以边疆通商与对等盟约体面终结纳贡，转向和平整顿与扩张。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_kalita_purse: "钱袋大公财税纲纪"
 STATIC_MODIFIER_DESC_oe_rpl_p1_kalita_purse: "统筹诸邦岁入与商税，以雄厚财力为聚敛罗斯诸地奠基。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_gathering_lands: "聚敛罗斯诸地"
 STATIC_MODIFIER_DESC_oe_rpl_p1_gathering_lands: "借赎买采邑、联姻与统一税册，将周边小公国稳步并入中央直辖。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_service_gentry: "服役骑兵亲卫"
 STATIC_MODIFIER_DESC_oe_rpl_p1_service_gentry: "优抚依附大公的服役贵族，建立听命中央的精锐骑兵骨干。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_white_stone: "白石克里姆林威仪"
 STATIC_MODIFIER_DESC_oe_rpl_p1_white_stone: "高耸的白石城垣象征东北罗斯的凝聚中心，令敌骑望而却步。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_yam_network: "大公驿传军路"
 STATIC_MODIFIER_DESC_oe_rpl_p1_yam_network: "遍布森林与河谷的官办驿站加速诏令传递与军队调遣。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_sudebnik_precursor: "全罗斯统一律例先声"
 STATIC_MODIFIER_DESC_oe_rpl_p1_sudebnik_precursor: "收回地方司法与税吏任免权，为全罗斯统一法典与中央集权定型。"
 STATIC_MODIFIER_NAME_oe_rpl_p1_pomestye_system: "波米斯季耶服役封地"
 STATIC_MODIFIER_DESC_oe_rpl_p1_pomestye_system: "以国有服役封地供养常备骑兵，大幅降低军费压力并扩充兵源。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_veche_charter: "大诺夫哥罗德维彻宪章"
 STATIC_MODIFIER_DESC_oe_rpl_p2_veche_charter: "市民大会的钟声守护共和自治与北方商团的自由特权。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_guild_veche: "百人商团议会改制"
 STATIC_MODIFIER_DESC_oe_rpl_p2_guild_veche: "扩大商团行会在市民大会中的话语权，激发北方手工业与商贸活力。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_executive_veche: "大市长与千人长统筹制"
 STATIC_MODIFIER_DESC_oe_rpl_p2_executive_veche: "理顺市民大会常设执行机构，战时能迅速征调民兵与商船。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_baltic_league: "波罗的海平等通商联邦"
 STATIC_MODIFIER_DESC_oe_rpl_p2_baltic_league: "以圣彼得商馆为枢纽与汉萨城邦订立对等商约，白银与毛皮源源汇入。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_neva_fleet: "涅瓦—拉多加商战舰队"
 STATIC_MODIFIER_DESC_oe_rpl_p2_neva_fleet: "自建波罗的海船坞与护航舰队，打破外来商团对入海口的垄断。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_free_league: "北方自由城邦同盟"
 STATIC_MODIFIER_DESC_oe_rpl_p2_free_league: "联合北方商镇以重金雇兵与坚城抵御专制吞并，保住维彻自由。"
 STATIC_MODIFIER_NAME_oe_rpl_p2_pomor_frontier: "波莫尔白海与乌拉尔商团"
 STATIC_MODIFIER_DESC_oe_rpl_p2_pomor_frontier: "无畏的北方水手沿白海与大河深入林海，开辟通向乌拉尔与西伯利亚的毛皮航路。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_princely_league: "旧罗斯诸侯盟约"
 STATIC_MODIFIER_DESC_oe_rpl_p3_princely_league: "以平等盟誓取代强权吞并，借全罗斯大会重塑古罗斯诸邦威望。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_federal_compact: "诸公平等联邦宪章"
 STATIC_MODIFIER_DESC_oe_rpl_p3_federal_compact: "保障加盟公国的旧制与尊荣，使周边东斯拉夫邦国愿以盟约归附。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_old_rus_heritage: "基辅—特维尔古罗斯法统"
 STATIC_MODIFIER_DESC_oe_rpl_p3_old_rus_heritage: "重修编年史与法典传统，向整个东斯拉夫世界宣示雅罗斯拉夫先王的合法继承权。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_sophia_revival: "圣索菲亚与全罗斯公会复兴"
 STATIC_MODIFIER_DESC_oe_rpl_p3_sophia_revival: "借全罗斯宗教会议与君堡牧首共融，使本邦成为正教罗斯的精神灯塔。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_ruthenian_synod: "鲁塞尼亚本土主教团"
 STATIC_MODIFIER_DESC_oe_rpl_p3_ruthenian_synod: "本土主教团齐心拥戴古罗斯联邦，稳固第聂伯与伏尔加沿岸的正教秩序。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_grand_diet: "全罗斯诸公大议会"
 STATIC_MODIFIER_DESC_oe_rpl_p3_grand_diet: "常设联邦议会协调诸邦税赋、军务与外交，开创多元共治的东斯拉夫联邦。"
 STATIC_MODIFIER_NAME_oe_rpl_p3_frontier_riders: "第聂伯—伏尔加边防轻骑"
 STATIC_MODIFIER_DESC_oe_rpl_p3_frontier_riders: "在草原边疆招募自由骑手巡防渡口与荒原，奠定日后哥萨克边防军团的雏形。"
 STATIC_MODIFIER_NAME_oe_rpl_autocephalous_see: "全罗斯自主都主教座"
 STATIC_MODIFIER_DESC_oe_rpl_autocephalous_see: "本土主教团自主祝圣大都主教，罗斯教会由此迈向独立自主的新纪元。"
 STATIC_MODIFIER_NAME_oe_rpl_ecumenical_bond: "君堡普世牧首共融之约"
 STATIC_MODIFIER_DESC_oe_rpl_ecumenical_bond: "坚持与君士坦丁波利斯母教会的礼仪共融，赢得正教世界的外交尊重。"
 STATIC_MODIFIER_NAME_oe_rpl_kiev_shield: "立陶宛联统护翼下的基辅自治"
 STATIC_MODIFIER_DESC_oe_rpl_kiev_shield: "暂借维尔纽斯军力抵御草原侵袭，同时严守基辅旧法与圣索菲亚特权。"
 STATIC_MODIFIER_NAME_oe_rpl_kiev_independent: "留里克基辅重光"
 STATIC_MODIFIER_DESC_oe_rpl_kiev_independent: "挣脱外来联统、重举古罗斯母城旗帜，激起第聂伯两岸豪杰归心。"
 oe_rpl.1.t: "罗斯三岔路：择定立国之道"
 oe_rpl.1.d: "草原霸主的马蹄犹在南疆回响，而森林与大河之间的东斯拉夫诸邦，正站在决定未来数百年命运的十字路口。莫斯科一脉崇尚大公集权、聚敛财赋与统一律法；诺夫哥罗德与普斯科夫秉持市民大会（维彻）与波罗的海商团自由；特维尔、基辅与斯摩棱斯克则怀念古罗斯雅罗斯拉夫时代的诸侯盟约与正教公会议。\n\n本邦既立志主导罗斯兴衰，须在三条立国之道中择定根本方针。"
 oe_rpl.1.a: "莫斯科专制集权之道（史实主线：大公权威与聚敛诸地）"
 oe_rpl.1.a.tt: "锁定路线一（#bold #color_yellow 莫斯科专制集权#!#!），获得[ShowModifier('oe_rpl_p1_kalita_purse')]，持续#Y 15年#!，开启聚敛诸地、白石克里姆林与统一律例事件线。"
 oe_rpl.1.b: "诺夫哥罗德维彻共和与波罗的海商业联邦（IF 线）"
 oe_rpl.1.b.tt: "锁定路线二（#bold #color_yellow 诺夫哥罗德议会共和#!#!），获得[ShowModifier('oe_rpl_p2_veche_charter')]，持续#Y 15年#!，开启市民大会改制、圣彼得商馆与波莫尔北疆事件线。"
 oe_rpl.1.c: "特维尔—基辅旧罗斯诸侯联邦（IF 线：立即解锁全罗斯大会）"
 oe_rpl.1.c.tt: "锁定路线三（#bold #color_yellow 旧罗斯诸侯联邦#!#!），获得[ShowModifier('oe_rpl_p3_princely_league')]，持续#Y 15年#!，立即获准自主召开全罗斯宗教会议并开启诸公大议会事件线。"
 oe_rpl.2.t: "萨莱贡使与弗拉基米尔大公敕令"
 oe_rpl.2.d: "来自萨莱汗廷的征税官与护骑踏入城门，带来大汗对弗拉基米尔大公敕令与岁贡的严厉催促。1339年特维尔王公亚历山大命丧萨莱的前车之鉴犹在眼前，但连年白银外流亦令诸城不堪重负。\n\n面对汗廷的威压，我廷当暂且屈身纳贡，还是暗蓄抗衡之力？"
 oe_rpl.2.a: "如数纳贡，以隐忍换取十年休养"
 oe_rpl.2.a.tt: "脱枷锁抗争度#R −10#!，获得[ShowModifier('oe_rpl_yoke_tribute_peace')]，持续#Y 10年#!。"
 oe_rpl.2.b: "敷衍贡使、暗结诸邦，积蓄脱枷锁之力"
 oe_rpl.2.b.tt: "脱枷锁抗争度#G +15#!，威望#G +5#!，获得[ShowModifier('oe_rpl_yoke_defiance_stance')]，持续#Y 10年#!。"
 oe_rpl.3.t: "草原大乱：金帐汗廷分崩之际"
 oe_rpl.3.d: "萨莱传来惊人消息：金帐汗国深陷汗位连环血斗，诸宗王与权臣各拥兵马互相攻伐，往日铁板一块的草原霸权已裂痕遍布。商旅与探马报称，草原征税使团久未南返，正是罗斯诸邦摆脱俯首命运的千载良机。"
 oe_rpl.3.a: "趁乱停贡整军，为决战草原磨砺兵锋"
 oe_rpl.3.a.tt: "脱枷锁抗争度#G +20#!，获得[ShowModifier('oe_rpl_steppe_mobilization')]，持续#Y 10年#!。"
 oe_rpl.3.b: "周旋草原各派，以河道商约厚实国库"
 oe_rpl.3.b.tt: "脱枷锁抗争度#G +10#!，获得[ShowModifier('oe_rpl_steppe_trade_compact')]，持续#Y 10年#!。"
 oe_rpl.4.t: "顿河之誓：库利科沃决战"
 oe_rpl.4.d: "草原权臣马麦纠集大军北上，扬言要重演百年前的劫掠，迫使罗斯诸城重新跪伏纳贡。拉多涅日的圣谢尔盖修院传出祝福之语，四方军旗汇聚顿河渡口。此战不仅关乎一城得失，更将向天下宣告：罗斯人敢于在野战中正面击败草原铁骑！"
 oe_rpl.4.a: "渡过顿河、背水决战，击碎草原霸权神话！"
 oe_rpl.4.a.tt: "脱枷锁抗争度#G +25#!，阶段推进至库利科沃纪元，威望#G +15#!，陆军传统#G +10#!，获得[ShowModifier('oe_rpl_kulikovo_victory')]，持续#Y 10年#!。"
 oe_rpl.4.b: "固守渡口堡垒与森林防线，以逸待劳挫敌锐气"
 oe_rpl.4.b.tt: "脱枷锁抗争度#G +15#!，阶段推进至库利科沃纪元，稳定度#G +5#!，获得[ShowModifier('oe_rpl_kulikovo_fortress')]，持续#Y 10年#!。"
 oe_rpl.5.t: "脱脱迷失的铁骑与石城重兴"
 oe_rpl.5.d: "顿河大捷的钟声未绝，统一金帐的脱脱迷失汗却率领精骑突袭北方。木制栅墙在火矢与围攻下不堪一击，沿途村镇再度蒙受战火。惨痛的教训令朝野猛醒：单凭一时野战之勇仍难永绝后患，唯有高厚的石城与新兴火器方能护佑罗斯的长久自由。"
 oe_rpl.5.a: "暂复微贡以安边，倾力营建石砌克里姆林与火铳工坊"
 oe_rpl.5.a.tt: "脱枷锁抗争度#R −5#!，获得[ShowModifier('oe_rpl_stone_kremlins')]，持续#Y 10年#!。"
 oe_rpl.5.b: "宁可焦土抗敌，绝不再向萨莱低头！"
 oe_rpl.5.b.tt: "脱枷锁抗争度#G +10#!，稳定度#R −5#!，陆军传统#G +5#!，获得[ShowModifier('oe_rpl_unbroken_spirit')]，持续#Y 10年#!。"
 oe_rpl.6.t: "兄终弟及与父死子继"
 oe_rpl.6.d: "十五世纪二三十年代，古老的留里克“兄终弟及”旧俗与大公“父死子继”新法终于激烈碰撞。采邑宗室联合不满集权的旧波雅尔蠢蠢欲动，宫廷内外暗流涌动。是趁势以铁腕确立直系集权法统，还是向诸王公与波雅尔让步换取内部和平？"
 oe_rpl.6.a: "确立父死子继铁律，削平采邑割据之患"
 oe_rpl.6.a.tt: "阶段推进至内战整固纪元，稳定度#R −8#!，正统性#G +15#!，获得[ShowModifier('oe_rpl_primogeniture_law')]，持续#Y 15年#!。"
 oe_rpl.6.b: "与宗室及波雅尔订立和议，以共治稳固社稷"
 oe_rpl.6.b.tt: "阶段推进至内战整固纪元，稳定度#G +5#!，获得[ShowModifier('oe_rpl_boyar_compact')]，持续#Y 15年#!。"
 oe_rpl.7.t: "乌格拉河大对峙：鞑靼枷锁终结"
 oe_rpl.7.d: "深秋的乌格拉河水渐次结冰，大帐汗国的大军陈兵南岸，要求我邦补缴积年岁贡并重颁臣属敕令。然而今非昔比——北岸列阵的是火器齐备、号令统一的罗斯主力，而草原联军则因严冬与后方掣肘士气溃散。随着大汗拨马南退，延续两百余年的鞑靼枷锁轰然落地，罗斯正式迈向大帝国与欧亚争雄的新纪元！"
 oe_rpl.7.a: "撕毁汗廷敕令、宣告鞑靼枷锁永绝！（完成第一阶段）"
 oe_rpl.7.a.tt: "标记#bold #color_yellow 鞑靼枷锁已破#!#!与第一阶段完成（衔接1480年后索菲亚联姻、沙皇与西伯利亚线），退出鞑靼枷锁组织（若仍在其中），威望#G +25#!，稳定度#G +10#!，获得[ShowModifier('oe_rpl_yoke_shattered')]，持续#Y 15年#!。"
 oe_rpl.7.b: "与草原订立对等通商停贡约，体面结束旧时代（完成第一阶段）"
 oe_rpl.7.b.tt: "标记#bold #color_yellow 鞑靼枷锁已破#!#!与第一阶段完成，退出鞑靼枷锁组织（若仍在其中），威望#G +15#!，获得[ShowModifier('oe_rpl_steppe_armistice')]，持续#Y 15年#!。"
 oe_rpl.11.t: "“钱袋”的遗产：聚敛罗斯诸地"
 oe_rpl.11.d: "承袭伊凡·卡利塔“钱袋”的治国方略，朝廷不仅凭借刀剑，更凭借财赋、税册与赎买采邑的手段，将四分五裂的东北罗斯公国逐一纳入掌中。如今国库渐丰，宫廷须决定是将财力优先用于和平收编采邑与整合税制，还是大规模豢养直属大公的服役骑兵。"
 oe_rpl.11.a: "赎买周边采邑、统一税册与户籍，加速诸邦并合"
 oe_rpl.11.a.tt: "莫斯科路线改革升至第#Y 1#!阶，脱枷锁抗争度#G +10#!，获得[ShowModifier('oe_rpl_p1_gathering_lands')]，持续#Y 15年#!。"
 oe_rpl.11.b: "广授服役采邑，组建直属大公的精锐骑兵亲卫"
 oe_rpl.11.b.tt: "莫斯科路线改革升至第#Y 1#!阶，脱枷锁抗争度#G +10#!，获得[ShowModifier('oe_rpl_p1_service_gentry')]，持续#Y 15年#!。"
 oe_rpl.12.t: "顿斯科伊白石克里姆林盟誓"
 oe_rpl.12.d: "大火与外敌屡次警示木城之脆。采自周边采石场的洁白石灰岩正源源不断运抵都城，筑起全罗斯首座宏伟的白石克里姆林。与此同时，往来森林河谷的官办驿站（亚姆驿传）也在筹划之中，以令大公的号令朝发夕至。"
 oe_rpl.12.a: "精筑白石克里姆林，树东北罗斯不破之都"
 oe_rpl.12.a.tt: "莫斯科路线改革升至第#Y 2#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p1_white_stone')]，持续#Y 15年#!。"
 oe_rpl.12.b: "铺设大公驿传军路，贯通森林与河谷要道"
 oe_rpl.12.b.tt: "莫斯科路线改革升至第#Y 2#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p1_yam_network')]，持续#Y 15年#!。"
 oe_rpl.13.t: "全罗斯君主与《法典》先声"
 oe_rpl.13.d: "内战尘埃落定，昔日桀骜的采邑王公与自治城邦已相继折服于中央权威。朝中法吏开始汇编覆盖全境的统一律例（1497年《法典》之先声），同时筹划将新并土地按“波米斯季耶”服役封地制分配给听命君主的军官，以彻底取代不可靠的世袭大领主。"
 oe_rpl.13.a: "颁行全罗斯统一律例先声，将司法与官署收归中央"
 oe_rpl.13.a.tt: "莫斯科路线改革升至第#Y 3#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p1_sudebnik_precursor')]，持续#Y 20年#!。"
 oe_rpl.13.b: "推行波米斯季耶服役封地制，奠定常备军根基"
 oe_rpl.13.b.tt: "莫斯科路线改革升至第#Y 3#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p1_pomestye_system')]，持续#Y 20年#!。"
 oe_rpl.14.t: "维彻钟声与大市长改制"
 oe_rpl.14.d: "沃尔霍夫河畔的维彻钟声响彻全城，但历代大市长（波萨德尼克）职位日渐被少数大波雅尔家族垄断，引发“百人商团”与各区市民的强烈不满。共和体制若欲在专制大公与北方强邻夹缝中长存，必须先在市民大会内部完成宪政革新。"
 oe_rpl.14.a: "扩大“百人商团”与工匠行会议席，制衡寡头大族"
 oe_rpl.14.a.tt: "诺夫哥罗德路线改革升至第#Y 1#!阶，脱枷锁抗争度#G +10#!，获得[ShowModifier('oe_rpl_p2_guild_veche')]，持续#Y 15年#!。"
 oe_rpl.14.b: "强化大市长与千人长常设执行院，统筹城防与军务"
 oe_rpl.14.b.tt: "诺夫哥罗德路线改革升至第#Y 1#!阶，脱枷锁抗争度#G +10#!，获得[ShowModifier('oe_rpl_p2_executive_veche')]，持续#Y 15年#!。"
 oe_rpl.15.t: "圣彼得商馆与波罗的海商业联邦"
 oe_rpl.15.d: "城中的圣彼得商馆汇聚着来自吕贝克、哥特兰与里加的汉萨商队，北方林海的貂皮、蜂蜡与亚麻在此换作满箱莱茵白银。商团代表向市民大会呈递两份方案：或是与汉萨订立平等互惠的波罗的海商业盟约，或是自建涅瓦河船坞与武装商船，夺回出海贸易主导权。"
 oe_rpl.15.a: "订立波罗的海平等通商宪章，坐收东西白银毛皮厚利"
 oe_rpl.15.a.tt: "诺夫哥罗德路线改革升至第#Y 2#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p2_baltic_league')]，持续#Y 15年#!。"
 oe_rpl.15.b: "兴建涅瓦—拉多加船坞舰队，打破汉萨海运垄断"
 oe_rpl.15.b.tt: "诺夫哥罗德路线改革升至第#Y 2#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p2_neva_fleet')]，持续#Y 15年#!。"
 oe_rpl.16.t: "北方自由同盟与波莫尔白海拓荒"
 oe_rpl.16.d: "南方集权大公虎视眈眈，企图摘除维彻巨钟、将北方自由商镇并入专制版图。市民大会面临历史性抉择：既可凝聚普斯科夫、维亚特卡等北方城邦共组“自由城邦护钟同盟”，亦可资助无畏的波莫尔水手沿白海与乌拉尔大河开辟遥远的毛皮拓荒商路。"
 oe_rpl.16.a: "缔结北方自由城邦同盟，以重金雇兵与石城捍卫维彻钟"
 oe_rpl.16.a.tt: "诺夫哥罗德路线改革升至第#Y 3#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p2_free_league')]，持续#Y 20年#!。"
 oe_rpl.16.b: "敕封波莫尔白海与乌拉尔毛皮商团，先声东进西伯利亚"
 oe_rpl.16.b.tt: "诺夫哥罗德路线改革升至第#Y 3#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p2_pomor_frontier')]，持续#Y 20年#!。"
 oe_rpl.17.t: "旧罗斯诸侯盟约"
 oe_rpl.17.d: "在特维尔、基辅与斯摩棱斯克的宫廷中，王公与史官们仍铭记着古罗斯“诸邦共议、留里克同宗”的古老盟约。莫斯科式的强权吞并令人忌惮，而一条以诸侯平等盟誓、古法传承和教会共议为纽带的联邦统一之路，正赢得越来越多东斯拉夫邦国的共鸣。"
 oe_rpl.17.a: "签署《诸公平等联邦盟约》，以互保与联姻结纳罗斯诸邦"
 oe_rpl.17.a.tt: "旧罗斯联邦路线改革升至第#Y 1#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p3_federal_compact')]，持续#Y 15年#!。"
 oe_rpl.17.b: "重修古罗斯编年史与雅罗斯拉夫法典，宣示正统法统"
 oe_rpl.17.b.tt: "旧罗斯联邦路线改革升至第#Y 1#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p3_old_rus_heritage')]，持续#Y 15年#!。"
 oe_rpl.18.t: "圣索菲亚钟声"
 oe_rpl.18.d: "罗斯都主教座的归属牵动着整个东欧正教世界的神经。借助业已开放的“全罗斯宗教会议”，我邦得以邀请第聂伯河与伏尔加河两岸的主教齐聚圣像之前，打破莫斯科对全罗斯教会权威的独占。"
 oe_rpl.18.a: "尊君堡普世牧首法统，以全罗斯大会树立正教灯塔"
 oe_rpl.18.a.tt: "旧罗斯联邦路线改革升至第#Y 2#!阶，脱枷锁抗争度#G +15#!，宗教影响力#G +20#!，全罗斯大会完成计数+1，获得[ShowModifier('oe_rpl_p3_sophia_revival')]，持续#Y 15年#!。"
 oe_rpl.18.b: "扶植鲁塞尼亚与基辅本土主教团，确立自主正教秩序"
 oe_rpl.18.b.tt: "旧罗斯联邦路线改革升至第#Y 2#!阶，脱枷锁抗争度#G +15#!，稳定度#G +5#!，获得[ShowModifier('oe_rpl_p3_ruthenian_synod')]，持续#Y 15年#!。"
 oe_rpl.19.t: "全罗斯诸公大议会与边疆自由骑手"
 oe_rpl.19.d: "面对西侧波兰—立陶宛的压力、南侧分裂草原汗国的袭扰与东北集权势力的竞争，旧罗斯联邦必须将临时盟誓升格为常设制度。诸邦代表齐聚大议会，商议设立常设联邦议政机构，或在广袤的南部荒原招募自由骑手筑起机动边防。"
 oe_rpl.19.a: "设立常设“全罗斯诸公大议会”，以联邦宪章统合诸邦"
 oe_rpl.19.a.tt: "旧罗斯联邦路线改革升至第#Y 3#!阶，脱枷锁抗争度#G +15#!，获得[ShowModifier('oe_rpl_p3_grand_diet')]，持续#Y 20年#!。"
 oe_rpl.19.b: "编练第聂伯—伏尔加边防轻骑，为自由哥萨克军团奠基"
 oe_rpl.19.b.tt: "旧罗斯联邦路线改革升至第#Y 3#!阶，脱枷锁抗争度#G +15#!，陆军传统#G +8#!，获得[ShowModifier('oe_rpl_p3_frontier_riders')]，持续#Y 20年#!。"
 oe_rpl.30.t: "全罗斯都主教座"
 oe_rpl.30.d: "十五世纪中叶，君士坦丁波利斯在西方压力下议论佛罗伦萨教会合一，远赴意大利的希腊都主教伊西多尔更令北方教会震动。罗斯本土主教团齐聚大教堂，恳请君主裁断：是斥责拉丁合一、由本土主教自主祝圣大都主教（如1448年约纳故事），还是继续承认君士坦丁波利斯普世牧首的传统法统？"
 oe_rpl.30.a: "本土主教团自主祝圣大都主教，开启罗斯教会自主纪元"
 oe_rpl.30.a.tt: "设定教会立场为#bold #color_yellow 自主都主教座#!#!，宗教影响力#G +25#!，威望#G +10#!，获得[ShowModifier('oe_rpl_autocephalous_see')]，持续#Y 20年#!。"
 oe_rpl.30.b: "维系与君堡普世牧首的正教共融，共守普世教会秩序"
 oe_rpl.30.b.tt: "设定教会立场为#bold #color_yellow 君堡共融#!#!，获得[ShowModifier('oe_rpl_ecumenical_bond')]，持续#Y 20年#!。"
 oe_rpl.31.t: "维尔纽斯与草原之间：基辅的抉择"
 oe_rpl.31.d: "1337年之初，基辅在立陶宛大公的庇护下暂离草原直接征税，却也因此被纳入维尔纽斯主导的共主联邦。圣索菲亚大教堂下的贵族与市民低声议论：我们是该暂借立陶宛的盾牌休养生息、日后再图大计，还是趁今朝立刻宣示留里克独立法统、挣脱外来共主？"
 oe_rpl.31.a: "暂借立陶宛之盾休养生息，严守基辅自治法统"
 oe_rpl.31.a.tt: "保留共主联邦保护，稳定度#G +5#!，获得[ShowModifier('oe_rpl_kiev_shield')]，持续#Y 15年#!。"
 oe_rpl.31.b: "脱离立陶宛共主联邦，宣告留里克基辅独立自主！"
 oe_rpl.31.b.tt: "立即退出立陶宛共主联邦，脱枷锁抗争度#G +10#!，威望#G +10#!，获得[ShowModifier('oe_rpl_kiev_independent')]，持续#Y 15年#!。"
 oe_rpl.20.t: "玩家罗斯：选项生效"
 oe_rpl.90.t: "【测试】玩家罗斯一期：状态读数"
 oe_rpl.90.d: "#T 主线状态#!\n路线(1莫/2诺/3联) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_path')|0]  阶段(0..4) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_stage')|0]  脱枷锁抗争度 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_defiance')|0]  枷锁已破 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_yoke')|0]  一期完成 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_p1done')|0]\n#T 制度与联动#!\n路线改革阶 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_reform')|0]  全罗斯大会数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_councils')|0]  内战结局 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_cw')|0]  教会立场(0君/2自) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_ecc')|0]\n#T 调度#!\n月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_m')|0]  结束代码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_end')|0]  上次事件月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_evm')|0]  已发数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rpl_rd_cnt')|0]\n（结束代码：0运行中、1一期完成、2成立俄罗斯、3至1485年、8无玩家罗斯）"
