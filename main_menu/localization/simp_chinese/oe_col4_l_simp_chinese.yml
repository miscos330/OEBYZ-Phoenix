 OEPE_f_desc: "一统本大区诸殖民领与边疆重镇，高举秘鲁独立主权旗帜。"
 STATIC_MODIFIER_DESC_oe_col4_atlantic_amity_mod: "遍布大洋的新建使团与自由口岸拓展商权与外交声誉，但略微抬升军费开支。"
 STATIC_MODIFIER_DESC_oe_col4_ce_cashcrop_mod: "高利润烟草与可可种植显著拉升海贸与生产效率，但挤占了一部分传统口粮耕地。"
 STATIC_MODIFIER_DESC_oe_col4_ce_plantation_mod: "蔗糖、咖啡与小麦庄园向大西洋商路输送滚滚原料与商权，但加剧了殖民地内部阶层摩擦。"
 STATIC_MODIFIER_DESC_oe_col4_ce_ranching_mod: "漫山遍野的欧亚马群与牛群让美洲平原跃升为轻骑兵源地与陆贸枢纽，但豪强牧场主略微拖累国内稳定投入。"
 STATIC_MODIFIER_DESC_oe_col4_ce_staple_boom_mod: "马铃薯与玉米极大提升了贫瘠农田的单位热量产出与人口增长，代价是王室直辖权相对稀释。"
 STATIC_MODIFIER_DESC_oe_col4_charter_concession_mod: "放宽殖民关税壁垒令跨洋商网更加活跃并安抚海外议会，代价是直接关税分成略减。"
 STATIC_MODIFIER_DESC_oe_col4_crown_enclave_mod: "保留海外良港由本土直辖可拓展舰队投送半径与海贸收益，代价是轻微稀释本土行政控制力。"
 STATIC_MODIFIER_DESC_oe_col4_crown_prerogative_mod: "重申帝国最高主权保住关税与王室力量，却令海外殖民议会心生离心。"
 STATIC_MODIFIER_DESC_oe_col4_dominion_charter_mod: "帝国联邦框架下的高度自治巩固持久效忠并激发地方生产，但削弱了王室直辖集权。"
 STATIC_MODIFIER_DESC_oe_col4_federated_council_mod: "宗主与海外代表共商国是提升外交声望与附庸和睦，但议会拉锯略微放缓稳定投入。"
 STATIC_MODIFIER_DESC_oe_col4_frontier_charter_mod: "确认拓荒地契与边疆驿道加速海外移民并赢得忠诚，但轻微稀释中枢集权控制。"
 STATIC_MODIFIER_DESC_oe_col4_imperial_federation_mod: "将殖民领升格为自治领极大增进远洋航运与忠诚度，代价是让渡部分直接关税收入。"
 STATIC_MODIFIER_DESC_oe_col4_joint_customs_mod: "宗主与殖民地协同运作的联合海关兼顾海贸效率与海外忠诚，仅需承担轻微本土税政开支。"
 STATIC_MODIFIER_DESC_oe_col4_mercantile_tariffs_mod: "严密的宗主国航海专卖榨取更高殖民关税与海贸回报，但激起海外殖民领的强烈不满。"
 STATIC_MODIFIER_DESC_oe_col4_patriot_fervor_mod: "独立热潮令殖民地民兵士气高涨、兵源充沛，但战时动员也拉紧了内部安定。"
 STATIC_MODIFIER_DESC_oe_col4_peaceful_emancipation_mod: "和平承认前殖民地主权保住了丰厚海贸与外交美誉，代价是短期帝国威望微损。"
 STATIC_MODIFIER_DESC_oe_col4_proclamation_line_mod: "划定王室禁垦线整肃行政控制并赢得国际声誉，代价是减缓海外边疆移民步伐。"
 STATIC_MODIFIER_DESC_oe_col4_sovereign_charter_mod: "崭新的主权立宪秩序大幅提升政权正统与城乡繁荣，代价是初期让利降税。"
 STATIC_MODIFIER_DESC_oe_col4_survivor_resilience_mod: "挺过大瘟疫浩劫的部落社会重建起持久的抗疫与人口恢复韧性，但税赋体系尚待缓步复元。"
 STATIC_MODIFIER_DESC_oe_col4_syncretic_governor_mod: "允许吸纳本土克里奥尔与原住民精英出任总督赢得国内各阶层拥戴与外交亲和，但也降低了对遥远宗主国的顺从度。"
 STATIC_MODIFIER_DESC_oe_col4_viceroy_charter_mod: "将武装征服者军团转制为正规民政总督府显著提升控制力与繁荣度，但边疆粗放治理略损外交声誉。"
 STATIC_MODIFIER_DESC_oe_col4_viceroy_grant_mod: "新近整并的疆域稳固了殖民地总督权威与对宗主的忠诚，但前期整合略微拉低税收效率。"
