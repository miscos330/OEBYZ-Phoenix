 STATIC_MODIFIER_NAME_oe_col4_mercantile_tariffs_mod: "严苛航海关税法案"
 STATIC_MODIFIER_NAME_oe_col4_patriot_fervor_mod: "殖民地爱国者总动员"
 STATIC_MODIFIER_NAME_oe_col4_peaceful_emancipation_mod: "跨洋和平解放商约"
 STATIC_MODIFIER_NAME_oe_col4_proclamation_line_mod: "王室边疆禁垦敕令"
 STATIC_MODIFIER_NAME_oe_col4_sovereign_charter_mod: "主权立宪开国宪章"
 STATIC_MODIFIER_NAME_oe_col4_survivor_resilience_mod: "大瘟疫劫后复兴"
 STATIC_MODIFIER_NAME_oe_col4_syncretic_governor_mod: "殖民地本土融合治理"
 STATIC_MODIFIER_NAME_oe_col4_viceroy_charter_mod: "新设殖民总督府"
 STATIC_MODIFIER_NAME_oe_col4_viceroy_grant_mod: "总督区扩境特许"
 oe_col4.1.a: "将本大区新征服领土全部移交[target_colony.GetName]统辖"
 oe_col4.1.a.tt: "将该大区所有非核心海外占领地一键移交给核心殖民领，提升其忠诚度与地方控制力。"
 oe_col4.1.b: "沿海良港归王室直辖，内陆疆域移交殖民领"
 oe_col4.1.b.tt: "仅移交内陆非核心省份，保留沿海港口作为王室直辖海军与海贸据点。"
 oe_col4.1.c: "全部保留本土直辖，暂不移交"
 oe_col4.1.c.tt: "所有新占领土继续由宗主国直接管辖。"
 oe_col4.1.d: "我军已在大洋彼岸夺取大片新领土，且同大区内早已设有[target_colony.GetName]驻节理政。殖民枢密院建言：与其让零碎海外飞地遥由本土官僚低效遥控，不如趁势统筹整合，或择要港直辖以扼海权。"
 oe_col4.1.t: "海外新征服疆域之管辖归属"
 oe_col4.10.a: "召集氏族长老共克时艰"
 oe_col4.10.d: "沿远海商路传来的致命怪疫突然在部族猎场与河谷村镇暴发。长老们忧心忡忡地警告：若瘟疫久久不退，偏远外围村寨恐难以为继。"
 oe_col4.10.t: "大瘟疫席卷部族村落"
 oe_col4.11.a: "放弃疫区外围聚落，收拢幸存族众"
 oe_col4.11.a.tt: "放弃这座人口锐减的边疆聚落使其回归荒野，同时稳住余下族众民心。"
 oe_col4.11.b: "倾力调拨粮药，死守祖先故地"
 oe_col4.11.b.tt: "消耗国库与稳定度强行维持该聚落。"
 oe_col4.11.d: "烈性疫病使偏远聚落[depop_loc.GetName]十室九空。幸存族人恳请趁寒冬来临前携家带口撤往核心主寨，以保部族血脉。"
 oe_col4.11.t: "边疆聚落因疫荒芜"
 oe_col4.12.a: "化整为零，转为迁徙部落社会"
 oe_col4.12.a.tt: "将政体转为灵活的迁徙人口型国家，摆脱定居点沦陷危机。"
 oe_col4.12.b: "坚守最后圣火，永不背弃故土"
 oe_col4.12.d: "随着固定村镇接连毁于疫潮，部落酋长与萨满商议是否彻底放弃定居城寨，化整为零重归辽阔荒原的迁徙生活。"
 oe_col4.12.t: "重归迁徙游牧之路"
 oe_col4.13.a: "劫后余生，重振部族"
 oe_col4.13.d: "肆虐多年的致命瘟疫终于从河谷退散。在浩劫中幸存并成长起来的新一代族人重新修筑议事厅、开垦田圃并缔结新盟。"
 oe_col4.13.t: "大瘟疫散尽，部族新生"
 oe_col4.20.a: "颁布皇家特许状——正式改制为殖民领总督府"
 oe_col4.20.a.tt: "移除征服者军队国体制，正式转为领土型殖民领，并拨付建府启动资金。"
 oe_col4.20.b: "维持征服者战备体制，继续拓疆征伐"
 oe_col4.20.b.tt: "五年内保留其武装征服者身份以便继续对外作战。"
 oe_col4.20.d: "我方派驻海外的征服者武装[conq_subject.GetName]已结束战事并站稳脚跟。与其放任武装冒险家作为军队国长期滞留荒野，王廷现可颁布皇家特许状，将其正式转制为有固定疆域与民政体系的殖民领。"
 oe_col4.20.t: "将征服者军团转制为正规殖民总督府"
 oe_col4.201.a: "向全体海外殖民领严征航海专卖关税"
 oe_col4.201.a.tt: "立即征收一笔可观关税并强化十年关税收益，但会推高所有海外殖民领的独立倾向。"
 oe_col4.201.b: "向殖民地商埠颁授自由港商贸特许"
 oe_col4.201.b.tt: "降低全部海外殖民领的独立倾向并扩大商权，代价是略微让渡王室关税分成。"
 oe_col4.201.c: "委任干练殖民海关专员推行联合税制改革"
 oe_col4.201.c.tt: "耗费少量经费延揽干练市民阶层专员入朝，温和兼顾海贸效率与殖民领忠诚。"
 oe_col4.201.d: "海外商政委员会的账吏将一叠叠关税清册与[focus_colony.GetName]商界的陈情书一并呈上御前。收紧航海专卖关税可立竿见影地充盈本土国库，而开放自由港特许或委派联合海关专员则更能安抚海外殖民领并长保商路兴旺。"
 oe_col4.201.t: "殖民特许关税与远洋商贸法案"
 oe_col4.202.a: "确认拓荒者地契并勘修边疆官道"
 oe_col4.202.a.tt: "提升核心殖民领首都的发展度与繁荣度，缓和独立倾向并加快海外移民。"
 oe_col4.202.b: "颁布严格的王室边疆禁垦线敕令"
 oe_col4.202.b.tt: "增强国家控制力、稳定度与威望，但会令渴望西进拓荒的殖民领略生怨言。"
 oe_col4.202.c: "特派资深总督府勘界大臣坐镇调停"
 oe_col4.202.c.tt: "延揽资深贵族官吏入朝，并向核心殖民领颁授新的总督区扩境特许以稳固忠诚。"
 oe_col4.202.d: "自[focus_colony.GetName]边疆林莽归来的皇家测绘队禀报：新垦土地契约彼此重叠、拓荒民团与邻近势力摩擦日增，新兴河口渡口亟待朝廷明定界址。王廷此刻如何裁断边疆归属，将决定未来十年殖民地的发展势头与对宗主的忠心。"
 oe_col4.202.t: "殖民总督区边疆划界仲裁"
 oe_col4.203.a: "册封海外殖民领为帝国自治领"
 oe_col4.203.a.tt: "大幅降低全部海外殖民领的独立倾向，赋予自治领生产与远洋海贸红利，代价是降低直接关税。"
 oe_col4.203.b: "设立由总督大臣主持的联邦殖民咨议院"
 oe_col4.203.b.tt: "延揽干练议会政治家入朝，提升外交声誉与殖民地忠诚度。"
 oe_col4.203.c: "坚持宗主王室最高主权，限制地方议会扩权"
 oe_col4.203.c.tt: "巩固王室正统、威望与关税权力，但海外殖民领的离心倾向随之上升。"
 oe_col4.203.d: "新的时代思潮已跨越大洋席卷各殖民领。来自[focus_colony.GetName]及诸总督区的代表联名上书：羽翼渐丰的海外行省已无法再仅凭万里之外的敕令遥控；若朝廷顺势颁授自治领宪章，便可化强制统辖为同舟共济的跨洋联邦。"
 oe_col4.203.t: "帝国海外自治领特许宪章"
 oe_col4.204.a: "正式宣告完全独立，向宗主国递交独立宣言！"
 oe_col4.204.a.tt: "振奋爱国者民兵士气并崛起一位成年爱国将领，迫使宗主国在和平解放与独立战争之间作出决断。"
 oe_col4.204.b: "呈递橄榄枝请愿书，力争和平解放或高度自治"
 oe_col4.204.b.tt: "延揽一位成年殖民地外交家，并大幅提高宗主国接受和平解放或自治妥协的意愿。"
 oe_col4.204.c: "暂缓决裂，加紧筹措军饷与民兵武装"
 oe_col4.204.c.tt: "获得军费、稳定度与独立渴望，并缩短两年后重启独立大会的冷却。"
 oe_col4.204.d: "来自各郡县、海港与边疆教区的代表挤满议事大厅，通宵灯火之下，激昂演说家痛斥[former_overlord.GetName]远洋苛税与专断统治。民兵统领磨刀霍霍静候宣告独立之号令，而温和派仍力主在兵戎相见前向宗主王廷递交最后一份橄榄枝请愿书。"
 oe_col4.204.t: "殖民地独立代表大会"
 oe_col4.205.a: "顺应大势和平解放，缔结跨洋通商友好条约"
 oe_col4.205.a.tt: "和平解除宗藩关系并缔结十年互不侵犯条约，获得跨洋商贸与外交红利，同时让前殖民地得以正式建立独立主权国家。"
 oe_col4.205.b: "严词驳斥叛逆妄言——以独立战争铁血镇压！"
 oe_col4.205.b.tt: "该殖民领将立刻对我国发动殖民独立战争，唯有战场上见分晓！"
 oe_col4.205.c: "抛出紧急地方自治方案与财税让步以挽留帝国统一"
 oe_col4.205.c.tt: "耗费国库与威望换取该殖民领大幅降低独立倾向，并颁授十五年自治领宪章以维系宗藩。"
 oe_col4.205.d: "一封盖满鲜红印记与豪迈签名的羊皮诏书渡海送达宫廷：[rebel_colony.GetName]代表大会已正式提出独立诉求！主战将领力请即刻发兵远征、铁血平叛，而财政大臣则忧心忡忡地警告：一场劳师袭远的跨洋大战势必耗竭国力，反不如和平解放以保世代通商之利，或以紧急自治方案勉力挽留。"
 oe_col4.205.t: "殖民独立危机：跨洋独立宣言"
 oe_col4.206.a: "起草主权立宪宪章，奠定开国法统"
 oe_col4.206.a.tt: "涌现一位成年爱国政治家，并获得正统性与城乡繁荣修正。"
 oe_col4.206.b: "动员大陆民兵，推举爱国将领统军御敌"
 oe_col4.206.b.tt: "涌现一位成年爱国将领，显著提升陆军士气与人力储备。"
 oe_col4.206.c: "广开自由通商口岸，拓展跨洋邦交商路"
 oe_col4.206.c.tt: "收获贸易资金、威望、商权与外交声誉。"
 oe_col4.206.d: "从沿海钟楼到高原广场，欢庆与动员的钟声此起彼伏，传单与檄文宣告着新世界共同体崭新命运的降临。无论是在沙场上捍卫来之不易的自由，还是起草立宪宪章、筹建属于这片大陆的独立主权国家，一代本土成长起来的政治家与将领已昂首登上历史舞台。"
 oe_col4.206.t: "新世界主权曙光与爱国者觉醒"
 oe_col4.21.a: "坚持宗主文化总督制（推荐）"
 oe_col4.21.a.tt: "校准当前及历任总督为宗主国文化，保持正统殖民行政风貌。"
 oe_col4.21.b: "推行本土融合共治路线"
 oe_col4.21.b.tt: "允许不同文化背景的地方精英出任总督，提升内部和谐但略降宗主忠诚度。"
 oe_col4.21.d: "殖民地议会推举新任总督之际，宗主国特使力主唯有宗主文化出身的官员方可主政，以维系帝国体统；而本地庄园主与原住民豪强则呼吁开放本土融合精英共治。"
 oe_col4.21.t: "殖民地总督遴选章程"
 oe_col4.30.a: "推广马铃薯与玉米主粮革命，永弭饥馑"
 oe_col4.30.a.tt: "将气候适宜且非稀有矿产的旧世界农区改种马铃薯或玉米，并获得10年主粮丰收修正。"
 oe_col4.30.b: "特许兴办烟草与可可经济作物庄园"
 oe_col4.30.b.tt: "在温暖非稀有矿产的旧世界省份引种烟草或可可，并获得10年海贸增产修正。"
 oe_col4.30.d: "远洋货船运回装满美洲马铃薯块茎、金黄玉米穗、醇香烟叶与可可豆荚的植物样本箱。皇家农艺官请旨定夺：首批王室垦地与减税名额应优先投入高产主粮，还是高利经济作物？"
 oe_col4.30.t: "哥伦布大交换：新世界作物落户旧大陆"
 oe_col4.31.a: "大兴欧亚骏马与牧牛场"
 oe_col4.31.a.tt: "将气候适宜且非稀有矿产的美洲省份改建马场或牧场，提升轻骑战力与陆贸效率。"
 oe_col4.31.b: "开辟蔗糖、咖啡与小麦大庄园"
 oe_col4.31.b.tt: "在适宜且非稀有矿产的美洲省份建设蔗糖、咖啡或小麦庄园，扩大原料出口与商权。"
 oe_col4.31.d: "跨洋大帆船在美洲港埠卸下成群骏马种畜、健壮牛群、甘蔗嫩苗与高原咖啡树。地方总督呈请敕许，以定新世界边疆农牧开发之方向。"
 oe_col4.31.t: "哥伦布大交换：欧亚牲畜与庄园扎根美洲"
 oe_col4_cab_botanical_acclimatization: "跨洋农作驯化局"
 oe_col4_cab_botanical_acclimatization_action: "跨洋农作驯化中"
 oe_col4_cab_botanical_acclimatization_action_progress: "驯化农作中"
 oe_col4_cab_botanical_acclimatization_action_progress_tooltip: "皇家植物学家正持续在境内外驯化新旧世界作物，稳步提升粮食产出与殖民移民活力。"
 oe_col4_cab_botanical_acclimatization_action_progress_wordier: "正在推行跨洋农作与牲畜驯化"
 oe_col4_cab_botanical_acclimatization_active: "跨洋农作驯化局运作中"
 oe_col4_cab_botanical_acclimatization_desc: "委派皇家植物学家与殖民农艺师在宗主本土与海外领地协同驯化新旧世界作物及牲畜，提升粮食与原料产出并促进移民，但会略微摊薄税收效率。"
 oe_col4_confederate_chiefdom: "部族酋邦联盟"
 oe_col4_confederate_chiefdom_desc: "以血缘氏族与仪典外交维系的松散酋邦联盟。虽能动员可观部落征召兵并擅长邻邦斡旋，但在社会真正集权之前无法在和约中永久兼并土地。"
 oe_col4_dec_arbitrate_borders.a: "派遣皇家勘界专员赴海外裁定"
 oe_col4_dec_arbitrate_borders.desc: "派遣皇家测绘官与总督府专员勘定海外边疆界线，化解殖民拓荒摩擦并推动地方发展与忠诚。"
 oe_col4_dec_arbitrate_borders.title: "裁定殖民总督区疆界"
 oe_col4_dec_charter_tax_trade.a: "召集海外商政委员会定议税贸"
 oe_col4_dec_charter_tax_trade.desc: "召集海外商政委员会，在殖民地航运关税与自由港商贸特许之间重新权衡宗主收益与殖民地独立倾向。"
 oe_col4_dec_charter_tax_trade.title: "殖民特许税赋与商贸协定"
 oe_col4_dec_consolidate_overseas.a: "筹议大区海外领地整并"
 oe_col4_dec_consolidate_overseas.desc: "精简跨洋行政治理：将散落于海外的领地一键移交给同大区的核心殖民领统一管辖，或仅保留沿海要港直辖。"
 oe_col4_dec_consolidate_overseas.title: "整合海外殖民飞地"
 oe_col4_dec_import_new_world_crops.a: "拨款筹建跨洋引种苗圃"
 oe_col4_dec_import_new_world_crops.desc: "自宗教改革时代起，资助王室庄园与农艺行会将美洲马铃薯、玉米、烟草或可可引种至气候适宜的旧世界农区，严格保护金银矿产与稀有香料产地。"
 oe_col4_dec_import_new_world_crops.title: "哥伦布大交换：引种新世界高产作物"
 oe_col4_dec_introduce_old_world_livestock.a: "特许设立新世界牧场与种植园"
 oe_col4_dec_introduce_old_world_livestock.desc: "在美洲资助跨洋牧场与庄园特许状，将欧亚马匹、牲畜、蔗糖、咖啡或小麦引入气候适宜的新世界农牧区，严格保护金银与稀缺矿藏。"
 oe_col4_dec_introduce_old_world_livestock.title: "哥伦布大交换：引入欧亚牲畜与种植园"
 oe_col4_dec_proclaim_independence.a: "召集殖民地独立代表大会"
 oe_col4_dec_proclaim_independence.desc: "当专制时代或革命时代的海外殖民地独立渴望高涨之时，召集大陆代表大会向宗主国呈递独立宣言，迫使其在和平解放与独立战争之间作出历史抉择。"
 oe_col4_dec_proclaim_independence.title: "宣告殖民地独立宣言"
 oe_col4_dec_self_gov_charter.a: "拟定帝国殖民自治特许章程"
 oe_col4_dec_self_gov_charter.desc: "自专制时代起，通过颁授自治领特许状或设立联邦殖民议会革新跨洋帝国体制，以和平之道化解独立思潮并扩大远洋贸易。"
 oe_col4_dec_self_gov_charter.title: "颁授殖民地自治特许状"
 oe_col4_pestilence_collapse: "大瘟疫边疆社会瓦解"
 oe_col4_pestilence_collapse_desc: "旧世界烈性瘟疫席卷美洲原住民部落，外围村落人口锐减，幸存部众被迫向核心聚落收缩或退回迁徙游猎生活。"
