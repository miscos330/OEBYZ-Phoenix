# NEW 2026-11-23 v21.0 Step 5 / P1: 5 Strategic Goods Economic Loop Closure, Cross-Module Vertical Integration & 6 Native Situation GUIs (oe_sy2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v210_p1_synergy_gui.py; edit the generator, not this file.
 oe_sy2_steam_dockyard: "蒸汽船坞"
 oe_sy2_steam_dockyard_desc: "专供专制与革命时代营建的近代海军重型船坞，消耗蒸汽机、精炼钢与航海天文钟运转。大幅提升港口同时造舰席位、海权存在感与修船速度，并为全国提供水手储备、主力舰战力与维护费减免。"
 oe_sy2_arsenal_foundry: "精钢军工厂"
 oe_sy2_arsenal_foundry_desc: "专制与革命时代解锁的重型兵工制造厂，消耗精炼钢与工业化工品运转，既可保障精锐炮兵补给与攻城维护，也可批量浇铸高压精钢重炮，全面提升全国炮兵战力、军纪与攻城效率。"
 oe_sy2_porcelain_exchange: "外销瓷茶市舶所"
 oe_sy2_porcelain_exchange_desc: "大航海时代起可营建的特许海贸交易所，消耗外销瓷茶箱与航海天文钟统筹远洋快船清关与银货结算。大幅提高本地商力、商队运力与市场通达度，并同步提升全国海运效率、市民满意度与商税岁入。"
 oe_sy2_chemical_dye_works: "化学染坊与硝碱厂"
 oe_sy2_chemical_dye_works_desc: "宗教改革与专制时代起可营建的近代印染与碱剂精炼工场，消耗工业化工品规模化产出高级精纺呢绒与漂白精印纸张，同时全面带动当地纺织、造纸产出与城镇繁荣发展。"
 oe_sy2_canal_lock_authority: "大运河闸门局"
 oe_sy2_canal_lock_authority_desc: "执掌任意一条已建成跨洲大运河（苏伊士、巴拿马、基尔、伏尔加—顿河或京杭大运河）后解锁。消耗蒸汽机与精炼钢驱动水力船闸与挖泥船队，极大增强运河枢纽通达度、商运吞吐量与帝国控制力。"
 oe_sy2_pm_steam_dockyard_ops: "蒸汽干船坞与精密天文钟装配"
 oe_sy2_pm_steam_dockyard_ops_desc: "以蒸汽抽水泵驱动干船坞排蓄，以精炼钢加固主力舰龙骨与装甲，并为远洋战舰校准制式航海天文钟。"
 oe_sy2_pm_arsenal_foundry_maint: "精钢兵工检验与化工火药维护"
 oe_sy2_pm_arsenal_foundry_maint_desc: "维持重型精钢镗床、工业化工火药试制室与制式炮架工坊运转，为野战与攻城炮队提供持续军需。"
 oe_sy2_pm_porcelain_exchange_ops: "外销瓷茶验关与快船清算行"
 oe_sy2_pm_porcelain_exchange_ops_desc: "核验外销瓷茶箱品级、签发按天文钟航期结算的远洋提单，并统筹跨洲白银汇兑与商帮货款清算。"
 oe_sy2_pm_canal_lock_steam_ops: "蒸汽挖泥船与精钢水力船闸维护"
 oe_sy2_pm_canal_lock_steam_ops_desc: "常年运转蒸汽水力抽水机、精钢闸门与机械挖泥船队，保障跨洲大运河终年深水通航与闸口高效周转。"
 oe_sy2_pm_bessemer_ordnance_casting: "精钢铸炮与化学精炼发射药工艺"
 oe_sy2_pm_bessemer_ordnance_casting_desc: "以均质精炼钢整体浇铸高压重炮炮管，并配以工业化工精制火药，使攻城重炮射程与威力大幅跃升。"
 oe_sy2_pm_alkali_fine_cloth: "纯碱漂白与色牢化工精纺工艺"
 oe_sy2_pm_alkali_fine_cloth_desc: "运用工业纯碱、矿酸漂白剂与色牢媒染剂处理原棉与羊毛，以工场化效率批量织造光鲜华贵的高级精纺呢绒。"
 oe_sy2_pm_bleached_rag_paper: "化工漂白纸浆与精印书籍用纸"
 oe_sy2_pm_bleached_rag_paper_desc: "以纯碱与化学漂白试剂蒸煮麻纤与木浆，源源不断为印刷局、帝国衙门与商行票号供应洁白耐存的高级纸张。"
 AUTO_MODIFIER_NAME_oe_sy2_auto_steam_dockyard_net: "蒸汽船坞海军保障网络"
 AUTO_MODIFIER_DESC_oe_sy2_auto_steam_dockyard_net: "配备蒸汽机、精炼钢与航海天文钟的蒸汽船坞投入运转，全面扩充帝国水手储备、加速舰队建造并降低主力战舰维护费。"
 AUTO_MODIFIER_NAME_oe_sy2_auto_arsenal_foundry_net: "精钢军工厂炮兵军工体系"
 AUTO_MODIFIER_DESC_oe_sy2_auto_arsenal_foundry_net: "以精炼钢与工业化工品运转的精钢军工厂为陆军提供制式钢炮、严明军纪与卓越攻城破垒能力。"
 AUTO_MODIFIER_NAME_oe_sy2_auto_porcelain_exchange_net: "外销瓷茶市舶贸易网络"
 AUTO_MODIFIER_DESC_oe_sy2_auto_porcelain_exchange_net: "以精密天文钟协调航期的外销瓷茶市舶所显著增强全国商帮实力、海运贸易效率、市民满意度与商税岁入。"
 AUTO_MODIFIER_NAME_oe_sy2_auto_chemical_dye_works_net: "近代纯碱与化工精炼产业带"
 AUTO_MODIFIER_DESC_oe_sy2_auto_chemical_dye_works_net: "化学染坊与硝碱厂全面带动全国织造与造纸效能，加速城镇发展并催生近代应用化学革新。"
 AUTO_MODIFIER_NAME_oe_sy2_auto_canal_lock_authority_net: "跨洲大运河水力闸务总署"
 AUTO_MODIFIER_DESC_oe_sy2_auto_canal_lock_authority_net: "沿已建成大运河设立的蒸汽水力闸门局倍增海陆商运吞吐量，并将中枢行政控制力沿黄金水道迅速投送全国。"
 oe_sy2_refill_winter_provinces_tt: "我国最多#Y 4#!个缺粮或受冻行省立即获得#G +35%#!应急粮储补给。"
 oe_sy2_promote_skilled_urban_pops_tt: "我国发展度最高的最多#Y 2#!座城镇或城市中，将有#G 农民#!人口晋升为熟练#G 劳工#!与#G 市民#!。"
 oe_sy2_dec_strategic_goods_consortium.title: "敕建战略物资联合供应同业会"
 oe_sy2_dec_strategic_goods_consortium.desc: "整合精炼钢厂、工业化工厂、外销瓷茶窑、航海天文钟行会与蒸汽铁厂组建官商联合同业会。令全部#Y 5种战略物资#!产出提升#G +15%#!，并持续#Y 25#!年提升全国生产效率与贸易收入，安抚市民阶层并促进城镇熟练人口晋升。花费#Y 250#!金币（20年冷却）。"
 oe_sy2_dec_strategic_goods_consortium.a: "颁授战略物资联合同业会敕书"
 oe_sy2_dec_hydraulic_canal_syndicate.title: "设立跨洲大运河水利船闸总署"
 oe_sy2_dec_hydraulic_canal_syndicate.desc: "以精炼钢闸门与蒸汽疏浚船队全面升级我朝执掌的已建成大运河。获得持续#Y 25#!年的#G 跨洲大运河水利船闸总署#!修正（海陆贸易效率各+10%、商队运力+12%并提升控制度与繁荣度），同时提升首都发展度。花费#Y 300#!金币（25年冷却）。"
 oe_sy2_dec_hydraulic_canal_syndicate.a: "敕立跨洲运河水力船闸总署"
 oe_sy2_dec_winter_granary_charter.title: "启用寒冬常平仓与商帮赈济约章"
 oe_sy2_dec_winter_granary_charter.desc: "联动银号信贷、行省常平仓与草原越冬草料营以抵御小冰期严寒与歉收危机。立即为最多#Y 4#!个缺粮行省补充粮储，并获得持续#Y 12#!年的#G 帝国寒冬常平仓与信贷赈济约章#!修正。花费#Y 160#!金币（10年冷却）。"
 oe_sy2_dec_winter_granary_charter.a: "拨付寒冬常平仓与赈济信贷"
 oe_sy2_dec_viceroy_diet_compact.title: "召会摄政与诸路总督宪制等级会议"
 oe_sy2_dec_viceroy_diet_compact.desc: "在摄政或藩镇承压之际召请议会代表、武装等级首领与诸路总督共签宪制协约。令全部附庸独立倾向降低#G -12#!、安抚贵族满意度，并获得持续#Y 12#!年的#G 摄政与总督等级会议宪制协约#!修正。花费#Y 150#!金币（10年冷却）。"
 oe_sy2_dec_viceroy_diet_compact.a: "御批颁行宪制等级会议协约"
 STATIC_MODIFIER_NAME_oe_sy2_mod_strategic_consortium: "帝国战略物资联合供应同业会"
 STATIC_MODIFIER_DESC_oe_sy2_mod_strategic_consortium: "统筹精炼钢、工业化工、外销瓷茶、航海天文钟与蒸汽机产销的官商联合同业会，令全境战略工业供应链高效闭环。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_canal_hydraulic_board: "跨洲大运河水利船闸总署"
 STATIC_MODIFIER_DESC_oe_sy2_mod_canal_hydraulic_board: "中央河工与船闸总署统筹蒸汽疏浚、闸门税则与商队过闸班期，令跨洲运河长保畅通繁盛。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_winter_granary_compact: "帝国寒冬常平仓与信贷赈济约章"
 STATIC_MODIFIER_DESC_oe_sy2_mod_winter_granary_compact: "打通商帮信贷、行省常平仓与越冬草料栈，在严寒与小冰期荒年中牢牢兜住万民生计与社会稳定。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_constitutional_diet_accord: "摄政与总督等级会议宪制协约"
 STATIC_MODIFIER_DESC_oe_sy2_mod_constitutional_diet_accord: "由议会、等级代表与诸路总督共签的宪制协约，在幼主摄政与权力交接之际牢牢维系朝野团结与藩镇效忠。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev1_bank_granary_relief: "银号信贷常平赈粮网络"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev1_bank_granary_relief: "依托银号汇票网络迅速跨区调拨南方暖港余粮，将小冰期严冬饥荒消弭于未萌。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev1_crown_grain_levy: "御前战时官仓统征令"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev1_crown_grain_levy: "钦差粮官直接统管地方仓廪优先保障京畿与边防重镇，虽令地方豪强不满却稳住了财政与中枢权威。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev2_steppe_winter_camps: "官助草原冬窝子与草料保障营"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev2_steppe_winter_camps: "在背风河谷预建囤积干草与绿洲粮谷的冬窝子大营，护住汗国战马群与诸部生计安然度过白灾严冬。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev2_border_forage_raids: "寒冬南下打草谷远征"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev2_border_forage_raids: "不堪草场冰封重压的草原万户挥师南下劫掠农耕边镇粮仓，虽暂解燃眉之急却令邻邦戒心大增。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev3_celestial_granary_shield: "中原常平仓与河工赈济体系"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev3_celestial_granary_shield: "大开常平义仓并拨付银号赈款安抚黄淮灾民，从根源上切断流民揭竿而起的乱源。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev3_marshal_grain_corvee: "行省行军都元帅府军粮括征"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev3_marshal_grain_corvee: "授权各地行军都元帅府就地筹措军粮以维持大军战力，却也令地方勋贵军阀坐大。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev4_diet_regency_accord: "议会监理摄政与私兵编练协约"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev4_diet_regency_accord: "借议会与等级大会约法将豪门私兵纳入监理体制，既化解摄政政变隐忧又保住贵族骑兵效忠。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev4_magnate_stipend_pact: "豪门私兵封禄妥协盟约"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev4_magnate_stipend_pact: "以丰厚国库军饷收买豪门世家私兵为摄政朝廷效力，短期充实军力却助长门阀权势。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev5_viceroy_diet_compact: "诸路总督与兀鲁思御前会盟"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev5_viceroy_diet_compact: "召请诸路总督、封建大领主与兀鲁思那颜共赴御前会盟定约，不费一兵一卒稳住万里藩屏。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev5_palace_hostage_audit: "摄政御前质子与行省清丈审计"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev5_palace_hostage_audit: "强令诸路藩镇遣子入侍并严查行省财赋，令国库充盈且皇权集中，却难免引发边疆督抚怨望。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev6_parliament_regency_shield: "成文议会摄政法典与监国宪章"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev6_parliament_regency_shield: "以成文宪章规范幼主监国与太子太傅职权，彻底杜绝宫廷倾轧并赢得全国各等级信任。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev6_dynastic_co_regency: "共治皇储与中枢大宰相制"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev6_dynastic_co_regency: "册立皇室长尊共理机务并总领中枢内阁，令政令雷厉风行、帝国威仪丝毫不坠。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev7_io_industrial_league: "多边欧亚工业度量衡与精钢协约"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev7_io_industrial_league: "在国际组织成员间统一精炼钢标号、化工规程与蒸汽专利互认，带动全盟工业化与熟练市民阶层共同跃升。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev7_national_foundry_monopoly: "国家机密精钢与化工专利专卖"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev7_national_foundry_monopoly: "严禁精钢坩埚配方与铅室化工图纸外泄，以重商专卖体制牢牢锁定本国重工业暴利。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev8_maritime_meridian_standard: "本初子午线与海事天文钟同盟"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev8_maritime_meridian_standard: "以制式航海天文钟统一远洋经度海图并统筹蒸汽加煤港网，确立纵横四海的制海与商运霸权。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev8_crown_clipper_charter: "皇家特许瓷茶快船远洋商团"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev8_crown_clipper_charter: "配备精密天文钟的远洋快船队抢先运抵当季新茶与御瓷，在各大国际商埠赚取巨额头彩利润。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev9_industrial_bond_anchor: "实业精钢与蒸汽抵押国债定锚"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev9_industrial_bond_anchor: "以经过核验的精钢厂、船坞与运河关税为国家公债提供硬核实业担保，迅速平息股市恐慌并压低融资利率。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev9_overleveraged_steam_boom: "高杠杆蒸汽与精钢信贷狂潮"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev9_overleveraged_steam_boom: "放任蒸汽与精钢股份公司加杠杆融资，令全国工场建设一日千里，却也推高信贷成本与泡沫隐忧。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev10_silk_road_opportunity: "丝路武装商队与斡脱汇兑新线"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev10_silk_road_opportunity: "与河中及天山南北新立诸王签订商队护航协约，趁察合台裂解之机抢占欧亚陆上丝路白银与生丝转运厚利。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev10_maritime_silk_pivot: "南洋海上丝绸与香料航线转轨"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev10_maritime_silk_pivot: "鉴于草原内战阻滞陆上绿洲商道，朝廷果断将资本转向贯通黑海、红海与东海的远洋武装商船队。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev11_indian_ocean_port_charter: "西印度洋与红海特许商馆网络"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev11_indian_ocean_port_charter: "趁古吉拉特、德干与叙利亚诸督府离心之机签下特许商馆条约，直接打通印度洋香料与精细棉布海路。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev11_red_sea_spice_leverage: "红海与季风洋中立关税红利"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev11_red_sea_spice_leverage: "与各路割据埃米尔订立中立通商关税协定，绕开战火垄断将胡椒、丁香与珍稀织物源源引入我方口岸。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev12_rus_liberation_momentum: "罗斯诸公解枷自立洪流"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev12_rus_liberation_momentum: "萨莱汗庭动荡激起罗斯诸公抗缴岁币之志，东正教大旗与亲兵队齐聚奥卡河与伏尔加河畔，誓争全境自主。"
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev12_rus_kremlin_revival: "白石克里姆林营建与伏尔加商路复兴"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev12_rus_kremlin_revival: "将留存国内的岁币白银尽数投入白石城堡修筑、毛皮商栈与伏尔加河岸市镇营建，奠定北方强国根基。"
 oe_sy2.1.title: "小冰期寒冬与银号常平赈粮网络"
 oe_sy2.1.desc: "小冰期凛冽严霜冰封大河、令北方诸省秋收减半。所幸本朝既有银号汇兑网络与常平仓署已迅速联络南方暖港筹粮——只要朝廷愿与商帮共担信贷担保而非强行查抄民仓，便可化解迫在眉睫的寒冬饥馑。"
 oe_sy2.1.a: "担保银号跨区购粮汇票，平抑粮价安抚民心"
 oe_sy2.1.b: "钦差粮官直接统征豪强囤粮，优先保障京畿军民"
 oe_sy2.2.title: "草原白灾严霜与冬窝子牧场危机"
 oe_sy2.2.desc: "冻雨凝成的铁壳冰雪封死了从伏尔加河、锡尔河至伊犁河谷的漫漫草场。各翼部族长老急报：若大汗不及时拨银修筑背风河谷冬窝子并自绿洲采购越冬草料，开春之前数万匹战马恐将冻毙于白灾之中。"
 oe_sy2.2.a: "拨银广建背风冬窝子草料营，力保汗国战马群"
 oe_sy2.2.b: "命各万户挥师南下边镇打草谷，以战养牧"
 oe_sy2.3.title: "黄淮冰封、红巾动荡与常平义仓"
 oe_sy2.3.desc: "严寒冰凌与黄河淤堤交相肆虐中原，缺粮州县流言四起、民变暗涌。户部与御史台奏请将官办常平义仓与商号银票汇兑联动，火速放粮赈济流民、稳住河防与府州民心。"
 oe_sy2.3.a: "大开常平义仓并借商号汇兑调粮，釜底抽薪靖乱"
 oe_sy2.3.b: "授权行省都元帅府就地括征军粮，以武力镇压乱局"
 oe_sy2.4.title: "幼主摄政与豪门私兵干政"
 oe_sy2.4.desc: "值此摄政监国之际，权贵世家暗中在京畿周边集结私兵部曲。豪门使者口称护卫幼主，实则借兵威索要免税特权与封地，若不借议会与朝廷法度加以制衡，大权恐将旁落。"
 oe_sy2.4.a: "召请议会与等级大会立约监理豪门私兵"
 oe_sy2.4.b: "以国库重禄收买世家私兵将领，暂借其力维稳"
 oe_sy2.5.title: "诸路总督与封建藩镇试探摄政中枢"
 oe_sy2.5.desc: "察觉朝廷中枢正处摄政与威望承压之期，外地总督、封建领主与边疆兀鲁思首领纷纷拖延解款并暗通声气。朝廷必须在会盟怀柔与铁腕肃纪之间迅速决断，方免万里藩屏渐生离心。"
 oe_sy2.5.a: "敕召诸路总督与藩王御前会盟，重订效忠约章"
 oe_sy2.5.b: "强令诸路藩镇遣子入侍并严查行省税账"
 oe_sy2.6.title: "帝国议会护持幼主与储君教化大典"
 oe_sy2.6.desc: "依托本朝成熟议会体制与严谨储君教化传统，法学家与各等级代表提议颁行恒久摄政法典：或由成文议会监国护持幼主，或册立皇室长尊共治中枢以绝权臣觊觎。"
 oe_sy2.6.a: "颁行成文议会摄政法典，永固朝野公信"
 oe_sy2.6.b: "册立皇室共治储君与大宰相总揽枢机"
 oe_sy2.7.title: "多边国际组织精钢与化工标准协约"
 oe_sy2.7.desc: "与我国同盟的国际组织各国使节惊叹于本朝工场出产的均质精炼钢、纯碱化工品与蒸汽部件。盟国商会恳请我朝牵头制定全盟统一的工业度量衡与技术协约，而国内行会则力主严守核心工艺专利。"
 oe_sy2.7.a: "牵头在国际组织推行统一工业标准与专利互认"
 oe_sy2.7.b: "严禁精钢与化工核心技艺外传，独享重工红利"
 oe_sy2.8.title: "航海天文钟、本初子午线与远洋瓷茶同盟"
 oe_sy2.8.desc: "随着常平架航海天文钟成批出厂、蒸汽船坞日夜整备远洋巨舶，帝国海军部已具备为全球航路厘定本初子午线海图的绝对实力。海商呼吁特许瓷茶快船专航，水师名将则倡议构建跨洋海事同盟。"
 oe_sy2.8.a: "颁行本初子午线标准与远洋水师导航同盟"
 oe_sy2.8.b: "特许皇家瓷茶快船商团抢占全球商埠头彩"
 oe_sy2.9.title: "精钢债券、蒸汽股份与交易所泡沫考验"
 oe_sy2.9.desc: "资本交易所的投机狂热正与本朝战略工业大建设剧烈碰撞。经纪商将精钢厂、化工厂与运河特许权打包为高杠杆股份大肆炒作：央行重臣力主以实业营收为国债硬核定锚以防崩盘，而实业投机客则鼓吹放宽信贷加速建厂。"
 oe_sy2.9.a: "以核验精钢与运河实业营收为国债定锚，平抑泡沫"
 oe_sy2.9.b: "放开精钢与蒸汽股份高杠杆融资，全速扩张工场"
 oe_sy2.10.title: "察合台汗国裂解与欧亚丝路商道变局"
 oe_sy2.10.desc: "自撒马尔罕、阿力麻里与黑海商埠传来的急报证实：察合台兀鲁思已分裂为河中埃米尔与东察合台诸王。天山南北丝路关卡重排，既是商道阻滞之危，更是我朝抢签斡脱护航新约或转轨海上丝路之大机。"
 oe_sy2.10.a: "遣派武装商队护卫与斡脱商使重定陆上丝路税约"
 oe_sy2.10.b: "将白银与商力转投南洋与地中海海上丝绸船队"
 oe_sy2.11.title: "德里伊克塔与开罗督府动荡：印度洋与红海契机"
 oe_sy2.11.desc: "德里苏丹国地方伊克塔督府与马穆鲁克叙利亚—红海总督区的离心动荡，令古吉拉特、亚丁与亚历山大的香料垄断豁然松动。急缺白银、火炮与外交声援的地方埃米尔竞相向我方远洋商使与水师抛出丰厚商馆特许权。"
 oe_sy2.11.a: "趁机在西印度洋与红海要港设立特许商馆据点"
 oe_sy2.11.b: "与各路割据埃米尔订立中立低税香料通商协定"
 oe_sy2.12.title: "萨莱汗庭倾颓：罗斯解枷复兴之潮"
 oe_sy2.12.desc: "捷报沿顿河与伏尔加河北传：内乱与诸翼分崩已大幅削弱金帐汗国昔日不可一世的威慑。波雅尔贵族、大牧首与城镇市民云集议事厅，力请大公要么果断停缴岁币、誓师举兵解枷自立，要么将留存白银尽数投入白石克里姆林与伏尔加河商路复兴。"
 oe_sy2.12.a: "誓师停缴萨莱岁币，高举罗斯解枷自立大旗"
 oe_sy2.12.b: "将留存岁币投入白石城堡营建与伏尔加商道复兴"
