 oe_hetaireia_rum_pronoia: "罗姆普罗尼亚"
 oe_hetaireia_rum_pronoia_desc: "皇帝将指定田庄的收益授予罗姆军户，以换取定额的披甲骑手与弓马之士。受益者须自备甲马，随时听候军旗召集；这笔收入既供养其家，也维系了世代相承的骑战技艺。\n\n赫泰里亚满意度均衡#G +5%#!，阶层力量#Y +33%#!，全国税收效率#R −2.5%#!。\n图科波洛伊与罗姆甲胄骑兵改用同一时代的#Y 普罗尼亚强化型号#!，仍共用原有军营名额。撤销特权后恢复普通型号。"
 OE_RUM_PRONOIA_UPGRADE_TT: "将现有图科波洛伊和罗姆甲胄骑兵改编为同一时代的普罗尼亚强化型号，并开放对应型号的招募与时代升级；不额外增加编制名额。"
 OE_RUM_PRONOIA_DOWNGRADE_TT: "将现有普罗尼亚图科波洛伊和罗姆甲胄骑兵恢复为同一时代的普通型号。"
 oe_turcopoles_pronoia_1: "图科波洛伊弓骑兵（普罗尼亚）"
 oe_turcopoles_pronoia_1_desc: "从小亚细亚的牧场到色雷斯的驿道，罗姆骑手将弓马之技带入帝国军籍。他们披轻甲、备复合弓，在军阵两翼寻找敌人松动的瞬间。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +20%#!、士气伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!、主动性#G +3#!。"
 oe_turcopoles_pronoia_2: "图科波洛伊骑射手（普罗尼亚）"
 oe_turcopoles_pronoia_2_desc: "军营中的合练使旧日的骑射本领有了共同的号令。图科波洛伊以轮番射击扰乱敌阵，再借轻捷的战马脱离追击。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +20%#!、士气伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!、主动性#G +3#!。"
 oe_turcopoles_pronoia_3: "图科波洛伊轻枪骑兵（普罗尼亚）"
 oe_turcopoles_pronoia_3_desc: "面对愈发严整的步兵方阵，骑手们增添了轻矛。他们仍以侦察和袭扰为先，只在侧翼出现破绽时投身冲击。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +20%#!、士气伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!、主动性#G +3#!。"
 oe_turcopoles_pronoia_4: "图科波洛伊火绳枪骑兵（普罗尼亚）"
 oe_turcopoles_pronoia_4_desc: "火绳枪的烟火开始取代一部分弓弦的轻响。图科波洛伊学习携枪驰骋、下马射击，在远行与交锋之间保留轻骑兵的敏捷。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +20%#!、士气伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!、主动性#G +3#!。"
 oe_turcopoles_pronoia_5: "图科波洛伊卡宾枪骑兵（普罗尼亚）"
 oe_turcopoles_pronoia_5_desc: "统一配发的卡宾枪、马刀与鞍具使这些骑队更加整齐。他们守护军队的视野，袭击敌人的补给，并在追击中扩大胜果。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +20%#!、士气伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!、主动性#G +3#!。"
 oe_turcopoles_pronoia_6: "图科波洛伊猎骑兵（普罗尼亚）"
 oe_turcopoles_pronoia_6_desc: "古老的图科波洛伊之名如今由训练有素的猎骑兵继承。他们以散开的队形遮蔽大军行踪，在战线破裂时迅速追入敌后。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +20%#!、士气伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!、主动性#G +3#!。"
 oe_rum_cataphracts_pronoia_1: "罗姆链甲骑兵（普罗尼亚）"
 oe_rum_cataphracts_pronoia_1_desc: "罗姆军户将战马、长矛与代代修补的链甲带到帝国军旗下。他们以密集的骑阵接敌，愿以甲胄承受迎面的箭矢，为身后的同袍打开道路。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：所受兵力伤害#G −10%#!、兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!；使用昂贵重骑兵的征募和维护物资，不再承受普通型号的移动速度惩罚。"
 oe_rum_cataphracts_pronoia_2: "罗姆甲胄骑兵（普罗尼亚）"
 oe_rum_cataphracts_pronoia_2_desc: "军营将各家自备的甲马编成统一的队列。骑手在号角声中压住步调，让枪尖与马蹄同时抵达敌阵。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：所受兵力伤害#G −10%#!、兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!；使用昂贵重骑兵的征募和维护物资，不再承受普通型号的移动速度惩罚。"
 oe_rum_cataphracts_pronoia_3: "罗姆重装枪骑兵（普罗尼亚）"
 oe_rum_cataphracts_pronoia_3_desc: "长枪愈发坚固，队列愈发严整。罗姆重骑不再轻率追逐溃散的散兵，而是等待步兵牵住敌阵，再以完整的骑队发动冲击。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：所受兵力伤害#G −10%#!、兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!；使用昂贵重骑兵的征募和维护物资，不再承受普通型号的移动速度惩罚。"
 oe_rum_cataphracts_pronoia_4: "罗姆重装手枪骑兵（普罗尼亚）"
 oe_rum_cataphracts_pronoia_4_desc: "手枪与马刀进入骑手的装备，旧日的勇武开始服从距离与时机的计算。披甲的骑兵在近处开火，继而以刀锋接续冲击。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：所受兵力伤害#G −10%#!、兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!；使用昂贵重骑兵的征募和维护物资，不再承受普通型号的移动速度惩罚。"
 oe_rum_cataphracts_pronoia_5: "罗姆胸甲骑兵（普罗尼亚）"
 oe_rum_cataphracts_pronoia_5_desc: "繁重的全身甲逐渐让位于坚实的胸甲。罗姆骑队保留了正面突击的职责，却以更加统一的操典与行装适应新的战场。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：所受兵力伤害#G −10%#!、兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!；使用昂贵重骑兵的征募和维护物资，不再承受普通型号的移动速度惩罚。"
 oe_rum_cataphracts_pronoia_6: "罗姆近卫胸甲骑兵（普罗尼亚）"
 oe_rum_cataphracts_pronoia_6_desc: "数百年的甲骑传统凝聚为近卫胸甲骑兵的荣誉。他们被留在决战的关键时刻投入，以整齐而沉重的冲击打破敌军最后的抵抗。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：所受兵力伤害#G −10%#!、兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!；使用昂贵重骑兵的征募和维护物资，不再承受普通型号的移动速度惩罚。"
