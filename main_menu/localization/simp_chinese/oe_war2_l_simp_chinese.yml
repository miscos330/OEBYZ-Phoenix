 oe_war2_u_stratiotai_phalanx:0 "拜占庭军区农兵重矛方阵征召兵"
 oe_war2_u_stratiotai_phalanx_desc:0 "承袭罗马军区耕战传统的重矛盾墙农兵，结阵固守时极难动摇。"
 oe_war2_levy_byz_stratiotai_phalanx:0 "拜占庭军区农兵重矛方阵征召兵"
 oe_war2_u_ming_weisuo_wagon:0 "大明卫所车营征召兵"
 oe_war2_u_ming_weisuo_wagon_desc:0 "源自军屯卫所世兵的车营战阵，以偏厢战车连环结垒、配合长枪火器克制骑兵突击。"
 oe_war2_levy_ming_weisuo_wagon:0 "大明卫所车营征召兵"
 oe_war2_u_steppe_mangudai:0 "草原曼古歹旗队征召兵"
 oe_war2_u_steppe_mangudai_desc:0 "由草原部族与旗领贵族编组的精锐弓骑旗队，最擅佯退诱敌与两翼疾速包抄。"
 oe_war2_levy_steppe_mangudai:0 "草原曼古歹旗队征召兵"
 oe_war2_u_ottoman_timariot:0 "奥斯曼蒂玛尔西帕希征召兵"
 oe_war2_u_ottoman_timariot_desc:0 "依蒂玛尔封邑军役出征的重甲行省西帕希骑兵，兼具冲锋爆发力与久战韧性。"
 oe_war2_levy_ottoman_timariot:0 "奥斯曼蒂玛尔西帕希征召兵"
 oe_war2_rec_imperial_colony_roster:0 "帝国军屯世兵募训法"
 oe_war2_rec_imperial_colony_roster_desc:0 "依世袭边疆军屯户籍精选壮丁成军：征募周期略长，但新团出营即具 25 点实战经验。"
 oe_war2_rec_continental_mass_cadre:0 "大陆总动员骨干快募法"
 oe_war2_rec_continental_mass_cadre_desc:0 "依托全国征兵库与预备骨干快速扩军：招募耗时缩减四成，新团以七成五编制先行开拔。"
 oe_war2_form_spanish_tercio:0 "西班牙大方阵（长矛火铳阵）"
 oe_war2_form_spanish_tercio_desc:0 "厚重长矛重步兵稳居中军与两翼，外围火铳散兵与野战炮组协同施射，攻守一体。"
 oe_war2_form_mandarin_duck_array:0 "大明鸳鸯阵（步器协同阵）"
 oe_war2_form_mandarin_duck_array_desc:0 "长短兵器步兵结成互保鸳鸯小队遍布中军与两翼，辅以中军轻炮支援，极擅步战绞杀。"
 oe_war2_form_steppe_feigned_crescent:0 "草原佯退合围新月阵"
 oe_war2_form_steppe_feigned_crescent_desc:0 "中军轻骑佯退诱敌深入，两翼压倒性轻重骑兵如新月双角疾速包抄敌军侧背。"
 oe_war2_form_line_infantry_volley:0 "线列步兵横队齐射阵"
 oe_war2_form_line_infantry_volley_desc:0 "广袤横队尽展火枪齐射火力正面，中军集中重炮轰击破阵，重骑护卫两翼防备突袭。"
 oe_war2_ua_fortify_wagon_laager:0 "结设偏厢战车壁垒"
 oe_war2_ua_fortify_wagon_laager_desc:0 "命部队停止行军并以战车连环结营为垒，以静止机动换取高额纪律、士气恢复与损耗减免。"
 oe_war2_ua_volley_fire_drill:0 "火器轮番齐射战备"
 oe_war2_ua_volley_fire_drill_desc:0 "令步兵按分段轮射法展开严整齐射，以更高军需耗费与行军减速换取凌厉步兵火力与纪律。"
 oe_war2_ua_commerce_raider_sweep:0 "破交巡洋与封港扫荡"
 oe_war2_ua_commerce_raider_sweep_desc:0 "散遣轻型战舰与快速巡洋分舰队破交封港，显著提升轻舰战力、航速与封锁效率，但增损耗与军费。"
 oe_war2_ua_imperial_forced_march:0 "帝国昼夜急行军"
 oe_war2_ua_imperial_forced_march_desc:0 "督催野战军团昼夜兼程疾驰转进，大幅提速并抢占先机，代价为更高行军损耗与士气恢复减缓。"
 oe_war2_pt_open_treaty_ports:0 "强制开放条约通商口岸"
 oe_war2_pt_open_treaty_ports_desc:0 "迫使败方沿海国家开放条约通商口岸并给予胜方商馆特权 20 年，条件允许时同步缔结条约口岸特许关系。"
 oe_war2_pt_open_treaty_ports_entry:0 "强制开放沿海条约通商口岸与商馆特权（持续 20 年）"
 oe_war2_pt_open_treaty_ports_entry_short:0 "强制开埠通商"
 oe_war2_pt_installment_reparations:0 "分期战争赔款协约"
 oe_war2_pt_installment_reparations_desc:0 "即刻征收有上限的现银首付并订立 15 年分期赔款计划，持续充实胜方财政并压制败方税入。"
 oe_war2_pt_installment_reparations_entry:0 "征收现银首付并订立 15 年分期战争赔款"
 oe_war2_pt_installment_reparations_entry_short:0 "分期战争赔款"
 oe_war2_pt_raze_border_forts:0 "拆毁边境要塞防线"
 oe_war2_pt_raze_border_forts_desc:0 "责令败方物理拆毁至多两处要塞据点的防御建筑，并在 15 年内限制其边疆复筑工事。"
 oe_war2_pt_raze_border_forts_entry:0 "物理拆毁败方至多 2 处要塞防御工事并压制边防 15 年"
 oe_war2_pt_raze_border_forts_entry_short:0 "拆毁边境要塞"
 oe_war2_pt_seize_royal_manuscripts:0 "收缴王室秘库典籍与名作"
 oe_war2_pt_seize_royal_manuscripts_desc:0 "将败方品质最高的 1 件非无价传世珍品物理迁入胜方首都并大振科研文教 15 年，但亦会埋下敌国索还文物的复仇契机。"
 oe_war2_pt_seize_royal_manuscripts_entry:0 "将败方 1 件顶级非无价名作迁入我方首都并获 15 年秘库学术增益"
 oe_war2_pt_seize_royal_manuscripts_entry_short:0 "收缴王室典籍"
 oe_war2_pt_impose_court_language:0 "推行天朝正音宫廷语"
 oe_war2_pt_impose_court_language_desc:0 "迫使败国改以胜方御用宫廷语作为朝廷正音与外交文书语言，并在 20 年内大幅提升胜方文化影响力。"
 oe_war2_pt_impose_court_language_entry:0 "迫使败国改行我朝宫廷正音并获 20 年文化威势增益"
 oe_war2_pt_impose_court_language_entry_short:0 "强制改行宫廷语"
 oe_war2_pt_demilitarize_navy:0 "海军吨位限制条约"
 oe_war2_pt_demilitarize_navy_desc:0 "以和约严限败方造舰速度、水兵池与海军维护效率 20 年，同时巩固胜方海上主力舰霸权。"
 oe_war2_pt_demilitarize_navy_entry:0 "强加 20 年海军吨位限制条约以遏制败方舰队规模"
 oe_war2_pt_demilitarize_navy_entry_short:0 "海军吨位限制"
 oe_war2_pt_break_coalition_oath:0 "解散敌对同盟誓约"
 oe_war2_pt_break_coalition_oath_desc:0 "强令败方即刻解除与我方宿敌及列强之间的同盟关系，并使其蒙受 15 年外交孤立、大振胜方和会威望。"
 oe_war2_pt_break_coalition_oath_entry:0 "解除败方敌对强援同盟并施以 15 年合纵禁令"
 oe_war2_pt_break_coalition_oath_entry_short:0 "解散敌对同盟"
 oe_war2_pt_guarantee_pilgrim_passage:0 "保障圣地朝圣安全通行"
 oe_war2_pt_guarantee_pilgrim_passage_desc:0 "责令败方在 20 年内保障圣地朝圣商道畅通并奉行宗教宽容，同时提升胜方宗教影响与外交声望。"
 oe_war2_pt_guarantee_pilgrim_passage_entry:0 "保障 20 年圣地朝圣通行权与教民宽容条款"
 oe_war2_pt_guarantee_pilgrim_passage_entry_short:0 "圣地朝圣通行"
 oe_war2_pt_silk_corridor_toll_free:0 "丝路与铁道免税走廊"
 oe_war2_pt_silk_corridor_toll_free_desc:0 "令胜方陆路商队与铁道货运在败方境内享有 20 年过境免税特权，大幅促进大陆商贸与干线畅通。"
 oe_war2_pt_silk_corridor_toll_free_entry:0 "开辟 20 年过境免税丝路与铁道陆运走廊"
 oe_war2_pt_silk_corridor_toll_free_entry_short:0 "免税丝路走廊"
 oe_war2_pt_release_tributary_buffer:0 "划立中立缓冲国宪章"
 oe_war2_pt_release_tributary_buffer_desc:0 "以 10 年互不侵犯停战协定担保划立中立缓冲地带，遏制敌方再度扩张并换取边疆持久安宁。"
 oe_war2_pt_release_tributary_buffer_entry:0 "划立中立缓冲宪章并缔结 10 年互保停战与 20 年边疆担保"
