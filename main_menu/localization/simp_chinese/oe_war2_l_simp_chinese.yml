 oe_war2_cb_open_ports_war:0 "强开商埠通商战争"
 oe_war2_cb_open_ports_war_PROV:0 "迫使沿海国家开放条约通商口岸的海上商战"
 oe_war2_cb_open_ports_war_desc:0 "敌方沿海强邦闭关锁港、排斥我方商船。我方水师将兵临城下，迫其开放条约通商口岸与互惠税则。"
 oe_war2_cb_recover_heritage:0 "索还被掠传世文物战争"
 oe_war2_cb_recover_heritage_PROV:0 "收复被掠王室典籍与传世名作的正义之师"
 oe_war2_cb_recover_heritage_desc:0 "本朝原产之传世名作或秘库典籍蒙尘于异邦宫室。王师出征，誓将国宝故物悉数迎回。"
 oe_war2_cb_defend_buffer:0 "保卫中立缓冲国战争"
 oe_war2_cb_defend_buffer_PROV:0 "维护边境中立缓冲宪章的武装干预"
 oe_war2_cb_defend_buffer_desc:0 "穷兵黩武的强邻破坏边境中立缓冲秩序。作为宪章担保方，我方将出兵重申边疆均势。"
 oe_war2_cb_enforce_balance:0 "维护列强均势战争"
 oe_war2_cb_enforce_balance_PROV:0 "遏制霸权扩张、重塑欧亚列强均势的联军之战"
 oe_war2_cb_enforce_balance_desc:0 "某超级列强威逼四海、倾覆万国均势。我朝谨以均势卫士之名兴兵讨逆，迫其重归多极秩序。"
