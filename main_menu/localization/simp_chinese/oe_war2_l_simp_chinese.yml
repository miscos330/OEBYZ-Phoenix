 oe_war2.1.title:0 "长矛与火铳：西班牙大方阵操典"
 oe_war2.1.desc:0 "饱经欧陆血战的元帅们编成新式长矛火铳合成操典：密林般的长矛重步兵稳立中军以抗铁骑冲锋，四角火绳枪散兵与随阵野战炮则交织火力，令步兵方阵化作移动堡垒。"
 oe_war2.1.a:0 "夯实重矛铁壁方阵"
 oe_war2.1.b:0 "扩编火铳散兵翼与野战炮组"
 oe_war2.2.title:0 "十二人互保：大明鸳鸯阵新策"
 oe_war2.2.desc:0 "历练海防与山地实战的宿将奏请编练十二人鸳鸯小队：藤牌居前、狼筅遮蔽、长枪纵刺、镋钯殿后，长短兵器相生相护，纵遇悍寇亦进退如一。"
 oe_war2.2.a:0 "全军推广鸳鸯小队协同战法"
 oe_war2.2.b:0 "以鸳鸯阵整饬沿海卫所乡兵"
 oe_war2.3.title:0 "卫所军屯与偏厢车营壁垒"
 oe_war2.3.desc:0 "北疆监军奏报：以铁叶偏厢战车连环结营，可使旷野顷刻化作坚城；若再配合三分守城、七分屯种的军屯卫所，纵然万里远征亦可兵精粮足、不竭民财。"
 oe_war2.3.a:0 "定型全军偏厢战车结营条令"
 oe_war2.3.b:0 "广辟边疆耕战军屯卫所"
 oe_war2.4.title:0 "草原曼古歹新月与蒂玛尔铁骑大阅"
 oe_war2.4.desc:0 "秋高马肥之际，草原弓骑旗队与行省重甲西帕希齐聚大阅：中军佯退诱敌、两翼疾驰合围的新月战法与重骑凿阵相得益彰，震动四境。"
 oe_war2.4.a:0 "精研轻骑佯退新月合围战法"
 oe_war2.4.b:0 "严核行省西帕希封邑马政"
 oe_war2.5.title:0 "军区农兵重矛方阵与世袭军籍复兴"
 oe_war2.5.desc:0 "诸军区将军翻检古典兵书，奏请重修世袭军屯户籍册：授田于兵、寓兵于农，既可编组坚不可摧的重矛盾墙方阵，又能以精锐老兵坐镇边州。"
 oe_war2.5.a:0 "复兴军区重矛盾墙操演"
 oe_war2.5.b:0 "编订全国军屯世袭军籍册"
 oe_war2.6.title:0 "线列步兵齐射与大陆总动员体制"
 oe_war2.6.desc:0 "近代列强争霸已非昔日王朝小规模雇佣军所能胜任。总参谋部就建军国策展开激辩：或精炼燧发枪横队分段齐射与重炮协同，或广设全国征兵库推行大陆总动员。"
 oe_war2.6.a:0 "精训线列步兵分段齐射与炮阵"
 oe_war2.6.b:0 "建置大陆总动员常备骨干团"
 oe_war2.7.title:0 "条约商埠与欧亚免税通商大宪章"
 oe_war2.7.desc:0 "礼炮轰鸣回荡于金色港湾，诸国全权使节交换加盖火漆印信的通商大宪章。石砌海关栈房、条约商埠与欧亚免税陆运干线正将万邦财货源源引入我方市集。"
 oe_war2.7.a:0 "兴设条约港海关总署与商馆"
 oe_war2.7.b:0 "扩建欧亚丝路与铁道免税联运站"
 oe_war2.8.title:0 "赔款议定书与多边均势和会"
 oe_war2.8.desc:0 "绒布长桌旁，各国使节逐条核算分期战争赔款并签字废除敌对合纵盟约。如何善用此次和会胜果，将决定未来数十年我朝财政信誉与外交主导地位。"
 oe_war2.8.a:0 "设立战争赔款偿债与兴建专库"
 oe_war2.8.b:0 "常设列强和会多边外交书记处"
 oe_war2.9.title:0 "边疆要塞拆毁与定界勘防"
 oe_war2.9.desc:0 "工兵与外交勘界专员共同核验敌境被拆毁的边疆要塞残垣。值此明文划界之际，军机处斟酌应大力强化攻城爆破部队，抑或趁机整顿本国要塞戍防体系。"
 oe_war2.9.a:0 "总结破垒实务精研攻城工兵"
 oe_war2.9.b:0 "借定界之机固守本国边防险隘"
 oe_war2.10.title:0 "王室秘库典籍与天朝宫廷正音"
 oe_war2.10.desc:0 "一箱箱金饰典籍、星象舆图与和约御宝运抵京师，多国宫廷亦开始奉行我朝正音行文。朝中鸿儒与礼部使臣纷纷建言，宜借此盛举永固本朝文教与外交霸权。"
 oe_war2.10.a:0 "敕建皇家秘库典籍舆图总馆"
 oe_war2.10.b:0 "广设译馆推广外交正音文书"
 oe_war2.11.title:0 "海洋吨位公约与破交巡洋战策"
 oe_war2.11.desc:0 "海军武官签署震动海疆的战舰吨位比例公约。海军部权衡今后建军方向：是按约打造精良重舰主力战列线，还是广造快速巡洋轻舰执掌破交封锁。"
 oe_war2.11.a:0 "依吨位标准打造精锐重舰主力"
 oe_war2.11.b:0 "编组快速破交巡洋分舰队"
 oe_war2.12.title:0 "圣地朝圣通衢与中立缓冲宪章"
 oe_war2.12.desc:0 "持火漆通关符节的朝圣商队在各国使团旗帜护送下，安然穿越新近划立的中立缓冲隘口。无论以圣地护法还是大陆均势计，此约皆为边境铸就长治久安之基。"
 oe_war2.12.a:0 "兴办圣地朝圣驿馆与护送团"
 oe_war2.12.b:0 "以列强协约永固中立缓冲均势"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_ports_winner:0 "强制开埠条约港特权"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_ports_winner:0 "凭和约开辟的条约通商口岸与低税商馆使我方商船直抵敌方腹心海港，海贸收益大增。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_ports_loser:0 "被迫开埠与关税让渡"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_ports_loser:0 "沿海口岸被迫向胜方商馆开放并让渡贸易壁垒，本国市民颇有怨言，但外来技艺亦随之流入。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_reparations_winner:0 "分期战争赔款入库"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_reparations_winner:0 "敌国按和约如期解缴的分期战争赔款源源充实国库，既助战后兴作又扬国家威望。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_reparations_loser:0 "分期战争赔款重负"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_reparations_loser:0 "连年履约偿付分期战争赔款使税入拮据、国库承压，国内安定维系成本同步攀升。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_forts_winner:0 "敌境边防拆毁威慑"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_forts_winner:0 "敌国边境要塞奉约拆除，我方攻城工兵士气高昂，边疆战略态势尽归我手。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_forts_loser:0 "边疆要塞奉约拆毁"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_forts_loser:0 "和约勒令拆除边疆要塞并限制复建，使边防体系洞开且残留堡垒维系成本剧增。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_manuscripts_winner:0 "御库典籍与珍宝入藏"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_manuscripts_winner:0 "战后押运入京的敌国王室典籍、秘图与传世名作大兴本朝文教，令识字与学术突飞猛进。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_manuscripts_loser:0 "御库典籍被夺之耻"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_manuscripts_loser:0 "累世珍藏的典籍与名作被迫交割他国，朝野文化自尊受创，复仇索还之心日炽。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_language_winner:0 "天朝正音宫廷语威势"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_language_winner:0 "迫使败国改以我朝御用宫廷语行文议政，令本朝文化影响力与外交声望广播四方。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_language_loser:0 "被迫改行外国宫廷语"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_language_loser:0 "被迫在宫廷与文书中改用胜方语言虽损及外交颜面，却也在无意间加快了外来思潮传入。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_navy_cap_winner:0 "海军吨位限制条约主导权"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_navy_cap_winner:0 "以条约锁死敌国主力舰吨位与造舰规模，令我方重舰纵横海疆、水师传统高涨。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_navy_cap_loser:0 "被迫签署海军吨位限制"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_navy_cap_loser:0 "条约严限主力舰造舰吨位与船坞产能，令水师规模受挫、水兵征募与维系雪上加霜。"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_coalition_winner:0 "瓦解敌对同盟盟誓"
