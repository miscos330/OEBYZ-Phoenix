 oe_hetaireia_elite_selection: "赫泰里亚：精锐化选拔"
 oe_hetaireia_elite_selection_desc: "将有限的编制交给最适合执盾守阵的人。严格的体魄、纪律与协同考核，使军营中的赫泰里亚成为可托付战线的精锐。\n\n赫泰里亚重步兵额外获得：所受兵力伤害、所受士气伤害各 #G -5%#!。"
