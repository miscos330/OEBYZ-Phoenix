 oe_hi_revoke_military_band: "赫泰里亚特权调整：军乐队"
 oe_hetaireia_medical_corps: "赫泰里亚：医护编队"
 oe_hetaireia_medical_corps_desc: "为各队配置熟悉创伤救治的医者、担架手与药箱。及时救护能够挽回生命，也让仍在阵前的同袍明白，他们不会被遗弃。\n\n赫泰里亚重步兵额外获得：所受兵力伤害、所受士气伤害各 #G -10%#!。"
