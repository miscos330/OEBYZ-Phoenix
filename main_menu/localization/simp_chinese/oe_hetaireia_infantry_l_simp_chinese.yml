 oe_hetaireia_cultural_education: "赫泰里亚：文化教育"
 oe_hetaireia_cultural_education_desc: "赫泰里亚不应只会举盾挥剑。希腊语与拉丁语使他们理解帝国的法令，乐理和数学训练秩序与推算，实战军事则让学识经得起战场的检验。\n\n赫泰里亚重步兵额外获得：主动性 #G +5#!、兵力伤害 #G +5%#!。"
 oe_hi_grant_cultural_education: "赫泰里亚特权调整：文化教育"
 oe_hi_revoke_cultural_education: "赫泰里亚特权调整：文化教育"
 oe_hetaireia_path_to_glory: "赫泰里亚：荣耀之路"
 oe_hetaireia_path_to_glory_desc: "让战功与学识为士兵打开帝国中枢的大门。经受选拔和教育的赫泰里亚，既能在军旗之下指挥同袍，也能在御前参与国政。\n\n赫泰里亚重步兵额外获得：兵力伤害 #G +15%#!。"
