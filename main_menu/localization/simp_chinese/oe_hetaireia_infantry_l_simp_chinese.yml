 oe_hi_revoke_path_to_glory: "赫泰里亚特权调整：荣耀之路"
 oe_hetaireia_military_band: "赫泰里亚：军乐队"
 oe_hetaireia_military_band_desc: "铜号传令，鼓点齐步。随军乐手使行军井然有序，在交锋时维系勇气，也让帝国的乐声传遍驻军的城镇。\n\n赫泰里亚重步兵额外获得：士气伤害 #G +20%#!、移动速度 #G +0.2#!。"
