# Project Phoenix v59.0 (Worker 5): World Town Charters, Universal Character Interactions, Cross-Civilization Unit Abilities & Global Hegemon Edicts (prefix: oe_v59_w5_). Generated by gen_v590_world_town_rights_chars_hegemons_abilities.py; edit the generator, not this file.
 oe_v59_w5_tr_roman_civitas: "罗马自治城邦特许状"
 oe_v59_w5_tr_roman_civitas_desc: "复兴帝国自治城邦（Civitas）的市政议事会与罗马市政法传统。受特许的市政机构可提升本地控制力、阶层晋升速度与文化传统，但部分地方权力将由王室官吏让渡给市民阶层。"
 oe_v59_w5_tr_silk_caravanserai: "丝路绿洲商队驿站特许状"
 oe_v59_w5_tr_silk_caravanserai_desc: "在内陆绿洲城镇特许兴建带城墙的商队驿馆、坎儿井水利与丝路保税货栈。受保护的商队宿站可显著增强市场通达度、商人容量与城镇繁荣，但王室对当地的直接控制力将有所削弱。"
 oe_v59_w5_tr_maritime_comune: "海上公社与兵工厂特许状"
 oe_v59_w5_tr_maritime_comune_desc: "在地中海港口确立自治海上公社章程，统筹公共船台、缆索坊与海军兵工厂。标准化造船体系显著加快造船速度、改善港口条件并强化制海权，同时使市民船东压倒地方贵族势力。"
 oe_v59_w5_tr_fangshi_guild: "东亚坊市行会特许状"
 oe_v59_w5_tr_fangshi_guild_desc: "承袭东亚坊市与市镇行会传统，特许设立规整的商贸坊区与手工业行会。此项特许扩大市场建筑上限、提高工坊生产效率并加速城镇发展，但行会规制会适度收紧农民的自由度。"
 oe_v59_w5_tr_waqf_madrasa: "伊斯兰瓦克夫与经学院城市特许状"
 oe_v59_w5_tr_waqf_madrasa_desc: "以永久宗教慈善基金（瓦克夫）保障经学院、抄经馆、医院与公共水渠的运转。此特许状持续提升本地识字率上限与思潮传播速度，但受托管理的城市资产将显著增强教士阶层的影响力。"
 oe_v59_w5_tr_mongol_yam_hub: "蒙古站赤驿传枢纽特许状"
 oe_v59_w5_tr_mongol_yam_hub_desc: "将城镇钦定为帝国站赤驿道枢纽，常备换乘驿马、信使营舍与应急粮储。完善的驿传网络可在广袤草原上强化中央控制、提升市场通达与储粮能力，但驿站徭役将压制本地市民自治权。"
 oe_v59_w5_tr_cossack_sloboda: "哥萨克自由边镇特许状"
 oe_v59_w5_tr_cossack_sloboda_desc: "向边疆哥萨克与自由垦殖村镇（斯洛博达）颁授免税与武装自卫特许权。该特许状能吸引边疆移民、充实本地兵源并加固木栅防务，但代价是中央王室对当地的直接权威明显下降。"
 oe_v59_w5_tr_swahili_entrepot: "斯瓦希里珊瑚石转口港特许状"
 oe_v59_w5_tr_swahili_entrepot_desc: "特许印度洋季风航线上的珊瑚石海港城镇作为转口贸易中心，联通阿拉伯单桅帆船与内陆黄金象牙商路。该特许状改善良港条件、提升商人吞吐量与城镇繁荣，并壮大沿海商贾世家。"
 oe_v59_w5_tr_indian_guild_temple: "印度行会与神庙城镇特许状"
 oe_v59_w5_tr_indian_guild_temple_desc: "承认世袭商工行会（Shreni）与大神庙库藏共治市镇的联合特许状。此特许状提升手工业与纺织生产效率、扩大商贸往来与文化影响力，同时使地方财富汇聚于教士与商贾阶层。"
 oe_v59_w5_tr_hanseatic_kontor: "汉萨与波罗的海商馆特许状"
 oe_v59_w5_tr_hanseatic_kontor_desc: "依北方商业同盟法典与海港衡器章程设立带防御设施的商馆（Kontor）。该特许状显著扩增市场建筑上限、提高商人贸易力量与波罗的海海权，并使市民参议会压制封建贵族。"
 oe_v59_w5_tr_royal_audiencia: "殖民地皇家审理院特许状"
 oe_v59_w5_tr_royal_audiencia_desc: "在新大陆城镇设立皇家审理院（Audiencia）与殖民地市政议会。该特许状可稳步提升边疆控制力、吸引移民定居并加快阶层晋升，同时将地方大权收归王室法曹而非私营商贾。"
 oe_v59_w5_tr_enlightenment_free_port: "启蒙自由港与交易所特许状"
 oe_v59_w5_tr_enlightenment_free_port_desc: "自1648年起可颁行，宣布该海港为免税国际自由港，设立开放出版区与海事保险交易所。此特许状大幅加速思潮传播、识字增长与国际贸易吞吐，但显著削弱王室对港市的直接统辖。"
 oe_v59_w5_ci_imperial_adoption: "过继贤嗣与立储大典"
 oe_v59_w5_ci_imperial_adoption_concept: "[heir|e]"
 oe_v59_w5_ci_imperial_adoption_act: "$oe_v59_w5_ci_imperial_adoption$"
 oe_v59_w5_ci_imperial_adoption_desc: "效仿罗马五贤帝与历代宗法过继旧制，将一位才德兼备的成年忠臣正式收为养子纳入皇室宗谱，并钦定为王位继承人。消耗#Y 50#!金币与#Y 15#!政体正统度（冷却10年）。"
 oe_v59_w5_ci_imperial_adoption_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将被正式过继入本朝王室宗族，并受封为钦定继承人。"
 oe_v59_w5_ci_imperial_adoption_past: "已行过继立储之礼"
 oe_v59_w5_ci_imperial_adoption_act_past: "[SCOPE.sCharacter('recipient').GetName]已被正式过继入王室并确立为钦定继承人。"
 oe_v59_w5_ci_imperial_adoption_no_candidate: "@trigger_no! 朝中暂无忠诚且三围总和不低于150的成年人选可供过继立储。"
 oe_v59_w5_ci_imperial_adoption_cd_tt: "过去10年内未举行过过继立储大典。"
 oe_v59_w5_ci_sponsor_treatise: "资助编纂传世典籍与格物论著"
 oe_v59_w5_ci_sponsor_treatise_concept: "[character|e]"
 oe_v59_w5_ci_sponsor_treatise_act: "$oe_v59_w5_ci_sponsor_treatise$"
 oe_v59_w5_ci_sponsor_treatise_desc: "拨付国库经费资助博学廷臣或学者撰修传世史书或科学典籍。可即时推进科研进度、提升威望并开启十年学术增益，同时赋予学者终身荣誉。消耗#Y 75#!金币（冷却8年）。"
 oe_v59_w5_ci_sponsor_treatise_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将在国家资助下编纂传世史志与科学论著。"
 oe_v59_w5_ci_sponsor_treatise_past: "传世典籍编纂告成"
 oe_v59_w5_ci_sponsor_treatise_act_past: "[SCOPE.sCharacter('recipient').GetName]已完成传世典籍与科学论著，惠及国朝文教。"
 oe_v59_w5_ci_sponsor_treatise_no_candidate: "@trigger_no! 朝中暂无行政或外交不低于55（或身为艺术家）且尚未获此殊荣的成年人选。"
 oe_v59_w5_ci_sponsor_treatise_cd_tt: "过去8年内未资助过传世典籍编纂。"
 oe_v59_w5_ci_ennoble_war_hero: "册封军功名将"
 oe_v59_w5_ci_ennoble_war_hero_concept: "[character|e]"
 oe_v59_w5_ci_ennoble_war_hero_act: "$oe_v59_w5_ci_ennoble_war_hero$"
 oe_v59_w5_ci_ennoble_war_hero_desc: "以世袭爵位、仪仗兵甲与御赐军功章褒奖战功卓著的统帅或悍将。可提升陆军传统与贵族满意度，并永久强化受封将领的军事统御。消耗#Y 50#!金币与#Y 10#!威望（冷却5年）。"
 oe_v59_w5_ci_ennoble_war_hero_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将因卓著战功获封爵位，显著强化其战场指挥能力。"
 oe_v59_w5_ci_ennoble_war_hero_past: "名将受爵封赏"
 oe_v59_w5_ci_ennoble_war_hero_act_past: "[SCOPE.sCharacter('recipient').GetName]因赫赫战功获颁爵位与军功殊荣。"
 oe_v59_w5_ci_ennoble_war_hero_no_candidate: "@trigger_no! 朝中暂无在任将领、海军提督或军事不低于60的成年人选可供册封。"
 oe_v59_w5_ci_ennoble_war_hero_cd_tt: "过去5年内未曾册封过军功名将。"
 oe_v59_w5_ci_frontier_governor: "敕授边疆军区节度总督"
 oe_v59_w5_ci_frontier_governor_concept: "[character|e]"
 oe_v59_w5_ci_frontier_governor_act: "$oe_v59_w5_ci_frontier_governor$"
 oe_v59_w5_ci_frontier_governor_desc: "钦命干练统帅出任边防军区总督（如军区将军、节度使、边疆伯或镇守贝伊），统筹边堡防务与地方绥靖。可在十年内强化全国防御、控制与人力，但需承担额外驻军开支。消耗#Y 60#!金币（冷却8年）。"
 oe_v59_w5_ci_frontier_governor_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将奉命节制边疆军区，巩固边防要塞与地方秩序。"
 oe_v59_w5_ci_frontier_governor_past: "边疆节度总督已赴任"
 oe_v59_w5_ci_frontier_governor_act_past: "[SCOPE.sCharacter('recipient').GetName]已获敕授边疆军区总督之职，督办边防。"
 oe_v59_w5_ci_frontier_governor_no_candidate: "@trigger_no! 朝中暂无军事或行政不低于50（或在任陆军将领）的成年人选可派任边督。"
 oe_v59_w5_ci_frontier_governor_cd_tt: "过去8年内未委任过边疆军区总督。"
 oe_v59_w5_ci_honorable_retirement: "致仕归隐与荣休清修"
 oe_v59_w5_ci_honorable_retirement_concept: "[character|e]"
 oe_v59_w5_ci_honorable_retirement_act: "$oe_v59_w5_ci_honorable_retirement$"
 oe_v59_w5_ci_honorable_retirement_desc: "赐予闲置廷臣或宗室旁支丰厚荣休奉禄，令其体面退隐修院、寺院或乡间别业。此举可和平解除其继位资格与入阁领兵之权，同时提升国家稳定、威望与教士满意度。消耗#Y 30#!金币（冷却5年）。"
 oe_v59_w5_ci_honorable_retirement_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将体面致仕归隐修院或田庄，从此不问朝政与继位之事。"
 oe_v59_w5_ci_honorable_retirement_past: "廷臣体面致仕归隐"
 oe_v59_w5_ci_honorable_retirement_act_past: "[SCOPE.sCharacter('recipient').GetName]已领受荣休恩典，退隐清修。"
 oe_v59_w5_ci_honorable_retirement_no_candidate: "@trigger_no! 朝中暂无未任内阁与军职的成年廷臣可供安排致仕荣休。"
 oe_v59_w5_ci_honorable_retirement_cd_tt: "过去5年内未安排过致仕荣休。"
 oe_v59_w5_ci_grand_diplomatic_envoy: "遣使出访与全权大外交官"
 oe_v59_w5_ci_grand_diplomatic_envoy_concept: "[character|e]"
 oe_v59_w5_ci_grand_diplomatic_envoy_act: "$oe_v59_w5_ci_grand_diplomatic_envoy$"
 oe_v59_w5_ci_grand_diplomatic_envoy_desc: "授命能言善辩的重臣持国书全权出使列邦，广结盟好并斡旋条约。可立即补充#G +2#!名外交官，并在八年内提升外交声誉、缓和国际敌意。消耗#Y 60#!金币（冷却6年）。"
 oe_v59_w5_ci_grand_diplomatic_envoy_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将作为全权大使率领盛大使团出访各国朝廷，扬我国威。"
 oe_v59_w5_ci_grand_diplomatic_envoy_past: "全权外交使团已启程"
 oe_v59_w5_ci_grand_diplomatic_envoy_act_past: "[SCOPE.sCharacter('recipient').GetName]已奉命率领全权使团出访诸国。"
 oe_v59_w5_ci_grand_diplomatic_envoy_no_candidate: "@trigger_no! 朝中暂无外交不低于50的成年廷臣可担纲全权大使。"
 oe_v59_w5_ci_grand_diplomatic_envoy_cd_tt: "过去6年内未派遣过全权外交使团。"
 oe_v59_w5_ci_exploration_captain: "委任远航探险与舆图测绘船长"
 oe_v59_w5_ci_exploration_captain_concept: "[character|e]"
 oe_v59_w5_ci_exploration_captain_act: "$oe_v59_w5_ci_exploration_captain$"
 oe_v59_w5_ci_exploration_captain_desc: "为胆识过人的航海家或陆路勘测官配备星盘、海图与王室敕书。十年内可解锁探险家招募、加快探险筹备与航速并拓展贸易航程，同时提升海军传统。消耗#Y 70#!金币（冷却8年）。"
 oe_v59_w5_ci_exploration_captain_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将获颁海图与王室委任状，出任远航探险与测绘船长。"
 oe_v59_w5_ci_exploration_captain_past: "探险测绘船长已获委任"
 oe_v59_w5_ci_exploration_captain_act_past: "[SCOPE.sCharacter('recipient').GetName]已正式获任为远航探险与舆图测绘船长。"
 oe_v59_w5_ci_exploration_captain_no_candidate: "@trigger_no! 朝中暂无未入内阁且任一能力不低于45的成年人选可供委任。"
 oe_v59_w5_ci_exploration_captain_cd_tt: "过去8年内未委任过远航探险船长。"
 oe_v59_w5_ci_endow_academy_chair: "捐设帝国翰林与学院讲席"
 oe_v59_w5_ci_endow_academy_chair_concept: "[character|e]"
 oe_v59_w5_ci_endow_academy_chair_act: "$oe_v59_w5_ci_endow_academy_chair$"
 oe_v59_w5_ci_endow_academy_chair_desc: "拨款设立常设皇家学院讲席（如帝国大学、翰林院、智慧宫或皇家学会），延请硕学名臣主持教席。十二年内加速思潮传播、国民识字与学术研发，仅需承担少量财政津贴。消耗#Y 80#!金币（冷却10年）。"
 oe_v59_w5_ci_endow_academy_chair_desc_specific: "[SCOPE.sCharacter('recipient').GetName]将出任新捐设的皇家学院讲席，领衔国朝学术兴盛。"
 oe_v59_w5_ci_endow_academy_chair_past: "皇家学院讲席设立告成"
 oe_v59_w5_ci_endow_academy_chair_act_past: "[SCOPE.sCharacter('recipient').GetName]已正式就任本国皇家学院讲席。"
 oe_v59_w5_ci_endow_academy_chair_no_candidate: "@trigger_no! 朝中暂无行政或外交不低于55的成年学者可出任学院讲席。"
 oe_v59_w5_ci_endow_academy_chair_cd_tt: "过去10年内未捐设过皇家学院讲席。"
 oe_v59_w5_ua_greek_fire_broadside: "拜占庭希腊火舷侧齐射"
 oe_v59_w5_ua_greek_fire_broadside_desc: "为地中海德罗蒙战舰与主力舰加装加压猛火油舷侧喷射器与纵火陶罐。以更高的舰队维护费与甲板损耗为代价，换取毁灭性的海战伤害、桨帆战力与先手压制。"
 oe_v59_w5_ua_greek_fire_broadside_cta: "点击切换拜占庭希腊火舷侧齐射战术。"
 oe_v59_w5_ua_mongol_feigned_retreat: "蒙古诈败诱敌与两翼合围"
 oe_v59_w5_ua_mongol_feigned_retreat_desc: "遣轻骑射手前出佯败诱敌深入，再令两翼预备万户疾驰合围。大幅提升轻骑战力、行军速度、先手主动与战斗机动，但会削弱攻城效率并增加军马补给开销。"
 oe_v59_w5_ua_mongol_feigned_retreat_cta: "点击切换蒙古诈败诱敌与合围战术。"
 oe_v59_w5_ua_tercios_pike_square: "大方阵长矛火枪混编阵"
 oe_v59_w5_ua_tercios_pike_square_desc: "自1492年起解锁，效仿西班牙与欧洲经典大方阵（Tercio）战法，以密集长矛方阵居中、火绳枪翼队护角。虽会拖慢行军速度并增加火药补给开销，却能带来钢铁般的军纪、重步战力与战术优势。"
 oe_v59_w5_ua_tercios_pike_square_cta: "点击切换大方阵长矛火枪混编阵型。"
 oe_v59_w5_ua_east_asian_shieldwall: "盛唐陌刀重步盾墙阵"
 oe_v59_w5_ua_east_asian_shieldwall_desc: "承袭唐代陌刀重步与东亚步兵大盾传统，列成如山重甲盾墙以正面斩破骑兵冲阵。虽减缓行军速度并抬高甲胄维护费，却能大幅增强重步兵战力、陆军士气与士气恢复。"
 oe_v59_w5_ua_east_asian_shieldwall_cta: "点击切换盛唐陌刀重步盾墙阵型。"
 oe_v59_w5_ua_janissary_volley: "奥斯曼火枪新军齐射战法"
 oe_v59_w5_ua_janissary_volley_desc: "自1450年起解锁，令常备精锐火枪步兵依托链炮与野战壕垒展开波次齐射。以高额火药维护与略微降速为代价，换取犀利的轻步火力、严明军纪与强悍攻城能力。"
 oe_v59_w5_ua_janissary_volley_cta: "点击切换奥斯曼火枪新军齐射战法。"
 oe_v59_w5_ua_roman_testudo_march: "罗马龟甲阵推进"
 oe_v59_w5_ua_roman_testudo_march_desc: "承袭古典罗马军团与帝国中央禁军操典，行进与蚁附攻城时将大盾紧密锁合为坚不可摧的龟甲护顶。虽显著放缓行军并增加维护成本，却可大幅降低野战损耗并增强重步强攻威力。"
 oe_v59_w5_ua_roman_testudo_march_cta: "点击切换罗马龟甲阵推进阵型。"
 oe_v59_w5_dec_proclaim_silk_road_hegemon.title: "宣示丝绸之路陆权霸主地位"
 oe_v59_w5_dec_proclaim_silk_road_hegemon.desc: "作为掌控欧亚丝绸之路核心走廊且拥有至少10座城镇的独立[great_power|e]，颁布丝绸之路陆权霸主敕令。立即开启持续25年的陆路商贸盛世，并在本国维持独立列强且扼守丝路干道期间持续激活#G 丝绸之路陆权霸主#!自动增益。"
 oe_v59_w5_dec_proclaim_silk_road_hegemon.a: "颁诏宣示欧亚陆路丝绸干道霸权"
 oe_v59_w5_dec_proclaim_scientific_hegemon.title: "宣示科学巨擘霸主地位"
 oe_v59_w5_dec_proclaim_scientific_hegemon.desc: "作为识字率与科技进展冠绝群伦的独立[great_power|e]，颁布科学巨擘霸主敕令。立即推进科研进度、开启25年学术盛世，并在本国保持独立列强与高识字率期间持续激活#G 科学巨擘霸主#!自动增益。"
 oe_v59_w5_dec_proclaim_scientific_hegemon.a: "昭告天下以本国为格物致知之灯塔"
 AUTO_MODIFIER_NAME_oe_v59_w5_auto_silk_road_hegemon: "丝绸之路陆权霸主"
 AUTO_MODIFIER_DESC_oe_v59_w5_auto_silk_road_hegemon: "在颁布丝路霸主敕令且仍为独立列强并扼守欧亚陆路走廊期间持续生效。全面提升陆路贸易效率、商人容量、首都控制传导速度与威望，同时招致列强忌惮。"
 AUTO_MODIFIER_NAME_oe_v59_w5_auto_scientific_luminary_hegemon: "科学巨擘霸主"
 AUTO_MODIFIER_DESC_oe_v59_w5_auto_scientific_luminary_hegemon: "在颁布科学霸主敕令且仍为独立列强并保持至少25%平均识字率期间持续生效。持续强化科研速率、思潮传播、国民识字与国家威望，亦令竞争列强倍感压力。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_adopted_successor: "钦定过继皇嗣"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_adopted_successor: "依循贤明过继古制正式纳入王室宗族，并接受严密治国储君历练。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_master_chronicler: "传世史家与格物宗师"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_master_chronicler: "因编纂传世史志与科学巨著而享誉朝野，政理才干更趋精深。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_ennobled_hero: "受爵军功名将"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_ennobled_hero: "因沙场殊勋晋爵封赏，在军中威望素著，令将士士气与临阵先机大振。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_frontier_governor: "边疆军区总督"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_frontier_governor: "久镇边塞，统筹要塞守备、军粮转运与边地绥靖，兼通文武政务。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_honorable_retirement: "荣休致仕清修"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_honorable_retirement: "体面退隐修院或乡间别业，远离朝堂争端、兵权与储位角逐，颐养天年。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_grand_envoy: "全权外交特使"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_grand_envoy: "奉命周旋列国朝堂，主持重大缔约与盟邦斡旋，外交声望卓著。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_cartography_captain: "皇家远航测绘船长"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_cartography_captain: "掌持王室海图、星盘与精锐水手，专司开拓未知航路与勘测四方舆地。"
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_academy_chair: "皇家学院讲席"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_academy_chair: "领衔国家最高学府与典籍译注，砥砺文风并提携后进干吏。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_master_treatise: "官修传世典籍之风"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_master_treatise: "国家资助刊行的史志与科学典籍激发了全国研学风气、识字增长与文化底蕴，但新锐思辨亦略微增加维稳成本。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_frontier_march_wardens: "边疆军区防务体系"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_frontier_march_wardens: "精干的边防总督加固了边塞堡垒、充实了边地兵源并稳固地方控制，但也带来了更高的常备军维持开支。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_grand_embassy_mission: "全权外交大使团"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_grand_embassy_mission: "盛大的全权使团显著提升了本国外交声誉并缓和列强猜忌，但庞大的外事往来亦占用部分外交容量。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_cartography_expedition: "皇家舆图与远航探险署"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_cartography_expedition: "系统化的水文测绘与远航敕令解锁了探险家招募、加快探险筹备并延伸贸易航程，代价是舰船整备费小幅上升。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_endowed_academy_chair: "皇家学院常设讲席"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_endowed_academy_chair: "常设皇家教席持续加速思潮传播、国民识字与科研进展，所需学田与俸禄略微摊薄财政税入。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_silk_road_hegemon_edict: "丝绸之路陆权霸主敕令"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_silk_road_hegemon_edict: "宣示对横贯欧亚大陆干道的商贸主导权，大幅提升陆路贸易效率、商人力量与商税收入，亦引来周边列强的侧目与忌惮。"
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_scientific_hegemon_edict: "科学巨擘霸主敕令"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_scientific_hegemon_edict: "以本国学府、天文台与印书馆为天下格物致知之灯塔，显著提升科研速度、思潮传播与识字上限，但激进求知之风亦令保守教士阶层心存疑虑。"
