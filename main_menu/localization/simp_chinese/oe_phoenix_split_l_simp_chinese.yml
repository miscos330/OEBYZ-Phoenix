l_simp_chinese:
 OE_PHOENIX_END_CIVIL_WAR_SETTLED_TT: "已平定巴列奥略早期继承与内战危机（无进行中的内战或宫廷阴谋，且已结束1341年继承危机或年份不早于1355年）"
 oe_fate_of_the_phoenix.1000.t: "凤凰初振"
 oe_fate_of_the_phoenix.1000.d: "君士坦丁堡的城墙依然屹立，巴列奥略王朝早期的内战烽烟与乡间盗匪已经平息，帝国在色雷斯、希腊与爱琴海两岸重新稳住了根基。虽然后续的中央集权、新式军制与军区土地改革仍任重道远，但罗马已经走出了最危急的存亡关头。"
 oe_fate_of_the_phoenix.1000.a: "风暴暂歇，中兴始于今朝！"
 oe_fate_of_the_phoenix.1000.tt: "早期生存危机已结束，帝国支柱中的军区土地政策与同胞和平统一行动将继续开放。"
 oe_pillars_protect_peasants: "保护自由农民"
 oe_pillars_protect_peasants_desc: "自由农民是我国统治的根基。即便早期危机已经过去，我们仍须通过帝国支柱持续扶植自耕农并限制豪强兼并，推进军区土地特权向自由农民路线演进。"
 oe_pillars_protect_peasants_card: "持续扶植自耕农，将 #Y 军区土地特权#! 推向自由农民路线。"
 oe_pillars_protect_noble: "与军事贵族合作"
 oe_pillars_protect_noble_desc: "巴西琉斯需要强有力的军事精英卫戍边疆。即便早期危机已经过去，我们仍可通过帝国支柱深化与军事贵族的合作，推进军区土地特权向军事贵族路线演进。"
 oe_pillars_protect_noble_card: "深化与军事贵族合作，将 #Y 军区土地特权#! 推向军事贵族路线。"
 oe_pillars_own_greek_country: "和同胞和平统一"
 oe_pillars_own_greek_country_desc: "我们没必要与流落海外的希腊同胞兵戎相向。在帝国规模壮大且希腊化深入之后，可通过帝国支柱将独立的希腊文化政权和平纳为罗马同盟附庸。"
 oe_pillars_own_greek_country_card: "将独立的 #Y 希腊文化#! 政权和平纳为罗马同盟附庸。"
