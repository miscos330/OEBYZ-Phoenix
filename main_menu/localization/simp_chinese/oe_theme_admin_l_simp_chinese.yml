l_simp_chinese:
 # NEW 2026-11-17 theme-rework stage 2 (generated by gen_theme_admin.py)
 oe_theme_set_focus: "调整方针"
 oe_theme_set_focus_desc: "为一个军区改定[oe_tu_course|e]：陆军（军务#G +15#!）、海军（军务#G +10#!，财政#G +5#!，治所须临海）或民政（民政#G +10#!，司法#G +5#!，财政#G +5#!，忠诚目标#G +5#!，[oe_tu_march|e]不可选）。军区的类型、政体改革与治所建筑随之一并更换。消耗#R 5#!点[oe_tu_authority|e]，同一军区#Y 5#!年内只能调整一次。拉丁[oe_tu_exarchate|e]与[oe_tu_charter|e]不能改方针。"
 oe_theme_set_focus_select: "选择军区"
 oe_theme_set_officials: "调整属官"
 oe_theme_set_officials_desc: "决定军区的[oe_tu_fiscal|e]：法官与财务官由中央委派还是由将军兼管，或改行包税；帝国推行[oe_tu_pronoia|e]制度时，也可以授地代替薪俸。中央委派的属官每人每月按辖区地点数 × #R 0.2#!金币由国库支付。同一军区#Y 2#!年内只能调整一次。"
 oe_theme_set_officials_select: "选择军区"
 oe_theme_admin.1.t: "军区方针"
 oe_theme_admin.1.d: "帝国的军区从来不是一个模样。安纳托利亚的军区守山口，爱琴海的基比拉奥特军区出船出水手。到了科穆宁时代，许多辖区已由文官凯法勒按行省治理，将军只管兵。\n\n这个军区今后走哪条路，由御座决定。改方针要换掉军区的类型、政体改革和治所建筑。\n\n军区：[GetCountry('BYZ').MakeScope.GetVariable('oe_theme_admin_target').GetCountry.GetName]"
 oe_theme_admin.1.army: "陆军军区：以兵为本"
 oe_theme_admin.1.navy: "海军军区：以舰队为本"
 oe_theme_admin.1.civil: "行省：交给文官治理"
 oe_theme_admin.1.army.tt: "军区改走陆军方针：军务效率#G +15#!。类型、政体改革与治所建筑随之更换。消耗#R 5#!点[oe_tu_authority|e]，#Y 5#!年内不能再改。"
 oe_theme_admin.1.navy.tt: "军区改走海军方针：军务效率#G +10#!，财政效率#G +5#!，治所得到#Y 10#!艘当代桨帆船。类型、政体改革与治所建筑随之更换。消耗#R 5#!点[oe_tu_authority|e]，#Y 5#!年内不能再改。"
 oe_theme_admin.1.civil.tt: "军区改为行省：民政效率#G +10#!，司法效率#G +5#!，财政效率#G +5#!，忠诚目标#G +5#!；行省不随帝国出征。类型、政体改革与治所建筑随之更换。消耗#R 5#!点[oe_tu_authority|e]，#Y 5#!年内不能再改。"
 oe_theme_admin.2.t: "军区属官"
 oe_theme_admin.2.d: "法官（krites）与财务官（protonotarios）若由中央委派，就能分走将军的司法与财权；若交由将军兼管，则省钱，却让将军独揽一方。\n\n授地（普罗尼亚）要等帝国推行原版的普罗尼亚制度（或其后的科穆宁规范化、巴列奥略世袭、改革普罗尼亚）才会出现。\n\n当前：[GetCountry('BYZ').MakeScope.GetVariable('oe_theme_admin_target').GetCountry.GetName]"
 oe_theme_admin.2.judge_central: "法官改由中央委派"
 oe_theme_admin.2.judge_local: "法官改由将军兼管"
 oe_theme_admin.2.fiscal_central: "财务官改由中央委派"
 oe_theme_admin.2.fiscal_local: "财务官改由将军兼管"
 oe_theme_admin.2.fiscal_farm: "改行包税"
 oe_theme_admin.2.fiscal_pronoia: "授地（普罗尼亚）"
 oe_theme_admin.2.fiscal_pronoia.tt: "军区改行[oe_tu_pronoia|e]授地：忠诚目标#G +5#!，军务效率#G +10#!，财政效率#R −5#!；不付财务官俸禄。"
 oe_theme_admin.2.fiscal_pronoia_off: "授地（普罗尼亚）：暂不可用"
 oe_theme_admin.2.fiscal_pronoia_off.tt: "#R 需要先在“$administrative_system$”法律里推行$pronoia_system$、$komnenian_formalization$、$palaeologan_hereditary_transition$或$reformed_pronoia_system$之一。#!\n选这一项只会重新打开本菜单。"
 oe_theme_admin.2.judge_central.tt: "法官改由中央委派：司法效率#G +15#!（将军兼管时为#G +5#!），忠诚目标#G +5#!。国库每月按辖区地点数 × #Y 0.2#!金币支付俸禄。#Y 2#!年内不能再调整属官。"
 oe_theme_admin.2.judge_local.tt: "法官交由将军兼管：司法效率#G +5#!，失去中央法官带来的忠诚目标#G +5#!；国库不再支付这份俸禄。#Y 2#!年内不能再调整属官。"
 oe_theme_admin.2.fiscal_central.tt: "财务官改由中央委派：财政效率#G +15#!，忠诚目标#G +5#!。国库每月按辖区地点数 × #Y 0.2#!金币支付俸禄。#Y 2#!年内不能再调整属官。"
 oe_theme_admin.2.fiscal_local.tt: "财务官交由将军兼管：财政效率#G +5#!；国库不再支付这份俸禄。#Y 2#!年内不能再调整属官。"
 oe_theme_admin.2.fiscal_farm.tt: "改行包税：财政效率#G +10#!，司法效率#R −10#!，忠诚目标#R −5#!。军区每月按辖区地点数 × #Y 0.5#!金币增收；辖区各地点得到“军区包税”，发展缓慢下降。#Y 2#!年内不能再调整属官。"
 oe_theme_admin.2.pronoia_revoke.tt: "现行的[oe_tu_pronoia|e]授地随之收回。若授地已成世袭：忠诚#R −15#!（巴列奥略世袭制下#R −20#!，改革普罗尼亚下#R −10#!），并计入忠诚目标#Y 5#!年。"
 oe_theme_admin.cancel: "暂不调整"
