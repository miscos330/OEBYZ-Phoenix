oe_byz_empier_money_bIII_desc: "海佩伦 是其希腊语名称#bold #color_yellow νόμισμα υπέρπυρον#!#!\n的拉丁化转写，意为“精炼的”或“超纯的”硬币,初期标准重量约为4.5克（与索利多相近），纯度极高。但为了支付内战费用和应对突厥的威胁，皇帝们不断“偷工减料”。到14世纪中叶，海佩伦的金含量可能已降至50%甚至更低，变成了一种金银合金币。这导致了严重的通货膨胀、国内经济混乱以及国际信誉的彻底崩溃。外国商人（如威尼斯和热那亚）拒绝接受贬值的海佩伦，转而使用自己稳定的货币（如威尼斯杜卡特）。" # FIX 2026-11-17 P2：键名笔误，原为 oe_byz_empier_money_bII_desc

