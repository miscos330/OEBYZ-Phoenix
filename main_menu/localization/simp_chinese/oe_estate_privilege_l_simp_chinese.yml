l_simp_chinese: 
#=====================================
#nobles
#=====================================

oe_noble_agree_academe: "学术赞助人"
oe_noble_agree_academe_desc: "贵族子弟通常接受古典文学、修辞学、哲学、神学和法律教育。他们是希腊古典文化的传承者，也是神学辩论的参与者。"

oe_noble_all_reform: "三公九卿"
oe_noble_all_reform_desc: "名门望族依然是罗马政治中的常态，但已无人胆敢挑战皇帝的威严"

oe_noble_defend_enermy: "保境安民"
oe_noble_defend_enermy_desc: "不论如何，贵族们依然是我们稳定社会，保障封建生产关系的主力军.让我们通力合作，以致“长治久安”"

oe_noble_rule_area: "地方豪强"
oe_noble_rule_area_desc: "罗马自11世纪封建关系确立以来不断地封建化带来了地方豪强势力膨胀，14世纪以来首领制任命的上级首领在皇帝默许下大肆敛财，更加剧了这豪强势力的膨胀。"

oe_noble_control_food: "东罗马农奴化"
oe_noble_control_food_desc: "自普罗尼亚制度确立以来，东罗马帝国就在不断的军事失败中陷入愈来愈严重的农奴化，仅剩的自由农民和小普罗尼亚岌岌可危，要想逆转这一趋势我们必须付出巨大的努力"

oe_noble_honor: "帝国荣衔等级"
oe_noble_honor_desc: "拜占庭帝国具有丰富而严格的荣衔等级，通过维持等级制度，我们能够保证地方贵族与小普罗尼亚尔忠诚地履行他们的义务并为国而战"

oe_noble_all: "#R 三公九卿#!"
oe_noble_all_desc: "帝国贵族桀骜不驯，尤其是在政令不行的当下，国内的豪族势力尤为膨胀"

oe_noble_latin: "基督同袍"
oe_noble_latin_desc: "我们的帝国横亘在前往东方耶路撒冷的路上，也是欧洲对抗异教徒的最前锋，无数狂热而虔诚的基督战士都愿意远道而来支援我们"
oe_byz_catholic_fighter_ttI: "若[GetCountry('HAB').GetName]对我们的好感度大于50"
oe_byz_catholic_fighter_ttII: "若[GetCountry('HUN').GetName]对我们的好感度大于50"
oe_byz_catholic_fighter_ttIII: "若[GetCountry('FRA').GetName]对我们的好感度大于50"
oe_byz_catholic_fighter_ttIV: "若[GetCountry('ARA').GetName]对我们的好感度大于50"
oe_byz_catholic_fighter_ttV: "若[GetCountry('ENG').GetName]对我们的好感度大于50"
oe_byz_catholic_fighter_ttVI: "若[GetCountry('PAP').GetName]对我们的好感度大于50"

#=====================================
#clergy
#=====================================

oe_byz_university: "东罗马大学选官制"
oe_byz_university_desc: "我们将从大学与地方学术中心选拔我们的官员，以确保官员具有良好的素养以胜任他们的职位并在全社会形成以追捧教育为主的人才上升通道，确保我们的人才能够接受高等教育。"

# PAUSED: oe_byz_bureaucrat: "帝国官阶制度"
# PAUSED: oe_byz_bureaucrat_desc: "拜占庭帝国的官僚制度建立了严格的职位体系，根据职位的重要性和职责划分各级官员。在中央层面，宰相是最高行政官员，负责协助皇帝处理政务。此外，还有财政官员、军事指挥官等不同职位，每个职位都有明确的职责和权限。"

oe_reli_dip: "专业外交体系"
oe_reli_dip_desc: "我国的外交体系能够完善地接待来自各国的使团，外交人员至少应该掌握多门语言并了解各个民族的风情"

oe_byz_empire_sword: "通往五大牧首区之路"
oe_byz_empire_sword_desc: "罗马，君士坦丁，安条克，耶路撒冷，亚历山大。我们已经容忍正统教会的圣地落入敌人手中太久，太久了。我们步兵的脚印将不断向我们的圣地前进，直到将通往五大牧首区的道路都踏平"

oe_byz_clergy_greek_protect: "古典帝国"
oe_byz_clergy_greek_protect_desc: "历史与文化是我国最耀眼的明珠，我国珍藏了数不胜数的古典时代的古希腊罗马古籍，如果帝国能够继续存续，这些文本将是我们开创文艺复兴的原动力"

oe_byz_clergy_different: "静修派辩论"
oe_byz_clergy_different_desc: "由于巴拉姆对“上帝非受造之光”的抨击，其所引发的辩论如今演变为了以巴拉姆为代表的理性主义/哲学派与以帕拉马斯为代表的修道院神秘主义派的全面对立。"

oe_byz_clergy_internet: "教会网络"
oe_byz_clergy_internet_desc: "这是我国教会的基本架构，遍布全国的教会网络牢牢把控着我国人民的信仰"

oe_byz_empire_religion: "政教联结"
oe_byz_empire_religion_desc: "正统教会同拜占庭政治相互深度勾结，宫廷的掌权人物决定了教会的人事任免，而教会反过来作为宫廷的喉舌摇旗呐喊"

#=====================================
#burghers
#=====================================

oe_byz_empier_money_gII: "海佩伦"
oe_byz_empier_money_gII_desc: "海佩伦 是其希腊语名称#bold #color_yellow νόμισμα υπέρπυρον#!#!\n的拉丁化转写，意为“精炼的”或“超纯的”硬币,初期标准重量约为4.5克（与索利多相近），纯度极高。但为了支付内战费用和应对突厥的威胁，皇帝们不断“偷工减料”。到14世纪中叶，海佩伦的金含量可能已降至50%甚至更低，变成了一种金银合金币。这导致了严重的通货膨胀、国内经济混乱以及国际信誉的彻底崩溃。外国商人（如威尼斯和热那亚）拒绝接受贬值的海佩伦，转而使用自己稳定的货币（如威尼斯杜卡特）。"

oe_byz_empier_money: "海佩伦"
