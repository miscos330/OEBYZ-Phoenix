oe_byz_empier_money_bIV_desc: "海佩伦 是其希腊语名称#bold #color_yellow νόμισμα υπέρπυρον#!#!\n的拉丁化转写，意为“精炼的”或“超纯的”硬币,初期标准重量约为4.5克（与索利多相近），纯度极高。但为了支付内战费用和应对突厥的威胁，皇帝们不断“偷工减料”。到14世纪中叶，海佩伦的金含量可能已降至50%甚至更低，变成了一种金银合金币。这导致了严重的通货膨胀、国内经济混乱以及国际信誉的彻底崩溃。外国商人（如威尼斯和热那亚）拒绝接受贬值的海佩伦，转而使用自己稳定的货币（如威尼斯杜卡特）。"

oe_byz_empier_money_gI: "海佩伦"
oe_byz_empier_money_gI_desc: "海佩伦 是其希腊语名称#bold #color_yellow νόμισμα υπέρπυρον#!#!\n的拉丁化转写，意为“精炼的”或“超纯的”硬币,初期标准重量约为4.5克（与索利多相近），纯度极高。但为了支付内战费用和应对突厥的威胁，皇帝们不断“偷工减料”。到14世纪中叶，海佩伦的金含量可能已降至50%甚至更低，变成了一种金银合金币。这导致了严重的通货膨胀、国内经济混乱以及国际信誉的彻底崩溃。外国商人（如威尼斯和热那亚）拒绝接受贬值的海佩伦，转而使用自己稳定的货币（如威尼斯杜卡特）。"

oe_byz_rome_gift: "罗马帝国的遗泽"
oe_byz_rome_gift_desc: "我们的市民仍然能够享受帝国时代遗留下来的，世界上最宏伟的公共设施，教堂，大浴堂和竞技场构成了市民独特的娱乐生活"

oe_byz_burgher_state_life: "东罗马市民社会"
oe_byz_burgher_state_life_desc: "东罗马拥有一个历史悠久的发达市民社会，尽管13世纪以来由于军事失败和拉丁人的竞争而略显衰落，但悠久的传统依然保留了下来"

oe_byz_empire_invest: "拉丁竞争"
oe_byz_empire_invest_desc: "由于历届政府失败的治理与承诺，拉丁商人在我国商界享有许多特权，这严重影响了我国的经济"
oe_byz_empire_invest_tt_I: "#R 我们可以在法律界面查看拉丁人对我们经济的影响#!"

oe_byz_burgher_invest: "拜占庭商会"
oe_byz_burgher_invest_desc: "凭借地跨欧、亚、非三大洲的地理优势，拜占庭帝国迅速地发展了手工业和商业。尽管帝国不断受到日耳曼人、斯拉夫人、阿拉伯人及其它民族的侵袭，但是三大洲的各族人民和各种物质文明的相互交流一直没有停止过，这一切都促进了拜占庭手工业和商业的繁荣发展。"
oe_byz_empire_invest_tttt: "[GetEstateName('burghers_estate')]阶层好感度大于等于50％"
oe_byz_empire_invest_tt: "所有阶层好感度大于等于50％"

oe_byz_empier_buildingplan: "海西拂菻"
oe_byz_empier_buildingplan_desc: "#bold #color_yellow “拂菻，古大秦也，居西海上，一曰海西国”(《新唐书》221)#!#!\n我们曾经主宰了东方与欧罗巴之间的商品贸易，尽管我们如今已经在连番打击下衰弱不堪，但君士坦丁堡依然是无可置疑的丝绸之路终点站之一，只要我们依然控制这一贸易枢纽，我们就能从利润颇丰的东方贸易里分一杯羹"

oe_byz_academic_economy: "拜占庭经济学会"
oe_byz_academic_economy_desc: "丰富的历史记载与学术传统培养了我们对经济学理论的早期认知，一个由数位德高望重的学者组成的经济问询学会将会辅助统治者管理名目繁杂的账目，开支与债权。"

oe_byz_central_society: "国家垄断行会"
oe_byz_central_society_desc: "拜占庭政府会有意识地指导行会生产并形成垄断，例如拜占庭的支柱产业丝绸生产，这能为我们带来大量利润"

#=====================================
#peasants
#=====================================

oe_peasants_own_theme_negative_IV: "尊卑有序"
oe_peasants_own_theme_negative_IV_desc: "来自大地主阶层的军事贵族是我国巴西琉斯完全无法忽视的存在，税收，军队和土地都是他们的囊中之物，如果巴西琉斯和军事贵族合作愉快，他们将成为帝国强大的战斗力，反之，则是帝国最大的敌人"

oe_peasants_own_theme_negative_III: "土地贵族如日中天"
oe_peasants_own_theme_negative_III_desc: "来自大地主阶层的军事贵族是我国巴西琉斯完全无法忽视的存在，税收，军队和土地都是他们的囊中之物，如果巴西琉斯和军事贵族合作愉快，他们将成为帝国强大的战斗力，反之，则是帝国最大的敌人"

oe_peasants_own_theme_negative_II: "土地贵族主导地方"
oe_peasants_own_theme_negative_II_desc: "拥有大片土地的豪族正在崛起，富可敌国并拥有私人军队。他们仍然忠于君士坦丁堡并愿意在战争中为帝国挺身而出，这些贵族良好的教育与军事素养将帮助帝国军队无往不利"

oe_peasants_own_theme_negative_I: "土地贵族的崛起"
oe_peasants_own_theme_negative_I_desc: "拥有大片土地的豪族正在崛起，富可敌国并拥有私人军队。他们仍然忠于君士坦丁堡并愿意在战争中为帝国挺身而出，这些贵族良好的教育与军事素养将帮助帝国军队无往不利"

oe_peasants_own_theme_I: "自由农民的消亡"
oe_peasants_own_theme_I_desc: "曾经自治的农民公社与拥有土地的自耕农构成了东罗马帝国统治的根基，但随着普罗尼亚制度的推行，地方权力大幅落入军事贵族手中，自由农民的地位与他们相比是如此极端的不平等，以至于越来越多的自由农失去土地，变成依附农民"

oe_peasants_own_theme_II: "自由农民岌岌可危"
oe_peasants_own_theme_II_desc: "曾经自治的农民公社与拥有土地的自耕农构成了东罗马帝国统治的根基，但随着普罗尼亚制度的推行，地方权力大幅落入军事贵族手中，自由农民的地位与他们相比是如此极端的不平等，以至于越来越多的自由农失去土地，变成依附农民"

oe_peasants_own_theme_III: "自由农民受到保护"
oe_peasants_own_theme_III_desc: "自治的农民公社与拥有土地的自耕农构成了东罗马帝国统治的根基，他们受到帝国法律与行政制度的直接保护，以确保土地不会被地主豪强明目张胆地夺走。小农经济的发达推动了我国朴素民粹主义的发展，使我国更加难以多元化"

oe_peasants_own_theme_IV: "耕者有其田"
oe_peasants_own_theme_IV_desc: "自治的农民公社与拥有土地的自耕农构成了东罗马帝国统治的根基，他们受到帝国法律与行政制度的直接保护，以确保土地不会被地主豪强明目张胆地夺走。小农经济的发达推动了我国朴素民粹主义的发展，使我国更加难以多元化" # FIX 2026-11-17 P2：键名笔误，原为 oe_peasants_own_theme_III_desc

oe_byz_peasants: "帝国农村"
oe_byz_peasants_desc: "东罗马帝国是脱胎于罗马帝国而成的一个农业帝国，罗马人并非吉本笔下的奴性十足和萎靡不振的民族，其历史更非在2世纪后进入倒退进程。相反，在顺应社会发展的锐意改革中，经由隶农制发展而成的军区制成为拜占庭农业根基稳固与全面复兴的基础"

oe_byz_heavy_work: "领主劳役"
oe_byz_heavy_work_desc: "依附农民不再为国家服兵役，而是为当地领主提供沉重的无偿劳役，并作为当地领主的私人兵源参与到地方性冲突中"

oe_byz_sunday: "法定安息日"
oe_byz_sunday_desc: "通过允许平民在一周的第七天进行休息，能够有效提高人口素质并改善平民的生计"

oe_byz_great_farm: "集约农业"
oe_byz_great_farm_desc: "通过国家规划与抑制土地兼并，我国的农业高度专业化，并深度涉入市场经济"

oe_byz_legal: "代天牧民"
oe_byz_legal_desc: "生命乃上帝之造物，我们的使命不过是替上帝行使在人间的权利，即代天牧民。我们要牢记，人民在饥饿中不会安作饿殍，在压迫中仍效尤奋臂螳螂，如果我们忽视他们生存的权利，那么就要面对他们的愤怒。"

oe_byz_defend_people: "自治民兵"
oe_byz_defend_people_desc: "我们将允许当地人民拿起武器，组织自治民兵，以保卫帝国边境"

