l_simp_chinese:
 oe_ra_found_saint_petersburg: "营建圣彼得堡"
 oe_ra_found_saint_petersburg_desc: "1550年以后（自1551年起），俄罗斯直接拥有涅瓦、处于和平且没有征召中的征召兵时，可花费一年收入的金币及50政治影响力营建新都。涅瓦晋升为城市并改名为圣彼得堡，获得持续50年的移民吸引力与生育率加成，解锁并开工建造亚历山大之柱和涅瓦大道，同时将首都迁至此地。此行动仅可执行一次。"
 STATIC_MODIFIER_NAME_oe_ra_establish_saint_petersburg: "建立圣彼得堡"
 STATIC_MODIFIER_DESC_oe_ra_establish_saint_petersburg: "涅瓦河畔的新都吸引四方移民，街道、工坊与住宅沿河岸逐渐铺展。"
 oe_ra_alexander_column: "亚历山大之柱"
 oe_ra_alexander_column_desc: "矗立于圣彼得堡的纪念柱彰显国家的文化传统与影响。其维护消耗工具。"
 oe_ra_alexander_column_maintenance: "亚历山大之柱维护"
 oe_ra_nevsky_prospect: "涅瓦大道"
 oe_ra_nevsky_prospect_desc: "贯通新都的宽阔大道。仅当圣彼得堡为首都时，向国家提供邻近度效率加成；维护消耗石头与工具。"
 oe_ra_nevsky_prospect_maintenance: "涅瓦大道维护"
