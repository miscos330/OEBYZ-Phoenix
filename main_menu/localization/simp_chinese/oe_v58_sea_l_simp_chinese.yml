 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_sufi_courts:0 "爪夷文史志、伊斯兰法学与港市乌里玛将海峡诸邦融为一体。"
 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_that_luang:0 "金光璀璨的塔銮矗立万象，成为湄公河外交与佛学灯塔。"
 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_wat_sangha:0 "中南半岛各地僧侣与朝圣者云集于吴哥窟莲花宝塔之下。"
