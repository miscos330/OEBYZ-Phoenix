 hint_oe_sit_v58_sea_mandala_hegemony:0 "东南亚曼荼罗与海权指南"
 hint_oe_sit_v58_sea_mandala_hegemony_desc:0 "通过六项局势行动提升#Y 曼荼罗荣光#!（中南半岛江河霸权）或#Y 海峡与香料霸权#!（群岛香料与海权统治）。1450 年后任一进度达到 80/100 即可达成区域宏图结局。"
 oe_sit_v58_sea_mandala_hegemony:0 "东南亚：曼荼罗与海峡海权争霸"
 oe_sit_v58_sea_mandala_hegemony_desc:0 "自吴哥砂岩巴莱与伊洛瓦底万塔，至马六甲八十四语海峡与马鲁古火山丁香群岛，中南半岛诸神王曼荼罗与南洋海权苏丹国竞逐不朽霸业。"
 oe_v58_sea.1.a:0 "倾力疏浚西巴莱，重开王家渠网。"
 oe_v58_sea.1.b:0 "抽调石匠加固西疆城垣。"
 oe_v58_sea.1.c:0 "将地方蓄水渠托付佛寺高僧共管。"
 oe_v58_sea.1.desc:0 "历经数代季风洪汛，西巴莱蓄水池的砂岩引水渠日渐淤塞。高棉水利巨匠呈上贝叶勘测图，言明若趁旱季疏浚堤坝，即可重振耶输陀罗补罗周边一年三熟的稻米粮仓，然各省领主对征发夫役颇有怨言。"
 oe_v58_sea.1.title:0 "吴哥大巴莱蓄水闸门之兴修"
 oe_v58_sea.10.a:0 "统筹北苏门答腊与海峡胡椒王家专卖。"
 oe_v58_sea.10.b:0 "兴建百桨巨型旗舰纵队威慑群岛。"
 oe_v58_sea.10.c:0 "以海税减免笼络沿海富商豪族。"
 oe_v58_sea.10.desc:0 "装配青铜巨炮的百桨巨型战舰泊满班达亚齐港湾，北苏门答腊胡椒园亦获空前丰收。宫廷诗人与学者盛赞海权与文治并臻绝巅的黄金盛世。"
 oe_v58_sea.10.title:0 "胡椒之海与伊斯干达·穆达大舰队"
 oe_v58_sea.11.a:0 "扩建毗阇耶红砖海港战舟水师。"
 oe_v58_sea.11.b:0 "加固扼守毗阇耶与阿摩罗婆提的山隘壁垒。"
 oe_v58_sea.11.c:0 "议定海岸通航停战并征收过境泊船税。"
 oe_v58_sea.11.desc:0 "在毗阇耶巍峨的红砖占塔之下，占婆水师统帅整备轻捷排桨战舟准备奇袭沿海。凭借南海险峻礁湾与精锐水战之术，占婆向世人昭示海权足以抗衡陆上强敌。"
 oe_v58_sea.11.title:0 "制蓬峨与占婆红砖海防雄风"
 oe_v58_sea.12.a:0 "敕封高生瓷窑与沉香远洋商帮。"
 oe_v58_sea.12.b:0 "以珍贵奇楠沉香赠予南洋盟邦广结良缘。"
 oe_v58_sea.12.c:0 "将本季王室沉香存货悉数售予过境商船。"
 oe_v58_sea.12.desc:0 "山地采香人满载珍稀奇楠沉香下抵尸耐港，高生官窑烧制的青釉瓷器亦装箱待发，远销爪哇、吕宋与马六甲。占婆船主奏请设立常设南海商帮。"
 oe_v58_sea.12.title:0 "占城沉香、高生青瓷与南海商脉"
 oe_v58_sea.13.a:0 "迎奉勃拉邦金佛并盟会湄公河诸勐。"
 oe_v58_sea.13.b:0 "扩建南康河畔王家驯象营与象兵。"
 oe_v58_sea.13.c:0 "予山地土司岩盐与安息香贸易免税优待。"
 oe_v58_sea.13.desc:0 "法昂率战象精锐与高棉学者沿湄公河峡谷南下，号召琅勃拉邦至万象诸勐归附一统。黄金勃拉邦圣像驾临圣丘，昭告百万白象澜沧圣国巍然崛起。"
 oe_v58_sea.13.title:0 "法昂与百万白象澜沧建国"
 oe_v58_sea.14.a:0 "敕建万象塔銮大佛塔以彰澜沧正统外交。"
 oe_v58_sea.14.b:0 "巩固湄公河渡口并操练丛林伏击精兵。"
 oe_v58_sea.14.c:0 "对往来滇缅暹越的麝香丝漆马帮征税。"
 oe_v58_sea.14.desc:0 "值伊洛瓦底与湄南河强邻环伺之际，塞塔提腊王营建万象都城并起造金光巍峨的塔銮大佛塔。佛寺广抄贝叶典籍，使臣纵横湄公河缔结联防盟约。"
 oe_v58_sea.14.title:0 "塞塔提腊王与万象塔銮大佛塔"
 oe_v58_sea.15.a:0 "向全境颁行萨克迪纳官田品秩法典。"
 oe_v58_sea.15.b:0 "扩建王家财政外贸司广收四海舟税。"
 oe_v58_sea.15.c:0 "敕封四海船主官爵以广招远商。"
 oe_v58_sea.15.desc:0 "三河环绕的大城水都之内，波斯、大明、琉球与倭商番坊鳞次栉比。王家律臣奏请厘定萨克迪纳官田品秩，将亲王、朝臣与庶民权责尽数纳入中枢法度。"
 oe_v58_sea.15.title:0 "萨克迪纳法典与大城水都"
 oe_v58_sea.16.a:0 "遣发帕拉帕巨帆水师巡抚努山塔拉万岛。"
 oe_v58_sea.16.b:0 "敕修《爪哇史颂》并举办王家圣庙大典。"
 oe_v58_sea.16.c:0 "将爪哇稻米与外岛香料朝贡折征白银。"
 oe_v58_sea.16.desc:0 "在特罗乌兰红砖大殿中，宫廷史官高诵《爪哇史颂》，细数自苏门答腊至香料之海的万岛属邦。北爪哇船厂下水铁木榫接、不用一钉的多桅巨型帆船。"
 oe_v58_sea.16.title:0 "帕拉帕誓言与努山塔拉巨帆舰队"
 oe_v58_sea.17.a:0 "敕建官营香料总栈并与岛民缔结公允收购约。"
 oe_v58_sea.17.b:0 "整备科拉科拉武装战舟严防外来强盗。"
 oe_v58_sea.17.c:0 "将本季丁香肉豆蔻向价高洋商竞拍售银。"
 oe_v58_sea.17.desc:0 "普天之下，唯特尔纳特、蒂多雷与班达的火山沃土能孕育极品丁香与肉豆蔻。爪哇粮舶、马来苏丹与远洋西洋舰队竞相云集，只为争夺一季芳香奇珍。"
 oe_v58_sea.17.title:0 "丁香与肉豆蔻火山圣岛"
 oe_v58_sea.18.a:0 "敕建王家译馆广纳海图、冶铸与律法新学。"
 oe_v58_sea.18.b:0 "整顿各季风锚地海关以充国库。"
 oe_v58_sea.18.c:0 "召开东南亚诸邦使节大会共保海道和平。"
 oe_v58_sea.18.desc:0 "每逢春夏西南风起，古吉拉特、亚丁与基尔瓦商船云集；及至秋冬东北风来，广州、琉球与东瀛海舶返航。在东南亚繁华港市，海图、火器、历法与史志于万国文明间激荡交融。"
 oe_v58_sea.18.title:0 "季风逆转的万国十字路口"
 oe_v58_sea.2.a:0 "敕封吴哥窟为上座部无上道场。"
 oe_v58_sea.2.b:0 "令古梵文星象祭司与佛僧并祀朝堂。"
 oe_v58_sea.2.c:0 "于吴哥石堤征收朝圣行旅香火税。"
 oe_v58_sea.2.desc:0 "身披袈裟的上座部高僧在昔日供奉毗湿奴的莲花长廊中诵读巴利佛经。来自湄公河与湄南河流域的朝圣者驾牛车云集，敬献镀金佛像与贝叶三藏经卷。"
 oe_v58_sea.2.title:0 "吴哥窟上座部佛寺圣典"
 oe_v58_sea.3.a:0 "于四臂湾敕立湄公河海税大商港。"
 oe_v58_sea.3.b:0 "重修吴哥旧京护城壕与壁垒。"
 oe_v58_sea.3.c:0 "向商帮拍卖湄公河季风渡口专营权。"
 oe_v58_sea.3.desc:0 "在洞里萨河、湄公河与巴萨河四水交汇的四臂湾，大明、马来与占婆商舶停泊于王旗之下。朝臣激辩应将海贸枢纽南移至四臂湾与洛韦，抑或固守吴哥腹地古制。"
 oe_v58_sea.3.title:0 "四臂湾与湄公河海贸新枢"
 oe_v58_sea.4.a:0 "将火枪队与披甲战象合编为王家常备军。"
 oe_v58_sea.4.b:0 "将青铜佛郎机装配于伊洛瓦底江战舟。"
 oe_v58_sea.4.c:0 "对外籍枪匠课税并依循古制征召乡勇。"
 oe_v58_sea.4.desc:0 "抵达沙廉与马达班的葡萄牙炮手与马来铁匠展示了足以轰破木栅寨门的齐射火绳枪。缅甸将领奏请将火枪方阵与王家披甲战象、掸族骑兵编为协同精锐。"
 oe_v58_sea.4.title:0 "伊洛瓦底的火绳枪与披甲战象"
 oe_v58_sea.5.a:0 "颁行统一法典与诸藩朝贡大宪章。"
 oe_v58_sea.5.b:0 "整备白象大军再启旱季远征。"
 oe_v58_sea.5.c:0 "令沿海商港输纳登极黄金贡赋。"
 oe_v58_sea.5.desc:0 "来自掸邦山地、兰纳与孟族海岸的藩王云集于金亭之下。朝廷法臣秉承十方胜者之志，拟定统一的《法典》与王室度量衡，意欲将赫赫武功化为长治久安的曼荼罗帝国。"
 oe_v58_sea.5.title:0 "莽应龙十方胜者曼荼罗大诏"
 oe_v58_sea.6.a:0 "倾等身纯金覆饰仰光大金塔。"
 oe_v58_sea.6.b:0 "树立迦梨尼戒坛石碑以整肃僧律。"
 oe_v58_sea.6.c:0 "邀集海商行会共襄贴金善举。"
 oe_v58_sea.6.desc:0 "承继信修浮女王与达摩悉提王之宏愿，王室金匠将等身重量的纯金捶打成箔，覆贴于丁固达拉圣丘的大金塔身。孟缅高僧同声赞颂此乃仁君治世之瑞兆。"
 oe_v58_sea.6.title:0 "仰光大金塔贴金盛典"
 oe_v58_sea.7.a:0 "敕设四方港务官与石砌防火官栈。"
 oe_v58_sea.7.b:0 "封赏海人舟师为海峡领航护卫。"
 oe_v58_sea.7.c:0 "向泊港季风船队征收即时锚泊税。"
 oe_v58_sea.7.desc:0 "相传白鼷鹿于马六甲树下踢退猎犬，天赐印度洋与南海交汇的良港。通行八十四种语言的四方商贾云集河桥货摊，期盼王室颁布护商宪章。"
 oe_v58_sea.7.title:0 "拜里米苏拉宪章与八十四语大商港"
 oe_v58_sea.8.a:0 "大力资助爪夷文史馆、经学院与海商法庭。"
 oe_v58_sea.8.b:0 "为古吉拉特与大明商帮划设自治番坊。"
 oe_v58_sea.8.c:0 "重申内陆马来酋长的传统习惯法特权。"
 oe_v58_sea.8.desc:0 "自巴赛至马六甲与亚齐，苏菲法学家与老舵师以优雅的爪夷文共撰海事法典。舟师船主于沧海之上秉公断案，海难救捞、香料分润与度量衡皆有明文可依。"
 oe_v58_sea.8.title:0 "马来海事法典与爪夷文教盛世"
 oe_v58_sea.9.a:0 "礼聘高门炮匠扩建王家青铜铸炮局。"
 oe_v58_sea.9.b:0 "借红海胡椒航路广纳奥斯曼金币税入。"
 oe_v58_sea.9.c:0 "将青铜佛郎机分赠海峡盟邦共筑海防。"
 oe_v58_sea.9.desc:0 "满载苏门答腊黑胡椒、樟脑与金叶国书的亚齐快船横渡印度洋直赴吉达与君士坦丁堡。随使返航的奥斯曼铸炮大师与火炮教官携攻城火器之术前来，共抗海峡西洋战舰。"
 oe_v58_sea.9.title:0 "亚齐苏丹遣使奥斯曼高门求炮"
