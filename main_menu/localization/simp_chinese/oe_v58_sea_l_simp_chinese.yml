 oe_v58_sea_out_chakravartin_mandala:0 "转轮圣王曼荼罗霸权"
 oe_v58_sea_out_chakravartin_mandala_desc:0 "自吴哥、伊洛瓦底至湄公河诸邦皆向灌顶登极的转轮圣王朝贡归心。"
 oe_v58_sea_out_monsoon_equilibrium:0 "季风诸邦均势纪元"
 oe_v58_sea_out_monsoon_equilibrium_desc:0 "无一王座独吞江河与海峡，东南亚诸邦以多元并立之姿迈入近代。"
 oe_v58_sea_out_strait_thalassocracy:0 "黄金海峡香料海权帝国"
 oe_v58_sea_out_strait_thalassocracy_desc:0 "马六甲、亚齐、满者伯夷与香料群岛将季风海峡锻造成坚不可摧的海上商贸霸权。"
 oe_v58_sea_ref_angkor_hydraulic_devaraja:0 "水利神王庙宇体制"
 oe_v58_sea_ref_angkor_hydraulic_devaraja_desc:0 "以王室神庙总管统筹巴莱巨型蓄水池与纵横渠网，蓄洪灌田以养京畿大邑，代价是削夺地方领主世袭特权。"
 oe_v58_sea_ref_lan_xang_muang_mandala:0 "百万白象勐邦曼荼罗体制"
 oe_v58_sea_ref_lan_xang_muang_mandala_desc:0 "以佛祖圣像、饮水盟誓与山谷战象联防维系高原诸勐邦，虽让渡部分直接赋税，却换取稳固的藩属忠心与山地防务。"
 oe_v58_sea_ref_shahbandar_strait_council:0 "四港务官海峡大商港议会"
 oe_v58_sea_ref_shahbandar_strait_council_desc:0 "分设四方港务官统筹古吉拉特、孟加拉、爪哇与华商船队，并依海法理讼征税，海贸兴盛却令内陆贵族心怀不满。"
 oe_v58_sea_ref_taungoo_ahmudan_service:0 "阿木丹王役兵制与战象军团"
 oe_v58_sea_ref_taungoo_ahmudan_service_desc:0 "编户世袭王役军团，将缅步精兵、披甲战象与远洋火绳枪手纳入王室直辖兵籍，战力骤增而军费高昂。"
