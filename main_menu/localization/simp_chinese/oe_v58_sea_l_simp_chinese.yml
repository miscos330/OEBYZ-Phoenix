 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_pepper_monopoly:0 "苏门答腊王家胡椒船队在红海与印度市场独占高价白银。"
 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_phra_bang:0 "黄金立佛圣像庇佑高原盟誓与险峻山关。"
 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_river_capital:0 "湄公河四水交汇之处，王家税船迎候远涉重洋的南洋商舶。"
 STATIC_MODIFIER_DESC_oe_v58_sea_mod_ev_sakdina_ranks:0 "以稻田亩数厘定品秩，令暹罗朝臣、书吏与兵役井然有序。"
