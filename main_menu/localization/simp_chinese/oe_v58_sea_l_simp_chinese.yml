 oe_v58_sea_bld_champa_cham_tower_port:0 "占婆毗阇耶红砖占塔海港"
 oe_v58_sea_bld_champa_cham_tower_port_desc:0 "矗立于尸耐海湾峭壁上的红砖占塔灯标，指引占婆战舟、瓷窑商船与沉香货队纵横南海航线。"
 oe_v58_sea_bld_luang_prabang_elephant_kraal:0 "琅勃拉邦王家白象苑与驯象营"
 oe_v58_sea_bld_luang_prabang_elephant_kraal_desc:0 "建于南康河与湄公河交汇处的柚木驯象大营，世代象师于此驯养披甲战象与瑞兆白象，铸就百万象邦军威。"
 oe_v58_sea_bld_malacca_spice_customhouse:0 "马六甲王家香料海税司"
 oe_v58_sea_bld_malacca_spice_customhouse_desc:0 "坐落于马六甲河桥畔的石砌宝库与海税司，四方港务官于此趁季风换向之际秤量丁香、胡椒、天竺棉布与大明青花瓷。"
 oe_v58_sea_bld_shwedagon_golden_pagoda:0 "仰光大金塔"
 oe_v58_sea_bld_shwedagon_golden_pagoda_desc:0 "矗立于丁固达拉圣丘之上、由孟缅历代君主倾举国黄金贴饰的巍峨金塔，乃下缅甸上座部佛教朝圣中心与王权正统象征。"
