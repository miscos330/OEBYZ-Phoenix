l_simp_chinese:
# NEW 2026-11-22 v16.0 Module 16.0-A: Ottoman Empire Playable Epic (oe_ptur_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v160_ottomans.py; edit the generator, not this file.
 oe_ptur_janissary_musketeers: "耶尼切里火枪近卫军"
 oe_ptur_janissary_musketeers_desc: "隶属奥斯曼皇室近卫军团的领饷火枪精锐，自幼接受严苛操练，善以连绵齐射与坚不可摧的阵线守御会战中军。"
 oe_ptur_sipahi_cavalry: "蒂马尔西帕希重骑兵"
 oe_ptur_sipahi_cavalry_desc: "依托鲁米利亚与安纳托利亚蒂马尔军功份地供养的披甲重骑兵，疾如疾风、善翼侧包抄，一击即溃敌军步阵。"
 oe_ptur_tophane_bombard: "托普哈内帝国攻城巨炮"
 oe_ptur_tophane_bombard_desc: "铸造于伊斯坦布尔托普哈内皇家炮厂的巨型青铜攻城炮，发射巨石炮弹威力惊天，足以轰塌天下最坚固的城垣。"
 oe_ptur_kapudan_galley: "卡普丹帝国战船"
 oe_ptur_kapudan_galley_desc: "建于金角湾帝国船厂的精锐桨帆战船，舰首配备重型青铜火炮，专擅驰骋地中海海峡、群岛与近岸水域。"
 oe_ptur_devshirme_household: "德夫希尔迈宫廷近卫体制"
 oe_ptur_devshirme_household_desc: "通过德夫希尔迈征募遴选俊才入读恩德伦内廷学府与近卫军营，造就完全忠于苏丹、不受地方旧族掣肘的文武栋梁。"
 oe_ptur_nizam_i_cedid: "尼扎姆·杰迪德新秩序体制"
 oe_ptur_nizam_i_cedid_desc: "以独立新财库、欧式燧发枪常备军、近代炮兵工程学堂与集中化部院重塑崇高门庭，开启帝国近代化宏图。"
 oe_ptur_imperial_jurisprudence_law: "帝国律法统序法"
 oe_ptur_imperial_jurisprudence_law_desc: "界定奥斯曼帝国境内苏丹世俗卡农法典与哈乃斐沙里亚法统之间的宪制平衡。"
 oe_ptur_pol_kanun_secular_code: "卡农世俗法典"
 oe_ptur_pol_kanun_secular_code_desc: "确立苏丹成文卡农敕令在赋税、田制与行政上的至高地位，强化中央控制力并扩宽跨教派宽容。"
 oe_ptur_pol_sharia_jurisprudence: "沙里亚法统优先"
 oe_ptur_pol_sharia_jurisprudence_desc: "以传统哈乃斐法官法庭与乌里玛法学作为治国根基，大幅提升王朝正统性与教士阶层拥戴。"
 oe_ptur_pol_ebussuud_harmony: "埃布苏德双法合流"
 oe_ptur_pol_ebussuud_harmony_desc: "沿袭大穆夫提埃布苏德的双法调和范式，使帝国卡农法令与沙里亚原则相得益彰，兼顾效率与正统。"
 oe_ptur_janissary_discipline_law: "耶尼切里兵营纪律法"
 oe_ptur_janissary_discipline_law_desc: "规范卡皮库鲁耶尼切里近卫军团的营规禁婚、行会兼业以及迈向近代常备军的整编路径。"
 oe_ptur_pol_strict_barracks_celibacy: "兵营禁婚铁律"
 oe_ptur_pol_strict_barracks_celibacy_desc: "严格执行耶尼切里不得娶妻、常驻营房的祖宗成法，以更高军饷开销维系无坚不摧的精锐战力。"
 oe_ptur_pol_guild_enrolled_janissaries: "耶尼切里入籍行会制"
 oe_ptur_pol_guild_enrolled_janissaries_desc: "准许耶尼切里成婚并在城市行会中兼营工商，扩大兵源与市井安定，但代价是军营纪律渐趋松弛。"
 oe_ptur_pol_new_model_standing_army: "新式常备近代军制"
 oe_ptur_pol_new_model_standing_army_desc: "彻底取代陈旧兵营特权，建立操练近代线列步枪、野战炮术与参谋后勤的统一国家常备军。"
 oe_ptur_dec_convene_divan.title: "召开御前会议与颁行卡农法典"
 oe_ptur_dec_convene_divan.desc: "于穹顶殿堂召集大维齐尔、军法官、掌玺官与度支大臣，颁行奥斯曼帝国卡农成文法典，并确立「奥斯曼御前会议」议政体制。"
 oe_ptur_dec_convene_divan.a: "于御前会议庄严颁行卡农大法"
 oe_ptur_dec_curb_janissaries.title: "整肃耶尼切里特权"
 oe_ptur_dec_curb_janissaries.desc: "派遣御前监察官清核耶尼切里各营名册，追缴私相买卖的领饷凭证，重申兵营铁纪以遏制近卫军骄横干政。"
 oe_ptur_dec_curb_janissaries.a: "清核营籍并重申兵营铁律"
 oe_ptur_dec_nizam_i_cedid.title: "颁行尼扎姆·杰迪德新军改革"
 oe_ptur_dec_nizam_i_cedid.desc: "设立独立运作的新财库，兴建近代燧发枪兵营与速射炮兵学堂，在全国推行「尼扎姆·杰迪德」新秩序军政体制。"
 oe_ptur_dec_nizam_i_cedid.a: "正式颁行尼扎姆·杰迪德新秩序"
 STATIC_MODIFIER_NAME_oe_ptur_mod_divan_kanunname: "御前会议与卡农大宪章"
 STATIC_MODIFIER_DESC_oe_ptur_mod_divan_kanunname: "在崇高门庭的穹顶之下，大维齐尔与帝国法官奉行成文卡农法典，政令自鲁米利亚直贯安纳托利亚各桑贾克。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_janissary_audit: "耶尼切里军籍清核"
 STATIC_MODIFIER_DESC_oe_ptur_mod_janissary_audit: "清查兵营虚额与私售饷票之弊，重整耶尼切里名册与营规，令国库充实而军纪森严。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_nizam_new_order: "尼扎姆·杰迪德新式军制"
 STATIC_MODIFIER_DESC_oe_ptur_mod_nizam_new_order: "依托新财库独立供饷，新式燧发枪步兵营与速射野战炮队按近代线列操典演练，展现帝国焕然一新的武备气象。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_bursa_akce_mint: "奥尔汗布尔萨阿克切银币"
 STATIC_MODIFIER_DESC_oe_ptur_mod_bursa_akce_mint: "布尔萨官铸的成色精纯阿克切银币通行安纳托利亚商道与巴扎，向四方昭示奥斯曼贝伊国的独立主权。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_ghazi_plane_dream: "加齐巨桐之梦"
 STATIC_MODIFIER_DESC_oe_ptur_mod_ghazi_plane_dream: "奥斯曼梦中荫蔽巴尔干、安纳托利亚与两河谷地的参天巨桐激励边疆骑兵，各地加齐勇士云集星月旗下。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_rumelian_bridgehead: "加里波利鲁米利亚桥头堡"
 STATIC_MODIFIER_DESC_oe_ptur_mod_rumelian_bridgehead: "牢牢扼守达达尼尔渡口与加里波利要塞，为奥斯曼大军与安纳托利亚移民敞开通往色雷斯与巴尔干的大道。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_anatolian_consolidation: "比提尼亚腹地固本"
 STATIC_MODIFIER_DESC_oe_ptur_mod_anatolian_consolidation: "布尔萨、伊兹尼克与瑟于特广修驿站、清真寺与关隘，将比提尼亚腹地锻造为稳如磐石的龙兴基业。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_devshirme_ocak: "卡皮库鲁耶尼切里兵团"
 STATIC_MODIFIER_DESC_oe_ptur_mod_devshirme_ocak: "直属帕迪沙的领饷近卫步兵构成会战中坚，既能抵挡重骑冲锋，亦有力制衡地方旧族势力。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_ghazi_yaya_levy: "土库曼步骑常备军"
 STATIC_MODIFIER_DESC_oe_ptur_mod_ghazi_yaya_levy: "享有免税特权的安纳托利亚自由民与边疆领主按季集结，在古老加齐战旗下驰骋四境。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_timar_defter: "蒂马尔军功田亩册"
 STATIC_MODIFIER_DESC_oe_ptur_mod_timar_defter: "精密的帝国田亩清册将各省赋税份地授予西帕希骑兵，无需耗尽国库现银便可维持数万精锐重骑。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_balkan_vassal_pacts: "巴尔干诸侯羁縻盟约"
 STATIC_MODIFIER_DESC_oe_ptur_mod_balkan_vassal_pacts: "摩拉瓦河与多瑙河畔的藩属王公依约纳贡出兵，令帝国以温和羁縻之术稳固巴尔干前沿。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_yildirim_blitz: "雷霆巴耶济德闪电战"
 STATIC_MODIFIER_DESC_oe_ptur_mod_yildirim_blitz: "单季之内疾驰于多瑙河与幼发拉底河双岸之间，疾如雷霆的兵锋令巴尔干诸王与安纳托利亚各贝伊闻风丧胆。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_interregnum_restoration: "穆罕默德一世中兴统合"
 STATIC_MODIFIER_DESC_oe_ptur_mod_interregnum_restoration: "重将鲁米利亚与安纳托利亚合于一主之下，抚平内战创伤并接续帝国的统御法统。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_fatih_kanunname: "征服者托普卡帕卡农大法"
 STATIC_MODIFIER_DESC_oe_ptur_mod_fatih_kanunname: "自托普卡帕宫廷苑与托普哈内巨炮铸坊而出，征服者确立至高皇权法典与无可匹敌的攻城火力。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_sanjak_princes: "安纳托利亚皇子藩镇制"
 STATIC_MODIFIER_DESC_oe_ptur_mod_sanjak_princes: "出镇阿马西亚、马尼萨与科尼亚的皇子们广延文士、抚育地方，使安纳托利亚名城文教兴盛。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_divan_kubbealti: "穹顶之下御前会议"
 STATIC_MODIFIER_DESC_oe_ptur_mod_divan_kubbealti: "在苏丹铁格御窗之下，大维齐尔、军法官与度支大臣议政听讼、井然有序，铸就高效运转的帝国中枢。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_black_sea_lake: "奥斯曼黑海内湖霸权"
 STATIC_MODIFIER_DESC_oe_ptur_mod_black_sea_lake: "卡法、锡诺普与特拉布宗尽入版图并与克里米亚骑兵呼应，黑海粮船、巨木与蜂蜡源源不断驶过博斯普鲁斯海峡。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_sephardic_millet: "塞法迪工匠与米勒特宪章"
 STATIC_MODIFIER_DESC_oe_ptur_mod_sephardic_millet: "受米勒特宪章庇护的伊比利亚流亡名医、织工、冶匠与印书匠齐聚帝都与塞萨洛尼基，令工商百艺大兴。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_chaldiran_wagenburg: "查尔迪兰车阵火器战法"
 STATIC_MODIFIER_DESC_oe_ptur_mod_chaldiran_wagenburg: "铁链相连的战车营垒掩护耶尼切里轮番火枪齐射与野战炮轰，令最悍勇的重骑冲锋亦折戟阵前。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_caliphate_mantle: "两圣地守护者与哈里发正统"
 STATIC_MODIFIER_DESC_oe_ptur_mod_caliphate_mantle: "护持麦加与麦地那朝觐商队并将圣袍供奉于托普卡帕宫，令奥斯曼皇室威望泽被广袤伊斯兰世界。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_danube_mohacs: "贝尔格莱德与莫哈奇大捷"
 STATIC_MODIFIER_DESC_oe_ptur_mod_danube_mohacs: "踏破多瑙河坚城锁链之后，苏丹的马尾旌旗势如破竹般席卷匈牙利大平原。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_ebussuud_synthesis: "埃布苏德双法合流盛治"
 STATIC_MODIFIER_DESC_oe_ptur_mod_ebussuud_synthesis: "大穆夫提埃布苏德巧妙融合苏丹世俗卡农法与哈乃斐沙里亚法统，使帝国田制与赋役兼具权威与正统。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_preveza_kapudan: "巴巴罗萨普雷韦扎制海权"
 STATIC_MODIFIER_DESC_oe_ptur_mod_preveza_kapudan: "自金角湾与阿尔及尔出击的帝国战船纵横地中海，使自塞浦路斯至马格里布的航道尽归卡普丹帕夏号令。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_sinan_architect: "米马尔·希南帝国营造署"
 STATIC_MODIFIER_DESC_oe_ptur_mod_sinan_architect: "帝国首席建筑师希南营建的宏伟穹顶清真寺、高架引水渠与慈善公署矗立四方，成为盛世永恒石碑。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_amasya_frontier: "阿马西亚和约与两河商路"
 STATIC_MODIFIER_DESC_oe_ptur_mod_amasya_frontier: "确立两河边界既稳固扎格罗斯山口防务，又令大不里士、巴格达与阿勒颇间的丝绸商队川流不息。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_tersane_rebuild: "索库鲁冬季船厂疾造"
 STATIC_MODIFIER_DESC_oe_ptur_mod_tersane_rebuild: "自金角湾至锡诺普的船台彻冬灯火通明、斧凿齐鸣，开春之际一支焕然一新的帝国舰队再度破浪而出。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_valide_diplomacy: "太后摄政后宫外交"
 STATIC_MODIFIER_DESC_oe_ptur_mod_valide_diplomacy: "精明干练的帝国太后与威尼斯总督及欧陆宫廷书信往来，在幼主临朝之际维系社稷安宁与外交主动。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_celali_fiscal_reform: "银币重铸与财税清丈"
 STATIC_MODIFIER_DESC_oe_ptur_mod_celali_fiscal_reform: "回收贬值银币并重新清丈各省非常税额，平抑市井物价并逐步化解安纳托利亚乡野动荡。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_iltizam_tax_farms: "行省包税筹饷制"
 STATIC_MODIFIER_DESC_oe_ptur_mod_iltizam_tax_farms: "竞标包税制为火枪大军筹得立即可用的现银军饷，却也助长了地方豪强与包税官的盘踞。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_janissary_guild_decay: "耶尼切里领饷入市积弊"
 STATIC_MODIFIER_DESC_oe_ptur_mod_janissary_guild_decay: "默许已婚耶尼切里兼营市井作坊虽扩充了名册并安抚行会，却令昔日铁血军营渐失严明操典。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_osman_ii_courage: "奥斯曼二世安纳托利亚新军敕令"
 STATIC_MODIFIER_DESC_oe_ptur_mod_osman_ii_courage: "年轻苏丹锐意于安纳托利亚与叙利亚另募忠勇新军，以巨大政治风险直面都城旧军团的骄横掣肘。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_murad_iv_discipline: "穆拉德四世铁腕军纪"
 STATIC_MODIFIER_DESC_oe_ptur_mod_murad_iv_discipline: "雷厉风行地整肃贪官与营啸首恶，令自伊斯坦布尔至巴格达的官军再度敬畏帕迪沙的铁腕威权。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_koprulu_revival: "科普鲁律大维齐尔中兴"
 STATIC_MODIFIER_DESC_oe_ptur_mod_koprulu_revival: "手握全权御印的科普鲁律父子整顿国库、击破海峡封锁并重振兵锋，缔造十七世纪帝国中兴。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_vienna_resilience: "多瑙河堡垒坚韧防线"
 STATIC_MODIFIER_DESC_oe_ptur_mod_vienna_resilience: "贝尔格莱德、维丁与萨瓦河沿线修筑的棱堡体系顶住联军反扑，牢牢守住帝国的欧洲边防。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_karlowitz_chancery: "帝国书吏长常设外交署"
 STATIC_MODIFIER_DESC_oe_ptur_mod_karlowitz_chancery: "升格为专职外交中枢的帝国书吏长娴熟运用欧陆均势与条约法理，以精明斡旋化解多线危机。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_muteferrika_press: "郁金香盛景与穆特费里卡官印局"
 STATIC_MODIFIER_DESC_oe_ptur_mod_muteferrika_press: "奥斯曼土耳其文活字印刷局印行舆图、史志与军政新书，郁金香时代的文化雅韵与启蒙新知遍传博斯普鲁斯两岸。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_patrona_suppression: "力保新学与官印局"
 STATIC_MODIFIER_DESC_oe_ptur_mod_patrona_suppression: "果断平定都城骚乱，护住活字官印局、造纸工坊与炮兵算学馆免遭守旧派焚毁。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_muhendishane_school: "帝国海军与炮兵工程院"
 STATIC_MODIFIER_DESC_oe_ptur_mod_muhendishane_school: "帝国海军工程院系统教授几何、造船与新式炮术，锻造配备铜底战列舰与速射炮队的近代海陆军官团。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_selim_nizam_corps: "塞利姆三世新财库新军"
 STATIC_MODIFIER_DESC_oe_ptur_mod_selim_nizam_corps: "驻扎于莱文特与塞利米耶营房的新式军团以刺刀齐射之威横扫战阵，证明近代军改势不可挡。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_auspicious_incident: "吉祥事变：现代常备军纪元"
 STATIC_MODIFIER_DESC_oe_ptur_mod_auspicious_incident: "积弊四百余年的骄横旧营一朝扫清，崭新的帝国常备军统一军令、肃清政潮，为全面近代化铺平道路。"
 STATIC_MODIFIER_NAME_oe_ptur_mod_tanzimat_dawn: "坦齐马特新政曙光"
 STATIC_MODIFIER_DESC_oe_ptur_mod_tanzimat_dawn: "近代部院制度、公平税制与法治保障次第落地，焕然一新的崇高门庭昂首迈入工业时代。"
 oe_ptur.1.title: "奥斯曼之梦与奥尔汗布尔萨铸币"
 oe_ptur.1.desc: "在乌鲁达格山麓的青翠谷地，编年史家仍传颂着奥斯曼·加齐的奇梦：新月化作参天巨桐，枝叶荫蔽多瑙河、尼罗河与两河山川。如今新克不久的布尔萨已备好银模，只待铸造刻有奥斯曼主权铭文的第一批阿克切银币。"
 oe_ptur.1.a: "开铸布尔萨阿克切银币并广建商驿"
 oe_ptur.1.b: "向四方边疆骑手宣示加齐巨桐天命"
 oe_ptur.2.title: "跨越达达尼尔"
 oe_ptur.2.desc: "三月地动震裂色雷斯沿岸城垣之际，苏莱曼帕夏率奥斯曼木筏横渡达达尼尔海峡，将马尾旌旗插上欧洲土地。眼见拜占庭帝国深陷内耗、巴尔干诸邦惊疑观望，奥斯曼就此跨立欧亚双岸。"
 oe_ptur.2.a: "固守加里波利渡口并移民拓殖鲁米利亚"
 oe_ptur.2.b: "先固比提尼亚根基再图深进色雷斯"
 oe_ptur.3.title: "穆拉德一世与耶尼切里近卫军"
 oe_ptur.3.desc: "随着疆域远超昔日边疆贝伊国，单靠部族游骑已难以镇守巴尔干坚城并绝对服从朝廷号令。大维齐尔钱达尔勒·卡拉·哈利勒进言推行德夫希尔迈征募制度，遴选宫廷侍童严格操练为直属帕迪沙的领饷新军——耶尼切里近卫兵团。"
 oe_ptur.3.a: "创立德夫希尔迈宫廷近卫与耶尼切里兵团"
 oe_ptur.3.b: "倚重土库曼步骑常备军与边疆贝伊"
 oe_ptur.4.title: "科索沃会战与蒂马尔授田制"
 oe_ptur.4.desc: "自马其顿山口至普里什蒂纳近郊的黑鸟原，塞尔维亚与保加利亚诸侯寸土必争。单凭沙场克敌尚不足以长治鲁米利亚，帝国书吏须丈量新附村落、编造蒂马尔田亩清册，以赋税份地供养披甲西帕希重骑。"
 oe_ptur.4.a: "编造鲁米利亚蒂马尔清册以养西帕希重骑"
 oe_ptur.4.b: "敕封巴尔干本地诸侯为纳贡藩属"
 oe_ptur.5.title: "雷霆巴耶济德一世：双岸闪电征伐"
 oe_ptur.5.desc: "威震欧亚的「雷霆」苏丹疾驰于海峡双岸：春平安纳托利亚诸侯，秋破多瑙河畔十字军联军，令四方震惊。然而疾风骤雨般的中央集权亦在桀骜不驯的土库曼旧领主间埋下深怨。"
 oe_ptur.5.a: "东西双线疾进，尽显雷霆兵威"
 oe_ptur.5.b: "放缓征伐步伐以安抚安纳托利亚旧族"
 oe_ptur.6.title: "安卡拉大空位与穆罕默德中兴"
 oe_ptur.6.desc: "安卡拉平原上的东方草原飓风过后，奥斯曼诸王子在埃迪尔内、布尔萨与阿马西亚分庭抗礼，四邻强敌亦虎视眈眈。唯有坚忍不拔的政治智慧、忠于正统的鲁米利亚西帕希与稳固的官僚基干，方能将濒临裂解的苏丹国重新弥合。"
 oe_ptur.6.a: "凝聚帝国中枢，重归一统法统"
 oe_ptur.6.b: "厚赐登基赏金以稳住耶尼切里军心"
 oe_ptur.7.title: "征服者穆罕默德与托普卡帕宫"
 oe_ptur.7.desc: "从烈焰冲天的托普哈内巨炮铸坊，到俯瞰金角湾的托普卡帕大理石庭院，征服者将昔日边疆苏丹国重塑为横跨欧亚的普世大帝国。新颁卡农法典不仅确立宫廷仪制与巨炮攻城之术，更以冷峻的兄弟法杜绝大空位期悲剧重演。"
 oe_ptur.7.a: "颁行征服者卡农大法，确立至高皇权"
 oe_ptur.7.b: "保留安纳托利亚皇子分镇历练旧制"
 oe_ptur.8.title: "穹顶之下的奥斯曼御前会议"
 oe_ptur.8.desc: "每周四日，大维齐尔在穹顶殿堂召集鲁米利亚与安纳托利亚大军法官、度支大臣与掌玺官共商国是。高悬座上的鎏金铁格御窗时刻警醒百官：帕迪沙随时可能在幕后垂听裁决。"
 oe_ptur.8.a: "正式确立奥斯曼御前会议常态化议政机制"
 oe_ptur.8.b: "将核心机务收归内廷小圈子决断"
 oe_ptur.9.title: "黑海锁钥"
 oe_ptur.9.desc: "数代以来，热那亚在克里米亚沿岸筑起的堡垒与本都海港一直掐着南下博斯普鲁斯的粮道。随着黑海诸港尽归囊中、克里米亚格莱汗廷臣服结盟，崇高门庭终将浩瀚黑海化为拱卫帝都的稳固粮仓。"
 oe_ptur.9.a: "锁钥博斯普鲁斯海峡并特许黑海粮运船队"
 oe_ptur.9.b: "向热那亚与克里米亚商帮颁授通商特许"
 oe_ptur.10.title: "塞法迪流亡者与米勒特自治"
 oe_ptur.10.desc: "当驱逐敕令席卷伊比利亚半岛，数以万计的塞法迪商贾、呢绒织工、枪械匠与名医漂泊地中海寻求庇护。帝国舰船已整装待发，准备迎请他们迁入帝都、塞萨洛尼基与士麦那，纳入秩序井然的米勒特庇护体系。"
 oe_ptur.10.a: "遣派帝国船队迎请塞法迪工商业者入籍"
 oe_ptur.10.b: "仅按常例课税入境，不扩大米勒特免税特权"
 oe_ptur.11.title: "塞利姆一世与查尔迪兰决战"
 oe_ptur.11.desc: "在东安纳托利亚险峻的高原山口，效忠萨非王朝的红帽奇兹尔巴什骑兵屡屡撼动奥斯曼边疆，并煽动自埃尔祖鲁姆至科尼亚的部族骚动。冷酷塞利姆以铁链炮车阵、耶尼切里火绳枪齐射与铁血东征予以迎头痛击。"
 oe_ptur.11.a: "列阵铁链炮车营，以火器齐射摧毁敌骑"
 oe_ptur.11.b: "固守东境险隘并与库尔德诸部结盟"
 oe_ptur.12.title: "开罗城门与哈里发圣袍传承"
 oe_ptur.12.desc: "向南越过叙利亚平原与西奈沙海，便是执掌大马士革、开罗与两圣地朝觐商道的古老马穆鲁克苏丹国。将尼罗河谷与麦加、麦地那纳入奥斯曼护持之下，不仅令帝国税赋倍增，更赋予苏丹举世无双的哈里发崇高威望。"
 oe_ptur.12.a: "承继两圣地守护之责，恭迎圣袍入驻托普卡帕"
 oe_ptur.12.b: "优先整顿红海海关与黎凡特香料财源"
 oe_ptur.13.title: "苏莱曼大帝挥师多瑙河"
 oe_ptur.13.desc: "在绘有苏莱曼御押的金色军旗下，帝国大军架桥横渡萨瓦河，直叩中欧门户。在莫哈奇的泥泞原野上，重甲欧洲骑士径直撞向铁链相连的奥斯曼炮阵与纪律森严的耶尼切里火枪方阵。"
 oe_ptur.13.a: "乘胜挺进多瑙河谷，威震布达与中欧平原"
 oe_ptur.13.b: "稳守贝尔格莱德锁钥，休养巴尔干军民"
 oe_ptur.14.title: "立法者苏莱曼与埃布苏德律法合流"
 oe_ptur.14.desc: "在帝国臣民心中，宏伟的苏莱曼大帝最受尊崇的徽号莫过于「卡努尼」——立法者。在博学大儒埃布苏德主持下，崇高门庭将刑律、农田与税赋卡农法令与哈乃斐沙里亚法学完美调和，令全国法官法庭与皇权法度浑然一体。"
 oe_ptur.14.a: "采行埃布苏德双法合流制，统合卡农与沙里亚"
 oe_ptur.14.b: "强化世俗卡农大法，凌驾宗教学者法庭"
 oe_ptur.14.c: "尊崇传统哈乃斐沙里亚法统居首"
 oe_ptur.15.title: "海雷丁·巴巴罗萨与普雷韦扎"
 oe_ptur.15.desc: "应召自阿尔及尔入主金角湾帝国造船厂的海雷丁·巴巴罗萨，倾力锻造足以抗衡威尼斯、热那亚与西班牙联军的庞大战船舰队。在爱奥尼亚海的普雷韦扎岬角外，灵活迅捷的奥斯曼战船以巧破力，一举夺得地中海制海权。"
 oe_ptur.15.a: "拜巴巴罗萨为卡普丹帕夏，号令地中海波涛"
 oe_ptur.15.b: "令舰队专注近海巡防与商船护航"
 oe_ptur.16.title: "帝国首席建筑师米马尔·希南"
 oe_ptur.16.desc: "曾任耶尼切里工兵架桥官的帝国首席建筑师米马尔·希南，手执圆规准绳勘察帝都与埃迪尔内的山丘。从层叠飞穹的苏莱曼尼耶清真寺，到遍布巴尔干与黎凡特的石桥、医院与引水渠，他的巧思为盛世雕琢出不朽天际线。"
 oe_ptur.16.a: "鼎力资助希南兴建帝国大寺、石桥与慈善公署"
 oe_ptur.16.b: "命希南工匠团优先加固边疆棱堡与军桥"
 oe_ptur.17.title: "两河边疆与阿马西亚和约"
 oe_ptur.17.desc: "绵延数十载的东安纳托利亚与两河山地征战虽已将巴格达与两河入海口收入版图，却也令补给线濒临极限。来自伊朗的使团抵达阿马西亚，提议缔结正式边界和约以划定两河疆界并重开丝绸商路。"
 oe_ptur.17.a: "批准阿马西亚和约，重开巴格达—阿勒颇丝路"
 oe_ptur.17.b: "维持东境重兵戒备，绝不轻言息兵"
 oe_ptur.18.title: "勒班陀之震与冬季船厂重建"
 oe_ptur.18.desc: "噩耗自海上传来：基督教神圣同盟联军舰队在帕特雷湾重创数十艘奥斯曼战船。然而面对伊斯坦布尔城中洋洋得意的外国使节，大维齐尔索库鲁·穆罕默德帕夏冷峻回应：夺下塞浦路斯是斩断了你们的一臂，而勒班陀不过刮去了我们的胡须——胡须刮去后只会生得更密更茂！"
 oe_ptur.18.a: "动员全国船厂彻冬赶造，开春重下两百战船"
 oe_ptur.18.b: "节缩国库现银，逐年稳步重造水师"
 oe_ptur.19.title: "女权苏丹时代与后宫外交"
 oe_ptur.19.desc: "随着皇子外放行省历练的旧制式微，托普卡帕内廷渐成帝国权柄核心。努尔巴努、萨菲耶与柯塞姆等精明强干的帝国太后直接与威尼斯、法兰西及英格兰宫廷通函斡旋，在幼主继位时稳住朝纲，却也引来保守派维齐尔对后宫干政的非议。"
 oe_ptur.19.a: "善用太后后宫外交网络与宫廷恩荫体系"
 oe_ptur.19.b: "重申大维齐尔御前会议的正式行政权责"
 oe_ptur.20.title: "白银冲击与蒂马尔危机"
 oe_ptur.20.desc: "源源不断涌入地中海的美洲白银剧烈冲击奥斯曼阿克切银币币值，而漫长战事又急需海量现银招募火枪步兵。入不敷出的西帕希弃守贬值的蒂马尔份地，失业的火枪雇佣兵则在安纳托利亚高原掀起骇人的杰拉利大动乱。"
 oe_ptur.20.a: "忍痛重铸足色银币并重新清丈税册"
 oe_ptur.20.b: "推行行省伊尔蒂扎姆包税制以解燃眉军饷"
 oe_ptur.21.title: "耶尼切里成婚经商与兵营纪纲松弛"
 oe_ptur.21.desc: "严禁耶尼切里娶妻、世袭与兼营工商的祖宗成法已悄然废弛。成千上万市民在伊斯坦布尔的咖啡馆与行会中私相买卖兵团领饷凭证，昔日的精英近卫军正演变为盘根错节、誓死捍卫特权的武装利益集团。"
 oe_ptur.21.a: "铁面重申兵营禁婚铁律并裁汰虚额"
 oe_ptur.21.b: "默许耶尼切里入籍行会以换取都城暂安"
 oe_ptur.22.title: "少年奥斯曼二世之变"
 oe_ptur.22.desc: "对波兰霍京战役中耶尼切里怯战怠工痛心疾首的少年苏丹奥斯曼二世，密谋渡海前往安纳托利亚另建忠勇新军，甚至有意迁都以摆脱骄兵挟制。然而消息走漏，伊斯坦布尔兵营庭院内象征哗变的军锅已然翻倒。"
 oe_ptur.22.a: "力排众议，果断颁行安纳托利亚新军敕令"
 oe_ptur.22.b: "暂向各营阿迦让步，化解弑君兵变危机"
 oe_ptur.23.title: "穆拉德四世铁腕整肃与巴格达亲征"
 oe_ptur.23.desc: "熬过危机四伏的幼主摄政期后，穆拉德四世亲披战甲整肃兵变党羽、查封滋事酒肆与咖啡馆，并严惩贪腐行省帕夏。重振皇权威严之后，他御驾亲征挥师东进，誓要光复巴格达重镇。"
 oe_ptur.23.a: "颁行铁腕整肃令并御驾亲征巴格达"
 oe_ptur.23.b: "从宽处断，避免波及都城商市生计"
 oe_ptur.24.title: "科普鲁律大维齐尔中兴"
 oe_ptur.24.desc: "当威尼斯舰队封锁达达尼尔海峡、内廷派系令御前会议陷入瘫痪之际，老成谋国的阿尔巴尼亚裔重臣科普鲁律·穆罕默德帕夏提出唯一条件方肯接任大维齐尔：内廷绝不得掣肘其行政全权。在其父子铁腕革新下，崇高门庭宛如雄狮再醒。"
 oe_ptur.24.a: "授予科普鲁律大维齐尔全权御印，励精图治"
 oe_ptur.24.b: "维持内廷对大维齐尔的传统制衡"
 oe_ptur.25.title: "大土耳其战争"
 oe_ptur.25.desc: "卡拉·穆斯塔法帕夏将猩红帅帐扎在西方「金苹果」维也纳的棱堡城下。然而当波兰翼骑兵与德意志援军自卡伦山巅雷霆俯冲而下，庞大的欧洲神圣同盟遂在匈牙利、达尔马提亚与爱琴海全线发起反攻。"
 oe_ptur.25.a: "死守多瑙河棱堡防线，征召后备大军稳住战局"
 oe_ptur.25.b: "倾尽国力发动决死反攻，誓挽狂澜"
 oe_ptur.26.title: "卡洛维茨条约的外交震荡"
 oe_ptur.26.desc: "在一座特建四门、令各方使节齐步入场的木造议和亭内，奥斯曼书吏首次以列强平等条约的形式签署欧洲和约。卡洛维茨的震荡令远见之士警醒：单凭弯刀已难独支危局，帝国书吏长的如椽外交之笔从此不可或缺。"
 oe_ptur.26.a: "将帝国书吏长升格为常设外交中枢"
 oe_ptur.26.b: "拒绝条约妥协，厉兵秣马图谋立时雪耻"
 oe_ptur.27.title: "郁金香时代与穆特费里卡印局"
 oe_ptur.27.desc: "难得的和平十年催生了流光溢彩的「郁金香时代」：金角湾畔花苑亭台相映，出使巴黎的使臣带回天文星图与工程典籍。随着历史性教法裁决准许印行世俗书籍，易卜拉欣·穆特费里卡在伊斯坦布尔开办首座奥斯曼土耳其文活字印刷局。"
 oe_ptur.27.a: "特许穆特费里卡活字官印局与译书馆"
 oe_ptur.27.b: "顾全传统书法抄经行会，严格限制印刷范围"
 oe_ptur.28.title: "帕特罗纳·哈利勒起义"
 oe_ptur.28.desc: "东线失利、都城重税与对郁金香时代奢靡亭苑的不满在伊斯坦布尔巴扎瞬间引爆。在浴场杂役兼前水兵帕特罗纳·哈利勒率领下，哗变的耶尼切里与手工业者涌入古赛马场，怒吼着要求罢黜革新大臣并拆毁萨达巴德离宫。"
 oe_ptur.28.a: "果断镇压都城暴乱，力保官印局与新政火种"
 oe_ptur.28.b: "拆毁离宫、惩办宠臣以平息街头怒火"
 oe_ptur.29.title: "俄土大战与库楚克开纳吉和约"
 oe_ptur.29.desc: "远道自波罗的海绕航而来的北方舰队火烧爱琴海奥斯曼锚地，俄军刺刀亦沿德涅斯特河与克里米亚南压。库楚克开纳吉和约的惨痛教训昭然若揭：若无近代几何算学、速射铜炮与铜底战列舰，连黑海门户都将不保。"
 oe_ptur.29.a: "创办帝国海军与炮兵工程院，师法近代军工"
 oe_ptur.29.b: "增派旧式守备部队死守黑海诸要塞"
 oe_ptur.30.title: "塞利姆三世与尼扎姆新秩序军"
 oe_ptur.30.desc: "在欧陆革命风暴席卷之际即位的开明君主塞利姆三世召集二十二位重臣献策，正式揭开「尼扎姆·杰迪德」新秩序大幕。依托独立新财库供饷，身着新式军服、演练近代刺刀齐射的新军在旧兵营阴影之外昂然崛起。"
 oe_ptur.30.a: "全面推行尼扎姆·杰迪德新军与独立新财库"
 oe_ptur.30.b: "仅限炮兵与工兵现代化，暂不触动旧步兵"
 oe_ptur.31.title: "马哈茂德二世与吉祥事变"
 oe_ptur.31.desc: "目睹堂兄塞利姆三世惨遭守旧派推翻的马哈茂德二世隐忍绸缪，暗中争取托普哈内炮兵、乌里玛学者与行会长老支持。六月耶尼切里最后一次翻倒军锅哗变之时，苏丹毅然展扬先知圣旗，下令重炮轰击埃特梅达尼旧兵营！"
 oe_ptur.31.a: "彻底废除耶尼切里兵团，开创吉祥事变新纪元"
 oe_ptur.31.b: "仅保留礼仪性耶尼切里宫廷仪仗卫队"
 oe_ptur.32.title: "坦齐马特黎明与新生崇高门庭"
 oe_ptur.32.desc: "距奥斯曼骑兵初次饮马布尔萨城下已逾五百载，奥斯曼王朝再度浴火新生。近代部院取代陈旧官署，纪律严明的新式常备军守卫山河，保障全体臣民生命、荣誉与财产安全的改革敕令呼之欲出——崇高门庭正昂首迎接坦齐马特的曙光。"
 oe_ptur.32.a: "颁布坦齐马特重整诏书，迈向近代大帝国"
 oe_ptur.32.b: "兼顾近代军政革新与古老皇朝传统"
