 oe_flavor_byz.1004.t: "奥斯马里斯：教官曼努埃尔"
 oe_flavor_byz.1004.d: "（原名：穆拉德一世）\n\n奥斯马里斯家的曼努埃尔很少在宴席上久坐。比起席次与辞令，他更愿意待在城外的营地，观察盾墙如何转向、骑兵如何收束队列，以及疲惫的新兵怎样重新听清号令。领受教名之后，他并未向皇帝索求显职，而是从一名普通军官做起，与士兵一同在泥地里操练。\n\n起初，旁人只当这是贵族子弟的一时兴致。直到他的部下在反复演练中能够整齐换阵、溃而复集，老将们才开始留意这个沉默而严厉的年轻人。他把边地骑战的经验与罗马军中的阵法相互参照，将行军、扎营和接敌写成一条条可以反复操习的规程。\n\n呈到御前的荐书如今有了数位将领的署名：若让曼努埃尔主持更广泛的操练，这份才干便不必再局限于一支小队。"
 oe_flavor_byz.1004.a: "重用曼努埃尔。"
 oe_flavor_byz.1004.a.tt: "权威：#G +1#!。\n获得#Y 曼努埃尔的操练法#!，持续#G 20年#!：训练度#G +5%#!，陆军士气#G +10%#!。\n若奥斯马里斯已是豪族，影响力#G +50#!；否则成为豪族，并获得额外豪族名额#G +1#!（同一家族不重复增加）。"
 oe_flavor_byz.1004.historical_info: "穆拉德一世是奥尔汗之子，1362—1389年统治奥斯曼国家。他推动奥斯曼势力向巴尔干扩张，加强军政组织，最终在1389年的科索沃战役中身亡。服务于东罗马的教官曼努埃尔是本模组的架空改写。"
 oe_flavor_byz.1005.t: "奥斯马里斯：塞尔维亚的总督"
 oe_flavor_byz.1005.d: "（原名：穆拉德一世）\n\n五年来，曼努埃尔的操练规程已从首都营地传到各处驻军。那些曾在他麾下受训的军官，如今能够独自整顿队伍；他的军事才能，也不再只是荐书上的赞词。\n\n然而，塞尔维亚的臣服并不意味着当地事务已井然有序。驻军、地方显贵与帝国使臣各持一词，御前需要一位能让命令落到实处的总督。有人提议将当地改组为行省化附庸，把总督的印信交给曼努埃尔：他熟悉军务，又有足够的威望约束将士。\n\n也有人担心，首都刚刚建立的操练制度仍需他亲自照看。总督的印信与校场的号旗，皇帝必须替他作出选择。"
 oe_flavor_byz.1005.a: "派曼努埃尔去。"
 oe_flavor_byz.1005.a.tt: "塞尔维亚改为#Y 行省化附庸#!。曼努埃尔离开东罗马，成为#Y 塞尔维亚统治者#!。"
 oe_flavor_byz.1005.b: "他还是留在首都练兵吧。"
 oe_flavor_byz.1005.b.tt: "权威：#G +1#!。曼努埃尔留在东罗马。"
 oe_flavor_byz.1005.lapsed: "此事已无法按原议办理。"
 oe_flavor_byz.1005.lapsed.tt: "人物或塞尔维亚的状态已经改变，本次不再派任，也不发放奖励。"
 oe_flavor_byz.1005.historical_info: "穆拉德一世在真实历史中并非拜占庭任命的塞尔维亚总督，而是奥斯曼君主。他在巴尔干的扩张与塞尔维亚诸侯发生冲突，最终参加了1389年的科索沃战役。本事件将这一历史关系改写为东罗马的行省任命。"
 oe_flavor_byz.1006.t: "奥斯马里斯：淬毒的匕首"
 oe_flavor_byz.1006.d: "（原名：穆拉德一世）\n\n自曼努埃尔赴任塞尔维亚，已经过去五年。来自当地的急使却在深夜叩开宫门，递上的不是税册，也不是驻军的捷报。\n\n一名塞尔维亚人借呈递请愿之机靠近总督，忽然从衣下抽出匕首，刺入他的身体。卫兵当场制服了刺客，医师也迅速赶到，却没能阻止毒素随着血液蔓延。曼努埃尔曾在校场上教过无数人如何防备迎面而来的刀锋，最终却倒在一次近在咫尺的觐见之中。\n\n随急报送回的，还有一册边角磨损的操练手稿。纸上的队列仍旧整齐，执笔之人却已无法再发出号令。"
 oe_flavor_byz.1006.a: "愿主安息他的灵魂。"
 oe_flavor_byz.1006.a.tt: "#R 曼努埃尔遭到刺杀，去世。#!"
 oe_flavor_byz.1006.historical_info: "穆拉德一世于1389年科索沃战役期间身亡。后世传统常将其死亡归于一名塞尔维亚刺客，但遇害经过在不同史料中并不一致。赴任总督后遭淬毒匕首刺杀，是本模组借此设计的架空情节。"
 STATIC_MODIFIER_NAME_oe_osmaris_manuel_drill: "曼努埃尔的操练法"
 STATIC_MODIFIER_DESC_oe_osmaris_manuel_drill: "从扎营、行军到临敌变阵，曼努埃尔将军旅经验写成可反复操习的规程，使士卒信任彼此，也信任手中的号令。"
