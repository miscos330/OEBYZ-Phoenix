 oe_heg2_op_cultural_resentment: "反感宫廷文化傲慢与同化施压"
 oe_heg2_op_hegemon_restraint: "赞赏霸主主动克制维护均势"
 oe_heg2_adv_grand_hegemony: "大霸权与列强均势方略"
 oe_heg2_adv_grand_hegemony_desc: "在绝对君主制时代融汇大陆均势外交、跨洲常设使馆与总参谋部制度，强化外交容量、战果效率并加速四维霸权升阶。"
 oe_heg2_cb_dismantle_hegemony: "均势拆霸战争"
 oe_heg2_cb_dismantle_hegemony_PROV: "遏制多维超级霸主的均势之战"
 oe_heg2_cb_dismantle_hegemony_desc: "该超级帝国集多项世界霸权或高阶霸主威权于一身，已严重威胁诸强均势。独立列强当合纵出师，挫其锋芒、拆解其单极霸权。"
 oe_heg2_cb_free_seas_charter: "公海自由航行战争"
 oe_heg2_cb_free_seas_charter_PROV: "打破海权霸主海上垄断之战"
 oe_heg2_cb_free_seas_charter_desc: "海权霸主仗舰队之威垄断公海航路、强征临检与海峡抽成。我方舰队将出航破封，捍卫公海自由通航与商路公义。"
