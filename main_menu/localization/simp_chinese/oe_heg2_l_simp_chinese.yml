 oe_heg2_ci_maritime_search_right: "强征公海临检与海峡护航税"
 oe_heg2_ci_maritime_search_right_desc: "海权霸主专属外交施压：对非列强沿海国家强行征收公海临检权与海峡护航抽成，收取海贸贡金并削弱其海运与海权存在；若对方抗命，双方将互获贸易与公海自由航行宣战理由。冷却十年。"
 oe_heg2_ci_maritime_search_right_act: "向[SCOPE.sCountry('recipient').GetName]强征公海临检权与海峡护航税"
