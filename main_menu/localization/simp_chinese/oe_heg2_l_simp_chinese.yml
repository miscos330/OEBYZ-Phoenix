 oe_heg2_ci_demand_disarmament: "强令邻国签署限武协议"
 oe_heg2_ci_demand_disarmament_desc: "陆权霸主专属外交施压：以绝对军威迫使非列强独立邻国签署十年限武协议，大幅削弱其人力储备与募兵效率；若对方拒签，我方获得五年军事威胁宣战理由并推升全洲反霸张力。冷却十年。"
