 PROPOSE_oe_heg2_ci_sovereign_credit_leverage: "是否凭借经济霸权与清算信用向$RECIPIENT$索取关税与商贸特许？\n\n$INFO$"
 INCOMING_OFFER_oe_heg2_ci_sovereign_credit_leverage: "$ACTOR$凭借经济霸主与金融债主地位，要求我国签署十年关税与商贸特许条款。是否同意？\n\n$INFO$"
 INCOMING_OFFER_TITLE_oe_heg2_ci_sovereign_credit_leverage: "$oe_heg2_ci_sovereign_credit_leverage$"
 oe_heg2_ci_sovereign_credit_leverage_tt: "若对方妥协，我方获 #G +75#! 金币与 #G +4#! 威望，对方承受十年 #Y 被迫让渡主权金融与关税特许#!；若拒绝则获五年贸易宣战理由。"
 oe_heg2_ci_cultural_client_charter: "宫廷礼法与学术保护国宪章"
 oe_heg2_ci_cultural_client_charter_desc: "文化霸主专属外交倡议：与附庸或非列强国家缔结十年宫廷礼法与学术保护国宪章，大幅降低附庸独立倾向、提升我方文化影响力与威望，并赋予受约方学术与同化助力。冷却十年。"
 oe_heg2_ci_cultural_client_charter_act: "与[SCOPE.sCountry('recipient').GetName]缔结宫廷礼法与学术保护国宪章"
 oe_heg2_ci_cultural_client_charter_effect_text: "[SCOPE.sCountry('actor').GetName]与[SCOPE.sCountry('recipient').GetName]缔结了宫廷礼法与学术保护国宪章。"
 oe_heg2_ci_cultural_client_charter_effect_text_past: "[SCOPE.sCountry('actor').GetName]曾与[SCOPE.sCountry('recipient').GetName]缔结宫廷礼法与学术保护国宪章。"
 oe_heg2_ci_cultural_client_charter_reject_effect_text: "[SCOPE.sCountry('recipient').GetName]婉拒了文化霸主的宫廷礼法宪章以守护本土文脉。"
 oe_heg2_ci_cultural_client_charter_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName]拒绝了宫廷礼法与学术保护国宪章。"
 PROPOSE_oe_heg2_ci_cultural_client_charter: "是否向$RECIPIENT$倡议缔结十年宫廷礼法与学术保护国宪章？\n\n$INFO$"
 INCOMING_OFFER_oe_heg2_ci_cultural_client_charter: "$ACTOR$以文化霸主之尊邀请我国缔结十年宫廷礼法与学术保护国宪章。是否接受？\n\n$INFO$"
 INCOMING_OFFER_TITLE_oe_heg2_ci_cultural_client_charter: "$oe_heg2_ci_cultural_client_charter$"
 oe_heg2_ci_cultural_client_charter_tt: "若对方接受，附庸独立倾向降低 #G 15#!、我方主流文化获 #G +10#! 文化影响与 #G +6#! 威望，对方获得十年学术与同化宪章。"
 oe_heg2_player_only_tt: "仅限玩家控制的霸主国家手动颁行此项巅峰宣言"
 oe_heg2_dec_proclaim_mil_apex.title: "颁行大军团大陆霸权宣言"
 oe_heg2_dec_proclaim_mil_apex.desc: "身为二阶及以上陆权霸主，于京畿举行盛大阅兵并颁行大陆军制宣言：获得三十年强力陆军巅峰修正、陆军传统与威望，并将此巅峰功业镌刻入帝国编年史，但会显著推升全洲反霸张力。"
 oe_heg2_dec_proclaim_mil_apex.a: "阅兵宣誓，确立大陆军团巅峰霸权"
 oe_heg2_dec_proclaim_nav_apex.title: "颁行海洋宪章与舰队大检阅"
 oe_heg2_dec_proclaim_nav_apex.desc: "身为二阶及以上海权霸主，集结主力战列舰队举行大洋检阅并颁行海洋宪章：获得三十年海军巅峰修正、海军传统与威望，并镌刻入帝国编年史，代价是全洲反霸张力上升。"
 oe_heg2_dec_proclaim_nav_apex.a: "鸣炮检阅，颁行帝国四海宪章"
 oe_heg2_dec_proclaim_eco_apex.title: "确立全球金银清算本位"
 oe_heg2_dec_proclaim_eco_apex.desc: "身为二阶及以上经济霸主，将帝国央行与跨洲清算网络立为全球金银结算本位：获得三十年顶级商贸与低息信用巅峰修正并镌刻入帝国编年史，代价是令竞争对手愈发警惕。"
 oe_heg2_dec_proclaim_eco_apex.a: "御准颁行全球金银清算本位"
 oe_heg2_dec_proclaim_cul_apex.title: "召开帝国万国学术博览会"
 oe_heg2_dec_proclaim_cul_apex.desc: "身为二阶及以上文化霸主，邀集欧亚群贤于首都召开万国学术与艺术博览盛典：获得三十年文化科研巅峰修正、文化传统与影响力跃升，并镌刻入帝国编年史。"
 oe_heg2_dec_proclaim_cul_apex.a: "广延四方群贤，揭幕万国博览盛典"
 oe_heg2.1.title: "陆权霸主升阶：铁军震慑大陆"
 oe_heg2.1.desc: "从近卫炮兵公园到边疆要塞链，我国常备大军已建立起令诸强望尘莫及的组织纪律与纵深补给体系。各国驻节武官在呈往本国的密报中惊呼，大陆兵锋之天平已彻底向我方倾斜。"
 oe_heg2.1.a: "大张军威，向诸强宣示大陆霸主铁律"
 oe_heg2.1.b: "整肃军纪与内政，稳固霸权根基"
 oe_heg2.2.title: "海权霸主升阶：万帆统御大洋"
 oe_heg2.2.desc: "战列舰队的炮口与皇家海图官的航路志已将诸洋咽喉紧密相连。无论地中海、大西洋抑或季风洋面，商船皆仰我方护航旗帜而行，四海统御之气象蔚然大观。"
 oe_heg2.2.a: "扩编远洋巡弋舰队，确立制海铁律"
 oe_heg2.2.b: "顺势征收护航港税，充实海军内帑"
 oe_heg2.3.title: "经济霸主升阶：万邦货殖总汇"
 oe_heg2.3.desc: "各地银号汇票与远洋大宗货单最终皆汇聚于我国清算大厅。源源不绝的税商盈余与超低主权借贷成本令财政如磐，却也让失衡的竞争对手开始暗谋贸易反制。"
 oe_heg2.3.a: "趁势扩大跨洲清算盈余与市场主导权"
 oe_heg2.3.b: "回馈国内民生与基建，厚植长远国力"
 oe_heg2.4.title: "文化霸主升阶：万国仰望礼乐"
 oe_heg2.4.desc: "我国的宫廷语言、学术著作与艺术典范正跨越大洲传遍列国宫闱。从王公贵族到启蒙哲人皆以研习本朝典籍为荣，然外邦守旧派亦渐生文脉被夺之忧。"
 oe_heg2.4.a: "广设海外书院与礼法沙龙，弘扬帝国文宗"
 oe_heg2.4.b: "汇辑百家新知，推动本朝格致启蒙跃进"
 oe_heg2.5.title: "双维霸主震动列强"
 oe_heg2.5.desc: "消息传遍各大宫廷：我国已同时执掌两项世界霸权！往昔互为掣肘的强国使节连夜密会，警告若坐视单一帝国兼握双柄，欧亚均势恐将一去不返。"
 oe_heg2.5.a: "泰然受万邦敬畏，以强权昭告天下"
 oe_heg2.5.b: "派遣安抚使团，宣示有限克制以缓和猜忌"
 oe_heg2.6.title: "普遍君主制阴影：全洲合纵警报"
 oe_heg2.6.desc: "三项乃至更多世界霸权尽归我朝之手！从西欧议会到东方宫廷，“普遍君主制”的古老梦魇骤然苏醒。昔日势同水火的列强正紧急互派密使、互颁均势保障，誓要联手遏制我方独霸寰宇。"
 oe_heg2.6.a: "孤傲迎战天下合纵，展现无双帝国气魄"
 oe_heg2.6.b: "斥资缔结缓冲保障协定，暂时降温反霸浪潮"
 oe_heg2.7.title: "反霸权秘密外交公报：宿敌化干戈"
 oe_heg2.7.desc: "面对超级霸主步步紧逼的阴影，数个曾世代交恶的列强宫廷秘密送来密函——提议搁置百年旧怨，比照外交革命先例缔结反霸均势默契，共护列国存续。"
 oe_heg2.7.a: "签署均势密约，与诸列强捐弃前嫌共抗霸权"
 oe_heg2.7.b: "保持审慎中立，先固本培元静观其变"
 oe_heg2.8.title: "霸权陨落与帝国威信震荡"
 oe_heg2.8.desc: "随着强敌后来居上或战局逆转，我国曾引以为傲的一项世界霸权桂冠黯然易主。朝野上下议论纷纭，外邦使节亦趁机试探帝国余威是否尚存。"
 oe_heg2.8.a: "直面沧桑变局，卧薪尝胆重整国力"
 oe_heg2.8.b: "斥资抚慰朝野重振仪典，尽量挽回帝国颜面"
 oe_heg2.9.title: "大陆封锁与海上绞杀博弈"
 oe_heg2.9.desc: "面对列强日益紧密的反霸合纵，枢密院呈上激进方略：动用我方海贸或经济霸权，对不服管束的敌对强权全面推行封锁与禁运，以商战绞杀其财政命脉。"
 oe_heg2.9.a: "厉行大陆与海上封锁令，扼杀敌国商路"
 oe_heg2.9.b: "留一线商贸通途，收关税之利而免激化全面大战"
 oe_heg2.10.title: "万国宫廷语言与启蒙沙龙争鸣"
 oe_heg2.10.desc: "作为当世文化霸主，我国首都的皇家学院与贵族沙龙正成为各国使节、哲学家与剧作家唇枪舌剑的舞台。这份无形的软实力既可化作同化四方的利器，亦可哺育本土思想跃迁。"
 oe_heg2.10.a: "向列国宫廷推广本朝礼乐与通用外交语言"
 oe_heg2.10.b: "鼓励自由辩论与格致著述，加速国内科研突破"
 oe_heg2.11.title: "霸权张力触顶：终局大战前夜通牒"
 oe_heg2.11.desc: "全欧亚反霸权张力已飙升至沸点！各国驻节使馆频频召回密档，边疆与海峡战云密布。史官敏锐地察觉：一场决定数百年霸权归属的欧亚终局大战正迫在眉睫。"
 oe_heg2.11.a: "厉兵秣马迎向世纪决战，以战火定鼎单极秩序"
 oe_heg2.11.b: "颁布重大克制照会，力挽狂澜以延缓终局大战爆发"
 oe_heg2.12.title: "霸主克制与列强均势协定"
 oe_heg2.12.desc: "眼见全洲敌意不断积聚，一批深谋远虑的国务重臣进言：与其坐视诸强被逼上绝路结成死盟，不如主动召开大使会晤、宣示有限均势原则，以退为进保住霸权实利。"
 oe_heg2.12.a: "采纳均势克制方略，缓和全洲紧张局势"
 oe_heg2.12.b: "拒绝向弱者示弱，霸权唯凭实力维持"
 oe_heg2.90.title: "【审计读数】后期四维霸权与反霸张力仪表盘（Slot 85）"
