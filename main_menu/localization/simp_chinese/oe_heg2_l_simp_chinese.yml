 INCOMING_OFFER_TITLE_oe_heg2_ci_maritime_search_right: "$oe_heg2_ci_maritime_search_right$"
 oe_heg2_ci_maritime_search_right_tt: "若对方接受，我方征收 #G +60#! 金币与 #G +3#! 海军传统并施加十年海贸抽成；若拒签，我方获贸易宣战理由而对方亦获 #Y 公海自由航行战争#! 宣战理由。"
 oe_heg2_ci_sovereign_credit_leverage: "主权债信金融施压"
 oe_heg2_ci_sovereign_credit_leverage_desc: "经济霸主专属外交施压：凭借跨洲清算所与雄厚债信向负有债务或财力弱于我方的非列强国家施压，迫使其让渡十年关税与商贸特许并支付清算红利。冷却十年。"
 oe_heg2_ci_sovereign_credit_leverage_act: "以主权债信向[SCOPE.sCountry('recipient').GetName]索取关税与商贸特许"
 oe_heg2_ci_sovereign_credit_leverage_effect_text: "[SCOPE.sCountry('actor').GetName]以主权债信迫使[SCOPE.sCountry('recipient').GetName]让渡商贸与关税特许。"
 oe_heg2_ci_sovereign_credit_leverage_effect_text_past: "[SCOPE.sCountry('actor').GetName]曾以债信施压迫使[SCOPE.sCountry('recipient').GetName]让渡关税特许。"
