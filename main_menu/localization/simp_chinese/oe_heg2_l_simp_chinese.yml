# NEW 2026-11-22 v11.0 Worker 2 Slot 85: Late 4D Hegemons 0-Override Deepening (oe_heg2_). Generated by gen_late_hegemons.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_heg2_mil_tier1_mod: "陆权霸主：一阶常备威慑"
 STATIC_MODIFIER_DESC_oe_heg2_mil_tier1_mod: "庞大的常备军团令四邻慑服，陆军纪律与攻城组织度初显霸主气象，但也悄然招致列强猜忌。"
 STATIC_MODIFIER_NAME_oe_heg2_mil_tier2_mod: "陆权霸主：二阶大军团体系"
 STATIC_MODIFIER_DESC_oe_heg2_mil_tier2_mod: "跨越时代的常备军官团与后勤总署确立了陆战统治力，兵源动员与围城效率大增，诸强戒心愈深。"
 STATIC_MODIFIER_NAME_oe_heg2_mil_tier3_mod: "陆权霸主：三阶大陆霸权巅峰"
 STATIC_MODIFIER_DESC_oe_heg2_mil_tier3_mod: "百战铁军纵横欧亚大陆，纪律、攻城与人力动员登峰造极；然兵威赫赫亦成诸强合纵反霸之首靶。"
 STATIC_MODIFIER_NAME_oe_heg2_nav_tier1_mod: "海权霸主：一阶远洋巡弋"
 STATIC_MODIFIER_DESC_oe_heg2_nav_tier1_mod: "重型战列舰队常年巡弋咽喉海峡，海洋存在感与远洋商运效率稳步抬升。"
 STATIC_MODIFIER_NAME_oe_heg2_nav_tier2_mod: "海权霸主：二阶海峡主宰"
 STATIC_MODIFIER_DESC_oe_heg2_nav_tier2_mod: "连绵的海外军港与主力舰编队锁定主要海道，战舰火力与海贸红利俱增，却也引发海邦不满。"
 STATIC_MODIFIER_NAME_oe_heg2_nav_tier3_mod: "海权霸主：三阶四海统御巅峰"
 STATIC_MODIFIER_DESC_oe_heg2_nav_tier3_mod: "百艘主力战舰令大洋宛若内湖，主力舰战力、全球海权存在与海运效率臻于化境，代价是列强对海上垄断的敌意。"
 STATIC_MODIFIER_NAME_oe_heg2_eco_tier1_mod: "经济霸主：一阶货殖枢纽"
 STATIC_MODIFIER_DESC_oe_heg2_eco_tier1_mod: "丰沛的税商财源与遍布诸港的商团抬升了全国生产效率与商业吞吐，并引起竞争对手警觉。"
 STATIC_MODIFIER_NAME_oe_heg2_eco_tier2_mod: "经济霸主：二阶跨洲金融中枢"
 STATIC_MODIFIER_DESC_oe_heg2_eco_tier2_mod: "国债信用与跨洲票据清算压低融资利率并放大商团容量，财力碾压亦加速他国敌意积聚。"
 STATIC_MODIFIER_NAME_oe_heg2_eco_tier3_mod: "经济霸主：三阶金银本位霸权"
 STATIC_MODIFIER_DESC_oe_heg2_eco_tier3_mod: "执世界工坊与国际汇兑之牛耳，生产效率、商容与低息信用傲视全球，同时令失利诸强怨恨丛生。"
 STATIC_MODIFIER_NAME_oe_heg2_cul_tier1_mod: "文化霸主：一阶礼乐风尚"
 STATIC_MODIFIER_DESC_oe_heg2_cul_tier1_mod: "本朝语言、典章与宫廷礼仪广受四方仿效，文化影响力、识字率与声望稳步扬升。"
 STATIC_MODIFIER_NAME_oe_heg2_cul_tier2_mod: "文化霸主：二阶启蒙沙龙中心"
 STATIC_MODIFIER_DESC_oe_heg2_cul_tier2_mod: "京畿学府与宫廷沙龙汇聚各国硕儒，文化辐射与全民识字疾进，也激起外邦守护本族文脉的戒心。"
 STATIC_MODIFIER_NAME_oe_heg2_cul_tier3_mod: "文化霸主：三阶万国文宗巅峰"
 STATIC_MODIFIER_DESC_oe_heg2_cul_tier3_mod: "帝国语言与学术典范成为外交与思想界之通用标尺，文化影响、识字率与月度威望登顶，然文化压迫感亦招致反弹。"
 STATIC_MODIFIER_NAME_oe_heg2_overlord_isolation_1: "霸主孤立：一维戒心"
 STATIC_MODIFIER_DESC_oe_heg2_overlord_isolation_1: "执掌一维世界霸权虽彰国威，却已令各国使团开始戒备我方扩张意图。"
 STATIC_MODIFIER_NAME_oe_heg2_overlord_isolation_2: "霸主孤立：双维霸主警觉"
 STATIC_MODIFIER_DESC_oe_heg2_overlord_isolation_2: "同时独揽两项世界霸权令诸强深感均势倾覆，外交声誉承压，反霸张力持续累积。"
 STATIC_MODIFIER_NAME_oe_heg2_overlord_isolation_3: "霸主孤立：三极压顶合纵"
 STATIC_MODIFIER_DESC_oe_heg2_overlord_isolation_3: "三项霸权集于一身引发列强联手围堵，我方外交互信剧减，宿敌正暗中搁置旧怨以谋合纵。"
 STATIC_MODIFIER_NAME_oe_heg2_overlord_isolation_4: "霸主孤立：普遍君主制全洲警报"
 STATIC_MODIFIER_DESC_oe_heg2_overlord_isolation_4: "四维乃至五维霸权尽归一家，全欧亚诸强视之为“普遍君主制”之灭顶威胁，外交孤立达致极点，终局大战一触即发。"
 STATIC_MODIFIER_NAME_oe_heg2_disarmament_imposed_mod: "被迫签署霸主限武协定"
 STATIC_MODIFIER_DESC_oe_heg2_disarmament_imposed_mod: "在陆权霸主的兵威胁迫下被迫削减常备军额与兵站动员，十年内人力储备与募兵效率严重受限。"
 STATIC_MODIFIER_NAME_oe_heg2_maritime_search_tribute_mod: "承受公海临检与护航抽税"
 STATIC_MODIFIER_DESC_oe_heg2_maritime_search_tribute_mod: "商船被迫接受海权霸主战舰的公海临检并缴纳海峡护航抽成，海贸利润与海洋存在感显著下滑。"
 STATIC_MODIFIER_NAME_oe_heg2_credit_concession_mod: "被迫让渡主权金融与关税特许"
 STATIC_MODIFIER_DESC_oe_heg2_credit_concession_mod: "受制于经济霸主的债信施压，本国被迫开放商埠关税特许并承担更高借贷息差，财政主权受损。"
 STATIC_MODIFIER_NAME_oe_heg2_cultural_client_mod: "宫廷礼法与学术保护国宪章"
 STATIC_MODIFIER_DESC_oe_heg2_cultural_client_mod: "采纳文化霸主的宫廷礼法与学术章程，虽获科研交流便利并加速同化，但本土文化自主影响力受到压制。"
 STATIC_MODIFIER_NAME_oe_heg2_apex_mil_mod: "大军团大陆霸权宣言"
 STATIC_MODIFIER_DESC_oe_heg2_apex_mil_mod: "以御前阅兵与大陆军制宣言确立三十年陆权巅峰，三军士气、战果效率与陆军传统蒸蒸日上，而四邻忌惮益重。"
 STATIC_MODIFIER_NAME_oe_heg2_apex_nav_mod: "海洋宪章与大舰队检阅"
 STATIC_MODIFIER_DESC_oe_heg2_apex_nav_mod: "万帆云集的海洋宪章大检阅宣告了三十年制海巅峰，海军士气、水手储备、封锁效率与维护体系全面跃升。"
 STATIC_MODIFIER_NAME_oe_heg2_apex_eco_mod: "全球金银清算本位"
 STATIC_MODIFIER_DESC_oe_heg2_apex_eco_mod: "以帝国金库与跨洲清算网络为锚确立三十年金融本位，贸易收入、贷款容量、商团规模与超低利率并进。"
 STATIC_MODIFIER_NAME_oe_heg2_apex_cul_mod: "帝国万国学术博览盛典"
 STATIC_MODIFIER_DESC_oe_heg2_apex_cul_mod: "汇聚欧亚群贤的万国博览盛典确立了三十年文明灯塔地位，文化传统、科研速度、思潮传播与威望同步绽放。"
 STATIC_MODIFIER_NAME_oe_heg2_hegemony_eclipse_mod: "霸权陨落与威信震荡"
 STATIC_MODIFIER_DESC_oe_heg2_hegemony_eclipse_mod: "痛失世界霸主桂冠令朝野震动、盟邦观望，短期内宫廷威望、外交声誉与稳定投入皆受冲击。"
 STATIC_MODIFIER_NAME_oe_heg2_balance_pact_mod: "欧亚均势密约协同"
 STATIC_MODIFIER_DESC_oe_heg2_balance_pact_mod: "面对超级霸主压境，诸强抛却旧怨缔结均势密约，外交容量、关系修复与水陆战意同步提振。"
 STATIC_MODIFIER_NAME_oe_heg2_blockade_strangle_mod: "大陆封锁与海上绞杀冲击"
 STATIC_MODIFIER_DESC_oe_heg2_blockade_strangle_mod: "陆海霸权互施禁运与封锁，跨洲商船受阻、关税萎缩且民间厌战情绪暗生。"
 STATIC_MODIFIER_NAME_oe_heg2_restraint_accord_mod: "霸主克制与列强均势协定"
 STATIC_MODIFIER_DESC_oe_heg2_restraint_accord_mod: "霸主主动收敛锋芒并签署均势保障协定，显著缓和各方敌意、重塑外交声誉并稳固朝堂正统。"
