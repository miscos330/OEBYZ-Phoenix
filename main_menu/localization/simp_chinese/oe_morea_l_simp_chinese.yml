l_simp_chinese:
 oe_mo_sea_league: "曾与我们联手在海上抗击突厥人"
 oe_mo_latin_peace: "与摩里亚专制公国议和"
 oe_mo_argos_deal: "我们没有插手阿尔戈斯"
 oe_mo_knights_corinth: "把科林斯托付给了骑士团"
 oe_mo_dowry: "两家联姻"
 STATIC_MODIFIER_NAME_oe_mo_kephale_rule: "凯法勒治下"
 STATIC_MODIFIER_NAME_oe_mo_sea_watch: "摩里亚海防"
 STATIC_MODIFIER_NAME_oe_mo_mistra_walls: "米斯特拉的新城墙"
 STATIC_MODIFIER_NAME_oe_mo_knights_garrison: "骑士团驻防"
 STATIC_MODIFIER_NAME_oe_mo_corinth_walls: "科林斯的城防"
 STATIC_MODIFIER_NAME_oe_mo_ravaged: "摩里亚遭劫"
 oe_mo.1.t: "摩里亚专制公国"
 oe_mo.1.desc: "#F 1348年，约翰六世派次子曼努埃尔·坎塔库泽诺斯治理摩里亚；次年秋天，曼努埃尔在米斯特拉安顿下来，帝国在伯罗奔尼撒的残余领地从此称为摩里亚专制公国。#!\n\n米斯特拉离京城太远，凯法勒年年更替，地方豪强各行其是。宫中有人提议，把这片土地交给一位皇族成员，以专制公的身份常驻米斯特拉。合适的人选是[SCOPE.sCharacter('oe_mo_cand').GetName]。"
 oe_mo.1.a: "册封专制公"
 oe_mo.1.a.tt: "[SCOPE.sCharacter('oe_mo_cand').GetName]出任专制公；伯罗奔尼撒的军区成为宗室封邑（[oe_tu_status|e]），没有军区就以米斯特拉为治所新设一个\n花费#R 5#![oe_tu_authority|e]"
 oe_mo.1.b: "派凯法勒治理"
 oe_mo.1.b.tt: "我们在伯罗奔尼撒的每个地点获得[ShowModifier('oe_mo_kephale_rule')]，持续#Y 10#!年\n花费#R 2#![oe_tu_authority|e]"
 oe_mo.1.c: "暂不处理"
 oe_mo.2.t: "拉丁诸侯与海上的突厥人"
 oe_mo.2.desc: "#F 曼努埃尔·坎塔库泽诺斯压服了摩里亚的地方豪强，也和威尼斯、医院骑士团联手，在海上击退过突厥海盗。#!\n\n专制公的信使带来消息：亚该亚的拉丁诸侯在边境上虎视眈眈，突厥人的船又出现在摩里亚沿海。专制公请朝廷定下方略。"
 oe_mo.2.a: "联合威尼斯与骑士团出海"
 oe_mo.2.a.tt: "威尼斯和医院骑士团对我们好感#G +25#!\n我们在伯罗奔尼撒的每个沿海地点获得[ShowModifier('oe_mo_sea_watch')]，持续#Y 10#!年"
 oe_mo.2.b: "与亚该亚议和"
 oe_mo.2.b.tt: "亚该亚对我们好感#G +30#!"
 oe_mo.2.c: "加固米斯特拉"
 oe_mo.2.c.tt: "米斯特拉获得[ShowModifier('oe_mo_mistra_walls')]，持续#Y 20#!年"
 oe_mo.3.t: "坎塔库泽诺斯家的告别"
 oe_mo.3.desc: "#F 1380年曼努埃尔·坎塔库泽诺斯去世，亲族不肯交出米斯特拉；直到1383年，约翰五世之子狄奥多才接管摩里亚。#!\n\n[SCOPE.sCountry('oe_mo_theme').GetName]的专制公之位空了出来。上一位专制公出自与皇帝不同的家族，那个家族的人还守在米斯特拉，不肯轻易交权。"
 oe_mo.3.a: "派皇子接管"
 oe_mo.3.a.tt: "[SCOPE.sCharacter('oe_mo_cand').GetName]出任专制公\n[SCOPE.sCountry('oe_mo_theme').GetName]忠诚#R −15#!\n有#R 20%#!的可能当地起兵"
 oe_mo.3.b: "让原来的家族承袭"
 oe_mo.3.b.tt: "[SCOPE.sCharacter('oe_mo_heir').GetName]承袭专制公之位\n[SCOPE.sCountry('oe_mo_theme').GetName]忠诚#G +10#!"
 oe_mo.3.c: "收回为内地"
 oe_mo.3.c.tt: "[SCOPE.sCountry('oe_mo_theme').GetName]不再是宗室封邑，改为内地（[oe_tu_status|e]）\n忠诚#R −10#!"
 oe_mo.4.t: "阿尔戈斯与纳夫普利翁"
 oe_mo.4.desc: "#F 1388年，阿尔戈斯和纳夫普利翁的最后一位拉丁领主去世，摩里亚专制公狄奥多一世抢先占了阿尔戈斯；1394年，狄奥多一世又把这座城让给了威尼斯。#!\n\n阿尔戈斯一带如今在[SCOPE.sCountry('oe_mo_t').GetName]手里，和我们在摩里亚的领地相邻。"
 oe_mo.4.a: "索取阿尔戈斯"
 oe_mo.4.a.tt: "获得对[SCOPE.sCountry('oe_mo_t').GetName]的宣战理由，持续#Y 10#!年"
 oe_mo.4.b: "让威尼斯去争"
 oe_mo.4.b.tt: "威尼斯对我们好感#G +20#!"
 oe_mo.4.c: "不插手"
 oe_mo.5.t: "科林斯的托管"
 oe_mo.5.desc: "#F 1395年前后，狄奥多一世买下科林斯，却无力修城防守，1397年又把科林斯卖给了罗得岛的医院骑士团。#!\n\n[SCOPE.sCountry('oe_mo_foe').GetName]的军队已经进入希腊，科林斯首当其冲。城墙年久失修，守军也不够。"
 oe_mo.5.a: "交医院骑士团驻防"
 oe_mo.5.a.tt: "科林斯获得[ShowModifier('oe_mo_knights_garrison')]，持续#Y 7#!年\n医院骑士团对我们好感#G +20#!"
 oe_mo.5.b: "自己修城"
 oe_mo.5.b.tt: "科林斯获得[ShowModifier('oe_mo_corinth_walls')]，持续#Y 20#!年"
 oe_mo.5.c: "听之任之"
 oe_mo.6.t: "重修六里墙"
 oe_mo.6.desc: "#F 1415年春，曼努埃尔二世亲自督修科林斯地峡的六里墙，四十天完工；沉重的劳役让摩里亚的豪强怨声载道。#!\n\n[SCOPE.sCountry('oe_mo_foe').GetName]的骑兵随时可能越过科林斯地峡。地峡上的长城只剩残垣，要守住摩里亚，就得把它重新修起来。"
 oe_mo.6.a: "皇帝亲临督修"
 oe_mo.6.a.tt: "在科林斯修成#bold #color_yellow 六里墙#!#!\n伯罗奔尼撒的军区忠诚#R −10#!（如果有）"
 oe_mo.6.b: "由专制公和地方分摊"
 oe_mo.6.b.tt: "在科林斯修成#bold #color_yellow 六里墙#!#!\n伯罗奔尼撒的军区忠诚#R −15#!"
 oe_mo.6.c: "不修"
 oe_mo.7.t: "长城失守"
 oe_mo.7.desc: "#F 六里墙一再被攻破或拆毁：1423年、1431年和1446年。#!\n\n[SCOPE.sCountry('oe_mo_foe').GetName]的军队攻进了科林斯。#bold #color_yellow 六里墙#!#!已被拆毁，敌骑在摩里亚四处劫掠，我们在伯罗奔尼撒的每个地点获得[ShowModifier('oe_mo_ravaged')]，持续#Y 5#!年。"
 oe_mo.7.a: "遣使求和"
 oe_mo.7.a.tt: "可以在罗马文明圈用“遣使纳币”向强敌求和"
 oe_mo.7.b: "号召摩里亚人坚守"
 oe_mo.8.t: "托科家的嫁妆"
 oe_mo.8.desc: "#F 1427年埃基纳德斯海战后，卡洛·托科放弃了在埃利斯的领地；1428年，君士坦丁迎娶托科的侄女，格拉伦扎作为嫁妆归了拜占庭。#!\n\n安德拉维达一带在[SCOPE.sCountry('oe_mo_t').GetName]手里。对方势单力薄，愿意以联姻收场：一位皇族成员迎娶对方的公主，这片土地作为嫁妆交给帝国。"
 oe_mo.8.a: "联姻并接受嫁妆"
 oe_mo.8.a.tt: "安德拉维达归帝国\n[SCOPE.sCountry('oe_mo_t').GetName]对我们好感#G +30#!"
 oe_mo.8.b: "武力夺取"
 oe_mo.8.b.tt: "获得对[SCOPE.sCountry('oe_mo_t').GetName]的宣战理由，持续#Y 10#!年"
 oe_mo.8.c: "婉拒"
 oe_mo.9.t: "围攻帕特雷"
 oe_mo.9.desc: "#F 1429年，君士坦丁围攻帕特雷，城中百姓先降，大主教的城堡守到1430年。#!\n\n帕特雷在[SCOPE.sCountry('oe_mo_t').GetName]手里，和我们在摩里亚的领地接壤。"
 oe_mo.9.a: "出兵围城"
 oe_mo.9.a.tt: "获得对[SCOPE.sCountry('oe_mo_t').GetName]的宣战理由，持续#Y 10#!年"
 oe_mo.9.b: "出钱赎买"
 oe_mo.9.b.tt: "帕特雷归帝国；哈兰德里察如果也属对方，一并归帝国"
 oe_mo.9.c: "不动"
 oe_mo.10.t: "亚该亚的女继承人"
 oe_mo.10.desc: "#F 1432年，亚该亚亲王森图里奥内二世·扎卡里亚去世；女继承人卡特琳娜已嫁给托马斯·巴列奥略，亚该亚公国并入帝国。#!\n\n亚该亚公国只剩寥寥几座城堡。亲王年老无子，愿意把女儿嫁给一位皇族成员，公国从此依附帝国。"
 oe_mo.10.a: "迎娶女继承人"
 oe_mo.10.a.tt: "亚该亚成为我们的#bold #color_yellow 罗马同盟#!#!附庸；按附庸阶梯，以后可以[oe_tu_provincialise|e]"
 oe_mo.10.b: "等它自行瓦解"
 oe_mo.11.t: "兄弟之争"
 oe_mo.11.desc: "#F 1440年代，巴列奥略诸兄弟为摩里亚和京城附近的封地明争暗斗；1449年，托马斯与德米特里奥斯同为摩里亚专制公。#!\n\n皇帝的几位成年亲属都想在摩里亚有一席之地，专制公府里的争吵已经传到京城。"
 oe_mo.11.a: "两人共治"
 oe_mo.11.a.tt: "摩里亚的军区忠诚#R −10#!"
 oe_mo.11.b: "召一人入京"
 oe_mo.11.c: "由专制公独掌"
 oe_mo.11.c.tt: "摩里亚的军区忠诚#G +5#!"
 oe_mo.12.t: "米斯特拉的拥立"
 oe_mo.12.desc: "#F 1449年1月6日，君士坦丁在米斯特拉以简朴的仪式被拥立为帝，三个月后才进入君士坦丁堡。#!\n\n新皇帝[SCOPE.sCharacter('oe_mo_emp').GetName]登基时正在米斯特拉。是即刻启程赴京，还是先在米斯特拉举行仪式？"
 oe_mo.12.a: "即刻赴京"
 oe_mo.12.b: "先在米斯特拉举行仪式"
