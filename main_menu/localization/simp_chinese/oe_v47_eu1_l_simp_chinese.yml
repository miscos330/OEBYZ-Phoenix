l_simp_chinese:
 oe_sit_v47_varna_crusade: "瓦尔纳大捷：三国巴尔干十字军"
 oe_sit_v47_varna_crusade_desc: "公元1444年，波兰、匈牙利与拜占庭在多瑙河与黑海之滨距改写历史仅咫尺之遥。缔结雅盖隆—匈雅提—巴列奥略三国密约、以联军桨帆船锁死双海峡并挥师胡斯战车阵光复鲁米利亚；抑或发动奥斯曼反圣战总动员，令新月旗帜稳踞埃迪尔内与多瑙河防线！"
 oe_v47_varna_end_crusade_victory: "瓦尔纳大捷：巴尔干全面光复"
 oe_v47_varna_end_crusade_victory_desc: "严明的三国联军协同与滴水不漏的海峡封锁彻底改写了1444年的历史命运，打破奥斯曼在多瑙河以南的霸权，开启巴尔干三国新秩序。"
 oe_v47_varna_end_ottoman_triumph: "多瑙河畔的新月凯歌"
 oe_v47_varna_end_ottoman_triumph_desc: "奥斯曼反圣战雷霆破阵，在鲁米利亚门户前击溃三国十字军同盟，奠定帝国统御巴尔干半岛数百年之基业。"
 oe_v47_varna_end_danube_stalemate: "多瑙河分界与武装停战"
 oe_v47_varna_end_danube_stalemate_desc: "至公元1520年，十字军与反圣战皆未能彻底倾覆对手，双方在多瑙河沿岸构筑重重石堡，转入漫长的边防武装均势。"
 oe_v47_varna_map_crusade_tt: "#Y 三国十字军联军阵营#!：波兰、匈牙利、拜占庭及巴尔干、威尼斯盟邦，正水陆并进挺进鲁米利亚。"
 oe_v47_varna_map_ottoman_tt: "#Y 奥斯曼鲁米利亚阵营#!：扼守埃迪尔内、安纳托利亚与巴尔干咽喉的奥斯曼苏丹国及其盟友。"
 oe_v47_varna_map_front_tt: "#Y 巴尔干—多瑙河争夺战区#!：双方大军反复拉锯的沿河渡口、山隘与战略要冲。"
 oe_v47_varna_legend_crusade: "三国巴尔干十字军盟邦"
 oe_v47_varna_legend_ottoman: "奥斯曼鲁米利亚军团"
 oe_v47_varna_legend_front: "巴尔干—多瑙河争夺战区"
 OE_V47_VARNA_GUI_HDR_ERA: "十字军窗口"
 OE_V47_VARNA_GUI_HDR_METER: "十字军势能"
 OE_V47_VARNA_GUI_CARD_TITLE: "三国联军决战瓦尔纳与鲁米利亚"
 OE_V47_VARNA_GUI_CARD_BODY: "将十字军势能推升至+75以上（或于1452年后令奥斯曼尽失瓦尔纳与埃迪尔内）即可赢得“瓦尔纳大捷”；若执掌奥斯曼将其压至-75以下则可奏响“多瑙河畔的新月凯歌”。善用五项专属互动统筹三国密约、战车阵、海峡封锁与反圣战总动员。"
 OE_V47_VARNA_GUI_GAUGE_LABEL: "十字军势能（-100 奥斯曼反胜 <---> +100 三国大捷）"
 OE_V47_VARNA_GUI_FOOTNOTE: "数据地图说明：金色为三国巴尔干十字军阵营；绯红色为奥斯曼鲁米利亚军团；钢蓝色为多瑙河与巴尔干争夺战区。"
 hint_oe_sit_v47_varna_crusade: "[GetSituationByKey('oe_sit_v47_varna_crusade').GetNameWithNoTooltip]"
 hint_oe_sit_v47_varna_crusade_hint_text: "#T 局势概览#!\n@hint! #Y 《瓦尔纳大捷：三国巴尔干十字军》#! 活跃于 #Y 1444–1520年#!。通过五项专属互动协调 #Y 波兰#!、#Y 匈牙利#! 与 #Y 拜占庭#!，将 #Y 十字军势能#! 推至 #G +75#! 以上改写瓦尔纳天命；或执掌 #Y 奥斯曼#! 发动反圣战压至 #R -75#! 巩固巴尔干霸业。"
 hint_oe_sit_v47_varna_crusade_administrative: "颁布“巴尔干解放与自治宪章”可大幅加速保加利亚、塞尔维亚与色雷斯的整合与兵源募集，仅略微让渡部分王室直辖权。"
 hint_oe_sit_v47_varna_crusade_diplomatic: "缔结“三国联军十字军密约”可立即赋予对奥斯曼十字军宣战借口、+1.2外交声誉与+16十字军势能。"
 hint_oe_sit_v47_varna_crusade_military: "将“多瑙河战车阵与重枪骑”（+10%重骑战力、+7%围城能力）与“双海峡封锁舰队”搭配施行，可逐个击破奥斯曼东西两军。"
 oe_sit_v47_third_rome_union: "双鹰合璧：莫斯科与君士坦丁堡"
 oe_sit_v47_third_rome_union_desc: "索菲娅·巴列奥略公主北嫁莫斯科，开启了纵贯克里姆林与博斯普鲁斯的宏大东正教帝国轴心。无论拜占庭依然屹立、与莫斯科缔结“北方凯撒—巴西琉斯”双鹰共治，抑或新罗马已然倾覆、将“第三罗马”大统衣钵北传莫斯科，皆可通过迎亲使团、双头鹰国玺、黑海东正教同盟与希腊—罗斯文艺复兴铸就不朽帝业。"
 oe_v47_twin_end_co_emperorship: "双鹰并耀：北方凯撒与罗马共治帝国"
 oe_v47_twin_end_co_emperorship_desc: "在君士坦丁堡依然屹立之际将双鹰凝聚度推至85以上，莫斯科与新罗马正式确立纵贯白海至爱琴海的双都共治盛世。"
 oe_v47_twin_end_third_rome: "莫斯科即第三罗马：帝国大统北传"
 oe_v47_twin_end_third_rome_desc: "在新罗马已逝之际将双鹰凝聚度推至85以上，莫斯科庄严承接第三罗马紫袍大统，昂然屹立为东正教世界唯一帝国砥柱。"
 oe_v47_twin_end_separate_destinies: "南北东正教共同体和约"
 oe_v47_twin_end_separate_destinies_desc: "至公元1565年，莫斯科与希腊东方虽各自走上独立政治道路，仍以共有的礼仪典籍与圣像艺术维系深厚东正教共同体纽带。"
 oe_v47_twin_map_axis_tt: "#Y 双鹰帝国核心轴心#!：莫斯科、俄罗斯、拜占庭、特拉比松、西奥多罗及宣誓加盟的巴列奥略—留里克轴心成员。"
 oe_v47_twin_map_orthodox_tt: "#Y 东正教共同体诸邦#!：遍布罗斯、巴尔干与黑海沿岸、深受希腊—罗斯文艺复兴浸润的东正教国家。"
 oe_v47_twin_map_rivals_tt: "#Y 草原、奥斯曼与波罗的海竞争强权#!：对双鹰轴心崛起深怀戒心的周边强国。"
 oe_v47_twin_legend_axis: "双鹰帝国核心轴心（莫斯科/罗斯/拜占庭）"
 oe_v47_twin_legend_orthodox: "东正教共同体诸邦"
 oe_v47_twin_legend_rivals: "周边竞争强权"
 OE_V47_TWIN_GUI_HDR_ERA: "双鹰纪元"
 OE_V47_TWIN_GUI_HDR_METER: "双鹰凝聚度"
 OE_V47_TWIN_GUI_CARD_TITLE: "紫衣公主联姻、双头鹰国玺与双都共治"
 OE_V47_TWIN_GUI_CARD_BODY: "将双鹰轴心凝聚度提升至85以上即可定鼎结局！若拜占庭犹存，将成就“北方凯撒与罗马共治帝国”；若拜占庭已陷，则开启“莫斯科即第三罗马”大统北传。灵活运用五项互动推进皇室迎亲、双头鹰国玺、黑海同盟与希腊—罗斯文艺复兴。"
 OE_V47_TWIN_GUI_GAUGE_LABEL: "双鹰轴心凝聚度（达85以上加冕双鹰共治或第三罗马）"
 OE_V47_TWIN_GUI_FOOTNOTE: "数据地图说明：帝国紫为双鹰轴心核心成员；黑海青为东正教共同体诸邦；赤赭色为周边草原、奥斯曼与波罗的海竞争强权。"
 hint_oe_sit_v47_third_rome_union: "[GetSituationByKey('oe_sit_v47_third_rome_union').GetNameWithNoTooltip]"
 hint_oe_sit_v47_third_rome_union_hint_text: "#T 局势概览#!\n@hint! #Y 《双鹰合璧：莫斯科与君士坦丁堡》#! 活跃于 #Y 1460–1565年#!，并随 #Y 拜占庭存亡#! 实时切换史诗分支！当拜占庭存续且 #Y 双鹰凝聚度达85+#! 时达成 #G 双鹰并耀共治帝国#!；若拜占庭已陷则成就 #G 莫斯科即第三罗马#!。"
 hint_oe_sit_v47_third_rome_union_administrative: "颁行“双头鹰帝国国玺”（+12%王权、+8%内阁效率）与“希腊—罗斯文艺复兴”（+5%科研、+12%制度传播）相得益彰，助莫斯科迅速完成近代转型。"
 hint_oe_sit_v47_third_rome_union_diplomatic: "派遣“巴列奥略联姻使团”可提供+1.4外交声誉与丰厚正统性，并顺势开启北方凯撒或第三罗马加冕大典。"
 hint_oe_sit_v47_third_rome_union_military: "缔结“黑海东正教同盟”可充实人力与海陆商路，配合克里姆林白石要塞与炮厂修正可稳稳压制草原与海峡劲敌。"
 oe_sit_v47_andalus_resurgent: "安达卢斯复兴与新科尔多瓦跨洋流亡"
 oe_sit_v47_andalus_resurgent_desc: "公元1444年，纳斯尔王朝治下的格拉纳达死守着西欧最后一片伊斯兰沃土。你既可依托阿尔罕布拉险隘，号召摩洛哥与开罗马穆鲁克跨海驰援直布罗陀、一举光复科尔多瓦与塞维利亚；亦可在伊比利亚重炮紧逼之际毅然启航大西洋流亡舰队，经西非佛得角直抵巴西翠岸，开创大洋彼岸的“新科尔多瓦”！"
 oe_v47_andalus_end_resurgent: "安达卢斯复兴：新月重临科尔多瓦与塞维利亚"
 oe_v47_andalus_end_resurgent_desc: "格拉纳达携手马格里布与马穆鲁克奇迹般逆转收复失地浪潮，令伊斯兰文教、水利与商贸盛世重耀科尔多瓦与塞维利亚。"
 oe_v47_andalus_end_new_cordoba: "大洋彼岸的新科尔多瓦苏丹国"
 oe_v47_andalus_end_new_cordoba_desc: "宁折不弯的安达卢斯航海家与学者乘信风掠过阿金港与佛得角，在巴西翠岸建起一座横跨大西洋、永不熄灭的新科尔多瓦。"
 oe_v47_andalus_end_iberia_resolved: "纳斯尔边疆的黄昏余韵"
 oe_v47_andalus_end_iberia_resolved_desc: "至公元1545年，围绕伊比利亚南境的世纪博弈终告尘埃落定，安达卢斯的灌溉水利、丝绸织艺与航海传奇长留海峡两岸。"
 oe_v47_andalus_map_resurgent_tt: "#Y 安达卢斯复兴阵营#!：格拉纳达、摩洛哥、马穆鲁克及誓死保卫并光复安达卢斯的伊斯兰盟邦。"
 oe_v47_andalus_map_reconquista_tt: "#Y 伊比利亚收复失地阵营#!：卡斯蒂利亚、阿拉贡、葡萄牙及其盟军，正以重炮步步紧逼格拉纳达。"
 oe_v47_andalus_map_exile_tt: "#Y 大西洋流亡航路（新科尔多瓦）#!：佛得角、西非阿金港踏脚点、巴西翠岸落脚点及跨洋流亡舰队。"
 oe_v47_andalus_legend_resurgent: "安达卢斯复兴阵营（格拉纳达/摩洛哥/马穆鲁克）"
 oe_v47_andalus_legend_reconquista: "伊比利亚收复失地诸王"
 oe_v47_andalus_legend_exile: "新科尔多瓦大西洋流亡航路"
 OE_V47_ANDALUS_GUI_HDR_ERA: "安达卢斯抉择"
 OE_V47_ANDALUS_GUI_HDR_METER: "安达卢斯运势"
 OE_V47_ANDALUS_GUI_CARD_TITLE: "逆转收复失地抑或跨洋另建新科尔多瓦"
 OE_V47_ANDALUS_GUI_CARD_BODY: "将安达卢斯运势推升至+75以上（或令格拉纳达、科尔多瓦与塞维利亚尽归逊尼派掌控）即可迎来“安达卢斯复兴”；若遭伊比利亚重炮围困至绝境，则可果断启航大西洋流亡舰队探明佛得角、西非与巴西，将运势推至-65以下缔造“大洋彼岸的新科尔多瓦”！"
 OE_V47_ANDALUS_GUI_GAUGE_LABEL: "安达卢斯运势（-100 跨洋新科尔多瓦 <---> +100 伊比利亚复兴）"
 OE_V47_ANDALUS_GUI_FOOTNOTE: "数据地图说明：翡翠绿为格拉纳达、摩洛哥与马穆鲁克盟邦；暖琥珀色为伊比利亚收复失地诸国；蔚海蓝标示佛得角、西非与巴西的新科尔多瓦流亡航路。"
 hint_oe_sit_v47_andalus_resurgent: "[GetSituationByKey('oe_sit_v47_andalus_resurgent').GetNameWithNoTooltip]"
 hint_oe_sit_v47_andalus_resurgent_hint_text: "#T 局势概览#!\n@hint! #Y 《安达卢斯复兴与新科尔多瓦跨洋流亡》#! 活跃于 #Y 1444–1545年#!。两大史诗命运任君抉择：携手摩洛哥与马穆鲁克将 #Y 安达卢斯运势#! 推升至 #G +75#!（或光复科尔多瓦与塞维利亚），抑或绝地启航 #B 大西洋流亡舰队#! 经佛得角、西非直抵巴西建立 #Y 新科尔多瓦#!。"
 hint_oe_sit_v47_andalus_resurgent_administrative: "若选择坚守伊比利亚，宜颁布“科尔多瓦复兴宪章”拉升科研与产值；若走跨洋流亡线，则可将大西洋舰队与廷巴克图黄金商道紧密衔接。"
 hint_oe_sit_v47_andalus_resurgent_diplomatic: "启动“直布罗陀海峡圣战同盟”可获得对卡斯蒂利亚光复安达卢斯的宣战借口，凝聚摩洛哥与马穆鲁克外援合力破局。"
 hint_oe_sit_v47_andalus_resurgent_military: "加固阿尔罕布拉山隘可赋予+14%要塞防御与-10%陆军损耗，既可耗尽卡斯蒂利亚围城重炮锐气，亦能为流亡舰队争取宝贵的出海窗口。"
 oe_v47_act_varna_three_crown_compact: "缔结三国联军十字军密约"
 oe_v47_act_varna_three_crown_compact_desc: "将波兰、匈牙利与君士坦丁堡纳入统一巴尔干战时统帅部，协同渡河时机与海峡封锁，彻底避免瓦尔纳孤军冒进之祸。"
 oe_v47_act_varna_three_crown_compact_tt: "十字军势能 #G +16#!，将本国纳入 #Y 三国联军阵营#!，获得为期12年的 #Y 三国联军十字军盟约#! 修正，并在奥斯曼存续时授予对奥斯曼十字军宣战借口。"
 oe_v47_act_varna_danube_wagon_forts: "编组多瑙河胡斯战车阵与重枪骑"
 oe_v47_act_varna_danube_wagon_forts_desc: "将匈牙利名将匈雅提的铁链战车堡垒与波兰重装枪骑兵紧密编组，以机动野战工事突破巴尔干山口并压制耶尼切里反扑。"
 oe_v47_act_varna_danube_wagon_forts_tt: "十字军势能 #G +14#!，陆军传统 #G +6#!，并获得为期12年的 #Y 多瑙河战车阵与重骑协同#! 修正。"
 oe_v47_act_varna_strait_blockade: "联军桨帆舰队封锁双海峡"
 oe_v47_act_varna_strait_blockade_desc: "调集威尼斯、教廷与君士坦丁堡的战船巡弋达达尼尔与博斯普鲁斯海峡，死死锁住穆拉德二世自安纳托利亚西渡增援的咽喉。"
 oe_v47_act_varna_strait_blockade_tt: "十字军势能 #G +15#!，海军传统 #G +6#!，并获得为期12年的 #Y 达达尼尔—博斯普鲁斯海峡封锁舰队#! 修正。"
 oe_v47_act_varna_balkan_liberation_charter: "颁布巴尔干诸邦解放与自治宪章"
 oe_v47_act_varna_balkan_liberation_charter_desc: "向保加利亚、塞尔维亚、阿尔巴尼亚与色雷斯城邦颁授自治特许与教派和解誓书，号召各地基督教居民起义迎候联军。"
 oe_v47_act_varna_balkan_liberation_charter_tt: "十字军势能 #G +13#!，稳定度 #G +4#!，并获得为期12年的 #Y 巴尔干解放与自治特许宪章#! 修正。"
 oe_v47_act_varna_ottoman_ghazi_rally: "发动鲁米利亚反圣战与海峡强渡"
 oe_v47_act_varna_ottoman_ghazi_rally_desc: "架设岸防火炮掩护安纳托利亚西帕希与耶尼切里军团强渡海峡，以雷霆反攻粉碎三国联军并保卫埃迪尔内。"
 oe_v47_act_varna_ottoman_ghazi_rally_tt: "十字军势能 #R -18#!（奥斯曼反击），陆军传统 #G +6#!，并获得为期12年的 #Y 鲁米利亚加齐反圣战总动员#! 修正。"
 oe_v47_act_twin_sophia_embassy: "遣使迎娶巴列奥略紫衣公主"
 oe_v47_act_twin_sophia_embassy_desc: "隆重派遣迎亲使团护送索菲娅·巴列奥略公主、希腊硕学与圣像礼器北上莫斯科，以皇室联姻熔铸两座东正教古都的血脉纽带。"
 oe_v47_act_twin_sophia_embassy_tt: "双鹰轴心凝聚度 #G +12#!，威望 #G +6#!，并获得为期12年的 #Y 巴列奥略紫衣公主联姻使团#! 修正。"
 oe_v47_act_twin_double_eagle_seal: "颁行双头鹰帝国国玺"
 oe_v47_act_twin_double_eagle_seal_desc: "将象征东望亚洲、西顾欧陆的拜占庭双头鹰铸为国家最高印玺，在外交诏书与国内法典中彰显罗马帝统尊严。"
 oe_v47_act_twin_double_eagle_seal_tt: "双鹰轴心凝聚度 #G +13#!，正统性 #G +6#!，并获得为期12年的 #Y 双头鹰帝国国玺新制#! 修正。"
 oe_v47_act_twin_northern_caesar: "册封北方共治凯撒或昭告第三罗马"
 oe_v47_act_twin_northern_caesar_desc: "若君士坦丁堡犹存，则立莫斯科为北方共治凯撒以缔结双鹰共治；若新罗马已陷，则庄严宣告莫斯科承继第三罗马大统。"
 oe_v47_act_twin_northern_caesar_tt: "双鹰轴心凝聚度 #G +14#!，威望 #G +8#!，获得为期14年的 #Y 北方凯撒共治与帝统承续#! 修正，并依据拜占庭存亡触发对应的加冕分支事件。"
 oe_v47_act_twin_black_sea_league: "缔结黑海东正教护航同盟"
 oe_v47_act_twin_black_sea_league_desc: "联结莫斯科、克里米亚哥特公国、摩尔达维亚与君士坦丁堡，共护第聂伯—顿河与黑海航道，保障毛皮、谷物与朝圣商船畅行。"
 oe_v47_act_twin_black_sea_league_tt: "双鹰轴心凝聚度 #G +11#!，陆军传统 #G +5#!，并获得为期12年的 #Y 黑海东正教海陆同盟#! 修正。"
 oe_v47_act_twin_greco_russian_renaissance: "资助希腊—罗斯文艺复兴"
 oe_v47_act_twin_greco_russian_renaissance_desc: "礼聘拜占庭希腊文人、阿索斯山译经僧侣与意大利建筑大师兴修圣母安息大教堂与皇家书库，点燃跨越北南两都的文化复兴。"
 oe_v47_act_twin_greco_russian_renaissance_tt: "双鹰轴心凝聚度 #G +12#!，科研进度 #G +10#!，并获得为期14年的 #Y 希腊—罗斯文艺复兴学府#! 修正。"
 oe_v47_act_andalus_alhambra_defiance: "加固阿尔罕布拉与内华达山险隘"
 oe_v47_act_andalus_alhambra_defiance_desc: "重修阿尔罕布拉红宫城垣与内华达雪山烽火台网，囤积谷地军粮并整肃山地轻骑，使格拉纳达成为伊比利亚最难攻克的铁壁。"
 oe_v47_act_andalus_alhambra_defiance_tt: "安达卢斯运势 #G +14#!，陆军传统 #G +5#!，并获得为期12年的 #Y 阿尔罕布拉山隘铁壁守备#! 修正。"
 oe_v47_act_andalus_gibraltar_jihad: "号召摩洛哥与马穆鲁克跨海驰援"
 oe_v47_act_andalus_gibraltar_jihad_desc: "遣使疾赴非斯、马拉喀什与开罗，邀集摩洛哥铁骑与马穆鲁克火炮匠师横渡直布罗陀海峡，扭转伊比利亚南境兵力悬殊之局。"
 oe_v47_act_andalus_gibraltar_jihad_tt: "安达卢斯运势 #G +16#!，获得为期12年的 #Y 直布罗陀海峡援军圣战同盟#! 修正，并在卡斯蒂利亚存续时授予光复安达卢斯宣战借口。"
 oe_v47_act_andalus_cordoba_charter: "颁布科尔多瓦与塞维利亚复兴宪章"
 oe_v47_act_andalus_cordoba_charter_desc: "在瓜达尔基维尔河谷重兴科尔多瓦书院、水利橘园与塞维利亚丝绸工坊，以兼容并包的文教盛况凝聚安达卢斯民心。"
 oe_v47_act_andalus_cordoba_charter_tt: "安达卢斯运势 #G +16#!，威望 #G +8#!，并获得为期14年的 #Y 科尔多瓦大清真寺复兴宪章#! 修正。"
 oe_v47_act_andalus_atlantic_exile_fleet: "启航大西洋流亡舰队：远征新科尔多瓦"
 oe_v47_act_andalus_atlantic_exile_fleet_desc: "将宫廷学者、天文星盘与纳斯尔王旗装上远洋三角帆船，越过直布罗陀海峡探寻佛得角、西非与巴西翠岸，于大洋彼岸另建“新科尔多瓦”。"
 oe_v47_act_andalus_atlantic_exile_fleet_tt: "安达卢斯运势 #B -22#!（大西洋流亡远征），发现 #Y 佛得角、阿金港与巴西东北翠岸#!，若遇无主踏脚岛屿则率先建港，并获得为期15年的 #Y 安达卢斯跨大西洋远航舰队#! 修正。"
 oe_v47_act_andalus_iberia_reconquista_push: "整编伊比利亚收复失地重炮兵团"
 oe_v47_act_andalus_iberia_reconquista_push_desc: "铸造青铜攻城重炮并动员圣兄弟会武装，步步紧逼格拉纳达山隘与马拉加港口，迫使纳斯尔王朝屈服或仓皇遁海流亡。"
 oe_v47_act_andalus_iberia_reconquista_push_tt: "安达卢斯运势 #B -14#!（收复失地压迫），陆军传统 #G +5#!，并获得为期12年的 #Y 伊比利亚收复失地重炮兵团#! 修正。"
 oe_v47_eu1.1.title: "瓦尔纳前夜的三国联军誓师"
 oe_v47_eu1.1.desc: "公元1444年秋，战争的号角自克拉科夫与布达一路回荡至君士坦丁堡的海墙之下。兼领波兰与匈牙利双冠的年轻国王瓦迪斯瓦夫、特兰西瓦尼亚百战名将匈雅提与东罗马巴列奥略皇室正站在决定欧洲命运的刀锋之上：奥斯曼苏丹穆拉德的主力尚滞留安纳托利亚，只要三国步调严密协同、水陆并进，便有望一举粉碎奥斯曼在巴尔干半岛的百年霸业。然而天主教教廷特使、巴尔干东正教诸侯与威尼斯商船队之间暗流涌动，联军在渡过多瑙河之前便面临分崩离析的凶险考验。"
 oe_v47_eu1.1.a: "全力投身三国十字军大业，征发战时什一税并统一联军号令。"
 oe_v47_eu1.1.b: "力挺奥斯曼鲁米利亚防线，急调安纳托利亚铁骑与边防加齐严阵以待。"
 oe_v47_eu1.1.c: "按兵观望虚实，要求各方先签署书面疆界与军饷契约方肯出师。"
 oe_v47_eu1.2.title: "雅盖隆—匈雅提—巴列奥略密约"
 oe_v47_eu1.2.desc: "在布达王宫的穹顶木梁之下与君士坦丁堡布拉赫奈宫的枢密厅中，三方全权使节郑重在羊皮纸盟约上钤下朱红火漆大印。汲取昔日尼科波利斯十字军各自为战的惨痛教训，这份三国密约明确将野战总指挥权交予老成持重的匈雅提，严令波兰重装骑士恪守阵列纪律，并向拜占庭郑重承诺战后归还色雷斯与爱琴海沿岸失地，以换取摩里亚专制公同步北攻牵制奥斯曼腹心。商贾与主教无不私语：基督教世界已三百年未见如此同心协力之盛况。"
 oe_v47_eu1.2.a: "全盘批准匈雅提统一野战指挥权，并筹集三国联军共同军资库。"
 oe_v47_eu1.2.b: "坚持由诸国王公轮值荣誉统帅，在维系后勤协作的同时安抚大贵族体面。"
 oe_v47_eu1.2.c: "暗中向奥斯曼密探透漏联军行军日程，借双方两败俱伤坐收渔翁之利。"
 oe_v47_eu1.3.title: "锁死达达尼尔海峡的联军桨帆船阵"
 oe_v47_eu1.3.desc: "从威尼斯总督府到埃迪尔内宫廷，每位统帅都心知肚明：巴尔干十字军的生死存亡全系于那一海里宽的蔚蓝海峡之上。历史上热那亚商船曾收受重金偷渡穆拉德二世的大军西跨博斯普鲁斯，令基督教联军功败垂成；而今威尼斯战舰、教廷大帆船与拜占庭希腊火快艇在达达尼尔与博斯普鲁斯双海峡结成严密巡航网，青铜撞角与火炮死死锁定亚洲彼岸的每一处渡口。只要海峡铁锁不破，鲁米利亚孤悬的奥斯曼守军便将陷入绝境。"
 oe_v47_eu1.3.a: "重金加倍包租威尼斯与热那亚船长，确保亚洲彼岸寸板不得偷渡。"
 oe_v47_eu1.3.b: "在安纳托利亚堡垒岸边架设重型青铜臼炮，强行轰散海峡封锁舰队。"
 oe_v47_eu1.3.c: "优先护航本国商船通过爱琴海，不让主力战舰在海峡急流中徒然折损。"
 oe_v47_eu1.4.title: "横渡多瑙河"
 oe_v47_eu1.4.desc: "浮桥原木在数万铁蹄与包铁车轮的重压下嘎吱作响，三国联军主力浩浩荡荡跨过多瑙河下游挺进保加利亚北境。行军最前列隆隆推进的，正是匈雅提汲取胡斯战争精髓改良而成的移动钢铁堡垒——数百辆厚橡木战车以锻铁链首尾相扣，车厢射孔密布手铳、重弩与旋回炮。瓦拉几亚轻骑兵如猎鹰般前出侦察尼科波利斯与舒门通道，波兰重装骑士紧束马肚带列阵两侧，令大军每日扎营皆化作难以撼动的移动城塞。"
 oe_v47_eu1.4.a: "高薪招募波希米亚老兵并加配青铜长管炮，全面扩编战车防阵。"
 oe_v47_eu1.4.b: "舍弃笨重辎重、沿黑海大道昼夜急行，赶在秋雨泥泞前直扑瓦尔纳。"
 oe_v47_eu1.4.c: "清野焚毁多瑙河南岸粮草，派遣阿金吉轻骑日夜袭扰笨重的战车纵队。"
 oe_v47_eu1.5.title: "黑海滨的决战：改写瓦尔纳天命"
 oe_v47_eu1.5.desc: "拂晓的咸湿海雾笼罩在瓦尔纳湖沼与弗兰加林岭之间的狭长战场。两翼激战已分高下：匈雅提率领的战车阵与瓦拉几亚轻骑彻底击溃了鲁米利亚与安纳托利亚骑兵双翼，滚滚烟尘中奥斯曼马队四散溃退。此刻，足以改写欧洲数百年历史走向的生死瞬间骤然降临——中军壕沟与拒马之后，苏丹的耶尼切里精锐方阵正枪戟如林严阵以待，年轻国王身旁的王室近卫军纷纷放平长枪，焦躁地渴盼不等匈雅提回师便直冲敌阵中枢！"
 oe_v47_eu1.5.a: "严令王室重骑勒马稳守阵线，静待匈雅提两翼合围炮轰后再行总攻！"
 oe_v47_eu1.5.b: "擂响奥斯曼中军战鼓，引诱敌军孤注一掷突入耶尼切里壕沟陷阱一举斩首！"
 oe_v47_eu1.5.c: "下令隔着沼泽展开稳健的火炮与弩箭消耗战，为进军埃迪尔内保存骑兵元气。"
 oe_v47_eu1.6.title: "索菲亚与贝尔格莱德解放宪章"
 oe_v47_eu1.6.desc: "随着联军旗帜滚滚翻越巴尔干山隘，保加利亚波雅尔、塞尔维亚大公使者、阿尔巴尼亚山地豪杰与希腊地方长官捧着面包、食盐与旧王朝古印络绎不绝赶赴大营。从维丁到斯科普里，各地起义之火一触即发，然而他们向统帅们提出了直击要害的质问：这场三国十字军究竟要恢复巴尔干诸邦的自治王统与东正教会自由，还是仅仅将埃迪尔内的奥斯曼主人换成布达或威尼斯的新征服者？"
 oe_v47_eu1.6.a: "庄严颁布巴尔干解放宪章，保障东正教仪轨与各邦自治王统以尽收民心。"
 oe_v47_eu1.6.b: "将战略山口与塞尔维亚银矿直归联军王室总督辖管，以充实远征军饷。"
 oe_v47_eu1.6.c: "重申奥斯曼米勒特减税与教会特许，稳住摇摆不定的巴尔干乡绅归附苏丹。"
 oe_v47_eu1.7.title: "安纳托利亚的反圣战号角"
 oe_v47_eu1.7.desc: "基督教联军铁骑饮马多瑙河以南的急报传回布尔萨、科尼亚与埃迪尔内，整个安纳托利亚为之震动。昔日各自为政的土库曼侯国与封地西帕希骑兵纷纷响应苏丹高举的绿旗，誓死不让鲁米利亚百年基业毁于一旦。奥斯曼大维齐尔果断熔铸宫廷银器赶制巨型攻城青铜炮，快马信使日夜兼程奔赴卡拉曼与开罗乞援，一股排山倒海的反圣战狂潮正隔海蓄势待发。"
 oe_v47_eu1.7.a: "发动全面反圣战总动员，尽倾安纳托利亚精锐渡海反攻巴尔干联军。"
 oe_v47_eu1.7.b: "抢占罗多彼山脉险隘深沟高垒，以联军火铳与弩阵层层消耗奥斯曼反扑。"
 oe_v47_eu1.7.c: "沿马里察河斡旋冬季休战协定，让精疲力竭的双方暂作喘息与整补。"
 oe_v47_eu1.8.title: "埃迪尔内城下与君士坦丁堡之围"
 oe_v47_eu1.8.desc: "色雷斯大地上所有古道最终都汇聚于相距不过七日路程的两座千年帝都：马里察河畔的奥斯曼都城埃迪尔内，以及三重狄奥多西城墙庇护下的君士坦丁堡。攻城匠师在泥泞原野上拖拽铁箍巨炮，坑道兵则在古老砖石地基下昼夜掘进。无论最终是十字军战旗插上埃迪尔内城头，还是新月铁骑彻底锁死金角湾，今秋掘开的围城壕沟都将一锤定音地裁决欧亚咽喉的百年归属。"
 oe_v47_eu1.8.a: "集中联军重炮猛攻埃迪尔内，彻底打通君士坦丁堡陆路生命线！"
 oe_v47_eu1.8.b: "调转巨型青铜重炮直轰狄奥多西城墙，毕其功于一役拿下金角湾！"
 oe_v47_eu1.8.c: "加固沿线要塞并避免血腥冬季强攻，保全色雷斯与保加利亚民力。"
 oe_v47_eu1.9.title: "布达与圣索菲亚的双都会议"
 oe_v47_eu1.9.desc: "随着奥斯曼守军在巴尔干节节败退，胜利者阵营内部却掀起了一场棘手的外交风暴。罗马教廷特使力主在光复的东正教教区强制推行佛罗伦萨合一决议；匈牙利大贵族要求将贝尔格莱德与维丁划为王室边区；波兰使节垂涎黑海谷物良港；君士坦丁堡元老院则坚称色雷斯与希腊诸省依法皆归新罗马所有。唯有媲美瓦尔纳沙场勇气的政治智慧，方能避免伟大胜利沦为盟友反目的手足相残。"
 oe_v47_eu1.9.a: "缔结平等的三国善后协定，尊重东正教礼仪并归还拜占庭色雷斯故土。"
 oe_v47_eu1.9.b: "以军事救援之功为由，优先划定拉丁商馆特权与匈牙利沿河要塞。"
 oe_v47_eu1.9.c: "巧妙利用天主教与东正教裂痕，拉拢不满拉丁干涉的巴尔干领主倒向东方。"
 oe_v47_eu1.10.title: "鲁米利亚分治条约与巴尔干新秩序"
 oe_v47_eu1.10.desc: "欢庆的钟声在克拉科夫、布达、威尼斯与君士坦丁堡此起彼伏——抑或战鼓仍在多瑙河畔发出不屈的低吼。历经多年战车长征、海峡封锁与惨烈围城之后，各国全权代表齐聚谈判桌前，正式厘定战后鲁米利亚格局。丝绒长案上铺开的舆图清晰标示出光复的保加利亚与塞尔维亚缓冲邦、重归完整的海峡城防以及固若金汤的多瑙河边防，宣告1444年那场悬于一线的历史悲剧已彻底化作改写欧陆走向的辉煌丰碑。"
 oe_v47_eu1.10.a: "庄严颁布巴尔干和平总约，将瓦尔纳三国大捷永铭欧陆史册！"
 oe_v47_eu1.10.b: "断然拒绝割地分治，誓言厉兵秣马重夺鲁米利亚每一寸失土！"
 oe_v47_eu1.10.c: "沿多瑙河设立非军事化通商走廊，将黑海与中欧商路重新紧密相连。"
 oe_v47_eu1.11.title: "紫衣公主的使节"
 oe_v47_eu1.11.desc: "一支携带着巴列奥略双头鹰印信的南来使团顶风冒雪驰入莫斯科城门。随函而来的，是举足轻重的联姻提议：身负末代罗马皇帝皇室血脉的佐伊公主——罗斯史书将尊称她为索菲娅·巴列奥略——愿携帝国礼制、典籍与法统北嫁正在崛起的莫斯科大公宫廷。无论此刻博斯普鲁斯海峡的君士坦丁堡是依然屹立、亟需北方强援共治天下，抑或已然沦陷、盼望“第三罗马”承续正朔，这场联姻都将铸就纵贯白海至爱琴海的双鹰帝国轴心。"
 oe_v47_eu1.11.a: "以至高皇室礼仪隆重迎候索菲娅公主，正式开启莫斯科—君士坦丁堡双鹰轴心。"
 oe_v47_eu1.11.b: "审慎缔结婚约，同时向守旧波雅尔大贵族保证不废祖宗旧制与议事传统。"
 oe_v47_eu1.11.c: "婉拒卷入遥远的希腊帝国纠葛，集中精力先平定北疆与草原边患。"
 oe_v47_eu1.12.title: "跨越欧陆的皇家迎亲仪仗"
 oe_v47_eu1.12.desc: "经由波罗的海港埠、普斯科夫与诺夫哥罗德，索菲娅·巴列奥略的宏大迎亲车队缓缓驶向莫斯科——百余辆大车载满金箔饰边的希腊文福音书、御用紫绸礼服、青铜星盘，随行更有摩里亚流亡贵族与意大利建筑巨匠。当莫斯科河畔圣母安息大教堂的洪钟齐鸣，来自波兰、威尼斯与克里米亚的使节无不神色凝重地意识到：莫斯科已不再是向草原汗国纳贡的偏远林间公国，而是与罗马皇室血脉相连、平起平坐的东方帝国新星。"
 oe_v47_eu1.12.a: "向公主随行希腊学者与仪官颁授枢密官职与封禄，彻底革新宫廷礼法。"
 oe_v47_eu1.12.b: "将拜占庭宫廷礼仪与罗斯法典融会贯通，令朝野各阶层同享联姻荣光。"
 oe_v47_eu1.12.c: "将盛大婚礼与商贸特许所得悉数投入南境草原防线与边防骑兵。"
 oe_v47_eu1.13.title: "双头鹰国玺：东望亚洲，西顾欧陆"
 oe_v47_eu1.13.desc: "在克里姆林宫金匠作坊与帝国造币署中，首席雕版师呈上了一枚震动欧亚的新国玺：印面一侧是跃马屠龙的圣乔治骑士，另一侧则是头戴皇冠、双翼舒展的罗马帝国双头鹰，双首并举，一顾欧陆、一望亚洲。维也纳哈布斯堡使节见状怒斥此举僭越帝号，然而从基辅罗斯到阿索斯圣山，整个东正教世界望见那枚熠熠生辉的双头鹰印玺时，无不油然而生帝国复兴的澎湃豪情。"
 oe_v47_eu1.13.a: "诏令全国一切敕书、外交通牒与金币一律加盖双头鹰国玺，昭示皇权独尊！"
 oe_v47_eu1.13.b: "对外交涉一律启用双头鹰帝玺，对内仍沿用旧印以安抚各分封公国与贵族。"
 oe_v47_eu1.13.c: "广铸镌刻双头鹰徽记的足色贸易银币，贯通黑海与波罗的海商帮信用。"
 oe_v47_eu1.14.title: "北方凯撒加冕礼"
 oe_v47_eu1.14.desc: "正因为新罗马的紫袍鹰旗依然高高飘扬在博斯普鲁斯海峡上空，历史由此推开了一扇比悲歌更加辉煌的大门：君士坦丁堡与莫斯科不必凭吊亡国残梦，而是重拾戴克里先与君士坦丁时代的共治智慧！拜占庭御前特使捧着金玺诏书北上，正式册封莫斯科君主为“北方凯撒暨共治皇帝”，缔结生机勃勃的双都共治同盟——君士坦丁堡扼守地中海与海峡门户，莫斯科镇抚广袤欧亚草原，双鹰齐飞，声威震慑四方！"
 oe_v47_eu1.14.a: "欣然受领共治凯撒金玺诏书，立誓莫斯科与君士坦丁堡永结攻守同盟！"
 oe_v47_eu1.14.b: "在金玺条约中明文写定全罗斯沙皇与罗马巴西琉斯平起平坐、互不隶属。"
 oe_v47_eu1.14.c: "将双都共治条约的重心落于波罗的海—博斯普鲁斯免税商道与联合船队。"
 oe_v47_eu1.15.title: "两座罗马已逝，第三罗马永屹"
 oe_v47_eu1.15.desc: "自普斯科夫以利亚撒修道院的石室之中，长老菲洛费乌斯的震世箴言如洪钟般传遍罗斯每一座白石教堂与金色圣像壁：“两座罗马已经倾覆，第三座罗马屹立不倒，且绝无第四座！”随着君士坦丁堡的紫袍黯然失色或深陷危局，流亡希腊教士、巴尔干主教与罗斯编年史官纷纷北望莫斯科克里姆林宫，视其为东正教世界与罗马法统唯一未被折断的方舟，恳请北方雄主挺身肩负起“帝国转移”的沉重天命。"
 oe_v47_eu1.15.a: "庄严昭告天下莫斯科乃“第三罗马”，宣誓承继罗马帝统并护持万方东正教徒！"
 oe_v47_eu1.15.b: "将第三罗马理念定为教会精神使命，在世俗外交中则保持务实克制。"
 oe_v47_eu1.15.c: "不仅承继帝号，更立下铁血军誓：必将打造铁军重返博斯普鲁斯光复圣索菲亚！"
 oe_v47_eu1.16.title: "克里姆林白石匠与拜占庭仪轨"
 oe_v47_eu1.16.desc: "借着索菲娅公主在威尼斯与君士坦丁堡的广博人脉，菲奥拉万蒂等意大利文艺复兴建筑巨匠与希腊炮师齐聚莫斯科，着手修筑巍峨红砖城垣、圣母安息大教堂穹顶以及近代青铜火炮工坊。然而在多棱宫的议事长桌旁，世代盘踞朝堂的波雅尔大贵族却对繁复森严的拜占庭宫廷跪拜礼、外来匠师与中央集权流露出强烈抵触——君主必须决断如何在维系国内安定与加速帝国近代化之间拿捏火候。"
 oe_v47_eu1.16.a: "力排波雅尔保守派非议，全力资助红砖克里姆林城防与皇家青铜炮厂！"
 oe_v47_eu1.16.b: "令外来巨匠与本土工匠结对传艺，并赐予波雅尔贵族显赫礼仪席位以消弭嫌隙。"
 oe_v47_eu1.16.c: "节制耗资巨大的宫殿石建工程，将省下的银两悉数投入草原精骑与军粮储备。"
 oe_v47_eu1.17.title: "黑海东正教护航同盟"
 oe_v47_eu1.17.desc: "来自克里米亚悬崖要塞哥特公国西奥多罗、卡法希腊商帮、摩尔达维亚大公与罗斯皮毛行商的代表齐聚黑海北岸，共商组建“黑海东正教海陆同盟”。面对顿河草原游骑劫掠与敌对水师对博斯普鲁斯的虎视眈眈，各方提议统筹河道战船、黑海粮仓与沿海要塞，使毛皮、粮草、朝圣者与援军得以自莫斯科水系畅通无阻地直抵金角湾港口，真正将南北两座双鹰重镇连为铁板一块。"
 oe_v47_eu1.17.a: "正式敕建黑海东正教同盟，沿顿河口至博斯普鲁斯修筑护航军港与粮栈。"
 oe_v47_eu1.17.b: "侧重与摩尔达维亚及顿河哥萨克缔结陆上防务密约，稳控南下巴尔干陆路通途。"
 oe_v47_eu1.17.c: "将黑海皮毛与蜂蜡转运特许权高价售予意大利商帮，换取充裕现银充实国库。"
 oe_v47_eu1.18.title: "双座大公会议"
 oe_v47_eu1.18.desc: "在乳香氤氲与蜜蜡烛火照映的圣堂大殿内，来自莫斯科、诺夫哥罗德、基辅与君士坦丁堡普世牧首区的大主教们济济一堂，着力化解延续数十载的教会权责之争。自佛罗伦萨会议以来，罗斯教会极力捍卫自主选举牧首的独立地位，而希腊教阶则珍视君士坦丁堡普世牧首自古流传的荣誉首席权。与此同时，围绕修道院广袤地产归属的争论亦日益白热化——唯有公允明断的教会协定，方能使双鹰轴心的政教两界同心同行。"
 oe_v47_eu1.18.a: "颁行双牧首平等协定：尊奉君士坦丁堡荣誉首席，并正式确认莫斯科教会自主大权。"
 oe_v47_eu1.18.b: "清查修道院闲置田产，将富余教产收益拨作帝国学府与常备军经费。"
 oe_v47_eu1.18.c: "慷慨厚赐阿索斯圣山与罗斯各大修道院，使其成为东正教译经与教化灯塔。"
 oe_v47_eu1.19.title: "希腊—罗斯文艺复兴与秘藏书库"
 oe_v47_eu1.19.desc: "一只只自君士坦丁堡、米斯特拉斯与阿索斯圣山抢运而来的羊皮纸典籍宝匣，在克里姆林宫防潮砖砌拱室中徐徐启封——柏拉图、修昔底德、拜占庭兵书、罗马民法汇编与星历表，与罗斯编年史并排陈列于案头。阿索斯博学者“希腊人马克西姆”率领大批抄经生与早期西里尔活字印工夜以继日地校勘译注，令莫斯科与君士坦丁堡交相辉映，点燃一场融汇古典希腊学养与近代国家治理的东正教文艺复兴！"
 oe_v47_eu1.19.a: "敕建帝国希腊—斯拉夫皇家学院，广设西里尔与希腊文双语活字印书坊！"
 oe_v47_eu1.19.b: "优先译校罗马法典汇编与拜占庭兵法战略典籍，供枢密文官与前线将领研习。"
 oe_v47_eu1.19.c: "将最为珍稀的古希腊与罗马御藏孤本深锁皇室密库，作为王朝代代相传的镇国之宝。"
 oe_v47_eu1.20.title: "双鹰帝国永固大宪章"
 oe_v47_eu1.20.desc: "自索菲娅公主的迎亲雪橇首次驶过莫斯科皑皑雪原已历数十年光阴，莫斯科与君士坦丁堡熔铸而成的双鹰轴心彻底改写了东欧与黑海的地缘版图。身着紫貂长袍的罗斯重臣与披挂帝国紫幔的拜占庭使节齐聚金色穹顶之下，共同起草《双鹰帝国永固大宪章》——一举定鼎今后百年大局：究竟是以南北两座鲜活罗马帝都铸就坚不可摧的共治同盟，还是由北方第三罗马独擎大统，抑或缔结宽广而稳固的东正教诸邦共同体？"
 oe_v47_eu1.20.a: "庄严批准《双鹰帝国永固大宪章》，使罗马法统与东正教双翼永耀欧亚！"
 oe_v47_eu1.20.b: "将双鹰宪章化作贯穿诺夫哥罗德、卡法与爱琴海的自由通商同盟，共谋富强。"
 oe_v47_eu1.20.c: "坚持各自独立主权与灵活外交，仅在礼仪与文化上维系兄弟般的东正教情谊。"
 oe_v47_eu1.21.title: "安达卢斯的最后星火"
 oe_v47_eu1.21.desc: "伫立在阿尔罕布拉红宫高耸的烽楼之上，格拉纳达埃米尔俯瞰脚下苍翠的橄榄林、丝绸作坊与白雪皑皑的内华达山口，远方卡斯蒂利亚与阿拉贡的铁骑旌旗正步步紧逼。绵延八百载的伊比利亚伊斯兰文明，如今全系于这座孤悬半岛南端的山国。狮子庭院深处，重臣与学者展开了一场惊心动魄的国运大辩论：究竟应当疾邀摩洛哥与马穆鲁克跨海驰援、誓师北上光复科尔多瓦，还是未雨绸缪建造远洋舰队，一旦故土难保便横渡漆黑大洋再造“新科尔多瓦”？"
 oe_v47_eu1.21.a: "立下阿尔罕布拉铁血誓言：联结摩洛哥与开罗跨海圣战，逆转伊比利亚乾坤！"
 oe_v47_eu1.21.b: "密令马拉加造船厂与天文星盘匠师暗建远洋船队，为大西洋流亡新生留足后路！"
 oe_v47_eu1.21.c: "或高举伊比利亚收复失地大旗步步紧逼，或以格拉纳达丝绸岁币换取边境喘息。"
 oe_v47_eu1.22.title: "阿尔罕布拉烽燧与格拉纳达防线"
 oe_v47_eu1.22.desc: "从龙达、洛哈到阿尔梅里亚的每一座险峻山巅，石砌烽火台昼举铜镜、夜燃松脂，一旦卡斯蒂利亚重骑越界便瞬息传遍全境。山麓下水渠纵横的格拉纳达谷地中，水利匠师与丝绸行会将富庶果园打造成足以熬过数年围困的铁壁粮仓；矫健迅捷的泽内特轻骑兵则深谙山地伏击之道，令每一条通往红宫的陡峭山隘皆化作敌军难以逾越的铜墙铁壁。"
 oe_v47_eu1.22.a: "重修全境山隘石堡并为边防弩手换装早期火绳枪，筑成坚不可摧的雪山防线。"
 oe_v47_eu1.22.b: "依托热那亚商馆大力拓展格拉纳达丝绸与造纸出口，广积银钱以待决战良机。"
 oe_v47_eu1.22.c: "暗中勘测马拉加与阿尔梅里亚的隐蔽海湾，预备危急时刻抢运皇室典籍与工匠出海。"
 oe_v47_eu1.23.title: "飞渡直布罗陀"
 oe_v47_eu1.23.desc: "在温暖的黎凡特海雾掩护下，数百面雪白三角帆破浪驶过丹吉尔、休达与阿尔赫西拉斯之间的狭长海峡，巧妙绕开伊比利亚巡航舰队直抵安达卢斯岸畔。船舱中涌出精锐柏柏尔轻骑、里夫山地弓手与满袋非斯小麦，随行国书更郑重起誓：绝不坐视安达卢斯孤军血战。直布罗陀巨岩之上，翠绿军旗在海风中猎猎招展，连接马格里布与伊比利亚的千年跨海桥梁再度轰然苏醒！"
 oe_v47_eu1.23.a: "设立格拉纳达—摩洛哥联合海军署，牢牢掌握直布罗陀海峡两岸制海权！"
 oe_v47_eu1.23.b: "热情迎纳马格里布援军入阵杀敌，但严守格拉纳达王权独立不向非斯称臣。"
 oe_v47_eu1.23.c: "自加的斯与里斯本派出重装卡拉克战船反封锁海峡，彻底截断北非援路！"
 oe_v47_eu1.24.title: "开罗远援"
 oe_v47_eu1.24.desc: "响应自阿尔罕布拉疾驰送抵爱资哈尔清真寺与开罗城堡的泣血求援，马穆鲁克特使搭乘满载硝石、大马士革精钢与资深攻城炮师的亚历山大巨船破浪西来。开罗御前会议上，苏丹与大法官高瞻远瞩地发出警世预言：一旦格拉纳达覆灭，伊比利亚的十字军战舰绝不会止步于直布罗陀，必将席卷整个北非乃至直逼红海圣地！源自尼罗河的雄厚财力与东方火器技艺正源源西输，竭力扳回伊比利亚失衡的天平。"
 oe_v47_eu1.24.a: "依托马穆鲁克匠师开设格拉纳达—亚历山大联营铸炮坊，缔结地中海东西轴心。"
 oe_v47_eu1.24.b: "将开罗资助的香料贸易金银与典籍注入格拉纳达书院，厚植文教与民心根基。"
 oe_v47_eu1.24.c: "重金求购开罗与印度洋船长珍藏的精密星盘与季风海图，为远航大西洋做好万全准备。"
 oe_v47_eu1.25.title: "马拉加围城战"
 oe_v47_eu1.25.desc: "震耳欲聋的炮声滚过安达卢斯的橄榄丘陵，成排的卡斯蒂利亚与阿拉贡青铜重炮昼夜猛轰马拉加与洛哈外郭高塔。迥异于昔日山城可凭险嘲笑投石机的中世纪旧战，近代火药重炮竟能在短短数日内将千年砖墙轰成齑粉，基督教封锁舰队亦在近海收紧铁桶阵。战壕两端的统帅无不心明眼亮：这场惨烈的攻防熔炉，要么将彻底折断伊比利亚收复失地的锋芒，要么就将把纳斯尔王室逼入屈膝投降或遁海流亡的终极抉择！"
 oe_v47_eu1.25.a: "精选死士乘夜色奇袭敌军炮阵，钉毁青铜重炮并里应外合冲破马拉加合围！"
 oe_v47_eu1.25.b: "加倍倾泻重炮火力并动员圣兄弟会敢死队抢攻缺口，一举摧垮格拉纳达防线！"
 oe_v47_eu1.25.c: "死守海港防波堤掩护百姓与学者登船，趁午夜涨潮令大西洋流亡舰队突围出海！"
 oe_v47_eu1.26.title: "重返科尔多瓦与塞维利亚"
 oe_v47_eu1.26.desc: "身披翠绿斗篷的安达卢斯骑兵在宽阔的瓜达尔基维尔河畔饮马，欢呼的人群挤满通往科尔多瓦的古罗马石桥与塞维利亚希拉尔达高塔之下。暌违两百余载，纳斯尔与马格里布的旗帜竟奇迹般重临昔日西方哈里发古都！诗人、法学家、犹太名医与基督教工匠无不屏息凝神：浴火重生的安达卢斯究竟将重现昔日百花齐放的文教宽容盛世，还是在刀光剑影的拉锯边疆施行严苛军管？"
 oe_v47_eu1.26.a: "颁布科尔多瓦大宪章，重兴百家书院、天文台与包容并蓄的工商业行会！"
 oe_v47_eu1.26.b: "将塞维利亚河港改造为重兵把守的军械船厂，牢牢扼守大西洋出海门户。"
 oe_v47_eu1.26.c: "趁北方诸国尚未重整旗鼓，在河谷广征战时赔款以迅速充盈军资库藏。"
 oe_v47_eu1.27.title: "漆黑大洋星图"
 oe_v47_eu1.27.desc: "阿尔赫西拉斯港畔一间静谧的海事阁楼内，灯火彻夜通明。安达卢斯天文学家在长案上摊开黄铜星盘、罗盘海图与伊德里西笔下先贤探航“漆黑大洋”的古老手札。眼看伊比利亚战火步步逼近、葡萄牙卡拉维尔帆船亦已沿非洲海岸南探，船长与宗室密议出一个石破天惊的壮举：倘若安达卢斯在故土难容喘息，何不乘东北信风绕过佛得角直驶大洋彼岸，在无人能及的新天地重建一座永不陷落的“新科尔多瓦”？"
 oe_v47_eu1.27.a: "正式组建安达卢斯大西洋远航舰队：装载万卷典籍、百工巧匠、柑橘树苗与王室大纛！"
 oe_v47_eu1.27.b: "仅派轻型侦察船队先行探路建站，主力军民仍死守伊比利亚山河绝不轻言离弃。"
 oe_v47_eu1.27.c: "将珍贵的大西洋星图转售马格里布商帮筹措军资，悉数反哺本土城防修缮。"
 oe_v47_eu1.28.title: "西非落脚点"
 oe_v47_eu1.28.desc: "顺着劲疾的加那利寒流沿撒哈拉金沙海岸南航三周后，安达卢斯三角帆船队终于在风平浪静的阿金湾与火山耸立的佛得角群岛抛锚停泊。一座意想不到的黄金桥梁豁然展现在航海家眼前：内陆萨赫勒商道直通马里的黄金商队与廷巴克图著名的桑科雷书院，西非博学者热情迎候远道而来的格拉纳达法学家、装帧匠与建筑师——令这座大西洋前哨既坐拥漠南金脉，又化作横渡深洋的稳固跳板！"
 oe_v47_eu1.28.a: "在佛得角与阿金港筑城开埠，将安达卢斯流亡学者与廷巴克图黄金商道连为一体！"
 oe_v47_eu1.28.b: "在岛港速补淡水与硬木修整船壳，毫不逗留即刻扬帆西南直指大洋彼岸翠岸！"
 oe_v47_eu1.28.c: "将西非黄金贸易厚利悉数铸成军饷，招募劲旅回师伊比利亚支援本土血战！"
 oe_v47_eu1.29.title: "横渡漆黑大洋"
 oe_v47_eu1.29.desc: "桅杆瞭望手骤然放声高呼“陆地！看见陆地了！”——只见翠绿海岬、珊瑚礁盘与棕榈成荫的巴西河口正自西方水天相接处缓缓浮现！流亡航海家手捧黄铜星盘、高擎朱红纳斯尔王旗涉水登岸，在清冽泉畔栽下随船携来的石榴与苦橙树苗，并亲手为“古尔图巴·杰迪达”——新科尔多瓦——奠下第一座马蹄拱门清真寺基石！远在卡斯蒂利亚重炮射程之外，一场波澜壮阔的伊斯兰大西洋奥德赛终于铸就永不熄灭的海外安达卢斯！"
 oe_v47_eu1.29.a: "在巴西东北翠岸正式奠基“新科尔多瓦”，昭告天下安达卢斯文脉跨洋永续！"
 oe_v47_eu1.29.b: "若伊比利亚本土危如累卵，则毅然将王庭迁往巴西新科尔多瓦，在大洋彼岸涅槃重生！"
 oe_v47_eu1.29.c: "将新科尔多瓦辟为红木与蔗糖贸易巨港，源源不断向伊比利亚老家输送跨洋白银！"
 oe_v47_eu1.30.title: "安达卢斯的双重天命"
 oe_v47_eu1.30.desc: "非斯、托莱多、开罗与巴西海岸的编年史家纷纷濡笔挥毫，记下这一世纪最令人拍案叫绝的命运大逆转。公元1444年曾被世人视作风中残烛的格拉纳达小国，竟硬生生改写了灭顶宿命——或凭直布罗陀圣战与马穆鲁克外援重临科尔多瓦与塞维利亚，再振西方伊斯兰盛世；或驾三角帆乘信风掠过西非直抵南美，抢在欧洲殖民帝国垄断大洋之前建起横跨大西洋的新科尔多瓦苏丹国！"
 oe_v47_eu1.30.a: "加冕复兴的安达卢斯盛世，使科尔多瓦与阿尔罕布拉永为西地中海明珠！"
 oe_v47_eu1.30.b: "欢庆大西洋两岸的新科尔多瓦苏丹国屹立潮头，统御佛得角、西非与巴西航道！"
 oe_v47_eu1.30.c: "缔结务实的伊比利亚—大西洋通商和约，让各族商船与学人得以自由往来两岸。"
 oe_v47_eu1_mod_three_crown_compact: "三国联军十字军盟约"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_three_crown_compact: "三国联军十字军盟约"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_three_crown_compact: "克拉科夫、布达与君士坦丁堡缔结统一军政密约，令基督教联军士气高涨、外交互信深厚，但联合军费分摊加重了国库负担。"
 oe_v47_eu1_mod_danube_wagon_forts: "多瑙河战车阵与重骑协同"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_danube_wagon_forts: "多瑙河战车阵与重骑协同"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_danube_wagon_forts: "匈牙利胡斯式铁链战车堡垒与波兰重枪骑兵协同作战，极大增强冲击与围城火力，但也推升了野战军费开支。"
 oe_v47_eu1_mod_strait_blockade: "达达尼尔—博斯普鲁斯海峡封锁舰队"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_strait_blockade: "达达尼尔—博斯普鲁斯海峡封锁舰队"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_strait_blockade: "基督教联合桨帆舰队严密封锁黑海与达达尼尔海峡，截断安纳托利亚援军并护持海贸，却耗费高昂水师维护成本。"
 oe_v47_eu1_mod_balkan_liberation: "巴尔干解放与自治特许宪章"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_balkan_liberation: "巴尔干解放与自治特许宪章"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_balkan_liberation: "向保加利亚、塞尔维亚与希腊城镇颁授自治宪章换取各地武装起义呼应，令并入与控制进展神速，却缩减了王室直接盘剥空间。"
 oe_v47_eu1_mod_ottoman_counter_jihad: "鲁米利亚加齐反圣战总动员"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_ottoman_counter_jihad: "鲁米利亚加齐反圣战总动员"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_ottoman_counter_jihad: "苏丹亲率安纳托利亚铁骑与耶尼切里精锐强渡海峡反攻，赋予军队凌厉士气与人力，却令后方税政与商路短期承压。"
 oe_v47_eu1_mod_varna_triumph: "瓦尔纳大捷与巴尔干光复勋业"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_triumph: "瓦尔纳大捷与巴尔干光复勋业"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_triumph: "在瓦尔纳与鲁米利亚击溃奥斯曼霸权令三国联军威震欧陆，军威与外交声望空前鼎盛，唯漫长边防驻屯仍耗费不菲军饷。"
 oe_v47_eu1_mod_varna_rumelian_mastery: "铁血稳固的巴尔干霸权"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_rumelian_mastery: "铁血稳固的巴尔干霸权"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_rumelian_mastery: "瓦尔纳反败为胜令帝国铁蹄稳踞多瑙河以南，攻城与动员威势无双，却也激起天主教诸国更深的外交戒备。"
 oe_v47_eu1_mod_varna_crusade_reckoning: "多瑙河边防常备防线"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_crusade_reckoning: "多瑙河边防常备防线"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_crusade_reckoning: "经年累月的多瑙河拉锯战催生了星罗棋布的沿河石堡与边防老兵，显著增强国土守备，但也背负沉重建筑养护成本。"
 oe_v47_eu1_mod_varna_crusader_tithe: "巴尔干十字军战时什一税"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_crusader_tithe: "巴尔干十字军战时什一税"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_crusader_tithe: "由教会与城镇筹措的战时特别税保障了远征军粮饷充足，却令商民阶层深感苛重。"
 oe_v47_eu1_mod_sophia_embassy: "巴列奥略紫衣公主联姻使团"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_sophia_embassy: "巴列奥略紫衣公主联姻使团"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_sophia_embassy: "索菲娅·巴列奥略公主率希腊学者与宫廷仪官北嫁莫斯科，大幅提升外交威望与法统光环，却令守旧波雅尔大贵族心生芥蒂。"
 oe_v47_eu1_mod_double_eagle_seal: "双头鹰帝国国玺新制"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_double_eagle_seal: "双头鹰帝国国玺新制"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_double_eagle_seal: "将拜占庭双头鹰镌刻于国家诏书与国玺之上，显著强化中央皇权与内阁效率，但也触动了地方领主的旧有分权格局。"
 oe_v47_eu1_mod_northern_caesar: "北方凯撒共治与帝统承续"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_northern_caesar: "北方凯撒共治与帝统承续"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_northern_caesar: "以千年罗马法典与东正教皇冠册封北方共治凯撒或第三罗马统绪，大幅提振正统性与立法效能，唯宫廷大典支出浩繁。"
 oe_v47_eu1_mod_black_sea_league: "黑海东正教海陆同盟"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_black_sea_league: "黑海东正教海陆同盟"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_black_sea_league: "串联莫斯科、克里米亚残脉与君士坦丁堡的黑海商军同盟打通毛皮与粮食通道并强化兵源，却令舰队与驿站养护负担加重。"
 oe_v47_eu1_mod_greco_russian_renaissance: "希腊—罗斯文艺复兴学府"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_greco_russian_renaissance: "希腊—罗斯文艺复兴学府"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_greco_russian_renaissance: "流亡希腊文人、意大利石匠与罗斯圣像画师齐聚克里姆林与君士坦丁堡，催生学术与识字率跃升，但工程资助耗费国帑。"
 oe_v47_eu1_mod_twin_co_emperorship: "莫斯科—君士坦丁堡双鹰共治盛世"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_twin_co_emperorship: "莫斯科—君士坦丁堡双鹰共治盛世"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_twin_co_emperorship: "博斯普鲁斯与莫斯科河两座东正教帝都双星并耀，赋予帝国卓绝威望、科研与内阁效能，唯维系双都协同仍须分让部分税利。"
 oe_v47_eu1_mod_third_rome_mantle: "第三罗马大统衣钵"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_third_rome_mantle: "第三罗马大统衣钵"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_third_rome_mantle: "承接君士坦丁堡失落紫袍令莫斯科成为东正教世界唯一帝国砥柱，法统、传教与军心俱振，但大贵族对集权心怀不满。"
 oe_v47_eu1_mod_orthodox_commonwealth: "东正教共同体文教协定"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_orthodox_commonwealth: "东正教共同体文教协定"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_orthodox_commonwealth: "共用的礼仪典籍、隐修院交流与兄弟盟约维系着希腊与斯拉夫世界的精神纽带，唯教会自主削弱了少许中央集权。"
 oe_v47_eu1_mod_kremlin_stone_masters: "克里姆林白石要塞与炮厂"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_kremlin_stone_masters: "克里姆林白石要塞与炮厂"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_kremlin_stone_masters: "融合意大利与拜占庭工法的砖石城防与铸炮工坊令北方帝都固若金汤，但也推高了常年建筑养护开销。"
 oe_v47_eu1_mod_alhambra_defiance: "阿尔罕布拉山隘铁壁守备"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_alhambra_defiance: "阿尔罕布拉山隘铁壁守备"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_alhambra_defiance: "加固内华达雪山险隘烽燧、组建山地轻骑并充实格拉纳达谷地粮仓，令王国防线坚如磐石，却增加军费与城防支出。"
