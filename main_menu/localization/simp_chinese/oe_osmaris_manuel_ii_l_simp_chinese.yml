l_simp_chinese:
 oe_osmaris_manuel_ii_name: "曼努埃尔二世"
 oe_osmaris_athos_recluse: "圣山隐修者"
 oe_osmaris_retired: "退隐"
 oe_osmaris_retired_desc: "此人已放下世俗职任，隐居阿索斯山修道院。不能进入内阁、统治国家、指挥军队或舰队、缔结新婚姻或参与人物互动，也不能担任琼筵序次职位。"
 oe_flavor_byz.1012.t: "奥斯马里斯：隐修者曼努埃尔二世"
 oe_flavor_byz.1012.d: "（穆拉德二世）\n\n父亲君士坦丁留给曼努埃尔二世的，不只是商路、产业和一枚家族印章，还有数不清的责任。他曾不厌其烦地调停亲族争执，亲自过问受损的商船，为家族在帝国中的地位奔走。可每一场庆宴之后，总有新的请托等在门外；每一次风波平息，又有新的争执写进信中。久而久之，他开始羡慕那些不必在祈祷时惦念账目的人。\n\n如今，他已将账册、印章和家事逐一交付，只留下几卷经书与一件朴素衣袍。他请求前往阿索斯山，在修道院的钟声中度过余生。红底金色星月的家旗仍留在家宅，而他愿意以抄写、施舍和祈祷延续先人的信仰。\n\n“陛下，我已为家族尽力。余下的岁月，请容我交给上帝。”"
 oe_flavor_byz.1012.a: "让圣山的钟声，替他卸下尘世的重担。"
 oe_flavor_byz.1012.a.tt: "曼努埃尔二世退居阿索斯山，转入当地所属国家，成为教士并获得“退隐”特质；解除现有内阁、军队与琼筵序次职任，不能再担任这些职务或统治国家。\n罗马文化影响力 #G +10#!。\n奥斯马里斯已为豪族时，影响力 #G +50#!；否则成为豪族，豪族上限 #G +1#!。"
 oe_flavor_byz.1012.lapsed: "暂且搁置这份请求。"
 oe_flavor_byz.1012.lapsed.tt: "人物状态或圣山归属已经改变，本次不执行退隐，也不发放奖励。"
 oe_flavor_byz.1012.historical_info: "历史上的穆拉德二世（1404—1451）是穆罕默德一世之子，于1421—1444年及1446—1451年两度统治奥斯曼。他曾在1444年让位于儿子穆罕默德二世，退居马尼萨，后来重掌政权。皈依东正教、隐居阿索斯山及身后封圣属于本事件链的架空历史。"
 oe_flavor_byz.1013.t: "奥斯马里斯：圣山的曼努埃尔"
 oe_flavor_byz.1013.d: "（穆拉德二世）\n\n阿索斯山送来了一封字迹端正的书信：曼努埃尔二世已经离世。修士们没有清点出珠宝与金银，只有翻旧的经书、未抄完的书页，以及一册记着受助穷人姓名的簿子。\n\n在家族的记忆里，他曾是操持产业、调解争端的长者；在圣山的记忆里，他只是那位清晨最早走入教堂、分粮时总把自己留在最后的修士。关于他的谦逊与善行，修道院和朝圣者留下了共同的见证。教会如今决定将他列入圣徒之列，以“圣山的曼努埃尔”纪念这位放下门第荣光的隐修者。\n\n家族的红金星月旗低垂于灵前，圣像前的灯火却长明不息。"
 oe_flavor_byz.1013.a: "愿圣山的曼努埃尔为我们代祷。"
 oe_flavor_byz.1013.a.tt: "已故的曼努埃尔二世将被正式列为东正教圣徒。"
 oe_flavor_byz.1013.historical_info: "历史上的穆拉德二世于1451年去世，安葬于布尔萨。他没有皈依东正教，也没有被东正教会封圣；本事件描述的是奥斯马里斯家族融入罗马社会后的架空结局。"
