l_simp_chinese:
# NEW 2026-11-24 v25.0 Phase 4A: 1337-1460 Deep Flavor & Mechanic Packs (TUR/FRA/ENG) (oe_v250_fra_, 0 mainline slots, 0 rules, 0 vanilla overrides) — simp_chinese localization for Kingdom of France (1337-1460) (143 keys). Edit gen_v250_1337_tur_fra_eng.py, not this file.
 oe_v250_fra_reform_parlement_baillis:0 "巴黎高等法院与王室辖区官"
 oe_v250_fra_reform_parlement_baillis_desc:0 "将巴黎高等法院王室司法与常薪辖区官推广至法兰西各省，显著提升赋税、王权比重与地方管控，但会激起封建贵族抵触、推高维稳代价并略损外交亲和。"
 oe_v250_fra_reform_chivalric_appanages:0 "瓦卢瓦骑士采邑封藩制"
 oe_v250_fra_reform_chivalric_appanages_desc:0 "以广袤公爵采邑分封王室亲藩与大领主，锻造基督教世界首屈一指的重装骑士并维系封臣忠顺，代价则是王室集权削弱、地方管控趋松且国库直征税效下滑。"
 oe_v250_fra_priv_taille_exempt_nobles:0 "佩剑贵族免征人头税特权"
 oe_v250_fra_priv_taille_exempt_nobles_desc:0 "免除法兰西佩剑贵族的王室直接人头税以换取重装骑兵效命与精锐封建征召，但大幅抬升贵族权势、拉低贵族税赋上限并引起农民阶层怨怒。"
 oe_v250_fra_priv_gallican_liberties:0 "高卢教会自由宪章"
 oe_v250_fra_priv_gallican_liberties_desc:0 "护佑法兰西各大主教座堂与大学教士免受境外教廷课税，提振学术研究、王室正统与教士归心，代价是本土教士权势膨胀、教产税额受限且外交声誉微降。"
 oe_v250_fra_cab_chevalier_bailli:0 "王室辖区官巡查清税"
 oe_v250_fra_cab_chevalier_bailli_desc:0 "派遣王室辖区官与税吏巡察目标行省，整饬领主法庭、提升地方控制度与手工业产出，并充实国库税效与王权，却招致贵族与农民不满。"
 oe_v250_fra_cab_chevalier_bailli_action:0 "王室辖区官巡查清税：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_fra_cab_chevalier_bailli_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行王室辖区官巡查清税"
 oe_v250_fra_cab_chevalier_bailli_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_fra_cab_chevalier_bailli_action_progress_wordier:0 "王室辖区官巡查清税（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_fra_cab_chevalier_bailli_action_progress_tooltip:0 "派遣王室辖区官与税吏巡察目标行省，整饬领主法庭、提升地方控制度与手工业产出，并充实国库税效与王权，却招致贵族与农民不满。"
 oe_v250_fra_cab_chevalier_bailli_select_province:0 "选择王室辖区官巡查清税的行省"
 oe_v250_fra_cab_chevalier_bailli_no_provinces:0 "@trigger_no! 当前没有可供王室辖区官巡查的行省。"
 oe_v250_fra_cab_bureau_ordnance:0 "王室常备军与攻城炮署"
 oe_v250_fra_cab_bureau_ordnance_desc:0 "责成王室军械官与炮术大师统筹火药库、车载野战炮与常备连队整训，显著提升围城效率、军纪与炮兵火力，但军费与税效承受高昂负担。"
 oe_v250_fra_cab_bureau_ordnance_action:0 "王室常备军与攻城炮署"
 oe_v250_fra_cab_bureau_ordnance_active:0 "正在执行：王室常备军与攻城炮署"
 oe_v250_fra_cab_bureau_ordnance_action_progress:0 "执行中"
 oe_v250_fra_cab_bureau_ordnance_action_progress_wordier:0 "王室常备军与攻城炮署（执行中）"
 oe_v250_fra_cab_bureau_ordnance_action_progress_tooltip:0 "责成王室军械官与炮术大师统筹火药库、车载野战炮与常备连队整训，显著提升围城效率、军纪与炮兵火力，但军费与税效承受高昂负担。"
 oe_v250_fra_dec_reims_coronation.title:0 "举行兰斯大教堂涂油加冕大典"
 oe_v250_fra_dec_reims_coronation.desc:0 "于兰斯大教堂以圣油瓶为瓦卢瓦君主行涂油加冕礼，震慑僭位敌手。耗费100金币，持续25年提升王室正统、陆军士气与教士好感，但同时扩大教士权势并略微拉低税效。"
 oe_v250_fra_dec_reims_coronation.a:0 "于兰斯圣殿行至圣基督教国王涂油礼"
 oe_v250_fra_dec_cour_des_aides.title:0 "设立巴黎王室赋税法院"
 oe_v250_fra_dec_cour_des_aides.desc:0 "在巴黎常设王室最高赋税法院（Cour des Aides），专司盐税、商捐与战时补助诉讼。1355年起可用，耗费110金币，持续25年提升税效与内阁效率，但引起农民与市民怨气。"
 oe_v250_fra_dec_cour_des_aides.a:0 "敕立巴黎最高赋税法院"
 oe_v250_fra_dec_sorbonne_patronage.title:0 "敕建卢浮王室图书馆与巴黎大学书院"
 oe_v250_fra_dec_sorbonne_patronage.desc:0 "仿查理五世之风敕令译注古典政论并扩充卢浮宫王室藏书楼与巴黎大学书院。1365年起可用，耗费120金币，持续25年加速科研、思潮传播与威望增长，同时略增财政与军政支出负担。"
 oe_v250_fra_dec_sorbonne_patronage.a:0 "拨款赞助王室译书局与索邦学院"
 oe_v250_fra_dec_compagnies_ordonnance.title:0 "颁布王室常备敕令骑兵团"
 oe_v250_fra_dec_compagnies_ordonnance.desc:0 "遣散骚扰乡里的雇佣匪军，建立欧洲首支由王室常年给饷的重骑敕令团与攻城炮队。1438年起可用，耗费160金币，持续25年大幅强化军纪、重骑战力与围城效率，代价是高昂军费与封建贵族失权不满。"
 oe_v250_fra_dec_compagnies_ordonnance.a:0 "整编法兰西王室常备敕令军"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_reims_sacre:0 "兰斯大教堂圣油加冕"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_reims_sacre:0 "兰斯涂油大典赋予法王神圣正统与昂扬军心，同时也使高卢教会权势随典仪而增、略减财政直征。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_cour_des_aides:0 "巴黎王室赋税法院"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_cour_des_aides:0 "王室常设税官在全国严核赋捐，国库收入与行政能力大增，却令市镇市民与乡间农民叫苦不迭。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_sorbonne:0 "卢浮王室藏书与索邦赞助"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_sorbonne:0 "王室译注与巴黎学术繁荣推动科研与思潮扩散，但常年翰林资助占用部分赋税与军费额度。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_ordonnance:0 "法兰西王室敕令常备军"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_ordonnance:0 "常备敕令骑兵与规制炮队在西欧战场所向披靡，却需要持续巨额军饷并削弱了传统封建贵族的兵权地位。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev1_guyenne_confiscation:0 "吉耶纳封地没收诏令"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev1_guyenne_confiscation:0 "强硬行使封建宗主权激发了法兰西骑士士气与王室威望，却导致跨海交恶并加重战备维稳压力。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev1_parlement_arbitration:0 "高等法院封建司法斡旋"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev1_parlement_arbitration:0 "审慎的司法斡旋赢得外交缓冲与赋税整顿空间，却令急于建功的法兰西贵族颇感失望。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev2_gabelle_monopoly:0 "王室盐税专卖制"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev2_gabelle_monopoly:0 "官盐专卖大幅提升国家税效并充实军费，代价则是乡民深怀怨怼且国家维稳成本攀升。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev2_municipal_aides:0 "市镇行会协商战捐"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev2_municipal_aides:0 "免行苛酷盐税换来商贸活跃与市民好感，却扩大了市民阶层权势并放缓王室直接征税。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev3_fabian_doctrine:0 "杜·盖克兰费边持久战法"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev3_fabian_doctrine:0 "依托要塞与游击袭扰拖垮敌军大幅提升城防与围城反击能力，却招致传统骑士轻蔑并提高要塞维护开支。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev3_chivalric_shock:0 "重甲骑士决战信条"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev3_chivalric_shock:0 "重金打造全套板甲重骑大幅提振冲锋威力与骑士士气，代价是军费高涨且战法僵硬损及整体纪律。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev3_crossbow_mercs:0 "热那亚契约弩手团"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev3_crossbow_mercs:0 "老练的意式盾牌弩手补齐了远程火力与军纪短板，但高额佣兵契约挤压税效并削弱本土征召比例。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev4_estates_oversight:0 "三级会议财政监理制"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev4_estates_oversight:0 "三级会议审账令巴黎行会安心并促进商业流通，代价则是王室集权大幅退让且市民阶层权势坐大。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev4_royal_defiance:0 "王权压制巴黎市政"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev4_royal_defiance:0 "铁腕挫败市政激进派保住了王室至高权威与集权，但重创市民好感并使商贸收益受挫。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev5_noble_suppression:0 "铁血镇压扎克雷"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev5_noble_suppression:0 "贵族铁骑迅速弹压起义稳住了封建秩序与领主忠心，但乡野元气大伤、粮产与农民满意度齐跌。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev5_rural_amnesty:0 "王室乡民赦令与限捐"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev5_rural_amnesty:0 "约束庄园苛索换来乡村休养与田亩复苏，却令短期税效走低并引发贵族领主强烈不满。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev6_permanent_taille:0 "常设人头税与良币敕令"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev6_permanent_taille:0 "良币与常设税制显著强化赋税效率与王权根基，但行省百姓税负加重且传统贵族颇感失权。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev6_provincial_estates:0 "行省三级会议核税协约"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev6_provincial_estates:0 "尊重地方特许令全国政局安稳、民心顺和，却制约了国库税效与王室集权步伐。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev7_marmouset_ministers:0 "「小鬼派」务实内阁"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev7_marmouset_ministers:0 "精干官僚大幅提升内阁效率、税政清明与学术革新，却激怒勃艮第等亲王大公与传统贵族。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev7_princes_of_blood:0 "血亲诸大公共治议会"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev7_princes_of_blood:0 "礼遇血亲诸大公换来封臣顺从与贵族和睦，但巨额王室年金侵蚀税效并削弱内阁行政效率。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev8_burgundian_appeasement:0 "勃艮第宫廷绥靖让步"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev8_burgundian_appeasement:0 "对第戎让利稳住了东线外交与封臣顺服，代价则是王室权威折损、国库税效走低。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev8_armagnac_centralization:0 "阿马尼亚克王党整肃"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev8_armagnac_centralization:0 "由忠王将领牢控巴黎强化了王权与战斗意志，却彻底激怒勃艮第并令国内稳定与诸侯信任受创。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev9_maid_orleans:0 "奥尔良圣女白旗"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev9_maid_orleans:0 "举国沸腾的信仰感召令法兰西陆军士气、兵源与围城意志空前高涨，但也引起保守教士疑虑与行政失序摩擦。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev9_poitiers_caution:0 "普瓦捷神学审慎路线"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev9_poitiers_caution:0 "严谨的神学审查安抚了教会与天主教各国宫廷，却错失了点燃军民狂热士气的绝佳契机。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev10_arras_concord:0 "阿拉斯法勃和解条约"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev10_arras_concord:0 "成功离间勃艮第极大改善法兰西外交格局与战后稳定，代价则是让渡边境税利与短期王室颜面。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev10_valois_pride:0 "瓦卢瓦不屈王威"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev10_valois_pride:0 "寸土不让捍卫了法王威严与军心锐气，却使勃艮第继续敌对并加重外交孤立与厌战压力。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev11_pragmatic_sanction:0 "《布尔日国事诏书》"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev11_pragmatic_sanction:0 "截留教会财赋并掌控主教任命增强了法国税效与王权，但招致教廷不满并损耗国际外交声望。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev11_papal_concordat:0 "法教妥协协约"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev11_papal_concordat:0 "尊重教廷首年税换来罗马大力外交支持与天主教界正统声望，却令本土税源外流且王权对教会约束减弱。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev12_bureau_artillery:0 "比罗兄弟攻城炮革命"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev12_bureau_artillery:0 "规制火炮与常薪精骑令法兰西军队纪律严明、攻城如破竹，但沉重军费维护与税效压力接踵而至。"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev12_franc_archers:0 "行省免税弓手乡勇"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev12_franc_archers:0 "各教区选拔的免税弓手团提供充裕廉价兵源与低维护优势，但在正规会战纪律与重骑冲击上略逊一筹。"
 oe_v250_fra.1.t:0 "没收吉耶纳封地与瓦卢瓦宗主传唤"
 oe_v250_fra.1.d:0 "英王爱德华三世庇护法廷逆臣，并屡屡阻挠加斯科涅封臣向巴黎高等法院上诉。腓力六世麾下法学家力主正式宣告没收阿基坦公国并发布封建总动员令——此举足以彰显瓦卢瓦王室宗主威严，却必将点燃跨海百年大战；若改由高等法院冗长仲裁，则虽可延宕战端却显得王权软弱。"
 oe_v250_fra.1.a:0 "宣告没收吉耶纳并征召瓦卢瓦全国骑士"
 oe_v250_fra.1.b:0 "借巴黎高等法院司法仲裁拖延时日以蓄国力"
 oe_v250_fra.2.t:0 "王室盐税专卖与战时军资库"
 oe_v250_fra.2.d:0 "连年军备与海战折损令卢浮宫国库见底。王室司库提议在全国广设官盐仓，强制家家户户按额购买重税官盐——即令民间深恶痛绝的盐税（Gabelle）。此税立即可为王室注入巨额战资，却会将本就困苦的乡村逼向动荡边缘；若改与各市镇行会磋商补助，则民心虽安而银钱远不如预期。"
 oe_v250_fra.2.a:0 "在全国推行王室官盐仓与强制盐税专卖"
 oe_v250_fra.2.b:0 "向自治市镇行会协商战时商捐补助"
 oe_v250_fra.3.t:0 "克雷西之后：骑士冲锋与费边消耗之辩"
 oe_v250_fra.3.d:0 "面对英格兰密集长弓与下马重步兵的惨痛挫败，法兰西御前会议陷入激烈争论。高傲大领主仍坚信只需更精良的板甲与更猛烈的重骑冲锋即可雪耻，而贝特朗·杜·盖克兰等老练战将则力主「费边消耗战术」：避战敌锋、坚壁清野、依托石堡游击断粮，活活拖垮跨海劫掠军。"
 oe_v250_fra.3.a:0 "采纳杜·盖克兰的坚壁消耗与要塞持久战术"
 oe_v250_fra.3.b:0 "加厚板甲马铠重振瓦卢瓦重骑决战荣光"
 oe_v250_fra.3.c:0 "重金雇募热那亚弩手佣兵团掩护步阵"
 oe_v250_fra.4.t:0 "艾蒂安·马塞尔与巴黎三级会议风潮"
 oe_v250_fra.4.d:0 "战局逆转与劣币贬值激怒了巴黎市民。巴黎商会会长艾蒂安·马塞尔率领三级会议代表逼宫颁布《大敕令》：未经三级会议核准不得加税，王室财官须受常设委员会审计。妥协让步可换取商界贷款与巴黎安宁，断然拒绝虽能守住王室主权却必引发都城震荡。"
 oe_v250_fra.4.a:0 "签署《大敕令》接受三级会议财政监督"
 oe_v250_fra.4.b:0 "断然否决马塞尔纲领并重申王室独断权威"
 oe_v250_fra.5.t:0 "扎克雷农民大起义"
 oe_v250_fra.5.d:0 "饱受欠饷佣兵劫掠与领主赎金苛派之苦，法兰西岛、皮卡第与博韦西的愤怒农夫揭竿焚毁庄园，爆发惨烈的扎克雷起义。纵任贵族铁骑火速血洗可赢得领主效忠并迅速平乱，但田野必遭涂炭；若颁行王室赦令并暂停乡间苛捐，虽能保全耕作却会触怒全国贵族。"
 oe_v250_fra.5.a:0 "派遣贵族铁骑雷霆镇压扎克雷叛军"
 oe_v250_fra.5.b:0 "颁行王室宽赦并严禁领主擅派杂捐"
 oe_v250_fra.6.t:0 "查理五世《大敕令》与常设人头税"
 oe_v250_fra.6.d:0 "痛定思痛的「智者」查理五世拟定全面财政新制：铸造足值金法郎稳固币信，将战时炉灶税转为王室常设直接人头税（Taille），严查各地征税官。推行常设人头税将为法兰西奠定持久征战的财力基石，却必遭地方贵族与行省三级会议激烈抵制。"
 oe_v250_fra.6.a:0 "颁行足值金法郎与王室常设人头税新制"
 oe_v250_fra.6.b:0 "保留行省三级会议核税权以求温和治理"
 oe_v250_fra.7.t:0 "「小鬼派」务实官僚与亲王摄政之争"
 oe_v250_fra.7.d:0 "一批出身寒微却精干务实的法学家与宿将——被大贵族轻蔑地称为「小鬼派（Marmousets）」——主张摒退贪婪的贝里、安茹与勃艮第诸亲王，推行紧缩预算、唯才是举与严密审计。重用小鬼派能令国家机器焕然一新却必招宗室大公怨恨；若还政于血亲诸王公，虽可暂保贵族和睦却会助长宫廷奢靡与分权。"
 oe_v250_fra.7.a:0 "倚重务实「小鬼派」整顿王室官僚与国库"
 oe_v250_fra.7.b:0 "与血亲诸大公共享御前会议与封藩荣禄"
 oe_v250_fra.8.t:0 "阿马尼亚克派与勃艮第派宫廷内讧"
 oe_v250_fra.8.d:0 "奥尔良—阿马尼亚克派与势倾西欧的勃艮第公爵之间矛盾激化，法兰西宫廷濒临内战撕裂，英格兰正虎视眈眈。若向第戎让渡边境封权与免税特惠，或可阻断勃艮第倒向伦敦；若坚定支持阿马尼亚克王党控制巴黎，则虽保中央一统却必招东线强藩反目。"
 oe_v250_fra.8.a:0 "向勃艮第让渡边疆特权以防其与英格兰合流"
 oe_v250_fra.8.b:0 "力挺阿马尼亚克王党整肃巴黎中央权威"
 oe_v250_fra.9.t:0 "奥尔良圣女与法兰西王道觉醒"
 oe_v250_fra.9.d:0 "来自洛林边陲的农家少女身披白甲跃马入朝，宣称奉天命解奥尔良之围、护送王储赴兰斯加冕。前线老兵与万千黎民见其白旗无不热血沸腾，然而审慎的主教与宫廷政客却警告：将王室正统系于未经教会完备审查的异象，一旦战局生变恐招宗教非议。"
 oe_v250_fra.9.a:0 "高举圣女白旗点燃法兰西举国光复热忱"
 oe_v250_fra.9.b:0 "将之交由普瓦捷神学法庭审慎甄别以保稳妥"
 oe_v250_fra.10.t:0 "阿拉斯和会：离间勃艮第与英格兰"
 oe_v250_fra.10.d:0 "教宗特使于阿拉斯召集国际和会，为查理七世打开破局良机：只要法王愿就昔日桥头血案正式致歉并暂让索姆河沿线税利予「好人」腓力，勃艮第便将与英格兰决裂，令伦敦孤立无援。然低首赔礼与割让北境财利令无数王党将士感到屈辱。"
 oe_v250_fra.10.a:0 "忍辱签署《阿拉斯和约》彻底孤立英格兰"
 oe_v250_fra.10.b:0 "拒绝屈辱让步而单凭法兰西剑锋收复山河"
 oe_v250_fra.11.t:0 "《布尔日国事诏书》与高卢教会自主"
 oe_v250_fra.11.d:0 "在布尔日召开的法兰西教士与法学家大会上，查理七世斟酌颁布《布尔日国事诏书》：截留原本流向罗马教廷的教职首年税（Annates），在王室监理下恢复教区自主推选，正式确立高卢教会自由。此举可极大充实法王财力与主权，却必遭罗马教宗激烈谴责。"
 oe_v250_fra.11.a:0 "颁布《布尔日国事诏书》将高卢教产留归本国"
 oe_v250_fra.11.b:0 "与罗马签署妥协协约以维系教宗外交支持"
 oe_v250_fra.12.t:0 "比罗兄弟火炮革制与欧洲首支常备军"
 oe_v250_fra.12.d:0 "收复诺曼底与吉耶纳决战在即，火炮大师让·比罗与加斯帕尔·比罗献上轻便车载铸铁弹火炮，并建言以常设人头税供养十五支王室敕令常备骑兵连。推动这场军事革命可使法军所向披靡、坚城立破，但常年不懈的军饷重担也将深深考验国库。"
 oe_v250_fra.12.a:0 "倾力资助比罗炮队与王室常备敕令军"
 oe_v250_fra.12.b:0 "改建免税乡勇弓手团以节流养民"
