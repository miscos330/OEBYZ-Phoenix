l_simp_chinese:
# NEW 2026-11-24 v25.0 Phase 4A: 1337-1460 Deep Flavor & Mechanic Packs (TUR/FRA/ENG) (oe_v250_eng_, 0 mainline slots, 0 rules, 0 vanilla overrides) — simp_chinese localization for Kingdom of England (1337-1460) (140 keys). Edit gen_v250_1337_tur_fra_eng.py, not this file.
 oe_v250_eng_reform_crown_in_parliament:0 "议会共治王权财政宪章"
 oe_v250_eng_reform_crown_in_parliament_desc:0 "将王室战税与成文法纳入威斯敏斯特上下两院共议机制，显著提升赋税效率、立法效能与议会支持，但代价是王室独断权力缩减、市民阶层权势膨胀且维稳成本微升。"
 oe_v250_eng_reform_indenture_retinues:0 "契约武装与自耕农长弓征募制"
 oe_v250_eng_reform_indenture_retinues_desc:0 "结合大领主契约兵团与各郡自耕农长弓征召体系，锻造纪律严明且火力凶猛的跨海远征军，却推高军费负担、助长贵族私兵权势并轻度消耗王室合法性。"
 oe_v250_eng_priv_yeoman_archery:0 "自耕农长弓靶场特许"
 oe_v250_eng_priv_yeoman_archery_desc:0 "保障各郡自由自耕农享有乡里靶场公地与轻役特权以换取精锐长弓阵，强化征召战力与人力储备，代价是农民权势攀升、粮食产出略减且引起领主微词。"
 oe_v250_eng_priv_wool_staplers:0 "王室羊毛专卖商行特许状"
 oe_v250_eng_priv_wool_staplers_desc:0 "授予英格兰羊毛专卖商行海峡出口专营权，大幅提振海贸效率、关税收益与市民好感，但同时扩大市民阶层权势、限制商税上限并略微压抑本土织布产能。"
 oe_v250_eng_cab_justices_peace:0 "郡治安法官巡审委任"
 oe_v250_eng_cab_justices_peace_desc:0 "委任目标行省的乡绅骑士出任王室郡治安法官，肃清盗匪、落实王室令状并提升地方掌控与繁荣度，代价是地方乡绅贵族权势上升且直征税效微降。"
 oe_v250_eng_cab_justices_peace_action:0 "郡治安法官巡审委任：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_eng_cab_justices_peace_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行郡治安法官巡审委任"
 oe_v250_eng_cab_justices_peace_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_eng_cab_justices_peace_action_progress_wordier:0 "郡治安法官巡审委任（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_eng_cab_justices_peace_action_progress_tooltip:0 "委任目标行省的乡绅骑士出任王室郡治安法官，肃清盗匪、落实王室令状并提升地方掌控与繁荣度，代价是地方乡绅贵族权势上升且直征税效微降。"
 oe_v250_eng_cab_justices_peace_select_province:0 "选择派遣郡治安法官巡审的行省"
 oe_v250_eng_cab_justices_peace_no_provinces:0 "@trigger_no! 当前没有可委任郡治安法官的行省。"
 oe_v250_eng_cab_cinque_ports_watch:0 "五港同盟与海峡舰队巡弋"
 oe_v250_eng_cab_cinque_ports_watch_desc:0 "统筹多佛尔等五港同盟船役，常态护航羊毛商船并威慑英吉利海峡，提升海军士气、海贸效率与海权投射，但需承担高昂海军维护并略微挤占陆军军费。"
 oe_v250_eng_cab_cinque_ports_watch_action:0 "五港同盟与海峡舰队巡弋"
 oe_v250_eng_cab_cinque_ports_watch_active:0 "正在执行：五港同盟与海峡舰队巡弋"
 oe_v250_eng_cab_cinque_ports_watch_action_progress:0 "执行中"
 oe_v250_eng_cab_cinque_ports_watch_action_progress_wordier:0 "五港同盟与海峡舰队巡弋（执行中）"
 oe_v250_eng_cab_cinque_ports_watch_action_progress_tooltip:0 "统筹多佛尔等五港同盟船役，常态护航羊毛商船并威慑英吉利海峡，提升海军士气、海贸效率与海权投射，但需承担高昂海军维护并略微挤占陆军军费。"
 oe_v250_eng_dec_order_garter.title:0 "创立至高嘉德骑士团"
 oe_v250_eng_dec_order_garter.desc:0 "仿爱德华三世在温莎创立嘉德骑士团，以骑士荣誉凝聚英格兰名将与大领主。耗费100金币，持续25年提升威望、陆军士气与贵族忠诚，代价则是贵族权势壮大且宫廷典仪微耗税效。"
 oe_v250_eng_dec_order_garter.a:0 "于温莎城堡册封嘉德骑士"
 oe_v250_eng_dec_calais_staple.title:0 "特许加来王室羊毛专卖港"
 oe_v250_eng_dec_calais_staple.desc:0 "将坚城加来确立为英格兰在欧陆的王室羊毛专卖港与铸币关税中枢。耗费110金币，持续25年提升商贸收入、海贸效率与商人影响力，但需负担高昂要塞驻军费并招致欧陆忌恨。"
 oe_v250_eng_dec_calais_staple.a:0 "颁布加来羊毛专卖港宪章"
 oe_v250_eng_dec_statute_pleading.title:0 "颁布《英语法庭诉讼法令》"
 oe_v250_eng_dec_statute_pleading.desc:0 "规定全国王室法庭改用英语而非诺曼法语开庭辩护，推动本土语言行政认同。1360年起可用，耗费90金币，持续25年提升内阁效率、文化同化与农民好感，却略损欧陆宫廷外交并令守旧贵族微感疏离。"
 oe_v250_eng_dec_statute_pleading.a:0 "诏令王室法庭改行英语辩护"
 oe_v250_eng_dec_portsmouth_dockyard.title:0 "扩建朴次茅斯与南安普敦王室船坞"
 oe_v250_eng_dec_portsmouth_dockyard.desc:0 "在索伦特海峡沿岸兴筑加固木造船池与修船坞，维养王室巨型克拉克战船与海峡巡防舰队。1410年起可用，耗费140金币，持续25年强化重型战舰、水手储备与海军士气，但海军维护与财政负担沉重。"
 oe_v250_eng_dec_portsmouth_dockyard.a:0 "兴筑索伦特海峡王室造船坞"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_order_garter:0 "至高嘉德骑士团"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_order_garter:0 "温莎嘉德骑士团的荣耀激励英军士气并安抚大领主，但也助长了贵族阶层影响力并增加宫廷仪典开支。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_calais_staple:0 "加来王室羊毛专卖港"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_calais_staple:0 "掌控加来羊毛关口令北海白银滚滚流入英王关税，但常年戍卫加来防区令要塞开支沉重且欧陆外交趋紧。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_statute_pleading:0 "《英语法庭诉讼法令》"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_statute_pleading:0 "母语法庭打通威斯敏斯特与各郡民心、加速英格兰文化凝聚，却与欧陆法语宫廷传统渐行渐远。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_portsmouth_dock:0 "索伦特王室海军船坞"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_portsmouth_dock:0 "南岸常设王室船坞保障了海峡巨舰建造与精锐水手轮换，但也带来持续高昂的海军维护开支与微弱税效折损。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev1_flemish_staple:0 "弗兰德羊毛专卖关税"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev1_flemish_staple:0 "集中出口原毛带来充沛海贸关税与北海盟谊，但压抑了英格兰本土织布业并助长专卖商帮势力。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev1_domestic_cloth:0 "英格兰本土毛纺工坊兴起"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev1_domestic_cloth:0 "招徕织匠发展本土宽幅呢绒提升了手工业产出与繁荣度，但短期原毛海贸收益下降并冷落弗兰德诸城。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev2_longbow_statute:0 "各郡长弓自耕农兵制"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev2_longbow_statute:0 "常年教区靶场操演使英格兰征召长弓阵杀伤骇人、士气高昂，代价则是乡村粮产与工坊效率略降。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev2_yeoman_harvest:0 "各郡农桑休养"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev2_yeoman_harvest:0 "让农夫专心耕织带来了丰沛粮产与乡民欢心，却使英格兰征召步兵在欧陆战场略显生疏。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev3_commons_bargain:0 "下院战税宪政契约"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev3_commons_bargain:0 "宪政核税契约提升了立法效能与稳健税效，代价则是王室单边权力收缩且市民议政权势增强。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev3_royal_purveyance:0 "王室强征特权"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev3_royal_purveyance:0 "绕开议会捍卫了王室集权，却激起下院与城镇商民强烈反感并加重国家维稳压力。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev4_calais_enclave:0 "海峡对岸专卖坚堡"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev4_calais_enclave:0 "紧握海峡对岸专卖港大幅放大了海贸效率、商人实力与海权存在感，代价是高昂要塞驻军费与欧陆敌视。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev4_home_staples:0 "英格兰本土专卖诸港"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev4_home_staples:0 "将关税集中于伦敦、布里斯托与多佛尔节省了军费并惠及本土，但海贸投射与海外商利相对缩水。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev5_wage_freeze:0 "《劳工法》强制限薪"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev5_wage_freeze:0 "冻结工价保全了领主地租与庄园粮产，却令农民怨声载道并显著推高国家维稳代价。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev5_free_wages:0 "自由工价与货币租佃"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev5_free_wages:0 "放开雇工市价加快了瘟疫后的乡村繁荣与手工业复苏，却激怒保守领主并压缩传统地租税基。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev6_praemunire:0 "《神职任命与王权侵害法》"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev6_praemunire:0 "限制境外教职干预提升了王权比重与国内税效，代价是教士阶层不满及与罗马教廷的外交摩擦。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev6_curial_harmony:0 "英教妥协与教廷亲善"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev6_curial_harmony:0 "维护教廷礼制赢得教士归心与国际声望，但允许部分教产税款外流且削弱王室集权。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev7_good_parliament:0 "「善良议会」肃贪宪政"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev7_good_parliament:0 "弹劾肃贪显著提升内阁行政效率与税收清明，但代价是王室独断权力缩减且部分宫廷贵族心怀芥蒂。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev7_court_prerogative:0 "宫廷特权压制议会"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev7_court_prerogative:0 "力保宫廷核心维护了王室特权与权贵效忠，却导致贪墨积弊难除、税效与议会合作双双受损。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev8_smithfield_charter:0 "史密斯菲尔德解放宪章"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev8_smithfield_charter:0 "废除农奴束缚激发了乡村长期繁荣与农民拥护，代价则是贵族阶层强烈敌意与国库直征税效回落。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev8_feudal_order:0 "镇压叛乱与封建纲纪复归"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev8_feudal_order:0 "雷霆平叛稳住了大领主效忠与王室掌控，却使乡村怨气难平并拖累手工业生产效率。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev9_oxford_vernacular:0 "牛津母语译经思潮"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev9_oxford_vernacular:0 "母语圣经与学术争鸣加速了科研、思潮传播与庶民识字率，却激怒教会正统派并增加维稳成本。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev9_episcopal_orthodoxy:0 "主教正统教义审查"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev9_episcopal_orthodoxy:0 "取缔非官方布道稳固了宗教凝聚与教会合作，却抑制了学术探索并放缓科研步伐。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev10_marcher_castles:0 "威尔士边疆石堡铁腕防线"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev10_marcher_castles:0 "增援同心石堡提升了全国城防与驻军恢复能力，代价则是要塞维护剧增且边民离心加剧。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev10_welsh_charter:0 "威尔士郡县怀柔宪章"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev10_welsh_charter:0 "保障威尔士法律权益加快了文化整合与山地长弓征募，却略微削弱王权掌控并招致边疆大领主不满。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev11_grace_dieu:0 "「天恩号」皇家海峡舰队"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev11_grace_dieu:0 "巍峨王室主力战舰称雄英吉利海峡、显著强化重船战力与海军士气，但沉重船队维护与税效消耗紧随其后。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev11_merchant_levy:0 "征调商船海防旧制"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev11_merchant_levy:0 "临时征调民间商船省下巨额海军维护费并惠及港贸，但在主力重舰海战与海权威慑上明显吃亏。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev12_curb_livery:0 "严禁贵族私兵徽章令"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev12_curb_livery:0 "铁腕整肃私兵巩固了王室集权、军纪与地方控制，却招致诸侯贵族强烈怨恨并冲击王朝合法性。"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev12_loveday_council:0 "大议会「和解爱日」协约"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev12_loveday_council:0 "庄严的贵族和解暂避了全面内战并提升政局稳定，代价则是大领主权势盘根错节、王权与内阁效率双双受限。"
 oe_v250_eng.1.t:0 "羊毛专卖关税与弗兰德同盟"
 oe_v250_eng.1.d:0 "优质英格兰羊毛乃根特与布鲁日织机命脉，亦是爱德华三世撬动北海格局的利器。若将全国原毛出口绑定弗兰德专卖口岸并加征王室关税，即可立获巨额战资与低地盟友，却使本国商贸受制于弗兰德商帮；若转而扶持本土织布工坊，虽能壮大手工制造业却将冷落低地盟邦。"
 oe_v250_eng.1.a:0 "以弗兰德口岸专卖羊毛换取战时关税与低地盟友"
 oe_v250_eng.1.b:0 "鼓励本土毛纺工坊深加工而非贱卖原毛"
 oe_v250_eng.2.t:0 "《射箭法令》与自耕农长弓兵阵"
 oe_v250_eng.2.d:0 "王室元帅建言颁布全国《射箭法令》，严禁星期日各类闲戏，强制肯特至约克郡每一名健壮自耕农定期在教区靶场操演紫杉长弓。此法将把英格兰平民锻造成全欧最致命的远程铁军，但占用乡民农闲与工坊劳作也将轻微影响农业产出。"
 oe_v250_eng.2.a:0 "在全国各郡严令推行星期日长弓操演"
 oe_v250_eng.2.b:0 "免行强制军训以保各郡农桑丰收与地租"
 oe_v250_eng.3.t:0 "议会战时拨款与下院宪政交易"
 oe_v250_eng.3.d:0 "意商银号倒闭而欧陆远征军嗷嗷待饷，威斯敏斯特的郡骑士与市镇市民代表愿批复丰厚的十分之一暨十五分之一动产战税，但开出硬性条件：日后凡征直接战税与羊毛附加关税皆须经议会立法核准。允诺此约将稳固持久战资，绕开议会虽保王室特权却必激起民间动荡。"
 oe_v250_eng.3.a:0 "承认议会核税权以换取充沛战时拨款"
 oe_v250_eng.3.b:0 "绕开下院强征王室采办征发与特权税"
 oe_v250_eng.4.t:0 "加来羊毛专卖港特许宪章"
 oe_v250_eng.4.d:0 "距多佛尔海峡仅二十英里的加来坚城使英格兰得以扼守狭海两岸，并在王室炮火掩护下统揽羊毛关税。但常年在法兰西土地供养精锐驻军耗银如流水，精打细算的枢密官因此建言改在英格兰本土诸港设立专卖埠以节省防务巨资。"
 oe_v250_eng.4.a:0 "重兵固守欧陆专卖飞地以扼海峡商道"
 oe_v250_eng.4.b:0 "改设英格兰本土羊毛专卖港以节减戍边开支"
 oe_v250_eng.5.t:0 "《劳工法》与瘟疫后的工价风暴"
 oe_v250_eng.5.d:0 "惨烈大瘟疫令英格兰乡野人口锐减，幸存的农夫与工匠趁势要求翻倍工钱，甚至弃庄园而去。议会中的地产贵族强烈要求颁布严苛《劳工法》，将全国工价死锁在瘟疫前水准并重罚流民雇工——然铁腕限薪必将在肯特与埃塞克斯埋下激烈民变火种。"
 oe_v250_eng.5.a:0 "严厉推行《劳工法》强行冻结庄园工价"
 oe_v250_eng.5.b:0 "顺应市价允许自由雇工与货币租佃"
 oe_v250_eng.6.t:0 "《神职任命法》与《王权侵害法》"
 oe_v250_eng.6.d:0 "阿维尼翁教廷屡屡将富庶的英格兰主教教职授予外籍教士并抽走巨额银钱，引发威斯敏斯特群情激愤。颁布《神职任命法》与《王权侵害法》可严禁向境外教廷法庭上诉并保住本土教产财源，却必招高级教士不满并与教宗关系遇冷。"
 oe_v250_eng.6.a:0 "颁布两项法令严限教廷干政与银钱外流"
 oe_v250_eng.6.b:0 "保留教廷传统教职权限以换取罗马外交斡旋"
 oe_v250_eng.7.t:0 "「善良议会」与王室近臣弹劾案"
 oe_v250_eng.7.d:0 "战局停滞而王室宠臣却被控贪墨羊毛贷款、操纵国债牟利，下院首次选出正式议长并首创「弹劾」程序审判贪官。纵容「善良议会」肃清宫廷蠹虫可整饬吏治、重树税信，但会削弱王权；庇护宫廷权贵虽保君主尊严却将引爆全国公愤。"
 oe_v250_eng.7.a:0 "支持下院弹劾贪墨近臣并整顿财政吏治"
 oe_v250_eng.7.b:0 "庇护宫廷重臣并强令解散抗命议会"
 oe_v250_eng.8.t:0 "瓦特·泰勒与英格兰大农民起义"
 oe_v250_eng.8.d:0 "连年强征均一税（Poll Tax）终于引爆怒火，肯特与埃塞克斯数万农民在瓦特·泰勒与布道者约翰·鲍尔率领下杀过伦敦桥，要求废除农奴制、限定地租并严惩酷吏。若信守史密斯菲尔德解放宪章可加速自耕农兴盛却必遭贵族反扑；若铁腕镇压虽能重建封建威严却令乡野元气重创。"
 oe_v250_eng.8.a:0 "兑现农奴解放宪章并永废苛酷人头均一税"
 oe_v250_eng.8.b:0 "撕毁宪章铁腕平叛以维护封建纲纪"
 oe_v250_eng.9.t:0 "约翰·威克里夫与罗拉德派英语圣经"
 oe_v250_eng.9.d:0 "牛津神学家约翰·威克里夫及其「贫穷布道者」四处传抄英语圣经译本，公开抨击教会聚敛财富与教宗至上论。暗中庇护牛津学派可大力启蒙本土识字与学术思辨，却必遭正统主教斥为异端、动摇国内宗教安定；若推行严厉教义审查虽可稳住教会却将钳制思想活力。"
 oe_v250_eng.9.a:0 "默许牛津英语译经学派以启蒙国民识字"
 oe_v250_eng.9.b:0 "支持主教严查异端并取缔罗拉德派布道"
 oe_v250_eng.10.t:0 "威尔士边疆与欧文·格林杜尔起义"
 oe_v250_eng.10.d:0 "因与英格兰边疆领主爆发封地争端，威尔士贵族欧文·格林杜尔在山谷间高举金龙战旗，连克哈莱克与卡迪夫沿线爱德华石堡，并遣使联络法兰西与苏格兰。增派重兵固守边疆城堡并行严刑峻法可维持高压统治却耗费巨资；若协商威尔士郡县自治特许，虽能长久安边却需让渡部分集权。"
 oe_v250_eng.10.a:0 "增兵戍守爱德华石堡并强化边疆领主高压管控"
 oe_v250_eng.10.b:0 "颁行威尔士郡县怀柔宪章以息干戈"
 oe_v250_eng.11.t:0 "五港同盟皇家海军与「天恩号」巨舰"
 oe_v250_eng.11.d:0 "为在大举进军诺曼底前清扫英吉利海峡的法卡联军与热那亚巨舰，南安普敦王室造船匠向亨利五世献策：兴建以巨舰「天恩号（Grace Dieu）」为首的常备王室主力战舰队。此举可牢握海峡制海权却耗资惊人；若沿袭战时征调商船旧例，则虽可护住国库却难敌欧陆大型战船。"
 oe_v250_eng.11.a:0 "下水「天恩号」巨舰并扩建王室海峡主力舰队"
 oe_v250_eng.11.b:0 "继续征调民间商船护航以减轻海军财负"
 oe_v250_eng.12.t:0 "兰开斯特与约克：玫瑰战争的先声"
 oe_v250_eng.12.d:0 "随着欧陆战局承压，披挂私家徽章的各大领主亲兵公然在伦敦街头叫嚣，英格兰正站在兰开斯特与约克两大王室支系血腥内战的悬崖边缘。严厉执行《徽章禁令》强拆大贵族私兵虽可为王权筑基，却会引爆贵族剧烈敌意与正统震荡；若由大议会主持「和解爱日」妥协，则虽得一时太平却令王室权威旁落。"
 oe_v250_eng.12.a:0 "严行《徽章禁令》强力裁撤大领主私兵"
 oe_v250_eng.12.b:0 "召集大议会「和解爱日」安抚两大支系诸侯"
