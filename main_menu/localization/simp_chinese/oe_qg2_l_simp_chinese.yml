 oe_qg2_player_only_tt: "由人类玩家操控"
 oe_qg2_dzungar_cd_tt: "过去15年内未曾兴师西征西域"
 oe_sit_three_feudatories: "三藩之乱：西南削藩风云"
 oe_sit_three_feudatories_desc: "平西王吴三桂踞云南昆明，平南王尚氏与靖南王耿氏分镇粤闽，三藩拥兵自重、岁耗半壁国赋。康熙下诏撤藩后，滇闽粤骤然举兵反叛，帝国迎来定鼎中原后最严峻的生死考验。"
 oe_sit_three_feudatories_imperial: "三藩削平与天下归统"
 oe_sit_three_feudatories_imperial_desc: "帝国依托八旗绿营协同攻克昆明、招抚闽粤，彻底废除三藩并收归西南督抚直辖，开创康雍乾中央集权盛世。"
 oe_sit_three_feudatories_autonomy: "西南藩镇割据坐大"
 oe_sit_three_feudatories_autonomy_desc: "削藩攻势受挫令滇闽粤三藩稳固割据之势，中枢皇权与西南财赋长期受制于地方军阀。"
 oe_sit_three_feudatories_compromise: "怀柔安抚与渐次改流"
 oe_sit_three_feudatories_compromise_desc: "朝廷以恩威并施招抚诸藩余部并分期改隶行省，虽未全歼叛军，仍保全了西南大局安定。"
