 oe_qg2_dec_establish_grand_council.title: "设立军机处与密折理政"
 oe_qg2_dec_establish_grand_council.desc: "于隆宗门内常设军机处并推行廷寄快马密折，精简决策层级，大幅提升内阁效率与万里疆域控制力。"
 oe_qg2_dec_establish_grand_council.a: "颁旨设立常设军机处"
 oe_qg2_dec_establish_grand_council_tt: "提升皇权集权度+25，稳定+5，并获得40年「军机处廷寄中枢」国家修正。"
 oe_qg2_dec_dzungar_expedition.title: "兴师西征准噶尔与经略西域"
 oe_qg2_dec_dzungar_expedition.desc: "沿河西走廊、哈密至巴里坤设立军台粮驿，整备火器营与八旗西征劲旅，经略漠西草原与天山南北。"
 oe_qg2_dec_dzungar_expedition.a: "整备军台粮饷，发兵西域"
 oe_qg2_dec_dzungar_expedition_tt: "提升边疆经略度+20与陆军传统+10，并获得20年「西域远征军台粮饷」国家修正。"
 oe_qg2_dec_charter_canton_factories.title: "敕定广州十三行通商章程"
 oe_qg2_dec_charter_canton_factories.desc: "于粤海关敕定广州十三行公行制度，统一承保洋船茶叶、生丝与瓷器出口，汇集欧陆白银充实国库。"
 oe_qg2_dec_charter_canton_factories.a: "敕颁广州十三行公行特许状"
 oe_qg2_dec_charter_canton_factories_tt: "提升边疆海贸经略度+15，即时回笼关税银两，并获得40年「广州十三行公行章程」国家修正。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_unification: "努尔哈赤一统建州海西"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_unification: "以赫图阿拉为基业依次收服建州、海西诸部，打破女真百年散沙局面，部落凝聚力与重骑战力骤增。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_seven_grievances: "七大恨誓师告天"
 STATIC_MODIFIER_DESC_oe_qg2_mod_seven_grievances: "颁布七大恨焚表告天，建立后金汗国，八旗将士同仇敌忾、攻坚破城之志锐不可当。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_mukden_palace: "盛京定都与沈阳故宫"
 STATIC_MODIFIER_DESC_oe_qg2_mod_mukden_palace: "迁都沈阳盛京，营建大政殿与十王亭，将辽东平原化为进取关内的稳固大本营。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_six_ministries_banners: "皇太极六部与满蒙汉八旗"
 STATIC_MODIFIER_DESC_oe_qg2_mod_six_ministries_banners: "仿中原体统设立六部与内三院，并扩编满洲、蒙古、汉军二十四旗，完成从部落联盟向帝国机器的蜕变。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_manchu_proclamation: "盛京称帝与改号满洲"
 STATIC_MODIFIER_DESC_oe_qg2_mod_manchu_proclamation: "合满蒙汉三族拥戴称帝、废诸申旧称改号满洲，大幅提升帝国正统、声望与多民族包容容量。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_dorgon_pass_entry: "多尔衮入关靖定燕京"
 STATIC_MODIFIER_DESC_oe_qg2_mod_dorgon_pass_entry: "摄政王多尔衮把握山海关剧变长驱直入北京，为崇祯发丧以收中原人心，迅速整合直隶山东州县。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_queue_enforcement: "铁腕剃发易服令"
 STATIC_MODIFIER_DESC_oe_qg2_mod_queue_enforcement: "严令天下限期剃发易服以测试臣服，强化高压集权与八旗威慑，却在江南激起剧烈反抗与分离情绪。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_southern_conciliation: "江南免赋开科安抚"
 STATIC_MODIFIER_DESC_oe_qg2_mod_southern_conciliation: "豁免晚明三饷苛政、重开恩科录用江南士子并约束驻防兵纪，迅速平复东南兵燹、恢复民生繁荣。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_halt_enclosure: "永停圈地与劝农复业"
 STATIC_MODIFIER_DESC_oe_qg2_mod_halt_enclosure: "颁诏永停京畿圈占民田，归还农人耕地并严禁投充骚扰，显著恢复直隶粮产与赋税基础。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_oboi_regency: "四大辅臣与鳌拜旧制"
 STATIC_MODIFIER_DESC_oe_qg2_mod_oboi_regency: "幼主冲龄期间四大辅臣重申满洲贵族旧制与骑射尚武之风，稳固部族忠诚但掣肘中枢内阁。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_kangxi_personal_rule: "康熙智擒鳌拜与亲政"
 STATIC_MODIFIER_DESC_oe_qg2_mod_kangxi_personal_rule: "少年天子以布库侍卫不动干戈拿下权臣鳌拜，收回皇权并开启大清长达六十年的康熙盛世。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_three_feudatories_war: "三藩之乱兵燹"
 STATIC_MODIFIER_DESC_oe_qg2_mod_three_feudatories_war: "滇闽粤三藩相继举兵反叛，半壁西南陷入激战，军费剧增且地方叛乱势头汹涌。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_green_standard_marshals: "重用绿营汉将与平藩锐师"
 STATIC_MODIFIER_DESC_oe_qg2_mod_green_standard_marshals: "打破八旗傲慢积习，破格拔擢张勇、赵良栋、王进宝等绿营名将与八旗协同攻坚，扭转平藩战局。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_feudatories_crushed: "三藩削平与天下归统"
 STATIC_MODIFIER_DESC_oe_qg2_mod_feudatories_crushed: "彻底荡平滇闽粤三藩割据，收归西南财税兵权予督抚直辖，大清中央集权达于鼎盛。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_feudatories_autonomy: "西南藩镇尾大不掉"
 STATIC_MODIFIER_DESC_oe_qg2_mod_feudatories_autonomy: "削藩失利令西南诸藩坐大割据，中枢皇权、财赋征收与属藩忠诚均受严重侵蚀。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_feudatories_compromise: "三藩怀柔渐次改流"
 STATIC_MODIFIER_DESC_oe_qg2_mod_feudatories_compromise: "以恩威并施分化招抚降藩并渐次收归省治，虽未毕其功于一役，却避免西南久战糜烂。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_shilang_penghu: "施琅水师与澎湖大捷"
 STATIC_MODIFIER_DESC_oe_qg2_mod_shilang_penghu: "提督施琅整训福建水师乘南风突袭澎湖列岛，七日激战击溃东宁主力船队，确立海峡制海权。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_taiwan_prefecture_open: "台湾设府与康熙四口开海"
 STATIC_MODIFIER_DESC_oe_qg2_mod_taiwan_prefecture_open: "采纳施琅「留台弃台疏」于台湾设府驻兵，并展界开海设粤、闽、浙、江四海关，东南海贸蓬勃复兴。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_dzungar_ulan_butung: "乌兰布通与昭莫多平准大捷"
 STATIC_MODIFIER_DESC_oe_qg2_mod_dzungar_ulan_butung: "皇帝亲征朔漠，以火器营威远炮击溃准噶尔驼城，继于昭莫多大破噶尔丹主力，奠定喀尔喀蒙古归附。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_nine_princes_intrigue: "九子夺嫡朝堂暗涌"
 STATIC_MODIFIER_DESC_oe_qg2_mod_nine_princes_intrigue: "储位两废引发诸皇子结党争嗣，朝臣与八旗王公各附其主，京师暗流汹涌、政务受阻。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_secret_memorials_huohao: "密折理政与火耗归公养廉"
 STATIC_MODIFIER_DESC_oe_qg2_mod_secret_memorials_huohao: "雍正推广密折直达御前以破除官场蒙蔽，同时推行火耗归公、发放养廉银，令国库存银数年间倍增。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_grand_council_cabinet: "军机处廷寄中枢"
 STATIC_MODIFIER_DESC_oe_qg2_mod_grand_council_cabinet: "设立军机处以「勤、速、密」处理军国大事，廷寄快马直达万里边疆，极大压缩行政衰减与决策延迟。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_lhasa_ambans: "驻藏大臣与金瓶掣签"
 STATIC_MODIFIER_DESC_oe_qg2_mod_lhasa_ambans: "驱逐入侵拉萨的准噶尔骑兵并设驻藏大臣协同治藏，稳固雪域高原藩属忠诚与边疆安宁。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_ili_xinjiang_pacified: "伊犁将军与天山南北归统"
 STATIC_MODIFIER_DESC_oe_qg2_mod_ili_xinjiang_pacified: "荡平准噶尔汗国与大小和卓之乱，设伊犁将军统辖天山南北并推行军府屯田，打通万里丝路商道。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_ten_great_campaigns: "乾隆十全武功"
 STATIC_MODIFIER_DESC_oe_qg2_mod_ten_great_campaigns: "连番经略准回、大小金川、廓尔喀与南疆诸役，将帝国版图与天朝武威推向极盛，但军费开支同样高昂。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_siku_quanshu_library: "《四库全书》七阁宏编"
 STATIC_MODIFIER_DESC_oe_qg2_mod_siku_quanshu_library: "征集天下善本编纂三万六千册《四库全书》分藏文渊、文津等七阁，集中国古代典籍考据之大成。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_literary_censorate: "文字狱与思想统制"
 STATIC_MODIFIER_DESC_oe_qg2_mod_literary_censorate: "借修书之机严查违碍典籍并大兴文字狱，强固思想统一与稳定，代价是压抑士林创新与科技思辨。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_canton_factories_charter: "广州十三行公行章程"
 STATIC_MODIFIER_DESC_oe_qg2_mod_canton_factories_charter: "敕定广州十三行公行承保洋商贸易，茶叶、生丝与瓷器源源换取欧陆白银，令粤海关成为帝国聚宝盆。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_macartney_scientific_exchange: "热河格致通商新议"
 STATIC_MODIFIER_DESC_oe_qg2_mod_macartney_scientific_exchange: "正视马戛尔尼使团带来的天体仪、舰炮模型与近代航海图，破例设馆研习格致与造舰，助大清抢占近代化先机。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_celestial_self_sufficiency: "天朝物产丰盈体统"
 STATIC_MODIFIER_DESC_oe_qg2_mod_celestial_self_sufficiency: "恪守朝贡礼仪拒绝通商特权，短期彰显天朝上国威仪与秩序安定，却错失近距离审视工业革命浪潮的窗口。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_white_lotus_tuanlian: "嘉庆肃贪与川楚坚壁团练"
 STATIC_MODIFIER_DESC_oe_qg2_mod_white_lotus_tuanlian: "诛杀巨贪和珅以谢天下，并在川楚陕推行坚壁清野与乡勇团练，逐步扑灭历时九年的白莲教起义。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_western_expedition_corps: "西域远征军台粮饷"
 STATIC_MODIFIER_DESC_oe_qg2_mod_western_expedition_corps: "沿河西走廊、哈密至巴里坤设立密集军台驿站与转运粮台，赋予西征大军卓越的行军速度与炮兵攻城力。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_tf_expedition: "八旗绿营南征督战"
 STATIC_MODIFIER_DESC_oe_qg2_mod_tf_expedition: "中枢调拨精锐八旗与绿营猛将分路压境，强化攻坚破城能力与前线将士士气。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_tf_conciliation: "康熙招抚三藩降将诏"
 STATIC_MODIFIER_DESC_oe_qg2_mod_tf_conciliation: "颁行恩诏许诺归降藩将免罪保爵，成功瓦解闽粤叛军同盟并降低地方叛乱势头。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_tf_yangtze_logistics: "荆襄长江转运粮道"
 STATIC_MODIFIER_DESC_oe_qg2_mod_tf_yangtze_logistics: "固守荆州、武昌与岳阳水陆渡口，保障平藩前线粮食补给与江防壁垒。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_aba_hunt: "女真联盟大围猎（阿巴）"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_aba_hunt: "女真诸部合围白山黑水举行冬秋大围猎，以猎演兵，大幅砥砺骑射机动与部族凝聚力。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_sable_exchange: "女真联盟貂参互市盟约"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_sable_exchange: "诸部统一采参捕貂与关市议价，消除部族内耗，显著提升边陆贸易效率与物产收益。"
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_banner_oath: "女真诸部盟誓编旗"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_banner_oath: "盟内各部歃血盟誓共遵旗制军令，加速兵员恢复并铸就向八旗铁军跃迁的根基。"
 oe_qg2.1.title: "努尔哈赤统合建州与海西诸部"
 oe_qg2.1.desc: "长白山下烽火连天，建州枭雄努尔哈赤历经古勒山九部之战，以铁骑与联姻并进之策相继收服建州五部与海西扈伦诸城，结束女真百年分裂格局，白山黑水初现一统之势。"
 oe_qg2.1.a: "以赫图阿拉为盟主，铁血整合女真诸部"
 oe_qg2.1.b: "借女真联盟互市与盟誓怀柔远部"
 oe_qg2.2.title: "七大恨誓师告天与后金建国"
 oe_qg2.2.desc: "赫图阿拉城外香烟缭绕，汗王昭告《七大恨》焚表祭天，正式建元天命、称大金汗国，誓以八旗铁骑直指抚顺与辽东重镇，向中原王朝宣战。"
 oe_qg2.2.a: "焚表告天誓师，挥军直取辽东诸城"
 oe_qg2.2.b: "先固辽东屯垦与八旗后勤再图大举"
 oe_qg2.3.title: "迁都盛京与营建沈阳故宫"
 oe_qg2.3.desc: "辽阳既下，汗王决意迁都四通八达的沈阳盛京，修筑大政殿、十王亭与厚重砖城。居此要冲，西可窥视宁锦山海关，北可联络科尔沁蒙古，东可经略朝鲜，大业气象蔚然一新。"
 oe_qg2.3.a: "定都盛京兴建宫阙，统筹辽东军政"
 oe_qg2.3.b: "简省宫室费用，将银粮尽数拨付军械工坊"
 oe_qg2.4.title: "皇太极设六部与满蒙汉二十四旗"
 oe_qg2.4.desc: "皇太极深知仅靠旧部族合议难成大一统帝国，遂仿中原典制设立吏、户、礼、兵、刑、工六部与内三院，并陆续扩建蒙古八旗与汉军八旗，合为满蒙汉二十四旗，文武并举震慑四方。"
 oe_qg2.4.a: "遍设六部与满蒙汉八旗，大兴帝国新制"
 oe_qg2.4.b: "保留诸贝勒议政王大臣会议以安旧勋"
 oe_qg2.5.title: "盛京称帝与改族号为满洲"
 oe_qg2.5.desc: "满洲、蒙古与汉军文武百官三度劝进，皇太极乃于盛京南郊祭天登基，废除旧称女真诸申、改定族号为「满洲」，确立超越单一族群的大帝国格局，剑指九州天命。"
 oe_qg2.5.a: "祭天称帝改号满洲，兼容满蒙汉三族"
 oe_qg2.5.b: "以满蒙武勋为尊，强化八旗核心凝聚力"
 oe_qg2.6.title: "多尔衮入关靖定燕京"
 oe_qg2.6.desc: "山海关大战既定，摄政王多尔衮率八旗劲旅长驱直入北京，下令为先帝发丧、严禁入城抢掠、免除明末三饷苛政，迅速收拢华北州县与降将，大清定鼎中原的基业一举奠定。"
 oe_qg2.6.a: "严明入关军纪、免除三饷以收华北人心"
 oe_qg2.6.b: "乘胜分遣八旗精骑疾趋关中与江淮"
 oe_qg2.7.title: "剃发易服令与江南安抚之抉择"
 oe_qg2.7.desc: "大军渡江定南京后，朝堂就江南治理爆发激烈分歧：强硬派力主严行剃发易服以明君臣大义，却激起扬州、江阴、嘉定惨烈抗拒；稳健派则建言宽缓衣冠之禁、重开科举免赋以速定东南。"
 oe_qg2.7.a: "宽缓衣冠之禁，以开科免赋怀柔江南士民"
 oe_qg2.7.b: "铁腕颁行剃发易服令，以威慑立定纲常"
 oe_qg2.8.title: "顺治亲政与永停京畿圈地令"
 oe_qg2.8.desc: "入关之初八旗在直隶大片圈占民田，令京畿农户流离失所、税粮锐减。皇帝亲政后力排贵族阻力，拟颁诏永停圈地、严查投充恶奴并招抚流民垦荒，以恢复华北民生。"
 oe_qg2.8.a: "颁诏永停圈地，归还民田休养生息"
 oe_qg2.8.b: "酌留近畿旗庄庄田，折银补偿受圈农户"
 oe_qg2.9.title: "四大辅臣执政与鳌拜专权"
 oe_qg2.9.desc: "新帝冲龄即位，索尼、苏克萨哈、遏必隆、鳌拜四大辅臣共理国政。随着老臣凋零，战功赫赫的鳌拜独揽大权，屡兴大狱并重推圈地与八旗旧制，朝廷中枢渐为权臣掣肘。"
 oe_qg2.9.a: "暂行隐忍蓄势，维持八旗旧勋与军政稳定"
 oe_qg2.9.b: "暗中延揽忠诚侍卫与汉臣，静待亲政良机"
 oe_qg2.10.title: "康熙智擒鳌拜：少年天子亲政"
 oe_qg2.10.desc: "年方十六的康熙帝于武英殿日夜演练布库摔跤少年，趁鳌拜孤身入宫奏事之机骤然发难，不费一兵一卒将其生擒革职、仅诛元凶而不株连八旗功臣，皇权自此稳如泰山。"
 oe_qg2.10.a: "智擒鳌拜收回乾纲，平反冤狱并开亲政新局"
 oe_qg2.10.b: "趁势大规模清洗鳌拜余党，彻底震慑满洲权贵"
 oe_qg2.11.title: "三藩之乱：吴三桂昆明起兵，闽粤响应"
 oe_qg2.11.desc: "平西王吴三桂拥兵云南昆明，与福建耿精忠、广东尚之信耗去全国半数岁入，尾大不掉。康熙断然下诏撤藩后，吴三桂斩杀巡抚起兵反清，耿精忠与尚之信相继响应，西南半壁骤陷战火！"
 oe_qg2.11.a: "坚定撤藩大计，调八旗与绿营分路南下平叛"
 oe_qg2.11.b: "先稳长江防线，遣密使分化耿、尚二藩"
 oe_qg2.12.title: "破格重用绿营汉将与招抚闽粤"
 oe_qg2.12.desc: "平藩初期部分八旗贵胄观望不前，康熙果断打破民族界限，破格拔擢张勇、赵良栋、王进宝、施琅等汉人绿营猛将独当一面，同时颁诏招降闽粤二藩，彻底孤立云南吴氏主力。"
 oe_qg2.12.a: "破格重用绿营名将，会师荆湘反攻西南"
 oe_qg2.12.b: "广颁招抚恩诏，和平收复闽粤两省藩军"
 oe_qg2.13.title: "克复昆明与八年平定三藩"
 oe_qg2.13.desc: "历经八年浴血奋战，清军多路合围攻克昆明，彻底拔除割据西南的藩镇隐患。滇、黔、闽、粤财赋与绿营尽归中枢督抚统辖，从此天下再无尾大不掉的军事藩王。"
 oe_qg2.13.a: "彻底废除三藩并收归西南督抚直辖"
 oe_qg2.13.b: "赦免西南胁从士民，宽赋五年休养滇粤"
 oe_qg2.14.title: "施琅平台与一六八三年澎湖海战"
 oe_qg2.14.desc: "三藩既平，海峡对岸的台湾东宁郑氏仍是东南最大隐忧。康熙力排众议起用福建水师提督施琅，率三百余艘战船趁盛夏南风强渡海峡，与名将刘国轩血战澎湖七昼夜，大获全胜。"
 oe_qg2.14.a: "敕令施琅乘南风直取澎湖，收复台湾全岛"
 oe_qg2.14.b: "以封爵优抚招降郑氏水师，兵不血刃定台海"
 oe_qg2.15.title: "留台弃台之争：台湾设府与康熙开海"
 oe_qg2.15.desc: "台湾既入版图，朝堂竟有大臣视之为海外荒岛主张弃守迁民。施琅上《恭陈台湾弃留疏》痛陈台湾乃东南四省之屏障，康熙深以为然，遂设台湾府隶属福建，并解除迁界禁令、设粤闽浙江四海关通商。"
 oe_qg2.15.a: "于台湾设府驻兵，并展界开放四大海关"
 oe_qg2.15.b: "强化台湾驻防水师同时严密稽查沿海私贩"
 oe_qg2.16.title: "康熙亲征准噶尔：乌兰布通与昭莫多之战"
 oe_qg2.16.desc: "漠西准噶尔汗噶尔丹横扫喀尔喀蒙古，大举南下逼近京北草原。康熙三度御驾亲征，在乌兰布通以威远红衣炮轰破准军驼城，又遣费扬古于昭莫多伏击歼灭噶尔丹精锐，漠北诸部尽归大清。"
 oe_qg2.16.a: "御驾亲征朔漠，以火器重炮决胜昭莫多"
 oe_qg2.16.b: "会盟多伦诺尔抚辑喀尔喀诸王，步步为营"
 oe_qg2.17.title: "康熙晚年：九子夺嫡储位风云"
 oe_qg2.17.desc: "太子胤礽两立两废后，大阿哥、四阿哥、八阿哥、十四阿哥等诸皇子各结朋党角逐大宝，京师宗室、八旗都统与督抚重臣暗中站队，吏治随之松弛，直至铁腕果决的新君脱颖而出。"
 oe_qg2.17.a: "确立铁腕新君登极，雷厉整顿诸王朋党"
 oe_qg2.17.b: "行秘密建储旧议以息宗室纷争，缓和朝局"
 oe_qg2.18.title: "雍正新政：密折制度与火耗归公养廉"
 oe_qg2.18.desc: "面对康熙末年国库亏空与官场贪腐，雍正大力推广君臣一对一的「密折」奏事打破督抚蒙蔽，同时铁腕推行「火耗归公」，将私征熔银损耗收归官库并改发高额养廉银，数年之间国库存银由八百万两激增至六千万两。"
 oe_qg2.18.a: "全面推行密折奏事、火耗归公与养廉银"
 oe_qg2.18.b: "渐进清查各省亏空，宽予督抚补库期限"
 oe_qg2.19.title: "设立军机处：帝国中枢的极速运转"
 oe_qg2.19.desc: "为密筹西北用兵与万里粮饷调度，雍正于隆宗门内设军机房，后定名「军机处」。精干的满汉军机大臣日直禁中，以「廷寄」六百里加急直达万里疆吏，彻底取代臃肿的内阁与议政王大臣会议。"
 oe_qg2.19.a: "正式常设军机处，以廷寄统驭天下疆吏"
 oe_qg2.19.b: "军机处专管边防军务，民政仍归内阁六部"
 oe_qg2.20.title: "驱准保藏与设立驻藏大臣"
 oe_qg2.20.desc: "准噶尔骑兵奇袭拉萨扰乱雪域秩序之际，清廷发川陕滇三路大军翻越唐古拉山驱逐敌兵，随后于拉萨设立驻藏大臣协同治理并确立金瓶掣签制度，牢牢稳固青藏高原西南屏藩。"
 oe_qg2.20.a: "设驻藏大臣镇守拉萨，定雪域长治久安"
 oe_qg2.20.b: "尊崇高原寺院传统，借理藩院羁縻怀柔"
 oe_qg2.21.title: "平定准噶尔与天山南北尽入版图"
 oe_qg2.21.desc: "准噶尔内乱迭起、阿睦尔撒纳反叛之际，乾隆力排朝堂畏战之议，遣兆惠、富德率精锐深入伊犁河谷与南疆喀什噶尔、叶尔羌，一举终结百年准部边患，设伊犁将军统筹天山南北军府屯田，赐名「新疆」。"
 oe_qg2.21.a: "平定准回并设伊犁将军，大兴西域军府屯田"
 oe_qg2.21.b: "于乌鲁木齐与哈密设镇控扼丝路，羁縻南疆伯克"
 oe_qg2.22.title: "乾隆十全武功：帝国版图的极盛与耗费"
 oe_qg2.22.desc: "两平准噶尔、定回部、两定大小金川、平台湾林爽文、征缅甸安南与两破廓尔喀——乾隆自诩「十全老人」，帝国版图与威望登峰造极，然连番万里用兵亦令太仓白银骤耗过亿。"
 oe_qg2.22.a: "勒石纪功张扬十全武威，震慑四邻藩国"
 oe_qg2.22.b: "适可而止偃武修文，充实常平仓与河工储备"
 oe_qg2.23.title: "编纂《四库全书》与文字狱之两难"
 oe_qg2.23.desc: "纪昀、戴震等数千学者汇聚翰林院，广征天下藏书编成三万六千余册《四库全书》分藏南北七阁，实为千古文化盛举；然伴随修书而来的禁毁书目与文字狱，亦令士林噤若寒蝉。"
 oe_qg2.23.a: "广纳天下孤本善本，宽免忌讳以兴乾嘉学术"
 oe_qg2.23.b: "借修书严查违碍典籍，以思想统制固守正统"
 oe_qg2.24.title: "广州十三行与全球茶叶白银洪流"
 oe_qg2.24.desc: "粤海关与广州十三行商馆矗立珠江之畔，欧洲各国东印度公司商船云集黄埔，将海量美洲银元源源倾入中国以换取武夷红茶、湖州生丝与景德镇瓷器，令广州成为东方最富庶的海贸枢纽。"
 oe_qg2.24.a: "敕定十三行公行章程，坐收粤海关巨额银税"
 oe_qg2.24.b: "减免出口茶丝杂费，兼开闽浙海港扩大海贸"
 oe_qg2.25.title: "一七九三年马戛尔尼使团：两个世界的碰撞"
 oe_qg2.25.desc: "英国特使马戛尔尼率舰队携天体运行仪、新型火炮模型、蒸汽机械图纸与通商照会抵达热河避暑山庄，引发觐见礼仪与开放口岸的深刻碰撞。盛世余晖下的大清，究竟视西洋奇器为无用淫巧，还是洞察工业剧变之先兆？"
 oe_qg2.25.a: "虚怀审视西洋格致与舰炮，遣员译书兴办海防"
 oe_qg2.25.b: "宣示天朝物产丰盈体统，恪守旧制拒绝特权"
 oe_qg2.26.title: "川楚白莲教起义与嘉庆诛和珅"
 oe_qg2.26.desc: "乾隆末年权臣和珅贪墨成风、吏治败坏，加之川楚陕三省棚民剧增与官府苛派，爆发历时九年的白莲教大起义。八旗与绿营承平日久战力颓废，新君乃果断诛杀和珅抄没巨资，推行坚壁清野与乡勇团练挽救危局。"
 oe_qg2.26.a: "断然诛杀巨贪和珅，推行坚壁清野与团练靖乱"
 oe_qg2.26.b: "急调京营八旗与西域劲旅全力围剿川楚教军"
