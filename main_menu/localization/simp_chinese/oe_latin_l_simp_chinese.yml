 oe_lat.1.t: "港堡上的十字旗"
 oe_lat.1.desc_k_env: "#F 1332年，帝国与威尼斯、医院骑士团结成同盟，约定次年春天在内格罗蓬特集合二十艘桨帆船；1334年，同盟的舰队在阿德拉米提翁一带几次击败卡雷西的船队，只有帝国的船没有来。1343年，教皇再组同盟，塞浦路斯、骑士团、威尼斯和教廷各出船只；次年5月，联军在帕列涅海战获胜，秋天一举夺下士麦那的港堡，可卫城仍在突厥人手里。1345年1月17日，乌穆尔趁联军望弥撒时突袭，拉丁宗主教阿斯蒂的亨利、马丁诺·扎卡里亚和彼得罗·泽诺都被杀。据说坎塔库泽诺斯对教皇的使者说过，愿意重建教会合一，还要站在教廷一边打突厥人。#!\n\n如今，十字旗还插在士麦那的港堡上，教皇的同盟派人来京城，请帝国入伙。坎塔库泽诺斯与乌穆尔交好多年，内战时乌穆尔的兵船曾渡海相助；要与这位老朋友的敌人站在一起，朝中不少人心里不安。"
