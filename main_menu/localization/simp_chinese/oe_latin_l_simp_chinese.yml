l_simp_chinese:
 OE_LAT_SMY_1: "士麦那：帝国加入了神圣同盟。"
 OE_LAT_SMY_2: "士麦那：帝国守住了与突厥人的旧约。"
 OE_LAT_SMY_0: "士麦那：帝国两边都不得罪，只做买卖。"
 OE_LAT_SMY_X: "士麦那：同盟没有来邀帝国。"
 OE_LAT_SMY_W: "士麦那：还没有消息（1344年秋起）。"
 OE_LAT_MO_1: "摩里亚：托付给了骑士团，还没有赎回。"
 OE_LAT_MO_4: "摩里亚：骑士团应请多留五年。"
 OE_LAT_MO_2: "摩里亚：已从骑士团手里收回。"
 OE_LAT_MO_3: "摩里亚：只把科林斯续交骑士团。"
 OE_LAT_MO_0: "摩里亚：拒绝了骑士团的出价，自己守。"
 OE_LAT_MO_X: "摩里亚：骑士团没有来出价。"
 OE_LAT_MO_W: "摩里亚：还没到时候（1397年起）。"
 OE_LAT_FALL_1: "士麦那：被帖木儿攻破。"
 OE_LAT_FALL_3: "士麦那：拉丁人的港堡被帖木儿攻破。"
 OE_LAT_FALL_2: "士麦那：后来落入了别人之手。"
 OE_LAT_FALL_W: "士麦那：没有陷落的消息。"
 OE_LAT_VS_2: "帝国出船把守海峡，摩里亚北上。"
 OE_LAT_VS_1: "帝国只出了几艘船。"
 OE_LAT_VS_0: "帝国守着与苏丹的和约。"
 OE_LAT_VS_W: "帝国还没有表态。"
 OE_LAT_VA_X: "瓦尔纳：奥斯曼人不够强，或京城已失，这一段没有发生。"
 OE_LAT_VA_2: "瓦尔纳：十字军获胜。"
 OE_LAT_VA_1F: "瓦尔纳：十字军大败，六里墙随后被攻破。"
 OE_LAT_VA_1H: "瓦尔纳：十字军大败，六里墙守住了。"
 OE_LAT_VA_1: "瓦尔纳：十字军大败。"
 OE_LAT_VA_N: "瓦尔纳：十字军没有走到海峡。"
 OE_LAT_VA_R: "瓦尔纳：十字军已经出发。"
 OE_LAT_VA_P: "瓦尔纳：教皇没有来请帝国出力。"
 OE_LAT_VA_W: "瓦尔纳：还没到时候（1442年起）。"
 OE_LAT_SW_2A: "分裂以[GetCountry('BYZ').MakeScope.GetVariable('oe_lat_schism_anti').GetCountry.GetName]拥立的那一位胜出告终，[GetCountry('PAP').GetName]如今奉的也是这一脉。"
 OE_LAT_SW_2: "分裂以另一位教皇一方胜出告终，[GetCountry('PAP').GetName]如今奉的也是这一脉。"
 OE_LAT_SW_1: "分裂以[GetCountry('PAP').GetName]原先奉立的那一脉胜出告终。"
 OE_LAT_SB_1: "帝国当初押对了，新教皇记得帝国是最早承认的那一批。"
 OE_LAT_SB_2: "帝国当初押错了，承认的是落败的那一位；要修好，得备一份厚礼。"
 OE_LAT_SB_3: "帝国当初两边都没有押，现在也该表个态了。"
 OE_LAT_SC_R1: "两位教皇：帝国押对了，早早向新教皇道了贺。"
 OE_LAT_SC_R2: "两位教皇：帝国押错了，事后只得赔小心。"
 OE_LAT_SC_R3: "两位教皇：帝国没有押注，事后向新教皇道了贺。"
 OE_LAT_SC_B1: "两位教皇：帝国承认了[GetCountry('PAP').GetName]奉立的教皇。"
 OE_LAT_SC_B2: "两位教皇：帝国承认了另一位教皇。"
 OE_LAT_SC_B0: "两位教皇：帝国两边都不表态。"
 OE_LAT_SC_X: "两位教皇：分裂结束时教廷已不复存在。"
 OE_LAT_SC_S: "两位教皇：西方的教会分裂了，帝国还没有表态。"
 OE_LAT_SC_W: "两位教皇：西方还只有一位教皇（1360年以后，教皇选举时可能分裂）。"
 OE_LAT_CN_T: "奥斯曼人已不复存在。"
 OE_LAT_CN_C: "西方眼下已经有一支十字军了。"
 OE_LAT_CN_R: "奥斯曼人还不够格当十字军的目标（要王国或帝国一级）。"
 OE_LAT_CN_A: "教皇的权威不到50，号召不了十字军。"
 OE_LAT_CN_Y: "教皇眼下号召得了十字军。"
 OE_LAT_CN_N: "教皇眼下号召不了十字军（时代已过，或教廷受制于人，或教廷与奥斯曼交战、停战）。"
 OE_LAT_WN_F: "据说教皇也发过诏书，可十字军终究没有召集起来。"
 OE_LAT_WN_T: "奥斯曼人已不复存在。"
 OE_LAT_WN_R: "教廷说，奥斯曼人还不够格当十字军的目标（要王国或帝国一级）。"
 OE_LAT_WN_A: "教皇的权威不到50，号召不了十字军。"
 OE_LAT_WN_N: "教廷推说时机未到。"
 OE_LAT_AP_W: "使节已经上路，还在等教皇的答复。"
 OE_LAT_AP_R: "教皇的答复正在送回的路上。"
 OE_LAT_AP_1: "上一次，教皇号召了十字军。"
