 oe_lat.11.b.tt: "奥斯曼不再因瓦尔纳记恨帝国\n奥斯曼对帝国好感#G +15#!，持续#Y 5#!年"
 oe_lat.11.c: "收容逃回的十字军"
 oe_lat.11.c.tt: "花费#R 1#!个月的贸易与税收收入\n匈牙利和波兰对帝国好感#G +20#!，持续#Y 10#!年\n奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.11.d: "闭门不出"
 oe_lat.11.d.tt: "什么也不做"
 oe_lat.12.t: "六里墙下"
 oe_lat.12.desc_b: "#F 1444年起，专制公君士坦丁趁奥斯曼人北顾，进兵中希腊，雅典公爵内里奥二世承认了帝国的宗主权。到1445年底，摩里亚的兵已推进到色萨利南部。#!\n\n如今，瓦尔纳之后苏丹腾出了手，大军带着火炮南下，来到六里墙下。墙后的专制公们必须拿主意：撤兵献金、死守长墙，还是称臣纳贡。"
 oe_lat.12.desc_a: "#F 1444年起，专制公君士坦丁趁奥斯曼人北顾，进兵中希腊，雅典公爵内里奥二世承认了帝国的宗主权。#!\n\n如今，瓦尔纳之后苏丹腾出了手，大军带着火炮南下，来到六里墙下。墙后的专制公们必须拿主意：撤兵献金、死守长墙，还是称臣纳贡。"
 oe_lat.12.a: "撤兵献金"
 oe_lat.12.a.tt: "花费#R 3#!个月的贸易与税收收入\n奥斯曼不再因瓦尔纳记恨帝国\n奥斯曼对帝国好感#G +10#!，持续#Y 5#!年\n放弃诏书那年得到的对雅典的宣战理由（如有）"
 oe_lat.12.b: "死守长墙"
 oe_lat.12.b.tt: "#G 30%#!的机会守住：威望#G +10#!，[oe_tu_authority|e]#G +3#!\n#R 70%#!的机会墙破：威望#R −10#!，六里墙被拆毁，伯罗奔尼撒遭劫#Y 5#!年，军区忠诚#R −10#!"
 oe_lat.12.c: "称臣纳贡"
 oe_lat.12.c.tt: "与奥斯曼签订#Y 5#!年的岁币协议：现在先付一年（#Y 3#!个月的总收入），威望#R −15#!，[oe_tu_authority|e]#R −5#!，与奥斯曼停战#Y 5#!年"
 oe_lat.14.t: "长墙之战"
 oe_lat.14.desc_held: "苏丹的火炮轰了半个月，长墙到底没有倒。奥斯曼人带着抢来的牲口退了回去，摩里亚的钟声响了一整夜。"
 oe_lat.14.desc_fell: "两个星期后，奥斯曼人的火炮轰开了长墙。大军涌进摩里亚，据说掳走了六万人。"
 oe_lat.14.a: "鸣钟谢恩"
 oe_lat.14.a.tt: "[oe_tu_authority|e]#G +3#!"
 oe_lat.14.b: "收拾残局"
 oe_lat.14.b.tt: "六里墙被拆毁\n我们和附庸在伯罗奔尼撒的每个地点获得[ShowModifier('oe_mo_ravaged')]，持续#Y 5#!年\n伯罗奔尼撒的军区忠诚#R −10#!（如果有）"
 oe_lat.90.t: "拉丁世界：执行"
 oe_lat.20.t: "两位教皇"
 oe_lat.20.desc_a2: "#F 1377年1月，教皇格列高利十一世离开阿维尼翁，回到了罗马。1378年4月，罗马选出教皇乌尔班六世；同年9月，十三位枢机在丰迪另选了克雷芒七世。从此西方有了两位教皇：威尼斯、热那亚、佛罗伦萨、匈牙利和英格兰站在罗马一边，法兰西、卡斯蒂利亚、阿拉贡、苏格兰和萨伏依站在阿维尼翁一边。#!\n\n如今，西方又有了两位教皇：一位在[SCOPE.sLocation('oe_lat_pcap').GetName]，由[GetCountry('PAP').GetName]奉为正统；另一位由[SCOPE.sCountry('oe_lat_anti').GetName]的枢机拥立。两边的使者先后来到京城，都要帝国承认自己的教皇。西方忙着自家的分裂，顾不上东方（[oe_tu_west_will|e]#R −15#!，直到分裂结束）。"
 oe_lat.20.desc_a1: "#F 1377年1月，教皇格列高利十一世离开阿维尼翁，回到了罗马。#!\n\n如今，西方又有了两位教皇：一位在[SCOPE.sLocation('oe_lat_pcap').GetName]，由[GetCountry('PAP').GetName]奉为正统；另一位由[SCOPE.sCountry('oe_lat_anti').GetName]的枢机拥立。两边的使者先后来到京城，都要帝国承认自己的教皇。西方忙着自家的分裂，顾不上东方（[oe_tu_west_will|e]#R −15#!，直到分裂结束）。"
 oe_lat.20.desc_a0: "#F 教廷迁到阿维尼翁已经几十年了，罗马人一直盼着教皇回去。#!\n\n如今，西方又有了两位教皇：一位在[SCOPE.sLocation('oe_lat_pcap').GetName]，由[GetCountry('PAP').GetName]奉为正统；另一位由[SCOPE.sCountry('oe_lat_anti').GetName]的枢机拥立。两边的使者先后来到京城，都要帝国承认自己的教皇。西方忙着自家的分裂，顾不上东方（[oe_tu_west_will|e]#R −15#!，直到分裂结束）。"
 oe_lat.20.desc_n2: "#F 1377年1月，教皇格列高利十一世离开阿维尼翁，回到了罗马。1378年4月，罗马选出教皇乌尔班六世；同年9月，十三位枢机在丰迪另选了克雷芒七世。从此西方有了两位教皇：威尼斯、热那亚、佛罗伦萨、匈牙利和英格兰站在罗马一边，法兰西、卡斯蒂利亚、阿拉贡、苏格兰和萨伏依站在阿维尼翁一边。#!\n\n如今，西方又有了两位教皇：一位在[SCOPE.sLocation('oe_lat_pcap').GetName]，由[GetCountry('PAP').GetName]奉为正统；另一位由别国的枢机拥立。两边的使者先后来到京城，都要帝国承认自己的教皇。西方忙着自家的分裂，顾不上东方（[oe_tu_west_will|e]#R −15#!，直到分裂结束）。"
 oe_lat.20.desc_n1: "#F 1377年1月，教皇格列高利十一世离开阿维尼翁，回到了罗马。#!\n\n如今，西方又有了两位教皇：一位在[SCOPE.sLocation('oe_lat_pcap').GetName]，由[GetCountry('PAP').GetName]奉为正统；另一位由别国的枢机拥立。两边的使者先后来到京城，都要帝国承认自己的教皇。西方忙着自家的分裂，顾不上东方（[oe_tu_west_will|e]#R −15#!，直到分裂结束）。"
 oe_lat.20.desc_n0: "#F 教廷迁到阿维尼翁已经几十年了，罗马人一直盼着教皇回去。#!\n\n如今，西方又有了两位教皇：一位在[SCOPE.sLocation('oe_lat_pcap').GetName]，由[GetCountry('PAP').GetName]奉为正统；另一位由别国的枢机拥立。两边的使者先后来到京城，都要帝国承认自己的教皇。西方忙着自家的分裂，顾不上东方（[oe_tu_west_will|e]#R −15#!，直到分裂结束）。"
 oe_lat.20.a: "承认[GetCountry('PAP').GetName]奉立的教皇"
 oe_lat.20.a.tt: "[GetCountry('PAP').GetName]对帝国好感#G +15#!，持续#Y 10#!年\n另一位教皇的拥立者（如有）对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.20.b: "承认另一位教皇"
 oe_lat.20.b.tt: "[SCOPE.sCountry('oe_lat_anti').GetName]对帝国好感#G +15#!，持续#Y 10#!年\n[GetCountry('PAP').GetName]对帝国好感#R −15#!，持续#Y 5#!年"
 oe_lat.20.c: "两边都不表态"
 oe_lat.20.c.tt: "两位教皇都不承认，也都不得罪\n教会三派份额：静修派#Y +2#!"
 oe_lat.21.t: "又只有一位教皇"
 oe_lat.21.desc_3: "#F 1378年起，西方有了两位教皇，各国分站两边。1409年，比萨的会议另选了一位教皇，反倒成了三位教皇并立。1414年起，西方的教会在康斯坦茨开大会；1417年11月，会上选出马丁五世，大分裂就此结束。帝国的使团也在会上，见证了新教皇当选。#!\n\n如今，西方又只有一位教皇了。[GetCountry('BYZ').Custom('OeLatSchWin')][GetCountry('BYZ').Custom('OeLatSchBet')]新教皇的使者还说，西方的教会要开大会商议各国的事，希腊人也可以派人来。"
 oe_lat.21.desc_2: "#F 1378年起，西方有了两位教皇，各国分站两边。1409年，比萨的会议另选了一位教皇，反倒成了三位教皇并立。#!\n\n如今，西方又只有一位教皇了。[GetCountry('BYZ').Custom('OeLatSchWin')][GetCountry('BYZ').Custom('OeLatSchBet')]新教皇的使者还说，西方的教会要开大会商议各国的事，希腊人也可以派人来。"
 oe_lat.21.desc_1: "#F 1378年起，西方有了两位教皇，各国分站两边。#!\n\n如今，西方又只有一位教皇了。[GetCountry('BYZ').Custom('OeLatSchWin')][GetCountry('BYZ').Custom('OeLatSchBet')]新教皇的使者还说，西方的教会要开大会商议各国的事，希腊人也可以派人来。"
 oe_lat.21.desc_0: "#F 西方的教会分裂了好些年，各国各奉一位教皇。#!\n\n如今，西方又只有一位教皇了。[GetCountry('BYZ').Custom('OeLatSchWin')][GetCountry('BYZ').Custom('OeLatSchBet')]新教皇的使者还说，西方的教会要开大会商议各国的事，希腊人也可以派人来。"
 oe_lat.21.a: "遣使祝贺新教皇"
 oe_lat.21.a.tt: "[GetCountry('PAP').GetName]对帝国好感#G +20#!，持续#Y 10#!年"
 oe_lat.21.b: "备一份厚礼，遣使祝贺"
 oe_lat.21.b.tt: "花费#R 1#!个月的贸易与税收收入\n[GetCountry('PAP').GetName]不再记恨帝国当初承认另一位教皇"
 oe_lat.21.c: "遣使祝贺新教皇"
 oe_lat.21.c.tt: "[GetCountry('PAP').GetName]对帝国好感#G +10#!，持续#Y 10#!年"
 oe_lat.21.d: "道贺之外，再派使团赴大会"
 oe_lat.21.d.tt: "花费#R 1#!个月的贸易与税收收入\n[GetCountry('PAP').GetName]对帝国好感：当初押对时#G +20#!，没有押时#G +10#!，持续#Y 10#!年\n帝国派使团去西方的大会（#Y 1416#!年以前先作准备，#Y 1416#!年起成行）；教会合一一线接着写使团在会上的事"
 oe_lat.21.e: "厚礼之外，再派使团赴大会"
 oe_lat.21.e.tt: "花费#R 2#!个月的贸易与税收收入\n[GetCountry('PAP').GetName]不再记恨帝国当初承认另一位教皇\n帝国派使团去西方的大会（#Y 1416#!年以前先作准备，#Y 1416#!年起成行）；教会合一一线接着写使团在会上的事"
 oe_lat.21.f: "只发一封贺信"
 oe_lat.21.f.tt: "不花钱，也不派人"
 oe_lat.23.t: "君士坦丁堡的使节"
 oe_lat.23.desc_late: "#F 1366年7月，教皇乌尔班五世在信里写道：希腊人要先回到天主教会，才谈得上援助。#!\n\n如今，君士坦丁堡的使节来到[SCOPE.sLocation('oe_lat_pcap').GetName]，恳求教皇号召十字军，打奥斯曼人。\n帝国的诚意（[oe_tu_west_will|e]）：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；教皇的权威：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_papal_auth')|0]#!（至少#Y 50#!才能号召十字军）。[GetCountry('BYZ').Custom('OeLatCruNow')]"
 oe_lat.23.desc_early: "#F 1095年，皇帝阿莱克修斯一世向西方求援，教皇乌尔班二世由此号召了第一次十字军。#!\n\n如今，君士坦丁堡的使节来到[SCOPE.sLocation('oe_lat_pcap').GetName]，恳求教皇号召十字军，打奥斯曼人。\n帝国的诚意（[oe_tu_west_will|e]）：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；教皇的权威：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_papal_auth')|0]#!（至少#Y 50#!才能号召十字军）。[GetCountry('BYZ').Custom('OeLatCruNow')]"
 oe_lat.23.a: "号召十字军"
 oe_lat.23.a.tt: "教皇发出十字军诏书，矛头指向奥斯曼；世俗领袖从奥斯曼的天主教邻国里挑最强的一个（帝国信天主教时，没有别人就由帝国来当）；约三年后教廷照原版规则宣战\n约#Y 1#!个月后，使节把答复带回君士坦丁堡"
 oe_lat.23.b: "颁发赎罪券，筹款相助"
 oe_lat.23.b.tt: "帝国得到相当于它#Y 4#!个月贸易与税收收入的钱（教廷由AI掌握时由教廷出，最多出到它国库里有的）\n约#Y 1#!个月后，使节把答复带回君士坦丁堡"
 oe_lat.23.c: "先合一，再谈援助"
 oe_lat.23.c.tt: "教皇要东方的教会先与罗马合一\n约#Y 1#!个月后，使节把答复带回君士坦丁堡"
 oe_lat.23.d: "无能为力"
 oe_lat.23.d.tt: "使节空手而回\n约#Y 1#!个月后，使节把答复带回君士坦丁堡"
 oe_lat.22.t: "罗马的答复"
 oe_lat.22.desc_1late: "#F 1364年，教皇乌尔班五世连发七道诏书，为萨伏依伯爵的东征筹款；1366年7月，教皇又写信说，希腊人要先回到天主教会，才谈得上援助。#!\n\n如今，使节从教廷回来了：教皇发出了十字军诏书，矛头指向[SCOPE.sCountry('oe_lat_ct').GetName]，领兵的是[SCOPE.sCountry('oe_lat_cl').GetName]。约三年后，十字军就要开战。使节问皇帝，帝国怎样配合。"
 oe_lat.22.desc_1early: "#F 1095年，皇帝阿莱克修斯一世向西方求援，教皇乌尔班二世由此号召了第一次十字军。#!\n\n如今，使节从教廷回来了：教皇发出了十字军诏书，矛头指向[SCOPE.sCountry('oe_lat_ct').GetName]，领兵的是[SCOPE.sCountry('oe_lat_cl').GetName]。约三年后，十字军就要开战。使节问皇帝，帝国怎样配合。"
 oe_lat.22.desc_2late: "#F 1364年，教皇乌尔班五世连发七道诏书，为萨伏依伯爵的东征筹款；1366年7月，教皇又写信说，希腊人要先回到天主教会，才谈得上援助。#!\n\n如今，使节从教廷回来了：教皇不肯号召十字军，却颁发了赎罪券，为帝国筹来#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_indulg').GetValue|0]#!金币。"
 oe_lat.22.desc_2early: "#F 1095年，皇帝阿莱克修斯一世向西方求援，教皇乌尔班二世由此号召了第一次十字军。#!\n\n如今，使节从教廷回来了：教皇不肯号召十字军，却颁发了赎罪券，为帝国筹来#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_indulg').GetValue|0]#!金币。"
 oe_lat.22.desc_3late: "#F 1364年，教皇乌尔班五世连发七道诏书，为萨伏依伯爵的东征筹款；1366年7月，教皇又写信说，希腊人要先回到天主教会，才谈得上援助。#!\n\n如今，使节从教廷回来了：教皇说，援兵的事要等东西教会合一以后再谈。朝中有人主张答应，也有人说不能拿信仰去换援兵。"
 oe_lat.22.desc_3early: "#F 1095年，皇帝阿莱克修斯一世向西方求援，教皇乌尔班二世由此号召了第一次十字军。#!\n\n如今，使节从教廷回来了：教皇说，援兵的事要等东西教会合一以后再谈。朝中有人主张答应，也有人说不能拿信仰去换援兵。"
 oe_lat.22.desc_4late: "#F 1364年，教皇乌尔班五世连发七道诏书，为萨伏依伯爵的东征筹款；1366年7月，教皇又写信说，希腊人要先回到天主教会，才谈得上援助。#!\n\n如今，使节从教廷回来了，带回的只有好话：教皇眼下无能为力。[GetCountry('BYZ').Custom('OeLatWhyNot')]"
 oe_lat.22.desc_4early: "#F 1095年，皇帝阿莱克修斯一世向西方求援，教皇乌尔班二世由此号召了第一次十字军。#!\n\n如今，使节从教廷回来了，带回的只有好话：教皇眼下无能为力。[GetCountry('BYZ').Custom('OeLatWhyNot')]"
 oe_lat.22.a: "全力配合十字军"
 oe_lat.22.a.tt: "花费#R 1#!个月的贸易与税收收入\n教廷和[SCOPE.sCountry('oe_lat_cl').GetName]对帝国好感#G +15#!，持续#Y 10#!年\n[SCOPE.sCountry('oe_lat_ct').GetName]对帝国好感#R −25#!，持续#Y 10#!年\n十字军成员此后从异教徒手里夺下的旧罗马地点，十字军散伙后可以向它们赎回\n若[SCOPE.sCountry('oe_lat_ct').GetName]是奥斯曼、帝国正臣属苏丹：苏丹的耐心#R −25#!"
 oe_lat.22.b: "坐等西方出兵"
 oe_lat.22.b.tt: "帝国不出钱也不出船，只等十字军开战"
 oe_lat.22.c: "收下这笔钱"
 oe_lat.22.c.tt: "获得#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_indulg').GetValue|0]#!金币"
 oe_lat.22.d: "答应再谈合一"
 oe_lat.22.d.tt: "教会合一一线：若还没有合一，与罗马的合一谈判开启，持续#Y 10#!年，合一会议最早可在#Y 1425#!年到来\n教会三派份额：亲合一派#Y +5#!\n教皇记下了帝国的许诺"
 oe_lat.22.e: "不拿信仰换援兵"
 oe_lat.22.e.tt: "教廷对帝国好感#R −10#!，持续#Y 5#!年\n教会三派份额：静修派#Y +5#!"
 oe_lat.22.f: "白跑一趟"
 oe_lat.22.f.tt: "使节空手而回"
 oe_lat.91.t: "拉丁世界：教廷执行"
