 oe_lat.11.t: "瓦尔纳"
 oe_lat.11.desc_w_b: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。1444年8月，苏丹穆拉德二世与卡拉曼议和，与匈牙利的塞格德和约也随之生效；随后苏丹让位给年轻的儿子穆罕默德。#!\n\n如今，十字军在黑海边的瓦尔纳迎战苏丹的大军，竟然赢了。奥斯曼人折了锐气，巴尔干的基督徒奔走相告。"
 oe_lat.11.desc_w_a: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。#!\n\n如今，十字军在黑海边的瓦尔纳迎战苏丹的大军，竟然赢了。奥斯曼人折了锐气，巴尔干的基督徒奔走相告。"
 oe_lat.11.desc_l2_b: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。1444年8月，苏丹穆拉德二世与卡拉曼议和，与匈牙利的塞格德和约也随之生效；随后苏丹让位给年轻的儿子穆罕默德。#!\n\n如今，十字军在黑海边的瓦尔纳与苏丹的大军相遇，一败涂地。教皇的特使死在乱军之中，残兵四散逃回多瑙河。苏丹知道帝国帮过十字军，记下了这笔账（奥斯曼对帝国好感#R −30#!，持续#Y 10#!年）。摩里亚北上的兵也只得退回六里墙后面。"
