 game_concept_oe_tu_west_will: "西方援助意愿"
 game_concept_oe_tu_west_will_desc: "#F 1366年7月，教皇乌尔班五世在信里写道：希腊人要先回到天主教会，才谈得上援助。#!\n\n西方援助意愿（#Y 0#!到#Y 100#!）衡量拉丁世界此刻愿意为帝国出多少力。它只是一个读数，不存起来、不逐月漂移，每次按当下的情形算出：\n#bold 基础#!#Y 20#!\n#bold 教皇国#!对帝国的好感每#Y 5#!点算#Y 1#!，最多加减#Y 20#!；#bold 威尼斯#!的好感每#Y 10#!点算#Y 1#!，最多加减#Y 10#!\n教会三派里亲合一派份额的一半（教会框架没有运行时按#Y 5#!算）\n帝国信天主教#G +15#!；与罗马的合一：谈判中#G +5#!，已签署#G +15#!（有保留或只被巴塞尔承认时#G +8#!），已宣读#G +25#!，已废#R −10#!\n有[ShowModifier('oe_br_western_aid')]#G +5#!；1339年巴尔拉姆出使过阿维尼翁#G +5#!；是神圣同盟的盟员（入盟后#Y 10#!年内）#G +10#!\n西方大分裂期间#R −15#!；强势路线招来过针对帝国的十字军#R −20#!\n它不决定哪一仗的胜负，只说明西方的态度：瓦尔纳前夕的十字军诏书会把它告诉帝国，以后的求援和守城的援兵也会读它。"
 oe_lat_act_appeal: "遣使罗马，请求十字军"
 oe_lat_act_appeal_card: "派使节去见教皇，请教皇号召十字军打奥斯曼人。"
 oe_lat_act_appeal_desc: "派使节去见教皇，请教皇号召十字军打奥斯曼人。花费#R 2#!个月的贸易与税收收入、#R 5#![oe_tu_authority|e]和#R 5#!威望；#Y 15#!年内只能派一次。约一个月后教皇作答，再过一个月左右，使节带回答复：号召十字军、颁发赎罪券筹款、要帝国先合一，或者无能为力。帝国自己不加入十字军。\n\n[oe_tu_west_will|e]：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!\n教皇的权威：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_papal_auth')|0]#!（至少#Y 50#!才能号召十字军）\n[GetCountry('BYZ').Custom('OeLatCruNow')]\n[GetCountry('BYZ').Custom('OeLatAppeal')]"
 oe_lat_act_appeal_tt: "花费#R 2#!个月的贸易与税收收入\n[oe_tu_authority|e]#R −5#!\n威望#R −5#!\n教会三派份额：静修派#Y −3#!，亲合一派#Y +3#!\n#Y 15#!年内不能再派\n约30天后，教皇收到帝国的请求"
