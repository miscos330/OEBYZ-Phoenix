 oe_lat.1.desc_p_late: "#F 1332年，帝国与威尼斯、医院骑士团结成同盟，约定次年春天在内格罗蓬特集合二十艘桨帆船；1334年，同盟的舰队在阿德拉米提翁一带几次击败卡雷西的船队，只有帝国的船没有来。1343年，教皇再组同盟，塞浦路斯、骑士团、威尼斯和教廷各出船只；次年5月，联军在帕列涅海战获胜，秋天一举夺下士麦那的港堡，可卫城仍在突厥人手里。1345年1月17日，乌穆尔趁联军望弥撒时突袭，拉丁宗主教阿斯蒂的亨利、马丁诺·扎卡里亚和彼得罗·泽诺都被杀。#!\n\n如今，十字旗还插在士麦那的港堡上。内战时太后曾遣使阿维尼翁，向教皇表忠心、求援兵；现在教皇的同盟派人来京城，请帝国入伙，西方等着看帝国的诚意。"
 oe_lat.1.desc_p_early: "#F 1332年，帝国与威尼斯、医院骑士团结成同盟，约定次年春天在内格罗蓬特集合二十艘桨帆船；1334年，同盟的舰队在阿德拉米提翁一带几次击败卡雷西的船队，只有帝国的船没有来。1343年，教皇再组同盟，塞浦路斯、骑士团、威尼斯和教廷各出船只；次年5月，联军在帕列涅海战获胜，秋天一举夺下士麦那的港堡，可卫城仍在突厥人手里。#!\n\n如今，十字旗还插在士麦那的港堡上。内战时太后曾遣使阿维尼翁，向教皇表忠心、求援兵；现在教皇的同盟派人来京城，请帝国入伙，西方等着看帝国的诚意。"
 oe_lat.1.desc_n_late: "#F 1332年，帝国与威尼斯、医院骑士团结成同盟，约定次年春天在内格罗蓬特集合二十艘桨帆船；1334年，同盟的舰队在阿德拉米提翁一带几次击败卡雷西的船队，只有帝国的船没有来。1343年，教皇再组同盟，塞浦路斯、骑士团、威尼斯和教廷各出船只；次年5月，联军在帕列涅海战获胜，秋天一举夺下士麦那的港堡，可卫城仍在突厥人手里。1345年1月17日，乌穆尔趁联军望弥撒时突袭，拉丁宗主教阿斯蒂的亨利、马丁诺·扎卡里亚和彼得罗·泽诺都被杀。#!\n\n如今，十字旗还插在士麦那的港堡上，教皇的同盟派人来京城，请帝国入伙：出船出钱，从此算同盟的一员；不去，也许还能和海那边的突厥人相安无事。"
 oe_lat.1.desc_n_early: "#F 1332年，帝国与威尼斯、医院骑士团结成同盟，约定次年春天在内格罗蓬特集合二十艘桨帆船；1334年，同盟的舰队在阿德拉米提翁一带几次击败卡雷西的船队，只有帝国的船没有来。1343年，教皇再组同盟，塞浦路斯、骑士团、威尼斯和教廷各出船只；次年5月，联军在帕列涅海战获胜，秋天一举夺下士麦那的港堡，可卫城仍在突厥人手里。#!\n\n如今，十字旗还插在士麦那的港堡上，教皇的同盟派人来京城，请帝国入伙：出船出钱，从此算同盟的一员；不去，也许还能和海那边的突厥人相安无事。"
 oe_lat.1.a: "加入同盟，出船出钱"
 oe_lat.1.a.tt: "花费#R 2#!个月的贸易与税收收入\n教廷、威尼斯、医院骑士团和塞浦路斯对帝国好感#G +20#!，持续#Y 10#!年\n艾登对帝国好感#R −20#!，持续#Y 10#!年\n帝国获得[ShowModifier('oe_lat_league_member')]，持续#Y 10#!年\n教会三派份额：亲合一派#Y +3#!"
 oe_lat.1.b: "守住与突厥人的旧约"
 oe_lat.1.b.tt: "艾登和奥斯曼对帝国好感#G +15#!，持续#Y 10#!年\n教廷对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.1.c: "两边都不得罪，只做买卖"
 oe_lat.1.c.tt: "获得#G 1#!个月的贸易与税收收入"
 oe_lat.2.t: "十字军的消息"
 oe_lat.2.desc_war: "#F 1095年，教皇乌尔班二世在克莱芒号召十字军，起因之一是皇帝阿莱克修斯一世向西方求援。此后两百年，十字军时而帮帝国收复失地，1204年却攻破了君士坦丁堡。#!\n\n如今，教皇号召的十字军正指向[SCOPE.sCountry('oe_lat_ct').GetName]，领兵的是[SCOPE.sCountry('oe_lat_cl').GetName]——帝国本来就在与[SCOPE.sCountry('oe_lat_ct').GetName]交战。使者问帝国愿不愿意为十字军引路。"
 oe_lat.2.desc_subject: "#F 1095年，教皇乌尔班二世在克莱芒号召十字军，起因之一是皇帝阿莱克修斯一世向西方求援。此后两百年，十字军时而帮帝国收复失地，1204年却攻破了君士坦丁堡。#!\n\n如今，教皇号召的十字军正指向[SCOPE.sCountry('oe_lat_ct').GetName]，领兵的是[SCOPE.sCountry('oe_lat_cl').GetName]。可帝国是[SCOPE.sCountry('oe_lat_ct').GetName]的附庸，帮哪一边都要付出代价。"
 oe_lat.2.desc_p2: "#F 1095年，教皇乌尔班二世在克莱芒号召十字军，起因之一是皇帝阿莱克修斯一世向西方求援。此后两百年，十字军时而帮帝国收复失地，1204年却攻破了君士坦丁堡。#!\n\n如今，教皇号召的十字军已经向[SCOPE.sCountry('oe_lat_ct').GetName]开战，领兵的是[SCOPE.sCountry('oe_lat_cl').GetName]。十字军的船要经过帝国的海峡，使者问帝国站在哪一边。"
 oe_lat.2.desc_p1: "#F 1095年，教皇乌尔班二世在克莱芒号召十字军，起因之一是皇帝阿莱克修斯一世向西方求援。此后两百年，十字军时而帮帝国收复失地，1204年却攻破了君士坦丁堡。#!\n\n如今，教皇号召的十字军正在集结，矛头指向[SCOPE.sCountry('oe_lat_ct').GetName]，约三年后开战，领兵的是[SCOPE.sCountry('oe_lat_cl').GetName]。十字军的船要经过帝国的海峡，使者问帝国站在哪一边。"
 oe_lat.2.a: "开放港口，为十字军引路"
 oe_lat.2.a.tt: "花费#R 1#!个月的贸易与税收收入\n教廷和[SCOPE.sCountry('oe_lat_cl').GetName]对帝国好感#G +15#!，持续#Y 10#!年\n[SCOPE.sCountry('oe_lat_ct').GetName]对帝国好感#R −25#!，持续#Y 10#!年\n十字军成员此后从异教徒手里夺下的旧罗马地点，十字军散伙后可以向它们赎回\n若[SCOPE.sCountry('oe_lat_ct').GetName]是奥斯曼、帝国正臣属苏丹：苏丹的耐心#R −25#!"
 oe_lat.2.b: "严守中立"
 oe_lat.2.b.tt: "不帮十字军，也不帮它的对手"
 oe_lat.2.c: "暗中通报对方"
 oe_lat.2.c.tt: "[SCOPE.sCountry('oe_lat_ct').GetName]对帝国好感#G +20#!，持续#Y 10#!年\n教廷对帝国好感#R −20#!，持续#Y 10#!年\n教会三派份额：静修派#Y +2#!"
 oe_lat.2.d: "加入十字军"
 oe_lat.2.d.tt: "帝国以天主教国家的身份加入十字军\n十字军成员此后从异教徒手里夺下的旧罗马地点，十字军散伙后可以向它们赎回"
 oe_lat.3.t: "十字军留下的城"
 oe_lat.3.desc_late: "#F 1366年，萨伏依伯爵阿梅迪奥六世的十字军攻下加里波利，次年把它交还帝国；约翰五世答应付一万五千弗罗林，实际付了约一万。#!\n\n如今，十字军已经散了。[SCOPE.sCountry('oe_lat_h').GetName]守着原属帝国的[SCOPE.sLocation('oe_lat_loc').GetName]，像这样落在[SCOPE.sCountry('oe_lat_h').GetName]手里的旧罗马地点共有#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_h_n').GetValue|0]#!处。[SCOPE.sCountry('oe_lat_h').GetName]没有与帝国交战，也许愿意谈。"
 oe_lat.3.desc_early: "#F 1204年以后，十字军在帝国故土上建起诸侯国，大多再也没有还给帝国。#!\n\n如今，十字军已经散了。[SCOPE.sCountry('oe_lat_h').GetName]守着原属帝国的[SCOPE.sLocation('oe_lat_loc').GetName]，像这样落在[SCOPE.sCountry('oe_lat_h').GetName]手里的旧罗马地点共有#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_h_n').GetValue|0]#!处。[SCOPE.sCountry('oe_lat_h').GetName]没有与帝国交战，也许愿意谈。"
 oe_lat.3.a: "按城出价赎回"
 oe_lat.3.a.tt: "从离京城最近的一处起，每处花费#R 2#!个月的贸易与税收收入，最多#Y 3#!处，钱不够就停；赎回的地点归帝国\n[SCOPE.sCountry('oe_lat_h').GetName]对帝国好感#G +10#!，持续#Y 5#!年\n[SCOPE.sCountry('oe_lat_h').GetName]手里其余的这类地点不再算作十字军留下的城"
 oe_lat.3.b: "以帝国之名索还"
 oe_lat.3.b.tt: "获得对[SCOPE.sCountry('oe_lat_h').GetName]的宣战理由，持续#Y 10#!年\n[SCOPE.sCountry('oe_lat_h').GetName]对帝国好感#R −15#!，持续#Y 10#!年\n[SCOPE.sCountry('oe_lat_h').GetName]手里其余的这类地点不再算作十字军留下的城"
 oe_lat.3.c: "让拉丁人替帝国守着"
 oe_lat.3.c.tt: "[SCOPE.sCountry('oe_lat_h').GetName]对帝国好感#G +10#!，持续#Y 10#!年\n[SCOPE.sCountry('oe_lat_h').GetName]手里其余的这类地点不再算作十字军留下的城"
 oe_lat.5.t: "骑士团的出价"
 oe_lat.5.desc_west: "#F 1395至1396年间，专制公狄奥多一世买下科林斯，1397年无力修城，又把它卖给医院骑士团；同年6月，阿尔戈斯被奥斯曼人攻破，至少一万四千人被掳。1399或1400年，狄奥多索性把整个摩里亚专制公国卖给了骑士团。#!\n\n如今，皇帝远在西方求援，[SCOPE.sCountry('oe_lat_foe').GetName]的骑兵就在地峡外。罗得岛的医院骑士团派人来：只要把摩里亚托付给骑士团，骑士团就出钱买下守城的权利，派骑士守住米斯特拉和各处城堡；等危险过去，帝国可以按约赎回。"
 oe_lat.5.desc_plain: "#F 1395至1396年间，专制公狄奥多一世买下科林斯，1397年无力修城，又把它卖给医院骑士团；同年6月，阿尔戈斯被奥斯曼人攻破，至少一万四千人被掳。1399或1400年，狄奥多索性把整个摩里亚专制公国卖给了骑士团。#!\n\n如今，[SCOPE.sCountry('oe_lat_foe').GetName]的骑兵就在地峡外。罗得岛的医院骑士团派人来：只要把摩里亚托付给骑士团，骑士团就出钱买下守城的权利，派骑士守住米斯特拉和各处城堡；等危险过去，帝国可以按约赎回。"
 oe_lat.5.a: "把摩里亚托付给骑士团"
 oe_lat.5.a.tt: "获得#G 4#!个月的贸易与税收收入（骑士团钱不够时，只付它有的）\n我们和附庸在伯罗奔尼撒的每个地点获得[ShowModifier('oe_lat_knights_morea')]，持续#Y 5#!年\n伯罗奔尼撒的军区忠诚#R −10#!（如果有）\n医院骑士团对帝国好感#G +20#!，持续#Y 10#!年\n约#Y 4#!到#Y 12#!个月后，米斯特拉的人们会有话说"
 oe_lat.5.b: "只把科林斯续交骑士团"
 oe_lat.5.b.tt: "获得#G 1#!个月的贸易与税收收入\n科林斯获得[ShowModifier('oe_mo_knights_garrison')]，持续#Y 5#!年\n医院骑士团对帝国好感#G +10#!，持续#Y 5#!年"
 oe_lat.5.c: "摩里亚自己守"
 oe_lat.5.c.tt: "医院骑士团对帝国好感#R −10#!，持续#Y 5#!年\n伯罗奔尼撒的军区忠诚#G +5#!（如果有）"
 oe_lat.6.t: "米斯特拉的人们"
 oe_lat.6.desc: "#F 据说，米斯特拉的居民和教士不肯让拉丁人做主，狄奥多一世只好亲自出面安抚。#!\n\n如今，骑士团的人住进了米斯特拉的城堡，城里的人却关上了家门。教士们说，把城交给拉丁修士，等于把信仰也交了出去；市民聚在广场上，要求收回成命。"
 oe_lat.6.a: "顺从民意，提前赎回"
 oe_lat.6.a.tt: "花费#R 4#!个月的贸易与税收收入\n移除所有[ShowModifier('oe_lat_knights_morea')]\n伯罗奔尼撒的军区忠诚#G +15#!（如果有）\n医院骑士团对帝国好感#R −15#!，持续#Y 5#!年\n教会三派份额：静修派#Y +2#!"
 oe_lat.6.b: "等突厥人退了再说"
 oe_lat.6.b.tt: "伯罗奔尼撒的军区忠诚#R −5#!（如果有）\n米斯特拉获得[ShowModifier('oe_lat_mistra_unrest')]，持续#Y 3#!年"
 oe_lat.6.c: "严令接纳骑士"
 oe_lat.6.c.tt: "伯罗奔尼撒的军区忠诚#R −15#!（如果有）\n医院骑士团对帝国好感#G +10#!，持续#Y 5#!年"
 oe_lat.7.t: "赎回摩里亚"
 oe_lat.7.desc_ivr: "#F 1402年安卡拉之战后，奥斯曼陷入内乱；1404年前后，狄奥多一世从骑士团手里收回了专制公国。#!\n\n如今，苏丹在东方吃了大败仗，奥斯曼诸子正在争位。骑士团的兵已不必再留在摩里亚，按约，帝国可以把它赎回来。"
 oe_lat.7.desc_byd: "#F 1402年安卡拉之战后，奥斯曼陷入内乱；1404年前后，狄奥多一世从骑士团手里收回了专制公国。#!\n\n如今，京城的封锁已经解除。骑士团的兵已不必再留在摩里亚，按约，帝国可以把它赎回来。"
 oe_lat.7.desc_plain: "#F 1402年安卡拉之战后，奥斯曼陷入内乱；1404年前后，狄奥多一世从骑士团手里收回了专制公国。#!\n\n如今，骑士团已在摩里亚守了好几年。骑士团的兵已不必再留在摩里亚，按约，帝国可以把它赎回来。"
 oe_lat.7.a: "按约赎回"
 oe_lat.7.a.tt: "花费#R 3#!个月的贸易与税收收入\n移除所有[ShowModifier('oe_lat_knights_morea')]和[ShowModifier('oe_lat_mistra_unrest')]\n医院骑士团对帝国好感#G +10#!，持续#Y 10#!年"
 oe_lat.7.b: "以船只和赦免抵价"
 oe_lat.7.b.tt: "花费#R 1#!个月的贸易与税收收入\n移除所有[ShowModifier('oe_lat_knights_morea')]和[ShowModifier('oe_lat_mistra_unrest')]\n医院骑士团对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.7.c: "再请骑士留五年"
 oe_lat.7.c.tt: "我们和附庸在伯罗奔尼撒的每个地点的[ShowModifier('oe_lat_knights_morea')]重新计时，持续#Y 5#!年\n伯罗奔尼撒的军区忠诚#R −10#!（如果有）\n五年后骑士团自行撤走"
 oe_lat.13.t: "罗得岛被围"
 oe_lat.13.desc_mam: "#F 1444年8月，马穆鲁克的八十五艘船围攻罗得岛约四十天，大团长让·德·拉斯蒂克守住了城；勃艮第和教皇事先送来了船和补给。#!\n\n如今，[SCOPE.sCountry('oe_lat_besieger').GetName]的军队围住了罗得岛的城堡。骑士团派快船来京城，请求粮食和援兵。"
 oe_lat.13.desc_tur: "#F 1480年5月至8月，奥斯曼的一百六十艘船围攻罗得岛，统帅梅西赫帕夏久攻不下，大团长皮埃尔·道比松守住了城。#!\n\n如今，[SCOPE.sCountry('oe_lat_besieger').GetName]的军队围住了罗得岛的城堡。骑士团派快船来京城，请求粮食和援兵。"
 oe_lat.13.desc_plain: "#F 1306年至1310年间，医院骑士团从帝国手里夺下罗得岛，从此以这里为基地，在海上与突厥人作战。#!\n\n如今，[SCOPE.sCountry('oe_lat_besieger').GetName]的军队围住了罗得岛的城堡。骑士团派快船来京城，请求粮食和援兵。"
 oe_lat.13.a: "运粮运兵去罗得"
 oe_lat.13.a.tt: "花费#R 2#!个月的贸易与税收收入，医院骑士团得到同样多的金币\n医院骑士团对帝国好感#G +25#!，持续#Y 20#!年\n[SCOPE.sCountry('oe_lat_besieger').GetName]对帝国好感#R −20#!，持续#Y 10#!年\n若[SCOPE.sCountry('oe_lat_besieger').GetName]是奥斯曼、帝国正臣属苏丹：苏丹的耐心#R −20#!"
 oe_lat.13.b: "只送一船粮"
 oe_lat.13.b.tt: "花费#R 1#!个月的贸易与税收收入，医院骑士团得到同样多的金币\n医院骑士团对帝国好感#G +10#!，持续#Y 10#!年"
 oe_lat.13.c: "袖手旁观"
 oe_lat.13.c.tt: "若[SCOPE.sCountry('oe_lat_besieger').GetName]是奥斯曼、帝国正臣属苏丹：苏丹的耐心#G +5#!"
 oe_lat.4.t: "亚历山大的消息"
 oe_lat.4.desc: "#F 1363年3月，塞浦路斯国王彼得一世与法国国王约翰二世在阿维尼翁当着教皇发愿东征；1365年，教皇乌尔班五世发诏书，认可了彼得一世的远征。#!\n\n如今，塞浦路斯人带着威尼斯的船和罗得岛的骑士劫掠了亚历山大，三天后满载而归，约五千人被掳走。据说马穆鲁克苏丹要拿治下的基督徒出气。东方的三位牧首——亚历山大、安条克、耶路撒冷——都在苏丹治下；亚历山大的商路也断了。"
 oe_lat.4.a: "遣使开罗，为东方的基督徒说情"
 oe_lat.4.a.tt: "花费#R 1#!个月的贸易与税收收入\n马穆鲁克对帝国好感#G +15#!，持续#Y 10#!年\n塞浦路斯对帝国好感#R −10#!，持续#Y 5#!年\n[oe_tu_patriarchate|e]#G +2#!"
 oe_lat.4.b: "祝贺塞浦路斯国王"
 oe_lat.4.b.tt: "塞浦路斯对帝国好感#G +15#!，持续#Y 10#!年\n马穆鲁克对帝国好感#R −15#!，持续#Y 10#!年\n教廷对帝国好感#G +5#!，持续#Y 5#!年"
 oe_lat.4.c: "让帝国商人填上空缺"
 oe_lat.4.c.tt: "帝国获得[ShowModifier('oe_lat_alex_trade')]，持续#Y 5#!年\n威尼斯和热那亚对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.8.t: "士麦那陷落"
 oe_lat.8.desc_t_lost: "#F 1344年秋，教皇的同盟一举夺下士麦那的港堡；1374年起，罗得岛的医院骑士团接手了那里的城防。#!\n\n如今，帖木儿的大军来到士麦那城下，不到半个月就攻破了城。骑士们乘船逃走，城中的基督徒遭了屠戮，士麦那归了[SCOPE.sCountry('oe_lat_smy').GetName]。骑士团说要在对岸的哈利卡纳苏斯另筑城堡；西方的国王们还要靠帝国的使者，才听得到士麦那失守的消息。"
 oe_lat.8.desc_t_sack: "#F 1344年秋，教皇的同盟一举夺下士麦那的港堡；1374年起，罗得岛的医院骑士团接手了那里的城防。#!\n\n如今，帖木儿的大军来到士麦那城下，不到半个月就攻破了城，劫掠一空才离去。骑士们乘船逃走，城中的基督徒遭了屠戮。骑士团说要在对岸的哈利卡纳苏斯另筑城堡；西方的国王们还要靠帝国的使者，才听得到士麦那失守的消息。"
 oe_lat.8.desc_t_port: "#F 1344年秋，教皇的同盟一举夺下士麦那的港堡；1374年起，罗得岛的医院骑士团接手了那里的城防。#!\n\n如今，帖木儿的大军攻破了士麦那的港堡。骑士们乘船逃走，留在港堡里的基督徒遭了屠戮，拉丁人在士麦那守了半个多世纪的据点就这样丢了。骑士团说要在对岸的哈利卡纳苏斯另筑城堡；西方的国王们还要靠帝国的使者，才听得到士麦那失守的消息。"
 oe_lat.8.desc_late: "#F 1344年秋，教皇的同盟一举夺下士麦那的港堡；1374年起，罗得岛的医院骑士团接手了那里的城防。#!\n\n如今，[SCOPE.sCountry('oe_lat_smy').GetName]的军队夺下了士麦那，拉丁人在这里的据点丢了。逃出来的人挤在港口，等着有船来接。"
 oe_lat.8.desc_early: "#F 1344年秋，教皇的同盟一举夺下士麦那的港堡；此后多年，拉丁人一直守着这座港口。#!\n\n如今，[SCOPE.sCountry('oe_lat_smy').GetName]的军队夺下了士麦那，拉丁人在这里的据点丢了。逃出来的人挤在港口，等着有船来接。"
 oe_lat.8.a: "派船接回幸存者"
 oe_lat.8.a.tt: "花费#R 1#!个月的贸易与税收收入\n医院骑士团对帝国好感#G +25#!，持续#Y 20#!年"
 oe_lat.8.b: "遣使帖木儿"
 oe_lat.8.b.tt: "[GetCountry('TIM').GetName]对帝国好感#G +15#!，持续#Y 10#!年\n医院骑士团对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.8.c: "闭门自保"
 oe_lat.8.c.tt: "不派船，也不遣使"
 oe_lat.9.t: "教皇的十字军诏书"
 oe_lat.9.desc_u_2: "#F 1443年元旦，教皇尤金四世发出十字军诏书。当年秋天，匈牙利与波兰的国王瓦迪斯瓦夫、匈雅提和塞尔维亚的布兰科维奇一同出兵巴尔干，冬天打到山口；12月12日在兹拉蒂察受挫，退了回来。#!\n\n如今，教皇号召的十字军正在集结，匈牙利和波兰的军队要沿多瑙河南下。合一之后，西方总算拿出了回报。十字军请帝国出船把守海峡，挡住苏丹从亚洲调兵；也请摩里亚的专制公北上牵制。\n[oe_tu_west_will|e]如今是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!（#Y 0#!到#Y 100#!）。"
 oe_lat.9.desc_u_1: "#F 1443年元旦，教皇尤金四世发出十字军诏书。#!\n\n如今，教皇号召的十字军正在集结，匈牙利和波兰的军队要沿多瑙河南下。合一之后，西方总算拿出了回报。十字军请帝国出船把守海峡，挡住苏丹从亚洲调兵；也请摩里亚的专制公北上牵制。\n[oe_tu_west_will|e]如今是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!（#Y 0#!到#Y 100#!）。"
 oe_lat.9.desc_u_0: "#F 1439年7月，佛罗伦萨会议宣布东西教会合一，以弗所的马可拒绝签字。#!\n\n如今，教皇号召的十字军正在集结，匈牙利和波兰的军队要沿多瑙河南下。合一之后，西方总算拿出了回报。十字军请帝国出船把守海峡，挡住苏丹从亚洲调兵；也请摩里亚的专制公北上牵制。\n[oe_tu_west_will|e]如今是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!（#Y 0#!到#Y 100#!）。"
 oe_lat.9.desc_n_2: "#F 1443年元旦，教皇尤金四世发出十字军诏书。当年秋天，匈牙利与波兰的国王瓦迪斯瓦夫、匈雅提和塞尔维亚的布兰科维奇一同出兵巴尔干，冬天打到山口；12月12日在兹拉蒂察受挫，退了回来。#!\n\n如今，教皇号召的十字军正在集结，匈牙利和波兰的军队要沿多瑙河南下。教皇的使者把话说在前头：要西方真心相助，先得合一。十字军请帝国出船把守海峡，挡住苏丹从亚洲调兵；也请摩里亚的专制公北上牵制。\n[oe_tu_west_will|e]如今是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!（#Y 0#!到#Y 100#!）。"
 oe_lat.9.desc_n_1: "#F 1443年元旦，教皇尤金四世发出十字军诏书。#!\n\n如今，教皇号召的十字军正在集结，匈牙利和波兰的军队要沿多瑙河南下。教皇的使者把话说在前头：要西方真心相助，先得合一。十字军请帝国出船把守海峡，挡住苏丹从亚洲调兵；也请摩里亚的专制公北上牵制。\n[oe_tu_west_will|e]如今是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!（#Y 0#!到#Y 100#!）。"
 oe_lat.9.desc_n_0: "#F 1439年7月，佛罗伦萨会议宣布东西教会合一，以弗所的马可拒绝签字。#!\n\n如今，教皇号召的十字军正在集结，匈牙利和波兰的军队要沿多瑙河南下。教皇的使者把话说在前头：要西方真心相助，先得合一。十字军请帝国出船把守海峡，挡住苏丹从亚洲调兵；也请摩里亚的专制公北上牵制。\n[oe_tu_west_will|e]如今是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!（#Y 0#!到#Y 100#!）。"
 oe_lat.9.a: "船只把守海峡，摩里亚北上"
 oe_lat.9.a.tt: "花费#R 3#!个月的贸易与税收收入\n匈牙利、教廷和波兰对帝国好感#G +20#!，持续#Y 10#!年\n若雅典的主人既不是帝国一方、也不是奥斯曼：获得对它的宣战理由，持续#Y 10#!年\n伯罗奔尼撒的军区忠诚#G +5#!（如果有）\n在海峡拦住苏丹的胜算#G +20%#!，瓦尔纳一战十字军的胜算#G +10%#!\n若帝国正臣属苏丹：苏丹的耐心#R −30#!"
 oe_lat.9.b: "只出几艘船"
 oe_lat.9.b.tt: "花费#R 1#!个月的贸易与税收收入\n匈牙利和教廷对帝国好感#G +10#!，持续#Y 5#!年\n在海峡拦住苏丹的胜算#G +10%#!，瓦尔纳一战十字军的胜算#G +5%#!\n若帝国正臣属苏丹：苏丹的耐心#R −15#!"
 oe_lat.9.c: "守着与苏丹的和约"
 oe_lat.9.c.tt: "奥斯曼对帝国好感#G +15#!，持续#Y 5#!年\n匈牙利和教廷对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lat.10.t: "海峡上的船"
 oe_lat.10.desc_2c: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。1444年8月，苏丹穆拉德二世与卡拉曼议和，与匈牙利的塞格德和约也随之生效；随后苏丹让位给年轻的儿子穆罕默德。据记载，那年秋天，西方各国和帝国的船只曾试图封锁海峡。#!\n\n如今，十字军又出兵了。教廷、威尼斯和勃艮第的船驶进达达尼尔，帝国的船守着博斯普鲁斯。船队守住了海峡，苏丹的大军被挡在了亚洲一侧。"
 oe_lat.10.desc_2b: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。1444年8月，苏丹穆拉德二世与卡拉曼议和，与匈牙利的塞格德和约也随之生效；随后苏丹让位给年轻的儿子穆罕默德。#!\n\n如今，十字军又出兵了。教廷、威尼斯和勃艮第的船驶进达达尼尔，帝国的船守着博斯普鲁斯。船队守住了海峡，苏丹的大军被挡在了亚洲一侧。"
 oe_lat.10.desc_2a: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。#!\n\n如今，十字军又出兵了。教廷、威尼斯和勃艮第的船驶进达达尼尔，帝国的船守着博斯普鲁斯。船队守住了海峡，苏丹的大军被挡在了亚洲一侧。"
 oe_lat.10.desc_1c: "#F 1443年冬，十字军打到巴尔干山口，在兹拉蒂察受挫退回。1444年8月，苏丹穆拉德二世与卡拉曼议和，与匈牙利的塞格德和约也随之生效；随后苏丹让位给年轻的儿子穆罕默德。据记载，那年秋天，西方各国和帝国的船只曾试图封锁海峡。#!\n\n如今，十字军又出兵了。教廷、威尼斯和勃艮第的船驶进达达尼尔，帝国的船守着博斯普鲁斯，要把苏丹的大军挡在亚洲。可苏丹还是带着大军渡过了海峡，十字军却还蒙在鼓里。"
