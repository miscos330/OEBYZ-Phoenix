 STATIC_MODIFIER_NAME_oe_pglh_qarachi_privileges_mod: "四大柱石家族特权"
 STATIC_MODIFIER_DESC_oe_pglh_qarachi_privileges_mod: "希林、巴林、阿尔浑与钦察四大世袭家族获准共议军国，草原骑兵战意与部落凝聚高涨，但大汗直辖税权受掣。"
 STATIC_MODIFIER_NAME_oe_pglh_darugha_central_mod: "达鲁花赤直辖税网"
 STATIC_MODIFIER_DESC_oe_pglh_darugha_central_mod: "大汗遣亲信达鲁花赤直管各地商站与岁赋，财政效率与汗权大幅抬升，令保守游牧长老颇感不满。"
 STATIC_MODIFIER_NAME_oe_pglh_yarliq_iron_yoke_mod: "扎尔里克铁血复征"
 STATIC_MODIFIER_DESC_oe_pglh_yarliq_iron_yoke_mod: "大汗以铁骑雷霆重申对罗斯诸公的敕书威权，全军士气与攻城烈度骤升。"
 STATIC_MODIFIER_NAME_oe_pglh_yarliq_silver_tariff_mod: "罗斯金银关约"
 STATIC_MODIFIER_DESC_oe_pglh_yarliq_silver_tariff_mod: "以契约化的伏尔加河金银商税替代频繁军事讨伐，换取长久稳定岁入与外交声望。"
 STATIC_MODIFIER_NAME_oe_pglh_steppe_duel_mod: "昆都尔察与捷列克备战"
 STATIC_MODIFIER_DESC_oe_pglh_steppe_duel_mod: "为争夺术赤与察合台之间的欧亚草原最高霸权，全汗国进入铁马总动员状态。"
 STATIC_MODIFIER_NAME_oe_pglh_steppe_partition_mod: "花剌子模—阿塞拜疆划界约"
 STATIC_MODIFIER_DESC_oe_pglh_steppe_partition_mod: "与草原劲敌划定阿塞拜疆与花剌子模商道边界，避免两败俱伤并共享丝路税利。"
 STATIC_MODIFIER_NAME_oe_pglh_sarai_reborn_loc_mod: "新萨莱商队复兴令"
 STATIC_MODIFIER_DESC_oe_pglh_sarai_reborn_loc_mod: "大汗免税三年招徕伏尔加商队重修砖砌驿馆、水渠与市集，令草原都城浴火重生。"
 STATIC_MODIFIER_NAME_oe_pglh_ulugh_observatory_mod: "兀鲁伯撒马尔罕星历学派"
 STATIC_MODIFIER_DESC_oe_pglh_ulugh_observatory_mod: "汇集波斯与突厥天算名家的撒马尔罕皇家天文台令河中成为欧亚科学灯塔。"
 STATIC_MODIFIER_NAME_oe_pglh_suyurghal_audit_mod: "索尤尔加勒封地清核"
 STATIC_MODIFIER_DESC_oe_pglh_suyurghal_audit_mod: "清查世袭免税封地并收回军政直辖，强化中央常备纪律与国库统筹。"
 STATIC_MODIFIER_NAME_oe_pglh_sedentary_settlements_mod: "钦察驿站农庄拓殖"
 STATIC_MODIFIER_DESC_oe_pglh_sedentary_settlements_mod: "沿伏尔加河与顿河修筑木石堡垒、屯田农庄与官办驿站，加速草原向农商定居转化。"
 STATIC_MODIFIER_NAME_oe_pglh_nomad_mobility_mod: "铁骑机动古训"
 STATIC_MODIFIER_DESC_oe_pglh_nomad_mobility_mod: "恪守游牧骑射本色与轻装奔袭古法，令敌军难以捕捉大汗主力行踪。"
 STATIC_MODIFIER_NAME_oe_pglh_fur_silk_customs_mod: "黑海—里海毛皮丝绸税单"
 STATIC_MODIFIER_DESC_oe_pglh_fur_silk_customs_mod: "依托阿斯特拉罕与塔纳—卡法门户将北方貂皮与中亚生丝并网征税，充盈国库与商力。"
 STATIC_MODIFIER_NAME_oe_pglh_new_yassa_charter_mod: "《新札撒定居大宪章》"
 STATIC_MODIFIER_DESC_oe_pglh_new_yassa_charter_mod: "将成吉思汗大札撒古法与定居火药君主制熔于一炉，使汗国跨入近代常备官僚与火炮帝国行列。"
 STATIC_MODIFIER_NAME_oe_pglh_tabur_readiness_mod: "草原大车堡垒与骆驼抬枪阵"
 STATIC_MODIFIER_DESC_oe_pglh_tabur_readiness_mod: "以铁链相连的大车木盾堡垒掩护火枪手与驼载旋炮，令草原大军兼具坚壁防御与机动炮火。"
 STATIC_MODIFIER_NAME_oe_pglh_volga_canal_works_mod: "佩列沃洛克运河工期"
 STATIC_MODIFIER_DESC_oe_pglh_volga_canal_works_mod: "数万工匠与军屯正在伏尔加河与顿河最窄地峡间开凿船闸与运河，短期消耗人力财力。"
 STATIC_MODIFIER_NAME_oe_pglh_volga_don_canal_complete: "伏尔加—顿河大运河通航"
 STATIC_MODIFIER_DESC_oe_pglh_volga_don_canal_complete: "超越 1569 年构想的世纪运河正式竣工！里海与黑海商船战舰直通互联，草原腹地跃升欧亚水运心脏。"
 STATIC_MODIFIER_NAME_oe_pglh_volga_canal_port_loc_mod: "双海运河门户港"
 STATIC_MODIFIER_DESC_oe_pglh_volga_canal_port_loc_mod: "贯通黑海与里海的大运河船闸令此港商船云集、繁荣日盛。"
 STATIC_MODIFIER_NAME_oe_pglh_sarai_gunsmiths_mod: "萨莱—河中皇家铸炮体系"
 STATIC_MODIFIER_DESC_oe_pglh_sarai_gunsmiths_mod: "延揽安纳托利亚、波斯与威尼斯铸炮宗师驻场造炮，令帝国重炮维护更省、破城更快。"
 STATIC_MODIFIER_NAME_oe_pglh_iron_curtain_mod: "欧亚三面边防军镇"
 STATIC_MODIFIER_DESC_oe_pglh_iron_curtain_mod: "面对莫斯科、波立与南方强权的合围压力，沿伏尔加、第聂伯与高加索筑起纵深炮垒防线。"
 STATIC_MODIFIER_NAME_oe_pglh_polyglot_academy_mod: "大汗多语译馆与近代军校"
 STATIC_MODIFIER_DESC_oe_pglh_polyglot_academy_mod: "突厥、波斯与斯拉夫三语典籍与近代测绘火炮课程同堂讲授，大幅推升思潮传播与官僚素质。"
 STATIC_MODIFIER_NAME_oe_pglh_ural_industry_mod: "乌拉尔矿脉与草原工场"
 STATIC_MODIFIER_DESC_oe_pglh_ural_industry_mod: "开发乌拉尔铁铜矿脉并在伏尔加流域设立官督商办工场，驱动草原帝国迈向近代工业。"
 STATIC_MODIFIER_NAME_oe_pglh_constitutional_yassa_mod: "《欧亚二元立宪札撒》"
 STATIC_MODIFIER_DESC_oe_pglh_constitutional_yassa_mod: "将古老草原大会与成文宪法结合，以市民、贵族与多民族代议制共塑近代立宪汗国。"
 STATIC_MODIFIER_NAME_oe_pglh_absolute_gunpowder_mod: "绝对大汗火药帝国"
 STATIC_MODIFIER_DESC_oe_pglh_absolute_gunpowder_mod: "大汗独揽常备炮兵、铁路前夜驿传与中央财政，以铁腕纪律威震欧亚内陆。"
 STATIC_MODIFIER_NAME_oe_pglh_twin_phoenix_hub_mod: "丝路双凤草原中转红利"
 STATIC_MODIFIER_DESC_oe_pglh_twin_phoenix_hub_mod: "东罗马与东方中原和平通商之际，横贯钦察与河中的陆上丝路过境税源源不绝。"
 oe_pglh_b_yarliq_tribute: "罗斯金银关约互信"
 oe_pglh_b_yarliq_wrath: "扎尔里克铁骑讨伐"
 oe_pglh_b_steppe_accord: "花剌子模—阿塞拜疆划界和议"
 oe_pglh_b_steppe_rivalry: "昆都尔察与捷列克草原死敌"
 oe_pglh_b_silk_twin_phoenix: "丝路双凤草原通使厚谊"
 oe_pglh_b_iron_curtain: "草原边防军镇对峙"
 oe_pglh_ref_gunpowder_khanate: "草原火药汗国"
 oe_pglh_ref_gunpowder_khanate_desc: "以《新札撒定居大宪章》熔铸游牧轻骑机动传统与近代野战炮兵、常备官僚控制网，令昔日草原汗国完成向近代火药帝国的跃迁。"
 oe_pglh_ref_timurid_renaissance_court: "河中星辰宫廷"
 oe_pglh_ref_timurid_renaissance_court_desc: "承袭撒马尔罕与赫拉特的帖木儿文艺复兴风华，以皇家天文台、突厥—波斯双语翰林与工艺赞助引领欧亚内陆学术复兴。"
 oe_pglh_yassa_governance_law: "大札撒汗廷治理法"
 oe_pglh_yassa_governance_law_desc: "界定术赤与河中汗廷在四大柱石家族共治、达鲁花赤直辖清丈与索尤尔加勒文化封赏之间的宪政平衡。"
 oe_pglh_pol_qarachi_council: "四大柱石共议制"
 oe_pglh_pol_qarachi_council_desc: "尊奉希林、巴林、阿尔浑与钦察四大世袭柱石共参军政，换取草原铁骑精锐与部落高度凝聚。"
 oe_pglh_pol_darugha_cadastre: "达鲁花赤直辖清丈"
 oe_pglh_pol_darugha_cadastre_desc: "由大汗直派达鲁花赤清核商镇与定居农庄田赋，逐步压制部族割据并充实中央国库。"
 oe_pglh_pol_suyurghal_patronage: "索尤尔加勒兴学封赏"
 oe_pglh_pol_suyurghal_patronage_desc: "以世袭免税封地礼聘中亚学者、苏菲导师与工匠入仕，推动河中与伏尔加学术文教繁荣。"
 oe_pglh_sarai_gun_foundry: "萨莱—河中皇家铸炮局"
 oe_pglh_sarai_gun_foundry_desc: "汇集突厥、波斯与安纳托利亚铸炮匠人的内亚火器重工枢纽，专造大车堡垒火枪与驼载轻炮，并带动本地官督商贸与行政控制。"
 oe_pglh_sarai_gun_foundry_maint: "皇家铸炮局（火器维护）"
 oe_pglh_tabur_musketeers: "草原大车堡垒火枪卫队"
 oe_pglh_tabur_musketeers_desc: "以铁链连缀包铁战车构筑移动木石壁垒（Tabur / Gulyay-gorod），在开阔草原与平原上以密集火绳枪齐射瓦解重骑冲锋。"
 oe_pglh_zamburak_horse_artillery: "驼载旋炮与草原轻骑炮"
 oe_pglh_zamburak_horse_artillery_desc: "将轻型青铜旋炮架设于骆驼鞍架与快马炮车之上，随草原大军日行百里，令重炮火力首次追上铁骑奔袭节奏。"
 oe_pglh_adv_steppe_tabur: "草原大车堡垒与驼载轻炮操典"
 oe_pglh_adv_steppe_tabur_desc: "融合东欧移动车阵、奥斯曼火绳枪队与中亚骆驼抬枪战法，解锁草原大车堡垒火枪卫队与驼载轻骑炮，并全面强化野战炮火与机动。"
 oe_pglh_dec_charter_sedentary_steppe.title: "颁布《新札撒定居大宪章》"
 oe_pglh_dec_charter_sedentary_steppe.desc: "当草原商镇、驿站农庄与税册已具规模时，大汗可召开盛大忽里勒台，将游牧行营汗国正式转型为定居领土火药君主国，在保留铁骑传统的同时解锁近代官僚与常备炮兵。"
 oe_pglh_dec_charter_sedentary_steppe.a: "以新札撒定鼎定居帝国"
 oe_pglh_dec_dig_volga_don_canal.title: "兴修佩列沃洛克伏尔加—顿河运河"
 oe_pglh_dec_dig_volga_don_canal.desc: "在伏尔加河与顿河最窄的佩列沃洛克地峡分段开凿运河船闸（共 3 阶）。竣工后将彻底打通黑海与里海航运商道，令草原腹地跃居欧亚水陆枢纽。"
 oe_pglh_dec_dig_volga_don_canal.a: "拨款征夫推进运河一阶"
 oe_pglh_dec_assemble_tabur_corps.title: "编练草原大车堡垒火枪兵团"
 oe_pglh_dec_assemble_tabur_corps.desc: "将铁链相连的大车木盾堡垒、火绳枪齐射与驼载旋炮融为一体（最高 4 阶），打造兼具草原机动与近代火力的内亚精锐兵团。"
 oe_pglh_dec_assemble_tabur_corps.a: "扩编大车火枪与旋炮队列"
 oe_pglh.1.t: "月即别汗遗产与四大柱石议会"
 oe_pglh.1.d: "月即别汗缔造的草原盛世犹在眼前，然萨莱宫廷的实权正悬于成吉思汗直系汗统与四大草原柱石家族——希林、巴林、阿尔浑与钦察（Qarachi Begs）之间。诸部伯克齐聚大帐，要求大汗明示今后军国大政的归属：是尊崇四大家族世袭共议，还是遣亲信达鲁花赤（Darugha）直辖税赋与商站？"
 oe_pglh.1.a: "礼遇四大柱石家族，共守草原铁骑旧盟"
 oe_pglh.1.b: "广派达鲁花赤直辖商站税册，整肃中央汗权"
 oe_pglh.2.t: "库里科沃余波与朝贡敕书"
 oe_pglh.2.d: "北方森林地带的罗斯诸公借汗廷内乱抗缴岁贡，莫斯科与弗拉基米尔的使节竟敢质疑萨莱颁发的《扎尔里克》（Yarliq）册封敕书。鹰派万户力主效法脱脱迷失奔袭焚城、以铁骑重立鞑靼枷锁；商团与书吏则主张改订定额金银关约，将伏尔加河上下游纳入和平税网。"
 oe_pglh.2.a: "发兵北伐重立《扎尔里克》铁血枷锁"
 oe_pglh.2.b: "改立伏尔加金银关约，换取罗斯长久商税"
 oe_pglh.3.t: "昆都尔察河与捷列克河"
 oe_pglh.3.d: "自阿塞拜疆的丝路税站至花剌子模的沃野，钦察草原的黄金家族与撒马尔罕崛起的跛子铁木儿已成水火之势。史家在《武功记》中疾书这场注定震动欧亚的大碰撞——若两雄决战于昆都尔察河与捷列克河畔，胜者将独霸内亚，败者恐见新萨莱化为焦土；抑或双方在血战之前划界分治？"
 oe_pglh.3.a: "横刀勒马昆都尔察河，决出欧亚草原唯一雄主！"
 oe_pglh.3.b: "划定阿塞拜疆与花剌子模商界，息兵共享丝路"
 oe_pglh.4.t: "新萨莱的灰烬与重生"
 oe_pglh.4.d: "连年草原兵燹令伏尔加河畔的新萨莱（Sarai al-Jadid）瓷窑、商馆与水渠满目疮痍。然而沿河的驿道尚未断绝，花剌子模与黑海商队仍翘首以盼大汗降下「商队重建令」——只要免去三年市税并兴筑砖石城垣，新萨莱便能重燃昔日十万烟火。"
 oe_pglh.4.a: "颁布新萨莱商队重建令，重修水渠与商馆"
 oe_pglh.4.b: "仅复修大汗冬营军库，节财以养机动铁骑"
 oe_pglh.5.t: "撒马尔罕的星辰"
 oe_pglh.5.d: "绿松石穹顶在撒马尔罕的晨光中熠熠生辉。兀鲁伯与河中天算宗师正筹建宏伟的石砌六分仪天文台，将赫拉特与撒马尔罕推向伊斯兰文艺复兴的巅峰；但与此同时，大批世袭免税的「索尤尔加勒」（Suyurghal）封地正蚕食军政直辖岁入。大汗将如何取舍？"
 oe_pglh.5.a: "倾力资助兀鲁伯天文台与河中文艺复兴"
 oe_pglh.5.b: "清核索尤尔加勒免税封地，收回中央军权"
 oe_pglh.6.t: "钦察草原定居化大讨论"
 oe_pglh.6.d: "随着伏尔加与顿河流域城寨日增，保守游牧长老在大帐前发出严厉警告：「成吉思汗大札撒训诫子孙莫陷泥屋享乐，若弃毡帐而事耕织，谁来驰骋万里草原？」而年轻的税吏与商镇总督反驳道，唯有着城建堡、屯粮冶铁，汗国方能抵御近代火器与农耕大国的步步紧逼。"
 oe_pglh.6.a: "兴建驿站商堡与定居农庄，顺应时代转型"
 oe_pglh.6.b: "维系纯游牧铁骑机动优势，安抚诸部万户"
 oe_pglh.7.t: "黑海—里海毛皮与丝绸税单"
 oe_pglh.7.d: "阿斯特拉罕的里海盐船与塔纳、卡法的黑海商帆已同归大汗旗帜之下。北方针叶林的紫貂毛皮、花剌子模的精纺生丝与克里米亚粮船在此交汇，户部呈上一份囊括两海商路的新式关税总册。"
 oe_pglh.7.a: "设立两海统一关税署，联通北线丝路商网"
 oe_pglh.7.b: "重征过境白银厚赏边军将士"
 oe_pglh.8.t: "《新札撒定居大宪章》颁布"
 oe_pglh.8.d: "历经数代人的蓄势与筑城，草原诸翼、定居市民与火器工匠终于在巍峨的砖石汗宫前齐声欢呼！大汗御笔签发《新札撒定居大宪章》：游牧行营正式升格为稳固的领土火药君主国，既承黄金家族铁骑雄风，又尽享近代官僚税制、皇家铸炮与常备炮兵之利。"
 oe_pglh.8.a: "颁行《新札撒》，铸就草原火药帝国！"
 oe_pglh.8.b: "暂缓更易祖制，仅收编定居税吏作权宜之计"
 oe_pglh.9.t: "草原大车堡垒与骆驼抬枪"
 oe_pglh.9.d: "面对东欧重骑冲锋与火枪方阵，汗国将领大胆汲取「古利亚伊戈罗德」（Gulyay-gorod）移动木堡与奥斯曼大车阵法：将数百辆包铁战车以铁链首尾相扣，内藏火绳枪卫队，外配骆驼鞍架轻型旋炮（Zamburak），令草原军团在旷野之中随时化作一座会移动的钢铁要塞！"
 oe_pglh.9.a: "全面列装大车堡垒与驼载旋炮，推进草原军事革命"
 oe_pglh.9.b: "先在小股亲卫中试行，避免动摇骑兵经费"
 oe_pglh.10.t: "佩列沃洛克的宏图"
 oe_pglh.10.d: "1569 年索库鲁·穆罕默德帕夏曾梦想在佩列沃洛克凿通伏尔加河与顿河之间那道狭窄的草原地峡，却因后勤溃散功败垂成。如今掌握阿斯特拉罕与塔纳双门户的大汗立于河畔：若倾举国之力浚通双海船闸，里海商船与战舰将直抵黑海，彻底重塑欧亚地缘命脉！"
 oe_pglh.10.a: "力排众议贯通双海运河，成就草原千秋伟业！"
 oe_pglh.10.b: "修建陆上滚木拖船道，量力分步推进"
 oe_pglh.11.t: "萨莱皇家铸炮局落成"
 oe_pglh.11.d: "来自安纳托利亚、大不里士与伦巴第的青铜铸炮宗师已云集汗国炉坊。第一批双轮野战榴弹炮与精铸火绳枪在试射场上轰鸣作响，硝烟散尽后，昔日被嘲为「只擅弯弓」的草原汗国已拥有足以撼动石城的重炮工坊。"
 oe_pglh.11.a: "赐予皇家特许状，扩建常设火炮铸造与试射署"
 oe_pglh.11.b: "向商团开放部分炉膛铸造民用铁器以补国库"
 oe_pglh.12.t: "三面铁幕"
 oe_pglh.12.d: "北方的俄罗斯炮团、西翼的波立翼骑兵与南疆的安纳托利亚—伊朗火药强权同时逼近草原边陲。情报驿骑日夜驰报：若汗国不立即整编纵深边防军镇并分化对手，钦察与河中沃野恐将沦为列强逐鹿的战场。"
 oe_pglh.12.a: "沿伏尔加、第聂伯与高加索构筑三面炮垒防线"
 oe_pglh.12.b: "遣使远交近攻，以商道特许分化合围列强"
 oe_pglh.13.t: "欧亚大汗的启蒙学府"
 oe_pglh.13.d: "18 世纪的启蒙思潮越过黑海与波斯传入草原都会。汗廷翰林与远游归来的青年官员提议在都城设立突厥—波斯—斯拉夫三语皇家译馆与近代测绘军校，将古代河中天文算学传统与欧洲近代力学、弹道学熔为一炉。"
 oe_pglh.13.a: "设立三语皇家译馆与近代炮兵测绘军校"
 oe_pglh.13.b: "专精炮兵弹道与兵工实用学堂，不涉礼法清谈"
 oe_pglh.14.t: "草原农牧工场与乌拉尔矿脉开发"
 oe_pglh.14.d: "勘探队在乌拉尔山麓探明绵延百里的富铁与铜矿脉，而伏尔加下游的皮革、呢绒与硝石工场亦初具近代规模。凭借贯通欧亚腹地的商道，大汗可将内亚打造为不逊于西欧的矿冶与制造引擎。"
 oe_pglh.14.a: "兴办官督商办乌拉尔矿冶与河谷工场网"
 oe_pglh.14.b: "向商团特许包采矿山，坐收巨额矿税白银"
 oe_pglh.15.t: "终极宪政抉择"
 oe_pglh.15.d: "步入 18 世纪下半叶，曾经驰骋欧亚的草原霸主迎来迈向近代世界的终极定调。一派主张将古老的忽里勒台公议升华为《欧亚二元立宪札撒》，以成文宪法统筹突厥、波斯与斯拉夫诸族市民与贵族；另一派则主张以绝对大汗权威统御常备重炮军团与中央国库，以铁腕雄踞内陆心脏。"
 oe_pglh.15.a: "颁布《欧亚二元立宪札撒》，以多族宪政领航新世纪"
 oe_pglh.15.b: "确立《绝对大汗火药帝国》，以铁血重炮威震欧亚"
 oe_pglh.16.t: "丝路双凤的草原枢纽"
 oe_pglh.16.d: "当博斯普鲁斯的紫衣罗马与东方天朝同时屹立于欧亚两端且干戈暂息之时，横贯萨莱、阿斯特拉罕与撒马尔罕的陆上丝路再度车水马龙！东西两京的丝绸、瓷器、玻璃与白银商队络绎不绝，甘愿向掌控草原命脉的大汗缴纳丰厚过境关银。"
 oe_pglh.16.a: "发给东西双凤商队金牌护通行，坐享跨洲关税暴涨"
 oe_pglh.16.b: "强征重税截留商队珍宝充实军费"
 oe_pglh.90.t: "金帐与帖木儿主角线总览"
 oe_pglh.90.d: "#T Slot 75 金帐汗国与帖木儿火药帝国（oe_pglh_）#!\n定居化进度（0–100，≥75 可转制）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_sedentary').GetValue|0]\n四大柱石 vs 大汗集权轴（-100..+100）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_qarachi').GetValue|0]\n草原大车堡垒火炮等级（0–4）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_tabur').GetValue|0]\n伏尔加—顿河运河阶段（0–3）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_canal').GetValue|0]\n已颁布新札撒定居帝国（0/1）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_settled').GetValue|0]  |  当前领土定居形态（0游牧/1定居）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_landed').GetValue|0]\n#T Slot 45 oe_ghh_ 只读联动#!\n五翼凝聚度（-1 为未启）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_ghh_coh').GetValue|0]  |  五翼阶段（-1 为未启）：[ROOT.GetCountry.MakeScope.GetVariable('oe_pglh_rd_ghh_phase').GetValue|0]"
