 oe_trs.1.t: "拜齐耶的水"
 oe_trs.1.d: "四世纪，瓦伦斯皇帝的水道把色雷斯山间的泉水引进了君士坦丁堡；五世纪，水渠又延伸到拜齐耶的群山。安德罗尼卡一世之后，再没有皇帝认真修过它，如今城里多半靠蓄水池过日子。[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]离京城最近，[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]表示愿意出人修渠。"
 oe_trs.1.a: "国库出钱修复"
 oe_trs.1.a.tt: "君士坦丁堡获得“拜齐耶之水”20年（每月繁荣 +0.5%，人口增长 +0.5%，疾病抵抗 +10%）"
 oe_trs.1.b: "由[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]出工"
 oe_trs.1.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +15（5年，取代此前的近事加成）\n君士坦丁堡获得“拜齐耶之水”20年（每月繁荣 +0.5%，人口增长 +0.5%，疾病抵抗 +10%）"
 oe_trs.1.c: "蓄水池够用了"
 oe_trs.2.t: "加里波利的渡口"
 oe_trs.2.d: "1305年，加泰罗尼亚佣兵团以加里波利为据点，在色雷斯烧杀抢掠了两年，直到把这一带吃空才离开。如今又有一支西方佣兵来到[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]，要求驻扎加里波利，替帝国看守海峡，条件是渡口的税归他们。"
 oe_trs.2.a: "雇他们守海峡"
 oe_trs.2.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −10，并计入忠诚目标5年"
 oe_trs.2.b: "由[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]自己守"
 oe_trs.2.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区的沿海各地获得“海峡守备”10年（防御 +15%）"
 oe_trs.2.c: "给钱打发他们走"
 oe_trs.3.t: "佩特里佐斯修道院"
 oe_trs.3.d: "1083年，格鲁吉亚出身的帝国将军格里高利·帕库里亚诺斯在菲利波波利斯以南的山谷里建了这座修道院。他立下院规，修士必须懂格鲁吉亚语，希腊人不得入院。如今格鲁吉亚修士早已凋零，本地的希腊修士和保加利亚修士都想接管修道院和它的田产。"
 oe_trs.3.a: "交给希腊修士"
 oe_trs.3.a.tt: "帝国权威 +2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“被冷落的保加利亚修士”5年（动荡 +20%）"
 oe_trs.3.b: "交给保加利亚修士"
 oe_trs.3.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n帝国权威 −2"
 oe_trs.3.c: "重请格鲁吉亚修士，恢复创建者的院规"
 oe_trs.4.t: "安基阿洛斯的盐田"
 oe_trs.4.d: "整个中世纪，海盐都是安基阿洛斯的生计，这里的盐田也是君士坦丁堡的主要盐源之一。去冬的风暴冲垮了盐田的海堤，盐户们请求修堤，热那亚商人则开价包下全年的盐。"
 oe_trs.4.a: "修筑海堤"
 oe_trs.4.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区的沿海各地获得“安基阿洛斯海堤”20年（盐产量 +25%，每月繁荣 +0.25%）"
 oe_trs.4.b: "卖给热那亚人"
 oe_trs.4.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −10，并计入忠诚目标5年"
 oe_trs.4.c: "盐利留给[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]"
 oe_trs.4.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 +80\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）"
 oe_trs.5.t: "特尔诺沃的牧首"
 oe_trs.5.d: "1235年，兰普萨库斯的宗教会议承认特尔诺沃的保加利亚牧首为独立的牧首。如今特尔诺沃归入了[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]的辖区，君士坦丁堡的牧首要求它回到自己的管辖之下，保加利亚的主教和贵族则请求皇帝保留他们自己的牧首。"
 oe_trs.5.a: "保留特尔诺沃牧首"
 oe_trs.5.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +15，并计入忠诚目标5年\n帝国权威 −3"
 oe_trs.5.b: "并入君士坦丁堡牧首区"
 oe_trs.5.b.tt: "帝国权威 +3\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −10，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“特尔诺沃之怨”5年（动荡 +20%）"
 oe_trs.5.c: "降为自治大主教区"
 oe_trs.5.c.tt: "帝国权威 −1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年"
 oe_trs.6.t: "里拉的隐修士"
 oe_trs.6.d: "十世纪，隐修士里拉的约翰在塞尔迪卡南面的山里隐居，门徒们在他身边建起了修道院。1335年，地方领主赫雷利亚在院里修好了一座石塔。如今朝圣者沿着山路络绎不绝，强盗也跟着来了，修士们请求[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]派兵护路。"
 oe_trs.6.a: "派兵护路"
 oe_trs.6.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −50\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“里拉朝圣路”10年（每月繁荣 +0.25%，移民吸引力 +0.1）"
 oe_trs.6.b: "许修道院自募护卫"
 oe_trs.6.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n帝国权威 −1"
 oe_trs.6.c: "征收朝圣税"
 oe_trs.7.t: "新布尔多的银矿"
 oe_trs.7.d: "新布尔多的银矿是塞尔维亚国王米卢廷开出来的，1326年已经见于文书。在矿里干活的是萨克森矿工，他们照自己的矿法行事；把银子运到海边的是拉古萨商人。如今矿山归了[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]，萨克森人要求保留旧法，拉古萨人则开价承包铸币。"
 oe_trs.7.a: "确认萨克森矿法"
 oe_trs.7.a.tt: "帝国权威 −1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“萨克森矿法”20年（白银产量 +25%，每月发展度 +0.005）"
 oe_trs.7.b: "包给拉古萨人"
 oe_trs.7.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）"
 oe_trs.7.c: "收归国有"
 oe_trs.7.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −10，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“矿山收归国有”5年（动荡 +20%）"
 oe_trs.9.t: "基督城的长墙"
 oe_trs.9.d: "1302年，加泰罗尼亚人没能攻下基督城。为了不让他们再来，皇帝在城外修起一道长墙，把山和海之间的大路整个封住。长墙守住了马其顿的门户，可它要人来守，墙上的关卡也成了[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]最赚钱的地方。"
 oe_trs.9.a: "加派守军"
 oe_trs.9.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“基督城长墙”20年（防御 +15%）"
 oe_trs.9.b: "关税归国库"
 oe_trs.9.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.9.c: "关税归[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]"
 oe_trs.9.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 +100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）"
 oe_trs.10.t: "克鲁亚的山民"
 oe_trs.10.d: "1190年前后，阿尔巴尼亚人普罗贡以执政官的身份统治克鲁亚，向帝国称臣；他的儿子迪米特尔还得到过帝国的高级尊号。如今克鲁亚的山民又赶着羊群下到[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]的平原，他们的首领请求皇帝赐予头衔，愿意替帝国守山。"
 oe_trs.10.a: "赐予头衔，许其守山"
 oe_trs.10.a.tt: "帝国权威 −2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年"
 oe_trs.10.b: "安置到平原垦荒"
 oe_trs.10.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“下山的阿尔巴尼亚人”10年（每月发展度 +0.005，人口增长 +0.5%）"
 oe_trs.10.c: "赶回山里"
 oe_trs.10.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年"
 oe_trs.11.t: "阿尔塔的圣狄奥多拉"
 oe_trs.11.d: "狄奥多拉是伊庇鲁斯统治者米海尔二世的妻子，曾被丈夫赶出宫廷，在贫困中过了五年。丈夫死后，她隐居在自己创建的阿尔塔圣乔治修院，墓前的神迹让这里成了朝圣地。三月十一日她的节日快到了，阿尔塔的旧贵族想打着伊庇鲁斯专制公的旗号游行。"
 oe_trs.11.a: "准许"
 oe_trs.11.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n帝国权威 −2"
 oe_trs.11.b: "只许举帝国的旗帜"
 oe_trs.11.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年\n帝国权威 +2"
 oe_trs.11.c: "皇帝出资修缮圣墓"
 oe_trs.11.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“圣狄奥多拉墓”10年（每月繁荣 +0.25%，移民吸引力 +0.1）"
 oe_trs.12.t: "瓦拉几亚的牧民"
 oe_trs.12.d: "色萨利的瓦拉几人说一种罗曼语，夏天赶羊进山，冬天回到平原。十一世纪的凯考门诺斯说他们不服官府，到十三世纪，“瓦拉几亚”已成了色萨利的别称。今年秋天羊群下山时，平原的地主们向[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]告状，说羊群踩坏了麦田。"
 oe_trs.12.a: "划定冬牧场"
 oe_trs.12.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]民政效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“瓦拉几人的冬牧场”20年（羊毛产量 +20%，牲畜产量 +10%）"
 oe_trs.12.b: "向牧民课税"
 oe_trs.12.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“牧民之怨”5年（动荡 +20%）"
 oe_trs.12.c: "招牧民当山地兵"
 oe_trs.12.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.13.t: "底比斯的丝绸"
 oe_trs.13.d: "底比斯和科林斯曾是帝国丝绸的两大产地。1147年，西西里国王罗杰二世的舰队洗劫了这两座城，把织工连同织机一起掳去，在巴勒莫开起了自己的丝坊。如今底比斯剩下的织工请求减税，好重新开工。"
 oe_trs.13.a: "减税扶持作坊"
 oe_trs.13.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“底比斯丝坊”20年（丝绸产量 +25%，每月繁荣 +0.25%）"
 oe_trs.13.b: "收归皇家作坊"
 oe_trs.13.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −10，并计入忠诚目标5年"
 oe_trs.13.c: "照旧"
 oe_trs.13.c.tt: "没有任何变化"
 oe_trs.15.t: "岛上的私掠船"
 oe_trs.15.d: "1185年，西西里国王把凯法利尼亚和扎金索斯封给了海盗出身的海军将领布林迪西的马加里图斯，后来伊萨基岛还一度成了海盗的窝。如今岛上的船主请求[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]发给他们私掠许可，去劫掠敌国的商船。"
 oe_trs.15.a: "发给许可"
 oe_trs.15.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 +100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年"
 oe_trs.15.b: "编入帝国舰队"
 oe_trs.15.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区的沿海各地获得“岛民水手”20年（水手 +10%）"
 oe_trs.15.c: "严禁私掠"
 oe_trs.15.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]司法效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −10，并计入忠诚目标5年"
 oe_trs.16.t: "戴克里先的宫殿"
 oe_trs.16.d: "斯普利特城是在戴克里先的宫殿里长出来的。七世纪萨洛纳被毁后，难民躲进宫墙，从此再没离开，皇帝的陵墓也成了圣多姆尼乌斯大教堂。如今市民想拆掉几段旧宫墙盖房子，主教却请求皇帝出钱修大教堂的钟楼。"
 oe_trs.16.a: "许市民拆墙建房"
 oe_trs.16.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“宫墙里的新房”20年（每月发展度 +0.005，防御 −10%）"
 oe_trs.16.b: "出钱修钟楼"
 oe_trs.16.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +10（5年，取代此前的近事加成）"
 oe_trs.16.c: "宫墙一块石头也不许动"
 oe_trs.16.c.tt: "帝国权威 +1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.17.t: "普罗布斯的葡萄园"
 oe_trs.17.d: "皇帝普罗布斯生于西尔米翁。他喜欢让士兵在太平时节干活，在潘诺尼亚种葡萄、排沼泽；282年，正是在西尔米翁，不愿干活的士兵杀了他。如今[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]想让[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]的士兵在不打仗时也去打理葡萄园，老兵们已经在嘀咕了。"
 oe_trs.17.a: "照普罗布斯的办法"
 oe_trs.17.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“普罗布斯的葡萄园”20年（葡萄酒产量 +25%，每月繁荣 +0.25%）"
 oe_trs.17.b: "士兵只管操练"
 oe_trs.17.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −60\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）"
 oe_trs.17.c: "雇农夫来种"
 oe_trs.17.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“普罗布斯的葡萄园”20年（葡萄酒产量 +25%，每月繁荣 +0.25%）"
 oe_trs.18.t: "尼什的军道"
 oe_trs.18.d: "272年，君士坦丁大帝生于纳伊苏斯，也就是今天的尼什。1189年，腓特烈·巴巴罗萨的十字军沿罗马人的“军道”南下，在尼什受到塞尔维亚大公斯特凡·奈马尼亚的款待。如今道上的驿站多已荒废，商队请求修路，沿路的塞尔维亚头人却想自己收过路钱。"
 oe_trs.18.a: "重修驿站"
 oe_trs.18.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“重修军道”20年（市场准入 +10%，每月繁荣 +0.25%）"
 oe_trs.18.b: "许头人收过路钱"
 oe_trs.18.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n帝国权威 −2"
 oe_trs.18.c: "设卡征税"
 oe_trs.18.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“军道关卡”10年（市场准入 −5%）"
 oe_trs.19.t: "希俄斯的乳香"
 oe_trs.19.d: "乳香树脂是希俄斯的宝贝，帝国治下一直由皇帝专卖。1304年起，热那亚的扎卡里亚家族占了这座岛，1329年岛民把他们赶走，重新归附帝国。今年乳香丰收，热那亚商人又来了，开价包下全岛的收成。"
 oe_trs.19.a: "维持皇家专卖"
 oe_trs.19.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 +10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.19.b: "卖给热那亚人"
 oe_trs.19.b.tt: "帝国权威 −2"
 oe_trs.19.c: "许村民自由出售"
 oe_trs.19.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“乳香村”20年（每月繁荣 +0.5%，市场准入 +5%）"
 oe_trs.22.t: "马拉吉纳的马场"
 oe_trs.22.d: "桑加里奥斯河谷的马拉吉纳，是离京城最近的大军集结地，皇帝东征时，各军区的部队都在这里会合。这里还有帝国最大的几处御用马场。马场荒废多年，[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]请求重开马场，为骑兵养马。"
 oe_trs.22.a: "重开御用马场"
 oe_trs.22.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“马拉吉纳马场”20年（马匹产量 +25%，牲畜产量 +10%）"
 oe_trs.22.b: "交给[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]经营"
 oe_trs.22.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“马拉吉纳马场”20年（马匹产量 +25%，牲畜产量 +10%）"
 oe_trs.22.c: "改作农田"
 oe_trs.22.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“马场改田”10年（每月发展度 +0.005）"
 oe_trs.23.t: "新堡"
 oe_trs.23.d: "1162到1173年间，曼努埃尔一世赶走突厥游骑，重建并加固了帕加马、赫利亚拉和阿德拉米提翁，新堡军区由此得名。十四世纪初，这一带落到了卡雷西和萨鲁汉的突厥人手里。如今城堡重回帝国，[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]说，没有守军的城堡只是一堆石头。"
 oe_trs.23.a: "派驻守军"
 oe_trs.23.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“新堡守军”20年（防御 +20%）"
 oe_trs.23.b: "像曼努埃尔那样迁民屯垦"
 oe_trs.23.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“新堡屯民”20年（每月发展度 +0.005，人口增长 +0.5%）"
 oe_trs.23.c: "让[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]自行设防"
 oe_trs.23.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +10（5年，取代此前的近事加成）"
 oe_trs.24.t: "孤城费拉德尔菲亚"
 oe_trs.24.d: "十四世纪初，费拉德尔菲亚四面都是突厥的埃米尔国，城里的人只能自己守城。都主教狄奥列普托斯在任时（1283年至1322年），曾领着市民击退围城的突厥人。如今城中的长老请求皇帝承认他们自行守城的旧例，并减免他们的赋税。"
 oe_trs.24.a: "承认旧例，减免赋税"
 oe_trs.24.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +15，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“市民守城”20年（防御 +15%，动荡 −10%）"
 oe_trs.24.b: "派帝国守军"
 oe_trs.24.b.tt: "帝国权威 +2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.24.c: "嘉奖市民"
 oe_trs.24.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年"
 oe_trs.25.t: "摩索拉斯陵墓的残石"
 oe_trs.25.d: "哈利卡纳苏斯的摩索拉斯王陵曾是世界七大奇迹之一。从十二世纪起，一次次地震把它震塌，如今只剩满地的大理石。[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]修城墙的工头看上了这些现成的石料，城里的教士却说，古人的遗迹不该拿去砌墙。"
 oe_trs.25.a: "取石修城"
 oe_trs.25.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“陵墓石料”20年（防御 +15%）"
 oe_trs.25.b: "保护遗迹"
 oe_trs.25.c: "烧大理石卖石灰"
 oe_trs.25.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 +100"
 oe_trs.26.t: "米拉的圣尼古拉"
 oe_trs.26.d: "圣尼古拉是米拉的主教，他的墓就在米拉的教堂里。1087年，巴里的商人趁突厥人入侵的混乱撬开石棺，把圣骨运去了意大利。如今来米拉朝圣的人仍然不少，修士们请求出钱修缮教堂，巴里来的朝圣者则开价想买走剩下的圣物。"
 oe_trs.26.a: "修缮教堂"
 oe_trs.26.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“米拉朝圣者”20年（每月繁荣 +0.25%，移民吸引力 +0.1）"
 oe_trs.26.b: "卖给巴里人"
 oe_trs.26.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.26.c: "由[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]照管"
 oe_trs.26.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −60\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]民政效率 +10（5年，取代此前的近事加成）"
 oe_trs.27.t: "卡斯塔蒙的老宅"
 oe_trs.27.d: "科穆宁家族最早的知名人物曼努埃尔·埃罗蒂科斯在帕夫拉戈尼亚的卡斯塔蒙置下大片田产，十一世纪时这里是整个家族的根基，这个家族后来出了好几位皇帝。如今卡斯塔蒙重归帝国，当地人指着山上的废堡说，这是皇帝们的老家。"
 oe_trs.27.a: "重修城堡，立为皇室产业"
 oe_trs.27.b: "赐给[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]"
 oe_trs.27.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +15，并计入忠诚目标5年\n帝国权威 −3"
 oe_trs.27.c: "把田分给农民"
 oe_trs.27.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]民政效率 +10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“分给农民的田”20年（每月发展度 +0.005）"
 oe_trs.29.t: "茨夫里策山口"
 oe_trs.29.d: "1176年9月17日，曼努埃尔一世的大军在米里奥克法隆附近的茨夫里策山口中了苏丹基利杰·阿尔斯兰二世的埋伏，皇帝事后自比曼齐刻尔特的罗曼努斯。如今[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]的斥候报告，突厥游牧部落又赶着牲畜进了这些山口。"
 oe_trs.29.a: "筑垒封锁山口"
 oe_trs.29.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“山口堡垒”20年（防御 +20%）"
 oe_trs.29.b: "雇游牧民当斥候"
 oe_trs.29.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.29.c: "出兵驱逐"
 oe_trs.29.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年"
 oe_trs.30.t: "安基拉的兄弟会"
 oe_trs.30.d: "安基拉的手艺人和商人结成了“阿希”兄弟会。1290年前后，趁着塞尔柱人的势力衰落，兄弟会在蒙古人名义上的宗主权下让安卡拉半独立，好比意大利的商人共和国。如今城市归了[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]，兄弟会的长老请求保留他们的会所和行规。"
 oe_trs.30.a: "承认兄弟会"
 oe_trs.30.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n帝国权威 −2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“阿希会所”20年（市场准入 +5%，每月繁荣 +0.25%）"
 oe_trs.30.b: "行会纳入帝国法度"
 oe_trs.30.b.tt: "帝国权威 +1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]司法效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“行会之怨”5年（动荡 +20%）"
 oe_trs.30.c: "向会所征税"
 oe_trs.30.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.31.t: "梅夫拉纳与圣卡里同"
 oe_trs.31.d: "鲁米1273年死于科尼亚，追随他的梅夫拉维教团一直守着他的陵墓。城外的锡莱村住着希腊人，传说圣卡里同修道院的圣徒救过鲁米的儿子，鲁米也嘱咐突厥人不要伤害村里的希腊人。如今教团的长老和修道院的院长一同来见[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]，请求保护他们的产业。"
 oe_trs.31.a: "一并保护"
 oe_trs.31.a.tt: "帝国权威 −2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“锡莱之约”20年（动荡 −10%）"
 oe_trs.31.b: "只保护修道院"
 oe_trs.31.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“苦修士之怨”10年（动荡 +20%）"
 oe_trs.31.c: "两家都要纳税"
 oe_trs.32.t: "巴西尔的济贫院"
 oe_trs.32.d: "四世纪，凯撒里亚主教大巴西尔在城外建起一片济贫院、客舍和医院，人称“巴西利亚德”，纳齐安的格里高利把它比作世界奇迹。368年大旱之后闹饥荒，巴西尔亲手给穷人施粥。如今凯撒里亚又遭了荒年，城里的教士请求重建这座济贫院。"
 oe_trs.32.a: "皇帝出资重建"
 oe_trs.32.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“巴西尔济贫院”20年（疾病抵抗 +10%，人口增长 +0.5%）"
 oe_trs.32.b: "令[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]开仓放粮"
 oe_trs.32.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]民政效率 +15（5年，取代此前的近事加成）"
 oe_trs.32.c: "让教会自行募捐"
 oe_trs.32.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.33.t: "欧凯塔的集市"
 oe_trs.33.d: "欧凯塔是殉道者圣狄奥多尔的圣地。十一世纪中叶，每逢圣徒节，这里都办起热闹的集市，四方的商人和朝圣者一同赶来。曼齐刻尔特之后，这座城落在了突厥游牧民入侵的前沿，大概不久就荒废了。如今[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]的商人请求恢复集市，并在集市期间免收关税。"
 oe_trs.33.a: "恢复集市，免收关税"
 oe_trs.33.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“欧凯塔集市”20年（市场准入 +10%，每月繁荣 +0.25%）"
 oe_trs.33.b: "恢复集市，照常收税"
 oe_trs.33.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“欧凯塔集市”10年（市场准入 +10%，每月繁荣 +0.25%）"
 oe_trs.33.c: "不必了"
 oe_trs.33.c.tt: "没有任何变化"
 oe_trs.34.t: "塞巴斯提亚的四十圣徒"
 oe_trs.34.d: "320年前后，四十名信基督的罗马士兵被剥去衣服，扔在塞巴斯提亚城外结冰的湖上过夜。一人逃进热水澡堂，当场死去；看守的士兵看见湖上有光，脱衣加入，人数仍是四十。如今湖边的小教堂已经破败，[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]请求重修，立为[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]士兵的守护圣地。"
 oe_trs.34.a: "皇帝出资重修"
 oe_trs.34.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年"
 oe_trs.34.b: "由[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]出资"
 oe_trs.34.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军务效率 +15（5年，取代此前的近事加成）"
 oe_trs.34.c: "留待日后"
 oe_trs.34.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.35.t: "圣特克拉的岩洞"
 oe_trs.35.d: "塞琉基亚城外的山上，有圣特克拉晚年隐居的岩洞，384年，西方的朝圣者埃格里娅就来过这里。山下的卡吕卡德诺斯河水流湍急，1190年德意志皇帝巴巴罗萨就淹死在这条河里。朝圣者请求在河上修一座新桥。"
 oe_trs.35.a: "修桥"
 oe_trs.35.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“圣特克拉桥”20年（市场准入 +5%，移民吸引力 +0.1）"
 oe_trs.35.b: "设渡船收费"
 oe_trs.35.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 +60\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年"
 oe_trs.35.c: "照旧"
 oe_trs.35.c.tt: "没有任何变化"
 oe_trs.36.t: "阿亚斯港"
 oe_trs.36.d: "十三世纪，阿亚斯是奇里乞亚亚美尼亚王国的大港。阿卡陷落、塔尔苏斯港淤塞之后，东西方的商路一度都汇到这里，1271年马可·波罗就是在这里上岸，踏上去中国的路。如今港口归了[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]，亚美尼亚商人请求保留旧王国给意大利人的特权，好把商船留住。"
 oe_trs.36.a: "保留特权"
 oe_trs.36.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +5，并计入忠诚目标5年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区的沿海各地获得“阿亚斯商路”20年（市场准入 +10%，每月繁荣 +0.25%）"
 oe_trs.36.b: "收回特权"
 oe_trs.36.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.36.c: "先修港防"
 oe_trs.36.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]营建效率 +15（5年，取代此前的近事加成）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区的沿海各地获得“阿亚斯港防”20年（防御 +15%）"
 oe_trs.37.t: "梅利特内的叙利亚人"
 oe_trs.37.d: "934年，约翰·库尔库阿斯为帝国收复了梅利特内。十世纪，尼基弗鲁斯二世劝叙利亚正教会的牧首把驻地迁到梅利特内一带，后来这里的修道院出了米海尔大牧首这样的学者。如今叙利亚教会的主教们请求皇帝像当年的尼基弗鲁斯那样，让他们保有自己的信仰。"
 oe_trs.37.a: "保证宗教宽容"
 oe_trs.37.a.tt: "帝国权威 −2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“叙利亚商人”20年（每月繁荣 +0.25%，市场准入 +5%）"
 oe_trs.37.b: "要求他们归顺牧首"
 oe_trs.37.b.tt: "帝国权威 +2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“叙利亚教会之怨”10年（动荡 +20%）"
 oe_trs.37.c: "收一笔宽容金"
 oe_trs.37.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 −5，并计入忠诚目标5年"
 oe_trs.38.t: "司令部的葡萄酒"
 oe_trs.38.d: "利马索尔附近的科洛西先是圣殿骑士团、后来是医院骑士团的大司令部，骑士们把这里的甜葡萄酒卖到欧洲各国宫廷，酒也就以“司令部”为名。传说狮心王理查在利马索尔成婚时喝过它，称它为“王者之酒”。如今骑士们请求帝国保留他们的庄园和出口特权。"
 oe_trs.38.a: "保留骑士庄园"
 oe_trs.38.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]财政效率 −10（5年，取代此前的近事加成）"
 oe_trs.38.b: "收归帝国"
 oe_trs.38.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]辖区各地获得“司令部酒庄”20年（葡萄酒产量 +25%）"
 oe_trs.38.c: "交给[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]管理"
 oe_trs.38.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]军区金库 +100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]忠诚 +10，并计入忠诚目标5年\n帝国权威 −2"
