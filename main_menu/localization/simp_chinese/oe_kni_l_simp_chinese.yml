# NEW 2026-11-23 v22.0 Hospitaller Maritime Bastion & North-South Crusader Pact — Hospitaller Buildings, Decisions, Events, Modifiers & Mission Tree #57 (simp_chinese) (oe_kni_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v220_hospitaller_pact.py; edit the generator, not this file.
 oe_kni_rhodes_sea_citadel:0 "罗得岛巨像海港要塞"
 oe_kni_rhodes_sea_citadel_desc:0 "扼守罗得岛古港入口的巨像海堤炮塔、拦港铁链与拱顶骑士棱堡群，将医院骑士团海岛本营铸就为固若金汤的海防铁壁与舰队补给枢纽。"
 oe_kni_rhodes_sea_citadel_maintenance:0 "罗得岛巨像海港要塞维护"
 oe_kni_hospitaller_arsenal:0 "八语骑士大船坞军械库"
 oe_kni_hospitaller_arsenal_desc:0 "由圣约翰骑士团欧洲八大语区共同出资兴建的战舰船坞与索具工场，源源不断为爱琴海与东地中海输送疾风划桨战船、精锐水手与白十字巡海舰队。"
 oe_kni_hospitaller_arsenal_maintenance:0 "八语骑士大船坞军械库维护"
 oe_kni_dec_fortify_rhodes.title:0 "扩建罗得岛巨像海港要塞与骑士大船坞"
 oe_kni_dec_fortify_rhodes.desc:0 "召集欧洲八大语区顶尖要塞工程师，在罗得岛（或本国海港首都）筑造巨像海港要塞，加固临海棱堡、拦港铁链与骑士战船船坞，使本营固若金汤。"
 oe_kni_dec_fortify_rhodes.a:0 "兴筑罗得岛巨像海港要塞"
 oe_kni_dec_aegean_crusade_fleet.title:0 "整编常备爱琴海战舰巡海分队"
 oe_kni_dec_aegean_crusade_fleet.desc:0 "招募精熟爱琴海水性的拉丁与希腊水手，在骑士团船坞整备新锐划桨战船，展开为期十年的常备海上圣战巡弋。"
 oe_kni_dec_aegean_crusade_fleet.a:0 "出动爱琴海常备战舰分队"
 oe_kni_dec_eight_tongues_tithe.title:0 "征集欧洲八大语区修道院贡税"
 oe_kni_dec_eight_tongues_tithe.desc:0 "遣总司库赴西欧与中欧八大语区天主教大修道院征收法定贡税并征调骑士援兵，收成随威望与教廷睦谊稳步提升并有合理封顶。"
 oe_kni_dec_eight_tongues_tithe.a:0 "收缴欧洲八语区修道院贡税"
 oe_kni_dec_cyprus_union.title:0 "缔结医院骑士团—吕西尼昂塞浦路斯联合"
 oe_kni_dec_cyprus_union.desc:0 "将罗得岛海上铁军与尼科西亚、法马古斯塔联为一体：护持危难中的吕西尼昂塞浦路斯归附保护，或整固双岛联合统治。"
 oe_kni_dec_cyprus_union.a:0 "用印缔结罗得—塞浦路斯联合"
 oe_kni_dec_proclaim_outremer.title:0 "宣示光复耶路撒冷与海外拉丁王国"
 oe_kni_dec_proclaim_outremer.desc:0 "白十字旗帜重临耶路撒冷或安条克之际，召开八语区全体大会宣示光复海外圣地，并抉择是以主权骑士团直辖圣城还是复辟耶路撒冷王国。"
 oe_kni_dec_proclaim_outremer.a:0 "昭告天下光复海外圣地"
 oe_kni_dec_black_white_cross_pact.title:0 "缔结《黑十字与白十字圣约》"
 oe_kni_dec_black_white_cross_pact.desc:0 "在地中海医院骑士团与波罗的海—黑海条顿骑士团之间缔结纵贯欧亚的南北骑士同盟，开启波罗的海—地中海互惠商路、互派骑士戍卫及东地中海联合干涉。"
 oe_kni_dec_black_white_cross_pact.a:0 "用印缔结南北双十字永恒圣约"
 oe_kni_cd_aegean_fleet_tt:0 "未处于常备爱琴海战舰巡海分队的 10 年冷却期内。"
 oe_kni_cd_eight_tongues_tithe_tt:0 "未处于八大语区修道院贡税征集的 10 年冷却期内。"
 oe_kni_can_seal_pact_tt:0 "我方作为天主教医院骑士团政权控制罗得岛、耶路撒冷或安条克，且天主教条顿骑士团存续并与我方和平共处——其已建立黑海克里米亚据点（卡法/索尔哈特/奇尔克耶尔），或双方于文艺复兴时代及之后同为强盛的天主教军事骑士团。"
 oe_kni_cyprus_union_ready_tt:0 "我方控制尼科西亚或法马古斯塔，或天主教塞浦路斯与我方结盟、臣服、国势薄弱或正陷战火且未与我方交战。"
 oe_kni_dec_fortify_rhodes_tt:0 "在罗得岛（或我方海港首都）立即落成罗得岛巨像海港要塞（若尚未兴建），提升海港发展度与繁荣度，并获得 25 年海防与造船增益。"
 oe_kni_dec_aegean_crusade_fleet_tt:0 "征募相当于一年产出的水手、提升海军传统，并获得 10 年爱琴海战船战力、造价减免、海战士气与海上控制力增益。"
 oe_kni_dec_eight_tongues_tithe_tt:0 "自欧洲天主教修道院征收封顶贡税（基础 120 金，随威望与教廷好感最高增至 380 金），并获得兵源、水手与 10 年修道院贡税增益。"
 oe_kni_dec_cyprus_union_tt:0 "令独立且国势薄弱的 AI 塞浦路斯归附为医院骑士团附庸（或巩固既有联统/同盟），对已控塞浦路斯要港授予核心，并获得 25 年双岛联合增益。"
 oe_kni_dec_proclaim_outremer_tt:0 "对已控黎凡特圣地诸城授予核心，获得 50 年光复海外拉丁王国主权增益，并召开耶路撒冷宪章大会抉择国体。"
 oe_kni_dec_black_white_cross_pact_tt:0 "与条顿骑士团正式缔结南北《黑十字与白十字圣约》，双方共享波罗的海—地中海互惠贸易、骑士戍卫支援与外交同盟（条件满足时），并遣使赴马林堡换约。"
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_rhodes_fortress:0 "罗得岛巨像海港防务工程"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_rhodes_fortress:0 "加固的临海石墙、拦港铁链与骑士团战舰船坞令十二群岛防务与造船效率安如磐石。"
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_aegean_fleet:0 "常备爱琴海战舰巡海分队"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_aegean_fleet:0 "常备白十字划桨战舰日夜巡弋爱琴海诸水道，压低战船造价并大幅提升海战士气与海上控制力。"
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_eight_tongues_tithe:0 "欧洲八语区大修道院贡税"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_eight_tongues_tithe:0 "普罗旺斯、奥弗涅、法兰西、意大利、阿拉贡、卡斯蒂利亚、英格兰与德意志八大语区修道院如期解缴贡税，滋养骑士团财赋与兵源。"
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_cyprus_union:0 "医院骑士团—吕西尼昂塞浦路斯联合"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_cyprus_union:0 "罗得岛、尼科西亚与法马古斯塔联防一体，将拉丁塞浦路斯与圣约翰骑士团锻造成东地中海不可动摇的海上盾牌。"
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_outremer_crown:0 "光复海外拉丁王国主权冠冕"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_outremer_crown:0 "白十字圣旗重耀耶路撒冷与安条克海岸，骑士纪律、宗教虔诚与圣地教化之力蔚然复兴。"
 STATIC_MODIFIER_NAME_oe_kni_mod_pact_kni:0 "黑十字与白十字圣约（南翼白十字宪章）"
 STATIC_MODIFIER_DESC_oe_kni_mod_pact_kni:0 "罗得岛与马林堡—黑海黑十字缔结的南北骑士圣约：波罗的海琥珀、船材与援军南下护持白十字海防，地中海商利北输同盟。"
 STATIC_MODIFIER_NAME_oe_kni_mod_pact_teu:0 "黑十字与白十字圣约（北翼黑十字宪章）"
 STATIC_MODIFIER_DESC_oe_kni_mod_pact_teu:0 "条顿与医院两大骑士团跨洲缔约，将地中海与黎凡特航路向波罗的海—黑海商队敞开，并互派骑士戍卫双方要塞。"
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_aegean_galleys:0 "爱琴海白十字战船制式"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_aegean_galleys:0 "制式化医院骑士团划桨战船、精良撞角与岛链侦察舰队牢牢掌控爱琴海各咽喉水道。"
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_aegean_mastery:0 "爱琴海群岛海上霸权"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_aegean_mastery:0 "自罗得岛、科斯至希俄斯与克里特，白十字战舰对爱琴海群岛航道与商港确立无可争议的制海权。"
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_hospital_order:0 "圣约翰医院与海上骑士团新制"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_hospital_order:0 "整洁医馆、海港检疫所与严明修会章程护佑岛民抵御瘟疫，同时涵养骑士团深厚虔诚。"
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_latin_shield:0 "东地中海拉丁铁盾"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_latin_shield:0 "罗得岛与塞浦路斯构成的岛链要塞体系，为东地中海基督教世界筑起坚不可摧的海上铁盾。"
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_outremer_reborn:0 "圣地海外拉丁荣光重现"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_outremer_reborn:0 "收复耶路撒冷与阿卡兑现了两百年骑士誓言，令白十字军团在圣战沙场所向披靡。"
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_crusader_axis:0 "黑十字与白十字永恒圣约轴心"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_crusader_axis:0 "南北两大骑士团贯通波罗的海、黑海、爱琴海与黎凡特，铸就纵贯欧亚的永恒十字圣约霸业。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev1_a:0 "维尔纳夫八语区法典与罗得海防"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev1_a:0 "大团长埃利翁·德·维尔纳夫将罗得岛城垣、城门与库藏按欧洲八大语区严密分工，筑牢骑士团立身之基。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev1_b:0 "圣约翰爱琴海巡弋海规"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev1_b:0 "自罗得港日夜出航的白十字巡海舰队压制安纳托利亚海盗，磨砺骑士团精湛航海术。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev2_a:0 "教宗士麦那十字军海上同盟"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev2_a:0 "骑士团率领教宗、威尼斯与塞浦路斯联合舰队突袭士麦那海盗巢穴，大振白十字圣战声威。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev2_b:0 "十二群岛捕获法庭与海峡税巡"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev2_b:0 "在卡里亚海峡常设海上巡检与捕获法庭，将缴获船货与航路税费化为骑士团稳固财源。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev3_a:0 "圣尼古拉塔血战铁壁"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev3_a:0 "花岗岩海防塔、反坑道与宁死不退的白十字骑士在罗得港口粉碎铺天盖地的围城大军。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev3_b:0 "大团长火船破围舰队"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev3_b:0 "烈焰火船与疾风援军战舰撕裂敌军封锁线，确保罗得岛海上生命线寸步不绝。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev4_a:0 "吕西尼昂—医院骑士团联防密约"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev4_a:0 "双方共戍法马古斯塔与尼科西亚，将塞浦路斯王廷与医院骑士团外交及海防紧紧系于一体。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev4_b:0 "塞浦路斯大指挥区糖业与港税"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev4_b:0 "科洛西大指挥区甘蔗庄园与塞浦路斯商港税源滚滚汇入骑士团府库。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev5_a:0 "欧洲八语区见习骑士圣役团"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev5_a:0 "来自拉丁欧洲各地的贵族见习骑士云集罗得岛服役巡海，极大充实骑士团常备精锐与纪律。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev5_b:0 "欧洲大修道院捐献国库"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev5_b:0 "整顿法兰西、意大利、伊比利亚与德意志诸大修道院账册，将丰沛白银与军需源源输往东地中海。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev6_a:0 "圣约翰大医院与海港检疫所"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev6_a:0 "银器病坊、草药局与严密海港检疫制度护佑罗得岛与领民安然度过黑死病等大疫劫难。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev6_b:0 "白十字舰队随军医官团"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev6_b:0 "每艘战船与要塞均配属专业医官修士，既降疫病折损又大幅提升将士士气与舰队整修效率。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev7_a:0 "安条克公国收复先锋军"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev7_a:0 "白十字攻城队与两栖登陆精锐直扑奥龙特斯河口，重铸北叙利亚十字军门户。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev7_b:0 "圣西蒙港黎凡特丝绸香料税关"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev7_b:0 "重启奥龙特斯河口拉丁海港税关，将阿勒颇丝绸与香料商队重新接驳至白十字海运航线。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev8_a:0 "耶路撒冷主权军事骑士团"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev8_a:0 "大团长婉拒世俗王冠，以主权宗教军事骑士团直接拱卫圣城耶路撒冷，令铁纪与虔诚臻于极境。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev8_b:0 "光复耶路撒冷十字军王国"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev8_b:0 "在圣城加冕复兴耶路撒冷海外王国，白十字勋爵拱卫王座，号召全欧朝圣者与诸国使节来朝。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev9_b:0 "波罗的海—爱琴海朝圣商船协约"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev9_b:0 "罗得港与条顿波罗的海—黑海诸港互予停泊免税特权，贯通欧亚南北基督教远洋商路。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev10_b:0 "马林堡—罗得岛琥珀香料联运船队"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev10_b:0 "受条顿骑士护航的北方船队以波罗的海琥珀、蜂蜡与橡木直抵白十字海港换取东方香料。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev11_a:0 "双十字圣约黎凡特联合圣战"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev11_a:0 "黑十字与白十字南北夹击，协同威慑并打击安纳托利亚与黎凡特强敌要塞。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev11_b:0 "双十字圣约驰援君士坦丁堡"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev11_b:0 "两大骑士团联袂出兵海路驰援博斯普鲁斯海峡与新罗马，赢得整个东方基督教世界敬重。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev11_c:0 "波罗的海—黑海—爱琴海护航通道"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev11_c:0 "常备同盟护航舰队全天候保卫黑海海峡与爱琴海航道，令南北物资与军需川流不息。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev12_a:0 "白十字地中海巡海霸权"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev12_a:0 "自亚历山大港至达达尼尔海峡，白十字战舰令敌舰闻风丧胆，牢牢称霸东地中海。"
 STATIC_MODIFIER_NAME_oe_kni_mod_ev12_b:0 "圣约翰地中海海上和平商盟"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev12_b:0 "白十字护航特许、海岛灯塔与清海巡弋将爱琴海与黎凡特化作繁荣兴盛的海上贸易通衢。"
 oe_kni.1.title:0 "罗得圣堡：维尔纳夫八语区改制"
 oe_kni.1.desc:0 "大团长埃利翁·德·维尔纳夫立于俯瞰罗得双港的石灰岩箭塔之上，召集骑士团全体大会，将海岛城垣、城门守备与战船定额按欧洲八大语区严密划分。眼见窄海对岸安纳托利亚海盗风帆频现，骑士团必须抉择：是以铁壁石堡固守海港，还是以常备巡海战船先发制人。"
 oe_kni.1.a:0 "划定八语区城防防段，加固罗得巨像海港石垣"
 oe_kni.1.b:0 "扩编爱琴海白十字巡弋舰队与海事修道院"
 oe_kni.2.title:0 "1344年士麦那海上十字军"
 oe_kni.2.desc:0 "阿维尼翁教宗颁布海上十字军同盟诏书，号召医院骑士团、威尼斯与塞浦路斯联军讨伐盘踞士麦那湾、频频劫掠爱琴海的艾登与门泰谢海盗贝伊国。罗得港码头上白十字战舰帆索齐张，静候大团长号令：直捣士麦那敌巢，抑或严封十二群岛水道截税夺船。"
 oe_kni.2.a:0 "率教宗联合舰队突袭士麦那海港要塞"
 oe_kni.2.b:0 "严封十二群岛海峡并设立骑士团捕获法庭"
 oe_kni.3.title:0 "罗得岛大围城血战告捷"
 oe_kni.3.desc:0 "重炮轰鸣震彻碧海，敌军庞大的渡海舰队团团围困罗得石堤，猛轰圣尼古拉塔与意大利、英格兰语区棱堡。在硝烟弥漫的白十字战旗下，骑士、希腊岛民与港口水手同仇敌忾，誓将强敌逐回大海。"
 oe_kni.3.a:0 "死守圣尼古拉海塔与残垣，以血肉铸就铁壁"
 oe_kni.3.b:0 "遣烈焰火船与援军战舰夜袭破围，打通海路"
 oe_kni.4.title:0 "吕西尼昂危局与塞浦路斯联防"
 oe_kni.4.desc:0 "面对热那亚债主、马穆鲁克海盗与尼科西亚宫廷内讧的重重夹击，拉丁塞浦路斯王国向一水之隔的医院骑士团伸出援手。骑士团在科洛西的大指挥区早已坐拥全岛最丰饶的蔗糖庄园，此刻正是将塞浦路斯王廷与法马古斯塔良港牢牢系于白十字同盟的千载良机。"
 oe_kni.4.a:0 "担保吕西尼昂王统并派驻白十字军守卫法马古斯塔"
 oe_kni.4.b:0 "扩建科洛西大指挥区糖坊并统理塞浦路斯港税"
 oe_kni.5.title:0 "欧洲八大语区修道院来援"
 oe_kni.5.desc:0 "遍布普罗旺斯、奥弗涅、法兰西、意大利、阿拉贡、卡斯蒂利亚、英格兰与德意志的数百座圣约翰修道院源源不绝地征收庄园地租、蓄养战马，并选拔年轻贵族子弟赴地中海服行法定海上圣役。诸大修道院总管遣使请示：罗得本营此刻更急需精锐见习骑士，还是白银贡税？"
 oe_kni.5.a:0 "征召欧洲八语区披甲见习骑士赴罗得岛服役"
 oe_kni.5.b:0 "将八语区大修道院白银贡税解缴罗得国库"
 oe_kni.6.title:0 "圣约翰大医院与海港防瘟"
 oe_kni.6.desc:0 "正当黑死病与诸般瘟疫顺着地中海商船肆虐诸港之际，医院骑士团恪守救治病弱的创团初衷。在罗得岛高大石拱的圣约翰大医院内，不分贵贱的病患皆以银盘进食；医官修士们向大团长进言：应扩建海港防瘟检疫所护佑全岛民生，还是编练随舰外科医官团保障海陆大军？"
 oe_kni.6.a:0 "扩建圣约翰大医院与海港防瘟检疫所，护佑万民"
 oe_kni.6.b:0 "为每艘战舰与要塞配属骑士团随军医官团"
 oe_kni.7.title:0 "登陆安条克"
 oe_kni.7.desc:0 "越过伊斯肯德伦湾，群峰环抱的古城安条克巍然在望——昔日十字军公爵与医院骑士团堡主曾在此扼守通往圣地的北方咽喉。无论是厉兵秣马直取古城，还是整饬圣西蒙港重接黎凡特丝绸商路，骑士团诸元帅皆盛赞白十字重归叙利亚大陆的壮举。"
 oe_kni.7.a:0 "在安条克山巅圣堡高悬白十字军旗，厉兵南下"
 oe_kni.7.b:0 "重开圣西蒙港黎凡特丝绸香料税关，富国养兵"
 oe_kni.8.title:0 "光复耶路撒冷：海外拉丁圣地重光"
 oe_kni.8.desc:0 "全欧教堂钟声齐鸣，医院骑士团白十字旗帜自海外拉丁王国沦陷以来首次重入耶路撒冷圣门，拱卫圣墓大殿！在庄严的大会堂中，八语区骑士、主教与拉丁贵族面临千载抉择：令圣城永归圣约翰主权军事骑士团直辖，还是加冕复兴世俗的耶路撒冷十字军王国？"
 oe_kni.8.a:0 "坚守修会誓言：建立耶路撒冷主权军事骑士团"
 oe_kni.8.b:0 "加冕复兴耶路撒冷十字军王国，重现海外盛世"
 oe_kni.9.title:0 "黑十字来使"
 oe_kni.9.desc:0 "一艘高悬条顿黑十字旗帜的远航帆船在罗得巨像港下锚，载来马林堡大团长及北方骑士团黑海克里米亚据点的火漆国书。两大天主教军事骑士团此刻一北一南、分镇波罗的海—黑海与东地中海咽喉，黑十字特使郑重提议缔结《黑十字与白十字圣约》，贯通南北商路并互派骑士驰援。"
 oe_kni.9.a:0 "用印批准《黑十字与白十字圣约》，共筑南北十字同盟"
 oe_kni.9.b:0 "暂签波罗的海—爱琴海朝圣商船互惠协约"
 oe_kni.10.title:0 "《黑十字与白十字》条顿回约"
 oe_kni.10.desc:0 "身披绯红战袍、胸绣八角白十字的医院骑士团特使步入条顿骑士团红砖哥特大殿，呈递罗得岛用印的南翼圣约。若将北方琥珀、橡木船材与戍边铁骑，同地中海香料商船与白十字战舰紧密相连，黑十字与白十字必将铸就纵贯欧亚的基督教海上轴心。"
 oe_kni.10.a:0 "正式签署南北双十字圣约，互开商港并互派骑士戍军"
 oe_kni.10.b:0 "设立马林堡—罗得岛琥珀与香料联合护航船队"
 oe_kni.11.title:0 "黑十字与白十字东地中海联合干涉"
 oe_kni.11.desc:0 "《黑十字与白十字圣约》全面生效之际，条顿与医院两大骑士团联合军事会议齐聚罗得港海图桌前，筹谋如何运筹南北合一的跨洲海权纵横东地中海：联合挥师打击奥斯曼与马穆鲁克要冲、遣援军舰队驰援君士坦丁堡与拜占庭，抑或全力固守黑海—爱琴海同盟护航商道？"
 oe_kni.11.a:0 "南北双十字协同出击，剑指奥斯曼与马穆鲁克要冲"
 oe_kni.11.b:0 "派遣双十字联合援军舰队驰援君士坦丁堡与东罗马"
 oe_kni.11.c:0 "加固海峡防务，全天候护航波罗的海—黎凡特商队"
 oe_kni.12.title:0 "地中海巡海霸权与黎凡特商贸主宰"
 oe_kni.12.desc:0 "自罗得与法马古斯塔的金色海港至黎凡特危崖岬角，八角白十字旗帜已牢牢主宰东地中海各大航路。百战海军统帅与大商行长老齐候圣裁：是维持令敌胆寒的常备海上私掠与封锁霸权，还是确立惠及威尼斯至马林堡万千商帆的圣约翰海上和平商盟？"
 oe_kni.12.a:0 "宣示白十字常备巡海与海上封锁霸权"
 oe_kni.12.b:0 "缔造圣约翰黎凡特海上和平商盟，广纳四海商利"
 oe_msn_kni_destiny:0 "白十字海疆大业：罗得圣堡、海外光复与双十字圣约"
 oe_msn_kni_destiny_DESCRIPTION:0 "引领圣约翰医院骑士团自罗得岛海上圣堡启程，纵横爱琴海群岛、联合吕西尼昂塞浦路斯、挥师重光安条克与耶路撒冷，最终与北方条顿骑士团缔结纵贯欧亚的《黑十字与白十字圣约》。"
 oe_msn_kni_destiny_CRITERIA_DESCRIPTION:0 "作为医院骑士团（或由医院骑士团建立的耶路撒冷王国）游玩，并控制罗得岛、塞浦路斯、安条克或耶路撒冷之一。"
 oe_msn_kni_destiny_BUTTON_TOOLTIP:0 "开启医院骑士团海防霸权、海外圣地光复与南北双十字圣约专属任务树。"
 oe_msn_kni_destiny_BUTTON_DETAILS:0 "三大连贯路线共 12 项任务：罗得圣堡与爱琴海制海权、八大语区与塞浦路斯联合、重返海外圣地与黑十字×白十字圣约。"
 oe_msn_kni_01_colossus_harbour:0 "加固罗得巨像海港要塞"
 oe_msn_kni_01_colossus_harbour_desc:0 "整修罗得古港海堤、临海炮塔与骑士团棱堡，令白十字圣旗稳立爱琴海门户。"
 oe_msn_kni_01_colossus_harbour_req_tt:0 "控制罗得岛（或拥有海港首都）、稳定度至少为 5，且拥有罗得海港要塞、城堡、海防堡之一或至少 140 金币。"
 oe_msn_kni_02_aegean_war_galleys:0 "整编爱琴海白十字战舰"
 oe_msn_kni_02_aegean_war_galleys_desc:0 "扩建骑士团船坞并编练精锐划桨战船分队，令白十字舰队在爱琴海群岛水域所向无前。"
 oe_msn_kni_02_aegean_war_galleys_req_tt:0 "控制罗得岛或科斯，拥有船坞、干船坞、八语骑士大船坞或至少 15 海军传统，且拥有至少 10 艘舰船或 18 海军传统。"
 oe_msn_kni_03_break_anatolian_corsairs:0 "扫荡安纳托利亚海盗贝伊国"
 oe_msn_kni_03_break_anatolian_corsairs_desc:0 "突袭艾登与门泰谢沿海海盗巢穴，夺取士麦那、博德鲁姆等咽喉要港，或以绝对海军优势压制敌方私掠。"
 oe_msn_kni_03_break_anatolian_corsairs_req_tt:0 "直接或通过属国控制士麦那、博德鲁姆、米拉斯、马尔马里斯或安塔利亚之一，或在文艺复兴时代及之后拥有至少 25 海军传统与 10 稳定度。"
 oe_msn_kni_04_aegean_archipelago_master:0 "爱琴海群岛制海霸主"
 oe_msn_kni_04_aegean_archipelago_master_desc:0 "连结罗得、科斯与希俄斯、纳克索斯、克里特及爱奥尼亚要港，令整个爱琴海群岛尽入白十字海权掌控。"
 oe_msn_kni_04_aegean_archipelago_master_req_tt:0 "控制罗得岛、科斯、至少一处爱琴海核心岛屿（希俄斯/萨摩斯/纳克索斯/甘地亚）及一处海岸重镇（士麦那/博德鲁姆/甘地亚/优卑亚），且稳定度至少 12 并处于文艺复兴时代或之后。"
 oe_msn_kni_05_audit_eight_tongues:0 "整顿欧洲八大语区修道院"
 oe_msn_kni_05_audit_eight_tongues_desc:0 "清核欧洲八大语区修道院的章程、账目与骑士名册，使西方基督教世界的虔诚捐献源源不绝汇往东方前线。"
 oe_msn_kni_05_audit_eight_tongues_req_tt:0 "信仰天主教、稳定度至少为 5，且威望至少 15、金币至少 150 或神权体制下虔诚度至少 65。"
 oe_msn_kni_06_hospital_sea_reforms:0 "圣约翰大医院与海上修会改制"
 oe_msn_kni_06_hospital_sea_reforms_desc:0 "将骑士团济世救伤的初衷与海上圣战使命熔于一炉，革新罗得大医院、随舰医官与海港检疫体系。"
 oe_msn_kni_06_hospital_sea_reforms_req_tt:0 "稳定度至少为 8，且拥有医院、骑士团堡垒或罗得海港要塞之一，或完成圣约翰医院事件，或虔诚度至少 75。"
 oe_msn_kni_07_cyprus_union:0 "塞浦路斯王国联合防务"
 oe_msn_kni_07_cyprus_union_desc:0 "将尼科西亚与法马古斯塔紧密纳入白十字旗帜，使塞浦路斯的黎凡特前哨港与罗得岛骑士军团合二为一。"
 oe_msn_kni_07_cyprus_union_req_tt:0 "直接或通过属国同时控制尼科西亚与法马古斯塔，或已颁布塞浦路斯联合决议并与塞浦路斯结盟或将其纳为属国。"
 oe_msn_kni_08_latin_shield_eastmed:0 "东地中海拉丁铁盾"
 oe_msn_kni_08_latin_shield_eastmed_desc:0 "坐拥罗得、塞浦路斯与克里特坚城港群，巍然挺立为东地中海基督教世界坚不可摧的海上铁盾。"
 oe_msn_kni_08_latin_shield_eastmed_req_tt:0 "控制罗得岛以及尼科西亚、法马古斯塔或甘地亚之一，直辖与属国合计至少 10 个地区、稳定度至少 12，且处于地理大发现时代或之后。"
 oe_msn_kni_09_smyrna_cilicia_crusade:0 "士麦那与奇里乞亚十字军桥头堡"
 oe_msn_kni_09_smyrna_cilicia_crusade_desc:0 "在士麦那或奇里乞亚沿岸（阿达纳、塔尔苏斯、西斯、伊斯肯德伦）开辟稳固桥头堡，打通重返叙利亚圣地的海上跳板。"
 oe_msn_kni_09_smyrna_cilicia_crusade_req_tt:0 "直接或通过属国控制士麦那、阿达纳、塔尔苏斯、西斯、安塔利亚或伊斯肯德伦之一，或完成士麦那十字军事件且陆军传统至少 15。"
 oe_msn_kni_10_reclaim_antioch:0 "光复安条克公国故土"
 oe_msn_kni_10_reclaim_antioch_desc:0 "挥师重夺群山环抱的安条克名城及其叙利亚海港，令中世纪海外拉丁北翼重镇再归白十字旗帜。"
 oe_msn_kni_10_reclaim_antioch_req_tt:0 "直接或通过属国控制安条克，并控制伊斯肯德伦、拉塔基亚、托尔托萨、阿达纳或的黎波里之一。"
 oe_msn_kni_11_liberation_of_jerusalem:0 "光复耶路撒冷与阿卡圣港"
 oe_msn_kni_11_liberation_of_jerusalem_desc:0 "在圣墓教堂与阿卡海墙之上高举白十字圣旗，一雪失地之耻，成就光复海外圣地的千秋宿愿。"
 oe_msn_kni_11_liberation_of_jerusalem_req_tt:0 "直接或通过属国同时控制耶路撒冷与阿卡，且稳定度至少为 10。"
 oe_msn_kni_12_black_white_cross_pact:0 "黑十字与白十字南北圣约"
 oe_msn_kni_12_black_white_cross_pact_desc:0 "以罗得霸权与圣地光复为基，携北方条顿黑十字缔结纵贯欧亚的南北圣约——或凭二十五地圣域之力独擎东方十字军无上皇纲。"
 oe_msn_kni_12_black_white_cross_pact_req_tt:0 "处于地理大发现时代或之后、稳定度至少为 15，且已缔结《黑十字与白十字圣约》，或直接/通过属国同时控制耶路撒冷、罗得岛与至少 25 个地区。"
