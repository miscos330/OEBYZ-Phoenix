 MODIFIER_TYPE_DESC_oe_wp35_bri_gold_price_cost_modifier: "修正印度公司各类商馆租借与购地行动的金币耗费。"
 oe_wp35_bri_factory_grant: "沿海商馆特许"
 oe_wp35_bri_factory_grant_act: "向 [SCOPE.sCountry('recipient').GetName] 申请沿海商馆特许"
 oe_wp35_bri_factory_grant_desc: "以金币向印度君主求取一处沿海地点兴建设防商馆。历史上东印度公司正是在苏拉特、马苏利帕特南与胡格利借此扎根印度。"
