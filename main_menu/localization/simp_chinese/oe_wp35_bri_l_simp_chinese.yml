 oe_wp35_bri_grant_of_madras: "马德拉斯商馆特许"
 oe_wp35_bri_grant_of_madras_act: "向 [SCOPE.sCountry('recipient').GetName] 求取马德拉斯商馆特许"
 oe_wp35_bri_grant_of_madras_desc: "1639 年弗朗西斯·戴向科罗曼德尔纳亚克求得马德拉斯帕特南村旁一片海滩，圣乔治堡由此崛起。向掌控 [ShowLocationName('madras')] 的君主提出同等请求；若马德拉斯不可得，则退求泰米尔海岸另处港口。"
 oe_wp35_bri_grant_of_madras_effect_text: "[SCOPE.sCountry('actor').GetName] 向 [SCOPE.sCountry('recipient').GetName] 求取马德拉斯商馆特许"
 oe_wp35_bri_grant_of_madras_effect_text_past: "[SCOPE.sCountry('actor').GetName] 自 [SCOPE.sCountry('recipient').GetName] 获得了马德拉斯商馆特许"
