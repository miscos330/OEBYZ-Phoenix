 oe_wp35_eic_situation_crown_rule: "王冠直辖统治"
 oe_wp35_eic_situation_crown_rule_desc: "宛如 1858 年伟大宪制交接重现于世，大英王冠正式从东印度公司手中收回整个南亚次大陆的最高军政、司法与财税大权。从膏腴丰饶的孟加拉三角洲到繁华的西印度海港，王冠及英属印度名下每一处领地都将彻底纳入统一的皇家文官与帝国法典体系，从此开启大英帝国统御天竺诸邦的崭新纪元。"
 oe_wp35_eic_situation_crown_rule_tt: "已完成[ShowMissionTaskName('oe_wp35_bri_masters_of_india')]"
 oe_wp35_bri_crown_rule_mission_tt: "[ShowSituationName('oe_wp35_eic_situation')]以#Y 王冠直辖#!收官：我方及[subjects|e]当前与未来在南亚掌控的每一处[location|e]皆获#G +0.5%#!月度[control|e]与#G +5%#!最大[control|e]。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_crown_rule_location_modifier: "王冠直辖统治"
 STATIC_MODIFIER_DESC_oe_wp35_bri_crown_rule_location_modifier: "直接处于大英王冠权威之下，行政控驭更为严密。"
