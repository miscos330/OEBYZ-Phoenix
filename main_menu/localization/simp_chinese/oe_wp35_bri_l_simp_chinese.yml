 oe_wp35_eic_situation: "东印度公司在天竺"
 oe_wp35_eic_situation_desc: "$oe_wp35_eic_situation_desc_expanding$"
 oe_wp35_eic_situation_desc_expanding: "#T 商馆扩张期#!\n东印度公司已在印度站稳脚跟，可以金币游说印度君主出让更多港湾与领地。王冠与英属印度均可购置商馆、永租港与毗邻行省包税权，各买各留。\n\n英属印度的版图计入王冠任务进度，但在扩张路线上二者亦存在微妙竞逐：沿海归属哪一方，便决定了谁能直接向内陆收购省份。"
 oe_wp35_eic_situation_desc_securing: "#T 霸权巩固期#!\n孟加拉已入囊中，公司不再只是商贾。率先宣称孟加拉迪瓦尼者将独占其田赋厚利；式微土邦可借附属同盟纳为藩属，动荡行省亦能以兵威绥靖。\n\n原有租借与购地依旧开放。待彻底称霸印度后，王冠将正式接管公司并步入王冠直辖时代。"
 oe_wp35_bri_situation_starts_tt: "#T 东印度公司在天竺#!局势开启：王冠与英属印度（若已设立）可通过特许、购地及日后的附属同盟步步经略南亚。"
 oe_wp35_eic_situation_withdrawn: "公司撤离印度"
 oe_wp35_eic_situation_withdrawn_desc: "随着最后一艘悬挂英伦商旗的武装东印度帆船降下顶帆、悄然驶离烟波浩渺的印度洋海岸，大英王冠及其所有附庸已尽失南亚大陆与沿海据点。历经数代航海家、总督与商贾苦心经营的东印度公司天竺大业至此黯然落幕，唯余伦敦档案库中一卷卷泛黄的特许状与航运账簿，静静记录着那场横跨大洋的商业远征。"
 oe_wp35_eic.1.a: "天竺角逐尘埃落定，重整帝国海贸大计。"
 oe_wp35_eic_situation_withdrawn_tt: "王冠及其任何附庸在南亚均不再持有领地"
 oe_wp35_eic_situation_legend_crown: "王冠直辖领地"
 oe_wp35_eic_situation_legend_company: "英属印度领地"
 oe_wp35_eic_situation_legend_contested: "未归附印度诸邦"
 oe_wp35_eic_situation_crown_tt: "#T 王冠直辖领地#!\n由王冠或其一般附庸掌控。"
 oe_wp35_eic_situation_company_tt: "#T 英属印度领地#!\n由英属印度或其附庸掌控。其领土计入王冠任务目标，但在购置包税地权时不视为王冠直辖接壤地。"
 oe_wp35_eic_situation_contested_tt: "#T 未归附印度诸邦#!\n仍掌握在印度本地诸侯或列强竞争者手中，可通过特许、购地、附属同盟或征战夺取。"
