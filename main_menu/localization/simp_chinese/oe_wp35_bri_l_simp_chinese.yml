 OE_WP35_BRI_PANEL_RULES: "局势运作机制"
 OE_WP35_BRI_PANEL_RULES_TEXT: "• 买方自其[treasury|e]出资并保有购得领地，卖方全额收款。\n• 印度诸侯有权拒售；除非互为宿敌，AI 通常乐于成交。任何君主绝不出售[capital|e]或未实际[control|e]的土地。\n• 若英属印度存在，其疆土计入王冠任务进度，但包税地权仅能收购紧邻买方#Y 直辖#!领地的行省——占据海岸的一方可借此卡住另一方内陆通道。\n• 王冠仍可通过 $give_location_to_subject$ 将领地划归英属印度，或通过 $seize_location_from_subject$ 收回。"
