l_simp_chinese:
 # Project Phoenix v31.0 WP35: British Empire 53-Task Tree & East India Company Situation.
 oe_wp35_bri_missions: "大英帝国的崛起"
 oe_wp35_bri_missions_DESCRIPTION: "从百年战争迈向日不落帝国：驯服贵族与议会、统一不列颠诸岛、执掌大洋霸权，将旗帜插向美洲、好望角与印度。"
 oe_wp35_bri_missions_CRITERIA_DESCRIPTION: "英格兰已化身为大不列颠，统御四海，成为横跨全球的帝国核心。"
 oe_wp35_bri_missions_BUTTON_TOOLTIP: "引领英格兰渡过宗教改革与王权议会之争，统一不列颠群岛，缔造由殖民地、商路与东印度公司构成的全球帝国。"
 oe_wp35_bri_missions_BUTTON_DETAILS: "$oe_wp35_bri_missions_BUTTON_TOOLTIP$"
 oe_wp35_bri_raise_an_army: "整军备武"
 oe_wp35_bri_raise_an_army_desc: "议会历来反对王室常备军，王国传统上倚重民兵、雇佣兵与贵族征召兵。随着百年战争步入尾声且苏格兰虎视眈眈，我们势必以一切手段整编一支劲旅。"
 oe_wp35_bri_raise_an_army_CRITERIA_DESCRIPTION: "现役陆军达到预期规模的 50%，或由将领统率已动员的征召兵。"
 oe_wp35_bri_subjugate_scotland: "征服苏格兰"
 oe_wp35_bri_subjugate_scotland_desc: "“苏格兰之锤”爱德华一世早已知晓征服北方乃安邦定国之策。我们当承其遗志；若王室联姻遭拒，武力求婚亦足以为我军北上提供名义。"
 oe_wp35_bri_subjugate_scotland_CRITERIA_DESCRIPTION: "直接或经由非朝贡附庸掌控珀斯、因弗内斯以及至少 80% 的苏格兰低地。"
 oe_wp35_bri_conquer_ireland: "平定爱尔兰"
 oe_wp35_bri_conquer_ireland_desc: "史称“陛下的爱尔兰宿敌”的盖尔诸部长期游离于英格兰王法之外，如今正是令其俯首称臣之时。"
 oe_wp35_bri_conquer_ireland_CRITERIA_DESCRIPTION: "直接或经由非朝贡附庸掌控都柏林及爱尔兰至少 60 处地点。"
 oe_wp35_bri_unify_the_isles: "一统不列颠诸岛"
 oe_wp35_bri_unify_the_isles_desc: "不列颠诸岛分立着英格兰与苏格兰两座王国，以及爱尔兰林立的割据邦国。统一诸岛于英格兰王冠之下的重任非我们莫属。"
 oe_wp35_bri_unify_the_isles_CRITERIA_DESCRIPTION: "本土或附庸在大不列颠掌控至少 160 处地点、在爱尔兰掌控至少 40 处地点，并保持高稳定度与正统性。"
 oe_wp35_bri_acts_of_union: "联合法案"
 oe_wp35_bri_acts_of_union_desc: "诸岛各王国的律法体系彼此割裂、繁复冗杂。虽共戴一君，其法度与议会却未能统于单一宪制，此状岂可久存。"
 oe_wp35_bri_acts_of_union_CRITERIA_DESCRIPTION: "成为（或曾成为）大不列颠，直接拥有大不列颠地区 80% 地点，并在本土维持稳固控制力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_raise_army_modifier: "整军扩编"
 STATIC_MODIFIER_DESC_oe_wp35_bri_raise_army_modifier: "扩充征召兵员并整训军官，显著提升人力储备与士气。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_subjugate_scotland_modifier: "北征苏格兰历练"
 STATIC_MODIFIER_DESC_oe_wp35_bri_subjugate_scotland_modifier: "苏格兰战事锤炼出的后勤体制精简军费并涵养陆军传统。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_unify_isles_modifier: "诸岛一统政务"
 STATIC_MODIFIER_DESC_oe_wp35_bri_unify_isles_modifier: "不列颠诸岛统归单一王冠，国家威望与外交分量随之大增。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_acts_of_union_modifier: "联合法案"
 STATIC_MODIFIER_DESC_oe_wp35_bri_acts_of_union_modifier: "统一的大不列颠王国享有长久的繁荣、安定与国际影响力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_irish_choler_modifier: "爱尔兰垦殖秩序"
 STATIC_MODIFIER_DESC_oe_wp35_bri_irish_choler_modifier: "英格兰移民与爱尔兰劳力共同投入新征服土地的耕作与开发。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_british_rule_modifier: "不列颠王法"
 STATIC_MODIFIER_DESC_oe_wp35_bri_british_rule_modifier: "联合王国的法度通达每一郡县，地方豪强皆须听命于王冠。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_india_established_modifier: "英属印度肇建"
 STATIC_MODIFIER_DESC_oe_wp35_bri_india_established_modifier: "我们在印度设立的殖民行政体系源源不断提供庞大资源与兵源。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_direct_rule_india_modifier: "印度王冠直辖"
 STATIC_MODIFIER_DESC_oe_wp35_bri_direct_rule_india_modifier: "我们摒弃殖民中介，由伦敦王冠直接统辖印度领地。"
 oe_wp35_bri_recently_humiliated_rival_tt: "近期曾羞辱一名宿敌"
 oe_wp35_bri_channel_london_70_tt: "我们在伦敦市场掌握至少 70% 的商业力量"
 oe_wp35_bri_channel_london_50_tt: "我们在伦敦市场掌握至少 50% 的商业力量"
 oe_wp35_bri_channel_bruges_25_tt: "我们在布鲁日所属市场掌握至少 25% 的商业力量"
 oe_wp35_bri_channel_bruges_15_tt: "我们在布鲁日所属市场掌握至少 15% 的商业力量"
 oe_wp35_bri_channel_london_75_tt: "我们在伦敦市场掌握至少 75% 的商业力量"
 oe_wp35_bri_channel_london_55_tt: "我们在伦敦市场掌握至少 55% 的商业力量"
 oe_wp35_bri_channel_bruges_50_tt: "我们在布鲁日所属市场掌握至少 50% 的商业力量"
 oe_wp35_bri_channel_bruges_35_tt: "我们在布鲁日所属市场掌握至少 35% 的商业力量"
 oe_wp35_bri_lowlands_economic_hegemon_tt: "我们是经济霸主，且宗教改革时代已经开启"
 oe_wp35_bri_early_industry_manufactories_4_tt: "拥有至少 4 级手工工场（呢绒工场、纺织磨坊、铸铁厂或轧铁厂）"
 oe_wp35_bri_early_industry_manufactories_1_tt: "拥有至少 1 级手工工场（呢绒工场、纺织磨坊、铸铁厂或轧铁厂）"
 oe_wp35_bri_no_country_rivals_tt: "没有任何国家将我们列为宿敌"
 oe_wp35_bri_owns_45_low_countries_tt: "我们在低地地区直接拥有至少 45 处地点"
 subject_oe_wp35_bri_owns_45_low_countries_tt: "某个非朝贡附庸在低地地区拥有至少 45 处地点"
 ally_oe_wp35_bri_owns_45_low_countries_tt: "任意首都位于低地地区且主流文化为低地法兰克、弗里斯兰或瓦隆的盟友在低地拥有至少 45 处地点"
 oe_wp35_bri_war_of_the_roses_disaster_tt: "玫瑰战争灾难已经结束"
 oe_wp35_bri_war_of_roses_info_tt: "已渡过玫瑰战争灾难\n（1400 至 1499 年间，当约克与兰开斯特两大家族并存且由无嗣或不育的君主执政，或正统性低于 70 且稳定度低于 35 时可能爆发）"
 oe_wp35_bri_mediterranean_authority_cb_tt: "获得对巴利阿里群岛、爱琴海诸岛、东西西里、科孚岛与凯法利尼亚岛的皇家特许征服状。"
 oe_wp35_bri_letters_patent_renewal_tt: "皇家特许征服状属于永久宣称，每年及每场战事结束后皆会针对实际占领者自动续发，直至土地归入我手。"
 oe_wp35_bri_welcome_to_america_tt: "获得招募征服者或加速殖民地成长的强力增益。"
 oe_wp35_bri_three_kingdoms_wars_info_tt: "三国之战局势已经落幕。"
 oe_wp35_bri_ecw_tension_tt: "王权与议会的对立日益尖锐，英格兰内战的风险随之升高。"
 oe_wp35_bri_trade_company_charter_tt: "王冠颁授皇家特许状：在南亚领地建立贸易公司总部，正式设立受封东印度公司。"
 oe_wp35_bri_trade_company_charter_direct_tt: "因印度实行王冠直辖，故不另立公司附庸，而由王室直接统管印度商贸。"
 oe_wp35_bri_trade_company_charter_can_build_tt: "我们具备在南亚兴建贸易公司总部的条件！"
 oe_wp35_bri_india_west_cb_tt: "英属印度获得对西印度与德干地区的皇家特许征服状。"
 oe_wp35_bri_britain_india_west_cb_tt: "大不列颠获得对西印度与德干地区的皇家特许征服状。"
 oe_wp35_bri_own_location_in_west_india_tt: "我们或非朝贡附庸拥有该地点\n• 地点位于索拉什特拉、孔坎或马拉巴尔。"
 oe_wp35_bri_own_location_in_inland_india_tt: "我们或非朝贡附庸拥有该地点\n• 地点位于印度内陆地区。"
 oe_wp35_bri_india_hindustan_cb_tt: "英属印度获得对印度斯坦地区的皇家特许征服状。"
 oe_wp35_bri_britain_hindustan_cb_tt: "大不列颠获得对印度斯坦地区的皇家特许征服状。"
 oe_wp35_bri_own_location_in_bengal_tt: "我们或非朝贡附庸拥有该地点\n• 地点位于孟加拉地区。"
 oe_wp35_bri_india_bengal_cb_tt: "英属印度获得对孟加拉地区的皇家特许征服状。"
 oe_wp35_bri_britain_bengal_cb_tt: "大不列颠获得对孟加拉地区的皇家特许征服状。"
 oe_wp35_bri_own_location_in_india_tt: "我们或非朝贡附庸拥有该地点\n• 地点位于印度次大陆。"
 oe_wp35_bri_house_divided: "分裂之家"
 oe_wp35_bri_house_divided_desc: "安抚国内各阶层，使上院贵族与下院平民齐心拥戴王座。"
 oe_wp35_bri_house_divided_CRITERIA_DESCRIPTION: "维持高阶层满意度、稳固正统与稳定度，并保有若干已生效阶层特权。"
 oe_wp35_bri_monopolize_channel: "垄断英吉利海峡"
 oe_wp35_bri_monopolize_channel_desc: "英吉利海峡的滚滚商货必须经由英格兰港口与商贾之手运转，并辅以完备港务与护航舰队。"
 oe_wp35_bri_monopolize_channel_CRITERIA_DESCRIPTION: "在伦敦市场占据绝大多数商业力量，并在布鲁日所属市场拥有可观份额，同时具备充足港口与舰船。若布鲁日归属伦敦市场，则仅计伦敦市场。"
 oe_wp35_bri_early_industry: "早期工业萌芽"
 oe_wp35_bri_early_industry_desc: "将新兴工场引入德比、切斯特、纽卡斯尔与卡迪夫，引领不列颠踏上工业化征途。"
 oe_wp35_bri_early_industry_CRITERIA_DESCRIPTION: "保持稳健经济与持续增长的发展度，并运转多座工坊行会与手工工场。"
 oe_wp35_bri_centers_world_trade: "世界贸易中心"
 oe_wp35_bri_centers_world_trade_desc: "以强大的国家治理能力为依托，将我国商埠打造为万国商旅首选的交易枢纽。"
 oe_wp35_bri_centers_world_trade_CRITERIA_DESCRIPTION: "主导伦敦及布鲁日所属市场的商业力量，并牢固掌控本土地区。若布鲁日归属伦敦市场，则仅计伦敦市场。"
 oe_wp35_bri_renaissance: "英格兰文艺复兴"
 oe_wp35_bri_renaissance_desc: "赞助学术与艺术以扬国威，使首都成为文艺复兴理想的璀璨典范。"
 oe_wp35_bri_renaissance_CRITERIA_DESCRIPTION: "拥有高威望、高稳定、建有大学且城市建设雄厚的首都。"
 oe_wp35_bri_renovate_oxbridge: "重修牛津与剑桥"
 oe_wp35_bri_renovate_oxbridge_desc: "扩建修缮诸座名院，令牛津与剑桥始终屹立于欧洲学术前沿。"
 oe_wp35_bri_renovate_oxbridge_CRITERIA_DESCRIPTION: "拥有牛津与剑桥，在两地兴建大学并保持扎实的发展度。"
 oe_wp35_bri_expand_royal_navy: "扩建皇家海军"
 oe_wp35_bri_expand_royal_navy_desc: "广修船坞与码头，打造足以守护海峡航运的近代主力舰队。"
 oe_wp35_bri_expand_royal_navy_CRITERIA_DESCRIPTION: "拥有庞大舰队、众多海港及升级完善的海军基础设施。"
 oe_wp35_bri_royal_marines: "皇家海军陆战队"
 oe_wp35_bri_royal_marines_desc: "锻造精锐两栖劲旅，充当沿海突击先锋并戍守海外据点。"
 oe_wp35_bri_royal_marines_CRITERIA_DESCRIPTION: "保持高海军传统与严密的本土地区控制力。"
 oe_wp35_bri_found_standing_army: "组建常备陆军"
 oe_wp35_bri_found_standing_army_desc: "告别过时的封建征召制，在王冠统御下建立一支操练有素的职业常备军。"
 oe_wp35_bri_found_standing_army_CRITERIA_DESCRIPTION: "维持达到预期陆军规模 35% 的正规常备军，并具备稳固的王权正统与本土控制力。"
 oe_wp35_bri_redcoats: "红衫军"
 oe_wp35_bri_redcoats_desc: "统一操典与军备，铸就令全欧闻风丧胆的职业红衫军团。"
 oe_wp35_bri_redcoats_CRITERIA_DESCRIPTION: "拥有达到预期规模 60% 的正规常备军、高昂威望与稳固本土控制力。"
 oe_wp35_bri_empire: "大英帝国"
 oe_wp35_bri_empire_desc: "将繁庶民生、昌明学术、四海商贸与精锐海陆军融为一体，成就纵横寰宇的帝国伟业。"
 oe_wp35_bri_empire_CRITERIA_DESCRIPTION: "达到雄厚发展度、财政收入、正统性与控制力，圆满完成内政革新。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_empire_modifier: "帝国登极"
 STATIC_MODIFIER_DESC_oe_wp35_bri_empire_modifier: "帝国威权日益稳固：随着王权控制遍及全境，正统性与宗教影响力按月攀升。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_royal_marines_modifier: "皇家海军陆战队"
 STATIC_MODIFIER_DESC_oe_wp35_bri_royal_marines_modifier: "精锐海陆两栖部队自海上奇袭，大幅提升登陆速度与海战士气。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_redcoats_modifier: "红衫军团"
 STATIC_MODIFIER_DESC_oe_wp35_bri_redcoats_modifier: "统一操典与精良军备令我国步兵在每一片战场皆更具杀伤力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_manpower_surge_modifier: "战时募兵热潮"
 STATIC_MODIFIER_DESC_oe_wp35_bri_manpower_surge_modifier: "大批新兵踊跃入伍，在一段时期内充实兵源并加快前线补员。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_sailor_surge_modifier: "海军征募运动"
 STATIC_MODIFIER_DESC_oe_wp35_bri_sailor_surge_modifier: "征募队与赏银迅速填满底层甲板，短期内大幅扩充水手储备。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_monopolize_channel_modifier: "海峡商贸垄断"
 STATIC_MODIFIER_DESC_oe_wp35_bri_monopolize_channel_modifier: "掌控英吉利海峡贸易推动全境海运商业与造船业蓬勃发展。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_world_trade_center_modifier: "世界贸易中枢"
 STATIC_MODIFIER_DESC_oe_wp35_bri_world_trade_center_modifier: "五大洲奇货云集伦敦交易所，尽归英伦商贾周转。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_watt_steam_engine_modifier: "瓦特蒸汽机"
 STATIC_MODIFIER_DESC_oe_wp35_bri_watt_steam_engine_modifier: "轰鸣的蒸汽动力驱动新兴工场的水泵与织机，开启工业纪元。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_most_esteemed_university_modifier: "至高声望学府"
 STATIC_MODIFIER_DESC_oe_wp35_bri_most_esteemed_university_modifier: "基督教世界四方学子慕名云集修缮一新的名校深造。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_man_of_war_modifier: "主力风帆战列舰"
 STATIC_MODIFIER_DESC_oe_wp35_bri_man_of_war_modifier: "新建船坞以更快速度舾装巨型战列舰，并压低远航维养成本。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_recovering_prestige_modifier: "重振国威"
 STATIC_MODIFIER_DESC_oe_wp35_bri_recovering_prestige_modifier: "虽法兰西犹存，此役已向全欧彰显英格兰坚韧不屈的尚武气概。"
 oe_wp35_bri_hundred_years_war: "百年战争"
 oe_wp35_bri_hundred_years_war_desc: "图尔停战协定仅在英法之间换来片刻脆弱的宁静。双方皆心知战火必将重燃，我们必须决断是暂守和约以待良机，抑或整军再战——英格兰的命运系于此举。"
 oe_wp35_bri_hundred_years_war_CRITERIA_DESCRIPTION: "百年战争局势处于激活状态。"
 oe_wp35_bri_end_the_french_conflict: "终结法英争端"
 oe_wp35_bri_end_the_french_conflict_desc: "无论是在欧陆击败法兰西并夺取法王王冠，抑或抽身大陆转而倾力经营海军，我们与法兰西的百年纠葛都必须画上句号。"
 oe_wp35_bri_end_the_french_conflict_CRITERIA_DESCRIPTION: "百年战争局势已经结束。"
 oe_wp35_bri_develop_british_identity: "铸就不列颠认同"
 oe_wp35_bri_develop_british_identity_desc: "不列颠群岛聚居着众多民族与语系：北方有苏格兰低地与高地人，翡翠岛上有爱尔兰人，南方则是威尔士与英格兰人。若任其疏离必生隐患，我们当熔铸共同的不列颠认同，确立诸岛大一统霸权。"
 oe_wp35_bri_develop_british_identity_CRITERIA_DESCRIPTION: "掌控不列颠群岛，并接纳或宽容苏格兰与爱尔兰文化。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_unified_british_identity_modifier: "统一不列颠认同"
 STATIC_MODIFIER_DESC_oe_wp35_bri_unified_british_identity_modifier: "共同的不列颠认同凝聚诸岛人心，缓和族群隔阂并加固对王冠的效忠。"
 oe_wp35_bri_english_superiority: "英格兰之威"
 oe_wp35_bri_english_superiority_desc: "强敌虽众却傲慢自大，竟妄图在海上与我们争锋、觊觎我海外基业。是时候让他们领教狂妄的代价了。"
 oe_wp35_bri_english_superiority_CRITERIA_DESCRIPTION: "通过羞辱宿敌或令天下再无宿敌以彰显国威。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_english_superiority_modifier: "英格兰霸威"
 STATIC_MODIFIER_DESC_oe_wp35_bri_english_superiority_modifier: "连克宿敌令国民自信倍增，力量投射显著跃升。"
 oe_wp35_bri_the_royal_court: "皇家枢密宫廷"
 oe_wp35_bri_the_royal_court_desc: "君主若无良臣辅弼则难成大业。无论前路几何，干练的内阁谋臣皆不可或缺。"
 oe_wp35_bri_the_royal_court_CRITERIA_DESCRIPTION: "拥有高正统性、才干卓著的君主，以及由内阁首辅领衔的精干内阁。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_the_royal_court_modifier: "皇家枢密宫廷"
 STATIC_MODIFIER_DESC_oe_wp35_bri_the_royal_court_modifier: "贤臣云集的宫廷以精明谋断大幅提高王国施政效率。"
 oe_wp35_bri_mainland_alliances: "欧陆同盟"
 oe_wp35_bri_mainland_alliances_desc: "虽志在四海，亦不可轻忽欧洲大陆的潜在威胁。我们当合纵敌之所敌；最古老的盟友葡萄牙或许还将续签温莎条约，并奉上如孟买般丰厚的嫁妆。"
 oe_wp35_bri_mainland_alliances_CRITERIA_DESCRIPTION: "成为霸主，或与两座同洲强国（发展度 200 以上，或葡萄牙）结盟并深得其信赖。"
 oe_wp35_bri_influence_the_lowlands: "经略尼德兰"
 oe_wp35_bri_influence_the_lowlands_desc: "低地诸邦的荷兰与佛兰德人与我们志趣相投：崇尚远洋贸易、坐拥劲旅舰队，并抵制法西霸权。将低地纳入我国影响圈，必能赢得无价的盟友或藩属。"
 oe_wp35_bri_influence_the_lowlands_CRITERIA_DESCRIPTION: "由本国、附庸或低地盟友掌控低地地区 45 处地点，或在宗教改革时代开启后成为经济霸主。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_lowlands_trade_partners_modifier: "低地商贸伙伴"
 STATIC_MODIFIER_DESC_oe_wp35_bri_lowlands_trade_partners_modifier: "与低地诸邦的紧密商约强化了我国贸易地位与外交声望。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_integrated_lowlands_modifier: "融合低地文化"
 STATIC_MODIFIER_DESC_oe_wp35_bri_integrated_lowlands_modifier: "我们与低地诸族群缔结了牢固的文化与政治纽带。"
 oe_wp35_bri_opinion_lowlands_trade_partners: "低地商贸伙伴关系"
 oe_wp35_bri_grateful_to_britain: "感念不列颠援手"
 oe_wp35_bri_papal_support: "教宗鼎力支持"
 oe_wp35_bri_trust_grateful_to_britain: "感念不列颠援手"
 oe_wp35_bri_trust_mainland_alliance: "欧陆同盟互信"
 oe_wp35_bri_the_european_trade: "欧陆贸易网络"
 oe_wp35_bri_the_european_trade_desc: "尽管新大陆奇货源源不断涌入海峡，欧洲仍遍布丰厚商埠。深耕欧陆市场将确保我国稳执欧洲商贸牛耳。"
 oe_wp35_bri_the_european_trade_CRITERIA_DESCRIPTION: "在欧洲主要市场建立强劲的商业存在。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_european_trade_modifier: "欧陆贸易霸网"
 STATIC_MODIFIER_DESC_oe_wp35_bri_european_trade_modifier: "遍布欧洲的商贸网络大幅推升进出口与转口收益。"
 oe_wp35_bri_issue_the_royal_warrant: "颁布皇家御用委任状"
 oe_wp35_bri_issue_the_royal_warrant_desc: "皇家御用委任状乃王室授予宫廷珍品供应商的殊荣。我们当择优颁授，以换取更为有利的商贸协定。"
 oe_wp35_bri_issue_the_royal_warrant_CRITERIA_DESCRIPTION: "通过颁布皇家御用委任状扶持市民阶层与商贾。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_royal_warrant_modifier: "皇家御用委任状"
 STATIC_MODIFIER_DESC_oe_wp35_bri_royal_warrant_modifier: "颁授皇家御用委任状巩固了商业伙伴关系，并提升了市民阶层地位。"
 oe_wp35_bri_abolish_villeinage: "废除农奴劳役制"
 oe_wp35_bri_abolish_villeinage_desc: "昔日的农奴劳役虽曾行之有效，如今却已落后于时代。与其固守陈规，不如推广公簿持有农佃制以释放乡土活力。"
 oe_wp35_bri_abolish_villeinage_CRITERIA_DESCRIPTION: "在不激怒贵族阶层的前提下赋予农民更多自由。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_villeinage_ended_modifier: "农奴制终结"
 STATIC_MODIFIER_DESC_oe_wp35_bri_villeinage_ended_modifier: "废除农奴劳役显著推动了乡土繁荣与发展度增长。"
 oe_wp35_bri_found_the_royal_navy: "肇建皇家海军"
 oe_wp35_bri_found_the_royal_navy_desc: "当前舰队不过依赖市民商船临时征召，动员迟缓且耗资不菲。我们必须创立常备皇家海军，御外侮于沧海之外、保江山万世无虞。"
 oe_wp35_bri_found_the_royal_navy_CRITERIA_DESCRIPTION: "建立一支常备正规舰队。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_exploration_spirit_modifier: "远航探索精神"
 STATIC_MODIFIER_DESC_oe_wp35_bri_exploration_spirit_modifier: "探索未知的壮志拓宽了王国视野，加快远洋探险步伐。"
 oe_wp35_bri_war_of_the_roses: "玫瑰战争"
 oe_wp35_bri_war_of_the_roses_desc: "这场酝酿已久的王室内战终究降临。无论鹿死谁手，我们必须引领臣民安然渡过这段动荡岁月。"
 oe_wp35_bri_war_of_the_roses_CRITERIA_DESCRIPTION: "成功渡过玫瑰战争灾难。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_a_house_united_modifier: "王室归于一统"
 STATIC_MODIFIER_DESC_oe_wp35_bri_a_house_united_modifier: "玫瑰战争落幕后贵族重归团结，各方猜忌与敌意大幅缓和。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_dynastic_security_modifier: "王室血脉绵延"
 STATIC_MODIFIER_DESC_oe_wp35_bri_dynastic_security_modifier: "稳固的王室宗系提升了人物生育率与预期寿数。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_dynastic_power_modifier: "王朝威权"
 STATIC_MODIFIER_DESC_oe_wp35_bri_dynastic_power_modifier: "根基深厚的王朝增强了王室正统性。"
 oe_wp35_bri_handle_the_reformation: "应对宗教改革"
 oe_wp35_bri_handle_the_reformation_desc: "宗教纷争席卷欧陆，昔日罗马教廷的指引如今化作漫天乱局。我们必须掌握主动，明定王国信仰去向；若路德思潮广传之际国王仍困于宗嗣大案，至尊法案或将应运而生，创立英格兰国教。"
 oe_wp35_bri_handle_the_reformation_CRITERIA_DESCRIPTION: "投身宗教改革浪潮，或坚定予以反制。"
 oe_wp35_bri_act_of_supremacy_hint_tt: "国王大案步入摊牌：若君主为年逾 25 岁的已婚男性且无在世之子，而教宗仍守天主教正统，则可能提出《至尊法案》并创立英格兰圣公会。\n（1500 至 1600 年间条件满足时亦可自然触发。）"
 STATIC_MODIFIER_NAME_oe_wp35_bri_a_new_religious_destiny_modifier: "崭新信仰天命"
 STATIC_MODIFIER_DESC_oe_wp35_bri_a_new_religious_destiny_modifier: "步入新的宗教道路振奋国运，加快信仰统一并平抑动荡。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_absent_from_the_reformation_modifier: "超然宗教改革之外"
 STATIC_MODIFIER_DESC_oe_wp35_bri_absent_from_the_reformation_modifier: "置身教派激争之外增进了信仰宽容与国内安定。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_loyalty_to_the_pope_modifier: "效忠教宗"
 STATIC_MODIFIER_DESC_oe_wp35_bri_loyalty_to_the_pope_modifier: "坚守罗马正统提升了宗教影响力并巩固与圣座的邦交。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_one_state_one_church_modifier: "一国一教"
 STATIC_MODIFIER_DESC_oe_wp35_bri_one_state_one_church_modifier: "确立国家教会强化了宗教统一，削弱了教士独立势力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_head_of_anglican_church_modifier: "圣公会最高首脑"
 STATIC_MODIFIER_DESC_oe_wp35_bri_head_of_anglican_church_modifier: "君主亲掌圣公会最高首脑权柄，强化宽容并压制各阶层僭越。"
 oe_wp35_bri_piety_of_the_state: "国家虔信与教会统辖"
 oe_wp35_bri_piety_of_the_state_desc: "我国乃蒙主眷顾之土，但教士阶层对教务治理却别有盘算。我们必须确立国家虔信，将教会大权收归王冠统筹。"
 oe_wp35_bri_piety_of_the_state_CRITERIA_DESCRIPTION: "借由政府改革与教区基建平衡教会权威与世俗王权。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_anglican_reform_progress_modifier: "圣公会改革进程"
 STATIC_MODIFIER_DESC_oe_wp35_bri_anglican_reform_progress_modifier: "圣公会改革持续推进，为政府改制开辟额外改革槽位。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_religious_stability_modifier: "宗教秩序稳定"
 STATIC_MODIFIER_DESC_oe_wp35_bri_religious_stability_modifier: "稳健均衡的教务方针维系了国教稳固与教派和睦。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_anglican_state_church_modifier: "圣公会国教体制"
 STATIC_MODIFIER_DESC_oe_wp35_bri_anglican_state_church_modifier: "圣公会国教将教会权威收归王冠，显著削弱教士自治权。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_clergy_land_confiscation_modifier: "解散修院与没收教产"
 STATIC_MODIFIER_DESC_oe_wp35_bri_clergy_land_confiscation_modifier: "查抄修道院地产充盈国库，同时大幅削弱教士阶层实力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_conciliarism_of_churches_modifier: "教会公会议共治"
 STATIC_MODIFIER_DESC_oe_wp35_bri_conciliarism_of_churches_modifier: "奉行公会议精神协调政教关系，赢得教士阶层持久好感。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_clergy_approval_anglican_settlement_modifier: "教士拥护圣公会和解方案"
 STATIC_MODIFIER_DESC_oe_wp35_bri_clergy_approval_anglican_settlement_modifier: "教士认可王国宗教和解法案，大幅提升教士满意度。"
 oe_wp35_bri_strengthen_the_crown: "强化王权"
 oe_wp35_bri_strengthen_the_crown_desc: "王权边界历来争讼不休：君主自认君权神授、唯我独尊，议会却步步掣肘。当专制思潮风靡欧洲诸廷之际，我们亦当顺势强化中央王权。"
 oe_wp35_bri_strengthen_the_crown_CRITERIA_DESCRIPTION: "借由政府改革与阶层特权巩固王权正统并制衡阶层势力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_strong_crown_modifier: "强固王权"
 STATIC_MODIFIER_DESC_oe_wp35_bri_strong_crown_modifier: "王室权威高涨，直接提升王冠阶层力量。"
 oe_wp35_bri_acts_of_the_parliament: "议会诸法案"
 oe_wp35_bri_acts_of_the_parliament_desc: "议会乃经国重器；唯有善加引导，方能尽展其调和邦国、聚财立法之伟力。"
 oe_wp35_bri_acts_of_the_parliament_CRITERIA_DESCRIPTION: "通过议会法案，在阶层力量与王权权威间达成稳健制衡。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_strong_burghers_modifier: "强盛市民阶层"
 STATIC_MODIFIER_DESC_oe_wp35_bri_strong_burghers_modifier: "繁盛的市民与商贾阶层在议会与城镇中展现澎湃活力。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_the_two_houses_modifier: "上下两院协和"
 STATIC_MODIFIER_DESC_oe_wp35_bri_the_two_houses_modifier: "上议院与下议院和衷共济，议会议案推进更为顺畅。"
 oe_wp35_bri_the_three_kingdoms_wars: "三国之战"
 oe_wp35_bri_the_three_kingdoms_wars_desc: "王座威权与议会实权水火难容，保王党与议会派之间的兵戎相见已成定局。"
 oe_wp35_bri_the_three_kingdoms_wars_CRITERIA_DESCRIPTION: "成功平息三国之战局势。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_weathered_absolutism_modifier: "历经沧桑的专制王权"
 STATIC_MODIFIER_DESC_oe_wp35_bri_weathered_absolutism_modifier: "熬过内战风暴的王权更具韧性，稳定度衰减显著放缓。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_restored_order_modifier: "重整纲纪"
 STATIC_MODIFIER_DESC_oe_wp35_bri_restored_order_modifier: "平息内乱后的复元秩序全面提振正统性与各阶层满意度。"
 oe_wp35_bri_rule_britannia: "统治吧，不列颠尼亚！"
 oe_wp35_bri_rule_britannia_desc: "海军乃吾国之脊梁，沧海乃吾辈之家园。自孤岛扬帆、以无敌舰队号令四海，正是大不列颠的天命所在！"
 oe_wp35_bri_rule_britannia_CRITERIA_DESCRIPTION: "确立压倒性的制海权并傲视寰宇。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_naval_dominance_modifier: "四海制海霸权"
 STATIC_MODIFIER_DESC_oe_wp35_bri_naval_dominance_modifier: "绝对制海权强化了我国外交声望、重型战舰战力与海员储备。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_mediterranean_trade_center_modifier: "地中海贸易重镇"
 STATIC_MODIFIER_DESC_oe_wp35_bri_mediterranean_trade_center_modifier: "米字旗飘扬下的岛港汇聚起地中海四方商货。"
 oe_wp35_bri_mediterranean_authority: "地中海霸权"
 oe_wp35_bri_mediterranean_authority_desc: "最初我们仅视地中海据点为制衡邻邦的战略棋子，如今却已明晰：凭借这些咽喉要岛，我们足以左右整个地中海的商贸脉动。"
 oe_wp35_bri_mediterranean_authority_CRITERIA_DESCRIPTION: "在地中海地区建立雄厚的商贸影响力。"
 oe_wp35_bri_discover_the_americas: "发现美洲"
 oe_wp35_bri_discover_the_americas_desc: "遥远西海之外流传着神秘新土的耳语，据说沃野千里、奇珍遍地。若此言非虚，那些土地必当归属大英王冠。"
 oe_wp35_bri_discover_the_americas_CRITERIA_DESCRIPTION: "探索美洲地区。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_unknown_frontier_modifier: "未知远洋边疆"
 STATIC_MODIFIER_DESC_oe_wp35_bri_unknown_frontier_modifier: "探索未知的壮怀极大激发了海外殖民迁徙热忱。"
 oe_wp35_bri_colonize_canada: "开拓加拿大"
 oe_wp35_bri_colonize_canada_desc: "北方疆域虽较南土苦寒荒凉，然雪岭林海间盛产珍稀毛皮、良木与矿藏。特许设立哈德逊湾公司，便可令我国商站遍布北境荒原。"
 oe_wp35_bri_colonize_canada_CRITERIA_DESCRIPTION: "在加拿大地区建立殖民据点。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_established_shipping_lanes_modifier: "稳固跨洋航道"
 STATIC_MODIFIER_DESC_oe_wp35_bri_established_shipping_lanes_modifier: "通往海外殖民地的常设航道大幅提升全球商业力量。"
 oe_wp35_bri_settle_in_america: "定居北美"
 oe_wp35_bri_settle_in_america_desc: "北美沃土物产丰饶：北盛毛皮与造船巨木，南宜广植经济作物。我们当速立据点以收厚利；本土避祸的清教徒与异见者亦将掀起大迁徙，为新大陆输血开疆。"
 oe_wp35_bri_settle_in_america_CRITERIA_DESCRIPTION: "在北美东岸建立定居点。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_welcome_to_america_modifier: "初抵新大陆"
 STATIC_MODIFIER_DESC_oe_wp35_bri_welcome_to_america_modifier: "美洲殖民地的兴起掀起澎湃的跨大西洋移民浪潮。"
 oe_wp35_bri_colonize_the_caribbean: "殖民加勒比群岛"
 oe_wp35_bri_colonize_the_caribbean_desc: "加勒比碧海诸岛蕴藏着令冒险绅士垂涎的丰厚种植园收益，而我国正不乏敢闯敢拼、长于经营的拓荒人物。"
 oe_wp35_bri_colonize_the_caribbean_CRITERIA_DESCRIPTION: "在加勒比地区建立殖民据点。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_a_useful_workforce_modifier: "殖民劳动力整合"
 STATIC_MODIFIER_DESC_oe_wp35_bri_a_useful_workforce_modifier: "加快当地人口晋升、同化与种植园生产效率。"
 oe_wp35_bri_dominate_the_new_world: "称霸新大陆"
 oe_wp35_bri_dominate_the_new_world_desc: "这片瑰丽的新世界乃我王冠囊中之物。一切宝藏与疆土皆应归于大英旗帜之下，凡敢染指者必驱逐殆尽。"
 oe_wp35_bri_dominate_the_new_world_CRITERIA_DESCRIPTION: "牢牢掌控新大陆核心殖民版图。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_new_world_domination_modifier: "新大陆霸主"
 STATIC_MODIFIER_DESC_oe_wp35_bri_new_world_domination_modifier: "称霸美洲令我国商业力量与进出口效率跃居世界之巅。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_colonial_investment_modifier: "殖民地资本倾注"
 STATIC_MODIFIER_DESC_oe_wp35_bri_colonial_investment_modifier: "大规模投资海外殖民地，全面推升生产与贸易效率。"
 oe_wp35_bri_sail_around_africa: "绕航非洲"
 oe_wp35_bri_sail_around_africa_desc: "绕过好望角之后，东方沧海究竟蕴藏着何等奇景与富庶？"
 oe_wp35_bri_sail_around_africa_CRITERIA_DESCRIPTION: "探索好望角周边的非洲海岸。"
 oe_wp35_bri_seize_the_cape: "夺取好望角"
 oe_wp35_bri_seize_the_cape_desc: "好望角是通往东印度的咽喉补给站。毫无疑问，谁握紧好望角，谁就扼住了列强东进亚洲的命脉——好望角必归我手！"
 oe_wp35_bri_seize_the_cape_CRITERIA_DESCRIPTION: "掌控好望角行省。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_the_cape_of_good_hope_modifier: "好望角补给重镇"
 STATIC_MODIFIER_DESC_oe_wp35_bri_the_cape_of_good_hope_modifier: "掌控好望角提升舰船修缮速度并汇聚东西航线商权。"
 oe_wp35_bri_chart_the_southern_isles: "测绘南大洋诸岛"
 oe_wp35_bri_chart_the_southern_isles_desc: "怀揣英伦胆魄的探险家正请求朝廷资助，以测绘辽阔无垠的南大洋。传闻彼岸尚有无主沃土，我们必须捷足先登，抢在群雄之前竖起国旗。"
 oe_wp35_bri_chart_the_southern_isles_CRITERIA_DESCRIPTION: "探索南大洋与大洋洲海域。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_terra_australis_modifier: "南方大陆经略"
 STATIC_MODIFIER_DESC_oe_wp35_bri_terra_australis_modifier: "开拓南大洋与澳大利亚提升我国全球商业力量与殖民移民规模。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_spice_act_modifier: "香料法案"
 STATIC_MODIFIER_DESC_oe_wp35_bri_spice_act_modifier: "香料群岛的丁香、肉豆蔻与胡椒如今尽凭大英特许令扬帆远销。"
 oe_wp35_bri_colonize_spice_islands: "经略香料群岛"
 oe_wp35_bri_colonize_spice_islands_desc: "世界极东的群岛盛产珍奇香料与瑰丽织物。我们当于此立足设站，令东方奇珍惠及本土万民。"
 oe_wp35_bri_colonize_spice_islands_CRITERIA_DESCRIPTION: "在香料群岛地区立足殖民。"
 oe_wp35_bri_settle_australia: "开拓澳大利亚"
 oe_wp35_bri_settle_australia_desc: "远航探查揭示了一座幅员辽阔得难以想象的南方大陆岛。虽非传说中的南极沃洲，其广袤疆土仍应归于王冠名下。假以时日，第一舰队将载着拓荒者与流放犯驶向这片远岸。"
 oe_wp35_bri_settle_australia_CRITERIA_DESCRIPTION: "在澳大利亚地区建立殖民地。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_penal_colony_modifier: "流放殖民地体制"
 STATIC_MODIFIER_DESC_oe_wp35_bri_penal_colony_modifier: "在澳大利亚设立流放殖民地既扩充拓荒人口，又有效疏导国内叛乱压力。"
 oe_wp35_bri_discover_india: "发现印度航路"
 oe_wp35_bri_discover_india_desc: "印度贸易自古繁荣，然漫长商道尽令他国坐收渔利。我们必须筹组远航，开辟直达印度的海上航线。一旦船队抵达科罗曼德尔海岸，便可仿效 1639 年向马德拉斯纳亚克求地设馆之先例，以和平之道换取首座商馆。"
 oe_wp35_bri_discover_india_CRITERIA_DESCRIPTION: "开辟通往印度的海上航路。"
 oe_wp35_bri_east_indies_company: "创立东印度公司"
 oe_wp35_bri_east_indies_company_desc: "无数奇珍异货皆产自印度次大陆，欧洲列强早已从中牟取暴利多年。是时候与诸强平起平坐，在印度建立我们自己的贸易公司了。\n\n我们首先需要一处沿海立足点。[ShowCountryInteractionName('oe_wp35_bri_grant_of_madras')]是和平取得首座商馆之策，而刀剑则是另一条道路。"
 oe_wp35_bri_east_indies_company_CRITERIA_DESCRIPTION: "在印度建立贸易公司立足点。"
 oe_wp35_bri_trade_company_charter: "颁授公司皇家特许状"
 oe_wp35_bri_trade_company_charter_desc: "是时候向贸易公司颁授皇家特许状，统筹我朝在印度的商业大计。完成此举将在南亚据点筑起贸易公司总部，正式设立受封东印度公司，并开启印度公司风云局势。受封公司亦可向印度诸侯购置毗邻整省的田赋征收权。"
 oe_wp35_bri_trade_company_charter_CRITERIA_DESCRIPTION: "直接或经由非朝贡附庸拥有南亚沿海领地，并具备兴建贸易公司总部之条件。"
 oe_wp35_bri.1.title: "英属印度的建立"
 oe_wp35_bri.1.desc: "我们在印度次大陆的版图早已远超昔日零星沿海商馆：从孟买港湾与科罗曼德尔海岸到胡格利河畔的膏腴沃野，大英旗帜已飘扬于亿万臣民与无数商埠之上。威斯敏斯特议会、东印度公司董事局与前线将官正激烈争论南亚治权归属：是设立自治的英属印度总督领、由伦敦王冠实行彻底直辖，抑或任命特许全权总督兼顾商贸与军政？"
 oe_wp35_bri.1.a: "宣告建立英属印度"
 oe_wp35_bri.1.b: "由伦敦王冠直接统辖印度"
 oe_wp35_bri.1.tt: "将建立英属印度作为殖民附庸，统辖我国在南亚的领土"
 oe_wp35_bri.1.historical_info: "英属印度（英属拉吉）始于 1857 年印度大起义之后，1858 年大英王冠正式接管东印度公司职权，对印度次大陆实行直接统治直至 1947 年。"
 oe_wp35_bri_seize_ceylon: "夺取锡兰"
 oe_wp35_bri_seize_ceylon_desc: "锡兰孤悬印度南端，乃锁钥印度洋商路的战略宝岛。诸强皆垂涎印度与香料群岛厚利，屡欲染指此岛，我们断不可令其得逞。"
 oe_wp35_bri_seize_ceylon_CRITERIA_DESCRIPTION: "掌控锡兰行省。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_coromandel_presence_modifier: "科罗曼德尔据点"
 STATIC_MODIFIER_DESC_oe_wp35_bri_coromandel_presence_modifier: "在科罗曼德尔海岸站稳脚跟，大幅提升远东商贸效率。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_indian_coastal_control_modifier: "印度西岸商控"
 STATIC_MODIFIER_DESC_oe_wp35_bri_indian_coastal_control_modifier: "从苏拉特到卡利卡特，西岸商货尽数经由我国商馆集散。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_strategic_port_modifier: "印度洋战略要港"
 STATIC_MODIFIER_DESC_oe_wp35_bri_strategic_port_modifier: "掌控咽喉军港大幅提升当地生产效率与港务价值。"
 oe_wp35_bri_take_west_indian_coast: "掌控西印度海岸"
 oe_wp35_bri_take_west_indian_coast_desc: "毋庸置疑，握紧印度西岸海港将使我们扼住整个次大陆的门户。以大不列颠之名将这片海岸收入囊中吧。"
 oe_wp35_bri_take_west_indian_coast_CRITERIA_DESCRIPTION: "掌控印度西海岸地区。"
 oe_wp35_bri_push_into_inland_india: "挺进印度内陆"
 oe_wp35_bri_push_into_inland_india_desc: "印度腹地素以富饶矿藏与绝世珍宝闻名于世。将其纳入我国治理之下，势必为帝国增添无尽财富。"
 oe_wp35_bri_push_into_inland_india_CRITERIA_DESCRIPTION: "掌控印度内陆地区。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_trade_company_influence_modifier: "贸易公司实权"
 STATIC_MODIFIER_DESC_oe_wp35_bri_trade_company_influence_modifier: "贸易公司在印度的深厚影响全面提升帝国生产效率。"
 oe_wp35_bri_conquer_bengal: "征服孟加拉"
 oe_wp35_bri_conquer_bengal_desc: "东印度贸易公司在此耕耘日久。顺应其请愿并借其乡导，如今正是牢牢掌控富庶孟加拉三角洲的决胜时刻。"
 oe_wp35_bri_conquer_bengal_CRITERIA_DESCRIPTION: "掌控孟加拉地区。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_growing_east_indian_trade_modifier: "蓬勃东印度商贸"
 STATIC_MODIFIER_DESC_oe_wp35_bri_growing_east_indian_trade_modifier: "不断扩张的东印度贸易极大增强帝国全球商权与进出口收益。"
 oe_wp35_bri_masters_of_india: "印度之主"
 oe_wp35_bri_masters_of_india_desc: "印度次大陆已臣服于我军威势之下，让我们尽收天竺奇珍以耀帝国荣光！公司的时代至此落幕，印度将直接归于王冠直辖统治。"
 oe_wp35_bri_masters_of_india_CRITERIA_DESCRIPTION: "掌控整个印度次大陆。"
 STATIC_MODIFIER_NAME_oe_wp35_bri_masters_of_india_modifier: "印度次大陆之主"
 STATIC_MODIFIER_DESC_oe_wp35_bri_masters_of_india_modifier: "统御印度次大陆大幅增强帝国力量投射、外交吞并效率与治安稳定。"
