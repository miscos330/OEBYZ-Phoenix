 OE_WP35_BRI_PIE_COMPANY_TT: "#T 英属印度#!\n南亚已有主[location|e]中，#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_company_share').GetValue|0%]#! 由英属印度及其附庸掌控。"
 OE_WP35_BRI_PIE_CONTESTED_TT: "#T 未归附印度#!\n南亚已有主[location|e]中，#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_contested_share').GetValue|0%]#! 仍在印度诸邦或列强手中。"
 oe_wp35_eic_situation_desc_expanding_direct: "#T 商馆扩张期#!\n东印度公司已在印度站稳脚跟，可以金币游说印度君主出让更多港湾与领地。商馆特许、永租港与毗邻行省包税权均向王冠开放，所购疆土尽归直辖。"
 oe_wp35_eic_situation_desc_securing_direct: "#T 霸权巩固期#!\n孟加拉已入囊中，公司不再只是商贾。王冠现可宣称孟加拉迪瓦尼以收赋税、借附属同盟收服式微土邦，并派兵绥靖动荡行省。\n\n原有租借与购地依旧开放。待彻底称霸印度后，局势将以王冠直辖圆满收官。"
 cb_oe_wp35_bri_letters_patent: "皇家特许征服状"
 cb_oe_wp35_bri_letters_patent_PROV: "对 [PROVINCE.GetName] 的皇家特许征服状"
 cb_oe_wp35_bri_letters_patent_desc: "凭国玺颁布的皇家特许状，王冠赋予自身征服、占领并统辖此地之法权；直至归入版图前此宣称永不失效。"
