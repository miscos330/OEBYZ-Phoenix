 oe_wp35_bri.3.title: "威斯敏斯特与加尔各答特许状审议"
 oe_wp35_bri.3.desc: "印度治权格局定鼎九月之后，来自马德拉斯、孟买与加尔各答的远洋航运清册与各省岁入账簿陆续送抵伦敦威斯敏斯特议会案头。英伦商贾盛赞茶叶、生丝、棉布与硝石贸易令帝国海关岁入节节攀升，朝廷重臣则力主借此时机完善皇家驻印文官与审计制度，以肃清海外贪墨并令大英帝国威仪长耀印度洋诸岸。"
 oe_wp35_bri.3.a: "将印度海关红利投入伦敦船坞与王室国库"
 oe_wp35_bri.3.b: "颁行统一帝国司法与驻印文官章程以固治道"
 oe_wp35_bri.3.c: "拔擢干练东印度公司特派员入值枢密院"
 oe_wp35_eic.1.b: "于议会正式确认东印度局势收官后的宪制安排"
 oe_wp35_eic.1.c: "任命资深东方贸易专员常驻伦敦统筹远洋商策"
 hint_oe_wp35_eic_situation: "[GetSituationByKey('oe_wp35_eic_situation').GetNameWithNoTooltip]"
 hint_oe_wp35_eic_situation_hint_text: "#T 第一阶段：商馆扩张期#!\n@hint! 完成“发现印度航路”与“创立东印度公司”任务即可解锁马德拉斯商馆特许、孟买永租契约、加尔各答采邑购置以及可重复申请的沿海商馆特许。颁授公司特许状后，更可解锁毗邻省份包税地权，直接收购与我方直辖地接壤且原主控制薄弱的印度整省。\n\n#T 第二阶段：霸权巩固期#!\n@hint! 完成“征服孟加拉”后局势进入巩固期：率先宣称全剧限一次的孟加拉迪瓦尼包税权以独享丰厚田赋，对式微土邦发起附属同盟条约，并定期绥靖低控动荡地区。\n\n#T 局势收官：王冠直辖#!\n@hint! 完成“印度之主”任务即以王冠直辖圆满结束局势，为王冠及其附庸名下所有南亚领地赋予永久控制力增益。"
 hint_oe_wp35_eic_situation_adm: "\"在发动耗资不菲的内陆大战前，善用包税地权和平吞并原主鞭长莫及的毗邻行省。\""
 hint_oe_wp35_eic_situation_dip: "\"与葡萄牙及印度沿海君主保持和睦邦交，可令马德拉斯、孟买与加尔各答几乎兵不血刃地归于我手。\""
 hint_oe_wp35_eic_situation_mil: "\"尽速平定孟加拉以抢占迪瓦尼并开启附属同盟，再以绥靖行动稳固大军身后的占领区。\""
