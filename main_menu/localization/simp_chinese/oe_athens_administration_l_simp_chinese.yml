l_simp_chinese:
 oe_athens_administration.1.t: "雅典的官署"
 oe_athens_administration.1.d: "皇帝的双头鹰已在雅典升起，地方的税册与诉状却仍散落在各处。来自周边城镇的使者为了一纸批文，不得不远赴君士坦丁堡。官员们建议修复卫城中的旧有厅堂，设立常驻官署，使希腊的赋税、司法与政务在此汇集。只需一笔开办经费，这座古老的城市便能重新成为帝国治理地方的中心。"
 oe_athens_administration.1.a: "在雅典重建行政中心"
 oe_athens_administration_pending: "雅典行政中心重建提议待裁决"
