l_simp_chinese:
 OE_NP_HOUSES: "门第簿录"
 OE_NP_HOUSES_DESC: "帝国诸家以血缘传承门第，以财赋与军功维系声望。此处列出东罗马治下的全部豪族国家，亦包括新近兴起与暂居边缘的家族。"
 OE_NP_FAMILY: "家族"
 OE_NP_INFLUENCE: "影响力"
 OE_NP_INFLUENCE_DESC: "政治影响力：#Y [Country.MakeScope.GetVariable('oe_np_influence').GetValue|2]#! / #Y 1000#!；计入排行榜的乘数为 #Y 0.2#!。\n\n每月预计变动：#Y [Country.MakeScope.GetVariable('oe_np_monthly_change').GetValue|2]#!\n固定减少2；每个东罗马内阁席位增加1；每个琼筵序次席位增加1.5；每位东罗马陆海军统帅增加0.25。\n\n家族成员统领东罗马军队获胜：+10\n豪族国家君主去世：−50\n每位家族成员结婚：+5\n豪族互动每消耗1权威：该家族+2\n\n影响力限制在0—1000。婚姻按双方分别计入其家族；同一家族两名成员成婚合计+10。手动刷新不会进行月度结算。"
 OE_NP_INTERACT: "互动"
 OE_NP_INTERACT_DESC: "展开对该豪族的互动，查看可执行的行动及其条件。"
 OE_NP_INTERACTIONS_TITLE: "家门往来"
 OE_NP_CLOSE: "收起"
 OE_NP_NO_INTERACTIONS: "目前没有可显示的互动。"
 OE_NP_NO_HOUSES: "名册中尚无豪族。"
 OE_NP_RANKING: "豪族排行榜"
 OE_NP_RANKING_DESC: "按总得分从高到低排列。第 #Y 1—3#! 名为强势豪族，第 #Y 4—5#! 名为豪族，第 #Y 6#! 名起为边缘豪族。同分时按首次登记顺序排列。家族等级不改变附庸类型。"
 OE_NP_RANKING_HINT: "每月更新；悬停总得分查看各项明细。"
 OE_NP_REFRESH: "刷新"
 OE_NP_REFRESH_DESC: "立即重新统计豪族、各项得分及排名。不消耗资源。"
 OE_NP_POWERFUL: "强势豪族"
 OE_NP_ESTABLISHED: "豪族"
 OE_NP_MARGINAL: "边缘豪族"
 AUTO_MODIFIER_NAME_oe_np_retinue_economies: "家兵成军"
 OE_NP_OTHER_STATUS: "[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.GetVariable('oe_np_rank').GetValue, '(CFixedPoint)6'), 'OE_NP_ESTABLISHED', 'OE_NP_MARGINAL')]"
 OE_NP_SCORE_BREAKDOWN: "#bold [Country.GetNameWithNoTooltip]#!\n排名：[Country.MakeScope.GetVariable('oe_np_rank').GetValue|0]　[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.GetVariable('oe_np_rank').GetValue, '(CFixedPoint)4'), 'OE_NP_POWERFUL', 'OE_NP_OTHER_STATUS')]\n总得分：#Y [Country.MakeScope.GetVariable('oe_np_total').GetValue|2]#!\n\n在世家族成员 × 1：[Country.MakeScope.GetVariable('oe_np_score_living').GetValue|2]\n罗马附庸年限 × 0.1：[Country.MakeScope.GetVariable('oe_np_score_tenure').GetValue|2]（[Country.MakeScope.GetVariable('oe_np_years').GetValue|2] 年）\n国库金币 × 0.005：[Country.MakeScope.GetVariable('oe_np_score_treasury').GetValue|2]\n东罗马内阁席位 × 20：[Country.MakeScope.GetVariable('oe_np_score_cabinet').GetValue|2]\n琼筵序次席位 × 25：[Country.MakeScope.GetVariable('oe_np_score_court').GetValue|2]\n东罗马陆海军统帅 × 5：[Country.MakeScope.GetVariable('oe_np_score_command').GetValue|2]\n每满 100 名现有士兵 × 1：[Country.MakeScope.GetVariable('oe_np_score_soldiers').GetValue|2]\n当今皇后出自本家 × 50：[Country.MakeScope.GetVariable('oe_np_score_consort').GetValue|2]\n政治影响力 × 0.2：[Country.MakeScope.GetVariable('oe_np_score_influence').GetValue|2]\n\n#italic 内阁与统帅任职只计东罗马本国。在世成员按本家王朝统计，不限居住国；统帅每人只计一次。附庸年限按实际从属记录折算，间接附庸取当前罗马从属链中最短的从属时长。所有得分来自同一次刷新。#!"
