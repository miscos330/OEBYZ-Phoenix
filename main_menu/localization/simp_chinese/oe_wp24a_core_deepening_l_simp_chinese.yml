 oe_wp24a_pref.1.t:0 "东方大区：安条克与黎凡特丝绸商脉"
 oe_wp24a_pref.1.d:0 "自安条克柱廊商市至阿勒颇、大马士革沙漠驿站，往来丝绸商队再度期盼罗马鹰旗庇护。东方近卫大区长官上奏请示：大区首要经略当偏重特许丝路商关，抑或优先充实边防要塞军仓？"
 oe_wp24a_pref.1.a:0 "敕立安条克丝路商关，兴盛黎凡特贸易"
 oe_wp24a_pref.1.b:0 "尽拔关税收归美索不达米亚边塞军务"
 oe_wp24a_pref.2.t:0 "东方大区：叙利亚与希腊边区协和"
 oe_wp24a_pref.2.d:0 "叙利亚与上美索不达米亚河谷聚居着叙利亚语工匠、阿拉伯部族与希腊市政贵族。东方军区将军奏称：严苛划一易滋边隙，若允双语市政协理则可收长治久安之效。"
 oe_wp24a_pref.2.a:0 "批准叙利亚—希腊边区双语市政协约"
 oe_wp24a_pref.2.b:0 "维持帝国直辖文官体制与教区一统"
 oe_wp24a_pref.3.t:0 "东方大区：美索不达米亚边防军区与元老院稽核"
 oe_wp24a_pref.3.d:0 "随着幼发拉底河渡口防线渐成规模，君士坦丁堡元老院要求稽核东方诸军区将军之军费开支。授将军以专断边权可固东疆防务，而令元老院共核财计则可安中枢法统。"
 oe_wp24a_pref.3.a:0 "授东方大区将军统摄美索不达米亚边防专权"
 oe_wp24a_pref.3.b:0 "设立元老院与大区长官联合稽核署"
 oe_wp24a_pref.4.t:0 "伊利里库姆大区：塞萨洛尼基与埃格纳提亚大道"
 oe_wp24a_pref.4.d:0 "西起亚得里亚海港、经塞萨洛尼基直通君士坦丁堡的埃格纳提亚古道已全线重归罗马版图。大区工官候旨修筑沿途驿站，使之兼通巴尔干商旅与大军疾驰之便。"
 oe_wp24a_pref.4.a:0 "重修埃格纳提亚大道商旅驿站"
 oe_wp24a_pref.4.b:0 "优先修筑通往多瑙河前线的军用驰道"
 oe_wp24a_pref.5.t:0 "伊利里库姆大区：多瑙河铁门要塞防线"
 oe_wp24a_pref.5.d:0 "多瑙河穿行铁门峡谷之处历来为北疆寇骑南渡要津。帝国筑城总管建议自贝尔格莱德顺流而下修筑连锁石堡与江防要塞，永锁巴尔干北门。"
 oe_wp24a_pref.5.a:0 "拨款兴建多瑙河铁门连锁要塞"
 oe_wp24a_pref.5.b:0 "依托塞萨洛尼基驿道机动驻军轮防"
 oe_wp24a_pref.6.t:0 "伊利里库姆大区：瓦拉几与斯拉夫军户安置"
 oe_wp24a_pref.6.d:0 "巴尔干山隘的瓦拉几牧民与斯拉夫边民愿以世袭兵役换取免税军户授田。地方大领主则联名向元老院陈情，反对割分乡野田庄削弱贵族权势。"
 oe_wp24a_pref.6.a:0 "敕准安置瓦拉几与斯拉夫世袭军户"
 oe_wp24a_pref.6.b:0 "安抚元老院勋贵并维持常规田赋征缴"
 oe_wp24a_pref.7.t:0 "意大利大区：拉文纳与迦太基双总督舰队基地"
 oe_wp24a_pref.7.d:0 "随着亚得里亚海滨之拉文纳与西西里海峡对岸之迦太基港重归鹰旗之下，意大利与阿非利加大区已扼住地中海咽喉。帝国海军提督奏请重修双总督船厂以为常驻舰队母港。"
 oe_wp24a_pref.7.a:0 "重修拉文纳与迦太基双总督船厂舰队"
 oe_wp24a_pref.7.b:0 "节减海防开支，优待意大利市政法统"
 oe_wp24a_pref.8.t:0 "意大利大区：卡皮托利罗马元老院共治协约"
 oe_wp24a_pref.8.d:0 "重聚卡皮托利山的罗马元老们虽共庆帝国中兴，仍恭请陛下颁订正式协约，明晰旧罗马与新罗马之间在市政司法、荣誉执政官与大区长官任免上的分权章程。"
 oe_wp24a_pref.8.a:0 "签署卡皮托利元老院分权共治协约"
 oe_wp24a_pref.8.b:0 "申明神圣禁卫府与皇帝统摄一切大权"
 oe_wp24a_pref.9.t:0 "意大利大区：西西里与阿非利加官粮船队"
 oe_wp24a_pref.9.d:0 "西西里与迦太基腹地的丰饶谷仓昔日曾养活帝国诸大都。意大利大区长官呈请重立官办安诺纳粮船编队并派战舰护航，借以平抑全境粮价，唯私商贩运利润将受节制。"
 oe_wp24a_pref.9.a:0 "重设西西里—迦太基官办运粮船队"
 oe_wp24a_pref.9.b:0 "标卖私商海运特许并扩充护航战舰"
 oe_wp24a_pref.10.t:0 "高卢大区：里昂、特里尔与莱茵河边防重筑"
 oe_wp24a_pref.10.d:0 "帝国勘察使巡行里昂与旧西都特里尔，重勘莱茵河畔罗马古烽燧遗迹。以特里尔为莱茵边防军枢可保西疆无虞，而重振里昂文治署衙则利于高卢诸省迅速归心。"
 oe_wp24a_pref.10.a:0 "以特里尔为前哨重筑莱茵河边防要塞"
 oe_wp24a_pref.10.b:0 "扩建里昂大区文署与市政议事机构"
 oe_wp24a_pref.11.t:0 "高卢大区：高卢罗马市政议事团与元老采邑"
 oe_wp24a_pref.11.d:0 "高卢、伊比利亚与莱茵兰乡绅名流联名请求恢复古典市政议事团旧制，愿自筹经费修缮官道并整编税册，以换取元老阶衔与地方法庭参审权。"
 oe_wp24a_pref.11.a:0 "恢复高卢罗马市政议事团共治旧制"
 oe_wp24a_pref.11.b:0 "委派皇室计官直征赋税，集权于中枢"
 oe_wp24a_pref.12.t:0 "高卢大区：大西洋海疆与西方大区军政总成"
 oe_wp24a_pref.12.d:0 "随着罗马鹰旗再度插向大西洋浩瀚海疆，高卢大区长官请设西方远洋海军总督并统筹诸省军区将军。若四大近卫大区皆已颁行宪章，全帝国更将共庆四区同轨之古典盛世重光。"
 oe_wp24a_pref.12.a:0 "敕设大西洋海防总督与西方诸军区"
 oe_wp24a_pref.12.b:0 "集中西方兵力固守莱茵河陆疆防线"
 oe_wp24a_teu.1.t:0 "1525年：大团长阿尔布雷希特世俗化普鲁士"
 oe_wp24a_teu.1.d:0 "宗教改革浪潮席卷波罗的海诸港与普鲁士红砖团堡。柯尼斯堡等级会议上，大团长阿尔布雷希特力主废除中世纪修会旧制，改建世俗世袭的普鲁士公国——宁冒教廷怒斥，亦要借新教行政改制开启近代强国之路。"
 oe_wp24a_teu.1.a:0 "改宗路德宗并正式建立世俗普鲁士公国"
 oe_wp24a_teu.1.b:0 "颁行温和世俗公国宪章，徐图教务过渡"
 oe_wp24a_teu.2.t:0 "普鲁士新政：世俗容克军事采邑"
 oe_wp24a_teu.2.d:0 "修会誓约既解，昔日骑士团管区长官与本土贵族纷请明晰团产归属。若将其改封为负有世袭军官义务的世俗容克采邑，便可铸就效忠公室的军事贵族，唯庄园农夫负担亦随之加重。"
 oe_wp24a_teu.2.a:0 "确立世俗容克贵族世袭军事采邑制"
 oe_wp24a_teu.2.b:0 "收归骑士团旧产为公室直辖官田"
 oe_wp24a_teu.3.t:0 "普鲁士文教：柯尼斯堡阿尔贝蒂娜大学落成"
 oe_wp24a_teu.3.d:0 "为向新生的世俗公国源源输送博学的新教牧师、法学家与财政干员，公爵倡议于柯尼斯堡兴建阿尔贝蒂娜大学，以人文学术与近代法政铸就波罗的海新教文教重镇。"
 oe_wp24a_teu.3.a:0 "拨款兴建柯尼斯堡阿尔贝蒂娜大学"
 oe_wp24a_teu.3.b:0 "节留公库资财，仅资助地方拉丁语学校"
 oe_wp24a_teu.4.t:0 "普鲁士军改：近代常备军纪与军官操典"
 oe_wp24a_teu.4.d:0 "置身波罗的海平原群雄环伺之间，世俗公国断难仅凭旧式封建征召立足。普鲁士元帅团呈上全新军制条例，推行军区征兵、军官考选与严苛步炮队列操典，誓以铁纪立国。"
 oe_wp24a_teu.4.a:0 "颁行普鲁士常备军纪与军官考选条例"
 oe_wp24a_teu.4.b:0 "依托容克骑兵采邑，节制常备军开支"
 oe_wp24a_teu.5.t:0 "1525年：圣母旗誓约与拒绝世俗化"
 oe_wp24a_teu.5.d:0 "正当新教布道者在波罗的海城镇奔走鼓吹之际，骑士团大会齐聚马尔堡穹顶大厅，在圣母旗前立下永世铁誓：条顿骑士团绝不沦为世俗封国，必将永作北方天主教会之利剑。"
 oe_wp24a_teu.5.a:0 "严守圣母旗誓约，重申永世天主教十字军团"
 oe_wp24a_teu.5.b:0 "坚守旧教修会法统，同时安抚普鲁士市民"
 oe_wp24a_teu.6.t:0 "永世骑士团：帝国与教廷志愿骑士北援"
 oe_wp24a_teu.6.d:0 "条顿骑士团拒绝对宗教改革妥协的捷报传遍罗马与神圣罗马帝国天主教诸侯宫廷。教廷特使颁行大赦，号召虔诚贵族志愿骑士再度披甲北上，投效黑十字旌旗之下。"
 oe_wp24a_teu.6.a:0 "接纳帝国与教廷志愿骑士编入团军"
 oe_wp24a_teu.6.b:0 "婉谢外籍骑士团编组，改请教廷拨付军饷"
 oe_wp24a_teu.7.t:0 "永世骑士团：加固波罗的海骑士团堡垒群"
 oe_wp24a_teu.7.d:0 "重型攻城火炮已令马尔堡与边疆红砖团堡的旧式城墙岌岌可危。来自意大利与帝国的天主教筑城名师愿以新式棱堡与炮台加固波罗的海骑士团堡垒群，将骑士团腹地化作坚不可摧的北方圣垒。"
 oe_wp24a_teu.7.a:0 "拨款将波罗的海骑士团堡垒群改建为新式棱堡"
 oe_wp24a_teu.7.b:0 "节用公帑，改以机动志愿骑兵巡防边境"
 oe_wp24a_teu.8.t:0 "永世骑士团：反宗教改革战斗修会新律"
 oe_wp24a_teu.8.d:0 "受特伦托公会议天主教复兴气象感召，大团长与教廷大使共同颁订条顿骑士团新律：熔修会铁律、反宗教改革传教热忱与近代长矛火枪操典于一炉，重塑令北欧震慑的战斗修会。"
 oe_wp24a_teu.8.a:0 "颁行反宗教改革战斗修会新律与铁纪操典"
 oe_wp24a_teu.8.b:0 "立足波罗的海堡垒防务，稳固修会根基"
 oe_wp24a_yuan.1.t:0 "达延汗忽里勒台：六万户重整大议"
 oe_wp24a_yuan.1.d:0 "漠北草原金帐之下，黄金家族诸王与宿将那颜齐誓息止连年部族内讧。效法达延汗大略，汗廷将蒙古诸部重整为左右翼六万户，再度在漠北确立令行禁止的统一号令。"
 oe_wp24a_yuan.1.a:0 "整编左右翼六万户，重振漠北骑兵大统"
 oe_wp24a_yuan.1.b:0 "高举鄂尔浑圣旗，以盟约缓和诸部纷争"
 oe_wp24a_yuan.2.t:0 "六万户劲旅：复合弓铁骑复兴"
 oe_wp24a_yuan.2.d:0 "秋高马肥之际，数以万计的官牧战马烙上各万户徽记。诸将日夜操演佯退诱敌、重甲铁骑突击与复合弓齐射之术，令六万户铁骑重现昔日横扫欧亚之锋芒。"
 oe_wp24a_yuan.2.a:0 "扩建官牧马群与复合弓铁骑常训"
 oe_wp24a_yuan.2.b:0 "偏重轻骑疾袭并充实草原牧税军资"
 oe_wp24a_yuan.3.t:0 "鄂尔浑圣旗与哈拉和林出师誓盟"
 oe_wp24a_yuan.3.d:0 "鄂尔浑河畔哈拉和林碑龟之前，宗王、喇嘛与诸部首领共举成吉思汗九纛圣旗。驿骑驰告漠北诸营：大元天命从未绝于草原，今日正是养精蓄锐、再振雄风之时。"
 oe_wp24a_yuan.3.a:0 "于哈拉和林高举九纛圣旗号召诸部"
 oe_wp24a_yuan.3.b:0 "先固漠北法度与冬营牧草储备"
 oe_wp24a_yuan.4.t:0 "誓师大都：天命重兴与铁骑南指"
 oe_wp24a_yuan.4.d:0 "无论策马南下居庸关誓复故都，抑或欢庆大汗旌旗再度飘扬于大都城垣之上，一股炽烈的中兴豪情席卷蒙古全境。攻城匠师与草原铁骑齐心效命，共赴大元重光之业。"
 oe_wp24a_yuan.4.a:0 "竭力推进大都光复与天命重兴大业"
 oe_wp24a_yuan.4.b:0 "预拟草原与中原并重之两都治理宪章"
 oe_wp24a_yuan.5.t:0 "两都巡幸：上都与大都共治新章"
 oe_wp24a_yuan.5.d:0 "为免重蹈昔日草原宗王与中原官僚离心之覆辙，朝议请立正式《两都共治宪章》，定上都夏宫会盟与中枢文治并举之制，兼得草原武功与长治文德。"
 oe_wp24a_yuan.5.a:0 "颁行上都—大都两都共治宪章"
 oe_wp24a_yuan.5.b:0 "仍以行营汗廷随六万户铁骑机动巡边"
 oe_wp24a_yuan.6.t:0 "站赤重明：大蒙古国欧亚驿道复兴"
 oe_wp24a_yuan.6.d:0 "数十年来，驿站废弛与诸部关隘阻隔了自大都、哈拉和林通往西方诸汗国的草原大道。如今大汗重铸金银牌符，准备重启万里站赤，邀钦察、察合台与波斯故道诸邦再续通好。"
 oe_wp24a_yuan.6.a:0 "重修欧亚大站赤并颁赐通使金牌"
 oe_wp24a_yuan.6.b:0 "节资重开内草原商旅驿站网络"
 oe_wp24a_yuan.7.t:0 "站赤西使：通好钦察金帐汗国（术赤兀鲁思）"
 oe_wp24a_yuan.7.d:0 "大汗专使携织锦与银牌沿北道草原抵达伏尔加—钦察诸营，与术赤兀鲁思诸王商议通好。若愿在礼仪与关税上互作礼让，便可重续钦察良骑交流并振兴欧亚北道商贸。"
 oe_wp24a_yuan.7.a:0 "互让礼仪关税，缔结术赤北道通好协约"
 oe_wp24a_yuan.7.b:0 "恪守宗主仪节，仅行马政武艺切磋"
 oe_wp24a_yuan.8.t:0 "站赤西使：察合台汗国丝路商旅盟约"
 oe_wp24a_yuan.8.d:0 "阿力麻里、喀什与撒马尔罕诸绿洲乃陆上丝绸之路的必经枢纽。西使察合台的专使呈议统筹护商兵马与关津票据，令商队与良马贩运畅行天山南北与河中沃土。"
 oe_wp24a_yuan.8.a:0 "批准察合台丝路商旅护卫与税关盟约"
 oe_wp24a_yuan.8.b:0 "径征边关商税，不予斡脱商队减免"
 oe_wp24a_yuan.9.t:0 "站赤西使：伊儿汗国故地与波斯诸邦通使"
 oe_wp24a_yuan.9.d:0 "自大不里士、巴格达至呼罗珊诸隘，波斯史册与星历馆犹记大元与伊儿汗国拖雷系兄弟同源之谊。与波斯当政诸邦重开通使驿站，可望再兴星历互鉴、火炮攻城交流与西亚丝路商市。"
 oe_wp24a_yuan.9.a:0 "拨款重设波斯通使驿馆与星历商贸往来"
 oe_wp24a_yuan.9.b:0 "仅遣武官使节互访，节省驿馆经费"
 oe_wp24a_yuan.10.t:0 "蒙古治世重光：四大汗国驿路通盟"
 oe_wp24a_yuan.10.d:0 "自鄂尔浑河牧场直至伏尔加河、撒马尔罕与伊朗高原，佩带大汗金牌的站赤信使再度畅行无阻。纵使西方诸部早已各立旗号，四大汗国主权通盟之盛举仍令大元声威重振欧亚，再启草原铁骑与万里丝路共荣之新纪元。"
 oe_wp24a_yuan.10.a:0 "昭告欧亚，宣布四大汗国通盟与蒙古治世重光"
 oe_wp24a_yuan.10.b:0 "务实重商，将通盟成果悉数化为丝路财税"
