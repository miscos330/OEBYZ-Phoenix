 oe_ilk.2.a: "许以贡赋和战船"
 oe_ilk.2.a.tt: "帖木儿对帝国好感#G +25#!，持续#Y 10#!年\n奥斯曼对帝国好感#R −20#!，持续#Y 10#!年\n京城若正被围：城心#G +8#!\n帝国若还是苏丹的臣属：苏丹的耐心#R −20#!\n日后帖木儿会来要这笔账"
 oe_ilk.2.b: "只回书，不立约"
 oe_ilk.2.b.tt: "帖木儿对帝国好感#G +10#!，持续#Y 5#!年\n京城若正被围：城心#G +3#!"
 oe_ilk.2.c: "把使者的来意告诉苏丹"
 oe_ilk.2.c.tt: "奥斯曼对帝国好感#G +15#!，持续#Y 5#!年\n帖木儿对帝国好感#R −20#!，持续#Y 10#!年\n帝国若还是苏丹的臣属：苏丹的耐心#G +15#!"
 oe_ilk.3.t: "海峡上的渡船"
 oe_ilk.3.desc_p_b: "#F 苏丹在安纳托利亚兵败被俘，奥斯曼大军溃散，残兵涌到海峡边上等船。相传帖木儿要皇帝用战船封住海峡；又相传意大利人的船收了钱，把突厥兵一船一船渡到了对岸。#!\n\n帝国许过帖木儿战船，帖木儿的使者来催了。岸边的突厥兵也在求渡，愿意出钱。我们押下的那位王子，人马也挤在岸边。"
 oe_ilk.3.desc_p: "#F 苏丹在安纳托利亚兵败被俘，奥斯曼大军溃散，残兵涌到海峡边上等船。相传帖木儿要皇帝用战船封住海峡；又相传意大利人的船收了钱，把突厥兵一船一船渡到了对岸。#!\n\n帝国许过帖木儿战船，帖木儿的使者来催了。岸边的突厥兵也在求渡，愿意出钱。"
