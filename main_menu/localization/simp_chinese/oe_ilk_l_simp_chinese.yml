 oe_ilk.2.t: "帖木儿的使者"
 oe_ilk.2.desc_b_r: "#F 帖木儿的大军打到了安纳托利亚的东边，同苏丹巴耶济德结下了仇。相传帖木儿派人到君士坦丁堡，要皇帝别同苏丹讲和；特拉比松的皇帝也被要求出兵相助。#!\n\n如今京城还被苏丹围着。帖木儿的使者是从佩拉那边绕进城来的，一位修士同行；佩拉的城墙上已经挂起了帖木儿的旗。据记载，札剌亦儿的苏丹和黑羊的首领逃到了奥斯曼人那里，帖木儿正为此发怒。"
