 STATIC_MODIFIER_NAME_oe_ilk_franks_gone: "西方商人离去"
 STATIC_MODIFIER_DESC_oe_ilk_franks_gone: "伊儿汗国分裂以后，各地屡次迫害西方商人。热那亚下令抵制大不里士，意大利人的商栈人去楼空。"
 STATIC_MODIFIER_NAME_oe_ilk_caravans_thin: "商队稀少"
 STATIC_MODIFIER_DESC_oe_ilk_caravans_thin: "从大不里士来的商队少了。西方商人离开波斯以后，经特拉比松出海的货也跟着少了。"
 STATIC_MODIFIER_NAME_oe_ilk_karanbuk: "卡兰比克的胜利"
 STATIC_MODIFIER_DESC_oe_ilk_karanbuk: "1343年秋，埃雷特纳在锡瓦斯与埃尔津詹之间的卡兰比克击败了出班家族派来的大军，从此独立在位。"
 STATIC_MODIFIER_NAME_oe_ilk_leaderless: "群龙无首"
 STATIC_MODIFIER_DESC_oe_ilk_leaderless: "1357年，金帐汗国的札尼别经希尔万南下，攻取大不里士，绞死了出班家族的马利克·阿什拉夫。出班的部众四散。"
 STATIC_MODIFIER_NAME_oe_ilk_tabriz_seat: "入主大不里士"
 STATIC_MODIFIER_DESC_oe_ilk_tabriz_seat: "金帐的大军北返以后，札剌亦儿的乌韦斯取了大不里士，失而复得，终于坐稳。从此札剌亦儿以苏丹自称。"
 STATIC_MODIFIER_NAME_oe_ilk_timur_favour: "帖木儿的封赏"
 STATIC_MODIFIER_DESC_oe_ilk_timur_favour: "白羊部在安卡拉一战中站在帖木儿一边，帖木儿随后把迪亚巴克尔一带赏给了白羊部。"
 STATIC_MODIFIER_NAME_oe_ilk_stranded: "困在亚洲的兵"
 STATIC_MODIFIER_DESC_oe_ilk_stranded: "安卡拉一战后，拜占庭的战船封住了海峡，溃散的奥斯曼兵困在亚洲一侧，回不到色雷斯。"
