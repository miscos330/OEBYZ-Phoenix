 oe_ilk.3.a: "封住海峡"
 oe_ilk.3.a.tt: "帖木儿对帝国好感#G +20#!，持续#Y 10#!年\n奥斯曼对帝国好感#R −20#!，持续#Y 10#!年\n困在亚洲的奥斯曼兵：奥斯曼得到[ShowModifier('oe_ilk_stranded')]，持续#Y 5#!年"
 oe_ilk.3.b: "收钱摆渡"
 oe_ilk.3.b.tt: "获得#G 2#!个月的贸易与税收收入\n奥斯曼对帝国好感#G +10#!，持续#Y 5#!年\n帖木儿对帝国好感#R −20#!，持续#Y 10#!年；帝国若许过帖木儿战船，改为#R −35#!\n押了王子时：所押王子的势#G +3#!"
 oe_ilk.3.c: "只渡我们押的那位王子的人"
 oe_ilk.3.c.tt: "获得#G 1#!个月的贸易与税收收入\n所押王子的势#G +6#!\n帖木儿对帝国好感#R −20#!，持续#Y 10#!年"
