 oe_ilk.1.t: "白羊的新娘"
 oe_ilk.1.desc_s: "#F 白羊部的突厥蛮人早年屡次袭扰特拉比松，1348年还围过城。1352年，皇帝阿莱克修斯三世把姐姐玛丽亚嫁给白羊首领图尔·阿里的儿子忽都鲁，换来了东南边境的太平。#!\n\n如今，特拉比松的使者到了京城：[GetCountry('TRE').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]要把一位皇女嫁到白羊部去，同[GetCountry('AQQ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]议和，来请帝国点头。把基督徒的皇女嫁给穆斯林的埃米尔，牧首区里已经有人皱眉。"
 oe_ilk.1.desc_k: "#F 白羊部的突厥蛮人早年屡次袭扰特拉比松，1348年还围过城。1352年，皇帝阿莱克修斯三世把姐姐玛丽亚嫁给白羊首领图尔·阿里的儿子忽都鲁，换来了东南边境的太平。#!\n\n如今，[GetCountry('TRE').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]写信来告知：特拉比松要把一位皇女嫁到白羊部去，同[GetCountry('AQQ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]议和。把基督徒的皇女嫁给穆斯林的埃米尔，牧首区里已经有人皱眉。"
 oe_ilk.1.desc_x: "#F 白羊部的突厥蛮人早年屡次袭扰特拉比松，1348年还围过城。1352年，皇帝阿莱克修斯三世把姐姐玛丽亚嫁给白羊首领图尔·阿里的儿子忽都鲁，换来了东南边境的太平。#!\n\n如今，消息从特拉比松传来：那里的宫廷要把一位皇女嫁到白羊部去，同[GetCountry('AQQ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]议和。把基督徒的皇女嫁给穆斯林的埃米尔，牧首区里已经有人皱眉。"
