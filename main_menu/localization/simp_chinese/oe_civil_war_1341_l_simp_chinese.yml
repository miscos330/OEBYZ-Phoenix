l_simp_chinese:
 OE_CW_ST_COMMUNE: "#G 热诚者自治#!"
 OE_CW_ST_KANTA: "#Y 坎塔库泽诺斯#!"
 OE_CW_ST_REGENCY: "#P 摄政政府#!"
 OE_CW_ST_FOREIGN: "外国"
 STATIC_MODIFIER_NAME_oe_cw_raided: "遭突厥人劫掠"
 STATIC_MODIFIER_NAME_oe_cw_zealot_guard: "热诚者守城"
 STATIC_MODIFIER_NAME_oe_cw_zealot_commune: "热诚者公社"
 STATIC_MODIFIER_NAME_oe_cw_joint_rule: "共治"
 STATIC_MODIFIER_NAME_oe_cw_scars: "内战的创伤"
 OE_CW_REBELS: "坎塔库泽诺斯派"
 OE_CW_REBELS_country: "坎塔库泽诺斯派"
 OE_CW_REBELS_country_adjective: "坎塔库泽诺斯派"
 oe_cw_war: "两约翰之战"
 oe_cw_war_desc: "约翰五世的摄政政府与迪迪莫泰洪拥立的约翰·坎塔库泽诺斯在争夺帝国。城里的百姓大多站在摄政一边，地主和军人大多站在坎塔库泽诺斯一边，外国势力在两边之间待价而沽。\n\n大势：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_tide').GetValue|0]#! / #Y 100#!（#Y 100#! = 坎塔库泽诺斯入城，#Y 0#! = 他兵败出家）　已打了 [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0] 个月\n大势每月随下面十座城的控制权变化（括号里是分量），外援也会推动它：\n君士坦丁堡（#Y 4#!）：[GetCountry('BYZ').Custom('OeCwCity_constantinople')]\n塞萨洛尼基（#Y 3#!）：[GetCountry('BYZ').Custom('OeCwCity_thessaloniki')]\n阿德里安波利斯（#Y 2#!）：[GetCountry('BYZ').Custom('OeCwCity_edirne')]\n迪迪莫泰洪（#Y 2#!）：[GetCountry('BYZ').Custom('OeCwCity_demotica')]\n塞莱（#Y 1#!）：[GetCountry('BYZ').Custom('OeCwCity_serres')]\n贝罗亚（#Y 1#!）：[GetCountry('BYZ').Custom('OeCwCity_veria')]\n锡林布里亚（#Y 1#!）：[GetCountry('BYZ').Custom('OeCwCity_silivri')]\n菲利普波利斯（#Y 1#!）：[GetCountry('BYZ').Custom('OeCwCity_plovdiv')]\n科莫蒂尼（#Y 1#!）：[GetCountry('BYZ').Custom('OeCwCity_komotini')]\n克里斯图波利斯（#Y 1#!）：[GetCountry('BYZ').Custom('OeCwCity_kavala')]\n\n坎塔库泽诺斯派控制君士坦丁堡满#Y 3#!个月，他就会入城称帝。打满#Y 6#!年，双方议和。"
 oe_cw.1.t: "旧疾复发"
 oe_cw.1.d: "皇帝的热病又发作了。这病跟了他多年，每次发作都比上一次更重。御医们说，若想多活几年，皇帝就得放下政务。"
 oe_cw.1.a: "照常理政"
 oe_cw.1.a.tt: "皇帝健康#R −4#!（归零即去世）"
 oe_cw.1.b: "静养一段时日"
 oe_cw.1.b.tt: "皇帝健康#R −3#!（归零即去世）"
 oe_cw.1.c: "遍召名医"
 oe_cw.1.c.tt: "皇帝健康#R −2#!（归零即去世）"
 oe_cw.2.t: "宫中对峙"
 oe_cw.2.d: "安德罗尼卡三世的灵柩还停在宫中，约翰·坎塔库泽诺斯已经派兵看住了宫门，守护[SCOPE.sCharacter('oe_cw_j5').GetAgeInYears]岁的约翰五世和太后安娜。他要求幼帝娶他的女儿海伦娜。牧首约翰·卡莱卡斯拿出#R 1334#!年先帝留下的文书，说摄政之位本该归他。"
 oe_cw.2.a: "许下这门婚事"
 oe_cw.2.a.tt: "裂痕#Y −15#!（到#Y 60#!就会开战）\n约翰五世与海伦娜·坎塔库泽妮订婚，成年后完婚"
 oe_cw.2.b: "请牧首裁断"
 oe_cw.2.b.tt: "裂痕#Y +10#!（到#Y 60#!就会开战）"
 oe_cw.2.c: "让禁军表态"
 oe_cw.2.c.tt: "裂痕#Y −5#!（到#Y 60#!就会开战）"
 oe_cw.3.t: "出征色雷斯"
 oe_cw.3.d: "杜尚的塞尔维亚人进了马其顿，萨鲁汗的突厥人在色雷斯沿岸劫掠，保加利亚的伊凡·亚历山大也在边境集结。坎塔库泽诺斯要领兵出城，把京城留给海军大公阿历克塞·阿波考科斯。"
 oe_cw.3.a: "给足军费，让他出征"
 oe_cw.3.a.tt: "裂痕#Y −5#!（到#Y 60#!就会开战）"
 oe_cw.3.b: "留他在京"
 oe_cw.3.b.tt: "裂痕#Y +5#!（到#Y 60#!就会开战）\n色雷斯各地遭劫掠（#Y 3#!年）"
 oe_cw.4.t: "阿波考科斯的图谋"
 oe_cw.4.d: "8月末，阿波考科斯企图劫走幼帝，事败后逃进他在埃皮巴泰的堡垒，被禁军围住。坎塔库泽诺斯正从色雷斯赶回来。"
 oe_cw.4.a: "拘押他"
 oe_cw.4.a.tt: "裂痕#Y −15#!（到#Y 60#!就会开战）\n阿波考科斯退出政坛"
 oe_cw.4.b: "宽恕他，官复原职"
 oe_cw.4.b.tt: "裂痕#Y +10#!（到#Y 60#!就会开战）"
 oe_cw.4.c: "默许他的所作所为"
 oe_cw.4.c.tt: "裂痕#Y +20#!（到#Y 60#!就会开战）"
 oe_cw.5.t: "公敌诏令"
 oe_cw.5.d: "趁坎塔库泽诺斯再度离京，阿波考科斯拉拢了加巴拉斯、乔姆诺斯等权贵，牧首拟好诏令：撤去坎塔库泽诺斯的一切职务，宣布他为公敌，牧首自任摄政。诏令只差太后的同意。"
 oe_cw.5.a: "同意诏令"
 oe_cw.5.a.tt: "裂痕#Y +25#!（到#Y 60#!就会开战）\n抄没坎塔库泽诺斯的庄园；他的母亲狄奥多拉被软禁"
 oe_cw.5.b: "压下诏令"
 oe_cw.5.b.tt: "[oe_tu_authority|e]#R −5#!\n裂痕#Y −15#!（到#Y 60#!就会开战）"
 oe_cw.5.c: "召开御前会议调停"
 oe_cw.5.c.tt: "裂痕#Y −10#!（到#Y 60#!就会开战）"
 oe_cw.6.t: "迪迪莫泰洪称帝"
 oe_cw.6.d: "10月26日，坎塔库泽诺斯的军队和投奔他的地主们在迪迪莫泰洪拥立他为皇帝。他仍把约翰五世和安娜的名字放在自己前面，可帝国已经有了两个皇帝。"
 oe_cw.6.a: "内战开始了"
 oe_cw.6.a.tt: "坎塔库泽诺斯率迪迪莫泰洪和色雷斯乡间起兵，局势“两约翰之战”开始"
 oe_cw.7.t: "共治之约"
 oe_cw.7.d: "裂痕终究没有扩大。太后与坎塔库泽诺斯在宫中议定：由他摄政辅佐幼帝，海伦娜将来嫁给约翰五世。帝国免于一场内战。"
 oe_cw.7.a: "愿和睦长久"
 oe_cw.7.a.tt: "坎塔库泽诺斯摄政；约翰五世与海伦娜订婚；获得“共治”#Y 10#!年"
 oe_cw.8.t: "民众驱逐贵族"
 oe_cw.8.d: "消息传开的第二天，阿德里安波利斯的民众冲进贵族的宅邸，把他们赶出了城。色雷斯和马其顿的城镇正在一个接一个效仿：在百姓眼里，“坎塔库泽诺斯派”就是豪强的同义词。"
 oe_cw.8.a: "顺势而为"
 oe_cw.8.a.tt: "大势#Y −5#!（有利于摄政政府）\n所有军区忠诚#R −5#!（豪强出身的将军们心生不满，计入忠诚目标#Y 5#!年）"
 oe_cw.8.b: "约束暴民"
 oe_cw.8.b.tt: "#Y 50%#!：阿德里安波利斯的贵族守住了城，倒向坎塔库泽诺斯"
 oe_cw.9.t: "军区站队"
 oe_cw.9.d: "帝国陷入内战泥潭，各省军区的将军们纷纷勒马观望，在忠义与私利之间反复权衡。恪守誓言、忠于皇室的将领已经点齐兵马星夜驰援京师，而那些素怀怨望、心存异志的军区长官却正暗中派信使赶往迪迪莫泰洪，准备倒向叛党一方。"
 oe_cw.9.a: "赦免动摇者，把他们留下"
 oe_cw.9.a.tt: "[oe_tu_authority|e]#R −5#!\n“离心”军区忠诚#G +15#!（计入忠诚目标#Y 5#!年），留在帝国一边\n“叛意”军区下月起兵，投奔坎塔库泽诺斯\n每个“忠贞”军区为帝国带来#Y 2#!个月人力"
 oe_cw.9.b: "任其去留"
 oe_cw.9.b.tt: "“离心”和“叛意”军区下月起兵，投奔坎塔库泽诺斯\n每个“忠贞”军区为帝国带来#Y 2#!个月人力"
 oe_cw.10.t: "囚禁中的狄奥多拉"
 oe_cw.10.d: "坎塔库泽诺斯的母亲狄奥多拉仍被软禁在京城，衣食短缺，身体一天不如一天。坎塔库泽诺斯每次派来的使者，第一句话都是问她的近况。"
 oe_cw.10.a: "放她出城"
 oe_cw.10.a.tt: "大势#Y −5#!（有利于摄政政府）\n和谈的大门保持敞开"
 oe_cw.10.b: "继续关押"
 oe_cw.10.b.tt: "狄奥多拉死于囚中；坎塔库泽诺斯从此不再提和谈"
 oe_cw.11.t: "热诚者守城"
 oe_cw.11.d: "塞萨洛尼基的总督想把城献给坎塔库泽诺斯，码头上的水手行会和城中的“热诚者”抢先一步，赶走了他和亲坎塔库泽诺斯的贵族。圣德米特里节时皇帝替行会说过话，他们记着这份情。"
 oe_cw.11.a: "塞萨洛尼基是皇帝的城"
 oe_cw.11.a.tt: "大势#Y −10#!（有利于摄政政府）\n塞萨洛尼基获得“热诚者守城”（#Y 8#!年）"
 oe_cw.12.t: "热诚者公社"
 oe_cw.12.d: "塞萨洛尼基的“热诚者”赶走了贵族，自己选出执政官，以约翰五世的名义治理全城。他们不听坎塔库泽诺斯的，也不太听京城的：地主的庄园被分掉，富人的房子被烧。"
 oe_cw.12.a: "承认他们的自治"
 oe_cw.12.a.tt: "塞萨洛尼基成为热诚者公社，直到战后收服（不计入任何一方的大势）"
 oe_cw.12.b: "派兵镇压"
 oe_cw.12.b.tt: "#Y 50%#!：镇压成功；#R 50%#!：失败，塞萨洛尼基仍成为热诚者公社"
 oe_cw.13.t: "投奔杜尚"
 oe_cw.13.d: "坎塔库泽诺斯在塞莱城下败退，身边只剩几百人。他逃进塞尔维亚，在普里什蒂纳附近见到了斯特凡·杜尚。杜尚的贵族们劝他出兵，条件是打下的城都归塞尔维亚。"
 oe_cw.13.a: "坎塔库泽诺斯有了新盟友"
 oe_cw.13.a.tt: "大势#Y +10#!（有利于坎塔库泽诺斯）\n塞尔维亚站在坎塔库泽诺斯一边，并夺走马其顿边境最多#Y 2#!处地方"
 oe_cw.14.t: "贝罗亚开城"
 oe_cw.14.d: "塞尔维亚人围了贝罗亚几个月，城里人却只肯向坎塔库泽诺斯本人投降。杜尚的人白忙一场，塞尔维亚宫廷里已经有人说，坎塔库泽诺斯的势力不该再帮下去了。"
 oe_cw.14.a: "拿边城换杜尚倒戈"
 oe_cw.14.a.tt: "大势#Y −10#!（有利于摄政政府）\n塞尔维亚改与摄政政府结盟，再拿走马其顿边境最多#Y 2#!处地方"
 oe_cw.14.b: "不理会"
 oe_cw.15.t: "乌穆尔的舰队"
 oe_cw.15.d: "艾登的埃米尔乌穆尔是坎塔库泽诺斯的老朋友。他带着#Y 300#!艘船驶入埃夫罗斯河，解了迪迪莫泰洪之围，然后在色雷斯乡间劫掠了好几个月。"
 oe_cw.15.a: "只能硬扛"
 oe_cw.15.b: "向教皇求援"
 oe_cw.15.b.tt: "太后允诺教会服从罗马；约半年后，拉丁人的十字军会进攻乌穆尔的港口士麦那"
 oe_cw.16.t: "士麦那十字军"
 oe_cw.16.d: "教皇、威尼斯、罗得骑士团和塞浦路斯组成的联合舰队攻下了士麦那的港口。乌穆尔匆匆带着主力回去救援，坎塔库泽诺斯失去了最得力的盟友。"
 oe_cw.16.a: "天助我也"
 oe_cw.16.a.tt: "大势#Y −5#!（有利于摄政政府）\n乌穆尔不再援助坎塔库泽诺斯"
 oe_cw.17.t: "典当皇冠珠宝"
 oe_cw.17.d: "国库空了，突厥人的劫掠又让京城缺粮。威尼斯人愿意出#Y 30000#!杜卡特，条件是帝国的皇冠珠宝押在他们的金库里。"
 oe_cw.17.a: "押给威尼斯"
 oe_cw.17.a.tt: "皇冠珠宝从此留在威尼斯"
 oe_cw.17.b: "宁可挨饿"
 oe_cw.18.t: "保加利亚的价码"
 oe_cw.18.d: "保加利亚的伊凡·亚历山大愿意出兵对付坎塔库泽诺斯，价码是菲利普波利斯和埃夫罗斯河北岸的几座城。"
 oe_cw.18.a: "答应他"
 oe_cw.18.a.tt: "大势#Y −10#!（有利于摄政政府）\n菲利普波利斯和北色雷斯最多#Y 2#!处地方割让给保加利亚\n保加利亚出兵#Y 2#!年（每月大势#Y −1#!）"
 oe_cw.18.b: "拒绝"
 oe_cw.19.t: "罗多彼的山贼"
 oe_cw.19.d: "莫姆奇尔原是山贼，坎塔库泽诺斯封他守梅罗佩。如今他在罗多彼山里拥兵五千，谁出价高就替谁打仗。"
 oe_cw.19.a: "收买他"
 oe_cw.19.a.tt: "莫姆奇尔为摄政政府而战（每月大势#Y −0.5#!）"
 oe_cw.19.b: "不理会"
 oe_cw.19.b.tt: "莫姆奇尔在山里自立"
 oe_cw.20.t: "佩里托里昂之战"
 oe_cw.20.d: "7月7日，坎塔库泽诺斯和乌穆尔的大军在佩里托里昂城下追上了莫姆奇尔。城里人关上城门，不让他进去。山贼的军队被冲散，莫姆奇尔战死。"
 oe_cw.20.a: "山里又安静了"
 oe_cw.20.a.tt: "莫姆奇尔战死；若他为摄政政府而战，大势#Y +5#!"
 oe_cw.21.t: "守将倒戈"
 oe_cw.21.d: "阿德里安波利斯的总督曼努埃尔·阿波考科斯——海军大公的亲生儿子——派人与坎塔库泽诺斯联络。和他一起动摇的，还有将军约翰·瓦塔泽斯。"
 oe_cw.21.a: "加官进爵，把人留住"
 oe_cw.21.a.tt: "[oe_tu_authority|e]#R −3#!"
 oe_cw.21.b: "任其离去"
 oe_cw.21.b.tt: "大势#Y +5#!（有利于坎塔库泽诺斯）\n阿德里安波利斯归坎塔库泽诺斯"
 oe_cw.22.t: "阿波考科斯之死"
 oe_cw.22.d: "6月11日，海军大公去视察他为政敌新修的监狱，没带卫兵。囚犯们拿起工地上的工具把他打死了。摄政政府失去了顶梁柱。"
 oe_cw.22.a: "摄政政府失去了顶梁柱"
 oe_cw.22.a.tt: "大势#Y +10#!（有利于坎塔库泽诺斯）"
 oe_cw.23.t: "萨鲁汗的雇佣兵"
 oe_cw.23.d: "海峡对岸的萨鲁汗埃米尔遣使前来，表示愿意派出#Y 6000#!名久经战阵的安纳托利亚骑兵渡海为摄政政府效命，且开出的雇佣价码颇为低廉。这支生力军足以迅速扭转眼前的战场局势，只是引异族佣兵入境，素来如饮鸩止渴。"
 oe_cw.23.a: "雇用他们"
 oe_cw.23.a.tt: "#Y 70%#!：他们劫掠色雷斯后投了坎塔库泽诺斯（大势#Y +10#!，色雷斯遭劫掠#Y 3#!年）\n#Y 30%#!：他们真的替我们打仗（大势#Y −10#!）"
 oe_cw.23.b: "拒绝"
 oe_cw.24.t: "奥尔汗求亲"
 oe_cw.24.d: "奥斯曼的奥尔汗派使者到坎塔库泽诺斯营中，求娶他的女儿狄奥多拉。这门亲事一成，奥斯曼的军队就会渡海来援。"
 oe_cw.24.a: "重金请奥尔汗中立"
 oe_cw.24.a.tt: "奥尔汗保持中立"
 oe_cw.24.b: "无力阻止"
 oe_cw.24.b.tt: "大势#Y +15#!（有利于坎塔库泽诺斯）\n狄奥多拉在锡林布里亚嫁给奥尔汗；奥斯曼援军渡海（每月大势#Y +1.5#!）\n奥斯曼人从此在欧洲有了立足点"
 oe_cw.25.t: "圣索菲亚的穹顶"
 oe_cw.25.d: "前些年的地震震裂了圣索菲亚大教堂的穹顶，裂缝一直没能修好。5月19日，东面的大拱连同一部分穹顶终于轰然坍塌。京城里的人都说，这是上帝对这场内战的审判。"
 oe_cw.25.a: "出钱修缮"
 oe_cw.25.b: "无力修缮"
 oe_cw.26.t: "热那亚人夺岛"
 oe_cw.26.d: "热那亚的西莫内·维尼奥索带着舰队出现在希俄斯外海。帝国的舰队都在打内战，岛上的守军撑不了多久。"
 oe_cw.26.a: "出钱守住"
 oe_cw.26.b: "接受损失"
 oe_cw.26.b.tt: "希俄斯和福西亚归热那亚"
 oe_cw.27.t: "修士带来的和议"
 oe_cw.27.d: "坎塔库泽诺斯派了几位方济各会修士进京，带来和议：他做主皇帝十年，之后与约翰五世平起平坐；海伦娜嫁给约翰五世；双方大赦。"
 oe_cw.27.a: "接受和议"
 oe_cw.27.a.tt: "内战以和约结束"
 oe_cw.27.b: "拒绝"
 oe_cw.27.b.tt: "两年内不再有和议"
 oe_cw.28.t: "金门洞开"
 oe_cw.28.d: "2月2日夜里，城中的支持者打开了废弃多年的金门。坎塔库泽诺斯带着一千人进城，第二天早上围住了布拉赫奈宫。太后坚持了几天，最后约翰五世劝母亲接受了条件：坎塔库泽诺斯做主皇帝十年，之后与约翰五世共治；海伦娜嫁给约翰五世；双方大赦。"
 oe_cw.28.a: "约翰六世登基"
 oe_cw.28.a.tt: "坎塔库泽诺斯成为皇帝约翰六世；约翰五世为继承人并迎娶海伦娜；双方大赦"
 oe_cw.29.t: "退隐阿索斯山"
 oe_cw.29.d: "坎塔库泽诺斯的军队散了，盟友走了。他脱下紫袍，去阿索斯山做了修士。帝国保住了约翰五世的皇位，可色雷斯已是满目疮痍。"
 oe_cw.29.a: "帝国属于约翰五世"
 oe_cw.29.a.tt: "坎塔库泽诺斯出家，其家族影响力#Y −200#!；合法性上升"
 oe_cw.30.t: "迟来的和约"
 oe_cw.30.d: "双方都打不动了。和约的条款与几年前坎塔库泽诺斯提出的几乎一样：他辅政，海伦娜嫁给约翰五世，双方大赦。后来的史家说，同样的条件五年前就能谈成，帝国本可以少受许多苦。"
 oe_cw.30.a: "总算结束了"
 oe_cw.30.a.tt: "坎塔库泽诺斯辅政；约翰五世与海伦娜订婚；双方大赦"
 oe_cw.31.t: "塞萨洛尼基归顺"
 oe_cw.31.d: "内战结束一年后，热诚者的首领们一个个出逃或被捕，安德烈亚斯·巴列奥略进了阿索斯山的修道院。塞萨洛尼基重新向京城派来的总督敞开了城门。"
 oe_cw.31.a: "城市回来了"
 oe_cw.31.a.tt: "塞萨洛尼基的热诚者公社结束"
