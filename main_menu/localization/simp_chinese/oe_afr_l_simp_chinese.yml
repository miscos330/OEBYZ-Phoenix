 oe_afr_cab_trans_saharan_gold_salt_action_progress_long_wordier: "塔加扎—廷巴克图盐金商道护航生效中"
 oe_afr_cab_trans_saharan_gold_salt_action_progress_tooltip: "提升黄金与食盐产出、陆路贸易效率与月度控制力，保障萨赫勒国库稳定。"
 oe_afr_cab_monsoon_dhow_patrol: "印度洋季风三角帆巡航护商"
 oe_afr_cab_monsoon_dhow_patrol_desc: "派遣熟悉季风洋流的斯瓦希里巡海使节统筹蒙巴萨、基尔瓦与索法拉沿岸的武装三角帆巡航，震慑海盗并反制外来通行税封锁。"
 oe_afr_cab_monsoon_dhow_patrol_action: "$oe_afr_cab_monsoon_dhow_patrol$"
 oe_afr_cab_monsoon_dhow_patrol_active: "正在执行印度洋季风三角帆巡航"
 oe_afr_cab_monsoon_dhow_patrol_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('global_maritime_presence_modifier')]"
 oe_afr_cab_monsoon_dhow_patrol_action_progress_wordier: "印度洋季风三角帆巡航护商生效中"
 oe_afr_cab_monsoon_dhow_patrol_action_progress_long_wordier: "印度洋季风三角帆巡航护商生效中"
 oe_afr_cab_monsoon_dhow_patrol_action_progress_tooltip: "提升海权存在、海上贸易效率、商人力量与海军士气，守护东非季风航道。"
 oe_afr_cb_swahili_monsoon_liberation: "斯瓦希里季风驱逐封锁"
 oe_afr_cb_swahili_monsoon_liberation_PROV: "驱逐斯瓦希里海岸与索法拉的外来卡塔兹封锁势力"
 oe_afr_cb_swahili_monsoon_liberation_desc: "外来欧陆强权在基尔瓦、索法拉与斯瓦希里沿岸筑堡强征卡塔兹通行税，扼杀印度洋季风自由贸易。斯瓦希里诸邦得以正当开战，重夺东非珊瑚港埠与黄金商道。"
 OE_AFR_MONSOON_LEAGUE_REASON: "斯瓦希里反卡塔兹季风海盟已缔结"
 OE_AFR_CARTAZ_BREACH_REASON: "印度洋卡塔兹通行税封锁生效"
 oe_afr_player_only_tt: "只有玩家操控的国家可以使用"
 oe_afr_art_mashafa_berhan: "《光明之书》（Mashafa Berhan）"
 oe_afr_art_mashafa_berhan_desc: "扎拉·雅各布皇帝于 1456 年以古典吉兹语亲撰的神学与王法总典，奠定埃塞俄比亚正教会德布雷米特马克和解与所罗门王权法统。"
 oe_afr_art_timbuktu_chronicles: "《廷巴克图桑科雷大编年》"
 oe_afr_art_timbuktu_chronicles_desc: "汇集廷巴克图桑科雷大学星象历算、马立克教法注疏与尼日尔河诸帝王事迹的珍稀羊皮卷手稿集成。"
 oe_afr_art_saharan_astronomy_zij: "《撒哈拉星象历算全图》"
 oe_afr_art_saharan_astronomy_zij_desc: "廷巴克图经师与跨撒哈拉学术商队合力编校的天文星表，贯通西非、马格里布与地中海科学传统。"
 oe_afr_art_gondar_fasil_ghebbi: "贡德尔法西尔皇城石堡图志"
 oe_afr_art_gondar_fasil_ghebbi_desc: "铭记贡德尔石城王宫建筑与高地圣像艺术中兴的皇室绘卷。"
 oe_afr_art_husuni_kubwa_palace: "胡苏尼·库布瓦珊瑚石宫海图碑"
 oe_afr_art_husuni_kubwa_palace_desc: "镌刻东北与西南双季风航期、索法拉金路与印度洋星位航标的基尔瓦皇室珊瑚石纪念碑。"
 oe_afr_dec_council_debre_mitmaq.title: "召开德布雷米特马克公会议与颁布《光明之书》"
 oe_afr_dec_council_debre_mitmaq.desc: "效法扎拉·雅各布皇帝于 1450 年召集尤斯塔修斯派与亚历山大派高僧大会，终结双安息日教争并颁布吉兹语《光明之书》传世名作，重铸高地正统信仰与王权凝聚力。"
 oe_afr_dec_council_debre_mitmaq.a: "颁布《光明之书》，弥合高地教会裂痕"
 oe_afr_dec_prester_john_embassy.title: "派遣「祭司王约翰」跨红海使团"
 oe_afr_dec_prester_john_embassy.desc: "跨越红海向君士坦丁堡、罗马或里斯本派遣高地皇使，缔结「祭司王约翰」跨洲基督教协定。若正教会已达成迦克墩东方正统教和解，协定将直接升格为神圣火枪援盟！"
 oe_afr_dec_prester_john_embassy.a: "遣使跨越红海，缔结跨洲神圣协定"
 oe_afr_dec_askia_sankore_charter.title: "颁布阿斯基亚大帝桑科雷学术宪章"
 oe_afr_dec_askia_sankore_charter.desc: "敕封廷巴克图桑科雷大学免税教产与抄本特许，开启萨赫勒学术黄金时代并录入传世手稿。若本国已完成撒哈拉学术商队远征，将额外引发跨洲手稿与科研双倍爆发！"
 oe_afr_dec_askia_sankore_charter.a: "敕封桑科雷大经学院，开启黄金时代"
 oe_afr_dec_tondibi_arquebus_corps.title: "组建汤迪比撒赫勒火绳枪近卫军团"
 oe_afr_dec_tondibi_arquebus_corps.desc: "重金延聘地中海火器工匠，在塔加扎—汤迪比—加奥沿线构筑沙漠火炮阵地与常备火绳枪近卫营，彻底打破跨撒哈拉火药远征的技术压制！"
 oe_afr_dec_tondibi_arquebus_corps.a: "推行火绳枪军改，筑垒镇守尼日尔河湾"
 oe_afr_dec_sofala_zimbabwe_corridor.title: "贯通大津巴布韦—索法拉—基尔瓦黄金走廊"
 oe_afr_dec_sofala_zimbabwe_corridor.desc: "统合大津巴布韦花岗岩金矿产区、索法拉转运港与基尔瓦·基西瓦尼皇室铸币厂，以统一商法与护商驿道畅通东非黄金象牙大动脉。"
 oe_afr_dec_sofala_zimbabwe_corridor.a: "贯通内陆金矿与珊瑚港埠黄金大动脉"
 oe_afr_dec_swahili_counter_cartaz.title: "缔结斯瓦希里反卡塔兹季风海盟"
 oe_afr_dec_swahili_counter_cartaz.desc: "号召基尔瓦、蒙巴萨、马林迪、桑给巴尔与大津巴布韦组建重炮三角帆反封锁舰队，驱逐欧陆强权在东非强征的卡塔兹通行税；若印度洋迪乌抗葡同盟已立，自动共享跨洋舰队协同！"
 oe_afr_dec_swahili_counter_cartaz.a: "高扬季风战帆，誓破卡塔兹海权封锁"
 oe_afr.1.title: "1450 德布雷米特马克公会议与《光明之书》"
 oe_afr.1.desc: "百年来，尤斯塔修斯派修院坚守周六与周日双安息日，与亚历山大派主教格格不入，令埃塞俄比亚高地教务与王权屡生裂痕。今岁皇帝在德布雷米特马克召集全境大修院与主教团共商大计，并拟亲以古典吉兹语编纂《光明之书》（Mashafa Berhan），一举确立所罗门帝国的信仰与法统根基。"
 oe_afr.1.a: "弥合双安息日裂痕，颁布《光明之书》并立合一教派"
 oe_afr.1.b: "借公会议强化皇室古尔特税权与高地军屯"
 oe_afr.2.title: "1445 戈米特战役与切瓦御林军团"
 oe_afr.2.desc: "红海低地的伊法特与阿达尔苏丹国频频越岭袭扰绍阿边陲，企图切断所罗门王朝通往海港的商路。皇帝亲率世袭切瓦（Chewa）御林军团疾驰下山，在戈米特河谷布下重甲长矛阵迎头痛击低地联军，誓将高地之盾铸为进攻之矛。"
 oe_afr.2.a: "切瓦精锐决战戈米特，扬威非洲之角！"
 oe_afr.2.b: "沿绍阿与拉利贝拉山口广筑天险堡垒，以逸待劳"
 oe_afr.3.title: "岩凿圣殿与安巴高地修院网"
 oe_afr.3.desc: "从拉利贝拉整块赤岩雕凿的十字圣堂，到德布雷利巴诺斯云雾缭绕的经院，高地修院既是吉兹语典籍的庇护所，也是维系偏远行省向心力的精神锁钥。大修院院长们联名上书，请求皇室重申敕田与抄经资助。"
 oe_afr.3.a: "赐予修院敕田与吉兹语抄经专款"
 oe_afr.3.b: "征调修院余粮充实高地军屯粮仓"
 oe_afr.4.title: "跨越红海的「祭司王约翰」皇使"
 oe_afr.4.desc: "自 1441 年埃塞俄比亚修士现身佛罗伦萨公会议以来，地中海与大西洋基督教宫廷盛传红海彼岸雄踞着传奇君王「祭司王约翰」的富饶帝国。今朝使节携黄金十字架与国书北上，叩响君士坦丁堡、罗马与里斯本的大门，共谋火器技术与红海联防。"
 oe_afr.4.a: "缔结「祭司王约翰」跨红海协定，引入火绳枪与工匠"
 oe_afr.4.b: "仅以商贸礼节往来，严守高地独立自主"
 oe_afr.5.title: "1529 艾哈迈德·加齐的红海火炮风暴"
 oe_afr.5.desc: "来自哈拉尔与泽拉的阿达尔名将「左撇子」艾哈迈德·伊本·易卜拉欣·加齐获得红海输入的新式火绳枪与轻型青铜炮，率大军翻越裂谷直扑埃塞俄比亚高地！烽火燃遍绍阿与阿克苏姆，所罗门帝国迎来存亡攸关的血火考验。"
 oe_afr.5.a: "急召跨红海火枪援军，凭险反击夺回高地主动权！"
 oe_afr.5.b: "坚壁清野退守安巴绝壁，以高地游击耗干敌军火药"
 oe_afr.6.title: "贡德尔石城与高地文艺复兴"
 oe_afr.6.desc: "历经数代游巡皇帐征战，所罗门君主终在塔纳湖北岸的贡德尔选定永固皇都。融合阿克苏姆石工与红海拱廊的法西尔皇城拔地而起，高地咖啡、乳香与手绘圣像随商队远播红海彼岸。"
 oe_afr.6.a: "大兴法西尔石城与圣像画院，铭刻贡德尔盛世"
 oe_afr.6.b: "将咖啡与乳香专卖盈余尽数充盈国库"
 oe_afr.7.title: "阿斯基亚大帝与桑科雷大学黄金时代"
 oe_afr.7.desc: "阿斯基亚·穆罕默德一世朝觐麦加归来，在尼日尔河畔重塑集权官僚与司法秩序，并向廷巴克图桑科雷大学广赐免税田产与跨撒哈拉纸张供应。来自开罗、非斯与豪萨诸邦的数万学子云集庭院，在金色夕照下研读天文、医学与马立克教法手稿。"
 oe_afr.7.a: "颁布桑科雷大宪章，开启萨赫勒学术黄金时代！"
 oe_afr.7.b: "重用商法公证官整顿廷巴克图与杰内市税"
 oe_afr.8.title: "塔加扎盐砖与旺加拉黄金驼队"
 oe_afr.8.desc: "在炽烈的撒哈拉腹地，塔加扎（Taghaza）出产的整块岩盐比黄金更为珍贵；南方的旺加拉与布雷金矿则源源不断地将金砂送往瓦拉塔、廷巴克图与杰内。只要商道安宁、驼铃不断，尼日尔河诸帝王便坐拥令地中海垂涎的巨富。"
 oe_afr.8.a: "派驻骑兵护卫塔加扎盐井与尼日尔金市"
 oe_afr.8.b: "减免商队过境税，吸引马格里布书商与工匠南下"
 oe_afr.9.title: "尼日尔河常备舟师与河港行省制"
 oe_afr.9.desc: "全长数千里的尼日尔河大拐弯是萨赫勒帝国的天然动脉。效法桑尼·阿里与阿斯基亚水陆并举之策，朝廷在加奥、廷巴克图与杰内编练常备战舟水师，设「希科伊」（Hi-Koi）水师提督总领漕运与闪电渡河作战。"
 oe_afr.9.a: "编练希科伊尼日尔河常备战舟纵队"
 oe_afr.9.b: "以河运船队优先转运杰内粮米与市舶货物"
 oe_afr.10.title: "1591 汤迪比战役：横穿撒哈拉的火绳枪！"
 oe_afr.10.desc: "摩洛哥萨阿德王朝帕夏朱达尔率数千装备欧陆火绳枪与轻型青铜炮的远征军，奇迹般穿越死亡大漠直抵尼日尔河畔的汤迪比（Tondibi）！白烟翻滚间，古老的盾牌与铁甲骑兵遭遇前所未有的火药骤雨——萨赫勒帝国站在盛衰分水岭上！"
 oe_afr.10.a: "倾国库急延奥斯曼与地中海火器匠，立桑海火绳枪近卫军团破敌！"
 oe_afr.10.b: "以传统骑步大阵硬撼火炮齐射，血战汲取教训"
 oe_afr.11.title: "尼日尔火药近卫的凯歌"
 oe_afr.11.desc: "汤迪比的硝烟非但没有折断尼日尔河帝国的脊梁，反而淬炼出一支令北非与大西洋列强刮目相看的现代化火药劲旅。装备齐射火绳枪与骆驼挽炮的萨赫勒方阵在加奥与廷巴克图校场列队受阅，宣告西非大帝国昂首步入火药时代。"
 oe_afr.11.a: "将火绳枪与野战炮操典定为帝国永制"
 oe_afr.11.b: "扩建加奥与廷巴克图铸炮工坊，充实军备财政"
 oe_afr.12.title: "跨撒哈拉手稿商队与星象互鉴"
 oe_afr.12.desc: "满载威尼斯纸张、开罗星表与安达卢西亚古籍的学术商队跨越撒哈拉抵达廷巴克图，又将桑科雷学者的历史编年、历算注疏与医学抄本带往地中海与君士坦丁堡。书香穿越黄沙，萨赫勒与旧大陆各文明在纸页间遥相呼应。"
 oe_afr.12.a: "设立皇室手稿译校馆，全面吸纳跨洲新学"
 oe_afr.12.b: "向来访商队征收典籍税并广印实用商法手册"
 oe_afr.13.title: "大津巴布韦与索法拉的黄金走廊"
 oe_afr.13.desc: "南部高原花岗岩巨石城池采掘的赤金与象牙，沿着古老河谷商道源源不断运抵索法拉港，再由基尔瓦（Kilwa）的季风帆船运往阿拉伯、波斯与古吉拉特换回瓷器、丝绸与细棉布。内陆矿主与海岸苏丹正筹议一份惠及双方的长期商约。"
 oe_afr.13.a: "缔结津巴布韦—索法拉—基尔瓦统一黄金商约"
 oe_afr.13.b: "将部分黄金收益投入索法拉与基尔瓦海防船坞"
 oe_afr.14.title: "珊瑚石宫港：胡苏尼·库布瓦与恩赐王朝"
 oe_afr.14.desc: "工匠从碧蓝浅海中采掘洁白珊瑚石，在基尔瓦·基西瓦尼悬崖之巅修筑起拥有百余厅堂、八角泳池与巨型商栈庭院的胡苏尼·库布瓦宫（Husuni Kubwa）。每逢季风转向，阿拉伯、阿曼与印度船主便在此高朋满座，惊叹东非海商文明的富丽。"
 oe_afr.14.a: "竣工胡苏尼·库布瓦宫港并立季风海图碑"
 oe_afr.14.b: "重赏船匠与领航员，扩编斯瓦希里远洋商船队"
 oe_afr.15.title: "1505 阿尔梅达炮火：卡塔兹封锁警报！"
 oe_afr.15.desc: "高耸如移动堡垒的欧陆克拉克大帆船破浪驶入东非海域！舰队统帅弗朗西斯科·德·阿尔梅达以猛烈舷炮轰击不肯屈服的珊瑚石城，强筑圣地亚哥堡并推行苛酷的「卡塔兹」（Cartaz）通行税，企图独占索法拉黄金与印度洋香料航线。"
 oe_afr.15.a: "号召东非诸邦缔结斯瓦希里反卡塔兹季风海盟，以重炮帆船反击！"
 oe_afr.15.b: "暂以商贸周旋拖延敌舰，暗中加速港防与船坞改制"
 oe_afr.16.title: "迪乌—基尔瓦跨印度洋反封锁海盟"
 oe_afr.16.desc: "随东北季风南下的阿曼、古吉拉特与红海特使抵达东非港湾，带来印度洋北岸反抗卡塔兹封锁的战报与铸炮工匠。斯瓦希里轻捷战船与北印度洋联合舰队南北夹击，令外来殖民堡垒陷入孤立无援之境！"
 oe_afr.16.a: "缔结迪乌—基尔瓦跨洋海盟，共掌西印度洋航权！"
 oe_afr.16.b: "借北洋商盟拓展古吉拉特棉布与东非象牙互市"
 oe_afr.17.title: "花岗岩巨墙：大津巴布韦与莫诺莫塔帕金脉"
 oe_afr.17.desc: "无需一丝灰浆便严丝合缝垒起十丈高墙的大津巴布韦石城巍然屹立，内陆矿区新探明富饶金脉与铜矿。王室长老与沿海代理商齐聚大围墙之下，商议如何以统一度量衡与武装护卫稳定通往索法拉与克利马内的贸易干线。"
 oe_afr.17.a: "设立王室金砂检验司，打通高原至索法拉商道"
 oe_afr.17.b: "加强内陆石城防务，严防外来探险队染指矿山"
 oe_afr.18.title: "双季风之主：卡斯卡齐与库西航图盛世"
 oe_afr.18.desc: "斯瓦希里航海世家将世代口传的东北季风「卡斯卡齐」（Kaskazi）与西南季风「库西」（Kusi）星象航图、潮汐暗礁录与罗盘偏差表编纂成册。基尔瓦、蒙巴萨、拉穆与桑给巴尔的商船不仅稳守东非海岸，更重现远航波斯湾与印度洋的辉煌。"
 oe_afr.18.a: "颁行斯瓦希里皇家季风航海总录"
 oe_afr.18.b: "广设海商保险公所，助推东非港埠财富倍增"
 oe_afr.90.title: "【读数】非洲三大文明独立史诗轴线（槽位 97）"
 oe_afr.90.desc: "槽位 97 脉冲计数：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_pulses')|0]｜当前国家所属轴线：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_axis')|0]（0=非主角 1=埃塞俄比亚 2=马里/桑海 3=基尔瓦/津巴布韦）｜已解锁非洲专属科技：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_adv_count')|0] / 6\n\n#T 跨工位里程碑全局变量契约（供 W4 合奏联动）#!\n祭司王约翰跨红海协定（oe_afr_prester_john_pact）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_prester_john')|0]\n桑科雷学术黄金时代（oe_afr_sankore_golden_age）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_sankore')|0]\n汤迪比火绳枪军改幸存（oe_afr_tondibi_survived）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_tondibi')|0]\n斯瓦希里反卡塔兹季风海盟（oe_afr_swahili_monsoon_league）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_monsoon_league')|0]\n\n#T 既有跨版本接口实时探测#!\n迦克墩教务轴（oe_rel2_axis_chalcedon，2=和解）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_chalcedon')|0]｜本国撒哈拉学术商队（oe_nav2_done_sahara）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_sahara_exp')|0]\n葡萄牙卡塔兹激活（oe_weu2_por_cartaz_active）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_cartaz')|0]｜迪乌抗葡同盟（oe_ind_diu_coalition_active）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_afr_v_diu')|0]"
 oe_afr.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_afr_mashafa_berhan_mod: "《光明之书》与德布雷米特马克和解"
 STATIC_MODIFIER_DESC_oe_afr_mashafa_berhan_mod: "扎拉·雅各布皇帝在公会议弥合教派百年裂痕并颁布吉兹语《光明之书》，皇权与教会同心协力。"
 STATIC_MODIFIER_NAME_oe_afr_chewa_highland_muster_mod: "切瓦御林高地总动员"
 STATIC_MODIFIER_DESC_oe_afr_chewa_highland_muster_mod: "世袭切瓦御林军团据守埃塞俄比亚平顶天险堡垒，随时拱卫皇室与边疆关隘。"
 STATIC_MODIFIER_NAME_oe_afr_gomit_triumph_mod: "戈米特大捷威望"
 STATIC_MODIFIER_DESC_oe_afr_gomit_triumph_mod: "重创阿达尔与伊法特低地劲敌的辉煌胜利震慑非洲之角，极大鼓舞了所罗门军士气。"
 STATIC_MODIFIER_NAME_oe_afr_prester_john_accord_mod: "祭司王约翰跨红海协定"
 STATIC_MODIFIER_DESC_oe_afr_prester_john_accord_mod: "埃塞俄比亚皇使跨越红海与地中海及大西洋基督教宫廷缔结盟约，引来工匠、海图与火绳枪支援。"
 STATIC_MODIFIER_NAME_oe_afr_chalcedon_holy_league_mod: "亚历山大—君堡—阿克苏姆神圣同盟"
 STATIC_MODIFIER_DESC_oe_afr_chalcedon_holy_league_mod: "迦克墩东方正统教和解使祭司王约翰盟约升格为毫无教义隔阂的红海—地中海基督教神圣同盟，火器与神学交流空前兴盛。"
 STATIC_MODIFIER_NAME_oe_afr_gragn_resistance_mod: "高地抗加齐坚壁死守"
 STATIC_MODIFIER_DESC_oe_afr_gragn_resistance_mod: "面对低地火炮圣战的狂飙突进，所罗门军民退守峭壁天险，以焦土消耗与反击拖垮远征劲敌。"
 STATIC_MODIFIER_NAME_oe_afr_gondarine_renaissance_mod: "贡德尔石城文艺中兴"
 STATIC_MODIFIER_DESC_oe_afr_gondarine_renaissance_mod: "贡德尔王城石堡巍然矗立，高地咖啡贸易、圣像绘画与吉兹语典籍迎来黄金盛世。"
 STATIC_MODIFIER_NAME_oe_afr_sankore_golden_age_mod: "阿斯基亚桑科雷学术黄金时代"
 STATIC_MODIFIER_DESC_oe_afr_sankore_golden_age_mod: "廷巴克图桑科雷大学在阿斯基亚敕令庇护下万卷云集，推动萨赫勒帝国在识字率、思潮与科研上突飞猛进。"
 STATIC_MODIFIER_NAME_oe_afr_sahara_caravan_synergy_mod: "跨撒哈拉手稿商队网络"
 STATIC_MODIFIER_DESC_oe_afr_sahara_caravan_synergy_mod: "撒哈拉学术商队打通了廷巴克图、非斯、开罗与君堡之间的典籍通道，令星象历算与法学抄本源源汇流。"
 STATIC_MODIFIER_NAME_oe_afr_taghaza_salt_monopoly_mod: "塔加扎盐砖与旺加拉黄金专营"
 STATIC_MODIFIER_DESC_oe_afr_taghaza_salt_monopoly_mod: "沙漠北端的塔加扎盐矿与南部的尼日尔金矿紧密咬合，等重盐金交易令国库充盈如潮。"
 STATIC_MODIFIER_NAME_oe_afr_niger_river_flotilla_mod: "阿斯基亚尼日尔河常备舟师"
 STATIC_MODIFIER_DESC_oe_afr_niger_river_flotilla_mod: "常驻加奥、廷巴克图与杰内水道的武装战舟纵队高速投送兵力与粮秣，将万里河湾紧锁在中央掌控之下。"
 STATIC_MODIFIER_NAME_oe_afr_tondibi_shock_mod: "汤迪比大漠火绳枪震荡"
 STATIC_MODIFIER_DESC_oe_afr_tondibi_shock_mod: "横穿撒哈拉的火绳枪齐射与轻炮轰鸣重创了传统骑步战阵，军队亟须脱胎换骨的火器改革。"
 STATIC_MODIFIER_NAME_oe_afr_tondibi_arquebus_corps_mod: "桑海新式火绳枪近卫军团"
 STATIC_MODIFIER_DESC_oe_afr_tondibi_arquebus_corps_mod: "广延地中海与奥斯曼火器工匠并沿塔加扎—汤迪比筑垒布防，萨赫勒帝国以现代化火药方阵成功顶住沙漠远征狂潮。"
 STATIC_MODIFIER_NAME_oe_afr_zimbabwe_gold_corridor_mod: "大津巴布韦—索法拉黄金走廊"
 STATIC_MODIFIER_DESC_oe_afr_zimbabwe_gold_corridor_mod: "花岗岩石城出产的精金与象牙经索法拉直抵基尔瓦港铸币出洋，令东非内陆与海岸共生共荣。"
 STATIC_MODIFIER_NAME_oe_afr_husuni_kubwa_prosperity_mod: "恩赐王朝季风港埠盛世"
 STATIC_MODIFIER_DESC_oe_afr_husuni_kubwa_prosperity_mod: "珊瑚石宫港与大清真寺巍峨壮丽，双季风航季百舸争流，斯瓦希里城邦迎来商贸巅峰。"
 STATIC_MODIFIER_NAME_oe_afr_almeida_raid_alert_mod: "阿尔梅达舰炮警报与港防动员"
 STATIC_MODIFIER_DESC_oe_afr_almeida_raid_alert_mod: "欧陆克拉克帆船的炮火惊醒东非诸港，斯瓦希里船坞昼夜赶工加固海防并换装火炮帆船。"
 STATIC_MODIFIER_NAME_oe_afr_swahili_monsoon_league_mod: "斯瓦希里反卡塔兹季风海盟"
 STATIC_MODIFIER_DESC_oe_afr_swahili_monsoon_league_mod: "基尔瓦、蒙巴萨、马林迪与津巴布韦携手誓破卡塔兹通行税枷锁，重炮三角帆战船牢牢守护东非洋面。"
 STATIC_MODIFIER_NAME_oe_afr_diu_kilwa_naval_pact_mod: "迪乌—基尔瓦跨印度洋联合海盟"
