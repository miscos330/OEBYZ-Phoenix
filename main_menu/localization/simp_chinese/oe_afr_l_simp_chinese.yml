 oe_afr_school_ewostathian_tewahedo: "德布雷米特马克合一教派"
 oe_afr_school_ewostathian_tewahedo_desc: "1450 年德布雷米特马克公会议在扎拉·雅各布皇帝主持下弥合了双安息日百年裂痕，融合亚历山大牧首传统与埃塞俄比亚高地修院仪轨，以《光明之书》维系正统信仰与高地军民凝聚力。"
 oe_afr_school_timbuktu_maliki: "廷巴克图桑科雷马立克学派"
 oe_afr_school_timbuktu_maliki_desc: "以廷巴克图桑科雷大经学院为宗的萨赫勒马立克教法学派，兼修天文历算、医学与商法公证，以数十万手稿抄本联结尼日尔河商帮与跨撒哈拉学术网络。"
 oe_afr_chewa_amba_citadel: "切瓦御林天险堡垒"
 oe_afr_chewa_amba_citadel_desc: "修筑于埃塞俄比亚峭壁平顶山（Amba）之巅的所罗门王朝世袭切瓦（Chewa）御林军屯堡垒，平时拱卫高地税籍与粮仓，战时化作令低地劲敌寸步难行的天然关隘。"
 oe_afr_chewa_amba_citadel_maint: "军屯日常修缮"
 oe_afr_sankore_great_madrasa: "廷巴克图桑科雷大经学院"
 oe_afr_sankore_great_madrasa_desc: "耸立于萨赫勒黄金商道交汇处的泥砖阶梯宣礼塔经学院与抄本馆，汇聚数万学子与数十万卷天文、算学、医学与马立克教法手稿，堪称西非大陆的学术灯塔。"
 oe_afr_sankore_great_madrasa_maint: "抄本与经院维护"
 oe_afr_husuni_kubwa_emporium: "胡苏尼·库布瓦季风黄金商馆"
 oe_afr_husuni_kubwa_emporium_desc: "以珊瑚石砌成的斯瓦希里皇室宫港与大津巴布韦—索法拉黄金转运总栈，借助东北与西南双季风接纳阿拉伯、波斯与古吉拉特商船，铸造东非海商霸权。"
 oe_afr_husuni_kubwa_emporium_maint: "商栈与船坞维护"
 oe_afr_adv_mashafa_berhan_canon: "《光明之书》王法圣典"
 oe_afr_adv_mashafa_berhan_canon_desc: "以古典吉兹语编纂的《光明之书》将教会仪轨与皇室行省法度合二为一，肃清地方异说并在高地险隘推广世袭切瓦御林堡垒。"
 oe_afr_adv_prester_john_matchlocks: "祭司王红海火绳枪营"
 oe_afr_adv_prester_john_matchlocks_desc: "借跨红海基督教使团引进火绳枪匠与铸炮技艺，以重步兵火器方阵武装切瓦精锐，在高地峡谷迎击沿海火药劲旅。"
 oe_afr_adv_sankore_manuscript_guilds: "桑科雷手稿抄写行会"
 oe_afr_adv_sankore_manuscript_guilds_desc: "组织廷巴克图、杰内与加奥的抄书匠、装帧师与商法公证行会，以跨撒哈拉纸张贸易支撑桑科雷大经学院的兴建与思潮跃升。"
 oe_afr_adv_tondibi_gunpowder_reform: "汤迪比撒赫勒火器军改"
 oe_afr_adv_tondibi_gunpowder_reform_desc: "汲取 1591 年大漠火绳枪冲击的血火教训，重组尼日尔河常备火枪营与轻炮阵地，以严明军纪与现代火力反制跨沙漠远征军。"
 oe_afr_adv_al_mawahib_gold_monsoon: "恩赐王朝黄金季风商网"
 oe_afr_adv_al_mawahib_gold_monsoon_desc: "完善基尔瓦—索法拉—大津巴布韦的铸币秤量、关税汇票与季风仓栈制度，使内陆高原黄金与海岸珊瑚港口的印度洋航运无缝衔接。"
 oe_afr_adv_counter_cartaz_dhows: "反卡塔兹重炮三角帆舰队"
 oe_afr_adv_counter_cartaz_dhows_desc: "改良斯瓦希里远洋三角帆船（Dhow）与赞布克快艇，加装船首回旋炮并利用浅滩礁盘与季风航道，成群突袭欧陆克拉克帆船的封锁线。"
 oe_afr_trans_regional_charter_law: "跨非洲商道与御藩宪章"
 oe_afr_trans_regional_charter_law_desc: "统筹高地军屯采邑、跨撒哈拉盐金驼队与斯瓦希里季风港埠的基本大法，决定帝国如何将自然险阻与洲际贸易转化为持久国力。"
 oe_afr_pol_solomonic_gult_charter: "所罗门古尔特军屯宪章"
 oe_afr_pol_solomonic_gult_charter_desc: "以皇室敕封的古尔特（Gult）收税权供养修院与切瓦军团，强化高地守御、中央控制与宗教凝聚力。"
 oe_afr_pol_trans_saharan_caravan_charter: "跨撒哈拉盐金商队宪章"
 oe_afr_pol_trans_saharan_caravan_charter_desc: "由国家统一护航塔加扎盐矿、廷巴克图市场与旺加拉金矿商路，令商旅与学者共享畅通无阻的沙漠走廊。"
 oe_afr_pol_swahili_monsoon_port_charter: "斯瓦希里季风港埠宪章"
 oe_afr_pol_swahili_monsoon_port_charter_desc: "以统一的低税港埠章程吸引印度洋季风帆船与内陆象牙黄金商帮，建立开放而严密的东非海商秩序。"
 oe_afr_solomonic_chewa_monarchy: "所罗门切瓦军屯王制"
 oe_afr_solomonic_chewa_monarchy_desc: "以游巡皇帐（Ketema）统御高地诸省，并以直属皇帝的世袭切瓦御林军团取代离心地方领主，锻造坚不可摧的非洲之角基督教帝国。"
 oe_afr_askia_sahel_bureaucracy: "阿斯基亚萨赫勒官僚省制"
 oe_afr_askia_sahel_bureaucracy_desc: "效法阿斯基亚大帝改制，按水陆防务、河港航政、盐金财政与马立克司法分设中央专职大臣，以文官考核和常备军取代松散部落贡赋。"
 oe_afr_swahili_monsoon_thalassocracy: "斯瓦希里季风海商联邦"
 oe_afr_swahili_monsoon_thalassocracy_desc: "以基尔瓦、索法拉、蒙巴萨与桑给巴尔诸港贵族议会为骨干，联合内陆大津巴布韦金矿政权，打造横跨西印度洋的季风贸易霸权。"
 oe_afr_priv_debre_libanos_monastic_grants: "德布雷利巴诺斯修院敕田"
 oe_afr_priv_debre_libanos_monastic_grants_desc: "赐予德布雷利巴诺斯与拉利贝拉大修院免税敕田与吉兹语抄经特权，换取高地教士团对所罗门皇权的坚定拥护。"
 oe_afr_priv_wangara_gold_guilds: "旺加拉黄金与盐商行会特许"
 oe_afr_priv_wangara_gold_guilds_desc: "向掌握西非金砂冶炼与撒哈拉盐砖转运的旺加拉商帮授予统一度量衡与汇兑特权，保障国库源源不断的黄金岁入。"
 oe_afr_priv_waungwana_dhow_patricians: "瓦温瓜纳海商世家特权"
 oe_afr_priv_waungwana_dhow_patricians_desc: "确认斯瓦希里石城名门（Waungwana）在象牙收购、珊瑚港税与季风船队融资中的世袭特许，稳固东非诸城的航海贸易根基。"
 oe_afr_cab_trans_saharan_gold_salt: "护航塔加扎—廷巴克图盐金商道"
 oe_afr_cab_trans_saharan_gold_salt_desc: "委派内阁专员驻节塔加扎盐场与廷巴克图驿道，整顿驼队护卫、统一盐砖金砂比价并强化尼日尔河沿线控制力。"
 oe_afr_cab_trans_saharan_gold_salt_action: "$oe_afr_cab_trans_saharan_gold_salt$"
 oe_afr_cab_trans_saharan_gold_salt_active: "正在护航塔加扎—廷巴克图盐金道"
