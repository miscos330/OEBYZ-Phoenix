 oe_aeg_ct_chios_c1t3: "希俄斯让给了热那亚人，股东们成立了马奥纳；皇帝拒收马奥纳的岁贡，要岛。"
 oe_aeg_ct_chios_mt1: "希俄斯在热那亚的马奥纳手里；马奥纳每年向皇帝纳贡，皇帝承认了现状。"
 oe_aeg_ct_chios_mt2: "希俄斯在热那亚的马奥纳手里；马奥纳每年纳贡，皇帝收钱却不认产权。"
 oe_aeg_ct_chios_mt3: "希俄斯在热那亚的马奥纳手里；皇帝拒收马奥纳的岁贡，要岛。"
 oe_aeg_ct_chios_c1: "希俄斯让给了热那亚人。"
 oe_aeg_ct_chios_m: "希俄斯在热那亚的马奥纳手里。"
 oe_aeg_ct_chios_c2: "帝国花钱守住了希俄斯。"
 oe_aeg_ct_chios_c3: "希俄斯仍归帝国，岛上的收入包给了热那亚的股东。"
 oe_aeg_ct_chios_c4: "希俄斯的收入曾包给热那亚的股东；岛不再归帝国直辖，包税也就了结了。"
 oe_aeg_ct_gat_1: "加蒂卢西奥家是莱斯沃斯的领主，有封地#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_fief_n')|0]#!处。"
 oe_aeg_ct_gat_2: "第二次内战之后，帝国没有把许下的莱斯沃斯给加蒂卢西奥家。"
 oe_aeg_ct_gat_3: "帝国收回了加蒂卢西奥家的封地。"
 oe_aeg_ct_gat_4: "帝国只雇了加蒂卢西奥的船，没有许婚，也没有封地。"
 oe_aeg_ct_gat_5: "帝国打发走了那位热那亚冒险家。"
 oe_aeg_ct_gat_6: "加蒂卢西奥家的封地都已落入别国之手。"
 oe_aeg_ct_none: ""
 oe_aeg.1.t: "维尼奥索的舰队"
 oe_aeg.1.desc_k: "#F 1346年6月，热那亚人西莫内·维尼奥索带着二十九艘桨帆船出现在希俄斯外海。这支船队是私人船主出钱装备的，船主们想抢在西方的十字军之前拿下这座岛。老总督卡洛塞托斯当年正是从热那亚人手里收回了这座岛。#!\n\n如今，总督派快船来报：热那亚人已经在[GetLocationByKey('chios').GetName]登陆，城堡还在我们手里。船主们要的是这座岛和岛上的收益。"
 oe_aeg.1.desc_x: "#F 1346年6月，热那亚人西莫内·维尼奥索带着二十九艘桨帆船出现在希俄斯外海。这支船队是私人船主出钱装备的，船主们想抢在西方的十字军之前拿下这座岛。#!\n\n如今，总督派快船来报：热那亚人已经在[GetLocationByKey('chios').GetName]登陆，城堡还在我们手里。船主们要的是这座岛和岛上的收益。"
 oe_aeg.1.a: "出钱出船，守住希俄斯"
 oe_aeg.1.a.tt: "花费#R 3#!个月的收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m3')|0]#!金币）\n热那亚对帝国好感#R −20#!（每年回落#Y 2#!）\n热那亚身上原版“收复希俄斯”的前提被去掉：此后帝国陷入灾难时，热那亚人不会再径自夺走希俄斯"
 oe_aeg.1.b: "把岛上的收入包给热那亚的股东"
 oe_aeg.1.b.tt: "[GetLocationByKey('chios').GetName]仍归帝国，得到[ShowModifier('oe_aeg_maona_lease')]，持续#Y 30#!年\n股东先付#G 2#!个月的收入（约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m2')|0]#!金币）\n此后每年一月收租：#G 0.3#!个月的收入（约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_rent')|0]#!金币；修正还在、岛仍归帝国时）\n热那亚对帝国好感#G +15#!（每年回落#Y 2#!）\n意大利商业特权已经建账时：热那亚的特权升一级\n热那亚身上原版“收复希俄斯”的前提被去掉：此后帝国陷入灾难时，热那亚人不会再径自夺走希俄斯"
 oe_aeg.1.c: "让出希俄斯"
 oe_aeg.1.c.tt: "[GetLocationByKey('chios').GetName]归热那亚；帝国若还拥有[GetLocationByKey('foca').GetName]，一并归热那亚\n威望#R −5#!\n出钱的股东们随后会在岛上结成“马奥纳”"
 oe_aeg.2.t: "热那亚冒险家"
 oe_aeg.2.desc_x: "#F 1354年冬，热那亚冒险家弗朗切斯科·加蒂卢西奥带着几条船，帮约翰五世夺回了京城；第二年，弗朗切斯科娶了皇帝的妹妹玛丽亚，得到莱斯沃斯岛作嫁妆，岛上铸的钱币仍是皇帝的十字纹。#!\n\n如今，这一回没有那场内战，可同一个热那亚人还是来了。加蒂卢西奥的船在海峡里替帝国赶走了突厥海盗，现在来求一门亲事，和一座岛。"
 oe_aeg.2.a: "许婚，封莱斯沃斯"
 oe_aeg.2.a.tt: "[GetLocationByKey('mitilene').GetName]、[GetLocationByKey('molyvos').GetName]（帝国直辖的）得到[ShowModifier('oe_cw2_gattilusio_fief')]（永久）；两地仍归帝国，照常收税\n加蒂卢西奥家从此是莱斯沃斯的领主\n威望#G +5#!"
 oe_aeg.2.b: "只雇加蒂卢西奥的船"
 oe_aeg.2.b.tt: "花费#R 1#!个月的收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m1')|0]#!金币）\n帝国得到[ShowModifier('oe_aeg_galleys')]，持续#Y 5#!年"
 oe_aeg.2.c: "打发这个热那亚人走"
 oe_aeg.2.c.tt: "此事不再提起"
 oe_aeg.3.t: "马奥纳的岁贡"
 oe_aeg.3.desc_l: "#F 1347年，热那亚公社还不起出征的钱，便把希俄斯和福恰的收入交给了出钱的股东，人称“马奥纳”。一说1349年热那亚人还答应过十年后把岛还给帝国。1363年，马奥纳向约翰五世交了一笔岁贡。#!\n\n如今，马奥纳的使者到了，愿意每年交一笔钱，换皇帝承认现状。"
 oe_aeg.3.desc_x: "#F 1347年，热那亚公社还不起出征的钱，便把希俄斯和福恰的收入交给了出钱的股东，人称“马奥纳”。一说1349年热那亚人还答应过十年后把岛还给帝国。#!\n\n如今，马奥纳的使者到了，愿意每年交一笔钱，换皇帝承认现状。"
 oe_aeg.3.a: "收下岁贡，承认现状"
 oe_aeg.3.a.tt: "此后每年一月得#G 0.5#!个月的收入（约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_trib1')|0]#!金币）（希俄斯仍归热那亚、京城仍在帝国手里时）\n热那亚对帝国好感#G +10#!（每年回落#Y 2#!）"
 oe_aeg.3.b: "收钱，但岛总有一天要还"
 oe_aeg.3.b.tt: "此后每年一月得#G 0.3#!个月的收入（约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_trib2')|0]#!金币）（希俄斯仍归热那亚、京城仍在帝国手里时）\n热那亚对帝国好感#R −5#!（每年回落#Y 2#!）"
 oe_aeg.3.c: "不收，要岛"
 oe_aeg.3.c.tt: "热那亚对帝国好感#R −20#!（每年回落#Y 2#!）\n威望#G +5#!"
 oe_aeg.4.t: "埃内兹"
 oe_aeg.4.desc_n: "#F 1370年代，弗朗切斯科的弟弟尼科洛做了埃内兹的领主。这座城守着赫布罗斯河的河口，盐和粮食从这里装船出海。#!\n\n如今，莱斯沃斯的领主替弟弟来求[GetLocationByKey('enez').GetName]。当年专制公替皇帝镇守的，正是这座城。"
 oe_aeg.4.desc_x: "#F 1370年代，弗朗切斯科的弟弟尼科洛做了埃内兹的领主。这座城守着赫布罗斯河的河口，盐和粮食从这里装船出海。#!\n\n如今，莱斯沃斯的领主替弟弟来求[GetLocationByKey('enez').GetName]。"
 oe_aeg.4.a: "把埃内兹封给领主的弟弟"
 oe_aeg.4.a.tt: "[GetLocationByKey('enez').GetName]（帝国直辖时）得到[ShowModifier('oe_cw2_gattilusio_fief')]（永久），仍归帝国、照常收税；每年一月的岁礼随之增加\n加蒂卢西奥家的忠心#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）\n威望#G +5#!"
 oe_aeg.4.b: "婉言谢绝"
 oe_aeg.4.b.tt: "加蒂卢西奥家的忠心#R −10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）"
 oe_aeg.5.t: "米蒂利尼的地震"
 oe_aeg.5.desc_x: "#F 1384年8月6日，莱斯沃斯地震。弗朗切斯科一世和两个儿子死在倒塌的城堡里，幸存的三子雅各布继位，称弗朗切斯科二世。#!\n\n如今，[GetLocationByKey('mitilene').GetName]的城墙和房屋震塌了不少，岛上只剩一个年轻的主人。朝里有人说，当年的嫁妆可以收回了。"
 oe_aeg.5.a: "承认少主"
 oe_aeg.5.a.tt: "[GetLocationByKey('mitilene').GetName]的繁荣度下降（地震，原版地震事件的“轻度”幅度）\n加蒂卢西奥家的忠心#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）\n威望#G +5#!"
 oe_aeg.5.b: "趁机收回莱斯沃斯"
 oe_aeg.5.b.tt: "[GetLocationByKey('mitilene').GetName]的繁荣度下降（地震，原版地震事件的“轻度”幅度）\n加蒂卢西奥家的全部封地收回朝廷：五处候选地上的[ShowModifier('oe_cw2_gattilusio_fief')]都去掉（地本来就归帝国，不换主人）\n此后不再有岁礼，加蒂卢西奥家的事到此为止\n热那亚对帝国好感#R −20#!（每年回落#Y 2#!）\n威望#R −5#!\n稳定度#G +2.5#!"
 oe_aeg.6.t: "萨索斯与利姆诺斯"
 oe_aeg.6.desc_x: "#F 15世纪前期，加蒂卢西奥家的领地从莱斯沃斯、埃内兹一路伸向北边的岛屿：萨莫色雷斯、萨索斯，还有利姆诺斯岛上的城堡。#!\n\n如今，莱斯沃斯又来求地：北边的[GetLocationByKey('thasos').GetName]和[GetLocationByKey('lemnos').GetName]常遭突厥海盗，加蒂卢西奥家愿意出船出人来守。"
 oe_aeg.6.a: "封萨索斯"
 oe_aeg.6.a.tt: "[GetLocationByKey('thasos').GetName]得到[ShowModifier('oe_cw2_gattilusio_fief')]（永久），仍归帝国、照常收税；每年一月的岁礼随之增加\n加蒂卢西奥家的忠心#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）"
 oe_aeg.6.b: "连利姆诺斯一起封"
 oe_aeg.6.b.tt: "[GetLocationByKey('thasos').GetName]、[GetLocationByKey('lemnos').GetName]（帝国直辖、还不是封地的）得到[ShowModifier('oe_cw2_gattilusio_fief')]（永久），仍归帝国、照常收税；每年一月的岁礼随之增加\n[GetLocationByKey('lemnos').GetName]的明矾照旧归帝国出产\n加蒂卢西奥家的忠心#G +15#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）"
 oe_aeg.6.c: "都不封"
 oe_aeg.6.c.tt: "加蒂卢西奥家的忠心#R −10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）"
 oe_aeg.7.t: "加蒂卢西奥家的新娘"
 oe_aeg.7.desc_l: "#F 加蒂卢西奥家一代又一代与巴列奥略家结亲：弗朗切斯科一世娶了约翰五世的妹妹玛丽亚，孙女嫁给了约翰七世；1405年，家里的另一个女儿海伦娜嫁给了塞尔维亚的斯特凡。一说1441年，多里诺的女儿卡特琳娜嫁给了皇帝的兄弟君士坦丁，第二年就去世了。#!\n\n如今，莱斯沃斯的领主为家里的女儿提亲，对象是皇帝的一位兄弟。"
 oe_aeg.7.desc_x: "#F 加蒂卢西奥家一代又一代与巴列奥略家结亲：弗朗切斯科一世娶了约翰五世的妹妹玛丽亚，孙女嫁给了约翰七世；1405年，家里的另一个女儿海伦娜嫁给了塞尔维亚的斯特凡。#!\n\n如今，莱斯沃斯的领主为家里的女儿提亲，对象是皇帝的一位兄弟。"
 oe_aeg.7.a: "许婚"
 oe_aeg.7.a.tt: "两家的姻亲又多一代：此后加蒂卢西奥家的忠心每年向更高处回归\n加蒂卢西奥家的忠心#G +15#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）\n嫁妆：#G 1#!个月的收入（约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m1')|0]#!金币）\n威望#G +5#!"
 oe_aeg.7.b: "婉拒这门亲事"
 oe_aeg.7.b.tt: "加蒂卢西奥家的忠心#R −10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）"
 oe_aeg.8.t: "许给热那亚队长的岛"
 oe_aeg.8.desc_g: "#F 据说那年冬天，皇帝许给热那亚队长朱斯蒂尼亚尼利姆诺斯岛，作为守城的酬劳。#!\n\n如今，城守住了，队长的人来讨那座岛。只是[GetLocationByKey('lemnos').GetName]早已封给了莱斯沃斯，只能另给一座。"
 oe_aeg.8.desc_o: "#F 据说那年冬天，皇帝许给热那亚队长朱斯蒂尼亚尼利姆诺斯岛，作为守城的酬劳。#!\n\n如今，城守住了，队长的人来讨那座岛。只是[GetLocationByKey('lemnos').GetName]眼下不在帝国直辖，只能另给一座。"
 oe_aeg.8.desc_x: "#F 据说那年冬天，皇帝许给热那亚队长朱斯蒂尼亚尼利姆诺斯岛，作为守城的酬劳。#!\n\n如今，城守住了，队长的人来讨那座岛。"
 oe_aeg.8.a: "照许下的封给队长"
 oe_aeg.8.a.tt: "[GetLocationByKey('lemnos').GetName]、[GetLocationByKey('imbros').GetName]、[GetLocationByKey('thasos').GetName]中第一处由帝国直辖且未封出的岛得到[ShowModifier('oe_aeg_captain_fief')]（永久）；岛仍归帝国，不算入加蒂卢西奥家的岁礼\n热那亚对帝国好感#G +15#!（每年回落#Y 2#!）"
 oe_aeg.8.b: "折成钱付清"
 oe_aeg.8.b.tt: "花费#R 3#!个月的收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m3')|0]#!金币）\n热那亚对帝国好感#G +5#!（每年回落#Y 2#!）"
 oe_aeg.8.c: "不认账"
 oe_aeg.8.c.tt: "热那亚对帝国好感#R −20#!（每年回落#Y 2#!）\n威望#R −5#!"
 oe_aeg.9.t: "米蒂利尼的弑兄者"
 oe_aeg.9.desc_f: "#F 1458年末，尼科洛·加蒂卢西奥废杀了兄长多梅尼科，夺了莱斯沃斯。几年后苏丹由此有了借口，派舰队登陆围城，守军里还有罗得岛来的医院骑士；半个月后尼科洛献城，被押往京城，后来被勒死。#!\n\n如今，莱斯沃斯的新主人杀兄自立，派人来求皇帝承认——只是皇帝也已经没有京城。"
 oe_aeg.9.desc_x: "#F 1458年末，尼科洛·加蒂卢西奥废杀了兄长多梅尼科，夺了莱斯沃斯。几年后苏丹由此有了借口，派舰队登陆围城，守军里还有罗得岛来的医院骑士；半个月后尼科洛献城，被押往京城，后来被勒死。#!\n\n如今，莱斯沃斯的新主人杀兄自立，派人来求皇帝承认。"
 oe_aeg.9.a: "收回莱斯沃斯与各处封地"
 oe_aeg.9.a.tt: "加蒂卢西奥家的全部封地收回朝廷：五处候选地上的[ShowModifier('oe_cw2_gattilusio_fief')]都去掉（地本来就归帝国，不换主人）\n此后不再有岁礼，加蒂卢西奥家的事到此为止\n合法性#G +5#!"
 oe_aeg.9.b: "承认既成事实"
 oe_aeg.9.b.tt: "加蒂卢西奥家的忠心#R −10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）\n威望#R −5#!"
 oe_aeg.9.c: "令莱斯沃斯出钱赎罪"
 oe_aeg.9.c.tt: "得#G 2#!个月的收入（约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m2')|0]#!金币）\n加蒂卢西奥家的忠心#R −15#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!）"
