l_simp_chinese:
 oe_paeones_culture: "派奥涅斯"
 OE_RW_ASSIM_PAEONES_TITLE: "开启派奥涅斯文化认同运动"
 OE_RW_ASSIM_PAEONES_ROW: "派奥涅斯文化"
 OE_RW_ASSIM_PAEONES_FLAVOR: "多瑙河的渡口、喀尔巴阡山的隘道与匈牙利平原上的集镇，如今同在帝国的法度之下。旧日骑手的子孙进入军伍，地方书吏学习希腊文字，修院与学校连接起彼此陌生的乡社。他们将保留故乡的记忆，以派奥涅斯之名成为罗马世界的一员。"
 OE_RW_ASSIM_PAEONES_CONDITION: "首次开启需东罗马及其各级附属国拥有喀尔巴迁大区至少80%的可征服地点，瓦拉几亚与摩尔达维亚除外；仅军事占领不算。旧版已开启的运动可在此重启一次。"
 OE_RW_ASSIM_PAEONES_NOT_STARTED: "尚未开启修正后的派奥涅斯认同运动；旧版已开启者可重启一次"
 OE_RW_ASSIM_PAEONES_SOURCES: "同化[ShowCultureName('hungarian')]文化。"
 OE_RW_ASSIM_PAEONES_TARGET: "逐步将东罗马及其各级附属国境内的[ShowCultureName('hungarian')]人口转为[ShowCultureName('oe_paeones_culture')]文化。没有匈牙利人口或不属于帝国的地点不再继续传播。\n\n旧版存档可点击开启按钮重启一次，以清除旧运动的异常传播范围；已经同化的人口保留。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_PAEONES_WAITING: "尚未开启／旧版运动可重启"
 OE_RW_ASSIM_PAEONES_STARTED: "已开启：派奥涅斯"
 oe_paeones_identity_movement: "派奥涅斯文化认同运动"
 oe_paeones_identity_movement_desc: "多瑙河的渡口、喀尔巴阡山的隘道与匈牙利平原上的集镇，如今同在帝国的法度之下。旧日骑手的子孙进入军伍，地方书吏学习希腊文字，修院与学校连接起彼此陌生的乡社。他们将保留故乡的记忆，以派奥涅斯之名成为罗马世界的一员。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_rw_paeones_romanization_started: "已开启派奥涅斯罗马化"
 OE_RW_END_CONTEST_REWARDS: "获得#G 50#!帝国权威与#G 20#!稳定度。"
 OE_RW_ASSIM_PAEONES_PROGRESS: "当前拥有：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_paeones_owned')|0]／[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_paeones_total')|0]；开启需至少[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_paeones_required')|0]处。"
 OE_RW_ASSIM_PAEONES_VALID_ORIGIN: "喀尔巴迁大区（瓦拉几亚、摩尔达维亚除外）至少有一个东罗马或其各级附属国拥有、且仍有匈牙利人口的地点。"
