 OE_TQ_CELL_TT_LAND: "#T 军区自行补员#!\n现有正规军[Country.MakeScope.ScriptValue('oe_tq_have')|1]千人，定额[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|1]千人。\n定额 = 地位 [Country.MakeScope.ScriptValue('oe_tq_q_base')|1] 军务 [Country.MakeScope.ScriptValue('oe_tq_q_tier')|+=1] 授地 [Country.MakeScope.ScriptValue('oe_tq_q_pronoia')|+=1]；[Country.Custom('OeTqDisarm')]封顶#Y 5#!。\n今年：[Country.Custom('OeTqLast')]\n自查：[Country.Custom('OeTqChk')]\n\n每年一月核算一次，缺额时用军区自己的库藏补员：陆军每步两个团，军区出#R 1.2#!千人力和#R 80#!金，每年一步（[oe_tu_march|e]两步）；海军每步一艘桨帆船，#R 30#!金，每年两步。金价按[oe_tu_fiscal|e]分摊：中央委派由帝国出一半（帝国金币不少于#Y 200#!时），包税贵四分之一，授地减半。付完后军区至少留#Y 100#!金。忠诚低于#Y 40#!停补。在帝国柱石总览的“兵力目标”表里给这个军区设了目标时，改由那套年度补员负责（它要求军区金币达到1000）。"
 OE_TQ_CELL_TT_SEA: "#T 军区自行补员#!\n现有战船[Country.MakeScope.ScriptValue('oe_tq_have')|0]艘，定额[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|0]艘（按军务档：失序#Y 4#!、平平与良治#Y 6#!、卓著#Y 8#!）。\n今年：[Country.Custom('OeTqLast')]\n自查：[Country.Custom('OeTqChk')]\n\n每年一月核算一次，缺额时用军区自己的库藏补员：陆军每步两个团，军区出#R 1.2#!千人力和#R 80#!金，每年一步（[oe_tu_march|e]两步）；海军每步一艘桨帆船，#R 30#!金，每年两步。金价按[oe_tu_fiscal|e]分摊：中央委派由帝国出一半（帝国金币不少于#Y 200#!时），包税贵四分之一，授地减半。付完后军区至少留#Y 100#!金。忠诚低于#Y 40#!停补。在帝国柱石总览的“兵力目标”表里给这个军区设了目标时，改由那套年度补员负责（它要求军区金币达到1000）。"
