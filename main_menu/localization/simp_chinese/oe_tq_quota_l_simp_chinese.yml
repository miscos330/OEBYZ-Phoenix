 oe_tq_sum_none: "今年军区补员：尚未核算（每年一月核算一次）。"
 OE_TQ_SUM_TT: "军区招不了兵（原版对建筑国家的规则），改由陆军、海军方针的军区每年一月用自己的库藏和人力补员，补到定额为止。每个军区的定额和今年的结果见卡片上的“兵”一格。\n\n每年一月核算一次，缺额时用军区自己的库藏补员：陆军每步两个团，军区出#R 1.2#!千人力和#R 80#!金，每年一步（[oe_tu_march|e]两步）；海军每步一艘桨帆船，#R 30#!金，每年两步。金价按[oe_tu_fiscal|e]分摊：中央委派由帝国出一半（帝国金币不少于#Y 200#!时），包税贵四分之一，授地减半。付完后军区至少留#Y 100#!金。忠诚低于#Y 40#!停补。在帝国柱石总览的“兵力目标”表里给这个军区设了目标时，改由那套年度补员负责（它要求军区金币达到1000）。"
