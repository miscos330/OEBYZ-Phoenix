 oe_ttb_sen.1.t: "元老院议论岁币"
 oe_ttb_sen.1.d3: "安德罗尼卡三世曾想用贡金打发奥斯曼人，却没能阻止奥尔罕在1337年拿下尼科米底亚。\n\n如今，元老院里一片指责岁币的声音。显贵们说，花钱买来的和平保不住领土，皇帝的威信也跟着受损。\n\n元老院对岁币的非议现为[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]。"
 oe_ttb_sen.1.d2: "安德罗尼卡三世曾想用贡金打发奥斯曼人，却没能阻止奥尔罕在1337年拿下尼科米底亚。\n\n如今，元老院对岁币的不满已经摆到了明面上。显贵们说，帝国用金币买来的只是一时的安宁。\n\n元老院对岁币的非议现为[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]。"
 oe_ttb_sen.1.d1: "安德罗尼卡三世曾想用贡金打发奥斯曼人，却没能阻止奥尔罕在1337年拿下尼科米底亚。\n\n如今，岁币一笔笔送出去，元老院里议论纷纷。显贵们抱怨，各地缴来的钱都流进了外邦的库房。\n\n元老院对岁币的非议现为[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]。"
 oe_ttb_sen.1.d0: "安德罗尼卡三世曾想用贡金打发奥斯曼人，却没能阻止奥尔罕在1337年拿下尼科米底亚。\n\n如今，帝国开始向外邦交岁币。元老院里有人私下议论，说金币送了出去，敌人还在边境上。眼下只是议论。\n\n元老院对岁币的非议现为[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]。"
 oe_ttb_sen.1.a0: "由他们去说"
 oe_ttb_sen.1.a0.tt: "没有其他效果。元老院对岁币的非议随每笔岁币上升，每月慢慢回落；达到15时开始有后果。"
 oe_ttb_sen.1.a1: "听着就是"
 oe_ttb_sen.1.a1.tt: "（已经生效）“元老院议论岁币”：贵族的满意度目标 −3%。\n每个特许城邦忠诚 −3（计入忠诚目标5年）。\n非议降到5以下时解除。"
 oe_ttb_sen.1.a2: "暂且忍耐"
 oe_ttb_sen.1.a2.tt: "（已经生效）“元老院不满岁币”：贵族的满意度目标 −6%（取代上一级）。\n每个在元老院有席位的行省（特许城邦、总督区、宗室封邑）忠诚 −3（计入忠诚目标5年）。\n帝国权威 −2。\n非议降到15以下时退回上一级。"
 oe_ttb_sen.1.a3: "这是和平的代价"
 oe_ttb_sen.1.a3.tt: "（已经生效）“元老院指责岁币”：贵族的满意度目标 −10%（取代上一级）。\n每个在元老院有席位的行省（特许城邦、总督区、宗室封邑）忠诚 −5（计入忠诚目标5年）。\n帝国权威 −3。\n非议降到40以下时退回上一级。"
