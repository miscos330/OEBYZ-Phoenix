 oe_sit2.1.a: "整顿纲纪，开启中兴。"
 oe_sit2.1.d: "动荡渐平而隐患犹存，大都朝廷迎来了决定国祚走向的中兴时刻。汉法更化与漠北国俗两派在朝堂上各有主张，诸行省与东亚藩属亦拭目以待。"
 oe_sit2.1.t: "大元中兴局势开启"
 oe_sit2.2.a: "铭记此役，开启新章。"
 oe_sit2.2.d: "历经数十载朝堂博弈与行省整顿，大元中兴局势已见分晓。无论稳固中原还是退守漠北，新的时代秩序均已确立。"
 oe_sit2.2.t: "大元中兴尘埃落定"
 oe_sit2.21.a: "整饬行省民政，安抚州县。"
 oe_sit2.21.b: "收紧怯薛宿卫，严守畿辅。"
 oe_sit2.21.d: "江南与中原的红巾烽烟四起，大元朝政面临生死大考。此刻如何统筹行省民政与大都宿卫，将直接决定朝廷能否稳住局面并步入「大元中兴」。"
 oe_sit2.21.t: "原版局势联动：红巾烽烟与中兴先机"
 oe_sit2.22.a: "因势利导，迅速应变。"
 oe_sit2.22.d: "帖木儿铁骑横扫河中、伊朗与草原边疆，欧亚大陆的战略天平骤然倾斜。君士坦丁堡迎来意料之外的东方喘息，而金帐汗廷与大元西疆则须严阵戒备。"
 oe_sit2.22.t: "原版局势联动：帖木儿崛起震动欧亚"
 oe_sit2.23.a: "遣使周旋两教廷，争取外援。"
 oe_sit2.23.b: "固守正教法统，凝聚国内向心。"
 oe_sit2.23.d: "罗马与阿维尼翁两位教皇并立，拉丁基督教世界陷入旷日持久的分裂。君士坦丁堡既可遣使在两教廷之间纵横斡旋，也可借机彰显正教自主定力。"
 oe_sit2.23.t: "原版局势联动：西方教会大分裂的外交契机"
 oe_sit2.24.a: "重申罗马在意大利的法理存在。"
 oe_sit2.24.b: "稳固亚得里亚与爱奥尼亚海防。"
 oe_sit2.24.d: "列强角逐意大利半岛，旧日拉韦纳督府与大希腊故地再次成为欧陆焦点。帝国可趁半岛群雄纷争重申罗马法理存在，亦可稳守亚得里亚海航路静观其变。"
 oe_sit2.24.t: "原版局势联动：意大利战争与帝国西望"
 oe_sit2.3.a: "召会诸翼，稳固大统。"
 oe_sit2.3.d: "萨莱汗廷威权动摇，诸翼别克与宗王各怀异志。金帐汗国须以雷霆手腕重整凝聚度，否则钦察草原将在五翼自立与周边蚕食中分崩离析。"
 oe_sit2.3.t: "术赤大乱席卷草原"
 oe_sit2.4.a: "草原格局由此重塑。"
 oe_sit2.4.d: "绵延钦察草原的大乱终于告一段落。萨莱汗廷的威权或是浴火重生，或是在诸翼分立中走入新的历史格局。"
 oe_sit2.4.t: "术赤大乱终局已定"
 oe_sit2.5.a: "以学术与礼乐光耀新罗马。"
 oe_sit2.5.d: "君士坦丁堡的典籍馆、学院与工坊重焕生机。希腊学者与意大利城邦的频繁往来，正把古典智慧与正教传统推向环地中海舞台的中心。"
 oe_sit2.5.t: "东罗马文艺复兴兴起"
 oe_sit2.6.a: "薪火相传，万世流芳。"
 oe_sit2.6.d: "跨越爱琴海与亚得里亚海的学术浪潮已结出硕果。君士坦丁堡与地中海诸邦共同见证了古典与人文精神的复兴。"
 oe_sit2.6.t: "地中海文教格局定型"
 oe_sit2.7.a: "整饬边防，应对大局。"
 oe_sit2.7.d: "罗斯统一渐入佳境，波兰—立陶宛阵营与草原、奥斯曼诸强也在东欧大平原上针锋相对。堡垒、哥萨克与合纵外交将决定未来百年的东欧主导权。"
 oe_sit2.7.t: "欧亚双雄与诸侯竞合开启"
 oe_sit2.8.a: "东欧新秩序由此确立。"
 oe_sit2.8.d: "东欧平原与草原边疆的漫长角力尘埃落定，胜出者确立了贯穿森林、河流与大草原的战略优势。"
 oe_sit2.8.t: "东欧三角格局定鼎"
 oe_sit2.90.a: "了解。"
 oe_sit2.90.d: "本读数面板用于离线与实机核查 SIT-2 四大旗舰多国局势（大元中兴、术赤大乱、东罗马文艺复兴、欧亚双雄与诸侯竞合）以及四条零覆写原版局势桥接（红巾军、帖木儿、西方大分裂、意大利战争）的运行与触发接口。"
 oe_sit2.90.t: "SIT-2 旗舰局势与原版桥接总览"
 oe_sit2_bridge_schism_op: "大分裂期教廷游说"
 oe_sit2_ec_border_garrison: "固守东欧边疆要塞"
 oe_sit2_ec_border_garrison_cd: "固守东欧边疆要塞"
 oe_sit2_ec_border_garrison_desc: "支付四个月收入，获得五年「东欧边疆堡垒」修正并为本阵营增加#G +3#!竞合主导度（全局每年最多计入一次）。本国冷却三年。"
