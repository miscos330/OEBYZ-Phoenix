 oe_sit2_ren_map_orth_tt: "受君堡文教辐射的正教诸邦。"
 oe_sit2_ren_sponsor_academy: "资助帝国学院与藏书"
 oe_sit2_ren_sponsor_academy_cd: "资助帝国学院与藏书"
 oe_sit2_ren_sponsor_academy_desc: "东罗马支付四个月收入，提升君堡灯塔度#G +10#!并获得五年「君堡帝国学院」科研与思潮修正。冷却三年。"
 oe_sit2_yr_han_reform: "推行汉法整顿"
 oe_sit2_yr_han_reform_cd: "推行汉法整顿"
 oe_sit2_yr_han_reform_desc: "支付四个月收入，推进大元中兴进度#G +8#!，朝局向汉法更化倾斜，并获得五年「汉法更化整顿」修正。冷却三年。"
 oe_sit2_yr_map_chi_tt: "大元朝廷直辖领土（中兴核心）。"
 oe_sit2_yr_map_nbr_tt: "密切关注大元中兴走向的东亚邻邦。"
 oe_sit2_yr_map_sub_tt: "大元藩属与宗王领地（高丽、吐蕃、诸王与土司）。"
 oe_sit2_yr_steppe_banner: "敕封漠北诸王"
 oe_sit2_yr_steppe_banner_cd: "敕封漠北诸王"
 oe_sit2_yr_steppe_banner_desc: "支付三个月收入，推进大元中兴进度#G +6#!，朝局向漠北国俗倾斜，并获得五年「漠北诸王敕封」修正。冷却三年。"
 oe_sit2_yr_vassal_tribute: "奉表助兴中朝"
 oe_sit2_yr_vassal_tribute_cd: "奉表助兴中朝"
 oe_sit2_yr_vassal_tribute_desc: "藩属与东亚邻邦支付三个月收入，增进双方好感并获得五年「奉表助兴中朝」修正；同时助推大元中兴进度#G +2#!（全局每年最多计入一次）。本国冷却四年。"
 oe_sit2_yuan_tribute_op: "奉表助兴大元"
 oe_sit_byz_renaissance: "东罗马文艺复兴"
 oe_sit_byz_renaissance_desc: "14世纪末以降，君士坦丁堡的古籍抄本、哲学争鸣与艺术工坊在地中海世界激起回响。东罗马皇廷、正教诸邦与意大利城邦在学院资助、思想论衡与学者延聘之间，共同塑造文艺复兴的走向。"
 oe_sit_byz_renaissance_outcome_beacon: "君士坦丁堡灯塔"
 oe_sit_byz_renaissance_outcome_beacon_desc: "君堡文教灯塔度达到85，东罗马成为环地中海无可争议的古典学术中心。"
 oe_sit_byz_renaissance_outcome_flight: "学者西渡"
 oe_sit_byz_renaissance_outcome_flight_desc: "东罗马倾覆，或至1530年君堡未能铸就灯塔，大批希腊学者携典籍西渡意大利诸邦。"
 oe_sit_byz_renaissance_outcome_shared: "地中海共荣"
 oe_sit_byz_renaissance_outcome_shared_desc: "东西交流度达到80且君堡灯塔度不低于45，君士坦丁堡与意大利城邦共享人文黄金时代。"
 oe_sit_eastern_crossroads: "欧亚双雄与诸侯竞合"
 oe_sit_eastern_crossroads_desc: "随着鞑靼枷锁松动与罗斯统一进入后期，东欧大平原迎来三方角力：崛起的罗斯强权、波兰—立陶宛联邦阵营以及草原与奥斯曼势力在漫长边疆上围绕堡垒、哥萨克与盟约展开持久竞合。"
 oe_sit_eastern_crossroads_outcome_balance: "欧亚均势定局"
 oe_sit_eastern_crossroads_outcome_balance_desc: "步入1580年或草原—奥斯曼边疆势力达到80，东欧诸强转入长期均势对峙。"
 oe_sit_eastern_crossroads_outcome_rus: "罗斯统御东欧"
 oe_sit_eastern_crossroads_outcome_rus_desc: "罗斯阵营主导度达到80，确立从森林带到草原边疆的东欧霸权。"
 oe_sit_eastern_crossroads_outcome_west: "波立屏障确立"
 oe_sit_eastern_crossroads_outcome_west_desc: "波立阵营主导度达到80，稳固第聂伯河与东欧平原的主导格局。"
 oe_sit_glh_troubles: "术赤大乱"
 oe_sit_glh_troubles_desc: "别儿迪别之后，金帐汗廷深陷汗位更迭与权臣专政的漩涡。白帐、西伯利亚、花剌子模、喀山与克里米亚五翼蠢蠢欲动，罗斯诸公与波立、东罗马亦紧盯钦察草原的一举一动。"
 oe_sit_glh_troubles_outcome_extinguished: "金帐倾覆"
 oe_sit_glh_troubles_outcome_extinguished_desc: "金帐汗国不复存在，钦察草原的旧秩序彻底终结。"
 oe_sit_glh_troubles_outcome_fractured: "草原裂解"
 oe_sit_glh_troubles_outcome_fractured_desc: "金帐汗国步入第三阶段且凝聚度跌破10，或至1490年凝聚度仍不高于20，草原步入诸汗并立时代。"
 oe_sit_glh_troubles_outcome_revival: "术赤中兴"
 oe_sit_glh_troubles_outcome_revival_desc: "金帐汗国完成重整术赤兀鲁思（阶段4），或持续24个月维持凝聚度不低于85。"
 oe_sit_yuan_restoration: "大元中兴"
 oe_sit_yuan_restoration_desc: "经历动荡考验之后，大元朝廷在中书汉法与漠北国俗之间艰难权衡。本局势与天朝面板「至正中兴考成」联动，诸行省、宗王与东亚藩属正注视着大都的兴衰：唯有统筹财赋、稳固诸王并推进中兴进度，方能续写大元天命。"
 oe_sit_yuan_restoration_outcome_lost: "天命易主"
 oe_sit_yuan_restoration_outcome_lost_desc: "大元政权覆灭，东亚格局由此改写。"
 oe_sit_yuan_restoration_outcome_restored: "大元中兴告成"
 oe_sit_yuan_restoration_outcome_restored_desc: "大元中兴进度达到80或完成至正中兴主线，中原与漠北复归稳固秩序。"
 oe_sit_yuan_restoration_outcome_retreat: "北归漠北"
 oe_sit_yuan_restoration_outcome_retreat_desc: "大都易手或至1415年仍未能完成中兴，大元转入漠北延续汗统。"
