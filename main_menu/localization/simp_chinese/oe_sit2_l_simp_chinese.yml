 STATIC_MODIFIER_DESC_oe_sit2_br_iw_italy_mod: "意大利战火再起，帝国借旧日拉韦纳与南意法理积极介入半岛格局。"
 STATIC_MODIFIER_DESC_oe_sit2_br_iw_vigil_mod: "严密监视意大利列强争锋，稳固爱奥尼亚与亚得里亚海航道。"
 STATIC_MODIFIER_DESC_oe_sit2_br_rtr_guard_mod: "收紧大都与畿辅宿卫防务，以重骑扼守要冲。"
 STATIC_MODIFIER_DESC_oe_sit2_br_rtr_order_mod: "趁红巾未定之际整肃行省军政，安抚州县以备中兴。"
 STATIC_MODIFIER_DESC_oe_sit2_br_schism_diplo_mod: "罗马与阿维尼翁并立之际，帝国遣使周旋两方以换取军援与商约。"
 STATIC_MODIFIER_DESC_oe_sit2_br_schism_ortho_mod: "趁西方教会分裂之际固守东正教法统，凝聚国内教士与民众向心。"
 STATIC_MODIFIER_DESC_oe_sit2_br_timur_byz_mod: "帖木儿大军压境安纳托利亚，使君士坦丁堡获得宝贵的休整与外交窗口。"
 STATIC_MODIFIER_DESC_oe_sit2_br_timur_steppe_mod: "铁骑震动河中与草原，汗廷与边镇加紧备战以应剧变。"
 STATIC_MODIFIER_DESC_oe_sit2_ec_balance_mod: "罗斯、波立与草原诸强在长期拉锯中达成脆弱的边疆均势。"
 STATIC_MODIFIER_DESC_oe_sit2_ec_cossack_mod: "与草原边缘的自由骑兵群体结约互保，以轻骑巡弋绵长疆界。"
 STATIC_MODIFIER_DESC_oe_sit2_ec_envoy_mod: "遣使穿梭于罗斯、波立与黑海诸廷之间，以盟约争取战略纵深。"
 STATIC_MODIFIER_DESC_oe_sit2_ec_garrison_mod: "在森林与草原交界处修建哨堡与军屯，严阵以待多方角力。"
 STATIC_MODIFIER_DESC_oe_sit2_ec_rus_triumph_mod: "罗斯强权在东欧与草原三角博弈中胜出，确立漫长边疆的主导权。"
 STATIC_MODIFIER_DESC_oe_sit2_ec_west_triumph_mod: "波兰与立陶宛诸邦守住第聂伯河防线，稳固东欧天主教与联邦格局。"
 STATIC_MODIFIER_DESC_oe_sit2_glh_autonomy_mod: "地方别克趁汗庭多事扩充部曲与征税权，兀鲁思渐成割据之势。"
 STATIC_MODIFIER_DESC_oe_sit2_glh_fractured_mod: "诸翼各立门户，昔日术赤大汗国步入多汗并立的裂解时代。"
 STATIC_MODIFIER_DESC_oe_sit2_glh_frontier_mod: "罗斯与黑海诸邦借草原大乱之机筑垒整军，逐步削弱汗廷威慑。"
 STATIC_MODIFIER_DESC_oe_sit2_glh_rally_mod: "大汗召会各翼首领重申大扎撒威信，暂遏汗廷分崩之势。"
 STATIC_MODIFIER_DESC_oe_sit2_glh_revived_mod: "大乱终结，萨莱重掌钦察草原与诸翼效忠，威加东欧。"
 STATIC_MODIFIER_DESC_oe_sit2_ren_academy_mod: "皇室资助君士坦丁堡学院抄录古籍、延揽名师，古典与神学并兴。"
 STATIC_MODIFIER_DESC_oe_sit2_ren_beacon_mod: "君士坦丁堡巍然屹立，成为地中海与正教世界共同仰望的学术都城。"
 STATIC_MODIFIER_DESC_oe_sit2_ren_debate_mod: "宫廷主持柏拉图学派与正教静修派对话，提升识字教化与帝国法统。"
 STATIC_MODIFIER_DESC_oe_sit2_ren_flight_mod: "携卷西渡的希腊学人在意大利城邦讲学译经，推动西方人文鼎盛。"
 STATIC_MODIFIER_DESC_oe_sit2_ren_scholars_mod: "东罗马学者与珍本古籍流布城邦，催生人文研习与思潮传播。"
 STATIC_MODIFIER_DESC_oe_sit2_ren_shared_mod: "君士坦丁堡与意大利诸邦互通典籍与工匠，东西人文交相辉映。"
 STATIC_MODIFIER_DESC_oe_sit2_yr_northern_mod: "汗廷退守塞外仍守成吉思汗大统，整顿骑军以图后举。"
 STATIC_MODIFIER_DESC_oe_sit2_yr_reform_mod: "中书省整肃纪纲，推行汉法财政与考成，朝政秩序渐趋稳固。"
 STATIC_MODIFIER_DESC_oe_sit2_yr_restored_mod: "大元渡过鼎革危局，中原与漠北复归一体，国祚得以绵延。"
 STATIC_MODIFIER_DESC_oe_sit2_yr_steppe_mod: "大汗敕封宗王与草原诸翼，巩固怯薛骑军与漠北旧部的效忠。"
 STATIC_MODIFIER_DESC_oe_sit2_yr_tribute_mod: "藩属与邻邦奉表通好，共维东亚朝贡与商路秩序。"
 STATIC_MODIFIER_NAME_oe_sit2_br_iw_italy_mod: "罗马重返意大利"
