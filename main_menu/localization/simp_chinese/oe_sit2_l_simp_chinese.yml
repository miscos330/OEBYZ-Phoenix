 oe_sit2_glh_wing_autonomy_desc: "诸翼别克支付三个月收入，获得五年「翼部扩权自立」修正并削弱金帐凝聚度#R −3#!（全局每年最多计入一次）。本国冷却三年。"
 oe_sit2_ren_debate_patronage: "主持古典与正教辩论"
 oe_sit2_ren_debate_patronage_cd: "主持古典与正教辩论"
 oe_sit2_ren_debate_patronage_desc: "东罗马支付三个月收入，轮换主导学派，提升君堡灯塔度#G +6#!、东西交流度#G +4#!并获得五年「古典与正教论衡」修正。冷却三年。"
 oe_sit2_ren_exchange_op: "君堡—意大利学术往来"
 oe_sit2_ren_invite_scholars: "延聘希腊学者与钞本"
 oe_sit2_ren_invite_scholars_cd: "延聘希腊学者与钞本"
 oe_sit2_ren_invite_scholars_desc: "意大利与正教诸邦支付三个月收入，增进与君堡好感并获得五年「希腊学者与抄本」修正；同时提升东西交流度#G +3#!（全局每年最多计入一次）。本国冷却四年。"
 oe_sit2_ren_map_byz_tt: "东罗马（罗马帝国）古典学术核心。"
