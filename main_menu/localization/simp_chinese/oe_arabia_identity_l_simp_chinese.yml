l_simp_chinese:
 OE_RW_ARABIA: "阿拉伯"
 OE_RW_ARABIA_DESC: "红海的航路、哈伊勒的绿洲与南方的香料港口，正等待帝国作出新的安排。"
 OE_RW_ARABIA_OPEN: "展开阿拉伯行动"
 OE_RW_ARABIA_ACTIONS: "阿拉伯方略"
 OE_RW_ARABIA_HINT: "点击地图，筹划阿拉伯半岛的征服与治理。"
 OE_RW_MECCA: "麦加"
 OE_RW_MECCA_OWNER: "麦加当前的统治者"
 OE_HEG_ARABIA_ACTIONS_HINT: "完成筹划入侵阿拉伯后，可选择远征目标并决定加萨尼王国的命运。"
 oe_heg_plan_arabia: "筹划入侵阿拉伯"
 oe_heg_plan_arabia_desc: "拨付#Y 2000金币#!，将阿拉伯半岛纳入罗马文明圈。此行动只能执行一次，是本面板后续行动的前提。"
 oe_heg_plan_arabia_effect: "花费#Y 2000金币#!，将阿拉伯半岛地区纳入罗马文明圈，解锁后续阿拉伯行动。"
 oe_heg_arabia_plan_done: "已筹划入侵阿拉伯"
 oe_rw_arabia_included: "阿拉伯半岛已纳入罗马文明圈"
 OE_HEG_ARABIA_PLAN_REQUIRED: "已完成“筹划入侵阿拉伯”"
 oe_heg_invade_arabia: "入侵阿拉伯"
 oe_heg_invade_arabia_desc: "花费#Y 200金币#!，选择一个首都位于阿拉伯半岛、且不属于东罗马附属体系的国家，获得夺取其首都的宣战借口。"
 oe_heg_invade_arabia_effect: "花费#Y 200金币#!，获得针对所选国家的#Y 夺取首都#!宣战借口。"
 oe_heg_restore_ghassanids: "复兴加萨尼王国"
 oe_heg_restore_ghassanids_desc: "花费#Y 1000金币#!与#Y 25政治影响力#!，决定加萨尼王国的疆域与地位：支持其统合阿拉伯，或只在哈伊勒设立边疆领。此行动只能完成一次。"
 oe_heg_restore_ghassanids_effect: "花费#Y 1000金币#!与#Y 25政治影响力#!，触发决定加萨尼王国未来的事件。"
 oe_heg_ghassanids_restored: "加萨尼王国已复兴"
 oe_heg_ghassanids_pending: "正在议定加萨尼王国的地位"
 OE_HEG_ARABIA_DIRECT_LAND_REQUIRED: "东罗马在阿拉伯半岛直接拥有至少一个可征服地点"
 OE_GHASSANID_HAIL_REQUIRED: "东罗马在哈伊勒地区直接拥有至少一个可征服地点"
 OE_GHASSANID_KINGDOM: "加萨尼"
 OE_GHASSANID_KINGDOM_ADJ: "加萨尼"
 oe_arabian_kingdom: "阿拉伯附庸王国"
 oe_arabian_kingdom_desc: "奉帝国为宗主的阿拉伯王国，以教会、绿洲与商路维系半岛各地。其自治与外交义务沿用黑海王国的制度。"
 oe_unify_arabia: "统一阿拉伯"
 oe_unify_arabia_desc: "加萨尼的王冠获得帝国的支持，地方总督与军伍将散落的绿洲和港口联结于同一秩序之下。"
 oe_conquer_arabia: "彻底征服阿拉伯人"
 oe_conquer_arabia_desc: "帝国选择亲自掌握阿拉伯的疆土，以军队和法度巩固来之不易的征服。"
 oe_ghassanid_restoration.1.t: "沙海上的王冠"
 oe_ghassanid_restoration.1.d: "从红海沿岸到内陆绿洲，商旅带来了同一个问题：胜利之后，谁将维持道路、井泉与城镇的秩序？加萨尼之名重新出现在帝国的诏书上，古老的盟约也被赋予了新的意义。\n\n宫廷中的一派主张扶植一个信奉正教的阿拉伯王国，将帝国在半岛的领地交付其统合；另一些人则坚持，罗马的征服必须由罗马亲自治理，加萨尼的职责只应是守卫哈伊勒的绿洲与商道。王冠已经备妥，但它的分量仍由我们决定。"
 oe_ghassanid_restoration.1.a: "我们支持加萨尼建立一个统一的阿拉伯王国。"
 oe_ghassanid_restoration.1.b: "我们必须亲自统治阿拉伯。"
 OE_GHASSANID_UNIFIED_EFFECT: "将阿拉伯半岛全部东罗马直属地点交予#Y 加萨尼王国#!：东正教、罗马文化组的阿拉伯文化、王国等级，成为#Y 阿拉伯附庸王国#!。王国获得永久修正#Y 统一阿拉伯#!，并开启持续#Y 30年#!的阿拉伯文化认同运动。"
 OE_GHASSANID_FRONTIER_EFFECT: "仅将哈伊勒地区的东罗马直属地点交予#Y 加萨尼王国#!：东正教、罗马文化组的阿拉伯文化、王国等级，成为#Y 罗马边疆领#!。东罗马获得永久修正#Y 彻底征服阿拉伯人#!。"
 oe_georgian_greek_culture: "格鲁吉亚"
 oe_arabian_greek_culture: "阿拉伯"
 OE_RW_ASSIM_GEORGIA_TITLE: "开启格鲁吉亚文化认同运动"
 OE_RW_ASSIM_GEORGIA_ROW: "格鲁吉亚文化"
 OE_RW_ASSIM_GEORGIA_FLAVOR: "高加索的修院与城垒曾守护自身的文字和信仰。如今山间道路重新通向帝国的港口，贵族子弟在共同的军伍中服役，学舍与法庭也开始诉诸同一套法度。格鲁吉亚的记忆将以自己的名字融入罗马。"
 OE_RW_ASSIM_GEORGIA_CONDITION: "东罗马及其各级附属国拥有格鲁吉亚地区至少80%的可征服地点；军事占领不算。"
 OE_RW_ASSIM_GEORGIA_NOT_STARTED: "尚未成功开启格鲁吉亚文化认同运动"
 OE_RW_ASSIM_GEORGIA_SOURCES: "转化[ShowCultureName('georgian_culture')]人口。"
 OE_RW_ASSIM_GEORGIA_TARGET: "逐步形成罗马文化组中的[ShowCultureName('oe_georgian_greek_culture')]文化，仅在东罗马及其各级附属国境内有来源文化人口的地点传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_GEORGIA_WAITING: "尚未开启"
 OE_RW_ASSIM_GEORGIA_STARTED: "已开启：格鲁吉亚"
 OE_RW_ASSIM_GEORGIA_VALID_ORIGIN: "格鲁吉亚地区至少有一处东罗马或其附属国拥有且仍有格鲁吉亚文化人口的地点"
 OE_RW_ASSIM_GEORGIA_PROGRESS: "当前拥有：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_georgia_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_georgia_total')|0]；开启需至少[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_georgia_required')|0]处。"
 oe_georgia_identity_movement: "格鲁吉亚文化认同运动"
 oe_georgia_identity_movement_desc: "$OE_RW_ASSIM_GEORGIA_FLAVOR$\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_arabia_identity_movement: "阿拉伯文化认同运动"
 oe_arabia_identity_movement_desc: "加萨尼的王冠将绿洲、港口与商道重新联结。半岛各族居民在共同的服役、求学与礼拜中，逐步形成罗马文化组中的阿拉伯认同。仅同化半岛阿拉伯文化组人口，仅在东罗马及其各级附属国境内传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_armenia_identity_starts: "亚美尼亚认同运动已开启次数"
 oe_armenia_two_start_timer: "亚美尼亚认同运动期限"
