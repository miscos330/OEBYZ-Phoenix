l_simp_chinese:
 oe_rights_city_of_worlds_desire: "世界渴望之城"
 oe_rights_city_of_worlds_desire_desc: "灾厄的灰烬已经冷却，海峡两岸的钟声又为帝国而鸣。从远方而来的商旅、学者与工匠，把各自的财富和技艺带进这座城；君士坦丁波利斯将再度成为万民向往的都城。凤凰涅槃灾难结束后，仅可授予君士坦丁波利斯。"
 oe_rights_metropolis: "大都会"
 oe_rights_metropolis_desc: "首都的规模已不能用寻常城镇的章程约束。重新划分街区、调整粮食配给，并为市民行会保留更多营业与居住空间，使繁复庞大的都城仍能井然运转。凤凰涅槃灾难结束后，仅可授予君士坦丁波利斯。"
 OE_CITY_PHOENIX_ENDED_TT: "已结束凤凰涅槃灾难"
 OE_WORKS_EGYPT_OPEN: "点击查看埃及的帝国工程"
 OE_WORKS_EGYPT_FLAVOR: "尼罗河的涨落养育着田野，也决定了远方首都的面包。整治堤渠、清点田亩、重建粮仓，让埃及的收成沿海路抵达君士坦丁波利斯。所有行动均要求东罗马直接拥有埃及地区的全部可征服地点。"
 OE_WORKS_EGYPT_PROGRESS: "运河工程：#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_egypt_canals_used')|0] / 3#!"
 OE_WORKS_EGYPT_OWNED_TT: "东罗马直接拥有埃及地区全部可征服地点（附属国持有不计入）"
 OE_WORKS_EGYPT_CANAL_COOLDOWN_TT: "距离上次修缮运河已满五年"
 OE_WORKS_EGYPT_THREE_CANALS_TT: "修缮运河累计执行不足三次"
 oe_works_egypt_plan: "在埃及规划粮食增产"
 oe_works_egypt_plan_desc: "投入#Y 5000金币#!，为全部埃及农业地点添加一层永久的#Y 埃及粮食增产#!。只能执行一次。\n\n埃及农业地点：下埃及（排除亚历山大省）与上埃及境内，沿尼罗河及其支流、地点等级为农村、原材料属于食物型商品、纤维作物或糖的本国地点。"
 oe_works_aswan: "修缮阿斯旺大坝"
 oe_works_aswan_desc: "完成粮食增产规划后，投入#Y 10000金币#!开始修缮阿斯旺大坝。#Y 五年#!后触发竣工事件，在仍由本国拥有的锡尼（阿斯旺）建成大坝，并为全部本国埃及农业地点增加一层#Y 埃及粮食增产#!。只能执行一次。"
 oe_works_egypt_supply: "君士坦丁波利斯粮食供应"
 oe_works_egypt_supply_desc: "完成粮食增产规划后，投入#Y 2000金币#!开通埃及粮食运输，在帝国柱石的帝国财政页面解锁#Y 埃及粮食供应#!拉条。以亚历山大市场正的月度粮食盈余乘以所选比例作为计划量，从上下埃及的本国省份粮仓汇集粮食，直接运入君士坦丁波利斯所在省份的粮仓。每实际入库#Y 100粮食#!花费#Y 1金币#!。只能执行一次。"
 oe_works_egypt_canal: "修缮运河"
 oe_works_egypt_canal_desc: "完成粮食增产规划后，选择下埃及的一处埃及农业地点，花费#Y 5000金币#!解锁并开始修建一级#Y 埃及运河#!，不另收建筑启动费用。使用原版基础设施工期。\n\n每处地点仅可选择一次，冷却#Y 五年#!，累计最多#Y 三次#!。第三次执行时，为全部埃及农业地点再增加一层#Y 埃及粮食增产#!。"
 oe_works_egypt_smallholders: "保护小农"
 oe_works_egypt_smallholders_desc: "完成粮食增产规划并拥有#Y 耕者有其田#!特权后，为全部埃及农业地点增加一层#Y 埃及粮食增产#!及永久修正#Y 保护埃及小农#!。\n\n本行动只能执行一次，与“与大地主合作”互斥，无额外花费。"
 oe_works_egypt_landowners: "与大地主合作"
 oe_works_egypt_landowners_desc: "完成粮食增产规划并拥有#Y 尊卑有序#!特权后，为全部埃及农业地点增加一层#Y 埃及粮食增产#!及永久修正#Y 与埃及地主合作#!。\n\n本行动只能执行一次，与“保护小农”互斥，无额外花费。"
 oe_works_egypt_canal_choose: "选择下埃及的农村农业地点"
 oe_works_egypt_canal_none: "@trigger_no!下埃及没有符合条件且尚未选作运河工地的本国农业地点。"
 OE_EGYPT_ADD_FOOD_LAYER_TT: "全部本国埃及农业地点增加一层永久“埃及粮食增产”：本地食物产出#G +10%#!、原材料上限#G +10%#!、原材料产出#G +10%#!。"
 OE_EGYPT_SMALLHOLDERS_TT: "全部本国埃及农业地点获得永久“保护埃及小农”：农民阶层力量#G +100%#!、贵族阶层力量#R −50%#!、王室力量#R −10%#!、原材料产出#G +10%#!。"
 OE_EGYPT_LANDOWNERS_TT: "全部本国埃及农业地点获得永久“与埃及地主合作”：贵族阶层力量#G +33%#!、王室力量#G +100%#!。"
 OE_EGYPT_SUPPLY_UNLOCK_TT: "在帝国柱石的帝国财政页面解锁“埃及粮食供应”拉条。"
 oe_egypt_food_expansion: "埃及粮食增产"
 oe_egypt_food_expansion_desc: "整修的水利、重新丈量的田亩与稳定的运粮制度，让尼罗河的馈赠变为更丰足的收成。每完成一项相关工程或土地政策，效果可再增加一层。"
 oe_egypt_protect_smallholders: "保护埃及小农"
 oe_egypt_protect_smallholders_desc: "帝国确认小农的田产与用水权，限制大庄园侵占，使亲自耕作的人得以保有收成。"
 oe_egypt_cooperate_landowners: "与埃及地主合作"
 oe_egypt_cooperate_landowners_desc: "大庄园主承担堤渠、仓储与征粮的责任，皇室则通过契约与监督把地方田产纳入帝国秩序。"
 oe_aswan_dam: "阿斯旺大坝"
 oe_aswan_dam_desc: "位于锡尼的堤坝、闸门与守备设施共同约束水流、守护河道。雇佣3000名劳工；本地驻军规模+1000、要塞防御+33%、邻近度效率+50%。"
 oe_egypt_canal: "埃及运河"
 oe_egypt_canal_desc: "将尼罗河水引向乡间田亩的灌溉与运输水道。雇佣1000名劳工；本地食物产出+50%、原材料上限+50%、市场接入度+10%。"
 oe_aswan_dam_maintenance: "阿斯旺堤坝管理"
 oe_egypt_canal_maintenance: "埃及运河管理"
 oe_egypt_works.1.t: "开始修缮阿斯旺大坝"
 oe_egypt_works.1.d: "从三角洲到锡尼，丈量河岸的绳索与记载水位的石柱已重新归入帝国官员的簿册。工程师将在南方整修堤坝与闸道，石匠加固岸基，劳工清除淤积；当地守军负责保护往来的工匠与粮船。\n\n这项工程需要五年。若能使河水更有节制地进入田渠，尼罗河的丰饶便不再只取决于一次及时的涨水。"
 oe_egypt_works.1.a: "让河水滋养帝国。"
 oe_egypt_works.2.t: "阿斯旺大坝竣工"
 oe_egypt_works.2.d: "五年的丈量、凿石与清淤终于告一段落。锡尼送来了工程的最后一册账目：堤岸已经加固，闸道得到整治，河上的守望点也有了固定驻军的营舍。\n\n只要这段河岸仍握在帝国手中，新设施就能投入使用。沿河的农户开始按照修订的水程引水入田，粮商则准备迎接更充裕的收成。南方的一道堤坝，把埃及的田野与首都的粮仓联系得更加紧密。"
 oe_egypt_works.2.a: "愿丰收沿着河流与海路而来。"
 oe_pillars_egypt_food_budget: "埃及粮食供应"
 oe_pillars_egypt_food_budget_desc: "0%不运输，100%以亚历山大市场全部正的月度粮食盈余作为计划量，比例线性变化。实际从上下埃及的本国省份粮仓按库存比例出粮，运入君士坦丁波利斯所在省份的粮仓，每实际入库100粮食支付1金币。运输受埃及省粮仓存粮、首都省剩余库容及可支付运费限制；不直接修改市场粮食储备。两座城市须由东罗马拥有，亚历山大须仍是市场中心。每月结算一次。"
 OE_EGYPT_SUPPLY_PREVIEW: "埃及省粮仓合计：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_source_food')|2] 粮食\n首都省粮仓：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_destination_food')|2] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_destination_capacity')|2]\n预计运输 [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_amount')|2] 粮食／月\n预计运费 [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_cost')|2]@gold!／月"
 OE_EGYPT_SUPPLY_HINT: "上次实际入库：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_last_shipment_display')|2] 粮食，花费 [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_last_bill_display')|2]@gold!。\n每100粮食支付1金币；按省份粮仓实际增加量结算。"
