# NEW 2026-11-22 v11.5 Worker 2 (oe_ind_). Generated by gen_v115_india.py; edit the generator, not this file.
 oe_ind_bhakti_devotion_school: "虔诚派"
 oe_ind_bhakti_devotion_school_desc: "游方的诗人圣者用各地的方言歌颂神明，主张人人都可以凭虔诚得救，不问种姓出身。"
 oe_ind_srirangam_vaishnava_school: "斯里兰甘毗湿奴经院"
 oe_ind_srirangam_vaishnava_school_desc: "以斯里兰甘大神庙为中心的毗湿奴派经院，神庙的田产、仓廪与祭仪井然有序，是南方王权的支柱。"
 oe_ind_sulh_i_kul_school: "普世和平"
 oe_ind_sulh_i_kul_school_desc: "君主召集各教学者同堂论道，宣布对一切信仰一视同仁。只有次大陆的国家可以采用。"
 oe_ind_ibadat_khana_grand_bazaar: "论道殿与总商栈"
 oe_ind_ibadat_khana_grand_bazaar_desc: "一座供各教学者论道的殿堂，连着大干道上的总商栈。只能建在德里、阿格拉、毗奢耶那伽罗、苏拉特、高尔、松纳尔冈、戈尔康达、拉合尔与科泽科德，每地一座；建在首都时另有全国加成。需要“银卢比与大干道”科技。"
 oe_ind_ibadat_khana_grand_bazaar_maint: "日常维护"
 oe_ind_imperial_service_law: "军政封邑"
 oe_ind_imperial_service_law_desc: "将领靠什么养兵：是世代掌管的军事封邑，还是随官阶授予、可以收回的俸地。"
 oe_ind_pol_nayankara_amaram: "纳亚卡军事封邑"
 oe_ind_pol_nayankara_amaram_desc: "把土地分授给将领，要求他们按额供养步兵、骑兵与战象，并向王室纳贡。"
 oe_ind_pol_mansabdari_zat_sawar: "曼萨布达尔官阶"
 oe_ind_pol_mansabdari_zat_sawar_desc: "每个官员有两个品级：一个定俸禄，一个定须常备的骑兵数目。俸地不世袭，定期调换。"
 oe_ind_monsoon_maritime_law: "季风海权与商港"
 oe_ind_monsoon_maritime_law_desc: "季风把各国的商船送到我们的港口。是敞开大门，还是武装护航？"
 oe_ind_pol_open_monsoon_ports: "万国自由商港"
 oe_ind_pol_open_monsoon_ports_desc: "不问来路，照章纳税即可贸易。"
 oe_ind_pol_armed_anti_cartaz: "武装护航"
 oe_ind_pol_armed_anti_cartaz_desc: "商船结队而行，由战船护送，不向任何外人购买通行证。"
 oe_ind_vijayanagara_nayankara_reform: "纳亚卡体制"
 oe_ind_vijayanagara_nayankara_reform_desc: "王室、神庙与各地纳亚卡将领三方相维：将领养兵纳贡，神庙管理田产，王室居中调度。"
 oe_ind_grand_trunk_bureaucracy_reform: "大干道与银卢比"
 oe_ind_grand_trunk_bureaucracy_reform_desc: "修通横贯北方的大干道，沿途设驿站客栈；统一铸造成色足的银卢比，按实测田亩征税。"
 oe_ind_priv_rajput_jagir_alliance: "拉其普特盟约"
 oe_ind_priv_rajput_jagir_alliance_desc: "与拉其普特诸王联姻，保留他们的祖地，授予高阶官职，换取他们的骑兵。"
 oe_ind_priv_gujarati_maritime_guilds: "海商行帮"
 oe_ind_priv_gujarati_maritime_guilds_desc: "承认西海岸各港海商行帮的自治与旧例，他们的船往来于红海与香料群岛之间。"
 oe_ind_adv_warhorse_monsoon_network: "战马与胡椒"
 oe_ind_adv_warhorse_monsoon_network_desc: "南方养不出好马。用胡椒与宝石，从海湾换回一船船战马。"
 oe_ind_adv_tulughma_field_artillery: "炮车阵与两翼包抄"
 oe_ind_adv_tulughma_field_artillery_desc: "正面用连起来的炮车顶住，骑兵从两翼包抄。"
 oe_ind_adv_rupee_grand_trunk: "银卢比与大干道"
 oe_ind_adv_rupee_grand_trunk_desc: "统一的银币与通畅的大路。解锁建筑“论道殿与总商栈”。"
 oe_ind_adv_deccan_rocket_batteries: "铁壳火箭"
 oe_ind_adv_deccan_rocket_batteries_desc: "用铁筒装药的火箭射得更远，成排施放，声势骇人。"
 oe_ind_player_only_tt: "只有玩家操控的国家可以使用"
 oe_ind_dec_delhi_grand_trunk_salvage.title: "整顿大干道与币制"
 oe_ind_dec_delhi_grand_trunk_salvage.desc: "修复德里通往各省的大路，重铸足色银币，稳住动摇的苏丹国。需要拥有德里；花费 200 金币，稳定度 +1，效果持续 20 年。"
 oe_ind_dec_delhi_grand_trunk_salvage.a: "整顿"
 oe_ind_dec_vij_warhorse_charter.title: "军马换胡椒特许"
 oe_ind_dec_vij_warhorse_charter.desc: "特许海商以胡椒与宝石从海湾换回战马。需要信奉印度教并有港口；花费 150 金币，效果持续 15 年。若已奉立化身，另得神庙与海贸加成。"
 oe_ind_dec_vij_warhorse_charter.a: "颁给特许"
 oe_ind_dec_diu_anti_cartaz_league.title: "缔结抗通行证海盟"
 oe_ind_dec_diu_anti_cartaz_league.desc: "联合沿海各邦与红海的盟友，拒绝外人在印度洋上推行的通行证制度。需要有港口，并且通行证制度已经推行或已到 1500 年；花费 200 金币，效果持续 20 年。"
 oe_ind_dec_diu_anti_cartaz_league.a: "缔盟"
 oe_ind_dec_mughal_ibadat_khana.title: "诏开论道殿"
 oe_ind_dec_mughal_ibadat_khana.desc: "召集各教学者到宫中论道。需要信奉伊斯兰教，并且已到 1550 年或已有“银卢比与大干道”科技；花费 200 金币，效果持续 20 年。若已有曼萨布达尔征召科技，骑兵另得加成。"
 oe_ind_dec_mughal_ibadat_khana.a: "下诏"
 oe_ind_dec_bengal_calico_silver_sink.title: "扶持棉纺外销"
 oe_ind_dec_bengal_calico_silver_sink.desc: "扶持孟加拉与古吉拉特的棉纺，并在首都市场上掀起一阵印花棉布热。需要拥有高尔、松纳尔冈、苏拉特或坎贝之一；花费 200 金币，效果持续 20 年。"
 oe_ind_dec_bengal_calico_silver_sink.a: "扶持"
 oe_ind.1.title: "德里的十字路口"
 oe_ind.1.desc: "德里苏丹国历经连番南征北战，疆域已铺展得太过辽阔，政令自恒河平原传至德干与孟加拉动辄数月。眼见中枢鞭长莫及，远方手握重兵的总督一个接一个称王自立、截留岁赋；国库与禁军的力量捉襟见肘，朝廷必须抉择是强行远征压服，还是战略收缩以固根本。"
 oe_ind.1.a: "发兵压服"
 oe_ind.1.b: "收缩，守住根本之地"
 oe_ind.2.title: "纳亚卡大会"
 oe_ind.2.desc: "金秋九夜节大典将至，镇守王国各省的纳亚卡军事领主们率领庞大仪仗齐集王都。象队披红挂彩，骑兵甲胄鲜明，车队载满各地岁贡与珍宝，众将在宏伟石台前依次向国王行礼效忠、校阅军容，展现南方帝国的赫赫声威与军政向心力。"
 oe_ind.2.a: "厚赏诸将"
 oe_ind.2.b: "核查他们的兵额"
 oe_ind.3.title: "战马换胡椒"
 oe_ind.3.desc: "常年往来阿拉伯海的海商密报御前：波斯湾与阿拉伯沿岸的马贩愿每年乘季风运来大批体格骏伟的阿拉伯与波斯战马，供我军充实重骑主力，条件是朝廷须将本国盛产的黑胡椒独家收购权授予他们。此约关乎军备与财赋，须审慎权衡。"
 oe_ind.3.a: "答应他们"
 oe_ind.3.b: "马要买，胡椒卖给出价高的"
 oe_ind.4.title: "比达尔的宰相"
 oe_ind.4.desc: "来自波斯的新贵与本地的德干贵族势同水火。宰相提议把各省一分为二，削减总督的兵权，两派都安插人手。"
 oe_ind.4.a: "支持宰相的改革"
 oe_ind.4.b: "不可得罪本地贵族"
 oe_ind.5.title: "河间之地"
 oe_ind.5.desc: "夹在克里希纳河与通加巴德拉河之间的赖丘尔河间之地，历来以沃土千顷、灌溉丰饶及坚城耸立闻名德干，南北两大强国为争夺这片富庶走廊已血战整整百年。如今边疆斥候急报，对岸敌军又在悄然集结象队与步骑，大战一触即发。"
 oe_ind.5.a: "先发制人"
 oe_ind.5.b: "加固城堡"
 oe_ind.6.title: "海上来了陌生的帆"
 oe_ind.6.desc: "挂着陌生十字旗、船舷密布重炮的西方高桅大船闯入了印度洋的传统航道。这群远道而来的武装商队傲慢宣称自己掌控这片海域的通航大权，凡未向其港口购买通行证的商船一律视作私船扣押乃至炮击击沉，沿海商邦一片哗然。"
 oe_ind.6.a: "绝不买证"
 oe_ind.6.b: "暂且买证，保住贸易"
 oe_ind.7.title: "海上决战"
 oe_ind.7.desc: "联军的舰队已经集结：沿海各邦的桨帆船，加上红海盟友派来的战舰。敌人的大船炮多而高大。在哪里打？"
 oe_ind.7.a: "引他们进浅水近战"
 oe_ind.7.b: "守港，凭岸炮相持"
 oe_ind.8.title: "火炮改变了战场"
 oe_ind.8.desc: "北方的一场大战里，一方用连起来的炮车顶住正面，骑兵从两翼包抄，以少胜多。各国的将领都在议论这一仗。"
 oe_ind.8.a: "照此练兵"
 oe_ind.8.b: "战象仍是我们的长处"
 oe_ind.9.title: "册立官阶"
 oe_ind.9.desc: "朝廷推行全新的品阶兵额制度后，每一位封臣官员的官阶高低、俸禄采邑以及须常备供养的骑兵数额皆已逐条登记入册。然而巡察御史暗访回报，不少贪婪官员竟在点验时借马充数、虚报兵额，坐领丰厚俸禄却私吞军饷，亟待整肃。"
 oe_ind.9.a: "烙马点验，严查虚冒"
 oe_ind.9.b: "不必过苛"
 oe_ind.10.title: "论道殿"
 oe_ind.10.desc: "各教的学者齐集殿中，在君主面前彻夜辩论。争到激烈处，几乎动起手来。君主听完，要作一个决断。"
 oe_ind.10.a: "对一切信仰一视同仁"
 oe_ind.10.b: "听听而已，仍守旧章"
 oe_ind.11.title: "细棉布与白银"
 oe_ind.11.desc: "来自波斯湾、红海、南洋乃至遥远欧洲的各国商船挤满了沿海港湾的泊位，客商们挥舞着一箱箱雪亮白银，争先恐后地抢购本地细腻如雾的细棉布与色彩斑斓的印花布。订单如雪片般飞来，各大织坊昼夜赶工，熟手织工已然供不应求。"
 oe_ind.11.a: "多设织坊"
 oe_ind.11.b: "提高关税"
 oe_ind.12.title: "斯里兰甘的大祭"
 oe_ind.12.desc: "坐落于高韦里河心岛上的斯里兰甘毗湿奴大神庙迎来盛大祭典，七重高塔彩旗招展，鼓乐梵呗响彻河谷，来自四面八方的朝圣信众乘舟沿河云集。大祭司与经院高僧恭谨遣使入宫，恳请国王亲临主持仪典并慷慨布施庙产以佑国祚。"
 oe_ind.12.a: "亲临布施，奉斯里兰甘经院为宗"
 oe_ind.12.b: "遣使致意"
 oe_ind.12.c: "请游方的诗人圣者入宫讲唱，改宗虔诚派"
 oe_ind.13.title: "古塔与圣树"
 oe_ind.13.desc: "帝国疆域深处尚存数座建于千年前的古老佛塔、石窟与菩提圣树遗址。历经沧桑变迁，这些昔日香火鼎盛的圣地如今已断壁残垣、荒草没膝，唯有不远万里徒步而来的异域朝圣僧侣仍铭记其名、前来顶礼膜拜。朝廷正议论是否拨款加以修缮。"
 oe_ind.13.a: "修缮，善待朝圣者"
 oe_ind.13.b: "不必管"
 oe_ind.14.title: "火箭与公司"
 oe_ind.14.desc: "外国公司在沿海的商馆越修越像堡垒。我们的火箭营已经练成，将领们说，是时候让他们明白谁是这里的主人。"
 oe_ind.14.a: "整军备战"
 oe_ind.14.b: "先谈判，限制他们筑城"
 oe_ind.90.title: "【读数】印度洋与次大陆"
 oe_ind.90.desc: "v11.5 印度洋与次大陆读数（1 = 是，0 = 否）：\n· 本国是战区主角 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_protagonist')|0]#!，槽位 91 已运行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_pulses')|0]#! 次\n· 抗通行证海盟已成立 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_league')|0]#!，通行证制度已推行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_cartaz')|0]#!，传教团已东来 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_jesuit')|0]#!\n· 已有曼萨布达尔征召科技 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_mansab')|0]#!，印度教国家已奉立化身 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_avatar')|0]#!，已扶持印度洋棉纺香料产业 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_industry')|0]#!"
 oe_ind.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_ind_v99_avatar_temple_synergy: "神庙与海贸"
 STATIC_MODIFIER_DESC_oe_ind_v99_avatar_temple_synergy: "供奉的化身神庙香火鼎盛，庙产与海贸相得益彰。"
 STATIC_MODIFIER_NAME_oe_ind_grand_trunk_mod: "整顿大干道"
 STATIC_MODIFIER_DESC_oe_ind_grand_trunk_mod: "驿路畅通，银币足色。"
 STATIC_MODIFIER_NAME_oe_ind_warhorse_charter_mod: "军马特许"
 STATIC_MODIFIER_DESC_oe_ind_warhorse_charter_mod: "每年都有战马从海上运来。"
 STATIC_MODIFIER_NAME_oe_ind_nayaka_assembly_mod: "纳亚卡大会"
 STATIC_MODIFIER_DESC_oe_ind_nayaka_assembly_mod: "各地将领齐集王都，重申效忠。"
 STATIC_MODIFIER_NAME_oe_ind_diu_league_mod: "抗通行证海盟"
 STATIC_MODIFIER_DESC_oe_ind_diu_league_mod: "沿海各邦合兵，拒绝向外人购买通行证。"
 STATIC_MODIFIER_NAME_oe_ind_sulh_i_kul_mod: "论道殿"
 STATIC_MODIFIER_DESC_oe_ind_sulh_i_kul_mod: "各教学者在君主面前同堂论道。"
 STATIC_MODIFIER_NAME_oe_ind_mansabdar_muster_mod: "点验官阶骑兵"
 STATIC_MODIFIER_DESC_oe_ind_mansabdar_muster_mod: "按官阶点验骑兵与战马，烙印登记。"
 STATIC_MODIFIER_NAME_oe_ind_calico_silver_mod: "棉布换白银"
 STATIC_MODIFIER_DESC_oe_ind_calico_silver_mod: "远方的白银源源流入，换走成船的细棉布。"
 STATIC_MODIFIER_NAME_oe_ind_cotton_spice_synergy_mod: "棉与香料之利"
 STATIC_MODIFIER_DESC_oe_ind_cotton_spice_synergy_mod: "扶持印度洋棉纺香料产业带来的收益。"
 STATIC_MODIFIER_NAME_oe_ind_rocket_corps_mod: "火箭营"
 STATIC_MODIFIER_DESC_oe_ind_rocket_corps_mod: "专设火箭营，随军施放。"
 STATIC_MODIFIER_NAME_oe_ind_rival_ai_mod: "次大陆强邻"
 STATIC_MODIFIER_DESC_oe_ind_rival_ai_mod: "规则“强化电脑对手”给予的加成。"
