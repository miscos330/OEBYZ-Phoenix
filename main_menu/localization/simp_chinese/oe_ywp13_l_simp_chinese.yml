 oe_ywp13_sanjiao_concord:0 "三教圆融·四等通融"
 oe_ywp13_sanjiao_concord_desc:0 "废除色目汉南隔阂并诏行儒释道三教圆融，极大提振朝廷稳定度投入、教士满意与内阁效率，但引起保守草原宗王勋贵不满并略微削弱轻骑战力。"
 STATIC_MODIFIER_NAME_oe_ywp13_sanjiao_concord:0 "三教圆融·四等通融"
 STATIC_MODIFIER_DESC_oe_ywp13_sanjiao_concord:0 "废除色目汉南隔阂并诏行儒释道三教圆融，极大提振朝廷稳定度投入、教士满意与内阁效率，但引起保守草原宗王勋贵不满并略微削弱轻骑战力。"
 oe_ywp13_imperial_preceptor_order:0 "帝师宣政·宗王护法"
 oe_ywp13_imperial_preceptor_order_desc:0 "依托萨迦帝师、宣政院与草原宗王盟誓确立护法秩序，提振稳定度投入、正统、重骑战力与属国忠诚，但令中原士林有所疏离并略缓学术研究。"
 STATIC_MODIFIER_NAME_oe_ywp13_imperial_preceptor_order:0 "帝师宣政·宗王护法"
 STATIC_MODIFIER_DESC_oe_ywp13_imperial_preceptor_order:0 "依托萨迦帝师、宣政院与草原宗王盟誓确立护法秩序，提振稳定度投入、正统、重骑战力与属国忠诚，但令中原士林有所疏离并略缓学术研究。"
 oe_ywp13_gradual_harmony:0 "渐进宽简·蒙汉调和"
 oe_ywp13_gradual_harmony_desc:0 "借地方减免与渐进扩充科举名额缓和蒙汉隔阂、稳步回升稳定度与异教容忍，但朝廷常年赈恤与恩赏开销相应增加。"
 STATIC_MODIFIER_NAME_oe_ywp13_gradual_harmony:0 "渐进宽简·蒙汉调和"
 STATIC_MODIFIER_DESC_oe_ywp13_gradual_harmony:0 "借地方减免与渐进扩充科举名额缓和蒙汉隔阂、稳步回升稳定度与异教容忍，但朝廷常年赈恤与恩赏开销相应增加。"
 oe_ywp13_heavenly_horse_mod:0 "拂菻天马图·大都文会"
 oe_ywp13_heavenly_horse_mod_desc:0 "周朗所绘《拂菻天马图》与欧阳玄题赞传诵四海，提升大元外交声望、文化影响与陆路商道效率，但大都馆驿赏赐开销随之增加。"
 STATIC_MODIFIER_NAME_oe_ywp13_heavenly_horse_mod:0 "拂菻天马图·大都文会"
 STATIC_MODIFIER_DESC_oe_ywp13_heavenly_horse_mod:0 "周朗所绘《拂菻天马图》与欧阳玄题赞传诵四海，提升大元外交声望、文化影响与陆路商道效率，但大都馆驿赏赐开销随之增加。"
 oe_ywp13_fulin_caravan_mod:0 "拂菻良马御厩与丝路金牌"
 oe_ywp13_fulin_caravan_mod_desc:0 "将远使所献西域骏马悉数编入御厩选育并严核丝路金牌商旅，增进重骑战力与陆路贸易效率，但礼节从简略损外交声望。"
 STATIC_MODIFIER_NAME_oe_ywp13_fulin_caravan_mod:0 "拂菻良马御厩与丝路金牌"
 STATIC_MODIFIER_DESC_oe_ywp13_fulin_caravan_mod:0 "将远使所献西域骏马悉数编入御厩选育并严核丝路金牌商旅，增进重骑战力与陆路贸易效率，但礼节从简略损外交声望。"
 oe_ywp13_phoenix_silk_hostels:0 "大都—君士坦丁堡双凤驿馆"
 oe_ywp13_phoenix_silk_hostels_desc:0 "大都也里可温商队与君士坦丁堡罗马行会互设驿馆，贯通欧亚陆路商旅、学术典籍交流与宗教包容，仅需朝廷常年拨款维持驿政。"
 STATIC_MODIFIER_NAME_oe_ywp13_phoenix_silk_hostels:0 "大都—君士坦丁堡双凤驿馆"
 STATIC_MODIFIER_DESC_oe_ywp13_phoenix_silk_hostels:0 "大都也里可温商队与君士坦丁堡罗马行会互设驿馆，贯通欧亚陆路商旅、学术典籍交流与宗教包容，仅需朝廷常年拨款维持驿政。"
 oe_ywp13_qintian_exchange:0 "钦天监与罗马星历会通"
 oe_ywp13_qintian_exchange_desc:0 "延请罗马与波斯星历学者入值大都钦天监校勘历法，加快科研进程与文化影响，略微触动保守教士群体之疑忌。"
 STATIC_MODIFIER_NAME_oe_ywp13_qintian_exchange:0 "钦天监与罗马星历会通"
 STATIC_MODIFIER_DESC_oe_ywp13_qintian_exchange:0 "延请罗马与波斯星历学者入值大都钦天监校勘历法，加快科研进程与文化影响，略微触动保守教士群体之疑忌。"
 oe_ywp13_1337_zhongshu_fiscal_mod:0 "中书省岁计节流与钞盐统筹"
 oe_ywp13_1337_zhongshu_fiscal_mod_desc:0 "至元开局十年（1337—1347）间，中书省力行岁计节流，暂核朝贡礼赐、整顿盐课钞法并稽核诸路军饷宫费，以解开局财政燃眉之急，代价是宗王勋贵与商贾阶层颇生怨望。"
 STATIC_MODIFIER_NAME_oe_ywp13_1337_zhongshu_fiscal_mod:0 "中书省岁计节流与钞盐统筹"
 STATIC_MODIFIER_DESC_oe_ywp13_1337_zhongshu_fiscal_mod:0 "至元开局十年（1337—1347）间，中书省力行岁计节流，暂核朝贡礼赐、整顿盐课钞法并稽核诸路军饷宫费，以解开局财政燃眉之急，代价是宗王勋贵与商贾阶层颇生怨望。"
 oe_ywp13_dec_four_class_closure.title:0 "颁行四等人制与三教圆融大诏"
 oe_ywp13_dec_four_class_closure.desc:0 "于大都召集怯薛大臣、儒林学士、萨迦帝师与玄教宗师共议国是，了结四等人制与宗教教派之长年隔阂。消耗 #Y 120#! 金币，开启 #Y 《四等人制与三教圆融大诏》#! 抉择事件，为大元确立长期稳定度恢复与教俗共治框架。"
 oe_ywp13_dec_four_class_closure.a:0 "于大都召开四等三教大议"
 oe_ywp13.1.t:0 "四等人制与三教圆融大诏"
 oe_ywp13.1.d:0 "自元初以来，蒙古、色目、汉人、南人之四等差序与宣政院厚俸护法屡致朝野龃龉，遂成稳定度难复之痼疾。如今大都中枢重掌纲纪，群臣上陈三条定鼎长策：若已革除抑汉旧律且汉化深厚，可颁三教圆融、四等通融大诏；亦可尊奉萨迦帝师、宣政院与草原宗王盟誓以固护法大统；或取渐进宽简之道，徐徐调和蒙汉礼法。"
 oe_ywp13.1.a:0 "诏行三教圆融、废除四等隔阂（汉化改制）"
 oe_ywp13.1.b:0 "尊崇萨迦帝师、以宗王护法安天下（草原帝师）"
 oe_ywp13.1.c:0 "渐进宽简、徐开地方科举与蒙汉调和"
 oe_ywp13.2.t:0 "天下诏行·礼教重光"
 oe_ywp13.2.d:0 "大都明诏经驿传遍布漠北与江南郡县，各地府学书院与佛道丛林纷纷勒石纪事。行省奏报乡里渐安、民心回暖，大元正统与地方礼治由此重归稳固。"
 oe_ywp13.2.a:0 "勒石纪功，颁行天下诸路"
 oe_ywp13.2.b:0 "拨款兴办蒙汉书院与僧道义仓"
 oe_ywp13.3.t:0 "至正二年·马黎诺里入朝献天马"
 oe_ywp13.3.d:0 "为答复大都阿速诸将奉诏西使之国书，罗马教宗本笃十二世所遣方济各会特使约翰·马黎诺里途经君士坦丁堡与钦察汗国，历时数载终于抵至上都觐见。使团献上来自拂菻（君士坦丁堡）的雄骏黑骢，举朝叹为天马降世；翰林画师周朗请命作《拂菻天马图》，学士欧阳玄亦愿亲题长赞以记万里通好之盛。"
 oe_ywp13.3.a:0 "命周朗绘《拂菻天马图》，厚赐远使并传檄欧亚"
 oe_ywp13.3.b:0 "将拂菻骏马编入御厩选育，并严核丝路金牌商道"
 oe_ywp13.4.t:0 "大都也里可温与君堡双凤驿馆"
 oe_ywp13.4.d:0 "大元既平海内，西土罗马帝国亦稳守博斯普鲁斯海峡之君士坦丁堡。大都也里可温信众与阿速宿卫联名请奏，愿与君士坦丁堡牧首区及罗马行会互设常驻驿馆，令景德镇瓷器、江南丝帛与罗马玻璃珍玩沿欧亚陆道络绎不绝，重现东西双帝国丝路通商之气象。"
 oe_ywp13.4.a:0 "敕准大都与君士坦丁堡互设双凤通商驿馆"
 oe_ywp13.4.b:0 "延请罗马星历学家与丝商顾问入值钦天监"
