l_simp_chinese:
 OE_RW_HEGEMONY_TAB: "罗马霸业"
 OE_RW_HEGEMONY_DESC: "旧日疆土上的争战终有尽头。越过巴尔干与安纳托利亚，罗马的道路仍通向更远的海岸。"
 OE_RW_END_CONTEST_HEADER: "山河渐定"
 oe_rw_end_contest: "终结乱局"
 oe_rw_end_contest_desc: "城池不再各奉其主，往来于海峡两岸的使节，也逐渐走向同一座宫廷。当巴尔干与安纳托利亚的大部分土地已归于我们及附庸，便可宣告这场群雄竞逐告一段落。\n\n本国及直属、间接附庸须共同拥有两大区合计至少#Y 70%#!的可征服地点。每处地点等量计数；临时军事占领不计入。\n\n执行后，罗马文明圈的#Y 群雄逐鹿#!页面将永久关闭，转入#Y 罗马霸业#!。不消耗金币、内帑、权威或民意，不改变组织领袖及罗马正统归属。\n\n$OE_RW_END_CONTEST_REWARDS$"
 OE_RW_HEGEMONY_THRESHOLD: "本国及直属、间接附庸共同拥有巴尔干与安纳托利亚至少#Y 70%#!的可征服地点"
 OE_RW_HEGEMONY_BEGINS: "罗马文明圈的#Y 群雄逐鹿#!页面永久关闭，#Y 罗马霸业#!开启。"
 OE_RW_HEGEMONY_PROGRESS: "已拥有：#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_owned_locations')|0]#! / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_total_locations')|0] 地点（[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_owned_percent')|1]%）\n终结乱局需要至少#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_hegemony_required_locations')|0]#!地点（70%）。"
 OE_RW_HEGEMONY_COUNT_RULES: "统计完整的#Y 巴尔干大区与安纳托利亚大区#!，不受文明圈成员名单或组织领土地块排除项影响。\n\n计入本国、直属附庸及附庸的附庸实际拥有的地点，每处只计一次。排除海域、湖泊与不可通行地点；仅被军队占领的外国领土不计入。显示比例经过四舍五入，是否达标以所需地点数为准。"
 OE_RW_EGYPT: "埃及"
 OE_RW_EGYPT_DESC: "尼罗河年复一年地滋养田野，亚历山大的港口仍迎送地中海上的商船。河谷的粮食、城市与航路，使这片土地始终牵动着帝国的目光。"
 OE_RW_EGYPT_OPEN: "查看埃及的地区行动"
 OE_RW_EGYPT_HINT: "点击地图，查看埃及的地区行动。"
 OE_RW_ALEXANDRIA: "亚历山大"
 OE_RW_ALEXANDRIA_OWNER: "亚历山大的拥有者：#Y [Country.GetName]#!"
 OE_RW_EGYPT_ACTIONS: "埃及行动"
 OE_RW_EGYPT_EMPTY: "目前没有可用的地区行动。"
 OE_RW_REGION_CLOSE: "关闭"
   OE_RW_REGION_CLOSE_TT: "关闭当前地区详情面板。"
