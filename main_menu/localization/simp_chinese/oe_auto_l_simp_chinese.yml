l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_auto_mod_theme_subsidy: "帝国军区整补拨款"
 STATIC_MODIFIER_DESC_oe_auto_mod_theme_subsidy: "中央政务总控台依据军区缺编状况下拨的年度整补经费，缓解军区赤字并助力补充兵员。"
 STATIC_MODIFIER_NAME_oe_auto_mod_subject_stipend: "宗主恩赏稳藩津贴"
 STATIC_MODIFIER_DESC_oe_auto_mod_subject_stipend: "宗主通过政务续约中心批量发放的标准化稳藩赏赐，改善附庸财税并安抚藩属人心。"
 STATIC_MODIFIER_NAME_oe_auto_mod_prefect_relief: "大区与总督紧急减免贡赋"
 STATIC_MODIFIER_DESC_oe_auto_mod_prefect_relief: "朝廷临时减免陷入财政或忠诚危机的近卫大区与总督区贡赋，换取边藩迅速转危为安。"
 STATIC_MODIFIER_NAME_oe_auto_mod_parliament_ready: "议会召议预备文书"
 STATIC_MODIFIER_DESC_oe_auto_mod_parliament_ready: "枢密院已完成新一届议会提案汇总与议程筹备，随时可于政府面板正式召开议会。"
 oe_auto_human_only_tt: "仅限人类玩家国家"
 oe_auto_console_decision.title: "帝国政务自动化总控台"
 oe_auto_console_decision.desc: "开启帝国政务托管总控台（默认静默关闭，仅对人类玩家生效、对AI零开销）。可分别启用或停用年度基建巡检（2月）、大区与军区补拨托管（3月）、外交附庸修会议会预警续约（6月）及年度账单归档（12月），并自定义国库安全线与年建上限，与第三方基建类MOD零冲突共存。"
 oe_auto_console_decision.a: "打开政务自动化总控台"
 oe_auto_ledger_decision.title: "查阅帝国政务托管年度总账"
 oe_auto_ledger_decision.desc: "随时只读检视当前年度与上一归档年度的自动化托管明细（粮仓、道路、商港市场、学府、军区补拨、外交续约与实时预警条数），并可一键紧急暂停全部托管。"
 oe_auto_ledger_decision.a: "打开年度透明总账"
 OE_QHUD_AUTO: "政务托管"
 OE_QHUD_AUTO_TT: "#T 帝国政务自动化总控台#!\n点击打开政务托管总控台（默认关闭，仅人类玩家生效，对AI零开销；独立控制基建巡检、大区军区补拨、外交附庸续约与年度总账）。"
 oe_auto.1.t: "帝国政务自动化总控台"
 oe_auto.1.d: "#T 总控台当前状态（仅人类玩家 · 默认关闭）#!\n总开关#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_master')|0]#!（0关/1开）  国库现存#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_gold')|0]#!金  安全线#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_floor')|0]#!金  年建上限#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_cap')|0]#!处\n战时基建#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_war_ok')|0]#!（0战时暂停/1允许）  年度弹窗#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_popup')|0]#!（0静音入账/1弹窗提醒）\n\n#T 四大错峰托管引擎（2月 / 3月 / 6月 / 12月）#!\n引擎1（2月行省基建巡检 · 缺粮/修路/商港/学府）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_infra')|0]#!（全额排队建造，零秒建、零借债）\n引擎2（3月近卫大区、总督区与军区整补托管）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_prefect')|0]#!（衔接1月军区补员，年限2藩）\n引擎3（6月外交、附庸、修会与议会到期雷达）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_diplo')|0]#!（当前待办预警#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_total')|0]#!项）\n引擎4（12月年度总账归档 · 历史累计托管）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_life_total')|0]#!次"
 oe_auto.1.a: "切换总开关（开 / 关）"
 oe_auto.1.b: "切换引擎1：2月行省基建自动巡检"
 oe_auto.1.c: "切换引擎2：3月大区总督与军区补拨"
 oe_auto.1.e: "切换引擎3：6月外交附庸修会预警雷达"
 oe_auto.1.f: "配置国库安全线、年建上限与弹窗模式"
 oe_auto.1.g: "打开外交、附庸与修会一键续约中心"
 oe_auto.1.h: "查阅年度透明政务账单总览"
 oe_auto.1.z: "关闭总控台"
 oe_auto.10.t: "政务自动化"
 oe_auto.10.d: "#T 财税安全防线与建造配额#!\n当前国库安全线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_floor')|0]#!金（可选档位：500 / 1500 / 3000 / 5000金；低于安全线或背负国债时绝不自动开工）\n当前年度建造上限：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_cap')|0]#!处/年（可选：2 / 3 / 5处；全部按原价原工期排入原生建造队列）\n战时基建策略：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_war_ok')|0]#!（0=战时自动停建保军费 / 1=战时照常巡检）\n年报与预警通知：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_popup')|0]#!（0=仅静音记录至年度总账 / 1=6月预警与12月年报弹窗）"
 oe_auto.10.a: "切换国库安全线（500 / 1500 / 3000 / 5000金）"
 oe_auto.10.b: "切换年度建造上限（2 / 3 / 5处）"
 oe_auto.10.c: "切换战时基建策略（暂停 / 允许）"
 oe_auto.10.e: "切换弹窗模式（静音入账 / 定期弹窗）"
 oe_auto.10.f: "返回政务自动化总控台"
 oe_auto.10.z: "保存并关闭"
 oe_auto.20.t: "帝国政务预警与一键续约中心"
 oe_auto.20.d: "#T 实时待办雷达扫描（总预警#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_total')|0]#!项 · 国库#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_gold')|0]#!金）#!\n1. 高自由渴望/低忠诚附庸：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_subs')|0]#!国（含不稳大区/总督/军区#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_themes')|0]#!国）\n2. 远洋商站租界契约就绪提示：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_far')|0]#!（0无/1可于远洋决议续约或递交租约）\n3. 低热情宗教修会（热情<35濒临解散）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_orders')|0]#!家\n4. 议会冷却就绪超6个月未召开：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_parl')|0]#!（0正常/1可于政府面板召议）"
 oe_auto.20.a: "一键批量抚慰低忠诚附庸（每藩60金，至多5藩）"
 oe_auto.20.b: "紧急抚慰受困大区、总督区与军区（每藩100金，至多3藩）"
 oe_auto.20.c: "一键向低热情修会拨付香火基金（每家80金，热情+18）"
 oe_auto.20.e: "核准议会召议预备文书（1年立法效率+5%）"
 oe_auto.20.f: "返回政务自动化总控台"
 oe_auto.20.z: "已知悉并记入年度总账"
 oe_auto.90.t: "帝国政务托管年度总账"
 oe_auto.90.d: "#T 托管总控配置（透明账簿）#!\n总开关#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_master')|0]#!  基建#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_infra')|0]#!  大区军区#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_prefect')|0]#!  外交雷达#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_diplo')|0]#!  弹窗#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_popup')|0]#!\n国库#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_gold')|0]#!金  安全线#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_floor')|0]#!金  年建上限#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_cap')|0]#!处  历史累计托管#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_life_total')|0]#!次\n\n#T 本年累计执行明细#!\n行省基建合计#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_total')|0]#!处（粮仓#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_granary')|0]#! / 道路#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_roads')|0]#! / 商港市场#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_trade')|0]#! / 学府#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_edu')|0]#!）\n大区与军区拨款#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_prefect')|0]#!笔  外交续约与预警处置#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_diplo')|0]#!次\n\n#T 上一归档年度明细（公元#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_yr')|0]#!年）#!\n行省基建#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_total')|0]#!处（粮仓#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_granary')|0]#! / 道路#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_roads')|0]#! / 商港市场#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_trade')|0]#! / 学府#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_edu')|0]#!）  军区拨款#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_prefect')|0]#!笔  外交#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_diplo')|0]#!次\n\n#T 当前活跃预警#!\n不稳附庸#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_subs')|0]#!  受困大区军区#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_themes')|0]#!  低热情修会#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_orders')|0]#!  议会待召#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_parl')|0]#!  远洋租约#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_far')|0]#!"
 oe_auto.90.a: "关闭总账"
 oe_auto.90.b: "刷新实时读数"
 oe_auto.90.c: "切换静音日志 / 定期弹窗模式"
 oe_auto.90.e: "打开政务自动化总控台"
 oe_auto.90.f: "清空历史统计数据"
 oe_auto.90.g: "紧急暂停全部自动化托管"
