l_simp_chinese:
 oe_plc_b_krewo_union: "克雷沃联统之盟"
 oe_plc_b_teutonic_rivalry: "普鲁士与萨莫吉希亚宿怨"
 oe_plc_b_orthodox_bridge: "东正教鲁塞尼亚桥梁"
 oe_plc_b_varna_brotherhood: "多瑙河—喀尔巴阡抗敌之谊"
 STATIC_MODIFIER_NAME_oe_plc_eastern_frontier_drive: "鲁塞尼亚东疆开拓"
 STATIC_MODIFIER_DESC_oe_plc_eastern_frontier_drive: "立陶宛与波兰将战略重心投向第聂伯河与黑海北岸通道，边境兵源与声威大增。"
 STATIC_MODIFIER_NAME_oe_plc_crown_commerce_focus: "维斯瓦—涅曼王室商路"
 STATIC_MODIFIER_DESC_oe_plc_crown_commerce_focus: "整顿克拉科夫与维尔纽斯商埠关税，充盈国库并稳固王室财力。"
 STATIC_MODIFIER_NAME_oe_plc_krewo_compact: "克雷沃联合宪约"
 STATIC_MODIFIER_DESC_oe_plc_krewo_compact: "雅德维加与雅盖沃联姻结盟，波兰与立陶宛在拉丁基督教旗帜下共御外侮。"
 STATIC_MODIFIER_NAME_oe_plc_orthodox_lit_if: "东正立陶宛大公国"
 STATIC_MODIFIER_DESC_oe_plc_orthodox_lit_if: "立陶宛保留或转向东正教礼仪，赢得基辅与斯摩棱斯克鲁塞尼亚贵族的广泛效忠。"
 STATIC_MODIFIER_NAME_oe_plc_carpathian_diplomacy: "喀尔巴阡诸王均衡"
 STATIC_MODIFIER_DESC_oe_plc_carpathian_diplomacy: "未与立陶宛合流之际，波兰借重匈牙利与中欧王室联姻维系南部屏障。"
 STATIC_MODIFIER_NAME_oe_plc_great_war_rally: "波立联军总动员"
 STATIC_MODIFIER_DESC_oe_plc_great_war_rally: "王国与大公国尽起骑士与鲁塞尼亚轻骑，直指马尔堡与但泽要冲。"
 STATIC_MODIFIER_NAME_oe_plc_teutonic_crusade: "马尔堡骑士团东征"
 STATIC_MODIFIER_DESC_oe_plc_teutonic_crusade: "西欧骑士云集普鲁士堡垒，誓死捍卫骑士团对波罗的海沿岸的统治。"
 STATIC_MODIFIER_NAME_oe_plc_baltic_truce: "帝国与教廷仲裁停战"
 STATIC_MODIFIER_DESC_oe_plc_baltic_truce: "借罗马教廷与帝国使节斡旋暂缓大战，为整军经武赢得宝贵喘息。"
 STATIC_MODIFIER_NAME_oe_plc_grunwald_ascendant: "格伦瓦尔德大捷余威"
 STATIC_MODIFIER_DESC_oe_plc_grunwald_ascendant: "坦能堡平野击破骑士团精锐，波兰—立陶宛成为东欧不可撼动的头号强权。"
 STATIC_MODIFIER_NAME_oe_plc_marienburg_bulwark: "马尔堡铁壁孤城"
 STATIC_MODIFIER_DESC_oe_plc_marienburg_bulwark: "大团长凭马尔堡坚城顶住联军围攻，保住条顿骑士团在普鲁士的残存威仪。"
 STATIC_MODIFIER_NAME_oe_plc_thorn_reparations: "托伦赔款与边境休养"
 STATIC_MODIFIER_DESC_oe_plc_thorn_reparations: "和约带来的战后赔款与边境安定令农庄商路迅速复苏。"
 STATIC_MODIFIER_NAME_oe_plc_horodlo_heraldry: "霍罗德沃纹章同盟"
 STATIC_MODIFIER_DESC_oe_plc_horodlo_heraldry: "波兰什拉赫塔与立陶宛天主教贵族共佩纹章，大幅巩固两邦上层政治纽带。"
 STATIC_MODIFIER_NAME_oe_plc_ruthenian_friction: "鲁塞尼亚正教贵族离心"
 STATIC_MODIFIER_DESC_oe_plc_ruthenian_friction: "霍罗德沃特权仅限天主教贵族享有，令基辅与东疆正教王公心生疏离。"
 STATIC_MODIFIER_NAME_oe_plc_ruthenian_parity: "鲁塞尼亚诸公对等特许"
 STATIC_MODIFIER_DESC_oe_plc_ruthenian_parity: "赋予基辅与维尔纽斯正教贵族同等参政与封地权利，化解东疆离心隐患。"
 STATIC_MODIFIER_NAME_oe_plc_varna_bulwark: "瓦尔纳十字军遗志"
 STATIC_MODIFIER_DESC_oe_plc_varna_bulwark: "响应匈牙利与巴尔干诸邦呼召，以铁骑东顾黑海与多瑙河防线。"
 STATIC_MODIFIER_NAME_oe_plc_jagiellonian_consolidation: "雅盖隆内政固本"
 STATIC_MODIFIER_DESC_oe_plc_jagiellonian_consolidation: "暂避巴尔干远征风险，专注理顺维斯瓦河与波罗的海沿岸的王室财税。"
 STATIC_MODIFIER_NAME_oe_plc_vistula_grain_boom: "维斯瓦谷物贸易繁荣"
 STATIC_MODIFIER_DESC_oe_plc_vistula_grain_boom: "掌控但泽出海口后，波兰庄园粮食顺维斯瓦河源源运往北海市场，富甲东欧。"
 STATIC_MODIFIER_NAME_oe_plc_prussian_autonomy: "皇家普鲁士自治宪章"
 STATIC_MODIFIER_DESC_oe_plc_prussian_autonomy: "承认普鲁士城市与等级会议的自治特权，以宽政换取波罗的海沿岸长治久安。"
 STATIC_MODIFIER_NAME_oe_plc_sejm_liberties: "《无新法》与瑟姆议会权"
 STATIC_MODIFIER_DESC_oe_plc_sejm_liberties: "王室承诺未经议会同意不立新法，贵族阶层忠诚高涨而王权受宪制约束。"
 STATIC_MODIFIER_NAME_oe_plc_royal_execution_movement: "王领收回与财税整肃"
 STATIC_MODIFIER_DESC_oe_plc_royal_execution_movement: "清查大贵族私占王领并整顿中央官署，强化王国长期财政与行政根基。"
 STATIC_MODIFIER_NAME_oe_plc_lublin_consolidation: "卢布林联邦集权宪制"
 STATIC_MODIFIER_DESC_oe_plc_lublin_consolidation: "波兰王国与立陶宛大公国共设统一瑟姆与共同货币，化作纵贯波罗的海与黑海的东欧巨擘。"
 STATIC_MODIFIER_NAME_oe_plc_golden_liberty: "黄金自由贵族共和国"
 STATIC_MODIFIER_DESC_oe_plc_golden_liberty: "两邦贵族共掌选王与宗教宽容传统，以宽阔包容凝聚多元疆域，翼骑兵威震四方。"
 oe_plc_dec_royal_sejm.title: "召开波立联合瑟姆大会"
 oe_plc_dec_royal_sejm.desc: "召集克拉科夫与维尔纽斯各省代表共议国政，以王室恩赐换取国内安定与两邦凝聚。"
 oe_plc_dec_royal_sejm.a: "颁布联合瑟姆决议"
 oe_plc_dec_ruthenian_charter.title: "颁布鲁塞尼亚正教宽容特许状"
 oe_plc_dec_ruthenian_charter.desc: "承认基辅与维尔纽斯东正教贵族的世袭权益，彻底平息霍罗德沃之后的东疆离心压力。"
 oe_plc_dec_ruthenian_charter.a: "敕封鲁塞尼亚诸公特许状"
 oe_plc_dec_baltic_grain_staple.title: "敕建维斯瓦—但泽谷物专营商埠"
 oe_plc_dec_baltic_grain_staple.desc: "依托但泽或马尔堡出海口整顿河道仓储与商税，将波罗的海粮贸化作长久财源。"
 oe_plc_dec_baltic_grain_staple.a: "确立波罗的海谷物商埠"
 oe_plc.1.t: "蓝水河与鲁塞尼亚东疆"
 oe_plc.1.d: "草原霸权日渐动摇之际，第聂伯河流域的基辅与沃里尼亚通道豁然洞开。克拉科夫与维尔纽斯的廷臣都在权衡：是挥师东进收拢鲁塞尼亚旧土，还是先厚植维斯瓦与涅曼商路、徐图大计？"
 oe_plc.1.a: "挥师东向，经营鲁塞尼亚边疆"
 oe_plc.1.a.tt: "推进波立线至阶段1，获得[ShowModifier('oe_plc_eastern_frontier_drive')]（#Y 20#!年）并加深波兰与立陶宛互信。"
 oe_plc.1.b: "整饬克拉科夫与维尔纽斯王室商路"
 oe_plc.1.b.tt: "推进波立线至阶段1，获得#G +60#!金币与[ShowModifier('oe_plc_crown_commerce_focus')]（#Y 20#!年）。"
 oe_plc.2.t: "克雷沃联合：雅德维加与雅盖沃"
 oe_plc.2.d: "条顿骑士团在波罗的海步步紧逼，波兰王冠急需一位能征善战的共主，立陶宛大公雅盖沃也正站在命运的十字路口。是于克雷沃立约、让立陶宛受洗归入拉丁天主教并与波兰合流，还是另辟蹊径，让立陶宛面向基辅与东正教鲁塞尼亚、两邦分道而行？"
 oe_plc.2.a: "缔结克雷沃联合，立陶宛归入拉丁教会"
 oe_plc.2.a.tt: "走史实联合线：立陶宛改宗天主教，获[ShowModifier('oe_plc_krewo_compact')]（#Y 25#!年），大幅提升波立关系并激化与条顿骑士团对立。"
 oe_plc.2.b: "两邦分治，立陶宛面向东正鲁塞尼亚（架空）"
 oe_plc.2.b.tt: "走架空分流线：立陶宛转向东正教并获[ShowModifier('oe_plc_orthodox_lit_if')]（#Y 30#!年），波兰转向喀尔巴阡外交并获[ShowModifier('oe_plc_carpathian_diplomacy')]（#Y 25#!年）。"
 oe_plc.3.t: "萨莫吉希亚风云与条顿大战"
 oe_plc.3.d: "围绕萨莫吉希亚林地、但泽出海口与马尔堡红砖城堡的积怨终于爆发。骑士团号召西欧各地十字军北上助战，而波兰王国与立陶宛大公国也在维斯瓦河畔吹响了决战号角。"
 oe_plc.3.a: "整军备战，直指马尔堡与波罗的海要冲"
 oe_plc.3.a.tt: "波立诸邦获[ShowModifier('oe_plc_great_war_rally')]（条顿则获[ShowModifier('oe_plc_teutonic_crusade')]），持续#Y 15#!年。"
 oe_plc.3.b: "吁请教廷与帝国使节仲裁停火"
 oe_plc.3.b.tt: "获得#G +50#!金币与[ShowModifier('oe_plc_baltic_truce')]（#Y 12#!年）。"
 oe_plc.4.t: "格伦瓦尔德之战的回响"
 oe_plc.4.d: "坦能堡与格伦瓦尔德的铁蹄震动了整个基督教世界。无论条顿大团长是否守住马尔堡孤城，东欧的均势都已彻底改写——战后如何收官，将决定维斯瓦河与波罗的海沿岸数十年的格局。"
 oe_plc.4.a: "乘胜确立波罗的海霸权"
 oe_plc.4.a.tt: "推进至阶段3，获得#G +15#!威望与[ShowModifier('oe_plc_grunwald_ascendant')]（若条顿守住马尔堡则获[ShowModifier('oe_plc_marienburg_bulwark')]），持续#Y 25#!年。"
 oe_plc.4.b: "接受托伦赔款，休养生息"
 oe_plc.4.b.tt: "推进至阶段3，获得#G +100#!金币、#G +5#!稳定与[ShowModifier('oe_plc_thorn_reparations')]（#Y 20#!年）。"
 oe_plc.5.t: "霍罗德沃联合与鲁塞尼亚贵族问题"
 oe_plc.5.d: "在霍罗德沃会盟上，波兰什拉赫塔提议将纹章与爵位特权授予立陶宛天主教大贵族，以缔结更紧密的邦联。然而在基辅与维尔纽斯以东，人数众多的东正教鲁塞尼亚王公对被排除在特权之外深感不满。"
 oe_plc.5.a: "颁行霍罗德沃纹章宪章，强化天主教贵族纽带"
 oe_plc.5.a.tt: "获得[ShowModifier('oe_plc_horodlo_heraldry')]（#Y 25#!年）；若直辖基辅，基辅将承受[ShowModifier('oe_plc_ruthenian_friction')]（#Y 15#!年）。"
 oe_plc.5.b: "将对等特权扩及东正教鲁塞尼亚王公"
 oe_plc.5.b.tt: "威望#R −5#!，获得[ShowModifier('oe_plc_ruthenian_parity')]（#Y 30#!年）并消除基辅离心压力。"
 oe_plc.6.t: "瓦尔纳回响与雅盖隆十字路口"
 oe_plc.6.d: "多瑙河下游与巴尔干战云密布，匈牙利与君士坦丁堡的求援使者络绎不绝。雅盖隆王室面临抉择：是南下担起基督教世界东翼屏障之责，还是敛锋守成、优先巩固维斯瓦与波罗的海王基？"
 oe_plc.6.a: "南顾多瑙河与黑海，声援匈牙利与罗马"
 oe_plc.6.a.tt: "获得#G +10#!威望与[ShowModifier('oe_plc_varna_bulwark')]（#Y 20#!年），并提升与匈牙利、拜占庭的关系。"
 oe_plc.6.b: "慎避远征损耗，先固维斯瓦与波罗的海根基"
 oe_plc.6.b.tt: "获得#G +5#!稳定与[ShowModifier('oe_plc_jagiellonian_consolidation')]（#Y 20#!年）。"
 oe_plc.7.t: "第二次托伦和约与皇家普鲁士"
 oe_plc.7.d: "历经旷日持久的普鲁士纷争，但泽良港与马尔堡要塞的归属渐趋明朗。维斯瓦河谷的麦船即将直通北海与佛兰德斯，王室必须决定如何治理富庶的普鲁士沿岸城市。"
 oe_plc.7.a: "贯通但泽谷物商路，兴盛皇家普鲁士海贸"
 oe_plc.7.a.tt: "推进至阶段4，获得#G +80#!金币与[ShowModifier('oe_plc_vistula_grain_boom')]（#Y 30#!年）。"
 oe_plc.7.b: "颁赐普鲁士城市与等级会议自治特许"
 oe_plc.7.b.tt: "推进至阶段4，获得#G +8#!稳定与[ShowModifier('oe_plc_prussian_autonomy')]（#Y 30#!年）。"
 oe_plc.8.t: "《无新法》宪章与瑟姆议会兴起"
 oe_plc.8.d: "在拉多姆召开的王国议会上，中小贵族代表与大领主联手要求王室承诺：未经瑟姆同意，不得颁布任何新法。这究竟是东欧宪制共治的基石，还是日后王权旁落的开端？"
 oe_plc.8.a: "签署《无新法》，确立瑟姆宪制共治"
 oe_plc.8.a.tt: "获得#G +6#!稳定与[ShowModifier('oe_plc_sejm_liberties')]（#Y 30#!年，略微降低王室阶层力量）。"
 oe_plc.8.b: "推进王领收回运动，整饬中央财赋"
 oe_plc.8.b.tt: "稳定#R −4#!，获得[ShowModifier('oe_plc_royal_execution_movement')]（#Y 30#!年）。"
 oe_plc.9.t: "卢布林联合：波兰—立陶宛联邦"
 oe_plc.9.d: "面对北方波罗的海争锋与东方莫斯科崛起，波兰王国与立陶宛大公国齐聚卢布林议事厅。从松散的共主联统迈向真正的“两族共和国”，摆在眼前的仍是永恒命题：集权强干，抑或黄金自由？"
 oe_plc.9.a: "缔造集权强干的卢布林统一联邦"
 oe_plc.9.a.tt: "完成波立线（阶段5），稳定#R −5#!，获得[ShowModifier('oe_plc_lublin_consolidation')]（#Y 50#!年）。"
 oe_plc.9.b: "宣示贵族黄金自由与宗教宽容联邦"
 oe_plc.9.b.tt: "完成波立线（阶段5），获得#G +15#!威望与[ShowModifier('oe_plc_golden_liberty')]（#Y 50#!年）。"
 oe_plc.20.t: "波兰—立陶宛：选项生效"
 oe_plc.90.t: "波兰—立陶宛国运总览"
 oe_plc.90.d: "#T 波立主线状态#!\n阶段(0..5) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_stage')|0]  克雷沃路线(1联统/2正教) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_union')|0]  鲁塞尼亚立场(1天主/2对等) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_ruth')|0]  卢布林体制(1集权/2自由) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_lublin')|0]\n#T 调度#!\n已发事件 [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_cnt')|0]  上次运行月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_m')|0]"
 oe_plc.90.a: "关闭"
 oe_plc.90.b: "刷新"
