l_simp_chinese:
 oe_theme_usurp.1.t: "将军抗命"
 oe_theme_usurp.1.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_theme_recall_target').GetCountry.GetName]的将军以边情紧急为由，拒绝进京述职。召令白白发出，宫廷的颜面也受了损。"
 oe_theme_usurp.1.a: "记下这笔账（帝国权威#R −1#!，该军区忠诚#R −5#!）"
 oe_theme_usurp.2.t: "召令激变"
 oe_theme_usurp.2.d: "召令传到[GetCountry('BYZ').MakeScope.GetVariable('oe_theme_recall_target').GetCountry.GetName]时，将军当着使者的面撕碎了诏书。军营里已经在磨刀，下个月他就会起兵。"
 oe_theme_usurp.2.a: "早该料到"
 oe_theme_usurp.3.t: "将军入城"
 oe_theme_usurp.3.d: "叛军占据君士坦丁堡已经#Y 6#!个月，元老院和牧首终于打开了宫门。叛军的将军在圣索菲亚大教堂加冕，旧日的皇室或死或散。从福卡斯到斯克莱罗斯，这样的故事帝国已经见过太多次。"
 oe_theme_usurp.3.a: "新皇登基（合法性降为#Y 30#!，稳定度下降，所有军区忠诚重置为#Y 50#!）"
 oe_theme_usurp.4.t: "军人政变"
 oe_theme_usurp.4.d: "宫廷还在为继承争吵的时候，[GetCountry('BYZ').MakeScope.GetVariable('oe_theme_coup_theme').GetCountry.GetName]的将军带着他的军队进了城。豪族们还没来得及推出自己的人选，紫袍已经披在了一个军人身上。"
 oe_theme_usurp.4.a: "军队选出了皇帝"
 oe_theme_usurp.4.tt: "现任皇帝、继承人和摄政#R 去世#!，将军继位。其军区撤销，军队和金库归帝国所有。其余军区忠诚#R −10#!。"
 OE_THEME_RECALL_RISK_TT: "将军“离心”时有#R 25%#!的可能拒绝（[oe_tu_authority|e]#R −1#!，该军区忠诚#R −5#!）；“叛意”时有#R 30%#!的可能当场起兵。"
 OE_THEME_UI_BTN_DISARM: "兵权"
 OE_THEME_UI_BTN_DISARM_DESC: "收缴兵权：花费#R 3#![oe_tu_authority|e]，这个军区一半的军队（向上取整）改归帝国，当前忠诚#R −10#!；兵力变小后忠诚目标会回升。每个军区#Y 10#!年一次。"
 OE_THEME_UI_AMBITION: "#R 觊觎皇位#!"
 OE_THEME_UI_AMBITION_TT: "这位将军忠诚低于#Y 40#!，军队规模在各军区中排前#Y 3#!。宫廷阴谋发生政变时，有#Y 40%#!由此人带兵篡位。"
 OE_THEME_UI_USURP: "叛军占领君士坦丁堡：#R [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_usurp_months').GetValue|0]#! / #Y 6#!个月（满#Y 6#!个月叛军将军称帝）"
