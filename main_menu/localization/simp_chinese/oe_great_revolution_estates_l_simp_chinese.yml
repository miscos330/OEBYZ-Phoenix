 oe_gr_authority_minus_20_tt: "帝国柱石的#bold 帝国权威#!　#R −20#!（最低0）。"
 oe_gr_rural_locations_tt: "东罗马直接拥有且地点等级为#Y 农村#!的地点："
 oe_gr_revoke_clergy_privileges_tt: "移除并禁用教士特权：#Y 主教公议权、圣山自治、主教巡牧权、讲道与礼仪#!。"
 oe_gr_revoke_noble_privileges_tt: "移除并禁用贵族特权：#Y 紫袍姻亲、世家扈从、宫廷荣衔、贵族海军、边堡守备权#!。"
 oe_gr_peasants_power_law: "平民权力"
 oe_gr_peasants_power_law_desc: "共和国与乡村之间的权力关系。旧帝国为土地、赋役与身份订下的秩序，正接受革命的考验。"
 oe_gr_rural_resistance_policy: "保守势力抵制"
 oe_gr_rural_resistance_policy_desc: "地主、乡绅与依附于旧秩序的村社拒绝配合新政府。征兵簿被藏起，粮车被扣留，首都的命令止于乡村门外。农村地点的人力、征召兵与食物产出均受到影响。"
 oe_gr_rural_ignorance_policy: "蒙昧的乡村"
 oe_gr_rural_ignorance_policy_desc: "自有土地的小农不愿为失势的权贵冒险，也尚未相信遥远首都的新承诺。他们守着田界与粮仓，等待共和国证明自己。"
 oe_gr_clergy_power_law: "教士权力"
 oe_gr_clergy_power_law_desc: "共和国重新界定教会在公共生活与国家政权中的地位。"
 oe_gr_church_noncooperation_policy: "教会拒绝合作"
 oe_gr_church_noncooperation_policy_desc: "教士仍主持礼拜，却不愿替新政府解释其权威从何而来。教区的沉默使共和国的法令失去了熟悉而有力的传播渠道。"
 oe_gr_nobles_power_law: "贵族权力"
 oe_gr_nobles_power_law_desc: "旧帝国显贵与共和国之间尚未解决的权力争端。"
 oe_gr_noble_disloyalty_policy: "权贵拒绝效忠"
 oe_gr_noble_disloyalty_policy_desc: "昔日依靠皇室、庄园与军职立身的家族，拒绝把誓言转献给共和国。军官团的冷淡与贵族网络的阻挠侵蚀着军队。"
 oe_gr_burghers_power_law: "市民权力"
 oe_gr_burghers_power_law_desc: "共和国以城市的行会、商人和自治传统为新的政治支柱。"
 oe_gr_republican_bulwark_policy: "共和砥柱"
 oe_gr_republican_bulwark_policy_desc: "市民把共和国视为参与国家事务的机会。捐款、请愿和市议会的支持，汇成新政权最坚定的依靠。"
 STATIC_MODIFIER_NAME_oe_gr_state_machinery_failure: "运转失灵的国家机器"
 STATIC_MODIFIER_DESC_oe_gr_state_machinery_failure: "官员对新政权的敕令推诿观望，行政、税收与政治协调陷入停滞。此危机不会自动到期。"
 STATIC_MODIFIER_NAME_oe_gr_provincial_defiance: "地方反抗中央政府"
 STATIC_MODIFIER_DESC_oe_gr_provincial_defiance: "行省拒绝承认首都的号令，总督网络与中央控制力受到削弱。此危机不会自动到期。"
 oe_great_revolution.10.t: "乡村保守势力反扑"
 oe_great_revolution.10.d: "共和国的宣言刚越过城门，便被另一套更古老的命令截住。庄园的管事召集佃户，乡绅把村社长老请进厅堂，声称首都推翻的不只是一位皇帝，更是田契、婚约与尊卑赖以成立的秩序。\n\n征兵簿不见了，运粮的车队在路口折返，税吏发现昨日还肯作证的人今天都闭上了嘴。那些依靠旧制度维系生活的人未必热爱宫廷，却知道共和国将要改变什么。我们的旗帜已经升起，乡村仍把门关着。"
 oe_great_revolution.10.a: "共和国的法令必须越过庄园的围墙。"
 oe_great_revolution.11.t: "小农保持观望"
 oe_great_revolution.11.d: "乡村没有像显贵们期待的那样为皇帝举起武器。拥有自己田地的农人记得，是谁曾想收回他们的地契；他们不愿再替地主的荣誉流血。可是，印着“公民”二字的宣言，也没有立刻赢得他们的信任。\n\n村社询问的仍是来年的税额、征役的期限，以及粮仓里还剩多少种子。共和国的理想尚未变成田边可见的安稳。人们照常播种，却把余粮与积蓄藏得更深，等待首都先拿出兑现承诺的证据。"
 oe_great_revolution.11.a: "让他们看见，土地的主人不会再被遗忘。"
 oe_great_revolution.12.t: "教会保持观望"
 oe_great_revolution.12.d: "晨祷依旧响起，讲道台上却没有人解释该如何为共和国祈祷。主教们送来措辞谨慎的书信：教会愿为和平劝诫信众，但不愿仅凭一场首都暴动，就承认新的权威已经取代了受膏的君主。\n\n教区的沉默比公开谴责更难回答。共和国需要他们安抚乡里、登记人口、传递命令，他们却把每一封公函都留待下一次会议。临时政府终于宣布撤回若干旧日特许；教会与国家之间那条熟悉的道路，正在我们脚下断开。"
 oe_great_revolution.12.a: "信仰仍在，旧日的合作已经结束。"
 oe_great_revolution.13.t: "权贵拒绝向新政权效忠"
 oe_great_revolution.13.d: "要求显贵宣誓的公文，带着未拆开的封缄回到了首都。有些家族称病，有些离开庄园，还有人公开宣称：他们的祖先曾为罗马皇帝执剑，并未向街垒后的临时执政官许下任何诺言。\n\n这不只是几句傲慢的答复。军官迟迟不上任，地方官互相推诿，贵族门客把共和国的命令解释成可以等待的建议。失去紫袍姻亲与宫廷荣衔，未能使他们顺从；新政权必须面对一张仍遍布帝国的旧权力之网。"
 oe_great_revolution.13.a: "罗马不再属于少数家族。"
 oe_great_revolution.14.t: "市民积极拥护共和国"
 oe_great_revolution.14.d: "清晨，行会代表与市议会使者排满了临时政府的长廊。他们带来粮食、账簿、认捐的银币，也带来一份共同的要求：既然城市的双手守住了街垒，城市的声音就应当进入国家的议事厅。\n\n他们对共和国的期待并不相同。商人盼望可以预知的税法，工匠希望不再受特许豪门排挤，识字的市民则要亲眼看见公文上的“公民”成为事实。这些愿望暂时汇聚成同一个承诺——他们愿意帮助共和国站稳脚跟。"
 oe_great_revolution.14.a: "共和国将听见城市的声音。"
 oe_great_revolution.15.t: "三心二意的官僚"
 oe_great_revolution.15.d: "政体已经改变，公文仍在旧官署里兜圈。一项征税命令被退回三次：第一次缺少旧制规定的印章，第二次引用的官衔已经撤销，第三次则无人愿意在最后一页签名。每个人都说自己忠于罗马，却没有人肯先为共和国承担责任。\n\n官员们熟悉档案、道路与钱粮，却不确定新政权能存在多久。有人等待贵族的消息，有人等候教会表态，还有人只想把错误留给继任者。国家机器依然庞大，齿轮之间却像灌满了沙。"
 oe_great_revolution.15.a: "国家不能永远停在待批的公文里。"
 oe_great_revolution.16.t: "地方反抗中央政府"
 oe_great_revolution.16.d: "最初，行省只是迟交报表；随后，税款被留下支付本地守军，船坞拒绝接受首都的调令，总督的使者开始以“维持地方安宁”为由要求自行裁量。共和国越急于发出命令，地方越坚持先等一个可靠的答复。\n\n旧帝国依赖身份、恩典与人情维系的统治，在皇帝被囚之后露出了裂缝。各地尚未升起同一面反旗，却已不再沿着同一条道路服从君士坦丁堡。我们夺取了中央政府，仍须重新赢得一个国家。"
 oe_great_revolution.16.a: "让行省重新听见君士坦丁堡的号令。"
