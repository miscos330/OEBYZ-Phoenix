l_simp_chinese:
 OE_TG_MARK_HOUSE: "·将门"
 OE_TG_MARK_NONE: ""
 oe_tg.1.t: "将门子弟"
 oe_tg.1.d: "[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军印信可以交给一位出身大族的人。豪族子弟有家族的财力和门生故旧撑腰，任上更稳；可家族越强，将军要顾及的就越不止皇帝一人。"
 oe_tg.1.h1: "任命[SCOPE.sDynasty('oe_tg_h1').GetName]家族的子弟"
 oe_tg.1.h1.tt: "消耗3帝国权威。该家族在帝国境内最善战的一位成年族人接任[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军，原将军召回宫中。\n出身豪族的将军：军区忠诚目标 +5；该家族是皇帝的政治盟友时再 +5；家族影响力达到500时改为 −5。"
 oe_tg.1.h2: "任命[SCOPE.sDynasty('oe_tg_h2').GetName]家族的子弟"
 oe_tg.1.h2.tt: "消耗3帝国权威。该家族在帝国境内最善战的一位成年族人接任[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军，原将军召回宫中。\n出身豪族的将军：军区忠诚目标 +5；该家族是皇帝的政治盟友时再 +5；家族影响力达到500时改为 −5。"
 oe_tg.1.h3: "任命[SCOPE.sDynasty('oe_tg_h3').GetName]家族的子弟"
 oe_tg.1.h3.tt: "消耗3帝国权威。该家族在帝国境内最善战的一位成年族人接任[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军，原将军召回宫中。\n出身豪族的将军：军区忠诚目标 +5；该家族是皇帝的政治盟友时再 +5；家族影响力达到500时改为 −5。"
 oe_tg.1.h4: "任命[SCOPE.sDynasty('oe_tg_h4').GetName]家族的子弟"
 oe_tg.1.h4.tt: "消耗3帝国权威。该家族在帝国境内最善战的一位成年族人接任[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军，原将军召回宫中。\n出身豪族的将军：军区忠诚目标 +5；该家族是皇帝的政治盟友时再 +5；家族影响力达到500时改为 −5。"
 oe_tg.1.e: "暂不任命"
 oe_tg.1.e.tt: "不做改变。"
 oe_tg.2.t: "靠山倒了"
 oe_tg.2.d: "一家豪族从名册上除了名。出身这一家的将军们在朝中没了靠山，各自盘算起后路。"
 oe_tg.2.a: "这是朝廷的决定"
 oe_tg.2.a.tt: "该家族出身的将军所在军区：忠诚 −10，并计入忠诚目标5年（已生效）。"
 oe_tg.3.t: "前朝皇族"
 oe_tg.3.d: "新皇登基，旧皇族却没有消失。他们的族人仍住在京城，仍有门生、田产和旧部。如今他们作为一家豪族列名朝廷，人们记得他们曾经坐在什么位置上。"
 oe_tg.3.a: "让他们安分守己"
 oe_tg.3.a.tt: "前朝皇族列入豪族名册，初始影响力300（已生效）。"
 oe_tg.4.t: "门第受辱"
 oe_tg.4.d: "朝廷刚刚打压了[SCOPE.sDynasty('oe_tg_family').GetName]家族。出身这一家的将军们写信回京，措辞客气，意思却很清楚。"
 oe_tg.4.a: "派使者抚慰，并赠礼物"
 oe_tg.4.a.tt: "−150金币\n该家族出身的将军所在军区：忠诚 −5，并计入忠诚目标5年"
 oe_tg.4.b: "不必理会"
 oe_tg.4.b.tt: "该家族出身的将军所在军区：忠诚 −10，并计入忠诚目标5年"
 oe_tg.10.t: "联姻之请"
 oe_tg.10.d: "[SCOPE.sCharacter('oe_tg_head').GetName]派人来提亲：[SCOPE.sDynasty('oe_tg_family').GetName]家有一位待嫁的女儿，愿意许给皇室。1347年，海伦娜·坎塔库泽妮就是这样嫁给了约翰五世，她父亲从此成了皇帝的岳父。"
 oe_tg.10.a: "应允这门亲事"
 oe_tg.10.a.tt: "该家族影响力 +75\n帝国权威 +2"
 oe_tg.10.b: "婉言谢绝"
 oe_tg.10.b.tt: "该家族影响力 −10"
 oe_tg.11.t: "门第之争"
 oe_tg.11.d: "[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军已失人心，[SCOPE.sDynasty('oe_tg_family').GetName]和[SCOPE.sDynasty('oe_tg_family2').GetName]两家都想把自己的人送去接任。两家在朝会上当众争执，谁也不肯先让。"
 oe_tg.11.a: "支持[SCOPE.sDynasty('oe_tg_family').GetName]家"
 oe_tg.11.a.tt: "[SCOPE.sDynasty('oe_tg_family').GetName]家影响力 +50\n[SCOPE.sDynasty('oe_tg_family2').GetName]家影响力 −50，其出身的将军所在军区忠诚 −5"
 oe_tg.11.b: "支持[SCOPE.sDynasty('oe_tg_family2').GetName]家"
 oe_tg.11.b.tt: "[SCOPE.sDynasty('oe_tg_family2').GetName]家影响力 +50\n[SCOPE.sDynasty('oe_tg_family').GetName]家影响力 −50，其出身的将军所在军区忠诚 −5"
 oe_tg.11.c: "两家都不用"
 oe_tg.11.c.tt: "帝国权威 −2\n两家影响力各 −10"
 oe_tg.12.t: "将门子弟从军"
 oe_tg.12.d: "[SCOPE.sDynasty('oe_tg_family').GetName]家的一个年轻子弟请求去[SCOPE.sCountry('oe_tg_theme_s').GetName]的边军里历练。家里希望他在军中立功，将来接掌一方军区。"
 oe_tg.12.a: "准他去边疆"
 oe_tg.12.a.tt: "该家族影响力 +25\n[SCOPE.sCountry('oe_tg_theme_s').GetName]军务效率 +10（5年）"
 oe_tg.12.b: "让他留在京城"
 oe_tg.12.b.tt: "该家族影响力 −10"
 oe_tg.13.t: "家兵平叛"
 oe_tg.13.d: "军区叛乱未平，[SCOPE.sCharacter('oe_tg_head').GetName]表示愿意出动[SCOPE.sDynasty('oe_tg_family').GetName]家的家兵，替朝廷平乱。条件只有一个：事后朝廷要记住这份人情。"
 oe_tg.13.a: "接受家兵"
 oe_tg.13.a.tt: "首都出现3个团（2个步兵团、1个骑兵团），归帝国所有\n该家族影响力 +75"
 oe_tg.13.b: "朝廷自有兵马"
 oe_tg.13.b.tt: "该家族影响力 −10"
 oe_tg.14.t: "豪族助饷"
 oe_tg.14.d: "[SCOPE.sDynasty('oe_tg_family').GetName]家愿意拿出一笔钱资助正在进行的征伐，指望战后在新得的土地上分到产业。"
 oe_tg.14.a: "收下这笔钱"
 oe_tg.14.a.tt: "+400金币\n当前征伐进度 +3\n该家族影响力 +50"
 oe_tg.14.b: "战争是皇帝的事"
 oe_tg.14.b.tt: "帝国权威 +1"
 oe_tg.15.t: "权臣失势"
 oe_tg.15.d: "[SCOPE.sCharacter('oe_tg_head').GetName]权势太盛，弹劾[SCOPE.sCharacter('oe_tg_head').GetSheHe]的奏章堆满了案头。1328年，梅托希特斯随安德罗尼卡二世一同失势，家产被没收，人被流放到迪迪莫提洪，两年后才获准回京，在科拉修道院里度过余生。"
 oe_tg.15.a: "籍没家产"
 oe_tg.15.a.tt: "+500金币\n该家族影响力 −150，其出身的将军所在军区忠诚 −10"
 oe_tg.15.b: "流放迪迪莫提洪"
 oe_tg.15.b.tt: "该家族影响力 −75\n帝国权威 +3"
 oe_tg.15.c: "让[SCOPE.sCharacter('oe_tg_head').GetSheHe]退隐修道院"
 oe_tg.15.c.tt: "该家族影响力 −25\n威望增加"
 oe_tg.16.t: "老将归来"
 oe_tg.16.d: "[SCOPE.sCountry('oe_tg_theme_s').GetName]人心浮动。[SCOPE.sDynasty('oe_tg_family').GetName]家有一位早年失意的老将，如今在家中闲居。1323年前后，安德罗尼卡二世赦免了当年起兵被刺瞎的阿莱克修斯·菲兰斯罗皮诺斯，派他去解费拉德尔菲亚之围；据说城下的突厥人一见他到，就退走了。"
 oe_tg.16.a: "召[SCOPE.sCharacter('oe_tg_veteran').GetSheHe]出山"
 oe_tg.16.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]：忠诚 +15，军务效率 +10（5年）\n若[SCOPE.sCharacter('oe_tg_veteran').GetSheHe]可以接任，就由[SCOPE.sCharacter('oe_tg_veteran').GetSheHe]出任该军区将军\n该家族影响力 +50"
 oe_tg.16.b: "让[SCOPE.sCharacter('oe_tg_veteran').GetSheHe]安度晚年"
 oe_tg.16.b.tt: "不做改变。"
 oe_tg.17.t: "寒门新贵"
 oe_tg.17.d: "一个出身寒微的官员靠着精明和胆量在宫中步步高升。据格里高拉斯说，1341年当上海军大都督的阿波考科斯就是这样起家的。大族们看不起他，也开始提防他。"
 oe_tg.17.a: "重用他"
 oe_tg.17.a.tt: "帝国权威 +5\n名册上每家豪族影响力 −15"
 oe_tg.17.b: "朝廷要靠大族撑着"
 oe_tg.17.b.tt: "[SCOPE.sDynasty('oe_tg_family').GetName]家影响力 +25"
 oe_tg.18.t: "家族修道院"
 oe_tg.18.d: "[SCOPE.sDynasty('oe_tg_family').GetName]家要在京城修一座修道院，请求皇帝赐地并免去它的赋税。十四世纪初，特奥多拉·绪纳德妮在丈夫死后建起了贝拜亚·埃尔皮斯修女院，亲手写下院规，把家族几代人的肖像都画进了院规的抄本里。"
 oe_tg.18.a: "赐地免税"
 oe_tg.18.a.tt: "−150金币\n该家族影响力 +50\n合法性增加"
 oe_tg.18.b: "让他们自己出钱"
 oe_tg.18.b.tt: "该家族影响力 −10"
 oe_tg.19.t: "家史"
 oe_tg.19.d: "[SCOPE.sCharacter('oe_tg_head').GetName]请了一位学者，要为[SCOPE.sDynasty('oe_tg_family').GetName]家写一部史书，把先人的功业写进帝国的历史。约翰六世退位后也亲自写了一部历史，替自己的一生辩护。"
 oe_tg.19.a: "资助这部书"
 oe_tg.19.a.tt: "−100金币\n威望增加\n该家族影响力 +25"
 oe_tg.19.b: "要求删去对皇室不敬的段落"
 oe_tg.19.b.tt: "帝国权威 +2\n该家族影响力 −25"
 oe_tg.20.t: "女继承人"
 oe_tg.20.d: "一位富有的寡妇留下独生女和大片田产。[SCOPE.sDynasty('oe_tg_family').GetName]和[SCOPE.sDynasty('oe_tg_family2').GetName]两家都上门求亲，谁娶到她，田产就归谁。"
 oe_tg.20.a: "许给[SCOPE.sDynasty('oe_tg_family').GetName]家"
 oe_tg.20.a.tt: "[SCOPE.sDynasty('oe_tg_family').GetName]家影响力 +75\n[SCOPE.sDynasty('oe_tg_family2').GetName]家影响力 −25"
 oe_tg.20.b: "许给[SCOPE.sDynasty('oe_tg_family2').GetName]家"
 oe_tg.20.b.tt: "[SCOPE.sDynasty('oe_tg_family2').GetName]家影响力 +75\n[SCOPE.sDynasty('oe_tg_family').GetName]家影响力 −25"
 oe_tg.20.c: "由皇帝指婚给宗室"
 oe_tg.20.c.tt: "合法性增加\n两家影响力各 −25"
 oe_tg.21.t: "请封凯撒"
 oe_tg.21.d: "[SCOPE.sCountry('oe_tg_theme_s').GetName]的[SCOPE.sCharacter('oe_tg_strat').GetName]出身[SCOPE.sDynasty('oe_tg_family').GetName]家，家族如日中天。[SCOPE.sCharacter('oe_tg_strat').GetSheHe]上书请求凯撒的尊号，说只有这样才配得上自己和家族为帝国立下的功劳。"
 oe_tg.21.a: "授予凯撒尊号"
 oe_tg.21.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]的将军获得凯撒尊号（军区忠诚目标 +15）\n该家族影响力 +50"
 oe_tg.21.b: "此等尊号只属于皇亲"
 oe_tg.21.b.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]：忠诚 −10，并计入忠诚目标5年\n该家族影响力 −25"
 oe_tg.22.t: "两家结亲"
 oe_tg.22.d: "[SCOPE.sDynasty('oe_tg_family').GetName]和[SCOPE.sDynasty('oe_tg_family2').GetName]两家定下婚约，结成了一体。朝中有人担心，两家合起来，就没有谁能压得住了。"
 oe_tg.22.a: "设法拆散这门亲事"
 oe_tg.22.a.tt: "帝国权威 −3\n两家影响力各 −25"
 oe_tg.22.b: "送上贺礼"
 oe_tg.22.b.tt: "−100金币\n两家影响力各 +25\n两家出身的将军所在军区忠诚 +5"
 oe_tg.23.t: "兄弟分产"
 oe_tg.23.d: "[SCOPE.sDynasty('oe_tg_family').GetName]家的兄弟为祖产吵到了御前。长子要守住家业不分，次子要分走一半。"
 oe_tg.23.a: "支持长子"
 oe_tg.23.a.tt: "该家族影响力不变\n威望增加"
 oe_tg.23.b: "判家产平分"
 oe_tg.23.b.tt: "该家族影响力 −100\n帝国权威 +2"
 oe_tg.24.t: "庄园抗税"
 oe_tg.24.d: "[SCOPE.sDynasty('oe_tg_family').GetName]家在[SCOPE.sCountry('oe_tg_theme_s').GetName]有大片庄园，庄头把中央派来的财务官挡在了门外，说家里的地向来只向皇帝本人纳税。"
 oe_tg.24.a: "支持财务官"
 oe_tg.24.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]财政效率 +10（5年）\n该家族影响力 −50"
 oe_tg.24.b: "免了这些庄园的税"
 oe_tg.24.b.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]财政效率 −10（5年）\n该家族影响力 +25"
 oe_tg.25.t: "世守一方"
 oe_tg.25.d: "[SCOPE.sCountry('oe_tg_theme_s').GetName]的[SCOPE.sCharacter('oe_tg_strat').GetName]出身[SCOPE.sDynasty('oe_tg_family').GetName]家。[SCOPE.sCharacter('oe_tg_strat').GetSheHe]请求皇帝准许自己的儿子日后接掌这个军区，让[SCOPE.sDynasty('oe_tg_family').GetName]家世代镇守一方。军区制度最怕的正是这个。"
 oe_tg.25.a: "准其世守"
 oe_tg.25.a.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]成为世守军区（忠诚目标 +5，永久）\n[SCOPE.sCountry('oe_tg_theme_s').GetName]：忠诚 +10，并计入忠诚目标5年\n该家族影响力 +100"
 oe_tg.25.b: "军区不是家产"
 oe_tg.25.b.tt: "[SCOPE.sCountry('oe_tg_theme_s').GetName]：忠诚 −10，并计入忠诚目标5年\n该家族影响力 −25"
 oe_theme_admin.2.house: "以豪族子弟接任将军"
