 oe_mer2_cab_state_cannon_foundry_action_progress_wordier:0 "火炮国营铸造与口径统一运转中"
 oe_mer2_cab_state_cannon_foundry_action_progress_long_wordier:0 "火炮国营铸造与口径统一运转中"
 oe_mer2_cab_state_cannon_foundry_action_progress_tooltip:0 "统筹全国国营铜炮铸造与口径标准化，降低火炮建造成本并提升火炮火力与攻城破堡效率，代价为小幅税收效率投入。"
 oe_mer2_cab_quartermaster_magazines:0 "常备军兵站与粮秣后勤司"
 oe_mer2_cab_quartermaster_magazines_desc:0 "在指定自控行省设立常备军兵站与粮秣转运仓，大幅延伸全国陆军后勤半径、改善陆军维护效率并显著抬升当地补给上限与储粮能力，同时向首府市场注入军粮马具采购，代价为农民阶层轻微征粮压力。"
 oe_mer2_cab_quartermaster_magazines_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]统筹兵站与粮秣后勤"
 oe_mer2_cab_quartermaster_magazines_action:0 "在[SCOPE.sProvince('target').GetNameWithNoTooltip]设立常备军兵站与粮秣后勤司"
 oe_mer2_cab_quartermaster_magazines_action_progress:0 "[SCOPE.sCountry('actor').GetModifierValue('army_logistics_distance_modifier')]"
 oe_mer2_cab_quartermaster_magazines_action_progress_wordier:0 "[SCOPE.sProvince('target').GetNameWithNoTooltip]兵站粮秣司运转中"
 oe_mer2_cab_quartermaster_magazines_action_progress_long_wordier:0 "[SCOPE.sProvince('target').GetNameWithNoTooltip]常备军兵站与粮秣后勤司运转中"
 oe_mer2_cab_quartermaster_magazines_action_progress_tooltip:0 "依托前沿行省兵站囤积粮秣与辎重，提升全国后勤距离与陆军维护效率并大幅提高该省补给上限与储粮能力。"
 oe_mer2_quartermaster_select_province:0 "选择设立兵站粮秣司的行省"
 oe_mer2_quartermaster_no_provinces:0 "@trigger_no! 当前没有符合条件的自控行省可用于设立兵站与粮秣后勤司。"
 oe_mer2_player_only_tt:0 "仅限玩家操控的国家可执行此决议。"
 oe_mer2_demobilize_cd_tt:0 "距离上次体面遣散自由军团已满 #Y 5#! 年。"
 oe_mer2_mil_50_tt:0 "君主、摄政或任一内阁大臣的军事能力不低于 #Y 50#!。"
 oe_mer2_no_mutiny_or_low_risk_tt:0 "未处于《自由军团哗变》灾难中，或已将【佣兵欠薪风险】压低至 #Y 20#! 及以下。"
 oe_mer2_dec_demobilize_free_companies.title:0 "体面遣散与屯垦安置自由军团"
 oe_mer2_dec_demobilize_free_companies.desc:0 "与其坐视欠薪雇佣兵在战后沦为劫掠乡里的兵匪，不如由朝廷一次性拨发遣散赏银并在边疆拨付荒田屯垦，令刀头舔血的自由军团老兵安居乐业、化患为屏。"
 oe_mer2_dec_demobilize_free_companies.a:0 "颁行体面遣散与边疆屯垦诏书"
 oe_mer2_dec_demobilize_free_companies.a.tt:0 "支付一笔遣散安家费，令【佣兵欠薪风险】骤降 #G -35#!，在一处边疆地点授予五年【遣散老兵边疆屯垦】加成（5 年冷却），并触发后续安置事件。"
 oe_mer2_dec_artillery_standardization.title:0 "建立皇家国营火炮铸造局"
 oe_mer2_dec_artillery_standardization.desc:0 "私人作坊铸造的铜炮口径杂乱、火药配比不一，难以支撑大规模攻城与野战。由王室集中资金、匠师与铜锡硝石设立常设国营火炮铸造局，将令我国跨入真正的火药后勤时代。"
 oe_mer2_dec_artillery_standardization.a:0 "敕建皇家国营火炮铸造局"
 oe_mer2_dec_artillery_standardization.a.tt:0 "一次性投入建局重金，永久获得【皇家国营火炮铸造局】修正（火炮造价 -10%、火炮维护 -10%、攻城能力 +8%），向首府市场注入四年火炮原料需求并触发落成庆典事件。"
 oe_mer2_dec_abolish_condottieri_system.title:0 "废除包干佣兵制与建立职业常备军"
 oe_mer2_dec_abolish_condottieri_system.desc:0 "包干雇佣兵团虽能解一时燃眉之急，终究唯利是图、难以托付社稷。如今火器与兵站日趋成熟，正是废除私人包干佣兵契约、颁布职业常备军宪章并永绝自由军团哗变之患的历史时刻。"
 oe_mer2_dec_abolish_condottieri_system.a:0 "颁布职业常备军与兵站大宪章"
 oe_mer2_dec_abolish_condottieri_system.a.tt:0 "废除既有包干佣兵契约并清零欠薪风险，永久获得【职业常备军与兵站大宪章】（陆军纪律 +3%、后勤距离 +15%、人力 +10%、佣兵雇佣溢价 +25%），永久免疫《自由军团哗变》复发并触发史诗改革事件。"
 oe_mer2.1.title:0 "自由军团哗变爆发"
 oe_mer2.1.desc:0 "战火未熄而国库告急，拖欠数月的军饷终于点燃了积怨已久的佣兵大营。从色雷斯到意大利的血泪史仿佛在眼前重演：各支自由军团的队长联名撕毁契约、拔寨拒命，宣称若朝廷不立即清偿欠饷与战利品份额，他们便要自行在帝国富庶城邑中「就地取饷」。"
 oe_mer2.1.a:0 "紧急挪借国库筹饷，先稳前线军心"
 oe_mer2.1.a.tt:0 "支付一笔应急军饷，降低【佣兵欠薪风险】#G -15#! 并略微稳固国内秩序。"
 oe_mer2.1.b:0 "绝不向兵痞低头，敕令近卫军铁腕戒严"
 oe_mer2.1.b.tt:0 "承受短期稳定度震荡，换取陆军传统提升并小幅压低【佣兵欠薪风险】#G -5#!。"
 oe_mer2.2.title:0 "自由军团兵临城下：勒索赎城金"
 oe_mer2.2.desc:0 "一支脱缰的哗变自由军团趁夜合围了[SCOPE.sLocation('oe_mer2_target_loc').GetName]外郭，长矛与火把映红了城头。佣兵队长遣使递交最后通牒：要么朝廷按《自由军团赎城金与免责宪章》交付巨额赎城金，要么天明之后便放纵三日劫掠，将整座名城付之一炬！"
 oe_mer2.2.a:0 "忍辱按约交付赎城金，保全城池百姓"
 oe_mer2.2.a.tt:0 "直接执行【自由军团赎城金与免责宪章】：支付巨额赎城金、蒙受十年【城下赎金之耻】，但立即平息此股哗变并压低 #G -30#! 欠薪风险。"
 oe_mer2.2.b:0 "严词拒付赎金，命城防与援军死战清剿"
 oe_mer2.2.b.tt:0 "[SCOPE.sLocation('oe_mer2_target_loc').GetName]将承受五年【自由军团劫掠创伤】，哗变自由军团将在叛军面板集结并推进叛乱进度，但我军赢得宝贵实战传统。"
 oe_mer2.3.title:0 "佣兵队长勒索封地与免税特权"
 oe_mer2.3.desc:0 "驻扎在[SCOPE.sLocation('oe_mer2_target_loc').GetName]周边的雇佣兵头目公然扣留了地方税吏，要求朝廷将沿线数处市镇与庄园划为自己的世袭免税采邑以抵扣积欠军饷。地方贵族愤慨万分，而城中市民也惶恐不安地等待御前裁决。"
 oe_mer2.3.a:0 "权宜颁赐免税采邑，暂息刀兵"
 oe_mer2.3.a.tt:0 "遣散此股哗变叛军并降低 #G -20#! 欠薪风险，但全国将承受八年【佣兵队长免税采邑特权】并激怒贵族阶层。"
 oe_mer2.3.b:0 "宁赔现银不割治权：按宪章赎买其契约"
 oe_mer2.3.b.tt:0 "执行【自由军团赎城金与免责宪章】以重金买断其诉求，保住采邑治权并降低 #G -30#! 欠薪风险。"
 oe_mer2.3.c:0 "斥为叛逆，传檄讨伐僭越兵匪"
 oe_mer2.3.c.tt:0 "维护王室威望，但哗变自由军团将在[SCOPE.sLocation('oe_mer2_target_loc').GetName]煽动叛乱并大幅推进叛乱进度。"
 oe_mer2.4.title:0 "华伦斯坦之影：军阀割据试探"
 oe_mer2.4.desc:0 "手握重兵的军事大包干首领向朝廷呈上一份看似体贴的条陈：既然国库拮据，他愿自行垫付军费、直接向驻防行省征收军粮与「保安税」，只需朝廷不再过问其部属任免与战利品分配。众臣无不色变——这无异于在国中再造一座独立军阀王国。"
 oe_mer2.4.a:0 "暂允大包干军阀就地筹饷以渡财政难关"
 oe_mer2.4.a.tt:0 "立刻缓解国库现金流并降低 #G -15#! 欠薪风险，但全国将蒙受六年【包干军阀自行筹饷】导致控制力与王权流失。"
 oe_mer2.4.b:0 "密敕御前卫士深夜夺印削兵"
 oe_mer2.4.b.tt:0 "引发短期稳定度震荡，但大幅削减 #G -25#! 欠薪风险并提升陆军传统，彻底粉碎军阀割据图谋。"
 oe_mer2.5.title:0 "忠义近卫军反击清剿契机"
 oe_mer2.5.desc:0 "哗变军团各派因分赃不均陷入内讧，斥候探明其主力营寨戒备松弛。久经沙场的王室近卫统领慷慨请缨，愿率效忠王座的直属精锐连夜奔袭，一举击溃哗变首恶、震慑其余散兵。"
 oe_mer2.5.a:0 "命近卫精锐连夜奇袭哗变大营"
 oe_mer2.5.a.tt:0 "获得三年【忠义近卫铁腕肃叛】加成，降低 #G -20#! 欠薪风险并恢复可观稳定度。"
 oe_mer2.5.b:0 "剿首恶而赦胁从，收编精壮充入炮兵辅卒"
 oe_mer2.5.b.tt:0 "支付小额收编费，大幅压低 #G -25#! 欠薪风险并显著增进陆军传统。"
 oe_mer2.6.title:0 "敌方重金策反我军雇佣兵团"
 oe_mer2.6.desc:0 "前线急报传来：敌国密使携满箱金币潜入我军雇佣兵驻地，许以双倍军饷与劫掠特许煽动阵前倒戈！已有数支轻骑连队擅离防线，余部亦借机鼓噪索饷。若不立刻决断，整条战线恐将面临雇佣兵溃散之危。"
 oe_mer2.6.a:0 "拒受挟持，抽调本国子弟兵顶上缺口"
 oe_mer2.6.a.tt:0 "保全当前国库并略增陆军传统，但须继续承受两年【敌方重金策反：佣兵动摇】负面影响。"
 oe_mer2.6.b:0 "紧急拨发双倍赏饷，力挽前线佣兵忠心"
 oe_mer2.6.b.tt:0 "支付重金清除【敌方重金策反：佣兵动摇】并压低 #G -12#! 欠薪风险，改为承受两年【应急双倍赏饷稳军】（维护费上升但士气回升）。"
 oe_mer2.7.title:0 "自由军团哗变平息"
 oe_mer2.7.desc:0 "随着最后一支欠薪自由军团放下长矛、接受遣散或被铁腕肃清，席卷全国的佣兵哗变终于画上句号。满目疮痍的驿道与耗空的府库都在警醒后世君王：建立独立于私人雇佣队长之外的炮兵工局与常备兵站，已刻不容缓。"
 oe_mer2.7.a:0 "颁布御前军律整肃令，永铭兵祸之鉴"
 oe_mer2.7.a.tt:0 "获得十年【哗变平息与军纪重整】修正，并恢复稳定度与国家威望。"
 oe_mer2.7.b:0 "趁胜推进兵站粮秣采购，夯实常备后勤"
 oe_mer2.7.b.tt:0 "获得十年【哗变平息与军纪重整】修正、陆军传统加成，并向首府市场注入三年兵站粮秣需求。"
 oe_mer2.8.title:0 "自由军团体面遣散与边疆屯垦"
 oe_mer2.8.desc:0 "在兵部官吏的逐册清点下，大批身经百战的雇佣兵老兵领足遣散赏银与边疆地契，有序缴械并携家眷启程前往边境屯垦。往日令人谈之色变的自由军团，如今化作拱卫边塞的坚毅屯民与教官储备。"
 oe_mer2.8.a:0 "厚赏屯田新户，安抚乡里民心"
 oe_mer2.8.a.tt:0 "小幅提升稳定度、威望与农民阶层满意度。"
 oe_mer2.8.b:0 "择优拔擢老兵军官，留任本国新军教头"
 oe_mer2.8.b.tt:0 "获得陆军传统加成，并额外压低 #G -5#! 佣兵欠薪风险。"
 oe_mer2.9.title:0 "皇家国营火炮铸造局落成"
 oe_mer2.9.desc:0 "炉火映红了新落成的皇家铸炮厂高穹，第一批按统一口径浇铸成型的青铜重炮在试射场上齐声轰鸣、精准掀翻百步外的砖石靶墙。自此以后，帝国的火炮铸造、黑火药提纯与弹药补给尽数纳入国家统筹，再不必受制于零散私商与外籍炮匠。"
 oe_mer2.9.a:0 "乘势设立皇家炮兵教导团，磨砺破城齐射章法"
 oe_mer2.9.a.tt:0 "额外获得十年【皇家炮兵教导团】（火炮战力 +6%、攻城对堡垒加成 +1），并提升陆军传统与威望。"
 oe_mer2.9.b:0 "兼颁铜锡硝石行会专采特许，兴旺国内军工市集"
 oe_mer2.9.b.tt:0 "向首府市场追加三年火炮铸造原料需求，提升稳定度并显著取悦市民阶层。"
 oe_mer2.10.title:0 "职业常备军大宪章颁行天下"
 oe_mer2.10.desc:0 "钟鼓齐鸣之际，御前宣告《职业常备军与兵站大宪章》正式生效：旧式私人雇佣兵包干契约就此作废，全国军队一律编入王室直辖的常备建制，由国家兵站按期供粮、由职业军官按功晋升。中世纪末期动辄挟饷哗变的自由军团时代，终于在我们的疆土上彻底落幕。"
 oe_mer2.10.a:0 "同步颁行常备军官团条例，以专业军魂立国"
 oe_mer2.10.a.tt:0 "获得十五年【常备军官团条例】（月度陆军传统 +0.15、陆军维护效率 +5%），并大幅提升威望、陆军传统与稳定度。"
 oe_mer2.10.b:0 "统筹全国兵站供应网，令军政商贸各安其位"
 oe_mer2.10.b.tt:0 "向首府市场注入四年兵站粮秣采购需求，提升稳定度并安抚贵族与市民两大阶层。"
 oe_mer2.11.title:0 "W3 审计读数：雇佣兵契约与火药后勤状态"
 oe_mer2.11.desc:0 "#T v12.5 W3 雇佣兵与火药后勤只读审计面板（0 主线槽位 oe_mer2_）#!\n• 佣兵欠薪风险（0–100，达 40 配合财政窘迫可触发哗变）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_mer2_arrears_risk').GetValue|0]#!\n• 当前包干契约类型（0 无 / 1 意 / 2 瑞 / 3 德 / 4 东欧 / 5 军阀）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_mer2_audit_charter').GetValue|0]#!\n• 《自由军团哗变》灾难激活状态（0 否 / 1 是）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_mer2_audit_mutiny').GetValue|0]#!\n• 皇家国营火炮铸造局（0 未建 / 1 已成）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_mer2_audit_foundry').GetValue|0]#!\n• 职业常备军大宪章 / 哗变永久免疫（0 未成 / 1 已成）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_mer2_audit_reformed').GetValue|0]#!"
 oe_mer2.11.a:0 "确认读数并关闭审计面板"
 oe_mer2.11.a.tt:0 "只读审计事件，不改变游戏状态。"
