 oe_mer2_poach_enemy_mercenaries:0 "重金策反敌军雇佣兵团"
 oe_mer2_poach_enemy_mercenaries_desc:0 "在交战期间动用 #Y 30#! 谍报网与重金潜入敌军佣兵营寨挑唆哗散，令目标承受两年【敌方重金策反：佣兵动摇】重罚、推高其 #R +18#! 欠薪风险，并迫使其在紧急加发双倍军饷或承受战阵溃散之间抉择。"
