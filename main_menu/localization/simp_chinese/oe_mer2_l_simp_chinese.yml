 oe_mer2_cab_state_cannon_foundry:0 "火炮国营铸造与口径统一"
 oe_mer2_cab_state_cannon_foundry_desc:0 "由内阁军工大臣统筹国营铜炮铸造与炮膛口径统一，显著降低火炮造价并增强火炮战力与攻城破堡火力，同时投入一定财政税效并向首府市场注入铜、锡、铁与硝石军工采购需求。"
