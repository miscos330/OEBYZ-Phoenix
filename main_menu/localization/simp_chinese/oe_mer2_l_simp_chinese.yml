 oe_mer2_subsidize_free_company:0 "暗助他国雇佣兵军费"
 oe_mer2_subsidize_free_company_desc:0 "向正在与第三方交战的国家秘密拨付雇佣兵军费：受援国获三年【域外暗助佣兵军费】加成并增进好感，我方获得三年【代理人战争幕后金主】外交声誉加成；同时受援国将累积 #R +10#! 战后佣兵欠薪风险。"
