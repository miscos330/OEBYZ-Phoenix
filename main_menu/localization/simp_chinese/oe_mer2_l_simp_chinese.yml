 oe_mer2_charter_condottieri_contract:0 "签署历史名佣兵包干契约"
 oe_mer2_charter_condottieri_contract_desc:0 "向友好或中立国家支付签约费，依其首都所在大区招募对应的历史名佣兵团（意大利雇佣队长、瑞士长矛方阵、德意志兰茨克内希特、东欧自由轻骑或军阀包干总承包），持续五年；但每次签约都将推高 #R +20#! 佣兵欠薪风险，为战后《自由军团哗变》埋下隐患。"
 oe_mer2_charter_condottieri_contract_act:0 "向[SCOPE.sCountry('recipient').GetName]签署历史名佣兵包干契约"
 oe_mer2_charter_condottieri_contract_effect_text:0 "[SCOPE.sCountry('actor').GetName]向[SCOPE.sCountry('recipient').GetName]支付签约费并订立五年佣兵包干契约。"
