 oe_mer2_cannon_foundry_demand:0 "皇家火炮铸造局原料采办"
 oe_mer2_cannon_foundry_demand_desc:0 "国营火炮铸造局集中采购红铜、锡锭、精铁、硝石与焦炭以批量浇铸制式重炮。"
 oe_mer2_quartermaster_supply_demand:0 "常备军兵站粮秣与马具征购"
 oe_mer2_quartermaster_supply_demand_desc:0 "军需后勤司为前沿兵站囤积军粮、食盐、皮革、挽马与常备军械，保障远征大军补给无虞。"
 oe_mer2_standing_army_ordnance_demand:0 "常备军火器与重炮换装需求"
 oe_mer2_standing_army_ordnance_demand_desc:0 "新建职业常备军团统一列装火枪、精钢刺刀、黑火药与制式野战火炮，带动首府军工市场大兴。"
 STATIC_MODIFIER_NAME_oe_mer2_charter_condottieri:0 "意大利雇佣队长包干契约"
 STATIC_MODIFIER_DESC_oe_mer2_charter_condottieri:0 "我们与意大利军事包干队长订立了契约，以明文军饷换取纪律严明的重装战团与精良攻城工兵。"
 STATIC_MODIFIER_NAME_oe_mer2_charter_swiss:0 "瑞士长矛方阵雇佣契约"
 STATIC_MODIFIER_DESC_oe_mer2_charter_swiss:0 "阿尔卑斯山谷的瑞士长矛方阵以铁血军纪与无畏冲击闻名全欧，令我军陆战主力锋不可当。"
 STATIC_MODIFIER_NAME_oe_mer2_charter_landsknechte:0 "德意志兰茨克内希特契约"
 STATIC_MODIFIER_DESC_oe_mer2_charter_landsknechte:0 "成群结队的德意志双刃剑手与长矛火枪连队应募而来，极大扩充了我军可征召的雇佣兵员额。"
 STATIC_MODIFIER_NAME_oe_mer2_charter_stradioti:0 "巴尔干与东欧自由轻骑契约"
 STATIC_MODIFIER_DESC_oe_mer2_charter_stradioti:0 "剽悍的斯特拉蒂奥提与东欧自由轻骑擅长千里奔袭与补给线侦察，极大拓展了佣兵征召与远征后勤半径。"
 STATIC_MODIFIER_NAME_oe_mer2_charter_kriegsunternehmer:0 "军阀包干总承包契约"
 STATIC_MODIFIER_DESC_oe_mer2_charter_kriegsunternehmer:0 "由职业军事总承包商全权负责募兵、军官委任与粮饷垫付，短期内爆发惊人战力，却也暗藏军阀尾大不掉之患。"
 STATIC_MODIFIER_NAME_oe_mer2_mercenary_desertion:0 "敌方重金策反：佣兵动摇"
 STATIC_MODIFIER_DESC_oe_mer2_mercenary_desertion:0 "敌国密使携重金潜入我方雇佣兵大营挑唆倒戈，致使军心浮动、军饷飞涨，且敌方更易以低价挖走兵团。"
 STATIC_MODIFIER_NAME_oe_mer2_foreign_merc_subsidy:0 "域外暗助佣兵军费"
 STATIC_MODIFIER_DESC_oe_mer2_foreign_merc_subsidy:0 "来自域外资助国的秘密军费源源注入我方战时金库，支撑我们在前线维系庞大雇佣兵团。"
 STATIC_MODIFIER_NAME_oe_mer2_proxy_sponsor_influence:0 "代理人战争幕后金主"
 STATIC_MODIFIER_DESC_oe_mer2_proxy_sponsor_influence:0 "我们以金钱代兵刃，在不亲自卷入战火的前提下左右远方战局，令诸邦敬畏我朝财力与手腕。"
 STATIC_MODIFIER_NAME_oe_mer2_humiliated_by_mercs:0 "城下赎金之耻"
 STATIC_MODIFIER_DESC_oe_mer2_humiliated_by_mercs:0 "王权被迫向哗变自由军团低头并支付巨额赎城金，朝廷威信扫地，诸阶层亦借机窥伺王权。"
 STATIC_MODIFIER_NAME_oe_mer2_sacked_city_loc:0 "自由军团劫掠创伤"
 STATIC_MODIFIER_DESC_oe_mer2_sacked_city_loc:0 "失控的欠薪佣兵在城郊焚掠抢劫、毁坏城防，需经数年休养方能恢复市井繁华与治安。"
 STATIC_MODIFIER_NAME_oe_mer2_captain_fief_exemption:0 "佣兵队长免税采邑特权"
 STATIC_MODIFIER_DESC_oe_mer2_captain_fief_exemption:0 "为安抚哗变佣兵首领，朝廷被迫割让数处税收包干与免税庄园，令国库税效受损且传统贵族心怀怨望。"
 STATIC_MODIFIER_NAME_oe_mer2_warlord_autonomy:0 "包干军阀自行筹饷"
 STATIC_MODIFIER_DESC_oe_mer2_warlord_autonomy:0 "大包干军阀获准就地征粮自筹军饷，虽暂缓国库窘迫，却令地方控制力与王室权威持续流失。"
 STATIC_MODIFIER_NAME_oe_mer2_loyal_guard_counterattack:0 "忠义近卫铁腕肃叛"
 STATIC_MODIFIER_DESC_oe_mer2_loyal_guard_counterattack:0 "效忠王室的近卫精锐在危局中挺身而出，以迅雷之势击破哗变营寨，大幅振奋全军士气并遏制叛乱蔓延。"
 STATIC_MODIFIER_NAME_oe_mer2_emergency_double_pay:0 "应急双倍赏饷稳军"
 STATIC_MODIFIER_DESC_oe_mer2_emergency_double_pay:0 "朝廷咬牙加发双倍赏饷击碎了敌方的重金策反，虽令军费吃紧，却保住了前线战阵士气。"
 STATIC_MODIFIER_NAME_oe_mer2_mutiny_suppressed:0 "哗变平息与军纪重整"
 STATIC_MODIFIER_DESC_oe_mer2_mutiny_suppressed:0 "历经自由军团哗变阵痛后，朝廷以严明军法重整军务，王权威信与军官实战经验皆获淬炼。"
 STATIC_MODIFIER_NAME_oe_mer2_veteran_settlement_loc:0 "遣散老兵边疆屯垦"
 STATIC_MODIFIER_DESC_oe_mer2_veteran_settlement_loc:0 "获颁安家田产的遣散佣兵老兵扎根边疆屯垦戍守，既平息了兵匪之忧，又强化了边地防御与市镇兴旺。"
 STATIC_MODIFIER_NAME_oe_mer2_royal_cannon_foundry:0 "皇家国营火炮铸造局"
 STATIC_MODIFIER_DESC_oe_mer2_royal_cannon_foundry:0 "由国家统筹铜锡冶炼、硝石配比与标准炮膛口径的常设军工局，彻底降低火炮铸造与维护成本并增强攻城火力。"
 STATIC_MODIFIER_NAME_oe_mer2_standing_army_reformed:0 "职业常备军与兵站大宪章"
 STATIC_MODIFIER_DESC_oe_mer2_standing_army_reformed:0 "朝廷永久废除私人包干佣兵制，代之以国家直辖的常备军团、军官阶梯与兵站补给体系——从此告别廉价雇佣团，亦永绝自由军团哗变之患。"
 STATIC_MODIFIER_NAME_oe_mer2_artillery_cadre_bonus:0 "皇家炮兵教导团"
 STATIC_MODIFIER_DESC_oe_mer2_artillery_cadre_bonus:0 "常设试炮场与弹道教官团持续打磨攻城炮阵齐射章法，令坚城石壁在重炮轰鸣下土崩瓦解。"
 STATIC_MODIFIER_NAME_oe_mer2_officer_corps_charter:0 "常备军官团条例"
 STATIC_MODIFIER_DESC_oe_mer2_officer_corps_charter:0 "以功绩升迁与常设军校取代私人佣兵队长世袭承包，稳步积淀国家军事传统并理顺常备军费开支。"
 oe_mer2_free_company_mutiny:0 "自由军团哗变"
 oe_mer2_free_company_mutiny_desc:0 "连年倚重雇佣兵团却无力按期足额清偿军饷，终于酿成骇人兵祸。欠薪失控的自由军团拒绝遣散，在乡野城邑间公然勒索赎城金与免税采邑，随时可能重演色雷斯劫掠或罗马之劫的惨剧。唯有稳固国库与稳定度、彻底遣散佣兵并压低欠薪风险，或完成职业常备军大改革，方能平息此难。"
 oe_mer2_rd_free_company_ransom:0 "自由军团赎城金与免责宪章"
 oe_mer2_rd_free_company_ransom_desc:0 "哗变的自由军团要求朝廷一次性偿付高额赎城金并承认其战利品豁免权，令王权蒙羞十年。"
 oe_mer2_free_company_mutineers:0 "哗变自由军团"
