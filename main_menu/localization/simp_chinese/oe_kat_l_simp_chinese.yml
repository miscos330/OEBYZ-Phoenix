 oe_kat_choose_lead_theme: "选择作为大督军区驻地的忠顺主军区"
 oe_kat_no_lead_theme: "@trigger_no!当前没有符合条件的忠顺非海军、非世守军区拥有可整合的邻近普通军区"
 oe_kat_choose_dissolve_katepanate: "选择要析还为古典军区的大督军区"
 oe_kat_no_dissolve_katepanate: "@trigger_no!当前没有可析还的活跃管区大督军区"
 oe_kat_req_diocese_or_scale_tt: "须已启用至少一处古典#Y 近卫大区#!或#Y 管区#!，或拥有至少 #Y 6#! 个军区且帝国权威不低于 #Y 25#!"
 oe_kat_req_consolidatable_cluster_tt: "至少有一个忠顺且非海军、非世守的军区拥有可整合的邻近普通军区"
 oe_kat_auth_10_tt: "帝国权威至少达到 #Y 10#!"
 oe_kat_auth_5_tt: "帝国权威至少达到 #Y 5#!"
 oe_kat_consolidate_diocese_tt: "将至多 #Y 3#! 个符合条件的邻近普通军区整合入所选忠顺主军区（严格保留海军、世守与叛乱锁定军区），将其升格为#G 帝国管区大督军区#!，并为帝国激活#G 管区大督军统筹效益#!。"
 oe_kat_dissolve_katepanate_tt: "将所选大督军区兼管的所有历史辖区可逆析还为独立古典军区，并解除其大督军区位阶。"
 oe_kat_quarantine_split_tt: "立即将动摇大督军区兼管的忠顺子辖区析还为独立古典军区，将潜在叛乱风险严格隔离在主驻地之内。"
 oe_kat_dec_charter_katepanate: "颁布帝国大督军区改制诏书"
 oe_kat_dec_charter_katepanate_desc: "以金玺诏书确立古典管区与陆上军区自愿整合为大督军区的法制，削减帝国中枢外交负荷，同时保障海军军区独立与完全可逆析还权。"
 oe_kat_dec_charter_katepanate.title: "颁布帝国大督军区改制诏书"
 oe_kat_dec_charter_katepanate.desc: "随着帝国疆域再度覆盖古典近卫大区与诸管区，数量繁多的零散军区令君士坦丁堡的外交容量承受重压。颁布《大督军区改制诏书》后，皇帝可按需自愿将同管区内的普通陆上军区整合为高阶大督军区——绝不强制自动合并，严格保护海军与世守军区，并永久保留随时析还古典军区的权力。需花费 150 金币与 10 点帝国权威。"
 oe_kat_dec_charter_katepanate.a: "钤印颁行大督军区金玺诏书"
 oe_kat_dec_charter_katepanate_tt: "永久解锁帝国支柱面板中的自愿#G 管区大督军区整合#!敕令，并获得#G 大督军区敕令宪章#!。"
 oe_kat.1.title: "敕立大督军之职"
 oe_kat.1.desc: "在君士坦丁堡大宫斑岩穹顶之下，御前文书院宣读确立大督军官阶的金玺诏书。大督军位居寻常军区将军之上而又受制于皇帝随时析还的密诏，统筹整片管区的军民事务，既大幅减轻帝国中枢的外交负荷，又完整保留每一处历史军区驻地的建制根脉。"
 oe_kat.1.a: "以罗马法度确立大督军仪制"
 oe_kat.1.b: "于双头鹰旗下检阅大督军重骑兵"
 oe_kat.2.title: "古典管区与大督军区文武合流"
 oe_kat.2.desc: "在光复的古典罗马管区之内，近卫大区政务院派驻的民政副长官正与大督军同堂议政。中枢究竟赋予民政税籍与商路以主导地位，抑或令管区粮秣要塞直隶大督军幕府，将决定整合行省未来的兴盛走向。"
 oe_kat.2.a: "统合民政税籍与大督军驿道"
 oe_kat.2.b: "令管区军需与要塞直隶大督军幕府"
 oe_kat.3.title: "特诏护持帝国海军军区"
 oe_kat.3.desc: "当内陆诸军区纷纷整编为广阔的大督军区之际，海军军区诸提督联名上书大宫：沿海船坞、希腊火工坊与海岛巡航绝不可受制于内陆长官。皇帝明发敕令，将所有海军军区永久豁免于大督军合并之外，直隶帝国海军统帅部。"
 oe_kat.3.a: "永保海军军区独立与船坞特权"
 oe_kat.3.b: "确认豁免并征收海港特许岁课"
 oe_kat.4.title: "大督军叛乱隔离预案启动"
 oe_kat.4.desc: "帝国驿使急报：一处大督军区的将领忠诚已滑落至危险边缘。不同于失控的巨型藩镇，我朝《大督军区宪章》早已预埋熔断机制——只要启封预置密诏，便可即刻将忠顺的兼管子辖区析还为独立古典军区，把任何叛乱火花牢牢锁死在主驻地之内。"
 oe_kat.4.a: "启封隔离密诏，析出忠顺子辖区"
 oe_kat.4.b: "遣御前主计官携 120 金币抚慰军心"
 oe_kat.5.title: "大督军区财政红利"
 oe_kat.5.desc: "总务主计官向御座呈上一卷厚重的羊皮账册：自将零碎行省幕府整编为精干的大督军区后，重叠的属官俸禄与冗杂的转运驿站一扫而空。成箱金币正源源不断汇入君士坦丁堡国库，行省控制力亦随之节节攀升。"
 oe_kat.5.a: "将财政结余悉数拨入帝国国库"
 oe_kat.5.b: "以红利充实帝国权威与皇室威望"
 oe_kat.6.title: "和平复归古典军区建制"
 oe_kat.6.desc: "随着帝国御玺在元老与将领面前当众启封，一处管区大督军区已和平裁撤，其兼管的各处历史驻地悉数复归为独立古典军区。各地豪强与元老皆赞叹这套制度张弛有度——战时可合众为一，平时亦能依诏析分而不伤和气。"
 oe_kat.6.a: "彰扬罗马治术张弛有度之典范"
 oe_kat.6.b: "收回中枢权威以备他日改制"
