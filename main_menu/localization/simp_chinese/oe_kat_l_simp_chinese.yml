 STATIC_MODIFIER_NAME_oe_kat_katepanate_subject_mod: "帝国管区大督军区"
 STATIC_MODIFIER_DESC_oe_kat_katepanate_subject_mod: "升格为统辖多处军区的大督军区后，大督军统筹全管区防务、税籍与兵员补给，既降外交负荷又显帝国威仪。"
 STATIC_MODIFIER_NAME_oe_kat_imperial_synergy_mod: "管区大督军统筹效益"
 STATIC_MODIFIER_DESC_oe_kat_imperial_synergy_mod: "将邻近普通军区自愿整合为大督军区，大幅减轻君士坦丁堡的外交容量负担并提升中枢统筹效率。"
 STATIC_MODIFIER_NAME_oe_kat_charter_doctrine_mod: "大督军区敕令宪章"
 STATIC_MODIFIER_DESC_oe_kat_charter_doctrine_mod: "帝国金玺诏书正式确立大督军位阶，将古典管区建制与军区兵农体制融为一体，令皇权法统更为彰明。"
 STATIC_MODIFIER_NAME_oe_kat_diocese_synergy_mod: "民政管区与大督军协治"
 STATIC_MODIFIER_DESC_oe_kat_diocese_synergy_mod: "古典管区民政副长官与大督军共用税籍与驿道簿册，文武协治令整合后的行省税源丰盈而安定。"
 STATIC_MODIFIER_NAME_oe_kat_diocese_command_mod: "大督军区军政统合"
 STATIC_MODIFIER_DESC_oe_kat_diocese_command_mod: "将管区军需库与要塞防务直隶大督军幕府，显著强化军区常备军纪、人力储备与边防驻军厚度。"
 STATIC_MODIFIER_NAME_oe_kat_naval_autonomy_mod: "帝国海军军区特许独立"
 STATIC_MODIFIER_DESC_oe_kat_naval_autonomy_mod: "明诏将海军军区豁免于陆上大督军整合之外，确保舰队船坞、水兵征募与海道巡弋直属中枢而毫不迟滞。"
 STATIC_MODIFIER_NAME_oe_kat_revolt_containment_mod: "大督军叛乱隔离预案"
 STATIC_MODIFIER_DESC_oe_kat_revolt_containment_mod: "预置的帝国密诏可在大督军动摇之际即刻析出忠顺子辖区，将叛乱波及严格锁死在主驻地与不忠党羽之内。"
 STATIC_MODIFIER_NAME_oe_kat_fiscal_dividend_mod: "大督军区财政红利"
 STATIC_MODIFIER_DESC_oe_kat_fiscal_dividend_mod: "精简后的大督军幕府裁撤冗员驿站与重复俸禄，持续为君士坦丁堡国库输送可观的财政结余。"
 STATIC_MODIFIER_NAME_oe_kat_classical_restoration_mod: "古典军区秩序可逆复归"
 STATIC_MODIFIER_DESC_oe_kat_classical_restoration_mod: "和平将大督军区析回古典军区建制，向全帝国宣告整合完全可逆，令各地将领与元老院深信罗马法度之信义。"
 oe_kat_consolidate_diocese_action: "管区自愿整合为大督军区"
 oe_kat_consolidate_diocese_action_desc: "消耗 #R 10#! 点帝国权威，自愿将所选忠顺主军区周边至多三个符合条件的普通军区整合归并，升格为 #Y 管区大督军区#!。大幅降低军区外交容量开销，同时严格豁免海军军区、世守军区与叛乱锁定军区，且随时可逆析还。"
 PERFORM_oe_kat_consolidate_diocese_action_ACTION_SETUP: "当颁布“管区自愿整合为大督军区”时。"
