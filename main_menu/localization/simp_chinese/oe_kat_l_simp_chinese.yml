 PERFORM_oe_kat_dissolve_katepanate_action_ACTION_DESC: "君士坦丁堡已将一处帝国大督军区和平析还为独立的古典军区。"
 PERFORM_oe_kat_dissolve_katepanate_action_ACTION_LOG: "在帝国支柱中颁布了“析还大督军区为古典军区”。"
