 PERFORM_oe_kat_consolidate_diocese_action_ACTION_DESC: "君士坦丁堡已自愿将一处管区内的普通军区整合为帝国大督军区。"
 PERFORM_oe_kat_consolidate_diocese_action_ACTION_LOG: "在帝国支柱中颁布了“管区自愿整合为大督军区”。"
