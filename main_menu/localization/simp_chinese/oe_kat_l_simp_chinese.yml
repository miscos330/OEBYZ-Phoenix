 oe_kat_dissolve_katepanate_action_desc: "消耗 #R 5#! 点帝国权威，和平裁撤一处管区大督军区，将其兼管的所有历史辖区完整析还为独立古典军区，并安抚地方将领忠诚。"
 PERFORM_oe_kat_dissolve_katepanate_action_ACTION_SETUP: "当颁布“析还大督军区为古典军区”时。"
