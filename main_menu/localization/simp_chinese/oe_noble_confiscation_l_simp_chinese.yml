l_simp_chinese:
 oe_nf_integrate_title: "协助整合"
 oe_nf_integrate_desc: "借世家门生与地方关系疏通政令，使新附之地渐入帝国法度。\n\n选择一个有未整合地点的省份：该豪族获得省内全部东罗马地点的控制，省内地点整合进度增加#G 25个百分点#!。农村独占、阿索斯山及永久禁入规则仍适用。无额外花费，无冷却。"
 oe_nf_confiscate_house: "#R 抄家#!"
 oe_nf_confiscate_house_desc: "以皇命封检宅第，籍没家产，追究门下宗族。\n\n#Y 影响力低于300：#!处死执行时位于东罗马国内的全部家族成员；内帑获得执行前影响力×#G 5#!金币，稳定度与正统性各失去执行前影响力×#R 0.5#!。\n#R 影响力达到300：#!立即爆发贵族阶层内战，该家族失去豪族地位，执行时位于东罗马国内的家族成员全部转往叛乱国家。此档须当前没有内战，且至少有一个有居民的非首都地点供叛军起事。"
 OE_NF_CHOOSE_CONFISCATE: "选择抄家的豪族"
 OE_NF_ARISTOCRATIC_REBELLION: "世家贵族叛军"
 oe_nf_integrate_1: "$oe_nf_integrate_title$"
 oe_nf_integrate_1_desc: "$oe_nf_integrate_desc$"
 oe_nf_integrate_2: "$oe_nf_integrate_title$"
 oe_nf_integrate_2_desc: "$oe_nf_integrate_desc$"
 oe_nf_integrate_3: "$oe_nf_integrate_title$"
 oe_nf_integrate_3_desc: "$oe_nf_integrate_desc$"
 OE_PILLARS_AUTHORITY_COURT_BREAKDOWN: "首席大臣：[GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_court_chancellor_bonus')|+=3]／月。此加成已计入上方月度净变化。"
 OE_PILLARS_OPINION_COURT_BREAKDOWN: "普遍审判官：[GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_court_judge_bonus')|+=3]／月。此加成已计入上方月度净变化。"
 oe_nf_integrate_4: "$oe_nf_integrate_title$"
 oe_nf_integrate_4_desc: "$oe_nf_integrate_desc$"
