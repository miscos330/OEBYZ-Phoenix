 # NEW 2026-11-19 Yuan track Y1 (oe_y1_ Zhengdong and Xuanzheng). Generated by gen_yuan_y1.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_y1_zhengdong: "征东行省"
 STATIC_MODIFIER_DESC_oe_y1_zhengdong: "高丽国王兼任征东行省左丞相，自辟官属，财赋不入都省；新王即位，须得元廷册封。"
 STATIC_MODIFIER_NAME_oe_y1_xz_utsang: "宣政院辖·乌思藏纳里速古鲁孙"
 STATIC_MODIFIER_DESC_oe_y1_xz_utsang: "宣政院掌释教僧徒及吐蕃之境。乌思藏纳里速古鲁孙等三路宣慰司都元帅府统领卫藏与阿里，萨迦本钦由皇帝授任。"
 STATIC_MODIFIER_NAME_oe_y1_xz_dokham: "宣政院辖·吐蕃等路（朵甘思）"
 STATIC_MODIFIER_DESC_oe_y1_xz_dokham: "宣政院掌释教僧徒及吐蕃之境。吐蕃等路宣慰司都元帅府统领朵甘思，即康区诸部。"
 STATIC_MODIFIER_NAME_oe_y1_xz_amdo: "宣政院辖·吐蕃等处（脱思麻）"
 STATIC_MODIFIER_DESC_oe_y1_xz_amdo: "宣政院掌释教僧徒及吐蕃之境。吐蕃等处宣慰司都元帅府统领脱思麻，即安多与陇右诸番，驻河州。"
 STATIC_MODIFIER_NAME_oe_y1_ki_clan: "奇氏外戚"
 STATIC_MODIFIER_DESC_oe_y1_ki_clan: "奇皇后的族人在高丽恃势专横，朝中多有依附者。"
 STATIC_MODIFIER_NAME_oe_y1_king_in_dadu: "国王羁留大都"
 STATIC_MODIFIER_DESC_oe_y1_king_in_dadu: "国王被押往大都，在元廷等候发落，国中政务无人主持。伯颜失势后，国王即可返国。"
 oe_y1_dishi_envoy: "帝师抚谕"
 oe_y1_tib_petition: "上书请留旧本钦"
 oe_y1_shen_faction: "沈王一党作乱"
 oe_y1_no_investiture: "不待册封擅自即位"
 oe_y1_ki_raised: "立奇氏为后"
 oe_y1_king_deposed: "废黜国王"
 oe_y1_lisuo_abolished: "罢理问所"
 oe_y1_stayed_loyal: "仍奉元廷"
 oe_y1.1.t: "立行宣政院"
 oe_y1.1.d: "#F 至元三年五月（1337年6月），西番起事，杀死镇西王之子党兀班。朝廷立行宣政院，以也先帖木儿为院使，前往征讨。宣政院秩从一品，掌释教僧徒及吐蕃之境而隶治之。#!\n\n如今，西番之乱的消息传到了大都。#bold #color_yellow 宣政院#!#!请示：是另立行院、发兵征讨，还是请帝师出面抚谕？"
 oe_y1.1.a: "立行宣政院，遣也先帖木儿往讨"
 oe_y1.1.a.tt: "带#bold #color_yellow 宣政院辖#!#!标记的附属：自由意愿#G −5#!。"
 oe_y1.1.b: "请帝师与萨迦出面抚谕"
 oe_y1.1.c: "置之不问"
 oe_y1.1.c.tt: "带#bold #color_yellow 宣政院辖#!#!标记的附属：自由意愿#R +5#!。"
 oe_y1.2.t: "萨迦本钦易人"
 oe_y1.2.d: "#F 据伯戴克（Luciano Petech）考订，1337年萨迦本钦由旺秋贝换为索南贝，索南贝一直任职到1344年。本钦由皇帝授任，统领乌思藏的军民。#!\n\n如今，#bold #color_yellow 宣政院#!#!的新任命送到了萨迦。"
 oe_y1.2.a: "奉诏，迎接新本钦"
 oe_y1.2.b: "上书宣政院，请留旧人"
 oe_y1.3.t: "新王请封"
 oe_y1.3.d1: "#F 至元五年（1339年），高丽忠肃王去世。权臣伯颜不理会高丽的请求，元廷迟迟不册封新王。八月，曹頔拥立沈王王暠，率千余人袭击王宫，兵败被杀。十一月，元使把忠惠王押往大都；次年正月，忠惠王被交刑部审问。伯颜倒台后，忠惠王获释，三月得到元廷承认，复位为王。#!\n\n如今，先王已薨，元廷的册封迟迟未到，沈王一党蠢蠢欲动。\n说明：我国带有[ShowModifier('oe_y1_zhengdong')]标记。这位国王若一直在位，数年后元廷可能借立省之议将其废黜（史实为1343年）。"
 oe_y1.3.d: "#F 高丽国王兼任征东行省左丞相，自辟官属，财赋不入都省；新王即位，要等元廷册封。#!\n\n如今，新王即位，须奉表向元廷请封。\n说明：我国带有[ShowModifier('oe_y1_zhengdong')]标记。这位国王若一直在位，数年后元廷可能借立省之议将其废黜（史实为1343年）。"
 oe_y1.3.a: "平定异议，奉表请封"
 oe_y1.3.a.tt: "伯颜在元廷当权时：国王被押往大都，我国获得[ShowModifier('oe_y1_king_in_dadu')]（每月正统性#R −0.1#!，内阁效率#R −10%#!；最长#Y 18#!个月，伯颜失势的下一个月撤除）。沈王王暠在世时，我国另对沈王国的好感#Y −25#!（#Y 120#!个月）。\n伯颜已不当权时：正统性#G +5#!。\n原版“蒙古影响”计数#R +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.3.b: "厚赂元廷权臣"
 oe_y1.3.b.tt: "大元得到同额的金钱。\n原版“蒙古影响”计数#R +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.3.c: "不待册封，自行即位"
 oe_y1.3.c.tt: "原版“蒙古影响”计数#G −2#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.4.t: "奇氏立为第二皇后"
 oe_y1.4.d: "#F 高丽人奇氏得宠于顺帝。顺帝想立奇氏为皇后，丞相伯颜力争不可。伯颜罢相后，沙剌班奏请立奇氏为第二皇后，居兴圣宫，并改徽政院为资正院。#!\n\n如今，伯颜已去，沙剌班上奏请立奇氏。"
 oe_y1.4.a: "立为第二皇后，改徽政院为资正院"
 oe_y1.4.a.tt: "高丽仍带[ShowModifier('oe_y1_zhengdong')]标记时，获得[ShowModifier('oe_y1_ki_clan')]（对宗主忠诚#G +5#!，贵族阶层势力#Y +10%#!），随征东行省标记续期，标记撤除时一并撤除。\n高丽的原版“蒙古影响”计数#G +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.4.b: "恪守旧制，不立"
 oe_y1.5.t: "立省之议"
 oe_y1.5.d: "#F 至正三年八月（1343年），李芸、曹益清、奇辙在元廷上书，以高丽王“贪淫不道”为由，请在高丽立行省。元廷没有立省；十一月派使者把高丽王押往大都，十二月流放揭阳。次年正月，被废的国王死在途中的岳阳。#!\n\n如今，立省的奏章摆在中书省的案头。"
 oe_y1.5.a: "不立行省，废黜高丽王"
 oe_y1.5.a.tt: "高丽有继承人时：继承人即位；旧王被押来大都，#Y 2#!个月后死去。高丽对我国的好感#R −30#!（#Y 120#!个月），高丽稳定度#Y −2.5#!。\n高丽没有继承人时：只让高丽的正统性#Y −10#!。\n（高丽由玩家操控时也是如此。）"
 oe_y1.5.b: "驳回所请，令高丽王自省"
 oe_y1.6.t: "罢征东行省理问所"
 oe_y1.6.d1: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。奇皇后的族人在国中恃势专横。双城早已收复。国王召集心腹，商议如何处置奇氏一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.d2: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。奇皇后的族人在国中恃势专横。双城仍在元人手中。国王召集心腹，商议如何处置奇氏一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.d3: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。双城早已收复。国王召集心腹，商议如何处置附元一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.d: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。双城仍在元人手中。国王召集心腹，商议如何处置附元一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.a: "诛附元一党，罢理问所"
 oe_y1.6.a.tt: "撤除[ShowModifier('oe_y1_zhengdong')]标记（连同[ShowModifier('oe_y1_ki_clan')]）。\n原版“蒙古影响”计数#G −3#!（原版事件“蒙元治下”设下这一计数后才生效）。\n最多#Y 2#!名蒙古贵族人物迁回大元。"
 oe_y1.6.b: "仍奉元廷"
 oe_y1.6.b.tt: "原版“蒙古影响”计数#R +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.20.t: "征东与宣政院：选项生效"
 oe_y1.21.t: "【测试】高丽国王去世"
 oe_y1.22.t: "【测试】大元放弃吐蕃诸附属"
 oe_y1.23.t: "【测试】大元放弃高丽"
