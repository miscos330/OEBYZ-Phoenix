 oe_y1.90.d: "#T 日程#!\n月份 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_m').GetValue|0]（1337年4月为0，−1未开始）  本线运行中 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_on').GetValue|0]  已发事件 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_n').GetValue|0]\n各事件状态（0待发、1已发、2放弃）：1:[ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_st1').GetValue|0]  2:[ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_st2').GetValue|0]  3:[ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_st3').GetValue|0]  4:[ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_st4').GetValue|0]  5:[ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_st5').GetValue|0]  6:[ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_st6').GetValue|0]\n等待的时刻（月份，−1未到）：高丽王位更替 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_dking').GetValue|0]  伯颜失势 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_dbayan').GetValue|0]  红巾开始 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_drtr').GetValue|0]\n#T 征东行省#!\n高丽带征东行省标记 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_zd').GetValue|0]  结束原因 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_zdend').GetValue|0]（0未结束；1原版事件“打破蒙元枷锁”、2罢理问所（本线 .6）、3高丽不再是大元的附属、4大元崩溃、5高丽已不存在）  结束月份 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_zdendm').GetValue|0]\n奇氏立后的月份 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_ki').GetValue|0]  奇氏外戚 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_kiclan').GetValue|0]  国王羁留大都 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_dadu').GetValue|0]  被废高丽王的死亡月份 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_exile').GetValue|0]（0无）\n原版“蒙古影响”计数 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_korinf').GetValue|0]（−99未设）  原版高丽事件已触发：“蒙元治下” [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_kor1').GetValue|0]  “打破蒙元枷锁” [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_kor4').GetValue|0]  “巩固蒙元羁绊” [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_kor5').GetValue|0]\n#T 宣政院#!\n带宣政院辖标记的国家 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_xz').GetValue|0]  全部撤完的月份 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_xzend').GetValue|0]（0未撤完）  首都在吐蕃区的大元附属 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_tibsub').GetValue|0]  原版红巾 .44已触发 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_rtr44').GetValue|0]\n#T 大元#!\n伯颜当权 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_bayan').GetValue|0]  红巾局势进行中 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_rtr').GetValue|0]  判定大元已崩溃 [ROOT.GetCountry.MakeScope.GetVariable('oe_y1_r_fallen').GetValue|0]"
 oe_y1.90.a: "关闭"
