l_simp_chinese:
 # NEW 2026-11-19 Yuan track Y1 (oe_y1_ Zhengdong and Xuanzheng). Generated by gen_yuan_y1.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_y1_zhengdong: "征东行省"
 STATIC_MODIFIER_DESC_oe_y1_zhengdong: "高丽国王兼任征东行省左丞相，自辟官属，财赋不入都省；新王即位，须得元廷册封。"
 STATIC_MODIFIER_NAME_oe_y1_xz_utsang: "宣政院辖·乌思藏纳里速古鲁孙"
 STATIC_MODIFIER_DESC_oe_y1_xz_utsang: "宣政院掌释教僧徒及吐蕃之境。乌思藏纳里速古鲁孙等三路宣慰司都元帅府统领卫藏与阿里，萨迦本钦由皇帝授任。"
 STATIC_MODIFIER_NAME_oe_y1_xz_dokham: "宣政院辖·吐蕃等路（朵甘思）"
 STATIC_MODIFIER_DESC_oe_y1_xz_dokham: "宣政院掌释教僧徒及吐蕃之境。吐蕃等路宣慰司都元帅府统领朵甘思，即康区诸部。"
 STATIC_MODIFIER_NAME_oe_y1_xz_amdo: "宣政院辖·吐蕃等处（脱思麻）"
 STATIC_MODIFIER_DESC_oe_y1_xz_amdo: "宣政院掌释教僧徒及吐蕃之境。吐蕃等处宣慰司都元帅府统领脱思麻，即安多与陇右诸番，驻河州。"
 STATIC_MODIFIER_NAME_oe_y1_ki_clan: "奇氏外戚"
 STATIC_MODIFIER_DESC_oe_y1_ki_clan: "奇皇后的族人在高丽恃势专横，朝中多有依附者。"
 STATIC_MODIFIER_NAME_oe_y1_king_in_dadu: "国王羁留大都"
 STATIC_MODIFIER_DESC_oe_y1_king_in_dadu: "国王被押往大都，在元廷等候发落，国中政务无人主持。伯颜失势后，国王即可返国。"
 STATIC_MODIFIER_NAME_oe_y1_phm_autonomous_pact: "帕木竹巴宗制自治"
 STATIC_MODIFIER_DESC_oe_y1_phm_autonomous_pact: "乃东大司徒改行宗制、复兴吐蕃旧典，名义仍奉元廷宣政院而实权尽归卫藏本土。"
 STATIC_MODIFIER_NAME_oe_y1_tibet_charter: "雪域羁縻新约"
 STATIC_MODIFIER_DESC_oe_y1_tibet_charter: "元廷以厚赐与封号羁縻帕木竹巴，雪域诸部重修岁贡，然朝廷岁赐开销不轻。"
 STATIC_MODIFIER_NAME_oe_y1_tibet_direct: "行宣政院分治监军"
 STATIC_MODIFIER_DESC_oe_y1_tibet_direct: "元廷在卫藏重设行院监军、分制诸城，藩属畏威而中枢文书调度愈加繁重。"
 STATIC_MODIFIER_NAME_oe_y1_tea_horse_accord: "川藏茶马互市"
 STATIC_MODIFIER_DESC_oe_y1_tea_horse_accord: "朝廷不再遥制卫藏内政，专以茶马互市通有无，边贸得利而天朝威仪稍损。"
 STATIC_MODIFIER_NAME_oe_y1_phm_dzong: "帕木竹巴宗制"
 STATIC_MODIFIER_DESC_oe_y1_phm_dzong: "帕木竹巴在当地改置宗堡，整饬番兵与田赋，地方秩序稳固而独立倾向日增。"
 STATIC_MODIFIER_NAME_oe_y1_sakya_twilight: "萨迦残晖"
 STATIC_MODIFIER_DESC_oe_y1_sakya_twilight: "昔日执掌卫藏的萨迦本钦势衰，寺产与驿道均受帕木竹巴侵削。"
 STATIC_MODIFIER_NAME_oe_y1_sakya_garrison: "宣政院驻军镇戍"
 STATIC_MODIFIER_DESC_oe_y1_sakya_garrison: "宣政院遣兵驻守要冲以维系旧制，控制力暂固而军需征发引发番民怨望。"
 STATIC_MODIFIER_NAME_oe_y1_plateau_turmoil: "雪域兵燹"
 STATIC_MODIFIER_DESC_oe_y1_plateau_turmoil: "萨迦与乃东争锋兼之川藏用兵，商旅断绝，驿站与僧俗庄园多遭焚掠。"
 STATIC_MODIFIER_NAME_oe_y1_phm_autonomy: "卫藏自主旧俗"
 STATIC_MODIFIER_DESC_oe_y1_phm_autonomy: "元廷遥制渐疏，当地依吐蕃古法自治，民心自安而大都政令难达。"
 STATIC_MODIFIER_NAME_oe_y1_tibet_settled: "雪域新定"
 STATIC_MODIFIER_DESC_oe_y1_tibet_settled: "大都与乃东议定新约，卫藏商路与朝觐复通，地方以适度自治换取长治久安。"
 oe_y1_dishi_envoy: "帝师抚谕"
 oe_y1_tib_petition: "上书请留旧本钦"
 oe_y1_shen_faction: "沈王一党作乱"
 oe_y1_no_investiture: "不待册封擅自即位"
 oe_y1_ki_raised: "立奇氏为后"
 oe_y1_king_deposed: "废黜国王"
 oe_y1_lisuo_abolished: "罢理问所"
 oe_y1_stayed_loyal: "仍奉元廷"
 oe_y1_phm_invested: "册封大司徒"
 oe_y1_phm_expedition: "遣兵干涉卫藏"
 oe_y1_phm_failed_exp: "兴师无功"
 oe_y1_phm_abandoned: "坐视吐蕃失序"
 oe_y1_phm_denounced: "谴责新制断岁赐"
 oe_y1_phm_new_charter: "重订雪域羁縻新约"
 oe_y1_phm_direct_bureau: "复设行院监军"
 oe_y1_tib_dzong_reform: "擅改宗制"
 oe_y1_tib_upheld_sakya: "护持萨迦旧约"
 oe_y1_tib_broke_pact: "尽废十三万户"
 oe_y1.1.t: "立行宣政院"
 oe_y1.1.d: "#F 至元三年五月（1337年6月），西番起事，杀死镇西王之子党兀班。朝廷立行宣政院，以也先帖木儿为院使，前往征讨。宣政院秩从一品，掌释教僧徒及吐蕃之境而隶治之。#!\n\n如今，西番之乱的消息传到了大都。#bold #color_yellow 宣政院#!#!请示：是另立行院、发兵征讨，还是请帝师出面抚谕？"
 oe_y1.1.a: "立行宣政院，遣也先帖木儿往讨"
 oe_y1.1.a.tt: "带#bold #color_yellow 宣政院辖#!#!标记的附属：自由意愿#G −5#!。"
 oe_y1.1.b: "请帝师与萨迦出面抚谕"
 oe_y1.1.c: "置之不问"
 oe_y1.1.c.tt: "带#bold #color_yellow 宣政院辖#!#!标记的附属：自由意愿#R +5#!。"
 oe_y1.2.t: "萨迦本钦易人"
 oe_y1.2.d: "#F 据伯戴克（Luciano Petech）考订，1337年萨迦本钦由旺秋贝换为索南贝，索南贝一直任职到1344年。本钦由皇帝授任，统领乌思藏的军民。#!\n\n如今，#bold #color_yellow 宣政院#!#!的新任命送到了萨迦。"
 oe_y1.2.a: "奉诏，迎接新本钦"
 oe_y1.2.b: "上书宣政院，请留旧人"
 oe_y1.3.t: "新王请封"
 oe_y1.3.d1: "#F 至元五年（1339年），高丽忠肃王去世。权臣伯颜不理会高丽的请求，元廷迟迟不册封新王。八月，曹頔拥立沈王王暠，率千余人袭击王宫，兵败被杀。十一月，元使把忠惠王押往大都；次年正月，忠惠王被交刑部审问。伯颜倒台后，忠惠王获释，三月得到元廷承认，复位为王。#!\n\n如今，先王已薨，元廷的册封迟迟未到，沈王一党蠢蠢欲动。\n说明：我国带有[ShowModifier('oe_y1_zhengdong')]标记。这位国王若一直在位，数年后元廷可能借立省之议将其废黜（史实为1343年）。"
 oe_y1.3.d: "#F 高丽国王兼任征东行省左丞相，自辟官属，财赋不入都省；新王即位，要等元廷册封。#!\n\n如今，新王即位，须奉表向元廷请封。\n说明：我国带有[ShowModifier('oe_y1_zhengdong')]标记。这位国王若一直在位，数年后元廷可能借立省之议将其废黜（史实为1343年）。"
 oe_y1.3.a: "平定异议，奉表请封"
 oe_y1.3.a.tt: "伯颜在元廷当权时：国王被押往大都，我国获得[ShowModifier('oe_y1_king_in_dadu')]（每月正统性#R −0.1#!，内阁效率#R −10%#!；最长#Y 18#!个月，伯颜失势的下一个月撤除）。沈王王暠在世时，我国另对沈王国的好感#Y −25#!（#Y 120#!个月）。\n伯颜已不当权时：正统性#G +5#!。\n原版“蒙古影响”计数#R +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.3.b: "厚赂元廷权臣"
 oe_y1.3.b.tt: "大元得到同额的金钱。\n原版“蒙古影响”计数#R +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.3.c: "不待册封，自行即位"
 oe_y1.3.c.tt: "原版“蒙古影响”计数#G −2#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.4.t: "奇氏立为第二皇后"
 oe_y1.4.d: "#F 高丽人奇氏得宠于顺帝。顺帝想立奇氏为皇后，丞相伯颜力争不可。伯颜罢相后，沙剌班奏请立奇氏为第二皇后，居兴圣宫，并改徽政院为资正院。#!\n\n如今，伯颜已去，沙剌班上奏请立奇氏。"
 oe_y1.4.a: "立为第二皇后，改徽政院为资正院"
 oe_y1.4.a.tt: "高丽仍带[ShowModifier('oe_y1_zhengdong')]标记时，获得[ShowModifier('oe_y1_ki_clan')]（对宗主忠诚#G +5#!，贵族阶层势力#Y +10%#!），随征东行省标记续期，标记撤除时一并撤除。\n高丽的原版“蒙古影响”计数#G +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.4.b: "恪守旧制，不立"
 oe_y1.5.t: "立省之议"
 oe_y1.5.d: "#F 至正三年八月（1343年），李芸、曹益清、奇辙在元廷上书，以高丽王“贪淫不道”为由，请在高丽立行省。元廷没有立省；十一月派使者把高丽王押往大都，十二月流放揭阳。次年正月，被废的国王死在途中的岳阳。#!\n\n如今，立省的奏章摆在中书省的案头。"
 oe_y1.5.a: "不立行省，废黜高丽王"
 oe_y1.5.a.tt: "高丽有继承人时：继承人即位；旧王被押来大都，#Y 2#!个月后死去。高丽对我国的好感#R −30#!（#Y 120#!个月），高丽稳定度#Y −2.5#!。\n高丽没有继承人时：只让高丽的正统性#Y −10#!。\n（高丽由玩家操控时也是如此。）"
 oe_y1.5.b: "驳回所请，令高丽王自省"
 oe_y1.6.t: "罢征东行省理问所"
 oe_y1.6.d1: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。奇皇后的族人在国中恃势专横。双城早已收复。国王召集心腹，商议如何处置奇氏一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.d2: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。奇皇后的族人在国中恃势专横。双城仍在元人手中。国王召集心腹，商议如何处置奇氏一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.d3: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。双城早已收复。国王召集心腹，商议如何处置附元一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.d: "#F 至正十六年五月（1356年），恭愍王诛杀奇辙等附元势力，同月罢征东行省理问所，停用元朝年号，恢复旧官制；七月，柳仁雨攻破双城总管府。此后，征东行省只剩下名义。#!\n\n如今，红巾四起，元廷自顾不暇。双城仍在元人手中。国王召集心腹，商议如何处置附元一党与#bold #color_yellow 征东行省#!#!的#bold #color_yellow 理问所#!#!。"
 oe_y1.6.a: "诛附元一党，罢理问所"
 oe_y1.6.a.tt: "撤除[ShowModifier('oe_y1_zhengdong')]标记（连同[ShowModifier('oe_y1_ki_clan')]）。\n原版“蒙古影响”计数#G −3#!（原版事件“蒙元治下”设下这一计数后才生效）。\n最多#Y 2#!名蒙古贵族人物迁回大元。"
 oe_y1.6.b: "仍奉元廷"
 oe_y1.6.b.tt: "原版“蒙古影响”计数#R +1#!（原版事件“蒙元治下”设下这一计数后才生效）。"
 oe_y1.10.t: "帕木竹巴起兵与萨迦告急"
 oe_y1.10.d: "#F 至正十四年（1354年），乌思藏帕木竹巴万户长朗氏绛曲坚赞因与萨迦本钦积怨日深，自乃东兴兵西进，连克前藏诸部并逼近萨迦。萨迦急遣使者驰赴大都告变，宣政院治理卫藏近百年的旧局骤然动摇。#!\n\n如今，萨迦急报与乃东请封表文先后抵京。中原战事正殷，#bold #color_yellow 宣政院#!#!请示：是顺势册封绛曲坚赞为大司徒以存羁縻，还是发兵川藏援护萨迦，抑或置卫藏于度外？"
 oe_y1.10.a: "册封绛曲坚赞为大司徒，以羁縻存体面"
 oe_y1.10.a.tt: "吐蕃自由意愿#R +15#!，对我国好感#G +15#!（#Y 120#!个月）；乃东获得[ShowModifier('oe_y1_phm_dzong')]，萨迦获得[ShowModifier('oe_y1_sakya_twilight')]（均#Y 120#!个月）。数年后乃东或改行宗制。"
 oe_y1.10.b: "严诏川陕、朵甘思诸部发兵援萨迦"
 oe_y1.10.b.tt: "若平乱之势不低于#Y 55#!（或政局稳固）：远征得手，威望#G +5#!，吐蕃自由意愿#G −10#!，好感#R −15#!，萨迦与日喀则获[ShowModifier('oe_y1_sakya_garrison')]（#Y 60#!个月）。\n否则：远征受挫，威望#R −10#!，吐蕃自由意愿#R +25#!，好感#R −25#!，拉萨与日喀则遭[ShowModifier('oe_y1_plateau_turmoil')]。"
 oe_y1.10.c: "置乌思藏于度外，专力中原"
 oe_y1.10.c.tt: "吐蕃自由意愿#R +30#!，对我国好感#R −25#!（#Y 120#!个月）；拉萨与乃东获得[ShowModifier('oe_y1_phm_autonomy')]（#Y 120#!个月）。"
 oe_y1.11.t: "乃东兴起：萨迦残晖与吐蕃新制"
 oe_y1.11.d: "#F 至正十四年（1354年），乃东帕木竹巴万户长绛曲坚赞击败萨迦守军，卫藏实权自萨迦渐移乃东。面对元廷宣政院的册命与压力，卫藏诸寺与世族必须抉择新局。#!\n\n如今，大都的回音已至高原。萨迦旧制摇摇欲坠，乃东新法方兴，我国将如何自处？"
 oe_y1.11.a: "奉大司徒改行宗制，尊元为名义宗主"
 oe_y1.11.a.tt: "乃东与拉萨获得[ShowModifier('oe_y1_phm_dzong')]（#Y 120#!个月）；大元对我国好感#R −10#!。"
 oe_y1.11.b: "护持萨迦旧本钦，依宣政院旧约"
 oe_y1.11.b.tt: "萨迦获得[ShowModifier('oe_y1_sakya_garrison')]（#Y 60#!个月）；大元对我国好感#G +15#!。"
 oe_y1.11.c: "废十三万户，尽去蒙古旧制"
 oe_y1.11.c.tt: "拉萨、乃东与日喀则获得[ShowModifier('oe_y1_phm_autonomy')]（#Y 120#!个月）；大元对我国好感#R −30#!。"
 oe_y1.12.t: "废十三万户、复吐蕃古制"
 oe_y1.12.d: "#F 至正十六年至十八年间（1356至1358年），大司徒绛曲坚赞尽掌卫藏，遂废元朝所置十三万户与蒙古律例，改建宗堡并颁行吐蕃古法，萨迦一系彻底退出政坛。#!\n\n如今，乃东遣人呈报卫藏新政：虽仍奉元朝封号，实已改行宗制、尽易旧章。朝廷是否默忍此变？"
 oe_y1.12.a: "默忍新制，诏谕宣政院仍通岁贡"
 oe_y1.12.a.tt: "吐蕃自由意愿#R +10#!并获得[ShowModifier('oe_y1_phm_autonomous_pact')]；乃东与拉萨获得[ShowModifier('oe_y1_phm_dzong')]（#Y 120#!个月）。"
 oe_y1.12.b: "谴责僭越，断绝岁赐以示天威"
 oe_y1.12.b.tt: "吐蕃自由意愿#R +25#!，对我国好感#R −30#!（#Y 120#!个月）；萨迦与日喀则遭[ShowModifier('oe_y1_plateau_turmoil')]（#Y 60#!个月）。"
 oe_y1.13.t: "雪域新约：后至正吐蕃定局"
 oe_y1.13.d: "#F 自1354年帕木竹巴代萨迦而兴，卫藏政局历经十余载震荡，宗制渐趋稳固。大元若能挺过元末之变、重振纲纪，乃东新主必遣使入京请封，雪域羁縻由此进入新局。#!\n\n如今，来自拉萨与乃东的僧俗使团齐集大都，呈献方物并请重定雪域旧约。#bold #color_yellow 宣政院#!#!呈上三策，请旨定夺。"
 oe_y1.13.a: "册封乃东法王，重订宣政羁縻新约"
 oe_y1.13.a.tt: "我国获得[ShowModifier('oe_y1_tibet_charter')]（#Y 120#!个月）；吐蕃对我国好感#G +20#!（若为附属则自由意愿#G −15#!）；拉萨与乃东获得[ShowModifier('oe_y1_tibet_settled')]（#Y 120#!个月）。"
 oe_y1.13.b: "复设行宣政院监军，分制卫藏四城"
 oe_y1.13.b.tt: "我国获得[ShowModifier('oe_y1_tibet_direct')]（#Y 120#!个月）；吐蕃对我国好感#R −20#!（若为附属则自由意愿#R +15#!）；萨迦与日喀则获得[ShowModifier('oe_y1_sakya_garrison')]（#Y 120#!个月）。"
 oe_y1.13.c: "止通茶马互市，不复遥制卫藏"
 oe_y1.13.c.tt: "我国获得[ShowModifier('oe_y1_tea_horse_accord')]（#Y 120#!个月），不复干预卫藏内政。"
 oe_y1.20.t: "征东与宣政院：选项生效"
 oe_y1.21.t: "【测试】高丽国王去世"
 oe_y1.22.t: "【测试】大元放弃吐蕃诸附属"
 oe_y1.23.t: "【测试】大元放弃高丽"
