# NEW 2026-11-24 v24.0 Phase 2A-2C Early-1337 Historical Opening Depth Pack Europe & Steppes (oe_v240_eu_, gen_v240_1337_europe_depth.py) — simp_chinese localization (235 keys). Edit gen_v240_1337_europe_depth.py, not this file.
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_wool_crisis:0 "英格兰羊毛禁运·市镇调停"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_wool_crisis:0 "根特与布鲁日市民代表奔走英伦斡旋开禁，尽管短期织机受挫，城市行会与商路外交已获喘息之机。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_french_loyalist:0 "恪守法兰西宗主封约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_french_loyalist:0 "弗兰德伯爵力挺瓦卢瓦王室并查抄英商货栈，赢得骑士贵族与巴黎宫廷赞誉，却令织布商港饱受禁运煎熬。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_alt_staple:0 "波罗的海与卡斯蒂利亚替代毛源"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_alt_staple:0 "伯爵府贴补船费自卡斯蒂利亚与北方诸港急调生毛，竭力维系三大织布名城机杼不绝。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_artevelde_council:0 "阿特维尔德三大名城执政会"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_artevelde_council:0 "根特护民官雅各布·范·阿特维尔德联结根特、布鲁日与伊普尔三大名城重开羊毛贸易，织布业与市民财政蒸蒸日上。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_comital_authority:0 "丹皮埃尔伯爵府威权整肃"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_comital_authority:0 "伯爵亲率布鲁日骑士团遏制根特行会越权，以封建军纪重树丹皮埃尔家族在低地的正统权威。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_ghent_pact:0 "1340年根特星期五广场盟约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_ghent_pact:0 "弗兰德诸城公开奉爱德华三世为法兰西合法君主，换取英格兰羊毛全线解禁与北海商船护航。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_eng_flemish_staple:0 "弗兰德羊毛专卖与海峡盟埠"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_eng_flemish_staple:0 "根特与布鲁日向英格兰舰队敞开港门，羊毛出口税款与斯勒伊斯海峡补给源源不断充实英王战资。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_armed_neutrality:0 "低地武装中立宪章"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_armed_neutrality:0 "弗兰德在巴黎与伦敦之间恪守武装中立，严守斯海尔德河堡垒并保全商路免遭兵燹。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_elder_union:0 "两勃艮第与阿图瓦卡佩联统"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_elder_union:0 "厄德四世与让娜三世统筹第戎、多勒与阿拉斯三地书记厅，化公国、自由伯国与阿图瓦为西欧举足轻重的邦联。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_saone_knights:0 "索恩河畔勃艮第重骑军团"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_saone_knights:0 "公爵优先整编第戎与奥顿本土骑士采邑，锻造一支在法德边疆令人生畏的勃艮第重装骑兵劲旅。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_valois_bridge:0 "第戎三级会议继承宪章"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_valois_bridge:0 "老卡佩宗室暮年之际，第戎三级会议明定公国不可分割与法统承继之制，为日后瓦卢瓦勃艮第崛起奠定稳固根基。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_imperial_tilt:0 "帝国自由伯国东向纽带"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_imperial_tilt:0 "勃艮第宫廷深耕多勒与贝桑松的帝国采邑通道，在法兰西王权之外另辟莱茵—罗讷商政回旋空间。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_montfort_cause:0 "蒙福尔党与大西洋海防同盟"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_montfort_cause:0 "布列塔尼支持让·德·蒙福尔并向英格兰舰队开放布雷斯特与南特良港，倚海控峡死守公国自主。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_blois_cause:0 "布卢瓦正统与法兰西骑士援军"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_blois_cause:0 "尊奉孔夫朗裁决拥立夏尔·德·布卢瓦，赢得法兰西重骑与雷恩大贵族驰援以巩固公国法统。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_hennebont_bastion:0 "亨讷邦烈焰贞德城防志"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_hennebont_bastion:0 "铭记佛兰德女公爵让娜固守亨讷邦的英勇事迹，布列塔尼各边堡与海港守军士气高昂、固若金汤。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_malestroit_truce:0 "马莱特鲁瓦休战与商船复兴"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_malestroit_truce:0 "借教廷斡旋的《马莱特鲁瓦休战协定》休养生息，布列塔尼海盐、葡萄酒与大西洋航运重焕生机。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_por_rio_salado:0 "萨拉多河勇士·伊比利亚联军"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_por_rio_salado:0 "阿方索四世冰释前嫌挥师驰援塔里法，与卡斯蒂利亚并肩击溃海峡劲敌，赢得「勇王」美名与全欧敬仰。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_por_atlantic_watch:0 "阿尔加维海防与大西洋舰队"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_por_atlantic_watch:0 "里斯本王室优先扩编战船舰队、严防马格里布海盗袭扰阿尔加维海岸，为葡萄牙大西洋海权蓄力。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_por_coimbra_order:0 "科英布拉王室枢密秩序"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_por_coimbra_order:0 "阿方索四世果断理顺科英布拉宫廷与王储佩德罗身侧卡斯特罗党派纷争，避免外戚干政动摇葡萄牙王基。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_munich_jurists:0 "慕尼黑帝国法学家团"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_munich_jurists:0 "路易四世庇护奥卡姆的威廉与帕多瓦的马西利乌斯等顶尖学士，以政教分立学说在神圣罗马帝国掀起思想浪潮。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_avignon_embassy:0 "阿维尼翁忏悔和解使团"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_avignon_embassy:0 "巴伐利亚宫廷遣使阿维尼翁寻求解除1324年绝罚，虽受法兰西掣肘，仍暂缓德意志境内的教会禁令压力。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_licet_iuris:0 "《伦塞宣言》与《法理诏书》"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_licet_iuris:0 "1338年选帝侯于伦塞齐声宣示罗马人之王无须教宗核准，路易四世随即在法兰克福颁行《法理诏书》，确立帝国宪政主权。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_rhense_compact:0 "伦塞选帝侯防卫同盟"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_rhense_compact:0 "将伦塞宣言限定为选帝侯互保宪章而不径行与教廷决裂，温和凝聚帝国诸侯共识与内部安宁。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_alpine_corridor:0 "维特尔斯巴赫布伦纳山口走廊"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_alpine_corridor:0 "借蒂罗尔联姻将巴伐利亚与勃兰登堡势力贯通布伦纳山口，掌控德意商道与阿尔卑斯重税，却也激怒卢森堡王室。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_reichsfrieden:0 "巴伐利亚—波希米亚帝国和解"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_reichsfrieden:0 "皇帝克制在蒂罗尔的越权婚姻干预，与卢森堡家族达成帝国和平妥协，稳固德意志内政秩序。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_trinacria_defiance:0 "特里纳克里亚王冠孤岛抗争"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_trinacria_defiance:0 "老王腓特烈三世虽逝，西西里岛民仍继承晚祷起义遗风，顶住教廷禁令与安茹那不勒斯舰队步步紧逼。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_papal_overture:0 "巴勒莫—阿维尼翁解禁试探"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_papal_overture:0 "彼得二世遣使阿维尼翁恳请宽免1321年以来的教谕禁令，以温和姿态缓和西西里教会与海商焦虑。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_catalan_faction:0 "卡塔尼亚加泰罗尼亚派执政"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_catalan_faction:0 "王廷倚重阿拉贡系阿拉戈纳与佩拉尔塔豪门镇守东岛，以精锐骑士军纪维系阿拉贡—西西里血脉纽带。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_latin_faction:0 "巴勒莫拉丁巴罗尼和解"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_latin_faction:0 "王廷向基亚拉蒙特与帕利齐等本土拉丁豪族让渡港税与领地特权，换取巴勒莫与墨西拿富户财税支持。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_randazzo_regency:0 "兰达佐摄政王室仲裁"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_randazzo_regency:0 "摄政公爵乔瓦尼·迪·兰达佐居中调停加泰罗尼亚与拉丁两派火并，为幼王路易一世保全王室直领与岛内秩序。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_catania_peace:0 "1347年《卡塔尼亚和约》谷贸复兴"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_catania_peace:0 "与那不勒斯女王乔万娜一世缔结《卡塔尼亚和约》后，西西里漫长海战暂歇，小麦出口与港口市集迅速复苏。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_messina_bastion:0 "墨西拿海峡铁壁舰队"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_messina_bastion:0 "断然拒绝向那不勒斯纳贡，加固墨西拿与叙拉古炮台并整饬战船舰队，扼守中地中海黄金海峡。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_laupen_halberds:0 "劳彭之役·阿尔卑斯戟兵方阵"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_laupen_halberds:0 "1339年森林诸州戟兵越过布吕尼希山口驰援伯尔尼，在劳彭击溃重甲贵族联军，令瑞士步兵方阵威震中欧。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_gotthard_tolls:0 "圣哥达山口隘口联防"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_gotthard_tolls:0 "森林诸州专注加固圣哥达山口栈道与关卡，坐收穿越阿尔卑斯南北商队税赋并涵养本土兵力。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_zurich_pact:0 "1351年苏黎世永久盟约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_zurich_pact:0 "鲁道夫·布伦主政的帝国自由城苏黎世正式加盟瑞士联邦，将利马特河手工业财源与市民智慧注入森林诸州。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_limmat_trade:0 "利马特河中立商约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_limmat_trade:0 "与苏黎世仅签通商互市协定而不介入其与哈布斯堡的领地纠葛，换取阿尔卑斯北麓安稳商机。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_eight_cantons:0 "1353年伯尔尼入盟·八旧州联邦"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_eight_cantons:0 "伯尔尼铭记劳彭之谊于1353年宣誓加入瑞士联邦，至此「八旧州」格局大成，阿尔卑斯自由邦联傲立帝国心脏。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_forest_autonomy:0 "森林诸州本邦自治守约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_forest_autonomy:0 "坚守乌里、施维茨、翁特瓦尔登与卢塞恩四州紧致旧盟，将精力倾注于内陆山谷防务与地方自治。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_atterdag_rising:0 "兰讷斯义举·瓦尔德马复国潮"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_atterdag_rising:0 "尼尔斯·埃贝森夜袭兰讷斯手刃荷尔斯泰因摄政格哈德三世，日德兰乡绅揭竿响应流亡王子瓦尔德马四世重登丹麦王位。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_holstein_redemption:0 "荷尔斯泰因典质渐赎协定"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_holstein_redemption:0 "通过议会谈判分期清偿荷尔斯泰因诸伯爵的城堡抵押债，以稳健财政逐步收回丹麦诸岛主权。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_crown_redemption:0 "「来日方长」王室城堡赎回账册"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_crown_redemption:0 "瓦尔德马四世割舍遥远的爱沙尼亚换取万两白银，逐座赎回西兰与日德兰典质城堡，丹麦王权浴火重生。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_baltic_reach:0 "波罗的海丹麦远洋余威"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_baltic_reach:0 "拒售爱沙尼亚据点并依托厄勒海峡与波罗的海舰队维系十字旗荣光，磨砺丹麦远航水手与护航船队。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swe_landslag:0 "马格努斯四世《全国法典》"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swe_landslag:0 "废除农奴制并颁行瑞典首部统一《全国法典》，以王法保护自由自耕农、整合地方习惯法，强化王室财税。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swe_riksrad_compact:0 "瑞典王国参政院分权和约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swe_riksrad_compact:0 "为筹措斯科讷购地巨债，王室向瑞典参政院大贵族让渡部分特权，换取骑士阶层踊跃输财从军。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_posada_legacy:0 "波萨达大捷遗风·喀尔巴阡铁关"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_posada_legacy:0 "1330年波萨达山谷大破匈牙利王军的传奇余威犹在，巴萨拉布一世在坎普隆与阿尔杰什筑关固守，奠基独立瓦拉几亚。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_danube_charter:0 "多瑙河—特兰西瓦尼亚通商特许"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_danube_charter:0 "与布达就塞维林边境达成体面妥协，开放特兰西瓦尼亚萨克森商队直通多瑙河口，关税盈库。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_metropolitanate:0 "瓦拉几亚正教都主教区法统"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_metropolitanate:0 "奉君士坦丁堡普世牧首祝福在阿尔杰什筹立瓦拉几亚正教都主教区，彻底确立罗马尼亚正教邦国独立宗教法统。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_carpathian_balance:0 "喀尔巴阡东西衡平外交"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_carpathian_balance:0 "在君士坦丁堡正教传统与匈牙利天主教强邻之间灵巧周旋，以务实外交确保边疆商路与国内和谐。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_kotromanic_balance:0 "科特罗马尼奇宗教宽容平衡"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_kotromanic_balance:0 "斯蒂芬二世礼迎波斯尼亚方济各会监区以弭平教廷十字军威胁，同时暗护本土波斯尼亚教会贵族，国泰民安。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_krstjani_bastion:0 "波斯尼亚高地基督徒誓盟"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_krstjani_bastion:0 "波斯尼亚总督公开庇护本土波斯尼亚教会与山地大贵族，在迪纳拉群峰之间筑起桀骜难驯的山地堡垒。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_srebrenica_silver:0 "斯雷布雷尼察银矿与拉古萨商约"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_srebrenica_silver:0 "招徕萨克森矿工深挖斯雷布雷尼察与奥洛沃银铅富矿，经拉古萨海商远销亚得里亚海，令波斯尼亚国库充盈。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_royal_citadels:0 "博博瓦茨与亚伊采王室要塞群"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_royal_citadels:0 "将银矿专卖之利尽数投入山地关城与总督直属卫队，令强邻匈牙利与塞尔维亚不敢轻觑波斯尼亚山河。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_tve_rurikid_pride:0 "特维尔留里克长支风骨"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_tve_rurikid_pride:0 "亚历山大·米哈伊洛维奇重返伏尔加河畔，特维尔军民铭记1327年壮烈反抗，誓不向莫斯科钱袋子低头。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_tve_sarai_yarlyk:0 "萨莱金帐赦令与伏尔加商道"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_tve_sarai_yarlyk:0 "以重金厚礼周旋月即别汗宫廷，力争在莫斯科之前稳住萨莱册封敕令并畅通伏尔加皮毛商路。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_psk_bolotovo_charter:0 "1348年《博洛托沃条约》幼弟宪章"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_psk_bolotovo_charter:0 "诺夫哥罗德正式承认普斯科夫为平等自主的「幼弟」共和国，市民大会与自选市长从此执掌西北罗斯门户。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_psk_izborsk_shield:0 "伊兹博尔斯克石城北疆盾牌"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_psk_izborsk_shield:0 "持续加筑普斯科夫与伊兹博尔斯克石灰岩城垣、扩练边防民团，屹立为抵御利沃尼亚骑士团东进的钢铁门户。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_dzeglis_deda:0 "乔治五世《法典之母》中兴宪制"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_dzeglis_deda:0 "驱逐伊儿汗驻军后，「辉煌者」乔治五世颁行《法典之母》与《宫廷礼制》，整肃高加索山地豪强、重兴格鲁吉亚王纲。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_giorgauli_mint:0 "第比利斯「乔治银币」丝路复兴"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_giorgauli_mint:0 "铸行成色纯正的「乔治银币」（Giorgauli）取代蒙古旧币，令贯通大不里士与黑海的第比利斯驼队商市重现黄金时代。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_bagratid_zenith:0 "巴格拉季昂高加索一统雄风"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_bagratid_zenith:0 "西收伊梅列季、南服萨姆茨赫阿塔贝格，重归大一统的格鲁吉亚王国在高加索群山间绽放最后的辉煌金秋。"
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_holy_cross:0 "耶路撒冷圣十字修院特许护持"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_holy_cross:0 "格鲁吉亚使节凭卓越外交赢得开罗苏丹与君士坦丁堡礼遇，重掌耶路撒冷圣十字修院并获朝圣免税旗帜特权。"
 oe_v240_eu.1.t:0 "英格兰对佛兰德斯实施羊毛禁运"
 oe_v240_eu.1.d:0 "海峡两岸战云密布之际，英王爱德华三世为惩罚效忠法王腓力六世的弗兰德伯爵路易一世，悍然下令全面断绝输往佛兰德斯的原毛贸易。根特、布鲁日与伊普尔万机停摆，织工涌向市政广场呐喊求生，伯爵府必须即刻抉择应对之道。"
 oe_v240_eu.1.a:0 "准许根特与布鲁日市民遣使英伦斡旋羊毛解禁"
 oe_v240_eu.1.b:0 "坚定效忠法王腓力六世，查抄布鲁日英商货栈"
 oe_v240_eu.1.c:0 "动用伯爵府库银，紧急补贴卡斯蒂利亚与北方毛源进口"
 oe_v240_eu.2.t:0 "根特护民官阿特维尔德崛起"
 oe_v240_eu.2.d:0 "苦于生毛断绝与法廷苛索，根特行会公推富商雅各布·范·阿特维尔德出任护民官（Hoofdman），联结根特、布鲁日与伊普尔三大名城共议国政。阿特维尔德誓言以佛兰德中立换取英伦重开毛市，然其市民执政团已令伯爵府威权旁落。"
 oe_v240_eu.2.a:0 "承认阿特维尔德与三大名城执政会，重开对英毛贸"
 oe_v240_eu.2.b:0 "在布鲁日集结伯爵骑士团，压制根特市民越权"
 oe_v240_eu.3.t:0 "根特宣言"
 oe_v240_eu.3.d:0 "根特星期五广场之上，伦敦使节向佛兰德斯三级会议呈上一份惊世盟约：为规避反叛法兰西宗主招致的教廷禁令与巨额罚金，佛兰德斯可公开尊奉爱德华三世为法兰西合法国王；英王则将百合花纹章并入王徽，永保羊毛专卖与海路护航。"
 oe_v240_eu.3.a:0 "于星期五广场欢呼爱德华三世，缔结海峡商战同盟"
 oe_v240_eu.3.b:0 "婉拒拥立之议，在巴黎与伦敦之间恪守武装中立"
 oe_v240_eu.4.t:0 "两勃艮第与阿图瓦"
 oe_v240_eu.4.d:0 "老卡佩勃艮第公爵厄德四世凭借与女伯爵让娜三世的联姻，同时维系法属勃艮第公国、帝国属自由伯国多勒以及北方阿图瓦伯国三大采邑。若能统筹三地文书与财赋，便可在法德夹缝间初具大勃艮第邦联雏形。"
 oe_v240_eu.4.a:0 "统筹第戎、多勒与阿拉斯三地书记厅与邦联政务"
 oe_v240_eu.4.b:0 "专注整训第戎本土重装骑士，固守索恩河腹心"
 oe_v240_eu.5.t:0 "老卡佩暮年与勃艮第继承过渡宪章"
 oe_v240_eu.5.d:0 "勃艮第老卡佩宗室骤遭变故：公爵独子腓力陨落加斯科涅，偌大两勃艮第家业仅余襁褓幼孙鲁夫尔的腓力承继。巴黎瓦卢瓦王室与帝国诸侯无不侧目第戎归属，勃艮第三级会议亟须立宪定分以渡过王朝交替之坎。"
 oe_v240_eu.5.a:0 "由三级会议颁定不可分割继承宪章，平稳衔接瓦卢瓦过渡"
 oe_v240_eu.5.b:0 "重押帝国自由伯国纽带，向东寻求莱茵诸侯保障"
 oe_v240_eu.6.t:0 "布列塔尼继承危机"
 oe_v240_eu.6.d:0 "布列塔尼公爵让三世无嗣而终，半岛骤然沦为英法百年战争最炽热的代理战场。同父异母弟让·德·蒙福尔抢占南特并向英王爱德华三世求援，侄女让娜与夫婿夏尔·德·布卢瓦则凭法兰西贵族院《孔夫朗裁决》挥军西进。"
 oe_v240_eu.6.a:0 "拥立让·德·蒙福尔，向英格兰舰队敞开布雷斯特与南特港门"
 oe_v240_eu.6.b:0 "尊奉《孔夫朗裁决》，拥戴夏尔·德·布卢瓦并结援法兰西"
 oe_v240_eu.7.t:0 "亨讷邦之守与马莱特鲁瓦休战"
 oe_v240_eu.7.d:0 "被世人敬称为「烈焰让娜」的佛兰德女公爵披甲夜袭亨讷邦围城营寨、死守待援的传奇震撼西欧；随后教廷特使居中促成《马莱特鲁瓦休战协定》。历经骑兵劫掠的布列塔尼迎来宝贵喘息，公国当借机固防还是休养海贸？"
 oe_v240_eu.7.a:0 "修筑布列塔尼边堡城垣，常备海陆戍军以防战火重燃"
 oe_v240_eu.7.b:0 "落实《马莱特鲁瓦休战》，重振大西洋海盐与酒商航线"
 oe_v240_eu.8.t:0 "萨拉多河之盟与科英布拉王廷抉择"
 oe_v240_eu.8.d:0 "卡葡战事甫歇两年，摩洛哥马林苏丹阿布·哈桑已渡过直布罗陀海峡，会同格拉纳达围攻塔里法。卡斯蒂利亚王后玛丽亚恳求父王阿方索四世冰释前嫌驰援萨拉多河；与此同时，科英布拉宫廷内围绕王储佩德罗与卡斯蒂利亚流亡贵女伊内斯·德·卡斯特罗的暗流亦渐起波澜。"
 oe_v240_eu.8.a:0 "冰释前嫌亲征萨拉多河，与卡斯蒂利亚并肩捍卫伊比利亚"
 oe_v240_eu.8.b:0 "固守阿尔加维海疆，优先扩编里斯本大西洋王室舰队"
 oe_v240_eu.8.c:0 "整肃科英布拉王廷，稳妥处置佩德罗与伊内斯·德·卡斯特罗外戚隐患"
 oe_v240_eu.9.t:0 "被绝罚的皇帝"
 oe_v240_eu.9.d:0 "自1324年遭教廷绝罚以来，神圣罗马皇帝路易四世原望教宗本笃十二世宽宥和解，却再度遭法兰西王室在阿维尼翁从中作梗。寓居慕尼黑的奥卡姆的威廉等方济各会法学家力劝皇帝不再屈膝，转而号召德意志诸侯与英伦金援共捍帝国独立。"
 oe_v240_eu.9.a:0 "庇护慕尼黑帝国法学家团，号召德意志诸侯抵制阿维尼翁干政"
 oe_v240_eu.9.b:0 "再遣忏悔使团赴阿维尼翁恳请解除绝罚，安抚境内教士"
 oe_v240_eu.10.t:0 "《伦塞宣言》与《法理诏书》"
 oe_v240_eu.10.d:0 "莱茵河畔伦塞树荫之下，六位选帝侯破天荒齐声宣示：凡经选帝侯多数推举之罗马人之王，其帝国权柄即刻生效，无须教宗核准加冕。数周后的法兰克福帝国议会上，路易四世正拟将此宪政胜果铸为庄严敕令《法理诏书》（Licet iuris）。"
 oe_v240_eu.10.a:0 "在法兰克福颁行《法理诏书》，昭告帝国皇权直承天命与选侯"
 oe_v240_eu.10.b:0 "将伦塞宣言限定为选帝侯互保盟约，留出与教廷转圜余地"
 oe_v240_eu.11.t:0 "蒂罗尔联姻危机"
 oe_v240_eu.11.d:0 "蒂罗尔女伯爵玛格丽特驱逐了卢森堡家族夫婿约翰·海因里希，愿携扼守布伦纳山口的阿尔卑斯战略要冲改嫁路易四世长子勃兰登堡藩侯路易五世。仅凭皇权宣告解除教会婚约虽可令维特尔斯巴赫直通意大利，却恐激起波希米亚与教廷合流反噬。"
 oe_v240_eu.11.a:0 "行非常皇权宣判离异，促成蒂罗尔联姻以控布伦纳山口"
 oe_v240_eu.11.b:0 "克制蒂罗尔干政之议，与卢森堡王室维持帝国和平"
 oe_v240_eu.12.t:0 "腓特烈三世驾崩"
 oe_v240_eu.12.d:0 "捍卫西西里独立四十载的特里纳克里亚老王腓特烈三世在帕泰尔诺驾崩，体弱的嗣君彼得二世临危受命。西西里仍笼罩在1321年以来的教廷教谕禁令阴影下，那不勒斯安茹王军虎视眈眈，岛内大领主亦暗潮汹涌。"
 oe_v240_eu.12.a:0 "高举特里纳克里亚阿拉贡王旗，誓死抗拒安茹与教廷施压"
 oe_v240_eu.12.b:0 "遣使阿维尼翁恳请解除禁令，并试探与那不勒斯停战"
 oe_v240_eu.13.t:0 "西西里巴罗尼内争"
 oe_v240_eu.13.d:0 "彼得二世早逝，四岁幼王路易一世继位，全岛随即陷入惨烈的「派系内争」（Parzialita）。东岛卡塔尼亚的阿拉戈纳家族等「加泰罗尼亚派」坚持紧靠阿拉贡，西岛巴勒莫与墨西拿的基亚拉蒙特、帕利齐等本土「拉丁派」豪族则割据自雄。"
 oe_v240_eu.13.a:0 "倚重卡塔尼亚加泰罗尼亚派骑士，坚守阿拉贡—西西里防线"
 oe_v240_eu.13.b:0 "安抚巴勒莫与墨西拿拉丁派大领主，换取财赋与海港支持"
 oe_v240_eu.13.c:0 "支持摄政公爵乔瓦尼·迪·兰达佐强力居中仲裁两派"
 oe_v240_eu.14.t:0 "《卡塔尼亚和约》与岛国续命"
 oe_v240_eu.14.d:0 "深陷本国王位动荡的那不勒斯女王乔万娜一世向摄政公爵兰达佐伸出橄榄枝：愿以《卡塔尼亚和约》事实上承认特里纳克里亚自治，终结自西西里晚祷以来六十五年拉锯战，仅索象征性岁贡。岛内正激辩究竟签约重兴谷贸，还是死守墨西拿海峡。"
 oe_v240_eu.14.a:0 "批准《卡塔尼亚和约》，重振西西里小麦商港与民生"
 oe_v240_eu.14.b:0 "拒绝任何名义纳贡，全力加固墨西拿与叙拉古海峡舰队"
 oe_v240_eu.15.t:0 "劳彭之役：森林诸州驰援伯尔尼"
 oe_v240_eu.15.d:0 "受哈布斯堡撑腰的弗里堡与勃艮第封建领主联军合围伯尔尼前哨劳彭，企图一举扼杀西阿尔卑斯自由城邦。伯尔尼告急信使翻越布吕尼希山口，恳请森林诸州派遣精锐戟兵与鲁道夫·冯·埃拉赫的市民方阵并肩死战。"
 oe_v240_eu.15.a:0 "遣森林诸州戟兵越岭驰援，在劳彭击溃重甲贵族联军"
 oe_v240_eu.15.b:0 "严守圣哥达山口隘口与商税通道，保全本州兵力"
 oe_v240_eu.16.t:0 "《苏黎世盟约》"
 oe_v240_eu.16.d:0 "苏黎世市长鲁道夫·布伦粉碎亲哈布斯堡旧贵族的「流血之夜」政变后，正面临奥地利大军压境。苏黎世使节赶赴森林诸州议会，愿与卢塞恩、乌里、施维茨及翁特瓦尔登共立永久同盟，开启瑞士联邦由深山走向名城的历史扩张。"
 oe_v240_eu.16.a:0 "宣誓缔结永久同盟，正式接纳苏黎世加入瑞士联邦"
 oe_v240_eu.16.b:0 "仅签利马特河通商协定，避免过早与哈布斯堡全面冲突"
 oe_v240_eu.17.t:0 "伯尔尼加盟"
 oe_v240_eu.17.d:0 "铭记劳彭战场并肩血战之情，阿尔卑斯西麓强邦伯尔尼共和国于1353年春遣使宣誓与森林诸州永结盟好。伯尔尼正式入盟标志着瑞士「八旧州」（Acht Alte Orte）格局大成，自由邦联自此傲立中欧群山之间。"
 oe_v240_eu.17.a:0 "与伯尔尼用印立誓，正式铸成瑞士「八旧州」联邦"
 oe_v240_eu.17.b:0 "坚守森林诸州原有小盟格局，专注内谷自治防务"
 oe_v240_eu.18.t:0 "兰讷斯之夜"
 oe_v240_eu.18.d:0 "丹麦无王八载，荷尔斯泰因「秃伯爵」格哈德三世凭典质契约与雇佣兵把持日德兰与菲英岛。1340年4月1日夜，日德兰乡绅尼尔斯·埃贝森潜入兰讷斯手刃格哈德三世，全境起义星火燎原，流亡巴伐利亚的王子瓦尔德马四世迎来复国良机。"
 oe_v240_eu.18.a:0 "举国响应日德兰义师，恭迎瓦尔德马四世复辟丹麦王位"
 oe_v240_eu.18.b:0 "与荷尔斯泰因诸伯爵谈判分期赎地，免致全面内战"
 oe_v240_eu.19.t:0 "「来日方长」复国账册"
 oe_v240_eu.19.d:0 "瓦尔德马四世恪守「来日方长」（Atterdag）之志，六年如一日逐座赎回西兰与日德兰典质城堡。1343年圣乔治之夜起义震动遥远的丹麦属爱沙尼亚后，条顿骑士团愿出价一万九千科隆银马克买下雷瓦尔，这笔巨款足以彻底赎清丹麦本土王产。"
 oe_v240_eu.19.a:0 "收受条顿骑士团白银，倾力赎回丹麦本土王室城堡"
 oe_v240_eu.19.b:0 "拒售波罗的海旧业，倚仗厄勒海峡舰队与海贸筹措复国经费"
 oe_v240_eu.20.t:0 "马格努斯法典与斯科讷债务"
 oe_v240_eu.20.d:0 "早于1335年废除农奴制、并举债三万四千银马克购得富庶斯科讷的瑞典—挪威共主马格努斯四世，如今已编成瑞典史上首部统一《全国法典》（Landslag）。强力推行法典可护持自由自耕农、收拢王权，然手握重兵的参政院大贵族正借斯科讷巨债逼宫分权。"
 oe_v240_eu.20.a:0 "力排众议颁行《全国法典》，以王法护持自由自耕农与税源"
 oe_v240_eu.20.b:0 "向瑞典参政院贵族让渡部分特权，共担斯科讷购地债务"
 oe_v240_eu.21.t:0 "波萨达大捷余威"
 oe_v240_eu.21.d:0 "在喀尔巴阡山谷波萨达大破匈牙利王军八年之后，大公巴萨拉布一世坐镇坎普隆与阿尔杰什，统领昂然独立的瓦拉几亚公国。面对北方布达王廷压力与多瑙河商机，大公须抉择究竟深筑山地关隘，还是以塞维林妥协换取商路通畅。"
 oe_v240_eu.21.a:0 "加固喀尔巴阡险关，营建坎普隆与阿尔杰什自主王都"
 oe_v240_eu.21.b:0 "就塞维林边境与布达达成通商特许，广收多瑙河转口关税"
 oe_v240_eu.22.t:0 "祈立瓦拉几亚正教都主教区"
 oe_v240_eu.22.d:0 "面对匈牙利天主教传教压力步步南逼，瓦拉几亚大公府遣使君士坦丁堡，恳请普世牧首将维奇纳都主教亚森特移驻阿尔杰什，正式设立「乌戈罗—瓦拉几亚都主教区」。此举将为多瑙河北岸铸就牢不可破的正教立国法统。"
 oe_v240_eu.22.a:0 "奉书君士坦丁堡普世牧首，于阿尔杰什正式筹立瓦拉几亚都主教区"
 oe_v240_eu.22.b:0 "暂缓立区之议，在君士坦丁堡与布达之间维持灵巧平衡"
 oe_v240_eu.23.t:0 "斯蒂芬二世的信仰走钢丝"
 oe_v240_eu.23.d:0 "疆域自迪纳拉群峰直抵亚得里亚海胡姆海岸的波斯尼亚总督斯蒂芬二世，正面临教廷因本土「波斯尼亚教会」（Krstjani）而发出的十字军威胁。礼迎方济各会监区入境既可化解匈牙利讨伐口实，又须审慎不激怒信奉本土教会的山地大贵族。"
 oe_v240_eu.23.a:0 "准建方济各会波斯尼亚监区，同时暗行宗教宽容安抚本土贵族"
 oe_v240_eu.23.b:0 "公开庇护本土波斯尼亚教会，号召山地豪强共拒外力干涉"
 oe_v240_eu.24.t:0 "斯雷布雷尼察银矿与拉古萨商约"
 oe_v240_eu.24.d:0 "远道而来的萨克森矿工在斯雷布雷尼察与奥洛沃群山掘出丰沛银铅矿脉，拉古萨（杜布罗夫尼克）商团亦竞相求购通往亚得里亚海的专运商道。斯蒂芬二世正待决断：究竟广颁采矿商约富国裕民，还是以银矿专卖修筑无双山地要塞？"
 oe_v240_eu.24.a:0 "颁授萨克森矿业特许与拉古萨通商权，广聚巴尔干银贸之利"
 oe_v240_eu.24.b:0 "将斯雷布雷尼察银税尽数投入王室山地要塞与边防卫队"
 oe_v240_eu.25.t:0 "亚历山大重返特维尔与萨莱"
 oe_v240_eu.25.d:0 "因1327年特维尔反抗流亡普斯科夫十载后，公爵亚历山大·米哈伊洛维奇终获月即别汗赦免重返特维尔故土。然莫斯科大公伊凡一世「钱袋子」已携重金赴萨莱构陷，特维尔面临存亡抉择：究竟誓守留里克长支傲骨，还是倾囊厚贿汗廷争保敕令？"
 oe_v240_eu.25.a:0 "无惧莫斯科谗言，誓守特维尔留里克长支尊严与伏尔加防线"
 oe_v240_eu.25.b:0 "筹措重金使团赴萨莱面见月即别汗，力保特维尔敕令与商道"
 oe_v240_eu.26.t:0 "《博洛托沃条约》"
 oe_v240_eu.26.d:0 "历经数十载独抗利沃尼亚骑士团东进、更挥师驰援诺夫哥罗德抵御瑞典国王马格努斯四世北伐，普斯科夫市长代表终在博洛托沃赢得历史性条约：诺夫哥罗德正式放弃对普斯科夫的司法与行政管辖，尊其为平等自主的「幼弟」共和国。"
 oe_v240_eu.26.a:0 "批准《博洛托沃条约》，正式颁立普斯科夫市民大会自主宪章"
 oe_v240_eu.26.b:0 "加筑伊兹博尔斯克石灰岩要塞，扩编西北边防精锐民团"
 oe_v240_eu.27.t:0 "辉煌者乔治五世与《法典之母》"
 oe_v240_eu.27.d:0 "早于1335年驱逐伊儿汗最后驻军、终结百年蒙古纳贡之后，「辉煌者」乔治五世正着手重整满目疮痍的高加索山河。第比利斯御前会议献上两策中兴之基：颁行《法典之母》（Dzeglis Deda）以王法整肃山地豪族，或铸行足色「乔治银币」复兴丝路商市。"
 oe_v240_eu.27.a:0 "颁行《法典之母》与宫廷礼制，重整高加索王纲法治"
 oe_v240_eu.27.b:0 "铸行纯银「乔治银币」，重振第比利斯丝路商埠繁荣"
 oe_v240_eu.28.t:0 "格鲁吉亚中兴盛景"
 oe_v240_eu.28.d:0 "自阿布哈兹黑海良港至萨姆茨赫险峻山城，巴格拉季昂王旗在「辉煌者」乔治五世治下重归一统。自开罗归来的使节更传佳音：马穆鲁克苏丹愿归还耶路撒冷古老的格鲁吉亚圣十字修院并赐朝圣特权——高加索中兴盛景由此攀上巅峰。"
 oe_v240_eu.28.a:0 "进一步统合萨姆茨赫与高加索诸边镇，铸就巴格拉季昂精锐王师"
 oe_v240_eu.28.b:0 "遣使开罗与君士坦丁堡落实圣十字修院特许，扬威近东基督教世界"
