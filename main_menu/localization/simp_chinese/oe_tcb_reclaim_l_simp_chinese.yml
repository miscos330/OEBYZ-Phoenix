l_simp_chinese:
 # NEW 2026-11-18 round 3 N2 casus belli (oe_tcb_). Generated by gen_round3_cb.py; edit the generator, not this file.
 oe_tcb.1.t: "正教诸国的谅解"
 oe_tcb.1.d: "1108年，博希蒙德在德沃尔条约里承认以皇帝封臣的身份领有安条克，并约定他死后城市归还帝国。\n\n我们赢得了一场收复故省之战，[GetCountry('BYZ').MakeScope.GetVariable('oe_tcb_last_n').GetValue|0]处故省重新回到帝国手中。正教各国的宫廷把这看作帝国讨还旧物，而不是征服。[GetCountry('BYZ').MakeScope.GetVariable('oe_tcb_last_c').GetValue|0]个未参战的正教国家对我们的敌意因此降低，每国最多[GetCountry('BYZ').MakeScope.GetVariable('oe_tcb_last_r').GetValue|0]，且不超过它现有的敌意，每年回落#Y 3#!。收回的地点照常进入每年的“旧省归来”检查。"
 oe_tcb.1.a: "收回的本就是我们的土地"
 oe_tcb.1.a.tt: "（效果已经生效，此选项没有其他效果）"
 oe_tcb_reclaim: "收复故省"
 oe_tcb_reclaim_PROV: "收复[PROVINCE.GetName]"
 oe_tcb_reclaim_desc: "帝国失去了土地，却不放弃名分。878年叙拉古陷落、902年塔奥尔米纳陷落之后，西西里军区的将军移驻卡拉布里亚的雷焦。军区只剩下卡拉布里亚，却仍以西西里为名，直到10世纪中叶。1097年，阿历克塞一世要第一次十字军的首领们发誓：凡是攻下的帝国旧地，都要交还帝国。1108年的德沃尔条约里，博希蒙德承认以皇帝封臣的身份领有安条克，受封安条克督军（doux），并约定他死后城市归还帝国。\n\n如今，那些随叛乱军区离开帝国的地点，帝国仍视为自己的故省。占有这些地点的国家，只要不是罗马帝国或它的附庸，我们都可以据此宣战。\n\n这场战争只能索要故省的[location|e]，索要的[war_score|e]花费#G −50%#!，和约引起的[antagonism|e]#G −50%#!。获胜后，未参战的正教国家对我们的[antagonism|e]再降低：每收回一处故省#Y −1#!，至多#Y −8#!，且不超过该国现有的敌意，每年回落#Y 3#!。收回的故省照常进入每年的“旧省归来”检查（罗马再征服进行中时计入复兴狂热）。"
 war_goal_oe_tcb_reclaim_goal: "收复[PROVINCE.GetNameWithNoTooltip]"
 war_goal_oe_tcb_reclaim_goal_desc: "[war_goal|e]为收复[PROVINCE.GetNameWithNoTooltip]。只能索要帝国故省的[location|e]，索要的[war_score|e]花费#G −50%#!，和约引起的[antagonism|e]#G −50%#!。占领并控制该省份所有[location|e]，我们会持续获得[war_score|e]。"
 oe_tcb_war_name: "第$NUM$次对$SECONDNAME$的收复故省之战"
 oe_tcb_target_tt: "[target.GetName]占有帝国的故省，且不是罗马帝国或它的附庸"
 oe_tcb_goal_loc_tt: "只能索要帝国的故省（曾随叛乱军区离开帝国的地点）"
 oe_tcb_goal_taker_tt: "故省只能由罗马帝国或它的附庸收回"
 oe_tcb_ai_many: "对方占有至少#Y 3#!处故省"
