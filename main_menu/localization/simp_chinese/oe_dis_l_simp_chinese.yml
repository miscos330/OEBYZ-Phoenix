 oe_dis_player_only_tt:0 "仅限玩家操控的国家颁行此项防疫法令"
 oe_dis_quarantena_cd_tt:0 "过去 3 年内未重复颁行四十日海港检疫令"
 oe_dis_dev_free_build_tt:0 "开发测试面板零费用即建"
 oe_dis_dec_quarantena_40_days.title:0 "颁行四十日海港检疫令"
 oe_dis_dec_quarantena_40_days.desc:0 "在本国或邻国爆发瘟疫时下令所有抵港商船强制隔离四十日并熏蒸货舱：短期牺牲海贸效率与市民满意度以换取极高抗疫壁垒。若已建新检疫岛熏蒸廊，海贸惩罚减半；若有常平仓赈济，国库开销减半！"
 oe_dis_dec_quarantena_40_days.a:0 "宁损一时关税，必保万民安康"
 oe_dis_dec_sanita_magistracy.title:0 "常设海港卫生监察署"
 oe_dis_dec_sanita_magistracy.desc:0 "在至少两座沿海城市与已有检疫港基础上永久设立卫生监察署（Magistrato alla Sanita），常年签发并稽核《健康通行证》，永久增强全国抗疫与寿数。"
 oe_dis_dec_sanita_magistracy.a:0 "敕设常驻卫生监察署"
 oe_dis_dec_wenyi_treatise.title:0 "颁行《瘟疫论》辨戾气治疫法"
 oe_dis_dec_wenyi_treatise.desc:0 "刊印推广吴有性《瘟疫论》所倡「戾气从口鼻而入」之辨证治疫法，建立分症疗疫体系，永久大幅克制近世军营热与斑疹伤寒并提升国民寿数。"
 oe_dis_dec_wenyi_treatise.a:0 "官刻《瘟疫论》以济苍生"
 oe_dis_dec_pestkordon_border.title:0 "敕建陆疆鼠疫军事封锁线"
 oe_dis_dec_pestkordon_border.desc:0 "沿千里陆疆边境常设军事化卫生封锁线（Pestkordon）与边境消毒检疫站，以边防军严检商旅与邮件，构筑永久陆疆防疫与边防壁垒。"
 oe_dis_dec_pestkordon_border.a:0 "立界设关，永固千里封锁线"
 oe_dis.1.title:0 "近世黎凡特鼠疫登陆商港"
 oe_dis.1.desc:0 "一艘满载黎凡特生丝与香料的货船刚在港外抛锚，船舱里便传出高热与鼠蹊黑肿的噩耗。港口商团恳求尽快卸货以保市集关税，卫生官员则警告若不立行四十日严封，整座港城数周内便将沦为炼狱。"
 oe_dis.1.a:0 "立颁四十日严封检疫令，保民为先"
 oe_dis.1.b:0 "启用双岛检疫分流：病者送老岛，货船入新岛熏蒸"
 oe_dis.1.c:0 "冒险放行通商，保住今岁海贸关税"
 oe_dis.1.d:0 "启请医神阿斯克勒庇俄斯圣泉洁净仪典，以神庙隔室疗疫"
 oe_dis.2.title:0 "军营热与戾气大疫肆虐"
 oe_dis.2.desc:0 "连年征战与拥挤营垒催生了凶猛的军营热与戾气大疫。疫病不仅在驻军与焦土城邑中迅速扩散，更直逼官署与宫廷，多位重臣接连卧病，朝野震动。"
 oe_dis.2.a:0 "宫廷暂迁避疫，严封染疫营垒交通"
 oe_dis.2.b:0 "坚守京师抚民，拨银兴建随军野战病坊"
 oe_dis.2.c:0 "急开常平仓平粜口粮兼施药粥，安民断疫"
 oe_dis.3.title:0 "威尼斯双岛检疫典范远播"
 oe_dis.3.desc:0 "自拉古萨《三十日隔离令》肇始，威尼斯先后启用老检疫岛收治病患、新检疫岛晾晒熏蒸货物并设立常驻卫生监察署，终于破解了「严防疫病便窒息海贸」的千年难题。各地商港纷纷遣使抄录其章程。"
 oe_dis.3.a:0 "全面引进双岛分流检疫与《健康通行证》章程"
 oe_dis.3.b:0 "仅备录成案，不必大兴土木"
 oe_dis.4.title:0 "《健康通行证》伪造走私案"
 oe_dis.4.desc:0 "港口稽查官在暗访中截获一批伪造的清洁《健康通行证》：数家大商号行贿书记官，企图隐瞒船队曾停靠疫港的行踪，以躲避长达四十日的滞港晾晒。"
 oe_dis.4.a:0 "严惩涉案商号并焚毁染疫货包，以儆效尤"
 oe_dis.4.b:0 "暗收重罚金了结此案，免伤商帮元气"
 oe_dis.5.title:0 "巨型熏蒸长廊与《检疫章程》落成"
 oe_dis.5.desc:0 "历经数载扩建，两座孤岛检疫港的巨型通风货栈（Tezoni）已全数峻工，署长官吏更将历次抗疫实录汇编为严密的《检疫岛操作章程》。即便大疫压境，商船仍可有序停泊、卸货、熏蒸与放行。"
 oe_dis.5.a:0 "颁布《检疫章程》并勒石纪功"
 oe_dis.6.title:0 "「圣安托万号」商船破封危机"
 oe_dis.6.desc:0 "一艘载满价值连城东方织锦的远洋大船驶抵港外，航程中已有水手暴毙。商界巨头联名向市政厅施压，声称若赶不上本季博览会便将破产，要求特批免除四十日隔离即刻卸货——犹如 1720 年马赛大瘟疫前夜的致命赌局。"
 oe_dis.6.a:0 "坚决拒港押送孤岛焚货隔离，绝不姑息商团施压"
 oe_dis.6.b:0 "妥协放行卸货，换取巨额博览会关税与捐输"
 oe_dis.7.title:0 "千里陆疆卫生封锁线落成"
 oe_dis.7.desc:0 "沿边疆要道修筑的消毒检疫关驿与边防哨卡已连点成线。所有越境商队、旅人与公文书信均须在关口留验并经硫磺醋液熏蒸，昔日沿陆路长驱直入的周期性鼠疫与军营热首次被牢牢挡在国门之外。"
 oe_dis.7.a:0 "嘉奖边防检疫官兵，永固陆疆卫生防线"
 oe_dis.8.title:0 "吴有性刊行《瘟疫论》与「戾气」之辨"
 oe_dis.8.desc:0 "大疫横行之际，苏州医家吴有性著成《瘟疫论》，毅然打破「六淫外感」陈说，指出瘟疫源自天地间无形杂气即「戾气」，自口鼻而入、伏于募原且具传染特异性。保守医官斥其离经叛道，但前线良医盛赞其法活人无数。"
 oe_dis.8.a:0 "官刻颁行《瘟疫论》，广设温病临床医塾"
 oe_dis.8.b:0 "恪守古方经义，免生医林纷争"
 oe_dis.9.title:0 "东地中海《检疫新政》大辩论"
 oe_dis.9.desc:0 "面对黎凡特与大港屡次暴发的鼠疫浪潮，宫廷御医与改革重臣力主颁布成文《检疫新政》（Karantina），在海峡与商港设立强制隔离署；保守法学家则主张沿用传统慈善义医院（Darussifa）赈治而不必封航。"
 oe_dis.9.a:0 "敕行《检疫新政》，设立常驻海港检疫总署"
 oe_dis.9.b:0 "增拨慈善基金扩建义医院，顺应传统礼俗"
 oe_dis.10.title:0 "阿斯克勒庇俄斯圣泉洁净仪典"
 oe_dis.10.desc:0 "埃皮达鲁斯与帕加马的医神祭司在疫期大开圣殿净水回廊，将古老的洁净洗礼、隔离静养与草药熏蒸融为一体。远近染疫百姓与军士在圣泉医馆中得以生还，帝国上下盛赞医神显灵庇护。"
 oe_dis.10.a:0 "奉祀医神圣泉，广推圣殿疗疫之法"
 oe_dis.11.title:0 "常平仓开仓平粜兼施汤药"
 oe_dis.11.desc:0 "正当瘟疫引发恐慌与粮商囤积居奇之际，帝国常平仓奉旨开闸平价放粮，并随官粮向隔离街区配发食盐、薪炭与清瘟汤药。城中粮价迅速回稳，疫区秩序井然。"
 oe_dis.11.a:0 "嘉许仓曹司吏，确保持续平粜济疫"
 oe_dis.12.title:0 "海港检疫禁运引发外交风波"
 oe_dis.12.desc:0 "本国严格执行四十日停泊查验后，多个邻近商邦抗议其商船长期滞港蒙受巨损，扬言报复性加征关税。外务官建议借此推动跨国互认《健康通行证》，以制度化解摩擦。"
 oe_dis.12.a:0 "坚守防疫底线，不容外邦商船豁免隔离"
 oe_dis.12.b:0 "缔结跨国《健康通行证》互认与疫报共享协约"
 oe_dis.13.title:0 "1750 近世检疫成熟与大疫退潮"
 oe_dis.13.desc:0 "跨越三个世纪的艰苦抗争终于迎来历史拐点：从威尼斯双岛检疫港与卫生监察署，到千里陆疆封锁线与《瘟疫论》医道革新，严密的现代前夜公共卫生体系已将周期性大瘟疫彻底逐出帝国核心疆域！此项功业将永载典藏编年史。"
 oe_dis.13.a:0 "铭刻抗疫功勋，迎接人口繁荣新纪元"
 oe_dis.14.title:0 "温和疫病模式：地方缓冲机制启动"
 oe_dis.14.desc:0 "依照当前「温和疫病」开局规则，各地应急医馆与隔离补贴网络已自动激活，将在未来数年内大幅缓和近世动态疫病造成的人口与财政损失。"
 oe_dis.14.a:0 "确认地方温和缓冲机制生效"
