 oe_dis_cab_cordon_enforcement_action_progress_tooltip:0 "维持目标行省的军事检疫封锁与野战卫生秩序，提升全国及本地抗疫能力并显著削弱近世军营热与斑疹伤寒的冲击与增长。"
