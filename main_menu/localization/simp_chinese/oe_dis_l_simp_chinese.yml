 oe_dis_cab_cordon_enforcement:0 "军事隔离线与军营卫生整肃"
 oe_dis_cab_cordon_enforcement_desc:0 "调派军事重臣在选定行省布设陆路检疫封锁线并整肃兵营饮水与病坊，大幅增强全国及本省对军营热与斑疹伤寒的抵抗并遏止扩散，代价是军费维护略有上升。"
