 STATIC_MODIFIER_NAME_oe_dis_mild_buffer_mod:0 "温和疫病模式：地方救济缓冲"
 STATIC_MODIFIER_DESC_oe_dis_mild_buffer_mod:0 "在规则 #15「温和疫病」档位下，各地义诊与隔离缓冲网络大幅减轻了近世黎凡特鼠疫与军营热的死亡与财政冲击。"
 STATIC_MODIFIER_NAME_oe_dis_asclepius_sanctuary_aegis_mod:0 "阿斯克勒庇俄斯医神圣泉庇护"
 STATIC_MODIFIER_DESC_oe_dis_asclepius_sanctuary_aegis_mod:0 "坐镇神殿的医神阿斯克勒庇俄斯与埃皮达鲁斯、帕加马圣泉净水医馆同声相应，以古希腊医道洁净仪典与隔室疗养大幅遏制近世大疫蔓延。"
 STATIC_MODIFIER_NAME_oe_dis_granary_epidemic_cushion_mod:0 "常平仓赈疫平粜稳民"
 STATIC_MODIFIER_DESC_oe_dis_granary_epidemic_cushion_mod:0 "遍布州县的常平仓于疫期开仓平粜口粮并兼施药粥，斩断「大疫伴饥荒」的恶性循环，显著压制民怨与繁荣跌落。"
 STATIC_MODIFIER_NAME_oe_dis_quarantena_strict_mod:0 "四十日海港严封检疫令"
 STATIC_MODIFIER_DESC_oe_dis_quarantena_strict_mod:0 "所有自疫区抵港商船一律于锚地隔离满四十日并开舱熏蒸；海贸关税与商团满意度短期承压，换得全国抗疫防线大幅加固。"
 STATIC_MODIFIER_NAME_oe_dis_quarantena_nuovo_mod:0 "双岛分流四十日检疫令"
 STATIC_MODIFIER_DESC_oe_dis_quarantena_nuovo_mod:0 "依托新检疫岛通风长廊与熏蒸库房执行四十日分流检疫，在不封死港口的前提下阻断疫源，将海贸损耗压缩过半。"
 STATIC_MODIFIER_NAME_oe_dis_quarantena_granary_mod:0 "常平仓协保四十日检疫令"
 STATIC_MODIFIER_DESC_oe_dis_quarantena_granary_mod:0 "四十日封港隔离辅以常平仓平价发粮安抚受困港口市民，大幅缓和封航带来的物价恐慌与阶层摩擦。"
 STATIC_MODIFIER_NAME_oe_dis_sanita_magistracy_mod:0 "常设海港卫生监察署"
 STATIC_MODIFIER_DESC_oe_dis_sanita_magistracy_mod:0 "仿威尼斯卫生监察署体制，常年核验外港签发的《健康通行证》、巡查船员名录与疫区情报，筑牢近世海港公共卫生防线。"
 STATIC_MODIFIER_NAME_oe_dis_wenyi_treatise_mod:0 "《瘟疫论》辨戾气治疫法"
 STATIC_MODIFIER_DESC_oe_dis_wenyi_treatise_mod:0 "官刻颁行吴有性《瘟疫论》，破除陈腐旧说，依「戾气从口鼻而入、伏于募原」之理设立分症诊治与清涤隔离法，显著克制军营热与斑疹大疫。"
 STATIC_MODIFIER_NAME_oe_dis_pestkordon_cordon_mod:0 "陆疆鼠疫军事封锁线"
 STATIC_MODIFIER_DESC_oe_dis_pestkordon_cordon_mod:0 "效法哈布斯堡军事边疆卫生封锁线体制，于千里陆疆布设边防哨卡与边境消毒站，强制商队验票熏蒸，将黎凡特鼠疫与军营热阻于国门之外。"
 STATIC_MODIFIER_NAME_oe_dis_court_seclusion_mod:0 "宫廷避疫与营垒严闭"
 STATIC_MODIFIER_DESC_oe_dis_court_seclusion_mod:0 "君主与中枢机构暂迁离京避疫并严禁染疫军营官兵私自入城，保全朝廷核心人物免于夭折，但政令流转略显迟滞。"
 STATIC_MODIFIER_NAME_oe_dis_field_lazarets_mod:0 "随军野战病坊与营区整肃"
 STATIC_MODIFIER_DESC_oe_dis_field_lazarets_mod:0 "在主力驻地与围城战线设立独立野战病坊，定期焚烧染虱衣物、煮沸饮水并隔离热病伤兵，有效遏止军营热扩散。"
 STATIC_MODIFIER_NAME_oe_dis_open_ports_gamble_mod:0 "冒险开港通商保税"
 STATIC_MODIFIER_DESC_oe_dis_open_ports_gamble_mod:0 "迫于商帮压力拒绝封港隔离，短期内保住了海贸关税与市民欢心，却令黎凡特鼠疫长驱直入港口腹地。"
 STATIC_MODIFIER_NAME_oe_dis_venetian_model_mod:0 "威尼斯双岛检疫典范"
 STATIC_MODIFIER_DESC_oe_dis_venetian_model_mod:0 "推广「老岛治病、新岛验货」的双层港口检疫流程，令商船在规范隔离下维系地中海与远洋贸易信心。"
 STATIC_MODIFIER_NAME_oe_dis_tezoni_capitolari_mod:0 "熏蒸长廊与《检疫章程》汇编"
 STATIC_MODIFIER_DESC_oe_dis_tezoni_capitolari_mod:0 "高敞通风的货栈长廊与严密成文的《检疫岛署长章程》双管齐下，使大港既能高周转验放丝绸毛呢，又能严防鼠疫回潮。"
 STATIC_MODIFIER_NAME_oe_dis_breached_quarantine_mod:0 "走私破封与港口鼠疫失控"
 STATIC_MODIFIER_DESC_oe_dis_breached_quarantine_mod:0 "因商船走私绕过四十日检疫程序，疫毒迅速穿透港口街区，迫使朝廷匆忙构筑隔离墙以止损。"
 STATIC_MODIFIER_NAME_oe_dis_kontumaz_network_mod:0 "边境消毒关驿网"
 STATIC_MODIFIER_DESC_oe_dis_kontumaz_network_mod:0 "沿陆疆干道与关隘建成的消毒检疫驿站以醋液与硫磺查验商旅与邮件，大幅提升乡野与边区抗疫能力。"
 STATIC_MODIFIER_NAME_oe_dis_wenyi_school_mod:0 "温病学派官办医塾"
 STATIC_MODIFIER_DESC_oe_dis_wenyi_school_mod:0 "以《瘟疫论》为宗开设温病临床医塾，鼓励医家辨析传染路径与方剂配伍，推动学术进步与国民寿数提升。"
 STATIC_MODIFIER_NAME_oe_dis_karantina_reform_mod:0 "海港《检疫新政》敕令"
 STATIC_MODIFIER_DESC_oe_dis_karantina_reform_mod:0 "朝廷颁布成文海港检疫章程并任命御前检疫总办，整合欧亚港口防务以遏制黎凡特周期性鼠疫，虽令保守派略有微词。"
 STATIC_MODIFIER_NAME_oe_dis_darussifa_charity_mod:0 "瓦克夫义医院与施药救济"
 STATIC_MODIFIER_DESC_oe_dis_darussifa_charity_mod:0 "依托慈善基金扩建城市义医院与免费药房，收治染疫贫民并赢得教士与百姓一致赞誉。"
 STATIC_MODIFIER_NAME_oe_dis_reciprocal_patenti_mod:0 "跨国《健康通行证》互认协约"
 STATIC_MODIFIER_DESC_oe_dis_reciprocal_patenti_mod:0 "与周边商邦互认标准化的港口健康通行证并共享疫区密报，在保障隔离底线的同时显著减少跨国禁运摩擦。"
 STATIC_MODIFIER_NAME_oe_dis_quarantine_triumph_mod:0 "近世检疫成熟与大疫退潮"
 STATIC_MODIFIER_DESC_oe_dis_quarantine_triumph_mod:0 "历经数百年双岛检疫港、卫生监察署、陆疆封锁线与医学革新的持久磨砺，国家终于打破中世以来鼠疫周期性屠城的宿命。"
 oe_dis_lazzaretto_vecchio:0 "老检疫岛隔离医院"
 oe_dis_lazzaretto_vecchio_desc:0 "仿 1423 年威尼斯圣玛丽亚孤岛所建的常设海港鼠疫隔离医院，收治显症船员与染疫市民，大幅压低本地黎凡特鼠疫与黑死病冲击并延长寿数。"
 oe_dis_lazzaretto_vecchio_maint:0 "老检疫岛医药与熏香维持"
 oe_dis_lazzaretto_nuovo:0 "新检疫岛四十日熏蒸廊"
 oe_dis_lazzaretto_nuovo_desc:0 "仿 1468 年威尼斯新检疫岛确立的双层分流滤网：健康商船泊岛隔离四十日，丝绸毛呢卸入巨型通风长廊以醋液与硫磺熏蒸，既强力遏制疫病又扩大本地商人容量与商埠活力。"
 oe_dis_lazzaretto_nuovo_maint:0 "新检疫岛熏蒸长廊维持"
 oe_dis_pestkordon_station:0 "陆疆卫生封锁检疫站"
 oe_dis_pestkordon_station_desc:0 "仿 1710–1770 年哈布斯堡军事边疆卫生封锁线与丝路陆港关驿修筑的消毒检疫站，强制查验陆路商队与军营伤兵，显著削弱军营热与斑疹伤寒危害。"
 oe_dis_pestkordon_station_maint:0 "陆疆检疫站消毒维持"
 oe_dis_adv_sanita_quarantine:0 "海港卫生法与双岛检疫制"
 oe_dis_adv_sanita_quarantine_desc:0 "综合 1377 年拉古萨三十日隔离令、威尼斯双岛分流检疫与《健康通行证》验票规章，解锁新检疫岛四十日熏蒸廊与陆疆卫生封锁站，提升全国抗疫韧性。"
 oe_dis_cab_fumigation_corps:0 "商港熏蒸与检疫审计"
 oe_dis_cab_fumigation_corps_desc:0 "派遣内阁官员巡查选定沿海行省的码头与检疫岛，强制货栈硫磺熏蒸与健康通行证审计，大幅提高全国及本省对黎凡特鼠疫的抵抗并压制扩散，唯短期略减海贸周转效率。"
