 # NEW 2026-11-23 v21.0 Module B: Laws 2.0 Overhaul (oe_lw2_) — Localization (simp_chinese) (oe_lw2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v210_laws2.py; edit the generator, not this file.
 # Transition Static Modifiers
 STATIC_MODIFIER_NAME_oe_lw2_mod_crown_transition:0 "王室新法颁行过渡"
 STATIC_MODIFIER_DESC_oe_lw2_mod_crown_transition:0 "王廷书吏与巡察官正在重整地方簿册，以推行新颁布的集权法令，短期内引发旧贵族的抵触与政务磨合。"
 STATIC_MODIFIER_NAME_oe_lw2_mod_noble_transition:0 "贵族法典重申过渡"
 STATIC_MODIFIER_DESC_oe_lw2_mod_noble_transition:0 "封君与世家大族响应新颁行的特许法典，加速征召整备，但也抬高了宫廷赏赐与行政协调开销。"
 STATIC_MODIFIER_NAME_oe_lw2_mod_clergy_transition:0 "教阶法令宣谕过渡"
 STATIC_MODIFIER_DESC_oe_lw2_mod_clergy_transition:0 "教区法庭与修院正在各地宣谕新法，增强教权凝聚力，但短期内放缓世俗新思潮的传播。"
 STATIC_MODIFIER_NAME_oe_lw2_mod_burgher_transition:0 "商律特许调整过渡"
 STATIC_MODIFIER_DESC_oe_lw2_mod_burgher_transition:0 "行会与港口交易所依据新商法重新订立契约，提升商业活力，同时也招致保守领主阶层的猜忌。"
 STATIC_MODIFIER_NAME_oe_lw2_mod_peasant_transition:0 "农政租佃改制过渡"
 STATIC_MODIFIER_DESC_oe_lw2_mod_peasant_transition:0 "乡村公社与自耕农逐步适应新的租佃与劳役章程，促进地方休养生息，但短期内需让渡部分赋税收益。"
 STATIC_MODIFIER_NAME_oe_lw2_mod_tribal_transition:0 "部族盟约重订过渡"
 STATIC_MODIFIER_DESC_oe_lw2_mod_tribal_transition:0 "游牧万户与边疆部族在新法框架下重申盟誓，显著凝聚部族向心力，但也暂时放松了中央直辖控制。"
 # Universal Age 1-6 State Codes
 oe_lw2_fiscal_budget_law:0 "帝国财税与预算总法"
 oe_lw2_fiscal_budget_law_desc:0 "确立国家丈量田亩、征收关榷消费税以及运作公债与中央预算的根本法典，随时代演进从包税制逐步过渡至近代国家财政体系。"
 oe_lw2_pol_tax_farming:0 "包税承包制"
 oe_lw2_pol_tax_farming_desc:0 "将地方赋税征收权拍卖给豪强与商团，在早期官僚不足时稳定国库进项，但以削弱中央直辖控制度为代价。"
 oe_lw2_pol_cadastral_registry:0 "官僚清丈田赋"
 oe_lw2_pol_cadastral_registry_desc:0 "派遣朝廷度支官清丈全国田亩与户籍并造册征税，大一统官僚帝国及罗马、中华、波斯、马穆鲁克与高丽诸廷开局即可推行，提升正税效率与地方控制，但增加宫廷行政开销并触动贵族既得利益。"
 oe_lw2_pol_excise_monopolies:0 "消费关税与盐铁专卖"
 oe_lw2_pol_excise_monopolies_desc:0 "对盐铁、酒榷与大宗消费品实行国家专卖与统一消费税，将流通财富汇入国库，但加重了底层民众的日常生活负担。"
 oe_lw2_pol_public_debt_budget:0 "近代公债与国家预算"
 oe_lw2_pol_public_debt_budget_desc:0 "公布受审计的年度国家预算并以长期国债统筹军政开支，显著压低国债利率并扩大信贷上限，但赋予市民资本阶层更大话语权。"
 oe_lw2_military_service_law:0 "常备军与兵役法"
 oe_lw2_military_service_law_desc:0 "界定国家武装力量的征募与服役方式，从封建贵族随从、特许雇佣兵团演进至边疆军户屯田与近代义务征兵体系。"
 oe_lw2_pol_feudal_retinues:0 "封建采邑征召"
 oe_lw2_pol_feudal_retinues_desc:0 "依凭封君与骑士采邑契约征召重装骑兵与私兵随从，强化贵族征召规模与重骑战力，但巩固了领主的政治权势。"
 oe_lw2_pol_chartered_companies:0 "雇佣特许兵团"
 oe_lw2_pol_chartered_companies_desc:0 "与职业雇佣兵队长签订王室特许军役契约，有效降低雇佣兵维护成本并扩大可用兵团，但削弱了本土常规人力的动员意愿。"
 oe_lw2_pol_frontier_colonies:0 "军区与边疆屯田世兵制"
 oe_lw2_pol_frontier_colonies_desc:0 "在边境要冲推行军区屯田与世袭军户制度，划拨免税军田换取常备守备与出征义务；罗马拜占庭、中华、波斯与突厥诸国开局即可颁行，显著充实后备人力与要塞防御，但减少了部分田赋正税收入。"
 oe_lw2_pol_universal_conscription:0 "近代义务征兵法"
 oe_lw2_pol_universal_conscription_desc:0 "推行面向全体适龄国民的常备义务兵役与统一操典训练，大幅充实兵源、加快募兵并提升军纪，但需承受沉重的军费维护与民间怨怼。"
 oe_lw2_maritime_commerce_law:0 "海事与特许贸易法"
 oe_lw2_maritime_commerce_law_desc:0 "规范沿岸集散港、远洋航运特权、特许商业公司与自由贸易港制度，决定国家在全球贸易网络中的角色与收益分配。"
 oe_lw2_pol_coastal_staple:0 "沿岸航运与集散港特权"
 oe_lw2_pol_coastal_staple_desc:0 "规定沿海商船必须经由指定特许港口起卸纳税，扶植本土行会商人与海防存在感，但让渡了部分王室直辖权限。"
 oe_lw2_pol_mercantilist_navigation:0 "重商航海条例"
 oe_lw2_pol_mercantilist_navigation_desc:0 "强制规定本国及属地货运须由本国船只与水手承运，大力扶植造船业与海军水手储备，但也招致邻近海商国家的贸易摩擦。"
 oe_lw2_pol_oceanic_chartered:0 "跨洋特许公司法"
 oe_lw2_pol_oceanic_chartered_desc:0 "授权股份制远洋贸易公司独占海外商栈与航线运营，显著拓展贸易射程、商队容量与商税回报，但也使大商团权势凌驾王庭。"
 oe_lw2_pol_free_port_charter:0 "自由贸易港宪章"
 oe_lw2_pol_free_port_charter_desc:0 "废除陈旧行会垄断并开放国际自由贸易港，汇聚全球商流并加速新思潮传入，但直接关税与传统正税征收效率随之下降。"
 oe_lw2_judicial_code_law:0 "司法与法典体系"
 oe_lw2_judicial_code_law_desc:0 "决定全国法庭审级与法律渊源的根本制度，从地方习惯法裁判演进至成文法典编纂、行政法院分权与近代民法典。"
 oe_lw2_pol_customary_courts:0 "习惯法裁判"
 oe_lw2_pol_customary_courts_desc:0 "尊重庄园法庭、乡绅长老与教区习惯法传统，稳定各阶层人心并维护社会秩序，但令中央立法改革推进缓慢。"
 oe_lw2_pol_codified_statutes:0 "罗马法与成文法典编纂"
 oe_lw2_pol_codified_statutes_desc:0 "参照罗马法精神编纂全国统一的成文法典并由王室法学家巡回审理，大幅提升立法效率与地方控制，但压缩了领主裁判特权。"
 oe_lw2_pol_administrative_courts:0 "行政法院分权"
 oe_lw2_pol_administrative_courts_desc:0 "设立专职带薪的省区行政法院以稽核地方官吏并加速政令通达边疆，提升内阁行政效率，但也增加了官僚俸禄与宫廷开支。"
 oe_lw2_pol_modern_civil_code:0 "近代民法典"
 oe_lw2_pol_modern_civil_code_desc:0 "确立法律面前一律平等、私有契约受护与全国统一民商诉讼程序，加速人口晋升并缓和分离倾向，但彻底动摇旧贵族与教士特权。"
 oe_lw2_press_academy_law:0 "新闻、出版与学府法"
 oe_lw2_press_academy_law_desc:0 "统辖修院抄本审查、皇家特许印书局、科学学府以及公共报刊自由，在思想统一与学术创新之间作出战略权衡。"
 oe_lw2_pol_monastic_scriptoria:0 "修道院抄本审查"
 oe_lw2_pol_monastic_scriptoria_desc:0 "由修道院与教士阶层垄断典籍抄写与教义审定，显著提升教士满意度与宗教影响力，但明显延缓世俗思潮的传入。"
 oe_lw2_pol_royal_licensed_press:0 "皇家特许印书局"
 oe_lw2_pol_royal_licensed_press_desc:0 "特许受监管的官办与商办印书局大量印行学术典籍与政令文告，稳步提升科研速度与书籍产出，但对市民舆论维持严格审查。"
 oe_lw2_pol_scientific_academies:0 "皇家科学与学术院宪章"
 oe_lw2_pol_scientific_academies_desc:0 "以国库资助国家科学院、天文台与学术期刊，显著加速科技研发、识字率提升与思潮演进，但需承担高额宫廷赞助并引发保守教士不满。"
 oe_lw2_pol_free_public_press:0 "公共报刊与出版自由"
 oe_lw2_pol_free_public_press_desc:0 "废除事前审查以全面放开公共报刊与民间论政，将科研速度、市民识字上限与思潮接纳效率推至顶峰，但削弱王权掌控并增加稳定度压力。"
 oe_lw2_labor_mobility_law:0 "劳役、农奴与自由迁徙法"
 oe_lw2_labor_mobility_law_desc:0 "规范农奴附着地权、自由租佃契约、圈地工场雇佣与近代劳工保障，直接影响各阶层满意度、人口迁徙与工业转型。"
 oe_lw2_pol_bound_manorial:0 "农奴附着地权"
 oe_lw2_pol_bound_manorial_desc:0 "将农夫严格束缚于领主庄园并强制服劳役，提高初级原料产出并取悦贵族，但极大压制人口迁徙与农民满意度。"
 oe_lw2_pol_free_copyhold:0 "自由租佃制"
 oe_lw2_pol_free_copyhold_desc:0 "将无度劳役折算为定额书面地租并保障农户永佃权，提升粮食产出、农民权益与乡村安定，但引起守旧领主阶层的不满。"
 oe_lw2_pol_enclosure_manufactory:0 "圈地与工场雇佣法"
 oe_lw2_pol_enclosure_manufactory_desc:0 "将公地整合为商业农牧场并推动剩余农力流向城市手工工场，显著提升生产效率、人口晋升与迁徙速度，但造成深重的乡村阵痛。"
 oe_lw2_pol_statutory_labor:0 "近代劳工保护法"
 oe_lw2_pol_statutory_labor_desc:0 "立法限制工时、规范雇佣契约并设立公共救济基金，持续促进地方繁荣、人口增长与底层安定，但小幅压缩工场利润与商贾满意度。"
 # Civilization-Specific Regional Laws
 oe_lw2_fra_parlement_law:0 "高等法院与钦差巡按法"
 oe_lw2_fra_parlement_law_desc:0 "界定法兰西各省高等法院的敕令登记权、法袍贵族世袭官职与王室直派巡按官之间的行政权衡。"
 oe_lw2_pol_fra_sovereign_parlements:0 "高等法院谏阻特权"
 oe_lw2_pol_fra_sovereign_parlements_desc:0 "承认巴黎及各省高等法院对王室敕令的审查与谏阻权，赢得法袍与佩剑贵族拥护，但减缓中央立法节奏。"
 oe_lw2_pol_fra_paulette_venality:0 "波莱特税与法袍官僚制"
 oe_lw2_pol_fra_paulette_venality_desc:0 "允许司法官吏缴纳年费换取官职世袭权，充实王室国库并吸纳富裕市民进入统治阶层，但滋生行政冗费。"
 oe_lw2_pol_fra_royal_intendants:0 "王室直派省区巡按官"
 oe_lw2_pol_fra_royal_intendants_desc:0 "由国王御前会议向各总督区派遣可随时罢免的巡按官统筹财税与治安，强力巩固王权与控制度，但招致地方贵族强烈反感。"
 oe_lw2_pol_fra_council_of_state:0 "统一行省督察与国务委员会"
 oe_lw2_pol_fra_council_of_state_desc:0 "以划一的省区督察与中央国务委员会取代错综复杂的封建法区，极大提升行政与立法效能，但削弱传统阶层向心力。"
 oe_lw2_fra_gallican_crown_law:0 "萨利克与高卢教会特权法"
 oe_lw2_fra_gallican_crown_law_desc:0 "确立法兰西王室的神圣继承法理以及高卢教会在主教任命、教产征税与教廷关系上的独立特权。"
 oe_lw2_pol_fra_salic_orthodoxy:0 "至基督教国王正统盟约"
 oe_lw2_pol_fra_salic_orthodoxy_desc:0 "将萨利克正统王权与大教堂教团紧密结合，增强王室合法性与正教容忍度，但降低了外交折冲的灵活空间。"
 oe_lw2_pol_fra_pragmatic_bourges:0 "布尔日国事诏书"
 oe_lw2_pol_fra_pragmatic_bourges_desc:0 "限制教产岁贡外流并维护本国教士会议的自主权，提升教士阶层好感与赋税留存，但削弱对外宗教外交声望。"
 oe_lw2_pol_fra_gallican_liberties:0 "高卢自由四条款"
 oe_lw2_pol_fra_gallican_liberties_desc:0 "明文宣示国王在世俗事务上的绝对主权及主教提名权，强化王权掌控与文化声望，但引起保守教士的疑虑。"
 oe_lw2_eng_common_law:0 "大宪章与普通法法庭法"
 oe_lw2_eng_common_law_desc:0 "塑造英格兰与不列颠的宪政司法秩序，涵盖大宪章巡回审理、星室特权法庭、人身保护令以及议会权利法案。"
 oe_lw2_pol_eng_magna_carta_assizes:0 "大宪章与巡回陪审法庭"
 oe_lw2_pol_eng_magna_carta_assizes_desc:0 "恪守大宪章精神与地方陪审团巡回审理传统，赢得贵族与各阶层信任并维稳社稷，但制约了王室的临时征税权。"
 oe_lw2_pol_eng_star_chamber:0 "星室特权法庭"
 oe_lw2_pol_eng_star_chamber_desc:0 "授权王室御前星室法庭直接惩处跋扈豪强并加速行政裁断，有效强化王权与控制度，但引起贵族与市民议会派的强烈戒备。"
 oe_lw2_pol_eng_habeas_corpus:0 "人身保护令与普通法保障"
 oe_lw2_pol_eng_habeas_corpus_desc:0 "明文禁止任意拘禁并以普通法判例稳固商事契约，显著提升市民商业信心、贸易收益与国内繁荣，但压缩王室自由裁量权。"
 oe_lw2_pol_eng_bill_of_rights:0 "议会权利法案"
 oe_lw2_pol_eng_bill_of_rights_desc:0 "确立议会对赋税与国家信用的至高审核权，显著降低国债利率、提升立法效能并稳定公共财政，但彻底约束了君主专断权力。"
 oe_lw2_eng_enclosure_navy_law:0 "林木、圈地与木墙海军法"
 oe_lw2_eng_enclosure_navy_law_desc:0 "统筹橡木林地、牧羊圈地与海防征募制度，决定王国是以传统乡村征召为主，还是倾力铸就称霸大洋的木墙舰队。"
 oe_lw2_pol_eng_royal_forests_levy:0 "皇家林地与自耕农演武"
 oe_lw2_pol_eng_royal_forests_levy_desc:0 "保护王家橡木林场并维系乡村自耕农弓箭操练，提升农民征召战力与木材供给，但限制了商业牧场扩张。"
 oe_lw2_pol_eng_enclosure_shipmoney:0 "牧羊圈地与造船税令"
 oe_lw2_pol_eng_enclosure_shipmoney_desc:0 "鼓励商业化牧羊圈地并向内陆郡县征收造船税，显著增加羊毛产出与造船速度，但引发乡村佃农强烈怨愤。"
 oe_lw2_pol_eng_wooden_walls_act:0 "木墙海军法案"
 oe_lw2_pol_eng_wooden_walls_act_desc:0 "以常设海军部统筹官办船坞、海军物料与重型战舰编队，极大增强主力战舰战力与海军士气，但加重舰队日常维护开销。"
 oe_lw2_spa_indies_council_law:0 "伊比利亚海事与西印度理事会法"
 oe_lw2_spa_indies_council_law_desc:0 "统辖伊比利亚诸王国的海洋治理体系，从大航海前的王室海事署演进至塞维利亚通商院、西印度理事会与波旁自由通商改制。"
 oe_lw2_pol_spa_royal_admiralty:0 "王室海事署与沿岸关榷"
 oe_lw2_pol_spa_royal_admiralty_desc:0 "在坎塔布里亚与安达卢西亚统筹王家船坞与近海巡弋，稳固本土海防与海上贸易效率，但需向沿海贵族与港市让渡部分特权。"
 oe_lw2_pol_spa_casa_contratacion:0 "塞维利亚通商院专营"
 oe_lw2_pol_spa_casa_contratacion_desc:0 "将所有跨洋贵金属船队与商船执照收归单一王室通商院核验，提升海上护航、贸易射程与国库关税，但压抑地方港市活力。"
 oe_lw2_pol_spa_council_of_indies:0 "西印度皇家理事会"
 oe_lw2_pol_spa_council_of_indies_desc:0 "设立最高海外国务理事会统筹远洋总督区法制、殖民特许与传教事务，降低殖民开销并稳定属地忠诚，但加重王廷行政开支。"
 oe_lw2_pol_spa_bourbon_free_commerce:0 "帝国多港自由通商令"
 oe_lw2_pol_spa_bourbon_free_commerce_desc:0 "打破单一港口垄断并开放伊比利亚多座海港直通海外贸易，显著提振商贸总收入与商队运力，但冲击旧有垄断行会的利益。"
 oe_lw2_spa_mesta_hermandad_law:0 "梅斯塔牧羊团与神圣兄弟会法"
 oe_lw2_spa_mesta_hermandad_law_desc:0 "调衡伊比利亚梅斯塔大牧主行会、维护乡野治安的神圣兄弟会以及传统自治市镇科尔特斯之间的土地与治安权益。"
 oe_lw2_pol_spa_mesta_pastures:0 "梅斯塔牧羊团特权"
 oe_lw2_pol_spa_mesta_pastures_desc:0 "以王法保护跨省迁徙的美利奴羊牧道，丰厚羊毛产出与牧税收益并取悦大贵族，但挤压了农耕粮食生产与农户利益。"
 oe_lw2_pol_spa_santa_hermandad:0 "王室神圣兄弟会治安军"
 oe_lw2_pol_spa_santa_hermandad_desc:0 "将市镇联防整合为王室直属的乡野治安骑警，清剿盗匪并提升全国控制度与商路安全，但增加了地方行政维稳开销。"
 oe_lw2_pol_spa_municipal_cortes:0 "自治市镇特许状与科尔特斯"
 oe_lw2_pol_spa_municipal_cortes_desc:0 "尊重各城邦历史特许状、灌溉公社与手工业行会自治，促进城市发展与市民满意度，但削弱王室集中征调的能力。"
 oe_lw2_hab_pragmatic_sanction_law:0 "冠地联邦与国事诏书法"
 oe_lw2_hab_pragmatic_sanction_law_desc:0 "规范多瑙河与阿尔卑斯复合君主国的宪政整合，在各冠地等级议会自治、御前枢密院集权与不可分割的国事诏书之间权衡。"
 oe_lw2_pol_hab_hereditary_diets:0 "各冠地等级议会自治"
 oe_lw2_pol_hab_hereditary_diets_desc:0 "恪守各王国与公国既有的等级议会与传统宪章，扩大多元文化容量、提升外交声望并安抚封臣，但减缓中央统一进程。"
 oe_lw2_pol_hab_aulic_chancery:0 "御前枢密院与宫廷军事委员会"
 oe_lw2_pol_hab_aulic_chancery_desc:0 "设立跨冠地的中央枢密院与军事委员会统筹边防与外交，提升内阁效率、外交容量与防务能力，但加重宫廷行政成本。"
 oe_lw2_pol_hab_pragmatic_sanction:0 "不可分割国事诏书"
 oe_lw2_pol_hab_pragmatic_sanction_desc:0 "以根本大法宣告所有世袭领地永不分割并由统一文官体系治理，加快领土整合、提升合法性与立法效能，但引发地方贵族抵制。"
 oe_lw2_rus_table_of_ranks_law:0 "门第制与官秩表法"
 oe_lw2_rus_table_of_ranks_law_desc:0 "规定罗斯诸邦军政官职的晋升序列，从古老的波雅尔血统门第制、中央衙门制演进至以实绩定品级的彼得大帝官秩表。"
 oe_lw2_pol_rus_mestnichestvo:0 "波雅尔门第序列制"
 oe_lw2_pol_rus_mestnichestvo_desc:0 "严格依据波雅尔世家祖先勋爵排定朝班与统兵次序，赢得大贵族效忠与征召支持，但严重制约内阁选贤效率。"
 oe_lw2_pol_rus_prikazy_chanceries:0 "中央衙门制（普里卡兹）"
 oe_lw2_pol_rus_prikazy_chanceries_desc:0 "建立常设中央衙门并由专职书吏掌管军政、外交与赋税文书，加强皇权控制与赋税效率，但增加了宫廷文牍开支。"
 oe_lw2_pol_rus_table_of_ranks:0 "帝国官秩表"
 oe_lw2_pol_rus_table_of_ranks_desc:0 "彻底废除血统门第，设立文武十四等官秩，一律以军功与政务实绩晋升，显著提升训练度、科研与内阁效能，但激怒保守世家。"
 oe_lw2_pol_rus_charter_nobility:0 "贵族与城市特许诏书"
 oe_lw2_pol_rus_charter_nobility_desc:0 "正式颁授地方服役贵族与自治城镇法人特许状，稳固广袤行省的长期治理与繁荣，但让渡部分沙皇直辖集权。"
 oe_lw2_rus_serfdom_code_law:0 "大会法典与哥萨克边疆自由法"
 oe_lw2_rus_serfdom_code_law_desc:0 "界定罗斯农民的迁徙权利、农奴制法典以及南方与东方边疆哥萨克屯垦军团的自治特权。"
 oe_lw2_pol_rus_yuri_day_mobility:0 "尤里节农民自由迁徙权"
 oe_lw2_pol_rus_yuri_day_mobility_desc:0 "保留秋收后尤里节前后结清地租即可转投他主或迁徙的古例，维持乡村安定与粮食供应，但制约了地主强制征调。"
 oe_lw2_pol_rus_cossack_frontier_charter:0 "边疆哥萨克自由军屯宪章"
 oe_lw2_pol_rus_cossack_frontier_charter_desc:0 "赐予草原与西伯利亚前线的哥萨克自治军团免税土地，换取精锐轻骑侦察、边疆开拓与更快迁徙速度，但削弱中央直辖控制。"
 oe_lw2_pol_rus_sobornoye_ulozheniye:0 "大会法典与全面农奴制"
 oe_lw2_pol_rus_sobornoye_ulozheniye_desc:0 "以成文法典将农夫永久固定于服役贵族采邑之上，保障军役人力与贵族拥护并压低叛乱外溢，但严重损害农民满意度与识字发展。"
 oe_lw2_steppe_yassa_sharia_law:0 "大札撒与教法折衷法"
 oe_lw2_steppe_yassa_sharia_law_desc:0 "调和成吉思汗草原《大札撒》成法、伊斯兰教法裁决与定居绿洲波斯化官僚行政之间的法统张力。"
 oe_lw2_pol_steppe_great_yassa:0 "大札撒至上法统"
 oe_lw2_pol_steppe_great_yassa_desc:0 "恪守草原大札撒军纪与诸教宽容旧制，显著强化骑兵冲击力、汗国凝聚力与部族忠诚，但疏离绿洲城市教法学者。"
 oe_lw2_pol_steppe_yassa_sharia_accord:0 "札撒与教法双轨并治"
 oe_lw2_pol_steppe_yassa_sharia_accord_desc:0 "游牧军户依札撒断事官裁决，绿洲城邑依教法法官审理，兼顾草原武备与定居社会安定，但小幅增加协调开销。"
 oe_lw2_pol_steppe_sedentary_diwan:0 "绿洲定居底万行政法"
 oe_lw2_pol_steppe_sedentary_diwan_desc:0 "以波斯化定居文官底万与精确税籍统御帝国，大幅提高财税效率、科研速度与城市发展，但令传统游牧部落大为不满。"
 oe_lw2_steppe_ulus_pasture_law:0 "兀鲁思牧场与丝路商队法"
 oe_lw2_steppe_ulus_pasture_law_desc:0 "规范草原夏冬牧场分界、站赤驿道护卫以及联通中原、河中与黑海的丝绸之路商队税制。"
 oe_lw2_pol_steppe_ulus_pastures:0 "兀鲁思游牧牧场保护令"
 oe_lw2_pol_steppe_ulus_pastures_desc:0 "严禁农耕侵占夏冬转场牧道并优先繁育战马畜群，提升战马产出与部族凝聚力，但限制了城镇工坊扩张。"
 oe_lw2_pol_steppe_yam_caravan_guard:0 "站赤驿道与斡脱商队护卫法"
 oe_lw2_pol_steppe_yam_caravan_guard_desc:0 "在丝路驿站常驻护商骑兵并承保跨国斡脱商队，显著提升陆路贸易效率与商队容量，但需承担驿站维护经费。"
 oe_lw2_pol_steppe_oasis_waqf_charter:0 "绿洲水利与瓦克夫商学宪章"
 oe_lw2_pol_steppe_oasis_waqf_charter_desc:0 "将商路关税投入坎儿井水利、丝绸作坊与经学院建设，推动绿洲繁荣与文化传承，但削弱了传统牧民部落的地位。"
 oe_lw2_ind_mansabdar_iqta_law:0 "伊克塔与曼萨卜达尔军役法"
 oe_lw2_ind_mansabdar_iqta_law_desc:0 "规范印度次大陆的军事授田与军功品级体系，涵盖德里伊克塔封邑、德干纳亚卡军镇以及莫卧儿曼萨卜达尔双秩核验制度。"
 oe_lw2_pol_ind_hereditary_iqta:0 "行省伊克塔采邑制"
 oe_lw2_pol_ind_hereditary_iqta_desc:0 "将地方赋税区划归军将就地供养重骑兵团，减轻中央国库军费压力并稳定贵族关系，但导致地方军事长官坐大。"
 oe_lw2_pol_ind_nayaka_military_tenures:0 "纳亚卡要塞军镇制"
 oe_lw2_pol_ind_nayaka_military_tenures_desc:0 "向世袭纳亚卡武官授予山地要塞辖区以供养步兵与战象部队，增强国土纵深防御与征召规模，但削弱中央对地方田赋的直征。"
 oe_lw2_pol_ind_mansabdar_grading:0 "曼萨卜达尔品级与烙马核验"
 oe_lw2_pol_ind_mansabdar_grading_desc:0 "按个人品秩与额定骑兵数量双轨考核全体将领并实行战马烙印点验，显著提升军纪、骑兵战力与皇权权威，但增加督察行政开销。"
 oe_lw2_pol_ind_imperial_jagirdari:0 "轮调贾吉尔封地制"
 oe_lw2_pol_ind_imperial_jagirdari_desc:0 "每隔数年轮换非世袭贾吉尔军饷封地以杜绝藩镇割据，稳固中央集权与火炮军备，但短期内降低了地方深耕开发的积极性。"
 oe_lw2_ind_zamindar_caste_law:0 "柴明达尔估税与行会宪章法"
 oe_lw2_ind_zamindar_caste_law_desc:0 "调衡乡村柴明达尔世袭收税人、托达尔·马尔式十年均田定额估税制与印度玛哈詹金融织造行会之间的经济秩序。"
 oe_lw2_pol_ind_zamindar_autonomy:0 "柴明达尔包揽乡税制"
 oe_lw2_pol_ind_zamindar_autonomy_desc:0 "依托世袭乡村地主柴明达尔与村社长老代征田赋，维持广大农村安定与低叛乱风险，但让渡了大量财政截留空间。"
 oe_lw2_pol_ind_mahajan_guild_charters:0 "玛哈詹汇兑与织造行会宪章"
 oe_lw2_pol_ind_mahajan_guild_charters_desc:0 "以王法护持玛哈詹商号汇票（洪迪）与棉丝织造工匠行会，显著提升手工业产出与商业信用，但提升了市民金融寡头的权势。"
 oe_lw2_pol_ind_zabt_land_survey:0 "扎布特十年均田估税法"
 oe_lw2_pol_ind_zabt_land_survey_desc:0 "以统一官尺丈量耕地并按十年平均收成折银定额征税，显著提高正税效率与农户可预期性，但触动了地方柴明达尔的既得利益。"
 oe_lw2_sea_mandala_tribute_law:0 "曼陀罗朝贡与王权法典"
 oe_lw2_sea_mandala_tribute_law_desc:0 "规范东南亚诸王国的治国秩序，在同心圆曼陀罗朝贡体系、萨克迪纳等级人力制与中央直辖郡县回路之间作出抉择。"
 oe_lw2_pol_sea_mandala_circles:0 "同心曼陀罗朝贡圈"
 oe_lw2_pol_sea_mandala_circles_desc:0 "以神圣转轮王威望、联姻与金银花朝贡维系外围邦国，提升外交容量、附庸忠诚与威望，但直辖省份的控制度较为松散。"
 oe_lw2_pol_sea_sakdina_ranks:0 "萨克迪纳稻田品级制"
 oe_lw2_pol_sea_sakdina_ranks_desc:0 "按法定稻田额度明确贵族、官吏与平民的军役及劳役义务，大幅充实兵源与粮食产出，但对基层农户造成一定负担。"
 oe_lw2_pol_sea_royal_provincial_circuit:0 "王室直辖行省回路法"
 oe_lw2_pol_sea_royal_provincial_circuit_desc:0 "以流官总督与成文法典取代世袭外藩，加快领土整合、提高赋税与控制度，但引发传统地方王公与藩属的抵制。"
 oe_lw2_sea_monsoon_port_law:0 "季风转口港与香料商法"
 oe_lw2_sea_monsoon_port_law_desc:0 "统辖联通印度洋与南海的季风良港与香料贸易，涵盖番坊港务长（沙班达尔）自治、王室戎克船专营以及远洋香料特许港宪章。"
 oe_lw2_pol_sea_shahbandar_entrepot:0 "多族港务长（沙班达尔）转口制"
 oe_lw2_pol_sea_shahbandar_entrepot_desc:0 "为华商、印商、阿拉伯与马来商帮分设专属港务长并保障公平仲裁，汇聚季风商流并广结善缘，但让渡了部分王室专卖收益。"
 oe_lw2_pol_sea_royal_junk_monopoly:0 "王室官船专营法"
 oe_lw2_pol_sea_royal_junk_monopoly_desc:0 "由王室官办大戎克船垄断胡椒、锡矿与苏木等大宗外销，充实国库并增强海防护航能力，但压缩了民间商帮利润。"
 oe_lw2_pol_sea_spice_port_charter:0 "武装香料港特许宪章"
 oe_lw2_pol_sea_spice_port_charter_desc:0 "在海峡要冲构筑炮台与官督商办香料交易所，以坚船利炮捍卫本土香料定价权并提升商贸总收入，但增加海军与防务维护开支。"
 oe_lw2_afr_caravan_crown_law:0 "红海—撒哈拉商队保护法"
 oe_lw2_afr_caravan_crown_law_desc:0 "统辖非洲大陆纵贯撒哈拉、红海与东非海岸的黄金、岩盐、象牙与朝圣商道，权衡部族护商、港口税关、王室铸币与跨洋商贸。"
 oe_lw2_pol_afr_trans_saharan_escort:0 "跨撒哈拉商队护航制"
 oe_lw2_pol_afr_trans_saharan_escort_desc:0 "委任沙漠向导与绿洲部族护卫黄金、岩盐驼队穿越沙海，显著提升陆路商贸与岩盐产出并安抚部族，但放松了荒漠边陲直辖控制。"
 oe_lw2_pol_afr_red_sea_customs:0 "红海与东非海岸关税署"
 oe_lw2_pol_afr_red_sea_customs_desc:0 "在红海、马格里布与斯瓦希里港口推行统一海关与朝圣商税，稳步增加海贸与财政收入，但略微降低海商行会满意度。"
 oe_lw2_pol_afr_royal_salt_gold_mint:0 "王室金砂专储与本位铸币法"
 oe_lw2_pol_afr_royal_salt_gold_mint_desc:0 "规定大块自然金归王室金库专储、金砂流通并铸造纯度划一的金币，同时资助大学与书院，增强黄金产出、科研与威望，但加重通胀压力。"
 oe_lw2_pol_afr_oceanic_caravan_exchange:0 "陆海联运特许商栈法"
 oe_lw2_pol_afr_oceanic_caravan_exchange_desc:0 "以王室护持的联运商栈将内陆商队集市与大西洋、印度洋航运直接对接，大幅拓展贸易射程与商队运力，但提高了市民行会权势。"
