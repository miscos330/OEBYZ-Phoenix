l_simp_chinese:
 oe_byz_missions_tur_I_req_tt: "君士坦丁堡仍在我们手中，国内也还安定，帝国才有余力望向海峡对岸。"
 oe_byz_missions_tur_II_req_tt: "国库里存够 300 金币，军队满员八成以上。"
 oe_byz_missions_tur_III_req_tt: "与至少一个突厥君主交好（对我们的好感不低于 50），分化突厥诸侯。"
 oe_byz_missions_tur_IV_req_tt: "稳定度至少为 1，正统性不低于 50，教会才会为远征祝福。"
 oe_byz_missions_tur_V_req_tt: "夺取布尔萨，在亚细亚岸边站稳脚跟。"
 oe_byz_missions_tur_VI_req_tt: "收复尼西亚，第一次大公会议的城市。"
 oe_byz_missions_tur_VII_req_tt: "收复士麦那，夺回爱琴海东岸的港口。"
 oe_byz_missions_tur_VIII_req_tt: "拿下屈塔希亚与班德尔马，把战线推进到高原边缘。"
 oe_byz_missions_tur_IX_req_tt: "让奥斯曼国家不复存在，或成为帝国的附庸。"
 oe_byz_missions_tur_X_req_tt: "征服安卡拉，安纳托利亚中部的门户。"
 oe_byz_missions_tur_XI_req_tt: "征服卡拉曼的都城科尼亚。"
 oe_byz_missions_tur_XII_req_tt: "控制开塞利，并让当地希腊文化人口至少占四分之一。"
 oe_byz_missions_tur_XIII_req_tt: "征服锡瓦斯，打开通往东方的道路。"
 oe_byz_missions_tur_XIV_req_tt: "同时据有安卡拉、科尼亚、锡瓦斯、开塞利和安塔利亚，安纳托利亚重归帝国。"
 oe_byz_missions_tur_XV_req_tt: "让特拉比松重归君士坦丁堡治下。"
 STATIC_MODIFIER_NAME_oe_tur_war_preparations: "战争准备"
