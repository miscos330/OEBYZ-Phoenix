l_simp_chinese:
# NEW 2026-11-22 v15.5 Module 15.5-B: Ming 2.0 Deep Overhaul (oe_mg2_, 0 slots, 0 vanilla overrides). Generated by gen_v155_ming_qing.py; edit the generator, not this file.
 oe_mg2_player_only_tt: "由人类玩家操控"
 oe_mg2_purge_cd_tt: "过去12年内未曾清查党争与厂卫弊政"
 oe_mg2_loyalist_cd_tt: "过去12年内未曾颁诏号召南明义师"
 oe_mg2_late_ming_uprising: "晚明流寇与小冰期巨变"
 oe_mg2_late_ming_uprising_desc: "小冰期酷寒旱灾、白银通缩危机与沉重三饷交织爆发，陕北、中原与川楚流民揭竿而起。唯有赈济灾民、澄肃厂卫党争并恢复国内稳定，方能挽大明社稷于既倒。"
 oe_mg2_dec_reform_six_ministries.title: "整饬六部与内阁票拟"
 oe_mg2_dec_reform_six_ministries.desc: "厘定内阁票拟规制与六部考成职责，革除官场推诿积弊，显著提升大明行政效能、立法效率与财赋收益。"
 oe_mg2_dec_reform_six_ministries.a: "颁行六部内阁整饬新章"
 oe_mg2_dec_reform_six_ministries_tt: "提升内阁凝聚度+20，并获得35年「六部内阁整饬新章」国家修正。"
 oe_mg2_dec_purge_factional_corruption.title: "清查党争与裁抑厂卫"
 oe_mg2_dec_purge_factional_corruption.desc: "严惩东厂矿监贪墨并调和朝堂党争，重振都察院风宪，迅速降低流寇烈度并助力化解晚明民变灾难。"
 oe_mg2_dec_purge_factional_corruption.a: "澄肃朝纲并裁抑厂卫积弊"
 oe_mg2_dec_purge_factional_corruption_tt: "移除东厂与矿监负面修正，降低流寇烈度-20，提升内阁凝聚度+15，并获得15年「澄肃言路与裁抑党争」修正。"
 oe_mg2_dec_rally_southern_loyalists.title: "号召南明义师与东南水师"
 oe_mg2_dec_rally_southern_loyalists.desc: "于社稷危难或北都失守之际，传檄江南、闽粤与西南忠义之士共举大明正朔，整编陆上义师与东南舟师死守山河。"
 oe_mg2_dec_rally_southern_loyalists.a: "传檄东南西南共举延明大纛"
 oe_mg2_dec_rally_southern_loyalists_tt: "提升陆海军传统与边防整备度，降低流寇烈度-15，并获得20年「南明义师忠烈大纛」国家修正。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_jianwen_centralize: "建文削藩集权"
 STATIC_MODIFIER_DESC_oe_mg2_mod_jianwen_centralize: "朝廷采纳齐泰、黄子澄之议，收缴诸王护卫兵权并强化文官内阁统御，却骤然激化宗藩与京师的猜忌。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_border_princes_guard: "塞王屏藩守边"
 STATIC_MODIFIER_DESC_oe_mg2_mod_border_princes_guard: "保留燕、宁、晋诸塞王沿边节制兵马之制，强化北疆城防与重骑驰援，代价是皇权集中度略受掣肘。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_jingnan_vanguard: "靖难燕师锐骑"
 STATIC_MODIFIER_DESC_oe_mg2_mod_jingnan_vanguard: "燕军久历塞外苦战，甲骑骁勇善战，以清君侧之名南下转战江淮，军威大振但社稷震荡。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_nanjing_loyalist_guard: "金陵勤王守土"
 STATIC_MODIFIER_DESC_oe_mg2_mod_nanjing_loyalist_guard: "江南诸道响应朝廷勤王诏书，固守江防城垣并维系正统法度，稳定江南根本。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_yongle_dadian: "《永乐大典》巨帙"
 STATIC_MODIFIER_DESC_oe_mg2_mod_yongle_dadian: "两千余名儒臣历时数载编纂一万一千余册百科全书，囊括经史子集与天文农工，大幅弘扬帝国文教与学术。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_imperial_archives: "文渊阁典籍整编"
 STATIC_MODIFIER_DESC_oe_mg2_mod_imperial_archives: "翰林院将历代律令、舆图与赋役典册分类入阁，显著提升内阁票拟与政令运行效能。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_forbidden_city_court: "紫禁城天子御极"
 STATIC_MODIFIER_DESC_oe_mg2_mod_forbidden_city_court: "集天下良材巧匠营建北京紫禁城，宫阙巍峨居中御宇，大幅巩固天朝正统、中央控制力与北都城防。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_beijing_corvee_restraint: "北都营建恤民"
 STATIC_MODIFIER_DESC_oe_mg2_mod_beijing_corvee_restraint: "朝廷放缓征发四川湖广皇木与夫役的节奏，以休养民力换取稳健的赋税与地方繁荣。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_five_northern_campaigns: "永乐五征漠北"
 STATIC_MODIFIER_DESC_oe_mg2_mod_five_northern_campaigns: "皇帝亲率京营铁骑与神机营火器远征克鲁伦河与斡难河，威震朔漠，却也带来沉重的军费与厌战消耗。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_northern_buffer_garrisons: "开平大宁靖边守势"
 STATIC_MODIFIER_DESC_oe_mg2_mod_northern_buffer_garrisons: "以卫所屯田与关外羁縻卫所构筑梯次缓冲防线，节省远征军费并稳固边疆秩序。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_renxuan_three_yangs: "仁宣之治与三杨辅政"
 STATIC_MODIFIER_DESC_oe_mg2_mod_renxuan_three_yangs: "杨士奇、杨荣、杨溥三杨执掌内阁票拟，停罢劳民远役、轻徭薄赋，开创大明国势最称清平的仁宣盛世。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_jinhua_silver_commutation: "金花银折色新政"
 STATIC_MODIFIER_DESC_oe_mg2_mod_jinhua_silver_commutation: "将江南七省漕粮部分折征白银解送内府，打破实物税禁锢，显著扩充国库财源与商业流通。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_eunuch_red_brush: "司礼监批红掌印"
 STATIC_MODIFIER_DESC_oe_mg2_mod_eunuch_red_brush: "内廷宦官掌司礼监批红之权以制衡外廷文官，强化君主集权与密探掌控，却令士绅百官离心。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_tumu_shock: "土木堡之变余震"
 STATIC_MODIFIER_DESC_oe_mg2_mod_tumu_shock: "京营精锐折损于怀来土木堡，勋贵宿将凋零，军心与朝廷威望一时遭受剧烈冲击。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_yu_qian_defense: "于谦北京保卫战"
 STATIC_MODIFIER_DESC_oe_mg2_mod_yu_qian_defense: "兵部尚书于谦力排南迁之议，调集天下勤王兵马列阵德胜门外，力挽狂澜重塑京师军魂。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_hongzhi_restoration: "弘治中兴与六部清肃"
 STATIC_MODIFIER_DESC_oe_mg2_mod_hongzhi_restoration: "君臣和衷共济，重开午朝言路，裁汰冗官并充实天下预备仓，令大明中叶政务焕然一新。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_great_rites_authority: "大礼议皇权申张"
 STATIC_MODIFIER_DESC_oe_mg2_mod_great_rites_authority: "历经左顺门廷争后，君主压服外廷礼臣，重申乾纲独断与礼制裁决之权，但朝堂裂痕暗生。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_altan_feng_gong: "俺答封贡与隆庆和议"
 STATIC_MODIFIER_DESC_oe_mg2_mod_altan_feng_gong: "敕封顺义王并在大同、宣府重开马市互市，化百年北边兵祸为边贸通商，大幅减轻边镇军费。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_qi_brick_great_wall: "蓟镇砖石长城与空心敌台"
 STATIC_MODIFIER_DESC_oe_mg2_mod_qi_brick_great_wall: "戚继光督修蓟镇砖石边墙与千余座三层空心火器敌台，将万里长城锻造为近代火炮堡垒链。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_wanli_three_campaigns: "万历三大征全胜"
 STATIC_MODIFIER_DESC_oe_mg2_mod_wanli_three_campaigns: "帝国连克宁夏哱拜、援朝抗倭与播州杨应龙三役，彰显天朝武功与攻坚火力，代价是边饷消耗与厌战累积。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_mine_tax_extortion: "矿监税使搜刮"
 STATIC_MODIFIER_DESC_oe_mg2_mod_mine_tax_extortion: "派往各省的矿监税使强征商税与作坊杂捐，短期充盈内帑却激怒城镇市民并催生民变。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_suzhou_guild_accord: "江南织佣安抚定约"
 STATIC_MODIFIER_DESC_oe_mg2_mod_suzhou_guild_accord: "撤罢扰民税监并整顿苏州机户商税，稳定江南丝织工场与市镇繁荣。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_donglin_moral_censorate: "东林清流言路"
 STATIC_MODIFIER_DESC_oe_mg2_mod_donglin_moral_censorate: "东林书院倡导风声雨声读书声、家事国事天下事，砥砺清议与法度，却也伴随朝堂党派之争牵制君权。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_eastern_depot_terror: "东厂诏狱党祸"
 STATIC_MODIFIER_DESC_oe_mg2_mod_eastern_depot_terror: "阉党借东厂与锦衣卫大兴诏狱清除异己，强化内廷监控与反谍能力，却重创士林元气并助长流乱。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_shaanxi_relief_granaries: "秦晋赈灾复驿令"
 STATIC_MODIFIER_DESC_oe_mg2_mod_shaanxi_relief_granaries: "开仓放粮赈济陕北旱灾并恢复驿卒生计，有效瓦解流民裹挟之势，安抚天下农桑。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_silver_deflation_shock: "晚明白银通缩震荡"
 STATIC_MODIFIER_DESC_oe_mg2_mod_silver_deflation_shock: "海外白银输入骤减导致银贵钱贱，百姓折银纳粮负担倍增，财税收入萎缩而流寇四起。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_copper_coin_relief: "铸钱平准与蠲免积欠"
 STATIC_MODIFIER_DESC_oe_mg2_mod_copper_coin_relief: "朝廷准许钱粮兼收并蠲免灾区积欠，同时铸造足值官钱稳定币值，遏止通缩恶化。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_central_plains_militia: "中原团练剿抚并举"
 STATIC_MODIFIER_DESC_oe_mg2_mod_central_plains_militia: "整编卢象升、孙传庭式精锐官兵与地方坚壁清野团练，以战养守阻击中原流寇蔓延。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_uprising_pacified: "晚明流寇荡平中兴"
 STATIC_MODIFIER_DESC_oe_mg2_mod_uprising_pacified: "度过小冰期饥荒与流寇风暴后，朝廷轻赋休民、重整纲纪，社稷转危为安。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_hongguang_jiangbei: "江北四镇与淮扬防线"
 STATIC_MODIFIER_DESC_oe_mg2_mod_hongguang_jiangbei: "以史可法督师扬州统筹江北四镇，构筑淮河与长江双重防线屏障江南财赋重地。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_longwu_fujian_fleet: "闽海舟师与仙霞关防"
 STATIC_MODIFIER_DESC_oe_mg2_mod_longwu_fujian_fleet: "依托福州仙霞岭天险与闽南武装海商船队，打通东南海贸税源并稳固海防。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_yongli_southwest_rally: "西南抗清与李定国锐旅"
 STATIC_MODIFIER_DESC_oe_mg2_mod_yongli_southwest_rally: "联大西旧部与西南义旅转战桂林、衡阳、昆明，以奇兵劲旅屡挫强敌，重燃中兴战意。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_koxinga_dongning: "国姓爷延明水师与东宁"
 STATIC_MODIFIER_DESC_oe_mg2_mod_koxinga_dongning: "郑成功以泉厦舟师跨海驱逐殖民堡垒、经略台湾东宁，大明海权与忠义大旗威震东海海峡。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_reformed_six_ministries: "六部内阁整饬新章"
 STATIC_MODIFIER_DESC_oe_mg2_mod_reformed_six_ministries: "明确内阁票拟权责并推行六部考成核实，消除衙门推诿与积弊，全面提升行政控制力。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_clean_censorate: "澄肃言路与裁抑党争"
 STATIC_MODIFIER_DESC_oe_mg2_mod_clean_censorate: "严惩厂卫贪墨并平息门户党争，重振都察院风宪，缓和朝野对立与民变烈度。"
 STATIC_MODIFIER_NAME_oe_mg2_mod_southern_loyalist_banner: "南明义师忠烈大纛"
 STATIC_MODIFIER_DESC_oe_mg2_mod_southern_loyalist_banner: "江南、闽粤与西南忠义之士共举大明正朔，水陆并进死守半壁山河以图北伐光复。"
 oe_mg2.1.title: "建文新政与削藩之议"
 oe_mg2.1.desc: "太祖崩逝后，新君即位南京，面对坐镇北疆、手握重兵的燕、晋、宁诸位皇叔深感掣肘。齐泰与黄子澄力主雷厉风行削夺诸王护卫兵权，老成之臣则劝谏宜先恩后威、徐图改制，免致宗室兵变。"
 oe_mg2.1.a: "决意雷厉削藩，收归中枢兵权"
 oe_mg2.1.b: "徐图怀柔改制，保留塞王守边"
 oe_mg2.2.title: "靖难之役：燕王誓师南下"
 oe_mg2.2.desc: "北平城头战旗猎猎，燕王朱棣以「清君侧、靖国难」为号起兵，率久经漠北沙场的精锐铁骑突破直隶南下。朝廷是拥立燕王铁血重整天下纲纪，还是动员江淮勤王诸师死守金陵正统？"
 oe_mg2.2.a: "燕师靖难入主，铁血重整朝纲"
 oe_mg2.2.b: "诏告天下勤王，固守金陵正统"
 oe_mg2.3.title: "修纂《永乐大典》：天下文脉总汇"
 oe_mg2.3.desc: "帝敕解缙、姚广孝总领两千余名鸿儒硕学齐聚文渊阁，搜罗天下经史子集、天文算历、医药农工与方志秘籍，拟编成一万一千余册旷世类书《永乐大典》。巨帙耗银甚巨，却足以泽被千秋文脉。"
 oe_mg2.3.a: "倾力编纂《永乐大典》全帙"
 oe_mg2.3.b: "聚焦律令舆图与实用政务典册"
 oe_mg2.4.title: "营建紫禁城与永乐正式迁都北京"
 oe_mg2.4.desc: "川楚楠木顺江而下，苏州金砖、曲阳汉白玉沿大运河北运京师。蒯祥等大匠依中轴礼制营建紫禁城三大殿与九门城垣，天子亲御北都以镇朔漠之势已成，唯工役浩繁须权衡国力。"
 oe_mg2.4.a: "落成紫禁城并正式定鼎北京"
 oe_mg2.4.b: "分期徐建宫阙，减轻民间木石夫役"
 oe_mg2.5.title: "永乐五征漠北：朔漠扬威"
 oe_mg2.5.desc: "漠北诸部屡犯开平、宣府边塞，皇帝意欲亲率京营重骑与神机营火铳三出绝漠、直抵克鲁伦河以绝北患。户部尚书夏原吉则忧心千里转饷耗空国库，建言固守边镇、以逸待劳。"
 oe_mg2.5.a: "亲率大军出塞远征漠北"
 oe_mg2.5.b: "采纳户部之议，筑垒守边休养民力"
 oe_mg2.6.title: "仁宣之治与三杨内阁票拟"
 oe_mg2.6.desc: "历经永乐年间的连年大役后，新君任用杨士奇、杨荣、杨溥三杨执掌文渊阁，确立内阁「票拟」制度，停罢劳民采办、平反冤狱、劝课农桑，天下休养生息，堪称大明治世典范。"
 oe_mg2.6.a: "确立三杨票拟共治，轻徭薄赋"
 oe_mg2.6.b: "趁海内承平扩编北边屯田与府库"
 oe_mg2.7.title: "金花银折色与司礼监批红之争"
 oe_mg2.7.desc: "正统初年，江南七省四百万石税粮改折「金花银」解送内府，既推动白银货币化，也让司礼监太监得以染指财政与批红大权。外廷阁臣疾呼严守祖制不许内臣干政，内廷则以制衡朋党自居。"
 oe_mg2.7.a: "推广金花银折色，厘定外廷度支"
 oe_mg2.7.b: "倚重司礼监批红，以中官制衡文臣"
 oe_mg2.8.title: "正统十四年：土木堡之变"
 oe_mg2.8.desc: "瓦剌太师也先分道入寇大同与宣府，仓促亲征的京师大军回师至怀来土木堡时断水乏粮，遭敌骑四面合围，数十万京营锐卒溃散、勋臣文武多殉国难，消息传回北京，朝野震骇。"
 oe_mg2.8.a: "急诏天下边镇精兵火速入卫京师"
 oe_mg2.8.b: "严惩冒进权宦，整肃残部重建京营"
 oe_mg2.9.title: "社稷为重：于谦北京保卫战"
 oe_mg2.9.desc: "敌骑兵临居庸关与北京九门之下，朝堂有人倡议南迁南京避锋。兵部尚书于谦厉声斥责「言南迁者可斩」，迅速从通州转运军粮、调集山东河南勤王军二十二万列阵德胜门外，火器齐发击退强敌。"
 oe_mg2.9.a: "委任于谦统筹团营，背城决战德胜门"
 oe_mg2.9.b: "坚壁固守九门同时遣使通好换取喘息"
 oe_mg2.10.title: "弘治中兴：重整六部与内阁共治"
 oe_mg2.10.desc: "历经宪宗朝的传奉冗官之弊后，孝宗即位力图振作，延揽刘健、李东阳、谢迁入阁，重开平台召对，裁革传奉官千余人并修治黄运河防与预备义仓，帝国气象再度清明。"
 oe_mg2.10.a: "裁汰冗官并复行午朝共治"
 oe_mg2.10.b: "趁中兴财赋宽裕修缮北疆诸镇城垣"
 oe_mg2.11.title: "豹房旧弊与大礼议廷争"
 oe_mg2.11.desc: "正德年间豹房权幸弄权遗患未消，嘉靖以藩王入继大统后又因本生父尊号问题与杨廷和为首的文官集团爆发激烈「大礼议」之争。左顺门伏阙哭谏震动朝野，君权与礼法之界自此改写。"
 oe_mg2.11.a: "申张天子乾纲，采新锐礼臣改制"
 oe_mg2.11.b: "调和外廷六部，以祖宗礼法稳定人心"
 oe_mg2.12.title: "庚戌之变与隆庆俺答封贡"
 oe_mg2.12.desc: "蒙古俺答汗数度破古北口直逼京郊，史称「庚戌之变」，令朝廷深感穷兵黩武难竟全功。隆庆年间，高拱与张居正力排清议，主张封俺答为顺义王、开大同宣府马市以换取北边数十年安宁。"
 oe_mg2.12.a: "推行俺答封贡，重开大同宣府马市"
 oe_mg2.12.b: "拒绝胡市妥协，整军备战死守九边"
 oe_mg2.13.title: "戚继光镇蓟：砖石长城与空心敌台"
 oe_mg2.13.desc: "平定东南倭患后，名将戚继光奉调总理蓟州、昌平、保定练兵，将残破土垣全面包砌为高厚砖石长城，并在崇山峻岭间创筑千余座三层空心火器敌台，驻兵储械、交叉火力，使蓟镇固若金汤。"
 oe_mg2.13.a: "拨银全线包砖长城并建千座空心敌台"
 oe_mg2.13.b: "重点加固山海关与居庸关两翼要隘"
 oe_mg2.14.title: "万历三大征：宁夏、援朝与播州全役"
 oe_mg2.14.desc: "十年之内烽烟三起：西北宁夏哱拜据城叛乱，东亚朝鲜遭跨海大军席卷求援，西南播州土司杨应龙割据称兵。大明依托张居正遗留的太仓积银连克三役，保住藩屏与疆土，却也将太仓银库消耗殆尽。"
 oe_mg2.14.a: "倾尽太仓积银三路凯旋，扬威四夷"
 oe_mg2.14.b: "审慎调拨边军与地方土兵，严控军费"
 oe_mg2.15.title: "矿监税使横行与苏州织佣民变"
 oe_mg2.15.desc: "三大征耗空国库后，皇帝向各省遍派矿监税使搜刮商税矿银。江南苏州织造税监孙隆苛征机户，引发万余名织工在葛贤率领下焚毁税卡、击毙税吏，东南商市一时罢市震动。"
 oe_mg2.15.a: "纵容矿监税使强征内帑以补亏空"
 oe_mg2.15.b: "撤回江南扰民税监，抚慰织户商帮"
 oe_mg2.16.title: "东林书院讲学与清流党争"
 oe_mg2.16.desc: "顾宪成、高攀龙于无锡重修东林书院，讽议朝政、裁量人物，士林景从；然而齐、楚、浙诸党随之结派攻讦，挺击、红丸、移宫三案迭起，六部要缺悬而不补，朝堂渐陷门户内耗。"
 oe_mg2.16.a: "起用东林清流整饬言路与风宪"
 oe_mg2.16.b: "折中诸党平衡授官，严禁朋党空谈"
 oe_mg2.17.title: "魏忠贤东厂专权与六君子诏狱"
 oe_mg2.17.desc: "司礼监秉笔太监魏忠贤勾结外廷阉党，自称「九千岁」，遍建生祠并借东厂缇骑逮捕杨涟、左光斗等东林六君子下锦衣卫诏狱。朝堂清流一空，边镇经略亦受党祸牵连，国政日非。"
 oe_mg2.17.a: "听任东厂缇骑以铁腕压制朝堂异议"
 oe_mg2.17.b: "乾纲独断剪除阉党，昭雪六君子冤狱"
 oe_mg2.18.title: "小冰期大旱与陕北裁驿起兵"
 oe_mg2.18.desc: "崇祯初年小冰期酷寒席卷北方，陕北连年大旱赤地千里、蝗灾并发，草根树皮剥食殆尽。朝廷偏于此时裁撤全国驿站以省银饷，失业的边军逃卒与驿卒遂随高迎祥、李自成揭竿而起。"
 oe_mg2.18.a: "紧急拨银赈济陕北并复设官驿安置流民"
 oe_mg2.18.b: "严令三边总督就地剿杀流寇，不宽赋役"
 oe_mg2.19.title: "白银断流与三饷竭泽的通缩崩塌"
 oe_mg2.19.desc: "美洲马尼拉与日本白银输入骤减，海内白银奇缺而铜钱暴贬。一条鞭法按银征税令农户卖粮两倍仍难完赋，朝廷又因辽饷、剿饷、练饷「三饷」叠加以致民穷财尽，流寇滚雪球般壮大。"
 oe_mg2.19.a: "开铸足值官钱并蠲免灾省积欠三饷"
 oe_mg2.19.b: "坚持按银加派三饷以维持辽东与中原军费"
 oe_mg2.20.title: "闯王李自成：「均田免赋，迎闯王不纳粮」"
 oe_mg2.20.desc: "流寇盟主李自成采纳牛金星、李岩之策，打出「均田免赋」「迎闯王、不纳粮」旗号，连克洛阳、开封并席卷关中京兆（西安），所至开仓赈饥，天下郡县望风瓦解。"
 oe_mg2.20.a: "调孙传庭、卢象升式精锐野战军固守潼关与中原"
 oe_mg2.20.b: "颁诏免除中原三年田赋以夺流寇民心"
 oe_mg2.21.title: "张献忠席卷湖广入川与大西之乱"
 oe_mg2.21.desc: "另一支悍寇张献忠纵横襄阳、武昌与川蜀，突破夔门直扑重庆巴县与成都，切断长江上游粮道与盐税。两湖天府战火连绵，帝国西南腹心岌岌可危。"
 oe_mg2.21.a: "敕令川湖土司与地方官军联手扼守长江三峡"
 oe_mg2.21.b: "收缩川楚防线，先保江南漕运与京师根本"
 oe_mg2.22.title: "甲申国变：煤山危局与山海关抉择"
 oe_mg2.22.desc: "流寇大军翻越太行逼近北京城下，关外辽东大军亦虎视山海关。崇祯朝野面临生死一线：是尽起勋戚内帑悬赏死守京师并力图转危为安，还是遣太子监国南京、留江南火种以图再兴？"
 oe_mg2.22.a: "倾尽内帑犒赏京营，背水一战转危为安"
 oe_mg2.22.b: "密遣太子南下南京留存大明正朔火种"
 oe_mg2.23.title: "南明弘光朝与史可法江北四镇"
 oe_mg2.23.desc: "无论北疆激战几何，东南财赋核心上元（南京）依然矗立。忠臣史可法力主整肃江北四镇骄兵悍将、捐弃马阮门户之争，筑牢淮扬长江铁壁，以确保大明在江南立于不败之地。"
 oe_mg2.23.a: "全权委任史可法节制江北四镇，整肃淮扬防务"
 oe_mg2.23.b: "倚重江南财税优抚勋镇，维系朝堂妥协"
 oe_mg2.24.title: "南明隆武朝与闽海郑氏舟师"
 oe_mg2.24.desc: "立足闽县（福州）与仙霞岭群山屏障，隆武君臣依托郑氏纵横东海、南洋的庞大武装商船队，以海贸白银反哺陆上北伐义师，展现大明向海图存的顽强韧性。"
 oe_mg2.24.a: "敕封闽海舟师大旗，以海贸白银供养北伐"
 oe_mg2.24.b: "固守仙霞、分水诸关，优先整训闽浙步卒"
 oe_mg2.25.title: "南明永历朝与李定国两蹶名王"
 oe_mg2.25.desc: "转进肇庆（高要）、桂林（临桂）与昆明之际，永历朝毅然捐弃前嫌「联寇抗敌」。名将李定国率大西旧部与西南义旅奇袭桂林、衡阳，连斩强敌名王，缔造南明最辉煌的军事奇迹。"
 oe_mg2.25.a: "封李定国晋王节制西南，乘胜反攻湖广"
 oe_mg2.25.b: "稳固滇黔粮饷后方，联结西南诸土司协防"
 oe_mg2.26.title: "国姓爷延明旗帜与光复东宁台湾"
 oe_mg2.26.desc: "赐国姓朱的延平郡王郑成功自晋江厦门率数百艘战船、两万五千铁人军乘潮横渡海峡，围困殖民堡垒并光复台湾东宁，奉大明永历正朔屯田兴学，令明室海权屹立东海不倒。"
 oe_mg2.26.a: "敕授延平王经略东宁，雄踞台海航道"
 oe_mg2.26.b: "协同闽粤水师会师长江口，海陆夹击中原"
