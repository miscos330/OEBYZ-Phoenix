 STATIC_MODIFIER_NAME_oe_yp_tier_loyal: "行省恭顺"
 STATIC_MODIFIER_DESC_oe_yp_tier_loyal: "行省长官与朝廷同心，地方钱粮兵员调发顺畅。"
 STATIC_MODIFIER_NAME_oe_yp_tier_lax: "行省懈怠"
 STATIC_MODIFIER_DESC_oe_yp_tier_lax: "行省长官敷衍朝命，地方征发拖延，钱粮短少。"
 STATIC_MODIFIER_NAME_oe_yp_tier_estranged: "行省离心"
 STATIC_MODIFIER_DESC_oe_yp_tier_estranged: "行省与朝廷离心离德，地方豪强各行其是，征发难以为继。"
 STATIC_MODIFIER_NAME_oe_yp_prof_wealth_t2: "财赋漕运省·如常"
 STATIC_MODIFIER_DESC_oe_yp_prof_wealth_t2: "江浙与江西行省漕运通畅、市舶商税井然有序。"
 STATIC_MODIFIER_NAME_oe_yp_prof_wealth_t3: "财赋漕运省·恭顺"
 STATIC_MODIFIER_DESC_oe_yp_prof_wealth_t3: "行省全力配合朝廷转漕督税，江南丝瓷产销兴旺。"
 STATIC_MODIFIER_NAME_oe_yp_prof_front_t2: "中原兵冲省·如常"
 STATIC_MODIFIER_DESC_oe_yp_prof_front_t2: "河南与湖广行省兼顾军粮屯备与兵员征发，拱卫中原要冲。"
 STATIC_MODIFIER_NAME_oe_yp_prof_front_t3: "中原兵冲省·恭顺"
 STATIC_MODIFIER_DESC_oe_yp_prof_front_t3: "行省忠顺用命，中原兵源充沛、城防坚固、控御严密。"
 STATIC_MODIFIER_NAME_oe_yp_prof_fortress_t2: "关蜀天府省·如常"
 STATIC_MODIFIER_DESC_oe_yp_prof_fortress_t2: "陕西与四川行省凭山川关隘稳守天府粮道。"
 STATIC_MODIFIER_NAME_oe_yp_prof_fortress_t3: "关蜀天府省·恭顺"
 STATIC_MODIFIER_DESC_oe_yp_prof_fortress_t3: "关蜀险隘固若金汤，行省竭力向朝廷输送精壮兵员。"
 STATIC_MODIFIER_NAME_oe_yp_prof_frontier_t2: "三边铁骑省·如常"
 STATIC_MODIFIER_DESC_oe_yp_prof_frontier_t2: "三边行省维护漠北与河西站赤驿路，保障边军补给。"
 STATIC_MODIFIER_NAME_oe_yp_prof_frontier_t3: "三边铁骑省·恭顺"
 STATIC_MODIFIER_DESC_oe_yp_prof_frontier_t3: "站赤畅达、边防稳固，三边行省成为大元北疆铁壁。"
 STATIC_MODIFIER_NAME_oe_yp_warlordism_loc_mod: "藩镇权重坐大"
 STATIC_MODIFIER_DESC_oe_yp_warlordism_loc_mod: "行省平章与地方将帅拥兵自重，截留赋税，朝廷控御大减。"
 STATIC_MODIFIER_NAME_oe_yp_shumiyuan_empowered_mod: "行枢密分院便宜行事"
 STATIC_MODIFIER_DESC_oe_yp_shumiyuan_empowered_mod: "朝廷授行省战时军政全权，就地镇抚并大幅扩充本地征召。"
 STATIC_MODIFIER_NAME_oe_yp_censorate_mod: "行御史台按察澄肃"
 STATIC_MODIFIER_DESC_oe_yp_censorate_mod: "行御史台巡察地方、弹劾贪墨，整肃吏治并提振本地税产。"
 STATIC_MODIFIER_NAME_oe_yp_sansi_reformed_mod: "行省改设三司分权"
 STATIC_MODIFIER_DESC_oe_yp_sansi_reformed_mod: "承宣布政、提刑按察与都指挥三司各司其职，永绝藩镇割据之患。"
 STATIC_MODIFIER_NAME_oe_yp_ev31_jialu_dike_mod: "贾鲁治河新堤"
 STATIC_MODIFIER_DESC_oe_yp_ev31_jialu_dike_mod: "黄河故道复通、新堤合龙，黄淮沃野重归耕作。"
 STATIC_MODIFIER_NAME_oe_yp_ev31_militia_mod: "河南义兵团练"
 STATIC_MODIFIER_DESC_oe_yp_ev31_militia_mod: "河南乡勇义兵就地团练，协守汴梁与黄淮防线。"
 STATIC_MODIFIER_NAME_oe_yp_ev32_river_forts_mod: "湖广长江江防堡垒"
 STATIC_MODIFIER_DESC_oe_yp_ev32_river_forts_mod: "武昌、岳州沿江堡垒加固，扼守长江中游水陆咽喉。"
 STATIC_MODIFIER_NAME_oe_yp_ev33_porcelain_mod: "浮梁磁局官窑兴盛"
 STATIC_MODIFIER_DESC_oe_yp_ev33_porcelain_mod: "景德镇官窑扩产，青花与白瓷畅销海内外。"
 STATIC_MODIFIER_NAME_oe_yp_ev34_censor_ctrl_mod: "关中宣慰分权"
 STATIC_MODIFIER_DESC_oe_yp_ev34_censor_ctrl_mod: "行御史台与钦差制衡关中诸将，朝廷威令重达三秦。"
 STATIC_MODIFIER_NAME_oe_yp_ev34_four_generals_mod: "关中四将驻屯"
 STATIC_MODIFIER_DESC_oe_yp_ev34_four_generals_mod: "关中诸将扩充兵马、固守潼关与秦陇要道。"
 STATIC_MODIFIER_NAME_oe_yp_ev35_teamarse_mod: "雅州茶马互市"
 STATIC_MODIFIER_DESC_oe_yp_ev35_teamarse_mod: "川茶源源西运易马，打通巴蜀与吐蕃边贸补给线。"
 STATIC_MODIFIER_NAME_oe_yp_ev35_ba_shu_fort_mod: "剑阁瞿塘天险防务"
 STATIC_MODIFIER_DESC_oe_yp_ev35_ba_shu_fort_mod: "蜀道关隘与三峡江防整备严密，外敌难以窥蜀。"
 STATIC_MODIFIER_NAME_oe_yp_prof_frontier_t2_c: "三边铁骑省·边军常备"
 STATIC_MODIFIER_DESC_oe_yp_prof_frontier_t2_c: "边地行省常备精锐轻骑与站赤驿路，屏藩塞外。"
 STATIC_MODIFIER_NAME_oe_yp_prof_frontier_t3_c: "三边铁骑省·朔漠干城"
 STATIC_MODIFIER_DESC_oe_yp_prof_frontier_t3_c: "忠顺的边地行省广育精骑、速修站赤，是大元最锋利的塞外铁骑。"
 STATIC_MODIFIER_NAME_oe_yp_prof_yunnan_t2: "云南行省·西南藩屏"
 STATIC_MODIFIER_DESC_oe_yp_prof_yunnan_t2: "云南行省维系西南茶马商道与山地边防。"
 STATIC_MODIFIER_NAME_oe_yp_prof_yunnan_t3: "云南行省·南诏靖宁"
 STATIC_MODIFIER_DESC_oe_yp_prof_yunnan_t3: "梁王府与云南行省上下一心，西南商路畅通、边军精整。"
 STATIC_MODIFIER_NAME_oe_yp_prof_zhengdong_t2: "征东行省·东海协防"
 STATIC_MODIFIER_DESC_oe_yp_prof_zhengdong_t2: "征东行省协同大元维护东海航路与造船水师。"
 STATIC_MODIFIER_NAME_oe_yp_prof_zhengdong_t3: "征东行省·海东忠藩"
 STATIC_MODIFIER_DESC_oe_yp_prof_zhengdong_t3: "征东行省忠顺竭力，高丽海舶与济州战马源源协防东海。"
 STATIC_MODIFIER_NAME_oe_yp_overlord_yunnan_mod: "云南行省协赞西南"
 STATIC_MODIFIER_DESC_oe_yp_overlord_yunnan_mod: "恭顺的云南行省为大元巩固西南声望与茶马陆贸。"
 STATIC_MODIFIER_NAME_oe_yp_overlord_zhengdong_mod: "征东行省海防协赞"
 STATIC_MODIFIER_DESC_oe_yp_overlord_zhengdong_mod: "恭顺的征东行省以海舶战舰拱卫大元东海海疆。"
 STATIC_MODIFIER_NAME_oe_yp_high_warlordism_mod: "行省藩镇坐大"
 STATIC_MODIFIER_DESC_oe_yp_high_warlordism_mod: "该行省藩镇权重过高，尾大不掉，对朝廷调遣阳奉阴违。"
 STATIC_MODIFIER_NAME_oe_yp_shumiyuan_country_mod: "行枢密分院统军"
 STATIC_MODIFIER_DESC_oe_yp_shumiyuan_country_mod: "朝廷授以战时军政全权，边省兵员征发与城防能力显著增强。"
 STATIC_MODIFIER_NAME_oe_yp_censorate_country_mod: "行御史台巡察肃贪"
 STATIC_MODIFIER_DESC_oe_yp_censorate_country_mod: "行御史台巡按边省，清查账目、整肃官风。"
 STATIC_MODIFIER_NAME_oe_yp_sansi_reformed_country_mod: "边省三司分权改制"
 STATIC_MODIFIER_DESC_oe_yp_sansi_reformed_country_mod: "边省已完成布政、按察、都司三司分权，永除藩镇隐患。"
 STATIC_MODIFIER_NAME_oe_yp_ev30_navy_mod: "江浙海道清剿水师"
 STATIC_MODIFIER_DESC_oe_yp_ev30_navy_mod: "大元整编江浙水师护航漕道，海运商舶复归安宁。"
 STATIC_MODIFIER_NAME_oe_yp_ev32_dongting_fleet_mod: "洞庭长江水师"
 STATIC_MODIFIER_DESC_oe_yp_ev32_dongting_fleet_mod: "洞庭湖与长江中游战舰云集，大幅增强水路补给与江防战力。"
 STATIC_MODIFIER_NAME_oe_yp_ev35_chi_horses_mod: "川茶吐蕃良马"
 STATIC_MODIFIER_DESC_oe_yp_ev35_chi_horses_mod: "雅州茶马互市源源不断为大元骑兵补给西南骏马。"
 STATIC_MODIFIER_NAME_oe_yp_ev36_yam_post_mod: "漠北和林站赤重修"
 STATIC_MODIFIER_DESC_oe_yp_ev36_yam_post_mod: "驿道署优先铺通大都至和林站赤大路，漠北军驿畅通无阻。"
 STATIC_MODIFIER_NAME_oe_yp_ev36_remounts_mod: "岭北官牧战马"
 STATIC_MODIFIER_DESC_oe_yp_ev36_remounts_mod: "调发漠北官牧群马入京，大元精骑补给充沛。"
 STATIC_MODIFIER_NAME_oe_yp_ev36_pasture_mod: "漠北休牧减赋"
 STATIC_MODIFIER_DESC_oe_yp_ev36_pasture_mod: "朝廷蠲免岭北牧税，草原畜群与牧民丁口迅速休养生息。"
 STATIC_MODIFIER_NAME_oe_yp_ev37_jurchen_mod: "女真万户抚绥"
 STATIC_MODIFIER_DESC_oe_yp_ev37_jurchen_mod: "水达达与女真万户受印效命，充实辽东铁骑并畅通大宁驿路。"
 STATIC_MODIFIER_NAME_oe_yp_ev37_coast_mod: "辽东渤海海防"
 STATIC_MODIFIER_DESC_oe_yp_ev37_coast_mod: "辽东沿海卫所与海贸航道整备完备，拱卫京畿东翼。"
 STATIC_MODIFIER_NAME_oe_yp_ev38_silk_relay_mod: "河西丝路站赤"
 STATIC_MODIFIER_DESC_oe_yp_ev38_silk_relay_mod: "甘州、肃州丝路驿站修葺一新，西域商旅与官驿昼夜不绝。"
 STATIC_MODIFIER_NAME_oe_yp_ev38_hexi_guard_mod: "河西走廊联防"
 STATIC_MODIFIER_DESC_oe_yp_ev38_hexi_guard_mod: "甘肃行省与出伯诸王协防关隘，西陲固若金汤。"
 STATIC_MODIFIER_NAME_oe_yp_ev39_yunnan_accord_mod: "滇中梁段和衷"
 STATIC_MODIFIER_DESC_oe_yp_ev39_yunnan_accord_mod: "云南梁王府与大理段氏分掌军民、和衷共济，西南大治。"
 STATIC_MODIFIER_NAME_oe_yp_ev39_liang_command_mod: "梁王总领滇军"
 STATIC_MODIFIER_DESC_oe_yp_ev39_liang_command_mod: "梁王总揽云南兵马，西南驻军士气高昂、兵源充实。"
 STATIC_MODIFIER_NAME_oe_yp_ev40_jeju_horses_mod: "耽罗牧马与东海水师"
 STATIC_MODIFIER_DESC_oe_yp_ev40_jeju_horses_mod: "征东行省耽罗牧马场与高丽水师双双效力大元。"
 STATIC_MODIFIER_NAME_oe_yp_path_sansi_mod: "大元中兴体制：行省改三司"
 STATIC_MODIFIER_DESC_oe_yp_path_sansi_mod: "朝廷拆行省平章专权为布政、按察、都司三司分治，文治集权、国库丰盈。"
 STATIC_MODIFIER_NAME_oe_yp_path_cavalry_mod: "大元中兴体制：铁骑大行省"
 STATIC_MODIFIER_DESC_oe_yp_path_cavalry_mod: "朝廷存大行省军政一体之威，以漠北铁骑与诸省强藩雄视四海。"
 oe_yp.30.t: "江浙海运阻断与包运豪商"
 oe_yp.30.d: "浙东海盗与方国珍余党袭扰明州、温州海道，大都仰赖的江南海运漕粮屡屡受阻。江浙行省奏请或招抚沿海海商包运漕粮，或发水师清剿海道，或权且改由内河运河北运。"
 oe_yp.30.a: "招抚沿海豪商包运漕粮"
 oe_yp.30.b: "遣水师清剿浙东海道"
 oe_yp.30.c: "权由会通河与内河转漕"
 oe_yp.31.t: "河南江北贾鲁治河与义兵起复"
 oe_yp.31.d: "黄河于白茅决口，黄淮平原一片泽国，汴梁与大运河漕道皆受威胁。工部尚书贾鲁请征十余万民夫挽河归故道，然河南江北行省忧虑大役激起民变，另议缓役赈灾并就地团练义兵。"
 oe_yp.31.a: "全力支持贾鲁堵口挽河"
 oe_yp.31.b: "缓役赈灾，团练河南义兵"
 oe_yp.31.c: "令河南行省就地筹款自修"
 oe_yp.32.t: "湖广江防与洞庭水师整备"
 oe_yp.32.d: "湖广行省襟带长江与洞庭湖，南控岭表、北接荆襄。面对长江中游水匪与流民骚动，湖广平章奏请重修武昌、岳州江防堡垒，或扩编洞庭水师，亦可抽调荆襄精锐北援中原。"
 oe_yp.32.a: "加固武昌、岳州沿江堡垒"
 oe_yp.32.b: "扩编洞庭湖水师巡防长江"
 oe_yp.32.c: "抽调荆襄精锐北援中原"
 oe_yp.33.t: "江西景德镇官窑与盐引整顿"
 oe_yp.33.d: "浮梁景德镇青花瓷名扬四海，然江西私盐泛滥、盐引积弊亦深。江西行省上奏请拨款扩建浮梁磁局以广海贸财源，御史台则建言趁机清查私盐盐引、充实国库并抑止通胀。"
 oe_yp.33.a: "扩建浮梁磁局，兴办海贸官窑"
 oe_yp.33.b: "遣御史清查江西私盐与盐引"
 oe_yp.33.c: "酌减商税以安赣鄱豪商"
 oe_yp.34.t: "陕西关中四将拥兵掣肘"
 oe_yp.34.d: "关中兵事频仍，李思齐、张良弼等关陕诸将各自拥兵屯田、互争粮饷，陕西行省平章几难节制。若不早为筹划，三秦恐成尾大不掉之强藩。"
 oe_yp.34.a: "遣行御史台与钦差宣慰分权"
 oe_yp.34.b: "加封平章名号，许诸将自筹屯守"
 oe_yp.34.c: "降诏斥责并勒令裁兵归朝"
 oe_yp.35.t: "四川茶马互市与明夏边警"
 oe_yp.35.d: "巴蜀天府四塞险固，雅州茶马司以川茶易吐蕃战马，乃西南财赋与马政命脉；然三峡上游与重庆一带时有夏军与流寇窥伺。朝廷须在兴复茶马、加固剑阁瞿塘与调川粮东援之间权衡。"
 oe_yp.35.a: "振兴雅州茶马司，易马实骑"
 oe_yp.35.b: "重兵加固剑阁与瞿塘峡关隘"
 oe_yp.35.c: "调发川粮东济中原与京师"
 oe_yp.36.t: "岭北和林牧马与站赤大雪灾"
 oe_yp.36.d: "漠北连降暴雪，和林至上都沿线多处站赤驿马冻毙，岭北行省官牧马群亦损折惨重。若令驿道署优先铺通漠北干道并拨款赈济，可令站赤重焕生机；亦可征调官牧余马入京或减赋休牧。"
 oe_yp.36.a: "拨帑赈灾并令驿道署优先修通漠北站赤"
 oe_yp.36.b: "调发岭北官牧战马补齐京师铁骑"
 oe_yp.36.c: "蠲免岭北牧税，令草原休牧自救"
 oe_yp.37.t: "辽阳东道海防与女真万户抚绥"
 oe_yp.37.d: "辽阳行省北接黑水女真、东临高丽与渤海，兼制东道诸王。近来水达达与女真万户遣使赴大宁请领新印，渤海沿岸亦需整饬海防以防海寇北掠。"
 oe_yp.37.a: "敕封女真万户，兼修大宁驿路"
 oe_yp.37.b: "整饬辽东渤海海防与海贸航道"
 oe_yp.37.c: "委辽阳平章节制东道诸军"
 oe_yp.38.t: "甘肃河西丝路驿站与西域商队"
 oe_yp.38.d: "西域色目商队载玉石、良马与香料穿过玉门，齐聚甘州与肃州。甘肃行省奏请趁势整修河西站赤驿道，亦可抽分关市银税，或与河西西端诸王联手护商固边。"
 oe_yp.38.a: "整修甘州、肃州丝路站赤驿道"
 oe_yp.38.b: "抽分西域商队关市银税"
 oe_yp.38.c: "联结河西诸王共护丝路要冲"
 oe_yp.39.t: "云南梁王与大理段氏行省总管之争"
 oe_yp.39.d: "云南行省军政素由镇滇宗王与大理段氏世袭总管分掌。近来昆明王府与洱海段氏因赋役、土司调遣屡生龃龉，双双遣使大都请朝廷裁决。"
 oe_yp.39.a: "敕谕梁王与段氏分掌军民，以和为贵"
 oe_yp.39.b: "全权委任梁王总领云南军政"
 oe_yp.39.c: "遣中书省汉官参赞云南政务"
 oe_yp.40.t: "征东行省济州牧马与东海舰队协防"
 oe_yp.40.d: "征东行省耽罗（济州）水草丰美，乃大元海外官牧重地，高丽造船水师亦素称精良。朝廷可资助扩建耽罗牧马场并敕嘉高丽水师，亦可调发海船协运南粮，或减省岁贡以示怀柔。"
 oe_yp.40.a: "扩建耽罗牧马场并敕嘉高丽水师"
 oe_yp.40.b: "调发征东海船协运南粮北上"
 oe_yp.40.c: "减省征东行省岁贡以示怀柔"
 oe_yp.41.t: "御前大辩论：行省改三司与铁骑大行省"
 oe_yp.41.d: "大元历经大乱而中兴，中书省与枢密院围绕行省善后爆发御前大辩论：汉法文臣力主效法分权之制，拆行省平章专权为承宣布政、提刑按察、都指挥「三司」以永绝藩镇；怯薛勋贵与边将则力主保留大行省军政一体之威，以铁骑强藩震慑四海。"
 oe_yp.41.a: "行省改三司：文治分权，永绝藩镇"
 oe_yp.41.b: "铁骑大行省：军政一体，雄视四海"
 oe_yp_xingsheng: "行中书省"
 oe_yp_xingsheng_desc: "这个国家是[GetCountry('CHI').GetName]设在地方的行中书省。行省长官在治所设衙，代朝廷掌一方钱粮政务；辖区的土地、户口和军队仍归朝廷直辖。行省不能自行宣战，不参加战争，也不会加入独立战争。"
 LEAD_oe_yp_xingsheng: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_yp_xingsheng: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_yp_frontier: "边地行省"
 oe_yp_frontier_desc: "这个国家是[GetCountry('CHI').GetName]设在边地的行中书省，直接管辖辖区的土地和军队。它在地图上以宗主的颜色和名称显示，不能被吞并，不能自行宣战，随宗主参战，不会加入独立战争。"
 LEAD_oe_yp_frontier: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_yp_frontier: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_yp_xingsheng_subject: "行中书省"
 oe_yp_xingsheng_subject_desc: "这个国家是[GetCountry('CHI').GetName]的行中书省，只有治所衙署，辖区土地仍由朝廷直辖。"
 oe_yp_xingsheng_seat: "行中书省衙署"
 oe_yp_xingsheng_seat_desc: "行省长官的治所。向建筑所有者提供少量金币与人力，不削减当地的征召兵。"
 oe_yp_xingsheng_seat_maintain: "行省行政"
 oe_yp.1.t: "【测试】大元行省读数"
 oe_yp.1.d: "#T 忠诚目标的输入#!\n蒙汉对立强度 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_intensity').GetValue|2]（无变量时记 1）  伯颜权臣修正 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dictator').GetValue|0]  红巾局势进行中 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr').GetValue|0]  → 目标 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_target').GetValue|1]\n大元的行省附属 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_subjects').GetValue|0]（应为 6）  其中在中华朝贡体系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_in_mk').GetValue|0]  开局补设附属关系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_subject').GetValue|0]  补建衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_seat').GetValue|0]\n#T 各行省（存在：1 是大元的行省 −1 存在但不是 0 不存在；忠诚 −1 为无数据）#!（档位：3 恭顺 2 如常 1 懈怠 0 离心，−1 为无数据；外交容量 6×0.0+3×0.15=0.45）\n河南江北：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHN').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHN').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHN').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YHN').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHN').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_2').GetValue|0]（开局 240）\n江浙：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJZ').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJZ').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJZ').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YJZ').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJZ').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_3').GetValue|0]（开局 180）\n江西：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJX').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJX').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJX').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YJX').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJX').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_4').GetValue|0]（开局 135）\n湖广：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHG').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHG').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHG').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YHG').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHG').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_5').GetValue|0]（开局 198）\n陕西：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSX').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSX').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSX').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YSX').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSX').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_6').GetValue|0]（开局 133）\n四川：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSC').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSC').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSC').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YSC').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSC').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_7').GetValue|0]（开局 110）\n腹里（中书省直辖，不设行省）：带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_1').GetValue|0]（开局 409）\n#T 边地行省（有地附属；存在：1 是大元的边地行省）#!（档位：3 恭顺 2 如常 1 懈怠 0 离心，−1 为无数据；外交容量 6×0.0+3×0.15=0.45）\n岭北：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLB').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLB').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLB').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YLB').GetValue|0]  地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLB').GetValue|0]（开局 75）\n辽阳：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLY').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLY').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLY').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YLY').GetValue|0]  地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLY').GetValue|0]（开局 120）\n甘肃：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YGU').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YGU').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YGU').GetValue|0]  藩镇 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YGU').GetValue|0]  地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YGU').GetValue|0]（开局 37）\n大元的边地行省 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_subjects').GetValue|0]（应为 3）  其中在中华朝贡体系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_in_mk').GetValue|0]（应为 0）；和林、辽阳城留在大元直辖。\n#T 大元崩溃收尾（Y2）#!\n已解散 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved').GetValue|0]（0=未解散；原因：1=大元已不存在，2=红巾领袖取得大元国号，3=大元国号归于他国，4=中华朝贡体系已不存在，5=天命归于他国，6=国号改立（原版 .101、.105、flavor_chi.33），9=测试）  年份 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved_year').GetValue|0]\n现在判定已崩溃 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fallen_now').GetValue|0]  大元仍是天命之主 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_mk_chi').GetValue|0]  大元仍持大元国号 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yuan_chi').GetValue|0]  红巾新王朝标记 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_chi_new').GetValue|0]  北元存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yua').GetValue|0]  原版红巾 .42 已触发 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr42').GetValue|0]\n各行省收尾（0=未收尾，1=治所失守，2=不再是大元的附属，3=行省国已不存在，4=原版事件（辽阳 .42），5=大元崩溃，9=测试）：河南江北 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u2').GetValue|0]  江浙 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u3').GetValue|0]  江西 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u4').GetValue|0]  湖广 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u5').GetValue|0]  陕西 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u6').GetValue|0]  四川 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u7').GetValue|0]  岭北 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u8').GetValue|0]  辽阳 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u9').GetValue|0]  甘肃 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u10').GetValue|0]\n十个单位辖区内仍带行省标记或档位修正的地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_marked').GetValue|0]（解散后应为 0）"
