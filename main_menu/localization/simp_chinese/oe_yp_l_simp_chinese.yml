 oe_yp.1.d: "#T 忠诚目标的输入#!\n蒙汉对立强度 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_intensity').GetValue|2]（无变量时记 1）  伯颜权臣修正 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dictator').GetValue|0]  红巾局势进行中 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr').GetValue|0]  → 目标 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_target').GetValue|1]\n大元的行省附属 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_subjects').GetValue|0]（应为 6）  其中在中华朝贡体系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_in_mk').GetValue|0]  开局补设附属关系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_subject').GetValue|0]  补建衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_seat').GetValue|0]\n#T 各行省（存在：1 是大元的行省 −1 存在但不是 0 不存在；忠诚 −1 为无数据）#!\n河南江北：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHN').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHN').GetValue|1]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHN').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_2').GetValue|0]（开局 240）\n江浙：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJZ').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJZ').GetValue|1]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJZ').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_3').GetValue|0]（开局 180）\n江西：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJX').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJX').GetValue|1]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJX').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_4').GetValue|0]（开局 135）\n湖广：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHG').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHG').GetValue|1]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHG').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_5').GetValue|0]（开局 198）\n陕西：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSX').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSX').GetValue|1]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSX').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_6').GetValue|0]（开局 133）\n四川：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSC').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSC').GetValue|1]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSC').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_7').GetValue|0]（开局 110）\n腹里（中书省直辖，不设行省）：带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_1').GetValue|0]（开局 409）"
