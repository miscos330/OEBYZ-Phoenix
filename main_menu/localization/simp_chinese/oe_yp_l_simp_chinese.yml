 oe_yp_xingsheng: "行中书省"
 oe_yp_xingsheng_desc: "这个国家是[GetCountry('CHI').GetName]设在地方的行中书省。行省长官在治所设衙，代朝廷掌一方钱粮政务；辖区的土地、户口和军队仍归朝廷直辖。行省不能自行宣战，不参加战争，也不会加入独立战争。"
 LEAD_oe_yp_xingsheng: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_yp_xingsheng: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_yp_frontier: "边地行省"
 oe_yp_frontier_desc: "这个国家是[GetCountry('CHI').GetName]设在边地的行中书省，直接管辖辖区的土地和军队。它在地图上以宗主的颜色和名称显示，不能被吞并，不能自行宣战，随宗主参战，不会加入独立战争。"
 LEAD_oe_yp_frontier: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_yp_frontier: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_yp_xingsheng_subject: "行中书省"
 oe_yp_xingsheng_subject_desc: "这个国家是[GetCountry('CHI').GetName]的行中书省，只有治所衙署，辖区土地仍由朝廷直辖。"
 oe_yp_xingsheng_seat: "行中书省衙署"
 oe_yp_xingsheng_seat_desc: "行省长官的治所。向建筑所有者提供少量金币与人力，不削减当地的征召兵。"
 oe_yp_xingsheng_seat_maintain: "行省行政"
 oe_yp.1.t: "【测试】大元行省读数"
 oe_yp.1.d: "#T 忠诚目标的输入#!\n蒙汉对立强度 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_intensity').GetValue|2]（无变量时记 1）  伯颜权臣修正 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dictator').GetValue|0]  红巾局势进行中 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr').GetValue|0]  → 目标 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_target').GetValue|1]\n大元的行省附属 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_subjects').GetValue|0]（应为 6）  其中在中华朝贡体系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_in_mk').GetValue|0]  开局补设附属关系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_subject').GetValue|0]  补建衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_seat').GetValue|0]\n#T 各行省（存在：1 是大元的行省 −1 存在但不是 0 不存在；忠诚 −1 为无数据）#!（档位：3 恭顺 2 如常 1 懈怠 0 离心，−1 为无数据）\n河南江北：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHN').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHN').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHN').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHN').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_2').GetValue|0]（开局 240）\n江浙：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJZ').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJZ').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJZ').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJZ').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_3').GetValue|0]（开局 180）\n江西：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJX').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJX').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJX').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJX').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_4').GetValue|0]（开局 135）\n湖广：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHG').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHG').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHG').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHG').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_5').GetValue|0]（开局 198）\n陕西：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSX').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSX').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSX').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSX').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_6').GetValue|0]（开局 133）\n四川：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSC').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSC').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSC').GetValue|0]  衙署 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSC').GetValue|0]  带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_7').GetValue|0]（开局 110）\n腹里（中书省直辖，不设行省）：带本单位变量的大元地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_1').GetValue|0]（开局 409）\n#T 边地行省（有地附属；存在：1 是大元的边地行省）#!（档位：3 恭顺 2 如常 1 懈怠 0 离心，−1 为无数据）\n岭北：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLB').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLB').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLB').GetValue|0]  地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLB').GetValue|0]（开局 75）\n辽阳：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLY').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLY').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLY').GetValue|0]  地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLY').GetValue|0]（开局 120）\n甘肃：存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YGU').GetValue|0]  忠诚 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YGU').GetValue|1]  档位 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YGU').GetValue|0]  地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YGU').GetValue|0]（开局 37）\n大元的边地行省 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_subjects').GetValue|0]（应为 3）  其中在中华朝贡体系 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_in_mk').GetValue|0]（应为 0）；和林、辽阳城留在大元直辖。\n#T 大元崩溃收尾（Y2）#!\n已解散 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved').GetValue|0]（0=未解散；原因：1=大元已不存在，2=红巾领袖取得大元国号，3=大元国号归于他国，4=中华朝贡体系已不存在，5=天命归于他国，6=国号改立（原版 .101、.105、flavor_chi.33），9=测试）  年份 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved_year').GetValue|0]\n现在判定已崩溃 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fallen_now').GetValue|0]  大元仍是天命之主 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_mk_chi').GetValue|0]  大元仍持大元国号 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yuan_chi').GetValue|0]  红巾新王朝标记 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_chi_new').GetValue|0]  北元存在 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yua').GetValue|0]  原版红巾 .42 已触发 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr42').GetValue|0]\n各行省收尾（0=未收尾，1=治所失守，2=不再是大元的附属，3=行省国已不存在，4=原版事件（辽阳 .42），5=大元崩溃，9=测试）：河南江北 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u2').GetValue|0]  江浙 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u3').GetValue|0]  江西 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u4').GetValue|0]  湖广 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u5').GetValue|0]  陕西 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u6').GetValue|0]  四川 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u7').GetValue|0]  岭北 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u8').GetValue|0]  辽阳 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u9').GetValue|0]  甘肃 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u10').GetValue|0]\n十个单位辖区内仍带行省标记或档位修正的地点 [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_marked').GetValue|0]（解散后应为 0）"
 oe_yp.1.a: "关闭"
 oe_yp.1.b: "刷新读数"
 oe_yp_free_YLB: "岭北"
 oe_yp_free_YLY: "辽阳"
 oe_yp_free_YGU: "甘肃"
