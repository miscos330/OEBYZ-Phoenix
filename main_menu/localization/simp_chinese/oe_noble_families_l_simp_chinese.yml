 OE_NF_INFLUENCE_TT_1: "#bold #Y 家族影响力#!#!\n当前：#G [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('oe_nf_influence_1').GetValue|2]#! / 1000\n最近核算的每月净变动：[InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('oe_nf_monthly_1').GetValue|2]\n\n每月固定−2；政治盟友额外+1；收回豪族特权后额外−1；完成重整官制前额外+2；每名在东罗马内阁任职者+1；每个有效琼筵序次席位+1.5；每名指挥东罗马陆军或舰队的家族成员+0.25。每名军区君主+1；每名统治至少一个有地国家的家族成员+1；每处控制地点+0.1。奥斯马里斯家族额外获得奥斯曼公司每个已完工等级+0.2（君士坦丁堡须属东罗马）。\n家族成员率领东罗马军队获胜+10；家主去世−50；每名家族成员结婚+5。影响力下限0，上限1000。"
 oe_nf_dynasty_1: "豪族第1席：家族"
