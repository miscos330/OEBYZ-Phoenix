l_simp_chinese:
 oe_nf_promote_house: "拔擢世家"
 oe_nf_promote_house_desc: "一纸诏命，足以使累世积望之家跻身朝廷显贵。择其家声与子弟而拔擢之，使皇座之下再添一门世家。\n\n豪族数量低于上限时，消耗#Y 1权威#!，选择一个至少有#G 6名#!在世成员居住于东罗马、且尚未列为豪族的家族。新豪族影响力为#G 0#!。\n\n$OE_NF_SOVEREIGN_DYNASTY_RULE$"
 OE_NF_ROOM: "当前豪族数量低于豪族上限。"
 OE_NF_CANDIDATE: "存在尚未获封、且至少有6名在世成员居住于东罗马的家族。"
 OE_NF_AUTHORITY: "帝国柱石拥有至少#Y 1权威#!。"
 OE_NF_SELECT: "选择拟拔擢家族的代表"
 OE_NF_NONE: "@trigger_no! 没有符合条件的家族：须至少有6名在世成员居住于东罗马，且尚未列为豪族。"
 OE_NF_CAPACITY: "豪族 #G [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_nf_house_count')|0]#! / #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('oe_nf_house_limit').GetValue|0]#!"
 OE_NF_CAPACITY_TT: "开局豪族上限为3。家族绝嗣后移出名册，腾出名额；新豪族通过拔擢世家加入。"
 OE_NF_INFLUENCE: "影响力"
 OE_NF_INTERACT: "互动"
 OE_NF_INTERACT_TT: "展开该家族的互动行动。"
 OE_NF_NO_INTERACTIONS: "尚无可执行的家族互动。"
 OE_NF_EMPTY: "目前没有列入名册的豪族。"
 OE_NF_PROMOTE_HINT: "须有空余名额，且所选家族至少有6名在世成员居住于东罗马。消耗#Y 1权威#!。"
