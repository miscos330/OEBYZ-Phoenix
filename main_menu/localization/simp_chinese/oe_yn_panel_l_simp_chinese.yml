 OE_YN_BTN_P_SHUMIYUAN: "行枢密"
 OE_YN_BTN_P_SHUMIYUAN_DESC: "授该省平章战时便宜行事（#Y 5 年冷却#!）。\n效果：本省控制度 #G +10%#!，5 年本地征召 #G +25%#!、城防与镇抚增强。\n代价：该省藩镇权重 #R +18#!。"
 OE_YN_BTN_P_CENSORATE: "御史台"
 OE_YN_BTN_P_CENSORATE_DESC: "遣行御史台按察巡省（耗 #Y 25 金#!，#Y 5 年冷却#!）。\n效果：该省藩镇权重 #G -20#!、忠诚 #G +10#!，5 年反腐税产 #G +8%#!，全国通胀 #G -0.5%#!。"
 OE_YN_BTN_P_REQUISITION: "括漕盐"
 OE_YN_BTN_P_REQUISITION_DESC: "向该省括调漕粮与专征盐课（#Y 4 年冷却#!）。\n效果：大元立得 #G 1.5 月收入金币#!（40-220）且大都省粮 #G +250#!；若括调江浙/江西，还能在后续「协饷屯」时触发移南补北返金（#G +15 金#!）。\n代价：该省忠诚 #R -12#!、藩镇权重 #R +5#!。"
 OE_YN_BTN_P_STIPEND: "协饷屯"
 OE_YN_BTN_P_STIPEND_DESC: "中书省向该省拨发和籴协饷与边屯军粮（耗 #Y 50 金#!，若江浙/江西正行漕盐括调则实耗 #G 35 金#!，#Y 4 年冷却#!）。\n效果：该省立得 #G +100 金#!、#G +0.5 人力#!、忠诚 #G +10#!、藩镇权重 #G -6#!，并获 5 年「足食足兵」（军费维护 #G +25%#!、补员 #G +20%#!、粮耗 #G -20%#!）；有地行省首府额外 #G +180 省粮#!。\n边地行省（岭北/辽阳/甘肃）累计拨饷 #Y 2 次#!后将永久建成「永业军屯」，并反哺大元北疆补给与骑兵征募！"
 OE_YN_BTN_P_SANSI: "改三司"
 OE_YN_BTN_P_SANSI_DESC: "拆平章专权为布政、按察、都指挥三司分权（需大元中兴开启或御前大辩论解锁，该省忠诚 #Y >=75#!、藩镇权重 #Y <=25#!，每省一次）。\n效果：永久锁定该省藩镇权重为 #G 0#!，并永久授予三司分权加成（最大控制力 #G +8%#!、税产 #G +10%#!、征召 #G +10%#!）。"
 OE_YN_BTN_W_SEAL: "赐金印"
 OE_YN_BTN_W_SEAL_DESC: "颁赐金印与礼诰抚慰该宗王（耗 #Y 35 金#!、#Y 5 威望#!，#Y 3 年冷却#!）。\n效果：该宗王忠诚 #G +15#!，对大元好感 #G +25#!。"
 OE_YN_BTN_W_BANNER: "虎符勤王"
 OE_YN_BTN_W_BANNER_DESC: "持虎符诏征该宗王铁骑勤王（需忠诚 #Y >=65#! 且宗王人力 #Y >=800#!，耗大元 #Y 40 金#! 与宗王真实人力 #Y -800#!，#Y 5 年冷却#!）。\n效果：在大都或前线调出 #G 2 支编制蒙古宗王铁骑#!（1 轻骑 + 1 重骑）助战，该王忠诚微降 #R -4#!。"
 OE_YN_BTN_W_COMMUTE: "折钞改土"
 OE_YN_BTN_W_COMMUTE_DESC: "将该投下宗王折钞核籍、和平改隶普通附庸（需大元中兴开启或 #Y 1400 年后#!，且该宗王忠诚 #Y >=75#!）。\n效果：彻底清除投下宗王标记（永不再吃年度岁赐），改隶附庸并获 20 年改制过渡加成。"
