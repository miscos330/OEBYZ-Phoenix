 MAPMODE_OE_YN_TIERS: "#T $mapmode_oe_yn_tiers_name$#!\n大元各行省的辖区按忠诚档位着色：恭顺绿，如常沙色，懈怠橙，离心红。\n在册藩王的领地按档位着色：恭顺蓝，如常灰蓝，怠慢紫，离心暗紫。\n大元其余直辖地为石色，其余地方为暗灰。"
