 oe_yn_sup_steady: "粮饷稳健"
 OE_YN_SUPPLY_TT: "该行省当前粮饷与驻军健康状态：\n#G 永业军屯#!：边地行省已完成两次协饷屯田，永久享寒地军屯产粮与铁骑加成。\n#G 足食足兵#!：正受中书省协饷补给（5 年军费维护、补员与省粮加成）。\n#Y 行枢戒严#!：已授战时行枢密院，驻军扩编并参战协防。\n#R 边饷吃紧#!：行省国库低于 30 金，建议点击「协饷屯」输血保兵。\n#R 藩镇尾大#!：藩镇权重 >=60，建议遣「御史台」按察压降。"
 OE_YN_COL_PRINCE: "藩王"
 OE_YN_COL_TITLE: "王号"
 OE_YN_COL_PAID: "岁赐"
 OE_YN_COL_ATT: "来朝"
 OE_YN_ROLE_TT: "大元五大地域治理画像：财赋漕运（江浙/江西）、中原兵冲（河南/湖广）、关蜀天府（陕西/四川）、三边铁骑（岭北/辽阳/甘肃，直连驿道署站赤）及云南/征东特省。"
 OE_YN_LOY_TT: "行省的独立忠诚（#Y 0#!到#Y 100#!），按本省失地比例、藩镇权重与地域事件独立运算；#Y -1#!表示尚未初始化。"
 OE_YN_WL_TT: "藩镇权重（#Y 0#!到#Y 100#!）。战时行枢密放权会推高权重，遣御史台按察可压低权重；达到 #R >=60#! 将触发藩镇坐大减益与兵变风险；改制三司后永久锁为 #G 0#!。"
 OE_YN_PTIER_TT: "恭顺（>=70）：触发所属地域高阶加成（财赋产税/兵冲征召/关蜀城防/三边铁骑/特省协防）。\n如常（40-69）：触发所属地域常态实效加成（不再为空壳）。\n懈怠（20-39）：征召规模 #R -10%#!，最大控制力 #R -5%#!。\n离心（<20）：征召规模 #R -20%#!，最大控制力 #R -10%#!。"
 OE_YN_WLOY_TT: "藩王的忠诚（#Y 0#!到#Y 100#!）；保有其中原五户丝食邑可提升忠诚目标并直接抵扣岁赐现金。"
 OE_YN_WTIER_TT: "恭顺（>=70）：宗王获骑战/人力/补给加成，且每位忠顺王为大元叠加 #G +1.5% 骑战 / +2% 人力#!（最高 10 叠）。\n如常（40-69）：小幅减益。\n离心（<40）：大幅忠诚与商税减益，且低平乱之势下可能触发索赐危机。"
 OE_YN_PAID_TT: "最近一次领到岁赐的年份；#Y 0#!表示还没有领过。"
 OE_YN_ATT_TT: "最近一次到上都库里台朝会的年份；#Y 0#!表示还没有来过。"
