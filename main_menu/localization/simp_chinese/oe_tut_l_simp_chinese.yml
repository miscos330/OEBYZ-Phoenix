 oe_tut_btn_finish: "完成研习"
 oe_tut_chain_roman_themes: "拜占庭军区2.0、总督区与帝国四大支柱"
 oe_tut_lesson_roman_themes: "拜占庭军区2.0、总督区与帝国四大支柱"
 oe_tut_step_roman_1: "军区2.0与行省治理体系"
 oe_tut_step_roman_1_desc: "拜占庭军区2.0将边防卫戍与地方财政融为一体。合理划分边疆军区、内陆军区、意大利军区与海防军区，可在地方征召兵力与中枢控制力之间取得稳固平衡。\n\n通过政府与属国面板持续关注各军区督军的忠诚度与自治度，既能让军区大军驰援四方，又可防止帝国腹心离心割据。"
 oe_tut_step_roman_2: "总督区、近卫大区与特殊属国保护"
 oe_tut_step_roman_2_desc: "当帝国版图横跨地中海乃至远洋航路时，可借助总督区与近卫大区体系延伸首都政令距离，有效抑制帝国熵增与疆域超载。\n\n帝国军区、特许银行与贵族封邸等特殊历史属国均受保护，不会被常规属国类型转换误伤，确保专属机制长期稳定运转。"
 oe_tut_step_roman_3: "帝国四大支柱与强势复兴命运线"
 oe_tut_step_roman_3_desc: "统筹元老院、帝国常备军、国库财政与大牧首区四大支柱，可在各个纪元解锁关键改革。严格的纪元科技锁确保近代常备军与火器兵种随真实科技演进而逐步成型，绝不提前穿帮。\n\n沿着拜占庭五大战略方向推进命运任务树，重现罗马荣光，并在1836年终极编年史中铭刻千秋伟业。"
 oe_tut_chain_celestial_mandate: "天命秩序、行省体系与大都护府"
 oe_tut_lesson_celestial_mandate: "天命秩序、行省体系与大都护府"
 oe_tut_step_celestial_1: "大元、大明与大清天命格局"
 oe_tut_step_celestial_1_desc: "自1337年起，中原王朝国际组织维系着东亚的朝贡网络、皇权威望与天命正统。无论是在红巾风暴中实现大元中兴、开创大明远洋盛世，还是以女真八旗定鼎大清，天命经营皆为核心命脉。\n\n善用本土文明议会（大元忽里勒台与六部廷议），凝聚阶层支持以推行财政、军制与治水大策。"
 oe_tut_step_celestial_2: "行中书省与边疆行省保护机制"
 oe_tut_step_celestial_2_desc: "大元开局设有辽阳、岭北、甘肃等专属边疆行省，忠实再现蒙元帝国行中书省镇守朔漠与辽东的历史制度。\n\n专属属国保护机制确保上述边疆行省维持固有体制不被误改；一旦中原局势生变，亦保障和林北归之路畅通无阻。"
 oe_tut_step_celestial_3: "大都护府、宣慰司与宗藩朝贡体系"
 oe_tut_step_celestial_3_desc: "面向西域、漠北与西南边陲，可设立大都护府、宣慰司与世袭土司，将天朝礼治与军政威慑辐射四方。\n\n统筹陆上丝路商道、刺桐远洋海贸与常平仓跨市购粮救荒，从容应对小冰期严寒，引领东亚迈入近代工业浪潮。"
 oe_tut_chain_steppe_nomads: "草原汗国与33个游牧军国存续革新"
 oe_tut_lesson_steppe_nomads: "草原汗国与33个游牧军国存续革新"
 oe_tut_step_steppe_1: "术赤兀鲁思、察合台与33个游牧军国"
 oe_tut_step_steppe_1_desc: "从伏尔加河畔直至白山黑水，欧亚大草原上33个开局军队型游牧政权各自拥有独特的游牧与军事节律，尤以术赤兀鲁思、察合台汗国、瓦剌四部与伊利汗国诸继承汗廷为翘楚。\n\n通过忽里勒台大会维系各翼封汗与汗廷凝聚度，方能令兀鲁思诸部齐心听命、驰骋欧亚。"
 oe_tut_step_steppe_2: "白灾寒冬护栏与小冰期韧性"
 oe_tut_step_steppe_2_desc: "草原白灾与十七世纪小冰期极易重创游牧补给线。全图所有有地军队型游牧国家均享有季节性畜群防崩护栏，既避免AI游牧政权无故饿毙破产，又保留真实寒冬损耗挑战。\n\n在漫长严冬封冻北疆之际，注意储备国库资金、控制河谷牧场并善用市集购粮，即可化险为夷。"
 oe_tut_step_steppe_3: "双轨演进：永恒草原与定居火器帝国"
 oe_tut_step_steppe_3_desc: "自1450年起，强盛游牧汗国将迎来历史十字路口：选择「永恒草原」路线，可进一步强化精锐骑兵机动、掠夺补给与严寒作战优势；\n\n亦可走上「定居转型」之路，平稳由军队型国家转为领土君主制国家，全面拥抱近代火炮、工坊制造与官僚制度。"
 oe_tut_chain_economy_qol: "战略商品、五大运河、六大地图模式与便利助手"
 oe_tut_lesson_economy_qol: "战略商品、五大运河、六大地图模式与便利助手"
 oe_tut_step_econ_1: "战略商品链、银行业阶层与人口晋升"
 oe_tut_step_econ_1_desc: "借助战略商品突破、哥伦布大交换高产作物（马铃薯、玉米）以及依托实体建筑型商行与银行阶层的信贷体系，为中后期财政与工业腾飞注入强劲动能。\n\n城镇设施与运河枢纽将推动底层农民向市民与工业劳工流动晋升，持续拓宽国家税基与识字率。"
 oe_tut_step_econ_2: "五大跨洲运河工程与中后期局势联动"
 oe_tut_step_econ_2_desc: "筹资兴建苏伊士、巴拿马、基尔、科林斯与京杭大运河重修五大洲际运河奇观，彻底重塑全球海运航路并获得永久枢纽加成。\n\n跨欧亚局势桥梁将托尔德西里亚斯条约、海盗黄金时代与大革命浪潮与全图强权有机联动，贯通大西洋至东海。"
 oe_tut_step_econ_3: "6种定制地图模式、15列账簿与可选便利助手"
 oe_tut_step_econ_3_desc: "随时切换6种零覆盖定制地图模式（帝国熵增、运河与铁道动脉、霸权势力圈、气候与粮荒、命运进度、宗藩网络）并查阅15列专属国家账簿统计，一屏洞察天下大势。\n\n可按需启用皇室联姻、驰道铺设、仓储救荒与要塞整备等全可选玩家便利助手，零AI性能负担且随时可控。"
 oe_tut_dec_open_phoenix_handbook.title: "翻阅《凤凰终极典籍》全系统指南"
 oe_tut_dec_open_phoenix_handbook.desc: "开启交互式终极版全系统指南，涵盖拜占庭军区2.0与四大支柱、天命行省与大都护府、33个草原游牧军国、战略商品与五大洲际运河、6大定制地图模式、15列账簿及可选便利助手。"
 oe_tut_dec_open_phoenix_handbook.a: "展开凤凰终极指南中枢"
 oe_tut.1.t: "典籍卷一·拜占庭军区与支柱"
 oe_tut.1.desc: "帝国执政官已编纂完备的罗马行省经略要义：统筹边疆、内陆、意大利与海防四大军区，设立总督区与近卫大区以平抑帝国熵增，并在五百年历程中调和元老院、军队、国库与牧首四大支柱。"
 oe_tut.1.a: "启动拜占庭军区交互式引导"
 oe_tut.1.b: "仅将兵略典籍藏入皇家书阁"
 oe_tut.2.t: "典籍卷二·天命秩序与行省"
 oe_tut.2.desc: "中书省翰林呈献东亚经世全书：纵览大元、大明与大清天命更迭，维系辽阳、岭北、甘肃边疆行省专属体制，召集群臣共议本土文明议会，并借大都护府、宣慰司与土司怀柔四裔。"
 oe_tut.2.a: "启动天命秩序交互式引导"
 oe_tut.2.b: "仅将经世典章存藏内阁"
 oe_tut.3.t: "典籍卷三·草原汗廷与游牧"
 oe_tut.3.desc: "术赤兀鲁思、察合台、瓦剌与伊利汗国史官合编草原兵书：以忽里勒台凝聚五翼封汗，依托畜群护栏抵御白灾与小冰期寒潮，并在1450年后于「永恒草原」与「定居火器帝国」之间抉择国运。"
 oe_tut.3.a: "启动草原游牧交互式引导"
 oe_tut.3.b: "仅向诸部宣读草原经略宝典"
 oe_tut.4.t: "典籍卷四·战略商品与运河"
 oe_tut.4.desc: "御用舆图师与大司农合呈经济与界面全览：善用银行阶层信贷与高产新粮，开凿苏伊士、巴拿马、基尔、科林斯与京杭五大运河，调用6种定制地图模式与15列专属国家账簿，并按需开启零AI负担的可选玩家便利助手。"
 oe_tut.4.a: "启动经济运河与便利助手交互式引导"
 oe_tut.4.b: "仅将全图颁行各部院"
 oe_tut.5.t: "五百年终极盛世编年史"
 oe_tut.5.desc: "自1337年风雨飘摇的黎明行至1836年近代纪元的门槛，整整五个波澜壮阔的世纪已在旌旗之下铸就史诗。王朝兴替、运河通海、疫病与小冰期严寒轮番考验国库仓储，东西列强在欧亚大陆与大洋航路纵横博弈。\n\n今日，皇家史官将合上终极编年史的最后一卷鎏金典册。后世当如何铭记[ROOT.GetCountry.GetName]的千秋勋业？"
 oe_tut.5.a: "以五百年不朽皇冠与赫赫武功垂范千秋"
 oe_tut.5.b: "以万世文教、通海运河与四海商贸泽被苍生"
 oe_tut.6.t: "五十五国天命殿堂盛典"
 oe_tut.6.desc: "纵贯地中海罗马、东方天朝、欧亚大草原、印度洋、欧陆列邦、非洲与美洲的五十五条宏伟命运之路中，唯有兼具雄略与韧性的国度方能成就历史天命、历经数百年考验而不倒。\n\n今日，天命殿堂的汉白玉石碑镌刻下[ROOT.GetCountry.GetName]的纹章，礼赞这一改写世界大势的不朽文明。"
 oe_tut.6.a: "将本朝尊号永镌天命殿堂"
 oe_tut.6.b: "遣使四方昭告欧亚协和"
 oe_tut.7.t: "《凤凰终极版》全系统指南"
 oe_tut.7.desc: "欢迎查阅《凤凰终极版》全系统典籍。您可随时从下方四大交互指南主题中任选一卷，查看核心机制精要并按需启动原生多步百科引导，全程零开局强制弹窗干扰。"
 oe_tut.7.a: "卷一：拜占庭军区2.0、总督区与四大支柱"
 oe_tut.7.b: "卷二：天命秩序、行中书省与大都护府"
 oe_tut.7.c: "卷三：草原汗国与33个游牧军国存续革新"
 oe_tut.7.d: "卷四：战略商品、五大运河、六大地图模式与便利助手"
 oe_tut.7.e: "暂且合卷退朝"
 oe_tut.90.t: "终极版实机引擎探针总览"
 oe_tut.90.desc: "#high 实机引擎探针实时读数（0=未运行，1及以上=通过，2=前提跳过，3=异常）：#!\n\n#Y P1 阶层私兵征募与解散：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p1').GetValue|0]\n#Y P2 银行阶层借贷与四大商行存续：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p2').GetValue|0]\n#Y P3 首都延冬切换与常平仓市集购粮：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p3').GetValue|0]\n#Y P4 王朝修正与城镇人口晋升：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p4').GetValue|0]\n#Y P5 原生国际组织决议与零改动原版IO：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p5').GetValue|0]\n#Y P6 地图模式、账簿、旗帜、便利助手与教程钩子：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p6').GetValue|0]\n#Y P7 跨世纪配乐与剧本纪元兼容：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p7').GetValue|0]\n#Y P8 五百年遥测与全局内核计数：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p8').GetValue|0] （月跳计数：[ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_gk_ticks').GetValue|0]，年跳计数：[ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_gk_years').GetValue|0]）\n#Y P9 纪元锁与边疆属国保护（1=1337干净锁定，2=发现时代后正常解锁）：#! [ROOT.GetCountry.MakeScope.GetVariable('oe_probe2_p9').GetValue|0]"
 oe_tut.90.a: "确认并关闭实机诊断读数"
 oe_tut.90.b: "一键重跑全部九项实机引擎探针（P1-P9）"
 STATIC_MODIFIER_NAME_oe_tut_mod_roman_handbook: "罗马军区兵略典籍"
 STATIC_MODIFIER_DESC_oe_tut_mod_roman_handbook: "系统汇编军区指挥、总督监理与帝国四大支柱制衡之法的御制典籍，令中枢控制与属邦向心稳步增强。"
 STATIC_MODIFIER_NAME_oe_tut_mod_celestial_handbook: "天朝经世典章录"
 STATIC_MODIFIER_DESC_oe_tut_mod_celestial_handbook: "详载行省治体、大都护府军政与宗藩礼制的经世典章，令王权威望、赋税效率与外交声誉同步精进。"
 STATIC_MODIFIER_NAME_oe_tut_mod_steppe_handbook: "大扎撒与草原经略宝典"
 STATIC_MODIFIER_DESC_oe_tut_mod_steppe_handbook: "凝练草原寒冬保畜、骑兵机动补给与忽里勒台军纪的经略宝典，显著提升全军士气、兵源与粮食储备。"
 STATIC_MODIFIER_NAME_oe_tut_mod_economy_handbook: "大运河与通商经略全图"
 STATIC_MODIFIER_DESC_oe_tut_mod_economy_handbook: "汇集战略商道、洲际运河船闸与财政大账册的经略全图，推动商贸收益、全国开发与学术研习并进。"
 STATIC_MODIFIER_NAME_oe_tut_mod_finale_1836_sovereign: "五世纪不朽皇冠（1337-1836）"
 STATIC_MODIFIER_DESC_oe_tut_mod_finale_1836_sovereign: "自中世纪暮色屹立至近代黎明，历经五百年沧桑巨变而国祚弥坚，帝国武功与威望永载史册。"
 STATIC_MODIFIER_NAME_oe_tut_mod_finale_1836_chronicle: "终极盛世文明编年史（1836）"
 STATIC_MODIFIER_DESC_oe_tut_mod_finale_1836_chronicle: "皇家档案馆、学宫与远洋商号共同铭记五百年来学术、航海与治国理政的辉煌篇章，文化辐射四海。"
 STATIC_MODIFIER_NAME_oe_tut_mod_hall_of_destinies: "名列五十五国天命殿堂"
 STATIC_MODIFIER_DESC_oe_tut_mod_hall_of_destinies: "在欧亚五十五条宏大历史命运之路中成就伟业，国家英名永镌天命殿堂，文化底蕴与外交威信倍增。"
 STATIC_MODIFIER_NAME_oe_tut_mod_phoenix_diplomacy_charter: "欧亚协和与外交法典"
 STATIC_MODIFIER_DESC_oe_tut_mod_phoenix_diplomacy_charter: "使节将本朝命运伟业遍传欧亚诸廷，全面强化外交承载、海上商路与宗藩纽带。"
