l_simp_chinese:
 OE_RAID_TURK_DEFENDED_DESC: "[target_location.GetName]的守军及时发觉了加齐的动向，在村民遭到抢掠以前将来犯者逼回边界。归来的巡逻队带回了平安的消息，乡间的道路仍由帝国看守。"
 OE_RAID_SER_DEFENDED_DESC: "塞尔维亚武装试图接近[target_location.GetName]，却迎头撞上了当地的巡逻队。守军守住渡口与道路，来犯者未能得手便退回边界。"
 OE_RAID_PIRATE_DEFENDED_DESC: "[target_location.GetName]的海岸哨所及时点起警讯，守军在登陆处击退了海盗。渔船与村落安然无恙，劫掠者只得重新登船逃走。"
 OE_RAID_BANDIT_DEFENDED_DESC: "[target_location.GetName]的守军循着商旅的报案展开搜捕，在乡间截住了匪徒。道路重新畅通，农户终于可以安心赶车往来。"
 OE_RAID_NO_LONGER_RELEVANT: "局势已变，撤回处置。"
 OE_RAID_NO_LONGER_RELEVANT_TT: "灾难已经结束或目标地点不再属于我国。本次事件不再产生开支或修正。"
