#=====================================
#BYZ
#=====================================

oe_byz_king_army_I_unlock: "宫廷卫队"
oe_byz_king_army_I_unlock_desc: "职责不限于安保，常承担外交押运、监军、秘密逮捕等特殊任务。"

oe_rr_start_sci_mil_I_advance: "鸦噙钳"
oe_rr_start_sci_mil_I_advance_desc: "#color_yellow 鸦噙钳#!能够准确夹住血管，结合针线技术，实现血管的精确缝合与循环闭合，从而有效止血。这种创新方法被称为钳夹止血法。"

oe_rr_start_sci_mil_II_advance: "土耳其弓"
oe_rr_start_sci_mil_II_advance_desc: "土耳其弓在马上射速极快（每分钟可达10-12箭）、无声、特别适合袭扰、侦察和草原游击战。直到16-17世纪部分欧洲轻骑兵（如匈牙利的哈杰杜士兵、波兰的哥萨克）仍坚持使用源自奥斯曼的复合弓。"

oe_rr_start_sci_mil_III_advance: "罗马军乐队"
oe_rr_start_sci_mil_III_advance_desc: "奥斯曼人组建了世界上最早的军乐队，让我们学习这一点，组建军乐队来确保士气高昂与有序行军"

oe_rr_start_sci_mil_IV_advance: "巨炮主义"
oe_rr_start_sci_mil_IV_advance_desc: "把巴比伦的城墙都掀起来！"

oe_rr_start_sci_mil_V_advance: "工兵装备"
oe_rr_start_sci_mil_V_advance_desc: "我们将向专门的工兵统一配发工程装备，以更好地满足土工作业需求"

oe_rr_start_sci_mil_VI_advance: "减少覆盖面积"
oe_rr_start_sci_mil_VI_advance_desc: "我们在研究后着手有计划地削减金属盔甲的保护面积，去掉受击概率较低的部位，进行重点防护，以保证军队的机动性"

oe_rr_start_sci_mil_VII_advance: "恐惧战术"
oe_rr_start_sci_mil_VII_advance_desc: "我们在与游牧民族的交手中受益颇多，通过不间断的袭扰，消磨和波次性进攻，对敌人心理施加巨大压力，以造成其崩溃"

oe_rr_start_sci_mil_VIII_advance: "现代化希腊火"
oe_rr_start_sci_mil_VIII_advance_desc: "希腊火是东罗马帝国发明的一种液态燃烧剂，主要用于海战，阿拉伯人称其为“希腊火”，罗马人则命名为“海洋之火”“流动之火”“液体火焰”等。 其基础成分为石油，混合硫磺等物质，可在水面持续燃烧且难以扑灭。"

oe_rr_start_sci_mil_IX_advance: "刺刀"
oe_rr_start_sci_mil_IX_advance_desc: "环形套筒套在枪口外部，通过卡榫或弹簧锁定。这是决定性创新，使火枪手能同时拥有火力和矛刺能力，最终淘汰了长矛兵。"

oe_rr_start_sci_mil_X_advance: "标准化火药"
oe_rr_start_sci_mil_X_advance_desc: "随着军事工业的进步，我国开始为士兵配发由纸包包成的统一标准的火药，士兵每次射击前不再需要手动估算火药的用量"

oe_rr_start_sci_mil_XI_advance: "御前参谋"
oe_rr_start_sci_mil_XI_advance_desc: "主要统帅身边开始出现专业化的幕僚团队，负责情报收集、地图绘制、行军路线规划、营地布局和工事设计。"

oe_rr_start_sci_mil_XII_advance: "专业化炮兵"
oe_rr_start_sci_mil_XII_advance_desc: "根据战场需要，我们的军队已经衍生出了加农炮，榴弹炮，臼炮等多种火炮，以及实心弹，霰弹，爆炸弹等炮弹"

oe_rr_start_sci_mil_XIII_advance: "膛线"
oe_rr_start_sci_mil_XIII_advance_desc: "膛线是枪械的灵魂，能够极大提高射击的精准度"

a_oe_byz_tur_heavy_cavalry_unlock: "吸纳罗姆骑兵"
a_oe_byz_tur_heavy_cavalry_unlock_desc: "罗姆人是优良的骑手，应该把他们吸纳进我们的军队"

a_oe_byz_albania_unlock: "阿尔巴尼亚征兵"
a_oe_byz_albania_unlock_desc: "阿尔巴尼亚人适应山地作战，在复杂的战场局势中可以作为特种部队使用"

a_oe_byz_renaissance_janissaries_unlock: "塔格玛塔近卫军"
a_oe_byz_renaissance_janissaries_unlock_desc: "塔格玛塔(τάγματα) 是营或团规模的军事单位，尤指东罗马皇帝君士坦丁五世组建的精锐军团，是8至11世纪帝国的中央军队"

a_oe_byz_discovery_janissaries_unlock: "塔格玛塔御林军"
a_oe_byz_discovery_janissaries_unlock_desc: "塔格玛塔(τάγματα) 是营或团规模的军事单位，尤指东罗马皇帝君士坦丁五世组建的精锐军团，是8至11世纪帝国的中央军队"

a_oe_byz_reformation_janissaries_unlock: "塔格玛塔火枪手"
a_oe_byz_reformation_janissaries_unlock_desc: "塔格玛塔(τάγματα) 是营或团规模的军事单位，尤指东罗马皇帝君士坦丁五世组建的精锐军团，是8至11世纪帝国的中央军队"

a_oe_byz_absolutism_janissaries_unlock: "塔格玛塔线列步兵"
a_oe_byz_absolutism_janissaries_unlock_desc: "塔格玛塔(τάγματα) 是营或团规模的军事单位，尤指东罗马皇帝君士坦丁五世组建的精锐军团，是8至11世纪帝国的中央军队"

a_oe_byz_revolutions_janissaries_unlock: "塔格玛塔纵队"
a_oe_byz_revolutions_janissaries_unlock_desc: "塔格玛塔(τάγματα) 是营或团规模的军事单位，尤指东罗马皇帝君士坦丁五世组建的精锐军团，是8至11世纪帝国的中央军队"

oe_byz_sci_unit_I_unlock: "开启军械革新"
oe_byz_sci_unit_I_unlock_desc: "我们将招募一个由帝国境内久负盛名的工程师与学者组成的军团，其负责从实战中获得经验，改进现有的军事装备"

oe_byz_rom_dream: "罗马之梦"
oe_byz_rom_dream_desc: "光复罗马帝国的版图是我国的最高理想，我们永远不会放弃这一点"

oe_byz_rom_rome: "西西里矿山"
oe_byz_rom_rome_desc: "西西里岛存在大量对我国有用的矿业，让我们好好利用这些资源"

oe_byz_rom_alexandria: "尼罗河粮仓"
oe_byz_rom_alexandria_desc: "在赶走了恬不知耻的穆斯林后，埃及的农业潜力将在罗马人细致的规划下再度得到充分发展"

oe_byz_rom_jeulus: "叙利亚十字路口"
oe_byz_rom_jeulus_desc: "叙利亚是五海三洲之地在地理意义上的中心，来自五湖四海的商栗都要经过这里"

oe_byz_rom_siwas: "流淌着奶与蜜的家园"
oe_byz_rom_siwas_desc: "安纳托利亚是我国最重要的资源产地与兵源地之一，重新夺回这里对我国而言就像犹太人发现了迦南"

oe_byz_rom_bghad: "新月沃地"
oe_byz_rom_bghad_desc: "两河流域物产丰饶，我国历史上曾数次征服这里"

oe_byz_rom_paris: "高卢红酒"
oe_byz_rom_paris_desc: "高卢人对红酒的研究确实颇有造诣，已经风靡我国的上流阶层"

oe_byz_rom_london: "不列颠煤矿"
oe_byz_rom_london_desc: "不列颠岛盛产煤矿，或许能派上用场"

oe_byz_rom_milan: "波河粮仓"
oe_byz_rom_milan_desc: "波河流域曾是罗马的传统粮仓，我们会再次确保这一点"

