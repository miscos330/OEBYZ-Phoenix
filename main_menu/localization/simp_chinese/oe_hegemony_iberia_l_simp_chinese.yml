l_simp_chinese:
 OE_HEG_END_CONTEST_REQUIRED: "已完成群雄逐鹿页面的“终结乱局”"
 OE_RW_IBERIA: "伊比利亚"
 OE_RW_IBERIA_DESC: "赫拉克勒斯之柱以西，古老的行省早已换过无数旗帜。山脉与河流仍横卧在旧地图上，来自君士坦丁堡的诏令，将再次越过西方的海峡。"
 OE_RW_IBERIA_OPEN: "查看伊比利亚行动"
 OE_RW_IBERIA_ACTIONS: "伊比利亚行动"
 OE_RW_IBERIA_HINT: "点击地图，在原地展开伊比利亚行动面板。"
 OE_RW_TOLEDO: "托莱多"
 OE_RW_TOLEDO_OWNER: "托莱多当前拥有者"
 OE_HEG_IBERIA_ACTIONS_HINT: "先筹划西征，再选择逐国索取战争借口，或向半岛诸国发动大规模入侵。普通入侵行动冷却三个月。"
 OE_HEG_IBERIA_PLAN_REQUIRED: "已完成“筹划入侵伊比利亚”"
 OE_HEG_IBERIA_NO_ACTIVE_CAMPAIGN: "上一场大规模入侵涉及的目标国已全部结束与东罗马的本次战争"
 oe_heg_plan_iberia: "筹划入侵伊比利亚"
 oe_heg_plan_iberia_desc: "御前的地图铺至西海尽头，书记官抄录港湾与城镇的旧名，军需官则开始计算横越地中海所需的粮秣。帝国的边界曾抵达此处，如今，船帆将再次载着鹰旗驶向半岛。"
 oe_heg_plan_iberia_effect: "花费1000国库金币，将伊比利亚大区纳入罗马文明圈，解锁后续伊比利亚行动。仅能完成一次。"
 oe_heg_plan_iberia_done: "已完成：筹划入侵伊比利亚"
 oe_heg_invade_iberia: "入侵伊比利亚"
 oe_heg_invade_iberia_desc: "使节带着御玺封缄的诏书驶向西方。仍据有半岛土地的君主将收到帝国的要求，而他们的都城，也已被标在将领的行军图上。"
 oe_heg_invade_iberia_effect: "花费100国库金币，选择在伊比利亚大区拥有地点、且不属于东罗马及其附庸集团的国家，取得以占领其首都为目标的十五年战争借口。不立即宣战，可重复执行，冷却三个月。"
 oe_heg_mass_invade_iberia: "大规模入侵伊比利亚"
 oe_heg_mass_invade_iberia_desc: "此番西征，不再只向一座城门递交诏书。舰队将沿海岸展开，军团将越过山口；凡定都于半岛的外部君主，都要面对同一面鹰旗。地方城镇一经攻克，便由帝国官吏接管，而诸王的都城仍须在战争中另行处置。"
 oe_heg_mass_invade_iberia_effect: "花费1000国库金币，向所有首都位于伊比利亚大区的外部国家宣战（排除东罗马及其附庸，已经交战的目标纳入本次行动）。在本次登记的战争中，东罗马及其参战附庸军事占领这些目标国在伊比利亚的非首都地点时，立即将所有权与控制权移交东罗马（包括附庸的占领地点）。目标国当前首都、区外土地及未被列为目标的参战国不适用。与相应目标结束本次战争后立即失效；本次征程全部结束后可再次执行。若未能进入任何合格战争，退还费用。\n\n$OE_HEG_MASS_INVASION_BONUS_TT$"
