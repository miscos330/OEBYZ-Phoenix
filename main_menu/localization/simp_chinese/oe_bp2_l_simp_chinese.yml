 oe_bp2_b_turk_mercenary_rift: "清算反戈突厥雇佣兵"
 oe_bp2_b_venice_debt_settled: "清偿皇冠珠宝抵押债"
 oe_bp2_b_venice_debt_stalled: "拖延赎回皇冠珠宝"
 oe_bp2_b_patristic_dialogue: "东西教父神学互鉴"
 oe_bp2_b_union_enforced: "强力推行教会合一礼仪"
 oe_bp2_b_union_hedged: "在合一礼仪上阳奉阴违"
 oe_bp2_b_florence_formula: "采纳佛罗伦萨折衷释义"
 oe_bp2_b_rus_autocephaly_accord: "承认罗斯自主教会协约"
 oe_bp2_b_rus_ecclesiastical_chill: "斥责莫斯科擅立都主教"
 STATIC_MODIFIER_NAME_oe_bp2_new_man_cadre: "寒门新贵文官团"
 STATIC_MODIFIER_DESC_oe_bp2_new_man_cadre: "皇室破格拔擢寒门才俊执掌枢密与财赋，大幅提升内阁与税政效能并压制旧门阀，但也引发大贵族强烈不满。"
 STATIC_MODIFIER_NAME_oe_bp2_chancellery_clerks: "外省试吏书办团"
 STATIC_MODIFIER_DESC_oe_bp2_chancellery_clerks: "皇室以温和方式吸纳外省书办充实中书文牍，小幅改善行政与财政效率而不致激化门阀对立。"
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_purple_council: "紫室外戚协理团"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_purple_council: "皇后母族正式列席紫室枢密，为外交声望、正统性与诸军区羁縻提供助力，但也让外戚与门阀势力借机壮大。"
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_barred_command: "禁外戚领兵诏"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_barred_command: "严禁后族亲眷兼领边镇兵权与枢密要职，稳固皇室集权并遏制外戚干政，但削弱了联姻外交回旋余地。"
 STATIC_MODIFIER_NAME_oe_bp2_civic_relief_accord: "京畿赈济安民令"
 STATIC_MODIFIER_DESC_oe_bp2_civic_relief_accord: "散放库银与义粮抚恤京畿坊市，迅速缓和各阶层怨气并稳固帝国安定。"
 STATIC_MODIFIER_NAME_oe_bp2_crown_consolidation: "御前集权整饬"
 STATIC_MODIFIER_DESC_oe_bp2_crown_consolidation: "御前枢密院重申皇权纲纪并约制豪族，巩固了中央权威与军区服从度。"
 STATIC_MODIFIER_NAME_oe_bp2_senate_theme_concordat: "元老院—军区联席誓约"
 STATIC_MODIFIER_DESC_oe_bp2_senate_theme_concordat: "元老院与诸军区将军达成权责共治誓约，显著提升附庸忠顺度与中央协同效能。"
 STATIC_MODIFIER_NAME_oe_bp2_magnate_tax_exemption: "豪族庄园豁免特许"
 STATIC_MODIFIER_DESC_oe_bp2_magnate_tax_exemption: "暂免大族庄园清丈加税以换取其战时兵源捐助，短期充实了军力却侵蚀了皇室税基。"
 STATIC_MODIFIER_NAME_oe_bp2_crown_cadastre_enforced: "皇室地籍清丈厉行"
 STATIC_MODIFIER_DESC_oe_bp2_crown_cadastre_enforced: "度支官吏铁面清查隐匿庄园田产，显著增加国库税入并赢得平民赞誉，但激怒了大贵族。"
 STATIC_MODIFIER_NAME_oe_bp2_absorbed_latin_retinue: "收编拉丁精锐步骑"
 STATIC_MODIFIER_DESC_oe_bp2_absorbed_latin_retinue: "将豪族私蓄的拉丁重甲雇佣兵整编入帝国常备军团，提升了战力与纪律，也加重了军费开支。"
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_logothete: "外戚司计大臣"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_logothete: "由皇后母族亲信出任司计大臣，融洽了贵族与外交关系，但行政效率因任人唯亲而有所下滑。"
 STATIC_MODIFIER_NAME_oe_bp2_merit_logothete: "唯才拔擢司计官"
 STATIC_MODIFIER_DESC_oe_bp2_merit_logothete: "驳回外戚请托而择才授任司计大臣，振奋了中枢政务效能却得罪了宫廷戚畹。"
 STATIC_MODIFIER_NAME_oe_bp2_purple_guardianship: "紫室储嗣共保盟约"
 STATIC_MODIFIER_DESC_oe_bp2_purple_guardianship: "元老院与后族在皇嗣襁褓前立下共保誓约，为皇位继承平添正统性与军区向心力。"
 STATIC_MODIFIER_NAME_oe_bp2_palace_tutelage: "禁宫学者储君师保制"
 STATIC_MODIFIER_DESC_oe_bp2_palace_tutelage: "将皇嗣托付大宫学者与内廷近臣严加教诲，隔绝了外戚干政并弘扬学术风气。"
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_war_subsidy: "后族筹饷济军"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_war_subsidy: "皇后母族倾私库筹办粮秣与军饷，有效缓解战时军费压力，也换得了更高政治分量。"
 STATIC_MODIFIER_NAME_oe_bp2_empress_grain_fund: "皇后慈善义仓基金"
 STATIC_MODIFIER_DESC_oe_bp2_empress_grain_fund: "将后族捐资转设永久义仓，丰裕粮储并深得黎庶民心。"
 STATIC_MODIFIER_NAME_oe_bp2_mixed_audit_board: "元老—文官合议审计院"
 STATIC_MODIFIER_DESC_oe_bp2_mixed_audit_board: "由元老代表与寒门文吏共同核审税账，虽略损征税锋芒却使法令推行更为顺畅。"
 STATIC_MODIFIER_NAME_oe_bp2_emergency_dole: "开仓平粜与减免灶税"
 STATIC_MODIFIER_DESC_oe_bp2_emergency_dole: "危机之际开仓济贫并减征灶税，迅速平息京畿动荡但使短期税入承压。"
 STATIC_MODIFIER_NAME_oe_bp2_palace_martial_order: "禁卫戒严整肃令"
 STATIC_MODIFIER_DESC_oe_bp2_palace_martial_order: "瓦兰吉与皇宫禁卫全城巡防戒严，强力恢复皇室控制力却令臣民怨声载道。"
 STATIC_MODIFIER_NAME_oe_bp2_broken_oligarchy: "瓦解双豪寡头同盟"
 STATIC_MODIFIER_DESC_oe_bp2_broken_oligarchy: "皇帝巧施纵横之术拆散两大家族寡头合谋，重振皇权独断之势。"
 STATIC_MODIFIER_NAME_oe_bp2_senatorial_oligarchy: "门阀元老共治妥协约"
 STATIC_MODIFIER_DESC_oe_bp2_senatorial_oligarchy: "皇室被迫向两大家族让渡部分税权与枢密席位，虽换得短期安靖却削弱了中央集权。"
 STATIC_MODIFIER_NAME_oe_bp2_macedonian_toll_concession: "马其顿关隘通商特许"
 STATIC_MODIFIER_DESC_oe_bp2_macedonian_toll_concession: "向塞尔维亚商队让渡瓦尔达尔河谷关税特许以暂缓杜尚南侵，付出贸易税损换取外交喘息。"
 STATIC_MODIFIER_NAME_oe_bp2_orthodox_macedonia_rally: "正教马其顿护国誓师"
 STATIC_MODIFIER_DESC_oe_bp2_orthodox_macedonia_rally: "严拒外敌趁火打劫之索求，激发色雷斯与马其顿军民同仇敌忾之气。"
 STATIC_MODIFIER_NAME_oe_bp2_turkic_auxiliary_pact: "突厥轻骑驱虎密约"
 STATIC_MODIFIER_DESC_oe_bp2_turkic_auxiliary_pact: "默许突厥佣兵在色雷斯劫掠以换取战场冲击力，虽解燃眉之急却令乡邑凋敝、民怨沸腾。"
 STATIC_MODIFIER_NAME_oe_bp2_redeemed_crown_jewels: "皇冠珠宝重归紫宫"
 STATIC_MODIFIER_DESC_oe_bp2_redeemed_crown_jewels: "历经波折终自威尼斯圣马可金库赎回帝国皇冠珠宝，洗雪典当之耻并重彰罗马帝威。"
 STATIC_MODIFIER_NAME_oe_bp2_venetian_customs_lien: "黑海关税抵赎珠宝约"
 STATIC_MODIFIER_DESC_oe_bp2_venetian_customs_lien: "以海峡与黑海关税分成抵偿威尼斯本息，提前迎回皇冠珠宝但短期让渡了一成商税。"
 STATIC_MODIFIER_NAME_oe_bp2_postwar_amnesty: "战后大赦与和解诏"
 STATIC_MODIFIER_DESC_oe_bp2_postwar_amnesty: "内战平息后大赦敌对派系将领并归还田产，加速军区忠诚与民生复苏，但略微削弱了皇室独断权。"
 STATIC_MODIFIER_NAME_oe_bp2_postwar_confiscation: "叛党抄产充公法案"
 STATIC_MODIFIER_DESC_oe_bp2_postwar_confiscation: "严惩内战敌对豪族并没收其庄园归入皇领，充实国库与皇室集权，却留下深重的贵族裂痕。"
 STATIC_MODIFIER_NAME_oe_bp2_theme_reconstruction_board: "军区战后重建署"
 STATIC_MODIFIER_DESC_oe_bp2_theme_reconstruction_board: "中枢拨款修缮内战损毁的关隘堡垒并重编军户名册，稳步恢复军区战备底蕴。"
 STATIC_MODIFIER_NAME_oe_bp2_zealot_guild_commerce: "爱琴海自治商帮宪章"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_guild_commerce: "塞萨洛尼基自治市宪章带动帝国本土海商与手工业行会兴起，开始与威尼斯、热那亚分庭抗礼。"
 STATIC_MODIFIER_NAME_oe_bp2_zealot_iron_order: "白塔铁腕整肃余威"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_iron_order: "以武装清剿终结热诚者公社并返还贵族宅邸，树立了皇室威严却重创了城市行会活力。"
 STATIC_MODIFIER_NAME_oe_bp2_zealot_civic_concord: "圣德米特里市政和解宪章"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_civic_concord: "在帕拉马斯派牧首见证下建立市民与元老院混合议事体制，兼顾社会安定与近代市政启蒙。"
 STATIC_MODIFIER_NAME_oe_bp2_hellenic_purism: "古典希腊纯粹主义"
 STATIC_MODIFIER_DESC_oe_bp2_hellenic_purism: "帝国以荷马、柏拉图与正统希腊礼仪为立国之本，显著提升文化传统、国民识字率与正教核心凝聚力。"
 STATIC_MODIFIER_NAME_oe_bp2_universal_citizenship: "泛地中海罗马公民权"
 STATIC_MODIFIER_DESC_oe_bp2_universal_citizenship: "重申卡拉卡拉《安东尼努斯敕令》精神，广纳帝国诸族入籍罗马公民，大幅加快行省整合与多民族和平同化。"
 STATIC_MODIFIER_NAME_oe_bp2_patristic_orthodoxy_banner: "阿索斯圣教父正统旌旗"
 STATIC_MODIFIER_DESC_oe_bp2_patristic_orthodoxy_banner: "御前教会评议会高举阿索斯灵修与古教父传统，凝聚教士阶层与全境正教改宗动力。"
 STATIC_MODIFIER_NAME_oe_bp2_ecumenical_scholarship: "东西教父学术互鉴会"
 STATIC_MODIFIER_DESC_oe_bp2_ecumenical_scholarship: "资助希腊与拉丁学者译校典籍并展开温和神学对话，加速科研与识字提升，却令保守教士心怀戒惧。"
 STATIC_MODIFIER_NAME_oe_bp2_anatolia_stratiotai: "安纳托利亚军屯农兵复兴"
 STATIC_MODIFIER_DESC_oe_bp2_anatolia_stratiotai: "在小亚细亚收复区广设军屯并复兴鲁姆希腊语教区，充实兵源与同化效率但激化了异教摩擦。"
 STATIC_MODIFIER_NAME_oe_bp2_anatolia_frontier_peace: "小亚细亚宽赋安牧约"
 STATIC_MODIFIER_DESC_oe_bp2_anatolia_frontier_peace: "以轻徭薄赋引导安纳托利亚突厥游牧部落定居农耕，换得高地商粮稳定与平缓整合。"
 STATIC_MODIFIER_NAME_oe_bp2_egypt_coptic_accord: "埃及科普特教会和解约"
 STATIC_MODIFIER_DESC_oe_bp2_egypt_coptic_accord: "承认科普特教会地方礼仪自治以换取尼罗河谷地全面配合，让帝国粮仓源源不断输往君士坦丁堡。"
 STATIC_MODIFIER_NAME_oe_bp2_alexandrian_renaissance: "亚历山大希腊学派重兴"
 STATIC_MODIFIER_DESC_oe_bp2_alexandrian_renaissance: "在亚历山大港重开希腊语哲学与法学学院，以古典学术重塑埃及上层精英。"
 STATIC_MODIFIER_NAME_oe_bp2_italy_bilingual_charter: "拉文纳拉丁—希腊双语宪章"
 STATIC_MODIFIER_DESC_oe_bp2_italy_bilingual_charter: "保留意大利自治市商法传统并推行拉丁—希腊双语判例，赢得亚平宁市民阶层与海商拥护。"
 STATIC_MODIFIER_NAME_oe_bp2_italy_basilica_code: "意大利《巴西利卡法典》直辖"
 STATIC_MODIFIER_DESC_oe_bp2_italy_basilica_code: "在拉文纳总督区全面推行君士坦丁堡法典与皇室直辖，强化中央控制力与罗马化同化速度。"
 STATIC_MODIFIER_NAME_oe_bp2_gaul_senate_pact: "高卢元老入籍协约"
 STATIC_MODIFIER_DESC_oe_bp2_gaul_senate_pact: "仿效古代西罗马元老院传统吸纳高卢拉丁贵族入籍，加速西方大区融入帝国政治与文化体系。"
 STATIC_MODIFIER_NAME_oe_bp2_gaul_chancery_rule: "高卢帝国公文与编户制"
 STATIC_MODIFIER_DESC_oe_bp2_gaul_chancery_rule: "在高卢推行统一帝国文书与军区编户征税，以强硬行政手段重铸西方行省秩序。"
 STATIC_MODIFIER_NAME_oe_bp2_union_enforced_aid: "圣索菲亚强行合一援军约"
 STATIC_MODIFIER_DESC_oe_bp2_union_enforced_aid: "强硬压制反合一修士以向西方昭示诚意，换取外援与拉丁佣兵便利，却严重撕裂本土教会民心。"
 STATIC_MODIFIER_NAME_oe_bp2_quiet_orthodox_rite: "外合内守：默许东正古礼"
 STATIC_MODIFIER_DESC_oe_bp2_quiet_orthodox_rite: "暗中默许各地修院与教区维持传统东正礼仪，平息国内骚动却让罗马教廷怀疑帝国诚意。"
 STATIC_MODIFIER_NAME_oe_bp2_florence_humanist_bridge: "佛罗伦萨人文神学桥梁"
 STATIC_MODIFIER_DESC_oe_bp2_florence_humanist_bridge: "围绕“经由圣子”的折衷释义促成东西学者交流，极大推动文艺复兴学术繁荣却令保守教派忧愤。"
 STATIC_MODIFIER_NAME_oe_bp2_ephesus_creed_stand: "以弗所马可信经立场"
 STATIC_MODIFIER_DESC_oe_bp2_ephesus_creed_stand: "坚守尼西亚—君士坦丁堡信经原典而不作教义让步，赢得东正教界崇高声望却使西方谈判遇冷。"
 STATIC_MODIFIER_NAME_oe_bp2_northern_ecclesiastical_accord: "北疆自主教会战略协约"
 STATIC_MODIFIER_DESC_oe_bp2_northern_ecclesiastical_accord: "承认罗斯都主教区的教会自主地位以换取北方盟好与毛皮商路畅通，但略微削弱了普世牧首宗主威望。"
 STATIC_MODIFIER_NAME_oe_bp2_ecumenical_primacy_asserted: "重申普世牧首宗主权"
 STATIC_MODIFIER_DESC_oe_bp2_ecumenical_primacy_asserted: "君士坦丁堡教会断然维护普世牧首法统，虽与罗斯教区陷入冷战，却振奋了君堡圣座威仪。"
 STATIC_MODIFIER_NAME_oe_bp2_pentarchy_triumph: "五牧首区正统重光"
 STATIC_MODIFIER_DESC_oe_bp2_pentarchy_triumph: "帝国未向西方屈服而凭自身武功重光古代五牧首区圣座，正教罗马威望由此照耀四海。"
 STATIC_MODIFIER_NAME_oe_bp2_pentarchy_universal_charter: "五牧首区普世学艺与慈悲宪章"
 STATIC_MODIFIER_DESC_oe_bp2_pentarchy_universal_charter: "五牧首区大公会议不仅确立正教正统，更广设学院、慈院与外交公约，令新罗马成为普世文明灯塔。"
 STATIC_MODIFIER_NAME_oe_bp2_zealot_charter_city: "塞萨洛尼基特许自治市"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_charter_city: "皇室承认工匠行会与市民大会的地方财政治理权，令此城工商业蒸蒸日上，但中央直控力相对薄弱。"
 STATIC_MODIFIER_NAME_oe_bp2_zealot_crown_garrison: "白塔皇室重兵驻防"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_crown_garrison: "武装平定狂热者后由皇室禁卫常驻白塔弹压全城，城防与控制力铁桶般严密，但市井元气久难复原。"
 STATIC_MODIFIER_NAME_oe_bp2_zealot_civic_senate: "塞萨洛尼基市民参议会"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_civic_senate: "温和派行会代表与地方元老共组市政参议会，兼顾秩序安定、文教启蒙与城市长足发展。"
 STATIC_MODIFIER_NAME_oe_bp2_loc_anatolia_revival: "安纳托利亚鲁姆复兴镇"
 STATIC_MODIFIER_DESC_oe_bp2_loc_anatolia_revival: "重整军户与希腊—罗马教区使此地重现昔日安纳托利亚军区之殷实气象。"
 STATIC_MODIFIER_NAME_oe_bp2_loc_nile_granary: "帝国尼罗河谷粮仓"
 STATIC_MODIFIER_DESC_oe_bp2_loc_nile_granary: "疏浚沟渠并妥善安抚本地教会后，尼罗河谷重归地中海最富庶的皇家粮仓。"
 STATIC_MODIFIER_NAME_oe_bp2_loc_ravenna_exarchate: "拉文纳总督区法政枢纽"
 STATIC_MODIFIER_DESC_oe_bp2_loc_ravenna_exarchate: "总督区双语法庭与工坊复兴使此城成为罗马在亚平宁半岛的法政与商贸支点。"
 STATIC_MODIFIER_NAME_oe_bp2_loc_gaul_diocese: "高卢近卫管区治所"
 STATIC_MODIFIER_DESC_oe_bp2_loc_gaul_diocese: "新设的高卢近卫管区与元老院协约令罗马法制与城市文明在西方重焕生机。"
 oe_bp2_dec_promote_new_men.title: "拔擢寒门新贵"
 oe_bp2_dec_promote_new_men.desc: "效法阿波考科斯故事，破格拔擢寒门文吏进入枢密与财政要职，以皇室新贵制衡势大难制的百年豪族，换取内阁效率、皇室权力与税收提升，但可能引来豪族联名弹劾。"
 oe_bp2_dec_promote_new_men.a: "破格授以枢密财权，直折首座豪族锋芒"
 oe_bp2_dec_promote_new_men.a.tt: "帝国权威 -10，京畿民意 +4，当前势力最强豪族影响力 -65（可能引发豪族联名弹劾）"
 oe_bp2_dec_promote_new_men.b: "温和试吏，仅吸纳外省书办充实中书"
 oe_bp2_dec_promote_new_men.b.tt: "帝国权威 -5，当前势力最强豪族影响力 -30"
 oe_bp2_dec_inlaw_compact.title: "确立外戚协理规制"
 oe_bp2_dec_inlaw_compact.desc: "既结紫室姻亲，皇后母族在朝野与军区间的分量便不可回避。陛下可明诏纳后族入紫室顾问以固联姻羁縻，或颁布《禁外戚领兵诏》严防外戚干政。"
 oe_bp2_dec_inlaw_compact.a: "纳后族入紫室顾问，以姻亲羁縻诸镇"
 oe_bp2_dec_inlaw_compact.a.tt: "帝国权威 -6，所有军区近期忠诚 +5，开启后族协理政局（15年）"
 oe_bp2_dec_inlaw_compact.b: "颁《禁外戚领兵诏》，严防后族干预兵权"
 oe_bp2_dec_inlaw_compact.b.tt: "帝国权威 -6，当前势力最强豪族影响力 -25，严控外戚干政（15年）"
 oe_bp2_dec_rebalance_pillars.title: "御前支柱再平衡诏"
 oe_bp2_dec_rebalance_pillars.desc: "当皇室威权、京畿民意与豪族势力失衡时，皇帝可于御前枢密院统筹库银、民意与诏命，完成帝国支柱再平衡，并同步稳固诸军区忠顺度。"
 oe_bp2_dec_rebalance_pillars.a: "散财赈济京畿，重振民意根基"
 oe_bp2_dec_rebalance_pillars.a.tt: "京畿民意 +14，帝国权威 +4，所有军区近期忠诚 +4"
 oe_bp2_dec_rebalance_pillars.b: "以财势与诏命重铸皇室威权"
 oe_bp2_dec_rebalance_pillars.b.tt: "京畿民意 -6，帝国权威 +14，最强豪族影响力 -35，所有军区近期忠诚 +5"
 oe_bp2_dec_rebalance_pillars.c: "召开元老院与诸军区联席誓约会"
 oe_bp2_dec_rebalance_pillars.c.tt: "帝国权威 +6，京畿民意 +6，所有军区近期忠诚 +8"
 oe_bp2_dec_roman_identity.title: "确立帝国文化认同国策"
 oe_bp2_dec_roman_identity.desc: "随着文艺复兴浪潮与疆域拓张，帝国必须回答“何为罗马人”的根本命题：是坚守荷马、柏拉图与正统希腊礼仪的古典希腊纯粹主义，还是重申卡拉卡拉《安东尼努斯敕令》精神的泛地中海罗马公民权？（专制时代以后可付出高额稳定与威权转向一次。）"
 oe_bp2_dec_roman_identity.a: "路线 I：确立古典希腊纯粹主义"
 oe_bp2_dec_roman_identity.a.tt: "确立古典希腊纯粹主义为永久国策（若系二次转向，额外消耗15点稳定度与15点帝国权威并永久锁定）"
 oe_bp2_dec_roman_identity.b: "路线 II：确立泛地中海罗马公民权"
 oe_bp2_dec_roman_identity.b.tt: "确立泛地中海罗马公民权为永久国策（若系二次转向，额外消耗15点稳定度与15点帝国权威并永久锁定）"
 oe_bp2_dec_synod_doctrine_review.title: "召开御前教会礼仪与正统评议会"
 oe_bp2_dec_synod_doctrine_review.desc: "围绕阿索斯静修传统与西方公会议神学争论，陛下可于君士坦丁堡召开御前教会评议会：或是高举圣教父正统凝聚合一民心，或是资助东西学者互鉴以拓科研与外交。"
 oe_bp2_dec_synod_doctrine_review.a: "重申阿索斯与圣教父正统"
 oe_bp2_dec_synod_doctrine_review.a.tt: "京畿民意 +5，获得10年“阿索斯圣教父正统旌旗”"
 oe_bp2_dec_synod_doctrine_review.b: "资助东西学者展开温和教父对话"
 oe_bp2_dec_synod_doctrine_review.b.tt: "增进东西希腊学者交流，提升教皇国好感（+15），获得10年“东西教父学术互鉴会”"
 oe_bp2.1.t: "豪族索请边镇世袭军权"
 oe_bp2.1.d: "帝国首座豪族的使节联袂入宫呈递请愿书，宣称本族子弟世代血战疆场，理应获得一处军区的世守敕书。元老院内私语四起：若许其世袭，边镇军心可安一时，但皇室任免大权必遭侵蚀。"
 oe_bp2.1.a: "姑许一镇世守敕书，以安勋旧之心"
 oe_bp2.1.a.tt: "随机一处尚未世守的军区获得世袭军权且近期忠诚 +12；最强豪族影响力 +40"
 oe_bp2.1.b: "严辞斥回：军区乃皇帝公器，岂容私相授受"
 oe_bp2.1.b.tt: "帝国权威 +5，最强豪族影响力 -30，所有豪族出身将军所领军区近期忠诚 -8"
 oe_bp2.1.c: "赐予荣誉采邑津贴以换其收回成命"
 oe_bp2.1.c.tt: "京畿民意 +3，最强豪族影响力 -10"
 oe_bp2.2.t: "大族请免庄园清丈税"
 oe_bp2.2.d: "度支署官员刚把新编田亩清册呈送御案，权势最盛的大族便遣代表入宫哭诉连年战祸、佃户流亡，恳请皇室豁免其名下庄园的清丈加税，并愿以私丁入伍作为回报。"
 oe_bp2.2.a: "准予五年豁免，换取贵族满意度与兵源捐助"
 oe_bp2.2.a.tt: "最强豪族影响力 +30，获得5年“豪族庄园豁免特许”"
 oe_bp2.2.b: "驳回请免，厉行全境地籍清丈"
 oe_bp2.2.b.tt: "京畿民意 +6，最强豪族影响力 -35，获得5年“皇室地籍清丈厉行”"
 oe_bp2.3.t: "两大家族争产与联姻仲裁"
 oe_bp2.3.d: "围绕色雷斯一处丰腴庄园的继承权与婚约归属，帝国两大家族在元老院公然剑拔弩张。双方皆上表恭请皇帝御前裁断，实则在试探皇室究竟意在扶弱抑强，还是趁势收利。"
 oe_bp2.3.a: "裁归弱势家族，以行平衡制衡之道"
 oe_bp2.3.a.tt: "帝国权威 +4，最强豪族影响力 -45，竞争豪族影响力 +35"
 oe_bp2.3.b: "由皇室主婚撮合两家和解"
 oe_bp2.3.b.tt: "两大家族影响力各 +15"
 oe_bp2.3.c: "以争讼久悬为由，将争议庄园收归皇室"
 oe_bp2.3.c.tt: "京畿民意 +4，最强豪族影响力 -30，竞争豪族影响力 -20"
 oe_bp2.4.t: "豪族私蓄拉丁雇佣兵丑闻"
 oe_bp2.4.d: "巡察使密报：首座豪族竟绕过枢密院，私下招募大批热那亚弩手与法兰克重骑驻屯自家堡寨。此事已在坊间传得沸沸扬扬，朝中无不担忧昔日权臣拥兵逼宫之祸重演。"
 oe_bp2.4.a: "严旨勒令即刻遣散私兵、查封军械"
 oe_bp2.4.a.tt: "帝国权威 +7，最强豪族影响力 -40"
 oe_bp2.4.b: "出资买断契约，收编入帝国常备军团"
 oe_bp2.4.b.tt: "最强豪族影响力 -20，获得6年“收编拉丁精锐步骑”"
 oe_bp2.4.c: "网开一面，责令其将私兵派赴边防效力"
 oe_bp2.4.c.tt: "帝国权威 -5，最强豪族影响力 +35"
 oe_bp2.5.t: "皇后母族干预枢密人事"
 oe_bp2.5.d: "大司计官出缺之际，皇后母族联名向紫室举荐本族子弟接掌财政文牍。旧臣们纷纷上书进谏，称若听任后族把持枢密喉舌，朝政恐落入外戚掌中。"
 oe_bp2.5.a: "顺应后族举荐，授其亲信司计要职"
 oe_bp2.5.a.tt: "帝国权威 -4，获得8年“外戚司计大臣”"
 oe_bp2.5.b: "婉拒后宫请托，依历练与才干择人授任"
 oe_bp2.5.b.tt: "帝国权威 +5，京畿民意 +4，获得8年“唯才拔擢司计官”"
 oe_bp2.6.t: "紫室储嗣与外戚争衡"
 oe_bp2.6.d: "围绕皇嗣的师保人选与未来摄政格局，后族戚畹与元老院诸派暗中角力。若此时早定章程，既可安抚外戚忠心，亦可避免他日宫变重演。"
 oe_bp2.6.a: "令元老院与后族在圣坛前共立储嗣护持盟约"
 oe_bp2.6.a.tt: "帝国权威 +4，获得10年“紫室储嗣共保盟约”"
 oe_bp2.6.b: "将皇嗣专托禁宫学者教诲，屏绝外戚预政"
 oe_bp2.6.b.tt: "帝国权威 +6，最强豪族影响力 -20，获得10年“禁宫学者储君师保制”"
 oe_bp2.7.t: "后族输财济军"
 oe_bp2.7.d: "正值国用吃紧之际，皇后母族主动遣人押运整箱金币与粮契入宫，表示愿为圣朝筹措军资或设立京畿慈善义仓，以报紫室荣宠。"
 oe_bp2.7.a: "全数纳入军费库藏，赐予后族荣誉爵秩"
 oe_bp2.7.a.tt: "帝国权威 -3，最强豪族影响力 +25，获得6年“后族筹饷济军”"
 oe_bp2.7.b: "半数充库，半数以皇后名义设立永久义仓"
 oe_bp2.7.b.tt: "京畿民意 +8，获得6年“皇后慈善义仓基金”"
 oe_bp2.8.t: "豪族联名弹劾寒门新贵"
 oe_bp2.8.d: "不满寒门新贵执掌税册与枢密案牍，诸大豪族在元老院联名递交弹劾表，痛斥新晋文吏“出身寒微、苛征无度、败坏千年礼法”，逼迫皇室罢黜新政骨干。"
 oe_bp2.8.a: "力挺寒门新贵，斥退豪族无理联名表"
 oe_bp2.8.a.tt: "帝国权威 +6，最强豪族影响力 -45"
 oe_bp2.8.b: "罢免一名税吏平息众怒，保住新政大局"
 oe_bp2.8.b.tt: "帝国权威 -4"
 oe_bp2.8.c: "折衷设立元老—文官合议审计院"
 oe_bp2.8.c.tt: "京畿民意 +4，获得6年“元老—文官合议审计院”"
 oe_bp2.9.t: "支柱失衡：皇权式微与京畿怨沸"
 oe_bp2.9.d: "帝国支柱已呈倾危之象：京畿坊市因粮价与苛捐议论沸腾，宫廷威信亦渐显薄弱。若不果断处置，流言与骚动恐将在君士坦丁堡街头酿成大变。"
 oe_bp2.9.a: "开仓平粜并暂免灶税，先安民心"
 oe_bp2.9.a.tt: "京畿民意 +12，帝国权威 +5，获得5年“开仓平粜与减免灶税”"
 oe_bp2.9.b: "遣瓦兰吉禁卫全城戒严，以铁腕立威"
 oe_bp2.9.b.tt: "帝国权威 +10，京畿民意 -6，获得5年“禁卫戒严整肃令”"
 oe_bp2.9.c: "亲临圣索菲亚与元老院晓谕大义，共克时艰"
 oe_bp2.9.c.tt: "帝国权威 +6，京畿民意 +6"
 oe_bp2.10.t: "支柱失衡：双豪并峙与寡头架空"
 oe_bp2.10.d: "帝国境内两大家族势力同时突破六百大关，竟在元老院与边镇军务间隐然结成默契，将中枢诏命视同具文。陛下必须在彻底沦为门阀傀儡之前打破这场寡头合流。"
 oe_bp2.10.a: "巧施离间与查账，强行拆散双豪同盟"
 oe_bp2.10.a.tt: "帝国权威 +6，最强豪族影响力 -70，获得6年“瓦解双豪寡头同盟”"
 oe_bp2.10.b: "承认门阀元老共治格局，以妥协换取安稳"
 oe_bp2.10.b.tt: "帝国权威 -6，获得8年“门阀元老共治妥协约”"
 oe_bp2.11.t: "塞尔维亚杜尚的密约筹码"
 oe_bp2.11.d: "内战方酣之际，塞尔维亚国王斯特凡·杜尚遣密使潜抵御帐，声称只要君士坦丁堡允诺马其顿要道与瓦尔达尔河谷的免税通商特许，他便暂缓南侵并疏远叛军。然而群臣皆知，此乃乘人之危的敲诈。"
 oe_bp2.11.a: "暂许马其顿关隘通商特许，缓兵破局"
 oe_bp2.11.a.tt: "塞尔维亚好感 +20；若两约翰之战进行中则大势 -6（利于正统朝廷）；获得6年“马其顿关隘通商特许”"
 oe_bp2.11.b: "严辞痛斥杜尚勒索，号召正教军民死守马其顿"
 oe_bp2.11.b.tt: "塞尔维亚好感 -20，京畿民意 +8，获得6年“正教马其顿护国誓师”"
 oe_bp2.12.t: "突厥雇佣兵反噬与色雷斯劫掠"
 oe_bp2.12.d: "应召渡海参战的奥斯曼与艾登突厥轻骑不再甘于听命行事，竟公然在色雷斯乡邑纵火劫掠、掳卖希腊农人。前线急报接踵而至，陛下必须立刻决定如何处置这群反噬的佣兵。"
 oe_bp2.12.a: "重金赎回被掳百姓，遣舰押送突厥佣兵渡海离境"
 oe_bp2.12.a.tt: "京畿民意 +10，奥斯曼好感 -25"
 oe_bp2.12.b: "驱虎吞狼：暂忍乡邑之痛，驱其冲杀敌对派系"
 oe_bp2.12.b.tt: "京畿民意 -10；若内战大势生效则大势 -8（利于朝廷）；获得6年“突厥轻骑驱虎密约”"
 oe_bp2.12.c: "断然设伏清剿反戈佣兵，绝不容异族践踏色雷斯"
 oe_bp2.12.c.tt: "帝国权威 +6，奥斯曼与艾登好感 -25"
 oe_bp2.13.t: "威尼斯典当皇冠珠宝再交涉"
 oe_bp2.13.d: "当年内战危急之时典当在威尼斯圣马可金库的帝国皇冠珠宝，至今仍是罗马皇室心头奇耻。如今烽烟暂息、国库略有起色，威尼斯执政团的使者已抵君士坦丁堡，就赎回本息展开再交涉。"
 oe_bp2.13.a: "筹足本息一次赎回皇冠珠宝，雪洗国耻"
 oe_bp2.13.a.tt: "迎回威尼斯典当的皇冠珠宝，威尼斯好感 +20，获得20年“皇冠珠宝重归紫宫”"
 oe_bp2.13.b: "以黑海与海峡关税分成抵债，提前迎回御宝"
 oe_bp2.13.b.tt: "迎回皇冠珠宝，威尼斯好感 +20，获得15年“黑海关税抵赎珠宝约”"
 oe_bp2.13.c: "国库尚须留作军资，暂缓赎回谈判"
 oe_bp2.13.c.tt: "威尼斯好感 -15"
 oe_bp2.14.t: "内战善后：大赦令与军区重建法案"
 oe_bp2.14.d: "绵延数年的内战终于画上句号，然而色雷斯与马其顿残垣遍地，各军区将领与豪族派系仍互怀猜忌。枢密院呈上三份善后方略，决定帝国将以宽仁弥合创伤，还是借机清算豪强。"
 oe_bp2.14.a: "颁行大赦令，宽宥敌对派系将领以安军区"
 oe_bp2.14.a.tt: "京畿民意 +8，所有军区近期忠诚 +12，获得10年“战后大赦与和解诏”"
 oe_bp2.14.b: "严惩叛党并抄没田产，以充国库而削豪族"
 oe_bp2.14.b.tt: "帝国权威 +8，最强豪族影响力 -60，获得10年“叛党抄产充公法案”"
 oe_bp2.14.c: "设立军区战后重建署，拨款修堡重编军户"
 oe_bp2.14.c.tt: "帝国权威 +4，京畿民意 +4，所有军区近期忠诚 +6，获得10年“军区战后重建署”"
 oe_bp2.15.t: "塞萨洛尼基热诚者公社的终局抉择"
 oe_bp2.15.d: "历经内战与狂热者风暴的塞萨洛尼基此刻站在历史十字路口：码头水手行会要求承认市民自治宪章；被逐贵族恳请皇室出兵白塔彻底清算；静修派大主教帕拉马斯则奔走调停，主张组建市民与元老院混合议事体制。"
 oe_bp2.15.a: "终局 A：颁赐特许自治市宪章，扶植本土商邦"
 oe_bp2.15.a.tt: "解除塞萨洛尼基公社动乱，10日后触发“特许自治市宪章”终局"
 oe_bp2.15.b: "终局 B：遣色雷斯禁卫武装清剿，抄没狂热者"
 oe_bp2.15.b.tt: "解除塞萨洛尼基公社动乱，10日后触发“白塔武装清剿”终局"
 oe_bp2.15.c: "终局 C：延请帕拉马斯派斡旋，推行市民—元老院混合改革"
 oe_bp2.15.c.tt: "解除塞萨洛尼基公社动乱，10日后触发“市民—元老院混合改革”终局"
 oe_bp2.16.t: "塞萨洛尼基终局：特许自治市宪章"
 oe_bp2.16.d: "金玺诏书在圣德米特里广场宣读，皇室正式承认塞萨洛尼基工匠行会与市民大会的地方财政自治。码头商船云集，工坊昼夜不息，帝国终于拥有了一座足以与威尼斯、热那亚抗衡的本土商业重镇。"
 oe_bp2.16.a: "愿爱琴海的商帆为帝国带来丰饶"
 oe_bp2.16.a.tt: "塞萨洛尼基获得40年“塞萨洛尼基特许自治市”；帝国获得25年“爱琴海自治商帮宪章”"
 oe_bp2.17.t: "塞萨洛尼基·白塔血火驻防"
 oe_bp2.17.d: "色雷斯禁卫与豪族联军破门而入，在白塔之下彻底肃清了狂热者余党。被逐的贵族重返故宅，皇室驻军牢牢掌控了城防与税关，但残破的码头与沉寂的街市仍需漫长岁月方能恢复元气。"
 oe_bp2.17.a: "叛乱既平，帝国法度不容挑衅"
 oe_bp2.17.a.tt: "帝国权威 +12；塞萨洛尼基获得40年“白塔皇室重兵驻防”；帝国获得25年“白塔铁腕整肃余威”"
 oe_bp2.18.t: "塞萨洛尼基·市民元老改革"
 oe_bp2.18.d: "在格列高利·帕拉马斯与牧首使节的斡旋下，温和派行会代表与地方元老共同组建了塞萨洛尼基市政参议会。血腥清算得以避免，近代市政治理与文教兴学的火种悄然在这座帝国第二大城点燃。"
 oe_bp2.18.a: "以法度与和解奠定第二首都之长治久安"
 oe_bp2.18.a.tt: "京畿民意 +8；塞萨洛尼基获得40年“塞萨洛尼基市民参议会”；帝国获得25年“圣德米特里市政和解宪章”"
 oe_bp2.19.t: "安纳托利亚"
 oe_bp2.19.d: "帝国旌旗重返安纳托利亚腹地，古老的军区农兵故地正面临治理抉择：是将高地田庄重新分授军屯农兵、复兴鲁姆希腊语教区，还是以轻税牧场契约引导突厥游牧部落定居纳粮？"
 oe_bp2.19.a: "军屯授地，复兴安纳托利亚农兵与希腊教区"
 oe_bp2.19.a.tt: "帝国获得25年“安纳托利亚军屯农兵复兴”；我方控制的士麦那/安卡拉/科尼亚获得25年“安纳托利亚鲁姆复兴镇”"
 oe_bp2.19.b: "宽赋招抚高地部落，以商税与农耕渐化"
 oe_bp2.19.b.tt: "帝国获得25年“小亚细亚宽赋安牧约”；我方控制的士麦那/安卡拉/科尼亚获得25年“安纳托利亚鲁姆复兴镇”"
 oe_bp2.20.t: "埃及·科普特和解与尼罗粮仓"
 oe_bp2.20.d: "阔别七百载后，罗马鹰旗再度飘扬在亚历山大港与尼罗河三角洲之上。科普特主教团恳请皇室尊重自迦克墩以来的本地礼仪自治；而君堡学者则主张重开古老的亚历山大学园，以希腊化文教重塑埃及。"
 oe_bp2.20.a: "承认科普特礼仪自治，确保尼罗河皇家粮仓丰稔"
 oe_bp2.20.a.tt: "帝国获得25年“埃及科普特教会和解约”；我方控制的亚历山大港/开罗获得25年“帝国尼罗河谷粮仓”"
 oe_bp2.20.b: "重开亚历山大希腊学派，振兴古典希腊—罗马教化"
 oe_bp2.20.b.tt: "帝国获得25年“亚历山大希腊学派重兴”；我方控制的亚历山大港/开罗获得25年“帝国尼罗河谷粮仓”"
 oe_bp2.21.t: "意大利：拉文纳总督区与双语律法"
 oe_bp2.21.d: "重掌亚平宁要津后，拉文纳与罗马城邦的法学家们聚集在总督官邸：意大利自治市珍视数百年商法特许，而君士坦丁堡的法典官则希望以《巴西利卡法典》彻底统一东西两境的司法与行政。"
 oe_bp2.21.a: "保留自治市特许，推行拉丁—希腊双语律法"
 oe_bp2.21.a.tt: "帝国获得25年“拉文纳拉丁—希腊双语宪章”；我方控制的拉文纳/罗马获得25年“拉文纳总督区法政枢纽”"
 oe_bp2.21.b: "全境推行《巴西利卡法典》与总督区直辖"
 oe_bp2.21.b.tt: "帝国获得25年“意大利《巴西利卡法典》直辖”；我方控制的拉文纳/罗马获得25年“拉文纳总督区法政枢纽”"
 oe_bp2.22.t: "高卢·拉丁元老入籍与重塑"
 oe_bp2.22.d: "罗马军团跨过阿尔卑斯山重入高卢故土。从马赛古港到里昂、巴黎，西方拉丁领主正观望新罗马的治策：是仿效帝国盛世吸纳高卢贵族进入元老院，还是以统一公文与编户军区重塑西境？"
 oe_bp2.22.a: "设立高卢近卫管区协约，吸纳拉丁贵族入元老院"
 oe_bp2.22.a.tt: "帝国获得25年“高卢元老入籍协约”；我方控制的马赛/里昂/巴黎获得25年“高卢近卫管区治所”"
 oe_bp2.22.b: "推行帝国统一公文与高卢军区编户"
 oe_bp2.22.b.tt: "帝国获得25年“高卢帝国公文与编户制”；我方控制的马赛/里昂/巴黎获得25年“高卢近卫管区治所”"
 oe_bp2.23.t: "反合一牧首与阿索斯修士抗议"
 oe_bp2.23.d: "东西教会合一协议激起千层巨浪：圣山阿索斯的修士们联名檄文谴责背弃正统，君士坦丁堡大批市民拒绝步入宣读合一诏的圣索菲亚大教堂。皇室此刻犹如行走钢丝，稍有不慎便两头失据。"
 oe_bp2.23.a: "强令执行合一礼仪并拘管阿索斯抗议修士"
 oe_bp2.23.a.tt: "京畿民意 -8，教皇国好感 +25，获得10年“圣索菲亚强行合一援军约”"
 oe_bp2.23.b: "外合内守：暗中默许修院与教区保留东正古礼"
 oe_bp2.23.b.tt: "京畿民意 +6，教皇国好感 -15，获得10年“外合内守：默许东正古礼”"
 oe_bp2.24.t: "佛罗伦萨公会议神学微调"
 oe_bp2.24.d: "在公会议的冗长辩论中，东西双方围绕“和子句（Filioque）”与炼狱教义僵持不下。贝萨里翁等希腊人文学者提议以“经由圣子（per Filium）”之教父古语折衷；而以弗所的马可则坚称信经一字不可轻改。"
 oe_bp2.24.a: "采纳“经由圣子”折衷释义，资助希腊学者留驻意邦"
 oe_bp2.24.a.tt: "增进旅意希腊学者交流，教皇国好感 +20，获得12年“佛罗伦萨人文神学桥梁”"
 oe_bp2.24.b: "支持以弗所的马可，坚守尼西亚信经原文"
 oe_bp2.24.b.tt: "京畿民意 +6，教皇国好感 -15，获得12年“以弗所马可信经立场”"
 oe_bp2.25.d_autocephaly: "北疆急报传来：罗斯诸公以君士坦丁堡签署教会合一为由，已在国内主教会议上公然宣告教会自主，不再奉君堡任命之都主教为正朔！这场波及全东正教世界的裂痕，正迫使帝国在战略同盟与牧首宗主权之间做出决断。"
 oe_bp2.25.d_default: "君士坦丁堡签署合一协议的消息传入莫斯科与罗斯诸城后，北方主教团群情激愤，正酝酿自行祝圣都主教、脱离普世牧首管辖（犹如历史上的1448年约拿自治之变）。陛下必须决定如何应对这场北疆教会余波。"
 oe_bp2.25.t: "罗斯都主教区独立余波"
 oe_bp2.25.a: "遣使承认罗斯教会自主地位，换取北疆战略协约"
 oe_bp2.25.a.tt: "帝国权威 -5，罗斯诸国好感 +25，获得15年“北疆自主教会战略协约”"
 oe_bp2.25.b: "坚持普世牧首法统，严词谴责北方擅立都主教"
 oe_bp2.25.b.tt: "帝国权威 +6，罗斯诸国好感 -25，获得15年“重申普世牧首宗主权”"
 oe_bp2.26.t: "五牧首区正统重光"
 oe_bp2.26.d: "帝国未曾向西方屈膝，反凭铁血与信念先后重光古代五牧首区诸圣座！今日圣索菲亚穹顶之下钟声齐鸣，来自安条克、耶路撒冷、亚历山大与罗马的使节共襄盛举，宣告正教普世帝国重临人间。"
 oe_bp2.26.a: "召开圣索菲亚大公会议，昭告五牧首区正统重光"
 oe_bp2.26.a.tt: "帝国权威 +12，京畿民意 +10，获得永久修正“五牧首区正统重光”"
 oe_bp2.26.b: "颁布五牧首区普世学艺与慈悲宪章，泽被万邦"
 oe_bp2.26.b.tt: "京畿民意 +12，获得永久修正“五牧首区普世学艺与慈悲宪章”"
