 oe_pmng_b_manila_silver_accord:0 "隆庆月港—马尼拉白银商约"
 oe_pmng_b_wanli_aid:0 "万历援朝再造之恩"
 oe_pmng_b_nanyang_charter:0 "南洋宝船互市宪章"
 STATIC_MODIFIER_NAME_oe_pmng_mod_weisuo_lijia:0 "洪武卫所军屯与黄册里甲"
 STATIC_MODIFIER_DESC_oe_pmng_mod_weisuo_lijia:0 "世袭军户屯田自养、黄册与鱼鳞图册清丈田亩，大幅降低陆军维持并稳固税基，但商帮活动受限。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_jiangnan_compromise:0 "江南士商宽赋约"
 STATIC_MODIFIER_DESC_oe_pmng_mod_jiangnan_compromise:0 "朝廷适度放宽江南商税与手工业行会限制，商贸与市民活力大增，但军屯动员略逊。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_imperial_kilns:0 "洪武景德镇御窑厂"
 STATIC_MODIFIER_DESC_oe_pmng_mod_imperial_kilns:0 "高岭土与瓷石二元配方配合严苛官窑质控，令大明青花与官窑瓷器独步欧亚市场。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_private_kiln_boom:0 "民窑外销瓷潮"
 STATIC_MODIFIER_DESC_oe_pmng_mod_private_kiln_boom:0 "开放东南沿海与江西民窑承接海外订单，大幅拓展商团运力与海外丝瓷盈余。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_emperor_guards_gate:0 "天子守国门与会通漕运"
 STATIC_MODIFIER_DESC_oe_pmng_mod_emperor_guards_gate:0 "迁都北京震慑塞外，疏浚大运河会通河保障江南漕粮北运，北疆防御与中央控制显著提升。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_nanjing_southern_court:0 "应天金陵富庶中枢"
 STATIC_MODIFIER_DESC_oe_pmng_mod_nanjing_southern_court:0 "以南京上元为帝国中枢，紧贴江南水网与龙江船坞，海权与工商业勃兴而北边鞭长莫及。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_treasure_voyages:0 "三宝太监西洋宝船"
 STATIC_MODIFIER_DESC_oe_pmng_mod_treasure_voyages:0 "龙江宝船厂巨舰七下西洋，直通马六甲、卡利卡特与霍尔木兹，正式接掌海上丝绸之路权杖，但水师耗费巨万。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_northern_retrenchment:0 "停航宝船专守九边"
 STATIC_MODIFIER_DESC_oe_pmng_mod_northern_retrenchment:0 "裁撤耗费浩繁的西洋宝船，将国库与铁木集中投入长城北防与屯田，陆防稳固而远洋声势骤减。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_ming_rome_phoenix:0 "明罗双璧丝路通好"
 STATIC_MODIFIER_DESC_oe_pmng_mod_ming_rome_phoenix:0 "大明与君士坦丁堡双雄通使互市，陆海丝路典籍、丝瓷与历算交相辉映。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_celestial_tribute_dignity:0 "天朝上国朝贡威仪"
 STATIC_MODIFIER_DESC_oe_pmng_mod_celestial_tribute_dignity:0 "以宗藩礼制接待泰西远使，彰显大明正统天命与万邦来朝威仪。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_nine_garrisons:0 "九边长城军镇整饬"
 STATIC_MODIFIER_DESC_oe_pmng_mod_nine_garrisons:0 "吸取土木之变教训，整顿宣府、大同、蓟镇与辽东九边防线，军纪与筑垒大为改观。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_eunuch_directorate:0 "司礼监与厂卫集权"
 STATIC_MODIFIER_DESC_oe_pmng_mod_eunuch_directorate:0 "借内廷厂卫监察百官与边将，皇权与地方控驭上升，却令文官士绅心存芥蒂。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_qi_yuanyang_drill:0 "戚家军鸳鸯阵与佛郎机操典"
 STATIC_MODIFIER_DESC_oe_pmng_mod_qi_yuanyang_drill:0 "十一人生死相依的多兵种鸳鸯阵配合后装佛郎机子母炮，极大强化明军步兵火力与近战韧性。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_coastal_patrol_fleet:0 "东南海防巡哨水师"
 STATIC_MODIFIER_DESC_oe_pmng_mod_coastal_patrol_fleet:0 "广筑卫所海堡并编练抗倭快船水师，有效肃清浙闽沿海倭患并提升海上控制。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_longqing_opening:0 "1567 隆庆月港开关"
 STATIC_MODIFIER_DESC_oe_pmng_mod_longqing_opening:0 "开放福建月港准许民间海商领引出海，承接马尼拉大帆船与石见银山的滔天白银流入。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_customs_quota_trade:0 "市舶司定额抽分制"
 STATIC_MODIFIER_DESC_oe_pmng_mod_customs_quota_trade:0 "以官督商办定额抽分管控外洋白银入关，税入稳健且平抑通胀冲击。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_single_whip_law:0 "1581 一条鞭法与考成法"
 STATIC_MODIFIER_DESC_oe_pmng_mod_single_whip_law:0 "清丈天下田亩、赋役合并折银征收并严行考成，岁入与内阁行政效能大增，但旧勋贵田产隐匿受挫。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_wanli_expeditions:0 "万历三大征东亚威望"
 STATIC_MODIFIER_DESC_oe_pmng_mod_wanli_expeditions:0 "大明远征援朝、平定西南与西北边警，维护东亚宗藩威望，然国库与民力亦付出沉重代价。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_practical_learning:0 "《农政全书》与《天工开物》实学"
 STATIC_MODIFIER_DESC_oe_pmng_mod_practical_learning:0 "徐光启历算火炮实学与宋应星手工业科技典籍并兴，推动大明格物科研、思潮传播与重炮冶铸。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_agricultural_hydraulics:0 "江南水利与农政广布"
 STATIC_MODIFIER_DESC_oe_pmng_mod_agricultural_hydraulics:0 "广修堤堰塘坝并刊行农书推广高产旱作，全国粮产与乡村繁荣度稳步上扬。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_guanning_bastion:0 "关宁锦红衣大炮防线"
 STATIC_MODIFIER_DESC_oe_pmng_mod_guanning_bastion:0 "依托宁远、锦州与山海关重型西洋红衣大炮棱堡体系，以坚城猛火死死扼守辽西走廊。"
 STATIC_MODIFIER_NAME_oe_pmng_loc_ningyuan_fortress:0 "宁远红衣大炮棱堡"
 STATIC_MODIFIER_DESC_oe_pmng_loc_ningyuan_fortress:0 "袁崇焕修筑的坚城与红衣重炮炮台，令敌军攻城受挫并极大稳固辽西控驭。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_1644_salvation:0 "常平赈济与开海自铸银元"
 STATIC_MODIFIER_DESC_oe_pmng_mod_1644_salvation:0 "以常平仓平粜救荒并借海贸自铸银元化解银荒通缩，成功平抑民变渡过明末小冰期大考。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_sanxiang_surtax:0 "辽饷剿饷练饷三饷加派"
 STATIC_MODIFIER_DESC_oe_pmng_mod_sanxiang_surtax:0 "战时强征三饷勉强筹措军费与兵源，却令百姓苦不堪言、流寇烽烟四起。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_pacific_nanyang:0 "太平洋大明宝船与南洋保护领"
 STATIC_MODIFIER_DESC_oe_pmng_mod_pacific_nanyang:0 "挺过大劫的中兴大明重开远洋，以南洋商站与跨太平洋宝船掌控东亚海洋贸易主导权。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_domestic_grand_market:0 "江南运河天下大市场"
 STATIC_MODIFIER_DESC_oe_pmng_mod_domestic_grand_market:0 "深耕国内丝瓷茶粮一体化大市场，岁入与手工业产效冠绝欧亚大陆。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_constitutional_secretariat:0 "泰西格致院与责任宪政内阁"
 STATIC_MODIFIER_DESC_oe_pmng_mod_constitutional_secretariat:0 "将内阁票拟制度升华为近代责任内阁，兼融格致实学与常备火炮海军，傲立十八世纪世界之林。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_enlightened_ming_autocracy:0 "大明开明圣断集权体制"
 STATIC_MODIFIER_DESC_oe_pmng_mod_enlightened_ming_autocracy:0 "以清廉高效的内阁考成与常备神机新军强化天子乾纲，四海承平、国用充裕。"
 STATIC_MODIFIER_NAME_oe_pmng_mod_southern_ming_rally:0 "南明江南孤忠抗战"
 STATIC_MODIFIER_DESC_oe_pmng_mod_southern_ming_rally:0 "虽失燕京而江南半壁犹存！士民同仇敌忾固守江淮与东南水师，绝不轻易崩盘。"
 oe_pmng_ref_grand_secretariat_reform:0 "考成内阁与实学兴邦"
 oe_pmng_ref_grand_secretariat_reform_desc:0 "以张居正考成法约束六部督抚，并赞助农政历算与工业实学，全面提升大明财税、科研与立法效能。"
 oe_pmng_ref_maritime_celestial_empire:0 "开海天朝宝船帝国"
 oe_pmng_ref_maritime_celestial_empire_desc:0 "承续郑和七下西洋与隆庆开关之志，以龙江巨舰与四海市舶打造贯通印度洋与太平洋的大明海权帝国。"
 oe_pmng_haijin_policy_law:0 "大明海禁与开海国策"
 oe_pmng_haijin_policy_law_desc:0 "界定大明王朝在「寸板不得下海」的内守海禁、隆庆月港开海通商与国家主导宝船远航之间的海洋战略取向。"
 oe_pmng_pol_strict_haijin:0 "洪武海禁守边制"
 oe_pmng_pol_strict_haijin_desc:0 "严禁片板下海，将国力集中于北疆九边防务、农业生产与基层里甲稳定。"
 oe_pmng_pol_longqing_open_ports:0 "隆庆月港开海制"
 oe_pmng_pol_longqing_open_ports_desc:0 "准许东南海商领引出海赴南洋与马尼拉互市，以丝瓷换回丰沛白银充盈国库。"
 oe_pmng_pol_imperial_treasure_fleets:0 "大明天朝宝船制"
 oe_pmng_pol_imperial_treasure_fleets_desc:0 "由朝廷龙江船厂统造巨型宝船与护航战舰，主动巡弋马六甲与印度洋，接掌海上丝绸之路。"
 oe_pmng_jingdezhen_kiln:0 "景德镇御窑与龙江船政署"
 oe_pmng_jingdezhen_kiln_desc:0 "始设于洪武二年（1369）的官窑瓷业与江南龙江造船中枢。融汇高岭土二元瓷艺与远洋商船工坊，大幅提升本地手工业产效、商容与繁荣度。"
 oe_pmng_jingdezhen_kiln_maint:0 "御窑船政常例原料"
 oe_pmng_yuanyang_musketeers:0 "戚家军鸳鸯阵火铳兵"
 oe_pmng_yuanyang_musketeers_desc:0 "戚继光抗倭创制的十一人鸳鸯阵精锐：藤牌、狼筅、长枪、镗钯与鸟铳严密协同，在东南水网丘陵与野战白刃中锐不可当。"
 oe_pmng_shenjiying_artillery:0 "神机营佛郎机与红衣重炮"
 oe_pmng_shenjiying_artillery_desc:0 "融合后装佛郎机子母炮高射速与宁远西洋红衣大炮重磅轰击威力的大明神机营精锐炮队，攻城守关皆具雷霆之威。"
 oe_pmng_adv_yuanyang_folangji:0 "鸳鸯阵与佛郎机红衣炮制式"
 oe_pmng_adv_yuanyang_folangji_desc:0 "总结戚继光《纪效新书》多兵种步兵协同操典与佛郎机、红衣大炮铸造规程，解锁戚家军鸳鸯阵火铳兵与神机营红衣重炮。"
 oe_pmng_dec_sponsor_treasure_voyages.title:0 "重启宝船远航接掌海丝"
 oe_pmng_dec_sponsor_treasure_voyages.desc:0 "拨银重启龙江宝船厂并派遣大明远洋宝船南下马六甲、卡利卡特与霍尔木兹，正式接掌海上丝绸之路权杖并推升开海倾向。"
 oe_pmng_dec_sponsor_treasure_voyages.a:0 "扬帆西洋，再振宝船威仪"
 oe_pmng_dec_sponsor_treasure_voyages_tt:0 "确立「明罗双璧」海上丝路承接标志（oe_pmng_took_maritime_mantle = 1），大幅提升开海轴并获得 25 年远洋宝船增益。"
 oe_pmng_dec_enact_single_whip.title:0 "推行张居正一条鞭法与考成法"
 oe_pmng_dec_enact_single_whip.desc:0 "清丈全国田亩、将繁杂丁徭田赋合并折银征收，并以考成法考核六部与地方官吏，显著提升银本位财政健康度与岁入。"
 oe_pmng_dec_enact_single_whip.a:0 "颁行天下，一鞭清税"
 oe_pmng_dec_enact_single_whip_tt:0 "显著提升一条鞭银本位健康度，获得 35 年一条鞭与考成法增益（短期内将引起部分勋贵士绅不满）。"
 oe_pmng_dec_fortify_guanning_line.title:0 "修筑关宁锦红衣大炮防线"
 oe_pmng_dec_fortify_guanning_line.desc:0 "调拨银两在宁远、锦州与山海关沿线增筑西洋式棱堡并铸造红衣大炮，提升关宁防线等级并在「山海关决战」局势中压制满洲破关攻势。"
 oe_pmng_dec_fortify_guanning_line.a:0 "铸炮固关，死守辽西"
 oe_pmng_dec_fortify_guanning_line_tt:0 "关宁红衣防线等级 +1（上限 4），加固宁远与抚宁城防，若「山海关决战」局势已启则直接削减敌军破关压力。"
 oe_pmng.1.title:0 "日月重光：洪武定鼎与卫所里甲大册"
 oe_pmng.1.desc:0 "驱除乱局、定鼎应天（上元）之后，朝廷面临百废待兴的田赋与兵制重建。洪武勋臣力主在全国设立世袭军屯「卫所制」，令百万军户耕战自给，并编造黄册与鱼鳞图册确立基层「里甲制」；江南士绅则建言适度放宽商贸行会以活络市镇财源。"
 oe_pmng.1.a:0 "立卫所军屯，造黄册鱼鳞图册"
 oe_pmng.1.b:0 "兼顾江南士商，宽赋活络市镇"
 oe_pmng.2.title:0 "洪武二年景德镇御窑厂开窑"
 oe_pmng.2.desc:0 "洪武二年，朝廷于饶州浮梁景德镇置御窑厂，精研高岭土与瓷石二元配方，烧造官窑青花与釉里红，凡有一丝瑕疵皆击碎深埋以守天下第一窑之誉。官营御窑将铸就无双文化威望与皇室专卖，而放开民窑外销则可迅速拉动东南海贸。"
 oe_pmng.2.a:0 "专设景德镇御窑厂，精铸官窑青花"
 oe_pmng.2.b:0 "官民并窑，大开东南外销瓷业"
 oe_pmng.3.title:0 "天子守国门：迁都大都（北京）与大运河会通河疏浚"
 oe_pmng.3.desc:0 "北疆草原强敌犹在，朝堂就帝都所在激辩不休。主张北迁者力陈「天子守国门」，迁都大都并斥巨资疏浚大运河会通河以济北粮，可扼长城险要；主张留都应天（上元）者则强调江南乃财赋与龙江船政根本。"
 oe_pmng.3.a:0 "迁都大都，疏浚会通河以守国门"
 oe_pmng.3.b:0 "坚守金陵应天，经略江南与南洋"
 oe_pmng.4.title:0 "三宝太监郑和七下西洋"
 oe_pmng.4.desc:0 "龙江宝船厂巨桅林立，三宝太监郑和率领百艘宝船扬帆南下，远抵马六甲、科泽科德（卡利卡特）、霍尔木兹直至东非海岸，万国来朝。然文臣屡谏造船耗费国帑且北疆告急。大明是继续扬帆西洋、接棒海上丝绸之路权杖，还是就此停航转守北疆？"
 oe_pmng.4.a:0 "续航西洋宝船，接掌海上丝绸之路"
 oe_pmng.4.b:0 "裁撤宝船省费，移银增戍北疆"
 oe_pmng.5.title:0 "明罗双璧：东罗马使节抵华与丝路重续"
 oe_pmng.5.desc:0 "来自博斯普鲁斯海峡彼岸的东罗马使团携紫袍国书与星盘珍本跋涉万里抵达大明朝廷！无论循陆上河中商道抑或郑和宝船开辟的印度洋海路，东西两大帝国隔陆遥望、丝瓷香料互通有无，「明罗双璧」的跨欧亚新格局就此展开。"
 oe_pmng.5.a:0 "缔结明罗通商修好国书，重续欧亚丝路"
 oe_pmng.5.b:0 "循天朝礼制厚赐回礼，彰显大明威仪"
 oe_pmng.6.title:0 "土木警钟与九边长城军镇"
 oe_pmng.6.desc:0 "漠北草原骑军频频叩关，京营宿将凋零而内廷司礼监与外朝内阁暗潮汹涌。土木警钟既鸣，大明必须痛下决心重修宣大、蓟辽九边长城并整饬边军，或以厂卫强权铁腕集权弹压朝野。"
 oe_pmng.6.a:0 "重修九边长城，委重臣整顿京营边军"
 oe_pmng.6.b:0 "强化司礼监与厂卫监察，以严刑控驭百官"
 oe_pmng.7.title:0 "南倭北虏：戚家军鸳鸯阵与佛郎机火炮"
 oe_pmng.7.desc:0 "浙闽东南沿海海盗倭寇肆虐，旧日卫所兵不堪一战。名将戚继光招募义乌矿工农夫，创制十一人长短兵器与鸟铳互补的「鸳鸯阵」，并在战船堡垒广泛列装后装子母炮「佛郎机」，一举重塑大明陆海火器战法。"
 oe_pmng.7.a:0 "颁行戚家军鸳鸯阵，列装佛郎机子母炮"
 oe_pmng.7.b:0 "广造福船巡哨水师，筑垒靖平东南海疆"
 oe_pmng.8.title:0 "1567 隆庆开关与马尼拉白银大帆船"
 oe_pmng.8.desc:0 "隆庆元年，福建漳州月港正式开关准许民间海商领引出海。不久后跨太平洋马尼拉（马尼拉港）白银大帆船航线与日本石见（迩摩）银山同时涌入巨量白银，江南生丝、景德镇青花与美洲白银汇成史无前例的跨洋银潮。"
 oe_pmng.8.a:0 "全面推行隆庆开关，拥抱马尼拉白银大帆船"
 oe_pmng.8.b:0 "以市舶定额抽分节制外银，防范通胀失控"
 oe_pmng.9.title:0 "1581 张居正考成法与一条鞭法"
 oe_pmng.9.desc:0 "万历九年，首辅张居正清丈天下田亩并全面推行「一条鞭法」，将繁琐杂役与夏税秋粮归并折银征收，复以「考成法」月考岁核百官政绩。国库太仓积银顿时充盈，江南商品经济空前繁荣，然国家财政亦从此深系全球白银供给命脉。"
 oe_pmng.9.a:0 "铁腕推行考成与一条鞭法，清丈豪强隐田"
 oe_pmng.9.b:0 "先于江南行省试行折银，缓步推进减少震荡"
 oe_pmng.10.title:0 "万历三大征与东亚战略透支"
 oe_pmng.10.desc:0 "东北朝鲜告急、西南播州生变、西北宁夏哗变接踵而至！大明若全力出师援朝平乱，必能捍卫东亚宗藩秩序并扬天朝军威，却将令张居正攒下的白银太仓耗损大半；若收缩固守边关，则可保全财力以备辽东大患。"
 oe_pmng.10.a:0 "兴师援朝平乱，捍卫大明东亚秩序"
 oe_pmng.10.b:0 "固守要冲节用保银，蓄力以待北疆剧变"
 oe_pmng.11.title:0 "《农政全书》与《天工开物》：徐光启—宋应星实学启蒙"
 oe_pmng.11.desc:0 "礼部尚书徐光启合译《几何原本》、纂修《崇祯历书》与《农政全书》，并力主聘匠铸造泰西红衣重炮；江西学人宋应星则著成工业科技巨典《天工开物》，详载冶金、造船、火药与纺织之术。大明迎来东亚实学启蒙的耀眼曙光。"
 oe_pmng.11.a:0 "设实学格致馆与西洋火炮局，重奖工匠学人"
 oe_pmng.11.b:0 "刊行农书广修水利，先安天下亿兆生计"
 oe_pmng.12.title:0 "1626 宁远大捷：袁崇焕与红衣大炮防线"
 oe_pmng.12.desc:0 "辽东烽烟滚滚，督师袁崇焕率孤军凭宁远坚城与十一门西洋红衣大炮浴血死守，重炮连发轰碎攻城盾车，令八旗铁骑铩羽而归！以此战为转折，大明得以构筑绵延山海关（抚宁）、宁远与锦州的关宁红衣防线，扭转辽西战局。"
 oe_pmng.12.a:0 "依托宁远筑关宁锦红衣防线，扼守山海关门户"
 oe_pmng.12.b:0 "以关宁铁骑出塞反击，主战辽东野战"
 oe_pmng.13.title:0 "崇祯大考：小冰期、银荒通缩与救亡革新"
 oe_pmng.13.desc:0 "酷寒小冰期席卷华北、连年旱蝗饥荒，加之跨洋白银骤减与锁国断流，一条鞭银本位陷入严重通缩危机，流寇与辽东烽火两面夹击！若朝廷及时广开常平仓平粜赈济并开放海贸自铸官银，或可逆转天命、挺过甲申大劫；否则惟有横征三饷饮鸩止渴。"
 oe_pmng.13.a:0 "开常平义仓平粜救荒，开海通商自铸大明银元"
 oe_pmng.13.b:0 "急征辽饷剿饷练饷，竭泽而渔以筹军费"
 oe_pmng.14.title:0 "中兴大明：太平洋大明宝船与南洋华商保护领"
 oe_pmng.14.desc:0 "挺过十七世纪气候与银荒大考的大明焕发新生！东南海商与新式帆炮巨舰纵横马六甲、马尼拉与南洋诸港，朝廷可借机敕建「南洋华商保护领」直面西欧殖民公司，亦可专精江南运河国内超级市场厚积国力。"
 oe_pmng.14.a:0 "敕建南洋保护领与太平洋宝船商路"
 oe_pmng.14.b:0 "深耕江南运河天下大市场，富民强国"
 oe_pmng.15.title:0 "泰西格致院与大明近代宪政内阁"
 oe_pmng.15.desc:0 "步入十八世纪全球工业与启蒙浪潮，大明面临终局制度升华。朝廷既可将百年内阁票拟制与泰西格致院结合，确立近代责任内阁与常备火炮海军；亦可在开明圣断之下以铁腕考成统领东方巨帝。"
 oe_pmng.15.a:0 "立泰西格致院与近代责任宪政内阁"
 oe_pmng.15.b:0 "秉开明圣断，以考成强军统御四海"
 oe_pmng.16.title:0 "南明续命与江南孤忠"
 oe_pmng.16.desc:0 "京师大都虽暂陷敌手，江南、闽浙与岭南半壁江山犹奉大明正朔！忠义士民与水师将领云集金陵、福州与广州，誓以长江天堑与海上财源重整山河、绝不轻言亡国。"
 oe_pmng.16.a:0 "誓守江南半壁，厉兵秣马图谋北伐"
 oe_pmng.16.b:0 "倚重闽粤海师与南洋财源，以海养陆"
 oe_pmng.90.title:0 "【审计读数】大明双轨主角线状态面板"
