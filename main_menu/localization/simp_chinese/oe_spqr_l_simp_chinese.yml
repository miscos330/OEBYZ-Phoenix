 oe_spqr_cab_mare_nostrum_staple:0 "地中海商港与航运专卖委任"
 oe_spqr_cab_mare_nostrum_staple_desc:0 "派遣元老院海务特使进驻沿海行省统筹护航商队、港口关榷与造船船坞，显著提升海贸效率、海权存在、本地商港竞争力与造船速度。"
