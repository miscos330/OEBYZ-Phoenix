 oe_spqr_pi_lex_agraria_civitas:0 "《农地与罗马市民权法（Lex Agraria & Civitas）》"
 oe_spqr_pi_lex_agraria_civitas_desc:0 "仿效格拉古改革精神颁行农地分配与罗马市民权扩展法案，保障意大利诸市镇自耕农田产并加速文化融合，显著提高人口增长、同化速度与粮食供给，略微触动大贵族庄园权益。"
 oe_spqr_pi_classis_mare_nostrum:0 "《“我们的海”舰队整备法案（Classis Mare Nostrum）》"
 oe_spqr_pi_classis_mare_nostrum_desc:0 "由元老院海军委员会统筹威尼斯、热那亚与第勒尼安造船厂军工订单，大幅强化桨帆战舰战力、海贸效率与地中海制海存在，唯须承担更高海军维护开销。"
 oe_spqr_pi_senatus_consultum_ultimum:0 "《元老院终极紧急法令（Senatus Consultum Ultimum）》"
 oe_spqr_pi_senatus_consultum_ultimum_desc:0 "元老院援引古老终极紧急法令授权执政官“务保共和国不受任何损害”，显著强化陆军军纪、野战士气与要塞防卫，但短期内略微紧缩民间自由。"
 oe_spqr_pi_via_consularis_ports:0 "《执政官大道与商港营建法（Via Consularis & Ports）》"
 oe_spqr_pi_via_consularis_ports_desc:0 "重修贯通罗马、伦巴第、托斯卡纳与亚得里亚良港的石砌执政官大道与商港码头，大幅缩短筑路工期、强化地方控制力并提振全国商贸岁入。"
 oe_spqr_pa_patrician_senate_seats:0 "确认元老世家晋升阶梯（Cursus Honorum）"
 oe_spqr_pa_patrician_senate_seats_desc:0 "在元老院确认名门世家的公职晋升序列以换取贵族元老票数，稳固贵族拥护并提升外交声望。"
 oe_spqr_pa_equestrian_proconsul_commissions:0 "骑士阶层与行省军政委任状"
 oe_spqr_pa_equestrian_proconsul_commissions_desc:0 "委任骑士与贵族将佐出任边防军官及行省监军以赢取议会支持，提升陆军传统与属国忠诚。"
 oe_spqr_pa_san_giorgio_staple_charter:0 "圣乔治与兵工厂海贸信用特许"
 oe_spqr_pa_san_giorgio_staple_charter_desc:0 "确认公债兑付与商业银行特许权以争取市民议席支持，压低借贷利率并提升商贸盈利。"
 oe_spqr_pa_mediterranean_free_ports:0 "地中海自由商港免榷协约"
 oe_spqr_pa_mediterranean_free_ports_desc:0 "减免意大利与东地中海商船队转口关税以争取商帮代表赞成票，扩大海商运力与海贸效率。"
 oe_spqr_pa_plebeian_tribune_grain:0 "保民官护民与公民官粮赈济"
 oe_spqr_pa_plebeian_tribune_grain_desc:0 "拨款充实城市官仓并确认保民官护民权以赢得公民大会支持，稳固底层民心与粮食供给。"
 oe_spqr_pa_lateran_basilica_endowment:0 "卡比托利欧与罗马大殿修缮奉纳"
 oe_spqr_pa_lateran_basilica_endowment_desc:0 "拨付市政大教堂与罗马圣殿修缮专款以安抚教士阶层、调和教俗关系，增进稳定度与宗教威望。"
 oe_spqr_cab_census_civitas:0 "户籍普查与罗马市民权扩展"
 oe_spqr_cab_census_civitas_desc:0 "委派共和国监察官巡行目标行省编审户籍并授予罗马市民权，显著加速文化同化、领地整合与地方控制度增长。"
