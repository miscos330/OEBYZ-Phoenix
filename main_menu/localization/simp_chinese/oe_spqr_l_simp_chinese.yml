 OE_SPQR_COUNTRY_NAME:0 "新罗马共和国（S.P.Q.R.）"
 OE_SPQR_COUNTRY_ADJ:0 "新罗马共和"
 oe_spqr_senate:0 "罗马元老院与公民大会（Senatus et Comitia）"
 oe_spqr_senate_desc:0 "在卡比托利欧山上重建古典共和国的双柱宪政：由世家元老与海商显贵主持大政与海权方略，并与市民及自由公民大会协同立法，显著提升立法效率、共和传统与海权存在，同时赋予市民与贵族更强议政分量。"
 oe_spqr_res_publica_reform:0 "新罗马共和国宪制（双执政官与元老院）"
 oe_spqr_res_publica_reform_desc:0 "重立由元老院辅佐的双执政官共治宪制，将意大利海贸金融、海外行省总督忠诚与公民军团熔铸为帝国级罗马共和国。"
 oe_spqr_proconsul_reform:0 "罗马共和行省总督府制"
 oe_spqr_proconsul_reform_desc:0 "奉元老院诏书设立于地中海海外行省的共和总督体制，兼顾海港商贸、文化同化与边海防务。"
 oe_spqr_proconsul:0 "罗马共和行省总督"
 oe_spqr_proconsul_desc:0 "由新罗马共和国或意大利诸共和国在地中海沿岸（高卢、西班牙、阿非利加、伊利里亚与希腊、亚细亚、叙利亚与埃及）册封的专属共和行省总督属国。它与宗主共享地图色块但保留古典行省名号，必应一切攻防征召、上缴行省财赋、强化海权与文化同化，且不受普通外交吞并干扰。"
 LEAD_oe_spqr_proconsul:0 "$LIST$为[SUBJECT_TYPE.GetName]"
 AM_oe_spqr_proconsul:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_spqr_proconsul_subject_opinion:0 "元老院行省总督委任"
 oe_spqr_proconsul_overlord_opinion:0 "罗马共和行省总督"
 oe_spqr_op_proconsul_charter:0 "获封罗马共和行省总督"
 oe_spqr_op_lateran_concordat:0 "拉特兰共和政教协约"
 oe_spqr_op_avignon_exile:0 "驱逐教廷出罗马"
 oe_spqr_op_two_romes_accord:0 "双罗马地中海协约"
 oe_spqr_op_two_romes_rivalry:0 "痛斥东方皇权专制"
 oe_spqr_op_black_sea_pact:0 "黑海—地中海谷物商贸协约"
 oe_spqr_dec_support_rienzo.title:0 "声援科拉·迪·里恩佐与古典共和同盟"
 oe_spqr_dec_support_rienzo.desc:0 "公开声援1347年罗马护民官在卡比托利欧山发出的意大利古典共和号召，点燃共和复兴局势、提振共和传统，并对盘踞罗马的教宗世俗统治确立进军大义。"
 oe_spqr_dec_support_rienzo.a:0 "遣使资援卡比托利欧护民官"
 oe_spqr_dec_support_rienzo_tt:0 "点燃#Y 古典共和复兴#!局势，获得持续#Y 15#!年的护民官古典共和同盟加成，若教宗国仍据有罗马则立即获得宣战理由。"
 oe_spqr_dec_proclaim_roman_republic.title:0 "宣告《新罗马共和国（S.P.Q.R.）》"
 oe_spqr_dec_proclaim_roman_republic.desc:0 "既已克复永恒之城罗马并掌控至少两座意大利大都会枢纽，我方登上卡比托利欧山庄严宣告建立帝国级《新罗马共和国（S.P.Q.R.）》——启用双执政官与元老院宪制，重开罗马元老院议会，并解锁光复罗马疆域的宏图大志。"
 oe_spqr_dec_proclaim_roman_republic.a:0 "于卡比托利欧山重举 S.P.Q.R. 鹰旗！"
 oe_spqr_dec_proclaim_hubs_tt:0 "自身或属国控制威尼斯、热那亚、佛罗伦萨、比萨、米兰、那不勒斯、巴勒莫中的至少#Y 2#!座意大利大都会。"
 oe_spqr_dec_proclaim_roman_republic_tt:0 "将共和国晋升为#Y 帝国级#!，更名为#Y 新罗马共和国（S.P.Q.R.）#!，启用#Y 新罗马共和国宪制#!与#Y 罗马元老院与公民大会#!，解锁#Y 光复罗马疆域#!宣战理由，并触发卡比托利欧建国大典事件。"
 oe_spqr_dec_proconsul_west.title:0 "册封西地中海罗马行省总督（高卢／西班牙／阿非利加）"
 oe_spqr_dec_proconsul_west.desc:0 "将意大利本土以外的西地中海征服领地册封为忠诚的罗马共和行省总督府——可在高卢（马赛）、西班牙（巴塞罗那）或阿非利加（突尼斯）之中择一建省，绝不割让首都或罗马、威尼斯、热那亚、佛罗伦萨、比萨等核心都市。"
 oe_spqr_dec_proconsul_west.a:0 "召开西地中海行省册封大会"
 oe_spqr_dec_proconsul_west_req_tt:0 "在尚未建省的西地中海行省区（高卢／西班牙／阿非利加）直接拥有至少#Y 3#!处非核心直辖领地。"
 oe_spqr_dec_proconsul_west_tt:0 "触发西地中海行省册封事件，自选建立#Y 高卢#!、#Y 西班牙#!或#Y 阿非利加#!罗马共和行省总督府（确认建省消耗 120 金币，绝不动用首都或意大利本土）。"
 oe_spqr_dec_proconsul_east.title:0 "册封东地中海罗马行省总督（希腊／亚细亚／叙利亚埃及）"
 oe_spqr_dec_proconsul_east.desc:0 "将意大利本土以外的东地中海征服领地册封为忠诚的罗马共和行省总督府——可在伊利里亚与希腊（雅典／塞萨洛尼基）、亚细亚（士麦那）或叙利亚与埃及（亚历山大港／安条克）之中择一建省，绝不割让首都、意大利核心或君士坦丁堡。"
 oe_spqr_dec_proconsul_east.a:0 "召开东地中海行省册封大会"
 oe_spqr_dec_proconsul_east_req_tt:0 "在尚未建省的东地中海行省区（伊利里亚与希腊／亚细亚／叙利亚与埃及）直接拥有至少#Y 3#!处非核心直辖领地。"
 oe_spqr_dec_proconsul_east_tt:0 "触发东地中海行省册封事件，自选建立#Y 伊利里亚与希腊#!、#Y 亚细亚#!或#Y 叙利亚与埃及#!罗马共和行省总督府（确认建省消耗 120 金币，绝不动用首都、意大利核心或君士坦丁堡）。"
 oe_spqr_dec_appoint_dictator.title:0 "颁行《元老院终极法令》（任命战时独裁官）"
 oe_spqr_dec_appoint_dictator.desc:0 "战火燃起之际，元老院依古制任命战时独裁官执掌五年紧急军权，大幅强化陆军军纪、野战士气与攻城战力，代价为#R -10#!共和传统。五年期满时，独裁官将面临辛辛那图斯归还束棒或凯撒渡过卢比孔河的终极考验。"
 oe_spqr_dec_appoint_dictator.a:0 "授以二十四束棒紧急军权五年"
 oe_spqr_dec_appoint_dictator_tt:0 "赋予持续#Y 5#!年的战时独裁官军事加成（军纪、士气、攻城与维护效率），五年后触发#Y 辛辛那图斯归还束棒（或凯撒诱惑）#!抉择事件（冷却 10 年）。"
 oe_spqr_dec_extend_civitas.title:0 "颁布《安东尼努斯市民权整合敕令》"
 oe_spqr_dec_extend_civitas.desc:0 "面向意大利自治市镇与地中海诸港颁行普世市民权整合敕令，赋予持续#Y 15#!年的文化同化、领地整合与总督忠诚加成，并提升首都与罗马城繁荣度。"
 oe_spqr_dec_extend_civitas.a:0 "将诸自由城邦载入罗马市民名册"
 oe_spqr_dec_extend_civitas_tt:0 "获得持续#Y 15#!年的#Y 安东尼努斯敕令#!加成，提升首都与罗马城繁荣度，并令全部行省总督独立倾向降低#G -10#!（冷却 10 年）。"
 oe_spqr_dec_stato_gazaria_merger.title:0 "合并威尼斯海上领地、热那亚加扎里亚与比萨港为罗马海权联合银行"
 oe_spqr_dec_stato_gazaria_merger.desc:0 "既已统摄多座意大利商业都城，元老院将威尼斯兵工厂账房、热那亚圣乔治银行与比萨—托斯卡纳商港汇兑合并为常驻的《罗马海权联合银行》，永久提升海贸收入、借贷信用与商人竞争力。"
 oe_spqr_dec_stato_gazaria_merger.a:0 "敕立罗马海权联合银行"
 oe_spqr_dec_stato_gazaria_req_tt:0 "自身或属国控制威尼斯、热那亚、比萨、佛罗伦萨、杜布罗夫尼克、安科纳、那不勒斯、巴勒莫中的至少#Y 2#!座商港重镇。"
 oe_spqr_dec_stato_gazaria_merger_tt:0 "永久建立#Y 罗马海权联合银行#!，常驻提供贸易收入、海贸效率、低息信用与扩大借贷上限。"
 oe_spqr_dec_papal_lateran_settlement.title:0 "解决罗马城教宗问题（拉特兰协约 vs 迁居阿维尼翁）"
 oe_spqr_dec_papal_lateran_settlement.desc:0 "共和国旗帜既已飘扬罗马城头，元老院必须彻底厘清教宗地位：是签署《拉特兰共和政教协约》保障梵蒂冈属灵独立以换取天主教世界善意，还是坚持卡比托利欧世俗主权、迫使教廷退居阿维尼翁？"
 oe_spqr_dec_papal_lateran_settlement.a:0 "在元老院开启教宗问题终局辩论"
 oe_spqr_dec_papal_lateran_settlement_tt:0 "触发#Y 罗马教宗问题#!事件，在#Y 拉特兰共和政教协约#!与#Y 世俗主权：教廷退居阿维尼翁#!之间作出历史抉择。"
 oe_sit_spqr_revival:0 "元老院与罗马人民：古典共和复兴"
 oe_sit_spqr_revival_desc:0 "由1347年科拉·迪·里恩佐在卡比托利欧山点燃星火，经威尼斯、热那亚、比萨、佛罗伦萨、锡耶纳、卢卡、拉古萨与安科纳诸意大利共和国薪火相传，一场席卷亚平宁的古典复兴浪潮正蓄势待发：推翻僭主与教廷世俗割据，在地中海重铸《新罗马共和国（S.P.Q.R.）》！"
 oe_sit_spqr_revival_outcome_spqr:0 "新罗马共和国光复大捷"
 oe_sit_spqr_revival_outcome_spqr_desc:0 "已宣告建立《新罗马共和国（S.P.Q.R.）》，且古典共和势能达到 75（满 24 个月）或已册封至少两座地中海行省总督府。"
 oe_sit_spqr_revival_outcome_papacy:0 "教廷与君主秩序重固"
 oe_sit_spqr_revival_outcome_papacy_desc:0 "局势持续满 36 个月仍未宣告新罗马共和国，且古典共和势能跌至 20 及以下，教廷与君主政权牢控意大利。"
 oe_sit_spqr_revival_outcome_equilibrium:0 "文艺复兴城邦均势底定"
 oe_sit_spqr_revival_outcome_equilibrium_desc:0 "至 1560 年双方皆未彻底定鼎时，古典共和浪潮沉淀为文艺复兴意大利与地中海持久的多极均势格局。"
 OE_SPQR_SIT_TITLE:0 "古典共和复兴势能与地中海整合"
 OE_SPQR_SIT_MOM_L:0 "教廷与诸侯旧序（20）"
 OE_SPQR_SIT_MOM_R:0 "S.P.Q.R. 共和鼎盛（75）"
 OE_SPQR_SIT_MOM_FOOT:0 "实时追踪里恩佐起义、罗马归属、意大利诸共和重镇与地中海据点。宣告新罗马共和国并使势能达 75 或册封 2 座行省总督即获大捷。"
 OE_SPQR_SIT_PHASE_KPI:0 "复兴阶段"
 OE_SPQR_SIT_PROCONSULS_KPI:0 "地中海行省总督"
 OE_SPQR_SIT_MARE_KPI:0 "地中海整合度"
