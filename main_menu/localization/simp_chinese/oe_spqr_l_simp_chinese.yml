 oe_spqr_law_consular_imperium:0 "《执政官任期与独裁官紧急法》"
 oe_spqr_law_consular_imperium_desc:0 "界定新罗马共和国最高行政军政权力的根本大法：在双执政官年度轮任制衡、战时独裁官紧急授权与终身元老院首席（第一公民）之间作出宪政抉择。"
 oe_spqr_pol_dual_consuls:0 "双执政官年度轮任制"
 oe_spqr_pol_dual_consuls_desc:0 "由公民大会每年选举两名权力平等、互具否决权的执政官共掌国政，最大限度守护共和传统、立法效率与外交声誉，唯略制约中枢集权速度。"
 oe_spqr_pol_dictator_mandate:0 "战时独裁官紧急授权制"
 oe_spqr_pol_dictator_mandate_desc:0 "将危急存亡之际由元老院任命战时独裁官与骑兵长官的机制法典化，显著强化军纪、陆军士气与攻城能力，但长期侵蚀共和传统并令市民阶层心怀戒惧。"
 oe_spqr_pol_princeps_senatus:0 "终身元老院首席制（Princeps Senatus）"
 oe_spqr_pol_princeps_senatus_desc:0 "尊奉威望卓著的元老领袖为终身元老院首席兼共和第一公民，兼采威尼斯总督与元首制精义，显著提高内阁效率、地方控制与中央权威，唯压抑平民阶层政治话语权。"
 oe_spqr_law_civitas_romana:0 "《罗马市民权扩展法（Civitas Romana）》"
 oe_spqr_law_civitas_romana_desc:0 "规定罗马市民权的授予范围与阶层边界：从严守城邦贵族排他特权、向意大利诸同盟城邦开放公民权，直至推行泛地中海普世罗马市民共同体。"
 oe_spqr_pol_patrician_franchise:0 "贵族元老专属市民权"
 oe_spqr_pol_patrician_franchise_desc:0 "将完整选举权与高级公职限定于登记在册的世家贵族与旧商贾豪门，提升正税效率与贵族凝聚力，但放缓新征服行省的文化融合步伐。"
 oe_spqr_pol_italian_socii:0 "意大利同盟邦市民权（Socii）"
 oe_spqr_pol_italian_socii_desc:0 "向自阿尔卑斯至西西里的意大利自治市镇广泛授予同盟邦市民权，显著壮大公民兵源、文化同化与城镇晋升，同时略微让利地方税赋。"
 oe_spqr_pol_universal_med_civitas:0 "泛地中海普世罗马市民权"
 oe_spqr_pol_universal_med_civitas_desc:0 "效法《安东尼努斯敕令》精神，将罗马法公民资格普授于自西班牙至亚历山大港的各行省自由民，极大加速同化、提升宽容并遏制分离倾向，但触动传统意大利贵族优越感。"
 oe_spqr_law_proconsular_admin:0 "《海上行省总督（Proconsul）法》"
 oe_spqr_law_proconsular_admin_desc:0 "规范共和国统御地中海海外行省的制度模式：在自治商业行省总督、元老院巡察稽核共治与罗马法官直辖中央集权三条道路间权衡取舍。"
 oe_spqr_pol_commercial_proconsuls:0 "自治商业行省总督制"
 oe_spqr_pol_commercial_proconsuls_desc:0 "赋予海外行省总督高度港口与商事自治权，大幅提升属国忠诚、外交容量与海贸营收，但相应放松中央对边远行省的直接控制。"
 oe_spqr_pol_senatorial_oversight:0 "元老院行省稽核共治制"
 oe_spqr_pol_senatorial_oversight_desc:0 "为每位海外总督配设元老院财务官联合稽核税账与驿道修筑，兼顾行省忠诚、整合效率与海权存在，是稳健均衡的元老院治省典范。"
 oe_spqr_pol_praetorian_direct:0 "法官直辖行省中央集权制"
 oe_spqr_pol_praetorian_direct_desc:0 "将各行省军政税权收归罗马大法官与中央国库直辖，最大化直属税效、地方控制与中央权威，但令海外总督属国忠诚有所承压。"
 oe_spqr_law_senate_banks:0 "《元老院与商业银行共治法》"
 oe_spqr_law_senate_banks_desc:0 "规范共和宪政与地中海金融体系的共生关系：在圣乔治式公债银行共治、行会市民民主分权与国家粮赈船厂统制三种经济路线间抉择。"
 oe_spqr_pol_san_giorgio_credit:0 "圣乔治公债银行共治制"
 oe_spqr_pol_san_giorgio_credit_desc:0 "融合热那亚圣乔治银行与佛罗伦萨金弗罗林信用体系建立共和国公债总行，大幅降低借贷利率、拓宽国债容量并提振商贸收益，同时增强大商贾金融权势。"
 oe_spqr_pol_guild_merchant_demo:0 "行会市民共和分权制"
 oe_spqr_pol_guild_merchant_demo_desc:0 "向手工业行会、毛纺匠师与中小船主敞开市政议会大门，促进工艺生产、学术创新与各阶层和睦，但因广泛让利行会而略减直税征收。"
 oe_spqr_pol_grain_naval_dole:0 "国家粮赈与海军船厂统制"
 oe_spqr_pol_grain_naval_dole_desc:0 "将地中海航运关税定向投入罗马官仓粮赈与威尼斯式国营兵工厂船坞，强力保障粮食储备、造船提速与水手兵源，但令私营商行略感掣肘。"
 oe_msn_spqr_a1_italian_republican_league:0 "缔造意大利共和同盟"
 oe_msn_spqr_a1_italian_republican_league_desc:0 "自亚得里亚泻湖、托斯卡纳丘陵至利古里亚海港，意大利自治城邦重拾古老的公民共和凝聚力与[trade|e]雄心。"
 oe_msn_spqr_a1_italian_republican_league_req_tt:0 "身为合资格意大利共和国，稳定度至少为 5，且拥有 4 处领地、120 金币或码头建筑之一。"
 oe_msn_spqr_a2_maritime_rival_supremacy:0 "威尼斯—热那亚—比萨—佛罗伦萨海权争霸"
 oe_msn_spqr_a2_maritime_rival_supremacy_desc:0 "数百年来威尼斯、热那亚、比萨与佛罗伦萨在两海之间争锋不息。兼并或整合至少两座意大利商业枢纽，令劲敌[navy|e]与商船尽归同旗。"
 oe_msn_spqr_a2_maritime_rival_supremacy_req_tt:0 "自身或属国控制至少两座意大利海商重镇（威尼斯、热那亚、比萨、佛罗伦萨、杜布罗夫尼克、安科纳、那不勒斯、巴勒莫），拥有港口，且海军传统达 15 或拥有船坞／造船厂。"
 oe_msn_spqr_a3_lombardy_tuscany:0 "定鼎伦巴第与托斯卡纳"
 oe_msn_spqr_a3_lombardy_tuscany_desc:0 "攻克米兰粉碎伦巴第僭主统治，并稳固托斯卡纳工坊与银行体系，将北意大利最富庶的军工与金融[market|e]纳入共和版图。"
 oe_msn_spqr_a3_lombardy_tuscany_req_tt:0 "自身或属国控制米兰，并同时控制佛罗伦萨、比萨或锡耶纳之一。"
 oe_msn_spqr_a4_unite_italy:0 "一统意大利半岛（Tota Italia）"
 oe_msn_spqr_a4_unite_italy_desc:0 "自波河平原经罗马南下那不勒斯与西西里粮港，整个亚平宁半岛摆脱异族王室割据，尽归共和国统一[control|e]。"
 oe_msn_spqr_a4_unite_italy_req_tt:0 "自身或属国同时控制罗马、那不勒斯与巴勒莫。"
 oe_msn_spqr_b1_cola_di_rienzo:0 "响应科拉·迪·里恩佐的号召"
 oe_msn_spqr_b1_cola_di_rienzo_desc:0 "1347年罗马护民官在卡比托利欧山阶宣告古典共和重生。我方果断响应号召，承接意大利公民复兴大义与[prestige|e]。"
 oe_msn_spqr_b1_cola_di_rienzo_req_tt:0 "通过决议或事件声援科拉·迪·里恩佐、控制罗马，或在 1365 年后高举共和旗帜。"
 oe_msn_spqr_b2_enter_eternal_city:0 "进军永恒之城罗马"
 oe_msn_spqr_b2_enter_eternal_city_desc:0 "共和国军旗穿过奥勒良城墙、沿圣道迈向提图斯凯旋门。克复罗马城令古典世界的[core|e]心脏再度搏动。"
 oe_msn_spqr_b2_enter_eternal_city_req_tt:0 "自身或属国控制罗马，且稳定度至少为 5。"
 oe_msn_spqr_b3_convene_roman_senate:0 "重开罗马元老院与公民大会"
 oe_msn_spqr_b3_convene_roman_senate_desc:0 "在修葺一新的尤利娅元老院大厅内，来自威尼斯、热那亚、佛罗伦萨与罗马的元老齐聚大理石席位，正式确立古典共和[parliament|e]宪政。"
 oe_msn_spqr_b3_convene_roman_senate_req_tt:0 "控制罗马、稳定度至少为 10，且已启用罗马元老院议会、宣告新罗马共和国，或共和传统达到 65。"
 oe_msn_spqr_b4_nova_res_publica:0 "加冕帝国级《新罗马共和国（S.P.Q.R.）》"
 oe_msn_spqr_b4_nova_res_publica_desc:0 "青铜鹰徽在卡比托利欧山巅凌空而起，意大利诸城邦升格为帝国级新罗马共和国，向世人昭告主权[republic|e]足以傲视一切帝王皇冠。"
 oe_msn_spqr_b4_nova_res_publica_req_tt:0 "控制罗马并完成《宣告新罗马共和国（S.P.Q.R.）》决议。"
 oe_msn_spqr_c1_proconsul_africa:0 "阿非利加行省总督（重光迦太基）"
 oe_msn_spqr_c1_proconsul_africa_desc:0 "横渡西西里海峡克复突尼斯与古迦太基海岸，扼守地中海中央水道并重启北非粮仓[trade|e]。"
 oe_msn_spqr_c1_proconsul_africa_req_tt:0 "册封阿非利加行省总督府，或自身及属国控制突尼斯、比塞大或的黎波里之一。"
 oe_msn_spqr_c2_proconsul_west:0 "西班牙与高卢行省总督"
 oe_msn_spqr_c2_proconsul_west_desc:0 "将执政官束棒插上马赛、纳博讷与巴塞罗那港头，令狮湾与巴利阿里海域尽入共和国[navy|e]掌中。"
 oe_msn_spqr_c2_proconsul_west_req_tt:0 "册封高卢或西班牙行省总督府，或自身及属国控制巴塞罗那、马赛或瓦伦西亚之一。"
 oe_msn_spqr_c3_proconsul_graecia:0 "伊利里亚与希腊行省总督"
 oe_msn_spqr_c3_proconsul_graecia_desc:0 "自达尔马提亚与克里特直抵雅典和塞萨洛尼基，共和国战舰稳控爱琴列岛并以总督[subjects|e]重续希腊—罗马文脉。"
 oe_msn_spqr_c3_proconsul_graecia_req_tt:0 "册封伊利里亚—希腊行省总督府，或自身及属国控制雅典、塞萨洛尼基或干地亚之一。"
 oe_msn_spqr_c4_proconsul_orient:0 "亚细亚、叙利亚与埃及行省总督"
 oe_msn_spqr_c4_proconsul_orient_desc:0 "进据士麦那、安条克与亚历山大港，收复尼罗河千年粮仓与黎凡特香料终点，闭合“我们的海”东翼[market|e]弧线。"
 oe_msn_spqr_c4_proconsul_orient_req_tt:0 "册封亚细亚或叙利亚—埃及行省总督府，或自身及属国控制亚历山大港、安条克或士麦那之一。"
 oe_msn_spqr_d1_papal_question:0 "解决教宗问题（拉特兰协约或迁居阿维尼翁）"
 oe_msn_spqr_d1_papal_question_desc:0 "台伯河畔的教权与世俗主权纠葛一日不解，罗马共和国便难安枕。无论缔结拉特兰协约还是逐教廷返阿维尼翁，皆为国家[stability|e]奠基。"
 oe_msn_spqr_d1_papal_question_req_tt:0 "完成罗马城的《解决教宗问题》决议（或教宗国已不复存在）。"
 oe_msn_spqr_d2_two_romes:0 "双罗马对话：君士坦丁堡皇权 vs 新罗马共和"
 oe_msn_spqr_d2_two_romes_desc:0 "爱琴海彼岸矗立着君士坦丁的千年新罗马。无论缔结双罗马海权协约还是挥师东进直面狄奥多西城墙，共和国的[prestige|e]都将改写罗马千秋国运。"
 oe_msn_spqr_d2_two_romes_req_tt:0 "完成与拜占庭的《双罗马对话》事件抉择（或控制君士坦丁堡／拜占庭已覆亡）。"
 oe_msn_spqr_d3_black_sea_med_hegemony:0 "黑海—地中海商贸霸权（加扎里亚与两海联运）"
 oe_msn_spqr_d3_black_sea_med_hegemony_desc:0 "打通威尼斯兵工厂、热那亚加扎里亚商埠与黑海运粮航道——若条顿骑士团已饮马克里米亚更可缔结跨海协约——铸就两海无双[trade|e]霸权。"
 oe_msn_spqr_d3_black_sea_med_hegemony_req_tt:0 "合并罗马海权联合银行、触发黑海谷物丝绸协约、见证条顿黑海据点建立，或控制卡法／君士坦丁堡。"
 oe_msn_spqr_d4_spqr_eternal:0 "永恒元老院与罗马人民（S.P.Q.R. Eternal）"
 oe_msn_spqr_d4_spqr_eternal_desc:0 "自阿尔卑斯与赫拉克勒斯之柱延绵至尼罗河与博斯普鲁斯海峡，行省总督舰队与自由公民议会共同守护着照耀千古的永恒罗马[republic|e]。"
 oe_msn_spqr_d4_spqr_eternal_req_tt:0 "宣告新罗马共和国、控制罗马且稳定度至少为 15，并拥有至少 3 座活跃行省总督府或控制至少 85 处领地（含属国）。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_lex_agraria:0 "农地与市民权宪章"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_lex_agraria:0 "广授罗马市民权与扶持自由农庄显著推动文化同化与仓廪充实，令保守世家略感失落。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_classis_mare:0 "“我们的海”舰队总署"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_classis_mare:0 "意大利诸共和船厂合力打造的常备地中海舰队纵横碧波，牢控商道与制海权。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_scu_decree:0 "元老院终极动员令"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_scu_decree:0 "战时紧急授权令共和国公民军团军纪如铁、士气高昂，严守意大利与地中海防线。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_via_consularis:0 "执政官大道与港务工程署"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_via_consularis:0 "平坦坚固的执政官石道与深水码头令共和国政令与商货昼夜畅达。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_patrician_seats:0 "元老世家公职晋升制"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_patrician_seats:0 "明确的元老晋升礼制令贵族显贵倾力辅政并扬名海外，唯略降贵族税限。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_equestrian_cmd:0 "骑士阶层军政委任"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_equestrian_cmd:0 "精干的骑士军官团强化部队战备与行省总督忠诚，略微分散中枢集权。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_san_giorgio:0 "共和公债银行特许"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_san_giorgio:0 "信誉卓著的共和公债压低融资成本并提振海商活力，相应宽减市民税限。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_free_ports:0 "地中海自由港协约"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_free_ports:0 "宽松的自由港规章吸引地中海万商云集，略微让渡直接税率。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_plebeian_grain:0 "罗马公民官粮赈济（Annona）"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_plebeian_grain:0 "常设官粮储备安抚平民百姓、滋养城镇繁荣，略微减免农民税限。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_basilica_endow:0 "罗马市政圣殿奉纳"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_basilica_endow:0 "厚恤各地教堂与济贫院赢得教士阶层拥护与崇高声望，略微减免教产税限。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_senate:0 "元老院宪章颁行过渡"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_senate:0 "元老院书吏正将新颁布的共和国大法镌刻于广场铜牌并通告诸城，短期内需协调世家礼仪与行政经费。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_burghers:0 "海商行会法典过渡"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_burghers:0 "各大商港领事、银行与船厂行会正依新法重订商约账册，激发海贸活力而令保守世家略感不安。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_plebs:0 "公民大会民权过渡"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_plebs:0 "保民官与市镇监察官正为新纳入市民名册的公民登记造册，惠及民生繁荣而略减短期税入。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_state:0 "执政官集权法令过渡"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_state:0 "执政官侍从与直辖巡察官正整肃各地军政号令，强化中央控御与士气，短期内引起共和派警觉。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_rienzo_league:0 "护民官古典共和同盟"
 STATIC_MODIFIER_DESC_oe_spqr_mod_rienzo_league:0 "响应科拉·迪·里恩佐在卡比托利欧山发出的古典共和号召，激扬意大利市镇豪情、外交声望与共和传统。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_dictator_ultimum:0 "元老院终极法令：战时独裁官"
 STATIC_MODIFIER_DESC_oe_spqr_mod_dictator_ultimum:0 "奉元老院紧急授权执掌二十四束棒五年，战时独裁官以铁腕统率军团与攻城纵队力挽狂澜。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_constitutio_antoniniana:0 "安东尼努斯敕令：普世罗马市民权"
 STATIC_MODIFIER_DESC_oe_spqr_mod_constitutio_antoniniana:0 "向意大利与地中海诸城邦普授罗马市民权，极大加快文化同化、领地整合与行省总督忠诚。"
 STATIC_MODIFIER_NAME_oe_spqr_mod_roman_maritime_bank:0 "罗马海权联合银行（海上领地与圣乔治合流）"
