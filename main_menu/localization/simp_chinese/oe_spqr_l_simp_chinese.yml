 OE_SPQR_SIT_P2:0 "#color_gold 意大利共和同盟#!"
 OE_SPQR_SIT_P3:0 "#color_orange 鹰旗登临卡比托利欧#!"
 OE_SPQR_SIT_P4:0 "#G 新罗马共和国盛世#!"
 OE_SPQR_SIT_LEGEND_TITLE:0 "地中海共和复兴局势图例"
 OE_SPQR_SIT_LEGEND_DESC:0 "国家本色：已宣告的新罗马共和国（S.P.Q.R.）；绿色：意大利海上与城市共和国及罗马行省总督属国；红色：教宗国与意大利君主劲敌；琥珀色：密切注视罗马风云的地中海诸强。"
 oe_spqr_sit_map_spqr_tt:0 "已光复的帝国级新罗马共和国（S.P.Q.R.）。"
 oe_spqr_sit_map_proconsul_tt:0 "镇守地中海的罗马共和行省总督府。"
 oe_spqr_sit_map_rep_tt:0 "高举古典共和理想旗帜的意大利海上或城市共和国。"
 oe_spqr_sit_map_pap_tt:0 "抗衡意大利共和一统的教宗或君主势力。"
 oe_spqr_sit_map_nbr_tt:0 "关注罗马共和复兴格局的地中海与欧洲列强。"
 oe_msn_60_spqr:0 "#bold #color_yellow 元老院与罗马人民（S.P.Q.R.）：新罗马共和国终极复兴#!#!"
 oe_msn_60_spqr_DESCRIPTION:0 "面向威尼斯、热那亚、比萨、佛罗伦萨、锡耶纳、卢卡、拉古萨、安科纳及一切意大利共和国的共享旗舰天命线：统一半岛、登临卡比托利欧山、册封地中海六大行省总督并与君士坦丁堡对话。"
 oe_msn_60_spqr_CRITERIA_DESCRIPTION:0 "缔造意大利共和同盟、定鼎伦巴第与托斯卡纳并统一亚平宁，重开罗马元老院、加冕帝国级新罗马共和国，册封地中海东西六大行省总督，解决教宗与双罗马之争，成就永恒的元老院与罗马人民。"
 oe_msn_60_spqr_BUTTON_TOOLTIP:0 "开启新罗马共和国（S.P.Q.R.）复兴天命线"
 oe_msn_60_spqr_BUTTON_DETAILS:0 "面向全部意大利海上与城市共和国的四支十六阶共享旗舰任务树：海商城邦争霸与一统半岛、进军罗马重开元老院并加冕帝国级共和国、册封地中海六大行省总督府，以及教宗问题、双罗马对话与黑海—地中海商贸霸权。"
 oe_spqr.1.title:0 "1347年：科拉·迪·里恩佐在卡比托利欧山宣告罗马共和国！"
 oe_spqr.1.desc:0 "趁教廷远居阿维尼翁之际，罗马公证人科拉·迪·里恩佐身披白袍登上卡比托利欧山阶，在欢呼的罗马市民面前宣告重立《元老院与罗马人民》，并致书意大利每一座自治共和国共赴古典共和盟会。"
 oe_spqr.1.a:0 "高呼护民官万岁，响应古典共和复兴大义！"
 oe_spqr.1.b:0 "遣使审慎观望，借势巩固本邦外交与商贸"
 oe_spqr.2.title:0 "威尼斯大议会激辩：圣马可飞狮与罗马鹰徽"
 oe_spqr.2.desc:0 "在总督府金碧辉煌的大议会厅内，威尼斯元老们围绕国策展开激辩：究竟是将圣马可飞狮的海上领地舰队投入光复罗马共和国的宏图，还是依托兵工厂与黎凡特商船队深耕亚得里亚商贸霸权？"
 oe_spqr.2.a:0 "倾威尼斯兵工厂之力，重铸罗马“我们的海”！"
 oe_spqr.2.b:0 "固守大议会海贸基业与东方香料专营"
 oe_spqr.3.title:0 "热那亚圣乔治银行与黑海加扎里亚宪章"
 oe_spqr.3.desc:0 "从利古里亚的大理石金库远抵克里米亚卡法与佩拉石塔，热那亚银行家与船长紧握两海金脉。高傲之城是将圣乔治公债体系化作新罗马共和国的财政基石，还是整编精锐弩手连队与桨帆战舰纵横海疆？"
 oe_spqr.3.a:0 "以圣乔治公债串联加扎里亚与意大利商脉"
 oe_spqr.3.b:0 "扩编热那亚弩手陆战队与迅捷战舰分队"
 oe_spqr.4.title:0 "比萨梅洛里亚雪耻与托斯卡纳—亚得里亚文艺复兴"
 oe_spqr.4.desc:0 "在比萨、佛罗伦萨、锡耶纳、卢卡、拉古萨与安科纳的市政广场上，人们既铭记1284年梅洛里亚海战等惨痛往事，亦为自治城邦的人文才华而自豪。学者、商人与水手齐望罗马古典共和旗帜，誓要破茧腾飞、力压群雄。"
 oe_spqr.4.a:0 "弘扬托斯卡纳—亚得里亚公民人文与共和法学"
 oe_spqr.4.b:0 "雪耻梅洛里亚——重铸共和战舰与铁血市民军！"
 oe_spqr.5.title:0 "元老院与罗马人民：卡比托利欧山建国大典！"
 oe_spqr.5.desc:0 "嘹亮号角响彻罗马广场，身着紫边托加袍的双执政官在来自威尼斯、热那亚、佛罗伦萨、比萨、米兰与各自由城邦的代表簇拥下登上卡比托利欧山巅。帝国级《新罗马共和国（S.P.Q.R.）》庄严宣告光复！我们将以何种立国信条开启新纪元？"
 oe_spqr.5.a:0 "高举公民法度、元老院宪政与罗马市民融合"
 oe_spqr.5.b:0 "高举青铜鹰旗——挥师光复“我们的海”！"
 oe_spqr.6.title:0 "西地中海行省总督册封：高卢、西班牙与阿非利加"
 oe_spqr.6.desc:0 "尤利娅元老院大理石案前铺开西地中海舆图。元老院今日将把哪片意大利本土以外的征服疆域册封为专属罗马共和行省总督府（确认建省消耗 120 金币，绝不动用首都或罗马、威尼斯、热那亚、佛罗伦萨、比萨等核心都市）？"
 oe_spqr.6.a:0 "册封高卢罗马行省总督府（马赛／南法）"
 oe_spqr.6.b:0 "册封西班牙罗马行省总督府（巴塞罗那／伊比利亚）"
 oe_spqr.6.c:0 "册封阿非利加罗马行省总督府（突尼斯／迦太基）"
 oe_spqr.6.d:0 "暂缓西地中海行省册封，留待日后商议"
 oe_spqr.7.title:0 "东地中海行省总督册封：希腊、亚细亚与叙利亚埃及"
 oe_spqr.7.desc:0 "海军统帅与财务官自爱琴海、安纳托利亚与尼罗河畔携账册归来。元老院今日将把哪片意大利本土及君士坦丁堡以外的东地中海疆域册封为罗马共和行省总督府（确认建省消耗 120 金币）？"
 oe_spqr.7.a:0 "册封伊利里亚—希腊行省总督府（雅典／塞萨洛尼基）"
 oe_spqr.7.b:0 "册封亚细亚罗马行省总督府（士麦那／安纳托利亚）"
 oe_spqr.7.c:0 "册封叙利亚—埃及行省总督府（亚历山大港／安条克）"
 oe_spqr.7.d:0 "暂缓东地中海行省册封，留待日后商议"
 oe_spqr.8.title:0 "罗马教宗问题：拉特兰协约还是逐回阿维尼翁"
 oe_spqr.8.desc:0 "台伯河两岸，枢机主教团与共和国元老就基督教圣城的命运展开历史性摊牌：是签署《拉特兰共和政教协约》，保障教宗在圣伯多禄圣殿的属灵独立以换取天主教世界和平承认，还是高举彻底的世俗共和主权、将教廷逐回阿维尼翁？"
 oe_spqr.8.a:0 "签署《拉特兰共和政教协约》，尊重梵蒂冈属灵独立"
 oe_spqr.8.b:0 "确立卡比托利欧绝对世俗主权——逐教廷返阿维尼翁！"
 oe_spqr.9.title:0 "双罗马对话：台伯河双执政官与海峡巴西琉斯"
 oe_spqr.9.desc:0 "罗马共和国光复的惊雷传至金角湾，君士坦丁堡的罗马皇帝正怀着警惕与敬畏遥望西方。元老院将如何回应第二罗马：是伸出橄榄枝缔结《双罗马地中海协约》、东西并立共掌沧海，还是斥责东方皇权专制、厉兵秣马东指博斯普鲁斯海峡？"
 oe_spqr.9.a:0 "向君士坦丁堡提议缔结《双罗马地中海协约》"
 oe_spqr.9.b:0 "痛斥东方皇权专制——宣告唯一罗马正统并挥师东进！"
 oe_spqr.10.title:0 "卡比托利欧使团：西方新罗马共和国的国书"
 oe_spqr.10.desc:0 "手持银鹰与 S.P.Q.R. 徽记的使节步入君士坦丁堡大皇宫。意大利诸共和国已在卡比托利欧山光复罗马共和国，正静候巴西琉斯圣裁：是与西方共和派缔结《双罗马地中海协约》共兴商贸海防，还是依托狄奥多西城墙傲然回绝一切西方僭称？"
 oe_spqr.10.a:0 "与西方双执政官签署《双罗马地中海协约》"
 oe_spqr.10.b:0 "天无二日，唯有一帝一罗马——严辞回绝西方共和国！"
 oe_spqr.11.title:0 "元老院终极法令届满：辛辛那图斯归还束棒，抑或凯撒诱惑？"
 oe_spqr.11.desc:0 "元老院授予战时独裁官紧急束棒已满五年。罗马城门外凯旋军团山呼统帅之名，元老院内诸老屏息静候命运宣判：独裁官是效法古代贤哲辛辛那图斯毅然交还大权、归隐田园，还是抵挡不住凯撒的诱惑、以统帅威权凌驾元老院？"
 oe_spqr.11.a:0 "效法辛辛那图斯——将束棒与大权归还元老院与人民！"
 oe_spqr.11.b:0 "难拒凯撒之诱惑——保留统帅凌驾元老院的铁腕威权！"
 oe_spqr.12.title:0 "黑海—地中海谷物与丝绸商贸协约"
 oe_spqr.12.desc:0 "自克里米亚卡法、塔纳穿过博斯普鲁斯海峡直抵威尼斯、热那亚与罗马，满载草原小麦、北方琥珀与东方丝绸的商船昼夜不息。借海权联合银行之力——若条顿骑士团已建立黑海据点更可强强联手——元老院将如何铸就这条跨海黄金命脉？"
 oe_spqr.12.a:0 "与黑海条顿骑士团缔结《罗马—条顿谷物琥珀协约》！"
 oe_spqr.12.b:0 "敕编统一加扎里亚与黑海运粮商船队"
 oe_spqr.12.c:0 "加固海峡商栈并确立地中海丝绸海军专营"
 oe_spqr.13.title:0 "罗马市民权黄金盛世（Civitas Romana）"
 oe_spqr.13.desc:0 "在意大利本土与地中海各行省总督府之间，新获市民权的公民云集于恢弘的广场、人文学院与大理石良港。法学家援引西塞罗与市政宪章辩论政事，铭刻 S.P.Q.R. 的金银币自马赛畅行至亚历山大港。"
 oe_spqr.13.a:0 "颂扬罗马市民权人文复兴与文化盛世"
 oe_spqr.13.b:0 "将共和和平转化为工商业与海贸繁荣"
 oe_spqr.14.title:0 "古典罗马共和复兴终局定鼎"
 oe_spqr.14.desc:0 "自1347年科拉·迪·里恩佐在卡比托利欧山发出第一声呼喊起，历经数代风云激荡，古典共和理想、教廷世俗统治与意大利君主割据之间的世纪角逐终于迎来历史终局。"
 oe_spqr.14.a:0 "永续罗马广场的不朽宪政与人文遗产"
 oe_spqr.14.b:0 "承袭古典海权锐气，开拓全新海洋时代"
