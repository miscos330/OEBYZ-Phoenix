city_of_hero: "英雄之城"
city_of_hero_desc: "当小亚细亚沦陷于突厥人的魔爪之中时，唯有菲拉德尔斐亚屹立不倒，犹如暴风雨中的灯塔指引着我国人民的抵抗意志。"

oe_rights_heart_of_orthodox: "东正教之心"
oe_rights_heart_of_orthodox_desc: "君士坦丁堡是普世牧首区的心脏，全体正教徒心中的圣地"
 oe_rights_thessaloniki_mint: "塞萨洛尼基铸币中心"
 oe_rights_thessaloniki_mint_desc: "塞萨洛尼基的金银匠受命铸造帝国货币，依照皇室规定的成色与重量检验每一枚钱币。此特权仅可授予塞萨洛尼基一份；完成改革币制后，已有特权将升级为帝国铸币中心。"
 oe_rights_imperial_mint: "帝国铸币中心"
 oe_rights_imperial_mint_desc: "经币制改革整饬的铸币中心将金银匠、验金官与皇室铸局纳入统一规章，以可信的帝国钱币贯通各地商路。塞萨洛尼基可获得此特权；热那亚须先获皇帝特许。每地仅可拥有一份。"
 oe_rights_book_of_eparch: "《市政全书》"
 oe_rights_book_of_eparch_desc: "市政官重申君士坦丁堡各行会的权利与责任，从丝绸作坊到沿街铺面皆依定章经营。城坊的秩序、工匠的生计与首都的扩建由此相互维系。"
 oe_rights_imperial_charities: "慈善事业"
 oe_rights_imperial_charities_desc: "修道院、救济院与堂区厨房共同照料首都的贫民和教士。皇室承认这些慈善事业的地位，使粮食与捐赠得以有序分配。\n\n本地劳工食物消耗-5%。"
 oe_rights_imperial_academy: "帝国学术中心"
 oe_rights_imperial_academy_desc: "抄写员、教师与求学者汇集于君士坦丁堡，古代典籍在讲堂与书坊间传阅。帝国以讲席、藏书和学徒名额延续学统，也向远方的学人敞开城门。"
 oe_mint_before_coinage_reform_tt: "尚未完成帝国改革“改革币制”；改革后改授帝国铸币中心"
 oe_mint_coinage_reformed_tt: "东罗马已完成帝国改革“改革币制”"
 oe_imperial_mint_location_tt: "地点为塞萨洛尼基，或已通过历史事件获准设立帝国铸币中心的热那亚"
 oe_genoa_imperial_mint_unlocked_tt: "允许在#Y 热那亚#!授予#Y 帝国铸币中心#!城镇特权"
 oe_mint_rights.1.t: "利古里亚的新铸印"
 oe_mint_rights.1.d: "币制改革颁行之后，帝国的验金官终于可以将目光投向西方。热那亚的港口与托斯卡纳诸城如今皆在罗马的庇护之下，海商带来的金银、行会积累的技艺和遍及地中海的汇兑关系，正等待一道统一的铸币敕令。\n\n市民代表请求在热那亚设立新的帝国铸币中心，按君士坦丁堡核定的成色与重量铸钱。若授予这一特许，西方商路上的钱袋也将见证皇帝的信用；塞萨洛尼基与利古里亚的炉火，将共同支撑复兴帝国的货币秩序。"
 oe_mint_rights.1.a: "让帝国的铸印通行于东西方。"
