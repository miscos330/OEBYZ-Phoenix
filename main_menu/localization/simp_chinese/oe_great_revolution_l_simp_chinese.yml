l_simp_chinese:
 oe_great_revolution: "东罗马大革命"
 oe_great_revolution_desc: "钟声曾催促臣民为皇帝祈祷，如今却召唤他们决定帝国的命运。紫袍与公民的绶带争夺同一片大地；被推翻的秩序尚未死去，新生的共和国也远未站稳。"
 oe_gr_radicalism: "激进度"
 oe_gr_radicalism_tooltip: "#bold 激进度：每月变化#!\n合计：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_radicalism_delta')|-=3]\n自然增长：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_radicalism_natural')|-=3]\n国家修正：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_radicalism_other')|-=3]\n\n自然增长等于当前激进度×0.005：0时不增长，100时每月增长0.5。激进度始终限制在0—100。"
 oe_gr_overview: "旧秩序在首都的街垒前破碎，新的秩序却尚未诞生。革命的激进程度会自行累积；流亡的贵族、失势的教士与不满的民众，则等待着反攻的时机。"
 oe_gr_reactionary_muster: "反动派集结"
 oe_gr_people_pool: "反对革命的人数"
 oe_gr_soldier_pool: "反动派士兵人数"
 oe_gr_people_monthly: "每月：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_people_delta')|+=2]人"
 oe_gr_soldiers_monthly: "每月：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_soldiers_delta')|+=2]人"
 oe_gr_muster_progress: "集结进度"
 oe_gr_muster_summary: "每月进度：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_muster_delta')|-=3]"
 oe_gr_muster_tooltip: "#bold 反动派：每月集结#!\n实际增量：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_muster_delta')|-=3]\n人数池÷全国人口：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_people_pressure')|3]\n士兵池÷陆军人数：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_soldier_pressure')|3]\n皇帝状态：[DisasterView.GetDisaster.GetOwner.MakeScope.ScriptValue('oe_gr_emperor_muster_delta')|-=3]\n\n两项人数比例与皇帝状态修正相加：比例0.2就贡献0.2进度，不另乘100。皇帝被软禁时每月−0.1；皇室直系绝嗣后改为每月−0.2，两者不叠加。陆军为零时以1人作分母。\n所有增量按照月初数值计算；内战期间暂停集结与补充。集结进度限制在0—100。"
 oe_gr_muster_rules: "人数池每月补充全国人口的#Y 0.05%#!；士兵池每月补充人数池的#Y 0.01%#!。达到#R 100#!时，反动派从随机省份起兵，带走随机选取的#R 至少80%#!地点，并将士兵池兑现为专制主义时代轻步兵、人数池兑现为金币。#Y 君士坦丁堡始终留在共和国手中，原有核心保留。#!\n起兵后两池与进度清零，内战结束后重新积累；地点不足时优先保留君士坦丁堡。"
 oe_gr_revolutionaries: "东罗马革命军"
 oe_gr_reactionaries: "东罗马反动派"
 oe_gr_escape_tt: "革命军将占有#R 君士坦丁堡#!及随机选取的#R 超过一半#!原属东罗马的地点，东罗马的原有核心保留。约#R 80%陆军兵力#!将随现有部队投向革命军；最后一支完整部队可能使比例略高。\n和平后可以花费#Y 50政治影响力#!重建秩序，取得“反动狂热”并结束灾难。"
 oe_gr_republic_tt: "#Y 东罗马转变为共和制。#!皇帝被软禁，由临时执政官接掌政府；此后共和制不会触发旧王朝复辟叛乱。\n被软禁的皇帝不能进入内阁或担任陆海军将领，反动派集结进度每月#G −0.1#!。三天后，境内三支规模最大的陆军将依次拒绝效忠；不足三支时按实际数量处理。\n#bold 这是后续大革命完整内容的前置选择。#!"
 oe_gr_radicalism_plus_30_tt: "#bold 激进度#!　#R +30#!"
 oe_gr_uprising_happened_tt: "反动派已发动内战，君士坦丁堡与东罗马的原有核心得到保留。"
 oe_gr_restore_order: "重建帝国秩序"
 oe_gr_restore_order.title: "$oe_gr_restore_order$"
 oe_gr_restore_order.desc: "$oe_gr_restore_order_desc$"
 oe_gr_restore_order_desc: "内战的硝烟终于散去。皇帝将以重建秩序之名，召集尚忠于王座的人们，使反革命成为帝国新的信条。"
 oe_gr_restore_order.a: "以皇帝之名，恢复秩序。"
 oe_gr_restore_order_tt: "结束“东罗马大革命”灾难。"
 oe_gr_end_condition_tt: "皇帝逃亡后，以“重建帝国秩序”决议结束灾难；共和分支则由后续事件结束。"
 oe_great_revolution.1.t: "首都暴动！"
 oe_great_revolution.1.d: "第一声枪响从梅塞大道传来，随后，整座城的钟声都失去了次序。码头工人拖来木车封锁街口，学生把印好的宣言钉在税署门上，近卫军中有人放低了刺刀，也有人将枪口转向昔日的同袍。\n\n宫廷仍在等待一份可以盖印的报告，街头却已替帝国作出了决定。紫色旗帜从大跑马场的露台上被扯落，圣索菲亚的台阶上响起了“公民”的呼喊。布拉赫内宫的侧门尚未封死；若皇帝现在离去，也许还有行省和军队愿意为他作战。若那扇门来不及打开，罗马人便将在囚禁皇帝的清晨，迎来一个无人知晓结局的共和国。"
 oe_great_revolution.1.a: "皇帝成功逃往布拉赫内宫。"
 oe_great_revolution.1.b: "革命者攻占了首都，皇帝被关押！"
 oe_great_revolution.2.t: "旧秩序的反攻"
 oe_great_revolution.2.d: "省城的晨祷尚未结束，旧军旗已经在广场上升起。失势的家族送来银箱，乡间的教士传递誓约，逃散的军官把各地不满的人编入同一支军队。他们并不都怀念同一位皇帝，却同样憎恨夺走自己旧日生活的革命。\n\n一封又一封告急文书涌入君士坦丁堡。首都仍在我们手中，而帝国的广大行省已成为反动派的战场。共和国必须证明：它能够守住自己宣告的新世界。"
 oe_great_revolution.2.a: "守住首都，保卫共和国！"
 STATIC_MODIFIER_NAME_oe_gr_reactionary_fervor: "反动狂热"
 STATIC_MODIFIER_DESC_oe_gr_reactionary_fervor: "王座将革命的创伤化为重建专制秩序的号召。"
 STATIC_MODIFIER_NAME_oe_gr_political_instability: "政局不稳"
 STATIC_MODIFIER_DESC_oe_gr_political_instability: "旧有的服从关系已被打破，新政府的命令却尚未抵达帝国的边缘。此修正可叠加。"
 STATIC_MODIFIER_NAME_oe_gr_unstable_credit: "政府信用不稳"
 STATIC_MODIFIER_DESC_oe_gr_unstable_credit: "当政权的明日尚不可知，铸币与公债也无法使人信服。"
 STATIC_MODIFIER_NAME_oe_gr_imprisoned_emperor: "被软禁"
 STATIC_MODIFIER_DESC_oe_gr_imprisoned_emperor: "皇帝被革命政府软禁，不能进入内阁或担任陆海军将领。其在世并被软禁期间，反动派集结进度每月减少0.1。"
 MODIFIER_TYPE_NAME_oe_gr_monthly_radicalism: "每月激进度"
 MODIFIER_TYPE_DESC_oe_gr_monthly_radicalism: "东罗马大革命期间每月增加或减少的激进度。"
 oe_gr_emperor_identity: "东罗马皇帝：[DisasterView.GetDisaster.GetOwner.MakeScope.GetVariable('oe_gr_emperor').GetCharacter.GetName]"
 oe_gr_emperor_age: "年龄：[DisasterView.GetDisaster.GetOwner.MakeScope.GetVariable('oe_gr_emperor').GetCharacter.GetAge]岁"
 oe_gr_emperor_detained_status: "状态：#Y 被软禁#!\n不能进入内阁或担任陆海军将领；反动派集结进度每月#G −0.1#!。"
 oe_gr_emperor_free_status: "状态：#Y 未被软禁#!\n皇帝仍是旧秩序的象征；去世后，将由仍在世的最年长直系后代承继皇位。"
 oe_gr_emperor_pending_status: "#Y 皇帝已经去世，继承待定。#!\n正在核对其仍在世的直系后代。"
 oe_gr_emperor_extinct_status: "#bold 皇室直系绝嗣#!\n无人接任皇帝。反动派集结进度每月#G −0.2#!。"
 oe_gr_emperor_unassigned_status: "当前没有可显示的东罗马皇帝。"
 oe_gr_succession_tt: "仍在世的最年长直系后代承继皇位，不限性别。共和分支中仅继承皇室称号及软禁状态，#Y 不改变共和国政体，也不替换共和国执政官#!。"
 oe_gr_extinction_tt: "无人接任皇帝。\n反动派集结进度#G −10#!（最低为0）；此后每月集结进度#G −0.2#!，替代皇帝被软禁时的−0.1。"
 oe_gr_disbanded_soldiers_tt: "摧毁这支陆军，并向反动派士兵池加入#R [ROOT.GetCountry.MakeScope.GetVariable('oe_gr_refusal_people').GetValue|0]#!人，即事件发生时该部队人数的两倍。"
 oe_great_revolution.3.t: "紫袍的继承者"
 oe_great_revolution.3.d: "[SCOPE.sCharacter('oe_gr_late_emperor').GetName]的生命终于走到了尽头。宫廷可以更换门上的徽记，政府可以重写公文的抬头，皇室的谱牒却仍被那些不肯忘记过去的人珍藏着。\n\n侍从与族人逐页核对名册，最终把[SCOPE.sCharacter('oe_gr_emperor_successor').GetName]的名字呈了上来。这是先帝仍在世的直系后代中年岁最长的一位。紫袍或许已经失去统治帝国的权力，它的传承却仍足以让许多人等待下一声号角。"
 oe_great_revolution.3.a: "由[SCOPE.sCharacter('oe_gr_emperor_successor').GetName]承继皇位。"
 oe_great_revolution.4.t: "[SCOPE.sCharacter('oe_gr_late_emperor').GetDynasty.GetName]家族皇室直系绝嗣"
 oe_great_revolution.4.t_fallback: "皇室直系绝嗣"
 oe_great_revolution.4.d: "最后一份谱牒送到桌上时，再没有人开口。[SCOPE.sCharacter('oe_gr_late_emperor').GetName]已经去世，而在其子女与更远的直系后裔中，找不到一个仍然在世的继承者。\n\n过去，人们尚可把希望寄托在一位年轻的皇子、一个尚未成年的孩子身上。如今，那条由父母传向儿女的血脉已经断绝。旧军旗仍在，复辟的密信也不会就此消失，但那些盼望以皇室之名重新集结的人，失去了最容易使彼此信服的名字。"
 oe_great_revolution.4.a: "皇位从此空悬。"
 oe_great_revolution.5.t: "军队拒绝效忠"
 oe_great_revolution.5.d: "[SCOPE.sUnit('oe_gr_refusing_army').GetName]送回了新政府颁发的誓词。军官们在联名书上写道：他们曾向皇帝宣誓，不能仅凭首都的一纸命令，便把一生的忠诚改献给共和国。\n\n营门没有升起叛旗，却也拒绝升起新的旗帜。士兵们仍列队领取军饷，火炮留在原来的阵地，军官则要求政府保证不会迫使他们离开驻地。我们可以拆散这支军队，把怀恨的士兵赶向乡间；也可以付出代价，容忍一座沉默而危险的军营。"
 oe_great_revolution.5.a: "我们不需要他们的效忠！"
 oe_great_revolution.5.b: "我们只需要他们留在驻地。"
 STATIC_MODIFIER_NAME_oe_gr_confined_army: "拒绝效忠的驻军"
 STATIC_MODIFIER_DESC_oe_gr_confined_army: "这支陆军以不离开驻地为条件，暂时接受新政府继续供给军饷。移动速度降低1000%，持续1000天，不随时间衰减。"
 MODIFIER_TYPE_NAME_oe_gr_emperor_monthly_muster: "每月反动派集结进度"
 MODIFIER_TYPE_DESC_oe_gr_emperor_monthly_muster: "当该人物为大革命面板所跟踪的在世皇帝时，影响反动派的每月集结进度；内战期间按集结规则暂停。"
 oe_gr_keep_army_tt: "该陆军获得“拒绝效忠的驻军”：移动速度#R −1000%#!，持续#Y 1000天#!，不随时间衰减。\n正统性#R −10#!；支付#R [ROOT.GetCountry.MakeScope.GetVariable('oe_gr_refusal_gold').GetValue|2]#!金币（事件发生时的一个月收入）。"
