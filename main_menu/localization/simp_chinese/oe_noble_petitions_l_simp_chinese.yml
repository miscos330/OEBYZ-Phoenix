l_simp_chinese:
 oe_noble_petitions.1.t: "豪族要求进入核心圈"
 oe_noble_petitions.1.d: "[SCOPE.sDynasty('oe_npet_family').GetName]家族的门客送来一封措辞恭谨的书信。信中列举了历代先人的功劳，又暗示宫廷的荣席不该总由旁人占据。他们举荐[SCOPE.sCharacter('oe_npet_nominee').GetName]进入琼筵序次，愿为这席之地收起一部分声势。"
 oe_noble_petitions.1.a: "准其入列，颁给任命敕书。"
 oe_noble_petitions.1.a.tt: "由[SCOPE.sCharacter('oe_npet_nominee').GetName]接任本次选定的琼筵序次职位；原任者如在职则被免职，#G 不消耗正统性#!。\n[SCOPE.sDynasty('oe_npet_family').GetName]家族影响力：#G -75#!。"
 oe_noble_petitions.2.t: "豪族要求进入内阁"
 oe_noble_petitions.2.d: "[SCOPE.sDynasty('oe_npet_family').GetName]家族递上的奏疏，谈的已不只是荣誉。他们希望[SCOPE.sCharacter('oe_npet_nominee').GetName]获准参与内阁议事，亲手过问帝国的政务。眼下恰有一个空缺，而这家人显然不愿再等下一次机会。"
 oe_noble_petitions.2.d.occupied: "[SCOPE.sDynasty('oe_npet_family').GetName]家族递上的奏疏，谈的已不只是荣誉。他们希望[SCOPE.sCharacter('oe_npet_nominee').GetName]获准参与内阁议事，亲手过问帝国的政务。至于席位从何而来，来使已有准备：请[SCOPE.sCharacter('oe_npet_previous').GetName]让出位置，便足以表明宫廷的诚意。"
 oe_noble_petitions.2.a: "让他们的人参与议事。"
 oe_noble_petitions.2.a.tt: "由[SCOPE.sCharacter('oe_npet_nominee').GetName]接任本次选定的内阁席位，替换现任成员（如有），#G 不消耗正统性#!。\n[SCOPE.sDynasty('oe_npet_family').GetName]家族影响力：#G -50#!。"
 oe_noble_petitions.3.t: "豪族要求管理军区"
 oe_noble_petitions.3.d: "[SCOPE.sDynasty('oe_npet_family').GetName]家族如今在宫廷中声势不小，却仍没有一位族人执掌军区。他们推荐[SCOPE.sCharacter('oe_npet_nominee').GetName]赴任[SCOPE.sCountry('oe_npet_theme').GetName]，言称既能整饬军务，也能替皇帝分忧。奏疏的末尾附着一串担保人的名字；这一家愿撤回若干政治上的要求，换取真正的将军印信。"
 oe_noble_petitions.3.a: "授予将军印信，令其赴任。"
 oe_noble_petitions.3.a.tt: "[SCOPE.sCharacter('oe_npet_nominee').GetName]前往[SCOPE.sCountry('oe_npet_theme').GetName]，立即取代现任军区将军，#G 不消耗正统性#!。原任者不会被处死。\n[SCOPE.sDynasty('oe_npet_family').GetName]家族影响力：#G -50#!。"
 oe_noble_petitions.refuse: "帝国的任命不由门第决定。"
 oe_noble_petitions.refuse.tt: "权威：#R -2#!。"
 oe_noble_petitions.lapsed: "情势已变，此议作罢。"
 oe_noble_petitions.lapsed.tt: "家族、提名人或目标职位已不再符合条件；不更换任职者，也不扣除权威或影响力。"
 oe_noble_petitions.1.d.chancellor: "[SCOPE.sDynasty('oe_npet_family').GetName]家族的门客送来一封措辞恭谨的书信。信中列举了历代先人的功劳，又暗示宫廷的荣席不该总由旁人占据。他们举荐[SCOPE.sCharacter('oe_npet_nominee').GetName]进入琼筵序次，愿为这席之地收起一部分声势。\n\n他们看中的职位是#Y $oe_court_chancellor$#!。"
