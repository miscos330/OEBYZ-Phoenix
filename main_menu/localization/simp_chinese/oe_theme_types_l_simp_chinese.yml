l_simp_chinese:
 oe_pillars_convert_theme_type: "转换军区类型"
 oe_pillars_convert_theme_type_desc: "#italic “军府各任其职，诸道共卫御座。”#!\n\n选择一个普通、海军、行政或边疆军区，将其转换为另一种军区。花费100金币，无冷却；同步更换政府改革、附属类型、军区建筑与帝国柱石地位。转为海军军区要求现有首府沿海，并在首府获得10艘当前时代桨帆船；转为行政军区则退出与宗主国共同参与的战争。意大利与拉丁军区不可转换。"
 oe_theme_conversion_choose_country: "选择要转换的军区"
 oe_theme_conversion_choose_type: "选择新的军区类型"
 oe_theme_conversion_no_country: "@trigger_no!没有可转换的军区。意大利与拉丁军区不可转换。"
 oe_theme_conversion_no_type: "@trigger_no!没有符合条件的目标军区类型。"
 oe_theme_conversion_different_type: "选择与该军区当前类型不同的军区类型。"
 oe_theme_conversion_coastal_seat: "转为海军军区要求该军区现有首府位于东罗马拥有的沿海地点。"
 oe_empire_theme_naval: "海军军区"
 oe_empire_theme_naval_desc: "受御座节制的海上军府，负责舰队、军港与水手供给。计入军饷，不计入兵源；禁止转教。"
 oe_empire_theme_administrative: "行政军区"
 oe_empire_theme_administrative_desc: "承担地方行政与财赋的军府，每月向宗主国缴纳10%税基的贡金，不参与宗主国的战争，不领取军饷或兵源；禁止转教。"
 oe_empire_theme_frontier: "边疆军区"
 oe_empire_theme_frontier_desc: "镇守帝国边疆的军府，强化要塞与驻军，并提高陆军招募、补员速度和宗主国陆军维护效率；禁止转教。"
 oe_byz_theme_naval_subject: "海军军区制"
 oe_byz_theme_naval_subject_desc: "以军港为首府，统筹舰队、水手和海上补给。预期舰队增加50艘；中央军饷提供的海军维护效率随舰队扩大而递减。"
 oe_byz_theme_administrative_subject: "行政军区制"
 oe_byz_theme_administrative_subject_desc: "以首府与治所维系地方邻近度、控制力和王冠权威，专责财赋与行政，提高建筑维护效率。"
 oe_byz_theme_frontier_subject: "边疆军区制"
 oe_byz_theme_frontier_subject_desc: "沿用帝国军区的陆军供养制度，以边疆首府与治所强化要塞防御。"
 oe_byz_theme_naval_seat: "海军军区首府"
 oe_byz_theme_naval_seat_desc: "海军军府的沿海驻节地，向建筑所有者提供相当于当地税基100%的金币、固定收入与每月50水手，并加快当地造船和舰船维修。"
 oe_byz_theme_naval_post: "海军军区治所"
 oe_byz_theme_naval_post_desc: "水手征集与财赋治所，向建筑所有者提供相当于当地税基15%的金币、每月5水手，并提高当地水手规模。"
 oe_byz_theme_administrative_seat: "行政军区首府"
 oe_byz_theme_administrative_seat_desc: "地方行政的驻节中心，提供50邻近度来源，向建筑所有者提供相当于当地税基100%的金币与每月10金币，并增加当地王冠力量，并使本地贵族食物消耗降低20%。"
 oe_byz_theme_administrative_post: "行政军区治所"
 oe_byz_theme_administrative_post_desc: "由首府统辖的地方治所，提高每月控制力与邻近度效率，并向建筑所有者提供相当于当地税基15%的金币，并使本地贵族食物消耗降低20%。"
 oe_byz_theme_frontier_seat: "边疆军区首府"
 oe_byz_theme_frontier_seat_desc: "边防军府的驻节中心，向建筑所有者提供相当于当地税基100%的金币与固定收入，强化当地要塞防御、驻军规模并降低要塞维护费。"
 oe_byz_theme_frontier_post: "边疆军区治所"
 oe_byz_theme_frontier_post_desc: "边境防线上的军府治所，向建筑所有者提供相当于当地税基15%的金币和每月3人力，强化当地要塞防御、驻军规模并降低要塞维护费。"
 oe_pillars_naval_theme: "海军军区"
 oe_pillars_naval_theme_desc: "帝国柱石中的海军军府，按舰队规模计入军饷，不计入兵源。"
 oe_pillars_administrative_theme: "行政军区"
 oe_pillars_administrative_theme_desc: "帝国柱石中的行政军府，不计入军饷与兵源。"
 oe_pillars_frontier_theme: "边疆军区"
 oe_pillars_frontier_theme_desc: "帝国柱石中的边防军府，计入军饷与兵源。"
 oe_theme_naval_post_maintain: "海军治所维护"
 oe_theme_administrative_post_maintain: "行政治所维护"
 oe_theme_frontier_post_maintain: "边疆治所维护"
