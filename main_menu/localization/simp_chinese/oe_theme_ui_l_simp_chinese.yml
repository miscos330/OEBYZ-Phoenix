 OE_THEME_UI_TENURE: "任职[Country.MakeScope.GetVariable('oe_theme_tenure').GetValue|0]月[Country.Custom('OeTgHouseMark')]"
 OE_THEME_UI_LOYALTY_TT: "忠诚 [Country.MakeScope.GetVariable('oe_theme_loyalty').GetValue|0]，正趋向 [Country.MakeScope.GetVariable('oe_theme_loyalty_target').GetValue|0]。\n每月向目标移动#Y 1#!点。低于#Y 20#!且将军任职满三年，每年有叛乱之虞。\n\n目标值从#Y 50#!起算，加上以下各项（限制在#Y 0#!到#Y 100#!）：\n兵力 [Country.MakeScope.ScriptValue('oe_tl_c_army')|+=0]\n将军能力 [Country.MakeScope.ScriptValue('oe_tl_c_skill')|+=1]\n将军身份 [Country.MakeScope.ScriptValue('oe_tl_c_kin')|+=0]\n任期 [Country.MakeScope.ScriptValue('oe_tl_c_tenure')|+=0]\n距京远近 [Country.MakeScope.ScriptValue('oe_tl_c_dist')|+=0]\n方针与地位 [Country.MakeScope.ScriptValue('oe_tl_c_course')|+=0]\n属官 [Country.MakeScope.ScriptValue('oe_tl_c_staff')|+=0]\n军饷 [Country.MakeScope.ScriptValue('oe_tl_c_pay')|+=0]\n皇帝合法性 [Country.MakeScope.ScriptValue('oe_tl_c_legit')|+=1]\n皇帝武略 [Country.MakeScope.ScriptValue('oe_tl_c_mil')|+=0]\n宫廷阴谋 [Country.MakeScope.ScriptValue('oe_tl_c_intrigue')|+=0]\n平叛威慑 [Country.MakeScope.ScriptValue('oe_tl_c_deter')|+=0]\n将门 [Country.MakeScope.ScriptValue('oe_tl_c_house')|+=0]\n[oe_tu_kephale|e] [Country.MakeScope.ScriptValue('oe_tl_c_region')|+=0]\n近事 [Country.MakeScope.ScriptValue('oe_tl_c_recent')|+=0]"
 OE_THEME_UI_TIERS_TT: "五司档位：军务、民政、司法、财政、营建。\n失序 / 平平 / 良治 / 卓著，决定辖区各地的修正。"
 OE_THEME_UI_PROJ_TT: "在建工程剩余 [Country.MakeScope.GetVariable('oe_theme_proj_months').GetValue|0] 个月（无工程时为#Y 0#!）。"
 OE_THEME_UI_FOCUS_LABEL: "方针"
