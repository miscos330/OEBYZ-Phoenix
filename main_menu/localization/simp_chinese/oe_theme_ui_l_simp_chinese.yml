 OE_THEME_UI_BTN_FOCUS_DESC: "改定这个军区的[oe_tu_course|e]：陆军、海军或民政（花费 5 权威，五年内不可再改）。按钮不可点时，原因是以下之一：上次改方针未满五年；帝国权威不足 5；拉丁总督区与特许城邦不能改；没有可选的方针（边镇不能改民政，海军须治所临海）。"
 OE_THEME_UI_BTN_OFFICIALS_DESC: "决定法官与财务官由中央委派还是由将军兼管，或改行包税、授地（[oe_tu_pronoia|e]）。"
