 OE_THEME_UI_BTN_WORKS: "工程"
 OE_THEME_UI_BTN_FOCUS_DESC: "改定这个军区的[oe_tu_course|e]：陆军、海军或民政（花费#R 5#!权威，五年内不可再改）。按钮不可点时，原因是以下之一：上次改方针未满五年；[oe_tu_authority|e]不足#Y 5#!；拉丁[oe_tu_exarchate|e]与[oe_tu_charter|e]不能改；没有可选的方针（[oe_tu_march|e]不能改民政，海军须治所临海）。"
 OE_THEME_UI_BTN_OFFICIALS_DESC: "决定法官与财务官由中央委派还是由将军兼管，或改行包税、授地（[oe_tu_pronoia|e]）。授地要先在“$administrative_system$”法律里推行$pronoia_system$、$komnenian_formalization$、$palaeologan_hereditary_transition$或$reformed_pronoia_system$之一；在此之前，属官菜单里的授地一项显示为“暂不可用”。"
 OE_THEME_UI_BTN_WORKS_DESC: "让军区用自己的库藏在辖区内兴建一项工程。"
 OE_THEME_UI_BTN_FOUND_ALL: "一键设立军区"
 OE_THEME_UI_BTN_FOUND_ALL_DESC: "在所有已可设立的历史辖区各设一个军区，每个花费#R 5#!权威，权威不足时停止。"
 oe_theme_setup.1.t: "设立军区"
 oe_theme_setup.1.d: "帝国诸省多已无主事之人。依照旧日的辖区，可以一举在各地设立军区、任命将军；也可以留待日后，由陛下逐一斟酌。\n\n眼下可设立的辖区：[ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_ui_creatable_count')|0]"
 oe_theme_setup.1.a: "依历史辖区设立全部军区"
 oe_theme_setup.1.a.tt: "在所有可设立的历史辖区各设一个军区，不花费权威。"
 oe_theme_setup.1.b: "由我逐一设立"
 oe_theme_setup.1.b.tt: "之后可在“帝国柱石”的“军区”页或行政令中设立，每个花费#R 5#!权威。"
 oe_theme_setup.2.t: "军区已设立"
 oe_theme_setup.2.d: "诏书已下，新设军区 [ROOT.GetCountry.MakeScope.GetVariable('oe_theme_found_all_count').GetValue|0] 个。各军区将军已就任。"
 oe_theme_setup.2.a: "善"
 oe_theme_found_all_action: "一键设立军区"
 oe_theme_found_all_action_desc: "在所有已可设立的历史辖区各设一个军区，每个花费#R 5#!权威，权威不足时停止。"
 oe_theme_found_all_tt: "在所有已可设立的历史辖区各设一个军区，每个花费#R 5#!权威。"
 oe_theme_found_all_none_tt: "至少有一个历史辖区可以设立军区"
 oe_theme_move_seat_action: "迁移军区治所"
 oe_theme_move_seat_action_desc: "把军区的治所迁到本辖区内另一座市镇或城市。花费#R 5#!权威，#Y 10#!年内不能再迁。"
 oe_theme_move_seat_select: "选择军区"
 oe_theme_move_seat_none: "@trigger_no!这个辖区没有可迁往的市镇或城市"
 oe_theme_move_seat_tt: "先在新地点建起治所，再迁走旧治所；治府修正随之转移。十年内不能再迁。"
 oe_te_eng_charter: "\n另：特许城邦还按原版的附庸贡金向朝廷缴纳价格#Y 15%#!的贡金，由引擎结算，这里读不到数，不在“缴”里。"
 oe_te_eng_civil: "\n另：民政方针的军区还按原版的附庸贡金向朝廷缴纳价格#Y 10%#!的贡金，由引擎结算，这里读不到数，不在“缴”里。"
 oe_te_eng_none: ""
 OE_TE_CARD_LINE: "朝廷本月：饷 [Country.MakeScope.ScriptValue('oe_te_pay')|+=1]｜属官 [Country.MakeScope.ScriptValue('oe_te_off')|+=1]｜缴 [Country.MakeScope.ScriptValue('oe_te_trib')|+=1]｜军区自取税基 [Country.MakeScope.ScriptValue('oe_te_taxbase')|1]｜[Country.MakeScope.ScriptValue('oe_theme_jurisdiction_size')|0]地不出征召兵"
 OE_TE_CARD_TT: "#T 朝廷与这个军区的本月账（只读）#!\n饷 [Country.MakeScope.ScriptValue('oe_te_pay')|+=1]：帝国柱石的军饷，每月#Y 1#!金（不计通胀）× 军饷滑块 [Country.MakeScope.ScriptValue('oe_te_slider_pct')|0]% × 兵力 [Country.MakeScope.ScriptValue('oe_te_size')|1]（陆军军区按陆军规模，海军军区按船数）。朝廷按这个数付出，也按同一个数分给各军区，所以这也是本军区实收的军饷。民政方针和[oe_tu_charter|e]不领军饷。\n属官 [Country.MakeScope.ScriptValue('oe_te_off')|+=1]：中央委派的法官、财务官，各按辖区地点数 × #Y 0.2#!金每月由国库支付。\n缴 [Country.MakeScope.ScriptValue('oe_te_trib')|+=1]：[oe_tu_exarchate|e]#Y 10%#!、宗室封邑#Y 5%#!的军区月收入，加上[oe_tu_senate|e]的加征；军区金币够付全额时，本月转入国库，不够就不付。[Country.Custom('OeTeEngTrib')]\n军区自取税基 [Country.MakeScope.ScriptValue('oe_te_taxbase')|1]：首府所在地的税基 [Country.MakeScope.ScriptValue('oe_te_seat_tb')|1] 全数，加上各岗哨所在地税基 [Country.MakeScope.ScriptValue('oe_te_post_tb')|1] 的#Y 15%#!。这是军区的收入；它是否从朝廷在这些地方的税收里扣除，还没有在游戏里测定，所以不算作朝廷的损失。首府另外每月固定给军区#Y 10#!金，不在这个数里。\n不出征召兵：辖区[Country.MakeScope.ScriptValue('oe_theme_jurisdiction_size')|0]处地点上的军区建筑使当地征召兵#Y −300%#!，即归零。\n\n这只是账：打开本页时才计算，不改动任何数。"
 OE_TE_SUM_LINE: "全体军区本月（朝廷）：饷 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_pay')|+=1]｜属官 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_off')|+=1]｜缴 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_trib')|+=1]｜合计 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_net')|+=1]｜军区国库共 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_gold')|0]"
 OE_TE_SUM_TT: "#T 全体军区的本月账（只读）#!\n饷 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_pay')|+=1]，属官 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_off')|+=1]，缴 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_trib')|+=1]，合计 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_net')|+=1]（不含税基和征召兵）。\n军区国库共[GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_gold')|0]金：这些钱在军区手里，不在国库里。\n军区自取税基合计 [GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_tb')|1]：军区的收入；是否从朝廷的税收里扣除，还没有测定。\n辖区地点合计[GetCountry('BYZ').MakeScope.ScriptValue('oe_te_sum_juris')|0]处，这些地方不出征召兵。\n\n每一项怎么算，见各军区卡片上“朝廷本月”一行的悬停说明。这只是账：打开本页时才计算，不改动任何数。"
