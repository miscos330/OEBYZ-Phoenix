l_simp_chinese:
 oe_byz_constantinople_sea_walls: "君士坦丁堡海墙"
 oe_byz_constantinople_sea_walls_desc: "沿海城垣将港湾与街市护在身后。修复坍塌的墙段、整顿巡防，使帝国的都城不再轻易受到来自海面的威胁。"
 oe_city_sea_walls_maintenance: "君士坦丁堡海墙维护"
 oe_byz_constantinople_basil_academy: "巴西尔军事学院"
 oe_byz_constantinople_basil_academy_desc: "学院以巴西尔之名培养军官。战史、地形与行军纪律同样受到重视，让战场上积累的经验不再随老将离去而散失。\n\n$OE_ACADEMY_ARMY_SCORE_100$"
 oe_city_basil_academy_maintenance: "巴西尔军事学院维护"
 oe_byz_constantinople_urban_academy: "乌尔班火炮学院"
 oe_byz_constantinople_urban_academy_desc: "铸炮匠与军官在城墙附近研究炮管、装药和射击。以乌尔班为名的学院将工匠的经验编成可以传授的技艺，为帝国训练精于火炮的军官。\n\n#Y 1454年1月1日#!起可扩建。\n\n$OE_ACADEMY_ARMY_SCORE_100$"
 oe_city_urban_academy_maintenance: "乌尔班火炮学院维护"
 oe_byz_constantinople_constantine_column: "君士坦丁纪念柱"
 oe_byz_constantinople_constantine_column_desc: "斑驳的柱身见证着新罗马漫长的岁月。修缮基座与周边广场，使这座纪念碑继续向市民诉说都城建立时的雄心。\n\n第二级表示修复基座与整治周边广场。"
 oe_city_constantine_column_maintenance: "君士坦丁纪念柱维护"
 oe_byz_constantinople_thutmose_obelisk: "图特摩斯三世方尖碑"
 oe_byz_constantinople_thutmose_obelisk_desc: "远道而来的埃及石碑矗立于罗马的基座之上。清理雕刻、加固石座并恢复周边公共空间，让古老帝国的遗产继续融入都城的生活。\n\n第二级表示修复基座与整治周边广场。"
 oe_city_thutmose_obelisk_maintenance: "图特摩斯三世方尖碑维护"
 oe_byz_constantinople_nymphaeum: "宁芙神庙"
 oe_byz_constantinople_nymphaeum_desc: "古代泉庭重新流出清水。修复的柱廊、雕像与水池为过往市民提供歇息之处，也让繁忙的礼仪区多了一片安静的公共空间。"
 oe_city_nymphaeum_maintenance: "宁芙神庙维护"
 oe_byz_constantinople_theodosian_market: "提奥多西商业区"
 oe_byz_constantinople_theodosian_market_desc: "梅塞大道两侧的店铺与货栈汇聚着来自各地的货物。铺设通道、整治街市并增设经营场所，使商人和新居民更愿意在此落脚。"
 oe_city_theodosian_market_maintenance: "提奥多西商业区维护"
 oe_byz_constantinople_senate_rotunda: "元老院圆形大厅"
 oe_byz_constantinople_senate_rotunda_desc: "圆形大厅重新成为议政与审议文书的场所。元老和官员在这里核对案卷、商议政务，使古老的议事传统服务于今日的帝国。"
 oe_city_senate_rotunda_maintenance: "元老院圆形大厅维护"
 oe_byz_constantinople_magnaura: "拉马尼奥尔宫"
 oe_byz_constantinople_magnaura_desc: "修复后的宫廷接待厅迎来各国使节。礼仪、谈判与正式接见在此进行，让帝国的承诺获得与其历史相称的分量。\n\n扩建须#Y 大皇宫扩建工程竣工#!，仅开始施工不满足条件。"
 oe_city_magnaura_maintenance: "拉马尼奥尔宫维护"
 oe_byz_constantinople_daphne: "达夫纳宫"
 oe_byz_constantinople_daphne_desc: "旧日皇室居所重新得到修缮。宫中的日常起居与正式仪式使大皇宫恢复生气，也让皇位的延续成为臣民可以目睹的事实。\n\n扩建须#Y 大皇宫扩建工程竣工#!，仅开始施工不满足条件。"
 oe_city_daphne_maintenance: "达夫纳宫维护"
 oe_byz_constantinople_chalke: "沙尔克宫"
 oe_byz_constantinople_chalke_desc: "庄严的门殿再次迎接皇帝的仪仗。卫士守护宫门，官员循礼进出，皇室的秩序与权力由此向都城及帝国各地展现。\n\n扩建须#Y 大皇宫扩建工程竣工#!，仅开始施工不满足条件。"
 oe_city_chalke_maintenance: "沙尔克宫维护"
 oe_byz_constantinople_jewish_community: "犹太社区"
 oe_byz_constantinople_jewish_community_desc: "在帝国统一管辖下，犹太居民获得安定的居所和经营场地。家庭、作坊与社区生活逐渐恢复，为金角湾带来新的技艺与往来。\n\n扩建须完成帝国改革#Y 驱逐外夷#!。"
 oe_city_jewish_community_maintenance: "犹太社区维护"
 OE_CITY_REQUIRE_PALACE: "扩建条件：#Y 大皇宫扩建工程已竣工#!"
 OE_CITY_REQUIRE_1454: "扩建条件：#Y 1454年1月1日#!起"
