# NEW 2026-11-23 v19.0 Module 19.0-C: Bilingual Localization (simp_chinese, 115 keys, 100% EN/ZH parity) (oe_qol_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v190_qol_mp.py; edit the generator, not this file.
 oe_qol_human_only_tt:0 "仅限人类玩家主动选用（AI永不执行，未开启时不产生任何自动改动）。"
 oe_qol_ev_1_a_tt:0 "启用年度#Y 宫廷贵族联姻助手#!（每年为最多3名18–35岁未婚成年贵族或宗室近臣安排婚配；绝不干涉君主或储君联姻）。"
 oe_qol_ev_1_b_tt:0 "启用年度#Y 宫廷贵族联姻助手#!，并立即执行一轮宫廷婚配（最多为3名18–35岁适龄近臣撮合）。"
 oe_qol_ev_1_c_tt:0 "彻底关闭#Y 宫廷贵族联姻助手#!，后续不再自动撮合任何宫廷婚配。"
 oe_qol_ev_2_a_tt:0 "启用#Y 皇家精修均衡派#!自动教育：国库>=250时自动为王储安排高阶精修教育，其余3–15岁宗室幼童安排均衡教育，并立即执行一轮分派。"
 oe_qol_ev_2_b_tt:0 "启用#Y 适性政务专精派#!自动教育：依据3–15岁宗室幼童天资与当前帝国战和格局自动分派行政、外交或军事专科，并立即执行一轮分派。"
 oe_qol_ev_2_c_tt:0 "彻底关闭#Y 王储与宗室子女教育助手#!，后续不再自动更改任何儿童教育。"
 oe_qol_ev_5_a_tt:0 "为本国启用#Y 联机公平竞赛与后期反滚雪球公约#!（平滑厌战恢复、巩固停战稳定、温和约束雇佣兵溢价，并在超80与160处地点时生效分档软上限）。"
 oe_qol_ev_5_b_tt:0 "为本国启用#Y 公平竞赛公约#!；若处于多人联机局，将向尚未加入的其他在线玩家发出一次自愿签署邀请（绝不强制）。"
 oe_qol_ev_5_c_tt:0 "退出#Y 联机公平竞赛与反滚雪球公约#!并立即移除全部公约修正，恢复原版标准规则。"
 oe_qol_dec_toggle_court_marriage_aid.title:0 "【便捷助手】宫廷贵族联姻助手（可选开关）"
 oe_qol_dec_toggle_court_marriage_aid.desc:0 "打开可选的【宫廷贵族联姻助手】配置面板。启用后，宫廷每年自动为最多3名18至35岁未婚成年贵族与宗室近臣撮合婚配（优先在现有适龄近臣间配对，绝不干涉君主与储君的外交联姻），彻底免除后期家系断绝微操。默认关闭，随时可停用。"
 oe_qol_dec_toggle_court_marriage_aid.a:0 "配置宫廷贵族联姻助手"
 oe_qol_dec_toggle_court_marriage_aid_tt:0 "打开#Y 宫廷贵族联姻助手#!配置界面（可启用年度自动婚配、立即执行一轮撮合，或随时彻底关闭）。"
 oe_qol_dec_toggle_heir_tutor_aid.title:0 "【便捷助手】王储与宗室子女教育助手（可选开关）"
 oe_qol_dec_toggle_heir_tutor_aid.desc:0 "打开可选的【王储与宗室子女教育助手】配置面板。启用后，当王储或3至15岁宗室幼童尚未选定学业时，宫廷太傅将按你设定的方针（皇家精修均衡派 / 适性政务专精派）自动分配最佳启蒙教育。默认关闭，随时可停用。"
 oe_qol_dec_toggle_heir_tutor_aid.a:0 "配置王储与宗室教育助手"
 oe_qol_dec_toggle_heir_tutor_aid_tt:0 "打开#Y 王储与宗室子女教育助手#!配置界面（可选皇家精修均衡模式、适性专精模式，或随时彻底关闭）。"
 oe_qol_dec_batch_rgo_investment.title:0 "【宏观批处理】一键批量扩建高产原料与义仓"
 oe_qol_dec_batch_rgo_investment.desc:0 "按实际扩建数量从国库按比例支出资金（每处60金币，最多挑选5处利润最高且尚未满级的本土核心原料产地），直接提升原料最大工人数+1并增加地方繁荣度；若入选城镇尚无义仓且国库充裕，同时排建常规付费义仓。每5年可执行一次。"
 oe_qol_dec_batch_rgo_investment.a:0 "执行一键批量原料与义仓投资"
 oe_qol_dec_batch_rgo_investment_tt:0 "按每处#Y 60金币#!比例出资，为最多5处高利润核心原料产地扩充最大工人数（+1）并提升繁荣，顺带为其中缺仓城镇排建义仓，开启持续5年的#Y 帝国资源与义仓批量拓殖周期#!。"
 oe_qol_dec_batch_trunk_road.title:0 "【宏观批处理】一键联通首都干道与行省市场枢纽"
 oe_qol_dec_batch_trunk_road.desc:0 "支付60金币皇家勘测费并按常规造价开工筑路，以当前已解锁最高等级道路（兼容帝国大道与铁路）一键为最多3处高人口行省重镇或市场枢纽接通首都与高掌控路网。与持续运行的帝国驿道署互补，每5年可按需突击一次。"
 oe_qol_dec_batch_trunk_road.a:0 "开工行省干道与市场联通工程"
 oe_qol_dec_batch_trunk_road_tt:0 "支付#Y 60金币#!勘测费并按正常造价开工，以最强已解锁道路一键衔接最多#Y 3处高人口行省枢纽#!，获得持续5年的#Y 行省干道与市场联通特许周期#!。"
 oe_qol_dec_mp_balance_compact.title:0 "【联机平衡】公平竞赛与后期反滚雪球公约（可选）"
 oe_qol_dec_mp_balance_compact.desc:0 "打开自愿签署的【联机公平竞赛与后期反滚雪球公约】面板。专为竞技联机房间（及愿意自设后期挑战的玩家）打造：平滑战后厌战恢复、巩固停战期稳定、温和约束后期佣兵通胀，并在疆域超80与160处地点时分档施加反滚雪球软上限。绝不强加于单人模式，随时可退出。"
 oe_qol_dec_mp_balance_compact.a:0 "配置联机公平与反滚雪球公约"
 oe_qol_dec_mp_balance_compact_tt:0 "打开#Y 公平竞赛与反滚雪球公约#!配置界面（可为本国启用、向联机房其他玩家发出自愿加入邀请，或随时退出恢复默认规则）。"
 oe_qol.1.title:0 "宫廷贵族联姻簿记署"
 oe_qol.1.desc:0 "宫廷纹章官呈上厚重的贵族谱牒。每至中后期疆域辽阔之际，宗室旁支与功臣子弟往往因君主日理万机、无暇逐一指婚而终老未娶，致使朝中可用之才日渐凋零。若启用此项纯可选助手，纹章署将每年静默为最多三名18至35岁未婚成年贵族与宗室近臣撮合婚配——优先撮合朝中适龄单身近臣，绝不干涉君主与储君的外交联姻。"
 oe_qol.1.a:0 "启用年度宫廷贵族自动联姻助手"
 oe_qol.1.b:0 "启用助手并立即执行一轮宫廷撮合"
 oe_qol.1.c:0 "关闭宫廷联姻助手（恢复全手动）"
 oe_qol.2.title:0 "宗室太傅与储君启蒙署"
 oe_qol.2.desc:0 "宗室学宫大太傅恭候御前定例。与其每逢王储或宗室幼童初入启蒙年岁便逐一翻检界面指派师保，陛下可授权太傅署每年自动为其分派最佳学业：既可选择“皇家精修均衡派”（国库充盈时为王储启用高阶精修教育、其余宗室子弟修习均衡全科），亦可选用“适性政务专精派”（按幼童天资与帝国战和局势自动择优分派行政、外交或军事专科）。"
 oe_qol.2.a:0 "启用【皇家精修均衡派】自动教育"
 oe_qol.2.b:0 "启用【适性政务专精派】自动教育"
 oe_qol.2.c:0 "关闭宗室教育助手（恢复全手动）"
 oe_qol.3.title:0 "帝国原料扩产与常平义仓勘验录"
 oe_qol.3.desc:0 "司农与矿冶勘察使已完成本轮批量原料扩产与义仓拨款的巡核并呈报清册。以一纸御前统筹令同步扩充多处高利原料产地并补建城镇义仓，省却了数月文牍周折，令大批新辟工位与粮囤同时见效。度支总管请示下一步的城乡物资统筹方针："
 oe_qol.3.a:0 "统编行省常平仓粮储与防荒规制"
 oe_qol.3.b:0 "颁授皇家矿冶农林特许增产契约"
 oe_qol.4.title:0 "帝国皇家测绘馆干道勘图捷报"
 oe_qol.4.desc:0 "在宏阔的帝国测绘馆长案之上，皇家舆图师用朱笔标出刚刚动工的多条骨干通衢，将首都核心路网径直延伸至人口稠密的行省枢纽与市场重镇。按需成批开工干道既打破了地方隔绝，又避免国库被零散乡道过度摊薄。朝廷当常设干道测绘工团，还是沿新路颁授跨市驿路联运特许？"
 oe_qol.4.a:0 "常设帝国干道测绘与里程碑工团"
 oe_qol.4.b:0 "颁授跨市驿路联运与商税通票"
 oe_qol.5.title:0 "联机公平竞赛与后期反滚雪球公约"
 oe_qol.5.desc:0 "诸国特使与联机竞赛仲裁官呈上一份纯自愿的《公平竞赛与后期反滚雪球公约》。缔约国将享有更平滑的战后厌战消退与更稳固的停战协议保障，同时在疆域迈过80处与160处地点时循序激活温和的雇佣兵溢价与宫廷软上限——令中后期列强合纵与大战持续充满悬念，且绝不强加于单人游玩，随时可自由退出。"
 oe_qol.5.a:0 "本国签署公平竞赛与反滚雪球公约"
 oe_qol.5.b:0 "签署公约并向同局联机玩家发出自愿邀请"
 oe_qol.5.c:0 "退出或不签署（保持原版无上限规则）"
 oe_qol.6.title:0 "大帝国后期行政效能统筹宪章"
 oe_qol.6.desc:0 "随着帝国进入中后期并横跨数十行省，浩繁公文与政出多门渐成枢密重负。帝国测绘馆与内阁典籍官联名建言：或统核中央枢密典册以大幅提升内阁执行精度与掌控极限，或分遣行省钦差巡抚就近裁决常政以拓宽帝国全局统筹容量。"
 oe_qol.6.a:0 "统核中央枢密典册与制式公文流转"
 oe_qol.6.b:0 "分设行省钦差巡抚与地方分司统筹"
 oe_qol.7.title:0 "帝国大城镇烟户与匠籍普查"
 oe_qol.7.desc:0 "兴盛的大都市与手工业重镇早已突破中世纪旧籍边界，令有司在核税与规划市政时难窥实数。推行覆盖全境的大城镇烟户普查可带来两大长远红利：或厘定精准鱼鳞图册与烟户税簿以充盈国库、促进繁衍，或同步兴办市政蒙学与行会匠籍录以厚植识字率与工艺革新。"
 oe_qol.7.a:0 "编纂帝国鱼鳞图册与城镇烟户清册"
 oe_qol.7.b:0 "兴办市政识字学堂并统编行会匠籍"
 oe_qol.8.title:0 "洲际官驿邮传与商情汇兑网"
 oe_qol.8.desc:0 "随着行省干道日渐贯通，驿传总署奏请将零散信使整合为按刻发班的洲际邮传体系。专设国家官驿急递可令边疆重镇与驻外使节如臂使指，而向商号汇票与行情邸报开放官督商办邮传则能让每条大道化作滚滚财源。"
 oe_qol.8.a:0 "敕建按刻换马的国家官驿急递网"
 oe_qol.8.b:0 "开设官督商办万国邮传与汇兑局"
 oe_qol.9.title:0 "主权公债整理与国库平衡新政"
 oe_qol.9.desc:0 "后期大战、巨型要塞与跨洋经略令再雄厚的国库也面临信用大考。皇家司农与银团专家呈上两份现代财政法案：一是以专项关税设立透明主权偿债基金，压降利息并平抑通胀；二是推行司农司季度关税与宫廷审计，以充沛现金流支撑宏图。"
 oe_qol.9.a:0 "设立关税担保主权公债偿债基金"
 oe_qol.9.b:0 "推行司农司季度关税审计与度支节流"
 oe_qol.10.title:0 "列强协调停战与均势外交议定书"
 oe_qol.10.desc:0 "连绵数代的洲际大战令各国枢密院深知，无休止的总体消耗终将令胜败双方俱伤。资深外交官齐聚拟订《列强协调停战议定书》：或签署正式复员与停战保障以加速厌战平复、严惩毁约者，或以稳健内政与广博外交斡旋维系武装均势。"
 oe_qol.10.a:0 "批准列强协调停战与复员保障议定书"
 oe_qol.10.b:0 "奉行均势武装威慑与多边外交斡旋"
 STATIC_MODIFIER_NAME_oe_qol_mod_marriage_aid_active:0 "宫廷贵族联姻簿记署"
 STATIC_MODIFIER_DESC_oe_qol_mod_marriage_aid_active:0 "宫廷纹章官按玩家启用设置，每年为18至35岁未婚成年贵族与宗室近臣撮合佳偶，既免除后期繁琐微操，又不干涉君主与储君的外交联姻。"
 STATIC_MODIFIER_NAME_oe_qol_mod_tutor_aid_active:0 "宗室太傅与储君启蒙署"
 STATIC_MODIFIER_DESC_oe_qol_mod_tutor_aid_active:0 "宫廷太傅按玩家所选培养方针，在王储与宗室幼童进入启蒙年岁时自动安排最适宜的学业方向，免除反复点选之苦。"
 STATIC_MODIFIER_NAME_oe_qol_mod_rgo_macro_cd:0 "帝国资源与义仓批量拓殖周期"
 STATIC_MODIFIER_DESC_oe_qol_mod_rgo_macro_cd:0 "国库勘察署已向最多五处高潜力核心原料产地拨付批量扩产与义仓拨款，五年周期内加速全境原料开发与仓储周转。"
 STATIC_MODIFIER_NAME_oe_qol_mod_trunk_road_cd:0 "行省干道与市场联通特许周期"
 STATIC_MODIFIER_DESC_oe_qol_mod_trunk_road_cd:0 "皇家工部已从首都路网向最多三处人口稠密的行省枢纽与市场重镇批量开工高等级干道，五年周期内加快筑路与地方掌控。"
 STATIC_MODIFIER_NAME_oe_qol_mod_mp_fairplay_compact:0 "联机公平竞赛与后期平衡公约"
 STATIC_MODIFIER_DESC_oe_qol_mod_mp_fairplay_compact:0 "由玩家自愿签署的联机公平竞赛公约：平滑战后厌战恢复、抬高毁约破停战门槛并温和约束后期雇佣兵溢价，不强加于单人游玩。"
 STATIC_MODIFIER_NAME_oe_qol_mod_mp_softcap_t1:0 "联机反滚雪球软上限（一阶）"
 STATIC_MODIFIER_DESC_oe_qol_mod_mp_softcap_t1:0 "在联机公平公约启用且疆域达80处以上地点时生效的温和软上限：适度提高雇佣兵溢价与宫廷运转开支，避免中期过早碾压定局。"
 STATIC_MODIFIER_NAME_oe_qol_mod_mp_softcap_t2:0 "联机反滚雪球软上限（二阶）"
 STATIC_MODIFIER_DESC_oe_qol_mod_mp_softcap_t2:0 "在联机公平公约启用且帝国疆域超160处地点时生效的渐进式霸权软上限：抑制无限佣兵堆砌与超大规模扩张惯性，维持后期多强博弈张力。"
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_rgo_granary_ledger:0 "行省常平仓与粮储统账制"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_rgo_granary_ledger:0 "统编各省常平仓粮册与原料产地清册，在扩充核心产出之余为大城市构筑抗灾防饥缓冲。"
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_rgo_charter_output:0 "皇家矿冶农林特许增产令"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_rgo_charter_output:0 "以多年期特许开采与农林契约激励地方商帮，同步拉动原料产量与手工工场效率。"
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_trunk_survey_corps:0 "帝国干道勘测与里程碑工团"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_trunk_survey_corps:0 "常设皇家测绘工团统一首都至各大行省枢纽的里程碑、石桥与坡度规制，大幅加快路网建设并强化中央掌控。"
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_market_relay_tolls:0 "跨市驿路商税联运特许"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_market_relay_tolls:0 "精简新辟干道沿线厘金关卡并推行联运通票，显著提升跨区域贸易收益与城镇繁荣。"
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_admin_chancery:0 "帝国枢密典册中央统核制"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_admin_chancery:0 "以分门归档的中央典册与制式公文流转大幅削减庞大帝国的行政内耗，抬升内阁效能与掌控上限。"
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_provincial_intendants:0 "行省钦差巡抚与分司统筹制"
