 oe_glh_ulus: "术赤兀鲁思"
 oe_glh_ulus_desc: "金帐汗国治下的草原翼部与万户，在汗廷盛世时以大汗之名义与地图颜色统合一体，按制纳贡，不可随意吞并。当汗廷凝聚度高企时随大汗征战四方；一旦陷入大混乱或萨莱受挫，各翼部便会拒战离心，直至独立分立为草原诸汗国。"
 LEAD_oe_glh_ulus: "$LIST$是[SUBJECT_TYPE.GetName]"
