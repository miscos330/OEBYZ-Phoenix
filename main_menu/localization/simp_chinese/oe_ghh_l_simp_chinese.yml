 oe_glh_ulus_subject_opinion: "萨莱大汗"
 oe_glh_ulus_overlord_opinion: "术赤翼部"
 oe_ghh_ulus_join_off_tt: "金帐汗国兀鲁思凝聚度至少为#Y 60#!"
 oe_ghh_ulus_call_off_tt: "金帐汗国兀鲁思凝聚度至少为#Y 30#!"
 oe_ghh_ulus_join_def_tt: "金帐汗国兀鲁思凝聚度至少为#Y 30#!"
 STATIC_MODIFIER_NAME_oe_ghh_ulus_loyal: "萨莱威仪"
 STATIC_MODIFIER_DESC_oe_ghh_ulus_loyal: "汗廷威权稳固，各翼部那颜与宗王敬畏大汗，谨守忽里勒台旧约。"
 STATIC_MODIFIER_NAME_oe_ghh_ulus_restless: "翼部离心"
 STATIC_MODIFIER_DESC_oe_ghh_ulus_restless: "萨莱汗廷威望低落，地方异密截留贡赋，不再轻易听从大汗号令。"
 STATIC_MODIFIER_NAME_oe_ghh_ulus_defiant: "割据自重"
 STATIC_MODIFIER_DESC_oe_ghh_ulus_defiant: "翼部诸王各自募兵设防，已将萨莱视为虚名共主，随时准备独立自立。"
 STATIC_MODIFIER_NAME_oe_ghh_glh_troubles: "金帐大混乱"
 STATIC_MODIFIER_DESC_oe_ghh_glh_troubles: "汗位更迭不息，权臣挟主自重，东西各翼部离心离德，萨莱财赋与号令大损。"
 STATIC_MODIFIER_NAME_oe_ghh_glh_shattered: "萨莱余烬"
 STATIC_MODIFIER_DESC_oe_ghh_glh_shattered: "伏尔加商道与汗廷核心惨遭重创，术赤兀鲁思的统一权威已难维系，各地汗国竞相分立。"
 STATIC_MODIFIER_NAME_oe_ghh_yassa_reform: "雅撒与沙里亚集权"
 STATIC_MODIFIER_DESC_oe_ghh_yassa_reform: "汗廷重修法度，厘定贡赋与万户军役，初步遏制了权臣割据之势。"
 STATIC_MODIFIER_NAME_oe_ghh_jochid_revival: "术赤中兴"
 STATIC_MODIFIER_DESC_oe_ghh_jochid_revival: "大汗压服诸翼异密，重整萨莱中枢，术赤兀鲁思自克里米亚至西伯利亚再度归心一体。"
 STATIC_MODIFIER_NAME_oe_ghh_janibeg_pax: "札尼别盛世"
 STATIC_MODIFIER_DESC_oe_ghh_janibeg_pax: "月即别汗晚年至札尼别汗坐稳萨莱汗位期间厉行法度，钦察草原商道安宁、诸部怀服、叛乱消弭，汗廷团结与稳定稳步维系。"
 STATIC_MODIFIER_NAME_oe_ghh_glh_emergency_forage: "汗廷冬牧应急粮草"
 STATIC_MODIFIER_DESC_oe_ghh_glh_emergency_forage: "萨莱汗廷在早年动荡中紧急调拨伏尔加囤粮与牧草，确保直辖大营不致因饥荒崩解。"
 oe_ghh_b_ulus_breakaway: "背离萨莱汗廷"
 oe_ghh_b_ulus_raid: "兀鲁思边地劫掠"
 oe_ghh_b_ulus_appeased: "汗廷恩赏安抚"
 oe_ghh_b_ulus_purged: "整肃异密权臣"
 oe_ghh_dec_kurultai_gifts.title: "召开忽里勒台赐宴诸翼"
 oe_ghh_dec_kurultai_gifts.desc: "邀集各术赤兀鲁思那颜齐聚萨莱，赐予厚赏以申旧约，提升兀鲁思凝聚度#G +12#!，每#Y 5#!年可行一次。"
 oe_ghh_dec_kurultai_gifts.a: "厚赏诸翼，共襄汗廷"
 oe_ghh_dec_yassa_reform.title: "颁行雅撒与沙里亚集权法典"
 oe_ghh_dec_yassa_reform.desc: "重整萨莱中枢法度，将草原雅撒与沙里亚律法合流以约束诸翼异密，恢复凝聚度上限至#Y 100#!并推进重整术赤兀鲁思第一阶段。"
 oe_ghh_dec_yassa_reform.a: "法度既明，诸翼皆服"
 oe_ghh_dec_purge_begs.title: "整肃割据异密，改制收藩"
 oe_ghh_dec_purge_begs.desc: "趁汗廷威权高涨之际清算割据权臣，将尚存的术赤兀鲁思翼部一律改制为可吞并的普通附庸，开启直接整合之路。"
 oe_ghh_dec_purge_begs.a: "削平藩镇，政出萨莱"
 oe_ghh_dec_jochid_revival.title: "重整术赤兀鲁思"
 oe_ghh_dec_jochid_revival.desc: "萨莱与阿斯特拉罕稳如磐石，诸翼异密尽数俯首。自此彻底终结大混乱与分立之患，开启术赤中兴新局。"
 oe_ghh_dec_jochid_revival.a: "术赤一统，永固草原"
 oe_ghh.1.t: "术赤五翼格局"
 oe_ghh.1.d: "#F 1337年，月即别汗治下的术赤兀鲁思正值极盛。萨莱汗廷直辖下伏尔加、顿河与钦察腹地，外围则由左翼白帐、昔班兀鲁思、花剌子模、保加尔与喀山万户以及克里米亚万户五翼屏藩。#!\n\n盛世之下，五翼以术赤兀鲁思附庸之礼随大汗出征，地图上共呈金帐版图。惟有维持汗廷凝聚度（当前#Y 85#!）、慎防继位动荡与外患冲击，方能保草原不裂；若志在集权，可通过决议逐步推行雅撒与沙里亚改制，最终重整术赤兀鲁思。"
 oe_ghh.1.a: "萨莱之令，当行于五翼"
 oe_ghh.1.a.tt: "威望#G +5#!；开启术赤兀鲁思集权与兴衰格局"
 oe_ghh.2.t: "草原瘟疫"
 oe_ghh.2.d: "#F 大疫自草原商道蔓延至伏尔加与黑海北岸，市集萧条，牧帐十室九空，贡赋与商税骤减。#!\n\n瘟疫正动摇萨莱的财力与威信。汗廷是要散财赈济并严控商站，还是厉行旧法、任由草原自渡劫难？"
 oe_ghh.2.a: "开库赈济商站与牧部"
 oe_ghh.2.a.tt: "花费#R 80#!金币，兀鲁思凝聚度#R −8#!"
 oe_ghh.2.b: "坚守汗廷财库，听凭诸翼自救"
 oe_ghh.2.b.tt: "兀鲁思凝聚度#R −18#!，稳定度#R −2.5#!"
 oe_ghh.3.t: "大混乱降临"
 oe_ghh.3.d: "#F 拔都直系汗嗣动摇，萨莱权臣与草原异密各自拥兵观望。自此之后，汗位更迭频仍，东西翼部渐渐不再听命于中枢。#!\n\n金帐汗国已步入第二阶段“大混乱”。各翼部忠诚大跌，进攻战中不再自动随征；唯有稳住汗廷团结、凝聚度与国库，方能避免诸翼分崩离析。"
 oe_ghh.3.a: "重金笼络诸翼那颜，稳住大局"
 oe_ghh.3.a.tt: "花费#R 120#!金币，兀鲁思凝聚度#G +10#!，诸翼好感#G +25#!"
 oe_ghh.3.b: "厉行雅撒军法，震慑草原"
 oe_ghh.3.b.tt: "稳定度#R −7#!，部落团结度#G +10#!，兀鲁思凝聚度#G +5#!"
 oe_ghh.3.c: "收缩直辖，静观诸翼之变"
 oe_ghh.3.c.tt: "获得[ShowModifier('oe_ghh_glh_troubles')]；各翼部开始自行其是"
 oe_ghh.4.t: "花剌子模苏菲自立"
 oe_ghh.4.d: "#F 趁萨莱陷入大混乱，镇守玉龙杰赤的弘吉剌部苏菲家族停止纳贡，以花剌子模之主自居，图谋脱离术赤汗廷。#!\n\n花剌子模远隔沙海，若强行压服耗费甚巨；若放任自立，则西南商埠从此脱离萨莱掌控。"
 oe_ghh.4.a: "遣骑兵南下弹压，迫使玉龙杰赤纳贡"
 oe_ghh.4.a.tt: "花费#R 150#!金币、稳定度#R −7#!；花剌子模暂留附庸，兀鲁思凝聚度#G +5#!"
 oe_ghh.4.b: "力所不及，任由花剌子模自立"
 oe_ghh.4.b.tt: "花剌子模（KHW）脱离术赤兀鲁思并独立，兀鲁思凝聚度#R −5#!"
 oe_ghh.5.t: "帖木儿兵锋与萨莱之劫"
 oe_ghh.5.d: "#F 铁骑北卷，下伏尔加商道残破，萨莱的繁华付之一炬。大汗威严扫地，草原诸翼与曼吉特大异密纷纷摩拳擦掌。#!\n\n金帐汗国已步入第三阶段“大解体”。兀鲁思凝聚度上限跌至#Y 55#!；若未能迅速推行集权改革重振中枢，诺盖、白帐、西伯利亚、克里米亚、喀山与阿斯特拉罕都将次第分立。"
 oe_ghh.5.a: "收拢余众，誓保萨莱香火"
 oe_ghh.5.a.tt: "获得[ShowModifier('oe_ghh_glh_shattered')]，凝聚度上限降至#Y 55#!（仍可通过集权决议扭转）"
 oe_ghh.6.t: "也迪古与诺盖帐自立"
 oe_ghh.6.d: "#F 乌拉尔河与萨莱楚克一带的曼吉特诸部在权臣也迪古号召下集结成帐，自成诺盖汗廷，不再受萨莱直辖。#!\n\n乌拉尔河下游牧场已渐失控。大汗是要倾尽余力压制曼吉特部，还是承认诺盖帐自立以保全伏尔加核心？"
 oe_ghh.6.a: "兴师萨莱楚克，强行压服曼吉特部"
 oe_ghh.6.a.tt: "花费#R 200#!金币、稳定度#R −7#!、部落团结度#R −10#!；阻止诺盖汗国独立"
 oe_ghh.6.b: "无力东顾，诺盖汗国自此分立"
 oe_ghh.6.b.tt: "在萨莱楚克一带动态释出独立的诺盖汗国（NOG）"
 oe_ghh.7.t: "兀鲁思分立"
 oe_ghh.7.d: "#F 萨莱权威日微，又一支术赤翼部正式扯下大汗旗帜，在领地内自立可汗名号，不再向伏尔加纳贡。#!\n\n该翼部已解除术赤兀鲁思附庸关系并恢复独立汗国国号与版图色彩。若想重归一统，唯有用刀剑或集权改革挽回颓势。"
 oe_ghh.7.a: "总有一天要收回术赤旧土"
 oe_ghh.7.a.tt: "威望#R −10#!；该翼部已独立建国"
 oe_ghh.8.t: "阿斯特拉罕汗国分化"
 oe_ghh.8.d: "#F 下伏尔加河口商埠阿斯特拉罕的宗王与豪商趁汗廷衰微自立门户，将伏尔加三角洲从大帐汗国中割裂出去。#!\n\n新萨莱仍在汗廷手中，但阿斯特拉罕正欲分立。大汗是否还有余力强行守住伏尔加河口？"
 oe_ghh.8.a: "倾全军死守阿斯特拉罕河口"
 oe_ghh.8.a.tt: "花费#R 200#!金币、稳定度#R −7#!；保住阿斯特拉罕直辖"
 oe_ghh.8.b: "大势已去，阿斯特拉罕分立建国"
 oe_ghh.8.b.tt: "在阿斯特拉罕地区动态释出独立的阿斯特拉罕汗国（ATR），新萨莱仍归金帐保留"
 oe_ghh.9.t: "整肃异密，收归藩翼"
 oe_ghh.9.d: "#F 萨莱禁军雷霆出击，跋扈的草原权臣尽数伏法。尚存的术赤诸翼已改制为可由汗廷吞并整合的普通附庸。#!\n\n大汗既已掌握主动，接下来要以怀柔恩赏安抚诸翼余众，还是借势宣示汗廷无上权威？"
 oe_ghh.9.a: "加封顺从那颜，恩威并施"
 oe_ghh.9.a.tt: "兀鲁思凝聚度#G +10#!；诸附庸好感#G +25#!"
 oe_ghh.9.b: "宣告汗廷独尊，准备全面吞并整合"
 oe_ghh.9.b.tt: "威望#G +10#!，部落团结度#G +10#!，兀鲁思凝聚度#G +5#!"
 oe_ghh.10.t: "术赤中兴"
 oe_ghh.10.d: "#F 大混乱的阴霾已散，萨莱与阿斯特拉罕重现月即别盛世的辉煌。草原各部再度尊奉黄金家族一统号令，大解体之患永绝。#!\n\n金帐汗国永久获得[ShowModifier('oe_ghh_jochid_revival')]，兀鲁思凝聚度锁定高位，一切分裂事件从此彻底关闭。"
 oe_ghh.10.a: "黄金家族之旗，永耀欧亚草原"
 oe_ghh.10.a.tt: "永久获得[ShowModifier('oe_ghh_jochid_revival')]；部落团结度#G +25#!"
