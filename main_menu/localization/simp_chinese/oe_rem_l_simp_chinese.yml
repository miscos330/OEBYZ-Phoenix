l_simp_chinese:
 oe_rem_b_bosphorus_accord: "博斯普鲁斯双鹰海峡自由通航协定"
 oe_rem_b_black_sea_rupture: "黑海暖水港争霸决裂"
 oe_rem_b_baltic_alarm: "忌惮涅瓦波罗的海新窗"
 oe_rem_b_kyakhta_yuan_treaty: "恰克图蒙俄划界互市大约"
 oe_rem_b_kyakhta_border_pact: "恰克图远东通商划界"
 oe_rem_b_raskol_greek_bond: "希腊典籍礼仪校勘之谊"
 STATIC_MODIFIER_NAME_oe_rem_romanov_autocracy: "1613全罗斯新朝定局：沙皇专制"
 STATIC_MODIFIER_DESC_oe_rem_romanov_autocracy: "全罗斯缙绅会议推戴新王朝，确立自上而下的沙皇专制与中央制御，但令市民自治空间收缩、国家治理承压。"
 STATIC_MODIFIER_NAME_oe_rem_novgorod_mercantile_charter: "诺夫哥罗德波罗的海大商会宪章"
 STATIC_MODIFIER_DESC_oe_rem_novgorod_mercantile_charter: "北方大议会以商团宪章确立汉萨—白海自由贸易区与任期总督制，商贸繁荣而中央集权与征召兵源偏弱。"
 STATIC_MODIFIER_NAME_oe_rem_kyiv_federal_compact: "基辅—鲁塞尼亚三国联邦大协约"
 STATIC_MODIFIER_DESC_oe_rem_kyiv_federal_compact: "基辅、特维尔贵族与扎波罗热哥萨克共签联邦大宪章，诸邦忠诚与外交声誉大增，但中央内阁与征税分散。"
 STATIC_MODIFIER_NAME_oe_rem_sobornoe_serfdom: "《1649会议法典》：全境农奴制"
 STATIC_MODIFIER_DESC_oe_rem_sobornoe_serfdom: "以成文法将农民永久固着于领地以换取服役贵族的兵源与忠诚，却严重滞后思潮传播并激起底层怨恨。"
 STATIC_MODIFIER_NAME_oe_rem_free_homesteaders: "《1649会议法典》：自由垦殖农律"
 STATIC_MODIFIER_DESC_oe_rem_free_homesteaders: "限制领主私捕逃农并保留边疆自由垦殖权，税基与地方繁荣稳步增长，但引发世袭服役贵族强烈不满。"
 STATIC_MODIFIER_NAME_oe_rem_raskol_nikon_unity: "尼康牧首统一礼仪：中央教权"
 STATIC_MODIFIER_DESC_oe_rem_raskol_nikon_unity: "以铁腕按希腊古本统一全罗斯圣礼与经卷，强化中央牧首教权与正教凝聚力，却引发伏尔加与北方旧礼仪派流亡抗命。"
 STATIC_MODIFIER_NAME_oe_rem_raskol_greek_mediation: "双鹰共勘古本：温和礼仪校正"
 STATIC_MODIFIER_DESC_oe_rem_raskol_greek_mediation: "由君士坦丁堡希腊学者与罗斯主教团联合校勘礼仪典籍，大幅缓和教派撕裂并促进文教交流，但仍难免保守教士抵触。"
 STATIC_MODIFIER_NAME_oe_rem_raskol_old_believer_frontier: "旧礼仪派边疆自治与拓殖"
 STATIC_MODIFIER_DESC_oe_rem_raskol_old_believer_frontier: "默许旧礼仪派商民在乌拉尔、伏尔加与西伯利亚兴办工场与垦殖村镇，换取边疆繁荣，却削弱中央教权与正教一统。"
 STATIC_MODIFIER_NAME_oe_rem_petrine_westernization: "彼得式全罗斯西化大改制"
 STATIC_MODIFIER_DESC_oe_rem_petrine_westernization: "全面改组新编常备军、重金延聘西欧造船与炮术大师并推行近代官僚礼仪，军事纪律与科研思潮突飞猛进，但教士与旧贵族怨声载道、军费暴涨。"
 STATIC_MODIFIER_NAME_oe_rem_moderate_modernization: "渐进西学与新式炮兵团"
 STATIC_MODIFIER_DESC_oe_rem_moderate_modernization: "审慎吸收西欧炮术与造船工艺而不骤废旧俗，朝野阻力较轻，但改制收益与财政效率亦相对平缓。"
 STATIC_MODIFIER_NAME_oe_rem_streltsy_crushed: "铁腕荡平射击军兵变"
 STATIC_MODIFIER_DESC_oe_rem_streltsy_crushed: "以新编近卫团彻底解散作乱的旧射击军并严惩幕后旧勋贵，皇权与新军威严空前稳固，但流血清洗令兵源与地方元气受损。"
 STATIC_MODIFIER_NAME_oe_rem_streltsy_compromise: "射击军妥协：暂缓激进西化"
 STATIC_MODIFIER_DESC_oe_rem_streltsy_compromise: "为平息莫斯科兵变而恢复旧军团与贵族教士特权，国内暂归安宁，但西化改制大幅回撤、纪律与科研陷入停滞。"
 STATIC_MODIFIER_NAME_oe_rem_neva_baltic_window: "涅瓦河口：面向欧洲之窗"
 STATIC_MODIFIER_DESC_oe_rem_neva_baltic_window: "在涅瓦河沼泽筑起不冻商港与波罗的海舰队船坞，欧陆商流与海权存在大增，但高额海军维护与北欧列强敌意如影随形。"
 STATIC_MODIFIER_NAME_oe_rem_baltic_admiralty_push: "北方帝国海军部造舰纲领"
 STATIC_MODIFIER_DESC_oe_rem_baltic_admiralty_push: "集中林木、帆布与铜铁兴建北方常备舰队，海军士气与造船提速，但常年维持费与船厂拨款挤压财政。"
 STATIC_MODIFIER_NAME_oe_rem_bosphorus_accord_mod: "博斯普鲁斯双鹰海峡自由通航"
 STATIC_MODIFIER_DESC_oe_rem_bosphorus_accord_mod: "与存续新罗马缔结海峡免税通航协约，黑海—地中海商船畅通无阻，代价是俄罗斯在礼仪上承诺不再染指克里米亚与海峡主权。"
 STATIC_MODIFIER_NAME_oe_rem_black_sea_rupture_mod: "南方帝国宣言：黑海暖水港争霸"
 STATIC_MODIFIER_DESC_oe_rem_black_sea_rupture_mod: "公然向存续新罗马挑战黑海暖水港霸权，全军海军士气、攻城意志与威望高涨，却招致海军开销飙升与全面外交敌意。"
 STATIC_MODIFIER_NAME_oe_rem_southern_liberation_mod: "黑海正教南疆光复纲领"
 STATIC_MODIFIER_DESC_oe_rem_southern_liberation_mod: "高举解放黑海正教南疆与夺取塔纳—卡法暖水港旗帜，陆海士气与攻坚战力俱增，但连年南征加重军费与厌战。"
 STATIC_MODIFIER_NAME_oe_rem_pacific_yasak_push: "鄂霍次克与堪察加毛皮拓殖"
 STATIC_MODIFIER_DESC_oe_rem_pacific_yasak_push: "沿着勒拿河翻越分水岭直抵鄂霍次克海岸（奥卡姆）与堪察加，毛皮贡赋与远征能力大增，但万里补给线稀释了中央控制与税效。"
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_yuan_trade: "恰克图蒙俄万里茶皮互市"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_yuan_trade: "与中兴大元平起平坐签定划界通商大约，西伯利亚黑貂皮换取江南砖茶与大都丝绸，商贸与外交齐盛，边疆防务与控制略承压力。"
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_eastern_trade: "恰克图远东茶马商埠"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_eastern_trade: "以恰克图口岸统筹贝加尔湖以南的远东商队，商税与商队容量增长，代价是边陲转运管理损耗。"
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_yuan_partner: "恰克图北疆互市安边"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_yuan_partner: "与全罗斯帝国划定漠北疆界并开启恰克图茶皮互市，北疆防务巩固、商税增加，但边市稽查略耗内阁人力。"
 STATIC_MODIFIER_NAME_oe_rem_russian_american_co: "俄美太平洋毛皮特许公司"
 STATIC_MODIFIER_DESC_oe_rem_russian_american_co: "组建皇家特许公司跨越白令岛与阿留申经略北太平洋毛皮商网，远洋贸易与开拓能力空前，但跨洋护航与补贴耗资不菲。"
 STATIC_MODIFIER_NAME_oe_rem_eurasian_consolidation: "欧亚北疆固本收官"
 STATIC_MODIFIER_DESC_oe_rem_eurasian_consolidation: "节制跨洋远征开销、将人力与白银收归欧亚本土税政与边防集权，内政稳固但放缓了太平洋外海拓展。"
 STATIC_MODIFIER_NAME_oe_rem_table_of_ranks_mod: "十四等官秩表"
 STATIC_MODIFIER_DESC_oe_rem_table_of_ranks_mod: "以军功与才干取代门第出身选拔文武官员，内阁效率、军队纪律与识字率跃升，但触怒世袭波雅尔并引起短期磨合。"
 STATIC_MODIFIER_NAME_oe_rem_holy_synod_mod: "全罗斯神圣宗教院"
 STATIC_MODIFIER_DESC_oe_rem_holy_synod_mod: "以直属君主的宗教院取代独立牧首制，王权、教产税入与世俗科研提升，但正教教士深感教权受辱。"
 STATIC_MODIFIER_NAME_oe_rem_pacific_charter_mod: "太平洋毛皮与海豹特许社"
 STATIC_MODIFIER_DESC_oe_rem_pacific_charter_mod: "特许远东船队往来鄂霍次克、堪察加与白令海收运海獭黑貂皮，商程与商力俱增，但极北护航维护高昂。"
 STATIC_MODIFIER_NAME_oe_rem_neva_admiralty_loc: "涅瓦河口帝国海军部与新港"
 STATIC_MODIFIER_DESC_oe_rem_neva_admiralty_loc: "设于涅瓦河口的船坞、要塞与免税商埠，成为帝国面向波罗的海与西欧的海上门户。"
 STATIC_MODIFIER_NAME_oe_rem_black_sea_fleet_loc: "黑海暖水军港与船坞"
 STATIC_MODIFIER_DESC_oe_rem_black_sea_fleet_loc: "拱卫黑海北岸的近代船坞与海防炮台，大幅加速南方舰队建造与水手补充。"
 STATIC_MODIFIER_NAME_oe_rem_kyakhta_emporium_loc: "恰克图万里茶皮互市口岸"
 STATIC_MODIFIER_DESC_oe_rem_kyakhta_emporium_loc: "扼守贝加尔南麓的指定互市商镇，毛皮、砖茶与大黄在此昼夜集散。"
 STATIC_MODIFIER_NAME_oe_rem_pacific_port_loc: "鄂霍次克—堪察加北太平洋港"
 STATIC_MODIFIER_DESC_oe_rem_pacific_port_loc: "矗立在北太平洋寒雾中的造船哨所与毛皮货栈，为跨越白令海提供补给支点。"
 oe_rem_dec_table_of_ranks.title: "颁布《十四等官秩表》"
 oe_rem_dec_table_of_ranks.desc: "效法近代欧洲官僚体系，以十四级军政官秩取代世袭门第次序，选拔才干之士充任内阁与新军军官，但必将触怒旧波雅尔世家。"
 oe_rem_dec_table_of_ranks.a: "颁行十四等官秩表，以功授爵"
 oe_rem_dec_holy_synod.title: "设立全罗斯神圣宗教院"
 oe_rem_dec_holy_synod.desc: "以直属君主的神圣宗教院接掌全罗斯教会政务与教产，强化王权与世俗学风，但正教教士阶层必生强烈抵触。"
 oe_rem_dec_holy_synod.a: "敕立神圣宗教院，教政归冠"
 oe_rem_dec_neva_admiralty.title: "敕建涅瓦海军部与波罗的海舰队"
 oe_rem_dec_neva_admiralty.desc: "在实控的涅瓦河口大兴船坞、炮台与水手营，打造常备波罗的海舰队，打通面向西欧的海上门户。"
 oe_rem_dec_neva_admiralty.a: "拨银营建涅瓦海军部"
 oe_rem_dec_pacific_charter.title: "特许俄美太平洋毛皮商社"
 oe_rem_dec_pacific_charter.desc: "拨款资助西伯利亚与远东船队往来鄂霍次克、堪察加及白令岛收运海獭与黑貂皮，拓展北太平洋商网。"
 oe_rem_dec_pacific_charter.a: "颁授十五年期太平洋毛皮特许状"
 oe_rem.1.t: "1613全罗斯大定局：后动乱时代的国本"
 oe_rem.1.d: "十六世纪末的动乱阴云渐散，广袤的罗斯大地亟待一部为十七世纪定调的根本大计。莫斯科克里姆林的缙绅代表、诺夫哥罗德与波罗的海沿岸的商团行会，以及基辅与斯摩棱斯克的诸公与哥萨克使节纷纷云集，各自陈说治国蓝图。\n\n承接此前百余年的立国路径，朝廷须正式确立近世罗斯的宪制基座：是推戴新王朝以沙皇专制一统山河，还是颁行北方大商会宪章，抑或缔结东斯拉夫三国联邦大协约？"
 oe_rem.1.a: "莫斯科缙绅会议推戴新王朝，确立全罗斯沙皇专制定局"
 oe_rem.1.a.tt: "花费#R 100金币#!，正统性#G +12#!（若已完成罗斯二期主线则额外稳定度#G +4#!），获得[ShowModifier('oe_rem_romanov_autocracy')]，持续#Y 30年#!。"
 oe_rem.1.b: "颁行诺夫哥罗德波罗的海大商会宪章，确立自由商贸共和"
 oe_rem.1.b.tt: "花费#R 100金币#!，威望#G +10#!（若已完成罗斯二期主线则额外稳定度#G +4#!），获得[ShowModifier('oe_rem_novgorod_mercantile_charter')]，持续#Y 30年#!。"
 oe_rem.1.c: "缔结基辅—鲁塞尼亚三国联邦大协约，以合议与哥萨克共治"
 oe_rem.1.c.tt: "花费#R 100金币#!，稳定度#G +5#!（若已完成罗斯二期主线则额外稳定度#G +4#!），获得[ShowModifier('oe_rem_kyiv_federal_compact')]，持续#Y 30年#!。"
 oe_rem.2.t: "《1649会议法典》：农奴枷锁抑或自由垦殖"
 oe_rem.2.d: "连年盐税风潮与边疆战事之后，全境法典编纂委员会呈上煌煌《会议法典》（索博尔诺耶·乌洛热尼耶）。中小服役贵族联名上书，要求彻底取消逃农追索年限，将领地农人永久束缚为世袭农奴，以保障军役供给；而北方商镇与东疆垦殖官吏则警告，严酷农奴制将窒息市镇工匠与西伯利亚拓荒活水。"
 oe_rem.2.a: "严行全境农奴制，以世袭领地换取服役贵族忠诚与雄厚兵源"
 oe_rem.2.a.tt: "稳定度#R −3#!，贵族满意上升、农民满意大跌，获得[ShowModifier('oe_rem_sobornoe_serfdom')]，持续#Y 35年#!（兵源与贵族提升，但滞后思潮并压低农民满意）。"
 oe_rem.2.b: "限制领主私役、保留自由垦殖农与市民迁徙活水"
 oe_rem.2.b.tt: "花费#R 120金币#!，贵族满意下跌、农民满意小升，获得[ShowModifier('oe_rem_free_homesteaders')]，持续#Y 35年#!（税效与繁荣提升，但激怒世袭贵族）。"
 oe_rem.3.t: "尼康牧首礼仪校正与旧礼仪派大分裂"
 oe_rem.3.d: "全罗斯牧首尼康下令以希腊古本为准，统一修订沿用百年的罗斯礼仪经卷——改双指划十字为三指，重校弥撒仪轨。此举犹如火星落入干柴：阿瓦库姆大司祭率领无数旧礼仪派信众誓死抗命，伏尔加林区与白海修院风潮四起。\n\n在中央正教权威与边疆民生拓殖之间，朝廷必须立断；若君士坦丁堡的紫色双鹰仍屹立共融，希腊古本学者亦可北上斡旋。"
 oe_rem.3.a: "力挺尼康牧首铁腕统一礼仪，确立中央教权与普世正教正统"
 oe_rem.3.a.tt: "稳定度#R −4#!，宗教影响#G +15#!，传统派张力#R +30#!，获得[ShowModifier('oe_rem_raskol_nikon_unity')]，持续#Y 30年#!（中央教权大增，但边疆繁荣与教士满意受损）。"
 oe_rem.3.b: "默许旧礼仪派于伏尔加与西伯利亚边疆自治垦殖，以安民生"
 oe_rem.3.b.tt: "宗教影响#R −15#!，传统派张力#R +10#!，获得[ShowModifier('oe_rem_raskol_old_believer_frontier')]，持续#Y 30年#!（边疆繁荣与开拓提速，但削弱中央教权）。"
 oe_rem.3.c: "延请君士坦丁堡希腊学者共勘经卷，借双鹰公会议缓和分裂"
 oe_rem.3.c.tt: "花费#R 120金币#!，宗教影响#G +10#!，传统派张力仅#R +15#!，改善与新罗马关系，获得[ShowModifier('oe_rem_raskol_greek_mediation')]，持续#Y 30年#!。"
 oe_rem.4.t: "欧洲大使团与彼得式全罗斯西化大改制"
 oe_rem.4.d: "进入绝对主义时代，西欧的线列火枪团、深水战列舰、官营铸炮厂与科学院已将旧式骑士与火铳射击军远远甩在身后。满载荷兰造船匠、德意志炮术官与近代数理典籍的欧洲大使团归国，一场自上而下重塑全罗斯的雷霆变法摆在案头。\n\n全面西化需付出巨额国库开销，并直面教士与旧波雅尔的激烈反扑——甚至可能引爆射击军兵变；若行稳妥渐进改良，则可暂缓内耗，却难以彻底脱胎换骨。"
 oe_rem.4.a: "雷厉风行全面西化！改组新编常备军、重聘西欧匠师并颁行新礼"
 oe_rem.4.a.tt: "花费#R 350金币#!，稳定度#R −6#!，教士与贵族满意大跌，传统派张力#R +45#!（恐引爆射击军兵变！），置#bold #color_yellow 彼得西化成功旗标#!#!，获得[ShowModifier('oe_rem_petrine_westernization')]，持续#Y 35年#!。"
 oe_rem.4.b: "渐进吸纳西欧火炮与造船技师，暂保旧俗与贵族体面"
 oe_rem.4.b.tt: "花费#R 180金币#!，稳定度#R −2#!，传统派张力#R +15#!，获得[ShowModifier('oe_rem_moderate_modernization')]，持续#Y 30年#!（不触发全面西化旗标）。"
 oe_rem.5.t: "红场烽火：射击军与旧贵族反西化兵变"
 oe_rem.5.d: "疾风骤雨般的西化令、剃须税与教权收紧终于点燃了旧势力的怒火！驻守莫斯科的世袭火铳射击军团联合失意波雅尔与守旧修士，挥舞圣像与旧战旗围逼克里姆林宫，高呼“恢复古罗斯旧法、驱逐洋人技师”。\n\n这是帝国西化生死存亡的关头：调遣新编近卫军铁腕血洗兵变，以流血代价彻底荡平旧军团；还是向传统派低头妥协、回撤激进改制？"
 oe_rem.5.a: "调遣新编近卫团铁腕荡平射击军！彻底解散旧军团以绝后患"
 oe_rem.5.a.tt: "花费#R 200金币#!，稳定度#R −6#!，人力#R −3#!，清零反扑势头并保住#bold #color_yellow 彼得西化旗标#!#!，获得[ShowModifier('oe_rem_streltsy_crushed')]，持续#Y 20年#!。"
 oe_rem.5.b: "向射击军与旧贵族让步妥协，暂缓激进西化以息内乱"
 oe_rem.5.b.tt: "稳定度#G +6#!，贵族与教士满意回升，但撤销[ShowModifier('oe_rem_petrine_westernization')]与全面西化旗标，承受[ShowModifier('oe_rem_streltsy_compromise')]，持续#Y 25年#!。"
 oe_rem.6.t: "涅瓦河口：面向欧洲的波罗的海新窗"
 oe_rem.6.d: "波罗的海冰冷的潮水拍打着涅瓦河口、奥列舍克、纳尔瓦与里加的岸堤。从前罗斯唯有白海阿尔汉格尔斯克的半年冰封航道，而今北方波罗的海门户洞开，西方商船与战舰已触手可及！\n\n在涅瓦沼泽上打下木桩、兴建不冻军港与帝国海军部将耗尽巨额白银与壮丁，并立即引发瑞典与波立列强的强烈敌意；若已实控涅瓦河口，君主更可决意将帝国新都迁至海滨！"
 oe_rem.6.a: "敕建波罗的海帝国海军部与新商港，正式推开面向欧洲之窗"
 oe_rem.6.a.tt: "花费#R 300金币#!，人力#R −2#!，海军传统#G +10#!，升级涅瓦/波罗的海港口并引发瑞典与波立敌意（好感#R −40#!），获得[ShowModifier('oe_rem_neva_baltic_window')]，持续#Y 35年#!。"
 oe_rem.6.b: "迁都涅瓦河口！在波罗的海畔筑起宏伟的北方帝国新都"
 oe_rem.6.b.tt: "迁都至#bold #color_yellow 涅瓦#!#!，花费#R 350金币#!，稳定度#R −5#!，人力#R −3#!，威望#G +20#!，建[ShowModifier('oe_rem_neva_admiralty_loc')]并获[ShowModifier('oe_rem_neva_baltic_window')]，持续#Y 40年#!。"
 oe_rem.6.c: "稳守阿尔汉格尔斯克与既有商埠，审慎扩建北方舰队"
 oe_rem.6.c.tt: "花费#R 120金币#!，海军传统#G +8#!，获得[ShowModifier('oe_rem_baltic_admiralty_push')]，持续#Y 25年#!。"
 oe_rem.7.t: "黑海暖水港之问：双鹰协约抑或南下争霸"
 oe_rem.7.d: "顿河口的塔纳、克里米亚的卡法与遥远南方的博斯普鲁斯海峡，始终是全罗斯通往暖水大洋的梦想所在。然而南方黑海的局势非同寻常：若紫色的新罗马帝国依然屹立于君士坦丁堡与黑海沿岸，强夺暖水港将令昔日同宗的双头鹰彻底反目决裂；反之，亦可顺承双鹰共治传统缔结海峡自由通航协定。\n\n若新罗马业已倾覆，则南下光复黑海正教故土、建起南方暖水军港便成了帝国责无旁贷的使命。"
 oe_rem.7.a: "坚决南下夺取黑海暖水港（若新罗马仍控海峡则彻底决裂争霸！）"
 oe_rem.7.a.tt: "若#bold #color_yellow 新罗马#!#!仍控黑海/海峡：花费#R 250金币#!，双边好感#R −80#!彻底决裂，获[ShowModifier('oe_rem_black_sea_rupture_mod')]；否则走黑海正教南疆光复线，花费#R 220金币#!，获[ShowModifier('oe_rem_southern_liberation_mod')]，均持续#Y 35年#!。"
 oe_rem.7.b: "与存续新罗马缔结《博斯普鲁斯双鹰海峡自由通航协定》"
 oe_rem.7.b.tt: "花费#R 150金币#!，威望#R −10#!，与新罗马互增好感#G +55#!（若承接双鹰共治额外稳定度#G +5#!），双方共获[ShowModifier('oe_rem_bosphorus_accord_mod')]，持续#Y 35年#!。"
 oe_rem.7.c: "依托阿斯特拉罕与伏尔加—里海内河商网，暂缓黑海正面摊牌"
 oe_rem.7.c.tt: "花费#R 100金币#!，稳定度#G +4#!，加固南方船坞，获得[ShowModifier('oe_rem_baltic_admiralty_push')]，持续#Y 20年#!。"
 oe_rem.8.t: "越过勒拿河：鄂霍次克海岸与堪察加探险"
 oe_rem.8.d: "自托博尔斯克、托木斯克直至贝加尔湖畔的伊尔库茨克，哥萨克探险队与毛皮猎手沿着冰雪封冻的大河一路向东。捷报终于传回都城：先遣舟师已翻越勒拿河东岸山岭，望见鄂霍次克海岸（奥卡姆）与烟雾缭绕的堪察加火山！\n\n这是罗斯帝国成为横跨欧亚大陆至太平洋大国的壮丽时刻，但也意味着绵延万里的补给线与边疆治理重压。"
 oe_rem.8.a: "设立毛皮贡赋与北太平洋探险队，在奥卡姆与堪察加筑港！"
 oe_rem.8.a.tt: "花费#R 200金币#!（承接二期西伯利亚东进额外威望#G +8#!），于远东港口建[ShowModifier('oe_rem_pacific_port_loc')]，获得[ShowModifier('oe_rem_pacific_yasak_push')]，持续#Y 35年#!。"
 oe_rem.8.b: "稳固托博尔斯克至伊尔库茨克沿线官道，暂缓极东冰原冒进"
 oe_rem.8.b.tt: "花费#R 120金币#!，稳定度#G +4#!，获得[ShowModifier('oe_rem_kyakhta_eastern_trade')]，持续#Y 25年#!。"
 oe_rem.9.t: "恰克图边约：与东方帝国的万里划界"
 oe_rem.9.d: "在贝加尔湖以南的恰克图草原，俄罗斯远东使团与东方大帝国的边臣隔案相坐。若大都宝座之上依然端坐着中兴的大元可汗，这便是一场跨越三百年的历史奇景——昔日挣脱钦察枷锁的罗斯诸公，如今以全罗斯帝国之尊与成吉思汗直系后裔平起平坐、划界互市！\n\n不论东方邻国是中兴大元、大明抑或满洲王朝，恰克图的茶马与黑貂皮商道都将重塑欧亚内陆格局。"
 oe_rem.9.a: "开辟恰克图远东茶皮互市口岸，与东方邻国定界通商"
 oe_rem.9.a.tt: "花费#R 140金币#!，与东方邻国改善关系（好感#G +35#!），建[ShowModifier('oe_rem_kyakhta_emporium_loc')]，获得[ShowModifier('oe_rem_kyakhta_eastern_trade')]，持续#Y 35年#!。"
 oe_rem.9.b: "与中兴大元缔结《恰克图蒙俄划界互市大约》：双帝平起平坐！"
 oe_rem.9.b.tt: "花费#R 150金币#!，威望#G +10#!，与大元互增好感#G +45#!并助其北疆安边与宝钞信用回流，建[ShowModifier('oe_rem_kyakhta_emporium_loc')]，获得[ShowModifier('oe_rem_kyakhta_yuan_trade')]，持续#Y 35年#!。"
 oe_rem.9.c: "增派贝加尔与伊尔库茨克哥萨克边防军，绝不轻言退让"
 oe_rem.9.c.tt: "花费#R 120金币#!，陆军传统#G +10#!，获得[ShowModifier('oe_rem_eurasian_consolidation')]，持续#Y 25年#!。"
 oe_rem.10.t: "白令海峡与俄美毛皮公司：北太平洋终章"
 oe_rem.10.d: "丹麦航海家白令率领帝国勘探船队驶离堪察加，穿越迷雾重重的白令岛与阿留申群岛，证实了欧亚大陆与美洲新世界之间仅隔一道狭长海峡！海獭与海豹毛皮的惊人厚利吸引着西伯利亚大商号联合请愿，恳请朝廷敕立皇家特许的“俄美毛皮公司”跨海经营阿拉斯加。\n\n这是俄罗斯帝国近世史诗的辉煌收官：是扬帆跨越太平洋开拓俄属北美，还是将财力收归欧亚本土、固本待变？"
 oe_rem.10.a: "敕立皇家俄美毛皮特许公司，跨越白令岛经略北太平洋与阿拉斯加！"
 oe_rem.10.a.tt: "完成俄罗斯帝国近世主线，花费#R 250金币#!，威望#G +15#!，升级北太平洋港口，获得[ShowModifier('oe_rem_russian_american_co')]，持续#Y 40年#!。"
 oe_rem.10.b: "止步堪察加，将巨额海运补贴转投欧亚本土税政与边疆集权"
 oe_rem.10.b.tt: "完成俄罗斯帝国近世主线，花费#R 100金币#!，稳定度#G +6#!，获得[ShowModifier('oe_rem_eurasian_consolidation')]，持续#Y 40年#!。"
 oe_rem.20.t: "俄罗斯帝国近世线：选项生效"
