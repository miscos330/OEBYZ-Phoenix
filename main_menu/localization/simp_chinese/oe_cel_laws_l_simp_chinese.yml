# NEW 2026-11-22 v11.2 Worker 2 (oe_cel_). Generated by gen_v112_celestial_laws.py; edit the generator, not this file.
 oe_cel_enfeoffment_law: "分封宗藩"
 oe_cel_enfeoffment_law_desc: "天子如何对待宗室与功臣的封国：让他们世代守边、出镇四海，还是推恩分封、逐步削弱。"
 oe_cel_pol_enf_touxia_feudal: "宗藩世袭守边"
 oe_cel_pol_enf_touxia_feudal_desc: "宗藩世代镇守边地，忠于朝廷。"
 oe_cel_pol_enf_overseas_princes: "四海宗王分封"
 oe_cel_pol_enf_overseas_princes_desc: "派宗室亲王出镇远洋与异域，开拓天朝的边界。"
 oe_cel_pol_enf_tui_en_centralize: "推恩削藩集权"
 oe_cel_pol_enf_tui_en_centralize_desc: "推恩令把封国分给诸子，藩国日小，朝廷日强，但宗藩心生不满。"
 oe_cel_jimi_duhu_law: "羁縻与都护"
 oe_cel_jimi_duhu_law_desc: "天子如何统御边远之地：因俗羁縻、开设四海都护府，还是设理藩机构、华夷一体。"
 oe_cel_pol_jimi_classic_tusi: "因俗羁縻"
 oe_cel_pol_jimi_classic_tusi_desc: "以夷治夷，地方首领世袭其职，只需纳贡称臣。"
 oe_cel_pol_jimi_sihai_duhu: "四海开府"
 oe_cel_pol_jimi_sihai_duhu_desc: "在远洋与异域开设大都护府，开府代价降低。"
 oe_cel_pol_jimi_lifan_huayi: "理藩华夷一体"
 oe_cel_pol_jimi_lifan_huayi_desc: "设机构专管边疆诸部，不分华夷，同为天子之民。"
 oe_cel_gaituguiliu_law: "改土归流烈度"
 oe_cel_gaituguiliu_law_desc: "把土司与宣慰司改为朝廷直辖的快慢：怀柔缓进、分期推行，还是雷霆郡县。"
 oe_cel_pol_gtgl_gradual_charter: "怀柔缓流"
 oe_cel_pol_gtgl_gradual_charter_desc: "改流慢而稳，少有反抗。"
 oe_cel_pol_gtgl_provincial_wave: "分期改流"
 oe_cel_pol_gtgl_provincial_wave_desc: "按省分期改流，快慢适中。"
 oe_cel_pol_gtgl_iron_commandery: "雷霆郡县"
 oe_cel_pol_gtgl_iron_commandery_desc: "一举设立郡县，速度最快，但土司反抗更多。"
 oe_cel_tianxia_ocean_law: "天下海陆"
 oe_cel_tianxia_ocean_law_desc: "天子面向海洋的方略：市舶勘合朝贡、宝船四海通商，还是陆海并举经略欧亚。"
 oe_cel_pol_ocean_tribute_gate: "市舶勘合"
 oe_cel_pol_ocean_tribute_gate_desc: "只许持勘合的贡船入港，天朝体面得以维持。"
 oe_cel_pol_ocean_treasure_hegemony: "宝船通商"
 oe_cel_pol_ocean_treasure_hegemony_desc: "宝船远航四海，通商万国。"
 oe_cel_pol_ocean_continental_pivot: "陆海并举"
 oe_cel_pol_ocean_continental_pivot_desc: "陆军与水师并重，经略欧亚大陆与海疆。"
 oe_cel_cab_gaituguiliu_commission: "改土归流钦差督办"
 oe_cel_cab_gaituguiliu_commission_desc: "钦差督办新附省份的改流善后：编户齐民、设学兴教，加快同化。"
