 oe_cel_dec_yuan_kurultai.title: "大元：重开大忽里台定宗王序"
 oe_cel_dec_yuan_kurultai.desc: "召集黄金家族诸王重开大忽里台，重定宗王的位次与份地。宗王们会更忠诚，削藩的怨气也会缓和。"
 oe_cel_dec_yuan_kurultai.a: "开大忽里台"
 oe_cel_dec_ming_zongren_fu.title: "大明：设宗人府定藩禄"
 oe_cel_dec_ming_zongren_fu.desc: "设宗人府管理宗室名册与藩禄。藩国的贡赋更有保障，藩王的兵权受到约束。"
 oe_cel_dec_ming_zongren_fu.a: "设宗人府"
 oe_cel_dec_qing_mengqi.title: "大清：编设盟旗扎萨克"
 oe_cel_dec_qing_mengqi.desc: "把归附的蒙古诸部编为盟旗，由扎萨克世袭管理、定期会盟。各旗地界分明，难以联合作乱。"
 oe_cel_dec_qing_mengqi.a: "编设盟旗"
 oe_cel_dec_alt_mandate.title: "承天受命定鼎"
 oe_cel_dec_alt_mandate.desc: "我们并非中原旧主，却执掌了天命。是全盘接受天朝的礼乐制度，还是保留本国法统、以双元共主之名统治？"
 oe_cel_dec_alt_mandate.a: "全盘华化，建立新朝"
 oe_cel_dec_alt_mandate.b: "保留本国法统，双元共主"
 oe_cel_adv_sihai_duhu: "四海都护开府术"
 oe_cel_adv_sihai_duhu_desc: "掌握在远洋异域开设大都护府的方法，可以用殖民宪章开设四海大都护府。"
 oe_cel_adv_tusi_registry: "改流户籍丈量"
 oe_cel_adv_tusi_registry_desc: "在改流地区清丈田亩、编造户籍，让直辖更快站稳。"
 oe_cel_adv_kunyu_wanguo: "坤舆万国全图"
 oe_cel_adv_kunyu_wanguo_desc: "以 1602 年的《坤舆万国全图》为本，天朝第一次在一张图上看清了整个世界。"
 STATIC_MODIFIER_NAME_oe_cel_duhu_supplied_mod: "都护钱粮充足"
 STATIC_MODIFIER_DESC_oe_cel_duhu_supplied_mod: "朝廷调拨的钱粮与船只稳住了都护府的军心。"
 STATIC_MODIFIER_NAME_oe_cel_lifan_assembly_mod: "会盟受赏"
 STATIC_MODIFIER_DESC_oe_cel_lifan_assembly_mod: "在会盟中受到天子赏赐，暂时安分。"
 STATIC_MODIFIER_NAME_oe_cel_kurultai_accord_mod: "大忽里台之约"
 STATIC_MODIFIER_DESC_oe_cel_kurultai_accord_mod: "大忽里台重定了宗王位次，宗王们暂时心服。"
 STATIC_MODIFIER_NAME_oe_cel_zongren_fu_mod: "宗人府"
 STATIC_MODIFIER_DESC_oe_cel_zongren_fu_mod: "宗人府掌管宗室名册与藩禄，藩国更受约束。"
 STATIC_MODIFIER_NAME_oe_cel_mengqi_banner_mod: "盟旗扎萨克"
 STATIC_MODIFIER_DESC_oe_cel_mengqi_banner_mod: "编为盟旗，地界分明，难以联合作乱。"
 STATIC_MODIFIER_NAME_oe_cel_full_sinicization_mod: "全盘华化"
 STATIC_MODIFIER_DESC_oe_cel_full_sinicization_mod: "新朝全盘接受天朝的礼乐制度。"
 STATIC_MODIFIER_NAME_oe_cel_dual_sovereign_mod: "双元共主"
 STATIC_MODIFIER_DESC_oe_cel_dual_sovereign_mod: "天子保留本国法统，以双元共主之名统治。"
