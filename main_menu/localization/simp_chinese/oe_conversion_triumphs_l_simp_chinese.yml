 oe_hegemony_triumphs.5.t: "西海岸的鹰旗"
 oe_hegemony_triumphs.5.d: "凯旋的号角为越过伊比利亚群山的将士而鸣。军旗前列行进着步卒与骑兵，他们曾在干涸河床中寻找水源，在石砌堡垒前守候黎明，又把辎重拖上陡峭的山路。归航船只带回的是疲惫而骄傲的人们；都城的欢呼则将这些分散的苦战，汇成帝国共同记忆中的一场胜利。\n\n帝国的眼界由此伸向西方大海，港湾与商路将连接此前遥远的边地。当地诸族与诸教也将带着自己的律法、土地和承诺来到御座面前。凯旋可以宣告征服，却不能代替治理；新驻军、地方官与商旅须共同守住这条通往西海岸的道路。"
 oe_hegemony_triumphs.5.a: "让帝国铭记他们的功勋。"
