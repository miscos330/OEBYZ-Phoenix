 oe_heg_triumph_britain_effect: "触发英格兰凯旋事件。事件开启时，东罗马及其各级附属国在西南英格兰、伦敦周边、东盎格利亚、麦西亚、威尔士与诺森布里亚六个地区每拥有一个可征服地点，获得陆军改革分数#G +1#!、帝国权威#G +0.1#!；固定获得稳定度#G +10#!、正统性#G +10#!、民意#G +5#!。仅统计所有权，不计纯军事占领或独立盟友，地点不重复计数。每地区仅能举办一次。"
 oe_heg_triumph_britain_done: "已举办：英格兰凯旋式"
 oe_hegemony_triumphs.6.t: "雨雾彼岸的凯旋"
 oe_hegemony_triumphs.6.d: "从海峡彼岸归来的将士走进金门，盾牌上还留着北方雨雾侵蚀的斑痕。他们在陌生潮汐中登岸，沿着残存的古道推进，在泥泞的田野与坚固城墙之间争夺立足之地。那些曾由古代军团行走的道路，如今又迎来了帝国的军旗；都城为他们欢呼，也为渡海未归的同袍肃立。\n\n英格兰的港湾与田畴将使御座的命令越过西方海峡，新的航程也意味着漫长补给线与更难维系的地方忠诚。过去的石墙不能替今日的官吏守城，古老的名号也不能替军队征粮。凯旋是重返不列颠的见证，而此后能否扎下根来，将由帝国与当地人的共同生活决定。"
 oe_hegemony_triumphs.6.a: "让帝国铭记他们的功勋。"
