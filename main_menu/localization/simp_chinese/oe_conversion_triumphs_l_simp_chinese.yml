 oe_hegemony_triumphs.4.t: "越过群山的凯旋"
 oe_hegemony_triumphs.4.d: "来自高卢的军旗带着雨水与烟火的痕迹，被高举着送入都城。士兵曾翻越狭窄山口，在河流两岸争夺桥梁，在陌生语言的城镇外熬过漫长围城；他们的盾牌、马鞍与行囊，都记下了比战报更沉重的路程。御前的书记官宣读将士姓名，欢呼沿着街道传开，远方的战场终于有了都城能够听见的回声。\n\n高卢的河谷、农田与商路，将使帝国直接面对西方诸国的旧有秩序。贵族的契约、城市的自由与地方的习惯，不能只用一纸诏令抹去。今日军团证明了自己的勇气，明日御座则须证明罗马的法度足以容纳这些新归服的土地。"
 oe_hegemony_triumphs.4.a: "让帝国铭记他们的功勋。"
