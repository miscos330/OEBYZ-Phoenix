 oe_heg_triumph_africa: "举办凯旋式"
 oe_heg_triumph_africa_desc: "为征战北非的将士举行凯旋。御座将宣读功勋与阵亡者姓名，让都城记住军旗背后的艰辛，也让远方的新领土听见帝国对胜利的承诺。每地区仅能举办一次。"
 oe_heg_triumph_africa_effect: "触发北非凯旋事件。事件开启时，东罗马及其各级附属国在马格里布大区每拥有一个可征服地点，获得陆军改革分数#G +1#!、帝国权威#G +0.1#!；固定获得稳定度#G +10#!、正统性#G +10#!、民意#G +5#!。仅统计所有权，不计纯军事占领或独立盟友，地点不重复计数。每地区仅能举办一次。"
 oe_heg_triumph_africa_done: "已举办：北非凯旋式"
 oe_hegemony_triumphs.1.t: "沙海归来的鹰旗"
 oe_hegemony_triumphs.1.d: "披着尘沙的军旗穿过金门，鼓声从城墙一路传到竞技场。士兵的甲胄上仍留着海风侵蚀的痕迹，老兵向人群举起破损的盾牌；有人在异乡守住了井口，有人在炽热的山道中护送粮队，也有人再未登上归航的船。皇帝命书记官当众宣读阵亡者与有功将士的姓名，让欢呼为凯旋者响起，也为未能归来的人留下位置。\n\n北非的港湾与商路重新进入帝国的筹划，西地中海的航程不再只是敌人的疆界。然而征服之后仍有税籍待清、道路待修、乡镇待安。今日的凯旋将使军中的经验传遍诸营，而鹰旗在远方能否长久飘扬，终须由明日的治理作答。"
 oe_hegemony_triumphs.1.a: "让帝国铭记他们的功勋。"
 oe_heg_triumph_africa_locations: "北非凯旋地点数"
