 oe_heg_triumph_africa_rewarded: "北非凯旋奖励已结算"
 oe_heg_triumph_egypt: "举办凯旋式"
 oe_heg_triumph_egypt_desc: "为征战埃及的将士举行凯旋。御座将宣读功勋与阵亡者姓名，让都城记住军旗背后的艰辛，也让远方的新领土听见帝国对胜利的承诺。每地区仅能举办一次。"
 oe_heg_triumph_egypt_effect: "触发埃及凯旋事件。事件开启时，东罗马及其各级附属国在埃及大区与黎凡特地区每拥有一个可征服地点，获得陆军改革分数#G +1#!、帝国权威#G +0.1#!；固定获得稳定度#G +10#!、正统性#G +10#!、民意#G +5#!。仅统计所有权，不计纯军事占领或独立盟友，地点不重复计数。每地区仅能举办一次。"
 oe_heg_triumph_egypt_done: "已举办：埃及凯旋式"
 oe_hegemony_triumphs.2.t: "尼罗河与圣地的凯旋"
 oe_hegemony_triumphs.2.d: "凯旋队伍带着尼罗河畔的尘土与黎凡特山道上的伤痕进入都城。军团曾在河渠之间架桥，在城墙下顶住箭雨，又让疲惫的粮队穿过漫长而干渴的道路。如今水手、步卒与骑兵并肩经过看台，百姓把花枝抛向他们；皇帝则命人在御前展开远征的地图，将那些由鲜血换来的城镇一一读出。\n\n亚历山大的海路、尼罗河的田畴与通往圣地的道路，将为帝国带来新的粮食、商旅与声望。教会期待朝圣者平安往来，商人盼望船队得以重返，官吏却已开始盘算堤渠、赋税与驻军。凯旋证明罗马能够重返东方，也提醒御座必须让胜利成为长久的秩序。"
 oe_hegemony_triumphs.2.a: "让帝国铭记他们的功勋。"
