 oe_heg_triumph_italy_done: "已举办：意大利凯旋式"
 oe_hegemony_triumphs.3.t: "旧都之路，今日之军"
 oe_hegemony_triumphs.3.d: "意大利远征的军旗在都城上空展开，军乐声盖过了港口的喧闹。老兵记得山口的寒风、城门前的鏖战与漫长海路上的缺粮；如今他们列队经过御座，身后是奉命归来的将领与记载战事的书记官。百姓高呼罗马之名，仿佛那些只在典籍中读到的道路，又一次由帝国的士兵踏过。\n\n重返意大利不仅关乎旧日疆界，也将改变亚得里亚海的航运、城邦的盟约与西方诸侯对御座的看法。昔日分隔东西的海面，正在成为帝国往来的通道。凯旋之日，军团的功勋被写入名册；此后，官吏须用公正的法度与可靠的驻军，让城镇明白罗马归来意味着什么。"
 oe_hegemony_triumphs.3.a: "让帝国铭记他们的功勋。"
