 oe_heg_stabilize_africa: "稳定北非局势"
 oe_heg_stabilize_africa_desc: "远征军夺下的城门，终须交给能够长久守护它们的官吏。御座将从北非附属国中选定一国，承认其行省行政，使税册、驻军与乡镇重新服从有序的治理。"
 oe_heg_stabilize_africa_effect: "选择一个首都位于马格里布大区的直属附属国，开放并添加“$oe_roman_province$”政府改革。保留该国的政府类型、统治者、信仰和附属类型。已经拥有此改革的国家不再列入候选。"
 OE_HEG_CHOOSE_AFRICA_SUBJECT: "选择北非附属国"
 OE_HEG_NO_AFRICA_SUBJECT: "@trigger_no!没有符合条件的直属附属国：首都须位于马格里布大区，且尚未拥有“$oe_roman_province$”政府改革。"
 OE_HEG_TRIUMPH_LAND_REQUIRED: "东罗马或其各级附属国在本次凯旋对应范围内至少拥有一个可征服地点。"
