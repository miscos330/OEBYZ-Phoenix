l_simp_chinese:
 # Generated by tools_20261117/gen_game_rules.py (SYS-1, Decision 309); edit the generator, not this file.
 rule_oe_rule_if_frequency: "凤凰计划：历史与 IF 线节奏"
 setting_oe_rule_if_frequency_historical: "历史推荐"
 setting_oe_rule_if_frequency_historical_desc: "按推荐平衡权重推进史实与架空分支：核心历史脉络清晰连贯，条件成熟时仍可自然展开合理的架空路线。"
 setting_oe_rule_if_frequency_active: "积极 IF"
 setting_oe_rule_if_frequency_active_desc: "提高架空分支与关键转折线的 AI 选用倾向，欧亚主要势力更容易走出非史实演化路径。"
 setting_oe_rule_if_frequency_strict: "严格史实"
 setting_oe_rule_if_frequency_strict_desc: "AI 在关键历史节点大幅倾向史实选项，尽量贴近历史脉络推进局势（玩家自身仍可自由抉择）。"

 rule_oe_rule_glh_fragmentation: "凤凰计划：金帐汗国细分与大解体"
 setting_oe_rule_glh_fragmentation_standard: "标准三阶段"
 setting_oe_rule_glh_fragmentation_standard_desc: "金帐汗国按推荐三阶段节奏演进：先历内争与权臣专政，随后诸兀鲁思离心并逐步瓦解大汗权威。"
 setting_oe_rule_glh_fragmentation_intense: "强裂解"
 setting_oe_rule_glh_fragmentation_intense_desc: "加快草原权威衰减并降低各兀鲁思自立门槛，金帐汗国更早、更彻底地裂解为多个后继汗国。"
 setting_oe_rule_glh_fragmentation_mild: "温和"
 setting_oe_rule_glh_fragmentation_mild_desc: "减缓草原权威流失并提高裂解门槛，金帐汗国得以更长久地维持宗主格局，为东欧与黑海保留更强压力。"

 rule_oe_rule_yuan_ai_assist: "凤凰计划：AI 大元中兴辅助"
 setting_oe_rule_yuan_ai_assist_balanced: "平衡"
 setting_oe_rule_yuan_ai_assist_balanced_desc: "AI 大元按标准机制应对钞法、漕粮与红巾动荡，既可能艰难中兴，也可能在多重危机下北撤。"
 setting_oe_rule_yuan_ai_assist_boosted: "强化大元"
 setting_oe_rule_yuan_ai_assist_boosted_desc: "为 AI 执政的大元提供更稳健的朝政与平乱辅助，显著提升东亚出现中兴大元格局的几率（仅对 AI 生效）。"
 setting_oe_rule_yuan_ai_assist_off: "关闭"
 setting_oe_rule_yuan_ai_assist_off_desc: "关闭针对 AI 大元的额外中兴辅助，令其完全按常规压力承受至正末年动荡。"

 rule_oe_rule_rus_balance: "凤凰计划：罗斯玩家与 AI 平衡"
 setting_oe_rule_rus_balance_standard: "标准可玩"
 setting_oe_rule_rus_balance_standard_desc: "推荐平衡档：兼顾莫斯科、诺夫哥罗德与特维尔等罗斯诸公的开局可玩性与中后期统一张力。"
 setting_oe_rule_rus_balance_challenge: "挑战模式"
 setting_oe_rule_rus_balance_challenge_desc: "强化鞑靼枷锁压力与诸公竞逐阻力，为熟悉罗斯路线的玩家提供更具挑战性的统一体验。"
 setting_oe_rule_rus_balance_vanilla_aggro: "原版偏激进"
 setting_oe_rule_rus_balance_vanilla_aggro_desc: "保留更接近原版的高侵略扩张节奏，罗斯诸公与周边强权将更频繁地爆发直接兼并战争。"

 rule_oe_rule_silk_phoenix: "凤凰计划：丝路双凤跨欧亚联动"
 setting_oe_rule_silk_phoenix_dual_or_solo: "双强+单强兜底"
 setting_oe_rule_silk_phoenix_dual_or_solo_desc: "当拜占庭与大元同时存续中兴时触发完整双凤跨欧亚使节与商约线；若仅一方屹立，亦提供单强远东/远西兜底联动。"
 setting_oe_rule_silk_phoenix_dual_only: "仅双强"
 setting_oe_rule_silk_phoenix_dual_only_desc: "仅在拜占庭与大元同时存续并达成中兴门槛时触发双凤联动事件链，不启用单强兜底。"
 setting_oe_rule_silk_phoenix_off: "关闭"
 setting_oe_rule_silk_phoenix_off_desc: "关闭拜占庭与大元之间的丝路双凤跨欧亚联动事件链，各自按本土主线独立演进。"

 rule_oe_rule_roman_prefectures: "凤凰计划：古典罗马近卫大区体系"
 setting_oe_rule_roman_prefectures_gradual_3: "3 区渐进解锁"
 setting_oe_rule_roman_prefectures_gradual_3_desc: "推荐节奏：随着收复核心战区逐步解锁东方、伊利里亚与意大利等古典近卫大区体制，与扩张进程同步成长。"
 setting_oe_rule_roman_prefectures_endgame_10: "10 区终局解锁"
 setting_oe_rule_roman_prefectures_endgame_10_desc: "将古典近卫大区体系保留为收复十大罗马战区后的终局皇冠体制，强调后期大一统仪式感。"

 rule_oe_rule_byz_theme_econ: "凤凰计划：军区财政深度档位"
 setting_oe_rule_byz_theme_econ_standard: "标准"
 setting_oe_rule_byz_theme_econ_standard_desc: "按推荐平衡比例计算拜占庭军区维持费、赋税配额与补员开销，兼顾深度治理与顺畅扩张。"
 setting_oe_rule_byz_theme_econ_strict: "严苛财政"
 setting_oe_rule_byz_theme_econ_strict_desc: "收紧军区财政盈余并加重多线扩军与超编军区的维持负担，更考验精算内政与量入为出。"

 rule_oe_rule_quick_hud: "凤凰计划：快捷导航栏默认显示"
 setting_oe_rule_quick_hud_on: "开启"
 setting_oe_rule_quick_hud_on_desc: "开局默认显示主角国专属快捷导航条，便于一键直达编年史、帝国柱石、大元仪表盘或罗斯局势（局内仍可随时折叠）。"
 setting_oe_rule_quick_hud_off: "关闭"
 setting_oe_rule_quick_hud_off_desc: "默认隐藏快捷导航条，保持最简洁的原生顶栏画面，仍可通过常规国际组织与局势入口打开所有模组面板。"

 rule_oe_rule_empire_entropy: "凤凰计划：帝国熵增反滚雪球引擎"
 setting_oe_rule_empire_entropy_standard: "标准推荐"
 setting_oe_rule_empire_entropy_standard_desc: "推荐均衡档：对领土达150块以上的拜占庭/罗马（与罗马光复重担及四大近卫大区无缝合流，不叠双罚）、中兴大元、沙俄及200块以上的巨型帝国启用五维透明熵增，并开放全套主动反制决议与盛世永安皇冠奖励。"
 setting_oe_rule_empire_entropy_hardcore: "硬核帝国治理"
 setting_oe_rule_empire_entropy_hardcore_desc: "硬核挑战档：五维熵增月度累积速率提高35%，大幅放大后期超大规模帝国的财政通胀、总督离心与多线战争压力，适合追求史诗级治理挑战的资深玩家。"
 setting_oe_rule_empire_entropy_lite: "轻量（仅罗马光复后）"
 setting_oe_rule_empire_entropy_lite_desc: "休闲轻量档：关闭通用五维帝国熵增引擎，仅保留拜占庭/罗马光复后的原有「罗马的重担」局势，适合偏好轻松扩张与自由涂色的玩家。"

 rule_oe_rule_hegemon_ai: "凤凰计划：12强动态反霸制衡AI"
 setting_oe_rule_hegemon_ai_standard: "标准制衡"
 setting_oe_rule_hegemon_ai_standard_desc: "推荐生态档：当超级霸权崛起时，受威胁的欧亚12大列强AI将减少无谓内耗、跨阵营改善关系并结成防御联防，并在霸权深陷高熵增或多线战争时协同反制（仅对AI生效）。"
 setting_oe_rule_hegemon_ai_high: "高强度联防"
 setting_oe_rule_hegemon_ai_high_desc: "高压制衡档：降低霸权判定门槛并强化欧亚12大列强AI的跨教派、跨阵营联防意愿，大幅提升后期打破大一统封锁的战略难度（仅对AI生效）。"
 setting_oe_rule_hegemon_ai_off: "关闭反霸联防"
 setting_oe_rule_hegemon_ai_off_desc: "关闭动态反霸制衡层：欧亚12大列强AI仅按各自历史与地区战略目标独立发展，不再因超级霸权崛起而触发跨阵营联防。"

 rule_oe_rule_alliance_expire_guarantee: "凤凰计划：同盟到期降级为保障独立"
 setting_oe_rule_aeg_vanilla: "原版（自动降级）"
 setting_oe_rule_aeg_vanilla_desc: "保持EU5原版外交机制：高阶与低阶国家的同盟因条件失效到期时，高阶国家自动将其降级为单方面保障独立。"
 setting_oe_rule_aeg_no_downgrade: "不自动降级"
 setting_oe_rule_aeg_no_downgrade_desc: "同盟因条件失效到期后直接解除，不再自动转为单方面保障独立；玩家与AI正常手动提供或请求保障独立的外交行动不受影响。"

 rule_oe_rule_dynamic_institutions: "凤凰计划：动态思潮起源与欧亚催化"
 setting_oe_rule_dynamic_institutions_off: "关闭（默认原版）"
 setting_oe_rule_dynamic_institutions_off_desc: "保持EU5原版及既有规则，不触发v9.5动态思潮起源扩展与欧亚枢纽催化；同时启用外置思潮模组时推荐保持此档。"
 setting_oe_rule_dynamic_institutions_eurasian_hubs: "欧亚多极增强"
 setting_oe_rule_dynamic_institutions_eurasian_hubs_desc: "双层生效：开放君士坦丁堡、大都、杭州、开罗、撒马尔罕、德里与莫斯科7大欧亚枢纽在满足高识字、学府与市民门槛时竞争原版合理思潮诞生地，并在每年4月为达标枢纽提供思潮孕育催化。"
 setting_oe_rule_dynamic_institutions_global_merit: "全球唯才孕育"
 setting_oe_rule_dynamic_institutions_global_merit_desc: "双层生效：解除合理思潮诞生地的欧洲硬地理锁，全球任意满足高识字、学府、市民阶层与工商业规模的大都会均可竞争原生思潮起源，并强化欧亚枢纽的自主思潮孕育催化。"
