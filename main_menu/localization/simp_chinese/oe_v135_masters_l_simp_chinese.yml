 oe_woa_world_atlas: "大航海舆图与营造全图"
 oe_woa_world_atlas_desc: "以铜版精印绘就四海航路、大陆经纬与帝国穹顶营造规制的鸿篇巨帙，同步增强地方书籍产值、市场通达与海权商力。"
 oe_woa_world_atlas_name_0: "《$ADJECTIVE|U$坤舆万国大地图集》"
