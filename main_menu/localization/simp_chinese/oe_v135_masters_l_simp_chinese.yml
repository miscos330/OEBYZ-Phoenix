 oe_woa_astronomical_clock: "光学仪与天文自鸣钟"
 oe_woa_astronomical_clock_desc: "结合穆拉诺无瑕水晶透镜与黄道齿轮机构的天文自鸣重器，带动地方玻璃精工产出、思潮吸收与全国科研提速。"
 oe_woa_astronomical_clock_name_0: "《$ADJECTIVE|U$黄道天文自鸣钟》"
