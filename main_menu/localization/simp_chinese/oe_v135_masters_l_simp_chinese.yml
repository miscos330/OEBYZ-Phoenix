 ARTIST_TYPE_NAME_oe_art_imperial_jurist: "罗马法典编纂宗师"
 ARTIST_TYPE_DESC_oe_art_imperial_jurist: "承续查士丁尼与帕里奥洛格法学传统的帝国大法学家，常驻宫廷即可显著提升国家立法效率并大幅降低政策变更成本。"
 ARTIST_TYPE_NAME_oe_art_persian_miniaturist: "波斯细密画宗师"
 ARTIST_TYPE_DESC_oe_art_persian_miniaturist: "出身赫拉特、大不里士与伊斯法罕皇家书画院的细密画巨匠，以金箔敷彩与人物传神之笔显著抬升文化传统与国家威望。"
 ARTIST_TYPE_NAME_oe_art_imperial_kilnmaster: "御窑督陶巨匠"
 ARTIST_TYPE_DESC_oe_art_imperial_kilnmaster: "执掌浮梁景德镇与江南官窑釉色火候的督陶总管，既能烧制传世珐琅官瓷，也能提升贸易中心影响力与艺术品交易价值。"
 ARTIST_TYPE_NAME_oe_art_literati_polymath: "经世文宗与历算名宿"
 ARTIST_TYPE_DESC_oe_art_literati_polymath: "贯通书画美学、农政水利与西学历算的东亚经世名宿，在朝讲学著书即可稳步拉升全国月识字率与科研速度。"
 ARTIST_TYPE_NAME_oe_art_mughal_atelier_master: "印波画院博物巨匠"
 ARTIST_TYPE_DESC_oe_art_mughal_atelier_master: "融汇波斯笔法与印度丹青的宫廷画院写生名家，以博物级珍禽异卉画谱扩大国家文化影响力并加速思潮传播。"
 ARTIST_TYPE_NAME_oe_art_ukiyo_ink_master: "东瀛水墨与障屏宗师"
 ARTIST_TYPE_DESC_oe_art_ukiyo_ink_master: "兼擅禅宗破墨山水与安土桃山金碧障壁画的东瀛画圣，以清雅气格与恢弘屏风为朝廷与幕府增进荣誉与文化传统。"
 ARTIST_TYPE_NAME_oe_art_murano_horologist: "穆拉诺光学与制钟巨匠"
 ARTIST_TYPE_DESC_oe_art_murano_horologist: "精通晶玻透镜研磨与机械天文钟齿轮构造的精密工艺大师，常驻朝廷可加速学术科研并提升全国营建效率。"
 ARTIST_TYPE_NAME_oe_art_grand_cartographer: "大航海舆图与营造总师"
 ARTIST_TYPE_DESC_oe_art_grand_cartographer: "统筹世界铜版海图测绘与帝国宏大穹顶工程的跨界总师，显著加快全国营建速度并强化海权带来的商队力量。"
