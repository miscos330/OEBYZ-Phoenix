 oe_woa_world_atlas_name_2: "《$ADJECTIVE|U$$FIRST_NOUN|U$大航海海图志》"
 oe_art_hexabiblos_1345: "君士坦丁·哈梅诺普洛斯《六书》"
 oe_art_hexabiblos_1345_desc: "1345 年塞萨洛尼基大法官君士坦丁·哈梅诺普洛斯编纂的六卷本罗马民法大典，浓缩查士丁尼以来的帝国法统，泽被东地中海数百年。"
 oe_art_theophanes_transfiguration: "希腊人塞奥法内斯《变容圣像壁画》"
 oe_art_theophanes_transfiguration_desc: "由君士坦丁堡远赴罗斯的圣像巨匠塞奥法内斯挥毫绘就的《变容》杰作，以凌厉白光与深邃灵性开启东正教艺术新纪元。"
 oe_art_panselinos_protaton: "潘塞利诺斯马其顿画派《普罗塔通湿壁画卷》"
 oe_art_panselinos_protaton_desc: "马其顿画派宗师曼努埃尔·潘塞利诺斯传世湿壁画粉本与圣像卷轴，以立体光影与沉郁情感奠定阿索斯山与巴尔干丹青典范。"
 oe_art_behzad_bustan: "卡马尔丁·贝赫扎德《赫拉特布斯坦细密画》"
 oe_art_behzad_bustan_desc: "细密画之王贝赫扎德在赫拉特与大不里士主持绘制的萨迪《果园（布斯坦）》绝世手卷，以精妙建筑纵深与鲜活众生相冠绝伊斯兰绘画史。"
 oe_art_reza_abbasi_album: "礼萨·阿巴西《伊斯法罕宫廷仕女与行者卷》"
 oe_art_reza_abbasi_album_desc: "伊斯法罕画派领袖礼萨·阿巴西以行云流水般的单线白描与浓艳靛紫绘成的宫廷册页，成为十七世纪波斯风雅审美的永恒象征。"
 oe_art_tang_ying_taoye_tushuo: "臧应选与唐英《景德镇御窑陶冶图说与珐琅彩尊》"
 oe_art_tang_ying_taoye_tushuo_desc: "浮梁景德镇御窑督陶巨匠臧应选与唐英集粉彩、珐琅彩与二十幅制瓷工艺图说于大成的无双国宝，代表古代世界制瓷绝巅。"
 oe_art_xu_guangqi_nongzheng: "董其昌《画禅室随笔》与徐光启《农政全书》"
 oe_art_xu_guangqi_nongzheng_desc: "江南经世实学与文人书画巅峰的双璧合帙：徐光启《农政全书》贯通水利屯垦与几何历算，董其昌《画禅室随笔》立南北宗画论千秋之标。"
 oe_art_hamzanama_mansur: "阿克巴画院《哈姆扎传奇》与曼苏尔《珍禽写生谱》"
 oe_art_hamzanama_mansur_desc: "汇聚百余印波画师绘制的巨幅棉布史诗《哈姆扎传奇》与“时代奇迹”乌斯塔德·曼苏尔博物写生谱，定格南亚帝国的绚丽生机。"
 oe_art_sesshu_long_scroll: "雪舟等杨《四季山水长卷》"
 oe_art_sesshu_long_scroll_desc: "禅僧画圣雪舟等杨渡海求法归来后于周防山口天开图画楼绘就的十六米水墨巨卷，以峻峭斧劈皴开辟日本水墨山水宗风。"
 oe_art_kano_eitoku_karajishi: "狩野永德《唐狮子图屏风与安土金碧障壁》"
 oe_art_kano_eitoku_karajishi_desc: "狩野派宗师狩野永德以重彩金箔与粗豪笔力绘就的《唐狮子图》大屏风与城郭金碧障壁画，尽显安土桃山霸主气象。"
 oe_art_murano_st_marks_clock: "穆拉诺水晶透镜与《圣马可天文钟机图》"
 oe_art_murano_st_marks_clock_desc: "威尼斯穆拉诺无瑕水晶玻璃透镜与圣马可广场黄道天文自鸣钟的精密机械全图，标志着欧洲精密光学与机械计时工艺的跃升。"
 oe_art_blaeu_sinan_masterwork: "布劳《大地图集》与希南《塞利米耶穹顶营造全谱》"
 oe_art_blaeu_sinan_masterwork_desc: "低地铜版世界《大地图集》与博斯普鲁斯首席营造总师米马尔·希南穹顶营造全谱的旷世奇书，丈量大地四海亦托起帝国穹苍。"
 STATIC_MODIFIER_NAME_oe_mst_restituted_pride_mod: "传世名作归璧振奋"
 STATIC_MODIFIER_DESC_oe_mst_restituted_pride_mod: "散落异邦的传世重器终得完壁归赵，举国文风振奋，文化传统与国家威望显著攀升。"
 STATIC_MODIFIER_NAME_oe_mst_patronage_cooldown_mod: "跨国御聘画院热潮"
 STATIC_MODIFIER_DESC_oe_mst_patronage_cooldown_mod: "重金礼聘四方宗师的盛举传遍欧亚名城，吸引更多才俊赴朝投效，降低雇佣成本并提升新募大师造诣。"
 STATIC_MODIFIER_NAME_oe_mst_treasury_catalogued_mod: "御府珍藏编目修缮"
 STATIC_MODIFIER_DESC_oe_mst_treasury_catalogued_mod: "朝廷定期清点御府名作、编纂图录并延请名匠修旧如旧，提升藏品估值、文化辐射与国家威望。"
 STATIC_MODIFIER_NAME_oe_mst_golden_atelier_mod: "传世巨制盛世工坊"
 STATIC_MODIFIER_DESC_oe_mst_golden_atelier_mod: "举国倾力赞助史诗名作的诞生，令都城与名邑工坊云集，显著降低委制艺术品花费并弘扬文化传统。"
 STATIC_MODIFIER_NAME_oe_mst_stolen_art_resolve_mod: "御藏护宝与追索之志"
 STATIC_MODIFIER_DESC_oe_mst_stolen_art_resolve_mod: "清查秘阁名录、铭刻源流印记并立志护持国宝，激发朝野文化自觉与外交声望。"
 STATIC_MODIFIER_NAME_oe_mst_her_giza: "吉萨大金字塔御守诏令"
 STATIC_MODIFIER_DESC_oe_mst_her_giza: "严禁采石毁坏吉萨古墓群并修整尼罗河朝览御道，令千年奇观持续滋养当地文化传统与商旅繁荣。"
 STATIC_MODIFIER_NAME_oe_mst_her_colosseum: "罗马斗兽场古建护持"
 STATIC_MODIFIER_DESC_oe_mst_her_colosseum: "敕令保护弗拉维圆形剧场拱廊免遭拆石，并以古典营造范本激励永恒之城的匠人晋升与文化辐射。"
 STATIC_MODIFIER_NAME_oe_mst_her_parthenon: "雅典卫城帕特农守护令"
 STATIC_MODIFIER_DESC_oe_mst_her_parthenon: "护持雅典卫城帕特农神庙与古典铭文，使阿提卡成为人文识字与思潮交流的爱琴明灯。"
 STATIC_MODIFIER_NAME_oe_mst_her_samarra: "萨迈拉螺旋尖塔御修令"
 STATIC_MODIFIER_DESC_oe_mst_her_samarra: "修缮阿拔斯盛世遗留的马尔维亚螺旋宣礼塔与经学院，重振底格里斯河畔的识字风尚与古典文化传统。"
 STATIC_MODIFIER_NAME_oe_mst_her_leshan: "凌云乐山大佛护江诏令"
 STATIC_MODIFIER_DESC_oe_mst_her_leshan: "疏浚岷江大渡河合流排水石渠并整修凌云阁栈道，护佑巴蜀舟楫安澜，稳步提升地方繁荣并消弭动荡。"
 STATIC_MODIFIER_NAME_oe_mst_her_sanchi: "桑奇大塔与四门石雕护持"
 STATIC_MODIFIER_DESC_oe_mst_her_sanchi: "妥善守护阿育王所建桑奇大塔与精美托拉纳牌坊石雕，化马尔瓦高原为文化传统与四方迁徙汇聚之地。"
 STATIC_MODIFIER_NAME_oe_mst_her_stonehenge: "埃姆斯伯里巨石阵测绘护持"
 STATIC_MODIFIER_DESC_oe_mst_her_stonehenge: "禁止挪移索尔兹伯里平原史前巨石环并鼓励天象测绘考察，滋养英伦古老传说传统并助推思潮传播。"
 STATIC_MODIFIER_NAME_oe_mst_her_teotihuacan: "特奥蒂瓦坎太阳金字塔御守"
 STATIC_MODIFIER_DESC_oe_mst_her_teotihuacan: "整修亡灵大道与太阳、月亮金字塔圣坛，使墨西哥谷地古都重焕发展活力与跨洲文化威仪。"
 STATIC_MODIFIER_NAME_oe_mst_her_mecca: "麦加圣寺与克尔白御护"
 STATIC_MODIFIER_DESC_oe_mst_her_mecca: "缮治禁寺廊柱、保障红海与沙漠朝觐商队水源安全，赋予圣城无可匹敌的教界威望与文化影响力。"
 STATIC_MODIFIER_NAME_oe_mst_her_bodhgaya: "菩提伽耶摩诃菩提寺御守"
 STATIC_MODIFIER_DESC_oe_mst_her_bodhgaya: "修护金刚座大塔与菩提圣树讲经院，吸引东亚、锡兰与西藏僧侣译经游学，提升地方识字率并化育清平。"
 STATIC_MODIFIER_NAME_oe_mst_her_srirangam: "斯里兰甘大神庙七重塔门护持"
 STATIC_MODIFIER_DESC_oe_mst_her_srirangam: "修缮高韦里河岛上的七重石壁与宏伟戈普兰塔门，令南印圣城持续兴盛传统乐舞、经学与商贸繁荣。"
 STATIC_MODIFIER_NAME_oe_mst_her_qufu: "曲阜孔庙杏坛崇儒诏令"
 STATIC_MODIFIER_DESC_oe_mst_her_qufu: "修葺大成殿与奎文阁藏书楼、敕赐祭礼与书院膏火，大幅拔升鲁地月识字率与最高识字率上限。"
 STATIC_MODIFIER_NAME_oe_mst_her_jerusalem: "耶路撒冷圣城壁垒与圣迹御守"
 STATIC_MODIFIER_DESC_oe_mst_her_jerusalem: "修固圣城雉堞城墙并妥善护持圣墓大堂与岩石圆顶诸圣迹，同步提升圣城的文化辐射与城防韧性。"
 STATIC_MODIFIER_NAME_oe_mst_her_cholula: "乔卢拉圣山大金字塔御护"
 STATIC_MODIFIER_DESC_oe_mst_her_cholula: "护持中部美洲体积最巨的乔卢拉阶坛圣城与陶艺彩绘市集，持续滋养高原文化传统与城邦繁荣。"
 STATIC_MODIFIER_NAME_oe_mst_her_enryakuji: "比睿山延历寺镇护与藏经阁令"
 STATIC_MODIFIER_DESC_oe_mst_her_enryakuji: "护持俯瞰琵琶湖与京都东北鬼门的比睿山延历寺经藏与山城要隘，同步提升近江识字率与山地防御力。"
 STATIC_MODIFIER_NAME_oe_mst_her_stpeters: "罗马圣彼得大殿穹顶兴建护持"
 STATIC_MODIFIER_DESC_oe_mst_her_stpeters: "由天主教会圣座与拉丁基督教君主共襄盛举，护持梵蒂冈圣彼得大殿营造与宗座图书馆，推动罗马教界威望与思潮跃升。"
 oe_mst_patronage_ready_tt: "当前未处于近十五年跨国重金礼聘大师的冷却期内。"
 oe_mst_treasury_ready_tt: "当前未处于近十年御府名作清点修缮的冷却期内。"
 oe_mst_has_unconsecrated_heritage_tt: "国内实控至少一处尚未激活或已届满二十五年守护诏令的世界奇观或圣地。"
 oe_mst_catalogue_treasury_tt: "为国内最多两件品质尚未登峰造极的传世艺术品精心修缮提质（每件品质 +4）。"
 oe_mst_patronize_master.title: "跨国重金礼聘传世大师"
 oe_mst_patronize_master.desc: "遣使携带重金前往欧亚名城、大学与皇家画院广发请帖，从三类契合本国文明脉络的传世大师职业中延揽一位绝顶宗师入朝效力，同时激发十五年画院兴盛热潮。"
 oe_mst_patronize_master.a: "厚赐金帛，遴选传世大师入朝"
 oe_mst_catalogue_treasury.title: "清点御藏名作与修缮提质"
 oe_mst_catalogue_treasury.desc: "命内府典藏官与精工画匠全面清点御库藏品、编纂传世图录，并为至多两件藏品细心修旧如旧、拔升品质，同时在十年间提升文化辐射与藏品声价。"
 oe_mst_catalogue_treasury.a: "开库编目并精修传世珍藏"
 oe_mst_consecrate_world_heritage.title: "诏令守护世界奇观与圣地"
 oe_mst_consecrate_world_heritage.desc: "对我朝和平实控的世界古代奇观与宗教圣地立即颁布或续期二十五年御守诏令，无须任何扩展包即可赋予所在地持久的文脉、识字、繁荣或防御加成。"
 oe_mst_consecrate_world_heritage.a: "颁行御守诏令，永续胜迹荣光"
 oe_mst.1.t: "塞萨洛尼基的法典巨擘"
 oe_mst.1.d: "在帕里奥洛格文艺复兴的学术热潮中，塞萨洛尼基首席大法官君士坦丁·哈梅诺普洛斯历时数年删繁就简，将浩瀚的帝国敕令与《巴西利卡法典》熔铸为简明精严的《六书》（Hexabiblos）。若朝廷拨款延揽其入宫廷法曹并抄录定本，帝国法度必将光耀千秋。"
 oe_mst.1.a: "重金延揽大法官入朝，定本颁行《六书》"
 oe_mst.1.b: "收存精抄定本入秘阁，节省国库开支"
 oe_mst.2.t: "光耀东正世界"
 oe_mst.2.d: "声名远播的君士坦丁堡圣像大师“希腊人塞奥法内斯”正于本国大教堂脚手架上挥洒自如：他不拘底稿，仅以迅疾而灼热的白色高光勾勒先知与基督变容的庄严气象，令诺夫哥罗德与莫斯科画工无不倾倒。朝廷是否重金礼聘其主持皇家圣像工坊？"
 oe_mst.2.a: "礼聘塞奥法内斯掌皇家圣像坊，珍藏《变容》巨作"
 oe_mst.2.b: "仅资助教堂完成圣像供奉，不增设宫廷画师俸禄"
 oe_mst.3.t: "马其顿画派巅峰"
 oe_mst.3.d: "塞萨洛尼基与圣山阿索斯之间，马其顿画派宗师曼努埃尔·潘塞利诺斯的门人正将普罗塔通主堂的湿壁画技法整理成传世圣像卷轴。其人物肌理丰润、神情深沉，堪称帕里奥洛格艺术复兴的桂冠。"
 oe_mst.3.a: "设官资助圣像画派，延请宗师传人入朝"
 oe_mst.3.b: "敕封画卷为帝国圣库珍品，维持既有预算"
 oe_mst.4.t: "细密画之王"
 oe_mst.4.d: "皇家书画院中，大师卡马尔丁·贝赫扎德为萨迪《果园（布斯坦）》倾心绘制的细密画终于落笔：每一方釉砖、每一袭长袍、乃至市井匠人与宫廷乐师的眉眼都栩栩如生。从呼罗珊到阿塞拜疆，诸国君王无不垂涎此卷。"
 oe_mst.4.a: "册封贝赫扎德主持皇家书画院，厚赐金帛珍藏绝卷"
 oe_mst.4.b: "将精装《布斯坦》收入御库，量力赏赐画工"
 oe_mst.5.t: "伊斯法罕的流丽笔墨"
 oe_mst.5.d: "礼萨·阿巴西在伊斯法罕广场边的画肆掀起新风：他不再拘泥于大部头史诗插图，而是以灵动起伏的书法线条描绘执杯青年、仕女与苦行智者，令全城雅士竞相求购。朝廷可延其入御画院，收揽这批传世册页。"
 oe_mst.5.a: "重聘礼萨·阿巴西入宫廷画院，装裱全套御览画册"
 oe_mst.5.b: "购藏册页入内府，任其自由授徒民间"
 oe_mst.6.t: "瓷都千古绝巅"
 oe_mst.6.d: "浮梁景德镇千余座龙窑昼夜火光映天。继臧应选重振官窑后，督陶官唐英亲驻窑厂与工匠同寝食，不仅烧成艳丽莹润的御制珐琅彩与转心瓶，更编成详载采石、淘泥、画釉、满窑二十道绝技的《陶冶图说》，进呈御览。"
 oe_mst.6.a: "重赏督陶巨匠入朝掌造办，御藏珐琅彩尊与《陶冶图说》"
 oe_mst.6.b: "嘉奖浮梁窑工，收录《陶冶图说》入内府"
 oe_mst.7.t: "江南经世与文脉双璧"
 oe_mst.7.d: "江南吴县与上元之间文风鼎盛：实学名臣徐光启潜心试验水利农作与西洋几何历算，著成六十卷《农政全书》；同乡文宗董其昌则在画禅室中总论南北宗书画气韵。文采与格致并举，正待朝廷刊刻流布天下。"
 oe_mst.7.a: "延请江南经世名宿入阁，官刻全帙并颁行天下"
 oe_mst.7.b: "命江南书坊抄藏善本入库，免动大额帑银"
 oe_mst.8.t: "时代奇迹·《哈姆扎传奇》"
 oe_mst.8.d: "德里与阿格拉的皇家画院汇聚了来自波斯与印度各地的百余名丹青圣手。在磅礴的《哈姆扎传奇》巨幅棉布彩绘之后，宫廷博物画师乌斯塔德·曼苏尔更以毫发毕现的笔触绘下西域猎鹰、孟加拉花鸟与异域珍禽，令群臣叹为观止。"
 oe_mst.8.a: "赐号“时代奇迹”并扩建皇家画院，御藏全套图谱"
 oe_mst.8.b: "收存《珍禽写生谱》入皇家珍宝阁，节制画院开支"
 oe_mst.9.t: "画圣破墨"
 oe_mst.9.d: "曾随遣明船西渡观摩中土山川的禅僧画圣雪舟等杨，近日在周防山口与京都之间挥毫展卷，绘成气势沉雄、四季流转的《四季山水长卷》。其笔势如刀斫石、墨色层次万千，标志着东瀛水墨画自立宗门。"
 oe_mst.9.a: "厚礼聘雪舟一脉入府授艺，珍藏《四季山水长卷》"
 oe_mst.9.b: "供奉长卷于大寺宝殿，量力致赠润笔"
 oe_mst.10.t: "金碧霸主气象"
 oe_mst.10.d: "京都与大坂的巍峨天守阁内，狩野派巨匠狩野永德以满壁金箔为底、石绿群青为色，挥毫绘就威猛雄浑的《唐狮子图屏风》与巨松桧木障壁画。诸侯使节踏入大广间时，无不为满室煌煌金光所震慑。"
 oe_mst.10.a: "册封狩野派为御用画师，重金装点天守金碧障壁"
 oe_mst.10.b: "收存《唐狮子图屏风》入大广间，节制金箔用度"
 oe_mst.11.t: "泻湖上的精密奇迹"
 oe_mst.11.d: "在戒备森严的穆拉诺玻璃岛与圣马可广场钟楼之间，威尼斯顶尖工匠将清澈如水的无色水晶透镜与复杂黄道齿轮天文钟完美结合：它不仅精准报时，更能推演月相、黄道十二宫与潮汐涨落，令全欧学者趋之若鹜。"
 oe_mst.11.a: "重聘穆拉诺制钟光学巨匠入朝，立天文钟机于国都"
 oe_mst.11.b: "颁授行会特许并收存钟机图纸，节省国库支出"
 oe_mst.12.t: "丈量四海与托举穹苍"
 oe_mst.12.d: "无论是阿姆斯特丹与安特卫普雕版作坊中由威廉·布劳精印的十一卷《大地图集》，还是君士坦丁堡御用总建筑师米马尔·希南以几何力学绘就的《穹顶营造全谱》，都在此刻臻至化境。若朝廷重金延揽这位跨界总师，帝国的远洋航路与宏伟营造必将独步天下。"
 oe_mst.12.a: "延揽大舆图营造总师主持御坊，精印装帧传世全谱"
 oe_mst.12.b: "收存母本入皇家海图与营造库，不增设常俸"
 oe_mst.13.t: "群英赴召：遴选跨国御聘传世大师"
 oe_mst.13.d: "我朝重金延才的诏书传遍四方名都与书院，三位久负盛名、造诣登峰造极的当代巨匠愿应召前来效力。朝廷究竟该优先延揽法政经世名宿、宫廷画院窑艺宗师，还是精密制钟与大航海舆图总师？"
 oe_mst.13.a: "延揽法政经世巨匠（帝国法典编纂宗师 / 东亚经世名宿）"
 oe_mst.13.b: "延揽画院窑艺宗师（水墨障屏 / 御窑督陶 / 印波博物 / 波斯细密画）"
 oe_mst.13.c: "延揽精密营造总师（穆拉诺光学制钟巨匠 / 大航海舆图营造总师）"
 oe_mst.14.t: "名作归璧与御藏护宝警讯"
 oe_mst.14.d: "无论是借外交和约令散落异邦的传世重器完壁归赵，还是因战火流散而痛定思痛、清查秘阁名录，举国上下都深刻体会到传世名作不仅是金银器物，更是文明血脉与邦国尊严的象征。朝廷当借此机会弘扬文风，抑或严整御库护宝制度？"
 oe_mst.14.a: "陈列国宝以励万民，弘扬传世文脉"
 oe_mst.14.b: "严整秘阁护宝典籍，精修现存名作"
 oe_mst.15.t: "千年奇观御守：吉萨大金字塔"
 oe_mst.15.d: "尼罗河西岸沙原之上，矗立四千载的吉萨大金字塔与狮身人面像静观王朝兴替。如今我朝实控吉萨，颁布护持诏令、禁止盗采巨石并修缮河岸驿馆，便可令四海旅人与学者慕名云集。"
 oe_mst.15.a: "颁行吉萨古迹御守诏令，永续千年文脉"
 oe_mst.15.b: "拨银大修河岸驿馆并立碑记功"
 oe_mst.16.t: "永恒之城的石砌冠冕"
 oe_mst.16.d: "雄踞罗马城心的弗拉维圆形剧场历经地震与中世纪采石仍巍然不倒。我朝既已掌握罗马，若下诏禁止焚烧大理石作石灰，并将其列为古典建筑观摩圣地，永恒之城的文化号召力必将焕然一新。"
 oe_mst.16.a: "颁布护石诏令，守护罗马斗兽场"
 oe_mst.16.b: "出资加固拱廊并举办古典建筑讲习"
 oe_mst.17.t: "大理石与智慧之丘"
 oe_mst.17.d: "洁白如玉的帕特农神庙高踞雅典卫城之巅，俯瞰爱琴碧海。我朝既已据有雅典，若妥善修护廊柱铭文并禁止在圣殿内囤积火药，必能吸引欧亚古典学者前来研习，点燃人文识字与思潮传播之火。"
 oe_mst.17.a: "颁行卫城护持令，守护帕特农神庙"
 oe_mst.17.b: "出资摹拓古典铭文并兴办学舍"
 oe_mst.18.t: "底格里斯河畔的螺旋天梯"
 oe_mst.18.d: "巍峨的马尔维亚螺旋宣礼塔屹立于底格里斯河东岸，见证着阿拔斯黄金时代的学术与建筑壮举。我朝实控萨迈拉后，修整砖砌坡道并重开讲经藏书廊，将令两河流域的文脉薪火重燃。"
 oe_mst.18.a: "敕令修护萨迈拉大清真寺与螺旋尖塔"
 oe_mst.18.b: "拨款重修书院并招揽两河经师"
 oe_mst.19.t: "山是一尊佛，佛是一座山"
 oe_mst.19.d: "岷江、青衣江与大渡河三江汇流之处，唐代海通禅师依山开凿的弥勒巨佛安坐绝壁，镇伏激流湍滩。我朝实控嘉定龙游后，定期清理佛身暗渠、修葺九曲栈道，既保川江漕运平安，亦令蜀地民心安宁。"
 oe_mst.19.a: "颁行乐山大佛护江修渠令"
 oe_mst.19.b: "捐银重修凌云佛阁并施赈川江船工"
 oe_mst.20.t: "孔雀王朝的石雕遗韵"
 oe_mst.20.d: "矗立于博帕尔北麓丘陵上的桑奇大塔始建于阿育王时代，四座高耸的托拉纳石雕牌坊遍刻商队、大象与莲华故事。我朝既已掌握博帕尔，下诏护持古塔林荫并整修山道，可使马尔瓦高原文风与人气日盛。"
 oe_mst.20.a: "立碑护持桑奇大塔与四方石牌坊"
 oe_mst.20.b: "拨银整修古道驿站并广迎四方匠旅"
 oe_mst.21.t: "夏至日出之环：埃姆斯伯里巨石阵"
 oe_mst.21.d: "苍茫白垩原野之上，巨大的蓝砂岩门柱精准指向夏至日出，诉说着远早于罗马与撒克逊人的史前纪元。如今我朝统治埃姆斯伯里，严禁村民凿石并资助学者测绘星辰方位，将令古老奇观与近代考据交相辉映。"
 oe_mst.21.a: "颁布王室禁采令，守护埃姆斯伯里巨石阵"
 oe_mst.21.b: "资助天象考据学者测绘巨石方位"
 oe_mst.22.t: "众神诞生之城"
 oe_mst.22.d: "墨西哥高原辽阔谷地间，雄伟的太阳金字塔与亡灵大道虽历千载沧桑，仍被诸族敬奉为天地创生之所。我朝实控特奥蒂瓦坎后，敕令清理荒草、护持阶坛与黑曜石作坊旧址，将令此地发展日新、文化远播。"
 oe_mst.22.a: "颁行特奥蒂瓦坎太阳金字塔护持令"
 oe_mst.22.b: "大修亡灵大道并兴建谷地朝觐石市"
 oe_mst.23.t: "万邦朝宗之枢"
 oe_mst.23.d: "汉志群山环抱之中，黑锦覆顶的克尔白吸引着来自安达卢斯、马里、安纳托利亚乃至印度洋畔的万千朝觐者。我朝既掌麦加，严整圣寺水渠并赐织圣幕，即能将两圣地护持者的赫赫声望传遍四海。"
 oe_mst.23.a: "颁行麦加圣寺御护令，保障朝觐通途"
 oe_mst.23.b: "厚赐织锦与水渠修缮银，迎四海朝觐商队"
 oe_mst.24.t: "金刚座与圣树清荫"
 oe_mst.24.d: "尼连禅河畔，砖雕庄严的摩诃菩提大塔静立于金刚座旁，历代远自大唐、蒲甘、锡兰与吐蕃的求法高僧皆曾在此礼敬。我朝实控迦耶后，整修古塔并设立译经僧舍，可使此地文风日兴、闾里清宁。"
 oe_mst.24.a: "敕令护持摩诃菩提寺与金刚座"
 oe_mst.24.b: "资助远方求法僧侣并兴办译经书院"
 oe_mst.25.t: "高韦里河岛的七重圣城"
 oe_mst.25.d: "在高韦里河分流环抱的绿洲岛屿上，斯里兰甘大神庙以七重同心石墙与彩绘高耸的戈普兰塔门冠绝南印。我朝实控此地后，修整千柱大厅并扶植庙市商旅，必令德干与朱罗故地的传统繁华绵延不绝。"
 oe_mst.25.a: "颁行斯里兰甘大神庙御护与免扰令"
 oe_mst.25.b: "出资修缮千柱大殿并振兴神庙大集"
 oe_mst.26.t: "万世师表与奎文藏书"
 oe_mst.26.d: "洙泗之间古柏森森，曲阜孔庙大成殿与杏坛历千载而不衰。我朝既抚有曲阜，若遣官致祭、修葺奎文阁典籍并拨给学田膏火，齐鲁文风必将蔚为大观，四方儒生咸集于此。"
 oe_mst.26.a: "遣官致祭曲阜孔庙，修葺奎文阁书楼"
 oe_mst.26.b: "赐拨学田膏火，广刊经史于鲁地书院"
 oe_mst.27.t: "三教圣山与金石危城"
 oe_mst.27.d: "犹大山地之巅，圣墓教堂的钟声与圣殿山圆顶的金光交相辉映，牵动着地中海与西亚亿万生民之心。我朝既已掌握耶路撒冷，严整圣城防务并护佑四海朝圣客旅，将令此城既固若金汤又威望四海。"
 oe_mst.27.a: "颁行圣城秩序诏令，护持耶路撒冷诸圣迹"
 oe_mst.27.b: "拨银加固城墙水渠并修缮朝圣旅舍"
 oe_mst.28.t: "羽蛇圣城与巨丘阶坛"
 oe_mst.28.d: "在雪峰映照的普埃布拉谷地中，人工筑就的乔卢拉大金字塔气势如山，环绕其侧的圣殿与彩陶市集历数百年香火不绝。我朝实控乔卢拉后，下诏护持古坛秩序并扶植彩陶工坊，必令此圣城商旅络绎、传统常青。"
 oe_mst.28.a: "颁行乔卢拉圣城护持与保商令"
 oe_mst.28.b: "资助高原彩陶匠坊并大修朝圣大道"
 oe_mst.29.t: "镇护京畿的千载灯火"
 oe_mst.29.d: "近江栗太郡比睿山杉林深处，延历寺根本中堂的不灭法灯长明数百年，俯瞰琵琶碧波与京都北郊要冲。我朝实控栗太后，护持山上浩瀚佛典藏经并修缮山道关隘，可兼得学林兴盛与京畿屏障之利。"
 oe_mst.29.a: "颁行比睿山藏经与山林护持令"
 oe_mst.29.b: "出资修缮经藏堂塔并固守琵琶湖山隘"
 oe_mst.30.t: "穹顶直指苍穹"
 oe_mst.30.d: "台伯河西岸的梵蒂冈丘陵上，宏伟的圣彼得大殿正汇集拉丁基督教世界最杰出的建筑师、雕塑家与神学家。作为信奉天主教的罗马守护者，颁布大殿营造护持令并充实宗座图书馆，将使永恒之城引领全欧艺术与思潮之先。"
 oe_mst.30.a: "颁布圣彼得大殿与宗座书库御护诏令"
 oe_mst.30.b: "厚赐大理石营造经费，广延全欧巨匠赴罗马"
