 oe_woa_naturalist_album: "宫廷博物珍禽图谱"
 oe_woa_naturalist_album_desc: "以细腻矿彩忠实描绘奇花异草与四方珍禽的宫廷博物画册，推动所在地思潮交流与全国文化影响力扩张。"
