# NEW 2026-11-24 v25.0 Stage 2 Final 1337 Tier-2 Pack (VEN/GEN, HUN, BUR, Post-Ilkhanate Persia) (oe_v250_mbp_, 0 mainline slots, 0 rules, 0 vanilla overrides) — simp_chinese localization for Stage 2 Final 1337 Tier-2 Pack (168 keys). Generated by gen_v250_1337_med_balkan_persia.py
 oe_v250_mbp_ref_maritime_senate:0 "海上贵族元老院体制"
 oe_v250_mbp_ref_maritime_senate_desc:0 "将国营船坞、黎凡特护航船期与海事财政尽数置于共和国世家元老院统辖之下，显著提升海贸收益、桨帆战力与海权投射，代价则是陆军雇佣开销加重且陆地征召规模受限。"
 oe_v250_mbp_priv_patrician_arsenal:0 "世家船坞与护航商队特许"
 oe_v250_mbp_priv_patrician_arsenal_desc:0 "向航海世家与造船行会授予常设船台承包权与商船队优先股，大幅加快战舰建造并充实水手储备，同时推高市民阶层权势、压低商税上限并加重海军维护负担。"
 oe_v250_mbp_cab_levant_convoys:0 "调度黎凡特护航商船队"
 oe_v250_mbp_cab_levant_convoys_desc:0 "派遣受共和国战舰护卫的定期商船队往返亚历山大、君士坦丁堡、希俄斯与黑海商埠，提振海上贸易、商团运力与海权存在，但常年护航与防务使海陆军费双双承压。"
 oe_v250_mbp_cab_levant_convoys_action:0 "调度黎凡特护航商船队"
 oe_v250_mbp_cab_levant_convoys_active:0 "正在执行：调度黎凡特护航商船队"
 oe_v250_mbp_cab_levant_convoys_action_progress:0 "执行中"
 oe_v250_mbp_cab_levant_convoys_action_progress_wordier:0 "调度黎凡特护航商船队（执行中）"
 oe_v250_mbp_cab_levant_convoys_action_progress_tooltip:0 "派遣受共和国战舰护卫的定期商船队往返亚历山大、君士坦丁堡、希俄斯与黑海商埠，提振海上贸易、商团运力与海权存在，但常年护航与防务使海陆军费双双承压。"
 oe_v250_mbp_dec_chioggia_fleet_levy.title:0 "颁行基奥贾非常舰队征召令"
 oe_v250_mbp_dec_chioggia_fleet_levy.desc:0 "紧急动员所有世家船坞、商船船体与沿岸桨手，打造足以冲破亚得里亚海或利古里亚海封锁的决战舰队。耗费100金币，持续25年强化桨帆战力、海军士气与造船速度，代价是海军维持费陡增且市民阶层承压。"
 oe_v250_mbp_dec_chioggia_fleet_levy.a:0 "征发非常桨帆舰队驶出港湾"
 oe_v250_mbp_dec_chioggia_fleet_levy_tt:0 "提升本邦母港船坞发展度，并在25年内施行#Y 基奥贾非常舰队征召#!。"
 oe_v250_mbp.1.t:0 "黎凡特护航商队与黑海商权之争"
 oe_v250_mbp.1.d:0 "从卡法与塔纳的粮港，直至亚历山大港与希俄斯的香料商栈，威尼斯与热那亚的武装桨帆舰在东地中海每一处咽喉水道彼此窥伺。若扩建国营船坞并推行严密的官办护航船期，虽能牢控海路并加快造舰，却须承受沉重海军维持费与陆地兵员收缩；若转而特许民间世家商团自组船队，则商贸运力大增，代价是市民权势膨胀与商税让利。"
 oe_v250_mbp.1.a:0 "扩建国营船坞护航船队并争夺黎凡特海权"
 oe_v250_mbp.1.b:0 "特许世家商团承包海外商栈与转运贸易"
 oe_v250_mbp.2.t:0 "博斯普鲁斯海战与世家公债银团"
 oe_v250_mbp.2.d:0 "博斯普鲁斯海峡与爱琴海门户的惨烈海战耗尽了共和国战备府库，元老院必须抉择长期海战的筹饷之道。若将国债归口于世家公债银行——如圣乔治银团或威尼斯旧公债基金——虽可稳固岁入与海外投射，却必将部分财政权柄让渡予债主世家；若强征非常桨帆战备关税，虽能立时强化舰队战力，却会打击海运贸易并激怒商界。"
 oe_v250_mbp.2.a:0 "整合公债设立世家银团基金以固海权财政"
 oe_v250_mbp.2.b:0 "于全境商港开征非常桨帆战备关税"
 oe_v250_mbp.3.t:0 "基奥贾血战与海港检疫法典"
 oe_v250_mbp.3.d:0 "敌舰频频逼近泻湖浅滩，自黎凡特返航的商舶亦屡屡挟带瘟疫，共和国正面临生死存亡与民生维系的双重考验。若一边严行四十日海港检疫所法典、一边总动员船坞固守本土，可护佑城镇繁荣与防务韧性，却使海军维保与税效承压；若接受调停缔结商贸和约，虽能重开海路并赢取外交信誉，却令水师锐气受挫、威望渐损。"
 oe_v250_mbp.3.a:0 "严行海港检疫所法典并固守本土船坞防线"
 oe_v250_mbp.3.b:0 "接受调停缔结商贸和约以重开地中海航路"
 oe_v250_mbp_ref_anjou_banderia:0 "安茹旗团军与矿务署体制"
 oe_v250_mbp_ref_anjou_banderia_desc:0 "将上匈牙利皇家金银矿务署与大贵族、大主教麾下的旗团骑士军结合为一体，显著强化重骑战力、矿产产出与王室岁入，代价则是贵族阶层权势攀升且贵族税赋上限下调。"
 oe_v250_mbp_priv_golden_bull_estates:0 "金玺诏书与世袭领地特许"
 oe_v250_mbp_priv_golden_bull_estates_desc:0 "重申匈牙利贵族的《金玺诏书》免税特权与家族世袭领地不可让渡原则，壮大轻骑兵与全国兵源储备，代价是贵族权势大幅增长、贵族税赋上限走低并削弱王室集权。"
 oe_v250_mbp_cab_kremnica_gold_mint:0 "克雷姆尼察皇家铸币与矿税清查"
 oe_v250_mbp_cab_kremnica_gold_mint_desc:0 "派遣克雷姆尼察皇家矿务与铸币官赴目标行省核查矿脉、精炼金币并稽征矿税，提升矿产产出、地方繁荣、控制度与国家税效，却伴生轻微通胀压力并引起领主贵族不满。"
 oe_v250_mbp_cab_kremnica_gold_mint_action:0 "克雷姆尼察皇家铸币与矿税清查：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mbp_cab_kremnica_gold_mint_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行克雷姆尼察皇家铸币与矿税清查"
 oe_v250_mbp_cab_kremnica_gold_mint_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mbp_cab_kremnica_gold_mint_action_progress_wordier:0 "克雷姆尼察皇家铸币与矿税清查（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mbp_cab_kremnica_gold_mint_action_progress_tooltip:0 "派遣克雷姆尼察皇家矿务与铸币官赴目标行省核查矿脉、精炼金币并稽征矿税，提升矿产产出、地方繁荣、控制度与国家税效，却伴生轻微通胀压力并引起领主贵族不满。"
 oe_v250_mbp_cab_kremnica_gold_mint_select_province:0 "选择开展克雷姆尼察铸币与矿税清查的行省"
 oe_v250_mbp_cab_kremnica_gold_mint_no_provinces:0 "@trigger_no! 当前没有可开展皇家铸币与矿税清查的行省。"
 oe_v250_mbp_dec_danube_border_forts.title:0 "筑固多瑙河边防总督要塞线"
 oe_v250_mbp_dec_danube_border_forts.desc:0 "修缮并加固拱卫铁门峡谷与多瑙河下游门户的石砌要塞、河防烽燧与边防总督驻军。耗费110金币，持续25年显著增强全国防御、陆军士气与兵源储备，但要塞维持费沉重且拖累直征税效。"
 oe_v250_mbp_dec_danube_border_forts.a:0 "沿多瑙河前沿兴筑石砌边防要塞"
 oe_v250_mbp_dec_danube_border_forts_tt:0 "提升#Y 布达#!发展度与#Y 蒂米什瓦拉#!繁荣度，并在25年内施行#Y 多瑙河边防要塞线#!。"
 oe_v250_mbp.4.t:0 "克雷姆尼察金币与财税协定"
 oe_v250_mbp.4.d:0 "随着克雷姆尼察与上匈牙利金矿源源产出，维谢格拉德的安茹宫廷已将匈牙利金币铸成中欧最具信誉的硬通货。若严厉推行王室矿税与户门税，可令布达国库充盈、陆贸畅旺，却会触怒地方领主并加重维稳负担；若与喀尔巴阡大贵族共分矿务署收益，虽能安抚贵族并促发地方繁荣，却削弱王室集权。"
 oe_v250_mbp.4.a:0 "严征王室矿税并精铸纯度上乘的克雷姆尼察金币"
 oe_v250_mbp.4.b:0 "与喀尔巴阡大贵族共分矿务署盈余以稳邦本"
 oe_v250_mbp.5.t:0 "大王拉约什与多瑙河经略"
 oe_v250_mbp.5.d:0 "随着《1351年法令》确立圣伊什特万王冠全境贵族法权平等，拉约什大王的旗团蓄势待发，既图经略威尼斯控制的达尔马提亚海岸，又欲确立多瑙河下游宗主威望。若大举动员皇家旗团重骑挺进巴尔干十字路口，虽可锐不可当却使军费高企、商民承压；若借法典契机扶持布达与科希策王室自由市，则工艺与内阁效能齐升，代价是贵族势长且轻骑演武略缓。"
 oe_v250_mbp.5.a:0 "整肃皇家旗团重骑经略达尔马提亚与巴尔干"
 oe_v250_mbp.5.b:0 "申明《1351年法令》并广兴王室自由市镇"
 oe_v250_mbp.6.t:0 "龙骑士团与多瑙河基督教盾墙"
 oe_v250_mbp.6.d:0 "随着奥斯曼前锋频频叩击多瑙河下游，布达宫廷又面临大贵族同盟掣肘，匈牙利王冠正立于护卫基督教边疆的风口浪尖。若创立龙骑士团号召诸邦协防并严筑南疆要塞，可显著提升军纪、城防与外交威望，却带来沉重驻防与军费开销；若将边防总督权柄广授大贵族掌枢议会，虽能迅速扩充兵源并安抚贵族，却令王室集权大幅流失。"
 oe_v250_mbp.6.a:0 "创立龙骑士团并严守多瑙河基督教盾墙"
 oe_v250_mbp.6.b:0 "授命大贵族掌枢议会分领南疆诸边防总督区"
 oe_v250_mbp_ref_golden_fleece_court:0 "金羊毛宫廷与大公枢密院"
 oe_v250_mbp_ref_golden_fleece_court_desc:0 "将第戎与低地行宫打造成冠绝欧陆的骑士外交与市民礼仪中枢，显著提升威望、外交声誉与市民好感，代价则是奢华宫廷开支繁重且常备军费维护承压。"
 oe_v250_mbp_priv_flemish_cloth_charters:0 "佛兰德斯呢绒公会与市镇特许"
 oe_v250_mbp_priv_flemish_cloth_charters_desc:0 "向佛兰德斯、阿图瓦与勃艮第的织呢行会及市政议会保证古老自治特许与毛纺集散权，提振手工业产出与陆路商运，代价则是市民阶层权势坐大、商税上限下调并分薄大公直辖权。"
 oe_v250_mbp_cab_dijon_chancery:0 "第戎审计院与宫廷外交署"
 oe_v250_mbp_cab_dijon_chancery_desc:0 "统筹第戎审计院法务官与大公婚约使节往返巴黎与低地诸邦，提升外交声誉、内阁效能与文化影响力，同时加重宫廷财政负担并引起旧封建贵族不满。"
 oe_v250_mbp_cab_dijon_chancery_action:0 "第戎审计院与宫廷外交署"
 oe_v250_mbp_cab_dijon_chancery_active:0 "正在执行：第戎审计院与宫廷外交署"
 oe_v250_mbp_cab_dijon_chancery_action_progress:0 "执行中"
 oe_v250_mbp_cab_dijon_chancery_action_progress_wordier:0 "第戎审计院与宫廷外交署（执行中）"
 oe_v250_mbp_cab_dijon_chancery_action_progress_tooltip:0 "统筹第戎审计院法务官与大公婚约使节往返巴黎与低地诸邦，提升外交声誉、内阁效能与文化影响力，同时加重宫廷财政负担并引起旧封建贵族不满。"
 oe_v250_mbp_dec_low_countries_union.title:0 "敕立勃艮第-低地邦联枢密体制"
 oe_v250_mbp_dec_low_countries_union.desc:0 "以共同枢密院、统一币制与跨邦商法将第戎与低地诸公国伯国结为紧密邦联。耗费110金币，持续25年提升生产效率、外交声誉与附庸忠诚，代价是宫廷财政开支上升且市民阶层权势增强。"
 oe_v250_mbp_dec_low_countries_union.a:0 "钤印颁行勃艮第-低地邦联宪章"
 oe_v250_mbp_dec_low_countries_union_tt:0 "提升#Y 第戎#!发展度及#Y 博讷#!、#Y 布鲁日#!繁荣度，并在25年内施行#Y 勃艮第-低地邦联枢密体制#!。"
 oe_v250_mbp.7.t:0 "第戎公国与法德边疆的抉择"
 oe_v250_mbp.7.d:0 "第戎公国横跨索恩河两岸，介于法兰西瓦卢瓦王室与帝国领地弗朗什-孔泰、洛林之间，扼守西欧外交要冲。若经营独立自主的「中间王国」外交格局，可大幅提升勃艮第威望与诸邦声誉，却使宫廷开销加重并引来巴黎猜忌；若甘居法兰西首席武勋公爵，则重骑战力与贵族向心力俱增，代价是王权自制力与跨邦外交空间收窄。"
 oe_v250_mbp.7.a:0 "经营横跨索恩河与默兹河的独立勃艮第外交"
 oe_v250_mbp.7.b:0 "恪守法兰西首席武勋公爵之位以固贵族骑军"
 oe_v250_mbp.8.t:0 "勇敢的菲利普与佛兰德斯呢绒诸城"
 oe_v250_mbp.8.d:0 "与佛兰德斯伯国的联姻为勃艮第打开了布鲁日、根特与里尔富庶呢绒市镇的大门，但骄傲的佛兰德斯织工行会对大公税吏素怀戒心。若以宽厚商约礼遇织呢公会，可令手工业与北海海贸蒸蒸日上，代价是市民权势坐大与商税让利；若以第戎审计院强力统核公国税契，虽能提升税效与内阁效率，却会招致市民不满并增加维稳成本。"
 oe_v250_mbp.8.a:0 "确认佛兰德斯织呢公会特权并兴办北海商市"
 oe_v250_mbp.8.b:0 "将关税与账册统归第戎审计院集中稽核"
 oe_v250_mbp.9.t:0 "布鲁日交易所与金羊毛宫廷盛景"
 oe_v250_mbp.9.d:0 "佛罗伦萨银行家、佛兰德斯油画大师、复调乐师与北海毛商云集布鲁日与安特卫普交易所，在金羊毛旗帜下缔造北方文艺盛景。若将丰厚财赋倾注于宫廷艺术、学院资助与城镇繁华，可令文化传统、科研与繁荣度全面跃升，代价是宫廷与军费维保承压；若借低地金融信用组建常备勃艮第敕令军团，则军纪与士气大振，却须忍受沉重军饷与市民怨言。"
 oe_v250_mbp.9.a:0 "广庇佛兰德斯画坊、学者与金羊毛宫廷盛典"
 oe_v250_mbp.9.b:0 "借低地金融信用编练常备勃艮第敕令军团"
 oe_v250_mbp_ref_persianate_diwan:0 "波斯文官最高政事院体制"
 oe_v250_mbp_ref_persianate_diwan_desc:0 "延揽大不里士、巴格达、设拉子与伊斯法罕的资深波斯维齐尔与书记官重振伊尔汗政事院法度，显著提升内阁效能、文化传统与赋税效率，代价则是激怒自治部落埃米尔并推高国内维稳成本。"
 oe_v250_mbp_priv_silk_caravanserai_waqf:0 "丝路商驿与经学院瓦克夫特许"
 oe_v250_mbp_priv_silk_caravanserai_waqf_desc:0 "确认资助伊朗高原丝路砖砌商驿、经学院藏书阁与坎儿井修缮的瓦克夫善产免税特许，振兴陆上丝绸商运与学术传承，代价则是教士阶层权势攀升、教产税赋上限下调并分薄中枢集权。"
 oe_v250_mbp_cab_tabriz_diwan_audit:0 "大不里士政事院税册与坎儿井清查"
 oe_v250_mbp_cab_tabriz_diwan_audit_desc:0 "派遣最高政事院度支官与水利匠师赴目标行省重清田税册籍并疏浚坎儿井灌渠，提升地方控制、粮食产出、国家税效与内阁效率，却会招致部落酋长与地方显贵抵触。"
