 oe_v250_mbp_dec_claim_ilkhanate_throne.title:0 "继承大不里士伊尔汗大统"
 oe_v250_mbp_dec_claim_ilkhanate_throne.desc:0 "于伊朗高原大都宣告承继星散的伊尔汗国大统，改铸新银币并诏谕诸省埃米尔重申效忠。耗费100金币，持续25年提升王朝正统、中枢权威与轻骑战力，代价是维稳开支趋重且部落阶层心生忌惮。"
 oe_v250_mbp_dec_claim_ilkhanate_throne.a:0 "登御高原政事院正位大统"
 oe_v250_mbp_dec_claim_ilkhanate_throne_tt:0 "提升#Y 大不里士#!发展度及#Y 巴格达#!、#Y 设拉子#!繁荣度，并在25年内施行#Y 伊尔汗大统承继#!。"
 oe_v250_mbp.10.t:0 "伊尔汗冠冕星散与高原争雄"
 oe_v250_mbp.10.d:0 "不赛因汗绝嗣崩逝后，苏丹尼耶汗位悬空，札剌亦儿、出班、因朱与穆扎法尔诸豪强竞逐伊拉克、阿塞拜疆与法尔斯旧土。若延用拉施特时代波斯文官政事院重理赋税，虽能迅速恢复行政与岁入，却会触怒游牧部众并削弱轻骑锐气；若改以古老万户大纛号召蒙古-突厥那颜，虽得劲骑纵横与高昂士气，代价则是部落权势坐大且直征税效下滑。"
 oe_v250_mbp.10.a:0 "重振波斯文官政事院以统理城郭赋税"
 oe_v250_mbp.10.b:0 "高举万户旧纛号召蒙古-突厥那颜铁骑"
 oe_v250_mbp.11.t:0 "大不里士、设拉子与河中阴影"
 oe_v250_mbp.11.d:0 "从呼罗珊商路门户直至阿塞拜疆与法尔斯群山隘口，河中撒马尔罕强雄崛起的消息迫使高原霸主作出战略抉择。若严修山隘坚堡与攻城武库，可显著提升要塞防御与围城能力，却使城防维护沉重并拖累陆路商运；若优先保障撒马尔罕、设拉子与大不里士之间的丝绸通商，则陆贸与繁荣度节节攀升，代价是军心略趋松懈且中枢权威受抑。"
 oe_v250_mbp.11.a:0 "严固扎格罗斯与呼罗珊山隘坚堡并充实攻城武库"
 oe_v250_mbp.11.b:0 "护持撒马尔罕、设拉子与大不里士丝绸商路畅通"
 oe_v250_mbp.12.t:0 "设拉子与伊斯法罕的波斯文艺复兴"
 oe_v250_mbp.12.d:0 "即便历经王朝更迭与烽火动荡，设拉子、伊斯法罕、大不里士与撒马尔罕的琉璃庭院依然绽放出波斯诗歌、细密画坊、天文观象台与金工技艺的璀璨华光。若慷慨资助宫廷画院与经学院瓦克夫，可令文化传统、学术科研与城镇繁荣全面跃升，代价则是宫廷耗费高昂且教士势力增长；若收束城邦财力转铸严整王室卫戍军，虽能锻造强悍军纪与充沛兵源，却令市民怨望且军费吃紧。"
 oe_v250_mbp.12.a:0 "广兴宫廷细密画坊、观象台与经学院瓦克夫"
 oe_v250_mbp.12.b:0 "收束城郭财赋以整编精锐王室城堡驻军"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_chioggia_fleet:0 "基奥贾非常舰队征召"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_chioggia_fleet:0 "昼夜赶工的船坞征召铸就精锐地中海桨帆舰队，却令国库海军维保沉重且商民阶层疲于应付。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev1_muda_convoys:0 "国营黎凡特护航商船队"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev1_muda_convoys:0 "纪律严明的官办桨帆护航队与船坞流水线提振了海贸与造船速度，却推高舰队开销并削减陆地征召。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev1_private_consortia:0 "海外世家商团承包制"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev1_private_consortia:0 "自治世家商团拓宽了海外商运并充实关税进项，代价则是市民阶层权势坐大且商税上限下调。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev2_bond_syndicate:0 "世家公债银团财政"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev2_bond_syndicate:0 "统筹公债银团稳固了国库税效与海权投射，代价是市民债权集团势大并分薄中枢集权。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev2_war_customs:0 "非常桨帆战备关税"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev2_war_customs:0 "战时港埠附加税迅速武装了桨帆主力并振奋水师士气，却拖累海运商贸并招致市民阶层强烈不满。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev3_lazaretto_arsenal:0 "海港检疫所与本土防线"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev3_lazaretto_arsenal:0 "制度化海港检疫与船坞动员守护了本土城防、水手兵源与城镇繁荣，代价是海军维保繁重且税效承压。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev3_turin_compact:0 "都灵商贸和约秩序"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev3_turin_compact:0 "重开海路提振了海上商贸与外交声望，却令水师战斗意志回落且共和国威望衰减加快。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_danube_forts:0 "多瑙河边防要塞线"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_danube_forts:0 "驻防严密的多瑙河诸堡与边防总督区构筑起匈牙利南疆铁壁，但常年要塞维保与边防拨款持续消耗国库。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev4_kremnica_florin:0 "克雷姆尼察皇家金币本位"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev4_kremnica_florin:0 "享誉中欧的安茹金币本位提振了税效、矿产产出与陆路商运，代价则是贵族阶层怨望且维稳承压。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev4_carpathian_chambers:0 "喀尔巴阡大贵族矿务协约"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev4_carpathian_chambers:0 "与大贵族共分上匈牙利矿利换得阶层和睦与地方繁荣，代价是贵族势大并分薄王室集权。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev5_anjou_banners:0 "安茹皇家旗团大动员"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev5_anjou_banners:0 "披甲骑士旗团大幅强化了匈牙利重骑冲击力与野战士气，但高额军饷与征调令市民阶层承压。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev5_royal_free_towns:0 "王室自由市与1351年法典"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev5_royal_free_towns:0 "受王室庇护的市镇行会与成文法典提升了生产与内阁效能，代价是贵族势大且轻骑战备略趋松弛。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev6_dragon_bulwark:0 "龙骑士团多瑙河盾墙"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev6_dragon_bulwark:0 "龙骑士团的边防统御强化了军纪、要塞防御与基督教世界外交声望，代价则是要塞与陆军维护负担沉重。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev6_palatine_banates:0 "大贵族掌枢边防总督制"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev6_palatine_banates:0 "放权大贵族统领边区释放了可观兵源并换得贵族拥戴，却令贵族势大而王室直辖权柄受蚀。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_low_countries:0 "勃艮第-低地邦联体制"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_low_countries:0 "统一的大公枢密院将第戎庄园与低地呢绒商市紧密相连，提升生产、外交与附庸忠诚，代价则是宫廷维保高昂且市民权势扩大。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev7_lotharingian_poise:0 "洛塔林吉亚独立外交格局"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev7_lotharingian_poise:0 "纵横法德宫廷的独立使团大幅抬升了勃艮第威望与外交声誉，却推高宫廷支出并略微拖累税效。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev7_valois_peerage:0 "法兰西首席武勋骑士团"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev7_valois_peerage:0 "与巴黎王室的封建结盟强化了重骑战力并安抚贵族阶层，代价是公国集权受限且独立外交声望受抑。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev8_flemish_guilds:0 "佛兰德斯织呢公会协约"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev8_flemish_guilds:0 "受特许保护的呢绒商市大幅拉升手工业产出与海上贸易，却令市民阶层势大且商税上限收窄。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev8_chambre_comptes:0 "第戎审计院财政集权"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev8_chambre_comptes:0 "统一的大公财政稽核提升了赋税效率与内阁能力，却引发城镇行会不满并加重维稳开销。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev9_golden_fleece_splendor:0 "金羊毛宫廷文艺盛景"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev9_golden_fleece_splendor:0 "冠绝北方的宫廷赞助大幅提振了文化传统、科研速度与城镇繁荣，却令宫廷开支与军队维持费双双吃紧。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev9_ordinance_companies:0 "勃艮第常备敕令军团"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev9_ordinance_companies:0 "高薪供养的诸兵种常备敕令军团显著增强了军纪与士气，代价则是陆军维保昂贵且商民颇有怨言。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_ilkhanate_throne:0 "伊尔汗大统承继"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_ilkhanate_throne:0 "承袭伊尔汗旧都法统抬升了王朝正统、中枢集权与轻骑声威，却令各地游牧部落躁动并推高维稳成本。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev10_diwan_revival:0 "波斯文官政事院复兴"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev10_diwan_revival:0 "精明练达的城郭文官与税籍官僚重振了内阁效能与岁入，却令草原部落怨望且轻骑战备走弱。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev10_noyan_tumens:0 "那颜万户铁骑同盟"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev10_noyan_tumens:0 "动员草原那颜骑军显著提升了轻骑威力与野战士气，代价则是部落权势膨胀且中央税效受损。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev11_plateau_bastions:0 "伊朗高原山隘堡垒网"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev11_plateau_bastions:0 "加固的高原山城与攻城作坊大幅提升了领土防御与围城效率，代价则是要塞维保沉重且商旅通行放缓。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev11_transoxiana_caravans:0 "河中-大不里士丝路通商"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev11_transoxiana_caravans:0 "贯通高原的丝路协约显著提振陆上商贸与地方繁荣，代价是行伍锐气回落且中央集权稍显松弛。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev12_persian_ateliers:0 "波斯宫廷画院与经学盛世"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev12_persian_ateliers:0 "蓬勃兴盛的细密画坊与观象经学院显著提振了文化传统、科研与繁荣度，代价是宫廷财政承压且教士势力上升。"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev12_citadel_garrisons:0 "高原王室城堡卫戍精锐"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev12_citadel_garrisons:0 "收归城郭财赋组建的常备城堡卫戍显著强化了军纪与兵源，代价则是市民阶层不满且陆军维持费走高。"
