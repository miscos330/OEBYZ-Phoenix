# NEW 2026-11-22 v13.5 Worker 3: Unit Abilities, Eurasian Town Rights, Regencies & Shinto Factions. Generated by gen_v135_institutions.py; edit the generator, not this file.
 oe_ua_greek_fire_siphon: "希腊火虹吸突袭"
 oe_ua_greek_fire_siphon_desc: "为舰队中的德罗蒙桨帆船装配青铜加压虹吸管与秘制石脑油火罐，以高昂的燃剂与维护消耗换取压倒性的近海火攻与封锁威力。"
 oe_ua_wagenburg_tabor: "战车大营宿营"
 oe_ua_wagenburg_tabor_desc: "仿效波西米亚胡斯战车堡与草原哥萨克大营之制，以铁链首尾相扣连车结垒，大幅削减行军机动以换取稳固的阵地纪律、士气恢复与损耗减免。"
 oe_ua_geobukseon_ram: "龟船铁甲破阵"
 oe_ua_geobukseon_ram_desc: "编组覆顶铁钉龟船与板屋战船作为先锋尖阵，以较重的船体吃水与维护花费换取凌厉的近海接舷先手与侧舷炮击威力。"
 oe_ua_eight_banner_charge: "八旗铁骑突贯"
 oe_ua_eight_banner_charge_desc: "按女真八旗与草原万户旧法以巴图鲁重骑居中破阵、轻骑两翼包抄，承受更高的马匹损耗与粮草开销，换取雷霆般的骑兵突击与交战速度。"
 oe_ua_sandan_uchi_volley: "铁炮三段击齐射"
 oe_ua_sandan_uchi_volley_desc: "依托拒马木栅将铁炮足轻分为三列交替装填齐射，以大量火药铅弹消耗和较慢行军速度换取绵密不绝的步兵火力与阵型纪律。"
 oe_ua_furusiyya_lance_drill: "骑士道长矛操演"
 oe_ua_furusiyya_lance_drill_desc: "依照马穆鲁克与伊斯兰世界《骑士道武经》在马场展开长矛刺击、马弓回射与阵型演练；操演期间全额耗饷且临时降低战备士气，但能迅猛淬炼部队经验与骑兵先手。"
 oe_ua_lagimci_sapper_assault: "坑道工兵爆破围城"
 oe_ua_lagimci_sapper_assault_desc: "编派专职矿工与坑道爆破队掘进城墙地基、配合重炮轰击缺口，虽加剧围城损耗与工程开支，却能显著加快攻坚进度与强袭破城效率。"
 oe_ua_galeazza_broadside: "巨型桨帆侧舷齐射"
 oe_ua_galeazza_broadside_desc: "仿效威尼斯勒班陀巨型武装桨帆船战术，以高耸火炮甲板组成海上浮堡前出压阵，牺牲舰队机动并提高维护开销，换取重舰与桨帆协同的毁灭性侧舷齐射。"
 oe_tr_samarkand_caravanserai: "河中丝路大驿市宪章"
 oe_tr_samarkand_caravanserai_desc: "在撒马尔罕或布哈拉颁行驼队大驿市特许宪章，免除过境丝绸与商帮的重复厘金，巩固河中绿洲作为欧亚陆路商道枢纽的地位。"
 oe_tr_kashgar_oasis_entrepot: "天山南路绿洲商栈宪章"
 oe_tr_kashgar_oasis_entrepot_desc: "授予喀什噶尔及天山南路、河西走廊绿洲重镇官方坎儿井水利与商栈保税特权，招徕四方商旅定居并疏通南北丝路货流。"
 oe_tr_persian_grand_bazaar: "大巴扎御准商馆宪章"
 oe_tr_persian_grand_bazaar_desc: "在大不里士、伊斯法罕或赫拉特设立御准穹顶大巴扎与行会商会，集中细织锦缎与名贵颜料工坊，增强本土市民行会的商业权能。"
 oe_tr_novgorod_fur_guild: "北方毛皮与蜡商宪章"
 oe_tr_novgorod_fur_guild_desc: "承袭大诺夫哥罗德圣约翰百人商会传统，授予诺夫哥罗德、莫斯科或阿斯特拉罕毛皮、蜂蜡与内河商栈集散特许权。"
 oe_tr_jiangnan_silk_shizhen: "江南丝织专业市镇宪章"
 oe_tr_jiangnan_silk_shizhen_desc: "于苏州吴县、杭州或南京上元颁行江南丝织市镇与机户行规宪章，保障三织造与民间绸缎机坊并行兴旺，推高江南丝织与细布产能。"
 oe_tr_fuliang_imperial_kiln: "景德镇浮梁御窑瓷都宪章"
 oe_tr_fuliang_imperial_kiln_desc: "在浮梁景德镇推行官搭民烧与御器厂督陶宪章，汇聚天下陶工、画瓷名匠与高岭土矿脉，令瓷都产能与文化声望冠绝寰宇。"
 oe_tr_shibosi_maritime_ward: "市舶司番坊通商宪章"
 oe_tr_shibosi_maritime_ward_desc: "在泉州晋江、广州、福州闽县、宁波鄞县或香山澳门设立市舶司与番坊怀远驿，以规范抽分与港湾泊位管理统筹南海与东海贸易。"
 oe_tr_sakai_egoshu_council: "堺港会合众自治市宪章"
 oe_tr_sakai_egoshu_council_desc: "承认和泉堺港、博多或西彼杵长崎豪商“会合众”的环濠自治与铁炮锻冶特许，以市民自治换取高产火器锻坊、良港吞吐与稳固城防。"
 oe_tr_venetian_fondaco: "威尼斯德意志商馆宪章"
 oe_tr_venetian_fondaco_desc: "在威尼斯颁行德意志商馆（Fondaco dei Tedeschi）与穆拉诺玻璃行会特许宪章，统筹阿尔卑斯北麓陆路货流与黎凡特海上贸易。"
 oe_tr_hanseatic_staple_kontor: "汉萨自由港与货栈宪章"
 oe_tr_hanseatic_staple_kontor_desc: "在吕贝克或格但斯克确认汉萨同盟集散法与商馆货栈特许，扩大船材沥青供给与波罗的海港湾转运席位。"
 oe_tr_lowlands_bourse_charter: "低地交易所与舆图印坊宪章"
 oe_tr_lowlands_bourse_charter_desc: "在阿姆斯特丹或安特卫普授予证券商品交易所与精密舆图印书坊自由宪章，汇聚西欧金融资本、印刷典籍与新思潮。"
 oe_tr_pontic_aegean_entrepot: "黑海-爱琴海转运港宪章"
 oe_tr_pontic_aegean_entrepot_desc: "在卡法、塞萨洛尼基或亚历山大港推行黑海—爱琴海—尼罗河三角洲联运关税宪章，畅通粮食、丝绸与香料的东地中海海陆中转。"
 oe_tr_calicut_monsoon_emporium: "卡利卡特季风香料自由港宪章"
 oe_tr_calicut_monsoon_emporium_desc: "在卡利卡特（科泽科德）或果阿颁布季风季节万商平等互市宪章，保障阿拉伯、古吉拉特、马来与泰西船队公平购销马拉巴尔黑胡椒。"
 oe_tr_malacca_shahbandar_port: "马六甲万国船长宪章"
 oe_tr_malacca_shahbandar_port_desc: "在马六甲分设四方港务总管（Shahbandar）并颁行《马六甲海商法典》，井然调度东西两洋季风商船与丁香香料转口贸易。"
 oe_tr_hormuz_aden_strait_port: "海峡咽喉真珠与香料港宪章"
 oe_tr_hormuz_aden_strait_port_desc: "在霍尔木兹或亚丁实施海峡海关保税与礁岛防务宪章，统筹波斯湾真珠首饰加工、红海香料集散与扼守要冲的水师锚地。"
 oe_tr_swahili_aztec_lake_charter: "基尔瓦黄金海市与奇南帕浮田宪章"
 oe_tr_swahili_aztec_lake_charter_desc: "在基尔瓦珊瑚岛黄金海市或特诺奇蒂特兰奇南帕湖心大市颁布王室市政特许，以精细的堤道、集市与行政管控催生跨大洋奇观级都城繁荣。"
 oe_reg2_venetian_dieci_regency: "十人委员会紧急摄政"
 oe_reg2_venetian_dieci_regency_desc: "总督出缺或政局危急之际，威尼斯共和国十人委员会紧急执掌秘枢与城防，在维护共和法统的同时确保政务不坠。"
 oe_reg2_curtain_dowager_regency: "太后垂帘听政"
 oe_reg2_curtain_dowager_regency_desc: "幼帝冲龄即位之际，皇太后临朝称制、垂帘听政，居中维系宗室法统与藩属向心力，稳步过渡至新君亲政。"
 oe_reg2_guming_council_regency: "顾命八大臣辅政"
 oe_reg2_guming_council_regency_desc: "先帝遗诏托孤于资深顾命重臣，由辅政议政大臣合议立法理政，虽略损皇权独尊却维系朝廷运转有度。"
 oe_reg2_shogun_tairo_regency: "幕府大老摄政"
 oe_reg2_shogun_tairo_regency_desc: "幕府将军幼弱之际，由谱代重臣出任大老统摄评定众与诸藩武家，以威望与武德维系幕藩秩序不乱。"
 oe_reg2_ottoman_valide_regency: "苏丹母后摄政"
 oe_reg2_ottoman_valide_regency_desc: "废止残酷的弑兄继承旧法后，苏丹母后得以凭后宫与迪万枢密院的联结稳健监国，以外交手腕与内政统筹安抚帝国诸省。"
 oe_reg2_polish_interrex_regency: "首席大主教摄政"
 oe_reg2_polish_interrex_regency_desc: "王位虚悬或幼主监国之时，格涅兹诺首席大主教依法出任摄政大司铎（Interrex），斡旋众议院、教阶与外邦使节。"
 oe_reg2_persian_atabeg_regency: "阿塔贝格军事监护摄政"
 oe_reg2_persian_atabeg_regency_desc: "由久经沙场的阿塔贝格大将兼任幼主太傅与监国统帅，以重骑军功威慑四境强邻，但也助长武人勋贵的势焰。"
 oe_reg2_balkan_patriarch_synkletos_regency: "牧首与元老联合监国"
 oe_reg2_balkan_patriarch_synkletos_regency_desc: "正教牧首与贵族元老联署监国，依托圣堂教会威信与传统法度凝聚军民，守望皇统与城邦疆界。"
 oe_shinto_yoshida: "吉田神道（唯一神道）"
 oe_shinto_yoshida_desc: "由京都吉田兼俱创立的唯一神道宗派，以“神本、儒枝、佛果”反本地垂迹之说重塑神道主体地位，并借颁授全国神社神阶状确立神祇官权威。"
 oe_shinto_watarai: "度会神道（伊势外宫）"
 oe_shinto_watarai_desc: "伊势神宫外宫度会神官家传承的古典神道学派，依《神道五部书》倡言“清净正直”与丰受大神祈年农桑之道，重内省明德而惠及黎庶。"
 oe_shinto_suika: "垂加神道（朱子神道）"
 oe_shinto_suika_desc: "由山崎闇斋融贯朱子理学与古典神道而成的经世宗派，以“敬义内外”砥砺武家忠义伦常、尊崇王室大义并兴办藩校讲学。"
 oe_shinto_ryobu: "两部神道（神佛习合）"
 oe_shinto_ryobu_desc: "依托真言密宗金刚、胎藏两界曼荼罗诠释伊势内外宫的传统神佛习合流派，主张“本地垂迹”神佛共融，联络各大寺社共兴教化与寺领经济。"
 oe_act_yoshida_shrine_license: "颁授全国神社神阶状"
 oe_act_yoshida_shrine_license_desc: "经吉田神祇管领长上核定诸国神社神阶与神职袍服裁许状，使神道祭祀体系与朝廷文官枢密更为严整有序。"
 oe_act_yoshida_root_doctrine: "弘扬“神本儒枝佛果”说"
 oe_act_yoshida_root_doctrine_desc: "尊奉吉田唯一神道“神本、儒枝、佛果”之教义，确立神道主导地位（与两部神道本地垂迹路线互斥），涵养清净纯洁与本邦文化传统。"
 oe_act_yoshida_court_ritual: "朝廷大尝祭司礼"
 oe_act_yoshida_court_ritual_desc: "延请吉田神官主掌朝廷大尝祭与镇魂古礼，即时彰显国威清净并在随后数年持续振奋朝堂声望与武家荣誉。"
 oe_act_watarai_inner_purity: "奉行《神道五部书》清净正直"
 oe_act_watarai_inner_purity_desc: "依伊势外宫《神道五部书》训诫群臣澄心去妄、以清净正直理政，持续充盈神道纯洁度并稳固社稷治安。"
 oe_act_watarai_harvest_blessing: "伊势丰受大神丰穰祈年"
 oe_act_watarai_harvest_blessing_desc: "于伊势外宫奉祀掌管衣食农桑的丰受大神，广施祈年神符以安抚乡野庶民并提振全国营造效率。"
 oe_act_suika_samurai_ethics: "武家“敬义忠君”讲学"
 oe_act_suika_samurai_ethics_desc: "邀集垂加神道讲师巡行诸藩宣讲“持敬集义”之道，锤炼军纪纪律、砥砺武士荣誉并推进全国识字教化。"
 oe_act_suika_imperial_loyalty: "尊王大义申明"
 oe_act_suika_imperial_loyalty_desc: "以垂加神道名分大义训谕诸侯家臣，明辨君臣纲常，显著抬升朝廷正统性与全体属国忠诚度。"
 oe_act_suika_academy_grant: "垂加学派藩校津贴"
 oe_act_suika_academy_grant_desc: "拨款兴建垂加学派书院与刊经讲堂，兼修汉籍经史与本邦神典，加速学术科研进度并提高全国识字上限。"
 oe_act_ryobu_honji_suijaku: "奉行“本地垂迹”神佛共融"
 oe_act_ryobu_honji_suijaku_desc: "推行两部神道“本地垂迹”神佛习合路线（与吉田神本说互斥），包容异派宗门并广得僧侣与神官阶层的敬悦支持。"
 oe_act_ryobu_monastic_patronage: "资助两界密宗大寺"
 oe_act_ryobu_monastic_patronage_desc: "施舍田租与商市护持真言两界密宗大寺及门前町市集，活络全国商埠贸易中心势力并借法会祈福抚平战火疲惫。"
 oe_price_shinto_low: "神道祭仪薄礼"
 oe_price_shinto_medium: "神道社格常规祭资"
 oe_price_shinto_high: "神道大祭重礼"
 oe_price_shinto_doctrine: "神道立宗宣教祭资"
 STATIC_MODIFIER_NAME_oe_shinto_yoshida_license_mod: "吉田神阶裁许令"
 STATIC_MODIFIER_DESC_oe_shinto_yoshida_license_mod: "诸国神社皆依吉田神祇官核定神阶奉祀，朝廷中枢理政与王室法统随之倍增威仪。"
 STATIC_MODIFIER_NAME_oe_shinto_yoshida_doctrine_mod: "唯一神道·神本之教"
 STATIC_MODIFIER_DESC_oe_shinto_yoshida_doctrine_mod: "朝野共奉“神本、儒枝、佛果”之义，神道纯粹气象与本邦礼乐传统日臻深厚。"
 STATIC_MODIFIER_NAME_oe_shinto_yoshida_ritual_mod: "大尝祭盛典余辉"
 STATIC_MODIFIER_DESC_oe_shinto_yoshida_ritual_mod: "庄严的朝廷大尝祭司礼令四海归心，持续增进国家声望与武家荣誉。"
 STATIC_MODIFIER_NAME_oe_shinto_watarai_purity_mod: "五部书清净正直之风"
 STATIC_MODIFIER_DESC_oe_shinto_watarai_purity_mod: "官民效法伊势外宫清净正直之训，内修明德而社会秩序安澜。"
 STATIC_MODIFIER_NAME_oe_shinto_watarai_harvest_mod: "丰受大神祈年福荫"
 STATIC_MODIFIER_DESC_oe_shinto_watarai_harvest_mod: "伊势外宫祈年大典深孚农桑人心，民间怨气平息且各项兴建事半功倍。"
 STATIC_MODIFIER_NAME_oe_shinto_suika_ethics_mod: "垂加武家敬义讲学"
 STATIC_MODIFIER_DESC_oe_shinto_suika_ethics_mod: "垂加神道讲学将持敬集义融入军旅与藩士教化，令士卒纪律严明、荣誉卓著且文风日盛。"
 STATIC_MODIFIER_NAME_oe_shinto_suika_loyalty_mod: "垂加尊王大义宣谕"
 STATIC_MODIFIER_DESC_oe_shinto_suika_loyalty_mod: "尊王名分大义深入诸藩人心，主君正统巍然不动而附庸诸邦倍加驯服。"
 STATIC_MODIFIER_NAME_oe_shinto_suika_academy_mod: "垂加藩校书院兴学"
 STATIC_MODIFIER_DESC_oe_shinto_suika_academy_mod: "获颁津贴的垂加藩校遍布各领，研习经史神典并持续推高识字上限与科研步伐。"
 STATIC_MODIFIER_NAME_oe_shinto_ryobu_honji_mod: "两部神道·本地垂迹"
 STATIC_MODIFIER_DESC_oe_shinto_ryobu_honji_mod: "神佛同源、本地垂迹的宽容教义弥合宗门分歧，深得各大寺社僧侣与神职拥护。"
 STATIC_MODIFIER_NAME_oe_shinto_ryobu_monastic_mod: "密宗大寺门前町护持"
 STATIC_MODIFIER_DESC_oe_shinto_ryobu_monastic_mod: "两界密宗大寺的门前町商市与镇护法会相辅相成，助长商埠势力并抚慰军民倦战之心。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_dieci_legacy_mod: "十人委员会还政余荫"
 STATIC_MODIFIER_DESC_oe_inst_reg2_dieci_legacy_mod: "十人委员会圆满结束紧急监国并交还总督权柄，共和国档案机制与元老秩序愈发稳健。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_curtain_legacy_mod: "撤帘归政盛仪"
 STATIC_MODIFIER_DESC_oe_inst_reg2_curtain_legacy_mod: "皇太后依礼撤帘还政，新君亲政之初即承接稳固的朝堂正统与恭顺的藩属体系。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_guming_legacy_mod: "顾命辅政章程遗泽"
 STATIC_MODIFIER_DESC_oe_inst_reg2_guming_legacy_mod: "顾命大臣在辅政期间订立的成宪与部院规程延续生效，助益新君高效施行新法。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_tairo_legacy_mod: "大老监国威仪遗泽"
 STATIC_MODIFIER_DESC_oe_inst_reg2_tairo_legacy_mod: "大老平稳移交幕政后，谱代与外样诸侯仍感佩其纲纪威信，恪守武家礼法。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_valide_legacy_mod: "母后监国外交遗泽"
 STATIC_MODIFIER_DESC_oe_inst_reg2_valide_legacy_mod: "苏丹母后执政期间经营的使节网络与宫廷善政延续数年，为成年苏丹铺平外交与内治坦途。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_interrex_legacy_mod: "大司铎摄政祝圣遗泽"
 STATIC_MODIFIER_DESC_oe_inst_reg2_interrex_legacy_mod: "格涅兹诺大主教为新王加冕祝圣后，教俗和睦与王国的外交声誉随之持久稳固。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_atabeg_legacy_mod: "阿塔贝格铁骑遗风"
 STATIC_MODIFIER_DESC_oe_inst_reg2_atabeg_legacy_mod: "阿塔贝格监国期间悉心操练的重骑亲军与兵法传统仍在行伍间历久弥新。"
 STATIC_MODIFIER_NAME_oe_inst_reg2_synkletos_legacy_mod: "牧首元老护国遗泽"
 STATIC_MODIFIER_DESC_oe_inst_reg2_synkletos_legacy_mod: "牧首与元老院交还御印后，军民共守圣堂与疆域的凝聚力依然充盈四境。"
 STATIC_MODIFIER_NAME_oe_inst_shinto_yoshida_shrine_charter_mod: "吉田斋场所神道宪章"
 STATIC_MODIFIER_DESC_oe_inst_shinto_yoshida_shrine_charter_mod: "在京都吉田山斋场所重申唯一神道祭祀规仪，强化神官教阶组织与纯洁修持。"
 STATIC_MODIFIER_NAME_oe_inst_shinto_ryobu_mandala_accord_mod: "两界曼荼罗寺社和约"
 STATIC_MODIFIER_DESC_oe_inst_shinto_ryobu_mandala_accord_mod: "高野山密宗与诸国神宫共署和约，以神佛习合艺文与宽容气象润泽天下。"
 oe_inst.1.t: "十人委员会执掌秘枢"
 oe_inst.1.d: "总督权位骤悬，泻湖内外流言四起。威尼斯大议会依古制授权十人委员会紧急监国，查封机密卷宗、调遣兵工厂守备，确保海上共和国的商道与元老法统安然无恙。"
 oe_inst.1.a: "授权秘枢委员会严整政务与账簿"
 oe_inst.1.a.tt: "稳固共和传统并强化十人委员会紧急理政遗泽。"
 oe_inst.1.b: "安抚大议会商贾家族与市民行会"
 oe_inst.1.b.tt: "提振市民阶层满意度并稳固城邦治安。"
 oe_inst.2.t: "太后临朝·垂帘听政"
 oe_inst.2.d: "幼主冲龄登极，丹陛之前垂下明黄纱帘。皇太后依礼法临朝称制，召见内阁辅臣与宗室亲王，宣谕四海恪守成宪、毋使边陲与藩邦生隙。"
 oe_inst.2.a: "严守祖制礼法，以母仪稳固法统"
 oe_inst.2.a.tt: "提升正统性并展现垂帘听政的朝堂威信。"
 oe_inst.2.b: "恩谕外朝重臣与诸路藩镇协理国政"
 oe_inst.2.b.tt: "增进贵族阶层满意度并稳固全国稳定度。"
 oe_inst.3.t: "遗诏托孤·顾命重臣辅政"
 oe_inst.3.d: "宫闱未有太后临朝，先帝临终手敕召资深顾命大臣入直枢密，同受托孤重任。众辅臣联署章程，分理钱粮、刑名与边防军务，静候幼君长成。"
 oe_inst.3.a: "明定辅政条格，以法度约束中枢"
 oe_inst.3.a.tt: "以成文辅政章程提高立法与内阁效率。"
 oe_inst.3.b: "厚赐宗室勋旧以安众心"
 oe_inst.3.b.tt: "安抚贵族阶层并维护君主正统威望。"
 oe_inst.4.t: "谱代宿老出任幕府大老"
 oe_inst.4.d: "幕府嗣主尚幼，诸藩观望。评定众推举德高望重的谱代宿老出任大老，坐镇本丸总揽政令、审理大名参勤与城郭防务，以维系武家秩序不坠。"
 oe_inst.4.a: "以武家法度严束诸藩并彰显大老威仪"
 oe_inst.4.a.tt: "彰扬武家威望并稳固幕府对属国与大名的统御。"
 oe_inst.4.b: "召见谱代家臣共议政事以固人心"
 oe_inst.4.b.tt: "提升武士贵族满意度并稳固国本。"
 oe_inst.5.t: "苏丹母后执掌帝国迪万"
 oe_inst.5.d: "旧日血腥的弑兄继承已成过往。新苏丹冲龄御极之际，苏丹母后自深宫垂谕，与大维齐尔及迪万重臣协同理政，一面遣使修睦列强，一面整饬行省税册。"
 oe_inst.5.a: "广遣使节修睦四邻并整饬迪万文书"
 oe_inst.5.a.tt: "提升正统性并彰显母后监国的外交与内政手腕。"
 oe_inst.5.b: "布施慈善瓦克夫基金以安抚教法学者与百姓"
 oe_inst.5.b.tt: "增进教士阶层满意度并稳固国内治安。"
 oe_inst.6.t: "格涅兹诺大主教出任摄政大司铎"
 oe_inst.6.d: "王冠暂缺主持，王国依古老宪章由首席大主教就任摄政大司铎（Interrex）。他手执御印召集议会、接见外邦特使，并在教俗两界之间居中调停，维系联邦与王国法统。"
 oe_inst.6.a: "由大司铎居中斡旋教廷与列强外交"
 oe_inst.6.a.tt: "提升宗教影响力并强化王国的外交声望。"
 oe_inst.6.b: "确认教阶与贵族议会的传统特权"
 oe_inst.6.b.tt: "提升教士阶层满意度并巩固国内安定。"
 oe_inst.7.t: "阿塔贝格大将奉命监国护嗣"
 oe_inst.7.d: "高原与两河烽烟未息，幼君难当军政重任。威望卓著的阿塔贝格老将腰悬弯刀入主王庭，一面教习嗣君骑射兵法，一面亲自统领重骑兵团震慑觊觎王土的邻邦。"
 oe_inst.7.a: "校阅王室重骑并严整行伍军纪"
 oe_inst.7.a.tt: "提升陆军传统并强化重骑突击威势。"
 oe_inst.7.b: "赐宴诸部埃米尔以安抚封疆武贵"
 oe_inst.7.b.tt: "安抚贵族阶层并略微稳固朝政。"
 oe_inst.8.t: "牧首与元老院联署监国"
 oe_inst.8.d: "幼主尚未成年，大教堂钟声回荡山城。正教牧首与贵族元老在圣像前共同宣誓监国，誓以圣堂祈祷、法典成宪与坚城守备护卫王统直至嗣君加冕亲政。"
 oe_inst.8.a: "以圣堂威望号召军民固守城防与法统"
 oe_inst.8.a.tt: "增加宗教影响力并强化牧首元老护国防务遗泽。"
 oe_inst.8.b: "分谕修道院与乡绅贵族共济时艰"
 oe_inst.8.b.tt: "提升教士阶层满意度并稳固国本。"
 oe_inst.9.t: "吉田斋场所颁行“唯一神道”大义"
 oe_inst.9.d: "吉田山斋场所八角太元宫内香火肃穆。吉田宗派宣读“神本、儒枝、佛果”之新疏，号召全国神社摆脱佛寺附庸、回归太古神道清净本源，各地神职莫不震动响应。"
 oe_inst.9.a: "钦定斋场所神道宪章，弘扬纯洁神祭"
 oe_inst.9.a.tt: "增益纯洁度并颁行五年期吉田斋场所神道宪章。"
 oe_inst.9.b: "将吉田礼法与朝廷威仪并行宣谕诸国"
 oe_inst.9.b.tt: "提升国家威望并安抚神官教阶。"
 oe_inst.10.t: "两界曼荼罗与神佛习合盛典"
 oe_inst.10.d: "金刚界与胎藏界两幅巨幅曼荼罗高悬殿中，密宗高僧与神宫大祝并肩诵经祈福。朝廷重申“本地垂迹”神佛共融国策，令名山大寺与古老神社重归和衷共济。"
 oe_inst.10.a: "缔结两界曼荼罗寺社和约，广兴神佛艺文"
 oe_inst.10.a.tt: "稳固治安并颁行五年期两界曼荼罗寺社和约。"
 oe_inst.10.b: "嘉奖护法大寺高僧与神官代表"
 oe_inst.10.b.tt: "增进教士阶层满意度并提升威望。"
