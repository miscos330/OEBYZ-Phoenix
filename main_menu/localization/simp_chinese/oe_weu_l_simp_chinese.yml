 oe_weu_b_holy_league_hostile: "反罗马神圣同盟敌视"
 oe_weu_b_lily_accord: "双鹰—百合反哈布斯堡密约"
 oe_weu_b_gallic_betrayal: "背约犯高卢之仇"
 oe_weu_b_anglo_maritime: "英拜海上通商条约"
 oe_weu_b_lowlands_credit: "阿姆斯特丹商贷与航运默契"
 oe_weu_b_ecumenical_detente: "普世宗教宽容斡旋"
 STATIC_MODIFIER_NAME_oe_weu_atlantic_diversion: "绕道好望角危机：地中海商路分流"
 STATIC_MODIFIER_DESC_oe_weu_atlantic_diversion: "伊比利亚与大西洋诸强开辟绕道非洲南端的远洋航线，传统地中海转口商税与行商势能显著流失，亟待借运河或丝路商社发起反击。"
 STATIC_MODIFIER_NAME_oe_weu_western_embargo_mod: "西欧反罗马神圣同盟贸易封锁"
 STATIC_MODIFIER_DESC_oe_weu_western_embargo_mod: "阿尔卑斯以西的天主教列强联手封锁商埠、抵制罗马行商并孤立君士坦丁堡使团，可通过分化法英或宗教妥协打破封锁。"
 STATIC_MODIFIER_NAME_oe_weu_crusade_pressure_mod: "大西洋—神罗总动员战略施压"
 STATIC_MODIFIER_DESC_oe_weu_crusade_pressure_mod: "西欧反罗马神圣同盟凝聚至极点，全欧战备与海上封锁迫使帝国大幅追加海陆常备军费并承受外交孤立。"
 STATIC_MODIFIER_NAME_oe_weu_league_member_mod: "反罗马神圣同盟联防协约"
 STATIC_MODIFIER_DESC_oe_weu_league_member_mod: "西欧同盟成员协同构筑阿尔卑斯与西地中海防线，海陆军士气与城防大增，但联防驻军开支沉重。"
 STATIC_MODIFIER_NAME_oe_weu_gallic_mobilization: "高卢卫国总动员"
 STATIC_MODIFIER_DESC_oe_weu_gallic_mobilization: "东罗马背弃双鹰—百合协约、染指里昂与高卢腹地，激起全法兰西上下的悲壮抗战狂潮，士气、纪律与兵源激增而财政承压。"
 STATIC_MODIFIER_NAME_oe_weu_alpine_watch_mod: "阿尔卑斯山隘常备防线"
 STATIC_MODIFIER_DESC_oe_weu_alpine_watch_mod: "在伦巴第与皮埃蒙特一线加固要塞、轮驻精锐军团以威慑西欧联军，纪律与防御提升而陆军维持费上升。"
 STATIC_MODIFIER_NAME_oe_weu_diplomatic_wedge_mod: "西欧外交离间密网"
 STATIC_MODIFIER_DESC_oe_weu_diplomatic_wedge_mod: "向巴黎、伦敦与阿姆斯特丹广派密使并资助反哈布斯堡派系，外交声誉与商力增长，但秘密外交津贴消耗国库税入。"
 STATIC_MODIFIER_NAME_oe_weu_lily_accord_mod: "双鹰—百合反哈布斯堡协约"
 STATIC_MODIFIER_DESC_oe_weu_lily_accord_mod: "君士坦丁堡与巴黎缔结秘密默契：罗马止步阿尔卑斯并共分西地中海商利，双方携手遏制哈布斯堡霸权，但须克制西方威望宣示。"
 STATIC_MODIFIER_NAME_oe_weu_gaul_ambition_mod: "越阿尔卑斯西进军纲"
 STATIC_MODIFIER_DESC_oe_weu_gaul_ambition_mod: "拒绝以条约束缚罗马铁骑，誓以刀锋直指高卢与伊比利亚旧省，军威赫赫但立刻招致西欧各国全面猜忌与军费高企。"
 STATIC_MODIFIER_NAME_oe_weu_habsburg_containment_mod: "维也纳—马德里反罗马铁幕"
 STATIC_MODIFIER_DESC_oe_weu_habsburg_containment_mod: "奥地利与伊比利亚王室以多瑙河与西地中海为轴构筑天主教防线，纪律、城防与外交号召力上升而维持费加重。"
 STATIC_MODIFIER_NAME_oe_weu_danube_bastion_mod: "多瑙河—亚得里亚双线壁垒"
 STATIC_MODIFIER_DESC_oe_weu_danube_bastion_mod: "沿多瑙河中游与意大利北疆建立纵深要塞带，抵御哈布斯堡陆海夹击，防务与士气强化而军费开支攀升。"
 STATIC_MODIFIER_NAME_oe_weu_anglo_maritime_mod: "英拜海上通商条约"
 STATIC_MODIFIER_DESC_oe_weu_anglo_maritime_mod: "伦敦与君士坦丁堡互授商港特许、携手破除伊比利亚大西洋垄断，商收、商力与海军士气俱增，但须负担远洋护航维护。"
 STATIC_MODIFIER_NAME_oe_weu_med_corsair_check_mod: "西地中海常备护航舰队"
 STATIC_MODIFIER_DESC_oe_weu_med_corsair_check_mod: "不借外邦船队，由帝国水师独立巡弋西西里与直布罗陀航道，造船提速且海军斗志昂扬，但船坞与水师维护高昂。"
 STATIC_MODIFIER_NAME_oe_weu_lowlands_arbitrage_mod: "阿姆斯特丹商贷与低地转口"
 STATIC_MODIFIER_DESC_oe_weu_lowlands_arbitrage_mod: "借助尼德兰交易所、远洋货船与新教商帮绕开天主教封锁，商收与思潮加速传播，但关税让利与教士保守派微词随之而来。"
 STATIC_MODIFIER_NAME_oe_weu_imperial_customs_wall: "帝国专卖署与关税壁垒"
 STATIC_MODIFIER_DESC_oe_weu_imperial_customs_wall: "对西欧商船课以对等高额关税并收紧港务管控，直接税效与行省控制力提升，却令商流萎缩、市民行会不满。"
 STATIC_MODIFIER_NAME_oe_weu_ecumenical_detente_mod: "对西普世宗教宽容敕令"
 STATIC_MODIFIER_DESC_oe_weu_ecumenical_detente_mod: "以教会宽容与古礼互认瓦解反罗马神圣同盟的十字军号召，外交声誉与异派容忍显著提升，却激起国内正教保守教士强烈反弹。"
 STATIC_MODIFIER_NAME_oe_weu_orthodox_bulwark_mod: "正教正统不可妥协之盾"
 STATIC_MODIFIER_DESC_oe_weu_orthodox_bulwark_mod: "断然拒绝向拉丁教廷低头，凝聚全国正教军民同仇敌忾，正教容忍与陆军士气高涨，但西欧外交敌意难以消弭。"
 STATIC_MODIFIER_NAME_oe_weu_silver_shock_mod: "大西洋白银洪流价格革命"
 STATIC_MODIFIER_DESC_oe_weu_silver_shock_mod: "美洲白银经塞维利亚与里斯本汹涌灌入地中海市场，物价腾踊推高通胀并侵蚀旧式定额田赋，虽活络贸易却扰乱国库收支。"
 STATIC_MODIFIER_NAME_oe_weu_nomisma_stabilization_mod: "诺米斯玛金币平准改制"
 STATIC_MODIFIER_DESC_oe_weu_nomisma_stabilization_mod: "重铸高纯度帝国金币并设立国库平准署对冲大西洋白银冲击，成功压低通胀并稳固税基，但短期紧缩触痛市民商帮。"
 STATIC_MODIFIER_NAME_oe_weu_suez_transit_boom: "地中海贸易反击战：苏伊士过境盛世"
 STATIC_MODIFIER_DESC_oe_weu_suez_transit_boom: "依托图拉真运河直航或丝路双凤大通道与罗马商社网络，成功夺回东西方香料丝绸主干道并广征苏伊士过境金，唯海陆护航开支不菲。"
 STATIC_MODIFIER_NAME_oe_weu_grand_armada_defense: "海陆总动员：直面神圣同盟大决战"
 STATIC_MODIFIER_DESC_oe_weu_grand_armada_defense: "动员帝国全境军区与水师正面迎击大西洋—神罗大联军，三军纪律与海陆士气全面拉满，而军费负担沉重如山。"
 STATIC_MODIFIER_NAME_oe_weu_two_seas_concert: "大西洋—地中海双海均势协定"
 STATIC_MODIFIER_DESC_oe_weu_two_seas_concert: "与西欧列强在海权与商路上达成长期均势，双海互市繁荣、外交声誉卓著，帝国则收敛越洋独霸野心并维持温和护航。"
 STATIC_MODIFIER_NAME_oe_weu_mare_nostrum_hegemon: "地中海绝对霸权：铁腕镇西欧"
 STATIC_MODIFIER_DESC_oe_weu_mare_nostrum_hegemon: "以无敌水师与陆军纪律迫使大西洋列强承认罗马对地中海与苏伊士的绝对主宰，威震四海而外交敌意与海军维护常年高企。"
 STATIC_MODIFIER_NAME_oe_weu_tordesillas_boom: "托尔德西里亚斯大西洋航运垄断"
 STATIC_MODIFIER_DESC_oe_weu_tordesillas_boom: "依托大西洋远洋帆船与海外航路协议汲取香料白银红利，商收与商程大增，但远洋护航舰队维持成本攀升。"
 STATIC_MODIFIER_NAME_oe_weu_suez_customs_loc: "苏伊士—地中海过境海关总署"
 STATIC_MODIFIER_DESC_oe_weu_suez_customs_loc: "统筹红海运河与地中海转口船队的皇室海关与银库，将东西方香料贸易转化为源源不断的过境关税。"
 STATIC_MODIFIER_NAME_oe_weu_alpine_fort_loc: "阿尔卑斯—意大利防线军镇"
 STATIC_MODIFIER_DESC_oe_weu_alpine_fort_loc: "扼守北意与阿尔卑斯咽喉的棱堡与军团屯垦要塞，有效迟滞西欧神圣同盟南下。"
 STATIC_MODIFIER_NAME_oe_weu_atlantic_entrepot_loc: "地中海远洋转口船坞"
 STATIC_MODIFIER_DESC_oe_weu_atlantic_entrepot_loc: "专为远洋盖伦船与护航舰队扩建的深水船坞与免税货栈，支撑帝国直面大西洋海权竞逐。"
 oe_weu_dec_franco_accord.title: "缔结双鹰—百合反哈布斯堡密约"
 oe_weu_dec_franco_accord.desc: "趁哈布斯堡与伊比利亚围堵法兰西之际，向巴黎承诺止步阿尔卑斯并共分地中海商利，将法兰西撬出反罗马神圣同盟。警告：一旦染指里昂或高卢即刻破裂反转！"
 oe_weu_dec_franco_accord.a: "派遣密使签立双鹰—百合协约"
 oe_weu_dec_anglo_maritime.title: "签署英拜海上通商条约"
 oe_weu_dec_anglo_maritime.desc: "与英格兰/大不列颠互授商港特许、携手破除伊比利亚大西洋垄断，借海上贸易同盟将伦敦撬出反罗马神圣同盟。"
 oe_weu_dec_anglo_maritime.a: "御批英拜海上通商条约"
 oe_weu_dec_ecumenical_detente.title: "颁行对西普世宗教宽容敕令"
 oe_weu_dec_ecumenical_detente.desc: "以宗教宽容与礼仪互认瓦解西欧神圣同盟的十字军号召（若教会线具宽容或合一基础则效果更佳），代价是激起国内正教保守教士不满。"
 oe_weu_dec_ecumenical_detente.a: "颁布对西宗教宽容敕令"
 oe_weu_dec_med_counteroffensive.title: "发动地中海贸易反击战"
 oe_weu_dec_med_counteroffensive.desc: "依托贯通的红海图拉真运河或丝路双凤大通道，携手罗马商社彻底粉碎“绕道好望角危机”，在亚历山大与苏伊士设立过境海关征收巨额过境金！"
 oe_weu_dec_med_counteroffensive.a: "敕令商社与舰队发起地中海反击！"
 oe_weu_cab_divide_league: "分化西欧反罗马神圣同盟"
 oe_weu_cab_divide_league_desc: "调派宫廷外交官与秘密专使穿梭巴黎、伦敦与低地商帮，提升外交声誉与商力并瓦解同盟凝聚力；代价：税效与稳定成本承压。"
 oe_weu_cab_divide_league_action: "$oe_weu_cab_divide_league$"
 oe_weu_cab_divide_league_active: "正在分化西欧神圣同盟"
 oe_weu_cab_divide_league_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('diplomatic_reputation')]"
 oe_weu_cab_divide_league_action_progress_wordier: "分化西欧反罗马神圣同盟"
 oe_weu_cab_divide_league_action_progress_long_wordier: "分化西欧反罗马神圣同盟"
 oe_weu_cab_divide_league_action_progress_tooltip: "调派宫廷外交官与秘密专使穿梭巴黎、伦敦与低地商帮，提升外交声誉与商力并瓦解同盟凝聚力；代价：税效与稳定成本承压。"
 oe_weu_cab_med_convoy: "护航地中海—苏伊士商队"
 oe_weu_cab_med_convoy_desc: "统筹帝国水师与商社船队护航苏伊士及西地中海航道，提升贸易收入、海军士气与海上控制力；代价：海陆军维持费上升。"
 oe_weu_cab_med_convoy_action: "$oe_weu_cab_med_convoy$"
 oe_weu_cab_med_convoy_active: "正在护航地中海—苏伊士商队"
 oe_weu_cab_med_convoy_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('trade_income')]"
 oe_weu_cab_med_convoy_action_progress_wordier: "护航地中海—苏伊士商队"
 oe_weu_cab_med_convoy_action_progress_long_wordier: "护航地中海—苏伊士商队"
 oe_weu_cab_med_convoy_action_progress_tooltip: "统筹帝国水师与商社船队护航苏伊士及西地中海航道，提升贸易收入、海军士气与海上控制力；代价：海陆军维持费上升。"
 oe_weu.1.t: "阿尔卑斯以西的警钟：反罗马神圣同盟酝酿"
 oe_weu.1.d: "随着紫色鹰旗重临亚平宁乃至光复旧省日渐推进，巴黎、维也纳、托莱多、里斯本与伦敦的宫廷再也坐不住了。各国使节与教廷特使频繁穿梭于阿尔卑斯山南北，力主搁置宿怨、共组“反罗马神圣同盟”，以防卫军团与海上封锁遏制东罗马西进。\n\n然而西欧诸强各怀鬼胎——哈布斯堡忌惮法兰西，英伦与低地觊觎伊比利亚垄断。朝廷既可广布密网分化敌营，亦可筑垒严阵以待。"
 oe_weu.1.a: "广派密使分化西欧阵营，利用诸强裂痕拆解神圣同盟"
 oe_weu.1.a.tt: "花费#R 160金币#!，获得[ShowModifier('oe_weu_diplomatic_wedge_mod')]，持续#Y 25年#!，并显著压低#bold #color_yellow 神圣同盟凝聚度#!#!。"
 oe_weu.1.b: "加固伦巴第与罗马防线，以严阵以待威慑西欧联军"
 oe_weu.1.b.tt: "花费#R 200金币#!，陆军传统#G +8#!，加固米兰/罗马要塞并获得[ShowModifier('oe_weu_alpine_watch_mod')]，持续#Y 25年#!（激化西欧敌意）。"
 oe_weu.1.c: "宣示罗马止步意大利的克制立场，换取西欧暂缓封锁"
 oe_weu.1.c.tt: "花费#R 120金币#!，威望#R −12#!，缓和西欧诸强敌意并重算#bold #color_yellow 神圣同盟等级#!#!。"
 oe_weu.2.t: "查理曼与君士坦丁的密约：双鹰—百合协约"
 oe_weu.2.d: "哈布斯堡在维也纳与伊比利亚两翼收紧对法兰西的战略包围，令巴黎宫廷陷入窒息。法兰西国王的秘密特使悄然抵达君士坦丁堡，呈上一份足以震动全欧的草案——“双鹰—百合协约”。\n\n只要罗马承诺不越过阿尔卑斯山染指里昂与高卢腹地，法兰西便愿退出反罗马神圣同盟，与帝国共享西地中海商权、共同牵制哈布斯堡！但须牢记：一旦罗马铁骑踏入高卢，密约将瞬间破裂并激起全法兰西的卫国狂潮。"
 oe_weu.2.a: "签署双鹰—百合密约！撬出法兰西、共制哈布斯堡"
 oe_weu.2.a.tt: "花费#R 160金币#!，与法兰西互加好感并获得[ShowModifier('oe_weu_lily_accord_mod')]（#Y 35年#!），大幅降低#bold #color_yellow 神圣同盟凝聚度#!#!（染指里昂/高卢即刻破裂反转！）。"
 oe_weu.2.b: "拒绝束缚罗马西进之手：高卢终归是凯撒旧土"
 oe_weu.2.b.tt: "威望#G +10#!，陆军传统#G +6#!，获得[ShowModifier('oe_weu_gaul_ambition_mod')]，持续#Y 25年#!，放弃撬出法兰西。"
 oe_weu.3.t: "维也纳与马德里的铁幕：哈布斯堡双重包围"
 oe_weu.3.d: "面对帝国在中欧与地中海的步步紧逼，维也纳的德意志王室与托莱多、马德里的伊比利亚宫廷达成战略呼应。神罗诸侯在多瑙河上游调兵遣将，伊比利亚战舰则频频游弋于西西里与撒丁海域，企图将罗马锁死在亚得里亚海以东。\n\n元老院必须决断：在多瑙河与北意砸下重金筑起双线壁垒，还是以纵横捭阖的离间外交瓦解这条天主教铁幕？"
 oe_weu.3.a: "拨银筑垒，构筑多瑙河—亚得里亚双线壁垒迎击哈布斯堡"
 oe_weu.3.a.tt: "花费#R 220金币#!，陆军传统#G +8#!，加固北意军镇并获得[ShowModifier('oe_weu_danube_bastion_mod')]，持续#Y 30年#!。"
 oe_weu.3.b: "以重金贿赂神罗选侯与西欧宫廷，从内部松动包围网"
 oe_weu.3.b.tt: "花费#R 150金币#!，威望#R −6#!，获得[ShowModifier('oe_weu_diplomatic_wedge_mod')]，持续#Y 25年#!。"
 oe_weu.4.t: "高卢盟约破裂：阿尔卑斯烽火与高卢卫国动员"
 oe_weu.4.d: "帝国军团越过阿尔卑斯山、染指里昂与高卢领土的消息传回巴黎，朝野上下顿时哗然！法兰西国王怒撕“双鹰—百合协约”，痛斥君士坦丁堡背信弃义，即刻下诏全国进入“高卢卫国动员”并重返反罗马神圣同盟核心！\n\n西欧诸国见法国反目，反罗马同盟凝聚度骤然飙升。帝国既已亮剑高卢，便唯有一战定乾坤或收缩防线以待天时。"
 oe_weu.4.a: "既然翻脸便一战定高卢！全军转入越阿尔卑斯西进军纲"
 oe_weu.4.a.tt: "双鹰—百合协约即刻失效，法兰西获[ShowModifier('oe_weu_gallic_mobilization')]（#Y 25年#!）且同盟凝聚度大增；花费#R 180金币#!，陆军传统#G +8#!，获[ShowModifier('oe_weu_gaul_ambition_mod')]。"
 oe_weu.4.b: "暂缓深入巴黎腹地，依托阿尔卑斯军镇稳固防线"
 oe_weu.4.b.tt: "双鹰—百合协约即刻失效，法兰西获[ShowModifier('oe_weu_gallic_mobilization')]；威望#R −10#!，稳定度#G +4#!，获得[ShowModifier('oe_weu_alpine_watch_mod')]，持续#Y 20年#!。"
 oe_weu.5.t: "托尔德西里亚斯与绕道好望角危机"
 oe_weu.5.d: "里斯本与伊比利亚的大帆船正满载东方香料与新大陆白银绕道好望角归港，托尔德西里亚斯划定的远洋航线令大西洋港口日进斗金。反观亚历山大港、威尼斯与君士坦丁堡的传统转口海关，胡椒与丝绸的到港吨位明显下滑——帝国正面临史无前例的“绕道好望角危机”！\n\n商部官员禀报：唯有打通红海图拉真运河或丝路双凤大通道，并依托罗马商社发动“地中海贸易反击战”，方能彻底扭转乾坤。"
 oe_weu.5.a: "扩建地中海远洋转口船坞，整备商船以待运河与商社反击"
 oe_weu.5.a.tt: "承受[ShowModifier('oe_weu_atlantic_diversion')]（#Y 40年#!，可用反击决议提前清除）；花费#R 150金币#!，升级君士坦丁堡/威尼斯/热那亚远洋船坞。"
 oe_weu.5.b: "设立帝国专卖署与关税壁垒，以直接税入暂补商税缺口"
 oe_weu.5.b.tt: "承受[ShowModifier('oe_weu_atlantic_diversion')]（#Y 35年#!）；花费#R 120金币#!，获得[ShowModifier('oe_weu_imperial_customs_wall')]，持续#Y 25年#!。"
 oe_weu.6.t: "泰晤士河与金角湾：英拜海上通商条约"
 oe_weu.6.d: "伊比利亚在托尔德西里亚斯体系下的大西洋垄断，同样令伦敦的商船队与海军部怒不可遏。来自泰晤士河畔的商团特使抵达金角湾，提议缔结“英拜海上通商条约”：英国毛呢、火炮与远洋船队直入地中海免受重税，而伦敦则拒绝加入反罗马神圣同盟并在大西洋牵制伊比利亚！\n\n这是拆解西欧海上封锁、反制伊比利亚垄断的绝佳筹码。"
 oe_weu.6.a: "签署英拜海上通商条约！携手抗衡伊比利亚大西洋垄断"
 oe_weu.6.a.tt: "花费#R 180金币#!，与英格兰/大不列颠互加好感并获得[ShowModifier('oe_weu_anglo_maritime_mod')]（#Y 35年#!），将英方撬出神圣同盟并降低凝聚度。"
 oe_weu.6.b: "婉拒英伦特许，自建西地中海常备护航舰队独立争锋"
 oe_weu.6.b.tt: "花费#R 200金币#!，海军传统#G +10#!，升级远洋船坞并获得[ShowModifier('oe_weu_med_corsair_check_mod')]，持续#Y 30年#!。"
 oe_weu.7.t: "阿姆斯特丹交易所：低地商贷与禁运博弈"
 oe_weu.7.d: "北海之滨的阿姆斯特丹与低地商邦迅速崛起为欧洲航运与金融中枢。即便天主教同盟高喊对罗马禁运，精明的低地船东与银行家却暗中提出：愿为君士坦丁堡提供低息转口、大帆船货舱与近代金融票据，以换取东地中海商港的优惠席位。\n\n借低地商帮绕开封锁可引入近代思潮与商流，但教会保守派斥之为向异邦放贷者让渡关税。"
 oe_weu.7.a: "接通阿姆斯特丹商贷与低地转口船队，绕开天主教禁运"
 oe_weu.7.a.tt: "花费#R 140金币#!，教士满意小跌，改善低地关系并获得[ShowModifier('oe_weu_lowlands_arbitrage_mod')]，持续#Y 30年#!。"
 oe_weu.7.b: "严守帝国关税壁垒，禁止低地商帮染指皇室专卖"
 oe_weu.7.b.tt: "花费#R 100金币#!，市民满意小跌，获得[ShowModifier('oe_weu_imperial_customs_wall')]，持续#Y 30年#!。"
 oe_weu.8.t: "普世公会议余波：宗教妥协与神圣同盟分化"
 oe_weu.8.d: "反罗马神圣同盟之所以能号令西欧诸侯，很大程度上仰赖“保卫拉丁教会、抵御东方异端”的宗教旗帜。御前枢密院与牧首府展开激辩：若顺应教会线内的温和宽容思潮，颁布对西欧拉丁教民的宗教宽容与礼仪互认敕令，便能釜底抽薪地瓦解同盟凝聚力——代价则是国内正教强硬派教士的不满；若寸步不让，则举国正教同仇敌忾却外交孤立。"
 oe_weu.8.a: "颁行对西普世宽容敕令，釜底抽薪瓦解神圣同盟的十字军借口"
 oe_weu.8.a.tt: "花费#R 140金币#!，教士满意下跌，获得[ShowModifier('oe_weu_ecumenical_detente_mod')]（#Y 30年#!）并大幅降低#bold #color_yellow 神圣同盟凝聚度#!#!（若教会线具宽容/合一基础则额外减负并加稳定）。"
 oe_weu.8.b: "高举正教正统之盾寸步不让：真理岂容向拉丁教廷妥协！"
 oe_weu.8.b.tt: "稳定度#G +4#!，宗教影响#G +15#!，教士满意上升，获得[ShowModifier('oe_weu_orthodox_bulwark_mod')]，持续#Y 30年#!。"
 oe_weu.9.t: "大西洋白银洪流与西地中海海战"
 oe_weu.9.d: "成船成船的美洲白银自伊比利亚港口涌入欧陆，顺着谷物与军械采购汹涌灌入意大利与爱琴海市场，掀起席卷地中海的“价格革命”。旧式定额军区税基在物价飞涨中缩水，国库币值承压；与此同时，伊比利亚与帝国护航舰队在西地中海航道摩擦不断。\n\n国库大臣呈上两策：痛下决心推行诺米斯玛金币平准改制以遏通胀，或顺势吸纳涌入的白银充实短期战费。"
 oe_weu.9.a: "重铸高纯度诺米斯玛金币、设立平准署，铁腕遏制白银通胀"
 oe_weu.9.a.tt: "花费#R 200金币#!，稳定度#R −2#!，市民满意小跌，获得[ShowModifier('oe_weu_nomisma_stabilization_mod')]，持续#Y 30年#!。"
 oe_weu.9.b: "顺势向过境白银征税充实短期战费，容忍物价温和上行"
 oe_weu.9.b.tt: "立刻获得#G +180金币#!，但承受[ShowModifier('oe_weu_silver_shock_mod')]，持续#Y 25年#!。"
 oe_weu.10.t: "地中海贸易反击战：苏伊士与丝路双凤破局"
 oe_weu.10.d: "历经多年经营，帝国终于握住了彻底粉碎“绕道好望角危机”的王牌！无论是波涛贯通的红海图拉真运河，还是横贯欧亚的丝路双凤大通道，加上运筹帷幄的罗马商社网络，都让货船与驼队无需再耗时数月绕行狂风巨浪的非洲南端。\n\n今日下诏发动“地中海贸易反击战”，不仅可一举涤荡大西洋商路分流，更可在亚历山大港与苏伊士咽喉设立皇室过境海关，广收苏伊士过境金！"
 oe_weu.10.a: "发动地中海贸易反击战！清除好望角分流并广收苏伊士过境金"
 oe_weu.10.a.tt: "投入#R 250金币#!筹建海关（旋即征收首批过境金#G +350金币#!），清除[ShowModifier('oe_weu_atlantic_diversion')]，升级苏伊士/亚历山大海关并获得[ShowModifier('oe_weu_suez_transit_boom')]，持续#Y 40年#!。"
 oe_weu.10.b: "暂不兴师动众改制海关，先将资金用于扩充西地中海护航水师"
 oe_weu.10.b.tt: "花费#R 120金币#!，海军传统#G +8#!，获得[ShowModifier('oe_weu_med_corsair_check_mod')]，持续#Y 25年#!（仍可随时通过决议发动反击战）。"
 oe_weu.11.t: "大西洋—神罗总动员：反罗马神圣同盟升级"
 oe_weu.11.d: "反罗马神圣同盟的战鼓响彻西欧！从维也纳的帝国火炮营到伊比利亚与大西洋的远洋战舰，天主教联军正将同盟凝聚力推向顶峰，扬言要在阿尔卑斯山与西地中海同时向新罗马发起总清算。\n\n御前军事会议气氛凝重：是倾举国之力启动海陆总动员正面迎战，还是在最后一刻以巨额金银与外交让步紧急拆弹？"
 oe_weu.11.a: "启动帝国海陆总动员！以罗马军团与铁甲水师正面粉碎神圣同盟"
 oe_weu.11.a.tt: "花费#R 280金币#!，陆军传统#G +12#!，海军传统#G +10#!，加固北意要塞并获得[ShowModifier('oe_weu_grand_armada_defense')]，持续#Y 30年#!。"
 oe_weu.11.b: "紧急派遣重金使团分头斡旋，力保大战前夕撕开同盟缺口"
 oe_weu.11.b.tt: "花费#R 220金币#!，威望#R −10#!，缓和西欧诸强敌意并获得[ShowModifier('oe_weu_diplomatic_wedge_mod')]，持续#Y 30年#!。"
 oe_weu.12.t: "大西洋与地中海的新均势：西欧秩序终局"
 oe_weu.12.d: "跨越三个世纪的博弈终于迎来尘埃落定的时刻。无论是阿尔卑斯山麓的兵戈相见、巴黎与伦敦的纵横密约，还是苏伊士与好望角之间围绕全球商脉的世纪竞逐，西欧诸强都不得不正视一个铁一般的事实：新罗马不仅屹立不倒，更牢牢扼守着连接东西方的地中海心脏。\n\n站在近代世界秩序的门槛上，皇帝须为未来百年的西欧—大西洋战略定调：以铁腕霸权迫使大西洋列强俯首，还是缔结“双海均势协定”共荣互市？"
 oe_weu.12.a: "宣示地中海绝对霸权！令大西洋列强在罗马海陆铁拳前止步"
 oe_weu.12.a.tt: "花费#R 220金币#!，威望#G +20#!，解除西欧封锁施压并获得[ShowModifier('oe_weu_mare_nostrum_hegemon')]，持续#Y 40年#!；完成本线。"
 oe_weu.12.b: "缔结大西洋—地中海双海均势协定，化干戈为双海万商云集"
 oe_weu.12.b.tt: "花费#R 180金币#!，稳定度#G +6#!，解除封锁并缓和西欧关系，获得[ShowModifier('oe_weu_two_seas_concert')]，持续#Y 40年#!；完成本线。"
 oe_weu.20.t: "西欧反罗马联盟线：选项生效"
 oe_weu.90.t: "【测试】西欧反罗马联盟与大西洋秩序（61号槽）：状态读数"
 oe_weu.90.d: "#T 反罗马神圣同盟（供v8.5 AI/熵增）#!\n同盟等级(0-3) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_league')|0]  凝聚度(0-100) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_cohesion')|0]  初期立场(1离/2守/3缓) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_stance')|0]\n#T 玩家主动分化路径#!\n法拜密约(1签/2裂/3拒) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_fra')|0]  高卢破裂 [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_fra_rup')|0]  英拜商约(1签/2自) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_eng')|0]  低地套利(1通/2税) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_low')|0]  宗教妥协(1宽/2强) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_rel')|0]\n#T 大西洋商战与61号槽调度#!\n好望角危机 [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_div')|0]  苏伊士反击(1胜/2缓) [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_cnt_tr')|0]  完成 [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_done')|0]  月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_m')|0]  结束码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_end')|0]  已发数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu_rd_sent')|0]\n（结束码：0运行中、1西欧秩序终局、3超1755年、8暂无合格东罗马宿体）"
 oe_weu.90.a: "关闭"
 oe_weu.90.b: "刷新"
