l_simp_chinese:
 oe_v430_ref_rhomanismos_hellenic_court:0 "希腊宫廷与罗马尼亚正统"
 oe_v430_ref_rhomanismos_hellenic_court_desc:0 "确立希腊语作为神圣宫廷、帝国秘书处与东方礼仪的官方正统语言，凝聚罗马文化传承与教会向心力，代价是更高的对外交涉开销。"
 oe_v430_ref_latin_liturgical_rite:0 "罗马拉丁礼仪协约"
 oe_v430_ref_latin_liturgical_rite_desc:0 "使神圣礼仪与帝国法典统一归于拉丁语正统，兼容天主教、古典多神教及西向正教礼制，增强立法效率与教派宽容，但会短暂考验教士忠诚与国内稳定。"
