 OE_CHR_NAME_ALB: "阿尔巴尼亚与斯坎德培"
 OE_CHR_NAME_ALB_TT: "#F 1385年萨夫拉之战后，阿尔巴尼亚诸侯向苏丹称臣；威尼斯人陆续拿下都拉斯、莱什与斯库台；1443年起斯坎德培据克鲁亚抗击苏丹，1468年死于莱什；十年后克鲁亚、斯库台相继陷落。#!"
 OE_CHR_ALB_VOID_0: "到1480年，阿尔巴尼亚的历次风云都没有照史实发生。"
