 OE_CHR_J7_DONE_1: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_RUN_0: "[GetCountry('BYZ').Custom('OeJ7End')][GetCountry('BYZ').Custom('OeJ7End2')]"
 OE_CHR_J7_RUN_1: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_WAIT_0: "1386年起，若安德洛尼卡一系还有成年男子在帝国中，长房可能心怀怨望。"
 OE_CHR_NAME_BYD: "巴耶济德封锁"
 OE_CHR_NAME_BYD_TT: "#F 1394年起巴耶济德一世封锁君士坦丁堡；1396年十字军在尼科波利斯惨败；1399年曼努埃尔二世西行求援；1402年安卡拉之战后围城解除。#!"
 OE_CHR_BYD_VOID_0: "封锁中途作废：奥斯曼家族已归化帝国。"
 OE_CHR_BYD_VOID_1: "奥斯曼已不存在。"
 OE_CHR_BYD_VOID_2: "奥斯曼家族已归化帝国，不会有封锁。"
 OE_CHR_BYD_VOID_3: "空位期先到了，苏丹无力封锁京城。"
 OE_CHR_BYD_VOID_4: "帝国正当中兴，苏丹无力封锁京城；只要中兴不衰，这段历史不会发生。"
 OE_CHR_BYD_VOID_5: "到1420年也没有苏丹封锁京城，这段历史不会再来。"
 OE_CHR_BYD_DONE_0: "交给空位期：苏丹自顾不暇，围城#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月后解除。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_1: "封锁瓦解：苏丹再也围不住京城，围城#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_2: "议和纳贡：帝国接受了苏丹的条件，围城#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_3: "京城失守，封锁随之结束。"
 OE_CHR_BYD_RUN_0: "封锁已解，京城正在收拾残局。"
 OE_CHR_BYD_RUN_1: "已围#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月；粮储#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#!，城心#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#!。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_WAIT_0: "帝国应了苏丹的召见，封锁暂时推迟。"
 OE_CHR_BYD_WAIT_1: "等待：1394年起；若苏丹之怒已经发作，1385年起即可。"
 OE_CHR_BYD_WAIT_2: "等待：奥斯曼兵临京城，兵力超过帝国的#Y 1.5#!倍。"
 OE_CHR_NAME_CRMF: "哥特亚的君主"
 OE_CHR_NAME_CRMF_TT: "#F 约1395年，山上的狄奥多罗城被蛮族攻破；十五世纪二十年代，君主阿莱克修斯重修城池，在海边筑起卡拉米塔港；1433年琴巴洛的希腊人起事投向哥特亚，次年热那亚舰队夺回琴巴洛，随后在索尔哈特附近溃败。#!"
 OE_CHR_CRMF_VOID_0: "狄奥多罗已不存在、改了信仰、由玩家执掌、已归入帝国一方，或丢了都城，这一段不会照史实发生。"
 OE_CHR_CRMF_VOID_1: "狄奥多罗城的浩劫、重建和琴巴洛之役，都没有照史实发生。"
 OE_CHR_CRMF_DONE_0: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmLament')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_DONE_1: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_RUN_0: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmLament')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_RUN_1: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_WAIT_0: "1395年起，狄奥多罗城可能遭劫；之后是哥特亚的求亲（1424年）、城池的重建（1425年）和琴巴洛之役（1434年）。"
 OE_CHR_NAME_IVR: "奥斯曼空位期"
 OE_CHR_NAME_IVR_TT: "#F 1402年帖木儿在安卡拉俘获巴耶济德一世，奥斯曼王子们争位十一年；1403年的加里波利条约把塞萨洛尼基和沿海城市还给帝国。#!"
 OE_CHR_IVR_VOID_0: "押宝中途终止：奥斯曼已不存在，或奥斯曼家族已归化帝国。"
 OE_CHR_IVR_VOID_1: "奥斯曼已不存在。"
 OE_CHR_IVR_VOID_2: "奥斯曼家族已归化帝国，不会有空位期。"
 OE_CHR_IVR_DONE_0: "加里波利条约：收回沿海城市，不再纳贡。"
 OE_CHR_IVR_DONE_1: "签了加里波利条约，新苏丹清算之后又重新纳贡。"
 OE_CHR_IVR_DONE_2: "帝国没有押宝，或没有签成条约。"
 OE_CHR_IVR_RUN_0: "王子们争位已#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月；帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 OE_CHR_IVR_RUN_1: "安卡拉的消息已经传来，帝国正在权衡。"
 OE_CHR_IVR_WAIT_0: "等待：苏丹被帖木儿俘获（史实为1402年安卡拉之战）。"
 OE_CHR_IVR_WAIT_1: "等待：苏丹被俘，或奥斯曼陷入内战。"
 OE_CHR_NAME_DSP: "塞尔维亚的专制公"
 OE_CHR_NAME_DSP_TT: "#F 1402年安卡拉之战后，塞尔维亚的斯特凡·拉扎列维奇取道君士坦丁堡，受封专制公；塞尔维亚从此被称作专制公国。#!"
 OE_CHR_DSP_VOID_0: "安卡拉之后的两年里，没有合格的巴尔干正教君主来朝，或帝国自顾不暇。"
 OE_CHR_DSP_VOID_1: "奥斯曼已不存在，或奥斯曼家族已归化帝国，不会有安卡拉之后的来客。"
 OE_CHR_DSP_DONE_0: "[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主在布拉赫内宫受封专制公。"
 OE_CHR_DSP_DONE_1: "[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主受封塞巴斯托克拉托。"
 OE_CHR_DSP_DONE_2: "帝国设宴款待[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主，没有授予尊号。"
 OE_CHR_DSP_DONE_3: "安卡拉之战时，[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主已是帝国册封的专制公。"
 OE_CHR_DSP_RUN_0: "帝国正陷于内战，或不在君士坦丁堡；来客暂时不会来。"
 OE_CHR_DSP_RUN_1: "安卡拉的消息传来后两年内，可能有巴尔干的正教君主来朝。"
 OE_CHR_DSP_WAIT_0: "等待奥斯曼空位期开始（史实为1402年安卡拉之战之后）。"
 OE_CHR_NAME_THSM: "穆斯塔法之乱"
 OE_CHR_NAME_THSM_TT: "#F 1416年前后，奥斯曼王子穆斯塔法兵败逃到塞萨洛尼基，被帝国软禁；1421年苏丹去世，帝国放此人出来争位，1422年兵败被杀；1424年帝国重新向苏丹纳贡。#!"
 OE_CHR_THSM_VOID_0: "帝国把来投的王子交还了苏丹。"
 OE_CHR_THSM_VOID_1: "帝国把来投的王子礼送出境。"
 OE_CHR_THSM_VOID_2: "看管中的王子去世或离开了帝国。"
 OE_CHR_THSM_VOID_3: "看管到1440年，苏丹仍未换人。"
 OE_CHR_THSM_VOID_4: "1440年前没有奥斯曼王子来投。"
 OE_CHR_THSM_DONE_0: "押中：王子登上苏丹之位，帝国不再纳贡。"
 OE_CHR_THSM_DONE_1: "中途改押苏丹，站在了胜者一边。"
 OE_CHR_THSM_DONE_2: "押错：1424年议和，帝国重新纳贡。"
 OE_CHR_THSM_DONE_3: "押错：帝国拒绝了1424年的和约。"
 OE_CHR_THSM_DONE_4: "押错：新苏丹兴兵问罪。"
 OE_CHR_THSM_DONE_5: "帝国把王子交给了新苏丹。"
 OE_CHR_THSM_DONE_6: "争位无果，或帝国始终观望。"
 OE_CHR_THSM_RUN_0: "争位已#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月；帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 OE_CHR_THSM_RUN_1: "帝国看管着一位奥斯曼王子，等待苏丹换代。"
 OE_CHR_THSM_WAIT_0: "1410年起（或奥斯曼空位期结束后），失意的奥斯曼王子可能来投。"
 OE_CHR_THSM_WAIT_1: "等待：失意的奥斯曼王子来投；没有押宝在进行，两国不在交战。"
 OE_CHR_NAME_THSD: "塞萨洛尼基的封锁"
 OE_CHR_NAME_THSD_TT: "#F 1422年奥斯曼人封锁塞萨洛尼基；1423年专制公安德洛尼卡把城交给威尼斯；1430年3月穆拉德二世攻破此城。#!"
 OE_CHR_THSD_VOID_0: "封锁的时机到来时，塞萨洛尼基已不在帝国手中。"
 OE_CHR_THSD_VOID_1: "1453年前没有发生封锁。"
 OE_CHR_THSD_DONE_0: "交给了威尼斯；后来城还是落入奥斯曼人之手。"
 OE_CHR_THSD_DONE_1: "交给了威尼斯，由威尼斯防守。"
 OE_CHR_THSD_DONE_2: "城心耗尽，城归奥斯曼人。"
 OE_CHR_THSD_DONE_3: "城心耗尽，城仍属帝国，按年向苏丹纳款。"
 OE_CHR_THSD_DONE_4: "守住了：封锁五年，城始终没有屈服。"
 OE_CHR_THSD_DONE_5: "帝国出钱，苏丹解围。"
 OE_CHR_THSD_DONE_6: "塞萨洛尼基在战争中失去。"
 OE_CHR_THSD_DONE_7: "奥斯曼人的威胁消失，封锁结束。"
 OE_CHR_THSD_RUN_0: "封锁中：城心#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!，已封锁#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!个月；[GetCountry('BYZ').Custom('OeThsVenOk')]。"
 OE_CHR_THSD_WAIT_0: "等待：押错了穆斯塔法、拒绝了1424年的和约，或与奥斯曼交战时城的四周被合围。"
 OE_CHR_NAME_LAT4: "佛罗伦萨之后的教廷"
 OE_CHR_NAME_LAT4_TT: "#F 1439年12月，教皇在佛罗伦萨封尼西亚的贝萨里翁、基辅的伊西多尔为枢机；伊西多尔还受命为教廷在立陶宛、利沃尼亚和罗斯的使节。#!"
 OE_CHR_LAT4_VOID_0: "佛罗伦萨的合一没有签成，教皇也就没有派人来问帝国。"
 OE_CHR_LAT4_DONE_0: "[GetCountry('BYZ').Custom('OeLatHats')][GetCountry('BYZ').Custom('OeLatCouncil')]"
 OE_CHR_LAT4_RUN_0: "教皇的使者可能随时来问帝国怎样看待两位希腊枢机。[GetCountry('BYZ').Custom('OeLatCouncil')]"
 OE_CHR_LAT4_WAIT_0: "1439年12月以后、合一签署以后，教皇会派人来。"
 OE_CHR_NAME_L7: "最后的围城"
 OE_CHR_NAME_L7_TT: "#F 1452年穆罕默德二世在海峡欧洲一岸修起堡垒；1453年4月起围攻君士坦丁堡，5月29日城破，君士坦丁十一世战死。#!"
 OE_CHR_L7_VOID_0: "帝国正当中兴，苏丹无力围城；只要中兴不衰，最后的围城不会到来。"
 OE_CHR_L7_VOID_1: "到1480年底，苏丹没有来围城：这一局里京城没有经历最后的围攻。"
 OE_CHR_L7_DONE_0: "[GetCountry('BYZ').Custom('OeL7End')][GetCountry('BYZ').Custom('OeL7Emp')]"
 OE_CHR_L7_RUN_0: "[GetCountry('BYZ').Custom('OeL7Run')]"
 OE_CHR_L7_WAIT_0: "等待：1440至1480年间，奥斯曼兵力达到帝国的#Y 2.5#!倍以上、占着阿德里安波利斯并与京城接壤，而帝国除京城外还有别的地。"
 OE_CHR_NAME_AEG: "爱琴海诸领主"
 OE_CHR_NAME_AEG_TT: "#F 1346年热那亚人夺取希俄斯与福恰，出钱的股东结成“马奥纳”；1355年加蒂卢西奥家得到莱斯沃斯，此后四代与巴列奥略家结亲；1462年米蒂利尼陷落。#!"
 OE_CHR_AEG_VOID_0: "到1463年，希俄斯与莱斯沃斯的事都没有照史实发生：没有维尼奥索的舰队，没有马奥纳，加蒂卢西奥家也没有得到莱斯沃斯。"
 OE_CHR_AEG_DONE_0: "[GetCountry('BYZ').Custom('OeAegChios')][GetCountry('BYZ').Custom('OeAegGat')]"
 OE_CHR_AEG_RUN_0: "[GetCountry('BYZ').Custom('OeAegChios')][GetCountry('BYZ').Custom('OeAegGat')]"
 OE_CHR_AEG_WAIT_0: "1346年夏起，热那亚人的舰队可能来到希俄斯；1355年起，一个热那亚冒险家可能来求亲求岛。"
 OE_CHR_NAME_PRF: "古典近卫大区与管区"
 OE_CHR_NAME_PRF_TT: "#F 戴克里先与君士坦丁大帝重塑帝国行政，以东方、伊利里库姆、意大利与非洲、高卢四大近卫大区统摄十二管区，垂范《百官志》遗制。#!"
 OE_CHR_PRF_VOID_0: "（无）"
 OE_CHR_PRF_DONE_0: "四大近卫大区全部建制，已设管区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#!个，达最高《百官志》宪章，持续分担帝国重负。"
 OE_CHR_PRF_DONE_1: "四大近卫大区全部建制，已设管区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#!个，文治军管各司其职。"
 OE_CHR_PRF_RUN_0: "第三阶（完整《百官志》）：已建近卫大区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_n')|0]#! / #Y 4#!个、管区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#!个。"
 OE_CHR_PRF_RUN_1: "第二阶（东西四区齐开）：已建近卫大区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_n')|0]#! / #Y 4#!个、管区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#!个。"
 OE_CHR_PRF_RUN_2: "第一阶（枢密院初启）：已建近卫大区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_n')|0]#! / #Y 4#!个、管区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#!个。"
 OE_CHR_PRF_WAIT_0: "光复三处以上历史大区后，可颁布近卫大区宪章，依《百官志》设四大近卫大区与十二管区以分担帝国重负。"
 OE_CHR_NAME_GHH: "术赤兀鲁思与金帐兴衰"
 OE_CHR_NAME_GHH_TT: "#F 1337年月即别汗执政萨莱，统摄左翼白帐、昔班、花剌子模、喀山与克里米亚五翼兀鲁思；1359年别儿迪别死后大乱骤起，终至诸汗国分立。#!"
 OE_CHR_GHH_VOID_0: "金帐汗廷未及展开五翼兴衰即已退出草原舞台，本线作废。"
 OE_CHR_GHH_DONE_0: "萨莱完成全草原重整与汗廷中兴，术赤五翼重归号令（最终凝聚力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!）。"
 OE_CHR_GHH_DONE_1: "术赤兀鲁思步入终局：金帐五翼分流各立，草原格局重塑（凝聚力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!）。"
 OE_CHR_GHH_RUN_0: "第三阶（裂解期）：五翼离心渐重，凝聚力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!，中兴阶位#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_revival_stage')|0]#!。"
 OE_CHR_GHH_RUN_1: "第二阶（大乱期）：萨莱汗位频易，凝聚力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!，中兴阶位#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_revival_stage')|0]#!。"
 OE_CHR_GHH_RUN_2: "第一阶（盛世统摄）：萨莱统御五翼兀鲁思，凝聚力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!。"
 OE_CHR_GHH_WAIT_0: "1337年开局起，萨莱汗廷与左翼白帐、昔班、花剌子模、喀山、克里米亚五翼进入动态兴衰周期。"
 OE_CHR_NAME_RPL: "罗斯诸公与鞑靼枷锁"
 OE_CHR_NAME_RPL_TT: "#F 自1337年伊凡卡利塔奉金帐敕令掌收贡赋，至1380年库利科沃雪原会战与1480年乌格拉河对峙，罗斯诸公历经百余年终于挣脱鞑靼枷锁。#!"
 OE_CHR_RPL_VOID_0: "本局未由玩家执掌罗斯诸公国，或已逾历史窗口，玩家罗斯一期线作废。"
 OE_CHR_RPL_VOID_1: "罗斯诸公未能走完挣脱鞑靼枷锁之途，本线提前终止。"
 OE_CHR_RPL_DONE_0: "乌格拉河对峙落幕，罗斯挣脱鞑靼枷锁，一期全线共历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rpl_sent_cnt')|0]#!幕。"
 OE_CHR_RPL_DONE_1: "罗斯诸公一期主线已收束，全线共历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rpl_sent_cnt')|0]#!幕。"
 OE_CHR_RPL_RUN_0: "乌格拉河对峙已经展开，正待一期收官（已历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rpl_sent_cnt')|0]#!幕）。"
 OE_CHR_RPL_RUN_1: "罗斯诸公正在金帐敕令、大公之争与教会自立中积蓄力量（已历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rpl_sent_cnt')|0]#!幕）。"
 OE_CHR_RPL_WAIT_0: "当玩家执掌罗斯诸公国时开启，贯穿敕令纳贡、库利科沃会战至乌格拉河对峙。"
 OE_CHR_NAME_EUG: "察合台分裂与欧亚总督"
 OE_CHR_NAME_EUG_TT: "#F 1347年察合台汗国东西分裂为河中与蒙兀儿斯坦；同期德里苏丹国诸省总督、马穆鲁克大马士革与阿勒颇副王、匈牙利克罗地亚与特兰西瓦尼亚总督牵动欧亚大局。#!"
 OE_CHR_EUG_VOID_0: "（无）"
 OE_CHR_EUG_DONE_0: "察合台分裂与德里、马穆鲁克、匈牙利诸省总督演进周期已告一段落。"
 OE_CHR_EUG_RUN_0: "察合台汗国业已东西分裂；德里态#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_eug_dlh_state')|0]#!、马穆鲁克态#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_eug_mam_state')|0]#!、匈牙利态#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_eug_hun_state')|0]#!。"
 OE_CHR_EUG_RUN_1: "察合台汗国仍维系一统；德里态#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_eug_dlh_state')|0]#!、马穆鲁克态#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_eug_mam_state')|0]#!、匈牙利态#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_eug_hun_state')|0]#!。"
 OE_CHR_EUG_RUN_2: "欧亚总督与中亚变局框架正在运行，持续追踪察合台动向与德里、马穆鲁克、匈牙利诸省总督。"
 OE_CHR_EUG_WAIT_0: "1347年起开启，追踪察合台汗国东西分裂以及德里、马穆鲁克、匈牙利诸省建筑总督的兴衰。"
 OE_CHR_NAME_YMAR: "刺桐海疆与市舶海禁"
 OE_CHR_NAME_YMAR_TT: "#F 1357至1366年泉州爆发亦思巴奚兵乱，陈友定平闽复泉；东南海疆面临倭患与海禁还是重兴市舶司的抉择，关乎通往南洋与印度洋的宝船航路。#!"
 OE_CHR_YMAR_VOID_0: "大元未能守住中原与东南海疆，刺桐市舶与海防线随之作废。"
 OE_CHR_YMAR_VOID_1: "本局未在窗口内由大元开启刺桐海疆线，本线作废。"
 OE_CHR_YMAR_DONE_0: "大元重兴市舶司并启西洋宝船先声，刺桐港重连南洋与印度洋航路。"
 OE_CHR_YMAR_DONE_1: "朝廷定策重兴市舶司，东南海疆通商与防务格局落定。"
 OE_CHR_YMAR_DONE_2: "朝廷颁行海禁令，东南海疆转入清野固守之局。"
 OE_CHR_YMAR_DONE_3: "1415年海疆周期收束，刺桐与东南沿海诸务告一段落。"
 OE_CHR_YMAR_RUN_0: "已定重兴市舶司之策，正在经略刺桐港与备倭海防。"
 OE_CHR_YMAR_RUN_1: "已行海禁之策，沿海正在清野备倭、收束海贸。"
 OE_CHR_YMAR_RUN_2: "泉州亦思巴奚兵乱正在发酵，闽海局势动荡不安。"
 OE_CHR_YMAR_RUN_3: "东南海疆与泉州港风云渐起，海禁与开海之辩尚待定夺。"
 OE_CHR_YMAR_WAIT_0: "1350年起，若大元尚存并保有东南海疆，亦思巴奚兵乱、倭患与市舶海禁之辩将次第展开。"
 OE_CHR_NAME_PLC: "波兰—立陶宛与东欧三角"
 OE_CHR_NAME_PLC_TT: "#F 1385年克列沃联合缔结，1410年格伦瓦尔德之战重挫条顿骑士团，至1569年卢布林联合成立波兰—立陶宛联邦，深刻牵动罗斯、黑海与中欧均势。#!"
 OE_CHR_PLC_VOID_0: "波兰与立陶宛未能在历史窗口内成形，东欧三角线作废。"
 OE_CHR_PLC_DONE_0: "卢布林联合缔结，波兰—立陶宛联邦定鼎东欧三角。"
 OE_CHR_PLC_DONE_1: "波立维持松散共主格局，东欧三角各自为政。"
 OE_CHR_PLC_DONE_2: "波兰—立陶宛与条顿、罗斯的百年三角博弈收官（止于第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_plc_stage')|0]#!阶）。"
 OE_CHR_PLC_RUN_0: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_plc_stage')|0]#!阶：格伦瓦尔德大捷挫败条顿骑士团，正向卢布林联合演进。"
 OE_CHR_PLC_RUN_1: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_plc_stage')|0]#!阶：克列沃联合达成，波立联手经略波罗的海与鲁塞尼亚。"
 OE_CHR_PLC_RUN_2: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_plc_stage')|0]#!阶：波兰、立陶宛与条顿骑士团在东欧三角激烈角逐。"
 OE_CHR_PLC_WAIT_0: "1360年起开启，涵盖克列沃联合、格伦瓦尔德会战、鲁塞尼亚博弈与卢布林联合。"
 OE_CHR_NAME_RED: "红海圣地与图拉真运河"
 OE_CHR_NAME_RED_TT: "#F 1365年亚历山大十字军震动尼罗河口，此后马穆鲁克垄断香料通道、埃塞俄比亚所罗门王朝通使欧洲，苏伊士地峡重开图拉真古运河的构想直通印度洋。#!"
 OE_CHR_RED_VOID_0: "埃及与红海诸势力未在窗口内进入此线，本线作废。"
 OE_CHR_RED_DONE_0: "图拉真运河重开贯通红海与地中海，香料航道与圣地格局定鼎。"
 OE_CHR_RED_DONE_1: "图拉真运河工程终告搁置，红海商路以陆海转运收官。"
 OE_CHR_RED_DONE_2: "红海圣地与香料通道线落定（止于第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_red_stage')|0]#!阶）。"
 OE_CHR_RED_RUN_0: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_red_stage')|0]#!阶：图拉真运河业已通航，红海商船直通地中海。"
 OE_CHR_RED_RUN_1: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_red_stage')|0]#!阶：苏伊士河段正在开凿疏浚图拉真古运河。"
 OE_CHR_RED_RUN_2: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_red_stage')|0]#!阶：已完成古运河勘测，并展开香料关税与红海布局。"
 OE_CHR_RED_RUN_3: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_red_stage')|0]#!阶：已与埃塞俄比亚所罗门王朝建立红海呼应，正经略曼德海峡门户。"
 OE_CHR_RED_RUN_4: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_red_stage')|0]#!阶：亚历山大、西奈圣地与红海香料专卖风云渐起。"
 OE_CHR_RED_WAIT_0: "1365年起，围绕亚历山大、西奈圣地、所罗门王朝与苏伊士图拉真古运河的红海线逐步展开。"
 OE_CHR_NAME_YTM: "大元中兴与帖木儿东征"
 OE_CHR_NAME_YTM_TT: "#F 1370年帖木儿崛起河中，1404年冬统军东征中原，次年病逝于讹答剌；若大元中兴仍在，大都与撒马尔罕将在河西与塔里木迎来史诗交锋或沙哈鲁和约。#!"
 OE_CHR_YTM_VOID_0: "大元未能存续至西域对峙，复元抗帖木儿线作废。"
 OE_CHR_YTM_VOID_1: "未在历史窗口内由大元触发西域对峙，本线作废。"
 OE_CHR_YTM_DONE_0: "大都与撒马尔罕缔结欧亚通商和局，陆上丝路重归太平。"
 OE_CHR_YTM_DONE_1: "大元以河西与西域铁壁边防收官，稳固西北万里门户。"
 OE_CHR_YTM_DONE_2: "沙哈鲁通使平等议和，西域危机平稳落幕。"
 OE_CHR_YTM_DONE_3: "西域对峙时期落幕，河西与塔里木格局尘埃落定。"
 OE_CHR_YTM_RUN_0: "帖木儿越过讹答剌挥师东进，大元与帖木儿在西域正面交锋（战备#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ytm_readiness')|0]#!）。"
 OE_CHR_YTM_RUN_1: "帖木儿冬逝讹答剌，大元转向与沙哈鲁使团议定西域秩序（战备#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ytm_readiness')|0]#!）。"
 OE_CHR_YTM_RUN_2: "河西走廊与塔里木诸城严阵以待帖木儿东来（战备#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ytm_readiness')|0]#!）。"
 OE_CHR_YTM_WAIT_0: "1370年起，若大元稳住中原，西域将迎来帖木儿崛起与讹答剌东征之考。"
 OE_CHR_NAME_REN: "拜占庭文艺复兴"
 OE_CHR_NAME_REN_TT: "#F 赫里索洛拉斯赴佛罗伦萨讲学，普莱顿在米斯特拉斯复兴柏拉图哲学，贝萨里翁与根纳季二世激辩东西神学——巴列奥略王朝晚期的思想群星照亮了东西两界。#!"
 OE_CHR_REN_VOID_0: "（无）"
 OE_CHR_REN_DONE_0: "博斯普鲁斯思潮合流：静修派正统复兴定鼎，成为帝国精神柱石。"
 OE_CHR_REN_DONE_1: "博斯普鲁斯思潮合流：米斯特拉斯新柏拉图学派定鼎，希腊哲思焕发新生。"
 OE_CHR_REN_DONE_2: "博斯普鲁斯思潮合流：希拉人文融通派定鼎，帝国引领地中海人文风潮。"
 OE_CHR_REN_DONE_3: "学派定鼎验收完成，拜占庭文艺复兴收束定型。"
 OE_CHR_REN_DONE_4: "拜占庭文艺复兴随时代演进自然收束落幕。"
 OE_CHR_REN_RUN_0: "第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_stage').GetValue|0]#!阶：静修派正统领衔（静修#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hes').GetValue|0]#!、新柏拉图#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_neo').GetValue|0]#!、人文#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hum').GetValue|0]#!）。"
 OE_CHR_REN_RUN_1: "第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_stage').GetValue|0]#!阶：米斯特拉斯新柏拉图派领衔（静修#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hes').GetValue|0]#!、新柏拉图#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_neo').GetValue|0]#!、人文#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hum').GetValue|0]#!）。"
 OE_CHR_REN_RUN_2: "第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_stage').GetValue|0]#!阶：希拉人文融通派领衔（静修#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hes').GetValue|0]#!、新柏拉图#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_neo').GetValue|0]#!、人文#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hum').GetValue|0]#!）。"
 OE_CHR_REN_RUN_3: "第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_stage').GetValue|0]#!阶：三大学派争鸣未定（静修#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hes').GetValue|0]#!、新柏拉图#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_neo').GetValue|0]#!、人文#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ren_inf_hum').GetValue|0]#!）。"
 OE_CHR_REN_WAIT_0: "1380年起，随着学者往来君士坦丁堡、米斯特拉斯与意大利，静修、新柏拉图与人文三派之辩将逐步展开。"
 OE_CHR_NAME_IRT: "伊朗高原后期线"
 OE_CHR_NAME_IRT_TT: "#F 伊儿汗国瓦解后，黑羊与白羊土库曼部争雄两河与阿塞拜疆；乌尊哈桑联姻特拉比松以抗奥斯曼，至1501年伊斯玛仪一世于大不里士建立萨非波斯并经查尔迪兰之战历练火器新军。#!"
 OE_CHR_IRT_VOID_0: "伊朗高原诸强未在历史窗口内成形，本线作废。"
 OE_CHR_IRT_DONE_0: "查尔迪兰之战后推行火枪新军改制，萨非波斯确立伊朗高原新秩序。"
 OE_CHR_IRT_DONE_1: "阿尔达比勒萨非教团称沙阿建国，重塑伊朗与西亚均势。"
 OE_CHR_IRT_DONE_2: "黑羊、白羊至萨非时期的伊朗高原后期线收官（止于第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_irt_stage')|0]#!阶）。"
 OE_CHR_IRT_RUN_0: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_irt_stage')|0]#!阶：阿尔达比勒萨非教团崛起，奇兹尔巴什正改写伊朗政局。"
 OE_CHR_IRT_RUN_1: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_irt_stage')|0]#!阶：白羊部乌尊哈桑称雄高原，与特拉比松及西方互为呼应。"
 OE_CHR_IRT_RUN_2: "第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_irt_stage')|0]#!阶：黑羊与白羊部在阿塞拜疆与两河之间展开角逐。"
 OE_CHR_IRT_WAIT_0: "1411年起，承接伊儿汗国遗产，展开黑羊、白羊乌尊哈桑与萨非波斯崛起线。"
 OE_CHR_NAME_SRK: "丝路双凤：陆海连通"
 OE_CHR_NAME_SRK_TT: "#F 若君士坦丁堡与大都双双中兴，陆上驼队经撒马尔罕、大不里士直达博斯普鲁斯，海上商船由刺桐、马六甲连结红海，东西双凤重开欧亚大动脉。#!"
 OE_CHR_SRK_VOID_0: "开局游戏规则已关闭丝路双凤线，本线作废。"
 OE_CHR_SRK_VOID_1: "东西两端均未形成足以贯通欧亚商路的中兴强权，本线作废。"
 OE_CHR_SRK_DONE_0: "君士坦丁堡与大都缔结《双凤通商盟约》（陆路积分#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路积分#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_DONE_1: "欧亚陆海商路以务实互市协定收官（陆路积分#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路积分#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_DONE_2: "丝路双凤时代收束（陆路积分#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路积分#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_RUN_0: "双强并立模式：罗马与大元双向贯通陆海丝路（陆路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_RUN_1: "西端单强模式：罗马独力打通欧亚商路（陆路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_RUN_2: "东端单强模式：大元独力开拓西洋商道（陆路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_RUN_3: "丝路双凤商路筹建中（陆路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_land_score')|0]#!，海路#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_srk_sea_score')|0]#!）。"
 OE_CHR_SRK_WAIT_0: "1400年起，当拜占庭/罗马与中兴大元（或至少一端中兴）具备跨洲通商条件时开启。"
 OE_CHR_NAME_L7EX: "失城流亡与中兴复国"
 OE_CHR_NAME_L7EX_TT: "#F 1453年君士坦丁堡陷落后，摩里亚的托马斯与季米特里奥斯、特拉比松的大科穆宁与克里米亚哥提亚一度承续罗马余脉，谋划外援与反攻复国。#!"
 OE_CHR_L7EX_VOID_0: "帝国已步入中兴，君士坦丁堡安然无恙，无须走上失城流亡之路。"
 OE_CHR_L7EX_DONE_0: "流亡政权克复君士坦丁堡，圣索菲亚重悬紫旗，罗马中兴复国。"
 OE_CHR_L7EX_DONE_1: "帝国流亡遗脉已克复君士坦丁堡，续写罗马大统。"
 OE_CHR_L7EX_RUN_0: "第四阶（反攻前夜）：流亡主力集结待发，剑指海峡（法统#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_mantle').GetValue|0]#!，外援#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_aid').GetValue|0]#!）。"
 OE_CHR_L7EX_RUN_1: "第三阶（励精图治）：整编斯特拉蒂奥提兵团与流亡遗民（法统#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_mantle').GetValue|0]#!，外援#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_aid').GetValue|0]#!）。"
 OE_CHR_L7EX_RUN_2: "第二阶（外援筹谋）：已定外交求援方略（法统#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_mantle').GetValue|0]#!，外援#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_aid').GetValue|0]#!）。"
 OE_CHR_L7EX_RUN_3: "第一阶（紫袍遗脉）：失城之后重举罗马法统，于流亡之地续命（法统#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_ex_mantle').GetValue|0]#!）。"
 OE_CHR_L7EX_WAIT_0: "若君士坦丁堡陷落而帝国遗脉尚存，将开启失城流亡、外援筹谋与克复京城主线。"
 OE_CHR_NAME_ROM3: "第二与第三罗马"
 OE_CHR_NAME_ROM3_TT: "#F 1472年索菲亚·帕列奥罗格远嫁莫斯科，1510年代普斯科夫长老菲洛费提出「第三罗马」之说；君士坦丁堡若犹存，两座正教帝都将面临共鸣和约、双雄争锋抑或接续大统的抉择。#!"
 OE_CHR_ROM3_VOID_0: "本局未形成君士坦丁堡与罗斯并立对望的格局，本线作废。"
 OE_CHR_ROM3_VOID_1: "第二与第三罗马法统之争提前中止。"
 OE_CHR_ROM3_DONE_0: "双鹰共鸣和约落定：君士坦丁堡与莫斯科互认尊荣、共卫正教世界。"
 OE_CHR_ROM3_DONE_1: "双雄争锋格局定型：两座正教帝都围绕法统与黑海权柄长期角逐。"
 OE_CHR_ROM3_DONE_2: "接续大统落定：莫斯科承继东罗马法统并确立全罗斯牧首尊位。"
 OE_CHR_ROM3_DONE_3: "第二与第三罗马的法统议题业已尘埃落定。"
 OE_CHR_ROM3_RUN_0: "双鹰协约已签，两都正议定教务尊位与黑海秩序。"
 OE_CHR_ROM3_RUN_1: "两都步入法统争锋，正教世界的话语权之争持续升温。"
 OE_CHR_ROM3_RUN_2: "莫斯科高举「第三罗马」大旗，筹谋接续法统与牧首升格。"
 OE_CHR_ROM3_RUN_3: "菲洛费书简与双头鹰法统之辩正在君士坦丁堡与罗斯之间展开。"
 OE_CHR_ROM3_WAIT_0: "1470年起，随着罗斯崛起与君士坦丁堡局势演变，「第二罗马」与「第三罗马」的法统互动将拉开帷幕。"
 OE_CHR_NAME_RP2: "罗斯帝国与哥萨克边疆"
 OE_CHR_NAME_RP2_TT: "#F 挣脱鞑靼枷锁后，伊凡三世迎娶索菲亚·帕列奥罗格，伊凡四世加冕全罗斯沙皇、敕封六大边疆哥萨克军团、攻克喀山并启叶尔马克东越乌拉尔之先声。#!"
 OE_CHR_RP2_VOID_0: "本局未由玩家延续罗斯二期宿体，或已逾历史窗口，本线作废。"
 OE_CHR_RP2_VOID_1: "罗斯帝国与哥萨克边疆线未能续行，提前终止。"
 OE_CHR_RP2_DONE_0: "索菲亚联姻、全罗斯沙皇加冕与边疆哥萨克敕封俱已告成（全线共历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rp2_sent_cnt')|0]#!幕）。"
 OE_CHR_RP2_DONE_1: "罗斯帝国与哥萨克边疆拓展已收官（全线共历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rp2_sent_cnt')|0]#!幕）。"
 OE_CHR_RP2_RUN_0: "罗马联姻礼成，正推进沙皇称帝、六大边疆哥萨克敕封与西伯利亚东进（已历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rp2_sent_cnt')|0]#!幕）。"
 OE_CHR_RP2_RUN_1: "罗斯正由大公国迈向全罗斯沙皇国与草原边疆拓殖（已历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_rp2_sent_cnt')|0]#!幕）。"
 OE_CHR_RP2_WAIT_0: "挣脱鞑靼枷锁后开启，涵盖索菲亚联姻、沙皇加冕、六大边疆哥萨克军团与西伯利亚拓荒。"
 OE_CHR_NAME_ITW: "意大利战争拜占庭干涉"
 OE_CHR_NAME_ITW_TT: "#F 1494年法王查理八世挥师南下意大利，开启半个多世纪的欧陆争霸；若东罗马依然屹立，可凭蒙费拉托血脉、斯特拉蒂奥提轻骑与海军重返亚平宁棋局。#!"
 OE_CHR_ITW_VOID_0: "意大利战争窗口内帝国未能具备跨海介入条件，本线作废。"
 OE_CHR_ITW_VOID_1: "意大利战争拜占庭干涉线提前终止。"
 OE_CHR_ITW_DONE_0: "结局：重光拉韦纳督府——帝国在亚平宁重建实权据点（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_DONE_1: "结局：半岛均势——帝国纵横法西教廷之间，保住意大利商权与外交声望（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_DONE_2: "结局：收缩东归——帝国抽身亚平宁泥潭，保全本土元气（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_DONE_3: "意大利战争拜占庭干涉落幕（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_RUN_0: "采取积极武装介入立场，力图重立拉韦纳督府（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_RUN_1: "采取纵横调停立场，在法兰西、西班牙与教廷间维系半岛均势（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_RUN_2: "采取克制观望立场，借斯特拉蒂奥提骑兵与商贸谋利（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_RUN_3: "意大利战争爆发，帝国正权衡跨海介入的立场与筹码（影响力#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_itw_influence')|0]#!）。"
 OE_CHR_ITW_WAIT_0: "1494年起，若拜占庭/罗马尚存并有余力跨海经略亚平宁，将开启意大利战争干涉主线。"
 OE_CHR_NAME_SIT2: "欧亚四大旗舰局势"
 OE_CHR_NAME_SIT2_TT: "#F 以原生局势面板统筹至正中兴、金帐大乱、拜占庭文艺复兴与欧亚十字路口四大跨国风云，并与红巾、大分裂、帖木儿与意大利战争四项原版局势自动桥接。#!"
 OE_CHR_SIT2_VOID_0: "（无）"
 OE_CHR_SIT2_DONE_0: "全部#Y 4#!项欧亚旗舰局势均已结案，共联动原版局势桥接#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_sit2_br')|0]#! / #Y 4#!处。"
 OE_CHR_SIT2_RUN_0: "已点亮旗舰局势#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_sit2_st')|0]#! / #Y 4#!项（已结案#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_sit2_en')|0]#!项），联动原版桥接#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_sit2_br')|0]#! / #Y 4#!处。"
 OE_CHR_SIT2_WAIT_0: "随欧亚风云推进自动点亮至正中兴、金帐大乱、拜占庭文艺复兴与欧亚十字路口四大旗舰局势。"
 OE_CHR_NAME_FAR: "远洋总督与双洋商路"
 OE_CHR_NAME_FAR_TT: "#F 红海图拉真运河东接印度洋塔普罗巴纳与马六甲海丝，直布罗陀西越福岛直抵赫斯佩里亚新罗马，重塑双洋商路与海外总督体制。#!"
 OE_CHR_FAR_VOID_0: "帝国未能跨出地中海开启远洋航路，本线作废。"
 OE_CHR_FAR_DONE_0: "双洋远海秩序定鼎（东航商站#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_far_east_n')|0]#!、西航据点#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_far_west_n')|0]#!、海外自主度#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_far_auto')|0]#!）。"
 OE_CHR_FAR_RUN_0: "远洋经略进行中：东航商站#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_far_east_n')|0]#!处、西航据点#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_far_west_n')|0]#!处、海外自主度#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_far_auto')|0]#!。"
 OE_CHR_FAR_WAIT_0: "1395年起，已立罗马商社并具红海或直布罗陀跳板时开启远洋总督主线。"
 OE_CHR_NAME_TWE: "两帝之争：双罗马正统"
 OE_CHR_NAME_TWE_TT: "#F 当复兴的新罗马与德意志神圣罗马帝国在亚平宁与多瑙河迎面相遇，东西两帝围绕唯一帝冠、双罗马分治和约与欧陆霸权展开百年博弈。#!"
 OE_CHR_TWE_VOID_0: "（无）"
 OE_CHR_TWE_DONE_0: "新罗马确立唯一帝统（Unus Imperator），西方神罗霸权退潮。"
 OE_CHR_TWE_DONE_1: "东西双帝缔结《双罗马和约》，互认帝号、共分多瑙与亚平宁秩序。"
 OE_CHR_TWE_DONE_2: "两帝之争局势业已结案，欧陆帝权秩序尘埃落定。"
 OE_CHR_TWE_RUN_0: "两帝正统天平#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_twe_balance')|0]#! / #Y 100#!，东西和解度#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_twe_concord')|0]#! / #Y 100#!。"
 OE_CHR_TWE_WAIT_0: "1520年起，当东罗马与神圣罗马帝国在欧陆正面交锋时点亮两帝之争局势。"
 OE_CHR_NAME_BEM: "罗马近世三幕：宗教、启蒙与宪政"
 OE_CHR_NAME_BEM_TT: "#F 自宗教改革与泛正教大公会议，经新罗马启蒙与印刷律典，直至大革命浪潮下的宪政大抉择。#!"
 OE_CHR_BEM_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_BEM_DONE_0: "罗马近世三幕大势已定，帝国完成向近代宪政与思想秩序的转型。"
 OE_CHR_BEM_RUN_0: "罗马近世三幕（宗教交锋、启蒙改制、宪政大考）正在展开。"
 OE_CHR_BEM_WAIT_0: "1560年起随宗教改革与近世思潮开启罗马近世三幕主线。"
 OE_CHR_NAME_YEM: "大元近世中兴：西洋宝船与白银潮"
 OE_CHR_NAME_YEM_TT: "#F 复元之后西洋宝船出航、吕宋白银入华、钦天监中西天算之辩与小冰期漕运大考，铸就近世大元新局。#!"
 OE_CHR_YEM_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_YEM_DONE_0: "大元近世中兴定局，四海通商与行省新宪俱已落定。"
 OE_CHR_YEM_RUN_0: "大元近世中兴线（宝船、白银、钦天监与小冰期大考）正在展开。"
 OE_CHR_YEM_WAIT_0: "1450年起，若大元成功中兴则开启近世宝船与白银潮主线。"
 OE_CHR_NAME_REM: "俄罗斯近世帝国：双海与太平洋"
 OE_CHR_NAME_REM_TT: "#F 1613全罗斯定局、旧礼仪派分裂、涅瓦波罗的海新窗、黑海暖水港与越过勒拿河直抵白令海峡的万里拓疆。#!"
 OE_CHR_REM_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_REM_DONE_0: "俄罗斯近世帝国三路线格局已成，双海与太平洋疆域定型。"
 OE_CHR_REM_RUN_0: "俄罗斯近世改制、波罗的海/黑海出海口与太平洋远征正在推进。"
 OE_CHR_REM_WAIT_0: "1600年起开启俄罗斯近世帝国与太平洋拓疆主线。"
 OE_CHR_NAME_ENT: "帝国熵增与盛世维系"
 OE_CHR_NAME_ENT_TT: "#F 横跨洲际的超大帝国终须直面疆域过伸、白银通胀、边藩军阀化与文化宗教过载五维重负，唯凭制度革新与近卫大区方能锁定盛世永安。#!"
 OE_CHR_ENT_VOID_0: "（无）"
 OE_CHR_ENT_DONE_0: "已连续十年稳控低熵，锁定「罗马和平 / 盛世永安」皇冠里程碑。"
 OE_CHR_ENT_RUN_0: "五维帝国熵增与主动反制机制正在运转。"
 OE_CHR_ENT_WAIT_0: "当帝国疆域迈入超大体量或光复重负开启后自动接入五维熵增治理。"
 OE_CHR_NAME_WEU: "西欧反罗马联盟与大西洋秩序"
 OE_CHR_NAME_WEU_TT: "#F 当罗马重返亚平宁与西欧，法、哈布斯堡、伊比利亚与英格兰围绕反罗马神圣同盟、法拜密约与大西洋贸易分流展开博弈。#!"
 OE_CHR_WEU_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_WEU_DONE_0: "西欧反罗马联盟与大西洋—地中海商路秩序已告定型。"
 OE_CHR_WEU_RUN_0: "西欧反罗马同盟博弈与大西洋商路分流应对正在展开。"
 OE_CHR_WEU_WAIT_0: "1450年起，当帝国深入意大利或大西洋贸易兴起时开启。"
 OE_CHR_NAME_SEA: "南亚与东南亚海上丝路"
 OE_CHR_NAME_SEA_TT: "#F 串联德里之后德干均势、毗奢耶那伽罗与马拉巴尔香料港、马六甲海峡、大越与满者伯夷，打通刺桐至红海全链路海上丝路。#!"
 OE_CHR_SEA_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_SEA_DONE_0: "南亚与东南亚海上丝路全链格局业已落定。"
 OE_CHR_SEA_RUN_0: "印度洋与南洋诸港的海上丝路商约与海权博弈正在进行。"
 OE_CHR_SEA_WAIT_0: "1400年起开启南亚与东南亚海上丝路主线。"
 OE_CHR_NAME_MAG: "马格里布、巴巴里海盗与迦太基总督区"
 OE_CHR_NAME_MAG_TT: "#F 马林、哈夫斯与扎扬三王朝竞逐马格里布，跨撒哈拉黄金商队北上，巴巴里私掠网与罗马迦太基总督区深治交织西地中海。#!"
 OE_CHR_MAG_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_MAG_DONE_0: "马格里布、巴巴里海盗与迦太基总督区格局已告收官。"
 OE_CHR_MAG_RUN_0: "马格里布三王朝博弈、跨撒哈拉金路与北非海疆清剿正在展开。"
 OE_CHR_MAG_WAIT_0: "随西地中海与北非局势演进开启马格里布与迦太基总督区主线。"
 OE_CHR_NAME_NBE: "北欧、多瑙河与东亚边缘"
 OE_CHR_NAME_NBE_TT: "#F 卡尔马三王同盟、松德海峡关税与波罗的海霸权，匈牙利黑军、波希米亚胡斯传统与多瑙防线，以及朝鲜事大、日本勘合银路与辽东卫所女真风云交织欧亚边缘。#!"
 OE_CHR_NBE_VOID_0: "未在历史窗口内满足触发前提，本线作废。"
 OE_CHR_NBE_DONE_0: "北欧、多瑙河与东亚边缘精修格局已告落定。"
