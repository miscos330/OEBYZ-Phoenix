 OE_CHR_NAME_THSA: "塞萨洛尼基的第二朝廷"
 OE_CHR_NAME_THSA_TT: "#F 1382年秋，曼努埃尔秘密到塞萨洛尼基自立朝廷，抗击奥斯曼人；1383年起城被围，1387年4月开城投降。#!"
 OE_CHR_THSA_VOID_0: "1395年前没有皇子出走塞萨洛尼基，这段历史不会再来。"
 OE_CHR_THSA_DONE_0: "开城投降：城归奥斯曼人，保留了特权。"
