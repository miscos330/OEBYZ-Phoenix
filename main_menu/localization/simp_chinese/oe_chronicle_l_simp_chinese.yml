 OE_CHR_NAME_S37: "开局两年"
 OE_CHR_NAME_S37_TT: "#F 1337年：尼科米底亚落入奥尔汗之手，阿尔巴尼亚诸部起事，伊庇鲁斯动荡不安；朝中查办受贿的普遍法官，热那亚人扎卡里亚获释。#!"
