 OE_CHR_ITP_DONE_0: "这是一个框架，没有终局。"
 OE_CHR_ITP_RUN_0: "威尼斯[GetCountry('BYZ').Custom('OeItpTierVen')]，热那亚[GetCountry('BYZ').Custom('OeItpTierGen')]，[GetCountry('BYZ').Custom('OeItpSlot4')][GetCountry('BYZ').Custom('OeItpTierPis')]，拉古萨[GetCountry('BYZ').Custom('OeItpTierRag')]；威尼斯旧账#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_ven_claims').GetValue|0]#!千杜卡特，[GetCountry('BYZ').Custom('OeItpVenPact')]。黑海粮道[GetCountry('BYZ').Custom('OeItpGrain')]。"
 OE_CHR_ITP_WAIT_0: "开局后的第一个月开始计算各家的特权。"
