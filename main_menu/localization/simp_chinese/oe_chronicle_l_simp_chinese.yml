 OE_CHR_NAME_ECR: "罗斯的都主教"
 OE_CHR_NAME_ECR_TT: "#F 1353年起，莫斯科与立陶宛争夺全罗斯的都主教，君士坦丁堡的牧首在两边之间祝圣；1448年，罗斯的主教们不经君士坦丁堡，自选约纳为都主教。#!"
 OE_CHR_ECR_VOID_0: "[GetCountry('BYZ').Custom('OeEccChrRusVoid')]"
 OE_CHR_ECR_DONE_0: "[GetCountry('BYZ').Custom('OeEccChrRusDone')]"
 OE_CHR_ECR_RUN_0: "[GetCountry('BYZ').Custom('OeEccChrRusRun')]"
 OE_CHR_ECR_WAIT_0: "1353年起，全罗斯的都主教出缺时，罗斯会派人来君士坦丁堡求祝圣。"
 OE_CHR_ECR_WAIT_1: "等待：罗斯或立陶宛派人来君士坦丁堡，求祝圣一位都主教。"
 OE_CHR_NAME_BUL: "保加利亚的分裂与灭亡"
 OE_CHR_NAME_BUL_TT: "#F 1355年前后两国联姻，次年维丁分治；1366年绿伯爵为帝国取下黑海港口，1373年保加利亚向苏丹称臣；1393年特尔诺沃陷落，1396年维丁陷落。#!"
 OE_CHR_BUL_VOID_0: "保加利亚撑过了中世纪。"
 OE_CHR_BUL_VOID_1: "特尔诺沃已归帝国集团，保加利亚不会按史实灭亡。"
 OE_CHR_BUL_DONE_0: "维丁陷落，保加利亚终结；帝国在1366年得到了安基阿洛斯一带。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! / #Y 8#!段。"
 OE_CHR_BUL_DONE_1: "维丁陷落，保加利亚终结。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! / #Y 8#!段。"
 OE_CHR_BUL_RUN_0: "特尔诺沃已经陷落，维丁还在。已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! / #Y 8#!段。"
 OE_CHR_BUL_RUN_1: "保加利亚已向苏丹纳贡。已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! / #Y 8#!段。"
 OE_CHR_BUL_RUN_2: "两家已结为姻亲。已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! / #Y 8#!段。"
 OE_CHR_BUL_RUN_3: "保加利亚分崩离析。已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! / #Y 8#!段。"
 OE_CHR_BUL_WAIT_0: "1355年起：联姻、维丁分治、黑海港口之争。"
 OE_CHR_NAME_UN: "教会合一"
 OE_CHR_NAME_UN_TT: "#F 1439年7月在佛罗伦萨签了合一，1452年12月12日才在圣索菲亚宣读。#!"
