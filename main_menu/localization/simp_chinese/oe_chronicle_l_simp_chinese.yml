 OE_CHR_NAME_ILK2: "大不里士易主与帖木儿"
 OE_CHR_NAME_ILK2_TT: "#F 1357年金帐汗国的札尼别南下攻取大不里士，处死出班家族的马利克·阿什拉夫；札剌亦儿随后入主大不里士。1393年起帖木儿西征，1402年7月在安卡拉俘获苏丹巴耶济德。#!"
 OE_CHR_ILK2_VOID_0: "帝国的波斯方略已经完成，这一带从此由帝国的征伐改写，不再照史实发生。"
 OE_CHR_ILK2_VOID_1: "大不里士易主、帖木儿西征前后的这些事，一件也没有照史实发生。"
