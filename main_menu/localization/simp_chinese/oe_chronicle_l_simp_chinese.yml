 OE_CHR_NAME_J7: "长房之争"
 OE_CHR_NAME_J7_TT: "#F 1390年春，安德洛尼卡四世之子约翰七世借苏丹之力夺取京城，约翰五世退守金门一带的城堡；同年秋，曼努埃尔带着几条船回来，老皇帝复位。1399年叔侄和解。#!"
