 OE_CHR_NAME_LGR1: "纳瓦拉人与阿恰约利"
 OE_CHR_NAME_LGR1_TT: "#F 1379年，纳瓦拉佣兵团的一队人马攻破底比斯，随后兵团入主亚该亚；1388年，佛罗伦萨人内里奥·阿恰约利取得雅典卫城；1394年内里奥去世，摩里亚的专制公一两年后买下了科林斯。1383年克里斯波家夺得群岛公国，1390年内格罗蓬特全岛归了威尼斯；1404年阿尔卡迪亚的领主琴图廖内买下亚该亚的亲王号，兵团当家的日子到此为止。1444年，专制公趁苏丹北顾出兵中希腊，雅典公爵向帝国纳贡。#!"
 OE_CHR_LGR1_VOID_0: "纳瓦拉兵团没有入主亚该亚，阿恰约利家也没有取得雅典：这一段没有照史实发生。"
