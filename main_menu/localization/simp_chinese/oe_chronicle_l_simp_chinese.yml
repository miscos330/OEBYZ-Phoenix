 OE_CHR_ILK1_WAIT_0: "1337年夏起，札剌亦儿与木撒汗的战争会有个了结；之后是大不里士的西方商人（1340年）、速台与埃雷特纳（1343年）、黑羊部与白羊部的立国（1350年）和白羊的新娘（1352年）。"
 OE_CHR_NAME_COL: "殖民与安置"
