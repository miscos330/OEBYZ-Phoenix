 OE_CHR_NAME_THSA: "塞萨洛尼基的第二朝廷"
 OE_CHR_NAME_THSA_TT: "#F 1382年秋，曼努埃尔秘密到塞萨洛尼基自立朝廷，抗击奥斯曼人；1383年起城被围，1387年4月开城投降。#!"
 OE_CHR_THSA_VOID_0: "1395年前没有皇子出走塞萨洛尼基，这段历史不会再来。"
 OE_CHR_THSA_DONE_0: "开城投降：城归奥斯曼人，保留了特权。"
 OE_CHR_THSA_DONE_1: "开城纳款：城仍属帝国，按年向苏丹纳款。"
 OE_CHR_THSA_DONE_2: "守住了：封锁四年，城始终没有屈服。"
 OE_CHR_THSA_DONE_3: "皇帝召回了皇子，第二朝廷没有成立。"
 OE_CHR_THSA_DONE_4: "皇子去世，第二朝廷随之瓦解。"
 OE_CHR_THSA_DONE_5: "奥斯曼人的威胁消失，第二朝廷随之结束。"
 OE_CHR_THSA_DONE_6: "塞萨洛尼基在战争中失去，第二朝廷随之结束。"
 OE_CHR_THSA_DONE_7: "奥斯曼人的大军始终没有到来，皇子回到了京城。"
 OE_CHR_THSA_RUN_0: "围城中：城心#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!，已封锁#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!个月。"
 OE_CHR_THSA_RUN_1: "皇子在塞萨洛尼基自立朝廷，奥斯曼人尚未兵临城下。"
 OE_CHR_THSA_RUN_2: "皇子出走塞萨洛尼基，帝国正在权衡。"
 OE_CHR_THSA_WAIT_0: "1376年起，被越过继承的皇子可能出走塞萨洛尼基。"
 OE_CHR_THSA_WAIT_1: "等待：皇子被越过继承，或奥斯曼人兵临马其顿；帝国拥有塞萨洛尼基，不在内战中。"
 OE_CHR_NAME_ALB: "阿尔巴尼亚与斯坎德培"
 OE_CHR_NAME_ALB_TT: "#F 1385年萨夫拉之战后，阿尔巴尼亚诸侯向苏丹称臣；威尼斯人陆续拿下都拉斯、莱什与斯库台；1443年起斯坎德培据克鲁亚抗击苏丹，1468年死于莱什；十年后克鲁亚、斯库台相继陷落。#!"
 OE_CHR_ALB_VOID_0: "到1480年，萨夫拉与都拉斯的事都没有照史实发生。"
 OE_CHR_ALB_DONE_0: "[GetCountry('BYZ').Custom('OeAlbSavra')][GetCountry('BYZ').Custom('OeAlbDurres')]"
 OE_CHR_ALB_RUN_0: "[GetCountry('BYZ').Custom('OeAlbSavra')][GetCountry('BYZ').Custom('OeAlbDurres')]"
 OE_CHR_ALB_WAIT_0: "1385年夏起，阿尔巴尼亚可能有一场大战；1390年夏起，都拉斯的主人可能把城卖掉。"
 OE_CHR_NAME_J7: "长房之争"
 OE_CHR_NAME_J7_TT: "#F 1390年春，安德洛尼卡四世之子约翰七世借苏丹之力夺取京城，约翰五世退守金门一带的城堡；同年秋，曼努埃尔带着几条船回来，老皇帝复位。1399年叔侄和解。#!"
 OE_CHR_J7_VOID_0: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_VOID_1: "1395年以前，安德洛尼卡一系没有人起来争位。"
