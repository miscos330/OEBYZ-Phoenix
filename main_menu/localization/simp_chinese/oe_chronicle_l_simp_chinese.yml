 OE_CHR_ILK2_WAIT_0: "1357年起，金帐汗国的札尼别可能南下；之后是札剌亦儿入主大不里士（1358年）、穆什之战（1366年）、脱脱迷失劫大不里士（1385年）和帖木儿西征（1393年起）。"
 OE_CHR_NAME_EMDC: "吕西尼昂的塞浦路斯"
 OE_CHR_NAME_EMDC_TT: "#F 1358年雨果四世把王位传给儿子彼得一世；1365年彼得一世从罗得岛出兵劫掠亚历山大；1373年前后热那亚人夺取了法马古斯塔；1426年马穆鲁克人在希罗基蒂亚俘虏了国王雅努斯，塞浦路斯从此向开罗纳贡；1442年摩里亚专制公之女海伦娜嫁给国王约翰二世；1464年詹姆斯二世从热那亚人手里收回了法马古斯塔。#!"
 OE_CHR_EMDC_VOID_0: "塞浦路斯王国已不存在、改了信仰、归入帝国一方，或失去了本岛，这一段不会照史实发生。"
 OE_CHR_EMDC_VOID_1: "彼得一世即位、劫掠亚历山大、法马古斯塔易手、希罗基蒂亚和联姻，都没有照史实发生。"
