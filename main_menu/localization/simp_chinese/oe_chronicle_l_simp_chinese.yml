 OE_CHR_S37_WAIT_0: "开局后的第二个月起排期。"
 OE_CHR_NAME_HES: "静修派之争"
 OE_CHR_NAME_HES_TT: "#F 1337年起，修士巴拉姆与格里高利·帕拉马斯就静修之道争论不休；1341年6月，君士坦丁堡的宗教会议作出裁断。#!"
 OE_CHR_HES_VOID_0: "开局的静修派争论没有发生，1341年的宗教会议也就不会召开。"
 OE_CHR_HES_DONE_0: "1341年6月的宗教会议站在帕拉马斯一边，巴拉姆离开了帝国。"
 OE_CHR_HES_DONE_1: "1341年6月的宗教会议站在巴拉姆一边，帕拉马斯被迫退隐。"
 OE_CHR_HES_DONE_2: "1341年6月的宗教会议已经作出裁断。"
 OE_CHR_HES_RUN_0: "巴拉姆与静修派的争论正在发酵；1341年6月起召开宗教会议作出裁断。"
 OE_CHR_HES_WAIT_0: "开局后不久，巴拉姆与静修派的争论就会公开。"
 OE_CHR_NAME_ITP: "意大利商约"
 OE_CHR_NAME_ITP_TT: "#F 威尼斯、热那亚、比萨、拉古萨在帝国各有特权；15世纪里，与威尼斯的条约几乎照抄1390年的旧约，一再续订。#!"
 OE_CHR_ITP_VOID_0: "君士坦丁堡已不在帝国手中，各家的特权无从谈起。"
