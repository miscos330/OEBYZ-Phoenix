 OE_CHR_THSA_DONE_5: "奥斯曼人的威胁消失，第二朝廷随之结束。"
 OE_CHR_THSA_DONE_6: "塞萨洛尼基在战争中失去，第二朝廷随之结束。"
 OE_CHR_THSA_DONE_7: "奥斯曼人的大军始终没有到来，皇子回到了京城。"
