 OE_CHR_EMDC_WAIT_0: "1358年秋起，塞浦路斯的王位可能易主；之后是亚历山大（1365年）、法马古斯塔（1373年）、希罗基蒂亚（1426年）和求亲（1440年）。"
 OE_CHR_NAME_EMDW: "瓦拉几亚的君侯"
 OE_CHR_NAME_EMDW_TT: "#F 1364年前后，瓦拉几亚君侯开始资助圣山的库特卢穆修道院；1394年秋或1395年5月，米尔恰在罗维纳迎战苏丹巴耶济德，胜负各家说法不一；1409年前后，米尔恰与争位的王子穆萨结盟；1416年米尔恰又出兵帮助争位的穆斯塔法，事后苏丹出兵报复，瓦拉几亚开始纳贡。#!"
 OE_CHR_EMDW_VOID_0: "瓦拉几亚已不存在、改了信仰、由玩家执掌，或已归入帝国一方，这一段不会照史实发生。"
 OE_CHR_EMDW_VOID_1: "圣山的捐赠、罗维纳、空位期里的结盟和苏丹的报复，都没有照史实发生。"
