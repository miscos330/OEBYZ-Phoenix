 OE_CHR_NAME_GEO: "格鲁吉亚王国"
 OE_CHR_NAME_GEO_TT: "#F 1357年，牧首签署文件，圣山的伊维隆修道院从此不归格鲁吉亚人掌管。1367年，特拉比松皇帝的长女安娜嫁给格鲁吉亚国王巴格拉特五世。1386年11月，帖木儿攻破第比利斯，俘虏国王一家；此后近二十年帖木儿一再入侵，史家数作八次，1401年格鲁吉亚纳贡求和。1412年黑羊部在查拉甘大败格鲁吉亚，1440年复活节又洗劫第比利斯。1439年，格鲁吉亚的主教没有在佛罗伦萨的合一诏书上签字。1449至1451年，君士坦丁十一世遣使到特拉比松和格鲁吉亚求亲，定下格鲁吉亚的公主；1452年迎亲的船没能出发，次年京城陷落。1463年，巴格拉特在奇霍里击败乔治八世，加冕为伊梅列季国王；1465年，萨姆茨赫的阿塔贝格克瓦克瓦雷二世在帕拉瓦尼湖畔俘虏乔治八世，萨姆茨赫从此脱离王国，统一的格鲁吉亚就此分裂。#!"
 OE_CHR_GEO_VOID_0: "格鲁吉亚已不存在、改了信仰、已归入帝国一方，或帝国自己进了格鲁吉亚：这一段不会照史实发生。"
 OE_CHR_GEO_VOID_1: "伊维隆、两次联姻、帖木儿的入侵、黑羊部、佛罗伦萨、皇帝的求亲和王国的分裂，都没有照史实发生。"
