 OE_CHR_NAME_BEY: "突厥诸侯"
 OE_CHR_NAME_BEY_TT: "#F 1348年艾登的乌穆尔战死在士麦那城下；1390年巴耶济德收服西安纳托利亚诸侯，1402年帖木儿又让诸侯复国；1443年卡拉曼起兵呼应十字军。#!"
 OE_CHR_BEY_VOID_0: "1348年前，西安纳托利亚的诸侯都已不在，帝国眼前没有了这些邻居。"
 OE_CHR_BEY_DONE_0: "[GetCountry('BYZ').Custom('OeBeyChrSea')][GetCountry('BYZ').Custom('OeBeyChrUmur')][GetCountry('BYZ').Custom('OeBeyChrStrait')][GetCountry('BYZ').Custom('OeBeyChrPhil')][GetCountry('BYZ').Custom('OeBeyChrGrace')][GetCountry('BYZ').Custom('OeBeyChrWill')][GetCountry('BYZ').Custom('OeBeyChrPact')]"
 OE_CHR_BEY_RUN_0: "[GetCountry('BYZ').Custom('OeBeyChrPhil')][GetCountry('BYZ').Custom('OeBeyChrGrace')][GetCountry('BYZ').Custom('OeBeyChrWill')][GetCountry('BYZ').Custom('OeBeyChrPact')]"
 OE_CHR_BEY_RUN_1: "[GetCountry('BYZ').Custom('OeBeyChrSea')][GetCountry('BYZ').Custom('OeBeyChrUmur')][GetCountry('BYZ').Custom('OeBeyChrStrait')][GetCountry('BYZ').Custom('OeBeyChrPhil')][GetCountry('BYZ').Custom('OeBeyChrGrace')]"
 OE_CHR_BEY_RUN_2: "[GetCountry('BYZ').Custom('OeBeyChrSea')][GetCountry('BYZ').Custom('OeBeyChrUmur')][GetCountry('BYZ').Custom('OeBeyChrStrait')]"
 OE_CHR_BEY_WAIT_0: "1339年春起，艾登的乌穆尔可能邀帝国同出黑海；此后诸侯的兴衰会陆续传来。"
 OE_CHR_NAME_TRE: "特拉比松的皇女"
 OE_CHR_NAME_TRE_TT: "#F 1339年特拉比松皇帝巴西尔另娶，冷落了皇后伊琳娜（安德洛尼卡三世之女）。1340年巴西尔暴卒，伊琳娜掌权；此后十年特拉比松几度易主，1349年在君士坦丁堡长大的巴西尔之子回国，次年加冕为阿莱克修斯三世。#!"
 OE_CHR_TRE_VOID_0: "到1342年皇女伊琳娜仍没能掌权，这段历史不会再来。"
 OE_CHR_TRE_VOID_1: "特拉比松已不存在，或成了别国的附庸。"
 OE_CHR_TRE_VOID_2: "特拉比松由玩家操控，本线不再进行。"
 OE_CHR_TRE_VOID_3: "帝国失去了君士坦丁堡。"
 OE_CHR_TRE_VOID_4: "特拉比松提前成了帝国的附庸，由附庸阶梯接手。"
 OE_CHR_TRE_VOID_5: "特拉比松的局面已与史实不同。"
 OE_CHR_TRE_DONE_0: "特拉比松成了帝国的朝贡国（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_DONE_1: "两国结为至亲之盟（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_DONE_2: "特拉比松的新君受封尊号（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_DONE_3: "新君加冕，帝国礼送而已（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_DONE_4: "皇子留在了君士坦丁堡，帝国没有插手。"
 OE_CHR_TRE_DONE_5: "皇女伊琳娜死于特拉比松的宫变。"
 OE_CHR_TRE_DONE_6: "无人可送，或时机已过；特拉比松的事没有了下文。"
 OE_CHR_TRE_RUN_0: "伊琳娜在位，豪族不服（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_RUN_1: "安娜·阿纳胡特卢在位（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_RUN_2: "伊琳娜一方保住了皇位（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_RUN_3: "约翰三世在位（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_RUN_4: "米海尔复位（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_RUN_5: "新君已在特拉比松，等待加冕（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_RUN_6: "特拉比松的局势正在展开（影响#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!）。"
 OE_CHR_TRE_WAIT_0: "皇女伊琳娜在特拉比松受了冷落；巴西尔仍在位。"
 OE_CHR_TRE_WAIT_1: "1339年起，看特拉比松皇帝巴西尔的婚事。"
 OE_CHR_TRE_WAIT_2: "等待巴西尔之死和皇女伊琳娜掌权（1339—1341年）。"
 OE_CHR_NAME_CIL: "奇里乞亚的亚美尼亚王国"
 OE_CHR_NAME_CIL_TT: "#F 1341年列翁四世遇刺，帝国的塞莱总督吕西尼昂的居伊东去为王；1375年马穆鲁克攻破西斯，奇里乞亚的亚美尼亚王国灭亡。#!"
 OE_CHR_CIL_VOID_0: "奇里乞亚已不存在。"
 OE_CHR_CIL_VOID_1: "西斯的最后一年没有到来：到1380年奇里乞亚与马穆鲁克已不接壤，或奇里乞亚一直在打仗。"
 OE_CHR_CIL_DONE_0: "奇里乞亚早已是帝国的附庸，躲过了1375年的劫难。"
 OE_CHR_CIL_DONE_1: "帝国保住了奇里乞亚，西斯没有陷落。"
 OE_CHR_CIL_DONE_2: "西斯陷落，奇里乞亚并入马穆鲁克；帝国为被俘的国王出了一份赎金。"
 OE_CHR_CIL_DONE_3: "西斯陷落，奇里乞亚并入马穆鲁克。"
 OE_CHR_CIL_DONE_4: "1375年的消息已经传到君士坦丁堡。"
 OE_CHR_CIL_RUN_0: "塞莱总督已东去为王；1375年起看西斯的命运。"
 OE_CHR_CIL_RUN_1: "奇里乞亚另立了新君；1375年起看西斯的命运。"
 OE_CHR_CIL_RUN_2: "列翁四世遇刺后，奇里乞亚的贵族会来迎塞莱总督（1343年底以前）。"
 OE_CHR_CIL_WAIT_0: "1341年9月起。"
 OE_CHR_NAME_LAT: "十字军与骑士团"
 OE_CHR_NAME_LAT_TT: "#F 1344年教皇的同盟夺下士麦那港堡，1402年帖木儿又攻破了它；1399或1400年，摩里亚专制公把专制公国卖给罗得岛的医院骑士团，安卡拉之战后又赎了回来；1444年十字军在瓦尔纳大败，两年后奥斯曼人攻破六里墙。#!"
 OE_CHR_LAT_VOID_0: "同盟没有来邀帝国，骑士团没有来出价，教皇的十字军诏书也没有来。"
 OE_CHR_LAT_DONE_0: "[GetCountry('BYZ').Custom('OeLatSmyrna')][GetCountry('BYZ').Custom('OeLatMorea')][GetCountry('BYZ').Custom('OeLatFall')][GetCountry('BYZ').Custom('OeLatVarna')][GetCountry('BYZ').Custom('OeLatVarnaSide')]"
 OE_CHR_LAT_DONE_1: "[GetCountry('BYZ').Custom('OeLatSmyrna')][GetCountry('BYZ').Custom('OeLatMorea')][GetCountry('BYZ').Custom('OeLatFall')][GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_DONE_2: "[GetCountry('BYZ').Custom('OeLatSmyrna')][GetCountry('BYZ').Custom('OeLatMorea')][GetCountry('BYZ').Custom('OeLatVarna')][GetCountry('BYZ').Custom('OeLatVarnaSide')]"
 OE_CHR_LAT_DONE_3: "[GetCountry('BYZ').Custom('OeLatSmyrna')][GetCountry('BYZ').Custom('OeLatMorea')][GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_RUN_0: "骑士团替帝国守着摩里亚，已#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_morea_m').GetValue|0]#!个月。[GetCountry('BYZ').Custom('OeLatSmyrna')]"
 OE_CHR_LAT_RUN_1: "[GetCountry('BYZ').Custom('OeLatVarna')][GetCountry('BYZ').Custom('OeLatVarnaSide')]"
 OE_CHR_LAT_RUN_2: "[GetCountry('BYZ').Custom('OeLatSmyrna')][GetCountry('BYZ').Custom('OeLatMorea')][GetCountry('BYZ').Custom('OeLatFall')][GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_RUN_3: "[GetCountry('BYZ').Custom('OeLatSmyrna')][GetCountry('BYZ').Custom('OeLatMorea')][GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_WAIT_0: "1344年秋起，士麦那的同盟会来邀帝国；1397年起，骑士团可能为摩里亚出价；1442年起，教皇可能号召新的十字军。"
 OE_CHR_NAME_SER: "杜尚的帝国"
 OE_CHR_NAME_SER_TT: "#F 1346年斯特凡·杜尚在斯科普里加冕为“塞尔维亚人和罗马人的皇帝”；1355年死后帝国分裂，1371年马里查河一战，塞尔维亚诸侯败亡。#!"
 OE_CHR_SER_VOID_0: "塞尔维亚已不存在。"
 OE_CHR_SER_VOID_1: "杜尚没有称帝，塞尔维亚也没有占据塞莱，这段历史不会再来。"
 OE_CHR_SER_DONE_0: "马里查河之后：塞莱一带回到帝国。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! / #Y 5#!段。"
 OE_CHR_SER_DONE_1: "塞尔维亚已亡。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! / #Y 5#!段。"
 OE_CHR_SER_DONE_2: "塞莱已不在塞尔维亚手中，后续不会再来。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! / #Y 5#!段。"
 OE_CHR_SER_RUN_0: "杜尚在位。已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! / #Y 5#!段。"
 OE_CHR_SER_RUN_1: "杜尚已死，塞尔维亚帝国走向分裂。已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! / #Y 5#!段。"
 OE_CHR_SER_WAIT_0: "等待杜尚称帝，或塞尔维亚占据帝国的旧地。"
 OE_CHR_NAME_GAL: "加拉塔之争"
 OE_CHR_NAME_GAL_TT: "#F 1348年约翰六世降低君士坦丁堡的关税，与加拉塔的热那亚人开战；1352年博斯普鲁斯海战后，帝国被迫单独议和。#!"
 OE_CHR_GAL_VOID_0: "开局时没有加拉塔的热那亚人特权（不是1337年开局），本线不会开启。"
 OE_CHR_GAL_DONE_0: "“驱逐外夷”改革收回了加拉塔，特权随之取消。[GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_1: "热那亚已亡，加拉塔的特权随之消失。[GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_2: "加拉塔的关税特权已经废除。[GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_3: "加拉塔的特权受到削减：[ShowModifier('oe_s37_gal_curbed')]。[GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_4: "加拉塔的热那亚人保住了特权：[ShowModifier('oe_s37_galata')]。[GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_RUN_0: "等待关税改革（“加拉塔的关税”）。"
 OE_CHR_GAL_RUN_1: "热那亚人随时可能越过金角湾。"
 OE_CHR_GAL_RUN_2: "金角湾之战在即。"
 OE_CHR_GAL_RUN_3: "威尼斯可能提议结盟。"
 OE_CHR_GAL_RUN_4: "博斯普鲁斯海战在即。"
 OE_CHR_GAL_RUN_5: "加拉塔之争正在展开。"
 OE_CHR_GAL_WAIT_0: "1347年6月起，1341年内战平息之后开启。"
 OE_CHR_NAME_OTT: "奥斯曼人渡海"
 OE_CHR_NAME_OTT_TT: "#F 内战期间奥斯曼援军渡过海峡，此后不再离去；1354年苏莱曼帕夏据有加里波利，1366年萨伏伊伯爵一度夺回；1369年约翰五世西行求援。#!"
 OE_CHR_OTT_VOID_0: "奥斯曼已不存在。"
 OE_CHR_OTT_DONE_0: "奥斯曼已不存在。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! / #Y 4#!段。"
 OE_CHR_OTT_DONE_1: "萨伏伊伯爵的十字军和皇帝西行都已发生。经历了#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! / #Y 4#!段。"
 OE_CHR_OTT_RUN_0: "已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! / #Y 4#!段；萨伏伊伯爵的十字军和皇帝西行要到1365年以后。"
 OE_CHR_OTT_RUN_1: "已经历#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! / #Y 4#!段；其余要看奥斯曼是否占据加里波利和色雷斯。"
 OE_CHR_OTT_WAIT_0: "等待奥斯曼人在欧洲立足（内战时借来的援军），或1356年后奥尔汗的宫廷生变。"
 OE_CHR_NAME_L5: "瘟疫与色雷斯"
 OE_CHR_NAME_L5_TT: "#F 1347年黑死病随船进了君士坦丁堡，坎塔库泽诺斯最小的儿子安德罗尼卡死于疫中，此后瘟疫又回来过约十一次；1360年或1361年迪迪莫泰洪、1363年菲利普波利斯先后失守；1366年约翰五世亲到布达向匈牙利国王求援，空手而归；1369年前后（旧说早到1361年），阿德里安波利斯落入奥斯曼人之手；1371年塞莱的专制公求援不成，战死在马里查河畔。#!"
 OE_CHR_L5_VOID_0: "1372年以前，瘟疫进城、迪迪莫泰洪、布达之行、阿德里安波利斯和专制公的求援都没有照史实发生。"
 OE_CHR_L5_DONE_0: "[GetCountry('BYZ').Custom('OeL5Plague')][GetCountry('BYZ').Custom('OeL5Empty')][GetCountry('BYZ').Custom('OeL5Dem')][GetCountry('BYZ').Custom('OeL5Phi')][GetCountry('BYZ').Custom('OeL5Buda')][GetCountry('BYZ').Custom('OeL5Adr')][GetCountry('BYZ').Custom('OeL5Ugl')][GetCountry('BYZ').Custom('OeL5Ret')]"
 OE_CHR_L5_RUN_0: "[GetCountry('BYZ').Custom('OeL5Plague')][GetCountry('BYZ').Custom('OeL5Empty')][GetCountry('BYZ').Custom('OeL5Dem')][GetCountry('BYZ').Custom('OeL5Phi')][GetCountry('BYZ').Custom('OeL5Buda')][GetCountry('BYZ').Custom('OeL5Adr')][GetCountry('BYZ').Custom('OeL5Ugl')][GetCountry('BYZ').Custom('OeL5Ret')]"
 OE_CHR_L5_WAIT_0: "1346年秋起，瘟疫可能随船进城；之后是迪迪莫泰洪（1359年起）、菲利普波利斯（1362年起）、布达之行（1365年起）、阿德里安波利斯（1366年起）和专制公的求援（1370年起）。"
 OE_CHR_NAME_MO: "摩里亚专制公国"
 OE_CHR_NAME_MO_TT: "#F 1349年曼努埃尔·坎塔库泽诺斯出任摩里亚专制公。此后一百年，米斯特拉是帝国在伯罗奔尼撒的中心：1415年重修六里墙，1430年前后几乎收复整个半岛。#!"
 OE_CHR_MO_VOID_0: "摩里亚已另立为国，本线停止。"
 OE_CHR_MO_VOID_1: "米斯特拉不在帝国手中，本线暂停；收复之后恢复。"
 OE_CHR_MO_DONE_0: "百年已过，摩里亚仍是帝国的专制公国。[GetCountry('BYZ').Custom('OeChrMoWall')]"
 OE_CHR_MO_DONE_1: "百年已过，摩里亚仍在帝国手中。[GetCountry('BYZ').Custom('OeChrMoWall')]"
 OE_CHR_MO_DONE_2: "米斯特拉已经失去。"
 OE_CHR_MO_RUN_0: "专制公国已经设立。[GetCountry('BYZ').Custom('OeChrMoWall')]已发生#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#!件定时事件。"
 OE_CHR_MO_RUN_1: "没有册封专制公，由凯法勒治理。[GetCountry('BYZ').Custom('OeChrMoWall')]已发生#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#!件定时事件。"
 OE_CHR_MO_RUN_2: "错过了册封专制公的时机，其余篇章照常展开。[GetCountry('BYZ').Custom('OeChrMoWall')]已发生#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#!件定时事件。"
 OE_CHR_MO_RUN_3: "可以册封摩里亚专制公了（1352年底以前）。"
 OE_CHR_MO_WAIT_0: "1348年6月起，可以册封摩里亚专制公。"
 OE_CHR_NAME_CW2: "1352年内战"
 OE_CHR_NAME_CW2_TT: "#F 1352年马修·坎塔库泽诺斯与约翰五世再起战端；奥斯曼援军在季迪莫提洪击败塞尔维亚人。1354年约翰五世入城，约翰六世退位为修士。#!"
 OE_CHR_CW2_VOID_0: "导火索中途熄灭：当事人离世、失势，或已过1365年。"
 OE_CHR_CW2_VOID_1: "1365年前没有爆发，这场内战不会再来。"
 OE_CHR_CW2_VOID_2: "1341年内战没有发生，也就没有第二次。"
 OE_CHR_CW2_VOID_3: "约翰·坎塔库泽诺斯已经去世或出家。"
 OE_CHR_CW2_VOID_4: "马修·坎塔库泽诺斯已经去世。"
 OE_CHR_CW2_VOID_5: "约翰五世已经去世。"
 OE_CHR_CW2_VOID_6: "约翰五世或坎塔库泽诺斯父子已不在帝国。"
 OE_CHR_CW2_DONE_0: "巴列奥略一方得胜：约翰五世独掌皇位，坎塔库泽诺斯出家（打了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#!个月）。"
 OE_CHR_CW2_DONE_1: "约翰六世主动退位，约翰五世即位，没有开战。"
 OE_CHR_CW2_DONE_2: "坎塔库泽诺斯家族保住了皇冠。"
 OE_CHR_CW2_DONE_3: "两帝分治：打了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#!个月后划界。"
 OE_CHR_CW2_DONE_4: "没有开战：两家勉强和睦。"
 OE_CHR_CW2_RUN_0: "内战第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#!个月：大势#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_tide').GetValue|0]#! / #Y 100#!（#Y 100#! = 巴列奥略一方获胜，#Y 0#! = 坎塔库泽诺斯家族获胜）。"
