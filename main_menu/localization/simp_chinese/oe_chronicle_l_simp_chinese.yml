 OE_CHR_NAME_CRMG: "加扎里亚的扩张"
 OE_CHR_NAME_CRMG_TT: "#F 1365年，卡法的热那亚人趁金帐汗国大乱取了索尔代亚；1380年至1381年，汗的长官把哥特亚海岸让给热那亚；十四世纪八十年代中，卡法与草原上的长官在索尔哈特一带交战，1387年夏议和。#!"
 OE_CHR_CRMG_VOID_0: "卡法已不在热那亚一方手里、已归入帝国一方，或热那亚、加扎里亚由玩家执掌，这一段不会照史实发生。"
 OE_CHR_CRMG_VOID_1: "索尔代亚易手、哥特亚海岸的割让和索尔哈特之战，都没有照史实发生。"
