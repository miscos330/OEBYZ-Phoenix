 OE_CHR_NAME_VAS: "臣属苏丹"
 OE_CHR_NAME_VAS_TT: "#F 马里查河之战后，约翰五世向穆拉德一世称臣纳贡；1376年长子安德洛尼卡四世借热那亚人和奥斯曼人之力篡位，1379年约翰五世复位。#!"
 OE_CHR_VAS_VOID_0: "奥斯曼已不存在。"
 OE_CHR_VAS_VOID_1: "奥斯曼家族已归化帝国，没有苏丹来索贡。"
 OE_CHR_VAS_VOID_2: "帝国三次拒绝苏丹，苏丹不再提起。"
 OE_CHR_VAS_VOID_3: "帝国正当中兴，苏丹无从索贡；只要中兴不衰，这段历史不会发生。"
 OE_CHR_VAS_VOID_4: "1394年前帝国没有臣属苏丹，这段历史不会再来。"
 OE_CHR_VAS_DONE_0: "苏丹的怒火：臣属破裂，停战取消。[GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_1: "挣脱枷锁：奥斯曼不再强于帝国，臣属结束。[GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_2: "奥斯曼覆灭，臣属随之结束。[GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_3: "奥斯曼家族归化帝国，臣属随之结束。[GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_4: "到了1394年，臣属悄然结束。[GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_RUN_0: "篡位之战：大势#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_tide').GetValue|0]#! / #Y 100#!（#Y 100#! = 篡位者败亡，#Y 0#! = 篡位者入城）。"
 OE_CHR_VAS_RUN_1: "篡位者在位，老皇帝被囚。"
 OE_CHR_VAS_RUN_2: "老皇帝复位，篡位者退守加拉塔。"
 OE_CHR_VAS_RUN_3: "臣属苏丹：苏丹的耐心#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_patience').GetValue|0]#! / #Y 100#!。[GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_WAIT_0: "帝国拒绝了苏丹的条件（#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_asks').GetValue|0]#!次），过几年苏丹会再提；拒绝满#Y 3#!次就不再提。"
 OE_CHR_VAS_WAIT_1: "帝国以西方援助为由拖延，两年后苏丹再提。"
 OE_CHR_VAS_WAIT_2: "1371年起，奥斯曼据有色雷斯、兵力远超帝国时，苏丹会提出条件。"
 OE_CHR_VAS_WAIT_3: "等待：奥斯曼据有色雷斯，兵力超过帝国的#Y 1.5#!倍，帝国不在内战中。"
 OE_CHR_NAME_SMD: "塞尔维亚与多瑙河防线"
 OE_CHR_NAME_SMD_TT: "#F 杜尚死后，塞尔维亚帝国四分五裂；1389年拉扎尔与苏丹穆拉德死于科索沃，塞尔维亚成了苏丹的纳贡国；此后的专制公国守着多瑙河，直到1459年斯梅代雷沃开城。#!"
 OE_CHR_SMD_VOID_0: "塞尔维亚已不存在，这段历史不会再来。"
 OE_CHR_SMD_VOID_1: "塞尔维亚已归帝国一方，这段历史不会再来。"
 OE_CHR_SMD_DONE_0: "[GetCountry('BYZ').Custom('OeSmdSouth')][GetCountry('BYZ').Custom('OeSmdKos')]"
 OE_CHR_SMD_RUN_0: "[GetCountry('BYZ').Custom('OeSmdSouth')][GetCountry('BYZ').Custom('OeSmdKos')]"
 OE_CHR_SMD_WAIT_0: "1371年秋起，杜尚帝国南方的诸侯可能向苏丹称臣；1389年夏起是科索沃。"
 OE_CHR_NAME_ECC: "教会的和解"
 OE_CHR_NAME_ECC_TT: "#F 1375年，君士坦丁堡撤销对塞尔维亚教会的绝罚，承认佩奇的牧首；1393年特尔诺沃陷落，次年保加利亚的教区归入普世牧首区。#!"
 OE_CHR_ECC_VOID_0: "京城失守，这段历史不会再来。"
 OE_CHR_ECC_VOID_1: "普世牧首区被解散，这段历史不会再来。"
 OE_CHR_ECC_VOID_2: "帝国已不领导普世牧首区。"
 OE_CHR_ECC_VOID_3: "塞尔维亚没有来求和解，特尔诺沃的教区问题也没有出现，这段历史不会再来。"
 OE_CHR_ECC_DONE_0: "[GetCountry('BYZ').Custom('OeEccChrSerbia')][GetCountry('BYZ').Custom('OeEccChrTarnovo')]"
 OE_CHR_ECC_RUN_0: "已与塞尔维亚教会和解，等待保加利亚的教区问题。"
 OE_CHR_ECC_RUN_1: "佩奇已降回大主教区，等待保加利亚的教区问题。"
 OE_CHR_ECC_RUN_2: "拒绝了佩奇的使团，十年后对方可能再来。"
 OE_CHR_ECC_RUN_3: "[GetCountry('BYZ').Custom('OeEccChrSerbia')][GetCountry('BYZ').Custom('OeEccChrTarnovo')]"
 OE_CHR_ECC_WAIT_0: "塞尔维亚没有来求和解；等待特尔诺沃的变故。"
 OE_CHR_ECC_WAIT_1: "等待杜尚之后的塞尔维亚来求和解，或特尔诺沃的变故。"
 OE_CHR_NAME_LAT3: "两位教皇"
 OE_CHR_NAME_LAT3_TT: "#F 1378年，十三位枢机在丰迪另选了一位教皇，西方从此有了两位教皇，各国分站两边；1417年康斯坦茨的会议选出马丁五世，大分裂才告结束。#!"
 OE_CHR_LAT3_VOID_0: "分裂结束时教廷已不复存在。"
 OE_CHR_LAT3_VOID_1: "1402年以前西方的教会没有分裂，帝国也就无从表态。"
 OE_CHR_LAT3_DONE_0: "[GetCountry('BYZ').Custom('OeLatSchism')]"
 OE_CHR_LAT3_RUN_0: "[GetCountry('BYZ').Custom('OeLatSchism')]"
 OE_CHR_LAT3_WAIT_0: "1360年以后，教皇选举时西方的教会可能分裂。"
 OE_CHR_NAME_LGR1: "纳瓦拉人与阿恰约利"
 OE_CHR_NAME_LGR1_TT: "#F 1379年，纳瓦拉佣兵团的一队人马攻破底比斯，随后兵团入主亚该亚；1388年，佛罗伦萨人内里奥·阿恰约利取得雅典卫城；1394年内里奥去世，摩里亚的专制公一两年后买下了科林斯。1383年克里斯波家夺得群岛公国，1390年内格罗蓬特全岛归了威尼斯；1404年阿尔卡迪亚的领主琴图廖内买下亚该亚的亲王号，兵团当家的日子到此为止。1444年，专制公趁苏丹北顾出兵中希腊，雅典公爵向帝国纳贡。#!"
 OE_CHR_LGR1_VOID_0: "纳瓦拉兵团没有入主亚该亚，阿恰约利家也没有取得雅典：这一段没有照史实发生。"
 OE_CHR_LGR1_VOID_1: "亚该亚公国已不存在，雅典也不在拉丁人手里，这一段不会照史实发生。"
