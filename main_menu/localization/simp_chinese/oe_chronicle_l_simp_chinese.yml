 OE_CHR_GEO_WAIT_0: "1356年起，圣山伊维隆修道院的两个修团要请牧首裁断；之后是特拉比松的两次联姻（1367年、1377年）、帖木儿的入侵（1386年冬起）、黑羊部（1412年、1440年）、佛罗伦萨（1439年）和皇帝的求亲（1449年秋起），最后是王国的分裂（1463年起）。"
 OE_CHR_NAME_LGR2: "伊庇鲁斯与色萨利"
 OE_CHR_NAME_LGR2_TT: "#F 1348年塞尔维亚取走伊庇鲁斯和色萨利；杜尚死后，西缅·乌罗斯在特里卡拉称帝，尼基福罗斯二世回到阿尔塔，1359年在阿刻罗俄斯河边战死，阿尔塔从此归了阿尔巴尼亚人。约阿尼纳另立专制公，色萨利后来由凯撒菲兰斯罗佩诺斯统治。1385年佛罗伦萨人埃萨乌入主约阿尼纳；1393年前后，奥斯曼人取了色萨利和萨洛纳。托科家1411年入主约阿尼纳，1416年取阿尔塔；1430年约阿尼纳向苏丹开了城门。#!"
 OE_CHR_LGR2_VOID_0: "帝国守住了伊庇鲁斯和色萨利，西部没有照史实易主。"
