 OE_CHR_J7_RUN_1: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_WAIT_0: "1386年起，若安德洛尼卡一系还有成年男子在帝国中，长房可能心怀怨望。"
 OE_CHR_NAME_BYD: "巴耶济德封锁"
 OE_CHR_NAME_BYD_TT: "#F 1394年起巴耶济德一世封锁君士坦丁堡；1396年十字军在尼科波利斯惨败；1399年曼努埃尔二世西行求援；1402年安卡拉之战后围城解除。#!"
 OE_CHR_BYD_VOID_0: "封锁中途作废：奥斯曼家族已归化帝国。"
 OE_CHR_BYD_VOID_1: "奥斯曼已不存在。"
 OE_CHR_BYD_VOID_2: "奥斯曼家族已归化帝国，不会有封锁。"
 OE_CHR_BYD_VOID_3: "空位期先到了，苏丹无力封锁京城。"
 OE_CHR_BYD_VOID_4: "帝国正当中兴，苏丹无力封锁京城；只要中兴不衰，这段历史不会发生。"
 OE_CHR_BYD_VOID_5: "到1420年也没有苏丹封锁京城，这段历史不会再来。"
 OE_CHR_BYD_DONE_0: "交给空位期：苏丹自顾不暇，围城#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月后解除。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_1: "封锁瓦解：苏丹再也围不住京城，围城#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_2: "议和纳贡：帝国接受了苏丹的条件，围城#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_3: "京城失守，封锁随之结束。"
 OE_CHR_BYD_RUN_0: "封锁已解，京城正在收拾残局。"
 OE_CHR_BYD_RUN_1: "已围#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月；粮储#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#!，城心#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#!。[GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_WAIT_0: "帝国应了苏丹的召见，封锁暂时推迟。"
 OE_CHR_BYD_WAIT_1: "等待：1394年起；若苏丹之怒已经发作，1385年起即可。"
 OE_CHR_BYD_WAIT_2: "等待：奥斯曼兵临京城，兵力超过帝国的#Y 1.5#!倍。"
 OE_CHR_NAME_CRMF: "哥特亚的君主"
 OE_CHR_NAME_CRMF_TT: "#F 约1395年，山上的狄奥多罗城被蛮族攻破；十五世纪二十年代，君主阿莱克修斯重修城池，在海边筑起卡拉米塔港；1433年琴巴洛的希腊人起事投向哥特亚，次年热那亚舰队夺回琴巴洛，随后在索尔哈特附近溃败。#!"
 OE_CHR_CRMF_VOID_0: "狄奥多罗已不存在、改了信仰、由玩家执掌、已归入帝国一方，或丢了都城，这一段不会照史实发生。"
 OE_CHR_CRMF_VOID_1: "狄奥多罗城的浩劫、重建和琴巴洛之役，都没有照史实发生。"
 OE_CHR_CRMF_DONE_0: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmLament')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_DONE_1: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_RUN_0: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmLament')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_RUN_1: "[GetCountry('BYZ').Custom('OeCrmRuin')][GetCountry('BYZ').Custom('OeCrmAlexios')][GetCountry('BYZ').Custom('OeCrmKin')][GetCountry('BYZ').Custom('OeCrmLom')][GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_WAIT_0: "1395年起，狄奥多罗城可能遭劫；之后是哥特亚的求亲（1424年）、城池的重建（1425年）和琴巴洛之役（1434年）。"
 OE_CHR_NAME_IVR: "奥斯曼空位期"
 OE_CHR_NAME_IVR_TT: "#F 1402年帖木儿在安卡拉俘获巴耶济德一世，奥斯曼王子们争位十一年；1403年的加里波利条约把塞萨洛尼基和沿海城市还给帝国。#!"
 OE_CHR_IVR_VOID_0: "押宝中途终止：奥斯曼已不存在，或奥斯曼家族已归化帝国。"
 OE_CHR_IVR_VOID_1: "奥斯曼已不存在。"
 OE_CHR_IVR_VOID_2: "奥斯曼家族已归化帝国，不会有空位期。"
 OE_CHR_IVR_DONE_0: "加里波利条约：收回沿海城市，不再纳贡。"
 OE_CHR_IVR_DONE_1: "签了加里波利条约，新苏丹清算之后又重新纳贡。"
 OE_CHR_IVR_DONE_2: "帝国没有押宝，或没有签成条约。"
 OE_CHR_IVR_RUN_0: "王子们争位已#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月；帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 OE_CHR_IVR_RUN_1: "安卡拉的消息已经传来，帝国正在权衡。"
 OE_CHR_IVR_WAIT_0: "等待：苏丹被帖木儿俘获（史实为1402年安卡拉之战）。"
 OE_CHR_IVR_WAIT_1: "等待：苏丹被俘，或奥斯曼陷入内战。"
 OE_CHR_NAME_DSP: "塞尔维亚的专制公"
 OE_CHR_NAME_DSP_TT: "#F 1402年安卡拉之战后，塞尔维亚的斯特凡·拉扎列维奇取道君士坦丁堡，受封专制公；塞尔维亚从此被称作专制公国。#!"
 OE_CHR_DSP_VOID_0: "安卡拉之后的两年里，没有合格的巴尔干正教君主来朝，或帝国自顾不暇。"
 OE_CHR_DSP_VOID_1: "奥斯曼已不存在，或奥斯曼家族已归化帝国，不会有安卡拉之后的来客。"
 OE_CHR_DSP_DONE_0: "[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主在布拉赫内宫受封专制公。"
 OE_CHR_DSP_DONE_1: "[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主受封塞巴斯托克拉托。"
 OE_CHR_DSP_DONE_2: "帝国设宴款待[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主，没有授予尊号。"
 OE_CHR_DSP_DONE_3: "安卡拉之战时，[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName]的君主已是帝国册封的专制公。"
 OE_CHR_DSP_RUN_0: "帝国正陷于内战，或不在君士坦丁堡；来客暂时不会来。"
 OE_CHR_DSP_RUN_1: "安卡拉的消息传来后两年内，可能有巴尔干的正教君主来朝。"
 OE_CHR_DSP_WAIT_0: "等待奥斯曼空位期开始（史实为1402年安卡拉之战之后）。"
 OE_CHR_NAME_THSM: "穆斯塔法之乱"
 OE_CHR_NAME_THSM_TT: "#F 1416年前后，奥斯曼王子穆斯塔法兵败逃到塞萨洛尼基，被帝国软禁；1421年苏丹去世，帝国放此人出来争位，1422年兵败被杀；1424年帝国重新向苏丹纳贡。#!"
 OE_CHR_THSM_VOID_0: "帝国把来投的王子交还了苏丹。"
 OE_CHR_THSM_VOID_1: "帝国把来投的王子礼送出境。"
 OE_CHR_THSM_VOID_2: "看管中的王子去世或离开了帝国。"
 OE_CHR_THSM_VOID_3: "看管到1440年，苏丹仍未换人。"
 OE_CHR_THSM_VOID_4: "1440年前没有奥斯曼王子来投。"
 OE_CHR_THSM_DONE_0: "押中：王子登上苏丹之位，帝国不再纳贡。"
 OE_CHR_THSM_DONE_1: "中途改押苏丹，站在了胜者一边。"
 OE_CHR_THSM_DONE_2: "押错：1424年议和，帝国重新纳贡。"
 OE_CHR_THSM_DONE_3: "押错：帝国拒绝了1424年的和约。"
 OE_CHR_THSM_DONE_4: "押错：新苏丹兴兵问罪。"
 OE_CHR_THSM_DONE_5: "帝国把王子交给了新苏丹。"
 OE_CHR_THSM_DONE_6: "争位无果，或帝国始终观望。"
 OE_CHR_THSM_RUN_0: "争位已#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月；帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 OE_CHR_THSM_RUN_1: "帝国看管着一位奥斯曼王子，等待苏丹换代。"
 OE_CHR_THSM_WAIT_0: "1410年起（或奥斯曼空位期结束后），失意的奥斯曼王子可能来投。"
 OE_CHR_THSM_WAIT_1: "等待：失意的奥斯曼王子来投；没有押宝在进行，两国不在交战。"
 OE_CHR_NAME_THSD: "塞萨洛尼基的封锁"
 OE_CHR_NAME_THSD_TT: "#F 1422年奥斯曼人封锁塞萨洛尼基；1423年专制公安德洛尼卡把城交给威尼斯；1430年3月穆拉德二世攻破此城。#!"
 OE_CHR_THSD_VOID_0: "封锁的时机到来时，塞萨洛尼基已不在帝国手中。"
 OE_CHR_THSD_VOID_1: "1453年前没有发生封锁。"
 OE_CHR_THSD_DONE_0: "交给了威尼斯；后来城还是落入奥斯曼人之手。"
 OE_CHR_THSD_DONE_1: "交给了威尼斯，由威尼斯防守。"
 OE_CHR_THSD_DONE_2: "城心耗尽，城归奥斯曼人。"
 OE_CHR_THSD_DONE_3: "城心耗尽，城仍属帝国，按年向苏丹纳款。"
 OE_CHR_THSD_DONE_4: "守住了：封锁五年，城始终没有屈服。"
 OE_CHR_THSD_DONE_5: "帝国出钱，苏丹解围。"
 OE_CHR_THSD_DONE_6: "塞萨洛尼基在战争中失去。"
 OE_CHR_THSD_DONE_7: "奥斯曼人的威胁消失，封锁结束。"
 OE_CHR_THSD_RUN_0: "封锁中：城心#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!，已封锁#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!个月；[GetCountry('BYZ').Custom('OeThsVenOk')]。"
 OE_CHR_THSD_WAIT_0: "等待：押错了穆斯塔法、拒绝了1424年的和约，或与奥斯曼交战时城的四周被合围。"
 OE_CHR_NAME_LAT4: "佛罗伦萨之后的教廷"
 OE_CHR_NAME_LAT4_TT: "#F 1439年12月，教皇在佛罗伦萨封尼西亚的贝萨里翁、基辅的伊西多尔为枢机；伊西多尔还受命为教廷在立陶宛、利沃尼亚和罗斯的使节。#!"
 OE_CHR_LAT4_VOID_0: "佛罗伦萨的合一没有签成，教皇也就没有派人来问帝国。"
 OE_CHR_LAT4_DONE_0: "[GetCountry('BYZ').Custom('OeLatHats')][GetCountry('BYZ').Custom('OeLatCouncil')]"
 OE_CHR_LAT4_RUN_0: "教皇的使者可能随时来问帝国怎样看待两位希腊枢机。[GetCountry('BYZ').Custom('OeLatCouncil')]"
 OE_CHR_LAT4_WAIT_0: "1439年12月以后、合一签署以后，教皇会派人来。"
 OE_CHR_NAME_L7: "最后的围城"
 OE_CHR_NAME_L7_TT: "#F 1452年穆罕默德二世在海峡欧洲一岸修起堡垒；1453年4月起围攻君士坦丁堡，5月29日城破，君士坦丁十一世战死。#!"
 OE_CHR_L7_VOID_0: "帝国正当中兴，苏丹无力围城；只要中兴不衰，最后的围城不会到来。"
 OE_CHR_L7_VOID_1: "到1480年底，苏丹没有来围城：这一局里京城没有经历最后的围攻。"
 OE_CHR_L7_DONE_0: "[GetCountry('BYZ').Custom('OeL7End')][GetCountry('BYZ').Custom('OeL7Emp')]"
 OE_CHR_L7_RUN_0: "[GetCountry('BYZ').Custom('OeL7Run')]"
 OE_CHR_L7_WAIT_0: "等待：1440至1480年间，奥斯曼兵力达到帝国的#Y 2.5#!倍以上、占着阿德里安波利斯并与京城接壤，而帝国除京城外还有别的地。"
 OE_CHR_NAME_AEG: "爱琴海诸领主"
 OE_CHR_NAME_AEG_TT: "#F 1346年热那亚人夺取希俄斯与福恰，出钱的股东结成“马奥纳”；1355年加蒂卢西奥家得到莱斯沃斯，此后四代与巴列奥略家结亲；1462年米蒂利尼陷落。#!"
 OE_CHR_AEG_VOID_0: "到1463年，希俄斯与莱斯沃斯的事都没有照史实发生：没有维尼奥索的舰队，没有马奥纳，加蒂卢西奥家也没有得到莱斯沃斯。"
 OE_CHR_AEG_DONE_0: "[GetCountry('BYZ').Custom('OeAegChios')][GetCountry('BYZ').Custom('OeAegGat')]"
 OE_CHR_AEG_RUN_0: "[GetCountry('BYZ').Custom('OeAegChios')][GetCountry('BYZ').Custom('OeAegGat')]"
 OE_CHR_AEG_WAIT_0: "1346年夏起，热那亚人的舰队可能来到希俄斯；1355年起，一个热那亚冒险家可能来求亲求岛。"
 OE_CHR_H_OECHRVASHEIR_0: "继承之约：长子一系承继。"
 OE_CHR_H_OECHRVASHEIR_1: "继承之约：坚持次子为储。"
 OE_CHR_H_OECHRVASHEIR_2: "篡位者曾经入城，老皇帝已复位。"
 OE_CHR_H_OECHRVASHEIR_3: "篡位者曾经入城。"
 OE_CHR_H_OECHRVASHEIR_4: ""
 OE_CHR_H_OECHRMOWALL_0: "六里墙屹立。"
 OE_CHR_H_OECHRMOWALL_1: ""
 OE_CHR_H_OECHRGALDUES_0: "君士坦丁堡的低关税仍在：[ShowModifier('oe_s37_gal_dues')]。"
 OE_CHR_H_OECHRGALDUES_1: ""
