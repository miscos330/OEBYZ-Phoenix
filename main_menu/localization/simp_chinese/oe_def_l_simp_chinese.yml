 country_description_category_name_oe_cdc_eastern_roman:0 "东罗马帝国正统"
 country_description_category_desc_oe_cdc_eastern_roman:0 "扎根于罗马法统、近卫大区体制与地中海光复大业的帝国政权，自君士坦丁堡远播至赫拉克勒斯之柱。"
 country_description_category_name_oe_cdc_celestial_yuan:0 "大元天命双轨汗廷"
 country_description_category_desc_oe_cdc_celestial_yuan:0 "兼具成吉思汗系草原宗主权、中原典册行政与东亚远洋朝贡秩序的跨欧亚天命帝国。"
 country_description_category_name_oe_cdc_ming_restoration:0 "大明中兴与礼法海贸"
 country_description_category_desc_oe_cdc_ming_restoration:0 "融一条鞭法财税革鼎、御窑工坊制造与下西洋宝船远航于一体的中央集权大一统王朝。"
 country_description_category_name_oe_cdc_manchu_banners:0 "八旗铁骑与关外雄藩"
 country_description_category_desc_oe_cdc_manchu_banners:0 "以八旗劲旅、边疆盟约与关内外大一统战略为核心的尚武雄藩。"
 country_description_category_name_oe_cdc_ottoman_ghazi:0 "奥斯曼崇高门廷"
 country_description_category_desc_oe_cdc_ottoman_ghazi:0 "以加齐边疆开拓、精锐常备步兵、帝国火炮铸造与横跨博斯普鲁斯海峡霸权著称的苏丹国。"
 country_description_category_name_oe_cdc_mamluk_sultanate:0 "马穆鲁克堡垒商贸苏丹国"
 country_description_category_desc_oe_cdc_mamluk_sultanate:0 "控扼尼罗河粮仓、红海香料良港与黎凡特商队要冲的精锐骑兵苏丹国。"
 country_description_category_name_oe_cdc_russian_tsardom:0 "罗斯正教沙皇国"
 country_description_category_desc_oe_cdc_russian_tsardom:0 "凭边防要塞、西伯利亚毛皮商道与近代新式团建制统合全罗斯的北方正教强权。"
 country_description_category_name_oe_cdc_polish_lithuanian:0 "贵族议会联邦"
 country_description_category_desc_oe_cdc_polish_lithuanian:0 "融合瑟姆贵族宪政、重装翼骑兵突击与波罗的海谷物贸易繁荣的东欧联邦大国。"
 country_description_category_name_oe_cdc_golden_horde:0 "术赤兀鲁思五翼汗廷"
 country_description_category_desc_oe_cdc_golden_horde:0 "统筹术赤五翼封汗、萨莱河运税关与黑海里海草原机动火器骑兵的草原宗主。"
 country_description_category_name_oe_cdc_chagatai_silk:0 "察合台丝路汗国"
 country_description_category_desc_oe_cdc_chagatai_silk:0 "横跨河中绿洲名城、天山古道与欧亚陆上丝绸商队干线的中亚汗国。"
 country_description_category_name_oe_cdc_persian_shahdom:0 "波斯王权与绿洲文华"
 country_description_category_desc_oe_cdc_persian_shahdom:0 "将波斯典册文华、丝织工坊与两河至呼罗珊精锐火器劲旅融为一体的高原帝国。"
 country_description_category_name_oe_cdc_indian_sovereign:0 "南亚季风皇座"
 country_description_category_desc_oe_cdc_indian_sovereign:0 "坐拥棉纺工坊、沃野大河流域与印度洋香料白银汇流之利的南亚大国。"
 country_description_category_name_oe_cdc_maritime_republic:0 "地中海海洋共和国"
 country_description_category_desc_oe_cdc_maritime_republic:0 "依托兵工厂舰队、主权银行信贷与星罗棋布的海外商站纵横地中海航道的商业共和国。"
 country_description_category_name_oe_cdc_renaissance_signoria:0 "文艺复兴金融市政厅"
 country_description_category_desc_oe_cdc_renaissance_signoria:0 "以金币本位、泛欧汇兑银号、羊毛行会与古典人文学术冠绝天下的意大利市民共和国。"
 country_description_category_name_oe_cdc_alpine_confederacy:0 "阿尔卑斯联邦铁堡"
 country_description_category_desc_oe_cdc_alpine_confederacy:0 "凭市民长矛方阵、险峻越山要隘与严明永久武装中立屹立欧陆的高山邦联。"
 country_description_category_name_oe_cdc_western_monarchy:0 "大西洋王权强国"
 country_description_category_desc_oe_cdc_western_monarchy:0 "由封建等级制迈向常备王师、大洋远航与跨洲贸易特许状的西欧强权。"
 country_description_category_name_oe_cdc_imperial_habsburg:0 "多瑙河王朝与帝冠外交"
 country_description_category_desc_oe_cdc_imperial_habsburg:0 "善用王室联姻、帝国议会制度与多瑙河畔棱堡防线纵横中欧的王朝强权。"
 country_description_category_name_oe_cdc_nordic_baltics:0 "北欧波罗的海商贸强国"
 country_description_category_desc_oe_cdc_nordic_baltics:0 "掌控厄勒海峡税关、铜铁矿产、波罗的海制海权与极北毛皮商网的北方强权。"
 country_description_category_name_oe_cdc_celtic_iberian:0 "特许海贸与议会王冠"
 country_description_category_desc_oe_cdc_celtic_iberian:0 "兼备议会制衡、特许贸易公司与纵横大西洋及地中海航运商网的海洋国家。"
 country_description_category_name_oe_cdc_east_asian_shogunate:0 "东亚海疆与文治强国"
 country_description_category_desc_oe_cdc_east_asian_shogunate:0 "凭白银商贸、海防舰炮革新与严整文治学术屹立东亚海疆的列强。"
 country_description_category_name_oe_cdc_nanyang_thalassocracy:0 "南洋海峡海上强权"
 country_description_category_desc_oe_cdc_nanyang_thalassocracy:0 "扼守季风海峡咽喉、香料集散大港与曼荼罗朝贡外交网络的东南亚海上强权。"
 country_description_category_name_oe_cdc_maghreb_sahara:0 "马格里布与非洲商道强国"
 country_description_category_desc_oe_cdc_maghreb_sahara:0 "统合跨撒哈拉黄金商道、印度洋三角帆良港或直布罗陀海峡要塞的非洲枢纽强国。"
 country_description_category_name_oe_cdc_himalayan_dharma:0 "雪域佛法高原王国"
 country_description_category_desc_oe_cdc_himalayan_dharma:0 "以寺院学术、天险山口守备与广被内亚的法脉声望立国的青藏高原政权。"
 country_description_category_name_oe_cdc_nova_elysia:0 "跨洋新大陆文明中枢"
 country_description_category_desc_oe_cdc_nova_elysia:0 "在新大陆开辟跨洲大道、海贸同盟或新罗马文明融合气象的跨洋强权。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev1_a:0 "帝国大纹章院"
 STATIC_MODIFIER_DESC_oe_def_mod_ev1_a:0 "成文化的国家纹章与王朝大纛律例显著彰显宫廷威仪，并提升诸国宫廷对本国的外交敬重。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev1_b:0 "军团战旗统制令"
 STATIC_MODIFIER_DESC_oe_def_mod_ev1_b:0 "统一编制的战旗与军徽强化三军沙场凝聚力与尚武传统，同时精简宫廷仪仗耗费。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev2_a:0 "烈焰天命丝绸大纛"
 STATIC_MODIFIER_DESC_oe_def_mod_ev2_a:0 "威严赫赫的天命御旗令边疆行省与朝贡诸邦紧密归心，中枢掌控力与外交承载力齐升。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev2_b:0 "苍龙戏珠朝贡礼典"
 STATIC_MODIFIER_DESC_oe_def_mod_ev2_b:0 "海陆并举的朝贡与互市仪轨吸引四海商贾与文士云集天朝商埠，商贸与文化辐射共兴。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev3_a:0 "五十五天命先驱气象"
 STATIC_MODIFIER_DESC_oe_def_mod_ev3_a:0 "昂扬的历史使命感加速思潮传播、文化积淀与举世威望。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev3_b:0 "盛世长治经略之风"
 STATIC_MODIFIER_DESC_oe_def_mod_ev3_b:0 "审慎务实的财政与内政治理将群雄竞逐之势化为绵延不绝的国富民安。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev4_a:0 "六司枢密典册院"
 STATIC_MODIFIER_DESC_oe_def_mod_ev4_a:0 "条理井然的分科典册大幅提升内阁行政效率与中央掌控上限，并压减宫廷冗费。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev4_b:0 "枢密巡稽与急递驿网"
 STATIC_MODIFIER_DESC_oe_def_mod_ev4_b:0 "常设巡行稽核使与干道急递驿马将远方州县紧密纳入高效征税与中央管辖之中。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev5_a:0 "万国礼宾志略"
 STATIC_MODIFIER_DESC_oe_def_mod_ev5_a:0 "通晓诸国朝仪与外交法度，既拓宽外交承载力，又显著缓和扩张招致的列强戒心。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev5_b:0 "万国通商使馆网络"
 STATIC_MODIFIER_DESC_oe_def_mod_ev5_b:0 "常驻商贸使馆将国情洞察转化为实打实的商团议价权、关税收益与文化号召力。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev6_a:0 "第三纪元学术之冠"
 STATIC_MODIFIER_DESC_oe_def_mod_ev6_a:0 "王室大力赞助学园、测绘师与名匠工坊，推动国家稳居大航海与学术革新潮头。"
 STATIC_MODIFIER_NAME_oe_def_mod_ev6_b:0 "第三纪元钢铁壁垒"
 STATIC_MODIFIER_DESC_oe_def_mod_ev6_b:0 "严整军纪、要塞守备与远洋水师士气令帝国从容应对跨洲列强争霸。"
 oe_def.1.title:0 "帝国旌旗与纹章仪制革鼎"
 oe_def.1.desc:0 "宫廷纹章官与御织局共同拟定《大一统旌旗纹章律》，将国旗规制与国体爵位、王朝传承及中兴功业紧密相连。自双头鹰皇冠旗、佛罗伦萨绯红百合至草原宗室印记，每一次政制革鼎与盛世转折都将升起与之相称的巍峨大纛。"
 oe_def.1.a:0 "敕立帝国大纹章院并颁布仪制典册"
 oe_def.1.b:0 "统颁常备军团战旗与卫戍军徽"
 oe_def.2.title:0 "天命龙旗与烈焰日月大纛"
 oe_def.2.desc:0 "天朝礼部与织造局联袂织就新制丝绸御旗，将大汗烈焰日月徽记与华夏苍龙戏珠大纛纳入统一礼制序列。自和林草原至南洋诸港，万邦贡使遥望旗影皆知天命所归。"
 oe_def.2.a:0 "御前升起烈焰日月天命大纛"
 oe_def.2.b:0 "颁行苍龙戏珠朝贡商贸礼典"
 oe_def.3.title:0 "五十五天命并耀之盛世"
 oe_def.3.desc:0 "自金角湾与阿诺河畔，远及雪域隘口、草原忽里勒台与大西洋彼岸，五十五条恢宏天命正竞相改写时代版图。史官载称：当代君主正立于世界史枢轴之上，宏图治世之功将比青铜与大理石更为不朽。"
 oe_def.3.a:0 "昭告群雄竞逐之大志盛世"
 oe_def.3.b:0 "厚植内政民生与长治久安根基"
 oe_def.4.title:0 "枢密典册六司分科重组"
 oe_def.4.desc:0 "枢密典籍官已将国家政令簿册重整为六大专司：帝国治政、天命草原、海上拓殖、运河工务、军事革鼎与编年便捷。昔日堆积如山的纷杂案牍如今分门归档，敕令自钤印至行省不过数日即达。"
 oe_def.4.a:0 "永定六司分科典册与内阁核验制"
 oe_def.4.b:0 "遣派巡行稽核使与急递官驿网"
 oe_def.5.title:0 "万国礼宾仪典与列国志略"
 oe_def.5.desc:0 "皇家舆地官与资深使节合撰《万国职方礼宾志》，详录欧亚、非洲与跨洋二十四类代表性政体传统与治国方略。凭此翔实国情档案与礼宾仪轨，我国使团在列强折冲中尽占先机。"
 oe_def.5.a:0 "颁行《万国礼宾志略》以广邦交"
 oe_def.5.b:0 "广设通商使馆与万国互市会馆"
 oe_def.6.title:0 "第三纪元之冠"
 oe_def.6.desc:0 "当中世纪疆界渐让位于大洋航路、青铜攻城炮、印刷工坊与近代列强外交，我国君主召集诸阶层共行“第三纪元加冕大典”。古老正统由此昂首迈入全球帝国与格物致知的新纪元。"
 oe_def.6.a:0 "以格物新学与大洋探索铸就新纪元之冠"
 oe_def.6.b:0 "以精兵铁壁迎战全球列强博弈"
