l_simp_chinese:
 oe_works_transplant_new_world_crops: "移植新大陆作物"
 oe_works_transplant_new_world_crops_desc: "须处于#Y 地理大发现时代或之后的时代#!。从#Y 辣椒、玉米、土豆、烟草、可可#!中选择一种作物，再选择东罗马或其各级附属国拥有的一处适种地点。花费#Y 200金币#!，将该地原材料替换为所选作物，并获得#Y 移植新大陆作物#!地点修正：初始#R 食物产出−20%#!，在#Y 五年#!内逐渐衰减至消失。\n\n无冷却、无次数限制。已有相同产物的地点不可选择；同地再次改种会重新计算适应期，减产修正不叠加。\n\n$OE_NW_CROP_RULES$"
 OE_NW_CROP_CHOOSE_GOOD: "选择要移植的新大陆作物"
 OE_NW_CROP_CHOOSE_LOCATION: "选择东罗马或其附属国的适种地点"
 OE_NW_CROP_NO_LOCATION: "@trigger_no!没有适合所选作物的己方或属国地点，或这些地点已生产该作物。\n\n$OE_NW_CROP_RULES$"
 OE_NW_CROP_SUITABLE_TT: "所选作物适应该地的气候、地形、植被和水源条件"
 OE_NW_CROP_RULES: "#Y 适种条件#!\n辣椒：有暖季的平原、丘陵或高原，允许农田、草原、疏林、森林及疏植被。\n玉米：与辣椒相近，另允许丛林，以及热带、亚热带的山地。\n土豆：凉爽气候或地中海气候的平原、丘陵、高原、山地；较热气候仅限高原、山地，不允许丛林。\n烟草：有暖季的平原、丘陵或高原，允许农田、草原、疏林及疏植被。\n可可：热带或亚热带的平原、丘陵，植被须为农田、疏林、森林或丛林。\n\n干旱、半干旱或植被稀疏的地点须有河流或现有农田；所有作物均不选沙漠、湿地、极地及不可征服地点。"
 oe_new_world_crop_transplant: "移植新大陆作物"
 oe_new_world_crop_transplant_desc: "旧有耕作被重新安排，农人正在摸索新作物的播种时节、水土与收获方式。最初的粮食减产将随着种植经验积累逐渐消退。"
