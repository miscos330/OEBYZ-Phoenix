 oe_v58_afr_out_golden_caravan_supremacy:0 "黄金商队霸权"
 oe_v58_afr_out_golden_caravan_supremacy_desc:0 "守卫森严的大漠水井、桑科雷书库与津巴布韦金矿构筑起无与伦比的内陆黄金与学术盛世。"
 oe_v58_afr_out_shifting_trade_winds:0 "非洲大陆商风流转"
 oe_v58_afr_out_shifting_trade_winds_desc:0 "伴随远洋航路变迁，坚韧的非洲诸王国调整金道、学府与海港以迎全新时代。"
 oe_v58_afr_out_sovereign_monsoon_ocean:0 "主权季风与大西洋商网"
 oe_v58_afr_out_sovereign_monsoon_ocean_desc:0 "斯瓦希里三角帆船队与刚果王室使团在印度洋与大西洋上牢牢捍卫非洲海权自主。"
 oe_v58_afr_ref_bornu_aluma_ribat_order:0 "赛法瓦与萨赫勒堡垒火枪军制"
 oe_v58_afr_ref_bornu_aluma_ribat_order_desc:0 "以红砖边防要塞、重装骑兵与火绳枪常备军纵横萨赫勒草原与大漠商道，军威赫赫而饷银颇重。"
 oe_v58_afr_ref_kilwa_coral_patriciate:0 "珊瑚石城贵族海商议会"
 oe_v58_afr_ref_kilwa_coral_patriciate_desc:0 "将斯瓦希里珊瑚石城港务托付世袭海商贵族，自铸钱币并资助季风船队，同时节制内陆豪强。"
 oe_v58_afr_ref_kongo_mani_electoral_court:0 "刚果马尼选举王庭与文书院"
 oe_v58_afr_ref_kongo_mani_electoral_court_desc:0 "融合刚果流官马尼行省制、海贝国库与王立读写文书院，广通外交新学而抑制世袭藩镇坐大。"
 oe_v58_afr_ref_zimbabwe_dzimbahwe_council:0 "津巴布韦石城黄金圣议会"
 oe_v58_afr_ref_zimbabwe_dzimbahwe_council_desc:0 "以石城王庭圣议统筹绍纳牛群赏赐与深井金矿贡赋，充盈国本而严控沿海中间商利权。"
