 oe_v58_afr_bld_great_zimbabwe_enclosure:0 "大津巴布韦王家石围城"
 oe_v58_afr_bld_great_zimbabwe_enclosure_desc:0 "无须灰浆而严丝合缝的巍峨花岗岩石墙与圆锥圣塔屹立高原，汇聚王家金匠、皂石神鸟与帝国枢密议事厅。"
 oe_v58_afr_bld_kilwa_husuni_kubwa_palace:0 "基尔瓦胡苏尼库布瓦珊瑚王宫"
 oe_v58_afr_bld_kilwa_husuni_kubwa_palace_desc:0 "矗立于基尔瓦海崖之上的百室穹顶珊瑚石王宫兼商贸大院，以八角清池与青花瓷宝库迎候印度洋季风舟师。"
 oe_v58_afr_bld_mbanza_kongo_cathedral:0 "姆班扎刚果库伦宾比王家大教堂"
 oe_v58_afr_bld_mbanza_kongo_cathedral_desc:0 "以刚果高原琢石兴建于圣丘之畔的库伦宾比王家大教堂，乃刚果王室读写学院、拉丁—基刚果文书院与大西洋外交中枢。"
 oe_v58_afr_bld_ngazargamu_brick_citadel:0 "恩加扎尔加穆红砖王城要塞"
 oe_v58_afr_bld_ngazargamu_brick_citadel_desc:0 "矗立于约贝河畔、周长数里的窑烧红砖环形王城要塞，拱卫赛法瓦朝廷、清真大寺与伊德里斯·阿卢马火枪营。"
 oe_v58_afr_bld_timbuktu_sankore_university:0 "廷巴克图桑科雷大学"
 oe_v58_afr_bld_timbuktu_sankore_university_desc:0 "泥砖金字塔宣礼塔与藏书数十万卷的世家书库环抱桑科雷学堂，天文、法学与医典抄本价值胜过黄金。"
 oe_v58_afr_dec_charter_kilwa_mint:0 "敕建基尔瓦王家造币厂与季风石城联盟"
