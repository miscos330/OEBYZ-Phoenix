 hint_oe_sit_v58_afr_trans_saharan_and_monsoon_desc:0 "运用六项局势行动提升#Y 跨撒哈拉与黄金财富#!（萨赫勒、乍得湖与津巴布韦黄金商廊）或#Y 季风与远洋通航#!（斯瓦希里与刚果大西洋海权）。1450 年后任一进度达 80/100 即可缔造全洲霸业。"
 oe_sit_v58_afr_trans_saharan_and_monsoon:0 "非洲：跨撒哈拉黄金与印度洋季风商网"
 oe_sit_v58_afr_trans_saharan_and_monsoon_desc:0 "北连廷巴克图桑科雷学府与恩加扎尔加穆火枪铁骑，南通姆班扎刚果文书院、大津巴布韦花岗岩金城与基尔瓦珊瑚季风海港，非洲主权帝国纵横大漠与两大洋。"
 oe_v58_afr.1.a:0 "扩建胡苏尼库布瓦穹顶商院与御港石阶。"
 oe_v58_afr.1.b:0 "扩建基尔瓦大清真寺穹顶以礼待四海学者。"
 oe_v58_afr.1.c:0 "将海崖石砌货栈出租予也门与阿曼船主。"
 oe_v58_afr.1.desc:0 "当摩洛哥旅行家伊本·白图泰赞叹基尔瓦乃世间最精美壮丽之城时，石匠正自珊瑚礁采凿白珊瑚石，于翡翠海峡峭壁之上营建穹顶宫院与八角清池。"
 oe_v58_afr.1.title:0 "基尔瓦胡苏尼库布瓦珊瑚王宫"
 oe_v58_afr.10.a:0 "扩编尼日尔河四百战舟常备水师。"
 oe_v58_afr.10.b:0 "开凿连通尼日尔河岔的农灌与运兵渠道。"
 oe_v58_afr.10.c:0 "于卡巴拉与杰内渡口征收河道商税。"
 oe_v58_afr.10.desc:0 "在尼日尔河蜿蜒掠过大漠南缘之处，逊尼·阿里将索尔科渔民整编为四百艘战舟组成的强大水师，与草原精骑水陆并进，荡平大漠劫掠者，将加奥、廷巴克图与杰内尽收一统。"
 oe_v58_afr.10.title:0 "逊尼·阿里与尼日尔战舟水师"
 oe_v58_afr.11.a:0 "推行阿斯基亚流官行省制与常设法官法庭。"
 oe_v58_afr.11.b:0 "于开罗与麦加捐建萨赫勒朝圣善院扬名天下。"
 oe_v58_afr.11.c:0 "招徕随行开罗大商于加奥开设官栈。"
 oe_v58_afr.11.desc:0 "阿斯基亚·穆罕默德率五百精骑与满箱班布克精金远赴开罗与麦加朝觐，与名儒苏尤提论道，受封西苏丹哈里发绿巾荣衔而归。加奥朝廷遂全面革新行省官制与司法体系。"
 oe_v58_afr.11.title:0 "阿斯基亚大朝觐与西苏丹荣衔"
 oe_v58_afr.12.a:0 "重金资助桑科雷讲席与王家古籍抄本秘库。"
 oe_v58_afr.12.b:0 "敕修纵贯萨赫勒古今的帝国编年大史。"
 oe_v58_afr.12.c:0 "对大漠纸张羊皮纸商队征收市舶税。"
 oe_v58_afr.12.desc:0 "利奥·阿非利加努斯曾惊叹于廷巴克图奇景：自北非输入及本地书家精抄的典籍利入胜过黄金与岩盐。两万五千学子云集于桑科雷、津加里贝尔与西迪叶海亚泥砖院落之中。"
 oe_v58_afr.12.title:0 "桑科雷大学与廷巴克图书市奇观"
 oe_v58_afr.13.a:0 "烧制红砖大筑恩加扎尔加穆城垣与王宫。"
 oe_v58_afr.13.b:0 "立约调和赛法瓦十二重臣以安新朝。"
 oe_v58_afr.13.c:0 "向豪萨商队开放乍得湖天然碱与渔市并征税。"
 oe_v58_afr.13.desc:0 "告别风沙纷争的旧都恩吉米，迈·阿里·加吉于丰饶的约贝河畔筑起窑烧红砖环绕的宏伟新都恩加扎尔加穆。四大清真寺、宽阔骑兵御道与王家粮仓开启了博尔努三百年盛世。"
 oe_v58_afr.13.title:0 "从恩吉米到恩加扎尔加穆"
 oe_v58_afr.14.a:0 "常设火绳枪精锐营与棉甲重骑兵协同作战。"
 oe_v58_afr.14.b:0 "沿边境商道修筑红砖边防要塞拱卫王土。"
 oe_v58_afr.14.c:0 "整顿王家军粮大仓以备漫长旱季远征。"
 oe_v58_afr.14.desc:0 "经的黎波里与开罗朝觐归来的迈·伊德里斯·阿卢马跨越大漠输入火绳枪与奥斯曼教官。史官伊本·富尔图盛赞博尔努火枪方阵配以棉甲卡努里重骑，攻城拔寨所向披靡。"
 oe_v58_afr.14.title:0 "阿卢马的奥斯曼火枪与棉甲骑"
 oe_v58_afr.15.a:0 "缔结博尔努—的黎波里绿洲商约并广购北非战马。"
 oe_v58_afr.15.b:0 "驻军守护比尔马盐池以保王室盐税。"
 oe_v58_afr.15.c:0 "于恩加扎尔加穆赐宅安置马格里布学者与商使。"
 oe_v58_afr.15.desc:0 "穿越比尔马绿洲与费赞水井的撒哈拉中道自古连通乍得湖与地中海。博尔努使臣与的黎波里及费赞总督议定护商条约，以可乐果、红皮革与天然碱易回北非骏马与精钢甲胄。"
 oe_v58_afr.15.title:0 "博尔努—的黎波里外交与盐道"
 oe_v58_afr.16.a:0 "资助全洲工艺行会并统一大集衡法商税。"
 oe_v58_afr.16.b:0 "敕造王家青铜礼器与锦缎仪旗以壮朝仪。"
 oe_v58_afr.16.c:0 "向云集大集的各国牙商征收摊位市税。"
 oe_v58_afr.16.desc:0 "自贝宁失蜡青铜浮雕、卡诺深靛蓝染坊至刚果拉菲亚丝绒与豪萨红革，各地精湛工艺行会在雨林王国与萨赫勒商都之间织就生机勃勃的内陆大集。"
 oe_v58_afr.16.title:0 "青铜、靛蓝与拉菲亚"
 oe_v58_afr.17.a:0 "筑起珊瑚石火炮棱堡与海岸烽火联防。"
 oe_v58_afr.17.b:0 "遣急使向阿曼与奥斯曼水师求援共御外侮。"
 oe_v58_afr.17.c:0 "暂许部分商港停泊特许以换取白银与备战之机。"
 oe_v58_afr.17.desc:0 "满载火炮的西洋大帆船绕过好望角北上，妄图强征贡赋并垄断索法拉黄金航道。斯瓦希里港主与津巴布韦使臣急议如何筑牢珊瑚海堡、烽火台与内陆金道。"
 oe_v58_afr.17.title:0 "珊瑚海堡与季风商港保卫战"
 oe_v58_afr.18.a:0 "敕修多语帝国大编年史以垂青史。"
 oe_v58_afr.18.b:0 "盛大召开商贾、长老与四方使节大会。"
 oe_v58_afr.18.c:0 "嘉奖王库司官并广开商道惠商增收。"
 oe_v58_afr.18.desc:0 "自廷巴克图泥砖书库与恩加扎尔加穆红砖王城，至姆班扎刚果文书院、大津巴布韦花岗岩圣塔与基尔瓦珊瑚宫院，格里奥史家与宫廷书记共同讴歌绵延数世纪的非洲主权、学术与商贸辉煌。"
 oe_v58_afr.18.title:0 "非洲主权盛世大编年史"
 oe_v58_afr.2.a:0 "厚礼回赠大明与古吉拉特，以青花瓷装饰宫殿。"
 oe_v58_afr.2.b:0 "遣派舵师向远洋来客研习牵星板与造船术。"
 oe_v58_afr.2.c:0 "对丝绸、瓷器与象牙贸易照章征收海税。"
 oe_v58_afr.2.desc:0 "高耸的多桅大明宝船与古吉拉特棉布商船停泊于马林迪与基尔瓦港外。景德镇青花瓷盘与天竺织锦交相辉映，斯瓦希里使臣回赠象牙、乳香与麒麟长颈鹿，誉满重洋。"
 oe_v58_afr.2.title:0 "大明宝船与商帮泊岸斯瓦希里"
 oe_v58_afr.3.a:0 "斡旋缔结斯瓦希里石城统一金税与护航公约。"
 oe_v58_afr.3.b:0 "宣示王室独揽索法拉黄金船队专营权。"
 oe_v58_afr.3.c:0 "整装海岸巡防三角帆船以肃清海盗。"
 oe_v58_afr.3.desc:0 "每逢季风时节，来自津巴布韦高原的砂金皆汇集于索法拉红树林沙洲。蒙巴萨、马林迪与基尔瓦的贵族海商就金税分配与北上船队护航权争执不下。"
 oe_v58_afr.3.title:0 "索法拉金税与斯瓦希里石城同盟"
 oe_v58_afr.4.a:0 "兴建花岗岩圆锥圣塔与人字纹皇墙。"
 oe_v58_afr.4.b:0 "扩充王室牛群以赏赐归心的高原酋长。"
 oe_v58_afr.4.c:0 "改调石匠采掘含金石英矿脉以充王库。"
 oe_v58_afr.4.desc:0 "绍纳石匠以火烧水激之法劈开整片花岗岩板，不用一滴灰浆便垒出三十尺高、饰有人字纹的巍峨弧墙。大石围城之上，精雕皂石神鸟静静守护着王室圣庭。"
 oe_v58_afr.4.title:0 "大津巴布韦无浆花岗岩圣墙"
 oe_v58_afr.5.a:0 "组建王家金矿行会并沿萨韦河修筑护商驿站。"
 oe_v58_afr.5.b:0 "命王家金匠精制仪仗赠礼以厚基尔瓦邦交。"
 oe_v58_afr.5.c:0 "对出境象牙与黄金商队征收即时十一税。"
 oe_v58_afr.5.desc:0 "农闲旱冬之际，高原矿工开凿深井采掘石英金脉，王家金匠捶造金箔、金丝与权杖。商队沿萨韦河东下，以砂金象牙易回琉璃珠、波斯釉陶与大明龙泉青瓷。"
 oe_v58_afr.5.title:0 "绍纳黄金高原与索法拉商道"
 oe_v58_afr.6.a:0 "敕立赞比西王家盐金集市并安抚北方诸藩。"
 oe_v58_afr.6.b:0 "征集高原长矛精兵震慑边陲劲敌。"
 oe_v58_afr.6.c:0 "以棉布、岩盐与砂金征收河市商税。"
 oe_v58_afr.6.desc:0 "为觅丰饶盐沼并直通赞比西河贸易，北方绍纳诸王汇聚于穆托塔旗帜之下。沿高原断崖兴起座座石城，印度洋商客溯河而上赴王家集市互市。"
 oe_v58_afr.6.title:0 "穆托塔北拓与赞比西盐金大集市"
 oe_v58_afr.7.a:0 "敕封王家圣铁行会并立各省马尼盟誓。"
 oe_v58_afr.7.b:0 "尊崇姆巴塔世袭选侯以固国内安宁。"
 oe_v58_afr.7.c:0 "向沿河诸省征收赤铜与拉菲亚锦贡赋。"
 oe_v58_afr.7.desc:0 "在刚果河南岸丰饶的高原之上，卢凯尼·卢阿·尼米联结姆班古、姆巴塔、恩孙迪与索约诸部。马尼刚果既为最高法官亦尊为圣铁匠之王，以锻铁礼仪与精织拉菲亚锦贡赋凝聚各省马尼总督。"
 oe_v58_afr.7.title:0 "卢凯尼建邦与姆班扎刚果圣铁传统"
 oe_v58_afr.8.a:0 "兴办王室学院并遣发平等主权外交使团。"
 oe_v58_afr.8.b:0 "于姆平达港派驻王室税监严查不法商船。"
 oe_v58_afr.8.c:0 "向大西洋商船课征银币关税充实国库。"
 oe_v58_afr.8.desc:0 "通晓基刚果语、拉丁语与葡萄牙语的阿方索一世遣派王室子弟赴里斯本与罗马深造，甚至诞生非洲首位主教；同时他亲笔致书欧洲君主，严正要求平等通商、派遣师资并严禁劫掠刚果子民。"
 oe_v58_afr.8.title:0 "阿方索一世与刚果主权大西洋外交"
 oe_v58_afr.9.a:0 "整顿罗安达海贝渔场与恩孙迪王家铜坊。"
 oe_v58_afr.9.b:0 "铸造礼仪赤铜十字与精织锦布通好内陆诸邦。"
 oe_v58_afr.9.c:0 "启封库存海贝币以济朝廷急需。"
 oe_v58_afr.9.desc:0 "产自王室直辖罗安达岛的珍贵海贝依色泽大小分级，成为刚果王室严密掌管的本位通货，辅以恩孙迪精炼赤铜与蜚声里斯本的丝绒拉菲亚锦，共撑帝国财赋。"
 oe_v58_afr.9.title:0 "罗安达海贝国库与恩孙迪铜矿行会"
