# NEW 2026-11-22 v10.0 Worker 4 Slot 81: Eurasian Economy 2.0 (oe_econ2_). Generated by gen_eurasia_econ2.py.
 oe_econ2_silver_clearing_demand:0 "欧亚白银汇兑与主权票据清算需求"
 oe_econ2_silver_clearing_demand_desc:0 "皮亚琴察汇兑会、圣乔治银行、金角湾银行与马尼拉大帆船航线同步运转，拉动白银、纸张与典籍账簿的跨洲结算需求。"
 oe_econ2_porcelain_spice_demand:0 "丝瓷与南洋香料跨洲套利需求"
 oe_econ2_porcelain_spice_demand_desc:0 "景德镇御窑瓷器、江南丝绸与马六甲—马拉巴尔胡椒丁香双向对流，重塑十二座欧亚核心枢纽的高端货盘。"
 oe_econ2_granary_stabilize_demand:0 "帝国常平仓平粜稳粮需求"
 oe_econ2_granary_stabilize_demand_desc:0 "面对严寒荒年与粮道波动，各国依托常平仓体系收储调拨小麦、稻米与食盐，抑制饥荒恐慌与市价剧烈震荡。"
 STATIC_MODIFIER_NAME_oe_econ2_black_sea_grain_flow:0 "黑海—爱琴海官粮畅通"
 STATIC_MODIFIER_DESC_oe_econ2_black_sea_grain_flow:0 "卡法、塔纳与阿克曼的谷船安抵博斯普鲁斯，维系君士坦丁堡及爱琴海沿岸低廉而丰沛的粮价供应。"
 STATIC_MODIFIER_NAME_oe_econ2_nile_grain_surplus:0 "尼罗河谷仓丰盈输运"
 STATIC_MODIFIER_DESC_oe_econ2_nile_grain_surplus:0 "尼罗河定期泛滥充盈开罗、亚历山大与达米埃塔官仓，使东地中海与红海商道免受饥馑掣肘。"
 STATIC_MODIFIER_NAME_oe_econ2_caoyun_grain_flow:0 "大运河与海运漕粮畅达"
 STATIC_MODIFIER_DESC_oe_econ2_caoyun_grain_flow:0 "江南苏杭与应天稻米沿大运河及海道源源北运大都，稳固华北军镇与京畿百官生计。"
 STATIC_MODIFIER_NAME_oe_econ2_grain_corridor_shock:0 "洲际粮道受阻告警"
 STATIC_MODIFIER_DESC_oe_econ2_grain_corridor_shock:0 "战火或封锁中断了关键运粮动脉，京畿粮价上扬，需尽快护航通渠或开仓平粜。"
 STATIC_MODIFIER_NAME_oe_econ2_granary_relief_mod:0 "常平仓开仓平粜赈灾"
 STATIC_MODIFIER_DESC_oe_econ2_granary_relief_mod:0 "各地常平仓按平价开仓放粮并配发官盐，在小冰期与荒年中稳住了市价与民心。"
 STATIC_MODIFIER_NAME_oe_econ2_clearinghouse_charter_mod:0 "跨洲主权票据清算所特许"
 STATIC_MODIFIER_DESC_oe_econ2_clearinghouse_charter_mod:0 "汇票清算网络压缩了跨洲汇兑利差并拓宽信贷深度，为长期商贸与财政融资提供稳固锚点。"
 STATIC_MODIFIER_NAME_oe_econ2_grain_escort_mod:0 "护粮船队与运河疏浚"
 STATIC_MODIFIER_DESC_oe_econ2_grain_escort_mod:0 "朝廷专设护粮水师并疏浚关键运河船闸，保障海陆粮道与大宗商货准点抵港。"
 STATIC_MODIFIER_NAME_oe_econ2_hub_boom_mod:0 "十二枢纽丝路大景气"
 STATIC_MODIFIER_DESC_oe_econ2_hub_boom_mod:0 "从君士坦丁堡、威尼斯直至广州与马尼拉，十二大欧亚商埠车船络绎，关税与生产效率全面攀升。"
 STATIC_MODIFIER_NAME_oe_econ2_hub_contraction_mod:0 "欧亚枢纽商贸紧缩"
 STATIC_MODIFIER_DESC_oe_econ2_hub_contraction_mod:0 "多处欧亚核心商埠迭遭兵燹与信用收缩，跨洲货流放缓，亟需修复商道以重振景气。"
 STATIC_MODIFIER_NAME_oe_econ2_silver_arbitrage_boom:0 "双洋白银套利红利"
 STATIC_MODIFIER_DESC_oe_econ2_silver_arbitrage_boom:0 "波托西与石见白银经跨洋商路汇入欧亚市场，凭借成色校验与票据汇兑，国库与商帮收获丰厚盈余。"
 STATIC_MODIFIER_NAME_oe_econ2_piacenza_exchange_mod:0 "皮亚琴察与金角湾汇兑热潮"
 STATIC_MODIFIER_DESC_oe_econ2_piacenza_exchange_mod:0 "离岸汇票清算会与金角湾银号互通信用，大幅压低国债利率并强化海商议价权。"
 STATIC_MODIFIER_NAME_oe_econ2_porcelain_spice_windfall:0 "瓷丝香料双向商潮"
 STATIC_MODIFIER_DESC_oe_econ2_porcelain_spice_windfall:0 "东亚青花瓷与生丝直换南洋胡椒与地中海银币，港口关税与市民阶层满意度双双走强。"
 STATIC_MODIFIER_NAME_oe_econ2_baltic_grain_bills_mod:0 "汉萨—但泽谷物汇票网络"
 STATIC_MODIFIER_DESC_oe_econ2_baltic_grain_bills_mod:0 "维斯瓦河与波罗的海谷物贸易实行标准化远期期票结算，显著提升陆海转运与粮储周转率。"
 STATIC_MODIFIER_NAME_oe_econ2_sound_credit_convention:0 "欧亚主权债信公约"
 STATIC_MODIFIER_DESC_oe_econ2_sound_credit_convention:0 "公开透明的还本付息纪律与银本位备付金赢得各国银号青睐，赋予帝国近世金融霸权底蕴。"
 oe_econ2_ever_normal_granary:0 "常平仓（帝国义仓）"
 oe_econ2_ever_normal_granary_desc:0 "丰年平价籴进、荒年平价粜出的国家平准粮仓网络，在小冰期寒潮与粮道中断时为城镇提供稳定食粮缓冲。"
 oe_econ2_ever_normal_granary_maint:0 "常平仓运维与粮盐防潮"
 oe_econ2_ref_sovereign_clearing:0 "跨洲主权票据清算制"
 oe_econ2_ref_sovereign_clearing_desc:0 "将本国银号、海商行会与欧亚汇兑会纳入统一主权票据清算框架，以透明债信压低借贷利率并吸收跨洋白银流动。"
 oe_econ2_adv_sovereign_clearing:0 "跨洲票据清算与汇兑学"
 oe_econ2_adv_sovereign_clearing_desc:0 "融合威热皮亚琴察汇兑会、金角湾银号、汉萨谷物票据与东亚银本位清算经验，确立近代跨洲商业信用体系。"
 oe_econ2_player_only_tt:0 "仅限玩家国家主动施行此项经济措施"
 oe_econ2_granary_cd_tt:0 "距上次常平仓开仓平粜已满 36 个月"
 oe_econ2_escort_cd_tt:0 "距上次粮道护航疏浚已满 10 年"
 oe_econ2_dec_open_granary_relief.title:0 "常平仓开仓平粜赈灾"
 oe_econ2_dec_open_granary_relief.desc:0 "动用国库与地方常平仓储备，向饥荒州县与首都市场平价投放谷物食盐；若正值小冰期灾难，可同步推进救灾进度并压低叛乱增长。"
 oe_econ2_dec_open_granary_relief.a:0 "开仓放粮，平抑市价"
 oe_econ2_dec_charter_clearing_house.title:0 "敕设跨洲票据清算所"
 oe_econ2_dec_charter_clearing_house.desc:0 "向欧亚十二大枢纽商号颁授主权汇票清算特许，联通公债市场与白银流向；若正值白银价格革命灾难，可直接推动银本位改革步伐。"
 oe_econ2_dec_charter_clearing_house.a:0 "颁布清算宪章，通汇欧亚"
 oe_econ2_dec_reopen_grain_corridor.title:0 "护航洲际粮道与疏浚运河"
 oe_econ2_dec_reopen_grain_corridor.desc:0 "调派护粮水师并疏通博斯普鲁斯、亚历山大、但泽或大运河关键航段，消除粮道受阻告警并恢复首都市场粮供。"
 oe_econ2_dec_reopen_grain_corridor.a:0 "派舰护航，疏浚漕道"
 oe_econ2.1.title:0 "十二枢纽盛潮：欧亚活经济网大景气"
 oe_econ2.1.desc:0 "从君士坦丁堡、威尼斯、热那亚与亚历山大，经卡法、但泽、撒马尔罕与霍尔木兹，直达卡利卡特、马六甲、广州与马尼拉，十二大欧亚枢纽和平畅通，车船货盘空前兴旺。"
 oe_econ2.1.a:0 "广开商税红利，扩充工坊产能"
 oe_econ2.1.b:0 "加发跨洲汇票，提振枢纽银市"
 oe_econ2.2.title:0 "博斯普鲁斯粮道告急"
 oe_econ2.2.desc:0 "黑海北岸的卡法、塔纳与阿克曼频遭战乱劫掠，运往君士坦丁堡与爱琴海沿岸的官粮船队班次锐减，坊间面粉价格骤然跳涨。"
 oe_econ2.2.a:0 "紧急拨银组建护粮水师并调粮入市"
 oe_econ2.2.b:0 "暂听市价波动，严控国库开支"
 oe_econ2.3.title:0 "尼罗河谷仓告急与亚历山大粮荒"
 oe_econ2.3.desc:0 "尼罗河下游兵燹或枯水波及开罗、亚历山大与达米埃塔官仓，运往叙利亚、汉志与东地中海的谷船大为缩减。"
 oe_econ2.3.a:0 "开启帝国常平仓并平价放粮"
 oe_econ2.3.b:0 "优先保障京城军粮，暂缓外输"
 oe_econ2.4.title:0 "大运河与海运漕粮受阻"
 oe_econ2.4.desc:0 "江南苏杭与应天至北方大都之间的运河船闸或海运航道受阻，京师百官俸米与北疆边镇军粮同时吃紧。"
 oe_econ2.4.a:0 "拨款抢修闸坝并启用海运备线"
 oe_econ2.4.b:0 "折银代米，令地方自行采买"
 oe_econ2.5.title:0 "欧亚枢纽紧缩与跨洲信贷寒潮"
 oe_econ2.5.desc:0 "多条贯通欧亚大陆的陆海主干商道同时陷入战火封锁与海禁动荡，沿途商栈货物积压难行。各大跨洲商帮见势收紧银根、缩短汇票账期，大宗生丝、香料、白银与谷物的跨区清算随之显露迟滞；若不及时稳住信用，恐将演变为席卷市场的信贷寒潮。"
 oe_econ2.5.a:0 "以国库信用托底清算所汇票"
 oe_econ2.5.b:0 "紧缩财政，静待商道自然复苏"
 oe_econ2.6.title:0 "常平仓平粜惠民"
 oe_econ2.6.desc:0 "遍布州府城镇的常平仓按平价持续投放储备粮盐，即使寒潮袭来，市井米面仍井然有序，百姓感念朝廷仁政。"
 oe_econ2.6.a:0 "颁诏嘉奖各地仓官，永固义仓制度"
 oe_econ2.7.title:0 "波托西与石见银潮涌入欧亚"
 oe_econ2.7.desc:0 "来自安第斯波托西与日本石见银山的滚滚白银经塞维利亚、热那亚、马尼拉与华南商埠奔流不息，重塑整个欧亚大陆的物价、铸币与赋税根基。"
 oe_econ2.7.a:0 "严核白银成色，引入票据清算套利"
 oe_econ2.7.b:0 "趁银潮充盈国库铸币盈余"
 oe_econ2.8.title:0 "皮亚琴察汇兑会与热那亚金融霸权"
 oe_econ2.8.desc:0 "无需搬运一箱实银，仅凭纸面汇票便可在皮亚琴察与热那亚圣乔治银行完成跨国军费与大宗贸易清算，欧洲主权信贷步入崭新纪元。"
 oe_econ2.8.a:0 "接入汇兑清算网络，压低借贷利差"
 oe_econ2.8.b:0 "征收外商汇票印花税充实国库"
 oe_econ2.9.title:0 "金角湾银号与亚平宁套利共振"
 oe_econ2.9.desc:0 "帝国特许商社、金角湾银号与威尼斯—热那亚金融枢纽相互竞价承销公债，使跨洲融资利率降至百年新低。"
 oe_econ2.9.a:0 "扩大联席公债承销，联通东西枢纽"
 oe_econ2.9.b:0 "提取汇兑盈余充实常备国库"
 oe_econ2.10.title:0 "景德镇瓷器、马尼拉帆船与香料对流"
 oe_econ2.10.desc:0 "江南丝绸与景德镇官窑青花经广州与马尼拉换取滚滚银元，再与马六甲、卡利卡特香料汇流，构筑起人类史上首条全天候全球商品大动脉。"
 oe_econ2.10.a:0 "减免丝瓷转口繁苛，壮大跨洋货栈"
 oe_econ2.10.b:0 "向远洋商帮课征特许船税"
 oe_econ2.11.title:0 "汉萨—但泽波罗的海谷物期票"
 oe_econ2.11.desc:0 "每逢收获季，满载波兰与立陶宛黑麦、小麦的驳船沿维斯瓦河顺流而下，汇入繁华的但泽港湾。当地商行与汉萨客商创行标准化远期谷物期票，提前锁定船期与价款，使东欧平原的丰饶麦粮得以稳定输往北海沿岸与西欧诸大都会。"
 oe_econ2.11.a:0 "认可谷物期票流通，兴旺波罗的海商路"
 oe_econ2.12.title:0 "宝钞银锚与一条鞭法白银财政"
 oe_econ2.12.desc:0 "伴随跨洋白银汇入东亚，朝廷得以以足色官银锚定纸钞或推行田赋徭役合银折征，大幅释放江南与全国商品经济活力。"
 oe_econ2.12.a:0 "确立银本位清丈与统一成色法度"
 oe_econ2.12.b:0 "稳健回笼旧钞，谨防通货剧烈波动"
 oe_econ2.13.title:0 "欧亚主权信用公约落成"
 oe_econ2.13.desc:0 "伴随清算所特许与公开偿债纪律落地，欧亚各大商埠银号正式将本国国债列为最高信用等级，为近世大帝国提供源源不断的低息资本。"
 oe_econ2.13.a:0 "勒石颁布信用宪章，永保国债清誉"
