 oe_econ2.90.desc_granary_none:0 "\n· 帝国常平仓网络：尚未兴建（可在城镇/城市修筑 oe_econ2_ever_normal_granary）"
 oe_econ2.90.desc_footer:0 "\n· 监测枢纽：君士坦丁堡、威尼斯、热那亚、亚历山大、卡法、但泽、撒马尔罕、霍尔木兹、卡利卡特、马六甲、广州、马尼拉。"
 oe_econ2.90.a:0 "关闭经济审计面板"
 oe_econ2.90.b:0 "立即刷新全 12 枢纽与三大粮道"
