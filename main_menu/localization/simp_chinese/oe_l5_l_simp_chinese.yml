 oe_l5.2.a: "招色雷斯和海岛的人进城，免几年的税"
 oe_l5.2.a.tt: "花费#R 1#!个月的贸易与税收收入\n此后#Y 10#!年，招民垦荒的金币花费减半，两次招民的间隔从#Y 24#!个月缩短到#Y 12#!个月"
 oe_l5.2.b: "把无主的田产收归国库"
 oe_l5.2.b.tt: "获得#G 2#!个月的贸易与税收收入"
 oe_l5.2.c: "免城里一年的赋税"
 oe_l5.2.c.tt: "帝国获得[ShowModifier('oe_l5_remission')]，持续#Y 1#!年\n京城获得[ShowModifier('oe_l5_remission_city')]，持续#Y 5#!年"
 oe_l5.8.t: "瘟疫又来了"
 oe_l5.8.desc_yra: "#F 黑死病之后，瘟疫在君士坦丁堡又来过许多次：第一次回来是在1361年，前后约有十一次。#!\n\n如今，瘟疫又来了。城里的老人还记得上一回的样子。上一回，帝国关了港口，烧了病家的房屋。"
 oe_l5.8.desc_yrb: "#F 黑死病之后，瘟疫在君士坦丁堡又来过许多次：第一次回来是在1361年，前后约有十一次。#!\n\n如今，瘟疫又来了。城里的老人还记得上一回的样子。上一回，帝国城门照开，粮船照进。"
 oe_l5.8.desc_yrc: "#F 黑死病之后，瘟疫在君士坦丁堡又来过许多次：第一次回来是在1361年，前后约有十一次。#!\n\n如今，瘟疫又来了。城里的老人还记得上一回的样子。上一回，皇帝带头施舍，修道院收养孤儿。"
 oe_l5.8.desc_yr: "#F 黑死病之后，瘟疫在君士坦丁堡又来过许多次：第一次回来是在1361年，前后约有十一次。#!\n\n如今，瘟疫又来了。城里的老人还记得上一回的样子。"
