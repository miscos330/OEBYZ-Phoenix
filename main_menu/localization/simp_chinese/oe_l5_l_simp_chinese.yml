 oe_l5.91.t: "城下的消息"
 oe_l5.91.desc_x611: "守住了：奥斯曼人的骑手退走了，阿德里安波利斯仍在帝国手里。城里加修了城防（[ShowModifier('oe_l5_held')]，#Y 20#!年）。"
 oe_l5.91.desc_x612: "没守住：城破了，阿德里安波利斯归了苏丹。帝国与奥斯曼停战#Y 5#!年。"
 oe_l5.91.desc_x613: "没守住，可城池眼下不在帝国的掌握之中（正被围困或被占），交割的事只好搁着。"
 oe_l5.91.desc_x511: "守住了：增援赶到，迪迪莫泰洪仍在帝国手里。城里加修了城防（[ShowModifier('oe_l5_held')]，#Y 20#!年）；日后阿德里安波利斯守城的几率#G +15%#!。"
 oe_l5.91.desc_x512: "没守住：迪迪莫泰洪归了苏丹。帝国与奥斯曼停战#Y 5#!年。"
 oe_l5.91.desc_x513: "没守住，可迪迪莫泰洪眼下不在帝国的掌握之中（正被围困或被占），交割的事只好搁着。"
 oe_l5.91.desc_x: "消息已经传回。"
 oe_l5.91.a: "知道了"
 oe_l5.90.t: "瘟疫与色雷斯：选项生效"
