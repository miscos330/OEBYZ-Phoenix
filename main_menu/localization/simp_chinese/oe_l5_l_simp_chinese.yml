 oe_l5_b_buda_pledge: "皇帝亲到布达，许下归信罗马"
 oe_l5_b_buda_pledge_pap: "拜占庭皇帝许下归信罗马"
 oe_l5_b_buda_cold: "皇帝来求兵，却不肯谈教会"
 oe_l5_b_buda_envoy: "拜占庭派使节来布达求援"
 oe_l5_b_gift: "开城相让"
 oe_l5_b_aid: "帝国出兵助我们对付奥斯曼人"
 oe_l5_b_aid_tur: "帝国出兵助塞尔维亚人"
 oe_l5_b_aid_coin: "帝国送来了军费"
 oe_l5_b_refused: "帝国拒绝了我们的求援"
 oe_l5.1.t: "第三天"
 oe_l5.1.desc_awsy: "#F 1347年，瘟疫随北岸来的船进了城。据说疫起第三天，坎塔库泽诺斯最小的儿子安德罗尼卡就死了。坎塔库泽诺斯后来写这场病，用的是修昔底德写雅典之疫的话；格雷戈拉斯写它不分男女、贫富、老少，谁也救不了谁。#!\n\n如今，城里每天都在往外抬死人。有人烧掉病家的房子，有人涌进教堂忏悔施舍。大臣们来问皇帝：关上港口，还是照常开门？新皇帝进城才几个月，瘟疫就跟着来了。船是从卡法来的，热那亚人的船。宫里已经在为安德罗尼卡准备葬礼。"
