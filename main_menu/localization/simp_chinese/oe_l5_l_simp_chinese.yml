l_simp_chinese:
 OE_L5_PL_1A: "瘟疫进城：帝国关了港口，烧了病家的房屋。坎塔库泽诺斯之子安德罗尼卡死于瘟疫。"
 OE_L5_PL_2A: "瘟疫进城：帝国城门照开，粮船照进。坎塔库泽诺斯之子安德罗尼卡死于瘟疫。"
 OE_L5_PL_3A: "瘟疫进城：皇帝带头施舍，修道院收养孤儿。坎塔库泽诺斯之子安德罗尼卡死于瘟疫。"
 OE_L5_PL_1: "瘟疫进城：帝国关了港口，烧了病家的房屋。"
 OE_L5_PL_2: "瘟疫进城：帝国城门照开，粮船照进。"
 OE_L5_PL_3: "瘟疫进城：皇帝带头施舍，修道院收养孤儿。"
 OE_L5_PL_S: "瘟疫进城：帝国还在商量办法。"
 OE_L5_PL_G: "瘟疫进城：京城已不在帝国手里。"
 OE_L5_PL_X: "瘟疫进城：这几年瘟疫没有进京城。"
 OE_L5_PL_W: "瘟疫进城：还没有（1346年秋起）。"
 OE_L5_BU_1: "布达：皇帝亲往，许下个人归信罗马。"
 OE_L5_BU_2: "布达：皇帝亲往，只谈兵不谈教，空手而归。"
 OE_L5_BU_3: "布达：帝国派了使节，皇帝留在京城。"
 OE_L5_BU_4: "布达：帝国没有去求拉丁人。"
 OE_L5_BU_X: "布达：皇帝没有去成匈牙利。"
 OE_L5_BU_W: "布达：还没到时候（1365年夏起）。"
 OE_L5_AD_1: "阿德里安波利斯：帝国倾力守住了城。"
 OE_L5_AD_2: "阿德里安波利斯：帝国倾力守城，没有守住。"
 OE_L5_AD_3: "阿德里安波利斯：开城保全，城里人照旧居住。"
 OE_L5_AD_4: "阿德里安波利斯：希腊人迁回京城，只留下空城。"
 OE_L5_AD_G: "阿德里安波利斯：城早已不在帝国手里。"
 OE_L5_AD_X: "阿德里安波利斯：这几年奥斯曼人没有来取这座城。"
 OE_L5_AD_W: "阿德里安波利斯：还没到时候（1366年夏起）。"
 OE_L5_EM_1: "空屋：帝国招色雷斯和海岛的人进城。"
 OE_L5_EM_2: "空屋：无主的田产收归国库。"
 OE_L5_EM_3: "空屋：京城免了一年的赋税。"
 OE_L5_EM_G: "空屋：瘟疫没有进京城，或京城已不在帝国手里。"
 OE_L5_EM_X: "空屋：这几年没顾上招人回城。"
 OE_L5_EM_W: "空屋：还没到时候（瘟疫之后）。"
 OE_L5_DE_1: "迪迪莫泰洪：援兵赶到，城守住了。"
 OE_L5_DE_2: "迪迪莫泰洪：增援去了，城没守住。"
 OE_L5_DE_3: "迪迪莫泰洪：献城换和。"
 OE_L5_DE_4: "迪迪莫泰洪：城里人跟着军队撤回了京城。"
 OE_L5_DE_G: "迪迪莫泰洪：城早已不在帝国手里。"
 OE_L5_DE_X: "迪迪莫泰洪：这几年奥斯曼人没有来取这座城。"
 OE_L5_DE_W: "迪迪莫泰洪：还没到时候（1359年夏起）。"
 OE_L5_UG_1: "专制公的求援：帝国出了兵。"
 OE_L5_UG_2: "专制公的求援：帝国只送了钱。"
 OE_L5_UG_3: "专制公的求援：帝国没有卷进去。"
 OE_L5_UG_G: "专制公的求援：塞尔维亚已经不在了。"
 OE_L5_UG_X: "专制公的求援：没有人来求援。"
 OE_L5_UG_W: "专制公的求援：还没到时候（1370年夏起）。"
 OE_L5_PH_1: "菲利普波利斯：落入奥斯曼人之手。"
 OE_L5_PH_3: "菲利普波利斯：在帝国一方手里，奥斯曼人没能拿走。"
 OE_L5_PH_4: "菲利普波利斯：早已是奥斯曼人的了。"
 OE_L5_PH_X: "菲利普波利斯：这几年没有易手。"
 OE_L5_PH_W: "菲利普波利斯：还没到时候（1362年夏起）。"
 OE_L5_RE_4: "瘟疫又回到京城#Y 4#!次。"
 OE_L5_RE_3: "瘟疫又回到京城#Y 3#!次。"
 OE_L5_RE_2: "瘟疫又回到京城#Y 2#!次。"
 OE_L5_RE_1: "瘟疫又回到京城#Y 1#!次。"
 OE_L5_RE_0: "瘟疫还没有回到京城。"
