 oe_l5.3.t: "往布达去"
 oe_l5.3.desc_lrgt: "#F 1366年春，皇帝亲自到布达去见匈牙利国王路易，求国王出兵打奥斯曼人。国王的条件说得很清楚：皇帝先归入罗马教会，或者至少让牧首承认教皇至上，然后才谈出兵。据说教皇也来信，劝国王不要帮“分裂者”。#!\n\n如今，奥斯曼人已经在色雷斯站稳了脚跟。朝中有人主张，皇帝该亲自去一趟布达。路易国王愿意见皇帝，但人人都知道国王要什么。绿伯爵的船已经在海峡上。与阿维尼翁的书信还在来往。"
