 oe_l5.3.a: "亲往布达，许下个人归信"
 oe_l5.3.a.tt: "帝国获得[ShowModifier('oe_l5_abroad')]，持续#Y 9#!个月\n皇帝一年之内在外（回程的事，自有后话）\n匈牙利对帝国好感#G +25#!，持续#Y 10#!年\n教皇国对帝国好感#G +10#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：亲合一派#Y +4#!\n这份许诺日后还会被人提起"
 oe_l5.3.b: "亲往布达，只谈兵、不谈教"
 oe_l5.3.b.tt: "帝国获得[ShowModifier('oe_l5_abroad')]，持续#Y 9#!个月\n皇帝一年之内在外（回程的事，自有后话）\n花费#R 1#!个月的贸易与税收收入\n匈牙利对帝国好感#R −5#!，持续#Y 5#!年"
 oe_l5.3.c: "派使节去，皇帝留在京城"
 oe_l5.3.c.tt: "花费#R 1#!个月的贸易与税收收入\n匈牙利对帝国好感#G +5#!，持续#Y 5#!年"
 oe_l5.3.d: "不去求拉丁人"
 oe_l5.6.t: "阿德里安波利斯"
 oe_l5.6.desc_ymq: "#F 阿德里安波利斯落入奥斯曼人之手，在1369年前后（旧说早到1361年）。城里的都主教写过一首诗，说明1366年圣诞城还在帝国手里。后世土耳其的史书说拉拉·沙欣在城外打败了守将；也有人说是边地的骑手自己打下来的；还有一说是城里人开城，换得照旧居住。城陷之后，城中多数人被掳走，都主教也死在那里。#!\n\n如今，奥斯曼人的骑手已经到了阿德里安波利斯城下。城里派人来问京城：守，还是谈？迪迪莫泰洪已经是苏丹的了。苏丹穆拉德的使者也到了，说开城的人可以照旧居住。"
