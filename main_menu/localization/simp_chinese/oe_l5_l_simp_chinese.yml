 oe_l5.5.a: "派兵增援，死守"
 oe_l5.5.a.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力\n守住的几率：#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_l5_hold_chance')|0]%#!\n守住：迪迪莫泰洪获得[ShowModifier('oe_l5_held')]，持续#Y 20#!年；日后阿德里安波利斯守城的几率#G +15%#!\n守不住：迪迪莫泰洪交给奥斯曼，与奥斯曼停战#Y 5#!年，威望#R −10#!"
 oe_l5.5.b: "献城换和"
 oe_l5.5.b.tt: "迪迪莫泰洪交给奥斯曼\n与奥斯曼停战#Y 10#!年\n奥斯曼对帝国好感#G +20#!，持续#Y 10#!年\n奥斯曼人付的赎金：获得#G 1#!个月的贸易与税收收入"
 oe_l5.5.c: "让城里人跟着军队撤回来"
 oe_l5.5.c.tt: "城里的东正教徒迁往京城（每月约#Y 500#!人，#Y 12#!个月）\n迪迪莫泰洪交给奥斯曼\n与奥斯曼停战#Y 5#!年"
 oe_l5.7.t: "专制公的求援"
 oe_l5.7.desc_yu: "#F 1371年，塞莱的专制公约万·乌格列莎想趁苏丹穆拉德远在小亚细亚，奇袭阿德里安波利斯。专制公向帝国和保加利亚求援，都没有成功。这年秋天，专制公和兄长武卡欣在马里查河畔的切尔诺门战死。#!\n\n如今，[GetLocationByKey('serres').GetName]的使者到了宫里：请帝国出兵，至少出钱。专制公还记得帝国当年的接纳。"
