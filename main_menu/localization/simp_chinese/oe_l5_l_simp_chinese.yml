 oe_l5.6.a: "倾力守城"
 oe_l5.6.a.tt: "花费#R 3#!个月的贸易与税收收入\n花费#R 3#!个月的人力\n守住的几率：#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_l5_hold_chance_adr')|0]%#!\n守住：阿德里安波利斯获得[ShowModifier('oe_l5_held')]，持续#Y 20#!年\n守不住：阿德里安波利斯交给奥斯曼，与奥斯曼停战#Y 5#!年，稳定#R −7#!"
 oe_l5.6.b: "开城保全，城里人照旧居住"
 oe_l5.6.b.tt: "阿德里安波利斯交给奥斯曼\n与奥斯曼停战#Y 10#!年\n奥斯曼对帝国好感#G +20#!，持续#Y 10#!年"
 oe_l5.6.c: "迁走希腊人，只留空城"
 oe_l5.6.c.tt: "城里的东正教徒迁往京城（每月约#Y 1000#!人，#Y 12#!个月）\n阿德里安波利斯交给奥斯曼\n与奥斯曼停战#Y 5#!年\n都主教回到京城：[oe_tu_patriarchate|e]#G +1#!"
 oe_l5.5.t: "迪迪莫泰洪的城门"
 oe_l5.5.desc_ya: "#F 1360年或1361年，奥斯曼人拿下了迪迪莫泰洪。这座城离阿德里安波利斯不远，后来苏丹的宫廷还在这里住过。#!\n\n如今，城边的突厥骑手越来越多。城里派人来问京城：守，还是谈？塞尔维亚或保加利亚与帝国有盟约，援兵或许叫得动。奥斯曼人的使者也到了，说献城的人有赎金可拿。"
 oe_l5.5.desc_y: "#F 1360年或1361年，奥斯曼人拿下了迪迪莫泰洪。这座城离阿德里安波利斯不远，后来苏丹的宫廷还在这里住过。#!\n\n如今，城边的突厥骑手越来越多。城里派人来问京城：守，还是谈？奥斯曼人的使者也到了，说献城的人有赎金可拿。"
 oe_l5.5.desc_a: "#F 迪迪莫泰洪离阿德里安波利斯不远，是色雷斯的一座要塞。史书说它后来落入了奥斯曼人之手，苏丹的宫廷还在这里住过。#!\n\n如今，城边的突厥骑手越来越多。城里派人来问京城：守，还是谈？塞尔维亚或保加利亚与帝国有盟约，援兵或许叫得动。奥斯曼人的使者也到了，说献城的人有赎金可拿。"
