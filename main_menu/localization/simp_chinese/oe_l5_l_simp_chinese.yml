 oe_l5.7.desc_x: "#F 史书说，塞莱的专制公约万·乌格列莎想趁苏丹穆拉德远在小亚细亚，奇袭阿德里安波利斯。专制公向帝国和保加利亚求援，都没有成功；不久，专制公和兄长武卡欣在马里查河畔的切尔诺门战死。#!\n\n如今，[GetLocationByKey('serres').GetName]的使者到了宫里：请帝国出兵，至少出钱。"
 oe_l5.7.a: "出兵相助"
 oe_l5.7.a.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力\n塞尔维亚对帝国好感#G +30#!，持续#Y 10#!年\n奥斯曼对帝国好感#R −30#!，持续#Y 10#!年\n不会因此与奥斯曼开战；马里查河一战的胜负仍由塞尔维亚自己的乱局决定\n日后[GetLocationByKey('serres').GetName]的人会记得帝国的兵来过"
 oe_l5.7.b: "只送钱，不出兵"
 oe_l5.7.b.tt: "花费#R 1#!个月的贸易与税收收入\n塞尔维亚对帝国好感#G +10#!，持续#Y 5#!年"
 oe_l5.7.c: "不卷进去"
 oe_l5.7.c.tt: "塞尔维亚对帝国好感#R −15#!，持续#Y 5#!年"
 oe_l5.2.t: "空屋"
 oe_l5.2.desc_si: "#F 瘟疫过后，城里许多房子空着，城外的田没人种。据说城里死了三分之二的人，这个数多半说大了，可街上确实空了。#!\n\n如今，大臣们拿着空屋和荒田的册子来见皇帝：人从哪里招回来？西边，塞尔维亚人趁乱拿下了伊庇鲁斯。请意大利商人来城里住的事，已经派人去谈过了。"
 oe_l5.2.desc_s: "#F 瘟疫过后，城里许多房子空着，城外的田没人种。据说城里死了三分之二的人，这个数多半说大了，可街上确实空了。#!\n\n如今，大臣们拿着空屋和荒田的册子来见皇帝：人从哪里招回来？西边，塞尔维亚人趁乱拿下了伊庇鲁斯。有人主张请意大利商人来城里住，皇帝还没拿定主意。"
 oe_l5.2.desc_i: "#F 瘟疫过后，城里许多房子空着，城外的田没人种。据说城里死了三分之二的人，这个数多半说大了，可街上确实空了。#!\n\n如今，大臣们拿着空屋和荒田的册子来见皇帝：人从哪里招回来？请意大利商人来城里住的事，已经派人去谈过了。"
