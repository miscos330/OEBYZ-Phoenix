 OE_PILLARS_FINANCE_COURT: "御座用度 · 礼仪与恩赏"

 OE_PILLARS_FINANCE_OFFICES: "官署常费 · 帝国官僚机构"

 OE_PILLARS_FINANCE_THEMES: "军区军需 · 军饷与兵源"

 OE_PILLARS_NATIVE_BUREAUCRACY_HINT: "诏令、案牍与法度，须有常设官署奉行。本项由#Y 国家国库#!支付，沿用该官僚机构原有的费用与效用。"

