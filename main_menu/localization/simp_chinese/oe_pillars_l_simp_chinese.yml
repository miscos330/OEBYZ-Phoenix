l_simp_chinese:
 oe_pillars_noble: "豪族"
 oe_pillars_noble_desc: "#italic “门第可以承袭，恩宠却须日日争取。”#!\n\n坎塔库泽诺斯、阿波考科斯与绪纳德诺斯诸家，以庄园、亲兵和宫廷姻亲支撑帝国。#Y 豪族#!既是御座的倚仗，也有各自的家业与雄心。"
 oe_pillars_subject: "附庸"
 oe_pillars_subject_desc: "帝国的疆界之外，仍有向御座宣誓效忠的领主。他们据有城池与田土，以臣属之礼承认君士坦丁堡的尊位。此席属于#Y 拥有领土的附庸#!；受命统领军区者另列军区之席。"
 oe_pillars_authority: "权威"
 oe_pillars_authority_desc: "诏书离开金殿之后，能否在各地得到奉行，才是#Y 权威#!的真正尺度。\n\n权威介于#Y 0—100#!，开局为#Y 25#!；每月自然衰减#Y 0.2#!。可在#Y 帝国财政#!中拨付内帑维持秩序，每月至多增加#Y 0.5#!。"
 oe_pillars_public_opinion: "民意"
 oe_pillars_public_opinion_desc: "从竞技场的呼声到乡间的低语，臣民始终在衡量御座的得失。胜利可以赢得颂扬，赋役与失政也会招来怨怼。\n\n#Y 民意#!介于#Y 0—100#!，开局为#Y 27#!，每月向#Y 50#!回归，距中点越远，变化越大，最多变化#Y 0.5#!。\n\n#Y 民心与国势#!\n民意影响#Y 拜占庭#!的农民叛乱进度、农民满意度均衡值与维稳开支。#Y 50#!为中点，三项影响均为零；民意越低，乡野越难安抚，越高则赋役易行。\n#R 民意0#!：农民叛乱每月#R ＋0.1个百分点#!、满意度均衡值#R −20%#!、维稳开支#R ＋50%#!。\n#G 民意100#!：农民叛乱每月#G −0.1个百分点#!、满意度均衡值#G ＋20%#!、维稳开支#G −50%#!。\n中间数值连续变化；维稳开支按基础费用折算，并与其他维稳效率修正共同结算。"
 OE_PILLARS_AUTHORITY_VALUE: "$VAL|1$"
 OE_PILLARS_OPINION_VALUE: "$VAL|1$"
 OE_PILLARS_PRIVY_PURSE: "内帑"
 OE_PILLARS_PRIVY_PURSE_HINT: "宫廷私财"
 OE_PILLARS_AUTHORITY_HINT: "每月 −0.2"
 OE_PILLARS_PURSE_DESC: "#italic “金印使诏命庄严，金钱使诏命得到执行。”#!\n\n#Y 内帑#!汇集帝国上层的私人财计：宫廷贵胄占有贵族阶层收入的#Y 15%#!，普世牧区的教会高层占有教士阶层收入的#Y 5%#!。这两项份额每月计入内帑，作为御座周旋诸方的财力。\n\n维系权威支取内帑；宫廷与军区拨付另由#Y 国家国库#!承担。"
 OE_PILLARS_COUNCIL: "御前议事"
 OE_PILLARS_LAWS: "帝国法度"
 OE_PILLARS_MEMBERS: "帝国诸柱"
 OE_PILLARS_MEMBERS_DESC: "#italic “御座之下，各有其席；帝国之内，各有所系。”#!\n#Y 帝国#!居中，#Y 豪族#!与#Y 军区#!分列，#Y 帝国银行#!掌理钱财，领土#Y 附庸#!奉诏而来。"
 OE_PILLARS_FOUNDATION: "御座为枢 · 诸柱维国"
 OE_PILLARS_OVERVIEW_DESC: "紫袍与金印仍昭示着罗马的尊严，但御座的意志并不能独自支撑帝国。以#Y 内帑#!结纳诸家，以#Y 权威#!使诏命通行，以#Y 民意#!察帝国之安危。\n\n开局即可动用四大支柱：在#Y 行政令#!颁行军事、财政与皇权诏令；在#Y 军区#!与下方附庸阶梯统摄行省与附庸；在#Y 琼筵序次#!任免七大宫廷官职并周旋豪族；在下方#Y 帝国元老院#!实时预览席位并提请贡金或[oe_tu_provincialise|e]表决（收支见#Y 帝国财政#!，法度见#Y 帝国法度#!，主线进度见#Y 帝国编年史#!）。直辖领土满#Y 150处#!后，#Y 帝国熵增#!五维治理体系将自动启用。"
 oe_pillars_opinion_wrath: "#R 天怒人怨#!"
 oe_pillars_opinion_rumours: "#R 流言四起#!"
 oe_pillars_opinion_indifferent: "#Y 漠不关心#!"
 oe_pillars_opinion_favoured: "#G 深得人心#!"
 oe_pillars_opinion_united: "#G 万众拥戴#!"
 OE_PILLARS_OPINION_BANDS: "#T 帝国舆情#!\n#Y 0 ≤ 民意 < 20#!：天怒人怨\n#Y 20 ≤ 民意 < 40#!：流言四起\n#Y 40 ≤ 民意 < 60#!：漠不关心\n#Y 60 ≤ 民意 < 80#!：深得人心\n#Y 80 ≤ 民意 ≤ 100#!：万众拥戴\n\n风波终有平息之日。每月变化为#Y （50－民意）÷100#!，范围为#Y −0.5至＋0.5#!。\n\n#Y 民心与国势#!\n民意影响#Y 拜占庭#!的农民叛乱进度、农民满意度均衡值与维稳开支。#Y 50#!为中点，三项影响均为零；民意越低，乡野越难安抚，越高则赋役易行。\n#R 民意0#!：农民叛乱每月#R ＋0.1个百分点#!、满意度均衡值#R −20%#!、维稳开支#R ＋50%#!。\n#G 民意100#!：农民叛乱每月#G −0.1个百分点#!、满意度均衡值#G ＋20%#!、维稳开支#G −50%#!。\n中间数值连续变化；维稳开支按基础费用折算，并与其他维稳效率修正共同结算。"
# PAUSED:  oe_pillars_corruption: "腐败度"
# PAUSED:  oe_pillars_corruption_desc: "账簿上的数目未必尽入府库，宫门后的恩赏也未必出于公心。侵吞与请托一旦成为惯例，帝国便要为每一道诏令付出额外的代价。\n\n#Y 腐败度#!介于#Y 0—100#!，越低越清廉；数值随帝国的腐败—清廉状态变化，并影响#Y 中饱私囊#!的截留规模。"
# PAUSED:  OE_PILLARS_CORRUPTION_HINT: "清浊之鉴"
 oe_pillars_nobles_contribution: "宫廷贵胄收入"
 oe_pillars_nobles_contribution_desc: "紫袍近臣与显贵之家，在田租与封赏中各有恒产。贵族阶层收入中属于宫廷上层的#Y 10%#!，每月计入#Y 内帑#!；此为贵胄私财在宫廷账簿中的份额。"
 oe_pillars_clergy_contribution: "普世牧区收入"
 oe_pillars_clergy_contribution_desc: "大教堂的灯火之外，牧首与高阶教士亦掌有田产与收益。教士阶层收入中由教会高层支配的#Y 5%#!，列入#Y 普世牧区#!账目，每月计入内帑。"
# PAUSED:  oe_pillars_houses_contribution: "豪族家主收入"
# PAUSED:  oe_pillars_houses_contribution_desc: "家门的收成须供养亲兵与门客，也有归于家主的私财。诸豪族当月收入的#Y 25%#!作为家主份额计入#Y 内帑#!；历年积蓄不在此列。"
 OE_PILLARS_TRANSFERS: "帝国财政"
 OE_PILLARS_TRANSFERS_DESC: "#italic “府库有常入，军国方有常备。”#!\n\n宫廷贵胄与普世牧区的财计汇于#Y 内帑#!；御座用度与军区军需分册列明。宫廷及军区支出由#Y 国家国库#!支付，维系权威则取给内帑。"
 OE_PILLARS_OPEN_LAWS: "帝国法度：军区统辖、帝国法典、公民权与土地赋税。更换法条均消耗三个月内帑收入。"
 OE_PILLARS_PURSE_INCOME: "内帑月收入：[GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_purse_monthly_income')|2]@gold!"
 oe_pillars_authority_budget: "维系帝国权威"
 oe_pillars_authority_budget_desc: "恩赏使诸家知所归，差使使官署有所奉。御座可拨付内帑，以维持帝国的日常秩序。\n\n投入范围为内帑经常性月收入的#Y 0—100%#!，每月增加#Y 0—0.5权威#!；另有固定的#R −0.2#!自然衰减。\n\n库藏不足时按#Y 实际支付#!折算收益；月收入或余额为零时，不产生收益。临时捐纳不计入经常性月收入。"
 OE_PILLARS_AUTHORITY_PREVIEW: "预计支出[GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_authority_available_spend')|2]@gold!／月；权威净变化[GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_authority_net_change')|2]"
 OE_PILLARS_AUTHORITY_BUDGET_HINT: "全额拨付#Y 内帑月收入#!，每月增加#G 0.5权威#!；自然衰减另计#R −0.2#!。\n库藏不足时，按实付折算收益。"
 OE_PILLARS_NATIVE_COURT_HINT: "加冕的华服、宫中的宴飨与使节眼中的威仪，皆由#Y 国家国库#!支付；本项不支取内帑。"
 OE_PILLARS_EDICTS: "行政令"
 OE_PILLARS_EDICTS_DESC: "#italic “诏命既下，有司奉行。”#!\n军事、财政与庶政各有其章。权威与内帑的用度列于令下，其余条件可移至诏令查看。"
 oe_pillars_empire_benefit_tt: "#Y 御座#!"
 oe_pillars_theme_benefit_tt: "#Y 地方军区#!"
 oe_byz_noble_retinue: "豪族亲兵"
 oe_byz_noble_retinue_desc: "依附豪门、守卫庄园的常备亲兵。每队定额#Y 100人#!；三家开局各有#Y 八队，共800人#!。"

 OE_PILLARS_HISTORY: "统治历史"

