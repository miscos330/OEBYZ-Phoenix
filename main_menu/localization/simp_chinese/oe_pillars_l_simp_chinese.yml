 OE_PILLARS_MILITARY_EDICTS: "军事令"

 OE_PILLARS_MILITARY_EDICTS_DESC: "#italic “兵籍有定，军令出于御前。”#!\n划定军区、裁定兵额，召将入朝，以使诸军各守其职。"

 OE_PILLARS_FISCAL_EDICTS: "财政令"

 OE_PILLARS_FISCAL_EDICTS_DESC: "#italic “币制之轻重，系万民之信。”#!\n铸币关乎府库，也关乎商旅对罗马金钱的信赖。"

 OE_PILLARS_CIVIL_EDICTS: "行政令"

 OE_PILLARS_CIVIL_EDICTS_DESC: "#italic “以恩惠安众心，以赏赐劝勤勉。”#!\n御座的恩典，既达街市与竞技场，也及案牍之间。"

 oe_pillars_bank: "帝国银行"

 oe_pillars_bank_desc: "金角湾的账房承接帝国的钱币与信用。#Y 金角湾银行#!在御前自有一席，掌理商财与借贷之事。"

 oe_pillars_bread_and_circuses: "面包与马戏"

 oe_pillars_bread_and_circuses_desc: "粮食分送街市，竞技场重闻欢呼。让臣民在饱腹与盛会中记起御座的恩惠。\n\n消耗#Y 2权威#!及#Y 相当于内帑六个月收入的金币（从内帑支出）#!，增加#G 3民意#!与#G 7稳定度#!；冷却#Y 一年#!。"

 oe_pillars_bread_and_circuses_afford: "内帑足以支付当前#Y 六个月收入#!的用度。"

 oe_pillars_reward_officials: "奖励忠诚官僚"

 oe_pillars_reward_officials_desc: "将赏赐送到恪尽职守的官员手中，使忠勤有报，使御座之名传于官署。\n\n消耗#Y 2权威#!及#Y 相当于内帑三个月收入的金币（从内帑支出）#!，增加#G 3正统性#!。"

 oe_pillars_reward_officials_afford: "内帑足以支付当前#Y 三个月收入#!的赏赐。"
 oe_create_theme_edict_summary: "用度：#Y 5权威#!；授节地方，立军区以卫疆土。"

 oe_byz_empire_org_action_abolish_theme_edict_summary: "收回军区敕命，将所辖诸地归还御座。"

 oe_byz_empire_org_action_abolish_army_edict_summary: "敕令军区裁减兵额，使军籍各归其制。"

 oe_byz_empire_org_action_abolish_ruler_edict_summary: "用度：#Y 1权威#!；召地方统帅入京述职。"

 oe_byz_empire_org_action_create_pronia_infastry_edict_summary: "以普罗尼亚之役征召兵士，充实帝国行伍。"
 oe_byz_move_debt_edict_summary: "用度：#Y 2权威#!；币轻可济府库，亦将折损商贾之信。"

 oe_byz_rebuild_money_edict_summary: "用度：#Y 2权威#!；回购与重铸所需国库费用另计。"

 oe_pillars_bread_and_circuses_edict_summary: "#Y 2权威#! · [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_bread_cost')|2]@gold!（六月收入）\n#G ＋3民意 · ＋7稳定度#! · 冷却一年"

 oe_pillars_reward_officials_edict_summary: "#Y 2权威#! · [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_officials_cost')|2]@gold!（三月收入）\n#G ＋3正统性#!"

