 # Project Phoenix v31.0 WP35: Cato Heir Education & 3 Great Power Crises.
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_mil_tutoring: "储君武备兵法讲习"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_mil_tutoring: "宿将名帅亲授储君兵法、攻城与后勤调度，提振全国尚武风气。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_dip_tutoring: "储君外交通典讲习"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_dip_tutoring: "名臣使节亲授储君缔约折冲与宫廷礼法，广扬邦交声誉。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_adm_tutoring: "储君经世法理讲习"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_adm_tutoring: "度支良吏与法学家亲授储君财赋稽核与治国律令，提升内阁行政效能。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_hum_tutoring: "储君人文典籍讲习"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_hum_tutoring: "鸿儒硕学亲授储君经史子集与人文科学，带动朝野学术昌明。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_prepared_heir: "明储初成"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_prepared_heir: "历经严苛启蒙与试策的储君深孚众望，稳固王朝正统与朝局安定。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_koprulu_revival: "科普鲁律中兴新政"
 STATIC_MODIFIER_DESC_oe_wp35_mod_koprulu_revival: "铁腕大维齐尔肃清宫廷积弊、整饬税赋与禁军纪纲，帝国气象为之一振。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_pragmatic_sanction: "国本诏书确立"
 STATIC_MODIFIER_DESC_oe_wp35_mod_pragmatic_sanction: "不可分割的王朝继承法典获各邦承认，世袭领地得以统归单一王统。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_may_constitution: "五月宪制中兴"
 STATIC_MODIFIER_DESC_oe_wp35_mod_may_constitution: "革除贵族一票否决积弊、重塑中央宪政与常备劲旅，联邦重焕生机。"
 oe_wp35_cato_educate_heir: "延师督课王室储君"
 oe_wp35_cato_educate_heir.title: "延师督课王室储君"
 oe_wp35_cato_educate_heir.desc: "为年幼储君延聘名师宿儒，自兵法武备、折冲外交、理财治政或人文典籍四途之中择一专修，以备来日大任。"
 oe_wp35_cato_educate_heir.a: "召集王室储君讲席议定课业"
 oe_wp35_cato.1.title: "储君经筵课业择定"
 oe_wp35_cato.1.desc: "年轻的王室储君已届正式开蒙经筵之龄，枢密大殿之上全国四路名宿云集恭候圣裁：百战宿将力陈兵法攻城与沙场御众之道，老练公使推崇合纵连横与宫廷折冲之术，度支重臣主讲财赋稽核与律令经世之学，而博雅鸿儒则献上古今史鉴与人文格致典籍，静候君主权衡国运、钦定储君终身主修之宏途。"
 oe_wp35_cato.1.a: "专修武备兵法与阵战韬略"
 oe_wp35_cato.1.b: "专修外交通典与合纵折冲"
 oe_wp35_cato.1.c: "专修度支财赋与经世律法"
 oe_wp35_cato.1.d: "专修人文典籍与博雅通识"
 oe_wp35_cato.2.title: "沙场演武与兵法试策"
 oe_wp35_cato.2.desc: "历经整整一载严苛的沙盘推演、骑射操练与历代兵法典籍研读之后，王国枢密宿将请储君披甲亲临秋日大校场，居中指挥一场实兵两翼合围演武。诸营百战老将策马肃立旁观，凝神静察未来君主究竟是以雷霆果断的沙场冲锋震慑三军、以缜密严谨的后勤营垒服众，抑或厚聘宿将导师常伴左右共铸王室威望。"
 oe_wp35_cato.2.a: "拨银操办精锐实兵大演武以砺锋芒"
 oe_wp35_cato.2.b: "侧重军需转运与营垒管治之道"
 oe_wp35_cato.2.c: "厚聘首席兵法导师入列御前参赞军务"
 oe_wp35_cato.3.title: "模拟使团与外交辩难"
 oe_wp35_cato.3.desc: "悬挂巨幅织锦的王室文书大厅之内，首席大臣精心设下盛大模拟外事辩难席，并特邀各国驻节公使列席观礼。面对诸多老于世故的外交名宿，年轻储君须当众折冲海贸关税条款、权衡王室联姻得失，并从容化解言辞中的机锋试探。这场宫廷大考不仅检验储君辞令气度，更深切牵动周边诸国对我国新世代的敬畏观感。"
 oe_wp35_cato.3.a: "拨款设宴延请各国使节共鉴储君风采"
 oe_wp35_cato.3.b: "沉潜外交档册与盟约条文精微拟定"
 oe_wp35_cato.3.c: "延揽资深外交导师入席枢密共筹邦交"
 oe_wp35_cato.4.title: "度支稽核与邦国巡察"
 oe_wp35_cato.4.desc: "度支大厅厚重的橡木长案之上，摊开着真实的各省田赋清册、海港关厘账簿与地方争讼卷宗。资深财政重臣考校储君如何在不激怒各大阶层的前提下平准全年国库收支。究竟是令储君亲赴郡县巡察实务、留驻中枢精研律令账目，抑或特聘老练总稽核官入朝辅佐，皆将极其深远地塑造王国来日的施政风范。"
 oe_wp35_cato.4.a: "拨资令储君巡察郡县实务并整饬控制"
 oe_wp35_cato.4.b: "留驻中枢精研帝国律令与财赋册籍"
 oe_wp35_cato.4.c: "拔擢精通度支的首席讲师入阁理财"
 oe_wp35_cato.5.title: "人文讲堂与御书博览"
 oe_wp35_cato.5.desc: "应诏负笈而来的天算名家、古典语文学者与道德哲人齐聚御书楼，案头星图地球仪与善本手稿琳琅满目，论道辩难之声清越不绝。目睹年轻储君娴熟援引古今兴衰史鉴剖析当世治国方略，四方鸿儒纷纷由衷赞叹：若有一位如此博雅开明之君主临朝统御，必能引领整个王国迈入文教昌明、法度修举的黄金盛世。"
 oe_wp35_cato.5.a: "拨银筹办御前讲会并广搜天下善本典籍"
 oe_wp35_cato.5.b: "以清雅经史精读与修身礼法圆满结课"
 oe_wp35_cato.5.c: "厚礼留任首席人文鸿儒常驻御前顾问"
 oe_wp35_cato.6.title: "储君学成出阁"
 oe_wp35_cato.6.desc: "在满朝贵族、教士、市民代表与各国驻节公使的殷切瞩目之下，王室储君以卓异才识与从容风度圆满通过讲席导师团的终极试策。如今储君辞令雅正、识断老练、洞悉军国财政大计，正式步入中枢朝堂参预庶政。海内诸省闻讯皆感欢欣宽慰，深信王朝正统绵延不绝、万里江山社稷已然托付得人。"
 oe_wp35_cato.6.a: "京畿大庆，诏告四海国本已固、后继有人"
 oe_wp35_cato.6.b: "命储君巡礼各省以增君臣体察与万民拥戴"
 oe_wp35_cato.6.c: "拨款在京师设立常置王室讲学馆并延揽名师"
 oe_wp35_crisis_ottoman_decline: "奥斯曼帝国衰微危机"
 oe_wp35_crisis_ottoman_decline_desc: "宫廷党争、禁卫军骄横、货币贬值与地方阿扬豪强割据交织爆发，若无铁腕大维齐尔力挽狂澜，崇高门庭恐将步入衰颓。"
 oe_wp35_crisis_habsburg_succession: "哈布斯堡双重继承危机"
 oe_wp35_crisis_habsburg_succession_desc: "世袭领地继承纷争、地方等级议会离心与列强觊觎交相加剧，令哈布斯堡诸王冠面临分裂考验。"
 oe_wp35_crisis_polish_partition: "波兰贵族割据与瓜分危机"
 oe_wp35_crisis_polish_partition_desc: "大贵族结盟掣肘与议会僵局令波兰联邦陷入瘫痪，四周虎视眈眈的列强正伺机介入瓜分。"
 oe_wp35_gp.1.title: "崇高门庭的隐忧"
 oe_wp35_gp.1.desc: "一封封告急奏报接连穿过皇门送入托普卡帕宫：各省田赋与关厘按月积欠，成色剧降的剪边银币不断动摇商市信心，京师耶尼切里兵营更不时传出索要巨额登基赏赐的喧嚣鼓噪。御前议事厅内宫廷派系彼此攻讦不休，然凡朝中老成谋国之士皆已明察：唯有铁腕整饬财税、兵籍与地方督抚，方能挽救崇高门庭免于沉沦。"
 oe_wp35_gp.1.a: "急召御前会议，率先整肃京师禁卫兵营"
 oe_wp35_gp.1.b: "动用内帑急核各省财赋并整顿包税弊政"
 oe_wp35_gp.1.c: "破格起用铁腕清廉的大维齐尔总揽中兴大权"
 oe_wp35_gp.2.title: "禁卫军叩阙索饷"
 oe_wp35_gp.2.desc: "黎明前夕寂静辽阔的皇宫大院之内，不满中枢清核兵籍的耶尼切里军官竟公然倾覆象征全营食禄的青铜大锅——此乃禁卫军抗命哗变最凶险的传统信号！成群持械骄兵团团鼓噪，索要双倍军饷、世袭领饷凭票及免除点验特权。若一味姑息必将彻底掏空国库，然欲以雷霆手段整饬军纪，亦须承担京师剧烈震荡之险。"
 oe_wp35_gp.2.a: "铁腕清核空额兵籍并严整禁军纪纲"
 oe_wp35_gp.2.b: "暂行赏银安抚骄兵以换取一时平息"
 oe_wp35_gp.2.c: "任命铁面忠贞的禁军统领肃清哗变首恶"
 oe_wp35_gp.3.title: "整饬地方阿扬包税豪强"
 oe_wp35_gp.3.desc: "放眼安纳托利亚与巴尔干辽阔诸省，盘踞乡里的阿扬地方豪强早已将终身包税契约化作世代割据的私家领地，不仅层层截留关厘商税与田赋，更在朝廷征调行省兵马时百般推诿敷衍。刚正果决的大维齐尔捧上厚厚一叠清查卷宗进呈御座，力主革除贪腐包税契约、遣派中枢直属税吏重掌各省财权，以振皇室纲纪。"
 oe_wp35_gp.3.a: "授命大维齐尔雷霆废除腐败包税契约"
 oe_wp35_gp.3.b: "收取应急献金并暂允地方豪强延续旧约"
 oe_wp35_gp.3.c: "拔擢清廉精明的财政总管重修全国税册"
 oe_wp35_gp.4.title: "科普鲁律中兴"
 oe_wp35_gp.4.desc: "历经数载毫不妥协的铁腕整顿，帝国延续多年的颓势终于被彻底逆转：中枢府库重归收支盈余、金币充盈，曾经骄横一时的禁军兵营再度谨遵严明军法，各地督抚亦按期足额解缴赋税与精兵。离京返国的列强公使无不心惊胆战地密报本国朝廷：崇高门庭已彻底摆脱萎靡积弊，重现往昔令全欧震慑的鼎盛兵威。"
 oe_wp35_gp.4.a: "新月旗帜重耀四方，帝国步入中兴盛世！"
 oe_wp35_gp.4.b: "聚敛中兴财政盈余以充实来日远征军资"
 oe_wp35_gp.5.title: "世袭诸王冠的继承震荡"
 oe_wp35_gp.5.desc: "维也纳、布拉格与普雷斯堡金碧辉煌的等级议会大厅内暗流涌动，各世袭邦国的贵族与代表纷纷质疑由联姻拼合而成的哈布斯堡诸王冠究竟能否长久归于单一继承人名下。周边敌对欧洲宫廷更早已翻出陈年婚约与法理宣称蠢蠢欲动，迫使王室必须在帝国版图分崩离析之前，铸就一部海内外公认的大一统继承宪章。"
 oe_wp35_gp.5.a: "率先召集各邦等级议会共商统一继承法典"
 oe_wp35_gp.5.b: "耗资广派王室使节赴列强宫廷游说外援"
 oe_wp35_gp.5.c: "委任博学帝国法学家出任枢密总纂继承诏书"
 oe_wp35_gp.6.title: "折冲各邦等级议会"
 oe_wp35_gp.6.desc: "奥地利、波希米亚与多瑙河诸世袭领地的等级议会代表端坐于家族纹章之下，联袂向维也纳宫廷递交了一份措辞恭谨却寸步不让的答复：在宣誓永久拥戴不可分割的王朝继承秩序之前，王室必须以正式书面宪章重申各地古老自由、司法特权与税负宽减。究竟是让利求全、倚重忠臣拖延，抑或派名臣折冲，正严峻考验君主谋断。"
 oe_wp35_gp.6.a: "酌情让渡部分财税以换取各邦一致批准"
 oe_wp35_gp.6.b: "暂缓议会表决并倚重宫廷忠臣暗中斡旋"
 oe_wp35_gp.6.c: "起用长袖善舞的宫廷大臣逐一说服温和派议员"
 oe_wp35_gp.7.title: "争取列强承认继承大统"
 oe_wp35_gp.7.desc: "自巴黎、马德里、柏林与君士坦丁堡发回的加密密报透出如出一辙的冷酷外交算计：欧洲列强唯有在换取海外商业特许、边疆领土保障或外交礼让的前提下，才肯在庄严条约上签字承认哈布斯堡世袭领地的不可分割。然而朝中百战宿将却冷言进谏：一纸羊皮盟约若无强盛常备军与丰盈国库为后盾，转眼之间便可化作废纸。"
 oe_wp35_gp.7.a: "以些许外交礼让换取列强具约束力的正式承认"
 oe_wp35_gp.7.b: "宁凭利剑与国库立国，不信列强空口盟誓"
 oe_wp35_gp.7.c: "派出才辩无双的全权特使游走列国缔结均势协约"
 oe_wp35_gp.8.title: "国本诏书大告成功"
 oe_wp35_gp.8.desc: "维也纳霍夫堡宫廷广院之内号角齐鸣、礼炮震天，随着最后一份地方等级议会批准书与欧洲列强正式承认条约并列呈于皇冠之侧，《国本诏书》终告圆满大成！从此哈布斯堡世袭诸邦永不分割、统归单一公认正统王系，中欧雄主彻底走出王朝裂解阴霾，以巍然国际声望与稳固法统继续屹立欧陆群雄之巅。"
 oe_wp35_gp.8.a: "永不分割、万世相承，中欧大统永固！"
 oe_wp35_gp.8.b: "普天同庆并大赦诸邦以彰王朝仁德"
 oe_wp35_gp.9.title: "瓜分阴云笼罩波兰联邦"
 oe_wp35_gp.9.desc: "华沙议会大厅上空阴云密布，互相倾轧的大贵族同盟再度喊出致命的“自由否决权”，令关乎全国税赋与扩军的关键会期瞬间化作一片混乱泡影。而在防务空虚的漫长边境之外，虎视眈眈的强邻不仅暗中贿赂议员令联邦长陷瘫痪，更已集结重兵伺机瓜分。唯有爱国改革派绝地反击，方能挽救联邦国祚于倾覆边缘。"
 oe_wp35_gp.9.a: "火速集结议会爱国改革派直面大贵族割据"
 oe_wp35_gp.9.b: "动用王室经费正面反击周边列强的外交干涉"
 oe_wp35_gp.9.c: "破格委任无畏的宪政名臣执掌中兴变法大旗"
 oe_wp35_gp.10.title: "大议会直面贵族割据"
 oe_wp35_gp.10.desc: "华沙大议会座无虚席的旁听席群情激昂，改革派议员与城镇市民代表联袂呈上石破天惊的救亡宪法案：永久废除祸国殃民的自由否决权、向大贵族广袤庄园公平征税，并组建只听命于国王与议会的纪律严明常备军！保守派大贵族闻言勃然大怒、按剑相向，公然逼迫王座在断腕变法与苟且妥协之间立即作出抉择。"
 oe_wp35_gp.10.a: "坚定力挺改革阵营，一举废止贵族否决积弊"
 oe_wp35_gp.10.b: "暂向保守贵族同盟妥协让步以缓内讧"
 oe_wp35_gp.10.c: "延揽卓越市民法学家入阁统筹宪制与税改"
 oe_wp35_gp.11.title: "拒斥列强干涉"
 oe_wp35_gp.11.desc: "周边大国公使竟不请自入华沙王宫觐见大厅，傲慢递交措辞无礼的联合照会，打着所谓“永久捍卫古老黄金自由”的幌子，严词威逼波兰不得触动贵族否决权——其险恶用心无非令联邦长陷孱弱无助、任人宰割！宫门玉阶之前，无数爱国军官与市民齐声宣誓：宁在白鹰旗帜下血战殉国，绝不交出自主变法之神圣主权！"
 oe_wp35_gp.11.a: "顶住列强恫吓，毅然颁行主权宪制改革"
 oe_wp35_gp.11.b: "暂行外交敷衍以避强敌眼下锋芒"
 oe_wp35_gp.11.c: "起用刚毅爱国名将整军备战、严守联邦边疆"
 oe_wp35_gp.12.title: "宪制中兴的波兰联邦"
 oe_wp35_gp.12.desc: "从古老的克拉科夫、华沙直至维尔纽斯，座座教堂钟声齐鸣、响彻中东欧云霄，大议会在雷鸣般的欢呼声中正式批准近代救亡宪章！祸国百年的自由否决权彻底扫入历史尘埃，大贵族私兵收编为纪律严明的国家常备军团，耀武扬威的外国干涉使节只得灰头土脸离境。浴火重生的联邦昂首屹立，彻底粉碎列强瓜分图谋！"
 oe_wp35_gp.12.a: "宪制中兴的波兰联邦万岁！"
 oe_wp35_gp.12.b: "隆重嘉奖捍卫主权与变法的全国志士"
