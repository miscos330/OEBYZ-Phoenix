 oe_pmch_b_guanning_defection:0 "山海关开关暗约"
 STATIC_MODIFIER_NAME_oe_pmch_mod_tribute_horse_market:0 "朝贡马市赏赐"
 STATIC_MODIFIER_DESC_oe_pmch_mod_tribute_horse_market:0 "借向中原称臣通贡换取铁锅、丝绸与边境马市互市之利，充盈部族初期财力。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_white_mountain_riders:0 "白山黑水弓马砺兵"
 STATIC_MODIFIER_DESC_oe_pmch_mod_white_mountain_riders:0 "女真勇士在长白山林海与冰河之间苦练骑射围猎，随时准备席卷辽东。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_fushun_sable_monopoly:0 "赫图阿拉人参貂皮专市"
 STATIC_MODIFIER_DESC_oe_pmch_mod_fushun_sable_monopoly:0 "垄断长白山人参、紫貂皮与抚顺马市铁器交易，积累建州崛起的第一桶金。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_haixi_compact:0 "扈伦海西盟商约"
 STATIC_MODIFIER_DESC_oe_pmch_mod_haixi_compact:0 "与海西四部互市联姻，在农耕城寨与渔猎部族间建立稳固同盟纽带。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_thirteen_armors:0 "十三副遗甲统一白山"
 STATIC_MODIFIER_DESC_oe_pmch_mod_thirteen_armors:0 "以孤勇破釜沉舟之志逐一兼并建州与海西诸部，军心如铁、攻城略地所向披靡。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_eight_banners_drill:0 "八旗牛录军政合一"
 STATIC_MODIFIER_DESC_oe_pmch_mod_eight_banners_drill:0 "每三百丁编为一牛录，合为正镶八旗；出则为兵、入则为民，辅以创制满文令行政与动员效能倍增。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_clan_confederation:0 "女真四旗宗部旧盟"
 STATIC_MODIFIER_DESC_oe_pmch_mod_clan_confederation:0 "保留各部贝勒与族老的传统议政权，部族凝聚稳固而中央统御略为平缓。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_sarhu_lightning:0 "1619 萨尔浒内线闪电大捷"
 STATIC_MODIFIER_DESC_oe_pmch_mod_sarhu_lightning:0 "「凭尔几路来，我只一路去！」八旗铁骑依托内线机动数日连破四路大军，辽东战略天平彻底逆转。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_hetu_ala_bastion:0 "赫图阿拉山城伏击防线"
 STATIC_MODIFIER_DESC_oe_pmch_mod_hetu_ala_bastion:0 "倚仗长白山险隘坚壁清野、消耗敌军粮道，化被动为主动。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_ujen_cooha_corps:0 "乌真超哈重炮汉军八旗"
 STATIC_MODIFIER_DESC_oe_pmch_mod_ujen_cooha_corps:0 "广纳归降汉将与铸炮大匠编练「乌真超哈」（重兵），补齐八旗攻坚火力短板，红衣大炮震慑辽西坚城。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_mongol_banners:0 "满蒙八旗与黄金法统"
 STATIC_MODIFIER_DESC_oe_pmch_mod_mongol_banners:0 "联姻科尔沁、纳漠南蒙古编入蒙古八旗并承接草原大汗法统，大增骑军威势与属国向心。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_offense_base:0 "山海关局势：八旗扣关攻势"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_offense_base:0 "八旗大军陈兵辽西，以骑兵袭扰与火炮逼压关宁锦防线。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_offense_high:0 "山海关局势：乌真超哈重炮破关"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_offense_high:0 "满额八旗与乌真超哈红衣重炮齐发，松锦防线摇摇欲坠、山海关近在咫尺。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_defense_base:0 "山海关局势：辽西长城守御"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_defense_base:0 "中原守军依托山海关与宁锦城垒抵御满洲破关攻势。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_defense_high:0 "山海关局势：关宁红衣铁壁"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_defense_high:0 "完备的关宁锦红衣大炮防线令攻城八旗寸步难行，山海关固若金汤。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_ningjin_triumph:0 "宁锦大捷：关宁固若金汤"
 STATIC_MODIFIER_DESC_oe_pmch_mod_ningjin_triumph:0 "历经十五载血战终将满洲挡在山海关外，中原王朝声威大振、北疆稳如磐石。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_northern_pivot:0 "转向白山黑水与北亚经略"
 STATIC_MODIFIER_DESC_oe_pmch_mod_northern_pivot:0 "山海关久攻未克，满洲转向稳固朝鲜、黑龙江与漠北草原纵深，另辟东北亚霸业。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_liaodong_hushi_accord:0 "长城划界与辽东互市和约"
 STATIC_MODIFIER_DESC_oe_pmch_mod_liaodong_hushi_accord:0 "关内外双方罢兵息战，在山海关与抚顺重开官办马市与丝参互市，共享和平红利。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_songjin_siege:0 "松锦大战重炮围城"
 STATIC_MODIFIER_DESC_oe_pmch_mod_songjin_siege:0 "集结全军红衣重炮与掘壕围困松锦一线，彻底敲碎关宁锦防线核心。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_qing_dyarchy:0 "龙兴燕京：满汉一体共治"
 STATIC_MODIFIER_DESC_oe_pmch_mod_qing_dyarchy:0 "定鼎北京改号「大清」，优抚江南士绅推行满汉复职共治，迅速平息分离动荡并整合天下财赋。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_qing_martial_garrison:0 "龙兴燕京：八旗驻防尚武本位"
 STATIC_MODIFIER_DESC_oe_pmch_mod_qing_martial_garrison:0 "改号「大清」后遍设八旗驻防重镇严守骑射国语旧俗，军纪森严而地方整合承压。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_lifan_tanding:0 "理藩院统筹与摊丁入亩"
 STATIC_MODIFIER_DESC_oe_pmch_mod_lifan_tanding:0 "以理藩院统筹满汉蒙藏回多元共主格局，同时推行摊丁入亩废除丁税暴政并改土归流，释放海量人口与边疆控制。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_western_governorships:0 "伊犁与西域将军直辖军府"
 STATIC_MODIFIER_DESC_oe_pmch_mod_western_governorships:0 "在漠北与西域推行将军军府直辖屯田，大幅提升边疆控制力与常备兵源。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_kyakhta_fur_road:0 "尼布楚与恰克图北方商路"
 STATIC_MODIFIER_DESC_oe_pmch_mod_kyakhta_fur_road:0 "与俄罗斯勘定黑龙江疆界并在恰克图开市互换茶叶、丝绸与西伯利亚毛皮，北疆长宁。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_amur_bastion:0 "黑龙江雅克萨边防重镇"
 STATIC_MODIFIER_DESC_oe_pmch_mod_amur_bastion:0 "沿黑龙江与松花江广设水师营与木石要塞，寸土不让捍卫龙兴祖地。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_cohong_canton:0 "广州十三行公行专卖制"
 STATIC_MODIFIER_DESC_oe_pmch_mod_cohong_canton:0 "将泰西海商统一约束于广州十三行官商体系，坐收巨额稳定关税与白银顺差，然近代思潮传播放缓。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_maritime_qing_opening:0 "康乾锐意开海与近代海关"
 STATIC_MODIFIER_DESC_oe_pmch_mod_maritime_qing_opening:0 "打破一口通商旧例，广设江浙闽粤海关并扶植南洋华商与近代炮舰水师，加速科技与海洋崛起。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_modern_banner_army:0 "中西历算合流与近代新军八旗"
 STATIC_MODIFIER_DESC_oe_pmch_mod_modern_banner_army:0 "摒弃守旧弓马习气，将乌真超哈重炮、欧式燧发枪线列操典与皇家格致历算融为一体，缔造亚洲近代超级强权。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_banner_commercial_reform:0 "出旗为民与绿营精兵整编"
 STATIC_MODIFIER_DESC_oe_pmch_mod_banner_commercial_reform:0 "解除旗人禁商禁耕旧律，准许汉军与闲散旗丁转入工商并裁汰冗兵，一举化解八旗生计顽疾。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_banner_martial_purge:0 "整饬京营八旗军纪"
 STATIC_MODIFIER_DESC_oe_pmch_mod_banner_martial_purge:0 "以重饷严律重整京师与各地驻防八旗，恢复尚武锋芒但国库负担沉重。"
 oe_pmch_ref_eight_banner_state:0 "八旗军政合一制"
 oe_pmch_ref_eight_banner_state_desc:0 "以满蒙汉八旗牛录打破部族血缘藩篱，实现出则为兵、入则为民的高效动员体系，同时强化巴牙喇重骑与乌真超哈重炮火力。"
 oe_pmch_ref_dual_inner_asian_empire:0 "理藩院满汉蒙藏二元帝国"
 oe_pmch_ref_dual_inner_asian_empire_desc:0 "以理藩院统筹蒙古盟旗、西藏政教与西域绿洲，兼采中原州县官制，极大拓展文化容纳力并削减广袤内亚疆域的距离控制衰减。"
 oe_pmch_banner_governance_law:0 "八旗与二元帝国治国方略"
 oe_pmch_banner_governance_law_desc:0 "确立满洲国家在固守满蒙尚武骑射本位、满汉一体中原共治与十三行海贸革新之间的核心治理路线。"
 oe_pmch_pol_manchu_martial_primacy:0 "满蒙尚武骑射本位"
 oe_pmch_pol_manchu_martial_primacy_desc:0 "坚持国语骑射与八旗优渥军制，赋予重骑冲锋、纪律与部族忠诚强劲加成。"
 oe_pmch_pol_manchu_han_dyarchy:0 "满汉一体共治制"
 oe_pmch_pol_manchu_han_dyarchy_desc:0 "于六部内阁推行满汉复职并开科举延揽中原才俊，大幅提高行政控驭、税收效率与多族整合。"
 oe_pmch_pol_cohong_maritime_opening:0 "十三行通商与海贸革新"
 oe_pmch_pol_cohong_maritime_opening_desc:0 "整顿广州十三行并逐步放宽四口海关互市，以茶叶丝瓷汇聚欧亚白银并引入近代历算火器工艺。"
 oe_pmch_banner_drillground:0 "八旗演武校场与乌真超哈铸炮局"
 oe_pmch_banner_drillground_desc:0 "集八旗骑射演武、乌真超哈红衣大炮冶铸与辽东军需互市于一体的军政重镇设施，全面提升本地兵源、控驭、产效与商容。"
 oe_pmch_banner_drillground_maint:0 "八旗校场与铸炮局常备物料"
 oe_pmch_banner_heavy_cavalry:0 "八旗巴牙喇护军铁骑"
 oe_pmch_banner_heavy_cavalry_desc:0 "遴选自满洲八旗精锐的「巴牙喇」（护军）重甲铁骑：身披双层棉甲铁叶、兼擅重弓与长矛冲锋，乃萨尔浒与松锦决战中的无双破阵利刃。"
 oe_pmch_ujen_cooha_artillery:0 "乌真超哈红衣重炮营"
 oe_pmch_ujen_cooha_artillery_desc:0 "皇太极专设的汉军八旗重兵「乌真超哈」炮兵营，集中操作巨型红衣大炮与攻城云梯，专为轰碎宁远、锦州与山海关石垣堡垒而生。"
 oe_pmch_adv_ujen_cooha:0 "乌真超哈重炮与巴牙喇操典"
 oe_pmch_adv_ujen_cooha_desc:0 "将八旗巴牙喇重甲铁骑野战突击与乌真超哈红衣重炮攻城协同制度化，全面解锁巴牙喇护军铁骑与乌真超哈重炮营。"
 oe_pmch_dec_organize_eight_banners.title:0 "编练八旗牛录"
 oe_pmch_dec_organize_eight_banners.desc:0 "以三百壮丁户编立牛录、整编正镶八旗军政体系，大幅提升八旗动员度并强化骑兵纪律与人力储备。"
 oe_pmch_dec_organize_eight_banners.a:0 "编立牛录，整饬八旗"
 oe_pmch_dec_organize_eight_banners_tt:0 "八旗牛录动员度 +25（上限 100），获得 20 年八旗军政合一增益。"
 oe_pmch_dec_raise_ujen_cooha.title:0 "组建乌真超哈红衣大炮汉军旗"
 oe_pmch_dec_raise_ujen_cooha.desc:0 "招募归降汉将与铸炮大匠扩编乌真超哈重兵，打造攻破宁锦与山海关坚城的红衣大炮主力。"
 oe_pmch_dec_raise_ujen_cooha.a:0 "铸造红衣大炮，扩编乌真超哈"
 oe_pmch_dec_raise_ujen_cooha_tt:0 "乌真超哈等级 +1（上限 4），获得 25 年重炮攻坚增益；若「山海关决战」局势已启则大幅推升破关压力。"
 oe_pmch_dec_establish_lifan_yuan.title:0 "设立理藩院与推行摊丁入亩"
 oe_pmch_dec_establish_lifan_yuan.desc:0 "设理藩院统筹满汉蒙藏二元大帝国政务，并在中原推行摊丁入亩与改土归流，极大增强文化容纳、疆域控驭与国库岁入。"
 oe_pmch_dec_establish_lifan_yuan.a:0 "立理藩院，行摊丁入亩"
 oe_pmch_dec_establish_lifan_yuan_tt:0 "满汉共治轴向中原一体化推进 +20，获得 40 年理藩院与摊丁入亩大帝国增益。"
 oe_sit_manchu_pass:0 "山海关决战：满洲入关"
 oe_sit_manchu_pass_desc:0 "白山黑水间的八旗劲旅携乌真超哈红衣重炮兵临辽西走廊，与中原王朝依托宁远、锦州与山海关（抚宁）构筑的关宁红衣防线展开决定东亚三百年国运的世纪拉锯。破关者定鼎北京改号「大清」，守关者则将重铸中原威仪！"
 oe_sit_manchu_pass_conquest:0 "破关定鼎中原：大清龙兴"
 oe_sit_manchu_pass_conquest_desc:0 "八旗与乌真超哈重炮突破山海关并入主北京（大都），满洲正式改号「大清」（保持 MCH 主体零断链），开启满汉蒙藏二元大帝国时代。"
 oe_sit_manchu_pass_repelled:0 "关宁固若金汤：宁锦大捷"
 oe_sit_manchu_pass_repelled_desc:0 "中原守军凭借宁远与山海关红衣大炮防线坚守十五载或反克沈辽，满洲破关受挫转而经略朝鲜与北亚。"
 oe_sit_manchu_pass_stalemate:0 "南北分治和议：长城互市"
 oe_sit_manchu_pass_stalemate_desc:0 "关内外两强长期对峙耗竭，终沿山海关与长城划界息兵，重开抚顺与辽东官办马市通商。"
 oe_pmch_map_manchu_tt:0 "#G 满洲八旗破关阵营#!"
 oe_pmch_map_pass_tt:0 "#Y 山海关—宁锦—大都决战走廊#!"
 oe_pmch_map_defender_tt:0 "#R 中原关宁防线守军#!"
 oe_pmch_map_observer_tt:0 "#color_yellow 东亚与北亚观战诸邦#!"
 oe_pmch.1.title:0 "白山黑水：建州、海西与野人女真三部格局"
 oe_pmch.1.desc:0 "长白山麓与松花江、黑龙江之间，女真分为建州、海西（扈伦四部）与野人东海三大支系，各部城寨林立而又互为竞合。面对南方的中原大朝，诸部首领须抉择：奉表朝贡以换取辽东马市铁器布帛，抑或磨砺骑射蓄积兵势图谋白山一统？"
 oe_pmch.1.a:0 "奉马通贡中原，换取马市铁器与赏赐"
 oe_pmch.1.b:0 "厉兵秣马苦练骑射，图谋一统白山黑水"
 oe_pmch.2.title:0 "赫图阿拉崛起与抚顺马市争端"
 oe_pmch.2.desc:0 "随着赫图阿拉城寨日渐兴盛，长白山野山参、紫貂皮与东珠沿抚顺马市源源输往辽东，换回生铁、火药与粮谷。垄断山林珍货与马市定价权将迅速充盈建州军资，而与海西诸城结好通商则能广结外援。"
 oe_pmch.2.a:0 "垄断抚顺人参貂皮专市，广储铁器军资"
 oe_pmch.2.b:0 "与海西诸部签立互市盟约，缓进图霸"
 oe_pmch.3.title:0 "十三副遗甲与兼并海西四部"
 oe_pmch.3.desc:0 "怀揣祖传十三副遗甲起兵以来，建州锋芒毕露，哈达、辉发、乌拉、叶赫扈伦四部已难阻统一大势！以铁骑利剑扫平松花江与开原诸寨可一战立威，辅以满蒙联姻怀柔则可加速诸部归心并筹建满洲大汗国。"
 oe_pmch.3.a:0 "挥师横扫扈伦四部，以铁血定鼎白山"
 oe_pmch.3.b:0 "恩威并施联姻叶赫乌拉，稳步吞并整合"
 oe_pmch.4.title:0 "创立八旗牛录与满文创制"
 oe_pmch.4.desc:0 "为彻底打破女真各部血缘山头，大汗以传统狩猎组织「牛录」（箭，每三百丁户为一牛录）为基石，先立黄白红蓝四旗，再扩编四镶旗为「八旗」，实现「出则为兵、入则为民」的军政超级动员；同时命额尔德尼与噶盖借蒙古字母创制满文，文教与军令焕然一新！"
 oe_pmch.4.a:0 "定制正镶八旗牛录，颁行满文一统军政"
 oe_pmch.4.b:0 "暂行四旗缓改旧制，安抚诸部贝勒宗老"
 oe_pmch.5.title:0 "七大恨与 1619 萨尔浒决战"
 oe_pmch.5.desc:0 "告天誓师「七大恨」之后，中原与朝鲜联军号称十余万分四路合围赫图阿拉！面对数倍强敌，大汗定下「凭尔几路来，我只一路去」的内线集中突击方略：集中六万八旗精骑在萨尔浒、尚间崖与阿布达里冈数日连破杜松、马林、刘綎诸路，一战颠覆辽东战局！"
 oe_pmch.5.a:0 "「凭尔几路来，我只一路去！」集中八旗闪电破敌"
 oe_pmch.5.b:0 "依托赫图阿拉山城坚壁消耗敌军粮道"
 oe_pmch.6.title:0 "宁远受挫的教训与「乌真超哈」重炮八旗"
 oe_pmch.6.desc:0 "辽西坚城与西洋红衣大炮让善战野战的八旗弓骑吃尽苦头。新君痛定思痛，打破门户之见，大量吸纳归降汉将、火器匠人与铸炮名师，专设操作红衣重炮与火铳攻坚的汉军重装兵团——满语称「乌真超哈」（Ujen Cooha，意为重兵），彻底补齐满洲攻城火力短板！"
 oe_pmch.6.a:0 "破格重用汉将匠人，编练乌真超哈红衣重炮旗"
 oe_pmch.6.b:0 "仍以八旗巴牙喇铁骑绕关劫掠为主力"
 oe_pmch.7.title:0 "蒙满联姻与漠南蒙古归附"
 oe_pmch.7.desc:0 "漠南科尔沁与察哈尔诸部相继归附，献上相传自大元宫廷流传下来的传国玉玺！通过世代满蒙联姻与设立蒙古八旗，沈阳汗廷将白山黑水与广袤草原连成一体，既消除侧翼之忧，又以成吉思汗法统震慑华北与内亚。"
 oe_pmch.7.a:0 "设立蒙古八旗，缔结世代满蒙黄金姻盟"
 oe_pmch.7.b:0 "将漠南诸部直接编入盛京直辖军府"
 oe_pmch.8.title:0 "山海关风云：中原动荡与破关之机"
 oe_pmch.8.desc:0 "中原久陷党争、旱蝗与财政困局，山海关（抚宁）与宁锦走廊已成为决定天下易主的咽喉要冲！「山海关决战」大局势正式拉开帷幕——八旗可调集乌真超哈重炮正面强攻辽西诸堡，亦可遣密使重金策反关宁边将里应外合。"
 oe_pmch.8.a:0 "集结八旗与乌真超哈，正面强攻宁锦山海关"
 oe_pmch.8.b:0 "遣密使厚礼招抚关宁边将，伺机开关纳降"
 oe_pmch.9.title:0 "辽西松锦大战与红衣重炮轰城"
 oe_pmch.9.desc:0 "锦州与宁远城下硝烟蔽日，松锦决战打响！若集中乌真超哈全部红衣大炮与八旗精锐一举轰破辽西核心堡垒，山海关大门将彻底敞开；倘若双方均已精疲力竭，亦可借机抛出长城划界与辽东互市和议，以和平分治收官。"
 oe_pmch.9.a:0 "齐发乌真超哈红衣重炮，毕其功于松锦一役"
 oe_pmch.9.b:0 "遣使议和长城划界，重开辽东官办马市"
 oe_pmch.10.title:0 "龙兴燕京：改号「大清」与迁都北京"
 oe_pmch.10.desc:0 "八旗旌旗飘扬在紫禁城与山海关城头！大汗告祭天地正式改国号为「大清」，迁都北京（大都）以承中华天命。面临广袤中原与江南财赋，新朝须立刻定下百年立国基调：优抚汉族士绅实行满汉一体共治，还是高举八旗驻防尚武本位以铁骑震慑天下？"
 oe_pmch.10.a:0 "改号「大清」迁都北京，优抚汉绅推行满汉共治"
 oe_pmch.10.b:0 "改号「大清」迁都北京，遍设八旗驻防严守尚武"
 oe_pmch.11.title:0 "设立理藩院与内亚二元帝国"
 oe_pmch.11.desc:0 "疆域东起长白海滨、西跨蒙古草原直至拉萨与吐鲁番、喀什噶尔，单一中原州县制已不足以统筹多元内亚。朝廷可设立专署「理藩院」，以盟旗、活佛册封与伯克旧制构建满汉蒙藏回多元共主二元帝国，亦可推行将军军府铁腕直辖。"
 oe_pmch.11.a:0 "定制理藩院，建构满汉蒙藏多元共主二元帝国"
 oe_pmch.11.b:0 "广设西域与漠北将军军府，以兵屯直辖边疆"
 oe_pmch.12.title:0 "摊丁入亩与改土归流"
 oe_pmch.12.desc:0 "康熙「盛世滋丁，永不加赋」之后，雍正新政进一步推行「摊丁入亩」，彻底将人头丁税并入田亩征收，免除无地贫民沉重丁役；同时在西南推行「改土归流」，废除世袭土司割据改设流官州县，释放出空前的人口与农税大潮！"
 oe_pmch.12.a:0 "力排众议推行摊丁入亩与西南改土归流"
 oe_pmch.12.b:0 "保留传统丁税与西南土司旧制以维系地方安定"
 oe_pmch.13.title:0 "尼布楚与 1727《恰克图条约》：接手北方毛皮商路"
 oe_pmch.13.desc:0 "俄罗斯帝国东进西伯利亚，哥萨克探险队与清军在黑龙江雅克萨兵戎相见。经尼布楚勘界与 1727 年恰克图条约，双方可以正式划定漫长北疆并在恰克图开辟官办茶马毛皮大商路，亦可重兵驻守黑龙江以威慑北邻。"
 oe_pmch.13.a:0 "缔结尼布楚与恰克图条约，开辟北方茶马毛皮商路"
 oe_pmch.13.b:0 "重兵增筑黑龙江与松花江防线，严防北邻南下"
 oe_pmch.14.title:0 "广州十三行还是锐意开海？"
 oe_pmch.14.desc:0 "十八世纪欧亚海商云集珠江口广州（番禺），茶叶、生丝与瓷器换回滚滚白银。盛世君臣迎来决定未来百年的终极分叉：是推行「广州十三行」（Cohong）一口通商以稳态控银、防范外患，还是锐意开放四口海关、扶植南洋华商并编练近代炮舰水师？"
 oe_pmch.14.a:0 "路线甲：定广州十三行一口通商，稳态控银防患"
 oe_pmch.14.b:0 "路线乙：锐意开海设关，扶植南洋华商与近代水师"
 oe_pmch.15.title:0 "中西历算合流与近代新军火器化"
 oe_pmch.15.desc:0 "钦天监汇通中西历算与测绘舆图，军机处亦察觉欧洲线列燧发枪与野战炮的日新月异。大帝国决意打破八旗弓马守旧惯性，将乌真超哈重炮传统与近代燧发枪阵、格致学堂深度结合，以亚洲巅峰强权之姿迎向十九世纪！"
 oe_pmch.15.a:0 "全面推行八旗火器线列化与皇家格致学堂"
 oe_pmch.15.b:0 "以绿营海防炮台配属八旗仪卫，求稳守成"
 oe_pmch.16.title:0 "八旗生计危机与绿营整编"
 oe_pmch.16.desc:0 "入关承平百余载后，人口暴增而禁商禁耕的八旗旗丁渐陷「八旗生计」困局，京师与驻防旗营奢靡渐生、军备松弛，绿营兵额亦虚耗国帑。朝廷必须在「准许出旗为民转型近代工商」与「耗银铁腕整饬八旗军纪」间当机立断。"
 oe_pmch.16.a:0 "准许闲散旗丁出旗为民、转入工商并裁汰冗兵"
 oe_pmch.16.b:0 "拨银铁腕整顿京营八旗，恢复国语骑射军纪"
 oe_pmch.90.title:0 "【审计读数】女真/满洲入关状态面板"
 oe_pmch.90.desc:0 "#T 槽位 80 · 女真统一与满洲八旗入关（oe_pmch_）只读状态#!\n· 读数来源（0无 1本国为女真/满洲主机 2读取c:MCH 3读取c:JEC）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_host').GetValue|0]#!\n· 八旗牛录动员度（0–100）/ 乌真超哈重炮等级（0–4）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_banners').GetValue|0]#! / #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_ujen').GetValue|0]#!\n· 满汉共治轴（-100满蒙尚武 .. +100满汉一体）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_dual').GetValue|0]#!\n· 大清改号标志（1=已执行 QNG 动态改名且保持 MCH 零断链）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_qing').GetValue|0]#!\n· 局势 oe_sit_manchu_pass 状态（0未启 1进行中 11破关 12击退 13和议）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_sit_state').GetValue|0]#!\n· 山海关破关压力（0–100）/ 局势持续月数 / 已触发满洲事件数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_pressure').GetValue|0]#! / #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_months').GetValue|0]#! / #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_events').GetValue|0]#!"
 oe_pmch.90.a:0 "已知悉（关闭读数面板）"
 oe_mch_act_banner_vanguard:0 "动员八旗先登劲旅"
 oe_mch_act_banner_vanguard_cd:0 "动员八旗先登劲旅"
 oe_mch_act_banner_vanguard_desc:0 "拨付银两与威望集结八旗重甲巴牙喇与红衣炮营猛攻山海关防线，补充人力与陆军传统、获得 5 年重骑与攻城增益，并使破关压力提升#G +8#!。"
 oe_mch_act_banner_vanguard_tt:0 "使#Y 山海关破关压力#!提升#G +8#!（0–100）。"
 oe_mch_act_liaodong_defectors:0 "招抚辽东明将降军"
 oe_mch_act_liaodong_defectors_cd:0 "招抚辽东明将降军"
 oe_mch_act_liaodong_defectors_desc:0 "以高爵厚禄与汉军旗籍招降动摇的辽西将佐与火器工匠，提升稳定度、获得 5 年整合与攻城增益，并使破关压力提升#G +6#!。"
 oe_mch_act_liaodong_defectors_tt:0 "使#Y 山海关破关压力#!提升#G +6#!（0–100）。"
 oe_mch_act_reinforce_pass:0 "增援山海关宁锦守军"
 oe_mch_act_reinforce_pass_cd:0 "增援山海关宁锦守军"
 oe_mch_act_reinforce_pass_desc:0 "调派精锐边军与红夷大炮增防关宁锦一线坚城，提升陆军传统、获得 5 年防御与要塞维护增益，并使破关压力降低#R -8#!。"
 oe_mch_act_reinforce_pass_tt:0 "使#Y 山海关破关压力#!降低#R -8#!（0–100）。"
 oe_mch_act_frontier_supplies:0 "筹措辽东海运边饷"
 oe_mch_act_frontier_supplies_cd:0 "筹措辽东海运边饷"
 oe_mch_act_frontier_supplies_desc:0 "打通渤海运粮船队并整顿关外屯田仓廪，稳定军心与后勤补给，提升稳定度与人力、获得 5 年军需粮食增益，并使破关压力降低#R -6#!。"
 oe_mch_act_frontier_supplies_tt:0 "使#Y 山海关破关压力#!降低#R -6#!（0–100）。"
 oe_mch_act_pass_diplomacy:0 "周旋关塞危局外交"
 oe_mch_act_pass_diplomacy_cd:0 "周旋关塞危局外交"
 oe_mch_act_pass_diplomacy_desc:0 "在中原与关外激战之际遣使两面斡旋、维系互市与边防安全，获得威望与 5 年外交、陆贸及防御加成。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_act_banner_vanguard:0 "八旗先登劲旅"
 STATIC_MODIFIER_DESC_oe_pmch_mod_act_banner_vanguard:0 "集结于山海关前的八旗重骑与重炮部队对关塞防线施加持续猛攻。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_act_liaodong_defectors:0 "辽东降将归附网"
 STATIC_MODIFIER_DESC_oe_pmch_mod_act_liaodong_defectors:0 "归附的辽西旧将带来城防图志、火炮技艺与顺畅的地方接管体系。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_act_reinforce_pass:0 "关宁铁壁增防"
 STATIC_MODIFIER_DESC_oe_pmch_mod_act_reinforce_pass:0 "生力守军与棱堡火炮阵地将山海关与宁远铸成铜墙铁壁。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_act_frontier_supplies:0 "渤海边饷补给线"
 STATIC_MODIFIER_DESC_oe_pmch_mod_act_frontier_supplies:0 "源源不断的海运粮秣与边疆仓廪保障了北疆大军粮饷无忧。"
 STATIC_MODIFIER_NAME_oe_pmch_mod_act_pass_diplomacy:0 "关塞危局外交斡旋"
 STATIC_MODIFIER_DESC_oe_pmch_mod_act_pass_diplomacy:0 "老练的使节斡旋在大国对峙期间保全了本国边疆商市与防务。"
