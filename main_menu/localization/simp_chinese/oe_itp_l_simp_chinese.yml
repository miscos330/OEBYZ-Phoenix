 oe_itp_hire_fleet_none: "@trigger_no!没有可以卖船给我们的意大利共和国。"
 oe_itp_grain_ships: "包租粮船"
 oe_itp_grain_ships_desc: "向威尼斯或热那亚包租一支粮船队，把黑海的小麦运进京城：花费#R 2#!个月的收入，获得[ShowModifier('oe_itp_grain_convoy')]（每月食物#G +5%#!），为期#Y 12#!个月；粮船在时，黑海粮道#G 松一档#!（从下个月的结算起）。京城正被封锁时，粮船还让粮储#G +10#!。\n条件：黑海粮道吃紧或断绝；眼下没有包租的粮船；对方的[oe_tu_privilege|e]至少是免税居留，不在与我们交战；与威尼斯的商约作废时不能找威尼斯；加拉塔之争打起来时不能找热那亚。\n黑海粮道现在：[GetCountry('BYZ').Custom('OeItpGrain')]。包租现在要#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#!金币。"
 oe_itp_grain_ships_card: "向威尼斯或热那亚包租粮船，把黑海的小麦运进京城。"
 oe_itp_grain_ships_tt: "所选的共和国派粮船替我们运粮，为期#Y 12#!个月（花费与效果见说明）。"
 oe_itp_grain_ships_select: "选择承运的共和国"
 oe_itp_grain_ships_none: "@trigger_no!没有可以替我们运粮的意大利共和国。"
 game_concept_oe_tu_privilege: "意大利特权"
 game_concept_oe_tu_privilege_desc: "#F 阿莱克修斯一世的金玺诏书让威尼斯人在帝国免税经商；1261年的宁菲翁条约给了热那亚人关税优待和佩拉的商区；比萨在1111年、拉古萨后来也各得了商约。#!\n\n君士坦丁堡给意大利商业共和国的特权分四级：\n无约（#Y 0#!级）：不能借款。\n商约（#Y 1#!级）：可以小额借款。威尼斯、热那亚从免税居留降到商约时，我们向对方征商税。\n免税居留（#Y 2#!级）：对方免交海峡通行费，在京城有商区。威尼斯、热那亚开局就在这一级，代价已含在开局的加拉塔修正、通行费豁免和外国商区里。比萨、拉古萨到这一级时，我们的关税收入#R −2%#!，贸易优势#G +2%#!。\n抵押租让（#Y 3#!级）：再给对方舰队驻泊权，期限#Y 240#!个月。威尼斯：关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!；热那亚：关税收入#R −8%#!、贸易优势#R −5%#!。\n\n上限：威尼斯、热那亚到抵押租让，“驱逐外夷”之后或京城的对方商区没了时只到免税居留；比萨、拉古萨到免税居留，拉古萨是威尼斯的附庸时只到商约。\n开局：威尼斯、热那亚免税居留，比萨、拉古萨商约。\n威尼斯的商约每#Y 60#!个月到期一次，到期时可以续约、讨价还价或任其作废；威尼斯记着的旧账（以千杜卡特计）在续约时分期偿付。\n收回特权会招来报复。加拉塔之争进行时，热那亚的特权不变。\n特权在免税居留以上的威尼斯、热那亚和拉古萨可以卖桨帆船给我们：船在君士坦丁堡交付，归帝国所有。威尼斯与热那亚交战时，两家都会要帝国表态。\n黑海粮道：君士坦丁堡的粮食有许多从黑海运来。粮道分通畅、吃紧、断绝三档，每月结算一次。吃紧时市民的满意度目标#R −5%#!、每月食物#R −5%#!；断绝时市民的满意度目标#R −10%#!、每月食物#R −15%#!。卡法被围或在打仗、拉丁人被逐出塔纳之后的北岸禁运（帝国的商船照常北上时不算）、热那亚与我们交战、加拉塔之争打起来、我们在两大共和国的战争里帮了威尼斯、我们与守着海峡两岸的奥斯曼人交战，各紧一档；京城被封锁时紧#Y 2#!档。包租的粮船、我们自己在黑海西岸的港口（安希亚洛、布尔加斯、瓦尔纳，还要有#Y 6#!艘战船或已决定自己运粮）、握有抵押租让而不与我们交战的热那亚、帝国在黑海粮港开设的#Y 2#!处以上商站，各松一档。\n比萨亡国、比萨城归了佛罗伦萨之后，佛罗伦萨接过比萨的位置和等级，会来请求比萨人的旧宅。拉古萨不再是威尼斯的附庸之后，若威尼斯的商约已不如前或威尼斯人对我们不友善，拉古萨会来求一道金玺诏书。\n在帝国柱石“财政诏令”的“商约与特权”一组里，可以借款、买船、包租粮船、出让和收回特权。"
 oe_itp.1.t: "威尼斯的商约到期"
 oe_itp.1.d1: "#F 1268年，米海尔八世与威尼斯订约，以五年为期：威尼斯商人重新在帝国免税经商，粮价不高时还能买粮出口。此后两国一次次续约；1390年的条约重申了旧债，其中的损害赔偿分五年付清。#!\n\n上次的商约任其作废之后，威尼斯总督的使节又来到宫门外，愿意重开谈判。威尼斯人在京城的[oe_tu_privilege|e]照旧，但没有商约，威尼斯的钱我们借不到。[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.d2: "#F 1268年，米海尔八世与威尼斯订约，以五年为期：威尼斯商人重新在帝国免税经商，粮价不高时还能买粮出口。此后两国一次次续约；1390年的条约重申了旧债，其中的损害赔偿分五年付清。#!\n\n与威尼斯的商约到期了。威尼斯总督的使节等在宫门外：照旧续约，就要按约分期偿付旧账；不然就得另谈条件。威尼斯人在京城的[oe_tu_privilege|e]，也在这张桌子上。[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.a: "照旧续约"
 oe_itp.1.a.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due')|0]#!金币，是旧账的这一期分期\n威尼斯旧账#G −[GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due_kd')|0]#!千杜卡特\n商约续#Y 60#!个月；与威尼斯无约的状态解除（如有）\n威尼斯对我们的好感#G +10#!（#Y 5#!年）"
 oe_itp.1.b: "讨价还价"
 oe_itp.1.b.tt: "成功的可能：#G [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_hgch').GetValue|0]%#!（威尼斯与热那亚或奥斯曼交战时更高，我们的战船不少于威尼斯一半时更高，旧账多时更低）\n成功：威尼斯的[oe_tu_privilege|e]降一级（从免税居留降为商约时，我们向威尼斯人征商税：关税收入#G +6%#!），商约续#Y 60#!个月\n失败：商约只续#Y 24#!个月，旧账#R +5#!千杜卡特\n无论成败：威尼斯对我们的好感#R −15#!（#Y 5#!年）"
 oe_itp.1.c: "任其作废"
 oe_itp.1.c.tt: "获得[ShowModifier('oe_itp_no_pact_ven')]（贸易优势#R −5%#!），直到重新续约\n不能向威尼斯借款\n#Y 24#!个月后威尼斯人再来\n威尼斯对我们的好感#R −25#!（#Y 10#!年）\n#R 15%#!的可能在#Y 3#!到#Y 9#!个月后遭到报复"
 oe_itp.1.d: "以抵押抵旧账"
 oe_itp.1.d.tt: "威尼斯的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：[ShowModifier('oe_itp_pledge_ven')]（关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!），并给威尼斯舰队驻泊权\n威尼斯旧账清零\n威尼斯另付我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m4')|0]#!金币\n商约续#Y 60#!个月\n威尼斯对我们的好感#G +30#!，热那亚#R −10#!"
 oe_itp.2.t: "意大利人的借款"
 oe_itp.2.desc: "#F 1343年，安娜太后把皇冠珠宝押给威尼斯，借了三万杜卡特；1352年，威尼斯又借给约翰五世五千杜卡特。#!\n\n国库见底，[SCOPE.sCountry('oe_itp_r').GetName]的商人却手头宽裕。对方的使节提出借给我们一笔钱：或者照常例付息，或者拿一级[oe_tu_privilege|e]来换一笔无息的借款。"
 oe_itp.2.a: "以特权换借款"
 oe_itp.2.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#!金币，无息，#Y 120#!个月还清\n[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：我们得到抵押的修正（威尼斯：关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!；热那亚：关税收入#R −8%#!、贸易优势#R −5%#!），并给对方舰队驻泊权\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#G +30#!，对手#R −10#!"
 oe_itp.2.b: "以特权换借款"
 oe_itp.2.b.tt: "[SCOPE.sCountry('oe_itp_r').GetName]借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#!金币，无息，#Y 60#!个月还清\n[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]回到免税居留：我们不再向对方征商税（如有）"
 oe_itp.2.c: "按常例借"
 oe_itp.2.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName]借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#!金币，年息#R 6%#!（禁止外国银行之后#R 7%#!），#Y 60#!个月还清"
 oe_itp.2.d: "谢绝"
 oe_itp.2.d.tt: "什么也不发生"
 oe_itp.3.t: "意大利人的船队"
 oe_itp.3.desc: "#F 阿莱克修斯一世用一道金玺诏书换来了威尼斯的舰队，去对付诺曼人；1261年的宁菲翁条约里，热那亚答应出最多五十艘船，换的是关税优待和佩拉的商区。#!\n\n海上吃紧，我们自己的战船不够用。[SCOPE.sCountry('oe_itp_r').GetName]的使节说，船坞里有一支现成的桨帆船队：拿一级[oe_tu_privilege|e]来换，或者出钱买下。船一交到我们手里，就是帝国的船，不必归还。朝中也有人说，不如自己造。"
 oe_itp.3.a: "以特权换船队"
 oe_itp.3.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]交给我们#Y 8#!艘桨帆船，停在君士坦丁堡；船归帝国，不再归还\n[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：我们得到抵押的修正（威尼斯：关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!；热那亚：关税收入#R −8%#!、贸易优势#R −5%#!），并给对方舰队驻泊权\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#G +30#!，对手#R −10#!"
 oe_itp.3.b: "出钱买船"
 oe_itp.3.b.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m5')|0]#!金币\n[SCOPE.sCountry('oe_itp_r').GetName]交给我们#Y 6#!艘桨帆船，停在君士坦丁堡；船归帝国，不再归还\n对方的对手（威尼斯与热那亚互为对手）对我们的好感#R −5#!（#Y 5#!年）"
 oe_itp.3.c: "自己造船"
 oe_itp.3.c.tt: "获得[ShowModifier('oe_itp_own_fleet')]（桨帆船造价#G −20%#!），为期#Y 10#!年\n威望#G +5#!"
 oe_itp.4.t: "特权的报复"
 oe_itp.4.d1: "#F 1348年，约翰六世降低京城的关税，与加拉塔抢生意，热那亚人随即渡过金角湾烧船攻城；1451年，君士坦丁十一世加征威尼斯货物的关税，威尼斯转身与穆罕默德二世订了约。#!\n\n[SCOPE.sCountry('oe_itp_r').GetName]的人没有忘记。对方的战船在海上截住了我们的一艘船，放火烧了。[GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.d2: "#F 1348年，约翰六世降低京城的关税，与加拉塔抢生意，热那亚人随即渡过金角湾烧船攻城；1451年，君士坦丁十一世加征威尼斯货物的关税，威尼斯转身与穆罕默德二世订了约。#!\n\n[SCOPE.sCountry('oe_itp_r').GetName]的人没有忘记。对方扣下了我们商人的货，罚没了约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#!金币。[GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.a: "赔款了事"
 oe_itp.4.a.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#!金币\n[SCOPE.sCountry('oe_itp_r').GetName]因收回特权、商约作废或战时助敌而生的怨恨消除"
 oe_itp.4.b: "以牙还牙"
 oe_itp.4.b.tt: "扣押对方的商船，得#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#!金币\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#R −20#!（#Y 10#!年）\n#R 20%#!的可能再遭一次报复（只此一次）"
 oe_itp.4.c: "恢复对方的特权"
 oe_itp.4.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]升一级\n[SCOPE.sCountry('oe_itp_r').GetName]因收回特权而生的怨恨消除"
 oe_itp.4.d: "恢复商约"
 oe_itp.4.d.tt: "与威尼斯的商约恢复，续#Y 60#!个月；与威尼斯无约的状态解除\n威尼斯因商约作废而生的怨恨消除"
 oe_itp.5.t: "加拉塔之后"
 oe_itp.5.desc: "#F 约1348年，过往博斯普鲁斯的船只所缴的关税，帝国只收到约百分之十三，其余都归了加拉塔。#!\n\n加拉塔的特权废除了。加拉塔的关税回到帝国手里，热那亚人在帝国别的港口也不再免税。热那亚的[oe_tu_privilege|e]降为商约。"
 oe_itp.5.a: "记下"
 oe_itp.5.a.tt: "热那亚的特权已降为商约（加拉塔之争的结果已经计入关税，不再另征商税）"
 oe_itp.6.t: "两大共和国交战"
 oe_itp.6.desc: "#F 1350年，威尼斯与热那亚为黑海的生意开战。1351年，约翰六世与威尼斯结盟；1352年2月的博斯普鲁斯海战之后，帝国只得单独与热那亚讲和，港口从此对威尼斯人关闭。#!\n\n威尼斯与热那亚开战了。两家的使节先后进宫，都要帝国表态：港口向谁开，粮船跟谁走。两家在京城都有[oe_tu_privilege|e]，哪一家都不好得罪。[GetCountry('BYZ').Custom('OeItpFamLine')]"
 oe_itp.6.a: "帮威尼斯"
 oe_itp.6.a.tt: "威尼斯资助我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m4')|0]#!金币\n威尼斯旧账#G −10#!千杜卡特\n威尼斯对我们的好感#G +25#!（#Y 10#!年）\n热那亚对我们的好感#R −30#!（#Y 10#!年）\n#R 30%#!的可能在#Y 3#!到#Y 9#!个月后遭到热那亚的报复\n两家停战之前，热那亚人的粮船不来：黑海粮道#R 紧一档#!"
 oe_itp.6.b: "帮热那亚"
 oe_itp.6.b.tt: "热那亚人替我们包运粮船，直到两家停战（至多#Y 36#!个月）：获得[ShowModifier('oe_itp_grain_convoy')]（每月食物#G +5%#!）\n威尼斯旧账#R +5#!千杜卡特\n热那亚对我们的好感#G +25#!（#Y 10#!年）\n威尼斯对我们的好感#R −30#!（#Y 10#!年）\n#R 30%#!的可能在#Y 3#!到#Y 9#!个月后遭到威尼斯的报复\n粮船在时，黑海粮道#G 松一档#!（从下个月的结算起）；我们已有包租的粮船时，不另给"
 oe_itp.6.c: "守中立"
 oe_itp.6.c.tt: "两家的船都来我们的港口：获得[ShowModifier('oe_itp_neutral_port')]（关税收入#G +10%#!），直到两家停战（至多#Y 36#!个月）\n威尼斯、热那亚各自对我们的好感#R −5#!（#Y 5#!年）"
 oe_itp.7.t: "京城缺粮"
 oe_itp.7.desc: "#F 1343年，札尼别把拉丁人逐出塔纳，威尼斯与热那亚联手禁运，卡法两度被围，黑海北岸的粮食好几年运不出来。君士坦丁堡吃的小麦，有许多是热那亚商人从黑海运来的。#!\n\n[GetCountry('BYZ').Custom('OeItpGrainWhy')]京城的粮仓快要见底，市上的麦价一日数涨。粮商手里还有存粮，只是要价很高。朝中有人主张限价、搜查囤粮；也有人说，不如拿一级[oe_tu_privilege|e]去换一纸粮约。"
 oe_itp.7.a: "高价向热那亚人买粮"
 oe_itp.7.a.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m3')|0]#!金币\n获得[ShowModifier('oe_itp_grain_convoy')]（每月食物#G +5%#!），为期#Y 12#!个月：黑海粮道#G 松一档#!（从下个月的结算起）\n京城正被封锁时：粮储另#G +10#!\n热那亚对我们的好感#G +10#!（#Y 5#!年）"
 oe_itp.7.b: "限价，搜查囤粮"
 oe_itp.7.b.tt: "市民阶层满意度#R −10%#!\n#Y 12#!个月内，黑海粮道至多算作吃紧，不算断绝（从下个月的结算起）"
 oe_itp.7.c: "以粮约换特权：热那亚"
 oe_itp.7.c.tt: "热那亚的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：[ShowModifier('oe_itp_pledge_gen')]（关税收入#R −8%#!、贸易优势#R −5%#!），并给热那亚舰队驻泊权\n热那亚握有抵押租让、又不与我们交战时，黑海粮道#G 松一档#!（从下个月的结算起）\n热那亚对我们的好感#G +30#!，威尼斯#R −10#!"
 oe_itp.7.d: "以粮约换特权：威尼斯"
 oe_itp.7.d.tt: "威尼斯的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：[ShowModifier('oe_itp_pledge_ven')]（关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!），并给威尼斯舰队驻泊权\n威尼斯人替我们包运粮食\n获得[ShowModifier('oe_itp_grain_convoy')]（每月食物#G +5%#!），为期#Y 60#!个月：黑海粮道#G 松一档#!（从下个月的结算起）\n京城正被封锁时：粮储另#G +10#!\n威尼斯对我们的好感#G +30#!，热那亚#R −10#!"
 oe_itp.7.e: "硬撑"
 oe_itp.7.e.tt: "稳定度#R −2.5#!"
 oe_itp.8.t: "黑海粮约"
 oe_itp.8.desc: "#F 1348年，约翰六世降低京城的关税，向私人借钱造舰，想让帝国在粮食和海运上不再仰赖加拉塔。#!\n\n黑海粮道吃紧已经有些日子了。[SCOPE.sCountry('oe_itp_r').GetName]的粮商找上门来，愿意立约包运：我们先付一笔钱，对方的船队在#Y 60#!个月里按期把黑海的小麦运进金角湾。朝中也有人说，只要黑海西岸还有我们的港口，粮食就该由我们自己的船来运。"
 oe_itp.8.a: "签约"
 oe_itp.8.a.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#!金币\n获得[ShowModifier('oe_itp_grain_convoy')]（每月食物#G +5%#!），为期#Y 60#!个月：黑海粮道#G 松一档#!（从下个月的结算起）\n京城正被封锁时：粮储另#G +10#!"
 oe_itp.8.b: "我们自己运"
 oe_itp.8.b.tt: "获得[ShowModifier('oe_itp_own_fleet')]（桨帆船造价#G −20%#!），为期#Y 10#!年\n从此只要安希亚洛、布尔加斯、瓦尔纳有一处在我们手里，黑海粮道#G 松一档#!（从下个月的结算起）"
 oe_itp.8.c: "不必"
 oe_itp.8.c.tt: "什么也不发生"
 oe_itp.9.t: "外夷已逐"
 oe_itp.9.desc: "京城的外国商区已经不在了。[SCOPE.sCountry('oe_itp_r').GetName]在帝国的抵押与租让随之作废：抵押的修正和舰队驻泊权都已收回，[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]降为免税居留。对方的人说，我们撕毁了抵押之约。"
 oe_itp.9.a: "随对方去说"
 oe_itp.9.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]的特权已降为免税居留\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#R −30#!（#Y 10#!年）"
 oe_itp.10.t: "拉古萨的金玺诏书"
 oe_itp.10.desc: "#F 1451年，君士坦丁十一世给拉古萨一道金玺诏书：拉古萨人可以在京城建教堂、设领事，由领事审理本国商人的纠纷，关税也减了一些。这道诏书的用意之一，是让威尼斯人不痛快。#!\n\n拉古萨已经不再听命于威尼斯。拉古萨的使节带着厚礼来到宫中，请求一道金玺诏书：在京城免税居留，设一名领事，开一处商馆。[GetCountry('BYZ').Custom('OeItpVenCool')]"
 oe_itp.10.a: "颁给金玺诏书"
 oe_itp.10.a.tt: "拉古萨的[oe_tu_privilege|e]升为免税居留：我们得到[ShowModifier('oe_itp_exempt_rag')]（关税收入#R −2%#!、贸易优势#G +2%#!），给拉古萨海峡通行费豁免和商馆权\n拉古萨对我们的好感#G +10#!（#Y 50#!年）\n威尼斯对我们的好感#R −10#!（#Y 5#!年）"
 oe_itp.10.b: "只许设领事"
 oe_itp.10.b.tt: "拉古萨可以在京城设一名领事，审理本国商人的纠纷；特权不变\n拉古萨对我们的好感#G +10#!（#Y 5#!年）\n拉古萨#Y 10#!年内不再来求"
 oe_itp.10.c: "不予理会"
 oe_itp.10.c.tt: "什么也不发生\n拉古萨#Y 10#!年内不再来求"
 oe_itp.11.t: "比萨人的旧宅"
 oe_itp.11.desc: "#F 比萨在1111年就从阿莱克修斯一世那里得到了商约和码头。1439年大公会议结束时，约翰八世给佛罗伦萨两道金玺诏书：佛罗伦萨人得到在君士坦丁堡经商的权利，比萨人原来的会馆也转给了佛罗伦萨人，关税减了一些。#!\n\n比萨已经归了佛罗伦萨。佛罗伦萨的使节来到宫中，请求接过比萨人在京城的会馆和[oe_tu_privilege|e]，并像当年的比萨人那样少交关税。眼下佛罗伦萨人沿用比萨的旧约：[GetCountry('BYZ').Custom('OeItpTierPis')]。[GetCountry('BYZ').Custom('OeItpCouncilLine')]"
 oe_itp.11.a: "准其所请"
 oe_itp.11.a.tt: "佛罗伦萨的[oe_tu_privilege|e]升为免税居留（已是时不变）：我们得到[ShowModifier('oe_itp_exempt_flo')]（关税收入#R −2%#!、贸易优势#G +2%#!），给佛罗伦萨海峡通行费豁免\n佛罗伦萨对我们的好感#G +10#!（升级时，#Y 50#!年），另#G +10#!（#Y 5#!年）"
 oe_itp.11.b: "只认比萨的旧约"
 oe_itp.11.b.tt: "佛罗伦萨的[oe_tu_privilege|e]为商约，照比萨的旧约（原为免税居留时，免税和通行费豁免一并收回）\n佛罗伦萨对我们的好感#G +10#!（#Y 5#!年）"
 oe_itp.11.c: "拒绝"
 oe_itp.11.c.tt: "佛罗伦萨在京城没有商约（比萨的[oe_tu_privilege|e]作废）\n佛罗伦萨对我们的好感#R −10#!（#Y 5#!年）"
 oe_itp.12.t: "威尼斯的索赔"
 oe_itp.12.desc: "#F 1390年，约翰七世与威尼斯订约，旧债又被一一写进条文，其中有一万七千余海佩伦的损害赔偿，分五年付清。#!\n\n[GetCountry('BYZ').Custom('OeItpClaimWhy')]威尼斯总督的使节递上一份清单：威尼斯商人在帝国境内被毁的货栈、被扣的船、被抢的货，一项项折成了杜卡特。对方要把这笔数记进旧账，续约时分期偿付。眼下威尼斯人记着的旧账是#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_ven_claims').GetValue|0]#!千杜卡特（每千杜卡特约合#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_kd')|0]#!金币）。"
 oe_itp.12.a: "承认"
 oe_itp.12.a.tt: "威尼斯旧账#R +10#!千杜卡特\n威尼斯对我们的好感#G +10#!（#Y 5#!年）"
 oe_itp.12.b: "只认一半"
 oe_itp.12.b.tt: "威尼斯旧账#R +5#!千杜卡特\n威尼斯对我们的好感#R −15#!（#Y 5#!年）"
 oe_itp.12.c: "不认"
 oe_itp.12.c.tt: "威尼斯对我们的好感#R −25#!（#Y 10#!年）\n与威尼斯的商约提前#Y 24#!个月到期"
 oe_itp.13.t: "抵押期满"
 oe_itp.13.desc: "#F 1370年，约翰五世在威尼斯因债被扣，许以特内多斯岛抵债；1352年的和约又让加拉塔的地界向外扩了一圈。#!\n\n我们给[SCOPE.sCountry('oe_itp_r').GetName]的抵押与租让到期了。可以把抵押收回来，也可以再押十年。"
 oe_itp.13.a: "收回抵押"
 oe_itp.13.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]降为免税居留：抵押的修正去掉，舰队驻泊权收回\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#R −10#!（#Y 5#!年）"
 oe_itp.13.b: "续押十年"
 oe_itp.13.b.tt: "抵押与租让再延#Y 120#!个月\n[SCOPE.sCountry('oe_itp_r').GetName]付我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m5')|0]#!金币"
 oe_itp.13.c: "以续押抵旧账"
 oe_itp.13.c.tt: "抵押与租让再延#Y 120#!个月\n威尼斯旧账#G −10#!千杜卡特"
 oe_itp.14.t: "讨价还价的结果"
 oe_itp.14.d1: "威尼斯人让步了。使节在新约上签了字：威尼斯人在帝国的[oe_tu_privilege|e]降了一级，商约续订#Y 60#!个月。威尼斯人记下了这一回的讨价还价。"
 oe_itp.14.d2: "威尼斯人一步不让。使节只肯把旧约延长#Y 24#!个月，还把这一趟交涉算进了旧账：#R +5#!千杜卡特。威尼斯人在帝国的[oe_tu_privilege|e]照旧。威尼斯人记下了这一回的讨价还价。"
 oe_itp.14.a: "知道了"
 oe_itp.14.a.tt: "结果已经生效，见上文；等级、商约月数和旧账可以在“商约与特权”的行动说明里看到"
