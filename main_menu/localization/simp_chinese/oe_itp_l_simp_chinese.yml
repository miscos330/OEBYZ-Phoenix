 oe_itp_borrow_desc: "向一家与帝国订有商约的意大利共和国借款，#Y 60#!个月还清，计入外债。数额和年息看对方的[oe_tu_privilege|e]：商约，#Y 4#!个月收入，年息#Y 8%#!；免税居留，#Y 8#!个月收入，年息#Y 6%#!；抵押租让，#Y 12#!个月收入，年息#Y 4%#!。禁止外国银行之后，年息各加#Y 1%#!。\n条件：对方对我们的好感不低于#Y 0#!，不在交战，没有未还清的借款；同一家#Y 24#!个月内只借一次；与威尼斯的商约作废时不能向威尼斯借；我们的外债少于#Y 18#!个月的收入。\n现在：一个月的收入约#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#!金币，外债#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fdebt')|0]#!金币，上限#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m18')|0]#!金币。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_ven')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_ven')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_ven')|0]#!金币\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_gen')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_gen')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_gen')|0]#!金币\n比萨：[GetCountry('BYZ').Custom('OeItpTierPis')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_pis')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_pis')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_pis')|0]#!金币\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_rag')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_rag')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_rag')|0]#!金币\n威尼斯的商约：[GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_borrow_card: "向有商约的意大利共和国借款，数额和年息看特权等级。"
 oe_itp_borrow_tt: "所选的共和国借给我们一笔钱（数额和年息见说明），#Y 60#!个月还清。"
 oe_itp_borrow_select: "选择借款的对象"
 oe_itp_borrow_none: "@trigger_no!没有可以借款的意大利共和国。"
 oe_itp_grant: "出让特权"
 oe_itp_grant_desc: "给一家意大利共和国的[oe_tu_privilege|e]升一级。\n升到免税居留：比萨、拉古萨送我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#!金币（#Y 2#!个月收入）；我们给对方海峡通行费豁免（拉古萨另有商馆权），并得到[ShowModifier('oe_itp_exempt_pis')]（关税收入#R −2%#!、贸易优势#G +2%#!）或[ShowModifier('oe_itp_exempt_rag')]（关税收入#R −2%#!、贸易优势#G +2%#!）；对方好感#G +10#!。威尼斯、热那亚从商约回到免税居留时，送我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m3')|0]#!金币（#Y 3#!个月收入），我们对对方的征商税取消。\n升到抵押租让（只有威尼斯、热那亚）：对方借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#!金币，无息，#Y 120#!个月还清；我们给对方舰队驻泊权，期限#Y 240#!个月，得到[ShowModifier('oe_itp_pledge_ven')]（关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!）或[ShowModifier('oe_itp_pledge_gen')]（关税收入#R −8%#!、贸易优势#R −5%#!）；对方好感#G +30#!，对手（威尼斯与热那亚互为对手）好感#R −10#!；威望#R −5#!。\n上限：威尼斯、热那亚到抵押租让，“驱逐外夷”之后或京城的对方商区没了时只到免税居留；比萨、拉古萨到免税居留，拉古萨是威尼斯的附庸时只到商约。\n同一家#Y 60#!个月内只能出让或收回一次。加拉塔之争进行时，热那亚的特权不能动。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]\n比萨：[GetCountry('BYZ').Custom('OeItpTierPis')]\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]\n威尼斯的商约：[GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_grant_card: "给一家意大利共和国升一级特权，换钱或无息借款。"
 oe_itp_grant_tt: "所选共和国的特权升一级（所得与代价见说明）。"
 oe_itp_grant_select: "选择出让特权的对象"
 oe_itp_grant_none: "@trigger_no!没有可以出让特权的意大利共和国。"
 oe_itp_revoke: "收回特权"
 oe_itp_revoke_desc: "把一家意大利共和国的[oe_tu_privilege|e]降一级。\n对方在抵押租让：赎回抵押，付#R 8#!个月的收入（期限只剩#Y 60#!个月以内时#R 4#!个月），降为免税居留；对方对我们的好感#R −10#!（#Y 5#!年）。\n对方在免税居留或商约：花费#R 10#![oe_tu_authority|e]，降一级；对方对我们的好感#R −40#!（#Y 20#!年）。威尼斯、热那亚从免税居留降为商约时，我们向对方征商税（关税收入#G +6%#!或#G +5%#!，市民的满意度目标#G +3%#!）；威尼斯、热那亚开局就有的海峡通行费豁免不撤。比萨、拉古萨降为商约时，免税、通行费豁免和商馆权一并收回。之后#Y 3#!到#Y 9#!个月内可能遭到报复：威尼斯、热那亚#R 30%#!（对方的战船比我们多时#R 45%#!），比萨、拉古萨#R 10%#!。\n同一家#Y 60#!个月内只能出让或收回一次。加拉塔之争进行时，热那亚的特权不能动。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]\n比萨：[GetCountry('BYZ').Custom('OeItpTierPis')]\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]\n威尼斯的商约：[GetCountry('BYZ').Custom('OeItpVenPact')]\n赎回威尼斯的抵押现需#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_ven')|0]#!金币；赎回热那亚的抵押现需#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_gen')|0]#!金币。"
 oe_itp_revoke_card: "收回一家意大利共和国的一级特权，可能招来报复。"
 oe_itp_revoke_tt: "所选共和国的特权降一级（代价见说明）。"
 oe_itp_revoke_select: "选择收回特权的对象"
 oe_itp_revoke_none: "@trigger_no!没有可以收回特权的意大利共和国。"
 game_concept_oe_tu_privilege: "意大利特权"
 game_concept_oe_tu_privilege_desc: "#F 阿莱克修斯一世的金玺诏书让威尼斯人在帝国免税经商；1261年的宁菲翁条约给了热那亚人关税优待和佩拉的商区；比萨在1111年、拉古萨后来也各得了商约。#!\n\n君士坦丁堡给意大利商业共和国的特权分四级：\n无约（#Y 0#!级）：不能借款。\n商约（#Y 1#!级）：可以小额借款。威尼斯、热那亚从免税居留降到商约时，我们向对方征商税。\n免税居留（#Y 2#!级）：对方免交海峡通行费，在京城有商区。威尼斯、热那亚开局就在这一级，代价已含在开局的加拉塔修正、通行费豁免和外国商区里。比萨、拉古萨到这一级时，我们的关税收入#R −2%#!，贸易优势#G +2%#!。\n抵押租让（#Y 3#!级）：再给对方舰队驻泊权，期限#Y 240#!个月。威尼斯：关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!；热那亚：关税收入#R −8%#!、贸易优势#R −5%#!。\n\n上限：威尼斯、热那亚到抵押租让，“驱逐外夷”之后或京城的对方商区没了时只到免税居留；比萨、拉古萨到免税居留，拉古萨是威尼斯的附庸时只到商约。\n开局：威尼斯、热那亚免税居留，比萨、拉古萨商约。\n威尼斯的商约每#Y 60#!个月到期一次，到期时可以续约、讨价还价或任其作废；威尼斯记着的旧账（以千杜卡特计）在续约时分期偿付。\n收回特权会招来报复。加拉塔之争进行时，热那亚的特权不变。\n在帝国柱石“财政诏令”的“商约与特权”一组里，可以借款、出让和收回特权。"
 oe_itp.1.t: "威尼斯的商约到期"
 oe_itp.1.d1: "#F 1268年，米海尔八世与威尼斯订约，以五年为期：威尼斯商人重新在帝国免税经商，粮价不高时还能买粮出口。此后两国一次次续约；1390年的条约重申了旧债，其中的损害赔偿分五年付清。#!\n\n上次的商约任其作废之后，威尼斯总督的使节又来到宫门外，愿意重开谈判。威尼斯人在京城的[oe_tu_privilege|e]照旧，但没有商约，威尼斯的钱我们借不到。[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.d2: "#F 1268年，米海尔八世与威尼斯订约，以五年为期：威尼斯商人重新在帝国免税经商，粮价不高时还能买粮出口。此后两国一次次续约；1390年的条约重申了旧债，其中的损害赔偿分五年付清。#!\n\n与威尼斯的商约到期了。威尼斯总督的使节等在宫门外：照旧续约，就要按约分期偿付旧账；不然就得另谈条件。威尼斯人在京城的[oe_tu_privilege|e]，也在这张桌子上。[GetCountry('BYZ').Custom('OeItpClaimsLine')][GetCountry('BYZ').Custom('OeItpJewelsLine')]"
 oe_itp.1.a: "照旧续约"
 oe_itp.1.a.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due')|0]#!金币，是旧账的这一期分期\n威尼斯旧账#G −[GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_due_kd')|0]#!千杜卡特\n商约续#Y 60#!个月；与威尼斯无约的状态解除（如有）\n威尼斯对我们的好感#G +10#!（#Y 5#!年）"
 oe_itp.1.b: "讨价还价"
 oe_itp.1.b.tt: "成功的可能：#G [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_hgch').GetValue|0]%#!（威尼斯与热那亚或奥斯曼交战时更高，我们的战船不少于威尼斯一半时更高，旧账多时更低）\n成功：威尼斯的[oe_tu_privilege|e]降一级（从免税居留降为商约时，我们向威尼斯人征商税：关税收入#G +6%#!），商约续#Y 60#!个月\n失败：商约只续#Y 24#!个月，旧账#R +5#!千杜卡特\n无论成败：威尼斯对我们的好感#R −15#!（#Y 5#!年）"
 oe_itp.1.c: "任其作废"
 oe_itp.1.c.tt: "获得[ShowModifier('oe_itp_no_pact_ven')]（贸易优势#R −5%#!），直到重新续约\n不能向威尼斯借款\n#Y 24#!个月后威尼斯人再来\n威尼斯对我们的好感#R −25#!（#Y 10#!年）\n#R 15%#!的可能在#Y 3#!到#Y 9#!个月后遭到报复"
 oe_itp.1.d: "以抵押抵旧账"
 oe_itp.1.d.tt: "威尼斯的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：[ShowModifier('oe_itp_pledge_ven')]（关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!），并给威尼斯舰队驻泊权\n威尼斯旧账清零\n威尼斯另付我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m4')|0]#!金币\n商约续#Y 60#!个月\n威尼斯对我们的好感#G +30#!，热那亚#R −10#!"
 oe_itp.2.t: "意大利人的借款"
 oe_itp.2.desc: "#F 1343年，安娜太后把皇冠珠宝押给威尼斯，借了三万杜卡特；1352年，威尼斯又借给约翰五世五千杜卡特。#!\n\n国库见底，[SCOPE.sCountry('oe_itp_r').GetName]的商人却手头宽裕。对方的使节提出借给我们一笔钱：或者照常例付息，或者拿一级[oe_tu_privilege|e]来换一笔无息的借款。"
 oe_itp.2.a: "以特权换借款"
 oe_itp.2.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#!金币，无息，#Y 120#!个月还清\n[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]升为抵押租让，期限#Y 240#!个月：我们得到抵押的修正（威尼斯：关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!；热那亚：关税收入#R −8%#!、贸易优势#R −5%#!），并给对方舰队驻泊权\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#G +30#!，对手#R −10#!"
 oe_itp.2.b: "以特权换借款"
 oe_itp.2.b.tt: "[SCOPE.sCountry('oe_itp_r').GetName]借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#!金币，无息，#Y 60#!个月还清\n[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]回到免税居留：我们不再向对方征商税（如有）"
 oe_itp.2.c: "按常例借"
 oe_itp.2.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName]借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m6')|0]#!金币，年息#R 6%#!（禁止外国银行之后#R 7%#!），#Y 60#!个月还清"
 oe_itp.2.d: "谢绝"
 oe_itp.2.d.tt: "什么也不发生"
 oe_itp.4.t: "特权的报复"
 oe_itp.4.d1: "#F 1348年，约翰六世降低京城的关税，与加拉塔抢生意，热那亚人随即渡过金角湾烧船攻城；1451年，君士坦丁十一世加征威尼斯货物的关税，威尼斯转身与穆罕默德二世订了约。#!\n\n[SCOPE.sCountry('oe_itp_r').GetName]的人没有忘记。对方的战船在海上截住了我们的一艘船，放火烧了。[GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.d2: "#F 1348年，约翰六世降低京城的关税，与加拉塔抢生意，热那亚人随即渡过金角湾烧船攻城；1451年，君士坦丁十一世加征威尼斯货物的关税，威尼斯转身与穆罕默德二世订了约。#!\n\n[SCOPE.sCountry('oe_itp_r').GetName]的人没有忘记。对方扣下了我们商人的货，罚没了约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#!金币。[GetCountry('BYZ').Custom('OeItpWhyLine')]"
 oe_itp.4.a: "赔款了事"
 oe_itp.4.a.tt: "支付#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#!金币\n[SCOPE.sCountry('oe_itp_r').GetName]因收回特权或商约作废而生的怨恨消除"
 oe_itp.4.b: "以牙还牙"
 oe_itp.4.b.tt: "扣押对方的商船，得#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#!金币\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#R −20#!（#Y 10#!年）\n#R 20%#!的可能再遭一次报复（只此一次）"
 oe_itp.4.c: "恢复对方的特权"
 oe_itp.4.c.tt: "[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]升一级\n[SCOPE.sCountry('oe_itp_r').GetName]因收回特权而生的怨恨消除"
 oe_itp.4.d: "恢复商约"
 oe_itp.4.d.tt: "与威尼斯的商约恢复，续#Y 60#!个月；与威尼斯无约的状态解除\n威尼斯因商约作废而生的怨恨消除"
 oe_itp.5.t: "加拉塔之后"
 oe_itp.5.desc: "#F 约1348年，过往博斯普鲁斯的船只所缴的关税，帝国只收到约百分之十三，其余都归了加拉塔。#!\n\n加拉塔的特权废除了。加拉塔的关税回到帝国手里，热那亚人在帝国别的港口也不再免税。热那亚的[oe_tu_privilege|e]降为商约。"
 oe_itp.5.a: "记下"
 oe_itp.5.a.tt: "热那亚的特权已降为商约（加拉塔之争的结果已经计入关税，不再另征商税）"
 oe_itp.9.t: "外夷已逐"
 oe_itp.9.desc: "京城的外国商区已经不在了。[SCOPE.sCountry('oe_itp_r').GetName]在帝国的抵押与租让随之作废：抵押的修正和舰队驻泊权都已收回，[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]降为免税居留。对方的人说，我们撕毁了抵押之约。"
 oe_itp.9.a: "随对方去说"
 oe_itp.9.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]的特权已降为免税居留\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#R −30#!（#Y 10#!年）"
 oe_itp.13.t: "抵押期满"
 oe_itp.13.desc: "#F 1370年，约翰五世在威尼斯因债被扣，许以特内多斯岛抵债；1352年的和约又让加拉塔的地界向外扩了一圈。#!\n\n我们给[SCOPE.sCountry('oe_itp_r').GetName]的抵押与租让到期了。可以把抵押收回来，也可以再押十年。"
 oe_itp.13.a: "收回抵押"
 oe_itp.13.a.tt: "[SCOPE.sCountry('oe_itp_r').GetName]的[oe_tu_privilege|e]降为免税居留：抵押的修正去掉，舰队驻泊权收回\n[SCOPE.sCountry('oe_itp_r').GetName]对我们的好感#R −10#!（#Y 5#!年）"
 oe_itp.13.b: "续押十年"
 oe_itp.13.b.tt: "抵押与租让再延#Y 120#!个月\n[SCOPE.sCountry('oe_itp_r').GetName]付我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m5')|0]#!金币"
 oe_itp.13.c: "以续押抵旧账"
 oe_itp.13.c.tt: "抵押与租让再延#Y 120#!个月\n威尼斯旧账#G −10#!千杜卡特"
