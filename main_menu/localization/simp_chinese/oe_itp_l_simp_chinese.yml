 oe_itp_borrow: "向意大利人借款"
 oe_itp_borrow_desc: "向一家与帝国订有商约的意大利共和国借款，#Y 60#!个月还清，计入外债。数额和年息看对方的[oe_tu_privilege|e]：商约，#Y 4#!个月收入，年息#Y 8%#!；免税居留，#Y 8#!个月收入，年息#Y 6%#!；抵押租让，#Y 12#!个月收入，年息#Y 4%#!。禁止外国银行之后，年息各加#Y 1%#!。\n条件：对方对我们的好感不低于#Y 0#!，不在交战，没有未还清的借款；同一家#Y 24#!个月内只借一次；与威尼斯的商约作废时不能向威尼斯借；我们的外债少于#Y 18#!个月的收入。\n现在：一个月的收入约#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m1')|0]#!金币，外债#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fdebt')|0]#!金币，上限#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m18')|0]#!金币。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_ven')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_ven')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_ven')|0]#!金币\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_gen')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_gen')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_gen')|0]#!金币\n[GetCountry('BYZ').Custom('OeItpSlot4')]：[GetCountry('BYZ').Custom('OeItpTierPis')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_pis')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_pis')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_pis')|0]#!金币\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]，可借#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_amt_rag')|0]#!金币，年息#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_borrow_pct_rag')|0]%#!，未还#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_loan_left_rag')|0]#!金币\n威尼斯的商约：[GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_borrow_card: "向有商约的意大利共和国借款，数额和年息看特权等级。"
 oe_itp_borrow_tt: "所选的共和国借给我们一笔钱（数额和年息见说明），#Y 60#!个月还清。"
 oe_itp_borrow_select: "选择借款的对象"
 oe_itp_borrow_none: "@trigger_no!没有可以借款的意大利共和国。"
 oe_itp_grant: "出让特权"
 oe_itp_grant_desc: "给一家意大利共和国的[oe_tu_privilege|e]升一级。\n升到免税居留：比萨、拉古萨送我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m2')|0]#!金币（#Y 2#!个月收入）；我们给对方海峡通行费豁免（拉古萨另有商馆权），并得到[ShowModifier('oe_itp_exempt_pis')]（关税收入#R −2%#!、贸易优势#G +2%#!）或[ShowModifier('oe_itp_exempt_rag')]（关税收入#R −2%#!、贸易优势#G +2%#!）；对方好感#G +10#!。威尼斯、热那亚从商约回到免税居留时，送我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m3')|0]#!金币（#Y 3#!个月收入），我们对对方的征商税取消。\n升到抵押租让（只有威尼斯、热那亚）：对方借给我们#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_m10')|0]#!金币，无息，#Y 120#!个月还清；我们给对方舰队驻泊权，期限#Y 240#!个月，得到[ShowModifier('oe_itp_pledge_ven')]（关税收入#R −6%#!、贸易优势#R −5%#!、每月食物#R −5%#!）或[ShowModifier('oe_itp_pledge_gen')]（关税收入#R −8%#!、贸易优势#R −5%#!）；对方好感#G +30#!，对手（威尼斯与热那亚互为对手）好感#R −10#!；威望#R −5#!。\n上限：威尼斯、热那亚到抵押租让，“驱逐外夷”之后或京城的对方商区没了时只到免税居留；比萨、拉古萨到免税居留，拉古萨是威尼斯的附庸时只到商约。\n同一家#Y 60#!个月内只能出让或收回一次。加拉塔之争进行时，热那亚的特权不能动。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]\n[GetCountry('BYZ').Custom('OeItpSlot4')]：[GetCountry('BYZ').Custom('OeItpTierPis')]\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]\n威尼斯的商约：[GetCountry('BYZ').Custom('OeItpVenPact')]"
 oe_itp_grant_card: "给一家意大利共和国升一级特权，换钱或无息借款。"
 oe_itp_grant_tt: "所选共和国的特权升一级（所得与代价见说明）。"
 oe_itp_grant_select: "选择出让特权的对象"
 oe_itp_grant_none: "@trigger_no!没有可以出让特权的意大利共和国。"
 oe_itp_revoke: "收回特权"
 oe_itp_revoke_desc: "把一家意大利共和国的[oe_tu_privilege|e]降一级。\n对方在抵押租让：赎回抵押，付#R 8#!个月的收入（期限只剩#Y 60#!个月以内时#R 4#!个月），降为免税居留；对方对我们的好感#R −10#!（#Y 5#!年）。\n对方在免税居留或商约：花费#R 10#![oe_tu_authority|e]，降一级；对方对我们的好感#R −40#!（#Y 20#!年）。威尼斯、热那亚从免税居留降为商约时，我们向对方征商税（关税收入#G +6%#!或#G +5%#!，市民的满意度目标#G +3%#!）；威尼斯、热那亚开局就有的海峡通行费豁免不撤。比萨、拉古萨降为商约时，免税、通行费豁免和商馆权一并收回。之后#Y 3#!到#Y 9#!个月内可能遭到报复：威尼斯、热那亚#R 30%#!（对方的战船比我们多时#R 45%#!），比萨、拉古萨#R 10%#!。\n同一家#Y 60#!个月内只能出让或收回一次。加拉塔之争进行时，热那亚的特权不能动。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]\n[GetCountry('BYZ').Custom('OeItpSlot4')]：[GetCountry('BYZ').Custom('OeItpTierPis')]\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]\n威尼斯的商约：[GetCountry('BYZ').Custom('OeItpVenPact')]\n赎回威尼斯的抵押现需#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_ven')|0]#!金币；赎回热那亚的抵押现需#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_redeem_gen')|0]#!金币。"
 oe_itp_revoke_card: "收回一家意大利共和国的一级特权，可能招来报复。"
 oe_itp_revoke_tt: "所选共和国的特权降一级（代价见说明）。"
 oe_itp_revoke_select: "选择收回特权的对象"
 oe_itp_revoke_none: "@trigger_no!没有可以收回特权的意大利共和国。"
 oe_itp_hire_fleet: "向意大利人买船"
 oe_itp_hire_fleet_desc: "向一家意大利共和国买一支桨帆船队，一次付清。船在君士坦丁堡交付，归帝国所有，不再归还；以后的维护由我们自己出。\n威尼斯、热那亚的[oe_tu_privilege|e]在免税居留时卖#Y 4#!艘，价#R 4#!个月的收入；在抵押租让时卖#Y 6#!艘，价#R 3#!个月的收入。拉古萨在免税居留时卖#Y 2#!艘，价#R 2#!个月的收入。比萨不卖船。向威尼斯或热那亚买船，另一家对我们的好感#R −5#!（#Y 5#!年）。\n条件：对方不在与我们交战；同一家#Y 36#!个月内只买一次；与威尼斯的商约作废时不能向威尼斯买；加拉塔之争进行时不能向热那亚买；国库付得起。\n威尼斯：[GetCountry('BYZ').Custom('OeItpTierVen')]，可买#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_n_ven')|0]#!艘，价#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_price_ven')|0]#!金币\n热那亚：[GetCountry('BYZ').Custom('OeItpTierGen')]，可买#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_n_gen')|0]#!艘，价#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_price_gen')|0]#!金币\n拉古萨：[GetCountry('BYZ').Custom('OeItpTierRag')]，可买#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_n_rag')|0]#!艘，价#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_itp_fleet_price_rag')|0]#!金币"
 oe_itp_hire_fleet_card: "向意大利共和国买一支桨帆船队，一次付清，船归帝国。"
 oe_itp_hire_fleet_tt: "所选的共和国把一支桨帆船队交到君士坦丁堡（艘数和价钱见说明），我们一次付清。"
