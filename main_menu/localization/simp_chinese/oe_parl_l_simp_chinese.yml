l_simp_chinese:
 opinion_oe_parl_theme_charter: "颁行军区兵役宪章"
 opinion_oe_parl_yam_postal: "扩建西域站赤驿道"
 STATIC_MODIFIER_NAME_oe_parl_mod_novellae_tax: "新查士丁尼税法"
 STATIC_MODIFIER_DESC_oe_parl_mod_novellae_tax: "元老院批准的新编帝国税法正在全国施行，显著提升直征税效与皇室权力。"
 oe_parl_byz_novellae_tax_code: "《新查士丁尼税法》"
 oe_parl_byz_novellae_tax_code_desc: "仿效查士丁尼《新律》重订行省田赋与商税章程，将豪强隐匿的庄园与赋额重新纳入帝国金库，以充实中央财政并压制世家专权。"
 STATIC_MODIFIER_NAME_oe_parl_mod_theme_charter: "军区兵役宪章"
 STATIC_MODIFIER_DESC_oe_parl_mod_theme_charter: "军区兵役宪章保障了屯田军户权益，极大增强帝国兵源储备与征召军战力。"
 oe_parl_byz_theme_service_charter: "《军区兵役宪章》"
 oe_parl_byz_theme_service_charter_desc: "明定世袭军户屯田与边防征召权责，保障诸军区将士俸禄与抚恤，使常备兵源、征召战力与藩镇忠心同步大振。"
 STATIC_MODIFIER_NAME_oe_parl_mod_pronoia_audit: "普罗诺亚采邑清丈"
 STATIC_MODIFIER_DESC_oe_parl_mod_pronoia_audit: "经元老院授权的采邑清丈正在追缴隐田税额，持续提升帝国对行省的直接控制。"
 oe_parl_byz_pronoia_audit_act: "《普罗诺亚采邑清丈法》"
 oe_parl_byz_pronoia_audit_act_desc: "派遣帝国清丈使核查历代赐予世家大族的普罗诺亚采邑，收回逾制隐田并充盈国库，虽必招贵族阶层强烈不满，却能重建行省控制度。"
 STATIC_MODIFIER_NAME_oe_parl_mod_golden_bull: "君堡金印航运特许"
 STATIC_MODIFIER_DESC_oe_parl_mod_golden_bull: "金印特许令活络了帝国诸港的远航贸易与海权巡弋，显著提升出口效率。"
 oe_parl_byz_golden_bull_shipping: "《君堡金印航运特许令》"
 oe_parl_byz_golden_bull_shipping_desc: "颁布帝国金印特许令扶持本国商船队与金角湾港务行会，打破外邦商帮的转运垄断，增强海上控制力与出口收益，市民阶层声望亦随之攀升。"
 STATIC_MODIFIER_NAME_oe_parl_mod_antoniniana_ii: "新安东尼努斯公民权"
 STATIC_MODIFIER_DESC_oe_parl_mod_antoniniana_ii: "普世罗马公民权法案凝聚了多民族帝国的向心力，扩充接纳文化容量并加快人口同化。"
 oe_parl_byz_constitutio_antoniniana_ii: "《新安东尼努斯海外公民权法》"
 oe_parl_byz_constitutio_antoniniana_ii_desc: "援引卡拉卡拉普世公民权古制，向归附帝国的海外行省与总督区良民授予罗马公民资格，扩大文化接纳容量、加速罗马化融合并安抚远藩之心。"
 STATIC_MODIFIER_NAME_oe_parl_mod_ecumenical_synod: "普世大公会议护教法"
 STATIC_MODIFIER_DESC_oe_parl_mod_ecumenical_synod: "国家与教会共守正统礼仪，显著提升圣像效力与行省宣教转化速度。"
 oe_parl_byz_ecumenical_synod_act: "《普世大公会议护教法》"
 oe_parl_byz_ecumenical_synod_act_desc: "由元老院与圣教会议联合护持正统教义与圣像礼仪，拨付传教与修院经费，大幅提升圣像伟力、传教效率及教士阶层的忠诚拥戴。"
 STATIC_MODIFIER_NAME_oe_parl_mod_greek_fire_arsenal: "帝国火器与船坞预算"
 STATIC_MODIFIER_DESC_oe_parl_mod_greek_fire_arsenal: "扩建后的帝国船坞与武库大幅压缩海军维持开支并提升全军纪律。"
 oe_parl_byz_greek_fire_arsenal_bill: "《帝国火器与海军船坞预算案》"
 oe_parl_byz_greek_fire_arsenal_bill_desc: "由国库即时拨付半年岁入扩建帝国船坞与猛火油武库，整饬舰队补给与常备军纪律，确保帝国在陆海两线皆握决定性火力优势。"
 STATIC_MODIFIER_NAME_oe_parl_mod_pandidakterion: "帝国大学与抄本拨款"
 STATIC_MODIFIER_DESC_oe_parl_mod_pandidakterion: "君士坦丁堡帝国大学广聚学人、刊行古籍，持续加速帝国科研与思潮蔓延。"
 oe_parl_byz_pandidakterion_grant: "《帝国大学与抄本抢救拨款案》"
 oe_parl_byz_pandidakterion_grant_desc: "资助君士坦丁堡帝国大学（潘迪达克特里翁）延揽欧亚学者、誊抄古典典籍与律法手稿，推动君堡繁盛并显著加快全境科研与思潮传播。"
 STATIC_MODIFIER_NAME_oe_parl_mod_grain_annona: "帝国官粮平准法"
 STATIC_MODIFIER_DESC_oe_parl_mod_grain_annona: "稳定的官粮平准体系保障了城乡口粮供给并显著减轻维稳压力。"
 oe_parl_byz_grain_annona_bill: "《埃及与黑海官粮平准法》"
 oe_parl_byz_grain_annona_bill_desc: "复兴罗马帝国官粮转运制度，统筹尼罗河与黑海粮船平抑京畿及大城粮价，既缓和饥荒隐患、稳固国本，又赢得广大农民阶层的衷心拥护。"
 STATIC_MODIFIER_NAME_oe_parl_mod_senate_compact: "元老院与大区财税协约"
 STATIC_MODIFIER_DESC_oe_parl_mod_senate_compact: "理顺后的中央与近卫大区财政协约提升了附庸岁入、内阁效率与外交承载力。"
 oe_parl_byz_senate_prefecture_compact: "《元老院与近卫大区财税协约》"
 oe_parl_byz_senate_prefecture_compact_desc: "理顺元老院与各近卫大区、总督区之间的贡赋分成与政务分工，扩增外交容量、提高附庸上缴效率，并有效缓和庞大疆域带来的帝国熵增负担。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_shibo: "开海市舶令"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_shibo: "市舶司通商令大开东南海贸门户，显著提高出口效率与海上存在感。"
 oe_parl_yuan_shibo_maritime_act: "《开海市舶令》"
 oe_parl_yuan_shibo_maritime_act_desc: "由中书省奏准重开东南市舶司与官督商办海贸，护航刺桐港（泉州）与杭州番舶往来，令大元海上存在感、出口收益与港埠繁荣齐头并进。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_silver_chao: "银库宝钞平准法"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_silver_chao: "足额白银准备金稳住了大元宝钞币值，持续压降通胀并提升税收效率。"
 oe_parl_yuan_silver_chao_act: "《银库宝钞平准法案》"
 oe_parl_yuan_silver_chao_act_desc: "在诸路行省设立平准行用库，以足色白银铜钱锚定中统、至正宝钞并严禁滥印，迅速压降通胀与借贷利率，重铸大元纸币信用。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_keju: "科举同考取士法"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_keju: "兼纳诸族英才的科举制度扩大了帝国文化接纳容量并加快学术科技进步。"
 oe_parl_yuan_keju_merit_bill: "《科举取士与色目汉官同考法》"
 oe_parl_yuan_keju_merit_bill_desc: "恢复并扩充科举取士名额，统筹蒙古、色目、汉人与南人学子同登仕途，虽触动部分勋贵世袭特权，却极大拓展帝国文化包容度与学术兴盛。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_grand_canal: "大运河疏浚与海运漕粮"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_grand_canal: "畅通的大运河与漕运体系极大提升了帝国各地营建速度与行省控制度。"
 oe_parl_yuan_grand_canal_corvee: "《疏浚大运河与海运漕粮案》"
 oe_parl_yuan_grand_canal_corvee_desc: "由国库拨付工程费并征发沿河夫役，疏浚京杭大运河闸坝、整修海运漕船，虽然短期耗费民力财力，却令全国营建效率与南北直控长足跃升。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_touxia: "诸王投下户籍核定"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_touxia: "核清投下户籍遏制了私征漏税，显著增强中央税效与附庸岁入。"
 oe_parl_yuan_touxia_audit_bill: "《诸王投下户籍核定法》"
 oe_parl_yuan_touxia_audit_bill_desc: "清查诸王宗室与勋臣在各地的投下户籍，明令私征钱粮须经中书省核准归库，以承受宗王贵族短期怨怼为代价，换取中央税效与藩属贡赋双升。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_xiyu_yam: "西域站赤驿道扩建"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_xiyu_yam: "四通八达的站赤驿道扩展了外交承载力，加快帝国各地思潮交流与政令传布。"
 oe_parl_yuan_xiyu_yam_postal_act: "《西域站赤驿道扩建法案》"
 oe_parl_yuan_xiyu_yam_postal_act_desc: "沿丝路古道与北疆草原增设站赤驿馆、备足驿马军粮，确保大都诏令朝发夕至，全面加速欧亚思潮传播并稳固西域诸藩与都护府忠诚。"
 STATIC_MODIFIER_NAME_oe_parl_mod_yuan_shenjiying: "神机火器监岁造"
 STATIC_MODIFIER_DESC_oe_parl_mod_yuan_shenjiying: "源源不断列装的新式火器与操典令帝国陆军纪律严明、士气高昂。"
 oe_parl_yuan_shenjiying_foundry_bill: "《神机火器监岁造预算案》"
 oe_parl_yuan_shenjiying_foundry_bill_desc: "专款拨付大都神机营与军器监，统一铸造火铳、佛郎机炮与精炼火药，以可观军费投入换取全军纪律与陆军士气的长期跃升。"
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_table_ranks: "十四等官秩表"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_table_ranks: "以军政功绩定品阶的近代官制显著强化沙皇皇权、科研进步与陆军纪律。"
 oe_parl_rus_table_of_ranks_act: "《十四等官秩表法案》"
 oe_parl_rus_table_of_ranks_act_desc: "破除旧波雅尔门第察举制，确立以文武功绩晋升的十四等官秩体系，虽势必激怒守旧世袭贵族，却将皇权、科研效率与军纪全面推向近代化。"
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_sudebnik: "全俄苏德勃尼克法典"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_sudebnik: "统一施行的全俄法典大幅规范地方征税并持续提升各省控制度。"
 oe_parl_rus_sudebnik_code: "《全俄法典（苏德勃尼克）颁行案》"
 oe_parl_rus_sudebnik_code_desc: "统一罗斯诸公国纷乱的司法与赋税成例，颁行通行全境的《苏德勃尼克》大法典，加强中央衙门对偏远州郡的直辖控制与国库岁入。"
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_cossack_charter: "哥萨克边疆屯垦特许"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_cossack_charter: "效命边防的哥萨克军团显著充实全国人力储备与边疆要塞守备规模。"
 oe_parl_rus_cossack_frontier_charter: "《哥萨克边疆屯垦特许状》"
 oe_parl_rus_cossack_frontier_charter_desc: "正式敕许顿河、第聂伯与乌拉尔边疆的哥萨克军团自治屯垦权，换取其常年戍守南方草原防线与远东要塞，极大充实兵源与要塞守备力。"
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_baltic_admiralty: "北方海军部法案"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_baltic_admiralty: "常设海军部统筹造舰补给与海上商路，降低舰队维持费并提高出口效率。"
 oe_parl_rus_baltic_admiralty_act: "《波罗的海与白海海军部法案》"
 oe_parl_rus_baltic_admiralty_act_desc: "设立常设海军部统筹北方船厂、松木帆布采办与出海商路护航，压降舰队日常维持费用并拓展全俄对欧海运出口贸易。"
 STATIC_MODIFIER_NAME_oe_parl_mod_rus_third_rome_synod: "全俄牧首区圣堂法案"
 STATIC_MODIFIER_DESC_oe_parl_mod_rus_third_rome_synod: "兴盛的牧首区与修院网络持续抬升沙皇合法性并加快边疆教化。"
 oe_parl_rus_third_rome_synod_act: "《全俄牧首区与圣堂修缮法案》"
 oe_parl_rus_third_rome_synod_act_desc: "由缙绅会议拨款修缮莫斯科与诸省圣堂修院、彰显全俄牧首区正统威仪，显著稳固君主合法性、加速草原新土归化并赢得教会拥护。"
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_toleration: "普世宗教宽容法"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_toleration: "成文法确立的宽容政策大幅缓解教派摩擦并提升各阶层基准满意度。"
 oe_parl_gen_religious_toleration_act: "《普世宗教宽容法》"
 oe_parl_gen_religious_toleration_act_desc: "面对多教并存的辽阔疆域，议会以成文法保障异端与异教社群的礼拜与经商安全，虽必引发保守教士阶层强烈反弹，却能长久安定诸省民心。"
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_overseas_cit: "海外领地公民权"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_overseas_cit: "平等的帝国公民与商贸待遇显著稳固附庸忠诚、扩充文化容量并提振出口。"
 oe_parl_gen_overseas_citizenship_act: "《海外领地公民权法案》"
 oe_parl_gen_overseas_citizenship_act_desc: "赋予附庸与海外领地的乡绅商贾平等诉权与帝国通商资格，显著增强诸藩忠诚、拓展接纳文化上限并畅通跨域货物流转。"
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_central_bank: "帝国国债与铸币公信"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_central_bank: "制度化的国债与铸币监管有效压低利息支出、抑制通胀并提升税收效率。"
 oe_parl_gen_imperial_central_bank_act: "《帝国国债与铸币公信法》"
 oe_parl_gen_imperial_central_bank_act_desc: "设立由议会背书的帝国公债与铸币监察机构，规范国债发行并杜绝私铸劣币，大幅压低融资利率、抑制通胀且稳步提升国库税效。"
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_artillery: "常备炮兵与筑城条例"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_artillery: "统一的筑城与炮兵条例全面强化全国要塞防御、压缩堡垒维护开支并积累陆军传统。"
 oe_parl_gen_standing_artillery_act: "《常备野战炮兵与筑城条例》"
 oe_parl_gen_standing_artillery_act_desc: "拨款整修边疆星堡与常备炮兵工坊，制定统一的棱堡守城与野战炮操典，显著增强要塞防御、节省堡垒维护费并锤炼陆军传统。"
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_royal_academy: "皇家科学院与出版特许"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_royal_academy: "皇家科学院与规范的学术出版网络持续推高全国识字率、思潮增速与科研效率。"
 oe_parl_gen_royal_academy_charter: "《皇家科学院与印刷出版特许法》"
 oe_parl_gen_royal_academy_charter_desc: "敕建皇家科学院并保护学术印刷工坊，鼓励天文、历法、冶金与格致著作广为刊行，显著加快识字普及、思潮扎根与前沿科研。"
 STATIC_MODIFIER_NAME_oe_parl_mod_gen_post_roads: "帝国官道与驿站预算"
 STATIC_MODIFIER_DESC_oe_parl_mod_gen_post_roads: "整修一新的官道与驿站体系极大提升了各地营建速度与中央直控力。"
 oe_parl_gen_imperial_post_roads_act: "《帝国官道与驿站筑路预算案》"
 oe_parl_gen_imperial_post_roads_act_desc: "拨付专项筑路基金整修贯穿诸省的官道、桥梁与驿站，加速物资调运与政令传达，令全国营建速度与行省控制度全面改善。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_frontier_estates: "边疆贵族庄园免税"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_frontier_estates: "为换取贵族阶层在议会中的支持，朝廷暂时豁免了部分边疆庄园赋税。"
 oe_parl_pa_nobles_frontier_estates: "敕免边疆贵族庄园赋税"
 oe_parl_pa_nobles_frontier_estates_simple: "边疆庄园免税特许"
 oe_parl_pa_nobles_frontier_estates_desc: "贵族阶层要求在五年内豁免其边疆领地的部分赋税以换取在议会中的大力支持；接受后将损失一定税收效率，但能赢得高额议案支持度。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_honorary_comm: "将门世袭荣誉军职"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_honorary_comm: "保留世袭军职安抚了贵族将门，却在短期内略微减缓了陆军传统的精进。"
 oe_parl_pa_nobles_honorary_commissions: "保留将门世袭荣誉军职"
 oe_parl_pa_nobles_honorary_commissions_simple: "将门世袭军职特权"
 oe_parl_pa_nobles_honorary_commissions_desc: "世家将门要求保留部分军团的世袭荣誉军职以示尊荣；此举会轻微拖累五年内的陆军传统积累，但可迅速争取贵族议员投赞成票。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_monastery_endow: "圣堂与修院修缮拨款"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_monastery_endow: "来自国库的专项修缮拨款令教士阶层深感满意并微幅提升宗教影响力。"
 oe_parl_pa_clergy_monastery_endowment: "拨款修缮修道院与圣堂"
 oe_parl_pa_clergy_monastery_endowment_simple: "修院与圣堂修缮拨款"
 oe_parl_pa_clergy_monastery_endowment_desc: "教士阶层请求国库即时拨付约一季度岁入用于修缮各地修道院与圣堂，作为回报将在议会辩论中全力支持朝廷法案。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_censorship: "异端印刷审查令"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_censorship: "教会对民间印刷品的严格审查略微放缓了思潮扩散，同时增强了宗教影响力。"
 oe_parl_pa_clergy_censorship_edict: "敕行异端书册审查令"
 oe_parl_pa_clergy_censorship_edict_simple: "审查异端印刷书册"
 oe_parl_pa_clergy_censorship_edict_desc: "教士阶层要求在五年内审查民间流传的异端小册子与刻本；此举会小幅放缓思潮增速，却能提升宗教影响力并换取教士支持。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_customs_rebate: "商港关税回扣特许"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_customs_rebate: "给予商帮的关税回扣小幅减少直接税效，同时刺激了商品出口活力。"
 oe_parl_pa_burghers_customs_rebate: "核减商港出口关税回扣"
 oe_parl_pa_burghers_customs_rebate_simple: "商港关税减免回扣"
 oe_parl_pa_burghers_customs_rebate_desc: "市民商帮要求对主要商港给予五年关税回扣以换取其在议会中的全力倒向；国库税效虽略降，但出口贸易效率亦将同步受惠。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_guild_monopoly: "行会专利专卖保护"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_guild_monopoly: "行会专卖特许安抚了市民阶层，却也推高了市面物价与轻微通胀。"
 oe_parl_pa_burghers_guild_monopoly: "敕许行会专利专卖权"
 oe_parl_pa_burghers_guild_monopoly_simple: "行会专利保护特许"
 oe_parl_pa_burghers_guild_monopoly_desc: "大商人与手工业行会请求朝廷在五年内确认其若干紧俏货物的专卖专利，虽会带来轻微通胀压力，却可迅速赢取市民议员的赞成票。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_corvee_relief: "官府徭役减免令"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_corvee_relief: "减轻徭役负担安抚了乡间百姓、提升维稳效率，代价是各地营建进度放缓。"
 oe_parl_pa_peasants_corvee_relief: "蠲免一年官府徭役"
 oe_parl_pa_peasants_corvee_relief_simple: "减免地方官府徭役"
 oe_parl_pa_peasants_corvee_relief_desc: "农民代表请求朝廷在五年内放宽征发官府徭役的尺度以让农时休养；各地营建进度将放缓一成，但能换来国家稳定度微升与强力支持度。"
 STATIC_MODIFIER_NAME_oe_parl_pa_mod_grain_subsidy: "开仓平粜惠农补贴"
 STATIC_MODIFIER_DESC_oe_parl_pa_mod_grain_subsidy: "朝廷补贴平价口粮有效稳住了乡间民生，提升粮食供给与农民满意度。"
 oe_parl_pa_peasants_grain_subsidy: "开仓平粜补贴乡民"
 oe_parl_pa_peasants_grain_subsidy_simple: "开仓平粜惠农补贴"
 oe_parl_pa_peasants_grain_subsidy_desc: "农民阶层请求国库拨付约两成岁入补贴平价口粮、接济荒年乡民；接受后将即刻支出国库金币，换取农民支持、粮食供给与满意度提升。"
