 oe_nbe_b_baltic_entente: "波罗的海—波立防俄协约"
 oe_nbe_b_danube_frontier_clash: "多瑙河门户铁血争锋"
 oe_nbe_b_danube_rome_accord: "多瑙河—萨瓦河双鹰防务协定"
 oe_nbe_b_east_kango_accord: "东亚勘合互市与海丝通好"
 oe_nbe_b_east_frontier_clash: "海倭私市与辽东边患交恶"
 STATIC_MODIFIER_NAME_oe_nbe_kalmar_centralized: "卡尔马三冠王室共主宪章"
 STATIC_MODIFIER_DESC_oe_nbe_kalmar_centralized: "以王室共主统合丹麦、瑞典与挪威军政，属邦忠诚与王权大振，但北欧世家贵族心怀怨望、维稳压力攀升。"
 STATIC_MODIFIER_NAME_oe_nbe_kalmar_federal: "卡尔马贵族议会联邦协约"
 STATIC_MODIFIER_DESC_oe_nbe_kalmar_federal: "保障瑞典与挪威贵族议会自治以维系三冠和平，贵族满意与地方繁荣上升，但中央王权与赋税调度受限。"
 STATIC_MODIFIER_NAME_oe_nbe_sound_toll_enforced: "厄勒海峡通行税重征"
 STATIC_MODIFIER_DESC_oe_nbe_sound_toll_enforced: "依托赫尔辛格与哥本哈根严征过峡商船重税，国库财源滚滚，却引来汉萨同盟敌意并拉高海峡巡防舰队开销。"
 STATIC_MODIFIER_NAME_oe_nbe_hansa_compromise: "汉萨—厄勒商团减税特许"
 STATIC_MODIFIER_DESC_oe_nbe_hansa_compromise: "向吕贝克与汉萨商团开放减税特许，北欧市民与商力受惠，但王室直接财权与关税主权被迫让渡。"
 STATIC_MODIFIER_NAME_oe_nbe_dominium_maris_baltici: "波罗的海霸权：北方雄狮军制"
 STATIC_MODIFIER_DESC_oe_nbe_dominium_maris_baltici: "以高度训练的常备军与重帆舰队角逐里加、塔林、维堡与涅瓦出海口，陆海战力兼强，但海陆军费沉重难支。"
 STATIC_MODIFIER_NAME_oe_nbe_baltic_plc_entente: "波罗的海—波立防俄协约"
 STATIC_MODIFIER_DESC_oe_nbe_baltic_plc_entente: "与波兰—立陶宛分治利沃尼亚商路以共制东疆强权，商贸与士气俱佳，但关税让利与贵族分肥令国库承压。"
 STATIC_MODIFIER_NAME_oe_nbe_swedish_copper_consolidation: "斯德哥尔摩铜铁矿务固本"
 STATIC_MODIFIER_DESC_oe_nbe_swedish_copper_consolidation: "专注国内铜铁冶炼与工场营建而暂避多线远征，生产力与民生稳健提升，但海军巡防与征召动员规模缩减。"
 STATIC_MODIFIER_NAME_oe_nbe_sound_toll_charter_mod: "《厄勒海峡通行税法典》"
 STATIC_MODIFIER_DESC_oe_nbe_sound_toll_charter_mod: "以成文法典规范波罗的海出入船只丈量与税率，商税与商力大进，但邻邦非议与巡逻舰队维护居高不下。"
 STATIC_MODIFIER_NAME_oe_nbe_black_army_hun: "多瑙河盾牌：马加什黑军"
 STATIC_MODIFIER_DESC_oe_nbe_black_army_hun: "以炉灶特别税供养常备重骑与火枪雇佣兵团扼守布达与贝尔格莱德，军纪与防务空前强悍，但军饷重压令底层农民怨声载道。"
 STATIC_MODIFIER_NAME_oe_nbe_magnate_banderia: "多瑙河大贵族领主兵团"
 STATIC_MODIFIER_DESC_oe_nbe_magnate_banderia: "倚重克罗地亚与特兰西瓦尼亚大贵族旗团分担边防，换取贵族拥戴与宽厚征召兵源，却削弱王权与野战纪律。"
 STATIC_MODIFIER_NAME_oe_nbe_hussite_wagenburg: "胡斯战车阵与布拉格圣杯自治"
 STATIC_MODIFIER_DESC_oe_nbe_hussite_wagenburg: "承继胡斯战争锻造的火铳战车阵法与布拉格学派传统，步兵火器、城防与科研俱进，但外交孤立且正统教士怀恨。"
 STATIC_MODIFIER_NAME_oe_nbe_compactata_compromise: "《布拉格协约》：中欧诸冠调和"
 STATIC_MODIFIER_DESC_oe_nbe_compactata_compromise: "以宽容妥协弥合天主教与温和圣杯派裂痕并维系中欧联姻，外交与民生受惠，但王权集中度与维稳效率下降。"
 STATIC_MODIFIER_NAME_oe_nbe_danube_military_frontier: "维也纳—布达—贝尔格莱德多瑙河军区"
 STATIC_MODIFIER_DESC_oe_nbe_danube_military_frontier: "沿多瑙河谷构筑纵深棱堡与常驻边防军区迎击巴尔干强权，防务、纪律与兵源大增，但军费与税效负担沉重。"
 STATIC_MODIFIER_NAME_oe_nbe_danube_rome_accord: "多瑙河—萨瓦河基督教划界防务协定"
 STATIC_MODIFIER_DESC_oe_nbe_danube_rome_accord: "与存续新罗马沿萨瓦河—多瑙河划界互保并畅通河谷商旅，商贸、外交与边防互利共赢，但须让渡部分边界税权与王室威仪。"
 STATIC_MODIFIER_NAME_oe_nbe_danube_customs_union: "维也纳—布拉格内陆关税同盟"
 STATIC_MODIFIER_DESC_oe_nbe_danube_customs_union: "贯通波希米亚银矿与奥地利河运商网以厚植国本，商税与繁荣稳升，但野战动员与前线士气有所松弛。"
 STATIC_MODIFIER_NAME_oe_nbe_danube_black_guard_mod: "多瑙河常备黑军防线"
 STATIC_MODIFIER_DESC_oe_nbe_danube_black_guard_mod: "以中央直辖常备劲旅取代散漫封君征召驻防河谷要冲，纪律、士气与防务大振，但常备军饷与征税压力繁重。"
 STATIC_MODIFIER_NAME_oe_nbe_korea_sadae_trade: "朝鲜“事大交邻”与东莱互市"
 STATIC_MODIFIER_DESC_oe_nbe_korea_sadae_trade: "以稳健礼制外交维系大陆宗藩和平并开放釜山东莱与开京互市，外交、商税与文教并进，但常备武备与征召偏疏。"
 STATIC_MODIFIER_NAME_oe_nbe_korea_yuan_maritime: "大元—朝鲜海陆互市专约"
 STATIC_MODIFIER_DESC_oe_nbe_korea_yuan_maritime: "借中兴大元畅通辽东官道与泉州—开京海丝商舶，商力与思潮传播突飞猛进，但两班贵族守旧派与王室威权承压。"
 STATIC_MODIFIER_NAME_oe_nbe_yuan_korea_bond: "东藩海陆互市协和"
 STATIC_MODIFIER_DESC_oe_nbe_yuan_korea_bond: "朝鲜半岛深度接入中兴大元辽东驿道与东南海丝，提升商贸与外交声誉，但须承担部分外藩赏赐开销。"
 STATIC_MODIFIER_NAME_oe_nbe_korea_turtle_navy: "朝鲜海防革新与龟船水师"
 STATIC_MODIFIER_DESC_oe_nbe_korea_turtle_navy: "重金打造装甲战船与沿海镇堡扼守对马海峡，桨帆战力、城防与纪律大增，但军费与税效承压颇重。"
 STATIC_MODIFIER_NAME_oe_nbe_japan_kango_tally: "日本勘合贸易与严剿倭寇令"
 STATIC_MODIFIER_DESC_oe_nbe_japan_kango_tally: "以官印勘合符统一管理对大陆通商并肃清九州海盗，官贸厚利与外交信誉大增，但触动西国海商武士利益且巡海费繁。"
 STATIC_MODIFIER_NAME_oe_nbe_japan_wokou_privateers: "西国武装私市与海商纵横"
 STATIC_MODIFIER_DESC_oe_nbe_japan_wokou_privateers: "放任九州与濑户内海武装船队越海走私，海上掠袭耐久、桨帆战力与水手暴涨，但国际信誉扫地、国内秩序承压。"
 STATIC_MODIFIER_NAME_oe_nbe_japan_silver_silk_road: "石见白银潮与泉州·宁波海丝"
 STATIC_MODIFIER_DESC_oe_nbe_japan_silver_silk_road: "灰吹法精炼的巨量日本白银涌入宁波与泉州市舶司换取生丝瓷器，商贸、产出与商程暴增，但引发通胀压力与地方控驭松动。"
 STATIC_MODIFIER_NAME_oe_nbe_silver_maritime_boom: "东瀛白银入海丝市舶繁荣"
 STATIC_MODIFIER_DESC_oe_nbe_silver_maritime_boom: "源源不断的东瀛白银汇入泉州与宁波市舶司，大幅充盈商税与货殖产出，但也伴生沿海通胀压力。"
 STATIC_MODIFIER_NAME_oe_nbe_shuinsen_controlled: "朱印船特许与限港管控"
 STATIC_MODIFIER_DESC_oe_nbe_shuinsen_controlled: "以幕府朱印状严格限量管控白银出海与商埠，王权、税效与官商并稳，但远洋商程收缩且自由市民受抑。"
 STATIC_MODIFIER_NAME_oe_nbe_liaodong_weisuo_order: "辽东—奴儿干羁縻卫所体统"
 STATIC_MODIFIER_DESC_oe_nbe_liaodong_weisuo_order: "以辽阳、沈阳重镇与抚顺马市锁控女真诸部，防务、属邦忠诚与骑兵精良，但边镇常备军饷与财政负担沉重。"
 STATIC_MODIFIER_NAME_oe_nbe_manchu_banner_rise: "白山黑水女真八旗雄起"
 STATIC_MODIFIER_DESC_oe_nbe_manchu_banner_rise: "统合建州与海西女真诸部整编八旗劲骑，纪律、骑兵冲锋与兵源剧增，但周边大国警觉孤立且民生疲于征战。"
 STATIC_MODIFIER_NAME_oe_nbe_liaodong_fur_frontier: "开原—辽阳人参貂皮互市羁縻"
 STATIC_MODIFIER_DESC_oe_nbe_liaodong_fur_frontier: "放宽关外马市与貂皮人参贸易以柔远安边，商税与边地民生受益，但边墙戒备与军心士气渐趋松懈。"
 STATIC_MODIFIER_NAME_oe_nbe_east_sea_tallies_mod: "东亚勘合互市勘验令"
 STATIC_MODIFIER_DESC_oe_nbe_east_sea_tallies_mod: "确立东亚海陆官营勘合查验体制，商贸、商程与商力齐升，但缉私海巡耗费高昂且沿海地方控驭承压。"
 STATIC_MODIFIER_NAME_oe_nbe_sound_customs_loc: "厄勒海峡皇家税关与炮台"
 STATIC_MODIFIER_DESC_oe_nbe_sound_customs_loc: "扼守厄勒海峡咽喉的皇家关卡与岸防炮垒，大幅提升商镇权势与繁荣。"
 STATIC_MODIFIER_NAME_oe_nbe_baltic_arsenal_loc: "波罗的海皇家船坞与兵站"
 STATIC_MODIFIER_DESC_oe_nbe_baltic_arsenal_loc: "面向波罗的海争霸而建的深水船坞与要塞军港，加速造舰与水手征募。"
 STATIC_MODIFIER_NAME_oe_nbe_danube_bastion_loc: "多瑙河铁闸要塞与黑军兵营"
 STATIC_MODIFIER_DESC_oe_nbe_danube_bastion_loc: "矗立于多瑙河交通咽喉的重型星形棱堡与常备军营，大幅强化要塞防务与兵源。"
 STATIC_MODIFIER_NAME_oe_nbe_kango_mart_loc: "东亚勘合市舶互市口岸"
 STATIC_MODIFIER_DESC_oe_nbe_kango_mart_loc: "承办官营勘合符验与白银生丝交割的枢纽商埠，显著抬升商贸中心权势与繁荣。"
 STATIC_MODIFIER_NAME_oe_nbe_liaodong_weisuo_loc: "辽东羁縻卫所与关外马市"
 STATIC_MODIFIER_DESC_oe_nbe_liaodong_weisuo_loc: "兼具边墙防务与貂皮战马互市职能的东北要冲，加固城防并扩大本地兵源与产出。"
 oe_nbe_dec_sound_toll_charter.title: "颁布《厄勒海峡通行税法典》"
 oe_nbe_dec_sound_toll_charter.desc: "在厄勒海峡与波罗的海门户立定统一商船丈量与通行税率，大增王室商税与商力，但会引发汉萨商团摩擦并增加巡海舰队开支。"
 oe_nbe_dec_sound_toll_charter.a: "立定厄勒海峡通行税法典"
 oe_nbe_dec_danube_black_guard.title: "组建多瑙河常备黑军防线"
 oe_nbe_dec_danube_black_guard.desc: "仿照马加什黑军之制筹建中央常备防线驻守布达、贝尔格莱德、维也纳与布拉格要冲，显著增强纪律与城防，但耗费巨额军饷并触怒守旧贵族。"
 oe_nbe_dec_danube_black_guard.a: "拨银募建多瑙河常备黑军"
 oe_nbe_dec_east_sea_tallies.title: "颁行东亚勘合互市勘验令"
 oe_nbe_dec_east_sea_tallies.desc: "以官印勘合符整合朝鲜、日本列岛与大陆海丝商埠，显著拓展商贸收益与商程，但海巡缉私成本高昂且沿海控制承压。"
 oe_nbe_dec_east_sea_tallies.a: "颁授东亚勘合互市官印"
 oe_nbe.1.t: "1397卡尔马联合：北欧三冠协约"
 oe_nbe.1.d: "卡尔马古堡的钟声响彻波罗的海西岸。面对吕贝克与汉萨商团的步步紧逼，丹麦、瑞典与挪威三国贵族与教士齐聚一堂，商议将三顶北欧王冠归于同一位共主之下。\n\n若强力推行王室集权，三冠便可合成震慑波罗的海的北方强权，却势必引来瑞典与挪威世家的猜忌；若赋予诸邦贵族议会高度自治，虽能换得一时太平，中央财权与号令却难免分散。"
 oe_nbe.1.a: "颁行《卡尔马三冠大宪章》，以王室共主统合丹瑞挪军政"
 oe_nbe.1.a.tt: "花费#R 140金币#!，稳定度#R −3#!，威望#G +12#!，与丹瑞挪互增好感#G +40#!，获得[ShowModifier('oe_nbe_kalmar_centralized')]，持续#Y 35年#!。"
 oe_nbe.1.b: "保障瑞典与挪威贵族议会自治，以松散联邦维系三冠和平"
 oe_nbe.1.b.tt: "花费#R 80金币#!，稳定度#G +5#!，与丹瑞挪互增好感#G +40#!，获得[ShowModifier('oe_nbe_kalmar_federal')]，持续#Y 35年#!。"
 oe_nbe.2.t: "厄勒海峡通行税与汉萨同盟博弈"
 oe_nbe.2.d: "宽不过数海里的厄勒海峡扼住了波罗的海与北海之间的全部咽喉。自赫尔辛格与哥本哈根眺望，满载波兰粮食、立陶宛木材与罗斯毛皮的汉萨巨船日夜穿梭。\n\n王室财政官建言设立严密的厄勒海峡通行税（Sound Toll），凡过峡商船必按载货纳银——此举足令国库丰盈，却必然激怒吕贝克与汉萨同盟；若向商团妥协减税，则可换取商贸稳健，却折损王室财权。"
 oe_nbe.2.a: "在赫尔辛格严征厄勒海峡通行税，夺取波罗的海门户财权！"
 oe_nbe.2.a.tt: "花费#R 120金币#!，威望#G +12#!，与吕贝克/汉萨好感#R −45#!，于海峡要塞建[ShowModifier('oe_nbe_sound_customs_loc')]，获得[ShowModifier('oe_nbe_sound_toll_enforced')]，持续#Y 35年#!。"
 oe_nbe.2.b: "与吕贝克汉萨商团签订减税特许，共分北欧鲱鱼与木材商路"
 oe_nbe.2.b.tt: "花费#R 80金币#!，稳定度#G +4#!，与吕贝克/汉萨互增好感#G +40#!，获得[ShowModifier('oe_nbe_hansa_compromise')]，持续#Y 35年#!。"
 oe_nbe.3.t: "瑞典独立与波罗的海霸权"
 oe_nbe.3.d: "十六世纪的烽烟冲散了旧日三冠枷锁，羽翼渐丰的瑞典与波罗的海北岸王国将目光投向了东岸沃土与海港。里加、塔林、维堡与涅瓦河口串联起波罗的海的全部命脉，却也是波兰—立陶宛与沙俄/诺夫哥罗德必争之地。\n\n是高举“波罗的海霸权”（Dominium Maris Baltici）大旗以陆海精兵夺取利沃尼亚与芬兰湾，还是联手波立共扼东疆，抑或固守斯德哥尔摩铜铁矿业、暂避多线消耗？"
 oe_nbe.3.a: "高举波罗的海霸权大旗，竞逐里加、塔林、维堡与涅瓦出海口！"
 oe_nbe.3.a.tt: "花费#R 220金币#!，人力#R −2#!，海陆传统各升（若波立卢布林或近世罗斯已立额外威望#G +8#!），与波立/罗斯好感#R −45#!，建[ShowModifier('oe_nbe_baltic_arsenal_loc')]，获[ShowModifier('oe_nbe_dominium_maris_baltici')]，持续#Y 35年#!。"
 oe_nbe.3.b: "联手波兰—立陶宛共防东方罗斯，划界分治利沃尼亚商港"
 oe_nbe.3.b.tt: "花费#R 140金币#!，与波立互增好感#G +45#!、与罗斯好感#R −45#!，获得[ShowModifier('oe_nbe_baltic_plc_entente')]，持续#Y 35年#!。"
 oe_nbe.3.c: "固守斯德哥尔摩铜铁矿务与波的尼亚本土，暂避多线苦战"
 oe_nbe.3.c.tt: "花费#R 100金币#!，稳定度#G +5#!，获得[ShowModifier('oe_nbe_swedish_copper_consolidation')]，持续#Y 35年#!。"
 oe_nbe.4.t: "多瑙河盾牌：马加什黑军整军"
 oe_nbe.4.d: "来自巴尔干南疆的兵锋日夜叩击贝尔格莱德与多瑙河防线。传统大贵族的封建旗团行动迟缓且各怀私心，难以抵御奥斯曼或巴尔干强权的常备劲旅。\n\n布达王廷遂拟效法马加什一世故事：开征全国炉灶特别税，组建全天候常备重骑与火枪劲旅——“匈牙利黑军”，并与克罗地亚、特兰西瓦尼亚两府防务连成一体；但此举必将触怒大贵族并加重底层农税负担。"
 oe_nbe.4.a: "开征炉灶特别税，整编常备“匈牙利黑军”死守多瑙河门户！"
 oe_nbe.4.a.tt: "花费#R 220金币#!，稳定度#R −3#!，贵族满意下跌（若匈牙利总督体制已运行额外陆军传统#G +10#!），于布达/贝尔格莱德建[ShowModifier('oe_nbe_danube_bastion_loc')]，获[ShowModifier('oe_nbe_black_army_hun')]，持续#Y 35年#!。"
 oe_nbe.4.b: "倚重克罗地亚与特兰西瓦尼亚大贵族领主旗团，暂缓开征重税"
 oe_nbe.4.b.tt: "花费#R 90金币#!，稳定度#G +4#!，贵族满意上升，获得[ShowModifier('oe_nbe_magnate_banderia')]，持续#Y 35年#!。"
 oe_nbe.5.t: "波希米亚胡斯遗产与中欧王冠博弈"
 oe_nbe.5.d: "伏尔塔瓦河畔的布拉格历经胡斯战争的血火洗礼，留下了令全欧骑士闻风丧胆的火铳战车阵（Wagenburg）与强韧的等级议会传统。如今波希米亚圣瓦茨拉夫王冠成为中欧角力的枢纽——奥地利哈布斯堡与匈牙利布达王廷皆对布拉格虎视眈眈。\n\n波希米亚当如何抉择：是承继胡斯战车军制与圣杯派独立自治，还是以《布拉格协约》弥合教派、融入中欧诸冠共治？"
 oe_nbe.5.a: "承继胡斯火铳战车阵与布拉格圣杯自治，独立捍卫圣瓦茨拉夫王冠"
 oe_nbe.5.a.tt: "花费#R 150金币#!，陆军传统#G +12#!（若胡斯战争仍活跃或奉胡斯派额外稳定度#G +5#!），获得[ShowModifier('oe_nbe_hussite_wagenburg')]，持续#Y 35年#!。"
 oe_nbe.5.b: "以《布拉格协约》调和天主教与温和圣杯派，推动中欧诸冠联姻共治"
 oe_nbe.5.b.tt: "花费#R 120金币#!，稳定度#G +5#!，与奥地利/匈牙利互增好感#G +40#!，获得[ShowModifier('oe_nbe_compactata_compromise')]，持续#Y 35年#!。"
 oe_nbe.6.t: "多瑙河门户拉锯"
 oe_nbe.6.d: "自布拉格、维也纳顺流而下至布达与贝尔格莱德，多瑙河走廊正是中欧与巴尔干世界的生死分界。每当东南方的强权——无论是星月奥斯曼，抑或屹立不倒的紫色新罗马帝国——兵临萨瓦河畔，整座中欧大陆便随之震动。\n\n面对多瑙河四座门户重镇的拉锯，中欧强权须立下百年大计：筑起铁血军区正面迎敌，与存续新罗马划界协防，还是依托维也纳—布拉格内陆关税同盟静观其变？"
 oe_nbe.6.a: "构筑维也纳—布达—贝尔格莱德多瑙河军区，以重堡劲旅迎击东南！"
 oe_nbe.6.a.tt: "花费#R 240金币#!，人力#R −2#!，陆军传统#G +10#!，与奥斯曼及巴尔干对手好感#R −50#!，建[ShowModifier('oe_nbe_danube_bastion_loc')]，获[ShowModifier('oe_nbe_danube_military_frontier')]，持续#Y 35年#!。"
 oe_nbe.6.b: "与存续新罗马缔结《多瑙河—萨瓦河基督教划界防务协定》"
 oe_nbe.6.b.tt: "花费#R 150金币#!，威望#R −6#!，与新罗马互增好感#G +50#!并双方共获[ShowModifier('oe_nbe_danube_rome_accord')]，持续#Y 35年#!。"
 oe_nbe.6.c: "深耕维也纳—布拉格内陆关税同盟，暂缓巴尔干前沿消耗战"
 oe_nbe.6.c.tt: "花费#R 110金币#!，稳定度#G +5#!，获得[ShowModifier('oe_nbe_danube_customs_union')]，持续#Y 35年#!。"
 oe_nbe.7.t: "朝鲜半岛抉择"
 oe_nbe.7.d: "开京、汉阳与东莱浦口俯瞰着黄海与对马海峡。大陆格局的剧变正牵动半岛国运：若中兴的大元帝国依然雄踞大都并广开泉州市舶，半岛便可借辽东官道与海丝巨舶直通欧亚；若明朝代兴，则须重塑事大交邻秩序。\n\n面对大陆宗主与东亚海丝的新变局，朝鲜朝廷须定下国策：稳行传统事大互市、乘大元中兴深度并入海陆商网，还是革新车船水师以自立海防？"
 oe_nbe.7.a: "坚守“事大交邻”稳健国策，开放东莱与京畿正统朝贡互市"
 oe_nbe.7.a.tt: "花费#R 120金币#!，稳定度#G +5#!，与大陆王朝互增好感#G +45#!，建[ShowModifier('oe_nbe_kango_mart_loc')]，获[ShowModifier('oe_nbe_korea_sadae_trade')]，持续#Y 35年#!。"
 oe_nbe.7.b: "乘大元中兴缔结《辽东—开京海陆互市专约》，直通泉州与大都！"
 oe_nbe.7.b.tt: "花费#R 150金币#!（若泉州海丝畅通额外威望#G +10#!），与大元互增好感#G +45#!并助大元获[ShowModifier('oe_nbe_yuan_korea_bond')]，建[ShowModifier('oe_nbe_kango_mart_loc')]，获[ShowModifier('oe_nbe_korea_yuan_maritime')]，持续#Y 35年#!。"
 oe_nbe.7.c: "推行强兵海防与龟船水师革新，自主扼守黄海与对马海峡"
 oe_nbe.7.c.tt: "花费#R 180金币#!，人力#R −2#!，海军传统#G +12#!，获得[ShowModifier('oe_nbe_korea_turtle_navy')]，持续#Y 35年#!。"
 oe_nbe.8.t: "日本勘合贸易与倭寇清剿"
 oe_nbe.8.d: "京都朝廷、幕府与博多等九州海港诸藩之间，一场关乎东亚海权与财源的博弈正在上演。横行黄海与东海的倭寇船队屡屡侵扰大陆与朝鲜沿岸，令正规勘合商舶受阻；而大内、细川、岛津等西国强藩则竞相争夺勘合贸易专利。\n\n幕府与诸藩必须抉择：以官印勘合符统揽对华通商并严剿倭寇，还是默许西国武装船队纵横东海、以海上私市充实藩库？"
 oe_nbe.8.a: "颁行官印勘合符，严剿九州与濑户内海倭寇以换取正统朝贡厚利！"
 oe_nbe.8.a.tt: "花费#R 160金币#!，人力#R −1.5#!，海军传统#G +10#!（若大元海防倭寇正盛额外威望#G +8#!），与大陆王朝互增好感#G +45#!，建[ShowModifier('oe_nbe_kango_mart_loc')]，获[ShowModifier('oe_nbe_japan_kango_tally')]，持续#Y 35年#!。"
 oe_nbe.8.b: "默许西国大名与武装海商越海私市，以海上厚利养兵强藩"
 oe_nbe.8.b.tt: "花费#R 90金币#!，陆军传统#G +12#!，与大陆王朝及朝鲜好感#R −50#!，获得[ShowModifier('oe_nbe_japan_wokou_privateers')]，持续#Y 35年#!。"
 oe_nbe.9.t: "石见白银潮与泉州·宁波海丝商路"
 oe_nbe.9.d: "灰吹精炼术的普及让日本列岛的白银产量骤增，一箱箱雪白银锭经博多与九州港口扬帆西渡，直指大陆东南最繁华的两座海丝门户——宁波（鄞县）与泉州（晋江）！\n\n若大陆市舶司大开，东瀛白银便能换回源源不断的江南生丝、景德瓷器与南洋香料，将整个东亚海丝推向巅峰；但汹涌银潮亦将冲击国内物价与沿海控制，或须以朱印船限港令加以节制。"
 oe_nbe.9.a: "直航宁波（鄞县）与泉州（晋江）海丝商路，以白银大兴跨海贸易！"
 oe_nbe.9.a.tt: "花费#R 180金币#!，威望#G +12#!（若大元市舶司/泉州开海额外稳定度#G +6#!），与大陆互增好感#G +45#!并助其获[ShowModifier('oe_nbe_silver_maritime_boom')]，建[ShowModifier('oe_nbe_kango_mart_loc')]，获[ShowModifier('oe_nbe_japan_silver_silk_road')]，持续#Y 35年#!。"
 oe_nbe.9.b: "颁行朱印船特许与限港管控，防止白银过量外流扰动国内物价"
 oe_nbe.9.b.tt: "花费#R 110金币#!，稳定度#G +5#!，获得[ShowModifier('oe_nbe_shuinsen_controlled')]，持续#Y 35年#!。"
 oe_nbe.10.t: "辽东女真羁縻卫所与满洲兴起"
 oe_nbe.10.d: "白山黑水之间，建州、海西与野人女真诸部散居于赫图阿拉、抚顺、开原与吉林乌拉一带，沈阳与辽阳则是扼守山海关外的钢铁锁钥。若中兴的大元朝廷仍掌控辽东，能否以羁縻卫所与马市赏赐牢牢锁住东北诸部，决定着帝国北翼百年安危；\n\n而一旦女真诸部或新兴满洲得以整合八旗劲骑，辽东边患便将化作席卷东亚的雷霆风暴！"
 oe_nbe.10.a: "整饬辽东—奴儿干羁縻卫所与抚顺马市，以恩威并施锁控白山黑水！"
 oe_nbe.10.a.tt: "花费#R 200金币#!，人力#R −2#!，陆军传统#G +10#!（若中兴大元主持额外威望#G +8#!），于辽东/关外建[ShowModifier('oe_nbe_liaodong_weisuo_loc')]，获[ShowModifier('oe_nbe_liaodong_weisuo_order')]，持续#Y 35年#!。"
 oe_nbe.10.b: "整合建州与海西女真诸部编立八旗劲旅，剑指辽东雄霸东北！"
 oe_nbe.10.b.tt: "花费#R 160金币#!，稳定度#R −3#!，陆军传统#G +15#!，与中原王朝及朝鲜好感#R −50#!，建[ShowModifier('oe_nbe_liaodong_weisuo_loc')]，获[ShowModifier('oe_nbe_manchu_banner_rise')]，持续#Y 35年#!。"
 oe_nbe.10.c: "放宽开原与辽阳貂皮人参互市，以商贸羁縻暂缓东北兵戈"
 oe_nbe.10.c.tt: "花费#R 110金币#!，稳定度#G +5#!，获得[ShowModifier('oe_nbe_liaodong_fur_frontier')]，持续#Y 35年#!。"
