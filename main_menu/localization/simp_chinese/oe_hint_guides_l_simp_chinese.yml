# NEW 2026-11-21 v9.6 Module 1: Scriptable Hints (oe_hint_). Generated by gen_v96_cat_hints.py.
 oe_hint_byz_phoenix_start:0 "凤凰计划：拜占庭 1337 破局指引"
 oe_hint_byz_phoenix_start_hint_text:0 "#T 帝国开局重心#!\n@hint! 1337 年的东罗马身处内忧外患之交。开局务必留意两皇内战预警，提前储备稳定度与国库余粮。\n\n#T 经济与关税收回#!\n@hint! 尽快处理意大利商邦在加拉塔的关税特权，逐步收回金角湾商税，并通过帝国银行与金币改制止住赤字。\n\n#T 巴尔干与色雷斯防线#!\n@hint! 巩固阿德里安堡—色雷斯一线堡垒，把握安纳托利亚诸贝伊国彼此牵制的窗口，先稳后进。"
 oe_hint_byz_phoenix_start_adm:0 "“收回加拉塔关税并清查国内阶层腐败特权，能比盲目借债更快稳住君士坦丁堡的财政根基。”"
 oe_hint_byz_phoenix_start_dip:0 "“利用巴尔干邻邦与意大利共和国的利益分歧签下缓兵协议，避免东西两线同时开战。”"
 oe_hint_byz_phoenix_start_mil:0 "“在阿德里安堡与海峡要隘筑牢要塞，以精锐主力配合本土民兵逐个击破渡海之敌。”"
 oe_hint_byz_themes_and_pillars:0 "帝国柱石、军区兵额与近卫大区政务院"
 oe_hint_byz_themes_and_pillars_hint_text:0 "#T 军区体制与兵额调度#!\n@hint! 灾变之后可通过帝国柱石与军区附庸体系将外围行省交由军区总督镇守，同时通过兵额令征调精锐戍边。\n\n#T 近卫大区政务院与总督区#!\n@hint! 当疆域跨越地中海诸大区时，善用近卫大区政务院与海外总督区分担行政与控制度压力，避免直辖过载推高帝国熵增。"
 oe_hint_byz_themes_and_pillars_adm:0 "“把低控制度的边疆划归近卫大区或军区治理，集中直辖核心富庶行省，总税入反而更高。”"
 oe_hint_byz_themes_and_pillars_dip:0 "“定期审计总督区与军区忠诚度，必要时赐予荣誉官衔或减免贡赋，杜绝藩镇坐大。”"
 oe_hint_byz_themes_and_pillars_mil:0 "“战前提前核查各军区兵额状态，让边防军区承担持久消耗，主力近卫团直取敌方要害。”"
 oe_hint_byz_orthodoxy_synod:0 "东正教静修路线、自主教会律法与圣像敕绘"
 oe_hint_byz_orthodoxy_synod_hint_text:0 "#T 自主教会神学律法#!\n@hint! 打开自主教会国际组织界面，可在静修主义正统、普世合一调和、阿索斯圣山隐修与帝国学院人文神学四条路线中择一投票施行。\n\n#T 原生宗教动作与圣像库#!\n@hint! 宗教面板提供召开普世大公会议、护持阿索斯圣山修院及零限制敕绘帝国圣像等动作，可持续充实首都圣像珍藏并强化全教凝聚力。"
 oe_hint_byz_orthodoxy_synod_adm:0 "“阿索斯隐修与帝国人文神学分别强化稳定效率与全民识字，可随时代阶段灵活切换。”"
 oe_hint_byz_orthodoxy_synod_dip:0 "“若面临西方天主教列强合围，启用普世合一调和派可显著改善外交声誉与异端容忍。”"
 oe_hint_byz_orthodoxy_synod_mil:0 "“大公会议赈济与阿索斯修院护持都能压低厌战度并加快宗教整合，是长期征战的后盾。”"
 oe_hint_yuan_restoration_start:0 "大元中兴：1337 破局与至正改革指引"
 oe_hint_yuan_restoration_start_hint_text:0 "#T 稳定宝钞与南北漕粮#!\n@hint! 大元开局面临宝钞通胀、黄河水患与江南海运漕粮波动三重考验。优先推进宝钞新政与海运整顿，确保大都粮饷不断。\n\n#T 东宫权衡与平乱准备#!\n@hint! 妥善平衡朝堂中枢与东宫势力，提前整备军纪并留意中原反元暗流，在红巾大潮爆发前筑牢防线。"
 oe_hint_yuan_restoration_start_adm:0 "“先抑通胀、稳漕粮，再推进赋税整顿，才能为大元中兴留出充裕的改革缓冲。”"
 oe_hint_yuan_restoration_start_dip:0 "“拉拢高丽、云南及西南土司盟藩，确保南北边陲安靖，专心应对中原局势。”"
 oe_hint_yuan_restoration_start_mil:0 "“常备精锐怯薛骑兵扼守江淮与河南咽喉，乱象初起时速战速决，切忌放任星火燎原。”"
 oe_hint_yuan_secretariats_touxia:0 "大元行省直辖、投下分封与海丝宣政"
 oe_hint_yuan_secretariats_touxia_hint_text:0 "#T 行省与投下权衡#!\n@hint! 行中书省强化中央集权与直辖税赋，投下诸王分封则可缓解幅员过广的治理损耗。因地制宜把握收放节奏。\n\n#T 泉州海丝与宣政院#!\n@hint! 管控泉州（刺桐港）亦思巴奚动向以护持海上丝路走廊，同时借宣政院礼敬藏传帝师，维系高原与草原诸部向心。"
 oe_hint_yuan_secretariats_touxia_adm:0 "“江南与中原核心行省宜逐步强化直辖，漠北与高原远藩则适合以分封与羁縻控成本。”"
 oe_hint_yuan_secretariats_touxia_dip:0 "“维护泉州、马六甲与锡兰一线海商友好，可源源不断为朝廷带来香料与关税红利。”"
 oe_hint_yuan_secretariats_touxia_mil:0 "“将传统蒙古轻重骑兵与江南火器工坊结合，方能在后世与帖木儿及泰西列强抗衡。”"
 oe_hint_yuan_sanjiao_preceptor:0 "三教合流、宗派律法、帝师灌顶与回回经师"
 oe_hint_yuan_sanjiao_preceptor_hint_text:0 "#T 国家宗教国策与宗派律法#!\n@hint! 在国家法律面板中可于三教鼎立、宣政院帝师、回回司天监与崇儒整顿度牒四轨国策间自由切换，塑造帝国文教与宽容走向。\n\n#T 殿前论道、帝师灌顶与礼聘回回经师#!\n@hint! 宗教面板新增三教殿前论道（同步切换宗派义理律法）、敕封帝师灌顶与礼聘回回经师三大原生动作，全面联动正气、和谐、业力与科研识字。"
 oe_hint_yuan_sanjiao_preceptor_adm:0 "“切换至回回司天监国策并礼聘经师，可叠加可观的科研速度与全民识字加成。”"
 oe_hint_yuan_sanjiao_preceptor_dip:0 "“敕封藏传帝师不仅提升外交声誉与异教容忍，还能显著安抚藏蒙附庸。”"
 oe_hint_yuan_sanjiao_preceptor_mil:0 "“在战事吃紧时借三教论道启用禅净双修或噶举护法路线，可有效压低厌战并提振士气。”"
 oe_hint_rus_tatar_yoke_start:0 "罗斯崛起：摆脱鞑靼枷锁与第三罗马之路"
 oe_hint_rus_tatar_yoke_start_hint_text:0 "#T 集聚罗斯诸公之力#!\n@hint! 开局须先在伏尔加—奥卡河流域整合邻近公国，利用金帐汗国内部分裂时机，为挣脱鞑靼枷锁蓄积财力与兵员。\n\n#T 波雅尔杜马与全俄法统#!\n@hint! 步入中兴后，平衡波雅尔贵族与皇权集权，并通过双头鹰使节与第三罗马决议接续正教帝国法统。"
 oe_hint_rus_tatar_yoke_start_adm:0 "“尽早收服诺夫哥罗德皮毛商路与奥卡河产粮带，为抗御草原骑兵打下稳定财政基础。”"
 oe_hint_rus_tatar_yoke_start_dip:0 "“密切关注金帐汗国五翼离合与立陶宛动向，拉拢正教邻邦，避免腹背受敌。”"
 oe_hint_rus_tatar_yoke_start_mil:0 "“依托森林河网与南疆鹿砦防线消耗草原骑兵，待其内乱时顺伏尔加河挥师南下。”"
 oe_hint_rus_church_and_siberia:0 "罗斯教会田产博弈、哥萨克与西伯利亚东进"
 oe_hint_rus_church_and_siberia_hint_text:0 "#T 约瑟夫派 vs 非拥产派与旧礼仪抉择#!\n@hint! 罗斯自主教会专属律法还原拥产派、非拥产派、尼康革新与旧礼仪宽容四大历史抉择；若教派紧张，可在宗教面板调停罗斯教争。\n\n#T 哥萨克军团与西伯利亚驿道#!\n@hint! 册封哥萨克军团与斯特罗加诺夫商帮特许，跨过乌拉尔山铺设西伯利亚驿道，直抵太平洋与恰克图茶路。"
 oe_hint_rus_church_and_siberia_adm:0 "“非拥产派压制教士权势并提振识字，约瑟夫派则助推集权与皇权正统，按内政重心抉择。”"
 oe_hint_rus_church_and_siberia_dip:0 "“1580 年后若走尼康革新路线可大涨正教外交声誉；选旧礼仪宽容协定则利于边疆拓荒。”"
 oe_hint_rus_church_and_siberia_mil:0 "“将哥萨克军团、射击军与新式团衔接升级，兼顾草原机动与欧陆线列火力。”"
 oe_hint_glh_ulus_survival:0 "术赤兀鲁思凝聚度、草原大动荡与钦察商道"
 oe_hint_glh_ulus_survival_hint_text:0 "#T 稳住汗廷凝聚度与五翼诸王#!\n@hint! 草原汗国的核心命脉是汗廷凝聚度与大札撒权威。借忽里台赏赐、整肃贝格与重修札撒决议遏制五翼离心，渡过金帐大动荡。\n\n#T 腾格里新面向与萨莱商道#!\n@hint! 腾格里信徒现可在宗教面板启用永恒札撒、萨满融通、斡耳朵马政与丝路盟约四大新面向；控制萨莱—阿斯特拉罕—克里米亚商道可源源创收。"
 oe_hint_glh_ulus_survival_adm:0 "“把握汗廷凝聚度节奏，在财政充裕时整顿大札撒，避免五翼在继承期连锁崩盘。”"
 oe_hint_glh_ulus_survival_dip:0 "“分化罗斯诸公与波立边藩，同时维持通往黑海与河中的商队和平。”"
 oe_hint_glh_ulus_survival_mil:0 "“善用骑兵机动与无路行军优势，在开阔草原决战歼敌，勿在坚城下耗尽精锐。”"
 oe_hint_oe_entropy_warning:0 "告警：帝国熵增指数攀升与减负指南"
 oe_hint_oe_entropy_warning_hint_text:0 "#T 五维帝国熵增解析#!\n@hint! 您的帝国熵增指数已突破警戒线。该指标综合衡量疆域超载、通胀赤字、军区离心、多元文化摩擦与持久战争疲惫五大维度。\n\n#T 立即可行的熵减手段#!\n@hint! 前往政务、经济与宗教决议栏执行巡察审计、币制稳银、宽容宪章与和平大赦，并将低控制度外藩划归近卫大区、总督区或行省藩属分权减负。"
 oe_hint_oe_entropy_warning_adm:0 "“连续压低疆域超载与通胀，即可逐步将帝国熵增拉回安全区并迈向盛世永安。”"
 oe_hint_oe_entropy_warning_dip:0 "“适时休战并签发宽容宪章，能迅速平复外族与附庸的离心倾向。”"
 oe_hint_oe_entropy_warning_mil:0 "“连年征战会持续推高战争疲惫维度；在两场大战之间留出休整期并执行和平大赦。”"
 oe_hint_oe_quick_hud_and_decisions:0 "凤凰计划界面导航：7 色决议栏、政务托管与名城志"
 oe_hint_oe_quick_hud_and_decisions_hint_text:0 "#T 7 大彩色决议筛选栏#!\n@hint! 全部百余条模组决议现已精准归入原版七大彩色分类：本国专属、地理扩张、政务法度、宗教信仰、经济商贸与基建奇观，一键筛选不再拥挤。\n\n#T 快捷导航栏、政务托管与名城志#!\n@hint! 顶栏快捷按钮可直达帝国编年史、政务自动化总控台与年度透明账单；鼠标悬停在欧亚非百余座历史名城上还可直接阅览双语名城史志。"
 oe_hint_oe_quick_hud_and_decisions_adm:0 "“在政务法度决议栏中可随时开启帝国政务自动化总控台，设定国库安全线后自动巡检粮仓与道路。”"
 oe_hint_oe_quick_hud_and_decisions_dip:0 "“通过顶栏编年史与各国决议，可一目了然追踪欧亚各大文明的历史剧变与外交动向。”"
 oe_hint_oe_quick_hud_and_decisions_mil:0 "“扩张与基建奇观分类现已独立呈现，光复宣称、设藩建边与要塞防线工程一眼可见。”"
 oe_hint_oe_imperial_roads_stances:0 "帝国御道修筑与附庸特化军姿指引"
 oe_hint_oe_imperial_roads_stances_hint_text:0 "#T 三文明专属帝国御道#!\n@hint! 解锁对应时代科技后，可在道路建造器中修筑罗马帝国石砌官道、大元急递站赤或罗斯西伯利亚驿道，显著提升控制度传导、市集通达与调兵速度。\n\n#T 附庸特化军姿调度#!\n@hint! 在附庸管理面板可为不同藩属指定专职军姿：前沿焦土袭扰、远洋舰队护航或丝路关隘驻防，让庞大附庸体系各司其职。"
 oe_hint_oe_imperial_roads_stances_adm:0 "“优先将帝国御道从首都延伸至高产贸易港与边防枢纽，可大幅放大近卫大区与行省控制度。”"
 oe_hint_oe_imperial_roads_stances_dip:0 "“对海岛与商站附庸指派护航军姿，对陆上边疆附庸指派关隘驻防，减少友军无谓折损。”"
 oe_hint_oe_imperial_roads_stances_mil:0 "“焦土袭扰军姿可令轻骑附庸避开敌方主力、专攻后方补给与围城，配合主力形成合围。”"
