# NEW 2026-11-22 v15.5 Stars of East Asia — SE Asia & Tibet (oe_sea2_). Generated by gen_v155_east_se_asia.py; edit the generator, not this file.
 oe_sea2_war_elephants:0 "南洋皇家战象队"
 oe_sea2_war_elephants_desc:0 "披挂铁甲与战楼的东南亚王室重装战象，在热带丛林与河谷战场无视泥泞险阻、以雷霆冲撞瓦解敌军士气。"
 oe_sea2_jong_ship:0 "爪哇戎克巨舰"
 oe_sea2_jong_ship_desc:0 "以多层柚木无铁钉卯接而成的努山塔拉远洋巨舰，船体厚重可抗轻炮、搭载青铜佛朗机回旋炮并兼具宽阔兵员运载力。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_red_river_dykes_mod:0 "陈朝红河大堤水利网"
 STATIC_MODIFIER_DESC_oe_sea2_dai_red_river_dykes_mod:0 "朝廷专设河堤使统修红河干支堤坝，化水患为膏腴双季稻仓。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_village_granaries_mod:0 "社仓义谷与乡里备荒"
 STATIC_MODIFIER_DESC_oe_sea2_dai_village_granaries_mod:0 "于红河诸社广建常平义仓，稳固农家生计并减轻官府徭役开销。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_lam_son_mod:0 "蓝山起义与《平吴大诰》军魂"
 STATIC_MODIFIER_DESC_oe_sea2_dai_lam_son_mod:0 "黎利十年苦战光复升龙，《平吴大诰》昭告大越独立国格，全军士气如虹。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_thanh_hoa_rally_mod:0 "清化根基与战后抚民"
 STATIC_MODIFIER_DESC_oe_sea2_dai_thanh_hoa_rally_mod:0 "以清化、乂安老区为依托减免田赋、招抚流亡，迅速恢复大越人口与税源。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_hong_duc_mod:0 "黎圣宗《洪德律》法典盛世"
 STATIC_MODIFIER_DESC_oe_sea2_dai_hong_duc_mod:0 "《洪德律》融合典章礼法与越南本土民权条款，开创大越官僚清廉与文化鼎盛之治。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_literati_exams_mod:0 "升龙文庙科举与雅乐教化"
 STATIC_MODIFIER_DESC_oe_sea2_dai_literati_exams_mod:0 "扩建国子监、勒进士题名碑并兴办雅乐礼制，涵养绵延数世的文臣英才。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_nam_tien_mod:0 "南进屯田与中越海岸经略"
 STATIC_MODIFIER_DESC_oe_sea2_dai_nam_tien_mod:0 "沿顺化、平定一路推行军屯垦殖，将大越版图与稻作文明稳步推向南方。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_cham_integration_mod:0 "占越海港通商与怀柔整合"
 STATIC_MODIFIER_DESC_oe_sea2_dai_cham_integration_mod:0 "吸纳占婆熟练造船匠与香料港市，以怀柔共治把中越海岸化作南海商贸枢纽。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_giao_chi_guns_mod:0 "交趾火铳与大越水陆炮阵"
 STATIC_MODIFIER_DESC_oe_sea2_dai_giao_chi_guns_mod:0 "精工打造的交趾鸟铳射速精准冠绝南洋，配合内河战船令大越攻守兼备。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_trinh_nguyen_trade_mod:0 "会安国际商港与南北商潮"
 STATIC_MODIFIER_DESC_oe_sea2_dai_trinh_nguyen_trade_mod:0 "广南会安与北圻铺宪广迎中日欧商船，以生丝、沉香与陶瓷汇聚丰沛白银。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_wall_of_dong_hoi_mod:0 "广平长垒与军镇戒备"
 STATIC_MODIFIER_DESC_oe_sea2_dai_wall_of_dong_hoi_mod:0 "修筑横贯山海的广平长垒并操练常备水师，严阵以待任何内外强敌。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_tay_son_reform_mod:0 "西山新政：喃字国学与铁军"
 STATIC_MODIFIER_DESC_oe_sea2_dai_tay_son_reform_mod:0 "革新军制、以喃字入官书并整顿海防舰队，在大动荡中淬炼出统一强国。"
 STATIC_MODIFIER_NAME_oe_sea2_dai_unified_viet_mod:0 "红河至湄公：大越南北大一统"
 STATIC_MODIFIER_DESC_oe_sea2_dai_unified_viet_mod:0 "终结百年分治、贯通千里海岸驿道与南北粮仓，缔造空前强盛的统一越南帝国。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_chao_phraya_mod:0 "湄南河岛城：大城商航枢纽"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_chao_phraya_mod:0 "三河交汇的阿瑜陀耶岛城坐拥天然水堑与深水泊位，迅速崛起为中南半岛明珠。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_sukhothai_heritage_mod:0 "素可泰碑铭与瓷窑文脉"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_sukhothai_heritage_mod:0 "承袭素可泰佛塔建筑、兰甘亨文字与宋加洛青瓷窑火，广输南洋诸港。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_sakdina_mod:0 "《萨迪纳》文武分职法典"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_sakdina_mod:0 "波隆摩·戴莱洛迦纳清晰划分内政部与军政部，以田禄品级井然统御全国户口与徭役。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_elephant_corps_mod:0 "白象护国皇家战象营"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_elephant_corps_mod:0 "驯养披甲战象并配属火铳象背卫队，在丛林与平原决战中震慑八方劲敌。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_naresuan_glory_mod:0 "纳黎萱王象背决战威名"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_naresuan_glory_mod:0 "亲临阵前斩将夺旗的英主威望凝聚暹罗上下，恢复对十纳沙林与南部海道的主权。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_cosmopolitan_mod:0 "大城万国商馆与东西外交"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_cosmopolitan_mod:0 "波斯、日本、荷兰与法兰西商馆林立湄南河畔，令暹罗王室在列强博弈间左右逢源。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_royal_monopoly_mod:0 "王室仓务官船海贸专营"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_royal_monopoly_mod:0 "由王室库务司直接运营远航大船直通长崎与广州，将丰厚海贸盈余尽收内帑。"
 STATIC_MODIFIER_NAME_oe_sea2_ayu_rattanakosin_mod:0 "吞武里—曼谷河口中兴王朝"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_rattanakosin_mod:0 "于湄南河下游重构坚固都城、修纂三印法典并重振佛寺与海贸，开启暹罗近代复兴。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_palapa_oath_mod:0 "加查·玛达《帕拉帕誓言》雄心"
 STATIC_MODIFIER_DESC_oe_sea2_maj_palapa_oath_mod:0 "首相断绝香料以明志，率满者伯夷水陆雄师经略努山塔拉千岛，铸就霸业核心。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_mandala_web_mod:0 "《爪哇史颂》努山塔拉朝贡网"
 STATIC_MODIFIER_DESC_oe_sea2_maj_mandala_web_mod:0 "以特罗乌兰为神圣中心，九十八处海岛藩属纳贡通商、共奉爪哇王室威仪。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_jong_cetbang_mod:0 "爪哇戎克巨舰与青铜佛朗机"
 STATIC_MODIFIER_DESC_oe_sea2_maj_jong_cetbang_mod:0 "多层柚木船壳与舷侧青铜回旋炮铸就南洋海上移动堡垒，护航千岛万里波涛。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_spice_golden_mod:0 "香料群岛黄金时代：丁香与肉豆蔻"
 STATIC_MODIFIER_DESC_oe_sea2_maj_spice_golden_mod:0 "掌控特尔纳特、蒂多雷与班达香料出产并由爪哇港转运欧亚，府库黄金堆积如山。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_wali_songo_mod:0 "九圣和融：爪哇伊斯兰海商新风"
 STATIC_MODIFIER_DESC_oe_sea2_maj_wali_songo_mod:0 "以皮影戏与海港清真寺柔和融合爪哇古俗与伊斯兰商法，无缝接轨印度洋穆斯林贸易网。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_hindu_mandala_mod:0 "东爪哇—巴厘印度佛教圣域坚守"
 STATIC_MODIFIER_DESC_oe_sea2_maj_hindu_mandala_mod:0 "守护古老禅邸神庙与爪哇典籍传统，凝聚东爪哇与巴厘诸邦抵御内忧外患。"
 STATIC_MODIFIER_NAME_oe_sea2_maj_nusantara_shield_mod:0 "努山塔拉自由航运抗霸联盟"
 STATIC_MODIFIER_DESC_oe_sea2_maj_nusantara_shield_mod:0 "联合爪哇、苏门答腊与马鲁古船队打破欧洲贸易公司的香料封锁，守护群岛海上主权。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_straits_hub_mod:0 "拜里米苏拉马六甲季风总汇"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_straits_hub_mod:0 "东西季风于马六甲与巴赛交汇，百国商船在此换载香料、棉布与瓷器，富甲南洋。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_zheng_he_mod:0 "郑和官厂与天朝册封同盟"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_zheng_he_mod:0 "明朝宝船驻泊官厂并颁赐镇国山碑，赋予海峡商港无上外交护盾与巨额瓷丝贸易。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_maritime_law_mod:0 "《马六甲海法》与四方港务官"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_maritime_law_mod:0 "四位港务官分别执掌古吉拉特、华商、爪哇与马来商区，以公正海商法赢得万国信赖。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_malay_letters_mod:0 "爪夷文典籍与马来黄金文脉"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_malay_letters_mod:0 "马来语成为群岛通用外交与商业语言，法学与史诗典籍沿商船播撒千岛。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_anti_portuguese_mod:0 "马六甲海峡火炮水师防线"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_anti_portuguese_mod:0 "于海峡两岸广布青铜火炮与快船水军，硬撼葡萄牙卡拉克战舰的殖民觊觎。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_straits_coalition_mod:0 "柔佛—巴赛—亚齐自由海峡同盟"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_straits_coalition_mod:0 "化整为零分散海峡商港与胡椒航道，令西方殖民堡垒陷于孤立无援。"
 STATIC_MODIFIER_NAME_oe_sea2_mlc_anti_dutch_mod:0 "打破东印度公司垄断：海峡自由贸易"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_anti_dutch_mod:0 "以多边通商与精锐快船护航反制公司封锁，牢牢把握马六甲与苏门答腊关税命脉。"
 STATIC_MODIFIER_NAME_oe_sea2_tib_phagmodrupa_mod:0 "帕木竹巴宗堡新政与十三万户法"
 STATIC_MODIFIER_DESC_oe_sea2_tib_phagmodrupa_mod:0 "大司徒绛曲坚赞废旧制、设宗堡官署并复兴吐蕃古法，重塑雪域自主强权。"
 STATIC_MODIFIER_NAME_oe_sea2_tib_gelugpa_mod:0 "宗喀巴大师格鲁派教化复兴"
 STATIC_MODIFIER_DESC_oe_sea2_tib_gelugpa_mod:0 "拉萨祈愿大法会与甘丹、哲蚌、色拉三大寺兴起，将雪域哲学辩经、医算与戒律推向高峰。"
 STATIC_MODIFIER_NAME_oe_sea2_tib_patron_priest_mod:0 "跨喜马拉雅与漠北檀越外交"
 STATIC_MODIFIER_DESC_oe_sea2_tib_patron_priest_mod:0 "以高僧法统结盟蒙古诸汗与喜马拉雅诸邦，为雪域高原赢得广阔外交纵深与商队安全。"
 STATIC_MODIFIER_NAME_oe_sea2_tib_potala_mod:0 "甘丹颇章与布达拉宫圣殿巍峨"
 STATIC_MODIFIER_DESC_oe_sea2_tib_potala_mod:0 "红白宫殿耸立玛布日山巅，卫藏政教合一中枢稳固并享誉四方。"
 STATIC_MODIFIER_NAME_oe_sea2_tib_tea_horse_mod:0 "雪域茶马古道与盐粮互市"
 STATIC_MODIFIER_DESC_oe_sea2_tib_tea_horse_mod:0 "连通川滇茶道、古格盐路与尼泊尔商旅，以高地牦牛商队繁荣高原财税。"
 oe_sea2.1.title:0 "陈朝红河大堤与三角洲水利"
 oe_sea2.1.desc:0 "红河汛期水势汹涌，升龙朝廷派遣河堤使督率沿江州县加筑鼎耳堤，将桀骜江涛化为滋养双季稻作的万顷良田。"
 oe_sea2.1.a:0 "由朝廷统一修筑红河干支大堤"
 oe_sea2.1.b:0 "广建乡社义仓备荒稳民"
 oe_sea2.2.title:0 "蓝山起义与黎利光复大越"
 oe_sea2.2.desc:0 "清化蓝山旌旗猎猎！黎利与谋臣阮廌以山地游击、围点打援坚持十载，终克升龙并昭告《平吴大诰》：“惟我大越之国，实为文献之邦，山川之封域既殊，南北之风俗亦异！”"
 oe_sea2.2.a:0 "弘扬《平吴大诰》军魂整编蓝山精锐"
 oe_sea2.2.b:0 "依托清化根基减赋休养生息"
 oe_sea2.3.title:0 "黎圣宗与《洪德律》盛世法典"
 oe_sea2.3.desc:0 "明君黎圣宗亲自主持编纂《国朝刑律》（洪德律），既完备六部官制与均田法，又独创保护女子继承权与乡土习俗的条款，并大兴升龙文庙科举。"
 oe_sea2.3.a:0 "颁行《洪德律》与六部考课新制"
 oe_sea2.3.b:0 "大兴升龙文庙科举与雅乐礼制"
 oe_sea2.4.title:0 "南进运动：屯田垦殖与经略中越"
 oe_sea2.4.desc:0 "红河三角洲人烟稠密，大越水陆大军与垦荒流民沿长山山脉东麓南下顺化、广南与毗阇耶，通过军民屯田（Don Dien）把越人村社与稻田不断推向南方海湾。"
 oe_sea2.4.a:0 "大规模推行南进军民屯田开拓新省"
 oe_sea2.4.b:0 "吸纳占婆造船匠与海港商帮共兴海贸"
 oe_sea2.5.title:0 "交趾火铳与大越内河炮舰"
 oe_sea2.5.desc:0 "大越匠人精铸的“交趾铳”枪管修长、击发迅捷，名动整个东亚与南洋；配合多桨内河战船与战象协同，大越军械之利令四邻侧目。"
 oe_sea2.5.a:0 "扩建升龙与清化官营火铳铸炮坊"
 oe_sea2.5.b:0 "以火器贸易换取云屯与会安商港白银"
 oe_sea2.6.title:0 "郑阮纷争：广平长垒与会安商潮"
 oe_sea2.6.desc:0 "北河郑主与南河阮主隔江对峙，广平筑起横贯山海的铜墙长垒；同时双方为筹措火炮军费，竞相敞开会安与铺宪港门，引来日本朱印船、中华海商与欧洲商船云集！"
 oe_sea2.6.a:0 "敞开会安与铺宪港市汇聚国际白银"
 oe_sea2.6.b:0 "加筑广平长垒并严训水陆常备重兵"
 oe_sea2.7.title:0 "西山风云与大越南北一统"
 oe_sea2.7.desc:0 "归仁西山三兄弟振臂一呼，席卷百余年南北割据之局！大越既可借雷霆军改与喃字国学破旧立新，亦可重整朝纲贯通红河至湄公河千里疆域。"
 oe_sea2.7.a:0 "推行西山锐意军改与喃字新政"
 oe_sea2.7.b:0 "弥合南北裂痕定鼎红河至湄公一统帝国"
 oe_sea2.8.title:0 "阿瑜陀耶肇建：湄南河三水岛城"
 oe_sea2.8.desc:0 "乌通王于湄南河、华富里河与巴塞河交汇的河心岛筑起阿瑜陀耶王城，既凭滔滔江水作天然城壕，又上接素可泰内陆、下通暹罗湾万国帆影。"
 oe_sea2.8.a:0 "营建湄南岛城码头与水上运河网"
 oe_sea2.8.b:0 "承扬素可泰佛塔典籍与宋加洛瓷窑"
 oe_sea2.9.title:0 "波隆摩王《萨迪纳》官制法典"
 oe_sea2.9.desc:0 "国王波隆摩·戴莱洛迦纳颁布划时代的《萨迪纳》品级法典，将朝廷明确划为掌民事之内务部（Mahatthai）与掌军务之兵部（Kalahom），以田亩等级井然厘定全国爵禄、刑罚与兵役。"
 oe_sea2.9.a:0 "颁行《萨迪纳》文武分职大典"
 oe_sea2.9.b:0 "强化王室库务司官船海贸专营"
 oe_sea2.10.title:0 "白象战争与湄南战象方阵"
 oe_sea2.10.desc:0 "白象象征转轮圣王之正统天命，西方勃固霸主遣使索要宫中圣白象，烽火骤燃三塔关！暹罗王室誓以披甲皇家战象队与城头红夷炮捍卫湄南河谷尊严。"
 oe_sea2.10.a:0 "扩训皇家披甲白象精锐迎战强敌"
 oe_sea2.10.b:0 "整修湄南水壕炮台坚守岛城待援"
 oe_sea2.11.title:0 "纳黎萱王象背决战与大城中兴"
 oe_sea2.11.desc:0 "素攀武里阵前烟尘滚滚，英主纳黎萱策战象冲破重围，亲手与敌军主帅展开史诗般的象背单挑大获全胜！捷报传遍中南半岛，暹罗重振主权并收复十纳沙林海港。"
 oe_sea2.11.a:0 "乘大胜之威重整常备军与西海航道"
 oe_sea2.11.b:0 "休兵安民巩固文治与邻邦朝贡"
 oe_sea2.12.title:0 "大城万国商馆：法兰西、荷兰与波斯使节"
 oe_sea2.12.desc:0 "那莱王宫廷星象仪闪耀、万国使节云集！波斯大臣、日本武士町、荷兰东印度公司商馆与法兰西使团齐聚阿瑜陀耶与华富里，如何制衡列强而尽收商贸科技之利成为治国大考。"
 oe_sea2.12.a:0 "纵横法荷波斯使节广引天文火器与商贸"
 oe_sea2.12.b:0 "严控外商特权坚持王室官船自营海贸"
 oe_sea2.13.title:0 "吞武里—拉达那哥欣王朝复兴"
 oe_sea2.13.desc:0 "历经旧都劫火考验，暹罗英杰移师更近出海口的吞武里与曼谷，重修三印法典、筑起河口坚固炮台并派遣官船远航广州与南洋，开启璀璨的近代暹罗盛世。"
 oe_sea2.13.a:0 "定鼎曼谷河口统筹近代防务与海贸"
 oe_sea2.13.b:0 "以佛寺典籍与宋加洛工巧重光暹罗文脉"
 oe_sea2.14.title:0 "加查·玛达的《帕拉帕誓言》"
 oe_sea2.14.desc:0 "特罗乌兰金殿之上，新任大首相加查·玛达面对文武群臣立下震古烁今的《帕拉帕誓言》：“若未能一统努山塔拉千岛，自苏门答腊、淡马锡直至香料群岛，余誓不食帕拉帕香料！”"
 oe_sea2.14.a:0 "扬帆出师践行《帕拉帕誓言》经略千岛"
 oe_sea2.14.b:0 "先固东爪哇稻田与特罗乌兰神庙根基"
 oe_sea2.15.title:0 "《爪哇史颂》与努山塔拉朝贡曼陀罗"
 oe_sea2.15.desc:0 "哈亚姆·武鲁克盛世之际，宫廷诗人普拉班查谱写史诗《爪哇史颂》，详载九十八座海岛藩国朝贡往来。特罗乌兰红砖水渠与泗水良港将整个努山塔拉织入神圣曼陀罗体系。"
 oe_sea2.15.a:0 "颁行曼陀罗朝贡宪章凝聚群岛诸藩"
 oe_sea2.15.b:0 "兴建锦石与厨闽自由港广纳外洋商船"
 oe_sea2.16.title:0 "爪哇戎克巨舰与青铜佛朗机回旋炮"
 oe_sea2.16.desc:0 "北岸造船厂高耸如林！多层柚木卯接的爪哇戎克巨舰载重数百吨、船壁厚重难穿，舷侧更列装本土精铸青铜佛朗机回旋炮（Cetbang），令满者伯夷水师纵横爪哇海与南洋。"
 oe_sea2.16.a:0 "扩建戎克巨舰官厂与青铜炮铸坊"
 oe_sea2.16.b:0 "以戎克商船队专航香料群岛广收关税"
 oe_sea2.17.title:0 "香料群岛黄金时代：丁香与肉豆蔻贸易"
 oe_sea2.17.desc:0 "来自特尔纳特、蒂多雷与班达群岛的丁香与肉豆蔻满载于爪哇戎克船舱，在泗水与锦石码头换取爪哇精米、印度棉布与大明青花瓷，令满者伯夷成为亚洲首屈一指的香料总汇。"
 oe_sea2.17.a:0 "确立爪哇米换香料的群岛贸易枢纽"
 oe_sea2.17.b:0 "遣使加固马鲁古诸岛朝贡保护约"
 oe_sea2.18.title:0 "淡目伊斯兰转型与爪哇九圣"
 oe_sea2.18.desc:0 "北岸淡目、锦石与井里汶商港在“九圣”（Wali Songo）教化下兴起繁荣的伊斯兰海商势力，以皮影戏与爪哇甘美兰乐音柔和传播新教法。特罗乌兰正面临文化融合还是古礼坚守的抉择。"
 oe_sea2.18.a:0 "吸纳九圣商法与北岸海商共创和融新局"
 oe_sea2.18.b:0 "坚守印度佛教曼陀罗圣域与东爪哇—巴厘正统"
 oe_sea2.19.title:0 "努山塔拉韧性：反抗远洋香料垄断"
 oe_sea2.19.desc:0 "欧洲武装商船驶入巽他海峡与爪哇海，企图以堡垒与炮舰强占万丹、巽他卡拉巴及马鲁古香料专卖权。群岛诸港唯有联合戎克战舰与岸防重炮，方能守住千年海上自由！"
 oe_sea2.19.a:0 "集结爪哇—马鲁古联军舰队打破海上封锁"
 oe_sea2.19.b:0 "以自由港外交分化竞争列强保卫关税"
 oe_sea2.20.title:0 "拜里米苏拉肇建马六甲海峡总汇"
 oe_sea2.20.desc:0 "自巨港与淡马锡辗转北上的王子拜里米苏拉在马六甲河口建立新港，与苏门答腊巴赛遥相呼应。凭借东西季风交汇与低廉公允关税，这片海湾迅速化作欧亚航运的心脏！"
 oe_sea2.20.a:0 "兴建深水货仓与防波堤广招东西商船"
 oe_sea2.20.b:0 "与苏门答腊胡椒港结盟统筹两岸航运"
 oe_sea2.21.title:0 "郑和宝船下西洋与马六甲官厂结盟"
 oe_sea2.21.desc:0 "蔽海而来的大明九桅宝船锚泊海峡，三保太监郑和颁赐银印冠带并筑起坚固围栅官厂作为远航西洋总补给站！强援在侧，海峡商港从此免受北邻侵逼而瓷丝贸易暴涨。"
 oe_sea2.21.a:0 "设立郑和官厂并缔结长期海上丝路同盟"
 oe_sea2.21.b:0 "借宝船盛况广邀印度与阿拉伯商帮落户"
 oe_sea2.22.title:0 "《马六甲海法》与四方港务官制度"
 oe_sea2.22.desc:0 "为治理来自古吉拉特、孟加拉、爪哇、吕宋与中华的数十种商帮，宫廷颁行详密的《马六甲海法》并分设四位港务官（Shahbandar），明定航行、货损与公平仲裁章程。"
 oe_sea2.22.a:0 "颁行《马六甲海法》与四方港务官体制"
 oe_sea2.22.b:0 "以海法典籍为基弘扬马来文教书院"
 oe_sea2.23.title:0 "马来语黄金时代与爪夷文典籍传播"
 oe_sea2.23.desc:0 "从马六甲与巴赛宫廷传出的爪夷文史书、法学注疏与诗篇随季风商船远播婆罗洲、爪哇与马鲁古，马来语由此确立为整个南洋群岛的通用外交与商贸雅言。"
 oe_sea2.23.a:0 "广设宫廷书院编纂马来典籍与海图"
 oe_sea2.23.b:0 "借共通商语在群岛各港设立特许商馆"
 oe_sea2.24.title:0 "1511保卫马六甲：抗击葡萄牙武装舰队"
 oe_sea2.24.desc:0 "满载重炮的葡萄牙远征舰队兵临马六甲外港，扬言独霸印度洋航线并强索筑堡特权！苏丹国必须即刻在海峡两岸布列铜炮与快船血战到底，或串联柔佛、巴赛与亚齐构筑自由港同盟。"
 oe_sea2.24.a:0 "于海峡两岸部署火炮与水师死守主权"
 oe_sea2.24.b:0 "缔结柔佛—巴赛—亚齐自由海峡联防网"
 oe_sea2.25.title:0 "抗击东印度公司垄断：自由海峡博弈"
 oe_sea2.25.desc:0 "荷兰东印度公司凭借巨舰与严苛条约企图封锁锡矿与胡椒自由贸易。海峡诸港一方面编练快艇与火炮护航船队，一方面巧用多国通商外交瓦解殖民垄断。"
 oe_sea2.25.a:0 "以自由港多边通商与护航水师反制垄断"
 oe_sea2.25.b:0 "深化《马六甲海法》信用吸引亚洲独立商帮"
 oe_sea2.26.title:0 "帕木竹巴世俗政权与宗堡新法"
 oe_sea2.26.desc:0 "大司徒绛曲坚赞革除积弊丛生的旧万户格局，在卫藏险要河谷设立由中央任免宗本治理的十三大宗堡，并复兴吐蕃《十五法典》，令雪域政令重归清明。"
 oe_sea2.26.a:0 "广设宗堡官署颁行雪域新法"
 oe_sea2.26.b:0 "优先整修高原茶马商路繁荣盐粮互市"
 oe_sea2.27.title:0 "宗喀巴大师宗教改革与格鲁派兴起"
 oe_sea2.27.desc:0 "一代宗师宗喀巴于拉萨大昭寺首倡传昭大法会，并建甘丹寺创立严守戒律、重视显密次第辩经的格鲁派（黄教）。三大寺学僧云集，将雪域哲学、历算与藏医推向前所未有之高峰。"
 oe_sea2.27.a:0 "大力护持格鲁派三大寺与传昭大法会"
 oe_sea2.27.b:0 "兼顾教化改革与各派宗堡世俗行政平衡"
 oe_sea2.28.title:0 "跨喜马拉雅与漠北檀越外交"
 oe_sea2.28.desc:0 "雪域高僧北会蒙古诸汗、西联古格与拉达克，缔结跨越戈壁与喜马拉雅雪峰的“檀越关系”（Cho-Yon）。宗教威望转化为外交护盾，使商旅与译师自由往来于东亚、南亚与草原之间。"
 oe_sea2.28.a:0 "广结蒙藏与喜马拉雅檀越外交联盟"
 oe_sea2.28.b:0 "借外交太平扩建跨山茶马盐税驿站"
 oe_sea2.29.title:0 "甘丹颇章政权与布达拉宫巍峨落成"
 oe_sea2.29.desc:0 "卫藏重归一统，甘丹颇章新政以拉萨为都，在玛布日红山之巅大兴土木筑起金顶白墙、红宫耸翠的布达拉宫。这座雪域圣殿既是政教中枢，亦成为抵御强敌的精神丰碑。"
 oe_sea2.29.a:0 "倾力营建布达拉宫并定鼎拉萨政教中枢"
 oe_sea2.29.b:0 "同时兴办拉萨医算学院与藏版大藏经印经院"
 oe_sea2.30.title:0 "雪域茶马古道与高原自主新政"
 oe_sea2.30.desc:0 "牦牛铃声回荡在唐蕃古道、川藏茶路与尼泊尔山口。面对周边列强角逐，雪域政权依托险峻山口防务、活跃的茶马盐粮贸易与精妙跨国外交，牢牢守望高原长治久安。"
 oe_sea2.30.a:0 "护航茶马盐粮古道并整饬高原驿路"
 oe_sea2.30.b:0 "以檀越外交平衡东西邻国永保高原安宁"
