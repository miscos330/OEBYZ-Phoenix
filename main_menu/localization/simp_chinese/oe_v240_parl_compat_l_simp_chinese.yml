l_simp_chinese:
 oe_v240_pc_crown_chancery_audit: "《中枢文书与度支核查法案》"
 oe_v240_pc_crown_chancery_audit_desc: "授权中枢文书机构全面稽核行省税册与各署账目，理顺财政上解与政务分工，显著提升全国税效与内阁行政效能，代价是略微引起贵族阶层不满。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_crown_chancery_audit: "中枢文书与度支核查"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_crown_chancery_audit: "规范化的度支审计与中枢文书运转持续提升全国正税收益与内阁办事效率。"
 oe_v240_pc_crown_statute_consolidation: "《律例统合与行省督察法案》"
 oe_v240_pc_crown_statute_consolidation_desc: "将各地繁杂的旧敕与行省成例汇编为统一律典，并遣巡按使督查执行，显著提升国家立法效率与各省月度控制度，唯略微增加宫廷行政开支。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_crown_statute_consolidation: "律例统合与行省督察"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_crown_statute_consolidation: "统一的律典汇编与巡按督察加快政令推行，稳步抬升各行省的直辖控制度。"
 oe_v240_pc_nobles_border_garrison_charter: "《边疆要塞与戍卫军役宪章》"
 oe_v240_pc_nobles_border_garrison_charter_desc: "明确边疆领主与戍堡守将的防务职责，统筹边城修缮与常备粮草补给，大幅提升全国要塞防御力与维护效率，代价是乡民徭役负担略微增加。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_nobles_border_garrison: "边疆要塞戍卫宪章"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_nobles_border_garrison: "职责分明的边疆戍堡体系显著增强要塞防卫能力并节省堡垒日常维持开支。"
 oe_v240_pc_nobles_marshal_muster_ordinance: "《元帅校阅与常备兵源条例》"
 oe_v240_pc_nobles_marshal_muster_ordinance_desc: "令各省武官按季举行校阅演武并造册登记后备兵员，确保战时迅速成军，显著充实全国兵源储备并稳步积累陆军传统，唯略微抬高常规军费维护。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_nobles_marshal_muster: "元帅校阅与常备兵源"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_nobles_marshal_muster: "常年不懈的季候校阅与军籍整顿持续扩充兵源储备并锤炼陆军传统。"
 oe_v240_pc_clergy_parish_literacy_act: "《教区经院与识字兴学法案》"
 oe_v240_pc_clergy_parish_literacy_act_desc: "拨款扶持各省教区经院、修道院抄经馆与礼法学塾，广育书吏与学人，持续提高全国识字率并加快科技学术进步，代价是小幅增加宫廷赞助开销。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_clergy_parish_literacy: "教区经院兴学法案"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_clergy_parish_literacy: "遍布诸省的经院与抄经学塾稳步推高民间识字水平并加速学术研究进度。"
 oe_v240_pc_clergy_concord_relief_bill: "《教区济贫与礼教安民法案》"
 oe_v240_pc_clergy_concord_relief_bill_desc: "统筹教区善款兴办养济院、施药局与新附边疆礼教宣讲，抚慰动荡民心，有效降低维稳代价并加快宗教教化进度，仅略微让渡部分国库税效。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_clergy_concord_relief: "教区济贫与礼教安民"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_clergy_concord_relief: "健全的教区济贫网络与礼教宣化显著缓解维稳压力并加速各省信仰归化。"
 oe_v240_pc_burghers_market_weights_act: "《统一度量衡与商市通惠法案》"
 oe_v240_pc_burghers_market_weights_act_desc: "在全国商市与集散城镇统一度量衡标准、铸币检验与商事契约裁判，显著提振全国贸易收入与商人竞争力，略微触动传统领主的关津私税。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_burghers_market_weights: "统一度量衡与商市通惠"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_burghers_market_weights: "统一的度量衡标准与公正的商事法庭持续拉动贸易收益并壮大本土商帮实力。"
 oe_v240_pc_burghers_public_works_bill: "《城市行会与工坊营建法案》"
 oe_v240_pc_burghers_public_works_bill_desc: "与城镇工匠行会合资兴修石桥、码头仓栈与手工业工坊，盘活地方百工技艺，显著加快全国营建速度并提升生产效率，代价是略微让渡部分王室集中权势。"
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_burghers_public_works: "城市行会与工坊营建"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_burghers_public_works: "由行会协办的市政基建与工坊体系持续加快各地营建进度并提升全国生产效率。"
