 oe_crm.11.t: "狄奥多罗城的哀歌"
 oe_crm.11.desc_c: "#F 修士马太从黑海北岸回来，带回一首长诗：山上的狄奥多罗城被蛮族攻破，宫室和教堂都成了废墟。有人说动手的是帖木儿的军队，诗里没有写名字。#!\n\n如今，这首诗在京城传抄。哥特亚的教众归我们的牧首管，哥特亚的君主[GetCountry('FEO').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]正设法收拾残局。可京城自己正被苏丹围着，粮食和人手都紧。"
 oe_crm.11.desc_x: "#F 修士马太从黑海北岸回来，带回一首长诗：山上的狄奥多罗城被蛮族攻破，宫室和教堂都成了废墟。有人说动手的是帖木儿的军队，诗里没有写名字。#!\n\n如今，这首诗在京城传抄。哥特亚的教众归我们的牧首管，哥特亚的君主[GetCountry('FEO').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]正设法收拾残局。"
 oe_crm.11.a: "由牧首区派人带钱北上，安抚哥特亚的教众"
 oe_crm.11.a.tt: "花费#R 1#!个月的贸易与税收收入\n[oe_tu_patriarchate|e]#G +1#!\n狄奥多罗对帝国好感#G +15#!，持续#Y 10#!年\n哥特亚会记住帝国的这份情"
