 oe_crm.13.t: "驶向琴巴洛的舰队"
 oe_crm.13.desc_lkd: "#F 1433年，琴巴洛的希腊人起事，赶走了热那亚人，把城交给哥特亚的君主阿莱克修斯。热那亚决定在本土装备舰队，夺回此城。去黑海只有一条水路，就在我们的城墙下面。1434年3月，卡洛·洛梅利诺带着二十来艘船从热那亚出发。#!\n\n如今，热那亚的舰队快到海峡了。那位嫁到曼古普的小姐也在等京城的消息。按商约，热那亚人的船过海峡免税，本来就不必问我们。"
