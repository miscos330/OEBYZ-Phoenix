 oe_crm.1.t: "苏格代亚换了旗"
 oe_crm.1.desc_gd: "#F 1365年，趁金帐汗国大乱，卡法的热那亚人拿下了苏格代亚，意大利人叫它索尔代亚。这是黑海北岸最老的希腊城之一，城里的都主教向来由君士坦丁堡祝圣。#!\n\n如今，城头换上了圣乔治旗，城里的希腊人和教堂都归拉丁领事管辖。消息传到京城，牧首区的人来问皇帝要不要过问。我们与北岸订的粮约还在，不宜闹僵。佩拉的热那亚人说，这对大家的生意都好。"
 oe_crm.1.desc_g: "#F 1365年，趁金帐汗国大乱，卡法的热那亚人拿下了苏格代亚，意大利人叫它索尔代亚。这是黑海北岸最老的希腊城之一，城里的都主教向来由君士坦丁堡祝圣。#!\n\n如今，城头换上了圣乔治旗，城里的希腊人和教堂都归拉丁领事管辖。消息传到京城，牧首区的人来问皇帝要不要过问。我们与北岸订的粮约还在，不宜闹僵。"
 oe_crm.1.desc_d: "#F 1365年，趁金帐汗国大乱，卡法的热那亚人拿下了苏格代亚，意大利人叫它索尔代亚。这是黑海北岸最老的希腊城之一，城里的都主教向来由君士坦丁堡祝圣。#!\n\n如今，城头换上了圣乔治旗，城里的希腊人和教堂都归拉丁领事管辖。消息传到京城，牧首区的人来问皇帝要不要过问。佩拉的热那亚人说，这对大家的生意都好。"
 oe_crm.1.desc_x: "#F 1365年，趁金帐汗国大乱，卡法的热那亚人拿下了苏格代亚，意大利人叫它索尔代亚。这是黑海北岸最老的希腊城之一，城里的都主教向来由君士坦丁堡祝圣。#!\n\n如今，城头换上了圣乔治旗，城里的希腊人和教堂都归拉丁领事管辖。消息传到京城，牧首区的人来问皇帝要不要过问。"
 oe_crm.1.a: "致书卡法的领事，为都主教和城里的希腊人求一纸保障"
 oe_crm.1.a.tt: "花费#R 1#!个月的贸易与税收收入\n[oe_tu_patriarchate|e]#G +1#!\n卡法对帝国好感#G +5#!，持续#Y 5#!年"
 oe_crm.1.b: "趁此与北岸的希腊人通声气"
 oe_crm.1.b.tt: "狄奥多罗对帝国好感#G +10#!，持续#Y 10#!年\n哥特亚会记住帝国的这份情\n卡法对帝国好感#R −5#!，持续#Y 5#!年"
 oe_crm.1.c: "北岸的事，帝国管不到"
 oe_crm.1.c.tt: "帝国不过问此事"
 oe_crm.2.t: "三位都主教的官司"
 oe_crm.2.desc_luw: "#F 1380年至1381年，汗的长官两次与卡法立约，把从琴巴洛到索尔代亚的海岸让给了热那亚人。南岸有两个教区原属哥特亚和苏格代亚的都主教；海岸易主之后，赫尔松的都主教出面来争，背后站着卡法的新主人。这场官司在牧首区一拖八年，留下了五份文书。#!\n\n如今，三位都主教的人都到了京城，各执一词，等皇帝和牧首裁断。当年靠热那亚人坐上皇位的那一位，也曾这样偏向赫尔松。北岸正在打仗，热那亚人更不肯让步。"
