 oe_crm.11.c.tt: "帝国不过问此事"
 oe_crm.12.t: "哥特亚的求亲"
 oe_crm.12.desc_ltr: "#F 1422年起，哥特亚的君主阿莱克修斯出兵争夺热那亚人占着的海岸，卡法花了大钱才挡住。山上的狄奥多罗城也重新修了起来。1425年的铭文里，这位君主自称“狄奥多罗城与滨海之地的君主”；同年，其长子娶了一位兼有巴列奥略与阿森两家血统的小姐。据说从那以后，曼古普的石头上刻起了双头鹰。#!\n\n如今，[GetCountry('FEO').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的使者到了京城，为继承人求一门带皇族血统的亲事。这些年帝国没有忘记北岸，使者说话也格外恳切。听说特拉比松的宫廷也在与曼古普议亲。"
