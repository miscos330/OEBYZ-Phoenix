l_simp_chinese:
 oe_peasants_military_service_land: "军役土地"
 oe_peasants_military_service_land_desc: "以减轻田赋换取军役，由登记在册的农户供给兵员，并协助军队筹集行粮。耕作者保有赖以养家的土地，也须在帝国征召时履行义务。\n\n平民税收上限#R −10%#!；每月向数量倾向#Y +0.1#!；单位食物消耗#G −5%#!；人力#G +10%#!。\n\n与另一项军役特权互斥。旧档若同时持有两项，仅军役土地生效；撤销其中一项即可恢复正常选择。"
 oe_peasants_military_service_tax: "军役税金"
 oe_peasants_military_service_tax_desc: "允许农户以定额军役税代替部分服役义务，将其保留在田间，以收入供养常备军。缴税者获得更明确的自主地位，帝国却须接受直接兵源的减少。\n\n平民税收上限#G +5%#!；农民自主权#G +5%#!；人力#R −5%#!。\n\n与另一项军役特权互斥。旧档若同时持有两项，仅军役土地生效；撤销其中一项即可恢复正常选择。"
