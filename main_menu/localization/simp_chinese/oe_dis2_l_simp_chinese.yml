l_simp_chinese:
# NEW 2026-11-23 v21.0 Module E2: Localization (simp_chinese) (oe_dis2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v210_disasters_ai.py; edit the generator, not this file.
 oe_dis2_imperial_overextension: "帝国过扩与财政违约"
 oe_dis2_imperial_overextension_desc: "辽阔帝国的版图扩张远超财税官僚的稽核极限，连年战债、边防欠饷与税包违约交织爆发。唯有推行财政整顿、重组主权债务并改革度支体系，方能挽帝国于倾覆边缘。"
 oe_dis2_military_transition_mutiny: "禁卫军与新旧军制兵变"
 oe_dis2_military_transition_mutiny_desc: "当火枪方阵、重炮与新式常备军逐步取代旧式禁卫兵团时，掌握特权的军营派系发动兵变抗命。中枢必须在彻底推行近代军制与妥协收编旧军团之间作出决断。"
 oe_dis2_colonial_independence_wave: "跨洋殖民地自治与独立浪潮"
 oe_dis2_colonial_independence_wave_desc: "在大洋彼岸，羽翼渐丰的海外殖民地议会与港埠商民激烈抵制母国关税、印花税与钦差总督。若不推进跨洋联邦宪政或自治领契约，庞大的海外帝国将面临全面裂解。"
 oe_dis2_court_regency_crisis: "宫廷权臣与摄政危机"
 oe_dis2_court_regency_crisis_desc: "幼主临朝或君权正统低迷之际，大贵族派系、宫廷宠臣与枢密官僚围绕国玺与封赏展开倾轧。必须整顿私兵党羽并确立中枢秩序，方能终结内耗、重振朝纲。"
 oe_dis2_industrial_labor_unrest: "早期工业化劳工与圈地动荡"
 oe_dis2_industrial_labor_unrest_desc: "机械工场兴起、农村圈地与粮价剧烈波动令大批手工业者与失地农民涌入拥挤的工业市镇。罢工、捣毁织机与面包骚乱频发，迫使王室尽快缔结劳工与行会和解新约。"
 oe_dis2_confessional_schism_backlash: "教派分裂与宗教战争余波"
 oe_dis2_confessional_schism_backlash_desc: "在横跨多元信仰的庞大帝国中，激烈的讲坛攻讦、圣地争端与教派同盟将诸省推向宗教动乱边缘。唯有颁行普世宗教宽容敕令或达成稳固的教政协约，方可止息纷争。"
 STATIC_MODIFIER_NAME_oe_dis2_ai_gp_resilience_t1: "列强战略韧性 I"
 STATIC_MODIFIER_DESC_oe_dis2_ai_gp_resilience_t1: "面对急剧扩张的超级霸权，尚存的欧亚列强统筹财政信用、厌战恢复与均势外交，以稳固多极战略平衡，避免中后期过早崩盘。"
 STATIC_MODIFIER_NAME_oe_dis2_ai_gp_resilience_t2: "列强反霸权协调 II"
 STATIC_MODIFIER_DESC_oe_dis2_ai_gp_resilience_t2: "当跨洲巨无霸威胁倾覆旧有国际秩序时，残存强国全面收紧财税纪律、扩充同盟容量并整饬常备武备，维系势均力敌的大国博弈。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_debt_commission: "帝国紧急债务委员会"
 STATIC_MODIFIER_DESC_oe_dis2_mod_debt_commission: "御前审计官削减宫廷冗俸、重议国债利率并推行严苛财政紧缩，以短期阶层不满换取财政信用回稳。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_debt_restructuring: "主权债务重组协定"
 STATIC_MODIFIER_DESC_oe_dis2_mod_debt_restructuring: "强制整并短期高息债务并延长偿付周期，有效缓解眼下违约压力，但令国内商帮与银行家心生戒备。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_crown_charter_sales: "敕卖王室特许税契"
 STATIC_MODIFIER_DESC_oe_dis2_mod_crown_charter_sales: "向行省富商与自治市镇拍卖关税收缴特权，迅速筹得救荒白银，却削弱了帝国中央对地方的长期掌控。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_exchequer_reform: "常设帝国度支总署"
 STATIC_MODIFIER_DESC_oe_dis2_mod_exchequer_reform: "历经帝国过扩危机后建成的常设度支总署统一稽核预算与公债，为广土众民的帝国奠定稳健的财政根基。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_provincial_budgets: "行省分权财政体制"
 STATIC_MODIFIER_DESC_oe_dis2_mod_provincial_budgets: "赋予各行省议会固定包干税额，减轻中枢行政负荷并安抚地方阶层，唯略微让渡皇权集权度。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_modern_drilling_charter: "新式火器操典宪章"
 STATIC_MODIFIER_DESC_oe_dis2_mod_modern_drilling_charter: "以标准化齐射操典、专职炮兵学堂与正规军籍遏制旧禁卫兵变，短期推高军费开支以换取严明军纪。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_praetorian_compromise: "旧禁卫军制妥协约"
 STATIC_MODIFIER_DESC_oe_dis2_mod_praetorian_compromise: "在保留旧禁卫世袭俸禄的前提下并行扩编新军，避免流血清算，维系军心稳定而略微放缓军制革新步伐。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_modern_corps_settlement: "近代化常备帝国新军"
 STATIC_MODIFIER_DESC_oe_dis2_mod_modern_corps_settlement: "彻底收编桀骜不驯的旧禁卫并确立统一火器条令后，帝国建成纪律严明、效忠中枢的近代常备军。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_imperial_federation: "跨洋帝国联邦宪政"
 STATIC_MODIFIER_DESC_oe_dis2_mod_imperial_federation: "将议会席位与共同海事治理权延伸至海外领地，以联邦宪政缔结跨洋忠诚与贸易共同体。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_mercantile_crackdown: "重商航海严厉管制"
 STATIC_MODIFIER_DESC_oe_dis2_mod_mercantile_crackdown: "派遣皇家缉私舰队与海事法庭严厉推行重商航海条例，增加母国关税与海权收益，但加剧海外离心。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_dominion_compact: "特许自治领契约"
 STATIC_MODIFIER_DESC_oe_dis2_mod_dominion_compact: "通过谈判确立海外自治领财政自主与地方特许权，平息殖民地抗税风潮并保留优惠跨洋商路。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_chancery_regency: "御前枢密文官摄政"
 STATIC_MODIFIER_DESC_oe_dis2_mod_chancery_regency: "由资深法学家与宫廷书记执掌摄政国玺，保全王室行政中枢，却触怒遭排挤的世袭豪门。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_magnate_council: "大贵族摄政国务院"
 STATIC_MODIFIER_DESC_oe_dis2_mod_magnate_council: "让各派大贵族共参摄政国务以化解兵戎相见的风险，安抚领主阶层而略微让渡皇权份额。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_crown_authority_restored: "重振中枢王室权威"
 STATIC_MODIFIER_DESC_oe_dis2_mod_crown_authority_restored: "摄政党争彻底落幕后，君主重掌统合内阁与地方总督，王朝正统性与中枢政令焕然一新。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_constitutional_council: "宪政贵族国务宪章"
 STATIC_MODIFIER_DESC_oe_dis2_mod_constitutional_council: "以成文宪章规范大臣问责与贵族议政，根绝宫廷政变隐患，换取持久的阶层和睦与政局稳健。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_factory_labor_compact: "早期工业劳工保障约"
 STATIC_MODIFIER_DESC_oe_dis2_mod_factory_labor_compact: "确立工场工时规范、市政济贫与行会仲裁制度，稳住新兴工业市镇秩序并保障熟手工匠产能。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_enclosure_protection: "工场主与圈地护产令"
 STATIC_MODIFIER_DESC_oe_dis2_mod_enclosure_protection: "强力护卫机械工场与商业圈地产权，加速工业产出与市民资本积累，但令失地农民心怀怨望。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_guild_enterprise_settlement: "自由工场行会和解令"
 STATIC_MODIFIER_DESC_oe_dis2_mod_guild_enterprise_settlement: "协调传统行会匠师、蒸汽工场主与市政法庭权益，激发工商业活力与技术改良热潮。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_ecumenical_toleration_edict: "普世宗教宽容敕令"
 STATIC_MODIFIER_DESC_oe_dis2_mod_ecumenical_toleration_edict: "以王室敕令保障信仰自由与少数教派礼拜堂安全，平息多宗教大帝国的教派冲突，唯令保守教士略有微词。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_confessional_uniformity: "国家教派一统法典"
 STATIC_MODIFIER_DESC_oe_dis2_mod_confessional_uniformity: "借由国家主导的宗教会议、神学院与教区督察加速归化传教与国教凝聚力，但加剧异端与异教族群摩擦。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_imperial_conciliation: "帝国怀柔安抚诏书"
 STATIC_MODIFIER_DESC_oe_dis2_mod_imperial_conciliation: "钦差特使巡行各省调停阶层宿怨、减免苛捐杂税，有效压降动荡地区的叛乱滋长。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_diplomatic_conciliation: "列强均势外交缓和"
 STATIC_MODIFIER_DESC_oe_dis2_mod_diplomatic_conciliation: "遣使重申疆界担保与互惠通商条约，有效缓和周边列强对本国急速扩张的敌意与戒心。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_grand_fleet_deterrence: "远洋舰队与强军威慑"
 STATIC_MODIFIER_DESC_oe_dis2_mod_grand_fleet_deterrence: "举行大舰队检阅与边防大演兵以震慑反霸权同盟，提振海陆士气与威望，但带来更高维持开销。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_frontier_citadel_watch: "帝国边防要塞警戒网"
 STATIC_MODIFIER_DESC_oe_dis2_mod_frontier_citadel_watch: "全面加固星形棱堡、烽燧驿站与边塞军械库，大幅增强边疆防线抵御列强联军进犯的韧性。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_contractor_audit: "军需账目与包商肃贪"
 STATIC_MODIFIER_DESC_oe_dis2_mod_contractor_audit: "设立军需肃贪法庭清查粮饷与军械包商舞弊，显著改善部队后勤效率与军纪。"
 STATIC_MODIFIER_NAME_oe_dis2_mod_civic_press_reform: "规范市民议事与报刊法"
 STATIC_MODIFIER_DESC_oe_dis2_mod_civic_press_reform: "引导市民陈情与报刊言论进入合法议事厅与特许印书局，疏导社会怨气并助推行政与学术革新。"
 oe_dis2_dec_debt_commission.title: "设立帝国紧急债务委员会"
 oe_dis2_dec_debt_commission.desc: "委派独立度支审计官统筹高息战债、削减宫廷冗费，实质推进「帝国过扩与财政违约」灾难的财政善后进程。"
 oe_dis2_dec_debt_commission.a: "授权紧急债务委员会整顿财政"
 oe_dis2_dec_debt_commission_tt: "将「帝国过扩与财政违约」整顿进度推进 #G +1#! 步，缓和通胀与厌战度，并获得10年「帝国紧急债务委员会」修正（冷却4年）。"
 oe_dis2_dec_military_modernization_charter.title: "颁行近代新军整编宪章"
 oe_dis2_dec_military_modernization_charter.desc: "拨款兴办专职炮兵学堂、推行标准化火器操典与新军军官委任制，瓦解旧禁卫派系抗命并推进「禁卫军与新旧军制兵变」善后进程。"
 oe_dis2_dec_military_modernization_charter.a: "颁署新式火器操典与整军宪章"
 oe_dis2_dec_military_modernization_charter_tt: "耗费150金币将「禁卫军与新旧军制兵变」平息进度推进 #G +1#! 步，提升陆军传统并获得10年「新式火器操典宪章」修正（冷却4年）。"
 oe_dis2_dec_imperial_conciliation_edict.title: "颁布帝国怀柔安抚诏书"
 oe_dis2_dec_imperial_conciliation_edict.desc: "派遣钦差重臣巡行各地，调停海外自治诉求、宫廷摄政党争、早期工场劳工冲突或教派纷争，稳步推进当前帝国危机的和平收束。"
 oe_dis2_dec_imperial_conciliation_edict.a: "遣派帝国钦差颁行怀柔诏书"
 oe_dis2_dec_imperial_conciliation_edict_tt: "耗费120金币提升稳定度，将当前殖民独立、摄政危机、工业劳工或教派分裂灾难进度推进 #G +1#! 步，并获得10年「帝国怀柔安抚诏书」修正（冷却4年）。"
 oe_dis2_dec_toggle_ai_rivalry.title: "切换 AI 列强中后期竞争性韧性"
 oe_dis2_dec_toggle_ai_rivalry.desc: "自由开启或关闭非作弊型「AI 列强战略韧性」护栏。开启时，当玩家版图大幅领先全球，尚存的 AI 列强将获得温和的财税与外交韧性以维持中后期大国博弈；随时可关闭以享受纯粹休闲沙盒体验。"
 oe_dis2_dec_toggle_ai_rivalry.a: "切换 AI 列强竞争韧性开关"
 oe_dis2_dec_debt_cd_tt: "过去4年内未召开帝国紧急债务委员会"
 oe_dis2_dec_mil_cd_tt: "过去4年内未颁行近代新军整编宪章"
 oe_dis2_dec_concil_cd_tt: "过去4年内未颁布帝国怀柔安抚诏书"
 oe_dis2_ai_rivalry_disable_tt: "关闭 #Y AI 列强战略韧性#!（进入纯粹休闲沙盒模式），并立即清除所有 AI 国家身上生效中的列强韧性修正。"
 oe_dis2_ai_rivalry_re_enable_tt: "重新开启 #Y AI 列强战略韧性#!，自下一次年度战略检测起恢复对尚存 AI 列强的温和均势护栏。"
 oe_dis2.1.title: "广土重负：帝国度支濒危"
 oe_dis2.1.desc: "来自边疆军区与行省税署的急报堆积如山：庞大的战债利息与远疆戍边经费已彻底吞噬国库岁入。债主纷纷抬高息率，边镇守将更密报兵饷告罄，帝国正步入过扩违约危机。"
 oe_dis2.1.a: "推行严苛财政紧缩并大幅裁撤宫廷冗费"
 oe_dis2.1.b: "强制重组主权短期借款为长期帝国公债"
 oe_dis2.1.c: "向行省商帮拍卖特许税契以应急筹银"
 oe_dis2.2.title: "行省包税商倒账与军饷拖欠"
 oe_dis2.2.desc: "数家承揽行省税赋的包税商号联名呈报无力解银入京，称连年征战令地方凋敝、抗税四起。户部主事警告，若不火速补齐亏空，欠饷将很快酿成大乱。"
 oe_dis2.2.a: "查抄违约包税商抵产并派驻钦差稽核税署"
 oe_dis2.2.b: "由京师银号承销统合国库券以渡难关"
 oe_dis2.2.c: "下放行省地方征税包干权以换取边境安靖"
 oe_dis2.3.title: "度支重振：帝国财政秩序复归"
 oe_dis2.3.desc: "历经数年艰苦的财政整顿，国库欠饷终得清偿，国债息率回落，各行省钱粮账册重归收支平衡。朝中重臣就此呈上两套长治久安的度支改制方略。"
 oe_dis2.3.a: "设立中央直辖的常设帝国度支总署"
 oe_dis2.3.b: "确立行省分权预算契约以长久减轻中枢负荷"
 oe_dis2.4.title: "翻锅抗命：旧禁卫军团哗变"
 oe_dis2.4.desc: "不满新式火器操典、常备火枪营扩编与严密点卯核饷，旧禁卫军官在营房筑垒抗命，联名逼宫要求罢黜主导新军改革的兵部重臣。"
 oe_dis2.4.a: "力挺新军改革派并强力推行火器操典"
 oe_dis2.4.b: "与旧军团元老谈判，保留其名号并实行双轨并行"
 oe_dis2.4.c: "开库颁赏紧急安军银以稳住京畿驻军"
 oe_dis2.5.title: "火药武库被占与兵营通牒"
 oe_dis2.5.desc: "叛乱老兵趁夜夺占京师铸炮局与火药武库，扬言若不永久确认其世袭俸禄便将新铸野战火炮尽数毁坏。忠于王室的野战新军已在城外列阵待命。"
 oe_dis2.5.a: "调动忠义炮兵与新式线列步兵果断强攻平叛"
 oe_dis2.5.b: "分化瓦解叛军，吸纳愿降军官编入新式炮兵团"
 oe_dis2.5.c: "为免京师流血，暂时承认旧禁卫世袭兵饷"
 oe_dis2.6.title: "新军定鼎：近代常备武备大成"
 oe_dis2.6.desc: "军营哗变业已彻底平息。制式火枪、协同野炮与统一军官考核体系如今成为帝国武备的脊梁。君主须敲定未来数十年的常备军最终建制。"
 oe_dis2.6.a: "正式确立全面近代化的职业常备军典制"
 oe_dis2.6.b: "确立兼顾武勋传统与新式战法的双轨兵制和约"
 oe_dis2.7.title: "跨洋抗税：海外领地自治浪潮"
 oe_dis2.7.desc: "来自海外各港埠与殖民地议会的代表联署抗议诏书，抵制母国关税与无代表征税。商民委员会封锁帝国货船，地方民兵亦在码头公然操练，跨洋独立风潮一触即发。"
 oe_dis2.7.a: "倡议召开跨洋帝国联邦大会，予海外代表议席"
 oe_dis2.7.b: "派皇家舰队严厉执行重商航海条例并惩办抗税者"
 oe_dis2.7.c: "主动让渡地方关税自治权，谈判缔结自治领契约"
 oe_dis2.8.title: "港埠抵货风波与殖民地民兵"
 oe_dis2.8.desc: "一座繁华海外港埠的民众将课税商货倾倒入海，并将母国税官逐回皇家护卫舰。无论是主张妥协的海外温和派，还是力主强硬的朝廷鹰派，都在屏息等待御前裁断。"
 oe_dis2.8.a: "废止招怨的印花税并邀海外商贸代表入京共议"
 oe_dis2.8.b: "封锁抗命港口直至海外议会足额赔付货损"
 oe_dis2.8.c: "敕建母国与海外共治的跨洋海事商议院"
 oe_dis2.9.title: "跨洋大宪章：海外秩序重归稳固"
 oe_dis2.9.desc: "席卷诸洋的殖民地动荡终于平息。海外总督、港埠商民代表与中枢重臣齐聚御前，共同签署确立跨洋帝国近代治理架构的永久宪约。"
 oe_dis2.9.a: "昭告天下，正式缔造跨洋帝国联邦"
 oe_dis2.9.b: "签署务实的特许自治领通商联盟契约"
 oe_dis2.10.title: "争执国玺：宫廷权臣与摄政危机"
 oe_dis2.10.desc: "值此摄政临朝或君主正统动摇之际，大贵族豪门与宫廷枢密派系围绕国玺、财权与行省督抚任命展开白热化倾轧，朝堂议事动辄剑拔弩张，帝国中枢政令几乎瘫痪。"
 oe_dis2.10.a: "委任皇家枢密文官与法学家执掌国玺"
 oe_dis2.10.b: "组建诸大贵族共治的高级摄政国务院"
 oe_dis2.10.c: "延请大主教与京师市政耆老入廷调停党争"
 oe_dis2.11.title: "豪门私兵压境与宫廷逼宫"
 oe_dis2.11.desc: "两大敌对权臣为争夺边疆大总督之位，竟率武装私兵进驻京郊威慑摄政议事厅。坊间盛传宫廷政变在即，全城商铺紧闭门窗，局势危如累卵。"
 oe_dis2.11.a: "下诏严禁贵族蓄养私兵并拿办为首权臣"
 oe_dis2.11.b: "令两派权臣立誓和解并分授行省荣誉职衔"
 oe_dis2.11.c: "清退贪墨宠臣并公开稽核摄政内帑账目"
 oe_dis2.12.title: "朝纲重肃：摄政风波圆满收官"
 oe_dis2.12.desc: "宫廷权臣之争终告落幕，各派显贵重申效忠王座。此刻可择定是以中枢集权彻底巩固王室权威，还是颁立宪政国务宪章以杜绝后世摄政内耗。"
 oe_dis2.12.a: "收归国玺与内阁任免权，重振中枢王室权威"
 oe_dis2.12.b: "颁署宪政贵族国务宪章以永保朝野和睦"
 oe_dis2.13.title: "黑烟与圈地：早期工业劳工动荡"
 oe_dis2.13.desc: "水力织机、大型铁厂与商业圈地狂飙突进，大批失地农民涌入工场市镇承受繁重劳役。工匠与劳工联名请愿限工保薪，而工场主则强烈要求王室护卫资本与机器产权。"
 oe_dis2.13.a: "拟定早期工场督察与最低薪资仲裁宪章"
 oe_dis2.13.b: "坚定支持工场主与圈地新产权以保工业增速"
 oe_dis2.13.c: "拨款兴办工业市镇济贫局与平价粮仓"
 oe_dis2.14.title: "捣毁织机风潮与市镇面包骚乱"
 oe_dis2.14.desc: "失业织工与饥寒劳工在两座工业重镇接连捣毁新式机械织机，市政粮仓外亦爆发抢粮骚乱。地方治安官火速遣使请示京师应如何处置。"
 oe_dis2.14.a: "补贴市镇平价面包并设立劳资行会联合仲裁庭"
 oe_dis2.14.b: "调派皇家卫戍部队进驻铁厂与纺纱工场强力镇压"
 oe_dis2.14.c: "征募失业工匠转入官营船厂与市政水利工程"
 oe_dis2.15.title: "工场新秩序：工业和解与市镇复兴"
 oe_dis2.15.desc: "市镇骚乱的硝烟散去，取而代之的是水车、炼钢炉与熙攘集市的稳健节拍。工场主、行会耆老与市政官齐聚一堂，共同敲定帝国迈向工业时代的长远制度。"
 oe_dis2.15.a: "正式颁行法定早期工业劳工保障约"
 oe_dis2.15.b: "确立以产能与创新为先的自由工场行会和解令"
 oe_dis2.16.title: "教派裂痕：多信仰帝国的宗教动荡"
 oe_dis2.16.desc: "庞大帝国境内的宗教分歧骤然激化。激进布道者痛斥朝廷姑息异端，多信仰城市纷纷结成武装教派同盟，局势直逼全面宗教战争。王座必须尽快明示宗教国策。"
 oe_dis2.16.a: "草拟信仰宽容暂行宪章，保护各教派和平礼拜"
 oe_dis2.16.b: "强化国教督察与一统法度，全力支持正统教士"
 oe_dis2.16.c: "于京师召集跨教派神学辩论与调停大会"
 oe_dis2.17.title: "行省讲坛论战与圣地冲突"
 oe_dis2.17.desc: "两支不同教派的巡游队伍在一座历史悠久的省城圣地外发生激烈肢体冲突，教堂停钟、集市罢市，教士与市民的弹劾文书雪片般飞向御前。"
 oe_dis2.17.a: "将争议圣地纳入王室中立护卫，严禁教派互斗"
 oe_dis2.17.b: "派兵护送正统教士接管圣地以彰显国教威严"
 oe_dis2.17.c: "对双方滋事首恶各罚重金以肃清地方治安"
 oe_dis2.18.title: "帝国宗教和平大宪章"
 oe_dis2.18.desc: "厌倦教派倾轧的主教、世俗领主与城市代表齐聚一堂，共议永久宗教和平方案。帝国如今可在普世宗教宽容与国教一统法典之间择一而立。"
 oe_dis2.18.a: "昭告天下，颁行永久普世宗教宽容敕令"
 oe_dis2.18.b: "批准国家教派一统法典，巩固正统信仰根基"
 oe_dis2.19.title: "列强警觉：反霸权协调暗潮涌动"
 oe_dis2.19.desc: "驻外使节密报，本国势不可挡的版图扩张已令尚存的欧亚列强深感震动。各强国宫廷正暗中协调财政信用、加速消化厌战并扩大同盟网络，以维系多极战略均势。（提示：若偏好纯粹休闲沙盒，可随时在「帝国政务」决议栏关闭 AI 列强竞争韧性。）"
 oe_dis2.19.a: "派遣特使出访列强宫廷，以均势外交缓和戒心"
 oe_dis2.19.b: "举行盛大舰队阅兵与常备军演武，以强军威慑列强"
 oe_dis2.19.c: "加固边疆星形要塞与战略军械库，深沟高垒以待变"
 oe_dis2.20.title: "大国合纵：反霸权列强总协调"
 oe_dis2.20.desc: "随着本国跨洲巨帝国的体量令任何单一对手望尘莫及，尚存列强已结成更紧密的财政与防务协调。各国枢密院互通情报、稳固战时信用并整饬军纪，决意在大国博弈中阻止一家独霸天下。"
 oe_dis2.20.a: "倡议召开大国均势会议，以外交谈判划定势力范围"
 oe_dis2.20.b: "以铁血回应合纵，全面提升海陆帝国战备威慑"
 oe_dis2.20.c: "纵深修筑边防棱堡防线并充实后备兵源库"
 oe_dis2.21.title: "列强使节来朝与战略博弈"
 oe_dis2.21.desc: "代表反霸权列强协调的特命全权使团抵京觐见，试探帝国究竟愿借通商与海事条约达成战略缓和，还是准备在争议边疆展开新一轮大国军备竞逐。"
 oe_dis2.21.a: "签署互惠海事与通商缓和条约，化敌意为商机"
 oe_dis2.21.b: "严词回绝列强试探，昭示帝国无可动摇的头等霸权"
 oe_dis2.21.c: "虚与委蛇拖延谈判，暗中增固边防要塞警戒网"
 oe_dis2.22.title: "军需贪腐案与包商丑闻"
 oe_dis2.22.desc: "巡视边防军仓的御史查获大量发霉干粮、吃空饷的虚假花名册，以及军需包商勾结度支官吏贪墨回扣的铁证。此事既关乎国库廉洁，更直接牵动前线三军士气。"
 oe_dis2.22.a: "严办贪墨军需包商并设立常设后勤肃贪法庭"
 oe_dis2.22.b: "绕过中间包商，以足色白银直接补发前线欠饷"
 oe_dis2.22.c: "将兵站补给契约转交信誉卓著的市民行会承运"
 oe_dis2.23.title: "外藩总督与中枢恩荫派系冲突"
 oe_dis2.23.desc: "远疆总督与地方议会联名弹劾京师派出的恩荫官员卖官鬻爵、中饱地方关税私囊。若放任宫廷徇私蔓延，必将同时恶化海外离心与中枢党争。"
 oe_dis2.23.a: "革职查办贪腐外放官，改派循资考绩的干练钦差"
 oe_dis2.23.b: "授权地方议会稽核总督公费并开放合法陈情渠道"
 oe_dis2.23.c: "于深宫低调弭平人事纷争以免动摇高门体面"
 oe_dis2.24.title: "报刊小册风潮与市民联合请愿"
 oe_dis2.24.desc: "各大都市的地下印书作坊广传犀利小册，呼吁确立公平工场法度、停止教派迫害并公开政务账目。市民代表联名奏请王室顺势疏导，将激荡舆论纳入合法议事厅。"
 oe_dis2.24.a: "颁行特许市民议事与规范报刊法，以疏代堵化解戾气"
 oe_dis2.24.b: "查封煽动性地下印书坊并收紧皇家出版审查"
 oe_dis2.24.c: "拨款兴办市镇义学与工匠医馆以收拢都市民心"
