 STATIC_MODIFIER_NAME_oe_s37_gal_dues: "君士坦丁堡的低关税"
 STATIC_MODIFIER_DESC_oe_s37_gal_dues: "君士坦丁堡降低了关税，过往海峡的商船不再都去加拉塔纳税，一部分改到对岸卸货。"
 STATIC_MODIFIER_NAME_oe_s37_gal_curbed: "受限的热那亚特权"
 STATIC_MODIFIER_DESC_oe_s37_gal_curbed: "加拉塔的热那亚人被迫让步，交出了一部分海关的份额，但仍是海峡上的一股势力。帝国完成改革“驱逐外夷”后，这些特权随之取消。"
 oe_s37_gal_undercut: "降低关税抢我们的生意"
 oe_s37_gal_humbled: "废除了加拉塔的特权"
 oe_s37_gal_terms: "逼加拉塔让出关税"
 oe_s37_gal_walls: "强令加拉塔拆墙让税"
 oe_s37_gal_pact: "联手对付热那亚"
 oe_s37_gal_foe: "与威尼斯结盟"
 oe_s37_gal_neutral_g: "海峡之战中保持中立"
 oe_s37_gal_neutral_v: "拒绝与我们结盟"
 oe_s37_gal_victory_v: "博斯普鲁斯的胜利"
 oe_s37_gal_victory_g: "夺走海峡的关税"
 oe_s37_gal_ports: "对威尼斯关闭港口"
 oe_s37_gal.1.t: "加拉塔的关税"
 oe_s37_gal.1.d: "加拉塔在金角湾北岸，1267年起由热那亚人居住。1303年帝国划定了居留地的边界，不许筑城，热那亚人却不断扩建城墙。过往海峡的商船大多在加拉塔纳税。格雷戈拉斯记载，约在1348年，加拉塔每年收关税约二十万海佩伦，君士坦丁堡只收约三万。1348年，约翰六世降低了君士坦丁堡的关税，商船纷纷绕开加拉塔，到对岸卸货。内战刚结束，国库空虚，皇帝向富户借了约五万海佩伦，造了九艘大船和约一百艘小船。\n\n如今，帝国的关税仍有大半落进加拉塔。大臣们建议降低君士坦丁堡的关税，把商船拉回来，同时造一支新舰队，以防热那亚人动武。"
 oe_s37_gal.1.a: "国库出钱"
 oe_s37_gal.1.a.tt: "#R −150#!金币。\n降低君士坦丁堡的关税：我们得“君士坦丁堡的低关税”（关税收入#G +10%#!，贸易优势#G +5%#!），长期有效。“加拉塔的热那亚人”（关税收入#R −25%#!，贸易优势#R −10%#!）仍在，两者合计关税收入#R −15%#!，贸易优势#R −5%#!。\n君士坦丁堡新建#Y 6#!艘传统桨帆战舰。\n热那亚对我们的好感#R −25#!（#Y 10#!年）。\n#Y 4#!到#Y 8#!个月后，加拉塔的热那亚人会作出回应。"
 oe_s37_gal.1.b: "向富户摊借"
 oe_s37_gal.1.b.tt: "贵族阶层满意度#R −10%#!，市民阶层满意度#R −10%#!，稳定度#R −2.5#!。\n降低君士坦丁堡的关税：我们得“君士坦丁堡的低关税”（关税收入#G +10%#!，贸易优势#G +5%#!），长期有效。“加拉塔的热那亚人”（关税收入#R −25%#!，贸易优势#R −10%#!）仍在，两者合计关税收入#R −15%#!，贸易优势#R −5%#!。\n君士坦丁堡新建#Y 6#!艘传统桨帆战舰。\n热那亚对我们的好感#R −25#!（#Y 10#!年）。\n#Y 4#!到#Y 8#!个月后，加拉塔的热那亚人会作出回应。"
 oe_s37_gal.1.c: "向金角湾银行借款"
 oe_s37_gal.1.c.tt: "金角湾银行借给我们#Y 150#!金币，利率#Y 4%#!，分#Y 60#!个月还清；借来的钱当即用于造船。\n降低君士坦丁堡的关税：我们得“君士坦丁堡的低关税”（关税收入#G +10%#!，贸易优势#G +5%#!），长期有效。“加拉塔的热那亚人”（关税收入#R −25%#!，贸易优势#R −10%#!）仍在，两者合计关税收入#R −15%#!，贸易优势#R −5%#!。\n君士坦丁堡新建#Y 6#!艘传统桨帆战舰。\n热那亚对我们的好感#R −25#!（#Y 10#!年）。\n#Y 4#!到#Y 8#!个月后，加拉塔的热那亚人会作出回应。"
 oe_s37_gal.1.k: "关税暂且照旧"
 oe_s37_gal.1.k.tt: "没有变化，“加拉塔的热那亚人”照旧。#Y 5#!年后大臣们会再提一次。"
 oe_s37_gal.1.k2: "关税仍然照旧"
 oe_s37_gal.1.k2.tt: "没有变化，“加拉塔的热那亚人”照旧，大臣们不再提起此事。热那亚与威尼斯开战时，还会有一次机会。"
 oe_s37_gal.2.t: "热那亚人越过金角湾"
 oe_s37_gal.2.d: "1348年，热那亚人要求谈判，约翰六世要他们先拆掉新修的工事。8月，趁皇帝去了色雷斯，加拉塔的热那亚人渡过金角湾，烧了能找到的船，攻打海墙和码头。同一年，他们在加拉塔背后的山上建成了一座高塔，当时叫基督塔，就是后来的加拉塔塔。\n\n如今，加拉塔的热那亚人也动手了。他们渡过金角湾，烧了泊在港里的船，我们损失了[GetCountry('BYZ').MakeScope.GetVariable('oe_s37_gal_lost').GetValue|0]艘战船。他们要求恢复旧日的关税，还在城后的山上加修城墙。"
 oe_s37_gal.2.a: "增造战船，开春决战"
 oe_s37_gal.2.a.tt: "#R −100#!金币。君士坦丁堡再建#Y 3#!艘传统桨帆战舰。\n#Y 5#!到#Y 7#!个月后，舰队进攻加拉塔。胜算目前为[GetCountry('BYZ').MakeScope.ScriptValue('oe_s37_gal_win_3')|0]%：基础#Y 35%#!，海军大都督军事能力至少#Y 60#!时#Y +20%#!，低于#Y 30#!时#Y −10%#!。\n胜：可以废除加拉塔的关税特权，或收下赔款、削减特权。败：损失最多#Y 6#!艘战船，海军传统#R −10#!，威望#R −10#!。"
 oe_s37_gal.2.b: "从城头轰击加拉塔"
 oe_s37_gal.2.b.tt: "#R −40#!金币。舰队留在港内，不冒风险。\n#Y 3#!到#Y 5#!个月后，热那亚人会来议和，但不会交出关税特权。"
 oe_s37_gal.2.c: "恢复旧税，与热那亚和解"
 oe_s37_gal.2.c.tt: "失去“君士坦丁堡的低关税”。热那亚因降税而起的不满（#G −25#!）消除。威望#R −10#!。\n“加拉塔的热那亚人”保持不变。热那亚与威尼斯开战时，还会有一次机会。"
 oe_s37_gal.3.t: "金角湾之战"
 oe_s37_gal.3.d1: "1349年3月，约翰六世的新舰队绕过海岬，要渡过金角湾进攻加拉塔。忽然起了大风，没有经验的水手惊慌失措，许多人跳进海里，舰队还没交战就溃散了，岸上的陆军也跟着退走。可是帝国的投石机已把加拉塔的码头和货栈烧成一片。几个星期后，热那亚派来全权使节议和：热那亚赔款十万海佩伦，退出侵占的加拉塔后山的土地，保证不再进攻君士坦丁堡；热那亚人的关税特权仍然保留。\n\n如今，我们的舰队顶住了风浪，冲进金角湾，加拉塔的码头和货栈烧成一片。热那亚的使节来求和，这一次连关税也肯谈。"
 oe_s37_gal.3.d2: "1349年3月，约翰六世的新舰队绕过海岬，要渡过金角湾进攻加拉塔。忽然起了大风，没有经验的水手惊慌失措，许多人跳进海里，舰队还没交战就溃散了，岸上的陆军也跟着退走。可是帝国的投石机已把加拉塔的码头和货栈烧成一片。几个星期后，热那亚派来全权使节议和：热那亚赔款十万海佩伦，退出侵占的加拉塔后山的土地，保证不再进攻君士坦丁堡；热那亚人的关税特权仍然保留。\n\n如今，历史重演：大风吹散了我们的舰队，[GetCountry('BYZ').MakeScope.GetVariable('oe_s37_gal_lost').GetValue|0]艘战船沉没或被俘，海军传统#R −10#!，威望#R −10#!。不过加拉塔也烧了好几个星期，热那亚的使节已经来议和。"
 oe_s37_gal.3.d: "1349年3月，约翰六世的新舰队绕过海岬，要渡过金角湾进攻加拉塔。忽然起了大风，没有经验的水手惊慌失措，许多人跳进海里，舰队还没交战就溃散了，岸上的陆军也跟着退走。可是帝国的投石机已把加拉塔的码头和货栈烧成一片。几个星期后，热那亚派来全权使节议和：热那亚赔款十万海佩伦，退出侵占的加拉塔后山的土地，保证不再进攻君士坦丁堡；热那亚人的关税特权仍然保留。\n\n如今，我们的投石机从城头轰击了几个星期，加拉塔的码头和货栈烧成一片，舰队一直留在港内。热那亚的使节来议和，但不肯谈关税。"
 oe_s37_gal.3.wa: "废除加拉塔的关税特权"
 oe_s37_gal.3.wa.tt: "失去“加拉塔的热那亚人”（关税收入#R −25%#!，贸易优势#R −10%#!）。“君士坦丁堡的低关税”保留。\n威望#G +15#!。热那亚因降税而起的不满消除，改为热那亚对我们的好感#R −40#!（#Y 20#!年）。此事到此结束。"
 oe_s37_gal.3.wb: "收下赔款，削减特权"
 oe_s37_gal.3.wb.tt: "#G +150#!金币。\n“加拉塔的热那亚人”换成“受限的热那亚特权”（关税收入#R −15%#!，贸易优势#R −5%#!）。“君士坦丁堡的低关税”保留。\n热那亚因降税而起的不满消除，改为热那亚对我们的好感#R −10#!（#Y 10#!年）。\n热那亚与威尼斯开战时，还会有一次机会。"
 oe_s37_gal.3.a: "签订和约"
 oe_s37_gal.3.a.tt: "#G +100#!金币（热那亚的赔款），热那亚人退出加拉塔后山。\n热那亚因降税而起的不满（#G −25#!）消除。“加拉塔的热那亚人”保持不变，“君士坦丁堡的低关税”保留。\n热那亚与威尼斯开战时，还会有一次机会。"
 oe_s37_gal.3.b: "不要赔款，要他们拆墙让税"
 oe_s37_gal.3.b.tt: "不收赔款。\n“加拉塔的热那亚人”换成“受限的热那亚特权”（关税收入#R −15%#!，贸易优势#R −5%#!）。“君士坦丁堡的低关税”保留。\n热那亚因降税而起的不满消除，改为热那亚对我们的好感#R −30#!（#Y 20#!年）。稳定度#R −2.5#!。\n热那亚与威尼斯开战时，还会有一次机会。"
 oe_s37_gal.4.t: "威尼斯的盟约"
 oe_s37_gal.4.d: "1350年8月，威尼斯与热那亚为争夺黑海贸易开战，威尼斯舰队攻打加拉塔，没有得手。1351年5月，约翰六世与威尼斯结盟：帝国从9月起出#Y 12#!艘桨帆船，费用的三分之二由威尼斯承担。热那亚的帕加尼诺·多里亚随即洗劫了马尔马拉海边的赫拉克利亚，11月又洗劫了黑海边的索佐波利斯。\n\n如今，威尼斯的使节来到君士坦丁堡，提议联手对付热那亚：帝国出一支舰队，威尼斯出三分之二的钱。加拉塔的热那亚人仍握着关税特权。"
 oe_s37_gal.4.a: "与威尼斯结盟"
 oe_s37_gal.4.a.tt: "#R −60#!金币（我们承担的三分之一）。君士坦丁堡新建#Y 4#!艘传统桨帆战舰。\n威尼斯对我们的好感#G +25#!（#Y 10#!年），热那亚对我们的好感#R −25#!（#Y 10#!年）。\n#Y 7#!到#Y 10#!个月后，联合舰队与热那亚舰队决战。胜算目前为[GetCountry('BYZ').MakeScope.ScriptValue('oe_s37_gal_win_5')|0]%：基础#Y 30%#!，海军大都督军事能力至少#Y 60#!时#Y +15%#!，低于#Y 30#!时#Y −10%#!，金角湾之战获胜过时#Y +10%#!。\n胜：加拉塔的关税特权全部取消。败：损失最多#Y 4#!艘战船，加拉塔的特权恢复原状。\n这场海战在事件中进行，不会正式宣战。"
 oe_s37_gal.4.b: "保持中立"
 oe_s37_gal.4.b.tt: "热那亚对我们的好感#G +10#!（#Y 5#!年），威尼斯对我们的好感#R −10#!（#Y 5#!年）。\n加拉塔的特权保持现状，此事到此结束。"
 oe_s37_gal.5.t: "博斯普鲁斯海战"
 oe_s37_gal.5.d1: "1352年2月13日，威尼斯、阿拉贡和帝国的联合舰队约九十艘，其中帝国#Y 14#!艘，在博斯普鲁斯海峡迎战多里亚的六十多艘热那亚战船。双方在风暴中打了一夜，联军损失更重，威尼斯和阿拉贡的舰队随后撤走。奥尔汗站在热那亚人一边。孤立无援的约翰六世在1352年5月6日与热那亚议和：承认热那亚人完全占有加拉塔，重申《宁菲翁条约》给他们的特权，并对威尼斯和阿拉贡的船只关闭港口。\n\n如今，联合舰队在海峡里击败了热那亚舰队。加拉塔孤立无援，只能接受我们的条件。"
 oe_s37_gal.5.d: "1352年2月13日，威尼斯、阿拉贡和帝国的联合舰队约九十艘，其中帝国#Y 14#!艘，在博斯普鲁斯海峡迎战多里亚的六十多艘热那亚战船。双方在风暴中打了一夜，联军损失更重，威尼斯和阿拉贡的舰队随后撤走。奥尔汗站在热那亚人一边。孤立无援的约翰六世在1352年5月6日与热那亚议和：承认热那亚人完全占有加拉塔，重申《宁菲翁条约》给他们的特权，并对威尼斯和阿拉贡的船只关闭港口。\n\n如今，历史重演：联合舰队在海峡里损失惨重，威尼斯人撤走了，我们损失了[GetCountry('BYZ').MakeScope.GetVariable('oe_s37_gal_lost').GetValue|0]艘战船。加拉塔的热那亚人要求我们重申他们的特权。"
 oe_s37_gal.5.wa: "收回海峡的关税"
 oe_s37_gal.5.wa.tt: "加拉塔的关税特权全部取消：失去“加拉塔的热那亚人”或“受限的热那亚特权”。“君士坦丁堡的低关税”保留。\n威望#G +15#!。威尼斯对我们的好感#G +15#!（#Y 10#!年）。热那亚因结盟而起的不满消除，改为热那亚对我们的好感#R −30#!（#Y 20#!年）。"
 oe_s37_gal.5.a: "接受热那亚的和约"
 oe_s37_gal.5.a.tt: "“加拉塔的热那亚人”（关税收入#R −25%#!，贸易优势#R −10%#!）恢复原状，“受限的热那亚特权”随之取消。“君士坦丁堡的低关税”保留。\n我们对威尼斯的船只关闭港口：威尼斯对我们的好感#R −20#!（#Y 10#!年）。热那亚因结盟而起的不满（#G −25#!）消除。"
 oe_s37_gal.5.b: "出钱保住此前争得的条件"
 oe_s37_gal.5.b.tt: "#R −200#!金币。“受限的热那亚特权”保持不变。\n我们对威尼斯的船只关闭港口：威尼斯对我们的好感#R −20#!（#Y 10#!年）。热那亚因结盟而起的不满（#G −25#!）消除。"
 oe_s37_gal.9.t: "加拉塔之争：选项生效"
