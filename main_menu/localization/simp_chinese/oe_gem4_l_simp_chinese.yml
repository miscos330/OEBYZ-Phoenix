# NEW 2026-11-23 v19.5 Regional Gems — Module 19.5-D: Morocco & Tibet Units, Decisions, Events, Modifiers & Mission Trees #54-#55 (simp_chinese) (oe_gem4_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_mor_tib.py; edit the generator, not this file.
 oe_gem4_mor_black_guard:0 "摩洛哥黑卫军（布哈里禁军）"
 oe_gem4_mor_black_guard_desc:0 "手按《布哈里圣训集》向摩洛哥苏丹立誓效忠的常备重装禁军，精熟长矛火枪协同齐射，在撒哈拉堡垒与大西洋海防攻坚战中寸步不退。"
 oe_gem4_tib_plateau_cataphracts:0 "雪域高原重装铁骑"
 oe_gem4_tib_plateau_cataphracts_desc:0 "身披札甲铁胄、跨乘耐寒高原良驹的吐蕃重装铁骑，纵横空气稀薄的雪域高隘与藏北草甸，铁蹄所向摧枯拉朽。"
 oe_gem4_dec_sijilmasa_caravan_charter.title:0 "颁布西吉尔马萨跨撒哈拉皇家金盐商队特许令"
 oe_gem4_dec_sijilmasa_caravan_charter.desc:0 "颁赐王家商队特许状，贯通非斯、马拉喀什、阿特拉斯山口与西吉尔马萨及塔加扎盐矿，在王室护卫下以大漠岩盐与马格里布织品换取西非黄金，重铸帝国铸币财源。"
 oe_gem4_dec_sijilmasa_caravan_charter.a:0 "用印颁行皇家金盐商队特许"
 oe_gem4_dec_tea_horse_accord.title:0 "颁行茶马古道大寺互市特许盟约"
 oe_gem4_dec_tea_horse_accord.desc:0 "联合乌思藏、康区与阿里诸大寺、牧主及马帮大头人共订茶马古道互市盟约，保障高原万户砖茶供给并充实雪域铁骑马政。"
 oe_gem4_dec_tea_horse_accord.a:0 "颁行雪域茶马互市盟约"
 STATIC_MODIFIER_NAME_oe_gem4_mod_dec_sijilmasa_charter:0 "西吉尔马萨皇家金盐商队特许"
 STATIC_MODIFIER_DESC_oe_gem4_mod_dec_sijilmasa_charter:0 "武装沙海护商队、阿特拉斯官秤税站与王家造币契约将西非金砂源源不断引入摩洛哥国库。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_dec_tea_horse_accord:0 "茶马古道大寺互市盟约"
 STATIC_MODIFIER_DESC_oe_gem4_mod_dec_tea_horse_accord:0 "康藏东隘大寺驿站有序统筹茶马互市，以高原骏马与牦牛绒换取源源不断的砖茶与白银，稳固雪域民生与骑军马政。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev1_a:0 "非斯经学院黄金学风"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev1_a:0 "法学家、天文学家与地理名家云集非斯，令王廷成为伊斯兰西方最耀眼的学术灯塔。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev1_b:0 "非斯王廷寰宇商图录"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev1_b:0 "详尽记载东方港市、商税与诸邦礼仪的舆图档案，令摩洛哥使节与海商洞悉万邦先机。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev2_a:0 "直布罗陀南岸铁壁防线"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev2_a:0 "重重临海石墙、烽火瞭望塔与忠勇海防戍军令海峡南岸每座海港皆成铜墙铁壁。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev2_b:0 "马格里布海峡巡航舰队"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev2_b:0 "轻捷划桨战船与大三角帆快舰频频截击敌方补给船队，将摩洛哥海上威权投射全海峡。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev3_a:0 "马格里布东征铁骑"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev3_a:0 "久经沙场的阿特拉斯铁骑与攻城工兵疾驰塔扎走廊，以雷霆之势确立摩洛哥西非正统霸权。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev3_b:0 "马格里布东境商路羁縻约"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev3_b:0 "羊毛、皮革与挂毯互市大集安定东境边陲，令诸部族长老与属藩心悦诚服归附王廷。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev4_a:0 "苏斯河谷王家精糖专营"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev4_a:0 "水渠纵横的甘蔗庄园与王家精糖工场令大西洋口岸白银滚滚而来。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev4_b:0 "以糖易炮皇家军械库"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev4_b:0 "远洋商船将整桶黑火药、青铜野炮与精良火绳枪源源卸入阿加迪尔王家军械库。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev5_a:0 "马哈赞河火药新军操典"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev5_a:0 "历经血战淬炼的火枪齐射纪律、炮兵阵地与两翼铁骑配合，锻造出近代一流强军。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev5_b:0 "三王大捷天下威望"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev5_b:0 "英格兰、法兰西与奥斯曼使节争相递交国书求好，海量贵族赎金充盈王室府库。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev6_a:0 "巴迪黄金宫绝世盛景"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev6_a:0 "恢宏华美的谢里夫皇家建筑昭告摩洛哥黄金时代降临，艺术与王权声望达于巅峰。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev6_b:0 "马赫赞金第纳尔中枢体制"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev6_b:0 "全国统一税册、成色纯正的金第纳尔与精干内阁官僚将各省牢牢系于王权中枢。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev7_a:0 "横穿撒哈拉大漠铁军"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev7_a:0 "耐旱善战的大漠火枪手与骆驼补给纵队将摩洛哥兵威直推至黄金流淌的尼日尔河弯。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev7_b:0 "跨撒哈拉黄金商驿网"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev7_b:0 "官兵护卫的绿洲水井与井然有序的黄金驼队让跨撒哈拉贸易化作源源不绝的财富之河。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev8_a:0 "布哈里皇家黑卫禁军"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev8_a:0 "常年支薪操练与对苏丹的绝对忠诚，锻造出摩洛哥最令敌胆寒的常备重装精兵。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev8_b:0 "梅克内斯卡斯巴堡垒与国仓体系"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev8_b:0 "星罗棋布的戍军卡斯巴石堡与巨型王家粮库令中央王权无惧饥馑与外患。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev9_a:0 "帕木竹巴宗本石堡新政"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev9_a:0 "直辖宗本官员与扼守河谷的悬崖石堡将雪域诸谷紧密编织为稳固统一的政体。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev9_b:0 "萨迦僧俗和谐共治"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev9_b:0 "尊崇古老教派法统既护持了浩瀚典籍传承，又维系了高原世家与属部的忠顺协力。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev10_a:0 "茶马古道官驿护商网"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev10_a:0 "修缮石阶古道、铁索渡口与沿途寺驿，令康藏东向商队运力倍增、税入绵长。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev10_b:0 "雪域王室战马牧政"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev10_b:0 "在高寒草甸严选良种繁育战马，为雪域铁骑输送耐缺氧、抗严寒的绝佳坐骑。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev11_a:0 "格鲁严明戒律与法会盛风"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev11_a:0 "清净严明的寺院戒律与拉萨大祈愿盛会令全高原信仰笃定、民心凝聚、学术精进。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev11_b:0 "雪域诸宗和合共荣"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev11_b:0 "均衡护持格鲁、萨迦、噶举与宁玛诸大教派，消弭门户之争，令雪域各谷安泰和睦。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev12_a:0 "雪域四大寺印经学术中心"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev12_a:0 "精雕桦木印版将藏历天文、藏医经典与哲学论著广传拉达克至蒙古草原的万千寺院。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev12_b:0 "卫藏青稞梯田与寺仓水利"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev12_b:0 "雪水干渠与遍布河谷的青稞粮仓令高原百姓无惧寒霜旱灾，亦为常备军提供充裕给养。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev13_a:0 "喜马拉雅高原盐粮官市"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev13_a:0 "木斯塘、吉隆与帕里诸山口官办盐粮互市，将藏北湖盐稳定化作充沛谷米与白银税赋。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev13_b:0 "高原羊绒织坊与冰川驮运帮"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev13_b:0 "御寒厚实的雪域绒织品与熟知冰川险径的驮运帮，令大军严冬行军损耗大幅下降。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev14_a:0 "古格托林西域文教复兴"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev14_a:0 "璀璨的古格壁画、铜像铸艺与西域译经事业令阿里高原声誉远播南亚与中亚。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev14_b:0 "阿里悬崖边堡与沙金官坊"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev14_b:0 "悬崖烽堡与官兵护送的河谷沙金商队令西部边陲固若金汤且财源广进。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev15_a:0 "檀越供施跨洲外交威望"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev15_a:0 "雪域使节在漠北草原、京师皇廷与喜马拉雅诸国皆获尊礼，外交回旋空间大为拓展。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev15_b:0 "草原—高原铁骑护法联军"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev15_b:0 "融合草原骑射迅捷与吐蕃札甲重装，铸就令任何强邻胆寒的高原机动重骑军团。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev16_a:0 "红山布达拉宫永恒圣堡"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev16_a:0 "凌驾云端、兼作圣殿与铁壁要塞的布达拉宫令全亚洲为之仰望敬畏。"
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev16_b:0 "甘丹颇章雪域中枢内阁"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev16_b:0 "僧俗并重的精干内阁统筹全高原财税、法度与边防，令雪域长治久安。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m1:0 "三王大捷火药军制与海峡铁壁"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m1:0 "精锐摩洛哥火枪队、黑卫重步兵与直布罗陀海防石堡粉碎一切跨海进犯之敌。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m2:0 "马格里布大一统共主"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m2:0 "自大西洋惊涛至特莱姆森、凯鲁万与突尼斯，整个马格里布尽归摩洛哥一统王旗之下。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m3:0 "巴迪黄金宫盛世与苏斯繁华"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m3:0 "马拉喀什黄金宫廷、非斯经学院与苏斯蔗糖官坊令摩洛哥文华鼎盛、富甲西域。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m4:0 "永恒极西谢里夫帝国"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m4:0 "兼控直布罗陀咽喉、一统马格里布与撒哈拉黄金大道，极西谢里夫帝国威耀千秋。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m1:0 "雪域重装铁骑与高隘石宗"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m1:0 "札甲重装高原铁骑与扼守冰川峡谷的石砌宗堡令雪域防线固若金汤。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m2:0 "卫藏康安多三区大一统"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m2:0 "卫藏、阿里、康区与安多尽归雪域一统王旗，尽控世界屋脊万千草甸与险关。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m3:0 "布达拉宫檀越外交与三大寺盛学"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m3:0 "拉萨三大寺、木刻印经院与跨洲檀越外交令雪域文教威望辉耀整个内亚。"
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m4:0 "世界屋脊永恒主权曼荼罗"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m4:0 "兼控拉萨、日喀则、托林与昌都，金顶映雪、商马连绵，世界屋脊主权千秋永固。"
 oe_gem4.1.title:0 "卡拉维因大学与伊本·白图泰归来"
 oe_gem4.1.desc:0 "历时近三十载、足迹遍及埃及、印度、爪哇与大元中国的摩洛哥大旅行家伊本·白图泰荣耀归返非斯。在卡拉维因大学与布伊纳尼亚经学院的雪松雕花庭院中，马林王朝学者群集笔录《游记》，并据其见闻重绘天下舆图。"
 oe_gem4.1.a:0 "重金资助卡拉维因学院并编纂《大游记》"
 oe_gem4.1.b:0 "将域外见闻绘成王家商贸与航海秘图"
 oe_gem4.2.title:0 "直布罗陀海峡防务：休达与丹吉尔保卫战"
 oe_gem4.2.desc:0 "直布罗陀海峡北岸战帆云集，武装舰队虎视眈眈紧盯休达、丹吉尔与得土安诸海防要港。沿海总督飞报王廷：欲守住赫拉克勒斯南柱咽喉，非广筑临海石堡即须组建疾风巡海舰队。"
 oe_gem4.2.a:0 "加固休达与丹吉尔海防石堡并增派戍军"
 oe_gem4.2.b:0 "打造疾风三桅巡海舰与海峡私掠分舰队"
 oe_gem4.3.title:0 "马林与扎扬王朝的马格里布争锋"
 oe_gem4.3.desc:0 "在自乌季达延伸至特莱姆森乃至突尼斯的肥沃走廊上，马格里布诸王朝正激烈争夺商队税关、柏柏尔部族盟约与西方伊斯兰霸主地位。朝中重臣激辩：应挥师东进夺取特莱姆森，还是以互市羁縻边部。"
 oe_gem4.3.a:0 "高举王旗东征特莱姆森，力争马格里布正统"
 oe_gem4.3.b:0 "以商路驿税协约笼络边疆柏柏尔部族"
 oe_gem4.4.title:0 "萨阿德崛起与苏斯河谷制糖热潮"
 oe_gem4.4.desc:0 "在塔鲁丹特与阿加迪尔周边的阳光苏斯河谷，石砌引水渠驱动着数十座水力蔗糖榨坊，出产的雪白精糖在伦敦与安特卫普卖出天价。萨阿德统帅建言，可直接以摩洛哥精糖换购西洋青铜火炮与火绳枪。"
 oe_gem4.4.a:0 "扩建王家苏斯精糖官坊并统征外销海税"
 oe_gem4.4.b:0 "以精糖直换火绳枪与青铜火炮，扩充火器库"
 oe_gem4.5.title:0 "三王之战：马哈赞河大捷"
 oe_gem4.5.desc:0 "在克萨尔埃尔克比尔附近的烈日原野上，远道而来的西洋大军与摩洛哥王师迎头决战。训练有素的安达卢西亚火枪手、王家青铜炮阵与包抄迂回的柏柏尔骑军合力围歼来敌，这场惊天大捷震撼了从里斯本到伊斯坦布尔的整个世界。"
 oe_gem4.5.a:0 "颁行王家火绳枪与多兵种协同作战操典"
 oe_gem4.5.b:0 "善用巨额贵族赎金与大捷声威纵横列强外交"
 oe_gem4.6.title:0 "艾哈迈德·曼苏尔的巴迪黄金宫殿"
 oe_gem4.6.desc:0 "手握大捷赎金与撒哈拉贡金，苏丹在马拉喀什营建举世无双的巴迪黄金宫殿：下沉柑橘御苑、澄碧倒影水池、以等重摩洛哥精糖换来的意大利卡拉拉大理石廊柱与流光溢彩的金箔穹顶令万邦使节目眩神迷。"
 oe_gem4.6.a:0 "穷工极丽落成巴迪黄金宫殿与皇家御苑"
 oe_gem4.6.b:0 "借兴宫之势改革马赫赞中枢官制与金第纳尔币制"
 oe_gem4.7.title:0 "横穿撒哈拉远征与尼日尔河黄金贸易"
 oe_gem4.7.desc:0 "配备轻型青铜炮、火绳枪与数千峰驮水骆驼的精锐远征军已整装待发，准备越过酷烈无垠的塔内兹鲁夫特沙海，经塔加扎盐矿直指廷巴克图与加奥。廷臣权衡：应以铁血武力直控尼日尔河弯，还是建起永固的撒哈拉商队联盟。"
 oe_gem4.7.a:0 "挥师横穿大漠，以火枪炮队控制塔加扎与廷巴克图"
 oe_gem4.7.b:0 "沿沙海绿洲兴筑官办商驿与黄金行会通道"
 oe_gem4.8.title:0 "梅克内斯黑卫禁军与大一统王权"
 oe_gem4.8.desc:0 "在梅克内斯巍峨的拱顶王家粮仓、宏阔御马厩与绵延数十里的夯土城垣之后，一支只效忠苏丹本人的常备皇家精锐——布哈里黑卫军正式成军。这支铁纪严明的禁军将终结地方割据，并以坚城火炮护卫摩洛哥全域海疆。"
 oe_gem4.8.a:0 "扩编操练常备布哈里黑卫禁军，威慑四方"
 oe_gem4.8.b:0 "大筑全国卡斯巴堡垒网与梅克内斯巨型王家粮仓"
 oe_gem4.9.title:0 "萨迦摄政与帕木竹巴宗本改制"
 oe_gem4.9.desc:0 "随着东岭之外的遥远羁縻日渐松弛，帕木竹巴等雪域实权领主主张革除分散万户旧制，在卫藏全域广设石砌宗堡与直辖宗本，复兴吐蕃古法与本土主权；而萨迦诸大寺则呼吁稳妥维持僧俗共治传统。"
 oe_gem4.9.a:0 "推行宗本石堡行政与吐蕃古法改制"
 oe_gem4.9.b:0 "维护萨迦大寺与诸部贵族的僧俗共治旧盟"
 oe_gem4.10.title:0 "横断山巅的茶马古道商帮"
 oe_gem4.10.desc:0 "翻越横跨怒江与金沙江的溜索险桥与积雪盘道，绵延不绝的牦牛与骡马商帮将昌都、理塘与巴塘的良马、麝香运往川滇河谷，换回雪域万户不可或缺的紧压砖茶。"
 oe_gem4.10.a:0 "沿东境险隘设官办茶马驿站与护商税关"
 oe_gem4.10.b:0 "精选高原良驹充实王室重骑马政与牧场"
 oe_gem4.11.title:0 "宗喀巴大师宗教革新与大祈愿法会"
 oe_gem4.11.desc:0 "在拉萨千年大昭寺内，雪域宗师宗喀巴大师首创传昭大祈愿法会，并于拉萨河谷阳坡兴建甘丹寺，重振严明戒律、因明辩经与博学修行之风，席卷全藏的格鲁革新由此开启。"
 oe_gem4.11.a:0 "大兴拉萨传昭法会，大力护持格鲁戒律革新"
 oe_gem4.11.b:0 "兼弘诸宗，缔结雪域各教派和谐共荣盟约"
 oe_gem4.12.title:0 "拉萨三大寺与日喀则扎什伦布寺"
 oe_gem4.12.desc:0 "哲蚌寺、色拉寺与日喀则扎什伦布寺白墙金顶连绵成片，汇集数以万计学僧、木刻印经院、藏医学院与高原粮仓。诸大寺堪布恭请王廷决断：是扩建印经辩经大院，还是联动寺产兴修卫藏河谷灌渠。"
 oe_gem4.12.a:0 "扩建大寺木刻印经院与因明医学高等学院"
 oe_gem4.12.b:0 "联动大寺官仓兴修卫藏青稞梯田与雪水干渠"
 oe_gem4.13.title:0 "藏北盐湖与喜马拉雅牦牛绒商帮"
 oe_gem4.13.desc:0 "每逢春融，藏北牧民采撷高原盐湖晶莹雪盐、梳理细腻羊绒与牦牛绒，赶着牦牛帮翻越喜马拉雅冰川山口，前往尼泊尔与克什米尔换取红铜、细布与谷粮。"
 oe_gem4.13.a:0 "设立喜马拉雅山口盐粮官市与统一衡器"
 oe_gem4.13.b:0 "编组高原牧民绒织行会与冰川山口驮运队"
 oe_gem4.14.title:0 "古格王朝与阿里西域净土"
 oe_gem4.14.desc:0 "屹立在象泉河赭红悬崖之上的托林寺与札达古格王城，扼守阿里淘金河谷与通往克什米尔的商道，殿宇内融合吐蕃、克什米尔与印度画风的璀璨壁画照耀着高原西陲。"
 oe_gem4.14.a:0 "兴修托林寺与札达王城壁画艺苑及译经堂"
 oe_gem4.14.b:0 "加固阿里西陲险关并护送象泉河沙金商队"
 oe_gem4.15.title:0 "檀越供施：通使草原与中原王朝"
 oe_gem4.15.desc:0 "北境草原诸汗与东方中原皇廷纷纷遣使献上锦帛重礼，愿依雪域古老的“檀越供施”之谊延请高僧弘法并缔结盟好。精妙的外交布局既能将雪域精神威望化作跨洲强援，亦能引入草原精骑卫护高原。"
 oe_gem4.15.a:0 "缔结跨洲檀越供施外交盟约，广结强援"
 oe_gem4.15.b:0 "延揽草原盟军精骑共组雪域高原铁骑联军"
 oe_gem4.16.title:0 "布达拉宫落成：雪域之巅的永恒王冠"
 oe_gem4.16.desc:0 "在俯瞰拉萨河谷的红山之巅，来自卫藏、康区与阿里的万千石匠、画师与木作名匠协力筑起十三层巍峨壮丽的布达拉白宫与红宫。金顶映雪、石壁凌云，雪域政教合一的最高中枢与不朽丰碑自此屹立世界屋脊。"
 oe_gem4.16.a:0 "巍峨落成布达拉白宫红宫，铸就雪域永恒圣堡"
 oe_gem4.16.b:0 "确立甘丹颇章内阁政制，统理雪域全域政务"
 oe_msn_mor_destiny:0 "#bold #color_yellow 摩洛哥：极西谢里夫帝国天命#!#!"
 oe_msn_mor_destiny_DESCRIPTION:0 "自卡拉维因学府与直布罗陀海防石堡，迈向马格里布一统、苏斯精糖火器、廷巴克图黄金商道与极西谢里夫帝国霸业"
 oe_msn_mor_destiny_CRITERIA_DESCRIPTION:0 "稳固非斯与马拉喀什双都，铁壁固守休达、丹吉尔与萨累海防，东统特莱姆森与突尼斯，掌握西吉尔马萨及通往廷巴克图的撒哈拉黄金商路，加冕傲视大西洋与马格里布的极西谢里夫火药帝国。"
 oe_msn_mor_destiny_BUTTON_TOOLTIP:0 "开启摩洛哥极西谢里夫天命之路"
 oe_msn_mor_destiny_BUTTON_DETAILS:0 "专为摩洛哥与非斯打造的十二任务三支柱天命链：固守直布罗陀海峡石堡，编练三王之战火药精兵与萨累大西洋巡海舰队；统御阿特拉斯要塞、西吉尔马萨、特莱姆森、突尼斯与廷巴克图黄金通道；依托苏斯精糖官坊、撒哈拉铸币厂与巴迪黄金宫殿铸就极西盛世。"
 oe_msn_mor_01_qarawiyyin_fez:0 "卡拉维因大学与非斯经学院群"
 oe_msn_mor_01_qarawiyyin_fez_desc:0 "稳固非斯古都根基，大力资助卡拉维因大学与马林经学院群，重振伊斯兰西方文教中心。"
 oe_msn_mor_01_qarawiyyin_fez_req_tt:0 "直接或通过属国控制非斯，且稳定度至少为 5。"
 oe_msn_mor_02_strait_bastions:0 "直布罗陀咽喉：休达与丹吉尔海防石堡"
 oe_msn_mor_02_strait_bastions_desc:0 "重兵固守并筑垒强化休达与丹吉尔双海门，牢牢锁住直布罗陀海峡南岸咽喉。"
 oe_msn_mor_02_strait_bastions_req_tt:0 "直接或通过属国同时控制休达与丹吉尔，且稳定度至少为 8。"
 oe_msn_mor_03_three_kings_arsenal:0 "三王之战与摩洛哥近代火药军阵"
 oe_msn_mor_03_three_kings_arsenal_desc:0 "在克萨尔埃尔克比尔与马拉喀什整训长矛火枪步兵与青铜炮阵，铸就令列强敬畏的近代火药王师。"
 oe_msn_mor_03_three_kings_arsenal_req_tt:0 "直接或通过属国控制克萨尔埃尔克比尔与马拉喀什、稳定度至少 12，且处于地理大发现时代或之后。"
 oe_msn_mor_04_atlantic_corsairs:0 "萨累舰队与大西洋巡海防线"
 oe_msn_mor_04_atlantic_corsairs_desc:0 "将萨累与拉巴特河口双港打造成威震大西洋的远洋海军与巡航舰队基地，护卫万里海疆。"
 oe_msn_mor_04_atlantic_corsairs_req_tt:0 "直接或通过属国控制萨累与拉巴特、拥有港口且持有至少 260 金币，且处于宗教改革时代或之后。"
 oe_msn_mor_05_atlas_sijilmasa:0 "阿特拉斯险隘与西吉尔马萨黄金大道"
 oe_msn_mor_05_atlas_sijilmasa_desc:0 "将马拉喀什与大漠商道北端枢纽西吉尔马萨纳入同一王家税关，尽控撒哈拉北口黄金商路。"
 oe_msn_mor_05_atlas_sijilmasa_req_tt:0 "直接或通过属国同时控制马拉喀什与西吉尔马萨。"
 oe_msn_mor_06_tlemcen_maghreb:0 "克复特莱姆森与中部马格里布"
 oe_msn_mor_06_tlemcen_maghreb_desc:0 "挥师东进掌控名城特莱姆森以及奥兰或阿尔及尔良港，奠定马格里布中部一统大局。"
 oe_msn_mor_06_tlemcen_maghreb_req_tt:0 "直接或通过属国控制特莱姆森，并控制奥兰或阿尔及尔之一。"
 oe_msn_mor_07_tunis_ifriqiya:0 "马格里布大一统：突尼斯与凯鲁万"
 oe_msn_mor_07_tunis_ifriqiya_desc:0 "将圣城凯鲁万与地中海巨港突尼斯收入麾下，重现纵贯全北非西部的马格里布大一统霸业。"
 oe_msn_mor_07_tunis_ifriqiya_req_tt:0 "直接或通过属国控制突尼斯与凯鲁万，且直辖与属国合计拥有至少 65 个地区。"
 oe_msn_mor_08_timbuktu_expedition:0 "跨撒哈拉远征：塔加扎与廷巴克图"
 oe_msn_mor_08_timbuktu_expedition_desc:0 "跨越塔加扎大漠盐矿直抵尼日尔河畔的廷巴克图或加奥，将撒哈拉南北金盐命脉尽归王廷。"
 oe_msn_mor_08_timbuktu_expedition_req_tt:0 "直接或通过属国控制塔加扎及廷巴克图或加奥之一，且处于地理大发现时代或之后。"
 oe_msn_mor_09_sous_sugar_arsenals:0 "萨阿德苏斯精糖官坊与军械库"
 oe_msn_mor_09_sous_sugar_arsenals_desc:0 "依托塔鲁丹特与阿加迪尔肥沃的苏斯河谷广建水力精糖官坊，以蔗糖厚利滋养近代军械库。"
 oe_msn_mor_09_sous_sugar_arsenals_req_tt:0 "直接或通过属国控制塔鲁丹特与阿加迪尔，且持有至少 200 金币。"
 oe_msn_mor_10_gold_caravan_mints:0 "撒哈拉皇家铸币与金第纳尔本位"
 oe_msn_mor_10_gold_caravan_mints_desc:0 "以西吉尔马萨源源运抵的沙金铸造高纯度摩洛哥金第纳尔，令地中海与大西洋万商争相奉为通货。"
 oe_msn_mor_10_gold_caravan_mints_req_tt:0 "直接或通过属国控制西吉尔马萨且持有至少 280 金币，且处于文艺复兴时代或之后。"
 oe_msn_mor_11_el_badi_golden_court:0 "巴迪黄金宫与梅克内斯皇家都城"
 oe_msn_mor_11_el_badi_golden_court_desc:0 "在马拉喀什与梅克内斯落成大理石黄金宫廷、皇家藏书馆与巨型国仓，尽显大国气象。"
 oe_msn_mor_11_el_badi_golden_court_req_tt:0 "直接或通过属国控制马拉喀什与梅克内斯、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_mor_12_sheriffian_empire_far_west:0 "极西谢里夫帝国：千秋永耀"
 oe_msn_mor_12_sheriffian_empire_far_west_desc:0 "以不败火器雄师、大西洋舰队与黄金商贸兼控非斯、马拉喀什、特莱姆森与西吉尔马萨，加冕极西谢里夫不朽帝国。"
 oe_msn_mor_12_sheriffian_empire_far_west_req_tt:0 "直接或通过属国同时控制非斯、马拉喀什、特莱姆森与西吉尔马萨、稳定度至少 18，且处于专制时代或之后。"
 oe_msn_tib_destiny:0 "#bold #color_yellow 吐蕃雪域：世界屋脊主权曼荼罗天命#!#!"
 oe_msn_tib_destiny_DESCRIPTION:0 "自萨迦、拉萨与古格盐隘出发，贯通茶马古道、兴建格鲁三大寺、整编雪域重装铁骑，加冕世界屋脊永恒主权曼荼罗"
 oe_msn_tib_destiny_CRITERIA_DESCRIPTION:0 "统合卫藏、阿里古格、康区与安多三大高原版图，编练雪域高原重装铁骑与悬崖宗堡，掌御茶马古道与喜马拉雅盐路，于红山布达拉宫加冕世界屋脊永恒主权。"
 oe_msn_tib_destiny_BUTTON_TOOLTIP:0 "开启吐蕃雪域世界屋脊天命之路"
 oe_msn_tib_destiny_BUTTON_DETAILS:0 "专为吐蕃与古格打造的十二任务三支柱天命链：固守雅砻与江孜高隘宗堡并编练雪域高原重装铁骑；统合拉萨、日喀则、萨迦、托林、昌都与安多草甸；统筹茶马古道互市、格鲁三大寺文教与布达拉宫檀越外交，铸就屹立云巅的雪域主权帝国。"
 oe_msn_tib_01_sakya_lhasa_seat:0 "萨迦至拉萨法座与大昭寺圣坛"
 oe_msn_tib_01_sakya_lhasa_seat_desc:0 "在萨迦、拉萨大昭寺或托林稳固雪域政教中枢，开启高原复兴大业。"
 oe_msn_tib_01_sakya_lhasa_seat_req_tt:0 "直接或通过属国控制萨迦、拉萨或托林之一，且稳定度至少为 5。"
 oe_msn_tib_02_yarlung_dzongs:0 "雅砻河谷与江孜悬崖石宗"
 oe_msn_tib_02_yarlung_dzongs_desc:0 "加固乃东与江孜扼守交通要冲的悬崖宗堡，卫护卫藏腹地古老河谷。"
 oe_msn_tib_02_yarlung_dzongs_req_tt:0 "直接或通过属国控制江孜与乃东，且稳定度至少为 8。"
 oe_msn_tib_03_plateau_cataphracts:0 "整编雪域高原重装铁骑军团"
 oe_msn_tib_03_plateau_cataphracts_desc:0 "以精铁札甲与耐寒高原战马装备雪域骑兵，锻造傲视高寒沙场的重装铁骑军团。"
 oe_msn_tib_03_plateau_cataphracts_req_tt:0 "持有至少 200 金币、稳定度至少 12，且处于文艺复兴时代或之后。"
 oe_msn_tib_04_potala_citadel_watch:0 "布达拉圣堡与帕里南境雪关"
 oe_msn_tib_04_potala_citadel_watch_desc:0 "筑就拉萨红山布达拉巍峨圣堡，同时重兵封控帕里南向险关，令高原门户安如磐石。"
 oe_msn_tib_04_potala_citadel_watch_req_tt:0 "直接或通过属国控制拉萨与帕里、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_tib_05_utsang_grain_terraces:0 "卫藏一统与日喀则高原青稞梯田"
 oe_msn_tib_05_utsang_grain_terraces_desc:0 "沿雅鲁藏布江河谷统合拉萨、日喀则与萨迦，广辟高原青稞梯田并充实雪域粮仓。"
 oe_msn_tib_05_utsang_grain_terraces_req_tt:0 "直接或通过属国同时控制拉萨、日喀则与萨迦。"
 oe_msn_tib_06_guge_salt_passes:0 "古格阿里与西喜马拉雅盐商险隘"
 oe_msn_tib_06_guge_salt_passes_desc:0 "稳控阿里古格托林以及普兰或列城，将西喜马拉雅盐湖商道与克什米尔山口纳入王庭。"
 oe_msn_tib_06_guge_salt_passes_req_tt:0 "直接或通过属国控制托林，并控制普兰或列城之一。"
 oe_msn_tib_07_kham_tea_horse_passes:0 "康区门户与横断山茶马险隘"
 oe_msn_tib_07_kham_tea_horse_passes_desc:0 "掌握昌都及巴塘、理塘或打箭炉之一，尽控康区横断山江谷与茶马咽喉。"
 oe_msn_tib_07_kham_tea_horse_passes_req_tt:0 "直接或通过属国控制昌都，并控制巴塘、理塘或打箭炉之一。"
 oe_msn_tib_08_amdo_three_provinces:0 "安多牧场与雪域三区大一统"
 oe_msn_tib_08_amdo_three_provinces_desc:0 "将恰卜恰以及玉树或囊谦高原牧场收归王旗，成就卫藏、康区与安多三区大一统。"
 oe_msn_tib_08_amdo_three_provinces_req_tt:0 "控制恰卜恰、控制玉树或囊谦之一、直辖与属国合计至少 45 个地区，且处于地理大发现时代或之后。"
 oe_msn_tib_09_chama_gudao_corridor:0 "茶马古道跨高原商贸动脉"
 oe_msn_tib_09_chama_gudao_corridor_desc:0 "沿古道广设茶马驿站、牦牛驮运帮与官市特许，将川滇砖茶与高原马绒贸易连成繁荣动脉。"
 oe_msn_tib_09_chama_gudao_corridor_req_tt:0 "持有至少 200 金币，且直接或通过属国控制拉萨、昌都或托林之一。"
 oe_msn_tib_10_gelug_three_academies:0 "格鲁革新与拉萨三大寺高等学府"
 oe_msn_tib_10_gelug_three_academies_desc:0 "大力兴办甘丹、哲蚌与色拉三大寺学府及印经院，使拉萨成为内亚最负盛名的雪域学术圣地。"
 oe_msn_tib_10_gelug_three_academies_req_tt:0 "直接或通过属国控制拉萨、稳定度至少 12，且处于文艺复兴时代或之后。"
 oe_msn_tib_11_patron_priest_diplomacy:0 "布达拉宫檀越外交与内亚尊荣"
 oe_msn_tib_11_patron_priest_diplomacy_desc:0 "依托拉萨与日喀则双圣城威望，以“檀越供施”使团纵横草原、中原与喜马拉雅诸邦。"
 oe_msn_tib_11_patron_priest_diplomacy_req_tt:0 "直接或通过属国控制拉萨与日喀则、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_tib_12_roof_of_world_mandala:0 "世界屋脊：永恒主权曼荼罗"
 oe_msn_tib_12_roof_of_world_mandala_desc:0 "兼控拉萨、日喀则、托林与昌都，铁骑护法、茶马通衢、圣殿凌云，成就世界屋脊永恒主权曼荼罗。"
 oe_msn_tib_12_roof_of_world_mandala_req_tt:0 "直接或通过属国同时控制拉萨、日喀则、托林与昌都、稳定度至少 18，且处于专制时代或之后。"
