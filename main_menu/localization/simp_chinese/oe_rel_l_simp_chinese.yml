# NEW 2026-11-21 v9.6 Module 2: Native Religion Depth (oe_rel_). Generated by gen_v96_religion.py.
 oe_rel_hesychasm_tenet:0 "正教神学与普世教务路线"
 oe_rel_hesychasm_tenet_desc:0 "确立自主教会内部主导神学与对外教务方针，在静修主义正统、东西普世对话、阿索斯苦行隐修与帝国学院人文神学之间抉择正教文明走向。"
 oe_rel_rus_church_property_tenet:0 "罗斯教会修院田产与仪轨律"
 oe_rel_rus_church_property_tenet_desc:0 "裁定罗斯正教会修道院地产归属与礼仪正典的重大路线，涵盖约瑟夫拥产派、伏尔加河外非拥产派、尼康礼仪革新与旧礼仪派宽容屯垦协定。"
 oe_rel_hesychast_orthodoxy:0 "静修主义·帕拉马斯正统"
 oe_rel_hesychast_orthodoxy_desc:0 "秉承格里高利·帕拉马斯与君士坦丁堡大公会议正统教义，以静修灵性护持东正教信仰纯洁，凝聚牧首与修院向心力。"
 oe_rel_unionist_dialogue:0 "普世合一调和派"
 oe_rel_unionist_dialogue_desc:0 "仿效东西教会神学对话传统，以务实调和姿态缓和拉丁与正教隔阂，换取更广阔的欧陆外交声誉与异端宽容。"
 oe_rel_athonite_asceticism:0 "阿索斯圣山隐修苦行派"
 oe_rel_athonite_asceticism_desc:0 "依托阿索斯圣山及巴尔干—罗斯修院网络弘扬清修苦行，以坚毅教化凝聚民心、平抑战祸疲劳并加速教区归化。"
 oe_rel_imperial_humanism:0 "帝国学院人文神学派"
 oe_rel_imperial_humanism_desc:0 "融汇古典希腊哲学与正教博学传统，兴办君士坦丁堡与大城书院，推动全民识字、文化传承与学术革新。"
 oe_rel_josephite_possessors:0 "约瑟夫派·修院拥产派"
 oe_rel_josephite_possessors_desc:0 "采纳沃洛科拉姆斯克的约瑟夫主张：承认修道院拥有广大田产与慈善财力，换取教会全力拥护大公与沙皇的神圣皇权。"
 oe_rel_non_possessors:0 "非拥产派·伏尔加河外长老"
 oe_rel_non_possessors_desc:0 "践行索拉的尼尔清贫遗训：限制修院兼并农奴田庄，将教会精力转向抄经讲学、济贫扶弱与提升民间识字。"
 oe_rel_nikonian_reform:0 "尼康礼仪希腊化革新"
 oe_rel_nikonian_reform_desc:0 "校订罗斯经卷礼仪以全面对齐希腊正典，显著抬升正教普世领袖地位与外交威望，但也在国内引发守旧派的不安与阵痛。"
 oe_rel_old_believer_accord:0 "旧礼仪派宽容与边疆屯垦协定"
 oe_rel_old_believer_accord_desc:0 "以宽容协定化解礼仪裂痕，允许旧礼仪派商帮与村社在乌拉尔与西伯利亚自由垦殖经商，化宗教分歧为边疆繁荣动力。"
 oe_rel_sanjiao_synthesis_law:0 "三教义理弘化律"
 oe_rel_sanjiao_synthesis_law_desc:0 "确立三教与大乘宗派的当代弘法重心，可在程朱礼教格物、全真清修济世与禅净双修普度之间借三教殿前论道予以宣诏施行。"
 oe_rel_vajrayana_patronage_law:0 "藏传密教帝师护法律"
 oe_rel_vajrayana_patronage_law_desc:0 "确立藏传密教宗派护持朝廷与僧俗法统的仪轨重心，涵盖萨迦帝师法统、格鲁戒律整肃与噶举护法金刚三大传承。"
 oe_rel_neo_confucian_ritual:0 "程朱礼教格物"
 oe_rel_neo_confucian_ritual_desc:0 "以程朱理学格物致知、正心诚意为宗，兴崇书院科举与礼法秩序，厚植皇权正统与内阁理政效能。"
 oe_rel_quanzhen_harmony:0 "全真清修济世"
 oe_rel_quanzhen_harmony_desc:0 "发扬全真道三教圆融、清静无为而济世安民的宗旨，降低国政稳度损耗、滋养民生繁荣并宽待异流。"
 oe_rel_chan_pureland_synthesis:0 "禅净双修普度"
 oe_rel_chan_pureland_synthesis_desc:0 "融汇禅宗顿悟与净土悲愿，普度战乱黎民、抚平厌战困苦并滋养东亚佛门艺文传统。"
 oe_rel_sakya_imperial_preceptor:0 "萨迦帝师法统"
 oe_rel_sakya_imperial_preceptor_desc:0 "承续八思巴帝师与宣政院政教互护旧章，借佛门金印广结诸藩善缘，显著提升外交声誉、威望与多元信仰容忍。"
 oe_rel_gelug_monastic_discipline:0 "格鲁戒律整肃"
 oe_rel_gelug_monastic_discipline_desc:0 "重申显密兼修与严明戒律，兴建大寺学经院以大幅拔高僧侣学养、巩固国内稳度并积蓄善业。"
 oe_rel_kagyu_tantric_protectors:0 "噶举护法金刚"
 oe_rel_kagyu_tantric_protectors_desc:0 "以雪域护法金刚仪轨加持关隘将士，激发高原与边疆守军昂扬斗志，稳固城防并缓解持久征战疲惫。"
 oe_rel_imperial_religious_policy:0 "中华与大元多教共治宣政律"
 oe_rel_imperial_religious_policy_desc:0 "统筹朝廷对儒释道三教、藏传宣政院佛事、回回司天监色目学者与度牒税赋的根本教务国策，决定帝国文教、科研与多教共治走向。"
 oe_rel_policy_sanjiao_balance:0 "三教鼎立·以儒治世"
 oe_rel_policy_sanjiao_balance_desc:0 "秉持儒家经世礼法为纲、释道辅翼教化为用，稳固天命正统、扩充士林识字上限并提高内阁行政效率。"
 oe_rel_policy_xuanzheng_lama:0 "宣政院帝师·佛事护国"
 oe_rel_policy_xuanzheng_lama_desc:0 "尊崇宣政院与藏传帝师法统，以佛事护国怀柔雪域、蒙古与西域诸藩，广布异教宽容与教士向心。"
 oe_rel_policy_hui_astronomers:0 "回回司天监与色目经师"
 oe_rel_policy_hui_astronomers_desc:0 "广纳西域历算、舆地与医药名家入主回回司天监与太史院，加速学术研创、畅通陆海丝路外贸并包容回回社群。"
 oe_rel_policy_orthodox_confucian_strict:0 "崇儒抑佛·整顿度牒"
 oe_rel_policy_orthodox_confucian_strict_desc:0 "严核寺观度牒、清查免税僧田，大幅压缩僧侣阶层权势并将省余田赋归入国家正税，笃守本教礼法。"
 STATIC_MODIFIER_NAME_oe_rel_synod_palamas_orthodoxy:0 "大公会议·帕拉马斯正统"
 STATIC_MODIFIER_DESC_oe_rel_synod_palamas_orthodoxy:0 "大公会议重申帕拉马斯神学正典，教区上下同心护教，稳定治理更趋顺遂。"
 STATIC_MODIFIER_NAME_oe_rel_synod_charity_relief:0 "大公会议·跨教区联合赈济"
 STATIC_MODIFIER_DESC_oe_rel_synod_charity_relief:0 "诸教区合资兴办善堂与战后赈济，抚慰伤痍黎民，促进各地休养生息。"
 STATIC_MODIFIER_NAME_oe_rel_synod_patriarchal_order:0 "大公会议·牧首辖区整饬"
 STATIC_MODIFIER_DESC_oe_rel_synod_patriarchal_order:0 "整肃牧首辖区教务律例，理顺神职晋升与教产监督，皇权与教会相得益彰。"
 STATIC_MODIFIER_NAME_oe_rel_athonite_patronage:0 "阿索斯圣山修院护持"
 STATIC_MODIFIER_DESC_oe_rel_athonite_patronage:0 "朝廷敕赐阿索斯圣山诸修道院金帛与抄经经费，正教神学与古典典籍在帝国上下广为传习。"
 STATIC_MODIFIER_NAME_oe_rel_athos_sanctuary_loc:0 "圣山金诏兴修"
 STATIC_MODIFIER_DESC_oe_rel_athos_sanctuary_loc:0 "皇帝亲颁金诏庇护阿索斯圣山修院群，朝圣香火与抄书作坊日臻兴盛。"
 STATIC_MODIFIER_NAME_oe_rel_sobornost_harmony:0 "罗斯教会共融和解"
 STATIC_MODIFIER_DESC_oe_rel_sobornost_harmony:0 "通过公议调停平抑拥产、非拥产与礼仪之争，罗斯教士与乡民重归和睦。"
 STATIC_MODIFIER_NAME_oe_rel_debate_confucian_court:0 "殿前论道·崇儒正气"
 STATIC_MODIFIER_DESC_oe_rel_debate_confucian_court:0 "朝廷采纳儒家经世良策，百官恪守礼法，内阁理政与天命正统双双增辉。"
 STATIC_MODIFIER_NAME_oe_rel_debate_daoist_court:0 "殿前论道·清静和谐"
 STATIC_MODIFIER_DESC_oe_rel_debate_daoist_court:0 "朝廷尚简安民，效法全真清静之道，省刑薄敛而天下渐趋富庶安康。"
 STATIC_MODIFIER_NAME_oe_rel_debate_buddhist_court:0 "殿前论道·慈悲息兵"
 STATIC_MODIFIER_DESC_oe_rel_debate_buddhist_court:0 "朝廷布施修福、宽恤黎元，战乱创伤迅速平复，户口生息日渐繁茂。"
 STATIC_MODIFIER_NAME_oe_rel_preceptor_blessing:0 "敕封帝师·法轮护国"
 STATIC_MODIFIER_DESC_oe_rel_preceptor_blessing:0 "雪域高僧奉诏灌顶诵经，朝廷威望远播高原草原，藏蒙附庸益加敬服。"
 STATIC_MODIFIER_NAME_oe_rel_hui_observatory_buff:0 "回回司天监历算增辉"
 STATIC_MODIFIER_DESC_oe_rel_hui_observatory_buff:0 "礼聘入朝的回回经师与天文历算名家主持编历译书，显著推动国家学术研创与识字提升。"
 oe_rel_convene_ecumenical_synod:0 "召开普世大公会议"
 oe_rel_convene_ecumenical_synod_desc:0 "汇聚各自主教区大主教与神学家共议教典、赈济与教务整饬，为正教帝国确立十年护教方略。"
 oe_rel_convene_ecumenical_synod_past:0 "召开了普世大公会议，议定正教十年教务方略。"
 oe_rel_sponsor_athonite_monasteries:0 "护持阿索斯圣山修院"
 oe_rel_sponsor_athonite_monasteries_desc:0 "颁赐金诏与香火经费资助阿索斯圣山二十大修道院，提升全民识字、宗教影响力与文化传承；若直辖圣山还将泽及本地。"
 oe_rel_sponsor_athonite_monasteries_past:0 "颁赐金诏护持阿索斯圣山诸修道院。"
 oe_rel_commission_imperial_icon:0 "敕绘帝国神圣圣像"
 oe_rel_commission_imperial_icon_desc:0 "召请宫廷圣像画师在首都精绘一幅高品质正教神圣圣像并供奉于主座堂，持续充实帝国圣像珍藏（无需任何拓展包）。"
 oe_rel_commission_imperial_icon_past:0 "在首都敕绘并供奉了一幅崭新的帝国神圣圣像。"
 oe_rel_mediate_rus_schism:0 "调停罗斯教会派系之争"
 oe_rel_mediate_rus_schism_desc:0 "召集罗斯诸教区主教与长老会商，化解约瑟夫派、非拥产派或旧礼仪派摩擦，安抚教士与乡民并巩固正教共融。"
 oe_rel_mediate_rus_schism_past:0 "主持公议调停了罗斯教会内部的派系之争。"
 oe_rel_sanjiao_grand_debate:0 "召开三教殿前论道"
 oe_rel_sanjiao_grand_debate_desc:0 "召请大儒、全真高道与禅净高僧于殿前讲论义理，择定未来十年朝廷文教风尚，同步调整正气、和谐或业力并确立所属宗派弘化律法。"
 oe_rel_sanjiao_grand_debate_past:0 "主持了三教殿前论道，颁行新订朝廷与宗派文教风尚。"
 oe_rel_imperial_preceptor_blessing:0 "敕封帝师·法轮灌顶"
 oe_rel_imperial_preceptor_blessing_desc:0 "礼请雪域高僧举行灌顶护国法会，提升帝国威望、异教容忍与藏蒙附庸忠诚，并确立藏传密教宗派护法律法。"
 oe_rel_imperial_preceptor_blessing_past:0 "举行了敕封帝师灌顶大典，泽被雪域与草原诸藩。"
 oe_rel_hui_academy_patronage:0 "礼聘回回经师与司天历算家"
 oe_rel_hui_academy_patronage_desc:0 "礼聘精通天文历算与经学的逊尼派回回学者入朝供职（原生回回经师身份），并赐予十年回回司天监科研识字增益。"
 oe_rel_hui_academy_patronage_past:0 "礼聘了一位学识渊博的回回经师入朝主持司天监与译书事务。"
 oe_rel_preceptor_tibet_link_tt:0 "笃信藏传佛教，拥有大元/中华法统，或本人/附庸/盟友控制拉萨或萨迦"
 oe_rel_hui_patronage_allow_tt:0 "拥有大元/中华/大明法统、笃信腾格里，或已施行回回司天监与色目经师国策"
 oe_asp_miaphysite_alexandrian_synod:0 "亚历山大教父共融"
 oe_asp_miaphysite_alexandrian_synod_desc:0 "重温亚历山大教父神学遗产，在东方正统与东正世界之间架设对话桥梁，提升外交声誉与民间识字。"
 oe_asp_miaphysite_solomonic_covenant:0 "所罗门约柜护国盟约"
 oe_asp_miaphysite_solomonic_covenant_desc:0 "奉约柜与先王盟约为王室神圣基石，强化皇权正统并激励高原军民死守山河要隘。"
 oe_asp_miaphysite_armenian_craft_guilds:0 "亚美尼亚工匠与商帮同业"
 oe_asp_miaphysite_armenian_craft_guilds_desc:0 "依托教会庇护下的跨欧亚工匠行会与银钱商号网络，大幅提升外贸出口与手工业产效。"
 oe_asp_miaphysite_desert_hermits:0 "旷野隐修士苦行传统"
 oe_asp_miaphysite_desert_hermits_desc:0 "秉承埃及与努比亚旷野隐修士坚忍克己的古老修道传统，稳固国本并令深入荒漠的来犯之敌倍受消耗。"
 oe_asp_tengri_eternal_yassa:0 "长生天永恒大札撒"
 oe_asp_tengri_eternal_yassa_desc:0 "以长生天之名重申大札撒军法与汗廷权威，全面激扬轻重铁骑战力并凝聚草原汗国团结。"
 oe_asp_tengri_shamanic_syncretism:0 "草原萨满百教融通"
 oe_asp_tengri_shamanic_syncretism_desc:0 "尊崇诸教神职为汗廷祈福的草原古礼，广开异教宽容并增广多民族文化容纳上限。"
 oe_asp_tengri_ordu_horsemasters:0 "斡耳朵牧马与铁骑补员"
 oe_asp_tengri_ordu_horsemasters_desc:0 "按四时牧场轮牧战马并在诸斡耳朵设驿换乘，显著提升无路行军机动与战损兵团补员速度。"
 oe_asp_tengri_silk_caravan_oath:0 "草原丝路商队护卫誓约"
 oe_asp_tengri_silk_caravan_oath_desc:0 "以金牌护送与草原盟誓保障跨越钦察与中亚的商队安全，拓展贸易半径并提升出口增益。"
 oe_asp_jurchen_baishan_spirits:0 "长白山神与黑水护佑"
 oe_asp_jurchen_baishan_spirits_desc:0 "祭祀白山黑水祖灵以护持山林堡寨，令部族勇士士气高昂、严守关隘不退半步。"
 oe_asp_jurchen_banner_hunting_rites:0 "女真大围狩猎军礼"
 oe_asp_jurchen_banner_hunting_rites_desc:0 "寓兵于猎，以四季大围祭礼锤炼女真轻骑射术，并使林海毛皮与野味出产倍增。"
 oe_rel.10.t:0 "普世大公会议开幕"
 oe_rel.10.desc:0 "来自各自主教区的大主教、修院院长与宫廷神学家齐聚主座堂，在烛光与圣咏声中恭候圣裁。本次大公会议将为帝国正教确立未来十年的核心护教重心。"
 oe_rel.10.a:0 "重申帕拉马斯正统，巩固教义纯洁与国本稳度"
 oe_rel.10.b:0 "发动跨教区联合赈济，抚慰民生并消弭厌战"
 oe_rel.10.c:0 "整饬牧首辖区律法，凝结神职忠心与皇权威仪"
 oe_rel.11.t:0 "金诏赐福阿索斯圣山"
 oe_rel.11.desc:0 "帝国使节携皇帝亲签金诏与丰厚布施抵达阿索斯圣山。二十大修道院的钟声齐鸣，圣山抄经院承诺为帝国广育学者、祈福社稷。"
 oe_rel.11.a:0 "愿圣山灯火永照帝国山河"
 oe_rel.13.t:0 "全罗斯教会公议调停"
 oe_rel.13.desc:0 "围绕修道院田产归属与礼仪正典的争论令罗斯诸教区暗流涌动。在朝廷主持下，拥产派、伏尔加河外长老与地方主教齐聚一堂，寻求弥合裂痕的折中之道。"
 oe_rel.13.a:0 "以共融公议安抚教士与乡民，重申正教一体"
 oe_rel.13.b:0 "赐予地方修院与村社宽厚恩典，厚培民生稳度"
 oe_rel.20.t:0 "三教殿前论道"
 oe_rel.20.desc:0 "大殿之上，国子监大儒、全真掌教与禅净高僧依次陈辞，各抒治世安民与修身化俗之义。陛下的一言褒扬，不仅将引领未来十年朝野风尚，也将确立本国所属宗派的弘化律法。"
 oe_rel.20.a:0 "尊程朱礼教格物：兴崇儒家正气与内阁效率"
 oe_rel.20.b:0 "尚全真清修济世：宏扬道家和谐与休养生息"
 oe_rel.20.c:0 "弘禅净双修普度：以佛家慈悲息兵安民、滋养户口"
 oe_rel.21.t:0 "敕封帝师·法轮护国"
 oe_rel.21.desc:0 "雪域高僧奉诏入京，于大内佛堂设坛灌顶、诵经护国。藏传密教萨迦、格鲁与噶举三大传承咸集阶前，静候天子择定护法法统，以固高原与草原诸藩之盟。"
 oe_rel.21.a:0 "承萨迦帝师法统：广结雪域草原诸藩善缘"
 oe_rel.21.b:0 "兴格鲁戒律学经：严明寺规并增广僧林学养"
 oe_rel.21.c:0 "礼噶举护法金刚：加持边防将士、稳固高原门户"
 oe_rel.22.t:0 "礼聘回回经师入主司天监"
 oe_rel.22.desc:0 "沿丝绸之路远道而来的西域天算家与经学名儒携星盘、历表与舆图觐见朝廷。朝廷可延请不同学派的回回经师入仕司天监与译书馆，为帝国引入先进的历算、医药与律法学养。"
 oe_rel.22.a:0 "礼聘哈乃斐学派法学与历算大家（波斯文化）"
 oe_rel.22.b:0 "礼聘马图里迪学派思辨与格致学者（中原回回）"
 oe_rel.22.c:0 "礼聘纳克什班迪学派丝路名儒（波斯文化）"
