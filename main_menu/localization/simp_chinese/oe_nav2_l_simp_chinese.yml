 oe_nav2_negotiate_strait_charter: "缔结海峡通行豁免与商馆特许"
 oe_nav2_negotiate_strait_charter_desc: "向扼守世界六大海峡之一的国家支付一笔特许金，换取十年免税通航权、海外商馆优待与远洋航程加成；海峡控制国则获得稳定的特许税收。若对方断然回绝，将埋下海峡通行税争端的导火索。"
