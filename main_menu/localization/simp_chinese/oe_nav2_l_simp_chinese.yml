 STATIC_MODIFIER_NAME_oe_nav2_letters_of_marque_active: "王室私掠特许激活"
 STATIC_MODIFIER_DESC_oe_nav2_letters_of_marque_active: "持王室特许状的私掠船队正四出劫掠敌国海贸，提升我方私掠战力与海运收益，但使邻国对我方航运诚信颇有微词。"
 STATIC_MODIFIER_NAME_oe_nav2_marque_harassed: "海道遭私掠船袭扰"
 STATIC_MODIFIER_DESC_oe_nav2_marque_harassed: "敌国颁发的私掠船队不断袭扰我方商船与近海护航线，导致贸易收入受损、海域存在加速衰减。"
 STATIC_MODIFIER_NAME_oe_nav2_antipiracy_convoy_mod: "跨海联合护航舰队"
 STATIC_MODIFIER_DESC_oe_nav2_antipiracy_convoy_mod: "多国联合护航舰队昼夜巡弋主要航路，以少许海军维持费为代价大幅遏制海盗滋生并提升海运效率。"
 STATIC_MODIFIER_NAME_oe_nav2_strait_free_passage: "海峡免税通航特许"
 STATIC_MODIFIER_DESC_oe_nav2_strait_free_passage: "经由正式外交条约获得的咽喉海峡免税通航与商馆驻泊权，显著扩张我方海贸效率、商业影响力与远洋航程。"
 STATIC_MODIFIER_NAME_oe_nav2_strait_charter_toll: "海峡特许包税岁入"
 STATIC_MODIFIER_DESC_oe_nav2_strait_charter_toll: "向友好航海强国颁发海峡通航特许书带来的稳定税捐与商港繁荣收益。"
 STATIC_MODIFIER_NAME_oe_nav2_factory_extraterritorial_mod: "海外商馆治外法权保障"
 STATIC_MODIFIER_DESC_oe_nav2_factory_extraterritorial_mod: "海外商馆与侨民社区获得了明确的特许法权保障，海商资本信心大振。"
 STATIC_MODIFIER_NAME_oe_nav2_maritime_patrol_alert: "海疆巡防战备警戒"
 STATIC_MODIFIER_DESC_oe_nav2_maritime_patrol_alert: "全国船坞与海防舰队进入高度战备状态，加快舰船建造并鼓舞水师士气。"
 STATIC_MODIFIER_NAME_oe_nav2_arctic_route_charted: "北极东北航道海图告成"
 STATIC_MODIFIER_DESC_oe_nav2_arctic_route_charted: "从卑尔根经瓦尔德、科拉、阿尔汉格尔斯克直抵西伯利亚曼加泽亚的极地商路已被完整测绘，大幅拓宽远洋航程与北洋商力。"
 STATIC_MODIFIER_NAME_oe_nav2_indian_ocean_prestige: "南洋印度洋宝船宣威"
 STATIC_MODIFIER_DESC_oe_nav2_indian_ocean_prestige: "巨型宝船外交使团纵横南海、马六甲、古里、霍尔木兹与东非斯瓦希里诸港，令四海藩邦慕义来朝，海军传统与远洋商贸俱臻鼎盛。"
 STATIC_MODIFIER_NAME_oe_nav2_sankore_scholarship: "桑科雷大藏典籍回流"
 STATIC_MODIFIER_DESC_oe_nav2_sankore_scholarship: "经西撒哈拉商队自廷巴克图桑科雷大学高价抄录回国的数千卷天文、算学与律法古籍，正在全国书院掀起研学热潮。"
 STATIC_MODIFIER_NAME_oe_nav2_silk_road_compact: "丝绸之路跨洲通好盟约"
 STATIC_MODIFIER_DESC_oe_nav2_silk_road_compact: "横贯撒马尔罕、敦煌、长安与东西两京的陆上使团打通了稳定的外交驿传与思潮传播通道，令制度传播与国际贸易倍增。"
 STATIC_MODIFIER_NAME_oe_nav2_royal_academy_laurels: "皇家科学院启蒙桂冠"
 STATIC_MODIFIER_DESC_oe_nav2_royal_academy_laurels: "古典铭文测绘与赤道子午线精密科考的辉煌成就震撼学界，全面推动国民识字率、科研速度、思潮革新与文化传统。"
 oe_nav2_exp_arctic_northeast: "北极东北航道与曼加泽亚冰海探险"
 oe_nav2_exp_arctic_northeast_desc: "派遣耐冰探险船队自本国良港北上，经卑尔根、瓦尔德、科拉与白海阿尔汉格尔斯克，雇佣波莫尔冰海向导越过卡宁半岛与普斯托泽尔斯克，直抵传说中的西伯利亚黄金毛皮市镇曼加泽亚并绘制东北冰海航图。"
 oe_nav2_exp_arctic_northeast_outcome_overview: "$BULLET$成功返航后将授予持续25年的#Y 北极东北航道海图告成#!修正，显著提升远洋航程、商力与海运效率，并向首都市场注入大量珍稀皮草与威望。\n$BULLET$沿途将在科拉、阿尔汉格尔斯克与曼加泽亚触发波莫尔向导与浮冰危机抉择。"
 oe_nav2_exp_indian_ocean_treasure: "南洋—印度洋宝船外交使团"
 oe_nav2_exp_indian_ocean_treasure_desc: "敕造跨文明远洋宝船使团，依本国所处东西海域自动规划双向全良港航线，遍访马六甲、古里、果阿、霍尔木兹、亚丁乃至东非桑给巴尔或泉州刺桐港，以瓷器丝绸宣扬国威并满载香料贡品凯旋。"
 oe_nav2_exp_indian_ocean_treasure_outcome_overview: "$BULLET$凯旋后将向首都市场注入胡椒、丁香与瓷器，并授予持续15年的#Y 南洋印度洋宝船宣威#!修正（外交声誉、海运效率与月度海军传统）。\n$BULLET$途经马六甲、古里与远洋终点时将触发外交馈赠与奇珍进贡事件。"
 oe_nav2_exp_saharan_scholar_caravan: "西撒哈拉黄金与桑科雷学术商队"
 oe_nav2_exp_saharan_scholar_caravan_desc: "自马格里布或北非绿洲出发，走西路经锡吉尔马萨、廷杜夫与塔加扎巨型盐矿横穿沙海，直抵廷巴克图桑科雷大学、杰内、加奥与卡诺，以岩盐换取砂金并高价抄录天文、律法与医学典籍。"
 oe_nav2_exp_saharan_scholar_caravan_outcome_overview: "$BULLET$凯旋后提升本国文化传统、注入砂金供给，并授予持续10年的#Y 桑科雷大藏典籍回流#!修正（识字率、科研速度与商业影响力）。\n$BULLET$在塔加扎盐矿与廷巴克图桑科雷大学触发以盐易金与抄经求学抉择。"
 oe_nav2_exp_silk_road_embassy: "丝绸之路古道跨洲外交考察"
 oe_nav2_exp_silk_road_embassy_desc: "派遣横贯欧亚腹地的陆上外交考察使团，东西双向串联大不里士、撒马尔罕、喀什噶尔、吐鲁番、敦煌沙州、兰州、京兆长安与大都或君士坦丁堡，互赠国书、考察天文丝市并打通跨洲驿传。"
 oe_nav2_exp_silk_road_embassy_outcome_overview: "$BULLET$凯旋后向首都市场注入生丝、增进沿途大国好感，并授予持续12年的#Y 丝绸之路跨洲通好盟约#!修正（思潮传播、外交声誉与贸易收入）。\n$BULLET$在撒马尔罕与敦煌沙州触发天文互市与石窟古卷抉择。"
 oe_nav2_exp_enlightenment_survey: "启蒙科学环球与古典考古考察"
 oe_nav2_exp_enlightenment_survey_desc: "由皇家科学院赞助的启蒙时代大型综合科考队。启程时可亲定科考方向：或深入罗马、雅典、底比斯、巴尔米拉、巴比伦与波斯波利斯开展古典考古与铭文测绘，或绕道好望角远赴安第斯赤道基多测量子午线弧度与金星凌日。"
 oe_nav2_exp_enlightenment_survey_outcome_overview: "$BULLET$启程时可自由选择#Y 古典考古测绘线#!或#Y 全球赤道子午线科考线#!。\n$BULLET$凯旋后大幅推进当前科研进度、提升文化传统，并授予持续20年的#Y 皇家科学院启蒙桂冠#!修正。"
 oe_nav2.1.t: "敌国颁发私掠许可证"
 oe_nav2.1.d: "各地海港商会的急报接踵而至：敌方已正式向大批武装私掠船颁发特许状，准其在我方近海与远洋商路上拦截商船、劫掠货舱。虽然海事法已赋予我方立即出兵清剿私掠的正当宣战理由，但港务与护航防务仍需当机立断。"
 oe_nav2.1.a: "启动全国海疆巡防警戒并备战清剿"
 oe_nav2.1.a.tt: "获得 #G +5#! 海军传统与[ShowModifier('oe_nav2_maritime_patrol_alert')]（#Y 5年#!），加速造船并强化海军士气。"
 oe_nav2.1.b: "补贴海商保费以稳住港市人心"
 oe_nav2.1.b.tt: "支付 #R -30#! 金币抚恤受袭商船，挽回 #G +5#! 威望。"
 oe_nav2.2.t: "联合护航舰队端掉海盗巢穴"
 oe_nav2.2.d: "我方与盟友编组的跨海联合反海盗护航舰队在一次黎明奇袭中截获了多艘流窜私掠快船，并顺藤摸瓜摧毁了隐蔽在海岬礁湾中的海盗补给巢穴。获释商船满载而归，商路重现安宁。"
 oe_nav2.2.a: "按约分润战利品并嘉奖护航官兵"
 oe_nav2.2.a.tt: "获得 #G +40#! 金币、#G +6#! 海军传统与 #G +8#! 威望。"
 oe_nav2.2.b: "将缴获船材投入常设护航船坞"
 oe_nav2.2.b.tt: "获得[ShowModifier('oe_nav2_maritime_patrol_alert')]（#Y 5年#!），全面提振船坞效率与水兵储备。"
 oe_nav2.3.t: "海峡通行特许遭拒"
 oe_nav2.3.d: "我方派往海峡控制国的特使空手而归。对方不仅傲慢拒绝了公平的通行税豁免与商馆特许提议，还扬言将在咽喉航道上进一步加征过境关税。海商议会群情激愤，呼吁以炮舰重申航道自由。"
 oe_nav2.3.a: "宣示航道自由并准备海峡通行税战争"
 oe_nav2.3.a.tt: "获得 #G +5#! 威望，并立即对拒绝方获得持续 #Y 5年#! 的#Y 海峡通行税争端#!宣战理由。"
 oe_nav2.3.b: "暂且隐忍并退回未用的特许经费"
 oe_nav2.3.b.tt: "收回 #G +25#! 金币使团经费，避免立即爆发海上冲突。"
 oe_nav2.4.t: "海外商馆与同教侨民外交照会"
 oe_nav2.4.d: "我方驻外领事与海外商馆代表递交联名呈文，详述异邦港市中同教商民的处境与自治契约需求。朝堂之上就究竟应当强硬捍卫治外法权，还是以温和商贸补偿换取平稳通商展开激辩。"
 oe_nav2.4.a: "颁布护商特许宪章并坚持治外法权"
 oe_nav2.4.a.tt: "获得 #G +10#! 威望与[ShowModifier('oe_nav2_factory_extraterritorial_mod')]（#Y 10年#!）。"
 oe_nav2.4.b: "收取海外商馆代管税款以充实国库"
 oe_nav2.4.b.tt: "立即获得 #G +60#! 金币商贸补偿。"
 oe_nav2.5.t: "巴伦支冰海的浮冰封锁"
 oe_nav2.5.d: "探险船队绕过瓦尔德抵达科拉近海时，凛冽的北极寒流将整片巴伦支海面推挤成咔咔作响的浮冰原。探险队长必须决定：是在科拉港花费重金加装橡木防冰包板与补给腌肉，还是冒险沿狭长冰缝抢先闯关。"
 oe_nav2.5.a: "在科拉港加固耐冰船壳并补足给养"
 oe_nav2.5.a.tt: "支付 #R -30#! 金币，在科拉港添置 #G +1#! 艘耐冰护航船并补充 #G +20#! 补给，随后继续启航。"
 oe_nav2.5.b: "沿近岸冰缝强行突进并顺道收毛皮"
 oe_nav2.5.b.tt: "损失 #R -1#! 艘船只，但额外装载 #G +10#! 货物，随后继续启航。"
 oe_nav2.6.t: "阿尔汉格尔斯克的波莫尔向导"
 oe_nav2.6.d: "船队安抵白海重镇阿尔汉格尔斯克。久居极北的波莫尔渔猎水手熟悉每一条通往卡宁半岛与鄂毕河口的冰海暗流，其平底耐冰「科奇船」能在冰层挤压下自动抬升而不致碎裂。他们愿以厚酬为我方带路。"
 oe_nav2.6.a: "重金招募波莫尔领航员并添购耐冰小艇"
 oe_nav2.6.a.tt: "支付 #R -40#! 金币，探险队获 #G +1#! 艘耐冰科奇船、#G +25#! 补给与 #G +10#! 货物，继续向曼加泽亚进发。"
 oe_nav2.6.b: "仅换购腌鱼干粮并抄录旧海图"
 oe_nav2.6.b.tt: "恢复 #G +15#! 极地给养并获 #G +5#! 毛皮航图，继续航程。"
 oe_nav2.7.t: "金色曼加泽亚的黑貂皮市"
 oe_nav2.7.d: "越过冰原与鄂毕水网，探险队终于抵达北极圈边缘的传奇木城——曼加泽亚！集市中堆满泛着乌金光泽的顶级西伯利亚黑貂皮、海象牙与白狐裘，涅涅茨猎手与远道而来的商贾正争相与我方探险队易货。"
 oe_nav2.7.a: "尽数收购顶级黑貂皮满载返航"
 oe_nav2.7.a.tt: "获得 #G +10#! 威望与 #G +25#! 毛皮航图成果，随后起程返航。"
 oe_nav2.7.b: "精细测绘鄂毕—塔兹水网并记录极地磁偏"
 oe_nav2.7.b.tt: "获得 #G +8#! 海军传统、科研进度加成与 #G +15#! 毛皮航图成果，随后起程返航。"
 oe_nav2.8.t: "马六甲海峡的宝船商约"
 oe_nav2.8.d: "桅樯蔽日的宝船舰队驶入马六甲港外锚地，岸上万国商贾云集观礼。海峡苏丹派来盛装仪仗迎候我方使节，提议在我方赏赐锦缎瓷器后签署长期商埠停泊与香料转运协定。"
 oe_nav2.8.a: "厚赐瓷器锦缎以树天朝远洋声威"
 oe_nav2.8.a.tt: "消耗 #R -25#! 赏赐绸瓷，获得 #G +8#! 威望、#G +30#! 宣威声望与 #G +20#! 回程贡品，随后继续远航。"
 oe_nav2.8.b: "务实缔结港务互市协定并征收船货余利"
 oe_nav2.8.b.tt: "消耗 #R -10#! 赏赐绸瓷，获得 #G +40#! 金币与 #G +25#! 回程贡品，随后继续远航。"
 oe_nav2.9.t: "古里港的胡椒与扎莫林赠礼"
 oe_nav2.9.d: "季风将宝船送抵印度马拉巴尔海岸的香料明珠——古里。扎莫林王公在棕榈林立的海滨行宫设宴款待使团，满仓刚采收的黑胡椒、豆蔻与象牙雕件正待成交。"
 oe_nav2.9.a: "以国礼换购满舱顶级马拉巴尔胡椒"
 oe_nav2.9.a.tt: "消耗 #R -25#! 赏赐绸瓷，获得 #G +30#! 回程贡品与 #G +20#! 宣威声望，继续扬帆。"
 oe_nav2.9.b: "在古里外海操演水师阵法以震慑印度洋"
 oe_nav2.9.b.tt: "消耗 #R -15#! 赏赐绸瓷，获得 #G +5#! 海军传统与 #G +30#! 宣威声望，继续扬帆。"
 oe_nav2.10.t: "远洋终点的瑞兽与重礼来朝"
 oe_nav2.10.d: "历尽万里季风波涛，宝船使团终于抵达此行最遥远的洋岸大港！当地王公惊叹于巨舰之宏伟，献上举世罕见的瑞兽奇珍、香料宝箱与黄金贡礼，愿遣随行特使共赴我方京师。"
 oe_nav2.10.a: "隆重受纳瑞兽奇珍并护送外邦使节返航"
 oe_nav2.10.a.tt: "获得 #G +12#! 威望、#G +35#! 宣威声望与 #G +30#! 回程贡品，随后乘季风凯旋。"
 oe_nav2.10.b: "换取实银黄金与远洋星象航海图"
 oe_nav2.10.b.tt: "获得 #G +60#! 金币、#G +8#! 海军传统与 #G +45#! 回程贡品，随后乘季风凯旋。"
 oe_nav2.11.t: "塔加扎盐城：以盐易金"
 oe_nav2.11.d: "商队深入西撒哈拉烈日炙烤的塔加扎盐矿。这座连房屋皆以洁白岩盐砌成的奇异绿洲，正是通往尼日尔河谷的财富钥匙——南方王国的商队愿以等重砂金换取每一块整盐板。"
 oe_nav2.11.a: "收购成批整盐板并雇驼队补足皮囊淡水"
 oe_nav2.11.a.tt: "支付 #R -35#! 金币，恢复 #G +25#! 商队淡水并获 #G +20#! 砂金负载，继续南下廷巴克图。"
 oe_nav2.11.b: "轻装急行直奔尼日尔河大弯"
 oe_nav2.11.b.tt: "消耗 #R -10#! 商队淡水，获得 #G +10#! 砂金负载，继续南下。"
 oe_nav2.12.t: "廷巴克图桑科雷大学藏经阁"
 oe_nav2.12.d: "商队驼铃响彻廷巴克图泥砖城门。在驰名伊斯兰与萨赫勒世界的桑科雷大学及百余座私人藏书楼中，无数精美的天文学、几何、史学与法学手稿比黄金还要昂贵，当地学者热切欢迎远道而来的求知使者。"
 oe_nav2.12.a: "重金雇佣抄经师成批誊录天文与律法古籍"
 oe_nav2.12.a.tt: "支付 #R -40#! 金币，获得科研进度加成、#G +25#! 古籍抄本、#G +15#! 砂金负载与 #G +20#! 商队淡水，随后继续行程。"
 oe_nav2.12.b: "在金市优先换购高纯度旺加拉砂金"
 oe_nav2.12.b.tt: "获得 #G +55#! 金币、#G +30#! 砂金负载与 #G +10#! 古籍抄本，随后继续行程。"
 oe_nav2.13.t: "撒马尔罕天文台与丝绸大市"
 oe_nav2.13.d: "丝路使团抵达中亚明珠撒马尔罕。雷吉斯坦广场四周商旅辐辏，来自波斯、印度与汉地的锦缎玉器琳琅满目；城郊高岗上的巨型天文观象台更保存着精确至秒的恒星历表。"
 oe_nav2.13.a: "重金交流天文星表并采购顶级丝绸锦缎"
 oe_nav2.13.a.tt: "支付 #R -35#! 金币，获得科研进度加成、#G +35#! 国书与舆图成果与 #G +15#! 使团士气，继续东行或西进。"
 oe_nav2.13.b: "举行盛大国书觐见仪式以扬国威"
 oe_nav2.13.b.tt: "获得 #G +8#! 威望、#G +25#! 国书与舆图成果与 #G +10#! 使团士气，继续行程。"
 oe_nav2.14.t: "敦煌鸣沙山石窟与河西驿传"
 oe_nav2.14.d: "穿越大漠戈壁的丝路使团在沙州敦煌休整。鸣沙山麓千佛洞壁画辉煌如昨，寺僧与驿丞向使团展示了多语种写本、绿洲水源志与通往关中京兆的官驿路引。"
 oe_nav2.14.a: "潜心摹录石窟多语古卷与西域舆图"
 oe_nav2.14.a.tt: "本国文化获得 #G +4#! 文化传统，使团获 #G +40#! 国书舆图成果与 #G +15#! 使团士气，继续行程。"
 oe_nav2.14.b: "与河西大商互换官驿货单并兑现商利"
 oe_nav2.14.b.tt: "获得 #G +50#! 金币与 #G +30#! 国书舆图成果，继续行程。"
 oe_nav2.15.t: "皇家科学院启蒙考察路线抉择"
 oe_nav2.15.d: "装备着最新象限仪、航海天文钟与绘图板的皇家科考队已集结完毕，只待君主亲笔签发最终路线诏书：是循地中海与近东古文明带系统测绘罗马、雅典、底比斯、巴尔米拉、巴比伦与波斯波利斯，还是跨越重洋远赴赤道安第斯基多高原精确测定地球子午线弧度？"
 oe_nav2.15.a: "分支甲：地中海—近东古典考古与铭文测绘"
 oe_nav2.15.a.tt: "路线锁定为#Y 罗马—那不勒斯—雅典—科林斯—米斯特拉斯—士麦那—贝尔加马—亚历山大—基纳（底比斯）—阿斯旺—巴尔米拉—希拉（巴比伦）—伊什塔赫尔（波斯波利斯）#!并返航，随后即刻出发！"
 oe_nav2.15.b: "分支乙：全球赤道子午线与金星凌日天文科考"
 oe_nav2.15.b.tt: "探索好望角与安第斯瓜亚基尔—基多航线，路线锁定为#Y 好望角—瓜亚基尔—基多—瓜亚基尔—亚历山大—雅典#!并返航，随后即刻出发！"
 oe_nav2.16.t: "启蒙科考重大突破：古铭与弧度"
 oe_nav2.16.d: "科考队传来振奋人心的捷报！无论是在古老神庙废墟中发现的多语种对照石碑，还是在高山赤道三角网下测得的地球扁率数据，都将彻底改写人类对历史与宇宙的认知。学士们请示接下来的重点工作。"
 oe_nav2.16.a: "反复核校三角测量与三语铭文手稿"
 oe_nav2.16.a.tt: "获得科研进度加成、#G +40#! 标本与拓片及 #G +10#! 仪器精度，随后继续返航。"
 oe_nav2.16.b: "广征珍稀自然标本与古典文物充实皇家博物院"
 oe_nav2.16.b.tt: "获得 #G +12#! 威望与 #G +50#! 标本与拓片，随后继续返航。"
 oe_nav2.17.t: "远征折损与残存海图抢救"
 oe_nav2.17.d: "令人痛惜的消息传回朝廷：我方派出的历史探险队因酷寒风浪、补给耗尽或统帅不幸亡故而被迫中止。幸存随员拼死带回了部分航海日志与沿途草图，为日后重整旗鼓留下宝贵经验。"
 oe_nav2.17.a: "将残存日志归档海军部以砺后人"
 oe_nav2.17.a.tt: "从惨痛教训中汲取经验，获得 #G +4#! 海军传统。"
 oe_nav2.17.b: "厚葬殉职探险家并铭刻纪念碑"
 oe_nav2.17.b.tt: "抚慰遗族并彰显王国气度，获得 #G +4#! 威望。"
 oe_nav2.18.t: "v12.5 W2 审计：海权、私掠与五大历史探险状态"
 oe_nav2.18.d: "本读数面板用于核验 v12.5 Track W2（前缀 oe_nav2_，0 主线槽位，0 原版覆写）的实时运行状态。当前国家：[ROOT.GetCountry.GetName]。\n\n已实装组件：\n• 3 项原生宣战理由：海峡通行税争端（六大海峡）、清剿私掠与保商护航、护教与海外商馆治外法权。\n• 3 项海洋国家交互：颁发私掠许可证、组建跨海联合反海盗护航舰队、缔结海峡通行豁免与商馆特许。\n• 5 项全验证历史探险：北极东北曼加泽亚航道、南洋—印度洋宝船外交使团（17 港双向）、西撒哈拉黄金与桑科雷学术商队、丝绸之路跨洲外交考察（东西双向）、启蒙科学环球与古典考古考察（双分支动态切线）。"
 oe_nav2.18.a: "确认读数并关闭审计面板"
 oe_nav2.18.a.tt: "关闭 Track W2 实时状态审计读数窗口，不改变任何游戏状态。"
