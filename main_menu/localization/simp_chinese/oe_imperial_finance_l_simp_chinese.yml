 oe_fin.1.t: "海佩伦的成色"
 oe_fin.1.desc: "1092年阿莱克修斯一世铸造海佩伦时，它的成色是20.5开。米海尔八世时降到15开，安德洛尼卡二世时降到12开。约翰六世坎塔库泽诺斯铸了最后一批海佩伦，此后帝国再也没有铸过金币。如今国库又入不敷出，铸币厂的主管呈上了新的配方：每枚金币少放一开金子，同样的金块就能多铸出一批钱来。"
 oe_fin.1.desc.bank: "1092年阿莱克修斯一世铸造海佩伦时，它的成色是20.5开。米海尔八世时降到15开，安德洛尼卡二世时降到12开。约翰六世坎塔库泽诺斯铸了最后一批海佩伦，此后帝国再也没有铸过金币。如今国库又入不敷出，铸币厂的主管呈上了新的配方：每枚金币少放一开金子，同样的金块就能多铸出一批钱来。塞萨洛尼基的铸币厂在安德洛尼卡三世时还在铸造印着圣德米特里像的铜币，如今它的铸币特权握在帝国特许的塞萨洛尼基铸币银行手里，银行也递上了自己的方案。"
 oe_fin.1.a: "再减一开"
 oe_fin.1.b: "守住成色"
 oe_fin.1.c: "交给塞萨洛尼基铸币银行重铸"
 oe_fin.1.c.tt: "塞萨洛尼基铸币银行金库 −300"
 oe_fin.2.t: "面包与粮船"
 oe_fin.2.desc: "1306年到1307年的冬天，加泰罗尼亚佣兵团占着色雷斯，保加利亚沙皇斯韦托斯拉夫夺取了安基阿洛斯和梅森布里亚，截住了运往京城的粮食。佩拉的热那亚人把黑海的小麦囤起来，在城里高价出售。牧首阿塔纳修斯归咎于热那亚人，劝皇帝把粮食贸易收回自己手中。如今京城的面包又贵了起来，面包铺前排起了长队。"
 oe_fin.2.desc.bank: "1306年到1307年的冬天，加泰罗尼亚佣兵团占着色雷斯，保加利亚沙皇斯韦托斯拉夫夺取了安基阿洛斯和梅森布里亚，截住了运往京城的粮食。佩拉的热那亚人把黑海的小麦囤起来，在城里高价出售。牧首阿塔纳修斯归咎于热那亚人，劝皇帝把粮食贸易收回自己手中。如今京城的面包又贵了起来，面包铺前排起了长队。帝国的黑海银行在克里米亚有船，也有粮仓。"
 oe_fin.2.a: "国库出钱买粮"
 oe_fin.2.b: "照阿塔纳修斯说的办：限价，搜查囤粮"
 oe_fin.2.c: "让粮价自己回落"
 oe_fin.2.d: "让黑海银行包下运粮船"
 oe_fin.2.d.tt: "黑海银行金库 −200"
 oe_fin.3.t: "修教堂的钱"
 oe_fin.3.desc: "1346年，圣索菲亚大教堂的穹顶塌了一部分。莫斯科大公谢苗送来修缮的钱，坎塔库泽诺斯却拿它付了突厥盟军的军饷。如今战事吃紧，国库见底。牧首手里握着各地为修教堂捐来的钱，大教堂的库房里还有历代皇帝献上的金银圣器。"
 oe_fin.3.a: "征用捐款和圣器"
 oe_fin.3.b: "向牧首借款"
 oe_fin.3.c: "教会的钱不能动"
 oe_fin.4.t: "意大利银行家的条件"
 oe_fin.4.desc: "1340年代，佛罗伦萨的佩鲁齐和巴尔迪两家银行相继倒闭，它们借给英王爱德华三世打仗的钱，就是收不回来的坏账之一。从那以后，意大利的银行家借钱给君主，先要抵押。如今几家意大利银号的代表来到宫中，愿意借给帝国一大笔钱，条件已经写在羊皮纸上。"
 oe_fin.4.desc.bank: "1340年代，佛罗伦萨的佩鲁齐和巴尔迪两家银行相继倒闭，它们借给英王爱德华三世打仗的钱，就是收不回来的坏账之一。从那以后，意大利的银行家借钱给君主，先要抵押。如今几家意大利银号的代表来到宫中，愿意借给帝国一大笔钱，条件已经写在羊皮纸上。帝国自己的特许银行也表示，可以借钱给国库，而且不收利息。"
 oe_fin.4.a: "以关税作抵押"
 oe_fin.4.b: "借来专供征伐"
 oe_fin.4.b.tt: "当前征伐进度 +5，压力 −5"
 oe_fin.4.c: "向帝国自己的特许银行借"
 oe_fin.4.c.tt: "金库最多的那家帝国特许银行借出它一半的金库，至多12个月的税收与贸易收入，不收利息；它的金库付出同样的数目\n帝国权威 +2"
 oe_fin.4.d: "不借"
 oe_fin.5.t: "包税人的预付款"
 oe_fin.5.desc: "帝国的赋税向来由征税官征收。他们在拍卖中竞价，买下一个行省的征税权，交够约定的数目，多收的归自己。十一世纪中叶以后，这种包税越来越普遍。如今以[SCOPE.sCountry('oe_fin_theme').GetName]为首的包税人联名上书：只要把包税期延长到十年，他们愿意先付一大笔预付款。"
 oe_fin.5.desc.tm: "帝国的赋税向来由征税官征收。他们在拍卖中竞价，买下一个行省的征税权，交够约定的数目，多收的归自己。十一世纪中叶以后，这种包税越来越普遍。如今以[SCOPE.sCountry('oe_fin_theme').GetName]为首的包税人联名上书：只要把包税期延长到十年，他们愿意先付一大笔预付款。总税务长官[SCOPE.sCharacter('oe_fin_taxmaster').GetName]却主张趁这个机会，改派领俸禄的税吏。"
 oe_fin.5.a: "收下预付款"
 oe_fin.5.a.tt: "每个包税的军区忠诚 +5，并计入忠诚目标5年"
 oe_fin.5.b: "废除包税，改派领俸禄的税吏"
 oe_fin.5.b.tt: "每个包税的军区改由中央委派税吏，俸禄每月由国库支付，2年内不能再改\n这些军区忠诚 −5，并计入忠诚目标5年\n帝国权威 +3"
 oe_fin.5.c: "照旧"
 oe_fin.6.t: "税吏的私囊"
 oe_fin.6.desc: "1329年，安德洛尼卡三世设立了四人的普世法官庭，作为帝国的最高法庭。1336年到1337年间，四位法官里有三位因受贿被定罪。领俸禄的官员一样会伸手。如今查账的官员发现，派到[SCOPE.sCountry('oe_fin_theme').GetName]的税吏把一部分税款记成了“欠缴”，钱进了他自己的口袋。"
 oe_fin.6.a: "公开审判"
 oe_fin.6.a.tt: "[SCOPE.sCountry('oe_fin_theme').GetName]财政效率 +15（5年）\n[SCOPE.sCountry('oe_fin_theme').GetName]忠诚 −5，并计入忠诚目标5年\n帝国权威 +2"
 oe_fin.6.b: "追回赃款，悄悄撤换"
 oe_fin.6.b.tt: "[SCOPE.sCountry('oe_fin_theme').GetName]财政效率 +5（5年）"
 oe_fin.6.c: "提高税吏的俸禄"
 oe_fin.7.t: "一成商税"
 oe_fin.7.desc: "商税（kommerkion）按货值抽十分之一。1082年起，威尼斯商人在帝国境内不交此税，1268年的条约又确认了这一点；1261年的宁菲昂条约也给了热那亚人关税上的优待。帝国自己的商人却仍要照章纳税。如今港口的税吏报告，越来越多的希腊商人把货物记在拉丁合伙人的名下。"
 oe_fin.7.a: "严查冒名"
 oe_fin.7.a.tt: "威尼斯和热那亚对我们的好感 −20（每年回落2）"
 oe_fin.7.b: "给本国商人减税"
 oe_fin.7.c: "睁一只眼闭一只眼"
 oe_fin.7.c.tt: "帝国权威 −1"
 oe_fin.8.t: "圣乔治银行的提议"
 oe_fin.8.desc: "1407年4月，热那亚把历年打仗欠下的公债合并起来，交给新成立的圣乔治银行经营。1453年，共和国又把科西嘉和克里米亚的殖民地交给银行的官员治理。如今帝国在热那亚的圣乔治银行提出同样的办法：把帝国的旧债交给它统一经营，换取几项固定的收入。"
 oe_fin.8.a: "让圣乔治银行合并旧债"
 oe_fin.8.a.tt: "圣乔治银行金库 +300"
 oe_fin.8.b: "先让银行贴补国库"
 oe_fin.8.b.tt: "圣乔治银行拿出它一半的金库，至多6个月的税收与贸易收入，交给国库"
 oe_fin.8.c: "不必了"
 oe_fin.9.t: "里亚尔托的挤兑"
 oe_fin.9.desc: "1499年初，威尼斯的加尔佐尼银行付不出存款，里亚尔托桥边挤满了要取钱的人；几个月后，利波马诺银行也倒了。到1500年，城里四家大银行倒了三家。如今帝国的威尼斯公共银行门前也排起了长队，储户都想把钱取出来。"
 oe_fin.9.a: "国库为存款作保"
 oe_fin.9.a.tt: "威尼斯公共银行金库收到同样的数目"
 oe_fin.9.b: "召集富商共同出资"
 oe_fin.9.b.tt: "60%：挤兑平息，稳定度 +2.5\n40%：银行还是撑不住，威尼斯公共银行金库减半"
 oe_fin.9.c: "任它倒闭"
 oe_fin.9.c.tt: "威尼斯公共银行金库减半"
 oe_fin.10.t: "苏丹的胡椒"
 oe_fin.10.desc: "1420年代，马穆鲁克苏丹拜尔斯巴伊下令，香料只能经官府之手卖给意大利商人。原本自己做买卖的卡里米商人，从此成了替苏丹收货的代理人。如今帝国的尼罗河银行建议照此办理，由银行包揽亚历山大的胡椒买卖。"
 oe_fin.10.a: "实行专卖"
 oe_fin.10.a.tt: "尼罗河银行金库 +300"
 oe_fin.10.b: "银行只放贷，买卖归商人"
 oe_fin.10.c: "把今年的胡椒整批拍卖"
 oe_fin.11.t: "小麦大麦税"
 oe_fin.11.desc: "1307年，为了应付加泰罗尼亚人的战争和失去小亚细亚留下的亏空，安德洛尼卡二世开征一项临时的实物税，叫小麦大麦税（sitokrithon）：一对牛能耕的田地，要交六莫底小麦和四莫底大麦。这一类措施让国家的收入达到一百万海佩伦，中小农户却不堪重负。如今战事拖得太久，管后勤的官员又提出了同样的办法。"
 oe_fin.11.a: "开征小麦大麦税"
 oe_fin.11.b: "只向大地产征收"
 oe_fin.11.c: "不开新税"
 oe_fin.12.t: "钱商行会"
 oe_fin.12.desc: "十世纪的《市长书》把京城的钱商编成行会，和银器商、丝绸商、面包师一样，由市长规定他们的价格和利润。几百年来，兑换铜币和金币、替商人记账，一直是钱商的生意。如今帝国特许银行的生意越做越大，钱商行会的首领们来到宫中，要求保留他们的老特权。"
 oe_fin.12.a: "保留行会的特权"
 oe_fin.12.b: "把行会并入银行"
 oe_fin.12.c: "让他们自己去竞争"
 oe_fin.12.c.tt: "金库最多的那家帝国特许银行金库 +200"
 oe_fin.13.t: "巴西尔的地窖"
 oe_fin.13.desc: "据普塞洛斯记载，巴西尔二世攒下了二十万塔兰特，原有的库房装不下，他只好命人在地下挖出螺旋形的回廊来存放。如今帝国的国库又一次充盈起来，宫中对这笔钱各有主张。"
 oe_fin.13.a: "减免两年赋税"
 oe_fin.13.b: "兴修公共工程"
 oe_fin.13.c: "存进地窖"
 oe_fin.13.c.tt: "帝国权威 +3"
