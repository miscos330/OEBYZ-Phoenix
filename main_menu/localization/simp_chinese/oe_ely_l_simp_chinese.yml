# NEW 2026-11-21 v10.5 Worker 1: Fourth Odyssey Act I — The Western Crossing (oe_ely_). Generated by gen_elysia_exodus.py; edit the generator, not this file.
 oe_sit_fourth_odyssey: "第四奥德赛：圣火西渡"
 oe_sit_fourth_odyssey_desc: "面对旧大陆的危机或古老海图的召唤，帝国残存的舰队、元老、工匠与圣物扬帆驶向赫拉克勒斯之柱以西的日落之海。穿过马卡罗尼西亚群岛与马尾藻海风暴，双头鹰旗将在大洋彼岸的切萨皮克湾重燃罗马圣火。"
 oe_sit_fourth_odyssey_landfall: "圣火落户切萨皮克"
 oe_sit_fourth_odyssey_landfall_desc: "流亡舰队成功抵达北美东岸，建立新君士坦丁堡桥头堡并完成旧世脱钩，极乐洲新罗马（Nova Elysia）正式立国。"
 oe_sit_fourth_odyssey_aborted: "远航中止"
 oe_sit_fourth_odyssey_aborted_desc: "西渡舰队在中途折返或超过七十二个月仍未完成登陆，第四奥德赛计划就此封存。"
 oe_ely_map_voyager_tt: "正在筹备或率领第四奥德赛西渡舰队的罗马帝国主机。"
 oe_ely_map_chesapeake_tt: "大西洋西渡关键锚地与极乐洲新罗马（切萨皮克湾）目标登岸带。"
 oe_ely_map_ottoman_tt: "旧大陆步步紧逼的奥斯曼苏丹国势力范围。"
 OE_NOVA_ELYSIA: "极乐洲新罗马"
