 oe_loc_nea_athenai: "新雅典"
 oe_loc_skylax: "斯库拉克斯港"
 oe_loc_nea_smyrna: "新士麦那"
 oe_loc_agios_nikolaos: "圣尼古拉角"
 oe_loc_hesperides_port: "赫斯珀里得斯港"
 oe_ely_free_market_price: "极乐洲奠基开市豁免"
 oe_ely_ark_fitting_price: "大洋方舟整备经费"
 oe_ely_human_only_tt: "仅限玩家控制的国家执行此项西渡决断。"
 oe_ely_launch_eligible_tt: "满足《第四奥德赛》流亡危机门槛或 1337 立即远航规则窗口。"
 oe_ely_reprovision_cd_tt: "距上次紧急整补舰队至少已过十二个月。"
 oe_ely_dec_launch_odyssey.title: "启动第四奥德赛：筹建大洋方舟"
 oe_ely_dec_launch_odyssey.desc: "重新召集秘密航海议会，征集剩余战舰、工匠与古典典籍，正式启动跨越日落之海的「方舟计划」与《第四奥德赛》局势。"
 oe_ely_dec_launch_odyssey.a: "向日落之海升起紫旗！"
 oe_ely_dec_reprovision_fleet.title: "紧急整补西渡舰队"
 oe_ely_dec_reprovision_fleet.desc: "动用随船国库黄金高价采买淡水、腌肉、松焦油与帆布，迅速恢复西渡舰队的补给与水手士气，防范大西洋风暴与哗变。"
 oe_ely_dec_reprovision_fleet.a: "发放补给与双倍航行津贴。"
 oe_ely_dec_voyage_telemetry.title: "审阅第四奥德赛航程日志"
 oe_ely_dec_voyage_telemetry.desc: "只读查阅当前西渡航程阶段、舰队士气、补给、保留圣物评分、方舟人口档位与旧大陆脱钩校验码。"
 oe_ely_dec_voyage_telemetry.a: "展开航海官日志。"
 STATIC_MODIFIER_NAME_oe_ely_exodus_fleet_mod: "大洋方舟西渡舰队"
 STATIC_MODIFIER_DESC_oe_ely_exodus_fleet_mod: "满载工匠、典籍与瓦兰吉老兵的远航船队以高度戒备状态横渡大西洋。"
 STATIC_MODIFIER_NAME_oe_ely_nova_elysia_founded_mod: "极乐洲新罗马肇建"
 STATIC_MODIFIER_DESC_oe_ely_nova_elysia_founded_mod: "新君士坦丁堡的灯火在切萨皮克湾点燃，吸引流亡希腊人与开拓者汇聚西海。"
 STATIC_MODIFIER_NAME_oe_ely_breakwater_mod: "新金角湾人工防波堤"
 STATIC_MODIFIER_DESC_oe_ely_breakwater_mod: "拜占庭工程师在切萨皮克角以沉箱巨石筑成人工良港与海防链堤，弥补原址沙洲浅滩之不足。"
 STATIC_MODIFIER_NAME_oe_ely_natural_anchorage_mod: "西海金角天然深水良港"
 STATIC_MODIFIER_DESC_oe_ely_natural_anchorage_mod: "依托汉普顿湾满分天然良港兴建的皇室造船厂与海贸泊位，成为极乐洲舰队母港。"
 STATIC_MODIFIER_NAME_oe_ely_bermuda_beacon_mod: "圣尼古拉角大西洋灯塔"
 STATIC_MODIFIER_DESC_oe_ely_bermuda_beacon_mod: "耸立在百慕大暗礁之上的罗马导航灯塔与补给前哨，守护东西大西洋航线。"
 STATIC_MODIFIER_NAME_oe_ely_maize_adaptation_mod: "切萨皮克玉米农耕适应"
 STATIC_MODIFIER_DESC_oe_ely_maize_adaptation_mod: "吸收南塞蒙德与波瓦坦农耕智慧后，高产玉米与地中海黑麦共同撑起新罗马粮仓。"
 STATIC_MODIFIER_NAME_oe_ely_winter_rationing_mod: "首冬舰队配给法令"
 STATIC_MODIFIER_DESC_oe_ely_winter_rationing_mod: "靠严格配给与国库购粮硬扛过第一个寒冬，稳住了秩序却令海商颇有怨言。"
 STATIC_MODIFIER_NAME_oe_ely_relic_golden_legacy_mod: "帝国秘典与圣物全璧传承"
 STATIC_MODIFIER_DESC_oe_ely_relic_golden_legacy_mod: "几乎完整渡海的皇家藏书、礼法孤本与希腊火秘方为极乐洲奠定了冠绝新大陆的学术与文化高度。"
 STATIC_MODIFIER_NAME_oe_ely_relic_preserved_legacy_mod: "流亡皇室典籍传承"
 STATIC_MODIFIER_DESC_oe_ely_relic_preserved_legacy_mod: "随方舟抢救渡海的典籍与匠师手稿在切萨皮克湾延续了罗马文明的薪火。"
 STATIC_MODIFIER_NAME_oe_ely_relic_humble_start_mod: "拓荒者的坚韧起点"
 STATIC_MODIFIER_DESC_oe_ely_relic_humble_start_mod: "尽管大批珍宝在风暴中沉入大西洋，幸存的开拓者仍以务实劳作在荒野筑起新家园。"
 oe_ely.1.title: "第四奥德赛：向日落之海启航"
 oe_ely.1.desc: "博斯普鲁斯的烽火已经吞没了旧帝国最后的屏障，新月旗在色雷斯与爱琴海步步逼近。就在元老与将军们绝望之际，皇室图书馆的航海家展开一卷残存的古老海图——相传在赫拉克勒斯之柱以西，越过无尽大洋，存在着一片沃野千里的极乐之洲。是倾尽残余船舰与百姓西渡重开新罗马，还是留在爱琴海废墟中死战到底？"
 oe_ely.1.a: "启动「方舟计划」——罗马圣火绝不在东方熄灭！"
 oe_ely.1.a.tt: "正式启动《第四奥德赛：圣火西渡》局势，进入舰队备船与跨大西洋航程。"
 oe_ely.1.b: "绝不弃守故土，我们将留在旧大陆战斗到底。"
 oe_ely.1.b.tt: "婉拒西渡计划，完全保留既有东地中海流亡复苏与旧大陆剧情线（此后仍可通过决议重议）。"
 oe_ely.2.title: "《蒂迈欧篇》海图与赫斯珀里亚密议"
 oe_ely.2.desc: "在布拉赫奈宫最幽深的密室里，来自亚历山大、热那亚与特拉比松的星象学家齐聚一堂。他们将柏拉图《蒂迈欧篇》的残卷、腓尼基古老航志与大西洋季风记录拼合在一起，大胆断言：赫拉克勒斯之柱以西并非绝境，而是一座尚未被任何欧亚君主染指的宏伟大陆。若趁早倾国打造大洋方舟，双头鹰便能提前百余年君临新世界。"
 oe_ely.2.a: "倾国筹建大洋方舟，开启提前百年的第四奥德赛！"
 oe_ely.2.a.tt: "立即启动《第四奥德赛：圣火西渡》局势，跳过失城等待直接筹备跨洋远征。"
 oe_ely.2.b: "海图虽奇，仍须暂搁密议、先稳地中海基业。"
 oe_ely.2.b.tt: "暂缓西渡计划（1360 年前仍可随时通过决议重新启动）。"
 oe_ely.3.title: "拆解皇宫与征召最后一批瓦兰吉水手"
 oe_ely.3.desc: "船坞昼夜灯火通明，松木与铜钉堆积如山。大元帅与船政官呈上三份截然不同的装船方案：尽可能多载工匠、学者与拖家带口的希腊平民；将舱位优先留给久经沙场的瓦兰吉卫队与重甲水兵；抑或轻装简从、塞满淡水与干粮，以最快速度冲出大西洋。"
 oe_ely.3.a: "满载工匠与希腊百姓——带着一座活着的城市出海！"
 oe_ely.3.a.tt: "设定方舟人口档位为 #G 3 级（登陆投放约 5.0k 五阶层希腊人口）#!，但补给 #R -10#!、士气 #G +5#!。"
 oe_ely.3.b: "均衡编组，以瓦兰吉卫队与重型护航舰压阵。"
 oe_ely.3.b.tt: "设定方舟人口档位为 #Y 2 级（登陆投放约 3.2k 五阶层希腊人口）#!，士气 #G +15#! 并提升海军传统。"
 oe_ely.3.c: "精简轻装，把货舱全留给淡水、咸肉与备用帆索。"
 oe_ely.3.c.tt: "设定方舟人口档位为 #Y 1 级（登陆投放约 1.8k 五阶层希腊人口）#!，补给 #G +15#!、士气 #G +5#!。"
 oe_ely.4.title: "圣索菲亚圣物、秘典与希腊火装船"
 oe_ely.4.desc: "旗舰底舱的空间终究有限，必须在起锚前决定哪一类帝国至宝享有最高装船优先级：是圣索菲亚大教堂的千年圣像与牧首卷宗？是格弥斯托士·普勒托与古典罗马礼法孤本？还是皇家军械局严密看守的液态希腊火青铜喷管与炼金配方？这份抉择将在大洋彼岸深深烙印新罗马的灵魂。"
 oe_ely.4.a: "抢救圣索菲亚圣物与大牧首卷宗，让正教圣火照耀西海。"
 oe_ely.4.a.tt: "记录圣物倾向为 #G 西方正教（第二幕宗教伏笔）#!，保留圣物评分 #G +2#!，士气 #G +8#!。"
 oe_ely.4.b: "抢运普勒托手稿与古典罗马万神礼法孤本。"
 oe_ely.4.b.tt: "记录圣物倾向为 #G 古典复兴（第二幕罗马多神教伏笔）#!，保留圣物评分 #G +2#! 并提升文化传统。"
 oe_ely.4.c: "优先搬空皇家军械局的希腊火铜管与炼金秘录。"
 oe_ely.4.c.tt: "记录圣物倾向为 #G 皇家军械（火器与铜甲舰伏笔）#!，保留圣物评分 #G +2#! 并大幅提升海军传统。"
 oe_ely.5.title: "告别女王之城：焚契断航"
 oe_ely.5.desc: "黎明前的薄雾笼罩着马尔马拉海，数百艘满载紫旗、书箱与家眷的巨舰缓缓驶出金角湾。甲板上的老人最后一次回望圣索菲亚的穹顶，高声唱起古老的赞歌。航海长已将西地中海与赫斯珀里得斯外海的海图钉在罗盘桌上——从此刻起，帝国的命运系于大西洋的季风。"
 oe_ely.5.a: "列队起航，以帝国仪仗告别故都。"
 oe_ely.5.a.tt: "解锁西地中海与马卡罗尼西亚海图视野，获得「大洋方舟西渡舰队」修正，航程推进至第 2 阶段。"
 oe_ely.5.b: "焚毁旧港账册，强行征发沿岸粮船随行。"
 oe_ely.5.b.tt: "解锁海图视野并推进至第 2 阶段，补给 #G +12#!，但威望小幅受损。"
 oe_ely.6.title: "赫拉克勒斯之柱：强渡直布罗陀"
 oe_ely.6.desc: "摩洛哥与伊比利亚的巡逻桨帆船扼守着窄如咽喉的直布罗陀海峡，瞭望塔的号角已在夜色中响起。一旦在此受阻，整支流亡舰队都将沦为海盗与敌国的猎物。在巨岩阴影之下，舰队必须择机突入大西洋。"
 oe_ely.6.a: "午夜点燃希腊火喷管，从敌阵中央强行撕开缺口！"
 oe_ely.6.a.tt: "补给 #R -12#!，但全军士气 #G +12#!、保留圣物评分 #G +1#!，突破进入第 3 阶段。"
 oe_ely.6.b: "派遣快船递交重金过路费，换取今夜放行。"
 oe_ely.6.b.tt: "花费 50 黄金保住全部补给与典籍，士气 #G +5#!，进入第 3 阶段。"
 oe_ely.6.c: "降下紫旗伪装热那亚商队，抛弃笨重箱笼潜渡海峡。"
 oe_ely.6.c.tt: "补给 #R -5#!、保留圣物评分 #R -1#!，以最低战损潜入第 3 阶段。"
 oe_ely.7.title: "赫斯珀里得斯群岛：亚速尔与马德拉锚地"
 oe_ely.7.desc: "冲出海峡后，苍翠的火山岛屿浮现在苍茫大洋之间——古人称之为赫斯珀里得斯金苹果之岛。船底早已长满藤壶，淡水桶也见了底。这是踏入漫长无陆中大西洋前最后一次整补良机。"
 oe_ely.7.a: "停靠亚速尔安格拉良港休整，并在崖顶刻下罗马航标。"
 oe_ely.7.a.tt: "补给 #G +15#!、士气 #G +10#!，揭示中大西洋海图并留存 #G 亚速尔航标（第四幕重返旧大陆可用）#!，进入第 4 阶段。"
 oe_ely.7.b: "在马德拉丰沙尔砍伐良木修船，并满载甘蔗与果干。"
 oe_ely.7.b.tt: "补给 #G +20#!，获 35 黄金物资盈余，揭示中大西洋海图并进入第 4 阶段。"
 oe_ely.7.c: "驶往加那利特吉塞，以铜器向关切原住民和平换取淡水。"
 oe_ely.7.c.tt: "补给 #G +12#!，提升关切部落好感并积累 #G 原住民和平接触口碑#!，揭示中大西洋并进入第 4 阶段。"
 oe_ely.8.title: "马尾藻海死寂与大西洋飓风"
 oe_ely.8.desc: "连续两周的无风酷暑让海面覆盖满金褐色海藻，随后墨黑的飓风墙自东南天际扑面而来。巨浪拍碎了数艘货船的尾楼，桅杆在狂风中发出令人胆寒的呻吟。船长们大喊着请示陛下：是弃货保船，还是死守每一箱罗马瑰宝强冲风暴？"
 oe_ely.8.a: "抛弃重炮与笨重箱笼，全力保住水手与百姓性命！"
 oe_ely.8.a.tt: "补给相对宽裕 #G +15#!，但保留圣物评分 #R -1#!。"
 oe_ely.8.b: "锁死船舱，哪怕浪涛掀翻甲板也绝不丢弃帝国瑰宝！"
 oe_ely.8.b.tt: "保全全部圣物与方舟人口，但士气 #R -15#!、补给 #R -8#!。"
 oe_ely.8.c: "在暴风甲板上举行大祈祷或古典占卜，以信念稳住军心。"
 oe_ely.8.c.tt: "士气 #G +8#!、补给 #R -10#!，并按所携秘典类型获得正统性或文化传统加成。"
 oe_ely.9.title: "甲板哗变：返航的呼声"
 oe_ely.9.desc: "连绵风暴、腐臭的淡水与望不到尽头的西方地平线终于击穿了部分水手的神经。深夜里，几名桨手头目手持弯刀与火把冲上旗舰后甲板，高呼这片海没有尽头，要求立刻调头返回地中海。"
 oe_ely.9.a: "命瓦兰吉卫队持斧清场，以铁血军法维持航向！"
 oe_ely.9.a.tt: "士气回升 #G +15#!，但国家稳定受损。"
 oe_ely.9.b: "陛下当众立下《极乐洲元老宪章》誓约，许诺新大陆共治与分田！"
 oe_ely.9.b.tt: "记录 #G 新大陆元老宪章誓约（第二幕宪政伏笔）#!，士气 #G +25#!、补给 #G +5#!。"
 oe_ely.9.c: "天命未至——传令全舰队调头折返旧大陆。"
 oe_ely.9.c.tt: "仅 1337 立即远航模式可选：安全终止第四奥德赛局势并清除航行状态。"
 oe_ely.10.title: "魔鬼礁与圣尼古拉角"
 oe_ely.10.desc: "海鸟的鸣叫打破了大洋的死寂！船首前方是一圈碧绿珊瑚环绕的无人群岛——百慕大礁盘。狂风在礁石间发出鬼魅般的呼啸，但岛上丰沛的雨水、海龟与松柏足以拯救整支舰队。舰队水手们以航海圣徒之名，将其称作「圣尼古拉角」。"
 oe_ely.10.a: "留下一支水手守备队，在圣尼古拉角筑起大西洋导航灯塔。"
 oe_ely.10.a.tt: "若百慕大无主则立即归我、重命名为 #G 圣尼古拉角#! 并投放守备希腊人口与永久灯塔修正；补给 #R -5#!、士气 #G +5#!，推进至第 5 阶段。"
 oe_ely.10.b: "取水休整后顺墨西哥湾暖流直扑西方大陆！"
 oe_ely.10.b.tt: "补给 #G +5#!、士气 #G +8#!，揭示墨西哥湾暖流并推进至第 5 阶段。"
 oe_ely.11.title: "极乐洲在望！切萨皮克湾的紫旗"
 oe_ely.11.desc: "「陆地！西方的陆地！」主桅瞭望哨的嘶喊响彻云霄。眼前展开的不是孤岛，而是一片水网纵横、林木参天、群鱼跃浪的宏伟海湾——切萨皮克湾。岸边升起袅袅炊烟，洁白的细沙与黝黑的铁矿丘陵沿河绵延。历经数千里惊涛骇浪，罗马的双头鹰终于飞抵极乐之洲。"
 oe_ely.11.a: "全舰队鸣号下锚，准备踏上新罗马的土地！"
 oe_ely.11.a.tt: "揭示切萨皮克与北美东岸海图，士气 #G +15#! 并获得威望。"
 oe_ely.12.title: "岸边初会：南塞蒙德人的独木舟"
 oe_ely.12.desc: "长艇刚刚划入浅湾，数十艘轻巧的独木舟便从芦苇荡中滑出。舟上是身披鹿皮、手持弓箭的南塞蒙德部族猎手，他们惊愕地打量着高耸如山的紫色风帆与披甲罗马士兵。这第一次对视，将决定极乐洲与北美原住民未来百年的邦交基调。"
 oe_ely.12.a: "捧出泰尔紫布、铁斧与海盐，以古罗马盟邦之礼缔结初约。"
 oe_ely.12.a.tt: "花费 25 黄金换取补给 #G +10#! 并大幅提升南塞蒙德部族好感，为首冬玉米援助与 #G 第二幕盟邦（Foederati）路线#! 铺路。"
 oe_ely.12.b: "命旗舰向浅滩鸣放希腊火炮，以天威震慑四方部族！"
 oe_ely.12.b.tt: "获得威望与士气 #G +10#!，但激怒南塞蒙德部族，为 #G 第二幕铁血边疆（Limes）路线#! 铺路。"
 oe_ely.13.title: "新君士坦丁堡奠基与旧世脱钩"
 oe_ely.13.desc: "三支登陆纵队顺利占据切萨皮克湾口三处紧邻要地：切萨皮克角面向大洋、南塞蒙德湾坐拥满分天然深水良港、基斯基亚克丘陵蕴藏珍贵铁矿。此刻，皇帝亲执青铜犁在岸边划出新都城界，宣布彻底与动荡的旧大陆残土脱钩，以「极乐洲新罗马（Nova Elysia）」之名重开帝国纪元！唯有一项定都抉择尚待御笔亲裁："
 oe_ely.13.a: "正统定都切萨皮克角「新君士坦丁堡」，兴建人工金角湾防波堤！"
 oe_ely.13.a.tt: "接管切萨皮克三地并古典重命名，#G 先迁都新君士坦丁堡（附加永久人工防波堤修正）#!、投放五阶层希腊移民并开辟本土市场、激活殖民 2.0 极乐洲接口、安全交割旧大陆残土与停战，正式更名 #G 极乐洲新罗马#!！"
 oe_ely.13.b: "务实定都南塞蒙德「西海金角港」，依托满分天然深水良港建都！"
 oe_ely.13.b.tt: "接管切萨皮克三地并古典重命名，#G 先迁都西海金角港（附加永久天然深水良港修正）#!、投放五阶层希腊移民并开辟本土市场、激活殖民 2.0 极乐洲接口、安全交割旧大陆残土与停战，正式更名 #G 极乐洲新罗马#!！"
 oe_ely.14.title: "极乐洲的第一个冬天：玉米与黑麦"
 oe_ely.14.desc: "切萨皮克湾的第一个严冬远比爱琴海酷烈。从船舱带来的地中海黑麦尚未成熟，北风便已冻裂了简陋的木屋，随船面粉眼看即将告罄。新罗马能否挺过这个凛冬，全赖岸上的筹谋。"
 oe_ely.14.a: "接受南塞蒙德与波瓦坦盟友赠予的玉米良种与越冬农法！"
 oe_ely.14.a.tt: "获得 25 年「切萨皮克玉米农耕适应」修正，并进一步巩固与波瓦坦诸部的邦交。"
 oe_ely.14.b: "动用国库黄金向船队强制配给，硬扛过这片严冬。"
 oe_ely.14.b.tt: "花费 45 黄金并获得 10 年「首冬舰队配给法令」修正（稳住口粮但小幅降低市民满意度）。"
 oe_ely.15.title: "极乐洲帝国宪章宣告"
 oe_ely.15.desc: "登陆整整一周年，新君士坦丁堡的木石城墙已初具规模，码头上响起造船匠的斧凿之声，圣火在西大西洋的晨风中熊熊燃烧。皇帝与流亡元老院共同将《极乐洲帝国宪章》镌刻在青铜碑上——第一幕「圣火西渡」圆满落幕，属于新大陆罗马的立国史诗正徐徐展开。"
 oe_ely.15.a: "立碑明志——极乐洲新罗马永世长存！"
 oe_ely.15.a.tt: "获得威望与文化传统，按第一幕保留圣物评分发放永久里程碑修正，并正式交棒给第二幕立国主线。"
 oe_ely.16.title: "【审计】第四奥德赛西渡航程读数"
 oe_ely.16.desc: "第四奥德赛（第一幕 · oe_ely_）只读状态读数：\n· 模式（0 流亡触发 / 1 1337立即 / 2 关闭）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_mode')|0]\n· 航程阶段（0 未启航 / 1–5 航行 / 6 已定都）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_stage')|0]（局势历时：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_voyage_months')|0] 月）\n· 舰队士气：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_morale')|0] / 100 | 舰队补给：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_provisions')|0] / 100\n· 保留圣物评分：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_relics')|0] / 5（倾向 1正教/2古典/3军械：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_relic_focus')|0]）\n· 方舟人口档位（1–3）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_ark_tier')|0] | 首接触倾向（1和/2威）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_contact')|0]\n· 航标留存（亚速尔 / 百慕大）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_azores_beacon')|0] / [ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_bermuda_beacon')|0]\n· 登陆建国（0/1）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_settled')|0] | 定都选择（1切萨皮克/2南塞蒙德）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_cap_choice')|0]\n· 旧大陆脱钩校验码（1全移交/2含兜底弃地/3残余）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_old_world_code')|0]（已交割地点数：[ROOT.GetCountry.MakeScope.ScriptValue('oe_ely_rd_ceded_n')|0]）"
 oe_ely.16.a: "合上航海日志。"
