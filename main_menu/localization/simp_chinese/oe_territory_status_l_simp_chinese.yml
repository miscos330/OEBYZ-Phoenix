l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_ts_status_core: "地位：内地"
 STATIC_MODIFIER_DESC_oe_ts_status_core: "帝国腹地的行省，长官由皇帝任免，离心最慢。"
 STATIC_MODIFIER_NAME_oe_ts_status_frontier: "地位：边镇"
 STATIC_MODIFIER_DESC_oe_ts_status_frontier: "与外国接壤的边镇，督军握有更多兵权，也更难驾驭。"
 STATIC_MODIFIER_NAME_oe_ts_status_exarch: "地位：总督区"
 STATIC_MODIFIER_DESC_oe_ts_status_exarch: "远方再征服之地，总督兼管军政，每月把一成收入上缴国库。"
 STATIC_MODIFIER_NAME_oe_ts_status_charter: "地位：特许城邦"
 STATIC_MODIFIER_DESC_oe_ts_status_charter: "由本地议会自治的特许城邦，向国库缴纳一成半税基贡金，不出兵。"
 STATIC_MODIFIER_NAME_oe_ts_status_despot: "地位：宗室封邑"
 STATIC_MODIFIER_DESC_oe_ts_status_despot: "皇室成员治理的专制公国，每月把半成收入上缴国库。"
