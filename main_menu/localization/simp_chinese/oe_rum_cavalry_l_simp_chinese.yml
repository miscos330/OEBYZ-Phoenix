l_simp_chinese:
 OE_HETAIREIA_CAVALRY_BARRACKS_LIMIT: "罗姆文化地点上的赫泰里亚军营（轻、重骑共用）"
 OE_HETAIREIA_CAVALRY_SHARED_LIMIT_TT: "图科波洛伊与罗姆甲胄骑兵的所有时代现有编制合计，尚未达到军营提供的共用上限。"
 oe_rum_cataphracts_1: "罗姆链甲骑兵"
 oe_rum_cataphracts_1_desc: "罗姆军户将战马、长矛与代代修补的链甲带到帝国军旗下。他们以密集的骑阵接敌，愿以甲胄承受迎面的箭矢，为身后的同袍打开道路。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!、移动速度#R −0.25#!；使用昂贵重骑兵的征募和维护物资。\n\n#Y 时代升级路径：#!研发原版军事革新#Y 《职业军队》#!后自动解锁下一代（完整链：职业军队 → 枪刺与射击 → 炮兵应用 → 军事革命 → 全民动员），完成后可直接在部队界面点击升级。"
 oe_rum_cataphracts_2: "罗姆甲胄骑兵"
 oe_rum_cataphracts_2_desc: "军营将各家自备的甲马编成统一的队列。骑手在号角声中压住步调，让枪尖与马蹄同时抵达敌阵。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!、移动速度#R −0.25#!；使用昂贵重骑兵的征募和维护物资。\n\n#Y 时代升级路径：#!由原版革新#Y 《职业军队》#!解锁；研发#Y 《枪刺与射击》#!后解锁下一代（后续：炮兵应用 → 军事革命 → 全民动员），可直接在部队界面点击升级。"
 oe_rum_cataphracts_3: "罗姆重装枪骑兵"
 oe_rum_cataphracts_3_desc: "长枪愈发坚固，队列愈发严整。罗姆重骑不再轻率追逐溃散的散兵，而是等待步兵牵住敌阵，再以完整的骑队发动冲击。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!、移动速度#R −0.25#!；使用昂贵重骑兵的征募和维护物资。\n\n#Y 时代升级路径：#!由原版革新#Y 《枪刺与射击》#!解锁；研发#Y 《炮兵应用》#!后解锁下一代（后续：军事革命 → 全民动员），可直接在部队界面点击升级。"
 oe_rum_cataphracts_4: "罗姆重装手枪骑兵"
 oe_rum_cataphracts_4_desc: "手枪与马刀进入骑手的装备，旧日的勇武开始服从距离与时机的计算。披甲的骑兵在近处开火，继而以刀锋接续冲击。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!、移动速度#R −0.25#!；使用昂贵重骑兵的征募和维护物资。\n\n#Y 时代升级路径：#!由原版革新#Y 《炮兵应用》#!解锁；研发#Y 《军事革命》#!后解锁下一代（后续：全民动员），可直接在部队界面点击升级。"
 oe_rum_cataphracts_5: "罗姆胸甲骑兵"
 oe_rum_cataphracts_5_desc: "繁重的全身甲逐渐让位于坚实的胸甲。罗姆骑队保留了正面突击的职责，却以更加统一的操典与行装适应新的战场。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!、移动速度#R −0.25#!；使用昂贵重骑兵的征募和维护物资。\n\n#Y 时代升级路径：#!由原版革新#Y 《军事革命》#!解锁；研发#Y 《全民动员》#!后解锁最终代，可直接在部队界面点击升级。"
 oe_rum_cataphracts_6: "罗姆近卫胸甲骑兵"
 oe_rum_cataphracts_6_desc: "数百年的甲骑传统凝聚为近卫胸甲骑兵的荣誉。他们被留在决战的关键时刻投入，以整齐而沉重的冲击打破敌军最后的抵抗。\n\n东罗马专属重骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通重骑兵：兵力伤害#G +10%#!、士气伤害#G +33%#!、主动性#G +3#!、移动速度#R −0.25#!；使用昂贵重骑兵的征募和维护物资。\n\n#Y 时代升级路径：#!最终时代形态，由原版军事革新#Y 《全民动员》#!自动解锁。"
