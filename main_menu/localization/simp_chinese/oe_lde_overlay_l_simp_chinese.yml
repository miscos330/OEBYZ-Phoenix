l_simp_chinese:
 oe_lde_none: ""
 oe_lde_ctry_YHN: "河南江北行省设于1291年，治汴梁路（今开封），管辖黄河以南、长江以北的中原腹地，是大都与江南之间的粮道与驿路所经。行省不是封国：丞相、平章政事等官由朝廷任免，军政钱粮都要听命于中书省。\n\n1337年，信阳州人棒胡以烧香聚众起事，行省左丞庆童领兵讨平。十四年后的1351年，刘福通在颍州起兵，红巾军由此席卷全省；1358年，他们攻下汴梁，奉韩林儿在此建都。察罕帖木儿次年收复汴梁，1368年明军北伐，行省终告瓦解。"
 oe_lde_ctry_YJZ: "江浙行省的前身是1276年设于扬州的江淮行省，1284年移治杭州，1291年改称江浙，管辖今浙江、福建和江苏、安徽的江南部分。这里是全国最富庶的地方，岁入税粮占天下三分之一以上，每年由海道北运大都。\n\n朝廷的命脉也是它的弱点。1348年方国珍聚众海上，截断漕运；1356年张士诚据平江，朱元璋取集庆，行省名存实亡。1357至1366年间，福建泉州又爆发波斯驻军首领赛甫丁与那兀纳掀起的“亦思巴奚兵乱”，后由忠元将领陈友定率军平闽复泉；杭州则在各方之间数度易手，直到1366年归于朱元璋。"
 oe_lde_ctry_YJX: "江西行省设于1277年，治龙兴路（今南昌），管辖今江西大部和广东。它南抵大海，广州是海舶云集的大港；赣江一线则是连接岭南与长江的通道。\n\n1337年，增城人朱光卿在广东起事，自立国号“大金”，行省出兵讨平。1351年后，徐寿辉的红巾军攻入江西，1358年陈友谅占据龙兴。1362年龙兴归降朱元璋，次年陈友谅回师围攻八十五日不下，终在鄱阳湖决战中败亡。"
 oe_lde_ctry_YHG: "湖广行省治武昌路，管辖今湖南、广西、海南、贵州大部和湖北南部，是大元疆域最广的行省之一。境内山岭深处多是瑶、僮、苗等族的溪洞，由世袭土官管理，行省平章常年要为“征蛮”调兵。\n\n1336年底起，广西瑶民接连起事，行省平章政事领兵征讨。1351年徐寿辉在邻省蕲水称帝，次年其部一度攻陷武昌。1360年陈友谅杀徐寿辉自立，以武昌为都；1364年朱元璋攻下武昌，湖广归于其手。"
 oe_lde_ctry_YSX: "陕西行省治奉元路（今西安，1312年由安西路改名），管辖关中、陕北、汉中和陇东。忽必烈之子安西王忙哥剌曾在此开府，位高权重；1307年安西王阿难答争位被杀，王府撤废，关中从此由行省直辖。1286年，四川从陕西分出，自为一省。\n\n1357年，红巾军分兵入关中，被察罕帖木儿和李思齐击退。此后李思齐、张良弼等军阀各据一方，互相攻伐，朝廷号令不行。1369年徐达率明军入奉元，改名西安。"
 oe_lde_ctry_YSC: "四川行省1286年从陕西分出，治成都路。蒙古与南宋在四川鏖战近半个世纪，合州钓鱼城到1279年才开城，战后四川户口十不存一，是各行省中人口最少的一个。\n\n1357年，徐寿辉部将明玉珍溯江而上，取重庆，继而攻占成都。陈友谅杀徐寿辉后，明玉珍闭关自守，1363年在重庆称帝，国号大夏。1371年明军两路入川，夏亡。"
 oe_lde_ctry_YLB: "岭北行省设于1307年，初名和林行省，1312年改称岭北，治和宁路，即蒙古帝国的旧都哈拉和林。它管辖漠北草原，是成吉思汗的“祖宗根本之地”，诸王牧地环列四周。漠北产粮不足，驻军与赈济所需的粮食要从中原千里转运。\n\n1360年，阳翟王阿鲁辉帖木儿在此起兵争位，次年兵败。1368年明军攻下大都，元廷北撤，漠北重新成为朝廷所在；1388年捕鱼儿海一战，脱古思帖木儿汗的营帐被明军攻破。"
 oe_lde_ctry_YLY: "辽阳行省设于1287年，正是东道诸王乃颜起兵被平定的那一年；治辽阳路，管辖辽东和整个东北，北到黑龙江口的奴儿干与海对面的库页岛。境内有汉人、女真人、契丹人、高丽移民，还有水达达等渔猎部落，东道诸王的封地也在其中。\n\n1359年，红巾军关铎、潘诚部攻破辽阳。元廷北撤后，纳哈出拥众二十万据守金山，到1387年才降明。"
 oe_lde_ctry_YGU: "甘肃行省设于1286年，治甘州路（今张掖），管辖河西走廊和西夏故地。这里是通往西域的咽喉，也是防备察合台汗国的前线，驻有重兵，粮饷多靠内地供给。走廊西端的瓜州、沙州一带由察合台后王出伯一系镇守。马可·波罗自称在甘州住过一年。\n\n元末中原大乱时，河西相对平静。1372年，明将冯胜率西路军出兰州，连下甘州、肃州，直抵瓜州、沙州，甘肃行省至此终结。"
 oe_lde_ctry_YLU: "鲁王是弘吉剌部首领的王号。弘吉剌氏出了成吉思汗的正妻孛儿帖，成吉思汗曾有旨：其家“生女世以为后，生男世尚公主”，于是世代与皇室通婚，是大元第一外戚。1270年，他们在达里诺尔湖畔筑应昌城，1297年又建全宁城，两城都由王府自置官属管理；1307年，首领琱阿不剌受封鲁王。\n\n1368年大都失守，元顺帝妥懽帖睦尔北奔，最后驻跸应昌，1370年病逝于此。同年明将李文忠攻破应昌，俘获皇孙买的里八剌，鲁王的封地就此不存。"
 oe_lde_ctry_YZW: "赵王是汪古部首领的王号。汪古人是信奉景教的突厥语部族，原为金朝守卫阴山以北的界壕。1204年前后，首领阿剌兀思剔吉忽里归附成吉思汗，约为世婚，汪古首领从此代代迎娶公主。14世纪初，首领受封赵王，王府在黑水之畔的德宁路（今敖伦苏木古城）。\n\n汪古王阔里吉思曾由若望·孟高维诺劝导改宗罗马公教，并在领地内建起教堂；他1298年出征西北，兵败被俘而死。元亡之后，汪古故地为明军与北元反复争夺，部众散入蒙古各部。"
 oe_lde_ctry_YBN: "豳王是察合台后王出伯一系的王号。出伯是察合台汗阿鲁忽之子，13世纪70年代离开察合台汗国，投奔忽必烈，此后率部镇守河西走廊的西端，抵御海都和都哇。1304年受封威武西宁王，1307年进封豳王。子孙分作几支：豳王是宗主（驻肃州一带），西宁王在沙州，肃王在瓜州，威武西宁王在哈密。1331年，不颜帖木儿受封豳王。在凤凰计划中，一个国家代表这一家全体，首都设在沙州。\n\n这一家崇奉佛教。1348年，西宁王速来蛮在莫高窟立六字真言碣，用六种文字刻成。1352年，西宁王牙罕沙奉命入蜀，次年与诸军在蕲水击败徐寿辉，然后回到沙州。大都失守后，他们仍留在嘉峪关外（同在河西的亦都护高昌王一系则在元亡后东归附明）：1380年明将濮英在赤斤站俘获豳王亦怜真，1391年明军攻破哈密，豳王别儿怯帖木儿被杀。明朝随后在这里设沙州、赤斤蒙古、哈密诸卫。"
 oe_lde_ctry_BYT01: "塞萨洛尼基是帝国的第二大城，“仅次于君士坦丁堡的共治之城”，守着瓦尔达尔河口和横贯巴尔干的艾格纳提亚大道。圣德米特里是它的主保圣人，每年十月的集市招来四方商旅。在凤凰计划中，它是一个帝国军区：只有治所归军区长官，辖区土地仍属皇帝。\n\n1342年，水手和平民组成的“狂热派”赶走贵族，自治八年。此后这座城在1387年向奥斯曼人开城，1403年归还帝国，1423年让给威尼斯，1430年被穆拉德二世攻陷。"
 oe_lde_ctry_OBY: "金角湾是君士坦丁堡北侧的深水港湾，千年来帝国的商港和船坞都在这里。到14世纪，对岸加拉塔的热那亚人已经把生意抢走大半：据格里高拉斯记载，1348年前后加拉塔每年关税约二十万金币，君士坦丁堡自己只有三万。\n\n在凤凰计划中，“金角湾”是设在港边的特许银行：它不是真实存在过的机构，代表的是帝国把关税、汇兑和放贷收回自己手中的一种可能。"
 oe_lde_ctry_CSI: "李思齐是罗山人，元末与察罕帖木儿同起义兵讨红巾，1357年入关中，此后以凤翔为根据地，成为陕西最大的军阀。1337年陕西还在元朝陕西行省治下。\n\n他与张良弼等关中诸将长年相攻，朝廷屡次调停。察罕死后，他不肯听命于扩廓帖木儿，1367年被关中诸将推为盟主，共拒扩廓。1369年徐达入关，他弃凤翔西走临洮，随即降明，1374年去世。"
 oe_lde_dyn_oe_yz_khongirad_dynasty: "弘吉剌氏是蒙古草原东部的古老部族，以出美女著称。成吉思汗的正妻孛儿帖是弘吉剌首领特薛禅之女，其家因此世代与黄金家族通婚：女儿为后，儿子尚公主。忽必烈的皇后察必、武宗和仁宗的母亲答己都出自这一家。\n\n他们的首领先后受封济宁王、鲁王，驻应昌、全宁两城。1370年应昌陷落后，弘吉剌人散入蒙古诸部，后来成为内喀尔喀五部之一。"
 oe_lde_dyn_oe_yz_ongud_dynasty: "汪古部首领的家族，自称沙陀突厥李克用的后裔，世代信奉景教。阿剌兀思剔吉忽里归附成吉思汗后，这一家代代迎娶皇室公主，受封高唐王、赵王，镇守阴山以北。\n\n其中最有名的是阔里吉思：他精通儒学，藏书万卷，又在孟高维诺劝导下改宗罗马公教，1298年战败被俘，不屈而死。"
 oe_lde_dyn_oe_s37_kalothetos_dynasty: "卡洛塞托斯家族出自希俄斯岛。1329年，安德洛尼卡三世从热那亚的扎卡里亚家族手中收回希俄斯，岛上贵族利奥·卡洛塞托斯里应外合，事后被任命为该岛总督，直到1340年。他是约翰·坎塔库泽努斯的故交。\n\n内战之后，利奥出任旧福西亚总督。1357年，奥尔汗之子哈利勒被海盗掳至福西亚，他拒不交人，约翰五世亲自前来围城也无可奈何，最后是用重金和高官换回了这位王子。"
 oe_lde_dyn_oe_s37_philanthropenos_dynasty: "菲兰斯罗佩诺斯家族13世纪中叶起见于史册，出过多位将领和舰队统帅。最著名的是“酌酒官”阿莱克修斯：1293至1295年，他在迈安德河谷连败突厥人，军中拥戴他称帝，事败后被刺瞎双眼。\n\n将近三十年后，他获得赦免。1324年费拉德尔菲亚被围，年老失明的阿莱克修斯受命前往，突厥诸首领念其旧日威名，不战而退。1336年前后他出任莱斯沃斯总督，从热那亚人手中收回了米蒂利尼。"
 oe_lde_dyn_oe_lgr_tocco_dynasty: "托科家族出自南意大利的贝内文托，长期效命于那不勒斯和塔兰托的安茹王族。史实中，1357年塔兰托的罗伯特将凯法洛尼亚与扎金索斯封给莱奥纳多一世·托科，家族由此立足爱奥尼亚群岛，继而取得莱夫卡达与沃尼察。\n\n其子卡洛一世在1411年入主约阿尼纳，1416年夺取阿尔塔，以拜占庭专制公名号重聚伊庇鲁斯。此后奥斯曼人步步紧逼，1430年取约阿尼纳、1449年占阿尔塔；1479年奥斯曼与威尼斯瓜分群岛，托科家族失地流亡意大利。"
 oe_lde_dyn_oe_lgr_buondelmonti_dynasty: "布翁德尔蒙蒂家族是佛罗伦萨的古老贵族；1216年布翁德尔蒙特遇刺一案，在后世编年史中被视为佛罗伦萨归尔甫派与吉伯林派仇杀的开端。家族通过金融与联姻同那不勒斯安茹王室关系密切。\n\n史实中，马达莱娜·布翁德尔蒙蒂嫁给莱奥纳多一世·托科，其兄埃萨乌·布翁德尔蒙蒂则在1385年迎娶托马斯·普雷柳比奇的遗孀玛丽亚·安杰利娜，由此统治约阿尼纳。埃萨乌在阿尔巴尼亚各部与奥斯曼之间周旋至1411年去世，约阿尼纳遂转归外甥卡洛一世·托科。"
 oe_lde_dyn_oe_lgr_crispo_dynasty: "克里斯波家族出自伦巴第与维罗纳一带，移居爱琴海后作为萨努多公爵的附庸领有米洛斯岛。14世纪后期群岛公国动荡不安，家族借机进入纳克索斯的权力核心。\n\n史实中，1383年弗朗切斯科一世·克里斯波推翻并杀害末代达莱·卡尔切里公爵，在威尼斯默许下夺取群岛公国。克里斯波家族统治基克拉泽斯群岛近两个世纪，1537年向奥斯曼纳贡，直到1566年苏丹塞利姆二世废黜末代公爵贾科莫四世。"
 oe_lde_dyn_angelos_dynasty: "安杰洛斯家族出自吕底亚的费拉德尔菲亚，因与科穆宁皇室联姻而显贵，1185至1204年间出了伊萨克二世和阿莱克修斯三世两位皇帝。第四次十字军后，家族的科穆宁·杜卡斯支系在帝国西岸建立伊庇鲁斯与色萨利政权。\n\n1337年前后，约翰·安杰洛斯担任帝国酌酒官，是约翰·坎塔库泽努斯的近亲与干将。史实中，他在1341年内战爆发后拥护坎塔库泽努斯，受命总督色萨利与伊庇鲁斯，直到1348年死于黑死病。"
 oe_lde_dyn_monomachos_dynasty: "莫诺马霍斯家族是9世纪起见于史册的拜占庭文武世家，1042至1055年在位的君士坦丁九世·莫诺马霍斯即出自这一家，在位期间重修君士坦丁堡法学与哲学讲学机构，留下诸多建筑与法典。\n\n到14世纪，家族仍在地方任高官与将领。1333年前后安德洛尼卡三世收回色萨利，任命米海尔·塞纳赫雷姆·莫诺马霍斯为总督，授“首席尊者”头衔；1337年他正坐镇色萨利，直到1340年代初去世。"
 oe_lde_dyn_kastrioti_dynasty: "卡斯特里奥蒂家族出自阿尔巴尼亚中北部的马蒂与迪布拉山地，14世纪后期起以克鲁亚为中心扩展领地。吉翁·卡斯特里奥蒂一度据守克鲁亚一带，后来迫于形势向奥斯曼称臣并送子为质。\n\n史实中，其子乔治·卡斯特里奥蒂——世称斯坎德培——于1443年脱离奥斯曼军营返占克鲁亚，1444年在莱什联合阿尔巴尼亚诸领主组成同盟。此后二十五年间，他依托山地要塞屡次击退穆拉德二世与穆罕默德二世的大军，直到1468年病逝。"
 oe_lde_dyn_balsic_dynasty: "巴尔希奇家族原是塞尔维亚尼曼雅王朝治下泽塔（今黑山与阿尔巴尼亚北部）的地方贵族。1355年斯特凡·杜尚去世、塞尔维亚帝国解体后，巴尔沙一世与其三子斯特拉齐米尔、久拉奇一世和巴尔沙二世迅速崛起，控制了泽塔沿海与斯库台一带。\n\n史实中，巴尔希奇家族与波斯尼亚、卡尔·托皮亚、威尼斯及奥斯曼人反复角逐。1385年巴尔沙二世在萨夫拉之战阵亡，家族势力转衰；1421年无嗣的末代王公巴尔沙三世临终将泽塔托付给舅父、塞尔维亚专制公斯特凡·拉扎列维奇。"
 oe_lde_dyn_mrnjavcevic_dynasty: "姆尔尼亚夫切维奇家族在斯特凡·杜尚与其子乌罗什五世时期崛起为马其顿最有权势的塞尔维亚豪族。史实中，武卡申·姆尔尼亚夫切维奇于1365年在普里莱普受封共治国王，其弟约万·乌格列沙则以专制公身份据守塞雷斯。\n\n1371年，兄弟二人率军东进迎战奥斯曼人，在马里查河夜袭中双双阵亡，马其顿防线随之瓦解。武卡申之子马尔科仍守普里莱普，被迫向奥斯曼称臣，1395年战死于罗维纳，却在南斯拉夫民间史诗里成为家喻户晓的英雄“王子马尔科”。"
 oe_lde_dyn_dejanovic_dynasty: "德拉加什（德亚诺维奇）家族始于斯特凡·杜尚的妹夫、专制公德扬，在马其顿东部的库马诺沃与韦尔巴日德（今丘斯滕迪尔）一带拥有大片领地。史实中，1371年马里查之战后，德扬之子约万与康斯坦丁·德拉加什成为奥斯曼附庸，得以保住封地。\n\n康斯坦丁于1395年在罗维纳阵亡。他的女儿海伦娜·德拉加什嫁给拜占庭皇帝曼努埃尔二世·巴列奥略，成为约翰八世与末代皇帝君士坦丁十一世的母亲；君士坦丁十一世在位时亦常冠以母姓“德拉加塞斯”。"
 oe_lde_dyn_brankovic_dynasty: "布兰科维奇家族出自斯特凡·杜尚治下的奥赫里德总督、“至尊者”布兰科·姆拉德诺维奇。其子武克·布兰科维奇在科索沃与斯科普里一带建立起强大的领地，史实中曾参加1389年的科索沃之战，战后仍拒不轻易屈服于奥斯曼人。\n\n1427年，武克之子久拉奇·布兰科维奇继承舅父斯特凡·拉扎列维奇，成为塞尔维亚专制公；贝尔格莱德归还匈牙利后，他在多瑙河畔修筑了宏伟的斯梅代雷沃要塞。家族在匈牙利与奥斯曼之间苦撑至1459年斯梅代雷沃陷落，此后在匈牙利南部仍袭用专制公名号。"
 oe_lde_dyn_losha_dynasty: "洛沙家族是14世纪南迁进入伊庇鲁斯与埃托利亚的阿尔巴尼亚贵族部族，常为塞尔维亚及希腊统治者征战。史实中，1359年阿尔巴尼亚各部在阿赫洛奥斯河之战击败尼基福罗斯二世·奥尔西尼后，色萨利的塞尔维亚统治者西缅·乌罗什承认彼得·洛沙为阿尔塔专制公。\n\n彼得·洛沙坐镇阿尔塔，与约阿尼纳的托马斯·普雷柳比奇连年交兵，又以联姻暂息干戈。1374年瘟疫席卷阿尔塔，彼得染病身亡，其领地随之转归另一位阿尔巴尼亚首领约翰·布阿·斯帕塔。"
 oe_lde_dyn_spata_dynasty: "斯帕塔家族是14世纪中叶立足埃托利亚与阿卡纳尼亚的阿尔巴尼亚贵族。史实中，1359年阿赫洛奥斯河之战后，首领约翰·布阿·斯帕塔获西缅·乌罗什承认，领有安杰洛卡斯特龙并称专制公。\n\n1374年彼得·洛沙病逝后，约翰·布阿·斯帕塔接管阿尔塔，成为南伊庇鲁斯最强的阿尔巴尼亚领主；他于1378年击败医院骑士团，屡次迫使约阿尼纳求和。1399年他去世后，族人莫里斯与雅各布·斯帕塔勉力守城，直到1416年阿尔塔落入卡洛一世·托科之手。"
 oe_lde_dyn_preljubic_dynasty: "普雷柳比奇家族始于斯特凡·杜尚麾下的大将格雷戈里·普雷柳布，他于1348年受封凯撒并出任色萨利总督，1356年死于与阿尔巴尼亚人的冲突。史实中，1366年西缅·乌罗什把约阿尼纳封给其子托马斯·普雷柳比奇。\n\n托马斯迎娶西缅之女玛丽亚·安杰利娜，受封专制公，面对阿尔巴尼亚各部的连年围攻，屡次引奥斯曼援军入伊庇鲁斯。他在城中征敛苛刻、多疑寡恩，终在1384年被自己的侍卫刺杀，约阿尼纳随后迎立佛罗伦萨人埃萨乌·布翁德尔蒙蒂。"
 oe_lde_dyn_giustiniani_dynasty: "希俄斯的朱斯蒂尼亚尼并非单一血缘宗族，而是1362年在热那亚结成的商业贵族联盟（阿尔贝戈）。史实中，1346年热那亚私营舰队“希俄斯与福西亚商团”从拜占庭手中夺取希俄斯岛和福西亚，热那亚共和国无力偿还军费，遂将岛屿统治权和税收让与股东。\n\n股东诸家合称朱斯蒂尼亚尼，垄断希俄斯的乳香树胶与福西亚的明矾贸易，以股份制公司的方式治理海岛。1453年后他们向奥斯曼苏丹按年纳贡以保自治，直到1566年奥斯曼舰队乘隙夺岛，这处维持两个多世纪的商业领地才告终结。"
 oe_lde_dyn_rtr_ming_zhu_dynasty: "朱氏是大明皇室，始祖朱元璋生于濠州（今安徽凤阳）贫苦佃农之家。史实中，1344年淮北大旱瘟疫，父母兄长相继去世，他入皇觉寺为僧乞食，1352年投奔郭子兴红巾军，以谋略与军功迅速独当一面。\n\n1356年朱元璋攻占集庆（今南京），采纳“高筑墙、广积粮、缓称王”之策，先后于1363年鄱阳湖破陈友谅、1367年平江灭张士诚；1368年称帝建明，遣徐达北伐攻克大都。朱氏统治中国二百七十六年，直至1644年北京陷落。"
 oe_lde_dyn_rtr_chen_dynasty: "陈氏为元末汉政权创建者陈友谅一族。陈友谅生于湖北沔阳渔家，初为县吏，史实中元末投奔徐寿辉天完红巾军，凭骁勇与权谋掌管水陆精锐，连克江西、湖广重镇。\n\n1360年陈友谅杀徐寿辉，在武昌称帝，国号大汉，造高大战舰东下与朱元璋争夺长江下游。1363年双方在鄱阳湖决战三十余日，陈友谅大败中流矢身亡；次年其子陈理在武昌降明，大汉随之覆灭。"
 oe_lde_dyn_rtr_wu_zhang_dynasty: "张氏为元末据守江南的张士诚一族。张士诚本是泰州白驹场的运盐舟子，史实中1353年与诸弟聚众起兵，占据高邮，国号大周；1356年渡江攻占平江（今苏州），坐拥太湖与两浙最富庶的州县。\n\n1357年张士诚一度降元以缓和南北压力，1363年改称吴王，境内安富却疏于进取。朱元璋灭陈友谅后大举东征，1367年攻破平江，张士诚被俘押至应天自缢，张吴政权终结。"
 oe_lde_dyn_rtr_xia_ming_dynasty: "明氏为元末四川大夏政权创建者明玉珍一族。明玉珍是湖北随州人，初结乡兵自保，史实中投归徐寿辉红巾军，1357年奉命溯江入蜀，克重庆、定成都，在巴蜀建立稳固根据地。\n\n陈友谅杀徐寿辉后，明玉珍闭关拒不从命，1363年在重庆称帝，国号大夏，轻徭薄赋、境内颇安，1366年病逝。幼子明升即位后内乱频仍，1371年明军两路入川，明升出降，次年被明太祖迁置高丽，其后裔在朝鲜半岛延续至今。"
 oe_lde_cult_oe_roman_noble_culture: "晚期罗马与拜占庭帝国的统治维系于一个以君士坦丁堡为核心的官僚与军政阶层：他们信奉东正教，受古典希腊文法与修辞教育，无论出身巴尔干、小亚细亚还是高加索，入仕朝廷与军区后皆以“罗马人”自居。\n\n在凤凰计划中，“罗马官员”代表派驻君士坦丁堡及各帝国军区的文武官僚群体，区别于各行省的乡土居民；它不是史实中独立的民族，而是为表现帝国军区与官僚体制而设的文化类别。"
 oe_lde_ctry_WHO: "左翼白帐是术赤长子斡儿答后王世守的东部兀鲁思，治昔格纳克，统辖钦察草原东部与锡尔河北岸草原，是金帐汗国的东方屏障与游牧劲旅所在。在凤凰计划的1337年开局中，左翼白帐作为术赤兀鲁思翼部拱卫萨莱汗廷。\n\n14世纪中后期萨莱陷入“大混乱”后，白帐诸王相继西向争衡：兀鲁思汗整军控扼草原东部，其族人脱脱迷失借帖木儿之助先夺白帐、继而在1380年前后一统金帐大位。15世纪初白帐体系渐告瓦解，余部演化为大帐、诺盖与哈萨克汗国等草原势力。"
 oe_lde_ctry_SBR: "昔班兀鲁思是术赤第五子昔班后王牧领的北方草原翼部，治钦吉图拉（今秋明一带），控乌拉尔山以东至托博尔河、鄂毕河之间的森林草原带。境内盛产黑貂等珍贵毛皮，串联草原商道与北方林区贡赋网络；在凤凰计划的1337年开局中作为术赤兀鲁思之一向萨莱纳贡。\n\n金帐大乱之后，昔班系诸王脱离萨莱号令，在15世纪建立秋明汗国与西伯利亚汗国，另有一支南下河中建立布哈拉昔班尼王朝。16世纪后期库楚汗统治西伯利亚期间，哥萨克首领叶尔马克翻越乌拉尔山，1582年攻克喀什里克，开启俄国向西伯利亚东进的序幕。"
 oe_lde_ctry_KHW: "花剌子模坐落于阿姆河下游的肥沃绿洲，治玉龙杰赤（旧乌尔根奇），自古扼守中亚通往波斯、呼罗珊与里海北岸的商路咽喉。1337年在凤凰计划中由弘吉剌氏大将忽都鲁帖木儿家族代萨莱汗廷镇守，是金帐汗国最为富庶的商贸与手工业中心，也是萨莱财赋与学术的重要依托。\n\n萨莱陷入大混乱后，弘吉剌氏后人胡赛因·苏菲在玉龙杰赤自立，建立苏菲王朝并铸造自己的钱币。1372至1388年间帖木儿五次亲征花剌子模，最终夷平玉龙杰赤城池；16世纪初乌兹别克昔班系重新定居绿洲，由此演化出希瓦汗国。"
 oe_lde_ctry_KZN: "保加尔-喀山扼守伏尔加河中游与卡马河交汇处，自伏尔加保加尔时代起便是北方毛皮与东方银币汇聚的商贸重镇。蒙古西征后归入术赤兀鲁思，在凤凰计划的1337年开局中以保加尔-喀山万户（治喀山）归属金帐体系，既控中伏尔加粮道与水路，也直面东北罗斯诸公国。\n\n1438年前后，失势的前金帐大汗兀鲁·穆罕默德率部据有喀山，建立独立的喀山汗国，与莫斯科大公国围绕伏尔加中游霸权和商路反复角逐百余年。1552年，沙皇伊凡四世亲率大军围攻并攻克喀山，俄国由此贯通伏尔加河全线并打开通往乌拉尔与西伯利亚的门户。"
 oe_lde_ctry_ELR: "15世纪中叶博斯普鲁斯海峡暮色降临之际，不肯向奥斯曼低头的罗马皇室、瓦兰吉残部与希腊水手率大船队扬帆西渡大西洋，在切萨皮克湾畔筑起新君士坦丁堡，建立被称为“第四罗马”的极乐洲新罗马帝国。\n\n流亡帝国将罗马法典、希腊火与帝国元老院传统移植于新大陆沃野之间，一边在北美东岸拓殖筑港、与新世界诸邦交往角逐，一边翘首东望爱琴海与故都紫宫，誓要让凤凰浴火重生于大洋两岸。"
 oe_lde_dyn_megas_komnenos_dynasty: "大科穆宁家族出自1185年被推翻的拜占庭皇帝安德洛尼卡一世·科穆宁之孙阿莱克修斯与大卫。1204年君士坦丁堡陷于第四次十字军之际，兄弟二人借外祖家格鲁吉亚塔玛尔女王之助攻占黑海南岸，建立特拉比松帝国，自称“大科穆宁”以彰显科穆宁正统，与君士坦丁堡的巴列奥略皇室分庭抗礼。\n\n大科穆宁皇室以丝路海港贸易与跨族联姻维系国祚：1458年，皇女狄奥多拉（德斯皮娜·哈敦）嫁与白羊部雄主乌尊哈桑，企图结成抗衡奥斯曼的东方同盟。1461年穆罕默德二世攻克特拉比松、末代皇帝大卫被俘遇害，但大科穆宁一系在黑海与东正教世界仍长期保留罗马法理的象征意义。"
 oe_lde_dyn_komnenos_doukas_dynasty: "科穆宁·杜卡斯家族是1185至1204年统治拜占庭的安杰洛斯皇室之西岸支系，自冠声望卓著的科穆宁与杜卡斯母系姓氏。第四次十字军攻陷君士坦丁堡后，米海尔一世·科穆宁·杜卡斯在阿尔塔建立伊庇鲁斯专制公国，其弟狄奥多尔于1224年攻克塞萨洛尼基并加冕称帝，一度成为复国竞争中声势最盛的希腊政权。\n\n1230年克洛科特尼察之战败于保加利亚后，家族西岸霸业受挫，塞萨洛尼基终归尼西亚帝国，领地遂分治于伊庇鲁斯与色萨利两支。此后近一个世纪间，科穆宁·杜卡斯诸专制公在拜占庭、那不勒斯安茹与塞尔维亚之间纵横周旋，至1318年伊庇鲁斯正系绝嗣而转入奥尔西尼家族之手。"
 oe_lde_dyn_palaiologos_monferrato_dynasty: "蒙费拉托·巴列奥略家族是拜占庭巴列奥略皇室扎根意大利北部的分支。皇帝安德洛尼卡二世迎娶蒙费拉托的伊琳娜（约兰达）为后，1305年蒙费拉托阿勒拉米奇男系绝嗣后，皇子狄奥多尔一世·巴列奥略于1306年西渡皮埃蒙特，继承蒙费拉托侯国，并以卡萨莱和基瓦索为据点融入意大利诸侯格局。\n\n这一支系统治蒙费拉托两百余年，既与热那亚、萨伏依、米兰维斯孔蒂等强邻周旋，又始终维系着同君士坦丁堡的血缘与外交联系，并在意大利战争爆发后成为拜占庭介入亚平宁事务的天然桥头堡。1533年末代侯爵乔瓦尼·乔治去世绝嗣，蒙费拉托侯国随后由曼图亚的贡扎加家族继承。"
 oe_lde_cult_oe_zaporozhian_cossack: "扎波罗热哥萨克得名于第聂伯河下游险滩以南（“险滩之后”）的草原湿地，由逃离农奴制与边疆战乱的东斯拉夫自由民、猎人与军士汇聚而成。他们以河心岛屿上的堡垒营地“塞契”为中枢，实行军营大会民主议事，公推盖特曼与军官统领舟师与轻骑。\n\n16至17世纪间，扎波罗热军团一面乘独木战舟突袭黑海沿岸的奥斯曼与克里米亚据点，一面在波兰-立陶宛、莫斯科与克里米亚汗国之间周旋求存。1648年赫梅利尼茨基起义建立自治盖特曼国，深刻改写了东欧草原与黑海北岸的政治版图。"
 oe_lde_cult_oe_don_cossack: "顿河哥萨克兴起于顿河流域与黑海北岸的“荒野”草原边疆，最初是沿河渔猎、护商并抵御游牧袭扰的自由武装社群。他们沿顿河两岸修筑称为“斯塔尼察”的武装屯堡，以切尔卡斯克为军团核心，在传统上坚持“顿河不交逃人”的自由法度。\n\n16世纪后期起，顿河哥萨克逐渐成为莫斯科南疆最重要的骑兵屏障，既常年守望克里米亚与诺盖骑兵的北侵，也在1637年突袭并固守阿速要塞五年之久。随着俄国帝国版图南推，顿河军团最终纳入沙皇编制，成为帝国最著名的边疆轻骑兵力量。"
 oe_lde_cult_oe_yaik_cossack: "雅伊克哥萨克活跃于流入里海北岸的雅伊克河（今乌拉尔河）下游，由来自伏尔加与顿河的自由哥萨克于16世纪中后期东迁建立。他们扼守诺盖草原、卡尔梅克牧场与里海北岸的渔盐商路，以雅伊茨克（今乌拉尔斯克）为重镇，兼营鲟鱼渔业与边疆骑兵防务。\n\n由于远离莫斯科中枢，雅伊克哥萨克长期保持浓厚的自治传统与旧礼仪派信仰，既为俄国东南边疆充当斥候与屏藩，也多次因朝廷收权而爆发剧烈冲突。1775年普加乔夫起义平息后，女皇叶卡捷琳娜二世将雅伊克河与军团一律改名为“乌拉尔”，以抹去旧日叛乱记忆。"
 oe_lde_cult_oe_terek_cossack: "捷列克哥萨克是北高加索地区历史最悠久的哥萨克边疆群落，16世纪后期起定居于捷列克河两岸的河谷与格列本山麓，是最早深入高加索北坡的东斯拉夫军屯群体。他们长期与车臣、卡巴尔达、库梅克等山地部族毗邻共处，既相互攻防又互通婚俗与装束。\n\n捷列克军团吸收了高加索山地战法、长袍切尔克斯卡服饰与山地轻骑技艺，形成独具高加索色彩的哥萨克文化。随着俄国经略高加索防线，捷列克屯堡成为连接阿斯特拉罕与格鲁吉亚通道的核心堡垒链。"
 oe_lde_cult_oe_siberian_cossack: "西伯利亚哥萨克肇始于1581至1582年叶尔马克率志愿哥萨克越过乌拉尔山、击破西伯利亚汗国的远征。此后百余年间，这批以服役哥萨克为主体的拓荒军士沿托博尔河、鄂毕河与叶尼塞河修筑木寨要塞，收缴毛皮实物税，将俄国疆界迅速推进至北亚腹地。\n\n与早年自治的顿河、扎波罗热军团不同，西伯利亚哥萨克从诞生起便紧密依附于边城总督与草原防线，后来演变为守卫西西伯利亚与哈萨克草原北缘的常备哥萨克军团，在北亚垦殖与商道护卫中扮演关键角色。"
 oe_lde_cult_oe_kuban_cossack: "库班哥萨克扎根于塔曼半岛与库班河流域的黑海东岸草原，扼守阿速海咽喉与高加索山脉西麓。其主体源自1775年扎波罗热塞契撤裁后南迁的黑海哥萨克，与当地高加索边线哥萨克合流，兼具第聂伯河旧军团的舟骑传统与高加索边疆的严密防务。\n\n他们以叶卡捷琳诺达尔为军团中心，在黑海东岸屯垦筑垒、巡守高加索西段防线，长期保留乌克兰语方言、传统哥萨克歌谣与高加索骑兵装束，是黑海北东岸最具代表性的边疆军屯文化之一。"
 oe_lde_cult_oe_ural_cossack: "乌拉尔哥萨克分布于乌拉尔河中上游及乌拉尔山南麓的草原防线，与下游的雅伊克哥萨克同源共脉。1775年普加乔夫起义结束后，俄国朝廷将原雅伊克哥萨克正式更名为乌拉尔哥萨克，并纳入更严密的军政管辖体系。\n\n作为横跨欧亚分界线的边疆军屯，乌拉尔哥萨克既在乌拉尔河沿线经营渔场与牧群，又常年充当护卫奥伦堡商队与守御中亚草原北缘的轻骑兵，保留了鲜明的旧礼仪派传统与自治乡规。"
 oe_lde_cult_oe_volga_cossack: "伏尔加河哥萨克最初是由游弋于伏尔加河中下游的自由水手与草原骑兵组成的武装群体，16世纪莫斯科攻克喀山与阿斯特拉罕之后，他们常年活跃于萨拉托夫至察里津一线，负责护送伏尔加河官船商队、清剿水盗并防备诺盖与卡尔梅克骑兵的越河袭扰。\n\n18世纪俄国在察里津防线正式编组伏尔加哥萨克军团，后因防务东移南拓，其大部官兵于1770年代调往北高加索莫兹多克与捷列克一线充实边防，余部并入阿斯特拉罕哥萨克体系。"
 oe_lde_cult_oe_transbaikal_cossack: "外贝加尔哥萨克形成于17世纪中叶俄国拓荒者越过贝加尔湖、进入色楞格河与石勒喀河流域之后，由东进的西伯利亚哥萨克与归附的布里亚特、鄂温克等草原林区骑兵长期融合而成。他们驻守尼布楚、色楞金斯克等远东要塞，直面漠北蒙古与清朝边防。\n\n1689年《尼布楚条约》划定东段边界后，外贝加尔哥萨克成为守卫中俄边卡与远东驿道的核心兵源；1851年正式编为外贝加尔哥萨克军团，既是黑龙江流域远征的先锋，也是欧亚最东端独具多民族色彩的边疆骑兵社群。"
 oe_lde_ctry_CRI: "克里米亚半岛北连钦察草原、南临黑海商道，1337年在凤凰计划中已作为克里米亚万户归属术赤兀鲁思体系，治所在索尔哈特，与沿岸热那亚人盘踞的卡法（加扎里亚）及山地狄奥多罗公国并立对峙。金帐盛世时它拱卫黑海北岸门户；大乱起后便渐成格来家族与各路草原豪强角逐自立的根基。\n\n哈吉一世·格来建立汗国。奥斯曼在1475年夺取卡法后，他的儿子明里一世·格来接受苏丹为宗主，又于1502年灭掉大帐汗国。诸汗以巴赫奇萨赖的宫殿为大本营，派骑兵北上劫掠，把波兰立陶宛和莫斯科的俘虏驱往卡法的奴隶市场。汗德夫莱特一世·格来在1571年焚毁莫斯科，但俄国步步南进，叶卡捷琳娜二世终于在1783年吞并克里米亚。"
 oe_lde_ctry_QAS: "齐王是成吉思汗之弟、以善射闻名的拙赤·合撒儿一系的王号，封地在蒙古东部，牧场在大兴安岭以西。朝廷每年按“搠只哈撒儿位”颁给岁赐。1337年前后在位的是失列门，《元史》记他1352年以齐王身份向朝廷献马。\n\n元朝灭亡后，据说合撒儿的后裔组成了明朝的福余卫，成为科尔沁部的祖先。科尔沁的阿台汗在争夺蒙古汗位时与卫拉特为敌，1438年被杀；该部后来复起，1510年追随达延汗在达兰·特勤之战中获胜。1624年，科尔沁成为第一个归附努尔哈赤的蒙古部落，满洲人以封赏回报这份早早的忠诚。科尔沁孛儿只斤氏女子屡为清朝后妃，顺治帝之母孝庄文皇后即出自此部。"
 oe_lde_ctry_HCN: "济南王位是成吉思汗之弟合赤温一系的封号，《元史》的岁赐名目里写作“哈赤温大王子济南王位”。这一家属于东道诸王，牧地在大兴安岭东侧的庆州一带。1337年的家主是谁，史书没有明确记载。\n\n东道诸王随元朝一同衰落。1368年元顺帝妥懽帖睦尔逃离大都后，明朝于1389年设立兀良哈三卫，任命成吉思汗诸弟的后裔统领泰宁卫。瓦剌首领也先后来赶走了三卫大部，福余卫却在嫩江流域坚持下来。其部众相传出自成吉思汗另一弟合撒儿，后来成为科尔沁部的祖先；科尔沁部于1624年归附努尔哈赤，成为满洲人的早期盟友。"
 oe_lde_ctry_OTC: "辽王是成吉思汗幼弟铁木哥·斡赤斤一系的王号，“斡赤斤”意为守护家中灶火的幼子。这一家是东道诸王之首，后人并不安分：一般认为出自这一系的乃颜1287年起兵反抗忽必烈，兵败被杀；1328年辽王脱脱又兵败身死。此后袭封的是牙纳失里，驻泰州一带。\n\n元朝覆亡后，明朝于1389年在东北将蒙古人编为兀良哈三卫，成吉思汗诸弟的后裔统领其中的泰宁卫。瓦剌首领也先太师在1446—1448年入侵时，多数卫众逃散，一说福余卫留在嫩江一带。福余卫的科尔沁后裔于1624年归附努尔哈赤，后来为清朝皇帝送去一位位皇后。"
 oe_lde_ctry_BGT: "广宁王是成吉思汗异母弟别里古台一系的王号。别里古台曾在角力中折断力士不里·孛阔的脊背，成吉思汗的子孙尊他为叔父。《元史》诸王表载，按浑察于至顺元年（1330年）受封广宁王，1337年在位。\n\n1368年元廷退出中原后，大兴安岭以东的东道诸王夹在两股势力之间：一边是1389年设立兀良哈三卫的明朝，一边是西面的瓦剌。别勒古台的一支后裔及其部众后来称为阿巴噶，意为“叔父”的部落。明末首领多尔济服属察哈尔的林丹汗，后来迁到克鲁伦河一带依附喀尔喀。他于1639年归附清朝的皇太极，他和一位族人的部众后来分别被编为旗。"
 oe_lde_ctry_OGE: "阳翟王是窝阔台之子灭里一系在元朝的王号。窝阔台之孙海都曾与忽必烈长年争夺草原，站在元朝一边的这一支则受封为王。《元史》诸王表在秃满、曲春、太平之后列帖木儿赤，1337年前后在位的就是他。1360年，阳翟王阿鲁辉帖木儿起兵争位，次年兵败。\n\n家族失去了土地，却没有失去血统的威望。信奉伊斯兰教的窝阔台系宗王阿里算端曾短暂登上察合台汗位；后来，不能称汗的征服者帖木儿先后以锁咬儿哈的迷失和其子算端马哈木的名义统治，后者1388年即位，钱币上铸着算端马哈木的名字。在蒙古高原，窝阔台系诸王争夺北元汗位；有史料把阿台汗的世系追溯到窝阔台，他一度统一大部分蒙古部落，直到1438年被明朝支持的瓦剌人消灭。"
 oe_lde_ctry_LNG: "云南王是元朝派驻云南的宗王的王号，始于忽必烈之子忽哥赤；镇守云南的宗王也有受封更高的梁王的。据辞书记载，1337年在位的是1334年受封的云南王阿鲁；其弟孛罗后来袭封，1355年进封梁王。宗王坐镇昆明，与云南行省并立，统辖大理总管和各地土司。\n\n红巾军将领明玉珍于1363年攻入昆明，大理总管段功出兵将其击退，末代梁王把匝剌瓦尔密将女儿阿盖公主嫁给段功；据明代以后的云南记载，两年后多疑的梁王派人刺杀段功，不过这一说法细节多有出入，梁段嫌隙似乎不久即告平息。明朝于1368年夺取中原后，把匝剌瓦尔密仍效忠北元，据守云南。洪武帝派傅友德、沐英统兵征讨，据称兵力达三十万；梁王于1382年先溺死妻子，随后自尽，沐英的部队则作为世袭驻军留镇云南。"
 oe_lde_ctry_SYG: "沈王是元朝在辽东所封的王号，为管治辽阳、沈阳一带的高丽移民而设，由高丽王室的一支持有，常与高丽国王争衡。1337年的沈王是忠烈王之孙、娶蒙古公主为妻的王暠，他一心觊觎高丽王位。\n\n王暠的本钱在元廷，不在辽东。他让元廷把前国王忠宣王流放西藏，又使忠肃王遭到拘禁；1339年他争夺高丽王位未果，1343年元朝使者逮捕忠惠王后，他曾短暂权署国王。其孙脱脱不花继承瀋王封号，却在1356年拒绝了高丽王位。退居蒙古的元廷于1374年再次试图让他登上高丽王位，最终未能成功。"
 oe_lde_ctry_WAL: "瓦拉几亚是喀尔巴阡山与多瑙河之间的罗马尼亚东正教公国，数百年间充当匈牙利与奥斯曼之间的缓冲。1337年在位的是开国君主巴萨拉布一世，定都肯普隆格，曾在波萨达山口设伏大败匈牙利国王查理一世。\n\n米尔恰一世在罗维纳迎战奥斯曼人，胜负各家说法不一；此后瓦拉几亚还是向苏丹纳了贡。王公弗拉德三世之父是龙骑士团成员，他因而人称“德古拉”；他穿刺处死苏丹使者，1462年在特尔戈维什泰夜袭穆罕默德二世大营，企图生擒苏丹。勇敢的米哈伊于1600年短暂统一瓦拉几亚、特兰西瓦尼亚和摩尔达维亚。后来奥斯曼任命法纳尔希腊人为王公，1821年弗拉迪米雷斯库起义后才恢复本地王公。"
 oe_lde_ctry_EPI: "伊庇鲁斯专制国是拜占庭西部海岸留下的希腊人政权，以阿尔塔为中心，起初收留第四次十字军之后的流亡者。1337年它已向皇帝称臣，由太后安娜摄政；此后几年，安德洛尼卡三世出兵把它重新并入帝国，任命西奥多尔·西纳齐诺斯为总督。\n\n拜占庭的统治没能持久。塞尔维亚贵族和阿尔巴尼亚部族瓜分了这片土地，约阿尼纳的统治者还请奥斯曼人出兵对付阿尔巴尼亚人。佛罗伦萨人埃萨乌·布翁德尔蒙蒂1399年被阿尔巴尼亚首领俘获，十五个月后靠巨额赎金获释。卡洛一世·托科到1416年重新控制各城，可土耳其人于1430年夺取约阿尼纳，最后的要塞沃尼察在1479年陷落。"
 oe_lde_ctry_FEO: "狄奥多罗又称哥特亚，是克里米亚南部山区一个说希腊语的小公国，以曼古普为中心。它由拜占庭的赫尔松军区演变而来，蒙古人1238年入侵后保持自治。教会上它是君士坦丁堡牧首区的哥特亚都主教区。1337年，相传出自加夫拉斯家族的王公统治着希腊人和克里米亚哥特人，与热那亚殖民地争港口；它与金帐汗国的关系，史料没有说清。\n\n1395年前后的一场劫掠（是谁所为说法不一）没有灭掉它，15世纪阿莱克修斯重建曼古普，开了卡拉米塔港，1433至1434年还同热那亚人争过琴巴洛；它又成了黑海上的小势力，比君士坦丁堡和特拉比松活得更久。王公斯蒂芬在1391年或1402年迁往莫斯科。1475年，格迪克·艾哈迈德帕夏攻陷曼古普，掳走了末代王公，公国就此灭亡。"
 oe_lde_ctry_GAZ: "加扎里亚是热那亚人在黑海沿岸的一串贸易殖民地，以克里米亚的卡法为统治中心；卡法是草原奴隶的大市场，奴隶多被买往埃及。金帐汗国于1308年攻占卡法，1337年重建的港口已重归热那亚。\n\n殖民地的法律于1341年汇编为《加扎里亚法典》。金帐汗国在1343至1347年间两度围攻卡法，逃离瘟疫的热那亚船只把黑死病带入地中海。1365年热那亚人夺取索尔代亚，1380至1381年的和约又给了他们哥特亚的海岸，1387年与汗国再次议和。热那亚于1453年将加扎里亚移交圣乔治银行，奥斯曼人则在1475年攻占卡法。"
 oe_lde_ctry_SAO: "萨洛纳是希腊中部的十字军领地，以要塞城镇安菲萨为中心。蒙费拉的博尼法乔任命了首任领主；末任法兰西领主托马斯三世战死于刻斐索斯河畔，加泰罗尼亚人获胜，阿方索·法德里克得到封邑，1337年仍在新帕特拉斯公国内统治此地。\n\n1379年，纳瓦拉雇佣军攻破了邻近的底比斯。摄政海伦娜·坎塔库泽娜不得人心，城中居民索性在1394年向巴耶济德一世开了城门。摩里亚专制国在1404年把领地卖给医院骑士团，这笔交易没能维持多久，奥斯曼人于1410年便永久征服了这座要塞小城。"
 oe_lde_ctry_ACH: "亚该亚亲王国由法兰克十字军建于伯罗奔尼撒，最初在安德拉维达议会划为十二个男爵领，多以新城堡为中心。1337年瓦卢瓦的凯瑟琳名义上为拉丁女皇，附庸于那不勒斯安茹国王。\n\n1381年起，实权落到纳瓦拉佣兵团手里。1404年，那不勒斯国王拉迪斯劳斯将亲王权卖给阿卡迪亚领主琴图廖内二世·扎卡里亚。拜占庭专制君主君士坦丁和托马斯·巴列奥略1430年攻占腹地，逼他把女儿凯瑟琳嫁给托马斯并立为继承人。1453年摩里亚起义，其子约翰·阿森·扎卡里亚被拥为亲王，1454年末遭托马斯的突厥盟军驱逐。"
 oe_lde_ctry_NEO: "新帕特里亚是色萨利南部的加泰罗尼亚公国，以新帕特拉斯为中心，公爵之名出自一场误读：色萨利的杜卡斯统治者的姓氏，被西方人当成了公爵的爵位。1318年约翰二世·杜卡斯无嗣而终，加泰罗尼亚佣兵团次年攻占新帕特拉斯。\n\n1337年它与雅典同属西西里王权，威廉二世为公爵。1348年斯特凡·杜尚席卷公国在色萨利的大部分领地，加泰罗尼亚人只剩新帕特拉斯周边。夹在纳瓦拉佣兵团与佛罗伦萨人内里奥·阿恰约利之间，加泰罗尼亚人1388年失去雅典，1390年失去新帕特拉斯；奥斯曼人随后不久夺取了该城和斯佩尔赫奥斯河谷。"
 oe_lde_ctry_ATH: "雅典公国是阿提卡和维奥蒂亚的十字军国家，首都底比斯。1311年在哈尔米罗斯，遭拒付军饷的加泰罗尼亚佣兵团放水淹了平原，法兰克骑士冲锋时陷入泥沼，被全歼。1337年的公爵是臣属于西西里的阿拉贡家族的威廉，政务通用加泰罗尼亚语。\n\n佛罗伦萨的阿恰约利家族在1385至1388年间攻占雅典：先取下城，卫城到1388年才陷落。奥斯曼人在1458年征服此城，穆罕默德二世亲自前来观看古迹，赞叹不已。帕特农神庙被改作清真寺，威尼斯的炮弹于1687年引爆了其中的奥斯曼火药库，1834年雅典成为独立希腊的首都。"
 oe_lde_dyn_gabras_dynasty: "加夫拉斯是拜占庭的贵族世家，出自特拉比松周围的山区哈尔迪亚。塞奥多雷·加夫拉斯于1075年从突厥人手中收复特拉比松，1081年起以近乎自立的总督身份统治哈尔迪亚，直至1098年战死，后来被尊为圣徒。\n\n君士坦丁·加夫拉斯约从1126年起以半独立王公身份统治哈尔迪亚，1140年被皇帝约翰二世·科穆宁平定。一说家族的克里米亚支系以悬崖上的曼古普为都，统治又称哥特亚的狄奥多罗公国；这层关系学者有争议。\n\n王公斯蒂芬于1391年或1402年携子格里高利移居莫斯科，俄罗斯的霍夫林和戈洛温家族都自称是他们的后裔。狄奥多罗的王公与沿海的热那亚殖民地争衡，同金帐汗国的关系史料没有说清；最终奥斯曼人于1475年攻陷曼古普，公国灭亡。"
 oe_lde_cult_pontic_greek_culture: "本都人是本都地区说希腊语的居民，分布在安纳托利亚东北部濒临黑海的山岳海岸。希腊人约在公元前700年建立了最早的殖民地，希腊化本都王国于公元前63年被罗马吞并。11世纪塞尔柱人的征服使当地与希腊语世界其他地区隔绝，本都希腊语方言因而在孤立中发展。\n\n1204年第四次十字军攻占君士坦丁堡后，科穆宁家族的一支在格鲁吉亚支持下建立特拉比松帝国。1337年时它仍是统治本都海岸的拜占庭后继政权，凭借丝绸之路贸易而富庶。黑海对岸克里米亚的卡法、索尔代亚等港口里，也住着同一种文化的希腊人。\n\n1461年帝国被苏丹穆罕默德二世攻灭。奥斯曼统治下，本都人作为东正教的商人、矿工和农民留居沿海，但偏远山区的社群逐渐改宗伊斯兰教并改用突厥语。"
 oe_lde_ctry_GLH: "术赤兀鲁思即金帐汗国，是西部草原上的蒙古汗国，以伏尔加河下游的萨莱为都。1337年，孛儿只斤氏的月即别汗已立伊斯兰教为国教，远至莫斯科的罗斯王公都向萨莱纳贡。在凤凰计划的1337年开局中，萨莱汗廷统摄左翼白帐、昔班、花剌子模、保加尔-喀山与克里米亚五翼兀鲁思，大乱起时各翼次第离心。\n\n1359年起的“大动乱”中，诸汗走马灯般更替。挟傀儡号令汗国的权臣马麦于1380年在库利科沃被莫斯科大公德米特里击败，脱脱迷失汗随后重新统一汗国，两年后火烧莫斯科。他又与昔日的恩主、征服者帖木儿反目，被帖木儿击溃，萨莱也遭洗劫。此后忙兀惕权臣也迪古挟立诸汗、纵横草原二十余年，仍未能挽回汗廷分裂之势。汗国从此分裂为喀山、克里米亚和阿斯特拉罕诸汗国；大帐汗国于1480年从乌格拉河退兵，这一事件传统上被视为“鞑靼枷锁”的终结，1502年它又被克里米亚所灭。"
 oe_lde_ctry_SMS: "西姆西尔在波斯《武功记》中写作西姆西姆，是纳赫人的王国，纳赫人即车臣人和印古什人的先民，其地在北高加索的山间峡谷。14世纪，它的君主向金帐汗国称臣纳贡，同时长期仍信奉基督教。\n\n最著名的王公加尤尔汗曾作为使者替汗出使罗斯诸城。金帐陷入内战时，他在1362年击败马麦，使西姆西尔独立。随后他支持脱脱迷失，纳赫人作为前锋于1395年在捷列克河与帖木儿交战。帖木儿同年兴兵报复，摧毁了西姆西尔，把居民逼入山里，幸存者放弃王公统治，改行氏族的自由议事会，也就是泰普制度。"
 oe_lde_cult_nakh_culture: "纳赫人又称瓦伊纳赫人，是高加索中部的东北高加索语族群，即车臣人和印古什人的先民。波斯史家把他们的高地氏族称为杜尔祖克人；12至13世纪，格鲁吉亚和阿兰的传教士在他们中间传播东正教。\n\n14世纪，他们的诸邦汇聚为西姆西尔王国，其基督教王公盖乌尔汗于1362年击败军阀马麦。他支持脱脱迷失，招来帖木儿的报复：1395年帖木儿摧毁西姆西尔，把民众赶入深山，并通过傀儡统治者植入伊斯兰教。低地的教会逐渐消亡，许多村庄恢复异教仪式；16至17世纪伊斯兰教再度推进，最终以沙斐仪派形式普遍流行。\n\n山区生活以互相竞争的泰普氏族为单位，建有石碉村落，受习惯法和血亲仇杀约束。18世纪起，他们抵抗沙皇向高加索的扩张。"
 oe_lde_cult_ryazanian: "梁赞人是奥卡河中游的东斯拉夫人，这里是罗斯东南边陲、森林与草原相接之地。他们的土地出自穆罗姆—梁赞遗产，1129年从切尔尼戈夫分立，有一系列面向游牧世界的边城。\n\n1237年12月拔都的大军攻陷并屠灭都城旧梁赞，王公家族几乎死绝，都城北迁至佩列亚斯拉夫尔—梁赞斯基，即后来的梁赞城。在金帐汗国治下重建后，梁赞王公在萨莱、莫斯科与草原之间周旋。1380年库利科沃之战时，奥列格·伊万诺维奇作为马麦的盟友按兵不动，1483年梁赞吞并普龙斯克公国。\n\n1521年末代王公逃奔立陶宛，梁赞终被瓦西里三世并入。梁赞方言属于南俄罗斯方言带，以“阿坎耶”弱读和与突厥邻人的接触为特征。"
 oe_lde_ctry_CYP: "塞浦路斯王国是东方最后一个十字军王国，由法兰西的吕西尼昂家族统治；阿卡陷落后，法马古斯塔港成为欧洲与亚洲贸易的中心。1337年，国王雨果四世在尼科西亚执政，仍自称耶路撒冷国王。\n\n他的儿子彼得一世遍访欧洲各国宫廷，招募十字军，并于1365年率舰队洗劫亚历山大；四年后，他被一派贵族刺杀。此后热那亚人夺取法马古斯塔，马穆鲁克军队又在1426年入侵，把国王雅努斯掳往开罗，塞浦路斯从此向埃及纳贡。1442年国王约翰二世娶了摩里亚专制公的女儿海伦娜·巴列奥略；1464年詹姆斯二世从热那亚人手里收回法马古斯塔。末代女王、威尼斯人卡特琳娜·科尔纳罗于1489年被迫把岛屿交给威尼斯；威尼斯统治此岛，直到1571年奥斯曼人攻下法马古斯塔。"
 oe_lde_ctry_GEO: "格鲁吉亚王国由巴格拉季奥尼王朝统治，以第比利斯为都，是高加索的基督教堡垒，四面环伺着伊斯兰强国。1337年，“光辉者”乔治五世正在摆脱伊儿汗国的宗主权、驱逐蒙古驻军，要重新统一塔玛尔女王黄金时代的王国。\n\n征服者帖木儿打断了这场复兴：自1386年起，他的大军一再入侵，攻陷第比利斯，把国王巴格拉特五世掳走。元气大伤的王国分裂为卡特利、卡赫季和伊梅列季，夹在奥斯曼与萨法维之间。萨法维的阿拔斯一世蹂躏卡赫季，卡赫季太后凯特万拒绝弃教，1624年在设拉子受酷刑而死。国王伊拉克略二世重新统一东部，于1783年接受俄国保护，但伊朗的阿迦·穆罕默德汗洗劫第比利斯时俄军并未到来，俄国反而在1801年吞并了这个王国。"
 oe_lde_ctry_HLG: "旭烈兀家族是成吉思汗之孙旭烈兀的孛儿只斤后裔，其蒙古军攻陷巴格达，建立了统治波斯与伊拉克的伊儿汗国。1335年伊儿汗阿布·赛义德无嗣而终，各派埃米尔竞相拥立宗室为傀儡；到1337年，伊儿汗拜都之孙、争位者木撒汗已退往伊拉克南部。\n\n木撒在贾加图之战后由埃米尔阿里·帕迪沙扶上汗位，但在凡湖附近的喀拉达拉，札剌亦儿王朝的哈桑·布祖尔格击溃了他的一方。他转而与东部争位者脱合帖木儿合兵夺取苏丹尼耶，结果被俘处死。阿拉伯伊拉克成为札剌亦儿王朝的腹地；巴士拉后来辗转于阿拉伯人穆加米斯部和穆沙沙之手，直到1508年沙阿伊斯玛仪一世将其纳入萨法维宗主权之下。"
 oe_lde_ctry_QAR: "黑羊是土库曼部落联盟，从凡湖一带起家，后来统治阿塞拜疆、伊拉克和伊朗西部。1337年黑羊尚未建国；14世纪，统治家族巴哈鲁人领有凡湖以北和摩苏尔周边，约1375年他们成为札剌亦儿王朝的附庸。在凤凰计划中，黑羊部在1350年代由首领拜拉姆·火者在速台人的土地上立国。\n\n首领卡拉·优素福为躲避帖木儿而流亡，在大马士革被马穆鲁克关押，与旧日盟友、札剌亦儿苏丹艾哈迈德同囚一处。帖木儿死后他获释，于1408年在萨德鲁德击败帖木儿之子米兰沙，后者阵亡；他后来又击败艾哈迈德。他的儿子贾汉·沙以“哈吉基”为笔名写突厥语诗，把黑羊推向极盛，1458年还占领了赫拉特。1467年白羊首领乌尊·哈桑突袭其军，贾汉·沙战死，黑羊不久瓦解。"
 oe_lde_ctry_AQQ: "白羊是土库曼部落联盟，从安纳托利亚东部的牧场起家，最终以大不里士为都统治伊朗。1337年，巴延杜尔部还是游牧劫掠者；后来首领图尔·阿里率众围攻特拉比松（1348年），从1352年起几位首领先后娶了特拉比松的公主。在凤凰计划中，白羊部在1350年代初在速台人的土地上立国。\n\n帖木儿把阿米德赐给白羊；“高个子”乌尊哈桑于1467年在穆什大破宿敌黑羊，杀死其君主贾汉·沙，随后又俘获帖木儿王朝的苏丹阿布·赛义德，后者被处死，白羊疆域从迪亚巴克尔直到克尔曼。他于1458年迎娶特拉比松皇女狄奥多拉（德斯皮娜·哈敦），又与威尼斯结盟抗衡奥斯曼，却在1473年于奥特卢克贝利被穆罕默德二世击溃。他的孙辈争夺王位，1501年，外孙伊斯玛仪一世率萨非教团奇兹尔巴什击溃白羊，夺取大不里士并称沙阿。"
 oe_lde_ctry_CDL: "大理是洱海畔白族的故土，段氏曾在此建立崇奉阿嵯耶观音的佛国，后被忽必烈的大军征服。1337年，段光在蒙古统治下以世袭总管身份治理故土。\n\n1363年，红巾军明玉珍部自四川攻陷昆明，蒙古梁王出逃，段光之弟段功率兵将其逐出云南，梁王以女儿阿盖公主许配给他。据明代以后的云南记载，梁王后来忌惮段功的势力，命阿盖毒杀丈夫，公主不忍，段功仍被诱至通济桥刺杀；这一说法细节多有出入，梁段之间的嫌隙似乎不久就经调解平息。明将蓝玉、沐英于1382年攻取大理，段氏一族被押往南京。"
 oe_lde_dyn_duan_dynasty: "段氏是云南一带白族的统治家族。始祖段思平推翻大义宁国，于937年建立大理国；1094—1096年高氏一度篡位，还政后的国王多崇信佛教，世俗大权常落在高家宰相手中。\n\n1253年忽必烈大军攻灭大理，末代国王段兴智出降后受封摩诃罗嵯（大王）。段氏从此以世袭总管的身份为元朝治理大理。第九代总管段光于1333年袭职，1343年击败梁王。\n\n其弟段功在1363年红巾军入滇时出兵救援梁王、收复昆明；据明代以后的云南记载，他后来在通济桥被梁王诱杀，但这一说法细节多有出入，梁段之间似乎不久就经调解和解。1382年明军平定云南，末代段氏首领请求保留大理自治并朝贡，被明朝拒绝；段氏族人被明太祖分散安置到内地各处。"
 oe_lde_ctry_SRB: "萨尔毕道朗，其名意为“绞架上的头颅”，是以萨卜泽瓦尔一带为根据地的西呼罗珊什叶派政权。1337年，阿卜杜勒‑拉扎克率众反抗脱花帖木儿总督的苛税，杀死一名官员，夺取了该城。\n\n世俗埃米尔有时与一个期待第十二代伊玛目的什叶派德尔维希教团分权。阿卜杜勒‑拉扎克在一场争吵中被兄弟瓦吉赫丁·马苏德刺死，时在1338年。萨尔毕道朗人于1342年败于扎瓦，教团首领哈桑·朱里在战斗中被杀；他们却在1353年于营帐中刺杀脱花帖木儿。霍贾·阿里‑伊·穆阿亚德立什叶派为国教，1381年向帖木儿臣服；萨尔毕道朗人在帖木儿死后逐渐失势。"
 oe_lde_ctry_MOS: "莫斯科大公国起初只是莫斯科河畔的小公国，后来成为“聚合罗斯土地”的中心。绰号“卡利塔”（钱袋）的大公伊凡一世替金帐汗国向其他罗斯王公征收贡赋，到1337年时已借此致富，并将东正教都主教吸引到莫斯科。\n\n他的孙子德米特里于1380年在库利科沃击败汗国军队，得名“顿斯科伊”，但两年后脱脱迷失汗就焚毁了莫斯科。大公伊凡三世于1472年迎娶末代拜占庭皇帝的侄女索菲亚·巴列奥略，将双头鹰纹章引入莫斯科宫廷并吞并诺夫哥罗德，1480年又与汗国大军隔乌格拉河对峙，直到大汗退兵。意大利建筑师重建了克里姆林宫，普斯科夫修士菲洛费上书称莫斯科为“第三罗马”，1547年伊凡四世加冕为首位俄国沙皇。"
 oe_lde_ctry_RUS: "俄罗斯源于莫斯科，这个罗斯小公国后来成为从波罗的海延伸到太平洋的帝国。绰号“卡利塔”（钱袋）的大公伊凡一世在1337年替金帐汗国向其他罗斯王公征收贡赋。\n\n德米特里·顿斯科伊于1380年在库利科沃击败鞑靼人；伊凡三世于1472年迎娶索菲亚·巴列奥略并引入双头鹰纹章，1480年又在乌格拉河畔与可汗大军对峙，传统上被视为蒙古桎梏的终结；普斯科夫修士菲洛费遂上书奉莫斯科为“第三罗马”。伊凡雷帝加冕沙皇，攻取喀山；他的男性后嗣断绝后，波兰人一度占据克里姆林宫，随后罗曼诺夫家族被推举登基。彼得大帝于1709年在波尔塔瓦大败瑞典，又建起圣彼得堡作为“通往欧洲的窗口”。拿破仑于1812年占领莫斯科，城中大火，法军在撤退中损失惨重。"
 oe_lde_ctry_IRA: "波斯是居鲁士与萨珊诸王的故土，在萨非王朝治下重新成为强国；这个王朝出自阿尔达比勒的苏菲教团。1337年的伊朗却是蒙古异密与地方王朝的战场，伊儿汗阿布赛因死后，汗国已四分五裂。\n\n白羊君主乌尊哈桑之外孙伊斯玛仪一世率领头戴红帽的奇兹尔巴什部众，于1501年攻取大不里士并称沙阿，立什叶派十二伊玛目派为国教，从此与逊尼派的奥斯曼帝国世代为敌。阿拔斯大帝组建只效忠于他的高加索奴隶兵，击退奥斯曼，并定都伊斯法罕。1722年阿富汗人攻陷伊斯法罕后，将领纳迪尔沙将其逐走，1739年在卡尔纳尔大破莫卧儿军，洗劫德里。卡扎尔王朝时，对俄战争以1828年的《土库曼恰伊条约》告终，埃里温从此割让。"
 oe_lde_ctry_ETH: "埃塞俄比亚帝国是非洲之角的基督教高原王国，欧洲人曾把它当作祭司王约翰的国度；所罗门王朝的皇帝自称是所罗门王与示巴女王的后裔。1337年，皇帝阿姆达·塞翁一世已因伊法特苏丹扣押使节，挥师击垮了这个苏丹国。\n\n后来，皇帝扎拉·雅各布开创所罗门王朝盛世：整饬教会礼仪、遣使赴佛罗伦萨公会议与欧洲诸国通问，并任命女儿和侄女治理各省、广建教堂。随后阿达尔的伊玛目艾哈迈德·格兰席卷高原，直到1543年葡萄牙援军协助皇帝加拉德沃斯将其击败。皇帝苏森约斯接受了耶稣会士所传的天主教，却引发接连叛乱，其子法西利德斯因此驱逐耶稣会士，并于1636年建立城堡林立的新都贡德尔。1769年起的王子时代，皇帝沦为相互争战的军阀手中的傀儡。"
 oe_lde_ctry_MAM: "埃及是马穆鲁克苏丹国的心脏，这个军人国家的苏丹从买来的奴隶兵中崛起。伯海里系苏丹纳西尔·穆罕默德在1337年正值第三次、也是最长的一次在位期，史家常视之为马穆鲁克国势的顶点。\n\n黑死病于1347年传入后反复发作，重创了农村。切尔克斯马穆鲁克随后登上王位，1420年代，苏丹巴尔斯拜将经由红海与吉达流向欧洲的香料贸易收归官营，又远征俘虏塞浦路斯国王雅努斯。马穆鲁克骑兵却轻视火器，终被奥斯曼苏丹塞利姆一世的火炮和耶尼切里击溃；1517年末代苏丹图曼贝伊被吊死在开罗的祖维拉门。此后马穆鲁克世家在奥斯曼治下重掌权势，直到埃及总督穆罕默德·阿里在1811年把他们的首领诱至开罗城堡，加以屠杀。"
 oe_lde_ctry_BYZ: "拜占庭帝国是罗马的最后遗绪，说希腊语、信东正教，皇帝仍据守君士坦丁堡的坚城。1337年，巴列奥略王朝的皇帝安德洛尼卡三世正节节失去小亚细亚，奥斯曼人已攻取尼西亚，并于当年攻取尼科米底亚。\n\n诸帝相争的内战掏空国库，约翰六世·坎塔库泽努斯的奥斯曼盟军于1354年占据加里波利，从此留在欧洲。皇帝们亲赴西方求援，曼努埃尔二世曾做客巴黎和伦敦；帖木儿1402年在安卡拉大胜，也只换来喘息。危局之中，帝国仍涌现文化复兴：格弥斯托斯·普莱顿在米斯特拉斯复兴柏拉图哲学，学者贝萨里翁随佛罗伦萨公会议将希腊典籍传入意大利，学者斯科拉里奥斯则在城陷后以根纳季二世之名出任首任奥斯曼治下普世牧首。1453年苏丹穆罕默德二世以巨炮轰击城墙，又把战船从陆上拖入金角湾。皇帝君士坦丁十一世死于陷城之时，千年帝国就此灭亡。"
 oe_lde_ctry_AAI: "阿拉斯塔尼是格鲁吉亚贾瓦赫季的王公领地，以阿哈尔卡拉基以北的城堡为中心。达维德八世争位输给弟弟瓦赫坦格三世，1302年退守此地，开创“省王”王统，王号源于蒙古治下格鲁吉亚王权碎裂。\n\n1337年这一支仍统治该地。相传达维德之子安德洛尼卡是蒙古伊利汗阿八哈的外孙，他于1354年去世。安德洛尼卡之子大乔治1373年在与土耳其人的战斗中阵亡，阿拉斯塔尼的王统就此终结。家族在15世纪初绝嗣。"
 oe_lde_ctry_ERE: "埃雷特纳王朝在伊儿汗国崩解之际，以锡瓦斯和开塞利为中心据有安纳托利亚中东部。1337年，开国者埃雷特纳这位畏兀儿出身的伊儿汗国将领，仍以札剌亦儿王朝君主哈桑·布祖格的名义治理当地。\n\n相争的蒙古军阀向他进兵时，埃雷特纳于1343年在卡兰比克出人意料地获胜，随即自称苏丹，因治理有方被称为“无须先知”。其子穆罕默德一世驾驭不了埃米尔们，把安卡拉丢给奥斯曼的穆拉德一世，最后在开塞利被自己的部将杀害。法官卡迪·布尔汉丁为幼主穆罕默德二世摄政，于1381年篡位；他能用突厥语、波斯语和阿拉伯语作诗，此后十八年间抵御奥斯曼、马穆鲁克和白羊王朝，保住了这片国土。"
 oe_lde_ctry_GRG: "朱里章位于里海之滨，是脱花帖木儿的根据地，他是最后一位有力争夺伊儿汗位的人。脱花帖木儿是成吉思汗之弟合撒儿的后裔、游牧的切特部首领，被东伊朗诸王公拥为伊儿汗，1337年又西征占领苏丹尼耶。\n\n札剌亦儿王朝与出班王朝将他击退，在他自己的呼罗珊税地上又兴起了萨尔毕道朗，这个名字意为“绞架上的头颅”。起义者屡败其军，杀死他的兄弟，1353年首领叶海亚·卡拉维到他营中假意归顺，随即刺杀脱花帖木儿，杀害其家眷。一名总督之子埃米尔·瓦利夺取了朱里章；直到1384年，帖木儿才让脱花帖木儿之子鲁克曼‑帕迪沙在阿斯塔拉巴德复位，作为自己的附庸。"
 oe_lde_ctry_HCI: "哈吉埃米尔贝伊国是切普尼部首领统治的突厥蛮小邦，都城梅苏迪耶在黑海沿岸腹地，面对希腊人的特拉比松帝国。首任贝伊巴伊拉姆趁1335—1336年蒙古内战自立，并在1348年参与围攻特拉比松，没有成功。\n\n他的儿子哈吉埃米尔换了条路，1358年娶特拉比松皇帝瓦西里之女为妻。他在军阀卡迪·布尔汉丁支持下于1380年夺取港口奥尔杜，随后与儿子苏莱曼反目，苏莱曼于1397年攻下吉雷松。贝伊国臣服于奥斯曼宗主，帖木儿在安卡拉获胜后又一度蠢动，1427年被吞并。"
 oe_lde_ctry_IME: "伊梅列季位于格鲁吉亚西部的库塔伊西一带，由巴格拉季奥尼王朝的一个支系统治。1463年格鲁吉亚分裂为几个互相敌对的王国，它成为完全独立的王国，此后数百年间一直是格鲁吉亚人与奥斯曼军队的战场。\n\n王位更替之频繁，使阿尔奇尔二世五度在位，巴格拉特四世四度在位。亚历山大三世于1651年向沙皇阿列克谢宣誓效忠，阿尔奇尔最终流亡俄国。所罗门一世在1757年的赫雷西利击败一支奥斯曼军队，但所罗门二世于1804年接受俄国宗主权，1810年又被俄国废黜。"
 oe_lde_ctry_INJ: "因珠是以设拉子为中心统治法尔斯的波斯王朝，名称来自蒙古语“因珠”，即他们替伊儿汗管理的王室领地。1337年，吉亚斯丁·凯霍斯鲁据守设拉子，出班家族、札剌亦儿家族和亚兹德的穆扎法尔王朝正争夺伊朗南部，混战最终夺去了他和父兄的性命。\n\n活下来的弟弟阿布·伊沙克背弃了扶植他的出班家族权臣，自1343年起独揽设拉子和伊斯法罕。他治下的设拉子有诗人哈菲兹和欧贝德·扎卡尼；据说他还仿照萨珊王朝在泰西封的宫殿修建建筑，未能完工。屡次进犯穆扎法尔王朝的穆巴里兹丁，招来设拉子之围，一名城区首领把城门钥匙交给了敌军。阿布·伊沙克逃往伊斯法罕，被俘处死，王朝告终。"
 oe_lde_ctry_JAL: "札剌亦儿出自蒙古札剌亦儿部的贵族，在伊儿汗国崩解之际，把汗国西南诸省变成以巴格达为都的苏丹国。1337年的首领哈桑·布祖格是已故伊儿汗阿布赛因的表亲，在波斯掌权，扶植成吉思汗后裔充当傀儡汗；他后来与出班家族争夺统治权。\n\n其子谢赫·乌韦斯时王朝鼎盛，于1360年夺取大不里士和阿塞拜疆，巴格达与大不里士成为波斯抄本细密画的中心。随后帖木儿到来。苏丹艾哈迈德工诗，奖掖画师，却把苏丹尼耶丢给帖木儿；帖木儿于1401年血洗巴格达前他已出逃，后来又身陷马穆鲁克的牢狱。获释后他转攻黑羊部，被其首领卡拉·优素福于1410年俘获处死。札剌亦儿余部在伊拉克南部苟延到1432年。"
 oe_lde_ctry_KRT: "库尔特是塔吉克裔逊尼派王朝，以赫拉特为都，统治呼罗珊大部一百余年，靠向历代统治伊朗的强权称臣而存续。1337年伊儿汗国分崩离析，马利克穆伊兹丁·侯赛因与争夺伊儿汗位的脱花帖木儿结盟，并向他纳贡。\n\n侯赛因趁乱让赫拉特自成一方强权。他于1342年在扎瓦击败对手萨尔毕道朗人，又与察合台人交战，1349年起改称独立苏丹；年轻的帖木儿也曾在他麾下效力。这位昔日的部下后来以征服者的身份归来，于1381年攻占赫拉特，放逐城中学者，掳走库尔特王公。侯赛因之子皮尔·阿里在叛乱后被处死，最后的王公于1396年在宴会上遇害。"
 oe_lde_ctry_MZF: "穆扎法尔是阿拉伯血统、深度波斯化的逊尼派王朝，从亚兹德起家，在伊儿汗国崩解后成为伊朗中部最强的势力。1337年，以严厉著称的穆巴里兹丁·穆罕默德以事实上独立的君主身份统治亚兹德。\n\n他于1340年夺取克尔曼，又把因珠王朝逐出设拉子，直到1358年被儿子沙赫·舒贾废黜并刺瞎。本身也写诗的舒贾在位时，诗人哈菲兹在设拉子写下咏酒与酒肆的抒情诗。帖木儿入侵，他的军队于1387年屠戮伊斯法罕。相传帖木儿曾召来哈菲兹，责问他为何在诗里愿拿撒马尔罕和布哈拉换设拉子美人的一颗痣。1393年帖木儿在设拉子击败沙阿·曼苏尔，处死了其余王公中的大多数。"
 oe_lde_ctry_NAX: "纳克索斯是群岛公国的中心，这是威尼斯人在基克拉泽斯群岛建立的国家。冒险家马尔科·萨努多率八艘桨帆船登岛，征服纳克索斯，继而与同伴征服米洛斯等岛。1337年尼古拉斯·萨努多作为天主教领主，统治着信奉东正教的岛民。\n\n克里斯波家族于1383年夺权，后来海盗横行，公国因奥斯曼势力崛起而投靠威尼斯。1537年它成为奥斯曼的朝贡国；苏丹塞利姆二世1566年废黜末代克里斯波公爵，任命外交官约瑟夫·纳西为公爵。奥斯曼人于1579年吞并了这个公国。"
 oe_lde_ctry_SME: "萨姆茨赫是格鲁吉亚南部山地的亚克力公国，都城阿哈尔齐赫，领主袭用阿塔贝格头衔。1337年克瓦克瓦雷在格鲁吉亚王室之下统治此地，王室于1334年恢复了宗主权。\n\n克瓦克瓦雷二世于1465年击败格鲁吉亚国王乔治八世，脱离格鲁吉亚。伊梅列季国王巴格拉特三世于1535年在穆尔贾赫季生擒克瓦克瓦雷三世，吞并公国；克瓦克瓦雷死于狱中，其子凯霍斯罗二世转而请奥斯曼人驱逐伊梅列季军队。奥斯曼在索霍伊斯塔获胜，萨姆茨赫沦为附庸，亚克力家族在1578年后改宗伊斯兰教，以世袭帕夏身份统治，直到1829年被俄国征服。"
 oe_lde_ctry_SUT: "速台是信奉逊尼派、说突厥语的蒙古王朝，以黑色玄武岩城墙环绕的阿米德为据点，替伊儿汗国镇守库尔德领主林立的迪亚巴克尔。始祖速台是伊利汗合赞的将领，1332年去世。1337年，伊儿汗国正在分崩离析，其子哈吉·塔盖依附札剌亦儿人，常与卫拉特人交战。\n\n汗国瓦解，注定了这个仰仗蒙古靠山的家族的命运。哈吉·塔盖的侄子易卜拉欣·沙得到出班家族支持，于1343年弑叔夺位，随后在各派之间反复倒戈，直到在凡湖附近战败，1350年死去。他的堂兄弟皮尔·穆罕默德夺回失守的摩苏尔，却遭部下军官杀害。最后的速台人逃往埃雷特纳领地，在那里被称为巴兰姆拜人。"
 oe_lde_ctry_TLM: "图勒姆是中世纪西吉兰的小酋长国之一，以塔利什地区边缘、里海岸边的安扎利港为中心。1307年，其首领里卡布曾在完者都征讨吉兰的战役中，联合拉什特和沙夫特的人马伏击并击杀伊儿汗国将领忽都鲁沙，但蒙古人只换来名义上的宗主权，图勒姆仍由吉兰本地统治者掌握。"
 oe_lde_cult_hazara_culture: "哈扎拉人是居住在阿富汗中部哈扎拉贾特山区、讲波斯语的族群，由13世纪蒙古西征留下的蒙古、突厥驻军与山区更早的伊朗语居民融合而成。他们的族名通常认为源自波斯语“哈扎尔”，意为千，对应蒙古语中表示成吉思汗千人军事单位的“敏罕”。\n\n13至15世纪间，喀喇乌纳人等突厥蒙古群体，以及伊儿汗国和帖木儿王朝的统治，不断为这一融合添入新成分。对他们最早的明确记载出自16世纪初巴布尔的回忆录。\n\n约1600年前后，在萨法维王朝影响下，他们改宗什叶派伊斯兰教；18世纪时，哈扎拉士兵加入艾哈迈德·沙·杜兰尼的军队，而山地诸部仍保留自己的部落组织和相当大的自治权。"
 oe_lde_cult_iraqi_culture: "伊拉克人是美索不达米亚冲积平原的阿拉伯语居民，分布在巴格达、库法、卡尔巴拉等圣城与巴士拉之间；美索不达米亚阿拉伯语带有浓厚阿拉姆语底层，分为北方城镇古老的“凯勒图”口音与巴格达和南方的“吉莱特”方言。636年卡迪西亚战役后，阿拉伯军队从萨珊手中夺取此地；762年建立的巴格达成为阿拔斯哈里发国都城，在1258年蒙古洗城之前是伊斯兰学术中心。\n\n1337年，伊儿汗国余脉札剌亦儿苏丹统治伊拉克，直到1401年帖木儿在巴格达屠城；此后土库曼王朝相继入主，1508年起归萨法维王朝。1534年奥斯曼军队攻占巴格达，1639年《祖哈布条约》把伊拉克各省划归伊斯坦布尔，巴士拉则长期自行其是。\n\n1704年起格鲁吉亚马穆鲁克近乎自治地统治伊拉克，直到1831年奥斯曼恢复直接统治，改设巴格达、摩苏尔、巴士拉三省；1802年瓦哈比袭击者洗劫卡尔巴拉，使逊尼派商贸城镇与什叶派圣城并立的格局更加分明。"
 oe_lde_cult_laz_culture: "拉兹人是黑海东南岸的卡特维尔语族群，故乡从特拉比松、里泽延伸到阿扎尔一带。其先民是古代科尔基斯诸部：3世纪时，拉兹人将科尔基斯大部统一为拉齐卡王国。\n\n阿拉伯入侵后，特拉比松一带成为他们的主要中心；1204年特拉比松帝国建立后，拉兹村民构成其农村人口的主体。1547年奥斯曼人征服该地区，设为特拉比松下辖的拉齐斯坦桑贾克。\n\n17世纪间，多数拉兹人从东正教改宗逊尼派伊斯兰教，但保留了自己的卡特维尔语。“谷地领主”德雷贝伊长期近乎独立，直到马哈茂德二世镇压了他们1832—1834年的起义。拉兹社会以武装氏族为基础，以霍龙舞以及造船和航海技艺闻名。"
 oe_lde_dyn_arghunid_dynasty: "阿儿浑家族是蒙古异密阿儿浑·阿合、其子捏兀鲁思及其孙阿儿浑沙的家族，阿儿浑沙统领着呼罗珊的蒙古军事部落乔尼·库尔班。1335年伊儿汗国瓦解后，阿儿浑沙成为汗位争夺者脱合帖木儿的主要支持者和军队统帅，以内沙布尔为中心统治图斯、马什哈德和阿塔克边境地带。\n\n1337年，他击败了札剌亦儿人扶植的长官穆罕默德·穆莱；但萨尔巴达尔人于1340年夺取内沙布尔，把他逼回图斯。阿儿浑沙死于1345或1346年，其子穆罕默德·别吉背弃脱合帖木儿，转而与萨尔巴达尔人结盟。该部落后来于约1381年臣服帖木儿，并在1389年参与了哈吉·别吉在图斯发动的失败叛乱。"
 oe_lde_dyn_bagrationi_dynasty: "巴格拉季奥尼王朝是中世纪早期至俄国征服期间统治格鲁吉亚的王室，也是欧洲最古老的基督教统治家族之一，多数学者认为它出自亚美尼亚的巴格拉提德家族。格鲁吉亚支系于8世纪末取得伊比利亚公国：阿绍特一世在813年成为其首席王公，阿达尔纳塞于888年恢复格鲁吉亚王权，巴格拉特三世则在11世纪初将格鲁吉亚诸地统一为一个王国。在1122年从穆斯林手中收复第比利斯的建国者大卫四世，以及塔马尔女王（1184—1213年在位）治下，格鲁吉亚成为基督教东方的头等强国，疆域从北高加索一直延伸到伊朗北部。\n\n1225年花剌子模人的袭击和1236年蒙古人的入侵终结了这个黄金时代，不过1337年在位的乔治五世（光辉者）曾短暂重振国力。帖木儿在1386至1403年间的八次远征，加上黑羊王朝与白羊王朝的挤压，摧毁了国家的统一；到1491年，巴格拉季奥尼家族只能在奥斯曼与萨法维波斯的宗主权下分治卡特利、卡赫季和伊梅列季三个敌对王国，不少君主还改宗伊斯兰教。伊拉克略二世于1762年重新统一卡特利和卡赫季，并通过1783年的《格奥尔吉耶夫斯克条约》接受俄国保护；但1795年卡扎尔王朝的阿迦·穆罕默德汗洗劫第比利斯时，俄国并未出手。1801年沙皇亚历山大一世废黜该王朝、吞并卡特利—卡赫季，1810年伊梅列季也遭吞并，所罗门二世被迫流亡。"
 oe_lde_dyn_farumadi_dynasty: "法鲁马迪家族是西呼罗珊萨卜泽瓦尔的名门，得名于附近的法鲁马德；伊儿汗国时期，长老塔希尔·法鲁马迪父子是诗人普尔·巴哈·贾米的施主。家族中最知名的阿拉丁·穆罕默德·法鲁马迪为伊利汗位争夺者脱合帖木儿镇守萨卜泽瓦尔、朱温及内沙布尔的一部分，并出任维齐尔。\n\n他的苛税迫使当地地主阿卜杜勒·拉扎克于1337年起兵，这场起义造就了萨尔巴达尔政权。阿拉丁继续担任脱合帖木儿的维齐尔并与萨尔巴达尔人作战，最终在1342年7月29日阿特拉克河畔的败战中阵亡。"
 oe_lde_dyn_haciemirids_dynasty: "哈吉埃米罗格鲁王朝又称巴伊拉姆奥格鲁，是黑海沿岸贾尼克地区切普尼部落土库曼人建立的贝伊国，拜占庭希腊人称之为哈吕比亚埃米尔国。1335—1336年，初代贝伊巴伊拉姆摆脱埃雷特纳的宗主权；1337年，这个刚刚独立的国家以梅苏迪耶附近为都。\n\n1348年巴伊拉姆围攻特拉比松未果。其子哈吉埃米尔是王朝的得名者，与特拉比松交战后，于1358年迎娶皇帝之女塞奥多拉；他与卡迪·布尔汉丁结盟，1380年攻占奥尔杜并迁都于此。\n\n哈吉埃米尔与儿子苏莱曼之间的内战削弱了贝伊国，不过苏莱曼仍在1397年拿下吉雷松。王朝接受奥斯曼宗主权，1402年帖木儿在安卡拉获胜后曾短暂再度独立，最终于1427年被吞并。"
 oe_lde_dyn_hindu_dynasty: "欣杜家族得名于谢赫·阿里·欣杜，他是伊儿汗国汗位争夺者脱合帖木儿的部将，被任命为里海沿岸阿斯塔拉巴德的长官。1353年脱合帖木儿被萨尔巴达尔人杀害、阿斯塔拉巴德遭吞并后，阿里·欣杜之子阿米尔·瓦利先投奔邻近的乔尼·库尔班部落，随后以马赞达兰为基地，于1356年夺回阿斯塔拉巴德。\n\n他统治阿斯塔拉巴德和马赞达兰的部分地区至1366年，又在约1374—1384年间当政，其间屡次与萨尔巴达尔人和札剌亦儿人交战，并宣布皈依什叶派以争取当地支持。1384年帖木儿攻陷阿斯塔拉巴德，他的独立统治告终。"
 oe_lde_dyn_komnenos_dynasty: "科穆宁家族是拜占庭的军事贵族，传统上溯源于色雷斯的科姆内村；已知最早的成员曼努埃尔·厄洛提科斯在卡斯塔莫农积累地产。伊萨克一世1057年夺取皇位，两年后退位；辉煌时代始于侄子阿历克塞一世1081年在曼齐刻尔特惨败后登基。\n\n阿历克塞、其子约翰二世和统治至1180年的孙子曼努埃尔一世重振帝国，抗击诺曼人与突厥人，但1176年曼努埃尔在密列奥塞法隆的失利遏制了复兴。1183年登位的安德洛尼卡一世1185年被杀，安格洛斯家族入主君士坦丁堡；伊萨克·科穆宁在塞浦路斯的割据政权也于1191年被理查一世攻灭。\n\n1204年第四次十字军洗劫君士坦丁堡前夕，安德洛尼卡一世的两个孙子阿历克塞和大卫于黑海之滨建立特拉比松帝国。其君主自称“大科穆宁”，国祚长于其他拜占庭继承国：1337年在位的是1332年登基的瓦西里，帝国直到1461年才在一月围攻后被穆罕默德二世攻灭。末代皇帝大卫及其家人于1463年被处死。"
 oe_lde_dyn_lusignan_dynasty: "吕西尼昂家族原是普瓦图吕西尼昂城堡的小领主，世系可追溯至10世纪初，传说把水精灵梅露辛奉为家族始祖。在法兰西，家族成为拉马什伯爵，雨果十世娶昂古莱姆的伊莎贝拉，于1220年添得昂古莱姆伯国；1314年腓力四世吞并拉马什，这支法兰西支系告终。\n\n与此同时，一支幼系在拉丁东方崛起：居伊·德·吕西尼昂曾戴上耶路撒冷王冠，1192年第三次十字军东征后，家族在塞浦路斯立足，以尼科西亚为中心统治该岛近三百年。1337年，吕西尼昂国王仍统治着因法马古斯塔贸易而富庶的塞浦路斯。\n\n14世纪中叶，家族通过联姻继承亚美尼亚的奇里乞亚王国，却于1375年被马穆鲁克人攻灭。1426年马穆鲁克人俘虏国王雅努斯，塞浦路斯沦为纳贡国；末代女王卡特琳娜·科尔纳罗被迫于1489年把岛屿卖给威尼斯，吕西尼昂王统就此终结。"
 oe_lde_dyn_mulai_dynasty: "穆莱家族是库希斯坦的领主，库希斯坦即南呼罗珊的山地区域，以加延为首府。1335年伊儿汗国瓦解时，阿卜杜拉·本·穆莱与东伊朗诸王公一同拥立脱合帖木儿为伊利汗；1337年，他和阿儿浑沙一起在比斯塔姆撤离西征。\n\n他的族人穆罕默德·穆莱被札剌亦儿人哈桑·布祖格任命为呼罗珊长官，但同年被脱合帖木儿和阿儿浑沙击败并处死。阿卜杜拉始终是脱合帖木儿对抗萨尔巴达尔人的盟友，直到1342年7月29日在汗廷的败战中与维齐尔法鲁马迪一同阵亡。"
 oe_lde_dyn_qushji_dynasty: "库什吉家族是谢赫·阿里·本·阿里·库什吉的家族，他任伊儿汗国呼罗珊长官，驻节埃斯法拉延。1335年伊利汗不赛因死后，谢赫·阿里牵头劝说东伊朗诸王公接受成吉思汗之弟合撒儿的后裔脱合帖木儿为伊利汗。\n\n他主持汗廷政务和财税政策，招来地方异密的怨恨。1337年春，他随脱合帖木儿西征伊朗西部，乔尼·库尔班的阿儿浑沙和库希斯坦领主却在比斯塔姆撤军。\n\n大军在苏丹尼耶附近被札剌亦儿人哈桑·布祖格击败后，阿儿浑沙在撤退途中擒获谢赫·阿里，于1337年7月将他处死，并把首级送给胜利者。"
 oe_lde_dyn_tadjeddinids_dynasty: "塔杰丁奥卢又称塔杰丁贝伊国，是安纳托利亚北部的土库曼小邦，属于贾尼克诸贝伊国之一。随着塞尔柱与伊儿汗权威的瓦解，始祖塔杰丁于14世纪中期以尼克萨尔为中心立国。\n\n1378年他娶特拉比松皇帝阿莱克修斯三世之女埃夫多基娅为妻，1386年在奥尔杜一带阵亡。其子马哈茂德接受卡迪·布尔汉丁的宗主权，同时暗中偏袒巴耶济德一世，1398年后归顺奥斯曼。\n\n1402年帖木儿入侵和奥斯曼空位期里马哈茂德保住了领地，却因支持叛乱的小穆斯塔法，于1423年被自己的士兵所杀。他的两个儿子在萨姆松和恰尔尚巴一带又支撑数年，约1428年贝伊国被奥斯曼吞并。"
 oe_lde_cult_oe_albanian_greek_culture: "阿尔巴尼亚人在11世纪的拜占庭史书里初次出现，中世纪后期遍布伊庇鲁斯、色萨利和伯罗奔尼撒，常为帝国和各专制公当兵垦荒。\n\n在凤凰计划里，这是阿尔巴尼亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_croatian_greek_culture: "伊利里亚是亚得里亚海东岸的罗马旧称；拜占庭史家喜欢用这类古名称呼西巴尔干的各族。\n\n在凤凰计划里，这是亚得里亚海东岸的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_egypt_greek_culture: "从亚历山大大帝起，埃及由说希腊语的王朝和罗马官员治理了近千年，直到7世纪被阿拉伯人征服；亚历山大里亚一直是希腊学术的中心。\n\n在凤凰计划里，这是埃及的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_english_greek_culture: "不列颠尼亚是罗马在不列颠岛的行省，5世纪初罗马军队撤离。此后仍有岛上的人东来：11世纪起，瓦兰吉卫队里有不少盎格鲁-撒克逊人。\n\n在凤凰计划里，这是不列颠的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_french_greek_culture: "高卢是罗马人对阿尔卑斯山以西土地的称呼，恺撒在公元前1世纪将其征服。拜占庭人则习惯把西方人统称为法兰克人或拉丁人。\n\n在凤凰计划里，这是高卢的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_georgian_greek_culture: "格鲁吉亚与拜占庭同奉东正教，王室屡与君士坦丁堡和特拉比松联姻；圣山上的伊维隆修道院就是格鲁吉亚人在10世纪创建的。\n\n在凤凰计划里，这是格鲁吉亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_iberia_greek_culture: "查士丁尼时代，帝国曾在伊比利亚半岛东南沿海建立西班牙行省，自6世纪中叶维持到7世纪20年代。\n\n在凤凰计划里，这是伊比利亚半岛的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_latin_greek_culture: "拜占庭人把意大利人和西方的天主教徒统称为拉丁人。帝国在意大利南部的统治延续到1071年巴里陷落，卡拉布里亚和萨伦托至今仍有说希腊语的村落。\n\n在凤凰计划里，这是意大利的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_levantine_greek_culture: "梅尔基特意为“王的人”，指叙利亚、巴勒斯坦和埃及那些接受卡尔西顿公会议、与皇帝同一信仰的基督徒。在阿拉伯人治下，他们仍归安条克、耶路撒冷和亚历山大里亚的东正教牧首管辖。\n\n在凤凰计划里，这是叙利亚和黎凡特的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_tunis_greek_culture: "阿非利加是罗马在迦太基一带的行省，533年贝利撒留从汪达尔人手里收复，此后设迦太基总督区，直到698年迦太基落入阿拉伯人之手。阿拉伯语的“伊弗里基亚”即由此名而来。\n\n在凤凰计划里，这是迦太基一带的北非的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_bulgarian_greek_culture: "默西亚是多瑙河下游南岸的罗马行省。拜占庭史家行文仿古，常把保加利亚人称作默西亚人。\n\n在凤凰计划里，这是保加利亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_kudoyr_culture: "托罗斯山脉以东的山地自古是部族首领的天下；7世纪以前，帝国的东部边界就在这一带与波斯相接。\n\n在凤凰计划里，这是库尔德人的山地的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_mesopotamian_culture: "美索不达米亚是罗马最东的行省之一，尼西比斯、达拉和埃德萨都是帝国与波斯反复争夺的边城；7世纪被阿拉伯人征服，11世纪帝国一度收复埃德萨。\n\n在凤凰计划里，这是美索不达米亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_serbian_greek_culture: "特里巴利人是古代多瑙河以南的色雷斯部族。拜占庭史家仿古，把塞尔维亚人称作特里巴利人。\n\n在凤凰计划里，这是塞尔维亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_arabian_greek_culture: "罗马在106年设阿拉伯行省，治所在布斯拉；6世纪帝国依靠信奉基督教的加萨尼阿拉伯人守卫沙漠边境。\n\n在凤凰计划里，这是阿拉伯的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_moldova_greek_culture: "达契亚是图拉真在多瑙河以北征服的行省，3世纪后期放弃。晚期的拜占庭史家把瓦拉几亚人和摩尔达维亚人称作达契亚人。\n\n在凤凰计划里，这是摩尔达维亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_paeones_culture: "派奥尼亚是古代马其顿以北的山地。拜占庭史家仿古，把匈牙利人称作派奥涅斯人。\n\n在凤凰计划里，这是匈牙利的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_armenian_greek_culture: "亚美尼亚人是帝国最重要的边疆民族之一：从希拉克略到马其顿王朝，许多皇帝和名将出自亚美尼亚家族。接受卡尔西顿教义、归属君士坦丁堡教会的亚美尼亚人被称作“察特人”。\n\n在凤凰计划里，这是亚美尼亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_tur_greek_culture: "“罗姆”是穆斯林对罗马人及其土地的称呼，塞尔柱人在小亚细亚建立的苏丹国即以此为名。突厥人治下的安纳托利亚，仍有大批说希腊语或突厥语的东正教徒。\n\n在凤凰计划里，这是安纳托利亚的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_cult_oe_german_greek_culture: "日耳曼尼亚是罗马人对莱茵河以东土地的称呼，罗马只短暂占有过它的边缘。拜占庭人把德意志人称作阿拉曼尼人或涅米齐人。\n\n在凤凰计划里，这是德意志的居民在帝国治下接受希腊语和罗马人身份之后形成的文化，属于希腊文化组。它不是史实中的族群：只有帝国重新统治这片土地、当地的认同转变之后才会出现。"
 oe_lde_ctry_QING_1821: "1820年道光帝即位之际，大清帝国疆域东抵库页岛、西极葱岭、北至外兴安岭、南括台湾与南海诸岛，人口已突破三亿，坐拥空前辽阔的多民族一统江山。八旗驻防、理藩院盟旗与内地督抚行省共同维系着这座庞大的东亚帝国。\n\n然而乾嘉盛世的余晖之下危机渐显：白银因鸦片走私外流导致银贵钱贱，漕运河工与驿站积弊日深，东南沿海更面临西方工业列强要求叩关通商的空前变局。道光一朝正站在传统天朝体制与近代世界冲击的十字路口。"
 oe_lde_ctry_QING_1776: "乾隆朝是大清“康乾盛世”的极盛之巅。朝廷平定准噶尔与大小和卓，于天山南北设伊犁将军与乌里雅苏台定边左副将军，将新疆、内外蒙古与西藏稳固纳入版图；内地摊丁入亩、广开垦殖，人口跃升至三亿左右，四库全书的编纂更象征着典章文治的鼎盛。\n\n对外实行广州一口通商与理藩朝贡体制，令欧亚白银源源流入华夏市场。但在十全武功的荣光背后，高昂军费、官僚贪渎与人口膨胀已悄然积聚隐患，大清能否居安思危、锐意变革，将决定东方帝国在下一个世纪的命运。"
 oe_lde_ctry_QING_1648: "大清由建州女真努尔哈赤与皇太极创立于白山黑水之间，1644年摄政王多尔衮率八旗劲旅入主山海关、定鼎北京，奉顺治帝承继中原大统。清初以满洲八旗为中坚、联合科尔沁等漠南蒙古诸部，并借助汉军旗人与降明将领挥师南下，与西南的南明政权及东南海上势力展开激烈角逐。\n\n随后的康熙与雍正两朝平定三藩、收复台湾、缔结《尼布楚条约》划定东北疆界，并创立军机处、推行摊丁入亩与改土归流，将满蒙汉藏多元共治的帝国格局推向成熟，为绵延百年的盛世奠定根基。"
 oe_lde_ctry_MNG_1644: "1644年北京煤山之变后，大明皇室宗藩与忠义士民并未屈服，先后在南京、福州、广州与昆明拥立弘光、隆武、永历诸帝，史称南明。朝廷据守大江南北与西南山地，联合各地义军与海上水师抗击八旗南下，试图重演南宋偏安乃至北伐中兴之业。\n\n面对内有文武掣肘、藩镇割据，外有清军与降将步步紧逼的绝境，永历政权与东南忠明水师仍在大明故土的最后防线上浴血奋战。若能弥合党争、整军经武并善用江南与西南财赋，汉家正朔犹存扭转乾坤的一线生机。"
 oe_lde_ctry_MNG_1444: "大明由朱元璋于1368年驱逐元廷建立，历经洪武建制、永乐迁都北京与郑和七下西洋，至15世纪中叶已成为人口与财赋冠绝东亚的中央帝国。北方依托长城九边重镇防备瓦剌与鞑靼诸部，国内以卫所军屯与里甲赋役维系广袤疆土。\n\n正统以后，土木堡之变、倭患海警与白银货币化浪潮接踵而至，促成一条鞭法改革与江南市镇手工业的空前繁荣。在守边、开海与整饬内阁文官政治的博弈之间，大明正迎接着从中古走向近代东亚的关键考题。"
 oe_lde_ctry_JAP_1204: "镰仓幕府由源赖朝于1192年受封征夷大将军建立，开启了日本武家政治的先河。幕府设治关东镰仓，在诸国分置守护与地头，与京都朝廷形成公武二元统治格局。\n\n13世纪初源氏将军绝嗣后，外戚北条氏以“执权”之职总揽幕政，先后击退京都承久之乱并抗御蒙元两次跨海东征。在武士御家人封赏日绌与禅宗文化勃兴的交织中，镰仓武家秩序正面临深层震荡。"
 oe_lde_ctry_JAP_1648: "德川家康于1600年关原合战大胜、1603年就任征夷大将军，在江户开创绵延两百余年的德川幕府。幕府以幕藩体制统御全国两百六十余藩，借助参勤交代、武家诸法度与石高制实现了战国乱世之后久违的“太平之世”。\n\n1630年代颁布宽永锁国令后，对外贸易仅留长崎出岛、对马、萨摩与松前四口，却在封闭和平中孕育出江户、大坂与京都繁荣的町人商业与元禄文化。"
 oe_lde_ctry_JAP_1776: "18世纪后期至19世纪初，江户德川幕府的太平秩序已延续逾百五十年。全国市场高度整合，大坂米市、江户手工业与高识字率的寺子屋教育蓬勃发展，经由长崎出岛传入的“兰学”更启发了一批关注天文、医学与海防的日本学者。\n\n与此同时，武士俸禄窘迫、农政改革反复，加之俄、英、美船只频频现身日本近海与虾夷北方，幕藩体制正逐步感受到来自太平洋彼岸的时代风浪。"
 oe_lde_ctry_KOR_1444: "1392年李成桂代高丽立国，定都汉城，建立朝鲜王朝。朝廷以朱子理学为立国根基，设立议政府、六曹与科举文官体制，向北开拓鸭绿江与图们江四郡六镇，确立了近代朝鲜半岛的疆域雏形。\n\n世宗大王治下创制《训民正音》（谚文）、兴修天文历算与农书，开启朝鲜文治极盛。此后虽历士林党争与壬辰倭乱浩劫，在水师名将李舜臣与明朝援军协力下终保社稷不堕。"
 oe_lde_ctry_KOR_1648: "历经丙子胡乱与东亚鼎革之后，朝鲜王朝在17世纪中叶步入重整民生与礼乐复兴时期。朝廷推行大同法改革贡赋、疏浚农田水利，在维系对清朝贡邦交的同时，于国内深耕儒学礼教与地方乡约秩序。\n\n18世纪英祖与正祖推行荡平策缓和朋党之争，建水原华城、设奎章阁，实学思潮与商品市集蔚然兴起，铸就朝鲜中后期的文治中兴。"
 oe_lde_ctry_KOR_1821: "19世纪初纯祖朝的朝鲜王朝虽仍保持半岛一统与悠久文官典制，却因外戚势道政治抬头、三政紊乱与地方民变渐起而国力趋弱。\n\n朝廷对外严守海禁闭关政策，然西学天主教思潮暗流涌动，西洋异样船亦开始出没于黄海与朝鲜海峡，传统东亚礼仪之邦正面临数百年未有之外部考验。"
 oe_lde_ctry_BYZ_1204: "1204年第四次十字军攻陷并洗劫君士坦丁堡后，罗马皇权并未熄灭。狄奥多尔一世·拉斯卡里斯在比提尼亚重镇尼西亚重立皇帝宝座与普世牧首区，收拢流亡贵族与军区兵源，成为小亚细亚最坚实的希腊罗马流亡帝国。\n\n面对北面拉丁帝国、东面罗姆苏丹国与西岸伊庇鲁斯、黑海特拉比松的群雄竞逐，尼西亚帝国凭借稳固农税、精炼军纪与巧外交，蓄势待发，誓要光复博斯普鲁斯海峡畔的皇都。"
 oe_lde_ctry_BYZ_1444: "1444年瓦尔纳十字军东征前夕，千年罗马帝国已缩至君士坦丁堡孤城、摩里亚专制公国及零星爱琴海岛屿。皇帝约翰八世与弟君士坦丁正面临生死抉择：是借佛罗伦萨合一与西方十字军背水一战，还是依托狄奥多西三重城墙与本土东正教民心绝地反击。\n\n在奥斯曼铁骑环伺、热那亚与威尼斯商站分夺关税的暮色中，凤凰的余烬仍在君士坦丁堡与米斯特拉斯的讲堂与城堞间闪烁——此战成则罗马重光，败则千年帝祚倾覆。"
 oe_lde_ctry_TUR_1444: "15世纪中叶的奥斯曼帝国已跨踞安纳托利亚与巴尔干鲁米利亚两岸，定都埃迪尔内。穆拉德二世与年少的穆罕默德二世统率耶尼切里常备步兵与西帕希封地骑兵，正迎战匈牙利、波兰与瓦拉几亚联军掀起的瓦尔纳十字军。\n\n唯有夺下博斯普鲁斯海峡上的君士坦丁堡，奥斯曼方能将欧亚两翼浑融一体，进而南下黎凡特与埃及、西进多瑙河腹地，蜕变为横跨三洲的伊斯兰世界霸主。"
 oe_lde_ctry_TUR_1648: "17世纪中叶的奥斯曼帝国疆域东抵两河、西控马格里布、北临匈牙利与黑海，仍是地中海与近东最庞大的帝国。在克里特漫长海战与宫廷动荡之后，科普鲁律大维齐尔家族力挽狂澜，整饬财政与军纪，重振高门威势。\n\n18世纪初的郁金香时代见证了伊斯坦布尔宫廷艺术与印刷文化的兴盛，然而随着哈布斯堡与俄罗斯陆军近代化崛起，帝国在多瑙河与黑海北岸的战略压力正日益沉重。"
 oe_lde_ctry_TUR_1776: "1774年《库楚克-凯纳吉条约》签署后，奥斯曼帝国在黑海北岸与克里米亚的霸权动摇，列强围绕海峡与巴尔干展开角逐，“东方问题”由此浮现。帝国境内的行省总督（阿扬）势力坐大，传统耶尼切里军团亦渐失昔日锐气。\n\n从塞利姆三世的“新军”尝试到马哈茂德二世铁腕整军改制，高门在欧洲列强外交博弈、巴尔干民族起义与埃及总督崛起的重重考验中，艰难探索近代化自强之路。"
 oe_lde_ctry_RUS_1648: "历经混乱时代浩劫后，罗曼诺夫王朝在莫斯科重整俄罗斯沙皇国。1648年沙皇阿列克谢一世治下，《会议法典》确立中央集权与农奴法制，哥萨克探险队已翻越叶尼塞河直抵太平洋与黑龙江流域，将西伯利亚广袤毛皮林海纳入版图。\n\n西面借第聂伯河哥萨克起义向波兰-立陶宛收复基辅与左岸乌克兰，随后彼得大帝更以大北方战争夺取波罗的海出海口、营建圣彼得堡，把莫斯科沙皇国锻造为近代欧洲列强。"
 oe_lde_ctry_RUS_1776: "18世纪后期的俄罗斯帝国在女皇叶卡捷琳娜二世治下步入黄金时代。帝国以圣彼得堡为启蒙宫廷之都，南下黑海并入克里米亚与新俄罗斯，西向参与瓜分波兰，疆土横跨波罗的海、黑海直至太平洋与阿拉斯加。\n\n在伏尔泰式启蒙修辞与贵族特许状并行的格局下，俄国拥有欧洲最庞大的常备陆军与丰富的铁矿、木材和谷物资源，已成为左右欧洲均势与近东格局的头号大陆强权。"
 oe_lde_ctry_RUS_1821: "击溃拿破仑远征并率联军开入巴黎之后，沙皇亚历山大一世统御的俄罗斯帝国以“神圣同盟”缔造者的姿态屹立欧亚之巅。帝国版图囊括芬兰、波兰王国、高加索北麓与横贯北亚的西伯利亚，威望如日中天。\n\n然而胜利的桂冠之下，农奴制滞缓了工业化步伐，曾见识西欧宪政思潮的青年军官团亦在暗中酝酿变革；如何在维系欧洲保守秩序与推动国内改革之间抉择，成为罗曼诺夫皇室的头号难题。"
 oe_lde_ctry_GBR_1648: "17世纪中叶是不列颠群岛政制剧变与海权跃升的时代。历经内战、共和国实验与斯图亚特复辟乃至光荣革命，议会主权与英格兰银行奠定了近代财政信用体系的基石。\n\n凭借《航海条例》、皇家海军扩建以及北美、加勒比与东印度特许商站，不列颠迅速取代荷兰成为大西洋与印度洋最具进取心的商业与海军强权。"
 oe_lde_ctry_GBR_1776: "七年战争大胜之后，汉诺威王朝治下的大不列颠王国跃居全球海上霸主，皇家海军称雄大西洋与印度洋，东印度公司在孟加拉扎下深根，国内更率先掀起蒸汽机与纺织机械引领的工业革命浪潮。\n\n然而1776年北美十三州爆发独立战争，法兰西与西班牙亦虎视眈眈。面对横跨大西洋的帝国危机，伦敦正考验着其金融信用、海军投送与议会帝国治理的极限。"
 oe_lde_ctry_GBR_1821: "滑铁卢凯旋之后，联合王国正式迈入“不列颠治世”（Pax Britannica）时代。作为“世界工厂”与全球金融心脏，伦敦凭借无可匹敌的皇家海军掌控好望角、马六甲、直布罗陀与锡兰等战略咽喉，并统御辽阔的印度次大陆与白人自治领。\n\n国内蒸汽工业与自由贸易思潮高歌猛进，而选区改革、谷物法争议与工匠浪潮也推动着议会政治向近代民主社会演进。"
 oe_lde_ctry_FRA_1648: "1648年《威斯特伐利亚和约》确立了波旁法兰西在西欧大陆的霸权起点。经黎塞留与马扎然铺路，年少的“太阳王”路易十四亲政后在凡尔赛宫构建起欧洲绝对君主制的典范，由柯尔贝尔推行重商主义与海军建设，沃邦则沿边境筑起星形要塞防线。\n\n法兰西坐拥西欧最丰沛的人口与陆军潜能，法语与凡尔赛宫廷礼仪风靡列国，却也因连年欧陆争霸引发反法大同盟的围堵。"
 oe_lde_ctry_FRA_1776: "18世纪后期的法兰西王国是欧洲启蒙思想的策源地，百科全书派与沙龙文化照耀西方世界，精良的陆海军与加勒比蔗糖殖民地仍支撑着波旁大国的威望。路易十六即位后，巴黎正权衡是否援助北美反英起义以洗刷七年战争之耻。\n\n然而旧制度的免税特权与庞大国债已将国库推向破产边缘，若无彻底财税与宪制革新，一场改写欧洲历史的大革命与帝国风暴正蓄势待发。"
 oe_lde_ctry_FRA_1821: "拿破仑帝国谢幕后，路易十八在1814年《宪章》框架下实现波旁复辟。法兰西虽退回1792年疆界并一度承受驻军与赔款，却凭借雄厚的农工底蕴、《民法典》遗产与外交老手塔列朗的纵横捭阖，迅速重返欧洲协调五强之列。\n\n在极端保王派、自由宪政派与拿破仑余脉的激烈博弈中，巴黎正蓄力重塑其在大西洋、地中海与欧陆舞台上的大国影响力。"
 oe_lde_ctry_SPA_1648: "1648年《威斯特伐利亚和约》正式承认荷兰独立后，哈布斯堡腓力四世治下的西班牙帝国仍掌控伊比利亚、南尼德兰、米兰、那不勒斯、新西班牙、秘鲁与菲律宾，是名副其实的跨洋日不落君主国。\n\n尽管美洲银船仍源源驶入塞维利亚、巴洛克“黄金世纪”艺术璀璨夺目，但连年多线作战、加泰罗尼亚与葡萄牙动荡及财政透支，正严峻考验着马德里宫廷维系全球帝国的能力。"
 oe_lde_ctry_SPA_1776: "西班牙王位继承战争后入主马德里的波旁王朝，在卡洛斯三世治下掀起大刀阔斧的“波旁改革”：重振皇家海军舰队、整顿新西班牙与拉普拉塔总督区税政、放开帝国港口自由贸易，令美洲白银与商贸收入再创高峰。\n\n依托与法兰西的波旁家族盟约，西班牙正积极筹谋在加勒比与直布罗陀方向遏制大不列颠，重振跨洋帝国声威。"
 oe_lde_ctry_SPA_1821: "半岛战争击退拿破仑军队之后，西班牙陷入深重的帝国与宪政危机。1820年自由派军官起义迫使斐迪南七世恢复1812年《加的斯宪法》，开启“自由三年期”，引发神圣同盟保守列强的高度戒备。\n\n大洋彼岸，新西班牙、大哥伦比亚与秘鲁的独立风暴席卷拉丁美洲，绵延三百年的西班牙美洲帝国已走至解体的边缘。"
 oe_lde_ctry_HAB_1648: "三十年战争落幕于1648年《威斯特伐利亚和约》，哈布斯堡皇帝在德意志帝国诸侯间的集权受限，维也纳宫廷遂将战略重心转向奥地利、波希米亚与匈牙利世袭领地的整合。\n\n利奥波德一世与名将欧根亲王击退1683年维也纳之围并大举收复多瑙河平原，将哈布斯堡君主国铸造为巴洛克艺术璀璨、坐镇中欧与巴尔干门户的大陆强权。"
 oe_lde_ctry_HAB_1776: "在女大公玛丽亚·特蕾莎与皇帝约瑟夫二世的开明专制改革下，哈布斯堡君主国全面整编常备陆军、推行义务教育、整顿行省税制并削弱农奴束缚，以应对北方普鲁士的强势崛起。\n\n作为神圣罗马帝国皇冠的世袭持有者，维也纳在西里西亚、波兰与多瑙河下游三线博弈，力图以现代官僚机器凝聚多民族中欧帝国。"
 oe_lde_ctry_HAB_1821: "1806年神圣罗马帝国解体后，弗朗茨一世以奥地利帝国之名延续哈布斯堡正统，并在1815年维也纳会议上由首相梅特涅主导构建了维系欧洲均势的“维也纳体系”。\n\n帝国掌控德意志邦联主席之位与北意大利伦巴第-威尼托重镇，是欧陆保守正统秩序的定海神针，却也须时刻防范意大利、匈牙利与斯拉夫民族主义及自由宪政浪潮的涌动。"
 oe_lde_ctry_PRU_1776: "1701年霍亨索伦家族在柯尼斯堡加冕称王，经“士兵国王”腓特烈·威廉一世厉行节俭与扩军，至腓特烈大帝治下借西里西亚战争与七年战争以弱胜强，普鲁士王国一跃跻身欧洲五强之列。\n\n无忧宫的启蒙哲学与举世闻名的铁血步兵纪律交相辉映，柏林凭借高效财政与军政动员体制，成为德意志北方足以与维也纳分庭抗礼的钢铁强权。"
 oe_lde_ctry_PRU_1821: "经历耶拿惨败后的施泰因-哈登贝格大改革——废除农奴制、重组总参谋部与推行全民兵役——普鲁士在解放战争中涅槃重生，并在1815年维也纳会议上获得富庶的莱茵兰与萨克森大片土地。\n\n横跨东普鲁士容克庄园与鲁尔-莱茵新兴煤铁工业带，柏林正借关税同盟构想与精锐常备军，悄然奠定日后统一德意志的经济与军事基石。"
 oe_lde_ctry_IRA_1648: "17世纪中叶的萨非王朝波斯以壮丽的伊斯法罕为都，承袭阿拔斯大帝开创的黄金余韵。阿拔斯二世治下国境相对安稳，波斯丝绸经霍尔木兹海峡与陆路商道远销欧亚，皇家瓷砖建筑与细密画艺术享誉世界。\n\n帝国西抗奥斯曼、东与莫卧儿争夺坎大哈，以十二伊玛目什叶派凝聚高原认同；然而朝廷渐疏武备，已为日后阿富汗部族起事埋下远忧。"
 oe_lde_ctry_IRA_1776: "历经萨非倾覆与纳迪尔沙阿骤兴骤亡的战乱之后，桑德王朝创立者卡里姆汗以“人民代理人”（瓦基勒）自居，定都设拉子，为饱经兵燹的伊朗带来二十余年宝贵的和平与复苏。\n\n设拉子广建巴扎与清真寺，波斯湾商路重现生机；然而北方阿斯塔拉巴德的卡扎尔部落正虎视眈眈，一旦桑德统治者去世，争夺伊朗王位的血战必将再起。"
 oe_lde_ctry_IRA_1821: "1796年卡扎尔王朝统一伊朗高原并定都德黑兰，在法特赫-阿里沙阿治下重建了相对稳固的波斯王权与宫廷仪典。\n\n然而19世纪初的伊朗正身陷“大博弈”夹缝：北方俄罗斯步步蚕食高加索并迫签《古利斯坦条约》，南方与东面英属印度则极力施加外交与商贸影响，德黑兰亟需整军改制以守卫千年故土。"
 oe_lde_ctry_MUG_1648: "17世纪中叶的莫卧儿帝国在沙贾汗与随后的奥朗则布治下达到鼎盛，统御印度河与恒河沃野及德干大部，岁入与手工业产值占世界四分之一左右。德里红堡与阿格拉泰姬陵正是其富甲天下的辉煌见证。\n\n帝国以曼萨布达尔官僚军事体制驾驭多元教派与拉其普特诸王公，却也在德干漫长征战与皇位继承血战中逐步耗损国力，埋下帝国由盛转衰的伏笔。"
 oe_lde_ctry_MUG_1776: "1707年奥朗则布驾崩及1739年纳迪尔沙阿洗劫德里之后，莫卧儿帝国昔日的统一霸权迅速瓦解，孟加拉、阿瓦德与海得拉巴诸省先后自立，马拉塔联军与英国东印度公司成为次大陆真正的角逐者。\n\n尽管沙阿·阿拉姆二世仍保有德里皇宫的法理尊号、被各路雄主奉为名义共主，大莫卧儿朝廷已深陷风雨飘摇的暮色之中。"
 oe_lde_ctry_MHR_1648: "17世纪中叶，西高止山脉与德干高原间崛起了一股令莫卧儿朝廷震动的新生力量。希瓦吉率领矫健的马拉塔山地轻骑，依托险峻岩堡与机动游击战法，在比贾普尔与莫卧儿夹缝间建立起“自治王国”（斯瓦拉杰）。\n\n1674年希瓦吉正式加冕称王（恰特拉帕蒂），整顿官僚八大臣制与近海水师，使马拉塔人成为印度次大陆最具生命力的本土反抗与统一旗帜。"
 oe_lde_ctry_MHR_1776: "18世纪中后期，以浦那佩什瓦宰相为中枢、由辛迪亚、霍尔卡尔、盖克瓦德与邦斯莱诸豪强组成的马拉塔邦联席卷次大陆，将势力北推至德里与旁遮普，东抵奥里萨与孟加拉边缘，成为后莫卧儿时代印度最强的本土霸权。\n\n虽历经1761年帕尼帕特大战惨败仍迅速复兴，然而诸侯内耗与英国东印度公司的步步紧逼，使浦那正面临决定全印度归属的最终决战。"
 oe_lde_ctry_USA_1776: "1776年7月4日，北美大西洋沿岸十三个殖民地在费城大陆会议发表《独立宣言》，宣告美利坚合众国诞生。乔治·华盛顿率领大陆军在物资匮乏的绝境中与大英帝国精锐周旋，并借萨拉托加胜势赢得法兰西与西班牙外援。\n\n独立之后，年轻的联邦共和国于1787年制定成文宪法确立三权分立，凭借辽阔的西部边疆与蓬勃的大西洋航运，开启新大陆共和国的崭新篇章。"
 oe_lde_ctry_USA_1821: "19世纪初的美利坚合众国已借1803年路易斯安那购地将疆域推进至落基山脉，并经1812年战争巩固了国家独立与海上自尊。在总统詹姆斯·门罗的“和谐时代”，跨阿巴拉契亚运河、汽船与棉花种植园带动经济飞速扩张。\n\n联邦人口突破九百六十万，正筹划以西半球自主外交宣示大国地位，但南北蓄奴州与自由州围绕西部新领地的裂痕亦悄然浮现。"
 oe_lde_ctry_MEX_1821: "历经十余年风起云涌的独立战争，1821年阿古斯丁·德·伊图尔比德与起义领袖比森特·格雷罗共推《伊瓜拉计划》，促成新西班牙总督区和平脱离马德里统治，建立主权独立的墨西哥国家。\n\n新生政权北接上加利福尼亚与得克萨斯、南连中美洲，继承了白银丰产的殖民地矿脉，却也须在战后财政凋敝、保守派与联邦派宪制分歧以及北方强邻扩张压力下艰难立国。"
 oe_lde_ctry_GRE_1821: "1821年春，在秘密结社“友谊社”的号召下，伯罗奔尼撒与爱琴海诸岛燃起席卷希腊的独立烽火。山地游击勇士（克莱夫特）与海岛商船水手并肩奋战，誓要推翻近四百年的奥斯曼统治，重光希腊自由邦国。\n\n这场起义迅速激起全欧洲的亲希腊文化浪潮，迫使英、法、俄三大列强介入“东方问题”，成为近代巴尔干民族解放的里程碑。"
 oe_lde_ctry_EGY_1821: "1805年阿尔巴尼亚裔名将穆罕默德·阿里夺取开罗实权，彻底肃清旧马穆鲁克贝伊势力，将奥斯曼名义下的埃及行省改造成近东最具活力的近代化强权。\n\n开罗大力推行国家垄断棉业、兴办欧式军工厂与“新军”征兵制，建起纵横红海与东地中海的精锐舰队，先后远征阿拉伯汉志与苏丹，正蓄势向黎凡特与安纳托利亚投射霸权。"
 oe_lde_ctry_CSO_1204: "靖康南渡之后，赵宋王朝定都临安（今杭州），以秦岭—淮河为界与北方金朝南北对峙。南宋虽失中原故土，却坐拥江南两浙、荆湖与巴蜀沃野，市舶海贸通达南洋与阿拉伯海，纸币会子、书院理学与精良水师皆居当世之冠。\n\n13世纪初，朝中主战派与守成派围绕北伐收复中原激辩不休，而大漠深处新兴的蒙古铁骑亦正悄然崛起，即将改写整个东亚的百年格局。"
 oe_lde_ctry_JIN_1204: "女真完颜氏建立的大金王朝灭辽克北宋，定都中都（今北京），统辖白山黑水、燕云十六州与广袤中原。朝廷以猛安谋克军户制维系女真骑兵根本，又以科举与尚书省治理百万汉民，在中原重建起兼融胡汉的北方帝国。\n\n13世纪初的金章宗朝虽文治璀璨，然猛安谋克生计日绌、黄河屡决，北方漠北蒙古诸部更已渐成心腹大患。"
 oe_lde_ctry_YUA_1444: "1368年退回漠北之后，黄金家族仍以大元国号统领草原诸部，史称北元。尽管大汗威望屡遭东西蒙古部族角逐与瓦剌太师挟制，草原骑兵仍依托阴山与河套牧场同明朝九边长期对峙。\n\n从也先、达延汗到俺答汗与林丹汗，蒙古各部反复围绕察哈尔大汗正统、草原马市与藏传佛教信仰重塑漠北秩序，时刻影响着长城内外的安危。"
 oe_lde_ctry_KOXINGA_1648: "明清鼎革之际，延平王郑成功（国姓爷）以厦门、金门与闽南沿海为根基，统率纵横东亚洋面的精锐水师，奉南明永历正朔与清廷隔海相抗。郑氏商船队北通日本长崎、南达南洋吕宋，以丰厚海贸财赋支撑反清大业。\n\n1661年郑成功挥师渡海收复台湾、驱逐荷兰东印度公司，在东宁建立明郑政权，成为汉家衣冠坚守东南海疆与海外商路的最后雄藩。"
 oe_lde_ctry_JAP_1444: "南北朝合一之后，坐镇京都室町的足利幕府在15世纪迎来北山与东山文化的繁华，与明朝展开勘合贸易并由细川、畠山、斯波三管领辅理幕政。然而将军直领有限，各地守护大名拥兵自重。\n\n随着嘉吉之乱与应仁之乱接踵爆发，室町幕府的全国统筹力迅速瓦解，列岛步入群雄并起、下克上频仍的战国时代。"
 oe_lde_ctry_KOR_1204: "1170年武臣政变之后，开京的高丽王朝进入由武人执政的特殊时期。13世纪初崔忠献确立崔氏政权，设立教定都监与三别抄私兵，在保留王氏王室名义的同时总揽军政大权。\n\n高丽境内高丽青瓷、雕版佛经与海上贸易依旧兴盛，却很快要面对北方蒙古大军连番南侵的严峻考验。"
 oe_lde_ctry_TIB_1648: "1642年固始汗率领和硕特蒙古劲旅入藏，尊奉五世达赖喇嘛建立甘丹颇章政权，在拉萨重修宏伟的布达拉宫，确立了政教合一的雪域高原统治体制。\n\n此后数百年间，西藏在格鲁派寺庙网络、和硕特与准噶尔草原势力及大清驻藏大臣的互动中，维系着绵延喜马拉雅与青藏高原的宗教文化中枢地位。"
 oe_lde_ctry_RYU_1444: "1429年尚巴志统一冲绳三山，定都首里，建立琉球王国。作为东亚海洋的“万国津梁”，琉球凭借对明清的朝贡贸易特权，将中国丝瓷、日本刀银与南洋香料苏木连成一线，曾一度铸就海上中转繁荣。\n\n1609年萨摩藩渡海入主之后，琉球在维系对华册封朝贡与受萨摩暗中节制的双重格局下，仍坚守独具特色的岛国礼乐与商贸生机。"
 oe_lde_ctry_MCH_1444: "长白山麓与松花江、牡丹江流域聚居着建州、海西与野人女真诸部。明朝前期设建州卫、奴儿干都司羁縻马市，女真诸部以人参、貂皮换取中原铁器布帛，并逐渐在辽东边外壮大。\n\n16世纪末努尔哈赤以十三副遗甲起兵，创制八旗军政合一制度并统一女真各部，1616年建号后金，挥师辽沈，蓄势问鼎中原。"
 oe_lde_ctry_CDL_1204: "段氏大理国坐落于苍山洱海之间，承续南诏故土，崇奉密宗佛教，控扼滇川茶马古道与通往中南半岛的西南孔道。朝廷内有高氏世相辅政，外与南宋保持通商互市与良马贸易。\n\n凭借横断山脉天险，大理在西南边陲安享三百年偏安，直到13世纪中叶忽必烈率蒙军革囊渡金沙江，才面临立国以来的生死大考。"
 oe_lde_ctry_CHG_1444: "西察合台为帖木儿一系取代之后，天山南北与塔里木盆地的察合台汗室仍以东察合台汗国（蒙兀儿斯坦）之名延续成吉思汗次子的正统血脉。汗国兼具游牧骑兵与绿洲商城，长期同帖木儿后王、瓦剌与哈萨克诸部角逐伊犁河谷与丝路绿洲。\n\n16世纪后，叶尔羌与吐鲁番诸分支在天山南麓延续察合台汗统，维系着伊斯兰苏菲教团与丝绸之路绿洲贸易网络。"
 oe_lde_ctry_APD_1444: "阿帕儿迪部是活跃于阿姆河以南、巴尔赫与舍巴尔甘一带的突厥—蒙古部族势力。自归附帖木儿帝国以来，部族贵族世代掌管吐火罗斯坦与兴都库什山北麓的牧场、驿堡与绿洲军赋，成为连接河中、呼罗珊与喀布尔走廊的重要边疆力量。\n\n在帖木儿后王、乌兹别克布哈拉汗国与阿富汗杜兰尼王朝相继更迭的数百年间，阿帕儿迪诸异密依托城寨与骑兵部众纵横周旋，始终是中亚南缘不可忽视的地方豪强。"
 oe_lde_ctry_OIR_1444: "瓦剌（四卫拉特）由绰罗斯、和硕特、土尔扈特与杜尔伯特四部结盟而成，游牧于阿尔泰山脉与准噶尔盆地之间。15世纪中叶，太师脱欢与也先大举东进，一度统一东西蒙古并在1449年土木堡之战大败明军、俘获明英宗。\n\n虽在也先遇刺身亡后重归分立，瓦剌四部依然是天山北麓与漠西草原最具战斗力的游牧联盟，静待下一个整合西域的雄主崛起。"
 oe_lde_ctry_DZUNGAR_1648: "17世纪中叶，卫拉特绰罗斯部首领巴图尔珲台吉与噶尔丹在伊犁河谷建立准噶尔汗国，成为欧亚大陆最后一个横跨天山南北的强大游牧帝国。汗国一面引入火绳枪、铜炮与铁矿冶炼，一面掌控塔里木绿洲税赋并深涉漠北喀尔喀与西藏政局。\n\n在噶尔丹、策妄阿拉布坦与噶尔丹策零治下，准噶尔与大清围绕漠北、青海与西域霸权展开长达七十年的世纪争雄，同时也在哈萨克草原与西伯利亚边线同俄国周旋。"
 oe_lde_ctry_KAZ_1444: "15世纪中叶，术赤系宗王克烈与贾尼别克率领不满阿布海尔统治的游牧部众迁往楚河与七河流域，创建哈萨克汗国。汗国在哈斯木汗、哈克纳扎尔汗与头克汗治下鼎盛一时，颁布《七项法典》，控扼锡尔河商镇与辽阔的钦察大草原。\n\n面对南面乌兹别克布哈拉汗国、西面诺盖与东面准噶尔的铁骑冲击，哈萨克大中小三玉兹以机动骑射守护着欧亚腹地的广袤牧野。"
 oe_lde_ctry_KAZ_1776: "18世纪中叶以来，历经准噶尔“大灾难”劫难的哈萨克大、中、小三玉兹在杰出政治家阿布赉汗引领下浴火重生。汗国西邻步步推进西伯利亚筑垒线的俄罗斯帝国，东接平定准噶尔后的大清伊犁将军辖区，南望浩罕与布哈拉绿洲。\n\n阿布赉汗凭借灵巧的多边外交，在俄清两大帝国之间维系了中玉兹与大玉兹的实际自主，成为近代哈萨克草原独立精神的象征。"
 oe_lde_ctry_UZB_1648: "16世纪初昔班尼汗率乌兹别克部众南下河中，取代帖木儿后王，以布哈拉与撒马尔罕为核心建立布哈拉汗国（后演为埃米尔国）。历经昔班尼、阿斯特拉罕（札尼）与曼吉特诸朝，布哈拉长期是中亚伊斯兰经学院、丝绸工坊与商队驿站最繁盛的学术与贸易都会。\n\n在奥斯曼、萨非波斯、俄罗斯与清朝西域势力交汇的大棋局中，布哈拉凭借丰饶泽拉夫尚河绿洲与精锐骑兵守护着河中腹地。"
 oe_lde_ctry_KHW_1648: "16世纪初乌兹别克昔班系一支在阿姆河下游的花剌子模绿洲建国，后迁都希瓦，史称希瓦汗国。汗国四面环绕卡拉库姆与克孜勒库姆大漠，凭借精密渠系灌溉沃土，并依托里海东岸土库曼骑兵扼守通往阿斯特拉罕与呼罗珊的荒漠商道。\n\n18至19世纪弘吉剌王朝执政期间，希瓦在伊昌卡拉内城广筑宣礼塔与宫殿，以顽强意志抵御波斯纳迪尔沙阿与俄国远征军的渗透。"
 oe_lde_ctry_CRI_1444: "1441年前后，术赤后王哈吉·格来在克里米亚半岛脱离金帐大汗自立，创立克里米亚汗国，定都巴赫奇萨赖。1475年奥斯曼夺取热那亚卡法港后，明里·格来汗与高门结成宗藩同盟，汗国成为奥斯曼在黑海北岸最锐利的骑兵前锋。\n\n克里米亚轻骑频繁北掠波兰—立陶宛与莫斯科南疆，1571年更一度兵临莫斯科城下，是东欧草原长盛不衰的军事强权。"
 oe_lde_ctry_CRI_1648: "17至18世纪的克里米亚汗国坐镇巴赫奇萨赖汗宫，依托彼列科普地峡要塞与诺盖附属部族，在哥萨克起义与俄土争霸中纵横驰骋。伊斯兰·格来三世一度助乌克兰盖特曼大败波兰，令汗国声势复振。\n\n然而随着彼得大帝与叶卡捷琳娜二世麾下的俄国近代陆海军步步南推，克里米亚在1774年脱离奥斯曼羁绊后陷入内外交困，草原古国正面临被黑海霸权吞并的危局。"
 oe_lde_ctry_NOG_1444: "诺盖汗国肇始于金帐权臣也迪古率领的忙兀惕部族，15至17世纪游牧于伏尔加河下游、雅伊克河与咸海北岸之间的辽阔草原，以萨莱楚克为中枢。诺盖人向莫斯科和克里米亚源源不断供应战马与牲畜，深度介入喀山、阿斯特拉罕与西伯利亚诸汗国政局。\n\n1556年俄国吞并阿斯特拉罕后，诺盖分裂为大诺盖与小诺盖两部，并因卡尔梅克人西迁而在黑海与北高加索草原间继续迁徙求存。"
 oe_lde_ctry_KALMYK_1648: "17世纪初，卫拉特诸部兵分两路书写了壮阔的草原迁徙史：土尔扈特部西渡哈萨克草原，在伏尔加河下游建立笃信藏传佛教的卡尔梅克汗国；和硕特部则在固始汗率领下南控青海与西藏，成为雪域护法汗廷。\n\n卡尔梅克骑兵屡助俄国征战黑海与波罗的海，却因沙俄步步收紧自治权，终在1771年由渥巴锡汗率部万里东归，留下震撼欧亚的“土尔扈特东归”史诗。"
 oe_lde_ctry_KHALKHA_1648: "漠北喀尔喀蒙古承袭达延汗幼子格哷森札一系，分为土谢图汗、车臣汗与札萨克图汗三部，拱卫鄂尔浑河谷与哈拉和林故地，以哲布尊丹巴呼图克图为精神领袖。\n\n17世纪后期面对准噶尔噶尔丹大举东征，喀尔喀诸汗在多伦会盟归附大清，保留盟旗世袭领地，成为大清北疆拱卫漠北草原与恰克图商路的重要藩屏。"
 oe_lde_ctry_TIM_1444: "帖木儿大帝席卷河中、波斯与印度河后，其子沙哈鲁与孙乌鲁伯格在15世纪将赫拉特与撒马尔罕铸造为“帖木儿文艺复兴”的璀璨双璧。天文台、青釉穹顶清真寺、波斯细密画与察合台突厥文学交相辉映，名扬伊斯兰世界。\n\n然而诸王分封体制令帝国在沙哈鲁晚年陷入连绵内战，西面黑羊、白羊部与北方乌兹别克骑兵正步步蚕食呼罗珊与河中故土。"
 oe_lde_ctry_GLH_1444: "15世纪中叶，昔日威震欧亚的金帐汗国已分化出克里米亚、喀山与乌兹别克诸汗国，仍据守下伏尔加草原与萨莱故地的主支被史家称为“大帐汗国”。\n\n阿合马汗力图重振术赤汗室威权并迫使莫斯科续纳贡赋，却在1480年乌格拉河对峙无功而返；在莫斯科、克里米亚与诺盖的夹击下，大帐汗国正走向术赤正统在伏尔加草原的最后黄昏。"
 oe_lde_ctry_VEN_1204: "1204年，年逾九旬的盲眼总督恩里科·丹多洛运筹帷幄，借第四次十字军改道君士坦丁堡一举分得罗马帝国八分之三的岛屿与海港，将克里特、优卑亚与爱琴海要冲尽数纳入威尼斯“海上领地”。\n\n圣马可飞狮的舰队从此独步东地中海与亚得里亚海，商船满载黎凡特香料与丝绸归航泻湖，奠定威尼斯长达数世纪的商业共和国霸业。"
 oe_lde_ctry_VEN_1444: "15世纪的“最尊贵共和国”威尼斯正处极盛之巅：海上仍握达尔马提亚、克里特、爱奥尼亚诸岛乃至塞浦路斯，陆上亦向伦巴第拓展出富庶的“本土领地”（泰拉费尔马）。造船厂阿森纳流水线日夜赶造战船，印刷术与文艺复兴画派在运河之城熠熠生辉。\n\n然而奥斯曼海军在东地中海的强势崛起，以及意大利诸强与欧陆列强对威尼斯陆上扩张的戒备，正让泻湖贵族面临双线角逐的严峻考验。"
 oe_lde_ctry_VEN_1648: "17至18世纪的威尼斯共和国虽因大西洋新航路兴起而不再独占香料贸易，依然以坚韧的海军与外交手腕屹立亚得里亚海。克里特坎迪亚长达二十四年的血战与莫罗西尼一度收复伯罗奔尼撒的壮举，彰显着老牌海权帝国的最后荣光。\n\n步入18世纪，威尼斯在维瓦尔第音乐、嘉年华与谨慎中立中守望泻湖，却已难以阻挡革命法兰西与哈布斯堡帝国横扫亚平宁的风暴。"
 oe_lde_ctry_GEN_1444: "热那亚共和国凭借险峻利古里亚良港与久负盛名的圣乔治银行，在中世纪晚期至近代早期稳居欧洲金融与海运枢纽。尽管黑海卡法与爱琴海希俄斯相继易手，安德烈亚·多利亚在1528年重塑贵族共和宪制，并借充当西班牙哈布斯堡王朝头号银行家开创了“热那亚人的世纪”。\n\n此后虽历经法军炮轰与科西嘉易手，热那亚商行与航运网络仍在西地中海保持着顽强的商业生命力。"
 oe_lde_ctry_MLO_1444: "米兰公国雄踞富饶的波河伦巴第平原，扼守阿尔卑斯山南麓通往意大利腹地的咽喉。15世纪中叶雇佣兵名将弗朗切斯科·斯福尔扎取代维斯孔蒂家族入主米兰，使宫廷成为列奥纳多·达·芬奇与布拉曼特云集的文艺复兴艺术与军工重镇。\n\n因其无与伦比的战略枢纽地位，米兰自意大利战争起便成为法兰西、西班牙与哈布斯堡奥地利反复争夺的北意大利锁钥。"
 oe_lde_ctry_FLO_1444: "自科西莫·德·美第奇于1434年执掌政局起，佛罗伦萨在美第奇家族庇护下成为欧洲文艺复兴的璀璨心脏，银行汇兑网络遍布西欧，人文主义、绘画与雕塑群星闪耀。\n\n16世纪并入锡耶纳并升格为托斯卡纳大公国后，美第奇与后继的哈布斯堡—洛林大公先后开辟利沃诺自由港、推行开明法典改革（甚至率先废除死刑），使托斯卡纳稳居亚平宁最富庶文明的邦国之一。"
 oe_lde_ctry_PAP_1444: "结束大分裂重返永恒之城后，文艺复兴至近代早期的教皇国横贯意大利中部，自圣彼得大教堂的宏伟重建到特伦托公会议引领的天主教反宗教改革，罗马既是西欧精神中枢，也是纵横列强间的关键外交支点。\n\n步入18至19世纪，面对启蒙思潮、拿破仑铁骑与意大利统一浪潮，教廷在维也纳会议恢复世俗领地后，正审慎守护着绵延千年的圣座法统与中部意大利领土。"
 oe_lde_ctry_NAP_1444: "1442年阿拉贡国王阿方索五世入主那不勒斯，将南意大利与西西里纳入西地中海冠冕体系，使那不勒斯成为文艺复兴人文主义重镇。此后两百余年间，该地在西班牙哈布斯堡总督治下成为西地中海舰队基地与谷物丝绸产区。\n\n面对奥斯曼海盗袭扰与法兰西多次争夺王位，这座维苏威火山脚下的繁华大都会始终扼守着中地中海的海上十字路口。"
 oe_lde_ctry_NAP_1776: "1734年西班牙波旁王子卡洛斯登基，开创独立的波旁那不勒斯—西西里王朝，随后在1816年正式合并为两西西里王国。巴洛克宫殿、圣卡洛歌剧院与庞贝古城发掘令那不勒斯跻身欧洲人口最稠密的文化名城之列。\n\n在拿破仑战争动荡与1820年烧炭党宪政起义之后，两西西里王国依托奥地利保守秩序维系南意大利统治，却正面对自由派改革与统一思潮的涌动。"
 oe_lde_ctry_SAV_1444: "萨伏依家族世代镇守阿尔卑斯山诸隘口，被誉为“阿尔卑斯的守门人”。自16世纪迁都都灵并重心东移皮埃蒙特后，萨伏依公爵在法兰西与哈布斯堡两大强邻间左右逢源，终在1720年换得撒丁王冠，升格为撒丁—皮埃蒙特王国。\n\n1815年兼并热那亚之后，都灵手握精锐陆军与利古里亚海港，正悄然积蓄引领意大利民族复兴运动的雄厚资本。"
 oe_lde_ctry_BAV_1444: "维特尔斯巴赫家族统御的巴伐利亚雄踞多瑙河上游与阿尔卑斯山北麓，是南德意志最强大的天主教邦国。三十年战争中马克西米利安一世赢得选帝侯尊位与上普法尔茨，将慕尼黑装点为南德巴洛克艺术之都。\n\n1806年升格为巴伐利亚王国并颁布早期立宪宪章后，慕尼黑在德意志邦联中力图打造介于奥地利与普鲁士之间的“第三德意志”平衡力量。"
 oe_lde_ctry_SAX_1444: "韦廷家族自1423年获封萨克森选帝侯以来，坐拥富饶的埃尔茨山银矿、莱比锡贸易博览会与德累斯顿宫廷，更是16世纪宗教改革运动的重要摇篮。\n\n18世纪强力王奥古斯特兼领波兰王冠并缔造迈森瓷器与易北河畔的巴洛克建筑奇观；尽管在1815年割让大片领土予普鲁士，萨克森王国依然凭借发达纺织与机械工业稳居德意志经济核心。"
 oe_lde_ctry_HAN_1648: "韦尔夫家族不伦瑞克—吕讷堡支系于17世纪整合下萨克森领地，1692年晋升汉诺威选帝侯；1714年选侯格奥尔格·路德维希继承大不列颠王位，开启长达百余年的英汉共主邦联。\n\n凭借格丁根大学启蒙学术、莱茵—威悉河防务及1814年升格王国的尊位，汉诺威在德意志北部成为英国介入欧陆均势与制衡普鲁士扩张的关键支点。"
 oe_lde_ctry_BRA_1444: "1415年霍亨索伦家族受封勃兰登堡选帝侯，以柏林—科隆为治所，在易北河与奥得河之间的沙质平原上励精图治、削平豪强并整顿财政。\n\n17世纪初勃兰登堡先后继承莱茵兰克莱沃与波罗的海畔的普鲁士公国，奠定了横跨北德意志的领土骨架，正蓄势向近代欧陆强权迈进。"
 oe_lde_ctry_BRA_1648: "历经三十年战争浩劫之后，“大选帝侯”腓特烈·威廉以铁腕重塑勃兰登堡—普鲁士：建立效忠君主的常备陆军、改革消费税并接纳法国胡格诺工匠，同时借1657年条约摆脱波兰对东普鲁士的宗主权。\n\n1675年费尔贝林大败瑞典名军后，柏林已隐然成为德意志北方最具进取心的军事新星，距加冕普鲁士王国仅一步之遥。"
 oe_lde_ctry_BOH_1444: "历经胡斯战争烽火洗礼的波希米亚王国拥有中欧最富饶的银矿、手工业城市与骄傲的贵族议会，布拉格查理大学亦是中欧学术重镇。\n\n在波杰布拉德的乔治与雅盖隆诸王治下，波希米亚在天主教与圣杯派宗教共存中维持王国自治，直到1526年后并入哈布斯堡冠冕体系，仍长期是神圣罗马帝国选帝侯团中最具分量的世俗王国。"
 oe_lde_ctry_HUN_1444: "15世纪中叶的匈牙利王国坐镇多瑙河中游与喀尔巴阡盆地，是基督教欧洲抵御奥斯曼帝国西进的第一道铁壁。名将匈雅提·亚诺什在贝尔格莱德大破穆罕默德二世，其子马加什一世更组建闻名欧洲的“黑军”常备兵并使布达宫廷成为文艺复兴北上阿尔卑斯后的首个重镇。\n\n然而随着大贵族掣肘王权与奥斯曼国力日盛，多瑙河防线正面临决定中欧百年命运的终极考验。"
 oe_lde_ctry_SWI_1444: "瑞士邦联由阿尔卑斯山谷诸州与自由城市结盟而成，凭借令欧洲骑士闻风丧胆的长矛方阵步兵先后重创哈布斯堡与勃艮第强敌，并在1648年《威斯特伐利亚和约》中获得脱离神圣罗马帝国的正式独立承认。\n\n历经拿破仑时代震荡后，1815年维也纳会议确认了瑞士的永久中立地位，使其在欧洲列强环伺的高山隘口间长保联邦自治、精密工艺与金融繁荣。"
 oe_lde_ctry_DLH_1444: "历经1398年帖木儿洗劫之后，15世纪中叶的德里苏丹国虽已失去昔日席卷全印的帝国版图，但在赛义德与随后兴起的阿富汗洛迪王朝治下，仍控扼恒河上游、旁遮普与德里重镇。\n\n洛迪诸苏丹以阿富汗部族联盟重整北印度军政、兼并章普尔，与梅瓦尔拉其普特诸王角逐印度斯坦霸权，直至1526年帕尼帕特平原迎来巴布尔的火炮铁骑。"
 oe_lde_ctry_VIJ_1444: "15至16世纪的毗奢耶那伽罗帝国坐镇通加巴德拉河畔宏伟的亨比都城，统御德干南部与东西海岸丰饶港口，在克里希纳德瓦拉亚治下迎来南印度印度教文明的黄金时代。\n\n帝国以大型水利蓄水池滋养农田，凭借胡椒贸易、葡萄牙战马输入与精锐步骑长期与北方巴赫曼尼及德干诸苏丹国抗衡，留下气势恢宏的南印神庙建筑与梵文、泰卢固文文学瑰宝。"
 oe_lde_ctry_BAH_1444: "巴赫曼尼苏丹国于1347年脱离德里苏丹国建于德干高原，定都古尔伯加与比德尔，融合波斯宫廷文化、乌尔都语言文学与阿拉伯海贸易网络，是印度中部首屈一指的伊斯兰强权。\n\n苏丹国一方面南与毗奢耶那伽罗围绕莱丘尔沃土连年征战，一方面在朝廷内部面临德干本土派与波斯外来派贵族的派系倾轧，最终在16世纪初分化为比贾普尔、戈尔康达等德干五苏丹国。"
 oe_lde_ctry_MYS_1648: "毗奢耶那伽罗衰落之后，沃德亚尔王朝在卡纳塔克高原建立迈索尔王国。18世纪后期，铁腕统帅海德尔·阿里与其子“迈索尔之虎”蒂普苏丹以西式新军、国家垄断商贸与闻名世界的铁壳火箭炮，将迈索尔锻造为全印度最令英国东印度公司忌惮的劲敌。\n\n历经四次惨烈的英迈战争与1799年斯里兰加帕特纳陷落后，复辟的沃德亚尔王室在附庸体制下延续着迈索尔精致的宫廷治理与工艺传统。"
 oe_lde_ctry_HYD_1648: "德干腹地的戈尔康达与海得拉巴自古以璀璨钻石矿藏与波斯—印度融合文化闻名天下。1724年莫卧儿重臣阿萨夫·贾赫一世自立为海得拉巴尼扎姆，将这座高原重镇塑造成后莫卧儿时代印度最富庶、最具外交手腕的王公大国。\n\n周旋于马拉塔骑兵、迈索尔强邻与英法东印度公司之间，海得拉巴宫廷在19世纪依然稳居次大陆头号附庸邦国之列。"
 oe_lde_ctry_BNG_1444: "恒河与布拉马普特拉河交汇的孟加拉三角洲土地肥沃、水网密布，14至16世纪在伊利亚斯·沙希与侯赛因·沙希王朝治下长期保持独立苏丹国地位，细棉布、生丝与造船业远销欧亚，被誉为“诸国之天堂”。\n\n并入莫卧儿帝国后，孟加拉依然是全印最富庶的财赋行省，18世纪初更在纳瓦布治下高度自治，直至欧洲商站势力与普拉西之战改写次大陆命运。"
 oe_lde_ctry_EIC_1776: "1757年普拉西之战与1765年取得孟加拉征税权之后，英国东印度公司以加尔各答威廉堡为中枢，由商业特许公司蜕变为雄踞恒河下游的殖民领土政权。\n\n依托孟加拉丰沛田赋、印度土兵近代化陆军与皇家海军海运补给，公司总督府先后击败迈索尔与马拉塔邦联，将英属印度的统治网络迅速铺向整个印度次大陆。"
 oe_lde_ctry_PUN_1776: "18世纪中叶莫卧儿与阿富汗杜兰尼王朝在印度河上游拉锯之际，旁遮普的锡克教武士社群结成十二个“米斯尔”武装联盟，以阿姆利则金庙为精神核心，逐步收复五河沃野。\n\n1799年“旁遮普之狮”兰吉特·辛格入主拉合尔、统一各部建立锡克帝国，引入欧式炮兵与近代军纪，北克克什米尔、西取白沙瓦，铸就19世纪初英属印度西北最令人生畏的本土强权。"
 oe_lde_ctry_GUJ_1444: "古吉拉特苏丹国于1407年脱离德里自立，定都艾哈迈达巴德，掌控坎贝湾与苏拉特等印度洋头等海港。境内棉纺织品、靛蓝与宝石工艺名动四海，阿拉伯、波斯与马来商舶云集港口。\n\n16世纪初苏丹国一度联合奥斯曼与马穆鲁克舰队在印度洋抗衡葡萄牙人，直到1573年被阿克巴大帝并入莫卧儿版图。"
 oe_lde_ctry_MEW_1444: "拉杰普塔纳的梅瓦尔、马尔瓦尔等拉其普特诸王国依托塔尔沙漠边缘与阿拉瓦利山脉的险峻岩堡，世代恪守尚武与荣光传统。15世纪的拉纳·昆巴与16世纪的拉纳·桑加、普拉塔普曾率拉其普特联军与德里、古吉拉特及莫卧儿大军血战沙场。\n\n无论在联姻结盟莫卧儿朝廷还是独立固守奇托尔与乌代布尔岩城的岁月里，拉其普特诸邦始终是北印度最具凝聚力的武士贵族力量。"
 oe_lde_ctry_AYU_1444: "1351年立都湄南河冲积平原河心岛的阿瑜陀耶王国（大城王朝），凭借富饶稻米产区与通达中日、印度及欧洲商团的国际河港，迅速崛起为中南半岛最繁华的商业帝国。\n\n历代暹罗国王兼收高棉王权仪典与上座部佛教法统，在纳黎萱大帝与那莱王治下既成功抗衡缅甸东吁入侵，又广派使节远赴凡尔赛与京师，铸就大城盛世。"
 oe_lde_ctry_SIA_1776: "1767年大城遭缅军焚毁后，郑信率军光复湄南河建立吞武里王朝；1782年拉玛一世迁都曼谷，开创绵延至今的却克里（曼谷／拉达那哥欣）王朝。\n\n拉玛一世与拉玛二世在重建大皇宫与三印法典的同时，积极开展对华帆船贸易、稳固老挝与柬埔寨藩属，并敏锐应对英国在马来半岛与缅甸方向日益迫近的殖民浪潮。"
 oe_lde_ctry_DAI_1444: "1428年黎利驱逐明军、在升龙（今河内）建立后黎朝，大越步入儒学科举、洪德律典与南进拓土的鼎盛时期，黎圣宗朝更将疆界向占婆故地大幅推进。\n\n17至18世纪虽历经北方郑主与南方广南阮主南北分庭的长期对峙，红河与湄公河三角洲的农垦与商港依然欣欣向荣，直至西山起义打破百年僵局。"
 oe_lde_ctry_DAI_1821: "1802年阮福映（嘉隆帝）平定西山势力，首次将红河三角洲、中部顺化与南方湄公河沃野完全统合于一朝之下，定国号“越南”，以顺化紫禁城为帝都。\n\n明命帝即位后厉行中央集权与儒家典制，整饬南北行省并经略柬埔寨与老挝边陲，同时审慎警戒法国传教士与西洋舰船在南海的频频现身。"
 oe_lde_ctry_TNG_1444: "16世纪中叶，东吁王朝在德彬瑞蒂与勃印囊大帝引领下横扫伊洛瓦底江流域、掸邦高原乃至兰纳与暹罗，缔造了中南半岛史上疆域最广的陆上帝国。\n\n17世纪复辟后的后东吁王朝将都城北迁阿瓦，整顿内政与贡赋体系，长期守护上缅甸腹地与印度洋海口，直到18世纪中叶孟族叛乱颠覆旧朝。"
 oe_lde_ctry_KONBAUNG_1776: "1752年雍籍牙（阿朗帕亚）起兵统一缅甸，建立尚武强盛的贡榜王朝。新朝不仅在1767年攻破暹罗大城、更屡次在滇缅边境挡住大清远征军，随后向西兼并若开、曼尼普尔与阿萨姆，将缅甸国威推向巅峰。\n\n然而西拓孟加拉边境的锐势，亦使阿瓦与阿玛拉普拉宫廷直接迎上了大英东印度公司的殖民锋芒。"
 oe_lde_ctry_MAJ_1444: "15世纪的满者伯夷帝国虽已走过首相加查·马达与哈奄·武禄时代的鼎盛巅峰，仍以东爪哇特罗乌兰为王都，维持着覆盖努山塔拉群岛的印度—爪哇宫廷文化与稻米香料海运网络。\n\n随着爪哇北岸港口穆斯林商邦（淡目、锦石等）与马六甲海峡贸易新贵的崛起，这座古老的海洋曼陀罗帝国正面临宗教转型与海上霸权易主的转折点。"
 oe_lde_ctry_MTM_1648: "兴起于中爪哇沃土的马塔兰苏丹国，在阿贡苏丹治下统一爪哇绝大部，成为岛上最具威望的伊斯兰王权，甚至两度兴师围攻荷兰东印度公司据点巴达维亚。\n\n18世纪历经王位内争并在《吉安蒂条约》后分为日惹与梭罗两大王宫，马塔兰承续的爪哇宫廷皮影、甘美兰礼乐与农耕文化依然是千岛之国深厚的精神脊梁。"
 oe_lde_ctry_ATJ_1444: "扼守马六甲海峡黄金水道，15世纪的马六甲苏丹国与16至19世纪的苏门答腊亚齐苏丹国相继执掌东南亚穆斯林海贸牛耳。亚齐在伊斯干达·穆达苏丹治下拥有巨型战船、奥斯曼火炮顾问与遍布苏门答腊的胡椒产区，被誉为“麦加走廊”。\n\n面对葡萄牙、荷兰与英国殖民舰队的轮番封锁，海峡苏丹国凭借丰饶香料与伊斯兰学术威望顽强守卫着南洋西大门。"
 oe_lde_ctry_KHM_1444: "1431年弃守吴哥故都南迁湄公河与洞里萨河交汇的查托穆克（金边）与洛韦之后，后吴哥时代的高棉王国由内陆神王农耕帝国转型为活跃的河海商贸邦国，迎来明清、日本与葡萄牙商旅。\n\n然而自17世纪起，夹在西面暹罗与东面越南阮氏两大强邻之间，高棉宫廷在守护古老佛法与王朝独立方面承受着越来越沉重的地缘压力。"
 oe_lde_ctry_BEI_1648: "婆罗洲北岸的文莱苏丹国在15至16世纪博尔基亚苏丹治下迎来海上黄金时代，商船与宗主网络一度远达苏禄群岛与吕宋马尼拉湾，以樟脑、胡椒与南海海贸闻名。\n\n尽管1578年遭西班牙远征冲击并因内乱缩减疆域，文莱王室依然在婆罗洲北岸延续数百年独立苏丹统治，周旋于苏禄、荷兰与英国海上势力之间。"
 oe_lde_ctry_NSP_1648: "新西班牙总督区建于阿兹特克特诺奇蒂特兰故址之上，以墨西哥城为中枢，辖境北达加利福尼亚与得克萨斯、南连中美洲并遥领跨太平洋的菲律宾群岛。\n\n萨卡特卡斯与瓜纳华托的巨型银矿经韦拉克鲁斯大西洋银船与阿卡普尔科“马尼拉大帆船”贯通欧美亚三大洲，铸就了世界近代史上第一条真正意义上的全球白银贸易环线。"
 oe_lde_ctry_PERU_1648: "建立于印加故土上的秘鲁总督区以利马“诸王之城”为首府，坐拥波托西银山与安第斯高原矿脉，长期是西班牙南美帝国的财赋与保王重镇。\n\n步入1821年，随着圣马丁与玻利瓦尔南北解放军兵临利马与安第斯高地，古老的秘鲁正从效忠马德里的殖民堡垒迈向主权独立的南美共和国。"
 oe_lde_ctry_COL_1776: "坐落于安第斯山脉北端与加勒比海要冲，新格拉纳达总督区（以波哥大与卡塔赫纳为双核）扼守巴拿马地峡与黄金祖母绿产区。\n\n1819年博亚卡大捷之后，西蒙·玻利瓦尔以新格拉纳达、委内瑞拉与基多合组“大哥伦比亚共和国”，誓要以统一的拉丁美洲共和联邦抵御旧大陆列强干预。"
 oe_lde_ctry_BRZ_1648: "广袤的葡属巴西凭借东北蔗糖种植园与18世纪米纳斯吉拉斯黄金钻石热潮，成为葡萄牙跨洋帝国无可替代的经济命脉，班代兰特斯拓荒队更将疆界远远推进至亚马孙与拉普拉塔内陆。\n\n1808年葡萄牙王室为避拿破仑渡海迁都里约热内卢，1815年巴西升格联合王国；1821年随着若昂六世返葡，摄政王佩德罗正站在宣告巴西帝国独立的门槛上。"
 oe_lde_ctry_LAP_1776: "1776年西班牙设立拉普拉塔总督区，使布宜诺斯艾利斯跃升为南大西洋举足轻重的白银、皮革与草原牧业大港。\n\n1810年五月革命与1816年图库曼独立宣言之后，拉普拉塔联合省一面派出安第斯大军驰援智利与秘鲁独立，一面在布宜诺斯艾利斯集权派与潘帕斯草原联邦考迪罗的激辩中摸索建国方略。"
 oe_lde_ctry_INC_1444: "1438年帕查库蒂击败强敌昌卡人并改组库斯科后，印加帝国“塔万廷苏尤”（四方世界）沿安第斯山脉迅猛扩张，以万里印加驿道、梯田粮仓与结绳记事（奇普）统御从厄瓜多尔至智利中部的数百万子民。\n\n这座不使用铁器与车轮却铸就太阳神庙与马丘比丘奇迹的高山帝国，正迎来前哥伦布时代美洲文明最辉煌的巅峰。"
 oe_lde_ctry_AZT_1444: "1428年特诺奇蒂特兰、特斯科科与特拉科潘缔结三国同盟，墨西加人（阿兹特克）借浮田农耕（奇南帕）与精锐鹰豹武士迅速称雄墨西哥谷地，向两洋之间的数百座城邦征收可可、羽饰与黄金贡赋。\n\n在蒙特苏马一世与二世治下，特斯科科湖心的水上大都会人口数十万、神庙巍峨，却也因重税贡赋体制在强敌环伺的中美洲积聚着深层裂痕。"
 oe_lde_ctry_CAN_1776: "七年战争后英法圣劳伦斯河流域易帜，随着美国独立战争后大批保王党人北迁，英属北美分化出讲法语的下加拿大（魁北克）与讲英语的上加拿大（安大略），并辅以大西洋海洋诸省。\n\n历经1812年战争成功击退美军北犯之后，这片盛产木材、毛皮与小麦的北方疆土正逐步凝聚出独特的英法双语议会自治传统。"
 oe_lde_ctry_ETH_1444: "埃塞俄比亚所罗门王朝雄踞阿比西尼亚高原，自15世纪扎拉·雅各布大帝整饬教会礼仪、通使欧洲，到17世纪法西利达斯定都贡德尔、营建雄伟的城堡群，始终是非洲之角最坚韧的基督教古国。\n\n即便历经16世纪阿达尔苏丹国铁骑冲击与18至19世纪“诸王公时代”的地方割据，高原古国仍凭借天险与悠久正教法统守住了千年独立火种。"
 oe_lde_ctry_MAL_1444: "15世纪的马里帝国虽不再拥有曼萨·穆萨朝圣时代横贯西萨赫勒的绝对威势，仍控扼尼日尔河上游的班布克与布雷金矿，以尼亚尼为都维系曼丁戈王室的古老威望。\n\n面对东面新兴桑海帝国夺取廷巴克图、北面图阿雷格袭扰以及大西洋岸葡萄牙海船初现，这座传奇黄金帝国正努力在商路变迁中守护故土。"
 oe_lde_ctry_SON_1444: "15世纪中后期，桑尼·阿里与阿斯基亚·穆罕默德大帝以加奥为基业，先后将杰内、廷巴克图与尼日尔河大拐弯尽数纳入版图，缔造西非历史上疆域最广的桑海帝国。\n\n廷巴克图的桑科雷清真寺与大学汇聚数万卷手抄本，跨撒哈拉黄金与食盐商队川流不息，直到1591年摩洛哥火绳枪远征队穿越沙漠才震撼了这座萨赫勒盛世帝国。"
 oe_lde_ctry_MOR_1444: "雄踞阿特拉斯山脉与直布罗陀海峡南岸，摩洛哥历经马林、萨阿德与阿拉维诸王朝，始终是马格里布唯一未曾臣服奥斯曼帝国的独立伊斯兰王国。1578年三王战役大败葡萄牙并随后远征廷巴克图，令萨阿德王朝威震西地中海与撒哈拉。\n\n17世纪起伊斯梅尔苏丹率阿拉维王朝在梅克内斯与非斯重振王权，凭借大西洋港口与强悍骑兵长保西非北门独立不屈。"
 oe_lde_ctry_MAM_1444: "15世纪的布林吉（切尔克斯）马穆鲁克苏丹国以开罗为都，统辖埃及、叙利亚、黎凡特与伊斯兰两圣地麦加、麦地那，牢牢扼守经红海与亚历山大港流向欧洲的东方香料命脉。\n\n尽管开罗宫廷艺术与宗教建筑依旧冠绝伊斯兰世界，但葡萄牙绕道好望角切断红海香料税源，加之北方奥斯曼火器大军的崛起，正将百年骑兵帝国推向存亡关头。"
 oe_lde_ctry_OMA_1648: "1650年雅鲁比王朝将葡萄牙人逐出马斯喀特后，阿曼迅速蜕变为横跨阿拉伯海与东非斯瓦希里海岸的海洋商业帝国。阿曼单桅帆船舰队夺取蒙巴萨、奔巴与桑给巴尔，在印度洋西岸建立起繁荣的香料、象牙与乳香网络。\n\n19世纪初赛义德·本·苏丹统治下的阿曼—桑给巴尔苏丹国更在东非大力广植丁香，令马斯喀特与桑给巴尔石头城跻身印度洋最富庶的海上双核。"
 oe_lde_ctry_SKO_1821: "1804年富拉尼学者奥斯曼·丹·福迪奥在豪萨诸城邦掀起伊斯兰改革与圣战运动，其子穆罕默德·贝洛继而以索科托与瓜多为双都，将三十余座埃米尔国统合为西非腹地最强大的索科托哈里发国。\n\n凭借繁荣的卡诺棉纺染织手工业、跨撒哈拉皮革商路与兴盛的阿拉伯文学术传统，索科托在19世纪屹立为撒哈拉以南非洲人口最稠密的本土大国。"
 oe_lde_ctry_ZAN_1444: "基卢瓦苏丹国坐落于东非斯瓦希里海岸，掌控索法拉黄金出口与季风印度洋航道，精美的珊瑚石清真寺、胡苏尼·库布瓦宫殿与自铸铜银钱币见证着阿拉伯、波斯与非洲内陆文明的璀璨交融。\n\n15世纪末葡萄牙舰队绕过好望角闯入印度洋后，基卢瓦与蒙巴萨等斯瓦希里城邦陷入与欧洲炮舰争夺东非海上商路控制权的漫长拉锯。"
 oe_lde_ctry_KON_1444: "扎根刚果河下游南岸的刚果王国以姆班扎刚果为都，统辖富庶的拉菲亚布匹、铜矿与贝币贸易网络。1491年国王恩津加·恩库武及其子阿方索一世接受天主教洗礼，使刚果成为早期近代同里斯本与罗马教廷直接互派使节的中非王国。\n\n17至18世纪虽饱受大西洋贸易冲击与王位内争之苦，刚果王室依然在中非大西洋沿岸维系着深厚的礼制与文化凝聚力。"
 oe_lde_ctry_TUN_1648: "16世纪并入奥斯曼海疆之后，阿尔及尔与突尼斯相继在帕夏、迪伊与贝伊治下演化为高度自治的马格里布海权摄政区。凭借精良桨帆舰队与设防良港，它们既在地中海西岸充当伊斯兰海防前哨，又同欧亚各国缔结商约与外交条约。\n\n步入18至19世纪，在维系对伊斯坦布尔名义宗藩的同时，突尼斯侯赛因王朝与阿尔及尔迪伊正面临欧洲近代海军列强日益严厉的海上施压。"
 oe_lde_ctry_ENG_1204: "1204年是金雀花安茹帝国的生死转折点。英格兰国王约翰一面统领英伦与爱尔兰领地，一面正与法兰西国王腓力二世围绕诺曼底、安茹与阿基坦爆发激战，大陆领地岌岌可危。\n\n诺曼底失守与沉重军费不仅迫使英格兰王室重心彻底回归不列颠岛，更直接催生了1215年《大宪章》与英格兰议会宪政传统的源头。"
 oe_lde_ctry_ENG_1444: "1444年百年战争步入尾声，亨利六世治下的英格兰虽仍紧握诺曼底、加来与加斯科涅，却已因朝廷党争与法军炮兵反攻而难以为继。战事落幕后，兰开斯特与约克两大家族掀起的玫瑰战争重塑了英伦贵族格局。\n\n1485年都铎王朝定鼎后，英格兰推行宗教改革、整顿海军并向大西洋远航，在伊丽莎白一世击退西班牙无敌舰队后正式迈向海洋大国之路。"
 oe_lde_ctry_FRA_1204: "1204年卡佩王朝在“尊贵者”腓力二世引领下迎来历史性飞跃：法军一举攻克诺曼底与卢瓦尔河谷，将原属英王的大片封地收入王室直辖，令巴黎从偏安法兰西岛的弱小王庭跃升为西欧头等强国。\n\n哥特式大教堂与巴黎大学群贤毕至，随后路易九世更以崇高圣王威望与司法改革将中世纪法兰西推向黄金时代。"
 oe_lde_ctry_FRA_1444: "经圣女贞德力挽狂澜与查理七世整编近代常备军（敕令骑兵与精锐火炮队），1444年的瓦卢瓦法兰西正蓄势收复诺曼底与阿基坦、终结百年战争。\n\n此后路易十一削平勃艮第与大封建领主实现全国整合，弗朗索瓦一世引进意大利文艺复兴，使法兰西成为西欧人口最众的王权强国——尽管16世纪后期的宗教战争仍将严峻考验王国的统一。"
 oe_lde_ctry_CAS_1444: "15世纪中叶的伊比利亚半岛正处于大一统的前夜：卡斯蒂利亚坐拥广袤梅塞塔牧羊高地与收复失地运动的兵源底蕴，阿拉贡则握有加泰罗尼亚、巴伦西亚、西西里与那不勒斯构成的西地中海商业冠冕。\n\n1469年伊莎贝拉与斐迪南联姻之后，双王并力于1492年收复格拉纳达并资助哥伦布西航，一举开启西班牙横跨新旧大陆的黄金世纪。"
 oe_lde_ctry_POR_1444: "阿维什王朝治下的葡萄牙虽偏居伊比利亚大西洋一隅，却在航海家恩里克亲王与若昂二世推动下率先开启地理大发现时代。凭借轻快卡拉维尔帆船、星盘航海术与西非金矿据点，里斯本步步探明好望角航道。\n\n1498年达·伽马抵达印度卡利卡特、1500年卡布拉尔发现巴西之后，葡萄牙依托果阿、霍尔木兹、马六甲与澳门连成首个贯通全球的海洋香料帝国。"
 oe_lde_ctry_POR_1648: "1640年布拉干萨王朝发动复国起义摆脱西班牙共主统治后，葡萄牙凭借巴西蔗糖与18世纪米纳斯吉拉斯黄金重振国库，并在1755年里斯本大地震后由蓬巴尔侯爵大刀阔斧重建首都与近代官僚体制。\n\n经历拿破仑入侵与王室迁驻里约热内卢的动荡，1821年重返里斯本的立宪议会与王室正面对巴西独立浪潮与旧帝国转型的严峻挑战。"
 oe_lde_ctry_NED_1648: "历经八十年独立战争洗礼，七省联合共和国在1648年《威斯特伐利亚和约》获西班牙正式承认，步入举世瞩目的“荷兰黄金时代”。阿姆斯特丹证券交易所、东印度公司（VOC）与庞大的弗莱特商船队执掌全球金融、香料与波罗的海谷物命脉。\n\n伦勃朗画作、斯宾诺莎哲学与自由出版业令低地国家耀眼夺目；在英法两大强权夹击下，共和国凭借精妙外交与水网防线顽强守护海上霸权。"
 oe_lde_ctry_NED_1821: "1815年维也纳会议将荷兰与原奥属南尼德兰合并为尼德兰联合王国，由奥兰治—拿骚家族威廉一世统治，既充当遏制法兰西东北扩张的坚强屏障，又从英国手中收回富庶的荷属东印度爪哇香料群岛。\n\n北方阿姆斯特丹、鹿特丹的海运金融与南方布鲁塞尔、安特卫普蓬勃兴起的煤铁纺织工业相得益彰，但南北在宗教、语言与议会代表权上的分歧亦悄然积聚。"
 oe_lde_ctry_SWE_1648: "经古斯塔夫二世·阿道夫军事革命与三十年战争血战，1648年的瑞典王国坐拥波美拉尼亚、利沃尼亚与芬兰，将波罗的海几乎化为内湖，傲然步入“大国时代”（Stormaktstiden）。\n\n凭借法伦铜矿、高质铁矿与严密兵役征召制，斯德哥尔摩在卡尔十世至卡尔十二世治下频频震动欧陆，却也因领土分散与俄、丹、波反瑞同盟的合围而背负沉重国力消耗。"
 oe_lde_ctry_SWE_1776: "大北方战争落幕之后，瑞典在“自由时代”经历议会党争与启蒙科学勃兴（林奈、摄尔修斯等巨擘辈出），1772年古斯塔夫三世重振王权并大力扶持文学艺术。\n\n1809年失芬兰予俄国后，前法军元帅贝尔纳多特入继大统并在1814年促成瑞典—挪威共主邦联，以审慎和平外交开启北欧半岛的新纪元。"
 oe_lde_ctry_DAN_1444: "自1397年卡尔马联盟起，坐镇哥本哈根与厄勒海峡咽喉的丹麦王室长期凭海峡通行税执掌波罗的海门户，并在瑞典独立后与挪威、冰岛及荷尔斯泰因维系长达三百年的丹麦—挪威联合王国。\n\n尽管1814年基尔条约割让挪威并痛失舰队，丹麦凭借富庶农业改革、航运商船与北海—波罗的海枢纽地位，依然在北欧维系着稳健的王国秩序。"
 oe_lde_ctry_POL_1444: "1386年克雷沃联合开启了波兰王国与立陶宛大公国共戴雅盖隆王冠的黄金时代。1410年格伦瓦德大捷重创条顿骑士团后，这一东欧巨邦版图横贯波罗的海与黑海之间，克拉科夫大学与维斯瓦河谷物出口欣欣向荣。\n\n1444年瓦尔纳十字军东征与十三年战争接踵而至，波立两邦正借贵族民主与宗教宽容传统，酝酿迈向更为紧密的卢布林联邦。"
 oe_lde_ctry_PLC_1648: "1569年《卢布林联合》缔造的波兰—立陶宛联邦曾是欧洲疆域最广的国家之一，以翼骑兵铁骑、选举君主制与罕见的宗教宽容法典闻名欧陆。1683年索别斯基驰援维也纳更留下拯救基督教中欧的传奇。\n\n然而自1648年哥萨克大起义与瑞典“大洪水”劫难以来，贵族“自由否决权”令中央财政与常备军陷入瘫痪；面对俄、普、奥三国步步瓜分，1791年《五三宪法》成了联邦力挽狂澜的最后绝唱。"
 oe_lde_ctry_POL_1821: "历经三次瓜分与拿破仑华沙公国悲壮征战后，1815年维也纳会议在华沙设立由俄国沙皇兼任国王的“波兰会议王国”，保留独立宪法、议会、波兰语行政与本国陆军。\n\n维斯瓦河畔的工业与文化迅速复苏，但沙皇日益收紧的审查与驻军专断，正令华沙青年军官与爱国志士心中积蓄着席卷东欧的民族复兴火种。"
 oe_lde_ctry_MOS_1444: "15世纪中叶的莫斯科大公国正从瓦西里二世内战中浴火重生。伊凡三世登基后兼并诺夫哥罗德与特维尔，于1472年迎娶拜占庭公主索菲亚·巴列奥略并采用双头鹰纹章，1480年乌格拉河对峙更彻底终结金帐汗国两百余年的贡赋羁绊。\n\n在瓦西里三世与幼年伊凡四世的承接下，莫斯科已基本完成东北罗斯一统，蓄势向伏尔加河全线与沙皇帝国迈进。"
 oe_lde_ctry_LAT_1204: "1204年第四次十字军攻陷并瓜分君士坦丁堡后，佛兰德伯爵鲍德温在圣索菲亚大教堂加冕为首位拉丁皇帝，在博斯普鲁斯海峡与色雷斯建立起封建拉丁帝国。\n\n然而帝国兵微粮寡、与威尼斯商业特权深度捆绑，北遭保加利亚沙皇卡洛扬铁骑痛击，东、西两翼更面临尼西亚与伊庇鲁斯希腊流亡政权的夹攻，这座建立在千年皇都废墟上的拉丁王座自诞生之初便危机四伏。"
 oe_lde_ctry_SCO_1444: "斯图亚特王朝统治的苏格兰王国以爱丁堡为都，依托高地氏族与低地市镇的顽强意志，并借与法兰西延续数百年的“老同盟”，屡屡在英格兰北疆守住王国独立。\n\n历经16世纪宗教改革与玛丽女王风波后，詹姆斯六世于1603年入继英格兰王位实现不列颠共主，并在1707年与英格兰合并为大不列颠王国前夕经历了激烈的政教与殖民探索。"
 oe_lde_ctry_BUR_1444: "15世纪中叶“好人腓力”治下的勃艮第公国虽名义上分属法王与德皇封臣，实则凭佛兰德斯、布拉班特与荷兰的繁华纺织海港成为西欧最富奢华的“大公国”。\n\n金羊毛骑士团、凡·艾克油画与华丽宫廷礼仪倾倒全欧；大胆查理更野心勃勃企图重塑中法兰克王国，却在瑞士长矛与法兰西的夹击下令这座黄金公国的命运悬于一线。"
 oe_lde_ctry_TEU_1444: "1410年格伦瓦德惨败重创条顿骑士团国威望，却未能摧毁马尔堡红砖要塞与普鲁士波罗的海良港的组织底蕴。1444年骑士团一边应对但泽等普鲁士联邦城市的自治抗争，一边抵御波兰国王的北进压力。\n\n十三年的血战最终迫使骑士团退居柯尼斯堡并向波兰称臣，直到1525年大团长阿尔布雷希特改宗新教，将其世俗化为霍亨索伦家族的普鲁士公国。"
 oe_lde_ctry_AFG_1776: "1747年波斯纳迪尔沙阿遇刺身亡后，普什图雄主艾哈迈德沙·杜兰尼在坎大哈获推为王，创立杜兰尼帝国，将疆域从呼罗珊与喀布尔一路推进至旁遮普、克什米尔与印度河流域，被尊为近代阿富汗国父。\n\n1761年帕尼帕特大战重创马拉塔联军后，迁都喀布尔的杜兰尼王朝虽于19世纪初因宗室内争和锡克帝国崛起而收缩版图，依然扼守着兴都库什山脉与南亚西北的咽喉通道。"
 oe_lde_ctry_FB_LATE_ANTIQUITY: "这一政权屹立于古典晚期至中世纪初的欧亚大迁徙与帝国重组浪潮之中。旧日的罗马行省边界、丝路绿洲城邦与新兴部族联盟正剧烈交错，城垣防务、宗教教会与行军税赋决定着每一方领土的兴衰。\n\n在旧帝国秩序余晖与新纪元曙光之间，本国正依托本土贵族、边防军团与商路枢纽，力图在风云变幻的中古黎明中奠定长久基业。"
 oe_lde_ctry_FB_NEW_WORLD_EXILE_SETTLER: "这座扎根大西洋彼岸新大陆的海外拓荒邦国、殖民领地或旧世界流亡政权，将跨洋带去的法典制度、航海商港、冶金工艺与礼仪文明移植于美洲广袤山河之间，正孕育出独具气象的新世界秩序。\n\n面对未知荒野拓垦、海上商路竞逐以及新旧两大陆之间的政治张力，本地议事会、贵族军政阶层与拓荒市民正协力在新天地铸就绵延百年的崭新文明。"
 oe_lde_ctry_FB_COLONIAL_NEW_WORLD: "这座扎根远洋边疆的殖民领与海外邦国，由跨洋航路、港市商行、种植园或矿山经济维系运转，在母国法典传统与当地风土的交融中孕育出鲜明的海外身份认同。\n\n面对母国关税政策、海路竞争与边疆拓殖的双重机遇与张力，本地议事会、总督府与自由民社群正不断探索自治与富强之路。"
 oe_lde_ctry_FB_STEPPE_KHANATE: "这一草原汗国或中亚游牧部族联盟驰骋于辽阔的欧亚草原与丝路绿洲边缘，以机动矫健的弓骑兵、世袭那颜与异密贵族议事制维系部众团结，兼营畜牧迁徙与商队护卫。\n\n在周边定居帝国与邻近汗廷的合纵连横中，本国既以疾风般的草原战力威慑四方，又借绿洲市镇与边疆马市汲取铁器、丝茶与财赋。"
 oe_lde_ctry_FB_THEOCRACY: "这座政教合一的教会领国、主教领或骑士修会，将神圣信仰典章与世俗行政疆土紧密结合。大教堂、修院田庄与严明戒律构成了国家财政与社会秩序的核心支柱。\n\n在列强世俗霸权与教派纷争激荡的时代，本国凭借崇高宗教威望、严整教团纪律与外交斡旋，守护着圣座辖地与信众福祉。"
 oe_lde_ctry_FB_REPUBLIC_FREE_CITY: "这座共和国、商业城邦或帝国自由城市以市民议会、行会契约与成文宪章取代世袭王权，依托繁忙商港、钱庄信用与手工业工坊在周边君主大国之间赢得丰裕财力与政治自主。\n\n凭借灵巧外交、雇佣劲旅或市民民兵，本国既致力于捍卫宝贵的共和自由与商路特权，亦在金融、印刷与工艺文化领域引领风气之先。"
 oe_lde_ctry_FB_EAST_ASIA: "这一东亚邦国、藩镇或边疆政权扎根于农耕水利、儒佛礼乐与深厚宗族传统之中，凭城下町、州县官僚或世袭武家与土司体制维系地方秩序与商旅往来。\n\n在东亚朝贡圈、幕藩格局与周边强邻的兴衰更替中，本国审时度势、深耕农桑手工业，寻求乱世安邦乃至问鼎四方之机。"
 oe_lde_ctry_FB_SE_ASIA: "这一东南亚王国或海岛苏丹国坐落于季风航道与肥沃河谷的交汇地带，以“曼陀罗”向心王权格局凝聚周边城邦与港口，依托稻米丰收、热带香料、象兵与敏捷战舟纵横陆海。\n\n在区域强邦竞逐与远洋列强商船相继驶入南海与印度洋的浪潮中，本国凭借敏锐的港口贸易与灵活外交守护着独特的热带文明风采。"
 oe_lde_ctry_FB_INDIA: "这座印度次大陆王公邦国、苏丹国或土邦坐拥季风沃土、棉丝手工业与巍峨岩堡，在印度教、伊斯兰教或锡克教等多元礼俗与精细税赋体系交织中展现勃勃生机。\n\n面对次大陆诸强合纵连横与沿海商站势力的渗透，本国宫廷以精锐战象骑兵、繁盛市集与灵活结盟守护着一方富庶疆土。"
 oe_lde_ctry_FB_ISLAMIC_SULTANATE: "这一伊斯兰苏丹国、埃米尔国或贝伊领立足于商队驿道、绿洲沃土或地中海与印度洋良港，以沙里亚法统、经学院学术与骑兵武勋维系国本。\n\n在奥斯曼、波斯、马格里布与远洋海权交锋的宏大格局中，本国宫廷既致力发展巴扎商贸与城防修筑，又凭灵活盟约维系边疆安稳与独立尊严。"
 oe_lde_ctry_FB_EUROPE_MONARCHY: "这一欧洲君主国、公国或诸侯领承袭封建法理与王室联姻网络，以领地庄园、筑垒城镇与等级议会维系地方治理，在宗教变革、均势外交与近代陆军演进中不断重塑国力。\n\n置身群雄并立的欧洲舞台，本国宫廷凭精明联姻、财税整顿与审慎同盟，在列强博弈的缝隙间守护祖传领土并谋求更高尊位。"
 oe_lde_ctry_FB_AMERICAS_INDIGENOUS: "这一美洲本土邦国或部族联盟世代生息于山谷、平原或雨林沃野之中，拥有绵延千年的农耕智慧、祭祀礼仪、长途物产交换网络与熟稔地利的勇士传统。\n\n面对邻近部族竞争以及大洋彼岸殖民浪潮带来的剧烈冲击，本国首领与长老议会正以坚韧意志与灵活结盟守护着祖先传承的土地与自由。"
 oe_lde_ctry_FB_AFRICA: "这一非洲王国、酋邦或商贸邦国依托肥沃河谷、高原牧场或跨撒哈拉与印度洋黄金象牙商路兴起，以悠久王权仪典、精湛锻铁工艺与口传史诗凝聚万千子民。\n\n在邻邦竞逐与跨洋贸易浪潮不断重塑沿海与内陆秩序的时代，本国凭借对关键商道与资源产地的掌控，稳步维系着自主尊严与地方繁荣。"
 oe_lde_ctry_FB_OCEANIA_SIBERIA: "这一活跃于北亚林海冻原或太平洋群岛间的边疆政权与航海社群，凭卓越的狩猎渔牧技艺、独木远航能力与紧密氏族纽带适应着广袤而严酷的自然天地。\n\n随着外部商船、毛皮贸易与远洋探险队逐渐抵达海疆与林原边缘，本国正以顽强韧性应对前所未有的时代变局。"
 oe_lde_ctry_FB_TRIBAL: "这一部族联盟以血缘氏族、长老议事会与勇敢无畏的战士传统维系自由秩序，不拘泥于繁复官僚枷锁，依托险峻山地、荒漠或林原地形令外来强敌难以轻易征服。\n\n在周遭定居王国与大帝国的扩张浪潮面前，本国既可凭游击袭扰与商道护卫谋生，亦可在英明首领统领下凝聚诸部、迈向集权建国之路。"
 oe_lde_ctry_FB_UNIVERSAL: "这一独立政权或自治实体在所处的历史纪元中凭借独特的政治制度、地方精英网络与经济命脉立足于世。无论规模大小，其统治者皆须在财政整顿、军备革新与纵横外交之间审慎权衡。\n\n随着时代潮水滚滚向前，本国正站在守护传统根基与把握变革良机的十字路口，书写属于自己的历史篇章。"
