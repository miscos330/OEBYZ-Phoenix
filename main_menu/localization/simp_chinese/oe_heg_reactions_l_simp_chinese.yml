l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_hcr_genoese_privileges: "热那亚人的特权"
 STATIC_MODIFIER_NAME_oe_hcr_venetian_privileges: "威尼斯人的特权"
 STATIC_MODIFIER_NAME_oe_hcr_garrison: "新土驻军"
 STATIC_MODIFIER_NAME_oe_hcr_amnesty: "新土大赦"
 STATIC_MODIFIER_NAME_oe_hcr_amnesty_local: "大赦免税"
 oe_hcr.1.t: "叙利亚援军"
 oe_hcr.1.d: "1365年，塞浦路斯国王彼得一世攻破亚历山大，三天后就撤走了：随军的贵族只想带着战利品离开，不愿留下来面对马穆鲁克的援军。如今帝国的旗帜插上了尼罗河畔的城头，大马士革的总督已经点起叙利亚军团，正经加沙南下。"
 oe_hcr.1.a: "守住亚历山大"
 oe_hcr.1.a.tt: "敌方在加沙出现援军（#Y 5#!个步兵团、#Y 3#!个骑兵团）\n埃及征伐压力#R +10#!"
 oe_hcr.1.b: "抢先截击加沙"
 oe_hcr.1.b.tt: "#R −200#!金币，人力#R −3#!\n#Y 60%#!：埃及征伐进度#G +10#!，援军只剩一半\n#Y 40%#!：埃及征伐压力#R +15#!，援军全数到达"
 oe_hcr.1.c: "学彼得一世，劫掠后撤"
 oe_hcr.1.c.tt: "#G +500#!金币\n埃及征伐进度#R −15#!，压力#G −20#!\n复兴希望#R −5#!"
 oe_hcr.2.t: "部族倒戈"
 oe_hcr.2.d: "1347年，马林王朝的苏丹阿布·哈桑几乎没打仗就进了突尼斯；第二年他想收紧对阿拉伯部族的控制，部族倒戈，4月在凯鲁万城下把他打垮。如今部族的长老又来到帝国营中，要的是同一样东西：照旧发给他们的年金。"
 oe_hcr.2.a: "照旧发给年金"
 oe_hcr.2.a.tt: "#R −400#!金币\n北非征伐压力#G −10#!"
 oe_hcr.2.b: "收紧控制"
 oe_hcr.2.b.tt: "北非征伐进度#G +5#!\n#R 50%#!：部族起兵——本次征伐新得的内陆地方出现民族叛军（叛乱进度#R 50%#!），压力#R +10#!"
 oe_hcr.2.c: "拉一派，打一派"
 oe_hcr.2.c.tt: "#R −200#!金币\n北非征伐进度#G +5#!，压力#R +5#!"
 oe_hcr.3.t: "布林迪西的反击"
 oe_hcr.3.d: "1156年，曼努埃尔一世的远征军拿下巴里，围攻布林迪西。西西里国王威廉一世水陆并进反击，帝国的雇佣兵临阵要求加价，远征就此失败；三周后，教宗与威廉在贝内文托签了条约。如今南意的王国又在塔兰托集结军队，营中的雇佣兵队长们也开始提价钱了。"
 oe_hcr.3.a: "满足雇佣兵的要价"
 oe_hcr.3.a.tt: "敌方在塔兰托出现援军（#Y 5#!个步兵团、#Y 3#!个骑兵团）\n#R −500#!金币\n意大利征伐压力#G −10#!"
 oe_hcr.3.b: "收缩到巴里固守"
 oe_hcr.3.b.tt: "敌方在塔兰托出现援军（#Y 5#!个步兵团、#Y 3#!个骑兵团）\n意大利征伐进度#R −5#!，压力#G −10#!"
 oe_hcr.3.c: "抢在教宗变卦之前派人去罗马"
 oe_hcr.3.c.tt: "敌方在塔兰托出现援军（#Y 5#!个步兵团、#Y 3#!个骑兵团）\n#R −400#!金币\n教宗国对我们的好感#G +50#!（每年回落#Y 2#!）\n#Y 10#!年内教宗不会号召讨伐分裂派"
 oe_hcr.4.t: "王军召集令"
 oe_hcr.4.d: "1337年4月30日，腓力六世向全法国发出召集令；同年他宣布收回加斯科涅，爱德华三世则宣称自己才是法国国王。如今召集令又一次传遍法兰西各地，骑士和民兵正向奥尔良集中。"
 oe_hcr.4.a: "联络英格兰"
 oe_hcr.4.a.tt: "敌方在奥尔良出现援军（#Y 6#!个步兵团、#Y 4#!个骑兵团）\n#R −300#!金币\n英格兰若存在、未与我们交战，就以我们盟友的身份加入这场战争"
 oe_hcr.4.b: "正面迎击"
 oe_hcr.4.b.tt: "敌方在奥尔良出现援军（#Y 6#!个步兵团、#Y 4#!个骑兵团）\n法兰西征伐进度#G +5#!，压力#R +10#!"
 oe_hcr.4.c: "与部分诸侯单独议和"
 oe_hcr.4.c.tt: "敌方在奥尔良出现援军（#Y 6#!个步兵团、#Y 4#!个骑兵团）\n与最弱的一个敌国单独白和，它不再是这场征伐的对象\n法兰西征伐进度#R −5#!，压力#G −15#!"
 oe_hcr.5.t: "萨拉多河的联盟"
 oe_hcr.5.d: "1340年，教宗本笃十二世宣布十字军，平日互相争斗的卡斯蒂利亚与葡萄牙联手，在萨拉多河击败了马林王朝和格拉纳达。半岛上的王国一向如此：外敌一来，就放下彼此的恩怨。如今圣地亚哥和卡拉特拉瓦的骑士团都在召集人马。"
 oe_hcr.5.a: "分化他们"
 oe_hcr.5.a.tt: "与最弱的一个王国单独白和，它不再是这场征伐的对象\n其余敌国的首都各出现援军（#Y 2#!个步兵团、#Y 1#!个骑兵团）\n伊比利亚征伐进度#R −5#!，压力#G −15#!"
 oe_hcr.5.b: "收买骑士团"
 oe_hcr.5.b.tt: "#R −300#!金币\n每个敌国首都只出现#Y 1#!个步兵团"
 oe_hcr.5.c: "硬碰联军"
 oe_hcr.5.c.tt: "每个敌国首都出现援军（#Y 2#!个步兵团、#Y 1#!个骑兵团）\n伊比利亚征伐压力#R +5#!"
 oe_hcr.6.t: "海峡对岸的回击"
 oe_hcr.6.d: "百年战争最初几年，英法两国都派船去袭击对方的港口，1338年法国舰队就焚掠了南安普敦。海峡可以从两个方向渡过。如今五港的船只正在集结，要截断帝国的补给船队。"
 oe_hcr.6.a: "组织护航"
 oe_hcr.6.a.tt: "敌方在南安普敦出现援军（#Y 4#!个步兵团、#Y 2#!个骑兵团）\n#R −300#!金币"
 oe_hcr.6.b: "联络苏格兰"
 oe_hcr.6.b.tt: "敌方在南安普敦出现援军（#Y 4#!个步兵团、#Y 2#!个骑兵团）\n#R −200#!金币\n苏格兰若存在、未与我们交战，就以我们盟友的身份加入这场战争\n此后#Y 12#!个月补给船遭到袭扰：不列颠征伐压力每月额外#R +1#!"
 oe_hcr.6.c: "不必理会"
 oe_hcr.6.c.tt: "敌方在南安普敦出现援军（#Y 4#!个步兵团、#Y 2#!个骑兵团）\n此后#Y 12#!个月补给船遭到袭扰：不列颠征伐压力每月额外#R +1#!"
 oe_hcr.7.t: "两个哈桑"
 oe_hcr.7.d: "1335年，伊儿汗阿布·赛义德无嗣而死。札剌亦儿家的大哈桑和丘班家的小哈桑各立一个傀儡汗，1338到1340年连年交战，大哈桑最后退守巴格达自立。如今面对罗马人的军队，波斯的诸侯第一次坐到了一起。"
 oe_hcr.7.a: "扶持其中一方"
 oe_hcr.7.a.tt: "#R −400#!金币\n波斯征伐进度#G +10#!\n联军不会成形"
 oe_hcr.7.b: "等他们自己打起来"
 oe_hcr.7.b.tt: "敌方首都出现联军（#Y 5#!个步兵团、#Y 3#!个骑兵团）\n波斯征伐压力#R +5#!\n#Y 6#!个月后：#Y 60%#!联手破裂（进度#G +10#!），#Y 40%#!联手持续（压力#R +10#!）"
 oe_hcr.7.c: "正面迎战联军"
 oe_hcr.7.c.tt: "敌方首都出现联军（#Y 5#!个步兵团、#Y 3#!个骑兵团）\n波斯征伐进度#G +5#!"
 oe_hcr.8.t: "卡法之围"
 oe_hcr.8.d: "1343年起，金帐汗扎尼别多次围攻热那亚人的卡法。1346年围城的营中暴发瘟疫，据说他们把尸体抛进了城里。如今可汗的大军又出现在克里米亚的草原上。"
 oe_hcr.8.a: "死守卡法"
 oe_hcr.8.a.tt: "敌方在索尔哈特出现援军（#Y 6#!个步兵团、#Y 4#!个骑兵团）\n黑海征伐压力#R +10#!\n#Y 25%#!：营中暴发疫病，再压力#R +10#!、人力#R −5#!"
 oe_hcr.8.b: "从海上撤出卡法"
 oe_hcr.8.b.tt: "黑海征伐进度#R −10#!，压力#G −15#!"
 oe_hcr.8.c: "向可汗纳贡"
 oe_hcr.8.c.tt: "#R −500#!金币\n与可汗单独白和，其余敌国照打"
 oe_hcr.9.t: "开罗的驼轿"
 oe_hcr.9.d: "每年朝觐的季节，开罗的苏丹都会随商队送出一顶空驼轿，宣示自己是两座圣地的保护者；1350年以后，汉志事实上已是马穆鲁克的行省。圣城易手，开罗不能坐视不理。"
 oe_hcr.9.a: "准许朝觐照常，派兵护送商队"
 oe_hcr.9.a.tt: "#R −300#!金币\n阿拉伯征伐压力#G −10#!\n马穆鲁克不参战，只是对我们的好感#R −20#!（每年回落#Y 2#!）"
 oe_hcr.9.b: "关闭圣城"
 oe_hcr.9.b.tt: "阿拉伯征伐进度#G +10#!\n所有穆斯林国家对我们的好感#R −30#!（每年回落#Y 1#!）\n马穆鲁克若未与我们交战，就加入这场战争，并出现援军（#Y 4#!个步兵团、#Y 2#!个骑兵团）"
 oe_hcr.9.c: "承认谢里夫自治"
 oe_hcr.9.c.tt: "阿拉伯征伐进度#R −10#!，压力#G −15#!\n马穆鲁克不参战"
 oe_hcr.10.t: "讨伐分裂派"
 oe_hcr.10.d: "1281年，教宗马丁四世绝罚了米海尔八世，为安茹的查理进攻君士坦丁堡祝福。米海尔先是靠1274年里昂大公会议上的教会合一拖住了查理，最后靠资助西西里晚祷解了围。如今罗马的教廷又在为对“希腊分裂派”的战争募捐了。"
 oe_hcr.10.a: "遣使谈教会合一"
 oe_hcr.10.a.tt: "教宗撤回号召\n[oe_tu_authority|e]#R −5#!，稳定度下降"
 oe_hcr.10.b: "资助他们的后院起火"
 oe_hcr.10.b.tt: "#R −500#!金币\n#Y 60%#!：号召无人响应，当前征伐进度#G +5#!\n#Y 40%#!：事情败露，号召照发，天主教国家对我们的好感再#R −15#!"
 oe_hcr.10.c: "不予理会"
 oe_hcr.10.c.tt: "号召发出：不与我们交战的最强天主教国家加入这场战争\n所有天主教国家对我们的好感#R −25#!（每年回落#Y 1#!）"
 oe_hcr.11.t: "圣战号召"
 oe_hcr.11.d: "开罗的苏丹以伊斯兰的保护者自居。1365年亚历山大遭劫之后，开罗立刻下令造船报复。如今各地的清真寺里都在念诵号召，要信徒起来对抗罗马人。"
 oe_hcr.11.a: "颁布宽容令，保护清真寺与朝觐"
 oe_hcr.11.a.tt: "[oe_tu_authority|e]#R −5#!\n号召声势大减：只有最强的一个穆斯林国家加入这场战争"
 oe_hcr.11.b: "遣使分化各国"
 oe_hcr.11.b.tt: "#R −400#!金币\n#Y 60%#!：号召无人响应\n#Y 40%#!：号召照发"
 oe_hcr.11.c: "不予理会"
 oe_hcr.11.c.tt: "号召发出：圣城在我们手里时，马穆鲁克（或最强的穆斯林国家）发起对帝国的圣战；否则最强的一个穆斯林国家加入这场战争"
 oe_hcr.12.t: "海上共和国的站队"
 oe_hcr.12.d: "1261年，米海尔八世与热那亚订立宁菲昂条约，用关税特权换来热那亚的舰队；热那亚人1263年海战失利后，他又在1268年与威尼斯议和。如今两家共和国的使节同时来到宫中，都要求独享帝国港口的特权。"
 oe_hcr.12.a: "与热那亚结盟"
 oe_hcr.12.a.tt: "获得“热那亚人的特权”（关税收入#R −10%#!，#Y 20#!年）\n沿海征伐压力每月#G −1#!，“热那亚商站”事件不再出现（#Y 20#!年）\n威尼斯对我们的好感#R −40#!（每年回落#Y 2#!），此后每场沿海征伐开始时有#Y 30%#!加入敌方"
 oe_hcr.12.b: "与威尼斯结盟"
 oe_hcr.12.b.tt: "获得“威尼斯人的特权”（关税收入#R −10%#!，#Y 20#!年）\n沿海征伐压力每月#G −1#!，“威尼斯舰队”事件不再出现（#Y 20#!年）\n热那亚对我们的好感#R −40#!（每年回落#Y 2#!），此后每场沿海征伐开始时有#Y 30%#!加入敌方"
 oe_hcr.12.c: "两边都不给"
 oe_hcr.12.c.tt: "维持现状，两家照旧各自开价"
 oe_hcr.13.t: "决战之日"
 oe_hcr.13.d: "敌军主力出营列阵，要求决一胜负。552年，纳尔塞斯在塔吉内把弓手布在两翼，托提拉的骑兵冲进中央，被两边的箭雨击溃，一战定下了意大利；而1071年的曼齐刻尔特，是另一种结局。"
 oe_hcr.13.a: "列阵决战"
 oe_hcr.13.a.tt: "胜率基础#Y 50%#!；复兴狂热“高涨”以上#Y +15%#!，有边疆军区#Y +10%#!，压力#Y 60#!以上#Y −15%#!\n胜：当前征伐进度#G +15#!、压力#G −10#!，复兴希望#G +5#!\n败：当前征伐压力#R +20#!，人力#R −5#!，复兴希望#R −5#!"
 oe_hcr.13.b: "学纳尔塞斯，坚阵待敌"
 oe_hcr.13.b.tt: "当前征伐进度#G +5#!，压力#R +5#!"
 oe_hcr.13.c: "避战"
 oe_hcr.13.c.tt: "当前征伐进度#R −5#!，压力#G −5#!"
 oe_hcr.14.t: "敌营内讧"
 oe_hcr.14.d.egypt: "1341年纳西尔·穆罕默德死后，他的子孙在埃米尔们手里被一个个拥立又废黜。开罗的宫廷又一次分成了几派。"
 oe_hcr.14.d.arabia: "1341年纳西尔·穆罕默德死后，开罗的苏丹在埃米尔们手里频繁更替；麦加的谢里夫家族也为继承人争吵不休。"
 oe_hcr.14.d.africa: "1346年哈夫斯王朝的苏丹阿布·伯克尔死后，他的儿子们为继承权打了起来，马林王朝才得以乘虚而入。敌营里又出现了同样的裂痕。"
 oe_hcr.14.d.persia: "伊儿汗国瓦解之后，札剌亦儿、丘班、穆札法尔诸家互相攻伐，没有一家能号令全境。"
 oe_hcr.14.d.blacksea: "1359年以后，金帐汗国陷入“大动乱”，二十年里换了二十多位可汗。草原上的贵族又在为汗位争吵。"
 oe_hcr.14.d: "前线密探传回喜讯：敌军联营内部正因军权归属与军费摊派吵得不可开交，各路贵族与诸侯互相指责推诿、离心离德。更有数名心怀鬼胎的地方领主暗中遣心腹潜来我军大营外，悄悄打听帝国愿意开出何等封赏条件以换取他们倒戈。"
 oe_hcr.14.a: "收买其中一方"
 oe_hcr.14.a.tt: "#R −300#!金币\n当前征伐进度#G +10#!"
 oe_hcr.14.b: "坐观其变"
 oe_hcr.14.b.tt: "当前征伐压力#G −10#!"
 oe_hcr.15.t: "新土起事"
 oe_hcr.15.d: "查士丁尼收复北非之后，536年斯托察斯带着欠饷的士兵哗变，544年摩尔人安塔拉斯又举兵反抗，帝国又打了十来年，才在约翰·特罗格利塔手里平定。如今新得的土地上，当地人也拿起了武器。"
 oe_hcr.15.a: "增派驻军"
 oe_hcr.15.a.tt: "#R −300#!金币\n叛乱进度#R −20%#!\n新得土地获得“新土驻军”（控制力上限#G +10%#!，每月控制力#G +1%#!，#Y 5#!年）"
 oe_hcr.15.b: "大赦并减税五年"
 oe_hcr.15.b.tt: "叛军解散\n获得“新土大赦”（税收效率#R −5%#!，#Y 5#!年）\n新得土地获得“大赦免税”（动荡#G −0.2#!，#Y 5#!年）"
 oe_hcr.15.c: "不予理会"
 oe_hcr.15.c.tt: "叛乱进度#G +20%#!"
 oe_hcr.16.t: "联手破裂"
 oe_hcr.16.d: "果然不出朝中谋士所料，波斯与两河流域的权贵联盟本就貌合神离。两位哈桑再度因巴格达与大不里士的赋税和霸权归属反目成仇，双方在军议上拍案而起，随即各自拔营撤回本家领地，原本声势浩大的敌方联军不战自溃。"
 oe_hcr.16.a: "正如所料"
 oe_hcr.16.a.tt: "波斯征伐进度#G +10#!"
 oe_hcr.17.t: "联手未破"
 oe_hcr.17.d: "这一次，波斯高原与两河流域的诸侯们比帝国预想的更加克制隐忍。面对罗马大军压境的共同威胁，他们竟然压下了积年的领地嫌隙与教派争执；敌方联军不仅稳如磐石，还在连番交锋中愈发熟稔彼此的协同战法，令我军推进倍感吃力。"
 oe_hcr.17.a: "失算了"
 oe_hcr.17.a.tt: "波斯征伐压力#R +10#!"
