 oe_v250_wce_dec_hab_vienna_university.title:0 "敕建维也纳鲁道夫大学"
 oe_v250_wce_dec_hab_vienna_university.desc:0 "仿效巴黎与布拉格在维也纳敕建鲁道夫大学，为哈布斯堡宫廷培养精通律法与帝国事务的外交官与学者。耗费110金币，持续25年提升科研、外交声誉与教士识字率，同时壮大教士权势并略微降低直征税效。"
 oe_v250_wce_dec_hab_vienna_university.a:0 "颁行维也纳鲁道夫大学创校宪章"
 oe_v250_wce_dec_hab_vienna_university_tt:0 "在维也纳正式设立鲁道夫大学，并将其载入奥地利大公国文教典册。"
 oe_v250_wce.10.t:0 "鲁道夫四世与《大特权》敕书"
 oe_v250_wce.10.d:0 "因遭查理四世《黄金诏书》排斥于七大选帝侯之外，雄心勃勃的年轻公爵鲁道夫四世密令维也纳文书馆拟就《大特权》敕书，宣称奥地利自古享有独一无二的「大公」尊号、领地不可分割与近乎独立的司法主权。高调宣示大公法统可令哈布斯堡声威大振，却会招致帝国诸侯与布拉格猜忌；若转而低调斡旋求和，则外交顺遂而威仪稍逊。"
 oe_v250_wce.10.a:0 "毅然宣示奥地利大公尊号并确立维也纳主权"
 oe_v250_wce.10.b:0 "与布拉格及帝国选侯低调斡旋以求体面妥协"
 oe_v250_wce.11.t:0 "阿尔卑斯山口、施蒂利亚铁矿与诺伊贝格分治"
 oe_v250_wce.11.d:0 "哈布斯堡领地已自维也纳多瑙河平原延伸至施蒂利亚铁山、克恩顿与阿尔卑斯诸山口。家族支系纷纷要求仿效《诺伊贝格条约》分治内奥地利：若将所有山隘税关与铁矿强行收归维也纳统一审计，虽可充实国库并提升掌控，却会激怒地方贵族与商团；若放权各邦支系共守山隘，则可凝聚强悍山地兵源，代价则是中央集权与税效双降。"
 oe_v250_wce.11.a:0 "将施蒂利亚铁矿与阿尔卑斯税关统归维也纳直辖"
 oe_v250_wce.11.b:0 "赋予内奥地利各邦自治以换取山地防御兵源"
 oe_v250_wce.12.t:0 "帝国联姻外交与多瑙河承继权"
 oe_v250_wce.12.d:0 "卢森堡王系日渐式微，罗马帝国皇冠乃至波希米亚与匈牙利王位皆已近在哈布斯堡咫尺之间——制胜之道不在连年苦战，而在联姻密约、继承协定与维也纳使节的纵横捭阖。倾力投入王朝外交可奠定中欧霸业基石，但务实将领却忧心巨额聘礼与使费会拖累多瑙河前线的重骑兵备。"
 oe_v250_wce.12.a:0 "广结帝国选侯与多瑙河诸邦联姻承继密约"
 oe_v250_wce.12.b:0 "转投多瑙河坚堡与奥地利重骑兵备"
 oe_v250_wce_ref_boh_golden_bull_crown:0 "圣瓦茨拉夫王冠与选侯枢密院"
 oe_v250_wce_ref_boh_golden_bull_crown_desc:0 "以布拉格王室枢密院统摄不可分割的圣瓦茨拉夫王冠领与帝国首席世俗选侯地位，全面提振学术科研、帝国声望与赋税效率，却令波希米亚大领主心生抵触并推高军费开支。"
 oe_v250_wce_priv_boh_kutna_miners:0 "库特纳霍拉皇家矿业法典"
 oe_v250_wce_priv_boh_kutna_miners_desc:0 "重申库特纳霍拉银矿与王室造币厂享有的皇家矿业法典特权，显著拔高铸币岁入与矿产原料产出，代价则是温和白银通胀、矿镇市民权势坐大与市民税限下调。"
 oe_v250_wce_cab_boh_kutna_assay:0 "库特纳霍拉皇家银矿勘验"
 oe_v250_wce_cab_boh_kutna_assay_desc:0 "自库特纳霍拉意大利宫造币署派遣王室勘验官巡查目标行省矿井、排水巷道与冶炉，提升当地矿产、工坊生产与发展度并增加全国铸币收益，但会带来轻微通胀并加重农夫劳役不满。"
 oe_v250_wce_cab_boh_kutna_assay_action:0 "库特纳霍拉皇家银矿勘验：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_wce_cab_boh_kutna_assay_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行库特纳霍拉皇家银矿勘验"
