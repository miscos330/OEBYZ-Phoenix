 oe_v250_wce_dec_boh_new_town_prague.title:0 "营建布拉格石桥与布拉格新城"
 oe_v250_wce_dec_boh_new_town_prague.desc:0 "遵循查理四世宏伟都城蓝图，于伏尔塔瓦河架起坚固石桥并兴筑宽阔的布拉格新城与大商市。耗费120金币，持续25年提升全国繁荣、发展度与陆路商贸，同时令税效与维稳成本承压。"
 oe_v250_wce_dec_boh_new_town_prague.a:0 "于伏尔塔瓦河畔奠基兴工"
 oe_v250_wce_dec_boh_new_town_prague_tt:0 "在布拉格正式奠基兴建伏尔塔瓦石桥与新城大商市，记入波希米亚王冠营建史册。"
 oe_v250_wce.13.t:0 "查理四世与布拉格查理大学"
 oe_v250_wce.13.d:0 "手握教宗敕书与王室金印，波希米亚国王查理四世力主在布拉格创办阿尔卑斯山以北、莱茵河以东的首座综合大学。慷慨资助神学、法学、医学与艺文四大学院，可令中欧英才荟萃波希米亚；但务实财政官却建言，宜先将王室银钱投于边防堡垒与王家税道。"
 oe_v250_wce.13.a:0 "敕建布拉格查理大学以兴中欧文教之盛"
 oe_v250_wce.13.b:0 "先修王室税道与边防堡垒以固国本"
 oe_v250_wce.14.t:0 "库特纳霍拉银格罗申与《黄金诏书》"
 oe_v250_wce.14.d:0 "正当《黄金诏书》确立波希米亚国王为帝国首席世俗选帝侯之际，库特纳霍拉深矿亦源源铸出闻名欧洲的布拉格银格罗申。严守银币成色可令布拉格信用卓著、帝国声望日隆；若下令竭力扩采矿脉，则虽可短期暴增白银岁入，却会引发通胀隐忧与矿工疲敝。"
 oe_v250_wce.14.a:0 "严守布拉格银格罗申成色并彰显首席选侯威望"
 oe_v250_wce.14.b:0 "竭力扩采库特纳霍拉深层银矿以充国库"
 oe_v250_wce.15.t:0 "波希米亚等级议会与车垒战阵"
 oe_v250_wce.15.d:0 "布拉格伯利恒礼拜堂的激昂布道与教会地产之争已令波希米亚等级议会剧烈震荡。扬·杰式卡等老练战将力证：以火门枪、连枷与铁链加固的战车堡垒（Wagenburg）足以粉碎帝国重骑冲锋；而温和圣杯派男爵则呼吁缔结《协定书》以弥合波希米亚与教廷及邻邦的教派裂痕。"
 oe_v250_wce.15.a:0 "推行铁甲车垒战阵与精锐议会民军体系"
 oe_v250_wce.15.b:0 "与温和圣杯派贵族缔结《协定书》以弥合教争"
 oe_v250_wce_ref_plc_statutes_union:0 "《维希利察法典》与大公枢密院"
 oe_v250_wce_ref_plc_statutes_union_desc:0 "将卡齐米日三世《维希利察法典》与维尔纽斯多语文书枢密院融为一体，显著提升内阁效能、兵源储备与跨教派宽容度，代价则是王室集权受掣且贵族税限下调。"
 oe_v250_wce_priv_plc_szlachta_bajorai:0 "科希策与霍罗德沃纹章采邑特许"
 oe_v250_wce_priv_plc_szlachta_bajorai_desc:0 "向波兰什拉赫塔与立陶宛博亚尔贵族颁授共享纹章特权与轻税采邑以换取重骑兵军役，大幅强化重骑战力与人力池，却令贵族权势显著扩张、王权受损且贵族税赋上限下调。"
 oe_v250_wce_cab_plc_frontier_starosts:0 "王室星使与东境边防督办"
 oe_v250_wce_cab_plc_frontier_starosts_desc:0 "委派王室星使与城堡守备督办巡戍维斯瓦、涅曼与第聂伯河边疆，提升轻骑战力、全国掌控与防御韧性，却增加军费维持开销并触怒地方大贵族。"
 oe_v250_wce_cab_plc_frontier_starosts_action:0 "王室星使与东境边防督办"
 oe_v250_wce_cab_plc_frontier_starosts_active:0 "正在执行：王室星使与东境边防督办"
 oe_v250_wce_cab_plc_frontier_starosts_action_progress:0 "执行中"
 oe_v250_wce_cab_plc_frontier_starosts_action_progress_wordier:0 "王室星使与东境边防督办（执行中）"
 oe_v250_wce_cab_plc_frontier_starosts_action_progress_tooltip:0 "委派王室星使与城堡守备督办巡戍维斯瓦、涅曼与第聂伯河边疆，提升轻骑战力、全国掌控与防御韧性，却增加军费维持开销并触怒地方大贵族。"
 oe_v250_wce_dec_plc_krakow_vilnius_charter.title:0 "兴建克拉科夫学院与维尔纽斯商市宪章"
 oe_v250_wce_dec_plc_krakow_vilnius_charter.desc:0 "以王室资财兴建克拉科夫综合学院教席并颁行维尔纽斯马格德堡商市宪章，将波罗的海至黑海的陆路商贸与文教法统牢牢锚定于本土。耗费100金币，持续25年提升科研、陆贸与全国繁荣，代价则是税效略降且市民权势上升。"
 oe_v250_wce_dec_plc_krakow_vilnius_charter.a:0 "钤印颁行学院与商市宪章"
 oe_v250_wce_dec_plc_krakow_vilnius_charter_tt:0 "正式资助克拉科夫学院与维尔纽斯商市特许，并载入王室与大公国典籍。"
 oe_v250_wce.16.t:0 "《维希利察法典》与克拉科夫学院"
 oe_v250_wce.16.d:0 "维斯瓦河与涅曼河两岸各地习惯法纷杂不一，地方督军独断司法令王室政令难以贯通。承继卡齐米日三世《维希利察法典》与创办克拉科夫学院之志，宫廷法学家提议编纂统一成文法并培育世俗王室文官；而手握重兵的大贵族却要求扩大世袭司法权，方肯足额征发骑兵军旗。"
 oe_v250_wce.16.a:0 "颁行统一成文法典并于学院培育王室法务文官"
 oe_v250_wce.16.b:0 "确认大贵族督军司法权以扩充重骑军旗"
 oe_v250_wce.17.t:0 "格迪米纳斯东拓与特拉凯卫城"
 oe_v250_wce.17.d:0 "自碧水环抱的特拉凯砖石城堡直至第聂伯河与加利西亚广袤的罗斯原野，东境边疆汇聚了天主教市镇、东正教波雅尔与草原边民。秉持格迪米纳斯王朝「不废旧俗、不立苛新」的治边遗训，可令多元教派臣民归心效命；若改由严明拉丁骑士团式边堡铁腕驻防，则虽可铸就高昂士气与坚固防线，却会推高要塞维护并引发乡民抵触。"
 oe_v250_wce.17.a:0 "尊奉罗斯旧宪并怀柔东境正教波雅尔"
 oe_v250_wce.17.b:0 "修筑湖河坚堡并派驻严明骑士戍军"
 oe_v250_wce.18.t:0 "克雷沃联盟与霍罗德沃盟约"
 oe_v250_wce.18.d:0 "面对条顿骑士团沿波罗的海与波美拉尼亚步步紧逼的铁壁要塞，波兰领主与立陶宛贵族借《克雷沃联盟》与《霍罗德沃盟约》缔结了跨越民族与疆域的历史性联合。让数十支立陶宛豪族共享波兰纹章特权，可锻造出令强敌胆寒的联军重骑劲旅；但集权派重臣却警示，大举让渡贵族特权必将长远侵蚀王室独断之权。"
 oe_v250_wce.18.a:0 "缔结克雷沃—霍罗德沃纹章同盟共抗波罗的海强敌"
 oe_v250_wce.18.b:0 "坚守独立王室枢密院与直征财政主权"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_cas_cortes:0 "布尔戈斯议会阿卡巴拉税约"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_cas_cortes:0 "制度化的阿卡巴拉税稳固了卡斯蒂利亚王室财政与行政权威，但持续征收的交易税令市镇商民与农户承压。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev1_alcala_supremacy:0 "阿尔卡拉王室司法至上"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev1_alcala_supremacy:0 "统一的王室成文法强化了卡斯蒂利亚王权、地方掌控与内阁效能，却触怒世袭大贵族并推高国内维稳成本。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev1_fueros_confirmed:0 "卡斯蒂利亚旧特许法确认"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev1_fueros_confirmed:0 "尊奉各地古老特许法换得大贵族合作与国内安宁，代价则是王室集权受限、赋税效率走低。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev1_salamanca_audiencia:0 "萨拉曼卡法学高等法院"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev1_salamanca_audiencia:0 "出身名校的法学文官提升了卡斯蒂利亚学术、法理威望与王朝正统，但教士势力随之膨胀并分流王室税款。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev2_mesta_exports:0 "美斯塔美利奴羊毛主导"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev2_mesta_exports:0 "受王室庇护的转场牧群为北部港市带来源源不断的优质原毛与关税白银，却挤压本土织布手工业并激怒农耕村社。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev2_castilian_looms:0 "卡斯蒂利亚城镇织造复兴"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev2_castilian_looms:0 "将上等羊毛留给本土工坊提振了手工业产出与城镇繁荣，却触怒美斯塔大牧主并放缓原毛陆运商贸。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev3_hermandad_march:0 "圣兄弟会边疆劲旅"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev3_hermandad_march:0 "市镇供养的圣兄弟会弩手与攻城工兵显著提升了卡斯蒂利亚士气、围城效率与兵源，但军费攀升且贵族阶层心生忌惮。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev3_parias_truce:0 "安达卢西亚岁贡与商贸缓和"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev3_parias_truce:0 "边疆休战与纳斯里德岁贡令塞维利亚商港与王室国库充盈，但圣战士气回落且教会阶层微词四起。"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_ara_drassanes:0 "巴塞罗那皇家造船厂"
