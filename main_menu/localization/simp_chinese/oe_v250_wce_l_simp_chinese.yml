# NEW 2026-11-24 v25.0 Batch 3 Pack A: 1337-1460 Western & Central European Majors (CAS/ARA/POR/HAB/BOH/POL/LIT) (oe_v250_wce_, 0 mainline slots, 0 rules, 0 vanilla overrides) — simp_chinese localization for Western & Central European Majors (255 keys). Edit gen_v250_1337_west_central_eu.py, not this file.
 oe_v250_wce_ref_cas_ordenamiento:0 "《阿尔卡拉敕令》王室法统"
 oe_v250_wce_ref_cas_ordenamiento_desc:0 "由阿方索十一世颁行的王室最高法统，令分散的市镇特许法与领主法庭统归王权与《七部法典》节制，显著强化王室权力、赋税效率与直辖掌控，却引发旧贵族强烈抵触并加重维稳成本。"
 oe_v250_wce_priv_cas_mesta_guild:0 "美斯塔皇家牧羊公会特许"
 oe_v250_wce_priv_cas_mesta_guild_desc:0 "敕许卡斯蒂利亚牧主贵族沿王室牧道南北转场放牧美利奴羊群，提振羊毛原料产出与陆路商运，代价则是农耕村社怨声载道、贵族权势攀升且贵族税赋上限下调。"
 oe_v250_wce_cab_cas_santa_hermandad:0 "圣兄弟会驿路巡检司"
 oe_v250_wce_cab_cas_santa_hermandad_desc:0 "调遣市镇圣兄弟会弩手巡护目标行省驿道、肃清盗匪并护卫羊毛商市，提升地方控制度、繁荣与陆贸，但会触怒地方骑士贵族并推高军政维持费。"
 oe_v250_wce_cab_cas_santa_hermandad_action:0 "圣兄弟会驿路巡检司：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_wce_cab_cas_santa_hermandad_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行圣兄弟会驿路巡检司"
 oe_v250_wce_cab_cas_santa_hermandad_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_cas_santa_hermandad_action_progress_wordier:0 "圣兄弟会驿路巡检司（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_cas_santa_hermandad_action_progress_tooltip:0 "调遣市镇圣兄弟会弩手巡护目标行省驿道、肃清盗匪并护卫羊毛商市，提升地方控制度、繁荣与陆贸，但会触怒地方骑士贵族并推高军政维持费。"
 oe_v250_wce_cab_cas_santa_hermandad_select_province:0 "选择派遣圣兄弟会巡护的行省"
 oe_v250_wce_cab_cas_santa_hermandad_no_provinces:0 "@trigger_no! 当前没有可部署圣兄弟会巡检的行省。"
 oe_v250_wce_dec_cas_cortes_burgos.title:0 "召开布尔戈斯议会并定税阿卡巴拉"
 oe_v250_wce_dec_cas_cortes_burgos.desc:0 "召集布尔戈斯、托莱多与巴利亚多利德等王室城市代表，将阿卡巴拉交易税制度化为稳定王室岁入。耗费100金币，持续25年提升税效、内阁效能与合法性，同时降低市民与农民满意度。"
 oe_v250_wce_dec_cas_cortes_burgos.a:0 "批准布尔戈斯议会税法协约"
 oe_v250_wce_dec_cas_cortes_burgos_tt:0 "在卡斯蒂利亚议会诸城确立阿卡巴拉定额税制，并记入王室财政档案。"
 oe_v250_wce.1.t:0 "阿方索十一世与《阿尔卡拉敕令》"
 oe_v250_wce.1.d:0 "汇集于阿尔卡拉·德·埃纳雷斯的王室法学家拟就一部宏大法典，确立国王敕令与罗马法系《七部法典》凌驾于各地分散市镇特许法之上。强力推行统一王室上诉司法可将卡斯蒂利亚与莱昂锻造成高效集权王国，但拉拉与阿罗等古老大贵族却警告，废弛旧宪必将激起诸侯反弹。"
 oe_v250_wce.1.a:0 "颁行《阿尔卡拉敕令》并裁抑领主私设法庭"
 oe_v250_wce.1.b:0 "确认各地旧特许法以安抚议会与大贵族"
 oe_v250_wce.1.c:0 "延揽萨拉曼卡法学者充实王室高等法院"
 oe_v250_wce.2.t:0 "美斯塔牧道与布尔戈斯羊毛集市"
 oe_v250_wce.2.d:0 "经布尔戈斯与北部港埠远销佛兰德斯织坊的美利奴羊毛，已成为卡斯蒂利亚国库的黄金命脉。然而美斯塔牧羊公会竟恳请国王严禁城镇圈垦牧道沿线荒地，令出口白银与牧主利益同塞哥维亚织匠及农耕村社陷入尖锐冲突。"
 oe_v250_wce.2.a:0 "护持美斯塔牧道特权并扩大北海羊毛出口"
 oe_v250_wce.2.b:0 "节制牧道侵占以扶持托莱多与本土织造业"
 oe_v250_wce.3.t:0 "圣兄弟会与格拉纳达边疆"
 oe_v250_wce.3.d:0 "安达卢西亚群山之间，格拉纳达边骑频频袭扰，大领主私斗亦危及塞维利亚河港商路与王室威严。各市镇同盟提议扩编圣兄弟会为常设王室弩兵与攻城民军；但老练边将却建议先与格拉纳达订立岁贡休战协定，以充实国库待机而动。"
 oe_v250_wce.3.a:0 "武装圣兄弟会劲旅并经略安达卢西亚前线"
 oe_v250_wce.3.b:0 "与格拉纳达议定岁贡休战以繁荣塞维利亚商港"
 oe_v250_wce_ref_ara_thalassocracy:0 "《海事领事法典》地中海海权制"
 oe_v250_wce_ref_ara_thalassocracy_desc:0 "以巴塞罗那《海事领事法典》、海外商馆领事网与常备桨帆战舰为纲领统合阿拉贡诸邦，大幅提振海运商贸与桨帆舰战力，却带来沉重海军维护开销并削弱内陆封建征召。"
 oe_v250_wce_priv_ara_catalan_cortes:0 "巴塞罗那习惯法与加泰罗尼亚商港特许"
 oe_v250_wce_priv_ara_catalan_cortes_desc:0 "向巴塞罗那百人议会与瓦伦西亚商团保证自治海事法庭与港埠关税特权，拓展商船运力与海上贸易效率，代价则是市民阶层权势坐大、商税上限下调并分薄王室集权。"
 oe_v250_wce_cab_ara_drassanes_consuls:0 "地中海海事领事法庭"
 oe_v250_wce_cab_ara_drassanes_consuls_desc:0 "自巴塞罗那与瓦伦西亚向西地中海诸港派驻海事领事，统一裁决航运契约与海损理赔，提升海贸、海权投射与水手征募，却增加舰队维护负担并引发内陆贵族不满。"
 oe_v250_wce_cab_ara_drassanes_consuls_action:0 "地中海海事领事法庭"
 oe_v250_wce_cab_ara_drassanes_consuls_active:0 "正在执行：地中海海事领事法庭"
 oe_v250_wce_cab_ara_drassanes_consuls_action_progress:0 "执行中"
 oe_v250_wce_cab_ara_drassanes_consuls_action_progress_wordier:0 "地中海海事领事法庭（执行中）"
 oe_v250_wce_cab_ara_drassanes_consuls_action_progress_tooltip:0 "自巴塞罗那与瓦伦西亚向西地中海诸港派驻海事领事，统一裁决航运契约与海损理赔，提升海贸、海权投射与水手征募，却增加舰队维护负担并引发内陆贵族不满。"
 oe_v250_wce_dec_ara_barcelona_drassanes.title:0 "扩建巴塞罗那皇家造船厂"
 oe_v250_wce_dec_ara_barcelona_drassanes.desc:0 "以宏伟石拱穹顶扩建巴塞罗那皇家造船厂，使其得以同时建造并修缮三十艘主力桨帆战舰。耗费110金币，持续25年显著强化桨帆战力、造船速度与水手储备，但舰队维护与税效承压。"
 oe_v250_wce_dec_ara_barcelona_drassanes.a:0 "兴建皇家造船厂哥特石拱船台"
 oe_v250_wce_dec_ara_barcelona_drassanes_tt:0 "建成巴塞罗那皇家石拱造船厂，并将其编入阿拉贡王室海军常设名录。"
 oe_v250_wce.4.t:0 "礼仪王佩德罗四世与阿拉贡贵族同盟"
 oe_v250_wce.4.d:0 "桀骜不驯的阿拉贡与瓦伦西亚贵族重结「阿拉贡同盟」，援引《同盟特权》公然威胁国王不得擅专朝政。人称「礼仪王」的佩德罗四世已磨剑待发，誓要在战场击溃叛盟并亲手以匕首划碎特权羊皮纸；而稳健派重臣则建言倚重独立的大法官（Justicia）出面仲裁，以求宪制长治。"
 oe_v250_wce.4.a:0 "铁腕击溃贵族同盟并亲刃撕毁《同盟特权》"
 oe_v250_wce.4.b:0 "尊崇阿拉贡大法官作为宪制仲裁者"
 oe_v250_wce.5.t:0 "《海事领事法典》与西地中海商路"
 oe_v250_wce.5.d:0 "从马略卡、卡利亚里直至巴勒莫与亚历山大港，加泰罗尼亚商船与瓦伦西亚桨帆舰织就了富庶的地中海商网，但热那亚战舰与北非海盗却处处掣肘。巴塞罗那法学家主张在各港统一颁行《海事领事法典》以吸纳中立商舶；宿将水师则力主扩建突击舰队与轻步登岸队，以铁血击破对手垄断。"
 oe_v250_wce.5.a:0 "于全境商港统一颁行《海事领事法典》"
 oe_v250_wce.5.b:0 "遣出皇家桨帆舰队与阿尔莫加瓦尔突击队争锋"
 oe_v250_wce.6.t:0 "卡斯佩仲裁协定"
 oe_v250_wce.6.d:0 "王位继承危机正将阿拉贡、加泰罗尼亚与瓦伦西亚推向分裂内战的边缘。为免伊比利亚陷入血火，三邦各推选三名德高望重的法学家齐聚卡斯佩城堡，依法公开仲裁王位归属。遵从九人团裁决可保全联合王国完整与欧洲声望；若趁机强化加泰罗尼亚与瓦伦西亚议会自治，则虽护住商邦自由，却将加剧宪制裂痕。"
 oe_v250_wce.6.a:0 "遵奉卡斯佩九人仲裁团裁决以维系三邦一体"
 oe_v250_wce.6.b:0 "扩充加泰罗尼亚与瓦伦西亚议会自治特权"
 oe_v250_wce_ref_por_navigation_school:0 "大西洋航海与星图学派"
 oe_v250_wce_ref_por_navigation_school_desc:0 "在王室资助下汇聚葡萄牙领航员、海图测绘师与拉各斯轻帆造船匠，专研大西洋季风与洋流规律，显著提速远洋探索、海贸与海权投射，代价则是海军维护趋重且陆军兵源缩减。"
 oe_v250_wce_priv_por_order_of_christ:0 "基督骑士团托马尔领地特许"
 oe_v250_wce_priv_por_order_of_christ_desc:0 "将富庶的托马尔旧圣殿骑士团领地敕交基督骑士团管理，专款资助远洋航行与护岸舰队，提升海军士气与探索效率，同时抬升教士权势、下调教会税限并令农户承负微增。"
 oe_v250_wce_cab_por_caravel_charts:0 "拉各斯轻帆船与海图测绘"
 oe_v250_wce_cab_por_caravel_charts_desc:0 "命王室重臣统筹里斯本与拉各斯的绝密波特兰海图汇编、星盘观测与三角帆轻船试航，拓展贸易航程、远洋探索与学术科研，代价则是海军维护与国库税效小幅承压。"
 oe_v250_wce_cab_por_caravel_charts_action:0 "拉各斯轻帆船与海图测绘"
 oe_v250_wce_cab_por_caravel_charts_active:0 "正在执行：拉各斯轻帆船与海图测绘"
 oe_v250_wce_cab_por_caravel_charts_action_progress:0 "执行中"
 oe_v250_wce_cab_por_caravel_charts_action_progress_wordier:0 "拉各斯轻帆船与海图测绘（执行中）"
 oe_v250_wce_cab_por_caravel_charts_action_progress_tooltip:0 "命王室重臣统筹里斯本与拉各斯的绝密波特兰海图汇编、星盘观测与三角帆轻船试航，拓展贸易航程、远洋探索与学术科研，代价则是海军维护与国库税效小幅承压。"
 oe_v250_wce_dec_por_lisbon_arsenal.title:0 "敕建里斯本皇家船坞与海险商社"
 oe_v250_wce_dec_por_lisbon_arsenal.desc:0 "在特茹河畔兴建皇家大船坞，并仿行王室海运互助保险商社，令里斯本船东得以无忧建造远洋克拉克帆船。耗费100金币，持续25年提升造船速度、海贸与水手储备，同时增加舰队维护费并招致旧领主微词。"
 oe_v250_wce_dec_por_lisbon_arsenal.a:0 "启用特茹河船台与海运保险交易所"
 oe_v250_wce_dec_por_lisbon_arsenal_tt:0 "在特茹河口正式设立里斯本皇家船坞与王室海运保险名录。"
 oe_v250_wce.7.t:0 "阿方索四世与托马尔基督骑士团"
 oe_v250_wce.7.d:0 "萨拉多河大捷之后，国王阿方索四世必须决断托马尔基督骑士团名下广袤农庄与沿海领地的去向。若将骑士团什一税专用于筑牢大西洋海防并资助航海船长，便可铸就抵御北非海盗的海上坚盾；若清查骑士团免税特权充实王室国库，则能振兴内陆税赋与农产，却必将触怒教会阶层。"
 oe_v250_wce.7.a:0 "以基督骑士团财赋专供大西洋海防与水师"
 oe_v250_wce.7.b:0 "清丈骑士团教产以振兴内陆农耕与王室赋税"
 oe_v250_wce.8.t:0 "阿维斯王朝、阿尔茹巴罗塔与温莎盟约"
 oe_v250_wce.8.d:0 "勃艮第王系绝嗣、强邻压境之际，科英布拉议会与里斯本市民行会毅然拥戴阿维斯骑士团长与名将努诺·阿尔瓦雷斯·佩雷拉。依托严整的下马步兵方阵并缔结世代相传的英葡《温莎盟约》，可力保葡萄牙独立国祚，却需强力压制心怀观望的旧领主贵族。"
 oe_v250_wce.8.a:0 "拥立阿维斯新朝、重整步兵方阵并缔结温莎盟约"
 oe_v250_wce.8.b:0 "颁布怀柔特许以安抚旧派领主贵族"
 oe_v250_wce.9.t:0 "远征休达与大西洋航路开端"
 oe_v250_wce.9.d:0 "伊比利亚干戈既息，诸位王子与拉各斯水手已将目光投向圣文森特角以外的休达、马德拉与未知非洲海岸。将白银倾注于海峡要塞与远洋轻帆探险，可将大西洋化作葡萄牙的通途；但务实大臣却警示，海外征戍恐将透支本该用于里斯本与波尔图欧洲商队的宝贵资财。"
 oe_v250_wce.9.a:0 "重金资助大西洋轻帆探险、海峡要塞与海图绘制"
 oe_v250_wce.9.b:0 "深耕里斯本—波尔图近海商贸与欧洲航线"
 oe_v250_wce_ref_hab_privilegium_maius:0 "《大特权》大公枢密院制"
 oe_v250_wce_ref_hab_privilegium_maius_desc:0 "依托维也纳大公枢密院确立哈布斯堡家族凌驾寻常诸侯的世袭大公法统，显著提升帝国交涉声望、王朝合法性与内阁效率，代价则是礼仪维稳成本升高且常备军维护趋重。"
 oe_v250_wce_priv_hab_alpine_tolls:0 "内奥地利阿尔卑斯商道与铁矿行会"
 oe_v250_wce_priv_hab_alpine_tolls_desc:0 "授予施蒂利亚铁矿行会与维也纳大商团通行塞默灵及阿尔卑斯山口的商贸特许，提振陆贸与矿产原料产出，代价则是市民阶层权势攀升、商税上限下调并引发山民农户微词。"
 oe_v250_wce_cab_hab_alpine_customs:0 "内奥地利山口税关巡查"
 oe_v250_wce_cab_hab_alpine_customs_desc:0 "派遣大公税关专员巡核目标行省的山隘关卡、盐路驿站与炼铁工坊，提升当地繁荣度、生产与控制度并增加国库税效，但会引起商团不满与行政维稳压力。"
 oe_v250_wce_cab_hab_alpine_customs_action:0 "内奥地利山口税关巡查：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_wce_cab_hab_alpine_customs_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行内奥地利山口税关巡查"
