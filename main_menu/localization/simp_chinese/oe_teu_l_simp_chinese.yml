l_simp_chinese:
 # NEW 2026-11-23 v22.0 Module 1: Teutonic, Livonian & Hospitaller Military Orders (oe_teu_) — simp_chinese localization (123 keys) (oe_teu_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v220_teu_start_laws.py; edit the generator, not this file.
 oe_teu_law_order_rule:0 "骑士团清规与军制法"
 oe_teu_law_order_rule_desc:0 "确立骑士团的军政清规与编组制度：从严守誓愿的纯正骑士修士，到吸纳欧洲十字军客卿与雇佣骑兵，抑或依托边疆红砖团堡动员地方民兵协防。"
 oe_teu_pol_pure_knight_brothers:0 "纯正骑士修士戒律"
 oe_teu_pol_pure_knight_brothers_desc:0 "坚持由发愿修士骑士担任全军中坚与突击重骑，铸就严明军纪与虔诚信念，代价是地方征召兵员规模受限且军费偏高。"
 oe_teu_pol_preussenreisen_guests:0 "十字军客卿与雇佣骑兵制"
 oe_teu_pol_preussenreisen_guests_desc:0 "制度化延请波希米亚、巴伐利亚及西欧诸国十字军客卿骑士并签雇精锐佣兵团，显著提升野战士气与雇佣军维护效率。"
 oe_teu_pol_ordensburg_militia:0 "边疆团堡民兵协防制"
 oe_teu_pol_ordensburg_militia_desc:0 "将受封市镇居民与边疆自由农编入团堡协防体系，降低要塞维护负担并充实后备兵员与征召规模。"
 oe_teu_law_kulm_ostsiedlung:0 "库尔姆法典与东扩垦殖法"
 oe_teu_law_kulm_ostsiedlung_desc:0 "规定骑士团新垦疆域的田产法权、拓荒特许状与本土族群治理方略，在德意志垦殖、双语共治与团堡直属庄园之间确立国策。"
 oe_teu_pol_kulm_settler_charter:0 "库尔姆德意志拓荒宪章"
 oe_teu_pol_kulm_settler_charter_desc:0 "广泛颁行世袭库尔姆法典田权与拓荒免税期，招徕德意志垦民与市镇营造官，稳步推进文化融汇、人口增长与地方繁荣，代价是略触传统贵族特权。"
 oe_teu_pol_bilingual_cogovernance:0 "骑士团与土著双语共治法"
 oe_teu_pol_bilingual_cogovernance_desc:0 "承认受洗本土自由民、教区通译与地方长老在行省法庭中的地位，稳步推进对异教族群的传教教化、国家稳定与最高控制上限。"
 oe_teu_pol_brick_commandery_estates:0 "红砖团堡辖区庄园制"
 oe_teu_pol_brick_commandery_estates_desc:0 "将新垦区直接划归红砖团堡大管区与委任执事经营，加快要塞兴建并强化中央控御与直属税收，代价是农民阶层承压。"
 oe_teu_law_balleien_tribute:0 "欧洲大辖区贡赋法"
 oe_teu_law_balleien_tribute_desc:0 "规范骑士团如何调配遍布天主教欧洲的各大辖区（巴莱与修道省）资源，决定将其转化为国库贡银、志愿骑士兵源或教廷帝国声望。"
 oe_teu_pol_remit_treasury_tithes:0 "辖区什一税汇缴国库"
 oe_teu_pol_remit_treasury_tithes_desc:0 "责令欧洲各大辖区长将庄园盈余折算金银汇票按年解送前线总司库，充盈常备军费与国库现金流。"
 oe_teu_pol_conscript_volunteer_knights:0 "大辖区志愿骑士征召制"
 oe_teu_pol_conscript_volunteer_knights_desc:0 "从德意志、法兰西与意大利各辖区直接征召贵族次子与披甲军士奔赴前线，扩充后备兵员、教士征召与攻城攻坚能力。"
 oe_teu_pol_papal_imperial_prestige:0 "教宗敕令与帝国威望宣叙"
 oe_teu_pol_papal_imperial_prestige_desc:0 "于罗马教廷与帝国议会常驻首席代办，广布十字军功绩，显著提升外交声誉、宗教影响力、月度威望与附庸忠诚，代价是需拨付驻外经费。"
 oe_teu_law_hansa_league:0 "汉萨城市与普鲁士邦联宪章"
 oe_teu_law_hansa_league_desc:0 "权衡骑士团国营商站与汉萨港口城市、普鲁士市民邦联之间的商贸特权，界定琥珀与谷物海贸利润的归属格局。"
 oe_teu_pol_order_trade_monopoly:0 "骑士团琥珀与谷物专卖制"
 oe_teu_pol_order_trade_monopoly_desc:0 "将琥珀王权专卖与大宗谷物外运收归马尔堡与哥尼斯堡大商官专营，壮大团廷集权与生产效率，但会令市民阶层不满并加剧普鲁士邦联离心。"
 oe_teu_pol_hanseatic_profit_sharing:0 "汉萨同盟商税分成协定"
 oe_teu_pol_hanseatic_profit_sharing_desc:0 "与格但斯克、托伦、埃尔布隆格等汉萨商站缔结利润分成协定，提升海贸效率、商人实力与市民阶层满意度，并有助于缓和普鲁士邦联张力。"
 oe_teu_pol_knight_merchant_confed:0 "骑士—市民共治邦联宪章"
 oe_teu_pol_knight_merchant_confed_desc:0 "吸纳海港市议会与乡绅骑士共赴行省等级议会，提高市民最高税率、内阁行政与立法效率，并扩大商队运力，代价是略微分散大团长集权。"
 STATIC_MODIFIER_NAME_oe_teu_balleien_tier1_mod:0 "欧洲大辖区网络（初具规模）"
 STATIC_MODIFIER_DESC_oe_teu_balleien_tier1_mod:0 "散布在天主教欧洲各地的骑士团辖区与修道分院按年汇寄捐资与后备兵员，支援前线圣战。"
 STATIC_MODIFIER_NAME_oe_teu_balleien_tier2_mod:0 "欧洲大辖区网络（稳固兴盛）"
 STATIC_MODIFIER_DESC_oe_teu_balleien_tier2_mod:0 "横跨德意志、法兰西与地中海的骑士团辖区网络运转成熟，源源不断地输送什一税银、志愿骑士与教廷声望。"
 STATIC_MODIFIER_NAME_oe_teu_balleien_tier3_mod:0 "欧洲大辖区网络（遍及全欧）"
 STATIC_MODIFIER_DESC_oe_teu_balleien_tier3_mod:0 "依托遍布全欧的富庶大辖区与崇高圣战威望，骑士团享有充沛贡银、稳定兵源与高昂士气，代价是维系跨欧网络的军政开销。"
 STATIC_MODIFIER_NAME_oe_teu_law_transition_mod:0 "总团会议法令施行期"
 STATIC_MODIFIER_DESC_oe_teu_law_transition_mod:0 "各辖区长与团堡元帅正在辖境宣谕总团会议通过的新法令，短期内强化行政与团规凝聚力。"
 STATIC_MODIFIER_NAME_oe_teu_liv_viterbo_oath_mod:0 "维泰博誓约（利沃尼亚自治协约）"
 STATIC_MODIFIER_DESC_oe_teu_liv_viterbo_oath_mod:0 "自1237年宝剑骑士团并入条顿骑士团以来，维泰博誓约维系着利沃尼亚团长对马尔堡的效忠与北翼自治平衡。"
 STATIC_MODIFIER_NAME_oe_teu_1337_ordensstaat_treasury_mod:0 "骑士团辖区紧急军费统筹"
 STATIC_MODIFIER_DESC_oe_teu_1337_ordensstaat_treasury_mod:0 "通过暂调汉萨谷物预付、琥珀专卖税银与德意志大辖区应急解款，在1337至1347年开局十年间缓和条顿骑士团高额城堡与驻军维护压力，代价是普鲁士市民阶层对临时摊派略有怨言。"
 STATIC_MODIFIER_NAME_oe_teu_preussenreisen_crusade_mod:0 "十字军客卿远征军团"
 STATIC_MODIFIER_DESC_oe_teu_preussenreisen_crusade_mod:0 "来自西欧各国的诸侯、伯爵与骑士侍从云集骑士团战旗下参与季候远征，显著增强攻城与重骑突击锐气。"
 STATIC_MODIFIER_NAME_oe_teu_preussenreisen_waning_mod:0 "式微的客卿远征骑士团"
 STATIC_MODIFIER_DESC_oe_teu_preussenreisen_waning_mod:0 "立陶宛受洗改宗动摇圣战法理后，应召东来的西欧客卿骑士锐减，仅能以更高代价提供有限的战地增援。"
 STATIC_MODIFIER_NAME_oe_teu_kulm_charter_active_mod:0 "库尔姆法典垦殖特许状"
 STATIC_MODIFIER_DESC_oe_teu_kulm_charter_active_mod:0 "新颁库尔姆市镇与村落特许状吸引工匠与垦民迁入，带动行省繁荣、人口增长与温和的文化融合。"
 STATIC_MODIFIER_NAME_oe_teu_preussenreisen_1337_mod:0 "1337年波希米亚—巴伐利亚十字军先遣"
 STATIC_MODIFIER_DESC_oe_teu_preussenreisen_1337_mod:0 "波希米亚国王约翰与下巴伐利亚公爵亨利亲赴马尔堡助阵，赋予条顿远征军高昂士气与攻城战力。"
 STATIC_MODIFIER_NAME_oe_teu_brick_ostsiedlung_mod:0 "红砖团堡与垦殖基建计划"
 STATIC_MODIFIER_DESC_oe_teu_brick_ostsiedlung_mod:0 "骑士团将经费投入红砖团堡窑场与有序边疆营建，同步推进要塞筑城、地方繁荣与行政控御。"
 STATIC_MODIFIER_NAME_oe_teu_liv_northern_wing_mod:0 "利沃尼亚北翼协同攻势"
 STATIC_MODIFIER_DESC_oe_teu_liv_northern_wing_mod:0 "团长埃伯哈德·冯·蒙海姆率领利沃尼亚北翼军团与马尔堡南北夹击，沿道加瓦河向萨莫吉希亚与立陶宛施压。"
 STATIC_MODIFIER_NAME_oe_teu_liv_daugava_forts_mod:0 "道加瓦河石砌团堡防线"
 STATIC_MODIFIER_DESC_oe_teu_liv_daugava_forts_mod:0 "沿道加瓦河与库尔兰加固的石砌团堡链稳固了利沃尼亚控御，有效迟滞敌军反扑。"
 STATIC_MODIFIER_NAME_oe_teu_kni_war_fleet_mod:0 "罗得岛爱琴海常备桨帆舰队"
 STATIC_MODIFIER_DESC_oe_teu_kni_war_fleet_mod:0 "驻泊罗得岛要塞港的医院骑士团常备桨帆舰队日夜巡弋东爱琴海航道，显著提升桨帆战力与海上存在。"
 STATIC_MODIFIER_NAME_oe_teu_kni_hospital_harbor_mod:0 "罗得岛大医院与自由商港"
 STATIC_MODIFIER_DESC_oe_teu_kni_hospital_harbor_mod:0 "投入罗得岛大医院与黎凡特商栈的专项基金提升了海贸效率、虔诚声望与岛屿城防。"
 STATIC_MODIFIER_NAME_oe_teu_kniprode_golden_age_mod:0 "温里希·冯·克尼普罗德黄金时代"
 STATIC_MODIFIER_DESC_oe_teu_kniprode_golden_age_mod:0 "在闻名全欧的“荣誉之桌”骑士盛宴与严明军政下，马尔堡跃升为北欧最具威望的骑士圣殿，重骑与税政齐升。"
 STATIC_MODIFIER_NAME_oe_teu_kniprode_chancery_mod:0 "马尔堡枢密院与修院学堂改革"
 STATIC_MODIFIER_DESC_oe_teu_kniprode_chancery_mod:0 "修院学堂兴学、谷仓账册审计与精干枢密书吏共同推动骑士团国迈向近代化官僚治理。"
 STATIC_MODIFIER_NAME_oe_teu_marienburg_citadel_loc_mod:0 "马尔堡红砖高堡（大团长宫）"
 STATIC_MODIFIER_DESC_oe_teu_marienburg_citadel_loc_mod:0 "欧洲最宏伟的哥特式红砖城堡巍然耸立于诺加特河畔，为治所带来铜墙铁壁般的城防、极高控御与繁荣。"
 STATIC_MODIFIER_NAME_oe_teu_ordensburg_garrisons_mod:0 "团堡军粮仓与常备驻军网"
 STATIC_MODIFIER_DESC_oe_teu_ordensburg_garrisons_mod:0 "遍布各辖区团堡的标准化粮仓与砖石城墙体系降低了要塞维护费并提升全境驻军规模。"
 STATIC_MODIFIER_NAME_oe_teu_balleien_boom_treasury_mod:0 "欧洲大辖区什一税盈余"
 STATIC_MODIFIER_DESC_oe_teu_balleien_boom_treasury_mod:0 "神圣罗马帝国与意大利各大辖区连年丰收，向骑士团前线国库源源汇入额外税银。"
 STATIC_MODIFIER_NAME_oe_teu_balleien_boom_knights_mod:0 "大辖区志愿骑士云集"
 STATIC_MODIFIER_DESC_oe_teu_balleien_boom_knights_mod:0 "成批欧洲辖区志愿骑士与披甲军士奔赴边疆，充实了骑士团兵员并高扬战旗士气。"
 STATIC_MODIFIER_NAME_oe_teu_riga_accord_mod:0 "道加瓦格里瓦和约（里加和解）"
 STATIC_MODIFIER_DESC_oe_teu_riga_accord_mod:0 "利沃尼亚骑士团与里加城及大主教区达成持久和解，巩固附庸忠诚并推动波罗的海商路繁荣。"
 STATIC_MODIFIER_NAME_oe_teu_livonian_hegemony_mod:0 "利沃尼亚团堡驻军霸权"
 STATIC_MODIFIER_DESC_oe_teu_livonian_hegemony_mod:0 "骑士团以铁腕驻军直控里加与诸主教区要隘，提升全军士气与赋税征收效率。"
 STATIC_MODIFIER_NAME_oe_teu_kulm_charter_boom_mod:0 "库尔姆法典城镇扩建潮"
 STATIC_MODIFIER_DESC_oe_teu_kulm_charter_boom_mod:0 "维斯瓦河与普列戈利亚河畔新获库尔姆特许状的市镇蓬勃兴起，推动垦殖人口增长、温和文化融合与手工业产出。"
 STATIC_MODIFIER_NAME_oe_teu_commandery_domains_mod:0 "直属团堡领地庄园"
 STATIC_MODIFIER_DESC_oe_teu_commandery_domains_mod:0 "将新垦林地保留为骑士团直营谷仓与战马牧场，稳步提高税收与中央控制度。"
 oe_teu_dec_summon_preussenreisen.title:0 "召集欧洲十字军客卿远征"
 oe_teu_dec_summon_preussenreisen.desc:0 "遣使奔赴波希米亚、巴伐利亚、法兰西与莱茵兰诸邦，延请欧洲骑士领主赴战旗下共襄圣战。每 #Y 10年#! 可举行一次（与北方十字军客卿行动共享冷却），补充 #G +1.5#! 人力、#G +4#! 陆军传统并赋予 #G 5年#! 客卿加成；若立陶宛受洗触发十字军法理危机，则花费增至 #R +50%#! 且收益减半。"
 oe_teu_dec_summon_preussenreisen.a:0 "遍告基督教诸国，升起十字军战旗"
 oe_teu_dec_kulm_settlement_charter.title:0 "颁行库尔姆法典垦殖特许状"
 oe_teu_dec_kulm_settlement_charter.desc:0 "依循久负盛名的《库尔姆法典》向边疆城镇与垦荒聚落颁发特许状。每 #Y 12年#! 可推行一次，令首都繁荣度提升 #G +6%#!，并开启 #G 10年#! 的东扩人口增长、温和文化融合与税政红利。"
 oe_teu_dec_kulm_settlement_charter.a:0 "钤印颁布库尔姆拓荒特许状"
 oe_teu_dec_collect_balleien_tithes.title:0 "稽核欧洲大辖区什一税贡"
 oe_teu_dec_collect_balleien_tithes.desc:0 "遣总司库稽查使巡核遍布天主教欧洲的大辖区与修道分院账簿。每 #Y 8年#! 可执行一次，依当前辖区网络层级汇缴 #G 45—105#! 杜卡特军费与 #G 0.5—1.5#! 人力，并即时刷新大辖区加成。"
 oe_teu_dec_collect_balleien_tithes.a:0 "核收各大辖区汇缴的什一税贡"
 oe_teu.1.title:0 "1337年普鲁士十字军：波希米亚国王与巴伐利亚公爵抵临马尔堡"
 oe_teu.1.desc:0 "波希米亚双尾狮旗与巴伐利亚蓝白菱纹旗迎风列队跨过诺加特河桥，驶入马尔堡红砖城门。卢森堡的约翰国王与下巴伐利亚公爵亨利十四世携数百精锐枪骑、战马与军资而来，助大团长迪特里希·冯·阿尔滕堡共征立陶宛。团廷是当即将其整编为锐不可当的十字军先遣主力直捣前线，还是把丰厚捐资投入红砖团堡与长远东扩垦殖？"
 oe_teu.1.a:0 "整编十字军客卿先遣与战备金库，正面击破立陶宛！"
 oe_teu.1.b:0 "将援款投入红砖团堡筑城与长远边疆基建"
 oe_teu.2.title:0 "利沃尼亚北翼总动员"
 oe_teu.2.desc:0 "沿库尔兰海岸疾驰北上的马尔堡信使送来大团长密令：普鲁士主力即将渡过涅曼河，立陶宛北境防线正露出破绽。利沃尼亚团长埃伯哈德·冯·蒙海姆召集派尔努、采西斯与维尔扬迪诸团堡长商议：是立刻挥师南下与主团南北夹击，还是先加固道加瓦河石砌团堡链以立不败之地？"
 oe_teu.2.a:0 "出兵萨莫吉希亚，与马尔堡主团南北夹击"
 oe_teu.2.b:0 "先固道加瓦河石砌团堡防线，稳守北疆"
 oe_teu.3.title:0 "罗得岛医院骑士团常备战舰队"
 oe_teu.3.desc:0 "矗立在罗得岛锁链港塔楼之上，大团长埃利翁·德·维伦纽夫远眺卡里亚海峡间日渐频密的安纳托利亚海盗风帆。凭借整顿西欧各修道省偿清宿债，修会如今手握宽裕军资：是立即组建一支常备爱琴海桨帆战舰队制海巡弋，还是扩建罗得岛大医院与黎凡特自由商港？"
 oe_teu.3.a:0 "整装出航：编成罗得岛爱琴海常备桨帆舰队"
 oe_teu.3.b:0 "扩建罗得岛大医院与东方自由商港设施"
 oe_teu.4.title:0 "大团长温里希·冯·克尼普罗德的黄金时代"
 oe_teu.4.desc:0 "历经数载严明整顿与赫赫战功，条顿骑士团国步入中世纪最为辉煌的黄金时代。从巴黎到布拉格的编年史家无不传颂马尔堡的“荣誉之桌”盛宴，各方精锐骑士以获邀赴宴为荣；而务实法吏亦建言趁此国势鼎盛，大力兴办修院学堂与枢密院账政改革。"
 oe_teu.4.a:0 "大设“荣誉之桌”盛宴，宏扬全欧骑士圣殿威望"
 oe_teu.4.b:0 "借鼎盛之机推行马尔堡学堂与枢密账政革新"
 oe_teu.5.title:0 "马尔堡红砖高堡落成大典"
 oe_teu.5.desc:0 "历经数十载沿诺加特河烧制数百万块普鲁士红砖，马尔堡高堡（Hochschloss）、圣母大礼拜堂与大团长夏厅的宏伟拱顶终于合龙竣工。北欧大地从未见证如此雄踞川泽的红砖堡宫。团廷是举行隆重祝圣大典将马尔堡铸就为永恒圣堡，还是把大批泥瓦工匠转派各地边疆团堡增筑粮仓？"
 oe_teu.5.a:0 "举行高堡祝圣大典，永固马尔堡圣堡之威"
 oe_teu.5.b:0 "转派工匠分赴边疆各团堡增筑城墙与军粮仓"
 oe_teu.6.title:0 "欧洲大辖区贡赋丰收潮"
 oe_teu.6.desc:0 "法兰克尼亚、阿尔萨斯、图林根与意大利等地的骑士团大辖区连岁丰稔，地租与什一税盈余充盈。各地辖区长遣使请示：总团究竟愿将这些盈余折成现银汇充前线军库，还是就地招募整装待发的贵族志愿骑士连队奔赴疆场？"
 oe_teu.6.a:0 "折算金银汇票，径直解送总司库充实军费"
 oe_teu.6.b:0 "令各大辖区就地招募披甲志愿骑士驰援前线"
 oe_teu.8.title:0 "利沃尼亚骑士团与里加之和解"
 oe_teu.8.desc:0 "半个世纪以来，利沃尼亚骑士团与富庶的汉萨重镇里加及里加大主教区纷争不断，屡屡招致教宗特使干预与邻邦窥伺。值此道加瓦前线急需同心协力之际，里加使节提议以道加瓦格里瓦和约确认彼此商贸与司法界限；团廷亦可选以强硬驻军彻底压服教会与市镇。"
 oe_teu.8.a:0 "签署道加瓦格里瓦和约，化干戈为同心共御"
 oe_teu.8.b:0 "坚持骑士团堡铁腕驻军，总揽里加防务与税权"
 oe_teu.9.title:0 "库尔姆法典城镇特许状大扩建"
 oe_teu.9.desc:0 "来自西里西亚、威斯特法伦与波美拉尼亚的营造官与垦民联名呈请大团长，愿依1233年《库尔姆手书宪章》在边疆荒原广建新镇。广颁自由城镇特许状将带来稳步增长的工坊与定居人口，而各地大管区执事则主张将最肥沃的垦地留作骑士团直营庄园。"
 oe_teu.9.a:0 "广颁边疆自由库尔姆城镇宪章，招徕八方垦民"
 oe_teu.9.b:0 "将上等新垦区收归团堡直营谷仓与战马牧场"
