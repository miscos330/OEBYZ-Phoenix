l_simp_chinese:
 # NEW 2026-11-18 fourth round D2 (former royal houses). Generated by gen_round4_houses.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_tnh_court_honours: "宫廷名誉与田产"
 STATIC_MODIFIER_DESC_oe_tnh_court_honours: "这位前君主在君士坦丁堡受到礼遇，并领有一处田产。"
 oe_tnh_opt_roll: "将[SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName]家族列入豪族名册"
 oe_tnh_opt_roll.tt: "[SCOPE.sCharacter('oe_tm_king').GetName]留在君士坦丁堡，各行省由朝廷指派的长官治理。[SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName]家族列入豪族名册，占用一个空位。"
 oe_tnh_roll_init1_tt: "新设1个行省：该家族的初始影响力为60。"
 oe_tnh_roll_init2_tt: "新设2个行省：该家族的初始影响力为80。"
 oe_tnh_roll_init3_tt: "新设3个行省：该家族的初始影响力为100。"
 oe_tnh_roll_sure_tt: "豪族名册只收至少有6名在世成员居住在东罗马的家族。[SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName]家族眼下有[SCOPE.sCharacter('oe_tm_king').MakeScope.ScriptValue('oe_tnh_kin_at_court')|0]人，符合条件。"
 oe_tnh_roll_risk_tt: "豪族名册只收至少有6名在世成员居住在东罗马的家族。[SCOPE.sCharacter('oe_tm_king').GetDynasty.GetName]家族眼下只有[SCOPE.sCharacter('oe_tm_king').MakeScope.ScriptValue('oe_tnh_kin_at_court')|0]人。没有归属任何国家的族人会随[SCOPE.sCharacter('oe_tm_king').GetName]迁来；如果人数仍然不足，家族不能入册，朝廷改为授予[SCOPE.sCharacter('oe_tm_king').GetName]宫廷名誉与田产（与另一选项相同）。"
 oe_tnh_opt_honour: "授[SCOPE.sCharacter('oe_tm_king').GetName]宫廷名誉与田产"
 oe_tnh_opt_honour.tt: "[SCOPE.sCharacter('oe_tm_king').GetName]留在君士坦丁堡，各行省由朝廷指派的长官治理。[SCOPE.sCharacter('oe_tm_king').GetName]终身享有“宫廷名誉与田产”：外交 +5，预期寿命 +3年。帝国威望 +5。每个新设的行省忠诚 +5，并计入忠诚目标5年。"
 oe_tnh.1.t: "旧王室在君士坦丁堡"
 oe_tnh.1.d: "1018年，保加利亚末代沙皇伊凡·弗拉迪斯拉夫死后，他的遗孀和子女向巴西尔二世投降。长子普雷西安获授高级头衔“马吉斯特罗斯”，后来出任布切拉里翁军区的将军；他的弟弟阿卢西安获授“显贵”头衔，后来出任狄奥多西奥波利斯军区的将军。1280年，保加利亚沙皇伊凡·亚森三世在伊瓦伊洛起义中逃到帝国境内，后来回到特罗阿斯的家族田产，1303年去世。他的后人亚森家族在宫廷和地方任职，直到帝国末年。他的儿子安德罗尼卡·亚森在1316年到1322年治理摩里亚，孙女伊琳娜嫁给了约翰·坎塔库泽努斯。"
 oe_tnh.1.d1: "\n\n如今，[SCOPE.sCharacter('oe_tnh_rk').GetName]和家人已在君士坦丁堡安顿下来。[SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName]家族列入了豪族名册，初始影响力为[GetCountry('BYZ').MakeScope.GetVariable('oe_tnh_rep_init').GetValue|0]。"
 oe_tnh.1.d2: "\n\n如今，[SCOPE.sCharacter('oe_tnh_rk').GetName]已在君士坦丁堡安顿下来，但居住在东罗马的族人只有[GetCountry('BYZ').MakeScope.GetVariable('oe_tnh_rep_kin').GetValue|0]人，不到名册要求的6人，[SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName]家族没能入册。朝廷改为授予[SCOPE.sCharacter('oe_tnh_rk').GetHerHim]宫廷名誉与田产。"
 oe_tnh.1.d3: "\n\n如今，[SCOPE.sCharacter('oe_tnh_rk').GetName]已在君士坦丁堡安顿下来，但豪族名册已经没有空位，[SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName]家族没能入册。朝廷改为授予[SCOPE.sCharacter('oe_tnh_rk').GetHerHim]宫廷名誉与田产。"
 oe_tnh.1.d4: "\n\n如今，[SCOPE.sCharacter('oe_tnh_rk').GetName]已在君士坦丁堡安顿下来，但[SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName]家族没能列入豪族名册。朝廷改为授予[SCOPE.sCharacter('oe_tnh_rk').GetHerHim]宫廷名誉与田产。"
 oe_tnh.1.d5: "\n\n如今，[SCOPE.sCharacter('oe_tnh_rk').GetName]已经不能留在帝都，[SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName]家族没能列入豪族名册。朝廷按礼数安抚了新设的行省。"
 oe_tnh.1.a: "以礼相待"
 oe_tnh.1.a.tt_ok: "[SCOPE.sCharacter('oe_tnh_rk').GetDynasty.GetName]家族已在豪族名册上，初始影响力[GetCountry('BYZ').MakeScope.GetVariable('oe_tnh_rep_init').GetValue|0]（已生效）。此后它的影响力按名册的规则每月变动。"
 oe_tnh.1.a.tt_alt: "[SCOPE.sCharacter('oe_tnh_rk').GetName]终身享有“宫廷名誉与田产”（在世时）：外交 +5，预期寿命 +3年。帝国威望 +5。每个新设的行省忠诚 +5，并计入忠诚目标5年。以上均已生效。"
 oe_tnh.9.t: "旧王室：入册处理"
