l_simp_chinese:
 oe_byz_constantinople_granary: "都城储粮总仓"
 oe_byz_constantinople_granary_desc: "商船卸下的谷物在此称量、入仓。妥善储备粮食，才能让都城平稳度过歉收与封锁。"
 oe_city_granary_maintenance: "都城储粮总仓运作"
 oe_byz_constantinople_customs: "金角湾关栈"
 oe_byz_constantinople_customs_desc: "关吏核验货单，商人寄存货物，护卫照看码头。井然有序的关栈使金角湾的贸易更加可靠。"
 oe_city_customs_maintenance: "金角湾关栈运作"
 oe_byz_constantinople_repair: "港湾修船所"
 oe_byz_constantinople_repair_desc: "船匠在岸边更换船板，修补索具。这里无需建造壮观的船坞，却能让受损的船只更快返回海上。"
 oe_city_repair_maintenance: "港湾修船所运作"
 oe_byz_constantinople_chancery: "布拉赫内文书院"
 oe_byz_constantinople_chancery_desc: "诏令、名册与地方呈文汇集于宫廷附近。熟习法令的书记官整理案卷，使皇帝的命令不至于消失在重重文书之间。"
 oe_city_chancery_maintenance: "布拉赫内文书院运作"
 oe_byz_constantinople_baths: "梅塞公共浴场"
 oe_byz_constantinople_baths_desc: "浴场重新升起热气，市民在忙碌之余洗浴、交谈。清洁的水池与维护良好的炉房，让古老的都市生活继续延续。"
 oe_city_baths_maintenance: "梅塞公共浴场运作"
 oe_byz_constantinople_hospital: "潘托克拉托尔医院"
 oe_byz_constantinople_hospital_desc: "修院的病房向病人与贫者敞开。医师和修士依照病情分配床位，以药物、饮食和细心照料减轻疾苦。"
 oe_city_hospital_maintenance: "潘托克拉托尔医院运作"
 oe_byz_constantinople_arsenal: "陆墙军械库"
 oe_byz_constantinople_arsenal_desc: "城墙背后的库房储存弓弩、甲胄与修缮器械。警钟响起时，守军不必再四处搜集可以使用的兵器。"
 oe_city_arsenal_maintenance: "陆墙军械库运作"
 oe_byz_constantinople_scriptorium: "都城抄写作坊"
 oe_byz_constantinople_scriptorium_desc: "抄写员逐页校订经卷、法书与古典著作。书籍在这里得到保存，也从这里流入学馆与市民的书架。"
 oe_city_scriptorium_maintenance: "都城抄写作坊运作"
 oe_byz_constantinople_silk: "皇室丝织工坊"
 oe_byz_constantinople_silk_desc: "织工以丝线和染料织出细密的纹样。宫廷的订单维系着精湛技艺，也使都城的织物继续行销远方。"
 oe_city_silk_maintenance: "皇室丝织工坊运作"
 oe_byz_constantinople_galata_hall: "新加拉太区"
 oe_byz_constantinople_galata_hall_desc: "帝国重新掌握加拉太之后，商旅仍可在此落脚、交易和议事。他们的经营由统一的法令保障，不再依赖外国享有的特权。\n\n扩建须完成帝国改革#Y 驱逐外夷#!。"
 oe_city_galata_hall_maintenance: "新加拉太区运作"
 oe_byz_constantinople_new_venice: "新威尼斯区"
 oe_byz_constantinople_new_venice_desc: "昔日的威尼斯商区以新的秩序重新开放。愿意接受帝国管辖的商人和工匠可在此定居，把海上贸易的经验带回都城。\n\n扩建须完成帝国改革#Y 驱逐外夷#!。"
 oe_city_new_venice_maintenance: "新威尼斯区运作"
 oe_byz_constantinople_naval_academy: "皇家海军学院"
 oe_byz_constantinople_naval_academy_desc: "学院的军官研读航海记录，辨认海岸与风向，并在港口练习舰队调度。帝国的海上经验由此传授给新一代指挥官。\n\n扩建须在君士坦丁堡#Y 建成五级普罗潘提斯港口#!；尚在施工中的等级不计入。"
 oe_city_naval_academy_maintenance: "皇家海军学院运作"
 oe_byz_constantinople_athena_shipyard: "雅典娜造船厂"
 oe_byz_constantinople_athena_shipyard_desc: "充足的船台与熟练的工匠，使大型战舰的建造得到周密安排。坚实的船体、可靠的索具与统一的工艺，为帝国舰队提供更强的战船。\n\n扩建须在君士坦丁堡#Y 建成五级普罗潘提斯港口#!；尚在施工中的等级不计入。"
 oe_city_athena_shipyard_maintenance: "雅典娜造船厂运作"
 OE_CITY_REQUIRE_EXPEL: "扩建条件：完成#Y 驱逐外夷#!改革"
 OE_CITY_REQUIRE_PORT: "扩建条件：#Y 建成五级普罗潘提斯港口#!"
