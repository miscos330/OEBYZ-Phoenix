 # NEW 2026-11-21 v9.5 Imperial Culture Fusion & Dynamic Institution Origins (oe_cul_, slot 71). Generated by gen_culture_fusion_institutions.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_cul_eurasian_spark_mod: "欧亚文明自燃思潮火种"
 STATIC_MODIFIER_DESC_oe_cul_eurasian_spark_mod: "欧亚大都会凭借雄厚学府、识字市民与跨洲商路自主点燃思潮火种，提升文化影响力并大幅降低全帝国接纳新思潮的开销。"
 STATIC_MODIFIER_NAME_oe_cul_eurasian_spark_conservative_mod: "思潮稳健消化与典制涵养"
 STATIC_MODIFIER_DESC_oe_cul_eurasian_spark_conservative_mod: "以审慎渐进之策引导新思潮融入旧制，在守成各阶层满意度的同时稳步涵养文化传统并小幅减轻接纳开销。"
 STATIC_MODIFIER_NAME_oe_cul_byz_synthesis_mod: "东地中海普世罗马综合盛世"
 STATIC_MODIFIER_DESC_oe_cul_byz_synthesis_mod: "拜占庭—罗马帝国成功融合地中海与安纳托利亚多民族菁华，令古典学术、行政传统与近代思潮交相辉映。"
 STATIC_MODIFIER_NAME_oe_cul_yuan_synthesis_mod: "大元混一欧亚多元盛治"
 STATIC_MODIFIER_DESC_oe_cul_yuan_synthesis_mod: "大元朝廷贯通蒙汉、江南、雪域与色目诸部典制，使政事堂效率、文化气度与天下各阶层向心力大为兴盛。"
 STATIC_MODIFIER_NAME_oe_cul_rus_synthesis_mod: "全罗斯跨欧亚文明汇流"
 STATIC_MODIFIER_DESC_oe_cul_rus_synthesis_mod: "俄罗斯帝国兼收罗斯古法、拜占庭礼制、草原骑战与西欧工程技艺，激发科研活力与帝国营建热潮。"
 oe_cul_adv_byz_italian_maritime_law: "《罗德—威尼斯海商融合法》"
 oe_cul_adv_byz_italian_maritime_law_desc: "融汇罗马《罗德海法》与北意海洋城邦的航运契约、保险及领事仲裁体系，令帝国商船纵横地中海与黑海航道。"
 oe_cul_adv_byz_armenian_cataphracts: "亚美尼亚山岳重骑兵传统"
 oe_cul_adv_byz_armenian_cataphracts_desc: "吸纳亚美尼亚世家纳哈拉尔的重甲骑战与高原关隘筑垒之术，重振东罗马山地边防与精锐铁骑的军纪底蕴。"
 oe_cul_adv_byz_slavic_theme_integration: "巴尔干斯拉夫军区共治制"
 oe_cul_adv_byz_slavic_theme_integration_desc: "将塞尔维亚与保加利亚豪族纳入帝国军区兵户与自治法册，化巴尔干群山为源源不绝的帝国兵源与多族共治典范。"
 oe_cul_adv_byz_levant_egypt_granary: "尼罗—叙利亚水利税契学"
 oe_cul_adv_byz_levant_egypt_granary_desc: "传承埃及尼罗河水位测税与黎凡特绿洲渠堰账籍制度，极大提升帝国行省的田赋征收与直辖行政控制力。"
 oe_cul_adv_byz_persian_chancery: "罗马—波斯宫廷文书与驿传学"
 oe_cul_adv_byz_persian_chancery_desc: "将希腊罗马法务文书与波斯底万官房制度、御道驿传合二为一，拓展帝国跨洲外交容量并加速法令推行。"
 oe_cul_adv_byz_anatolian_akritai_synergy: "安纳托利亚边民骑射融合阵"
 oe_cul_adv_byz_anatolian_akritai_synergy_desc: "结合帝国边防阿克里泰守备队与安纳托利亚高原骑射及高加索山兵战法，显著强化陆军士气与边城驻军韧性。"
 oe_cul_adv_byz_hellenic_humanism_bridge: "东希腊—拉丁古典人文双轨制"
 oe_cul_adv_byz_hellenic_humanism_bridge_desc: "在君士坦丁堡与意大利城邦间打通希腊语与拉丁语古典学社双轨互译网络，加速全帝国的学术研习与思潮扎根。"
 oe_cul_adv_yuan_han_cabinet_fusion: "蒙汉双轨尚书—中书政事堂"
 oe_cul_adv_yuan_han_cabinet_fusion_desc: "以草原札撒决断力统摄中原汉法文官案牍，建立蒙汉双语平章政事堂，大幅提高朝廷立法效率与赋税清核。"
 oe_cul_adv_yuan_jiangnan_shipwrights: "吴越福船与远洋指南罗盘术"
 oe_cul_adv_yuan_jiangnan_shipwrights_desc: "倚重吴越与闽南世袭船匠与海商导航世家，大规模建造水密隔舱福船并完善牵星过洋术，降低海军维持费并掌控东海至南海海权。"
 oe_cul_adv_yuan_tibetan_dharma_state: "宣政院政教互保与高原驿制"
 oe_cul_adv_yuan_tibetan_dharma_state_desc: "借宣政院礼敬雪域诸派并设立乌思藏—康区乌拉驿站网，以政教宽容安定西南藩属与多元信仰子民。"
 oe_cul_adv_yuan_persian_astronomy_math: "回回司天监与波斯商团算学"
 oe_cul_adv_yuan_persian_astronomy_math_desc: "汇集波斯与畏兀儿天算名家及斡脱商团复式核算术，重修历象仪具并贯通陆海丝路大宗外贸结算。"
 oe_cul_adv_yuan_korean_printing_gunnery: "高丽金属活字与火药箭炮融合"
 oe_cul_adv_yuan_korean_printing_gunnery_desc: "引入高丽铸铜活字印书工艺与火药神机箭术，使大元官刻典籍遍行天下、识字率节节攀升并加速近代思潮传播。"
 oe_cul_adv_yuan_jurchen_annan_frontier: "北疆铁骑与岭南象兵水师编练"
 oe_cul_adv_yuan_jurchen_annan_frontier_desc: "兼采辽东女真重甲骑兵与安南丛林水战象兵之长，构建适应寒北与湿热南疆的全地形帝国边防劲旅。"
 oe_cul_adv_rus_all_rus_chancery: "全罗斯诺夫哥罗德—基辅商法合流"
 oe_cul_adv_rus_all_rus_chancery_desc: "整合诺夫哥罗德波罗的海毛皮商约与基辅罗斯古法典传统，统一全罗斯诸部商税契约并扩大多元文化接纳容量。"
 oe_cul_adv_rus_byzantine_nomocanon: "希腊圣法典与帝国礼制传承"
 oe_cul_adv_rus_byzantine_nomocanon_desc: "延请希腊学者与正教法学家编纂罗斯版圣法典与双头鹰宫廷仪轨，令沙皇法统与正教圣统相得益彰。"
 oe_cul_adv_rus_steppe_cavalry_corps: "草原鞑靼—哥萨克轻骑兵旅"
 oe_cul_adv_rus_steppe_cavalry_corps_desc: "收编伏尔加与草原鞑靼骑手与边疆哥萨克军团同营操练，赋予全军强悍的草原机动士气与充沛后备兵源。"
 oe_cul_adv_rus_german_technical_quarter: "涅梅茨工业区与西欧工程院"
 oe_cul_adv_rus_german_technical_quarter_desc: "在莫斯科涅梅茨坊与波罗的海港埠延揽德意志冶金、测绘与建筑技师，令罗斯科研增速与大型营造工程一日千里。"
 oe_cul_adv_rus_caucasus_caspian_trade: "高加索—里海丝绸商道防卫制"
 oe_cul_adv_rus_caucasus_caspian_trade_desc: "联合格鲁吉亚、亚美尼亚与波斯商旅与山地守备力量，沿伏尔加—里海—高加索隘口构筑防卫线并畅通南方丝绸外贸。"
 oe_cul_imperial_integration_law: "帝国多民族治策法典"
 oe_cul_imperial_integration_law_desc: "横跨欧亚的大帝国终须抉择治民之本：是推行古典同化、广纳普世世界精英、实行羁縻共治，还是以译经书院促进文明互鉴。"
 oe_cul_policy_classical_assimilation: "古典同化主义"
 oe_cul_policy_classical_assimilation_desc: "以主体帝国礼法、官方学校与语文学社为纲，稳步引导新附行省融入核心文化认同并涵养深厚文化传统。"
 oe_cul_policy_imperial_cosmopolitanism: "普世世界主义"
 oe_cul_policy_imperial_cosmopolitanism_desc: "广纳欧亚各族大商与城邦精英入仕，大幅扩展接纳文化上限、抚慰各阶层并促进跨文明思潮在帝国内部蓬勃生长。"
 oe_cul_policy_federated_millet: "联邦羁縻共治"
 oe_cul_policy_federated_millet_desc: "承认各教派公社与边疆藩属的自治习俗与宗教宽容，以柔性羁縻换取附庸长久效忠与广袤边疆的安宁。"
 oe_cul_policy_scholarly_syncretism: "文明互鉴译经"
 oe_cul_policy_scholarly_syncretism_desc: "设皇家译经馆与多语书院，系统汇译希腊、阿拉伯、波斯、汉文与拉丁典籍，令识字率与科研效率双双跃升。"
 oe_cul.1.t: "普世罗马：地中海与安纳托利亚文明合流"
 oe_cul.1.d: "自君士坦丁堡的宫廷法务厅至亚得里亚海商栈与高加索山隘，接纳诸族而锻造的多项融合制度已在帝国内部生根发芽。希腊罗马法统、意大利海商契约、斯拉夫军区与东方驿传彼此交融，使古老的罗马世界焕发出崭新的普世气象。"
 oe_cul.1.a: "立普世综合典范，广布帝国文风"
 oe_cul.1.b: "将新学汇入御府书库，稳固朝纲"
 oe_cul.2.t: "混一欧亚：大元多元朝廷制度大成"
 oe_cul.2.d: "大都政事堂下，蒙汉平章共议国是，吴越船匠远航南洋，宣政院安抚雪域高原，回回司天监与高丽活字工坊竞相献艺。多民族制度融合已化为大元中兴最深厚的根基，令天下商旅与士人咸归帝国气象。"
 oe_cul.2.a: "敕颁混一盛治，播扬大元声教"
 oe_cul.2.b: "充实秘府典籍，厚植国本安宁"
 oe_cul.3.t: "跨陆汇流：全罗斯欧亚文明新章"
 oe_cul.3.d: "从诺夫哥罗德与基辅的古老商法，到承继自希腊的圣法典礼制，再到草原轻骑兵旅与西欧工程院、里海商道防卫，多民族文化融合已令罗斯由森林公国蜕变为贯通欧亚的巨擘帝国。"
 oe_cul.3.a: "以跨陆汇流之功兴盛帝国营建"
 oe_cul.3.b: "将融合新知编入御前学宫，巩固社稷"
 oe_cul.20.t: "欧亚文明自燃思潮火种"
 oe_cul.20.d: "无需苦等万里之外的西欧思潮缓缓东渐——凭借本国大都会中林立的学府书院、高识字市民阶层与繁忙的跨洲商道，新纪元的思潮火种已在这座欧亚枢纽中自主点燃并趋于成熟。宫廷学者与行会领袖齐聚阶前，请旨借此东风引领全国革新。"
 oe_cul.20.a: "顺势推举新潮，减免全国接纳开销"
 oe_cul.20.b: "稳健消化新知，守成礼法与各阶层和睦"
 oe_cul.90.t: "【测试】帝国文化融合与动态思潮（71号槽）：读数"
