 # NEW 2026-11-21 v9.8 Worker 4: Religio Romana Storyline, Hexapantheon Swapper, Decisions & O(1) Pulse (oe_romp_, 0 slots, 0 rules, 0 GUI, 0 vanilla overrides). Generated by gen_romp_story.py; edit the generator, not this file.
 oe_romp_dec_proclaim_religio_romana:0 "重光罗马古教"
 oe_romp_dec_proclaim_religio_romana.title:0 "重光罗马古教"
 oe_romp_dec_proclaim_religio_romana_desc:0 "从米斯特拉斯的哲人讲堂到卡皮托利乌姆的大理石废墟，古老诸神的祭坛从未彻底熄灭。皇帝可正式宣告帝国回归罗马多神教古礼，重续奥古斯都与尤利安以来的众神和平。"
 oe_romp_dec_proclaim_religio_romana.desc:0 "从米斯特拉斯的哲人讲堂到卡皮托利乌姆的大理石废墟，古老诸神的祭坛从未彻底熄灭。皇帝可正式宣告帝国回归罗马多神教古礼，重续奥古斯都与尤利安以来的众神和平。"
 oe_romp_dec_proclaim_religio_romana.a:0 "重燃帝国祭坛，宣诏回归罗马多神教"
 oe_romp_dec_proclaim_religio_romana_tt:0 "激活#Y 罗马多神教#!与神谕体系，皇室与帝国改奉古教，在首都兴起罗马多神教复兴思潮，并举行紫衣大祭司长即位大典。"
 oe_romp_human_only_tt:0 "仅人类玩家可执行此决议"
 oe_romp_neo_leading_tt:0 "帝国学术思潮中「新柏拉图主义」占据领先地位"
 oe_romp_dec_found_collegium_pontificum:0 "设立罗马大祭司团"
 oe_romp_dec_found_collegium_pontificum.title:0 "设立罗马大祭司团"
 oe_romp_dec_found_collegium_pontificum_desc:0 "重立由皇帝亲任大祭司长统领的罗马大祭司团，统筹全国圣历、神谕占兆与诸神殿祭仪，并向所有信奉罗马多神教的属国与盟邦敞开席位。"
 oe_romp_dec_found_collegium_pontificum.desc:0 "重立由皇帝亲任大祭司长统领的罗马大祭司团，统筹全国圣历、神谕占兆与诸神殿祭仪，并向所有信奉罗马多神教的属国与盟邦敞开席位。"
 oe_romp_dec_found_collegium_pontificum.a:0 "颁布《大祭司团宪章》"
 oe_romp_dec_found_collegium_pontificum_tt:0 "创立或加入#Y 罗马大祭司团#!国际组织，确立帝国在罗马多神教世界中的最高祭仪权威。"
 oe_romp_dec_restore_temple_guide:0 "诸神大殿重修总览"
 oe_romp_dec_restore_temple_guide.title:0 "诸神大殿重修总览"
 oe_romp_dec_restore_temple_guide_desc:0 "翻阅大祭司团营造司呈报的九座古典大神殿名录，核查卡皮托利乌姆、帕特农、德尔斐、奥林匹亚、塞拉皮斯神庙、以弗所、君堡斑岩柱、提洛与米斯特拉斯的兴建与众神和平进度。"
 oe_romp_dec_restore_temple_guide.desc:0 "翻阅大祭司团营造司呈报的九座古典大神殿名录，核查卡皮托利乌姆、帕特农、德尔斐、奥林匹亚、塞拉皮斯神庙、以弗所、君堡斑岩柱、提洛与米斯特拉斯的兴建与众神和平进度。"
 oe_romp_dec_restore_temple_guide.a:0 "展卷查阅九殿营造录"
 oe_romp_dec_restore_temple_guide_tt:0 "打开#Y 九座古典大神殿总览#!窗口，并可直接转入六柱万神殿神位敕定界面。"
 oe_romp_dec_style_toggle:0 "典仪称谓切换：罗马礼 / 希罗礼"
 oe_romp_dec_style_toggle.title:0 "典仪称谓切换：罗马礼 / 希罗礼"
 oe_romp_dec_style_toggle_desc:0 "在帝国诏书、祭司团文书与仪典称号中自由切换「罗马多神教」与「希罗古典多神教」两种礼制叙事风格。"
 oe_romp_dec_style_toggle.desc:0 "在帝国诏书、祭司团文书与仪典称号中自由切换「罗马多神教」与「希罗古典多神教」两种礼制叙事风格。"
 oe_romp_dec_style_toggle.a:0 "切换帝国典仪称谓风格"
 oe_romp_dec_style_toggle_tt:0 "在#Y 罗马多神教#!与#Y 希罗古典多神教#!典仪称谓间切换（冷却一年）。"
 oe_romp_style_cd_tt:0 "典仪称谓切换不在冷却期内"
 oe_romp_art_sibylline_codex:0 "《重编西比尔神谕秘典》"
 oe_romp_art_sibylline_codex_desc:0 "大祭司团汇集库迈、以弗所与亚历山大港古希腊六步格神谕残篇重编而成的典籍，装帧于镀金象牙匣中，专供战疫大政之际启卷占兆。"
 oe_romp_art_logos_and_dao:0 "《逻各斯与大道会通录》"
 oe_romp_art_logos_and_dao_desc:0 "罗马大祭司团使节与东方儒道鸿儒历时数月对谈辑录的跨文明哲学巨著，以斯多葛逻各斯、众神和平与东方天道礼乐互证会通。"
 oe_romp_art_grand_encyclopedia:0 "《希罗古典与自然大百科》"
 oe_romp_art_grand_encyclopedia_desc:0 "由君士坦丁堡、罗马与雅典三地学园三百位硕学合编的巨帙百科，贯通荷马诗艺、罗马公法、天文格物与近代实验科学。"
 oe_romp_art_symposium_dialogues:0 "《米斯特拉斯新柏拉图会饮录》"
 oe_romp_art_symposium_dialogues_desc:0 "辑录帝国新柏拉图哲学会饮中关于太一、逻各斯与古典城邦德政的辩难手稿，为大祭司团与诸行省学园奉为圭臬。"
 oe_romp.1.title:0 "尤利安的残卷"
 oe_romp.1.desc:0 "宫廷书吏在清点大皇宫深处尘封的紫皮藏卷时，发现了一册抄录于四世纪末的羊皮纸残本——赫然是皇帝尤利安所撰《太阳王颂》与致安条克元老院书信的未删节孤本。卷中不仅详述了无敌太阳统摄宇宙秩序的哲学体系，还附有帝国旧祭司团的礼仪批注。牧首府已闻风而来，要求立即将这份异端遗物付之一炬。"
 oe_romp.1.a:0 "秘藏御阁，命博学士细加研读"
 oe_romp.1.a.tt:0 "保留尤利安残卷，开启罗马古典思想复兴的伏笔，并在未来解锁罗马多神教叙事线。"
 oe_romp.1.b:0 "当众焚毁残卷，以安教会之心"
 oe_romp.1.b.tt:0 "彻底关闭米斯特拉斯古教前奏事件线（仍可通过收复永恒之城决议重启）。"
 oe_romp.2.title:0 "卜列东与《律法汇编》"
 oe_romp.2.desc:0 "哲学家格弥斯托斯·卜列东在米斯特拉斯山城聚徒讲学，其未公开流传的宏著《律法汇编》提出以柏拉图理型论与奥林匹斯—卡皮托利乌姆诸神体系重塑帝国德政。他在上呈御览的奏议中直言：唯有找回罗马立国之初的公民美德与古典神圣秩序，帝国方能摆脱连绵内耗、重掌地中海乾坤。"
 oe_romp.2.a:0 "暗中庇护卜列东学园，准其阐扬古礼"
 oe_romp.2.a.tt:0 "激活#Y 罗马多神教#!与神谕体系，并满足#Y 重光罗马古教#!决议的米斯特拉斯前置条件。"
 oe_romp.2.b:0 "查禁《律法汇编》，遣散米斯特拉斯学社"
 oe_romp.2.b.tt:0 "中止米斯特拉斯古教前奏事件线，博得教士阶层好感。"
 oe_romp.3.title:0 "圣山之怒与牧首诘难"
 oe_romp.3.desc:0 "阿索斯圣山的静修派长老联合君士坦丁堡牧首联名上书，痛斥宫廷纵容米斯特拉斯的新柏拉图异端，指责皇室竟敢私下推演古典祭仪与太阳神颂辞。金角湾两岸的修道院钟声齐鸣，圣索菲亚门前聚满了质问朝廷立场的修士与市民。如今已无退路：究竟是向教会妥协、继续模糊拖延，还是毅然点燃无敌太阳的圣火？"
 oe_romp.3.a:0 "严惩异端，恪守正教祖制"
 oe_romp.3.a.tt:0 "彻底退出罗马多神教前奏事件线，恢复教士信任与国家稳定。"
 oe_romp.3.b:0 "以学术辩难为由敷衍牧首，静待良机"
 oe_romp.3.b.tt:0 "暂不改教，但保留通过#Y 重光罗马古教#!决议随时转信的自由。"
 oe_romp.3.c:0 "点燃无敌太阳祭坛——重光罗马多神教！"
 oe_romp.3.c.tt:0 "立即将帝国与皇室改信#Y 罗马多神教#!，在首都兴起古教复兴思潮并触发大祭司长即位大典。"
 oe_romp.4.title:0 "紫衣大祭司长"
 oe_romp.4.desc:0 "在君士坦丁堡广场巍然耸立的斑岩太阳神柱下，紫袍加身的皇帝正式接过自奥古斯都传续的「最高大祭司长」桂冠与祭仪权杖。元老院、军团代表与来自希腊诸邦的学者齐声颂唱古拉丁与古希腊双语祷辞。罗马大祭司团由此宣告重建，而统御苍穹的#Y 无敌太阳·赫利俄斯#!神位也已向帝国六柱万神殿敞开大门。"
 oe_romp.4.a:0 "效法叙马库斯之宽容：万教共存，众神和平"
 oe_romp.4.a.tt:0 "建立#Y 罗马大祭司团#!并解锁#Y 无敌太阳神#!（可在宗教面板通过#Y 敕定万神殿神位#!入祀ADM柱），以人文宽容奠定复兴基调。"
 oe_romp.4.b:0 "高举奥勒良太阳旗帜：复兴古典帝国威仪"
 oe_romp.4.b.tt:0 "建立#Y 罗马大祭司团#!并解锁#Y 无敌太阳神#!（可在宗教面板通过#Y 敕定万神殿神位#!入祀ADM柱），以正统与古典文化引领复兴。"
 oe_romp.5.title:0 "西比尔神谕重编"
 oe_romp.5.desc:0 "大祭司团奉诏搜罗自库迈、以弗所、亚历山大与君士坦丁堡流传的古希腊六步格神谕残篇，重建了专门掌管国运占兆的十五人祭司团。新编成的《西比尔神谕秘典》装帧于镀金象牙匣中，供奉于帝国神殿深处，待战火、瘟疫或大政抉择之际由大祭司长亲启占问。"
 oe_romp.5.a:0 "将秘典奉入大祭司团圣库"
 oe_romp.5.a.tt:0 "在首都创制珍贵典籍艺术品#Y 《重编西比尔神谕秘典》#!并提升宗教影响力。"
 oe_romp.5.b:0 "将抄本颁行帝国各学园研习"
 oe_romp.5.b.tt:0 "以古典文献研究推动科研进度与文化传统提升。"
 oe_romp.6.title:0 "圣索菲亚的命运"
 oe_romp.6.desc:0 "矗立于君士坦丁堡岬角的圣索菲亚大教堂，千年以来一直是新罗马天穹下最宏伟的穹顶。随着罗马多神教重登国教之位，帝国臣民与海外诸邦的目光全都聚焦于这座圣殿的归属：是将其作为宽容诏书的象征保留给基督徒礼拜，还是仿照罗马万神殿重祝为「神圣智慧—密涅瓦—无敌太阳万神殿」，抑或效法古典包容传统，设为双礼共享的帝国智慧圣堂？"
 oe_romp.6.a:0 "颁布护教敕令：保留为受帝国保护的基督教大教堂"
 oe_romp.6.a.tt:0 "获得永久修正#Y 圣索菲亚护教敕令#!，显著缓解基督教臣民与欧洲邻邦的敌意。"
 oe_romp.6.b:0 "重祝为「神圣智慧—太阳万神殿」"
 oe_romp.6.b.tt:0 "获得永久修正#Y 圣索菲亚万神殿#!，大幅提升宗教影响力与威望，但会震动基督教阶层。"
 oe_romp.6.c:0 "设为双礼共享的「帝国永恒智慧圣堂」"
 oe_romp.6.c.tt:0 "获得永久修正#Y 圣索菲亚双礼圣堂#!，在信仰威望与宗教宽容之间取得稳健平衡。"
 oe_romp.7.title:0 "十字军号角与新叙马库斯敕令"
 oe_romp.7.desc:0 "罗马多神教在新罗马复燃的消息震惊了整个基督教世界。西方教廷与北方大公纷纷发出谴责檄文，号召各邦警惕「异教凯撒」的崛起。面对山雨欲来的外交孤立，大祭司团呈上两份截然不同的诏书草案：其一效法四世纪罗马元老叙马库斯的千古名言「通向伟大奥秘的道路绝非仅此一条」，保障境内外基督教会的礼拜与财产安全；其二则宣示古典神圣秩序之绝对至上，以铁血军团直面四方挑战。"
 oe_romp.7.a:0 "颁布《新叙马库斯宽容敕令》"
 oe_romp.7.a.tt:0 "获得25年修正#Y 新叙马库斯宽容敕令#!，大幅提升异教与异端宽容及外交声望。"
 oe_romp.7.b:0 "颁布《古典独尊宣言》：以鹰旗迎战四方"
 oe_romp.7.b.tt:0 "获得25年修正#Y 古典独尊宣言#!，加速传教归化并提振帝国陆军士气。"
 oe_romp.8.title:0 "重返雅典帕特农"
 oe_romp.8.desc:0 "帝国仪仗沿着阿提卡圣道登上雅典卫城。历经数百年风霜的帕特农神庙大理石列柱在爱琴海阳光下依然熠熠生辉。大祭司团的建筑师与雕塑家齐聚山巅，请求皇帝亲下敕令，清除中世纪附建的杂乱壁垒，按菲狄亚斯的古典比例重修雅典娜·帕特农圣殿，并重开阿提卡哲学学园。"
 oe_romp.8.a:0 "敕令重修帕特农雅典娜圣殿"
 oe_romp.8.a.tt:0 "若雅典尚未建成#Y 帕特农雅典娜圣殿#!，则由国库免除营造费直接开工重修，并提升文化传统与科研进度。"
 oe_romp.8.b:0 "举行卫城献祭，先固祭司团根基"
 oe_romp.8.b.tt:0 "立刻获得威望与宗教影响力，稍后可自行在雅典建造大神殿。"
 oe_romp.9.title:0 "卡皮托利乌姆的鹰旗"
 oe_romp.9.desc:0 "金鹰军旗重新飘扬在台伯河畔的七丘之巅！凯旋行列沿着神圣大道缓缓登上卡皮托利乌姆山，向永恒之城的古老神坛献上白牛与月桂花环。随着旧罗马重归帝国版图，卡皮托利乌姆的完整万神谱系终于齐聚：#Y 天后朱诺·雷吉娜#!、#Y 圣火圣母维斯塔#!、#Y 双面门神雅努斯#!与#Y 复仇战神·奎里努斯#!四尊罗马核心神位全部向帝国六柱万神殿解锁！"
 oe_romp.9.a:0 "重立卡皮托利乌姆三主神圣誓"
 oe_romp.9.a.tt:0 "永久解锁#Y 朱诺#!、#Y 维斯塔#!、#Y 雅努斯#!与#Y 复仇战神·奎里努斯#!四尊神位（可在宗教面板使用#Y 敕定万神殿神位#!入祀；若朱诺与朱庇特、密涅瓦同席并建成卡皮托利乌姆大神庙，将激活三主神共鸣）。"
 oe_romp.9.b:0 "向战神广场军团颁赏凯旋桂冠"
 oe_romp.9.b.tt:0 "同样永久解锁上述四尊罗马核心神位，并额外嘉奖陆军传统与威望。"
 oe_romp.10.title:0 "雅努斯之门"
 oe_romp.10.desc:0 "按照自努马国王与奥古斯都传承下来的罗马古礼，唯有当陆地与海洋四境平宁、帝国无战事之时，方可隆重关闭古罗马广场上的雅努斯神庙青铜双门。今日海宇澄清、烽燧暂息，大祭司长率领元老院与各省使节亲手合拢青铜巨扉，向天下宣告久违的「罗马和平（Pax Romana）」重临人间。"
 oe_romp.10.a:0 "合拢青铜双门，宣告罗马和平"
 oe_romp.10.a.tt:0 "获得15年修正#Y 雅努斯和平之门#!，全面提振全境繁荣、贸易与外交格局。"
 oe_romp.10.b:0 "保持门扉微启，令边防军团常备不懈"
 oe_romp.10.b.tt:0 "不求虚幻安逸，转而嘉奖威望与陆军传统。"
 oe_romp.11.title:0 "灶火重燃：维斯塔贞女团"
 oe_romp.11.desc:0 "在圆形圣殿洁白的大理石柱廊间，由高阶大祭司长亲手以凹面铜镜引燃太阳真火，交予新遴选的维斯塔贞女团昼夜守护。古罗马人深信，只要维斯塔的圣火不熄，罗马的国祚便如星辰般永存。随着圣火重燃，#Y 圣火圣母维斯塔#!的神位与国泰民安之佑也正式确立。"
 oe_romp.11.a:0 "立永恒圣火之誓，护佑万家安宁"
 oe_romp.11.a.tt:0 "确保解锁#Y 圣火圣母维斯塔#!（ADM柱），提升稳定与宗教影响力。"
 oe_romp.11.b:0 "以贞女团礼仪整肃都城风纪"
 oe_romp.11.b.tt:0 "确保解锁#Y 圣火圣母维斯塔#!，并提升正统性与文化传统。"
 oe_romp.12.title:0 "奥林匹亚与德尔斐的回响"
 oe_romp.12.desc:0 "帕耳那索斯山麓的卡斯塔利亚圣泉重新流淌清音，伯罗奔尼撒的奥林匹亚古竞技场也再度迎来了四方使节与诗人。祭司们重修阿波罗圣坛，点亮提洛圣岛的灯塔，将光明、诗乐、预言与理性之神#Y 福玻斯·阿波罗#!正式迎回帝国六柱万神殿的可入祀谱系。"
 oe_romp.12.a:0 "重开德尔斐神谕与缪斯诗会"
 oe_romp.12.a.tt:0 "永久解锁#Y 福玻斯·阿波罗#!（DIP柱），提升文化传统与宗教影响力。"
 oe_romp.12.b:0 "将阿波罗圣域辟为帝国艺术与学术中心"
 oe_romp.12.b.tt:0 "永久解锁#Y 福玻斯·阿波罗#!（DIP柱），推进科研并提升威望。"
 oe_romp.13.title:0 "尼罗河的塞拉皮斯神殿"
 oe_romp.13.desc:0 "亚历山大港法罗斯灯塔的辉光再次映照在帝国舰队的风帆之上。自托勒密与哈德良时代以来，这座地中海学术与海贸枢纽便以「罗马诠释（Interpretatio Romana）」的精神，将埃及的尼罗河丰饶女神伊西斯与智慧冥神塞拉皮斯融于古典万神殿之中。如今大祭司团奏请颁布埃及合祀敕令，迎请#Y 航星圣母伊西斯—塞拉皮斯#!入列万神殿谱系。"
 oe_romp.13.a:0 "颁布埃及合祀敕令，重修塞拉皮斯大神庙"
 oe_romp.13.a.tt:0 "永久解锁合祀神祇#Y 伊西斯—塞拉皮斯#!（DIP柱）；若亚历山大港尚未建成#Y 亚历山大港塞拉皮斯大神庙#!，则免费开工重修。"
 oe_romp.13.b:0 "仅行合祀之礼，将经费倾注亚历山大学术"
 oe_romp.13.b.tt:0 "永久解锁合祀神祇#Y 伊西斯—塞拉皮斯#!（DIP柱），推进科研与文化传统。"
 oe_romp.14.title:0 "安纳托利亚与波斯的密特拉光契"
 oe_romp.14.desc:0 "沿着从安纳托利亚高原直抵伊朗高地的古老军道，帝国铁甲骑兵与东方归附武士在岩窟圣堂中重拾起昔日罗马边防军团最炽热的秘仪兄弟会——光明与契约之神密特拉崇拜。军官们在火炬与星辰壁画下立誓忠贞勇武，请求皇帝正式承认#Y 无敌密特拉（Mithras Invictus）#!为帝国军团的合祀护法神。"
 oe_romp.14.a:0 "敕封无敌密特拉为帝国骑兵护法神"
 oe_romp.14.a.tt:0 "永久解锁合祀神祇#Y 无敌密特拉#!（MIL柱），大幅提升陆军传统与宗教影响力。"
 oe_romp.14.b:0 "将密特拉秘仪纳入大祭司团统一礼制"
 oe_romp.14.b.tt:0 "永久解锁合祀神祇#Y 无敌密特拉#!（MIL柱），提升威望与国内稳定。"
 oe_romp.15.title:0 "佩西努斯的黑石：大母神库柏勒"
 oe_romp.15.desc:0 "公元前二百零四年汉尼拔兵临城下之际，罗马元老院依西比尔神谕从小亚细亚弗里吉亚迎请大母神库柏勒的黑色陨石入驻帕拉蒂尼山，终扭转乾坤。今日帝国疆域再临小亚细亚古圣山，当地祭司团献上载于双狮战车之上的大母神塔冠圣像，祈愿#Y 大母神库柏勒（Cybele Magna Mater）#!重佑帝国坚城永固、五谷丰登。"
 oe_romp.15.a:0 "以古典盛仪迎请大母神入祀万神殿"
 oe_romp.15.a.tt:0 "永久解锁合祀神祇#Y 大母神库柏勒#!（MIL柱），提升国家稳定与宗教影响力。"
 oe_romp.15.b:0 "令大母神祭司团巡行边塞要塞鼓舞守军"
 oe_romp.15.b.tt:0 "永久解锁合祀神祇#Y 大母神库柏勒#!（MIL柱），提升陆军传统与威望。"
 oe_romp.16.title:0 "埃皮达鲁斯与帕加马的圣蛇"
 oe_romp.16.desc:0 "在埃皮达鲁斯松林环绕的古剧场与帕加马的阿斯克勒庇俄斯圣域遗址，医师与祭司们重新挖掘出古老的引水渠、静养回廊与草药典籍。面对席卷欧亚的疫疠威胁，大祭司团提议在帝国诸行省重建阿斯克勒庇俄斯圣蛇疗养院，并将#Y 医神阿斯克勒庇俄斯—许癸厄亚#!正式纳入六柱万神殿的ADM护佑序列。"
 oe_romp.16.a:0 "敕建帝国圣蛇疗养院网络"
 oe_romp.16.a.tt:0 "永久解锁#Y 医神阿斯克勒庇俄斯—许癸厄亚#!（ADM柱），推进医学科研、稳定与宗教影响力。"
 oe_romp.16.b:0 "整理盖伦与希波克拉底医典颁行天下"
 oe_romp.16.b.tt:0 "永久解锁#Y 医神阿斯克勒庇俄斯—许癸厄亚#!（ADM柱），提升文化传统与威望。"
 oe_romp.17.title:0 "犍陀罗与大夏的法轮"
 oe_romp.17.desc:0 "顺着亚历山大大帝与巴克特里亚国王米南德昔日开拓的商路，帝国的斯多葛—新柏拉图学者在印度河与恒河商埠重逢了精研正法与因明的印度哲人。双方回溯《弥兰王问经》的千年雅集，发现罗马「众神和平」的包容智慧与东方正法殊途同归。一场跨越地中海与印度洋的文明对话就此展开。"
 oe_romp.17.a:0 "缔结印希哲思互鉴之约"
 oe_romp.17.a.tt:0 "获得永久修正#Y 印希哲学对话#!，强化异教宽容、科研效率与东方商路影响力。"
 oe_romp.17.b:0 "以希腊化雕塑与商队广传帝国声名"
 oe_romp.17.b.tt:0 "立刻收获威望与文化传统，弘扬地中海—印度洋古典声望。"
 oe_romp.18.title:0 "斯多葛与儒道：天命与逻各斯"
 oe_romp.18.desc:0 "沿着陆海丝绸之路抵达极东的大祭司团学士使节，与东方朝廷的儒家鸿儒与道家高士展开了持续数月的礼乐与哲学对谈。当罗马使者阐释斯多葛学派贯穿宇宙的「逻各斯（Logos）」与祭祀天地百神的「众神和平」时，东方学者欣然呼应以「天道」「天命」与「礼乐教化」，称两大古老帝国虽隔万里，敬天法祖、以理治世之心实乃相通。"
 oe_romp.18.a:0 "合编《逻各斯与大道会通录》，永载史册"
 oe_romp.18.a.tt:0 "获得永久修正#Y 逻各斯与大道会通#!，并在首都创制典籍艺术品#Y 《逻各斯与大道会通录》#!。"
 oe_romp.18.b:0 "互赠礼乐典籍，增进东西方文化声望"
 oe_romp.18.b.tt:0 "收获文化传统与威望，传扬丝路古典交流佳话。"
 oe_romp.19.title:0 "无敌太阳与日心说"
 oe_romp.19.desc:0 "正当欧洲各国神学院因行星运行的新学说而陷入激烈禁书与论战之际，君士坦丁堡、罗马与亚历山大港的天文台却传出了欢呼之声！帝国学者翻开尤利安《太阳王颂》与毕达哥拉斯学派古注，盛赞太阳居于天宇中心、统摄群星的日心宇宙观正是无敌太阳神圣理性的最辉煌印证。在这里，自然哲学与古老信仰从未对立，反而携手步入崭新的科学曙光。"
 oe_romp.19.a:0 "御批刊行《太阳天球论》，拥抱科学曙光"
 oe_romp.19.a.tt:0 "获得25年修正#Y 日心太阳曙光#!，大幅提振科研效率与神谕共鸣。"
 oe_romp.19.b:0 "在各大神殿竖立日晷与浑天仪以彰神恩"
 oe_romp.19.b.tt:0 "收获宗教影响力与威望，将天文成就化为祭司团荣光。"
 oe_romp.20.title:0 "新古典理性主义 vs 圣坛传统派"
 oe_romp.20.desc:0 "进入近代启蒙纪元后，罗马多神教内部浮现出两条波澜壮阔的思想洪流。以诸学园与印刷工坊为阵地的「太阳理性启蒙派」主张将万神殿升华为公民美德、自然理性与宽容宪政的象征；而以大祭司团与秘仪结社为核心的「神圣传统复兴派」则坚持严守古老占兆、神谕祭祀与军团神圣誓约。皇帝的抉择，将定义帝国在新时代的灵魂。"
 oe_romp.20.a:0 "引领太阳理性启蒙：迈向世俗公民万神殿"
 oe_romp.20.a.tt:0 "获得终局永久修正#Y 太阳理性启蒙#!，大幅提升科研速度与国民识字上限。"
 oe_romp.20.b:0 "恪守神圣传统复兴：弘扬秘仪与神谕神威"
 oe_romp.20.b.tt:0 "获得终局永久修正#Y 神圣传统复兴#!，大幅强化神谕神力与帝国军纪。"
 oe_romp.21.title:0 "拉丁—希腊经典大百科"
 oe_romp.21.desc:0 "君士坦丁堡帝国大学、罗马卡皮托利乌姆学园与雅典柏拉图学院联合三百名学者、法学家与博物学家，历时二十载编纂成煌煌巨帙《希罗古典与自然大百科》。全书横跨荷马史诗、罗马法典、农学、水利、天文与近代实验科学，以雕版印刷广布欧亚，成为古典世界与近代启蒙完美交融的丰碑。"
 oe_romp.21.a:0 "御序刊印《古典与自然大百科》"
 oe_romp.21.a.tt:0 "获得永久修正#Y 古典与自然大百科#!，并在首都创制传世典籍#Y 《希罗古典与自然大百科》#!。"
 oe_romp.21.b:0 "将编纂班底转为常设皇家科学院"
 oe_romp.21.b.tt:0 "提升文化传统并推进下一项帝国科技研发。"
 oe_romp.22.title:0 "大革命浪潮下的公民宗教"
 oe_romp.22.desc:0 "革命与宪政的疾风正席卷旧大陆的君主制堡垒。然而在罗马多神教的国土上，元老院、市政议会与「元老院与罗马人民（SPQR）」的古老公民礼制早已深入人心。大祭司团顺势倡议，将万神殿的公共庆典与公民宪章融为一体，以古典共和美德与法治契约疏导社会激流，使帝国在风云激荡的革命时代巍然屹立。"
 oe_romp.22.a:0 "颁布《公民帝国宪章》，以古典法制疏导浪潮"
 oe_romp.22.a.tt:0 "获得25年修正#Y 公民帝国宪章#!，显著稳定国内秩序并提升政治韧性。"
 oe_romp.22.b:0 "重申奥古斯都元首正统，固守帝国威严"
 oe_romp.22.b.tt:0 "提升正统性与威望，以稳健姿态应对革命时代。"
 oe_romp.23.title:0 "万神之城的新世纪大典"
 oe_romp.23.desc:0 "君士坦丁堡与罗马双都并辉，遍布地中海与爱琴海的古典大神殿巍然重立，烟火缭绕的祭坛连成一道跨越千年的金辉长卷。大祭司长宣布召开前所未有的「新世纪大典（Ludi Saeculares）」。白昼时分，歌队在卡皮托利乌姆与斑岩太阳柱下合唱贺拉斯的《世纪之歌》；入夜之后，千百炬火映照着台伯河与博斯普鲁斯海峡，万邦来朝共庆黄金新纪元。"
 oe_romp.23.a:0 "奏响《世纪之歌》，开启帝国黄金新纪元！"
 oe_romp.23.a.tt:0 "获得25年强力修正#Y 新世纪大典黄金时代#!，并收获丰厚威望与文化传统。"
 oe_romp.24.title:0 "罗马永恒：从卜列东到启蒙纪元"
 oe_romp.24.desc:0 "回望五百年风云长卷：从米斯特拉斯山城中孤灯伏案的卜列东、大皇宫深处重见天日的尤利安残卷，到斑岩柱下重燃的太阳圣火、卡皮托利乌姆重振的鹰旗、横贯欧亚的诸神对话，直至科学与公民理性交相辉映的启蒙纪元。罗马多神教不仅未在历史尘埃中消逝，更完成了跨越千年的自我新生。史官提笔铭刻于青铜纪功柱上：众神和平永驻，罗马永恒不朽！"
 oe_romp.24.a:0 "铭刻青铜纪功柱：罗马永恒，众神和平！"
 oe_romp.24.a.tt:0 "获得终局永久帝国遗产修正#Y 罗马永恒遗产#!，礼赞五百年古典复兴伟业。"
 oe_romp_ritual.1.title:0 "西比尔神谕书占卜"
 oe_romp_ritual.1.desc:0 "十五人祭司团依古礼沐浴焚香，开启供奉于大殿秘室的《西比尔神谕书》。泛黄的希腊六步格诗行在烛火中显现出三条指向帝国当下国运的吉兆：一是玛尔斯与密特拉的军团破敌之兆，二是阿斯克勒庇俄斯与维斯塔的涤疫护民之兆，三是雅努斯与朱诺的丰年安邦之兆。请大祭司长裁定颁行哪一卷神谕诏令。"
 oe_romp_ritual.1.a:0 "宣诏战神神谕：励兵秣马，攻城必克"
 oe_romp_ritual.1.a.tt:0 "获得10年修正#Y 西比尔战神神谕#!；若已启用#Y 占兆与西比尔神谕书#!宗教面向，额外获得陆军传统。"
 oe_romp_ritual.1.b:0 "宣诏医神神谕：涤荡疫疠，护佑生民"
 oe_romp_ritual.1.b.tt:0 "获得10年修正#Y 西比尔涤疫神谕#!；若已启用#Y 占兆与西比尔神谕书#!宗教面向，额外提升国家稳定。"
 oe_romp_ritual.1.c:0 "宣诏和平神谕：兴农通商，四境安宁"
 oe_romp_ritual.1.c.tt:0 "获得10年修正#Y 西比尔安邦神谕#!；若已启用#Y 占兆与西比尔神谕书#!宗教面向，额外获得宗教影响力。"
 oe_romp_ritual.2.title:0 "新柏拉图哲学会饮"
 oe_romp_ritual.2.desc:0 "帝国学园的哲学家、天文学家与修辞学者齐聚大理石列柱庭院，举杯论道，效法柏拉图《会饮篇》与米斯特拉斯学社遗风，探讨太一、逻各斯与理想政制。一位才华横溢的哲人毛遂自荐愿入宫廷效力，而诸邦文士也盼望朝廷以丰厚资助推动学术与艺术共荣。"
 oe_romp_ritual.2.a:0 "延揽新锐哲人入廷，资助前沿学术"
 oe_romp_ritual.2.a.tt:0 "延揽一位高素养#Y 哲学家#!艺术人才、推进科研并获得12年#Y 新柏拉图会饮资助#!；若启用#Y 米斯特拉斯新柏拉图学园#!或#Y 太一论#!面向，额外创制古典哲学典籍艺术品。"
 oe_romp_ritual.2.b:0 "将资助普惠各行省学社与文坛"
 oe_romp_ritual.2.b.tt:0 "获得12年#Y 新柏拉图会饮资助#!，并立刻提升文化传统与威望。"
 oe_romp_ritual.3.title:0 "旭日神恩"
 oe_romp_ritual.3.desc:0 "秋分刚过，晴空万里无云，金色的日轮在君士坦丁堡斑岩柱与阿波罗圣殿之上投下罕见的日晕奇观。祭司团与天文士齐声贺兆，称这是入祀万神殿的光明神祇降下的吉瑞，预示今年朝政清明、文教昌盛。"
 oe_romp_ritual.3.a:0 "承沐太阳清辉，推恩法度与学园"
 oe_romp_ritual.3.a.tt:0 "获得正统性、科研进度与宗教影响力。"
 oe_romp_ritual.3.b:0 "举行光明谢恩祭，颂扬帝国威仪"
 oe_romp_ritual.3.b.tt:0 "获得威望与文化传统。"
 oe_romp_ritual.4.title:0 "卡皮托利乌姆吉兆"
 oe_romp_ritual.4.desc:0 "维斯塔圣火在圣坛上燃烧得澄澈无烟，朱诺神庙前的孔雀展屏鸣瑞，雅努斯门廊下往来商旅络绎不绝。元老院与各阶层代表共赴大祭，赞颂帝国在卡皮托利乌姆诸神的庇佑下政通人和、家国康泰。"
 oe_romp_ritual.4.a:0 "颁赏民瘼，固本安邦"
 oe_romp_ritual.4.a.tt:0 "提升国家稳定与宗教影响力。"
 oe_romp_ritual.4.b:0 "铭记于大祭司团编年史，彰显正统"
 oe_romp_ritual.4.b.tt:0 "提升正统性与威望。"
 oe_romp_ritual.5.title:0 "圣蛇瑞兆"
 oe_romp_ritual.5.desc:0 "帝国各地的阿斯克勒庇俄斯疗养院呈报喜讯：今岁泉水清冽、药草丰茂，多座港口的时疫苗头在医师团的隔离与调理下迅速平息。百姓纷纷向医神圣坛献上陶制谢恩牌，祈愿帝国永享康宁长寿。"
 oe_romp_ritual.5.a:0 "嘉奖医神祭司团并推广卫生典章"
 oe_romp_ritual.5.a.tt:0 "提升国家稳定与科研进度。"
 oe_romp_ritual.5.b:0 "举行医神谢恩大典"
 oe_romp_ritual.5.b.tt:0 "提升宗教影响力与文化传统。"
 oe_romp_ritual.6.title:0 "鹰旗与四方合祀神恩"
 oe_romp_ritual.6.desc:0 "从亚历山大港迎风破浪的航星船队，到边疆高唱战歌的铁甲骑兵与城垣守军，入祀帝国六柱万神殿的战神与跨欧亚合祀诸神正以各自的方式护佑疆土。各行省军民同心敬神，罗马诠释的包容与武德再次焕发蓬勃生机。"
 oe_romp_ritual.6.a:0 "检阅边防军团，颁赐神佑徽章"
 oe_romp_ritual.6.a.tt:0 "提升陆军传统与威望。"
 oe_romp_ritual.6.b:0 "举行合祀感恩祭，凝聚合众之心"
 oe_romp_ritual.6.b.tt:0 "提升宗教影响力与国家稳定。"
 oe_romp_ritual.10.title:0 "卡皮托利六柱万神殿敕神"
 oe_romp_ritual.10.desc:0 "帝国神殿的六座大理石神龛严格遵循古老的「六柱万神殿」规制，恒定供奉#Y 行政、外交、军事三柱各两尊（共六尊活跃神祇）#!。随着帝国征伐四方、重光罗马与展开罗马诠释合祀，最多十尊新神将陆续向您解锁。请选择要调整神位的能力神柱，或一键恢复原版六神古位。"
 oe_romp_ritual.10.a:0 "调整行政神柱（ADM）：朱庇特（宙斯）/ 维纳斯（阿佛洛狄忒）/ 无敌太阳·赫利俄斯 / 朱诺（赫拉）/ 维斯塔（赫斯提亚）/ 医神"
 oe_romp_ritual.10.a.tt:0 "进入#Y 行政神柱（ADM）#!神位轮换界面，确保恒为2尊ADM神祇。"
 oe_romp_ritual.10.b:0 "调整外交神柱（DIP）：涅普顿（波塞冬）/ 墨丘利（赫尔墨斯）/ 雅努斯 / 阿波罗 / 伊西斯—塞拉皮斯"
 oe_romp_ritual.10.b.tt:0 "进入#Y 外交神柱（DIP）#!神位轮换界面，确保恒为2尊DIP神祇。"
 oe_romp_ritual.10.c:0 "调整军事神柱（MIL）：玛尔斯（阿瑞斯）/ 密涅瓦（雅典娜）/ 复仇战神·奎里努斯 / 密特拉 / 库柏勒"
 oe_romp_ritual.10.c.tt:0 "进入#Y 军事神柱（MIL）#!神位轮换界面，确保恒为2尊MIL神祇。"
 oe_romp_ritual.10.d:0 "一键恢复原版六柱古神（宙斯、阿佛洛狄忒、波塞冬、赫尔墨斯、阿瑞斯、雅典娜）"
 oe_romp_ritual.10.d.tt:0 "安全卸下所有已入祀的新神并恢复全部6尊初始古神位。"
 oe_romp_ritual.10.e:0 "维持当前万神殿神位不变"
 oe_romp_ritual.10.e.tt:0 "关闭神位敕定窗口，不作任何变更。"
 oe_romp_ritual.11.title:0 "九座古典大神殿重修总览"
 oe_romp_ritual.11.desc:0 "大祭司团营造司谨呈九座可重修古典大神殿定址清单：\n• #Y 罗马（Rome）#!：卡皮托利乌姆朱庇特大神庙（配合入祀天后朱诺（赫拉）+ 保留朱庇特（宙斯）与密涅瓦（雅典娜）触发三主神共鸣）\n• #Y 雅典（Athens）#!：帕特农雅典娜圣殿\n• #Y 萨洛纳/德尔斐（Salona）#!：德尔斐阿波罗神谕圣殿\n• #Y 奥林匹亚（Pontikokastro）#!：奥林匹亚宙斯圣殿\n• #Y 亚历山大港（Alexandria）#!：亚历山大港塞拉皮斯大神庙\n• #Y 以弗所（Ayasuluk）#!：以弗所阿尔忒弥斯大神庙\n• #Y 君士坦丁堡（Constantinople）#!：斑岩太阳神柱圣坛（配合入祀无敌太阳·赫利俄斯触发帝都辉光）\n• #Y 提洛岛（Mykonos）#!：提洛圣岛双子圣域\n• #Y 米斯特拉斯（Mystras）#!：米斯特拉斯新柏拉图圣院\n\n#Y 众神和平自动阶梯#!：直辖并建成 #G 3–4座#! 开启第一阶，#G 5–6座#! 晋升第二阶，#G 7座及以上#! 达成「众神和平重光」终极加持！"
 oe_romp_ritual.11.a:0 "合卷退朝"
 oe_romp_ritual.11.a.tt:0 "返回帝国政务。"
 oe_romp_ritual.11.b:0 "前往六柱万神殿敕定神位"
 oe_romp_ritual.11.b.tt:0 "直接打开#Y 六柱万神殿神位敕定#!界面查看并调整当前入祀神祇。"
 oe_romp_ritual.12.title:0 "行政神柱（ADM）神位敕定"
 oe_romp_ritual.12.desc:0 "行政神柱（ADM）共有两尊神位：#Y 第一席（朱庇特（宙斯）原席）#!与#Y 第二席（维纳斯（阿佛洛狄忒）原席）#!。提示：保留朱庇特（宙斯）在第一席并将天后朱诺（赫拉）请入第二席（同时保持军事柱密涅瓦（雅典娜）在位），建成罗马卡皮托利乌姆大神庙后即可激活#Y 卡皮托利乌姆三主神共鸣#!。仅显示已解锁且尚未入祀的新神。"
 oe_romp_ritual.12.a:0 "第二席入祀：无敌太阳·赫利俄斯"
 oe_romp_ritual.12.a.tt:0 "替换行政第二席当前神祇，请入#Y 无敌太阳·赫利俄斯#!（含5项太阳神谕，配斑岩柱触发帝都辉光）。"
