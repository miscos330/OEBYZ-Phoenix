 oe_romp_ritual.12.f.tt:0 "替换行政第一席当前神祇，请入#Y 无敌太阳·赫利俄斯#!，以便第二席同时供奉另一尊新神。"
 oe_romp_ritual.12.g:0 "第一席入祀：天后朱诺（赫拉）（替代第一席）"
 oe_romp_ritual.12.g.tt:0 "替换行政第一席当前神祇，请入#Y 天后朱诺（赫拉）#!。"
