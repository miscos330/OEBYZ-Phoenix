 oe_romp_ritual.13.desc:0 "外交神柱（DIP）共有两尊神位：#Y 第一席（涅普顿（波塞冬）原席）#!与#Y 第二席（墨丘利（赫尔墨斯）原席）#!。您可将已解锁的双面门神雅努斯、光明与艺术之神阿波罗或合祀神祇伊西斯—塞拉皮斯请入神柱，始终保持外交神柱恒为2尊活跃神祇。"
