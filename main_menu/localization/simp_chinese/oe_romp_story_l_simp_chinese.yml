 oe_romp_ritual.12.b.tt:0 "替换行政第二席当前神祇，请入#Y 天后朱诺（赫拉）#!（保留朱庇特（宙斯）与密涅瓦（雅典娜）即可凑齐卡皮托利乌姆三主神）。"
 oe_romp_ritual.12.c:0 "第二席入祀：圣火维斯塔（灶神赫斯提亚）"
 oe_romp_ritual.12.c.tt:0 "替换行政第二席当前神祇，请入#Y 圣火维斯塔（灶神赫斯提亚）#!（稳定、繁荣与抗疫庇佑）。"
 oe_romp_ritual.12.d:0 "第二席入祀：医神阿斯克勒庇俄斯"
 oe_romp_ritual.12.d.tt:0 "替换行政第二席当前神祇，请入#Y 医神阿斯克勒庇俄斯#!（强力抗疫、黑死御盾与人口增长）。"
