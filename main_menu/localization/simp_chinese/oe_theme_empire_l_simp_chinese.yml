 AUTO_MODIFIER_DESC_oe_theme_cap_latin_auto: "由帝国下辖拉丁军事军区按月汇总提供的统筹加成（封顶6座），提升雇佣兵维护效率与陆军士气。"
 oe_theme_prefecture_dipcap_auto: "近卫大区外交统筹减负"
 AUTO_MODIFIER_NAME_oe_theme_prefecture_dipcap_auto: "近卫大区外交统筹减负"
 AUTO_MODIFIER_DESC_oe_theme_prefecture_dipcap_auto: "每设立一座活跃的古典近卫大区（最多4座），即为帝国提供额外外交容量与百分比外交容量修正，支撑大一统罗马军区体系。"
