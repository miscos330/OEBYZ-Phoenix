 OE_THEME_PREF_1_TITLE: "东方近卫大区"
 oe_theme_found_prefecture_1_action: "一键设立东方近卫大区诸军区"
 oe_theme_found_prefecture_1_action_desc: "在东方近卫大区内所有已达标且空闲的辖区一键设立军区，采用城镇与省会枢纽治所配置（大幅降低耗粮），每座花费 #R 5#! 帝国权威，权威不足时自动停止。"
