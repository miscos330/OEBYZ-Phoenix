 oe_theme_cap_charter_auto: "帝国特许商业城邦总加成（封顶）"
 AUTO_MODIFIER_NAME_oe_theme_cap_charter_auto: "帝国特许商业城邦总加成（封顶）"
 AUTO_MODIFIER_DESC_oe_theme_cap_charter_auto: "由帝国下辖意大利特许商业城邦军区按月汇总提供的统筹加成（封顶8座），提升生产效率、贸易收入与商人影响力。"
 oe_theme_cap_latin_auto: "帝国拉丁军区总加成（封顶）"
