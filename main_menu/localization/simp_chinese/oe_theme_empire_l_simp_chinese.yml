 oe_theme_consolidate_exarchates_action: "管区大军区整编（并镇升督）"
 oe_theme_consolidate_exarchates_action_desc: "将东罗马核心的 37 处中世纪细分小军区（R02-R38）按古典管区一键整编为 10 座核心大军区（E01-E10），合并其兵马、半数国库与城镇治所，将全盛帝国活跃军区数量稳定控制在 38-50 座的黄金区间。"
 oe_theme_exarchate_unlock_tt: "已开启古典近卫大区或拥有至少一组可整编的东罗马军区"
 oe_theme_exarchate_ready_tt: "至少有一组东罗马管区大军区（E01-E10）拥有 2 座以上活跃成员军区可供整编"
 oe_theme_consolidate_exarchates_tt: "召开枢密院整编会议，选择整编全部或指定近卫大区的东罗马大军区（花费 #Y 5#! 帝国权威）。"
 oe_theme_empire.1.t: "近卫大区诸军区敕设告成"
 oe_theme_empire.1.d: "皇室诏书已驰驿颁行近卫大区。本次共新设军区 #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_theme_found_pref_count').GetValue|0]#! 座，首府与城镇枢纽治所、初始驻军及管区隶属均已登记造册。"
 oe_theme_empire.1.a: "传谕诸督恪守疆土"
 oe_theme_empire.2.t: "东罗马管区大军区整编议"
 oe_theme_empire.2.desc: "随着帝国版图跨越欧亚非三洲，早年巴尔干与安纳托利亚的细分军区已显繁冗。枢密院拟按古典管区将相邻东罗马小军区并镇升督，化繁为简为十座核心大军区（当前可整编组数：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_emp_exarchate_ready_count')|0]#! 组），保留所有兵马与枢纽治所并释放大量附庸管理负担。"
 oe_theme_empire.2.a: "全盘整编全部符合条件的东罗马大军区（E01-E10）"
 oe_theme_empire.2.a.tt: "耗费 #R 5#! 帝国权威，将东方与伊利里库姆大区全部达标的细分军区一键合并为对应管区大军区。"
 oe_theme_empire.2.b: "仅整编东方近卫大区诸军区（E01/E04/E06-E10）"
 oe_theme_empire.2.b.tt: "耗费 #R 5#! 帝国权威，仅整编色雷斯、爱琴海与安纳托利亚诸大军区。"
 oe_theme_empire.2.c: "仅整编伊利里库姆近卫大区诸军区（E02/E03/E05）"
 oe_theme_empire.2.c.tt: "耗费 #R 5#! 帝国权威，仅整编马其顿、希腊—摩里亚与默西亚诸大军区。"
 oe_theme_empire.2.d: "暂不整编，保留中世纪细分建制"
 oe_theme_empire.2.d.tt: "不花费帝国权威，不改动现有军区。"
