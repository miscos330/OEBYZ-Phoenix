l_simp_chinese:
 # NEW 2026-11-21 v10.5 Worker 4: Act III Atlantic Hegemony & Act IV Nostos / Imperium Bicephalum (oe_elr_, Slot 74). Generated by gen_elysia_return.py; edit the generator, not this file.
 oe_sit_elysian_nostos: "第四奥德赛·重返圣城"
 oe_sit_elysian_nostos_desc: "在极乐洲新罗马历代积累起远洋铜甲舰队与新大陆国力之后，元老院与皇室正式向大西洋东岸吹响归航的号角。紫旗舰队将跨越亚速尔群岛与赫拉克勒斯之柱，直指魂牵梦萦的女王之城君士坦丁堡与永恒之城罗马。"
 oe_sit_elysian_nostos_triumph: "凯旋归航：双头鹰重临圣城"
 oe_sit_elysian_nostos_triumph_desc: "极乐洲新罗马的东征舰队突破重洋、收复君士坦丁堡，并在圣城城头决定了帝国的最终归宿——无论还都旧京，还是铸就横跨大西洋与地中海的双都罗马帝国，第四奥德赛均已光荣圆梦。"
 oe_sit_elysian_nostos_new_era: "新世纪元：告别旧大陆执念"
 oe_sit_elysian_nostos_new_era_desc: "极乐洲新罗马决定放下对东地中海故土的百年执念，把全部国运倾注于美洲新罗马的永恒基业之中。大西洋两岸从此分途而治，新大陆的紫色帝国迎来独立自主的黄金纪元。"
 oe_elr_map_elysia_tt: "#color_purple 极乐洲新罗马领土#!"
 oe_elr_map_sacred_target_tt: "#color_gold 东征圣城目标（君士坦丁堡 / 罗马）#!"
 oe_elr_map_staging_hub_tt: "#Y 大西洋东征前沿跳板（亚速尔 / 直布罗陀）#!"
 oe_elr_map_old_world_holder_tt: "#R 占据旧大陆圣城的敌对势力#!"
 oe_elr_map_atlantic_rival_tt: "#Y 大西洋殖民竞逐强权#!"
 oe_elr_cb_nostos_reclamation: "圣火归城光复战"
 oe_elr_cb_nostos_reclamation_desc: "极乐洲新罗马向占据君士坦丁堡、罗马、直布罗陀或亚速尔跳板航道的势力正式宣战，誓以新大陆铜甲舰队与希腊火枪兵重夺故土。"
 oe_elr_cb_nostos_target_tt: "须已宣告第四奥德赛重返圣城东征，且目标国家占据君士坦丁堡、罗马、直布罗陀或亚速尔群岛。"
 oe_elr_ref_imperium_bicephalum: "双都罗马帝国体制"
 oe_elr_ref_imperium_bicephalum_desc: "双头鹰终于实现其最深邃的象征：一首望向切萨皮克湾的新君士坦丁堡，一首守护博斯普鲁斯海峡的旧女王之城。双京并设行政辐射核心与远洋快速驿船，将大西洋与地中海铸为同一座罗马内湖。"
 oe_elr_human_only_tt: "仅限玩家操控的极乐洲新罗马执行。"
 oe_elr_nostos_thresholds_tt: "须同时控制切萨皮克湾（或西海金角港）、曼哈顿与罗阿诺克，在美洲拥有至少25处领地、至少15艘重型战舰（或25艘总舰队规模），且年份不早于1520年（1337早航线为1480年）。"
 oe_elr_abandon_ready_tt: "须已达成大西洋霸权宣言、已宣告东征，或年份达到1550年。"
 oe_elr_dec_declare_nostos.title: "宣告第四奥德赛·重返圣城东征"
 oe_elr_dec_declare_nostos.desc: "极乐洲新罗马的港湾已停满铜甲大帆船，卡吕波波利斯的兵工厂铸就了成排的希腊火火枪。此刻正是向大西洋东岸升起紫旗、开启「重返圣城」终结局势的历史关头。"
 oe_elr_dec_declare_nostos.a: "升起紫旗，挥师东渡！"
 oe_elr_dec_declare_nostos_tt: "开启第四幕「第四奥德赛·重返圣城」局势，解锁东征海图视野并赐予对君士坦丁堡、罗马及大西洋跳板持有者的光复宣战理由。"
 oe_elr_dec_abandon_old_world.title: "告别旧世界执念：立极乐洲永恒纪元"
 oe_elr_dec_abandon_old_world.desc: "旧大陆的帝国灰烬已是前尘往事。元老院可以庄严宣告极乐洲新罗马不再执着于横渡重洋反攻东地中海，而是将全部精力投入美洲本土的繁荣、移民与学术黄金时代。"
 oe_elr_dec_abandon_old_world.a: "立足新大陆，铸就永恒极乐洲"
 oe_elr_dec_abandon_old_world_tt: "和平收束重返圣城主线，永久赋予「独立美洲新罗马纪元」修正并大幅提升稳定度、威望与文化传统。"
 oe_elr_dec_telemetry.title: "查阅大西洋争霸与重返圣城读数"
 oe_elr_dec_telemetry.desc: "以只读方式查阅第三幕与第四幕（槽位74）的实时状态：包括重返圣城东征阶段、大瘟疫检疫等级、白银舰队截击次数及终局成就编号。"
 oe_elr_dec_telemetry.a: "打开只读状态面板"
 OE_REGNUM_NOVAE_ELYSIAE: "极乐洲总督王国"
 OE_REGNUM_NOVAE_ELYSIAE_ADJ: "极乐总督"
 STATIC_MODIFIER_NAME_oe_elr_atlantic_shock_mod: "大西洋初会戒备"
 STATIC_MODIFIER_DESC_oe_elr_atlantic_shock_mod: "旧大陆白帆重现西海之后，极乐洲舰队与外交使团全面进入戒备状态，以沉稳姿态回应欧陆列强的惊愕。"
 STATIC_MODIFIER_NAME_oe_elr_tordesillas_defiance_mod: "嗤笑托尔德西里亚斯"
 STATIC_MODIFIER_DESC_oe_elr_tordesillas_defiance_mod: "极乐洲元老院公开否认伊比利亚列强瓜分新大陆的密约，高举罗马法与重舰威仪宣示西海主权。"
 STATIC_MODIFIER_NAME_oe_elr_parallel_30_accord_mod: "北纬三十度划界协定"
 STATIC_MODIFIER_DESC_oe_elr_parallel_30_accord_mod: "极乐洲与伊比利亚各国达成务实航道分界，换取大西洋海上贸易畅通与外交缓和。"
 STATIC_MODIFIER_NAME_oe_elr_corsair_letters_mod: "佛罗里达海峡私掠特许"
 STATIC_MODIFIER_DESC_oe_elr_corsair_letters_mod: "新君堡海军部签发正式私掠委任状，扶持武装快船在加勒比航道持续骚扰敌方珍宝船队。"
 STATIC_MODIFIER_NAME_oe_elr_havana_smuggling_mod: "哈瓦那—新君堡走私航网"
 STATIC_MODIFIER_DESC_oe_elr_havana_smuggling_mod: "绕开伊比利亚关税壁垒的地下银币与烟草海商网络，为极乐洲国库带来源源不断的海上贸易红利。"
 STATIC_MODIFIER_NAME_oe_elr_northern_fleet_mod: "北大西洋渔场与护航霸权"
 STATIC_MODIFIER_DESC_oe_elr_northern_fleet_mod: "以新雅典为基地的北方巡洋舰队牢牢控制哈德逊河口与纽芬兰外海渔场，压制英法荷北翼渗透。"
 STATIC_MODIFIER_NAME_oe_elr_haudenosaunee_fur_pact_mod: "圣劳伦斯—易洛魁皮草专约"
 STATIC_MODIFIER_DESC_oe_elr_haudenosaunee_fur_pact_mod: "极乐洲商队与北方河谷原住民长屋联盟缔结公平互市条约，稳固内陆皮草贸易动脉。"
 STATIC_MODIFIER_NAME_oe_elr_mesoamerican_trade_mod: "跨洲白银与可可航线"
 STATIC_MODIFIER_DESC_oe_elr_mesoamerican_trade_mod: "新君堡与墨西哥谷地及安第斯使节开辟直接商路，让可可、金银与古典工艺品沿美洲海岸自由流通。"
 STATIC_MODIFIER_NAME_oe_elr_mesoamerican_arms_mod: "中美洲秘密火器军援"
 STATIC_MODIFIER_DESC_oe_elr_mesoamerican_arms_mod: "极乐洲向中南美原住民大国暗中输送卡吕波波利斯火绳枪与工匠，以牵制伊比利亚征服者。"
 STATIC_MODIFIER_NAME_oe_elr_quarantine_ports_mod: "帝国海港严密检疫令"
 STATIC_MODIFIER_DESC_oe_elr_quarantine_ports_mod: "君士坦丁堡御医体系在极乐洲全境海港实行四十日隔离停泊制度，以短期关税损失换取极高的大瘟疫抗性。"
 STATIC_MODIFIER_NAME_oe_elr_quarantine_lax_mod: "大瘟疫期开港通商"
 STATIC_MODIFIER_DESC_oe_elr_quarantine_lax_mod: "为保商路畅通而放宽港务检疫，虽维系了关税收入，却令沿海城邦在大瘟疫面前门户洞开。"
 STATIC_MODIFIER_NAME_oe_elr_hesperian_medical_codex_mod: "赫斯珀里亚医学法典"
 STATIC_MODIFIER_DESC_oe_elr_hesperian_medical_codex_mod: "融合拜占庭古医学、港口检疫法规与北美原住民草药智慧的传世医典，永世护佑帝国百姓康健长寿。"
 STATIC_MODIFIER_NAME_oe_elr_atlantic_mastery_mod: "紫帆蔽海：大西洋霸权"
 STATIC_MODIFIER_DESC_oe_elr_atlantic_mastery_mod: "从切萨皮克到新雅典、百慕大与加勒比水道，双头鹰铜甲舰队已无可争议地执掌北大西洋海权。"
 STATIC_MODIFIER_NAME_oe_elr_new_world_eternal_era_mod: "独立美洲新罗马纪元"
 STATIC_MODIFIER_DESC_oe_elr_new_world_eternal_era_mod: "放下旧大陆的千载执念后，极乐洲将全部人力物力倾注于西半球城邦建设、学术革新与跨洋移民吸引。"
 STATIC_MODIFIER_NAME_oe_elr_azores_staging_mod: "赫斯珀里得斯远洋补给线"
 STATIC_MODIFIER_DESC_oe_elr_azores_staging_mod: "依托亚速尔锚地与浮动补给船队，极乐洲东征舰队大幅削减了跨洋行政与航程损耗。"
 STATIC_MODIFIER_NAME_oe_elr_odysseus_homecoming_mod: "奥德修斯归乡之志"
 STATIC_MODIFIER_DESC_oe_elr_odysseus_homecoming_mod: "铜甲舰队驶过直布罗陀那一刻，全军将士心怀跨越世纪的归乡烈焰，海陆士气与攻城斗志空前高涨。"
 STATIC_MODIFIER_NAME_oe_elr_flame_returned_mod: "狄奥多西城墙凯旋光辉"
 STATIC_MODIFIER_DESC_oe_elr_flame_returned_mod: "西海归来的双头鹰重升博斯普鲁斯海峡上空，举国上下沉浸在跨越世纪的光复荣光之中。"
 STATIC_MODIFIER_NAME_oe_elr_eternal_city_reunion_mod: "东西罗马千年合流"
 STATIC_MODIFIER_DESC_oe_elr_eternal_city_reunion_mod: "来自日落之海的罗马人步入台伯河畔的永恒之城，续写了横跨欧亚美三洲的不朽罗马传奇。"
 STATIC_MODIFIER_NAME_oe_elr_return_flame_direct_mod: "圣火归巢：大西洋直辖航道"
 STATIC_MODIFIER_DESC_oe_elr_return_flame_direct_mod: "还都君士坦丁堡后，皇室以常备快船与大西洋舰队维持对极乐洲故土的直接跨洋统辖。"
 STATIC_MODIFIER_NAME_oe_elr_return_flame_viceroy_mod: "极乐洲总督王国共主荣光"
 STATIC_MODIFIER_DESC_oe_elr_return_flame_viceroy_mod: "君士坦丁堡皇冠与美洲极乐洲总督王国结为牢不可破的跨洋共主联盟，兼收东西两陆海贸之利。"
 STATIC_MODIFIER_NAME_oe_elr_imperium_bicephalum_mod: "双洋双京跨海通政"
 STATIC_MODIFIER_DESC_oe_elr_imperium_bicephalum_mod: "新君士坦丁堡与旧君士坦丁堡双京并立，常备大西洋铜甲邮船使深海行政阻隔大幅消弭。"
 STATIC_MODIFIER_NAME_oe_elr_viceroy_elysia_mod: "极乐洲总督王国宪章"
 STATIC_MODIFIER_DESC_oe_elr_viceroy_elysia_mod: "受命镇守大西洋西岸的总督王国承袭新君堡元老院与铜甲舰队传统，忠诚捍卫帝国西翼。"
 STATIC_MODIFIER_NAME_oe_elr_foederati_quarantine_loc_mod: "拜占庭随船检疫隔离营"
 STATIC_MODIFIER_DESC_oe_elr_foederati_quarantine_loc_mod: "御医在此设立净水井、隔离帐与草药施药棚，大幅削减大瘟疫对本地与盟邦人口的毁灭性冲击。"
 STATIC_MODIFIER_NAME_oe_elr_asclepius_quarantine_loc_mod: "阿斯克勒庇俄斯神庙检疫圣域"
 STATIC_MODIFIER_DESC_oe_elr_asclepius_quarantine_loc_mod: "在医神阿斯克勒庇俄斯祭司与拜占庭御医的联合主持下，神庙洁净礼与严密隔离令将大瘟疫杀伤力降至历史最低。"
 STATIC_MODIFIER_NAME_oe_elr_nea_smyrna_base_mod: "新士麦那加勒比海军总站"
 STATIC_MODIFIER_DESC_oe_elr_nea_smyrna_base_mod: "依托哈瓦那天然深水良港修筑的帝国船坞与海防堡垒，牢牢扼守佛罗里达海峡与墨西哥湾出入口。"
 STATIC_MODIFIER_NAME_oe_elr_twin_capital_east_mod: "双都东京：君士坦丁堡行政辐射核心"
 STATIC_MODIFIER_DESC_oe_elr_twin_capital_east_mod: "作为双都罗马帝国的东方共同首都，君士坦丁堡享有完整的本土行政近距辐射源，将帝国控制度自海峡直接播撒至欧亚故省。"
 STATIC_MODIFIER_NAME_oe_elr_twin_capital_west_mod: "双都西京：新君士坦丁堡行政辐射核心"
 STATIC_MODIFIER_DESC_oe_elr_twin_capital_west_mod: "作为双都罗马帝国的西方共同首都，新君士坦丁堡稳坐切萨皮克湾，源源不断地向美洲诸省辐射帝国法度与海商繁荣。"
 oe_elr.1.title: "惊骇的大西洋：旧大陆白帆再现"
 oe_elr.1.desc: "切萨皮克湾外海的瞭望塔燃起三道紫烟——几艘挂着陌生纹章的欧洲卡拉维尔帆船越过海平线驶近岸礁。当欧陆水手们望见城墙上飘扬的紫底金双头鹰旗，并听到港务官以流利希腊语与拉丁语发出盘问时，整支旧大陆探险队陷入了难以置信的震撼：在他们以为荒蛮未开的日落之地，罗马帝国竟早已巍然屹立！"
 oe_elr.1.a: "派遣紫袍使节礼遇旧大陆来客，昭告新罗马存在"
 oe_elr.1.a.tt: "向已存在的欧陆大西洋强权致以外交国书，建立大西洋戒备与外交声望。"
 oe_elr.1.b: "鸣炮示警，令铜甲舰队巡弋海疆立威"
 oe_elr.1.b.tt: "以强硬海军威仪震慑伊比利亚与欧陆探险船，获得海军传统与威望。"
 oe_elr.2.title: "《托尔德西里亚斯条约》的嗤笑"
 oe_elr.2.desc: "来自加勒比海的商船带回一纸令人发笑的抄本：伊比利亚诸王竟在大洋彼岸拿尺子划出一条子午线，宣称整个西半球皆归其独占。极乐洲元老院议事厅内哄堂大笑——早在他们祖辈建国千年之前，罗马法学家便已为四海立法。如今元老院必须表态：是以战舰粉碎这道狂妄的经线，还是借机谈出一份务实的北纬三十度海上分界？"
 oe_elr.2.a: "宣示罗马法早已覆盖赫斯珀里亚，直指加勒比航道！"
 oe_elr.2.a.tt: "公开蔑视瓜分条约，解锁哈瓦那与巴哈马视野，增强重舰战力但激怒西葡诸国。"
 oe_elr.2.b: "提出「北纬三十度划界协定」，以商路换取和平"
 oe_elr.2.b.tt: "与伊比利亚列强缓和外交冲突，换取长期大西洋海贸效率与商人影响力。"
 oe_elr.3.title: "佛罗里达海峡的白银大帆船"
 oe_elr.3.desc: "每年春夏之交，满载新西班牙白银与秘鲁金币的伊比利亚珍宝船队都会借墨西哥湾暖流北上，穿过哈瓦那、巴哈马与百慕大之间的窄道驶回欧洲——而这片海域正处于极乐洲舰队的掌心之中。海军将领呈上截击海图，私掠船长请求委任状，而新君堡大商人们则低声建议暗中打通利润更稳妥的走私商道。"
 oe_elr.3.a: "命切萨皮克铜甲主力舰公海截击白银舰队！"
 oe_elr.3.a.tt: "公海突袭夺取巨额白银国库、威望与海军传统，但将严重激怒西班牙与卡斯蒂利亚。"
 oe_elr.3.b: "签发皇家私掠特许状，以较低外交代价持续袭扰"
 oe_elr.3.b.tt: "扶持武装私掠船队收缴部分白银，并以可控外交摩擦维持长期海盗袭扰能力。"
 oe_elr.3.c: "开设哈瓦那—新君堡地下贸易网，坐收源源商利"
 oe_elr.3.c.tt: "避开正面海战，以隐秘海商网络长期抬升国家贸易收入与海贸效率。"
 oe_elr.4.title: "新士麦那：哈瓦那的归属"
 oe_elr.4.desc: "双头鹰紫旗终于升上哈瓦那深水湾的石灰岩岬角！这座扼守佛罗里达海峡与墨西哥湾门户的天然良港被元老院正式赐名为「新士麦那」，以纪念小亚细亚故土的明珠。周边岛屿上的西博内与卢卡约原住民部族正观望新主人的举措：极乐洲可将此地建成怀柔互市的加勒比海总站，也可将其化为寸步难越的铜甲海军要塞。"
 oe_elr.4.a: "建成加勒比海军总站，并与岛屿原住民缔结互市和约"
 oe_elr.4.a.tt: "在新士麦那永久设立加勒比海军总站，并改善与西博内及卢卡约原住民部族的关系。"
 oe_elr.4.b: "全面修筑佛罗里达海峡要塞与税关，严控往来船只"
 oe_elr.4.b.tt: "在新士麦那永久设立加勒比海军总站，并立即征收海峡过境关税充实国库。"
 oe_elr.5.title: "新雅典保卫战：英荷法北翼竞逐"
 oe_elr.5.desc: "北大西洋冷峻的雾霭中，英格兰、法兰西与低地国家的商船和殖民拓荒团接连现身哈德逊河口外海、新英格兰礁岸与圣劳伦斯湾。他们垂涎新雅典的深水良港、北方皮草与无穷无尽的鳕鱼渔场。新雅典执政官急电新君堡：若不立刻亮明北翼海权底线，外邦商站便会在帝国眼皮底下生根。"
 oe_elr.5.a: "派出北方巡洋舰队封锁渔场，宣示新雅典海权不可侵犯"
 oe_elr.5.a.tt: "获得北方巡洋与海贸加成，向北翼欧陆列强展现强硬立场。"
 oe_elr.5.b: "在新雅典辟出特许外商码头，以关税吸纳欧洲资本"
 oe_elr.5.b.tt: "缓和与英法荷的北翼冲突并收取一笔可观的特许港口税款。"
 oe_elr.6.title: "圣劳伦斯冰河与易洛魁皮草网"
 oe_elr.6.desc: "穿行于北方密林与大湖水道的希腊毛皮商报告称，圣劳伦斯河谷与内陆易洛魁诸部掌握着通往美洲腹地的毛皮大动脉。面对欧洲殖民者自北方的步步逼近，长屋议事会的酋长们愿意与早已在北美扎根的极乐洲新罗马谈判独家皮草互市，以换取铁器、紫布与火药支援。"
 oe_elr.6.a: "斥资厚赠铁器与紫布，缔结北方皮草专卖同盟"
 oe_elr.6.a.tt: "支付赠礼换取长期皮草贸易与外交红利，并提升与易洛魁或北方河谷部族的好感。"
 oe_elr.6.b: "只沿河修筑边疆哨堡，凭武备守护北方商路"
 oe_elr.6.b.tt: "不签长期特惠专约，专注强化陆军传统并征收沿河皮草关税。"
 oe_elr.7.title: "来自特诺奇蒂特兰与库斯科的黄金使团"
 oe_elr.7.desc: "极乐洲派往南方海域的侦察快船满载奇珍归航，同行而来的还有来自墨西哥谷地与遥远安第斯高原的使节。他们对新君堡高耸的石柱、铜甲战舰与火绳枪深感震撼，并渴望结交这支同样警惕伊比利亚铁蹄的大西洋帝国。"
 oe_elr.7.a: "秘密军售卡吕波波利斯火器，助其牵制伊比利亚扩张"
 oe_elr.7.a.tt: "耗资输送火器与工匠，获取战略威慑加成并大幅改善与特诺奇蒂特兰及库斯科掌控者的关系。"
 oe_elr.7.b: "开辟跨洲可可、白银与丝织品直航商道"
 oe_elr.7.b.tt: "建立稳健的南北美洲海上贸易航线，持续提升商队贸易收入与商业影响力。"
 oe_elr.8.title: "旧大陆宗教战争与跨海避难帆船"
 oe_elr.8.desc: "教派分裂的烈火正在旧大陆熊熊燃烧，法兰西、德意志与低地国家的城镇惨遭兵燹。一艘艘满载印刷工、钟表匠、医生与学者的避难帆船冒着风浪驶抵切萨皮克湾与新雅典，恳求在双头鹰庇护下重起炉灶。若极乐洲践行西马库斯大西洋宽容宪章，这股跨海英才潮的规模更将成倍暴涨！"
 oe_elr.8.a: "敞开港门，广纳欧洲各地学者、工匠与流亡商民！"
 oe_elr.8.a.tt: "向新君堡与新雅典引入大批高识字率欧洲避难市民人口并提升文化传统；若走西马库斯宽容路线，迁入人口翻倍！"
 oe_elr.8.b: "仅甄选与国教同源的工匠入境，保持城邦秩序纯一"
 oe_elr.8.b.tt: "引入规模较小但完全同教的首都工匠人口，并稳固国内稳定度。"
 oe_elr.9.title: "大瘟疫阴影：拜占庭随船医师的警告"
 oe_elr.9.desc: "跨洋商船不仅带来了白银与丝绸，也夹带着令美洲大陆闻风丧胆的致命疫疠。曾经历过黑死病洗礼的君士坦丁堡御医世家立刻拉响警报：他们紧急呈上源自中世纪东地中海的《海港四十日检疫条例》，恳请皇室立刻封控外来船只、隔离病患，哪怕短期内牺牲大西洋商税也在所不惜。"
 oe_elr.9.a: "立即颁布帝国海港严密检疫令，以商税换取万民生机"
 oe_elr.9.a.tt: "短期降低贸易收入与海贸效率，但大幅提升全国大瘟疫与疫病抵抗力。"
 oe_elr.9.b: "不可断绝大西洋商路，维持开港通商"
 oe_elr.9.b.tt: "保全大西洋关税收入，但令国内在大瘟疫冲击下更加脆弱。"
 oe_elr.10.title: "拯救盟邦还是坐视崩塌？"
 oe_elr.10.desc: "大瘟疫的阴霾迅速蔓延至切萨皮克湾与波托马克河畔。原住民村落与新近归附的罗马盟邦接连告急，城外搭起了绵延数里的求助火堆。御医总管禀报：若立刻拨款向美洲全境领地分发草药、凿建净水井并设立隔离营，可挽救半数以上人口；而在多神教万神殿中，若医神阿斯克勒庇俄斯正端坐神柱之上，神庙祭司团更愿倾尽圣域医馆免费施救！"
 oe_elr.10.a: "颁布「阿斯克勒庇俄斯神庙检疫圣令」——免除费用，全力施救！"
 oe_elr.10.a.tt: "【罗马多神教·医神在位专属彩蛋】免费在全部美洲领地建立神庙检疫圣域，使大瘟疫本地致死冲击直降70%，并大增稳定度、威望与原住民盟邦好感！"
 oe_elr.10.b: "拨款派遣御医与草药隔离营，全力挽救盟邦与边民"
 oe_elr.10.b.tt: "耗资在全部美洲领地建立拜占庭检疫隔离营（本地大瘟疫冲击-50%），并显著提升南塞蒙德与波瓦坦盟邦好感。"
 oe_elr.10.c: "收缩防线，仅全力守护希腊核心都城"
 oe_elr.10.c.tt: "保全国库开支，仅在首都设立隔离营，但将损伤国内稳定度。"
 oe_elr.11.title: "赫斯珀里亚医学法典"
 oe_elr.11.desc: "漫长的大瘟疫终于在西半球退潮。劫后余生的新君堡太医院将拜占庭宫廷医书、海港隔离法度与波瓦坦、南塞蒙德巫医传授的新大陆草药谱系合编成巨著《赫斯珀里亚医学法典》，以希腊语与拉丁语双语印行全境。这部凝聚两洲智慧的医典将成为帝国世代安康的护身符。"
 oe_elr.11.a: "颁行《赫斯珀里亚医学法典》，永世庇佑帝国苍生"
 oe_elr.11.a.tt: "永久赋予全境疫病抵抗+10%、国民预期寿命+2年与大瘟疫抗性加成，并提升文化传统与威望。"
 oe_elr.12.title: "紫帆蔽海：大西洋霸权宣言"
 oe_elr.12.desc: "切萨皮克湾的铜甲船坞日夜轰鸣，新雅典、圣尼古拉角与加勒比良港连成一道铜墙铁壁般的紫帆弧线。大西洋的风浪不再是阻隔流亡者的天堑，而是任由新罗马舰队驰骋的坦途。在元老院庄严宣告「大西洋海权归属罗马」之夜，一个萦绕数代人心头的终极问题浮上台面：如今我们已有横渡重洋的实力，是否该扬帆东归，夺回女王之城？"
 oe_elr.12.a: "大西洋已成罗马内湖——开启关于东归故土的全国大辩论！"
 oe_elr.12.a.tt: "永久赋予「紫帆蔽海：大西洋霸权」修正，并解锁宣告东征或立独立美洲纪元的终局抉择。"
 oe_elr.13.title: "第四奥德赛·终章：重返女王之城的誓言"
 oe_elr.13.desc: "当年乘着方舟逃离博斯普鲁斯烽火的先祖早已长眠在切萨皮克的松林之下，但他们临终前反复吟诵的誓言仍镌刻在元老院青铜门楣上：「有朝一日，圣火必将重归君士坦丁堡。」如今百万子民、连绵城邦与成群铜甲巨舰皆已就绪。您可即刻吹响「重返圣城」的东征号角，也可坦然合上旧大陆的书页，在极乐洲开辟彻底独立的新罗马纪元。"
 oe_elr.13.a: "以先祖之名起誓——启动「重返圣城」跨洋东征！"
 oe_elr.13.a.tt: "启动第四幕局势「第四奥德赛·重返圣城」，解锁大西洋至爱琴海海图视野，并赐予对君士坦丁堡、罗马、直布罗陀与亚速尔持有者的光复宣战理由。"
 oe_elr.13.b: "旧世界已成过往——在美洲铸就独立的永恒新罗马纪元"
 oe_elr.13.b.tt: "放弃反攻东地中海，和平收束局势并永久获得「独立美洲新罗马纪元」发展与科研大修正。"
 oe_elr.14.title: "重返赫斯珀里得斯：亚速尔与直布罗陀前沿母港"
 oe_elr.14.desc: "跨越三千海里发动两栖东征，绝非孤军突进可以成事。极乐洲海军部将目光投向大西洋中段的亚速尔群岛与地中海咽喉直布罗陀——当年西渡先祖曾在此汲水补给，如今它们将成为铜甲舰队东征的跳板母港。只要稳固大西洋中继补给线，舰队便可源源不断地将新大陆的火药与精兵投送至东地中海。"
 oe_elr.14.a: "重启第一幕留下的亚速尔航标，直接接管无主良港！"
 oe_elr.14.a.tt: "依托第一幕留下的亚速尔航标直接接管无主的安格拉或蓬塔德尔加达并加为核心，同时获得远洋补给修正与光复宣战理由。"
 oe_elr.14.b: "亮明宣战理由，做好武力夺取亚速尔与直布罗陀的准备"
 oe_elr.14.b.tt: "赋予「赫斯珀里得斯远洋补给线」修正，刷新对亚速尔、直布罗陀、罗马与君士坦丁堡的光复宣战理由。"
 oe_elr.14.c: "斥资编组远洋浮动补给船队，确保跨洋舰队后勤无虞"
 oe_elr.14.c.tt: "支付军费组建常备远洋后勤舰队，换取更持久的跨洋补给修正与海军传统。"
 oe_elr.15.title: "铜甲舰队过海峡：地中海震动"
 oe_elr.15.desc: "当一列列铜底闪耀、高悬紫底双头鹰战旗的新大陆巨舰穿出直布罗陀晨雾、驶入蔚蓝地中海时，整个旧世界为之震动！沿岸港口的钟声连绵不绝，意大利商馆急忙飞鸽传书，而此刻盘踞君士坦丁堡的旧敌更是寝食难安——数个世纪前被逐出爱琴海的罗马亡灵，竟化作横跨大洋的钢铁舰队杀回故土！"
 oe_elr.15.a: "向女王之城全速进军——让博斯普鲁斯听见新罗马的炮声！"
 oe_elr.15.a.tt: "推进重返圣城至第2阶段，全军获得「奥德修斯归乡之志」海陆士气与攻城大加成，并刷新光复宣战理由。"
 oe_elr.16.title: "圣火归城！双头鹰重升狄奥多西城墙"
 oe_elr.16.desc: "硝烟散尽，朝阳金光洒在斑驳巍峨的狄奥多西三重城墙与金角湾碧波之上。随着最后一座城门洞开，身披紫袍的极乐洲希腊火火枪兵列队踏过梅塞大道，把从切萨皮克远渡重洋携归的帝国双头鹰战旗高高升上城头。白发苍苍的老人跪倒在石阶上泣不成声——流亡西海的漫长奥德赛，终于迎来了光复女王之城的伟大黎明！"
 oe_elr.16.a: "于圣索菲亚穹顶之下重燃普世正教圣火大礼！"
 oe_elr.16.a.tt: "推进重返圣城至第3阶段，举办西方正教回归圣索菲亚大典，获得凯旋修正与巨额威望、正统及稳定度。"
 oe_elr.16.b: "以无敌太阳神与赫斯珀里亚万神殿之名举行罗马凯旋大祭！"
 oe_elr.16.b.tt: "推进重返圣城至第3阶段，于博斯普鲁斯海峡举行古典罗马多神教凯旋祭典，确保占卜系统完全解锁并获巨额威望与文化传统。"
 oe_elr.16.c: "颁布普世和平凯旋大赦，宣告东西两陆万民同庆！"
 oe_elr.16.c.tt: "推进重返圣城至第3阶段，举行跨越教派与大洋的帝国公民凯旋大典，获得凯旋修正、稳定度与文化传统。"
 oe_elr.17.title: "永恒之城的回响：西海罗马人入城"
 oe_elr.17.desc: "紫旗越过亚平宁山脉，来自大西洋彼岸的罗马军团沿着古圣道步入罗马城。在残存的凯旋门与卡皮托利山丘之间，说着融合了新大陆口音的希腊语与古典拉丁语的士兵们仰望千年石碑——从台伯河到博斯普鲁斯，再到切萨皮克湾，最终重返罗马，这支帝国完成了人类历史上最不可思议的文明大回环。"
 oe_elr.17.a: "于卡皮托利山巅铭刻三洲罗马合流碑！"
 oe_elr.17.a.tt: "永久赋予「东西罗马千年合流」修正与巨额威望、文化传统；若信奉罗马多神教，同步全量解锁旧大陆十柱神祇联动！"
 oe_elr.18.title: "帝国的归宿：归巢旧都，还是双洋双京？"
 oe_elr.18.desc: "君士坦丁堡的宫殿已重新铺上紫毯，而大西洋彼岸的新君士坦丁堡同样灯火辉煌、繁荣鼎盛。整个帝国正屏息等待您的最终圣裁：是让圣火归巢，将皇座迁回博斯普鲁斯海峡（直辖美洲故土，或册封忠心耿耿的「极乐洲总督王国」代守西海）；还是打破古今成例，缔造一座横跨大西洋与地中海、新旧双京并立的「双都罗马帝国（Imperium Bicephalum）」？"
 oe_elr.18.a: "结局A·直辖归巢：还都君士坦丁堡，跨洋直辖极乐洲故土"
 oe_elr.18.a.tt: "迁都回君士坦丁堡并恢复东罗马正统国号，永久获得「圣火归巢：大西洋直辖航道」跨洋控制减免修正，推进至终局第4阶段。"
 oe_elr.18.b: "结局A·共主归巢：还都君士坦丁堡，册封「极乐洲总督王国」"
 oe_elr.18.b.tt: "先迁都君士坦丁堡并恢复东罗马正统国号，随即将美洲领土一键组建为忠诚的「极乐洲总督王国」自治领属国，并赋予双方永久共主加成。"
 oe_elr.18.c: "结局B·双都帝国：新旧双京并立，铸就「双都罗马帝国」！"
 oe_elr.18.c.tt: "更名为「双都罗马帝国」，颁行专属「双都罗马帝国体制」政府改革，大幅削减大洋及深海近距惩罚，并在君士坦丁堡与新君士坦丁堡同时永久挂载100点底层行政近距辐射源！"
 oe_elr.19.title: "双头鹰的真义：一首望新世，一首望故土"
 oe_elr.19.desc: "从黑海与爱琴海的绝境启航，横越马尾藻海飓风，在切萨皮克松林间重燃火种，再驾着铜甲巨舰劈波东归、重升狄奥多西城头——历代史官无不感叹，帕莱奥略王朝的双头鹰徽记从未像今天这样拥有如此震撼人心的真义：一首凝视旧大陆的千年故土，一首眺望新大陆的无垠未来。第四奥德赛的史诗已圆满收官，而新的罗马千年才刚刚开始。"
 oe_elr.19.a: "将第四奥德赛的荣光永镌帝国编年史！"
 oe_elr.19.a.tt: "圆满结束「第四奥德赛·重返圣城」局势，刻录终局里程碑并获得威望、稳定度与文化传统。"
 oe_elr.20.title: "【审计】大西洋争霸与重返圣城读数"
 oe_elr.20.desc: "#T 第四奥德赛·第三/四幕只读状态读数（槽位74 oe_elr_）#!\n· 重返圣城阶段（0未启动 / 1跳板 / 2入地中海 / 3光复君堡 / 4终局完成）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_nostos_stage').GetValue|0]#!\n· 大瘟疫检疫状态（0未检疫 / 1海港检疫 / 2盟邦隔离营 / 3阿斯克勒庇俄斯神庙圣域）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_quarantine_state').GetValue|0]#!\n· 加勒比白银舰队截击次数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_silver_intercepts').GetValue|0]#!\n· 终极结局编号（0未达 / 1圣火归巢 / 2双都罗马帝国）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_grand_ending_achieved').GetValue|0]#!"
