l_simp_chinese:
 oe_col3.1.t: "特许商站年度大红利"
 oe_col3.1.d: "随着季风商船满载香料、丝绸、瓷器与白银陆续归港，我国海外特许商社的年度清算账册迎来了丰沛盈余。拱廊货栈间堆满待售的远洋奇货，董事局向朝廷请示：是立即将大宗分红划归国库，还是将部分股息留存于海外港口，用以添造募民商船并扩建商站泊位？"
 oe_col3.1.a: "提取年度大红利入库，并嘉奖商社海贸功勋"
 oe_col3.1.b: "留存资本扩建海外商站，同步增派三年拓殖补给船"
 oe_col3.2.t: "香料银船与大帆船护航"
 oe_col3.2.d: "满载热带香料、蔗糖与秘鲁白银的巨型大帆船已在远洋集结港整装待发，但沿途海峡暗礁密布，更有虎视眈眈的掠夺舰与敌对武装商船游弋。海军提督建言派出重炮主力舰排成护航战列直护归港，而商团代表则主张由武装商船自行结伴突围以节省军费。"
 oe_col3.2.a: "遣主力舰列阵护航，保银船满载凯旋并震慑洋面"
 oe_col3.2.b: "由商团武装自保突围，省下军费并让利市民阶层"
 oe_col3.3.t: "破浪抗衡卡塔兹通行证"
 oe_col3.3.d: "里斯本王室在印度洋诸海峡推行严苛的卡塔兹海上通行证制度，强令一切未纳重税、未挂葡印许可印信的商船一律截留充公。我国远洋商社与船东联名上书：面对横跨阿拉伯海与马拉巴尔海岸的封锁舰队，帝国是应当武装重炮护航强闯航道，还是暂且纳费通关以保当前商路不断？"
 oe_col3.3.a: "重炮护航强闯封锁，宣告公海航行不容独占"
 oe_col3.3.b: "暂行纳费通关，以务实妥协换取商路安稳"
 oe_col3.4.t: "远洋商路私掠清剿战"
 oe_col3.4.d: "近来公海之上私掠许可证泛滥成灾，一批批挂着合法委任状的劫掠快船频频在海峡咽喉与海外补给港外伏击我国商队，海事保险费率应声暴涨。若不迅速派遣快速护航舰队清剿巢穴，特许商社的远洋航运恐将陷入停摆。"
 oe_col3.4.a: "发令联合护航清剿，重拳肃清远洋私掠船队"
 oe_col3.4.b: "加征海事保费转嫁商团，由国库坐收战时险费"
 oe_col3.5.t: "远洋印花税与无代表之争"
 oe_col3.5.d: "步入十八世纪，跨洋舰队与边疆驻军开销日巨，本土财政大臣提议向日渐繁盛的海外行省与殖民领开征统一的印花税与港口特别关税。然而海外各港的议事会与大商行齐声哗然，声称「无代表不纳税」，要求朝廷在征税前必须给予海外臣民正式的财政审议权。"
 oe_col3.5.a: "严令强征海外重税与印花税，绝不纵容藩港抗命"
 oe_col3.5.b: "暂缓苛税并允诺审慎协商，以宽仁维系跨洋忠忱"
 oe_col3.6.t: "海港倾茶与商团总抵制"
 oe_col3.6.d: "夜色与火把映照的海外商港爆发了剧烈骚动！愤怒的殖民地市民与水手登上停泊泊位的商船，将成箱贴有皇家关税封条的茶叶与香料统统抛入海湾，随后各大港口商行联合宣布全面抵制本土输入商品。海关署告急文书雪片般飞抵京师。"
 oe_col3.6.a: "下令封港戒严并追捕主谋，以铁腕捍卫海关权威"
 oe_col3.6.b: "废除苛酷特别关税，拨款疏解商港抵制风潮"
 oe_col3.7.t: "海外议会席位请愿书"
 oe_col3.7.d: "来自美洲、印度洋与南洋诸大省的温和派代表联袂递交《帝国议会请愿书》。他们宣称自己仍愿效忠同一顶皇冠，但恳请朝廷打破本土与海外的壁垒，在帝国最高议事厅为海外总督辖区与殖民领设立正式代表席位，共商关税、海防与法典。"
 oe_col3.7.a: "开启帝国联邦宪章谈判，为海外代表预留议会席位"
 oe_col3.7.a.tt: "可随后在政府决策中颁行「授予海外议会代表席位」，正式步入帝国联邦融合路线。"
 oe_col3.7.b: "冷酷驳回请愿书，重申海外领地唯有服从本土诏令"
 oe_col3.8.t: "帝国联邦宪章颁行大典"
 oe_col3.8.d: "在阳光倾泻的宏伟穹顶议事大厅内，身披礼袍的本土元老与远渡重洋而来的各洲代表围坐圆桌，共同在镌刻金印的《帝国联邦宪章》上落款。从此本土与海外不再是主仆压榨，而合铸为休戚与共的跨洋帝国共同体；倘若欧陆正值终局大战或万国协调会纵横捭阖，海外诸邦更将倾力驰援国库与皇威！"
 oe_col3.8.a: "万邦同冠，恭颂《帝国联邦宪章》永世长存"
 oe_col3.9.t: "总督戒严与港务驻军令"
 oe_col3.9.d: "随着海外税潮与商港抵制愈演愈烈，各地民兵开始在市镇广场操练，总督府门前日夜聚集抗议人群。强硬派驻军统领请求立即调拨重兵接管港务并颁布戒严令，而温和派幕僚则警告：刺刀或许能压住一时街垒，却会把中间派彻底推向决裂。"
 oe_col3.9.a: "增调重兵驻港戒严，以强力维稳控住关键海外重镇"
 oe_col3.9.b: "撤换强硬武官、改派温和文官总督缓和局势"
 oe_col3.10.t: "海外自治邦联大会"
 oe_col3.10.d: "未经京师御准，来自数座海外行省与殖民领的民选代表竟自行召开了「海外自治邦联大会」。大会宣言历数本土高压关税与戒严失政，公开要求承认全面内部自治权与海关自主权；海港船坞内已有大批水手整装待发，局势一触即发。"
 oe_col3.10.a: "宣告大会非法叛逆，绝不向海外分裂势力低头"
 oe_col3.10.b: "紧急抛出自治妥协案，撤除重税以引导和平和解"
 oe_col3.10.b.tt: "可随后在政府决策中颁行「海外自治宪章」，以自治领商贸和解软着陆。"
 oe_col3.11.t: "海外自由邦独立宣言"
 oe_col3.11.d: "晨光初破，海外重镇议事厅石阶前人山人海，代表们在欢呼声中高举新草拟的《自由邦独立宣言》，远方海港桅杆上升起色彩鲜明的新邦旗帜，与码头上严阵以待的皇家驻军遥遥对峙。长期高压镇压终于招致跨洋独立浪潮总爆发——朝廷此刻必须抉择：是以铁血硬扛全面危机，还是忍痛承认高度自治以熄灭内战烽烟？"
 oe_col3.11.a: "誓死维护帝国完整，正面迎击跨洋独立风暴"
 oe_col3.11.b: "忍痛承认海外高度自治宪章，即刻止血熄灭叛火"
 oe_col3.12.t: "跨洋商业联邦和解条约"
 oe_col3.12.d: "历经数十年海洋博弈与宪政磨合，本土朝廷与海外诸自治领终于在平等互惠的谈判桌前签下了《跨洋商业联邦和解条约》。旧日的关税抵制与戒严积怨一笔勾销，取而代之的是贯穿大西洋、印度洋与南洋的优惠航运同盟、互认商法与长久和平。"
 oe_col3.12.a: "签署商业联邦和解条约，开启跨洋共荣新纪元"
 oe_col3.90.t: "殖民 3.0 · 实时只读审计台账"
