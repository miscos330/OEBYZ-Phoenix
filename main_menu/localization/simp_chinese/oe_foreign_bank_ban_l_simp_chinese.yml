l_simp_chinese:
 oe_pillars_ban_foreign_banks: "外国银行禁入"
 oe_pillars_ban_foreign_banks_desc: "帝国的信用与汇兑须置于本国法度之下。撤销外国银行在帝国境内的营业权，将各地银行业务交由帝国及其附属国的银行承办。\n\n完成#Y 规范银行业#!后解锁，消耗#R 10权威#!。立即移除东罗马及其各级附属国境内由外部国家拥有的银行建筑，此后这些外国银行不能再于上述领土新建银行。东罗马及其附属国拥有的银行不受本行动影响。\n\n此行动只能执行一次。"
 OE_FOREIGN_BANK_BAN_NOT_DONE: "尚未实行外国银行禁入。"
 OE_FOREIGN_BANK_BAN_AUTHORITY: "帝国权威至少为#Y 10#!。"
 OE_FOREIGN_BANK_BAN_EFFECT: "移除东罗马及其各级附属国境内由外部国家拥有的银行建筑，并禁止这些外国银行在上述领土新建银行；保留东罗马及其附属国拥有的银行。"
