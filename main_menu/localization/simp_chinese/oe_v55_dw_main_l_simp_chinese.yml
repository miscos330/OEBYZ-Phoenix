 setting_oe_v55_dw_main_rule_single_tile_desc: "动态战役仅转换当前占领的单一地块，攻陷地区首府不再直接夺取整省。"
 setting_oe_v55_dw_main_rule_off: "关闭（仅常规和约割地）"
 setting_oe_v55_dw_main_rule_off_desc: "关闭1337动态战役与讨伐战争中的战时即时夺地机制，改由常规和约结算领土。"
 STATIC_MODIFIER_NAME_oe_v55_dw_main_mod_defender_rally: "州郡死守动员"
 STATIC_MODIFIER_DESC_oe_v55_dw_main_mod_defender_rally: "紧急动员地方义勇并加固余存防线，提高守备效率与士气，但暂时削弱地方赋税收入。"
 STATIC_MODIFIER_NAME_oe_v55_dw_main_mod_relentless_push: "乘胜追击军令"
 STATIC_MODIFIER_DESC_oe_v55_dw_main_mod_relentless_push: "拒绝敌方提前请降并保持高强度围城推进，提升攻城能力与士气，同时加重军费与宫廷开支。"
 oe_v55_dw_main_cap_opt_a_tt: "立即收编[SCOPE.sCountry('oe_v55_dw_main_cap_enemy').GetName]首都所在大区的全部敌方地块及我方与附庸当前占领的全部敌地，并即刻停战结案。"
 oe_v55_dw_main_cap_opt_b_tt: "即刻停战并迫使[SCOPE.sCountry('oe_v55_dw_main_cap_enemy').GetName]称臣纳贡成为附庸（若无法收为附庸，则改征#Y +350金币#!与#G +15威望#!战败赔款）。"
 oe_v55_dw_main.1.title: "地区首府失守！"
 oe_v55_dw_main.1.desc: "敌军在讨伐攻势中攻陷了我方一座地区首府，地方守备土崩瓦解，整片地区内的我方领土随之直接落入敌手。朝廷必须即刻重整防务以挽狂澜。"
 oe_v55_dw_main.1.a: "征发地方义勇，固守腹地州府"
 oe_v55_dw_main.1.b: "节缩府库开支，收拢残余野战兵团"
 oe_v55_dw_main.2.title: "敌国乞降：全线决定性受降"
 oe_v55_dw_main.2.desc: "在我军决定性讨伐攻势的打击下，[SCOPE.sCountry('oe_v55_dw_main_cap_enemy').GetName]防线彻底崩溃，使节已持白旗前来乞降。陛下可选择即刻收编其崩溃的核心战区并直接止战，或迫其纳降称臣立为藩属，亦可拒绝请降并按常规和约继续作战。"
 oe_v55_dw_main.2.a: "接受全线受降，立即止战收地"
 oe_v55_dw_main.2.b: "纳降称臣，立为藩属"
 oe_v55_dw_main.2.c: "拒绝受降，按常规和约继续作战"
