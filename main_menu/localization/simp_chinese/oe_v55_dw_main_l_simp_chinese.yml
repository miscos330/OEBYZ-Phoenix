 setting_oe_v55_dw_main_rule_province_capital_desc: "在1337剧本的天朝讨伐、罗马光复、霸权远征及重大历史动荡战争中，攻陷AI敌方地区首府即刻将该地区全部敌方地块直接转为我方持有；玩家作为防守方受保护，被AI攻陷地区首府时仅失去该首府单地块，不会被整省瞬间吞并。"
