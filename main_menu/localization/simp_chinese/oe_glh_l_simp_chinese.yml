 oe_glh.1.t: "萨莱的处决"
 oe_glh.1.d0: "#F 1327年特维尔起义后，特维尔大公亚历山大流亡普斯科夫。伊凡·卡利塔奉汗命征讨，却没有攻城；生于君士坦丁堡的都主教费奥格诺斯特应伊凡之请，绝罚了亚历山大和整个普斯科夫。亚历山大后来获汗赦免，再赴萨莱；1339年秋，亚历山大与儿子费奥多尔一同在萨莱被处死。#!"
 oe_glh.1.d1a: "\n\n如今，莫斯科的[SCOPE.sCharacter('oe_glh_mos_r').GetName]在金帐汗国的汗廷里地位更稳了。都主教府就设在莫斯科，都主教派人来到君士坦丁堡，想知道皇帝和牧首的意思。"
 oe_glh.1.d1b: "\n\n如今，莫斯科在金帐汗国的汗廷里地位更稳了。都主教府就设在莫斯科，都主教派人来到君士坦丁堡，想知道皇帝和牧首的意思。"
 oe_glh.1.a: "支持都主教在莫斯科的路线"
 oe_glh.1.a.tt: "莫斯科对我们的好感#G +15#!（#Y 10#!年）\n威望#G +5#!\n帝国在罗斯的立场偏向莫斯科（罗斯倾向#Y +1#!）"
 oe_glh.1.b: "为殉难的亲王举哀"
 oe_glh.1.b.tt: "特维尔和普斯科夫对我们的好感#G +20#!（#Y 10#!年）\n金帐汗国对我们的好感#R −10#!（#Y 5#!年）\n帝国在罗斯的立场偏向特维尔（罗斯倾向#Y −1#!）"
 oe_glh.1.c: "不过问北方之事"
 oe_glh.1.c.tt: "金帐汗国对我们的好感#G +10#!（#Y 5#!年）"
 oe_glh.2.t: "遣使萨莱"
 oe_glh.2.d0: "#F 二十年来，鞑靼骑兵几次越过多瑙河，深入色雷斯，1337年又来过一次。据旅行家伊本·白图泰说，可汗月即别的一位妻子是皇帝的女儿，后来回到君士坦丁堡，再也没有回去。#!"
 oe_glh.2.d1: "\n\n金帐汗国的可汗年事已高。储君迪尼别镇守东方，可汗的妻子泰都拉却更偏爱另一个儿子札尼别。帝国要派使团去萨莱，求可汗约束骑兵；礼物送给谁，要先想好。"
 oe_glh.2.a: "结交储君迪尼别"
 oe_glh.2.a.tt: "金币#R −50#!\n金帐汗国对我们的好感#G +20#!（#Y 10#!年）\n押宝：汗位更替之后见分晓。押中，金帐汗国对我们的好感#G +30#!（#Y 20#!年），并获得[ShowModifier('oe_glh_sarai_friend')]（#Y 20#!年）；押错，好感#R −15#!（#Y 10#!年）。两种结果都会取代这份礼物换来的好感。"
 oe_glh.2.b: "结交泰都拉和札尼别"
 oe_glh.2.b.tt: "金币#R −50#!\n金帐汗国对我们的好感#G +20#!（#Y 10#!年）\n押宝：汗位更替之后见分晓。押中，金帐汗国对我们的好感#G +30#!（#Y 20#!年），并获得[ShowModifier('oe_glh_sarai_friend')]（#Y 20#!年）；押错，好感#R −15#!（#Y 10#!年）。两种结果都会取代这份礼物换来的好感。"
 oe_glh.2.c: "加固阿卡狄奥波利斯"
 oe_glh.2.c.tt: "金币#R −40#!\n阿卡狄奥波利斯（吕莱布尔加兹）获得[ShowModifier('oe_glh_arkadiopolis')]（#Y 25#!年）：防御#G +25%#!，本地叛乱度#G −10%#!；那里不在帝国手中时，改加在首都\n不押宝"
 oe_glh.2.d: "只递一封国书"
 oe_glh.2.d.tt: "金帐汗国对我们的好感#G +10#!（#Y 5#!年）\n不押宝"
 oe_glh.3.t: "塔纳的血案"
 oe_glh.3.d0: "#F 1343年秋，一个威尼斯贵族在塔纳杀了可汗的官员。札尼别驱逐了意大利人，大军围住卡法；威尼斯和热那亚联手禁运。#!"
 oe_glh.3.d1: "\n\n如今，黑海北岸的粮船停了，京城的粮价一天比一天高。"
 oe_glh.3.d2a: "\n\n萨莱记得帝国当年押对了人，对帝国另眼相看。"
 oe_glh.3.d2b: "\n\n萨莱记得帝国当年押错了人，对帝国颇为冷淡。"
 oe_glh.3.d2c: "\n\n帝国在萨莱没有特别的交情。"
 oe_glh.3.a: "改从安纳托利亚和特拉比松买粮"
 oe_glh.3.a.tt: "金币#R −60#!\n特拉比松（如果存在）对我们的好感#G +10#!（#Y 5#!年）"
 oe_glh.3.b: "与意大利人一同禁运"
 oe_glh.3.b.tt: "热那亚和威尼斯对我们的好感#G +15#!（#Y 10#!年）\n金帐汗国对我们的好感#R −15#!（#Y 10#!年）\n获得[ShowModifier('oe_glh_grain_dear')]（#Y 3#!年）：每月粮食#R −5%#!"
 oe_glh.3.c: "帝国商船照常北上"
 oe_glh.3.c.tt: "金币#G +40#!\n金帐汗国对我们的好感#G +15#!（#Y 10#!年）\n热那亚和威尼斯对我们的好感#R −15#!（#Y 10#!年）"
 oe_glh.4.t: "札尼别之死"
 oe_glh.4.d0: "#F 1356年至1357年冬，札尼别攻取大不里士，回师途中病倒而死，死因众说不一。相传这一年都主教阿列克谢曾应召去萨莱，为泰都拉治好了眼疾。新汗别儿迪别一即位，就杀了十几个近亲。#!"
 oe_glh.4.d1a: "\n\n札尼别当年是除掉迪尼别才坐上汗位的，如今金帐汗国的汗位又在血泊中易手。"
 oe_glh.4.d1b: "\n\n札尼别当年是顺顺当当继承的汗位，如今金帐汗国的汗位却在血泊中易手。"
 oe_glh.4.d1c: "\n\n如今，金帐汗国的汗位在血泊中易手。"
 oe_glh.4.d2a: "\n\n萨莱记得帝国当年押对了人，对帝国另眼相看。"
 oe_glh.4.d2b: "\n\n萨莱记得帝国当年押错了人，对帝国颇为冷淡。"
 oe_glh.4.d2c: "\n\n帝国在萨莱没有特别的交情。"
 oe_glh.4.d3: "\n\n帝国要不要给新汗送礼？"
 oe_glh.4.a: "遣使贺新汗"
 oe_glh.4.a.tt: "金币#R −40#!\n金帐汗国对我们的好感#G +20#!（#Y 10#!年）\n若有[ShowModifier('oe_glh_sarai_friend')]，重新计时为#Y 10#!年"
 oe_glh.4.b: "托都主教转达帝国的问候"
 oe_glh.4.b.tt: "金币#R −10#!\n金帐汗国对我们的好感#G +10#!（#Y 5#!年）\n莫斯科对我们的好感#G +10#!（#Y 5#!年）"
 oe_glh.4.c: "不再往萨莱送礼"
 oe_glh.4.c.tt: "失去[ShowModifier('oe_glh_sarai_friend')]（如果有）"
 oe_glh.5.t: "大乱"
 oe_glh.5.d0: "#F 1359年别儿迪别死去，四天后忽尔帕即位，此后二十年换了二十多位可汗。萨莱和克里米亚各立其主，大异密马麦扶立傀儡；立陶宛在蓝水河（1362或1363年）取了基辅，热那亚人在1365年拿下索尔代亚。#!"
 oe_glh.5.d1a: "\n\n如今，金帐汗国陷入内战，黑海北岸的城市各自寻找靠山。拔都一系的可汗已经绝嗣；帝国若曾是[ShowModifier('oe_glh_sarai_friend')]，这份交情也到此为止。帝国的黑海征伐正在进行，草原上的混乱正是机会。"
 oe_glh.5.d1b: "\n\n如今，金帐汗国陷入内战，黑海北岸的城市各自寻找靠山。拔都一系的可汗已经绝嗣；帝国若曾是[ShowModifier('oe_glh_sarai_friend')]，这份交情也到此为止。"
 oe_glh.5.a: "与北岸订粮约"
 oe_glh.5.a.tt: "金币#R −50#!\n获得[ShowModifier('oe_glh_north_grain')]（#Y 15#!年）：每月粮食#G +5%#!，贸易收入#G +3%#!\n狄奥多罗（如果存在）对我们的好感#G +15#!（#Y 10#!年）"
 oe_glh.5.b: "趁乱北顾"
 oe_glh.5.b.tt: "黑海征伐的进度加成#G +10#!\n金帐汗国对我们的好感#R −20#!（#Y 10#!年）"
 oe_glh.5.c: "静观草原"
 oe_glh.5.c.tt: "没有其他效果。"
 oe_glh.6.t: "顿河之战"
 oe_glh.6.d0: "#F 1380年9月8日，莫斯科大公德米特里在顿河上游的库利科沃原野击败马麦，马麦扶立的可汗战死。修士阵前单挑、热那亚步兵为马麦作战，多是后世的传说。#!"
 oe_glh.6.d1a: "\n\n如今，[SCOPE.sCharacter('oe_glh_mos_r').GetName]的捷报经卡法和佩拉传到君士坦丁堡，牧首在等皇帝的意思。莫斯科和立陶宛都在争全罗斯的都主教。"
 oe_glh.6.d1b: "\n\n如今，莫斯科的捷报经卡法和佩拉传到君士坦丁堡，牧首在等皇帝的意思。莫斯科和立陶宛都在争全罗斯的都主教。"
 oe_glh.6.a: "由牧首致贺莫斯科大公"
 oe_glh.6.a.tt: "莫斯科对我们的好感#G +25#!（#Y 20#!年）\n金帐汗国对我们的好感#R −15#!（#Y 10#!年）\n威望#G +10#!\n帝国在罗斯的立场偏向莫斯科（罗斯倾向#Y +1#!）"
 oe_glh.6.b: "不偏不倚"
 oe_glh.6.b.tt: "金帐汗国对我们的好感#G +10#!（#Y 5#!年）"
 oe_glh.6.c: "看重立陶宛和基辅的都主教"
 oe_glh.6.c.tt: "立陶宛对我们的好感#G +15#!（#Y 10#!年）\n帝国在罗斯的立场偏向立陶宛（罗斯倾向#Y −1#!）"
 oe_glh.7.t: "脱脱迷失"
 oe_glh.7.d0: "#F 投奔帖木儿的脱脱迷失取了萨莱（1378或1380年），在卡尔卡河收降了马麦的部众。马麦逃到克里米亚，被杀于索尔哈特附近（一说死在卡法）；卡法的热那亚人与新汗订约，换得索尔代亚一带的村社。#!"
 oe_glh.7.d1a: "\n\n1382年8月，脱脱迷失兵临莫斯科，骗开城门，把城烧成了白地。"
 oe_glh.7.d1b: "\n\n莫斯科这一次没有遭到新汗的报复。"
 oe_glh.7.d2a: "\n\n据说新汗是帖木儿一手扶起来的，两人眼下还是盟友。"
 oe_glh.7.d2b: "\n\n新汗与帖木儿的关系，眼下还看不清。"
 oe_glh.7.d3: "\n\n如今，金帐汗国又有了一位说一不二的可汗。北方的商路能不能重开，要看帝国怎样对待这位新汗。"
 oe_glh.7.a: "遣使承认新汗，重开北方商路"
 oe_glh.7.a.tt: "金币#R −60#!\n金帐汗国对我们的好感#G +25#!（#Y 20#!年）\n获得[ShowModifier('oe_glh_north_trade')]（#Y 15#!年）：贸易收入#G +5%#!，关税收入#G +5%#!"
 oe_glh.7.b: "慰问莫斯科和都主教"
 oe_glh.7.b.tt: "莫斯科对我们的好感#G +15#!（#Y 10#!年）\n威望#G +5#!\n帝国在罗斯的立场偏向莫斯科（罗斯倾向#Y +1#!）"
 oe_glh.7.c: "不作表示"
 oe_glh.7.c.tt: "没有其他效果。"
 oe_glh.8.t: "塔纳的灰烬"
 oe_glh.8.d0: "#F 脱脱迷失在1391年和1395年两次大败之后，帖木儿的军队洗劫了塔纳、阿斯特拉罕和萨莱。#!"
 oe_glh.8.d1: "\n\n如今，北方的商路断了；帝国若有[ShowModifier('oe_glh_north_trade')]，也随之失去。"
 oe_glh.8.a: "转向特拉比松和大不里士的商路"
 oe_glh.8.a.tt: "金币#R −30#!\n特拉比松（如果存在）对我们的好感#G +15#!（#Y 10#!年）\n获得[ShowModifier('oe_glh_east_route')]（#Y 10#!年）：贸易收入#G +3%#!"
 oe_glh.8.b: "倚重卡法的热那亚人"
 oe_glh.8.b.tt: "热那亚对我们的好感#G +15#!（#Y 10#!年）"
 oe_glh.8.c: "无可奈何"
 oe_glh.8.c.tt: "没有其他效果。"
