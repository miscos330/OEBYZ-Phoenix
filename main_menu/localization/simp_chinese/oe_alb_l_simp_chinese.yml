 oe_alb.1.t: "萨夫拉的消息"
 oe_alb.1.desc_dv: "#F 1385年，托皮亚家请来奥斯曼人对付泽塔的巴尔沙二世；两军在萨夫拉相遇，泽塔军大败，巴尔沙战死。此后阿尔巴尼亚的诸侯大多向苏丹称臣。帝国那时自己也在向苏丹纳贡，无力过问。#!\n\n如今，西边的山地换了靠山：诸侯的使者在苏丹的营帐与亚得里亚海岸的港口之间奔走，也有人来到了君士坦丁堡。托皮亚家已经收回了[GetLocationByKey('durres').GetName]。皇帝自己也是苏丹的纳贡者，宫里有人劝：不要多管。"
 oe_alb.1.desc_d: "#F 1385年，托皮亚家请来奥斯曼人对付泽塔的巴尔沙二世；两军在萨夫拉相遇，泽塔军大败，巴尔沙战死。此后阿尔巴尼亚的诸侯大多向苏丹称臣。帝国那时自己也在向苏丹纳贡，无力过问。#!\n\n如今，西边的山地换了靠山：诸侯的使者在苏丹的营帐与亚得里亚海岸的港口之间奔走，也有人来到了君士坦丁堡。托皮亚家已经收回了[GetLocationByKey('durres').GetName]。"
 oe_alb.1.desc_v: "#F 1385年，托皮亚家请来奥斯曼人对付泽塔的巴尔沙二世；两军在萨夫拉相遇，泽塔军大败，巴尔沙战死。此后阿尔巴尼亚的诸侯大多向苏丹称臣。帝国那时自己也在向苏丹纳贡，无力过问。#!\n\n如今，西边的山地换了靠山：诸侯的使者在苏丹的营帐与亚得里亚海岸的港口之间奔走，也有人来到了君士坦丁堡。皇帝自己也是苏丹的纳贡者，宫里有人劝：不要多管。"
 oe_alb.1.desc_x: "#F 1385年，托皮亚家请来奥斯曼人对付泽塔的巴尔沙二世；两军在萨夫拉相遇，泽塔军大败，巴尔沙战死。此后阿尔巴尼亚的诸侯大多向苏丹称臣。帝国那时自己也在向苏丹纳贡，无力过问。#!\n\n如今，西边的山地换了靠山：诸侯的使者在苏丹的营帐与亚得里亚海岸的港口之间奔走，也有人来到了君士坦丁堡。"
 oe_alb.1.a: "遣使安抚诸侯"
 oe_alb.1.a.tt: "花费#R 半个月#!的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m0_5')|0]#!金币）\n阿尔巴尼亚诸侯（由AI掌握、不在帝国一方的）对帝国好感#G +25#!，持续#Y 15#!年\n奥斯曼对帝国好感#R −15#!，持续#Y 10#!年"
 oe_alb.1.b: "向苏丹道贺"
 oe_alb.1.b.tt: "奥斯曼对帝国好感#G +20#!，持续#Y 10#!年\n若帝国正向苏丹纳贡：苏丹的耐心#G +5#!\n阿尔巴尼亚诸侯（由AI掌握、不在帝国一方的）对帝国好感#R −10#!，持续#Y 10#!年"
 oe_alb.1.c: "置之不理"
 oe_alb.1.c.tt: "此事不再过问。"
 oe_alb.2.t: "都拉斯求售"
 oe_alb.2.desc_x: "#F 萨夫拉之后，托皮亚家重新握有都拉斯，可城外就是苏丹的骑兵。威尼斯人早就想要这座亚得里亚海口的港城。史实中，帝国此时无力出价。#!\n\n如今，[GetLocationByKey('durres').GetName]的主人#Y [GetLocationByKey('durres').GetOwner.GetName]#!派人来：威尼斯人出了价，可在答应之前，愿意先问问罗马人。买下这座城要#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m6')|0]#!金币，约合六个月的收入。"
 oe_alb.2.a: "买下都拉斯"
 oe_alb.2.a.tt: "花费#R 6#!个月的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m6')|0]#!金币）\n钱归[GetLocationByKey('durres').GetName]的主人；[GetLocationByKey('durres').GetName]在和平中归帝国（城仍在主人手里、没有被围时；否则不花钱）\n威尼斯对帝国好感#R −30#!，持续#Y 10#!年\n威尼斯的商业特权已到第二级以上时：威尼斯对帝国好感再#R −20#!\n威尼斯人不会再来买这座城"
 oe_alb.2.b: "让威尼斯人拿去"
 oe_alb.2.b.tt: "威尼斯对帝国好感#G +20#!，持续#Y 10#!年\n威尼斯人随后就会接手这座城"
 oe_alb.2.c: "劝都拉斯守住"
 oe_alb.2.c.tt: "花费#R 1#!个月的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#!金币）\n[GetLocationByKey('durres').GetName]的主人对帝国好感#G +20#!，持续#Y 10#!年\n威尼斯人的买卖要等到十年以后，成算也减半"
 oe_alb.3.t: "阿卡迪亚的头人"
 oe_alb.3.desc_x: "#F 1394至1395年，据载约有一万阿尔巴尼亚人来到科林斯地峡，求摩里亚的专制公准许定居；专制公让这些人住进阿卡迪亚，以服兵役换土地。#!\n\n如今，当年来的人在阿卡迪亚的山里立了村。头人们求一纸文书：给地、免税，这些人就出骑兵。"
 oe_alb.3.a: "授地换兵"
 oe_alb.3.a.tt: "阿卡迪亚安置阿尔巴尼亚人的那几处地方（仍在帝国一方手里的）得到[ShowModifier('oe_alb_stratiotai')]，持续#Y 30#!年\n摩里亚的军区（若有）忠诚#G +5#!"
 oe_alb.3.b: "按月付饷"
 oe_alb.3.b.tt: "此后#Y 10#!年，每年一月花费#R 1#!个月的收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#!金币）\n那几处地方不加修正"
 oe_alb.3.c: "不许"
 oe_alb.3.c.tt: "阿卡迪亚安置阿尔巴尼亚人的那几处地方（仍在帝国一方手里的）得到[ShowModifier('oe_alb_highland_unrest')]，持续#Y 10#!年"
 oe_alb.4.t: "克鲁亚的旗帜"
 oe_alb.4.desc_x: "#F 1443年冬，曾在苏丹帐下任德巴尔桑贾克贝伊的卡斯特里奥蒂家格尔吉在尼什阵前离开奥斯曼大军，据说凭一封假造的苏丹书信取得克鲁亚，从此人称斯坎德培。史实中，帝国此时已无力过问西方的战事。#!\n\n如今，[GetLocationByKey('kruje').GetName]之主的使者来到君士坦丁堡，向皇帝通报阿尔巴尼亚山地的举旗起事。"
 oe_alb.4.a: "送礼结好"
 oe_alb.4.a.tt: "花费#R 1#!个月的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#!金币）\n[GetLocationByKey('kruje').GetName]之主对帝国好感#G +40#!，持续#Y 15#!年\n奥斯曼对帝国好感#R −20#!，持续#Y 10#!年\n与[GetLocationByKey('kruje').GetName]结下交情（日后围城求援与求衔时会想起帝国）"
 oe_alb.4.b: "劝克鲁亚加入十字军"
 oe_alb.4.b.tt: "[GetLocationByKey('kruje').GetName]之主对帝国好感#G +20#!，持续#Y 10#!年\n若瓦尔纳十字军交战：十字军成算#G +5%#!"
 oe_alb.4.c: "不过问"
 oe_alb.4.c.tt: "奥斯曼对帝国好感#G +10#!，持续#Y 10#!年"
 oe_alb.5.t: "克鲁亚被围"
 oe_alb.5.desc_x: "#F 1450年，苏丹穆拉德二世亲率大军围攻克鲁亚。城中粮饷告急，靠着亚得里亚海岸的商船勉强接济。史实中，帝国自顾不暇，无力驰援。#!\n\n如今，[GetLocationByKey('kruje').GetName]被围的消息顺着商路传到君士坦丁堡，守军求援的书信送进了宫里。"
 oe_alb.5.a: "从海路送粮送钱"
 oe_alb.5.a.tt: "花费#R 2#!个月的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m2')|0]#!金币）\n[GetLocationByKey('kruje').GetName]之主对帝国好感#G +25#!，持续#Y 15#!年\n奥斯曼对帝国好感#R −20#!，持续#Y 10#!年\n[GetLocationByKey('kruje').GetName]守住本次围城的成算#G +15%#!"
 oe_alb.5.b: "只送书信与祝祷"
 oe_alb.5.b.tt: "帝国威望#G +5#!\n[GetLocationByKey('kruje').GetName]守住本次围城的成算#G +5%#!"
 oe_alb.5.c: "不管"
 oe_alb.5.c.tt: "此事不再过问。"
 oe_alb.6.t: "斯坎德培求衔"
 oe_alb.6.desc_x: "史实中，斯坎德培在1451年前后求的是教宗与那不勒斯国王的封号与资助；君士坦丁堡那时已难顾及西方。如今帝国犹在，又与[GetLocationByKey('kruje').GetName]素有交情，[GetLocationByKey('kruje').GetName]的使者前来叩阙，恳请皇帝赐予一纸罗马朝廷的[oe_tu_dignity|e]，以壮阿尔巴尼亚诸侯的声势。"
 oe_alb.6.a: "授予专制公"
 oe_alb.6.a.tt: "经专制公外交授予[GetLocationByKey('kruje').GetName]之主专制公[oe_tu_dignity|e]（不建附属、不给宣战理由）\n[GetLocationByKey('kruje').GetName]之主对帝国好感#G +30#!，持续#Y 15#!年"
 oe_alb.6.b: "授予首席尊者"
 oe_alb.6.b.tt: "经专制公外交授予[GetLocationByKey('kruje').GetName]之主首席尊者[oe_tu_dignity|e]（不建附属、不给宣战理由）\n[GetLocationByKey('kruje').GetName]之主对帝国好感#G +20#!，持续#Y 15#!年"
 oe_alb.6.c: "婉拒"
 oe_alb.6.c.tt: "婉拒求衔，无所更改。"
 oe_alb.7.t: "山里来的人"
 oe_alb.7.desc_x: "#F 斯坎德培身后、克鲁亚战事吃紧之际，据说大批阿尔巴尼亚人带着家口与教士渡海去了意大利南部，也有人投奔威尼斯人在希腊的据点。#!\n\n如今，几百户阿尔巴尼亚山民赶着牲口、跟着教士来到帝国边上，求一块安身之地。"
 oe_alb.7.a: "安置在帝国的地上"
 oe_alb.7.a.tt: "花费#R 1#!个月的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#!金币）\n在阿尔巴尼亚、北希腊或摩里亚帝国直辖且人口最少的一处安置阿尔巴尼亚移民（调用殖民线安置效果）"
 oe_alb.7.b: "送往意大利"
 oe_alb.7.b.tt: "威尼斯与那不勒斯（若存在）对帝国好感#G +15#!，持续#Y 10#!年"
 oe_alb.7.c: "不收"
 oe_alb.7.c.tt: "不予收留。"
 oe_alb.8.t: "最后的求援"
 oe_alb.8.desc_x: "帝国既已中兴，西边的山城也听到了君士坦丁堡的声势。如今，[GetLocationByKey('kruje').GetName]的守将派人翻山越岭而来：奥斯曼大军步步逼近，城中弹尽粮绝，恳请罗马人伸出援手。"
 oe_alb.8.a: "出兵出钱"
 oe_alb.8.a.tt: "花费#R 3#!个月的贸易与税收收入（约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m3')|0]#!金币）\n消耗#R 3#!千兵员（相当一个军区的一次补员；不开战）\n[GetLocationByKey('kruje').GetName]陷落的进程推迟十年\n[GetLocationByKey('kruje').GetName]的主人对帝国好感#G +50#!，持续#Y 15#!年\n奥斯曼对帝国好感#R −30#!，持续#Y 10#!年"
 oe_alb.8.b: "劝守军来投帝国"
 oe_alb.8.b.tt: "[GetLocationByKey('kruje').GetName]在和平中归帝国，原主人的君主入帝国朝廷为廷臣（不建国、不留附属）\n奥斯曼对帝国好感#R −40#!，持续#Y 10#!年"
 oe_alb.8.c: "爱莫能助"
 oe_alb.8.c.tt: "此事不再过问。"
 oe_alb.91.t: "都拉斯的归属"
 oe_alb.91.desc_v: "消息传来：威尼斯人接管了[GetLocationByKey('durres').GetName]，原来的主人领了一笔年金。"
 oe_alb.91.desc_h: "[GetLocationByKey('durres').GetName]的主人守住了城，威尼斯人的船空手而回。"
 oe_alb.91.desc_x: "[GetLocationByKey('durres').GetName]的事另有了结局：城没有照原先说的那样交给威尼斯。"
 oe_alb.91.a: "知道了"
 oe_alb.92.t: "克鲁亚的战报"
 oe_alb.92.desc_h1: "捷报传来：[GetLocationByKey('kruje').GetName]顶住了奥斯曼大军的围攻（本次守城成算约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr1p')|0]#!%），苏丹只得撤围而去。"
 oe_alb.92.desc_f1: "坏消息传来：[GetLocationByKey('kruje').GetName]没能顶住这次围攻（本次守城成算约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr1p')|0]#!%），山城已落入奥斯曼手里。"
 oe_alb.92.desc_h2: "捷报再传：[GetLocationByKey('kruje').GetName]又一次击退了苏丹的围攻（本次守城成算约#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr2p')|0]#!%），山地防线仍然稳固。"
 oe_alb.92.desc_f2: "坏消息传来：[GetLocationByKey('kruje').GetName]在新的围攻下终告失守（本次守城成算约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr2p')|0]#!%），奥斯曼旗帜升上了山城。"
 oe_alb.92.desc_x: "有关[GetLocationByKey('kruje').GetName]战事的消息送到了君士坦丁堡。"
 oe_alb.92.a: "知道了"
