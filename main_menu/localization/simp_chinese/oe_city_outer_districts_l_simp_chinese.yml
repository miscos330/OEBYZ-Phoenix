l_simp_chinese:
 OE_CITY_REQUIRE_500K: "君士坦丁堡人口超过500K"
 OE_CITY_REQUIRE_RUM: "已开启罗姆文化认同运动"
 oe_byz_constantinople_constantine_suburb: "君士坦丁外城区"
 oe_byz_constantinople_constantine_suburb_desc: "城墙外的道路两旁，工棚、住宅与货场逐渐连成新的街区。帝国划定街巷、修整水沟，为涌入都城的劳工与家眷安置居所。\n\n扩建条件：#Y $OE_CITY_REQUIRE_500K$#!。通常最多扩建#Y 2次#!；拥有“越过狄墙”特权时上限增至#Y 4次#!。每次花费#Y 2000金币#!，基础工期#Y 1000天#!。\n\n每级雇佣#Y 1000名劳工#!。"
 oe_city_constantine_suburb_maintenance: "君士坦丁外城区维护"
 oe_city_constantine_suburb_orders: "君士坦丁外城区已使用扩建次数"
 oe_byz_constantinople_blachernae_suburb: "布拉赫内外城区"
 oe_byz_constantinople_blachernae_suburb_desc: "宫墙与陆墙之间，新的宅舍和营房沿道路展开。守军可以在驻地附近安置家人，工匠与商贩也随之在布拉赫内城外扎根。\n\n扩建条件：#Y $OE_CITY_REQUIRE_500K$#!。通常最多扩建#Y 2次#!；拥有“越过狄墙”特权时上限增至#Y 4次#!。每次花费#Y 2000金币#!，基础工期#Y 1000天#!。\n\n每级雇佣#Y 1000名劳工#!。"
 oe_city_blachernae_suburb_maintenance: "布拉赫内外城区维护"
 oe_city_blachernae_suburb_orders: "布拉赫内外城区已使用扩建次数"
 oe_byz_constantinople_janissary_kitchen: "耶尼切里食堂"
 oe_byz_constantinople_janissary_kitchen_desc: "军营的铜锅旁，炊事兵按名册分配口粮，将谷物、肉干与盐藏分门储放。共同的饭食维系军中的秩序，妥善的储备则使粮秣免于耗散。\n\n扩建条件：#Y $OE_CITY_REQUIRE_RUM$#!。最多扩建#Y 2次#!，每次花费#Y 500金币#!，基础工期#Y 365天#!。"
 oe_city_janissary_kitchen_maintenance: "耶尼切里食堂维护"
 oe_city_janissary_kitchen_orders: "耶尼切里食堂已使用扩建次数"
 oe_city_catalog_v9: "君士坦丁堡城区建筑目录（第九版）"
 oe_pillars_upgrade_metropolis: "升级为大都市"
 oe_pillars_upgrade_metropolis_desc: "选择东罗马直接拥有、人口至少400K的城市，花费10000金币，立即将其升级为大都市。"
 oe_pillars_upgrade_metropolis_choose: "选择人口至少400K的城市"
 oe_pillars_upgrade_metropolis_none: "没有符合条件的城市：须由东罗马直接拥有、地点等级为城市、人口至少400K。"
 oe_rights_metropolitan_planning: "大都会规划"
 oe_rights_metropolitan_planning_desc: "凤凰涅槃之后，帝国将测量街坊、整修水路与划定工坊用地合为一体，使新兴大都会有序扩展。\n\n仅东罗马可用；地点须为大都市，且不能是君士坦丁堡。建筑等级上限+50，加工效率+2.5%。"
 oe_rights_beyond_the_walls: "越过狄墙"
 oe_rights_beyond_the_walls_desc: "让街巷越过狄奥多西城墙，令都城的活力延伸至道路与田野。广阔的新居所吸引移民，分散的街区却也削弱了旧有防线。\n\n仅君士坦丁堡可用。本地要塞防御-100%，建筑等级上限+100，移民吸引力+0.1。拥有此特权时，君士坦丁外城区与布拉赫内外城区各可额外扩建两次，累计各四次。"
 oe_metropolis_infrastructure: "大都市基础设施"
 oe_metropolis_infrastructure_desc: "整修街道、排水沟与公共通道，为人口稠密的大都市容纳更多作坊和宅舍。\n\n东罗马专属，仅可在大都市建造。无基础等级上限：每满3点发展度增加一级，每满100K人口再增加一级，两项分别向下取整。基础工期30天，每级雇佣10000名劳工，提供建筑等级上限+10、移民吸引力+0.01。\n\n每级每月标准维护消耗：木材0.5、石材0.5、工具0.2。"
 oe_byz_constantinople_aetius_cistern: "埃提乌斯蓄水池"
 oe_byz_constantinople_aetius_cistern_desc: "修整池壁、清理淤泥并接续输水渠道，使都城在旱季与围困时仍有可靠水源。\n\n位于东部礼仪中心，通过君士坦丁堡扩建计划修建。最多扩建3次，每次5000金币，基础工期365天，每级雇佣2000名劳工。每级增加建筑等级上限15、人口增长0.01%、人口容量50K。"
 oe_byz_constantinople_aetius_cistern_maintenance: "埃提乌斯蓄水池维护"
 oe_city_aetius_cistern_orders: "埃提乌斯蓄水池已使用扩建次数"
