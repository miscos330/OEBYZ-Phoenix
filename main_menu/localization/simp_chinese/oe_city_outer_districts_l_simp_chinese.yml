 oe_byz_constantinople_aspar_cistern_desc: "修整池壁、清理淤泥并接续输水渠道，使都城在旱季与围困时仍有可靠水源。\n\n位于梅塞大道，通过君士坦丁堡扩建计划修建。最多扩建3次，每次5000金币，基础工期365天，每级雇佣2000名劳工。每级增加建筑等级上限15、人口增长0.01%、人口容量50K。"
