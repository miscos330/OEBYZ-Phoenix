 oe_l7.1.t: "海峡上的堡垒"
 oe_l7.1.desc: "#F 史实中，1451年穆罕默德二世再次即位。第二年春天，苏丹在海峡欧洲一岸、离京城不远的地方动工修起一座堡垒，夏末完工。从此黑海来的船，先要从苏丹的炮口下经过。#!\n\n如今，苏丹[GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的人已经在城外丈量土地。奥斯曼的兵力已是帝国的#Y 2.5#!倍以上，阿德里安波利斯和京城外的村镇都在奥斯曼人手里。[GetCountry('BYZ').Custom('OeL7S1Un')][GetCountry('BYZ').Custom('OeL7S1Adr')]"
 oe_l7.1.a: "修补城墙，把城外的粮食收进城"
 oe_l7.1.a.tt: "花费#R 3#!个月的贸易与税收收入\n守城的几率#G +8%#!\n京城获得[ShowModifier('oe_l7_braced')]，持续#Y 3#!年"
 oe_l7.1.b: "遣使去罗马和威尼斯求援"
 oe_l7.1.b.tt: "花费#R 1#!个月的贸易与税收收入\n守城的几率#G +4%#!；西方援助意愿不低于#Y 50#!时再#G +4%#!（现在：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!）\n教皇国对帝国好感#G +10#!，持续#Y 5#!年\n威尼斯对帝国好感#G +10#!，持续#Y 5#!年"
 oe_l7.1.c: "给苏丹送礼，求苏丹再等等"
 oe_l7.1.c.tt: "花费#R 4#!个月的贸易与税收收入\n苏丹的使者晚#Y 2#!年才来\n奥斯曼对帝国好感#G +15#!，持续#Y 5#!年\n这样的礼只能送一次"
 oe_l7.3.t: "苏丹的条件"
 oe_l7.3.desc: "#F 史实中，1453年4月初，苏丹的大军到了陆墙外，船队封住了海面。据说围到五月下旬，苏丹派人进城：只要皇帝交出城来，就让皇帝带着家人和财物平安去摩里亚。据说皇帝回答，这座城不是皇帝一个人能交出的。#!\n\n如今，苏丹[GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的营帐扎满了城外，使者就在宫门口等回话。守城的把握约为#G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds').GetValue|0]%#!。[GetCountry('BYZ').Custom('OeL7S3Prep')][GetCountry('BYZ').Custom('OeL7S3Cap')][GetCountry('BYZ').Custom('OeL7S3Orban')][GetCountry('BYZ').Custom('OeL7S3Un')][GetCountry('BYZ').Custom('OeL7S3Wal')][GetCountry('BYZ').Custom('OeL7S3Stall')]"
 oe_l7.3.a: "不交。城是全城人的"
 oe_l7.3.a.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力\n守住的几率：#G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds').GetValue|0]%#!\n守住：京城仍归帝国\n城破：京城交给苏丹，首都迁往米斯特拉斯（摩里亚专制公领在、且米斯特拉斯在帝国手里时），否则迁往帝国人口最多的城，与奥斯曼停战#Y 10#!年\n一个月后见分晓"
 oe_l7.3.b: "交城，换摩里亚和平安"
 oe_l7.3.b.tt: "京城交给苏丹\n首都迁往米斯特拉斯（摩里亚专制公领在、且米斯特拉斯在帝国手里时），否则迁往帝国人口最多的城\n与奥斯曼停战#Y 10#!年\n帝国对京城的名分仍在\n一个月后城门打开"
 oe_l7.3.c: "倾尽国库，换苏丹退兵"
 oe_l7.3.c.tt: "花费#R 9#!个月的贸易与税收收入，另付第一年的贡金（#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!）\n与奥斯曼订立买和之约：威望#R −15#!，[oe_tu_authority|e]#R −5#!，停战#Y 5#!年，年年纳贡\n苏丹退兵；#Y 10#!年后苏丹可能再来，那时不能再买"
 oe_l7.3.d: "再拖一个月"
 oe_l7.3.d.tt: "一个月后苏丹再问一次（守城的几率重算）\n最多拖#Y 2#!次"
 oe_l7.4.t: "五月二十九日"
 oe_l7.4.desc_w: "#F 史实中，1453年5月29日城破，皇帝战死。#!\n\n如今：苏丹在城外等了两年，东边的事把苏丹叫走了。营帐拔了，海峡上的堡垒还在。"
 oe_l7.4.desc_h: "#F 史实中，1453年5月29日城破，皇帝战死。#!\n\n如今：攻城的人在墙下丢下了梯子，苏丹的营帐一夜之间拔了。京城还在。"
 oe_l7.4.desc_f: "#F 城破那天，皇帝冲进了人群，再没有人见过皇帝。相传皇帝没有死，化成了大理石，有一天会回来。#!\n\n如今：京城归了苏丹，朝廷退到了[GetCountry('BYZ').GetCapital.GetName]。"
 oe_l7.4.desc_o: "#F 据说苏丹提出过：交出城来，就放皇帝去摩里亚。史实中皇帝没有答应。#!\n\n如今：城门开了，苏丹按约放朝廷的人出城。朝廷退到了[GetCountry('BYZ').GetCapital.GetName]。"
 oe_l7.4.desc_fx: "#F 史实中，1453年5月29日城破，皇帝战死。#!\n\n如今：城下一败涂地，可交割没有办成，京城眼下仍在帝国手里。"
 oe_l7.4.desc_ox: "#F 据说苏丹提出过：交出城来，就放皇帝去摩里亚。史实中皇帝没有答应。#!\n\n如今：开城的约定没有办成，京城眼下仍在帝国手里。"
 oe_l7.4.desc_x: "#F 史实中，1453年5月29日城破，皇帝战死。#!\n\n消息已经传来。"
 oe_l7.4.a: "在圣索菲亚谢恩"
 oe_l7.4.a.tt: "帝国获得[ShowModifier('oe_l7_city_held')]，持续#Y 30#!年"
 oe_l7.4.b: "出城追击"
 oe_l7.4.b.tt: "帝国获得[ShowModifier('oe_l7_city_held')]，持续#Y 30#!年\n帝国获得[ShowModifier('oe_l7_pursuit')]，持续#Y 1#!年\n奥斯曼获得[ShowModifier('oe_l7_failed_siege')]，持续#Y 10#!年"
 oe_l7.4.c: "庆幸"
 oe_l7.4.d: "趁机修城"
 oe_l7.4.d.tt: "花费#R 2#!个月的贸易与税收收入\n京城获得[ShowModifier('oe_l7_braced')]，持续#Y 20#!年"
 oe_l7.4.e: "皇帝没有回来"
 oe_l7.4.e.tt: "皇帝战死在城头\n继位者的合法性#G +10#!（城头殉国的名声）"
 oe_l7.4.f: "皇帝突围出城"
 oe_l7.4.g: "带走能带走的"
 oe_l7.4.g.tt: "带出的库藏：金币#G +3#!个月的贸易与税收收入"
 oe_l7.4.h: "知道了"
 oe_l7.2.t: "城中的援兵"
 oe_l7.2.desc: "#F 史实中，据说1452年冬天，热那亚人朱斯蒂尼亚尼带着几百个自己出钱招来的兵到了京城，皇帝把陆墙的防务交给了朱斯蒂尼亚尼。对岸加拉塔的热那亚人却两头都不肯得罪。#!\n\n如今，海峡上的堡垒已经修起，城里正在分派各段城墙的守军。[GetCountry('BYZ').Custom('OeL7S2Giu')]"
 oe_l7.2.a: "请热那亚人守陆墙，许给热那亚人一座岛作酬劳"
 oe_l7.2.a.tt: "花费#R 2#!个月的贸易与税收收入\n守城的几率#G +8%#!\n热那亚对帝国好感#G +10#!，持续#Y 5#!年\n岛只是许诺，没有地易手"
 oe_l7.2.b: "皇帝亲守陆墙，热那亚人守海墙"
 oe_l7.2.b.tt: "守城的几率#G +4%#!"
 oe_l7.2.c: "把城里的修士和市民编进城防"
 oe_l7.2.c.tt: "花费#R 1#!个月的人力\n守城的几率#G +4%#!（城里为合一的事闹起来时没有加成）"
 oe_l7.10.t: "朝廷在[GetCountry('BYZ').GetCapital.GetName]"
 oe_l7.10.desc: "#F 史实中，京城陷落以后，皇帝的两个弟弟托马斯与德米特里奥斯仍是摩里亚的专制公。据说两人彼此不和，各占半个半岛。#!\n\n如今，朝廷到了[GetCountry('BYZ').GetCapital.GetName]。[GetCountry('BYZ').Custom('OeL7S10End')]各地的总督和主教都在等，看新都发出什么样的诏令。"
 oe_l7.10.a: "以[GetCountry('BYZ').GetCapital.GetName]为新都，号召各地"
 oe_l7.10.a.tt: "教会的框架还在时：牧首区的地位#R −2#!（牧首留在了苏丹的城里）"
 oe_l7.10.b: "立誓光复京城"
 oe_l7.10.b.tt: "帝国获得[ShowModifier('oe_l7_vow')]，持续#Y 30#!年\n这只是一个誓言：不宣战，也不因此得到宣战理由"
 oe_l7.10.c: "先求苏丹承认，保住剩下的地"
 oe_l7.10.c.tt: "付第一年的贡金（#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!），与奥斯曼订立买和之约：威望#R −15#!，[oe_tu_authority|e]#R −5#!，停战#Y 5#!年，年年纳贡\n已有买和之约时，改为续约#Y 5#!年、再付一年贡金；与奥斯曼若在交战，按买和之约的规矩停战\n奥斯曼对帝国好感#G +20#!，持续#Y 5#!年"
 oe_l7.11.t: "阿尔巴尼亚人起事"
 oe_l7.11.desc: "#F 史实中，据说城陷之后不久，摩里亚的阿尔巴尼亚人起来反对两位专制公；专制公请来苏丹的兵才平定下去，此后年年向苏丹纳贡。#!\n\n如今，摩里亚山里的阿尔巴尼亚牧人赶着牲口下了山，围住了几座镇子，说朝廷既然丢了京城，就不该再到山里来收税。"
 oe_l7.11.a: "请苏丹出兵帮忙平定"
 oe_l7.11.a.tt: "付第一年的贡金（#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!），与奥斯曼订立买和之约：威望#R −15#!，[oe_tu_authority|e]#R −5#!，停战#Y 5#!年，年年纳贡\n已有买和之约时，改为续约#Y 5#!年、再付一年贡金；与奥斯曼若在交战，按买和之约的规矩停战"
 oe_l7.11.b: "自己出兵平定"
 oe_l7.11.b.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力"
 oe_l7.11.c: "分地安置阿尔巴尼亚人，换其守边"
 oe_l7.11.c.tt: "#Y 10#!年内迁民的花费减半，冷却缩短为#Y 12#!个月（招民垦荒线）"
 oe_l7.12.t: "苏丹的贡金"
 oe_l7.12.desc: "#F 史实中，据说城陷以后，摩里亚的专制公每年要向苏丹送去贡金；贡金一拖欠，苏丹的兵就会来。#!\n\n如今，苏丹[GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的使者到了[GetCountry('BYZ').GetCapital.GetName]，要帝国按年送上贡金。这已是第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_n12').GetValue|0]#!回。[GetCountry('BYZ').Custom('OeL7S12Arr')]"
 oe_l7.12.a: "照付"
 oe_l7.12.a.tt: "花费#R 3#!个月的贸易与税收收入\n与奥斯曼停战#Y 5#!年"
 oe_l7.12.b: "拖欠"
 oe_l7.12.b.tt: "奥斯曼对帝国好感#R −20#!，持续#Y 5#!年\n苏丹记下这笔欠账，但不会因此开战"
 oe_l7.13.t: "最后的专制公领"
 oe_l7.13.desc: "#F 史实中，据说1458年苏丹领兵进了摩里亚，拿下地峡一带和北边的城镇；1460年苏丹又来，摩里亚就此陷落。据说德米特里奥斯降了苏丹，托马斯渡海去了科孚，后来又去了罗马。#!\n\n如今，苏丹[GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的兵已经到了地峡，奥斯曼的兵力是帝国的#Y 4#!倍以上。朝廷在[GetCountry('BYZ').GetCapital.GetName]。守住摩里亚的把握约为#G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds13').GetValue|0]%#!。[GetCountry('BYZ').Custom('OeL7S13Arr')][GetCountry('BYZ').Custom('OeL7S13Vow')]"
 oe_l7.13.a: "守住地峡"
 oe_l7.13.a.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力\n守住的几率：#G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds13').GetValue|0]%#!\n守住：摩里亚仍归帝国\n失守：帝国在摩里亚的地都交给苏丹，首都迁往帝国在摩里亚以外人口最多的城，与奥斯曼停战#Y 10#!年\n一个月后见分晓"
 oe_l7.13.b: "补足欠贡，求苏丹缓兵"
 oe_l7.13.b.tt: "花费#R 4#!个月的贸易与税收收入\n拖欠的贡金一笔勾销\n苏丹的兵退回去；#Y 5#!年后苏丹可能再来，那时不能再求缓\n这样的请求只能提一次"
 oe_l7.13.c: "弃摩里亚，渡海而去"
 oe_l7.13.c.tt: "帝国在摩里亚的地都交给苏丹，首都迁往帝国在摩里亚以外人口最多的城\n与奥斯曼停战#Y 10#!年\n带走的库藏：金币#G +2#!个月的贸易与税收收入\n一个月后船队启航"
 oe_l7.16.t: "摩里亚的结局"
 oe_l7.16.desc_h: "#F 史实中，1460年摩里亚陷落，拜占庭在希腊的最后一块领地就此丢了。#!\n\n如今：奥斯曼人在地峡前折损了不少人马，苏丹的兵退了。摩里亚还在帝国手里。"
 oe_l7.16.desc_l: "#F 史实中，1460年摩里亚陷落，拜占庭在希腊的最后一块领地就此丢了。#!\n\n如今：地峡失守，摩里亚各城归了苏丹，朝廷退到了[GetCountry('BYZ').GetCapital.GetName]。"
 oe_l7.16.desc_c: "#F 史实中，1460年摩里亚陷落，拜占庭在希腊的最后一块领地就此丢了。#!\n\n如今：朝廷的船队离开了摩里亚，到了[GetCountry('BYZ').GetCapital.GetName]。摩里亚各城归了苏丹。"
 oe_l7.16.desc_x: "#F 史实中，1460年摩里亚陷落，拜占庭在希腊的最后一块领地就此丢了。#!\n\n如今：摩里亚的交割没有办成，帝国在那里的城眼下还在。"
 oe_l7.16.a: "在教堂里谢恩"
 oe_l7.16.b: "收拢逃出来的人"
 oe_l7.16.c: "在新的地方安顿下来"
 oe_l7.16.d: "知道了"
 oe_l7.14.t: "去意大利的人"
 oe_l7.14.desc: "#F 史实中，京城陷落前后，不少希腊学者去了意大利，在那里讲授希腊的古书。据说一位希腊出身的枢机把一生的藏书赠给了威尼斯。#!\n\n如今，[GetCountry('BYZ').GetCapital.GetName]的朝廷收到威尼斯和罗马的来信：流落到那里的希腊学者在讲授古书，各地的王侯都派人来听。[GetCountry('BYZ').Custom('OeL7S14Sch')][GetCountry('BYZ').Custom('OeL7S14West')]"
 oe_l7.14.a: "资助学者留在威尼斯和罗马"
 oe_l7.14.a.tt: "威尼斯对帝国好感#G +10#!，持续#Y 5#!年\n教皇国对帝国好感#G +10#!，持续#Y 5#!年"
 oe_l7.14.b: "请学者回来办学"
 oe_l7.14.b.tt: "花费#R 2#!个月的贸易与税收收入\n帝国获得[ShowModifier('oe_l7_academy')]，持续#Y 20#!年"
 oe_l7.14.c: "随其自便"
 oe_l7.15.t: "北方的婚事"
 oe_l7.15.desc: "#F 史实中，据说1472年，托马斯的女儿佐伊经教廷撮合，远嫁莫斯科大公，改名索菲娅。后来莫斯科渐渐以罗马的继承者自居，一说“第三罗马”的说法就是这样来的。#!\n\n如今，莫斯科大公的使者到了[GetCountry('BYZ').GetCapital.GetName]，为大公求娶皇家一位还没出嫁的公主。教皇的使节也在打听，想把公主说给西方的王侯。"
 oe_l7.15.a: "嫁去莫斯科"
 oe_l7.15.a.tt: "莫斯科对帝国好感#G +30#!，持续#Y 10#!年\n莫斯科会记得这门亲事出自罗马的皇家"
 oe_l7.15.b: "嫁给西方的王侯"
 oe_l7.15.b.tt: "教皇国对帝国好感#G +15#!，持续#Y 5#!年"
 oe_l7.15.c: "留在宫中，不嫁"
 oe_l7.20.t: "特拉比松的求援"
 oe_l7.20.desc: "#F 史实中，1461年夏天，苏丹的大军围住了特拉比松，8月城中开门投降，科穆宁家的帝国就此终结。#!\n\n如今，奥斯曼人正在攻打特拉比松，特拉比松的使者到了宫门前求援。[GetCountry('BYZ').Custom('OeL7S20Kin')]"
 oe_l7.20.a: "派船去"
 oe_l7.20.a.tt: "花费#R 2#!个月的贸易与税收收入\n船队有#Y 60#!%的把握赶到：赶到时特拉比松获得[ShowModifier('oe_l7_tre_aid')]，持续#Y 5#!年\n特拉比松对帝国好感#G +15#!，持续#Y 5#!年\n帝国不参战，也不替谁议和"
 oe_l7.20.b: "只送钱"
 oe_l7.20.b.tt: "把#R 1#!个月的贸易与税收收入送给特拉比松\n特拉比松对帝国好感#G +15#!，持续#Y 5#!年"
 oe_l7.20.c: "爱莫能助"
 oe_l7.23.t: "船队的消息"
 oe_l7.23.desc_a: "帝国的船冲进了特拉比松的港口，城里的人在码头上欢呼。"
 oe_l7.23.desc_x: "船队在黑海上遇了风暴，没能赶到特拉比松。"
 oe_l7.23.a: "好"
 oe_l7.23.b: "可惜"
 oe_l7.21.t: "狄奥多罗的使者"
 oe_l7.21.desc: "#F 史实中，克里米亚山中的狄奥多罗公国一直撑到1475年。那一年奥斯曼人拿下了卡法，又围住了公国的山城，城破之后公国就此消失。#!\n\n如今，奥斯曼人的船已经出没在克里米亚的海岸。狄奥多罗的公爵派使者渡海来到宫中，求帝国不要忘了这些说希腊话的同信者。[GetCountry('BYZ').Custom('OeL7S21Tie')]"
 oe_l7.21.a: "互通声气，彼此声援"
 oe_l7.21.a.tt: "狄奥多罗对帝国好感#G +20#!，持续#Y 5#!年\n只是互通声气：不结成军事同盟，帝国不会因此被卷入战争"
 oe_l7.21.b: "送去船和粮"
 oe_l7.21.b.tt: "花费#R 2#!个月的贸易与税收收入\n狄奥多罗获得[ShowModifier('oe_l7_feo_aid')]，持续#Y 5#!年\n狄奥多罗对帝国好感#G +10#!，持续#Y 5#!年"
 oe_l7.21.c: "婉言谢绝"
 oe_l7.22.t: "千年之城"
 oe_l7.22.desc: "#F 史实中，1453年5月29日，京城落入奥斯曼人之手。#!\n\n如今，这一年已经过去一半，京城的城门照常开闭，市场照常喧闹，苏丹的大军从没有到过城下。宫里有人翻出旧编年史，说这座城已经立了一千多年。"
 oe_l7.22.a: "修一部编年史"
 oe_l7.22.b: "大赦"
 oe_l7.50.t: "紫袍流亡朝廷"
 oe_l7.50.desc_byz: "#F 史实中，1453年京城陷落后，帕列奥略皇室在米斯特拉斯延续七载，科穆宁氏在特拉比松坚守至1461年，狄奥多罗公国在克里米亚山地苦撑至1475年。特拉比松还曾以公主远嫁白羊王朝乌尊·哈桑，企图结成黑海与安纳托利亚高原的反奥包围网。#!\n\n如今，博斯普鲁斯的皇城已失，流亡朝廷在[ROOT.GetCountry.GetCapital.GetName]重整紫袍仪制。宫廷内群臣激辩：是举起流亡光复大旗、联络特拉比松与白羊王朝东西夹击，还是先保遗民休养生息？"
 oe_l7.50.desc_tre: "#F 史实中，1453年京城陷落后，帕列奥略皇室在米斯特拉斯延续七载，科穆宁氏在特拉比松坚守至1461年，狄奥多罗公国在克里米亚山地苦撑至1475年。特拉比松还曾以公主远嫁白羊王朝乌尊·哈桑，企图结成黑海与安纳托利亚高原的反奥包围网。#!\n\n如今，海峡上的千年皇城已经易主。黑海东岸的特拉比松宫廷手握科穆宁旧玺，流亡的希腊贵族与兵士纷纷渡海来投，劝请朝廷在[ROOT.GetCountry.GetCapital.GetName]承继空悬的罗马紫袍。"
 oe_l7.50.desc_feo: "#F 史实中，1453年京城陷落后，帕列奥略皇室在米斯特拉斯延续七载，科穆宁氏在特拉比松坚守至1461年，狄奥多罗公国在克里米亚山地苦撑至1475年。特拉比松还曾以公主远嫁白羊王朝乌尊·哈桑，企图结成黑海与安纳托利亚高原的反奥包围网。#!\n\n如今，博斯普鲁斯皇城失守的消息震动黑海北岸。克里米亚山城中的狄奥多罗朝廷高悬双头鹰旗，四方流亡水手与教士云集[ROOT.GetCountry.GetCapital.GetName]，恳请公国扛起流亡紫袍的火种。"
 oe_l7.50.desc_x: "#F 史实中，1453年京城陷落后，帕列奥略皇室在米斯特拉斯延续七载，科穆宁氏在特拉比松坚守至1461年，狄奥多罗公国在克里米亚山地苦撑至1475年。特拉比松还曾以公主远嫁白羊王朝乌尊·哈桑，企图结成黑海与安纳托利亚高原的反奥包围网。#!\n\n如今，京城已失，流亡军民汇聚[ROOT.GetCountry.GetCapital.GetName]，等待朝廷定下复国之志。"
 oe_l7.50.a: "在流亡中重申紫袍正统，厉兵秣马立誓光复"
 oe_l7.50.a.tt: "花费#R 2#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_court_exile')]，持续#Y 15#!年\n流亡复国代价：长期战备拖累行政稳定与市民满意度"
 oe_l7.50.b: "联络特拉比松、狄奥多罗与白羊朝，结成黑海—高原反奥阵线"
 oe_l7.50.b.tt: "花费#R 3#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_pontic_pact')]，持续#Y 15#!年\n与白羊王朝、特拉比松、狄奥多罗（凡存世且非本国者）关系提升\n代价：外交津贴压低国内税收效率"
 oe_l7.50.c: "韬光养晦，先保流亡遗民生息"
 oe_l7.50.c.tt: "[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_quiet_remnant')]，持续#Y 15#!年\n代价：低调潜伏削弱皇室威望"
 oe_l7.51.t: "西方与正教的流亡求援"
 oe_l7.51.desc: "#F 史实中，托马斯·帕列奥略携圣安德烈圣髑西赴罗马，末代继承人安德烈亚斯甚至在困顿中先后将拜占庭帝号抵押给法兰西与西班牙王室；与此同时，北方罗斯诸公也成为劫后正教世界仅存的强大外援。#!\n\n如今，[ROOT.GetCountry.GetCapital.GetName]的国库捉襟见肘，无力单凭残余郡县重建舰队与火炮。使节呈上三条筹饷之策：向威尼斯与罗马教廷抵押商权、向莫斯科募捐正教义资，或熔毁宫廷旧器自筹军饷。"
 oe_l7.51.a: "向罗马与威尼斯抵押商权，换取拉丁舰队与军饷"
 oe_l7.51.a.tt: "获得#G +3#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_latin_debt')]，持续#Y 15#!年\n教皇国对帝国好感#G +20#!，持续#Y 10#!年\n威尼斯对帝国好感#G +20#!，持续#Y 10#!年\n重负：拉丁债约压低合法性、教士满意度与商贸收益，日后还将面临债主清算"
 oe_l7.51.b: "遣使莫斯科与正教诸邦，募捐护教义资"
 oe_l7.51.b.tt: "[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_orthodox_alms')]，持续#Y 15#!年\n莫斯科或全罗斯（凡存世者）好感提升\n代价：折损外交威望与西方信誉"
 oe_l7.51.c: "拒绝外债，变卖宫廷金银自筹军资"
 oe_l7.51.c.tt: "获得#G +2#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_proud_austerity')]，持续#Y 12#!年\n代价：损耗合法性、贵族满意度与国内税率"
 oe_l7.52.t: "伯罗奔尼撒与希腊离散义军"
 oe_l7.52.desc: "#F 史实中，城陷之后大批伯罗奔尼撒轻骑兵（斯特拉蒂奥提）与爱琴海希腊水手流落威尼斯、克里特与南意大利，成为文艺复兴战场最精锐的轻骑与舵手；克里米亚与黑海山区的希腊军户也长期维持着顽强的山地堡垒防线。#!\n\n如今，散居爱琴海岛屿、塞萨洛尼基外围与黑海港埠的希腊流亡兵匠听闻[ROOT.GetCountry.GetCapital.GetName]紫袍未绝，纷纷遣人探问招抚条件。朝廷如何整编这支宝贵的离散力量？"
 oe_l7.52.a: "整编斯特拉蒂奥提轻骑与流亡水手"
 oe_l7.52.a.tt: "花费#R 3#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_stratioti_host')]，持续#Y 15#!年\n代价：高额陆军维持费与市民征发不满"
 oe_l7.52.b: "召回流亡工匠与铸炮师，筹建攻城火炮坊"
 oe_l7.52.b.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_refugee_arsenal')]，持续#Y 15#!年\n代价：征调人力并削弱国内税收效率"
 oe_l7.52.c: "修筑山寨堡垒，安置流亡百姓屯田固守"
 oe_l7.52.c.tt: "[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_mountain_holds')]，持续#Y 15#!年\n代价：堡垒维持费上升且短期震荡稳定"
 oe_l7.53.t: "流亡债约的清算"
 oe_l7.53.desc: "#F 史实中，流亡在外的巴列奥略王室因长年无力收复故土，债台高筑，连仅存的帝号名分也不得不屡屡典押给西欧君主，终至黯然失色。#!\n\n如今，距皇城失守已过去多年，博斯普鲁斯两岸仍未光复。威尼斯商团、拉丁债主与焦虑的地方豪强齐聚[ROOT.GetCountry.GetCapital.GetName]，逼问朝廷何时兑现当初的复国债约。"
 oe_l7.53.a: "咬牙偿还债息，保住光复军旗"
 oe_l7.53.a.tt: "花费#R 4#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_iron_resolve')]，持续#Y 10#!年\n代价：巨额偿债支出并压低税收效率"
 oe_l7.53.b: "撕毁拉丁债约，宣称皇统非买卖之物"
 oe_l7.53.b.tt: "[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_defiant_remnant')]，持续#Y 12#!年\n威尼斯对帝国好感#R −30#!，持续#Y 10#!年\n教皇国对帝国好感#R −30#!，持续#Y 10#!年\n代价：与威尼斯及教廷交恶，外交信誉大幅下滑"
 oe_l7.53.c: "典押海港关税予拉丁商团，换取苟安"
 oe_l7.53.c.tt: "[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_mortgaged_ports')]，持续#Y 15#!年\n代价：海港商贸收益在十五年内大幅受损"
 oe_l7.54.t: "反攻皇城的号角"
 oe_l7.54.desc: "#F 史实中，自1453年后欧洲屡次倡议收复东方皇城的十字军，却因列强各自盘算而屡屡流产；唯有希腊流亡者始终铭记博斯普鲁斯的城墙。#!\n\n如今，[ROOT.GetCountry.GetCapital.GetName]的流亡军民已完成集结，海陆斥候频报海峡防务虚实。诸将跪请朝廷吹响反攻皇城的号角——是孤注一掷举国总动员，还是先夺爱琴与黑海制海权步步推进？"
 oe_l7.54.a: "举国总动员，誓师北指博斯普鲁斯"
 oe_l7.54.a.tt: "花费#R 3#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_counter_crusade')]，持续#Y 10#!年\n重负：剧烈震荡国内稳定并大幅推高陆军维持费；不自动宣战，由玩家自行择机出兵"
 oe_l7.54.b: "稳扎稳打，先肃清爱琴与黑海侧翼"
 oe_l7.54.b.tt: "花费#R 2#!个月的贸易与税收收入\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_maritime_thrust')]，持续#Y 10#!年\n代价：缓进策略略损皇室威望"
 oe_l7.55.t: "浴火重归：流亡凤凰复国"
 oe_l7.55.desc: "#F 相传1453年城破之日，大理石皇帝并未陨落，而是在黄金门下沉睡，静待双头鹰旗重临博斯普鲁斯的一天。#!\n\n如今，[ROOT.GetCountry.GetName]的军队踏过狄奥多西城墙，双头鹰旗再度飘扬在圣索菲亚大教堂穹顶之上！历经流亡、债约与苦战，帝国的紫袍凤凰终于从灰烬中浴火重生。朝廷当即刻还都皇城，还是暂留[ROOT.GetCountry.GetCapital.GetName]分步修缮废墟？"
 oe_l7.55.a: "重返圣索菲亚，还都博斯普鲁斯，宣布凤凰浴火重生"
 oe_l7.55.a.tt: "清除全部流亡债务与衰颓修正；若皇城在本国掌控且未被围攻，首都迁回君士坦丁波利斯\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_phoenix_reborn')]，持续#Y 30#!年\n代价：浩大的还都重建工程略微增加稳定维护负担"
 oe_l7.55.b: "暂以流亡龙兴之地为陪都，分步重建皇城"
 oe_l7.55.b.tt: "清除全部流亡债务与衰颓修正，首都暂留原地\n[ROOT.GetCountry.GetName]获得[ShowModifier('oe_l7_ex_phoenix_rebuilt')]，持续#Y 30#!年\n代价：双都驻防略微增加陆军维持费"
 oe_l7.90.t: "最后的围城：选项生效"
