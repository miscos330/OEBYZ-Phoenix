 oe_l7_ex_dec_carry_purple.title: "承继流亡紫袍"
 oe_l7_ex_dec_carry_purple.desc: "海峡上的千年皇城既已失守，仍存世的拜占庭流亡朝廷、特拉比松或狄奥多罗可在流亡中正式升起双头鹰紫旗，开启复国大业。"
 oe_l7_ex_dec_carry_purple.a: "高悬双头鹰旗，承继紫袍火种"
 oe_l7_ex_dec_rally_diaspora.title: "号召离散希腊军民"
 oe_l7_ex_dec_rally_diaspora.desc: "动用国库与威望向散居爱琴海、威尼斯与黑海沿岸的希腊水手、工匠与轻骑兵发出号召，补充流亡朝廷的人力与士气（代价：市民承压）。"
 oe_l7_ex_dec_rally_diaspora.a: "重金招抚离散义旅"
 oe_l7_ex_dec_claim_reconquest.title: "重登博斯普鲁斯帝座"
 oe_l7_ex_dec_claim_reconquest.desc: "流亡朝廷历经苦战终于重夺君士坦丁波利斯！即刻在圣索菲亚举行还都大典，洗清流亡债约，宣告凤凰浴火重生。"
 oe_l7_ex_dec_claim_reconquest.a: "还都皇城，凤凰重生"
