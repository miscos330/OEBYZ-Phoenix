 OE_L7_S3_C3: "修士和市民编成了守城的队伍。"
 OE_L7_OEL7S3CAP_NONE: ""
 OE_L7_S2_GIU: "早些年已经有一位热那亚雇佣兵来投过皇帝。"
 OE_L7_OEL7S2GIU_NONE: ""
 OE_L7_S10_E2: "城破那天逃出来的大臣和教士陆续到了。"
 OE_L7_S10_E3: "按约出城的人带着库藏和文书到了。"
