 STATIC_MODIFIER_NAME_oe_reg_porphyrogenitus_coronation: "紫室幼帝亲政加冕"
 STATIC_MODIFIER_DESC_oe_reg_porphyrogenitus_coronation: "紫衣太后平稳还政，幼帝在圣索菲亚大教堂受膏加冕，四方朝觐称颂皇统不坠。"
 STATIC_MODIFIER_NAME_oe_reg_senate_stewardship_legacy: "元老院护国法统余荫"
 STATIC_MODIFIER_DESC_oe_reg_senate_stewardship_legacy: "元老院首席大总管于摄政期间谨守法度与账簿，令新君亲政之初即可驾驭井然有序的中枢文官体系。"
 STATIC_MODIFIER_NAME_oe_reg_yuan_majority_accession: "两宫撤帘亲政大典"
 STATIC_MODIFIER_DESC_oe_reg_yuan_majority_accession: "太后撤帘归政，中书省与诸路宣慰司恭贺幼主亲政，朝堂内外礼法安泰。"
 STATIC_MODIFIER_NAME_oe_reg_purple_chamber_mandate: "紫室太后监国敕令"
 STATIC_MODIFIER_DESC_oe_reg_purple_chamber_mandate: "紫室皇太后以帝室法统居中裁断军政，震慑觊觎皇位的宗亲与大贵族。"
 STATIC_MODIFIER_NAME_oe_reg_senate_chancellery_order: "君堡元老院枢密宪章"
 STATIC_MODIFIER_DESC_oe_reg_senate_chancellery_order: "君士坦丁堡元老院与大总管司联署执政，维持各军区税册、敕令与城防拨款照常运转。"
 STATIC_MODIFIER_NAME_oe_reg_dual_palace_accord: "两宫协理中书之议"
 STATIC_MODIFIER_DESC_oe_reg_dual_palace_accord: "垂帘太后与中书省重臣定约分职，内安后宫勋戚，外抚诸道投下王公。"
 STATIC_MODIFIER_NAME_oe_reg_kurultai_banner_oath: "忽里台九斿大纛誓盟"
 STATIC_MODIFIER_DESC_oe_reg_kurultai_banner_oath: "诸翼宗王在九斿白纛前共立军盟，于监国期间严整万户骑兵与草原驿防。"
 STATIC_MODIFIER_NAME_oe_reg_boyar_council_compact: "波雅尔杜马监国誓约"
 STATIC_MODIFIER_DESC_oe_reg_boyar_council_compact: "莫斯科大贵族家族在杜马达成联保协定，暂息世袭领地私斗，协力拱卫克里姆林与边疆木寨。"
 STATIC_MODIFIER_NAME_oe_reg_kurultai_acclamation: "白毡举汗大典余威"
 STATIC_MODIFIER_DESC_oe_reg_kurultai_acclamation: "诸王公与万户长共举白毡推戴新主登基，汗廷威望与法统声震欧亚草原。"
 STATIC_MODIFIER_NAME_oe_reg_autocratic_majority: "全罗斯亲政收权诏令"
 STATIC_MODIFIER_DESC_oe_reg_autocratic_majority: "成年君主果断收回摄政期间旁落的王室特权，以书吏署与直属近卫强化中央集权。"
 STATIC_MODIFIER_NAME_oe_reg_duma_reconciliation: "杜马宽宥与服役和解"
 STATIC_MODIFIER_DESC_oe_reg_duma_reconciliation: "新君亲政后宽宥摄政旧臣，确认波雅尔与中小服役贵族的军役封邑，换取全境安定与边防协力。"
 oe_reg.1.t: "紫室垂帘：皇太后临朝摄政"
 oe_reg.1.d: "先帝龙驭上宾，年幼储君尚待成长。依照新罗马历代紫室旧仪，皇太后于布拉赫奈宫与大皇宫接掌御玺，临朝摄理军国大政。京畿大贵族与行省总督正屏息观望，看摄政宫廷将采取强硬集权抑或怀柔安抚之道。"
 oe_reg.1.a: "颁布紫室敕令，重申帝室法统"
 oe_reg.1.a.tt: "以皇室威仪震慑宗亲与豪强，获得正统性并开启五年#Y 紫室太后监国敕令#!修正。"
 oe_reg.1.b: "赐宴安抚京畿世家与大贵族"
 oe_reg.1.b.tt: "授予世家礼遇以换取朝局安稳，提升贵族阶层满意度与国家稳定度。"
 oe_reg.2.t: "君堡元老院奉诏监国"
 oe_reg.2.d: "皇位骤然虚悬而宫中暂无可主大局之成年皇太后，君士坦丁堡元老院遂循古典罗马与东罗马宪制传统，推举帝国首席大总管执掌摄政之职。大宫议事厅灯火通明，诸部书记官已备齐国库账册与敕令草稿。"
 oe_reg.2.a: "授权大总管司颁行摄政宪章"
 oe_reg.2.a.tt: "依托常设文官机制稳固朝政，提升稳定度并获得五年#Y 君堡元老院枢密宪章#!修正。"
 oe_reg.2.b: "命元老院宣誓效忠帝国皇统"
 oe_reg.2.b.tt: "在圣索菲亚座堂前昭告元老院效忠誓词，增进国家正统性与声望。"
 oe_reg.3.t: "两宫垂帘：皇太后摄理大元朝政"
 oe_reg.3.d: "大汗晏驾，幼主初承大统。两宫皇太后循祖宗旧制垂帘听政，召见中书省丞相与枢密院重臣共商国是。南起江淮漕运、北至上都草场，诸路行省与投下王公皆翘首静候朝廷新旨。"
 oe_reg.3.a: "垂帘会同中书省颁行安民诏"
 oe_reg.3.a.tt: "明确两宫与中书省分职协理，提升正统性并获得五年#Y 两宫协理中书之议#!修正。"
 oe_reg.3.b: "颁赐金帛以安抚草原诸翼宗王"
 oe_reg.3.b.tt: "循草原赏赐旧例维系宗王拥戴，提升贵族阶层满意度与朝廷声望。"
 oe_reg.4.t: "大忽里台公推宗王监国"
 oe_reg.4.d: "九斿白纛迎风招展，诸翼宗王、驸马与万户长齐聚草原大帐，召开大忽里台议定监国人选。一番剑拔弩张的权衡过后，一位素有军功的宗室猛将受推为摄政监国，暂掌兀鲁思大权。"
 oe_reg.4.a: "重申《大札撒》军盟，整军备战"
 oe_reg.4.a.tt: "以严明军纪凝聚各翼铁骑，提升陆军传统并获得五年#Y 忽里台九斿大纛誓盟#!修正。"
 oe_reg.4.b: "重申诸王投下份地以稳汗廷"
 oe_reg.4.b.tt: "以承认宗王既有领邑换取内部和平，提升贵族阶层满意度与稳定度。"
 oe_reg.5.t: "波雅尔杜马摄政会议启幕"
 oe_reg.5.d: "幼主登基未久，莫斯科克里姆林红门之内已成诸大波雅尔世家角逐之地。为免内讧招致外敌窥伺，元老波雅尔们最终结成杜马摄政会议，共署国书、统摄边疆军役与京畿司法。"
 oe_reg.5.a: "签署波雅尔杜马联保监国誓约"
 oe_reg.5.a.tt: "承认杜马在摄政期的集体护国之责，提升贵族满意度并获得五年#Y 波雅尔杜马监国誓约#!修正。"
 oe_reg.5.b: "倚重都主教与书吏署制衡豪门"
 oe_reg.5.b.tt: "借助教会与直属文吏维持王权独立，提升国家稳定度与正统性。"
 oe_reg.6.t: "白毡举汗：忽里台推戴新主亲政"
 oe_reg.6.d: "监国摄政期圆满落幕，诸翼宗王与万户长再度齐聚大帐，高举白毡欢呼新主正式亲政。草原诸部与定居行省皆在静待新君开篇之举：是以铁腕重振汗廷权威，还是厚赏功臣以固联盟？"
 oe_reg.6.a: "竖起九斿大纛，昭告大汗亲政威权"
 oe_reg.6.a.tt: "强化汗廷正统与凝聚力，获得正统性或游牧团结度并开启五年#Y 白毡举汗大典余威#!修正。"
 oe_reg.6.b: "大宴忽里台功臣，分赏骏马锦缎"
 oe_reg.6.b.tt: "以丰厚赏赐酬谢监国宗王，大幅提升贵族阶层满意度并获声望。"
 oe_reg.7.t: "克里姆林亲政：波雅尔杜马还政"
 oe_reg.7.d: "漫长的波雅尔杜马摄政终于画上句号，成年君主步入圣母升天座堂受膏亲政。历年摄政期间，波雅尔世家趁机扩充了私领与朝堂权柄。此刻，君主必须决断：是雷霆收权树立专制皇威，还是宽宥旧臣以求举国和协？"
 oe_reg.7.a: "收回摄政特权，确立全罗斯专制王权"
 oe_reg.7.a.tt: "削弱贵族摄政余权以强化中央集权，提升正统性并获得五年#Y 全罗斯亲政收权诏令#!修正，但会引起贵族不满。"
 oe_reg.7.b: "宽宥杜马旧臣，共缔军役和解誓约"
 oe_reg.7.b.tt: "以宽仁之策弥合朝野裂痕，提升稳定度与贵族满意度，并获得五年#Y 杜马宽宥与服役和解#!修正。"
 oe_reg.10.title: "宗庙立储大典：钦定帝国嗣君"
 oe_reg.10.desc: "历经摄政风波之后，[ROOT.GetCountry.GetName]朝野深知储位明定方能杜绝骨肉相残与权臣窥伺。礼官与重臣齐集御前，恭请陛下依照本朝祖宗典制，颁下正式立储册书，明定未来大统所归。"
 oe_reg.10.a: "册立[oe_reg_candidate.GetNameWithNoTooltip]为紫室共治皇帝"
 oe_reg.10.a.tt: "以#Y 紫室所生共治皇帝#!典制钦定[oe_reg_candidate.GetNameWithNoTooltip]为法定皇储，并提升正统性。"
 oe_reg.10.b: "敕封[oe_reg_candidate.GetNameWithNoTooltip]为莫雷阿专制公皇储"
 oe_reg.10.b.tt: "循拜占庭末期惯例，以#Y 莫雷阿专制公皇储#!名义钦定[oe_reg_candidate.GetNameWithNoTooltip]为继承人并获声望。"
 oe_reg.10.c: "效五贤帝古风，敕收[oe_reg_caesar_candidate.GetNameWithNoTooltip]为过继凯撒"
 oe_reg.10.c.tt: "效法古典罗马择贤过继之制，以#Y 过继凯撒皇嗣#!名义立[oe_reg_caesar_candidate.GetNameWithNoTooltip]为嗣君并增进稳定度。"
 oe_reg.10.d: "册立[oe_reg_candidate.GetNameWithNoTooltip]为皇太子兼领中书令"
 oe_reg.10.d.tt: "循大元东宫定制，以#Y 皇太子兼领中书令#!名义钦定[oe_reg_candidate.GetNameWithNoTooltip]为储君并提升正统性。"
 oe_reg.10.e: "由大忽里台推戴[oe_reg_candidate.GetNameWithNoTooltip]为储君"
 oe_reg.10.e.tt: "以#Y 大忽里台推戴储君#!典制钦定[oe_reg_candidate.GetNameWithNoTooltip]为继承人并提升陆军传统。"
 oe_reg.10.f: "载入大公遗诏，钦定[oe_reg_candidate.GetNameWithNoTooltip]为嗣君"
 oe_reg.10.f.tt: "循莫斯科《大公遗嘱》成宪，以#Y 大公遗诏钦定嗣君#!名义指定[oe_reg_candidate.GetNameWithNoTooltip]为储君并提升正统性。"
 oe_reg.10.g: "维持现行储位顺位，暂不另行册立"
 oe_reg.10.g.tt: "维持现有继承顺位不变，安抚朝野并提升国家稳定度。"
