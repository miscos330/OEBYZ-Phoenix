l_simp_chinese:
# v9.6 Module 3: Civilization Regencies, Educations & Heir Reasons (oe_reg_).
 oe_reg_byz_porphyrogenitus_regency: "紫室太后摄政"
 oe_reg_byz_porphyrogenitus_regency_desc: "当罗马皇帝崩逝而幼储尚在冲龄之时，皇后与紫室皇太后循伊琳娜与狄奥多拉先例临朝监国，以帝室正统维系宫廷法统，遏止大贵族乘隙干政。"
 oe_reg_byz_senate_regency: "君堡元老院摄政"
 oe_reg_byz_senate_regency_desc: "在缺乏成年皇太后垂帘之际，君士坦丁堡元老院与帝国首席大总管出面主持摄政会议，依托完备的枢密文官与财政册籍维持帝国政务照常运转。"
 oe_reg_yuan_empress_dowager_regency: "两宫太后垂帘摄政"
 oe_reg_yuan_empress_dowager_regency_desc: "承袭大元察必、答己与卜答失里皇后称制遗规，皇太后于两宫垂帘听政，居中调停中书省文臣与草原宗室投下王公，维系四方藩属效忠。"
 oe_reg_yuan_kurultai_regency: "忽里台宗王监国摄政"
 oe_reg_yuan_kurultai_regency_desc: "每逢汗位虚悬或幼主未冠且无太后称制，诸翼宗王与万户长齐聚大忽里台公推骁勇宗亲监国摄政。铁骑军威得以维系，但地方分权之势亦随之抬头。"
 oe_reg_rus_boyar_duma_regency: "波雅尔杜马摄政会议"
 oe_reg_rus_boyar_duma_regency_desc: "大公或沙皇年幼未亲政期间，莫斯科与罗斯世袭大贵族齐聚波雅尔杜马共理国政。贵族豪门虽趁机扩大权势，却也倾力拱卫城防与疆土不坠。"
 oe_edu_byz_porphyrogenitus: "紫室皇嗣礼乐教习"
 oe_edu_byz_porphyrogenitus_desc: "于君士坦丁堡大皇宫紫室延请罗马法学家、修辞名师与外交老臣悉心授业，专精帝国行政法度与宫廷纵横之术，并温和引导基督教系皇嗣归宗国教。"
 oe_edu_byz_strategikon: "《战略学》统帅军训"
 oe_edu_byz_strategikon_desc: "以莫里斯皇帝《战略学》与利奥六世《战术论》为蓝本，由军区宿将与近卫骑兵统领亲授兵法推演、城防攻守与骑步协同，锤炼善战之帝王统帅。"
 oe_edu_yuan_donggong: "东宫经筵讲学"
 oe_edu_yuan_donggong_desc: "于东宫文华讲席广延儒宗硕学、中书省典章旧臣与西域算师，兼习四书史鉴、漕运财赋与多族驭边方略，涵养治世明君气象。"
 oe_edu_rus_tsarevich: "克里姆林储君双师共训"
 oe_edu_rus_tsarevich_desc: "由莫斯科东正教宗主教座博学教士与资深波雅尔军政重臣双师共训，将正教礼法、书吏署民政与边防征伐融为一体，塑造全罗斯护教明主。"
 oe_edu_steppe_ordu: "斡耳朵怯薛围猎军训"
 oe_edu_steppe_ordu_desc: "自幼随斡耳朵怯薛宿卫驰骋秋狝大围猎，研习《大札撒》军律、弓骑奔袭与诸部盟会仪轨，成就纵横欧亚草原的铁骑霸主。"
 HEIR_REASON_oe_porphyrogenitus_co_emperor: "紫室所生共治皇帝"
 HEIR_REASON_oe_despot_of_morea_heir: "莫雷阿专制公皇储"
