 # NEW 2026-11-23 v23.0 Module B1: Papal Kingdom of God & Imperium Sancti Petri (oe_pap_) — Simplified Chinese Localization (270 keys) (oe_pap_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v230_papal_kingdom_god.py; edit the generator, not this file.
 oe_pap_legation:0 "枢机特使大教区"
 oe_pap_legation_desc:0 "由教宗国册封并由忠顺枢机特使总辖的专属领土型教会附庸。与圣座共享地图色块而保留地方名号，必应一切攻防征召、加速天主教改宗并向教廷缴纳适度贡赋。"
 LEAD_oe_pap_legation:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_pap_legation:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_pap_legation_subject_opinion:0 "圣座宗主权威"
 oe_pap_legation_overlord_opinion:0 "教宗枢机特使大教区"
 oe_msn_pap_kingdom_god:0 "#bold #color_yellow 地上天国与圣彼得罗马帝国#!#!"
 oe_msn_pap_kingdom_god_DESCRIPTION:0 "决断阿维尼翁之囚、一统意大利加冕地上天国、收复五大牧首圣座建立圣彼得罗马帝国，并弥合东西教会大分裂。"
 oe_msn_pap_kingdom_god_CRITERIA_DESCRIPTION:0 "扮演持有罗马或阿维尼翁的教宗国，开启圣彼得四支十六阶帝国与普世教会旗舰天命线。"
 oe_msn_pap_kingdom_god_BUTTON_TOOLTIP:0 "开启《地上天国与圣彼得罗马帝国》旗舰任务树"
 oe_msn_pap_kingdom_god_BUTTON_DETAILS:0 "面向教宗国的四支十六阶旗舰任务树：决断阿维尼翁与阿尔沃诺斯收复罗马涅；一统意大利宣告地上天国并建制枢机特使大教区；光复耶路撒冷、安条克、亚历山大与君士坦丁堡加冕圣彼得罗马帝国；引领文艺复兴、反宗教改革与弥合1054年大分裂。"
 oe_pap_legation_reform:0 "枢机特使大教区宪章"
 oe_pap_legation_reform_desc:0 "授予教宗枢机特使民政司法、要塞防务与教区统辖全权，奉圣彼得之名抚平新附疆土并弘扬正统信仰。"
 oe_pap_regnum_dei_reform:0 "地上天国（Regnum Dei）"
 oe_pap_regnum_dei_reform_desc:0 "以圣彼得双钥一统意大利半岛后宣告建立的地上天国政体：令教宗国晋升帝国位阶、总揽全意教区与枢机特使体系，同时完好保留教宗选举与天主教会最高领袖权柄。"
 oe_pap_sanctum_imperium_reform:0 "圣彼得罗马帝国（Imperium Sancti Petri）"
 oe_pap_sanctum_imperium_reform_desc:0 "收复罗马、君士坦丁堡、耶路撒冷、亚历山大与安条克五大牧首圣座后确立的至高神圣罗马帝国：教宗兼领大祭司与奥古斯都法统，绕开原版建国限制而不损教宗机制分毫。"
 oe_pap_gallic_curia_reform:0 "阿维尼翁高卢教廷"
 oe_pap_gallic_curia_reform_desc:0 "教廷选择永驻罗纳河畔的阿维尼翁教宗宫，将高卢教廷锻造为精干高效的官僚与外交中枢，借法教同盟向西欧诸国投射深远威权与财政影响力。"
 oe_pap_law_donation_constantine:0 "君士坦丁赠礼解释法"
 oe_pap_law_donation_constantine_desc:0 "界定教廷援引《君士坦丁赠礼》所主张的最高法权边界：是在世俗疆域推行强硬直辖、专精普世神权首席，还是与基督教君主缔结互利共治的政教协定。"
 oe_pap_pol_temporal_supremacy:0 "世俗至上论"
 oe_pap_pol_temporal_supremacy_desc:0 "将赠礼诠释为教宗对西方世俗疆土的绝对领有权，显著增强中枢集权、最大控制度与战争分数效率，代价是令世俗王室戒备。"
 oe_pap_pol_spiritual_primacy:0 "神权首席论"
 oe_pap_pol_spiritual_primacy_desc:0 "高举圣彼得宝座超越万邦王冠的神圣道德首席权威，稳步提升宗教影响力、虔诚度、传教改宗效率与外交声誉。"
 oe_pap_pol_imperial_concordat:0 "政教协定宪章"
 oe_pap_pol_imperial_concordat_desc:0 "通过明文政教协定协调教宗特使与皇帝、国王的权责边界，拓宽外交容量、巩固附庸忠诚并促进国内稳定。"
 oe_pap_law_curia_patronage:0 "教廷人文与宗教裁判法"
 oe_pap_law_curia_patronage_desc:0 "确立教廷在文艺复兴学术庇护、教义纯洁裁判与托钵修会宣教之间的文化及宗教导向。"
 oe_pap_pol_renaissance_humanism:0 "文艺复兴人文庇护"
 oe_pap_pol_renaissance_humanism_desc:0 "敞开梵蒂冈图书馆大门并大力资助人文主义学者、建筑师与画师，显著提升科研速度、艺术家名额与文化威望。"
 oe_pap_pol_roman_inquisition:0 "罗马宗教裁判所"
 oe_pap_pol_roman_inquisition_desc:0 "授权圣职部严查异端与暗中渗透，大幅提高宗教改宗速度、反间谍能力及对新教思潮的抵御力。"
 oe_pap_pol_mendicant_missions:0 "托钵修会普世宣教"
 oe_pap_pol_mendicant_missions_desc:0 "广派方济各会、多明我会与奥斯定会修士深入城镇乡野宣道济贫，温和推进信仰教化、文化融合与庶民安居。"
 oe_pap_law_swiss_crusade:0 "瑞士近卫与十字军税法"
 oe_pap_law_swiss_crusade_desc:0 "规范教宗国保卫圣彼得领地与发起十字军远征的军制与财源：在常备瑞士近卫精兵、全欧十字军什一税与意大利雇佣军团之间抉择。"
 oe_pap_pol_swiss_guard_corps:0 "教廷瑞士近卫军团"
 oe_pap_pol_swiss_guard_corps_desc:0 "常设宣誓效忠教宗的阿尔卑斯长矛与戟兵精锐，显著强化全军军纪、重步兵战力与城防韧性。"
 oe_pap_pol_european_crusade_tithe:0 "全欧十字军什一税"
 oe_pap_pol_european_crusade_tithe_desc:0 "向全天主教世界各教区征收专项十字军什一税，为教宗府库充盈稳定岁入、后备兵员与高昂圣战士气。"
 oe_pap_pol_condottieri_legions:0 "教宗雇佣军团制"
 oe_pap_pol_condottieri_legions_desc:0 "长期签雇久经沙场的意大利名将与雇佣兵团为教廷效力，大幅节省雇佣军维护费并提高攻城效率与陆军传统。"
 oe_pap_law_cardinal_college:0 "枢机团与教区宪章"
 oe_pap_law_cardinal_college_desc:0 "确立神圣枢机团的组成格局与教区治理准则：是在意大利本土高度集权、广纳全欧天主教列国枢机，还是推行大公会议协商体制。"
 oe_pap_pol_italian_curia:0 "意大利枢机集权"
 oe_pap_pol_italian_curia_desc:0 "以罗马与意大利籍枢机执掌教廷核心司署，大力强化月度控制增长、内阁效率、税政征收与中枢权威。"
 oe_pap_pol_universal_college:0 "普世天主教枢机团"
 oe_pap_pol_universal_college_desc:0 "将红衣枢机席位广授法兰西、德意志、伊比利亚、波兰与意大利诸王国，大幅增强教廷外交声望、宗教影响力与特使忠诚。"
 oe_pap_pol_ecumenical_synod:0 "普世大公会议宪章"
 oe_pap_pol_ecumenical_synod_desc:0 "定期召开广邀东西方主教代表列席的大公会议，提高立法效率、基督教派宽容度、国家稳定与崇高威望。"
 oe_pap_op_legation_chartered:0 "册封为教宗枢机特使大教区"
 oe_pap_op_gallic_concordat:0 "阿维尼翁法教政教协定"
 oe_pap_op_hre_advocate:0 "确认教会世俗护持者尊位"
 oe_pap_op_hre_usurped:0 "教宗直领罗马帝国尊号"
 oe_pap_op_ecumenical_bridge:0 "双圣座普世大公会议倡议"
 oe_pap_op_ecumenical_union:0 "弥合1054年东西教会大分裂"
 oe_pap_op_latin_primacy_demand:0 "教宗强索无条件首席权威"
 oe_pap_dec_return_to_rome.title:0 "重返永恒之城罗马或永驻阿维尼翁"
 oe_pap_dec_return_to_rome.desc:0 "裁决圣彼得继承人的永恒宝座归属：自阿维尼翁凯旋迁都#Y 罗马#!重振永恒之城，或坚守罗纳河畔正式确立#Y 阿维尼翁高卢教廷#!政体。"
 oe_pap_dec_return_to_rome.a:0 "迁都罗马：重登圣彼得永恒宝座"
 oe_pap_dec_return_to_rome.b:0 "永驻阿维尼翁：确立高卢教廷政体"
 oe_pap_dec_proclaim_kingdom_of_god.title:0 "宣告建立地上天国（Regnum Dei）"
 oe_pap_dec_proclaim_kingdom_of_god.desc:0 "一统意大利四大柱石——#Y 罗马、米兰、佛罗伦萨与那不勒斯#!后，正式宣告建立#Y 地上天国（Regnum Dei）#!。教宗国晋升为#Y 帝国#!位阶，解锁并启用专属政体改革与永久修正，同时完整保留教宗机制与天主教会领袖地位。"
 oe_pap_dec_proclaim_kingdom_of_god_req_tt:0 "自身或非主权属国控制#Y 罗马、米兰、佛罗伦萨与那不勒斯#!。"
 oe_pap_dec_proclaim_kingdom_of_god.a:0 "奉圣彼得双钥，加冕地上天国！"
 oe_pap_dec_proclaim_papal_rome.title:0 "宣告圣彼得罗马帝国（Imperium Sancti Petri）"
 oe_pap_dec_proclaim_papal_rome.desc:0 "尽复#Y 罗马、君士坦丁堡、耶路撒冷、亚历山大与安条克#!五大古老牧首圣座后，以#Y 大祭司兼奥古斯都#!之尊宣告圣彼得罗马帝国复兴。晋升#Y 帝国#!位阶并解锁专属政体改革，彻底突破原版教宗建国限制而无损教廷机制。"
 oe_pap_dec_proclaim_papal_rome_req_tt:0 "自身或非主权属国控制五大牧首圣座：#Y 罗马、君士坦丁堡、耶路撒冷、亚历山大与安条克#!。"
 oe_pap_dec_proclaim_papal_rome.a:0 "宣诏天下：圣彼得罗马帝国永世长存！"
 oe_pap_dec_charter_legation.title:0 "册封教宗枢机特使大教区"
 oe_pap_dec_charter_legation.desc:0 "将新征服的非核心边疆领土册封为忠诚的#Y 枢机特使大教区#!专属附庸并颁授枢机特使宪章。绝不割让首都、#Y 罗马#!、#Y 阿维尼翁#!、拉齐奥腹地或任何教宗国核心领地。"
 oe_pap_dec_charter_legation_req_tt:0 "在拉齐奥、罗马与阿维尼翁之外直接拥有至少#Y 3#!处非首都、非核心领地。"
 oe_pap_dec_charter_legation.a:0 "委任枢机特使，钤印颁授大教区诏书"
 oe_pap_dec_call_universal_crusade.title:0 "颁布普世十字军什一税与志愿军诏书"
 oe_pap_dec_call_universal_crusade.desc:0 "向天主教世界全体教区颁布普世十字军通谕，征集圣战什一税与志愿骑士军团。每#Y 10年#!可颁行一次，获得#G +180#!金币、#G +5#!人力、#G +6#!陆军传统及#Y 5年#!十字军作战加成。"
 oe_pap_dec_call_universal_crusade.a:0 "遍告基督教诸邦，宣召普世十字军"
 oe_pap_dec_ecumenical_council.title:0 "与君士坦丁堡共召普世大公会议"
 oe_pap_dec_ecumenical_council.desc:0 "遣使邀约东罗马皇帝与君士坦丁堡普世牧首共襄大公会议，商议弥合#Y 1054年东西教会大分裂#!——无论是缔结平等的双圣座合一，还是重申罗马首席权威。"
 oe_pap_dec_ecumenical_council.a:0 "遣枢机使团赴东罗马，召开普世大公会议"
 oe_msn_pap_a1_avignon_court:0 "决断阿维尼翁教廷之路"
 oe_msn_pap_a1_avignon_court_desc:0 "身处罗纳河畔而意大利诸城邦四分五裂，教廷必须定下大计：或筹备重返圣彼得陵寝的归程，或将阿维尼翁锻造为雄踞西欧的[prestige|e]与[devotion|e]中枢。"
 oe_msn_pap_a1_avignon_court_req_tt:0 "完成1337年阿维尼翁抉择、已迁都罗马，或持有阿维尼翁且稳定度至少为 8。"
 oe_msn_pap_a2_albornoz_romagna:0 "阿尔沃诺斯收复罗马涅"
 oe_msn_pap_a2_albornoz_romagna_desc:0 "循红衣主教阿尔沃诺斯的铁血远征与《埃吉迪乌斯法典》，将拉文纳与博洛尼亚重归教廷旗帜之下，筑牢亚得里亚海侧翼与罗马涅[control|e]。"
 oe_msn_pap_a2_albornoz_romagna_req_tt:0 "自身或非主权属国同时控制拉文纳与博洛尼亚。"
 oe_msn_pap_a3_subdue_rienzo_rome:0 "平定里恩佐与稳固罗马"
 oe_msn_pap_a3_subdue_rienzo_rome_desc:0 "卡比托利欧山上保民官的煽动与贵族私斗令罗马久陷动荡。平定市政风波并重建秩序，为永恒之城复兴奠定[stability|e]根基。"
 oe_msn_pap_a3_subdue_rienzo_rome_req_tt:0 "直接控制罗马且稳定度至少为 10，并已处置科拉·迪·里恩佐风波（或已定都罗马／确立阿维尼翁高卢教廷）。"
 oe_msn_pap_a4_end_western_schism:0 "终结西方教会大分裂"
 oe_msn_pap_a4_end_western_schism_desc:0 "平息伪教宗纷争、令全欧天主教诸邦重归唯一三重冕权威之下，圣座由此以无上[devotion|e]与威望终结西方教会大分裂。"
 oe_msn_pap_a4_end_western_schism_req_tt:0 "进入文艺复兴时代，西方教会大分裂未处于激活状态，稳定度至少 12、虔诚度至少 75，且定都罗马或已启用阿维尼翁高卢教廷政体。"
 oe_msn_pap_b1_pacify_central_italy:0 "平定中意大利教宗腹地"
 oe_msn_pap_b1_pacify_central_italy_desc:0 "自拉齐奥越过亚平宁山脉贯通翁布里亚与安科纳边区，为教宗国构筑连接第勒尼安海与亚得里亚海的稳固腰带，大幅提升[tax|e]与[control|e]。"
 oe_msn_pap_b1_pacify_central_italy_req_tt:0 "自身或非主权属国控制罗马、佩鲁贾与安科纳。"
 oe_msn_pap_b2_unify_italian_peninsula:0 "一统意大利半岛"
 oe_msn_pap_b2_unify_italian_peninsula_desc:0 "自伦巴第平原、托斯卡纳穹顶直至那不勒斯海湾，意大利诸邦尽归圣彼得战旗之下，将半岛无匹的[trade|e]与[manpower|e]汇于一统。"
 oe_msn_pap_b2_unify_italian_peninsula_req_tt:0 "自身或非主权属国控制罗马、米兰、佛罗伦萨与那不勒斯。"
 oe_msn_pap_b3_proclaim_kingdom_of_god:0 "加冕地上天国（Regnum Dei）"
 oe_msn_pap_b3_proclaim_kingdom_of_god_desc:0 "教宗国彻底告别任列强宰割的脆弱邦国时代，以一统意大利之势加冕为地上天国（Regnum Dei），铸就神圣法统与无上[crown_power|e]。"
 oe_msn_pap_b3_proclaim_kingdom_of_god_req_tt:0 "执行《宣告建立地上天国》决议或启用地上天国政体改革。"
 oe_msn_pap_b4_charter_cardinal_legations:0 "建制枢机特使大教区网"
 oe_msn_pap_b4_charter_cardinal_legations_desc:0 "将外围征服疆域分授忠顺的枢机特使大教区治理，化辽阔版图为秩序井然、心向罗马的[subjects|e]与[control|e]体系。"
 oe_msn_pap_b4_charter_cardinal_legations_req_tt:0 "稳定度至少为 15，且至少拥有 1 个枢机特使大教区附庸或控制至少 60 处领地（含属国）。"
 oe_msn_pap_c1_liberate_jerusalem_antioch:0 "光复耶路撒冷与安条克"
 oe_msn_pap_c1_liberate_jerusalem_antioch_desc:0 "将圣彼得双钥旗插上黎凡特海岸，圆三百年十字军宏愿：光复圣彼得首座安条克与圣墓之城耶路撒冷，耀扬[devotion|e]与[army|e]荣光。"
 oe_msn_pap_c1_liberate_jerusalem_antioch_req_tt:0 "自身或非主权属国同时控制耶路撒冷与安条克。"
 oe_msn_pap_c2_secure_alexandria:0 "克复亚历山大牧首圣座"
 oe_msn_pap_c2_secure_alexandria_desc:0 "将教宗旗帜升起在圣马可古老港城亚历山大之上，既收尼罗河三角洲之富，亦为圣座舰队掌控南地中海[market|e]咽喉。"
 oe_msn_pap_c2_secure_alexandria_req_tt:0 "自身或非主权属国控制亚历山大。"
 oe_msn_pap_c3_crown_constantinople:0 "加冕君士坦丁堡双海之冠"
 oe_msn_pap_c3_crown_constantinople_desc:0 "当教宗在圣索菲亚大教堂穹顶下主持大弥撒，旧罗马与新罗马自古典时代以来首次重归一体，圣座[prestige|e]登峰造极。"
 oe_msn_pap_c3_crown_constantinople_req_tt:0 "自身或非主权属国控制君士坦丁堡。"
 oe_msn_pap_c4_holy_papal_rome:0 "圣彼得罗马帝国：大祭司兼奥古斯都"
 oe_msn_pap_c4_holy_papal_rome_desc:0 "统御横跨欧亚非的五大牧首圣座，基督代理人将帝国紫袍披于三重冕之下，执掌政教合一的永恒罗马[crown_power|e]。"
 oe_msn_pap_c4_holy_papal_rome_req_tt:0 "执行《宣告圣彼得罗马帝国》决议或启用圣彼得罗马帝国政体改革。"
 oe_msn_pap_d1_high_renaissance_patron:0 "盛期文艺复兴最高庇护者"
 oe_msn_pap_d1_high_renaissance_patron_desc:0 "延揽一代建筑宗师、雕塑家与古典学者汇聚教廷，使罗马绽放全欧瞩目的学术之光、城市[development|e]与不朽[prestige|e]。"
 oe_msn_pap_d1_high_renaissance_patron_req_tt:0 "进入文艺复兴时代、接纳文艺复兴思潮，并拥有大教堂、大学、图书馆或艺术学院之一。"
 oe_msn_pap_d2_counter_reformation_bulwark:0 "反宗教改革特伦托铁壁"
 oe_msn_pap_d2_counter_reformation_bulwark_desc:0 "借神学院整肃、罗马教理问答与新生修会之力，特伦托教会力挽狂澜抵御分裂浪潮，筑就坚不可摧的[stability|e]与传教热忱。"
 oe_msn_pap_d2_counter_reformation_bulwark_req_tt:0 "进入宗教改革时代且稳定度至少为 12，并接纳教派主义思潮、虔诚度达 85 或完成特伦托铁壁事件。"
 oe_msn_pap_d3_heal_1054_schism:0 "弥合1054年东西教会大分裂"
 oe_msn_pap_d3_heal_1054_schism_desc:0 "无论是在大公会议上与拜占庭携手缔结双圣座合一，还是将君士坦丁堡直接收归圣彼得羽翼，横亘东西方数百年的分裂伤痕终得愈合。"
 oe_msn_pap_d3_heal_1054_schism_req_tt:0 "已与拜占庭召开普世大公会议（或达成东西合一）、控制君士坦丁堡，或拜占庭已不复存在。"
 oe_msn_pap_d4_eternal_universal_see:0 "永恒普世圣座（Urbi et Orbi）"
 oe_msn_pap_d4_eternal_universal_see_desc:0 "致罗马城与全世界（Urbi et Orbi）：大分裂弥合、意大利一统、枢机特使星罗棋布、五大牧首圣座尽复紫袍之下，圣彼得永恒圣座光耀万世。"
 oe_msn_pap_d4_eternal_universal_see_req_tt:0 "稳定度至少为 18、拥有帝国位阶、控制罗马，并启用地上天国或圣彼得罗马帝国政体改革。"
 oe_pap.1.title:0 "阿维尼翁之囚：圣彼得宝座的抉择"
 oe_pap.1.desc:0 "罗纳河奔涌脚下，阿维尼翁教宗宫的巍峨石塔拔地而起；千里之外的罗马城却沦为科隆纳与奥尔西尼两大家族私斗的战场。法兰西籍枢机力劝教宗本笃十二世永驻高卢、借西欧官僚与外交网总揽教务，意大利特使则恳求整军收复罗马涅并筹备重返圣彼得永恒之城。"
 oe_pap.1.a:0 "筹备阿尔沃诺斯收复罗马涅，矢志重返罗马"
 oe_pap.1.b:0 "永驻阿维尼翁：铸就高卢主权教廷（IF线）"
 oe_pap.2.title:0 "阿尔沃诺斯与《埃吉迪乌斯法》"
 oe_pap.2.desc:0 "曾身经百战的卡斯蒂利亚红衣主教吉尔·德·阿尔沃诺斯向教宗御前会议献上平定中意大利的全盘方略：一方面以铁腕兵锋扫平罗马涅、马尔凯与翁布里亚的割据领主，另一方面颁行《埃吉迪乌斯法典》确立教宗国绵延数世纪的法制根基。"
 oe_pap.2.a:0 "授阿尔沃诺斯全权节钺，铁腕收复罗马涅"
 oe_pap.2.b:0 "颁行《埃吉迪乌斯法典》，怀柔诸城邦纳贡归附"
 oe_pap.3.title:0 "1347年科拉·迪·里恩佐罗马起义"
 oe_pap.3.desc:0 "身披白袍立于卡比托利欧台阶之上，罗马公证人科拉·迪·里恩佐自号“自由、和平与正义保民官”，率市民驱逐跋扈封建贵族并宣称复兴古罗马共和。教宗特使是立即发兵镇压这位危险的煽动者，还是以市民宪章收编罗马公社、借力削平豪门？"
 oe_pap.3.a:0 "发兵粉碎伪保民官，重立教宗直辖市政官"
 oe_pap.3.b:0 "颁赐罗马公社市民宪章，借市民之力制衡豪族"
 oe_pap.4.title:0 "凯旋重返永恒之城罗马"
 oe_pap.4.desc:0 "从台伯河畔到阿文提诺山，满城钟声齐鸣，恭迎教宗圣驾经圣保罗门重返罗马。阔别罗纳河数十载后，圣彼得继承人再度于拉特兰与梵蒂冈圣丘降福苍生。教廷将如何奠定这场历史性回归的格局？"
 oe_pap.4.a:0 "祝圣梵蒂冈与拉特兰，永固永恒之城核心地位"
 oe_pap.4.b:0 "保留阿维尼翁驻节署，筑就沟通西欧的双重外交桥梁"
 oe_pap.5.title:0 "阿维尼翁高卢教廷：西欧神权霸业"
 oe_pap.5.desc:0 "矗立于阿维尼翁教宗宫大理石长廊之上，教廷枢密院从容调度自巴黎至阿拉贡的枢机、银行家与各国使节。既已择定高卢新枢，圣座是与法兰西王室缔结牢不可破的法教政教协定，还是依托罗纳河与普罗旺斯确立超然独立的西欧神权霸业？"
 oe_pap.5.a:0 "缔结阿维尼翁法教政教协定，共主西欧外交"
 oe_pap.5.b:0 "宣告罗纳—普罗旺斯独立教廷霸权"
 oe_pap.6.title:0 "地上天国（Regnum Dei）加冕大典"
 oe_pap.6.desc:0 "自米兰以北的阿尔卑斯关隘至那不勒斯的碧海港湾，全意大利万座钟楼齐鸣，欢呼教宗宣告建立地上天国（Regnum Dei）。身披帝国御袍而不失圣彼得双钥之尊，圣座将如何定型这座神圣意大利帝国？"
 oe_pap.6.a:0 "将一统意大利祝圣为圣教铁血圣堡"
 oe_pap.6.b:0 "兴建全意教区商贸同盟，涵养天国富庶"
 oe_pap.7.title:0 "枢机特使大教区授印大典"
 oe_pap.7.desc:0 "新任枢机特使单膝跪于教宗宝座前，受领红衣方帽、银质牧杖与铅印诏书，奉命代牧新附边疆大教区。圣座将敕命诸枢机特使大教区以边防要塞军务为重，还是以牧灵改宗与地方兴盛为先？"
 oe_pap.7.a:0 "敕令诸特使大教区专精边防堡垒与圣战军备"
 oe_pap.7.b:0 "敕令诸特使大教区广行牧灵改宗与民政兴农"
 oe_pap.8.title:0 "圣彼得罗马帝国"
 oe_pap.8.desc:0 "罗马、君士坦丁堡、耶路撒冷、亚历山大与安条克五大圣座尽归双钥旗下。当教宗宣告圣彼得罗马帝国复兴之际，德意志诸侯使节屏息待命：圣座究竟是册封神圣罗马皇帝为从属的“教会世俗护持者（Advocatus Ecclesiae）”，还是直接收回全部罗马皇帝法统、独揽政教至尊？"
 oe_pap.8.a:0 "册封皇帝为“教会世俗护持者”，以礼怀柔德意志诸侯"
 oe_pap.8.b:0 "收回全部罗马帝冠法统：大祭司兼奥古斯都独尊天下！"
 oe_pap.9.title:0 "罗马与君士坦丁堡普世大公会议"
 oe_pap.9.desc:0 "拉丁红衣主教与希腊都主教齐聚壁画穹顶之下，直面横亘数百年的1054年东西教会大分裂。在封印诏书送往金角湾之前，教宗须决断罗马的立场：是倡议尊重东方礼仪的平等双圣座基督教合一，还是强硬要求君士坦丁堡无条件臣服罗马首席权威？"
 oe_pap.9.a:0 "倡议平等的双圣座基督教合一，共愈千年裂痕"
 oe_pap.9.b:0 "强索罗马教宗无条件首席权威，令东方归顺"
 oe_pap.10.title:0 "罗马特使抵临圣索菲亚"
 oe_pap.10.desc:0 "身披绯红法衣的教宗特使将罗马大公会议的诏书呈于君士坦丁堡皇座之前。东罗马元老与主教们激辩不已：是签署双圣座基督教合一盟约、彻底弥合1054年大分裂并共抗外敌，还是断然回绝罗马条件、坚守东方教会自主正统？"
 oe_pap.10.a:0 "签署双圣座合一盟约，永弥1054年东西大分裂"
 oe_pap.10.b:0 "严辞回绝罗马条款，捍卫东方正教自主"
 oe_pap.11.title:0 "重建圣彼得大教堂"
 oe_pap.11.desc:0 "君士坦丁大帝时代所建的古圣彼得大教堂历经千年沧桑，木构屋梁已渐倾颓。深受古典罗马启迪的文艺复兴建筑巨匠献上惊世蓝图，愿于圣徒陵寝之上筑起人类史上最恢宏的大理石穹顶；而清廉改革派则主张修旧如旧，将巨款拨予罗马济贫院与医院。"
 oe_pap.11.a:0 "拨巨资兴建盛期文艺复兴圣彼得大穹顶"
 oe_pap.11.b:0 "修缮古教堂本殿，广设罗马医院与济贫基金"
 oe_pap.12.title:0 "教宗瑞士近卫队成军大典"
 oe_pap.12.desc:0 "身披锃亮胸甲、肩扛长戟的瑞士天主教精锐步兵列队步入罗马人民门，向教宗宣誓誓死效忠。圣座是正式授诏将其编为常设教廷瑞士近卫军团，还是把军费转向扩编本土意大利教宗卫队与雇佣兵团？"
 oe_pap.12.a:0 "正式颁诏建制常备教廷瑞士近卫军团"
 oe_pap.12.b:0 "扩编本土意大利教宗卫队与雇佣军团"
 oe_pap.13.title:0 "反宗教改革：特伦托神圣铁壁"
 oe_pap.13.desc:0 "阿尔卑斯山以北的印刷机日夜印行异端小册，动摇诸王国与主教区信仰根基。教廷召集神学家与改革派主教发起波澜壮阔的天主教自我革新：是以严明特伦托神学院与正统教理筑牢铁壁，还是广派耶稣会学者与教宗大使深入欧亚海外收复人心？"
 oe_pap.13.a:0 "厉行特伦托神学院整肃与正统教义铁壁"
 oe_pap.13.b:0 "广派耶稣会学者与教廷大使远赴列国宣教"
 oe_pap.14.title:0 "全天主教世界十字军贡赋云集"
 oe_pap.14.desc:0 "响应教宗普世十字军通谕，来自西班牙、法兰西、德意志、波兰与匈牙利的成车白银佛罗林与披挂十字徽章的志愿军源源涌入教宗海港。教廷总司库恭候圣裁：如何调配这股汇聚全欧的圣战洪流？"
 oe_pap.14.a:0 "全数投入野战主力与攻城炮队，锐不可当"
 oe_pap.14.b:0 "厚赐天主教盟邦并加固地中海十字军补给线"
 STATIC_MODIFIER_NAME_oe_pap_mod_law_transition:0 "教廷宪章颁行期"
 STATIC_MODIFIER_DESC_oe_pap_mod_law_transition:0 "教廷特使与各地主教正在圣彼得辖境宣谕新颁教宗宪章，短期内提升立法与虔诚凝聚力。"
 STATIC_MODIFIER_NAME_oe_pap_mod_regnum_dei_permanent:0 "地上天国永恒加冕"
 STATIC_MODIFIER_DESC_oe_pap_mod_regnum_dei_permanent:0 "以双钥一统意大利全境并宣告建立地上天国，为教宗帝国带来恒久的控制力、税政与威望。"
 STATIC_MODIFIER_NAME_oe_pap_mod_sanctum_imperium_permanent:0 "大祭司兼奥古斯都紫袍"
 STATIC_MODIFIER_DESC_oe_pap_mod_sanctum_imperium_permanent:0 "收复五大牧首圣座、将教宗三重冕与罗马奥古斯都紫袍熔于一炉，赋予帝国严明军纪、高昂士气与普世感召力。"
 STATIC_MODIFIER_NAME_oe_pap_mod_legation_charter:0 "教宗枢机特使大教区建制"
 STATIC_MODIFIER_DESC_oe_pap_mod_legation_charter:0 "新设的教区法庭、教宗驻军与税册体系迅速稳固了这座新封的枢机特使大教区。"
 STATIC_MODIFIER_NAME_oe_pap_mod_legation_militant:0 "尚武枢机特使大教区"
 STATIC_MODIFIER_DESC_oe_pap_mod_legation_militant:0 "奉教宗敕命修筑边防要塞并整训精兵，成为拱卫圣座的铁血盾牌。"
 STATIC_MODIFIER_NAME_oe_pap_mod_legation_pastoral:0 "牧灵兴盛枢机特使大教区"
 STATIC_MODIFIER_DESC_oe_pap_mod_legation_pastoral:0 "专力推行天主教教化、市政重建与教区繁荣，源源回馈圣座财赋。"
 STATIC_MODIFIER_NAME_oe_pap_mod_universal_crusade:0 "普世十字军总动员"
 STATIC_MODIFIER_DESC_oe_pap_mod_universal_crusade:0 "来自天主教欧洲各国的十字军志愿战士与什一税军资云集双钥旗下，士气与攻城锐不可当。"
 STATIC_MODIFIER_NAME_oe_pap_mod_return_preparations:0 "重返罗马筹备方略"
 STATIC_MODIFIER_DESC_oe_pap_mod_return_preparations:0 "教廷使节与军需司库稳步筹划收复中意大利与重返圣彼得陵寝的壮举。"
 STATIC_MODIFIER_NAME_oe_pap_mod_albornoz_campaign:0 "阿尔沃诺斯罗马涅铁血远征"
 STATIC_MODIFIER_DESC_oe_pap_mod_albornoz_campaign:0 "在红衣主教阿尔沃诺斯果断指挥下，教宗军锋横扫罗马涅割据领主并克复诸城堡垒。"
 STATIC_MODIFIER_NAME_oe_pap_mod_aegidian_code:0 "埃吉迪乌斯法典治理"
 STATIC_MODIFIER_DESC_oe_pap_mod_aegidian_code:0 "阿尔沃诺斯颁行的《埃吉迪乌斯法典》厘清教宗长官与自治市镇权责，稳固中意大利控御与税收。"
 STATIC_MODIFIER_NAME_oe_pap_mod_roman_curators:0 "教宗直辖罗马市政官署"
 STATIC_MODIFIER_DESC_oe_pap_mod_roman_curators:0 "铁腕平息卡比托利欧派系动乱后，教宗直辖官署牢牢掌控罗马与拉齐奥秩序。"
 STATIC_MODIFIER_NAME_oe_pap_mod_roman_commune:0 "罗马公社市民宪章"
 STATIC_MODIFIER_DESC_oe_pap_mod_roman_commune:0 "以市民宪章收编罗马公社，化市民热忱为永恒之城的商业繁荣与稳定税源。"
 STATIC_MODIFIER_NAME_oe_pap_mod_eternal_city_restored:0 "永恒之城罗马重光"
 STATIC_MODIFIER_DESC_oe_pap_mod_eternal_city_restored:0 "教宗重登台伯河畔宝座，四海朝圣者、学者与贡赋蜂拥而至，罗马再焕往昔神圣荣光。"
 STATIC_MODIFIER_NAME_oe_pap_mod_avignon_bridge:0 "阿维尼翁—罗马双重外交桥"
 STATIC_MODIFIER_DESC_oe_pap_mod_avignon_bridge:0 "在阿维尼翁保留常设枢机驻节署，维系圣座对法兰西、勃艮第及西欧诸王国的深远外交影响。"
 STATIC_MODIFIER_NAME_oe_pap_mod_gallic_concordat:0 "阿维尼翁法教政教同盟"
 STATIC_MODIFIER_DESC_oe_pap_mod_gallic_concordat:0 "法兰西王冠与阿维尼翁教廷紧密协作，显著增强外交威望、商贸收益与学术声誉。"
 STATIC_MODIFIER_NAME_oe_pap_mod_rhone_curia:0 "罗纳河主权教廷霸权"
 STATIC_MODIFIER_DESC_oe_pap_mod_rhone_curia:0 "将阿维尼翁建成独立自主的西欧要塞教都，全面增强军纪、防务与行政掌控。"
 STATIC_MODIFIER_NAME_oe_pap_mod_regnum_dei_zeal:0 "地上天国圣战锐气"
 STATIC_MODIFIER_DESC_oe_pap_mod_regnum_dei_zeal:0 "汇聚一统意大利之兵威，地上天国大军以铁血军纪与高昂圣战锐气所向披靡。"
 STATIC_MODIFIER_NAME_oe_pap_mod_italian_dioceses:0 "全意教区商贸同盟"
 STATIC_MODIFIER_DESC_oe_pap_mod_italian_dioceses:0 "打通米兰、佛罗伦萨、罗马与那不勒斯关税壁垒，推动地上天国海陆贸易与生产空前繁荣。"
 STATIC_MODIFIER_NAME_oe_pap_mod_advocatus_ecclesiae:0 "教会世俗护持者帝国宪章"
 STATIC_MODIFIER_DESC_oe_pap_mod_advocatus_ecclesiae:0 "以礼收编神圣罗马皇帝为教会世俗护持者，大幅增进全欧外交威信、附庸忠诚与教廷声望。"
 STATIC_MODIFIER_NAME_oe_pap_mod_pontifex_augustus:0 "奥古斯都政教合一绝对主权"
 STATIC_MODIFIER_DESC_oe_pap_mod_pontifex_augustus:0 "将世俗罗马帝冠直接收归圣彼得宝座，极大增强攻伐效率、军纪与帝国中枢权威。"
