# NEW 2026-11-24 v25.0 Phase 4B 1337 Muscovy/Russia Deep Flavor & Mechanic Pack (oe_v250_mos_, gen_v250_1337_mos_yua.py) — simp_chinese localization (179 keys). Edit gen_v250_1337_mos_yua.py, not this file.
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_yarlyk_patronage:0 "弗拉基米尔敕令与萨莱庇佑"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_yarlyk_patronage:0 "莫斯科如数缴清岁贡以维系金帐汗国敕封的大公权威，邻邦诸公慑于汗庭声势而莫敢轻动，然国库银赋颇为吃紧。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kalita_moneybag:0 "卡利塔钱袋·截留贡银"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kalita_moneybag:0 "大公暗中截留罗斯诸城贡银充入莫斯科私库以赎买采邑，财力渐丰而萨莱猜忌与银币贬值隐忧俱增。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_rus_tax_leniency:0 "罗斯市镇宽赋怀柔"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_rus_tax_leniency:0 "莫斯科大公酌减商民与农庄贡额以收东北罗斯人心，城乡市井渐次苏息，惟短期岁入显减。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_metropolitan_seat:0 "圣彼得都主教驻跸莫斯科"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_metropolitan_seat:0 "基辅及全罗斯都主教公署长驻克里姆林圣母升天大教堂，赋予莫斯科无可替代的东正教法统，同时扩大了教会免税权势。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kremlin_ramparts:0 "博罗维茨基山克里姆林重垣"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kremlin_ramparts:0 "大兴土木加筑橡木石基堡垒与莫斯科河护城壕，令都城固若金汤，而木石夫役与城防维护令司库捉襟见肘。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_secular_fisc:0 "大公核查修院田赋"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_secular_fisc:0 "大公府坚持向主教领地征课军役修城银，稳住王室岁入与权威，却引起高级教士集团微词。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_sarai_embassy:0 "萨莱厚礼使团压制特维尔"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_sarai_embassy:0 "莫斯科遣使携貂皮重礼奔赴伏尔加河下游疏通汗廷权贵，成功压倒特维尔诉求并威服附庸，然宫廷礼赠耗费甚巨。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_western_marches:0 "西疆边防严阵以待"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_western_marches:0 "莫斯科拒绝低声下气求和，转而在莫扎伊斯克与沃洛科拉姆斯克增兵筑堡防备特维尔与立陶宛，邻邦皆感剑拔弩张。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_upper_volga_truce:0 "伏尔加河上游诸公休兵约"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_upper_volga_truce:0 "莫斯科与特维尔暂订商路通好盟约，河谷商旅畅行、内政安稳，而军中鹰派则嫌锐气渐钝。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_trinity_colonization:0 "圣三一修道院北疆林海拓垦"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_trinity_colonization:0 "拉多涅日的圣谢尔盖门徒深入伏尔加河外密林广建修院与垦荒村落，极大推动北方教化与移民，却触动大波雅尔圈地之利。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_boyar_votchina_guard:0 "庇护波雅尔世袭领地"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_boyar_votchina_guard:0 "大公府限制修道院无度兼并农庄、保障波雅尔世袭采邑兵源，重装侍卫骑兵源源不绝，惟修院高僧颇觉寒心。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_sergius_concord:0 "谢尔盖荒原共治宪章"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_sergius_concord:0 "大公居中裁定修院与世俗领主共分北方荒地界址，边疆管治更为有序，然朝廷亦须让渡部分拓垦田租。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_vykhod_defiance:0 "趁萨莱大乱停缴岁贡"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_vykhod_defiance:0 "莫斯科趁金帐汗国群雄火并之机断然停缴岁贡，将白银悉数用于扩军整武，士气大振而草原敌意骤升。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_steppe_arbitrage:0 "草原群汗间权变斡旋"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_steppe_arbitrage:0 "莫斯科改缴轻额岁贡并在萨莱诸汗之间纵横捭阖，稳住伏尔加商道免遭劫掠，然国内主战派嗤其委曲求全。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_heartland_hoard:0 "截留贡银充实仓廪工坊"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_heartland_hoard:0 "将暂扣的贡银投入奥卡河谷谷仓与铁匠工坊，民生百业欣欣向荣，却因军备分润不足惹来武勋贵族不满。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_white_stone_kremlin:0 "德米特里白石克里姆林"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_white_stone_kremlin:0 "采掘米亚奇科沃白色石灰岩筑成东北罗斯首座石砌巨城，足以抵御立陶宛与草原兵锋，惟庞大工费与常年修缮压重财政。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_oka_abatis_line:0 "奥卡河木垒边城防线"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_oka_abatis_line:0 "将建材分拨科洛姆纳与谢尔普霍夫等南疆渡口修筑连环木石寨堡，分散防卫压力却拖慢了内地城镇营建。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_mobile_druzhina:0 "大公亲兵机动骑队"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_mobile_druzhina:0 "暂缓耗资巨大的石城工程、专意装备精甲马队主动出击野战，骑兵冲击凌厉而守城工事略显薄弱。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kulikovo_crusade:0 "库里科沃原野全罗斯圣战"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kulikovo_crusade:0 "诸公义师在圣谢尔盖祝圣下会师科洛姆纳并渡过顿河迎击马迈大军，军纪与决死士气空前高涨，而国力疲敝与军费亦骤然飙升。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_princely_coalition_charter:0 "全罗斯诸公联军自治特许"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_princely_coalition_charter:0 "为换取雅罗斯拉夫尔、罗斯托夫与白湖诸公倾力出兵，莫斯科让渡地方司法与税赋自主权，兵源充沛而中央集权受挫。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_oka_defensive_muster:0 "固守奥卡河渡口持重之策"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_oka_defensive_muster:0 "避开草原大军锋芒、依托奥卡河北岸深沟高垒节节阻击，保全堡垒与国库，却难振全罗斯奋勇破敌之气。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_heartland_remission:0 "劫后宽赋·重建莫斯科腹地"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_heartland_remission:0 "脱脱迷失火焚郊郭后，大公颁诏数年蠲免遭灾城镇田赋与兵役，流民渐返故土、民生复苏，惟军政岁入一度锐减。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_border_conscription:0 "严苛边防征兵与常备戍卒"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_border_conscription:0 "吸取惨痛教训厉行全境兵役征召与城墙戒严，大军迅速补齐防线，却令饱经劫难的乡里复苏迟缓、怨声暗起。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_guild_reconstruction:0 "借债商帮复兴市集工坊"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_guild_reconstruction:0 "向苏罗日与伏尔加豪商举债重修市集与作坊，商货迅速回暖，同时令通货偏松、市民阶层权势日隆。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_autocratic_primogeniture:0 "肃清旁支分封·确立嫡长专制"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_autocratic_primogeniture:0 "历经瓦西里二世与舍米亚卡惨烈内战后，莫斯科彻底折断加利奇等旁支采邑羽翼，大公专制与控制力大增而旧贵族怨愤难平。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_appanage_compact:0 "宗室采邑分权妥协盟约"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_appanage_compact:0 "大公向留里克宗室诸王公承诺保留世袭采邑与议政席位以息干戈，诸邦和睦而莫斯科集权大计被迫延宕。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kasimov_auxiliaries:0 "卡西莫夫鞑靼效忠骑军"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kasimov_auxiliaries:0 "在奥卡河畔赐封归附鞑靼汗裔建置卡西莫夫骑军助平内乱，轻骑突袭如虎添翼，却引发东正教士严厉非议。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_autocephaly_1448:0 "1448年俄罗斯东正教自主牧首权"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_autocephaly_1448:0 "莫斯科拒绝《佛罗伦萨合一诏书》并自行祝圣约拿为全罗斯都主教，东正教正统凝聚力空前高涨，然亦更趋排斥西欧学艺与外交妥协。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_constantinople_concord:0 "君士坦丁堡教法通好"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_constantinople_concord:0 "大公坚持与君士坦丁堡牧首区保持教法沟通并延纳希腊学者，外交与学术受惠，却招致本土保守主教质疑大公护教之心。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_crown_church_oversight:0 "大公直接督察主教推选"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_crown_church_oversight:0 "大公府借拒斥合一之机收紧对主教推选与修院财源的世俗监理，皇权与税赋获益，而圣职阶层大为不满。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_veche_bell_silenced:0 "摘除诺夫哥罗德民会大钟"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_veche_bell_silenced:0 "将诺夫哥罗德民会大钟运往莫斯科并迁徙豪商波雅尔至内地，王权统合与田赋大增，却令波罗的海汉萨商站一度萧条。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_novgorod_fur_charter:0 "诺夫哥罗德毛皮与汉萨商约"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_novgorod_fur_charter:0 "莫斯科在确立宗主权后保留诺夫哥罗德商团与圣彼得商站特权，海贸与毛皮银钱滚滚而来，惟市民豪商权势牵制王权。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_northern_fur_monopoly:0 "王室垄断北德维纳毛皮贡贸"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_northern_fur_monopoly:0 "由大公库房直管德维纳河与白海黑貂皮收购与定价，财政与产出稳健，却引发内外商帮怨怼。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_pomestye_ugra_triumph:0 "采邑服役骑军与乌格拉河大捷"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_pomestye_ugra_triumph:0 "没收旧领分赐忠于大公的采邑服役贵族并在乌格拉河彻底终结鞑靼枷锁，罗斯军纪与骑兵兵源跃升新境，代价是旧贵离心与农奴束缚加深。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_duma_service_compromise:0 "波雅尔杜马与采邑折衷制"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_duma_service_compromise:0 "在推广采邑服役的同时保留大波雅尔世袭领地与杜马议政体统，朝野士气和谐而税赋革新步履稍缓。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_ugra_gunpowder_wall:0 "乌格拉河火炮渡口阵线"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_ugra_gunpowder_wall:0 "重金聘请工匠铸造青铜火炮与火绳铳列阵乌格拉河冰岸吓退大帐汗国，攻城守险威力大增而军费与精兵招募益加吃紧。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_gosudar_all_rus:0 "全罗斯君主尊号"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_gosudar_all_rus:0 "以莫斯科与弗拉基米尔双城正统昭告天下自称「全罗斯君主」，王权与法统威仪大张，而旧领主与地方抗拒仍须持续压制。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_sudebnik_1497:0 "《1497年全罗斯法典》"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_sudebnik_1497:0 "统一全境司法衙门规程、定立圣尤里节农人迁徙限制与统一度量税则，行政效率骤升，代价是乡民自由受限与官署开销攀升。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kremlin_cannon_yard:0 "莫斯科克里姆林皇家铸炮厂"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kremlin_cannon_yard:0 "延揽弗里亚津等意大利建筑与铸炮名匠在涅格林纳亚河畔建厂铸造重炮，大幅增强攻防火力，同时推高常备军与要塞维护费用。"
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_northern_monasteries:0 "北方林海修道院敕封宪章"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_northern_monasteries:0 "敕赐白湖与索洛韦茨基等北方修院免税荒原以广开农盐与教化，同化与繁荣并进，惟世俗田税让渡教会甚多。"
 oe_v250_mos_ref_yarlyk_treasury:0 "大公国库与贡税书吏制"
 oe_v250_mos_ref_yarlyk_treasury_desc:0 "以莫斯科克里姆林金库与专职书吏统筹全境岁贡折算、采邑赎买与税册清查，提升内阁效率、王室权力与田赋岁入，同时招致旧波雅尔抵触与宫廷文牍开支上升。"
 oe_v250_mos_ref_pomestye_service_nobility:0 "采邑服役贵族专制"
 oe_v250_mos_ref_pomestye_service_nobility_desc:0 "将国库田产按军功分授终生服役骑兵贵族，显著扩充常备兵源、重骑战力与陆军士气，代价是农奴人身依附加深、农民满意度下滑且学术革新趋缓。"
 oe_v250_mos_priv_mestnichestvo_charter:0 "波雅尔门第序列特许"
 oe_v250_mos_priv_mestnichestvo_charter_desc:0 "确认莫斯科大波雅尔家族按先祖官阶世袭军政席次的「门第制」特权，换取贵族忠顺、精锐重骑与城防协守，代价是贵族势力膨胀并明显掣肘内阁效率与王室权威。"
 oe_v250_mos_priv_monastic_votchina_immunity:0 "伏尔加河外修道院免税特许"
 oe_v250_mos_priv_monastic_votchina_immunity_desc:0 "赐予圣三一与白湖诸大修道院林海领地司法与税赋豁免权，大力助推北方人口繁衍、同化与东正教威望，惟教会势大且直接侵蚀王室岁入。"
 oe_v250_mos_cab_vykhod_census:0 "土地普查册与贡税核查"
 oe_v250_mos_cab_vykhod_census_desc:0 "派遣莫斯科大公书吏深入目标行省清丈耕地户籍、编纂《土地普查册》并严查隐匿贡税，提升行省控制上限、月度控制与产出以及全国税收，同时招致乡民抵触。"
 oe_v250_mos_cab_vykhod_census_action:0 "土地普查册与贡税核查：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mos_cab_vykhod_census_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行土地普查册与贡税核查"
 oe_v250_mos_cab_vykhod_census_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_vykhod_census_action_progress_wordier:0 "土地普查册与贡税核查（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_vykhod_census_action_progress_tooltip:0 "派遣莫斯科大公书吏深入目标行省清丈耕地户籍、编纂《土地普查册》并严查隐匿贡税，提升行省控制上限、月度控制与产出以及全国税收，同时招致乡民抵触。"
 oe_v250_mos_cab_vykhod_census_select_province:0 "选择一个行省派遣莫斯科土地普查书吏"
 oe_v250_mos_cab_vykhod_census_no_provinces:0 "@trigger_no! 当前没有可供编纂土地普查册的合格行省。"
 oe_v250_mos_cab_zasechnaya_abatis:0 "南部鹿砦边防修筑"
 oe_v250_mos_cab_zasechnaya_abatis_desc:0 "调集边境军匠与守备队在目标边疆或要塞行省伐木设障、修筑连环鹿砦木寨与烽燧，显著加固城防、守军补充与全国兵源，代价是堡垒维护攀升与微幅税损。"
 oe_v250_mos_cab_zasechnaya_abatis_action:0 "南部鹿砦边防修筑：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mos_cab_zasechnaya_abatis_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行南部鹿砦边防修筑"
