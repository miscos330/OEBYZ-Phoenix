 oe_v250_mos_cab_zasechnaya_abatis_action_progress_wordier:0 "南部鹿砦边防修筑（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_zasechnaya_abatis_action_progress_tooltip:0 "调集边境军匠与守备队在目标边疆或要塞行省伐木设障、修筑连环鹿砦木寨与烽燧，显著加固城防、守军补充与全国兵源，代价是堡垒维护攀升与微幅税损。"
