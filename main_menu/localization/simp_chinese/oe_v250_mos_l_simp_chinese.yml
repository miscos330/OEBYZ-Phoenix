 oe_v250_mos_dec_sovereign_of_all_rus.title:0 "宣称「全罗斯君主」尊号"
 oe_v250_mos_dec_sovereign_of_all_rus.desc:0 "兼领莫斯科与弗拉基米尔双城并统辖东北罗斯诸邦后，以留里克嫡脉之名正式昭告天下称「全罗斯君主」（Gosudar）。花费 #Y 150#! 金币，永久获得 #Y 全罗斯君主尊号#!（提升王室权力、法统与外交声望，同时带来旧贵族不满与稳定度维系压力）。"
 oe_v250_mos_dec_sovereign_of_all_rus.a:0 "加冕为全罗斯君主！"
 oe_v250_mos_dec_sudebnik_code.title:0 "颁行《1497年全罗斯法典》"
 oe_v250_mos_dec_sudebnik_code.desc:0 "由大公书吏与法学家汇纂全罗斯第一部统一成文法典，规范大公法庭诉讼、统一税课标准并厘定圣尤里节农户迁徙条例。需到达 #Y 1450年#! 并花费 #Y 140#! 金币，永久获得 #Y 《1497年全罗斯法典》#!（提升税收、内阁与立法效率，同时增加农民不满与宫廷行政开销）。"
 oe_v250_mos_dec_sudebnik_code.a:0 "昭告全境颁行《全罗斯法典》"
 oe_v250_mos_dec_expand_kremlin_arsenal.title:0 "营建莫斯科克里姆林铸炮厂"
 oe_v250_mos_dec_expand_kremlin_arsenal.desc:0 "延聘名匠在莫斯科涅格林纳亚河畔设立皇家铸炮作坊，批量铸造青铜攻城巨炮与城防要塞炮。需到达 #Y 1440年#!、掌控莫斯科并花费 #Y 180#! 金币，永久获得 #Y 莫斯科克里姆林皇家铸炮厂#!（提升围城与城防能力，同时提高常备军与要塞维护负担）。"
 oe_v250_mos_dec_expand_kremlin_arsenal.a:0 "拨银兴建皇家铸炮厂"
 oe_v250_mos_dec_northern_monastic_grants.title:0 "敕封北方林海修道院"
 oe_v250_mos_dec_northern_monastic_grants.desc:0 "每 #Y 15年#! 可颁赐一次北方荒原修院宪章，花费 #Y 90#! 金币资助白湖与林海修院开辟农盐与传教，获得宗教影响力与 #Y 12年#! 的 #Y 北方林海修道院敕封宪章#!（加快同化、传教与繁荣，同时让渡部分税赋与教会权力）。"
 oe_v250_mos_dec_northern_monastic_grants.a:0 "颁赐北方修道院拓垦敕书"
 oe_v250_mos_monastic_cd_tt:0 "近15年内未曾敕封过北方林海修道院"
 oe_v250_mos.1.t:0 "弗拉基米尔敕令与金帐贡税官"
 oe_v250_mos.1.d:0 "莫斯科大公伊凡一世·卡利塔凭借金帐汗月即别颁赐的弗拉基米尔大公敕令，得以代汗庭向东北罗斯诸公国统一征收「维霍德」岁贡。如今秋收甫毕，萨莱汗廷的驿使已抵克里姆林宫外催解白银：若全额解运，可牢牢稳住汗国刀兵作为莫斯科压倒群雄的后盾；若巧立账目暗留盈余充入大公「钱袋」，便可大举赎买周边采邑；亦可酌情减免各城镇课额以收罗斯民心。"
 oe_v250_mos.1.a:0 "如数解缴全额岁贡，换取萨莱汗廷力挺莫斯科"
 oe_v250_mos.1.b:0 "暗留贡银充实「钱袋」，伺机赎买周边采邑"
 oe_v250_mos.1.c:0 "酌减东北罗斯市镇贡额，以宽仁收拢人心"
 oe_v250_mos.2.t:0 "圣彼得都主教驻跸与克里姆林营建"
 oe_v250_mos.2.d:0 "自全罗斯都主教圣彼得将教座迁往莫斯科并安葬于圣母升天大教堂以来，博罗维茨基山已成为全罗斯东正教徒朝圣的精神中枢。如今大公与希腊裔都主教狄奥格诺斯托斯在教堂广场商议都城营建：是广赐修院与大教堂香火田庄以铸就无上教法权威，还是倾尽国库先行加厚克里姆林护城重垣，抑或向富庶教区摊派城防税以减轻库银重压？"
 oe_v250_mos.2.a:0 "厚赐都主教公署与教堂广场，确立全罗斯教法中枢"
 oe_v250_mos.2.b:0 "倾资优先加筑博罗维茨基山克里姆林重垣"
 oe_v250_mos.2.c:0 "向教会田庄摊派城防军税以保国库充裕"
 oe_v250_mos.3.t:0 "特维尔之争与伏尔加萨莱使节"
 oe_v250_mos.3.d:0 "伏尔加河上游的特维尔公国从未放弃对弗拉基米尔大公之位的争夺，不仅频频与立陶宛大公阿尔吉尔达斯联姻结盟，更派遣重臣沿伏尔加河顺流南下向札尼别汗行贿告状。莫斯科必须立即决断：是以更丰厚的黑貂皮与金银厚礼在萨莱压垮对手，还是在莫扎伊斯克与沃洛科拉姆斯克筑垒厉兵防备西疆夹击，抑或暂与特维尔订约通商以图后计？"
 oe_v250_mos.3.a:0 "携黑貂重礼赴萨莱行贿，借汗廷敕旨压制特维尔"
 oe_v250_mos.3.b:0 "增筑西疆堡垒与重兵戍卫，严防特维尔与立陶宛联手"
 oe_v250_mos.3.c:0 "倡议伏尔加河上游诸公休兵通商，暂缓正面交锋"
 oe_v250_mos.4.t:0 "拉多涅日圣谢尔盖与圣三一院"
 oe_v250_mos.4.d:0 "在莫斯科以北苍茫的针叶密林深处，苦修长老拉多涅日的谢尔盖将简陋木堂化为严守共住清规的圣三一修道院。其门徒已纷纷北渡伏尔加河在荒原密林中开辟分院、吸引大批农夫与猎户定居垦殖；然而众多波雅尔豪族却联名上书，抱怨免税修院正不断吸走世袭采邑上的劳力与林地。"
 oe_v250_mos.4.a:0 "颁赐圣三一修道院北疆林海拓垦特许，广弘东正教化"
 oe_v250_mos.4.b:0 "裁定保障波雅尔世袭采邑界址，限缩修院圈地特权"
 oe_v250_mos.4.c:0 "由大公府居中勘定修院与世俗荒原界约"
 oe_v250_mos.5.t:0 "萨莱大乱"
 oe_v250_mos.5.d:0 "别儿迪别汗遇弑之后，金帐汗国陷入史称「大乱」的惨烈内讧，萨莱城头数年间走马灯般更迭十余位可汗，权臣马迈更在草原西翼拥兵自重。莫斯科杜马议事厅内群情激昂：有人力主断然停缴「维霍德」岁贡、趁势扩编罗斯铁骑；亦有人主张姑且少额输贡以挑拨草原诸派相残，或将扣留银两悄然转为内地粮仓与工坊资本。"
 oe_v250_mos.5.a:0 "断然停缴「维霍德」岁贡，以白银重整莫斯科军备"
 oe_v250_mos.5.b:0 "酌缴薄贡纵横草原诸汗，保全伏尔加商道安宁"
 oe_v250_mos.5.c:0 "将暂扣银两低调转作内地仓廪与铁匠作坊之资"
 oe_v250_mos.6.t:0 "顿斯科伊的白石克里姆林"
 oe_v250_mos.6.d:0 "全城大火将昔日橡木克里姆林付之一炬，而西面的立陶宛大公阿尔吉尔达斯与南方的草原铁骑正虎视眈眈。年轻的大公德米特里毅然下令从米亚奇科沃采石场沿莫斯科河运来数以万吨计的洁白石灰岩，筹建东北罗斯史上首座石砌巨城；但司库亦提醒，与其孤注一掷于都城石墙，或许分筑奥卡河边塞或扩编机动亲兵骑队更为稳妥。"
 oe_v250_mos.6.a:0 "开采米亚奇科沃白石，筑成屹立莫斯科河畔的石砌克里姆林"
 oe_v250_mos.6.b:0 "将建材分散修筑科洛姆纳与奥卡河渡口连环边堡"
 oe_v250_mos.6.c:0 "仅修简陋土垣，将库银悉数武装机动亲兵重骑"
 oe_v250_mos.7.t:0 "库里科沃原野大集结"
 oe_v250_mos.7.d:0 "权臣马迈挟草原大军并热那亚步兵浩荡北犯，誓要踏平桀骜不驯的莫斯科。大公德米特里传檄东北罗斯诸邦会师科洛姆纳，拉多涅日的圣谢尔盖更遣武僧佩列斯韦特与奥斯利亚比亚随军祝圣。面对百年未有之决战，大公须抉择：倾全国之力渡顿河决一死战，向附庸诸公让渡自治宪章以换取联军倾巢出动，还是固守奥卡河北岸险津消耗敌锋？"
 oe_v250_mos.7.a:0 "高举圣像横渡顿河，动员全罗斯义师决战库里科沃"
 oe_v250_mos.7.b:0 "向诸公颁赐宽厚采邑自治宪章，换取联军倾力驰援"
 oe_v250_mos.7.c:0 "持重退守奥卡河渡口堡垒，待草原大军师老兵疲"
 oe_v250_mos.8.t:0 "脱脱迷失突袭后的腹地重建"
 oe_v250_mos.8.d:0 "顿河捷报墨迹未干，新任金帐大汗脱脱迷失便以雷霆之势突袭奥卡河谷，莫斯科近郊木郭与周边市镇惨遭焚掠、仓廪空虚。站在焦土与新木之间，大公府面临紧迫抉择：颁行多年免税宽诏让劫后余生的乡民与工匠重归家园，厉行铁腕征兵补齐南疆戍卒以防草原再度南下，还是向苏罗日与伏尔加商帮举债加速市集复苏？"
 oe_v250_mos.8.a:0 "颁行多年田赋蠲免诏，招抚流民重建烧毁市镇"
 oe_v250_mos.8.b:0 "厉行紧急兵役征召与南疆戒严，杜绝草原二度突袭"
 oe_v250_mos.8.c:0 "向苏罗日与伏尔加商帮借贷，加速工坊与市集重兴"
 oe_v250_mos.9.t:0 "莫斯科封建内战"
 oe_v250_mos.9.d:0 "德米特里·顿斯科伊遗嘱中关于父死子继与兄终弟及的条文冲突终于酿成大祸：兹韦尼哥罗德与加利奇支系王公——先是尤里，继而是斜眼瓦西里与德米特里·舍米亚卡——公然举兵争夺莫斯科大公宝座。这场漫长的骨肉内战将决定罗斯的宪政命运：是铁血铲除旁支分封确立父子嫡传专制，是向宗室妥协保留分权采邑，还是引归附的卡西莫夫鞑靼骑兵平定内乱？"
 oe_v250_mos.9.a:0 "铁腕肃清加利奇旁支分封，永定父死子继专制法统"
 oe_v250_mos.9.b:0 "与留里克宗室诸王公达成妥协盟约，保全采邑旧制"
 oe_v250_mos.9.c:0 "在奥卡河畔赐封卡西莫夫鞑靼效忠骑军助平叛乱"
 oe_v250_mos.10.t:0 "1448年俄罗斯东正教会自主牧首权"
 oe_v250_mos.10.d:0 "昔日都主教伊西多尔在佛罗伦萨公会议上签署臣服罗马教宗的合一诏书，旋即被莫斯科怒斥为背教者并投入囚室。今岁罗斯诸教区主教齐集克里姆林圣母升天大教堂，提议不再等候君士坦丁堡牧首批准，径行祝圣梁赞主教约拿为全罗斯都主教——由此开启俄罗斯教会事实上的独立自主纪元。"
 oe_v250_mos.10.a:0 "拒斥佛罗伦萨合一，自主祝圣约拿确立独立莫斯科都主教区"
 oe_v250_mos.10.b:0 "遣使君士坦丁堡寻求教法默契，维系希腊学术与外交纽带"
 oe_v250_mos.10.c:0 "趁自主祝圣之机确立大公对全境主教推选的世俗监理权"
 oe_v250_mos.11.t:0 "诺夫哥罗德民会与毛皮商路"
 oe_v250_mos.11.d:0 "「伟大的诺夫哥罗德领主」坐拥北德维纳至白海的无尽貂皮与蜂蜡财源，并借圣彼得汉萨商站坐收波罗的海白银；然而其波雅尔寡头屡屡暗通波兰—立陶宛，妄图以古老的民会制度抗拒莫斯科宗主权。无论是借谢隆河刀兵强拆民会大钟、迁徙豪族至内地，还是保留其商帮自治纳入莫斯科税关，抑或将北方毛皮收归王室专卖，此举都将重塑莫斯科的北疆国运。"
 oe_v250_mos.11.a:0 "摘除民会大钟并迁徙诺夫哥罗德豪族，彻底消除北疆割据"
 oe_v250_mos.11.b:0 "保留诺夫哥罗德商帮与汉萨商站特许，坐收波罗的海关税"
 oe_v250_mos.11.c:0 "将北德维纳与白海貂皮悉数收归大公国库专营"
 oe_v250_mos.12.t:0 "采邑服役贵族制与乌格拉河大对峙"
 oe_v250_mos.12.d:0 "随着新归附领地大片没入国库，伊凡三世得以将田庄按军功赐予终生服役的「波梅希奇克」骑兵贵族，逐步取代尾大不掉的旧式波雅尔世袭领地。此刻大帐汗国阿黑麻汗率军逼近乌格拉河冰岸，莫斯科火炮与服役铁骑隔河严阵以待：此战不仅将彻底折断绵延两百余年的鞑靼枷锁，更将奠定未来俄罗斯沙皇国数百年军政根基。"
 oe_v250_mos.12.a:0 "全面推行采邑服役贵族制，在乌格拉河永绝鞑靼枷锁"
 oe_v250_mos.12.b:0 "采邑服役与旧波雅尔世袭领地并行，换取杜马一致对外"
 oe_v250_mos.12.c:0 "重金扩铸青铜火炮与火铳阵线，以炽烈火力封锁乌格拉冰岸"
