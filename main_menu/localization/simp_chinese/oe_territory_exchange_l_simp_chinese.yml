l_simp_chinese:
 oe_exchange_territory: "交换领土"
 oe_exchange_territory_desc: "完成帝国改革“凤凰无敌”后，在帝国柱石的行政令页面点击本行动，选择任意拥有领土的独立国家准备交换。交出范围包括东罗马、直属属国及其属国直接拥有的可征服地点，最多50块；接收范围同样包括目标国家及其下两层属国，数量不得超过交出数量。接收地点必须与交换后保留的东罗马及属国领土相邻，或经本次接收的其他地点连续接壤。准备期间可以增删清单或取消；最终确认才消耗1外交官，并使东罗马进入50年冷却。地点全部直接交给双方主国。"
 oe_territory_exchange_cooldown: "交换领土"
 OE_TX_COOLDOWN_READY: "东罗马不处于交换领土的50年冷却中"
 OE_TX_DRAFT_OPENED: "已准备交换清单。在帝国柱石的行政令页面添加交出和接收地点，最后确认交换。准备期间不消耗外交官，也不触发冷却。"
 oe_tx_add_give: "添加交出地点"
 oe_tx_add_give_desc: "从东罗马及其下两层属国中选择一个可征服地点加入交出清单。最多50块。此时不转移所有权。"
 oe_tx_add_take: "添加接收地点"
 oe_tx_add_take_desc: "从目标国家及其下两层属国中选择一个地点。须与保留的己方领土或已连通的接收地点接壤，且接收数不得超过交出数。请从边境开始逐块向外选择。"
 oe_tx_confirm: "确认交换领土"
 oe_tx_confirm_desc: "重新核对归属、数量和交换后的连通性。全部满足条件后，消耗1外交官，将交出清单交给目标国家、接收清单交给东罗马，并进入50年冷却。检查失败时不收费、不转移任何地点。"
 OE_TX_CHOOSE_GIVE: "选择交给对方的地点"
 OE_TX_CHOOSE_TAKE: "选择交给东罗马的地点"
 OE_TX_NO_GIVE_LOCATIONS: "@trigger_no!没有符合条件且尚未选入的己方地点，或已选满50块。"
 OE_TX_NO_TAKE_LOCATIONS: "@trigger_no!没有可接壤的对方地点，或接收数已达到交出数。可先增加交出地点，或按边境向外逐块选择。"
 OE_TX_DRAFT_HELP: "先添加交出地点，再从边境逐块添加接收地点；最后确认交换。"
 OE_TX_GIVE_COUNT: "交出：[GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_tx_give_count_value')|0]/50"
 OE_TX_TAKE_COUNT: "接收：[GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_tx_take_count_value')|0]"
 OE_TX_ADD_GIVE: "添加交出地点"
 OE_TX_ADD_TAKE: "添加接收地点"
 OE_TX_REMOVE: "移除"
 OE_TX_REFRESH: "重新检查"
 OE_TX_CANCEL: "取消交换"
 OE_TX_CONFIRM: "确认交换"
 OE_TX_INVALID: "#R 清单尚未满足交换条件。#!"
 OE_TX_READY: "#G 清单检查通过；确认时将再次核对。#!"
 OE_TX_VALIDATION_TT: "交出、接收清单至少各有1块，交出最多50块，接收数不超过交出数。全部地点须仍属于相应国家或其下两层属国。接收地点须通过本次接收的地点连接到交换后仍保留的己方领土。若等待期间归属变化，可点击重新检查。"
 OE_TX_CHOOSE_PARTNER: "选择交换领土的独立国家"
 OE_TX_NO_PARTNERS: "@trigger_no!没有可作为交换对象的独立国家。已有清单时请先取消交换，再选择其他国家。"
 OE_TX_PARTNER_LABEL: "目标国："
