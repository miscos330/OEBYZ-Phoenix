 oe_amr_cab_mesoamerican_reformation_action_progress_tooltip: "持续加快纳瓦特尔改革焦点进度、识字增长与全国抗疫能力。"
 oe_amr_cab_qhapaq_nan_census: "印加驿道结绳清丈"
 oe_amr_cab_qhapaq_nan_census_desc: "派遣结绳司官沿安第斯驿道核查一省户籍、劳役与坦博隔离仓，降低首都距离衰减并提升目标行省控制上限与高地防疫韧性。"
 oe_amr_cab_qhapaq_nan_census_action: "在[SCOPE.sProvince('target').GetNameWithNoTooltip]推行结绳清丈"
 oe_amr_cab_qhapaq_nan_census_active: "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]核查驿道结绳账簿"
