 oe_amr_adv_triple_alliance_tribute: "三城同盟浮田贡赋"
 oe_amr_adv_triple_alliance_tribute_desc: "将墨西哥谷地的湖泊浮田工程与三城同盟贡赋名册融为一体，解锁“特斯科科浮田水利农庄”，同时加速纳瓦特尔改革推进。"
 oe_amr_adv_obsidian_to_steel: "从黑曜石到火绳钢刃"
 oe_amr_adv_obsidian_to_steel_desc: "在保留豹鹰武士团精锐编练的同时，大规模仿制锻钢剑戟与火绳枪，并结合草药防疫体系显著加快新思潮采纳。"
 oe_amr_adv_qhapaq_nan_engineering: "印加皇家驿道工程"
 oe_amr_adv_qhapaq_nan_engineering_desc: "掌握穿山凿道、石阶排水与高地吊桥工法，正式解锁地图道路“印加皇家驿道”与建筑“印加结绳户籍大驿馆”。"
 oe_amr_adv_tawantinsuyu_quarantine_mita: "四方帝国坦博防疫劳役"
 oe_amr_adv_tawantinsuyu_quarantine_mita_desc: "将公共劳役与安第斯冻干粮仓转入战时与疫期双轨应急机制，在高海拔隘口依托坦博驿站构筑坚固防疫防线。"
 oe_amr_adv_kayanerenkowa_federation: "《大和平法》长屋联邦"
 oe_amr_adv_kayanerenkowa_federation_desc: "将口述宪法《大和平法》与海贝盟带议事程序化为常设联邦架构，解锁建筑“大和平法联盟总长屋”并扩充外交容量。"
 oe_amr_adv_woodlands_flintlock_diplomacy: "林海燧发枪与多边均势"
 oe_amr_adv_woodlands_flintlock_diplomacy_desc: "以五大湖与阿巴拉契亚密林伏击战法驾驭燧发火枪，在极乐洲新罗马与欧陆列强之间纵横捭阖、加速本土现代化。"
 oe_amr_tribute_and_labor_law: "美洲贡赋与劳役法典"
 oe_amr_tribute_and_labor_law_desc: "决定本土帝国如何动员人力、粮储与工程：以三城同盟的实物贡赋网统驭附庸，还是以安第斯结绳劳役统筹国库与驿道。"
 oe_amr_pol_triple_alliance_tribute: "三城同盟实物贡赋制"
 oe_amr_pol_triple_alliance_tribute_desc: "按画册名录定期向各地城邦征收玉米、可可与棉布，兼顾附庸自治与宗主粮储。"
 oe_amr_pol_reciprocal_mita_quipu: "结绳账簿与轮番米塔劳役"
 oe_amr_pol_reciprocal_mita_quipu_desc: "以结绳户籍轮调民力修筑驿道、梯田与防疫粮仓，灾疫年间由官仓平价赈济。"
 oe_amr_transatlantic_contact_law: "跨洋接触与军政国策"
 oe_amr_transatlantic_contact_law_desc: "当大西洋彼岸的帆影或切萨皮克的鹰旗现身地平线时，国家应优先通商译学以吸收火器冶铁，还是深挖林海高山以持久抗衡？"
 oe_amr_pol_selective_gunpowder_embassy: "通商译学与择优引火"
 oe_amr_pol_selective_gunpowder_embassy_desc: "由官派使节与商帮垄断对外铁器、火枪与典籍互市，将外来技艺迅速化为己用。"
 oe_amr_pol_sovereign_cordillera_resistance: "山海壁垒与本土自主防线"
 oe_amr_pol_sovereign_cordillera_resistance_desc: "严控关隘与林道，以高地游击、隔离检疫和缴获仿制构筑令远征军寸步难行的自主防线。"
 oe_amr_triple_alliance_hegemony: "三城同盟贡赋帝国"
 oe_amr_triple_alliance_hegemony_desc: "以特诺奇蒂特兰、特斯科科与特拉科潘三城共治为骨架，统筹湖区浮田粮储、豹鹰军团与属邦贡赋体系。"
 oe_amr_reformed_qhapaq_tawantinsuyu: "现代化四方印加驿道帝国"
 oe_amr_reformed_qhapaq_tawantinsuyu_desc: "以库斯科为四方轴心，借印加皇家驿道、结绳户籍与坦博高地隔离仓维系纵贯安第斯的严密治理。"
 oe_amr_haudenosaunee_grand_council: "大和平法长屋共议联邦"
 oe_amr_haudenosaunee_grand_council_desc: "依《大和平法》将各部族议事会纳入奥农达加圣火总议会，以共识外交与林海联防屹立北美东部。"
 oe_amr_priv_pochteca_guild_intelligence: "波奇特卡商帮密使特许"
 oe_amr_priv_pochteca_guild_intelligence_desc: "授予波奇特卡长途商帮自治裁判权与免税驿道，换取其遍布中美洲与沿海的情报网和贵重物产贸易。"
 oe_amr_priv_quipucamayoc_keepers: "结绳司官常任编校权"
 oe_amr_priv_quipucamayoc_keepers_desc: "保障世袭结绳司官掌管四方粮仓、户口与天文历法典册的特权，使帝国账目历乱不坠。"
 oe_amr_priv_clan_mothers_consensus: "氏族主母议事推举权"
 oe_amr_priv_clan_mothers_consensus_desc: "依《大和平法》确立氏族主母推举与弹劾长屋议长的宪制权力，维系部族凝聚、农粮储备与对内和平。"
 oe_amr_player_only_tt: "只有玩家操控的国家可以使用"
 oe_amr_pachacuti_free_build_reason: "帕查库提皇家工程特拨"
 oe_amr_dec_excan_tlahtoloyan_pact.title: "缔结三城同盟宪约"
 oe_amr_dec_excan_tlahtoloyan_pact.desc: "整合特诺奇蒂特兰、特斯科科与特拉科潘的军事与浮田贡赋体系（1415 年起，耗 100 金币）。若同时掌控特奥蒂瓦坎与乔卢拉两座古代圣城，还将触发双圣城改制共鸣！"
 oe_amr_dec_excan_tlahtoloyan_pact.a: "盟誓湖心"
 oe_amr_dec_aztec_pestilence_countermeasure.title: "推行中美洲本草抗疫总动员"
 oe_amr_dec_aztec_pestilence_countermeasure.desc: "调动特拉蒂拉尼草药师与湖堤检疫闸门应对跨洋大瘟疫（1490 年起、大瘟疫爆发或极乐洲已定居时可用，耗 150 金币），正式立下中美洲现代化抗疫里程碑。"
 oe_amr_dec_aztec_pestilence_countermeasure.a: "颁行本草疫令"
 oe_amr_dec_pachacuti_tawantinsuyu.title: "启动帕查库提四方帝国改制"
 oe_amr_dec_pachacuti_tawantinsuyu.desc: "以库斯科为四方中心启动大改制（1430 年起，须占有库斯科，耗 120 金币）：解锁印加皇家驿道工程、免费在库斯科落成结绳大驿馆，并沿周边实控邻地铺就首批印加皇家驿道！"
 oe_amr_dec_pachacuti_tawantinsuyu.a: "重铸四方之都"
 oe_amr_dec_inca_highland_quarantine.title: "启用安第斯坦博高地隔离防线"
 oe_amr_dec_inca_highland_quarantine.desc: "依托高海拔驿道隘口、结绳户口与坦博冻干粮仓构筑全域防疫体系（1490 年起、大瘟疫爆发或研发防疫劳役科技后可用，耗 150 金币），正式立下印加皇家驿道抗疫里程碑。"
 oe_amr_dec_inca_highland_quarantine.a: "封山设驿防疫"
 oe_amr_dec_great_law_of_peace.title: "召开《大和平法》圣火议会"
 oe_amr_dec_great_law_of_peace.desc: "在白松圣树下燃起奥农达加联盟圣火，重申五部共议宪章以和平外交加速整合易洛魁联邦与密西西比盟邦（1380 年起，耗 80 金币）。"
 oe_amr_dec_great_law_of_peace.a: "燃起长屋圣火"
 oe_amr_dec_chesapeake_roman_embassy.title: "派遣切萨皮克暨大西洋大议会使团"
 oe_amr_dec_chesapeake_roman_embassy.desc: "向切萨皮克湾的极乐洲新罗马派出长屋大议会使团，决定缔结《切萨皮克罗马盟邦公约》抑或组建《泛北美抗罗马长屋联邦》（若极乐洲未定居，则自动转入大西洋欧陆列强海狸战争外交线；耗 60 金币）。"
 oe_amr_dec_chesapeake_roman_embassy.a: "遣使南下"
 oe_amr.1.title: "特斯科科湖上的翠绿浮田"
 oe_amr.1.desc: "墨西哥谷地的湖沼之间，工匠与农夫以柳桩固泥、引渠排盐，筑起层层叠叠的浮田水道。依托一年数熟的玉米与瓜豆，湖心岛城的人口与粮仓正以惊人的速度壮大。"
 oe_amr.1.a: "广辟湖心浮田，修筑石堤水闸"
 oe_amr.1.b: "以余粮编练武士团，防备谷地强邻"
 oe_amr.2.title: "三城同盟"
 oe_amr.2.desc: "湖区三大城邦在神庙阶前共立血盟，推翻旧霸权并按比例分掌贡赋、法典与军务。自此墨西哥谷地的兵锋、商旅与典籍汇于一炉，为建立中美洲大帝国铺平道路。"
 oe_amr.2.a: "颁行三城同盟贡赋法典，统驭谷地诸邦"
 oe_amr.2.b: "礼敬古圣城与各邦贵族，以德怀远"
 oe_amr.3.title: "双圣城朝圣"
 oe_amr.3.desc: "晨雾缭绕在巍峨的日月金字塔与乔卢拉大祭坛上空。卡尔梅卡克的祭司与历算学者亲临古圣城临摹壁画、校订太阳历法，将上古文明的合法性与威望尽数收归本朝。"
 oe_amr.3.a: "在古圣城重修历算讲堂，加速宗教改制"
 oe_amr.3.b: "向四方城邦广发圣城朝圣护照，增进商旅"
 oe_amr.4.title: "波奇特卡密使与卡尔梅卡克典籍"
 oe_amr.4.desc: "远行归来的波奇特卡商帮不仅带回可可、翡翠与沿海风声，更传回远方异邦坚船利炮的奇闻；与此同时，卡尔梅卡克的学者正恳请朝廷扩印树皮纸历算与兵制图册。"
 oe_amr.4.a: "双轨并举：既授商帮密探之权，又广修官学典籍"
 oe_amr.4.b: "以商税充实国库，先行整军备战"
 oe_amr.5.title: "特拉蒂拉尼本草抗疫"
 oe_amr.5.desc: "闻听跨洋商旅携来前所未见的烈性疫病，谷地的本草医官特拉蒂拉尼与祭司携手编定隔离法度：在湖堤要津设检疫水门、洁净饮水、以草药汤剂分区救治，决不坐视百万生民凋零。"
 oe_amr.5.a: "举国推行本草隔离法度，立中美洲抗疫丰碑"
 oe_amr.5.b: "优先护持京畿与军营，维系财税运转"
 oe_amr.6.title: "从黑曜石锯剑到锻钢火绳"
 oe_amr.6.desc: "工坊炉火昼夜不息，中美洲铁匠从缴获与互市得来的钢剑、胸甲和火绳枪中拆解诀窍，开始成批铸造本国枪管与钢铁长戟。古老的豹鹰武士团正蜕变为令跨洋远征军胆寒的新式劲旅。"
 oe_amr.6.a: "全面换装锻钢火绳，整编三城新军"
 oe_amr.6.b: "兼采轻装伏击与火炮城防，稳守高原门户"
 oe_amr.7.title: "昌卡风暴兵临库斯科"
 oe_amr.7.desc: "强悍的昌卡部落大军翻越山谷直逼库斯科圣城，朝中老臣一度议论退避山巅。然而年轻的王族决意死守太阳神殿，号召谷地农人连同山坡巨石一同奋起迎敌！"
 oe_amr.7.a: "立誓死守库斯科，号令高原军民决战"
 oe_amr.7.b: "稳固山隘堡垒与粮仓，以逸待劳"
 oe_amr.8.title: "帕查库提改制与四方帝国蓝图"
 oe_amr.8.desc: "击退外患之后，萨帕·印加“翻天覆地者”帕查库提重塑库斯科城廓，将帝国划分为四大方位行省，统筹石砌皇家驿道、彩色结绳户口与轮番米塔劳役，安第斯大一统由此奠基。"
 oe_amr.8.a: "全面推行四方行省、结绳与驿道大改制"
 oe_amr.8.b: "优先厚植梯田粮仓与附庸怀柔"
 oe_amr.9.title: "五彩结绳与查斯基急使"
 oe_amr.9.desc: "每隔数里矗立于云海山脊上的坦博驿站中，精壮的查斯基急使接力传递王命与五彩结绳账簿。自库斯科至基多、自昌昌至的的喀喀湖，四方粮储与兵额纤毫毕现。"
 oe_amr.9.a: "扩充结绳司官与查斯基接力网"
 oe_amr.9.b: "将余力转入坦博干粮储运，充盈国库"
 oe_amr.10.title: "云端通途：印加皇家驿道落成首段"
 oe_amr.10.desc: "随着最后一块严丝合缝的安第斯巨石嵌入悬崖路基，首段印加皇家驿道正式通车。草绳吊桥横跨深谷，坦博驿馆烟火相望，四方帝国的政令与大军从此凌越群峰！"
 oe_amr.10.a: "犒赏筑路工匠，继续向安第斯南北延展干线"
 oe_amr.11.title: "高地坦博隔离网与安第斯抗疫奇迹"
 oe_amr.11.desc: "当陌生的瘟疫沿海岸商道逼近群山，四方帝国迅速启动驿道隘口封控：查斯基急使改在隔离标桩前口头交接，坦博官仓就地配发冻干马铃薯与退热树皮汤剂，阻断了大瘟疫向高原腹地蔓延。"
 oe_amr.11.a: "全面贯通坦博抗疫驿道，立下四方帝国里程碑"
 oe_amr.11.b: "严守王都与矿区通道，维系四方贡运"
 oe_amr.12.title: "白银科迪勒拉"
 oe_amr.12.desc: "从南部查尔卡高原的炽热银炉到赤道重镇基多的石砌观象台，安第斯工匠与学者将本土精密冶金、天文测时与跨洋传入的机械历算合冶一炉，令四方帝国昂然步入近代科学之林。"
 oe_amr.12.a: "兴建查尔卡冶坊与基多观象院，推进近代格物"
 oe_amr.12.b: "铸银充实国库，购置新式火炮与军械"
 oe_amr.13.title: "《大和平法》"
 oe_amr.13.desc: "莫霍克、奥奈达、奥农达加、卡尤加与塞内卡的氏族主母与议长齐聚白松圣树之下，将昔日血仇战斧深埋树根，以海贝串缔结口述宪法《大和平法》——长屋之民自此同呼吸、共进退。"
 oe_amr.13.a: "确立大和平法联邦议会，凝聚北美林海诸部"
 oe_amr.13.b: "在圣火前整军修武，护卫河谷猎场"
 oe_amr.14.title: "海贝盟带与卡霍基亚大土墩商路"
 oe_amr.14.desc: "顺着圣劳伦斯、俄亥俄与密西西比水系，易洛魁长屋使者携海贝盟带西行，与密西西比河畔雄伟的卡霍基亚大土墩城邦互通玉米、铜器、毛皮与医药，织就纵横北美腹地的内陆联结。"
 oe_amr.14.a: "缔结五大湖—密西西比内陆通商盟约"
 oe_amr.14.b: "广征毛皮与水运关税，充实长屋公库"
 oe_amr.15.title: "长屋与双头鹰"
 oe_amr.15.desc: "身披紫袍、高擎双头鹰旗的极乐洲新罗马人已在南方切萨皮克湾扎根筑城！他们的铁匠能锻出寒光凛凛的钢刃与火枪，元老院的使者已抵长屋门前。我们究竟应当与这支跨洋而来的罗马流亡者缔结平等互惠的《切萨皮克盟邦公约》，还是高举白松战旗、联合北美诸部组建《泛北美抗罗马长屋联邦》？"
 oe_amr.15.a: "缔结《切萨皮克罗马盟邦公约（Foederati）》：互通铁器火枪与毛皮"
 oe_amr.15.b: "组建《泛北美长屋抗罗马联邦》：林海伏击、自主抗衡！"
 oe_amr.16.title: "大和平法使节莅临切萨皮克"
 oe_amr.16.desc: "来自北方易洛魁长屋大议会的使团手捧洁白海贝盟带步入切萨皮克元老院，提议将罗马古老的“同盟邦（Foederati）”法统与《大和平法》合为一体：北方诸部供应毛皮、玉米并拱卫北疆，极乐洲则开放铁器、火枪与典籍互市。"
 oe_amr.16.a: "以平等盟邦礼节批准《切萨皮克—长屋互惠公约》"
 oe_amr.16.b: "接受盟约，但要求长屋承认新罗马北疆宗主礼制与岁贡"
 oe_amr.17.title: "北疆烽烟·北美长屋联邦崛起"
 oe_amr.17.desc: "巡逻斥候自萨斯奎哈纳与哈德逊河谷急报：北方易洛魁五部与密西西比盟邦拒绝向双头鹰俯首，已焚起战时圣火结成《泛北美长屋抗衡联邦》。林海深处伏兵四起，切萨皮克北疆正面临前所未有的挑战！"
 oe_amr.17.a: "立即加固北疆罗马边墙，增派游骑巡防"
 oe_amr.17.b: "派遣希易双语通事留守边境商站，力保一线和谈余地"
 oe_amr.18.title: "大西洋帆影"
 oe_amr.18.desc: "极乐洲并无罗马流亡者立足，然而来自旧大陆西欧各强国的商船与殖民据点已现身北美东岸与圣劳伦斯河口。他们在争抢海狸毛皮的同时，也将燧发枪、铁釜与疫病带进了大西洋森林。"
 oe_amr.18.a: "周旋于欧陆列强之间，以海狸毛皮大举换购燧发枪与精铁"
 oe_amr.18.b: "严守林海主权，动员长屋各部构筑自主游击防线"
 oe_amr.90.title: "美洲三大帝国与极乐洲总览"
 oe_amr.90.desc: "Slot 98 脉冲累计：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_pulses')|0]｜当前国所属轴线（0无/1中美洲/2安第斯/3易洛魁卡霍基亚）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_axis')|0]\n纳瓦特尔 4 项 INJECT 新焦点已完成：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_nahuatl_focuses')|0] / 4｜双圣城持有数（特奥蒂瓦坎/乔卢拉，0 DLC 依赖）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_sacred_pyramids')|0] / 2\n中美洲抗疫转型里程碑（oe_amr_triple_alliance_reformed）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_triple_reformed')|0]｜印加驿道抗疫里程碑（oe_amr_qhapaq_nan_completed）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_qhapaq_done')|0]\n极乐洲新罗马在场（oe_ely_settled + 宿主）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_elysia_present')|0]｜极乐洲—长屋契约态（0未定/1盟邦/2抗衡）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_elysia_pact')|0]\n本国美洲科技已研：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_advances')|0] / 6｜盟邦铁器毛皮互市次数：[ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_exchanges')|0]"
 oe_amr.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_amr_chinampa_expansion_mod: "特斯科科浮田广辟"
 STATIC_MODIFIER_DESC_oe_amr_chinampa_expansion_mod: "湖区浮田密布、渠闸通畅，墨西哥谷地粮储源源不断。"
 STATIC_MODIFIER_NAME_oe_amr_triple_alliance_pact_mod: "三城同盟宪约"
 STATIC_MODIFIER_DESC_oe_amr_triple_alliance_pact_mod: "特诺奇蒂特兰、特斯科科与特拉科潘缔结三城同盟，共主谷地贡赋与兵政。"
 STATIC_MODIFIER_NAME_oe_amr_dual_pyramids_synergy_mod: "双圣城金字塔朝圣共鸣"
 STATIC_MODIFIER_DESC_oe_amr_dual_pyramids_synergy_mod: "同时执掌特奥蒂瓦坎与乔卢拉两座古代圣城，历算典籍与宗教改制如虎添翼。"
 STATIC_MODIFIER_NAME_oe_amr_sacred_pyramid_pilgrimage_mod: "古圣城朝圣余荫"
 STATIC_MODIFIER_DESC_oe_amr_sacred_pyramid_pilgrimage_mod: "执掌古代金字塔圣城维系了谷地各邦的宗教向心力与改革进度。"
 STATIC_MODIFIER_NAME_oe_amr_pochteca_codices_network_mod: "波奇特卡与卡尔梅卡克并举"
 STATIC_MODIFIER_DESC_oe_amr_pochteca_codices_network_mod: "远行商帮情资与官学树皮纸典籍相辅相成，拓宽了帝国的视野与贸易网。"
 STATIC_MODIFIER_NAME_oe_amr_mesoamerican_herbal_shield_mod: "中美洲本草隔离防线"
 STATIC_MODIFIER_DESC_oe_amr_mesoamerican_herbal_shield_mod: "依托湖堤封控与特拉蒂拉尼本草药师团，有效抵御跨洋大瘟疫的冲击。"
 STATIC_MODIFIER_NAME_oe_amr_obsidian_steel_legion_mod: "黑曜石与火绳新军"
 STATIC_MODIFIER_DESC_oe_amr_obsidian_steel_legion_mod: "豹鹰精锐换装锻钢与火绳火器，将中美洲近战威慑与近代火力融为一体。"
 STATIC_MODIFIER_NAME_oe_amr_chanka_defense_rally_mod: "库斯科石兵血战动员"
 STATIC_MODIFIER_DESC_oe_amr_chanka_defense_rally_mod: "抵御昌卡来犯的生死一战激发出安第斯山民捍卫圣城的不屈斗志。"
 STATIC_MODIFIER_NAME_oe_amr_pachacuti_tawantinsuyu_mod: "帕查库提四方大改制"
 STATIC_MODIFIER_DESC_oe_amr_pachacuti_tawantinsuyu_mod: "萨帕·印加重绘库斯科与四方行省蓝图，驿道、结绳与劳役制度全面落成。"
 STATIC_MODIFIER_NAME_oe_amr_quipu_chasqui_network_mod: "查斯基驿使与结绳户籍网"
 STATIC_MODIFIER_DESC_oe_amr_quipu_chasqui_network_mod: "奔行于安第斯山脊的急使与精准结绳账簿令政令与军粮昼夜无阻。"
 STATIC_MODIFIER_NAME_oe_amr_qhapaq_nan_first_stone_mod: "印加皇家驿道初通"
 STATIC_MODIFIER_DESC_oe_amr_qhapaq_nan_first_stone_mod: "首段印加皇家石砌驿道竣工，安第斯天堑自此化作四方通途。"
 STATIC_MODIFIER_NAME_oe_amr_andean_tambo_quarantine_mod: "安第斯坦博高地检疫网"
 STATIC_MODIFIER_DESC_oe_amr_andean_tambo_quarantine_mod: "沿驿道山隘封锁疫区、依托坦博粮仓就地隔离并推广金鸡纳草药，守住高原人口根基。"
 STATIC_MODIFIER_NAME_oe_amr_silver_cordillera_modern_mod: "银矿山脉与安第斯格物"
 STATIC_MODIFIER_DESC_oe_amr_silver_cordillera_modern_mod: "查尔卡高地矿冶与基多赤道观象台带动安第斯帝国跨入近代工艺与科学行列。"
 STATIC_MODIFIER_NAME_oe_amr_kayanerenkowa_league_mod: "大和平法圣火盟约"
 STATIC_MODIFIER_DESC_oe_amr_kayanerenkowa_league_mod: "五部长老在白松圣树下埋剑立誓，以共识议事与海贝盟带维系长屋联邦。"
 STATIC_MODIFIER_NAME_oe_amr_great_law_consensus_mod: "奥农达加长屋共识"
 STATIC_MODIFIER_DESC_oe_amr_great_law_consensus_mod: "定期召开的圣火大议会化解了部族分歧，稳固了北美林海联防。"
 STATIC_MODIFIER_NAME_oe_amr_wampum_cahokia_bridge_mod: "海贝与密西西比大土墩商路"
 STATIC_MODIFIER_DESC_oe_amr_wampum_cahokia_bridge_mod: "五大湖海贝盟带与密西西比河谷大土墩城邦贯通水路互市，共兴北美腹地。"
 STATIC_MODIFIER_NAME_oe_amr_elysia_foederati_pact_mod: "切萨皮克罗马盟邦公约"
 STATIC_MODIFIER_DESC_oe_amr_elysia_foederati_pact_mod: "易洛魁长屋与切萨皮克极乐洲互认盟邦，互通铁器、火枪、毛皮与宪政典籍。"
 STATIC_MODIFIER_NAME_oe_amr_foederati_iron_firearms_mod: "极乐洲精铁与火枪互市"
 STATIC_MODIFIER_DESC_oe_amr_foederati_iron_firearms_mod: "定期自切萨皮克港运抵的罗马精铁与火枪武装了长屋斥候与工匠。"
 STATIC_MODIFIER_NAME_oe_amr_elysia_longhouse_fur_compact_mod: "长屋盟邦毛皮与边疆和约"
 STATIC_MODIFIER_DESC_oe_amr_elysia_longhouse_fur_compact_mod: "来自北方长屋盟邦的丰沛毛皮与和平边疆为切萨皮克新罗马带来持久繁荣。"
 STATIC_MODIFIER_NAME_oe_amr_elysia_tribute_primacy_mod: "切萨皮克北疆宗主威权"
 STATIC_MODIFIER_DESC_oe_amr_elysia_tribute_primacy_mod: "元老院坚持罗马宗主礼制，在北疆换取兵源与岁贡，但也埋下微妙隔阂。"
 STATIC_MODIFIER_NAME_oe_amr_longhouse_resistance_mod: "泛北美长屋抗衡联邦"
 STATIC_MODIFIER_DESC_oe_amr_longhouse_resistance_mod: "北美东部诸部焚起烽火共组自主抗衡联盟，以林海伏击与缴获火枪迎击一切入侵者。"
 STATIC_MODIFIER_NAME_oe_amr_elysia_northern_limes_alert_mod: "切萨皮克北疆边墙戒备"
 STATIC_MODIFIER_DESC_oe_amr_elysia_northern_limes_alert_mod: "极乐洲紧急加固北疆堡垒与游骑巡逻线，防备长屋联邦突袭。"
 STATIC_MODIFIER_NAME_oe_amr_elysia_frontier_interpreters_mod: "希易双语边疆通事司"
 STATIC_MODIFIER_DESC_oe_amr_elysia_frontier_interpreters_mod: "元老院遣双语通事留守边境商站，在剑拔弩张之际维系一线商路与缓和契机。"
 STATIC_MODIFIER_NAME_oe_amr_atlantic_flintlock_trade_mod: "大西洋海狸皮与燧发枪互市"
 STATIC_MODIFIER_DESC_oe_amr_atlantic_flintlock_trade_mod: "借海狸皮贸易从欧陆多方列强换取火枪与铁斧，在海狸战争中抢占先机。"
 STATIC_MODIFIER_NAME_oe_amr_rival_ai_mod: "美洲强盛本土帝国"
 STATIC_MODIFIER_DESC_oe_amr_rival_ai_mod: "规则“强化电脑对手”赋予美洲本土主角国家的抗疫与统筹加成。"
