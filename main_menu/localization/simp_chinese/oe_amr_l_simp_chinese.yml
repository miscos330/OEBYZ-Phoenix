 oe_amr_act_elysian_foederati_exchange: "切萨皮克罗马盟邦铁器毛皮互市"
 oe_amr_act_elysian_foederati_exchange_desc: "依据《切萨皮克罗马盟邦公约》，向极乐洲新罗马交付毛皮与玉米补给，换取精炼铁器、火枪与冶金技艺（冷却 10 年，双方同获 10 年双向加成）。"
 oe_amr_act_longhouse_council_summit: "召开奥农达加长屋大议会"
 oe_amr_act_longhouse_council_summit_desc: "在圣火前召集五部及密西西比河谷盟友重申海贝盟约，提升稳定度并在未来 8 年内巩固联邦外交与防御凝聚力。"
 oe_amr_rf_chinampa_agronomy: "浮田水利农政"
 oe_amr_rf_chinampa_agronomy_desc: "整修特斯科科湖上的石堤、闸门与多层浮田水道，将一年多熟的玉米与蔬果体系制度化，以丰沛粮储平抑末日焦虑。"
 oe_amr_rf_calmecac_codices: "卡尔梅卡克典籍历算"
 oe_amr_rf_calmecac_codices_desc: "广开卡尔梅卡克官学，重校树皮纸抄本中的天文、算术、史册与律法，培育兼通古礼与新学的文官世代。"
 oe_amr_rf_pochteca_intelligence: "波奇特卡商帮谍网"
 oe_amr_rf_pochteca_intelligence_desc: "授予远行商帮波奇特卡军政密探特权，借可可与羽饰商队刺探沿海风声、绘制关隘图籍并防范外敌潜入。"
 oe_amr_rf_anti_pestilence_herbalism: "特拉蒂拉尼草药防疫"
 oe_amr_rf_anti_pestilence_herbalism_desc: "编纂本草医典并在湖堤要津设立药师隔离院，以草药蒸煮、洁净水源与分区封控应对跨洋传入的大瘟疫。"
 oe_amr_chinampa_agronomy_complex: "特斯科科浮田水利农庄"
 oe_amr_chinampa_agronomy_complex_desc: "集湖堤闸门、深淤肥田与多熟玉米水网于一体的中美洲水利工程群。仅可建于特诺奇蒂特兰、特斯科科、特拉科潘、索奇米尔科、查尔科、乔卢拉与特奥蒂瓦坎，每地一座；建于首都时另授全国粮产与抗疫加成。需“三城同盟浮田贡赋”科技。"
 oe_amr_chinampa_agronomy_complex_maint: "浮田堤闸维护"
 oe_amr_quipu_tambo_archive: "印加结绳户籍大驿馆"
 oe_amr_quipu_tambo_archive_desc: "集结绳户籍库、查斯基驿使接力站与高地防疫隔离仓于一体的安第斯枢纽。仅可建于库斯科、昌昌、基多、大豪哈、哈通库利亚、丘奎托、蒂瓦纳库、伊斯马与查尔卡，每地一座；建于首都时另降驿道距离衰减与筑路耗时。需“印加皇家驿道工程”科技。"
 oe_amr_quipu_tambo_archive_maint: "驿馆结绳常备"
 oe_amr_grand_council_longhouse: "大和平法联盟总长屋"
 oe_amr_grand_council_longhouse_desc: "燃起五部永恒圣火、存放海贝盟带并召开部落共议大会的北美核心圣所。仅可建于奥农达加圣火城、卡纳乔哈里、奥奈达、塞内卡、卡尤加与卡霍基亚，每地一座；建于首都时另授外交声誉与抗疫韧性。需“《大和平法》长屋联邦”科技。"
 oe_amr_grand_council_longhouse_maint: "圣火长屋修缮"
 oe_amr_cab_mesoamerican_reformation: "中美洲历算与改制督办"
 oe_amr_cab_mesoamerican_reformation_desc: "委派重臣统筹卡尔梅卡克抄本编修、浮田水利与防疫草药司，以轻微教士阶层不满为代价，显著加速纳瓦特尔宗教改革焦点推进并提高识字与抗疫韧性。"
 oe_amr_cab_mesoamerican_reformation_action: "督办中美洲现代改制"
