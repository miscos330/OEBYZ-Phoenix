l_simp_chinese:
 OE_PILLARS_REFORMS: "帝国改革"
 OE_PILLARS_REFORMS_DESC: "以持久的制度，支撑重生的帝国。查看改革条件、权威花费与完成情况。"
 OE_IR_PENDING: "尚未完成"
 OE_IR_COMPLETE: "改革已完成"
 OE_IR_NOT_DONE: "尚未完成这项帝国改革"
 OE_IR_OWNS_EAST: "直接拥有埃及、安纳托利亚大区与黎凡特地区的全部可拥有陆地"
 OE_IR_ARMY_PROGRESS: "陆军改革进度：#Y [GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_ir_army_progress')|0]#!"
 OE_IR_SCORE_RULES: "领土易主时，夺取城镇#G +1#!、城市#G +2#!、大都市#G +3#!；陆军战斗获胜#G +1#!，君主亲自指挥则合计#G +2#!；赢得战争#G +3#!。投资军备仍按所选方案获得#G 2／3／5#!分。沿用原有的新年#G +1#!、君主败战#R −1#!、战败#R −10#!、受到侮辱#R −1#!规则。三次升级的累计门槛为#Y 100／500／3000#!分。\n\n三所学院成功下单扩建时，每次增加 #G 100#!分。"
 oe_ir_central_modifier: "中央集权"
 oe_ir_artillery_modifier: "帝国炮兵体制"
 oe_ir_sea_modifier: "我们的海"
 oe_ir_faith_modifier: "传播正教"
 oe_ir_law_modifier: "罗马法"
 oe_byz_veteran_army: "久经沙场的军队"
 oe_byz_veteran_army_desc: "经过长期征战与持续训练，帝国军队已形成稳定的军官队伍与操练制度。老兵的经验不再随退役流失，而是传给下一批走入军营的士卒。"
 oe_byz_phoenix_army: "凤凰无敌"
 oe_byz_phoenix_army_desc: "胜利源于一代又一代军人的积累。完善的训练、可靠的军需与善于独立判断的指挥官，使凤凰旗下的军队能够把握战机，维系罗马来之不易的复兴。"
 oe_ir_offices: "重整官制"
 oe_ir_offices_desc: "皇帝的敕令不应止于宫门。厘清地方官的职掌，收回豪强把持的任免与征收之权，使官署重新听命于皇座。\n\n当前君主须已统治#Y 超过十年#!。完成后将政府改革#Y 琼筵序次#!升级为重整后的版本。解除并隐藏#Y 地方豪强#!；每月权威#G +0.05#!，每月民意#G +0.05#!。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。"
 OE_IR_AUTHORITY_50: "帝国柱石拥有至少#Y 50#!权威"
 oe_ir_central: "中央集权"
 oe_ir_central_desc: "帝国的税册、法庭与军令，将由同一套制度维系。只有各阶层都无法独揽朝政，皇帝才有余力将分散的权柄重新收束。\n\n须完成#Y 重整官制#!，且除王冠外，所有阶层的影响力均低于#Y 40%#!。永久获得王室力量#G +10%#!、税收效率#G +5%#!。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n解锁#Y 贵族荣衔化#!、#Y 东罗马官僚制#!及#Y 诸罗格塞特#!法条。"
 oe_ir_expel: "驱逐外夷"
 oe_ir_expel_desc: "从摩里亚的城堡到马尔马拉海的港口，罗马的核心土地应重新接受帝国的治理。外国商人的特许不再凌驾于本地行会之上。\n\n须直接完全拥有#Y 摩里亚、爱琴海群岛、北希腊、西安纳托利亚与马尔马拉#!。解除并隐藏#Y 拉丁竞争#!。移除君士坦丁堡的#Y 加拉太塔与威尼斯区#!，并允许扩建#Y 新加拉太区与新威尼斯区#!。\n\n消耗#Y 20权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n解锁贵金属分配法条#Y 金银管制法#!。\n\n在帝国工程的地中海面板解锁#Y 建设帝国海军基地#!，初始可执行五次。"
 OE_IR_AUTHORITY_20: "帝国柱石拥有至少#Y 20#!权威"
 oe_ir_guilds: "国有行会"
 oe_ir_guilds_desc: "清查工坊，统一章程，将供货、工价与品质置于帝国的监督之下。行会仍由工匠经营，却必须为帝国的繁荣承担责任。\n\n须完成#Y 驱逐外夷#!。使#Y 国家垄断行会#!特权的原材料产出与生产效率加成分别由#Y 2.5%#!提高至#G 5%#!，并允许#G 市民建设原材料设施#!；须实际持有该特权才享受升级效果。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n解锁并立即实施采矿法条#Y 国有行会控制#!，并解锁市民权利法条#Y 新编《市政官书》#!。"
 oe_ir_east: "垄断东方"
 oe_ir_east_desc: "尼罗河的粮船、黎凡特的货栈与安纳托利亚的商路，终于纳入同一套关税与护航制度。帝国可以重新决定东方货物通向地中海的道路。\n\n须直接拥有#Y 埃及与安纳托利亚大区、黎凡特地区#!内的全部可拥有陆地，湖泊、不可通行地块及不可拥有的连接地块不计；附庸领地不计。解锁#Y 东方货物转口权#!特权。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n获得永久国家修正#Y 垄断东方贸易#!：关税上限#G +10%#!、进口效率#G +2%#!、出口效率#G +2%#!。"
 oe_ir_army_1: "陆军改革Ⅰ · 罗马军队新生"
 oe_ir_army_1_desc: "军籍、军饷与操练重新连成一体。罗马终于能够依靠一支受国家供养的军队，而不必将每场战争的命运交给临时招募的佣兵。\n\n须累计#Y 100#!陆军改革分。将#Y 依赖雇佣兵#!替换为#Y 罗马军队新生#!。升级不消耗进度分。\n\n消耗#Y 20权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n$OE_IR_ARMY_PROGRESS$\n$OE_IR_SCORE_RULES$\n\n征召规模#R −90%#!。此限制贯穿整条陆军改革升级线。\n\n赫泰里亚升级：在双伤害减免各10%的基础上，增加主动性 #G +5#!、兵力伤害 #G +5%#!。"
 oe_ir_army_2: "陆军改革Ⅱ · 久经沙场的军队"
 oe_ir_army_2_desc: "胜败不再只留在将领的回忆里。战报成为教材，老兵训练新兵，久经战阵的经验逐渐成为全军共同遵循的准则。\n\n须完成#Y 一级陆军改革#!，并累计#Y 500#!分。替换为#Y 久经沙场的军队#!：训练度#G +5%#!、战术#G +0.1#!、政府改革上限#G +1#!，每月向质量倾向#G +0.1#!。升级不消耗进度分。\n\n消耗#Y 20权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n$OE_IR_ARMY_PROGRESS$\n$OE_IR_SCORE_RULES$\n\n征召规模#R −90%#!。此限制贯穿整条陆军改革升级线。\n\n赫泰里亚兵力伤害额外 #G +15%#!，并解锁军事令“实行罗姆普罗尼亚制”。\n\n解锁“$recruitment_law$”法律下的原版拜占庭专属法条#Y $byz_tagmata_policy_upgraded$#!，由国家自行选择颁行。"
 oe_ir_army_3: "陆军改革Ⅲ · 凤凰无敌"
 oe_ir_army_3_desc: "凤凰之名不仅属于军旗，也属于支撑军队的整套制度。军官懂得把握战机，士卒相信身旁的同袍，帝国终于拥有一支能够主动决定战争进程的军队。\n\n须完成#Y 二级陆军改革#!，并累计#Y 3000#!分。替换为#Y 凤凰无敌#!：训练度#G +10%#!、战术#G +0.1#!、主动性#G +20%#!、战争分数效率#G +50%#!、重骑兵作战能力#G +20%#!、炮兵作战能力#G +20%#!、政府改革上限#G +1#!，每月向质量倾向#G +0.1#!。升级不消耗进度分。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n$OE_IR_ARMY_PROGRESS$\n$OE_IR_SCORE_RULES$\n\n征召规模#R −90%#!。此限制贯穿整条陆军改革升级线。\n\n赫泰里亚同时获得军乐队与医护编队：士气伤害 #G +20%#!、移动速度 #G +0.2#!，所受兵力与士气伤害再各 #G -10%#!。\n\n预期宿敌数量#G −4#!。"
 oe_ir_artillery: "推广火炮"
 oe_ir_artillery_desc: "铸炮、备药与运输不能再各行其是。帝国将建立统一的火炮标准，训练炮手，并使攻城火力成为陆军的常备力量。\n\n须完成#Y 一级陆军改革#!。永久获得炮兵战斗力#G +10%#!、炮兵对要塞加成#G +1#!。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n$OE_REFORM_SIEGERS_UPGRADE_TT$"
 oe_ir_sea: "我们的海"
 oe_ir_sea_desc: "港口恢复往来，船坞重新开工。由熟悉岛屿、海峡与沿岸水道的水手驾驶桨帆船，帝国的舰队将再次守护共同的海洋。\n\n须完成#Y 驱逐外夷#!。永久获得桨帆船战斗力#G +20%#!。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。\n\n分别在海洋法和海盗法下解锁#Y 《罗得海法》#!。\n\n#Y 建设帝国海军基地#!累计次数上限提高至十次，并开放西地中海的新选址。"
 oe_ir_faith: "传播正教"
 oe_ir_faith_desc: "修缮教堂，培养通晓当地语言的司祭，为新建堂区提供经书与资助。信仰的传播将仰赖持续的牧养，而非一纸敕令。\n\n须完成#Y 中央集权#!。永久获得人口宗教转变速度#G +25%#!。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。"
 oe_ir_law: "罗马法"
 oe_ir_law_desc: "从皇帝到地方官，从显贵到普通臣民，诉讼与裁断应当遵循可以查阅、可以预期的法律。统一司法，也使帝国的权力有了更稳固的根基。\n\n须完成#Y 中央集权#!。永久获得所有阶层满意度均衡值#G +2.5%#!、王室力量#G +10%#!。\n\n消耗#Y 50权威#!。每项改革只能完成一次，不消耗内帑或民意。"
 OE_IR_GOVERNMENT_GROUP: "皇权与法度"
 OE_IR_ECONOMY_GROUP: "疆土与产业"
 OE_IR_ARMY_GROUP: "陆海军制"
 OE_IR_NON_CROWN_POWER_LOW: "除王冠外，所有阶层的影响力均低于#Y 40%#!。"
 OE_IR_OWNS_EAST_EGYPT: "直接拥有埃及大区全部可拥有陆地"
 OE_IR_OWNS_EAST_ANATOLIA: "直接拥有安纳托利亚大区全部可拥有陆地"
 OE_IR_OWNS_EAST_LEVANT: "直接拥有黎凡特地区全部可拥有陆地"
