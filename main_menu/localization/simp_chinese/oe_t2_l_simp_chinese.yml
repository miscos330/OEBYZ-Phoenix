l_simp_chinese:
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_3: "军区忠诚同步：忠贞"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_3: "本军区将军对皇权忠贞不渝（军区忠诚≥70），显著提升其对帝国宗主的附庸忠诚。"
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_2: "军区忠诚同步：平稳"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_2: "本军区将军奉诏安分（军区忠诚40至69），维系着稳固的宗藩服从。"
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_1: "军区忠诚同步：离心"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_1: "本军区将领心怀怨望（军区忠诚20至39），附庸忠诚显著下滑并可能抗命滞税。"
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_0: "军区忠诚同步：离叛"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_0: "本军区拥兵抗诏（军区忠诚低于20），附庸忠诚崩塌且随时可能举兵反叛。"
 AUTO_MODIFIER_NAME_oe_t2_archetype_army: "陆军核心军区编制"
 AUTO_MODIFIER_DESC_oe_t2_archetype_army: "忠顺的陆军核心军区整肃常备兵团，为帝国主力机动野战提供强悍士气与兵源。"
 AUTO_MODIFIER_NAME_oe_t2_archetype_navy: "海军军区护航清剿"
 AUTO_MODIFIER_DESC_oe_t2_archetype_navy: "忠顺的海军军区常年巡弋海道、清剿海盗并维系帝国制海权与海上商力。"
 AUTO_MODIFIER_NAME_oe_t2_archetype_frontier: "边镇军区要塞铁砧"
 AUTO_MODIFIER_DESC_oe_t2_archetype_frontier: "忠顺的边镇军区修筑廉价要塞群并扩充边关驻军，以纵深防线迟滞外敌大军。"
 AUTO_MODIFIER_NAME_oe_t2_archetype_civil: "民政腹地军区文治"
 AUTO_MODIFIER_DESC_oe_t2_archetype_civil: "忠顺的民政军区免于战火拖累，专司农耕输粮、兴学提识与高效征税。"
 AUTO_MODIFIER_NAME_oe_t2_archetype_charter: "特许商邦军区金融枢纽"
 AUTO_MODIFIER_DESC_oe_t2_archetype_charter: "忠顺的特许商邦与意大利军区借低息融资与港埠商队扩大帝国贸易利源。"
 STATIC_MODIFIER_NAME_oe_t2_senate_triumphator: "凯旋入阁元老宿将"
 STATIC_MODIFIER_DESC_oe_t2_senate_triumphator: "荣归君士坦丁堡并获颁凯旋礼遇的老将军，晋入元老院参赞军国要务。"
 STATIC_MODIFIER_NAME_oe_t2_imperial_triumph_splendor: "帝都凯旋大典威仪"
 STATIC_MODIFIER_DESC_oe_t2_imperial_triumph_splendor: "隆重举行的凯旋式彰显皇室恩威并济，提振帝国正统性与四方声望。"
 STATIC_MODIFIER_NAME_oe_t2_imperial_inlaw_bond: "皇室联姻外戚纽带"
 STATIC_MODIFIER_DESC_oe_t2_imperial_inlaw_bond: "军区将军与皇室缔结姻亲纽带，大幅稳固其对宗主的忠心与政治体面。"
 STATIC_MODIFIER_NAME_oe_t2_hereditary_strategos: "敕封世守边镇军权"
 STATIC_MODIFIER_DESC_oe_t2_hereditary_strategos: "朝廷特准本军区世守兵权，激励将士死战守土并压低要塞维护耗费，但朝廷日后削权亦倍加艰难。"
 STATIC_MODIFIER_NAME_oe_t2_inspectorate_order: "御史巡按肃政清流"
 STATIC_MODIFIER_DESC_oe_t2_inspectorate_order: "君士坦丁堡御史巡行军区厘清账目与军纪，增进税收效率与附庸忠顺。"
 STATIC_MODIFIER_NAME_oe_t2_tax_concession_5y: "元老院调停减贡特许"
 STATIC_MODIFIER_DESC_oe_t2_tax_concession_5y: "经元老院斡旋获准五年宽减军区贡赋与查核，暂且抚平将领怨气。"
 STATIC_MODIFIER_NAME_oe_t2_strategoi_pay_pledge: "诸镇誓师加饷协约"
 STATIC_MODIFIER_DESC_oe_t2_strategoi_pay_pledge: "朝廷承诺提高军费拨付以换取诸军区将军重新宣誓效忠，短期军费开支有所攀升。"
 STATIC_MODIFIER_NAME_oe_t2_loyal_enforcer_honor: "勤王平乱忠镇嘉奖"
 STATIC_MODIFIER_DESC_oe_t2_loyal_enforcer_honor: "奉诏出兵威压抗命邻镇并立功受赏，全军士气与忠贞之志倍增。"
 oe_t2_setup.1.t: "帝国军区建制方略"
 oe_t2_setup.1.d: "内忧外患之下，帝国诸省亟待整顿防务。若依昔日细分辖区一时遍设军区，巴尔干弹丸之地便会裂出数镇、骤耗外交容量并滋生将领坐大之患；若择要设立两大核心大军区并暂行兼管，则既可固守两京屏障，又能留出宽裕外交容量与直辖皇领。\n\n眼下可设立的历史辖区：[ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_ui_creatable_count')|0]"
 oe_t2_setup.1.a: "精简核心大军区制（推荐）"
 oe_t2_setup.1.a.tt: "仅设立#Y 2#!个核心军区：#Y 色雷斯—马其顿（阿德里安堡）#!与#Y 帖撒罗尼迦#!（暂兼管相邻的#Y 塞雷斯#!走廊，日后可随时析置独立）；#Y 普罗夫迪夫#!与#Y 色萨利#!留归皇帝直辖皇领。开局外交容量占用由#R 2.50#!骤降至#G 0.30#!，且不耗权威。"
 oe_t2_setup.1.b: "依历史细分全设诸军区"
 oe_t2_setup.1.b.tt: "在全部可设立的历史辖区各设一个独立军区，不花费权威；各军区初始兵力与库银将按辖区规模分级发放。"
 oe_t2_setup.1.c: "皇帝直辖，日后逐一建制"
 oe_t2_setup.1.c.tt: "开局不设军区，全部领地归皇室直辖。之后可随时在“帝国柱石”的“军区”页或行政令中手动设立，每个花费#R 5#!权威。"
 oe_t2_auth_3_tt: "帝国权威至少达到#Y 3#!"
 oe_t2_auth_5_tt: "帝国权威至少达到#Y 5#!"
 oe_t2_auth_8_tt: "帝国权威至少达到#Y 8#!"
 oe_t2_auth_10_tt: "帝国权威至少达到#Y 10#!"
 oe_t2_auth_16_tt: "帝国权威至少达到#Y 16#!（回收世守军权须耗双倍权威）"
 oe_t2_small_jurisdiction_tt: "该军区辖地不超过#Y 15#!处且非海军军区（中小型陆军军区方可并省合治）"
 oe_t2_receiver_loyal_tt: "接管军区须处于#G 平稳#!或#G 忠贞#!状态"
 oe_t2_combined_cap_tt: "合治后的合并辖地不超过#Y 45#!处（防止巨无霸军区失控）"
 oe_t2_split_seat_owned_tt: "原兼管辖区的历史治所须仍由帝国直辖持有"
 oe_t2_cd_ready_tt: "该军区当前未处于此项敕令的冷却期内"
 oe_t2_inspect_cd_tt: "距上次御史巡按诸军区已满#Y 10#!年"
 oe_t2_tenure_4_tt: "该军区将军任职已满#Y 4#!年"
 oe_t2_tenure_6_tt: "该军区将军任职已满#Y 6#!年"
 oe_t2_band_1_plus_tt: "该军区尚未陷入#R 离叛#!状态"
 oe_t2_band_2_plus_tt: "该军区须处于#G 平稳#!或#G 忠贞#!状态"
 oe_t2_hereditary_req_tt: "该军区须为边镇或军务效率达到#G 良治#!以上"
 oe_t2_choose_receiving_theme: "选择接管兼管的邻近军区"
 oe_t2_no_receiving_theme: "@trigger_no!没有同档或邻近距离、兼管少于3处辖区且非海军军区的忠顺军区可接管"
 oe_t2_choose_rotate_partner: "选择对调将军的另一军区"
 oe_t2_no_rotate_partner: "@trigger_no!没有可供对调将军的其他非专制公军区"
 oe_t2_consolidate_theme: "并省合治（合并小军区）"
 oe_t2_consolidate_theme_desc: "消耗#R 5#!帝国权威，将辖地不超过15处的非海军军区并归同档或邻近距离的忠顺陆军军区暂行兼管（每座接管军区最多兼管3处辖区、合并总辖地不超过45处），移交全部岗哨、兵马与半数库银人力以节省外交容量；39处历史辖区编号完好保留，日后可随时按序析置独立。"
 oe_t2_consolidate_theme_act: "将[SCOPE.sCountry('recipient').GetName]并省合治"
 oe_t2_consolidate_theme_effect_text: "[SCOPE.sCountry('actor').GetName]下诏将[SCOPE.sCountry('recipient').GetName]并省合治。"
 oe_t2_consolidate_theme_effect_text_past: "[SCOPE.sCountry('actor').GetName]已将[SCOPE.sCountry('recipient').GetName]并省合治。"
 PROPOSE_oe_t2_consolidate_theme: "是否耗费5点帝国权威，将$RECIPIENT$并入另一忠顺军区兼管？\n\n$INFO$"
 oe_t2_split_theme: "析置新军区（拆分兼管辖区）"
 oe_t2_split_theme_desc: "消耗#R 10#!帝国权威，将该军区暂行兼管的历史辖区析置出来，按历史治所重新独立建制并依辖区规模分级发放初始兵力与库银；原军区获#G +5#!忠诚安抚。"
 oe_t2_split_theme_act: "从[SCOPE.sCountry('recipient').GetName]析置独立军区"
 oe_t2_split_theme_effect_text: "[SCOPE.sCountry('actor').GetName]从[SCOPE.sCountry('recipient').GetName]析置兼管辖区为独立军区。"
 oe_t2_split_theme_effect_text_past: "[SCOPE.sCountry('actor').GetName]已从[SCOPE.sCountry('recipient').GetName]析置独立军区。"
 PROPOSE_oe_t2_split_theme: "是否耗费10点帝国权威，从$RECIPIENT$析置其兼管的历史辖区？\n\n$INFO$"
 oe_t2_rotate_strategoi: "易镇调防（双督对调）"
 oe_t2_rotate_strategoi_desc: "消耗#R 5#!帝国权威与#R 50#!金，将任职满4年的老将与另一军区将军和平对调防区：完整保留二人能力与特质，双方任期归零、消除长期坐大惩罚并立获#G +8#!忠诚。冷却5年。"
 oe_t2_rotate_strategoi_act: "对调[SCOPE.sCountry('recipient').GetName]的军区将军"
 oe_t2_rotate_strategoi_effect_text: "[SCOPE.sCountry('actor').GetName]下诏为[SCOPE.sCountry('recipient').GetName]施行易镇调防。"
 oe_t2_rotate_strategoi_effect_text_past: "[SCOPE.sCountry('actor').GetName]已为[SCOPE.sCountry('recipient').GetName]完成易镇调防。"
 PROPOSE_oe_t2_rotate_strategoi: "是否耗费5点帝国权威与50金，为$RECIPIENT$与另一军区对调将军？\n\n$INFO$"
 oe_t2_triumph_retire: "凯旋入阁（功臣荣退）"
 oe_t2_triumph_retire_desc: "投资#R 3#!帝国权威与#R 120#!金，将任职满6年且忠顺的功臣体面召回君士坦丁堡举行凯旋式并晋封元老宿将，帝国反获#G +8#!权威（净增#G +5#!）、#G +10#!陆军传统与5年凯旋威仪，本军区平滑换帅并获#G +10#!忠诚。冷却10年。"
 oe_t2_triumph_retire_act: "召[SCOPE.sCountry('recipient').GetName]功臣凯旋入阁"
 oe_t2_triumph_retire_effect_text: "[SCOPE.sCountry('actor').GetName]召[SCOPE.sCountry('recipient').GetName]功臣返京凯旋入阁。"
 oe_t2_triumph_retire_effect_text_past: "[SCOPE.sCountry('actor').GetName]已为[SCOPE.sCountry('recipient').GetName]功臣举行凯旋荣退礼。"
 PROPOSE_oe_t2_triumph_retire: "是否斥资120金为$RECIPIENT$功臣举行凯旋式并召其入阁荣退？\n\n$INFO$"
 oe_t2_imperial_marriage_tie: "皇室联姻羁縻"
 oe_t2_imperial_marriage_tie_desc: "消耗#R 5#!帝国权威与#R 10#!威望，安排未婚宗室与军区将军缔结姻亲并赐予20年外戚纽带（附庸忠诚#G +12#!、军区忠诚#G +15#!）；若该将军出身四大豪族，将令其本族影响力骤增#R +60#!。冷却10年。"
 oe_t2_imperial_marriage_tie_act: "与[SCOPE.sCountry('recipient').GetName]缔结皇室联姻"
 oe_t2_imperial_marriage_tie_effect_text: "[SCOPE.sCountry('actor').GetName]与[SCOPE.sCountry('recipient').GetName]缔结皇室联姻羁縻。"
 oe_t2_imperial_marriage_tie_effect_text_past: "[SCOPE.sCountry('actor').GetName]已与[SCOPE.sCountry('recipient').GetName]缔结皇室联姻。"
 PROPOSE_oe_t2_imperial_marriage_tie: "是否耗费5点帝国权威与10威望，与$RECIPIENT$将军缔结皇室联姻？\n\n$INFO$"
 oe_t2_confirm_hereditary_command: "敕封世守军权"
 oe_t2_confirm_hereditary_command_desc: "消耗#R 8#!帝国权威，敕准边镇或精锐军区世守兵权：永久启用世守忠诚加成，并获30年世守军威（士气#G +8%#!、补员#G +25%#!、要塞维护效率#G +20%#!）。代价：日后该镇陷入危机时抗命风险翻倍，且敕收世守权须耗双倍权威。"
 oe_t2_confirm_hereditary_command_act: "敕封[SCOPE.sCountry('recipient').GetName]世守军权"
 oe_t2_confirm_hereditary_command_effect_text: "[SCOPE.sCountry('actor').GetName]敕封[SCOPE.sCountry('recipient').GetName]世守军权。"
 oe_t2_confirm_hereditary_command_effect_text_past: "[SCOPE.sCountry('actor').GetName]已敕封[SCOPE.sCountry('recipient').GetName]世守军权。"
 PROPOSE_oe_t2_confirm_hereditary_command: "是否耗费8点帝国权威，敕准$RECIPIENT$世守军权？\n\n$INFO$"
 oe_t2_dec_imperial_inspection: "敕派御史巡按诸军区"
 oe_t2_dec_imperial_inspection.title: "敕派御史巡按诸军区"
 oe_t2_dec_imperial_inspection_desc: "遣君士坦丁堡巡按御史分赴各军区核验粮饷与军政，刷新全部忠顺军区5年肃政加成并安抚离心将领。冷却10年。"
 oe_t2_dec_imperial_inspection.desc: "遣君士坦丁堡巡按御史分赴各军区核验粮饷与军政，刷新全部忠顺军区5年肃政加成并安抚离心将领。冷却10年。"
 oe_t2_dec_imperial_inspection.a: "颁诏巡按诸军区"
 oe_t2_dec_imperial_inspection_tt: "全部忠顺军区获5年#G 御史巡按肃政清流#!（税效+5%、附庸忠诚+6）与#G +5#!军区忠诚；其余离心军区获#G +8#!安抚忠诚。冷却10年。"
 oe_t2_dec_revoke_hereditary_charter: "敕收边镇世守军权"
 oe_t2_dec_revoke_hereditary_charter.title: "敕收边镇世守军权"
 oe_t2_dec_revoke_hereditary_charter_desc: "以双倍帝国权威（16点）强行收回当前最离心世守军区的世袭兵权敕书，消除其危机抗命翻倍隐患，但将引发该镇强烈不满。"
 oe_t2_dec_revoke_hereditary_charter.desc: "以双倍帝国权威（16点）强行收回当前最离心世守军区的世袭兵权敕书，消除其危机抗命翻倍隐患，但将引发该镇强烈不满。"
 oe_t2_dec_revoke_hereditary_charter.a: "削夺世守兵权"
 oe_t2_dec_revoke_hereditary_charter_tt: "剥夺最离心世守军区的世守资格与30年世守军威修正，并令其军区忠诚下降#R -15#!。"
 oe_t2_dec_split_merged_region: "析置兼管辖区为独立军区"
 oe_t2_dec_split_merged_region.title: "析置兼管辖区为独立军区"
 oe_t2_dec_split_merged_region_desc: "当帝国威权与外交容量充裕时，可将大军区暂行兼管的历史辖区（如帖撒罗尼迦兼管的塞雷斯走廊）析置为独立军区，恢复完整建制。"
 oe_t2_dec_split_merged_region.desc: "当帝国威权与外交容量充裕时，可将大军区暂行兼管的历史辖区（如帖撒罗尼迦兼管的塞雷斯走廊）析置为独立军区，恢复完整建制。"
 oe_t2_dec_split_merged_region.a: "下诏析置新军区"
 oe_t2_dec_split_merged_region_tt: "移除原军区对兼管辖区的岗哨并在历史治所独立建区（按辖区规模分级发放初始兵力与库银），原军区获#G +5#!忠诚补偿。"
 oe_t2_crisis.1.t: "抗命滞税与拥兵自重"
 oe_t2_crisis.1.d: "急报传至大皇宫：[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName]的军区将军已公然滞留本季解京赋税，并在治所校场私自增募亲兵，对朝廷传诏百般推诿。幸而其尚未公开竖旗谋反——趁叛乱尚未爆发，陛下仍有先礼后兵、政治解决之机。"
 oe_t2_crisis.1.a: "密遣禁卫突袭清君侧"
 oe_t2_crisis.1.a.tt: "通常有#G 70%#!概率雷霆拿捕叛将（立即换帅、任期归零、忠诚拉至#G 55#!，全境余镇震慑#G +5#!忠诚，并剥夺世守权）；#R 30%#!概率走漏风声，该镇忠诚骤跌至#R 15#!加速反叛。若该镇拥#Y 世守军权#!，失败风险翻倍至#R 60%#!。"
 oe_t2_crisis.1.b: "委请元老院调停并予减贡特许"
 oe_t2_crisis.1.b.tt: "赐予[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName]5年#Y 元老院调停减贡特许#!（附庸忠诚+12）并立即提升其军区忠诚#G +20#!，和平化解危局；代价是帝国柱石民意#R -5#!。"
 oe_t2_crisis.1.c: "檄召忠顺邻镇[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName]夹击抄产"
 oe_t2_crisis.1.c.tt: "调动忠顺邻镇[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName]大军压境强行罢免叛将，赐[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName]#G 100#!金赏赐与#G +10#!忠诚，令[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName]换帅并恢复忠诚至#G 50#!；若叛将出身四大豪族，更顺势抄没其庄园，削该族影响力#G -80#!并充实国库#G +250#!金。"
 oe_t2_crisis.2.t: "诸镇联名上书"
 oe_t2_crisis.2.d: "多名心怀不满的军区将军已暗中串联，推举[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName]领衔向君士坦丁堡递交联名陈情表，要求朝廷宽减税赋、保证军饷并不得轻动地方兵权。若任由诸镇合流，帝国将面临多方并发的大叛乱。"
 oe_t2_crisis.2.a: "重金分化瓦解领头军区"
 oe_t2_crisis.2.a.tt: "赐予[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName]#Y 120#!金与5年减贡特许（忠诚#G +20#!）使其脱离串联，其余不满军区群龙无首、忠诚回升#G +6#!。"
 oe_t2_crisis.2.b: "召开将领誓师大会并允诺加饷"
 oe_t2_crisis.2.b.tt: "付出#R 6#!点帝国权威与5年#Y 诸镇誓师加饷协约#!，换取帝国全境全部军区重誓效忠、忠诚齐升#G +12#!。"
 oe_t2_crisis.2.c: "严辞斥回联名表以正国法"
 oe_t2_crisis.2.c.tt: "帝国权威立增#G +10#!，但全部不满军区忠诚再降#R -8#!（拥世守军权者额外#R -8#!），局势逼近武力摊牌。"
 oe_t2_crisis.3.t: "抄没叛族庄园与军区整肃"
 oe_t2_crisis.3.d: "在[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName]忠顺大军的威慑与配合下，[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName]的抗命将领已被顺利解职押解回京，叛党私蓄庄园与仓廪亦尽数查封入册。眼下元老院与户部正请示陛下如何处分此次整肃所得战利品与功赏。"
 oe_t2_crisis.3.a: "厚赏平乱忠镇[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName]以励效忠"
 oe_t2_crisis.3.a.tt: "赐予[ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName]10年#G 勤王平乱忠镇嘉奖#!（陆军士气+5%、附庸忠诚+10），帝国威望#G +5#!。"
 oe_t2_crisis.3.b: "田产尽归皇室直领并整饬朝纲"
 oe_t2_crisis.3.b.tt: "将抄没庄园折银纳入国库（#G +100#!金），并借整肃之威提振帝国权威#G +4#!。"
