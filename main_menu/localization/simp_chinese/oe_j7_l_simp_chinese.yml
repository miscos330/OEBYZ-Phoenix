 oe_j7.1.a: "加封安抚"
 oe_j7.1.a.tt: "花费#R 2#!个月的贸易与税收收入\n锡林布里亚获得[ShowModifier('oe_j7_appanage')]，持续#Y 10#!年\n长房起事的可能减半；即使起事，到期时有一半可能就此作罢"
 oe_j7.1.b: "向苏丹出更高的价"
 oe_j7.1.b.tt: "花费#R 4#!个月的贸易与税收收入\n苏丹这回不做长房的后台\n奥斯曼对帝国好感#G +10#!，持续#Y 5#!年\n帝国正臣属苏丹时：苏丹的耐心#G +10#!"
 oe_j7.1.c: "加强城防，盯住长房"
 oe_j7.1.c.tt: "花费#R 1#!个月的贸易与税收收入\n日后当街迎战的几率#G +15#!，复位的几率#G +10#!"
 oe_j7.1.d: "立长房为共治皇帝"
 oe_j7.1.d.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]成为继承人；帝国可以立共治皇帝时，立为共治皇帝（已有共治皇帝时只立继承人）\n不会有政变；曼努埃尔一系心怀不满"
 oe_j7.2.t: "金门"
 oe_j7.2.desc_ytg: "#F 1390年春，约翰七世带着苏丹给的兵马进了城，自立为帝。老皇帝约翰五世退进金门一带的城堡，闭门不出。一说城里有人开了门。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]的人马已在城下，城里也有人接应。苏丹的骑兵跟在后面。金门的城堡还在我们手里。[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]要拿主意：守，还是迎？"
