 oe_j7.4.a: "照办，拆掉新修的城防"
 oe_j7.4.a.tt: "京城获得[ShowModifier('oe_j7_gate_razed')]，持续#Y 20#!年\n金门的建筑本身留着，拆的只是新修的城墙\n奥斯曼对帝国好感#G +15#!，持续#Y 5#!年\n帝国正臣属苏丹时：苏丹的耐心#G +10#!"
 oe_j7.4.b: "拒绝"
 oe_j7.4.b.tt: "奥斯曼对帝国好感#R −30#!，持续#Y 5#!年\n帝国正臣属苏丹时：苏丹的耐心#R −20#!"
 oe_j7.4.c: "送钱代替"
 oe_j7.4.c.tt: "花费#R 3#!个月的贸易与税收收入\n苏丹收了钱，不再提城防的事"
 oe_j7.5.t: "另一位皇帝"
 oe_j7.5.desc_ftn: "#F 史实上，1390年以后，约翰七世据说以锡林布里亚为据点，受苏丹庇护。一说1397年约翰七世想把帝位的继承权卖给法兰西国王。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]在宫外自成一方，身边的人都称之为皇帝。[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]住在苏丹那里，苏丹待之如上宾。这样的消息已经不是第一回传进宫里了。朝中在议：怎样对待这位“另一位皇帝”？"
 oe_j7.5.desc_ft: "#F 史实上，1390年以后，约翰七世据说以锡林布里亚为据点，受苏丹庇护。一说1397年约翰七世想把帝位的继承权卖给法兰西国王。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]在宫外自成一方，身边的人都称之为皇帝。[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]住在苏丹那里，苏丹待之如上宾。朝中在议：怎样对待这位“另一位皇帝”？"
