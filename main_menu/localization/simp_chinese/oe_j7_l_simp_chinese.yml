 oe_j7.3.desc_x: "#F 史实上，曼努埃尔在外面凑了几条船，据说其中有罗得岛骑士团的战船。几次进攻之后，曼努埃尔夺回了京城，老皇帝复位；一说约翰七世出走后投奔了苏丹。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]坐上皇位已有几个月。老皇帝的人在海上集了船，等京城的回话。朝中各派都在等一个答复。"
 oe_j7.3.a: "借骑士团的船，迎老皇帝复位"
 oe_j7.3.a.tt: "花费#R 1#!个月的贸易与税收收入\n医院骑士团对帝国好感#G +10#!，持续#Y 5#!年\n复位的几率：#G [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_restore_pct').GetValue|0]%#!\n成：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]复位；[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]已不在时，由[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip]即位；[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]回到锡林布里亚的封邑（[ShowModifier('oe_j7_appanage')]，#Y 10#!年）；苏丹在后时投奔苏丹\n败：新朝站稳，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]被关押#Y 5#!年"
 oe_j7.3.b: "请苏丹裁断"
 oe_j7.3.b.tt: "帝国正臣属苏丹时：每年的贡金#R +20%#!；否则花费#R 6#!个月的贸易与税收收入\n复位必成：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]复位；[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]已不在时，由[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip]即位；[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]回到锡林布里亚的封邑（[ShowModifier('oe_j7_appanage')]，#Y 10#!年）；苏丹在后时投奔苏丹\n苏丹日后会来要这份人情"
 oe_j7.3.c: "承认新皇"
 oe_j7.3.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]留在皇位；[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]退居，不再关押\n海上集船的那一位若在帝国中，心怀不满"
 oe_j7.4.t: "苏丹的要价"
 oe_j7.4.desc_pgv: "#F 史实上，京城收复以后，一说巴耶济德要约翰五世拆掉金门一带新修的城防，不然就不放回在苏丹营中的曼努埃尔。据说老皇帝照办了。#!\n\n如今，苏丹的使者进了京城：金门一带新修的城防必须拆掉。这是当初请苏丹裁断时欠下的人情。金门的城堡刚刚在变故中守住了京城的一角。帝国还是苏丹的臣属，拒绝的代价不小。[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]要拿主意。"
 oe_j7.4.desc_pg: "#F 史实上，京城收复以后，一说巴耶济德要约翰五世拆掉金门一带新修的城防，不然就不放回在苏丹营中的曼努埃尔。据说老皇帝照办了。#!\n\n如今，苏丹的使者进了京城：金门一带新修的城防必须拆掉。这是当初请苏丹裁断时欠下的人情。金门的城堡刚刚在变故中守住了京城的一角。[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]要拿主意。"
