 oe_j7.5.a: "给长房一份年金"
 oe_j7.5.a.tt: "现在花费#R 1#!个月的贸易与税收收入；此后每年再付一次，共#Y 5#!年；付不起时年金中断\n日后叔侄和解的几率#G +20#!；年金中断则#R −10#!"
 oe_j7.5.b: "不理会"
 oe_j7.5.b.tt: "日后叔侄和解的几率#R −10#!（每回不理会都算）"
 oe_j7.5.c: "请威尼斯从中说合"
 oe_j7.5.c.tt: "威尼斯对帝国好感#G +5#!，持续#Y 5#!年\n日后叔侄和解的几率#G +15#!"
 oe_j7.6.t: "叔侄和解"
 oe_j7.6.desc_ytpk: "#F 1399年，叔侄和解，约翰七世回到京城；一说是法国元帅布锡考特从中说合。同年年底曼努埃尔随布锡考特西行，把京城交给了侄子。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]托人带话：愿意回京。可[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]还在苏丹那里，要回来，先得走出苏丹的门。这几年的年金没有白给。京城正被苏丹困着，朝中有人说，多一位皇族守城总是好的。[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]要拿主意。"
 oe_j7.6.desc_ytp: "#F 1399年，叔侄和解，约翰七世回到京城；一说是法国元帅布锡考特从中说合。同年年底曼努埃尔随布锡考特西行，把京城交给了侄子。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]托人带话：愿意回京。可[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]还在苏丹那里，要回来，先得走出苏丹的门。这几年的年金没有白给。[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]要拿主意。"
