l_simp_chinese:
 OE_J7_END_1: "长房之争：皇帝当街迎战，长房败走。"
 OE_J7_END_2: "长房之争：受了加封的长房最终没有起事。"
 OE_J7_END_3: "长房之争：长房被立为继承人与共治皇帝，没有政变。"
 OE_J7_END_4: "长房之争：皇帝开城相迎，立长房为继承人与共治皇帝。"
 OE_J7_END_5: "长房之争：长房夺城称帝，几个月后借骑士团的船复位。"
 OE_J7_END_6: "长房之争：长房夺城称帝，新朝站稳了。"
 OE_J7_END_7: "长房之争：长房夺城称帝，苏丹裁断，旧朝复位。"
 OE_J7_END_8: "长房之争：长房早已是储君，用不着夺城。"
 OE_J7_END_9: "长房之争：安德洛尼卡一系没有留下能争位的人。"
 OE_J7_END_10: "长房之争：长房夺城称帝，不久死了，旧朝复位。"
 OE_J7_END_R: "长房之争：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]在位，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]困守金门一带的城堡。"
 OE_J7_END_G: "长房之争：长房还没起事就死了，或京城已不在帝国手里。"
 OE_J7_END_X: "长房之争：这几年朝中多事，长房一直没有等到时机。"
 OE_J7_END_S: "长房之争：长房心怀怨望，帝国正在提防。"
 OE_J7_END_W: "长房之争：还没到时候（1386年起，若安德洛尼卡一系还有人在）。"
 OE_J7_END2_1: "叔侄和解，长房回到了京城。"
 OE_J7_END2_2: "朝廷愿意和解，长房却没有回来。"
 OE_J7_END2_3: "皇帝不肯与长房和解。"
 OE_J7_END2_4: "长房没等到和解就死了。"
 OE_J7_END2_5: "和解的时机过去了。"
 OE_J7_END2_O: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]还在京城以外，朝廷与之周旋。"
 OE_J7_END2_W: "长房的下文还没有分晓。"
 STATIC_MODIFIER_NAME_oe_j7_appanage: "长房的封邑"
 STATIC_MODIFIER_NAME_oe_j7_new_reign: "新朝未稳"
 STATIC_MODIFIER_NAME_oe_j7_gate_razed: "金门城防已拆"
 oe_j7_b_outbid: "拜占庭出了更高的价，请苏丹不要插手皇家的事"
 oe_j7_b_galleys: "拜占庭借了我们的战船去夺回京城"
 oe_j7_b_razed: "拜占庭照我们的意思拆了京城新修的城防"
 oe_j7_b_refused: "拜占庭不肯拆京城新修的城防"
 oe_j7_b_mediate: "拜占庭请我们在皇族之间说合"
 oe_j7.1.t: "锡林布里亚的怨望"
 oe_j7.1.desc_shbm: "#F 1373年，安德洛尼卡与穆拉德之子一同起兵，事败，被刺瞎一眼。1376年，安德洛尼卡借热那亚人和突厥人夺了京城，三年后又被赶回加拉塔。1381年（一说1382年）约翰五世与安德洛尼卡和解：安德洛尼卡和儿子约翰重新成为继承人，得了锡林布里亚作封邑。1385年安德洛尼卡死了，约翰觉得叔父曼努埃尔迟早会把自己挤开。据说约翰向苏丹和热那亚人都求过援。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]的使者在苏丹营中和加拉塔之间来回。长房守着锡林布里亚，有城也有兵。长房是在苏丹宫中长大的。据说长房的母亲是保加利亚沙皇的女儿。安德洛尼卡一系只剩这一个儿子了。朝中在议：拿长房怎么办？"
