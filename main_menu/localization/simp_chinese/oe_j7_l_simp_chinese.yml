 oe_j7.2.a: "退守金门堡，等援兵"
 oe_j7.2.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]即位；[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]退守金门一带的城堡，仍在帝国\n帝国获得[ShowModifier('oe_j7_new_reign')]，直到这场变故了结\n三到六个月后，会有人来救"
 oe_j7.2.b: "当街迎战"
 oe_j7.2.b.tt: "花费#R 1#!个月的贸易与税收收入\n迎战得手的几率：#G [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_street_pct').GetValue|0]%#!\n得手：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]出走（苏丹在后时投奔苏丹，否则关押#Y 5#!年），威望#G +5#!\n失手：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]即位，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]被关押#Y 5#!年，稳定#R −2.5#!"
 oe_j7.2.c: "开城相迎，立为共治皇帝"
 oe_j7.2.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]成为继承人；帝国可以立共治皇帝时，立为共治皇帝（已有共治皇帝时只立继承人）\n不会有政变；曼努埃尔一系心怀不满"
 oe_j7.3.t: "罗得岛的战船"
 oe_j7.3.desc_yrkd: "#F 1390年夏天，曼努埃尔在外面凑了几条船，据说其中有罗得岛骑士团的战船。几次进攻之后，秋天曼努埃尔夺回了京城，老皇帝复位；一说约翰七世出走后投奔了苏丹。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]坐上皇位已有几个月。老皇帝已经死在城堡里。船上的人要立的是[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip]。[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip]在海上集了船，等京城的回话。罗得岛的骑士答应出两条战船。朝中各派都在等一个答复。"
