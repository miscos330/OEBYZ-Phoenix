 oe_j7.91.t: "京城的消息"
 oe_j7.91.desc_x221: "迎战得手：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]的人马在街上被打散，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]逃到了苏丹那里。"
 oe_j7.91.desc_x222: "迎战得手：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]的人马在街上被打散了。"
 oe_j7.91.desc_x223: "迎战失手：[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]进了宫，[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip]被关了起来。"
