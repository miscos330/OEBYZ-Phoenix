l_simp_chinese:
 oe_flavor_byz.1015.t: "崭露头角"
 oe_flavor_byz.1015.d: "（穆罕默德二世）\n\n当最后一面敌旗从城垛上落下时，军中终于不再只把贝利萨留斯视作奥斯马里斯家的一位年轻子弟。围城期间，他反复察看城墙与壕沟，亲自核对工事进度，把急于强攻的军官留在军帐，又把工兵和辎重按时送到了最需要的地方。\n\n守军原以为自己还能坚持很久。等到破口出现、援军的道路也被切断，他们才发现包围圈已在不知不觉中收紧。如今要塞已经落入帝国之手，捷报上那个年轻的名字，开始被宫廷与军中认真记住。\n\n多年以前瓦尔纳的风雨，或许只是一个少年的梦；眼前这座降服的要塞，却是谁都无法否认的战功。"
 oe_flavor_byz.1015.a: "罗马的军中，又多了一位值得记住的人。"
 oe_flavor_byz.1015.a.tt: "奥斯马里斯豪族影响力 #G +10#!。\n威望 #G +5#!。"
 oe_flavor_byz.1015.historical_info: "历史上的穆罕默德二世以围城战争闻名，1453年攻取君士坦丁堡是其统治生涯的重要转折。本事件中的贝利萨留斯及其为东罗马效力的战功属于架空历史。"
 oe_flavor_byz.1016.t: "战争之道"
 oe_flavor_byz.1016.d: "（穆罕默德二世）\n\n意大利的战事已经展开，贝利萨留斯却没有在呈给皇帝的地图上逐一圈出村庄。他的指尖停在各省的行政中心、道路交会处，以及能够支撑抵抗的要塞上。\n\n“陛下，一省的命脉并不平均分布在每一座田庄里。夺下省会，接管文书、仓廪与征税的衙署，再令使者带着皇帝的诏令走遍乡间，那些没有城墙保护的地方便失去了继续抵抗的依凭。至于仍有要塞的城市，我们会亲自去取。”\n\n他请求将军队、文书官和接收地方的官吏一同推进，让每一次胜利都立即成为帝国的疆土。至于让新臣民认同罗马、让新领土真正融入帝国，那将是战后的漫长功课。"
 oe_flavor_byz.1016.a: "准你依此行事，将胜利化作帝国的疆土。"
 oe_flavor_byz.1016.a.tt: "贝利萨留斯亲自指挥东罗马军队时，对意大利地区的交战敌国地点启用占领即征服：\n攻占普通地点或围下要塞后，该地点立即归东罗马所有。\n若攻占的是省会，同一地理省份内所有属于交战敌国、且#Y 没有要塞#!的意大利地点一并归东罗马所有；其他要塞仍须逐个攻克。\n#Y 不新增核心#!；原有核心保留。中立国家、东罗马及其附庸的土地不受连带征服影响。此能力不授予其他将领。"
 oe_flavor_byz.1016.historical_info: "历史上的穆罕默德二世把军事征服与接管地方行政相结合，奥斯曼军队也曾于1480年占领意大利的奥特朗托。本事件将其军事生涯改写为东罗马统帅贝利萨留斯的意大利战争；省会带动无要塞地点易主是本模组的游戏机制。"
