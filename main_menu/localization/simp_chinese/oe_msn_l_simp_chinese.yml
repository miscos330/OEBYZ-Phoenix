 oe_msn_byz_12_eternal_roman_destiny_req_tt:0 "完成三条支线，拥有君士坦丁堡且直辖或由附庸掌控罗马，稳定度不低于 20，处于专制或更晚时代，位列列强且首都发展度不低于 32。"
 oe_msn_tur_destiny:0 "#bold #color_yellow 崇高国度：三大洲奥斯曼天命#!#!"
