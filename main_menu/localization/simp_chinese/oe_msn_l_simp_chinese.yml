 oe_msn_byz_01_queen_of_cities:0 "紫衣中兴：稳固君堡与塞萨洛尼基"
 oe_msn_byz_01_queen_of_cities_desc:0 "君士坦丁堡与塞萨洛尼基分扼博斯普鲁斯海峡与爱琴海北岸，是东罗马历经劫难后赖以中兴的双重枢纽。唯有重修市政[buildings|e]、提振[capital|e]的[development|e]并稳固朝廷[stability|e]，方能让万城之女皇重焕荣光，向环地中海诸邦昭告紫衣法统未曾断绝。"
 oe_msn_byz_01_queen_of_cities_req_tt:0 "拥有君士坦丁堡与塞萨洛尼基，稳定度不低于 5，首都发展度不低于 18，且拥有市场或粮仓建筑。"
 oe_msn_byz_02_new_theme_corps:0 "重整军区与近卫军团"
 oe_msn_byz_02_new_theme_corps_desc:0 "长期依赖反复无常的拉丁与加泰罗尼亚雇佣兵耗尽了帝国国库，更令色雷斯屡遭兵燹。唯有重整常备近卫军团与坚固军区[buildings|e]、涵养百战[army_tradition|e]并凝聚贵族[estate_satisfaction|e]，皇帝方能锻造一支忠于紫衣的罗马[army|e]，为收复东方故土奠定武备根基。"
 oe_msn_byz_02_new_theme_corps_req_tt:0 "拥有君士坦丁堡，稳定度不低于 10，国库不少于 200 金币，且陆军传统不低于 15 或建有军区总部/城堡。"
 oe_msn_byz_03_ecumenical_bridge:0 "五牧首共议或古典宽容宪章"
 oe_msn_byz_03_ecumenical_bridge_desc:0 "当意大利人文主义者竞相寻访希腊典籍、东正教大公会议亦在权衡基督教世界大局之际，君士坦丁堡正立于文明交汇的潮头。主动吸纳新时代[institutions|e]并妥善安抚教会[estates|e]，既可大幅抬升罗马的[cultural_tradition|e]与[prestige|e]，又能令古典希腊学术与普世牧首法统交相辉映。"
 oe_msn_byz_03_ecumenical_bridge_req_tt:0 "拥有君士坦丁堡，稳定度不低于 15，处于文艺复兴或更晚时代，且已接纳文艺复兴思潮或建有大学/大教堂。"
 oe_msn_byz_04_praetorian_order:0 "近卫大区与近代兵法典范"
 oe_msn_byz_04_praetorian_order_desc:0 "幅员日广的地中海大帝国已不能再靠孤城权宜之计维系政务。将古老《兵法全书》与近代火器[advances|e]相融合、效法古典近卫大区统筹四方行省，不仅能全面拉升帝国[control|e]与[army_tradition|e]，也将引爆关于帝国究竟行军区官僚制抑或复兴元老院宪制的历史抉择。"
 oe_msn_byz_04_praetorian_order_req_tt:0 "拥有君士坦丁堡，处于地理大发现或更晚时代，拥有至少 40 处地点，且陆军传统不低于 25、已研习长矛火枪革新或建有练兵场。"
 oe_msn_byz_05_aegean_anatolia:0 "小亚门户抚绥：尼西亚与士麦那治理"
 oe_msn_byz_05_aegean_anatolia_desc:0 "尼西亚曾在帝国最至暗的岁月庇护流亡皇统，士麦那则扼守富庶的爱琴海东岸商埠。无论由朝廷直辖抑或交予忠诚军区[subjects|e]分治，在小亚细亚西岸重建户籍税册、恢复沿海[prosperity|e]与地方[control|e]，都能将爱琴海两岸重新熔铸为密不可分的罗马核心腹地。"
 oe_msn_byz_05_aegean_anatolia_req_tt:0 "直辖或由附庸掌控伊兹尼克（尼西亚）与士麦那，稳定度不低于 10，且统辖至少一个帝国军区附庸或拥有至少 8 处港口。"
 oe_msn_byz_06_levant_antioch:0 "普世牧首通使与东地中海教务秩序"
 oe_msn_byz_06_levant_antioch_desc:0 "奥龙特斯河畔的安条克与圣城耶路撒冷位列基督教五大牧首古座，承载着罗马在东方的法理与信仰荣光。无论是挥师重光黎凡特名城，抑或统御众邦[subjects|e]以礼仪通使四方，皆能极大彰显帝国的[religious_influence|e]、[diplomacy|e]与[prestige|e]，并为经略尼罗河打开门户。"
 oe_msn_byz_06_levant_antioch_req_tt:0 "直辖或由非主权附庸掌控安条克与耶路撒冷，或拥有至少 3 个附庸且国库不少于 350 金币。"
 oe_msn_byz_07_nile_granary:0 "帝国粮仓与内帑商税清核"
 oe_msn_byz_07_nile_granary_desc:0 "数百年间，自亚历山大港启航的皇家官粮船队曾维系着君士坦丁堡百万生民的生计，亦是凯撒财政霸权的基石。无论是重掌尼罗河三角洲沃土，抑或凭借兴盛海陆[trade|e]令国库[gold|e]充盈，全面清核粮秣与关市税基都将为帝国换来绵延不绝的[prosperity|e]与民生底气。"
 oe_msn_byz_07_nile_granary_req_tt:0 "直辖或由非主权附庸掌控亚历山大与开罗，或国库不少于 600 金币、月商税收入不低于 35 且拥有至少 30 处地点。"
 oe_msn_byz_08_eternal_rome:0 "双鹰宪章：跨区整合与法典稳固"
 oe_msn_byz_08_eternal_rome_desc:0 "自查士丁尼时代拉韦纳总督区以迄帕莱奥略王朝的复兴宿愿，台伯河畔的旧罗马与南意大利故土始终牵动着新罗马的心弦。无论跨海光复罗马与那不勒斯，抑或以六十城广土雄踞世界[great_power|e]之列，统一法典与跨区[control|e]都将令双头鹰的[legitimacy|e]与[prestige|e]震烁东西两界。"
 oe_msn_byz_08_eternal_rome_req_tt:0 "直辖或由非主权附庸掌控罗马与那不勒斯，或稳定度不低于 25、处于宗教改革或更晚时代、拥有至少 60 处地点且位列列强。"
 oe_msn_byz_09_golden_horn_clearing:0 "金角湾清算与诺米斯玛币信"
 oe_msn_byz_09_golden_horn_clearing_desc:0 "拜占庭金币的成色贬损曾令绵延七百年的诺米斯玛信用蒙尘。如今在金角湾兴建近代商贸[buildings|e]、严控通货[inflation|e]并汇集四海[trade|e]关市岁入，君士坦丁堡必将重夺威尼斯、热那亚与黑海商路之间的金融枢纽地位，将[market|e]主导权牢牢握回帝国掌中。"
 oe_msn_byz_09_golden_horn_clearing_req_tt:0 "拥有君士坦丁堡，国库不少于 400 金币，月商税收入不低于 20，且建有账房或市场建筑。"
 oe_msn_byz_10_silk_phoenix_link:0 "丝路双凤：黑海与远洋通商"
 oe_msn_byz_10_silk_phoenix_link_desc:0 "克里米亚卡法港扼守通往萨莱与东方的草原丝路咽喉，克里特干地亚则锁住往来威尼斯与亚历山大的海运要道。依托富于[navy_tradition|e]的帝国[navy|e]与绵密[maritime_presence|e]，罗马商船队将把黑海与东地中海串联为横跨欧亚的黄金[trade|e]动脉，尽收丝茶香料之利。"
 oe_msn_byz_10_silk_phoenix_link_req_tt:0 "直辖或由非主权附庸掌控卡法或干地亚，处于地理大发现或更晚时代，且拥有至少 12 处港口或海军传统不低于 20。"
 oe_msn_byz_11_imperial_academy:0 "紫室格致院与帝国典籍馆"
 oe_msn_byz_11_imperial_academy_desc:0 "自狄奥多西设立帝国大学以来，典籍与学术始终是罗马文明最引以为傲的明珠。将活字印刷等近代[institutions|e]与高等格致[buildings|e]融汇于君士坦丁堡，不仅能显著提升臣民[literacy|e]与帝国[advances|e]研习速率，更令紫室学府成为照耀近世欧亚的启蒙灯塔。"
 oe_msn_byz_11_imperial_academy_req_tt:0 "拥有君士坦丁堡，稳定度不低于 20，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有印刷坊/大学。"
 oe_msn_byz_12_eternal_roman_destiny:0 "永恒罗马：五百年近代立宪天命"
