 oe_msn_jap_07_kyushu_hakata_nagasaki_desc:0 "平定九州诸豪，牢握对华对朝商港博多与对洋门户长崎（西彼杵 nishisonogi）。"
 oe_msn_jap_07_kyushu_hakata_nagasaki_req_tt:0 "拥有博多与长崎（nishisonogi）。"
 oe_msn_jap_08_rising_sun_unity:0 "扶桑一统：旭日列岛完全统一"
 oe_msn_jap_08_rising_sun_unity_desc:0 "彻底终结下克上战国百年烽火，实现从九州至东国的完全一统。"
 oe_msn_jap_08_rising_sun_unity_req_tt:0 "拥有京都、大阪、江户（toshima）与博多。"
 oe_msn_jap_09_iwami_ginzan_silver:0 "石见银山（nima）：灰吹法白银巨矿"
 oe_msn_jap_09_iwami_ginzan_silver_desc:0 "在石见迩摩（nima）大规模推广灰吹法炼银，成为震惊全球的白银供给中心！"
 oe_msn_jap_09_iwami_ginzan_silver_req_tt:0 "拥有石见（nima）且国库不少于 300 金币。"
 oe_msn_jap_10_red_seal_ships:0 "朱印船远航：贯通南洋与马尼拉"
 oe_msn_jap_10_red_seal_ships_desc:0 "向商船颁授幕府朱印状，远航马尼拉、暹罗与马六甲换取丝绸香料。"
 oe_msn_jap_10_red_seal_ships_req_tt:0 "拥有长崎（nishisonogi）或博多，进入地理大发现或更晚时代。"
 oe_msn_jap_11_rangaku_open_seas:0 "兰学格致与开海近代造船"
 oe_msn_jap_11_rangaku_open_seas_desc:0 "借长崎窗口吸纳欧洲天文医学与洋式帆船火炮，开启东瀛早熟维新。"
 oe_msn_jap_11_rangaku_open_seas_req_tt:0 "拥有长崎（nishisonogi），稳定度不低于 15 且进入宗教改革或更晚时代。"
 oe_msn_jap_12_pacific_maritime_hegemon:0 "近代东瀛海洋霸权终极天命"
 oe_msn_jap_12_pacific_maritime_hegemon_desc:0 "集天下布武之威、石见银山之富与开海兰学之智，铸就近世太平洋海洋帝国。"
 oe_msn_jap_12_pacific_maritime_hegemon_req_tt:0 "完成三条支线，拥有京都、江户（toshima）与石见（nima），进入专制或更晚时代。"
 oe_msn.1.title:0 "天命加冕：欧亚大帝国的辉煌里程碑"
 oe_msn.1.desc:0 "历经数百年制度革新、疆土经略与商贸文治的层层铸炼，一项史诗级欧亚大国天命任务链终于圆满告成。史官提笔镌刻盛世华章，列国使节齐来致贺。"
 oe_msn.1.a:0 "镌刻不朽史诗，垂范千秋"
 oe_msn.2.title:0 "多极天命共鸣：欧亚群雄盛世"
 oe_msn.2.desc:0 "自地中海、东欧草原直至伊朗高原、印度次大陆与东亚海洋，多座欧亚大帝国先后达成自身历史天命，商旅、典籍与工艺在多极平衡中交相辉映。"
 oe_msn.2.a:0 "共迎欧亚群星璀璨之世"
