 oe_msn_eng_03_royal_navy_charter_req_tt:0 "拥有伦敦，处于地理大发现或更晚时代，拥有至少 12 处港口，且海军传统不低于 22 或建有干船坞/船坞。"
 oe_msn_eng_04_bill_of_rights:0 "《权利法案》与英格兰银行信用"
