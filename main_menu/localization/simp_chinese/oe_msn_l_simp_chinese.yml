 oe_msn_rus_destiny_CRITERIA_DESCRIPTION:0 "统一罗斯诸公国、挣脱草原枷锁、开辟波罗的海与西伯利亚并建成近代俄国"
 oe_msn_rus_destiny_BUTTON_TOOLTIP:0 "开启俄罗斯天命"
 oe_msn_rus_destiny_BUTTON_DETAILS:0 "串联莫斯科聚土、喀山与阿斯特拉罕东征、第三罗马大牧首、乌拉尔至伊尔库茨克西伯利亚毛皮商道、涅瓦河波罗的海之窗与近世射击军/新式团革新。"
 STATIC_MODIFIER_NAME_oe_msn_rus_m1:0 "射击军与新式团军事革新"
 STATIC_MODIFIER_DESC_oe_msn_rus_m1:0 "以近代常备火枪兵团与莫斯科皇家炮厂奠定欧陆陆军强权根基。"
 STATIC_MODIFIER_NAME_oe_msn_rus_m2:0 "伏尔加—西伯利亚与涅瓦霸权"
 STATIC_MODIFIER_DESC_oe_msn_rus_m2:0 "自波罗的海之窗直抵贝加尔湖的横跨欧亚疆域尽入沙皇版图。"
 STATIC_MODIFIER_NAME_oe_msn_rus_m3:0 "恰克图毛皮商道与乌拉尔冶金"
 STATIC_MODIFIER_DESC_oe_msn_rus_m3:0 "西伯利亚黑貂毛皮、恰克图茶市与乌拉尔铁矿源源充实帝国国库。"
 STATIC_MODIFIER_NAME_oe_msn_rus_m4:0 "近代全罗斯大帝国天命"
 STATIC_MODIFIER_DESC_oe_msn_rus_m4:0 "继承东正大牧首荣光并完成近世欧化革新，俄罗斯傲视东西两洋。"
 oe_msn_rus_01_gather_rus:0 "罗斯聚土：莫斯科与诺夫哥罗德"
 oe_msn_rus_01_gather_rus_desc:0 "将莫斯科大公国与坐拥广袤北方毛皮林海的诺夫哥罗德融为一体，标志着分裂数世的罗斯诸邦终于迎来真正核心。把诺夫哥罗德确立为帝国[core|e]、兴建城防与商业[buildings|e]并拉升[capital|e]的[development|e]，既可夯实全罗斯[stability|e]，更为挣脱草原枷锁积蓄雷霆之力。"
 oe_msn_rus_01_gather_rus_req_tt:0 "拥有莫斯科与诺夫哥罗德，稳定度不低于 5，且首都发展度不低于 16 或建有市场/城堡。"
 oe_msn_rus_02_third_rome_patriarch:0 "莫斯科大牧首与沙皇法统"
 oe_msn_rus_02_third_rome_patriarch_desc:0 "当克里姆林宫的金色洋葱头穹顶矗立于莫斯科河畔，全罗斯大牧首区的确立令沙皇成为北方正教世界的至高护法。广兴宏伟宗教[buildings|e]并深结教士[estate_satisfaction|e]，不仅将沙皇的[legitimacy|e]与[religious_influence|e]推向高峰，更赋予新兴俄罗斯无可动摇的精神旗帜。"
 oe_msn_rus_02_third_rome_patriarch_req_tt:0 "拥有莫斯科，稳定度不低于 12，且建有大教堂/修道院或教士阶层满意度不低于 55%。"
 oe_msn_rus_03_artillery_yard:0 "莫斯科皇家铸炮院与火枪卫队"
 oe_msn_rus_03_artillery_yard_desc:0 "在莫斯科皇家铸炮院内，巧匠们日夜浇铸攻城重炮与轻便野战铜炮，世袭射击军则操练火绳枪与月斧战阵。扩建兵工[buildings|e]并加速吸收火器[advances|e]，将使沙俄的[army_tradition|e]与[army|e]火力跃升至欧陆前列，无论草原铁骑抑或西方堡垒皆难挡其锋芒。"
 oe_msn_rus_03_artillery_yard_req_tt:0 "拥有莫斯科，国库不少于 250 金币，处于地理大发现或更晚时代，且建有铸炮坊/军械库或陆军传统不低于 22。"
 oe_msn_rus_04_new_order_guard:0 "近卫新式团与表官制改革"
 oe_msn_rus_04_new_order_guard_desc:0 "将辽阔罗斯推向近代化，必然引爆沙皇专制集权与波雅尔大贵族、全俄缙绅会议之间的深层碰撞。依托新式军营[buildings|e]编练近代常备[regulars|e]、提振[army_tradition|e]与[crown_power|e]之际，莫斯科朝廷必须亲手抉择究竟走向特辖专制、缙绅共治，抑或功绩晋升的表官新制。"
 oe_msn_rus_04_new_order_guard_req_tt:0 "拥有莫斯科，处于宗教改革或更晚时代，拥有至少 45 处地点，且陆军传统不低于 28 或建有兵营/棱堡。"
 oe_msn_rus_05_volga_kazan:0 "挣脱鞑靼枷锁：攻克喀山"
 oe_msn_rus_05_volga_kazan_desc:0 "攻拔雄踞伏尔加河中游的喀山要塞，彻底终结了数百年草原铁骑袭扰罗斯腹地的噩梦，更为东方拓土劈开坦途。将喀山化为稳固[core|e]、把朝廷[control|e]延伸至伏尔加航道，不仅令沙皇[prestige|e]大振，也为南下里海与东越乌拉尔山奠定了前进基地。"
 oe_msn_rus_05_volga_kazan_req_tt:0 "拥有喀山。"
 oe_msn_rus_06_astrakhan_caspian:0 "直抵里海：克复阿斯特拉罕"
 oe_msn_rus_06_astrakhan_caspian_desc:0 "克复伏尔加河入海口阿斯特拉罕后，整条母亲河自森林腹地至里海波涛尽归莫斯科一统。在三角洲确立稳固[core|e]与商埠，令波斯丝绸与中亚商队[trade|e]畅通无阻地北上罗斯，为国库带来滚滚[gold|e]税利与沿岸城镇的持久[prosperity|e]。"
 oe_msn_rus_06_astrakhan_caspian_req_tt:0 "拥有阿斯特拉罕，且拥有至少 40 处地点或月商税收入不低于 25。"
 oe_msn_rus_07_siberia_eastward:0 "跨越乌拉尔：托博尔斯克与伊尔库茨克"
 oe_msn_rus_07_siberia_eastward_desc:0 "哥萨克拓荒者沿河流陆路翻越乌拉尔山脉，在托博尔斯克与贝加尔湖畔筑起座座木寨城堡，将双头鹰旗一路插向北亚深处。将这些前哨化为稳固[core|e]并厚赏边疆[estates|e]，既可独占价值连城的西伯利亚毛皮[trade|e]，更令沙俄[control|e]横贯广袤欧亚北疆。"
 oe_msn_rus_07_siberia_eastward_req_tt:0 "拥有托博尔斯克或伊尔库茨克，且拥有至少 50 处地点或至少 2 个附庸。"
 oe_msn_rus_08_window_on_neva:0 "面向欧洲的窗口：涅瓦河出海口"
 oe_msn_rus_08_window_on_neva_desc:0 "在涅瓦河汇入芬兰湾的沼泽岛屿间拔地而起的不冻军港，为俄罗斯劈开了直面西欧文明的海上窗口。将其筑为稳固[core|e]并创立波罗的海[navy|e]，不仅能迅速积淀[navy_tradition|e]、激活对欧海运[trade|e]，更向西方列强宣告北欧新海权巨人的诞生。"
 oe_msn_rus_08_window_on_neva_req_tt:0 "拥有涅瓦（圣彼得堡），且拥有至少 6 处港口或海军传统不低于 15。"
 oe_msn_rus_09_white_stone_tax:0 "莫斯科税吏与北方商道"
 oe_msn_rus_09_white_stone_tax_desc:0 "欲使疆域辽阔的林海大国财政无虞，必先整肃地方税吏并畅通白海与伏尔加商道。兴修账房与市场[buildings|e]、以严明审计提升朝廷[control|e]并扶持商市民众，将令克里姆林宫国库[gold|e]日丰，同时催生全罗斯城镇的稳健[prosperity|e]。"
 oe_msn_rus_09_white_stone_tax_req_tt:0 "拥有莫斯科，国库不少于 300 金币，月商税收入不低于 22，且建有账房或市场。"
 oe_msn_rus_10_kyakhta_fur_tea:0 "恰克图毛皮茶马大商路"
 oe_msn_rus_10_kyakhta_fur_tea_desc:0 "满载西伯利亚黑貂与银狐毛皮的商队万里东行，在北亚边关换取东方帝国的上等茶叶与丝绸。完善陆上商贸[buildings|e]并贯通横跨欧亚的北线[market|e]，既可为莫斯科国库带来源源不绝的关税[gold|e]，更令俄罗斯的欧亚陆权[trade|e]网络空前繁盛。"
 oe_msn_rus_10_kyakhta_fur_tea_req_tt:0 "拥有喀山或托博尔斯克，处于地理大发现或更晚时代，且月商税收入不低于 32 或建有商帮街区/贸易枢纽。"
 oe_msn_rus_11_moscow_university:0 "帝国科学院与乌拉尔铁厂"
 oe_msn_rus_11_moscow_university_desc:0 "莫斯科高等科学院的格致思潮与乌拉尔山轰鸣的冶金铁厂交相呼应，推动俄罗斯迈入近世工矿强国行列。广纳近代科学[institutions|e]并兴建学府与冶炼[buildings|e]，不仅大幅提升国内[literacy|e]与科技[advances|e]速率，更为帝国铸就自主钢铁与测绘人才根基。"
 oe_msn_rus_11_moscow_university_req_tt:0 "拥有莫斯科，稳定度不低于 15，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有大学/炼铁工场。"
 oe_msn_rus_12_all_russian_empire:0 "欧亚北极熊：近代全罗斯大帝国"
 oe_msn_rus_12_all_russian_empire_desc:0 "北抵涅瓦波罗的海、南临里海伏尔加、东越西伯利亚苍茫林海，全罗斯终于蜕变为震撼世界的欧亚巨人。凭借头等[great_power|e]之尊、[capital|e]雄厚[development|e]以及磐石般的[stability|e]与[prestige|e]，皇帝将在加冕大典上宣告俄罗斯近代大帝国的永恒道路。"
 oe_msn_rus_12_all_russian_empire_req_tt:0 "完成三条支线，拥有莫斯科、阿斯特拉罕与涅瓦，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 28。"
 oe_msn_plc_destiny:0 "#bold #color_yellow 三海共和国：波兰—立陶宛天命#!#!"
 oe_msn_plc_destiny_DESCRIPTION:0 "自克雷沃与格伦瓦德至《五月三日宪法》"
 oe_msn_plc_destiny_CRITERIA_DESCRIPTION:0 "缔结波立联合、掌控但泽与黑海走廊、编练翼骑兵与登记哥萨克并颁布近代宪法"
 oe_msn_plc_destiny_BUTTON_TOOLTIP:0 "开启波立三海天命"
 oe_msn_plc_destiny_BUTTON_DETAILS:0 "衔接 Slot 77 波立主角长线：从克雷沃、格伦瓦德与但泽出海口启程，经卢布林联合、华沙宗教宽容、执行派改革、翼骑兵与登记哥萨克，最终以 1791《五月三日宪法》粉碎瓜分宿命！"
 STATIC_MODIFIER_NAME_oe_msn_plc_m1:0 "执行派改革与华沙宽容宪政"
 STATIC_MODIFIER_DESC_oe_msn_plc_m1:0 "追缴王室庄园并确立多教派和平共存，赋予联邦充沛财源与内部凝聚。"
 STATIC_MODIFIER_NAME_oe_msn_plc_m2:0 "翼骑兵与登记哥萨克三海壁垒"
 STATIC_MODIFIER_DESC_oe_msn_plc_m2:0 "重装翼骑兵冲锋团与第聂伯登记哥萨克合力捍卫波罗的海至黑海广袤疆域。"
 STATIC_MODIFIER_NAME_oe_msn_plc_m3:0 "维斯瓦—但泽欧洲谷仓"
 STATIC_MODIFIER_DESC_oe_msn_plc_m3:0 "但泽谷物交易所与国民教育委员会令共和国兼得商贸巨富与启蒙文治。"
 STATIC_MODIFIER_NAME_oe_msn_plc_m4:0 "1791《五月三日宪法》三海霸主"
 STATIC_MODIFIER_DESC_oe_msn_plc_m4:0 "永久废除自由否决权并缔造立宪三海强权，彻底改写东欧近代史。"
 oe_msn_plc_01_krewo_crown:0 "雅盖沃誓约：稳固克拉科夫与维尔纽斯"
 oe_msn_plc_01_krewo_crown_desc:0 "克雷沃盟约将瓦维尔王丘与维尔纽斯林间古堡连成一体，在喀尔巴阡与波罗的海间树起巍峨屏障。稳固王朝[legitimacy|e]并维系[estate_satisfaction|e]，便能号召诸侯[army|e]齐聚[capital|e]旌旗之下。"
 oe_msn_plc_01_krewo_crown_req_tt:0 "拥有克拉科夫或维尔纽斯，稳定度至少为5、贵族满意度至少45%，并建成一座城堡。"
 oe_msn_plc_02_warsaw_confederation:0 "卢布林联合与华沙宗教宽容"
 oe_msn_plc_02_warsaw_confederation_desc:0 "在卢布林与华沙，波兰与立陶宛贵族庄严立誓，确保天主、正教与新教诸邦共享和平而不燃内战烽火。将宽容誓约载入[parliament|e]律典，既厚植联邦[stability|e]，又使[subjects|e]归心并广结善邻[diplomacy|e]。"
 oe_msn_plc_02_warsaw_confederation_req_tt:0 "控制华沙或克拉科夫，稳定度至少为10、教士满意度至少45%，且拥有至少1个属国或25处地点。"
 oe_msn_plc_03_executionist_cossacks:0 "执行派追缴与登记哥萨克名册"
 oe_msn_plc_03_executionist_cossacks_desc:0 "执行派追缴被侵占的王室领地以充实常备四分之一税军，同时将扎波罗热哥萨克纳入在册薪饷以戍卫第聂伯草原。重振[crown_power|e]不仅充盈[gold|e]国库，更持续拔升[army_tradition|e]与边疆[manpower|e]。"
 oe_msn_plc_03_executionist_cossacks_req_tt:0 "处于大发现时代或之后，拥有克拉科夫、华沙或维尔纽斯，国库至少200金币、陆军传统至少22，并建成练兵场或军械库。"
 oe_msn_plc_04_great_sejm_reforms:0 "废除自由否决权与大瑟姆宪改"
 oe_msn_plc_04_great_sejm_reforms_desc:0 "一旦大瑟姆以多数表决取代「自由否决权」，外敌便再也无法靠收买一名议员瘫痪整座共和国的法政中枢。重塑[parliament|e]与[cabinet|e]效能可稳步夺回[crown_power|e]，令革新[institutions|e]真正服务于存亡大计。"
 oe_msn_plc_04_great_sejm_reforms_req_tt:0 "处于宗教改革时代或之后，拥有华沙、克拉科夫或维尔纽斯，稳定度至少为15、市民满意度至少50%，并接纳教派确立思潮。"
 oe_msn_plc_05_grunwald_malbork:0 "格伦瓦德余威：夺取马尔堡与但泽"
 oe_msn_plc_05_grunwald_malbork_desc:0 "延续格伦瓦德大捷之威，红砖巍峨的马尔堡与商船云集的但泽终于为维斯瓦河口劈开通往波罗的海的大门。确立北方[core|e]既彰显王朝[prestige|e]，又彻底打通出海[trade|e]通道并稳固海岸[fort|e]。"
 oe_msn_plc_05_grunwald_malbork_req_tt:0 "直接或通过属国控制马尔堡与但泽，且陆军传统至少为15。"
 oe_msn_plc_06_ruthenian_heartland:0 "鲁塞尼亚纵深：基辅与利沃夫"
 oe_msn_plc_06_ruthenian_heartland_desc:0 "从利沃夫拱廊商市到俯瞰第聂伯河的基辅金顶，富饶黑土铺就的鲁塞尼亚正是联邦纵深所系。深耕东方[core|e]领土不仅大幅壮大农耕[prosperity|e]与疆域[control|e]，更为联军输送源源不绝的[manpower|e]。"
 oe_msn_plc_06_ruthenian_heartland_req_tt:0 "直接或通过属国控制基辅与利沃夫，并在国内拥有至少一座粮仓。"
 oe_msn_plc_07_winged_hussaria:0 "基尔霍尔姆雷霆：翼骑兵冲锋团"
 oe_msn_plc_07_winged_hussaria_desc:0 "披豹皮、竖羽翼、平端六米空心长矛的波兰翼骑兵，在基尔霍尔姆与克鲁希诺以少胜多震慑诸强。整训精锐[regulars|e]骑团既将[army_tradition|e]推向顶峰，又令联邦[army|e]突击威名与[prestige|e]传遍欧陆。"
 oe_msn_plc_07_winged_hussaria_req_tt:0 "处于宗教改革时代或之后，拥有克拉科夫、华沙或维尔纽斯，控制至少30处地点、陆军传统至少35，并建成一座兵营。"
 oe_msn_plc_08_intermarium_corridor:0 "三海走廊：里加至阿克曼"
 oe_msn_plc_08_intermarium_corridor_desc:0 "北起道加瓦河口的里加港、南抵德涅斯特河口石堡阿克曼，三海走廊将波罗的海木材与黑海商路一线贯通。坐镇南北[core|e]枢纽不仅放大跨洲[trade|e]，更为联邦培育[navy_tradition|e]与崭新的[maritime_presence|e]。"
 oe_msn_plc_08_intermarium_corridor_req_tt:0 "直接或通过属国控制里加或阿克曼，且至少拥有3座港口。"
 oe_msn_plc_09_vistula_granary:0 "维斯瓦谷仓与但泽交易所"
 oe_msn_plc_09_vistula_granary_desc:0 "每逢春汛，平底粮驳载满黑麦、小麦、草木灰与橡木顺维斯瓦河直抵但泽红砖粮仓，供应荷兰与英格兰商船。疏通河海[market|e]令[trade|e]关税倍增，既丰厚[gold|e]府库，亦带旺河口港市的[prosperity|e]。"
 oe_msn_plc_09_vistula_granary_req_tt:0 "控制但泽，国库至少300金币、月度贸易与税收至少25，并建成一座市场。"
 oe_msn_plc_10_polish_renaissance:0 "克拉科夫与维尔纽斯文艺复兴"
 oe_msn_plc_10_polish_renaissance_desc:0 "从孕育天文学巨擘哥白尼的克拉科夫雅盖隆学府，到维尔纽斯书院与瓦维尔宫意式拱廊，人文新风照亮了东欧广袤山河。兴建学术[buildings|e]加速前沿[institutions|e]与国民[literacy|e]普及，令联邦[cultural_tradition|e]享誉全欧。"
 oe_msn_plc_10_polish_renaissance_req_tt:0 "处于文艺复兴时代或之后，拥有克拉科夫或维尔纽斯，建成一座大学并接纳文艺复兴思潮。"
 oe_msn_plc_11_national_education:0 "国民教育委员会与华沙启蒙学院"
 oe_msn_plc_11_national_education_desc:0 "创设欧洲首个世俗公共教育中枢，国民教育委员会统一母语学堂、军官学院与近代出版体系。由国家推行的[literacy|e]启蒙显著加快[advances|e]演进，同步推高[capital|e]的[development|e]并涵养一代新民。"
 oe_msn_plc_11_national_education_req_tt:0 "处于宗教改革时代或之后，拥有华沙、克拉科夫或维尔纽斯，稳定度至少为18、首都发展度至少为26，并建成活字印刷工坊。"
 oe_msn_plc_12_may_third_constitution:0 "1791《五月三日宪法》三海立宪联邦"
 oe_msn_plc_12_may_third_constitution_desc:0 "在华沙王宫欢呼声中颁行的《五月三日宪法》，将王室、市民与各阶层融铸为横跨三海的不倒立宪联邦。跻身[great_power|e]之巅，共和国把[parliament|e]自由与[crown_power|e]、[stability|e]完美统一。"
 oe_msn_plc_12_may_third_constitution_req_tt:0 "处于专制时代或之后，控制但泽与基辅，稳定度至少为18，建成证券交易所或星形堡垒，且位列列强或月收至少75。"
 oe_msn_glh_destiny:0 "#bold #color_yellow 术赤雄鹰：金帐汗国火药天命#!#!"
 oe_msn_glh_destiny_DESCRIPTION:0 "自新萨莱四柱石家族至伏尔加运河与草原火药帝国"
 oe_msn_glh_destiny_CRITERIA_DESCRIPTION:0 "凝聚术赤五翼、推行新札撒定居宪章、兴修伏尔加—顿河运河并列装大车炮阵"
 oe_msn_glh_destiny_BUTTON_TOOLTIP:0 "开启金帐汗国天命"
 oe_msn_glh_destiny_BUTTON_DETAILS:0 "衔接 Slot 75 金帐/帖木儿主角长线：驾驭希林/巴林/阿尔浑/钦察四大 Qarachi 家族、重立罗斯朝贡、重建新萨莱并从游牧平滑转制为草原火药大汗帝国！"
 STATIC_MODIFIER_NAME_oe_msn_glh_m1:0 "新札撒定居与大车火炮军制"
 STATIC_MODIFIER_DESC_oe_msn_glh_m1:0 "保留钦察骑射机动优势同时融合大车堡垒火枪与草原轻炮，纵横欧亚。"
 STATIC_MODIFIER_NAME_oe_msn_glh_m2:0 "钦察草原与两海战略铁幕"
 STATIC_MODIFIER_DESC_oe_msn_glh_m2:0 "从克里米亚塔纳直抵喀山与花剌子模的草原商道尽归术赤汗廷掌控。"
 STATIC_MODIFIER_NAME_oe_msn_glh_m3:0 "伏尔加—顿河运河与北线丝路"
 STATIC_MODIFIER_DESC_oe_msn_glh_m3:0 "黑海与里海航道贯通，毛皮、丝绸与萨莱铸炮工场带来源源税入。"
 STATIC_MODIFIER_NAME_oe_msn_glh_m4:0 "欧亚草原火药大汗终极天命"
 STATIC_MODIFIER_DESC_oe_msn_glh_m4:0 "跨越游牧衰落宿命，术赤后裔以近代火炮、立宪札撒与双海运河称雄欧亚腹地。"
 oe_msn_glh_01_sarai_qarachi:0 "整顿四大柱石家族：稳固新萨莱"
 oe_msn_glh_01_sarai_qarachi_desc:0 "在新萨莱金帐大幄下调和希林、巴林、阿尔浑与钦察四大柱石家族，是遏止术赤汗国陷入分裂的首要之务。强化草原[horde_unity|e]、凝聚诸翼[subjects|e]并修缮汗廷[buildings|e]，方能迅速稳住[stability|e]，向钦察草原宣告大汗威权依旧如日中天。"
 oe_msn_glh_01_sarai_qarachi_req_tt:0 "拥有新萨莱、阿斯特拉罕或克里米亚古都，稳定度不低于 5，且统辖金帐兀鲁思附庸、至少 2 个附庸或建有忽里勒台/商队旅舍。"
 oe_msn_glh_02_yarliq_tribute:0 "重颁《扎尔里克》与达鲁花赤税吏"
 oe_msn_glh_02_yarliq_tribute_desc:0 "钤盖大汗朱印的《扎尔里克》敕书与达鲁花赤税吏体系，曾令罗斯诸公与丝路商邦岁岁按期纳贡。严密整饬对诸翼[subjects|e]的朝贡[control|e]，既可令萨莱国库[gold|e]充盈、彰显汗统[legitimacy|e]，更以凛冽刀锋震慑胆敢抗命的北方林海诸侯。"
 oe_msn_glh_02_yarliq_tribute_req_tt:0 "拥有新萨莱/阿斯特拉罕/克里米亚古都，稳定度不低于 10，至少 25 处地点，且拥有兀鲁思附庸、至少 2 个附庸或月商税收入不低于 20。"
 oe_msn_glh_03_steppe_tabur_guns:0 "草原大车堡垒与骆驼抬枪"
 oe_msn_glh_03_steppe_tabur_guns_desc:0 "面对席卷欧亚的火药革命，单凭复合弓已不足以守住大草原的霸权。将可移动的大车堡垒、骆驼抬枪与火器[advances|e]融入钦察精骑体系，将令金帐的[army_tradition|e]与[army|e]战力发生质变，兼备草原机动与近代火力的双刃铁军由此横空出世。"
 oe_msn_glh_03_steppe_tabur_guns_req_tt:0 "拥有新萨莱/阿斯特拉罕/克里米亚古都，国库不少于 220 金币，处于地理大发现或更晚时代，且已研习火药革新、建有铸炮坊/手铳行会或陆军传统不低于 22。"
 oe_msn_glh_04_new_yassa_settlement:0 "颁布《新札撒定居大宪章》"
 oe_msn_glh_04_new_yassa_settlement_desc:0 "《新札撒定居大宪章》的颁布，弥合了游牧万户与伏尔加砖石大城之间绵延数世的制度鸿沟。依托稳健的[capital|e][development|e]、朝廷[stability|e]与财政[control|e]，忽里勒台大会将在此定夺汗国究竟迈向中央集权火药君主制、诸翼联盟抑或草原商贸帝国。"
 oe_msn_glh_04_new_yassa_settlement_req_tt:0 "拥有新萨莱/阿斯特拉罕/克里米亚古都，稳定度不低于 15，处于宗教改革或更晚时代，且首都发展度不低于 22。"
 oe_msn_glh_05_crimea_tana_coast:0 "黑海北岸：塔纳与克里米亚古都"
 oe_msn_glh_05_crimea_tana_coast_desc:0 "牢牢扼守亚速海口的塔纳商埠与克里米亚险峻古都，便将黑海北岸的黄金海门尽收汗廷税印之下。将其确立为稳固[core|e]并兴建海港市场[buildings|e]，即可令热那亚、威尼斯与小亚商船的[trade|e]滚滚流入草原，换取丰厚关税[gold|e]与南望地中海的战略支点。"
 oe_msn_glh_05_crimea_tana_coast_req_tt:0 "拥有塔纳与克里米亚古都，且拥有至少 4 处港口或建有码头/市场。"
 oe_msn_glh_06_kazan_upper_volga:0 "伏尔加北翼：稳控喀山与保加尔"
 oe_msn_glh_06_kazan_upper_volga_desc:0 "承袭古老保加尔商都遗绪的喀山重镇，俯瞰着罗斯诸公伺机东进的伏尔加河谷。以坚实[fort|e]城垣与精锐[army_tradition|e]将喀山筑为不可动摇的北疆[core|e]，既可牢牢锁住伏尔加上游毛皮[trade|e]要冲，又能永绝北方诸侯东越河谷威逼草原腹心之患。"
 oe_msn_glh_06_kazan_upper_volga_req_tt:0 "拥有喀山，且陆军传统不低于 18 或建有城堡。"
 oe_msn_glh_07_caspian_astrakhan:0 "里海金门：新萨莱与阿斯特拉罕"
 oe_msn_glh_07_caspian_astrakhan_desc:0 "重振新萨莱与阿斯特拉罕，令饱经内乱与南疆铁骑冲击的伏尔加三角洲重现双璧辉煌。为这两座汗国[core|e]大城兴建商旅[buildings|e]，不仅催生蓬勃的[development|e]与[prosperity|e]，更将波斯丝锦、花剌子模织毯与罗斯毛皮尽数汇聚于同一座璀璨的草原[market|e]。"
 oe_msn_glh_07_caspian_astrakhan_req_tt:0 "拥有新萨莱与阿斯特拉罕，且建有商队旅舍或市场。"
 oe_msn_glh_08_rus_or_transoxiana:0 "威加北国或河中：莫斯科与撒马尔罕"
 oe_msn_glh_08_rus_or_transoxiana_desc:0 "无论是西慑莫斯科令林海诸公俯首，抑或东连河中撒马尔罕打通内亚大动脉，金帐汗国均已重铸欧亚草原无双霸权。以五十五城广土晋身世界[great_power|e]，既令大汗[prestige|e]与[horde_unity|e]登峰造极，更使四方藩邦[subjects|e]咸服于萨莱白纛之下。"
 oe_msn_glh_08_rus_or_transoxiana_req_tt:0 "直辖或由非主权附庸掌控莫斯科或撒马尔罕（或拥有新萨莱），拥有至少 55 处地点且位列世界列强。"
 oe_msn_glh_09_fur_silk_customs:0 "黑海—里海毛皮与丝绸税单"
 oe_msn_glh_09_fur_silk_customs_desc:0 "在塔纳与阿斯特拉罕设立规范关市税卡，以稳健长久的白银岁入取代杀鸡取卵式的劫掠。兴建账房与市场[buildings|e]并安抚商团以提升[estate_satisfaction|e]，令欧亚北线过境[trade|e]源源化作汗廷[gold|e]，为常备火炮、坚城要塞与伏尔加繁华市镇提供不竭财源。"
 oe_msn_glh_09_fur_silk_customs_req_tt:0 "拥有阿斯特拉罕或塔纳，国库不少于 300 金币，月商税收入不低于 24，且建有账房或市场。"
 oe_msn_glh_10_volga_don_canal:0 "佩列沃洛克宏图：伏尔加—顿河运河"
 oe_msn_glh_10_volga_don_canal_desc:0 "在伏尔加河与顿河相距最近的佩列沃洛克地峡开凿通航运河，是一代代苏丹与沙皇梦寐以求的地缘伟业。依托船坞与商站[buildings|e]贯通里海与黑海航路，将令金帐汗国的[trade|e]辐射力、[maritime_presence|e]与[development|e]瞬间跃升，以无匹[prestige|e]重塑内亚水陆格局。"
 oe_msn_glh_10_volga_don_canal_req_tt:0 "拥有阿斯特拉罕与塔纳，处于地理大发现或更晚时代，且月商税收入不低于 35 或建有干船坞/贸易枢纽。"
 oe_msn_glh_11_sarai_polyglot_academy:0 "欧亚大汗多语译馆与铸炮学院"
 oe_msn_glh_11_sarai_polyglot_academy_desc:0 "在萨莱设立融汇突厥、波斯、阿拉伯与斯拉夫学术的多语译馆与皇家铸炮学院，将草原汗廷锻造成近世科技与人文的熔炉。广纳近代[institutions|e]并兴建高等学府[buildings|e]，既可大幅提升[literacy|e]与[cultural_tradition|e]，更能加速火炮冶金与地理测绘等关键[advances|e]的突破。"
 oe_msn_glh_11_sarai_polyglot_academy_req_tt:0 "拥有新萨莱或阿斯特拉罕，稳定度不低于 15，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有大学/经学院。"
 oe_msn_glh_12_gunpowder_khaganate:0 "欧亚大汗火药帝国终极天命"
 oe_msn_glh_12_gunpowder_khaganate_desc:0 "术赤兀鲁思并未在历史长河中分崩离析，反而凭定居宪制、双海运河与重炮骑军蜕变为横亘欧亚腹心的近代火药大汗帝国。凭借超级[great_power|e]威望、雄厚[capital|e][development|e]与磐石[stability|e]、[prestige|e]，新萨莱将召开盛世大会，亲手谱写草原帝国迈向近代的永恒篇章。"
 oe_msn_glh_12_gunpowder_khaganate_req_tt:0 "完成三条支线，拥有新萨莱与阿斯特拉罕，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 28。"
 oe_msn_hun_destiny:0 "#bold #color_yellow 圣斯蒂芬王冠与黑军：匈牙利天命#!#!"
 oe_msn_hun_destiny_DESCRIPTION:0 "自布达与多瑙铁壁至马加什黑军与中欧霸主"
 oe_msn_hun_destiny_CRITERIA_DESCRIPTION:0 "巩固圣斯蒂芬王冠、建马加什常备黑军、守卫贝尔格莱德并主宰喀尔巴阡—亚得里亚海"
 oe_msn_hun_destiny_BUTTON_TOOLTIP:0 "开启匈牙利天命"
 oe_msn_hun_destiny_BUTTON_DETAILS:0 "捍卫多瑙河防线与喀尔巴阡盆地：以 1458 马加什一世常备「黑军」与布达文艺复兴藏书楼（科尔文图书馆）为核心，抵御东西强敌并打造中欧—巴尔干强权。"
 STATIC_MODIFIER_NAME_oe_msn_hun_m1:0 "马加什常备黑军兵制"
 STATIC_MODIFIER_DESC_oe_msn_hun_m1:0 "以直辖重税供养欧洲最早的职业常备火器与重骑兵团，战力傲视中欧。"
 STATIC_MODIFIER_NAME_oe_msn_hun_m2:0 "多瑙河与亚得里亚海铁壁"
 STATIC_MODIFIER_DESC_oe_msn_hun_m2:0 "贝尔格莱德要塞与达尔马提亚出海口令匈牙利牢掌中欧南大门。"
 STATIC_MODIFIER_NAME_oe_msn_hun_m3:0 "科尔文文艺复兴藏书楼与银矿"
 STATIC_MODIFIER_DESC_oe_msn_hun_m3:0 "上匈牙利金银矿脉与布达人文藏书楼使王国富足而昌明。"
 STATIC_MODIFIER_NAME_oe_msn_hun_m4:0 "圣斯蒂芬中欧—巴尔干霸权"
 STATIC_MODIFIER_DESC_oe_msn_hun_m4:0 "粉碎莫哈奇悲剧，以黑军常备化与多民族宪政成就中欧不朽王权。"
 oe_msn_hun_01_buda_pest_crown:0 "圣斯蒂芬王冠：稳固布达与佩斯"
 oe_msn_hun_01_buda_pest_crown_desc:0 "自加冕重镇普雷斯堡至多瑙河两岸的布达与佩斯，圣斯蒂芬圣冠将喀尔巴阡盆地凝聚于王法之下。加固多瑙河[capital|e]防务不仅稳固王室[legitimacy|e]，更安抚各[estates|e]并夯实全域[control|e]。"
 oe_msn_hun_01_buda_pest_crown_req_tt:0 "拥有布达与佩斯，直接或通过属国控制布拉迪斯拉发，稳定度至少为5，并建成一座城堡。"
 oe_msn_hun_02_castle_warriors:0 "多瑙边堡与胡萨尔轻骑"
 oe_msn_hun_02_castle_warriors_desc:0 "在多瑙河南疆防线上，边堡戍卫与疾如旋风的胡萨尔轻骑日夜扼守各处渡口，迎击来自巴尔干隘口的突袭。重赏戍边将士既淬炼[army_tradition|e]与[estate_satisfaction|e]，更令边疆[fort|e]与[manpower|e]久经考验。"
 oe_msn_hun_02_castle_warriors_req_tt:0 "拥有布达，稳定度至少为10、陆军传统至少15，且贵族阶层满意度至少为45%。"
 oe_msn_hun_03_black_army_standing:0 "1458 马加什一世常备黑军"
 oe_msn_hun_03_black_army_standing_desc:0 "由王室特别税直接发饷的马加什常备黑军，将波希米亚火绳枪手、重装枪骑与野战火炮熔铸为全天候精兵。接纳近代[institutions|e]将[gold|e]化为所向披靡的[regulars|e]，令王国[crown_power|e]凌驾诸侯。"
 oe_msn_hun_03_black_army_standing_req_tt:0 "处于文艺复兴时代或之后，拥有布达，国库至少250金币，建成军械库并接纳职业军队思潮。"
 oe_msn_hun_04_danube_multi_faith:0 "喀尔巴阡多民族宽容宪章"
