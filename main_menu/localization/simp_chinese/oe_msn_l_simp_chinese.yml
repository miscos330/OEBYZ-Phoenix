 oe_msn_eng_05_dublin_ireland:0 "绿宝石岛：稳控都柏林"
 oe_msn_eng_05_dublin_ireland_desc:0 "牢控都柏林与爱尔兰海诸港，彻底断绝了欧陆强敌在英格兰西翼开辟第二战场的可能。将都柏林夯实为稳固[core|e]并深化爱尔兰海[control|e]，既可源源补充熟练[sailors|e]与补给良港，更为不列颠舰队西出北大西洋扫清了门户障碍。"
 oe_msn_eng_05_dublin_ireland_req_tt:0 "拥有都柏林，且拥有至少 10 处港口或稳定度不低于 10。"
 oe_msn_eng_06_edinburgh_union:0 "不列颠统合：联合爱丁堡"
 oe_msn_eng_06_edinburgh_union_desc:0 "将爱丁堡与苏格兰王冠纳入大不列颠统一体系，一举终结了绵延数百年的北方边境烽火与老同盟夹击之患。夯实北方[core|e]融合不仅大幅抬升举国[stability|e]与[prosperity|e]，更将苏格兰的学术锐气与英格兰的雄厚财力合二为一，共赴浩瀚七海之约。"
 oe_msn_eng_06_edinburgh_union_req_tt:0 "直辖或由非主权附庸掌控爱丁堡，且稳定度不低于 12 或位列世界列强。"
 oe_msn_eng_07_atlantic_ventures:0 "北大西洋航路与海外特许领"
