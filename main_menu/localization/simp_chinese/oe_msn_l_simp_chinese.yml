 STATIC_MODIFIER_NAME_oe_msn_tur_m2:0 "巴尔干多瑙河与黎凡特霸权"
 STATIC_MODIFIER_DESC_oe_msn_tur_m2:0 "横跨贝尔格莱德、君士坦丁堡与开罗的庞大疆域令崇高国度威震欧亚非。"
 STATIC_MODIFIER_NAME_oe_msn_tur_m3:0 "黑海红海双海商道与铸炮署"
 STATIC_MODIFIER_DESC_oe_msn_tur_m3:0 "执掌海峡关税与托普哈内大铸炮厂，充实国库并压低重炮造价。"
 STATIC_MODIFIER_NAME_oe_msn_tur_m4:0 "三大洲崇高帝国近代天命"
 STATIC_MODIFIER_DESC_oe_msn_tur_m4:0 "完成军政革新与双圣城监护的崇高国度以近代火炮与海陆威权屹立近世。"
 oe_msn_tur_01_bursa_ghazi:0 "布尔萨起家：加齐雄主"
 oe_msn_tur_01_bursa_ghazi_desc:0 "背靠乌鲁达山的布尔萨是奥斯曼家族最初的王都，汇聚着安纳托利亚的加齐武士、丝绸行商与宗教学者。修缮城防商贸[buildings|e]、砥砺精锐[army_tradition|e]并稳固王朝[stability|e]，必将使昔日的边疆侯国蜕变为纪律严明的铁血[army|e]，蓄势待发以越峡经略巴尔干。"
 oe_msn_tur_01_bursa_ghazi_req_tt:0 "拥有布尔萨，稳定度不低于 5，且陆军传统不低于 12 或建有城堡/市场。"
 oe_msn_tur_02_timar_order:0 "蒂玛尔采邑与西帕希骑兵"
 oe_msn_tur_02_timar_order_desc:0 "蒂玛尔采邑册籍将行省田赋与西帕希重装骑兵的军役义务紧密相连，使朝廷无需耗尽白银便可常年维系庞大铁骑。严密掌握新附州县的[control|e]并稳住军事贵族[estate_satisfaction|e]，即可为帝国提供源源不绝的[manpower|e]储备与纵横欧亚两翼的精锐[army|e]。"
 oe_msn_tur_02_timar_order_req_tt:0 "拥有布尔萨，稳定度不低于 10，拥有至少 18 处地点，且贵族阶层满意度不低于 45%（或无此阶层）。"
 oe_msn_tur_03_imperial_divan:0 "帝国迪万与卡农法典"
 oe_msn_tur_03_imperial_divan_desc:0 "横跨多民族与多教派的广袤疆土，绝非零散习惯法所能长久维系。在帝国迪万会议中颁定成文《卡农》法典、兴建官署文教[buildings|e]并充实精干[cabinet|e]，不仅能稳步增强苏丹[crown_power|e]与国内[stability|e]，更将确立自鲁米利亚至幼发拉底河皆遵行的严明官僚法度。"
 oe_msn_tur_03_imperial_divan_req_tt:0 "拥有布尔萨，国库不少于 250 金币，处于文艺复兴或更晚时代，且建有经学院/账房或月商税收入不低于 25。"
 oe_msn_tur_04_tophane_foundry:0 "托普哈内巨炮与近卫新军"
 oe_msn_tur_04_tophane_foundry_desc:0 "金角湾北岸的托普哈内皇家铸炮厂昼夜炉火不息，为耶尼切里近卫新军批量浇铸攻城巨炮与标准化野战火炮。将官营军工[buildings|e]同近代火器[advances|e]深度结合，不仅大幅拔高帝国[army_tradition|e]，更令昔日坚不可摧的中世纪城墙在奥斯曼[army|e]的炽烈炮火前土崩瓦解。"
 oe_msn_tur_04_tophane_foundry_req_tt:0 "拥有君士坦丁堡，处于地理大发现或更晚时代，且建有铸炮坊/练兵场或陆军传统不低于 25。"
 oe_msn_tur_05_city_worlds_desire:0 "越峡称帝：攻克君士坦丁堡"
 oe_msn_tur_05_city_worlds_desire_desc:0 "攻克君士坦丁堡彻底打通了横亘千年的欧亚海峡天堑，令奥斯曼苏丹得以加冕罗马凯撒之尊。掌握这座无与伦比的[capital|e]不仅带来举世震动的[prestige|e]与海峡[control|e]，更将催生蓬勃的城市[development|e]，促使高门朝廷亲手裁定新皇都的百年帝国体制。"
 oe_msn_tur_05_city_worlds_desire_req_tt:0 "拥有君士坦丁堡。"
 oe_msn_tur_06_rumelia_danube:0 "挺进多瑙河：索非亚与贝尔格莱德"
 oe_msn_tur_06_rumelia_danube_desc:0 "沿巴尔干古老军道自索非亚北上，直至雄踞多瑙河与萨瓦河汇流处的贝尔格莱德，便是直插中欧腹地的战略锁钥。在此建立稳固[core|e]与重兵[fort|e]防线，既能将奥斯曼的[army_tradition|e]与威慑投射至匈牙利平原，亦可稳稳护住鲁米利亚后方的民生[prosperity|e]。"
 oe_msn_tur_06_rumelia_danube_req_tt:0 "拥有索非亚（斯雷代茨）与贝尔格莱德，且陆军传统不低于 20 或拥有至少 35 处地点。"
 oe_msn_tur_07_anatolia_unity:0 "一统安纳托利亚高原"
 oe_msn_tur_07_anatolia_unity_desc:0 "将卡拉曼与安纳托利亚高原诸侯尽收一统，彻底终结了后院掣肘与分裂隐患。在安卡拉与科尼亚广设官道驿馆[buildings|e]、深化行省[control|e]与[manpower|e]整合，不仅令高原丝路商税源源汇入国库，更为奥斯曼大军南下叙利亚与开罗扫清了一切后顾之忧。"
 oe_msn_tur_07_anatolia_unity_req_tt:0 "拥有安卡拉与科尼亚，且稳定度不低于 10 或建有商队旅舍。"
 oe_msn_tur_08_cairo_sanctuaries:0 "开罗与双圣城：哈里发法统"
 oe_msn_tur_08_cairo_sanctuaries_desc:0 "挥师入主开罗并奉迎麦加与麦地那双圣城监护权，令奥斯曼苏丹一跃成为伊斯兰世界的至高领袖与超级[great_power|e]。将尼罗河谷的丰沛粮赋与红海朝觐航道纳入体系，必将为帝国赢得横跨三大洲的崇高[prestige|e]、深厚[religious_influence|e]与无上[legitimacy|e]。"
 oe_msn_tur_08_cairo_sanctuaries_req_tt:0 "拥有开罗，直辖或由非主权附庸掌控麦加与麦地那，且位列世界列强。"
 oe_msn_tur_09_strait_caravanserais:0 "海峡驿道与黑海商税"
 oe_msn_tur_09_strait_caravanserais_desc:0 "奥斯曼海陆关卡正好卡在黑海、爱琴海与波斯商道的交汇咽喉，坐拥欧亚最繁忙的过境商流。沿途广建石砌官驿与市场[buildings|e]、保护商团以提升[estate_satisfaction|e]，既能让过境[trade|e]源源化作国库[gold|e]，也令海峡沿岸城镇绽放勃勃[prosperity|e]。"
 oe_msn_tur_09_strait_caravanserais_req_tt:0 "拥有君士坦丁堡，国库不少于 350 金币，月商税收入不低于 25，且建有商队旅舍或市场。"
 oe_msn_tur_10_mediterranean_navy:0 "东地中海桨帆舰队霸权"
 oe_msn_tur_10_mediterranean_navy_desc:0 "在爱琴海与北非海战中百炼成钢的帝国海军，依托金角湾皇家船厂源源不断地建造重炮桨帆战舰与远洋主力舰。扩建海港造船[buildings|e]并锤炼[navy_tradition|e]，即可凭借压倒性的[maritime_presence|e]护卫黎凡特[trade|e]命脉，令奥斯曼[navy|e]称霸东地中海波涛。"
 oe_msn_tur_10_mediterranean_navy_req_tt:0 "拥有士麦那或亚历山大，处于地理大发现或更晚时代，拥有至少 14 处港口，且海军传统不低于 20 或建有干船坞/船坞。"
 oe_msn_tur_11_late_porte_reform:0 "高门财政整顿与近世税改"
 oe_msn_tur_11_late_porte_reform_desc:0 "当白银通胀与包税积弊开始侵蚀近世大帝国根基，唯有效法科普吕律式的铁腕财政整顿方能续写盛世。积极接纳近代商贸[institutions|e]、整饬各省海关[buildings|e]并强化[control|e]与反[inflation|e]治理，将全面振兴高门文书效能与臣民[literacy|e]，令帝国财政重归稳健。"
 oe_msn_tur_11_late_porte_reform_req_tt:0 "拥有君士坦丁堡，稳定度不低于 15，处于宗教改革或更晚时代，且已接纳全球贸易思潮或建有海关/大学。"
 oe_msn_tur_12_three_continents:0 "三大洲崇高帝国天命"
 oe_msn_tur_12_three_continents_desc:0 "统辖欧洲、亚洲与非洲广袤山河，自金角湾绵延至红海圣城，崇高帝国已傲然屹立于近世世界强权之巅。凭借[capital|e]雄厚的[development|e]、坚若磐石的[stability|e]以及头等[great_power|e]的[prestige|e]，苏丹将在盛世大典上召开御前会议，为三大洲帝国定下迈向近代的终极国策。"
 oe_msn_tur_12_three_continents_req_tt:0 "完成三条支线，拥有君士坦丁堡与开罗，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 30。"
 oe_msn_mam_destiny:0 "#bold #color_yellow 红海香料苏丹国：马穆鲁克天命#!#!"
 oe_msn_mam_destiny_DESCRIPTION:0 "自纳西尔清丈至第乌抗葡与双海通航"
 oe_msn_mam_destiny_CRITERIA_DESCRIPTION:0 "整顿伊克塔与卡里米商团、编练第五军团火枪新军并守卫红海—尼罗河霸权"
 oe_msn_mam_destiny_BUTTON_TOOLTIP:0 "开启马穆鲁克天命"
 oe_msn_mam_destiny_BUTTON_DETAILS:0 "衔接 Slot 76 马穆鲁克主角长线：重核纳西尔土地清丈、驾驭巴赫里与布尔吉转型、护航亚丁至亚历山大香料走廊、编练第五军团火绳枪新军并贯通尼罗河—红海航道。"
 STATIC_MODIFIER_NAME_oe_msn_mam_m1:0 "第五军团火枪与新式骑兵"
 STATIC_MODIFIER_DESC_oe_msn_mam_m1:0 "将传统马穆鲁克精骑与第五军团火绳枪步兵结合，粉碎火器落伍宿命。"
 STATIC_MODIFIER_NAME_oe_msn_mam_m2:0 "双圣城与黎凡特铁壁"
 STATIC_MODIFIER_DESC_oe_msn_mam_m2:0 "牢控叙利亚城堡群与汉志双圣城，稳居阿拉伯—地中海十字路口。"
 STATIC_MODIFIER_NAME_oe_msn_mam_m3:0 "卡里米红海香料与尼罗粮仓"
 STATIC_MODIFIER_DESC_oe_msn_mam_m3:0 "吉达、亚丁与亚历山大商栈日进斗金，尼罗河官仓丰盈无虞。"
 STATIC_MODIFIER_NAME_oe_msn_mam_m4:0 "尼罗—红海双海近代苏丹国"
 STATIC_MODIFIER_DESC_oe_msn_mam_m4:0 "打通苏伊士运河并击败好望角封锁，马穆鲁克以双海贸易与新军屹立近世。"
 oe_msn_mam_01_rawk_cadastre:0 "纳西尔土地清丈重核"
 oe_msn_mam_01_rawk_cadastre_desc:0 "纳西尔苏丹的大规模清丈曾重划埃及与叙利亚田赋，将丰饶尼罗河谷的财源牢牢收归开罗中央。如今重核土地清册、完善粮仓与市场[buildings|e]并提振[capital|e]的[development|e]，不仅能夯实王朝[stability|e]与[control|e]，更能令城堡国库常年[gold|e]充盈。"
 oe_msn_mam_01_rawk_cadastre_req_tt:0 "拥有开罗与亚历山大，稳定度不低于 5，首都发展度不低于 18，且建有粮仓或市场。"
 oe_msn_mam_02_bahri_burji_order:0 "巴赫里与布尔吉宫廷整肃"
 oe_msn_mam_02_bahri_burji_order_desc:0 "钦察巴赫里军团与切尔克斯布尔吉派系的宫廷倾轧，曾屡次令开罗城堡陷入血腥政变。整肃禁卫军纪、妥善平衡军事[estates|e]并锤炼精锐[army_tradition|e]，既能确立苏丹不容挑战的[legitimacy|e]，又能重铸令北方强敌望而生畏的铁血马穆鲁克[army|e]。"
 oe_msn_mam_02_bahri_burji_order_req_tt:0 "拥有开罗，稳定度不低于 12，且陆军传统不低于 15 或建有城堡/经学院。"
 oe_msn_mam_03_fifth_corps_firearms:0 "组建第五军团火绳枪新军"
 oe_msn_mam_03_fifth_corps_firearms_desc:0 "昔日高傲的重装马穆鲁克骑兵视火器为非骑士之道，但近世战场的残酷铁律不容半点守旧。毅然编练领饷的第五军团、列装火绳枪与野战铜炮并吸纳火药[advances|e]，将令苏丹的常备[regulars|e]与[army_tradition|e]脱胎换骨，在叙利亚与印度洋战场立于不败之地。"
 oe_msn_mam_03_fifth_corps_firearms_req_tt:0 "拥有开罗，国库不少于 250 金币，处于地理大发现或更晚时代，且已研习火药/长矛火枪革新或建有铸炮坊/练兵场。"
 oe_msn_mam_04_abolish_iqta_farming:0 "废除伊克塔包税推行直辖俸禄"
 oe_msn_mam_04_abolish_iqta_farming_desc:0 "割据散漫的伊克塔包税制每逢危机便令开罗财源枯竭、军令难行。如今废除旧式采邑包税改为中央直发俸禄，抑或将忠诚总督省[subjects|e]纳入高效[cabinet|e]体系，皆将重塑苏丹国的[control|e]与[crown_power|e]，并促成决定埃及近世国运的财政宪制大辩论。"
 oe_msn_mam_04_abolish_iqta_farming_req_tt:0 "拥有开罗，处于宗教改革或更晚时代，拥有至少 35 处地点，且统辖总督省/谢里夫附庸或月商税收入不低于 40。"
 oe_msn_mam_05_levant_citadels:0 "叙利亚双壁：大马士革与阿勒颇"
 oe_msn_mam_05_levant_citadels_desc:0 "大马士革与阿勒颇是苏丹国屹立北方的双壁雄关，既扼守两河流域西来的商队要道，又俯瞰安纳托利亚南下的山口。无论直辖修筑坚城[fort|e]，抑或依托叙利亚总督省[subjects|e]分守，都能牢牢夯实北方[core|e]屏障，护卫黎凡特丝绸[trade|e]与帝国安危。"
 oe_msn_mam_05_levant_citadels_req_tt:0 "直辖或由非主权附庸掌控大马士革与阿勒颇，且统辖马穆鲁克总督省附庸或建有城堡。"
 oe_msn_mam_06_hejaz_sanctuaries:0 "双圣城与红海朝觐门户"
 oe_msn_mam_06_hejaz_sanctuaries_desc:0 "岁岁年年，满载官粮、金币与克尔白锦幔的朝觐驼队自开罗启程，红海商船亦在吉达港卸下远洋香料。无论直辖抑或借谢里夫[subjects|e]拱卫麦加与麦地那双圣城，皆能将苏丹的[religious_influence|e]、[prestige|e]与教士[estate_satisfaction|e]推向伊斯兰世界之巅。"
 oe_msn_mam_06_hejaz_sanctuaries_req_tt:0 "直辖或由非主权附庸掌控吉达、麦加与麦地那。"
 oe_msn_mam_07_aden_red_sea_gate:0 "锁钥曼德海峡：掌控亚丁"
 oe_msn_mam_07_aden_red_sea_gate_desc:0 "雄踞火山岩壁之下的亚丁港紧锁曼德海峡，是连通红海与古吉拉特、马拉巴尔香料航线的咽喉铁锁。以强盛[navy|e]与[maritime_presence|e]牢控亚丁，既可拒域外封锁舰队于海峡之外，又能护住红海胡椒与丁香[trade|e]通道，将整片红海化为帝国稳固内湖。"
 oe_msn_mam_07_aden_red_sea_gate_req_tt:0 "直辖或由非主权附庸掌控亚丁，且拥有至少 10 处港口或海军传统不低于 15。"
 oe_msn_mam_08_diu_indian_ocean:0 "印度洋抗葡舰队与苏伊士船坞"
 oe_msn_mam_08_diu_indian_ocean_desc:0 "将黎凡特良材长途转运至苏伊士船坞，马穆鲁克水师倾力建造远洋炮舰以决战印度洋季风航道。凭借精良造船[buildings|e]与深厚[navy_tradition|e]，苏丹[navy|e]将打破绕道好望角的海上封锁，令印度洋香料[trade|e]主干道长久回流埃及诸港。"
 oe_msn_mam_08_diu_indian_ocean_req_tt:0 "拥有苏伊士，直辖或由非主权附庸掌控亚丁，处于地理大发现或更晚时代，且海军传统不低于 25 或建有干船坞/造船厂。"
 oe_msn_mam_09_karimi_funduqs:0 "卡里米大商团与香料专卖平衡"
 oe_msn_mam_09_karimi_funduqs_desc:0 "苛酷的官营专卖曾重创纵横红海的卡里米大商团，令亚历山大港商船锐减。如今改行官商互利之策、稳住市民[estate_satisfaction|e]并激活[market|e]流转，不仅能让香料转口[trade|e]重现盛况，更为苏丹国带来源源不绝的[gold|e]关市岁入。"
 oe_msn_mam_09_karimi_funduqs_req_tt:0 "拥有开罗与亚历山大，国库不少于 350 金币，月商税收入不低于 25，且市民阶层满意度不低于 50%。"
 oe_msn_mam_10_shuna_nile_granary:0 "尼罗河大坝与帝国常平义仓"
 oe_msn_mam_10_shuna_nile_granary_desc:0 "尼罗河水位计的每一次涨落，皆关乎三角洲千万生民的饱暖与王朝安危。在开罗、亚历山大与达米埃塔广修水利闸坝与常平义仓[buildings|e]，既能从容抵御枯水旱灾、拉升绿洲[development|e]与[prosperity|e]，更令丰沛余粮成为驰骋东地中海的[diplomacy|e]筹码。"
 oe_msn_mam_10_shuna_nile_granary_req_tt:0 "拥有开罗、亚历山大与达米埃塔，且建有粮仓或引水渠系统。"
 oe_msn_mam_11_trajan_suez_canal:0 "浚通图拉真—苏伊士古运河"
 oe_msn_mam_11_trajan_suez_canal_desc:0 "自法老、罗马皇帝至历代哈里发，贯通地中海与红海的航运巨渠始终是跨越千年的宏伟梦想。依托近世工程[institutions|e]与港务[buildings|e]重浚图拉真—苏伊士古运河，将令欧亚海程骤减一半，为埃及带来冠绝全球的[trade|e]主导权与无上[prestige|e]。"
 oe_msn_mam_11_trajan_suez_canal_req_tt:0 "拥有苏伊士、开罗与亚历山大，处于宗教改革或更晚时代，且已接纳全球贸易思潮或建有港务署/海关。"
 oe_msn_mam_12_dual_sea_sultanate:0 "红海—尼罗河双海近代苏丹国"
 oe_msn_mam_12_dual_sea_sultanate_desc:0 "打破旧史定数，马穆鲁克苏丹国凭火枪新军、远洋舰队与苏伊士运河同时执掌地中海与印度洋两片汪洋。作为傲视中东与南亚的头等[great_power|e]，依托开罗辉煌的[development|e]、稳固[stability|e]与崇高[prestige|e]，双海苏丹国将在盛典上确立统御近世的终极宏纲。"
 oe_msn_mam_12_dual_sea_sultanate_req_tt:0 "完成三条支线，拥有开罗与亚历山大，直辖或由附庸掌控亚丁，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 30。"
 oe_msn_ven_destiny:0 "#bold #color_yellow 亚得里亚新娘：威尼斯海洋天命#!#!"
 oe_msn_ven_destiny_DESCRIPTION:0 "自潟湖军械库至全地中海商业海洋共和国"
 oe_msn_ven_destiny_CRITERIA_DESCRIPTION:0 "称雄基奥贾、建军械库重型桨帆炮舰、贯通海洋领地并延续启蒙共和国"
 oe_msn_ven_destiny_BUTTON_TOOLTIP:0 "开启威尼斯天命"
 oe_msn_ven_destiny_BUTTON_DETAILS:0 "衔接 Slot 78 威热主角线：以十人团与双岛检疫港稳固潟湖、凭军械库流水船台速造重型桨帆炮舰、串联达尔马提亚—克里特—塞浦路斯海洋领地，并在大西洋时代以宪政改革续写辉煌。"
 STATIC_MODIFIER_NAME_oe_msn_ven_m1:0 "十人团与军械库装配流水线"
 STATIC_MODIFIER_DESC_oe_msn_ven_m1:0 "高效率的国家安全机制与标准化造船流水线令威尼斯战舰如潮下水。"
 STATIC_MODIFIER_NAME_oe_msn_ven_m2:0 "海洋领地岛链霸权"
 STATIC_MODIFIER_DESC_oe_msn_ven_m2:0 "科孚、克里特与塞浦路斯构成固若金汤的东地中海补给与海军链条。"
 STATIC_MODIFIER_NAME_oe_msn_ven_m3:0 "潟湖检疫港与活字玻璃工艺"
 STATIC_MODIFIER_DESC_oe_msn_ven_m3:0 "领先全欧的港口检疫、威尼斯印刷业与玻璃工坊支撑持久繁荣。"
 STATIC_MODIFIER_NAME_oe_msn_ven_m4:0 "至善海洋联邦不朽宪政"
 STATIC_MODIFIER_DESC_oe_msn_ven_m4:0 "开放《黄金书》并稳控东地中海与香料转口，至善共和国傲立近世列强之林。"
 oe_msn_ven_01_lagoon_adriatic:0 "威尼斯潟湖与扎达尔门户"
 oe_msn_ven_01_lagoon_adriatic_desc:0 "依托潟湖浅滩与木桩防线，威尼斯[capital|e]以扎达尔为门户，将[navy|e]巡弋延展至整片亚得里亚海。新建码头与常备桨帆船队把达尔马提亚港湾化作护盾，确保共和商船的[trade|e]命脉与[maritime_presence|e]稳如磐石。"
 oe_msn_ven_01_lagoon_adriatic_req_tt:0 "拥有威尼斯，直接或通过属国控制扎达尔，稳定度至少为5，拥有港口并建成一处码头。"
 oe_msn_ven_02_council_of_ten:0 "十人团与共和政体防变"
