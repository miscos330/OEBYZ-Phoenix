 oe_msn_gen_07_western_med_nodes_req_tt:0 "拥有热那亚，控制至少15处地点且拥有至少6座港口。"
 oe_msn_gen_08_italian_balance:0 "亚平宁海陆均衡：威慑米兰与威尼斯"
