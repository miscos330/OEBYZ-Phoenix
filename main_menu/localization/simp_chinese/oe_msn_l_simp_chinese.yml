 oe_msn_fra_01_paris_orleans_desc:0 "稳守法兰西岛巴黎与卢瓦尔河门户奥尔良，便能守住法兰西王室抵御外侮与封建割据的心脏腹地。扩修城防与商贸[buildings|e]、提升[capital|e]的[development|e]并稳固朝廷[stability|e]，必将汇聚举国[manpower|e]与民心，吹响彻底驱逐域外强敌的号角。"
 oe_msn_fra_01_paris_orleans_req_tt:0 "拥有巴黎与奥尔良，稳定度不低于 5，首都发展度不低于 18，且建有市场或城堡。"
 oe_msn_fra_02_compagnies_gendarmes:0 "敕建皇家宪兵常备军团"
 oe_msn_fra_02_compagnies_gendarmes_desc:0 "凭借固定人头税常年供养敕建皇家宪兵骑兵与布罗兄弟的野战炮队，法兰西在西欧率先锻造出脱离封建征召的常备精锐。兴建军械[buildings|e]并磨砺[army_tradition|e]，将令纪律严明的王室[regulars|e]成为欧洲战场的主宰，奠定法兰西[army|e]的百年雄风。"
 oe_msn_fra_02_compagnies_gendarmes_req_tt:0 "拥有巴黎，国库不少于 220 金币，且陆军传统不低于 15 或建有军械库/城堡。"
 oe_msn_fra_03_edict_reconciliation:0 "宗教和解诏与王室集权"
 oe_msn_fra_03_edict_reconciliation_desc:0 "绵延数十载的教派血战险些将法兰西撕得四分五裂，唯有将国家存续置于党争之上的政治智慧方能止戈息乱。顺应宗教改革时期的时代[institutions|e]、颁行宽容和解敕令，既可重塑举国[stability|e]与阶层[estate_satisfaction|e]，更能让满目疮痍的城镇迅速恢复[prosperity|e]。"
 oe_msn_fra_03_edict_reconciliation_req_tt:0 "拥有巴黎，稳定度不低于 15，处于宗教改革或更晚时代，教士满意度不低于 45%，且已接纳教派体制或建有大教堂/大学。"
 oe_msn_fra_04_royal_absolutism:0 "财政总督与绝对君主制"
 oe_msn_fra_04_royal_absolutism_desc:0 "自卢浮宫直派各省的王室财政总督严核税赋、削平大贵族私权，将四十五城沃土牢牢凝聚于巴黎号令之下。伴随空前高涨的[crown_power|e]、高效[cabinet|e]与全国[control|e]，法兰西迎来历史性抉择：究竟奉行凡尔赛绝对王权、重开三级会议宪政，抑或践行柯尔贝尔式重商强国？"
 oe_msn_fra_04_royal_absolutism_req_tt:0 "拥有巴黎，处于宗教改革或更晚时代，拥有至少 45 处地点且月商税收入不低于 40。"
 oe_msn_fra_05_bordeaux_aquitaine:0 "收复阿基坦：波尔多归属王室"
 oe_msn_fra_05_bordeaux_aquitaine_desc:0 "收复波尔多与加斯科涅酒乡，彻底终结了金雀花王朝在吉伦特河口绵延三百年的割据统治。将阿基坦化为王室稳固[core|e]并完善大西洋口岸[buildings|e]，不仅令丰厚的葡萄酒远洋[trade|e]税利尽归巴黎，更将法兰西的[maritime_presence|e]稳步推向比斯开湾。"
 oe_msn_fra_05_bordeaux_aquitaine_req_tt:0 "拥有波尔多，且拥有至少 6 处港口或建有码头/市场。"
 oe_msn_fra_06_calais_channel:0 "肃清海峡桥头堡：收复加来"
 oe_msn_fra_06_calais_channel_desc:0 "拔除英军在欧陆的最后桥头堡加来，宣告绵延百年的英法战争终以法兰西完胜落幕。加固这座海峡[core|e]与北方[fort|e]重镇，既可永保皮卡第腹地[prosperity|e]并极大拔升王室[prestige|e]，更令法国得以腾出主力，挥师翻越阿尔卑斯山逐鹿意大利。"
 oe_msn_fra_06_calais_channel_req_tt:0 "拥有加来。"
 oe_msn_fra_07_italian_wars_milan:0 "翻越阿尔卑斯：争锋米兰与那不勒斯"
 oe_msn_fra_07_italian_wars_milan_desc:0 "率领精锐骑兵与青铜野战炮翻越阿尔卑斯山口南下伦巴第与那不勒斯，令法兰西直接步入文艺复兴欧洲的权力中心。无论直取意北名城，抑或统御盟藩[subjects|e]凭借凌厉[army_tradition|e]称雄亚平宁，皆能将意大利人文[cultural_tradition|e]引入巴黎，并以强横[diplomacy|e]震撼西欧诸侯。"
 oe_msn_fra_07_italian_wars_milan_req_tt:0 "直辖或由非主权附庸掌控米兰或那不勒斯（或拥有巴黎），至少 50 处地点，且陆军传统不低于 24 或拥有至少 2 个附庸。"
 oe_msn_fra_08_continental_arbiter:0 "西欧大陆仲裁者"
 oe_msn_fra_08_continental_arbiter_desc:0 "自英吉利海峡绵延至比利牛斯山麓与莱茵河畔，彻底统一的法兰西执掌着拉丁基督教世界最雄厚的人口与武备重心。作为欧陆无可撼动的头等[great_power|e]，法兰西的[diplomatic_reputation|e]与[prestige|e]登临绝顶，令巴黎成为欧洲和战格局中绕不开的最高仲裁者。"
 oe_msn_fra_08_continental_arbiter_req_tt:0 "拥有巴黎、波尔多与加来，拥有至少 55 处地点且位列世界列强。"
 oe_msn_fra_09_atlantic_privateers:0 "大西洋海贸与特许船队"
 oe_msn_fra_09_atlantic_privateers_desc:0 "绝不甘心坐视伊比利亚两强独占新大陆，来自迪耶普、拉罗歇尔与波尔多的法兰西航海家扬帆横渡大西洋，开辟圣劳伦斯与加勒比航道。扩建海港船坞[buildings|e]、锻造远洋[navy|e]与[navy_tradition|e]，既可极大拓展大西洋[maritime_presence|e]，又为鸢尾花王冠打开远洋[trade|e]与海外拓殖通途。"
 oe_msn_fra_09_atlantic_privateers_req_tt:0 "拥有波尔多，处于地理大发现或更晚时代，拥有至少 10 处港口，且海军传统不低于 18 或建有干船坞/船坞。"
 oe_msn_fra_10_fontainebleau_arts:0 "枫丹白露学派与巴黎皇家工场"
 oe_msn_fra_10_fontainebleau_arts_desc:0 "广邀文艺复兴艺匠大师、丝绸织工与镜面玻璃工坊齐聚枫丹白露与巴黎，将宫廷美学升华为强国富民的高端产业。接纳人文[institutions|e]并兴建艺术工艺[buildings|e]，不仅令法兰西[cultural_tradition|e]与[capital|e][development|e]节节攀升，更让巴黎工艺与风尚引领整个欧洲。"
 oe_msn_fra_10_fontainebleau_arts_req_tt:0 "拥有巴黎，国库不少于 400 金币，且已接纳文艺复兴思潮或建有艺术学校/艺术学院。"
 oe_msn_fra_11_enlightenment_salons:0 "启蒙沙龙与法兰西科学院"
 oe_msn_fra_11_enlightenment_salons_desc:0 "在巴黎沙龙与法兰西科学院的殿堂之内，启蒙哲人、测绘学家与工程师纵论理性法度与自然哲学，激荡出震撼旧秩序的思想洪流。大力扶持印刷[institutions|e]与科学[buildings|e]，将全面提升国家[literacy|e]与前沿[advances|e]增速，使法语成为欧洲外交与学术界通用的思想语言。"
 oe_msn_fra_11_enlightenment_salons_req_tt:0 "拥有巴黎，稳定度不低于 18，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有印刷坊/大学。"
 oe_msn_fra_12_french_code_destiny:0 "启蒙法典与欧陆霸主天命"
 oe_msn_fra_12_french_code_destiny_desc:0 "集欧陆顶尖常备劲旅、璀璨启蒙学府与统一法政体系于一身，法兰西已然登上近世文明的荣耀之巅。作为震撼世界的头等[great_power|e]，依托巴黎冠绝欧洲的[capital|e][development|e]、坚实[stability|e]与无双[prestige|e]，法兰西将在此颁定照耀近世百年的不朽法典与帝国宏纲。"
 oe_msn_fra_12_french_code_destiny_req_tt:0 "完成三条支线，拥有巴黎、波尔多与加来，稳定度不低于 18，处于专制或更晚时代，位列世界列强且首都发展度不低于 32。"
