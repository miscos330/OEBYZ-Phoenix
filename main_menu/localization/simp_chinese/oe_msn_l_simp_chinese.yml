 oe_msn_eng_01_london_york_req_tt:0 "拥有伦敦与约克，稳定度不低于 5，首都发展度不低于 18，且建有市场或码头。"
 oe_msn_eng_02_parliament_fisc:0 "议会税制与羊毛财政革新"
 oe_msn_eng_02_parliament_fisc_desc:0 "当王室与下院在威斯敏斯特就透明关税与特别拨款达成共识，英格兰便彻底摆脱了向外国银行家举债度日的中世纪窘境。善用[parliament|e]立法并稳住市民[estate_satisfaction|e]，既可遏止通货[inflation|e]、确立稳健王室信用，更能将丰沛[trade|e]岁入源源注入国防与海权建设。"
 oe_msn_eng_02_parliament_fisc_req_tt:0 "拥有伦敦，稳定度不低于 10，国库不少于 220 金币，月商税收入不低于 22，且市民阶层满意度不低于 50%。"
 oe_msn_eng_03_royal_navy_charter:0 "敕建皇家海军与圣公会革新"
