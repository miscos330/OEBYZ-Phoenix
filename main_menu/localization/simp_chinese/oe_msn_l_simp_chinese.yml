 oe_msn_eng_10_navigation_clearing_req_tt:0 "拥有伦敦，国库不少于 500 金币，月商税收入不低于 38，且拥有至少 16 处港口或建有港务署/商帮街区。"
 oe_msn_eng_11_royal_society:0 "皇家学会与不列颠工业启蒙"
 oe_msn_eng_11_royal_society_desc:0 "秉持「不轻信人言」的实证精神，伦敦皇家学会与苏格兰启蒙学者将实验物理、航海天文钟与机械工程紧密相连。培育学术[institutions|e]与高等[buildings|e]，将令不列颠的[literacy|e]、[cultural_tradition|e]与科技[advances|e]遥遥领先，率先叩响蒸汽与机械工业时代的大门。"
 oe_msn_eng_11_royal_society_req_tt:0 "拥有伦敦，稳定度不低于 18，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有大学/印刷坊。"
 oe_msn_eng_12_rule_britannia:0 "日不落海权工场帝国天命"
 oe_msn_eng_12_rule_britannia_desc:0 "不列颠三岛已归于立宪一统，皇家海军铁甲云帆巡弋七海，伦敦的银行与工场昼夜驱动着近代文明引擎。作为号令全球的头等[great_power|e]，凭借[capital|e]傲视欧陆的[development|e]、稳健[stability|e]与辉煌[prestige|e]，威斯敏斯特将在大典上宣告日不落帝国的终极百年大计。"
 oe_msn_eng_12_rule_britannia_req_tt:0 "完成三条支线，拥有伦敦与都柏林，直辖或由附庸掌控爱丁堡，稳定度不低于 18，处于专制或更晚时代，位列世界列强且首都发展度不低于 32。"
 oe_msn_spa_destiny:0 "#bold #color_yellow 双洋白银与大方阵：西班牙天命#!#!"
 oe_msn_spa_destiny_DESCRIPTION:0 "自收复失地至波托西银船、西班牙大方阵与马尼拉航线"
 oe_msn_spa_destiny_CRITERIA_DESCRIPTION:0 "完成收复失地与卡阿联统、编练西班牙大方阵并贯通波托西—塞维利亚—马尼拉银潮"
 oe_msn_spa_destiny_BUTTON_TOOLTIP:0 "开启西班牙天命"
 oe_msn_spa_destiny_BUTTON_DETAILS:0 "衔接 Slot 81 欧亚经济 2.0 与 v12.5 白银价格革命：从收复格拉纳达与卡斯蒂利亚—阿拉贡联统起航，以无敌大方阵、塞维利亚西印度商馆、波托西银山与马尼拉大帆船缔造双洋霸权。"
 STATIC_MODIFIER_NAME_oe_msn_spa_m1:0 "西班牙大方阵与卡斯蒂利亚海兵"
 STATIC_MODIFIER_DESC_oe_msn_spa_m1:0 "长矛火枪协同的无敌大方阵与远洋海兵团纵横欧陆与新大陆。"
 STATIC_MODIFIER_NAME_oe_msn_spa_m2:0 "伊比利亚一统与双洋副王领"
 STATIC_MODIFIER_DESC_oe_msn_spa_m2:0 "从塞维利亚至新大陆与太平洋副王领的跨洋帝国号令双洋。"
 STATIC_MODIFIER_NAME_oe_msn_spa_m3:0 "塞维利亚商馆与黄金世纪启蒙"
 STATIC_MODIFIER_DESC_oe_msn_spa_m3:0 "萨拉曼卡学派、黄金世纪文教与白银规制令帝国财源滚滚且通胀可控。"
 STATIC_MODIFIER_NAME_oe_msn_spa_m4:0 "更远彼方：双洋天主教超级帝国"
 STATIC_MODIFIER_DESC_oe_msn_spa_m4:0 "以大方阵军威、双洋白银航线与黄金世纪文治铸就史无前例的全球帝国。"
 oe_msn_spa_01_castile_aragon_core:0 "卡斯蒂利亚与阿拉贡王权根基"
 oe_msn_spa_01_castile_aragon_core_desc:0 "从卡斯蒂利亚的石堡高原到巴塞罗那的商船云集之港，历经七百年边疆征战洗礼的伊比利亚基督教王权正蓄势待发。完善核心[buildings|e]、提振[capital|e]的[development|e]并稳固王室[stability|e]，将凝聚起半岛雄厚的[manpower|e]与骑士精神，吹响光复失地最后一役的冲锋号。"
 oe_msn_spa_01_castile_aragon_core_req_tt:0 "拥有巴利亚多利德、托莱多或巴塞罗那，稳定度不低于 5，且首都发展度不低于 16 或建有城堡/市场。"
 oe_msn_spa_02_tercio_pike_shot:0 "敕建西班牙无敌大方阵"
 oe_msn_spa_02_tercio_pike_shot_desc:0 "将密不透风的长矛铁壁、轮番齐射的火绳枪方阵与托莱多剑盾老兵融为一体，西班牙无敌大方阵彻底改写了近代欧洲战史。率先掌握火器[advances|e]并严训常备[regulars|e]，将把帝国的[army_tradition|e]推上绝巅，令西班牙[army|e]在欧陆各大战场无坚不摧。"
 oe_msn_spa_02_tercio_pike_shot_req_tt:0 "拥有托莱多/巴塞罗那/塞维利亚，国库不少于 220 金币，处于地理大发现或更晚时代，且已研习长矛火枪革新、陆军传统不低于 22 或建有练兵场。"
 oe_msn_spa_03_marine_infantry:0 "皇家海军陆战队与无敌帆船舰队"
 oe_msn_spa_03_marine_infantry_desc:0 "为护卫跨洋白银大帆船免遭海盗袭扰，并在地中海决战劲敌舰队，王室率先组建世界最早的常备海军陆战队。扩修海港船坞[buildings|e]、汇聚精锐[sailors|e]与[navy_tradition|e]，令西班牙[navy|e]的双洋[maritime_presence|e]威震大西洋与地中海。"
 oe_msn_spa_03_marine_infantry_req_tt:0 "拥有塞维利亚或巴塞罗那，处于地理大发现或更晚时代，拥有至少 12 处港口，且海军传统不低于 20 或建有干船坞/船坞。"
 oe_msn_spa_04_viceroyalty_council:0 "印度事务委员会与双洋副王制"
 oe_msn_spa_04_viceroyalty_council_desc:0 "统筹横跨伊比利亚、意大利与海外副王区的全球复合君主国，令旧式宫廷议事体系不堪重负。借印度事务委员会与高效[cabinet|e]驾驭诸路总督[subjects|e]，显著强化帝国[control|e]与[crown_power|e]之际，朝廷须亲手裁定双半球帝国的根本治理宪章。"
 oe_msn_spa_04_viceroyalty_council_req_tt:0 "拥有托莱多/塞维利亚/巴塞罗那，处于宗教改革或更晚时代，至少 40 处地点，且统辖总督领附庸、至少 2 个附庸或月商税收入不低于 38。"
 oe_msn_spa_05_reconquista_granada:0 "终结收复失地：克复格拉纳达"
 oe_msn_spa_05_reconquista_granada_desc:0 "当十字王旗在阿尔罕布拉宫的红砂岩塔楼之巅迎风招展，绵延八百载的收复失地运动终告圆满落幕。将格拉纳达纳入永恒[core|e]，不仅为王室赢得举世敬仰的[prestige|e]、[religious_influence|e]与教士[estate_satisfaction|e]，更彻底释放了西班牙越过赫拉克勒斯之柱奔向大洋的磅礴伟力。"
 oe_msn_spa_05_reconquista_granada_req_tt:0 "拥有格拉纳达。"
 oe_msn_spa_06_iberian_union:0 "双冠合璧：托莱多、塞维利亚与巴塞罗那"
 oe_msn_spa_06_iberian_union_desc:0 "将面向大西洋的塞维利亚与俯瞰地中海的巴塞罗那收归一统，令卡斯蒂利亚的陆海雄风同阿拉贡的地中海商网完美合璧。把双港夯实为稳固[core|e]枢纽，既能极大增进双海[trade|e]与王朝[legitimacy|e]，更将伊比利亚[prosperity|e]直接连通亚平宁与浩瀚新世界。"
 oe_msn_spa_06_iberian_union_req_tt:0 "拥有塞维利亚与巴塞罗那，且拥有至少 10 处港口或稳定度不低于 10。"
 oe_msn_spa_07_potosi_silver_mountain:0 "安第斯白银山：波托西或新大陆霸权"
 oe_msn_spa_07_potosi_silver_mountain_desc:0 "自安第斯波托西富饶银山开采出的滚滚白银，抑或伊比利亚大西洋商埠的磅礴关税，如洪流般涌入西班牙皇家造币厂。顺应新世界[institutions|e]与跨洋[trade|e]大潮，虽能为王室带来取之不尽的[gold|e]财源，亦须警惕白银[inflation|e]暗流，方能将一时暴富化为百年霸业。"
 oe_msn_spa_07_potosi_silver_mountain_req_tt:0 "直辖或由非主权附庸掌控波托西（或拥有塞维利亚），至少 50 处地点，且已接纳新大陆思潮或月商税收入不低于 38。"
 oe_msn_spa_08_manila_galleon_port:0 "太平洋门户：马尼拉大帆船航线"
 oe_msn_spa_08_manila_galleon_port_desc:0 "满载西班牙银元的马尼拉大帆船乘太平洋信风西航，直换东亚精美的丝绸与青花瓷，人类历史上第一条环绕地球的贸易闭环就此打通。以全球[great_power|e]之姿执掌双洋[maritime_presence|e]，令西班牙银币成为沟通欧亚美三大洲的通用货币，彰显无上[trade|e]伟力与帝国[prestige|e]。"
 oe_msn_spa_08_manila_galleon_port_req_tt:0 "直辖或由非主权附庸掌控马尼拉（或拥有塞维利亚），处于宗教改革或更晚时代且位列世界列强。"
 oe_msn_spa_09_seville_contratacion:0 "塞维利亚通商院与银币成色"
 oe_msn_spa_09_seville_contratacion_desc:0 "在塞维利亚西印度通商院的巍峨厅堂内，皇家验金官校验每一船美洲金银成色，首席领航员则严密保管着绘制全球航线的皇家海图。完善商贸[buildings|e]并强化对跨洋[market|e]的[control|e]，不仅令王室岁入[gold|e]飙升，更将安达卢西亚打造成大西洋首屈一指的航运金融总枢。"
 oe_msn_spa_09_seville_contratacion_req_tt:0 "拥有塞维利亚，国库不少于 350 金币，月商税收入不低于 26，且建有账房或市场。"
 oe_msn_spa_10_school_salamanca:0 "萨拉曼卡学派与白银货币理论"
 oe_msn_spa_10_school_salamanca_desc:0 "在萨拉曼卡大学的古老回廊间，法学家与经济学者率先奠基近代国际公法，并揭示白银涌入引发物价革命的货币数量规律。资助高等[buildings|e]与金融[institutions|e]，不仅显著提振帝国[literacy|e]与[cultural_tradition|e]，更为王室驯服通货[inflation|e]、稳固财政提供了超越时代的智慧。"
 oe_msn_spa_10_school_salamanca_req_tt:0 "拥有巴利亚多利德/托莱多/塞维利亚，稳定度不低于 12，处于地理大发现或更晚时代，且已接纳银行业思潮或建有大学/印刷坊。"
 oe_msn_spa_11_siglo_de_oro:0 "西班牙黄金世纪与启蒙改革"
 oe_msn_spa_11_siglo_de_oro_desc:0 "光影如神的宫廷画师、妙笔生花的戏剧宗师与气势恢宏的皇家建筑，将双洋帝国的绝代富贵升华为流芳千古的西班牙黄金世纪。扶植艺文[buildings|e]与印刷[institutions|e]，既令帝国的[cultural_tradition|e]与[prestige|e]交相辉映，也全面推动各项近世[advances|e]在伊比利亚遍地开花。"
 oe_msn_spa_11_siglo_de_oro_req_tt:0 "拥有托莱多/塞维利亚/巴塞罗那，稳定度不低于 15，处于宗教改革或更晚时代，且建有艺术学院/大学或已接纳印刷术思潮。"
 oe_msn_spa_12_plus_ultra_destiny:0 "更远彼方：双洋天主教霸权天命"
 oe_msn_spa_12_plus_ultra_destiny_desc:0 "正如「更远彼方」的豪迈铭言，统一的西班牙凭借无敌大方阵、双洋帆船航道与黄金世纪盛华，真正缔造了太阳永不落下的跨洲巨帝。作为头等[great_power|e]，依托雄厚的[capital|e][development|e]、稳固[stability|e]与环宇[prestige|e]，王室将在盛典上颁定帝国迈向近代的终极国策。"
 oe_msn_spa_12_plus_ultra_destiny_req_tt:0 "完成三条支线，拥有塞维利亚与格拉纳达，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 30。"
 oe_msn_por_destiny:0 "#bold #color_yellow 航海家与香料航道：葡萄牙天命#!#!"
 oe_msn_por_destiny_DESCRIPTION:0 "自里斯本阿维什航海学派至果阿、马六甲与香料群岛"
 oe_msn_por_destiny_CRITERIA_DESCRIPTION:0 "突破休达与好望角、建立果阿与马六甲东方总督领并掌控印度洋香料航路"
 oe_msn_por_destiny_BUTTON_TOOLTIP:0 "开启葡萄牙天命"
 oe_msn_por_destiny_BUTTON_DETAILS:0 "以弹丸伊比利亚王国撬动两大洋：从里斯本、波尔图与休达启航，绕过好望角决战第乌，在果阿、卡利卡特、马六甲与特尔纳特筑起跨洲香料总督领。"
 STATIC_MODIFIER_NAME_oe_msn_por_m1:0 "阿维什航海学派与舰炮炮手团"
 STATIC_MODIFIER_DESC_oe_msn_por_m1:0 "远洋星盘测绘与舰载重炮协同赋予葡萄牙无与伦比的跨洋投送能力。"
 STATIC_MODIFIER_NAME_oe_msn_por_m2:0 "印度总督领与香料要塞链"
 STATIC_MODIFIER_DESC_oe_msn_por_m2:0 "从直布罗陀至马六甲的要塞商站锁链将印度洋化为葡萄牙内海。"
 STATIC_MODIFIER_NAME_oe_msn_por_m3:0 "里斯本印度院与跨洋香料专卖"
 STATIC_MODIFIER_DESC_oe_msn_por_m3:0 "胡椒、丁香、肉豆蔻与瓷器尽归里斯本港清算，小国岁入堪比巨帝。"
 STATIC_MODIFIER_NAME_oe_msn_por_m4:0 "双洋香料与航海帝国终极天命"
 STATIC_MODIFIER_DESC_oe_msn_por_m4:0 "凭卡拉维尔帆船、舰炮威慑与全球商站网络，葡萄牙永耀航海史册。"
 oe_msn_por_01_lisbon_porto:0 "里斯本与波尔图：大西洋起航"
 oe_msn_por_01_lisbon_porto_desc:0 "背靠特茹河宽阔河口与杜罗河峭壁，里斯本与波尔图正迎着圣文森特角外的大西洋季风扬帆待发。扩建王家码头可厚植[navy_tradition|e]与[maritime_presence|e]，为[capital|e]水手与[sailors|e]开启远洋壮游。"
 oe_msn_por_01_lisbon_porto_req_tt:0 "拥有里斯本与波尔图，稳定度至少为5，拥有港口并建成一处码头。"
 oe_msn_por_02_caravel_bombardeiros:0 "卡拉维尔帆船与舰载重炮团"
 oe_msn_por_02_caravel_bombardeiros_desc:0 "三角帆卡拉维尔轻船逆风劈浪探向未知非陆海岸，而圆帆重炮战舰则在舷侧列装里斯本铸造的青铜巨炮。将航海技艺与舰炮火力合璧，把[gold|e]与[buildings|e]投入化为所向披靡的[navy|e]与[navy_tradition|e]。"
 oe_msn_por_02_caravel_bombardeiros_req_tt:0 "处于文艺复兴时代或之后，拥有里斯本，国库至少200金币、海军传统至少20，并建成船坞或火炮作坊。"
 oe_msn_por_03_ordenancas_militia:0 "海外要塞团与民兵征召令"
 oe_msn_por_03_ordenancas_militia_desc:0 "小国欲守跨越大洋的星罗要塞，非靠严密兵制不可；王室民兵征召令将全国教区编入火枪长矛常训体系。接纳远洋[institutions|e]既深挖本土[manpower|e]，又为海外据点输送精干[regulars|e]并提振[army_tradition|e]。"
 oe_msn_por_03_ordenancas_militia_req_tt:0 "处于大发现时代或之后，拥有里斯本，建成练兵场或军械库并接纳新大陆思潮。"
 oe_msn_por_04_colonial_governors:0 "印度总督府与武装通行证制"
 oe_msn_por_04_colonial_governors_desc:0 "凭王家训令与武装通行证制度，自莫桑比克、霍尔木兹至果阿的各地总督以国王名义统辖印度洋往来商船。严密的[cabinet|e]督导把全球[institutions|e]化为跨海[control|e]，将帝国远洋[trade|e]收益推至极限。"
 oe_msn_por_04_colonial_governors_req_tt:0 "处于宗教改革时代或之后，拥有里斯本，稳定度至少为15，建成港务局或海关并接纳全球贸易思潮。"
 oe_msn_por_05_ceuta_gateway:0 "非洲第一锚：攻占休达"
 oe_msn_por_05_ceuta_gateway_desc:0 "1415年阿维什王朝旌旗下克复的休达，既扼守直布罗陀海峡咽喉，又揭开撒哈拉黄金商路，点燃亨利王子南航之志。稳固北非[core|e]与海峡[fort|e]，既扩大[maritime_presence|e]，又为王室赢得显赫[prestige|e]。"
 oe_msn_por_05_ceuta_gateway_req_tt:0 "直接或通过属国控制休达，且至少拥有4座港口。"
 oe_msn_por_06_cape_voyage:0 "绕过好望角：开辟印度洋航线"
 oe_msn_por_06_cape_voyage_desc:0 "追随迪亚士与达·伽马绕过风暴迭起的好望角，葡萄牙星盘与季风领航术彻底击碎了旧陆路对东方香料的垄断。驾驭大洋环流彰显无双[navy_tradition|e]与举世[prestige|e]，引领[sailors|e]开辟印度洋[trade|e]新纪元。"
 oe_msn_por_06_cape_voyage_req_tt:0 "处于大发现时代或之后，拥有里斯本并控制休达，海军传统至少为28，并建成一座干船坞。"
 oe_msn_por_07_goa_kozhikode:0 "第乌胜局与果阿总督府"
 oe_msn_por_07_goa_kozhikode_desc:0 "第乌海战大捷与阿尔布克尔克攻占果阿，在盛产胡椒的马拉巴尔海岸立起了重兵扼守的东方总督府。坐镇印度[core|e]港埠既稳固远洋[navy|e]母港，又改写东方[market|e]流向，为王室聚敛滚滚[gold|e]。"
 oe_msn_por_07_goa_kozhikode_req_tt:0 "控制果阿或卡利卡特（或拥有里斯本），控制至少25处地点且拥有至少8座港口。"
 oe_msn_por_08_malacca_ternate:0 "东方咽喉：马六甲与香料群岛"
 oe_msn_por_08_malacca_ternate_desc:0 "「掌控马六甲者，便扼住了威尼斯的咽喉」；越过海峡更是丁香满岛的特尔纳特与通往远东丝瓷的航道。执掌东方海门使[maritime_presence|e]达于极盛，牢锁香料[trade|e]并汇聚惊世[gold|e]与[prestige|e]。"
 oe_msn_por_08_malacca_ternate_req_tt:0 "处于宗教改革时代或之后，控制马六甲、特尔纳特或果阿，且海军传统至少为35。"
 oe_msn_por_09_porto_wine_gold:0 "波尔图商港与大西洋群岛农产"
 oe_msn_por_09_porto_wine_gold_desc:0 "杜罗河梯田酒庄、马德拉蔗糖工场与亚速尔粮仓彼此呼应，将葡萄牙本土与大西洋群岛织成丰饶商贸后盾。兴旺的[market|e]出口惠及各[estates|e]，全面推升港城[prosperity|e]并稳固王室[gold|e]税基。"
 oe_msn_por_09_porto_wine_gold_req_tt:0 "拥有里斯本与波尔图，国库至少300金币、月度贸易与税收至少20，并建成一座市场。"
 oe_msn_por_10_casa_da_india:0 "里斯本印度院：全球香料清算港"
 oe_msn_por_10_casa_da_india_desc:0 "屹立王宫广场旁的印度院，逐箱查验印度大帆船队运回的胡椒、肉桂、青花瓷与巴西蔗糖，统筹全球转口。将跨洋[trade|e]尽数汇聚[capital|e]商贸[buildings|e]，令里斯本跃升为欧陆璀璨的[development|e]明珠。"
 oe_msn_por_10_casa_da_india_req_tt:0 "处于大发现时代或之后，拥有里斯本，国库至少450金币、月收至少35，并建成贸易枢纽或商贾街区。"
 oe_msn_por_11_pombaline_renewal:0 "里斯本近代重构与启蒙商政"
 oe_msn_por_11_pombaline_renewal_desc:0 "宽阔规整的抗震街区、特许酒业公司与世俗大学革新，以蓬巴尔式理性商政重塑里斯本近代筋骨。果断的[cabinet|e]整顿强化[crown_power|e]并提振[estate_satisfaction|e]，为王国科技[advances|e]扫清藩篱。"
 oe_msn_por_11_pombaline_renewal_req_tt:0 "处于宗教改革时代或之后，拥有里斯本，稳定度至少为15、首都发展度至少为28，且市民满意度至少为55%。"
 oe_msn_por_12_oceanic_spice_empire:0 "印度洋—大西洋双洋香料帝国天命"
 oe_msn_por_12_oceanic_spice_empire_desc:0 "浑天仪徽记高悬于大西洋岸、非洲要塞与东方香料商港之上，葡萄牙缔造了无可撼动的双洋海洋霸业。荣登[great_power|e]之列，王冠将无敌[navy|e]、全球[trade|e]与跨海[maritime_presence|e]融为不朽传奇。"
 oe_msn_por_12_oceanic_spice_empire_req_tt:0 "处于专制时代或之后，拥有里斯本并控制休达，稳定度至少为15，建成证券交易所或造船厂，且位列列强或月收至少70。"
 oe_msn_hab_destiny:0 "#bold #color_yellow 双头鹰与多瑙帝冠：奥地利天命#!#!"
 oe_msn_hab_destiny_DESCRIPTION:0 "自阿尔卑斯家产至波匈联姻、两帝之争与开明专制"
 oe_msn_hab_destiny_CRITERIA_DESCRIPTION:0 "巩固维也纳家产、联合布拉格与布达、打造军事边疆并成就中欧超级帝国"
 oe_msn_hab_destiny_BUTTON_TOOLTIP:0 "开启奥地利天命"
 oe_msn_hab_destiny_BUTTON_DETAILS:0 "衔接两帝之争（oe_twe_）：从阿尔卑斯山地家产与维也纳起家，以联姻外交囊括波希米亚与匈牙利王冠，凭军事边疆与维也纳宫廷乐章铸就中欧多瑙河帝国。"
 STATIC_MODIFIER_NAME_oe_msn_hab_m1:0 "哈布斯堡联姻外交与宫廷枢密院"
 STATIC_MODIFIER_DESC_oe_msn_hab_m1:0 "巧借联姻盟约与帝国枢密院统筹中欧诸侯，外交互信独步天下。"
 STATIC_MODIFIER_NAME_oe_msn_hab_m2:0 "多瑙河三冠与军事边疆铁壁"
 STATIC_MODIFIER_DESC_oe_msn_hab_m2:0 "维也纳、布拉格与布达合璧，加上常备边疆军镇令中欧固若金汤。"
 STATIC_MODIFIER_NAME_oe_msn_hab_m3:0 "维也纳启蒙工业与官房学派"
 STATIC_MODIFIER_DESC_oe_msn_hab_m3:0 "推行开明专制、全民初等教育与国家工场建设，释放多瑙盆地惊人潜能。"
 STATIC_MODIFIER_NAME_oe_msn_hab_m4:0 "多瑙河超级帝国：开明双头鹰天命"
 STATIC_MODIFIER_DESC_oe_msn_hab_m4:0 "以联姻正统、常备军制与开明专制统御中欧，令维也纳荣耀冠绝时代。"
 oe_msn_hab_01_vienna_alpine:0 "阿尔卑斯家产：稳固维也纳"
 oe_msn_hab_01_vienna_alpine_desc:0 "雄踞多瑙河上游与阿尔卑斯南北山口，哈布斯堡世袭领地正是撬动中欧版图的天然拱心石。修缮维也纳城防商贸[buildings|e]、提振[capital|e]的[development|e]并稳固家族[stability|e]，将为奥地利大公执掌波希米亚与多瑙河诸王冠奠定牢不可破的腹地基石。"
 oe_msn_hab_01_vienna_alpine_req_tt:0 "拥有维也纳，稳定度不低于 5，首都发展度不低于 16，且建有城堡或市场。"
 oe_msn_hab_02_marriage_diplomacy:0 "幸运奥地利：王室联姻外交网"
 oe_msn_hab_02_marriage_diplomacy_desc:0 "他国以兵戈争胜，唯幸运奥地利以联姻缔盟将中欧王冠徐徐揽入怀中。精心经营[diplomatic_reputation|e]、拓展忠诚藩邦[subjects|e]并深结贵族[estate_satisfaction|e]，必将使维也纳的[diplomacy|e]网络与王朝[prestige|e]遍及基督教世界诸王廷，事半功倍地成就不世霸业。"
 oe_msn_hab_02_marriage_diplomacy_req_tt:0 "拥有维也纳，稳定度不低于 10，且拥有至少 2 个附庸或贵族阶层满意度不低于 55%。"
 oe_msn_hab_03_military_frontier:0 "军事边疆常备军与山地精兵"
 oe_msn_hab_03_military_frontier_desc:0 "在东南前线的河谷险隘，享有免税土地特权的军事边疆屯田兵长年守望烽火、严阵以待。依托坚实边防[buildings|e]与百战山地精兵提升[army_tradition|e]与[manpower|e]，不仅将哈布斯堡[army|e]锻造成多瑙河流域坚不可摧的钢铁壁垒，更令维也纳随时拥有反攻中欧的精锐利剑。"
 oe_msn_hab_03_military_frontier_req_tt:0 "拥有维也纳，国库不少于 250 金币，处于地理大发现或更晚时代，且陆军传统不低于 22 或建有练兵场/城堡。"
 oe_msn_hab_04_aulic_chancery:0 "维也纳宫廷枢密院与帝国统合"
 oe_msn_hab_04_aulic_chancery_desc:0 "欲将德意志公国、波希米亚等级会议与匈牙利诸郡凝聚为有机整体，绝不能单靠共同的王室姓氏维系。设立维也纳宫廷枢密院并强化[cabinet|e]行政、[crown_power|e]与跨区[control|e]之际，哈布斯堡朝廷必须直面多瑙帝国的百年命题：究竟推行中央集权，抑或缔结诸王领联邦宪章？"
 oe_msn_hab_04_aulic_chancery_req_tt:0 "拥有维也纳，处于宗教改革或更晚时代，拥有至少 35 处地点，且月商税收入不低于 36 或拥有至少 3 个附庸。"
 oe_msn_hab_05_bohemian_crown:0 "圣瓦茨拉夫王冠：统合布拉格"
 oe_msn_hab_05_bohemian_crown_desc:0 "将圣瓦茨拉夫王冠与维也纳合二为一，便把波希米亚富甲中欧的银矿、玻璃工坊与布拉格古老大学尽收双头鹰羽翼之下。将布拉格化为稳固[core|e]或忠诚王领，既可大幅抬升帝国[development|e]与[gold|e]财源，更令哈布斯堡在神圣罗马帝国的[legitimacy|e]无可撼动。"
 oe_msn_hab_05_bohemian_crown_req_tt:0 "直辖或由非主权附庸掌控布拉格。"
 oe_msn_hab_06_hungarian_crown:0 "圣斯蒂芬王冠：联结布达与布拉迪斯拉发"
 oe_msn_hab_06_hungarian_crown_desc:0 "承继圣斯蒂芬神圣王冠，将维也纳的战略纵深与农牧腹地一路拓展至整个喀尔巴阡盆地。无论直辖布达与布拉迪斯拉发为坚实[core|e]，抑或借匈牙利总督[subjects|e]协力镇抚，都能为奥地利注入雄厚[manpower|e]并牢牢掌握中游多瑙河的[control|e]。"
 oe_msn_hab_06_hungarian_crown_req_tt:0 "直辖或由非主权附庸掌控布达或布拉迪斯拉发，且统辖匈牙利自治领/总督领附庸或拥有至少 28 处地点。"
 oe_msn_hab_07_italian_foothold:0 "翻越阿尔卑斯：米兰或亚得里亚海口"
 oe_msn_hab_07_italian_foothold_desc:0 "翻越布伦纳与喀斯特山口南抵伦巴第名城米兰或亚得里亚海港，彻底打破了奥地利深居内陆的地理局限。将亚平宁与海口要地确立为[core|e]支点，不仅令维也纳直接接入繁华的地中海[trade|e]与银号[gold|e]，更让哈布斯堡[diplomacy|e]纵横德意两界。"
 oe_msn_hab_07_italian_foothold_req_tt:0 "直辖或由非主权附庸掌控米兰或扎达尔（或拥有维也纳），至少 40 处地点，且拥有至少 3 处港口或月商税收入不低于 32。"
 oe_msn_hab_08_two_emperors_arbiter:0 "两帝之争：中欧帝国威权巅峰"
 oe_msn_hab_08_two_emperors_arbiter_desc:0 "西抗西欧强权之锋芒，东应巴尔干与东方巨帝之角逐，维也纳双头鹰在群雄环伺中屹立不倒，成为维系欧洲均势的中流砥柱。昂首挺立于世界[great_power|e]前列，不仅令哈布斯堡的[prestige|e]与[diplomatic_reputation|e]响彻欧陆，更彰显无可争议的帝国[legitimacy|e]。"
 oe_msn_hab_08_two_emperors_arbiter_req_tt:0 "拥有维也纳，直辖或由非主权附庸掌控布拉格，拥有至少 45 处地点且位列世界列强。"
 oe_msn_hab_09_alpine_trade_mines:0 "阿尔卑斯山口商路与蒂罗尔银矿"
 oe_msn_hab_09_alpine_trade_mines_desc:0 "蒂罗尔施瓦茨银矿开采出的滚滚白银，同穿行阿尔卑斯山口的南北商队税卡交相呼应，支撑起哈布斯堡驰骋欧洲的使团与雄师。兴建账房与市场[buildings|e]、稳住市民[estate_satisfaction|e]，既可激活维也纳[market|e]信贷活力，又让皇家财政署常年[gold|e]充裕。"
 oe_msn_hab_09_alpine_trade_mines_req_tt:0 "拥有维也纳，国库不少于 350 金币，月商税收入不低于 24，且建有账房或市场。"
 oe_msn_hab_10_baroque_vienna:0 "巴洛克维也纳：宫廷音乐与建筑"
 oe_msn_hab_10_baroque_vienna_desc:0 "恢弘壮丽的美泉宫式巴洛克宫阙、金碧辉煌的音乐厅与皇室乐团赞助，将昔日边防要塞维也纳蜕变为全欧景仰的音乐与建筑之都。广兴艺文[buildings|e]不仅大幅推升[capital|e]的[development|e]与[cultural_tradition|e]，更以璀璨[prestige|e]吸引欧陆名匠与使节云集多瑙河畔。"
 oe_msn_hab_10_baroque_vienna_req_tt:0 "拥有维也纳，处于地理大发现或更晚时代，且建有艺术学校/剧院或首都发展度不低于 24。"
 oe_msn_hab_11_enlightened_industry:0 "开明专制与多瑙河国营工场"
 oe_msn_hab_11_enlightened_industry_desc:0 "在重商开明改革家的辅佐下，维也纳宫廷轻减农奴苛役、广兴初等学堂，并大力扶持波希米亚纺织与施蒂利亚钢铁工场。吸纳近世[institutions|e]并扩建学府工坊[buildings|e]，既可全面拉升臣民[literacy|e]与科技[advances|e]，更为多瑙河诸王领带来源远流长的[prosperity|e]。"
 oe_msn_hab_11_enlightened_industry_req_tt:0 "拥有维也纳，稳定度不低于 18，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有大学/织布工坊。"
 oe_msn_hab_12_danubian_super_empire:0 "多瑙河超级帝国：双头鹰不朽天命"
 oe_msn_hab_12_danubian_super_empire_desc:0 "维也纳、布拉格与布达三都辉映，将开明政务、巴洛克盛华与近代常备雄师熔铸为称霸中欧的多瑙河超级帝国。作为傲视欧陆的头等[great_power|e]，凭借雄厚[capital|e][development|e]、坚实[stability|e]与无上[prestige|e]，双头鹰将在帝国盛典上定鼎近世百年的不朽宪制。"
 oe_msn_hab_12_danubian_super_empire_req_tt:0 "完成三条支线，拥有维也纳，直辖或由附庸掌控布拉格与布达，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 30。"
 oe_msn_swe_destiny:0 "#bold #color_yellow 北方雄狮与波罗的内湖：瑞典天命#!#!"
 oe_msn_swe_destiny_DESCRIPTION:0 "自瓦萨独立至波罗的海内湖与军事革命"
 oe_msn_swe_destiny_CRITERIA_DESCRIPTION:0 "打破卡尔马束缚、控扼塔林里加与海峡、引领火枪轻炮革命并称雄波罗的海"
 oe_msn_swe_destiny_BUTTON_TOOLTIP:0 "开启瑞典天命"
 oe_msn_swe_destiny_BUTTON_DETAILS:0 "以北欧精兵撬动全欧格局：从斯德哥尔摩、卡尔马与奥博独立起兵，依托法伦铜矿与瓦萨中央财政打造步炮协同的近代军事革命，将波罗的海化为瑞典内湖。"
 STATIC_MODIFIER_NAME_oe_msn_swe_m1:0 "古斯塔夫步炮协同军事革命"
 STATIC_MODIFIER_DESC_oe_msn_swe_m1:0 "轻便野战铜炮、齐射火枪线列与突击骑兵铸就近代欧洲最强野战军。"
 STATIC_MODIFIER_NAME_oe_msn_swe_m2:0 "波罗的海内湖战略霸权"
 STATIC_MODIFIER_DESC_oe_msn_swe_m2:0 "环绕塔林、纳尔瓦、里加与松德海峡的海陆据点将波罗的海锁为内湖。"
 STATIC_MODIFIER_NAME_oe_msn_swe_m3:0 "瑞典精钢、铜币与皇家邮政"
 STATIC_MODIFIER_DESC_oe_msn_swe_m3:0 "法伦大铜山、高品质铁矿与近代邮政制度令北欧王国岁入丰沛、政令如风。"
 STATIC_MODIFIER_NAME_oe_msn_swe_m4:0 "北方雄狮不朽天命"
 STATIC_MODIFIER_DESC_oe_msn_swe_m4:0 "凭无双纪律、波罗的海关税与精钢工业，瑞典雄视中北欧数百年。"
 oe_msn_swe_01_stockholm_kalmar:0 "打破卡尔马：稳固斯德哥尔摩与卡尔马"
 oe_msn_swe_01_stockholm_kalmar_desc:0 "挣脱卡尔马同盟羁绊后，三王冠旗帜重升斯德哥尔摩群岛与南疆要塞卡尔马，宣告瑞典主权独立。稳固水城[capital|e]不仅确立王室[legitimacy|e]，更凝聚自由农[estates|e]并夯实海岸[control|e]。"
 oe_msn_swe_01_stockholm_kalmar_req_tt:0 "拥有斯德哥尔摩，直接或通过属国控制卡尔马，稳定度至少为5，拥有港口并建成一座城堡。"
 oe_msn_swe_02_vasa_central_fisc:0 "瓦萨王朝中央财政与分兵制"
 oe_msn_swe_02_vasa_central_fisc_desc:0 "瓦萨王室的税务官逐户清查田产矿山，同时推行分兵制由乡里共同供养本土常备兵团，免受外籍雇佣兵掣肘。强化[crown_power|e]既确保稳定[manpower|e]，又锤炼[army_tradition|e]并令王国[gold|e]收支井然。"
 oe_msn_swe_02_vasa_central_fisc_req_tt:0 "拥有斯德哥尔摩，稳定度至少为10、陆军传统至少15，且农民阶层满意度至少为45%。"
 oe_msn_swe_03_salvo_regimental_guns:0 "新教军事革命：齐射火枪与轻炮"
 oe_msn_swe_03_salvo_regimental_guns_desc:0 "以浅纵深旅阵、排枪齐射与三磅团属轻炮取代笨重方阵，瑞典在欧陆战场上掀起了诸兵种协同的军事革命。接纳前沿[institutions|e]让严训[regulars|e]化为锋利[army|e]，在历次鏖战中不断推高[army_tradition|e]。"
 oe_msn_swe_03_salvo_regimental_guns_req_tt:0 "处于宗教改革时代或之后，拥有斯德哥尔摩，国库至少220金币，建成兵营或火炮作坊并接纳火炮思潮。"
 oe_msn_swe_04_carolean_absolutism:0 "卡罗林精兵与近代行政集权"
 oe_msn_swe_04_carolean_absolutism_desc:0 "借收回贵族采邑与卡罗林精兵冷峻决绝的「勇往直前」突击战术，瑞典王权缔造了令全欧敬畏的行政与军纪。将高效[cabinet|e]与[crown_power|e]合而为一，既守稳[stability|e]，更铸就钢铁般的[regulars|e]军魂。"
 oe_msn_swe_04_carolean_absolutism_req_tt:0 "处于宗教改革时代或之后，拥有斯德哥尔摩，稳定度至少为15、陆军传统至少35，且首都发展度至少为22。"
 oe_msn_swe_05_abo_finland_gulf:0 "东渡芬兰湾：稳固奥博"
 oe_msn_swe_05_abo_finland_gulf_desc:0 "跨越星罗棋布的奥兰群岛，奥博古堡与教区稳稳支撑着王国东翼，并为王师输送骁勇善战的芬兰轻骑。深耕芬兰[core|e]领土不仅护佑海湾[maritime_presence|e]，更充实[manpower|e]并延展王室[control|e]。"
 oe_msn_swe_05_abo_finland_gulf_req_tt:0 "直接或通过属国控制奥博，并在国内拥有至少一处码头。"
 oe_msn_swe_06_estonia_tallinn_narva:0 "波罗的海东岸：塔林与纳尔瓦"
 oe_msn_swe_06_estonia_tallinn_narva_desc:0 "控制塔林石灰岩城墙与纳尔瓦河口要塞，便将东波罗的海毛皮、亚麻与罗斯木材商道尽数纳入瑞典关船巡护。稳握东岸[core|e]与边防[fort|e]，在提升[navy_tradition|e]之际牢牢掌控北方[trade|e]咽喉。"
 oe_msn_swe_06_estonia_tallinn_narva_req_tt:0 "直接或通过属国控制塔林或纳尔瓦，且至少拥有5座港口。"
 oe_msn_swe_07_livonia_riga:0 "利沃尼亚明珠：掌控里加港"
 oe_msn_swe_07_livonia_riga_desc:0 "当里加商绅向斯德哥尔摩宣誓效忠，这座瑞典王冠下最繁华的巨港便为道加瓦河每艘商驳征收丰厚关税。收编利沃尼亚[core|e]不仅充盈[gold|e]与波罗的海[market|e]份额，更令帝国港市[prosperity|e]倍增。"
 oe_msn_swe_07_livonia_riga_req_tt:0 "直接或通过属国控制里加，且陆军传统至少为22。"
 oe_msn_swe_08_sound_copenhagen:0 "松德海峡锁钥：哥本哈根或环海霸权"
 oe_msn_swe_08_sound_copenhagen_desc:0 "或踏冰奇袭海峡，或尽收东岸名港，瑞典一举打破松德海峡关税枷锁，真正铸成「波罗的海霸权」。纵横北欧海道令王家[navy|e]与[maritime_presence|e]独步一方，赢得无上[prestige|e]与自由[trade|e]。"
 oe_msn_swe_08_sound_copenhagen_req_tt:0 "直接或通过属国控制哥本哈根或里加，且至少拥有8座港口。"
 oe_msn_swe_09_falun_copper_coins:0 "法伦大铜山与瑞典铜币财源"
 oe_msn_swe_09_falun_copper_coins_desc:0 "供应全欧三分之二铜产的法伦大铜山，是瑞典军费、阿姆斯特丹信贷与王家大铜板铸币的坚强支柱。借特许[market|e]统筹矿产出口可稳控[inflation|e]、积蓄[gold|e]，并带动矿镇与港埠[prosperity|e]。"
 oe_msn_swe_09_falun_copper_coins_req_tt:0 "拥有斯德哥尔摩，国库至少300金币、月度贸易与税收至少20，并建成一座市场。"
 oe_msn_swe_10_swedish_steel_post:0 "瑞典精钢工场与皇家邮政网"
 oe_msn_swe_10_swedish_steel_post_desc:0 "瓦隆铁匠在贝里斯拉根炼出全欧最纯净的熟铁与铜炮，而奥克森谢纳设立的皇家邮政让王命踏雪越海瞬息即达。兴建工商业[buildings|e]同步强化[control|e]与[trade|e]，推动首都的[development|e]节节攀升。"
 oe_msn_swe_10_swedish_steel_post_req_tt:0 "处于大发现时代或之后，拥有斯德哥尔摩，月收至少30，并建成贸易枢纽或武器行会。"
 oe_msn_swe_11_polhem_mechanical_age:0 "北方工程启蒙与皇家科学院"
 oe_msn_swe_11_polhem_mechanical_age_desc:0 "自乌普萨拉学府到波尔海姆机械工坊与皇家科学院，瑞典格致之学将水力、冶金与博物尽化作富强之道。高企的[literacy|e]与前沿[institutions|e]合力催生科技[advances|e]，更令北方[cultural_tradition|e]熠熠生辉。"
 oe_msn_swe_11_polhem_mechanical_age_req_tt:0 "处于宗教改革时代或之后，拥有斯德哥尔摩，稳定度至少为15，建成大学或活字印刷工坊并接纳印刷术思潮。"
 oe_msn_swe_12_lion_of_the_north:0 "北方雄狮：波罗的海内湖大帝国"
 oe_msn_swe_12_lion_of_the_north_desc:0 "没有波尔塔瓦的折戟沉沙：铁厂林立、要塞环峙、精兵枕戈，整片波罗的海已化作瑞典王冠的湛蓝内湖。巍然跻身[great_power|e]，北方雄狮以铁血[army|e]、强盛[navy|e]与赫赫[diplomatic_reputation|e]震慑全欧。"
 oe_msn_swe_12_lion_of_the_north_req_tt:0 "处于专制时代或之后，拥有斯德哥尔摩并控制卡尔马与里加，稳定度至少为15，建成铸铁厂或星形堡垒，且位列列强或月收至少65。"
 oe_msn_tim_destiny:0 "#bold #color_yellow 河中星辰与火药巨帝：帖木儿天命#!#!"
 oe_msn_tim_destiny_DESCRIPTION:0 "自撒马尔罕河中文艺复兴至横跨波斯、草原与北印"
 oe_msn_tim_destiny_CRITERIA_DESCRIPTION:0 "稳固河中与呼罗珊、兴建兀鲁伯天文台、整合波斯两河并化为定居火药巨帝"
 oe_msn_tim_destiny_BUTTON_TOOLTIP:0 "开启帖木儿天命"
 oe_msn_tim_destiny_BUTTON_DETAILS:0 "衔接 Slot 75 草原火药线：立足撒马尔罕与布哈拉、整顿索尤尔加勒封地、掀起赫拉特与兀鲁伯皇家天文台的帖木儿文艺复兴，进而向波斯、草原或北印缔造火药巨帝。"
 STATIC_MODIFIER_NAME_oe_msn_tim_m1:0 "索尤尔加勒整编与河中铁骑炮阵"
 STATIC_MODIFIER_DESC_oe_msn_tim_m1:0 "将突厥—波斯重骑兵与草原攻城火炮融为一体，攻城野战无往不利。"
 STATIC_MODIFIER_NAME_oe_msn_tim_m2:0 "丝路十字路口：从大不里士至河中"
 STATIC_MODIFIER_DESC_oe_msn_tim_m2:0 "同时扼守河中、呼罗珊与伊朗高原，执掌亚洲腹地最核心的战略高地。"
 STATIC_MODIFIER_NAME_oe_msn_tim_m3:0 "帖木儿文艺复兴与兀鲁伯星表"
 STATIC_MODIFIER_DESC_oe_msn_tim_m3:0 "撒马尔罕天文历算与赫拉特细密画建筑群令伊斯兰学术跃上巅峰。"
 STATIC_MODIFIER_NAME_oe_msn_tim_m4:0 "河中星辰火药巨帝终极天命"
 STATIC_MODIFIER_DESC_oe_msn_tim_m4:0 "超越诸王内讧魔咒，以丝路枢纽、火炮精兵与河中启蒙傲立近世亚洲。"
 oe_msn_tim_01_samarkand_bukhara:0 "河中双璧：撒马尔罕与布哈拉"
 oe_msn_tim_01_samarkand_bukhara_desc:0 "泽拉夫尚河滋养着青瓷穹顶的撒马尔罕与学术圣城布哈拉，铸就帖木儿王朝在河中地区的翡翠摇篮。广建商旅[buildings|e]既令[capital|e]重归兴旺，更推动绿洲[development|e]跃升并光耀王朝[prestige|e]。"
 oe_msn_tim_01_samarkand_bukhara_req_tt:0 "控制撒马尔罕与布哈拉（可经由附庸），稳定度不低于 5，且拥有商队驿站或市场。"
 oe_msn_tim_02_suyurghal_discipline:0 "整顿索尤尔加勒封地与诸王法度"
 oe_msn_tim_02_suyurghal_discipline_desc:0 "世袭的索尤尔加勒封地屡屡诱发帖木儿诸王手足相残，每逢新君即位便令帝国险象环生。整肃宗室与贵族[estates|e]法度既能强化[crown_power|e]，亦可奠定不容置疑的[legitimacy|e]与长久[stability|e]。"
 oe_msn_tim_02_suyurghal_discipline_req_tt:0 "控制撒马尔罕（可经由附庸），稳定度不低于 12，贵族阶层满意度不低于 50%，且拥有城堡或伊斯兰经学院。"
 oe_msn_tim_03_gunpowder_siege_train:0 "河中铸炮与大车火枪兵团"
 oe_msn_tim_03_gunpowder_siege_train_desc:0 "将草原骑射神技与铁链大车阵、青铜长炮及火绳枪手融为一炉，令帖木儿后裔称雄早期火药战场。以充沛[gold|e]推动军工[advances|e]并编练火器[regulars|e]，为帝国淬炼无坚不摧的[army_tradition|e]。"
 oe_msn_tim_03_gunpowder_siege_train_req_tt:0 "大航海时代起，控制撒马尔罕，金币不低于 250，拥有铸炮厂或练兵场，且陆军传统不低于 22 或已解锁长矛与火枪。"
 oe_msn_tim_04_settled_imperial_divan:0 "定居火药大帝国枢密体系"
 oe_msn_tim_04_settled_imperial_divan_desc:0 "将突厥—蒙古军制与波斯文官财税枢密院合而为一，大帝国彻底超越游牧劫掠，从容治理河中至伊朗诸城。接纳近代[institutions|e]既提升[cabinet|e]行政效率，更以严密[control|e]夯实至高[crown_power|e]。"
 oe_msn_tim_04_settled_imperial_divan_req_tt:0 "宗教改革时代起，控制撒马尔罕，自身及附庸地点不少于 40 处，接纳炮兵思潮，且拥有兵营或海关。"
 oe_msn_tim_05_khorasan_herat:0 "呼罗珊明珠：赫拉特与木鹿"
 oe_msn_tim_05_khorasan_herat_desc:0 "沙哈鲁治下的赫拉特绽放为呼罗珊璀璨陪都，古老木鹿则扼守卡拉库姆大漠商道门户。将双璧绿洲确立为稳固[core|e]，既牢控伊朗东境[control|e]，亦借兴盛商队[trade|e]带动城市[development|e]。"
 oe_msn_tim_05_khorasan_herat_req_tt:0 "控制赫拉特与木鹿（可经由附庸），且陆军传统不低于 12。"
 oe_msn_tim_06_persian_gate_tabriz:0 "挥师伊朗：大不里士与伊斯法罕"
 oe_msn_tim_06_persian_gate_tabriz_desc:0 "铁骑西越伊朗高原，挥师进驻伊斯法罕彩釉巴扎或大不里士北疆雄城，重申帖木儿王朝对波斯腹地的宗主权。将西伊朗纳为[core|e]既广充[manpower|e]，更收丝贸[gold|e]并远扬帝国[prestige|e]。"
 oe_msn_tim_06_persian_gate_tabriz_req_tt:0 "控制大不里士或伊斯法罕之一（可经由附庸），且贵族阶层满意度不低于 50%。"
 oe_msn_tim_07_mesopotamia_baghdad:0 "两河威名：夺取巴格达或霍尔木兹"
 oe_msn_tim_07_mesopotamia_baghdad_desc:0 "无论将马尾军旗插上底格里斯河畔巴格达，抑或在霍尔木兹课税印度香料商船，帝国锋芒已直抵暖海。将两河或海湾要津立为[core|e]，使陆路[trade|e]与海洋[market|e]交汇，共铸辽阔疆土的[prosperity|e]。"
 oe_msn_tim_07_mesopotamia_baghdad_req_tt:0 "控制巴格达或霍尔木兹之一（可经由附庸），且陆军传统不低于 18 或商税月收入不低于 40。"
 oe_msn_tim_08_steppe_or_india:0 "北压草原或南下印度：萨莱与德里"
 oe_msn_tim_08_steppe_or_india_desc:0 "帖木儿大帝曾北破钦察草原脱脱迷失、南克印度河畔德里苏丹，令欧亚列国无不仰望撒马尔罕威严。统御群雄[subjects|e]与无敌[army|e]，不仅彰显赫赫[army_tradition|e]，更以[great_power|e]雄风震慑四方。"
 oe_msn_tim_08_steppe_or_india_req_tt:0 "控制德里、新萨莱或撒马尔罕之一，自身及附庸地点不少于 55 处，且为列强或陆军传统不低于 24。"
 oe_msn_tim_09_registan_silk_hub:0 "雷吉斯坦广场与丝路商贸总枢"
 oe_msn_tim_09_registan_silk_hub_desc:0 "六条通衢干道汇集于撒马尔罕雷吉斯坦广场，中原瓷器、印度靛蓝与罗斯貂皮在青金石拱门下昼夜交易。兴筑中亚[market|e][buildings|e]广聚洲际[trade|e]，令撒马尔罕绿洲享尽冠绝天下的[prosperity|e]。"
 oe_msn_tim_09_registan_silk_hub_req_tt:0 "控制撒马尔罕（可经由附庸），金币不低于 350，拥有商队驿站或丝绸行会，且商税月收入不低于 30。"
 oe_msn_tim_10_ulugh_beg_observatory:0 "撒马尔罕星辰：兀鲁伯皇家天文台"
 oe_msn_tim_10_ulugh_beg_observatory_desc:0 "兀鲁伯亲王与学者阿里库什吉于山丘凿刻巨型大理石六分仪，以惊人精度测算恒星年并编成《星表》。兴办皇家学术[buildings|e]既极大提升[literacy|e]与科学[advances|e]，更铸就光耀欧亚的[cultural_tradition|e]。"
 oe_msn_tim_10_ulugh_beg_observatory_req_tt:0 "文艺复兴时代起，控制撒马尔罕，拥有伊斯兰经学院或大学，且首都发展度不低于 22。"
 oe_msn_tim_11_herat_enlightenment:0 "赫拉特书画院与跨洲驿馆"
 oe_msn_tim_11_herat_enlightenment_desc:0 "侯赛因拜卡拉治下，画圣毕扎德与大诗人纳沃伊令察合台与波斯文艺在赫拉特攀至绝巅，远播伊斯坦布尔与阿格拉。借文教[institutions|e]与城市[development|e]，令王朝[diplomatic_reputation|e]与[cultural_tradition|e]享誉天下。"
 oe_msn_tim_11_herat_enlightenment_req_tt:0 "宗教改革时代起，控制赫拉特与撒马尔罕，拥有艺术学院或图书馆，且首都发展度不低于 28。"
 oe_msn_tim_12_timurid_gunpowder_apex:0 "河中星辰火药巨帝天命"
 oe_msn_tim_12_timurid_gunpowder_apex_desc:0 "兼融草原骑射血脉、近代火药武备与伊斯兰世界最璀璨的天文殿堂，帖木儿王室屹立欧亚腹心历久弥坚。凭借[capital|e]极盛[prosperity|e]与崇高[legitimacy|e]，撒马尔罕终以盖世[great_power|e]之威君临天下。"
 oe_msn_tim_12_timurid_gunpowder_apex_req_tt:0 "专制时代起，控制撒马尔罕与赫拉特，稳定度不低于 15，首都发展度不低于 32，且为列强或商税月收入不低于 120。"
 oe_msn_ira_destiny:0 "#bold #color_yellow 伊斯法罕半天下：波斯/伊儿汗天命#!#!"
 oe_msn_ira_destiny_DESCRIPTION:0 "自终结伊儿汗裂土至阿拔斯新军与丝绸帝国"
 oe_msn_ira_destiny_CRITERIA_DESCRIPTION:0 "统一伊朗高原核心、完成阿拔斯古拉姆新军改革、营建伊斯法罕并执掌霍尔木兹"
 oe_msn_ira_destiny_BUTTON_TOOLTIP:0 "开启波斯/伊儿汗天命"
 oe_msn_ira_destiny_BUTTON_DETAILS:0 "严格采用 EU5 1.4.9 实盘伊朗诸雄（IRA/ILK/ABL/ERA/CHB/JAL/INJ/QAR）：终结伊儿汗裂土、在大不里士重振王业、编练阿拔斯一世火枪新军并打造「伊斯法罕半天下」的波斯丝绸与波斯湾霸权。"
 STATIC_MODIFIER_NAME_oe_msn_ira_m1:0 "阿拔斯古拉姆火枪与皇家炮兵"
 STATIC_MODIFIER_DESC_oe_msn_ira_m1:0 "平衡部族骑兵与直属火枪常备军，使波斯陆军在高原与两河所向披靡。"
 STATIC_MODIFIER_NAME_oe_msn_ira_m2:0 "伊朗高原与霍尔木兹霸权"
 STATIC_MODIFIER_DESC_oe_msn_ira_m2:0 "大不里士、伊斯法罕、巴格达与霍尔木兹拱卫不朽伊朗疆土。"
 STATIC_MODIFIER_NAME_oe_msn_ira_m3:0 "伊斯法罕官营丝绸与地毯工场"
 STATIC_MODIFIER_DESC_oe_msn_ira_m3:0 "国家丝绸专卖、坎儿井水利与波斯工艺令伊斯法罕赢得「半天下」美誉。"
 STATIC_MODIFIER_NAME_oe_msn_ira_m4:0 "伊朗高原不朽帝国天命"
 STATIC_MODIFIER_DESC_oe_msn_ira_m4:0 "融波斯文治、古拉姆火力与海陆丝路于一体，重塑不朽伊朗荣光。"
 oe_msn_ira_01_end_ilkhan_strife:0 "终结伊儿汗裂土：稳固波斯核心"
 oe_msn_ira_01_end_ilkhan_strife_desc:0 "不赛因汗陨落后伊儿汗国分崩离析，札剌亦儿、穆扎法尔与土库曼诸部割据混战，唯有重立高原共主方能止戈。修缮商旅[buildings|e]既夯实国内[stability|e]与城邑[development|e]，亦重塑波斯王朝[legitimacy|e]。"
 oe_msn_ira_01_end_ilkhan_strife_req_tt:0 "控制大不里士、设拉子、伊斯法罕、阿尔达比勒或巴格达之一（可经由附庸），稳定度不低于 5，且拥有商队驿站或市场。"
 oe_msn_ira_02_tabriz_awakening:0 "1501 大不里士复兴或伊儿汗重光"
 oe_msn_ira_02_tabriz_awakening_desc:0 "无论效法伊斯玛仪一世于大不里士青穹之下加冕，抑或重光伊朗古冠，阿塞拜疆雄城皆能凝聚全高原归心。将大不里士立为[core|e]既深厚[religious_influence|e]，更壮大[crown_power|e]并赢得教士[estate_satisfaction|e]。"
 oe_msn_ira_02_tabriz_awakening_req_tt:0 "控制大不里士（可经由附庸），稳定度不低于 10，拥有伊斯兰经学院或神庙，且教士阶层满意度不低于 50%。"
 oe_msn_ira_03_abbas_ghulam_corps:0 "阿拔斯一世古拉姆火枪新军"
 oe_msn_ira_03_abbas_ghulam_corps_desc:0 "为破除红头部落尾大不掉之弊并抗衡奥斯曼炮阵，阿拔斯一世组建受薪古拉姆火枪兵团与铸铜炮队。投入充沛[gold|e]汲取军事[advances|e]并编练效忠王室的[regulars|e]，令波斯淬炼崭新[army_tradition|e]。"
 oe_msn_ira_03_abbas_ghulam_corps_req_tt:0 "大航海时代起，控制大不里士、伊斯法罕或设拉子之一，金币不低于 240，拥有练兵场或铸炮厂，且陆军传统不低于 20 或已解锁长矛与火枪。"
 oe_msn_ira_04_nazir_central_court:0 "皇家财政官署与波斯文官革新"
 oe_msn_ira_04_nazir_central_court_desc:0 "将部落封省改置为由皇家财政官署直辖的王领，使沙阿摆脱跋扈军阀掣肘、直掌丰沛税源。融汇波斯文官[cabinet|e]治术与近代[institutions|e]，既强化地方[control|e]，更奠定坚不可摧的[crown_power|e]。"
 oe_msn_ira_04_nazir_central_court_req_tt:0 "宗教改革时代起，控制伊斯法罕或大不里士之一，自身及附庸地点不少于 35 处，接纳全球贸易思潮，且拥有海关或兵营。"
 oe_msn_ira_05_fars_shiraz_isfahan:0 "中南波斯一统：设拉子与伊斯法罕"
 oe_msn_ira_05_fars_shiraz_isfahan_desc:0 "从诗圣哈菲兹吟咏的设拉子柏树花园到扎因代鲁德河畔的伊斯法罕，统合法尔斯与波斯腹地重振伊朗核心。将双城设为[core|e]不仅大幅提振城市[development|e]，亦厚植波斯[cultural_tradition|e]与绵长[prosperity|e]。"
 oe_msn_ira_05_fars_shiraz_isfahan_req_tt:0 "控制设拉子与伊斯法罕（可经由附庸），且贵族阶层满意度不低于 50%。"
 oe_msn_ira_06_khorasan_shield:0 "东方壁垒：克复呼罗珊赫拉特"
 oe_msn_ira_06_khorasan_shield_desc:0 "历代渡过阿姆河的草原征服者无不觊觎赫拉特要道，意图由此直扑马什哈德与波斯腹地。将呼罗珊东境[fort|e]确立为稳固[core|e]，既牢扼河中边防[control|e]，更守护通往中亚的丝路[trade|e]。"
 oe_msn_ira_06_khorasan_shield_req_tt:0 "控制赫拉特（可经由附庸），拥有城堡或商队驿站，且陆军传统不低于 14。"
 oe_msn_ira_07_baghdad_tigris:0 "西望两河：收复巴格达"
 oe_msn_ira_07_baghdad_tigris_desc:0 "挥师西下扎格罗斯山口，收复巴格达与两河圣城，既续泰西封盛世遗韵，亦遏止安纳托利亚强邻东进。将底格里斯沃野纳为[core|e]不仅充实[manpower|e]，更提升[religious_influence|e]并播扬帝国[prestige|e]。"
 oe_msn_ira_07_baghdad_tigris_req_tt:0 "控制巴格达（可经由附庸），且陆军传统不低于 18 或自身及附庸地点不少于 30 处。"
 oe_msn_ira_08_hormuz_gulf_gate:0 "波斯湾锁钥：光复霍尔木兹"
 oe_msn_ira_08_hormuz_gulf_gate_desc:0 "被誉为世界戒环明珠的霍尔木兹海岛要塞，扼守印度胡椒、巴林珍珠与阿拉伯良驹涌入波斯湾的咽喉。光复海峡并确立[core|e]归属，既兴建[maritime_presence|e]与[sailors|e]，更尽揽印度洋[trade|e]厚利。"
 oe_msn_ira_08_hormuz_gulf_gate_req_tt:0 "控制霍尔木兹（可经由附庸），且拥有至少一处港口。"
 oe_msn_ira_09_qanat_irrigation:0 "坎儿井水利与高原绿洲农政"
 oe_msn_ira_09_qanat_irrigation_desc:0 "在炽热的高原荒漠之下，绵延数里的坎儿井暗渠将雪山融水引入果园绿洲、棉田与桑林。拨付国库[gold|e]大兴水利[buildings|e]，既赢得农夫[estate_satisfaction|e]，更令干旱高原焕发绵长[prosperity|e]。"
 oe_msn_ira_09_qanat_irrigation_req_tt:0 "控制伊斯法罕或大不里士之一（可经由附庸），金币不低于 280，拥有引水渠或粮仓，且农民阶层满意度不低于 50%。"
 oe_msn_ira_10_isfahan_silk_carpets:0 "「伊斯法罕半天下」丝绸与波斯毯"
 oe_msn_ira_10_isfahan_silk_carpets_desc:0 "在辽阔的伊玛目广场四周，皇家织造坊精制金丝锦缎与波斯地毯风靡威尼斯与京都，成就「伊斯法罕半天下」盛名。兴建工坊[buildings|e]令[capital|e]气象一新，跃升城市[development|e]并播扬[cultural_tradition|e]。"
 oe_msn_ira_10_isfahan_silk_carpets_req_tt:0 "大航海时代起，控制伊斯法罕，拥有丝绸行会或贸易枢纽，且首都发展度不低于 22。"
 oe_msn_ira_11_improved_silk_road:0 "贯通陆海丝路：波斯转口枢纽"
 oe_msn_ira_11_improved_silk_road_desc:0 "九百座石砌驿站将吉兰生丝与阿巴斯港海关贯通一线，吸引亚美尼亚、印度与欧洲商团云集波斯。以皇家[market|e]专卖配合灵活[diplomacy|e]，既令国库涌入滚滚[gold|e]，亦将货币[inflation|e]稳控于股掌。"
 oe_msn_ira_11_improved_silk_road_req_tt:0 "宗教改革时代起，控制伊斯法罕与霍尔木兹，拥有港务署或海关，且商税月收入不低于 85。"
 oe_msn_ira_12_immortal_iran:0 "伊朗高原不朽帝国天命"
 oe_msn_ira_12_immortal_iran_desc:0 "北起高加索皑皑雪峰、南抵波斯湾碧海涛声，重登万王之王宝座的帝国兼收丝绸、诗篇与近代火炮雄师。凭借[capital|e]绝代[prosperity|e]与不朽[legitimacy|e]，伊朗终以东方[great_power|e]之尊屹立世界。"
 oe_msn_ira_12_immortal_iran_req_tt:0 "专制时代起，控制伊斯法罕、大不里士与霍尔木兹，稳定度不低于 15，首都发展度不低于 30，且为列强或商税月收入不低于 115。"
 oe_msn_dlh_destiny:0 "#bold #color_yellow 孔雀宝座与大干道：德里/莫卧儿天命#!#!"
 oe_msn_dlh_destiny_DESCRIPTION:0 "自恒河平原与曼萨布达尔制至印度次大陆火药巨帝"
 oe_msn_dlh_destiny_CRITERIA_DESCRIPTION:0 "稳固德里阿格拉与拉合尔、革新曼萨布达尔与火炮、囊括古吉拉特孟加拉并主宰次大陆"
 oe_msn_dlh_destiny_BUTTON_TOOLTIP:0 "开启德里/莫卧儿天命"
 oe_msn_dlh_destiny_BUTTON_DETAILS:0 "跨越德里苏丹国与莫卧儿帝国五百年：巩固德里、阿格拉与拉合尔北印心脏，修筑大干道、推行曼萨布达尔与宗教宽容、夺取古吉拉特与孟加拉海港，登临孔雀宝座。"
 STATIC_MODIFIER_NAME_oe_msn_dlh_m1:0 "曼萨布达尔官阶与野战火炮阵"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m1:0 "统一文武品阶与帕尼帕特式火炮车阵令北印帝国军力冠绝南亚。"
 STATIC_MODIFIER_NAME_oe_msn_dlh_m2:0 "双海商港：古吉拉特至孟加拉"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m2:0 "同时掌握西海岸坎贝苏拉特与东海岸孟加拉高尔，总揽南亚双洋财赋。"
 STATIC_MODIFIER_NAME_oe_msn_dlh_m3:0 "大干道棉纺工场与印波文明"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m3:0 "恒河—旁遮普大干道、精细棉布织造与莫卧儿建筑群令次大陆富冠天下。"
 STATIC_MODIFIER_NAME_oe_msn_dlh_m4:0 "印度次大陆孔雀宝座终极天命"
 STATIC_MODIFIER_DESC_oe_msn_dlh_m4:0 "以宗教宽容、巨额棉纺出口与火药大军统御次大陆，铸就东方世界第一富庶帝国。"
 oe_msn_dlh_01_delhi_agra_core:0 "北印心脏：稳固德里与阿格拉"
 oe_msn_dlh_01_delhi_agra_core_desc:0 "执掌亚穆纳河与恒河夹角沃野上的双都德里与阿格拉，便是稳控整个北印度的根本命脉。夯实两都[core|e]地位、广建市场粮仓[buildings|e]并拉升[capital|e]的[development|e]，既可迅捷稳住王朝[stability|e]，更为横扫次大陆聚敛源源不绝的粮赋财源。"
 oe_msn_dlh_01_delhi_agra_core_req_tt:0 "拥有德里或萨尔加德瓦里，稳定度不低于 5，首都发展度不低于 18，且建有市场或粮仓。"
 oe_msn_dlh_02_mansabdar_zamindar:0 "曼萨布达尔与柴明达尔税制"
 oe_msn_dlh_02_mansabdar_zamindar_desc:0 "将精密田亩清丈与按阶定额的曼萨布达尔军政品阶相结合，方能遏止地方军阀尾大不掉之弊。深化对直辖州县与伊克塔[subjects|e]的税籍[control|e]，既可大幅提升朝廷[crown_power|e]并安抚农人[estate_satisfaction|e]，更令广袤恒河平原化作源源输血的帝国财政引擎。"
 oe_msn_dlh_02_mansabdar_zamindar_req_tt:0 "拥有德里，稳定度不低于 10，且统辖德里伊克塔总督附庸、至少 2 个附庸或月商税收入不低于 26。"
 oe_msn_dlh_03_panipat_field_guns:0 "火药野战炮与火绳枪步兵团"
 oe_msn_dlh_03_panipat_field_guns_desc:0 "铁链相连的火炮车阵、呼啸破空的铁壳火箭与齐射火绳枪步兵，在帕尼帕特式的大决战中彻底粉碎了古老战象方阵的神话。积极吸纳火器[advances|e]并兴建兵工[buildings|e]，将把帝国的[army_tradition|e]与[army|e]战力推入近代火药强权之列，威慑德干与全印诸邦。"
 oe_msn_dlh_03_panipat_field_guns_req_tt:0 "拥有德里，国库不少于 260 金币，处于地理大发现或更晚时代，且已研习火药革新、建有铸炮坊/练兵场或陆军传统不低于 24。"
 oe_msn_dlh_04_imperial_toleration:0 "普世和平与帝国法典"
 oe_msn_dlh_04_imperial_toleration_desc:0 "统御数以千万计的印度教、伊斯兰教与多元信仰臣民，仅凭铁血武功难以长治久安。以「普世和平」宽容宏纲平衡多元[estate_satisfaction|e]、夯实国内[stability|e]与王朝[legitimacy|e]之际，德里朝廷必须亲手抉择：究竟奉行中央迪万集权、伊克塔行省联邦，抑或宽容共治的帝国新政？"
 oe_msn_dlh_04_imperial_toleration_req_tt:0 "拥有德里，稳定度不低于 15，处于宗教改革或更晚时代，且齐米阶层满意度不低于 50%（或无此阶层）或已接纳全球贸易思潮。"
 oe_msn_dlh_05_punjab_lahore:0 "五河屏障：控扼拉合尔"
 oe_msn_dlh_05_punjab_lahore_desc:0 "雄踞旁遮普五河沃土、俯瞰开伯尔山口的拉合尔，是印度阻遏中亚铁骑东下南侵的西北铁门。以坚城[fort|e]与百战[army_tradition|e]将拉合尔夯实为稳固[core|e]，既可保恒河腹地安枕无忧，更能牢牢执掌自喀布尔与撒马尔罕南来的商队[trade|e]咽喉。"
 oe_msn_dlh_05_punjab_lahore_req_tt:0 "直辖或由非主权附庸掌控拉合尔，且陆军传统不低于 16 或建有城堡。"
 oe_msn_dlh_06_gujarat_ports:0 "西海明珠：坎贝与苏拉特"
 oe_msn_dlh_06_gujarat_ports_desc:0 "将古吉拉特巨港坎贝与苏拉特收入版图，令内陆起家的德里王朝直通红海朝觐航道、波斯湾商船与欧洲远洋公司。把西海明珠化为稳固[core|e]港埠，既可拓展阿拉伯海[maritime_presence|e]与商贾[estate_satisfaction|e]，更令海量远洋[trade|e]关税日夜涌入帝国国库。"
 oe_msn_dlh_06_gujarat_ports_req_tt:0 "直辖或由非主权附庸掌控坎贝或苏拉特，且拥有至少 6 处港口或月商税收入不低于 28。"
 oe_msn_dlh_07_bengal_gaur:0 "东海粮棉库：克复孟加拉高尔"
 oe_msn_dlh_07_bengal_gaur_desc:0 "素有「万邦乐土」美誉的孟加拉三角洲坐拥一年两熟的稻米良田、轻若蝉翼的细棉织品与巨型柚木造船基地。将高尔纳入帝国[core|e]版图，即可瞬间释放冠绝全球的农工[prosperity|e]与惊人[gold|e]税赋，令德里一举成为当时世界最富庶的制造业巨擘。"
 oe_msn_dlh_07_bengal_gaur_req_tt:0 "直辖或由非主权附庸掌控孟加拉高尔，且月商税收入不低于 32 或建有织布行会/粮仓。"
 oe_msn_dlh_08_padshah_hindustan:0 "印度帕迪沙：统御北印至德干"
 oe_msn_dlh_08_padshah_hindustan_desc:0 "西起拉合尔、东抵孟加拉湾、南望德干高原，一统北印膏腴江山的君主当之无愧加冕印度帕迪沙之尊。作为坐拥磅礴[manpower|e]与深厚行省[control|e]的超级[great_power|e]，德里王朝的[prestige|e]远播四海，与君士坦丁堡、大都并峙于欧亚文明之巅。"
 oe_msn_dlh_08_padshah_hindustan_req_tt:0 "拥有德里，直辖或由非主权附庸掌控拉合尔，拥有至少 55 处地点且位列世界列强。"
 oe_msn_dlh_09_grand_trunk_road:0 "修筑大干道：拉合尔至孟加拉"
 oe_msn_dlh_09_grand_trunk_road_desc:0 "重修绵延数千里的皇家大干道，沿途每隔数里遍植绿荫、掘井立碑并广建石砌官驿，将旁遮普、德里与孟加拉缝合为昼夜奔流的大动脉。完善驿道[buildings|e]既大幅增强朝廷[control|e]，又令全印陆上[trade|e]与城镇[prosperity|e]如雨后春笋般蓬勃兴盛。"
 oe_msn_dlh_09_grand_trunk_road_req_tt:0 "拥有德里，直辖或由非主权附庸掌控拉合尔，国库不少于 350 金币，且建有商队旅舍或市场。"
 oe_msn_dlh_10_fine_textile_looms:0 "印度细棉布与全球白银吸金器"
 oe_msn_dlh_10_fine_textile_looms_desc:0 "质冠天下的印度印花棉布、孟加拉轻纱与上等靛蓝染料，使次大陆成为近世世界经济中无可匹敌的白银吸金器。扩建御用织造与染坊[buildings|e]不仅令本土[market|e]产能腾飞，更凭借冠绝全球的远洋[trade|e]源源不断地将美洲与日本白银化作帝国国库的丰厚[gold|e]。"
 oe_msn_dlh_10_fine_textile_looms_req_tt:0 "拥有德里，处于地理大发现或更晚时代，且建有织布工坊/染料工坊或月商税收入不低于 40。"
 oe_msn_dlh_11_mughal_monuments:0 "印波建筑奇观与帝国法典院"
 oe_msn_dlh_11_mughal_monuments_desc:0 "镶嵌宝石的洁白大理石穹顶、对称绝美的波斯园林与鸿篇巨制的帝国法典院，将德里与阿格拉的印波文化融合铸成不朽奇观。赞助宏伟文教[buildings|e]不仅极大提振[capital|e]的[development|e]、[cultural_tradition|e]与[literacy|e]，更令帝国的璀璨[prestige|e]自伊斯法罕远播至欧陆诸国。"
 oe_msn_dlh_11_mughal_monuments_req_tt:0 "拥有德里与阿格拉，稳定度不低于 15，处于宗教改革或更晚时代，且建有艺术学院/经学院或首都发展度不低于 26。"
 oe_msn_dlh_12_peacock_throne:0 "印度次大陆孔雀宝座终极天命"
 oe_msn_dlh_12_peacock_throne_desc:0 "金顶宝盖下珠光璀璨的孔雀宝座，正俯瞰着大干道畅通、双海织坊轰鸣、火药大军如林的统一北印盛世。作为亚洲最富庶的头等[great_power|e]，凭借[capital|e]巍峨的[development|e]、坚实[stability|e]与震烁欧亚的[prestige|e]，德里宫廷将在登基大典上确立次大陆帝国的永恒命运。"
 oe_msn_dlh_12_peacock_throne_req_tt:0 "完成三条支线，拥有德里，直辖或由附庸掌控拉合尔与高尔，稳定度不低于 15，处于专制或更晚时代，位列世界列强且首都发展度不低于 32。"
 oe_msn_vij_destiny:0 "#bold #color_yellow 胜利之城与南印香料霸主：毗奢耶那伽罗天命#!#!"
 oe_msn_vij_destiny_DESCRIPTION:0 "自栋格珀德拉大坝与纳亚卡军镇至印度洋霸权"
 oe_msn_vij_destiny_CRITERIA_DESCRIPTION:0 "强盛胜利之城、完善纳亚卡制与水利大坝、掌控战马香料港并一统南印德干"
 oe_msn_vij_destiny_BUTTON_TOOLTIP:0 "开启毗奢耶那伽罗天命"
 oe_msn_vij_destiny_BUTTON_DETAILS:0 "以「胜利之城」为南印印度教文艺复兴灯塔：推行纳亚卡（Nayankara）军镇制与大型灌溉水库，控扼果阿与卡利卡特阿拉伯战马香料港，决胜德干并建印度洋舰队。"
 STATIC_MODIFIER_NAME_oe_msn_vij_m1:0 "纳亚卡军镇与德干火器卫队"
 STATIC_MODIFIER_DESC_oe_msn_vij_m1:0 "精锐纳亚卡封疆武将与近代火枪象炮兵团令南印防线无懈可击。"
 STATIC_MODIFIER_NAME_oe_msn_vij_m2:0 "德干与泰米尔一统王权"
 STATIC_MODIFIER_DESC_oe_msn_vij_m2:0 "自比贾布尔、戈尔康达直抵马杜赖与坦贾武尔，全南印同奉胜利之城。"
 STATIC_MODIFIER_NAME_oe_msn_vij_m3:0 "水利大坝、战马商港与南印文艺"
 STATIC_MODIFIER_DESC_oe_msn_vij_m3:0 "巨型灌溉水库、马拉巴尔香料港与卡纳提克文艺令南印富庶昌明。"
 STATIC_MODIFIER_NAME_oe_msn_vij_m4:0 "印度教文艺复兴与印度洋大帝国天命"
 STATIC_MODIFIER_DESC_oe_msn_vij_m4:0 "粉碎塔利科塔劫难，以水利农政、双海香料与常备火炮称雄南亚与印度洋。"
 oe_msn_vij_01_city_of_victory:0 "胜利之城崛起：稳固毗奢耶那伽罗"
 oe_msn_vij_01_city_of_victory_desc:0 "巍然屹立于通加巴德拉河花岗岩峡谷间的亨比古城，正是桑伽马王朝坚不可摧的[capital|e]与南印[prestige|e]丰碑。以层叠[fort|e]石城拱卫圣庙王宫，方能在德干强邻环伺下稳固帝国初基与[stability|e]。"
 oe_msn_vij_01_city_of_victory_req_tt:0 "拥有毗奢耶那伽罗，稳定度至少 5，并拥有城堡或神庙。"
 oe_msn_vij_02_nayankara_system:0 "纳亚卡军镇与王室督查法度"
 oe_msn_vij_02_nayankara_system_desc:0 "以王室督查法度分封纳亚卡军镇采邑，既令各地军阀尽忠王座而强化[crown_power|e]，又保障战时[manpower|e]源源不绝。明定军役与赋税规章可维持良好的[estate_satisfaction|e]，并持续砥砺南印诸镇[army_tradition|e]。"
 oe_msn_vij_02_nayankara_system_req_tt:0 "拥有毗奢耶那伽罗，稳定度至少 10，且贵族阶层满意度至少 50%（若有）。"
 oe_msn_vij_03_arabian_horse_cavalry:0 "阿拉伯战马与克里希纳德瓦拉亚精军"
 oe_msn_vij_03_arabian_horse_cavalry_desc:0 "自马拉巴尔码头重金[gold|e]购入的波斯与阿拉伯骏马，为帝国[army|e]锻造出与战象弓弩协同驰骋的铁甲骑兵。牢控西海战马[trade|e]补给线，便能使王室[regulars|e]在德干与奥里萨平原占尽机动力先机。"
 oe_msn_vij_03_arabian_horse_cavalry_req_tt:0 "直接或通过属国控制果阿、卡利卡特或拥有毗奢耶那伽罗，持有至少 250 金币与 15 陆军传统，并拥有兵器行会或码头。"
 oe_msn_vij_04_royal_code_integration:0 "多语王室法典与南印融合"
 oe_msn_vij_04_royal_code_integration_desc:0 "秉承克里希纳德瓦拉亚的治世方略，多语[cabinet|e]以公正法度统筹卡纳达、泰卢固与泰米尔诸省，倍增王权[legitimacy|e]。融汇近代财政[institutions|e]之后，自克里希纳河至科摩林角的行省[control|e]皆如臂使指。"
 oe_msn_vij_04_royal_code_integration_req_tt:0 "宗教改革时代或之后，拥有毗奢耶那伽罗，稳定度至少 15、首都发展度至少 30，并接纳银行业思潮或解锁火炮进阶。"
 oe_msn_vij_05_malabar_spice_ports:0 "西海香料门户：果阿与卡利卡特"
 oe_msn_vij_05_malabar_spice_ports_desc:0 "黑胡椒、豆蔻与阿拉伯骏马尽聚于果阿与卡利卡特的椰林海港，使马拉巴尔海岸成为帝国西翼[trade|e]的黄金[core|e]。牢控西海门户既可引万国白银涌入[market|e]，更能将[maritime_presence|e]推向辽阔阿拉伯海。"
 oe_msn_vij_05_malabar_spice_ports_req_tt:0 "直接或通过属国控制果阿或卡利卡特之一，并拥有至少一座海港。"
 oe_msn_vij_06_tamil_coromandel:0 "科罗曼德尔与朱罗古地：马杜赖与坦贾武尔"
 oe_msn_vij_06_tamil_coromandel_desc:0 "收复朱罗与潘地亚古都坦贾武尔与马杜赖，使富庶的科罗曼德尔棉稻沃野化作帝国东翼[core|e]与[prosperity|e]之源。扶植泰米尔商帮与匠作可加速沿海[development|e]，令帝国[cultural_tradition|e]辉映孟加拉湾。"
 oe_msn_vij_06_tamil_coromandel_req_tt:0 "直接或通过非主权属国同时控制马杜赖与坦贾武尔。"
 oe_msn_vij_07_deccan_triumph:0 "决胜德干高原：比贾布尔与戈尔康达"
 oe_msn_vij_07_deccan_triumph_desc:0 "击破德干联军并跨过赖丘尔沃野，将野猪王旗插上比贾布尔与戈尔康达的玄武岩名城，尽显无双[army_tradition|e]。夺取钻石宝地作为北疆[core|e]，从此肃清北患，令帝国[prestige|e]与高原[control|e]威震全印。"
 oe_msn_vij_07_deccan_triumph_req_tt:0 "直接或通过属国控制比贾布尔或戈尔康达之一，且陆军传统至少 20。"
 oe_msn_vij_08_indian_ocean_throne:0 "南印一统与双海宝座"
 oe_msn_vij_08_indian_ocean_throne_desc:0 "双海归心、南北一统，王室终以东西双海共主之尊享誉诸邦，令天命[legitimacy|e]与[diplomatic_reputation|e]俱登绝顶。自锡兰至康坎沿岸，藩属[subjects|e]与远洋商船无不向巡弋双海的南印[navy|e]致敬。"
 oe_msn_vij_08_indian_ocean_throne_req_tt:0 "拥有毗奢耶那伽罗，直接或通过属国控制坦贾武尔，控制至少 45 个地块并拥有至少 6 座海港。"
 oe_msn_vij_09_grand_irrigation_dams:0 "卡迈拉普拉水利大坝与粮仓"
 oe_msn_vij_09_grand_irrigation_dams_desc:0 "横跨通加巴德拉河的石坝与卡迈拉普拉巨型蓄水池等水利[buildings|e]，将季风洪水化为滋养梯田与王城园圃的甘泉。旱涝保收的丰年持续推升首都[development|e]与乡野[prosperity|e]，亦使农人[estate_satisfaction|e]倍增。"
 oe_msn_vij_09_grand_irrigation_dams_req_tt:0 "拥有毗奢耶那伽罗，持有至少 300 金币，并拥有引水渠系统或粮仓。"
 oe_msn_vij_10_carnatic_temples:0 "神庙石刻与卡纳提克文艺复兴"
 oe_msn_vij_10_carnatic_temples_desc:0 "高耸的塔门、维塔拉神庙音乐石柱与泰卢固八大诗圣共同掀起卡纳提克文艺复兴，令[cultural_tradition|e]与圣殿[buildings|e]交相辉映。王室厚施婆罗门与学馆，既壮大[religious_influence|e]，更令梵文与乡语[literacy|e]遍及南印。"
 oe_msn_vij_10_carnatic_temples_req_tt:0 "文艺复兴时代或之后，拥有毗奢耶那伽罗，拥有大学或剧院，且教士阶层满意度至少 50%（若有）。"
 oe_msn_vij_11_indian_ocean_fleet:0 "印度洋远洋商舰与跨海使团"
 oe_msn_vij_11_indian_ocean_fleet_desc:0 "柚木远洋战船与火炮排桨舰自科罗曼德尔船厂扬帆出海，重现朱罗水师[navy_tradition|e]并广募季风[sailors|e]。依托威震洋面的[maritime_presence|e]，王室使节得以在霍尔木兹至马六甲间开展平等而体面的远洋[diplomacy|e]。"
 oe_msn_vij_11_indian_ocean_fleet_req_tt:0 "宗教改革时代或之后，直接或通过属国控制坦贾武尔，拥有至少 8 座海港、海军传统至少 20，并拥有造船厂或港务局。"
 oe_msn_vij_12_victorious_south_empire:0 "胜利之城不朽天命：印度洋大帝国"
 oe_msn_vij_12_victorious_south_empire_desc:0 "安然跨越历史上的塔利科塔劫数，永恒胜利之城终以无可匹敌的[prestige|e]屹立印度洋畔，成为傲视东方的[great_power|e]。川流不息的洋面[trade|e]与金碧辉煌的[capital|e]广场，共同见证南印大帝国不朽天命。"
 oe_msn_vij_12_victorious_south_empire_req_tt:0 "专制主义时代或之后，拥有毗奢耶那伽罗，直接或通过属国控制坦贾武尔，稳定度至少 15，且为列强或月度贸易与税收收入至少 90。"
 oe_msn_chi_destiny:0 "#bold #color_yellow 至正中兴与双凤丝路：大元天命#!#!"
 oe_msn_chi_destiny_DESCRIPTION:0 "自戡定红巾与宝钞银锚至海运漕粮与大元维新"
 oe_msn_chi_destiny_CRITERIA_DESCRIPTION:0 "戡定中原稳固大都、推行宝钞银锚与海运漕粮、威慑帖木儿并开启大元近世维新"
 oe_msn_chi_destiny_BUTTON_TOOLTIP:0 "开启大元中兴天命"
 oe_msn_chi_destiny_BUTTON_DETAILS:0 "完美衔接现有大元全套中兴与近世长线（oe_y7_/oe_yc_/oe_yh_/oe_yr_/oe_yem_/oe_srk_）：平定红巾保卫大都、以白银锚定至正宝钞、贯通江南海运与刺桐泉州海丝、败退帖木儿并缔造欧亚双凤近世大元。"
 STATIC_MODIFIER_NAME_oe_msn_chi_m1:0 "大元神机营与怯薛新军"
 STATIC_MODIFIER_DESC_oe_msn_chi_m1:0 "融合蒙古铁骑机动与神机营火炮火铳，打造横贯长城内外的近世王师。"
 STATIC_MODIFIER_NAME_oe_msn_chi_m2:0 "漠北中原与西域丝路一统"
 STATIC_MODIFIER_DESC_oe_msn_chi_m2:0 "从大都、江南直至喀什噶尔与高丽藩服的广袤欧亚东翼尽归大元统御。"
 STATIC_MODIFIER_NAME_oe_msn_chi_m3:0 "宝钞银锚与海运刺桐盛景"
 STATIC_MODIFIER_DESC_oe_msn_chi_m3:0 "稳定的白银备付宝钞与刺桐泉州海丝巨港让大元财政丰盈、物价恒稳。"
 STATIC_MODIFIER_NAME_oe_msn_chi_m4:0 "大元近世维新与丝路双凤天命"
 STATIC_MODIFIER_DESC_oe_msn_chi_m4:0 "完成至正中兴与近世洋务维新，大元与西方罗马共掌欧亚海陆丝路霸权。"
 oe_msn_chi_01_steady_dadu_kaifeng:0 "戡定中原：稳固大都与开封"
 oe_msn_chi_01_steady_dadu_kaifeng_desc:0 "黄河决堤与民间动荡席卷中原，大都皇城与汴梁重镇开封正是大元力挽狂澜的双重支点。急修水利粮仓与市场[buildings|e]、稳固[capital|e]的[development|e]并平抑天下[stability|e]，方能重振中原农桑[prosperity|e]，将红巾烽烟扼止于大河之南。"
 oe_msn_chi_01_steady_dadu_kaifeng_req_tt:0 "拥有大都，直辖或由非主权附庸掌控开封，稳定度不低于 5，首都发展度不低于 20，且建有粮仓或市场。"
 oe_msn_chi_02_keshig_shenjiying:0 "整编怯薛禁卫与驿站军情"
 oe_msn_chi_02_keshig_shenjiying_desc:0 "整肃世袭怯薛宿卫并重振遍布宇内的站赤驿道，令大元再度拥有昔日震慑欧亚的迅捷军情与调兵效能。严密统驭诸路行省[subjects|e]并完善驿站[buildings|e]，不仅大幅提振朝廷[army_tradition|e]与万里[control|e]，更让大都诏令朝发夕至。"
 oe_msn_chi_02_keshig_shenjiying_req_tt:0 "拥有大都，稳定度不低于 12，且统辖行省/投下附庸、陆军传统不低于 16 或建有商队旅舍/城堡。"
 oe_msn_chi_03_yuan_firearms_corps:0 "大元火器神机营与水师"
 oe_msn_chi_03_yuan_firearms_corps_desc:0 "承袭至正年间最早浇铸青铜火铳的军工底蕴，大元大规模编练神机火器营与炮舰水师。扩充官营军械[buildings|e]并深研火药[advances|e]，将令中兴大元的[army_tradition|e]与[army|e]火力跃居时代前列，无论漠北铁骑抑或东海舰队皆莫能樱锋。"
 oe_msn_chi_03_yuan_firearms_corps_req_tt:0 "拥有大都，国库不少于 280 金币，处于地理大发现或更晚时代，且已研习火药革新、建有手铳行会/铸炮坊或陆军传统不低于 24。"
 oe_msn_chi_04_yuan_modern_cabinet:0 "至正维新：三教合流与科举中书"
 oe_msn_chi_04_yuan_modern_cabinet_desc:0 "重开科举广纳蒙、色目、汉南英才入仕中书省，令大元朝政焕发出跨越族裔的维新气象。当高效[cabinet|e]、稳固[crown_power|e]与诸路行省[subjects|e]齐头并进之际，大都宫廷迎来了决定百代国祚的十字路口：究竟推行江南税改汉法、重申漠北国俗，抑或定鼎行省分治大宪章？"
 oe_msn_chi_04_yuan_modern_cabinet_req_tt:0 "拥有大都，稳定度不低于 18，处于宗教改革或更晚时代，且统辖行省附庸或月商税收入不低于 45。"
 oe_msn_chi_05_jiangnan_haiyun:0 "海运漕粮贯通：杭州与苏州"
 oe_msn_chi_05_jiangnan_haiyun_desc:0 "百万石江南税粮与万匹苏杭锦绣沿大运河与海运漕道北上直抵大都，实乃大元帝国维系南北一统的生命线。稳控苏杭[core|e]沃土并扩建漕运码头与粮仓[buildings|e]，既可保障京畿常年[prosperity|e]与充沛[gold|e]税赋，更令天下一统之局固若金汤。"
 oe_msn_chi_05_jiangnan_haiyun_req_tt:0 "直辖或由非主权附庸掌控杭州与苏州，且拥有至少 8 处港口或建有粮仓/码头。"
 oe_msn_chi_06_quanzhou_maritime_silk:0 "东方第一港：刺桐晋江与广州"
 oe_msn_chi_06_quanzhou_maritime_silk_desc:0 "被伊本·白图泰盛赞为世界第一巨港的刺桐（泉州）与广州番坊，日夜停泊着往来阿拉伯、印度与南洋的远洋商船。将东南两座海运[core|e]明珠纳入市舶司体系，不仅令大元[maritime_presence|e]与商贾[estate_satisfaction|e]齐升，更稳执东亚海上丝路[trade|e]牛耳。"
 oe_msn_chi_06_quanzhou_maritime_silk_req_tt:0 "直辖或由非主权附庸掌控晋江（泉州）与广州，且拥有至少 12 处港口或建有市场/码头。"
 oe_msn_chi_07_kashgar_western_silk:0 "败退帖木儿：经略喀什噶尔与西域"
 oe_msn_chi_07_kashgar_western_silk_desc:0 "重兵扼守天山南北通衢喀什噶尔，既能阻遏西域强敌窥伺河西走廊，又重新打通直抵撒马尔罕与西方罗马的陆上丝路。依托百战[army_tradition|e]与忠诚边疆[subjects|e]，大元将西域[control|e]推向纵深，重现忽必烈时代横贯欧亚的陆上[trade|e]盛景。"
 oe_msn_chi_07_kashgar_western_silk_req_tt:0 "直辖或由非主权附庸掌控喀什噶尔（或拥有大都），至少 70 处地点，且陆军传统不低于 24 或拥有至少 3 个附庸。"
 oe_msn_chi_08_silk_phoenix_mastery:0 "大元和平与欧亚丝路双凤"
 oe_msn_chi_08_silk_phoenix_mastery_desc:0 "同时手握陆上丝绸之路与杭州、刺桐两大海上巨港，令昔日的蒙古和平在近世海陆交融中重获新生。作为雄踞东方的头等[great_power|e]，大元凭无双[prestige|e]、贯通四海的[trade|e]与广博[diplomacy|e]，与西方诸强共谱欧亚双凤齐鸣的黄金纪元。"
 oe_msn_chi_08_silk_phoenix_mastery_req_tt:0 "拥有大都，直辖或由非主权附庸掌控杭州与晋江，拥有至少 75 处地点且位列世界列强。"
 oe_msn_chi_09_jiaochao_silver_peg:0 "宝钞银锚改革与至正通货稳健"
 oe_msn_chi_09_jiaochao_silver_peg_desc:0 "元末滥印无锚纸钞曾令领先世界数百年的宝钞信用濒临崩溃。如今在京师设立可核查的白银平准准备金与严密票据[buildings|e]，不仅彻底遏止恶性[inflation|e]、重塑天下[market|e]信誉，更令大元宝钞重新化作通行亚洲各国的硬通[gold|e]。"
 oe_msn_chi_09_jiaochao_silver_peg_req_tt:0 "拥有大都，国库不少于 400 金币，月商税收入不低于 32，且建有账房或造纸行会。"
 oe_msn_chi_10_imperial_porcelain_tea:0 "青花瓷、丝绸与大元市舶大潮"
 oe_msn_chi_10_imperial_porcelain_tea_desc:0 "将波斯苏麻离青钴料与江南高岭土窑艺完美融合，元青花外销瓷与顶级丝茶风靡自马六甲至开罗与欧陆诸王廷。扩建窑坊织造[buildings|e]并畅通市舶海运，既令大元远洋[trade|e]与江南[prosperity|e]臻于极盛，更为帝国吸纳海量海外白银[gold|e]。"
 oe_msn_chi_10_imperial_porcelain_tea_req_tt:0 "直辖或由非主权附庸掌控晋江或杭州，处于地理大发现或更晚时代，且建有瓷器/丝绸行会或月商税收入不低于 45。"
 oe_msn_chi_11_guo_shoujing_academy:0 "授时历算院与大元格致启蒙"
 oe_msn_chi_11_guo_shoujing_academy_desc:0 "承续郭守敬《授时历》与回回司天监的恢弘传统，大都格致书院兼采中华、波斯与泰西天文历算、水利工程绝学。吸纳近代学术[institutions|e]并广设学府印刷[buildings|e]，令大元的[literacy|e]、[cultural_tradition|e]与科技[advances|e]稳居近世东亚之巅。"
 oe_msn_chi_11_guo_shoujing_academy_req_tt:0 "拥有大都，稳定度不低于 18，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有大学/印刷坊。"
 oe_msn_chi_12_modern_great_yuan:0 "大元近世维新终极天命"
 oe_msn_chi_12_modern_great_yuan_desc:0 "跨越元末动荡与朝代更迭宿命，中兴大元凭借银锚宝钞、授时科学、神机劲旅与海陆双丝路屹立于近代世界之巅。作为震撼寰宇的头等[great_power|e]，依托大都巍峨[capital|e]的[development|e]、坚实[stability|e]与崇高[prestige|e]，大汗兼天子将在大典上定鼎大元百代永固的终极国运。"
 oe_msn_chi_12_modern_great_yuan_req_tt:0 "完成三条支线，拥有大都，直辖或由附庸掌控杭州与晋江，稳定度不低于 18，处于专制或更晚时代，位列世界列强且首都发展度不低于 34。"
 oe_msn_mng_destiny:0 "#bold #color_yellow 日月重光与太平洋宝船：大明天命#!#!"
 oe_msn_mng_destiny_DESCRIPTION:0 "自洪武卫所与郑和宝船至一条鞭法、宁远大捷与开海大明"
 oe_msn_mng_destiny_CRITERIA_DESCRIPTION:0 "定鼎两京、重续郑和宝船与景德镇御窑、推行一条鞭法与关宁红衣防线并开启太平洋大明"
 oe_msn_mng_destiny_BUTTON_TOOLTIP:0 "开启大明天命"
 oe_msn_mng_destiny_BUTTON_DETAILS:0 "衔接 Slot 79 大明双轨主角长线：从洪武定都应天、迁都北京、景德镇御窑与郑和七下西洋起步，经戚家军鸳鸯阵、隆庆开关、张居正一条鞭法、《天工开物》与宁远红衣大炮防线，挺过小冰期银荒铸就太平洋中兴大明！"
 STATIC_MODIFIER_NAME_oe_msn_mng_m1:0 "戚家军鸳鸯阵与关宁红衣炮"
 STATIC_MODIFIER_DESC_oe_msn_mng_m1:0 "多兵种协同的戚家军火铳操典与关宁重炮防线令大明陆师固若金汤。"
 STATIC_MODIFIER_NAME_oe_msn_mng_m2:0 "宝船西洋与太平洋开海霸权"
 STATIC_MODIFIER_DESC_oe_msn_mng_m2:0 "郑和宝船接掌海上丝路并连通马尼拉与南洋商港，重现天朝远洋气象。"
 STATIC_MODIFIER_NAME_oe_msn_mng_m3:0 "一条鞭银政与《天工开物》实学"
 STATIC_MODIFIER_DESC_oe_msn_mng_m3:0 "张居正考成清丈、御窑青花与徐光启宋应星实学令大明财力科技冠绝东亚。"
 STATIC_MODIFIER_NAME_oe_msn_mng_m4:0 "日月重光：太平洋中兴大明天命"
 STATIC_MODIFIER_DESC_oe_msn_mng_m4:0 "挺过小冰期与银荒大考，以责任内阁、宝船水师与红衣重炮引领近世东亚。"
 oe_msn_mng_01_hongwu_shangyuan:0 "洪武开国：应天卫所与里甲大册"
 oe_msn_mng_01_hongwu_shangyuan_desc:0 "扫荡乱世烽烟、定鼎应天（南京）以来，洪武朝廷以鱼鳞图册清核田亩、以卫所军屯休养生息。兴修粮仓市场[buildings|e]、提振[capital|e]的[development|e]并稳固社稷[stability|e]，不仅赢得广大农人[estate_satisfaction|e]，更为大明奠定了绵延百年的万世基业。"
 oe_msn_mng_01_hongwu_shangyuan_req_tt:0 "拥有应天（南京）或大都，稳定度不低于 5，首都发展度不低于 18，且建有粮仓或市场。"
 oe_msn_mng_02_yongle_two_capitals:0 "天子守国门：大都北京与大运河"
 oe_msn_mng_02_yongle_two_capitals_desc:0 "天子坐镇北京以守北方国门，应天留都稳抚江南富庶财赋，疏浚一新的京杭大运河将南北两京血脉贯通。将双都确立为永恒[core|e]并筑牢边关[fort|e]体系，既令大明[control|e]与天命[legitimacy|e]空前稳固，更赋予帝国北拒草原、南经大洋的雄厚底气。"
 oe_msn_mng_02_yongle_two_capitals_req_tt:0 "拥有大都（北京）与应天（南京），且建有城堡或拥有至少 55 处地点。"
 oe_msn_mng_03_yuanyang_folangji:0 "戚家军鸳鸯阵与佛郎机火炮"
 oe_msn_mng_03_yuanyang_folangji_desc:0 "戚继光独创的十一人鸳鸯阵将狼筅、长枪与佛郎机后装火炮紧密协同，所向披靡地荡平东南倭患。吸纳火器[advances|e]并严训领饷[regulars|e]，将把大明的[army_tradition|e]推向高峰，锻造出一支无论东南海疆抑或塞北长城皆能克敌制胜的近代精锐[army|e]。"
 oe_msn_mng_03_yuanyang_folangji_req_tt:0 "拥有应天或大都，国库不少于 250 金币，处于地理大发现或更晚时代，且已研习火药革新、陆军传统不低于 22 或建有铸炮坊/练兵场。"
 oe_msn_mng_04_single_whip_cabinet:0 "1581 张居正考成法与一条鞭法"
 oe_msn_mng_04_single_whip_cabinet_desc:0 "张居正以考成法严核百官政绩，并推行「一条鞭法」清丈天下田亩、将繁杂赋役折银一体征收，令大明财政焕然一新。提升内阁[cabinet|e]效能与全国[control|e]，既可根除豪强隐田积弊、令太仓国库[gold|e]大增，更极大解放民间工商业活力，促成海内[prosperity|e]。"
 oe_msn_mng_04_single_whip_cabinet_req_tt:0 "拥有大都或应天，稳定度不低于 15，处于宗教改革或更晚时代，且月商税收入不低于 45。"
 oe_msn_mng_05_southeast_ports:0 "东南海疆：泉州、宁波与广州"
 oe_msn_mng_05_southeast_ports_desc:0 "牢控晋江泉州、鄞县宁波与广州三大东南巨港，并依托龙江船厂的巍峨坞台，大明已尽得浙闽粤千里良港之利。在这些沿海[core|e]枢纽兴建海港船坞[buildings|e]、汇聚精练[sailors|e]，将为宝船出洋与东亚远海[maritime_presence|e]打下坚不可摧的物质基石。"
 oe_msn_mng_05_southeast_ports_req_tt:0 "拥有晋江、鄞县（宁波）与广州，拥有至少 12 处港口且建有码头或船坞。"
 oe_msn_mng_06_zheng_he_voyages:0 "三宝太监郑和七下西洋"
 oe_msn_mng_06_zheng_he_voyages_desc:0 "九桅巨舰自龙江扬帆南下，远航占城、满剌加、古里乃至忽鲁谟斯，向印度洋万邦宣扬天朝威仪。然而当如日中天的[navy_tradition|e]与[prestige|e]遭遇北疆边防的庞大军费开销，大明朝堂迎来了决定华夏数百年国运的世纪大辩论：究竟铸就大洋[navy|e]帝国，抑或收帆北顾专守长城？"
 oe_msn_mng_06_zheng_he_voyages_req_tt:0 "拥有应天与广州，处于文艺复兴或更晚时代，且海军传统不低于 18 或拥有至少 16 处港口。"
 oe_msn_mng_07_ningyuan_guanning:0 "1626 宁远大捷：关宁红衣大炮防线"
 oe_msn_mng_07_ningyuan_guanning_desc:0 "在山海关与宁远高耸坚固的石砌城垣上架设成排红衣大炮，将辽西走廊化作令骑兵铁流望而却步的钢铁火网。加固北疆[fort|e]防线与关宁[core|e]重镇，不仅大幅提升大明[army_tradition|e]与塞北[control|e]，更令任何企图叩关南下的劲敌在炮火雷鸣中折戟沉沙。"
 oe_msn_mng_07_ningyuan_guanning_req_tt:0 "拥有宁远、抚宁（山海关）或大都，至少 70 处地点，且建有棱堡/城堡或陆军传统不低于 25。"
 oe_msn_mng_08_pacific_ming_network:0 "隆庆开关与太平洋大明商站"
 oe_msn_mng_08_pacific_ming_network_desc:0 "隆庆月港开关正式准许民间海商领引出海，将马尼拉大帆船白银、南洋香料与日本银山尽数纳入大明商业秩序。背靠忠诚藩属[subjects|e]与头等[great_power|e]威望，大明以磅礴[maritime_presence|e]稳执太平洋与南海[trade|e]霸权，自琉球以迄马六甲莫不仰瞻明旗。"
 oe_msn_mng_08_pacific_ming_network_req_tt:0 "直辖或由非主权附庸掌控马尼拉或马六甲（或拥有广州），处于宗教改革或更晚时代，位列世界列强，且拥有天朝藩属或至少 18 处港口。"
 oe_msn_mng_09_jingdezhen_kilns:0 "洪武二年景德镇御窑青花"
 oe_msn_mng_09_jingdezhen_kilns_desc:0 "洪武二年肇建的景德镇御窑厂与苏杭丝织名坊，凭巧夺天工的青花、彩瓷与锦缎独占近世全球奢侈品市场鳌头。扩建御窑与丝织[buildings|e]不仅令江南[market|e]产销两旺，更借冠绝世界的远洋[trade|e]为帝国换回源源不绝的[gold|e]与长久[prosperity|e]。"
 oe_msn_mng_09_jingdezhen_kilns_req_tt:0 "拥有应天与杭州，国库不少于 350 金币，且建有瓷器行会或丝绸生产行会。"
 oe_msn_mng_10_ever_normal_silver:0 "常平义仓与自铸银元抗荒"
 oe_msn_mng_10_ever_normal_silver_desc:0 "小冰期寒旱与海外白银供应骤断曾令明末陷入粮荒银竭的双重绝境。如今广建常平义仓与账房[buildings|e]、建立国家自铸标准化银元准备金，既能平抑[inflation|e]与银价波动，又能护佑农桑[prosperity|e]，令大明[stability|e]从容穿越任何天灾与外贸震荡。"
 oe_msn_mng_10_ever_normal_silver_req_tt:0 "拥有大都与应天，国库不少于 500 金币，月商税收入不低于 40，且建有粮仓或账房。"
 oe_msn_mng_11_tiangong_kaiwu:0 "《农政全书》与《天工开物》实学启蒙"
 oe_msn_mng_11_tiangong_kaiwu_desc:0 "从徐光启译介几何、纂修《农政全书》，到宋应星以《天工开物》系统总结冶金织造与机械绝艺，晚明实学思潮闪耀着近代科学的璀璨火光。扶持印刷[institutions|e]与书院[buildings|e]，必将全面提升海内[literacy|e]与[cultural_tradition|e]，引领东亚科技[advances|e]昂首步入近世。"
 oe_msn_mng_11_tiangong_kaiwu_req_tt:0 "拥有应天或大都，稳定度不低于 18，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有印刷坊/大学。"
 oe_msn_mng_12_oceanic_bright_ming:0 "日月重光：太平洋中兴大明天命"
 oe_msn_mng_12_oceanic_bright_ming_desc:0 "日月重光，照耀两京宫阙、关宁重炮长城、太平洋宝船巨舰与实学格致殿堂。作为雄踞东方的头等[great_power|e]，依托[capital|e]雄厚的[development|e]、坚不可摧的[stability|e]与四海敬仰的[prestige|e]，中兴大明将在盛世大典上定鼎近世百年的不朽天命。"
 oe_msn_mng_12_oceanic_bright_ming_req_tt:0 "完成三条支线，拥有大都、应天与广州，稳定度不低于 18，处于专制或更晚时代，位列世界列强且首都发展度不低于 34。"
 oe_msn_mch_destiny:0 "#bold #color_yellow 白山黑水与八旗入关：满洲天命#!#!"
 oe_msn_mch_destiny_DESCRIPTION:0 "自赫图阿拉统一女真至萨尔浒、乌真超哈与入主燕京"
 oe_msn_mch_destiny_CRITERIA_DESCRIPTION:0 "统一建州海西女真、创八旗与乌真超哈重炮、破山海关入主大都并建理藩二元帝国"
 oe_msn_mch_destiny_BUTTON_TOOLTIP:0 "开启女真/满洲天命"
 oe_msn_mch_destiny_BUTTON_DETAILS:0 "衔接 Slot 80 女真/满洲入关主角线与标志性局势 oe_sit_manchu_pass（严格保持 MCH Tag 与 jurchen_group 实盘契约）：从白山黑水诸部起步，编立八旗牛录与满文、决胜萨尔浒、组建乌真超哈红衣重炮营、破关入主北京并推行理藩院与摊丁入亩！"
 STATIC_MODIFIER_NAME_oe_msn_mch_m1:0 "八旗牛录与乌真超哈重炮"
 STATIC_MODIFIER_DESC_oe_msn_mch_m1:0 "出则为兵、入则为民的八旗巴牙喇铁骑与乌真超哈红衣重炮营无坚不摧。"
 STATIC_MODIFIER_NAME_oe_msn_mch_m2:0 "破关定鼎与理藩院内亚统合"
 STATIC_MODIFIER_DESC_oe_msn_mch_m2:0 "自白山黑水入主燕京并统筹满汉蒙藏，铸就辽阔稳固的东亚—内亚二元巨帝。"
 STATIC_MODIFIER_NAME_oe_msn_mch_m3:0 "摊丁入亩、恰克图与十三行财源"
 STATIC_MODIFIER_DESC_oe_msn_mch_m3:0 "废除人头苛税并连通北方恰克图与南方广州海贸，释放盛世人口与白银洪流。"
 STATIC_MODIFIER_NAME_oe_msn_mch_m4:0 "龙兴燕京：满汉蒙藏近代大帝国天命"
 STATIC_MODIFIER_DESC_oe_msn_mch_m4:0 "打破八旗腐化宿命，以中西历算火器与开海维新成就亚洲巅峰强权。"
 oe_msn_mch_01_hetu_ala_jurchen:0 "白山黑水：立足赫图阿拉与建州"
 oe_msn_mch_01_hetu_ala_jurchen_desc:0 "长白林海与松花江畔，筑稳赫图阿拉建州[capital|e]便能号令星散女真诸部，于渔猎骑射中磨砺铁血[army_tradition|e]。以严明法纪整合诸贝勒宗室并稳固内部[stability|e]，大业龙兴之势由此发端。"
 oe_msn_mch_01_hetu_ala_jurchen_req_tt:0 "直接或通过属国控制赫图阿拉、沈阳、吉林乌拉或宁古塔之一，稳定度至少 5，并拥有城堡或市场。"
 oe_msn_mch_02_eight_banners_script:0 "创立八旗牛录与老满文"
 oe_msn_mch_02_eight_banners_script_desc:0 "以黄白红蓝八旗牛录编户齐民、兵农合一，既成倍扩充可战[manpower|e]，亦使汗王[crown_power|e]直达基层。借蒙文创制老满文更提升军政文书[literacy|e]，为新兴满洲共同体奠定深厚[cultural_tradition|e]。"
 oe_msn_mch_02_eight_banners_script_req_tt:0 "直接或通过属国控制赫图阿拉或沈阳之一，稳定度至少 10，拥有抄经院或兵器行会，且贵族阶层满意度至少 45%（若有）。"
 oe_msn_mch_03_ujen_cooha_guns:0 "编练「乌真超哈」红衣重炮汉军旗"
 oe_msn_mch_03_ujen_cooha_guns_desc:0 "深谙宁远红衣大炮之威后，关外铸局倾力仿造重型铜炮，编练专司攻坚的乌真超哈汉军旗[regulars|e]。骑射机动与重炮[advances|e]珠联璧合，彻底重塑帝国[army|e]并淬炼出破关夺城的[army_tradition|e]。"
 oe_msn_mch_03_ujen_cooha_guns_req_tt:0 "地理大发现时代或之后，直接或通过属国控制沈阳、辽阳、大都或赫图阿拉之一，持有至少 220 金币与 20 陆军传统，拥有铸炮厂或练兵场，且接纳职业军队思潮或解锁长矛火枪进阶。"
 oe_msn_mch_04_lifan_yuan_dyarchy:0 "设立理藩院与满汉蒙藏二元共治"
 oe_msn_mch_04_lifan_yuan_dyarchy_desc:0 "内设满汉复职六部、外置理藩院，大帝一面以儒家天子御宇中原，一面以精湛[diplomacy|e]抚绥蒙藏王公活佛。多元共治的帝国[cabinet|e]极大夯实皇权[legitimacy|e]，令辽阔内亚[subjects|e]长久归服。"
 oe_msn_mch_04_lifan_yuan_dyarchy_req_tt:0 "宗教改革时代或之后，直接或通过属国控制大都或沈阳之一，稳定度至少 15，拥有至少 1 个属国或控制 60 个地块，并拥有大学或兵营。"
 oe_msn_mch_05_unite_haixi_manchuria:0 "兼并海西四部：沈阳、开原与乌拉"
 oe_msn_mch_05_unite_haixi_manchuria_desc:0 "兼并乌拉、叶赫、辉发、哈达海西四部，将辽河沃土与松花江林莽合为一体，筑牢满洲龙兴[core|e]。营建盛京重镇可迅速拉升关外[development|e]与疆域[control|e]，令汗庭[prestige|e]震慑漠南诸部。"
 oe_msn_mch_05_unite_haixi_manchuria_req_tt:0 "直接或通过非主权属国同时控制沈阳、开原与吉林乌拉。"
 oe_msn_mch_06_sarhu_liaoyang:0 "萨尔浒大捷：克复辽阳与抚顺"
 oe_msn_mch_06_sarhu_liaoyang_desc:0 "萨尔浒一战以任尔几路来、我只一路去之奇谋连破四路大军，辽阳与抚顺由此归入帝国农耕[core|e]。夺占辽东坚城既极大提振[army_tradition|e]与战阵[prestige|e]，更令后金首次掌握丰沛粮秣[prosperity|e]。"
 oe_msn_mch_06_sarhu_liaoyang_req_tt:0 "直接或通过属国控制辽阳与抚顺，且陆军传统至少 15。"
 oe_msn_mch_07_shanhaiguan_pass:0 "决战松锦与叩关山海：宁远与抚宁"
 oe_msn_mch_07_shanhaiguan_pass_desc:0 "历经松锦决战终克宁锦防线，八旗铁骑长驱直入天下第一关山海关，彻底击碎关宁[fort|e]锁钥。突破长城隘口既使归附兵员充实[manpower|e]，更令帝国[army|e]俯瞰华北平原并牢掌边关[control|e]。"
 oe_msn_mch_07_shanhaiguan_pass_req_tt:0 "直接或通过非主权属国同时控制宁远与抚宁（山海关）。"
 oe_msn_mch_08_enter_beijing_dadu:0 "龙兴燕京：入主大都北京定鼎中原"
 oe_msn_mch_08_enter_beijing_dadu_desc:0 "移师入主大都北京、登临紫禁金銮，天命所归的新朝自此奠定威加海内的帝国[capital|e]与统治[core|e]。礼敬儒臣并循古礼祭天，可迅速凝聚正统[legitimacy|e]，加速中原百废俱兴与都市[development|e]。"
 oe_msn_mch_08_enter_beijing_dadu_req_tt:0 "直接或通过非主权属国控制大都（北京）。"
 oe_msn_mch_09_fushun_ginseng_fur:0 "关东人参貂皮与北疆商市"
 oe_msn_mch_09_fushun_ginseng_fur_desc:0 "长白野山参、黑水紫貂皮与东珠珍产汇聚抚顺、开原马市，为关外新邦开辟源源不断的北疆[trade|e]与白银[gold|e]。规范互市[market|e]秩序并保护商帮往来，令未入关前的满洲故土已初显丰饶[prosperity|e]。"
 oe_msn_mch_09_fushun_ginseng_fur_req_tt:0 "直接或通过属国控制沈阳或赫图阿拉之一，持有至少 260 金币，并拥有市场或行会大厅。"
 oe_msn_mch_10_tan_ding_ru_mu:0 "摊丁入亩与改土归流税政"
 oe_msn_mch_10_tan_ding_ru_mu_desc:0 "推行摊丁入亩、滋生人丁永不加赋，既解无地贫农之困并平抑[inflation|e]，又使朝廷正赋旱涝稳收。西南改土归流更以流官取代世袭土司，显著强化边省[control|e]，令民生[estate_satisfaction|e]与天下[stability|e]兼得。"
 oe_msn_mch_10_tan_ding_ru_mu_req_tt:0 "直接或通过属国控制大都（北京），持有至少 400 金币，月度贸易与税收收入至少 35，且农民阶层满意度至少 50%（若有）。"
 oe_msn_mch_11_kyakhta_cohong_trade:0 "北通恰克图、南开广州海贸"
 oe_msn_mch_11_kyakhta_cohong_trade_desc:0 "北线茶马驼队穿越漠北抵恰克图易换俄国毛皮，南线广州十三行以丝瓷茶叶吸纳美洲滚滚白银[gold|e]。借宏伟税关[buildings|e]兼管陆海两翼通道，令帝国稳居世界[trade|e]与东亚[market|e]的核心枢纽。"
 oe_msn_mch_11_kyakhta_cohong_trade_req_tt:0 "宗教改革时代或之后，直接或通过属国控制广州或大都之一，控制至少 70 个地块、首都发展度至少 32，并拥有海关或贸易枢纽。"
 oe_msn_mch_12_dual_asian_apex:0 "满汉蒙藏近代大帝国终极天命"
 oe_msn_mch_12_dual_asian_apex_desc:0 "合满洲、蒙古、西藏、西域与内地十八省于一炉，大一统多民族帝国以无上[prestige|e]雄踞东亚[great_power|e]之巅。融汇礼乐文治与近代[institutions|e]，持续推动广土众民的全面[development|e]，终成横跨内亚与沧溟的盛世天命。"
 oe_msn_mch_12_dual_asian_apex_req_tt:0 "专制主义时代或之后，直接或通过属国控制大都与沈阳，稳定度至少 15，且为列强或月度贸易与税收收入至少 100。"
 oe_msn_kor_destiny:0 "#bold #color_yellow 训民正音与龟船火炮：高丽/朝鲜天命#!#!"
 oe_msn_kor_destiny_DESCRIPTION:0 "自汉城新朝与集贤殿至大同法、神机箭与东亚火药强国"
 oe_msn_kor_destiny_CRITERIA_DESCRIPTION:0 "稳固开城与汉城（namgyeong）、颁布训民正音、建龟船神机箭并推行大同法"
 oe_msn_kor_destiny_BUTTON_TOOLTIP:0 "开启高丽/朝鲜天命"
 oe_msn_kor_destiny_BUTTON_DETAILS:0 "严格采用 EU5 1.4.9 实盘汉城键名 `namgyeong`（绝不误用武汉 `hanyang`！）：稳固半岛核心、颁布世宗《训民正音》大幅拉升全民识字率、修筑鸭绿江北疆城堡、研发神机箭与李舜臣龟船，并以 1608 大同法成就东亚礼义火药强国。"
 STATIC_MODIFIER_NAME_oe_msn_kor_m1:0 "备边司、神机箭与火炮工坊"
 STATIC_MODIFIER_DESC_oe_msn_kor_m1:0 "精研火药箭车、天地玄黄大炮与常备备边司体制，守疆御侮战力倍增。"
 STATIC_MODIFIER_NAME_oe_msn_kor_m2:0 "李舜臣龟船与半岛双海铁壁"
 STATIC_MODIFIER_DESC_oe_msn_kor_m2:0 "装甲龟船舰队与东莱—鸭绿江海陆壁垒令来犯强敌折戟沉沙。"
 STATIC_MODIFIER_NAME_oe_msn_kor_m3:0 "《训民正音》与 1608 大同法盛世"
 STATIC_MODIFIER_DESC_oe_msn_kor_m3:0 "创制谚文普及全民教育并推行大同法实物折米税改，文教财力冠绝东亚。"
 STATIC_MODIFIER_NAME_oe_msn_kor_m4:0 "东亚礼义火药强国终极天命"
 STATIC_MODIFIER_DESC_oe_msn_kor_m4:0 "以冠绝世界的识字科研、钢铁龟船水师与精良火炮傲立东北亚强林。"
 oe_msn_kor_01_kaesong_namgyeong:0 "半岛新基：开城与汉城（namgyeong）"
 oe_msn_kor_01_kaesong_namgyeong_desc:0 "兼稳高丽旧都开城与汉江形胜盆地汉城，既承古都文脉又开新朝气象，为[capital|e]凝聚无可动摇的正统[legitimacy|e]。充实京畿官仓并整肃市廛商税，既能加快都市[development|e]，亦为半岛奠定长治久安的[stability|e]。"
 oe_msn_kor_01_kaesong_namgyeong_req_tt:0 "拥有开城与汉城，稳定度至少 5，并拥有粮仓或市场。"
 oe_msn_kor_02_hopae_border_council:0 "号牌法与备边司军政统筹"
 oe_msn_kor_02_hopae_border_council_desc:0 "推行号牌法登记民户丁口，既令赋役征发公平明晰而加强户籍[control|e]，又保障战时[manpower|e]充盈。由备边司[cabinet|e]统筹文武大员商决边事，可使两班士族协力砥砺三军[army_tradition|e]。"
 oe_msn_kor_02_hopae_border_council_req_tt:0 "拥有汉城，稳定度至少 10，且贵族阶层满意度至少 50%（若有）。"
 oe_msn_kor_03_hwacha_gunpowder:0 "崔茂宣火药都监与神机箭车"
 oe_msn_kor_03_hwacha_gunpowder_desc:0 "扩建崔茂宣所创火药都监，量产齐射百发火箭的神机箭车，以骤雨火矢令来犯强敌胆寒。倾国库[gold|e]投入本土火器[advances|e]研发，使半岛[army|e]凭精锐火力铸就冠绝东亚的守御[army_tradition|e]。"
 oe_msn_kor_03_hwacha_gunpowder_req_tt:0 "文艺复兴时代或之后，拥有汉城，持有至少 220 金币与 15 陆军传统，拥有铸炮厂或军械库，并接纳职业军队思潮或解锁对应进阶。"
 oe_msn_kor_04_modern_korean_cannon:0 "天字重炮与近代守疆兵制"
 oe_msn_kor_04_modern_korean_cannon_desc:0 "铸造天字、地字重型青铜铳筒并设立五军营常备[regulars|e]，令南汉山城等山城化为固若金汤的[fort|e]支点。依托新式军备[buildings|e]日夜操演，既可兼御陆海强敌，亦令王室[crown_power|e]稳如磐石。"
 oe_msn_kor_04_modern_korean_cannon_req_tt:0 "宗教改革时代或之后，拥有汉城，稳定度至少 15、陆军传统至少 25，并拥有兵营或棱堡。"
 oe_msn_kor_05_gyeongju_dongnae:0 "东南海防门户：庆州与东莱（釜山）"
 oe_msn_kor_05_gyeongju_dongnae_desc:0 "自新罗千年古都庆州至遥望对马的东莱海港，庆尚道东南门户乃镇守朝鲜海峡的防务[core|e]。加固釜山浦城砦并整饬对海[trade|e]，既带动岭南[development|e]，又令倭寇海盗再难窥伺岸线。"
 oe_msn_kor_05_gyeongju_dongnae_req_tt:0 "直接或通过属国控制庆州与东莱，并拥有海港。"
 oe_msn_kor_06_turtle_ship_armada:0 "忠武公李舜臣与装甲龟船水师"
 oe_msn_kor_06_turtle_ship_armada_desc:0 "承袭忠武公鹤翼阵海战精髓，平底板屋船与铁甲尖刺龟船驰骋南海激流，令来犯舰队折戟沉沙。精练沿海[sailors|e]不断推升[navy_tradition|e]，铸就无敌[navy|e]与牢不可破的海峡[maritime_presence|e]。"
 oe_msn_kor_06_turtle_ship_armada_req_tt:0 "地理大发现时代或之后，直接或通过属国控制东莱，海军传统至少 18，并拥有干船坞或船坞。"
 oe_msn_kor_07_northern_forts:0 "鸭绿江与图们江北疆四郡六镇"
 oe_msn_kor_07_northern_forts_desc:0 "沿鸭绿江置西北四郡、循图们江立东北六镇，将朝廷[control|e]稳固推进至天然江山界线。连绵烽燧与石筑[fort|e]庇护北疆屯田军民，在寒风边塞中淬炼[army_tradition|e]并守护北道[prosperity|e]。"
 oe_msn_kor_07_northern_forts_req_tt:0 "拥有开城与汉城，控制至少 28 个地块，并拥有城堡或兵器行会。"
 oe_msn_kor_08_northeast_asian_shield:0 "东亚双海枢纽：威慑黄海与日本海"
 oe_msn_kor_08_northeast_asian_shield_desc:0 "兼扼黄海与日本海双洋航道，使朝鲜半岛由昔日兵家通道蜕变为令四邻敬畏的海洋铁壁与坚固[maritime_presence|e]支点。精锐常备水师佐以不卑不亢的礼义[diplomacy|e]，大幅提升[diplomatic_reputation|e]，令陆海强权皆重我邦[prestige|e]。"
 oe_msn_kor_08_northeast_asian_shield_req_tt:0 "宗教改革时代或之后，直接或通过属国控制开城、汉城、庆州与东莱，拥有至少 6 座海港，并拥有造船厂或港务局。"
 oe_msn_kor_09_hangul_hall_worthies:0 "世宗《训民正音》与集贤殿文治"
 oe_msn_kor_09_hangul_hall_worthies_desc:0 "世宗大王召集集贤殿群贤创制易学表音的《训民正音》谚文，并刊印农书历法与浑天仪制，令民间[literacy|e]焕然一新。兴办学宫藏书等文教[buildings|e]既厚植半岛[cultural_tradition|e]，更令学术与科技[advances|e]百花齐放。"
 oe_msn_kor_09_hangul_hall_worthies_req_tt:0 "文艺复兴时代或之后，拥有汉城，首都发展度至少 22，并拥有大学或图书馆。"
 oe_msn_kor_10_korean_artisanry:0 "高丽青瓷、白瓷与金属活字工艺"
 oe_msn_kor_10_korean_artisanry_desc:0 "翡色高丽青瓷、素雅朝鲜白瓷、坚韧韩纸与独步世界的金属活字，在官窑与匠作[buildings|e]中臻于化境。借东亚[trade|e]远销珍品既令国库广积[gold|e]，也带动八道市镇手工业与民生[prosperity|e]。"
 oe_msn_kor_10_korean_artisanry_req_tt:0 "拥有汉城与开城，持有至少 300 金币，并拥有瓷器行会或造纸行会。"
 oe_msn_kor_11_daedongbeop_reform:0 "1608 大同法税制革新与实学兴起"
 oe_msn_kor_11_daedongbeop_reform_desc:0 "1608年大同法以田亩米布折纳取代苛繁土贡，既稳定物价平抑[inflation|e]，又催生贡人商帮活跃各道[market|e]。辅以经世致用的实学思潮，轻徭薄赋显著提升百姓[estate_satisfaction|e]并带来八道[prosperity|e]。"
 oe_msn_kor_11_daedongbeop_reform_req_tt:0 "宗教改革时代或之后，拥有汉城，稳定度至少 15，月度贸易与税收收入至少 30，且农民阶层满意度至少 50%（若有）。"
 oe_msn_kor_12_enlightened_gunpowder_korea:0 "东亚礼义火药强国终极天命"
 oe_msn_kor_12_enlightened_gunpowder_korea_desc:0 "融汇实学格致、铁甲水师与全民高[literacy|e]，朝鲜巍然崛起为东亚文明与火药并重的[great_power|e]。不断革新的[institutions|e]与崇高王权[legitimacy|e]相互砥柱，使半岛在近代风云中牢掌自主天命。"
 oe_msn_kor_12_enlightened_gunpowder_korea_req_tt:0 "专制主义时代或之后，直接或通过属国控制开城、汉城与东莱，稳定度至少 18，且为列强或月度贸易与税收收入至少 75。"
 oe_msn_jap_destiny:0 "#bold #color_yellow 天下布武与朱印太平洋：日本天命#!#!"
 oe_msn_jap_destiny_DESCRIPTION:0 "自南北朝合一与足轻铁炮至石见银山与朱印船海贸"
 oe_msn_jap_destiny_CRITERIA_DESCRIPTION:0 "统一列岛建幕江户大阪、列装足轻铁炮、开采石见银山并开创朱印船太平洋海权"
 oe_msn_jap_destiny_BUTTON_TOOLTIP:0 "开启日本/足利天命"
 oe_msn_jap_destiny_BUTTON_DETAILS:0 "严格采用 EU5 1.4.9 实盘 Tag（JAP/ASK/NTC/STC，严禁误用北美 ASH！）与实盘地名（toshima 江户、nima 石见、nishisonogi 长崎）：终结南北朝与战国纷争，推行城下町与足轻铁炮革命，凭石见银山与朱印船称雄东亚与太平洋！"
 STATIC_MODIFIER_NAME_oe_msn_jap_m1:0 "天下布武：武士道与足轻铁炮阵"
 STATIC_MODIFIER_DESC_oe_msn_jap_m1:0 "结合冷兵器武士精魂与大规模三段击铁炮足轻，陆战纪律冠绝东亚。"
 STATIC_MODIFIER_NAME_oe_msn_jap_m2:0 "一统扶桑：京都、大阪与江户幕府"
 STATIC_MODIFIER_DESC_oe_msn_jap_m2:0 "结束百年战国乱世，将关东、畿内与九州统合为铁板一块的海洋帝国。"
 STATIC_MODIFIER_NAME_oe_msn_jap_m3:0 "石见银山与朱印船太平洋商网"
 STATIC_MODIFIER_DESC_oe_msn_jap_m3:0 "石见丰沛白银与博多长崎朱印船队直接主宰东亚与南洋银丝套利。"
 STATIC_MODIFIER_NAME_oe_msn_jap_m4:0 "近代东瀛海洋霸权终极天命"
 STATIC_MODIFIER_DESC_oe_msn_jap_m4:0 "拒绝锁国沉睡，以兰学格致、铁炮新军与太平洋朱印舰队跻身近世世界列强。"
 oe_msn_jap_01_kyoto_kamakura:0 "南北朝合一：京都与镰仓幕威"
 oe_msn_jap_01_kyoto_kamakura_desc:0 "弥合南北朝数十年裂痕，使京都王城[capital|e]的礼乐正统与镰仓武门威仪合流，重塑天下[legitimacy|e]。约束拥兵自重的守护大名，方能为群雄纷起的列岛重树秩序[stability|e]并扬幕府[prestige|e]。"
 oe_msn_jap_01_kyoto_kamakura_req_tt:0 "直接或通过属国控制京都、镰仓或丰岛之一，稳定度至少 5，并拥有城堡或神庙。"
 oe_msn_jap_02_jokamachi_land_survey:0 "城下町兴起与太阁检地兵农分离"
 oe_msn_jap_02_jokamachi_land_survey_desc:0 "厉行太阁检地并实施兵农分离，既以统一度量衡厘清田赋[gold|e]并强化[control|e]，又促成工商业汇聚城下町。废除旧式行会垄断的乐市乐座激活[market|e]生机，推动列岛城邑实现跨越式[development|e]。"
 oe_msn_jap_02_jokamachi_land_survey_req_tt:0 "直接或通过属国控制京都、大阪或丰岛之一，稳定度至少 10、持有至少 220 金币，并拥有市场或粮仓。"
 oe_msn_jap_03_ashigaru_tanegashima:0 "足轻铁炮革命与三段齐射操典"
 oe_msn_jap_03_ashigaru_tanegashima_desc:0 "堺市与国友铁匠日夜量产种子岛铁炮，武装常备足轻在防马栅后施展严密的三段轮射火网。将火器[advances|e]化为制胜操典，不仅令列岛[army|e]蜕变为精锐[regulars|e]，更将[army_tradition|e]推向世界巅峰。"
 oe_msn_jap_03_ashigaru_tanegashima_req_tt:0 "地理大发现时代或之后，直接或通过属国控制京都、大阪或丰岛之一，持有至少 250 金币与 20 陆军传统，拥有铸炮厂或练兵场，且接纳职业军队思潮或解锁长矛火枪进阶。"
 oe_msn_jap_04_bushido_central_bakufu:0 "武家诸法度与常备近代藩军"
 oe_msn_jap_04_bushido_central_bakufu_desc:0 "颁布《武家诸法度》引导武士集团由战国私斗转向文治辅政与规范军役，使幕府中枢[crown_power|e]大为巩固。参勤交代与妥善的[estates|e]制衡维系天下[stability|e]，常备近代藩军[regulars|e]则始终严阵以待。"
 oe_msn_jap_04_bushido_central_bakufu_req_tt:0 "宗教改革时代或之后，直接或通过属国控制丰岛或京都之一，稳定度至少 15、陆军传统至少 28，贵族阶层满意度至少 50%（若有），并拥有兵营或棱堡。"
 oe_msn_jap_05_osaka_kinai_heart:0 "天下台所：营建大阪巨城与畿内"
 oe_msn_jap_05_osaka_kinai_heart_desc:0 "京都皇都礼制与大阪巨城米市相得益彰，将富庶畿内铸就为天下台所与幕府不可动摇的[core|e]。濑户内海漕船日夜输运稻米与棉布汇集[market|e]，催动城邑[development|e]并带来空前商业[prosperity|e]。"
 oe_msn_jap_05_osaka_kinai_heart_req_tt:0 "直接或通过非主权属国同时控制京都与大阪。"
 oe_msn_jap_06_edo_kanto_capital:0 "天下布武建幕江户（toshima）"
 oe_msn_jap_06_edo_kanto_capital_desc:0 "填海筑城、广修螺旋石垣，令关东沃野之上的江户蜕变为易守难攻的巨型[fort|e]与气吞列岛的政治[capital|e]。五街道自日本桥辐射四方，百工商旅蜂拥而至，既拉升关东[development|e]，亦使中央[control|e]贯通全国。"
 oe_msn_jap_06_edo_kanto_capital_req_tt:0 "直接或通过非主权属国同时控制丰岛（江户）与镰仓。"
 oe_msn_jap_07_kyushu_hakata_nagasaki:0 "九州海门：稳控博多与长崎"
 oe_msn_jap_07_kyushu_hakata_nagasaki_desc:0 "博多豪商货栈与长崎深水良港相辅相成，使九州成为列岛通联东亚与南洋[trade|e]不可或缺的门户[core|e]。统筹唐船与南蛮商舶既能充实关税[gold|e]，更在东海航线上确立起严密的近海[maritime_presence|e]。"
 oe_msn_jap_07_kyushu_hakata_nagasaki_req_tt:0 "直接或通过属国控制博多与西彼杵（长崎），并拥有海港。"
 oe_msn_jap_08_rising_sun_unity:0 "扶桑一统：旭日列岛完全统一"
 oe_msn_jap_08_rising_sun_unity_desc:0 "自九州港湾至关东平原尽归大一统旗帜，绵延百年的战国乱世终告终结，列岛迎来久违的[stability|e]与统一[legitimacy|e]。诸藩[subjects|e]恪守幕命、四海休兵生息，东瀛[prestige|e]从此令东亚诸国刮目相看。"
 oe_msn_jap_08_rising_sun_unity_req_tt:0 "直接或通过属国控制京都、大阪、丰岛与博多，并拥有至少 8 座海港。"
 oe_msn_jap_09_iwami_ginzan_silver:0 "石见银山（nima）：灰吹法白银巨矿"
 oe_msn_jap_09_iwami_ginzan_silver_desc:0 "石见银山以灰吹法精炼出海量高纯度白银，不仅使国库[gold|e]激增，更成为撬动东亚与南洋[trade|e]的硬通货。官局铸行标准金银通宝可有效平抑[inflation|e]，让矿山银脉化作贯通列岛的持久[prosperity|e]。"
 oe_msn_jap_09_iwami_ginzan_silver_req_tt:0 "直接或通过属国控制迩摩（石见银山），持有至少 300 金币，且月度贸易与税收收入至少 25。"
 oe_msn_jap_10_red_seal_ships:0 "朱印船远航：贯通南洋与马尼拉"
 oe_msn_jap_10_red_seal_ships_desc:0 "持幕府朱印状的武装商船扬帆远航马尼拉、会安与阿瑜陀耶，以日本白银易换南洋生丝香料，开拓万里[trade|e]。远洋壮游既锤炼出熟谙季风的[sailors|e]与[navy_tradition|e]，也令豪商市民的[estate_satisfaction|e]大增。"
 oe_msn_jap_10_red_seal_ships_req_tt:0 "地理大发现时代或之后，直接或通过属国控制西彼杵或博多之一，海军传统至少 15，并拥有干船坞或贸易枢纽。"
 oe_msn_jap_11_rangaku_open_seas:0 "兰学格致与开海近代造船"
 oe_msn_jap_11_rangaku_open_seas_desc:0 "屏弃锁国旧念，长崎兰学书院广译西洋航海、弹道与医理典籍，将泰西格致[advances|e]融入本土[cultural_tradition|e]。凭借高涨的国民[literacy|e]与近代造船工坊，列岛迅速打造出纵横大洋的远海[navy|e]。"
 oe_msn_jap_11_rangaku_open_seas_req_tt:0 "宗教改革时代或之后，直接或通过属国控制西彼杵，稳定度至少 15、首都发展度至少 32，并拥有造船厂或印刷工坊。"
 oe_msn_jap_12_pacific_maritime_hegemon:0 "近代东瀛海洋霸权终极天命"
 oe_msn_jap_12_pacific_maritime_hegemon_desc:0 "依托石见白银金融、开海造船坞与列岛大一统国力，旭日东瀛傲然崛起为睥睨太平洋的近代海洋[great_power|e]。纵横琉球至南洋诸港的[maritime_presence|e]与领先时代的[institutions|e]，为日本铸就耀世不朽的[prestige|e]。"
 oe_msn_jap_12_pacific_maritime_hegemon_req_tt:0 "专制主义时代或之后，直接或通过属国控制京都、丰岛与迩摩，稳定度至少 18，且为列强或月度贸易与税收收入至少 90。"
 oe_msn.1.title:0 "天命加冕"
 oe_msn.1.desc:0 "历经数百年制度革新、疆土经略与商贸文治的层层铸炼，一项史诗级欧亚大国天命任务链终于圆满告成。史官提笔镌刻盛世华章，列国使节齐来致贺。"
 oe_msn.1.a:0 "镌刻不朽史诗，垂范千秋"
 oe_msn.2.title:0 "多极天命共鸣：欧亚群雄盛世"
 oe_msn.2.desc:0 "自地中海、东欧草原直至伊朗高原、印度次大陆与东亚海洋，多座欧亚大帝国先后达成自身历史天命，商旅、典籍与工艺在多极平衡中交相辉映。"
 oe_msn.2.a:0 "共迎欧亚群星璀璨之世"
