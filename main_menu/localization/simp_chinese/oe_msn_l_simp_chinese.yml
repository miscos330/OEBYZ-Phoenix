 oe_msn_ven_02_council_of_ten_req_tt:0 "拥有威尼斯，稳定度至少为12，市民阶层满意度至少为50%，且首都发展度至少为22。"
 oe_msn_ven_03_arsenale_galleass:0 "威尼斯军械库流水船台与巨舰"
 oe_msn_ven_03_arsenale_galleass_desc:0 "高墙环抱的军械库内，熟练工匠沿流水船台依次装配标准化龙骨、缆索与青铜舰炮。高舷重装桨帆战舰数日即可下水，把共和[gold|e]与[buildings|e]优势熔铸为无匹的[navy_tradition|e]与[sailors|e]战力。"
 oe_msn_ven_03_arsenale_galleass_req_tt:0 "处于大发现时代或之后，拥有威尼斯，国库至少250金币、海军传统至少25，并建成船坞或干船坞。"
 oe_msn_ven_04_libro_doro_reform:0 "开放《黄金书》与共和新宪"
 oe_msn_ven_04_libro_doro_reform_desc:0 "向本土豪族与远洋船东有限开放《黄金书》，既为日渐僵化的元老门阀注入活水，又不损共和法统。接纳前沿[institutions|e]促使各[estates|e]在[parliament|e]表决中同心协力，重铸至善共和国的[prestige|e]。"
 oe_msn_ven_04_libro_doro_reform_req_tt:0 "处于宗教改革时代或之后，拥有威尼斯，稳定度至少为15、贵族满意度至少50%，并接纳全球贸易思潮。"
 oe_msn_ven_05_ionian_corfu:0 "扼守爱奥尼亚：科孚与杜布罗夫尼克"
 oe_msn_ven_05_ionian_corfu_desc:0 "雄踞奥特朗托海峡咽喉的科孚岛，是阻截强敌舰队闯入亚得里亚海腹地的铁闸。加固海岬[fort|e]并确立直辖[core|e]，可为爱奥尼亚航道筑牢前进锚地，将共和[maritime_presence|e]与[control|e]推向东方。"
 oe_msn_ven_05_ionian_corfu_req_tt:0 "直接或通过属国控制科孚，且至少拥有4座港口。"
 oe_msn_ven_06_candia_crete:0 "克里特王国：经营干地亚堡垒"
 oe_msn_ven_06_candia_crete_desc:0 "克里特王国乃海洋领地之冠，既出产驰名欧陆的马尔姆齐美酒，又以高耸海墙庇护黎凡特商队。以坚固[fort|e]坐镇干地亚[core|e]，不仅能滋养海岛[prosperity|e]，更让东地中海[navy|e]补给线永不断绝。"
 oe_msn_ven_06_candia_crete_req_tt:0 "直接或通过属国控制干地亚，并在国内拥有至少一座城堡。"
 oe_msn_ven_07_cyprus_sugar_isle:0 "塞浦路斯明珠：尼科西亚与法马古斯塔"
 oe_msn_ven_07_cyprus_sugar_isle_desc:0 "从法马古斯塔棱堡港到尼科西亚沃野，塞浦路斯扼守安纳托利亚、叙利亚与亚历山大之间的航运要冲。将全岛蔗糖与棉花纳入共和[trade|e]，既可充盈[gold|e]并锤炼[navy_tradition|e]，又使东境[core|e]固若金汤。"
 oe_msn_ven_07_cyprus_sugar_isle_req_tt:0 "直接或通过属国控制尼科西亚或法马古斯塔，且海军传统至少为15。"
 oe_msn_ven_08_terraferma_shield:0 "意大利本土盾牌：经略伦巴第"
