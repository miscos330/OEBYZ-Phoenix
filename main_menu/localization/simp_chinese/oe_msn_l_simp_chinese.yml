 STATIC_MODIFIER_DESC_oe_msn_eng_m4:0 "以皇家海军、议会信用与近代工业先声称雄七海，成就日不落海权巅峰。"
 oe_msn_eng_01_london_york:0 "泰晤士与约克：稳固英格兰王冠"
