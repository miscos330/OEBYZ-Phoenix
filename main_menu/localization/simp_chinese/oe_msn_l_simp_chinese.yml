 oe_msn_tur_destiny_BUTTON_TOOLTIP:0 "开启奥斯曼天命"
 oe_msn_tur_destiny_BUTTON_DETAILS:0 "遵循奥斯曼帝国五百年演进脉络：自布尔萨跨越海峡、建立蒂玛尔与耶尼切里军制、铸造乌尔班巨炮、夺取开罗与双圣城哈里发法统，并迈向近世官僚革新。"
 STATIC_MODIFIER_NAME_oe_msn_tur_m1:0 "蒂玛尔骑兵与帝国官僚体系"
