 oe_msn_gen_04_andrea_doria_charter_req_tt:0 "处于宗教改革时代或之后，拥有热那亚，稳定度至少为15，贵族满意度至少50%且市民满意度至少55%。"
 oe_msn_gen_05_chios_maona:0 "爱琴海希俄斯马奥纳商站"
