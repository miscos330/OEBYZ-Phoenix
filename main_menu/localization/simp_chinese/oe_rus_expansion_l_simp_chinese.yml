l_simp_chinese:
 oe_boyar_title_integration: "波雅尔头衔整合"
 oe_boyar_title_integration_desc: "将各公国的波雅尔名位、效忠誓约与世袭权利纳入统一秩序，使地方贵族能够在保全尊荣的同时，接受共同君权。外交吞并效率+20%。"
 oe_rus_mercenary_cost: "三个月收入"
 oe_rus_mercenary_gold_paid: "本次雇佣兵援助已付金币"
 oe_ra_expand_west: "向西方扩张"
 oe_ra_expand_west_desc: "花费25政治影响力与本国三个月收入，取得波罗的、鲁塞尼亚、俄罗斯地区，或芬兰、卡累利阿区域内一处接壤省份的征服宣战理由。接壤可经俄罗斯及其各级附属国；盟友、附属国、宗主国与共主联邦伙伴不可选。冷却六个月。"
 oe_ra_expand_west_cooldown: "向西方扩张"
 oe_ra_build_kremlin: "营建克里姆林宫"
 oe_ra_build_kremlin_desc: "花费本国三个月收入与25政治影响力，在俄罗斯、鲁塞尼亚或大草原的一座本国非首都城市或大都市解锁并修建克里姆林宫。沿用罗斯时期的建筑、五座总上限及五年冷却；原版莫斯科克里姆林宫也计入上限。"
 oe_ra_establish_ukraine: "成立乌克兰总督区"
 oe_ra_establish_ukraine_desc: "直接拥有右岸乌克兰和左岸乌克兰区域的全部可征服地点后，花费50政治影响力与本国六个月收入，在基辅解锁并开工建造一级乌克兰总督府。总督府雇佣1000名贵族，提供本地邻近度+80，并消耗行政维护商品。本行动只能执行一次。"
 oe_ra_establish_south_russia: "成立南俄总督区"
 oe_ra_establish_south_russia_desc: "直接拥有下顿河和阿斯特拉罕区域的全部可征服地点后，花费50政治影响力与本国六个月收入，在萨莱解锁并开工建造一级南俄总督府。总督府雇佣1000名贵族，提供本地邻近度+80，并消耗行政维护商品。本行动只能执行一次。"
 oe_ra_red_square: "红场"
 oe_ra_red_square_desc: "首都的广场既是检阅军队之所，也是宣读法令、接受请愿和举行国家典礼的地方。雇佣1000名劳工，每月消耗石料0.5、工具0.2；国家每月陆军传统+0.1、每月厌战度-0.05、厌战度上限+5。"
 oe_ra_red_square_maintenance: "广场与礼仪设施维护"
 oe_ra_ukrainian_governorate: "乌克兰总督府"
 oe_ra_ukrainian_governorate_desc: "基辅的总督官署统筹第聂伯河两岸的文书、征赋与地方贵族事务。雇佣1000名贵族，提供本地邻近度+80；采用与原版地方总督相同的行政维护配方。"
 oe_ra_ukrainian_governorate_maintenance: "乌克兰总督府行政维护"
 oe_ra_southern_governorate: "南俄总督府"
 oe_ra_southern_governorate_desc: "萨莱的总督官署将顿河下游与伏尔加河沿岸纳入共同的文书与征赋秩序。雇佣1000名贵族，提供本地邻近度+80；采用与原版地方总督相同的行政维护配方。"
 oe_ra_southern_governorate_maintenance: "南俄总督府行政维护"
 oe_russian_ambition.2.t: "俄罗斯的都城"
 oe_russian_ambition.2.d: "诸公国的名号已归于俄罗斯，朝廷却仍须为这个统一的国家确立长久的中心。斯摩棱斯克扼守西方通途，特维尔坐拥伏尔加河商路，莫斯科汇聚王公与教会，诺夫哥罗德保有古老的议会与商贸传统，而基辅则是全罗斯诸城之母与圣索菲亚法统所系。\n\n在我们直接统治的城市中择定都城，并营建一座供军队检阅、诏令宣读与国家典礼使用的红场，让地方名望汇入共同的秩序。"
 oe_russian_ambition.2.smolensk: "以斯摩棱斯克为都城。"
 oe_russian_ambition.2.tver: "以特维尔为都城。"
 oe_russian_ambition.2.moscow: "以莫斯科为都城。"
 oe_russian_ambition.2.novgorod: "以诺夫哥罗德为都城。"
 oe_russian_ambition.2.kyiv: "以基辅为都城。"
 oe_russian_ambition.2.none: "五城尚未归我，暂留现都。"
 oe_ra_western_province: "与俄罗斯或其附属国接壤的西方目标省份"
 oe_ra_area_fully_owned: "区域内全部可征服地点由俄罗斯直接拥有"
 oe_ra_ukraine_ready: "俄罗斯直接拥有右岸与左岸乌克兰的全部可征服地点，且尚未成立乌克兰总督区"
 oe_ra_south_russia_ready: "俄罗斯直接拥有下顿河与阿斯特拉罕的全部可征服地点，且尚未成立南俄总督区"
