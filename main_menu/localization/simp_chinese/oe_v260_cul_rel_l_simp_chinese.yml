l_simp_chinese:
 AUTO_MODIFIER_NAME_oe_assim_tier1_civic_hub: "文教与市政枢纽"
 AUTO_MODIFIER_DESC_oe_assim_tier1_civic_hub: "通达的道路、稳固的控制度与学舍官署共同发挥引力，稳步推动城镇居民融入帝国文化。"
 AUTO_MODIFIER_NAME_oe_assim_tier1b_metropolis_academy: "帝国都会学府热潮"
 AUTO_MODIFIER_DESC_oe_assim_tier1b_metropolis_academy: "高控制度且坐拥大学或高等学院的帝国大都会，是文化整合的旗舰熔炉。"
 AUTO_MODIFIER_NAME_oe_assim_tier2_port_frontier: "海港商埠与边疆屯垦"
 AUTO_MODIFIER_DESC_oe_assim_tier2_port_frontier: "市场通达的繁华港口与正在拓荒的边疆军户区吸引迁徙人口，加速文化交融。"
 AUTO_MODIFIER_NAME_oe_assim_tier3_terrain_friction: "跨区险地与低控阻力"
 AUTO_MODIFIER_DESC_oe_assim_tier3_terrain_friction: "首都大区以外的低控制度乡村或无路山地、沙漠、丛林与极地会拖慢同化进度，修路或提升控制度即可消除。"
 AUTO_MODIFIER_NAME_oe_assim_tier4_faith_unrest_drag: "异教与动荡同化阻力"
 AUTO_MODIFIER_DESC_oe_assim_tier4_faith_unrest_drag: "满意度过低或控制度不足的异教异文化聚落会抵制文化同化，传教或安抚后即可解除。"
 AUTO_MODIFIER_NAME_oe_assim_track_b_foederati_city: "联邦多元都会"
 AUTO_MODIFIER_DESC_oe_assim_track_b_foederati_city: "在多元联邦宪章庇护下的已接受少数文化城市，能提供更高的生产效率、商业影响力与可靠人力。"
 AUTO_MODIFIER_NAME_oe_assim_track_b_foederati_rural: "联邦乡村自治"
 AUTO_MODIFIER_DESC_oe_assim_track_b_foederati_rural: "保有习惯法自治的已接受少数文化乡村分离度更低、征召更稳健，同时温和减缓同化以保留地方特色。"
 AUTO_MODIFIER_NAME_oe_assim_tier2_unitary_romanitas: "一元大罗马公民融合"
 AUTO_MODIFIER_DESC_oe_assim_tier2_unitary_romanitas: "在《卡拉卡拉敕令》一元融合宪章下，各省衍生罗马文化群体正以+50%的本地速度自然汇入帝国主体文化。"
 AUTO_MODIFIER_NAME_oe_assim_pace_historical_auto: "游戏规则：史实缓慢同化与传教"
 AUTO_MODIFIER_DESC_oe_assim_pace_historical_auto: "开局游戏规则生效：强化历史人口惯性，全局文化同化速度-25%，全局宗教传教速度-20%。"
 AUTO_MODIFIER_NAME_oe_assim_pace_active_auto: "游戏规则：积极同化与传教"
 AUTO_MODIFIER_DESC_oe_assim_pace_active_auto: "开局游戏规则生效：加快帝国整合节奏，全局文化同化速度+35%，全局宗教传教速度+25%。"
