 OE_YH_ROUTE_0: "已断"
 OE_YH_ROUTE_X: "未开始"
 STATIC_MODIFIER_NAME_oe_yh_full: "京仓充裕"
 STATIC_MODIFIER_NAME_oe_yh_short: "京师粮荒"
 STATIC_MODIFIER_NAME_oe_yh_famine: "京师大饥"
 STATIC_MODIFIER_NAME_oe_yh_short_dadu: "米价腾贵"
 STATIC_MODIFIER_NAME_oe_yh_famine_dadu: "饿殍载道"
 STATIC_MODIFIER_NAME_oe_yh_closed: "闭门自守"
 STATIC_MODIFIER_NAME_oe_yh_fields: "京畿屯田"
 oe_yh.1.t: "方国珍入海"
 oe_yh.1.desc_x: "#F 至正八年（1348年），台州黄岩人方国珍与兄弟聚众入海，劫夺运粮的海船，海道为之不通（据通说，《元史》卷四十一）。#!\n\n如今，浙东沿海报来消息：方国珍聚众海上，运粮的海船出不了刘家港。是派兵剿捕，还是招安授官？"
 oe_yh.1.a: "发兵捕之"
 oe_yh.1.a.tt: "花费#R 1#!个月的贸易与税收收入\n到1350年底，海道梗阻：每年五月海运到京只得六成。"
 oe_yh.1.b: "招安，授以官职"
 oe_yh.1.b.tt: "海道照常。若日后方国珍又据地与朝廷为敌，海道仍会梗阻。"
 oe_yh.2.t: "海运到京"
 oe_yh.2.desc_wt3r1n: "#F 元代江南的粮食由海道北运：起运于刘家港，收于直沽。天历二年（1329年）一年运到三百三十四万石；至正元年合江南三省所运只得两百八十万石，次年仅两百六十万石（《元史》卷九十三、卷九十七）。#!\n\n今年五月，到京的粮食共#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_arrive')|0]#!万石：海运#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_sea')|0]#!，运河#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_canal')|0]#!，京畿屯田#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_farm')|0]#!，江南输粟#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_warlord')|0]#!。京仓现存#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#!万石，照京师每月用度#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#!万石算，约可支#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#!个月。京仓充裕。海道梗阻，运船多有不到。这是张士诚第一次输粟到京。"
 oe_yh.2.desc_wt3r1o: "#F 元代江南的粮食由海道北运：起运于刘家港，收于直沽。天历二年（1329年），一年运到三百三十四万石（《元史》卷九十三）。#!\n\n今年五月，到京的粮食共#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_arrive')|0]#!万石：海运#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_sea')|0]#!，运河#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_canal')|0]#!，京畿屯田#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_farm')|0]#!，江南输粟#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_warlord')|0]#!。京仓现存#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#!万石，照京师每月用度#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#!万石算，约可支#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#!个月。京仓充裕。海道梗阻，运船多有不到。这是张士诚第一次输粟到京。"
