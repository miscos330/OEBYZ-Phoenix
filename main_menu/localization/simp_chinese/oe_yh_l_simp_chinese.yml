 oe_yh.2.desc_x: "#F 元代江南的粮食由海道北运：起运于刘家港，收于直沽。天历二年（1329年），一年运到三百三十四万石（《元史》卷九十三）。#!\n\n今年五月，到京的粮食共#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_arrive')|0]#!万石：海运#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_sea')|0]#!，运河#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_canal')|0]#!，京畿屯田#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_farm')|0]#!，江南输粟#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_warlord')|0]#!。京仓现存#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#!万石，照京师每月用度#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#!万石算，约可支#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#!个月。"
 oe_yh.2.a: "知道了"
 oe_yh.2.a.tt: "每月京师用度#Y 21#!万石；京仓按可支月数分四档：\n充裕（可支一年以上）：平民的目标满意度#G +5%#!\n告急（可支三至五个月）：平民#R −5%#!；大都动乱#R +0.25#!；每年五月平乱之势#R −2#!、朝议#R −2#!（脱脱当政时）\n饥荒（不足三个月）：平民#R −10%#!、市民#R −5%#!、每月正统#R −0.05#!；大都动乱#R +0.5#!、人口增长#R −0.2%#!；每年五月平乱之势#R −5#!、诸王忠诚#R −2#!"
 oe_yh.3.t: "征粮于张士诚"
 oe_yh.3.desc_hs: "#F 至正十九年（1359年），朝廷遣兵部尚书伯颜帖木儿、户部尚书曹履亨，以御酒、龙衣赐张士诚，命江浙行省丞相达识帖睦迩总督海运：“诏命士诚输粟，国珍具舟”。次年五月，十一万石到京（《元史》卷九十七）。#!\n\n如今，张士诚已受朝廷官爵，据有苏州、松江的地方（归附度为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!）。若遣使命张士诚输粟，张士诚肯照办的机会约为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%。运粮的船也有了着落。"
 oe_yh.3.desc_hn: "#F 至正十九年（1359年），朝廷遣兵部尚书伯颜帖木儿、户部尚书曹履亨，以御酒、龙衣赐张士诚，命江浙行省丞相达识帖睦迩总督海运：“诏命士诚输粟，国珍具舟”。次年五月，十一万石到京（《元史》卷九十七）。#!\n\n如今，张士诚已受朝廷官爵，据有苏州、松江的地方（归附度为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!）。若遣使命张士诚输粟，张士诚肯照办的机会约为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%。可是海道无船：方国珍没有归附，宁波也不在朝廷手里。今年只能作罢。"
 oe_yh.3.desc_gs: "#F 元代京师仰给于江南，每年的粮食由海道北上。如今苏州、松江一带，正是起运之地。#!\n\n如今，张士诚已受朝廷官爵，据有苏州、松江的地方（归附度为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!）。若遣使命张士诚输粟，张士诚肯照办的机会约为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%。运粮的船也有了着落。"
 oe_yh.3.desc_gn: "#F 元代京师仰给于江南，每年的粮食由海道北上。如今苏州、松江一带，正是起运之地。#!\n\n如今，张士诚已受朝廷官爵，据有苏州、松江的地方（归附度为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!）。若遣使命张士诚输粟，张士诚肯照办的机会约为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%。可是海道无船：方国珍没有归附，宁波也不在朝廷手里。今年只能作罢。"
 oe_yh.3.a: "遣使赐御酒龙衣，命士诚输粟、国珍具舟"
 oe_yh.3.a.tt: "花费#R 1#!个月的贸易与税收收入\n按上面的机会掷骰。成：今年五月江南输粟#G +11#!万石（以后每年多一万，至多#Y 13#!万）；张士诚的归附度#R −5#!；平乱之势#G +2#!、朝议#G +2#!（脱脱当政时）。\n不成：张士诚托辞拒命，下月再议。"
 oe_yh.3.b: "今年不遣"
 oe_yh.3.b.tt: "今年没有江南的粮食。"
 oe_yh.4.t: "士诚托辞拒命"
 oe_yh.4.desc_h2: "#F 至正二十三年（1363年）九月，朝廷再遣使征粮，张士诚托辞不与。东南的粮食供给京师，到这一年就断了（《元史》卷九十七）。#!\n\n如今，张士诚与朝廷日渐疏远（归附度已不足五十），今年的粮食不会再来了。"
 oe_yh.4.desc_h1: "#F 至正二十三年（1363年）九月，朝廷再遣使征粮，张士诚托辞不与。东南的粮食供给京师，到这一年就断了（《元史》卷九十七）。#!\n\n如今，遣去征粮的使者空手而回：张士诚推说海上风涛不定、仓廪空虚。"
 oe_yh.4.desc_g2: "#F 江南的军阀受了朝廷的官爵，却未必肯把粮食送往北方：每一船粮，都是军阀自己的兵饷。#!\n\n如今，张士诚与朝廷日渐疏远（归附度已不足五十），今年的粮食不会再来了。"
 oe_yh.4.desc_g1: "#F 江南的军阀受了朝廷的官爵，却未必肯把粮食送往北方：每一船粮，都是军阀自己的兵饷。#!\n\n如今，遣去征粮的使者空手而回：张士诚推说海上风涛不定、仓廪空虚。"
 oe_yh.4.a: "加官笼络"
 oe_yh.4.a.tt: "花费#R 2#!个月的贸易与税收收入\n张士诚的归附度#G +15#!；明年二月可以再向张士诚征粮。"
 oe_yh.4.b: "听之"
 oe_yh.4.b.tt: "不再向张士诚征粮，直到吴离开朝廷后又重新归附。"
 oe_yh.5.t: "京师大饥"
 oe_yh.5.desc_h: "#F 至正十八年（1358年），京师大饥，又有疫病；宦官朴不花出钱收葬死者（一说，《元史》卷四十五、卷二〇四）。#!\n\n如今，京仓现存#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#!万石，照京师每月用度#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#!万石算，约可支#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#!个月。米价腾贵，城中已有饿死的人。"
 oe_yh.5.desc_g: "#F 京城的人口仰给于外，一旦粮道不通，饥荒就在眼前。#!\n\n如今，京仓现存#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#!万石，照京师每月用度#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#!万石算，约可支#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#!个月。米价腾贵，城中已有饿死的人。"
 oe_yh.5.a: "开仓减价粜，和籴补仓"
 oe_yh.5.a.tt: "花费#R 3#!个月的贸易与税收收入\n京仓#G +30#!万石。"
 oe_yh.5.b: "开仓减价粜，以钞和籴"
 oe_yh.5.b.tt: "花费#R 5#!个月的贸易与税收收入\n钞法大坏，商人不肯收钞，和籴要多花钱。\n京仓#G +30#!万石。"
 oe_yh.5.c: "令寺观、富户输粟"
 oe_yh.5.c.tt: "京仓#G +20#!万石。"
 oe_yh.5.d: "闭门自守"
 oe_yh.5.d.tt: "大都动乱#R +0.3#!，持续#Y 12#!个月（#bold #color_yellow 闭门自守#!#!）。"
 oe_yh.6.t: "京畿屯田"
 oe_yh.6.desc_ht: "#F 至正十二年（1352年），丞相脱脱请在京畿立分司农司，招募江南会种水田的人来屯种：西起西山，南到保定、河间，北抵檀、顺，东至迁民镇（据通说，《元史》卷一三八、卷四十三）。#!\n\n如今，京仓仰赖海道，而海道越来越难。若在京畿屯田，要先拿出一大笔钱。丞相脱脱力主此议。"
 oe_yh.6.desc_hx: "#F 至正十二年（1352年），丞相脱脱请在京畿立分司农司，招募江南会种水田的人来屯种：西起西山，南到保定、河间，北抵檀、顺，东至迁民镇（据通说，《元史》卷一三八、卷四十三）。#!\n\n如今，京仓仰赖海道，而海道越来越难。若在京畿屯田，要先拿出一大笔钱。"
 oe_yh.6.desc_gt: "#F 京城的粮食全靠南方运来。有人建议在京畿开垦水田，就近取粮。#!\n\n如今，京仓仰赖海道，而海道越来越难。若在京畿屯田，要先拿出一大笔钱。丞相脱脱力主此议。"
 oe_yh.6.desc_gx: "#F 京城的粮食全靠南方运来。有人建议在京畿开垦水田，就近取粮。#!\n\n如今，京仓仰赖海道，而海道越来越难。若在京畿屯田，要先拿出一大笔钱。"
 oe_yh.6.a: "立分司农司，募江南农人"
 oe_yh.6.a.tt: "花费#R 6#!个月的贸易与税收收入\n以后每年五月京畿屯田到京#G +40#!万石（大元须拥有并控制大都和京畿#Y 10#!处以上的地方；丢了就荒废）。\n顺天、通州两府每月粮食产出#G +10%#!（#bold #color_yellow 京畿屯田#!#!，#Y 30#!年）。"
 oe_yh.6.b: "不行"
 oe_yh.6.b.tt: "京城照旧仰给于南方。"
 oe_yh.20.t: "海运与漕粮：选项生效"
