l_simp_chinese:
 oe_osmaris_basil_name: "巴西尔"
 oe_osmaris_lightning_merchant: "闪电行商"
 oe_flavor_byz.1007.t: "奥斯马里斯：闪电行商巴西尔"
 oe_flavor_byz.1007.d: "（原名：巴耶济德一世）\n\n奥斯马里斯家的巴西尔自幼便对码头比对校场更感兴趣。他能在香料袋与呢绒卷之间站上半日，听船主争论风向，听行商比较各地的物价。旁人谈论一座城市的城墙时，他却总先问起通往那里的道路、渡口和集市。\n\n这些好奇后来变成了一张横贯帝国的贸易网络。巴西尔在港口雇用代理，在内陆设立货栈，让往来商队与沿岸船只彼此接续；一封从首都发出的信函，可以沿着熟悉的柜台、账房与驿站传到帝国另一端。他要求货物按期交付，账目当日结清，又敢在旁人犹豫时先行订下整季的货运。商人们于是半带敬意、半带抱怨地称他为“闪电行商”。\n\n如今，装满货物的车船与日渐丰厚的账册一同证明了他的本领。这些商路能够为帝国带来更多财富；至于财富应先留在市场，还是先经过税吏之手，仍要听取皇帝的裁断。"
 oe_flavor_byz.1007.a: "鼓励他经商。"
 oe_flavor_byz.1007.a.tt: "获得#Y 巴西尔的帝国商路#!，持续#G 20年#!：出售效率#G +10%#!。\n$oe_osmaris_house_reward_50_tt$\n在君士坦丁堡金角湾港区解锁#Y 奥斯曼公司#!，立即免费建成#G 1级#!。"
 oe_flavor_byz.1007.b: "从这些贸易中征收更多税款。"
 oe_flavor_byz.1007.b.tt: "获得#Y 巴西尔的商路税契#!，持续#G 20年#!：市民阶层征税上限#G +5%#!。\n$oe_osmaris_house_reward_50_tt$\n在君士坦丁堡金角湾港区解锁#Y 奥斯曼公司#!，立即免费建成#G 1级#!。"
 oe_osmaris_house_reward_50_tt: "若奥斯马里斯已是豪族，影响力#G +50#!；否则成为豪族，并获得额外豪族名额#G +1#!（同一家族不重复增加）。"
 oe_flavor_byz.1007.lapsed: "这份商路奏议已无法照办。"
 oe_flavor_byz.1007.lapsed.tt: "巴西尔或家族的状态已经改变，不再发放修正、影响力或名额奖励。"
 oe_flavor_byz.1007.historical_info: "巴耶济德一世生于1354年，1389—1402年统治奥斯曼国家，以“闪电”之名闻名。他扩张在巴尔干与安纳托利亚的领土，1396年在尼科波利斯击败十字军，后于1402年的安卡拉战役中败于帖木儿并被俘。本事件将他的迅捷作风改写为罗马商人的经营才能。"
 oe_flavor_byz.1008.t: "奥斯马里斯：闪电行商的赎金"
 oe_flavor_byz.1008.d: "（原名：巴耶济德一世）\n\n自从御前认可了巴西尔的商路奏议，他的货栈与商队便愈加紧密地联结起来。如今，他仍不肯只坐在账房里等待消息，而要亲自巡看边地的交易。只是这一次，他所熟悉的道路已经通向帖木儿军队控制的土地。\n\n逃回的随从带来噩耗：商队遭到截留，货物被封存，巴西尔也落入了对方手中。那位以决断迅速闻名的行商，如今再快也无法越过看守的刀锋。随后抵达首都的使者提出条件：交出相当于帝国三个月收入的赎金，才能让他平安归来。\n\n账册上的损失尚可重新弥补，人的性命却只有一次。国库是否应为奥斯马里斯家的这场灾祸开门？"
 oe_flavor_byz.1008.a: "真是一出悲剧。"
 oe_flavor_byz.1008.a.tt: "#R 巴西尔在囚禁中死去。#!"
 oe_flavor_byz.1008.b: "我们可以支付赎金。"
 oe_flavor_byz.1008.b.tt: "国库失去#R 三个月国家总收入#!，合计#R [SCOPE.GetValue('oe_osmaris_basil_ransom')|2]#!金币。\n#G 巴西尔获释并生还。#!"
 oe_flavor_byz.1008.lapsed: "这封赎金书已经来得太迟。"
 oe_flavor_byz.1008.lapsed.tt: "巴西尔已不符合处理条件，不再扣除赎金，也不重复处理死亡。"
 oe_flavor_byz.1008.historical_info: "1402年，巴耶济德一世在安卡拉战役中被帖木儿击败并俘获，次年在囚禁中去世。商队被截及东罗马支付赎金救回巴西尔，均为本模组设计的架空分支。"
