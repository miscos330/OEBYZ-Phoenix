 oe_chr.5.b:0 "展开完整典藏编年史细阅"
 oe_chr.6.title:0 "第四百年回眸：启蒙灯塔与列强霸权"
 oe_chr.6.desc:0 "四百载基业巍然，全球四维霸权竞逐与欧亚均势博弈正步入白热化。[ROOT.GetCountry.Custom('OeChrColTraditionTitle')]录得 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 18 项里程碑，本世纪断面疆域 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c4_locs')|0]#! 城，月岁入 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c4_inc')|0]#! 金。"
 oe_chr.6.a:0 "勒石铭记百载辉煌"
 oe_chr.6.b:0 "展开完整典藏编年史细阅"
 oe_chr.7.title:0 "世纪交锋回眸：大革命浪潮与终局前夜"
 oe_chr.7.desc:0 "十九世纪钟声敲响，距五百年典藏封卷大典仅余三十六载。[ROOT.GetCountry.Custom('OeChrColTraditionTitle')]记下当前功业：已镌刻 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / 18 项里程碑，疆域 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c5_locs')|0]#! 城，月岁入 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_c5_inc')|0]#! 金。"
 oe_chr.7.a:0 "勒石铭记百载辉煌"
 oe_chr.7.b:0 "展开完整典藏编年史细阅"
 oe_chr.8.title:0 "霸权巅峰与终局大战勒石纪功"
 oe_chr.8.desc:0 "[ROOT.GetCountry.Custom('OeChrColChroniclerTitle')]恭奏陛下：帝国在后期四维霸权竞逐或欧亚终局大战中的赫赫功业，已正式录入[ROOT.GetCountry.Custom('OeChrColTraditionTitle')]核心本纪！峰值霸权达 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_heg')|0]#! 维，终局角色为[ROOT.GetCountry.Custom('OeChrColEndgameRole')]，特请敕建纪功碑以昭后世。"
 oe_chr.8.a:0 "立碑纪功，永垂丹青"
 oe_chr.9.title:0 "一八三六典藏终局大典：[ROOT.GetCountry.Custom('OeChrColTraditionTitle')]封卷定评"
 oe_chr.9.desc_header:0 "#T 五百年史诗封卷定评（1337–1836）#!\n#T 最终评级#!：[ROOT.GetCountry.Custom('OeChrColGradeLabel')]  ｜  #T 镌刻里程碑#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / #Y 18#!\n#T 历史疆域峰值#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_locs')|0]#! 城  ｜  #T 霸权峰值#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_heg')|0]#! 维  ｜  #T 终局角色#!：[ROOT.GetCountry.Custom('OeChrColEndgameRole')]\n\n"
 oe_chr.9.desc_s:0 "史官齐声赞颂：自中世纪末叶至近代黎明，本朝竟成就十五项以上传世伟业，贯通欧亚商路、平抑大疫与熵增、傲立霸权与终局大战之巅！凤凰涅槃之辉煌将永耀世界文明史册。"
 oe_chr.9.desc_a:0 "史官秉笔直书：五百年间镌刻十一至十四项辉煌里程碑，本朝以卓越武功、治道与声教定义了一个时代，堪称冠绝欧亚的盛世强权。"
 oe_chr.9.desc_b:0 "史官公正论定：历经五百年列强争锋与惊涛骇浪，本朝达成七至十项关键伟业，屹立于世界重要强国之林，功绩足堪告慰先祖。"
 oe_chr.9.desc_c:0 "史官含敬纪功：在严苛地缘竞争与时代危机中，本朝百折不挠、保境安民，留下四至六项弥足珍贵之史迹，赢得后世敬重。"
 oe_chr.9.desc_d:0 "史官慨然落笔：纵然五百年风云险恶、诸多宏图未竟，然本朝国脉未断、火种犹存，静待新时代再书华章。"
 oe_chr.9.a:0 "御印封卷，永垂万世"
 oe_chr.10.title:0 "敕修帝国国史馆秘档"
 oe_chr.10.desc:0 "[ROOT.GetCountry.Custom('OeChrColChroniclerTitle')]禀报：历代诏敕、外交盟约、海图商簿与抗疫法典堆积如山，亟需拨款修缮藏书楼并校勘编目，以便将本朝五百年史事完整传世。"
 oe_chr.10.a:0 "拨款八十金重修秘档（提升威望、文化传统与科研）"
 oe_chr.10.b:0 "国用紧迫，暂缓兴修"
 oe_chr.90.title:0 "【诊断】Slot 87 典藏帝国编年史读数（oe_chr_）"
 oe_chr.90.desc:0 "#T Slot 87 零碰撞隔离验证#!：独立文件 `oe_chr_collector_*`，绝不触碰 v7.3 `oe_chronicle.*`\n#T 全局初始化#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_init')|0]#!  ｜  #T 修史体例代码（1–4）#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_tradition_code')|0]#!（[ROOT.GetCountry.Custom('OeChrColTraditionTitle')]）\n#T 已解锁里程碑#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / #Y 18#!  ｜  #T 实时总评#!：[ROOT.GetCountry.Custom('OeChrColGradeLabel')]\n#T 峰值疆域#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_locs')|0]#!  ｜  #T 峰值霸权#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_peak_heg')|0]#!  ｜  #T 1836 封卷状态#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_rd_verdict_done')|0]#!\n#T 终局角色#!：[ROOT.GetCountry.Custom('OeChrColEndgameRole')]"
 oe_chr.90.a:0 "关闭读数面板"
