 oe_chr.2.title:0 "敕定国史馆修史体例"
 oe_chr.2.desc:0 "四大古典与近世文明各具辉煌的官方修史传统：拜占庭与东正世界尊奉《帝国年代纪》（Chronographia），中华与东亚圈纂修严谨编年之《帝国实录》（Shilu），奥斯曼、波斯与马穆鲁克宫廷常设御前正史官《宫廷史官录》（Vakanüvis），西欧与拉丁大西洋诸邦则以《皇家编年史》（Annales Regni）与国书档案馆勒石垂范。陛下欲以何种体例编纂本朝五百年正史？"
