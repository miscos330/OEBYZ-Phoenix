l_simp_chinese:
 ARTIST_TYPE_NAME_oe_imperial_mosaicist: "帝国金箔镶嵌画师"
 ARTIST_TYPE_DESC_oe_imperial_mosaicist: "精研金箔玻璃细嵌与穹顶圣像壁画的宫廷大师，为大教堂与帝宫赋予永恒光彩，提升国家文化传统与宗教影响力。"
 ARTIST_TYPE_NAME_oe_court_astronomer: "钦天监宫廷天算师"
 ARTIST_TYPE_DESC_oe_court_astronomer: "司掌观象授时、星历编算与大地测绘的宫廷天算大师，广泛活跃于欧亚各大观象台与大学，显著加速科研与思潮传播。"
 oe_wnd_imperial_wonder: "欧亚不朽建筑奇观"
 oe_wnd_imperial_wonder_desc: "由大国倾力营建、巍然屹立于欧亚名城的传世建筑奇观杰作，不可被攻城劫掠，长久滋养当地识字、思潮传播与帝国文化传统。"
 oe_wnd_grand_codex: "传世大典巨著"
 oe_wnd_grand_codex_desc: "集数代鸿儒、天算师与航海家心血校勘装帧的传世典籍巨著，兼备极高馆藏价值与科研增益，若城破则可能流转易主。"
 oe_wnd_hagia_sophia_dome: "圣索菲亚大穹顶大修工程"
 oe_wnd_hagia_sophia_dome_desc: "加固圣索菲亚大教堂宏伟穹顶与镶嵌金箔圣像壁画，令博斯普鲁斯海峡之畔的礼拜中心历久弥新，彰显普世宗主教座的威仪与工匠绝艺。"
 oe_wnd_hagia_sophia_dome_maint: "圣索菲亚大穹顶大修工程（常年修缮）"
 oe_wnd_art_hagia_sophia_dome: "《圣索菲亚大穹顶全金圣像壁画》"
 oe_wnd_art_hagia_sophia_dome_desc: "以千万枚金箔玻璃细嵌而成的穹顶全能基督像与天使圣班，在穹窗日光下熠熠生辉，成为地中海与黑海世界膜拜的建筑丰碑。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_hagia_sophia_dome: "圣索菲亚大穹顶大修工程"
 AUTO_MODIFIER_DESC_oe_wnd_wb_hagia_sophia_dome: "加固圣索菲亚大教堂宏伟穹顶与镶嵌金箔圣像壁画，令博斯普鲁斯海峡之畔的礼拜中心历久弥新，彰显普世宗主教座的威仪与工匠绝艺。"
 oe_wnd_theodosian_bastion_ring: "狄奥多西三重城墙近代棱堡化"
 oe_wnd_theodosian_bastion_ring_desc: "在古老的狄奥多西三重城垣外廓加筑低矮厚重的几何棱堡与火炮掩体，使千年帝都城防成功跨越火药攻城时代的考验，并与原版城垣互补长存。"
 oe_wnd_theodosian_bastion_ring_maint: "狄奥多西三重城墙近代棱堡化（常年修缮）"
 oe_wnd_art_theodosian_walls_chronicle: "《狄奥多西三重棱堡筑城志与图碑》"
 oe_wnd_art_theodosian_walls_chronicle_desc: "镌刻于金门瓮城石廊的筑城纪略与几何弹道图谱，记录了将古典砖石高墙改造成近代火炮棱堡体系的军事工程奇迹。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_theodosian_bastion_ring: "狄奥多西三重城墙近代棱堡化"
 AUTO_MODIFIER_DESC_oe_wnd_wb_theodosian_bastion_ring: "在古老的狄奥多西三重城垣外廓加筑低矮厚重的几何棱堡与火炮掩体，使千年帝都城防成功跨越火药攻城时代的考验，并与原版城垣互补长存。"
 oe_wnd_dadu_observatory_archive: "大都观象台与御书大典楼"
 oe_wnd_dadu_observatory_archive_desc: "承袭郭守敬简仪、高表与回回司天台之遗规，于大都营建铜仪观象高台与万卷御书藏经楼，融汇中原授时历法与西域星算之长，编纂传世大典。"
 oe_wnd_dadu_observatory_archive_maint: "大都观象台与御书大典楼（常年修缮）"
 oe_wnd_art_zhizheng_grand_canon: "《大都御制授时星历大典》"
 oe_wnd_art_zhizheng_grand_canon_desc: "集百名儒士与西域天算家历年校勘而成的鸿篇巨帙，兼收经史典章、农桑水利与精密星历表，装帧考究，藏于大都御书楼秘阁。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_dadu_observatory_archive: "大都观象台与御书大典楼"
 AUTO_MODIFIER_DESC_oe_wnd_wb_dadu_observatory_archive: "承袭郭守敬简仪、高表与回回司天台之遗规，于大都营建铜仪观象高台与万卷御书藏经楼，融汇中原授时历法与西域星算之长，编纂传世大典。"
 oe_wnd_kremlin_white_stone: "莫斯科白石克里姆林与红砖扩建"
 oe_wnd_kremlin_white_stone_desc: "以米亚奇科沃白石筑基、窑烧红砖加厚高塔与燕尾垛口，将莫斯科河畔的公国堡垒升格为统摄全罗斯的巍峨王城，与原版克里姆林互补并立。"
 oe_wnd_kremlin_white_stone_maint: "莫斯科白石克里姆林与红砖扩建（常年修缮）"
 oe_wnd_art_white_stone_kremlin: "《白石克里姆林与全罗斯王城圣壁》"
 oe_wnd_art_white_stone_kremlin_desc: "高耸于莫斯科河弯道之上的白石基座、红砖钟楼与鎏金洋葱头穹顶群落，凝结罗斯工匠与南欧筑城师的共同心血，象征北方王权的长存。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_kremlin_white_stone: "莫斯科白石克里姆林与红砖扩建"
 AUTO_MODIFIER_DESC_oe_wnd_wb_kremlin_white_stone: "以米亚奇科沃白石筑基、窑烧红砖加厚高塔与燕尾垛口，将莫斯科河畔的公国堡垒升格为统摄全罗斯的巍峨王城，与原版克里姆林互补并立。"
 oe_wnd_samarkand_registan: "撒马尔罕雷吉斯坦经学院与星台"
 oe_wnd_samarkand_registan_desc: "以钴蓝琉璃砖砌就宏伟伊万拱门，并在城郊高岗凿建巨型大理石六分仪星台，令撒马尔罕成为贯通波斯、突厥、印度与中原的丝路学术明珠。"
 oe_wnd_samarkand_registan_maint: "撒马尔罕雷吉斯坦经学院与星台（常年修缮）"
 oe_wnd_art_zij_i_sultani: "《苏丹星表》（撒马尔罕天算大成）"
 oe_wnd_art_zij_i_sultani_desc: "由撒马尔罕观象台以巨型大理石弧仪实测千余颗恒星方位与三角函数表编成，精确度冠绝当时欧亚星算界。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_samarkand_registan: "撒马尔罕雷吉斯坦经学院与星台"
 AUTO_MODIFIER_DESC_oe_wnd_wb_samarkand_registan: "以钴蓝琉璃砖砌就宏伟伊万拱门，并在城郊高岗凿建巨型大理石六分仪星台，令撒马尔罕成为贯通波斯、突厥、印度与中原的丝路学术明珠。"
 oe_wnd_new_alexandria_library: "亚历山大新图书馆"
 oe_wnd_new_alexandria_library_desc: "在托勒密古馆故址重建大理石柱廊与恒温书库，广搜希腊、拉丁、阿拉伯、科普特与东方典籍并组织对译校勘，重燃地中海知识灯塔。"
 oe_wnd_new_alexandria_library_maint: "亚历山大新图书馆（常年修缮）"
 oe_wnd_art_new_alexandria_scrolls: "《亚历山大新馆百代合璧丛书》"
 oe_wnd_art_new_alexandria_scrolls_desc: "汇集几何、医术、航海图志与古典哲学的羊皮纸与麻纸对译大合集，令失散千年的地中海学术脉络重归一堂。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_new_alexandria_library: "亚历山大新图书馆"
 AUTO_MODIFIER_DESC_oe_wnd_wb_new_alexandria_library: "在托勒密古馆故址重建大理石柱廊与恒温书库，广搜希腊、拉丁、阿拉伯、科普特与东方典籍并组织对译校勘，重燃地中海知识灯塔。"
 oe_wnd_azhar_grand_college: "开罗爱资哈尔大书院扩建院"
 oe_wnd_azhar_grand_college_desc: "在开罗千年讲学传统之上扩建分科经院、律法讲堂与多语注疏馆，与原版爱资哈尔经学院互补并荣，庇护尼罗河流域的学术与教法权威。"
 oe_wnd_azhar_grand_college_maint: "开罗爱资哈尔大书院扩建院（常年修缮）"
 oe_wnd_art_azhar_encyclopedia: "《爱资哈尔法理与万学总纂》"
 oe_wnd_art_azhar_encyclopedia_desc: "由尼罗河畔诸派大经师合纂的律法、修辞、历法与地志全书，成为沟通北非、黎凡特与红海诸邦的思想准绳。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_azhar_grand_college: "开罗爱资哈尔大书院扩建院"
 AUTO_MODIFIER_DESC_oe_wnd_wb_azhar_grand_college: "在开罗千年讲学传统之上扩建分科经院、律法讲堂与多语注疏馆，与原版爱资哈尔经学院互补并荣，庇护尼罗河流域的学术与教法权威。"
 oe_wnd_san_giorgio_bank: "热那亚圣乔治银行总行"
 oe_wnd_san_giorgio_bank_desc: "整合公债托管、汇票清算与海运保险于一体的地中海金融中枢，以严密复式簿记与金银储备大幅压低国家借贷利率并拓展远洋商路。"
 oe_wnd_san_giorgio_bank_maint: "热那亚圣乔治银行总行（常年修缮）"
 oe_wnd_art_san_giorgio_ledger: "《圣乔治银行复式总账与海商汇兑法典》"
 oe_wnd_art_san_giorgio_ledger_desc: "以羊皮纸精装的复式会计总账范本与海运汇票契约全编，确立了跨国信贷清算与主权公债管理的近代金融典范。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_san_giorgio_bank: "热那亚圣乔治银行总行"
 AUTO_MODIFIER_DESC_oe_wnd_wb_san_giorgio_bank: "整合公债托管、汇票清算与海运保险于一体的地中海金融中枢，以严密复式簿记与金银储备大幅压低国家借贷利率并拓展远洋商路。"
 oe_wnd_hangzhou_canal_hub: "杭州大运河漕运总枢与万国市舶馆"
 oe_wnd_hangzhou_canal_hub_desc: "疏浚京杭运河南端复闸水柜，并建大型漕仓与万国市舶货栈，将江南鱼米丝茶源源不断输往北国京畿与海外诸港，商帆蔽水。"
 oe_wnd_hangzhou_canal_hub_maint: "杭州大运河漕运总枢与万国市舶馆（常年修缮）"
 oe_wnd_art_hangzhou_scroll: "《临安运河万国商帆长卷》"
 oe_wnd_art_hangzhou_scroll_desc: "长达数丈的设色绢本风俗画卷，纤毫毕现地描绘了钱塘江口与大运河闸桥之间百货云集、万商辐辏的盛世画卷。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_hangzhou_canal_hub: "杭州大运河漕运总枢与万国市舶馆"
 AUTO_MODIFIER_DESC_oe_wnd_wb_hangzhou_canal_hub: "疏浚京杭运河南端复闸水柜，并建大型漕仓与万国市舶货栈，将江南鱼米丝茶源源不断输往北国京畿与海外诸港，商帆蔽水。"
 oe_wnd_baghdad_house_of_wisdom: "巴格达新智慧宫译经院"
 oe_wnd_baghdad_house_of_wisdom_desc: "在底格里斯河畔浴火重生的巴格达重建译经与科学总院，汇聚阿拉伯、波斯、叙利亚、希腊与印度学脉，令两河流域重现黄金时代学术荣光。"
 oe_wnd_baghdad_house_of_wisdom_maint: "巴格达新智慧宫译经院（常年修缮）"
 oe_wnd_art_new_bayt_al_hikma: "《新智慧宫格物译经全集》"
 oe_wnd_art_new_bayt_al_hikma_desc: "由巴格达新智慧宫诸语译师与医算名家合力编定，涵盖代数、光学、本草与星盘制造之精义，重续两河千年文脉。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_baghdad_house_of_wisdom: "巴格达新智慧宫译经院"
 AUTO_MODIFIER_DESC_oe_wnd_wb_baghdad_house_of_wisdom: "在底格里斯河畔浴火重生的巴格达重建译经与科学总院，汇聚阿拉伯、波斯、叙利亚、希腊与印度学脉，令两河流域重现黄金时代学术荣光。"
 oe_wnd_delhi_imperial_observatory: "德里御用星台与大书库"
 oe_wnd_delhi_imperial_observatory_desc: "以红砂岩与白大理石构筑巨型日晷仪座与御藏书楼，兼蓄波斯星算与梵文数理历法，为印度斯坦的农时测算、田赋清丈与宫廷学术提供准据。"
 oe_wnd_delhi_imperial_observatory_maint: "德里御用星台与大书库（常年修缮）"
 oe_wnd_art_delhi_astronomical_tables: "《德里御制梵波合璧星历图谱》"
 oe_wnd_art_delhi_astronomical_tables_desc: "以波斯文与梵文对照校订的精密历算与地理经纬图谱，既指导季风农事，亦成为南亚宫廷书库镇馆之宝。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_delhi_imperial_observatory: "德里御用星台与大书库"
 AUTO_MODIFIER_DESC_oe_wnd_wb_delhi_imperial_observatory: "以红砂岩与白大理石构筑巨型日晷仪座与御藏书楼，兼蓄波斯星算与梵文数理历法，为印度斯坦的农时测算、田赋清丈与宫廷学术提供准据。"
 oe_wnd_quanzhou_maritime_beacon: "泉州刺桐港海丝总灯塔与万国番坊"
 oe_wnd_quanzhou_maritime_beacon_desc: "于刺桐港入海岬角筑起石砌高塔夜燃明灯，并修整万国番坊与针路测绘署，引导大食、波斯、天竺与南洋巨舶安抵东方第一大港。"
 oe_wnd_quanzhou_maritime_beacon_maint: "泉州刺桐港海丝总灯塔与万国番坊（常年修缮）"
 oe_wnd_art_citong_rutters: "《刺桐港万国海道针经图志》"
 oe_wnd_art_citong_rutters_desc: "汇集泉州老舵工与阿拉伯航海家口述校勘的印度洋—南海牵星过洋针路图，详载季风潮汐、暗礁港湾与万国市价。"
 AUTO_MODIFIER_NAME_oe_wnd_wb_quanzhou_maritime_beacon: "泉州刺桐港海丝总灯塔与万国番坊"
 AUTO_MODIFIER_DESC_oe_wnd_wb_quanzhou_maritime_beacon: "于刺桐港入海岬角筑起石砌高塔夜燃明灯，并修整万国番坊与针路测绘署，引导大食、波斯、天竺与南洋巨舶安抵东方第一大港。"
 oe_wnd_imperial_holy_seat: "帝国大法座圣地"
 oe_wnd_imperial_holy_seat_desc: "兼具政教威望与万民朝圣向心力的欧亚最高圣座，不仅滋养当地教士学养与繁荣，更赋予掌控国持久的宗教影响力与统治稳固。"
 oe_wnd_holy_potala_lhasa: "拉萨布达拉与大昭圣座"
 oe_wnd_holy_potala_lhasa_desc: "巍立雪域高原之巅的拉萨大昭寺与红山法座，为藏传佛教、大乘佛教与三教朝廷共尊的雪域圣地，亦是宣政院与羁縻护持的信仰枢纽。"
 oe_wnd_holy_moscow_dormition: "莫斯科圣母升天大座堂"
 oe_wnd_holy_moscow_dormition_desc: "罗斯全境都主教与沙皇加冕的核心圣堂，随莫斯科白石王城兴起而成为北方正教世界的精神锚点。"
 oe_wnd_holy_samarkand_shahi_zinda: "撒马尔罕沙赫静达圣陵群"
 oe_wnd_holy_samarkand_shahi_zinda_desc: "沿阿夫拉西阿卜古丘错落排布的琉璃瓷砖陵寝圣廊，相传供奉圣门弟子库萨姆·伊本·阿巴斯，为中亚丝路穆斯林朝圣胜地。"
 AUTO_MODIFIER_NAME_oe_wnd_pentarchy_partial: "五牧首区半璧共辉（3/5）"
 AUTO_MODIFIER_DESC_oe_wnd_pentarchy_partial: "正教国家已实控君士坦丁堡、罗马、亚历山大、安条克、耶路撒冷五大古牧首区中的至少三处，普世教会的威望与归化之力随之大振。"
 AUTO_MODIFIER_NAME_oe_wnd_pentarchy_full: "五牧首区全璧归一（5/5）"
 AUTO_MODIFIER_DESC_oe_wnd_pentarchy_full: "五大古牧首区尽归正教一统，昔日尼西亚与迦克墩公会议的普世教会荣光重现人间，赋予帝国无可匹敌的宗教权威与正统性。"
 AUTO_MODIFIER_NAME_oe_wnd_mount_athos_guardian: "阿索斯圣山守护者"
 AUTO_MODIFIER_DESC_oe_wnd_mount_athos_guardian: "守护阿索斯圣山诸大修道院与抄经古藏的正教君主，得以借圣山修道传统滋养全国教士识字与民心安定。"
 AUTO_MODIFIER_NAME_oe_wnd_two_holy_mosques_custodian: "两圣地守护者（麦加/麦地那）"
 AUTO_MODIFIER_DESC_oe_wnd_two_holy_mosques_custodian: "同时执掌麦加天房与麦地那先知清真寺的伊斯兰强权，享有至高无上的朝觐护法尊号、威望与外交号召力。"
 AUTO_MODIFIER_NAME_oe_wnd_snowland_dharma_patron: "雪域法王护持（拉萨）"
 AUTO_MODIFIER_DESC_oe_wnd_snowland_dharma_patron: "直接掌控或经由羁縻附庸护持拉萨布达拉圣座的帝国朝廷，得以法王教化安抚边疆诸部，兼增异教宽容与附庸忠诚。"
 oe_order_constantinian_st_george: "君士坦丁圣乔治骑士团"
 oe_order_constantinian_st_george_desc: "托名君士坦丁大帝军旗圣徽而设立的帝国御前骑士团，专授予复国功臣、名将与忠贞贵族，以金链十字勋章维系军区与宫廷的尚武荣誉。"
 oe_order_varangian_brotherhood: "瓦兰吉兄弟会"
 oe_order_varangian_brotherhood_desc: "承继昔日拜占庭皇帝战斧亲卫与罗斯—北欧武士誓约的铁血骑士兄弟会，以严明军纪与誓死效忠著称，专纳善战将领与王室近卫。"
 oe_order_holy_sepulchre_guard: "耶路撒冷圣墓卫队"
 oe_order_holy_sepulchre_guard_desc: "光复耶路撒冷圣城后设立的护教骑士团，兼融武德与牧灵之责，护卫朝圣商道与圣地城垣，为受勋的贵族、教士与将领赋予崇高声望。"
 oe_order_danube_dragon: "多瑙河龙骑士团（帝国重组版）"
 oe_order_danube_dragon_desc: "依托贝尔格莱德与布达雄关重组的巴尔干—多瑙河联防骑士团，专责协防河防要塞与统筹边区政军，与匈牙利原版龙骑士团并行不悖。"
 oe_orthodox_hesychast_order_type: "阿索斯静修院修会"
 oe_orthodox_hesychast_order_type_desc: "发源于阿索斯圣山、延及君士坦丁堡与罗斯各大隐修院的正教静修与抄经修会，专注于祈祷、注疏与典籍传抄，稳固教区安宁并提升识字与思潮传播。"
 oe_orthodox_sepulchre_military_order_type: "圣墓正教卫戍军事修会"
 oe_orthodox_sepulchre_military_order_type_desc: "光复耶路撒冷或安条克后敕立的正教武装护教修会，可于圣地与近东边塞驻屯修会卫戍兵团，兼修军纪与宗教热忱。"
 oe_hesychast_contemplation_calling: "静修默观圣召"
 oe_hesychast_contemplation_calling_desc: "以阿索斯静修灵修与圣像祈祷为本业，深耕教区教士识字与平息动荡，并提升全国圣像威能。"
 oe_hesychast_chronicle_calling: "抄经编年圣召"
 oe_hesychast_chronicle_calling_desc: "依托修道院抄经室校勘古典手稿、希腊教父注疏与历代编年史，显著加快领地识字率与新思潮传播。"
 oe_sepulchre_wardens_calling: "圣墓卫戍圣召"
 oe_sepulchre_wardens_calling_desc: "受命常驻耶路撒冷、安条克与近东边寨的武装修会卫戍编制，加固城防驻军并向帝国提供严明军纪与护教武力。"
 oe_wnd.1.t: "圣索菲亚大穹顶重焕金辉"
 oe_wnd.1.d: "历经数载脚手架林立与匠师昼夜校修，君士坦丁堡圣索菲亚大教堂的穹顶终于卸下木架。晨曦穿透四十扇穹窗，千万片金箔镶嵌画在殿堂上空折射出璀璨光轮，远道而来的朝圣者与诸邦使节无不屏息赞叹。"
 oe_wnd.1.a: "奉告四海教会，颂扬万世丰碑"
 oe_wnd.1.a.tt: "获声望并增进宗教影响力，铭记穹顶大修盛举。"
 oe_wnd.1.b: "赐赏镶嵌画师与营造匠作坊"
 oe_wnd.1.b.tt: "提升国家稳定度与声望，稳固京畿百工。"
 oe_wnd.2.t: "狄奥多西棱堡城防竣工"
 oe_wnd.2.d: "从马尔马拉海畔的金门一直延展至布拉赫奈宫角，崭新的石砌菱形棱堡与暗炮台已将古老的狄奥多西三重城墙严密护卫。试射的攻城重炮弹丸撞在斜坡护墙上纷纷弹开，将士与市民皆知此城固若金汤。"
 oe_wnd.2.a: "大阅守备军团，垂范帝国城防"
 oe_wnd.2.a.tt: "获陆军传统与声望，推广棱堡筑城经验。"
 oe_wnd.2.b: "充实城防军械库与守城粮储"
 oe_wnd.2.b.tt: "提升稳定度与陆军传统，安抚京畿军民。"
 oe_wnd.3.t: "大都观象台与御书大典落成"
 oe_wnd.3.d: "大都城东高台之上，新铸青铜浑仪与仰仪已精准对准北辰；台下御书楼万卷书架整齐列阵，翰林学士与天算官将历代经史、星历算表合编成一部恢宏大典，呈献御览。"
 oe_wnd.3.a: "颁行新历与大典副本于诸路学宫"
 oe_wnd.3.a.tt: "直接推进科研进度并获声望。"
 oe_wnd.3.b: "珍藏正本于秘阁，赏赐纂修诸臣"
 oe_wnd.3.b.tt: "提升稳定度与声望，褒扬文治。"
 oe_wnd.4.t: "白石克里姆林王城巍然屹立"
 oe_wnd.4.d: "莫斯科河岸不再只是易遭烈火焚毁的木栅堡寨。成千上万块白石条与烧制红砖构筑起连绵城塔与厚重城门，圣母升天座堂的钟声回荡在崭新广场上，四方王公与商旅莫不敬畏。"
 oe_wnd.4.a: "告祭祖宗与都主教座，确立王城威权"
 oe_wnd.4.a.tt: "提升正统性与声望，巩固王权核心。"
 oe_wnd.4.b: "嘉奖罗斯石匠与戍城卫队"
 oe_wnd.4.b.tt: "提升陆军传统与国家稳定度。"
 oe_wnd.5.t: "撒马尔罕雷吉斯坦与星台竣工"
 oe_wnd.5.d: "钴蓝与金釉瓷砖在泽拉夫尚河谷的骄阳下闪耀夺目，雷吉斯坦大经学院敞开大门迎纳各国经师与算学家；不远处的巨型大理石星台刚刚校毕《苏丹星表》，丝路商队竞相传抄其盛名。"
 oe_wnd.5.a: "广邀四海星算家与诗哲来朝讲学"
 oe_wnd.5.a.tt: "推进科研进度并获声望。"
 oe_wnd.5.b: "以学宫威望泽被河中商旅与民众"
 oe_wnd.5.b.tt: "提升稳定度与声望。"
 oe_wnd.6.t: "亚历山大新图书馆开馆启卷"
 oe_wnd.6.d: "海风拂过亚历山大港洁白的大理石柱廊，万千卷抄本与印本按学科整齐入库。希腊哲思、阿拉伯医算与拉丁法典在此并置互译，沉寂千载的博学之城再度点亮智慧明灯。"
 oe_wnd.6.a: "设立常设译馆，资助几何与格物研究"
 oe_wnd.6.a.tt: "直接推进科研进度并获声望。"
 oe_wnd.6.b: "向四海商船与游学士人开放抄录"
 oe_wnd.6.b.tt: "提升稳定度与声望。"
 oe_wnd.7.t: "开罗爱资哈尔大书院扩建落成"
 oe_wnd.7.d: "开罗城中新落成的拱廊院舍与高耸宣礼塔交相辉映，来自北非、叙利亚、也门与安纳托利亚的学子齐聚一堂。书院大经师将编纂完毕的《法理与万学总纂》献呈御前，盛赞盛世重文。"
 oe_wnd.7.a: "赐予书院岁俸，宏扬正学教化"
 oe_wnd.7.a.tt: "获宗教影响力与声望。"
 oe_wnd.7.b: "颁行书院律法注解以安民心"
 oe_wnd.7.b.tt: "提升稳定度并推进科研进度。"
 oe_wnd.8.t: "热那亚圣乔治银行总行开业"
 oe_wnd.8.d: "热那亚港畔庄严的圣乔治宫内，金银秤砝码与装订整齐的复式总账已经就位。来自地中海、黑海与佛兰德斯的商行争相在此开立汇兑户头，国家公债信用随之一振。"
 oe_wnd.8.a: "核发首批主权信用汇票，充盈国库"
 oe_wnd.8.a.tt: "立获金币储备与声望。"
 oe_wnd.8.b: "颁布严明审计章程，稳固商界信赖"
 oe_wnd.8.b.tt: "提升稳定度与声望。"
 oe_wnd.9.t: "杭州运河总枢与万国市舶馆落成"
 oe_wnd.9.d: "随着最后一道石砌复闸启闭通水，满载江南稻米、湖丝与龙泉青瓷的万千漕船沿大运河顺流北上，城南市舶货栈则汇集了来自南洋与西海的奇珍异货，画师更绘就壮丽长卷以记盛况。"
 oe_wnd.9.a: "开征通闸市舶正税，充实国用"
 oe_wnd.9.a.tt: "立获金币与声望。"
 oe_wnd.9.b: "宽免首年漕耗，嘉惠江南商民"
 oe_wnd.9.b.tt: "提升稳定度与声望。"
 oe_wnd.10.t: "巴格达新智慧宫浴火重光"
 oe_wnd.10.d: "昔日兵燹之后沉寂多年的底格里斯河岸，如今再度响起清朗的讲学与抄书声。新落成的智慧宫译经院书香满廊，学者们呈上融合东西数理与医学精华的新编全集，宣告和平之城文运复兴。"
 oe_wnd.10.a: "重金礼聘各邦名医与算师入馆"
 oe_wnd.10.a.tt: "推进科研进度并获声望。"
 oe_wnd.10.b: "以学馆复兴告慰两河百姓"
 oe_wnd.10.b.tt: "提升稳定度与声望。"
 oe_wnd.11.t: "德里御用星台与大书库落成"
 oe_wnd.11.d: "亚穆纳河畔红砂岩与白大理石相间的巨型星象仪座巍然落成，波斯天算师与印度历算名家同台观测日影星轨，将合璧历表与万卷藏书一并献于御前，泽及农桑与税政。"
 oe_wnd.11.a: "依新历法校准田赋清丈与农时"
 oe_wnd.11.a.tt: "获金币并推进科研进度。"
 oe_wnd.11.b: "厚赏两派学士，弘扬德里文风"
 oe_wnd.11.b.tt: "提升声望与国家稳定度。"
 oe_wnd.12.t: "刺桐港海丝总灯塔燃灯通航"
 oe_wnd.12.d: "暮色降临泉州湾，新筑石砌海丝总灯塔顶端的长明烽火划破夜海迷雾。满载香料、瓷器与丝绸的各国巨舶顺光入泊万国番坊，海商舵工联袂献上详尽的《刺桐港万国海道针经图志》。"
 oe_wnd.12.a: "颁印海道针经，鼓舞远洋市舶"
 oe_wnd.12.a.tt: "获市舶关税金币与声望。"
 oe_wnd.12.b: "修明番坊法度，怀柔四海商客"
 oe_wnd.12.b.tt: "提升稳定度并吸收海外航海格物新知。"
 oe_wnd.20.t: "诏立君士坦丁圣乔治骑士团"
 oe_wnd.20.d: "随着帝国在希腊与安纳托利亚重振雄风，宫廷元老与宿将联名奏请效法古制、设立常设御前勋团。陛下可亲颁紫诏，以圣乔治与君士坦丁圣徽为号创立骑士团，向忠勇将帅授勋。"
 oe_wnd.20.a: "颁诏创立骑士团，亲授首任勋章"
 oe_wnd.20.a.tt: "启用君士坦丁圣乔治骑士团为本国骑士团，可向将领与贵族授勋。"
 oe_wnd.20.b: "仅作礼仪褒奖，保留现有骑士团体制"
 oe_wnd.20.b.tt: "不更换当前常驻骑士团，改为直接嘉奖三军将士。"
 oe_wnd.21.t: "重整瓦兰吉兄弟会誓约"
 oe_wnd.21.d: "自北方水路与黑海沿岸汇聚而来的精锐卫士在宫廷前举斧宣誓，愿承袭昔日瓦兰吉卫队誓死护主之古风。若敕立为常设骑士兄弟会，必将大幅淬炼全军纪律与将领威望。"
 oe_wnd.21.a: "敕立瓦兰吉兄弟会为御前骑士团"
 oe_wnd.21.a.tt: "启用瓦兰吉兄弟会为本国骑士团，大幅增强纪律与将领军事素养。"
 oe_wnd.21.b: "赏赐卫队金银，维持既有骑士团"
 oe_wnd.21.b.tt: "保留当前骑士团，直接赐赏军功提升传统。"
 oe_wnd.22.t: "圣城光复：组建耶路撒冷圣墓卫队"
 oe_wnd.22.d: "圣墓教堂钟声再鸣，四方朝圣者络绎重返锡安山。为确保圣城城防永固并护佑远道而来的信众，朝中重臣与教会大主教建言创立耶路撒冷圣墓卫队骑士团。"
 oe_wnd.22.a: "在圣墓祭坛前宣诏立团"
 oe_wnd.22.a.tt: "启用耶路撒冷圣墓卫队为本国骑士团，增强宗教影响力与全局城防。"
 oe_wnd.22.b: "另拨圣殿岁贡，沿用现有骑士团"
 oe_wnd.22.b.tt: "保留当前骑士团，仅赐予圣城教堂财物与荣典。"
 oe_wnd.23.t: "多瑙河雄关：重组帝国龙骑士团"
 oe_wnd.23.d: "贝尔格莱德与布达扼守多瑙河咽喉，乃巴尔干与中欧的锁钥。为凝聚沿河诸领主与边防将帅共御外侮，宫廷提议重组多瑙河龙骑士团，以龙徽勋链统合边塞军政。"
 oe_wnd.23.a: "颁授龙徽勋链，确立河防骑士团"
 oe_wnd.23.a.tt: "启用多瑙河龙骑士团（帝国重组版）为本国骑士团，强化要塞防务与维护效率。"
 oe_wnd.23.b: "仅发边防犒赏，维持既有骑士团"
 oe_wnd.23.b.tt: "保留当前骑士团，转而奖励多瑙河戍军。"
 oe_wnd.30.t: "敕立阿索斯静修院正教修会"
 oe_wnd.30.d: "阿索斯圣山诸大修道院长老与都主教齐聚御前，陈情将沿袭数百年的静修与抄经灵修脉络正式册立为常设正教修会，以便向全国各教区派遣修士、兴办抄经院并安定民心。陛下欲赋予修会何种首要圣召？"
 oe_wnd.30.a: "立为静修默观圣召，涵养教区安宁与圣像威能"
 oe_wnd.30.a.tt: "以阿索斯圣山（或非首都教区）为首座驻地创立阿索斯静修院修会（静修默观圣召）。"
 oe_wnd.30.b: "立为抄经编年圣召，广兴典籍传抄与思潮传播"
 oe_wnd.30.b.tt: "以阿索斯圣山（或非首都教区）为首座驻地创立阿索斯静修院修会（抄经编年圣召）。"
 oe_wnd.30.c: "暂赐岁供护持，不改原有修院建制"
 oe_wnd.30.c.tt: "维持现状并获稳定度与宗教影响力。"
 oe_wnd.31.t: "敕立圣墓正教卫戍军事修会"
 oe_wnd.31.d: "随着耶路撒冷或安条克重归正教旌旗之下，前线宿将与大牧首代表建言设立常设正教武装修会，以誓愿武士屯戍圣地关隘、护卫朝圣商道并在战时听调出征。"
 oe_wnd.31.a: "颁诏创立圣墓正教卫戍军事修会"
 oe_wnd.31.a.tt: "以耶路撒冷或安条克为首座驻地创立圣墓正教卫戍军事修会，可于近东与巴尔干拓展驻地。"
 oe_wnd.31.b: "圣地防务仍归帝国常备军统辖"
 oe_wnd.31.b.tt: "不设立武装修会，改为直接嘉奖前线常备军。"
 oe_wnd.90.t: "【测试】欧亚奇观杰作、圣地与骑士修会（槽位70）：状态读数"
