MODIFIER_TYPE_NAME_oe_sub_mam_empire_support: "皇帝钦点埃及总督"
MODIFIER_TYPE_DESC_oe_sub_mam_empire_support: "这是皇帝钦点的埃及总督人选，注定接任埃及总督，除非皇帝还同时钦点了其他人选"
MODIFIER_TYPE_NAME_oe_sub_religion_empire_support: "皇帝钦点牧首"
MODIFIER_TYPE_DESC_oe_sub_religion_empire_support: "这人被皇帝钦点，十分有望接任该牧首区"
MODIFIER_TYPE_NAME_allow_oe_cabinet_unlock_oe_reli_dip: "解锁内阁行动“建立专业外交体系”"
MODIFIER_TYPE_DESC_allow_oe_cabinet_unlock_oe_reli_dip: "我国位于五海三洲之地，是名副其实的世界十字路口，为此我们不得不与诸多性格迥异的民族打交道，让我们组建一个专业的外交体系，以在任何外交场合都能妥善应对"
# PAUSED: MODIFIER_TYPE_NAME_allow_oe_cabinet_unlock_oe_byz_bureaucrat: "解锁内阁行动“重建等级制度”"
# PAUSED: MODIFIER_TYPE_DESC_allow_oe_cabinet_unlock_oe_byz_bureaucrat: "拜占庭有世界上最详尽和独特的官阶制度，我们会确保这一制度运转良好"
MODIFIER_TYPE_NAME_allow_oe_cabinet_unlock_oe_byz_university: "解锁内阁行动“重建官僚选拔制度”"
MODIFIER_TYPE_DESC_allow_oe_cabinet_unlock_oe_byz_university: "拜占庭的官僚曾经大多来自知名大学或地方学术中心，保证了我们官僚的活力与专业度，如今我们应当恢复这一优良传统"
MODIFIER_TYPE_NAME_allow_oe_cabinet_unlock_oe_byz_sunday: "解锁内阁行动“废除过度劳役”"
MODIFIER_TYPE_DESC_allow_oe_cabinet_unlock_oe_byz_sunday: "我们不会再容忍地方领主对我们勤劳的农民们提出无止境的劳役要求"
MODIFIER_TYPE_NAME_allow_oe_cabinet_unlock_oe_byz_great_farm: "解锁内阁行动“农业改革”"
MODIFIER_TYPE_DESC_allow_oe_cabinet_unlock_oe_byz_great_farm: "通过国家规划与抑制土地兼并，我国的农业将高度专业化，并深度涉入市场经济"
MODIFIER_TYPE_NAME_allow_oe_byz_reform_precious_meta_over: "解锁内阁行动“严厉打击金银走私”"
MODIFIER_TYPE_DESC_allow_oe_byz_reform_precious_meta_over: "在解决完拉丁人的问题后，我们终于有机会肃清金银走私现象"
MODIFIER_TYPE_NAME_oe_byz_select_as_second_empire: "角色头衔:共治皇帝"
MODIFIER_TYPE_DESC_oe_byz_select_as_second_empire: "共治皇帝在加冕仪式后，立即成为法律上和神学意义上的“现任皇帝”。他与老皇帝共享“奥古斯都”或“巴西琉斯”的皇帝称号，只是资历和权威有高低之分。"
MODIFIER_TYPE_NAME_oe_rome_province_elect_support: "中央外派"
MODIFIER_TYPE_DESC_oe_rome_province_elect_support: "这个角色曾在皇帝的宫廷中工作过，因皇帝旨意被外派"
MODIFIER_TYPE_NAME_allow_oe_byz_build_country_gov: "启用行政总署"
MODIFIER_TYPE_DESC_allow_oe_byz_build_country_gov: "允许我们解锁政府建筑：行政总署"
MODIFIER_TYPE_NAME_allow_oe_cabinet_catholic_fighter: "解锁内阁行动#R 基督同袍#!"
MODIFIER_TYPE_DESC_allow_oe_cabinet_catholic_fighter: "我们将致力于运用我们的影响力，号召远道而来的基督教勇士们加入我们抗击异教徒的正义事业。"
MODIFIER_TYPE_NAME_allow_oe_cabinet_reform_country_mine: "解锁内阁行动#G 成立国家矿产委员会#!"
MODIFIER_TYPE_DESC_allow_oe_cabinet_reform_country_mine: "在赶走了水蛭般的意大利人后，我们的顾问将在[GetCountry('BYZ').GetGovernment.GetRuler.GetName]的授权下，对全国矿场进行清查，将地头蛇的触手从我们宝贵的矿产资源上驱走,并最终成立一个矿产委员会。"
STATIC_MODIFIER_NAME_oe_byz_andronikos_iii_III: "从龙夺朱"
STATIC_MODIFIER_DESC_oe_byz_andronikos_iii_III: "在内战之初就支持[GetCharacter('byz_andronikos_iii_palaiologos').GetName]的军事贵族们在事后都得到了惊人的奖赏，在登上皇位后，这群以[GetCharacter('byz_john_kantakouzenos').GetName]为首的军事贵族依然是皇帝的左膀右臂"

