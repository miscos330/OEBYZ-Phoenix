l_simp_chinese:
 OE_EUG_NAME_MOGHULISTAN: "东察合台（蒙兀儿斯坦）"
 OE_EUG_NAME_MOGHULISTAN_ADJ: "蒙兀儿斯坦"
 OE_EUG_NAME_TRANSOXIANA: "西察合台河中阿米尔国"
 OE_EUG_NAME_TRANSOXIANA_ADJ: "河中"
 oe_eug_dlh_deccan: "德干伊克塔总督府"
 oe_eug_dlh_deccan_desc: "德里苏丹国派驻古尔伯加的德干行省总督衙署，统摄南方军政与税赋；中枢失控时则易沦为地方截税割据之源。"
 oe_eug_dlh_deccan_maintenance: "德干总督衙署维持"
 oe_eug_dlh_malwa: "摩腊婆伊克塔总督府"
 oe_eug_dlh_malwa_desc: "德里苏丹国设于达尔的摩腊婆中印总督府，控扼德干北上要道与军屯兵源。"
 oe_eug_dlh_malwa_maintenance: "摩腊婆总督衙署维持"
 oe_eug_dlh_gujarat: "古吉拉特海贸总督府"
 oe_eug_dlh_gujarat_desc: "德里苏丹国设于坎贝港的古吉拉特总督府，总管印度西岸海运关税与阿拉伯海商舶。"
 oe_eug_dlh_gujarat_maintenance: "古吉拉特总督衙署维持"
 oe_eug_dlh_jaunpur: "章普尔东方总督府"
 oe_eug_dlh_jaunpur_desc: "德里苏丹国设于章普尔的东方总督府，镇抚恒河中游沃土并监督孟加拉方向边防。"
 oe_eug_dlh_jaunpur_maintenance: "章普尔总督衙署维持"
 oe_eug_mam_damascus: "大马士革纳伊布总督府"
 oe_eug_mam_damascus_desc: "马穆鲁克苏丹国派驻大马士革的叙利亚首席总督衙署，总领黎凡特军务与商道关税，但在开罗内讧时屡成权臣起兵之源。"
 oe_eug_mam_damascus_maintenance: "大马士革总督府维持"
 oe_eug_mam_aleppo: "阿勒颇纳伊布总督府"
 oe_eug_mam_aleppo_desc: "马穆鲁克苏丹国设于阿勒颇的北叙利亚边防总督府，屏藩安纳托利亚与两河流域要冲。"
 oe_eug_mam_aleppo_maintenance: "阿勒颇总督府维持"
 oe_eug_hun_transylvania: "特兰西瓦尼亚沃伊沃德府"
 oe_eug_hun_transylvania_desc: "匈牙利王室在喀尔巴阡山隘设立的沃伊沃德总督府，统筹塞克勒边军与萨克森堡垒，构成抵御南线入侵的山地盾墙。"
 oe_eug_hun_transylvania_maintenance: "特兰西瓦尼亚总督府维持"
 oe_eug_hun_croatia: "克罗地亚—斯拉沃尼亚总督府"
 oe_eug_hun_croatia_desc: "匈牙利王国派驻萨格勒布的巴恩总督署，兼理萨瓦河防务与亚得里亚海西疆贵族事务。"
 oe_eug_hun_croatia_maintenance: "克罗地亚总督府维持"
 oe_eug_b_amir_revolt: "河中阿米尔抗命"
 oe_eug_b_kurultai_accord: "察合台忽里勒台和议"
 oe_eug_b_moghul_bond: "东察合台伊斯兰盟约"
 oe_eug_b_silk_road_truce: "天山丝路互市之谊"
 STATIC_MODIFIER_NAME_oe_eug_chg_yassa_hammer: "合赞汗严刑削藩"
 STATIC_MODIFIER_DESC_oe_eug_chg_yassa_hammer: "大汗厉行军法震慑河中阿米尔，骑兵战力骤增而部族怨望亦随之高涨。"
 STATIC_MODIFIER_NAME_oe_eug_chg_yassa_compromise: "阿力麻里忽里勒台妥协"
 STATIC_MODIFIER_DESC_oe_eug_chg_yassa_compromise: "大汗与诸部阿米尔重订牧场与税赋分成，暂缓河中离心危机。"
 STATIC_MODIFIER_NAME_oe_eug_west_transoxiana: "河中突厥—波斯阿米尔体制"
 STATIC_MODIFIER_DESC_oe_eug_west_transoxiana: "撒马尔罕与布哈拉摆脱草原汗廷直辖，定居绿洲农商与突厥军功贵族合流，为河中霸权奠基。"
 STATIC_MODIFIER_NAME_oe_eug_moghulistan_east: "蒙兀儿斯坦草原正统"
 STATIC_MODIFIER_DESC_oe_eug_moghulistan_east: "伊犁河谷与塔里木北缘的东察合台诸部坚守游牧骑射传统，扼守天山丝路门户。"
 STATIC_MODIFIER_NAME_oe_eug_chg_yassa_restored: "察合台大雅撒重光"
 STATIC_MODIFIER_DESC_oe_eug_chg_yassa_restored: "大汗力挽东西分裂狂澜，重整阿力麻里与河中秩序，察合台兀鲁思再度合而为一。"
 STATIC_MODIFIER_NAME_oe_eug_moghul_islamization: "秃黑鲁帖木儿伊斯兰化"
 STATIC_MODIFIER_DESC_oe_eug_moghul_islamization: "汗廷与朵豁剌惕诸部皈依伊斯兰教，将喀什噶尔、叶尔羌与伊犁草原凝为一体。"
 STATIC_MODIFIER_NAME_oe_eug_silk_road_pluralism: "天山丝路多教并容"
 STATIC_MODIFIER_DESC_oe_eug_silk_road_pluralism: "汗廷兼蓄草原旧俗、佛寺与绿洲商团，吐鲁番至阿力麻里的过境贸易熙攘不绝。"
 STATIC_MODIFIER_NAME_oe_eug_samarkand_amirate: "撒马尔罕军商并兴"
 STATIC_MODIFIER_DESC_oe_eug_samarkand_amirate: "河中名城广纳工匠与骑兵将领，蓄势待发以图霸业。"
 STATIC_MODIFIER_NAME_oe_eug_chagatai_warbands: "察合台百战突骑"
 STATIC_MODIFIER_DESC_oe_eug_chagatai_warbands: "纵横锡尔河与阿姆河之间的游牧战团兵精马壮，所向披靡。"
 STATIC_MODIFIER_NAME_oe_eug_dlh_iqta_loyal: "德里伊克塔恭顺纳贡"
 STATIC_MODIFIER_DESC_oe_eug_dlh_iqta_loyal: "行省总督恪守德里诏令，按期解运税粮并严整边防。"
 STATIC_MODIFIER_NAME_oe_eug_dlh_iqta_autonomous: "伊克塔截税抗命"
 STATIC_MODIFIER_DESC_oe_eug_dlh_iqta_autonomous: "图格鲁克过度扩张引发地方总督私留税款、纵兵自重，叛乱暗流一触即发。"
 STATIC_MODIFIER_NAME_oe_eug_mam_naib_loyal: "叙利亚纳伊布效忠开罗"
 STATIC_MODIFIER_DESC_oe_eug_mam_naib_loyal: "大马士革与阿勒颇总督奉命守土，黎凡特商贸兴盛且北疆城防稳固。"
 STATIC_MODIFIER_NAME_oe_eug_mam_naib_factional: "叙利亚埃米尔派系掣肘"
 STATIC_MODIFIER_DESC_oe_eug_mam_naib_factional: "巴赫里与布尔吉派系倾轧波及叙利亚行省，总督拥兵自重、截留税赋。"
 STATIC_MODIFIER_NAME_oe_eug_hun_voivode_loyal: "沃伊沃德奉诏镇边"
 STATIC_MODIFIER_DESC_oe_eug_hun_voivode_loyal: "特兰西瓦尼亚与斯拉沃尼亚长官忠于布达王室，山地要隘固若金汤。"
 STATIC_MODIFIER_NAME_oe_eug_hun_voivode_autonomous: "边疆大贵族割据自治"
 STATIC_MODIFIER_DESC_oe_eug_hun_voivode_autonomous: "王权动摇之际，地方大贵族把持总督衙署与采邑军赋，对王廷诏令阳奉阴违。"
 STATIC_MODIFIER_NAME_oe_eug_dlh_firuz_settlement: "菲鲁兹式伊克塔怀柔"
 STATIC_MODIFIER_DESC_oe_eug_dlh_firuz_settlement: "适度减免苛税并承认功臣世袭俸禄，稳住尚存的德里行省秩序。"
 STATIC_MODIFIER_NAME_oe_eug_dlh_imperial_diwan: "德里直属财税度支院"
 STATIC_MODIFIER_DESC_oe_eug_dlh_imperial_diwan: "撤销截税总督府、改由德里中央度支官直理行省赋税，苏丹国重振中央威权。"
 STATIC_MODIFIER_NAME_oe_eug_mam_burji_guard: "布尔吉切尔克斯禁卫重整"
 STATIC_MODIFIER_DESC_oe_eug_mam_burji_guard: "重整开罗与叙利亚马穆鲁克精骑建制，强化军事威慑与前线战斗力。"
 STATIC_MODIFIER_NAME_oe_eug_mam_cairo_centralized: "开罗轮调叙利亚总督制"
 STATIC_MODIFIER_DESC_oe_eug_mam_cairo_centralized: "推行定期轮调与中央稽核制度，终结大马士革与阿勒颇总督长期盘踞的积弊。"
 STATIC_MODIFIER_NAME_oe_eug_hun_ottoman_bulwark: "多瑙河—喀尔巴阡基督教盾墙"
 STATIC_MODIFIER_DESC_oe_eug_hun_ottoman_bulwark: "依托特兰西瓦尼亚沃伊沃德与克罗地亚边防军团，构筑抵御南方强敌的钢铁防线。"
 STATIC_MODIFIER_NAME_oe_eug_hun_royal_prerogative: "布达王廷国会集权"
 STATIC_MODIFIER_DESC_oe_eug_hun_royal_prerogative: "以王廷国会法令约束边疆大贵族私权，将特兰西瓦尼亚与斯拉沃尼亚军赋收归王室。"
 oe_eug_dec_chg_restore_yassa.title: "重整察合台大雅撒"
 oe_eug_dec_chg_restore_yassa.desc: "以阿力麻里汗廷威权镇服河中与东疆诸阿米尔，彻底锁死1347年东西察合台分裂危机。"
 oe_eug_dec_chg_restore_yassa.a: "颁行统一大雅撒诏令"
 oe_eug_dec_dlh_audit_viceroys.title: "派遣德里度支钦差巡查伊克塔"
 oe_eug_dec_dlh_audit_viceroys.desc: "遣派中央钦差赴古尔伯加、达尔、坎贝与章普尔清查税册，将截税自治的伊克塔总督府拉回恭顺轨道。"
 oe_eug_dec_dlh_audit_viceroys.a: "整饬四府伊克塔税政"
 oe_eug_dec_dlh_recentralize_iqtas.title: "裁撤德里四大伊克塔总督府"
 oe_eug_dec_dlh_recentralize_iqtas.desc: "正式撤销古尔伯加、达尔、坎贝与章普尔的建筑型总督衙署，以中央度支院直接统辖直辖行省，永绝截税割据之弊。"
 oe_eug_dec_dlh_recentralize_iqtas.a: "收归德里中央度支直辖"
 oe_eug_dec_mam_recall_naibs.title: "轮调并集权叙利亚两纳伊布"
 oe_eug_dec_mam_recall_naibs.desc: "撤销大马士革与阿勒颇世袭化倾向严重的总督衙署，改由开罗苏丹廷直辖轮调，彻底平息叙利亚埃米尔派系掣肘。"
 oe_eug_dec_mam_recall_naibs.a: "推行开罗直辖轮调新制"
 oe_eug_dec_hun_crown_diet.title: "布达王廷国会：收束沃伊沃德与巴恩自治"
 oe_eug_dec_hun_crown_diet.desc: "召集王廷国会正式收回布拉索夫沃伊沃德与萨格勒布巴恩的大贵族特权，消除边疆自治内耗并加强匈牙利中央王权。"
 oe_eug_dec_hun_crown_diet.a: "颁布王廷国会集权法令"
 oe_eug.1.t: "合赞汗削藩：河中阿米尔的暗潮"
 oe_eug.1.d: "察合台大汗合赞汗意图打破河中突厥—蒙古阿米尔的尾大不掉之势，强令撒马尔罕、布哈拉与巴鲁剌思诸部缴械听调。然而在阿姆河与锡尔河之间，加兹罕等权贵已暗中串联，一场撕裂东西察合台的风暴正在酝酿。"
 oe_eug.1.a: "厉行大汗雅撒，铁腕弹压河中阿米尔"
 oe_eug.1.a.tt: "获[ShowModifier('oe_eug_chg_yassa_hammer')]（#Y 12#!年），大幅激怒河中阿米尔并为1347年东西分裂埋下导火索。"
 oe_eug.1.b: "于阿力麻里召开忽里勒台，与诸阿米尔分利妥协"
 oe_eug.1.b.tt: "花费#R 60#!金币与#R 5#!威望，获[ShowModifier('oe_eug_chg_yassa_compromise')]（#Y 15#!年），为察合台重整雅撒铺路。"
 oe_eug.2.t: "察合台东西分裂"
 oe_eug.2.d: "合赞汗与加兹罕的决战撼动了整个中亚。河中绿洲的撒马尔罕与布哈拉诸阿米尔拒绝再奉阿力麻里号令，而天山以东的伊犁、喀什噶尔与叶尔羌草原诸部正谋划另立东察合台汗统——察合台汗国是否就此一分为二？"
 oe_eug.2.a: "汗国东西分立：河中自立，东翼立蒙兀儿斯坦"
 oe_eug.2.a.tt: "史实分裂：解除河中诸部附庸并赋予[ShowModifier('oe_eug_west_transoxiana')]（铺垫帖木儿温床）；东翼转入蒙兀儿斯坦体制并获[ShowModifier('oe_eug_moghulistan_east')]。"
 oe_eug.2.b: "力挽狂澜，重整察合台大雅撒！（反制线）"
 oe_eug.2.b.tt: "反制线：花费#R 120#!金币、稳定#R −6#!，阻止东西分裂并获[ShowModifier('oe_eug_chg_yassa_restored')]（#Y 35#!年）。"
 oe_eug.3.t: "秃黑鲁帖木儿与蒙兀儿伊斯兰化"
 oe_eug.3.d: "在天山南北与塔里木盆地，朵豁剌惕部拥立的秃黑鲁帖木儿正面临信仰与国策的重大抉择：是顺应喀什噶尔与叶尔羌穆斯林学者之请皈依伊斯兰教、凝聚东察合台诸部，还是沿袭草原多教并容旧制、广通高昌吐鲁番商路？"
 oe_eug.3.a: "皈依伊斯兰教，凝聚喀什噶尔与伊犁诸部"
 oe_eug.3.a.tt: "东察合台与朵豁剌惕改宗逊尼派，获[ShowModifier('oe_eug_moghul_islamization')]（#Y 30#!年）并加深部族纽带。"
 oe_eug.3.b: "维持草原多教并容，兴盛吐鲁番丝路商贸"
 oe_eug.3.b.tt: "保留原有信仰，获[ShowModifier('oe_eug_silk_road_pluralism')]（#Y 30#!年）并提升与高昌关系。"
 oe_eug.4.t: "撒马尔罕风云"
 oe_eug.4.d: "东西察合台分家之后，撒马尔罕与布哈拉沦为河中突厥军事贵族群雄逐鹿的舞台。巴鲁剌思与其他阿米尔宗族在绿洲城郭与草原牧场之间纵横捭阖，一位改写欧亚史的征服者正于暗处崭露头角。"
 oe_eug.4.a: "依托撒马尔罕与布哈拉绿洲，兴盛城邦军政"
 oe_eug.4.a.tt: "获得#G +75#!金币与[ShowModifier('oe_eug_samarkand_amirate')]（#Y 25#!年）。"
 oe_eug.4.b: "纠合察合台草原突骑，以武力震慑河中"
 oe_eug.4.b.tt: "获得#G +10#!威望与[ShowModifier('oe_eug_chagatai_warbands')]（#Y 25#!年）。"
 oe_eug.5.t: "德里苏丹国：四大伊克塔总督府"
 oe_eug.5.d: "德里苏丹国疆域横跨北印至德干高原，中枢鞭长莫及。苏丹在古尔伯加（德干）、达尔（摩腊婆）、坎贝（古吉拉特）与章普尔设立四大伊克塔建筑型总督府——既不割裂帝国直辖领土，又能就地稽税镇边，但总督权柄一旦坐大必成离心隐忧。"
 oe_eug.5.a: "册立四大伊克塔总督府，委以地方治安与税赋"
 oe_eug.5.a.tt: "在德里直辖的古尔伯加、达尔、坎贝与章普尔落成四大总督府建筑，赋予[ShowModifier('oe_eug_dlh_iqta_loyal')]并获#G +4#!稳定。"
 oe_eug.5.b: "派驻中央度支官巡查四府，严核岁入"
 oe_eug.5.b.tt: "落成四大总督府并保持恭顺状态，获#G +10#!威望与#G +60#!金币。"
 oe_eug.6.t: "图格鲁克过度扩张"
 oe_eug.6.d: "迁都折腾、军费透支与四方饥荒令德里中枢威信扫地。德干、摩腊婆、古吉拉特与章普尔的伊克塔总督纷纷借口备边截留岁入，暗中招兵买马，地方叛乱阴云笼罩全印。"
 oe_eug.6.a: "中枢无力尽制，听任四府转入截税自治态"
 oe_eug.6.a.tt: "稳定#R −5#!；仍在德里名下的四大总督府转为[ShowModifier('oe_eug_dlh_iqta_autonomous')]（降低控制度并推升叛乱压力，可用集权决议整顿）。"
 oe_eug.6.b: "倾国库拨款抚军，强压诸府保持效忠"
 oe_eug.6.b.tt: "花费#R 150#!金币、稳定#R −8#!，强行维持四大总督府处于[ShowModifier('oe_eug_dlh_iqta_loyal')]。"
 oe_eug.7.t: "德里苏丹国·总督府中兴抉择"
 oe_eug.7.d: "历经图格鲁克王朝的连番震荡，德里宫廷必须为尚存的伊克塔总督体系定下长远方针：是效法菲鲁兹·沙阿宽减苛政、以怀柔安抚地方贵族，还是干脆裁撤尾大不掉的总督衙署、由中央度支院直接统辖？"
 oe_eug.7.a: "宽政怀柔，与留存伊克塔总督达成妥协"
 oe_eug.7.a.tt: "使尚存总督府恢复[ShowModifier('oe_eug_dlh_iqta_loyal')]，并获[ShowModifier('oe_eug_dlh_firuz_settlement')]（#Y 25#!年）。"
 oe_eug.7.b: "裁撤全部伊克塔总督府，推行德里中央度支直辖"
 oe_eug.7.b.tt: "花费#R 100#!金币、稳定#R −6#!，裁撤德里四大总督府建筑并获[ShowModifier('oe_eug_dlh_imperial_diwan')]（#Y 30#!年）。"
 oe_eug.8.t: "坦基兹伏诛之后"
 oe_eug.8.d: "执掌大马士革二十余年的重臣坦基兹失势后，开罗苏丹廷重新厘定叙利亚军政格局。大马士革与阿勒颇两座纳伊布总督府既护卫黎凡特商道与北疆要塞，也始终是马穆鲁克大埃米尔角逐权柄的重心。"
 oe_eug.8.a: "委任忠谨巴赫里埃米尔分镇大马士革与阿勒颇"
 oe_eug.8.a.tt: "在大马士革与阿勒颇落成两座总督府并赋予[ShowModifier('oe_eug_mam_naib_loyal')]，获#G +8#!威望。"
 oe_eug.8.b: "加重叙利亚军赋抽调，充实开罗府库"
 oe_eug.8.b.tt: "落成两座总督府并获#G +80#!金币，但叙利亚两府陷入[ShowModifier('oe_eug_mam_naib_factional')]。"
 oe_eug.9.t: "巴赫里至布尔吉"
 oe_eug.9.d: "切尔克斯人巴尔库克在开罗崛起、推动巴赫里向布尔吉王朝更迭之际，大马士革与阿勒颇的马穆鲁克总督再度卷入派系兵争。开罗必须决定是以铁血禁卫强压叙利亚，还是重金安抚并建立总督轮调新制。"
 oe_eug.9.a: "倚重布尔吉切尔克斯精骑，强硬震慑叙利亚派系"
 oe_eug.9.a.tt: "获得[ShowModifier('oe_eug_mam_burji_guard')]（#Y 25#!年），但大马士革与阿勒颇暂陷[ShowModifier('oe_eug_mam_naib_factional')]（可用轮调决议化解）。"
 oe_eug.9.b: "重金安抚叙利亚军政并推行开罗轮调稽核"
 oe_eug.9.b.tt: "花费#R 90#!金币，使两府恢复[ShowModifier('oe_eug_mam_naib_loyal')]并获[ShowModifier('oe_eug_mam_cairo_centralized')]（#Y 25#!年）。"
 oe_eug.10.t: "匈牙利王国"
 oe_eug.10.d: "安茹王朝盛极而转入继承风云之际，布拉索夫的特兰西瓦尼亚沃伊沃德与萨格勒布的克罗地亚—斯拉沃尼亚总督成为匈牙利南北防务与国内政争的双重枢纽。是放权强边以御巴尔干强敌，还是借王廷国会收束大贵族私权？"
 oe_eug.10.a: "厚赐边防沃伊沃德，筑牢喀尔巴阡—多瑙河盾墙"
 oe_eug.10.a.tt: "确认布拉索夫与萨格勒布总督府处于[ShowModifier('oe_eug_hun_voivode_loyal')]，并获[ShowModifier('oe_eug_hun_ottoman_bulwark')]（#Y 30#!年）。"
 oe_eug.10.b: "借布达王廷国会整顿边疆大贵族自治"
 oe_eug.10.b.tt: "稳定#R −4#!，获[ShowModifier('oe_eug_hun_royal_prerogative')]（#Y 30#!年），短期激起边疆[ShowModifier('oe_eug_hun_voivode_autonomous')]。"
 oe_eug.20.t: "欧亚总督与察合台：选项生效"
 oe_eug.90.t: "察合台与欧亚总督府总览"
