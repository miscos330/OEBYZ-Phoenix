l_simp_chinese:
 oe_nf_redeem_title: "赎回豪族控制产业"
 oe_nf_redeem_desc: "以御府之资收回世家掌握的田产与作坊，使地方生计重归公法。\n\n消耗#R 1个月内帑收入#!及#R 1权威#!，移除所选地点中该豪族的控制；该豪族获得#G 2影响力#!。须有足额内帑，无冷却。其他豪族在同一地点的控制不受影响。"
 oe_nf_relief_title: "委托赈济"
 oe_nf_relief_desc: "敕令世家开仓济困，以其乡望安抚闾里。受惠者称颂皇恩，承办者亦因之增重。\n\n消耗#R 2权威#!，获得#G 2民意#!；该豪族获得#G 4影响力#!。全国共享#Y 3个月#!冷却。"
 oe_nf_recommend_title: "请荐门客"
 oe_nf_recommend_desc: "请家主从门下故旧之中择才荐举，使久藏私门的才干得以效力帝廷。\n\n消耗#R 1权威#!，荐来一名罗马文化、东正教的成年门客，至少一项能力#G 超过65#!；该豪族获得#G 2影响力#!。该家族冷却#Y 3个月#!。"
 oe_nf_mediate_dispute: "调停门第争端"
 oe_nf_mediate_dispute_desc: "在任何一门尚不足以压倒朝野时，召争执双方入宫，以皇裁止息私争。\n\n须无影响力#Y 大于300#!的豪族。选择两个不同、影响力均#Y 大于50#!的豪族，各失去#R 25影响力#!；获得#G 1权威#!。全国冷却#Y 12个月#!。"
 oe_nf_oppose_monopoly: "反对豪族垄断"
 oe_nf_oppose_monopoly_desc: "凭重整官制所立的公权，撤去一省之内世家攫取的私利，使田土与百工不再受门第钳制。\n\n须完成#Y 重整官制#!。选择东罗马持有土地且存在豪族控制的省份，消耗#R 5权威#!，清除该地理省份全部豪族控制，并#G 永久禁止#!豪族重新扩张进入该省。无冷却。"
 OE_NF_CHOOSE_HOLDING: "选择赎回的地点"
 OE_NF_CHOOSE_FIRST_HEAD: "选择第一家豪族"
 OE_NF_CHOOSE_SECOND_HEAD: "选择第二家豪族"
 oe_noble_clients.1.t: "门下荐贤"
 oe_noble_clients.1.d: "[SCOPE.sDynasty('oe_nf_patron_family').GetName]家族奉诏从门客之中荐来[SCOPE.sCharacter('oe_nf_recommended').GetName]。此人久习事务，才具已受家主赏识，如今携荐书入朝，愿将所学用于帝国。"
 oe_noble_clients.1.a: "召入朝中，量才任用。"
