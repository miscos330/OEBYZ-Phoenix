l_simp_chinese:
 oe_nf_form_alliance: "结为政治盟友"
 oe_nf_form_alliance_desc: "摄政期间同样可用。当前没有政治盟友且没有正在持续的灾难时，选择一个豪族，消耗#R 5正统性#!，与其结成政治联盟。该家族每月影响力#R +1#!，解锁专属互动，并记为今后危机中的支持者。君主去世或该家族失去豪族地位时，政治盟友关系解除。"
 oe_nf_pressure: "打压豪族"
 oe_nf_pressure_desc: "选择一个豪族，消耗#R 2权威#!，使其影响力#G −25#!。全国冷却#Y 3个月#!。"
 oe_nf_honors: "授予荣衔"
 oe_nf_honors_desc: "以宫廷荣衔安抚影响力#Y 大于100#!的豪族。消耗#R 3个月内帑收入#!，该家族影响力#G −25#!。须有足够内帑；全国冷却#Y 3个月#!。"
 oe_nf_ally_support: "政治盟友的支持"
 oe_nf_ally_support_desc: "仅政治盟友可用。获得#G 5权威#!，统治者行政、外交、军事能力各#G +3#!。全国冷却#Y 60个月#!，君主去世不会提前清除冷却。"
 oe_nf_ally_pressure: "协助打压其他豪族"
 oe_nf_ally_pressure_desc: "仅政治盟友可用。选择另一个影响力#Y 大于100#!且不是政治盟友的豪族。消耗#R 1权威#!，目标家族影响力#G −25#!。依照通用互动规则，政治盟友获得#R 2影响力#!。全国冷却#Y 24个月#!。"
 OE_NF_ALLIANCE_CHOOSE_HEAD: "选择目标豪族的家主"
 OE_NF_POLITICAL_ALLY_BADGE: "#bold #Y 政治盟友#!#!"
