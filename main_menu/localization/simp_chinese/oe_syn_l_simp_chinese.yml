 STATIC_MODIFIER_NAME_oe_syn_republic_of_all_nations_mod: "万邦启明合奏（98/98 典藏徽记）"
 STATIC_MODIFIER_DESC_oe_syn_republic_of_all_nations_mod: "欧、亚、非、美四大洲文明共同立于启蒙科学时代的永久典藏荣耀，赐予科研、文化传统、外交声望与识字率恒久增益。"
 oe_syn.1.t: "红海彼岸的祭司王：阿克苏姆—君堡—里斯本三方使节"
 oe_syn.1.d: "一艘悬挂十字红帆的使船乘着季风驶入红海石港。船上既有来自阿比西尼亚高原、身着白金锦袍的所罗门皇室特使，也有自君士坦丁堡、罗马与里斯本万里迢迢而来的外交团与火枪工匠。长桌之上，金装吉兹语圣典、精工镶嵌火绳枪与红海海图并陈一处——传说中隐居东方的祭司王之国，如今化作真切可触的跨洲同盟。"
 oe_syn.1.a: "缔结军工与神学互助盟约，共享火枪技师与红海海图"
 oe_syn.1.b: "优先签署红海商港免税契约，打通高原黄金与咖啡商路"
 oe_syn.1.chalcedon_gold_tt: "#P 迦克墩和解黄金共鸣：#!既成东方正统教和解已生效，本次同盟升格为《亚历山大—君堡—阿克苏姆神圣和解》，额外获得 35 年神圣同盟加成！"
 oe_syn.2.t: "纸页上的世界子午线：从廷巴克图到君堡、威尼斯与江南"
 oe_syn.2.d: "一桩前所未见的学术奇观正在横跨旧大陆的书房中上演：来自廷巴克图桑科雷大经学院的撒哈拉天文学羊皮抄本，借由地中海与印度洋商队抵达君士坦丁堡与威尼斯，与伊斯坦布尔穆特费里卡活字印本、阿尔杜斯便携八开本，乃至江南吴县与建阳精刻算学农书并置在同一张星象长桌之上。人类第一次得以用四种文字、四种印刷工艺，校勘同一片星空。"
 oe_syn.2.a: "斥资主持四洲多语典籍合校，刊行传世《子午线汇编》"
 oe_syn.2.b: "令本地书坊广为翻刻译本，涵养文脉与民间识字之风"
 oe_syn.2.sahara_resonance_tt: "#P 撒哈拉学术商队远征共鸣：#!我国已完成的撒哈拉学术商队直接接入桑科雷抄本网，额外获得 30 年科研与文化共振增益！"
 oe_syn.3.t: "季风反封锁三角：基尔瓦、迪乌与红海火炮帆船"
 oe_syn.3.d: "面对印度洋航道上的卡塔兹海上封锁与重税勒索，东非基尔瓦的珊瑚石港与古吉拉特迪乌、红海诸埠之间悄然织起一张季风反制之网。满载索法拉黄金与象牙的斯瓦希里三角帆战船加装铜炮，与阿拉伯海及西印度洋联舰互换潮汐密图、轮替护航，宣告印度洋的季风绝非任何单一王冠的私产。"
 oe_syn.3.a: "编组跨洋火炮帆船护航联舰，正面撕开卡塔兹封锁线"
 oe_syn.3.b: "缔结东非—印度洋免税自由港同盟，以万帆商流瓦解垄断"
 oe_syn.4.t: "基多赤道子午线测量：印加观象台与皇家科学院的世纪握手"
 oe_syn.4.d: "在海拔三千米的基多火山群峰之间，远渡重洋的皇家科学院测绘使团与深谙太阳历法、绳结账算的安第斯高山观象师并肩架起象限仪与三角测标。历经数载跋涉云海雪岭，双方共同完成了人类史上首次赤道子午线一弧度实测，以无可辩驳的实证数据确立地球赤道隆起之理，成为科学革命跨越大洋的巅峰见证。"
 oe_syn.4.a: "倾力资助赤道三角测量，刊刻传世《基多赤道弧度星图志》"
 oe_syn.4.b: "以国礼嘉奖测绘学者，广布星图并汲取启蒙测绘新法"
 oe_syn.5.t: "切萨皮克大议会与罗马元老院：大西洋双雄宪法对话"
 oe_syn.5.d: "切萨皮克湾畔的大理石廊柱与树皮长屋在金色暮光中隔水相望。随着极乐洲罗马盟邦与易洛魁五部缔结持久协定，佩戴鹰羽冠的长屋议长与身披紫边长袍的元老院使节共执海贝盟带与镀金鹰杖，围绕《大和平法》的邦联共识表决、部落自治与罗马元老院共和分权展开了震动大西洋两岸的宪法对话。"
 oe_syn.5.a: "融汇大和平法共识与元老院法理，颁行双雄宪政共鸣章程"
 oe_syn.5.b: "以贝壳盟带与元老国玺担保大西洋西岸毛皮与铁器自由商道"
 oe_syn.6.t: "铁幕长屋：双头鹰与美洲本土联盟的世纪对决"
 oe_syn.6.d: "阿巴拉契亚山脊的苍翠林海间不再有和平使者的炊烟，取而代之的是星罗棋布的罗马边墙棱堡与易洛魁—卡霍基亚抗衡联邦的战火烽烟。双头鹰军团以严整火枪棱堡步步紧逼，泛北美长屋联军则以缴获改良的火器、林间奇袭与跨部落同盟寸土必争——美洲大陆的命运正在这场铁血对决中剧烈重塑。"
 oe_syn.6.a: "全面动员精锐战团与林间火枪劲旅，决胜北疆世纪争霸"
 oe_syn.6.b: "沿着前沿河谷构筑纵深石垒与木栅防线，稳固持久消耗优势"
 oe_syn.7.t: "跨洋本草与大瘟疫免疫录：从特诺奇蒂特兰到伦敦与北京"
 oe_syn.7.d: "当特诺奇蒂特兰的草药药典与安第斯金鸡纳树皮抗热良方乘着横跨大洋的船帆抵达旧大陆，再经由伦敦、君士坦丁堡与北京的印书坊迅速排印译行，一场静默却挽救百万生灵的医学革命席卷全球。曾经令新旧大陆闻风丧胆的烈性大瘟疫，终于在跨文明本草学与公共防疫体系的联手阻击下显露退潮之势。"
 oe_syn.7.a: "设立官办跨洋本草医局，将新旧大陆良方普及全国城乡"
 oe_syn.7.b: "精刻《环球百草刊印总录》，供太医院与皇家科学院世代研习"
 oe_syn.8.t: "98/98 典藏里程碑：万邦启明合奏"
 oe_syn.8.d: "沐浴在启蒙穹顶投下的金色天光中，来自欧洲、东罗马与奥斯曼地中海、东亚江南与京师、埃塞俄比亚与廷巴克图、基尔瓦珊瑚港以及特诺奇蒂特兰、库斯科与易洛魁长屋的学者、航海家与外交使节齐聚于巨大的黄铜地球仪前。九十八条主线史诗在此圆满汇流——这不再是某一隅帝国的独唱，而是欧、亚、非、美四大洲文明交相辉映的《万邦启明合奏》！"
 oe_syn.8.a: "铭刻《万邦启明合奏金册》，永志四洲文明并立之辉煌纪元"
 oe_syn.90.t: "v13.0 跨文明合奏 · 实时只读审计台账"
