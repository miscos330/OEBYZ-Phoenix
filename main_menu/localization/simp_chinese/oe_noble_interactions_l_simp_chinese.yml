l_simp_chinese:
 oe_npi_support: "请求政治支持"
 oe_npi_support_desc: "豪门的门生故旧遍布朝野。一份足够体面的馈赠，足以让他们在御前与乡里为皇帝张目。\n\n条件：豪族忠诚度大于50，对东罗马的关系大于100，内帑足够支付三个月经常收入。费用全数交给该豪族，获得2权威。全国共享12个月冷却。"
 oe_npi_honor: "赐予宫廷荣衔"
 oe_npi_honor_desc: "在朝会上宣读敕书，准其家门享有显贵的荣衔。皇帝以礼遇换取归心，家族亦借此增重于朝野。\n\n条件：忠诚度大于50，对东罗马的关系大于50。消耗1权威；该家族影响力增加2，对东罗马的关系增加50、忠诚度增加10，后两项持续3年。每家冷却36个月。"
 oe_npi_recommend: "请荐门客"
 oe_npi_recommend_desc: "请家主从门下宾客中择取贤才，以荐书送入帝国朝廷。此人将以才干侍奉皇帝，也让举荐者在朝中多一分声望。\n\n条件：忠诚度大于50，对东罗马的关系大于150。消耗1权威，该家族影响力增加2。荐来的门客为罗马文化、东正教，行政、外交或军事能力至少一项大于65。每家冷却36个月。"
 OE_NPI_SELECT_HOUSE: "选择豪族"
 OE_NPI_LOYALTY_50: "该豪族忠诚度大于 #Y 50#!"
 OE_NPI_RELATIONS_50: "该豪族对东罗马的关系大于 #Y 50#!"
 OE_NPI_RELATIONS_100: "该豪族对东罗马的关系大于 #Y 100#!"
 OE_NPI_RELATIONS_150: "该豪族对东罗马的关系大于 #Y 150#!"
 OE_NPI_SUPPORT_COOLDOWN: "全国过去 #Y 12个月#! 内未请求豪族政治支持"
 OE_NPI_HONOR_COOLDOWN: "过去 #Y 36个月#! 内未向该家族赐予宫廷荣衔"
 OE_NPI_RECOMMEND_COOLDOWN: "过去 #Y 36个月#! 内未向该家族请荐门客"
 OE_NPI_PURSE_REQUIRED: "内帑足够支付三个月经常收入"
 OE_NPI_AUTHORITY_REQUIRED: "至少拥有 #Y 1#! 权威"
 OE_NPI_SUPPORT_EFFECT: "支付三个月内帑经常收入，全部转给所选豪族；获得 #G 2#! 权威。全国进入 #Y 12个月#! 冷却。"
 OE_NPI_HONOR_EFFECT: "消耗 #R 1#! 权威；该家族获得 #G 2#! 影响力、#G 50#! 对东罗马的关系、#G 10#! 忠诚度。关系与忠诚加成持续 #Y 3年#!，该家族荣衔互动冷却 #Y 36个月#!。"
 OE_NPI_RECOMMEND_EFFECT: "消耗 #R 1#! 权威；该家族获得 #G 2#! 影响力。从豪族门客中延揽一位罗马文化、东正教的贤才，至少一项能力大于 #Y 65#!。该家族荐举互动冷却 #Y 36个月#!。"
 oe_npi_court_honor_opinion: "御赐宫廷荣衔"
 STATIC_MODIFIER_NAME_oe_npi_court_honor: "御赐宫廷荣衔"
 STATIC_MODIFIER_DESC_oe_npi_court_honor: "皇帝赐予的荣衔，使这个家族更愿意维护帝国朝廷的秩序。"
 oe_npi_support_cd: "请求政治支持：全国冷却"
 oe_npi_honor_cd: "宫廷荣衔：家族冷却"
 oe_npi_recommend_cd: "请荐门客：家族冷却"
 oe_np_monthly_change: "家族影响力每月变动"
 oe_noble_interactions.1.t: "门下之贤"
 oe_noble_interactions.1.d: "应皇帝之请，[scope:oe_npi_patron.GetName]从门下宾客中择取了一位颇负才名之士。如今，[scope:oe_npi_recommended.GetName]携荐书抵达君士坦丁堡，愿以所学侍奉帝国。\n\n这位信奉正教的罗马人已进入我们的朝廷。荐书上的家印既是一份担保，也提醒着人们：贤才的进身，往往离不开门第的引路。"
 oe_noble_interactions.1.a: "录其才，候旨任用。"
