# NEW 2026-11-24 v25.0 Phase 4B 1337 Great Yuan/Early Ming Deep Flavor & Mechanic Pack (oe_v250_yua_, gen_v250_1337_mos_yua.py) — simp_chinese localization (179 keys). Edit gen_v250_1337_mos_yua.py, not this file.
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_bayan_regency:0 "伯颜强硬摄政·尊崇蒙古旧制"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_bayan_regency:0 "太师伯颜废止科举、力挺草原怯薛与蒙古旧勋，铁骑士气陡振，却令江南儒士商民离心且格致文治受阻。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_keju_reopened:0 "重开科举·延纳儒臣参政"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_keju_reopened:0 "天子顺从脱脱之请复行科举取士，中书省文治与研学效率大振，却引起守旧蒙古权贵猜忌并推高军费统筹负担。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_dadu_court_balance:0 "大都宫廷权衡调停"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_dadu_court_balance:0 "天子在伯颜旧党与儒臣新派之间小心折衷，暂保朝堂安稳与藩属体面，然皇权决断与税赋整顿均显迟滞。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_zhizheng_new_deal:0 "脱脱「至正新政」与三史并修"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_zhizheng_new_deal:0 "丞相脱脱整饬吏治、开经筵并诏修《辽》《金》《宋》三史确立大元正统，皇权与政务焕然一新，却触怒既得食邑权贵。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_moderate_zhizheng:0 "至正温和节流之策"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_moderate_zhizheng:0 "仅裁减宫廷冗费而不触动诸王勋贵岁赐，岁入与朝局尚称平稳，却难扭转旧贵坐大与文教迟滞。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_three_histories:0 "敕修辽金宋三史正统"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_three_histories:0 "倾力礼聘汉蒙儒士共纂三史以彰大元承接华夏正朔，文华与法统声望大盛，惟海量馆阁开支消耗财税。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_yellow_river_corvee:0 "白茅堤大征民夫堵口"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_yellow_river_corvee:0 "朝廷强征河南山东数十万丁夫抢筑黄河大堤，力保中原农盐根基不毁，然徭役惨重致使民怨沸腾、动荡隐伏。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_granary_relief:0 "开仓赈灾与黄淮免赋"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_granary_relief:0 "大开常平仓赈济黄淮灾民并缓征赋役，灾区人心渐安、民生稍复，惟中央国库与丁壮兵源俱遭重耗。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_provincial_dike_neglect:0 "责成行省自理河工"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_provincial_dike_neglect:0 "中书省为保全大都库银将河工推诿河南与山东地方自筹，短期税赋无损，然溃水横流致使地方繁荣与管控双双滑落。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_zhizheng_sound_coin:0 "至正银本位币制整肃"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_zhizheng_sound_coin:0 "严控印钞额度并以实银与至正通宝铜钱收兑旧钞，商贸与税收信誉逐步回稳，代价是官府工程与宫廷开支被迫紧缩。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_emergency_jiaochao:0 "滥印至正交钞救急"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_emergency_jiaochao:0 "宝钞提举司日夜赶印新钞填补军政亏空，解燃眉之急而物价腾涌，江南商帮拒收纸钞、民心大失。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_dual_silver_market:0 "驰禁铜钱白银民间流通"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_dual_silver_market:0 "默许江南与运河市镇以私铸铜钱和碎银计价交易，商帮欢呼、陆路商贸回暖，却削弱了朝廷垄断铸币权与赋税掌控。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_jialu_canal_restored:0 "贾鲁治河复通会通运河"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_jialu_canal_restored:0 "工部尚书贾鲁以十五万民夫昼夜疏浚会通河并塞决归故道，南北漕运与粮产重现奇迹，然河工怨气已成红巾暗火。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_paid_canal_works:0 "雇工修河与沿河重兵镇慑"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_paid_canal_works:0 "朝廷出实银雇募河工并沿黄淮布防精兵弹压白莲秘社，漕粮与治安兼顾，惟庞大雇费与军饷压垮财政。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_abandoned_canal_work:0 "罢停河工改倚海运"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_abandoned_canal_work:0 "下诏罢停大规模黄淮征夫以免激起民变，乡民松气且迫使海运扩容，却令南北内河商道与京畿粮源长期受制。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_armed_haiyun_escorts:0 "武装海运护漕战船"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_armed_haiyun_escorts:0 "沿海船场赶造巡海战船护送江南海运漕船冲破浙东海盗封锁，京师粮道重畅，惟水师经费与沿海税耗俱增。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_requisitions:0 "河北山东紧急征粮屯垦"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_requisitions:0 "海路受阻之际强令直隶与山东州县紧急输粮充实大都军仓，暂保京畿兵食无缺，却令北方农庄元气大伤。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_haiyun_chartered_captains:0 "招抚沿海海商船主领漕"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_haiyun_chartered_captains:0 "以海运万户爵衔招抚浙闽豪商船主代输漕米，海利与水手充盈，然朝廷威仪受损且地方商阀尾大不掉。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_loyalist_militia_lords:0 "倚重察罕帖木儿等地方义兵统帅"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_loyalist_militia_lords:0 "朝廷破格授察罕帖木儿与汉地团练将领行省兵马大权，精锐义师屡破红巾、军威大振，却种下地方军阀割据之患。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_central_keshig_banners:0 "重整中枢怯薛与宗王铁骑"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_central_keshig_banners:0 "斥巨资从漠北征召宗王精骑重编京师怯薛禁军，皇权与重骑战力得以维系，然饷银浩繁且汉地兵源动员受限。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_censorate_military_audit:0 "御史台监军节制诸将"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_censorate_military_audit:0 "分遣御史与枢密院判官轮番督察地方团练与宗王军营，朝廷政令不致旁落，却因文官掣肘令前线将士士气低落。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_palace_guard_centralized:0 "皇太子爱猷识理答腊总领禁卫"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_palace_guard_centralized:0 "收拢大都禁卫与抚军院实权归于东宫，中枢威权与禁军严整度显著提升，却激化与山西、大同边将及藩属的猜忌。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_frontier_warlord_accord:0 "划定边镇防区息止内讧"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_frontier_warlord_accord:0 "明诏承认扩廓帖木儿与孛罗帖木儿各自防区以止宫廷兵争，边军与属邦暂复效命，惟中央集权与岁入大打折扣。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_secretariat_mediation:0 "中书省改组调和东宫与边镇"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_secretariat_mediation:0 "遣老成宗室与儒臣改组中书省协调东宫与边帅粮饷，政局与内阁效率趋稳，惟高昂调停经费与冗官开支日增。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_liaodong_bulwark:0 "辽阳重镇与鸭绿江铁骑边防"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_liaodong_bulwark:0 "重修辽阳城池并调派精骑扼守鸭绿江北岸以防高丽北进与流寇窜扰，东北门户坚如磐石，然边防耗费颇巨。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_goryeo_flank_accord:0 "大都—开京北疆通好协约"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_goryeo_flank_accord:0 "遣使与高丽恭愍王达成体面和解、互市辽东边关，省去东顾之忧并振兴陆贸，惟宗主威势与边骑锐气稍逊。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_liaodong_marches:0 "辽东诸部世袭边镇屯戍"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_liaodong_marches:0 "授辽东本土军户与蒙古诸部就地屯牧自守，源源不绝补充东北兵力与守卒，代价是朝廷对辽东的直接控制力削弱。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "黄册户籍与鱼鳞图册大丈量"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "倾举国书吏清丈天下田亩绘成《鱼鳞图册》并编造《黄册》户籍，豪强隐田无所遁形，税收、产出与控制力俱升，然大户士绅怨恨日深。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_gentry_lijia_compromise:0 "里甲耆老包税折衷制"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_gentry_lijia_compromise:0 "委任地方粮长与里甲耆老自行核报税额以换取乱后海内安宁，士绅顺服而田赋实收远逊朝廷预期。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_salt_guild_fisc:0 "开中盐引与市镇商税新法"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_salt_guild_fisc:0 "借官盐专卖与开中法吸引商帮输粮边镇并活络市镇商税，财货川流不息，而官盐价昂令乡民负担偏重。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_weisuo_colonies:0 "天下卫所屯田·养兵百万不费民粮"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_weisuo_colonies:0 "推行世袭军户屯田卫所制，实现边塞兵粮自给与庞大后备兵源，大幅压缩军费开支，然久屯疏操亦使野战精锐度略有下降。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_mobile_strike_corps:0 "北疆精锐机动铁骑集群"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_mobile_strike_corps:0 "重饷供养脱产专训的京营与北疆机动重骑集群，千里奔袭锐不可当，代价是常年高额军饷严重吃紧国库。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_wall_garrisons:0 "九边关堡火器戍防体系"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_wall_garrisons:0 "依托居庸、山海、大同等关隘修筑砖石军城并配发火铳碗口炮，守险与攻城火力兼优，然高昂城防维护压缩野战募兵规模。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_haijin_tribute_order:0 "海禁海防与勘合朝贡秩序"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_haijin_tribute_order:0 "厉行片板不得下海之禁，将番舶悉数纳入官营朝贡勘合体制并加固沿海卫所，威权与海防严密而东南海商饱受窒息。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_open_ports:0 "泉杭广市舶司开港抽分"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_open_ports:0 "在泉州刺桐、杭州与广州设市舶司明定抽分税率招徕南海番舶，海贸银钱暴涨而沿海商阀豪强亦渐难尽数羁縻。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_coastal_patrol_fleet:0 "帝国沿海巡洋水师"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_coastal_patrol_fleet:0 "大造楼船福船编练常备海防巡洋舰队扫荡倭寇与走私，水师战力与海员储备冠绝东亚，然高昂造船养舰耗资惊人。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_grand_canal_artery:0 "京杭大运河漕运大动脉"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_grand_canal_artery:0 "彻底疏通会通河船闸与扬州至京畿的千里运河干道，南北粮货奔流不息，惟常年岁修河道与闸官俸禄占用颇多财政工程之力。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_imperial_censorate:0 "御史台纠察与六部考成"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_imperial_censorate:0 "整饬都察院与行台御史风宪，配合六部严密考课地方钱谷刑名，皇权与政务效率大进，却令勋贵官僚人人自危。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_bureaus:0 "敕设东南市舶提举司"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_bureaus:0 "制度化管理泉州、杭州与广州三地市舶抽分与番坊商市，坐享海上丝绸之路丰厚关税，同时壮大了沿海市民商帮势力。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_passes_watch:0 "北疆九边关隘巡阅整备"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_passes_watch:0 "按期巡阅大同、辽阳与京畿北口关堡，补足军粮箭矢与城防器械，北疆戍卒士气倍增而关隘军费负担亦随之走高。"
 oe_v250_yua_ref_zhongshu_xing_sheng:0 "行中书省统筹制"
 oe_v250_yua_ref_zhongshu_xing_sheng_desc:0 "以中书省派出之行中书省节制天下军政钱谷并犬牙交错划定省界，大幅强化皇权、内阁效率与月度控制力，代价是庞大的省府衙门开支与地方权贵不满。"
 oe_v250_yua_ref_huangce_weisuo_order:0 "黄册卫所兵农合一制"
 oe_v250_yua_ref_huangce_weisuo_order_desc:0 "将全国编户齐民登记于《黄册》并把军户编入自耕卫所，以深厚农业根基支撑税收、兵源与粮食供应，代价是内敛抑商导致海贸效率与市民满意度下滑。"
 oe_v250_yua_priv_ortoq_merchant_guild:0 "斡脱商团与盐引专卖特许"
 oe_v250_yua_priv_ortoq_merchant_guild_desc:0 "特许斡脱官商与两淮盐商凭借官银本钱与盐引经营丝路与运河巨贸，提升商贸收入、商队运力与市民满意，同时助长商帮权势、侵蚀皇权并推升微幅通胀。"
 oe_v250_yua_priv_hanlin_gentry_exemption:0 "翰林书院与儒户优免特许"
 oe_v250_yua_priv_hanlin_gentry_exemption_desc:0 "给予书院学田与在籍儒户徭役田赋优免以兴文教，持续提升研学速度、识字率与文教阶层拥护，代价是优免势大直接折损田赋税收与王室直控份额。"
 oe_v250_yua_cab_caoyun_canal_office:0 "漕运总督署河道督运"
 oe_v250_yua_cab_caoyun_canal_office_desc:0 "遣漕运使臣驻节目标行省疏浚河道、督造漕船并清查转运仓廪，提升该省粮产、繁荣与控制上限并惠及全国粮贸，代价是官署开支上升与沿岸农夫劳役微怨。"
 oe_v250_yua_cab_caoyun_canal_office_action:0 "漕运总督署河道督运：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_caoyun_canal_office_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行漕运总督署河道督运"
 oe_v250_yua_cab_caoyun_canal_office_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress_wordier:0 "漕运总督署河道督运（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress_tooltip:0 "遣漕运使臣驻节目标行省疏浚河道、督造漕船并清查转运仓廪，提升该省粮产、繁荣与控制上限并惠及全国粮贸，代价是官署开支上升与沿岸农夫劳役微怨。"
 oe_v250_yua_cab_caoyun_canal_office_select_province:0 "选择一个行省派遣漕运总督署官吏督运"
 oe_v250_yua_cab_caoyun_canal_office_no_provinces:0 "@trigger_no! 当前没有可供派遣漕运督运官的合格行省。"
 oe_v250_yua_cab_tuntian_garrison:0 "边疆军户屯田戍卫"
 oe_v250_yua_cab_tuntian_garrison_desc:0 "在目标边疆或要塞行省编置军户屯田营堡，兼顾垦荒备粮、城防加固与兵源充实，代价是地方手工业产出分流与边堡修缮维护压力增加。"
 oe_v250_yua_cab_tuntian_garrison_action:0 "边疆军户屯田戍卫：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_tuntian_garrison_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行边疆军户屯田戍卫"
