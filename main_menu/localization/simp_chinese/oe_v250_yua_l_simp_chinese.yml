# NEW 2026-11-24 v25.0 Phase 4B 1337 Great Yuan/Early Ming Deep Flavor & Mechanic Pack (oe_v250_yua_, gen_v250_1337_mos_yua.py) — simp_chinese localization (80 keys). Edit gen_v250_1337_mos_yua.py, not this file.
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "黄册户籍与鱼鳞图册大丈量"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "倾举国书吏清丈天下田亩绘成《鱼鳞图册》并编造《黄册》户籍，豪强隐田无所遁形，税收、产出与控制力俱升，然大户士绅怨恨日深。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_gentry_lijia_compromise:0 "里甲耆老包税折衷制"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_gentry_lijia_compromise:0 "委任地方粮长与里甲耆老自行核报税额以换取乱后海内安宁，士绅顺服而田赋实收远逊朝廷预期。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_salt_guild_fisc:0 "开中盐引与市镇商税新法"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_salt_guild_fisc:0 "借官盐专卖与开中法吸引商帮输粮边镇并活络市镇商税，财货川流不息，而官盐价昂令乡民负担偏重。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_weisuo_colonies:0 "天下卫所屯田·养兵百万不费民粮"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_weisuo_colonies:0 "推行世袭军户屯田卫所制，实现边塞兵粮自给与庞大后备兵源，大幅压缩军费开支，然久屯疏操亦使野战精锐度略有下降。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_mobile_strike_corps:0 "北疆精锐机动铁骑集群"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_mobile_strike_corps:0 "重饷供养脱产专训的京营与北疆机动重骑集群，千里奔袭锐不可当，代价是常年高额军饷严重吃紧国库。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_wall_garrisons:0 "九边关堡火器戍防体系"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_wall_garrisons:0 "依托居庸、山海、大同等关隘修筑砖石军城并配发火铳碗口炮，守险与攻城火力兼优，然高昂城防维护压缩野战募兵规模。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_haijin_tribute_order:0 "海禁海防与勘合朝贡秩序"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_haijin_tribute_order:0 "厉行片板不得下海之禁，将番舶悉数纳入官营朝贡勘合体制并加固沿海卫所，威权与海防严密而东南海商饱受窒息。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_open_ports:0 "泉杭广市舶司开港抽分"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_open_ports:0 "在泉州刺桐、杭州与广州设市舶司明定抽分税率招徕南海番舶，海贸银钱暴涨而沿海商阀豪强亦渐难尽数羁縻。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_coastal_patrol_fleet:0 "帝国沿海巡洋水师"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_coastal_patrol_fleet:0 "大造楼船福船编练常备海防巡洋舰队扫荡倭寇与走私，水师战力与海员储备冠绝东亚，然高昂造船养舰耗资惊人。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_grand_canal_artery:0 "京杭大运河漕运大动脉"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_grand_canal_artery:0 "彻底疏通会通河船闸与扬州至京畿的千里运河干道，南北粮货奔流不息，惟常年岁修河道与闸官俸禄占用颇多财政工程之力。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_imperial_censorate:0 "御史台纠察与六部考成"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_imperial_censorate:0 "整饬都察院与行台御史风宪，配合六部严密考课地方钱谷刑名，皇权与政务效率大进，却令勋贵官僚人人自危。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_bureaus:0 "敕设东南市舶提举司"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_bureaus:0 "制度化管理泉州、杭州与广州三地市舶抽分与番坊商市，坐享海上丝绸之路丰厚关税，同时壮大了沿海市民商帮势力。"
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_passes_watch:0 "北疆九边关隘巡阅整备"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_passes_watch:0 "按期巡阅大同、辽阳与京畿北口关堡，补足军粮箭矢与城防器械，北疆戍卒士气倍增而关隘军费负担亦随之走高。"
 oe_v250_yua_ref_zhongshu_xing_sheng:0 "行中书省统筹制"
 oe_v250_yua_ref_zhongshu_xing_sheng_desc:0 "以大元中书省派出之行中书省节制天下军政钱谷并犬牙交错划定省界，大幅强化皇权、内阁效率与月度控制力，代价是庞大的省府衙门开支与地方权贵不满。"
 oe_v250_yua_ref_huangce_weisuo_order:0 "黄册卫所兵农合一制"
 oe_v250_yua_ref_huangce_weisuo_order_desc:0 "大明洪武朝将全国编户齐民登记于《黄册》并把军户编入自耕卫所，以深厚农业根基支撑税收、兵源与粮食供应，代价是内敛抑商导致海贸效率与市民满意度下滑。"
 oe_v250_yua_priv_ortoq_merchant_guild:0 "斡脱商团与盐引专卖特许"
 oe_v250_yua_priv_ortoq_merchant_guild_desc:0 "特许大元斡脱官商与两淮盐商凭借官银本钱与盐引经营丝路与运河巨贸，提升商贸收入、商队运力与市民满意，同时助长商帮权势、侵蚀皇权并推升微幅通胀。"
 oe_v250_yua_priv_hanlin_gentry_exemption:0 "翰林书院与儒户优免特许"
 oe_v250_yua_priv_hanlin_gentry_exemption_desc:0 "大明朝廷给予书院学田与在籍儒户徭役田赋优免以兴文教，持续提升研学速度、识字率与文教阶层拥护，代价是优免势大直接折损田赋税收与王室直控份额。"
 oe_v250_yua_cab_caoyun_canal_office:0 "漕运总督署河道督运"
 oe_v250_yua_cab_caoyun_canal_office_desc:0 "遣漕运使臣驻节目标行省疏浚河道、督造漕船并清查转运仓廪，提升该省粮产、繁荣与控制上限并惠及全国粮贸，代价是官署开支上升与沿岸农夫劳役微怨。"
 oe_v250_yua_cab_caoyun_canal_office_action:0 "漕运总督署河道督运：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_caoyun_canal_office_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行漕运总督署河道督运"
 oe_v250_yua_cab_caoyun_canal_office_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress_wordier:0 "漕运总督署河道督运（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress_tooltip:0 "遣漕运使臣驻节目标行省疏浚河道、督造漕船并清查转运仓廪，提升该省粮产、繁荣与控制上限并惠及全国粮贸，代价是官署开支上升与沿岸农夫劳役微怨。"
 oe_v250_yua_cab_caoyun_canal_office_select_province:0 "选择一个行省派遣漕运总督署官吏督运"
 oe_v250_yua_cab_caoyun_canal_office_no_provinces:0 "@trigger_no! 当前没有可供派遣漕运督运官的合格行省。"
 oe_v250_yua_cab_tuntian_garrison:0 "边疆军户屯田戍卫"
 oe_v250_yua_cab_tuntian_garrison_desc:0 "在目标边疆或要塞行省编置军户屯田营堡，兼顾垦荒备粮、城防加固与兵源充实，代价是地方手工业产出分流与边堡修缮维护压力增加。"
 oe_v250_yua_cab_tuntian_garrison_action:0 "边疆军户屯田戍卫：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_tuntian_garrison_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行边疆军户屯田戍卫"
 oe_v250_yua_cab_tuntian_garrison_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_tuntian_garrison_action_progress_wordier:0 "边疆军户屯田戍卫（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_tuntian_garrison_action_progress_tooltip:0 "在目标边疆或要塞行省编置军户屯田营堡，兼顾垦荒备粮、城防加固与兵源充实，代价是地方手工业产出分流与边堡修缮维护压力增加。"
 oe_v250_yua_cab_tuntian_garrison_select_province:0 "选择一个边疆或要塞行省编置军户屯田戍卫"
 oe_v250_yua_cab_tuntian_garrison_no_provinces:0 "@trigger_no! 当前没有可供编置军户屯田的边疆或要塞行省。"
 oe_v250_yua_dec_dredge_grand_canal.title:0 "疏浚京杭大运河与会通河闸"
 oe_v250_yua_dec_dredge_grand_canal.desc:0 "平定乱局后统筹南北水工重修会通河船闸并疏通扬州、徐州至京畿的千里运河干线。需未处红巾之乱（且1370年后或明朝/中兴告成），掌控大都或应天以及扬州或徐州，并花费 #Y 200#! 金币，获得 #Y 25年#! 的 #Y 京杭大运河漕运大动脉#!（提升陆贸、粮食与产出，同时增加岁修与宫廷工程负担）。"
 oe_v250_yua_dec_dredge_grand_canal.a:0 "诏令疏通南北千里大运河"
 oe_v250_yua_dec_imperial_censorate.title:0 "重整御史台与六部考成"
 oe_v250_yua_dec_imperial_censorate.desc:0 "乱后肃清朝堂积弊、整饬御史台巡按风宪并与六部钱谷刑名考成联动。需未处红巾之乱（且1370年后或明朝/中兴告成）、统辖至少 #Y 30#! 处领地、稳定度不低于 #Y 8#! 并花费 #Y 160#! 金币，获得 #Y 25年#! 的 #Y 御史台纠察与六部考成#!（提升内阁效率、皇权与税效，同时引起勋贵不满与稳定度维系成本上升）。"
 oe_v250_yua_dec_imperial_censorate.a:0 "颁诏整饬御史台与六部纲纪"
 oe_v250_yua_dec_shibosi_charter.title:0 "敕设东南三港市舶提举司"
 oe_v250_yua_dec_shibosi_charter.desc:0 "战乱平息后在泉州刺桐、杭州或广州重整市舶提举司，明定番舶抽分税则与南海航运货栈。需未处红巾之乱（且1370年后或明朝/中兴告成）并花费 #Y 150#! 金币，获得 #Y 25年#! 的 #Y 敕设东南市舶提举司#!（提升海贸效率、商税与商人实力，同时让渡部分皇权与市民阶层势力）。"
 oe_v250_yua_dec_shibosi_charter.a:0 "敕设东南市舶司并颁抽分税则"
 oe_v250_yua_dec_northern_passes_watch.title:0 "巡阅北疆关隘与九边戍堡"
 oe_v250_yua_dec_northern_passes_watch.desc:0 "每 #Y 15年#! 可遣钦差巡阅一次大都北口、大同与辽阳沿线关隘，花费 #Y 120#! 金币补足城防粮械，获得陆军传统与 #Y 12年#! 的 #Y 北疆九边关隘巡阅整备#!（大幅提升要塞防御、守军补充与陆军士气，同时加重城防维护与微幅财税消耗）。"
 oe_v250_yua_dec_northern_passes_watch.a:0 "遣钦差拨饷巡阅北疆关隘"
 oe_v250_yua_passes_cd_tt:0 "近15年内未曾巡阅过北疆关隘"
 oe_v250_yua.10.t:0 "大明洪武新制"
 oe_v250_yua.10.d:0 "历经元末大乱洗礼，大明新朝甫定江南与中原，天下田籍早已残缺不全，各地豪强乘机兼并隐匿良田、将苛税转嫁无告贫农。户部提议动用全国官吏与国子监生编造《黄册》户籍与《鱼鳞图册》地籍彻底清丈田亩；亦可委任地方里甲耆老自行核报以息士绅之怒，或改以官盐引票与商税作为重建财源。"
 oe_v250_yua.10.a:0 "遣官清丈天下田亩，编纂《黄册》户籍与《鱼鳞图册》"
 oe_v250_yua.10.b:0 "委任地方粮长与里甲耆老自行核报税额，以和缓士绅抵触"
 oe_v250_yua.10.c:0 "专意整顿开中盐引与市镇商帮税关，减轻田赋之争"
 oe_v250_yua.11.t:0 "卫所屯田军户与草原机动铁骑之争"
 oe_v250_yua.11.d:0 "绵延辽东至河西的万里北疆耗费海量军粮与银两，朝堂兵部正就帝国长久军制展开激辩：一派主张全面推行「七分屯种、三分守城」的世袭卫所军户制，做到养兵百万不费百姓一粒米；一派则力陈屯军久必废弛，唯有高饷供养脱产专训的机动骑兵集群方能决胜漠北；亦有将领建议倚重砖石边城与火炮关堡以守代攻。"
 oe_v250_yua.11.a:0 "广设世袭卫所军屯，以兵农合一实现百万大军自给自足"
 oe_v250_yua.11.b:0 "重饷编练脱产精锐机动骑兵集群，备战漠北远征"
 oe_v250_yua.11.c:0 "加筑北疆砖石关堡并配发火铳火炮，以坚城扼制草原"
 oe_v250_yua.12.t:0 "帝国海疆国策"
 oe_v250_yua.12.d:0 "自泉州刺桐、杭州以至广州，东南沿海走私银铜与倭寇劫掠交织，令朝廷对万顷沧溟心存戒备。礼部与兵部保守派力主厉行海禁、严筑沿海卫所，仅许藩国持勘合朝贡通商；户部与江南有识之士则力劝大开市舶司定额抽分，化私商为巨额关税；水师老将更建言耗资大造巡洋战船以武力肃清东海与南海航道。"
 oe_v250_yua.12.a:0 "厉行海禁并加固沿海卫所，一切海外往来悉归勘合朝贡"
 oe_v250_yua.12.b:0 "在泉州、杭州与广州设市舶司定额抽分，广纳南海商舶"
 oe_v250_yua.12.c:0 "大造沿海巡洋水师战船，以重兵武力清剿走私与海寇"
