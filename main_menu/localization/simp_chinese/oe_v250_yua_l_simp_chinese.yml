 oe_v250_yua_dec_dredge_grand_canal.title:0 "疏浚京杭大运河与会通河闸"
 oe_v250_yua_dec_dredge_grand_canal.desc:0 "统筹南北水工重修会通河船闸并疏通扬州、徐州至京畿的千里运河干线。需掌控大都或应天以及扬州或徐州，并花费 #Y 200#! 金币，永久获得 #Y 京杭大运河漕运大动脉#!（提升陆贸、粮食与产出，同时增加常年岁修与宫廷工程负担）。"
 oe_v250_yua_dec_dredge_grand_canal.a:0 "诏令疏通南北千里大运河"
 oe_v250_yua_dec_imperial_censorate.title:0 "重整御史台与六部考成"
 oe_v250_yua_dec_imperial_censorate.desc:0 "肃清朝堂积弊、整饬御史台巡按风宪并与六部钱谷刑名考成联动。需统辖至少 #Y 30#! 处领地、稳定度不低于 #Y 8#! 并花费 #Y 160#! 金币，永久获得 #Y 御史台纠察与六部考成#!（提升内阁效率、皇权与税效，同时引起勋贵不满与稳定度维系成本上升）。"
 oe_v250_yua_dec_imperial_censorate.a:0 "颁诏整饬御史台与六部纲纪"
 oe_v250_yua_dec_shibosi_charter.title:0 "敕设东南三港市舶提举司"
 oe_v250_yua_dec_shibosi_charter.desc:0 "在泉州刺桐、杭州或广州设立正规市舶提举司，明定番舶抽分税则与南海航运货栈。花费 #Y 150#! 金币，永久获得 #Y 敕设东南市舶提举司#!（提升海贸效率、商税与商人实力，同时让渡部分皇权与市民阶层势力）。"
 oe_v250_yua_dec_shibosi_charter.a:0 "敕设东南市舶司并颁抽分税则"
 oe_v250_yua_dec_northern_passes_watch.title:0 "巡阅北疆关隘与九边戍堡"
 oe_v250_yua_dec_northern_passes_watch.desc:0 "每 #Y 15年#! 可遣钦差巡阅一次大都北口、大同与辽阳沿线关隘，花费 #Y 120#! 金币补足城防粮械，获得陆军传统与 #Y 12年#! 的 #Y 北疆九边关隘巡阅整备#!（大幅提升要塞防御、守军补充与陆军士气，同时加重城防维护与微幅财税消耗）。"
 oe_v250_yua_dec_northern_passes_watch.a:0 "遣钦差拨饷巡阅北疆关隘"
 oe_v250_yua_passes_cd_tt:0 "近15年内未曾巡阅过北疆关隘"
 oe_v250_yua.1.t:0 "伯颜强硬摄政与儒臣废科之争"
 oe_v250_yua.1.d:0 "蔑儿乞部权相伯颜专断大都朝纲，既已诏罢科举、抑遏汉人南人入仕，更欲严申草原旧法以固蒙古贵胄特权。然而其侄脱脱与翰林诸儒暗中密奏顺帝妥懽帖睦尔：若任由江南士大夫寒心离心，中原财赋与天下大统恐难久安。天子坐于大明殿中，必须决定是倚重伯颜铁骑旧党、密谋复行科举，还是暂行权衡调停。"
 oe_v250_yua.1.a:0 "力挺伯颜与蒙古守旧勋贵，以草原铁骑震慑四方"
 oe_v250_yua.1.b:0 "采纳脱脱密谏重开科举，延揽儒臣整顿中书省"
 oe_v250_yua.1.c:0 "在权相与儒臣之间折衷权衡，暂免大都宫廷流血"
 oe_v250_yua.2.t:0 "脱脱「至正新政」与辽金宋三史之修"
 oe_v250_yua.2.d:0 "黜落权相伯颜后，中书右丞相脱脱改元至正、雷厉推行新政：一方面裁革宫廷冗费、清查中书省积弊、重振国子监与经筵，另一方面力排众议下诏并修《辽史》《金史》《宋史》，以三朝各为正统彰显大元混一南北之合法性。然此举已触痛宗王贵戚岁赐之利，朝中反对声浪暗流汹涌。"
 oe_v250_yua.2.a:0 "全力推行至正全面新政，肃清吏治并修三史"
 oe_v250_yua.2.b:0 "仅裁减宫廷日常冗费，不触动诸王勋贵岁赐旧例"
 oe_v250_yua.2.c:0 "专意拨款敕修《辽》《金》《宋》三史以安天下儒心"
 oe_v250_yua.3.t:0 "至正四年黄河白茅堤大决口"
 oe_v250_yua.3.d:0 "连月暴雨骤降中原，黄河在开封曹州白茅堤轰然溃决，浊浪北冲安山运河、南灌淮泗平原，山东盐场尽成泽国、数十万黎庶流离失所。中书省御前急议：是强征河南与山东丁夫冒雨堵口保住运河盐税，是倾仓赈灾并豁免黄淮田赋以安民心，还是责成行省地方自行筹款治水以保全大都库银？"
 oe_v250_yua.3.a:0 "强征河南山东数十万民夫抢筑白茅大堤，力保粮盐命脉"
 oe_v250_yua.3.b:0 "大开常平仓赈济灾民，豁免黄淮两省当年田赋"
 oe_v250_yua.3.c:0 "责成河南与山东行省自行治水，保全大都中央库藏"
 oe_v250_yua.4.t:0 "交钞滥发与至正币制危机"
 oe_v250_yua.4.d:0 "连年赈灾、佛事赏赐与治水军费已将平准库中充作钞本的白银耗蚀殆尽，中统钞与至元钞在江南市镇几乎沦为废纸，米价日涨、豪商囤积铜钱不肯受钞。户部呈上三策：以实银与精铸至正通宝铜钱收兑旧钞厉行紧缩，赶印新版至正交钞先解财政燃眉之急，或干脆驰禁民间白银铜钱并行贸易。"
 oe_v250_yua.4.a:0 "厉行银铜本位至正改币，压缩官费重塑钞信"
 oe_v250_yua.4.b:0 "日夜赶印新版至正交钞，先行填补军政与工程亏空"
 oe_v250_yua.4.c:0 "驰禁民间以铜钱与碎银自由计价，稳住江南商路"
 oe_v250_yua.5.t:0 "贾鲁治河与会通大运河疏浚"
 oe_v250_yua.5.d:0 "水利名臣贾鲁力陈「疏、塞并举」之策，请发汴梁与大名等地民夫十五万，在一个汛季内彻底塞决归故道并疏通淤塞的会通运河，使江南漕船直抵大都。然枢密院密报称，白莲教与弥勒秘社正潜入河工营寨散播「石人一只眼，挑动黄河天下反」的谶语；此时强征兴工，成则为千秋水利，败则恐点燃红巾烽火。"
 oe_v250_yua.5.a:0 "力排众议支持贾鲁强征治河，一举复通南北大运河"
 oe_v250_yua.5.b:0 "发实银雇工并调重兵沿河驻守，严防白莲教趁机起事"
 oe_v250_yua.5.c:0 "下诏罢停黄淮大征夫役，改倚东南海运与北方农产"
 oe_v250_yua.6.t:0 "东南海运漕粮封锁危机"
 oe_v250_yua.6.d:0 "浙东海上豪强方国珍拥舰截掠庆元与太仓航道，江南烽烟又令岁输大都的三百万石「海运」漕米几近断绝。京师直沽海口千帆寂寥、粮价飞涨，中书省急须破局：是倾力编练武装护漕战船强行杀开海路，是改从河北与山东紧急征粮屯田以救京师，还是赐爵招抚东南海商船主代领海运？"
 oe_v250_yua.6.a:0 "敕造武装护漕战船，强行护送江南米船北抵直沽"
 oe_v250_yua.6.b:0 "改于河北山东紧急征粮扩屯，摆脱对江南海路的依赖"
 oe_v250_yua.6.c:0 "赐海运万户爵衔招抚东南商船豪强，换取海漕复通"
 oe_v250_yua.7.t:0 "草原宗王与汉地义兵统帅之权衡"
 oe_v250_yua.7.d:0 "承平日久，元朝旧制驻防诸省的蒙古探马赤军早已颓废难战，反而是察罕帖木儿、李思齐等人在河南与陕西自募乡勇团练连克红巾重镇。枢密院陷入两难：若将行省军政财权全盘委付这些忠勇的地方义兵统帅，可望迅速戡乱却恐成唐末藩镇之势；若重金从漠北重整中央怯薛与宗王铁骑，又恐缓不济急；或可遣御史监军居中牵制。"
 oe_v250_yua.7.a:0 "破格授察罕帖木儿等地方义兵统帅行省兵马便宜行事权"
 oe_v250_yua.7.b:0 "斥资自漠北征调宗王精骑重编中央怯薛，严控兵权"
 oe_v250_yua.7.c:0 "分遣御史台与枢密院文臣轮番监军，兼制义兵与宗王"
 oe_v250_yua.8.t:0 "大都宫廷党争与皇太子爱猷识理答腊"
 oe_v250_yua.8.d:0 "南方大敌当前，大都深宫之中却爆发剧烈权争：皇太子爱猷识理答腊与奇皇后借河南统帅扩廓帖木儿之势谋划监国，而大同总帅孛罗帖木儿则以清君侧为名陈兵居庸关下，北方忠元诸军竟在太行山西麓自相残杀。顺帝必须火速决断：是放手让东宫收拢禁卫强压边帅，是划定各自防区承认边镇自治以止干戈，还是改组中书省居中调停？"
 oe_v250_yua.8.a:0 "授权皇太子总领大都禁卫与抚军院，铁腕弹压跋扈边帅"
 oe_v250_yua.8.b:0 "颁诏划定扩廓与孛罗各自防区，以边镇自治换取停火御敌"
 oe_v250_yua.8.c:0 "延请宗室元老改组中书省，统筹东宫与诸镇粮饷调解"
 oe_v250_yua.9.t:0 "辽东门户与高丽北疆外交"
 oe_v250_yua.9.d:0 "高丽恭愍王已在开京诛杀亲元奇氏外戚、废止征东行省理问所并挥师收复双城总管府，同时北窜的红巾余部亦频频惊扰辽阳与沈阳。若辽东侧翼失守，不仅京师东北门户洞开，更将断绝通往漠北与满洲的战略退路。朝廷须在重兵加固辽阳城防、遣使高丽缔结体面和约，或授辽东本地诸部就地屯守之间做出抉择。"
 oe_v250_yua.9.a:0 "拨银加固辽阳重镇并增派铁骑扼守鸭绿江防线"
 oe_v250_yua.9.b:0 "遣使开京与高丽缔结体面边疆和约，重开辽东互市"
 oe_v250_yua.9.c:0 "授辽东本地诸部与军户就地屯牧自守，免耗中枢库银"
 oe_v250_yua.10.t:0 "黄册户籍与鱼鳞图册大丈量"
 oe_v250_yua.10.d:0 "历经数十年战火洗礼，无论紫禁天子坐镇应天抑或中兴大都，天下田籍早已残缺不全，江南与中原大户乘机兼并隐匿良田、将苛税转嫁无告贫农。户部提议动用全国官吏与国子监生编造《黄册》户籍与《鱼鳞图册》地籍彻底清丈田亩；亦可委任地方里甲耆老自行核报以息士绅之怒，或改以官盐引票与商税作为重建财源。"
 oe_v250_yua.10.a:0 "遣官清丈天下田亩，编纂《黄册》户籍与《鱼鳞图册》"
 oe_v250_yua.10.b:0 "委任地方粮长与里甲耆老自行核报税额，以和缓士绅抵触"
 oe_v250_yua.10.c:0 "专意整顿开中盐引与市镇商帮税关，减轻田赋之争"
 oe_v250_yua.11.t:0 "卫所屯田军户与草原机动铁骑之争"
 oe_v250_yua.11.d:0 "绵延辽东至河西的万里北疆耗费海量军粮与银两，朝堂兵部正就帝国长久军制展开激辩：一派主张全面推行「七分屯种、三分守城」的世袭卫所军户制，做到养兵百万不费百姓一粒米；一派则力陈屯军久必废弛，唯有高饷供养脱产专训的机动骑兵集群方能决胜漠北；亦有将领建议倚重砖石边城与火炮关堡以守代攻。"
 oe_v250_yua.11.a:0 "广设世袭卫所军屯，以兵农合一实现百万大军自给自足"
 oe_v250_yua.11.b:0 "重饷编练脱产精锐机动骑兵集群，备战漠北远征"
 oe_v250_yua.11.c:0 "加筑北疆砖石关堡并配发火铳火炮，以坚城扼制草原"
 oe_v250_yua.12.t:0 "帝国海疆国策：朝贡海禁抑或开港市舶"
 oe_v250_yua.12.d:0 "自泉州刺桐、杭州以至广州，东南沿海走私银铜与倭寇劫掠交织，令朝廷对万顷沧溟心存戒备。礼部与兵部保守派力主厉行海禁、严筑沿海卫所，仅许藩国持勘合朝贡通商；户部与江南有识之士则力劝大开市舶司定额抽分，化私商为巨额关税；水师老将更建言耗资大造巡洋战船以武力肃清东海与南海航道。"
 oe_v250_yua.12.a:0 "厉行海禁并加固沿海卫所，一切海外往来悉归勘合朝贡"
 oe_v250_yua.12.b:0 "在泉州、杭州与广州设市舶司定额抽分，广纳南海商舶"
 oe_v250_yua.12.c:0 "大造沿海巡洋水师战船，以重兵武力清剿走私与海寇"
