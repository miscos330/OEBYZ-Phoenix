 oe_yw.8.d: "#F 元制，诸王与后妃、公主各有投下食邑：食邑的民户照常向朝廷纳税，另外每五户出丝一斤归本位领主；这份五户丝和江南的户钞都由朝廷代征，再和岁赐一起发给（《元史》卷九十五）。忽必烈以后，诸王在食邑里只能派驻一名达鲁花赤，其余官吏都由朝廷任命。#!\n\n如今，一位宗王的食邑已不在朝廷与诸藩手中，今年的五户丝无从征收。\n食邑收复以后，岁赐恢复如常，这里的处置随之作废；这件事每位宗王只问一次。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.8.a: "以内帑代偿"
 oe_yw.8.a.tt: "只要其食邑仍陷，这位宗王的岁赐照常发给；朝廷每年为这份岁赐多付#R 50%#!，向别处买丝代输。忠诚不变。"
 oe_yw.8.b: "岁赐减半"
 oe_yw.8.b.tt: "只要其食邑仍陷，这位宗王的岁赐减半，朝廷也只付一半；其忠诚目标#R −5#!。"
 oe_yw.8.c: "停发岁赐"
 oe_yw.8.c.tt: "只要其食邑仍陷，这位宗王不再领岁赐，也不记欠赐；其忠诚目标#R −10#!（阳翟王、云南王这样的远藩#R −15#!）。"
 oe_yw.9.t: "仍奉北元正朔"
 oe_yw.9.d1: "#F 至正二十八年（1368年）大都失守、顺帝北退以后，镇守昆明的梁王把匝剌瓦尔密仍奉北元宣光正朔，数次遣使越过河西与草原往来。河西道绝以后，云南孤悬西南，至洪武十四年（1381年）明军入滇方告覆亡。#!\n\n如今大都既失，云南一隅犹奉旧朝正朔。梁王府已得[ShowModifier('oe_yw_liang_loyal')]；若兰州、肃州皆失、河西道绝，则另受[ShowModifier('oe_yw_liang_cut_off')]之困，直至河西重通或至1390年为止。"
 oe_yw.9.d: "#F 至正二十八年（1368年）大都失守、顺帝北退以后，镇守昆明的梁王把匝剌瓦尔密仍奉北元宣光正朔，数次遣使越过河西与草原往来。河西道绝以后，云南孤悬西南，至洪武十四年（1381年）明军入滇方告覆亡。#!\n\n如今中原既变，远在西南的云南梁王犹据昆明、奉行旧朔。梁王已得[ShowModifier('oe_yw_liang_loyal')]；若河西道绝，则另受[ShowModifier('oe_yw_liang_cut_off')]之困，直至河西重通或至1390年为止。"
 oe_yw.9.a: "仍奉旧朔"
 oe_yw.10.t: "请依唐宋故事"
 oe_yw.10.d: "#F 洪武十四年（1381年）明军克昆明、梁王亡后，大理总管段明、段世先后上书明将傅友德与蓝玉，请依唐宋故事，比照外臣奉正朔、岁贡方物，而不改土归流；明廷不许，遂兴兵入大理。#!\n\n如今大元已逝，中原新主威加西南。大理段氏进退两难：是要援引唐宋旧例、上书求为外臣，还是倚苍山洱海之险固守到底？"
 oe_yw.10.a: "请依唐宋故事，求为外臣"
 oe_yw.10.a.tt: "若存在非蒙古文化的天朝领袖，双方互增好感#G +25#!（#Y 60#!个月）。不强行变更附属关系或领土。"
 oe_yw.10.b: "固守洱海，拒不屈服"
 oe_yw.10.b.tt: "若存在非蒙古文化的天朝领袖，双方好感#R −30#!（#Y 60#!个月）。"
 oe_yw.11.t: "豳王西徙"
 oe_yw.11.d1: "#F 出伯后王世镇河西西端：豳王驻肃州、西宁王驻沙州、肃王驻瓜州、威武西宁王守哈密；同在河西的亦都护高昌王一系则在元亡后东归附明。大都与甘肃既失，出伯诸王退保赤斤、瓜沙与哈密一线，直至洪武十三年明将濮英克赤斤站获豳王亦怜真、二十四年明军破哈密。#!\n\n如今中原与甘肃已变，出伯后王退守瓜州、沙州与哈密一线。王府已得[ShowModifier('oe_yw_bin_westward')]（持续10年），凭西陲骑兵与旧部自保。"
 oe_yw.11.d: "#F 出伯后王世镇河西西端：豳王驻肃州、西宁王驻沙州、肃王驻瓜州、威武西宁王守哈密；同在河西的亦都护高昌王一系则在元亡后东归附明。大都与甘肃既失，出伯诸王退保赤斤、瓜沙与哈密一线，直至洪武十三年明将濮英克赤斤站获豳王亦怜真、二十四年明军破哈密。#!\n\n如今中原与甘肃已变，河西西端的出伯后王西徙瓜沙与哈密一线自保，同在河西的亦都护高昌王一系则另谋归附。豳王已得[ShowModifier('oe_yw_bin_westward')]（持续10年）。"
 oe_yw.11.a: "退守瓜沙哈密"
 oe_yw.20.t: "上都库里台大朝会"
 oe_yw.20.d: "#F 元朝承蒙古旧制，大汗每夏巡幸上都，宗室诸王、驸马与怯薛大臣皆赴大安阁会盟，颁行岁赐、核定五户丝账册并议定军国大政。每十年一届或新君即位后的首次大朝会，更是维系草原宗藩与中原朝廷的枢纽。#!\n\n如今，上都大安阁鼓乐齐鸣，诸道宗王使节与中书省重臣齐聚殿前。围绕#bold #color_yellow 岁赐#!#!旧俗、折钞财税与汉法集权三大路线，朝廷当于本次库里台定下十年大计。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.20.a: "恪守祖制，厚赐稳宗王"
 oe_yw.20.a.tt: "全部在册宗王忠诚#G +12#!，独立倾向#G −10#!。"
 oe_yw.20.b: "核实五户丝，折钞节流"
 oe_yw.20.b.tt: "全部在册宗王忠诚#G +4#!，折钞核籍节省中央岁赐开支。"
 oe_yw.20.c: "推行汉法，削宗室专权"
 oe_yw.20.c.tt: "全部在册宗王忠诚#R −8#!，中枢政务效率与全国控制力大幅提升。"
 oe_yw.21.t: "东道与豳王索赐危机"
 oe_yw.21.d: "#F 元末中原战火延绵，平乱之势低迷时，岁赐与五户丝往往难以为继。东道诸王与河西宗室手握重兵，见朝廷威权受挫，常遣使驰入大都质问岁赐并要求增给军饷。#!\n\n如今平乱之势危急，数位离心宗王联名遣使入京，声言若不立发欠赐与军资，便不再应诏出兵。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.21.a: "动用内帑应急补赐，以稳北疆"
 oe_yw.21.a.tt: "离心宗王忠诚#G +15#!且独立倾向#G −10#!；其余在册宗王忠诚#G +8#!。"
 oe_yw.21.b: "颁诏晓以宗室大义，令恭顺诸王协防"
 oe_yw.21.b.tt: "恭顺与怠慢宗王忠诚#G +5#!；离心宗王忠诚#R −5#!、独立倾向#R +5#!。"
 oe_yw.21.c: "严词斥责索赐要挟，整肃投下官属"
 oe_yw.21.c.tt: "离心宗王忠诚#R −10#!、独立倾向#R +15#!，但维系了朝廷中枢威严。"
