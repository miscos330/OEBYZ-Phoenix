 # NEW 2026-11-19 Yuan track Y5b (oe_yw_ the Yuan princes). Generated by gen_yuan_y5b.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_yw_tier_loyal: "藩王恭顺"
 STATIC_MODIFIER_DESC_oe_yw_tier_loyal: "这位宗王按时领受#bold #color_yellow 岁赐#!#!，常赴#bold #color_yellow 上都朝会#!#!，精锐蒙古铁骑与壮丁随时听调勤王。"
 STATIC_MODIFIER_NAME_oe_yw_tier_aloof: "藩王怠慢"
 STATIC_MODIFIER_DESC_oe_yw_tier_aloof: "这位宗王对元廷态度观望：#bold #color_yellow 岁赐#!#!与朝会仅循常例，发兵征调颇多迟疑。"
 STATIC_MODIFIER_NAME_oe_yw_tier_estranged: "藩王离心"
 STATIC_MODIFIER_DESC_oe_yw_tier_estranged: "这位宗王与元廷离心离德，不仅抗命不赴征调，更阻滞北疆商路与贡道。"
 STATIC_MODIFIER_NAME_oe_yw_overlord_loyal_host: "诸王勤王铁骑"
 STATIC_MODIFIER_DESC_oe_yw_overlord_loyal_host: "恭顺的投下宗王持续向大元输送精锐铁骑与兵源（每位忠诚达70的在册宗王叠加1层，最高10层）。"
 STATIC_MODIFIER_NAME_oe_yw_kurultai_tradition_mod: "上都库里台：祖制厚赐"
 STATIC_MODIFIER_DESC_oe_yw_kurultai_tradition_mod: "大汗于上都库里台恪守祖制、厚赐投下诸王，诸藩铁骑踊跃效命。"
 STATIC_MODIFIER_NAME_oe_yw_kurultai_commute_mod: "上都库里台：折钞节流"
 STATIC_MODIFIER_DESC_oe_yw_kurultai_commute_mod: "朝廷于上都库里台核实五户丝账册、推行银钞折算，保住了中原财税与物价平稳。"
 STATIC_MODIFIER_NAME_oe_yw_kurultai_hanlaw_mod: "上都库里台：汉法集权"
 STATIC_MODIFIER_DESC_oe_yw_kurultai_hanlaw_mod: "朝廷借上都库里台裁抑宗室专权、推行汉法典章，大幅提升中枢与地方政务效能。"
 STATIC_MODIFIER_NAME_oe_yw_crisis_strict_mod: "严诏肃藩"
 STATIC_MODIFIER_DESC_oe_yw_crisis_strict_mod: "面对危局中诸王索赐的要挟，朝廷严词整肃投下官属，维系中枢威信。"
 STATIC_MODIFIER_NAME_oe_yw_commuted_vassal_mod: "折钞改土新藩"
 STATIC_MODIFIER_DESC_oe_yw_commuted_vassal_mod: "原投下宗王已和平改隶常规藩属，停止支领中央岁赐，赋役改由朝廷统筹。"
 STATIC_MODIFIER_NAME_oe_yw_qas_horses: "齐王献马"
 STATIC_MODIFIER_DESC_oe_yw_qas_horses: "合撒儿后王献来的马群充实了大元的骑兵。"
 STATIC_MODIFIER_NAME_oe_yw_tusi_unrest: "土司叛服"
 STATIC_MODIFIER_DESC_oe_yw_tusi_unrest: "西南土司时叛时服，对云南梁王府心怀异志。"
 STATIC_MODIFIER_NAME_oe_yw_liang_loyal: "仍奉北元正朔"
 STATIC_MODIFIER_DESC_oe_yw_liang_loyal: "大都既失，梁王犹据云南，奉北元宣光正朔不绝。"
 STATIC_MODIFIER_NAME_oe_yw_liang_cut_off: "河西道绝"
 STATIC_MODIFIER_DESC_oe_yw_liang_cut_off: "河西与甘陕要道已失，云南孤悬西南，使驿商路俱阻。"
 STATIC_MODIFIER_NAME_oe_yw_duan_petition: "请依唐宋故事"
 STATIC_MODIFIER_DESC_oe_yw_duan_petition: "大理段氏援引唐宋旧例，上书新朝请求作为外臣。"
 STATIC_MODIFIER_NAME_oe_yw_duan_defiant: "固守洱海"
 STATIC_MODIFIER_DESC_oe_yw_duan_defiant: "大理段氏拒不屈服，倚苍山洱海之险死守本土。"
 STATIC_MODIFIER_NAME_oe_yw_bin_westward: "豳王西徙"
 STATIC_MODIFIER_DESC_oe_yw_bin_westward: "中原既失，出伯后王退守瓜州、沙州与哈密一线，依托河西西端与西域旧部自保。"
 oe_yw_bw_shen_fail: "沈王党袭宫之败"
 oe_yw_bw_duan_aid: "大理援梁"
 oe_yw_bw_duan_slain: "梁王诱杀段功（一说）"
 oe_yw_bw_duan_peace: "梁段复和"
 oe_yw_bw_glh_grant: "领到分地岁赋"
 oe_yw_b_duan_petition: "请依唐宋故事"
 oe_yw_b_duan_defiant: "大理拒降"
 oe_yw_bw_bestow_seal: "朝廷赐予金印"
 oe_yw_touxia: "投下宗王"
 oe_yw_touxia_desc: "元朝的宗王世有投下分地，岁赐由朝廷代征、统一发放。投下宗王不能被宗主吞并，宗主也不能解除这层关系；它不能自行宣战，外交受宗主节制，随宗主参加防御战。忠诚档位为恭顺的宗王不待征召就随宗主出征，其余要宗主征召，离心的宗王不应征召。地图上保留自己的颜色。"
 LEAD_oe_yw_touxia: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_yw_touxia: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_yw_touxia_subject_opinion: "我们的大汗"
 oe_yw_touxia_overlord_opinion: "我们的宗王"
 oe_yw_touxia_join_tt: "这位宗王在大元诸王里的忠诚档位为恭顺"
 oe_yw_touxia_call_tt: "这位宗王在大元诸王里的忠诚档位不是离心"
 oe_yw.1.t: "册立弘吉剌氏为后"
 oe_yw.1.d: "#F 至元三年三月（1337年4月），顺帝以玉宝、玉册立弘吉剌氏伯颜忽都为皇后。弘吉剌氏世为后族；鲁王世镇应昌、全宁，两路的官属由鲁王自辟，朝廷不派。#!\n\n如今，册礼将行，鲁王的使者已到大都。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.1.a: "依旧制册立弘吉剌氏"
 oe_yw.1.a.tt: "鲁王的忠诚目标#G +10#!，持续#Y 60#!个月。"
 oe_yw.1.b: "册立，并厚赐后族"
 oe_yw.1.b.tt: "鲁王得到同额的金钱。\n鲁王的忠诚目标#G +15#!，持续#Y 60#!个月。"
 oe_yw.1.c: "册礼从简"
 oe_yw.1.c.tt: "鲁王的忠诚目标#R −10#!，持续#Y 24#!个月。"
 oe_yw.2.t: "郯王之死"
 oe_yw.2.d: "#F 至元五年（1339年），伯颜构陷郯王彻彻秃，奏请赐死；皇帝没有允准，伯颜径自传旨行刑。伯颜又奏贬宣让王、威顺王二王，不等诏下就办了。#!\n\n如今，诸王闻讯，人人自危。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.2.a: "隐忍不发"
 oe_yw.2.a.tt: "全部在册藩王的忠诚目标#R −10#!，直到伯颜失势满#Y 12#!个月、诸王复安为止。"
 oe_yw.2.b: "遣使慰谕诸王"
 oe_yw.2.b.tt: "这笔钱按#bold #color_yellow 岁赐#!#!的等级分给在册藩王（沈王不分）。\n全部在册藩王的忠诚目标#R −5#!，直到伯颜失势满#Y 12#!个月、诸王复安为止。"
 oe_yw.2.c: "下诏切责伯颜"
 oe_yw.2.c.tt: "诸王不生怨望。伯颜的去留不变。"
 oe_yw.3.t: "齐王献马"
 oe_yw.3.d1: "#F 至正十二年八月（1352年），齐王失列门献马一万五千匹于京师（一说万匹）。#!\n\n如今，齐王失列门的马群已到大都城外。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.3.d: "#F 至正十二年八月（1352年），齐王失列门献马一万五千匹于京师（一说万匹）。#!\n\n如今，合撒儿后王[GetCountry('QAS').GetGovernment.GetRuler.GetName]送来马群。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.3.a: "受马，厚加赏赉"
 oe_yw.3.a.tt: "合撒儿后王得到同额的金钱。\n合撒儿后王的忠诚目标#G +10#!，持续#Y 60#!个月。"
 oe_yw.3.b: "受马，记功而已"
 oe_yw.3.b.tt: "合撒儿后王的忠诚目标#G +5#!，持续#Y 60#!个月。"
 oe_yw.3.c: "却之不受"
 oe_yw.3.c.tt: "合撒儿后王的忠诚目标#R −10#!，持续#Y 60#!个月。"
 oe_yw.4.t: "进封梁王"
 oe_yw.4.d1: "#F 据《中国历史大辞典》，云南王阿鲁之弟孛罗于至正年间袭封云南王，至正十五年（1355年）因功进封梁王。#!\n\n如今，云南王府奏请加封。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.4.d: "#F 据《中国历史大辞典》，云南王阿鲁之弟孛罗于至正年间袭封云南王，至正十五年（1355年）因功进封梁王。#!\n\n如今，云南王府为王弟孛罗请功，奏请加封。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.4.a: "进封梁王"
 oe_yw.4.a.tt: "云南王的忠诚目标#G +10#!，持续#Y 60#!个月。\n云南改称“梁”。云南由AI操控时，其威望#Y +5#!。"
 oe_yw.4.b: "仍为云南王"
 oe_yw.4.b.tt: "云南王的忠诚目标#R −5#!，持续#Y 60#!个月。"
 oe_yw.5.t: "阳翟王索玺"
 oe_yw.5.d1: "#F 至正二十年（1360年），阳翟王阿鲁辉帖木儿拥兵数十万，屯于木儿古彻兀之地，将犯京畿。使者来说：“祖宗以天下付汝，汝已失其太半；若以国玺付我，我当自为之。”朝廷命知枢密院事秃坚帖木儿等迎击，不克。#!\n\n如今，阳翟王的使者站在殿前。\n阳翟王由AI操控时，这一来已使其独立倾向#R +10#!，忠诚目标#R −20#!（#Y 36#!个月）。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.5.d: "#F 至正二十年（1360年），阳翟王阿鲁辉帖木儿拥兵数十万，屯于木儿古彻兀之地，将犯京畿。使者来说：“祖宗以天下付汝，汝已失其太半；若以国玺付我，我当自为之。”朝廷命知枢密院事秃坚帖木儿等迎击，不克。#!\n\n如今，阳翟王的使者站在殿前。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.5.a: "命将讨之"
 oe_yw.5.a.tt: "阳翟王由AI操控时：次年下半年此乱可能平定，阳翟王的独立倾向#G −20#!，忠诚目标的减项随之撤除。"
 oe_yw.5.b: "厚赐安抚"
 oe_yw.5.b.tt: "阳翟王得到其中一半。\n阳翟王的忠诚目标改为#G +5#!，持续#Y 36#!个月。\n阳翟王由AI操控时：其独立倾向#G −10#!。"
 oe_yw.5.c: "置之不理"
 oe_yw.5.c.tt: "阳翟王忠诚目标的减项照旧。"
 oe_yw.6.t: "赵王夜遁"
 oe_yw.6.d1: "#F 至正十八年九月（1358年），赵王部下灭里作乱，要杀赵王。赵王位下同知怯怜口总管府事昔班帖木儿，其妻曾保育赵王。夫妻让儿子观音奴穿上赵王的衣冠留在王宫，半夜护着赵王换装逃走。乱兵赶到，杀了观音奴，赵王得免。#!\n\n如今，赵王的急报送到大都。\n赵王由AI操控时，此乱已使其稳定度#Y −7#!。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.6.d: "#F 至正十八年九月（1358年），赵王部下灭里作乱，要杀赵王。赵王位下同知怯怜口总管府事昔班帖木儿，其妻曾保育赵王。夫妻让儿子观音奴穿上赵王的衣冠留在王宫，半夜护着赵王换装逃走。乱兵赶到，杀了观音奴，赵王得免。#!\n\n如今，赵王的急报送到大都。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.6.a: "遣兵安辑汪古部"
 oe_yw.6.a.tt: "赵王由AI操控时：其稳定度#Y +7#!（抵回此乱的损失）。\n赵王的忠诚目标#G +10#!，持续#Y 60#!个月。"
 oe_yw.6.b: "令赵王自定其部"
 oe_yw.6.b.tt: "赵王的忠诚目标#R −5#!，持续#Y 60#!个月。"
 oe_yw.7.t: "沙州兵入蜀"
 oe_yw.7.d: "#F 出伯后王世镇河西西端：豳王驻肃州、西宁王驻沙州、威武西宁王守哈密；同驻河西的亦都护高昌王一系则在元亡后东归附明。至正十二年二月（1352年），朝廷命驻沙州的西宁王牙罕沙镇四川。十三年十二月，西宁王与江浙、四川行省诸军合击徐寿辉于蕲水，败之；同月还沙州，朝廷赐钞一千锭（《元史》卷四十二、四十三）。#!\n\n如今，红巾遍起，朝议调河西出伯后王的兵马入蜀。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.7.a: "调沙州兵入蜀"
 oe_yw.7.a.tt: "豳王得到同额的金钱。\n豳王由AI操控时：其人力的#G 10%#!调归大元。\n豳王的忠诚目标#G +5#!，持续#Y 36#!个月。"
 oe_yw.7.b: "令其留镇西陲"
 oe_yw.7.b.tt: "沙州兵留镇河西，别无变化。"
 oe_yw.8.t: "食邑陷没"
 oe_yw.8.d1: "#F 元制，诸王与后妃、公主各有投下食邑：食邑的民户照常向朝廷纳税，另外每五户出丝一斤归本位领主；这份五户丝和江南的户钞都由朝廷代征，再和岁赐一起发给（《元史》卷九十五）。忽必烈以后，诸王在食邑里只能派驻一名达鲁花赤，其余官吏都由朝廷任命。#!\n\n如今，齐王的食邑般阳路已不在朝廷与诸藩手中，今年的五户丝无从征收。齐王的使者来问：#bold #color_yellow 岁赐#!#!还照旧发吗？\n食邑收复以后，岁赐恢复如常，这里的处置随之作废；这件事每位宗王只问一次。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，#Y 40#!至69为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_estranged')]。"
