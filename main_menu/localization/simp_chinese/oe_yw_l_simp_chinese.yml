 # NEW 2026-11-19 Yuan track Y5b (oe_yw_ the Yuan princes). Generated by gen_yuan_y5b.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_yw_tier_loyal: "藩王恭顺"
 STATIC_MODIFIER_DESC_oe_yw_tier_loyal: "这位宗王按时领受#bold #color_yellow 岁赐#!#!，常赴#bold #color_yellow 上都朝会#!#!，对元廷恭顺。"
 STATIC_MODIFIER_NAME_oe_yw_tier_aloof: "藩王怠慢"
 STATIC_MODIFIER_DESC_oe_yw_tier_aloof: "这位宗王对元廷怠慢：#bold #color_yellow 岁赐#!#!不时，朝会不至。"
 STATIC_MODIFIER_NAME_oe_yw_tier_estranged: "藩王离心"
 STATIC_MODIFIER_DESC_oe_yw_tier_estranged: "这位宗王与元廷离心离德。"
 STATIC_MODIFIER_NAME_oe_yw_qas_horses: "齐王献马"
 STATIC_MODIFIER_DESC_oe_yw_qas_horses: "合撒儿后王献来的马群充实了大元的骑兵。"
 oe_yw_bw_shen_fail: "沈王党袭宫之败"
 oe_yw_bw_duan_aid: "大理援梁"
 oe_yw_bw_duan_slain: "梁王诱杀大理总管"
 oe_yw.1.t: "册立弘吉剌氏为后"
 oe_yw.1.d: "#F 至元三年三月（1337年4月），顺帝以玉宝、玉册立弘吉剌氏伯颜忽都为皇后。弘吉剌氏世为后族；鲁王世镇应昌、全宁，两路的官属由鲁王自辟，朝廷不派。#!\n\n如今，册礼将行，鲁王的使者已到大都。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.1.a: "依旧制册立弘吉剌氏"
 oe_yw.1.a.tt: "鲁王的忠诚目标#G +10#!，持续#Y 60#!个月。"
 oe_yw.1.b: "册立，并厚赐后族"
 oe_yw.1.b.tt: "鲁王得到同额的金钱。\n鲁王的忠诚目标#G +15#!，持续#Y 60#!个月。"
 oe_yw.1.c: "册礼从简"
 oe_yw.1.c.tt: "鲁王的忠诚目标#R −10#!，持续#Y 24#!个月。"
 oe_yw.2.t: "郯王之死"
 oe_yw.2.d: "#F 至元五年（1339年），伯颜构陷郯王彻彻秃，奏请赐死；皇帝没有允准，伯颜径自传旨行刑。伯颜又奏贬宣让王、威顺王二王，不等诏下就办了。#!\n\n如今，诸王闻讯，人人自危。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.2.a: "隐忍不发"
 oe_yw.2.a.tt: "全部在册藩王的忠诚目标#R −10#!，直到伯颜失势满#Y 12#!个月、诸王复安为止。"
 oe_yw.2.b: "遣使慰谕诸王"
 oe_yw.2.b.tt: "这笔钱按#bold #color_yellow 岁赐#!#!的等级分给在册藩王（沈王不分）。\n全部在册藩王的忠诚目标#R −5#!，直到伯颜失势满#Y 12#!个月、诸王复安为止。"
 oe_yw.2.c: "下诏切责伯颜"
 oe_yw.2.c.tt: "诸王不生怨望。伯颜的去留不变。"
 oe_yw.3.t: "齐王献马"
 oe_yw.3.d1: "#F 至正十二年八月（1352年），齐王失列门献马一万五千匹于京师（一说万匹）。#!\n\n如今，齐王失列门的马群已到大都城外。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.3.d: "#F 至正十二年八月（1352年），齐王失列门献马一万五千匹于京师（一说万匹）。#!\n\n如今，合撒儿后王[GetCountry('QAS').GetGovernment.GetRuler.GetName]送来马群。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.3.a: "受马，厚加赏赉"
 oe_yw.3.a.tt: "合撒儿后王得到同额的金钱。\n合撒儿后王的忠诚目标#G +10#!，持续#Y 60#!个月。"
 oe_yw.3.b: "受马，记功而已"
 oe_yw.3.b.tt: "合撒儿后王的忠诚目标#G +5#!，持续#Y 60#!个月。"
 oe_yw.3.c: "却之不受"
 oe_yw.3.c.tt: "合撒儿后王的忠诚目标#R −10#!，持续#Y 60#!个月。"
 oe_yw.4.t: "进封梁王"
 oe_yw.4.d1: "#F 据《中国历史大辞典》，云南王阿鲁之弟孛罗于至正年间袭封云南王，至正十五年（1355年）因功进封梁王。#!\n\n如今，云南王府奏请加封。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.4.d: "#F 据《中国历史大辞典》，云南王阿鲁之弟孛罗于至正年间袭封云南王，至正十五年（1355年）因功进封梁王。#!\n\n如今，云南王府为王弟孛罗请功，奏请加封。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.4.a: "进封梁王"
 oe_yw.4.a.tt: "云南王的忠诚目标#G +10#!，持续#Y 60#!个月。\n云南改称“梁”。云南由AI操控时，其威望#Y +5#!。"
 oe_yw.4.b: "仍为云南王"
 oe_yw.4.b.tt: "云南王的忠诚目标#R −5#!，持续#Y 60#!个月。"
 oe_yw.5.t: "阳翟王索玺"
 oe_yw.5.d1: "#F 至正二十年（1360年），阳翟王阿鲁辉帖木儿拥兵数十万，屯于木儿古彻兀之地，将犯京畿。使者来说：“祖宗以天下付汝，汝已失其太半；若以国玺付我，我当自为之。”朝廷命知枢密院事秃坚帖木儿等迎击，不克。#!\n\n如今，阳翟王的使者站在殿前。\n阳翟王由AI操控时，这一来已使其独立倾向#R +10#!，忠诚目标#R −20#!（#Y 36#!个月）。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.5.d: "#F 至正二十年（1360年），阳翟王阿鲁辉帖木儿拥兵数十万，屯于木儿古彻兀之地，将犯京畿。使者来说：“祖宗以天下付汝，汝已失其太半；若以国玺付我，我当自为之。”朝廷命知枢密院事秃坚帖木儿等迎击，不克。#!\n\n如今，阳翟王的使者站在殿前。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.5.a: "命将讨之"
 oe_yw.5.a.tt: "阳翟王由AI操控时：次年下半年此乱可能平定，阳翟王的独立倾向#G −20#!，忠诚目标的减项随之撤除。"
 oe_yw.5.b: "厚赐安抚"
 oe_yw.5.b.tt: "阳翟王得到其中一半。\n阳翟王的忠诚目标改为#G +5#!，持续#Y 36#!个月。\n阳翟王由AI操控时：其独立倾向#G −10#!。"
 oe_yw.5.c: "置之不理"
 oe_yw.5.c.tt: "阳翟王忠诚目标的减项照旧。"
 oe_yw.6.t: "赵王夜遁"
 oe_yw.6.d1: "#F 至正十八年九月（1358年），赵王部下灭里作乱，要杀赵王。赵王位下同知怯怜口总管府事昔班帖木儿，其妻曾保育赵王。夫妻让儿子观音奴穿上赵王的衣冠留在王宫，半夜护着赵王换装逃走。乱兵赶到，杀了观音奴，赵王得免。#!\n\n如今，赵王的急报送到大都。\n赵王由AI操控时，此乱已使其稳定度#Y −7#!。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.6.d: "#F 至正十八年九月（1358年），赵王部下灭里作乱，要杀赵王。赵王位下同知怯怜口总管府事昔班帖木儿，其妻曾保育赵王。夫妻让儿子观音奴穿上赵王的衣冠留在王宫，半夜护着赵王换装逃走。乱兵赶到，杀了观音奴，赵王得免。#!\n\n如今，赵王的急报送到大都。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.6.a: "遣兵安辑汪古部"
 oe_yw.6.a.tt: "赵王由AI操控时：其稳定度#Y +7#!（抵回此乱的损失）。\n赵王的忠诚目标#G +10#!，持续#Y 60#!个月。"
 oe_yw.6.b: "令赵王自定其部"
 oe_yw.6.b.tt: "赵王的忠诚目标#R −5#!，持续#Y 60#!个月。"
 oe_yw.7.t: "沙州兵入蜀"
 oe_yw.7.d: "#F 至正十二年二月（1352年），朝廷命驻沙州的出伯后王、西宁王牙罕沙镇四川。十三年十二月，西宁王与江浙、四川行省诸军合击徐寿辉于蕲水，败之；同月还沙州，朝廷赐钞一千锭（《元史》卷四十二、四十三）。#!\n\n如今，红巾遍起，朝议调河西出伯后王的兵马入蜀。\n说明：诸王的忠诚每月向忠诚目标移动#Y 1#!点；#Y 70#!以上为[ShowModifier('oe_yw_tier_loyal')]，低于#Y 40#!为[ShowModifier('oe_yw_tier_aloof')]，低于#Y 20#!为[ShowModifier('oe_yw_tier_estranged')]。"
 oe_yw.7.a: "调沙州兵入蜀"
 oe_yw.7.a.tt: "豳王得到同额的金钱。\n豳王由AI操控时：其人力的#G 10%#!调归大元。\n豳王的忠诚目标#G +5#!，持续#Y 36#!个月。"
 oe_yw.7.b: "令其留镇西陲"
 oe_yw.7.b.tt: "沙州兵留镇河西，别无变化。"
 oe_yw.20.t: "大元诸王：选项生效"
 oe_yw.21.t: "【测试】立即发一次岁赐"
 oe_yw.22.t: "【测试】立即开一次朝会"
 oe_yw.23.t: "【测试】立即执行世界步骤W7"
 oe_yw.90.t: "【测试】大元诸王（Y5b）读数"
