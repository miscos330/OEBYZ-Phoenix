 oe_col3_colonial_recruitment_bureau: "官办拓殖募民局"
 oe_col3_colonial_recruitment_bureau_desc: "朝廷设于母国良港、市场中心与海外先遣港的官办移民与物资调度署，负责招募拓荒农工、签发航海契约并统筹垦殖建材。只要全国建成至少一座募民局，即可激活全国拓殖募民网络，向新辟海外市场稳定输送基础殖民移民，彻底打破「+0 待定」冷启动僵局。"
 oe_col3_recruitment_bureau_upkeep: "募民契约与船坞补给维护"
 oe_col3_colonial_governor_palace: "海外总督行署"
 oe_col3_colonial_governor_palace_desc: "设于海外城镇与都会的高阶帝国总督府衙，充当海外区域的局部邻近度辐射核心（+35 邻近度源），大幅抬升当地控制力上限、月度控制与文化同化速度，并可被帝国驿道署自动识别为海外路网的顶级核心枢纽。"
 oe_col3_governor_palace_upkeep: "总督府仪仗与文书开销"
 oe_col3_chartered_company_law: "特许贸易公司法"
 oe_col3_chartered_company_law_desc: "界定国家如何经营跨洋航线、殖民商站与特许贸易专卖权：是将海贸大权收归王室专卖，授予股份制特许商社自主拓殖，还是敞开自由港以竞争催生移民与繁荣。"
 oe_col3_pol_crown_monopoly_trade: "王室专卖海贸"
 oe_col3_pol_crown_monopoly_trade_desc: "仿效印度贸易署与市舶司官营旧制，由王室与朝廷直接垄断香料、白银与海外属地贡赋，强化皇权与财政征收，但令大商团与市民阶层心生不满。"
 oe_col3_pol_joint_stock_charter: "特许股份商社"
 oe_col3_pol_joint_stock_charter_desc: "向跨洋股份商社颁授特许状与海上贸易专营权，充分调动民间资本扩充商船队、商团运力与远洋贸易射程，以部分王室权势换取巨额海贸红利。"
 oe_col3_pol_free_port_competition: "自由港竞争"
 oe_col3_pol_free_port_competition_desc: "废除封闭性的海贸垄断壁垒，向自由商船与移民敞开海外诸港，显著降低殖民特许状开支、加快移民浪潮并赢得海外附庸的持久忠诚。"
 oe_col3_cab_charter_monopoly: "特许商社专卖核查"
 oe_col3_cab_charter_monopoly_desc: "委派干练阁臣进驻沿海或市场重省，清查特许商社账册、整顿海外股息与商站补给，提升全国贸易收入、商团运力与殖民维护效率，并增强目标省的商贸聚集度与繁荣度。"
