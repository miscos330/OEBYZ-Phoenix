 AUTO_MODIFIER_NAME_oe_col3_overseas_bootstrap_mod: "海外新市场冷启动兜底"
 AUTO_MODIFIER_DESC_oe_col3_overseas_bootstrap_mod: "当本国持有活跃殖民特许状且海外市场中心或先遣港尚处人口稀少的起步阶段（不足 1.5 万）时，朝廷自动统筹基础拓殖移民与补给，防止新市场殖民陷入「+0 待定」停滞。"
 AUTO_MODIFIER_NAME_oe_col3_bureau_network_auto: "全国拓殖募民网络"
 AUTO_MODIFIER_DESC_oe_col3_bureau_network_auto: "凭借已建成的官办拓殖募民局，全国港口与海外先遣站形成贯通的募民补给网，持续注入平值与比例殖民移民加成并降低殖民维护负担。"
 STATIC_MODIFIER_NAME_oe_col3_supply_convoy_mod: "官办募民船队"
 STATIC_MODIFIER_DESC_oe_col3_supply_convoy_mod: "朝廷出资包租的官办募民与补给船队正在源源不断运送拓荒农工与建材，直接注入高额平值殖民移民，彻底打破海外新市场的冷启动死锁。"
 STATIC_MODIFIER_NAME_oe_col3_convoy_port_supply_mod: "先遣港官办补给"
 STATIC_MODIFIER_DESC_oe_col3_convoy_port_supply_mod: "官办船队卸下的铁器、良种、建材与粮秣令这座海外先遣港迅速兴旺，吸引移民定居、加快基建落成并提升自然人口增长。"
 STATIC_MODIFIER_NAME_oe_col3_frontier_charter_boost_mod: "边疆十年融合激励"
 STATIC_MODIFIER_DESC_oe_col3_frontier_charter_boost_mod: "新落成的海外特许拓殖重镇与总督行署享有十年朝廷融合扶持，大幅提升当地控制力上限、月度控制、移民吸引力与文化同化速度，并可吸引帝国驿道署优先铺通大道。"
 STATIC_MODIFIER_NAME_oe_col3_convoy_escort_shield_mod: "远洋护航舰队护盾"
 STATIC_MODIFIER_DESC_oe_col3_convoy_escort_shield_mod: "武装护航编队沿主要海贸航道日夜巡弋，显著提升反私掠战力、海贸效率与轻型战舰作战效能。"
 STATIC_MODIFIER_NAME_oe_col3_company_dividend_boom_mod: "特许商社红利热潮"
 STATIC_MODIFIER_DESC_oe_col3_company_dividend_boom_mod: "海外商站满载香料、瓷器与白银归航，丰厚的年度股息点燃交易所热情，提振全国贸易收入、商团运力与市民阶层满意度。"
 STATIC_MODIFIER_NAME_oe_col3_cartaz_defiance_mod: "武装破浪抗衡卡塔兹"
 STATIC_MODIFIER_DESC_oe_col3_cartaz_defiance_mod: "我方拒绝屈从海上通行证封锁，组建重炮商船与主力护航舰队强闯大洋航路，显著增强重舰战力、海贸效率与贸易射程。"
 STATIC_MODIFIER_NAME_oe_col3_pirate_crackdown_mod: "远洋私掠联合清剿"
 STATIC_MODIFIER_DESC_oe_col3_pirate_crackdown_mod: "海军与特许商社联合展开大洋清剿行动，捣毁海盗巢穴与私掠补给点，大幅增强反私掠效能、轻舰战力与海贸收益。"
 STATIC_MODIFIER_NAME_oe_col3_imperial_federation_mod: "帝国联邦宪章"
 STATIC_MODIFIER_DESC_oe_col3_imperial_federation_mod: "本土与海外诸省在帝国议会共享代表席位，以制度融合化解跨洋离心危机，长久稳固附庸忠诚、全国控制力、外交声誉与文化凝聚力。"
 STATIC_MODIFIER_NAME_oe_col3_colonial_autonomy_act_mod: "海外自治宪章"
 STATIC_MODIFIER_DESC_oe_col3_colonial_autonomy_act_mod: "朝廷承认海外领地的财政与地方自治权，以让渡部分直接附庸税赋换取附庸高忠诚、全阶层安定与繁荣的跨洋商业往来。"
 STATIC_MODIFIER_NAME_oe_col3_heavy_tariff_crackdown_mod: "海外苛税与高压弹压"
 STATIC_MODIFIER_DESC_oe_col3_heavy_tariff_crackdown_mod: "朝廷对海外领地强征重额印花税与关税以充实国库，虽在短期内拉高税收与附庸上缴，却严重撕裂附庸忠诚并助长各地叛乱暗流。"
 STATIC_MODIFIER_NAME_oe_col3_colonial_tea_boycott_mod: "海港倾茶与商团抵制"
 STATIC_MODIFIER_DESC_oe_col3_colonial_tea_boycott_mod: "海外港埠爆发抗税抵制浪潮，商团拒购宗主国货物、罢市抗议，令海贸收入受挫、市民阶层不满并加剧叛乱滋长。"
 STATIC_MODIFIER_NAME_oe_col3_independence_fervor_loc_mod: "海外独立思潮沸腾"
 STATIC_MODIFIER_DESC_oe_col3_independence_fervor_loc_mod: "自治议会与自由邦宣言点燃当地的独立浪潮，动乱骤升且宗主国控制力上限大幅跌落。"
 STATIC_MODIFIER_NAME_oe_col3_post_imperial_trade_pact_mod: "跨洋商业联邦和解条约"
 STATIC_MODIFIER_DESC_oe_col3_post_imperial_trade_pact_mod: "宗主国与高度自治的海外诸邦达成体面的商业联邦和解，共享低关税航路与外交互信，实现帝国后期的平稳软着陆。"
 oe_col3_convoy_ready_tt: "官办募民船队未处于 3 年冷却期"
 oe_col3_dec_colonial_supply_convoy.title: "派遣官办募民船与先遣补给"
 oe_col3_dec_colonial_supply_convoy.desc: "动用国库 75 金包租官办移民船队（每 3 年一次）：立即赐予全国 3 年平值与比例殖民移民加成，从本土人口最盛的非海外大省向海外先遣港及最多 2 份在建特许状持续定向输血 36 个月；若该海外先遣港人口不足一万，额外投放 500 名农工拓荒者与 5 年先遣补给，一举根治海外新市场「+0 待定」冷启动卡死！"
 oe_col3_dec_colonial_supply_convoy.a: "起锚发船，驰援海外拓荒！"
 oe_col3_dec_imperial_federation_seat.title: "颁行《帝国联邦议会代表法》"
 oe_col3_dec_imperial_federation_seat.desc: "自 1700 年起，面对日益壮大的海外大省与殖民附庸，朝廷可选择高瞻远瞩的「帝国联邦融合路线」：邀请海外总督辖区与忠诚附庸选派代表入驻帝国议会。需稳定度不低于 10 且未处于苛税高压期；颁行后立享 40 年帝国联邦宪章加成、大幅降低所有殖民附庸自由渴望（-25）并召开联邦颁行大典。"
 oe_col3_dec_imperial_federation_seat.a: "签署金印联邦宪章，万邦同席议政"
 oe_col3_dec_colonial_autonomy_act.title: "颁布《海外自治宪章》"
 oe_col3_dec_colonial_autonomy_act.desc: "自 1700 年起，若海外税争与抵制风潮日益激烈，朝廷可斥资 150 金果断颁布《海外自治宪章》，正式确认海外领地的地方自治与商业特权：立即平息海港倾茶抵制、授予 30 年海外自治宪章加成、降低所有殖民附庸自由渴望（-20），并开启跨洋商业联邦和解条约。"
 oe_col3_dec_colonial_autonomy_act.a: "颁行自治宪章，以怀柔保跨洋商盟"
