l_simp_chinese:
 OE_RW_ASSIM_DACIA_TITLE: "开启达契亚文化认同运动"
 OE_RW_ASSIM_DACIA_ROW: "达契亚文化"
 OE_RW_ASSIM_DACIA_FLAVOR: "多瑙河以北，牧道穿过喀尔巴阡山的隘口，集市与修院仍保存着古老语言的回声。随着帝国的法度、学校与军籍深入山地和平原，分居三地的居民将重新以达契亚之名，认同共同的罗马家园。"
 OE_RW_ASSIM_DACIA_CONDITION: "东罗马及其各级附属国拥有摩尔达维亚、瓦拉几亚、特兰西瓦尼亚三个地区至少65%的可征服地点，仅军事占领不算。"
 OE_RW_ASSIM_DACIA_NOT_STARTED: "尚未开启达契亚认同运动"
 OE_RW_ASSIM_DACIA_SOURCES: "转化整个罗马尼亚文化组：[ShowCultureName('aromanian')]、[ShowCultureName('istroromanian')]、[ShowCultureName('moldovan')]、[ShowCultureName('transylvanian')]、[ShowCultureName('wallachian')]。"
 OE_RW_ASSIM_DACIA_TARGET: "逐步形成[ShowCultureName('oe_moldova_greek_culture')]文化。\n\n$OE_RW_ASSIM_SUBJECT_SPREAD$"
 OE_RW_ASSIM_DACIA_WAITING: "尚未开启"
 OE_RW_ASSIM_DACIA_STARTED: "已开启：达契亚"
 oe_dacia_identity_movement: "达契亚文化认同运动"
 oe_dacia_identity_movement_desc: "多瑙河以北，牧道穿过喀尔巴阡山的隘口，集市与修院仍保存着古老语言的回声。随着帝国的法度、学校与军籍深入山地和平原，分居三地的居民将重新以达契亚之名，认同共同的罗马家园。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_rw_dacia_romanization_started: "已开启达契亚罗马化"
 oe_cb_byz_vs_wal: "吸血鬼的故乡"
 oe_cb_byz_vs_wal_desc: "多瑙河对岸的深林与峭壁间，传说总比使者走得更快。无论山中的领主以何种名号自居，帝国都将把秩序带回这片古老边地。\n\n仅东罗马可对瓦拉几亚制造并使用。进攻方割地、附庸化与释放国家的战争分数花费#G −50%#!，和平协议产生的侵略扩张（AE）#G −50%#!。"
 war_goal_oe_vampire_homeland: "征服瓦拉几亚"
 war_goal_oe_vampire_homeland_desc: "占领瓦拉几亚的领土，迫使其接受帝国的条件。"
 OE_RW_ASSIM_DACIA_PROGRESS: "当前拥有：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_dacia_owned')|0]／[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_dacia_total')|0]；开启需至少[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_dacia_required')|0]处。"
