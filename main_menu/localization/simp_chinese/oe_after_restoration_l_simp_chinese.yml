l_simp_chinese:
 OE_AR_PATH_1: "君士坦丁堡统御四方"
 OE_AR_PATH_2: "以罗马为都"
 OE_AR_PATH_3: "东西两都"
 OE_AR_TIER_1: "#G 从容#!"
 OE_AR_TIER_2: "#Y 疲惫#!"
 OE_AR_TIER_3: "#R 不堪重负#!"
 oe_ar_burden: "罗马的重担"
 oe_ar_burden_desc: "帝国光复了，守住它更难。\n\n帝国疲惫：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ar_strain').GetValue|0]#! / #Y 100#!　[GetCountry('BYZ').Custom('OeArTier')]　每月变化 [GetCountry('BYZ').MakeScope.ScriptValue('oe_ar_strain_delta')|1]\n首都方案：[GetCountry('BYZ').Custom('OeArPath')]　[oe_tu_exarchate|e] [GetCountry('BYZ').MakeScope.ScriptValue('oe_ar_exarch_count')|0] 个\n疲惫连续低于#Y 30#!已 [GetCountry('BYZ').MakeScope.GetVariable('oe_ar_low').GetValue|0] 个月（满#Y 120#!个月迎来罗马和平）\n\n疲惫每月的来源：领土规模（每#Y 600#!处#G +1#!，最多#G +2#!）；西部领土（意大利、北非、高卢、伊比利亚、不列颠，每#Y 300#!处#Y +1#!，最多#Y +3#!；以罗马为都减半，东西两都只算三成）；战争#Y +1#!，和平#Y −2#!；国库为负#Y +1#!；稳定度为负#Y +1#!，#Y 50#!以上#Y −1#!；每个总督区#Y −1#!（最多#Y −2#!）。\n#Y 30#!以上“疲惫”，#Y 60#!以上“不堪重负”，并会出现边境空虚、瘟疫等危机。"
 OE_AR_EXARCH_RAVENNA: "拉韦纳总督区"
 OE_AR_EXARCH_RAVENNA_ADJ: "拉韦纳总督区"
 OE_AR_EXARCH_CARTHAGE: "迦太基总督区"
 OE_AR_EXARCH_CARTHAGE_ADJ: "迦太基总督区"
 STATIC_MODIFIER_NAME_oe_ar_strained: "帝国疲惫"
 STATIC_MODIFIER_NAME_oe_ar_overburdened: "不堪重负"
 STATIC_MODIFIER_NAME_oe_ar_pax_romana: "罗马和平"
 STATIC_MODIFIER_NAME_oe_ar_senate: "重开的元老院"
 STATIC_MODIFIER_NAME_oe_ar_council_orthodox: "正教的胜利"
 STATIC_MODIFIER_NAME_oe_ar_council_union: "教会合一"
 STATIC_MODIFIER_NAME_oe_ar_council_roman: "罗马的首席"
 STATIC_MODIFIER_NAME_oe_ar_plague: "疫病蔓延"
 STATIC_MODIFIER_NAME_oe_ar_hollow_border: "空虚的边境"
 oe_ar_two_emperors_eased: "承认我们是“法兰克人的皇帝”"
 oe_ar_two_emperors_demand: "要求我们放弃罗马称号"
 oe_ar.1.t: "光复之后"
 oe_ar.1.d: "一千年来第一次，罗马、亚历山大、安条克和迦太基又在同一位皇帝治下。可查士丁尼的旧事人人都记得：他打下了意大利，三年后伦巴第人就来了。帝国要守住这一切，先得回答一个老问题：皇帝该住在哪里？"
 oe_ar.1.a: "君士坦丁堡统御四方"
 oe_ar.1.a.tt: "首都不动；远方的西部领土会让帝国疲惫增长最快"
 oe_ar.1.b: "迁都罗马"
 oe_ar.1.b.tt: "首都迁到罗马；西部领土带来的疲惫减半\n君士坦丁堡的贵族会怨恨：君士坦斯二世就是因迁都的传言死在浴室里的"
 oe_ar.1.c: "东西两都"
 oe_ar.1.c.tt: "保留君士坦丁堡，西部交给一位共治皇帝代管；西部领土带来的疲惫降到三成\n西部可能渐行渐远"
 oe_ar.2.t: "拉韦纳与迦太基"
 oe_ar.2.d: "六世纪时，帝国在意大利和非洲各设一位总督，军政大权集于一身：拉韦纳总督区和迦太基总督区。远方的行省需要一个能当场做主的人，而不是等君士坦丁堡的回信。"
 oe_ar.2.a: "设立总督区"
 oe_ar.2.a.tt: "在意大利和北非各设一个[oe_tu_exarchate|e]：辖区覆盖当地所有还不属于军区的帝国领土，按军区规则运作（忠诚、职能、反叛都照常），地位为总督区，每月把一成收入上缴国库\n每个总督区每月帝国疲惫#G −1#!"
 oe_ar.2.b: "继续直辖"
 oe_ar.3.t: "总督的野心"
 oe_ar.3.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ar_exarch').GetCountry.GetName]的总督手握一地军政，离京城又远。拉韦纳的埃莱夫塞里奥斯在619年、迦太基的格里高利在646年，都是这样走上自立为帝之路的。"
 oe_ar.3.a: "厚加赏赐"
 oe_ar.3.a.tt: "该[oe_tu_exarchate|e]忠诚#G +15#!，并计入忠诚目标#Y 5#!年"
 oe_ar.3.b: "召其回京"
 oe_ar.3.b.tt: "[oe_tu_authority|e]#R −5#!\n#Y 70%#!：总督卸任，换上新人\n#R 30%#!：总督拒绝回京，下月起兵"
 oe_ar.3.c: "静观其变"
 oe_ar.4.t: "浴室里的刺客"
 oe_ar.4.d: "迁都罗马之后，君士坦丁堡的贵族眼看着宫廷、税款和荣耀一起西去。有人在宫中侍从里收买人手。君士坦斯二世就是在叙拉古的浴室里，被自己的侍从用水桶打死的。"
 oe_ar.4.a: "彻查宫中"
 oe_ar.4.a.tt: "[oe_tu_authority|e]#R −5#!"
 oe_ar.4.b: "不以为意"
 oe_ar.4.b.tt: "#Y 30%#!：皇帝遇刺身亡"
 oe_ar.5.t: "西部的共治皇帝"
 oe_ar.5.d: "东西分治已经二十年，西部的总督们开始自己收税、自己议和，给君士坦丁堡的信越来越少。狄奥多西之后东西两半的故事，人人都知道结局。"
 oe_ar.5.a: "加强联系"
 oe_ar.5.a.tt: "[oe_tu_authority|e]#R −5#!\n所有[oe_tu_exarchate|e]忠诚#G +15#!，并计入忠诚目标#Y 5#!年"
 oe_ar.5.b: "放任自流"
 oe_ar.5.b.tt: "所有[oe_tu_exarchate|e]忠诚#R −20#!，并计入忠诚目标#Y 5#!年"
 oe_ar.6.t: "重设执政官"
 oe_ar.6.d: "罗马最后一位常任执政官巴西利乌斯在541年就职。如今帝国重归一统，有人提议恢复每年任命两位执政官、以执政官之名纪年的古制。"
 oe_ar.6.a: "恢复古制"
 oe_ar.6.a.tt: "以后每年年初有执政官就职庆典"
 oe_ar.6.b: "不必了"
 oe_ar.7.t: "罗马的元老院"
 oe_ar.7.d: "罗马的元老院已经沉寂了七百多年。如今皇帝回到了西方，罗马的世家请求重开元老院。"
 oe_ar.7.a: "给它发言权"
 oe_ar.7.a.tt: "[oe_tu_authority|e]#R −5#!\n获得“重开的元老院”（#Y 30#!年）"
 oe_ar.7.b: "只保留荣誉"
 oe_ar.8.t: "两个皇帝的问题"
 oe_ar.8.d: "[SCOPE.sCountry('oe_ar_hre').GetName]的君主仍然自称“罗马人的皇帝”。812年，拜占庭的使者在亚琛称查理曼为“皇帝”，却从未承认他是罗马人的皇帝。如今罗马在我们手里，这个问题该有个了断了。"
 oe_ar.8.a: "承认他是“法兰克人的皇帝”"
 oe_ar.8.a.tt: "对方的好感#G +50#!（每年回落#Y 2#!）"
 oe_ar.8.b: "要求他放弃罗马称号"
 oe_ar.8.b.tt: "获得对神圣罗马帝国皇帝的“恢复罗马疆界”宣战理由，#Y 20#!年\n对方的好感#R −50#!（每年回落#Y 2#!）"
 oe_ar.8.c: "不予理会"
 oe_ar.9.t: "普世大公会议"
 oe_ar.9.d: "罗马、君士坦丁堡、亚历山大、安条克、耶路撒冷，五大牧首区自七世纪以来第一次都在同一位皇帝治下。皇帝召集普世大公会议，要弥合东西教会三百年的裂痕。会议的结论，全看皇帝站在哪边。"
 oe_ar.9.a: "以正教为准"
 oe_ar.9.a.tt: "获得“正教的胜利”（#Y 25#!年）"
 oe_ar.9.b: "折中，东西各让一步"
 oe_ar.9.b.tt: "获得“教会合一”（#Y 25#!年）"
 oe_ar.9.c: "承认罗马的首席地位"
 oe_ar.9.c.tt: "获得“罗马的首席”（#Y 25#!年）"
 oe_ar.10.t: "空虚的边境"
 oe_ar.10.d: "军队都调去了更远的地方，[SCOPE.sLocation('oe_ar_border').GetName]一带的边墙只剩几个老兵守着。伦巴第人当年就是这样走进意大利的。"
 oe_ar.10.a: "加派驻军"
 oe_ar.10.a.tt: "边境恢复守备"
 oe_ar.10.b: "无力顾及"
 oe_ar.11.t: "瘟疫的阴影"
 oe_ar.11.d: "541年的大瘟疫让查士丁尼的帝国元气大伤，正赶上意大利快要收复的时候。如今帝国又一次铺得太开，港口里的船从四面八方带来货物，也带来了疫病。"
 oe_ar.11.a: "建隔离所"
 oe_ar.11.b: "听天由命"
 oe_ar.11.b.tt: "获得“疫病蔓延”（#Y 5#!年）"
 oe_ar.12.t: "罗马和平"
 oe_ar.12.d: "十年来，帝国没有一处边境失守，没有一位总督自立。商人从直布罗陀走到安条克，用的是同一种金币、同一部法律。人们开始说，这就是奥古斯都时代的罗马和平。"
 oe_ar.12.a: "愿它长存"
 oe_ar.12.a.tt: "获得“罗马和平”（永久）"
 oe_ar.13.t: "执政官就职"
 oe_ar.13.d: "新年第一天，新任执政官穿着紫袍走上街头，向人群抛撒金币。按古制，这一年将以他的名字命名。"
 oe_ar.13.a: "盛大就职"
 oe_ar.13.b: "今年从简"
