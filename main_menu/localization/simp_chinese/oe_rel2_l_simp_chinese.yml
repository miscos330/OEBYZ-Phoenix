 oe_rel2_b_ecumenical_communion:0 "普世大公会议对等共融"
 oe_rel2_b_pentarchic_dispute:0 "五牧首首席权神学之争"
 oe_rel2_b_tubingen_correspondence:0 "图宾根—君堡神学书信善意"
 oe_rel2_b_chalcedon_accord:0 "亚历山大—红海迦克墩和解协约"
 oe_rel2_b_nestorian_academy:0 "丝路景教大秦译馆通使"
 oe_rel2_b_caliphate_rivalry:0 "哈里发法统正统之争"
 oe_rel2_b_jerusalem_charter:0 "耶路撒冷圣地安全通行协约"
 oe_rel2_b_edict_of_milan_reborn:0 "新米兰宽容诏外交善意"
 STATIC_MODIFIER_NAME_oe_rel2_mark_ephesus_orthodoxy:0 "以弗所的马可正统风骨"
 STATIC_MODIFIER_DESC_oe_rel2_mark_ephesus_orthodoxy:0 "坚守古老五牧首共议传统而不屈从仓促妥协，赢得了东正教俗两界的深厚敬重与正教向心力。"
 STATIC_MODIFIER_NAME_oe_rel2_mutual_communion_mod:0 "东西教会对等共融协约"
 STATIC_MODIFIER_DESC_oe_rel2_mutual_communion_mod:0 "以平等共议取代单方面屈从，开启东西基督教世界的外交和解、商贸互通与经院学术交流。"
 STATIC_MODIFIER_NAME_oe_rel2_pentarchy_primacy_mod:0 "重振五牧首神圣威权"
 STATIC_MODIFIER_DESC_oe_rel2_pentarchy_primacy_mod:0 "多座古老牧首圣城重归正教庇护，普世公会议的法统光环提振了威望、宗教影响力与对异端基督徒的归化凝聚，唯收紧异教宽容。"
 STATIC_MODIFIER_NAME_oe_rel2_tubingen_dialogue_mod:0 "图宾根—君堡神学对话协约"
 STATIC_MODIFIER_DESC_oe_rel2_tubingen_dialogue_mod:0 "普世牧首耶利米二世与德意志路德宗学者围绕《奥格斯堡信纲》开展书信往来，建立反霸权的外交与学术桥梁。"
 STATIC_MODIFIER_NAME_oe_rel2_lucaris_printing_mod:0 "卢卡里斯近代译印与学院革新"
 STATIC_MODIFIER_DESC_oe_rel2_lucaris_printing_mod:0 "采纳西里尔·卢卡里斯倡议的希腊语活字印刷与近代教士学院改革，显著拉升全国识字率与思潮传播。"
 STATIC_MODIFIER_NAME_oe_rel2_jerusalem_1672_creed:0 "1672 耶路撒冷会议正统信纲"
 STATIC_MODIFIER_DESC_oe_rel2_jerusalem_1672_creed:0 "在多西修斯二世主持下系统厘定东正教理边界，既化解了宗派内耗，又确立了教俗协和的稳固基石。"
 STATIC_MODIFIER_NAME_oe_rel2_chalcedon_accord_mod:0 "亚历山大—红海迦克墩和解宪章"
 STATIC_MODIFIER_DESC_oe_rel2_chalcedon_accord_mod:0 "跨越 451 年迦克墩公会议千年隔阂，与科普特、埃塞俄比亚及高加索东方正统教会缔结共融与红海通商协约。"
 STATIC_MODIFIER_NAME_oe_rel2_nestorian_silk_relay:0 "丝路景教大秦译馆网络"
 STATIC_MODIFIER_DESC_oe_rel2_nestorian_silk_relay:0 "敕封东方教会沿波斯、撒马尔罕与中原丝路设立的跨洲译馆驿站，极大加速东西方外交使团、历算与思潮互通。"
 STATIC_MODIFIER_NAME_oe_rel2_cairo_caliphate_mantle:0 "开罗阿拔斯哈里发监护法统"
 STATIC_MODIFIER_DESC_oe_rel2_cairo_caliphate_mantle:0 "凭双圣城监护权与开罗哈里发法统稳固逊尼诸邦尊崇，提升宗教权威与外交声望。"
 STATIC_MODIFIER_NAME_oe_rel2_constantinople_caliphate:0 "君士坦丁堡大哈里发法统"
 STATIC_MODIFIER_DESC_oe_rel2_constantinople_caliphate:0 "承继阿拔斯法统并统合欧亚穆斯林朝觐航道，赋予横跨三洲的宗教号召力与军事士气。"
 STATIC_MODIFIER_NAME_oe_rel2_tabriz_shia_fervor:0 "大不里士十二伊玛目复兴潮"
 STATIC_MODIFIER_DESC_oe_rel2_tabriz_shia_fervor:0 "以大不里士为核心兴起的什叶派国家建构激发了高昂战意与伊朗高原独特的宗教政治凝聚。"
 STATIC_MODIFIER_NAME_oe_rel2_millet_courts_charter:0 "帝国米勒特自治法庭宪章"
 STATIC_MODIFIER_DESC_oe_rel2_millet_courts_charter:0 "承认境内多元教派社群在民事、教务与商事领域的自治法庭，大幅压低异教动荡并拓宽帝国税基，但放缓对异教徒的传教改宗。"
 STATIC_MODIFIER_NAME_oe_rel2_jerusalem_pilgrim_mod:0 "耶路撒冷圣地安全通行协约"
 STATIC_MODIFIER_DESC_oe_rel2_jerusalem_pilgrim_mod:0 "保障基督教、伊斯兰与各古老传统朝圣者安抵圣城，换取丰厚朝圣商税与跨教外交声誉。"
 STATIC_MODIFIER_NAME_oe_rel2_edict_milan_reborn_mod:0 "新米兰宽容诏（罗马多神包容宪章）"
 STATIC_MODIFIER_DESC_oe_rel2_edict_milan_reborn_mod:0 "复兴古典罗马宗教的帝国效法 313 年《米兰敕令》与古老神明互译宽容原则，保障基督教与伊斯兰臣民礼拜自由并缓解列强敌意，相应放缓全局传教速度。"
 STATIC_MODIFIER_NAME_oe_rel2_republic_of_letters:0 "欧亚普世文人共和国"
 STATIC_MODIFIER_DESC_oe_rel2_republic_of_letters:0 "跨教派的希腊文、拉丁文、阿拉伯文、叙利亚文与波斯文典籍馆互通有无，催生跨越教界藩篱的近世科学启蒙。"
 oe_rel2_ecumenical_academy:0 "普世神学与跨教典籍馆"
 oe_rel2_ecumenical_academy_desc:0 "汇聚希腊文、拉丁文、科普特文、叙利亚文与阿拉伯文抄本的跨教派学院，显著提升教士识字率、文化传统与城镇繁荣。"
 oe_rel2_ecumenical_academy_maint:0 "普世典籍馆抄本与香火运维"
 oe_rel2_ref_ecumenical_concordat:0 "普世教务共融宪政"
 oe_rel2_ref_ecumenical_concordat_desc:0 "通过常设跨教派神学对话、朝圣保护与典籍互译机制，将宗教多元性转化为外交威望与科研活力。"
 oe_rel2_interfaith_diplomacy_law:0 "普世教务与跨教外交法"
 oe_rel2_interfaith_diplomacy_law_desc:0 "确立国家在五牧首共议、米勒特自治宪章与启蒙宗教宽容之间的基本教务外交路线。"
 oe_rel2_pol_pentarchy_primacy:0 "五牧首正统首席制"
 oe_rel2_pol_pentarchy_primacy_desc:0 "高举古老大公会议与国教正统旗帜，强化宗教凝聚力与传教效率。"
 oe_rel2_pol_millets_and_charters:0 "米勒特自治与圣地宪章"
 oe_rel2_pol_millets_and_charters_desc:0 "以自治法庭与保护宪章安抚境内多元教派社群，稳固税基并抑制分离主义。"
 oe_rel2_pol_enlightened_toleration:0 "普世启蒙宽容协约"
 oe_rel2_pol_enlightened_toleration_desc:0 "开放跨教派学术出版与礼拜宽容，极大加速科研与跨国外交互信。"
 oe_rel2_adv_ecumenical_concordat:0 "普世大公会议外交学"
 oe_rel2_adv_ecumenical_concordat_desc:0 "融合佛罗伦萨公会议辩论、图宾根书信、耶路撒冷会议与跨洲译馆经验，将神学对话升华为精密的国家外交体系。"
 oe_rel2_player_only_tt:0 "仅限玩家国家主动召集或签署此项普世教务决议"
 oe_rel2_dec_convene_pentarchy_synod.title:0 "召开逆向五牧首普世大公会议"
 oe_rel2_dec_convene_pentarchy_synod.desc:0 "当东正教强权掌控至少三座古老牧首圣城（罗马、君堡、亚历山大、安条克、耶路撒冷）时，召集普世大公会议重塑东西基督教格局。"
 oe_rel2_dec_convene_pentarchy_synod.a:0 "颁布大公会议诏书，延请五牧首代表"
 oe_rel2_dec_chalcedon_accord.title:0 "签署亚历山大—红海迦克墩和解协约"
 oe_rel2_dec_chalcedon_accord.desc:0 "沿承 1442 年《向主高歌》与红海朝圣传统，推动东正教会与亚历山大科普特、埃塞俄比亚东方正统教会达成历史性和解。"
 oe_rel2_dec_chalcedon_accord.a:0 "派遣神学使团签署迦克墩共融宪章"
 oe_rel2_dec_jerusalem_pilgrim_charter.title:0 "颁布耶路撒冷圣地安全通行宪章"
 oe_rel2_dec_jerusalem_pilgrim_charter.desc:0 "为基督教各派、伊斯兰教与古典复兴诸邦朝圣者确立耶路撒冷圣城安全通行与共管规约，换取跨教外交声望与商税红利。"
 oe_rel2_dec_jerusalem_pilgrim_charter.a:0 "昭告天下，保障圣城朝圣平安"
 oe_rel2.1.title:0 "佛罗伦萨之影：《天庭欢悦》与以弗所的马可"
 oe_rel2.1.desc:0 "1439 年佛罗伦萨会议颁布《天庭欢悦》合一诏书后，唯独以弗所都主教马可拒绝签字。如今帝国巍然屹立，东西教会的千年裂痕究应以坚贞守正抑或平等共议回应？"
 oe_rel2.1.a:0 "尊崇以弗所的马可风骨，坚守五牧首共议正统"
 oe_rel2.1.b:0 "以对等共融取代屈从，开启东西教会新对话"
 oe_rel2.2.title:0 "逆向普世大公会议：五牧首圣城的荣光"
 oe_rel2.2.desc:0 "多座古老牧首圣城重聚正教旗帜之下，来自君士坦丁堡、亚历山大、安条克、耶路撒冷与亚平宁的教长云集御前，筹划跨越中世纪裂痕的新纪元。"
 oe_rel2.2.a:0 "确立东西教会对等共融与学术互鉴协约"
 oe_rel2.2.b:0 "重振五牧首正统首席威权，号令普世教会"
 oe_rel2.3.title:0 "图宾根—君士坦丁堡书信（1573–1581）"
 oe_rel2.3.desc:0 "德意志图宾根大学的路德宗神学家将希腊文译本《奥格斯堡信纲》呈递君士坦丁堡牧首耶利米二世。虽然神学分歧犹存，但双方在抵御共同强权与学术互通上大有可为。"
 oe_rel2.3.a:0 "保持礼遇通信，缔结跨教外交与学术桥梁"
 oe_rel2.3.b:0 "婉拒新教义条文，重申古老教父传统"
 oe_rel2.4.title:0 "西里尔·卢卡里斯风暴（1629）与印刷学院"
 oe_rel2.4.desc:0 "博学而锐意革新的牧首西里尔·卢卡里斯引进希腊语印刷机、倡办近代学院并与加尔文宗及英格兰使节频密往来，在保守教士与启蒙学者之间激起千层浪。"
 oe_rel2.4.a:0 "庇护希腊活字印馆与近代神学院革新"
 oe_rel2.4.b:0 "平息宗派纷争，筹备大公会议厘清教义"
 oe_rel2.5.title:0 "1672 年耶路撒冷宗教会议：多西修斯信纲"
 oe_rel2.5.desc:0 "耶路撒冷牧首多西修斯二世召集各地主教于圣城举行盛大宗教会议，正式颁布系统严谨的《多西修斯信纲》，既回应宗教改革浪潮，也稳固了东正教世界百余年的教义基石。"
 oe_rel2.5.a:0 "钦准《多西修斯信纲》，稳固普世正教根基"
 oe_rel2.5.b:0 "兼收跨教典籍精华，助推欧亚文人共和国"
 oe_rel2.6.title:0 "《向主高歌》与亚历山大—红海迦克墩和解"
 oe_rel2.6.desc:0 "自 451 年迦克墩公会议分离逾千年后，来自亚历山大科普特教会、埃塞俄比亚所罗门王廷与高加索高地的使节再度齐聚谈判桌，以共融与红海通商弥合古老裂痕。"
 oe_rel2.6.a:0 "签署《亚历山大—红海共融宪章》并互开商港"
 oe_rel2.6.b:0 "礼遇东方正统使团，暂留教义分歧日后商议"
 oe_rel2.7.title:0 "丝绸之路东方教会：景教大秦译馆网络"
 oe_rel2.7.desc:0 "绵延波斯、撒马尔罕直至中原与马拉巴尔的东方教会（景教）教区精通叙利亚文、波斯文、突厥文与汉文，愿为朝廷效劳充当跨洲译馆、历算顾问与外交信使。"
 oe_rel2.7.a:0 "敕封大秦景教译馆驿站，联通欧亚智识商道"
 oe_rel2.7.b:0 "仅征收常规驿馆商税，保持礼节性往来"
 oe_rel2.8.title:0 "双城哈里发之争：开罗与君士坦丁堡（1517）"
 oe_rel2.8.desc:0 "自巴格达陷落后寄身开罗的阿拔斯哈里发法统，如今面临东地中海新兴帝国争夺双圣城监护权与全逊尼世界宗教首席的历史性较量。"
 oe_rel2.8.a:0 "坚守开罗阿拔斯哈里发与双圣城监护法统"
 oe_rel2.8.b:0 "奉迎哈里发圣物与法统归于帝国都城"
 oe_rel2.9.title:0 "大不里士的红帽（1501）：十二伊玛目什叶复兴"
 oe_rel2.9.desc:0 "大不里士城头升起十二伊玛目什叶派旗帜，伊朗高原与两河流域的教派格局骤然重构，激起从安纳托利亚至河中草原的外交震荡。"
 oe_rel2.9.a:0 "借大不里士教派复兴凝聚军政斗志"
 oe_rel2.9.b:0 "推行跨派系宽容法庭，稳住边疆商道"
 oe_rel2.10.title:0 "帝国米勒特自治法庭落地"
 oe_rel2.10.desc:0 "御旨正式承认帝国境内各主要教派社群的民事与教务自治权，各族长老与宗教领袖联名上表效忠，边疆税收与市井秩序随之稳固。"
 oe_rel2.10.a:0 "颁行米勒特自治宪章，安辑万民"
 oe_rel2.11.title:0 "耶路撒冷圣地安全通行协约生效"
 oe_rel2.11.desc:0 "护卫朝圣商队的宪章公告四方，来自地中海、罗斯、红海与波斯的朝圣者得以安抵耶路撒冷，各邦使节纷纷致书赞誉帝国的宽宏法度。"
 oe_rel2.11.a:0 "永护圣城朝圣通道，广结四海善缘"
 oe_rel2.12.title:0 "新米兰宽容诏：古典万神殿的普世包容宪章"
 oe_rel2.12.desc:0 "复兴古典罗马万神殿的帝国没有以刀剑强迫天下改宗，而是效法君士坦丁大帝 313 年《米兰敕令》与古老罗马神明互译宽容传统，保障基督徒、穆斯林与各古老信众的公民礼拜自由，从而瓦解外来宗教同盟的合围敌意（严格维系现有万神殿格局，绝不更改神明席位）。"
 oe_rel2.12.a:0 "颁布《新米兰宽容诏》，以罗马包容外交化敌为友"
 oe_rel2.12.b:0 "仅弘扬古典礼乐风华，保持独立傲岸外交"
 oe_rel2.13.title:0 "欧亚文人共和国与跨教印刷热潮"
 oe_rel2.13.desc:0 "借助普世神学典籍馆与跨洲译印网络，东正、天主、新教、东方正统、景教与伊斯兰学者在同一座图书馆中校勘亚里士多德、天文历表与医学古籍，催生辉煌的跨文明启蒙。"
 oe_rel2.13.a:0 "拨款资助跨文明译印大典，泽被后世"
 oe_rel2.90.title:0 "【审计读数】普世教务 2.0 五大跨教外交轴面板"
 oe_rel2.90.desc_header:0 "Slot 82（oe_rel2_，半年错峰 O(1)，零改动 oe_romp_gods.txt / 六神上限 100% 完好）实时状态："
 oe_rel2.90.desc_ax1_communion:0 "\n· 轴线一（五牧首与佛罗伦萨后时代）：#G 东西教会对等共融已达成#!"
 oe_rel2.90.desc_ax1_primacy:0 "\n· 轴线一（五牧首与佛罗伦萨后时代）：#Y 五牧首正统威权路线#!"
 oe_rel2.90.desc_ax1_idle:0 "\n· 轴线一（五牧首与佛罗伦萨后时代）：待机（1438+ 或掌控 >= 3 座牧首圣城）"
 oe_rel2.90.desc_ax2_jerusalem:0 "\n· 轴线二（宗教改革对话）：#G 1672 耶路撒冷会议正统信纲已颁布#!"
 oe_rel2.90.desc_ax2_lucaris:0 "\n· 轴线二（宗教改革对话）：#Y 卢卡里斯印刷与学院革新已启用#!"
 oe_rel2.90.desc_ax2_tubingen:0 "\n· 轴线二（宗教改革对话）：#Y 图宾根—君堡书信往来已开启#!"
 oe_rel2.90.desc_ax2_idle:0 "\n· 轴线二（宗教改革对话）：待机（1570 图宾根 / 1625 卢卡里斯 / 1670 耶路撒冷）"
 oe_rel2.90.desc_ax3_accord:0 "\n· 轴线三（红海迦克墩和解）：#G 《亚历山大—红海共融宪章》已签署#!"
