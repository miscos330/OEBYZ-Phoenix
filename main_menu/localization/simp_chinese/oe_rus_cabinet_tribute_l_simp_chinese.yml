l_simp_chinese:
 oe_rus_return_gifts: "帝国回礼"
 oe_rus_accelerate_unification: "加快统一进程"
 oe_rus_accelerate_unification_desc: "仅计分第一的国家可用。选择与本国处于停战期的另一计分前三国家，消耗25点正统性，解除双方停战。"
 oe_rus_siberian_migration: "西伯利亚移民"
 oe_rus_siberian_migration_desc: "从俄罗斯或乌拉尔地区完全直属且全部为本国核心的省份，组织居民迁往西西伯利亚或东西伯利亚与本国或附属国接壤、仍有未殖民地点的省份。每月迁移开始时出发省份人口的0.1%，上限1000人，仅从本国地点迁出。持续执行60个月后，目标省份全部仍无主的可征服地点归属俄罗斯并成为核心。时间不受内阁效率影响，同时仅限一个内阁执行；取消或更换任务会停止迁移并废弃本轮计时。出发地获得60个月逐渐衰减的+5%生育率。"
 oe_rus_siberian_migration_active: "向西伯利亚移民"
 oe_rus_siberian_migration_action: "向西伯利亚移民"
 oe_sm_choose_origin: "选择移民出发省份"
 oe_sm_choose_destination: "选择西伯利亚殖民省份"
 oe_sm_no_origin: "@trigger_no!没有完全直属、全部为核心且未受西伯利亚移民潮影响的俄罗斯或乌拉尔省份。"
 oe_sm_no_destination: "@trigger_no!西西伯利亚与东西伯利亚没有与本国势力接壤且仍有无主可征服地点的省份。"
 STATIC_MODIFIER_NAME_oe_siberian_migration_wave: "西伯利亚移民潮"
 STATIC_MODIFIER_DESC_oe_siberian_migration_wave: "移民离乡后留下的田产与居所，使留居家庭能够抚育更多子女。这份影响将在五年内逐渐消退。"
 oe_siberian_migration.2.t: "林海中的新村庄"
 oe_siberian_migration.2.d: "五年来，一批批家庭沿河道与旧驿路前往[SCOPE.sProvinceDefinition('oe_sm_completed_destination').GetName]。最初的棚屋已围起院落，庄稼在林间空地成熟，教堂的钟声传到新的村庄。\n\n官员带回了最后一批簿册。尚未纳入统治的聚落如今也已登记入籍，成为俄罗斯可以长久经营的土地。"
 oe_siberian_migration.2.a: "让他们在新土地上安居。"
 oe_sm_generation: "西伯利亚移民任务编号"
 oe_sm_elapsed: "已执行移民月数"
 oe_rus_siberian_migration_action_progress: "[SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60"
 oe_rus_siberian_migration_action_progress_wordier: "已迁移 [SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60 个月"
 oe_rus_siberian_migration_action_progress_long_wordier: "西伯利亚移民：[SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60 个月"
 oe_rus_siberian_migration_action_progress_tooltip: "连续执行满60个月后完成；时间不受内阁效率影响。当前进度：[SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60个月。"
