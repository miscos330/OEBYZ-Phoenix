 oe_hbg_dec_hansa_commercial_empire.desc:0 "将松散的汉萨商港同盟与四大海外商站升格为永续主权的「北海—波罗的海汉萨商业联邦」，以统一银币、常备柯克战船与王国级外交尊位称雄北欧海疆。"
 oe_hbg_dec_hansa_commercial_empire.a:0 "昭告成立汉萨商业联邦"
