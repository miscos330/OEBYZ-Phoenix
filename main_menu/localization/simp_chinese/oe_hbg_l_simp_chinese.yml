 oe_hbg_dec_golden_fleece_order.title:0 "创立勃艮第金羊毛骑士团"
 oe_hbg_dec_golden_fleece_order.desc:0 "在勃艮第宫廷盛大创立驰名欧陆的「金羊毛骑士团」，以金羊毛颈链与崇高骑士誓言凝聚勃艮第、弗兰德与帝国边区名门大贵族的效忠。"
 oe_hbg_dec_golden_fleece_order.a:0 "颁授金羊毛骑士团金链勋章"
 oe_hbg_dec_golden_fleece_order_tt:0 "获得 #G +15#! 威望、#G +8#! 陆军传统与永久修正《勃艮第金羊毛骑士团》，并触发金羊毛骑士团受勋大典事件。"
 oe_hbg_dec_proclaim_lotharingia.title:0 "加冕洛塔林吉亚（中法兰克）王国"
 oe_hbg_dec_proclaim_lotharingia.desc:0 "凭第戎本土与弗兰德、莱茵—默兹富庶走廊合而为一之势，正式加冕洛塔林吉亚王冠，在法兰西与德意志之间重光查理曼时代的中法兰克王国！"
 oe_hbg_dec_proclaim_lotharingia.a:0 "恭戴洛塔林吉亚中法兰克王冠"
 oe_hbg_dec_proclaim_lotharingia_tt:0 "将国家等级至少提升至 #Y 王国#!，获得 #G +25#! 威望、为已控洛塔林吉亚重镇授核、获得永久修正《洛塔林吉亚—中法兰克王冠》并触发加冕事件。"
 oe_hbg_dec_alhambra_jihad.title:0 "号召马格里布与安达卢斯义军护教"
 oe_hbg_dec_alhambra_jihad.desc:0 "自阿尔罕布拉红宫高塔向直布罗陀海峡两岸发出护教号召，征募安达卢斯山民精兵与马格里布渡海志愿骑兵共卫格拉纳达并积蓄北伐锋芒。"
 oe_hbg_dec_alhambra_jihad.a:0 "征召海峡两岸护教义军"
 oe_hbg_dec_alhambra_jihad_tt:0 "获得 #G +0.85#! 年人力、#G +8#! 陆军传统与 #Y 10 年#!《阿尔罕布拉护教义军总动员》；若摩洛哥存续且和平共处，另获 #G +60#! 援助金币与双边好感。"
 oe_hbg_dec_restore_cordoba_caliphate.title:0 "宣示复建科尔多瓦哈里发国与安达卢斯"
 oe_hbg_dec_restore_cordoba_caliphate.desc:0 "既已重掌格拉纳达、科尔多瓦与塞维利亚三城，于科尔多瓦大清真寺庄严宣示复建安达卢斯倭马亚哈里发国，引领西部伊斯兰世界迈入复兴帝国新纪元。"
 oe_hbg_dec_restore_cordoba_caliphate.a:0 "宣示重光科尔多瓦哈里发大统"
 oe_hbg_dec_restore_cordoba_caliphate_tt:0 "将国家等级晋升至 #Y 帝国#!，获得 #G +30#! 威望与 #G +8#! 稳定度、为安达卢斯重镇授核、获得永久修正《科尔多瓦倭马亚哈里发正统》并触发宣示事件。"
 oe_hbg_dec_komnenos_claim.title:0 "宣示科穆宁正统光复君士坦丁堡"
 oe_hbg_dec_komnenos_claim.desc:0 "在特拉比松宫廷高举阿莱克修斯一世大科穆宁皇族血统旗帜，正式宣示对君士坦丁堡的合法皇权继承，号召黑海希腊将士重光新罗马。"
 oe_hbg_dec_komnenos_claim.a:0 "高举大科穆宁金鹰宣示皇统"
 oe_hbg_dec_komnenos_claim_tt:0 "若已控制君士坦丁堡则晋升 #Y 帝国#! 并授核（否则晋升 #Y 王国#! 并获得收复君士坦丁堡宣战理由），同时获得 #G +20#! 威望与永久修正《大科穆宁正统复辟纲领》。"
 oe_hbg_dec_gothia_teutonic_reunion.title:0 "宣示大哥特公国并缔结哥特—日耳曼千年重逢"
 oe_hbg_dec_gothia_teutonic_reunion.desc:0 "将曼古普—提奥多罗崖城公国升格为统领克里米亚的「大哥特王国」；若条顿骑士团已进驻黑海克里米亚（Pontus-Krim），更将同步缔结跨越千年的「哥特—日耳曼黑海重逢盟约」！"
 oe_hbg_dec_gothia_teutonic_reunion.a:0 "于曼古普宣示建立大哥特王国"
 oe_hbg_dec_gothia_teutonic_reunion_tt:0 "将国家等级至少晋升至 #Y 王国#!，获得 #G +20#! 威望、为已控克里米亚要港授核并获永久修正《大哥特—曼古普克里米亚公国》；若条顿骑士团已抵黑海则同步触发双方《哥特—日耳曼千年重逢》加成与同盟。"
 oe_hbg.1.t:0 "汉萨同盟大会与四大海外商站宪章"
 oe_hbg.1.d:0 "在吕贝克红砖市政厅内，乘柯克大船远道而来的伦敦钢院、布鲁日、卑尔根布吕根与诺夫哥罗德彼得霍夫四站老商长齐献白银账册。重申四大商站自治宪章可令海外商帮死心效命，强硬市民则建议趁势加征汉萨磅税或推行统一《吕贝克法》海事商庭。"
 oe_hbg.1.a:0 "重申四大海外商站自治宪章与专卖特权"
 oe_hbg.1.b:0 "向各商港统一开征汉萨磅税以充实公库"
 oe_hbg.1.c:0 "在全盟商港推行统一《吕贝克法》海事法庭"
 oe_hbg.2.t:0 "厄勒海峡税争与《施特拉尔松德和约》"
 oe_hbg.2.d:0 "厄勒海峡与斯堪尼亚鲱鱼渔场的王室税吏骤然提高过境关税并扣押汉萨商船，企图扼住波罗的海通往北海的咽喉。文德诸港群情激愤：究竟武装高舷柯克战船以武力迫签《施特拉尔松德和约》，还是以外交斡旋换取长久免税通商特权？"
 oe_hbg.2.a:0 "武装文德柯克战舰，以海战打破海峡税霸"
 oe_hbg.2.b:0 "遣使斡旋换取海峡免税通行与斯堪尼亚渔市特许"
 oe_hbg.3.t:0 "条顿骑士团与汉萨同盟波罗的海商约"
 oe_hbg.3.d:0 "来自玛丽堡条顿大团长的使船泊靠特拉沃河码头，携来桑比亚精琥珀、维斯瓦良谷样本与橡木船材长约。若缔结正式《波罗的海商约》，骑士团港口与汉萨商船将互为羽翼、共荣波罗的海；亦有老成商绅主张恪守商业中立、专取转口佣金。"
 oe_hbg.3.a:0 "与条顿骑士团用印缔结《吕贝克—玛丽堡波罗的海商约》"
 oe_hbg.3.b:0 "坚持汉萨商业中立，专收波罗的海谷物与船材转运税"
 oe_hbg.4.t:0 "勃艮第公国与弗兰德联姻遗产"
 oe_hbg.4.d:0 "从第戎醇香葡萄园望向布鲁日与根特万机齐鸣的呢绒工坊，西欧最丰厚的一份邦国遗产近在咫尺。勃艮第宫廷重臣激辩：究竟倾注外交威望以联姻与怀柔收拢弗兰德贵族市民，还是先固本培元、整饬两勃艮第本土财税盐课？"
 oe_hbg.4.a:0 "广施联姻外交与恩惠，倾力收拢弗兰德与低地人心"
 oe_hbg.4.b:0 "优先整顿两勃艮第本土财库与庄园税源，厚积薄发"
 oe_hbg.5.t:0 "金羊毛骑士团盛大受勋大典"
 oe_hbg.5.d:0 "绣着打火石、钢镰与金羊毛徽记的绯红锦旗漫卷大厅，勃艮第、弗兰德与莱茵兰名门诸侯齐聚金羊毛骑士团大议会。以重骑荣耀嘉奖战将可锻造无双铁甲贵族，而广兴画艺、织锦与礼乐盛典则能令勃艮第宫廷软实力震铄西欧。"
 oe_hbg.5.a:0 "广纳名门战将入团，铸就无双金羊毛重骑先锋"
 oe_hbg.5.b:0 "赞助弗兰德画派、织锦与宫廷礼乐，赢得全欧仰慕"
 oe_hbg.6.t:0 "洛塔林吉亚王冠与查理曼西欧大梦"
 oe_hbg.6.d:0 "自索恩河畔至北海之滨，宫廷史官将勃艮第的崛起直溯洛泰尔一世的中法兰克王国与查理曼亚琛皇座。如今我邦实力足以与巴黎和帝国诸侯分庭抗礼，究竟高举亚琛古帝统问鼎西欧大帝国，还是以富庶中王国之尊坐镇法德仲裁？"
 oe_hbg.6.a:0 "高举查理曼西欧皇统旗帜，剑指莱茵与塞纳两岸"
 oe_hbg.6.b:0 "立足洛塔林吉亚黄金走廊，作法德之间的主权仲裁者"
 oe_hbg.7.t:0 "安达卢斯的最后明珠：阿尔罕布拉孤城誓师"
 oe_hbg.7.d:0 "夕阳映红内华达山麓的阿尔罕布拉宫墙，卡斯蒂利亚铁骑已在北方山口集结。虽说伊比利亚如今仅余格拉纳达一隅安达卢斯孤城，但险峻群山、驰名地中海的马拉加生丝商贸以及一水之隔的马林王朝，仍为纳斯里德王朝留存了绝地反击的生机。"
 oe_hbg.7.a:0 "加固内华达险隘，誓师整备阿尔罕布拉守军与海峡义骑"
 oe_hbg.7.b:0 "凭借马拉加生丝财源与海峡外交广结善缘、蓄势待发"
 oe_hbg.8.t:0 "科尔多瓦与塞维利亚易帜：逆转百年风潮"
 oe_hbg.8.d:0 "欢呼声回荡在科尔多瓦大清真寺红白拱廊与塞维利亚高塔之间，安达卢斯骑兵凯旋瓜达尔基维尔河谷！数百年节节败退的定数竟在一代之内被彻底逆转——此刻究竟乘胜北指托莱多扩大战果，还是修复水渠工坊重现安达卢斯百业荣景？"
 oe_hbg.8.a:0 "乘大胜余威整备攻城大军，直扑托莱多与伊比利亚腹地"
 oe_hbg.8.b:0 "重修瓜达尔基维尔水利渠网，复兴多元工坊与学术荣光"
 oe_hbg.9.t:0 "科尔多瓦哈里发复兴与跨越比利牛斯山"
 oe_hbg.9.d:0 "来自非斯、突尼斯、开罗与大马士革的使节齐贺科尔多瓦倭马亚哈里发重光于世。远望皑皑白雪覆盖的比利牛斯山脉，古史书页间732年图尔—普瓦捷之战的千古遗憾再度沸腾——哈里发究竟誓师北越雪山雪耻图尔，还是将科尔多瓦筑成西地中海无双的科学海贸灯塔？"
 oe_hbg.9.a:0 "誓师北越比利牛斯山脉，彻底洗雪732年图尔古恨"
 oe_hbg.9.b:0 "大兴格拉纳达—科尔多瓦书院与远洋船队，耀世西地中海"
 oe_hbg.10.t:0 "特拉比松大科穆宁双头鹰正统"
 oe_hbg.10.d:0 "在云雾缭绕的庞图斯群峰与波涛汹涌的黑海之间，特拉比松皇宫熠熠生辉。承袭大科穆宁正统血脉的宫廷正面临国运抉择：是厉兵秣马剑指君士坦丁堡重光紫衣帝统，还是广纳来自大不里士的波斯丝绸商队、凭黑海商权富甲一方？"
 oe_hbg.10.a:0 "高扬大科穆宁正统皇旗，整训精师剑指君士坦丁堡"
 oe_hbg.10.b:0 "广迎波斯丝路驼队与海商，铸就黑海第一财富巨港"
 oe_hbg.11.t:0 "曼古普崖城与克里米亚最后的哥特人"
 oe_hbg.11.d:0 "高耸入云的曼古普石灰岩绝壁之巅，东罗马双头鹰与古老的克里米亚哥特战旗迎风并立——这里是东日耳曼哥特人在世间最后的孤岛，与庞图斯希腊军民同守正教信仰。面对热那亚卡法港与金帐草原铁骑环伺，提奥多罗须决断究竟死筑崖城铁防，还是开拓卡拉米塔良港以商养兵。"
 oe_hbg.11.a:0 "加固曼古普绝壁岩城，整编克里米亚哥特与希腊守军"
 oe_hbg.11.b:0 "扩建卡拉米塔深水良港，周旋黑海诸强广聚商财"
 oe_hbg.12.t:0 "黑海哥特—日耳曼千年重逢"
 oe_hbg.12.d:0 "曼古普绝壁之下上演了一场令史官屏息的奇迹重逢：自普鲁士万里东征抵达黑海克里米亚的条顿骑士团使节，竟能与克里米亚哥特长老以自民族大迁徙别离千载的古老日耳曼语源彼此会意交谈！提奥多罗如今既可与条顿骑士团缔结纵横黑海与波罗的海的「哥特—日耳曼千年盟誓」，亦可礼敬同源情谊而坚守曼古普希腊—哥特自主风骨。"
 oe_hbg.12.a:0 "与条顿骑士团共举盟杯，缔结黑海哥特—日耳曼千年盟誓"
 oe_hbg.12.b:0 "礼敬千年同源情谊，同时坚守曼古普正教哥特独立自主"
 oe_msn_hansa_destiny:0 "汉萨商业女王：四大商站与北海—波罗的海帝国"
 oe_msn_hansa_destiny_DESCRIPTION:0 "引领吕贝克、汉堡或不来梅由文德商港同盟跃升为纵横北海与波罗的海的海上商业帝国：巩固四大海外商站、以《施特拉尔松德和约》折服丹麦海峡税霸、与条顿骑士团缔结波罗的海商约，最终铸就北欧海贸共主霸业。"
 oe_msn_hansa_destiny_CRITERIA_DESCRIPTION:0 "作为吕贝克、汉堡或不来梅游玩，并控制吕贝克、汉堡或不来梅之一。"
 oe_msn_hansa_destiny_BUTTON_TOOLTIP:0 "开启汉萨四大海外商站与北海—波罗的海商业帝国专属任务树。"
 oe_msn_hansa_destiny_BUTTON_DETAILS:0 "两大脉络共 8 项任务：四大海外商站与施特拉尔松德和约、文德商港联盟与汉萨—条顿波罗的海商约。"
 oe_msn_hansa_01_queen_of_hansa:0 "汉萨同盟商港中枢"
 oe_msn_hansa_01_queen_of_hansa_desc:0 "整饬本邦商馆、码头与市库，使北海与波罗的海诸商港行会皆奉我邦议事大印为马首。"
 oe_msn_hansa_01_queen_of_hansa_req_tt:0 "控制吕贝克、汉堡或不来梅之一、稳定度至少为 5，且拥有市场、船坞、税关之一或至少 120 金币。"
 oe_msn_hansa_02_four_great_kontors:0 "敕建四大海外商站网"
 oe_msn_hansa_02_four_great_kontors_desc:0 "统筹伦敦钢院、布鲁日、卑尔根与诺夫哥罗德四大海外商站，或召开汉萨同盟大会确立全盟海外商权。"
 oe_msn_hansa_02_four_great_kontors_req_tt:0 "统辖至少 2 座活跃汉萨海外商站附庸，或颁布《召开汉萨同盟大会并核算商站红利》决议，或拥有海港且持有至少 180 金币与 8 稳定度。"
 oe_msn_hansa_03_wendish_cog_fleet:0 "整编文德柯克战船舰队"
 oe_msn_hansa_03_wendish_cog_fleet_desc:0 "在波罗的海与北海船坞大造高舷武装柯克船，随时准备反制海峡苛税并维护海上航运自由。"
 oe_msn_hansa_03_wendish_cog_fleet_req_tt:0 "拥有海港，且拥有至少 14 艘舰船、18 海军传统，或建有造船厂/干船坞之一。"
 oe_msn_hansa_04_peace_of_stralsund:0 "《施特拉尔松德和约》"
 oe_msn_hansa_04_peace_of_stralsund_desc:0 "打破丹麦对厄勒海峡与斯堪尼亚渔场的封锁勒索，以胜绩或条约迫使北欧诸王尊奉汉萨航运自由。"
 oe_msn_hansa_04_peace_of_stralsund_req_tt:0 "直接或通过属国控制施特拉尔松德、哥本哈根、马尔默、隆德或维斯比之一，或完成《厄勒海峡税争与施特拉尔松德和约》事件且海军传统至少 20、稳定度至少 10。"
 oe_msn_hansa_05_wendish_cities_compact:0 "联合文德与易北诸商港"
 oe_msn_hansa_05_wendish_cities_compact_desc:0 "将特拉沃河、易北河、威悉河与梅克伦堡沿岸核心商港凝为一体，奠定汉萨本土不可动摇的战略枢纽。"
 oe_msn_hansa_05_wendish_cities_compact_req_tt:0 "直辖与属国合计至少 4 个地区，或同时控制吕贝克与另一处文德/易北商港，或与吕贝克/汉堡结盟。"
 oe_msn_hansa_06_teutonic_baltic_compact:0 "汉萨—条顿波罗的海商约"
 oe_msn_hansa_06_teutonic_baltic_compact_desc:0 "与玛丽堡条顿骑士团缔结琥珀、船材与谷物互惠商约，或直接掌控柯尼斯堡、里加、塔林等波罗的海要港。"
 oe_msn_hansa_06_teutonic_baltic_compact_req_tt:0 "缔结《汉萨—条顿波罗的海商约》、与条顿骑士团结盟或好感达到 40，或控制柯尼斯堡、里加、塔林之一。"
 oe_msn_hansa_07_north_sea_staple:0 "文德币制与北海专卖霸权"
 oe_msn_hansa_07_north_sea_staple_desc:0 "步入文艺复兴之际，在自泰晤士至诺夫哥罗德的广袤商网中推行统一文德银币制与专卖规程。"
 oe_msn_hansa_07_north_sea_staple_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 10，且统辖至少 3 座海外商站、或持有至少 8 个地区、或国库至少 400 金币。"
 oe_msn_hansa_08_commercial_empire:0 "北海—波罗的海汉萨商业帝国"
 oe_msn_hansa_08_commercial_empire_desc:0 "以两百年海贸经营为基，加冕威加北海与波罗的海的汉萨商业帝国，令北欧群港共尊红白双色商旗。"
 oe_msn_hansa_08_commercial_empire_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 12，且已宣告建立北海—波罗的海汉萨商业联邦，或控制至少 12 个地区并拥有 25 海军传统。"
 oe_msn_bur_destiny:0 "勃艮第宏图：金羊毛、洛塔林吉亚与查理曼中法兰克"
 oe_msn_bur_destiny_DESCRIPTION:0 "自第戎公国启程，一统两勃艮第、揽入弗兰德与低地锦绣财赋、创立欧洲至高金羊毛骑士团、重戴洛塔林吉亚（中法兰克）王冠，最终在亚琛重圆查理曼西欧大帝国千秋大梦。"
 oe_msn_bur_destiny_CRITERIA_DESCRIPTION:0 "作为勃艮第（或由勃艮第建立的洛塔林吉亚）游玩，并控制第戎、布鲁日或亚琛之一。"
 oe_msn_bur_destiny_BUTTON_TOOLTIP:0 "开启勃艮第—洛塔林吉亚与查理曼西欧大帝国专属任务树。"
 oe_msn_bur_destiny_BUTTON_DETAILS:0 "两大脉络共 8 项任务：统一两勃艮第与低地走廊、创立金羊毛骑士团与洛塔林吉亚—查理曼西欧帝国。"
 oe_msn_bur_01_two_burgundies:0 "统一勃艮第公国与伯国"
 oe_msn_bur_01_two_burgundies_desc:0 "将第戎公国与贝桑松、多勒所在的勃艮第伯国合二为一，使索恩河两岸丰饶酒乡尽归一体。"
 oe_msn_bur_01_two_burgundies_req_tt:0 "控制第戎、稳定度至少为 5，且控制贝桑松或多勒之一，或直辖与属国合计至少 15 个地区。"
 oe_msn_bur_02_flanders_lowlands:0 "执掌弗兰德与低地财赋"
 oe_msn_bur_02_flanders_lowlands_desc:0 "借联姻、附庸或铁骑将布鲁日、根特、安特卫普与布鲁塞尔等低地锦绣名城揽入勃艮第羽翼。"
 oe_msn_bur_02_flanders_lowlands_req_tt:0 "控制布鲁日与根特、安特卫普与布鲁塞尔，或里尔与阿拉斯之一组，或与弗兰德结盟/将其纳为属国。"
 oe_msn_bur_03_rhine_maas_corridor:0 "贯通莱茵—默兹大走廊"
 oe_msn_bur_03_rhine_maas_corridor_desc:0 "打通卢森堡、南锡、梅斯、列日或那慕尔走廊，将第戎本土与低地领地连成完整一片。"
 oe_msn_bur_03_rhine_maas_corridor_req_tt:0 "直接或通过属国控制卢森堡、南锡、梅斯、列日、那慕尔或阿姆斯特丹之一。"
 oe_msn_bur_04_court_of_dijon:0 "第戎与低地宫廷盛世"
 oe_msn_bur_04_court_of_dijon_desc:0 "令第戎与布鲁日宫廷以礼乐、画艺与骑士盛会冠绝文艺复兴西欧，使列王侧目。"
 oe_msn_bur_04_court_of_dijon_req_tt:0 "进入文艺复兴时代或之后、威望至少 30、稳定度至少 10，且直辖与属国合计至少 20 个地区。"
 oe_msn_bur_05_order_golden_fleece:0 "创立金羊毛骑士团"
 oe_msn_bur_05_order_golden_fleece_desc:0 "创立威震全欧的金羊毛骑士团，将勃艮第与低地名门大贵族紧紧团结于公爵王座周围。"
 oe_msn_bur_05_order_golden_fleece_req_tt:0 "颁布《创立勃艮第金羊毛骑士团》决议，或拥有至少 25 威望、15 陆军传统与 8 稳定度。"
 oe_msn_bur_06_chivalric_ordonnance:0 "整编勃艮第敕令常备军"
 oe_msn_bur_06_chivalric_ordonnance_desc:0 "以受薪常备敕令军团取代松散封建兵役，将重骑兵、长枪手与青铜火炮熔为精锐之师。"
 oe_msn_bur_06_chivalric_ordonnance_req_tt:0 "稳定度至少为 8，且陆军传统至少 20 或直辖与属国合计至少 18 个地区。"
 oe_msn_bur_07_kingdom_of_lotharingia:0 "加冕洛塔林吉亚中法兰克王国"
 oe_msn_bur_07_kingdom_of_lotharingia_desc:0 "将横亘法德之间的勃艮第—低地宏大领地升格为主权王国，令中法兰克洛塔林吉亚王冠重现人间。"
 oe_msn_bur_07_kingdom_of_lotharingia_req_tt:0 "颁布《加冕洛塔林吉亚（中法兰克）王国》决议、成立洛塔林吉亚，或同时控制第戎、亚琛与南锡。"
 oe_msn_bur_08_charlemagne_western_empire:0 "查理曼西欧大帝国（IF线）"
 oe_msn_bur_08_charlemagne_western_empire_desc:0 "在亚琛查理曼宫廷礼拜堂加冕西欧皇帝，重铸横跨莱茵、默兹与塞纳的加洛林盛世大帝国。"
 oe_msn_bur_08_charlemagne_western_empire_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 15、控制至少 35 个地区，且掌控第戎、亚琛以及巴黎/科隆/斯特拉斯堡/兰斯之一。"
 oe_msn_gra_destiny:0 "阿尔罕布拉复兴：光复安达卢斯与科尔多瓦哈里发"
 oe_msn_gra_destiny_DESCRIPTION:0 "死守安达卢斯最后明珠阿尔罕布拉，联手马林王朝扼守直布罗陀海峡，挥师逆转光复科尔多瓦、塞维利亚与托莱多，重建科尔多瓦倭马亚哈里发国，最终北越比利牛斯山脉雪耻732年图尔之战。"
 oe_msn_gra_destiny_CRITERIA_DESCRIPTION:0 "作为格拉纳达（或安达卢斯）游玩，并控制格拉纳达、科尔多瓦或塞维利亚之一。"
 oe_msn_gra_destiny_BUTTON_TOOLTIP:0 "开启格拉纳达与安达卢斯哈里发复兴专属任务树。"
 oe_msn_gra_destiny_BUTTON_DETAILS:0 "两大脉络共 8 项任务：固守阿尔罕布拉与光复科尔多瓦—塞维利亚—托莱多、圣战义军与黄金学府及雪耻732图尔之战。"
 oe_msn_gra_01_defend_alhambra:0 "固守阿尔罕布拉红宫铁壁"
 oe_msn_gra_01_defend_alhambra_desc:0 "加固格拉纳达、马拉加与阿尔梅里亚山地堡垒，令卡斯蒂利亚铁骑难越内华达山脉雷池一步。"
 oe_msn_gra_01_defend_alhambra_req_tt:0 "控制格拉纳达、马拉加与阿尔梅里亚、稳定度至少为 5，且拥有城堡或至少 120 金币。"
 oe_msn_gra_02_marinid_strait_alliance:0 "马林王朝海峡同盟"
 oe_msn_gra_02_marinid_strait_alliance_desc:0 "掌控直布罗陀、阿尔赫西拉斯或休达海峡渡口，或与摩洛哥马林王朝结盟通好，确保北非援军畅通无阻。"
 oe_msn_gra_02_marinid_strait_alliance_req_tt:0 "直接或通过属国控制直布罗陀、阿尔赫西拉斯或休达之一，或与摩洛哥结盟/好感至少达到 40。"
 oe_msn_gra_03_reclaim_cordoba_sevilla:0 "光复科尔多瓦与塞维利亚"
 oe_msn_gra_03_reclaim_cordoba_sevilla_desc:0 "横扫瓜达尔基维尔河谷，令安达卢斯战旗重新飘扬于科尔多瓦大清真寺与塞维利亚吉拉尔达塔之上。"
 oe_msn_gra_03_reclaim_cordoba_sevilla_req_tt:0 "直接或通过属国同时控制科尔多瓦与塞维利亚。"
 oe_msn_gra_04_toledo_heartland:0 "越过莫雷纳山光复托莱多"
 oe_msn_gra_04_toledo_heartland_desc:0 "突破卡斯蒂利亚高原防线重夺古城托莱多，并巩固哈恩、穆尔西亚、瓦伦西亚或巴达霍斯翼侧。"
 oe_msn_gra_04_toledo_heartland_req_tt:0 "直接或通过属国控制托莱多，并同时控制哈恩、穆尔西亚、瓦伦西亚、巴达霍斯或加的斯之一。"
 oe_msn_gra_05_ghazawat_volunteers:0 "整编马格里布与安达卢斯义军"
 oe_msn_gra_05_ghazawat_volunteers_desc:0 "将跨海而来的马格里布志愿骑兵与本土山民整编为纪律严明的北伐精锐。"
 oe_msn_gra_05_ghazawat_volunteers_req_tt:0 "颁布《号召马格里布与安达卢斯义军护教》决议，或拥有至少 15 陆军传统与 6 稳定度。"
 oe_msn_gra_06_andalusi_golden_age:0 "复兴安达卢斯学术黄金时代"
 oe_msn_gra_06_andalusi_golden_age_desc:0 "重兴中世纪安达卢斯赫赫有名的伊斯兰学院、天文台与水利园林，令格拉纳达与科尔多瓦文教再领风骚。"
 oe_msn_gra_06_andalusi_golden_age_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 10，且威望至少 25 或拥有伊斯兰经学院、大学、图书馆之一。"
 oe_msn_gra_07_umayyad_caliphate:0 "重建科尔多瓦倭马亚哈里发国"
 oe_msn_gra_07_umayyad_caliphate_desc:0 "自阿尔罕布拉至瓜达尔基维尔河畔重立倭马亚哈里发大统，恢复安达卢斯昔日帝国气象。"
 oe_msn_gra_07_umayyad_caliphate_req_tt:0 "颁布《宣示复建科尔多瓦哈里发国与安达卢斯》决议、成立安达卢斯，或同时控制格拉纳达、科尔多瓦与塞维利亚。"
 oe_msn_gra_08_avenge_tours_732:0 "跨越比利牛斯·雪耻732图尔之战"
 oe_msn_gra_08_avenge_tours_732_desc:0 "率复兴哈里发大军越过萨拉戈萨与比利牛斯隘口直入高卢南境，彻底改写732年图尔—普瓦捷历史结局。"
 oe_msn_gra_08_avenge_tours_732_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 12、控制至少 35 个地区，且掌控科尔多瓦、托莱多以及萨拉戈萨/纳博讷/图卢兹/波尔多/普瓦捷/图尔之一。"
 oe_msn_blacksea_destiny:0 "黑海双鹰史诗：大科穆宁特拉比松与克里米亚哥特曼古普"
 oe_msn_blacksea_destiny_DESCRIPTION:0 "从特拉比松群山要塞或曼古普悬崖孤城奋起，执掌黑海丝路商权：大科穆宁剑指君士坦丁堡正统复辟，提奥多罗统合克里米亚哥特雄邦，并与进驻黑海的条顿骑士团谱写跨越千年的哥特—日耳曼重逢史诗。"
 oe_msn_blacksea_destiny_CRITERIA_DESCRIPTION:0 "作为特拉比松或提奥多罗游玩，并控制特拉比松、提奥多罗或君士坦丁堡之一。"
 oe_msn_blacksea_destiny_BUTTON_TOOLTIP:0 "开启特拉比松大科穆宁与提奥多罗克里米亚哥特专属任务树。"
 oe_msn_blacksea_destiny_BUTTON_DETAILS:0 "两大脉络共 8 项任务：黑海绝壁防务与庞图斯丝路霸权、科穆宁复辟/大哥特公国与哥特—条顿千年重逢。"
 oe_msn_blk_01_bastion_of_euxine:0 "黑海绝壁不落要塞"
 oe_msn_blk_01_bastion_of_euxine_desc:0 "加固特拉比松崇山险隘或曼古普悬崖石城，令环伺黑海的草原汗国与贝伊强敌寸步难进。"
 oe_msn_blk_01_bastion_of_euxine_req_tt:0 "控制特拉比松或提奥多罗、稳定度至少为 5，且拥有城堡、海防堡之一或至少 100 金币。"
 oe_msn_blk_02_pontic_silk_emporium:0 "庞图斯丝路与克里米亚商埠"
 oe_msn_blk_02_pontic_silk_emporium_desc:0 "将黑海良港筑造为大不里士丝路商队、地中海海船与草原毛皮交汇的黄金中转枢纽。"
 oe_msn_blk_02_pontic_silk_emporium_req_tt:0 "拥有海港，并以特拉比松连结吉雷松/里泽/塔曼/锡诺普之一，或以提奥多罗连结卡法/索尔哈特/塔曼之一或持有 160 金币。"
 oe_msn_blk_03_komnenos_or_gothia_ascendant:0 "科穆宁中兴或克里米亚哥特崛起"
 oe_msn_blk_03_komnenos_or_gothia_ascendant_desc:0 "打破偏安孤局：特拉比松挥师收复庞图斯沿岸名港，或提奥多罗自曼古普席卷克里米亚全岛。"
 oe_msn_blk_03_komnenos_or_gothia_ascendant_req_tt:0 "作为特拉比松控制锡诺普、萨姆松、阿马斯拉、巴统或君士坦丁堡之一；或作为提奥多罗控制卡法、索尔哈特、奇尔克耶尔、塔曼或塔纳之一。"
 oe_msn_blk_04_euxine_thalassocracy:0 "黑海丝路制海商权"
 oe_msn_blk_04_euxine_thalassocracy_desc:0 "以精锐黑海战船舰队掌控特拉比松、卡法、瓦尔纳与博斯普鲁斯航道，确立不可动摇的丝路海权。"
 oe_msn_blk_04_euxine_thalassocracy_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 10、控制至少 10 个地区，且拥有 15 海军传统或 12 艘舰船。"
 oe_msn_blk_05_imperial_heritage_or_mangup:0 "庞图斯帝统与曼古普正教荣光"
 oe_msn_blk_05_imperial_heritage_or_mangup_desc:0 "在黑海之滨宣示千年基督教古邦法统，无论是大科穆宁皇裔抑或曼古普哥特—希腊亲王皆声威大振。"
 oe_msn_blk_05_imperial_heritage_or_mangup_req_tt:0 "信仰基督教宗教组，且威望至少 15、稳定度至少 6。"
 oe_msn_blk_06_straits_or_crimean_crown:0 "重光君士坦丁堡或一统克里米亚"
 oe_msn_blk_06_straits_or_crimean_crown_desc:0 "以大科穆宁正统问鼎君士坦丁堡，或以曼古普一统克里米亚半岛称王大哥特，书写黑海逆袭华章。"
 oe_msn_blk_06_straits_or_crimean_crown_req_tt:0 "控制君士坦丁堡、颁布《科穆宁正统光复》或《大哥特公国》决议，或同时控制提奥多罗、卡法与索尔哈特。"
 oe_msn_blk_07_gothic_germanic_bridge:0 "哥特—日耳曼千年重逢与南北通衢"
 oe_msn_blk_07_gothic_germanic_bridge_desc:0 "与进驻黑海克里米亚的条顿骑士团缔结哥特—日耳曼千年重逢盟誓，或于文艺复兴崛起为沟通南北的黑海强邦。"
 oe_msn_blk_07_gothic_germanic_bridge_req_tt:0 "缔结哥特—日耳曼重逢、在条顿黑海克里米亚建制后与其和平共处，或于文艺复兴时代及之后控制至少 16 个地区。"
 oe_msn_blk_08_sovereign_of_pontus_and_bosphorus:0 "黑海与博斯普鲁斯无上共主"
 oe_msn_blk_08_sovereign_of_pontus_and_bosphorus_desc:0 "晋升帝国尊号统御黑海与海峡两岸，令大科穆宁帝国或大哥特黑海帝国的传奇彪炳史册。"
 oe_msn_blk_08_sovereign_of_pontus_and_bosphorus_req_tt:0 "进入文艺复兴时代或之后、稳定度至少 15、控制至少 20 个地区，且控制君士坦丁堡、缔结哥特—条顿重逢，或同时控制特拉比松、提奥多罗与卡法。"
