 STATIC_MODIFIER_DESC_oe_hbg_mod_ev4_a:0 "第戎宫廷以精妙联姻与礼仪拉拢布鲁日、根特贵族与市民，为低地归并铺就坦途。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev4_b:0 "两勃艮第集权财库"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev4_b:0 "优先整顿公国与伯国本土庄园、盐税与葡萄园财赋，筑牢勃艮第长远争霸的财政根基。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev5_a:0 "金羊毛大贵族骑士会"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev5_a:0 "授予弗兰德与帝国边区重臣金羊毛勋章，将桀骜大诸侯化为效忠勃艮第战旗的铁甲先锋。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev5_b:0 "勃艮第文艺与礼仪盛世"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev5_b:0 "资助画师、织锦工坊与宫廷乐师，令勃艮第文明软实力风靡西欧各阶层。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev6_a:0 "查理曼西欧皇统雄心"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev6_a:0 "高举中法兰克与亚琛古帝统旗帜，以锐不可当的军威重塑法兰西与莱茵河之间的帝国版图。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev6_b:0 "法德之间主权仲裁者"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev6_b:0 "立足洛塔林吉亚富庶走廊，以中立威望调停巴黎与帝国诸侯之争，坐收莱茵—低地通商之利。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev7_a:0 "阿尔罕布拉孤城誓师"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev7_a:0 "纳斯里德禁卫与内华达山民誓死共守红宫，坚壁清野与轻骑袭扰令北方强敌望而生畏。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev7_b:0 "马拉加生丝与热那亚商约"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev7_b:0 "依托格拉纳达顶级生丝出口与地中海商船外交，在强邻环伺间为纳斯里德王朝赢得宝贵喘息与财富。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev8_a:0 "科尔多瓦光复北伐锐气"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev8_a:0 "重夺哈里发故都科尔多瓦与塞维利亚激荡伊斯兰世界，安达卢斯大军乘胜北指托莱多。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev8_b:0 "瓜达尔基维尔水利与共存工坊"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev8_b:0 "修复水车渠网并宽容多元工匠与学者，令重归安达卢斯的沃土百业俱兴、文教重明。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev9_a:0 "越过比利牛斯·雪耻图尔远征"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev9_a:0 "倭马亚哈里发精锐骑军誓师北越比利牛斯山脉，直指高卢腹地以改写732年历史转折。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev9_b:0 "西地中海哈里发学术与海贸灯塔"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev9_b:0 "科尔多瓦与格拉纳达大书库汇聚东西方哲理与航海图志，令哈里发国成为大西洋与地中海交汇的文明灯塔。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev10_a:0 "大科穆宁金鹰西进旗帜"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev10_a:0 "特拉比松高举正统帝国金鹰，整训庞图斯精兵以待重入君士坦丁堡金门之日。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev10_b:0 "特拉比松黑海丝路总港"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev10_b:0 "广迎波斯丝绸驼队与威尼斯、热那亚商船，将特拉比松筑为黑海南岸最富庶的转口巨港。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev11_a:0 "曼古普悬崖石堡死守誓言"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev11_a:0 "加固曼古普天然绝壁岩洞堡垒并整编克里米亚哥特山民步军，以弹丸坚城抗衡草原铁骑。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev11_b:0 "卡拉米塔良港黑海转运"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev11_b:0 "经营因克尔曼—卡拉米塔深水良港，周旋于卡法、特拉比松与草原商路之间广聚商财。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev12_a:0 "哥特—条顿黑海千年盟誓"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev12_a:0 "克里米亚最后哥特人与条顿骑士团在曼古普共举古日耳曼盟杯，武备互补、商港相通，震动欧亚草原。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev12_b:0 "黑海哥特—希腊自主荣光"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev12_b:0 "虽与北方日耳曼同源骑士欣然通好，曼古普仍珍守千年正教希腊与哥特交融的独立风骨，美名远扬。"
