# NEW 2026-11-23 v23.0 Module B4 Global Flavor Gems Hansa-Burgundy-Granada-BlackSea (oe_hbg_, gen_v230_hansa_burgundy_blacksea.py) — simp_chinese localization (358 keys). Edit gen_v230_hansa_burgundy_blacksea.py, not this file.
 OHK1:0 "伦敦钢院商站"
 OHK1_ADJ:0 "伦敦钢院商站"
 oe_hbg_name_tidemann_von_limberg:0 "蒂德曼·冯·林贝格"
 oe_hbg_kontor_seat_1:0 "伦敦钢院汉萨商站总馆"
 oe_hbg_kontor_seat_1_desc:0 "汉萨同盟设于泰晤士河畔的伦敦钢院（Stalhof）海外商站总馆，专司英格兰羊毛、呢绒与波罗的海木材贸易，同时完整保留英格兰王国对伦敦的领土主权。"
 OHK2:0 "布鲁日商站"
 OHK2_ADJ:0 "布鲁日商站"
 oe_hbg_name_marquard_coesfeld:0 "马夸德·冯·科斯费尔德"
 oe_hbg_kontor_seat_2:0 "布鲁日弗兰德汉萨商站总馆"
 oe_hbg_kontor_seat_2_desc:0 "汉萨同盟驻布鲁日运河畔的弗兰德商站总馆，连结地中海香料帆船、弗兰德精纺呢绒与波罗的海商路，领土仍完全归弗兰德伯爵辖有。"
 OHK3:0 "卑尔根商站"
 OHK3_ADJ:0 "卑尔根商站"
 oe_hbg_name_hermann_warendorp:0 "赫尔曼·瓦伦多普"
 oe_hbg_kontor_seat_3:0 "卑尔根布吕根汉萨商站码头"
 oe_hbg_kontor_seat_3_desc:0 "设于挪威卑尔根木栈码头区（Bryggen）的汉萨海外商站总馆，垄断北海干鳕鱼、鱼油与北德谷物交换贸易，同时不分割挪威王冠一寸领土。"
 OHK4:0 "诺夫哥罗德彼得霍夫商站"
 OHK4_ADJ:0 "彼得霍夫商站"
 oe_hbg_name_hinrich_pleskow:0 "海因里希·普莱斯科夫"
 oe_hbg_kontor_seat_4:0 "诺夫哥罗德彼得霍夫商站大院"
 oe_hbg_kontor_seat_4_desc:0 "坐落于沃尔霍夫河畔圣彼得教堂旁的汉萨彼得霍夫（Peterhof）商站大院，经行罗斯毛皮、蜂蜡与西欧银币布匹贸易，诺夫哥罗德领土主权丝毫无损。"
 oe_hbg_kontor:0 "汉萨海外商站"
 oe_hbg_kontor_desc:0 "吕贝克在海外重港设立的建筑型汉萨商站（Kontor）。商站在驻港总馆内统理专卖贸易、商事仲裁与船队补给，不分割驻在国一寸领土；恭顺时可应吕贝克征调协防。"
 LEAD_oe_hbg_kontor:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_hbg_kontor:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_hbg_kontor_call_tt:0 "海外商站处于恭顺档位时，可应吕贝克征调协助进攻作战。"
 oe_hbg_kontor_defend_tt:0 "海外商站处于如常或恭顺档位时，将自动驰援协防吕贝克。"
 oe_hbg_kontor_reform:0 "汉萨商站老商长议事制"
 oe_hbg_kontor_reform_desc:0 "由推举产生的老商长（Aldermanner）执掌的汉萨海外商站建筑型自治商政体制，统筹海外专卖收益、水手补给与护航事务。"
 STATIC_MODIFIER_NAME_oe_hbg_seat_prosperous_mod:0 "汉萨海外商站·商路兴旺"
 STATIC_MODIFIER_DESC_oe_hbg_seat_prosperous_mod:0 "本城驻节的汉萨海外商站恪守商规、货轮云集，显著提升本地商埠集散力与工坊兴盛。"
 STATIC_MODIFIER_NAME_oe_hbg_seat_friction_mod:0 "汉萨海外商站·关税龃龉"
 STATIC_MODIFIER_DESC_oe_hbg_seat_friction_mod:0 "驻港汉萨商人与本地行会在免税特权与秤量规程上发生摩擦，令市舶秩序微起波澜。"
 STATIC_MODIFIER_NAME_oe_hbg_kontor_compliant_mod:0 "汉萨商站·恪遵同盟商律"
 STATIC_MODIFIER_DESC_oe_hbg_kontor_compliant_mod:0 "该海外商站严格奉行吕贝克汉萨同盟大会决议，积极汇解商站分红并护持同盟船队。"
 STATIC_MODIFIER_NAME_oe_hbg_kontor_restive_mod:0 "汉萨商站·商帮离心"
 STATIC_MODIFIER_DESC_oe_hbg_kontor_restive_mod:0 "海外商站老商长与吕贝克母邦在分红与船运配额上分歧渐生，行政配合略显迟滞。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_hanseatic_diet:0 "汉萨同盟大会商站红利"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_hanseatic_diet:0 "吕贝克、汉堡、不来梅与四大海外商站代表在汉萨大会上核定统一度量、船期与红利分配，令北海—波罗的海海贸收益倍增。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_hansa_empire:0 "北海—波罗的海汉萨商业联邦"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_hansa_empire:0 "四大海外商站与文德诸港铸为一体化的海权商业联邦，凭严密柯克舰队与货币信用执掌北欧海贸牛耳。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_golden_fleece:0 "勃艮第金羊毛骑士团"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_golden_fleece:0 "仿效阿尔戈英雄远征金羊毛传说创立的欧洲至高世俗骑士勋团，凝聚勃艮第与弗兰德大贵族效忠并彰显无上宫廷骑士威仪。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_lotharingia:0 "洛塔林吉亚—中法兰克王冠"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_lotharingia:0 "自第戎绵延至布鲁日、南锡与亚琛的中法兰克古王国重光于世，在法兰西与德意志之间巍然矗立为西欧第三大强权。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_alhambra_jihad:0 "阿尔罕布拉护教义军总动员"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_alhambra_jihad:0 "跨海驰援的马格里布志愿骑兵与格拉纳达山地守军齐聚内华达山麓，誓死捍卫安达卢斯最后的锦绣宫城。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_cordoba_caliphate:0 "科尔多瓦倭马亚哈里发正统"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_cordoba_caliphate:0 "大清真寺千柱大厅重响宣礼之声，光复科尔多瓦、塞维利亚与格拉纳达的安达卢斯哈里发以武功与文治震撼西地中海。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_komnenos_claim:0 "大科穆宁正统复辟纲领"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_komnenos_claim:0 "特拉比松大科穆宁皇室高举黑海金鹰旗帜，承续阿莱克修斯一世荣光，以精锐攻城军与皇族法统剑指博斯普鲁斯。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_dec_greater_gothia:0 "大哥特—曼古普克里米亚公国"
 STATIC_MODIFIER_DESC_oe_hbg_mod_dec_greater_gothia:0 "从曼古普悬崖堡垒俯瞰黑海南北，克里米亚哥特人与庞图斯希腊军民齐心拓土，铸就固若金汤的黑海要塞邦国。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_reunion_feo:0 "黑海哥特—日耳曼千年重逢（哥特盟约）"
 STATIC_MODIFIER_DESC_oe_hbg_mod_reunion_feo:0 "自民族大迁徙别离千载之后，克里米亚哥特后裔与进驻黑海的条顿骑士团在卡法与曼古普执手重逢，互派精锐并贯通黑海—波罗的海商路。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_reunion_teu:0 "黑海哥特—日耳曼千年重逢（条顿盟约）"
 STATIC_MODIFIER_DESC_oe_hbg_mod_reunion_teu:0 "条顿骑士团在克里米亚寻获失散千年的东日耳曼哥特同胞，双方共守黑海崖城、共享丝路商港，书写欧亚史诗佳话。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_four_kontors:0 "四大海外商站特许网"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_four_kontors:0 "伦敦、布鲁日、卑尔根与诺夫哥罗德四大商站协同运作，将整个北欧贸易动脉牢牢系于汉萨金库。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_stralsund_toll:0 "《施特拉尔松德和约》海峡免税权"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_stralsund_toll:0 "迫使丹麦王廷确认汉萨商船自由通行厄勒海峡与斯堪尼亚渔场特权，同盟舰队称雄波罗的海入口。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_baltic_compact:0 "汉萨—条顿波罗的海商约"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_baltic_compact:0 "汉萨商船与条顿骑士团港口互通琥珀、木材与谷物专卖，化波罗的海为稳固共赢的黄金内湖。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_hanseatic_coinage:0 "文德银马克统一币制"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_hanseatic_coinage:0 "文德货币同盟铸造的足色银马克通行北海与罗斯集市，极大压低汇兑损耗并赢得跨国商界信赖。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_hansa_empire:0 "北海—波罗的海汉萨商业霸权"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_hansa_empire:0 "自泰晤士河口直抵沃尔霍夫河畔，汉萨红白双色旗统领全欧北方贸易与海权，缔造史无前例的海上商业帝国。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_flemish_looms:0 "弗兰德呢绒与低地财赋"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_flemish_looms:0 "布鲁日、根特与安特卫普的精纺呢绒工坊与港口税关为第戎宫廷注入源源不断的金银财赋。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_burgundian_court:0 "第戎与布鲁日骑士文艺宫廷"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_burgundian_court:0 "范艾克画派、宫廷礼仪与金羊毛盛典令勃艮第成为西欧诸国竞相仿效的典范，威望与外交号召力冠绝一时。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_golden_fleece:0 "金羊毛骑士团重骑精锐"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_golden_fleece:0 "身披金羊毛勋章颈链的勃艮第与低地贵族重骑冲锋陷阵，以无匹骑士荣誉统帅战场。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_ordonnance_companies:0 "勃艮第敕令常备军团"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_ordonnance_companies:0 "效法近代火炮与长枪重骑混编的常备敕令军团取代散漫封建征召，令勃艮第陆军兼备破城威力与铁血军纪。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_lotharingia_crown:0 "中法兰克洛塔林吉亚王统"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_lotharingia_crown:0 "连接索恩河、默兹河与莱茵河的洛塔林吉亚王冠重归一体，中央王权与各邦联省和谐共治。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_charlemagne_empire:0 "查理曼西欧大帝国荣光"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_charlemagne_empire:0 "亚琛御殿钟声再起，以勃艮第—洛塔林吉亚为核心重构查理曼西欧大帝国，威加莱茵与塞纳两岸。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_alhambra_bastion:0 "阿尔罕布拉内华达山地铁壁"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_alhambra_bastion:0 "依托格拉纳达高山险隘与红宫堡垒群构筑的纵深山地防线，令来犯强敌在群峰与烽燧间寸步难行。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_strait_alliance:0 "直布罗陀海峡马格里布联防"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_strait_alliance:0 "贯通马拉加、直布罗陀与休达的海峡渡运与联合舰队，确保北非商旅与援军畅通无阻。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_andalusi_reconquest:0 "安达卢斯北伐逆转洪流"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_andalusi_reconquest:0 "自瓜达尔基维尔河谷一路北进托莱多，安达卢斯精锐破城拔寨、逆转百年伊比利亚风云。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_muttawia_hosts:0 "安达卢斯与马格里布志愿精骑"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_muttawia_hosts:0 "善战的安达卢斯轻重骑兵与马格里布志愿义军融为一体，赋予哈里发大军绵绵不绝的兵源与突击锐气。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_andalusi_scholars:0 "科尔多瓦—格拉纳达黄金学府"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_andalusi_scholars:0 "天文学家、医家、水利工匠与大书库云集安达卢斯，以璀璨文明与灌溉农艺引领地中海科技风气之先。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_umayyad_caliphate:0 "西部倭马亚哈里发正统威权"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_umayyad_caliphate:0 "科尔多瓦哈里发御印重颁四方，伊比利亚与马格里布群情振奋，军纪与信仰凝聚力焕然一新。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_tours_avenged:0 "雪耻732图尔·跨越比利牛斯霸业"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_tours_avenged:0 "安达卢斯大军跨过比利牛斯山脉进抵法兰克腹地，洗雪732年图尔—普瓦捷古恨，重塑西欧与地中海千年格局。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_euxine_bastion:0 "黑海绝壁山城铁防"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_euxine_bastion:0 "特拉比松群山城垣与曼古普悬崖堡垒经年整饬，令强敌在黑海绝壁与险隘前折戟沉沙。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_pontic_silk:0 "庞图斯丝路与黑海商埠"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_pontic_silk:0 "大不里士驼队与克里米亚商帆在黑海良港交汇，生丝、香料与毛皮关税源源不断充实国库。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_euxine_hegemony:0 "黑海丝路制海商权"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_euxine_hegemony:0 "巡弋黑海四岸的战船舰队庇护商道畅通，将特拉比松、卡法与曼古普织成严密的海权贸易网。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_blacksea_crown:0 "庞图斯与克里米亚王者冠冕"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_blacksea_crown:0 "无论是大科穆宁重返君士坦丁堡的皇业，还是曼古普一统克里米亚的哥特雄风，皆令黑海诸邦俯首称臣。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_pontic_bridge:0 "黑海—波罗的海跨陆会盟"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_pontic_bridge:0 "黑海古城与北方日耳曼骑士建立跨洲商路与军事互助，令第聂伯至黑海的战略通衢畅行无阻。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_msn_blacksea_empire:0 "黑海与博斯普鲁斯无上共主"
 STATIC_MODIFIER_DESC_oe_hbg_mod_msn_blacksea_empire:0 "双头鹰与黑海王冠辉映博斯普鲁斯与克里米亚，东罗马余脉与哥特坚城终于铸就横跨黑海两岸的不朽帝国。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev1_a:0 "四大商站宪章重申"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev1_a:0 "汉萨大会重申伦敦、布鲁日、卑尔根与诺夫哥罗德商站自治章程，商站向心力与海外商权同步提升。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev1_b:0 "汉萨磅税专项征课"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev1_b:0 "向各商港统一开征汉萨磅税以充实舰队与公共金库，短期增收显著而略微触动港商利益。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev1_c:0 "吕贝克法海事商庭"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev1_c:0 "在诸加盟港推行统一的《吕贝克法》海事商事法庭，令契约信用与城邦协和远播四海。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev2_a:0 "文德柯克武装护航队"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev2_a:0 "改装高舷汉萨柯克大船为重炮战舰，破除厄勒海峡勒索并严密封锁敌对海港。"
 STATIC_MODIFIER_NAME_oe_hbg_mod_ev2_b:0 "厄勒海峡自由通商协定"
 STATIC_MODIFIER_DESC_oe_hbg_mod_ev2_b:0 "通过外交斡旋换取丹麦海峡免税通航与斯堪尼亚鲱鱼集市特许，免动干戈而坐享商利。"
