 oe_hbg_dec_hanseatic_diet_tt:0 "获得 #G 100#! 基础金币及每座活跃海外商站额外 #G +40#! 金币红利，诸商站忠诚 #G +10#!，并获得 #Y 10 年#!《汉萨同盟大会商站红利》。"
