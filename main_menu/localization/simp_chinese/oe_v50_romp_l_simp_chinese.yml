 oe_romp.505.desc:0 "随着罗马安稳归于古典多神旗帜之下，大匠们拭亮了阿格里帕的科林斯柱廊，并修缮了万神殿宏伟的藻井穹顶。正午天光自圆顶天窗倾泻而下，照亮十二奥林匹斯主神与罗马邦国诸神的新坛，地中海四方香客络绎不绝。"
