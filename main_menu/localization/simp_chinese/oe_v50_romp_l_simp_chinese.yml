 oe_romp.502.desc:0 "子夜更漏之时，圆形灶神殿中的长明圣火无风自炽，化作三尺银焰直冲穹顶。首席维斯塔贞女急报元老院：占兆官或议充实圣殿供奉，或请分送圣火余烬至各行省首府，或建言借祥兆扩充常平义仓。"
