 STATIC_MODIFIER_DESC_oe_v50_romp_mod_oracle_hermes:0 "西比尔神谕指引舰队驶向大洋彼岸，远航测绘、殖民视野与海贸皆获神佑。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_oracle_apollo:0 "西比尔神谕：阿波罗与雅典娜之兆"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_oracle_apollo:0 "西比尔神谕启迪学园思辨、稳固朝纲，并使诸神神谕愈加昭彰。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_creed_julian_neoplatonism:0 "帝国圣典：尤利安新柏拉图主义"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_creed_julian_neoplatonism:0 "将哲人皇帝尤利安的太阳神学与柏拉图学园确立为帝国永恒国宪，令学风与神恩大盛，唯令守旧贵族微生不满。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_creed_stoic_imperium:0 "帝国圣典：斯多葛宪政帝国"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_creed_stoic_imperium:0 "以严峻自律的斯多葛公德约束君主、军团与行省总督，强化军纪、控制与秩序，唯略抑商贾奢靡。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_creed_syncretic_pantheon:0 "帝国圣典：普世融合万神殿"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_creed_syncretic_pantheon:0 "在四海九州奉行古典诸神融合之道，广纳诸邦礼俗与归化生民，唯令固守古仪的祭司略有怨言。"
