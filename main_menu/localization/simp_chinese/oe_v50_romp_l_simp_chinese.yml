 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_academy_neo:0 "新柏拉图、斯多葛与伊壁鸠鲁学派宗师齐聚柱廊辩论格致，令帝国文教昌明。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_vestal_guard:0 "维斯塔圣火守护团"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_vestal_guard:0 "重修维斯塔圣坛并充实奉火基金，护佑国本稳固、百业安康、疫疠不侵。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_eleusis_harvest:0 "厄琉西斯丰穰秘仪"
