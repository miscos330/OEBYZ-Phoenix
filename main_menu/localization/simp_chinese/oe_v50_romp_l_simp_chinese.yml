 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_pantheon_reopened:0 "天光再度穿透罗马万神殿宏伟圆顶照耀诸神圣坛，令神恩、声望与正统交相辉映。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_olympus_pilgrimage:0 "奥林匹斯圣山巡祭"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_olympus_pilgrimage:0 "帝驾亲登云雾缭绕的奥林匹斯山巅献祭，天命正统与神谕之效由此倍增。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_civic_jurisprudence:0 "希腊—罗马市民法宪章"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_civic_jurisprudence:0 "城邦法庭以古典自然法统合各地市宪，促进文化归化与行省政令通达。"
