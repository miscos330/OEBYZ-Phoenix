l_simp_chinese:
 # Project Phoenix v50.0 Hellenism Deep Overhaul (Main Mod Layer 1, oe_v50_romp_)
 oe_v50_romp_janus_god:0 "双面神雅努斯"
 oe_v50_romp_janus_god.latin_language:0 "双面神雅努斯·奎里努斯"
 oe_v50_romp_janus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_janus_god')]一面回望地中海故土的曙光，一面远眺大洋彼岸的新天，司掌城门关隘、历法更始、朝政过渡、外交盟约与越洋拓殖。"
 oe_v50_romp_janus_god_omen:0 "广场双拱门的青铜钥匙轻声转动，门扉迎向和平、通衢与远洋航道，[ShowGodName('oe_v50_romp_janus_god')]正垂佑帝国的每一道关口与新始……"
 oe_v50_romp_omen_janus_twin_horizons:0 "双洋门扉"
 oe_v50_romp_omen_janus_twin_horizons_desc:0 "双面神同时凝视东西两洋，令帝国的远洋航程与海外拓殖半径大为延展。"
 oe_v50_romp_omen_janus_portunus_harbors:0 "海港关津之佑"
 oe_v50_romp_omen_janus_portunus_harbors_desc:0 "城门与港埠前的献祭令郡县政令畅通，海上贸易效率亦随之跃升。"
 oe_v50_romp_omen_janus_consular_calends:0 "元朔新政"
 oe_v50_romp_omen_janus_consular_calends_desc:0 "在岁首元朔奉行雅努斯古礼，令内阁理政高效稳健、国家秩序易于维系。"
 oe_v50_romp_omen_janus_pax_portals:0 "偃武闭门"
 oe_v50_romp_omen_janus_pax_portals_desc:0 "当雅努斯神殿的青铜大门在清平之世徐徐合拢，四邻咸信帝国威仪，郡邑日益殷富。"
 oe_v50_romp_omen_janus_frontier_passage:0 "开疆通途"
 oe_v50_romp_omen_janus_frontier_passage_desc:0 "探险船队与拓荒移民乘顺风跨越未知海峡，新境探索与迁徙源源不绝。"
 oe_v50_romp_hestia_god:0 "城邦圣灶赫斯提亚"
 oe_v50_romp_hestia_god.latin_language:0 "国灶圣母维斯塔"
 oe_v50_romp_hestia_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_hestia_god')]守护市政厅永不熄灭的公共圣灶，每一座新殖民城邦皆自此分取火种；她温和而坚韧的神恩维系着国本稳固、阶层和睦、人口繁盛与长久兴荣。"
 oe_v50_romp_hestia_god_omen:0 "市政厅圣灶中的无瑕火种如熔金般静静燃亮，暖意拂过议事厅与万户农舍，[ShowGodName('oe_v50_romp_hestia_god')]正守望城邦与生民的安宁……"
 oe_v50_romp_omen_hestia_prytaneum_flame:0 "市政圣灶长明"
 oe_v50_romp_omen_hestia_prytaneum_flame_desc:0 "长明不熄的公共圣火平抑派系纷争，令国家稳固度稳步攀升、叛乱渐息。"
 oe_v50_romp_omen_hestia_civic_concord:0 "四民和睦"
 oe_v50_romp_omen_hestia_civic_concord_desc:0 "万千家宅同献首酌于灶神，令贵族、市民、教士与庶民各安其分、信仰笃定。"
 oe_v50_romp_omen_hestia_fecund_hearths:0 "万户生息"
 oe_v50_romp_omen_hestia_fecund_hearths_desc:0 "洁净的灶火与安稳的家室令人口繁衍兴旺，城邑亦能抵御时疫侵袭。"
 oe_v50_romp_omen_hestia_golden_prosperity:0 "城邦殷实"
 oe_v50_romp_omen_hestia_golden_prosperity_desc:0 "安居乐业的工坊与市集持续滋养城乡繁荣与地方开发。"
 oe_v50_romp_omen_hestia_sacred_asylum:0 "家国庇护"
 oe_v50_romp_omen_hestia_sacred_asylum_desc:0 "护卫先祖灶火的公民众志成城，令要塞固若金汤、厌战情绪迅速消解。"
 oe_v50_romp_hermes_god:0 "沧海商神赫耳墨斯"
 oe_v50_romp_hermes_god.latin_language:0 "远洋墨丘利"
 oe_v50_romp_hermes_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_hermes_god')]引领飞翼帆船、明敏使节、远洋探险家与跨海商会纵横碧波，将大胆航海与精妙外交铸就为绵延四海的帝国基业。"
 oe_v50_romp_hermes_god_omen:0 "咸润海风鼓满三角帆，使节手中青铜双蛇杖闪耀微光，[ShowGodName('oe_v50_romp_hermes_god')]正为商船与使团辟开万里通途……"
 oe_v50_romp_omen_hermes_winged_caravels:0 "飞翼远航"
 oe_v50_romp_omen_hermes_winged_caravels_desc:0 "蒙迅捷信使庇佑的船长抢先测绘遥远海岸，海外探索与殖民航程冠绝诸国。"
 oe_v50_romp_omen_hermes_caduceus_envoys:0 "双蛇杖使节"
 oe_v50_romp_omen_hermes_caduceus_envoys_desc:0 "手持双蛇杖徽记的帝国使节辞令犀利、进退得体，所至之邦无不折服亲善。"
 oe_v50_romp_omen_hermes_emporion_winds:0 "商埠顺风"
 oe_v50_romp_omen_hermes_emporion_winds_desc:0 "季风与信风如期而至，令海贸利润与商人势力节节攀升。"
 oe_v50_romp_omen_hermes_silver_scales:0 "墨丘利银秤"
 oe_v50_romp_omen_hermes_silver_scales_desc:0 "公平度量与护航商队并行，大幅提升帝国贸易收入与海上控制力。"
 oe_v50_romp_omen_hermes_star_charts:0 "领航星图"
 oe_v50_romp_omen_hermes_star_charts_desc:0 "精密星盘与港湾领航术拓展舰队航程，并显著减少远洋舰船损耗。"
 oe_v50_romp_dionysus_god:0 "解放者狄俄尼索斯"
 oe_v50_romp_dionysus_god.latin_language:0 "自由圣父利伯尔"
 oe_v50_romp_dionysus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_dionysus_god')]司掌城邦戏剧、高雅艺术、葡萄佳酿与欢欣秘仪，化解异族隔阂，令四方新附行省在欢庆与包容中自然融入古典文明。"
 oe_v50_romp_dionysus_god_omen:0 "常春藤花环缀满大理石剧场，笛声与合唱响彻街衢坊市，[ShowGodName('oe_v50_romp_dionysus_god')]正将欢欣与包容的琼浆洒向天下……"
 oe_v50_romp_omen_dionysus_great_dionysia:0 "大酒神节戏剧盛典"
 oe_v50_romp_omen_dionysus_great_dionysia_desc:0 "在宏伟石砌剧场上演的悲剧与喜剧盛会，令帝国文化传统与声望远播四海。"
 oe_v50_romp_omen_dionysus_muses_atelier:0 "缪斯艺苑"
 oe_v50_romp_omen_dionysus_muses_atelier_desc:0 "灵感泉涌的雕塑家、剧作家与乐师云集帝廷，艺坛人才辈出。"
 oe_v50_romp_omen_dionysus_liber_concord:0 "万民同欢"
 oe_v50_romp_omen_dionysus_liber_concord_desc:0 "利伯尔圣父宽宏开放的精神消弭教派猜忌，异教与异端臣民皆感宽容。"
 oe_v50_romp_omen_dionysus_thyrsus_assimilation:0 "节庆化俗"
 oe_v50_romp_omen_dionysus_thyrsus_assimilation_desc:0 "全城共庆的古典节庆吸引边疆民众倾心向化，文化融合与多元包容并行不悖。"
 oe_v50_romp_omen_dionysus_vintage_revelry:0 "丰酿欢歌"
 oe_v50_romp_omen_dionysus_vintage_revelry_desc:0 "秋收佳酿庆典令民众喜乐安康，城镇各阶层晋升流动亦大为畅快。"
 oe_v50_romp_demeter_god:0 "丰饶大地神德墨忒尔"
 oe_v50_romp_demeter_god.latin_language:0 "谷神刻瑞斯"
 oe_v50_romp_demeter_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_demeter_god')]祝圣每一道新翻的垄沟、梯田果园与边疆农庄，令五谷丰登、粮仓充盈，源源滋养大军与都城，并召引拓荒农人垦殖沃野。"
 oe_v50_romp_demeter_god_omen:0 "晴朗春空下金色麦浪低垂，沃土芬芳弥漫山谷田畴，[ShowGodName('oe_v50_romp_demeter_god')]正缓步巡行帝国的广袤良田……"
 oe_v50_romp_omen_demeter_golden_sheaf:0 "厄琉西斯金穗"
 oe_v50_romp_omen_demeter_golden_sheaf_desc:0 "丰沛的夏秋收成装满郡县义仓，粮食损耗大幅减少，岁荒无忧。"
 oe_v50_romp_omen_demeter_settler_furrows:0 "拓荒沃壤"
 oe_v50_romp_omen_demeter_settler_furrows_desc:0 "沃土授田的感召吸引勤恳农户踊跃迁往新境，人口生息随之勃发。"
 oe_v50_romp_omen_demeter_rural_blossom:0 "乡野欣荣"
 oe_v50_romp_omen_demeter_rural_blossom_desc:0 "兴修沟渠、广植桑麻与精选良种，令乡邑开发度与人口吸纳力持续增强。"
 oe_v50_romp_omen_demeter_granary_law:0 "圣仓农政"
 oe_v50_romp_omen_demeter_granary_law_desc:0 "扩建公仓并扶持乡间作坊，兼顾全国储粮容量与生产效率。"
 oe_v50_romp_omen_demeter_thesmophoria:0 "立法丰年祭"
 oe_v50_romp_omen_demeter_thesmophoria_desc:0 "秋日丰年古礼尊崇农法与地权，令农人欣悦归心、郡县日臻富庶。"
 oe_v50_romp_bellona_god:0 "攻城战神贝洛娜"
 oe_v50_romp_bellona_god.latin_language:0 "凯旋战神贝洛娜"
 oe_v50_romp_bellona_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_bellona_god')]在元老院宣战石柱前驾驭青铜战车疾驰，统御攻城重炮、海上烈焰齐射、百战不屈的耐力与月桂加冕的凯旋大典。"
 oe_v50_romp_bellona_god_omen:0 "绯红战矛掷过贝洛娜神殿前的宣战界石，青铜重炮轰鸣回应，[ShowGodName('oe_v50_romp_bellona_god')]已驰骋于帝国军旗之前……"
 oe_v50_romp_omen_bellona_wall_breaker:0 "破城重锤"
 oe_v50_romp_omen_bellona_wall_breaker_desc:0 "工兵与炮手在贝洛娜威严注视下昼夜轰击，敌军坚城壁垒应声崩摧。"
 oe_v50_romp_omen_bellona_bronze_thunder:0 "青铜雷霆"
 oe_v50_romp_omen_bellona_bronze_thunder_desc:0 "帝国铸炮坊批量浇铸精良重炮，炮兵战力大增而造价更省。"
 oe_v50_romp_omen_bellona_fiery_broadside:0 "沧溟烈焰"
 oe_v50_romp_omen_bellona_fiery_broadside_desc:0 "水师炮手与猛火油水兵沉着齐射，海上火力与海军士气所向披靡。"
 oe_v50_romp_omen_bellona_unyielding_spear:0 "百战不屈"
 oe_v50_romp_omen_bellona_unyielding_spear_desc:0 "久经沙场的军团战后迅即重整士气，长期征伐亦不露疲态。"
 oe_v50_romp_omen_bellona_campus_triumph:0 "战神广场凯旋"
 oe_v50_romp_omen_bellona_campus_triumph_desc:0 "凯旋入城的无上荣光激励三军严守军纪，令帝国军事传统代代相承。"
 oe_v50_romp_eleusinian_mysteries_aspect:0 "厄琉西斯大秘仪"
 oe_v50_romp_eleusinian_mysteries_aspect_desc:0 "在帝国各行省复兴德墨忒尔与珀耳塞福涅的火炬大秘仪，温和推进信仰归化、激发艺坛英才、促进人口繁衍，并以包容胸怀接纳慕道异教臣民。"
 oe_v50_romp_orphic_astronomy_aspect:0 "俄耳甫斯天体星学"
 oe_v50_romp_orphic_astronomy_aspect_desc:0 "将俄耳甫斯宇宙和谐观与亚历山大城星图测绘、远洋航海术融为一体，显著加快学术研发、提高国民识字上限，并大幅拓展海军与殖民航程。"
 oe_v50_romp_stoic_civitas_aspect:0 "斯多葛城邦美德"
 oe_v50_romp_stoic_civitas_aspect_desc:0 "将芝诺与马可·奥勒留的斯多葛克己自律融入官署与军团，兼顾铁血军纪、地方控制力、国家稳固效率与长治久安。"
 oe_v50_romp_promethean_foundry_aspect:0 "普罗米修斯巧工铸坊"
 oe_v50_romp_promethean_foundry_aspect_desc:0 "尊奉普罗米修斯与赫淮斯托斯为圣火、冶金与营造之主，显著提升全国生产效率、重炮火力与大型工程营造速度。"
 oe_v50_romp_cab_sibylline_augury:0 "稽查西比尔神谕书"
 oe_v50_romp_cab_sibylline_augury_desc:0 "委任资深祭司大臣主持西比尔神谕书卷稽核与观兆推演，提升国家稳固效率、神谕强度、学术研发速度与外交声誉。"
 oe_v50_romp_cab_sibylline_augury_action:0 "稽查西比尔神谕书"
 oe_v50_romp_cab_sibylline_augury_active:0 "进行中：稽查西比尔神谕书"
 oe_v50_romp_cab_sibylline_augury_action_progress:0 "进行中"
 oe_v50_romp_cab_sibylline_augury_action_progress_wordier:0 "稽查西比尔神谕书（进行中）"
 oe_v50_romp_cab_sibylline_augury_action_progress_tooltip:0 "委任资深祭司大臣主持西比尔神谕书卷稽核与观兆推演，提升国家稳固效率、神谕强度、学术研发速度与外交声誉。"
 oe_v50_romp_cab_consecrate_temples:0 "祝圣行省诸神圣殿"
 oe_v50_romp_cab_consecrate_temples_desc:0 "派遣大祭司特使赴目标行省营建并祝圣古典多神圣坛，加速行省与全国的希腊—罗马信仰归化、文化融合与地方控制力提升。"
 oe_v50_romp_cab_consecrate_temples_action:0 "祝圣行省诸神圣殿：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v50_romp_cab_consecrate_temples_active:0 "正在 [SCOPE.sProvince('target').GetNameWithHighlightOnly] 祝圣诸神圣殿"
 oe_v50_romp_cab_consecrate_temples_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v50_romp_cab_consecrate_temples_action_progress_wordier:0 "祝圣行省诸神圣殿（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v50_romp_cab_consecrate_temples_action_progress_tooltip:0 "派遣大祭司特使赴目标行省营建并祝圣古典多神圣坛，加速行省与全国的希腊—罗马信仰归化、文化融合与地方控制力提升。"
 oe_v50_romp_cab_consecrate_temples_select_province:0 "选择祝圣诸神圣殿的目标行省"
 oe_v50_romp_cab_consecrate_temples_no_provinces:0 "@trigger_no! 当前没有可供祝圣圣殿的合格行省。"
 oe_v50_romp_dec_ludi_saeculares.title:0 "举办世纪大典（Ludi Saeculares）"
 oe_v50_romp_dec_ludi_saeculares.desc:0 "循奥古斯都古制举办为期三日三夜的世纪净化与更新大典，提升帝国声望、正统性与文化传统，并开启盛典抉择事件（冷却时间 #Y 15#! 年）。"
 oe_v50_romp_dec_ludi_saeculares.a:0 "点燃世纪大典圣火！"
 oe_v50_romp_dec_ludi_cd_tt:0 "距离上次举办世纪大典已满 #Y 15#! 年。"
 oe_v50_romp_dec_ludi_saeculares_tt:0 "立即获得声望、正统性与文化传统，并触发 #Y 世纪大典：黄金纪元重光#! 三选一盛典事件（#Y 15#! 年冷却）。"
 oe_v50_romp_dec_sibylline_oracle.title:0 "启封西比尔兵政神谕"
 oe_v50_romp_dec_sibylline_oracle.desc:0 "令十五人神谕祭司团开启鎏金书匣诵读库迈女先知神谕，在玛尔斯—贝洛娜兵伐、赫耳墨斯—海神远洋或阿波罗—雅典娜格致三道预言中择一奉行（冷却时间 #Y 10#! 年）。"
 oe_v50_romp_dec_sibylline_oracle.a:0 "启封西比尔神谕书卷"
 oe_v50_romp_dec_sibylline_cd_tt:0 "距离上次启封西比尔神谕已满 #Y 10#! 年。"
 oe_v50_romp_dec_sibylline_oracle_tt:0 "触发 #Y 西比尔兵政神谕书卷启封#! 三选一神谕事件（#Y 10#! 年冷却）。"
 oe_v50_romp_dec_imperial_apotheosis.title:0 "颁布神君奥古斯都崇拜国宪"
 oe_v50_romp_dec_imperial_apotheosis.desc:0 "在元老院与大祭司团见证下，为古典多神帝国确立永久哲学与城邦宪政基石：择立尤利安新柏拉图主义、斯多葛宪政帝国或普世融合万神殿之一。"
 oe_v50_romp_dec_imperial_apotheosis.a:0 "颁布永久帝国哲学圣典"
 oe_v50_romp_dec_imperial_apotheosis_tt:0 "触发 #Y 神君奥古斯都崇拜永久圣典#! 抉择事件，永久塑造帝国的哲学、治理与宗教取向。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ludi_civic:0 "世纪大典：万民同庆"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ludi_civic:0 "盛大的世纪大典重续帝室、元老院与万民之间的神圣契约，令四海和睦、声望远扬。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ludi_martial:0 "世纪大典：凯旋竞技场"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ludi_martial:0 "战车竞逐、模拟海战与盛大阅兵鼓舞三军士气与军事传统，唯军备仪仗耗费略增。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ludi_arts:0 "世纪大典：世纪圣诗乐舞"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ludi_arts:0 "少年合唱团与古典诗人共颂世纪圣诗，开启艺文与格致并盛的新纪元。"
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_oracle_bellona:0 "西比尔神谕：玛尔斯与贝洛娜之兆"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_oracle_bellona:0 "西比尔神谕诏示将士严明军纪、勇克坚城，然远征军费亦随之增加。"
