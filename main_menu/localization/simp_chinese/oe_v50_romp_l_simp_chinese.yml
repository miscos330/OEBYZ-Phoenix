 oe_romp.501.title:0 "学园大辩论"
 oe_romp.501.desc:0 "在京城复建的大理石哲学柱廊下，三大古典学派就希腊—罗马复兴的精神内核展开激辩：新柏拉图派宣讲朝向太阳太一的形上飞升，斯多葛派强调法度与军团中的钢铁公德，伊壁鸠鲁学者则推崇澄明求真与宽和的城邦生活。"
