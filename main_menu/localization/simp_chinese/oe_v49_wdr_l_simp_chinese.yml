l_simp_chinese:
 oe_sit_v49_wonders_race:0 "世界奇观与大工程竞速"
 oe_sit_v49_wonders_race_desc:0 "遍及五大洲的雄主正将充盈国库倾注于二十六座三阶升级世界大工程——跨海运河、巍峨穹顶、天文书院、证券交易所、皇家船坞与不朽圣殿——竞相由一阶奠基扩建至二阶宏构，最终加冕三阶传世奇观。"
 oe_v49_wdr_end_eternal_age:0 "传世奇观黄金时代"
 oe_v49_wdr_end_eternal_age_desc:0 "宏伟土木重塑了世界版图：众多三阶传世奇观矗立各大洲之巅，为参与营建的列国留下泽被后世的声望、学术与商贸遗产。"
 oe_v49_wdr_end_grand_monuments:0 "宏伟纪念碑时代"
 oe_v49_wdr_end_grand_monuments_desc:0 "半数以上的世界大工程均已拔地而起，巍峨地标与水利枢纽将海陆商路紧扣一体，开启宏伟纪念碑时代。"
 oe_v49_wdr_end_modern_horizon:0 "近代土木工程黎明"
 oe_v49_wdr_end_modern_horizon_desc:0 "跨越数世纪的奇观竞建沉淀为近代公共工程体系，各地大工程遗址仍可供后世继续修筑与扩建。"
 oe_v49_wdr_map_tier3_tt:0 "此地已加冕三阶传世奇观。"
 oe_v49_wdr_map_tier2_tt:0 "此地已扩建至二阶宏构大工程。"
 oe_v49_wdr_map_tier1_tt:0 "此地已建成一阶奠基大工程。"
 oe_v49_wdr_map_site_tt:0 "可兴建世界大工程的历史选址。"
 oe_v49_wdr_legend_tier3:0 "三阶传世奇观"
 oe_v49_wdr_legend_tier2:0 "二阶宏构大工程"
 oe_v49_wdr_legend_tier1:0 "一阶奠基大工程"
 oe_v49_wdr_legend_site:0 "待建大工程选址"
 OE_V49_WDR_GUI_HDR_PLAYER:0 "本国已建奇观数"
 OE_V49_WDR_GUI_HDR_GLOBAL:0 "全球已建奇观数"
 OE_V49_WDR_GUI_CARD_TITLE:0 "二十六座三阶升级世界大工程"
 OE_V49_WDR_GUI_CARD_BODY:0 "于二十六处历史胜地兴建世界大工程（或在美洲基督教/希腊语系都城兴建新圣索菲亚穹顶），并逐级由一阶奠基升级至二阶宏构与三阶传世奇观，将后期丰沛国库转化为传世威望与繁荣地标。"
 OE_V49_WDR_GUI_PLAYER_TIERS_LBL:0 "本国累计奇观阶数"
 OE_V49_WDR_GUI_GLOBAL_TIER3_LBL:0 "全球三阶传世奇观"
 OE_V49_WDR_GUI_GAUGE_LABEL:0 "全球奇观竞速辉煌度"
 OE_V49_WDR_GUI_FOOTNOTE:0 "使用下方局势行动可拨付大工程专款、直接督建二阶宏构与加冕三阶传世奇观、举办万国博览会或宣告建筑黄金时代。"
 oe_v49_wdr_suez_canal:0 "苏伊士跨海大运河"
 oe_v49_wdr_suez_canal_desc:0 "贯穿苏伊士地峡、直连地中海与红海的巨型跨海运河。可依序自一阶奠基水闸、二阶宏构通航航道扩建至三阶传世海运奇观，重塑欧亚航运版图。"
 oe_v49_wdr_suez_canal_maint:0 "苏伊士跨海大运河岁修养护"
 oe_v49_wdr_panama_canal:0 "巴拿马地峡大运河"
 oe_v49_wdr_panama_canal_desc:0 "劈开中美洲地峡山脊、以梯级石闸贯通大西洋与太平洋的跨洋大运河。历三阶营建可成举世瞩目的传世水工奇观。"
 oe_v49_wdr_panama_canal_maint:0 "巴拿马地峡大运河岁修养护"
 oe_v49_wdr_corinth_canal:0 "科林斯地峡运河"
 oe_v49_wdr_corinth_canal_desc:0 "沿古代石道深凿石灰岩峡谷、令爱琴海与亚得里亚海舟楫免绕伯罗奔尼撒险角的千年运河奇观，可分三阶扩建升级。"
 oe_v49_wdr_corinth_canal_maint:0 "科林斯地峡运河岁修养护"
 oe_v49_wdr_grand_canal:0 "京杭大运河漕运总枢纽"
 oe_v49_wdr_grand_canal_desc:0 "集巨型复式石闸、蓄水清口与皇室漕仓于一体的大运河总枢纽，总揽南北粮盐百货转运。可历经三阶升级成为传世水利奇观。"
 oe_v49_wdr_grand_canal_maint:0 "京杭大运河漕运总枢纽岁修养护"
 oe_v49_wdr_nova_hagia_sophia:0 "新君士坦丁堡新圣索菲亚穹顶"
 oe_v49_wdr_nova_hagia_sophia_desc:0 "巍然矗立于新大陆都城的金色马赛克帆拱巨穹，象征古典基督教与希腊罗马文明于彼岸重生的不朽圣殿。可经三阶扩建加冕为传世奇观。"
 oe_v49_wdr_nova_hagia_sophia_maint:0 "新君士坦丁堡新圣索菲亚穹顶岁修养护"
 oe_v49_wdr_trans_siberian_road:0 "西伯利亚大驿道总枢"
 oe_v49_wdr_trans_siberian_road_desc:0 "以托博尔斯克为总枢、贯通乌拉尔至远东冰原的木栈驿道、渡口堡垒与毛皮转运网。历三阶营建可成横跨北亚的陆路工程奇观。"
 oe_v49_wdr_trans_siberian_road_maint:0 "西伯利亚大驿道总枢岁修养护"
 oe_v49_wdr_crystal_pavilion:0 "伦敦水晶万国博览殿"
 oe_v49_wdr_crystal_pavilion_desc:0 "以精铸铁骨与明澈巨幅玻璃构筑的万国博览圣殿，陈列世界机械工艺、航图与博物奇珍。可分三阶扩建，领衔近代博展奇观。"
 oe_v49_wdr_crystal_pavilion_maint:0 "伦敦水晶万国博览殿岁修养护"
 oe_v49_wdr_silk_road_caravanserai:0 "巴格达—丝路大商驿"
 oe_v49_wdr_silk_road_caravanserai_desc:0 "集拱顶大巴扎、凉廊客栈、金银成色公证所与驼队大院于一体的丝路总商驿，连通波斯湾与欧亚腹地商路。可经三阶扩建为传世商贸奇观。"
 oe_v49_wdr_silk_road_caravanserai_maint:0 "巴格达—丝路大商驿岁修养护"
 oe_v49_wdr_sun_plaza_tenochtitlan:0 "特诺奇蒂特兰太阳圣坛广场"
 oe_v49_wdr_sun_plaza_tenochtitlan_desc:0 "坐落于湖心都城、融阶梯火山岩圣坛、天文直道与浮田水网于一体的美洲恢宏广场，可分三阶扩建为传世文明奇观。"
 oe_v49_wdr_sun_plaza_tenochtitlan_maint:0 "特诺奇蒂特兰太阳圣坛广场岁修养护"
 oe_v49_wdr_samarkand_observatory:0 "撒马尔罕大天文台与经学院"
 oe_v49_wdr_samarkand_observatory_desc:0 "以巨型地下大理石六分仪与碧琉璃经学院闻名遐迩的天文圣殿，汇集欧亚历算大师测定星表。历三阶营建可成传世学术奇观。"
 oe_v49_wdr_samarkand_observatory_maint:0 "撒马尔罕大天文台与经学院岁修养护"
 oe_v49_wdr_jingdezhen_kilns:0 "景德镇御窑万瓷总厂"
 oe_v49_wdr_jingdezhen_kilns_desc:0 "汇聚龙窑烟火、高岭陶土精炼坊与青花彩绘作坊的御窑万瓷总厂，所产名瓷行销四海。经三阶扩建可成天下工艺奇观。"
 oe_v49_wdr_jingdezhen_kilns_maint:0 "景德镇御窑万瓷总厂岁修养护"
 oe_v49_wdr_canton_oceanic_yards:0 "广州十三行与远洋船坞"
 oe_v49_wdr_canton_oceanic_yards_desc:0 "雄踞珠江入海口的深水船坞与十三行巨埠，兼备远洋巨舶建造与万国茶丝瓷互市之利。历三阶扩建可成南海传世海贸奇观。"
 oe_v49_wdr_canton_oceanic_yards_maint:0 "广州十三行与远洋船坞岁修养护"
 oe_v49_wdr_andean_royal_highway:0 "安第斯群峰皇家驿道总坛"
 oe_v49_wdr_andean_royal_highway_desc:0 "以基多为高地总坛、由石砌栈道、索桥与崖壁粮仓织就的安第斯皇家大道网。经三阶扩建可成纵贯美洲脊梁的传世奇观。"
 oe_v49_wdr_andean_royal_highway_maint:0 "安第斯群峰皇家驿道总坛岁修养护"
 oe_v49_wdr_alexandria_pharos:0 "亚历山大新法罗斯灯塔"
 oe_v49_wdr_alexandria_pharos_desc:0 "于法罗斯岛旧址巍然重建的三层白石巨塔，塔顶巨型铜镜与不熄烽火昼夜指引地中海千帆入港。可分三阶升级为传世航海奇观。"
 oe_v49_wdr_alexandria_pharos_maint:0 "亚历山大新法罗斯灯塔岁修养护"
 oe_v49_wdr_versailles_palace:0 "凡尔赛太阳宫苑"
 oe_v49_wdr_versailles_palace_desc:0 "集镜厅长廊、几何御苑与巨型喷泉水系于一体的巴洛克皇室宫苑，令四海宫廷竞相仿效礼乐法度。可经三阶扩建加冕为传世奇观。"
 oe_v49_wdr_versailles_palace_maint:0 "凡尔赛太阳宫苑岁修养护"
 oe_v49_wdr_vienna_academy:0 "维也纳帝国歌剧与科学院"
 oe_v49_wdr_vienna_academy_desc:0 "矗立于多瑙河畔的帝国歌剧院与自然科学院，荟萃欧洲乐圣、法学家与博物泰斗。历三阶扩建可成举世瞩目的文化殿堂奇观。"
 oe_v49_wdr_vienna_academy_maint:0 "维也纳帝国歌剧与科学院岁修养护"
 oe_v49_wdr_amsterdam_bourse:0 "阿姆斯特丹世界证券交易所"
 oe_v49_wdr_amsterdam_bourse_desc:0 "拱廊环绕的世界金融清算与证券交易所，每日为跨洋股份、海运保险与全球大宗货期货定盘。经三阶扩建可成近代金融奇观。"
 oe_v49_wdr_amsterdam_bourse_maint:0 "阿姆斯特丹世界证券交易所岁修养护"
 oe_v49_wdr_venice_arsenal:0 "威尼斯大兵工厂船台"
 oe_v49_wdr_venice_arsenal_desc:0 "集有顶巨型船台、制缆长廊、铸炮坊与流水装配渠于一体的威尼斯大兵工厂，造舰之速冠绝地中海。可经三阶扩建成为传世船政奇观。"
 oe_v49_wdr_venice_arsenal_maint:0 "威尼斯大兵工厂船台岁修养护"
 oe_v49_wdr_lisbon_casa_india:0 "里斯本印度之家航海馆"
 oe_v49_wdr_lisbon_casa_india_desc:0 "雄峙特茹河口、总揽秘密海图室、星盘作坊与香料关税库的跨洋航海中枢。历三阶扩建可成领航大航海时代的传世奇观。"
 oe_v49_wdr_lisbon_casa_india_maint:0 "里斯本印度之家航海馆岁修养护"
 oe_v49_wdr_neva_admiralty:0 "涅瓦河帝国海军部尖塔"
 oe_v49_wdr_neva_admiralty_desc:0 "雄踞涅瓦河口、以鎏金尖塔与巨型船坞闻名的帝国海军部建筑群，控扼波罗的海门户。可分三阶扩建加冕为传世海权奇观。"
 oe_v49_wdr_neva_admiralty_maint:0 "涅瓦河帝国海军部尖塔岁修养护"
 oe_v49_wdr_delhi_red_fort:0 "德里红堡帝国朝殿"
 oe_v49_wdr_delhi_red_fort_desc:0 "绵延朱红砂岩巨垣、内藏白玉大朝殿与清泉御苑的德里红堡帝国宫城，威慑印度斯坦南北。经三阶扩建可成传世帝都奇观。"
 oe_v49_wdr_delhi_red_fort_maint:0 "德里红堡帝国朝殿岁修养护"
 oe_v49_wdr_kyoto_golden_pavilion:0 "京都金阁万世禅苑"
 oe_v49_wdr_kyoto_golden_pavilion_desc:0 "三层贴金重檐倒映于镜湖碧波之上、与枯山水松庭浑然天成的京都金阁禅苑，尽显东亚典雅美韵。可分三阶修缮扩建为传世奇观。"
 oe_v49_wdr_kyoto_golden_pavilion_maint:0 "京都金阁万世禅苑岁修养护"
 oe_v49_wdr_cairo_al_azhar:0 "开罗爱资哈尔大藏书楼"
 oe_v49_wdr_cairo_al_azhar_desc:0 "坐落于尼罗河畔、汇集法典、医学、天文与古典哲学珍本的爱资哈尔大藏书楼与讲学廊院。经三阶扩建可成光照三洲的传世学术奇观。"
 oe_v49_wdr_cairo_al_azhar_maint:0 "开罗爱资哈尔大藏书楼岁修养护"
 oe_v49_wdr_timbuktu_sankore:0 "廷巴克图桑科雷大学城"
 oe_v49_wdr_timbuktu_sankore_desc:0 "耸立于尼日尔河与撒哈拉商路交汇处的桑科雷大学城，以宏伟土砖金字塔宣礼塔与海量手抄典籍闻名于世。可分三阶扩建成为传世奇观。"
 oe_v49_wdr_timbuktu_sankore_maint:0 "廷巴克图桑科雷大学城岁修养护"
 oe_v49_wdr_aksum_rock_sanctuary:0 "阿克苏姆巨岩圣殿"
 oe_v49_wdr_aksum_rock_sanctuary_desc:0 "以整块巨型花岗岩雕凿方尖碑、凿岩圣堂与高原朝圣石阶著称的阿克苏姆圣殿群，彰显非洲之角千年古韵。可经三阶扩建成为传世奇观。"
 oe_v49_wdr_aksum_rock_sanctuary_maint:0 "阿克苏姆巨岩圣殿岁修养护"
 oe_v49_wdr_cape_beacon:0 "好望角远洋航标总港"
 oe_v49_wdr_cape_beacon_desc:0 "雄踞大西洋与印度洋交汇绝壁之上的巨石防波堤、抗风灯塔与远洋补给船坞，护佑万里绕角商舶。历三阶营建可成南半球传世海港奇观。"
 oe_v49_wdr_cape_beacon_maint:0 "好望角远洋航标总港岁修养护"
 oe_v49_wdr_act_charter_fund:0 "特许帝国大工程专项基金"
 oe_v49_wdr_act_charter_fund_desc:0 "拨付国库专项资金统筹石料、木材与营造大匠，加快国内大工程与奇观兴建进度。"
 oe_v49_wdr_act_charter_fund_tt:0 "全面提升全国建造效率，并推动全球奇观竞速进程。"
 oe_v49_wdr_act_expedite_tier2:0 "督建二阶宏构扩建工程"
 oe_v49_wdr_act_expedite_tier2_desc:0 "以丰沛国库直接督建本国一座已奠基的一阶大工程，将其立即扩建升格为二阶宏构地标并提升当地繁荣与发展度。"
 oe_v49_wdr_act_expedite_tier2_tt:0 "将本国一座一阶奠基大工程直接扩建至二阶宏构（建筑等级+1，并提升当地繁荣度与发展度）。"
 oe_v49_wdr_act_crown_tier3:0 "加冕三阶传世奇观"
 oe_v49_wdr_act_crown_tier3_desc:0 "倾国库盈余与天下巧匠雕琢一座二阶宏构工程，为其加冕三阶传世奇观桂冠，铸就千古不朽之辉煌地标。"
 oe_v49_wdr_act_crown_tier3_tt:0 "将本国一座二阶宏构直接加冕升格为三阶传世奇观（建筑等级+1，威望+15，并推动全球传世奇观计数）。"
 oe_v49_wdr_act_world_exposition:0 "于奇观举办万国博览会"
 oe_v49_wdr_act_world_exposition_desc:0 "在已落成的传世大工程盛大举办万国博览会，广邀四海使节、商帮与巧匠共襄盛举，提升海陆商贸与文化影响。"
 oe_v49_wdr_act_world_exposition_tt:0 "提升海陆贸易效率与文化影响力，并开启万国奇观博览盛典。"
 oe_v49_wdr_act_foreign_architects:0 "礼聘海外大建筑师团"
 oe_v49_wdr_act_foreign_architects_desc:0 "重金礼聘域外穹顶建筑师、测绘专家与水利大师入朝授艺，全面提振全国研究速度与营造水平。"
 oe_v49_wdr_act_foreign_architects_tt:0 "提升全国研究速度、建筑建造效率与文化传统。"
 oe_v49_wdr_act_canal_surplus:0 "拨付国库盈余兴修运河水工"
 oe_v49_wdr_act_canal_surplus_desc:0 "将丰沛国库盈余专项投入运河船闸、航道疏浚与港埠水工建设，带动都城繁荣并提振全国生产与海贸。"
 oe_v49_wdr_act_canal_surplus_tt:0 "提升海运贸易、全国生产效率与月度繁荣度，并立即提高都城繁荣度。"
 oe_v49_wdr_act_masonry_guilds:0 "统一度量衡与皇家石作行会"
 oe_v49_wdr_act_masonry_guilds_desc:0 "颁行统一的皇家石料尺度、砖瓦规格与木作法式，整顿石作行会，提升全国制造与原材产出效率。"
 oe_v49_wdr_act_masonry_guilds_tt:0 "提升全国生产效率、原材产出与建筑建造效率。"
 oe_v49_wdr_act_architectural_golden_age:0 "宣告建筑黄金时代"
 oe_v49_wdr_act_architectural_golden_age_desc:0 "既已建成多座世界大工程或加冕三阶传世奇观，乃昭告天下开启建筑黄金时代，享誉四海并提振声望、科研与外交。"
 oe_v49_wdr_act_architectural_golden_age_tt:0 "需拥有至少 2 座大工程或 1 座三阶传世奇观。宣告建筑黄金时代并获得丰厚声望、研究与外交加成。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_imperial_fund:0 "帝国大工程专项特许基金"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_imperial_fund:0 "国库专款统筹采石场、林场与石作大匠奔赴巨型工程工地，大幅加快营造进度，但短期内略微挤占常规财税。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_tier2_expansion:0 "二阶宏构扩建督造令"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_tier2_expansion:0 "朝廷增派营造官督建拱穹、船闸与柱廊，将奠基大工程跃升为二阶宏构地标，但也加重了民间工役负担。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_eternal_wonder_crown:0 "三阶传世奇观加冕荣光"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_eternal_wonder_crown:0 "加冕三阶传世奇观令帝国跻身古今营造巅峰，四海使节无不敬仰，唯岁修养护费用仍须国库常年担承。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_world_exposition:0 "万国奇观博览盛典主办国"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_world_exposition:0 "各国商贾、使节与匠师云集本国奇观盛会，极大带动海陆商贸与文化辐射，却也令都邑物价略有上扬。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_foreign_architects:0 "海外大建筑师与工匠礼聘团"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_foreign_architects:0 "重金礼聘的海外几何学家、穹顶匠师与水利专家为全国注入前沿营造技艺，但略微引起本土勋贵门阀的不满。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_canal_surplus:0 "运河水工盈余兴修令"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_canal_surplus:0 "将国库盈余专项投入运河船闸、码头与支渠疏浚，全面提升海运与手工业效率，但商绅行会的话语权亦随之上升。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_masonry_guilds:0 "皇家统一度量衡与石作行会"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_masonry_guilds:0 "推行统一的石料规格、木作尺度与工匠考成章程，显著提升全国制造与营建效率，但触动了旧日市镇行会的私利。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_architectural_golden_age:0 "帝国建筑黄金时代诏书"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_architectural_golden_age:0 "坐拥多座传世奇观的帝国登临世界声望与学术之巅，百工竞艳、万邦来仪，但持续的皇家赞助亦耗费不菲岁入。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_maritime_wonder_boom:0 "大工程跨洋商路繁荣"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_maritime_wonder_boom:0 "新落成的运河、航标与船坞令远洋周转大为提速、商运勃兴，但也增加了沿线护航水师的常年维护成本。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_scholarly_wonder_beacon:0 "奇观时代格物与营造灯塔"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_scholarly_wonder_beacon:0 "依托大工程设立的天文台、藏书楼与营造讲院极大推动格物学术与精工技艺，但官学俸禄亦略增财政压力。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_imperial_wonder_splendor:0 "传世奇观帝国盛景"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_imperial_wonder_splendor:0 "巍峨穹顶、宫苑与圣坛向万邦宣示帝国气象，外交声誉与宫廷权威俱增，但也助长了些许内廷奢华之风。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_eternal_wonders_legacy:0 "传世奇观竞速不朽遗产"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_eternal_wonders_legacy:0 "历代竞建传世奇观留下的水利、营造与礼乐遗产泽被后世，令帝国长享声望与商工之利，唯须持续投入岁修维护。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_grand_monuments_legacy:0 "宏伟纪念碑时代余韵"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_grand_monuments_legacy:0 "遍布各大洲的宏构地标将商路与文化传统紧紧相连，令贸易与营造技艺长盛不衰，但也伴随一定养护开支。"
 STATIC_MODIFIER_NAME_oe_v49_wdr_mod_modern_engineering_legacy:0 "近代土木工程黎明"
 STATIC_MODIFIER_DESC_oe_v49_wdr_mod_modern_engineering_legacy:0 "数百年宏大工程实践沉淀为近代测绘与公共营造体系，助推全国建造与生产效率，却令传统手工业行会日渐式微。"
 oe_v49_wdr.1.title:0 "苏伊士地峡双海贯通"
 oe_v49_wdr.1.desc:0 "破晓时分，苏伊士地峡最后一道围堰在青铜水闸轰鸣声中开启，地中海的蔚蓝潮水奔涌南下，与红海暖流汇于一渠。从亚历山大港到印度洋诸埠的远洋船长无不欢呼东西海路缩短逾万里，总督府与皇室水工随即呈上石砌船坞、海关税所与双海灯塔的宏图，请旨定夺运河章程。"
 oe_v49_wdr.1.a:0 "颁行万国通航税则，广纳四海商船"
 oe_v49_wdr.1.b:0 "重筑运河要塞与水师闸口，控扼海权"
 oe_v49_wdr.1.c:0 "以运河关税兴修沿渠驿镇与引水绿洲"
 oe_v49_wdr.2.title:0 "巴拿马地峡两洋合流"
 oe_v49_wdr.2.desc:0 "历经数年劈山凿石、排涝筑坝与瘴疠考验，数以万计的测绘师、水利工程师与石匠终于在巴拿马地峡群山之间筑起宏伟的梯级船闸，将大西洋加勒比海与太平洋碧波连成一线。当首艘满载银锭、可可与东方丝绸的三桅远洋大船缓缓驶出上层闸室，横跨欧洲、美洲与亚洲的万里海路自此改写，商埠督办与海商行会恭请朝廷钦定地峡总署永制。"
 oe_v49_wdr.2.a:0 "设立两洋转运清算总行，汇聚环球商货"
 oe_v49_wdr.2.b:0 "沿渠广设排涝医馆与检疫新埠，惠泽工民"
 oe_v49_wdr.2.c:0 "确立皇家舰队优先通行权，震慑两洋海疆"
 oe_v49_wdr.3.title:0 "科林斯千年石峡功成"
 oe_v49_wdr.3.desc:0 "自古希腊僭主佩里安德与罗马诸帝屡兴屡辍的科林斯地峡，如今终于被百尺峭壁般的明黄石灰岩渠槽笔直劈开。清晨自爱奥尼亚海与亚得里亚海入渠的粮船、商舶与快舰，午后便已扬帆于萨罗尼克湾与爱琴海碧波之上，免去绕行马里亚险角的倾覆之虞。东西两港商民欢声雷动，希腊半岛的古典海运十字路口由此气象一新。"
 oe_v49_wdr.3.a:0 "复办地峡万商大会，免税三载以聚财货"
 oe_v49_wdr.3.b:0 "于运河绝壁镌刻纪功铭碑，传颂后世"
 oe_v49_wdr.3.c:0 "于东西渠口并建修船坞台，整饬水师"
 oe_v49_wdr.4.title:0 "扬州漕运总闸万艘竞渡"
 oe_v49_wdr.4.desc:0 "扬州清口新成之复式花岗岩船闸、减水石坝与蓄清刷黄涵洞运转如仪，江淮南北大运河自此水势平稳、岁无淤阻。绵延数十里的漕粮大船、淮南盐舶与江南丝瓷画舫昼夜穿梭其间，舳舻蔽江、帆影连云，尽显水利治国之大成。河道总督与两淮盐运司联名上疏，奏请朝廷厘定新闸岁修经费、常平漕仓与商税永制。"
 oe_v49_wdr.4.a:0 "广建沿河常平漕仓，稳固天下粮储"
 oe_v49_wdr.4.b:0 "开放副闸予盐商丝帮通行，岁增课银"
 oe_v49_wdr.4.c:0 "敕编河工闸法图谱，颁行天下州府"
 oe_v49_wdr.5.title:0 "新大陆圣索菲亚金穹凌空"
 oe_v49_wdr.5.desc:0 "四十扇高窗环绕巍峨帆拱巨穹，宛若凌空悬浮的金色光环，将新大陆采掘的深紫斑岩巨柱、汉白玉祭坛与璀璨金箔镶嵌画映照得宛如天国降临。当礼赞圣咏在穹顶之下回荡不绝，远涉重洋而来的史官、建筑师与学者纷纷记下此一盛事：博斯普鲁斯的千年营造匠心已在西半球重燃不熄圣火，请旨定夺圣殿礼仪与书院章程。"
 oe_v49_wdr.5.a:0 "召开新大陆大公盛典，广布文教德威"
 oe_v49_wdr.5.b:0 "附设跨洋镶嵌画与营造学院，培育百工"
 oe_v49_wdr.5.c:0 "于圣殿前庭广设济贫旅舍，收揽四方归心"
 oe_v49_wdr.6.title:0 "西伯利亚大驿道贯通林海"
 oe_v49_wdr.6.desc:0 "穿越无垠针叶林海、湍急寒河与冰封沼泽，由坚实木桥、暖炕官驿、兵站与换马大院串联的大驿道自托博尔斯克石堡向东西万里铺展。昔日需经年跋涉方能抵达的北亚绝域，如今皇家急递数周即可通达；黑貂毛皮商队、乌拉尔精铁与东方砖茶沿驿络绎不绝，北疆总督谨呈沿线镇戍、屯垦与通商三策。"
 oe_v49_wdr.6.a:0 "派驻哥萨克护驿轻骑，保障毛皮茶道畅通"
 oe_v49_wdr.6.b:0 "沿驿迁民筑屯，兴办伐木冶铁新镇"
 oe_v49_wdr.6.c:0 "颁行万里驿传律例，强化边疆政令通达"
 oe_v49_wdr.7.title:0 "水晶万国博览殿落成耀世"
 oe_v49_wdr.7.desc:0 "数千块晶莹剔透的平板玻璃精密镶嵌于恢宏铸铁肋拱之间，连苍翠古榆亦被完整笼罩于通透明亮的巨型穹顶之下。来自欧亚美非各国的使节、机械巧匠、天文仪师与巨商云集泰晤士河畔，争相观摩水力机械、精密钟表、织机模型与环球物产陈列，博览会委员会恭请王室颁布永久展馆、科技大奖与商社招商章程。"
 oe_v49_wdr.7.a:0 "设立皇家机械与工艺大奖，广募天下巧匠"
 oe_v49_wdr.7.b:0 "向各国商社招商设馆，广开博览门票财源"
 oe_v49_wdr.7.c:0 "于玻璃中殿设万国御宴，彰显大国气度"
 oe_v49_wdr.8.title:0 "巴格达丝路总驿万驼云集"
 oe_v49_wdr.8.desc:0 "底格里斯河畔新筑的青蓝琉璃拱廊、引水凉庭与砖穹商驿大院之中，操持波斯语、阿拉伯语、希腊语、拉丁语与汉语的商帮比肩交易，藏红花、大马士革锦缎、东方瓷器、香料与汇票在成色公证司前昼夜流转。古老的和平之城重现丝绸之路总枢气象，大巴扎各行会与商旅总管敬呈通商护路、译书讲堂与灌渠修缮方略。"
 oe_v49_wdr.8.a:0 "颁行丝路商旅护票与通兑汇契，繁荣远贸"
 oe_v49_wdr.8.b:0 "于商驿侧翼复设译书讲堂，广收东西典籍"
 oe_v49_wdr.8.c:0 "以商税重修两河灌渠，惠及城郊百业"
 oe_v49_wdr.9.title:0 "特诺奇蒂特兰太阳广场辉映湖心"
 oe_v49_wdr.9.desc:0 "春分破晓时分，初升的朝阳沿着笔直石堤与观测直道直射特诺奇蒂特兰太阳广场中心，映亮雄伟的玄武岩浮雕巨阶、祭司历法碑刻与湖面千顷沃翠浮田。来自高原城邦、热带雨林与两洋沿岸的使节、金匠与商队齐聚湖心广场，无不叹服此城水利、历算与宏伟城邦营造的惊世伟力，大议事厅随即奏请庆典与治湖良策。"
 oe_v49_wdr.9.a:0 "扩筑湖心堤道与高产浮田，丰实都城粮仓"
 oe_v49_wdr.9.b:0 "举行全境太阳历盛典，扬威四方属邦"
 oe_v49_wdr.9.c:0 "开放广场大市予黑曜石与金匠行会，广增课税"
 oe_v49_wdr.10.title:0 "撒马尔罕新修星表告成"
 oe_v49_wdr.10.desc:0 "深嵌山岩的四十米大理石子午巨弧精准捕捉每一瞬日影与星辰推移，撒马尔罕大天文台与经学院众星官历时数载编纂的新星表终告圆满。精致抄本甫一问世，便沿丝路驼队传遍开罗、君士坦丁堡、德里与燕京诸国宫廷，使河中名城再度成为天下历算、几何与格物之冠，首席天文官恭请定夺星表颁行之策。"
 oe_v49_wdr.10.a:0 "誊印星表颁赐各省书院，兴隆算学格物"
 oe_v49_wdr.10.b:0 "将星表转绘为远洋航海星图，惠及商舶"
 oe_v49_wdr.10.c:0 "扩饰雷吉斯坦广场碧琉璃宫阙，增辉帝都"
 oe_v49_wdr.11.title:0 "景德镇御窑千烟昼夜不绝"
 oe_v49_wdr.11.desc:0 "昌江两岸夜色如昼，数百座依山势起伏而筑的巨型龙窑烈焰熊熊，出窑之青花、釉里红、粉彩与甜白御瓷温润如玉、击之如磬。四海使臣争求御窑贡器以充国宝，满载瓷箱的商船经鄱阳湖源源出江入海，行销长崎、里斯本、阿姆斯特丹与伊斯坦布尔。督陶官谨具奏折，请旨定夺御窑、民窑与精炼工艺分工章程。"
 oe_v49_wdr.11.a:0 "特许官搭民烧外销瓷帮，广揽四海白银"
 oe_v49_wdr.11.b:0 "精选绝品青花御瓷充作邦交国礼，名扬万邦"
 oe_v49_wdr.11.c:0 "拨银改良高岭土淘洗与窑温工艺，精进百工"
 oe_v49_wdr.12.title:0 "珠江十三行与巨坞千帆云集"
 oe_v49_wdr.12.desc:0 "珠江入海口新落成的花岗岩干船坞内，铁力木巨型龙骨巍然矗立，百余匠作正依水密隔舱古法赶造远洋巨舶；堤岸十三行商馆与公行库房灯火通明，武夷茶箱、湖州生丝、药材与番银昼夜交割。乘季风而来的各国海船鳞次栉比，粤海关监督与船政大臣联袂奏请朝廷确立南海互市与远洋造船永制。"
 oe_v49_wdr.12.a:0 "扩建十三行海贸行会与银号，兴旺远洋互市"
 oe_v49_wdr.12.b:0 "依水密隔舱古法增造远洋战船，巡弋南海"
 oe_v49_wdr.12.c:0 "疏浚虎门航道并修筑海关炮台，固本培元"
 oe_v49_wdr.13.title:0 "安第斯云端皇家驿道贯通群峰"
 oe_v49_wdr.13.desc:0 "在终年云雾缭绕、雪峰入云的安第斯火山绝壁之间，平整石阶、巨型编索吊桥与沿途补给石仓将基多高原总坛与银铜矿场、太平洋良港紧密相连。昔日险峻难越的深峡天堑如今化作坦途，急递驿使、驼马商队与巡按官吏昼夜往来，纵贯群峰的政令、粮秣与矿产由此畅通无阻，总督府敬呈高原驿道经略三策。"
 oe_v49_wdr.13.a:0 "充实云端驿仓粮秣，稳固群山州县"
 oe_v49_wdr.13.b:0 "整编高原银铜官运商队，充盈国库"
 oe_v49_wdr.13.c:0 "于基多总坛立赤道测天石柱，铭刻盛世"
 oe_v49_wdr.14.title:0 "亚历山大法罗斯圣火重明"
 oe_v49_wdr.14.desc:0 "阔别数百年之后，远在地中海三十海里外夜航的水手终于再度望见法罗斯巨塔之巅的耀目火光。三层白石巨塔巍然耸立于大港入口，塔顶抛光青铜聚光镜在夜幕下划出璀璨光柱，指引各国商舶避开暗礁安稳入港。古老世界奇观以崭新光学与石工技艺重临尼罗河口，港务总管恭请朝廷颁行引航与讲院章程。"
 oe_v49_wdr.14.a:0 "组建亚历山大引航与灯塔公会，广收港税"
 oe_v49_wdr.14.b:0 "于塔基设立光学与海图讲院，精研航海术"
 oe_v49_wdr.14.c:0 "加固东西两港防波石堤与海防要塞"
 oe_v49_wdr.15.title:0 "凡尔赛镜厅与太阳御苑落成"
 oe_v49_wdr.15.desc:0 "三百余面威尼斯精工大镜映照出璀璨水晶枝形吊灯、彩绘天顶与直贯西天际线的阶梯喷泉运河，外邦使节与各省权贵无不沉醉于凡尔赛太阳宫苑的恢宏仪典之中。全欧乐师、画匠、织毯大师与皇家园林师纷至沓来，使此地跃居礼乐法度与艺术风尚之冠，内廷总监与礼部恭请定夺宫苑礼制与御厂大纲。"
 oe_v49_wdr.15.a:0 "诏令各地勋贵入朝侍奉，以礼仪凝聚王权"
 oe_v49_wdr.15.b:0 "敕设皇家挂毯、制镜与工艺御厂，行销欧洲"
 oe_v49_wdr.15.c:0 "于宫苑侧殿增设皇家建筑与科学院"
 oe_v49_wdr.16.title:0 "维也纳帝国歌剧与科学院首演盛典"
 oe_v49_wdr.16.desc:0 "浑厚雄壮的交响乐章在金碧辉煌的声学穹顶下回荡不息，多瑙河畔新落成的帝国歌剧院与自然科学院于同日盛大启幕。来自中欧、意大利与地中海沿岸的作曲名家、法学博士、医学泰斗与各邦使节济济一堂，令维也纳不仅为帝国枢机，更跃居天下礼乐与启蒙学术之冠，宫廷院务官谨献文化赞助三策。"
 oe_v49_wdr.16.a:0 "设立皇家乐团与音乐学院永久教席，名播四海"
 oe_v49_wdr.16.b:0 "拨款资助自然哲学与临床医学研究，广开民智"
 oe_v49_wdr.16.c:0 "每年举办多瑙河外交乐季，广结各国善缘"
 oe_v49_wdr.17.title:0 "阿姆斯特丹世界交易所鸣钟开市"
 oe_v49_wdr.17.desc:0 "正午铜钟在阿姆斯特尔河拱廊庭院上空清越敲响，来自尼德兰、汉萨诸城、威尼斯与远洋东印度公司的数百名经纪人瞬间沸腾，香料股契、波罗的海谷物期货、海运保险单与国家公债在此瞬息成交。每日印行的多语种行情公报数日内便传遍欧洲各大商埠，市政议会与总行董事恭请钦定金融清算与审计永制。"
 oe_v49_wdr.17.a:0 "特许海运保险与股份清算所，大兴远洋金融"
 oe_v49_wdr.17.b:0 "设立铸币准备金与严厉审计，防杜投机风潮"
 oe_v49_wdr.17.c:0 "扩筑沿河货栈与金融印书坊，充实都市根基"
 oe_v49_wdr.18.title:0 "威尼斯大兵工厂流水船台告成"
 oe_v49_wdr.18.desc:0 "穿过雄狮石雕拱卫的兵工厂双塔水门，一艘艘战舰与巨型商船沿着装配水渠依次通过有顶木工船台、百丈制缆长廊与青铜铸炮坊，标准化龙骨与帆具严丝合缝。来访的各国海军统帅无不惊叹于这套如精密钟表般运转的流水造舰奇观，能够于朝暮之间武装整支分舰队，船政局敬呈新船台编配与海工学院方略。"
 oe_v49_wdr.18.a:0 "增开标准化商船流水线，执掌地中海航运"
 oe_v49_wdr.18.b:0 "专筑重型战列舰与护航炮艇，巩固海权"
 oe_v49_wdr.18.c:0 "于兵工厂内设立造船工程与水力学讲堂"
 oe_v49_wdr.19.title:0 "里斯本印度之家海图馆落成"
 oe_v49_wdr.19.desc:0 "特茹河口千帆林立，满载丁香、胡椒、肉桂与东方瓷器的远洋巨舶正于白石码头卸货入库；俯瞰大西洋港湾的里斯本印度之家航海馆内，绘满季风、洋流、星象与新大陆岸线的皇家秘密总海图缓缓展开。领航大师、铜制星盘工匠与香料总管齐聚议事厅，恭请朝廷颁行跨洋通航、海图保密与关税大策。"
 oe_v49_wdr.19.a:0 "于特茹河码头统办香料公拍，广收巨额关税"
 oe_v49_wdr.19.b:0 "广招远洋领航学员，精研星盘与经纬度测算"
 oe_v49_wdr.19.c:0 "扩筑河口海防堡垒与防潮香料大库"
 oe_v49_wdr.20.title:0 "涅瓦河海军部鎏金尖塔凌霄"
 oe_v49_wdr.20.desc:0 "塔顶鎏金帆船风标在波罗的海凛冽长风中熠熠生辉，绵延数里的花岗岩河堤与防冰船台自帝国海军部中轴向涅瓦河口壮阔展开。来自北方针叶林海的优质松木、亚麻绳索与乌拉尔精铸舰炮源源运抵船坞，宣告一座崭新的北方海上强权门户已于冰海之滨巍然立定，海军总长谨呈扩舰、办学与治城三策。"
 oe_v49_wdr.20.a:0 "扩建波罗的海舰队与防冰船坞，威镇北洋"
 oe_v49_wdr.20.b:0 "附设帝国海军士官与水文测绘学院"
 oe_v49_wdr.20.c:0 "排涝筑堤、兴建花岗岩新城区以繁荣河口"
 oe_v49_wdr.21.title:0 "德里红堡朱垣玉殿盛大启门"
 oe_v49_wdr.21.desc:0 "巍峨八角朱红砂岩城墙高耸于亚穆纳河沃野之畔，红堡之内白玉朝殿以青金石、玛瑙、琥珀与翠玉镶嵌成繁花藻井，清冽御渠穿过大理石凉亭汩汩流淌。诸省总督、藩王公侯与西域使臣鱼贯步入雄伟的拉合尔巨门，无不折服于帝国朝殿的赫赫威仪，大宰相随即奏请召开全境朝觐盛典与御坊营建章程。"
 oe_v49_wdr.21.a:0 "于红堡大殿召开全境王公朝觐大典，凝聚一统"
 oe_v49_wdr.21.b:0 "于堡内设御用织锦与玉雕官坊，繁荣百工"
 oe_v49_wdr.21.c:0 "加筑外郭炮台与帝国军械大库，固若金汤"
 oe_v49_wdr.22.title:0 "京都金阁倒映镜湖秋色"
 oe_v49_wdr.22.desc:0 "三层贴满纯金箔的桧木重檐在红枫翠松与镜湖碧波间熠熠生辉，屋脊金凤展翅欲飞，茶道宗师、和歌名家、画师与漆艺巨匠雅集于上层禅廊。京都金阁万世禅苑的空灵气象与雅致庭园远播东亚诸海，令列邦使节赞叹不已，公卿大臣与寺社奉行谨献艺文扶持、雕版藏经与和平会盟三策。"
 oe_v49_wdr.22.a:0 "广扶茶道、漆艺与风雅诗社，陶冶天下文风"
 oe_v49_wdr.22.b:0 "兴办禅院雕版印书坊与典籍藏经阁"
 oe_v49_wdr.22.c:0 "借金阁茶会调停诸藩纷争，巩固太平"
 oe_v49_wdr.23.title:0 "开罗爱资哈尔万卷书楼落成"
 oe_v49_wdr.23.desc:0 "尼罗河清风拂过精雕大理石柱廊与宁静庭院，数百位抄经大师与博学者将法学、光学、天文历算与临床医典分门编目，数万卷羊皮纸与珍本典籍整齐入藏爱资哈尔大藏书楼。来自安达卢斯、廷巴克图、小亚细亚与印度的求学之士负笈云集开罗，大藏书楼长老恭请朝廷钦定游学奖助、书市与编律永制。"
 oe_v49_wdr.23.a:0 "设立三洲游学奖学金，广纳天下鸿儒"
 oe_v49_wdr.23.b:0 "兴办尼罗河造纸与装帧书市，繁荣文贸"
 oe_v49_wdr.23.c:0 "委任书楼大儒编纂通律，提升州郡治绩"
 oe_v49_wdr.24.title:0 "廷巴克图桑科雷大学城书香满漠"
 oe_v49_wdr.24.desc:0 "在廷巴克图熙攘繁华的土砖拱门与商旅广场上，跨越撒哈拉大漠运来的成块岩盐与炽金砂金，其市价竟犹不及一部精工抄写的天文历法、律典与诗集。新近扩建的桑科雷大学城高耸金字塔形宣礼塔，聚徒数千并广藏手抄孤本，令尼日尔河弯跃居西非与北非商旅及学者心驰神往的智慧灯塔。"
 oe_v49_wdr.24.a:0 "扩建皇家抄书院与典籍窖库，广传学术"
 oe_v49_wdr.24.b:0 "将撒哈拉金盐商队与书市合流，大兴城邦财源"
 oe_v49_wdr.24.c:0 "疏浚尼日尔河灌溉支渠，惠及城周绿洲"
 oe_v49_wdr.25.title:0 "阿克苏姆巨岩圣殿巍立高原"
 oe_v49_wdr.25.desc:0 "直接自埃塞俄比亚高原整块玄武岩山体雕凿而成的巍峨圣堂，与高耸入云的花岗岩巨型方尖碑、石雕拱廊交相辉映，宛如天工与人力合铸之不朽丰碑。手持乳香与金幡的朝圣长队沿着高原石阶拾级而上，庄严诵经声回荡山谷，古老阿克苏姆圣都的威名再度远播红海与印度洋两岸，大祭司与总督谨献三策。"
 oe_v49_wdr.25.a:0 "重定高原加冕圣坛古礼，彰显皇统威严"
 oe_v49_wdr.25.b:0 "整饬通往红海的乳香与咖啡商道，充盈国用"
 oe_v49_wdr.25.c:0 "于岩崖开凿蓄水石池与山地碉堡，固守高原"
 oe_v49_wdr.26.title:0 "好望角巨型航标照彻两洋风暴"
 oe_v49_wdr.26.desc:0 "昔日狂涛怒浪与浓雾令无数东印度商船折戟沉沙的风暴之角，如今在绵延数里的巨型花岗岩防波堤与悬崖抗风灯塔庇护下化作宁静避风良港。甘冽淡水补给、抗败血柑橘果园与大型修船滑道一应俱全，使好望角跃升为沟通大西洋与印度洋航路的黄金支点，港督与远洋商会联名请旨确立南洋总港永制。"
 oe_v49_wdr.26.a:0 "将好望角辟为万国远洋补给修船总港，广收港费"
 oe_v49_wdr.26.b:0 "于桌山后方广辟果园麦田，保障舰队给养"
 oe_v49_wdr.26.c:0 "常驻南大洋护航分舰队，控扼两洋咽喉"
 oe_v49_wdr.27.title:0 "巨石与黄金的竞逐"
 oe_v49_wdr.27.desc:0 "自列强都城归来的使节带回一卷卷铜版画图册——竞争对手正大兴土木，以高耸穹顶、跨海大运河与皇家学院企图盖过我国奇观风头。朝堂与工部上下热议不休：是倾国库之力加速三阶传世奇观营建，还是重金挖角他国建筑泰斗，抑或以建筑盛名化作纵横捭阖的外交资本？"
 oe_v49_wdr.27.a:0 "加拨国库专款，以更恢宏之奇观压倒列强"
 oe_v49_wdr.27.b:0 "重金礼聘列强测绘与水工大师，兼容并蓄"
 oe_v49_wdr.27.c:0 "对奢华建材征课专税，务实充盈国库"
 oe_v49_wdr.28.title:0 "奇观盛景下的万国博览盛典"
 oe_v49_wdr.28.desc:0 "来自欧亚非美五大洲的使团、博物学家与跨洋商社络绎登岸，携来精密浑天仪、名窑青花瓷、水力机巧、云锦华绸与各国建筑缩尺模型，齐聚我国奇观盛景之下共襄万国博览盛典。列国君使与巨商行会流连于宏伟殿宇、运河石闸与璀璨展馆之间，无不叹服本国工巧、商贸与人文之鼎盛，筹委会恭请钦定收官宏策。"
 oe_v49_wdr.28.a:0 "设立常设万国商贸展馆，广拓环球航路"
 oe_v49_wdr.28.b:0 "趁势创办万国艺术与工程研究院，广聚贤才"
 oe_v49_wdr.28.c:0 "大赦与民同乐，并修缮都城街衢广场"
