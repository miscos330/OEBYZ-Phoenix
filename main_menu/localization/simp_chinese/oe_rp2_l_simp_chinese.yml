 oe_yaik_cossack: "雅伊克哥萨克"
 oe_terek_cossack: "捷列克哥萨克"
 oe_rp2_b_sophia_alliance: "双头鹰皇室联姻之盟"
 oe_rp2_b_sophia_refuge: "庇护紫衣遗裔之谊"
 oe_rp2_b_cossack_compact: "边疆哥萨克盟誓"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_grand_alliance: "双头鹰皇室同盟"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_grand_alliance: "与仍据君士坦丁堡的罗马皇帝缔结紫衣联姻，双鹰共守正教世界，黑海与北方宫廷礼制交融。"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_sovereign_trade: "黑海—北方对等皇室商约"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_sovereign_trade: "既结皇室姻亲又保北方大公对等尊荣，开辟通往君堡的毛皮与丝绸商道。"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_purple_refuge: "紫衣避难所与希腊学林"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_purple_refuge: "收容流亡的巴列奥略宫廷与希腊抄本大师，北方宫廷的典籍、礼仪与声望焕然一新。"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_regalia_claim: "紫衣嫁妆与帝冠法权"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_regalia_claim: "受赠巴列奥略流亡朝廷的御玺与礼仪典籍，奠定北方君主继承罗马帝统的法理基石。"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_palaiologos_mantle: "巴列奥略衣钵与克里姆林营建"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_palaiologos_mantle: "随佐伊—索菲亚北上的意大利匠师与希腊典籍重塑红砖克里姆林，双头鹰国徽从此高悬。"
 STATIC_MODIFIER_NAME_oe_rp2_sophia_rus_custom: "固守古罗斯旧制兼纳流民"
 STATIC_MODIFIER_DESC_oe_rp2_sophia_rus_custom: "礼遇南来学者与工匠却不令外来礼仪凌驾本土王公旧制，朝野安靖。"
 STATIC_MODIFIER_NAME_oe_rp2_p1_sudebnik_1497: "1497年全罗斯法典与衙门体系"
 STATIC_MODIFIER_DESC_oe_rp2_p1_sudebnik_1497: "统一全国司法审判、设立中央专职衙门，王权对广袤诸省的税赋与控制力大幅提升。"
 STATIC_MODIFIER_NAME_oe_rp2_p1_boyar_duma_law: "法典兼顾波雅尔杜马合议"
 STATIC_MODIFIER_DESC_oe_rp2_p1_boyar_duma_law: "由大公与波雅尔杜马共颁律法，行政改革虽缓却少内耗。"
 STATIC_MODIFIER_NAME_oe_rp2_p1_tsar_sobor: "全罗斯沙皇与1549缙绅会议"
 STATIC_MODIFIER_DESC_oe_rp2_p1_tsar_sobor: "头戴莫诺马赫王冠加冕全罗斯沙皇，并召集诸阶层缙绅会议共商军国大计。"
 STATIC_MODIFIER_NAME_oe_rp2_p1_tsar_streltsy: "沙皇铁冠与射击军近卫"
 STATIC_MODIFIER_DESC_oe_rp2_p1_tsar_streltsy: "以常备火铳射击军拱卫沙皇独断威权，战阵火力与攻城威势冠绝东欧。"
 STATIC_MODIFIER_NAME_oe_rp2_p1_oprichnina: "特辖制铁腕整肃"
 STATIC_MODIFIER_DESC_oe_rp2_p1_oprichnina: "划定直属沙皇的特辖领地并以黑衣铁骑清洗旧贵族，王权空前集中却令阶层人心惶惶。"
 STATIC_MODIFIER_NAME_oe_rp2_p1_zemshchina_sobor: "缙绅会议与全境共治"
 STATIC_MODIFIER_DESC_oe_rp2_p1_zemshchina_sobor: "摒弃血腥特辖清洗，以常设缙绅会议平衡沙皇王权、教会与地方服役贵族。"
 STATIC_MODIFIER_NAME_oe_rp2_p2_northern_diet: "北方大商业议会与波罗的海宪章"
 STATIC_MODIFIER_DESC_oe_rp2_p2_northern_diet: "诺夫哥罗德与北方自由商镇共建跨波罗的海—白海商业议会，打破汉萨垄断并主导毛皮贸易。"
 STATIC_MODIFIER_NAME_oe_rp2_p2_pomor_syndicate: "波莫尔北冰洋与乌拉尔毛皮商团"
 STATIC_MODIFIER_DESC_oe_rp2_p2_pomor_syndicate: "以股份制商团开发白海与乌拉尔商路，源源不断的黑貂皮与盐税充盈共和金库。"
 STATIC_MODIFIER_NAME_oe_rp2_p3_federal_hetmanate: "联邦缙绅大议会与哥萨克酋长自治"
 STATIC_MODIFIER_DESC_oe_rp2_p3_federal_hetmanate: "正式承认第聂伯哥萨克酋长领的联邦自治地位，换取无坚不摧的草原铁骑与诸邦向心。"
 STATIC_MODIFIER_NAME_oe_rp2_p3_bicameral_sobor: "东斯拉夫双院诸公大议会"
 STATIC_MODIFIER_DESC_oe_rp2_p3_bicameral_sobor: "诸公上院与市民/骑兵下院协理军政，开创兼容并蓄的古罗斯联邦宪制。"
 STATIC_MODIFIER_NAME_oe_rp2_abatis_line: "草原鹿砦防线（扎谢奇纳亚防线）"
 STATIC_MODIFIER_DESC_oe_rp2_abatis_line: "自图拉延绵至沃罗涅日与别尔哥罗德的伐木障碍、烽燧与堡垒链，有效扼制草原游骑北犯。"
 STATIC_MODIFIER_NAME_oe_rp2_volga_vanguard: "伏尔加河东进前锋"
 STATIC_MODIFIER_DESC_oe_rp2_volga_vanguard: "依托河船炮队与步骑协同直指喀山与阿斯特拉罕，打通通向里海与乌拉尔的大动脉。"
 STATIC_MODIFIER_NAME_oe_rp2_cossack_free_charter: "六大边疆哥萨克自由军团宪章"
 STATIC_MODIFIER_DESC_oe_rp2_cossack_free_charter: "赐予扎波罗热、顿河、雅伊克、捷列克、西伯利亚与库班哥萨克广泛自治，换取低廉精锐的边疆铁骑。"
 STATIC_MODIFIER_NAME_oe_rp2_cossack_crown_hosts: "督军统辖边防哥萨克营"
 STATIC_MODIFIER_DESC_oe_rp2_cossack_crown_hosts: "由朝廷督军发饷编练边防哥萨克，军费稍高却严守中央军纪与边疆控制度。"
 STATIC_MODIFIER_NAME_oe_rp2_yermak_siberia: "叶尔马克越岭东进西伯利亚"
 STATIC_MODIFIER_DESC_oe_rp2_yermak_siberia: "斯特罗加诺夫银饷与哥萨克火铳渡过乌拉尔山直抵钦吉图拉与托博尔斯克，开启欧亚北疆大开拓。"
 STATIC_MODIFIER_NAME_oe_rp2_stroganov_patents: "斯特罗加诺夫乌拉尔盐皮特许状"
 STATIC_MODIFIER_DESC_oe_rp2_stroganov_patents: "以边境免税与自建堡垒权激励大商号开发卡马河与乌拉尔矿盐毛皮，稳扎稳打向东推进。"
 STATIC_MODIFIER_NAME_oe_rp2_smuta_compact: "缙绅继承护栏：免于动乱时代"
 STATIC_MODIFIER_DESC_oe_rp2_smuta_compact: "朝野诸阶层立誓恪守继位法统与地方军政秩序，令王国安然渡过十六世纪末的王朝更迭险滩。"
 STATIC_MODIFIER_NAME_oe_rp2_smuta_iron_regency: "铁腕摄政渡劫"
 STATIC_MODIFIER_DESC_oe_rp2_smuta_iron_regency: "以强力枢密与边防重兵压制伪王与派系倾轧，虽损些许声望却保住疆土完整。"
 STATIC_MODIFIER_NAME_oe_rp2_cossack_stanitsa: "哥萨克边疆屯堡（斯塔尼察）"
 STATIC_MODIFIER_DESC_oe_rp2_cossack_stanitsa: "武装哥萨克村镇扼守渡口与草原走廊，提供顽强城防与兵源补充。"
 STATIC_MODIFIER_NAME_oe_rp2_abatis_line_loc: "草原鹿砦要塞线"
 STATIC_MODIFIER_DESC_oe_rp2_abatis_line_loc: "密林鹿砦、土垒与烽火台连成一体，令草原骑兵难以长驱直入。"
 oe_rp2_dec_charter_cossack_host.title: "敕封边疆哥萨克军团"
 oe_rp2_dec_charter_cossack_host.desc: "在扎波罗热、顿河、雅伊克、捷列克、西伯利亚与库班边疆次第敕封哥萨克军团屯堡，在边疆自治与朝廷节制间权衡取舍。"
 oe_rp2_dec_charter_cossack_host.a: "颁授自由自治宪章（轻骑与征召大增，略减王权）"
 oe_rp2_dec_charter_cossack_host.b: "由朝廷督军发饷编练（耗银稳控边疆）"
 oe_rp2_dec_zasechnaya_cherta.title: "构筑草原鹿砦防线（扎谢奇纳亚防线）"
 oe_rp2_dec_zasechnaya_cherta.desc: "沿图拉、沃罗涅日与别尔哥罗德森林草原交界线构筑鹿砦障碍与烽燧堡垒链，抵御草原游骑北犯。"
 oe_rp2_dec_zasechnaya_cherta.a: "拨款伐木筑垒，永固南疆"
 oe_rp2_dec_stroganov_charter.title: "颁授斯特罗加诺夫乌拉尔特许状"
 oe_rp2_dec_stroganov_charter.desc: "以边境盐皮免税与自建堡垒权资助斯特罗加诺夫商号，为翻越乌拉尔山、开拓西伯利亚奠定财力与前哨。"
 oe_rp2_dec_stroganov_charter.a: "赐予乌拉尔盐皮特许状并开屯雅伊克"
 oe_rp2_dec_sobor_guardrail.title: "召开继承缙绅会议（防范动乱时代）"
 oe_rp2_dec_sobor_guardrail.desc: "在十六世纪末提前召集诸阶层与教会代表共誓继位法统，筑起抵御动乱时代（斯穆塔）的制度护栏。"
 oe_rp2_dec_sobor_guardrail.a: "诸阶层共誓继位宪章"
 oe_rp2.1.t: "索菲亚联姻·双鹰同盟之约"
 oe_rp2.1.d: "博斯普鲁斯海峡的紫色皇旗依然高悬于君士坦丁堡城头。罗马皇帝遣使北来，愿将巴列奥略皇女佐伊—索菲亚下嫁罗斯君主，以皇室联姻将复活中的新罗马与挣脱草原枷锁的北方正教强国紧密相连。\n\n满朝波雅尔与主教热议：是以双鹰共治之礼缔结正教大盟，还是在迎娶皇女的同时坚持北方大公的对等商贸与主权？"
 oe_rp2.1.a: "缔结双头鹰皇室大盟，共迎巴列奥略礼制与工匠"
 oe_rp2.1.a.tt: "记录索菲亚联姻为#bold #color_yellow 君堡存续态#!#!，威望#G +15#!，改善与罗马/拜占庭关系，获得[ShowModifier('oe_rp2_sophia_grand_alliance')]，持续#Y 25年#!。"
 oe_rp2.1.b: "礼娶皇女并立对等商约，贯通黑海—罗斯商道"
 oe_rp2.1.b.tt: "记录索菲亚联姻为#bold #color_yellow 君堡存续态#!#!，正统性#G +10#!，改善与罗马/拜占庭关系，获得[ShowModifier('oe_rp2_sophia_sovereign_trade')]，持续#Y 25年#!。"
 oe_rp2.2.t: "索菲亚联姻·紫衣避难所"
 oe_rp2.2.d: "君士坦丁堡虽已易手，巴列奥略皇室却仍在海外偏安孤守。流亡宫廷遣使渡海北上，愿以皇女佐伊—索菲亚缔结姻亲，恳请罗斯君主庇护皇室宗亲、希腊学者与劫余典籍。\n\n这是将北方朝廷化作正教紫衣避难所的良机，亦是接过流亡皇室法统与御玺的关键时刻。"
 oe_rp2.2.a: "广开国门庇护紫衣流亡朝廷，兴办希腊典籍学林"
 oe_rp2.2.a.tt: "记录索菲亚联姻为#bold #color_yellow 皇室流亡态#!#!，威望#G +12#!，改善与流亡罗马/拜占庭关系，获得[ShowModifier('oe_rp2_sophia_purple_refuge')]，持续#Y 25年#!。"
 oe_rp2.2.b: "受赠流亡皇室御玺与礼仪典籍，奠定北方帝冠法理"
 oe_rp2.2.b.tt: "记录索菲亚联姻为#bold #color_yellow 皇室流亡态#!#!，正统性#G +15#!，改善与流亡罗马/拜占庭关系，获得[ShowModifier('oe_rp2_sophia_regalia_claim')]，持续#Y 25年#!。"
 oe_rp2.3.t: "索菲亚联姻·巴列奥略北传"
 oe_rp2.3.d: "千年皇城已陷于异教铁蹄，罗马皇祚在中海消歇。末代皇帝侄女佐伊—索菲亚历经流徙，在使团护送下翻越千山抵达罗斯都城。随行而来的不仅有威严的双头鹰纹章与拜占庭宫廷礼仪，还有精通红砖城垣与穹顶圣堂的意大利建筑大师。\n\n君主面对全罗斯臣民，须决定是否正式接过巴列奥略衣钵、以帝国威仪重塑宫廷。"
 oe_rp2.3.a: "高悬双头鹰国徽，礼聘南来匠师重修红砖克里姆林"
 oe_rp2.3.a.tt: "记录索菲亚联姻为#bold #color_yellow 君堡沦陷态#!#!，威望#G +20#!，正统性#G +10#!，获得[ShowModifier('oe_rp2_sophia_palaiologos_mantle')]，持续#Y 25年#!。"
 oe_rp2.3.b: "礼遇南来学者工匠，仍以古罗斯王公旧制安抚朝野"
 oe_rp2.3.b.tt: "记录索菲亚联姻为#bold #color_yellow 君堡沦陷态#!#!，稳定度#G +8#!，获得[ShowModifier('oe_rp2_sophia_rus_custom')]，持续#Y 25年#!。"
 oe_rp2.4.t: "伊凡《法典》与中央衙门"
 oe_rp2.4.d: "随着东北罗斯诸公国次第归并，各地司法惯例与税册杂乱不一的弊端日益凸显。廷臣拟就一部覆盖全境的统一《法典》（苏杰布尼克），划定圣乔治节农人迁徙规矩、厘定官吏贪墨重刑，并着手将宫廷书记处改组为专职中央衙门（普里卡兹）。\n\n这是莫斯科集权路线从“诸公盟主”迈向近代中央国家的关键一跃。"
 oe_rp2.4.a: "颁行全境统一《法典》，设立中央专职衙门体系"
 oe_rp2.4.a.tt: "二期改革推进至第#Y 1#!阶，获得[ShowModifier('oe_rp2_p1_sudebnik_1497')]，持续#Y 25年#!。"
 oe_rp2.4.b: "与波雅尔杜马合议颁法，以渐进妥协减少地方阻力"
 oe_rp2.4.b.tt: "二期改革推进至第#Y 1#!阶，稳定度#G +5#!，获得[ShowModifier('oe_rp2_p1_boyar_duma_law')]，持续#Y 25年#!。"
 oe_rp2.5.t: "圣母升天教堂加冕：全罗斯沙皇"
 oe_rp2.5.d: "钟声响彻克里姆林宫广场。大都主教亲手将镶嵌紫貂皮与宝石的莫诺马赫王冠戴在君主额上，高声宣告其不再仅是弗拉基米尔与莫斯科大公，而是受上帝膏立的“全罗斯沙皇与专制君主”！\n\n新加冕的沙皇既可仿1549年旧例召集全境缙绅会议共谋变法，亦可立刻扩编常备火铳射击军以铁血立威。"
 oe_rp2.5.a: "加冕全罗斯沙皇并首开缙绅会议，凝聚诸阶层共兴大业"
 oe_rp2.5.a.tt: "确立#bold #color_yellow 全罗斯沙皇#!#!尊号，威望#G +20#!，正统性#G +15#!，获得[ShowModifier('oe_rp2_p1_tsar_sobor')]，持续#Y 25年#!。"
 oe_rp2.5.b: "以铁冠临朝、编练常备火铳射击军拱卫沙皇独断威权"
 oe_rp2.5.b.tt: "确立#bold #color_yellow 全罗斯沙皇#!#!尊号，陆军传统#G +10#!，获得[ShowModifier('oe_rp2_p1_tsar_streltsy')]，持续#Y 25年#!。"
 oe_rp2.6.t: "特辖制铁腕抑或大缙绅共治"
 oe_rp2.6.d: "漫长的西线与草原战事令旧波雅尔世家怨声载道，通敌疑云与宫廷密谋层出不穷。沙皇震怒之下欲将国土一分为二，把最富庶的州郡划为直属王室的“特辖区”（奥普里奇尼纳），遣黑衣亲卫以狗头扫帚为徽彻底剪除世袭贵族根基。\n\n然而贤臣苦谏：若行血腥清洗恐伤国本，不如扩大缙绅会议权限，以制度整合取代清洗。"
 oe_rp2.6.a: "摒弃血腥清洗，以常设大缙绅会议平衡王权与诸阶层"
 oe_rp2.6.a.tt: "二期改革推进至第#Y 3#!阶，稳定度#G +8#!，获得[ShowModifier('oe_rp2_p1_zemshchina_sobor')]，持续#Y 25年#!。"
 oe_rp2.6.b: "厉行特辖制！划定王室直辖领并铁腕整肃世袭波雅尔"
 oe_rp2.6.b.tt: "二期改革推进至第#Y 3#!阶，稳定度#R −8#!，获得[ShowModifier('oe_rp2_p1_oprichnina')]，持续#Y 20年#!。"
 oe_rp2.7.t: "北方商议会与汉萨波罗的海约"
 oe_rp2.7.d: "维彻钟声在十六世纪的寒风中愈发嘹亮。挣脱专制兼并威胁的北方共和联邦，如今把持着从涅瓦河口到白海沿岸的辽阔商网。大市长与诸城商团提议召开“北方大商业议会”，一方面与汉萨城邦重订平等的波罗的海贸易宪章，另一方面组建股份制的波莫尔毛皮商团直指乌拉尔深处。"
 oe_rp2.7.a: "颁行波罗的海平等商业宪章，确立北方海商联邦霸权"
 oe_rp2.7.a.tt: "共和二期改革推进至第#Y 2#!阶，威望#G +15#!，获得[ShowModifier('oe_rp2_p2_northern_diet')]，持续#Y 25年#!。"
 oe_rp2.7.b: "特许波莫尔毛皮股份商团，沿白海与大河抢占乌拉尔财源"
 oe_rp2.7.b.tt: "共和二期改革推进至第#Y 2#!阶，国库#G +120金币#!，获得[ShowModifier('oe_rp2_p2_pomor_syndicate')]，持续#Y 25年#!。"
 oe_rp2.8.t: "联邦缙绅议会与哥萨克自治"
 oe_rp2.8.d: "古罗斯诸侯联邦横跨第聂伯河与伏尔加河之间，既要维系诸公国与市民的合议传统，又要面对南疆草原的连绵烽火。第聂伯急流之畔的扎波罗热自由战士遣使入朝，愿以边疆骑兵效命联邦，条件是联邦大议会正式承认哥萨克酋长领的自治宪章。\n\n联邦将在“授予哥萨克自治支柱”与“巩固双院诸公大议会”之间作出长远抉择。"
 oe_rp2.8.a: "敕封扎波罗热哥萨克酋长领自治，纳为联邦南疆铁壁"
 oe_rp2.8.a.tt: "联邦二期改革推进至第#Y 2#!阶，在基奇卡斯/边疆定居#bold #color_yellow 扎波罗热哥萨克#!#!并建屯堡，获得[ShowModifier('oe_rp2_p3_federal_hetmanate')]，持续#Y 25年#!。"
 oe_rp2.8.b: "完备诸公与市民双院大议会，以宪章统合东斯拉夫诸邦"
 oe_rp2.8.b.tt: "联邦二期改革推进至第#Y 2#!阶，稳定度#G +8#!，获得[ShowModifier('oe_rp2_p3_bicameral_sobor')]，持续#Y 25年#!。"
 oe_rp2.9.t: "草原鹿砦防线与伏尔加推进"
 oe_rp2.9.d: "尽管大帐已瓦解，克里米亚与伏尔加沿岸的草原游骑仍屡屡北上劫掠农庄与人口。朝廷军务官献上两条方略：其一是在图拉、沃罗涅日与别尔哥罗德沿线伐木筑垒、构筑绵延数百里的“草原鹿砦防线”（扎谢奇纳亚防线），同时在顿河口扶持顿河哥萨克屯防；其二是组织大军沿伏尔加河顺流而下，直捣喀山、阿斯特拉罕并向捷列克草原延伸。"
 oe_rp2.9.a: "构筑草原鹿砦防线并扶持顿河哥萨克守卫南疆"
 oe_rp2.9.a.tt: "在图拉/沃罗涅日/别尔哥罗德构筑[ShowModifier('oe_rp2_abatis_line_loc')]，定居#bold #color_yellow 顿河哥萨克#!#!，获得[ShowModifier('oe_rp2_abatis_line')]，持续#Y 25年#!。"
 oe_rp2.9.b: "挥师伏尔加河东进，在顿河与捷列克前沿设立哥萨克前哨"
 oe_rp2.9.b.tt: "定居#bold #color_yellow 顿河哥萨克#!#!与#bold #color_yellow 捷列克哥萨克#!#!边防屯堡，陆军传统#G +8#!，获得[ShowModifier('oe_rp2_volga_vanguard')]，持续#Y 25年#!。"
 oe_rp2.10.t: "六大边疆哥萨克军团敕封宪章"
 oe_rp2.10.d: "从第聂伯急流到顿河苇泽，从高加索北麓的库班与捷列克河谷到乌拉尔雅伊克河畔与西伯利亚密林，无数逃避赋役的农人、猎手与流亡武士聚集成自治的哥萨克村镇（斯塔尼察）。他们骁勇善战、熟稔草原骑射，却桀骜难驯。\n\n朝廷须定下根本边策：是以高度自治与免税换取廉价而凶猛的自由军团，还是由督军发饷编练受王权严管的边防哥萨克营？"
 oe_rp2.10.a: "颁授自由哥萨克军团宪章：以边疆自治换取精锐骑兵与低廉兵役"
 oe_rp2.10.a.tt: "定居#bold #color_yellow 扎波罗热哥萨克#!#!、#bold #color_yellow 库班哥萨克#!#!与#bold #color_yellow 捷列克哥萨克#!#!屯堡，获得[ShowModifier('oe_rp2_cossack_free_charter')]，持续#Y 25年#!（含王权略降权衡）。"
 oe_rp2.10.b: "设督军发饷整编哥萨克边防营，严守中央节制与疆域控制"
 oe_rp2.10.b.tt: "定居#bold #color_yellow 顿河哥萨克#!#!与#bold #color_yellow 库班哥萨克#!#!屯堡，获得[ShowModifier('oe_rp2_cossack_crown_hosts')]，持续#Y 25年#!。"
 oe_rp2.11.t: "斯特罗加诺夫与叶尔马克"
 oe_rp2.11.d: "卡马河畔的盐商豪族斯特罗加诺夫呈上急报：乌拉尔“石带”彼岸的西伯利亚汗国（钦吉图拉与托博尔斯克）屡袭东疆堡垒，而其广袤冻原与针叶林中蕴藏着取之不尽的黑貂皮宝藏。骁勇的哥萨克首领叶尔马克愿率火铳舟师翻越乌拉尔山直捣西伯利亚汗廷！\n\n这是罗斯迈向跨欧亚帝国的壮阔起点。"
 oe_rp2.11.a: "赐予叶尔马克铁甲火铳，敕令雅伊克与西伯利亚哥萨克翻山东进！"
 oe_rp2.11.a.tt: "在雅伊克与钦吉图拉/边疆定居#bold #color_yellow 雅伊克哥萨克#!#!与#bold #color_yellow 西伯利亚哥萨克#!#!屯堡，威望#G +15#!，获得[ShowModifier('oe_rp2_yermak_siberia')]，持续#Y 25年#!。"
 oe_rp2.11.b: "广授斯特罗加诺夫盐皮特许状，以商号堡垒稳步开发乌拉尔东疆"
 oe_rp2.11.b.tt: "定居#bold #color_yellow 雅伊克哥萨克#!#!屯堡，国库#G +150金币#!，获得[ShowModifier('oe_rp2_stroganov_patents')]，持续#Y 25年#!。"
 oe_rp2.12.t: "动乱时代阴影与继位护栏"
 oe_rp2.12.d: "十六世纪临近尾声，连年饥荒、边疆征战与王室子嗣单薄的阴影笼罩全境。史书警示着“动乱时代”（斯穆塔）的覆辙——一旦继位法统出现真空，伪王、波雅尔内讧与外敌干涉将接踵而至。\n\n凭借此前百余年锻造的法典、议会与边防体系，朝廷今朝可立下稳固的继位护栏，为罗斯二期画上庄严句号。"
 oe_rp2.12.a: "召集全境缙绅与教会立誓继位宪章，以制度护栏弭平动乱隐患"
 oe_rp2.12.a.tt: "完成玩家罗斯二期主线，稳定度#G +10#!，正统性#G +15#!，获得[ShowModifier('oe_rp2_smuta_compact')]，持续#Y 25年#!。"
 oe_rp2.12.b: "组建铁腕摄政枢密与边防重兵，严厉弹压一切僭位与内讧"
 oe_rp2.12.b.tt: "完成玩家罗斯二期主线，陆军传统#G +10#!，获得[ShowModifier('oe_rp2_smuta_iron_regency')]，持续#Y 25年#!。"
 oe_rp2.20.t: "玩家罗斯二期：选项生效"
 oe_rp2.90.t: "【测试】玩家罗斯二期：状态读数"
 oe_rp2.90.d: "#T 二期主线#!\n一期路线(1莫/2诺/3联) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_path')|0]  二期阶段(0..4) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_stage')|0]  索菲亚态(1存/2亡/3陷) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_sophia')|0]  沙皇加冕 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_tsar')|0]  二期完成 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_done')|0]\n#T 边疆与哥萨克#!\n已敕封哥萨克军团(0..6) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_hosts')|0]  鹿砦防线 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_abatis')|0]  西伯利亚东进 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_siberia')|0]\n#T 调度#!\n月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_m')|0]  结束代码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_end')|0]  已发数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_cnt')|0]  联姻已结 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rp2_rd_sophia_done')|0]\n（结束代码：0运行中、1二期完成、3超1605年、8无玩家罗斯）"
 oe_rp2.90.a: "关闭"
 oe_rp2.90.b: "刷新"
