oe_turkish_identity_movement: "突厥罗马化"
oe_turkish_identity_movement_desc: "罗马人重新征服小亚细亚彻底扭转了数百年来半岛希腊语人口不断流失与持续突厥化的趋势，入侵的游牧部族被重新征服，愿意归化的突厥人继承塞尔柱之名，形成了全新的[ShowCultureName('oe_tur_greek_culture')][culture|e]\n\n$OE_IDENTITY_FIXED_30Y_DESC$"

oe_orthodox_identity_movement: "东西教会合一"
oe_orthodox_identity_movement_desc: "亚历山大、安条克与耶路撒冷的圣座，终于再度与君士坦丁堡同处帝国的庇护之下。东部教会的重聚，使长久分裂的基督徒得以重新商议共同的信仰；送往罗马的书信，将开启一场跨越疆界的和解。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"

















