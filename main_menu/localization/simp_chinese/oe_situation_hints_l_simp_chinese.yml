l_simp_chinese:
# NEW 2026-11-24 v25.5 Wave 2B: Situation Hints Localization for All 30 Active Custom Situations (ZH).
 hint_oe_cw_war:0 "[GetSituationByKey('oe_cw_war').GetNameWithNoTooltip]"
 hint_oe_cw_war_hint_text:0 "#T 触发与局势概述#!\n@hint! 1341年拜占庭摄政危机演变为帕莱奥略皇廷与约翰·坎塔库泽努斯的内战时触发。\n\n#T 核心目标#!\n@hint! 在局势面板紧盯色雷斯与马其顿各要城归属，收复叛军据点并防止塞萨洛尼基狂热党公社导致帝国分裂。\n\n#T 行动与结局#!\n@hint! 尽快在战场上击溃敌对僭位者或借内战事件链达成妥协协议，结束内战并保全帝国元气。"
 hint_oe_cw2_war:0 "[GetSituationByKey('oe_cw2_war').GetNameWithNoTooltip]"
 hint_oe_cw2_war_hint_text:0 "#T 触发与局势概述#!\n@hint! 1352年约翰五世与坎塔库泽努斯派系爆发皇位续战时触发。\n\n#T 核心目标#!\n@hint! 迅速掌控君士坦丁堡周边与色雷斯要镇，避免塞尔维亚、保加利亚或安纳托利亚势力乘虚而入。\n\n#T 行动与结局#!\n@hint! 通过军事速胜或共治和议终结皇位之争，恢复单一皇权指挥。"
 hint_oe_vas_vassalage:0 "[GetSituationByKey('oe_vas_vassalage').GetNameWithNoTooltip]"
 hint_oe_vas_vassalage_hint_text:0 "#T 触发与局势概述#!\n@hint! 十四世纪后期拜占庭被迫向奥斯曼苏丹称臣纳贡（1371–1381）时激活。\n\n#T 核心目标#!\n@hint! 在局势面板权衡苏丹容忍度与反叛势头，一边稳住君士坦丁堡防务、一边平息安德洛尼卡叛乱。\n\n#T 行动与结局#!\n@hint! 蓄积军备与外援，熬过附庸期并把握契机解除称臣状态。"
 hint_oe_byd_blockade:0 "[GetSituationByKey('oe_byd_blockade').GetNameWithNoTooltip]"
 hint_oe_byd_blockade_hint_text:0 "#T 触发与局势概述#!\n@hint! 巴耶济德一世对君士坦丁堡发动水陆大封锁（1394–1402）时激活。\n\n#T 核心目标#!\n@hint! 维持都城士气在崩溃线之上，通过海峡补给、求援西欧与坚守狄奥多西城墙撑过封锁。\n\n#T 行动与结局#!\n@hint! 坚持到东方变局迫使奥斯曼撤围，或以主力击退围城大军即可终结局势。"
 hint_oe_ivr_interregnum:0 "[GetSituationByKey('oe_ivr_interregnum').GetNameWithNoTooltip]"
 hint_oe_ivr_interregnum_hint_text:0 "#T 触发与局势概述#!\n@hint! 安卡拉之战重创奥斯曼后，诸王子混战争夺苏丹大位时激活。\n\n#T 核心目标#!\n@hint! 追踪各路奥斯曼王子的筹码与胜势，押注愿向拜占庭割让塞萨洛尼基与海峡要塞的候选人。\n\n#T 行动与结局#!\n@hint! 当某位奥斯曼王子统一大位并兑现或撕毁领土赌约时，大空位期局势随之落幕。"
 hint_oe_ths_city:0 "[GetSituationByKey('oe_ths_city').GetNameWithNoTooltip]"
 hint_oe_ths_city_hint_text:0 "#T 触发与局势概述#!\n@hint! 奥斯曼大军围困帝国第二大名城塞萨洛尼基时激活。\n\n#T 核心目标#!\n@hint! 维系守城意志并设法海陆增援，或在城破前权衡是否暂交威尼斯托管。\n\n#T 行动与结局#!\n@hint! 击退围城之敌、完成外交移交或走完围城结局事件后局势结束。"
 hint_oe_ths_mustafa:0 "[GetSituationByKey('oe_ths_mustafa').GetNameWithNoTooltip]"
 hint_oe_ths_mustafa_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭放出僭位王子穆斯塔法动摇奥斯曼苏丹统治时激活。\n\n#T 核心目标#!\n@hint! 关注穆斯塔法与现任苏丹的力量对比，决定投入多少兵力与银币助其夺权。\n\n#T 行动与结局#!\n@hint! 穆斯塔法成功夺取鲁米利亚履约或败亡于苏丹反扑后，局势自动结算。"
 hint_oe_ar_burden:0 "[GetSituationByKey('oe_ar_burden').GetNameWithNoTooltip]"
 hint_oe_ar_burden_hint_text:0 "#T 触发与局势概述#!\n@hint! 光复罗马帝国后，统辖广袤西方与地中海行省带来沉重帝国负荷时激活。\n\n#T 核心目标#!\n@hint! 在新复西方行省兴建军区体系，并借助帝国柱石与总督制分摊行政压力、压低负荷槽。\n\n#T 行动与结局#!\n@hint! 稳固西方控制度并完成行政整合、消除帝国负荷后，局势圆满结束。"
 hint_rome_reconquista:0 "[GetSituationByKey('rome_reconquista').GetNameWithNoTooltip]"
 hint_rome_reconquista_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭开启收复罗马故土大业时激活的总纲局势，统筹九大历史战区。\n\n#T 核心目标#!\n@hint! 维持收复热忱、在罗马世界国际组织中拟定战区规划，并逐一发动各方向收复战役。\n\n#T 行动与结局#!\n@hint! 陆续光复关键行省或达成罗马大光复里程碑后，总纲局势收官。"
 hint_oe_hc_egypt:0 "[GetSituationByKey('oe_hc_egypt').GetNameWithNoTooltip]"
 hint_oe_hc_egypt_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动埃及与黎凡特收复战役时激活，对帝国阵营、战区守军及邻邦可见。\n\n#T 核心目标#!\n@hint! 帝国方通过攻占尼罗河与黎凡特重镇推进进军进度；守军方则拉高战区压力拖垮攻势。\n\n#T 行动与结局#!\n@hint! 双方可使用面板行动「调拨帝国远征军需」或「号召战区联军抗敌」影响战局，战区和约或全境克复后局势结束。"
 hint_oe_hc_africa:0 "[GetSituationByKey('oe_hc_africa').GetNameWithNoTooltip]"
 hint_oe_hc_africa_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动阿非利加（马格里布）收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方夺取迦太基与北非沿海重镇推进进度，守军方依托要塞与联军拉高帝国后勤压力。\n\n#T 行动与结局#!\n@hint! 双方可在面板执行远征补给或联军抗敌行动，北非战局定鼎或休战后局势结束。"
 hint_oe_hc_italy:0 "[GetSituationByKey('oe_hc_italy').GetNameWithNoTooltip]"
 hint_oe_hc_italy_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动意大利半岛收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方由南意向罗马与伦巴第推进进军进度，意大利诸邦则联合抬升战区压力阻滞攻势。\n\n#T 行动与结局#!\n@hint! 双方可直接点击面板行动调拨军需或号召联军，意大利战局结算后局势结束。"
 hint_oe_hc_france:0 "[GetSituationByKey('oe_hc_france').GetNameWithNoTooltip]"
 hint_oe_hc_france_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动高卢（法兰西）收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方突破西欧密集堡垒线提升进度，高卢防卫方通过持久消耗推高帝国战区压力。\n\n#T 行动与结局#!\n@hint! 双方均可使用面板行动左右进度与压力，战区停战或征服完成后局势结束。"
 hint_oe_hc_iberia:0 "[GetSituationByKey('oe_hc_iberia').GetNameWithNoTooltip]"
 hint_oe_hc_iberia_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动伊斯帕尼亚（伊比利亚）收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方夺取伊比利亚港口与内陆要城推进进度，守军方依托山地防线拉高战区压力。\n\n#T 行动与结局#!\n@hint! 双方每 3 年可使用一次面板军需或联军行动，战局达成和议或克复后结束。"
 hint_oe_hc_britain:0 "[GetSituationByKey('oe_hc_britain').GetNameWithNoTooltip]"
 hint_oe_hc_britain_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动不列颠尼亚收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方需维系跨海补给线推进进军进度，岛屿守军则借海防消耗抬高战区压力。\n\n#T 行动与结局#!\n@hint! 双方可在面板执行远征补给或联军抗敌行动，不列颠战局结束时局势关闭。"
 hint_oe_hc_persia:0 "[GetSituationByKey('oe_hc_persia').GetNameWithNoTooltip]"
 hint_oe_hc_persia_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动波斯与两河收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方横跨两河流域与伊朗高原推进进度，东方守军则依托高原补给线拉高帝国压力。\n\n#T 行动与结局#!\n@hint! 双方可使用面板行动争夺进度与压力优势，波斯战局结算后局势结束。"
 hint_oe_hc_blacksea:0 "[GetSituationByKey('oe_hc_blacksea').GetNameWithNoTooltip]"
 hint_oe_hc_blacksea_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动黑海与本都收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方夺取克里米亚、黑海北岸与高加索门户推进进度，地方联军则拉高战区压力反制。\n\n#T 行动与结局#!\n@hint! 双方均可在面板使用专属战区行动，黑海战局休战或胜利后局势结束。"
 hint_oe_hc_arabia:0 "[GetSituationByKey('oe_hc_arabia').GetNameWithNoTooltip]"
 hint_oe_hc_arabia_hint_text:0 "#T 触发与局势概述#!\n@hint! 拜占庭宣诏发动阿拉伯与红海收复战役时激活。\n\n#T 核心目标#!\n@hint! 帝国方掌控汉志与商道绿洲推进进度，守军方利用沙漠消耗推高帝国战区压力。\n\n#T 行动与结局#!\n@hint! 双方可在面板执行远征补给或联军抗敌行动，阿拉伯战局定案后局势结束。"
 hint_oe_sit_northern_crusade:0 "[GetSituationByKey('oe_sit_northern_crusade').GetNameWithNoTooltip]"
 hint_oe_sit_northern_crusade_hint_text:0 "#T 触发与局势概述#!\n@hint! 1480年前当条顿/利沃尼亚骑士团与波兰/立陶宛并存于波罗的海前线时触发。\n\n#T 核心目标#!\n@hint! 争夺十字军势能（0–100）：势能达 80+（或条顿控制维尔纽斯、华沙并建立 2 个以上大封邑）达成骑士团胜局；势能跌至 15 以下（或波立攻克马尔堡）达成波立反制胜局；拖至 1525 年则进入波罗的海和议结局。\n\n#T 行动与策略#!\n@hint! 骑士团阵营可招募德意志客籍十字军与加固城堡推高势能；波立阵营可征召边防军与上诉教廷压低势能；周边观战国可资助波罗的海商道获利。"
 hint_oe_sit_manchu_pass:0 "[GetSituationByKey('oe_sit_manchu_pass').GetNameWithNoTooltip]"
 hint_oe_sit_manchu_pass_hint_text:0 "#T 触发与局势概述#!\n@hint! 1580–1680年间统一的女真/满洲强权在山海关前对峙陷入危机的中原王朝（明/元）时触发。\n\n#T 核心目标#!\n@hint! 紧盯山海关破关压力（0–100）：满洲攻占大都或击穿宁锦—山海关走廊即可破关定鼎；中原守方守住关宁防线满 15 年或反克辽东即获大捷；长期僵持则走向南北长城分治和议。\n\n#T 行动与策略#!\n@hint! 满洲可动员八旗先登与招抚辽东降将推高压力；中原守军可增援关宁与筹措海运边饷压低压力；周边东亚各国可借外交斡旋稳固边贸。"
 hint_oe_sit_three_feudatories:0 "[GetSituationByKey('oe_sit_three_feudatories').GetNameWithNoTooltip]"
 hint_oe_sit_three_feudatories_hint_text:0 "#T 触发与局势概述#!\n@hint! 1668–1740年间满洲/大清入主北京并统辖华南大片疆域时触发。\n\n#T 核心目标#!\n@hint! 大清需将平藩进度推至 80+（或将叛乱烈度压至 15 以下）实现撤藩集权；若烈度突破 90 或失守京师，则南方藩镇坐大；持续 8 年势均力敌则达成怀柔妥协。\n\n#T 行动与策略#!\n@hint! 大清可调遣八旗绿营、招抚降将与固守长江防线；明室遗民及周边东亚各国可暗援南方抗清推高烈度，或借互市斡旋谋利。"
 hint_oe_sit_twilight_of_empires:0 "[GetSituationByKey('oe_sit_twilight_of_empires').GetNameWithNoTooltip]"
 hint_oe_sit_twilight_of_empires_hint_text:0 "#T 触发与局势概述#!\n@hint! 近代后期殖民地独立浪潮与火药帝国近代化改革压力交汇时触发。\n\n#T 核心目标#!\n@hint! 兼顾帝国改革度、殖民独立浪潮与大国协调度三条进度条：高改革实现旧帝国中兴，高独立引发海外殖民地解放，高协调则促成大国均势体系。\n\n#T 行动与策略#!\n@hint! 通过面板局势行动推进制度革新、安抚海外殖民领或暗中扶植独立运动，主导最终时代结局。"
 hint_oe_sit_eurasian_great_war:0 "[GetSituationByKey('oe_sit_eurasian_great_war').GetNameWithNoTooltip]"
 hint_oe_sit_eurasian_great_war_hint_text:0 "#T 触发与局势概述#!\n@hint! 1750–1836年间欧亚两大强权阵营在多战区爆发全面大战时触发。\n\n#T 核心目标#!\n@hint! 争夺霸权阵营与反霸同盟的天平、五大核心战区得分与战争厌倦度：压倒性优势达成单极霸权，均势谈判缔结维也纳式协调，革命浪潮催生新秩序，或于 1835 年前进入妥协和会。\n\n#T 行动与策略#!\n@hint! 灵活运用总动员、战区攻势、盟邦补贴与外交和会等局势行动左右最终世界格局。"
 hint_oe_rise_of_rus:0 "[GetSituationByKey('oe_rise_of_rus').GetNameWithNoTooltip]"
 hint_oe_rise_of_rus_hint_text:0 "#T 触发与局势概述#!\n@hint! 1637年前金帐汗国威势松动、罗斯诸大公竞逐统一大业时触发。\n\n#T 核心目标#!\n@hint! 罗斯前列大公需在绝对主义时代到来前扩张疆土、赢得正教声望并正式建立俄罗斯（RUS），否则时代落幕。\n\n#T 行动与策略#!\n@hint! 罗斯霸主可纳贡、赎买小公国、争夺敌手并统一全罗斯；拜占庭可赐予大牧首与佣兵；立陶宛可图谋基辅；其他小公国与周边邻邦也可加固边防并开展毛皮商使外交。"
 hint_oe_russian_ambition:0 "[GetSituationByKey('oe_russian_ambition').GetNameWithNoTooltip]"
 hint_oe_russian_ambition_hint_text:0 "#T 触发与局势概述#!\n@hint! 俄罗斯（RUS）建国且罗斯崛起结束后触发，标志俄国向草原、西伯利亚与西疆全面扩张。\n\n#T 核心目标#!\n@hint! 俄国力图开拓草原与西伯利亚、建立圣彼得堡与特辖制；周边强邻则力求遏制乃至击溃俄国扩张。\n\n#T 行动与策略#!\n@hint! 俄国可执行 9 项扩张与内政行动；其余可见邻邦与观战国可执行「修筑抗俄东疆壁垒」「联络多邦遏俄外交」「雇募草原与哥萨克边骑」积极应对。"
 hint_oe_sit_byz_renaissance:0 "[GetSituationByKey('oe_sit_byz_renaissance').GetNameWithNoTooltip]"
 hint_oe_sit_byz_renaissance_hint_text:0 "#T 触发与局势概述#!\n@hint! 帕莱奥略文艺复兴在东地中海与意大利兴起时触发。\n\n#T 核心目标#!\n@hint! 推高文艺复兴兴盛度至胜利阈值，同时在「希腊古典复兴」与「东正教静修综合」两条思潮轴线间作出抉择。\n\n#T 行动与策略#!\n@hint! 通过邀聘学者、资助帝国学院与主持思想辩论，积累兴盛进度并锁定心仪的文明结局。"
 hint_oe_sit_eastern_crossroads:0 "[GetSituationByKey('oe_sit_eastern_crossroads').GetNameWithNoTooltip]"
 hint_oe_sit_eastern_crossroads_hint_text:0 "#T 触发与局势概述#!\n@hint! 波立、罗斯、拜占庭与草原势力在黑海北岸—喀尔巴阡—鲁塞尼亚十字路口交锋时触发。\n\n#T 核心目标#!\n@hint! 控制关键河道枢纽与边疆盟友，将十字路口主导权拉向本方阵营，直至奠定区域霸主秩序。\n\n#T 行动与策略#!\n@hint! 运用边疆设防、哥萨克盟约与外交合纵行动扩大优势。"
 hint_oe_sit_glh_troubles:0 "[GetSituationByKey('oe_sit_glh_troubles').GetNameWithNoTooltip]"
 hint_oe_sit_glh_troubles_hint_text:0 "#T 触发与局势概述#!\n@hint! 1490年前金帐汗国陷入大动乱（1360年后或内部凝聚力崩解）时触发。\n\n#T 核心目标#!\n@hint! 金帐汗国需将汗庭凝聚力拉回 85+ 实现中兴；罗斯诸公与草原竞争者则力促汗国瓦解为诸继业汗国。\n\n#T 行动与策略#!\n@hint! 通过召集兀鲁思骑军、赋予左右翼自治或乘乱掣肘等行动决定汗国存亡。"
 hint_oe_sit_two_emperors:0 "[GetSituationByKey('oe_sit_two_emperors').GetNameWithNoTooltip]"
 hint_oe_sit_two_emperors_hint_text:0 "#T 触发与局势概述#!\n@hint! 1520–1790年间复兴的东罗马帝国（拜占庭/罗马）向西挺进、与神圣罗马皇帝正面争夺正统皇权时触发。\n\n#T 核心目标#!\n@hint! 争夺双皇正统天平（0–100）：东罗方推至 85+（或维持霸权 12 月）可达成「唯此一帝」并安全解体神罗；神罗方压制天平则捍卫西方帝统；势均力敌亦可签下双罗马和约。\n\n#T 行动与策略#!\n@hint! 通过皇权移转敕令、教廷仲裁、帝国议会抗衡及法兰西/新教牵制等行动扭转天平。"
 hint_oe_sit_yuan_restoration:0 "[GetSituationByKey('oe_sit_yuan_restoration').GetNameWithNoTooltip]"
 hint_oe_sit_yuan_restoration_hint_text:0 "#T 触发与局势概述#!\n@hint! 1415年前大元（CHI）渡过红巾军危机并开启至正中兴考成时触发。\n\n#T 核心目标#!\n@hint! 将中兴进度推至 80+ 宣告大元中兴告成，同时在「汉法更化 (0)」与「漠北国俗 (100)」两派朝局之间维持平衡。\n\n#T 行动与策略#!\n@hint! 通过推行汉法整顿、征调漠北旗军与收纳藩属贡赋稳步提升进度并调节朝局天平。"
