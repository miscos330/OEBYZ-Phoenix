 oe_col2_charter_trading_house: "敕建殖民特许商行章程"
 oe_col2_charter_trading_house_desc: "在沿海据点颁行皇家特许商行章程，强化海域存在、贸易中心影响力与海运效率；若罗马帝国已开启远海航路，更可提升商业分红收益。"
 oe_col2_charter_trading_house_active: "在[SCOPE.sProvince('target').GetNameWithHighlightOnly]督办远洋特许商行"
 oe_col2_charter_trading_house_action: "在[SCOPE.sProvince('target').GetNameWithNoTooltip]敕建远洋特许商行"
 oe_col2_charter_trading_house_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('trade_sea_efficiency')]"
 oe_col2_charter_trading_house_action_progress_wordier: "[SCOPE.sProvince('target').GetNameWithNoTooltip]远洋特许商行章程施行中"
 oe_col2_charter_trading_house_action_progress_long_wordier: "[SCOPE.sProvince('target').GetNameWithNoTooltip]远洋特许商行章程施行中"
 oe_col2_charter_trading_house_action_progress_tooltip: "以皇家特许商行强化沿海海域存在、贸易中心影响力与远洋海运效率。"
 oe_col2_trading_house_select_province: "选择敕建特许商行的沿海省份"
 oe_col2_trading_house_no_provinces: "@trigger_no! 当前没有可供敕建特许商行的本国沿海省份。"
 oe_col2_mediate_frontier_disputes: "调解拓荒者与原住民纠纷"
 oe_col2_mediate_frontier_disputes_desc: "派遣巡按专使公平裁断边疆地界与毛皮香料贸易争端，显著压低地方动乱、提升异教容忍度并促进边疆原料产出与繁荣恢复。"
 oe_col2_mediate_frontier_disputes_active: "在[SCOPE.sProvince('target').GetNameWithHighlightOnly]调解边疆与原住民纠纷"
 oe_col2_mediate_frontier_disputes_action: "在[SCOPE.sProvince('target').GetNameWithNoTooltip]调解边疆纠纷"
 oe_col2_mediate_frontier_disputes_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('tolerance_heathen')]"
 oe_col2_mediate_frontier_disputes_action_progress_wordier: "[SCOPE.sProvince('target').GetNameWithNoTooltip]边疆纠纷调解专使巡按中"
 oe_col2_mediate_frontier_disputes_action_progress_long_wordier: "[SCOPE.sProvince('target').GetNameWithNoTooltip]边疆纠纷调解专使巡按中"
 oe_col2_mediate_frontier_disputes_action_progress_tooltip: "派遣巡按专使裁断地界与贸易纠纷，压低边疆动乱、提高异教容忍并促进原料产出与繁荣恢复。"
 oe_col2_mediate_select_province: "选择需要调解边疆纠纷的省份"
 oe_col2_mediate_no_provinces: "@trigger_no! 当前没有可供派遣调解专使的本国控制省份。"
 oe_col2_cossack_ostrog: "哥萨克河口木堡"
 oe_col2_cossack_ostrog_desc: "修筑于草原、乌拉尔与西伯利亚大河要津的原木堡寨与毛皮补给库，兼具早期城防、驻军补给、毛皮采运及抗寒拓垦支撑功能。"
 oe_col2_cossack_ostrog_upkeep: "河口木堡修缮与武备"
 oe_col2_charter_customs_house: "海外特许海关与货栈"
 oe_col2_charter_customs_house_desc: "设于海外商港与特许商馆的综合海关栈房，统筹海运关税、商船补给与远洋账簿，大幅提升海外据点的商人容量、海域存在与控制度上限。"
 oe_col2_charter_customs_house_upkeep: "特许海关账簿与码头维护"
 STATIC_MODIFIER_NAME_oe_col2_maritime_factoria_mod: "特许远洋商馆免税期"
 STATIC_MODIFIER_DESC_oe_col2_maritime_factoria_mod: "初建的远洋商馆以让渡部分王室直征权力换取迅猛的海域存在、商业枢纽影响力与更稳固的沿海控制度。"
 STATIC_MODIFIER_NAME_oe_col2_factoria_dividend_link: "远海总督分红商港"
 STATIC_MODIFIER_DESC_oe_col2_factoria_dividend_link: "该港口已正式并入帝国远海商业总督账簿，源源不断为帝国远洋分红池贡献商力与繁荣。"
 STATIC_MODIFIER_NAME_oe_col2_cossack_ostrog_mod: "边疆木堡自卫屯垦"
 STATIC_MODIFIER_DESC_oe_col2_cossack_ostrog_mod: "哥萨克边民依托河口木堡自行戍边与开荒，大幅增强寒地补给、守军恢复与后续移民吸引力。"
 STATIC_MODIFIER_NAME_oe_col2_limes_colony_mod: "边防军屯要塞"
 STATIC_MODIFIER_DESC_oe_col2_limes_colony_mod: "兵农合一的帝国军屯以减免前期产出换取稳固的边防工事、高控制度下限与井然有序的地方治安。"
 STATIC_MODIFIER_NAME_oe_col2_peaceful_mission_mod: "和平教化特许状"
 STATIC_MODIFIER_DESC_oe_col2_peaceful_mission_mod: "传教修院以仁政与译经教化代替强制驱逐，在较温和的迁徙节奏下赢得长久安宁、传教效率与自然人口增长。"
 STATIC_MODIFIER_NAME_oe_col2_mission_charter_pace: "温和传教拓垦节奏"
 STATIC_MODIFIER_DESC_oe_col2_mission_charter_pace: "优先与原住民和平共存使全国殖民推进略为放缓，却换来更高的异教容忍与国内稳定度回报。"
 STATIC_MODIFIER_NAME_oe_col2_surveyor_logistics_mod: "边疆勘界补给线"
 STATIC_MODIFIER_DESC_oe_col2_surveyor_logistics_mod: "系统化的海图、驿站与检疫补给体系有效克服了五大生态区的早期拓殖阻力。"
 STATIC_MODIFIER_NAME_oe_col2_charter_company_dividend_mod: "特许商行远洋分红"
 STATIC_MODIFIER_DESC_oe_col2_charter_company_dividend_mod: "沿海特许商行与远海总督账簿协同运作，提升全国海运贸易效率与商业分成。"
 STATIC_MODIFIER_NAME_oe_col2_native_treaty_mod: "部落盟约与特产互市"
 STATIC_MODIFIER_DESC_oe_col2_native_treaty_mod: "尊重原住民部落自治并共分毛皮香料厚利，令特产产出飙升、治安极稳，但当地同化节奏显著放慢。"
 STATIC_MODIFIER_NAME_oe_col2_native_synthesis_mod: "通婚混血与边民融合"
 STATIC_MODIFIER_DESC_oe_col2_native_synthesis_mod: "拓荒者与本地部族世代通婚互助，孕育出熟悉双语与商路的新兴边疆共同体。"
 STATIC_MODIFIER_NAME_oe_col2_native_company_mod: "特许公司专卖接管"
 STATIC_MODIFIER_DESC_oe_col2_native_company_mod: "垄断性的海外商社带来了可观商力与航运控制，却也引发地方民众与原住民的持续不满。"
 STATIC_MODIFIER_NAME_oe_col2_native_garrison_mod: "军屯强力同化管治"
 STATIC_MODIFIER_DESC_oe_col2_native_garrison_mod: "重兵驻防与严密行政大幅加快了语言宗教同化与防线建设，但严苛管治短期抑制了人口自然增长。"
 STATIC_MODIFIER_NAME_oe_col2_elysia_foederati_mod: "新罗马同盟者盟约"
 STATIC_MODIFIER_DESC_oe_col2_elysia_foederati_mod: "仿照古典罗马《同盟者法》与东岸美洲诸部立约守望相助，以互惠互市换取充沛边疆兵源、补给与长治久安。"
 oe_col2_native.1.title: "新疆定鼎：原住民外交与边疆整合"
 oe_col2_native.1.desc: "随着[SCOPE.sLocation('oe_col2_colony_hub').GetName]周边的首批定居点与堡寨落成，当地原住民长老、随行商团代表与边防驻军首领齐聚总督帐前。如何界定新领地内原住民部落、海外商社与帝国驻军之间的权责，将决定这片边疆未来数十年的兴衰走向。"
 oe_col2_native.1.a: "缔结《部落盟约与毛皮/香料互市》"
 oe_col2_native.1.a.tt: "[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_treaty_mod')]（#Y 25年#!）：大幅提升特产产出并压低动乱，但放缓文化同化。"
 oe_col2_native.1.b: "倡导《通婚混血与新边民融合》"
 oe_col2_native.1.b.tt: "[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_synthesis_mod')]（#Y 25年#!）：提升自然人口增长、移民吸引与边疆繁荣。"
 oe_col2_native.1.c: "交由《特许公司专卖接管》"
 oe_col2_native.1.c.tt: "立即入账 #G +35#! 金币，且[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_company_mod')]（#Y 25年#!）：强化商力与海域存在，但推高地方动乱。"
 oe_col2_native.1.d: "推行《军屯垦荒与强力同化》"
 oe_col2_native.1.d.tt: "耗资 #R -40#! 金币，使[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_garrison_mod')]（#Y 25年#!）：加速同化传教与防线控制，代价是放缓自然增长。"
 oe_col2_native.2.title: "赫斯珀里亚海岸的新罗马同盟者"
 oe_col2_native.2.desc: "当罗马鹰旗飘扬在[SCOPE.sLocation('oe_col2_colony_hub').GetName]的广袤林海与海湾之畔，阿冈昆与易洛魁诸部的使者携贝壳珠带前来会盟。资深元老建议援引古典罗马《同盟者法》（Foederati），以平等盟约换取新大陆的第一道防线与粮秣补给。"
 oe_col2_native.2.a: "缔结《新罗马同盟者盟约》"
 oe_col2_native.2.a.tt: "[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_elysia_foederati_mod')]（#Y 30年#!）：大幅增强边疆人力、补给、产出与和平度，并激活远西海岸探索走廊。"
 oe_col2_native.2.b: "鼓励拉丁—希腊与原住民双语通婚共居"
 oe_col2_native.2.b.tt: "[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_synthesis_mod')]（#Y 30年#!）：促进人口自然增长与新大陆边疆繁荣。"
 oe_col2_native.2.c: "按帝国军屯旧制严密设防同化"
 oe_col2_native.2.c.tt: "耗资 #R -35#! 金币，使[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_garrison_mod')]（#Y 25年#!）：加快同化、传教与防御建设。"
 oe_col2_native.3.title: "河口木堡既立：哥萨克边军与牙萨克毛皮贡"
 oe_col2_native.3.desc: "[SCOPE.sLocation('oe_col2_colony_hub').GetName]的原木堡寨与望楼已俯瞰大河渡口，哥萨克首领向朝廷报捷：周边林海与草原部族已遣使商议黑貂皮贡赋与冬季补给事宜。"
 oe_col2_native.3.a: "订立温和的牙萨克毛皮互市契约"
 oe_col2_native.3.a.tt: "获得 #G +30#! 金币，[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_treaty_mod')]（#Y 25年#!）：提高毛皮产出并安抚草原林海部族。"
 oe_col2_native.3.b: "广招哥萨克家眷与向导融汇成新边军"
 oe_col2_native.3.b.tt: "[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_synthesis_mod')]（#Y 25年#!）：提升寒地人口增长与移民吸引。"
 oe_col2_native.3.c: "强化王室驻军直控大河渡口"
 oe_col2_native.3.c.tt: "耗资 #R -35#! 金币，[SCOPE.sLocation('oe_col2_colony_hub').GetName]获得[ShowModifier('oe_col2_native_garrison_mod')]（#Y 25年#!）：加速边疆同化与守备控制。"
 oe_col2_native.4.title: "季风海港与帝国远洋商馆条约"
