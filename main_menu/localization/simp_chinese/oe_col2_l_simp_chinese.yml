# NEW 2026-11-21 v9.9 Worker 2: 4 Colonial Charter Goals & Frontier Pacing 2.0 (oe_col2_). Generated by gen_v99_colonization.py; edit the generator, not this file.
 oe_goal_imperial_maritime_factoria: "帝国远洋商馆与海外总督宪章"
 oe_goal_imperial_maritime_factoria_desc: "当该省殖民竣工时，我们将在最佳沿海港口兴建海外特许海关与商馆并晋升城镇；若为推行远海总督体系的罗马帝国，东方商路将自动纳入商业总督分红网络，西方跨洋据点则自动衔接海外总督区。"
 oe_goal_imperial_maritime_factoria_OUTCOME: "[COUNTRY.GetName]已在[LOCATION.GetName]敕建远洋商馆与特许海关，打通海外航路。"
 oe_goal_steppe_cossack_ostrog: "草原与西伯利亚哥萨克木堡屯垦"
 oe_goal_steppe_cossack_ostrog_desc: "当该省殖民竣工时，我们将在战略河口兴建哥萨克河口木堡，迁入适应乌拉尔、西伯利亚或顿河草原的哥萨克边防卫队与农户，赋予全境二十年木堡自卫屯垦修正，显著缓解冻土补给压力。"
 oe_goal_steppe_cossack_ostrog_OUTCOME: "[COUNTRY.GetName]已在[LOCATION.GetName]立起哥萨克木堡与边防屯垦区。"
 oe_goal_limes_soldier_farmer_colony: "帝国边疆军屯与要塞殖民区"
 oe_goal_limes_soldier_farmer_colony_desc: "当与本国或附庸陆路接壤的边疆省份殖民竣工时，我们将以兵农合一军屯体制直接收编，构筑早期防御栅堡并安置驻军农户，以小幅前期产出让利换取坚实的控制度下限、防御与低动乱。"
 oe_goal_limes_soldier_farmer_colony_OUTCOME: "[COUNTRY.GetName]已将[LOCATION.GetName]划为帝国边疆军屯要塞区。"
 oe_goal_ecumenical_missionary_charter: "普世传教与和平教化宪章"
 oe_goal_ecumenical_missionary_charter_desc: "当该省殖民竣工时，我们不驱逐当地原住民，而是派遣教士建立和平修院与书院；以更温和缓慢的殖民节奏为代价，换取持久的传教增益、原住民共存稳定度与自然人口增长。"
 oe_goal_ecumenical_missionary_charter_OUTCOME: "[COUNTRY.GetName]已在[LOCATION.GetName]颁行普世和平传教与原住民共存宪章。"
 AUTO_MODIFIER_NAME_oe_col2_eco_siberia_frost: "西伯利亚冻土补给阻力"
 AUTO_MODIFIER_DESC_oe_col2_eco_siberia_frost: "1620年前，非草原/罗斯文化势力在缺乏哥萨克木堡或边疆勘界补给官的情况下深入北极与亚极地冻土，面临严峻的补给与移民阻力。"
 AUTO_MODIFIER_NAME_oe_col2_eco_sahara_aridity: "撒哈拉与内陆荒漠干涸阻力"
 AUTO_MODIFIER_DESC_oe_col2_eco_sahara_aridity: "1650年前，域外势力在未建高控制度或边疆勘界补给线时强行深入内陆荒漠，将承受显著的补给与行政衰减。"
 AUTO_MODIFIER_NAME_oe_col2_eco_east_africa_malaria: "热带非洲疫病与海岸补给阻力"
 AUTO_MODIFIER_DESC_oe_col2_eco_east_africa_malaria: "1650年前，欧洲势力在热带非洲若尚未建立海外特许海关、远洋商馆或边疆补给官体系，难以直接大规模拓殖内陆。"
 AUTO_MODIFIER_NAME_oe_col2_eco_sea_spice_archipelago: "南洋香料群岛无特许阻力"
 AUTO_MODIFIER_DESC_oe_col2_eco_sea_spice_archipelago: "1650年前，欧洲势力若不依托海外特许海关、商馆条约或原住民互市盟约而在南洋群岛强行直辖，将面临持续的地方抵制与高昂维稳代价。"
 AUTO_MODIFIER_NAME_oe_col2_eco_atlantic_early_supply: "早期跨洋补给薄弱"
 AUTO_MODIFIER_DESC_oe_col2_eco_atlantic_early_supply: "1540年前，早期跨大西洋据点在建成海外特许海关、商馆体系、边疆补给官或极乐洲同盟之前，承受较高的远洋补给与移民阻力。"
 AUTO_MODIFIER_NAME_oe_col2_eco_overseas_overstretch: "早期远洋拓殖后勤吃紧"
 AUTO_MODIFIER_DESC_oe_col2_eco_overseas_overstretch: "1520年前启动跨海殖民宪章的旧大陆国家会面临早期远洋补给折损；派遣内阁「边疆勘界与补给官」即可立即化解此项阻力。"
 oe_col2_atlantic_stepping_stones: "大西洋群岛跳板航线"
 oe_col2_chesapeake_elysia_corridor: "切萨皮克—赫斯珀里亚东岸航道"
 oe_col2_siberian_river_corridor: "乌拉尔—西伯利亚大河拓垦走廊"
 oe_col2_red_sea_indian_ocean_corridor: "红海—印度洋季风商道"
 oe_col2_avoid_premature_interior_africa: "暂缓早期深入非洲内陆腹地"
 oe_col2_frontier_surveyor: "派遣边疆勘界与补给官"
 oe_col2_frontier_surveyor_desc: "选派精明干练的勘界补给官统筹边疆驿站、海图与医药粮秣，扩展殖民半径与移民规模，并在五年内豁免五大生态区的早期自然补给阻力。"
 oe_col2_frontier_surveyor_active: "在[SCOPE.sProvince('target').GetNameWithHighlightOnly]统筹边疆勘界与补给"
 oe_col2_frontier_surveyor_action: "向[SCOPE.sProvince('target').GetNameWithNoTooltip]派遣边疆勘界官"
