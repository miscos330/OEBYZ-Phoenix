 oe_col2_frontier_surveyor_action_progress_long_wordier: "[SCOPE.sProvince('target').GetNameWithNoTooltip]边疆勘界补给线运转中"
 oe_col2_frontier_surveyor_action_progress_tooltip: "统筹边疆驿站、海图与医药粮秣，扩展殖民半径与移民规模，并豁免五大生态区早期自然补给阻力。"
