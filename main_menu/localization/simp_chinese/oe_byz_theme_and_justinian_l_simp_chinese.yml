 oe_byz_theme_system_reform: "军区制"
 oe_byz_theme_system_reform_desc: "一个由省级总部和军队组成的系统，以一名统帅为首，肩负着保护当地居民和应[GetCountry('BYZ').GetFlavorRank]的要求建立权威的双重责任。这个系统取代了戴克里先的省级行政管理，自那时以来一直为我们的人民服务。"
 oe_byz_justinian_code: "东罗马官僚传统"
 oe_byz_justinian_code_desc: "东罗马帝国长期以来依靠行政官僚而非贵族管理国家，完整的官僚体系和官僚传统深刻影响了东罗马的治理模式与社会结构"
