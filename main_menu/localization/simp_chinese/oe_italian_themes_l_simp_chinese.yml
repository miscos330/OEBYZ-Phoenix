l_simp_chinese:
 oe_ir_italian_theme: "创建意大利军区"
 oe_ir_italian_theme_desc: "#italic “意大利归于御座，诸城当各有所任。”#!\n\n东罗马及其附属国拥有意大利地区至少50%的可征服地点后，花费20帝国权威，决定意大利军府的治理路线，并在军事令中开放“在意大利创建军区”。"
 OE_IR_ITALY_HALF_REQUIRED: "东罗马及其附属国拥有意大利地区至少50%的可征服地点。"
 oe_create_theme_in_italy: "在意大利创建军区"
 oe_create_theme_in_italy_desc: "花费5帝国权威，在直属意大利领地创建军区。选择一个省份作为首府，在其所属区域的其他直属意大利地点设置治所。军区类型由改革事件的选择决定：尊重自治创建意大利军区，整合意大利创建拉丁军区。两类均不可转换，但可通过裁撤军区行动撤销。"
 OE_IT_THEME_CHOICE_REQUIRED: "已在意大利治理事件中选择并解锁意大利军区或拉丁军区。"
 OE_IT_THEME_NO_PROVINCE: "没有可用省份：首府须由东罗马直接拥有、位于意大利，且所属区域尚无其他军区建筑。"
 oe_italian_themes.1.t: "意大利的军府与城邦"
 oe_italian_themes.1.d: "御座的旗帜再度越过亚得里亚海，意大利诸城的使节携着市议会的印玺、行会的账簿与地方贵族的请愿来到宫廷。军队已经打开了道路，如何使这些繁盛而骄傲的城市长久归心，却仍有待裁决。\n\n一条道路是承认诸城的自治，以市民主持军府，令作坊、田庄与贸易继续繁荣，将财赋与忠诚奉献给帝国。另一条道路则是以拉丁军府重整地方，由贵族驻节、士兵设防，使意大利成为帝国军队与财政共同支撑的坚实根基。御座今日的裁决，将决定诸城今后的归属与责任。"
 oe_italian_themes.1.a: "尊重意大利的自治。"
 oe_italian_themes.1.b: "我们要整合意大利。"
 OE_IT_THEME_AUTONOMY_UNLOCK: "解锁意大利军区：重视加工、原产与财赋，缴纳15%税基贡金，不参加宗主国战争，不领取军饷或兵源；不可转换。"
 OE_IT_THEME_LATIN_UNLOCK: "解锁拉丁军区：由贵族与军人治理，领取军饷与兵源，沿用普通军区的陆军供养法律，不缴纳贡金；不可转换。"
 oe_empire_theme_italian: "意大利军区"
 oe_empire_theme_italian_desc: "由市民主持地方事务的意大利军府，向御座缴纳15%税基贡金，促进全国加工效率，不参加宗主国战争；禁止转教与军区类型转换。"
 oe_empire_theme_latin: "拉丁军区"
 oe_empire_theme_latin_desc: "奉御座之命整合意大利的军事军府，提高宗主国雇佣兵维护效率，领取军饷与兵源而不缴纳贡金；禁止转教与军区类型转换。"
 oe_byz_theme_italian_subject: "意大利军区制"
 oe_byz_theme_italian_subject_desc: "王冠授予军府统辖之权，市民主持诸城的财赋与生产。制度推动资本主义经济，提高市民满意度和建筑维护效率。中央辖制同样保障军府对御座的忠顺。"
 oe_byz_theme_latin_subject: "拉丁军区制"
 oe_byz_theme_latin_subject_desc: "贵族与驻军共同担负意大利的整合，沿用普通军区的预期陆军、人力上限和军饷法律待遇。"
 oe_byz_theme_italian_seat: "意大利军区首府"
 oe_byz_theme_italian_seat_desc: "由市民管理的军府首府，提高当地加工效率、原产规模与产出，向建筑所有者提供相当于当地税基100%的金币和每月10金币。"
 oe_byz_theme_italian_post: "意大利军区治所"
 oe_byz_theme_italian_post_desc: "由市民主持的地方治所，提高当地加工效率、原产规模与产出，向建筑所有者提供相当于当地税基15%的金币。"
 oe_byz_theme_latin_seat: "拉丁军区首府"
 oe_byz_theme_latin_seat_desc: "贵族驻节的军府首府，向建筑所有者提供相当于当地税基100%的金币和每月10金币，并为所在地增加每月50人力。"
 oe_byz_theme_latin_post: "拉丁军区治所"
 oe_byz_theme_latin_post_desc: "士兵驻守的军府治所，向建筑所有者提供相当于当地税基15%的金币，为所在地增加每月5人力、人力修正50%，并开放陆军招募。"
 oe_pillars_italian_theme: "意大利军区"
 oe_pillars_italian_theme_desc: "承担意大利地方经济与财赋的自治军府，不计入军饷和兵源。"
 oe_pillars_latin_theme: "拉丁军区"
 oe_pillars_latin_theme_desc: "承担意大利军事整合的军府，计入军饷和兵源。"
