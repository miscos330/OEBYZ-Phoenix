 # NEW 2026-11-23 v21.0 Module F: 6 Civilization Parliaments, 12 Issues, 24 Agendas & 10 Cabinet Actions (oe_gov2_). Generated by gen_v210_parliaments_cabinet.py.
 oe_gov2_estates_general:0 "法兰西三级会议"
 oe_gov2_estates_general_desc:0 "奉王室诏谕召集教士、贵族与第三等级代表共议特别税赋与陈情书，在提升国家税效与政治影响力的同时，赋予贵族与教士阶层更显著的议程分量，略微制约王权独断。"
 oe_gov2_dec_adopt_estates_general.title:0 "诏开法兰西三级会议"
 oe_gov2_dec_adopt_estates_general.desc:0 "传谕全国教区、封君与特许市镇选派代表赴廷，正式确立「法兰西三级会议」为常设议会制度，以阶层议政空间换取更充沛的财税效率与政治影响力。"
 oe_gov2_dec_adopt_estates_general.a:0 "传诏三级代表入觐御前"
 oe_gov2_sejm:0 "波立瑟姆大会"
 oe_gov2_sejm_desc:0 "由什拉赫塔贵族与元老院主教主导的瑟姆大会奉行黄金自由传统，显著强化重骑兵战力与阶层满意度，但需让渡部分王室权力并面对更高的议案通过门槛。"
 oe_gov2_dec_adopt_sejm.title:0 "确立波立瑟姆大会制"
 oe_gov2_dec_adopt_sejm.desc:0 "确认元老院与众议院宪章，正式奉行「波立瑟姆大会」议会制，以保障贵族与教士阶层自由换取精锐重骑武备与稳固的阶层向心力。"
 oe_gov2_dec_adopt_sejm.a:0 "颁署瑟姆大会契约宪章"
 oe_gov2_cortes:0 "伊比利亚科尔特斯议会"
 oe_gov2_cortes_desc:0 "植根于伊比利亚自治市镇特许状与海港行会，科尔特斯议会汇聚市民代表、教士与贵族共商国是，降低议案通过门槛并振作海洋商贸与海权存在，略微触动保守贵族利益。"
 oe_gov2_dec_adopt_cortes.title:0 "敕立科尔特斯议会"
 oe_gov2_dec_adopt_cortes.desc:0 "在诸城代表、主教与贵族见证下重申市镇特许状，确立「伊比利亚科尔特斯议会」，以更高效的议会协商与海商动能推动王国远洋经略。"
 oe_gov2_dec_adopt_cortes.a:0 "于科尔特斯御前宣誓守约"
 oe_gov2_diwan_i_khas:0 "印度御前迪万"
 oe_gov2_diwan_i_khas_desc:0 "御前迪万枢密厅汇集曼萨卜达尔显贵、宗教法学家与商帮巨贾共参大政，显著提升立法效率、内阁效能与异教宽容度，唯维持华美宫廷礼制需承担更高宫廷开支。"
 oe_gov2_dec_adopt_diwan_i_khas.title:0 "诏设印度御前迪万"
 oe_gov2_dec_adopt_diwan_i_khas.desc:0 "于皇城内廷正式设立「印度御前迪万」议政体系，统筹贵族将领、宗教学者与商贸大贾，以更高行政立法效能与多元宽容格局统御次大陆广土众民。"
 oe_gov2_dec_adopt_diwan_i_khas.a:0 "启开御前迪万议政大殿"
 oe_gov2_shah_divan:0 "波斯王庭沙赫议会"
 oe_gov2_shah_divan_desc:0 "承袭波斯宫廷文书治术传统，由大维齐尔统筹勋贵、经学家与巴扎商帮共议枢政，显著增进外交声誉、文化底蕴与商贸收入，但朝堂派系折冲使维稳成本略升。"
 oe_gov2_dec_adopt_shah_divan.title:0 "敕建王庭沙赫议会"
 oe_gov2_dec_adopt_shah_divan.desc:0 "整饬宰相书房、行省埃米尔、法学家与巴扎商帮，正式确立「波斯王庭沙赫议会」，弘扬波斯化宫廷礼乐声望并贯通高原丝路财源。"
 oe_gov2_dec_adopt_shah_divan.a:0 "敕命大维齐尔主持王庭议会"
 oe_gov2_shogun_hyojoshu:0 "幕府评定众"
 oe_gov2_shogun_hyojoshu_desc:0 "汇聚谱代宿老、寺社奉行与港埠町人豪商的幕府评定众，可于乡里郡县召开基层评议，强化地方控制与武家军纪，但维系诸藩纲纪会略微增加外交行政耗费。"
 oe_gov2_dec_adopt_shogun_hyojoshu.title:0 "开设幕府评定众"
 oe_gov2_dec_adopt_shogun_hyojoshu.desc:0 "拔擢武家宿老、寺社奉行与特许商镇代表入值评定席，正式设立「幕府评定众」，允许召集乡里评议并显著强化行省控制力与武士军纪。"
 oe_gov2_dec_adopt_shogun_hyojoshu.a:0 "颁行评定众合议条规"
 oe_gov2_pi_fra_taille_ordinance:0 "皇家泰伊税与督察清丈令"
 oe_gov2_pi_fra_taille_ordinance_desc:0 "经三级会议核准派遣王室督察官清核各省泰伊税册，显著提升税效与地方控制度，但会招致贵族抵触并略降农民满意度。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_fra_taille:0 "皇家泰伊税清丈体系"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_fra_taille:0 "统一的泰伊税册与督察巡查显著充实王库并加强地方控制，唯令乡间税负压力加重。"
 oe_gov2_pi_fra_gallican_liberties:0 "高卢教会自主国事诏书"
 oe_gov2_pi_fra_gallican_liberties_desc:0 "经三级会议重申本国教会圣职叙任自主权，显著巩固王室权力、政治影响力与教士向心力，但会在域外外交场合引发些许非议。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_fra_gallican:0 "高卢教会国事诏书"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_fra_gallican:0 "本国教会自主体统凝聚教士阶层拥护王权，略微牵动对外邦交声誉。"
 oe_gov2_pi_plc_kwarciane_hussars:0 "四分之一军与翼骑兵军役法"
 oe_gov2_pi_plc_kwarciane_hussars_desc:0 "由瑟姆大会批准拨出四分之一王领岁入供养常备翼骑兵与边防重骑军团，大幅增强重骑突击与陆军士气，但需承担更高军费维护与初期开支。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_plc_hussars:0 "四分之一常备翼骑兵制"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_plc_hussars:0 "常备贵族翼骑兵军团在战场上所向披靡，唯日常装备与马政供养开销不菲。"
 oe_gov2_pi_plc_warsaw_confederation:0 "华沙宗教协约与波罗的海谷贸令"
 oe_gov2_pi_plc_warsaw_confederation_desc:0 "以瑟姆法典确立各教派和平共处并畅通维斯瓦河谷物外运商路，提升异端宽容、出口效率与粮食产出，唯令保守教士阶层颇有微词。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_plc_warsaw:0 "华沙宗教协约与谷贸宪章"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_plc_warsaw:0 "宗教宽容与稳定的河道谷物出口推动商农并兴，但触动传统教士特权。"
 oe_gov2_pi_ibe_casa_contratacion:0 "科尔特斯海商特许与航运总署令"
 oe_gov2_pi_ibe_casa_contratacion_desc:0 "经科尔特斯市民代表倡议设立远洋航运总署与航海海图馆，显著增强海贸效率、海军航程与商人势力，略微触动内陆贵族传统权益。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_ibe_contratacion:0 "皇家海商与航运总署特许"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_ibe_contratacion:0 "严密的护航账册与远洋领航体系令伊比利亚海贸蒸蒸日上，略损内陆勋贵地位。"
 oe_gov2_pi_ibe_hermandad_fueros:0 "圣兄弟会治安与自治特许法"
 oe_gov2_pi_ibe_hermandad_fueros_desc:0 "授命各地圣兄弟会乡勇巡守官道并重申市镇自治法度，有效遏制叛乱苗头、提升地方控制与农民满意度，同时向贵族略作税限折衷。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_ibe_hermandad:0 "圣兄弟会官道治安体系"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_ibe_hermandad:0 "各地圣兄弟会常年巡弋官道、清剿盗匪并安抚乡民，但相应放宽部分贵族税限。"
 oe_gov2_pi_ind_zabt_revenue:0 "扎卜特十年田赋清丈律"
 oe_gov2_pi_ind_zabt_revenue_desc:0 "经御前迪万推行扎卜特十年常产清丈法，按季风丰歉均定田赋，显著提高税收、粮食产出与内阁效率，但触动地方柴明达尔贵族既得利益。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_ind_zabt:0 "扎卜特帝国田赋定额"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_ind_zabt:0 "以十年实测产额核定田赋既保障农桑又充实国库，令地方豪强无从截留。"
 oe_gov2_pi_ind_sulh_i_kul:0 "万教和睦（苏勒赫-库勒）御谕"
 oe_gov2_pi_ind_sulh_i_kul_desc:0 "于御前迪万颁布万教和睦御谕，以宽厚治道融合次大陆多元族群与宗教，大幅提升异教宽容、全阶层满意度与科研活力，唯令正统教士颇感忧虑。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_ind_sulh:0 "万教和睦治道御谕"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_ind_sulh:0 "宽容共荣的帝国治道稳固多元行省民心并激发学术思辨，但略减保守教士满意度。"
 oe_gov2_pi_per_silk_caravanserai:0 "皇家商队驿馆与生丝专营法"
 oe_gov2_pi_per_silk_caravanserai_desc:0 "由王庭沙赫议会拨款沿高原商道兴建石砌商队驿馆并统筹生丝外贸，显著提高贸易收入、商队运力与筑路速度，同时付出初期工程款与小幅直税折让。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_per_caravanserai:0 "皇家商队驿馆丝路网"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_per_caravanserai:0 "遍布高原的坚固驿馆与生丝专营商网令商贸繁荣，唯须承担修缮与税率让利。"
 oe_gov2_pi_per_ghulam_corps:0 "沙赫亲卫古拉姆与炮兵敕令"
 oe_gov2_pi_per_ghulam_corps_desc:0 "经王庭沙赫议会敕编直属御前的古拉姆常备军与青铜炮兵队，显著强化军纪、炮兵战力与王室集权，但抬高军费维护并引起旧勋贵不满。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_per_ghulam:0 "沙赫亲卫古拉姆炮军"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_per_ghulam:0 "由国库直饷的亲卫常备军与火炮队大幅增强军纪与王权，唯军费负担相应加重。"
 oe_gov2_pi_jap_kenchi_cadastre:0 "太阁检地与石高清丈令"
 oe_gov2_pi_jap_kenchi_cadastre_desc:0 "由幕府评定众颁行统一尺丈与石高检地令，厘清诸国水田产额与贡米定额，显著提升税效、粮食供应与地方控制，但短期内加重村社农民压力。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_jap_kenchi:0 "全国检地石高台账"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_jap_kenchi:0 "统一的检地石高台账令财税与军粮供应井然有序，但对村社农户课责趋严。"
 oe_gov2_pi_jap_sankin_kotai:0 "参勤交代与一国一城令"
 oe_gov2_pi_jap_sankin_kotai_desc:0 "经评定众颁行参勤交代与一国一城条令，令诸藩大名定期入觐并整饬城砦体系，显著提高附庸忠诚、幕府集权与本土防御，但引起地方武家勋贵不满。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pi_jap_sankin:0 "参勤交代与城砦纲纪"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pi_jap_sankin:0 "诸藩轮番入觐与整饬城砦极大巩固附庸忠诚与中央权威，令地方豪族颇受掣肘。"
 oe_gov2_pa_nobles_tax_rebate:0 "颁授领地田赋回扣特许"
 oe_gov2_pa_nobles_tax_rebate_desc:0 "贵族议员允诺在议会中投下赞成票，条件是朝廷给予五年领地田赋回扣，以换取更积极的贵族征召兵源。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_nobles_tax_rebate:0 "领地田赋回扣特许"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_nobles_tax_rebate:0 "对贵族世袭领地实行临时税额回扣，换取贵族满意度与更大规模的封建征召兵。"
 oe_gov2_pa_nobles_officer_academy:0 "拨款兴办贵族军官学堂"
 oe_gov2_pa_nobles_officer_academy_desc:0 "勋贵武门请求朝廷拨款资助子弟骑射与兵法学堂，以此换取贵族议员对当前议案的坚定支持。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_nobles_academy:0 "贵族军官学堂拨款"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_nobles_academy:0 "官助贵族军官学堂持续培育陆军传统与士气，唯略微抬高宫廷供养开销。"
 oe_gov2_pa_nobles_frontier_march:0 "确任世袭边疆藩镇宪章"
 oe_gov2_pa_nobles_frontier_march_desc:0 "边疆封君要求朝廷正式确认其世袭边镇守备特权，作为在议会中动员贵族支持的条件。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_nobles_march:0 "世袭边疆藩镇宪章"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_nobles_march:0 "确认边疆世家防务特权使边堡防卫与戍军补充提速，但略微削弱中央皇权占比。"
 oe_gov2_pa_nobles_hunting_forests:0 "划定领主围猎禁苑林地"
 oe_gov2_pa_nobles_hunting_forests_desc:0 "大贵族请求王室划定专属围猎林苑以彰门第荣耀，虽易引发乡民不满，却可换得贵族力挺。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_nobles_forests:0 "领主围猎禁苑特权"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_nobles_forests:0 "专属围猎林苑彰显朝廷威仪并取悦勋贵，但压缩了农民樵采生计。"
 oe_gov2_pa_nobles_fortress_patronage:0 "颁授贵族城堡修缮津贴"
 oe_gov2_pa_nobles_fortress_patronage_desc:0 "各地城主世家愿以议会赞成票交换国库协修石砌堡垒的津贴，减轻要塞维护压力。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_nobles_forts:0 "贵族城堡修缮津贴"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_nobles_forts:0 "朝廷与世家共担城堡修缮令要塞维护费下降，但略微影响直征税效。"
 oe_gov2_pa_burghers_guild_charter:0 "确任城镇手工业行会宪章"
 oe_gov2_pa_burghers_guild_charter_desc:0 "各城行会执事愿以市民议席赞成票换取工坊自治与成色检验宪章，提升生产效率但略降市民税限。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_burghers_guild:0 "城镇手工业行会宪章"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_burghers_guild:0 "受宪章保障的手工业行会提高全国生产效率并安抚市民，同时略微降低市民最高税率。"
 oe_gov2_pa_burghers_naval_subsidy:0 "核准商船护航与海军津贴"
 oe_gov2_pa_burghers_naval_subsidy_desc:0 "海港商帮请求朝廷拨款加强要害航道武装护航，借此换取市民投票并显著提升海贸与护航效能。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_burghers_naval:0 "商船武装护航津贴"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_burghers_naval:0 "官助武装护航船队显著保护远洋商路与海贸收益，唯海军日常维护成本略升。"
 oe_gov2_pa_burghers_road_commission:0 "委任商路驿道督修司"
 oe_gov2_pa_burghers_road_commission_desc:0 "陆路商团请求朝廷与商会合办官道督修司，加快全国道路修筑与首都政令通达速度。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_burghers_roads:0 "商路驿道督修委任"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_burghers_roads:0 "官商合修干道大幅缩短筑路工期并加快中央控制辐射，但略微摊薄短期税效。"
 oe_gov2_pa_burghers_free_port:0 "颁授自由转口港关税豁免"
 oe_gov2_pa_burghers_free_port_desc:0 "沿海商埠代表吁请暂免大港转口厘税以广招远商，提升商人实力与进口效率，略减直接税入。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_burghers_freeport:0 "自由转口港免税特许"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_burghers_freeport:0 "自由转口免税政策广聚四方货船并壮大商人势力，唯短期直接税效小幅回落。"
 oe_gov2_pa_burghers_artisan_fairs:0 "特许岁时百工商贸大集"
 oe_gov2_pa_burghers_artisan_fairs_desc:0 "市政商绅请求颁授岁时百工大集特许状，带动全国繁荣度与出口贸易，略微让渡部分王室控制权。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_burghers_fairs:0 "岁时百工大集特许"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_burghers_fairs:0 "自治运作的岁时集市推动城镇繁荣与出口增长，同时略微分散王室集权。"
 oe_gov2_pa_burghers_municipal_credit:0 "核准市政仓栈信贷契约"
 oe_gov2_pa_burghers_municipal_credit_desc:0 "城镇银号商团愿以议会支持换取发行仓单信贷票据之权，压低国债利率并节省建筑成本，唯伴随极微通胀。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_burghers_credit:0 "市政仓栈信贷体系"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_burghers_credit:0 "以货栈实物担保的市政信贷有效降低借贷利率与营建开支，但会带来轻微货币通胀。"
 oe_gov2_pa_clergy_monastery_grants:0 "敕拨修道院与圣祠常产"
 oe_gov2_pa_clergy_monastery_grants_desc:0 "教士代表吁请朝廷续拨名山修院与圣祠香火常产，以换取议会赞成票并显著增进宗教影响力。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_clergy_monastery:0 "修道院与圣祠常产拨款"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_clergy_monastery:0 "充实的修院与圣祠常产显著提升宗教影响力与教士满意度，略微降低国家直接税效。"
 oe_gov2_pa_clergy_university_grants:0 "敕赐经院与大学学田拨款"
 oe_gov2_pa_clergy_university_grants_desc:0 "硕学教士愿以议席支持换取大学教席与藏书楼专款，加速思潮传播并持续提升全国识字率。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_clergy_university:0 "经院与大学学田拨款"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_clergy_university:0 "专款资助的高等学府加速新思潮扎根与全国识字率攀升，同时略微推高宫廷文教开销。"
 oe_gov2_pa_clergy_sanctuary_rights:0 "确任教区庇护与济贫权"
 oe_gov2_pa_clergy_sanctuary_rights_desc:0 "宗教议员要求以成文法确认教区庇护与济贫旧例，改善维稳效率并安抚教士，但略缓地方控制度攀升。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_clergy_sanctuary:0 "教区庇护与济贫特权"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_clergy_sanctuary:0 "获法典确认的教区庇护旧制缓和社会戾气并赢得教士拥护，唯使中央控制推进略缓。"
 oe_gov2_pa_clergy_scriptorium_press:0 "资助教廷缮经院与国史编纂"
 oe_gov2_pa_clergy_scriptorium_press_desc:0 "修院与寺庙学府愿以议会支持换取缮经与编史免税优待，弘扬文化底蕴并加快教化传布。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_clergy_scriptorium:0 "缮经院与国史编纂特许"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_clergy_scriptorium:0 "获准免税的缮经院与史馆显著滋养文化传统与传教速度，相应略降教士最高税率。"
 oe_gov2_pa_clergy_almshouse_relief:0 "专款资助教区养济院与施药局"
 oe_gov2_pa_clergy_almshouse_relief_desc:0 "宗教慈善团体吁请朝廷专款扶持城乡养济院与施药局，惠泽民生人口增长并兼得教士与农民好感。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_clergy_almshouse:0 "教区养济院与施药局"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_clergy_almshouse:0 "遍设城乡的养济院与施药局温和促进人口繁衍并赢得教民两界赞誉，略微摊薄税效。"
 oe_gov2_pa_peasants_frontier_grain:0 "核准边疆义仓赈粮与贷种令"
 oe_gov2_pa_peasants_frontier_grain_desc:0 "乡民代表恳请朝廷充实边疆义仓并春贷良种，以换取农民阶层赞成票并全面稳固粮食产储。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_peasants_grain:0 "边疆义仓赈粮与春耕贷种"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_peasants_grain:0 "官仓赈粮与春耕贷种显著提高粮食产量与储量上限，安抚乡间但略减短期税效。"
 oe_gov2_pa_peasants_militia_charter:0 "颁授乡团民兵自卫宪章"
 oe_gov2_pa_peasants_militia_charter_desc:0 "自由村社请求朝廷敕准乡团民兵自卫操演，提升征召兵规模与战力，却会引发传统贵族戒心。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_peasants_militia:0 "乡团民兵自卫宪章"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_peasants_militia:0 "获许操演的乡团民兵显著充实农民征召兵并强化战力，但令传统领主贵族颇为忌惮。"
 oe_gov2_pa_peasants_timber_charter:0 "保障乡村樵采与水磨公用权"
 oe_gov2_pa_peasants_timber_charter_desc:0 "乡村议员要求明令保护村社薪柴林地与公用水磨，提升原料产出与农民满意度，同时略降农民税限。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_peasants_timber:0 "乡村樵采与水磨公用权"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_peasants_timber:0 "保障乡村公用林水资源激发基层农林原料产出，并相应放宽农民税率上限。"
 oe_gov2_pa_peasants_salt_abatement:0 "施行盐税与炉灶杂捐减免"
 oe_gov2_pa_peasants_salt_abatement_desc:0 "农民代表以议会赞成票换取五年减免食盐与炉灶杂捐，显著平抑乡间骚动，唯短期税效有所回落。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_peasants_salt:0 "盐税与炉灶杂捐减免"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_peasants_salt:0 "减轻食盐与灶户杂税令百姓安居乐业、叛乱势头消弭，但国库直税收益略减。"
 oe_gov2_pa_peasants_bridge_corvee:0 "折免桥道杂派夫役特许"
 oe_gov2_pa_peasants_bridge_corvee_desc:0 "乡老恳请农忙时节暂停强派桥道夫役，以换取议会支持并增进地方繁荣，但官府营建工期略缓。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_peasants_bridge:0 "折免桥道杂派夫役"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_peasants_bridge:0 "农忙期间停派桥道夫役使乡民得以专务农桑、民生向荣，唯官办土木工程节奏略缓。"
 oe_gov2_pa_tribes_grazing_compact:0 "核准草原四季转场牧地协约"
 oe_gov2_pa_tribes_grazing_compact_desc:0 "部落酋长以议会支持换取王廷敕认冬夏转场草场边界，增强轻骑战力与部族忠诚，但略缓地方控制推进。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_tribes_grazing:0 "四季转场牧地协约"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_tribes_grazing:0 "受王廷承认的季节转场牧道维系部落骑兵精锐与忠诚，唯使中央直接控制略受掣肘。"
 oe_gov2_pa_tribes_caravan_escort:0 "颁授部族商队护卫与山口津贴"
 oe_gov2_pa_tribes_caravan_escort_desc:0 "边疆诸部愿以议会赞成票换取山口商道护卫权与贡赋优免，保障远程商队往来并增进贸易收益。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_tribes_caravan:0 "部族商队护卫特许"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_tribes_caravan:0 "由边疆部族承揽山口商道护卫使商贸收益提升，同时相应降低部落最高税限。"
 oe_gov2_pa_tribes_horse_tribute:0 "确任部落战马征调与牧场优免"
 oe_gov2_pa_tribes_horse_tribute_desc:0 "部落长老允诺在议会中全力配合，条件是减免马场税赋以换取更充沛的部落骑兵征召与行军机动力。"
 STATIC_MODIFIER_NAME_oe_gov2_mod_pa_tribes_horses:0 "部落战马征调优免"
 STATIC_MODIFIER_DESC_oe_gov2_mod_pa_tribes_horses:0 "以牧场优免激励各部充实战马征调，显著扩大部落征召兵并加快大军行军速度，略减直税。"
 oe_gov2_cab_cadastral_survey:0 "行省田赋清丈与税籍审计"
 oe_gov2_cab_cadastral_survey_desc:0 "派遣干练阁臣亲赴目标行省清丈田亩、稽核隐匿税籍并追查中饱，显著提升当地控制度上限与全国税效，但会招致贵族不满并引起轻微地方骚动。"
