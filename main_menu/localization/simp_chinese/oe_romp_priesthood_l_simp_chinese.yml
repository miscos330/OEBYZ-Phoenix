 STATIC_MODIFIER_NAME_oe_romp_mod_secular_games:0 "世纪大典盛景"
 STATIC_MODIFIER_DESC_oe_romp_mod_secular_games:0 "全帝国共庆净化与更新纪元的世纪大典，威望、繁荣、文化传统与各阶层向心力齐齐高涨。"
 STATIC_MODIFIER_NAME_oe_romp_mod_vestal_flame:0 "维斯塔永恒圣火"
 STATIC_MODIFIER_DESC_oe_romp_mod_vestal_flame:0 "维斯塔贞女团护持的不熄圣火照耀帝国疆土，安定民心、压制叛乱并庇护生民免遭疫病侵袭。"
 STATIC_MODIFIER_NAME_oe_romp_loc_triumphal_vow:0 "凯旋誓愿神殿"
 STATIC_MODIFIER_DESC_oe_romp_loc_triumphal_vow:0 "以赫赫战功向战神还愿兴建的凯旋纪念神殿，化作本城邦的文化丰碑、繁荣枢纽与坚固精神堡垒。"
 STATIC_MODIFIER_NAME_oe_romp_mod_sibylline_war:0 "西比尔神谕：战神铁律"
 STATIC_MODIFIER_DESC_oe_romp_mod_sibylline_war:0 "十五人祭司团自西比尔神谕书求得战时吉兆，军团上下士气如虹、攻城拔寨势不可挡。"
 STATIC_MODIFIER_NAME_oe_romp_mod_sibylline_plague:0 "西比尔神谕：洁净涤灾"
 STATIC_MODIFIER_DESC_oe_romp_mod_sibylline_plague:0 "依西比尔神谕书行全境洁净与蛇杖祭典，广设疗养圣泉并囤积民粮，有力阻遏黑死与诸疫蔓延。"
 STATIC_MODIFIER_NAME_oe_romp_mod_sibylline_peace:0 "西比尔神谕：太平丰年"
 STATIC_MODIFIER_DESC_oe_romp_mod_sibylline_peace:0 "依西比尔神谕书行承平丰年献祭，稳固中央控制与法度秩序，促成百业兴旺、商旅辐辏。"
 STATIC_MODIFIER_NAME_oe_romp_mod_symposium_patronage:0 "新柏拉图哲学会饮"
 STATIC_MODIFIER_DESC_oe_romp_mod_symposium_patronage:0 "帝国赞助柏拉图与斯多葛学者齐聚会饮论道，催生大批古典注疏、科学思辨与高妙艺术杰作。"
 STATIC_MODIFIER_NAME_oe_romp_mod_julian_scroll:0 "尤利安《太阳王颂》秘卷"
 STATIC_MODIFIER_DESC_oe_romp_mod_julian_scroll:0 "皇室藏书阁珍藏并研读的尤利安古典哲学残卷，在宫廷与学界播下太阳神学与古典复兴的火种。"
 STATIC_MODIFIER_NAME_oe_romp_mod_hagia_sophia_preserved:0 "圣索菲亚宽容护持"
 STATIC_MODIFIER_DESC_oe_romp_mod_hagia_sophia_preserved:0 "圣索菲亚大教堂在叙马库斯敕令庇护下得以完整保留为基督教圣堂，大幅赢得境内基督徒与欧陆诸邦之敬重。"
 STATIC_MODIFIER_NAME_oe_romp_mod_hagia_sophia_pantheon:0 "神圣智慧—太阳万神殿"
 STATIC_MODIFIER_DESC_oe_romp_mod_hagia_sophia_pantheon:0 "宏伟穹顶重祝为献予神圣智慧、雅典娜与无敌太阳的帝国万神殿，令古典信仰威望与传道号召空前炽盛。"
 STATIC_MODIFIER_NAME_oe_romp_mod_hagia_sophia_dual:0 "圣索菲亚双礼共享"
 STATIC_MODIFIER_DESC_oe_romp_mod_hagia_sophia_dual:0 "帝国划定双礼共享仪规，使圣索菲亚穹顶兼具基督徒礼拜与哲学古典纪念双重尊严，于古今之间求得稳健平衡。"
 STATIC_MODIFIER_NAME_oe_romp_mod_edict_symmachus:0 "新叙马库斯宽容诏"
 STATIC_MODIFIER_DESC_oe_romp_mod_edict_symmachus:0 "以帝国大诏向基督教世界承诺保障礼拜自由与教会财产，化解十字军敌意并在广袤疆域奠定和平共处之基。"
 STATIC_MODIFIER_NAME_oe_romp_mod_classical_supremacy:0 "古典独尊宣言"
 STATIC_MODIFIER_DESC_oe_romp_mod_classical_supremacy:0 "断然拒斥外邦诘难并宣布古典诸神礼制为帝国唯一正朔，以铁血意志激昂军团斗志并全力推进本土归化。"
 STATIC_MODIFIER_NAME_oe_romp_mod_janus_pax:0 "雅努斯闭门：罗马和平"
 STATIC_MODIFIER_DESC_oe_romp_mod_janus_pax:0 "自奥古斯都以降首度隆重关闭双面门神雅努斯圣殿青铜大门，宣告四海承平，商贸与百业迎来盛世荣景。"
 STATIC_MODIFIER_NAME_oe_romp_mod_indo_greek_dialogue:0 "印希哲学对话遗产"
 STATIC_MODIFIER_DESC_oe_romp_mod_indo_greek_dialogue:0 "重续米南德王《弥兰王问经》千年雅谈，斯多葛学者与印度正法哲人互通义理，增益远东商力、科研视野与宗教宽容。"
 STATIC_MODIFIER_NAME_oe_romp_mod_logos_tao_dialogue:0 "逻各斯与大道会通"
 STATIC_MODIFIER_DESC_oe_romp_mod_logos_tao_dialogue:0 "大祭司团使节与东方儒道硕学共论天命、大道与逻各斯之理，促成跨欧亚典籍互译、识字跃升与礼仪邦交。"
 STATIC_MODIFIER_NAME_oe_romp_mod_heliocentric_dawn:0 "无敌太阳日心曙光"
 STATIC_MODIFIER_DESC_oe_romp_mod_heliocentric_dawn:0 "近代天文学日心体系与尤利安《太阳王颂》宇宙观不谋而合，信仰与科学零隙同行，开启帝国理性启蒙新纪元。"
 STATIC_MODIFIER_NAME_oe_romp_mod_solar_enlightenment:0 "太阳理性启蒙派"
 STATIC_MODIFIER_DESC_oe_romp_mod_solar_enlightenment:0 "新古典理性主义主掌帝国学坛，将万神殿重塑为倡导理性、宽容、印刷出版与公民德性的启蒙灯塔。"
 STATIC_MODIFIER_NAME_oe_romp_mod_sacred_tradition:0 "神圣传统复兴派"
 STATIC_MODIFIER_DESC_oe_romp_mod_sacred_tradition:0 "大祭司团坚守秘仪神圣权威与古礼军魂，赋予神谕沛然神力并锻造信仰坚贞、纪律森严的帝国柱石。"
 STATIC_MODIFIER_NAME_oe_romp_mod_classical_encyclopedia:0 "拉丁—希腊经典大百科"
 STATIC_MODIFIER_DESC_oe_romp_mod_classical_encyclopedia:0 "君士坦丁堡、罗马与雅典三地学园合编的巨帙百科问世，汇聚两千年古典文献与自然格致，照耀欧亚文坛。"
 STATIC_MODIFIER_NAME_oe_romp_mod_civic_imperium:0 "公民宗教宪政帝国"
 STATIC_MODIFIER_DESC_oe_romp_mod_civic_imperium:0 "借罗马元老院与公民宗教传统疏导革命浪潮，以法度、公民德性与阶层协和构筑稳如磐石的近代公民帝国。"
 STATIC_MODIFIER_NAME_oe_romp_mod_new_saeculum:0 "万神之城新世纪大典"
 STATIC_MODIFIER_DESC_oe_romp_mod_new_saeculum:0 "横跨罗马与君士坦丁堡双都举行的千年世纪大典震撼寰宇，帝国正统、威望、文化光华与民生繁荣皆臻极盛。"
 STATIC_MODIFIER_NAME_oe_romp_roma_aeterna_legacy:0 "罗马永恒：古典启蒙遗产"
 STATIC_MODIFIER_DESC_oe_romp_roma_aeterna_legacy:0 "从米斯特拉斯卜列东的残灯孤影到横跨欧亚的太阳启蒙纪元，重光之罗马多神教已铸就千古不朽的文明丰碑。"
 oe_romp_consecrate_pantheon_seat:0 "敕定万神殿神位"
 oe_romp_human_only_action_tt:0 "仅人类玩家可执行此祭仪行动"
 oe_romp_consecrate_pantheon_seat_desc:0 "召集群祭司于卡皮托利乌姆六柱万神殿举行入祀大典，在行政、外交或军事神柱中轮换已解锁的新神位或迎回原版诸神，严守六柱拱门平衡。"
 oe_romp_consecrate_pantheon_seat_past:0 "已举行万神殿神位敕定大典，重新整肃帝国六柱主神序列。"
 oe_romp_consecrate_pantheon_seat_effect_tt:0 "开启六柱万神殿神位敕定议程，可在已解锁的罗马与跨欧亚合祀神祇间安全轮换神位（活跃神祇恒保持 6 尊）。"
 oe_romp_consult_sibylline_books:0 "查阅西比尔神谕书"
 oe_romp_consult_sibylline_books_desc:0 "命十五人神谕祭司团开启珍藏于朱庇特神庙地窖的西比尔神谕书卷，依战时、疫时或太平形势求取十年护国神诏；若已采行“占兆与西比尔神谕书”面向，还将获得强化神谕。"
 oe_romp_consult_sibylline_books_past:0 "已启封西比尔神谕书，依神谕颁行护国祭诏。"
 oe_romp_consult_sibylline_books_effect_tt:0 "触发西比尔神谕三选一祭诏（战神铁律、洁净涤灾或太平丰年）。"
 oe_romp_declare_secular_games:0 "召开世纪大典"
 oe_romp_declare_secular_games_desc:0 "循奥古斯都古制举办净化与更新纪元的世纪大典（Ludi Saeculares），授予全帝国长达十年的盛世大修正，并于都城弘扬罗马多神教复兴思潮。"
 oe_romp_declare_secular_games_past:0 "已隆重召开世纪大典，普天共庆罗马新纪元。"
 oe_romp_consecrate_triumphal_temple:0 "敕建凯旋神殿"
 oe_romp_consecrate_triumphal_temple_desc:0 "于大战告捷或陆军传统鼎盛之际向战神还愿，在选定城邦或都城敕建二十年凯旋誓愿神殿并留存一座不朽古典纪念碑艺术品。"
 oe_romp_consecrate_triumphal_temple_past:0 "已敕建凯旋誓愿神殿并竖立古典凯旋纪念碑。"
 oe_romp_triumphal_temple_allow_tt:0 "近五年内曾赢得一场战争，或国家陆军传统至少达到 #Y 40#!。"
 oe_romp_sanctify_vestal_flame:0 "重燃维斯塔圣火"
 oe_romp_sanctify_vestal_flame_desc:0 "由维斯塔贞女团举行神圣洁净仪典重燃不熄灶火，赐予十年稳定、抗疫与平抑叛乱护佑，并安抚首都行省民众。"
 oe_romp_sanctify_vestal_flame_past:0 "已重燃维斯塔永恒圣火，护佑帝国社稷与都城安宁。"
 oe_romp_vestal_flame_satisfaction_tt:0 "首都所在行省内我方治下主要阶层民众将获得满意度提升。"
 oe_romp_hold_neoplatonic_symposium:0 "召开新柏拉图哲学会饮"
 oe_romp_hold_neoplatonic_symposium_desc:0 "仿效雅典与米斯特拉斯学园古风，延请哲人、学者与艺术家共聚会饮论道，推动科研与识字率跃升；若兼行“米斯特拉斯学园”或“太一论”面向，还将获赠珍贵古典哲学典籍。"
 oe_romp_hold_neoplatonic_symposium_past:0 "已召开新柏拉图哲学会饮，昌明古典学术与人文风尚。"
 oe_romp_hold_neoplatonic_symposium_effect_tt:0 "触发新柏拉图哲学会饮事件，可延揽学者、推进科研或获赠古典典籍。"
