l_simp_chinese:
# NEW 2026-11-21 v9.8 Worker 2: Religio Romana Priesthood & Modifiers (oe_romp_). Generated by gen_romp_priesthood.py.
 oe_romp_augury_sibylline_aspect:0 "占兆与西比尔神谕书"
 oe_romp_augury_sibylline_aspect_desc:0 "由占兆官团观鸟察兆，并由十五人神谕祭司团掌管西比尔神谕书卷；逢战祸与灾异则启卷求示，拓展可选神谕并延长神恩时效。"
 oe_romp_vestal_flame_aspect:0 "维斯塔圣火团"
 oe_romp_vestal_flame_aspect_desc:0 "在帝国圣坛常燃不熄的维斯塔灶火，象征罗马城邦与万户家宅之永存；护佑国土安宁繁荣，亦能抵御疫病侵袭。"
 oe_romp_ludi_saeculares_aspect:0 "世纪大典"
 oe_romp_ludi_saeculares_aspect_desc:0 "循奥古斯都古制举办净化与更新纪元的世纪大典，以全城献祭、合唱圣诗与竞技盛典凝聚帝国威仪与各阶层向心力。"
 oe_romp_pontifex_maximus_aspect:0 "大祭司长统领制"
 oe_romp_pontifex_maximus_aspect_desc:0 "由紫衣皇帝亲执大祭司长权杖，统摄罗马大祭司团、神殿财库与历法裁定；压制教士割据而强化皇权，并可与神君奥古斯都崇拜双槽合璧。"
 oe_romp_mistra_academy_aspect:0 "米斯特拉斯新柏拉图学园"
 oe_romp_mistra_academy_aspect_desc:0 "承袭格奥尔基·格米斯托斯·卜列东在米斯特拉斯复兴柏拉图与古典宇宙论的学统，将哲思研习、识字启蒙与典雅艺术融入诸神祭仪。"
 oe_romp_pax_deorum_toleration_aspect:0 "众神和平宽容敕令"
 oe_romp_pax_deorum_toleration_aspect_desc:0 "秉持古罗马宽容并蓄之风，容许境内基督徒、穆斯林与各族旧俗依法行礼，以仁厚礼法换取多元文化归心与外邦敬重。"
 oe_romp_triumphal_vow_mars_aspect:0 "玛尔斯凯旋誓愿"
 oe_romp_triumphal_vow_mars_aspect_desc:0 "出征前于战神广场向复仇战神立誓献庙，凯旋归来则奉战利品并举行凯旋式；铁血军纪与攻城锐气由此薪火相传。"
 oe_romp_mystery_initiations_aspect:0 "帝国秘仪结社"
 oe_romp_mystery_initiations_aspect_desc:0 "统合厄琉息斯、萨莫色雷斯、密特拉与伊西斯诸大秘仪兄弟会，以庄严入门洗礼激发神谕威能、凝聚跨邦声望并加速古教传播。"
 oe_romp_pontifical_college_law:0 "祭司团宪制"
 oe_romp_pontifical_college_law_desc:0 "界定帝国大祭司团的组织原则与权责归属，决定神权究竟归于紫衣皇权、元老祭司世家、新柏拉图哲人抑或费提亚尔宣战祭司。"
 oe_romp_pax_deorum_edict_law:0 "众神和平与异教礼遇律"
 oe_romp_pax_deorum_edict_law_desc:0 "确立帝国对待基督徒、异域神祇与古典古礼的法定方针，在叙马库斯宽容诏、罗马诠释合祀、无敌太阳统摄论与严守古礼之间抉择。"
 oe_romp_io_sacred_calendar_law:0 "罗马圣历协定"
 oe_romp_io_sacred_calendar_law_desc:0 "由罗马大祭司团共同遵守的历法与祭典正朔，统筹儒略古历祭典、奥林匹亚四年历与太阳启蒙公历三大礼制体系。"
 oe_romp_io_cal_julian_fasti:0 "儒略古历祭典"
 oe_romp_io_cal_julian_fasti_desc:0 "沿用凯撒修订之《罗马历表（Fasti）》统辖全年十二月吉凶日与古典祭仪，减轻罗马节庆开支并稳固成员国社稷秩序。"
 oe_romp_io_cal_olympiad_cycle:0 "奥林匹亚四年历"
 oe_romp_io_cal_olympiad_cycle_desc:0 "以奥林匹亚四年一届之神圣休战与竞技纪年统合万邦祭期，弘扬希罗文化传统、延长神谕加持并提升大祭司团威望。"
 oe_romp_io_cal_solar_enlightenment:0 "太阳启蒙公历"
 oe_romp_io_cal_solar_enlightenment_desc:0 "结合天文观测与无敌太阳冬至纪年校订历法，使古典神庙与近代天文学堂互通有无，显著推进科研速度、识字率与神谕威能。"
 oe_romp_pol_imperial_pontifex:0 "皇帝兼任大祭司长"
 oe_romp_pol_imperial_pontifex_desc:0 "由奥古斯都皇帝亲自兼领大祭司长，直辖神庙敕建、神谕占卜与祭司任免，令政教威柄尽归皇室。"
 oe_romp_pol_senatorial_flamens:0 "元老祭司长共治"
 oe_romp_pol_senatorial_flamens_desc:0 "循共和与元首制旧典，由名门元老出任朱庇特、玛尔斯与奎里努斯专属祭司长，在贵族与神职间维系稳固宪政共治。"
 oe_romp_pol_philosopher_hierophants:0 "哲人秘仪导师制"
 oe_romp_pol_philosopher_hierophants_desc:0 "延请柏拉图学园与斯多葛哲人出任秘仪导师，将神庙改建为讲堂、天文馆与译经院，推动学术革新与识字普及。"
 oe_romp_pol_militant_fetiales:0 "费提亚尔宣战祭司团"
 oe_romp_pol_militant_fetiales_desc:0 "重设执掌正义战争宣誓与血矛掷界古礼的费提亚尔祭司团，随军祭祀战神，砥砺军团纪律、攻城锐志与持久耐战力。"
 oe_romp_pol_edict_of_symmachus:0 "叙马库斯宽容诏"
 oe_romp_pol_edict_of_symmachus_desc:0 "铭记四世纪罗马元老叙马库斯“通往伟大奥秘之路绝非仅有一条”之名言，依法保障基督徒与各教礼拜自由，显著缓和内外敌意。"
 oe_romp_pol_interpretatio_syncretism:0 "罗马诠释合祀制"
 oe_romp_pol_interpretatio_syncretism_desc:0 "仿效古典帝国的“罗马诠释”传统，将埃及、波斯与欧亚各地神祇纳入万神殿谱系合祀，兼顾多元文化包容与异教温和归化。"
 oe_romp_pol_solar_henotheism:0 "无敌太阳统摄论"
 oe_romp_pol_solar_henotheism_desc:0 "以奥勒良与尤利安的无敌太阳神学统摄万神，主张诸神皆为至高太阳本源之显化，既凝聚古教神谕威能，又加速正统信仰弘扬。"
 oe_romp_pol_strict_ancestral_rites:0 "严守古礼复兴"
 oe_romp_pol_strict_ancestral_rites_desc:0 "厉行古典正统祭仪与神庙重建，严禁公职背离祖宗旧礼；虽激化与异教徒的摩擦，却能以雷霆之势重塑罗马古教版图。"
 oe_romp_pontificate:0 "罗马大祭司团"
 oe_romp_pontificate_desc:0 "统摄罗马多神教诸国圣历、祭仪与万神殿神位的最高祭司机构，由紫衣大祭司长总领，维系各成员国之间的众神和平与古礼共融。"
 OE_ROMP_PONTIFEX_MAXIMUS:0 "大祭司长"
