l_simp_chinese:
# NEW 2026-11-22 v10.0 Worker 2 (Slot 77): Playable Poland-Lithuania Intermarium (oe_pplc_). Generated by gen_playable_plc.py.
 oe_pplc_player_only_tt:0 "当前国家由人类玩家执掌波兰—立陶宛三海联邦主线。"
 oe_pplc_b_relief_savior:0 "翼骑兵千里驰援之恩"
 oe_pplc_b_warsaw_amity:0 "华沙宽容与三海善邻"
 oe_pplc_b_partition_defiance:0 "挫败瓜分密约宿怨"
 oe_pplc_b_valois_vasa_court:0 "自由选王宫廷联谊"
 oe_pplc_ref_tripartite_commonwealth:0 "波兰—立陶宛—鲁塞尼亚三国联邦"
 oe_pplc_ref_tripartite_commonwealth_desc:0 "循 1658 年《哈佳奇条约》确立波兰王国、立陶宛大公国与鲁塞尼亚大公国三邦平等共治的联邦架构，将第聂伯河哥萨克军团与东正教贵族纳入共和国法统，化边疆内患为黑海雄师。"
 oe_pplc_ref_may_third_constitution:0 "五月三日立宪共和国"
 oe_pplc_ref_may_third_constitution_desc:0 "1791 年大瑟姆颁行的欧洲第一部近代成文宪法：永久废除撕裂议会的自由否决权（Liberum Veto），确立世袭立宪君主制、三权分立与近代常备军财政，令三海联邦在近代化浪潮中浴火重生。"
 oe_pplc_sejm_charter_law:0 "共和国瑟姆宪政法"
 oe_pplc_sejm_charter_law_desc:0 "界定波兰—立陶宛瑟姆议会的表决制度、王室领地核算准则与贵族黄金自由边界，左右联邦在贵族分权、执行派整顿与近代多数决立宪之间的国运走向。"
 oe_pplc_pol_golden_liberty:0 "黄金自由贵族共议制"
 oe_pplc_pol_golden_liberty_desc:0 "奉行《新法须经公议》与贵族一致同意原则，以优厚庄园特权与重骑兵动员换取什拉赫塔倾力效忠，但议会否决权风险亦随之攀升。"
 oe_pplc_pol_executionist_reform:0 "执行派王室领地追缴法"
 oe_pplc_pol_executionist_reform_desc:0 "依 16 世纪中小贵族执行派运动纲领，严格核查并追回大贵族非法侵占的王室庄园（Królewszczyzny），以稳定国库岁入支撑常备边防军。"
 oe_pplc_pol_majority_sejm:0 "瑟姆多数决与近代立宪制"
 oe_pplc_pol_majority_sejm_desc:0 "废止单票否决陋习，推行以公民代表多数决为核心的近代瑟姆立法程序，兼顾市民参政、行政效率与启蒙学术进步。"
 oe_pplc_gdansk_grain_exchange:0 "但泽维斯瓦谷物交易所"
 oe_pplc_gdansk_grain_exchange_desc:0 "矗立于维斯瓦河与黑海—波罗的海转运枢纽的皇家谷物仓栈与期货交易所。汇集波兰、立陶宛与鲁塞尼亚沃野的麦粮驳船，对接北海与地中海大市场，大幅拓展本地商人容量、储粮能力与商埠权重。"
 oe_pplc_gdansk_grain_exchange_maint:0 "但泽维斯瓦谷物交易所（运营维护）"
 oe_pplc_winged_hussars:0 "波立联邦重装翼骑兵（Husaria）"
 oe_pplc_winged_hussars_desc:0 "身披精钢胸甲、背插鹰羽木翼、手持五米中空长枪与重马刀的三海联邦突击精锐。曾在 1605 年基尔霍尔姆战役以寡击众碾碎瑞典枪阵，拥有全欧亚最具毁灭性的士气与杀伤冲锋威力。"
 oe_pplc_registered_cossack_dragoons:0 "巴托里登记哥萨克龙骑兵"
 oe_pplc_registered_cossack_dragoons_desc:0 "1578 年斯蒂芬·巴托里正式编入王室军籍的第聂伯河哥萨克快骑火枪兵团。既能驰骋大草原机动侦察，亦善依大车堡垒下马齐射，是联邦守护黑海边疆与反击游牧袭扰的犀利轻骑。"
 oe_pplc_adv_winged_hussaria:0 "三海联邦翼骑兵与哥萨克协同操典"
 oe_pplc_adv_winged_hussaria_desc:0 "总结基尔霍尔姆与第聂伯边疆战例，将中空超长枪重装翼骑兵冲锋与巴托里登记哥萨克龙骑兵火枪侧翼掩护合编为统一战术体系，铸就东欧无敌骑兵霸业。"
 STATIC_MODIFIER_NAME_oe_pplc_veto_paralysis_mod:0 "自由否决权议会瘫痪"
 STATIC_MODIFIER_DESC_oe_pplc_veto_paralysis_mod:0 "大贵族与外敌借「我反对！」（Nie pozwalam!）反复撕裂瑟姆议会，导致税赋停摆、立法梗阻与国政涣散。唯有借执行派追缴或颁行立宪方能根除积弊。"
 STATIC_MODIFIER_NAME_oe_pplc_jagiellon_baltic_drive_mod:0 "雅盖沃波罗的海进军令"
 STATIC_MODIFIER_DESC_oe_pplc_jagiellon_baltic_drive_mod:0 "承袭格伦瓦德大捷余威，波立联军整饬重骑与攻城辎重，誓复维斯瓦河口与普鲁士出海走廊。"
 STATIC_MODIFIER_NAME_oe_pplc_ruthenian_east_wing_mod:0 "立陶宛—鲁塞尼亚东翼整饬"
 STATIC_MODIFIER_DESC_oe_pplc_ruthenian_east_wing_mod:0 "稳固维尔纽斯至基辅的东疆行政与商道，加快领土整合与边疆税收归拢。"
 STATIC_MODIFIER_NAME_oe_pplc_gdansk_free_port_mod:0 "但泽皇家自由港特许"
 STATIC_MODIFIER_DESC_oe_pplc_gdansk_free_port_mod:0 "赋予但泽高度商业自治与谷物转口特权，维斯瓦河巨量粮食源源汇入北海市场，国库与海商共荣。"
 STATIC_MODIFIER_NAME_oe_pplc_crown_baltic_customs_mod:0 "波罗的海王室直管海关"
 STATIC_MODIFIER_DESC_oe_pplc_crown_baltic_customs_mod:0 "将但泽与马尔堡港务收归王室税务官直辖，以强硬行政控制保障国库直接关税并遏制大贵族分权。"
 STATIC_MODIFIER_NAME_oe_pplc_nihil_novi_compact_mod:0 "《新法须经公议》贵族盟约"
 STATIC_MODIFIER_DESC_oe_pplc_nihil_novi_compact_mod:0 "1505 年拉多姆瑟姆确立未经众议院同意王室不得新立国法，换取什拉赫塔骑士倾力效命沙场。"
 STATIC_MODIFIER_NAME_oe_pplc_crown_towns_bulwark_mod:0 "王室城市与国库抗衡"
 STATIC_MODIFIER_DESC_oe_pplc_crown_towns_bulwark_mod:0 "依托克拉科夫、华沙与但泽市民阶层及王室关税抵制寡头逼宫，为后续立宪集权埋下伏笔。"
 STATIC_MODIFIER_NAME_oe_pplc_executionist_audit_mod:0 "执行派王室庄园清丈"
 STATIC_MODIFIER_DESC_oe_pplc_executionist_audit_mod:0 "中小贵族与王室合力追回被大寡头私占的王室领地，整顿四分之一税（Kwarta）充作常备军经费。"
 STATIC_MODIFIER_NAME_oe_pplc_folwark_export_boom_mod:0 "维斯瓦庄园（Folwark）谷物暴富"
 STATIC_MODIFIER_DESC_oe_pplc_folwark_export_boom_mod:0 "大庄园农奴化耕作令粮食顺维斯瓦河倾泻西欧，带来滚滚白银，却也加剧底层农民怨望。"
 STATIC_MODIFIER_NAME_oe_pplc_free_tenant_levy_mod:0 "自由佃农谷物定税制"
 STATIC_MODIFIER_DESC_oe_pplc_free_tenant_levy_mod:0 "以货币定税取代苛酷农奴劳役，激发波立乡村自耕农与城市手工业协同繁荣。"
 STATIC_MODIFIER_NAME_oe_pplc_warsaw_confederation_mod:0 "1573《华沙宗教宽容联盟》"
 STATIC_MODIFIER_DESC_oe_pplc_warsaw_confederation_mod:0 "联邦各教派贵族立誓永不因信仰差异兵戎相见，令波立成为宗教战争时代欧洲绝无仅有的宽容灯塔。"
 STATIC_MODIFIER_NAME_oe_pplc_counter_reformation_zeal_mod:0 "天主教正统护教盟约"
 STATIC_MODIFIER_DESC_oe_pplc_counter_reformation_zeal_mod:0 "强化耶稣会学院与拉丁主教威仪，巩固境内天主教主流凝聚力与教廷外交支持。"
 STATIC_MODIFIER_NAME_oe_pplc_registered_cossacks_mod:0 "第聂伯登记哥萨克边防军"
 STATIC_MODIFIER_DESC_oe_pplc_registered_cossacks_mod:0 "编入王室名册的哥萨克军团享有薪饷与自治权，化作联邦抵御克里米亚袭扰与黑海争锋的敏捷轻骑。"
 STATIC_MODIFIER_NAME_oe_pplc_kircholm_thunder_mod:0 "基尔霍尔姆雷霆：翼骑兵巅峰"
 STATIC_MODIFIER_DESC_oe_pplc_kircholm_thunder_mod:0 "精锐重装翼骑兵长枪如林、羽翼震空，以排山倒海的正面冲击令欧陆强敌闻风丧胆。"
 STATIC_MODIFIER_NAME_oe_pplc_combined_hussar_dragoons_mod:0 "翼骑兵与龙骑兵协同新操"
 STATIC_MODIFIER_DESC_oe_pplc_combined_hussar_dragoons_mod:0 "以重骑突击配轻装火枪龙骑侧翼掩护，均衡提升野战纪律、轻骑机动与军费效能。"
 STATIC_MODIFIER_NAME_oe_pplc_hadiach_tripartite_mod:0 "《哈佳奇条约》三邦同心"
 STATIC_MODIFIER_DESC_oe_pplc_hadiach_tripartite_mod:0 "波兰、立陶宛与鲁塞尼亚平等结盟，彻底消弭第聂伯河百余年教派与阶层裂痕，铸就不可撼动的东欧多民族共主联邦。"
 STATIC_MODIFIER_NAME_oe_pplc_intermarium_corridor_mod:0 "波罗的海—黑海三海大商道"
 STATIC_MODIFIER_DESC_oe_pplc_intermarium_corridor_mod:0 "打通维斯瓦河、第聂伯河与德涅斯特河水陆联运，令北欧琥珀林木与黑海丝绸谷物在联邦枢纽交汇。"
 STATIC_MODIFIER_NAME_oe_pplc_intermarium_bastion_mod:0 "三海战略铁壁同盟"
 STATIC_MODIFIER_DESC_oe_pplc_intermarium_bastion_mod:0 "自但泽、里加至基辅、阿克曼筑起纵深堡垒与外交防务网，令强邻难以逾越三海走廊。"
 STATIC_MODIFIER_NAME_oe_pplc_education_commission_mod:0 "华沙国民教育委员会"
 STATIC_MODIFIER_DESC_oe_pplc_education_commission_mod:0 "欧洲首个国家教育部系统革新世俗学堂、近代科学课程与公民宪政启蒙，令联邦识字率与科研突飞猛进。"
 STATIC_MODIFIER_NAME_oe_pplc_anti_partition_mobilization_mod:0 "粉碎瓜分：全民卫国总动员"
 STATIC_MODIFIER_DESC_oe_pplc_anti_partition_mobilization_mod:0 "面对四邻密谋瓜分的惊天危机，联邦提前扩编十万常备军与火炮要塞，以铁血意志震慑环伺强敌。"
 STATIC_MODIFIER_NAME_oe_pplc_intermarium_constitutional_hegemon_mod:0 "三海立宪霸主（1791《五月三日宪法》）"
 STATIC_MODIFIER_DESC_oe_pplc_intermarium_constitutional_hegemon_mod:0 "彻底埋葬自由否决权与瓜分魔咒！凭借《五月三日宪法》的近代立宪体制、翼骑兵荣光与波罗的海—黑海商贸动脉，波兰—立陶宛成为巍然屹立的近代东欧超级强权。"
 STATIC_MODIFIER_NAME_oe_pplc_savior_of_christendom_mod:0 "翼骑兵解围之光：基督教世界柱石"
 STATIC_MODIFIER_DESC_oe_pplc_savior_of_christendom_mod:0 "「我来，我见，上帝赐胜」——波立翼骑兵跨国驰援危城，赢得全欧震动的外交声望与无双军威。"
 oe_pplc_dec_executionist_audit.title:0 "执行派追缴王室领地"
 oe_pplc_dec_executionist_audit.desc:0 "响应中小贵族执行派运动（Ruch Egzekucyjny），派遣王室检察官清丈被大贵族长期侵占的王室领地（Królewszczyzny），回收岁入并压低自由否决权腐化指数。"
 oe_pplc_dec_executionist_audit.a:0 "下令清丈王室庄园并整肃寡头"
 oe_pplc_dec_executionist_audit_tt:0 "使自由否决权指数下降 #G -15#!，充盈国库并获得 #Y 10 年#!「执行派王室庄园清丈」修正（每 10 年可执行一次）。"
 oe_pplc_dec_expand_cossack_register.title:0 "扩充第聂伯登记哥萨克名册"
 oe_pplc_dec_expand_cossack_register.desc:0 "承袭斯蒂芬·巴托里 1578 年军制革新，向第聂伯河边疆哥萨克颁授王室军饷名册，提升登记哥萨克等级（最高 4 级），解锁并强化哥萨克龙骑兵与黑海前哨防务。"
 oe_pplc_dec_expand_cossack_register.a:0 "颁授哥萨克军籍与边防薪饷"
 oe_pplc_dec_expand_cossack_register_tt:0 "登记哥萨克等级 #G +1#!（上限 4 级），提升哥萨克阶层满意度并获得 #Y 15 年#!「第聂伯登记哥萨克边防军」修正。"
 oe_pplc_dec_abolish_liberum_veto.title:0 "废除自由否决权：颁布《五月三日宪法》"
 oe_pplc_dec_abolish_liberum_veto.desc:0 "在瑟姆否决权腐化已被压制（≤ 20）或步入 1785 年启蒙大潮之际，召集大瑟姆永久废除「自由否决权」，确立世袭立宪君主制与三权分立，彻底改写波兰—立陶宛命运。"
 oe_pplc_dec_abolish_liberum_veto.a:0 "大瑟姆起立宣誓：通过《五月三日宪法》！"
 oe_pplc_dec_abolish_liberum_veto_tt:0 "永久废除自由否决权（指数清零），启用「五月三日立宪共和国」改革并授予永久传奇修正「三海立宪霸主」。"
 oe_pplc.1.t:0 "雅盖沃的誓言：克雷沃与格伦瓦德余韵"
 oe_pplc.1.d:0 "克雷沃盟约与坦能堡平野的硝烟重新划定了东欧天平。克拉科夫的王冠与维尔纽斯的大公旗帜已紧紧相连，此刻御前会议必须抉择下一代人的战略重心：是乘条顿骑士团元气大伤之际北上收复波美拉尼亚与波罗的海出海口，还是先将立陶宛与鲁塞尼亚的辽阔东翼理顺为一统磐石？"
 oe_pplc.1.a:0 "铁骑北指：乘胜夺回波美拉尼亚与维斯瓦出海口"
 oe_pplc.1.a.tt:0 "获得 #Y 20 年#!「雅盖沃波罗的海进军令」（重骑兵战力与攻城强化）及 #G +10#! 陆军传统。"
 oe_pplc.1.b:0 "东翼固本：深耕维尔纽斯至基辅的鲁塞尼亚腹地"
 oe_pplc.1.b.tt:0 "获得 #Y 20 年#!「立陶宛—鲁塞尼亚东翼整饬」（整合速度、控制力与税收加成）并压低否决权指数 #G -5#!。"
 oe_pplc.2.t:0 "十三年战争与但泽黄金出海口"
 oe_pplc.2.d:0 "历经漫长的普鲁士城市同盟之战，马尔堡红砖要塞与但泽海港终于归入联邦版图！沿着维斯瓦河顺流而下的黑麦与小麦驳船，如今可直通北海与佛兰德斯大市场。但泽市议会呈上厚礼，恳求王室颁布高度自治的自由港特许状；而财政大臣则主张趁机设立王室直管海关。"
 oe_pplc.2.a:0 "颁授但泽高度自由港特许状，做大北海谷物转口"
 oe_pplc.2.a.tt:0 "获得 #G +180#! 金币及 #Y 30 年#!「但泽皇家自由港特许」（商人容量、海贸效率与市民满意）。"
 oe_pplc.2.b:0 "设立王室直管波罗的海海关，强化王权税基"
 oe_pplc.2.b.tt:0 "自由否决权指数 #G -8#!，获得 #Y 30 年#!「波罗的海王室直管海关」（税效与王室权力提升）。"
 oe_pplc.3.t:0 "1505《新法须经公议》（Nihil Novi）"
 oe_pplc.3.d:0 "拉多姆瑟姆议会群情激昂！各地什拉赫塔贵族代表联合递交宪章，要求王室庄严宣誓：「凡关乎国家公法与公民自由之新政，未经参议院与众议院一致公议，国王不得擅立（Nihil Novi nisi commune consensu）。」签署此约，万千骑士将为国效死，却也将开启贵族黄金自由与议会掣肘的漫长博弈。"
 oe_pplc.3.a:0 "签署《新法须经公议》，换取什拉赫塔倾力出兵"
 oe_pplc.3.a.tt:0 "自由否决权指数上升 #R +15#!，获得 #Y 30 年#!「《新法须经公议》贵族盟约」（重骑兵与贵族满意大增）。"
 oe_pplc.3.b:0 "依托王室城市与国库财力强顶贵族逼宫"
 oe_pplc.3.b.tt:0 "自由否决权指数下降 #G -10#!，贵族满意度受损，但获得 #Y 25 年#!「王室城市与国库抗衡」强化中央权威。"
 oe_pplc.4.t:0 "执行派运动（Ruch Egzekucyjny）与王室领地追缴"
 oe_pplc.4.d:0 "面对少数大镁纳特寡头蚕食国库、私吞王室庄园的乱象，瑟姆中的中小贵族掀起了声势浩大的「执行派运动」（Ruch Egzekucyjny），高呼「执行旧法、归还王产」！若王室顺势联手执行派清丈庄园并抽出四分之一岁入编练常备军（Kwarta），便能一举打断寡头脊梁。"
 oe_pplc.4.a:0 "力挺执行派追缴王室庄园，整顿常备军财政"
 oe_pplc.4.a.tt:0 "自由否决权指数大幅下降 #G -15#!，获得 #G +200#! 金币及 #Y 30 年#!「执行派王室庄园清丈」。"
 oe_pplc.4.b:0 "妥协折中：以豁免旧账换取大贵族暂保朝局平稳"
 oe_pplc.4.b.tt:0 "自由否决权指数上升 #R +8#!，获得 #G +8#! 稳定度与贵族满意提升。"
 oe_pplc.5.t:0 "维斯瓦 Folwark 谷仓的代价"
 oe_pplc.5.d:0 "西欧人口暴涨令阿姆斯特丹与伦敦的粮价节节攀升，波兰与立陶宛成了整个欧洲的超级谷仓！大贵族纷纷将村社土地并入直营大庄园（Folwark），迫使农民每周承担繁重劳役以生产出口黑麦。黄金正涌入庄园府邸，但农奴化的锁链也在悄然勒紧乡村的未来。"
 oe_pplc.5.a:0 "大举扩建 Folwark 出口庄园，攫取西欧谷物暴利"
 oe_pplc.5.a.tt:0 "获得 #G +300#! 金币与 #Y 30 年#!「维斯瓦庄园谷物暴富」，但自由否决权指数 #R +8#! 且农民满意度下降。"
 oe_pplc.5.b:0 "推行自由佃农货币谷物税，兼顾乡村繁荣与近代转型"
 oe_pplc.5.b.tt:0 "获得 #Y 30 年#!「自由佃农谷物定税制」（繁荣度、产效与农民满意提升），自由否决权指数 #G -5#!。"
 oe_pplc.6.t:0 "1569 卢布林大联邦与 1573《华沙宗教宽容联盟》"
 oe_pplc.6.d:0 "在卢布林宪政整合的荣光之后，当西欧深陷圣巴托洛缪大屠杀与残酷宗教内战的血海时，华沙召集的大瑟姆却准备写下欧洲文明史上的不朽篇章：天主教、东正教与新教诸派贵族共同起草《华沙联盟条约》，誓言永不因信仰分歧流血相残，以宽容守望整座共和国！"
 oe_pplc.6.a:0 "签署《华沙宗教宽容联盟》，铸就欧洲宽容灯塔"
 oe_pplc.6.a.tt:0 "激活华沙宽容标志（联动普世教务 2.0），获得 #Y 40 年#!「1573《华沙宗教宽容联盟》」及 #G +15#! 威望。"
 oe_pplc.6.b:0 "高举拉丁天主教护教大旗，重振教会正统权威"
 oe_pplc.6.b.tt:0 "获得 #Y 30 年#!「天主教正统护教盟约」（本教容忍、宗教影响力与传教速率提升）。"
 oe_pplc.7.t:0 "自由选王制（Wolna Elekcja）与《亨利条款》"
 oe_pplc.7.d:0 "华沙城郊沃拉原野旌旗蔽日，数万佩剑贵族策马齐聚，准备在自由选王大会（Wolna Elekcja）上亲手选出共和国的新君，并令其宣誓恪守《亨利条款》！欧陆诸派使节穿梭帐篷之间：法兰西瓦卢瓦王子、特兰西瓦尼亚铁腕名将斯蒂芬·巴托里、瑞典瓦萨王室与本土皮亚斯特候补各展筹码。"
 oe_pplc.7.a:0 "推举斯蒂芬·巴托里：铁腕统帅与哥萨克军制革新"
 oe_pplc.7.a.tt:0 "自由否决权指数 #G -5#!，登记哥萨克等级 #G +1#!，获得 #G +12#! 陆军传统与 #G +10#! 威望。"
 oe_pplc.7.b:0 "推举本土皮亚斯特候补：杜绝外邦干涉，压制议会分权"
 oe_pplc.7.b.tt:0 "自由否决权指数大幅下降 #G -12#!，获得 #G +10#! 稳定度与王室合法性提升。"
 oe_pplc.7.c:0 "迎立法兰西瓦卢瓦王子：借重西欧外交网络与盛名"
 oe_pplc.7.c.tt:0 "获得 #G +20#! 威望并与法兰西增进邦交，但自由否决权指数因《亨利条款》妥协上升 #R +10#!。"
 oe_pplc.7.opt4:0 "迎立瑞典瓦萨王室：谋求波罗的海双冠联统野望"
 oe_pplc.7.opt4.tt:0 "获得 #G +12#! 海军传统与 #G +120#! 金币，但自由否决权指数上升 #R +8#!。"
 oe_pplc.8.t:0 "巴托里改革与登记哥萨克（Reiestrovy Kozaky）"
 oe_pplc.8.d:0 "第聂伯河下游的扎波罗热哥萨克桀骜不驯，既能痛击克里米亚掠骑，也可能因土地与宗教摩擦燃起东疆烽火。国王力主颁布 1578 年式的《登记哥萨克条例》：由国库正式支饷，授予自治军籍、战旗与权杖，将这支草原劲旅化为共和国最锋利的黑海前哨。"
 oe_pplc.8.a:0 "正式编练登记哥萨克军籍，以薪饷自治换取黑海劲旅"
 oe_pplc.8.a.tt:0 "耗费 #R -100#! 金币，登记哥萨克等级 #G +1#!，解锁哥萨克龙骑兵并获 #Y 30 年#!「第聂伯登记哥萨克边防军」。"
 oe_pplc.8.b:0 "节省军饷，仍由大贵族私人庄园卫队弹压东疆"
 oe_pplc.8.b.tt:0 "节省国库并令贵族满意，但自由否决权指数上升 #R +6#! 且哥萨克积怨加深。"
 oe_pplc.9.t:0 "基尔霍尔姆雷霆：翼骑兵（Husaria）的巅峰"
 oe_pplc.9.d:0 "1605 年基尔霍尔姆平原的传说传遍全欧：数千名身披精钢胸甲、背负鹰羽双翼的联邦重装翼骑兵（Husaria），在二十分钟内如惊雷般碾碎了三倍于己的新式长矛火枪方阵！全军将士群情振奋，大盖特曼请求将此战法铸为联邦常备陆军灵魂。"
 oe_pplc.9.a:0 "倾力扩编精钢重装翼骑兵突击军团"
 oe_pplc.9.a.tt:0 "获得 #Y 35 年#!「基尔霍尔姆雷霆：翼骑兵巅峰」（重骑兵战力 #G +18%#!、士气与陆军传统）及 #G +15#! 威望。"
 oe_pplc.9.b:0 "推行翼骑兵与火枪龙骑兵协同新操，兼顾纪律与军费"
 oe_pplc.9.b.tt:0 "获得 #Y 35 年#!「翼骑兵与龙骑兵协同新操」（纪律、轻骑兵战力与维护效率加成）。"
 oe_pplc.10.t:0 "「大洪水」（Potop）与 1658《哈佳奇三国联邦条约》"
 oe_pplc.10.d:0 "东欧骤起惊涛骇浪！北疆、东疆与草原烽烟四起，「大洪水」（Potop）正考验着共和国生死存亡的极限。值此危局，哥萨克盖特曼伊万·维霍夫斯基递来划时代的《哈佳奇条约》方案：将鲁塞尼亚升格为与波兰、立陶宛平起平坐的第三大公国，赋予东正教大主教参议院席位，以「三国平等联邦」彻底化干戈为玉帛！"
 oe_pplc.10.a:0 "签署 1658《哈佳奇条约》：缔造波兰—立陶宛—鲁塞尼亚三国联邦！"
 oe_pplc.10.a.tt:0 "启用「波兰—立陶宛—鲁塞尼亚三国联邦」改革，登记哥萨克 #G +2#!，获得 #Y 40 年#!「《哈佳奇条约》三邦同心」！"
 oe_pplc.10.b:0 "拒绝平权方案，以贵族铁骑强力弹压东疆叛乱"
 oe_pplc.10.b.tt:0 "获得 #G +10#! 陆军传统与贵族支持，但自由否决权指数上升 #R +10#! 且稳定度受损。"
 oe_pplc.11.t:0 "「我反对！」（Nie pozwalam!）——自由否决权瘫痪危机"
 oe_pplc.11.d:0 "华沙瑟姆会场骤然炸裂！正当紧急军费法案行将通过之际，一名受外国使节重金收买的议员猛然起身狂呼「我反对！」（Nie pozwalam!），依滥用的自由否决权一票震碎整届议会！邻国宫廷窃笑「波兰赖无政府而存」——若此刻不敢以武力结盟（Konfederacja）强推多数决，共和国恐将步入慢性窒息。"
 oe_pplc.11.a:0 "组建爱国武力联盟（Konfederacja），强推议会多数决！"
 oe_pplc.11.a.tt:0 "自由否决权指数骤降 #G -25#!，解除或大幅缓解议会瘫痪，代价为短期稳定度与贵族震荡。"
 oe_pplc.11.b:0 "重金赎买阻挠派大贵族，息事宁人以换取短暂妥协"
 oe_pplc.11.b.tt:0 "耗费 #R -180#! 金币，自由否决权指数反升 #R +10#!，议会积弊愈发深重。"
 oe_pplc.12.t:0 "三海走廊贯通（Intermarium）"
 oe_pplc.12.d:0 "从波罗的海的但泽与里加，穿越维斯瓦河与第聂伯河沃野，直抵黑海之滨的阿克曼与克里米亚要津——波兰—立陶宛梦寐以求的「三海走廊」（Intermarium）终于在我们的旗帜下贯通！北欧毛皮木材与黑海丝绸谷物奔流交汇，欧亚中部动脉已牢牢握于联邦之手。"
 oe_pplc.12.a:0 "颁行波罗的海—黑海水陆转运大宪章（联通欧亚经济 2.0）"
 oe_pplc.12.a.tt:0 "激活三海商道全局标志，获得 #Y 40 年#!「波罗的海—黑海三海大商道」（陆贸、商容与繁荣大增）及 #G +20#! 威望。"
 oe_pplc.12.b:0 "沿三海轴线修筑要塞群与战略补给防务网"
 oe_pplc.12.b.tt:0 "激活三海商道全局标志，获得 #Y 40 年#!「三海战略铁壁同盟」（防御、后勤距离与外交声望提升）。"
 oe_pplc.13.t:0 "国民教育委员会与华沙启蒙学院"
 oe_pplc.13.d:0 "启蒙浪潮席卷华沙与克拉科夫！大瑟姆倡议创立欧洲历史上第一座由国家统筹的「国民教育委员会」（Komisja Edukacji Narodowej），全面改组世俗学堂、推广近代数学、历史与宪政公民教育，同步创办皇家骑士学院培育新一代近代军官。"
 oe_pplc.13.a:0 "创立国民教育委员会，掀起三海启蒙与立宪思潮"
 oe_pplc.13.a.tt:0 "自由否决权指数 #G -10#!，文化传统 #G +10#!，获得 #Y 35 年#!「华沙国民教育委员会」（科研、识字与思潮加速）。"
 oe_pplc.13.b:0 "重点资助华沙皇家骑士学院与近代炮兵军官团"
 oe_pplc.13.b.tt:0 "获得 #G +15#! 陆军传统、科研进度及 #Y 30 年#!「翼骑兵与龙骑兵协同新操」。"
 oe_pplc.14.t:0 "粉碎瓜分密约：四邻合围的暗影"
 oe_pplc.14.d:0 "华沙密探截获骇人密信：环伺东欧的几大邻国宫廷竟在暗中勾连，企图趁我瑟姆争执之机签署「瓜分密约」、肢解联邦疆土！决不能重蹈坐以待毙的覆辙——此刻正是提前颁布常备军总动员、肃清外敌暗桩并向全欧亮剑的决断关头！"
 oe_pplc.14.a:0 "颁布全国常备军总动员，以铁血要塞粉碎瓜分阴谋！"
 oe_pplc.14.a.tt:0 "自由否决权指数 #G -15#!，获得 #Y 25 年#!「粉碎瓜分：全民卫国总动员」（人力、防御、士气大涨）。"
 oe_pplc.14.b:0 "合纵连横分化强邻阵营，同时充实国防战备金库"
 oe_pplc.14.b.tt:0 "获得 #G +200#! 金币、#G +10#! 稳定度及 #Y 20 年#!「三海战略铁壁同盟」。"
 oe_pplc.15.t:0 "1791《五月三日宪法》大典"
 oe_pplc.15.d:0 "华沙皇家城堡灯火辉煌，钟声响彻维斯瓦河两岸！历经四年大瑟姆苦心起草，欧洲第一部近代成文宪法——《五月三日宪法》（Konstytucja 3 Maja）正式提交全场表决：永久废除撕裂国政百余年的自由否决权，确立世袭立宪君主制、三权分立、城市公民权与国家对农民的法律庇护。三海联邦的新纪元就此启幕！"
 oe_pplc.15.a:0 "全场起立宣誓：颁行《五月三日宪法》，永废自由否决权！"
 oe_pplc.15.a.tt:0 "永久废除自由否决权，启用「五月三日立宪共和国」改革并授予永久传奇修正「三海立宪霸主」！"
 oe_pplc.15.b:0 "推行温和立宪妥协方案：废除否决权同时保留上院贵族特席"
 oe_pplc.15.b.tt:0 "永久废除自由否决权，启用「五月三日立宪共和国」改革并大幅安抚贵族与市民阶层。"
 oe_pplc.16.t:0 "维也纳解围或君堡盟约：东欧天主教与正教的十字路口"
 oe_pplc.16.d:0 "多瑙河与博斯普鲁斯海峡同时传来急报：南翼帝国枢纽正面临强敌重兵压境，中东欧诸邦翘首以盼波兰—立陶宛翼骑兵的旌旗！若我们挥师南下千里驰援维也纳或君士坦丁堡，必将赢得震撼全欧的「基督教世界柱石」盛誉与三海外交霸权。"
 oe_pplc.16.a:0 "「我来，我见，上帝赐胜！」——翼骑兵千里驰援危城"
 oe_pplc.16.a.tt:0 "获得 #G +30#! 威望、#G +12#! 陆军传统、#Y 30 年#!「翼骑兵解围之光」并与奥地利/东罗马缔结深厚邦谊！"
 oe_pplc.16.b:0 "先索要多瑙河与黑海商贸特许，再论出兵协防"
 oe_pplc.16.b.tt:0 "获得 #G +220#! 金币及 #Y 20 年#!「波罗的海—黑海三海大商道」。"
 oe_pplc.90.t:0 "【审计读数】波立三海联邦主角线状态面板（Slot 77）"
 oe_pplc.90.d:0 "#T 当前国家#!：[ROOT.GetCountry.GetName]\n#T 核心状态轴#!：自由否决权指数 #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_veto').GetValue|0]#! / 100（已永久废除=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_abolished').GetValue|0]）  登记哥萨克等级 #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_cossack').GetValue|0]#! / 4  三海枢纽数 #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_intermarium').GetValue|0]#! / 3\n#T 历史里程碑#!：华沙宽容=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_warsaw').GetValue|0]  《哈佳奇条约》=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_hadiach').GetValue|0]  《五月三日宪法》=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_may3').GetValue|0]\n#T Slot 49 只读防双发互锁#!：oe_plc 格伦瓦德=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_s49_grunwald').GetValue|0]  oe_plc 卢布林=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_s49_lublin').GetValue|0]  Slot 77 已发事件=[ROOT.GetCountry.MakeScope.GetVariable('oe_pplc_rd_ev_cnt').GetValue|0]"
 oe_pplc.90.a:0 "确认读数并关闭"
 oe_pplc.90.a.tt:0 "关闭 Slot 77 审计面板，不改变任何游戏状态。"
 oe_pplc.90.b:0 "刷新实时读数"
 oe_pplc.90.b.tt:0 "重新读取当前状态并刷新窗口。"
