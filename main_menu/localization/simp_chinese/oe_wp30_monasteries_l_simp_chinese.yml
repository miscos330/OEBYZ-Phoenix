 oe_wp30_restore_anatolian_monasteries: "重兴安纳托利亚修道院"
 oe_wp30_restore_anatolian_monasteries.title: "重兴安纳托利亚修道院"
 oe_wp30_restore_anatolian_monasteries.desc: "从卡帕多西亚的岩窟拉伏拉、本都的崇山峻岭，到比提尼亚、爱奥尼亚与塞浦路斯沿岸，十六座历史悠久的东正教修道院曾是小亚细亚信仰与学术的柱石。既已收复其中圣地，王室便可颁布敕令，以半价重修并重新供养这些古老修院。"
 oe_wp30_restore_anatolian_monasteries.a: "颁布敕令，重兴小亚细亚诸古修院"
 oe_wp30_monastery_restoration_reason: "帝国重修古老修道院敕令"
