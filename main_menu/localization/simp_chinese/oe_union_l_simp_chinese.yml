 OE_UN_V10_BAR: "巴尔拉姆近百年前在阿维尼翁说过“先开会议”，如今总算有了着落。"
 OE_UN_EMPTY: ""
 OE_UN_V10_ISI: "新任罗斯都主教伊西多尔愿意随行。"
 OE_UN_V_ROME: "约翰五世当年在罗马的低头，没给帝国换来什么。"
 OE_UN_V12_BAS: "这份合一是与巴塞尔的神父们签的，罗马的教皇不认。"
 OE_UN_V12_H: "修士和许多教士公开说，签了字的主教出卖了信仰，街上有人当面骂这些主教是叛徒。"
 OE_UN_V12_M: "教士们议论纷纷，有人观望，也有人暗中反对。"
 OE_UN_V12_L: "反对的声音不大，多数人在等着看西方的援兵会不会来。"
 OE_UN_V21_U: "京城的牧首是亲合一派的人。"
 OE_UN_V21_N: "京城的牧首并不亲合一，可合一的签名仍然作数。"
 OE_UN_V22_2: "把签过的合一在圣索菲亚当众宣读。"
 OE_UN_V22_4: "重新接受已经废掉的合一，并在圣索菲亚当众宣读。"
 OE_UN_V22_0: "先接受佛罗伦萨的诏书，再在圣索菲亚当众宣读。"
 OE_UN_V22_ISI: "要来的这位枢机伊西多尔，就是当年派去罗斯的都主教。"
 OE_UN_V23_2: "反对的人不肯再进圣索菲亚，修士带着人群上街，城里乱了起来。"
 OE_UN_V23_1: "反对的人不肯再进圣索菲亚，城里人心不安，倒还没有闹起来。"
 OE_UN_V1_K: "坎塔库泽诺斯家打赢了内战，坐稳了皇位，新朝同样指望西方的援兵。"
 OE_UN_V2_EMP: "皇帝本人"
 OE_UN_V2_KAN: "退位出家的前皇帝坎塔库泽诺斯"
 OE_UN_V2_THEO: "宫中的神学家们"
 OE_UN_V2_BAR: "巴尔拉姆当年在阿维尼翁就提过同样的主张。"
 OE_UN_V3_BYD: "城外就是苏丹的营地，信使只能走海路。"
 OE_UN_V4_S1: "帝国早先向会上认定的教皇道过贺，使节说话有分量。"
 OE_UN_V4_S2: "帝国先前押错了教皇，使节在会上处处要赔小心。"
 OE_UN_V4_S3: "帝国在教皇之争里没有表态，使节只能先听别人怎么说。"
 OE_UN_V5_1: "教皇愿意谈合一的会议，问皇帝几时派人来商量开会的地点。"
 OE_UN_V5_2: "教皇答应帮皇帝的儿子物色天主教的新娘，援兵的事却只说日后再议。"
 OE_UN_R1369_1: "1369年约翰五世在罗马个人归信，没有带回援兵。"
 OE_UN_R1369_2: "1369年皇帝没有去罗马。"
 OE_UN_CHR_V1: "帝国走上了光复之路，与罗马合一的旧事不再提起。"
 OE_UN_CHR_V2: "1445年以前没有等来合一会议的邀请。"
 OE_UN_CHR_D5: "帝国归信了罗马。"
 OE_UN_CHR_DR: "帝国拒绝了罗马的条件，合一没有在圣索菲亚宣读。"
 OE_UN_CHR_D3R: "合一已在圣索菲亚宣读，城中为此大乱；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!。"
 OE_UN_CHR_D3U: "合一已在圣索菲亚宣读，城中人心不安；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!。"
 OE_UN_CHR_D3: "合一已在圣索菲亚宣读；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!。"
 OE_UN_CHR_D4: "签过的合一被认作无效。"
 OE_UN_CHR_D2: "会上的签名始终没有在京城宣读。"
 OE_UN_CHR_D0: "到最后也没有与罗马合一。"
 OE_UN_CHR_R22: "皇帝答应了罗马的条件，合一不日在圣索菲亚宣读。"
 OE_UN_CHR_R2: "合一已签署，还没在京城宣读；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 OE_UN_CHR_RT: "皇帝离京赴会。"
 OE_UN_CHR_RK: "与罗马的合一谈判还在进行，给西方的加成#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_west_bonus')|0]#!。"
 OE_UN_CHR_RB: "会议破裂，合一没有签成。"
 OE_UN_CHR_R22B: "帝国收下了教皇的援兵，宣读合一的事还拖着。"
 OE_UN_CHR_RN: "皇帝没有去开会，合一的事搁下了。"
 OE_UN_CHR_WE: "合一的会议提前了：1425年起，教皇就可能请皇帝去开会。"
 OE_UN_CHR_W1: "1355年起，皇帝可能致信教皇，以合一换西方的援兵。"
 OE_UN_CHR_W2: "1366年起，教皇的使节可能来京城，谈开一次东西教会都参加的大公会议。"
 OE_UN_CHR_W3: "帝国的学者和使节往来于意大利；1435年起，教皇和巴塞尔会议会请皇帝赴会。[GetCountry('BYZ').Custom('OeUnRome1369')]"
 OE_UN_CHR_W: "1435年起，教皇和巴塞尔会议会请皇帝赴会。[GetCountry('BYZ').Custom('OeUnRome1369')]"
 game_concept_oe_tu_church_union: "教会合一"
 game_concept_oe_tu_church_union_desc: "帝国与罗马教会的合一，从未谈、谈判中、已签署、已宣读，到已废或已改宗。每走一步都有两本账：\n#bold #color_yellow 国内的反对#!#!：由[oe_tu_church_parties|e]算出，等于静修派份额加理性派份额的一半；教会框架没有运行时按#Y 60#!。1443年以后合一有效时再加#Y 5#!；1450年以前，以弗所的马可一派在讲道时再加#Y 10#!，被拘时加#Y 5#!，在宫中辩输了则减#Y 5#!。#Y 60#!以上为高，#Y 40#!到#Y 59#!为中，以下为低。反对越高，在京城宣布合一引起的不满越大。\n#bold #color_yellow 合一给西方的加成#!#!：谈判中#G +5#!，已签署#G +15#!（有保留，或只有巴塞尔一方承认时#G +8#!），已宣读#G +25#!，已废#R −10#!。它加进西方援助意愿，西方愿意出多少力，看的就是这个数。\n皇帝要亲自赴会、签字，回京后再定是否宣读。签了字而国内不认，西方也不会全信；不签，援兵更难指望。"
