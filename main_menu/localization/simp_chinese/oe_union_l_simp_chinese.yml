 game_concept_oe_tu_church_union: "教会合一"
 game_concept_oe_tu_church_union_desc: "帝国与罗马教会的合一，从未谈、谈判中、已签署、已宣读，到已废或已改宗。每走一步都有两本账：\n#bold #color_yellow 国内的反对#!#!：由[oe_tu_church_parties|e]算出，等于静修派份额加理性派份额的一半；教会框架没有运行时按#Y 60#!。1443年以后合一有效时再加#Y 5#!。#Y 60#!以上为高，#Y 40#!到#Y 59#!为中，以下为低。反对越高，在京城宣布合一引起的不满越大。\n#bold #color_yellow 合一给西方的加成#!#!：谈判中#G +5#!，已签署#G +15#!（有保留，或只有巴塞尔一方承认时#G +8#!），已宣读#G +25#!，已废#R −10#!。它加进西方援助意愿，西方愿意出多少力，看的就是这个数。\n皇帝要亲自赴会、签字，回京后再定是否宣读。签了字而国内不认，西方也不会全信；不签，援兵更难指望。"
 STATIC_MODIFIER_NAME_oe_un_pledge: "对罗马的许诺"
