 oe_un.10.t: "两份邀请"
 oe_un.10.desc_late: "#F 1431年，巴塞尔会议开幕。会上的神父和教皇尤金四世都想请希腊人来开一次合一的会议。1437年9月，教皇下诏把会议迁到费拉拉；巴塞尔一方却要在巴塞尔、阿维尼翁或萨伏依开会。相传两边都派了船来接希腊人。#!\n\n如今，两边的使者都在京城：教皇请皇帝带着牧首和主教们去意大利，巴塞尔的神父则请皇帝到巴塞尔一方选定的地方开会。去，就要谈合一，皇帝也要离京好几年；不去，西方的援兵就更难指望了。[GetCountry('BYZ').Custom('OeUnV10Bar')][GetCountry('BYZ').Custom('OeUnV10Isi')][GetCountry('BYZ').Custom('OeUnVRome')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.10.desc_early: "#F 1431年，巴塞尔会议开幕。会上的神父和教皇尤金四世都想请希腊人来开一次合一的会议，双方都派了使者来君士坦丁堡。#!\n\n如今，两边的使者都在京城：教皇请皇帝带着牧首和主教们去意大利，巴塞尔的神父则请皇帝到巴塞尔一方选定的地方开会。去，就要谈合一，皇帝也要离京好几年；不去，西方的援兵就更难指望了。[GetCountry('BYZ').Custom('OeUnV10Bar')][GetCountry('BYZ').Custom('OeUnV10Isi')][GetCountry('BYZ').Custom('OeUnVRome')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.10.a: "乘教皇的船去费拉拉"
 oe_un.10.a.tt: "教廷对帝国好感#G +20#!，持续#Y 10#!年\n与罗马的合一谈判开始，持续#Y 5#!年；帝国获得[ShowModifier('oe_un_pledge')]\n皇帝离京赴会：帝国获得[ShowModifier('oe_un_emperor_away')]，直到皇帝回京\n[oe_tu_authority|e]#R −5#!\n[oe_tu_church_parties|e]份额：静修派#Y −2#!，理性派#Y −1#!，亲合一派#Y +3#!\n约#Y 600#!天后，会议有了结果"
 oe_un.10.b: "应巴塞尔会议之邀"
 oe_un.10.b.tt: "教廷对帝国好感#R −20#!，持续#Y 10#!年\n与罗马的合一谈判开始，持续#Y 5#!年；帝国获得[ShowModifier('oe_un_pledge')]\n皇帝离京赴会：帝国获得[ShowModifier('oe_un_emperor_away')]，直到皇帝回京\n[oe_tu_authority|e]#R −5#!\n[oe_tu_church_parties|e]份额：静修派#Y −2#!，理性派#Y −1#!，亲合一派#Y +3#!\n这样签下的合一只有巴塞尔一方承认，给西方的加成减半\n约#Y 600#!天后，会议有了结果"
 oe_un.10.c: "不去，守住正教"
 oe_un.10.c.tt: "[oe_tu_church_parties|e]份额：静修派#Y +4#!，亲合一派#Y −3#!\n教廷对帝国好感#R −10#!，持续#Y 5#!年\n帝国不赴会，这一次的合一就此作罢"
 oe_un.11.t: "佛罗伦萨的签名"
 oe_un.11.desc_basel_late: "#F 1438年春，七百多名希腊人到了费拉拉，4月9日开了第一次隆重会议。为了钱，也为了躲瘟疫，1439年1月会议迁到佛罗伦萨。6月，牧首约瑟夫二世死在会上。7月6日，会议宣布《让诸天欢喜》；东方的主教都签了名，只有以弗所的马可不签。#!\n\n如今，巴塞尔一方的会议到了最后：神父们拿出了合一的条款，条件比罗马的宽一些。可罗马的教皇不承认这个会议，西方只有一部分君主会认这份合一。主教们等着皇帝拿主意。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.11.desc_basel_early: "#F 1274年，皇帝米海尔八世的使者在里昂会议上接受了合一，换取教皇约束西方诸侯，不让其攻打帝国。回到君士坦丁堡，这份合一几乎没有人认。#!\n\n如今，巴塞尔一方的会议到了最后：神父们拿出了合一的条款，条件比罗马的宽一些。可罗马的教皇不承认这个会议，西方只有一部分君主会认这份合一。主教们等着皇帝拿主意。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.11.desc_late: "#F 1438年春，七百多名希腊人到了费拉拉，4月9日开了第一次隆重会议。为了钱，也为了躲瘟疫，1439年1月会议迁到佛罗伦萨。6月，牧首约瑟夫二世死在会上。7月6日，会议宣布《让诸天欢喜》；东方的主教都签了名，只有以弗所的马可不签。#!\n\n如今，会议到了最后：拉丁人要求希腊人接受信经里的“和子”句、炼狱之说和教皇的首席地位，作为合一的条件；教皇答应出钱出船，再号召十字军救援君士坦丁堡。主教们等着皇帝拿主意。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.11.desc_early: "#F 1274年，皇帝米海尔八世的使者在里昂会议上接受了合一，换取教皇约束西方诸侯，不让其攻打帝国。回到君士坦丁堡，这份合一几乎没有人认。#!\n\n如今，会议到了最后：拉丁人要求希腊人接受信经里的“和子”句、炼狱之说和教皇的首席地位，作为合一的条件；教皇答应出钱出船，再号召十字军救援君士坦丁堡。主教们等着皇帝拿主意。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.11.a: "签署合一诏书"
 oe_un.11.a.tt: "合一签署：帝国获得[ShowModifier('oe_un_signed')]\n教廷对帝国好感#G +30#!，持续#Y 20#!年\n奥斯曼对帝国好感#R −15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y −4#!，理性派#Y −4#!，亲合一派#Y +8#!\n[oe_tu_patriarchate|e]#R −3#!\n获得#G 2#!个月的贸易与税收收入\n随团的一些希腊学者留在了意大利\n约#Y 200#!天后，皇帝回到京城"
 oe_un.11.b: "不改信经，只认教皇的荣誉首席"
 oe_un.11.b.tt: "#G 40%#!的可能对方让步：合一以有保留的方式签署，帝国获得[ShowModifier('oe_un_signed_soft')]；教廷对帝国好感#G +15#!，持续#Y 20#!年；[oe_tu_church_parties|e]份额：静修派#Y −2#!，理性派#Y −2#!，亲合一派#Y +4#!\n#R 60%#!的可能会议破裂，合一没有签成：教廷对帝国好感#R −10#!，持续#Y 5#!年；[oe_tu_church_parties|e]份额：静修派#Y +3#!，亲合一派#Y −2#!\n约#Y 200#!天后，皇帝回到京城"
 oe_un.11.c: "拂袖而去"
 oe_un.11.c.tt: "会议破裂，合一没有签成\n[oe_tu_church_parties|e]份额：静修派#Y +5#!，亲合一派#Y −3#!\n教廷对帝国好感#R −30#!，持续#Y 15#!年\n约#Y 200#!天后，皇帝回到京城"
 oe_un.11.d: "签署合一诏书"
 oe_un.11.d.tt: "合一签署：帝国获得[ShowModifier('oe_un_signed')]\n这份合一只有巴塞尔一方承认，给西方的加成减半\n萨伏依对帝国好感#G +10#!，持续#Y 10#!年\n奥斯曼对帝国好感#R −15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y −4#!，理性派#Y −4#!，亲合一派#Y +8#!\n[oe_tu_patriarchate|e]#R −3#!\n获得#G 1#!个月的贸易与税收收入\n随团的一些希腊学者留在了意大利\n约#Y 200#!天后，皇帝回到京城"
 oe_un.11.e: "不改信经，只认教皇的荣誉首席"
 oe_un.11.e.tt: "#G 60%#!的可能对方让步：合一以有保留的方式签署，帝国获得[ShowModifier('oe_un_signed_soft')]；萨伏依对帝国好感#G +10#!，持续#Y 10#!年；[oe_tu_church_parties|e]份额：静修派#Y −2#!，理性派#Y −2#!，亲合一派#Y +4#!\n#R 40%#!的可能会议破裂，合一没有签成：[oe_tu_church_parties|e]份额：静修派#Y +3#!，亲合一派#Y −2#!\n约#Y 200#!天后，皇帝回到京城"
 oe_un.11.f: "拂袖而去"
 oe_un.11.f.tt: "会议破裂，合一没有签成\n[oe_tu_church_parties|e]份额：静修派#Y +5#!，亲合一派#Y −3#!\n约#Y 200#!天后，皇帝回到京城"
 oe_un.12.t: "回到君士坦丁堡"
 oe_un.12.desc_signed_late: "#F 1440年2月1日，皇帝回到京城。城里的教士和百姓大多不认这次合一，签了字的人不少回来就反悔了。5月，亲合一的梅特罗法内斯二世当了牧首。皇帝始终没有在京城正式宣布合一。#!\n\n如今，皇帝回到了京城。[GetCountry('BYZ').Custom('OeUnV12Basel')]会上签下的合一还没有在京城宣读，城里已经议论纷纷。[GetCountry('BYZ').Custom('OeUnV12Opp')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.12.desc_signed_early: "#F 1282年米海尔八世死后，新皇帝安德罗尼卡二世随即废了里昂的合一。为了这份合一，米海尔在位时撤换过牧首，惩办过不少反对的人，到头来什么也没有留下。#!\n\n如今，皇帝回到了京城。[GetCountry('BYZ').Custom('OeUnV12Basel')]会上签下的合一还没有在京城宣读，城里已经议论纷纷。[GetCountry('BYZ').Custom('OeUnV12Opp')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.12.desc_none_late: "#F 1440年2月1日，皇帝回到京城。城里的教士和百姓大多不认这次合一，签了字的人不少回来就反悔了。5月，亲合一的梅特罗法内斯二世当了牧首。皇帝始终没有在京城正式宣布合一。#!\n\n如今，皇帝回到了京城。会议没有谈成，合一的事暂时搁下了。城里的教士松了一口气，西方的使者却提醒皇帝，教皇的耐心有限。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.12.desc_none_early: "#F 1282年米海尔八世死后，新皇帝安德罗尼卡二世随即废了里昂的合一。为了这份合一，米海尔在位时撤换过牧首，惩办过不少反对的人，到头来什么也没有留下。#!\n\n如今，皇帝回到了京城。会议没有谈成，合一的事暂时搁下了。城里的教士松了一口气，西方的使者却提醒皇帝，教皇的耐心有限。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.12.a: "立即在圣索菲亚宣布合一"
 oe_un.12.a.tt: "合一在京城宣读：帝国获得[ShowModifier('oe_un_proclaimed')]\n教廷对帝国好感#G +30#!，持续#Y 20#!年\n教士阶层满意度#R −15%#!（国内的反对不低于#Y 60#!时），否则#R −10%#!\n君士坦丁堡获得[ShowModifier('oe_un_city_strife')]，持续#Y 5#!年\n[oe_tu_patriarchate|e]#R −5#!\n教会框架运行时：现任牧首退位，圣主教会议另报人选，其中有亲合一派的人（现任已属亲合一派时不换）"
 oe_un.12.b: "先不宣布，换一位亲合一的牧首"
 oe_un.12.b.tt: "合一仍是“已签署”，暂不在京城宣读\n教会框架运行时：现任牧首退位，圣主教会议另报人选，其中有亲合一派的人（现任已属亲合一派时不换）"
 oe_un.12.c: "承认签字无效"
 oe_un.12.c.tt: "合一作废：帝国获得[ShowModifier('oe_un_repudiated')]，持续#Y 10#!年\n教廷对帝国好感#R −30#!，持续#Y 15#!年\n[oe_tu_church_parties|e]份额：静修派#Y +6#!，亲合一派#Y −6#!"
 oe_un.12.d: "让帝国归信罗马"
 oe_un.12.d.tt: "亲合一派当道。接着是事件“佛罗伦萨大公会议”，在那里决定是否举国改宗天主教"
 oe_un.12.e: "写信给教皇，日后再谈"
 oe_un.12.e.tt: "与罗马的合一谈判开始，持续#Y 5#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +5#!，持续#Y 5#!年"
 oe_un.12.f: "从此不再谈合一"
 oe_un.12.f.tt: "[oe_tu_church_parties|e]份额：静修派#Y +3#!，亲合一派#Y −3#!"
 oe_un.20.t: "以弗所的马可"
 oe_un.20.desc_late: "#F 以弗所都主教马可没有在佛罗伦萨的诏书上签字，回国后成了反合一派的首领。据记载，皇帝曾把马可拘在利姆诺斯岛两年。1443年，三位东方牧首在耶路撒冷开会，谴责了合一。1444年6月23日马可去世，临终嘱咐学生乔治·斯科拉里奥斯守住正教。#!\n\n如今，马可已经去世，学生斯科拉里奥斯接过了衣钵，在京城讲道、著书，说会上的签名出卖了信仰，修士和百姓争着去听。亲合一的主教请皇帝管一管，教皇的使者也在等着看皇帝怎么办。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.20.desc_mid: "#F 1439年7月在佛罗伦萨，以弗所都主教马可没有在合一的诏书上签字。1440年2月希腊人回到君士坦丁堡，马可很快成了反合一派的首领。#!\n\n如今，马可在京城讲道、著书，说会上的签名出卖了信仰，修士和百姓争着去听。亲合一的主教请皇帝管一管，教皇的使者也在等着看皇帝怎么办。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.20.desc_early: "#F 1274年里昂的合一之后，皇帝米海尔八世撤换了不肯认合一的牧首，把许多反对的人流放、刺瞎，连皇帝的姐姐欧洛吉亚也站在反对的一边。反对的声音始终没有停下。#!\n\n如今，马可在京城讲道、著书，说会上的签名出卖了信仰，修士和百姓争着去听。亲合一的主教请皇帝管一管，教皇的使者也在等着看皇帝怎么办。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.20.a: "任其讲道著述"
 oe_un.20.a.tt: "国内的反对#R +10#!（到1450年为止）\n[oe_tu_church_parties|e]份额：静修派#Y +5#!，亲合一派#Y −3#!\n教廷对帝国好感#R −10#!，持续#Y 5#!年"
 oe_un.20.b: "把马可拘在利姆诺斯岛"
 oe_un.20.b.tt: "国内的反对#R +5#!（到1450年为止）\n[oe_tu_church_parties|e]份额：静修派#Y +2#!\n[oe_tu_authority|e]#R −3#!\n教廷对帝国好感#G +5#!，持续#Y 5#!年"
 oe_un.20.c: "把斯科拉里奥斯遣出宫廷"
 oe_un.20.c.tt: "国内的反对#R +5#!（到1450年为止）\n[oe_tu_church_parties|e]份额：静修派#Y +2#!\n[oe_tu_authority|e]#R −3#!\n教廷对帝国好感#G +5#!，持续#Y 5#!年"
 oe_un.20.d: "在宫中公开辩论"
 oe_un.20.d.tt: "#G 50%#!的可能皇帝一方辩赢：国内的反对#G −5#!（到1450年为止）；[oe_tu_church_parties|e]份额：静修派#Y −3#!，理性派#Y +2#!，亲合一派#Y +1#!；威望#G +5#!\n#R 50%#!的可能辩输：国内的反对#R +10#!（到1450年为止）；[oe_tu_church_parties|e]份额：静修派#Y +4#!，理性派#Y −2#!，亲合一派#Y −2#!；威望#R −5#!"
 oe_un.21.t: "没有加冕礼"
 oe_un.21.desc_late: "#F 1448年10月31日约翰八世去世。1449年1月6日，君士坦丁十一世在米斯特拉即位，3月12日入京。新皇帝始终没有在圣索菲亚补行加冕；据说是因为牧首格里高利三世亲合一，由这位牧首加冕会激怒反对合一的人。#!\n\n如今，帝国换了新皇帝，与罗马的合一还在。[GetCountry('BYZ').Custom('OeUnV21Pat')]在圣索菲亚加冕，礼仪就得照合一的规矩，念教皇的名字；不加冕，新君的名分总缺一块。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.21.desc_early: "#F 1282年米海尔八世去世。新皇帝安德罗尼卡二世即位不久，就废了先帝在里昂签下的合一；米海尔为这份合一撑了八年，到头来没能传过一代。#!\n\n如今，帝国换了新皇帝，与罗马的合一还在。[GetCountry('BYZ').Custom('OeUnV21Pat')]在圣索菲亚加冕，礼仪就得照合一的规矩，念教皇的名字；不加冕，新君的名分总缺一块。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.21.a: "在圣索菲亚照合一的礼仪加冕"
 oe_un.21.a.tt: "国内的反对不低于#Y 60#!时：君士坦丁堡获得[ShowModifier('oe_un_city_unease')]，持续#Y 3#!年\n[oe_tu_church_parties|e]份额：静修派#Y +2#!"
 oe_un.21.b: "不行加冕礼"
 oe_un.21.c: "换一位反合一的牧首来加冕，合一作罢"
 oe_un.21.c.tt: "合一作废：帝国获得[ShowModifier('oe_un_repudiated')]，持续#Y 10#!年\n教廷对帝国好感#R −30#!，持续#Y 15#!年\n[oe_tu_church_parties|e]份额：静修派#Y +5#!，亲合一派#Y −5#!\n教会框架运行时：现任牧首退位，圣主教会议另报人选，其中有静修派的人（现任已属静修派时不换）"
 oe_un.22.t: "罗马的条件"
 oe_un.22.desc_late: "#F 1451年，穆罕默德二世即位；1452年4月，苏丹开始在海峡的欧洲一岸修筑堡垒。同一年，皇帝写信给教皇尼古拉五世求援，答应实行合一。教皇出钱，派枢机伊西多尔带着两百名弓手来到京城。#!\n\n如今，奥斯曼人的地界已经挨着京城。教皇的使者带来了条件：[GetCountry('BYZ').Custom('OeUnV22St')]教皇答应出钱，派一位枢机带弓手来守城；合一宣读了，西方的君主也会更愿意出力。[GetCountry('BYZ').Custom('OeUnV22Isi')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.22.desc_early: "#F 1439年7月在佛罗伦萨签下的合一，回到君士坦丁堡之后一直没有正式宣读。1447年3月，尼古拉五世当选教皇。罗马一向把援兵和合一连在一起。#!\n\n如今，奥斯曼人的地界已经挨着京城。教皇的使者带来了条件：[GetCountry('BYZ').Custom('OeUnV22St')]教皇答应出钱，派一位枢机带弓手来守城；合一宣读了，西方的君主也会更愿意出力。[GetCountry('BYZ').Custom('OeUnV22Isi')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.22.a: "答应在圣索菲亚宣读"
 oe_un.22.a.tt: "君士坦丁堡获得[ShowModifier('oe_un_isidore_men')]，持续#Y 5#!年\n获得#G 1#!个月的贸易与税收收入\n教廷对帝国好感#G +15#!，持续#Y 10#!年\n约#Y 60#!到#Y 90#!天后，合一在圣索菲亚宣读"
 oe_un.22.b: "先收下援兵，宣读再议"
 oe_un.22.b.tt: "君士坦丁堡获得[ShowModifier('oe_un_isidore_men')]，持续#Y 2#!年\n教廷对帝国好感#R −10#!，持续#Y 5#!年"
 oe_un.22.c: "拒绝"
 oe_un.22.c.tt: "合一已签署时：合一作废，帝国获得[ShowModifier('oe_un_repudiated')]，持续#Y 10#!年；教廷对帝国好感#R −30#!，持续#Y 15#!年\n否则：教廷对帝国好感#R −10#!，持续#Y 5#!年\n[oe_tu_church_parties|e]份额：静修派#Y +4#!，亲合一派#Y −3#!"
 oe_un.23.t: "圣索菲亚的礼拜"
 oe_un.23.desc_late: "#F 1452年12月12日，枢机伊西多尔在圣索菲亚主持合一的礼拜，宣读了佛罗伦萨的诏书。反对的人涌到潘托克拉托修道院去找修士根纳迪奥斯；据说根纳迪奥斯躲了起来，只在修室门上留了一张告示。有一句话流传很广：“宁见苏丹的头巾，不见拉丁人的冠冕。”史家杜卡斯把这句话记在大公诺塔拉斯名下，后人多认为记错了人。#!\n\n如今，合一在圣索菲亚宣读了，礼拜上念了教皇的名字。[GetCountry('BYZ').Custom('OeUnV23Mood')]合一从此算是已宣读，[oe_tu_patriarchate|e]#R −5#!。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.23.desc_early: "#F 1440年皇帝从佛罗伦萨回来以后，合一的诏书在君士坦丁堡搁了许多年：签过字的人不少反悔了，1443年三位东方牧首在耶路撒冷谴责了合一，京城的教士和百姓大多不认。#!\n\n如今，合一在圣索菲亚宣读了，礼拜上念了教皇的名字。[GetCountry('BYZ').Custom('OeUnV23Mood')]合一从此算是已宣读，[oe_tu_patriarchate|e]#R −5#!。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.23.a: "圣索菲亚归亲合一派，反对的人去别的教堂"
 oe_un.23.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y +3#!"
 oe_un.23.b: "许诺合一的条款日后由大公会议再审"
 oe_un.23.b.tt: "君士坦丁堡的[ShowModifier('oe_un_city_strife')]降为[ShowModifier('oe_un_city_unease')]；只有[ShowModifier('oe_un_city_unease')]时则去掉\n教廷对帝国好感#R −10#!，持续#Y 5#!年"
 oe_un.23.c: "镇压闹事的修士"
 oe_un.23.c.tt: "君士坦丁堡的[ShowModifier('oe_un_city_strife')]、[ShowModifier('oe_un_city_unease')]去掉\n[oe_tu_church_parties|e]份额：静修派#Y +6#!，亲合一派#Y −3#!"
 oe_un.1.t: "致阿维尼翁的金玺诏书"
 oe_un.1.desc_late: "#F 1354年，奥斯曼人占了加里波利，在海峡的欧洲一岸站住了脚。1355年，皇帝与教皇的使者、士麦那的拉丁大主教保罗谈判，许下大让步，其中包括把皇子曼努埃尔送到教廷作人质，换西方的船和兵。教皇只回了些客套话。1357年4月，教皇的使节彼得·托马斯到了君士坦丁堡，接受了皇帝的归顺，许诺的军队却始终没有来。#!\n\n如今，奥斯曼人在色雷斯一年比一年近。教皇的使者在京城等皇帝回话：皇帝若肯用一道金玺诏书许下合一，教皇就号召西方出船出兵。可京城的修士和教士从没认过罗马的首席。[GetCountry('BYZ').Custom('OeUnV1Kant')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.1.desc_mid: "#F 1354年，奥斯曼人占了加里波利，在海峡的欧洲一岸站住了脚。1355年，皇帝与教皇的使者、士麦那的拉丁大主教保罗谈判，许下大让步，其中包括把皇子曼努埃尔送到教廷作人质，换西方的船和兵。教皇只回了些客套话。#!\n\n如今，奥斯曼人在色雷斯一年比一年近。教皇的使者在京城等皇帝回话：皇帝若肯用一道金玺诏书许下合一，教皇就号召西方出船出兵。可京城的修士和教士从没认过罗马的首席。[GetCountry('BYZ').Custom('OeUnV1Kant')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.1.desc_early: "#F 1354年，奥斯曼人占了加里波利，在海峡的欧洲一岸站住了脚。罗马与君士坦丁堡的分裂由来已久：1274年皇帝米海尔八世在里昂接受过合一，回到京城几乎没有人认。#!\n\n如今，奥斯曼人在色雷斯一年比一年近。教皇的使者在京城等皇帝回话：皇帝若肯用一道金玺诏书许下合一，教皇就号召西方出船出兵。可京城的修士和教士从没认过罗马的首席。[GetCountry('BYZ').Custom('OeUnV1Kant')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.1.a: "签发金玺诏书"
 oe_un.1.a.tt: "与罗马的合一谈判开始，持续#Y 10#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y −3#!，亲合一派#Y +5#!\n[oe_tu_patriarchate|e]#R −2#!"
 oe_un.1.b: "只求援兵，不提教会"
 oe_un.1.b.tt: "教廷对帝国好感#G +5#!，持续#Y 5#!年"
 oe_un.1.c: "不写这封信"
 oe_un.1.c.tt: "[oe_tu_church_parties|e]份额：静修派#Y +2#!"
 oe_un.2.t: "宫中的辩论"
 oe_un.2.desc_late: "#F 1366年，萨伏依伯爵的远征军东来，随军的有教皇任命的拉丁宗主教保罗，就是十多年前来京城谈过合一的那位士麦那大主教。1367年6月保罗离开前，在宫中与退位出家的前皇帝坎塔库泽诺斯辩论；双方议定，两年之内在君士坦丁堡召开东西教会都参加的大公会议。教皇很快拒绝了这个提议。#!\n\n如今，保罗还在京城，要皇帝给个说法。[GetCountry('BYZ').Custom('OeUnV2Who')]对保罗说：信仰上的分歧不能凭皇帝的一纸诏书了结，要在君士坦丁堡开一次东西教会都参加的大公会议，东方的牧首都要到场。[GetCountry('BYZ').Custom('OeUnV2Bar')]也有人劝皇帝干脆亲赴罗马，以个人的名义归信，换西方的援兵。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.2.desc_mid: "#F 1366年，萨伏依伯爵的远征军东来，随军的有教皇任命的拉丁宗主教保罗，就是十多年前来京城谈过合一的那位士麦那大主教。1367年6月保罗离开前，在宫中与退位出家的前皇帝坎塔库泽诺斯辩论；双方议定，两年之内在君士坦丁堡召开东西教会都参加的大公会议。#!\n\n如今，保罗还在京城，要皇帝给个说法。[GetCountry('BYZ').Custom('OeUnV2Who')]对保罗说：信仰上的分歧不能凭皇帝的一纸诏书了结，要在君士坦丁堡开一次东西教会都参加的大公会议，东方的牧首都要到场。[GetCountry('BYZ').Custom('OeUnV2Bar')]也有人劝皇帝干脆亲赴罗马，以个人的名义归信，换西方的援兵。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
