 oe_un.2.a: "提议在君士坦丁堡开大公会议"
 oe_un.2.a.tt: "与罗马的合一谈判开始，持续#Y 5#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +5#!，持续#Y 5#!年\n[oe_tu_church_parties|e]份额：静修派#Y +2#!，理性派#Y +2#!\n[oe_tu_patriarchate|e]#G +3#!"
 oe_un.2.b: "皇帝愿亲赴罗马，个人归信"
 oe_un.2.b.tt: "与罗马的合一谈判开始，持续#Y 5#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y −2#!，亲合一派#Y +4#!"
 oe_un.2.c: "不再谈合一"
 oe_un.2.c.tt: "[oe_tu_church_parties|e]份额：静修派#Y +3#!，亲合一派#Y −2#!\n教廷对帝国好感#R −10#!，持续#Y 5#!年"
 oe_un.3.t: "去佛罗伦萨教希腊文"
 oe_un.3.desc_late: "#F 1390年，曼努埃尔·赫里索洛拉斯奉皇帝之命出使威尼斯，为帝国求援。1397年起，赫里索洛拉斯应佛罗伦萨执政萨卢塔蒂之请，在佛罗伦萨教授希腊文，学生里有后来的史家布鲁尼。#!\n\n如今，佛罗伦萨的执政萨卢塔蒂来信，请赫里索洛拉斯去佛罗伦萨教希腊文，薪俸由城里出。让赫里索洛拉斯去，帝国在意大利就多了一位朋友和说客；留在京城，宫里的学堂也正缺这样的人。[GetCountry('BYZ').Custom('OeUnV3Byd')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.3.desc_early: "#F 1390年，曼努埃尔·赫里索洛拉斯奉皇帝之命出使威尼斯，为帝国求援。#!\n\n如今，佛罗伦萨的执政萨卢塔蒂来信，请赫里索洛拉斯去佛罗伦萨教希腊文，薪俸由城里出。让赫里索洛拉斯去，帝国在意大利就多了一位朋友和说客；留在京城，宫里的学堂也正缺这样的人。[GetCountry('BYZ').Custom('OeUnV3Byd')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.3.a: "准赫里索洛拉斯去"
 oe_un.3.a.tt: "佛罗伦萨、教廷、威尼斯对帝国好感#G +10#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：理性派#Y −3#!，亲合一派#Y +2#!\n赫里索洛拉斯在意大利授课（计入西渡的希腊学者）"
 oe_un.3.b: "留赫里索洛拉斯在京城办学"
 oe_un.3.b.tt: "帝国获得[ShowModifier('oe_un_school')]，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：理性派#Y +3#!\n赫里索洛拉斯晚几年再去意大利"
 oe_un.4.t: "康斯坦茨的希腊人"
 oe_un.4.desc_late: "#F 1414年起，西方的教会在康斯坦茨开大会，要结束几位教皇并立的局面。1415年4月15日，曼努埃尔·赫里索洛拉斯死在康斯坦茨；此前赫里索洛拉斯曾为会议的地点去见西吉斯蒙德。1416年初，皇帝派尼古拉斯·埃夫代蒙诺扬尼斯率使团赴会，3月25日到达。1417年11月，使团见证了马丁五世当选教皇。#!\n\n如今，帝国的使节还在康斯坦茨。西方的教会已经有了一位众人都认的教皇，新教皇问使节：希腊人愿不愿意谈合一？使节在等皇帝的训令。[GetCountry('BYZ').Custom('OeUnV4Schism')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.4.desc_mid: "#F 1414年起，西方的教会在康斯坦茨开大会，要结束几位教皇并立的局面。1415年4月15日，曼努埃尔·赫里索洛拉斯死在康斯坦茨；此前赫里索洛拉斯曾为会议的地点去见西吉斯蒙德。1416年初，皇帝派尼古拉斯·埃夫代蒙诺扬尼斯率使团赴会，3月25日到达。#!\n\n如今，帝国的使节在康斯坦茨的会上。西方的教会正要结束几位教皇并立的局面，会上的神父问使节：希腊人愿不愿意谈合一？使节在等皇帝的训令。[GetCountry('BYZ').Custom('OeUnV4Schism')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.4.desc_early: "#F 1414年起，西方的教会在康斯坦茨开大会，要结束几位教皇并立的局面。1415年4月15日，曼努埃尔·赫里索洛拉斯死在康斯坦茨；此前赫里索洛拉斯曾为会议的地点去见西吉斯蒙德。#!\n\n如今，帝国的使节在康斯坦茨的会上。西方的教会正要结束几位教皇并立的局面，会上的神父问使节：希腊人愿不愿意谈合一？使节在等皇帝的训令。[GetCountry('BYZ').Custom('OeUnV4Schism')]\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.4.a: "请教皇召开合一的会议"
 oe_un.4.a.tt: "与罗马的合一谈判开始，持续#Y 10#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y −2#!，亲合一派#Y +3#!\n约一到两年后，教皇回信"
 oe_un.4.b: "只谈援兵与联姻"
 oe_un.4.b.tt: "教廷对帝国好感#G +5#!，持续#Y 5#!年\n约一到两年后，教皇回信"
 oe_un.4.c: "让使节空手而回"
 oe_un.4.c.tt: "使团没有带回什么"
 oe_un.5.t: "教皇的回信"
 oe_un.5.desc_brides_wed: "#F 1417年11月，康斯坦茨的会上选出了教皇马丁五世，几位教皇并立的局面就此结束。应帝国使团之请，教皇准许皇帝的两个儿子娶天主教的公主。1420年8月，蒙费拉托的索菲娅和克莱奥法·马拉泰斯塔乘威尼斯的船东来。1421年，皇子约翰娶了索菲娅。据说老皇帝嘱咐过儿子：合一的会议可以一直谈下去，让苏丹害怕，但千万别真的开。#!\n\n如今，教皇的回信到了。[GetCountry('BYZ').Custom('OeUnV5Ask')]皇帝要定下一步怎么走。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.5.desc_brides: "#F 1417年11月，康斯坦茨的会上选出了教皇马丁五世，几位教皇并立的局面就此结束。应帝国使团之请，教皇准许皇帝的两个儿子娶天主教的公主。1420年8月，蒙费拉托的索菲娅和克莱奥法·马拉泰斯塔乘威尼斯的船东来。#!\n\n如今，教皇的回信到了。[GetCountry('BYZ').Custom('OeUnV5Ask')]皇帝要定下一步怎么走。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.5.desc_martin: "#F 1417年11月，康斯坦茨的会上选出了教皇马丁五世，几位教皇并立的局面就此结束。应帝国使团之请，教皇准许皇帝的两个儿子娶天主教的公主。#!\n\n如今，教皇的回信到了。[GetCountry('BYZ').Custom('OeUnV5Ask')]皇帝要定下一步怎么走。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.5.desc_early: "#F 1414年起，西方的教会在康斯坦茨开大会，要结束几位教皇并立的局面；帝国的使节也在会上。#!\n\n如今，教皇的回信到了。[GetCountry('BYZ').Custom('OeUnV5Ask')]皇帝要定下一步怎么走。\n\n[oe_tu_church_union|e]：西方援助意愿#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!；国内的反对#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!（[GetCountry('BYZ').Custom('OeUnOpp')]）。"
 oe_un.5.a: "迎娶两位公主，会议从长计议"
 oe_un.5.a.tt: "两门亲事定了下来，新娘乘威尼斯的船东来\n与罗马的合一谈判重新计时，持续#Y 10#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +5#!，持续#Y 5#!年\n威尼斯对帝国好感#G +5#!，持续#Y 5#!年"
 oe_un.5.b: "立即筹备合一的会议"
 oe_un.5.b.tt: "与罗马的合一谈判重新计时，持续#Y 10#!年；帝国获得[ShowModifier('oe_un_pledge')]\n教廷对帝国好感#G +15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y −3#!，亲合一派#Y +4#!\n合一会议的邀请最早可在#Y 1425#!年到来（原定#Y 1435#!年）"
 oe_un.5.c: "婉拒，免得苏丹起疑"
 oe_un.5.c.tt: "奥斯曼对帝国好感#G +10#!，持续#Y 5#!年\n教廷对帝国好感#R −10#!，持续#Y 5#!年\n与罗马的合一谈判结束"
 oe_un.90.t: "合一的代价：执行"
