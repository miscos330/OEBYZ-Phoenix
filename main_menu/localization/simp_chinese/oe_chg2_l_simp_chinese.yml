 oe_chg2_tian_shan_archers:0 "察合台天山骑射手"
 oe_chg2_tian_shan_archers_desc:0 "征募自伊犁河谷与天山牧场的察合台精锐骑射手，兼擅高原隘口游击与草原包抄齐射，轻捷迅猛、箭雨连绵。"
 oe_chg2_transoxiana_cataphracts:0 "撒马尔罕丝路重装铁骑"
 oe_chg2_transoxiana_cataphracts_desc:0 "由撒马尔罕与布哈拉铁坊精铸札甲重装的河中重骑兵，熔丝路精钢甲胄与草原骑术于一炉，擅长正面冲锋摧垮敌阵。"
 oe_chg2_dec_almaliq_kurultai.title:0 "召开阿力麻里忽里勒台"
 oe_chg2_dec_almaliq_kurultai.desc:0 "召集河中、巴达赫尚与塔里木诸阿米尔赴阿力麻里会盟，提升察合台汗廷权威#G +12#!，安抚诸阿米尔独立倾向，并向国库匮乏的阿米尔兀鲁思拨发冬粮津贴，每#Y 5#!年可行一次。"
 oe_chg2_dec_almaliq_kurultai.a:0 "赐宴会盟并拨发冬粮津贴"
 oe_chg2_dec_centralize_uluses.title:0 "统一集权察合台兀鲁思"
 oe_chg2_dec_centralize_uluses.desc:0 "当察合台汗廷权威达到#Y 75#!以上且阿力麻里、撒马尔罕与喀什噶尔丝路主轴尽在掌握时，颁行永久集权大典，将尚存的察合台阿米尔兀鲁思改制为可正常吞并的附庸。"
 oe_chg2_dec_centralize_uluses.a:0 "颁行大典，统合察合台诸部"
 oe_chg2_dec_eurasian_governor_audit.title:0 "欧亚行省总督清丈考核"
 oe_chg2_dec_eurasian_governor_audit.desc:0 "派遣中枢度支御史巡察各行省总督驻地——德里诸伊克塔行省、开罗叙利亚纳伊卜驻节地或布达的特兰西瓦尼亚总督与克罗地亚行省——提升属国忠诚度与地方财税产出，每#Y 6#!年可行一次。"
 oe_chg2_dec_eurasian_governor_audit.a:0 "遣使清丈行省赋税与军籍"
 STATIC_MODIFIER_NAME_oe_chg2_mod_auth_supreme:0 "阿力麻里汗廷威权鼎盛"
 STATIC_MODIFIER_DESC_oe_chg2_mod_auth_supreme:0 "察合台大汗之玉玺威震七河、河中与塔里木诸绿洲，各阿米尔兀鲁思谨遵号令、按期纳贡。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_auth_fractured:0 "察合台汗廷威权低落"
 STATIC_MODIFIER_DESC_oe_chg2_mod_auth_fractured:0 "地方阿米尔拥兵自重、截留商道关税，对阿力麻里汗廷的征召阳奉阴违。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_almaliq_kurultai:0 "阿力麻里忽里勒台盟约"
 STATIC_MODIFIER_DESC_oe_chg2_mod_almaliq_kurultai:0 "丰厚赐赏、冬粮济急与庄严的雅撒盟誓将诸阿米尔兀鲁思牢牢凝聚在汗廷周围。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_centralized_ulus:0 "大一统察合台帝国集权"
 STATIC_MODIFIER_DESC_oe_chg2_mod_centralized_ulus:0 "阿力麻里中枢已彻底压服藩镇离心之势，将松散的阿米尔兀鲁思整合为政令畅达的丝路大帝国。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_dlh_cadastre:0 "德里伊克塔度支清丈"
 STATIC_MODIFIER_DESC_oe_chg2_mod_dlh_cadastre:0 "德里御史全面核清德干、古吉拉特与恒河诸伊克塔赋役簿籍，府库充盈而军政有序。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_mam_cadastre:0 "开罗—叙利亚纳伊卜清丈"
 STATIC_MODIFIER_DESC_oe_chg2_mod_mam_cadastre:0 "开罗度支官员直辖稽核大马士革与阿勒颇商税与军费，有效遏制叙利亚派系私吞。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_hun_cadastre:0 "匈牙利王室边疆总督清丈"
 STATIC_MODIFIER_DESC_oe_chg2_mod_hun_cadastre:0 "布达王室度支官巡核特兰西瓦尼亚与克罗地亚盐矿、金税及边防军额，国用与边备并举。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_loc_governor_cadastre:0 "清丈整饬之行省治所"
 STATIC_MODIFIER_DESC_oe_chg2_mod_loc_governor_cadastre:0 "经中枢清丈稽核后，此地行省治所税赋无漏、守备森严，与都城联系愈发紧密。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_dlh_iqta_harmony:0 "德里诸行省总督协和"
 STATIC_MODIFIER_DESC_oe_chg2_mod_dlh_iqta_harmony:0 "古尔伯加、坎贝与焦恩布尔诸伊克塔行省效忠中枢，源源不断向德里输送赋银与兵源。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_mam_niyabat_harmony:0 "开罗—大马士革—阿勒颇协防"
 STATIC_MODIFIER_DESC_oe_chg2_mod_mam_niyabat_harmony:0 "大马士革与阿勒颇两大纳伊卜同心拱卫开罗，黎凡特商道兴旺、北疆要塞固若金汤。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_hun_voivode_harmony:0 "特兰西瓦尼亚与克罗地亚协防"
 STATIC_MODIFIER_DESC_oe_chg2_mod_hun_voivode_harmony:0 "布拉索夫与萨格勒布边疆总督忠于王室，将喀尔巴阡隘口与萨瓦河防线连为坚固盾壁。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev1_a:0 "阿力麻里雅撒盟约"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev1_a:0 "阿力麻里汗廷重申大雅撒旧约，令河中与塔里木诸阿米尔兀鲁思归心效命。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev1_b:0 "阿力麻里大汗亲军"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev1_b:0 "七河直辖牧群与精锐草原骑射亲军筑牢了察合台大汗的军事根基。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev2_a:0 "天山战马牧群"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev2_a:0 "耐寒矫健的高原良驹令察合台轻骑纵横草原与山口而不知疲倦。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev2_b:0 "伊犁河谷冬储粮仓"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev2_b:0 "充足的饲草与冬粮储备护佑七河军民安然度过严酷的大陆寒冬。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev3_a:0 "撒马尔罕斡脱银币宪章"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev3_a:0 "统一的银币成色与汗廷牌符吸引波斯、印度与中原商队云集河中商道。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev3_b:0 "布哈拉丝坊军备征税"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev3_b:0 "布哈拉与撒马尔罕手工作坊为汗廷源源不断提供军饷与精良甲胄。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev4_a:0 "雅撒—沙里亚双轨法度"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev4_a:0 "城邦教法官与草原断事官各司其职，大幅缓和了汗国内部的教俗摩擦。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev4_b:0 "阿力麻里丝路宽容敕令"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev4_b:0 "秉持草原宗教宽容传统，令回鹘、粟特、波斯与游牧商旅得以和睦共荣。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev5_a:0 "塔里木驿道关税协约"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev5_a:0 "与东部阿米尔公平分润绿洲关税，令喀什噶尔至吐鲁番商队川流不息。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev5_b:0 "天山隘口烽燧防线"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev5_b:0 "险隘烽燧与避寒驿舍既肃清劫匪，也大幅减轻大军翻越天山的风雪损耗。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev6_a:0 "河中阿米尔议政院"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev6_a:0 "制度化的议政席位消弭了河中权贵的猜忌，使西部万户重归汗廷节制。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev6_b:0 "大汗独揽册封之威"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev6_b:0 "凛然不可侵犯的大汗威仪提振了中枢直属军心，却令西部阿米尔暗生怨望。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev7_a:0 "七河铁骑平叛之威"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev7_a:0 "疾如风雷的七河王师令觊觎大权的阿米尔不敢轻举妄动。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev7_b:0 "东西诸部忽里勒台和约"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev7_b:0 "在杜格拉特伯克与河中阿米尔之间巧妙均衡名分赏赐，暂时止息内战烽烟。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev8_a:0 "塔里木玉帛岁贡制"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev8_a:0 "稳妥的绿洲特许令喀什噶尔、叶尔羌与高昌成为汗廷东部稳固的财赋支柱。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev8_b:0 "塔里木达鲁花赤监理署"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev8_b:0 "汗廷达鲁花赤直接稽查绿洲粮仓、驿马与关市税赋，政令直达天山南麓。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev9_a:0 "七河边防营垒网"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev9_a:0 "星罗棋布的牧场戍垒令来犯敌军在酷寒高山草原上寸步难行、损兵折将。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev9_b:0 "亦力把里先遣游骑"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev9_b:0 "久经沙场的边疆斥候总能在山地伏击与草原接战中抢占先手。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev10_a:0 "察合台东西双翼大宪章"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev10_a:0 "划时代的帝国宪章将七河骑兵军权与河中财赋行政统一于察合台大汗御座之下。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev10_b:0 "察合台诸纛尚武同盟"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev10_b:0 "共同的征战荣耀令自喀什噶尔至撒马尔罕的铁骑齐集一面常胜大纛之下。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev11_a:0 "巴鲁剌思帝国元帅府"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev11_a:0 "将巴鲁剌思的惊世兵才纳入察合台汗廷麾下，锻造出所向披靡的河中重装铁骑。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev11_b:0 "诸部制衡禁卫体制"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev11_b:0 "纪律严明的王室守军坐镇诸绿洲要塞，令任何权臣皆无法凌驾于汗位之上。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev12_a:0 "阿力麻里—撒马尔罕双都制"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev12_a:0 "岁时巡幸双都之制将草原王权与河中都会文明水乳交融地融为一体。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev12_b:0 "撒马尔罕重骑兵甲坊"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev12_b:0 "撒马尔罕巧匠精制重钢马铠与长槊，将丝路重装铁骑武装到牙齿。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev13_a:0 "天山官办石砌驿舍网"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev13_a:0 "坚固的官办石砌旅舍大幅降低商旅风险，使河中至塔里木的每条山口皆成生财通途。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev13_b:0 "特许丝路商栈体系"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev13_b:0 "大商帮自主运营繁华驿栈，并为汗廷源源不断上缴丰厚特许关税。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev14_a:0 "帕米尔—吐鲁番坎儿井网"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev14_a:0 "免于烈日蒸发的地下坎儿井润泽苦盏至吐鲁番广袤旱原，推动人口与物产持久增长。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev14_b:0 "绿洲军屯水利体系"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev14_b:0 "水源充沛的军屯大仓使察合台大军远征荒漠戈壁而无缺水乏粮之虞。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev15_a:0 "察合台文艺复兴学院"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev15_a:0 "精密星表、医药典籍与察合台古典诗赋令汗国跻身欧亚学术之巅。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev15_b:0 "丝路多语皇家文书院"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev15_b:0 "精通察合台文、波斯文与回鹘文的干练书吏令帝国政令畅通无阻、外交斐然。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev16_a:0 "撒马尔罕皇家铸炮局"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev16_a:0 "重型青铜攻城炮群与齐射火枪阵足以轰碎中亚任何坚城壁垒。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev16_b:0 "火炮铁骑协同战法"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev16_b:0 "机动回旋炮齐射先破敌方长矛方阵，随即由重装铁骑发动致命突击。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev17_a:0 "察合台丝路关税同盟"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev17_a:0 "一票通行的陆路联运税制足以抗衡远洋航道，令察合台诸城富甲四方。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev17_b:0 "大陆丝路铁甲护卫军"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev17_b:0 "机动迅捷的常备火器骑军威慑欧亚腹地一切觊觎之敌。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev18_a:0 "察合台嗣主永世大诏"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev18_a:0 "至高王权、铁血火器劲旅与丝路滚滚财源共同铸就中亚不朽帝国。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev18_b:0 "丝路绿洲草原共荣联邦"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev18_b:0 "宽容共治、格致昌明与百城繁华令阿姆河至塔里木万族归心。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev19_a:0 "德干—古吉拉特度支清丈制"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev19_a:0 "德里直派度支官核账古尔伯加与坎贝，有效堵住行省税赋漏卮。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev19_b:0 "德干伊克塔兵役协约"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev19_b:0 "稳定的封俸安抚了地方军事贵族，使其按额提供可靠的行省骑军。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev20_a:0 "恒河细棉与河港关市制"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev20_a:0 "高效的东路税关将焦恩布尔与孟加拉细棉财赋顺恒河源源输往都城。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev20_b:0 "恒河东疆常备军镇"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev20_b:0 "沿河坚城军镇牢牢镇守德里东疆，令叛乱与外敌皆无可乘之机。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev21_a:0 "开罗—黎凡特卡里米总账"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev21_a:0 "亚历山大、大马士革与阿勒颇三地商税并账核算，尽收香料与丝绸之利。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev21_b:0 "北叙利亚堡垒铁盾"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev21_b:0 "阿勒颇与大马士革重兵扼守北疆咽喉，严阵以待来自安纳托利亚与两河的铁骑。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev22_a:0 "开罗叙利亚总督轮任法"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev22_a:0 "定期轮换总督令叙利亚军阀无法坐大割据，江山稳系开罗中枢。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev22_b:0 "布尔吉重装骑术精锐"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev22_b:0 "严苛的骑射演武与优厚军功采邑淬炼出令欧亚震颤的布尔吉重装马穆鲁克。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev23_a:0 "特兰西瓦尼亚三阶层边防同盟"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev23_a:0 "萨克森坚城与塞凯伊边骑在总督节制下死锁每一道喀尔巴阡险关。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev23_b:0 "特兰西瓦尼亚王室金盐专卖局"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev23_b:0 "喀尔巴阡盆地的王室金盐专卖为布达国库注入源源不断的黄金福林。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev24_a:0 "多瑙河戍边军旗团法制"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev24_a:0 "法定大贵族骑兵军旗团与充裕的边堡军费共同捍卫匈牙利多瑙河防线。"
 STATIC_MODIFIER_NAME_oe_chg2_mod_ev24_b:0 "匈牙利王室自由市宪章"
 STATIC_MODIFIER_DESC_oe_chg2_mod_ev24_b:0 "兴旺的王室自由市税赋制衡了豪门寡头，令布达王权空前稳固。"
 oe_chg2.1.title:0 "阿力麻里汗廷与诸阿米尔"
 oe_chg2.1.desc:0 "1337年，察合台汗国疆域西起撒马尔罕、布哈拉与巴尔赫诸河中名城，东至伊犁河谷牧场与塔克拉玛干绿洲。十四个桀骜的部族与绿洲阿米尔兀鲁思共尊阿力麻里白纛为共主——欲使草原游牧与河中农商同舟共济，既须恩威并施，亦须纲纪严明。"
 oe_chg2.1.a:0 "重申大雅撒盟约，抚慰十四阿米尔"
 oe_chg2.1.b:0 "扩建大汗直辖牧场与怯薛亲军"
 oe_chg2.2.title:0 "伊犁河谷与七河水草牧场"
 oe_chg2.2.desc:0 "天山融雪奔涌而下，滋养出伊犁河谷与七河流域中亚最丰美的骏马牧场。草原那颜力主划出上等夏牧场专育战马，地方长老则恳请兴修引水渠道与冬储粮仓，以免暴雪寒冬损及牲畜与市镇。"
 oe_chg2.2.a:0 "专设御马牧场，精练天山骑射手"
 oe_chg2.2.b:0 "兴建河谷冬储粮仓与融雪水渠"
 oe_chg2.3.title:0 "撒马尔罕与布哈拉斡脱商帮"
 oe_chg2.3.desc:0 "来自撒马尔罕与布哈拉的斡脱商团携织锦、巴达赫尚青金石与银锭齐聚阿力麻里。他们恳请大汗在十四个阿米尔兀鲁思境内统一度量衡与银币成色，愿以丰厚商税相报。"
 oe_chg2.3.a:0 "颁行斡脱牌符与统一银币成色"
 oe_chg2.3.b:0 "抽调丝坊税赋充实王室武库"
 oe_chg2.4.title:0 "雅撒法典与沙里亚律法的交锋"
 oe_chg2.4.desc:0 "布哈拉清真寺的宗教学者、高昌与阿力麻里的佛教及景教社群，以及恪守成吉思汗祖制的草原那颜之间，律法分歧日益凸显。朝臣敦请大汗明定沙里亚律法与大雅撒法典的权责界限。"
 oe_chg2.4.a:0 "调和城邦沙里亚法庭与草原雅撒旧制"
 oe_chg2.4.b:0 "依大雅撒敕令庇护丝路多元信仰"
 oe_chg2.5.title:0 "喀什噶尔至吐鲁番丝路关税"
 oe_chg2.5.desc:0 "满载中原丝绸、和田美玉与印度香料的商队穿行于塔克拉玛干南北两麓，途经杜格拉特与高昌境地。若能统筹驿站换马与山口护卫，塔里木盆地将成为阿力麻里的聚宝盆。"
 oe_chg2.5.a:0 "与杜格拉特、高昌统定丝路驿站关税"
 oe_chg2.5.b:0 "于天山隘口广筑烽燧与常备巡哨"
 oe_chg2.6.title:0 "河中阿米尔议事会"
 oe_chg2.6.desc:0 "风闻汗廷意欲收权削藩，哈剌温、巴鲁剌思、牙撒兀儿与速勒都思诸大阿米尔齐聚锡尔河以南。他们宣称唯有阿力麻里保障其世袭牧场并允其参议军国大事，方愿继续效忠察合台宗室。"
 oe_chg2.6.a:0 "赐予河中诸阿米尔忽里勒台正式议政席位"
 oe_chg2.6.b:0 "申明察合台大汗独揽册封与废立之权"
 oe_chg2.7.title:0 "东西裂隙：合札罕与秃黑鲁帖木儿"
 oe_chg2.7.desc:0 "中亚风云骤变：西南阿姆河畔，哈剌温部异密合札罕公然挑战汗廷官吏；东部天山与七河草原上，杜格拉特诸伯克则拥戴秃黑鲁帖木儿另立旗帜。唯有雷霆决断或精妙斡旋，方能避免汗国彻底东西撕裂。"
 oe_chg2.7.a:0 "尽发七河万户铁骑震慑异心诸将"
 oe_chg2.7.b:0 "居中斡旋东部伯克与西部阿米尔大停战"
 oe_chg2.8.title:0 "塔里木绿洲诸城邦自治之争"
 oe_chg2.8.desc:0 "趁西部河中局势动荡之际，喀什噶尔的杜格拉特领主与高昌—吐鲁番亦都护旧廷纷纷要求扩大财政自治权。准其自治可保东路商道安稳，改派汗廷达鲁花赤驻守则可强化中枢控制。"
 oe_chg2.8.a:0 "敕准塔里木自治宪章，定额岁贡玉帛"
 oe_chg2.8.b:0 "派驻汗廷达鲁花赤监理喀什与吐鲁番"
 oe_chg2.9.title:0 "亦力把里与天山北麓边防"
 oe_chg2.9.desc:0 "自楚河、阿拉木图直至准噶尔山口，每逢秋高马肥便有北疆游骑窥伺牧场。无论增筑季节性边防营垒，还是扩编精锐天山骑射手，都将把天山北麓化作难以逾越的铁壁。"
 oe_chg2.9.a:0 "沿七河要津广设季节性边防营垒"
 oe_chg2.9.b:0 "拔擢北疆老练斥候编入天山骑射手"
 oe_chg2.10.title:0 "力挽东裂：维系统一察合台汗国"
 oe_chg2.10.desc:0 "中亚史家纷纷断言察合台汗国终将永远分裂为草原亦力把里与城邦河中两部。如今大汗迎来逆转国运的绝佳契机——颁行东西双翼帝国宪章，将天山游牧精锐与河中富庶城邦重新熔铸为一统江山。"
 oe_chg2.10.a:0 "自阿力麻里颁行东西双翼帝国大宪章"
 oe_chg2.10.b:0 "与诸忠贞兀鲁思歃血结成尚武同盟"
 oe_chg2.11.title:0 "巴鲁剌思崛起与帖木儿的抉择"
 oe_chg2.11.desc:0 "自渴石与卡什卡达里亚河谷崛起的巴鲁剌思名将帖木儿，在河中骑军中威望如日中天。汗廷究竟应当以大汗玉玺册封巴鲁剌思家族为帝国大元帅、收为擎天柱石，还是扶植忠贞诸部与城邦武装加以制衡？"
 oe_chg2.11.a:0 "册封巴鲁剌思主帅为汗国大元帅"
 oe_chg2.11.b:0 "以忠贞阿米尔与城邦守备制衡巴鲁剌思"
 oe_chg2.12.title:0 "双都格局：阿力麻里与撒马尔罕"
 oe_chg2.12.desc:0 "为使草原与绿洲永保和谐，贤臣建言确立双都巡幸之制：盛夏于清凉丰美的阿力麻里召开忽里勒台检阅骑军，隆冬则驻跸青釉穹顶林立、百工云集的撒马尔罕理政兴学。"
 oe_chg2.12.a:0 "确立阿力麻里与撒马尔罕双都岁时巡幸"
 oe_chg2.12.b:0 "扩建撒马尔罕丝路重骑兵甲胄官坊"
 oe_chg2.13.title:0 "天山驿站与商队旅舍网"
 oe_chg2.13.desc:0 "往来丝绸之路的使节与商旅无不赞叹察合台大道之安宁。大匠呈上蓝图，拟自撒马尔罕经苦盏、喀什噶尔至吐鲁番，每隔一日行程兴建穹顶石砌商队旅舍，配齐驿马、蓄水池与官印护卫。"
 oe_chg2.13.a:0 "由国库出资广建官办石砌驿舍与护卫队"
 oe_chg2.13.b:0 "向大商帮特许承租驿栈以充实府库"
 oe_chg2.14.title:0 "帕米尔—费尔干纳坎儿井水利工程"
 oe_chg2.14.desc:0 "来自吐鲁番、费尔干纳与布哈拉的水利巧匠齐心协力，筹划开凿深层地下坎儿井与阶梯雪水干渠。引帕米尔与天山融雪穿沙而行，必能催生万顷果园、棉田与兴旺绿洲城镇。"
 oe_chg2.14.a:0 "全面兴修费尔干纳与塔里木王室坎儿井"
 oe_chg2.14.b:0 "优先保障边防军屯粮仓与战马饮水驿"
 oe_chg2.15.title:0 "喀什噶尔、撒马尔罕与吐鲁番学派"
 oe_chg2.15.desc:0 "校准巨型大理石六分仪的天文学家、回鹘书法名师与察合台突厥语诗人云集王室学院。一场璀璨的中亚文艺复兴正在绽放——察合台语正成为东起恒河、西至伏尔加河的学术、外交与诗文雅言。"
 oe_chg2.15.a:0 "重金赞助察合台观象台与皇家文学院"
 oe_chg2.15.b:0 "广育通晓察合台与波斯双语的书吏官僚"
 oe_chg2.16.title:0 "河中火药工坊与铸炮局"
 oe_chg2.16.desc:0 "放眼四海，自安纳托利亚、波斯至印度与大明，火药帝国竞相崛起。依托费尔干纳硫磺、巴达赫尚铜矿与丝路巧匠，撒马尔罕大冶铸师建言将野战火炮、火绳枪与察合台铁骑战术合而为一。"
 oe_chg2.16.a:0 "创设皇家铸炮局与火绳枪演武场"
 oe_chg2.16.b:0 "以机动驼炮配属撒马尔罕重装铁骑"
 oe_chg2.17.title:0 "重掌陆上丝绸之路霸权"
 oe_chg2.17.desc:0 "纵使远洋大帆船已绕过南方好望角，在察合台盛世庇护下的欧亚陆心商路却愈发勃兴。茶叶、大黄、丝绸、良马、美玉与精铁穿行于中国、印度、波斯与罗斯之间，尽经我朝税关。"
 oe_chg2.17.a:0 "颁行帝国丝绸之路统一关税同盟"
 oe_chg2.17.b:0 "编练常备草原火器军团护卫大陆商道"
 oe_chg2.18.title:0 "察合台嗣主永世大诏"
 oe_chg2.18.desc:0 "自1337年风雨飘摇的十字路口算起已逾二百载，察合台江山不仅未曾分崩离析，反而在烈火中涅槃新生。自天山冰峰至撒马尔罕青釉穹顶与吐鲁番绿洲，各国使节齐聚汗廷，见证察合台嗣主颁下永世大诏。"
 oe_chg2.18.a:0 "镌刻察合台欧亚帝国永世主权大宪"
 oe_chg2.18.b:0 "缔建绿洲与草原共荣的世界性大联邦"
 oe_chg2.19.title:0 "德里苏丹国：德干与古吉拉特伊克塔清丈"
 oe_chg2.19.desc:0 "在遥远的德干高原与繁华的古吉拉特海港，各地军事伊克塔领主日渐将行省包税视作私产。德里度支大臣建言将民政赋税清丈与军事统兵权分离——此举若成，必令苏丹府库暴增，却也考验地方权贵的忍耐底线。"
 oe_chg2.19.a:0 "于德干与古吉拉特严行帝国度支清丈"
 oe_chg2.19.b:0 "确认忠贞伊克塔封俸，严定出兵军额"
 oe_chg2.20.title:0 "孟加拉与恒河行省总督新制"
 oe_chg2.20.desc:0 "自德里顺恒河东下，经焦恩布尔直抵沃野千里的孟加拉三角洲，季风水稻与细棉织坊产出惊人财富。如何平衡东路行省总督的河运商贸管理与边防戍守职责，将决定北印度数代之兴衰。"
 oe_chg2.20.a:0 "特许恒河织造与河港王室关税署"
 oe_chg2.20.b:0 "敕设东疆节度总督与常备河防军镇"
 oe_chg2.21.title:0 "马穆鲁克：大马士革与阿勒颇纳伊卜商道协约"
 oe_chg2.21.desc:0 "马穆鲁克苏丹国的富强系于两大商脉：红海香料船队直抵开罗，而陆上丝绸商队则经大马士革与阿勒颇两位叙利亚纳伊卜辖境穿行。将叙利亚总督直接纳入开罗卡里米商帮税簿可大增国库收入，但北疆守将亦急盼增拨要塞防务经费。"
 oe_chg2.21.a:0 "将叙利亚纳伊卜并入开罗卡里米商税总账"
 oe_chg2.21.b:0 "重资加固阿勒颇与大马士革北疆堡垒"
 oe_chg2.22.title:0 "布尔吉更迭之后：开罗与叙利亚总督制"
 oe_chg2.22.desc:0 "1382年布尔吉王朝更迭后，切尔克斯军官派系稳固了开罗城堡大权，各大家族却纷纷觊觎富庶的大马士革与阿勒颇总督之位作为争雄跳板。实行由开罗迪万监督的三年轮任制可杜绝藩镇兵变，而厚赏布尔吉精骑家族则能锻造锐利军锋。"
 oe_chg2.22.a:0 "颁行开罗迪万稽核的叙利亚总督三年轮任制"
 oe_chg2.22.b:0 "以叙利亚军功采邑犒赏布尔吉精锐骑兵家族"
 oe_chg2.23.title:0 "匈牙利：特兰西瓦尼亚总督与三阶层宪章"
 oe_chg2.23.desc:0 "喀尔巴阡弧形山脉之内，特兰西瓦尼亚总督统辖着独树一帜的边疆三方格局：布拉索夫与锡比乌的萨克森自由要塞市镇、世守边关的塞凯伊轻骑与匈牙利郡县贵族。妥善整合三方特许宪章，便可将特兰西瓦尼亚锻造成圣史蒂芬王冠牢不可破的东方壁垒。"
 oe_chg2.23.a:0 "御准特兰西瓦尼亚萨克森、塞凯伊与贵族三方宪章"
 oe_chg2.23.b:0 "将特兰西瓦尼亚盐矿与金矿专卖直归布达王库"
 oe_chg2.24.title:0 "匈牙利大贵族领地、军旗团与喀尔巴阡防线"
 oe_chg2.24.desc:0 "匈牙利各大贵族联盟与克罗地亚—斯拉沃尼亚总督区手握精锐私人军旗团。随着多瑙河畔外患日亟，王国议会面临抉择：是立法严定大贵族边防军旗团出兵义务，还是联合王室自由市筹建直属王冠的常备财政劲旅？"
 oe_chg2.24.a:0 "立法严定大贵族军旗团戍边定额与要塞军费"
 oe_chg2.24.b:0 "依托王国议会与王室自由市裁抑大贵族权势"
