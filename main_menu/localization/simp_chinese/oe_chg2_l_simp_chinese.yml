 oe_chg_amir:0 "察合台阿米尔兀鲁思"
 oe_chg_amir_desc:0 "效忠阿力麻里察合台大汗的河中或塔里木世袭阿米尔兀鲁思。在汗廷统辖下共呈大汗版图与国号，享有适度草原冬防韧性，按制纳贡，且在汗廷完成集权改制前不可直接吞并。当汗廷权威高企时，随大汗出征四方并共御外侮。"
