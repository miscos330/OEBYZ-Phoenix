# NEW 2026-11-23 v16.5 Module 16.5-A: Steam Age, Early Industrial Revolution, Tier-9 Steam Railway & Nova Elysia Act III (oe_stm_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v165_steam_industry.py; edit the generator, not this file.
 oe_steam_engines: "蒸汽机械与引擎"
 oe_steam_engines_desc: "由燃煤蒸汽铸铁工场锻造的精密铁质汽缸、铆接锅炉与旋转蒸汽引擎，为近代机械化纺织工场与早期蒸汽铁路总站提供源源不断的动力。"
 oe_stm_railway_depot_construction: "蒸汽铁路总站营建"
 oe_stm_inaugural_depot_cost_reason: "帝国干线蒸汽铁路计划拨款"
 oe_stm_steam_ironworks: "燃煤蒸汽铸铁工场"
 oe_stm_steam_ironworks_desc: "自1740年起可营建的近代铸铁与锅炉工场，以煤炭与生铁制造商用蒸汽机械与引擎，并同步提升当地煤、铁与钢材产出效率。"
 oe_stm_mechanized_textile_mill: "蒸汽动力纺织工场"
 oe_stm_mechanized_textile_mill_desc: "自1755年起可营建的蒸汽动力纺纱与织布工场，消耗煤炭、原棉或羊毛以及蒸汽机械与引擎，大批量生产普通布匹与上等精纺呢绒。"
 oe_stm_early_steam_railway_depot: "早期蒸汽铁路总站"
 oe_stm_early_steam_railway_depot_desc: "自1775年起可在城市与大都会营建的帝国驿道第九级枢纽。耗资巨额钢材、煤炭与蒸汽机械，可树立区域行政直辖源点、大幅提升市场可达性与军队补给上限，并与周边帝国驿道网深度协同。"
 oe_stm_pm_atmospheric_ironworks: "大气抽水与冷凝蒸汽机"
 oe_stm_pm_atmospheric_ironworks_desc: "以煤炭熔炉铸造铁制汽缸、黄铜阀门与铆接锅炉，批量制造商用蒸汽机械与引擎。"
 oe_stm_pm_coke_high_pressure_engines: "焦炭精炼高压蒸汽机"
 oe_stm_pm_coke_high_pressure_engines_desc: "采用焦炭精炼优质钢材与重型镗床，制造结构紧凑的高压旋转蒸汽机与机车锅炉。"
 oe_stm_pm_steam_cotton_cloth: "蒸汽动力棉纺织布机"
 oe_stm_pm_steam_cotton_cloth_desc: "由固定式蒸汽机驱动的天轴带动成排纺锭与织机，将原棉大批量织成规格统一的棉布。"
 oe_stm_pm_steam_wool_cloth: "蒸汽动力毛纺梳毛织机"
 oe_stm_pm_steam_wool_cloth_desc: "机械化梳毛机与蒸汽织布机终年不停运转，将羊毛高效纺制成耐用的粗呢与军服布料。"
 oe_stm_pm_steam_fine_drapery: "蒸汽提花与精纺呢绒"
 oe_stm_pm_steam_fine_drapery_desc: "将旋转蒸汽动力、提花纹板织机与染缸结合，织造畅销海内外的上等精纺呢绒。"
 oe_stm_pm_railway_depot_maint: "蒸汽机车与铁轨养护"
 oe_stm_pm_railway_depot_maint_desc: "持续供应燃煤、备用钢轨与蒸汽锅炉零件，保障干线机车与总站道岔准点运转。"
 oe_stm_dec_patent_board.title: "特许设立帝国蒸汽机专利局"
 oe_stm_dec_patent_board.desc: "设立国家专利登记机构以保护汽缸、冷凝器与动力织机图纸。立即解锁蒸汽铸铁工场与蒸汽纺织工场，并获得持续40年的#G 帝国蒸汽机专利局#!修正。花费#Y 250#!金币。"
 oe_stm_dec_patent_board.a: "颁布帝国蒸汽机专利特许状"
 oe_stm_dec_railway_program.title: "启动九级帝国蒸汽铁路计划"
 oe_stm_dec_railway_program.desc: "统一铁轨轨距、削减帝国驿道走廊的铁路修筑费用，并在都城（若为城市或大都会）建成首座#T 九级早期蒸汽铁路总站#!。花费#Y 500#!金币。"
 oe_stm_dec_railway_program.a: "批准帝国干线蒸汽铁路计划"
 oe_stm_dec_factory_act.title: "颁布帝国工业工厂法"
 oe_stm_dec_factory_act.desc: "在各工业城镇推行法定锅炉安全巡检、童工工时限制与教区夜校，提升稳定度、阶层满意度、识字率与繁荣度，持续40年。花费#Y 200#!金币。"
 oe_stm_dec_factory_act.a: "向全国颁行工业工厂法"
 STATIC_MODIFIER_NAME_oe_stm_mod_dec_patent_board: "帝国蒸汽机专利局"
 STATIC_MODIFIER_DESC_oe_stm_mod_dec_patent_board: "特许专利委员会保障机械蓝图权益，广纳轮机名匠，并大幅加快近代工场与磨坊营建速度。"
 STATIC_MODIFIER_NAME_oe_stm_mod_dec_railway_program: "九级帝国蒸汽铁路计划"
 STATIC_MODIFIER_DESC_oe_stm_mod_dec_railway_program: "统一铁轨轨距与蒸汽铁路总站将帝国驿道网推升至机车牵引的新纪元，显著提升行政直辖与物流效率。"
 STATIC_MODIFIER_NAME_oe_stm_mod_dec_factory_act: "帝国工业工厂法"
 STATIC_MODIFIER_DESC_oe_stm_mod_dec_factory_act: "法定童工工时上限、锅炉安检与厂区识字学堂缓和了工业化阵痛，同时培育出更高素质的产业工匠。"
 STATIC_MODIFIER_NAME_oe_stm_mod_atmospheric_pumps: "皇家矿井大气抽水机"
 STATIC_MODIFIER_DESC_oe_stm_mod_atmospheric_pumps: "蒸汽抽水机昼夜不停地排干深层煤矿与铁矿积水，使原本被地下水淹没的富矿得以持续开采。"
 STATIC_MODIFIER_NAME_oe_stm_mod_private_mine_patents: "私营矿场抽水机特许权"
 STATIC_MODIFIER_DESC_oe_stm_mod_private_mine_patents: "矿主以专利抽成方式引进抽水汽缸，在几乎不耗国库的情况下稳步扩大煤炭产量。"
 STATIC_MODIFIER_NAME_oe_stm_mod_coke_smelting: "焦炭鼓风高炉体系"
 STATIC_MODIFIER_DESC_oe_stm_mod_coke_smelting: "以焦炭替代木炭冶炼生铁，使冶金业彻底摆脱森林砍伐瓶颈，催生出大规模铸铁工程。"
 STATIC_MODIFIER_NAME_oe_stm_mod_charcoal_guild_accord: "王室林木与铁匠行会协约"
 STATIC_MODIFIER_DESC_oe_stm_mod_charcoal_guild_accord: "有序管理炭林并渐进过渡高炉工艺，既安抚了传统铁匠行会，也保住了乡间林产秩序。"
 STATIC_MODIFIER_NAME_oe_stm_mod_power_loom_boom: "机械纺纱与动力织布热潮"
 STATIC_MODIFIER_DESC_oe_stm_mod_power_loom_boom: "多锭纺纱机与蒸汽织布机令廉价织物源源不断涌向海内外市场，商业利润激增。"
 STATIC_MODIFIER_NAME_oe_stm_mod_guild_transition_pact: "手工织工行会过渡协定"
 STATIC_MODIFIER_DESC_oe_stm_mod_guild_transition_pact: "转业补贴与精品印记帮助传统织工平稳融入机械工场，避免了剧烈的社会动荡。"
 STATIC_MODIFIER_NAME_oe_stm_mod_watt_condenser: "分离冷凝旋转蒸汽机"
 STATIC_MODIFIER_DESC_oe_stm_mod_watt_condenser: "分离式冷凝器将燃煤消耗骤降三分之二，并为各类工厂提供平稳高效的旋转动力。"
 STATIC_MODIFIER_NAME_oe_stm_mod_open_steam_blueprints: "公开蒸汽工程图纸"
 STATIC_MODIFIER_DESC_oe_stm_mod_open_steam_blueprints: "向各省工场公开汽缸公差与连杆图纸，使蒸汽机制造技艺在帝国各地迅速生根。"
 STATIC_MODIFIER_NAME_oe_stm_mod_coalfield_urban_boom: "特许煤铁工业自治镇"
 STATIC_MODIFIER_DESC_oe_stm_mod_coalfield_urban_boom: "兴起的矿区工镇获颁自治特许状，源源不断地将农村劳力转化为熟练技工与市民。"
 STATIC_MODIFIER_NAME_oe_stm_mod_pithead_excise: "帝国矿口煤炭消费税"
 STATIC_MODIFIER_DESC_oe_stm_mod_pithead_excise: "度支税吏在矿口逐车称量外运煤炭，迅速充盈国库，却加重了底层工户的燃料负担。"
 STATIC_MODIFIER_NAME_oe_stm_mod_locomotive_trials: "蒸汽机车铁轨试验"
 STATIC_MODIFIER_DESC_oe_stm_mod_locomotive_trials: "带轮缘铁轮牵引煤车疾驰于熟铁轨道之上，证明蒸汽机车足以彻底超越畜力运输。"
 STATIC_MODIFIER_NAME_oe_stm_mod_turnpike_standardization: "碎石帝国大道标准化"
 STATIC_MODIFIER_DESC_oe_stm_mod_turnpike_standardization: "碎石排水路基与标准驿站令现有车马干道发挥出极致效率，稳步提升商旅与邮递速度。"
 STATIC_MODIFIER_NAME_oe_stm_mod_mill_security_order: "反捣毁机器法与龙骑兵驻防"
 STATIC_MODIFIER_DESC_oe_stm_mod_mill_security_order: "龙骑兵奉严法日夜巡守纺纱工场，确保织机不停运转，但厂区怨愤随之暗涌。"
 STATIC_MODIFIER_NAME_oe_stm_mod_parish_artisan_relief: "教区手工业者救济委员会"
 STATIC_MODIFIER_DESC_oe_stm_mod_parish_artisan_relief: "市政粮仓救济与学徒津贴妥善安置了失业织工，将街头动荡化解为有序的产业转型。"
 STATIC_MODIFIER_NAME_oe_stm_mod_industrial_sanitation: "市政砖砌下水道与净水工程"
 STATIC_MODIFIER_DESC_oe_stm_mod_industrial_sanitation: "蒸汽泵站引入清洁净水并冲刷拥挤的工厂街巷，有效遏止了工业城镇的水源疫病。"
 STATIC_MODIFIER_NAME_oe_stm_mod_factory_quarantine: "工区临时疫病封锁线"
 STATIC_MODIFIER_DESC_oe_stm_mod_factory_quarantine: "严密的卫生封锁线阻断了霍乱向官署蔓延，但停工管控也令城镇繁荣暂时受挫。"
 STATIC_MODIFIER_NAME_oe_stm_mod_factory_hours_reform: "法定工时与工厂巡察官"
 STATIC_MODIFIER_DESC_oe_stm_mod_factory_hours_reform: "巡察官依法监管工场工时与童工就学，为国家涵养出更健康、更有文化的劳工阶层。"
 STATIC_MODIFIER_NAME_oe_stm_mod_laissez_faire_mills: "自由放任工厂特许令"
 STATIC_MODIFIER_DESC_oe_stm_mod_laissez_faire_mills: "不受限制的双班倒制度将织机产量与厂主红利推至顶峰，却令底层工人的境遇愈发艰苦。"
 STATIC_MODIFIER_NAME_oe_stm_mod_steam_packet_fleet: "帝国蒸汽邮轮航线"
 STATIC_MODIFIER_DESC_oe_stm_mod_steam_packet_fleet: "明轮蒸汽邮轮无惧逆风，在河口与海峡间保持准点通航，彻底革新了海上邮驿与贸易。"
 STATIC_MODIFIER_NAME_oe_stm_mod_river_steamer_charters: "私营内河汽船航运社"
 STATIC_MODIFIER_DESC_oe_stm_mod_river_steamer_charters: "浅吃水明轮汽船逆流而上，将煤炭、粮食与旅客高速运抵内陆腹地，激活流域商贸。"
 STATIC_MODIFIER_NAME_oe_stm_mod_protective_tariffs: "工业保护关税壁垒"
 STATIC_MODIFIER_DESC_oe_stm_mod_protective_tariffs: "定向关税屏障保护了本土新兴的蒸汽铁厂与纺织厂，抵御了外国廉价倾销。"
 STATIC_MODIFIER_NAME_oe_stm_mod_reciprocal_free_trade: "互惠自由通商条约"
 STATIC_MODIFIER_DESC_oe_stm_mod_reciprocal_free_trade: "削减关税壁垒为本国蒸汽工业品打开了广阔的海外销路，并降低了原料进口成本。"
 STATIC_MODIFIER_NAME_oe_stm_mod_trunk_railway_boom: "国家担保干线铁路热潮"
 STATIC_MODIFIER_DESC_oe_stm_mod_trunk_railway_boom: "国家担保铁路公债架桥穿山，将各省都会联结成一个高效贯通的蒸汽大市场。"
 STATIC_MODIFIER_NAME_oe_stm_mod_prudent_rail_charters: "审慎铁路证交所监管"
 STATIC_MODIFIER_DESC_oe_stm_mod_prudent_rail_charters: "严格的招股审计清除了泡沫投机线路，使国家信用在铁路狂潮中稳如磐石。"
 STATIC_MODIFIER_NAME_oe_stm_mod_telegraph_corridors: "干线信号与电报走廊"
 STATIC_MODIFIER_DESC_oe_stm_mod_telegraph_corridors: "光学信号塔与实验性电报线沿着铁路走廊飞传市价与政令，速度远超任何快马驿使。"
 STATIC_MODIFIER_NAME_oe_stm_mod_galvanic_academies: "科学院电学实验室"
 STATIC_MODIFIER_DESC_oe_stm_mod_galvanic_academies: "皇家科学院资助伏打电堆与电磁线圈试验，为下一个世纪的电气时代奠定理论基石。"
 STATIC_MODIFIER_NAME_oe_stm_mod_urban_franchise_reform: "城镇选举权与议会改革"
 STATIC_MODIFIER_DESC_oe_stm_mod_urban_franchise_reform: "新兴工业城市获得正式议席，将工匠与市民的政治诉求纳入宪制议事轨道。"
 STATIC_MODIFIER_NAME_oe_stm_mod_estate_settlement_upheld: "维护传统地产等级秩序"
 STATIC_MODIFIER_DESC_oe_stm_mod_estate_settlement_upheld: "王权与贵族坚定抵制普选请愿，维护了传统等级体制对国家要职的掌控。"
 STATIC_MODIFIER_NAME_oe_stm_mod_great_exhibition: "万国工业博览会东道国"
 STATIC_MODIFIER_DESC_oe_stm_mod_great_exhibition: "各国使节与工程师齐聚钢铁玻璃穹顶展馆，赞叹陈列其间的精良蒸汽机械与工业奇观。"
 STATIC_MODIFIER_NAME_oe_stm_mod_industrial_espionage_board: "海外机械考察委员会"
 STATIC_MODIFIER_DESC_oe_stm_mod_industrial_espionage_board: "精干的官派工程师秘密测绘列强织机、镗床与机车阀门，迅速消化吸收海外先进工艺。"
 STATIC_MODIFIER_NAME_oe_stm_mod_workshop_of_world: "世界钢铁工场"
 STATIC_MODIFIER_DESC_oe_stm_mod_workshop_of_world: "林立烟囱、蒸汽铁厂、动力织机与干线铁路共同宣告：一座以煤、铁、钢铸就的工业巨人已然崛起。"
 STATIC_MODIFIER_NAME_oe_stm_mod_balanced_industrial_realm: "机器时代的平衡治道"
 STATIC_MODIFIER_DESC_oe_stm_mod_balanced_industrial_realm: "公民学堂、洁净工镇与规范铁道将蒸汽财富与长久社会和谐融为一体，从容步入近代新纪元。"
 STATIC_MODIFIER_NAME_oe_stm_mod_appalachian_belt: "帝国阿巴拉契亚矿务署"
 STATIC_MODIFIER_DESC_oe_stm_mod_appalachian_belt: "帝国勘探官在谢南多厄以西开辟绵延百里的富煤与铁矿带，为切萨皮克熔炉提供世代不竭的原料。"
 STATIC_MODIFIER_NAME_oe_stm_mod_frontier_mining_leases: "督抚边疆矿业租约"
 STATIC_MODIFIER_DESC_oe_stm_mod_frontier_mining_leases: "边疆督抚区与市民财团共同承租阿巴拉契亚矿脉，将内陆忠诚与帝国冶金业紧密绑定。"
 STATIC_MODIFIER_NAME_oe_stm_mod_chesapeake_foundries: "切萨皮克帝国蒸汽铸造厂"
 STATIC_MODIFIER_DESC_oe_stm_mod_chesapeake_foundries: "新君士坦丁堡港畔铸造厂将希腊火冶金技艺与燃煤蒸汽机融会贯通，领先旧大陆数十年步入蒸汽时代。"
 STATIC_MODIFIER_NAME_oe_stm_mod_chesapeake_syndicates: "埃利西亚商帮铸铁财团"
 STATIC_MODIFIER_DESC_oe_stm_mod_chesapeake_syndicates: "希美航运商号沿帕塔普斯科河与詹姆斯河兴建私营铁厂，令跨大西洋工业品出口成倍增长。"
 STATIC_MODIFIER_NAME_oe_stm_mod_pan_american_federation: "泛美海事与关税联邦"
 STATIC_MODIFIER_DESC_oe_stm_mod_pan_american_federation: "统一的帝国海事法庭与免税航道将切萨皮克、西基克拉泽斯、北境与赫斯珀里亚连为一体化的海洋共同体。"
 STATIC_MODIFIER_NAME_oe_stm_mod_chesapeake_navigation_acts: "切萨皮克帝国航海条例"
 STATIC_MODIFIER_DESC_oe_stm_mod_chesapeake_navigation_acts: "帝国航海条例规定殖民地货船须经新君士坦丁堡海关转运，确保都城牢牢掌握美洲航运枢纽。"
 STATIC_MODIFIER_NAME_oe_stm_mod_industrial_senate_reform: "埃利西亚元老院工业库里亚"
 STATIC_MODIFIER_DESC_oe_stm_mod_industrial_senate_reform: "轮机名匠、造船巨擘与铁路银行家身披紫边长袍步入西方元老院，与古老世家共商帝国大计。"
 STATIC_MODIFIER_NAME_oe_stm_mod_patrician_industrial_charters: "帝国世家垄断特许宪章"
 STATIC_MODIFIER_DESC_oe_stm_mod_patrician_industrial_charters: "皇帝亲派监理官统辖战略兵工厂与蒸汽铁厂，将工业命脉牢牢收归皇室直属。"
 STATIC_MODIFIER_NAME_oe_stm_mod_elysian_citizenship_edict: "新安东尼努斯公民权敕令"
 STATIC_MODIFIER_DESC_oe_stm_mod_elysian_citizenship_edict: "在全美洲行省废除奴役并广颁罗马公民权，释放出蓬勃的自由劳动力、国民教育与公民凝聚力。"
 STATIC_MODIFIER_NAME_oe_stm_mod_gradual_manumission: "有偿赎身渐进解放宪章"
 STATIC_MODIFIER_DESC_oe_stm_mod_gradual_manumission: "帝国赎身公债在一代人内稳步推进人身解放，既保住种植园税基，也扩大了自由佃农阶层。"
 STATIC_MODIFIER_NAME_oe_stm_mod_trans_appalachian_rail: "赫斯珀里亚帝国铁道干线"
 STATIC_MODIFIER_DESC_oe_stm_mod_trans_appalachian_rail: "双轨铁道凿穿阿巴拉契亚群山，将切萨皮克直连俄亥俄与密西西比河谷，令大陆帝国脉络贯通。"
 STATIC_MODIFIER_NAME_oe_stm_mod_hesperian_rail_companies: "赫斯珀里亚合股铁路公司"
 STATIC_MODIFIER_DESC_oe_stm_mod_hesperian_rail_companies: "合股铁路公债将支线修入每一座边疆市镇，令内陆货运与土地价值成倍攀升。"
 STATIC_MODIFIER_NAME_oe_stm_mod_transatlantic_steamer: "双首鹰跨大西洋蒸汽邮轮"
 STATIC_MODIFIER_DESC_oe_stm_mod_transatlantic_steamer: "铁壳明轮蒸汽邮轮以十二日航期往返新君士坦丁堡、亚速尔与金角湾，令两大洋岸咫尺相连。"
 STATIC_MODIFIER_NAME_oe_stm_mod_atlantic_steam_cruisers: "大西洋蒸汽巡航辅助舰队"
 STATIC_MODIFIER_DESC_oe_stm_mod_atlantic_steam_cruisers: "高速燃煤蒸汽邮轮战时即可改装为武装巡洋舰，将帝国制海权从切萨皮克投送至博斯普鲁斯海峡。"
 STATIC_MODIFIER_NAME_oe_stm_mod_twin_rome_centennial: "1836双子罗马工业和平盛典"
 STATIC_MODIFIER_DESC_oe_stm_mod_twin_rome_centennial: "自博斯普鲁斯西渡五百年后，蒸汽与双首鹰令新旧两座罗马共沐空前的工业黄金盛世。"
 STATIC_MODIFIER_NAME_oe_stm_mod_centennial_civic_renaissance: "新埃利西亚百年公民文艺复兴"
 STATIC_MODIFIER_DESC_oe_stm_mod_centennial_civic_renaissance: "学府、自由工场与跨洲铁路共庆一座以科学、法治与蒸汽立国的包容性新罗马文明。"
 oe_stm.1.title: "大气抽水蒸汽机"
 oe_stm.1.desc: "煤田深处的地下水长年淹没着最丰饶的矿层。如今，一台精巧的铜铁火机在竖直汽缸中冷凝蒸汽，驱动橡木摇臂昼夜不息地从深井抽排积水。各地铁厂主与矿务官纷纷上书，恳请朝廷资助推广这种蒸汽机械。"
 oe_stm.1.a: "拨款兴建皇家矿井抽水蒸汽机"
 oe_stm.1.b: "向私营矿场授予抽水机专利特许"
 oe_stm.2.title: "焦炭鼓风高炉"
 oe_stm.2.desc: "数百年来，各地铁炉因耗尽木炭而受制于林木枯竭。如今冶炼名匠改良了以焙烧焦炭为燃料的高大鼓风炉，能以远低于往昔的成本连续浇铸优质生铁，足以供应铁桥、火炮与蒸汽锅炉之需。"
 oe_stm.2.a: "补贴推广焦炭鼓风高炉"
 oe_stm.2.b: "与传统林木铁匠行会订立渐进过渡协约"
 oe_stm.3.title: "珍妮纺纱机与动力织布机"
 oe_stm.3.desc: "在轰鸣作响的纺织城镇工场内，多锭纺纱机与重型动力织布机的效率已胜过数十名手工纺妇。一旦接入蒸汽天轴，一座工场便能供衣一省；但旧式布商行会也忧心忡忡地警告，家庭手织机将濒临绝境。"
 oe_stm.3.a: "特许兴办机械化蒸汽纺织工场"
 oe_stm.3.b: "设立手工织工行会转业过渡协定"
 oe_stm.4.title: "分离式冷凝器的突破"
 oe_stm.4.desc: "一位检修火机模型的仪器匠师攻克了最致命的热能损耗难题：不再于每次冲程冷却主汽缸，而是将废汽引入独立的冷凝室，并以行星齿轮将往复运动转为平稳旋转动力。燃煤消耗骤降，蒸汽机自此得以走出矿井、驱动百业。"
 oe_stm.4.a: "授予旋转冷凝蒸汽机独家专利与御用工坊"
 oe_stm.4.b: "向全国工场公开冷凝器工程图纸"
 oe_stm.5.title: "煤田工业城镇的勃兴"
 oe_stm.5.desc: "一代人前仅有几户农舍的煤田村落，如今已林立起红砖烟囱、铸铁高炉与连片工匠屋舍。地方官吏与厂主联名上疏，恳请朝廷颁授自治市镇特许状、增设商事法庭并修筑运煤大道。"
 oe_stm.5.a: "向新兴煤铁工镇颁授自治特许状"
 oe_stm.5.b: "在矿口开征帝国煤炭消费税"
 oe_stm.6.title: "早期铁轨与蒸汽机车"
 oe_stm.6.desc: "矿区运煤道上的木板轨道已被熟铁边缘轨取代，一位胆识过人的工程师更将高压锅炉架上带轮缘铁轮，拖曳十吨铁矿在滚滚白汽中轰鸣前行。帝国驿道勘测官禀报，若在都邑增建蒸汽铁路总站，陆上交通将迎来旷古剧变。"
 oe_stm.6.a: "资助高压蒸汽机车与铁轨试验"
 oe_stm.6.b: "优先推进碎石帝国驿道标准化"
 oe_stm.7.title: "纺织城中的捣毁机器风潮"
 oe_stm.7.desc: "寒冬浓雾之下，成群失业的蒙面手工织工挥舞大锤夜袭机械纺厂，砸毁动力织机并张贴抗议传单。厂主们急求朝廷派兵弹压，而教区长老则恳请开仓赈济、安抚流离工匠。"
 oe_stm.7.a: "派驻龙骑兵并颁布反捣毁机器严法"
 oe_stm.7.b: "拨款设立教区手工业者救济与转业基金"
 oe_stm.8.title: "工厂城镇霍乱与公共卫生改革"
 oe_stm.8.desc: "急剧膨胀的工区人口早已超出中世纪水井与明沟的承载极限，一场猛烈的水源疫病在染坊与工厂棚户区间肆虐。医官疾呼兴建砖砌暗渠与蒸汽净水泵站，以防瘟疫令全城工场陷于瘫痪。"
 oe_stm.8.a: "兴建市政砖砌下水道与蒸汽净水厂"
 oe_stm.8.b: "仅对工区实施临时疫病封锁管控"
 oe_stm.9.title: "童工问题与工厂法大辩论"
 oe_stm.9.desc: "一份触目惊心的调查卷宗揭露了工场内长达十六小时的班次、毫无防护的传动皮带以及年仅八岁的童工。改革派力主立法限制工时并设厂区学堂，而厂主联合会则警告严厉管制将令本国丧失出口优势。"
 oe_stm.9.a: "立法限制工时并派驻工厂巡察官"
 oe_stm.9.b: "采纳厂主诉求以维持最高产出"
 oe_stm.10.title: "蒸汽邮轮与明轮汽船"
 oe_stm.10.desc: "当逆风令高桅帆船滞留港内之际，一艘双侧明轮翻涌白浪的蒸汽邮轮昂然破浪出港。商界敏锐地看到，无论内河逆流还是近海邮驿，航运从此将不再受制于风向与潮汐。"
 oe_stm.10.a: "组建帝国蒸汽邮轮定期航线"
 oe_stm.10.b: "特许私营内河汽船航运社"
 oe_stm.11.title: "工业关税战"
 oe_stm.11.desc: "蒸汽织机与铁厂的巨量产出打破了旧有的国际贸易格局。列强港口纷纷竖起报复性关税，而本国商工界也激烈分化：一派呼吁保护本土幼稚工业，另一派力主签订互惠自由通商条约。"
 oe_stm.11.a: "竖立工业保护关税壁垒"
 oe_stm.11.b: "力推互惠自由通商条约"
 oe_stm.12.title: "干线铁路狂潮"
 oe_stm.12.desc: "投机客、各省市长与银团挤满交易所，竞相呈递铁路筑路法案。满纸红线勾勒出一日贯通煤田与京师的宏图，但若放任浮夸招股横行，亦恐酿成金融泡沫。"
 oe_stm.12.a: "以国家信用担保干线铁路公债"
 oe_stm.12.b: "推行审慎铁路证交所审计监管"
 oe_stm.13.title: "光学与电报信号试验"
 oe_stm.13.desc: "在新修的铁路路基旁，工程师同时演示了山巅光学臂板信号塔与伏打电池经铜线驱动磁针偏转的试验。人类历史上首次，军政急报与列车调度得以跑赢最快的蒸汽机车。"
 oe_stm.13.a: "沿干线走廊架设国家信号与电报网"
 oe_stm.13.b: "资助科学院电学与电磁实验室"
 oe_stm.14.title: "宪章派与行会普选请愿"
 oe_stm.14.desc: "来自新兴工业城镇的数十万技工、铁路员工与店主联署长卷请愿书，要求获得议会席位、市政选举与公平税制。枢密议事厅必须在扩大城镇公民选举权与坚守旧有等级秩序之间作出抉择。"
 oe_stm.14.a: "扩大城镇选举权并改革市政议会"
 oe_stm.14.b: "坚守传统地产贵族等级秩序"
 oe_stm.15.title: "万国工业博览会"
 oe_stm.15.desc: "铸铁肋拱与大片平板玻璃在京师御苑拔地而起，筹办一场空前的工业与技艺盛会：锃亮的蒸汽机车、提花织机、精密车床与精钢火炮将齐聚同一座晶莹穹顶之下。"
 oe_stm.15.a: "盛大举办万国工业与工艺博览会"
 oe_stm.15.b: "派遣技术考察团赴海外测绘列强机械"
 oe_stm.16.title: "机器时代的黎明"
 oe_stm.16.desc: "步入十九世纪三十年代，活塞轰鸣、高炉火光与机车汽笛已重塑帝国的每一寸疆土。当年始于深井抽水的一枚汽缸，如今已决定万国兴衰——后世将铭记我们如何驾驭这份煤铁铸就的时代遗产。"
 oe_stm.16.a: "铸就睥睨天下的世界钢铁工场"
 oe_stm.16.b: "以文教民生与工业并重的治道开启新纪元"
 oe_stm.17.title: "阿巴拉契亚煤铁带"
 oe_stm.17.desc: "越过蓝岭山脉与谢南多厄河谷的帝国勘测官满载乌黑烟煤与高品位赤铁矿返回新君士坦丁堡。在林海茫茫的阿巴拉契亚群山之下，沉睡着足以武装并工业化整个西半球的无尽燃料与铁矿。"
 oe_stm.17.a: "设立帝国阿巴拉契亚矿务署直辖开发"
 oe_stm.17.b: "将边疆矿脉特许租予督抚区与矿业巨贾"
 oe_stm.18.title: "切萨皮克蒸汽与铸铁工场"
 oe_stm.18.desc: "在烟云缭绕的切萨皮克船坞内，深谙希腊火技艺与古罗马水力机械的匠师们将加压铜锅炉与燃煤高炉合二为一。在旧大陆宫廷尚未知晓蒸汽伟力之际，新君士坦丁堡的港畔已响起工业引擎的节拍。"
 oe_stm.18.a: "兴建切萨皮克帝国蒸汽铸造工场"
 oe_stm.18.b: "与埃利西亚商帮铸铁财团合资营办"
 oe_stm.19.title: "泛美海事联邦"
 oe_stm.19.desc: "从北境鳕鱼船队、西基克拉泽斯蔗糖商船到南方白银邮船，美洲各督抚区的帆影皆悬紫鹰旗帜。各地海事代表齐聚切萨皮克，提议缔结常设泛美海事联邦，统一护航防务、关税法典与远洋海图。"
 oe_stm.19.a: "缔结泛美海事与免税关税联邦"
 oe_stm.19.b: "推行以切萨皮克为核心的帝国航海条例"
 oe_stm.20.title: "新罗马工业元老院改革"
 oe_stm.20.desc: "三百载西渡创业孕育出声势浩大的铁厂主、蒸汽造船家与跨洲银行家阶层，他们正式要求在西方元老院中增设工业库里亚席位。而古老世家则主张将战略铁厂与船坞继续置于皇室贵族监理之下。"
 oe_stm.20.a: "在埃利西亚元老院正式增设工业库里亚"
 oe_stm.20.b: "将核心工业收归世家与皇室特许监理"
 oe_stm.21.title: "埃利西亚废奴与公民权敕令"
 oe_stm.21.desc: "随着机械工场与自由雇工日益超越陈旧的种植园奴役制度，新君士坦丁堡的法学家援引古罗马《安东尼努斯敕令》，呼吁皇帝在全美洲行省废除奴隶制，并向一切自由居民普授罗马公民权。"
 oe_stm.21.a: "颁布《新安东尼努斯敕令》全面废奴授籍"
 oe_stm.21.b: "推行有偿赎身渐进解放宪章"
 oe_stm.22.title: "跨阿巴拉契亚帝国蒸汽铁路"
 oe_stm.22.desc: "帝国铁路工程师已勘定跨越阿巴拉契亚天险的石拱高架桥与盘山坡道，将新君士坦丁堡港畔总站直连俄亥俄与密西西比大平原。一旦蒸汽机车穿山而过，广袤的赫斯珀里亚腹地距元老院将从数月之遥缩为数日可达。"
 oe_stm.22.a: "由国库斥资修筑赫斯珀里亚帝国铁道干线"
 oe_stm.22.b: "特许赫斯珀里亚合股铁路公司集资承建"
 oe_stm.23.title: "直抵君士坦丁堡的跨大西洋蒸汽邮轮"
 oe_stm.23.desc: "一艘双烟囱铁壳明轮蒸汽邮轮自切萨皮克码头起锚，经亚速尔与直布罗陀煤站补给，仅用十二日便直抵金角湾。自十四世纪起隔洋相望的新旧两座世界，终在炉火与白汽间天堑变通途。"
 oe_stm.23.a: "开通双首鹰跨大西洋帝国蒸汽邮轮定期航线"
 oe_stm.23.b: "将蒸汽邮轮武装为大西洋高速巡洋辅助舰队"
 oe_stm.24.title: "1836双子罗马工业盛典"
 oe_stm.24.desc: "距当年绝境求生的流亡舰队扬起紫帆西渡已近五百春秋。来自美洲各督抚区与地中海旧港的使节齐聚新君士坦丁堡的钢铁玻璃大殿，跨阿巴拉契亚干线汽笛长鸣，新旧两座罗马钟声齐响——一座横跨两洲的蒸汽帝国已傲立于近代世界之巅。"
 oe_stm.24.a: "宣告永恒的工业罗马和平盛世"
 oe_stm.24.b: "将盛典献给新罗马的科学、法治与公民自由"
