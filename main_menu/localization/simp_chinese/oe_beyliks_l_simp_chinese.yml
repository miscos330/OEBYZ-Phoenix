 oe_bey.1.t: "黑海之行"
 oe_bey.1.desc: "#F 1336年，乌穆尔出兵帮安德洛尼卡三世收复米蒂利尼和福恰；1337年，乌穆尔又派两千人随皇帝平定阿尔巴尼亚的起事。据土耳其方面的记载，1339至1340年间，乌穆尔的船队随皇帝进入黑海，劫掠了基利亚一带和瓦拉几亚的海岸。#!\n\n如今，乌穆尔的船停在海峡口。乌穆尔派人进京，请皇帝一同出海；就算帝国不出船，也请借道海峡。"
 oe_bey.1.a: "同舟出海"
 oe_bey.1.a.tt: "花费#R 1#!个月的贸易与税收收入\n劫掠归来，获得#G 2#!个月的贸易与税收收入\n艾登对帝国好感#G +15#!，持续#Y 10#!年\n基利亚遭劫掠（不在玩家手中时）：获得[ShowModifier('looted')]，持续#Y 3#!年；其主人对帝国好感#R −15#!，持续#Y 5#!年\n瓦拉几亚（不是玩家时）对帝国好感#R −15#!，持续#Y 5#!年"
 oe_bey.1.b: "借道海峡，不出船"
 oe_bey.1.b.tt: "艾登对帝国好感#G +5#!，持续#Y 5#!年"
 oe_bey.1.c: "婉拒"
 oe_bey.1.c.tt: "艾登对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.2.t: "士麦那城下"
 oe_bey.2.desc_full: "#F 艾登的贝伊乌穆尔是安德洛尼卡三世的盟友。1342年和1343年，乌穆尔两度率船渡海援助坎塔库泽诺斯；1344年秋，十字军夺下了士麦那的港堡。1348年春，乌穆尔攻打士麦那港堡，攀城时中箭身亡，兄长哈兹尔继位。同年八月，教皇批准了哈兹尔与拉丁人的和约：港口关税一半归拉丁人，基督徒的船只可以自由进港，艾登的舰队解甲。#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_death: "#F 艾登的贝伊乌穆尔是安德洛尼卡三世的盟友。1342年和1343年，乌穆尔两度率船渡海援助坎塔库泽诺斯；1344年秋，十字军夺下了士麦那的港堡。1348年春，乌穆尔攻打士麦那港堡，攀城时中箭身亡，兄长哈兹尔继位。#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_early: "#F 艾登的贝伊乌穆尔是安德洛尼卡三世的盟友。1342年和1343年，乌穆尔两度率船渡海援助坎塔库泽诺斯；1344年秋，十字军夺下了士麦那的港堡。#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.a: "遣使吊唁，与新贝伊续好"
 oe_bey.2.a.tt: "花费#R 1#!个月的贸易与税收收入\n艾登对帝国好感#G +15#!，持续#Y 10#!年\n与艾登的同盟（如果有）照旧"
 oe_bey.2.b: "盟约随乌穆尔而去"
 oe_bey.2.b.tt: "帝国与艾登的同盟解除\n教廷、威尼斯和医院骑士团对帝国好感#G +10#!，持续#Y 5#!年\n艾登对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.2.c: "不闻不问"
 oe_bey.2.c.tt: "帝国不派使者，与艾登的往来一切照旧"
 oe_bey.3.t: "海峡对岸"
 oe_bey.3.desc: "#F 卡雷西的贝伊家族起了内讧，一位王子投奔奥尔汗，献出巴勒克埃西尔、贝尔加马和埃德雷米特。奥斯曼人接收了卡雷西的旧部和船只，从此站到了达达尼尔海峡边上。卡雷西被吞并的年份，各书说法不一。#!\n\n[GetCountry('BYZ').Custom('OeBeyStraitNow')]"
 oe_bey.3.a: "加固海峡西岸"
 oe_bey.3.a.tt: "花费#R 2#!个月的贸易与税收收入\n帝国在加里波利一带（达达尼尔省）拥有的地点获得[ShowModifier('oe_bey_hellespont_watch')]，持续#Y 20#!年"
 oe_bey.3.b: "向奥斯曼人送礼"
 oe_bey.3.b.tt: "花费#R 1#!个月的贸易与税收收入\n奥斯曼对帝国好感#G +15#!，持续#Y 5#!年"
 oe_bey.3.c: "收留卡雷西的遗民"
 oe_bey.3.c.tt: "帝国获得[ShowModifier('oe_bey_karesi_exiles')]，持续#Y 10#!年\n奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.4.t: "最后的亚洲之城"
 oe_bey.4.desc_full: "#F 费拉德尔菲亚四面都是突厥人的地方，早年向盖尔米扬缴人头税，却一直奉皇帝为主，是帝国在小亚细亚的最后一座城。1390年，巴耶济德来要这座城，曼努埃尔作为苏丹的附庸被迫随军。城里人看见帝国的旗帜竖在苏丹营中，开城投降。#!\n\n[GetCountry('BYZ').Custom('OeBeyPhilNow')]"
 oe_bey.4.desc_early: "#F 费拉德尔菲亚四面都是突厥人的地方，早年向盖尔米扬缴人头税，却一直奉皇帝为主，是帝国在小亚细亚的最后一座城。#!\n\n[GetCountry('BYZ').Custom('OeBeyPhilNow')]"
 oe_bey.4.a: "随军受降"
 oe_bey.4.a.tt: "费拉德尔菲亚归奥斯曼\n[oe_tu_authority|e]#R −3#!\n奥斯曼对帝国好感#G +20#!，持续#Y 10#!年\n帝国臣属于苏丹时：苏丹的耐心#G +20#!"
 oe_bey.4.b: "让城中自守"
 oe_bey.4.b.tt: "费拉德尔菲亚获得[ShowModifier('oe_bey_phil_alone')]，持续#Y 10#!年\n奥斯曼对帝国好感#R −30#!，持续#Y 10#!年\n帝国臣属于苏丹时：苏丹的耐心#R −30#!\n帝国不因此开战；苏丹日后是否来攻，由苏丹决定"
 oe_bey.4.c: "出钱保城"
 oe_bey.4.c.tt: "花费#R 3#!个月的贸易与税收收入\n费拉德尔菲亚获得[ShowModifier('oe_bey_phil_tribute')]，持续#Y 10#!年\n奥斯曼对帝国好感#R −5#!，持续#Y 5#!年\n帝国臣属于苏丹时：苏丹的耐心#R −10#!"
 oe_bey.5.t: "卡拉曼的使者"
 oe_bey.5.desc_full: "#F 卡拉曼以科尼亚为都，是安纳托利亚诸侯里最强的一家。1386或1387年（年份各书不一），穆拉德一世曾在弗兰克亚泽打败卡拉曼。据记载，1396年苏丹北上迎击十字军时，卡拉曼的阿拉丁·阿里趁机夺下安卡拉，俘获了苏丹的大将，随后又想求和。苏丹不许，回师在阿克恰伊打败卡拉曼，处死了阿拉丁（1397或1398年）。#!\n\n[GetCountry('BYZ').Custom('OeBeyKarNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.5.desc_ankara: "#F 卡拉曼以科尼亚为都，是安纳托利亚诸侯里最强的一家。1386或1387年（年份各书不一），穆拉德一世曾在弗兰克亚泽打败卡拉曼。据记载，1396年苏丹北上迎击十字军时，卡拉曼的阿拉丁·阿里趁机夺下安卡拉，俘获了苏丹的大将，随后又想求和。#!\n\n[GetCountry('BYZ').Custom('OeBeyKarNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.5.desc_early: "#F 卡拉曼以科尼亚为都，是安纳托利亚诸侯里最强的一家。1386或1387年（年份各书不一），穆拉德一世曾在弗兰克亚泽打败卡拉曼。#!\n\n[GetCountry('BYZ').Custom('OeBeyKarNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.5.a: "赠金结好"
 oe_bey.5.a.tt: "花费#R 2#!个月的贸易与税收收入\n卡拉曼对帝国好感#G +20#!，持续#Y 10#!年\n京城被封锁时：粮储#G +10#!，城心#G +8#!\n若卡拉曼日后被苏丹收服，奥斯曼对帝国好感#R −15#!，持续#Y 10#!年"
 oe_bey.5.b: "只通消息"
 oe_bey.5.b.tt: "卡拉曼对帝国好感#G +5#!，持续#Y 5#!年\n京城被封锁时：城心#G +3#!"
 oe_bey.5.c: "不卷入"
 oe_bey.5.c.tt: "帝国不作答复，卡拉曼的使者空手而回"
 oe_bey.6.t: "帖木儿的恩典"
 oe_bey.6.desc_full: "#F 安卡拉之战后，帖木儿把巴耶济德夺去的土地还给了旧日的贝伊们。萨鲁汗的奥尔汗1402年8月回到马尼萨；盖尔米扬的雅各布、门泰谢的伊利亚斯、卡拉曼的穆罕默德和艾登家族重新立国；詹达尔的伊斯凡迪亚尔保住了卡斯塔莫努。奥斯曼的王子们只剩下比提尼亚和鲁米利亚。#!\n\n[GetCountry('BYZ').Custom('OeBeyGraceNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.6.desc_early: "#F 1390年，巴耶济德一次出征就收服了艾登、萨鲁汗和门泰谢，又压服了盖尔米扬；1391年，苏丹取了卡斯塔莫努。1399年，盖尔米扬的雅各布投奔了帖木儿。#!\n\n[GetCountry('BYZ').Custom('OeBeyGraceNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.6.a: "遣使诸侯，结为奥援"
 oe_bey.6.a.tt: "花费#R 1#!个月的贸易与税收收入\n每个复国的诸侯对帝国好感#G +20#!，持续#Y 10#!年\n帝国在奥斯曼王子中押了人时：所押一方的势#G +5#!"
 oe_bey.6.b: "只和我们押的王子同进退"
 oe_bey.6.b.tt: "所押一方的势#G +8#!\n每个复国的诸侯对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.6.c: "坐观虎斗"
 oe_bey.6.c.tt: "帝国不表态，诸侯与奥斯曼的王子各行其是"
 oe_bey.7.t: "卡拉曼的密约"
 oe_bey.7.desc_full: "#F 安卡拉之战后复国的卡拉曼，仍是安纳托利亚诸侯里最强的一家。此后几十年，卡拉曼几度与奥斯曼交兵，又几度求和。1443至1444年间，十字军进军巴尔干，卡拉曼的易卜拉欣二世出兵呼应，毁了安卡拉和屈塔希亚。穆拉德二世回师之后，易卜拉欣只好接受苏丹的全部条件。#!\n\n[GetCountry('BYZ').Custom('OeBeyVarnaNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.7.desc_rising: "#F 安卡拉之战后复国的卡拉曼，仍是安纳托利亚诸侯里最强的一家。此后几十年，卡拉曼几度与奥斯曼交兵，又几度求和。1443至1444年间，十字军进军巴尔干，卡拉曼的易卜拉欣二世出兵呼应，毁了安卡拉和屈塔希亚。#!\n\n[GetCountry('BYZ').Custom('OeBeyVarnaNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.7.desc_early: "#F 安卡拉之战后复国的卡拉曼，仍是安纳托利亚诸侯里最强的一家。此后几十年，卡拉曼几度与奥斯曼交兵，又几度求和。#!\n\n[GetCountry('BYZ').Custom('OeBeyVarnaNow')]\n\n眼下的牵制：与奥斯曼接壤、不受苏丹节制、对帝国没有敌意的[oe_tu_beylik|e]有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#!家。"
 oe_bey.7.a: "居间牵线"
 oe_bey.7.a.tt: "花费#R 1#!个月的贸易与税收收入\n卡拉曼对帝国好感#G +15#!，持续#Y 10#!年\n卡拉曼起兵（奥斯曼不在玩家手中时）：奥斯曼手里的安卡拉和屈塔希亚遭劫掠，获得[ShowModifier('looted')]，持续#Y 3#!年\n奥斯曼对帝国好感#R −10#!，持续#Y 5#!年\n西方的军队与苏丹决战时，胜算#G +5%#!（卡拉曼已与奥斯曼交战时不另加）"
 oe_bey.7.b: "只转书信"
 oe_bey.7.b.tt: "卡拉曼对帝国好感#G +5#!，持续#Y 5#!年\n卡拉曼起兵（奥斯曼不在玩家手中时）：奥斯曼手里的安卡拉遭劫掠，获得[ShowModifier('looted')]，持续#Y 3#!年\n西方的军队与苏丹决战时，胜算#G +5%#!（卡拉曼已与奥斯曼交战时不另加）"
 oe_bey.7.c: "不插手"
 oe_bey.7.c.tt: "帝国不替卡拉曼传信，卡拉曼的使者空手而回"
 oe_bey.90.t: "突厥诸侯：执行"
