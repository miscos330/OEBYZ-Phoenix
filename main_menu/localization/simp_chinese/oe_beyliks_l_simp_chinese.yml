 oe_bey.1.t: "黑海之行"
 oe_bey.1.desc: "#F 1336年，乌穆尔出兵帮安德洛尼卡三世收复米蒂利尼和福恰；1337年，乌穆尔又派两千人随皇帝平定阿尔巴尼亚的起事。据土耳其方面的记载，1339至1340年间，乌穆尔的船队随皇帝进入黑海，劫掠了基利亚一带和瓦拉几亚的海岸。#!\n\n如今，乌穆尔的船停在海峡口。乌穆尔派人进京，请皇帝一同出海；就算帝国不出船，也请借道海峡。"
 oe_bey.1.a: "同舟出海"
 oe_bey.1.a.tt: "花费#R 1#!个月的贸易与税收收入\n劫掠归来，获得#G 2#!个月的贸易与税收收入\n艾登对帝国好感#G +15#!，持续#Y 10#!年\n基利亚遭劫掠（不在玩家手中时）：获得[ShowModifier('looted')]，持续#Y 3#!年；其主人对帝国好感#R −15#!，持续#Y 5#!年\n瓦拉几亚（不是玩家时）对帝国好感#R −15#!，持续#Y 5#!年"
 oe_bey.1.b: "借道海峡，不出船"
 oe_bey.1.b.tt: "艾登对帝国好感#G +5#!，持续#Y 5#!年"
 oe_bey.1.c: "婉拒"
 oe_bey.1.c.tt: "艾登对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.2.t: "士麦那城下"
 oe_bey.2.desc_full: "#F 艾登的贝伊乌穆尔是安德洛尼卡三世的盟友。1342年和1343年，乌穆尔两度率船渡海援助坎塔库泽诺斯；1344年秋，十字军夺下了士麦那的港堡。1348年春，乌穆尔攻打士麦那港堡，攀城时中箭身亡，兄长哈兹尔继位。同年八月，教皇批准了哈兹尔与拉丁人的和约：港口关税一半归拉丁人，基督徒的船只可以自由进港，艾登的舰队解甲。#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_death: "#F 艾登的贝伊乌穆尔是安德洛尼卡三世的盟友。1342年和1343年，乌穆尔两度率船渡海援助坎塔库泽诺斯；1344年秋，十字军夺下了士麦那的港堡。1348年春，乌穆尔攻打士麦那港堡，攀城时中箭身亡，兄长哈兹尔继位。#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_early: "#F 艾登的贝伊乌穆尔是安德洛尼卡三世的盟友。1342年和1343年，乌穆尔两度率船渡海援助坎塔库泽诺斯；1344年秋，十字军夺下了士麦那的港堡。#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.a: "遣使吊唁，与新贝伊续好"
 oe_bey.2.a.tt: "花费#R 1#!个月的贸易与税收收入\n艾登对帝国好感#G +15#!，持续#Y 10#!年\n与艾登的同盟（如果有）照旧"
 oe_bey.2.b: "盟约随乌穆尔而去"
 oe_bey.2.b.tt: "帝国与艾登的同盟解除\n教廷、威尼斯和医院骑士团对帝国好感#G +10#!，持续#Y 5#!年\n艾登对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.2.c: "不闻不问"
 oe_bey.2.c.tt: "帝国不派使者，与艾登的往来一切照旧"
 oe_bey.3.t: "海峡对岸"
 oe_bey.3.desc: "#F 卡雷西的贝伊家族起了内讧，一位王子投奔奥尔汗，献出巴勒克埃西尔、贝尔加马和埃德雷米特。奥斯曼人接收了卡雷西的旧部和船只，从此站到了达达尼尔海峡边上。卡雷西被吞并的年份，各书说法不一。#!\n\n[GetCountry('BYZ').Custom('OeBeyStraitNow')]"
 oe_bey.3.a: "加固海峡西岸"
 oe_bey.3.a.tt: "花费#R 2#!个月的贸易与税收收入\n帝国在加里波利一带（达达尼尔省）拥有的地点获得[ShowModifier('oe_bey_hellespont_watch')]，持续#Y 20#!年"
 oe_bey.3.b: "向奥斯曼人送礼"
 oe_bey.3.b.tt: "花费#R 1#!个月的贸易与税收收入\n奥斯曼对帝国好感#G +15#!，持续#Y 5#!年"
 oe_bey.3.c: "收留卡雷西的遗民"
 oe_bey.3.c.tt: "帝国获得[ShowModifier('oe_bey_karesi_exiles')]，持续#Y 10#!年\n奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_bey.90.t: "突厥诸侯：执行"
