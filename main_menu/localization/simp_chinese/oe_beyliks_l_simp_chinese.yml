l_simp_chinese:
 OE_BEY_UMUR_SK: "如今，消息传到京城：乌穆尔死在士麦那港堡的城下。帝国失去了一位老朋友——内战时，正是乌穆尔的船队渡海援助坎塔库泽诺斯。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_SL: "如今，同盟的使者带来了消息：乌穆尔死在士麦那港堡的城下。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_SR: "如今，消息传到京城：乌穆尔死在士麦那港堡的城下。内战时，乌穆尔的船队屡次渡海援助坎塔库泽诺斯，是摄政朝廷的劲敌。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_SP: "如今，消息传到京城：乌穆尔死在士麦那港堡的城下。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_NK: "如今，消息传到京城：乌穆尔去世了。帝国失去了一位老朋友——内战时，正是乌穆尔的船队渡海援助坎塔库泽诺斯。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_NL: "如今，同盟的使者带来了消息：乌穆尔去世了。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_NR: "如今，消息传到京城：乌穆尔去世了。内战时，乌穆尔的船队屡次渡海援助坎塔库泽诺斯，是摄政朝廷的劲敌。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_UMUR_NP: "如今，消息传到京城：乌穆尔去世了。艾登的新贝伊派人来报丧，看帝国如何回应。"
 OE_BEY_STRAIT_F: "如今，奥斯曼人的地盘已经到了海峡东岸，对岸就是帝国在加里波利一带的城镇；奥尔汗的兵已经在色雷斯过冬。海峡西岸的守将请求增援，朝中也有人主张向奥斯曼人示好。"
 OE_BEY_STRAIT_P: "如今，奥斯曼人的地盘已经到了海峡东岸，对岸就是帝国在加里波利一带的城镇。海峡西岸的守将请求增援，朝中也有人主张向奥斯曼人示好。"
 OE_BEY_CHR_SEA_1: "黑海：帝国与乌穆尔同舟出海。"
 OE_BEY_CHR_SEA_2: "黑海：帝国借道给乌穆尔，没有出船。"
 OE_BEY_CHR_SEA_3: "黑海：帝国婉拒了乌穆尔。"
 OE_BEY_CHR_SEA_X: "黑海：乌穆尔没有来邀帝国。"
 OE_BEY_CHR_SEA_W: "黑海：还没有消息（1339年春起）。"
 OE_BEY_CHR_UMUR_1: "乌穆尔死后，帝国与新贝伊续了旧好。"
 OE_BEY_CHR_UMUR_2: "乌穆尔死后，帝国解除了与艾登的同盟。"
 OE_BEY_CHR_UMUR_3: "乌穆尔死后，帝国不闻不问。"
 OE_BEY_CHR_UMUR_X: "乌穆尔死后，帝国没有表态。"
 OE_BEY_CHR_UMUR_Y: "乌穆尔活过了1365年。"
 OE_BEY_CHR_UMUR_D: "乌穆尔已死，消息还在路上。"
 OE_BEY_CHR_UMUR_W: "乌穆尔还在世。"
 OE_BEY_CHR_STR_1: "海峡：帝国加固了西岸。"
 OE_BEY_CHR_STR_2: "海峡：帝国向奥斯曼人送了礼。"
 OE_BEY_CHR_STR_3: "海峡：帝国收留了卡雷西的遗民。"
 OE_BEY_CHR_STR_X: "海峡：这些年里没有动静。"
 OE_BEY_CHR_STR_W: "海峡：卡雷西的结局还没有分晓。"
 OE_BEY_PHIL_V: "如今，苏丹派人进京，要帝国交出费拉德尔菲亚。苏丹和听命于苏丹的贝伊已经到了城下；按臣属之约，皇帝还得出兵相随。"
 OE_BEY_PHIL_P: "如今，苏丹派人进京，要帝国交出费拉德尔菲亚。苏丹和听命于苏丹的贝伊已经到了城下，城中守军不多。"
 OE_BEY_KAR_B: "如今，卡拉曼的使者经海路来到京城，问帝国能不能一同牵制苏丹。京城还被苏丹的兵围着。"
 OE_BEY_KAR_P: "如今，卡拉曼的使者经海路来到京城，问帝国能不能一同牵制苏丹。"
 OE_BEY_GRACE_S: "如今，帖木儿俘获了苏丹，放还了听命于苏丹的贝伊：复国的有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#!家。帖木儿还攻破了拉丁人在士麦那的港堡。诸侯又成了奥斯曼身后的牵制。"
 OE_BEY_GRACE_P: "如今，帖木儿俘获了苏丹，放还了听命于苏丹的贝伊：复国的有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#!家。诸侯又成了奥斯曼身后的牵制。"
 OE_BEY_CHR_PHIL_1: "费拉德尔菲亚：帝国随军受降，把城交给了苏丹。"
 OE_BEY_CHR_PHIL_2: "费拉德尔菲亚：帝国让城中自守。"
 OE_BEY_CHR_PHIL_3: "费拉德尔菲亚：帝国出钱保住了城。"
 OE_BEY_CHR_PHIL_X: "费拉德尔菲亚：苏丹没有来要这座城。"
 OE_BEY_CHR_PHIL_W: "费拉德尔菲亚：还没有消息（1389年起）。"
 OE_BEY_CHR_GRACE_1: "帖木儿让#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#!家诸侯复国，帝国遣使与诸侯结好。"
 OE_BEY_CHR_GRACE_2: "帖木儿让#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#!家诸侯复国，帝国只与所押的王子同进退。"
 OE_BEY_CHR_GRACE_3: "帖木儿让#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#!家诸侯复国，帝国坐观其变。"
 OE_BEY_CHR_GRACE_D: "帖木儿让#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#!家诸侯复国。"
 OE_BEY_CHR_GRACE_X: "帖木儿没有让哪一家诸侯从苏丹手下复国。"
 OE_BEY_CHR_GRACE_W: "帖木儿：还没有消息。"
 OE_BEY_VARNA_2: "如今，卡拉曼的使者经海路来到京城，带着贝伊写给西方诸王的书信，请皇帝代为转交：西方的军队沿多瑙河南下，卡拉曼就在苏丹背后起兵。帝国已经答应出船把守海峡、让摩里亚北上；卡拉曼若同时起兵，苏丹就要三面受敌。"
 OE_BEY_VARNA_1: "如今，卡拉曼的使者经海路来到京城，带着贝伊写给西方诸王的书信，请皇帝代为转交：西方的军队沿多瑙河南下，卡拉曼就在苏丹背后起兵。帝国只答应了西方几艘船；卡拉曼的使者盼着帝国再出一分力。"
 OE_BEY_VARNA_0: "如今，卡拉曼的使者经海路来到京城，带着贝伊写给西方诸王的书信，请皇帝代为转交：西方的军队沿多瑙河南下，卡拉曼就在苏丹背后起兵。帝国守着与苏丹的和约；替卡拉曼传信，就是在和约背后另开一条路。"
 OE_BEY_VARNA_P: "如今，卡拉曼的使者经海路来到京城，带着贝伊写给西方诸王的书信，请皇帝代为转交：西方的军队沿多瑙河南下，卡拉曼就在苏丹背后起兵。帝国还没有向西方表态；替不替卡拉曼传这封信，本身就是一种表态。"
 OE_BEY_CHR_WILL_1: "盖尔米扬的贝伊把国家遗赠给苏丹，盖尔米扬并入了奥斯曼。"
 OE_BEY_CHR_WILL_X: "盖尔米扬没有按遗嘱归于苏丹。"
 OE_BEY_CHR_WILL_W: "盖尔米扬：还没有消息（1428年起）。"
 OE_BEY_CHR_PACT_2: "卡拉曼的密约：帝国居间牵线。"
 OE_BEY_CHR_PACT_1: "卡拉曼的密约：帝国只转了书信。"
 OE_BEY_CHR_PACT_3: "卡拉曼的密约：帝国没有插手。"
 OE_BEY_CHR_PACT_X: "卡拉曼的使者没有来。"
 OE_BEY_CHR_PACT_W: "卡拉曼：还没有消息（1442年起）。"
 game_concept_oe_tu_beylik: "突厥诸侯"
 game_concept_oe_tu_beylik_desc: "#F 罗姆苏丹国瓦解之后，安纳托利亚分成了许多突厥贝伊国。1390年前后，巴耶济德把西边的几家一一收服；1402年安卡拉之战后，帖木儿又让旧日的贝伊复国。#!\n\n突厥诸侯在这里指七家：艾登、萨鲁汗、盖尔米扬、卡拉曼、门泰谢、詹达尔（卡斯塔莫努）和卡雷西。奥斯曼每收服一家，帝国在东方就少一个可以借力的邻居。\n\n#bold 牵制#!（#Y 0#!到#Y 7#!）是一个读数：七家里仍然存在、不是奥斯曼的附庸、与奥斯曼或其附庸接壤、对帝国好感不低于#Y 0#!的有几家。它不存起来，也不改变任何数值；事件正文引用它，说明苏丹身后还有多少牵制。\n\n这条线不开战：诸侯被收服写成向苏丹称臣，复国写成解除臣属。诸侯或奥斯曼在玩家手中时，世界不替玩家做决定。"
