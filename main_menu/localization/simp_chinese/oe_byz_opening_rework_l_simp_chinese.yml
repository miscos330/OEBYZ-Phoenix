l_simp_chinese:
 oe_byz_opening.1.t: "安德洛尼卡三世时期"
 oe_byz_opening.1.d: "安德洛尼卡三世统治时期是拜占庭彻底滑向深渊前的最后余晖。在[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的统治下，帝国正规军得到一定重建，海军重新集结，希俄斯岛等海上领土也重归罗马。他在推翻自己祖父的统治后，着力于恢复帝国秩序，推行行政改革与经济措施。然而，领土的持续丢失、突厥人与塞尔维亚人的崛起、财政的枯竭与内战的阴影，始终如同#bold #color_yellow 达摩克里斯之剑#!#!，高悬于帝国头顶。\n\n东罗马曾是东西方贸易间最重要的桥梁国家。如今，[GetCountry('GEN').GetName]与[GetCountry('VEN').GetName]已后来居上，成为东地中海贸易的两大巨头；帝国却在一连串内战与失败后，沦落为只能收取些过路费的小角色，空看着黑海与黎凡特的巨额利润滚滚流过。自安德洛尼卡二世解散海军以来，我们与拉丁人在海面上的差距从未如此悬殊。新造的战舰尚不足以挽回旧日荣光，海峡上的让步仍是御座不得不承受的代价。\n\n皇帝与#bold #color_yellow 坎塔库泽诺斯#!#!亲密无间的友谊，为他赢得了皇位与军事贵族的支持；但要维持帝国的财源与运转，他又必须依靠君士坦丁波利斯的职业官僚、普世牧首区与各行各业的商业行会。宫廷因而隐约处于危险的对立中：一边是深受信任、由军事贵族拥戴的权臣，一边是皇帝的长子#bold #color_yellow 约翰五世#!#!，众望所归的正统继承人。不满权臣的机构与阶层，自会在幼主身旁寻找自己的位置。\n\n皇帝本人对此不屑一顾。他完全相信朋友不会谋害自己的继承人；更何况，他正值#R 壮年#!——又有什么可担忧的呢？"
 oe_byz_opening.1.a: "愿上帝保佑罗马"
 oe_pillars_adjust_imperial_style: "厘定国号与旗色"
 oe_pillars_adjust_imperial_style_desc: "金玺所署之名，旌旗所染之色，皆昭示罗马的尊严。召来书吏与纹章官，厘定帝国在诏书与舆图上的名号。\n\n依次选择#Y 国名#!与#Y 国家颜色#!。不消耗资源，可以重新调整。"
 oe_pillars_adjust_imperial_style_edict_summary: "#Y 国名与颜色设置#! · 无费用\n依次选择国号与舆图颜色，可重复调整"
 oe_pillars_country_name_desc: "书吏将空白的诏书呈于御前。无论世人如何称呼我们，罗马的传承仍在金玺与紫袍之间。我们应以何种名号昭告天下？"
 oe_pillars_country_color_desc: "国号既定，纹章官又展开帝国的舆图。让诸城与边疆披上御座选定的颜色，使罗马的疆域一目了然。"
 oe_byz_opening.2.t: "皇帝病重"
 oe_byz_opening.2.d: "紫色帷幕紧闭，寝宫中的灯火昼夜未熄。御医一次次退出内室，却再没有人敢许诺皇帝将会康复。曾在阵前纵马、在宴席上高谈阔论的安德洛尼卡，如今只能听见祈祷声穿过沉重的帷幔。\n\n黎明时分，皇帝的呼吸终于止息。宫廷仍在低声争论，军中的号令却已失去了最熟悉的声音。君士坦丁堡的钟声传遍海峡，悲恸与不安一同涌入帝国的街巷：御座又一次空了，罗马将由谁领向明日？"
 oe_byz_opening.2.a: "愿主接纳他的灵魂。"
 OE_ANDRONIKOS_ILLNESS_EFFECT_TT: "安德洛尼卡三世因病去世；东罗马损失#R 10正统性#!。"
