 oe_osmaris_belisarius_name: "贝利萨留斯"
 oe_osmaris_fatih_name: "法蒂赫"
 oe_osmaris_fatih_trait: "法蒂赫"
 oe_osmaris_fatih_trait_desc: "征服者。瓦尔纳风雨中的幻景令他相信，自己的归宿不在账房，而在军旗之下。其统率的军队获得训练度、士气与围城能力加成；总是能够指挥单位；寿命与军事能力的常驻加成由“法蒂赫的天命”提供。"
 STATIC_MODIFIER_NAME_oe_osmaris_fatih_personal: "法蒂赫的天命"
 STATIC_MODIFIER_DESC_oe_osmaris_fatih_personal: "预期寿命增加45年，军事能力增加30点，并总是能够指挥单位。即使尚未成年或没有担任将领，这些人物加成也持续生效。"
 oe_flavor_byz.1014.t: "瓦尔纳的回响"
 oe_flavor_byz.1014.d: "（穆罕默德二世）\n\n1444年11月11日，少年贝利萨留斯随家族商队骑马经过瓦尔纳。入夜后，海风骤紧，暴雨倾泻，远处的原野忽然亮起了不属于这个夜晚的火光。雷鸣中传来号角与马蹄声，一场仿佛从古老年代归来的大战，在他的眼前展开。\n\n他勉强辨出一面绣着白鹰的波兰王旗，另一边则是奥斯马里斯熟悉的红底金色星月。枪矛在雨幕中相撞，倒下的人马转瞬又隐入浓雾。他抬眼望向中军：那里端坐着一个披金带银、身着华美铠甲的统帅。那张面孔更加成熟，却分明就是他自己。\n\n又一道闪电落下，旌旗、军阵与统帅一同消失，只剩下商队惊惶的呼喊。贝利萨留斯此后再也没有心思翻阅货单。他把那一夜视为命运的启示，决意循着先祖曼努埃尔的足迹投身军旅。\n\n“我看见过自己的旗帜。它应当飘扬在军阵之上。”"
 oe_flavor_byz.1014.a: "命中注定的征服者"
 oe_flavor_byz.1014.a.tt: "贝利萨留斯获得“法蒂赫”特质与永久人物修正：\n预期寿命 #G +45年#!，军事能力 #G +30#!。\n总是能够指挥单位。\n担任将领时，所率军队训练度 #G +10%#!、士气 #G +20%#!、围城能力 #G +50%#!。\n奥斯马里斯已为豪族时，影响力 #G +50#!；否则成为豪族，豪族上限 #G +1#!。"
 oe_flavor_byz.1014.lapsed: "风雨中的回响，已无从追寻。"
 oe_flavor_byz.1014.lapsed.tt: "人物或家族状态已经改变，本次不授予特质或奖励。"
 oe_flavor_byz.1014.historical_info: "历史上的穆罕默德二世（1432—1481）是穆拉德二世之子，两度担任奥斯曼苏丹，因1453年攻取君士坦丁堡而以“法蒂赫”，即“征服者”闻名。本事件中的贝利萨留斯、瓦尔纳幻景及其效忠东罗马的生涯均属架空设定。"
