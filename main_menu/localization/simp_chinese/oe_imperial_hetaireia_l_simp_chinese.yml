 oe_imperial_hetaireia_estate: "帝国赫泰里亚"
 oe_imperial_hetaireia_estate_desc: "无论来自何方，他们都在圣像前宣誓，向同一面帝国军旗效忠。赫泰里亚将东罗马直属领土内信奉东正教的职业军人纳入共同军籍；军饷、服役与信仰，使不同乡音的将士成为彼此的同袍。\n\n人口来源：东罗马直属领土内任意文化的东正教士兵。基础满意度均衡#Y 30%#!，基础征税上限#Y 30%#!；每人口政治力量#Y 5#!，税基系数#Y 0.5#!。其他全国或阶层修正仍会影响最终数值。\n满意度以50%为军事加成中点，每高于或低于中点25个百分点，训练度相应变化1%，陆军士气相应变化2.5%。\n阶层力量超过25%后，每增加10个百分点，每月陆军传统增加0.02，王室力量降低2%。"
 oe_imperial_hetaireia_service: "赫泰里亚军籍"
 STATIC_MODIFIER_NAME_oe_imperial_hetaireia_service: "赫泰里亚军籍"
 STATIC_MODIFIER_DESC_oe_imperial_hetaireia_service: "以共同的信仰与服役誓言联结帝国境内各族军人。"
