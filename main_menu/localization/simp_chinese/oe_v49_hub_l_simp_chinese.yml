l_simp_chinese:
 # Generated by gen_v490_game_rules_hub.py; edit the generator, not this file.
 rule_oe_rule_v49_alt_history_scale: "凤凰计划：架空历史尺度"
 setting_oe_rule_v49_alt_balanced: "平衡推荐"
 setting_oe_rule_v49_alt_balanced_desc: "玩家可自由探索各类架空奇迹路线，而 AI 势力默认保持贴近史实的发展脉络。"
 setting_oe_rule_v49_alt_strict_historical: "严格史实"
 setting_oe_rule_v49_alt_strict_historical_desc: "仅启用史实演进主线，关闭架空奇迹触发分支，使各剧本局势尽量贴合真实历史轨迹。"
 setting_oe_rule_v49_alt_romantic_unleashed: "浪漫架空（解放 AI）"
 setting_oe_rule_v49_alt_romantic_unleashed_desc: "全面解放 AI 势力的架空探索倾向，使其可主动触发郑和远航、查理曼与伊琳娜联姻、瓦尔纳胜局及乾隆蒸汽变革等宏大架空线。"

 rule_oe_rule_v49_easter_eggs: "凤凰计划：趣味彩蛋开关"
 setting_oe_rule_v49_ee_player_choice: "玩家自选（推荐）"
 setting_oe_rule_v49_ee_player_choice_desc: "默认开启赫斯珀里亚奥运盛会，圣赫勒拿归来与柏拉图城邦等特殊彩蛋链保留为玩家自主触发。"
 setting_oe_rule_v49_ee_all_on: "全部彩蛋开启"
 setting_oe_rule_v49_ee_all_on_desc: "同步启用全部凤凰计划彩蛋链：包括赫斯珀里亚奥运盛会、圣赫勒拿归来与柏拉图城邦。"
 setting_oe_rule_v49_ee_off: "纯史实（全部关闭）"
 setting_oe_rule_v49_ee_off_desc: "关闭全部彩蛋事件链与趣味盛会，提供纯粹严肃的历史向战役体验。"

 rule_oe_rule_v49_endgame_boss: "凤凰计划：后期终局危机与强敌"
 setting_oe_rule_v49_boss_off: "标准平衡（关闭）"
 setting_oe_rule_v49_boss_off_desc: "关闭自动触发的后期终局远征舰队危机，仅在玩家通过决议手动开启时登场。"
 setting_oe_rule_v49_boss_armada: "第四罗马终局危机（1620+）"
 setting_oe_rule_v49_boss_armada_desc: "启用 1620 年后触发的旧大陆远征舰队终局危机，为中后期提供高强度的跨洋决战体验。"
 setting_oe_rule_v49_boss_global_coalition: "全球终局联军挑战"
 setting_oe_rule_v49_boss_global_coalition_desc: "启用终局危机框架并强化后期列强联合制衡，对超大规模霸权帝国形成高烈度全球挑战。"

 rule_oe_rule_v49_wonders_and_masters: "凤凰计划：世界奇观工程与历史伟人"
 setting_oe_rule_v49_wm_standard: "开启（推荐）"
 setting_oe_rule_v49_wm_standard_desc: "全面启用 26 座三阶世界奇观工程、雇佣兵与私掠体系及跨时代动态历史伟人机制。"
 setting_oe_rule_v49_wm_off: "关闭（静默）"
 setting_oe_rule_v49_wm_off_desc: "静默关闭世界奇观工程、雇佣兵私掠及动态伟人扩展局势，精简战役运行内容。"

 rule_oe_rule_v49_ruler_portraits: "凤凰计划：朝代君主肖像服饰"
 setting_oe_rule_v49_portraits_dynastic: "历代衣冠大修（推荐）"
 setting_oe_rule_v49_portraits_dynastic_desc: "为全部 12 个时代的唐、宋、明、清、日本及近代早期列强启用考据定制君主服饰与冠冕权重。"
 setting_oe_rule_v49_portraits_vanilla: "原版权重"
 setting_oe_rule_v49_portraits_vanilla_desc: "关闭自定义历代服饰权重覆写，将君主肖像衣冠恢复为游戏原版选择规则。"

 oe_v49_hub_human_only_tt: "仅限玩家控制国家"
 oe_v49_hub_open_console.title: "凤凰计划：战役规则中枢"
 oe_v49_hub_open_console.desc: "随时打开「凤凰计划：战役规则中枢」，无需重开存档即可实时调整架空历史 AI 自由度、趣味彩蛋、终局强敌危机、世界奇观伟人以及历代君主服饰权重。"
 oe_v49_hub_open_console.a: "打开战役规则中枢"
 oe_v49_hub_confirm_tt: "保持当前大厅与局内规则设置并立即开始游戏。您随时可在决议面板重新打开本规则中枢。"
 oe_v49_hub_romantic_all_tt: "将#Y 架空历史尺度#!切换为#G 浪漫架空（解放 AI）#!，并同步开启#G 全部彩蛋#!（赫斯珀里亚奥运、圣赫勒拿归来与柏拉图城邦）。"
 oe_v49_hub_enable_boss_tt: "开启#Y 后期终局强敌危机（1620+）#!，激活跨洋旧大陆远征舰队与后期高强度联军挑战。"
 oe_v49_hub_alt_balanced_tt: "将架空历史尺度设为#Y 平衡推荐#!：玩家可自由探索架空奇迹，AI 势力保持贴近史实演进。"
 oe_v49_hub_alt_strict_tt: "将架空历史尺度设为#Y 严格史实#!：限制动态架空奇迹分支，令各时代按史实主线推进。"
 oe_v49_hub_alt_romantic_tt: "将架空历史尺度设为#G 浪漫架空（解放 AI）#!：AI 列强亦可主动触发郑和、查理曼联姻、瓦尔纳胜局与乾隆蒸汽变革等奇迹线。"
 oe_v49_hub_ee_choice_tt: "将趣味彩蛋设为#Y 玩家自选#!：开启赫斯珀里亚奥运，圣赫勒拿归来与柏拉图城邦保留为自主触发。"
 oe_v49_hub_ee_all_tt: "将趣味彩蛋设为#G 全部开启#!：赫斯珀里亚奥运、圣赫勒拿归来与柏拉图城邦同步生效。"
 oe_v49_hub_ee_off_tt: "将趣味彩蛋设为#R 纯史实（全部关闭）#!：关闭所有彩蛋事件与趣味盛会。"
 oe_v49_hub_toggle_boss_tt: "切换本局#Y 后期终局强敌危机（1620+）#!的开启或关闭状态。"
 oe_v49_hub_toggle_wonders_tt: "切换#Y 世界奇观工程、雇佣兵私掠与动态历史伟人#!局势的开启或静默状态。"
 oe_v49_hub_toggle_portraits_tt: "在#Y 历代衣冠大修#!与#Y 原版权重#!之间切换君主肖像服饰模式。"
 oe_v49_hub_reset_lobby_tt: "将全部局内实时开关重新同步还原为开局大厅中选择的五项游戏规则。"
 oe_v49_hub.1.t: "凤凰计划：战役规则中枢"
 oe_v49_hub.1.d: "欢迎进入#T 凤凰计划#!。您在大厅选择的五项核心游戏规则已自动同步至全部时代与扩展模块：\n\n#Y 1. 架空历史尺度#! — 平衡推荐（默认）、严格史实、或浪漫架空（解放 AI）。\n#Y 2. 趣味彩蛋开关#! — 玩家自选（默认）、全部彩蛋开启、或纯史实关闭。\n#Y 3. 后期终局危机#! — 标准平衡关闭（默认）、第四罗马远征舰队（1620+）、或全球终局联军。\n#Y 4. 世界奇观与伟人#! — 26 座三阶奇观、雇佣兵与动态伟人开启（默认）或静默关闭。\n#Y 5. 历代君主肖像#! — 12 时代历代衣冠大修（默认）或原版权重。\n\n您可以直接确认开局、选用下方快捷预设，或进入详细开关面板微调；局内随时可通过决议「#Y 凤凰计划：战役规则中枢#!」再次调整。"
 oe_v49_hub.1.a: "确认当前规则并开始战役"
 oe_v49_hub.1.b: "一键开启：浪漫架空（解放 AI）+ 全部彩蛋"
 oe_v49_hub.1.c: "一键开启：后期终局强敌危机（1620+）"
 oe_v49_hub.1.e: "打开详细沙盒规则开关"
 oe_v49_hub.2.t: "规则中枢：架空历史尺度设置"
 oe_v49_hub.2.d: "#T 架空历史尺度配置#!\n选择欧亚大陆与大洋各剧本中架空奇迹路线的触发自由度：\n\n- #Y 平衡推荐#!：玩家可自由推进各类架空奇迹，AI 列强保持贴近史实的抉择。\n- #Y 严格史实#!：仅走史实演进脉络，不触发架空分支。\n- #G 浪漫架空（解放 AI）#!：允许 AI 列强主动探索郑和远洋、查理曼与伊琳娜联姻、瓦尔纳大捷与乾隆蒸汽变革等宏大路线。"
 oe_v49_hub.2.a: "设为：平衡推荐（玩家自由 / AI 史实）"
 oe_v49_hub.2.b: "设为：严格史实（仅史实主线）"
 oe_v49_hub.2.c: "设为：浪漫架空（全面解放 AI 奇迹）"
 oe_v49_hub.2.e: "下一页：趣味彩蛋开关"
 oe_v49_hub.2.f: "跳转至：终局危机、奇观与肖像"
 oe_v49_hub.2.z: "返回规则中枢主页"
 oe_v49_hub.3.t: "规则中枢：历史彩蛋设置"
 oe_v49_hub.3.d: "#T 历史趣味彩蛋配置#!\n管理凤凰计划中的纪念性与传奇彩蛋事件链：\n\n- #Y 玩家自选#!：默认开启赫斯珀里亚奥运盛会，圣赫勒拿归来与柏拉图城邦由玩家自主决定是否触发。\n- #G 全部开启#!：同时激活赫斯珀里亚奥运、圣赫勒拿归来与柏拉图城邦。\n- #R 纯史实（全部关闭）#!：关闭全部彩蛋链，保持纯粹严肃的历史氛围。"
 oe_v49_hub.3.a: "设为：玩家自选（奥运开启 / 其余自选）"
 oe_v49_hub.3.b: "设为：全部彩蛋开启"
 oe_v49_hub.3.c: "设为：纯史实（关闭全部彩蛋）"
 oe_v49_hub.3.e: "下一页：终局危机、奇观与肖像"
 oe_v49_hub.3.z: "返回规则中枢主页"
 oe_v49_hub.4.t: "规则中枢：终局危机、奇观与肖像"
 oe_v49_hub.4.d: "#T 沙盒扩展与视觉开关#!\n随时微调后期终局挑战、全球沙盒扩展机制与君主服饰权重：\n\n- #Y 后期终局危机（1620+）#!：开启或关闭旧大陆远征舰队与后期高强度制衡。\n- #Y 世界奇观工程与伟人#!：开启或静默 26 座三阶奇观、雇佣兵私掠及动态历史伟人局势。\n- #Y 历代君主肖像#!：在 12 时代考据衣冠大修与游戏原版服饰权重之间自由切换。"
 oe_v49_hub.4.a: "切换：后期终局强敌危机（关 / 开 1620+）"
 oe_v49_hub.4.b: "切换：世界奇观工程与伟人（开启 / 静默）"
 oe_v49_hub.4.c: "切换：君主肖像服饰（历代大修 / 原版权重）"
 oe_v49_hub.4.e: "重置全部开关为开局大厅规则"
 oe_v49_hub.4.z: "保存设置并关闭中枢"
