l_simp_chinese:
 oe_peasants_irrigation_commons: "水渠共役"
 oe_peasants_irrigation_commons_desc: "田间的渠水流经一家，也滋养着整座村庄。承认乡民共同修缮水渠、水磨与堤岸的权利，准许村社安排工役、分配用水，使#Y 共同的劳作#!惠及共同的田园。"
 oe_peasants_reclamation_grants: "荒田招垦"
 oe_peasants_reclamation_grants_desc: "荒草不应永远占据犁铧走过的土地。给予愿意复垦的农户种粮、农具与安置保障，使离散者得以归乡，新来者得以立足。#Y 让荒田重新结穗#!，帝国的村庄方能重获生机。"
 oe_peasants_imperial_petition: "御前申诉权"
 oe_peasants_imperial_petition_desc: "宫门之外的百姓，亦是皇帝应当庇护的罗马人。准许村社联名申诉，将侵占、苛索与不公呈于御前。只要#Y 帝国仍愿倾听#!，受苦之人便不必只向刀剑寻求公道。"
 oe_burghers_golden_horn_charter: "金角湾海商敕许"
 oe_burghers_golden_horn_charter_desc: "金角湾的桅杆不应尽悬异邦的旗帜。向罗马海商颁授敕许，保障其组织船队、开设商馆与接洽远方货主的资格，使#Y 帝国自己的商人#!也能分享这座海港的繁荣。"
 oe_burghers_eastern_entrepot: "东方货物转口权"
 oe_burghers_eastern_entrepot_desc: "香料、染料与贵重织物沿着漫长商路汇入帝国的仓栈，又由此驶向远方。承认经营这些货物的商人所享有的#Y 转运与再出口之权#!，让罗马成为诸方货流的中介。\n\n市民满意度均衡值+5%，市民影响力+50%，出口效率+5%，贸易范围+50%，每月倾向于财阀政治+0.1。"
 oe_burghers_caravan_hostels: "商旅驿舍经营权"
 oe_burghers_caravan_hostels_desc: "商旅不能仅凭一纸敕令越过山岭。准许商团沿道路经营客舍与仓栈，储备饲料、接济车马，使货队在城镇之间拥有#Y 可以托付的落脚之处#!。"
 oe_burghers_straits_convoys: "海峡护航契约"
 oe_burghers_straits_convoys_desc: "通向帝国港口的水道，需要船帆与桨声共同守护。认可船主筹资组织护航的契约，使商船相约结伴、互通航情。#Y 安全的航路#!既是商人的生计，也是皇城的命脉。"
 oe_burghers_shipyard_contracts: "船坞承造权"
 oe_burghers_shipyard_contracts_desc: "船坞中的斧凿声，预示着海上的帆影。准许船主与造船行会承接帝国订单，自行召集工匠、备办木料，使#Y 熟练的手艺#!不因繁琐的调度而荒废。"
 oe_clergy_athos_autonomy: "圣山自治"
 oe_clergy_athos_autonomy_desc: "尘世的喧嚣止于圣山的门前。承认阿索斯修院共同体管理内部事务的权利，庇护其祈祷、斋戒与共同生活，使#Y 为帝国代祷的灯火#!不因世俗纷争而熄灭。"
 oe_clergy_parish_relief: "堂区济贫权"
 oe_clergy_parish_relief_desc: "圣堂的门不应只在礼拜时向贫者敞开。准许堂区汇集施舍、分发热食、收容无依者，使教会以#Y 可触及的仁慈#!回应人间的苦难，也使百姓在困顿时仍有所依靠。"
 oe_clergy_episcopal_visitations: "主教巡牧权"
 oe_clergy_episcopal_visitations_desc: "牧杖所及，不应只有城中富丽的圣堂。支持主教巡视偏远教区，修复礼拜之所、安排教士并教导信众，使#Y 正信的言语#!也能传入山间村落与边地聚居之处。"
 oe_clergy_public_liturgy: "讲道与礼仪"
 oe_clergy_public_liturgy_desc: "钟声召集众人，讲道劝勉人心，节期的行列使陌路者并肩而行。将公共讲道与重要礼仪交由教会主持，以#Y 共同的祈祷#!维系帝国臣民之间的信任与秩序。"
 oe_clergy_episcopal_council: "主教公议权"
 oe_clergy_episcopal_council_desc: "各教区的疾苦与纷争，不应散失在彼此隔绝的书信之中。准许主教定期集议，将地方见闻与教会意见呈于御前，使#Y 众牧者的商议#!成为皇帝处理事务的助益。"
 oe_clergy_patriarchal_envoys: "牧首使节"
 oe_clergy_patriarchal_envoys_desc: "有些门户不向兵戈开启，却愿接纳手持牧首书信的来客。认可牧首遣使调停与交涉的地位，以共同的信仰、礼仪与学识沟通诸国，让#Y 和睦之言#!先于战鼓抵达。"
 oe_peasants_village_watch: "乡社守备"
 oe_peasants_village_watch_desc: "警钟响起时，守护田园的不应只有远方赶来的军队。准许乡民组织轮值守望、储备武器，在村社的旗帜下携械集合，使#Y 保卫家园的责任#!成为自由臣民共同承担的义务。\n\n与#Y 地主崛起#!路线的四档特权互斥。"
