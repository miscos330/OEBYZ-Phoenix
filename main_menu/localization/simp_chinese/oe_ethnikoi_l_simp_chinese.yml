l_simp_chinese:
 oe_ir_expand_hetaireia: "扩招赫泰里亚"
 oe_ir_expand_hetaireia_done: "已完成扩招赫泰里亚"
 oe_ir_expand_hetaireia_desc: "重订军籍、扩建营舍，为更多士兵留出常备军中的位置。帝国将扩充赫泰里亚军营，使其足以容纳新的队列。\n\n消耗#Y 50权威#!；每处赫泰里亚军营的建造上限#G +1级#!，由1级提高至2级。仅能完成一次。"
 OE_IR_EXPAND_HETAIREIA_EFFECT: "赫泰里亚军营的建造上限永久#G +1级#!，由#Y 1级#!提高至#Y 2级#!。每个已建成等级分别提供赫泰里亚与埃特尼科伊各#G 1个#!独立编制名额。"
 OE_ETHNIKOI_CAP_TT: "埃特尼科伊各时代部队合计数量低于直属领土已建成的赫泰里亚军营总级数；不占用赫泰里亚重步兵名额。"
 oe_ethnikoi_1: "埃特尼科伊"
 oe_ethnikoi_1_desc: "编入帝国军籍的轻步兵，以灵活的队列补充重装军阵。他们先行侦察，在主力展开前争夺要地，又能在战线动摇时迅速补上缺口。\n\n主动性#G +3#!、所受兵力伤害#G −10%#!、战斗速度#G +0.1#!。每级已建成的赫泰里亚军营提供#G 1个#!名额，埃特尼科伊各时代共用此名额，与赫泰里亚重步兵独立。\n\n#Y 时代升级路径：#!研发原版军事革新#Y 《职业军队》#!后自动解锁下一代（完整链：职业军队 → 枪刺与射击 → 炮兵应用 → 军事革命 → 全民动员），完成后可直接在部队界面点击升级。"
