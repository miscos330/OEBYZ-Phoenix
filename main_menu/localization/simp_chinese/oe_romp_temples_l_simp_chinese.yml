 # NEW 2026-11-21 v9.8 Religio Romana: 2 Core Holy Sites, 9 Rebuildable Grand Temples, O(1) Pax Deorum Auto-Modifiers & Ages 5-6 Advances (oe_romp_, 0 slots). Generated by gen_romp_temples.py; edit the generator, not this file.
 oe_romp_porphyry_column_site: "君士坦丁堡斑岩太阳神柱"
 oe_romp_porphyry_column_site_desc: "矗立于君士坦丁广场中央的帝国斑岩巨柱，原冠以手持日轮的阿波罗—无敌太阳神青铜像，是新罗马承接古典太阳神学与帝国天命的核心圣坛。"
 oe_romp_mystras_academy_site: "米斯特拉斯新柏拉图圣院"
 oe_romp_mystras_academy_site_desc: "依傍泰格特斯山脉俯瞰斯巴达古原的哲人圣院，格奥尔基·格米斯托斯·卜列东曾于此讲授柏拉图《律法》与奥林匹斯神学，点燃罗马多神教复兴的火种。"
 oe_romp_temple_capitolium: "卡皮托利乌姆朱庇特大神庙"
 oe_romp_temple_capitolium_desc: "巍然重立于罗马卡皮托利乌姆山巅的卡皮托利乌姆三主神首席圣殿，镀金青铜瓦顶映照台伯河谷，象征罗马元老院、凯旋仪式与帝国公法的最高权威。"
 oe_romp_temple_capitolium_maint: "卡皮托利乌姆朱庇特大神庙（祭祀与修缮）"
 oe_romp_temple_parthenon: "帕特农雅典娜圣殿"
 oe_romp_temple_parthenon_desc: "以彭特利孔白大理石重修的雅典卫城多立克柱廊大神殿，重迎智慧与护城女神雅典娜—密涅瓦之荣光，汇聚地中海世界的哲学家、雕像师与古典典籍。"
 oe_romp_temple_parthenon_maint: "帕特农雅典娜圣殿（祭祀与修缮）"
 oe_romp_temple_delphi: "德尔斐阿波罗神谕圣殿"
 oe_romp_temple_delphi_desc: "坐落于帕尔纳索斯山麓的卡斯塔利亚圣泉与阿波罗神谕圣坛，三足鼎烟缕再起，「认识你自己」的箴言与神谕评议令四方邦国敬服而息争。"
 oe_romp_temple_delphi_maint: "德尔斐阿波罗神谕圣殿（祭祀与修缮）"
 oe_romp_temple_olympia: "奥林匹亚宙斯圣殿"
 oe_romp_temple_olympia_desc: "重修于伯罗奔尼撒阿尔菲俄斯河谷的阿尔提斯圣林中心，恢宏的黄金象牙神座与四年一度神圣休战盛会令八方朝圣者与竞技健儿云集于此。"
 oe_romp_temple_olympia_maint: "奥林匹亚宙斯圣殿（祭祀与修缮）"
 oe_romp_temple_serapeum: "亚历山大港塞拉皮斯大神庙"
 oe_romp_temple_serapeum_desc: "重建于亚历山大港拉科蒂斯高地的阶梯式柱廊神庙与附属藏书阁，融汇希罗哲学、埃及合祀神学与法罗斯海贸网络，是地中海东南岸的学术与商旅灯塔。"
 oe_romp_temple_serapeum_maint: "亚历山大港塞拉皮斯大神庙（祭祀与修缮）"
 oe_romp_temple_artemision: "以弗所阿尔忒弥斯大神庙"
 oe_romp_temple_artemision_desc: "百余根爱奥尼亚大理石巨柱在爱奥尼亚海湾重现古代世界七大奇迹的壮丽轮廓，兼具神圣庇护所、药草疗养园与爱琴海东岸繁荣商港的威望。"
 oe_romp_temple_artemision_maint: "以弗所阿尔忒弥斯大神庙（祭祀与修缮）"
 oe_romp_temple_porphyry_sol: "君士坦丁堡斑岩太阳神柱圣坛"
 oe_romp_temple_porphyry_sol_desc: "环绕君士坦丁大帝斑岩巨柱营建的圆形大理石日晷圣坛与大祭司团仪典大厅，朝拜无敌太阳神辉，将新罗马皇权、历法与古典礼制熔铸一体。"
 oe_romp_temple_porphyry_sol_maint: "君士坦丁堡斑岩太阳神柱圣坛（祭祀与修缮）"
 oe_romp_temple_delos: "提洛圣岛双子圣域"
 oe_romp_temple_delos_desc: "重修于基克拉泽斯群岛核心的阿波罗与阿尔忒弥斯双子神圣域，石狮大道与洁净圣湖重新成为爱琴海诸岛的朝圣与和平盟会中心。"
 oe_romp_temple_delos_maint: "提洛圣岛双子圣域（祭祀与修缮）"
 oe_romp_temple_mystras_academy: "米斯特拉斯新柏拉图圣院"
 oe_romp_temple_mystras_academy_desc: "扩建自卜列东拉科尼亚讲学旧址的柱廊圣院与藏书堂，将新柏拉图太一论、斯多葛伦理学与罗马大祭司团典章系统传授给帝国新一代学者与祭司。"
 oe_romp_temple_mystras_academy_maint: "米斯特拉斯新柏拉图圣院（祭祀与修缮）"
 AUTO_MODIFIER_NAME_oe_romp_pax_deorum_tier1: "众神和平·初兴（3–4座大神殿）"
 AUTO_MODIFIER_DESC_oe_romp_pax_deorum_tier1: "帝国直辖并重修了三至四座古典大神殿，祭火重新连成神圣脉络，增强罗马多神教的宗教影响力、预兆神力与声望。"
 AUTO_MODIFIER_NAME_oe_romp_pax_deorum_tier2: "众神和平·鼎盛（5–6座大神殿）"
 AUTO_MODIFIER_DESC_oe_romp_pax_deorum_tier2: "帝国直辖并重修了五至六座古典大神殿，地中海诸圣域遥相呼应，显著延长并强化神谕护佑，巩固皇权正统性与古教威望。"
 AUTO_MODIFIER_NAME_oe_romp_pax_deorum_tier3: "众神和平重光（7座及以上大神殿）"
 AUTO_MODIFIER_DESC_oe_romp_pax_deorum_tier3: "七座以上古典大神殿在帝国治下巍然重光，卡皮托利乌姆至君士坦丁堡的祭坛昼夜不熄；众神和平降临人世，令帝国额外获赐神谕选项、四境繁荣与兼容四海的宗教气度。"
 AUTO_MODIFIER_NAME_oe_romp_capitoline_triad_synergy: "卡皮托利乌姆三主神共鸣"
 AUTO_MODIFIER_DESC_oe_romp_capitoline_triad_synergy: "朱庇特、朱诺与密涅瓦三主神同席于帝国万神殿，且卡皮托利乌姆大神庙在永恒之城巍然矗立，赋予罗马皇室至高正统、王权凝聚力与军团铁律。"
 AUTO_MODIFIER_NAME_oe_romp_sol_invictus_synergy: "无敌太阳帝都辉光"
 AUTO_MODIFIER_DESC_oe_romp_sol_invictus_synergy: "无敌太阳神入祀万神殿并与君士坦丁堡斑岩太阳神柱圣坛交相辉映，太阳普照之理化为严明疆域控制、科学探索与旺盛宗教影响力。"
 AUTO_MODIFIER_NAME_oe_romp_asclepius_sanctuary_synergy: "埃皮达鲁斯医神疫盾"
 AUTO_MODIFIER_DESC_oe_romp_asclepius_sanctuary_synergy: "医神阿斯克勒庇俄斯—许癸厄亚入祀帝国万神殿，且埃皮达鲁斯或帕加马古圣泉置于帝国庇护之下，圣蛇疗养院体系大幅强化全境抗疫与延年之效。"
 oe_romp_adv_heliocentric_theology: "日心太阳神学"
 oe_romp_adv_heliocentric_theology_desc: "帝国天文学家将近代日心宇宙观与尤利安《太阳王颂》的无敌太阳形而上学融会贯通，使精密星算与神谕哲思彼此印证、共促科学昌明。"
 oe_romp_adv_pax_deorum_jurisprudence: "众神和平公法体系"
 oe_romp_adv_pax_deorum_jurisprudence_desc: "将叙马库斯宽容诏书、罗马市政卫生法与万民法典编纂为统一帝国公法，保障多信仰臣民的礼拜自由，同时健全全境行省治理与公共防疫。"
 oe_romp_adv_neoclassical_enlightenment: "新古典启蒙学园"
 oe_romp_adv_neoclassical_enlightenment_desc: "在君士坦丁堡、罗马、雅典与亚历山大港广建公费新古典启蒙学园与百科图书馆，令斯多葛自然法、实证科学与古典人文在全帝国蔚然成风。"
 oe_romp_adv_secular_civic_imperium: "世俗公民帝国宪章"
 oe_romp_adv_secular_civic_imperium_desc: "将古老的公民宗教转化为近代宪政帝国的精神纽带：国家保障理性医疗、良心自由与元老公议，大祭司团以庄严礼仪凝聚万邦民心而不干政。"
