 oe_tb2.1.t: "按建议设置军区"
 oe_tb2.1.d: "以下军区将按建议改动：[ROOT.GetCountry.Custom('OeTb2Slot1')][ROOT.GetCountry.Custom('OeTb2Slot2')][ROOT.GetCountry.Custom('OeTb2Slot3')][ROOT.GetCountry.Custom('OeTb2Slot4')][ROOT.GetCountry.Custom('OeTb2Slot5')][ROOT.GetCountry.Custom('OeTb2Slot6')][ROOT.GetCountry.Custom('OeTb2Slot7')][ROOT.GetCountry.Custom('OeTb2Slot8')][ROOT.GetCountry.Custom('OeTb2Slot9')][ROOT.GetCountry.Custom('OeTb2Slot10')][ROOT.GetCountry.Custom('OeTb2Slot11')][ROOT.GetCountry.Custom('OeTb2Slot12')][ROOT.GetCountry.Custom('OeTb2More')]\n\n改方针#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_c').GetValue|0]#!个，花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_cost_c')|0]#![oe_tu_authority|e]（现有[GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_auth_now')|0]）；改行授地#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_p').GetValue|0]#!个，不花权威。\n\n建议用的就是AI帝国自己的规则：将军至少“平稳”、方针不在#Y 5#!年冷却中的军区，[oe_tu_march|e]改陆军，临海的内地改海军（海军军区不超过全部军区的三分之一），内陆的内地改民政；法律允许[oe_tu_pronoia|e]时，财政不由中央委派的陆军边镇和[oe_tu_exarchate|e]改行授地。每改一个方针花费#R 5#!帝国权威，权威不够时后面的不改；名单里只列了付得起的。"
 oe_tb2.1.a: "照建议办"
 oe_tb2.1.a.tt: "名单上的军区改方针（每个花费#R 5#![oe_tu_authority|e]，#Y 5#!年内不能再改）或改行授地（#Y 2#!年内不能再调属官）。改动在下一刻逐个完成。"
 oe_tb2.1.b: "先不改"
 oe_tb2.2.t: "边镇一齐"
 oe_tb2.2.d: "可修缮城堡的[oe_tu_march|e]#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_n')|0]#!个，每个#R 100#!金，全部修缮共需[ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_cost')|0]金；\n可征募边军的边镇#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_n')|0]#!个，每个#R 50#!金，全部征募共需[ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_cost')|0]金。\n国库现有[ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_gold')|0]金。\n\n每个边镇的效果、花费和冷却与“军事令”里单独下令时完全一样。钱不够时按边患从高到低一个个办，办到钱用完为止。"
 oe_tb2.2.fortify: "所有边镇一起修缮城堡"
 oe_tb2.2.fortify.tt: "每个可修缮的[oe_tu_march|e]照“修缮城堡”办一次，每个#R 100#!金，从边患最高的开始，钱用完为止。"
 oe_tb2.2.levy: "所有边镇一起征募边军"
 oe_tb2.2.levy.tt: "每个可征募的[oe_tu_march|e]照“征募边军”办一次，每个#R 50#!金，从边患最高的开始，钱用完为止。"
 oe_tb2.2.c: "都不办"
 oe_tb2.9.t: "军区批量命令：执行"
 OE_TB2_BTN_ADVISE: "按建议设置"
 OE_TB2_BTN_ADVISE_DESC: "先列出要改的军区，确认后再改。建议用的就是AI帝国自己的规则：将军至少“平稳”、方针不在#Y 5#!年冷却中的军区，[oe_tu_march|e]改陆军，临海的内地改海军（海军军区不超过全部军区的三分之一），内陆的内地改民政；法律允许[oe_tu_pronoia|e]时，财政不由中央委派的陆军边镇和[oe_tu_exarchate|e]改行授地。每改一个方针花费#R 5#![oe_tu_authority|e]，授地不花权威。按钮不可点时：没有要改的军区，或帝国权威不足#Y 5#!且没有可授地的军区，或上一轮还没办完。"
 OE_TB2_BTN_MARCHES: "边镇一齐"
 OE_TB2_BTN_MARCHES_DESC: "一次给所有[oe_tu_march|e]修缮城堡（每个#R 100#!金）或征募边军（每个#R 50#!金），先列出个数和总价再选。按钮不可点时：没有可修缮也没有可征募的边镇。"
 oe_tb2_mg_btn_on: "#G 已托管#!"
 oe_tb2_mg_btn_off: "托管"
 oe_tb2_mg_st_wait: "\n\n#G 已托管。#!每年1月办理，今年还没有办过。"
 oe_tb2_mg_st_on: "\n\n#G 已托管。#![Country.MakeScope.GetVariable('oe_tb2_t_y').GetValue|0]年1月办了：改方针#Y [Country.MakeScope.GetVariable('oe_tb2_t_c').GetValue|0]#!、授地#Y [Country.MakeScope.GetVariable('oe_tb2_t_p').GetValue|0]#!、修缮城堡#Y [Country.MakeScope.GetVariable('oe_tb2_t_f').GetValue|0]#!、征募边军#Y [Country.MakeScope.GetVariable('oe_tb2_t_l').GetValue|0]#!；今年开工程#Y [Country.MakeScope.GetVariable('oe_tb2_t_w').GetValue|0]#!；将军：[Country.Custom('OeTb2MgGen')]。"
 oe_tb2_mg_st_off: "\n\n未托管。"
 oe_tb2_mg_st_cd: "\n\n#R 收回未满12个月，暂时不能再托管。#!"
 oe_tb2_mg_st_revolt: "\n\n#R 军区正在叛乱，不能托管。#!"
 oe_tb2_mg_g0: "不必更换"
 oe_tb2_mg_g1: "已请豪族子弟接任"
 oe_tb2_mg_g2: "#R 该换而没换：没有与皇帝结盟的豪族，或其族中没有合适人选#!"
 oe_tb2_mg_g3: "#R 该换而没换：帝国权威不足8#!"
 oe_tb2_mg_g4: "#R 该换而没换：选出的人没能接任（未扣权威）#!"
 oe_tb2_sum_year: "托管：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_mg_n')|0]#!个军区；今年1月改方针#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_c').GetValue|0]#!个、授地#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_p').GetValue|0]#!个、换将#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_g').GetValue|0]#!个、修缮城堡#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_f').GetValue|0]#!处、征募边军#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_l').GetValue|0]#!处；今年开工程#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_w').GetValue|0]#!项。"
 oe_tb2_sum_wait: "托管：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_mg_n')|0]#!个军区，每年1月办理。"
 oe_tb2_sum_none: "托管：没有托管的军区。"
 OE_TB2_BTN_MANAGE: "[Country.Custom('OeTb2MgBtn')]"
 OE_TB2_BTN_MANAGE_DESC: "托管：把这个军区交给将军打理。每年1月按AI帝国自己的规则替你办：改方针（与“按建议设置”同一条规则，每次花费#R 5#![oe_tu_authority|e]，权威低于#Y 25#!时不改）；法律允许时陆军[oe_tu_march|e]和[oe_tu_exarchate|e]改行授地；将军忠诚低于#Y 40#!且任职满#Y 5#!年时（专制公领除外），请与皇帝结盟的豪族子弟接任（#R 3#!帝国权威，权威低于#Y 8#!时不换）；边镇边患达到#Y 40#!且国库有#Y 300#!金时修缮城堡，边患达到#Y 60#!且国库有#Y 150#!金时征募边军（花费照常）；闲置满#Y 12#!个月就由军区自己出钱开工程。\n托管的军区不再抽到军区故事、辖区故事和边患事件；“前线暴露”直接改设边镇，“边患已平”直接恢复为内地（都照AI帝国的答法）。授地满20年时也不再询问，直接准其世袭（AI帝国最常用的答法）。叛乱预警、篡位、征伐应召和[oe_tu_senate|e]表决照常弹出。\n代价：军务效率#R −5#!；将来推行军区上缴时，托管军区上缴的份额少#Y 10#!个百分点（将军自己留下一份）。随时可以收回；收回后#Y 12#!个月内不能再托管。[Country.Custom('OeTb2MgState')]"
 OE_TB2_BTN_MANAGE_ALL: "军区托管"
 OE_TB2_BTN_MANAGE_ALL_DESC: "全部托管或全部收回（逐个托管用军区卡片上的“托管”按钮）。按钮不可点时：没有可托管也没有已托管的军区。"
 OE_TB2_SUM_LINE: "[GetCountry('BYZ').Custom('OeTb2Sum')]"
 OE_TB2_SUM_TT: "每年1月按AI帝国自己的规则替你办：改方针（与“按建议设置”同一条规则，每次花费#R 5#![oe_tu_authority|e]，权威低于#Y 25#!时不改）；法律允许时陆军[oe_tu_march|e]和[oe_tu_exarchate|e]改行授地；将军忠诚低于#Y 40#!且任职满#Y 5#!年时（专制公领除外），请与皇帝结盟的豪族子弟接任（#R 3#!帝国权威，权威低于#Y 8#!时不换）；边镇边患达到#Y 40#!且国库有#Y 300#!金时修缮城堡，边患达到#Y 60#!且国库有#Y 150#!金时征募边军（花费照常）；闲置满#Y 12#!个月就由军区自己出钱开工程。\n托管的军区不再抽到军区故事、辖区故事和边患事件；“前线暴露”直接改设边镇，“边患已平”直接恢复为内地（都照AI帝国的答法）。授地满20年时也不再询问，直接准其世袭（AI帝国最常用的答法）。叛乱预警、篡位、征伐应召和[oe_tu_senate|e]表决照常弹出。\n代价：军务效率#R −5#!；将来推行军区上缴时，托管军区上缴的份额少#Y 10#!个百分点（将军自己留下一份）。随时可以收回；收回后#Y 12#!个月内不能再托管。"
 oe_tb2.3.t: "军区托管"
 oe_tb2.3.d: "现在可以托管的军区#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_mg_can_n')|0]#!个，已经托管的#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_mg_n')|0]#!个。\n\n每年1月按AI帝国自己的规则替你办：改方针（与“按建议设置”同一条规则，每次花费#R 5#![oe_tu_authority|e]，权威低于#Y 25#!时不改）；法律允许时陆军[oe_tu_march|e]和[oe_tu_exarchate|e]改行授地；将军忠诚低于#Y 40#!且任职满#Y 5#!年时（专制公领除外），请与皇帝结盟的豪族子弟接任（#R 3#!帝国权威，权威低于#Y 8#!时不换）；边镇边患达到#Y 40#!且国库有#Y 300#!金时修缮城堡，边患达到#Y 60#!且国库有#Y 150#!金时征募边军（花费照常）；闲置满#Y 12#!个月就由军区自己出钱开工程。\n托管的军区不再抽到军区故事、辖区故事和边患事件；“前线暴露”直接改设边镇，“边患已平”直接恢复为内地（都照AI帝国的答法）。授地满20年时也不再询问，直接准其世袭（AI帝国最常用的答法）。叛乱预警、篡位、征伐应召和[oe_tu_senate|e]表决照常弹出。\n代价：军务效率#R −5#!；将来推行军区上缴时，托管军区上缴的份额少#Y 10#!个百分点（将军自己留下一份）。随时可以收回；收回后#Y 12#!个月内不能再托管。\n\n与“按建议设置”不同：那是按一次、先列名单再确认，只管方针和授地；托管是开着就每年办，不再问。与AI帝国相同的规则，只是只管你选中的军区。"
 oe_tb2.3.a: "全部托管"
 oe_tb2.3.a.tt: "可以托管的军区全部托管：军务效率#R −5#!，每年1月照上面的规则办理。"
 oe_tb2.3.b: "全部收回"
 oe_tb2.3.b.tt: "已托管的军区全部收回，#Y 12#!个月内不能再托管。"
 oe_tb2.3.c: "不变"
