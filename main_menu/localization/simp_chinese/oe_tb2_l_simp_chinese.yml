 oe_tb2_slot_8: "\n· [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l8').GetCountry.GetName]：[GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l8').GetCountry.Custom('OeTb2Adv')]"
 oe_tb2_slot_9: "\n· [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l9').GetCountry.GetName]：[GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l9').GetCountry.Custom('OeTb2Adv')]"
 oe_tb2_slot_10: "\n· [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l10').GetCountry.GetName]：[GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l10').GetCountry.Custom('OeTb2Adv')]"
 oe_tb2_slot_11: "\n· [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l11').GetCountry.GetName]：[GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l11').GetCountry.Custom('OeTb2Adv')]"
 oe_tb2_slot_12: "\n· [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l12').GetCountry.GetName]：[GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_l12').GetCountry.Custom('OeTb2Adv')]"
 oe_tb2_more_some: "\n……另有[GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_more')|0]个。"
 oe_tb2_none: "\n眼下没有要改的军区。"
 oe_tb2.1.t: "按建议设置军区"
 oe_tb2.1.d: "以下军区将按建议改动：[ROOT.GetCountry.Custom('OeTb2Slot1')][ROOT.GetCountry.Custom('OeTb2Slot2')][ROOT.GetCountry.Custom('OeTb2Slot3')][ROOT.GetCountry.Custom('OeTb2Slot4')][ROOT.GetCountry.Custom('OeTb2Slot5')][ROOT.GetCountry.Custom('OeTb2Slot6')][ROOT.GetCountry.Custom('OeTb2Slot7')][ROOT.GetCountry.Custom('OeTb2Slot8')][ROOT.GetCountry.Custom('OeTb2Slot9')][ROOT.GetCountry.Custom('OeTb2Slot10')][ROOT.GetCountry.Custom('OeTb2Slot11')][ROOT.GetCountry.Custom('OeTb2Slot12')][ROOT.GetCountry.Custom('OeTb2More')]\n\n改方针#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_c').GetValue|0]#!个，花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_cost_c')|0]#![oe_tu_authority|e]（现有[GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_auth_now')|0]）；改行授地#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_p').GetValue|0]#!个，不花权威。\n\n建议用的就是AI帝国自己的规则：将军至少“平稳”、方针不在#Y 5#!年冷却中的军区，[oe_tu_march|e]改陆军，临海的内地改海军（海军军区不超过全部军区的三分之一），内陆的内地改民政；法律允许[oe_tu_pronoia|e]时，财政不由中央委派的陆军边镇和[oe_tu_exarchate|e]改行授地。每改一个方针花费#R 5#!帝国权威，权威不够时后面的不改；名单里只列了付得起的。"
 oe_tb2.1.a: "照建议办"
 oe_tb2.1.a.tt: "名单上的军区改方针（每个花费#R 5#![oe_tu_authority|e]，#Y 5#!年内不能再改）或改行授地（#Y 2#!年内不能再调属官）。改动在下一刻逐个完成。"
 oe_tb2.1.b: "先不改"
 oe_tb2.2.t: "边镇一齐"
 oe_tb2.2.d: "可修缮城堡的[oe_tu_march|e]#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_n')|0]#!个，每个#R 100#!金，全部修缮共需[ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_cost')|0]金；\n可征募边军的边镇#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_n')|0]#!个，每个#R 50#!金，全部征募共需[ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_cost')|0]金。\n国库现有[ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_gold')|0]金。\n\n每个边镇的效果、花费和冷却与“军事令”里单独下令时完全一样。钱不够时按边患从高到低一个个办，办到钱用完为止。"
 oe_tb2.2.fortify: "所有边镇一起修缮城堡"
 oe_tb2.2.fortify.tt: "每个可修缮的[oe_tu_march|e]照“修缮城堡”办一次，每个#R 100#!金，从边患最高的开始，钱用完为止。"
 oe_tb2.2.levy: "所有边镇一起征募边军"
 oe_tb2.2.levy.tt: "每个可征募的[oe_tu_march|e]照“征募边军”办一次，每个#R 50#!金，从边患最高的开始，钱用完为止。"
 oe_tb2.2.c: "都不办"
 oe_tb2.9.t: "军区批量命令：执行"
 OE_TB2_BTN_ADVISE: "按建议设置"
 OE_TB2_BTN_ADVISE_DESC: "先列出要改的军区，确认后再改。建议用的就是AI帝国自己的规则：将军至少“平稳”、方针不在#Y 5#!年冷却中的军区，[oe_tu_march|e]改陆军，临海的内地改海军（海军军区不超过全部军区的三分之一），内陆的内地改民政；法律允许[oe_tu_pronoia|e]时，财政不由中央委派的陆军边镇和[oe_tu_exarchate|e]改行授地。每改一个方针花费#R 5#![oe_tu_authority|e]，授地不花权威。按钮不可点时：没有要改的军区，或帝国权威不足#Y 5#!且没有可授地的军区，或上一轮还没办完。"
 OE_TB2_BTN_MARCHES: "边镇一齐"
 OE_TB2_BTN_MARCHES_DESC: "一次给所有[oe_tu_march|e]修缮城堡（每个#R 100#!金）或征募边军（每个#R 50#!金），先列出个数和总价再选。按钮不可点时：没有可修缮也没有可征募的边镇。"
