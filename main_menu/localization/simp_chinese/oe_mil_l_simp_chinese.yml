 oe_mil_dec_byz_drill: "军区与禁卫火器整编操演"
 oe_mil_dec_byz_drill_desc: "组织拜占庭/罗马禁卫团与行省军区进行实弹齐射与步炮合练，提升全军战备；若已进入专制时代且尚未完成火器改制，本次操演将同步完成线列改制并解除火器代差惩戒。"
 oe_mil_dec_byz_drill.title: "军区与禁卫火器整编操演"
 oe_mil_dec_byz_drill.desc: "组织拜占庭/罗马禁卫团与行省军区进行实弹齐射与步炮合练，提升全军战备；若已进入专制时代且尚未完成火器改制，本次操演将同步完成线列改制并解除火器代差惩戒。"
 oe_mil_dec_byz_drill.a: "举行禁卫与军区实弹火器大操演"
 oe_mil_dec_yuan_drill: "大都神机营步炮合练校阅"
 oe_mil_dec_yuan_drill_desc: "集结大元神机营、怯薛火枪骑兵与大都炮兵营举行实弹大校阅；若已进入专制时代且尚未完成火器改制，本次校阅将同步完成新式神机营改制并解除火器代差惩戒。"
 oe_mil_dec_yuan_drill.title: "大都神机营步炮合练校阅"
 oe_mil_dec_yuan_drill.desc: "集结大元神机营、怯薛火枪骑兵与大都炮兵营举行实弹大校阅；若已进入专制时代且尚未完成火器改制，本次校阅将同步完成新式神机营改制并解除火器代差惩戒。"
 oe_mil_dec_yuan_drill.a: "校阅大都神机营与炮兵实弹合练"
 oe_mil_dec_rus_drill: "新编团实弹操演与哥萨克边防检阅"
 oe_mil_dec_rus_drill_desc: "检阅全罗斯常备火枪军团与六大边疆哥萨克军团，提升实战纪律与士气；若已进入专制时代且尚未完成火器改制，本次检阅将同步完成新编团改制并解除火器代差惩戒。"
 oe_mil_dec_rus_drill.title: "新编团实弹操演与哥萨克边防检阅"
 oe_mil_dec_rus_drill.desc: "检阅全罗斯常备火枪军团与六大边疆哥萨克军团，提升实战纪律与士气；若已进入专制时代且尚未完成火器改制，本次检阅将同步完成新编团改制并解除火器代差惩戒。"
 oe_mil_dec_rus_drill.a: "检阅新编火枪团与六大边疆哥萨克"
 oe_mil.1.t: "火绳枪与希腊火的合流"
 oe_mil.1.d: "随着宗教改革时代的欧陆战火烧至巴尔干与意大利，古老的罗马禁卫步兵正迎来火药革命的分岔口。军械总监呈上两套改制方案：其一以致密长矛方阵护持火绳枪手，组建常备“长矛火绳枪禁卫”；其二重启皇室秘藏的希腊火配方，装备便携喷火管与燃烧掷弹，编练专司破城与近战冲击的“希腊火喷火掷弹兵”。"
 oe_mil.1.a: "重编长矛火绳枪禁卫方阵"
 oe_mil.1.a.tt: "花费#R 140#!金币；获得#Y 25年#!修正[ShowModifier('oe_mil_byz_pike_doctrine')]；推进#Y 宗教改革#!时代的禁卫步兵火器化。"
 oe_mil.1.b: "重启希腊火喷火掷弹兵工坊"
 oe_mil.1.b.tt: "花费#R 160#!金币；获得#Y 25年#!修正[ShowModifier('oe_mil_byz_siphon_doctrine')]；强化攻城与近战士气杀伤。"
 oe_mil.2.t: "紫衣线列与胸甲圣骑兵的抉择"
 oe_mil.2.d: "步入专制时代，燧发滑膛枪的排枪齐射与标准化线列阵已彻底主宰欧陆战场。若帝国顺势将禁卫军改组为近卫火枪团与线列军区常备步兵，并为圣骑兵换装防弹胸甲，便能牢牢守住罗马军事霸权；反之，若屈从军区世袭勋贵而固守封建重骑旧制，必将在列强火枪齐射前付出惨痛代差代价。"
 oe_mil.2.a: "全面推行近卫线列与胸甲圣骑改制"
 oe_mil.2.a.tt: "标记拜占庭火器改制完成（解锁#Y 帝国近卫火枪团#!科技并免疫火器代差惩戒）；获得#Y 35年#!修正[ShowModifier('oe_mil_byz_line_modernized')]；若已完成近世军改（oe_bem_mil_reformed），财政与稳定消耗减半。"
 oe_mil.2.b: "照顾旧勋贵颜面，维系封建圣骑旧制"
 oe_mil.2.b.tt: "获得#Y 20年#!修正[ShowModifier('oe_mil_byz_feudal_cling')]，但因拒绝专制时代火器改制，立即承受[ShowModifier('oe_mil_firepower_gap')]直至日后通过操演决议完成转型！"
 oe_mil.3.t: "大元神机营与怯薛火枪化"
 oe_mil.3.d: "大元中兴以来，怯薛宿卫与探马赤边军虽仍驰骋漠北与中原，但大发现与宗教改革时代的火绳枪与重炮已彻底改写欧亚战局。枢密院与工部联名上奏：可集中中原匠户扩建“大元神机营火铳队”以构筑步炮火力网，或优先为怯薛重骑换装短管燧发卡宾枪，打造兼具草原机动与火器齐射的“火枪怯薛骑兵”。"
 oe_mil.3.a: "扩编大元神机营火铳常备军"
 oe_mil.3.a.tt: "花费#R 150#!金币；获得#Y 25年#!修正[ShowModifier('oe_mil_yuan_shenji_doctrine')]；为步炮协同打下根基。"
 oe_mil.3.b: "为怯薛宿卫全面换装卡宾火枪"
 oe_mil.3.b.tt: "花费#R 160#!金币；获得#Y 25年#!修正[ShowModifier('oe_mil_yuan_carabinier_doctrine')]；强化重骑火力与机动。"
 oe_mil.4.t: "大都炮局与新式神机营线列"
 oe_mil.4.d: "专制时代降临，欧亚各大强权皆以线列火枪与野战重炮决胜千里。大都铸炮局与神机营提督请求全面废除旧式冷兵器卫所编成，统练新式神机营线列火枪兵与大都重炮营；然部分草原宗王仍视弓马为祖宗根本，极力阻挠火器全面改制。"
 oe_mil.4.a: "铁腕整编新式神机营与大都炮兵营"
 oe_mil.4.a.tt: "标记大元火器改制完成（解锁#Y 新式神机营线列#!与#Y 大都炮兵营#!科技并免疫火器代差惩戒）；获得#Y 35年#!修正[ShowModifier('oe_mil_yuan_modern_arsenal')]；若已建成近世神机炮局（oe_yem_shenjiying），改革耗费减半。"
 oe_mil.4.b: "安抚草原宗王，保留传统弓骑主导地位"
 oe_mil.4.b.tt: "获得#Y 20年#!修正[ShowModifier('oe_mil_yuan_steppe_cling')]，但拒绝专制时代火器改制将立即承受[ShowModifier('oe_mil_firepower_gap')]直至日后通过操演决议完成转型！"
 oe_mil.5.t: "射击军常备与边疆哥萨克军团"
 oe_mil.5.d: "随着全罗斯诸邦告别封建亲兵与单一封地骑兵时代，大公与沙皇面前展开了两条相辅相成的强军之路：一方面是以火绳枪配月斧、常备驻防都城与要塞的“射击军”；另一方面则是遍布第聂伯河、顿河、雅伊克、捷列克、西伯利亚与库班六大边疆聚落的自由哥萨克自治军团。朝廷须决定将首要兵制资源倾斜于何方。"
 oe_mil.5.a: "颁行射击军常备聚落宪章"
 oe_mil.5.a.tt: "花费#R 140#!金币；获得#Y 25年#!修正[ShowModifier('oe_mil_rus_streltsy_charter')]；强化常备火枪步兵与士气。"
 oe_mil.5.b: "册封六大边疆哥萨克军团敕令"
 oe_mil.5.b.tt: "花费#R 130#!金币；获得#Y 25年#!修正[ShowModifier('oe_mil_rus_cossack_charter')]；强化轻骑突袭、边疆远征补给与哥萨克满意度。"
 oe_mil.6.t: "全罗斯新编团火器化转折"
 oe_mil.6.d: "专制时代来临，曾经威震一时的封地骑兵与世袭射击军在欧陆近代燧发枪线列与刺刀方阵面前日渐陈旧。唯有大刀阔斧编练“新编团近卫线列步兵”与“哥萨克近卫轻骑”，方能令罗斯雄狮无往不利；若姑息旧射击军与保守波雅尔特权，全军必将承受惨重的火器代差惩戒。"
 oe_mil.6.a: "全面改组为新编团近卫线列与哥萨克近卫轻骑"
 oe_mil.6.a.tt: "标记罗斯火器改制完成（解锁#Y 新编近卫线列兵法#!科技并免疫火器代差惩戒）；获得#Y 35年#!修正[ShowModifier('oe_mil_rus_new_order_doctrine')]；若已推行彼得式军事西化（oe_rem_peter_reform），改革耗费减半。"
 oe_mil.6.b: "维持封地骑兵与射击军世袭特权"
 oe_mil.6.b.tt: "获得#Y 20年#!修正[ShowModifier('oe_mil_rus_old_order_cling')]，但拒绝专制时代火器改制将立即承受[ShowModifier('oe_mil_firepower_gap')]直至日后通过操演决议完成转型！"
 oe_mil.7.t: "火器代差警报"
 oe_mil.7.d: "前线战报与演习官急奏雪片般飞入御案：国家虽已步入专制时代，但军队仍迟迟未完成燧发枪线列与野战炮兵改制。在敌军密集的近代滑膛枪齐射面前，沿袭中世纪编成的重骑与旧式卫队伤亡惨重、纪律动摇！朝廷必须立刻砸下重金紧急换装，或咬牙承受火器代差惩戒，直至通过本文明军改操演决议彻底完成转型。"
 oe_mil.7.a: "不惜代价拨款紧急换装线列火器"
 oe_mil.7.a.tt: "花费#R 260#!金币并损失#R 5#!稳定度；立刻完成本文明火器改制，彻底清除[ShowModifier('oe_mil_firepower_gap')]并获得#Y 10年#!修正[ShowModifier('oe_mil_drill_readiness')]。"
 oe_mil.7.b: "国库吃紧，暂且忍受代差择机再改"
 oe_mil.7.b.tt: "承受长期惩戒[ShowModifier('oe_mil_firepower_gap')]（直至完成本文明近世军改或执行火器操演决议后自动解除）。"
 oe_mil.8.t: "丝路火炮互鉴"
 oe_mil.8.d: "依托贯通欧亚的“丝路双凤”商路，来自君士坦丁堡帝国铸炮坊的青铜铸模匠师与大都神机营的火药测绘官在驿站与海港频频互访。双方围绕攻城巨炮合金配比、粒状黑火药防潮工艺与炮术象限仪展开深度交流，只要朝廷批准拨款设立联合兵工使团，拜占庭与大元即可共享跨文明炮兵技术飞跃！"
 oe_mil.8.a: "批准丝路双凤联合铸炮使团"
 oe_mil.8.a.tt: "花费#R 120#!金币；获得#Y 30年#!修正[ShowModifier('oe_mil_silk_artillery_exchange')]，并同步推动首都#Y 火炮#!与#Y 军事革命#!思潮传播。"
 oe_mil.8.b: "严守军工机密，婉拒跨国炮术交流"
 oe_mil.8.b.tt: "不支付使团费用，获#G +5#!威望，但错失丝路火炮互鉴加成。"
 oe_mil.20.t: "跨时代军事演进：选项生效"
 oe_mil.90.t: "跨时代军事演进体系总览"
