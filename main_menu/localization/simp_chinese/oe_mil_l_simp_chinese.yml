l_simp_chinese:
 # NEW 2026-11-21 v8.5 Three Civilizations Cross-Era Military Evolution System (oe_mil_, slot 66). Generated by gen_military_evolution.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_mil_byz_pike_doctrine: "禁卫长矛火绳枪方阵教范"
 STATIC_MODIFIER_DESC_oe_mil_byz_pike_doctrine: "帝国禁卫以长矛手护持火绳枪方阵，重步兵正面对决与士气韧性大增，但火药采购与常备训练抬升了陆军维持开支。"
 STATIC_MODIFIER_NAME_oe_mil_byz_siphon_doctrine: "希腊火喷火掷弹攻城编成"
 STATIC_MODIFIER_DESC_oe_mil_byz_siphon_doctrine: "将古老的希腊火虹吸管改良为便携喷火器与燃烧掷弹，攻城破垒与炮兵协同大为强化，但精锐特种军需耗费不菲。"
 STATIC_MODIFIER_NAME_oe_mil_byz_line_modernized: "紫衣近卫线列与胸甲圣骑体系"
 STATIC_MODIFIER_DESC_oe_mil_byz_line_modernized: "完成由封建军区向近代滑膛枪线列军与胸甲重骑兵的全面转型，全军纪律与战术跃升，旧勋贵特权则大为收缩。"
 STATIC_MODIFIER_NAME_oe_mil_byz_feudal_cling: "固守旧军区重骑传统"
 STATIC_MODIFIER_DESC_oe_mil_byz_feudal_cling: "拒绝全面火器改制而保留世袭重骑兵特权，短期安抚了地方勋贵并维系骑兵冲击力，却在近世火枪时代埋下代差隐患。"
 STATIC_MODIFIER_NAME_oe_mil_yuan_shenji_doctrine: "大元神机营火铳编成"
 STATIC_MODIFIER_DESC_oe_mil_yuan_shenji_doctrine: "将草原骑战纪律与中原铸铳匠艺合一，建立常备神机营火铳卫队，步兵火力与攻城能力齐升，军器局用度随之增加。"
 STATIC_MODIFIER_NAME_oe_mil_yuan_carabinier_doctrine: "怯薛火枪轻骑机动教范"
 STATIC_MODIFIER_DESC_oe_mil_yuan_carabinier_doctrine: "为怯薛宿卫与探马赤边军配发短管火枪与轻型马炮，大幅提升骑兵冲击与行军机动，但马政与火药补给耗费甚巨。"
 STATIC_MODIFIER_NAME_oe_mil_yuan_modern_arsenal: "大都炮局与新式神机营体系"
 STATIC_MODIFIER_DESC_oe_mil_yuan_modern_arsenal: "以大都火炮铸造局为中枢，实现新式神机营线列步兵与重炮营步炮协同，纪律与火力大涨，代价是沉重军费与保守王公抵触。"
 STATIC_MODIFIER_NAME_oe_mil_yuan_steppe_cling: "固守传统弓骑兵制"
 STATIC_MODIFIER_DESC_oe_mil_yuan_steppe_cling: "宗室怯薛坚持弓马立国旧制，压制大都炮局扩张，短期稳固草原王公拥戴并维持高速机动，但难以抗衡近世线列齐射。"
 STATIC_MODIFIER_NAME_oe_mil_rus_streltsy_charter: "全罗斯射击军常备宪章"
 STATIC_MODIFIER_DESC_oe_mil_rus_streltsy_charter: "赐予射击军世袭聚落与商税豁免，换取手持火绳枪与月斧的精锐常备主力，步兵战力与士气飙升，但国库与阶层特权承压。"
 STATIC_MODIFIER_NAME_oe_mil_rus_cossack_charter: "六大边疆哥萨克军团敕令"
 STATIC_MODIFIER_DESC_oe_mil_rus_cossack_charter: "以沙皇敕令正式编列扎波罗热、顿河、雅伊克、捷列克、西伯利亚与库班六大哥萨克军团，边疆轻骑与远征补给大强，贵族领主却颇感嫉恨。"
 STATIC_MODIFIER_NAME_oe_mil_rus_new_order_doctrine: "新编团近卫线列兵制"
 STATIC_MODIFIER_DESC_oe_mil_rus_new_order_doctrine: "彻底以近世新编团线列步兵与哥萨克近卫轻骑取代旧封地兵与射击军，全军纪律与步骑协同迈入欧洲一流，但军费高昂且旧贵族不满。"
 STATIC_MODIFIER_NAME_oe_mil_rus_old_order_cling: "维系封地骑兵与射击军旧制"
 STATIC_MODIFIER_DESC_oe_mil_rus_old_order_cling: "拒绝削弱传统封地骑兵与射击军特权，短期稳住了贵族与旧军团忠诚，却使全罗斯在专制时代深陷火器代差泥潭。"
 STATIC_MODIFIER_NAME_oe_mil_firepower_gap: "火器代差惩戒：旧军制落后于线列时代"
 STATIC_MODIFIER_DESC_oe_mil_firepower_gap: "步入专制时代却仍未完成火器与线列常备军改制，面对近代燧发枪齐射与野战炮火，旧式重骑与封建步卒阵线频频崩溃；完成本文明火器改制（事件或操演决议）即可彻底解除。"
 STATIC_MODIFIER_NAME_oe_mil_silk_artillery_exchange: "丝路火炮互鉴：双凤铸炮协约"
 STATIC_MODIFIER_DESC_oe_mil_silk_artillery_exchange: "依托丝路双凤通商网络，君士坦丁堡铸炮师与大都神机火药局交换青铜铸模、粒状火药与瞄准象限仪工艺，炮兵战力与军事科研齐飞，同时需拨款维系联合兵工使团。"
 STATIC_MODIFIER_NAME_oe_mil_drill_readiness: "跨时代火器实弹大校阅"
 STATIC_MODIFIER_DESC_oe_mil_drill_readiness: "按最新军制举行全军火器齐射、步炮协同与边防骑兵合练，显著提振纪律、士气与陆军传统，代价是高昂的铅弹火药与粮饷消耗。"
 oe_mil_byz_pike_shot_tagma: "长矛火绳枪禁卫"
 oe_mil_byz_pike_shot_tagma_desc: "宗教改革时期重组而成的帝国禁卫常备方阵，以致密长矛护持火绳枪手轮番齐射，兼具重甲防冲击与火器杀伤之长。"
 oe_mil_byz_siphon_grenadiers: "希腊火喷火掷弹兵"
 oe_mil_byz_siphon_grenadiers_desc: "将古老的帝国“希腊火”秘方与近世燧发引信结合的特种突击掷弹兵，擅于在攻城缺口与近战阵前喷射烈焰、摧垮敌军士气。"
 oe_mil_byz_musketeer_tagma: "近卫火枪团"
 oe_mil_byz_musketeer_tagma_desc: "伴随专制时代军改诞生的帝国精锐滑膛枪禁卫团，配装插口刺刀与标准化燧发枪，以严明队列纪律压倒欧陆列强。"
 oe_mil_byz_line_theme_infantry: "线列军区常备步兵"
 oe_mil_byz_line_theme_infantry_desc: "由传统军区兵役改组而成的标准化线列常备步兵，依托军区财政补给网络大幅降低粮耗与维持费，是帝国广袤疆域的常备基石。"
 oe_mil_byz_cuirassier_cataphract: "胸甲圣骑兵"
 oe_mil_byz_cuirassier_cataphract_desc: "千年罗马圣骑兵的近世火器终极形态：身披防弹精钢胸甲、佩带双管手铳与重骑兵马刀，以雷霆突击碾碎敌方线列两翼。"
 oe_mil_byz_fire_ship_of_line: "改良希腊火战列舰"
 oe_mil_byz_fire_ship_of_line_desc: "将多甲板重炮战列舰与舰首加压希腊火喷射装置合二为一的帝国主力战舰，既能以舷侧重炮轰击，又可在接舷近战焚毁敌方舰队。"
 oe_mil_yuan_keshig: "怯薛宿卫重骑"
 oe_mil_yuan_keshig_desc: "拱卫大汗帐幕与大都宫阙的四怯薛精锐重骑兵，人马俱披札甲，兼具草原神射与铁骑凿阵的毁灭性冲击力。"
 oe_mil_yuan_tammachi: "探马赤边防混合兵"
 oe_mil_yuan_tammachi_desc: "屯驻漠北、河西与中原要冲的探马赤军户骑兵，自备牧场与军粮，长于草原高原长途奔袭、侧翼包抄与持久戍边。"
 oe_mil_yuan_shenjiying: "大元神机营火铳队"
 oe_mil_yuan_shenjiying_desc: "大元中兴后汲取中原火器工坊精粹组建的常备神机营，以三段击火铳与轻型佛郎机炮构成密集火力网，专克敌军重甲冲锋。"
 oe_mil_yuan_keshig_carabiniers: "火枪怯薛骑兵"
 oe_mil_yuan_keshig_carabiniers_desc: "宗教改革时代率先实现火器化的怯薛禁卫骑兵，以轮转燧发卡宾枪取代传统角弓，保持草原高速机动同时具备致命近距离齐射。"
 oe_mil_yuan_new_shenjiying: "新式神机营线列"
 oe_mil_yuan_new_shenjiying_desc: "经钦天监与大都炮局全面改制后的新式神机营常备线列火枪队，采用标准化燧发步枪、定装纸壳弹与铁纪齐射阵型。"
 oe_mil_yuan_imperial_artillery: "大都炮兵营"
 oe_mil_yuan_imperial_artillery_desc: "直属大元中书省与大都铸炮总局的重型野战与攻城炮兵营，融汇欧亚炮术测绘精华，炮火密度与破城效率冠绝东方。"
 oe_mil_rus_druzhina: "罗斯亲兵队"
 oe_mil_rus_druzhina_desc: "效忠罗斯大公的披甲常备亲兵队，擅于在密林与冰雪原野中以长斧与大盾结阵死战，是早期罗斯诸公最可靠的精锐核心。"
 oe_mil_rus_pomestye_cav: "封地骑兵"
 oe_mil_rus_pomestye_cav_desc: "以大公赐予的服役封地自备马匹甲胄的罗斯贵族骑兵，兼通骑射与短矛突击，维持费低廉而动员迅捷。"
 oe_mil_rus_streltsy: "罗斯射击军"
 oe_mil_rus_streltsy_desc: "全罗斯第一支常备火器步兵军团，以长柄月斧充当火绳枪支架，远可排枪齐射、近可挥斧劈砍，攻守兼备。"
 oe_mil_rus_new_order: "新编团近卫线列"
 oe_mil_rus_new_order_desc: "按彼得式近代军事法典彻底改组的新编近卫线列步兵团，纪律铁血、刺刀冲锋无畏，标志着俄罗斯帝国正式跻身欧陆顶级陆军强权。"
 oe_mil_rus_cossack_lancers: "哥萨克近卫轻骑"
 oe_mil_rus_cossack_lancers_desc: "从六大边疆哥萨克军团中遴选精锐编成的帝国近卫长矛轻骑兵，奔袭千里不损元气，专司侧翼迂回、追击溃敌与切断补给线。"
 oe_mil_cos_zaporozhian: "扎波罗热哥萨克步舟营"
 oe_mil_cos_zaporozhian_desc: "征募自第聂伯河急流寨堡的扎波罗热哥萨克精锐，极擅步战火枪狙击、车阵野战与河海舟楫突袭。"
 oe_mil_cos_don: "顿河哥萨克草原突袭骑"
 oe_mil_cos_don_desc: "征募自顿河哥萨克聚落的草原突袭轻骑兵，马术绝伦、长矛如林，是东欧草原上令游牧汗国闻风丧胆的钢铁屏障。"
 oe_mil_cos_yaik: "雅伊克哥萨克骑射侦察队"
 oe_mil_cos_yaik_desc: "征募自乌拉尔河（雅伊克河）哥萨克定居区的骑射与火铳侦察骑兵，耐旱抗耗，擅于在荒漠草原执行远距斥候与袭扰。"
 oe_mil_cos_terek: "捷列克哥萨克高加索山地队"
 oe_mil_cos_terek_desc: "征募自北高加索捷列克河哥萨克堡垒的山地骑兵，身佩短铳与山刀，极擅在险峰隘口与丘陵地带固守反击。"
 oe_mil_cos_siberian: "西伯利亚哥萨克远征队"
 oe_mil_cos_siberian_desc: "征募自西伯利亚哥萨克冬营与木堡的火枪远征军，无惧严寒密林与万里补给线，是开拓乌拉尔以东广袤冻土的先锋利刃。"
 oe_mil_cos_kuban: "库班哥萨克黑海边防轻骑"
 oe_mil_cos_kuban_desc: "征募自黑海东岸库班哥萨克边区的海陆机动轻骑兵，扼守草原与黑海沿岸通道，兼善侧翼猛击与海疆防务。"
 oe_mil_adv_byz_pike_shot: "禁卫长矛火绳枪方阵"
 oe_mil_adv_byz_pike_shot_desc: "将帝国禁卫重步兵与火绳枪阵法合流，解锁长矛火绳枪禁卫并强化重步兵战力。"
 oe_mil_adv_byz_siphon_gren: "便携希腊火与掷弹工坊"
 oe_mil_adv_byz_siphon_gren_desc: "改良古老的希腊火喷射管并配发燃烧掷弹，解锁希腊火喷火掷弹兵并提升攻城效率。"
 oe_mil_adv_byz_musketeer_tagma: "帝国近卫火枪团建制"
 oe_mil_adv_byz_musketeer_tagma_desc: "完成专制时代军改后，正式将禁卫步兵全面升级为近卫火枪团并提升全军纪律。"
 oe_mil_adv_byz_line_theme: "线列军区常备兵役"
 oe_mil_adv_byz_line_theme_desc: "将军区征召体制改组为标准化线列常备步兵，解锁线列军区常备步兵并降低陆军维持成本。"
 oe_mil_adv_byz_cuirassier_cataphract: "精钢胸甲圣骑兵改制"
 oe_mil_adv_byz_cuirassier_cataphract_desc: "为传统圣骑兵换装防弹胸甲与骑兵手铳，解锁胸甲圣骑兵并大幅强化重骑兵冲击力。"
 oe_mil_adv_byz_fire_ship_of_line: "希腊火重炮战列舰船坞"
 oe_mil_adv_byz_fire_ship_of_line_desc: "在帝国海军船坞建造搭载加压希腊火装置的多甲板战列舰，解锁改良希腊火战列舰并增强重型战舰火力。"
 oe_mil_adv_yuan_keshig: "四怯薛宿卫重骑制度"
 oe_mil_adv_yuan_keshig_desc: "整顿大汗四怯薛宿卫典章，解锁怯薛宿卫重骑并强化重骑兵战力。"
 oe_mil_adv_yuan_tammachi: "探马赤边防军户编练"
 oe_mil_adv_yuan_tammachi_desc: "规范草原与农耕交界地带的探马赤屯戍体系，解锁探马赤边防混合兵并提升行军机动。"
 oe_mil_adv_yuan_shenjiying: "大元神机营火铳常备制"
 oe_mil_adv_yuan_shenjiying_desc: "在大都与江南军器局统铸火铳并设立神机营，解锁大元神机营火铳队并强化重步兵战力。"
 oe_mil_adv_yuan_keshig_carabiniers: "火枪怯薛禁卫改制"
 oe_mil_adv_yuan_keshig_carabiniers_desc: "为怯薛重骑换装短管燧发火枪与轻马炮，解锁火枪怯薛骑兵并提升重骑兵战力。"
 oe_mil_adv_yuan_new_shenjiying: "新式神机营线列典范"
 oe_mil_adv_yuan_new_shenjiying_desc: "依托大都火器改革与钦天监军工测算，解锁新式神机营线列并提高全军纪律。"
 oe_mil_adv_yuan_imperial_artillery: "大都铸炮总局与炮兵营"
 oe_mil_adv_yuan_imperial_artillery_desc: "设立直属朝廷的重型铸炮总局，解锁大都炮兵营并大幅强化全军炮兵火力。"
 oe_mil_adv_rus_druzhina: "罗斯大公亲兵队典制"
 oe_mil_adv_rus_druzhina_desc: "整编各罗斯公国重甲亲兵队，解锁罗斯亲兵队并提升陆军士气。"
 oe_mil_adv_rus_pomestye_cav: "封地服役骑兵制度"
 oe_mil_adv_rus_pomestye_cav_desc: "推广以服役土地供养贵族骑兵的封地军制，解锁封地骑兵并增强重骑兵战力。"
 oe_mil_adv_rus_streltsy: "全罗斯射击军建制"
 oe_mil_adv_rus_streltsy_desc: "组建常备火绳枪与月斧精兵射击军，解锁罗斯射击军并提升重步兵战力。"
 oe_mil_adv_rus_new_order: "新编近卫线列兵法"
 oe_mil_adv_rus_new_order_desc: "完成彼得式军事近代化后，全面编练新编团近卫线列步兵并显著提升全军纪律。"
 oe_mil_adv_rus_cossack_lancers: "帝国哥萨克近卫轻骑"
 oe_mil_adv_rus_cossack_lancers_desc: "从边疆哥萨克老兵中编练皇室近卫长矛轻骑，解锁哥萨克近卫轻骑并大幅强化轻骑兵战力。"
 oe_mil_adv_cos_steppe_hosts: "第聂伯与顿河哥萨克军团敕令"
 oe_mil_adv_cos_steppe_hosts_desc: "正式承认扎波罗热与顿河哥萨克自治军团，允许在对应哥萨克聚落征募专属步舟营与草原突袭骑。"
 oe_mil_adv_cos_eastern_hosts: "雅伊克与西伯利亚哥萨克远征制"
 oe_mil_adv_cos_eastern_hosts_desc: "将哥萨克边防体系延伸至乌拉尔河与西伯利亚深林，解锁雅伊克与西伯利亚专属哥萨克兵团并降低陆军损耗。"
 oe_mil_adv_cos_caucasus_hosts: "高加索与黑海哥萨克边防军团"
 oe_mil_adv_cos_caucasus_hosts_desc: "在北高加索山地与库班黑海沿岸整编火器化哥萨克轻骑，解锁捷列克与库班专属哥萨克兵团。"
 OE_MIL_LIMIT_BASE: "基础编制上限"
 OE_MIL_LIMIT_SCALE_TAX: "按帝国税基扩展"
