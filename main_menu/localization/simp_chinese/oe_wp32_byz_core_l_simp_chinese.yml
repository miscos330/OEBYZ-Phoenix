 oe_wp32_armamenton_io_list_who_tt: "$WHO$ 与 $LIST$ 同属帝国皇家军械库。"
 oe_wp32_beacon_chain_reason: "帝国光学烽火链敕建减免"
 oe_wp32_bias_1204_demand: "追索1204年十字军赔款"
 oe_wp32_bias_1204_settled: "1204年赔款妥善了结"
 oe_wp32_bias_sitonia_tariff: "博斯普鲁斯海峡谷物关税"
 oe_wp32_cb_venice_armed_tt: "解锁针对威尼斯的“1204年威尼斯追偿”宣战理由。"
 oe_wp32_cb_venice_reparations: "1204年威尼斯追偿宣战理由"
 oe_wp32_cb_venice_reparations_desc: "威尼斯公然拒认《1204年国耻追偿清册》，帝国大军有权以武力讨还旧债与圣物。"
 oe_wp32_chr_sees_active: "已确立都会圣座数"
 oe_wp32_chr_sees_active_desc: "统计君士坦丁堡、塞萨洛尼基、尼西亚、特拉比松及东方使徒教区中已在帝国庇护下活跃运转的都会圣座数量。"
 oe_wp32_chr_symphonia: "政教协和度（辛福尼亚）"
 oe_wp32_chr_symphonia_desc: "衡量罗马皇帝、普世牧首与常设圣主教会议之间政教协和的稳固程度。"
 oe_wp32_crisis.1.a: "先手直面宫廷秘书署与元老院之僵局。"
 oe_wp32_crisis.1.b: "率先斡旋圣主教会议以免教潮波及京畿。"
 oe_wp32_crisis.1.c: "急拨国库重金安抚边军并统筹四廷大局。"
 oe_wp32_crisis.1.d: "数十年开疆拓土与不断累积的沉重财政压力终于压断了帝国四大权力中枢——宫廷总管官署、元老院、圣主教会议与边防野战军——之间维持已久的微妙宪政平衡。四廷彼此攻讦掣肘，致使全国税册停摆、教职任命悬置、前线军饷拖欠。若不能通过危机交互行动依次折服并安抚至少三廷，庞大帝国恐将自中枢内部逐渐空洞瘫痪。"
 oe_wp32_crisis.1.t: "四廷失和：帝国中枢危机爆发"
 oe_wp32_crisis.2.a: "拨款设立御前仲裁庭居中裁断官缺之争。"
 oe_wp32_crisis.2.b: "向元老院让渡礼仪尊衔以速破僵局。"
 oe_wp32_crisis.2.c: "破格任命独立大法官入阁整饬宫廷与元老院。"
 oe_wp32_crisis.2.d: "执掌御玺的宫廷秘书署官员骤然驳回元老院联名举荐的三处富庶行省总督人选，引爆京畿朝堂轩然大波。激怒的世家元老随即在核心行省暗中阻滞田赋稽核与司法终审，致使朝廷岁入锐减、官署积案如山。若皇帝不迅速以御前仲裁庭、礼仪尊衔妥协，或破格起用刚正独立大法官打破僵局，帝国中枢政令必将陷入寸步难行之境。"
 oe_wp32_crisis.2.t: "宫廷与元老院僵持不下"
 oe_wp32_crisis.3.a: "立即退还教区金库垫款以彰显皇室诚意。"
 oe_wp32_crisis.3.b: "严词重申非常时期皇权统筹军国之大义。"
 oe_wp32_crisis.3.c: "延请温和派资深教士出面斡旋政教和解。"
 oe_wp32_crisis.3.d: "不满朝廷于战时非常时期向各地修院粮仓与都会教产加征重税，诸位资深大主教齐聚圣索菲亚大教堂宏阔走廊，向御座递交措辞庄严的联名抗议书。他们严正警告，若世俗官署继续践踏古老教会法权，各地正教教区恐将暂停为皇室举行的公共祈祷礼，届时必将沉重动摇全境正教百姓对紫袍帝座的敬畏与顺服之心。"
 oe_wp32_crisis.3.t: "圣索菲亚圣主教会议抗议"
 oe_wp32_crisis.4.a: "火速押运白银军饷与补给赴边犒劳三军。"
 oe_wp32_crisis.4.b: "果断轮调边将职司以彰紫袍皇权不可轻慢。"
 oe_wp32_crisis.4.c: "召忠诚宿将入京授节，整顿边军赏罚纪律。"
 oe_wp32_crisis.4.d: "风尘仆仆的边疆信使日夜兼程入京，向大皇宫递呈一份由五位手握重兵的资深军区将军联署的直率奏折。诸将痛陈京畿党争与元老院无休止扯皮致使前线守军缺饷少马、伤亡补员断绝，文末更隐晦提及昔日军团将士举盾拥立新君之旧事，字里行间尽显拥兵逼宫的凛冽寒意，圣座稍有处置失当便恐酿成滔天兵变。"
 oe_wp32_crisis.4.t: "边防军区将军联名上书"
 oe_wp32_crisis.5.a: "四廷同心归于一统，帝国宪政永固！"
 oe_wp32_crisis.5.b: "借四廷协和之机整顿财赋、充盈帝国府库。"
 oe_wp32_crisis.5.d: "在君士坦丁堡金碧辉煌的大殿穹顶之下，宫廷秘书署、帝国元老院、常设圣主教会议与边防野战军四方代表齐聚御前，共同在崭新的宪政协约羊皮卷上加盖印信。历经数载剧烈内耗与严峻考验之后，复兴的罗马帝国终于彻底理顺四廷权责，政令畅通、府库丰盈、三军用命，重现马其顿黄金时代以来的盛世威仪与铁统气象。"
 oe_wp32_crisis.5.t: "四廷归一：帝国宪政新衡"
 oe_wp32_crisis.6.a: "罗马皇冠绝不容卖给乱兵，严词拒斥！"
 oe_wp32_crisis.6.b: "先拨部分银两暂缓锋芒，暗中筹谋反制。"
 oe_wp32_crisis.6.c: "密遣信使星夜出城，急召忠勇安纳托利亚军区勤王！"
 oe_wp32_crisis.6.d: "趁皇位更迭虚弱、朝局动荡之际，野心勃勃的瓦兰吉卫队与御前禁军将校公然紧闭青铜大门、重兵合围皇宫中庭。骄横乱兵敲击双刃战斧与镀金圆盾，狮子大开口索要足以掏空整个国库的登基巨额赏赐，甚至狂妄叫嚣效法古罗马禁卫军史上最黑暗的一页——将至高无上的罗马紫袍与皇位公然待价而沽，满城文武莫不骇然失色！"
 oe_wp32_crisis.6.t: "禁卫军哗变：紫袍待价而沽"
 oe_wp32_crisis.7.a: "暂拨定量国库银两稳住营中兵心以图后计。"
 oe_wp32_crisis.7.b: "当庭严词斥退乱将，决意借外镇兵马清君侧。"
 oe_wp32_crisis.7.c: "暗中拔擢忠贞禁军军官策反营中多数卫士。"
 oe_wp32_crisis.7.d: "一队披坚执锐的哗变禁军将校公然强行闯入神圣的黄金大厅，竟将沉重铁秤哐当掷于御座玉阶之前，骄横叫嚣若不立刻按营头称发足额白银，便继续重兵封锁皇宫诸门、截断朝廷发往各行省的一切诏令。满殿文武屏息凝神、冷汗涔涔，静待皇帝究竟是破财买时、当庭硬顶，还是暗中分化禁军营垒以擒贼擒王。"
 oe_wp32_crisis.7.t: "青铜门禁军将校勒索赏金"
 oe_wp32_crisis.8.a: "开城迎接真正忠于罗马的军区铁骑！"
 oe_wp32_crisis.8.b: "重赏勤王主将并授以中枢统兵重任。"
 oe_wp32_crisis.8.d: "宫廷禁军在京城跋扈逼宫、妄图拍卖紫袍的恶讯如野火般传遍安纳托利亚与色雷斯各大军区。破晓时分，长途奔袭、风尘仆仆的行省铁甲重骑与纪律严明的军区步兵已在雄伟的狄奥多西陆墙外列成森严大阵，高举效忠合法皇帝的帝国军旗，并遣信使经暗门急奏御前：三军将士枕戈待旦，愿随时入城肃清逆党、重整帝国纲纪！"
 oe_wp32_crisis.8.t: "忠勇军区兵马勤王入京"
 oe_wp32_crisis.9.a: "帝国成法永高于刀剑之上，京畿重安！"
 oe_wp32_crisis.9.b: "借立宪整编之机严加操练，重铸铁血禁军。"
 oe_wp32_crisis.9.d: "青铜门哗变首恶或已当众伏法、或遭流放远岛，余部禁军卫士尽数卸甲列队于元老院与普世牧首阶前，逐一按手神圣福音书立下永世效忠帝国成法与合法皇位的铁血宪章誓约。拍卖紫袍的百年噩梦至此彻底沦为历史尘埃，帝国禁卫军重归严明法度与忠义本色，再度成为守护君士坦丁堡与紫袍圣座的钢铁之盾。"
 oe_wp32_crisis.9.t: "禁卫军立宪归顺：乱局平定"
 oe_wp32_dec_anatolian_beacon_chain.a: "点燃横贯安纳托利亚的警戒烽火！"
 oe_wp32_dec_anatolian_beacon_chain.desc: "自奇里乞亚门塔尔苏斯起，经尼代、阿克萨赖、科尼亚、埃米尔达、屈塔希亚、尼西亚与尼科米底亚直抵君士坦丁堡，重建八座山峰同步联动的拜占庭光学烽火警戒链。"
 oe_wp32_dec_anatolian_beacon_chain.title: "敕建安纳托利亚光学烽火警戒链（弗里克托里亚）"
 oe_wp32_dec_charter_capital_projects.a: "诏令天下名匠汇聚君士坦丁堡！"
 oe_wp32_dec_charter_capital_projects.desc: "核准君士坦丁堡与色雷斯八大皇家奇观营造：狄奥多西三重陆墙、阿纳斯塔修斯长城、大皇宫、布拉赫奈宫、布科莱翁御港、青铜大门、地下水宫与大竞技场。"
 oe_wp32_dec_charter_capital_projects.title: "敕颁帝都宫殿与城防奇观营造诏"
 oe_wp32_dec_charter_capital_projects_tt: "解锁8座帝都与色雷斯奇观建筑营造资格。"
 oe_wp32_dec_charter_frontier_projects.a: "以坚城驿道铸就帝国铁壁！"
 oe_wp32_dec_charter_frontier_projects.desc: "核准行省大道与边关重镇奇观营造：埃格纳提亚大道、帝国军道、阿庇亚大道、奇里乞亚门、多瑙河边墙、尼西比斯、尼西亚、特拉比松与狄奥多西波利斯。"
 oe_wp32_dec_charter_frontier_projects.title: "敕颁罗马大道与边疆要塞奇观营造诏"
 oe_wp32_dec_charter_frontier_projects_tt: "解锁9座罗马大道与边疆要塞奇观建筑营造资格。"
 oe_wp32_dec_charter_mediterranean_projects.a: "重现罗马世界的传世奇观！"
 oe_wp32_dec_charter_mediterranean_projects.desc: "核准古典名城与使徒圣地奇观营造：罗马奥勒良城墙、雅典新柏拉图学园、克诺索斯宫、罗德岛灯塔、科林斯六英里长墙、阿索斯圣山、叙拉古、以弗所与耶路撒冷。"
 oe_wp32_dec_charter_mediterranean_projects.title: "敕颁地中海古典与使徒圣地奇观营造诏"
 oe_wp32_dec_charter_mediterranean_projects_tt: "解锁9座爱琴海、意大利与使徒圣地奇观建筑营造资格。"
 oe_wp32_dec_gregoras_chora_academy.a: "开启科拉皇家学院之门！"
 oe_wp32_dec_gregoras_chora_academy.desc: "资助位于君士坦丁堡科拉修道院的格雷戈拉斯天文观象台与人文书院，解锁科拉学院奇观建筑并择定其核心学科方向。"
 oe_wp32_dec_gregoras_chora_academy.title: "兴建格雷戈拉斯科拉皇家学院"
 oe_wp32_dec_host_hippodrome_games.a: "鸣号开赛，战车竞驰！"
 oe_wp32_dec_host_hippodrome_games.desc: "开启君士坦丁堡大竞技场，举行蓝党（维涅托伊）与绿党（普拉西诺伊）四轮战车竞逐盛典，借以宣示皇威、凝聚京畿民心。"
 oe_wp32_dec_host_hippodrome_games.title: "举办四年一度大竞技场战车盛典"
 oe_wp32_flavor.1.a: "全额赔付200金币并归还圣物，避免与罗马开战。"
 oe_wp32_flavor.1.b: "严词拒绝！圣马可雄狮绝不向皇帝低头！"
 oe_wp32_flavor.1.c: "遣使斡旋，以120金币折中赔款妥善了结旧账。"
 oe_wp32_flavor.1.d: "身着庄严绯红礼服的君士坦丁堡特使昂首步入威尼斯总督宫，在大议会满座元老惊愕的目光下缓缓展开盖有帝国朱漆皇印的巨幅羊皮清册。册中逐条详列1204年第四次十字军洗劫帝都时被掠走的青铜四马、无数圣物与黄金，严词责令泻湖共和国立刻作出全面赔付；否则复兴的罗马帝国便将师出有名，以战火与钢锋讨还百年血债。"
 oe_wp32_flavor.1.t: "罗马递交《1204年国耻追偿清册》"
 oe_wp32_flavor.2.a: "迟来两百年的公道终于伸张，重耀帝都荣光！"
 oe_wp32_flavor.2.b: "拨出部分赔款修缮劫后残殿，凝聚四海民心。"
 oe_wp32_flavor.2.d: "慑于复兴罗马帝国排山倒海般的赫赫威势，威尼斯共和国官船终于降旗致敬、缓缓驶入金角湾码头，卸下沉甸甸的铁箍杜卡特金币箱，并如数奉还1204年洗劫帝都时掠走的珍贵拜占庭圣像、圣匣与礼器。当神父捧着历劫归国的圣物沿御道庄严步入圣索菲亚大教堂时，夹道万民热泪盈眶，齐声欢呼迟来两百年的公道终于伸张！"
 oe_wp32_flavor.2.t: "威尼斯低头赔款：百年国耻得雪！"
 oe_wp32_flavor.3.a: "既然如此，便由帝国舰队亲赴亚得里亚海讨债！"
 oe_wp32_flavor.3.b: "拔擢精通亚得里亚海战事的名将筹备复仇远征。"
 oe_wp32_flavor.3.d: "威尼斯总督竟在大议会高台上傲慢驳回帝国朱漆《1204年国耻追偿清册》，更当众狂言泻湖共和国的威权只认战船与黄金，绝不向昔日帝都低头。消息传回君士坦丁堡，自大皇宫元老殿至金角湾造船厂无不群情激愤、战意沸腾：全帝国诸军区与德罗蒙舰队已尽获师出有名之讨债大义，只待扬帆亚得里亚海以铁血清算百年旧账！"
 oe_wp32_flavor.3.t: "威尼斯抗命拒赔：追偿大义已成"
 oe_wp32_flavor.4.a: "兴办天文观象、几何数理与实学格致。"
 oe_wp32_flavor.4.b: "弘敷古典希腊修辞、人文学术与罗马法典。"
 oe_wp32_flavor.4.c: "拨款并设理法双科并延聘鸿儒出任首席山长。"
 oe_wp32_flavor.4.d: "在科拉修道院流光溢彩的壁画与星辰穹顶之下，承袭尼基弗鲁斯·格雷戈拉斯与梅托希特斯学术薪火的帝国顶尖鸿儒齐聚一堂，联名呈上皇家学院创院章程草案。究竟应以天文观象、历算几何与实学格致立校，以古典希腊修辞与罗马法学为宗，抑或特聘博通理法之大儒出任首席山长兼兴双科，全凭圣座一言定鼎帝都百年学风。"
 oe_wp32_flavor.4.t: "科拉修道院的格雷戈拉斯学院"
 oe_wp32_flavor.5.a: "荣耀归于永恒的罗马帝国，万民同庆！"
 oe_wp32_flavor.5.b: "沿御道散银犒民，令京畿万户共沐皇恩。"
 oe_wp32_flavor.5.c: "于凯旋大典当众拔擢沙场功勋卓著的青年将领。"
 oe_wp32_flavor.5.d: "青翠月桂花环高悬于御道座座大理石柱之间，殷红玫瑰花瓣随风飘洒满地，百战凯旋的罗马军团高举双头鹰与金鹰军旗，自巍峨黄金门浩荡穿过君士坦丁广场与奥古斯都广场直抵圣索菲亚大教堂。缴获的敌军战旗在皇帝御前低垂伏地，帝国史官郑重挥毫，将又一处光复行省与赫赫战功铭刻于永恒罗马的凯旋金册之中。"
 oe_wp32_flavor.5.t: "凯旋万岁！君士坦丁堡御道凯旋盛典"
 oe_wp32_flavor.6.a: "亲阅铁甲重骑大阵并重赏全军演武功绩。"
 oe_wp32_flavor.6.b: "将富余军械配发舰队并将余材变现充实国库。"
 oe_wp32_flavor.6.c: "提拔勤勉有功的总督造官入参帝国军机。"
 oe_wp32_flavor.6.d: "帝国皇家军械库新政颁行八月之后，换装簇新油淬札甲与长矛的中央禁军重骑，连同配备青铜喷火管的舰队陆战精锐，在曼加纳巍峨城垣下列阵接受御前大检阅。寒光凛冽的甲胄在马尔马拉海晨曦下熠熠生辉，军械总管呈上完备库账禀报：全境官营锻坊与船坞皆已提前超额完成军备定额，帝国大军随时可以奔赴前线决胜千里。"
 oe_wp32_flavor.6.t: "皇家军械库与禁军大检阅"
 oe_wp32_flavor.7.a: "严格执行大审录裁决，巩固皇权控制与田赋入库。"
 oe_wp32_flavor.7.b: "赦免轻微陈欠以示皇恩宽仁、安定行省人心。"
 oe_wp32_flavor.7.c: "征召断案公正的首席巡回法官入值御前内阁。"
 oe_wp32_flavor.7.d: "跋涉各行省险峻山谷与沿海庄园的普罗诺亚地籍署巡回法官车马齐返君士坦丁堡，向御前呈上数十只封蜡铜匣与修订完备的田籍清册。此番大审录一举裁断了数百起军户、地方大贵族与修道院之间积压多年的田界、赋役与军功采邑纷争，为帝国中枢带来了巩固地方掌控、充实田赋国库并全面理顺军区兵源的难得契机。"
 oe_wp32_flavor.7.t: "普罗诺亚地籍署大审录"
 oe_wp32_flavor.8.a: "预签来春官粮长约，继续充实君士坦丁堡皇家官仓。"
 oe_wp32_flavor.8.b: "高价拍卖春季海峡运粮特许以大充国库。"
 oe_wp32_flavor.8.c: "延揽精明黑海商团执事出任帝国海贸顾问。"
 oe_wp32_flavor.8.d: "随着凛冽冬风暴雪逐渐封锁黑海北岸航季，帝国税关官吏与官粮商团执事齐聚金角湾交易所大堂，逐笔核对西托尼亚岁末账目。得益于朝廷此前果断推行的战舰护航与海峡关税方略，君士坦丁堡皇家官仓储备丰足无虞，就连精于算计的威尼斯与热那亚海贸经纪，此刻也纷纷携银竞逐来春穿越博斯普鲁斯海峡的运粮特许契约。"
 oe_wp32_flavor.8.t: "黑海官粮商团岁末决算"
 oe_wp32_flavor.9.a: "欣然受贺，借盛世之机进一步强化京畿与中枢治权。"
 oe_wp32_flavor.9.b: "将各界庆贺献礼妥善归库并惠及坊市民生。"
 oe_wp32_flavor.9.c: "拔擢众望所归的元老院名辩士入赞御前大政。"
 oe_wp32_flavor.9.d: "四方捷报频传、传世奇观相继落成与京畿政通人和的昌明盛景，令君士坦丁堡上下各阶层罕见地齐心欢庆。巍峨庄严的马格瑙拉大殿之内，身着白袍的世家元老、各业行会执事与资深教士联袂行礼致贺，盛赞当代君主以坚城巨构、严明成法与无畏的中兴魄力一扫数百年颓势，令新罗马与永恒帝国的威仪再度辉耀四海。"
 oe_wp32_flavor.9.t: "元老院与罗马万民盛世欢呼"
 oe_wp32_four_courts_crisis: "四廷危机（宫廷·元老院·教廷·边军）"
 oe_wp32_four_courts_crisis_desc: "当复兴后的罗马帝国疆域广袤无垠之际，宫廷官署、元老院、圣主教会议与边防野战军四大权力中枢因税权、任免与主导权爆发激烈内耗。须通过危机交互行动依次平息至少三廷纷争，并重振稳定度与正统度。"
 oe_wp32_gp.1.a: "从此任何强敌休想偷袭东方罗马！"
 oe_wp32_gp.1.b: "令八峰烽燧兼设商旅避风驿站以安行省。"
 oe_wp32_gp.1.c: "特任边防宿将统辖全线烽燧水钟密语。"
 oe_wp32_gp.1.d: "暮色四合之际，塔尔苏斯上方奇险的托罗斯山巅守望哨点起第一簇松脂烈焰；转瞬之间，火光依水钟密约接力跃过阿耳盖奥斯山、卡帕多细亚、以哥念、阿摩里翁、科提埃翁与尼西亚，直抵俯瞰马尔马拉海与大皇宫的圣奥克森提奥斯山巅。横贯八峰的弗里克托里亚光学烽火链重明夜空，万里边疆警讯一小时内便可直达天子御前！"
 oe_wp32_gp.1.t: "安纳托利亚光学烽火链启明！"
 oe_wp32_gp.2.a: "君士坦丁堡万世永存，光耀寰宇！"
 oe_wp32_gp.2.b: "借奇观竣工之势整饬京畿坊区与市政治安。"
 oe_wp32_gp.2.c: "嘉奖总营造大师并留任御前工部要职。"
 oe_wp32_gp.2.d: "伴随礼炮号角长鸣与圣索菲亚圣堂赞歌，帝国总营造大师稳稳安放最后一块鎏金大理石檐石，君士坦丁堡的皇家传世奇观工程圆满告竣。驻足仰望巍峨三重城垣、辉煌御殿柱廊与大理石皇港的四方使节与商贾无不叹服：新罗马已彻底洗净1204年的劫灰屈辱，再度以绝世雄姿傲视自巴黎、威尼斯直至开罗的天下名都。"
 oe_wp32_gp.2.t: "世界之都奇观竣工"
 oe_wp32_gp.3.a: "愿罗马学术与星辰数理光耀当世。"
 oe_wp32_gp.3.b: "延聘科拉学院博学鸿儒入宫参赞历法政务。"
 oe_wp32_gp.3.d: "精工打磨的黄铜星盘、青铜浑仪与新近校抄的鎏金希腊古卷已整齐陈列于落成的科拉皇家学院与观象台静谧石廊之中。来自意大利诸城邦、塞尔维亚与特拉比松的天算名家、历法考订者与人文法学家负笈纷至沓来，在璀璨流光的镶嵌壁画下切磋天体数理与古典哲思，令君士坦丁堡重新登上欧亚文明学术与科学之巅。"
 oe_wp32_gp.3.t: "科拉观象台星辉璀璨"
 oe_wp32_gp.4.a: "条条大道皆归罗马治世，边关永固。"
 oe_wp32_gp.4.b: "于新修官道与关隘征收定额路税充实国库。"
 oe_wp32_gp.4.d: "新铺的厚重玄武岩官道自塞萨洛尼基与菲利波波利斯一路绵延至亚得里亚海渡口，巍峨崭新的石砌棱堡则牢牢锁住奇里乞亚门、多瑙河下游渡口与上底格里斯群山险隘。帝国疾邮驿使昼夜飞驰无阻，辎重粮车安稳随军团纵横行省，四方往来商旅无不赞叹古罗马鬼斧神工般的工程伟力与秩序铁壁已再度重现人间。"
 oe_wp32_gp.4.t: "帝国大道与边关重镇落成"
 oe_wp32_gp.5.a: "先贤伟业于今重光，四海瞻仰！"
 oe_wp32_gp.5.b: "向沿线奇观海港颁赐通商特许以广招财源。"
 oe_wp32_gp.5.d: "自永恒之城罗马重修一新的奥勒良城垣与雅典卫城苍翠林荫下的新柏拉图学园，至克里特、罗德岛与叙拉古俯瞰沧海的宏伟海上要塞，洁白古典大理石柱与拜占庭工程伟力正向整片内海宣告罗马文明的辉煌重生。地中海四岸诸邦使节皆心悦诚服：罗马世界早已不再是典籍中的残梦，而是巍然屹立于当世的活生生帝国。"
 oe_wp32_gp.5.t: "地中海古典奇观重现人间"
 oe_wp32_gp.6.a: "屹立不倒吧，帝国东方磐石与圣殿！"
 oe_wp32_gp.6.b: "拔擢久经沙场的名将镇守东方要塞群。"
 oe_wp32_gp.6.d: "自尼西亚湖畔巍峨双城垣与以弗所繁忙的爱奥尼亚商港，至特拉比松悬崖内城、亚美尼亚高原狄奥多西波利斯耐寒坚堡与耶路撒冷重光穹顶的圣墓大殿，磐石要塞与使徒圣所已在帝国辽阔的东方地平线上连成壮阔屏藩。络绎不绝的朝圣客、丝路商队与边防精锐皆在双头鹰皇旗庇护下往来如织，东方基业至此固若金汤。"
 oe_wp32_gp.6.t: "东方坚城与圣地基业告成"
 oe_wp32_gp_anastasian_wall: "色雷斯阿纳斯塔修斯长城"
 oe_wp32_gp_anastasian_wall_desc: "重修自塞林布里亚马尔马拉海滨直抵黑海的阿纳斯塔修斯长城，为君士坦丁堡近郊粮仓与农庄构筑外围屏藩。"
 oe_wp32_gp_anastasian_wall_maint: "色雷斯阿纳斯塔修斯长城维护"
 oe_wp32_gp_apostolic_patriarchate: "耶路撒冷使徒圣墓大殿重修"
 oe_wp32_gp_apostolic_patriarchate_desc: "在帝国庇护下重修耶路撒冷圣墓圆顶大殿、朝圣者驿院与牧首教廷，圆满五牧首圣座复兴大业。"
 oe_wp32_gp_apostolic_patriarchate_maint: "耶路撒冷使徒圣墓大殿重修维护"
 oe_wp32_gp_armenian_kastron: "亚美尼亚高原狄奥多西波利斯要塞"
 oe_wp32_gp_armenian_kastron_desc: "于亚美尼亚高原修筑耐寒石堡、山地骑兵营与越冬粮库，拱卫安纳托利亚东部高地。"
 oe_wp32_gp_armenian_kastron_maint: "亚美尼亚高原狄奥多西波利斯要塞维护"
 oe_wp32_gp_athonite_lavra: "阿索斯圣山皇家大修院群"
 oe_wp32_gp_athonite_lavra_desc: "颁赐金玺诏书资助阿索斯圣山大拉夫拉修道院，修筑防海盗石塔与抄经院，庇护东正教精神圣地。"
 oe_wp32_gp_athonite_lavra_maint: "阿索斯圣山皇家大修院群维护"
 oe_wp32_gp_aurelian_walls: "罗马奥勒良城墙重修工程"
 oe_wp32_gp_aurelian_walls_desc: "重修全长十九公里的罗马奥勒良砖石城垣与诸座凯旋城门，护卫光复后的永恒之城。"
 oe_wp32_gp_aurelian_walls_maint: "罗马奥勒良城墙重修工程维护"
 oe_wp32_gp_basilica_cistern: "地下水宫与瓦伦斯高架引水渠"
 oe_wp32_gp_basilica_cistern_desc: "整修三百三十六柱地下水宫与瓦伦斯石拱水渠，保障百万帝都民生供水与长期围城时的生命线。"
 oe_wp32_gp_basilica_cistern_maint: "地下水宫与瓦伦斯高架引水渠维护"
 oe_wp32_gp_blachernae_palace: "布拉赫奈皇宫群扩建"
 oe_wp32_gp_blachernae_palace_desc: "扩建金角湾畔的科穆宁—巴列奥略要塞式皇宫区，增筑护墙露台、御前议事厅与皇家秘档库。"
 oe_wp32_gp_blachernae_palace_maint: "布拉赫奈皇宫群扩建维护"
 oe_wp32_gp_bucoleon_harbor: "布科莱翁宫与御用皇港"
 oe_wp32_gp_bucoleon_harbor_desc: "疏浚大皇宫海门下的大理石御港，既供帝国德罗蒙战舰泊靠整备，又为官粮船队提供避风码头。"
 oe_wp32_gp_bucoleon_harbor_maint: "布科莱翁宫与御用皇港维护"
 oe_wp32_gp_chalke_gate: "青铜大门与马格瑙拉大殿"
 oe_wp32_gp_chalke_gate_desc: "重铸大皇宫青铜正门并修缮毗邻的马格瑙拉大殿与近卫军营，彰显帝国外交仪典与禁军威慑。"
 oe_wp32_gp_chalke_gate_maint: "青铜大门与马格瑙拉大殿维护"
 oe_wp32_gp_chora_academy: "格雷戈拉斯科拉学院与天文观象台"
 oe_wp32_gp_chora_academy_desc: "以尼基弗鲁斯·格雷戈拉斯与梅托希特斯的学术薪火为基，于科拉修道院扩建天文观象台与皇家学院，融汇希腊几何、历法考订与罗马法学。"
 oe_wp32_gp_chora_academy_maint: "格雷戈拉斯科拉学院与天文观象台维护"
 oe_wp32_gp_cilician_gates: "奇里乞亚门关隘要塞"
 oe_wp32_gp_cilician_gates_desc: "扼守托罗斯山脉咽喉峡谷，修筑层叠石堡、税关与边防军户营寨，牢牢锁住安纳托利亚通往叙利亚的兵家必争之路。"
 oe_wp32_gp_cilician_gates_maint: "奇里乞亚门关隘要塞维护"
 oe_wp32_gp_colossus_rhodos: "罗德岛灯塔与青铜巨像纪念碑"
 oe_wp32_gp_colossus_rhodos_desc: "于罗德港双防波堤上兴建青铜灯塔巨像纪念碑，指引往来黎凡特与爱琴海的商舶与帝国战舰。"
 oe_wp32_gp_colossus_rhodos_maint: "罗德岛灯塔与青铜巨像纪念碑维护"
 oe_wp32_gp_danubian_limes: "多瑙河边墙（利梅斯）江防要塞"
 oe_wp32_gp_danubian_limes_desc: "于多瑙河下游渡口重筑石砌江防要塞与巡河战艇船坞，稳固帝国巴尔干北疆防线。"
 oe_wp32_gp_danubian_limes_maint: "多瑙河边墙（利梅斯）江防要塞维护"
 oe_wp32_gp_ephesus_basilica: "圣约翰大教堂与爱奥尼亚商港"
 oe_wp32_gp_ephesus_basilica_desc: "重修爱奥尼亚海岸朝圣大教堂与爱琴海税关码头，重振小亚细亚西部丝绸与海贸商路。"
 oe_wp32_gp_ephesus_basilica_maint: "圣约翰大教堂与爱奥尼亚商港维护"
 oe_wp32_gp_great_palace: "君士坦丁堡大皇宫与黄金大厅重光"
 oe_wp32_gp_great_palace_desc: "重修俯瞰马尔马拉海的八角黄金大厅、马赛克柱廊与御前文书殿，再现罗马皇权礼仪与中枢威仪。"
 oe_wp32_gp_great_palace_maint: "君士坦丁堡大皇宫与黄金大厅重光维护"
 oe_wp32_gp_hexamilion_isthmus: "科林斯地峡六英里长墙（赫克萨米利翁）"
 oe_wp32_gp_hexamilion_isthmus_desc: "重筑横亘科林斯地峡的六英里防线长墙并增设炮台与巡海哨站，屏护摩里亚半岛腹心。"
 oe_wp32_gp_hexamilion_isthmus_maint: "科林斯地峡六英里长墙（赫克萨米利翁）维护"
 oe_wp32_gp_hippodrome_kathisma: "大竞技场与皇帝观礼台重修"
 oe_wp32_gp_hippodrome_kathisma_desc: "修缮大竞技场看台、中脊纪念柱与皇帝观礼台，复兴罗马帝都万民欢呼与四轮战车竞逐盛典。"
 oe_wp32_gp_hippodrome_kathisma_maint: "大竞技场与皇帝观礼台重修维护"
 oe_wp32_gp_knossos_palace: "克诺索斯古宫遗址与克里特海军署"
 oe_wp32_gp_knossos_palace_desc: "修护克里特克诺索斯王宫遗迹并于甘地亚扩建帝国海军署，使克里特岛成为镇守东地中海的海上巨舰。"
 oe_wp32_gp_knossos_palace_maint: "克诺索斯古宫遗址与克里特海军署维护"
 oe_wp32_gp_neoplatonic_academy: "雅典新柏拉图学园复兴"
 oe_wp32_gp_neoplatonic_academy_desc: "于雅典卫城之下重兴皇家哲学院，讲授古典数理、修辞与希腊人文学术，点亮爱琴海学术明灯。"
 oe_wp32_gp_neoplatonic_academy_maint: "雅典新柏拉图学园复兴维护"
 oe_wp32_gp_nicaean_citadel: "尼西亚湖畔双城垣与公会议堂"
 oe_wp32_gp_nicaean_citadel_desc: "加固尼西亚阿斯卡尼亚湖畔双城垣与大公会议圣堂，铭记流亡时期光复帝国的中兴根基。"
 oe_wp32_gp_nicaean_citadel_maint: "尼西亚湖畔双城垣与公会议堂维护"
 oe_wp32_gp_nisibis_bastion: "尼西比斯东方铁壁要塞"
 oe_wp32_gp_nisibis_bastion_desc: "重筑历史上屡挡波斯大军的尼西比斯边关重镇，以玄武岩双城垣守卫上底格里斯河门户。"
 oe_wp32_gp_nisibis_bastion_maint: "尼西比斯东方铁壁要塞维护"
 oe_wp32_gp_phryktoria_beacon: "安纳托利亚光学烽火台（弗里克托里亚）"
 oe_wp32_gp_phryktoria_beacon_desc: "横贯安纳托利亚八座险峰的光学烽火传信链节点，自奇里乞亚边关直通君士坦丁堡大皇宫，一小时内即可将敌军犯境警讯传遍帝都。"
 oe_wp32_gp_phryktoria_beacon_maint: "安纳托利亚光学烽火台（弗里克托里亚）维护"
 oe_wp32_gp_sicilian_theme_citadel: "叙拉古与西西里军区海防堡垒"
 oe_wp32_gp_sicilian_theme_citadel_desc: "将叙拉古奥提伽岛建为装甲海军船坞与要塞，扼控中地中海航道并护卫西西里粮仓。"
 oe_wp32_gp_sicilian_theme_citadel_maint: "叙拉古与西西里军区海防堡垒维护"
 oe_wp32_gp_theodosian_walls: "狄奥多西三重陆墙重修工程"
 oe_wp32_gp_theodosian_walls_desc: "以精凿条石拱券与火炮平台重修狄奥多西三重陆墙的护城壕、外郭与九十六座多角箭楼，使帝都陆防固若金汤。"
 oe_wp32_gp_theodosian_walls_maint: "狄奥多西三重陆墙重修工程维护"
 oe_wp32_gp_trebizond_citadel: "特拉比松本都城堡与金顶圣母教堂"
 oe_wp32_gp_trebizond_citadel_desc: "扩建特拉比松悬崖内城与黑海丝路商栈，贯通帝国连接高加索与波斯的商贸门户。"
 oe_wp32_gp_trebizond_citadel_maint: "特拉比松本都城堡与金顶圣母教堂维护"
 oe_wp32_gp_via_appia: "阿庇亚大道重修与布林迪西海驿"
 oe_wp32_gp_via_appia_desc: "重修布伦迪西乌姆古玄武岩官道与双石柱终点海驿，将来自希腊的跨海航线与罗马古都重新连为一体。"
 oe_wp32_gp_via_appia_maint: "阿庇亚大道重修与布林迪西海驿维护"
 oe_wp32_gp_via_egnatia: "埃格纳提亚大道里程碑与总驿站"
 oe_wp32_gp_via_egnatia_desc: "于塞萨洛尼基重建埃格纳提亚大道总驿站与石砌里程碑，贯通亚得里亚海港口迪拉基乌姆直抵帝都的商旅军道。"
 oe_wp32_gp_via_egnatia_maint: "埃格纳提亚大道里程碑与总驿站维护"
 oe_wp32_gp_via_militaris: "帝国军道（米利塔里斯大道）枢纽堡垒"
 oe_wp32_gp_via_militaris_desc: "于菲利波波利斯重修贯通巴尔干腹地的帝国军道驿堡、马驿与粮秣库，保障通往塞尔迪卡与多瑙河前线的快速增援。"
 oe_wp32_gp_via_militaris_maint: "帝国军道（米利塔里斯大道）枢纽堡垒维护"
 oe_wp32_guard_auction_crisis: "禁卫军拍卖紫袍危机"
 oe_wp32_guard_auction_crisis_desc: "趁皇权正统虚弱或摄政当国之际，瓦兰吉卫队与御前禁军将校公然索要天价登基赏金，甚至扬言效法古制拍卖紫袍。须借肃清叛将、控额议赏或立宪宣誓彻底折服禁军。"
 oe_wp32_hippodrome.1.a: "挥动御帕为贵族拥戴的蓝党（维涅托伊）助威！"
 oe_wp32_hippodrome.1.b: "挥动御帕为商民拥戴的绿党（普拉西诺伊）助威！"
 oe_wp32_hippodrome.1.c: "保持中立威仪，以万民共主之姿主持盛会。"
 oe_wp32_hippodrome.1.d: "六万京畿市民涌满阳光灿烂的大竞技场大理石看台，五彩丝绸长幡在古埃及方尖碑与德尔斐青铜蛇柱上空迎风猎猎。在庄严高耸的皇帝观礼台下方，贵族拥戴的蓝党（维涅托伊）与工匠商民拥戴的绿党（普拉西诺伊）齐齐仰首屏息，静待圣上亲手掷下白色御帕开启赛程，更揣测哪一派的四马战车将赢得天子垂青。"
 oe_wp32_hippodrome.1.t: "君士坦丁堡大竞技场战车盛典"
 oe_wp32_hippodrome.2.a: "将胜利金棕榈颁予夺魁蓝党以嘉奖神勇！"
 oe_wp32_hippodrome.2.b: "趁蓝党盛赞之势在元老院凝聚朝野向心力。"
 oe_wp32_hippodrome.2.c: "拔擢颇具声望的蓝党贵族资助人入朝效力。"
 oe_wp32_hippodrome.2.d: "在最为险峻的西端青铜拐柱弯道上，蓝党四马战车轮轴迸火、惊险切入内道贴石疾驰，于决定胜负的第七圈绝尘冲过白灰终点线夺魁！贵族包厢顿时爆发出震耳欲聋的欢呼声浪，京城各大世家府邸竞相开启陈酿举杯庆贺，冠军御手拾级登上大理石御阶，亲手自皇帝观礼台领受银质月桂冠与满场无上殊荣。"
 oe_wp32_hippodrome.2.t: "蓝党战车夺魁"
 oe_wp32_hippodrome.3.a: "共庆君士坦丁堡商民百业兴旺、税源丰厚！"
 oe_wp32_hippodrome.3.b: "顺势安抚坊市舆情，将欢腾化作长久安定。"
 oe_wp32_hippodrome.3.c: "延揽精明干练的绿党行会领袖协理京畿商政。"
 oe_wp32_hippodrome.3.d: "在东侧看台数万丝绸织工、金角湾船坞匠人与集市行会震耳欲聋的助威呐喊声中，绿党战车于最后一条直道挥鞭催马、奋蹄反超，率先撞线夺得桂冠。日落时分，御道两侧工坊商铺处处悬灯结彩，市民与商贾举杯遥祝皇帝万寿无疆，盛典热潮带动全城丝幡、美酒、马具与百业集市骤然兴旺，税关与行会库房皆喜获丰收。"
 oe_wp32_hippodrome.3.t: "绿党战车夺魁"
 oe_wp32_hippodrome.4.a: "散财平粜并遣公正法官居中宣谕安抚坊众。"
 oe_wp32_hippodrome.4.b: "即刻派遣京畿禁军铁腕驱散聚众闹事者。"
 oe_wp32_hippodrome.4.c: "皇帝亲临高台训谕两党领袖，以威望止息群斗。"
 oe_wp32_hippodrome.4.d: "青铜拐柱旁一次突如其来的惨烈轮轴绞撞令大热门战车失控狠狠撞向大理石护栏，瞬间点燃看台上蓝绿两党狂热拥趸积郁已久的怒火，谩骂与石块漫天横飞。顷刻间失控殴斗便涌出竞技场拱门直逼奥古斯都广场柱廊，昔日查士丁尼时代“尼卡大暴动”焚毁半城之惨痛记忆令满朝元老不寒而栗，皇帝必须立刻决断平乱方略。"
 oe_wp32_hippodrome.4.t: "尼卡余波：竞技场派系骚乱"
 oe_wp32_hippodrome.5.a: "愿新罗马的盛世欢呼长久回荡于天地！"
 oe_wp32_hippodrome.5.b: "于御道沿线特许盛典商棚，大收坊市财利。"
 oe_wp32_hippodrome.5.d: "本届四年一度的帝国战车盛典全程井然有序、未生丝毫党争风波，扣人心弦的御车角逐令蓝绿两党市民齐声喝彩、彼此致意。落幕之际，六万观赛百姓在迎风飘扬的紫金锦旗下同时起立，以庄严古老的希腊语齐颂皇帝圣寿无疆；远道而来的各国使节与巨贾无不深深震撼于新罗马的富庶、祥和与无可匹敌的帝国盛世气象。"
 oe_wp32_hippodrome.5.t: "金御手传奇与帝都盛世"
 oe_wp32_imperial_church_io: "帝国东正教会与五大都会圣座"
 oe_wp32_imperial_church_io_desc: "维系罗马皇帝与普世牧首政教协和的国内正教机构，统辖君士坦丁堡、塞萨洛尼基、尼西亚、特拉比松及复兴中的安条克与亚历山大里亚五大都会教区。"
 oe_wp32_imperial_church_io_list_who_tt: "$WHO$ 与 $LIST$ 共融于帝国东正教会。"
 oe_wp32_io.1.a: "优先为中央铁甲圣骑兵锻造精良札甲与长矛。"
 oe_wp32_io.1.b: "优先为帝国舰队配装青铜喷火管与希腊火。"
 oe_wp32_io.1.c: "特任总兵械官并扩建各行省官营兵工厂。"
 oe_wp32_io.1.d: "来自色雷斯与安纳托利亚各地的铁匠大师、制弓名匠与青铜喷火管技师齐聚俯瞰博斯普鲁斯海峡的曼加纳拱券武库，正式重开“帝国皇家军械库（阿玛门通）”。皇室锻炉再度炉火熊熊，诸将与工官齐聚御前争论有限精钢与名匠究竟该优先锻造圣骑兵札甲、为战舰配发希腊火，抑或兴办常设官营兵工厂。"
 oe_wp32_io.1.t: "帝国皇家军械库开署"
 oe_wp32_io.2.a: "扩建各军区官营兵工厂以推广新式淬火工艺。"
 oe_wp32_io.2.b: "特许外销余量民用铁器以充帝国国库。"
 oe_wp32_io.2.c: "破格拔擢首席兵械名匠入掌军备整训。"
 oe_wp32_io.2.d: "金角湾畔炉火通明的皇家军械库锻坊内，资深行会名匠终于试制出轻韧兼备的油淬札甲钢片与沥青密封希腊火陶罐——前者足以抵御重弩近距穿射而不累战马长途疾驰，后者即便在湿冷海风与惊涛骇浪中亦能瞬间引燃。四方客商与外国密探早已闻风惊叹，朝廷如何推广这项兵工奇技，将深刻左右帝国陆海战力与京畿工坊的百年兴衰。"
 oe_wp32_io.2.t: "金角湾名匠献艺"
 oe_wp32_io.3.a: "立即遣差推行严苛的帝国地籍清丈（阿波格拉菲）。"
 oe_wp32_io.3.b: "以温和平衡之策稳固贵族军役与采邑秩序。"
 oe_wp32_io.3.c: "任命清廉资深地籍官入主册府并督查塞萨洛尼基。"
 oe_wp32_io.3.d: "普罗诺亚地籍署（帕拉克提卡册府）高阔大堂内，数十名帝国书吏伏案清核数月，终于将现存各军区的军功采邑、修院免税特许与乡里佃农户口尽数编入崭新羊皮正册。地方大贵族与封邑领主皆在庄园中屏息观望，静看皇帝究竟是遣派钦差严核每一寸田产与实效军役，采取温和平衡之策维系贵族效忠，抑或任命清廉总勘丈官入主册府。"
 oe_wp32_io.3.t: "普罗诺亚地籍署启印"
 oe_wp32_io.4.a: "维护帝国财权，照章追缴多年隐匿欠税。"
 oe_wp32_io.4.b: "将争议田产归还修道院依教会法自治。"
 oe_wp32_io.4.c: "延聘博学教会法学家入朝明定采邑与教产边界。"
 oe_wp32_io.4.d: "钦差清丈官巡查边疆行省地籍册籍之际，数家根深蒂固的边区豪强竟公然闯入审理大堂，挥舞前朝字迹斑驳的泛黄金玺诏书，坚称自己对肥沃河谷及数座世俗托管修道院村落拥有永世免税特权。这笔丰厚田赋本应归属帝国府库或被豪强侵吞的正统修院，究竟是严追欠税、归还教产，还是延请教会法学家明定边界，正牵动边疆朝野人心。"
 oe_wp32_io.4.t: "边疆采邑册籍之争"
 oe_wp32_io.5.a: "召集常设圣主教会议以固京畿与全境安宁。"
 oe_wp32_io.5.b: "拨款捐助五大都会大教堂与正教宣教学堂。"
 oe_wp32_io.5.c: "延请德高望重的大主教入宫襄赞政教礼法。"
 oe_wp32_io.5.d: "在圣索菲亚大教堂璀璨辉煌的黄金镶嵌穹顶之下，乳香袅袅升腾，普世牧首、五大都会大主教与帝国文武重臣肃立一堂，共同重申查士丁尼时代确立的政教协和神圣宪章（辛福尼亚）。自君士坦丁堡、塞萨洛尼基至尼西亚、特拉比松与东方古老使徒教区，帝国东正教会正准备以正信、礼乐与慈善重铸全体罗马臣民不屈的精神脊梁。"
 oe_wp32_io.5.t: "紫袍与圣座之协和"
 oe_wp32_io.6.a: "荣归至高天主！帝国五大圣座重归圆满。"
 oe_wp32_io.6.b: "御赐尼西亚至特拉比松诸都会教区常产以永志盛事。"
 oe_wp32_io.6.c: "尊奉东方大主教入席御前议政以彰五座一体。"
 oe_wp32_io.6.d: "自金角湾越过碧波万顷的爱琴海与安纳托利亚高原直抵黎凡特海岸，座座宏伟教堂的青铜钟声连绵齐鸣、响彻云霄。代表君士坦丁堡、塞萨洛尼基、尼西亚、特拉比松及重回帝国庇护的东方使徒圣座的大主教们并肩肃立于帝国紫袍之下，向整个基督教世界庄严宣告：新罗马统辖的五大都会教区历经数百年沧桑，今日终告圆满重光！"
 oe_wp32_io.6.t: "五大都会圣座重光大典"
 oe_wp32_law_armamenton_standard: "帝国兵器制式法令"
 oe_wp32_law_armamenton_standard_desc: "决定皇家军械库如何在陆军甲胄锻坊与海军战舰船坞之间调配矿铁与名匠。"
 oe_wp32_law_charistikion_reform: "修道院托管制法令"
 oe_wp32_law_charistikion_reform_desc: "规范世俗贵族对修道院地产的托管经营与教会税产审核。"
 oe_wp32_law_church_symphonia: "帝国政教协和宪章"
 oe_wp32_law_church_symphonia_desc: "权衡罗马皇帝的世俗治权与普世牧首的教会自治权。"
 oe_wp32_law_greek_fire_monopoly: "希腊火国家专营保密令"
 oe_wp32_law_greek_fire_monopoly_desc: "规范帝国最高机密武器希腊火的提炼、封存与战场配发权限。"
 oe_wp32_law_metropolitan_dioceses: "五大都会教区牧养法令"
 oe_wp32_law_metropolitan_dioceses_desc: "统筹君士坦丁堡、塞萨洛尼基、尼西亚、特拉比松及东方使徒教区的教务重心。"
 oe_wp32_law_pronoia_tenure: "普罗诺亚采邑权属法令"
 oe_wp32_law_pronoia_tenure_desc: "明确军功采邑系终生可收回俸地、世袭家产，抑或边防军户共有耕地。"
