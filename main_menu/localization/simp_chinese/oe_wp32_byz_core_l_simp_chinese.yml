 oe_wp32_mod_sit_bread_dole: "帝都皇家官粮赈济（安诺纳）"
 oe_wp32_mod_sit_grain_convoys: "黑海官粮船队护航体系"
 oe_wp32_mod_sit_granary_buffer: "君士坦丁堡皇家官仓常平储备"
 oe_wp32_mod_sit_pontic_dominion: "黑海粮道霸主"
 oe_wp32_mod_sit_straits_tariff: "博斯普鲁斯海峡谷物关税令"
 oe_wp32_mod_venice_restitution: "1204年第四次十字军赔款雪耻"
 oe_wp32_pnr_akribeia: "地籍精确度（阿克里贝亚）"
 oe_wp32_pnr_akribeia_desc: "反映帝国钦差地籍官清丈各行省田产册籍、赋税名录与军役义务的严密程度。"
 oe_wp32_pnr_gonikotes: "采邑世袭化程度（戈尼科特斯）"
 oe_wp32_pnr_gonikotes_desc: "衡量原本限期效命的军功采邑演变为贵族世袭家产的渗透程度。"
 oe_wp32_pol_amt_cataphract_forges: "铁甲圣骑兵札甲锻坊"
 oe_wp32_pol_amt_cataphract_forges_desc: "集中皇室铁匠为重装铁甲骑兵打造精良札甲、马铠与长矛。"
 oe_wp32_pol_amt_customary: "惯例军区兵库"
 oe_wp32_pol_amt_customary_desc: "沿袭各地军区自备武库的传统形制，保持低廉的平素军费开销。"
 oe_wp32_pol_amt_dromon_arsenals: "帝国德罗蒙战舰船坞"
 oe_wp32_pol_amt_dromon_arsenals_desc: "重点扶持帝国战舰船坞与水手补给，强化地中海与黑海舰队战力。"
 oe_wp32_pol_char_canonical: "教会法典归还教产"
 oe_wp32_pol_char_canonical_desc: "依教会法将遭侵占之修道院地产归还院长自治，增进教士忠心与文化识字。"
 oe_wp32_pol_char_crown_audit: "皇室地籍官严核"
 oe_wp32_pol_char_crown_audit_desc: "派遣皇室地籍官严核修道院租佃账簿，追回隐匿赋税并提升行政控制。"
 oe_wp32_pol_char_customary: "惯例托管旧章"
 oe_wp32_pol_char_customary_desc: "沿循旧例维持修道院地产托管格局，保障地方农耕平稳延续。"
 oe_wp32_pol_chr_balanced: "查士丁尼式政教和谐"
 oe_wp32_pol_chr_balanced_desc: "谨守查士丁尼《新律》精神，教权与皇权彼此尊重、共保国本稳定。"
 oe_wp32_pol_chr_diocese_charities: "慈善济贫与教会医院网"
 oe_wp32_pol_chr_diocese_charities_desc: "于五大都会教区广设教会医院与济贫驿院，惠泽乡民并提升行省繁荣。"
 oe_wp32_pol_chr_diocese_missions: "使徒宣教与正教化"
 oe_wp32_pol_chr_diocese_missions_desc: "遣派五大教区教士奔赴光复边疆宣讲正教，加快宗教归化与文化影响。"
 oe_wp32_pol_chr_diocese_tithe: "护教军饷特别什一捐"
 oe_wp32_pol_chr_diocese_tithe_desc: "向五大教区金库征收护教特别捐输，充实帝国国库以筑防御敌。"
 oe_wp32_pol_chr_imperial_oversight: "皇室御前督理教务"
 oe_wp32_pol_chr_imperial_oversight_desc: "强化御前官署对教会司法与教产赋税的统筹督查，提升内阁行政效能。"
 oe_wp32_pol_chr_synodal_autonomy: "圣主教会议教权自治"
 oe_wp32_pol_chr_synodal_autonomy_desc: "保障常设圣主教会议的自主任命权，激发五大教区传教热忱与宗教影响。"
 oe_wp32_pol_gf_naval_issue: "舰队铜管喷火配发"
 oe_wp32_pol_gf_naval_issue_desc: "为帝国战舰舰艏普遍装配高压青铜喷火管，以火攻主宰海战。"
 oe_wp32_pol_gf_palace_vault: "大皇宫秘库严封"
 oe_wp32_pol_gf_palace_vault_desc: "将希腊火严密封存于皇宫秘库，优先保障帝都与核心要塞防务。"
 oe_wp32_pol_gf_siege_batteries: "攻城火器与手掷陶罐营"
 oe_wp32_pol_gf_siege_batteries_desc: "向攻城部队与炮兵营配发希腊火陶罐与喷火器械，加快破城拔寨。"
 oe_wp32_pol_pnr_collective: "边防军户共有农庄"
 oe_wp32_pol_pnr_collective_desc: "将登记田产集体授予边防军户与自耕农社，强化守备兵力与乡民征召。"
 oe_wp32_pol_pnr_conditional: "效命期限条件授地"
 oe_wp32_pol_pnr_conditional_desc: "采邑须以实效军役为前提，身故或失职即归还皇室，维护中央掌控与兵源。"
 oe_wp32_pol_pnr_hereditary: "世袭家产法（戈尼孔）"
 oe_wp32_pol_pnr_hereditary_desc: "承认效忠贵族之采邑世袭权，扩充贵族征召兵力并安抚大族。"
 oe_wp32_priv_dynatoi_angeloi: "安格洛斯家族御前仪典尊衔"
 oe_wp32_priv_dynatoi_angeloi_desc: "赐予安格洛斯大族尊崇的塞巴斯托克拉托御前尊衔与宫廷仪典主位，提升帝国威望与正统度，但亦增重宫廷派系平衡之成本。"
 oe_wp32_priv_dynatoi_doukai: "杜卡斯家族度支文官特权"
 oe_wp32_priv_dynatoi_doukai_desc: "委任素以文治法学著称的杜卡斯家族执掌中央度支与司法要职，提升内阁行政与赋税征缴效率，但须让渡部分贵族税率上限。"
 oe_wp32_priv_dynatoi_kantakouzenoi: "坎塔库泽诺斯色雷斯大庄园特许"
 oe_wp32_priv_dynatoi_kantakouzenoi_desc: "特许保护坎塔库泽诺斯家族在色雷斯的广袤粮田与牧场，充实帝国粮产与原料产出，却令城市商人阶层颇感失衡。"
 oe_wp32_priv_dynatoi_komnenoi: "科穆宁家族尚武封赏"
 oe_wp32_priv_dynatoi_komnenoi_desc: "授予科穆宁大族世袭军职与安纳托利亚牧马庄园，显著提升圣骑兵战力与陆军传统，但亦助长地方豪强势力与分权倾向。"
 oe_wp32_priv_dynatoi_palaiologoi: "巴列奥略家族外交联姻网"
 oe_wp32_priv_dynatoi_palaiologoi_desc: "依托巴列奥略皇族遍及欧亚的联姻网络与人文使节团，显著增进帝国声望、外交威望与文化影响力，但宫廷礼宾开销相应增加。"
 oe_wp32_priv_dynatoi_phokades: "福卡斯家族边防军区世职"
 oe_wp32_priv_dynatoi_phokades_desc: "敕封卡帕多细亚武勋世家福卡斯氏世守边关险隘，强化全国要塞防御与贵族征召兵源，但边区农牧民劳役负担随之加重。"
 oe_wp32_pronoia_registry_io: "普罗诺亚地籍署（帕拉克提卡册府）"
 oe_wp32_pronoia_registry_io_desc: "负责清丈军功采邑地籍、整顿修道院托管制并平衡皇产与大贵族土地权属的帝国地籍中枢。"
 oe_wp32_pronoia_registry_io_list_who_tt: "$WHO$ 与 $LIST$ 同属普罗诺亚地籍署。"
 oe_wp32_sit.1.a: "派遣舰队护航皇家官粮船队直入金角湾。"
 oe_wp32_sit.1.b: "对过境意大利商船严征海峡科梅基翁关税。"
 oe_wp32_sit.1.c: "拔擢精明商政官出任西托尼亚官粮总管。"
 oe_wp32_sit.1.d: "满载克里米亚、多瑙河下游与色雷斯金黄小麦的高桅运粮巨舶密密麻麻挤满狭长的博斯普鲁斯海峡航道，罗马双头鹰旗与威尼斯、热那亚商邦彩旗在劲烈海风中猎猎对峙。君士坦丁堡究竟是以帝国舰队护航官粮、向拉丁商船严征科梅基翁重税，还是破格拔擢干练粮政总管统筹官仓，将直接决定帝都民生面包价格与黑海博弈的最终胜负。"
 oe_wp32_sit.1.t: "黑海官粮商道启幕"
 oe_wp32_sit.2.a: "将丰年余粮悉数入库君士坦丁堡皇家官仓。"
 oe_wp32_sit.2.b: "特许出口部分余粮换取地中海真金白银。"
 oe_wp32_sit.2.c: "半数入仓备荒、半数平粜并扩建帝都粮栈。"
 oe_wp32_sit.2.d: "今春黑海北岸草原、多瑙河三角洲与色雷斯连绵沃野风调雨顺，迎来了数十年难遇的小麦大丰收。一队队吃水深重的运粮平底驳船正沿曼加纳码头绵延排开等候卸货。国库度支官眼馋地中海居高不下的转口粮价，主张放行外销以换取真金白银；京畿行政官则力主趁丰年将皇家官仓彻底填满，以备未来荒年与大战围城之急需。"
 oe_wp32_sit.2.t: "黑海沃野喜获丰收"
 oe_wp32_sit.3.a: "君士坦丁堡永无饥馑之虞，万邦来朝！"
 oe_wp32_sit.3.b: "借黑海粮道霸权广纳海峡商税充实国库。"
 oe_wp32_sit.3.d: "君士坦丁堡每一座地下拱顶粮窖与临海皇家官仓皆已盈满干爽金黄的黑海新麦，御道沿线面包坊货足价稳、万民安居乐业；昔日不可一世的热那亚与威尼斯商馆执事，如今亦须在帝国税关门前脱帽恭候博斯普鲁斯海峡通行印信。世界之都历经沧桑之后，终于再度将东地中海的粮食命脉与海峡商道霸权牢牢握回帝国掌中。"
 oe_wp32_sit.3.t: "黑海粮道霸业功成"
 oe_wp32_sit.4.a: "将海峡官粮册籍妥善归档，永志后世。"
 oe_wp32_sit.4.d: "随着地中海诸省辽阔农庄渐次复元、远洋大西洋与黎凡特新兴商道彻底重塑天下谷物格局，持续百余年、围绕博斯普鲁斯海峡运粮船队展开的西托尼亚官粮博弈终于缓缓步入历史尾声。御前文书殿的资深总管亲手将最后一册皮革装订的海峡粮运清册归档封存，为新罗马惊心动魄的粮道保卫战与海峡博弈画上庄重圆满的句号。"
 oe_wp32_sit.4.t: "西托尼亚官粮博弈落幕"
 oe_wp32_sit_black_sea_tariff: "征收海峡谷物关税"
 oe_wp32_sit_black_sea_tariff_desc: "对往来海峡的一切外国运粮商舶严格征收皇家科梅基翁关税，充实国库。"
 oe_wp32_sit_black_sea_tariff_tt: "立得110金币并强化商路护卫，但令威尼斯与热那亚交恶并抬升航运摩擦。"
 oe_wp32_sit_emergency_bread_dole: "紧急官粮赈济（安诺纳）"
 oe_wp32_sit_emergency_bread_dole_desc: "开启皇家粮仓向君士坦丁堡坊民平价配发官粮面包，迅速安定民心。"
 oe_wp32_sit_emergency_bread_dole_tt: "消耗20点皇家粮仓储备，换取6点稳定度、4点正统度与帝都繁荣度提升。"
 oe_wp32_sit_grain_convoys: "黑海运粮船队护航"
 oe_wp32_sit_grain_convoys_desc: "派遣战舰护送克里米亚与本都运粮船队穿越博斯普鲁斯海峡驶入金角湾。"
 oe_wp32_sit_grain_convoys_tt: "使君士坦丁堡皇家粮仓储备增加18，并提升全国粮食产出与海贸效率。"
 oe_wp32_sit_granary: "君士坦丁堡皇家粮仓储备"
 oe_wp32_sit_granary_reserve: "充实帝都皇家粮仓"
 oe_wp32_sit_granary_reserve_desc: "趁丰年平价收储谷物充实君士坦丁堡皇家官仓，未雨绸缪以防荒歉。"
 oe_wp32_sit_granary_reserve_tt: "使君士坦丁堡皇家粮仓储备增加22，并缓和黑海航运摩擦6点。"
 oe_wp32_sit_legend_empire: "罗马帝国领土"
 oe_wp32_sit_legend_latins: "意大利运粮商邦"
 oe_wp32_sit_map_empire_tt: "帝国海峡官粮管辖区"
 oe_wp32_sit_map_latin_tt: "拉丁海贸谷物采购商邦"
 oe_wp32_sit_need_granary_25_tt: "君士坦丁堡皇家粮仓储备至少达到25。"
 oe_wp32_sit_outcome_closes: "海峡谷物垄断时代落幕"
 oe_wp32_sit_outcome_closes_desc: "随着地中海商路格局演进或帝都易手，黑海官粮博弈局势告一段落。"
 oe_wp32_sit_outcome_closes_tt: "年份达到1460年，或君士坦丁堡不再由罗马帝国掌控。"
 oe_wp32_sit_outcome_dominion: "黑海粮道完全掌控"
 oe_wp32_sit_outcome_dominion_desc: "君士坦丁堡皇家官仓充盈满库，海峡谷物航运尽归罗马掌控。"
 oe_wp32_sit_outcome_dominion_tt: "拜占庭稳守君士坦丁堡、稳定度不低于20，且皇家粮仓储备达到80或以上。"
 oe_wp32_sit_tension: "黑海航运关税摩擦"
 oe_wp32_sitonia_situation: "黑海官粮商道（西托尼亚）"
 oe_wp32_sitonia_situation_desc: "君士坦丁堡的民生命脉与海上博弈维系于自克里米亚、多瑙河与色雷斯南下穿过博斯普鲁斯海峡的运粮船队，威尼斯与热那亚商邦正虎视眈眈。"
