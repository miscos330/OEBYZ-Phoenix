 oe_wp32_act_chr_revive_eastern_sees: "诏告安条克与亚历山大里亚使徒圣座复兴"
 oe_wp32_act_chr_revive_eastern_sees_desc: "光复安条克或亚历山大里亚后，隆重诏告东方古老使徒牧首圣座重光，圆满五牧首大业。"
