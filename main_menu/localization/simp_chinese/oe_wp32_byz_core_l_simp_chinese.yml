 oe_wp32_act_pnr_charistikion_review_desc: "清查世俗权贵托管修道院地产之积弊，恢复教会与乡里秩序。"
 oe_wp32_act_pnr_rebalance_grants: "调衡普罗诺亚与皇产册籍"
 oe_wp32_act_pnr_rebalance_grants_desc: "统筹调配军功采邑与皇室直辖田产，兼顾军区征召实力与皇权控制。"
