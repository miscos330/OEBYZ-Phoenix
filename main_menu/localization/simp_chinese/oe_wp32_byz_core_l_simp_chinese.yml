 oe_wp32_act_amt_stockpile_greek_fire: "提炼封存希腊火秘剂"
 oe_wp32_act_amt_stockpile_greek_fire_desc: "于皇宫秘库加紧提炼封存希腊火燃烧剂，充实舰队喷火管与攻城储备。"
 oe_wp32_act_chr_convene_synod: "召开五大都会常设圣主教会议"
