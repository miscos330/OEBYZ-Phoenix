 STATIC_MODIFIER_DESC_oe_wp32_mod_amt_cataphract_issue: "皇家军械库统一配发札甲胸铠与复合长弓，大幅增强重装铁甲骑兵战力与军纪，但军费维护成本随之增加。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_amt_fabricae_charter: "各军区官营兵工厂按统一形制打造重步兵甲胄与兵器，提升兵源与步兵战力，同时需要国库常年拨款维持。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_amt_greek_fire_stock: "封存于御用密库的希腊火喷射管与陶罐燃烧剂极大提升帝国海军与攻城火力，但提炼维管开销不菲。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_beacon_chain_active: "八座安纳托利亚山峰烽火台昼烟夜火同步传警，令帝国野战军与边防要塞抢占先机，仅需常年拨付烽卒维费。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_chora_astronomy: "尼基弗鲁斯·格雷戈拉斯的星历考订与几何数理讲席令君士坦丁堡屹立于地中海学术之巅，推动科研与识字率提升。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_chora_rhetoric: "科拉学院培育的法学家与修辞学者重振帝国文书威仪与古典罗马人文教化，增进文化影响与内阁治理效能。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_chr_apostolic_revival: "重立安条克与亚历山大里亚正教大牧首圣座，彰显罗马皇帝作为东方基督教世界至高护法者的正统与威望。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_chr_five_sees_endowed: "朝廷向君士坦丁堡、塞萨洛尼基、尼西亚、特拉比松及东方使徒教区拨付常年教产，加快传教并增进宗教影响力。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_chr_permanent_synod: "皇帝与普世牧首共议常设主教会议，使教会法与帝国敕令相辅相成，增进正教凝聚与稳定度，却收紧对异端的宽容。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_fc_army_pacified: "补发军饷并论功行赏，使蠢蠢欲动的边防将军与禁军重归效忠，稳定行省军心。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_fc_concord_triumph: "历经四廷危机而使宫廷、元老院、圣主教会议与野战军各安其位，庞大的罗马帝国迈入制度均衡的新纪元。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_fc_palace_reformed: "清查宫廷官署贪墨陋规，重塑中枢行政廉洁与财政纪律，虽触动部分权贵却为平息四廷危机奠基。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_fc_senate_reconciled: "重申元老院对行省任免的咨议之权，化解贵族怨望并稳固帝国核心稳定度，略微让渡皇权直控。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_fc_synod_settled: "妥善化解教廷积怨，赢得东正教牧首与教士阶层公开宣讲效忠，助帝国渡过分裂暗流。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_ga_guard_disciplined: "将瓦兰吉卫队与禁军彻底纳入成法誓约与常设军纪约束，永绝拍卖紫袍之乱，重铸皇座铁卫威严。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_hippo_blues: "皇帝眷顾传统蓝党车队，令保守贵族与旧派市民欢欣鼓舞并提升宫廷威望，却引起绿党商匠不快。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_hippo_golden_splendor: "盛大而井然有序的四年一度战车盛会吸引四海使节与商旅云集君士坦丁堡，令帝都繁荣与皇权正统大振。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_hippo_greens: "皇帝青睐商匠云集的绿党车队，激发帝都作坊活力与海贸繁荣，却令元老贵族颇感冷落。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_pnr_apographe_audit: "钦差清丈官逐户重核普罗诺亚采邑地籍与免税账簿，显著提高赋税效率与控制度回升，却引起大贵族强烈不满。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_pnr_balanced_grants: "平衡世袭采邑与皇室直辖地籍，稳固军区征召兵源与贵族效忠，略微放宽中央直控上限。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_pnr_charistikion_reform: "遏制世俗权贵滥占修道院地产并规范查里斯提基翁托管契约，促进乡里繁荣与教士向心，略微让渡短期税入。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_roman_triumph: "凯旋大军沿君士坦丁堡御道列阵行至圣索菲亚大教堂，全军士气、陆军传统与帝国威望因月桂荣光而高涨。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_sit_bread_dole: "重启罗马古典官粮赈济制度，开仓平粜惠及京畿坊民，显著提振稳定度与繁荣度，但需国库补贴差价。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_sit_grain_convoys: "帝国战舰护送克里米亚与多瑙河运粮船队安渡博斯普鲁斯海峡，充实帝都粮食供给与海贸效率，略增舰队开销。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_sit_granary_buffer: "充盈的皇家常平粮仓使帝都无惧饥馑与粮价暴涨、安抚黎民，但压低了私商囤积居奇的套利空间。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_sit_pontic_dominion: "历尽黑海粮运博弈而牢控海峡粮道，君士坦丁堡稳握地中海粮食命脉，海贸、粮产与帝国威望全面跃升。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_sit_straits_tariff: "在博斯普鲁斯海峡严征谷物通行税（科梅基翁），充盈国库并巩固商路控制，但招致威尼斯与热那亚商邦怨怼。"
 STATIC_MODIFIER_DESC_oe_wp32_mod_venice_restitution: "向威尼斯追索1204年浩劫之赔款与被掠圣物，洗雪百年国耻并重振罗马帝国在东地中海的海上尊严。"
