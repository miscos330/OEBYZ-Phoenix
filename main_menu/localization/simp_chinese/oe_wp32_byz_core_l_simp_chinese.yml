 oe_wp32_mod_chora_astronomy: "科拉学院天文数理新学"
 oe_wp32_mod_chora_rhetoric: "科拉学院古典修辞与法学馆"
 oe_wp32_mod_chr_apostolic_revival: "东方使徒圣座复兴诏书"
