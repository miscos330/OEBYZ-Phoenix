 hint_oe_wp32_sitonia: "[GetSituationByKey('oe_wp32_sitonia_situation').GetNameWithNoTooltip]"
 hint_oe_wp32_sitonia_hint_text: "#T 局势概览#!\n“黑海官粮商道（西托尼亚）”呈现1338至1460年间君士坦丁堡依托黑海与海峡粮运维系民生与海贸博弈的历程。\n\n#T 交互行动#!\n可通过#bold 黑海运粮船队护航#!与#bold 充实帝都皇家粮仓#!累积储备迈向80，借#bold 征收海峡谷物关税#!充盈国库（代价为威尼斯与热那亚交恶），或施行#bold 紧急官粮赈济#!稳固京畿安定。\n\n#T 完胜目标#!\n在稳守君士坦丁堡且稳定度不低于20时，将皇家粮仓储备提升至80，即可永获“黑海粮道霸主”盛名。"
