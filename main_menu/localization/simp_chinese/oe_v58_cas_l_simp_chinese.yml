 oe_v58_cas_ev_1_c_tt:0 "充盈王库财力且安抚地方领主。"
 oe_v58_cas.2.title:0 "帖木儿八征高加索的血火试炼"
 oe_v58_cas.2.desc:0 "来自撒马尔罕的铁骑八度越境入寇，所过河谷城镇化为焦土。然而格鲁吉亚守军据守玄武岩绝壁与冰封雪隘，宁碎玉而不瓦全，誓保十字信仰与巴格拉季昂王统。"
