 oe_v58_cas_ev_4_b_tt:0 "夯实长期山岳国防与王室威望。"
 oe_v58_cas.4.c:0 "严守中立以安农桑与葡萄园丰收"
 oe_v58_cas_ev_4_c_tt:0 "保境安民、丰裕国库。"
 oe_v58_cas.5.title:0 "老米尔恰与罗维内沼泽大捷"
 oe_v58_cas.5.desc:0 "闪电苏丹巴耶济德率大军北渡多瑙河，深入林木蔽日的瓦拉几亚泽国，却正中老米尔恰设于罗维内泥沼与鹿砦间的伏击圈。利箭蔽空如冬雹，轻骑侧袭如惊雷！"
 oe_v58_cas.5.a:0 "发动罗维内沼泽伏击与焦土追击"
 oe_v58_cas_ev_5_a_tt:0 "以泽国游击重创来犯之师并大振瓦拉几亚军威。"
 oe_v58_cas.5.b:0 "抢修多瑙河诸渡口要塞与特尔戈维什泰内堡"
 oe_v58_cas_ev_5_b_tt:0 "筑牢蒙特尼亚沿河防务与大公都城。"
 oe_v58_cas.5.c:0 "审时度势议定岁贡休战，保全商旅民生"
 oe_v58_cas_ev_5_c_tt:0 "乱世保民，稳固财力与国内秩序。"
 oe_v58_cas.6.title:0 "穿刺公弗拉德与特尔戈维什泰铁律"
 oe_v58_cas.6.desc:0 "面对屡遭篡弑与大贵族勾结外敌的瓦拉几亚，大公弗拉德三世于特尔戈维什泰设复活节鸿门宴整肃奸佞，誓以雷霆法度令国中路不拾遗、金杯置井而无人敢窃。"
 oe_v58_cas.6.a:0 "铁腕整肃怀贰大贵族，严护通商大道"
 oe_v58_cas_ev_6_a_tt:0 "大幅提升朝廷政务效率与商贸秩序，惟大贵族深怀怨惧。"
 oe_v58_cas.6.b:0 "役使叛党修筑波耶纳里城堡与金迪亚哨塔"
 oe_v58_cas_ev_6_b_tt:0 "加固山巅堡垒与都城瞭望防务。"
 oe_v58_cas.6.c:0 "恩威并施酌情赦免，以安国内诸阶层"
 oe_v58_cas_ev_6_c_tt:0 "缓和国内紧张局势并稳固财源。"
 oe_v58_cas.7.title:0 "1462年特尔戈维什泰夜袭惊魂"
 oe_v58_cas.7.desc:0 "面对五倍于己、直扑特尔戈维什泰的帝国大军，弗拉德三世按兵不动直至六月深夜三更。骤然间，数千瓦拉几亚精骑高举火把、吹响号角杀入沉睡敌营，直取中军御帐，刹那间营啸四起！"
 oe_v58_cas.7.a:0 "深夜鸣角举火，率死士奇袭敌军中军大营"
 oe_v58_cas_ev_7_a_tt:0 "以传奇夜袭震慑敌胆，极大提升行军速度与全军士气。"
 oe_v58_cas.7.b:0 "坚壁清野、断绝粮道，日夜袭扰敌军辎重"
 oe_v58_cas_ev_7_b_tt:0 "令入侵大军补给枯竭、寸步难行。"
 oe_v58_cas.7.c:0 "率主力退保喀尔巴阡险隘，留存有生力量"
 oe_v58_cas_ev_7_c_tt:0 "保存核心军力并稳固后方。"
 oe_v58_cas.8.title:0 "肇建摩尔达维亚"
 oe_v58_cas.8.desc:0 "自博格丹创立自主基业至善良者亚历山大长治久安，摩尔达维亚历代大公统合喀尔巴阡与德涅斯特河间沃土，打通苏恰瓦、雅西直抵基利亚与白城黑海港口的商路动脉。"
 oe_v58_cas.8.a:0 "颁行苏恰瓦至基利亚、白城全境通商宪章"
 oe_v58_cas_ev_8_a_tt:0 "兴旺黑海—波兰过境商贸并提升大公威望。"
 oe_v58_cas.8.b:0 "加固苏恰瓦石城与北疆德涅斯特诸堡"
 oe_v58_cas_ev_8_b_tt:0 "显著强化摩尔达维亚要塞体系。"
 oe_v58_cas.8.c:0 "优待利沃夫与热那亚商帮以广聚金银"
 oe_v58_cas_ev_8_c_tt:0 "迅速充盈国库并安定商埠。"
 oe_v58_cas.9.title:0 "斯蒂芬大帝与瓦斯卢伊大捷"
 oe_v58_cas.9.desc:0 "一月寒雾笼罩瓦斯卢伊高桥泥沼，大公斯蒂芬三世以少敌三倍强敌。伏于芦苇寒雾中的号手与鼓手骤然齐鸣，诱使敌军主力陷身冰泽，摩尔达维亚火炮与自由农大军四面合围，斩获震动全欧的传奇大捷！"
 oe_v58_cas.9.a:0 "寒雾鸣号诱敌入泽，倾力合围破敌于高桥"
 oe_v58_cas_ev_9_a_tt:0 "赢得“基督教健将”不朽威名、惊人军心与陆军传统。"
 oe_v58_cas.9.b:0 "遍发捷报于欧洲诸王庭，呼吁共筑多瑙河联防"
 oe_v58_cas_ev_9_b_tt:0 "广扬外交声望并鼓舞全国守土志气。"
 oe_v58_cas.9.c:0 "赐田免赋厚赏浴血奋战的自由农义军"
 oe_v58_cas_ev_9_c_tt:0 "稳固民心根基并永保自耕农效忠。"
 oe_v58_cas.10.title:0 "布科维纳彩绘修道院"
 oe_v58_cas.10.desc:0 "每逢血战凯旋，大公便敕建普特纳、沃罗内茨、胡莫尔与苏切维察等彩绘石砌修道院，外墙青金石蓝与翠绿壁画历经风霜不褪，修院史官则将米尔恰、弗拉德与斯蒂芬的丰功伟绩永垂竹帛。"
 oe_v58_cas.10.a:0 "礼聘壁画名师并兴建堡垒化修院学堂"
 oe_v58_cas_ev_10_a_tt:0 "大兴文化传统与大公正统威仪。"
 oe_v58_cas.10.b:0 "为诸彩绘修院增筑雉堞高墙，兼作乱世避难堡垒"
 oe_v58_cas_ev_10_b_tt:0 "令信仰圣地化作战时坚固堡垒。"
 oe_v58_cas.10.c:0 "从简兴修修院，留存财力供养边军"
 oe_v58_cas_ev_10_c_tt:0 "兼顾文教体面与边防军费。"
 oe_v58_cas.11.title:0 "撒马尔罕：帖木儿文艺复兴明珠"
 oe_v58_cas.11.desc:0 "设拉子琉璃名匠、德里石雕大师与大马士革吹玻巧工云集撒马尔罕。比比哈努姆清真寺与古尔埃米尔陵的青瓷瓜棱穹顶之下，铁骑帝国绽放出冠绝欧亚的文艺复兴华彩。"
 oe_v58_cas.11.a:0 "大兴青瓷穹顶、经学院与皇家细密画坊"
 oe_v58_cas_ev_11_a_tt:0 "点燃撒马尔罕—赫拉特文艺复兴，兼进科研、声望与文华。"
 oe_v58_cas.11.b:0 "将绿洲财富倾注于重甲铁骑与攻城工兵"
 oe_v58_cas_ev_11_b_tt:0 "锻造所向披靡的重骑兵与攻坚劲旅。"
 oe_v58_cas.11.c:0 "向兴旺的丝路巴扎行会征课商税"
 oe_v58_cas_ev_11_c_tt:0 "广聚丝路巴扎财赋并安稳民生。"
 oe_v58_cas.12.title:0 "乌鲁伯格天文台与沙哈鲁的赫拉特"
 oe_v58_cas.12.desc:0 "正当沙哈鲁与高哈尔·沙德王后将赫拉特化为波斯文学与书法圣地，学者亲王乌鲁伯格在撒马尔罕建成四十米巨型大理石六分仪，编就测定近千颗恒星的《苏丹天文表》。"
 oe_v58_cas.12.a:0 "巨资资助《苏丹天文表》观测与撒马尔罕经学院"
 oe_v58_cas_ev_12_a_tt:0 "显著跃升全国科研速率与识字水准。"
 oe_v58_cas.12.b:0 "资助赫拉特皇家书画院与四方通商使团"
 oe_v58_cas_ev_12_b_tt:0 "远播文化声望与丝路外交影响力。"
 oe_v58_cas.12.c:0 "节制赏赐并清查行省税赋以防内乱"
 oe_v58_cas_ev_12_c_tt:0 "兼顾财政稳健与地方安宁。"
 oe_v58_cas.13.title:0 "巴布尔之路：从费尔干纳到喀布尔"
 oe_v58_cas.13.desc:0 "痛失故乡安集延与梦寐以求的撒马尔罕后，年轻的查希尔丁·巴布尔冒风雪翻越兴都库什山脉，克复群山环抱的喀布尔，于流泉果园间运筹南下大计。"
 oe_v58_cas.13.a:0 "以喀布尔雪山名城为基业，兼兴园林文治与远交"
 oe_v58_cas_ev_13_a_tt:0 "显著提升王室声望与兴都库什沿线外交影响力。"
 oe_v58_cas.13.b:0 "以费尔干纳百战老骑配属火绳枪营日夜操演"
 oe_v58_cas_ev_13_b_tt:0 "锻造骑兵与火枪协同的南征劲旅。"
 oe_v58_cas.13.c:0 "征课呼罗珊至旁遮普间的开伯尔山口商税"
 oe_v58_cas_ev_13_c_tt:0 "迅速积攒南征军费。"
 oe_v58_cas.14.title:0 "帕尼帕特与印度斯坦火炮战车阵"
 oe_v58_cas.14.desc:0 "通往德里的帕尼帕特尘土原野上，师承奥斯曼炮术的大师乌斯塔德·阿里·库利以铁链连结数百辆牛车、广设野炮与火枪射击缺口，两翼帖木儿轻骑则施展经典“图鲁格玛”大迂回包抄！"
 oe_v58_cas.14.a:0 "布设铁链火炮战车阵并发动两翼骑兵大迂回"
 oe_v58_cas_ev_14_a_tt:0 "释放摧枯拉朽的炮车火力、攻坚效率与轻骑包抄战力。"
 oe_v58_cas.14.b:0 "以高爵厚禄怀柔拉杰普特与阿富汗部族酋长"
 oe_v58_cas_ev_14_b_tt:0 "化干戈为玉帛，奠定广土众民之治。"
 oe_v58_cas.14.c:0 "散赐战利金银以牢系三军将士之心"
 oe_v58_cas_ev_14_c_tt:0 "赏赐三军、上下一心。"
 oe_v58_cas.15.title:0 "贾尼别克、克烈与哈萨克草原肇兴"
 oe_v58_cas.15.desc:0 "不满锡尔河下游苛政的贾尼别克与克烈两位苏丹率二十万不屈牧民东迁水草丰美的七河楚河与塔拉斯牧场，自由草原骑手由此凝聚为强盛的哈萨克汗国。"
 oe_v58_cas.15.a:0 "于七河草原凝聚自由游牧诸部共尊一统"
 oe_v58_cas_ev_15_a_tt:0 "大幅增强部族凝聚力与草原轻骑纵横战力。"
 oe_v58_cas.15.b:0 "经营昔格纳黑与突厥斯坦等锡尔河商镇"
 oe_v58_cas_ev_15_b_tt:0 "打通游牧畜群与河中商镇的互市动脉。"
 oe_v58_cas.15.c:0 "维系宽松部族草场惯例并按例征收马贡"
 oe_v58_cas_ev_15_c_tt:0 "顺应旧俗，保境丰财。"
 oe_v58_cas.16.title:0 "昔班尼汗与布哈拉绿洲中兴"
 oe_v58_cas.16.desc:0 "昔班尼系乌兹别克铁骑自钦察草原挥师南下入主撒马尔罕与布哈拉，将草原尚武之风与绿洲学术护持熔为一炉，于卡扬宣礼塔前兴建米尔阿拉伯经学院，重振阿姆河商路气象。"
 oe_v58_cas.16.a:0 "融汇草原重骑武备与布哈拉绿洲税政"
 oe_v58_cas_ev_16_a_tt:0 "兼得草原重骑突击与河中富庶税入。"
 oe_v58_cas.16.b:0 "广兴布哈拉高等经学院与穹顶丝路商馆"
 oe_v58_cas_ev_16_b_tt:0 "大振丝绸之路陆贸与河中绿洲繁华。"
 oe_v58_cas.16.c:0 "令精锐氏族骑士常驻北疆草场戒备"
 oe_v58_cas_ev_16_c_tt:0 "护持北疆牧场并充实军资。"
