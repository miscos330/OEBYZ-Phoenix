 oe_v58_cas.1.title:0 "光辉者乔治五世与巴格拉季昂中兴"
 oe_v58_cas.1.desc:0 "伊朗伊利汗国日渐式微之际，光辉者乔治五世巧运韬略，重一卡尔特利、伊梅列季与萨姆茨赫，颁行《山地法典》并重兴耶路撒冷十字修道院特权。"
