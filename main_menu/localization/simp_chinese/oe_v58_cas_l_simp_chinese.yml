 oe_v58_cas_ev_3_b_tt:0 "提升火器战备与高地顽强守御。"
 oe_v58_cas.3.c:0 "征课翻山丝绸商税充实战备国库"
 oe_v58_cas_ev_3_c_tt:0 "迅速积蓄军资以应对动荡时局。"
 oe_v58_cas.4.title:0 "巴格拉季昂山岳砥柱与北方使节"
 oe_v58_cas.4.desc:0 "使节翻越冰封的达里亚尔峡谷北通草原与黑海港市，卡尔特利与卡赫季朝堂展开激辩：是远结北方正教强援，还是立足本土石堡与高地工艺自立自强？"
