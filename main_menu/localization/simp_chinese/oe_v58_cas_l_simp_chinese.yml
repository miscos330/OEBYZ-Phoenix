 oe_v58_cas.2.b:0 "免赋赈济劫后村镇，重植高加索葡萄园"
 oe_v58_cas_ev_2_b_tt:0 "迅速抚慰民心并恢复战后生机。"
 oe_v58_cas.2.c:0 "遣使厚赠礼金，诱使强敌转锋他向"
 oe_v58_cas_ev_2_c_tt:0 "破财消灾暂保腹地免遭再度兵燹。"
 oe_v58_cas.3.title:0 "夹缝存亡"
 oe_v58_cas.3.desc:0 "君士坦丁堡陷落之后，安纳托利亚与伊朗两大火器帝国崛起东西。格鲁吉亚诸王如履薄冰，一方面巧借外交制衡奥斯曼与萨非，一方面暗修雪山坚堡以备万一。"
 oe_v58_cas.3.a:0 "施展夹缝外交同时加固达里亚尔与卡尔特利隘口"
 oe_v58_cas_ev_3_a_tt:0 "兼收外交回旋与山地坚防之利。"
