l_simp_chinese:
 # NEW 2026-11-23 v19.0 Module 19.0-D: AI 3.0 & Engine Testing Localization (oe_ai3_). Generated by gen_v190_ai3_tests.py.
 oe_ai3_industrial_modernizer:0 "工业维新统筹者"
 oe_ai3_industrial_modernizer_desc:0 "该国将工场思潮、产业资本与行政近代化置于盲目征伐之上，力图凭技术跃迁与雄厚产力在列强竞逐中占据先机。"
 oe_ai3_maritime_thalassocrat:0 "海权运河经略者"
 oe_ai3_maritime_thalassocrat_desc:0 "该国以远洋航线、海峡运河咽喉与商船水师为立国枢轴，宁取制海权与商约筹码，而不轻涉旷日持久的陆疆泥潭。"
 oe_ai3_balance_of_power_arbiter:0 "欧亚均势调停者"
 oe_ai3_balance_of_power_arbiter_desc:0 "该列强时刻警觉陆权霸主失衡坐大，善以防卫同盟、审慎斡旋与联衡外交维持欧亚多极均势格局。"
 oe_ai3_silk_road_unifier:0 "丝路陆疆统合者"
 oe_ai3_silk_road_unifier_desc:0 "该陆权大国志在贯通欧亚商道枢纽、藩属节点与帝国驿站网络，以稳固控制与商路统合铸就绵延千里的内陆秩序。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_diplomatic_entente:0 "防卫性反霸协约网"
 STATIC_MODIFIER_DESC_oe_ai3_mod_diplomatic_entente:0 "多国枢密院互通声气并签署互保防卫协约，既拓展外交容量与声望，又巩固前线边防。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_armed_neutrality:0 "武装中立自主方略"
 STATIC_MODIFIER_DESC_oe_ai3_mod_armed_neutrality:0 "暂不卷入大国阵营纷争，转以整军经武与固守中立维系国内安定及常备战备。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_coalition_vanguard:0 "均势反霸同盟先锋"
 STATIC_MODIFIER_DESC_oe_ai3_mod_coalition_vanguard:0 "率先联络诸国共遏霸权失衡，令军民士气高昂、外交斡旋得力且持久作战韧性显著增强。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_congress_mediator:0 "欧亚和会调停威望"
 STATIC_MODIFIER_DESC_oe_ai3_mod_congress_mediator:0 "居中斡旋列强分歧、广邀使节议和，显著抬升外交威望与睦邻成效。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_industrial_catchup:0 "官督工业追赶诏令"
 STATIC_MODIFIER_DESC_oe_ai3_mod_industrial_catchup:0 "朝廷延聘外籍技师、兴办示范工场与格致学堂以急追先进思潮，虽短期耗费税力，却令技术与生产效率大幅跃升。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_artisan_modernization:0 "行会专利与工坊革新章程"
 STATIC_MODIFIER_DESC_oe_ai3_mod_artisan_modernization:0 "准许城邑行会享有新械专利并自主扩建工坊，既免朝廷财政承压，又稳步提振市民满意度与产能。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_naval_arms_surge:0 "海军船坞扩建竞赛"
 STATIC_MODIFIER_DESC_oe_ai3_mod_naval_arms_surge:0 "海部紧急扩充干船坞与重舰造舰额度，显著加快造舰并提升水师战力与传统，但维系开支略有增加。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_convoy_doctrine:0 "商船护航与制海教范"
 STATIC_MODIFIER_DESC_oe_ai3_mod_convoy_doctrine:0 "将水师预算集中于高效护航舰队与海路巡弋，既保障海贸畅通无阻，又节省舰队常年维系耗费。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_cipher_bureau:0 "枢密院密电破译局"
 STATIC_MODIFIER_DESC_oe_ai3_mod_cipher_bureau:0 "专设密电司与驿使稽查制度，使外谍难窥机密且我方侦察敌国动向事半功倍。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_envoy_prestige:0 "常驻使节礼制革新"
 STATIC_MODIFIER_DESC_oe_ai3_mod_envoy_prestige:0 "广设常驻公使馆并推行公开外事礼制，赢得各国朝堂敬重并广传本朝文化影响。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_silk_road_compact:0 "欧亚驿站与商队互保协约"
 STATIC_MODIFIER_DESC_oe_ai3_mod_silk_road_compact:0 "统一沿途官驿护卫与商队给养章程，令陆上贸易效率、商队运力与京畿政令通达速度同步跃升。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_customs_consolidation:0 "陆疆关税与驿路整饬"
 STATIC_MODIFIER_DESC_oe_ai3_mod_customs_consolidation:0 "整顿边关陆路税卡与驿路财赋，既充实国库税入，又加快内地营建步伐。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_open_navigation_charter:0 "国际海峡与运河通航宪章"
 STATIC_MODIFIER_DESC_oe_ai3_mod_open_navigation_charter:0 "颁行明码实价的运河海峡通航章程，吸引万国商船云集泊岸，海贸收益与外交信誉并举。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_chokepoint_admiralty:0 "咽喉水道要塞水师司令部"
 STATIC_MODIFIER_DESC_oe_ai3_mod_chokepoint_admiralty:0 "沿运河与海峡广筑岸防炮台与水师屯泊港，既锁死商路壁垒又延伸远洋舰队航程。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_concert_protocol:0 "多极列强仲裁议定书"
 STATIC_MODIFIER_DESC_oe_ai3_mod_concert_protocol:0 "确立大国峰会定期仲裁机制，既缓和连年征战之疲，又促成各国学术文教互通与外交信誉大增。"
 STATIC_MODIFIER_NAME_oe_ai3_mod_sovereign_deterrence:0 "自主威慑常备军备"
 STATIC_MODIFIER_DESC_oe_ai3_mod_sovereign_deterrence:0 "厉兵秣马并修缮要塞防线，以严明军纪与深厚军伍传统确保持久战略威慑。"
 oe_ai3.1.t:0 "列强外交格局重塑"
 oe_ai3.1.desc:0 "自欧亚诸国驰归的使节纷纷奏报，列强枢密院正在暗中重排阵营。昔日宿敌频通密函，新结盟约已在边境之外悄然成型。朝堂须即刻决断：是主动牵头组建防卫性反霸协约，还是秉持武装中立以静制动？"
 oe_ai3.1.a:0 "主动联络诸国，缔结防卫协约网"
 oe_ai3.1.b:0 "宣布武装中立，固守自主方略"
 oe_ai3.2.t:0 "欧亚均势反霸警钟"
 oe_ai3.2.desc:0 "一尊空前强盛的陆权霸主已囊括千里疆土，欧亚多极均势岌岌可危。邻近诸侯与列强皆瞩目我朝动向：我方或可高举反霸大旗、统率同盟先锋，或可倡议召开中立和会、借外交约束遏其锋芒。"
 oe_ai3.2.a:0 "担当均势先锋，备战遏制霸权"
 oe_ai3.2.b:0 "倡议召开列强和会，以外交调停定局"
 oe_ai3.3.t:0 "工业追赶与工场革新诏"
 oe_ai3.3.desc:0 "来自邻国商埠的密报指出，彼邦新式工场、水力机纺与精炼冶金已远胜传统作坊。重臣呈上两策：或由朝廷斥资延聘技师、兴办官督示范工场以急追思潮，或颁行行会专利章程、激励城邑工匠自主改良。"
 oe_ai3.3.a:0 "颁行官督工业追赶诏令，急引先进技艺"
 oe_ai3.3.b:0 "颁授行会专利章程，厚植民间工坊产力"
 oe_ai3.4.t:0 "远洋海军军备竞赛"
 oe_ai3.4.desc:0 "敌对海权强邦正大举铺设主力重舰龙骨并扩建海外补给泊地，我方远洋航道面临严峻挑战。海部提议两项方略：立即扩建干船坞展开重舰造舰竞赛，或集中财力打造高效护航舰队以保商路无虞。"
 oe_ai3.4.a:0 "扩建海部干船坞，全力角逐主力舰霸权"
 oe_ai3.4.b:0 "推行商船护航教范，精打细算守卫海贸"
 oe_ai3.5.t:0 "枢密院密电与情报革新"
 oe_ai3.5.desc:0 "截获的密信表明，敌对朝堂的耳目已渗透大陆驿道与外事文书。枢密院重臣建言：或专设密电破译局以严密反谍并反制敌国情报网，或大力整饬常驻公使礼制以堂堂正正广结善缘。"
 oe_ai3.5.a:0 "设立枢密院密电破译局，严密反谍侦察"
 oe_ai3.5.b:0 "广设常驻公使馆，以公开外交赢取信任"
 oe_ai3.6.t:0 "欧亚陆路丝绸商道协约"
 oe_ai3.6.desc:0 "皇家舆图官与商队行帮已详绘贯通内陆诸省的官驿、市集与关隘网络。若借机统一陆疆行商律令，既可缔结高效驿站商队互保协约以兴陆贸，亦可整顿边关陆税以厚植国库与营建财源。"
 oe_ai3.6.a:0 "颁行官驿与商队互保协约，畅通欧亚陆贸"
 oe_ai3.6.b:0 "整顿陆疆关税卡哨，充实财赋并兴土木"
 oe_ai3.7.t:0 "海峡运河海权统筹会议"
 oe_ai3.7.desc:0 "扼守重要海峡咽喉与大运河枢纽令天下商货尽经我境。海商公会力主颁行公平透明的国际通航宪章以广招万国商船，水师宿将则主张广筑岸防要塞并严控海疆壁垒。"
 oe_ai3.7.a:0 "颁布国际通航宪章，广招四海商船云集"
 oe_ai3.7.b:0 "设立咽喉水道要塞水师，严控海疆门户"
 oe_ai3.8.t:0 "欧亚列强战略评估峰会"
 oe_ai3.8.desc:0 "值此同盟密布、大宗商链纵横且常备军林立之世，稍有误判便足令万里大陆卷入浩劫。辅政重臣为未来十年拟定两条国策：推动多极峰会常设仲裁机制以稳和局，或精炼常备威慑军备以防不测。"
 oe_ai3.8.a:0 "倡导多极峰会仲裁议定书，共维大陆清平"
 oe_ai3.8.b:0 "厉行自主威慑备战方略，固守边疆要塞"
