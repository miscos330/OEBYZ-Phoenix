 STATIC_MODIFIER_NAME_oe_dec_mod_dominion_charter: "殖民自治领宪章"
 STATIC_MODIFIER_DESC_oe_dec_mod_dominion_charter: "向海外殖民地颁授自治议会宪章与商贸话语权，有效化解独立传染风暴并维系帝国海洋贸易圈。"
 STATIC_MODIFIER_NAME_oe_dec_mod_pacification_fleet: "远洋平叛特遣舰队"
 STATIC_MODIFIER_DESC_oe_dec_mod_pacification_fleet: "远征分舰队与海军陆战队强势封锁叛乱港口、推行宗主法令，彰显海上威慑的同时却也加剧殖民离心。"
 STATIC_MODIFIER_NAME_oe_dec_mod_foreign_instructors: "洋教习与自强维新军训"
 STATIC_MODIFIER_DESC_oe_dec_mod_foreign_instructors: "延聘外籍炮术工程师与参谋教官，以近代操典与火力体系重塑古老帝国陆军。"
 STATIC_MODIFIER_NAME_oe_dec_mod_treaty_port_privileges: "炮舰通商口岸特权"
 STATIC_MODIFIER_DESC_oe_dec_mod_treaty_port_privileges: "驻泊远洋河口的蒸汽战舰迫开低税通商口岸与领事特权，为本国商队攫取丰厚跨洋贸易利润。"
 STATIC_MODIFIER_NAME_oe_dec_mod_outcome_reform_survival: "维新帝国存续盛象"
 STATIC_MODIFIER_DESC_oe_dec_mod_outcome_reform_survival: "凭借果断的自治联邦改革与自强维新，古老帝国挺过革命狂潮，焕发出崭新的行政与武备生机。"
 STATIC_MODIFIER_NAME_oe_dec_mod_outcome_sovereign_republics: "主权共和浪潮纪元"
 STATIC_MODIFIER_DESC_oe_dec_mod_outcome_sovereign_republics: "不可逆转的殖民解放与制宪议会浪潮重塑各大洋秩序，开启主权共和国林立与自由通商的新纪元。"
 STATIC_MODIFIER_NAME_oe_dec_mod_outcome_concert_settlement: "多极均势和平协定"
 STATIC_MODIFIER_DESC_oe_dec_mod_outcome_concert_settlement: "务实外交在新生独立国家、维新帝国与海洋列强之间达成妥协，建立起稳固的多极条约均势格局。"
 STATIC_MODIFIER_NAME_oe_dec_mod_stamp_tax_friction: "帝国印花税与关税摩擦"
 STATIC_MODIFIER_DESC_oe_dec_mod_stamp_tax_friction: "宗主国直接对海外文书与口岸征收印花税和关税，虽暂补国库亏空，却迫使各殖民议会联合抗争。"
 STATIC_MODIFIER_NAME_oe_dec_mod_continental_congress: "大陆会议联合动员"
 STATIC_MODIFIER_DESC_oe_dec_mod_continental_congress: "各躁动海外行省代表齐聚大陆会议，统筹抵制禁运、民兵操练与宪政宣言，公然质疑宗主权威。"
 STATIC_MODIFIER_NAME_oe_dec_mod_liberty_contagion: "跨洋独立传染风暴"
 STATIC_MODIFIER_DESC_oe_dec_mod_liberty_contagion: "印刷机将革命檄文传遍大洋两岸每一座港口，一处殖民地举旗独立便立即引燃邻近总督区的解放烈火。"
 STATIC_MODIFIER_NAME_oe_dec_mod_creole_juntas: "克里奥尔地方政务会"
 STATIC_MODIFIER_DESC_oe_dec_mod_creole_juntas: "土生庄园主、律师与民兵军官组建地方临时政务会，趁宗主国力不逮之际逐步接管行政与武装大权。"
 STATIC_MODIFIER_NAME_oe_dec_mod_war_debt_fatigue: "宗主国战债疲敝"
 STATIC_MODIFIER_DESC_oe_dec_mod_war_debt_fatigue: "连年跨洋大战令宗主国债台高筑、驻军捉襟见肘，彻底助长了海外殖民地摆脱羁绊的野心。"
 STATIC_MODIFIER_NAME_oe_dec_mod_foreign_intervention: "列强海外干预约战"
 STATIC_MODIFIER_DESC_oe_dec_mod_foreign_intervention: "外国海军将领、志愿军官与秘密军火船队介入殖民战事，将局部独立运动升级为列强远洋博弈。"
 STATIC_MODIFIER_NAME_oe_dec_mod_loyalist_corps: "保皇地方志愿军团"
 STATIC_MODIFIER_DESC_oe_dec_mod_loyalist_corps: "保皇派、边疆盟友与保守商绅集结在王旗之下，与爱国者民兵在城镇议事厅和港口展开拉锯争夺。"
 STATIC_MODIFIER_NAME_oe_dec_mod_sovereign_republic_charter: "主权立宪共和宪章"
 STATIC_MODIFIER_DESC_oe_dec_mod_sovereign_republic_charter: "成文宪法、公民民兵与民选议会激发炽热的爱国热忱，并释放出蓬勃的工商业创造力。"
 STATIC_MODIFIER_NAME_oe_dec_mod_free_trade_opening: "废除重商垄断与自由通商"
 STATIC_MODIFIER_DESC_oe_dec_mod_free_trade_opening: "向中立商船与直航贸易全面开放昔日垄断口岸，显著压低运费并令跨洋关税收入成倍增长。"
 STATIC_MODIFIER_NAME_oe_dec_mod_postcolonial_trade_network: "后殖民时代商贸重构"
 STATIC_MODIFIER_DESC_oe_dec_mod_postcolonial_trade_network: "即便政治隶属已经终结，共同的语言、票号网络与成熟航线仍编织出极具韧性的跨洋商贸伙伴关系。"
 STATIC_MODIFIER_NAME_oe_dec_mod_old_garrison_reaction: "旧式禁军保守抵制"
 STATIC_MODIFIER_DESC_oe_dec_mod_old_garrison_reaction: "盘根错节的传统兵团掀翻行军铜锅、抵制新式操典，誓死捍卫世袭饷银与宫廷特权。"
 STATIC_MODIFIER_NAME_oe_dec_mod_gunboat_humiliation: "炮舰胁迫与关税主权受损"
 STATIC_MODIFIER_DESC_oe_dec_mod_gunboat_humiliation: "泊于海防炮台外的铁甲蒸汽炮舰迫使朝廷签署赔款与协定低关税条款，严重侵蚀帝国财源。"
 STATIC_MODIFIER_NAME_oe_dec_mod_unequal_treaty_ports: "治外法权通商口岸"
 STATIC_MODIFIER_DESC_oe_dec_mod_unequal_treaty_ports: "外国领事裁判权与租界特权折损帝国法权，却也在客观上加速了近代印刷术、机器与思潮的涌入。"
 STATIC_MODIFIER_NAME_oe_dec_mod_steam_arsenal: "官办蒸汽机器局与船政坞"
 STATIC_MODIFIER_DESC_oe_dec_mod_steam_arsenal: "官办兵工厂与近代船政局仿造线膛后装炮与蒸汽锅炉，并培育出帝国首批本土工业工程人才。"
 STATIC_MODIFIER_NAME_oe_dec_mod_tanzimat_edict: "坦志麦特与立宪维新诏书"
 STATIC_MODIFIER_DESC_oe_dec_mod_tanzimat_edict: "成文法制平等、专职税务部院与近代新式学堂自京师推行至边省，全面重塑帝国行政肌理。"
 STATIC_MODIFIER_NAME_oe_dec_mod_viceroy_autonomy_strain: "封疆总督坐大离心"
 STATIC_MODIFIER_DESC_oe_dec_mod_viceroy_autonomy_strain: "野心勃勃的地方帕夏、纳瓦布与总督自练新军并截留税银，令中央与封疆的统属纽带紧绷欲裂。"
 STATIC_MODIFIER_NAME_oe_dec_mod_silver_outflow_shock: "白银外流与违禁贸易冲击"
 STATIC_MODIFIER_DESC_oe_dec_mod_silver_outflow_shock: "巨额违禁走私逆转数百年白银净流入格局，银贵钱贱令完纳银税的农桑百姓苦不堪言。"
 STATIC_MODIFIER_NAME_oe_dec_mod_modern_naval_academy: "帝国近代水师学堂"
 STATIC_MODIFIER_DESC_oe_dec_mod_modern_naval_academy: "学员系统研习天文航海、蒸汽轮机与铁甲炮术，锻造出足以抗衡列强炮舰的新式海军军官团。"
 STATIC_MODIFIER_NAME_oe_dec_mod_rail_telegraph_concessions: "铁路与电报干线网络"
 STATIC_MODIFIER_DESC_oe_dec_mod_rail_telegraph_concessions: "钢铁轨路与铜线电报将数月驿程压缩至数时之内，极大提升军令调兵与腹地商贸效率。"
 STATIC_MODIFIER_NAME_oe_dec_mod_palace_coup_watch: "维新御林军戒备机制"
 STATIC_MODIFIER_DESC_oe_dec_mod_palace_coup_watch: "忠于维新朝廷的新式卫队严密把守宫门与电报局，彻底粉碎保守旧党企图发动的宫廷政变。"
 STATIC_MODIFIER_NAME_oe_dec_mod_neo_imperial_army: "中西合璧新式帝国陆军"
 STATIC_MODIFIER_DESC_oe_dec_mod_neo_imperial_army: "将传统尚武精神与线膛步兵、速射野炮及近代参谋本部熔于一炉，铸就令列强侧目的近代陆军强权。"
 STATIC_MODIFIER_NAME_oe_dec_mod_treaty_defiance: "废除不平等条约与关税自主"
 STATIC_MODIFIER_DESC_oe_dec_mod_treaty_defiance: "依托近代兵工实力与纵横外交，朝廷庄严收回关税自主权并废除列强领事裁判特权。"
 STATIC_MODIFIER_NAME_oe_dec_mod_phoenix_rebirth: "凤凰涅槃：近代化帝国中兴"
 STATIC_MODIFIER_DESC_oe_dec_mod_phoenix_rebirth: "古老火药帝国未曾沉沦于黄昏，反而完成工业、财政与军制的全面维新，以不屈列强之姿昂首迈入崭新世纪。"
 STATIC_MODIFIER_NAME_oe_dec_mod_imperial_twilight: "旧秩序的漫长黄昏"
 STATIC_MODIFIER_DESC_oe_dec_mod_imperial_twilight: "维新屡挫、外债利权层层叠加且行省渐生离心，令古老皇权步入风雨飘摇的黄昏岁月。"
 oe_dec.1.title: "无代表不纳税风暴"
 oe_dec.1.desc: "为偿付高昂的跨洋防务账单，宗主朝廷在海外属地强征印花税与口岸关税。殖民地商绅与议会群情激愤，高呼“无代表不纳税”，公然抵制远在重洋之外的法令。"
 oe_dec.1.a: "动用缉私巡洋舰与皇家法官强征帝国关税"
 oe_dec.1.b: "废除印花税并邀请殖民地财政代表共议税额"
 oe_dec.2.title: "大陆会议星火燎原"
 oe_dec.2.desc: "各海外行省民选代表无视总督禁令，秘密集结召开大陆会议。宣扬天赋自由的小册子传遍每一间酒馆与船坞，将昔日各自为政的殖民地凝聚在自治大旗之下。"
 oe_dec.2.a: "斥大陆会议为叛逆并动员忠顺驻军弹压"
 oe_dec.2.b: "派遣全权使节与代表商谈联邦自治领盟约"
 oe_dec.3.title: "独立思潮跨海传染邻近殖民地"
 oe_dec.3.desc: "殖民地揭竿抗命与独立宣言的捷报随信风疾传四海！邻近各海外属地闻风而动——码头工人罢工、民兵军官在三色旗下操练，独立渴望在各大洋总督区间如野火般疯狂蔓延。"
 oe_dec.3.a: "封锁革命报刊并增防沿岸要塞"
 oe_dec.3.b: "抢先颁布地方自治让步以截断独立传染"
 oe_dec.4.title: "克里奥尔地方政务会兴起"
 oe_dec.4.desc: "富有的土生庄园主、法学家与商绅久已不满本土空降的官僚。他们自称行省秩序的合法守护者，组建克里奥尔地方政务会并掌控市政财权与武装。"
 oe_dec.4.a: "在皇权框架下承认克里奥尔市政议会地位"
 oe_dec.4.b: "强行解散地方政务会并改派本土亲信总督"
 oe_dec.5.title: "宗主国战债疲敝与远征无力"
 oe_dec.5.desc: "数十年跨洋大战与沉重国债付息令宗主国库与船坞捉襟见肘。殖民地领袖从公报中洞悉我国公债行情，认定宗主国已无力支撑漫长的远洋武力弹压。"
 oe_dec.5.a: "收缩海外驻军规模并重整帝国财政"
 oe_dec.5.b: "大举举债死守每一座海外要塞"
 oe_dec.6.title: "列强趁机远洋干预"
 oe_dec.6.desc: "海上劲敌冷眼旁观海外帝国动荡，暗中盘算趁火打劫。密使将燧发枪、野战炮与海军志愿官兵运入起义港口，企图在不燃本土战火的前提下瓦解对手的远洋霸权。"
 oe_dec.6.a: "出动远洋分舰队拦截敌国军火走私船"
 oe_dec.6.b: "缔结海上中立公约以遏阻列强插手"
 oe_dec.7.title: "保皇派与爱国者撕裂"
 oe_dec.7.desc: "殖民地城镇与边疆聚落骤然一分为二。爱国者委员会夺占印书馆与军械库，而保皇派商绅、王室官员与边疆盟友则自组地方志愿军团，誓死效忠帝国王座。"
 oe_dec.7.a: "武装保皇地方志愿军团并担保其田产爵位"
 oe_dec.7.b: "颁布大赦令以弥合撕裂的殖民地社群"
 oe_dec.8.title: "自治领妥协宪章"
 oe_dec.8.desc: "富有远见的法学家起草大胆的《自治领宪章》：赋予海外领地责任议会、财政自决权与内部自由贸易，同时保留共同防务与尊王纽带。"
 oe_dec.8.a: "颁布帝国自治领妥协宪章"
 oe_dec.8.b: "坚持宗主国对每一座殖民地的绝对集权"
 oe_dec.9.title: "主权共和国独立宣言"
 oe_dec.9.desc: "在鸣响的钟声与新缝制的旗帜下，民选代表庄严宣告建立主权立宪共和国，摒弃世袭殖民隶属关系，令大洋两岸各国宫廷为之震动。"
 oe_dec.9.a: "拥抱立宪主权与公民民兵共和精神"
 oe_dec.9.b: "将独立热忱引导向稳健的商贸条约与法制建设"
 oe_dec.10.title: "废除重商垄断法案"
 oe_dec.10.desc: "经济学者与航运巨贾指出，封闭的殖民航海条例早已过时，只会滋生走私与叛乱。向全球竞争船运敞开口岸，带来的关税与商贸繁荣远胜封闭垄断。"
 oe_dec.10.a: "废除排他航海垄断，拥抱自由航运贸易"
 oe_dec.10.b: "维持特许船队享有的帝国优惠关税壁垒"
 oe_dec.11.title: "后殖民时代商贸重构"
 oe_dec.11.desc: "随着旧式殖民等级逐步让位于自治领与新生共和国，各大商号迅速重签提单、领事协定与信用额度——并惊喜地发现，自由商贸伙伴对工业制成品的购买力远超受压迫的属地。"
 oe_dec.11.a: "缔结互惠的后殖民时代通商与银行协定"
 oe_dec.11.b: "将资本回流本土工业与国内市场整合"
 oe_dec.12.title: "泛殖民地独立大潮"
 oe_dec.12.desc: "自大西洋良港至热带群岛，一场波澜壮阔的泛殖民地独立大潮席卷全球。古老帝国迎来十九世纪的终极抉择：或是蜕变为联邦伙伴体系，或是目睹海外领地接连挣脱枷锁。"
 oe_dec.12.a: "以主权立宪和解顺应时代大潮"
 oe_dec.12.b: "以帝国联邦公约稳住残余海外领地"
 oe_dec.13.title: "旧式禁军与维新派交锋"
 oe_dec.13.desc: "当维新大臣推行新式刺刀线列操典、核查虚额军饷并组建轻便野战炮营时，盘踞京畿的传统禁军悍然发难，痛斥新军违背祖宗兵制。"
 oe_dec.13.a: "正面压制旧式禁军，斥资编练新式常备军"
 oe_dec.13.b: "加发恩饷安抚传统兵团以求暂安"
 oe_dec.14.title: "聘请欧洲近代军事顾问团"
 oe_dec.14.desc: "来自欧洲军校的资深炮兵军官、要塞工程师与测绘专家愿赴我国京师创办近代参谋学堂与炮术讲武堂，助力迅速弥合火力纪律与后勤差距。"
 oe_dec.14.a: "延聘外籍军事顾问团并创办近代参谋学堂"
 oe_dec.14.b: "秘密译印西洋兵书而不引入外籍教官"
 oe_dec.15.title: "铁甲炮舰兵临海口"
 oe_dec.15.desc: "黑烟滚滚的蒸汽战舰径直下锚于我海防炮台射程边缘，掀开重型榴弹炮衣，外使随之递上四十八小时最后通牒，勒逼降税赔款。"
 oe_dec.15.a: "严词拒降，倾力抢修近代海防重炮台"
 oe_dec.15.b: "忍辱签下通商缓兵之约，换取自强筹备光阴"
 oe_dec.16.title: "通商口岸治外法权交涉"
 oe_dec.16.desc: "外国领事强索永久性通商口岸租界、领事裁判权与值百抽五协定关税。若予屈从则国权蒙羞，若径行决裂则恐遭立即海上封锁。"
 oe_dec.16.a: "设立官督近代海关与商法以对冲治外法权"
 oe_dec.16.b: "划定有限通商口岸，趁机引介西洋机器工艺"
 oe_dec.17.title: "自强机器局与蒸汽船政坞"
 oe_dec.17.desc: "自强重臣上疏兴建官办蒸汽机器局、干船坞与炼铁厂，力争自主铸造线膛火炮并建造蒸汽炮舰，彻底摆脱对外国军火商的掣肘。"
 oe_dec.17.a: "巨资兴办帝国蒸汽机器局与船政局"
 oe_dec.17.b: "径行外购现成西洋蒸汽战舰以图速效"
 oe_dec.18.title: "坦志麦特与帝国维新诏书"
 oe_dec.18.desc: "君主于御苑颁布划时代维新大诏：革除积弊包税制、改设专职领薪部院、保障万民身家财产安全，并创设近代行省谘议机构。"
 oe_dec.18.a: "全面颁行坦志麦特与立宪维新诏书"
 oe_dec.18.b: "将维新严格限定于财税稽核与兵役征募"
 oe_dec.19.title: "封疆总督坐大离心"
 oe_dec.19.desc: "手握地方饷银与新式机器局的封疆大吏渐生尾大不掉之势，甚至私与外使交涉、截留关款。自强之果究竟归于中央皇权，还是演为藩镇割据，已成燃眉考验。"
 oe_dec.19.a: "轮调封疆兵权并将电报与税账收归中央直辖"
 oe_dec.19.b: "容忍总督高度财权自治以换取名义尊奉"
 oe_dec.20.title: "白银外流与违禁关税冲击"
 oe_dec.20.desc: "外国走私飞剪船将违禁烟土与免税机织布匹倾泻入海口，致使数以百万计白银滚滚外流。银贵钱贱重创乡间纳税百姓，各省司库随之告急。"
 oe_dec.20.a: "钦派重臣严查违禁走私并兴办官商纺织实业"
 oe_dec.20.b: "改征海口特税以勉强弥补眼前财政窟窿"
 oe_dec.21.title: "创办帝国近代水师学堂"
 oe_dec.21.desc: "深感旧式木帆战船难以抗衡西洋蒸汽巡洋舰，水师衙门正式创办近代水师学堂，向新一代青年军官传授三角测绘、蒸汽轮机、炮雷战术与舰队旗语。"
 oe_dec.21.a: "敕建近代水师学堂并派遣学员远洋游历实习"
 oe_dec.21.b: "集中海防经费专修港湾水雷与岸防要塞"
 oe_dec.22.title: "铁路与电报干线筹建"
 oe_dec.22.desc: "铁路干线与有线电报有望前所未有地串联广袤行省，数日之内便可越岭运兵调粮；然而外国银团却借机索求沿线矿权与筑路特许。"
 oe_dec.22.a: "筹措本国官商股本自建国营铁路与电报干线"
 oe_dec.22.b: "批出有限外资筑路特许权以求干线早日通车"
 oe_dec.23.title: "保守旧党宫廷政变暗流"
 oe_dec.23.desc: "失势包税贵族、顽固宫廷保守派与怨恨新制的旧营将领在深宫暗影中密谋发难，企图罢黜维新重臣并焚毁一切新政诏书。"
 oe_dec.23.a: "抢在黎明前调动忠顺新军缉捕政变密谋者"
 oe_dec.23.b: "罢免激进维新大臣以安抚保守元老"
 oe_dec.24.title: "中西合璧新式帝国陆军"
 oe_dec.24.desc: "历经多年机器局建设、参谋学堂培育与实弹演习，帝国新式劲旅在京郊盛大阅兵：将民族尚武传统与线膛齐射步兵、后装钢炮及电报调度后勤完美融合。"
 oe_dec.24.a: "将新式合璧军制全面推广至各边疆军区"
 oe_dec.24.b: "打造精锐近代御林军同时精简地方驻军开支"
 oe_dec.25.title: "废除不平等条约宣言"
 oe_dec.25.desc: "有近代蒸汽兵工厂、成文法典与铁血新军作外交后盾，帝国终于迎来历史性时刻——正式照会各国废除屈辱领事特权，全面收回海关关税主权。"
 oe_dec.25.a: "庄严宣告收回关税自主权并废除治外法权"
 oe_dec.25.b: "通过多边外交会议分阶段体面收回关税主权"
 oe_dec.26.title: "帝国黄昏抑或凤凰涅槃"
 oe_dec.26.desc: "当近代早期最后一个十年步入尾声，历史向古老火药帝国宣读终极判词：或是凭蒸汽兵工、立宪新政与铁血新军迎来凤凰涅槃，或是因迟疑因循而步入漫长黄昏。"
 oe_dec.26.a: "凤凰涅槃，以近代化主权强国之姿屹立世界之林"
 oe_dec.26.b: "恪守古老礼制与旧统，任凭时代大潮奔涌而过"
