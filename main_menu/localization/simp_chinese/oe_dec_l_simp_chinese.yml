# NEW 2026-11-22 v16.5 Module 16.5-C: Colonial Independence Contagion & Gunpowder Empires Modernization Crisis (oe_dec_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v165_finance_twilight.py; edit the generator, not this file.
 oe_sit_twilight_of_empires: "非殖民化与火药帝国黄昏时代"
 oe_sit_twilight_of_empires_desc: "1750至1836年间，跨洋帝国正遭遇此起彼伏的殖民独立传染浪潮，古老欧亚火药帝国则直面蒸汽炮舰、不平等通商口岸与迫在眉睫的维新考验。旧日帝国究竟将凭维新存续、让位于主权共和浪潮，抑或缔结多极均势协定？"
 oe_sit_twilight_of_empires_reform: "维新帝国存续"
 oe_sit_twilight_of_empires_reform_desc: "果断的殖民自治领宪章、坦志麦特诏书与自强蒸汽机器局令古老帝国焕发新生，安然度过革命与炮舰风暴。"
 oe_sit_twilight_of_empires_republics: "主权共和浪潮"
 oe_sit_twilight_of_empires_republics_desc: "殖民地独立传染风暴彻底击碎旧式海洋垄断，推动一批崭新主权立宪共和国与自由通商体系崛起于世界舞台。"
 oe_sit_twilight_of_empires_concert: "多极均势协定"
 oe_sit_twilight_of_empires_concert_desc: "既非旧式霸权独尊，亦非全面倾覆瓦解；列强、维新帝国与新生独立国家最终在多极外交均势协定中寻得长久平衡。"
