l_simp_chinese:
 oe_ra_attack_tributary: "攻击朝贡国"
 oe_ra_attack_tributary_desc: "花费相当于本国一个月收入的金币，选择一个与本国没有停战协议的直属朝贡国，立即以“帝国征讨”为战争借口宣战。此战争借口的领土割让、附庸及释放国家的和约战争分数花费减少50%，侵略扩张减少50%。"
 oe_ra_choose_tributary: "选择要征讨的朝贡国"
 oe_ra_no_tributaries: "@trigger_no!没有可征讨的直属朝贡国。目标不能与本国处于战争或停战期。"
 oe_ra_tributary_war_target: "可征讨的直属朝贡国"
 oe_ra_tributary_war_cost: "一个月收入"
 oe_ra_imperial_tributary_war: "$oe_heg_capital_invasion$"
 oe_ra_imperial_tributary_war_desc: "朝贡的誓约已不足以维系帝国的秩序。以武力征讨朝贡国，将其土地置于俄罗斯的权威之下。领土割让、附庸及释放国家的和约战争分数花费减少50%，侵略扩张减少50%。"
 war_goal_oe_ra_take_tributary_capital: "$generic_war_goal_take_capital$"
 war_goal_oe_ra_take_tributary_capital_desc: "$generic_war_goal_take_capital_desc$"
 oe_ra_establish_oprichnina: "成立特辖军"
 oe_ra_establish_oprichnina_desc: "花费50政治影响力，立即施行“特辖军”政府改革：政府改革槽位+1，外交吞并速度+50%、外交吞并速度+1，王室力量+20%，贵族力量−33%，邻近度效率+10%。"
 oe_ra_oprichnina: "特辖军"
 oe_ra_oprichnina_desc: "将直属君主的特辖领地与军队联结起来，收束地方贵族的权柄，使王室的命令与行政力量深入各地。"
 oe_ra_oprichnina_unlocked: "已成立特辖军"
