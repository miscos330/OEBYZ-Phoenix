l_simp_chinese:
 OE_MARCH_GERMAN_IDENTITY_REQUIRED: "已开启日耳曼文化认同运动（运动结束后仍然有效）"
 oe_caucasian_march_modifier: "高加索边疆领"
 oe_caucasian_march_modifier_desc: "山地诸族在边疆领的庇护下保持自身传统，共同承担守卫帝国的责任。"
 OE_CAUCASIAN_MARCH: "高加索边疆领"
 OE_CAUCASIAN_MARCH_ADJ: "高加索"
 oe_found_caucasian_march.title: "成立高加索边疆领"
 oe_found_caucasian_march.desc: "高山隘口与海岸道路连接着诸多语言和信仰。将这些土地托付给帝国的边疆领主，以堡垒拱卫山口，以宽容维系诸族，令高加索成为罗马东方的屏障。\n\n将图阿普谢省与高加索大区内东罗马直接拥有的全部可征服地点，亚美尼亚高地地区除外交予新成立的高加索边疆领。新国家信奉东正教，以[ShowCultureName('greek_culture')]为主流文化，附庸类型为罗马边疆领。本决议只能执行一次，不额外收取费用。\n\n额外获得永久国家修正“高加索边疆领”：人口同化速度−300%、文化容量+10、已接纳文化维持花费−50%。同化修正与附庸类型的效果叠加。"
 oe_found_caucasian_march.a: "令边疆的堡垒守望罗马。"
 OE_MARCH_CAUCASIAN_TERRITORY_REQUIRED: "东罗马直接拥有格鲁吉亚地区的全部可征服地点；附属国拥有或军事占领不算。"
 oe_caucasian_march_founded: "已成立：高加索边疆领"
 OE_BOHEMIAN_MARCH: "波希米亚边疆领"
 OE_BOHEMIAN_MARCH_ADJ: "波希米亚"
 oe_found_bohemian_march.title: "成立波希米亚边疆领"
 oe_found_bohemian_march.desc: "群山环抱的盆地与摩拉维亚的通衢，足以支撑一个忠于帝国的边疆领。地方领主将在正教的钟声与帝国的法度之下，守护通往中欧的道路。\n\n将波希米亚与摩拉维亚地区内东罗马直接拥有的全部可征服地点交予新成立的波希米亚边疆领。新国家信奉东正教，以[ShowCultureName('czech')]为主流文化，附庸类型为罗马边疆领。本决议只能执行一次，不额外收取费用。"
 oe_found_bohemian_march.a: "令边疆的堡垒守望罗马。"
 OE_MARCH_BOHEMIAN_TERRITORY_REQUIRED: "东罗马直接拥有波希米亚地区的全部可征服地点；附属国拥有或军事占领不算。"
 oe_bohemian_march_founded: "已成立：波希米亚边疆领"
 OE_DUTCH_MARCH: "荷兰边疆领"
 OE_DUTCH_MARCH_ADJ: "荷兰"
 oe_found_dutch_march.title: "成立荷兰边疆领"
 oe_found_dutch_march.desc: "堤坝与港市将北海之滨的土地连接起来。伴随日耳曼认同运动，共同的法度正深入商埠与乡社；设立边疆领，将这片海岸纳入罗马长久的秩序。\n\n将荷兰与弗里斯兰地区内东罗马直接拥有的全部可征服地点交予新成立的荷兰边疆领。新国家信奉东正教，以[ShowCultureName('oe_german_greek_culture')]为主流文化，附庸类型为罗马边疆领。本决议只能执行一次，不额外收取费用。"
 oe_found_dutch_march.a: "令边疆的堡垒守望罗马。"
 OE_MARCH_DUTCH_TERRITORY_REQUIRED: "东罗马直接拥有荷兰地区的全部可征服地点；附属国拥有或军事占领不算。"
 oe_dutch_march_founded: "已成立：荷兰边疆领"
 OE_UPPER_GERMAN_MARCH: "上日耳曼边疆领"
 OE_UPPER_GERMAN_MARCH_ADJ: "上日耳曼"
 oe_found_upper_german_march.title: "成立上日耳曼边疆领"
 oe_found_upper_german_march.desc: "北方的诸侯领地与商贸城市，正沿着帝国重新开辟的道路彼此往来。保留莱茵河畔的重要据点，将其余诸地编为上日耳曼边疆领，使新兴的罗马认同获得稳固的依托。\n\n将北德意志大区内东罗马直接拥有的可征服地点；排除瓦隆尼亚、佛兰德、布拉班特、荷兰、弗里斯兰、莱茵兰，以及美因茨、奥彭海姆、沃尔姆斯；但莱茵兰的贝吉施兰省、维德、杜塞尔多夫、阿尔滕基兴纳入划地交予新成立的上日耳曼边疆领。新国家信奉东正教，以[ShowCultureName('oe_german_greek_culture')]为主流文化，附庸类型为罗马边疆领。本决议只能执行一次，不额外收取费用。"
 oe_found_upper_german_march.a: "令边疆的堡垒守望罗马。"
 OE_MARCH_UPPER_GERMAN_TERRITORY_REQUIRED: "东罗马直接拥有莱茵兰地区的全部可征服地点；附属国拥有或军事占领不算。"
 oe_upper_german_march_founded: "已成立：上日耳曼边疆领"
 OE_LOWER_GERMAN_MARCH: "下日耳曼边疆领"
 OE_LOWER_GERMAN_MARCH_ADJ: "下日耳曼"
 oe_found_lower_german_march.title: "成立下日耳曼边疆领"
 oe_found_lower_german_march.desc: "莱茵上游的市镇、施瓦本的山谷与巴伐利亚的道路，将在新的边疆领下共同守望帝国。让地方秩序与罗马法度相互支撑，使这片土地成为北方安定的根基。\n\n将施瓦本、巴伐利亚、法兰克尼亚、上莱茵地区内东罗马直接拥有的全部可征服地点，排除普法尔茨省，但保留其中的海德堡地点交予新成立的下日耳曼边疆领。新国家信奉东正教，以[ShowCultureName('oe_german_greek_culture')]为主流文化，附庸类型为罗马边疆领。本决议只能执行一次，不额外收取费用。"
 oe_found_lower_german_march.a: "令边疆的堡垒守望罗马。"
 OE_MARCH_LOWER_GERMAN_TERRITORY_REQUIRED: "东罗马直接拥有上莱茵地区的全部可征服地点；附属国拥有或军事占领不算。"
 oe_lower_german_march_founded: "已成立：下日耳曼边疆领"

 MODIFIER_TYPE_NAME_oe_block_primary_culture_change: "禁止转变主流文化"
 MODIFIER_TYPE_DESC_oe_block_primary_culture_change: "帝国承认并保障该国的主流文化，禁止通过更改主流文化行动另立国族。"
 OE_PRIMARY_CULTURE_CHANGE_PERMITTED: "没有禁止转变主流文化的限制"
 OE_NUBIAN_MARCH: "努比亚边疆领"
 OE_NUBIAN_MARCH_ADJ: "努比亚"
 oe_found_nubian_march.title: "成立努比亚边疆领"
 oe_found_nubian_march.desc: "尼罗河的急流与沙漠间的教堂，见证着努比亚诸国延续至今的信仰与传统。将帝国在这片土地上的城镇与堡垒交由当地领主管理，使南方商路与边塞得到长久的守护。\n\n将东罗马在努比亚大区直接拥有的全部地点交予新成立的努比亚边疆领。新国家以努比亚文化为主流文化，信奉正统大公教会，作为罗马边疆领附属于东罗马。本决议只能执行一次。"
 oe_found_nubian_march.a: "让尼罗河上游的烽火守望帝国。"
 OE_NUBIAN_MARCH_TERRITORY_REQUIRED: "东罗马直接拥有努比亚大区至少一个可征服地点"
 oe_nubian_march_founded: "已成立努比亚边疆领"
