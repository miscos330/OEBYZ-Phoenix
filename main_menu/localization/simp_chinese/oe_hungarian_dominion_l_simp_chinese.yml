l_simp_chinese:
 pe_byz_hungarian_dominion: "成立匈牙利自治领"
 pe_byz_hungarian_dominion_entry_short: "成立匈牙利自治领"
 pe_byz_hungarian_dominion_entry: "在匈牙利直接拥有的喀尔巴阡领土上成立新的匈牙利自治领，并移交南方领土及附庸。"
 pe_byz_hungarian_dominion_desc: "将原匈牙利直接拥有的喀尔巴阡地区领土划为新的匈牙利自治领，瓦拉几亚与摩尔达维亚除外。新国成为东罗马附庸，原匈牙利不被强制附庸，其剩余领土不作处理。巴尔干、瓦拉几亚及摩尔达维亚仍按原规则移交。"
 oe_hungarian_dominion_retains_land_tt: "匈牙利在巴尔干、瓦拉几亚及摩尔达维亚以外至少拥有一处地点，足以保留自治领。"
 oe_hungarian_dominion_handover_tt: "将匈牙利及其各级附庸在巴尔干、瓦拉几亚和摩尔达维亚的领土移交东罗马。首都位于这些地区的附庸整体转为东罗马的直属附庸，保留原附庸类型及其领土；其他附庸仅移交区内土地。不会自动获得核心。"
 oe_hungarian_dominion: "匈牙利自治领"
 oe_hungarian_dominion_desc: "由圣斯蒂芬王冠战争的专属和约设立的自治领，沿用罗马同盟的军事义务，但不向宗主国缴纳每月贡金。宗主国获得#G +10%#!轻骑兵作战能力；自治领获得#G +5%#!训练度、#G +20%#!陆军士气、#G +50#!对宗主国忠诚度、#G +50%#!陆军维护效率及#R −300%#!文化同化速度。允许吞并，每月吞并进度为#G 8#!。"
 oe_cb_recover_imperial_lands: "收复帝国失地"
 oe_cb_recover_imperial_lands_desc: "罗马文明圈所涵盖的土地不应久陷他人之手。东罗马可对持有文明圈地点的外国制造此宣战理由。进攻方征服、附庸及释放国家的战争分数花费#G −10%#!，侵略扩张#G −25%#!。"
 oe_recover_imperial_lands: "收复帝国失地"
 oe_recover_imperial_lands_desc: "击败占据罗马文明圈领土的国家，收复帝国失地。"
 oe_roman_recovery_cb_target: "目标拥有罗马文明圈地点，且不是东罗马或其附庸"
 oe_hungarian_handover_location: "位于巴尔干、瓦拉几亚或摩尔达维亚"

 oe_hungarian_dominion_foundation_land_tt: "匈牙利直接拥有至少一处喀尔巴阡地区内、且不属于瓦拉几亚或摩尔达维亚的地点。"

 oe_hungarian_dominion_foundation_tt: "以匈牙利直接拥有的全部喀尔巴阡地区地点成立新国家#Y 匈牙利自治领#!，排除瓦拉几亚与摩尔达维亚；新国成为东罗马的匈牙利自治领类型附庸，沿用原匈牙利的国家文化与宗教。首都优先布达，其次佩斯，否则选择划入地点中人口最多者。原匈牙利的剩余领土与外交地位不作处理。"

 OE_HUNGARIAN_DOMINION_COUNTRY: "匈牙利自治领"

 OE_HUNGARIAN_DOMINION_ADJ: "匈牙利自治领"

 oe_hungarian_dominion_location: "位于喀尔巴阡，且不属于瓦拉几亚或摩尔达维亚"
