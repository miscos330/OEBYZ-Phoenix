 STATIC_MODIFIER_NAME_oe_tcd_reg_q1: "新册（粗疏）"
 STATIC_MODIFIER_DESC_oe_tcd_reg_q1: "清丈官重新登记了这里的土地和农户。有了新册，官府收税更有把握。"
 STATIC_MODIFIER_NAME_oe_tcd_reg_q2: "新册（可靠）"
 STATIC_MODIFIER_DESC_oe_tcd_reg_q2: "清丈官重新登记了这里的土地和农户。有了新册，官府收税更有把握。"
 STATIC_MODIFIER_NAME_oe_tcd_reg_q3: "新册（详尽）"
 STATIC_MODIFIER_DESC_oe_tcd_reg_q3: "清丈官重新登记了这里的土地和农户。有了新册，官府收税更有把握。"
 STATIC_MODIFIER_NAME_oe_tcd_flight_loc: "追捕逃户"
 STATIC_MODIFIER_DESC_oe_tcd_flight_loc: "官兵进山追回逃走的农户，村里人心不安。"
 oe_tcd_send: "派遣清丈官"
 oe_tcd_send_desc: "派清丈官（apographeus）到一个行省重新登记土地和依附农户，出具新的清册。花费#R 5#![oe_tu_authority|e]、#R 100#!金币；清丈持续#Y 24#!个月；同一行省#Y 10#!年内只能清丈一次。[oe_tu_charter|e]拒绝清丈。\n开始时决定查得多严：查得越严，新册越准，行省忠诚降得越多。行省实行[oe_tu_pronoia|e]授地时，忠诚再降；将军出身豪族时，该家族影响力受损。\n清丈期间可能有豪强隐田、修道院请求豁免、农户逃亡等事。新册按质量生效（“粗疏”：财政效率#G +5#!、辖区最大控制力#G +3%#!、额外贡金#G 2%#!；“可靠”：财政效率#G +10#!、辖区最大控制力#G +5%#!、额外贡金#G 3%#!；“详尽”：财政效率#G +15#!、辖区最大控制力#G +8%#!、额外贡金#G 4%#!）：财政效率#Y 5#!年，其余#Y 10#!年；额外贡金只由[oe_tu_exarchate|e]和宗室封邑缴纳。"
 oe_tcd_send_card: "派清丈官重新登记一个行省的土地和农户，新册生效后多收税。"
 oe_tcd_send_select: "选择行省"
 oe_tcd_send_none: "@trigger_no!没有可以清丈的行省（特许城邦拒绝清丈；同一行省#Y 10#!年内只能清丈一次）。"
 oe_tcd_send_tt: "[oe_tu_authority|e]#R −5#!，#R −100#!金币。\n清丈官前往所选行省，清丈持续#Y 24#!个月，#Y 10#!年内不能再清丈该行省。随后决定查得多严。"
 oe_tcd_allow_auth: "帝国权威至少为#Y 5#!"
 oe_tcd_allow_gold: "国库至少有#Y 100#!金币"
 oe_tcd.1.t: "派遣清丈官"
 oe_tcd.1.d: "十四世纪，帝国派清丈官（apographeus）到各地重新登记土地和依附农户，给每一位持有人出具一份清册（praktikon），作为征税的依据。这个职务常由当地的长官兼任。1318年11月，清丈官康斯坦丁·佩尔加梅诺斯与格奥尔基·法里赛奥斯为伊维隆修道院出具了它在帖撒罗尼迦军区的清册。到1321年，两人在帖撒罗尼迦和斯特里蒙两个军区为阿索斯山的多座修道院出具了清册。\n\n如今，朝廷派清丈官前往[SCOPE.sCountry('oe_tcd_ev_theme').GetName]。他要逐村丈量土地，登记农户。查得越细，新册越准，地方上的怨气也越大。"
 oe_tcd.1.a: "逐户核查，一块地也不漏"
 oe_tcd.1.a.tt: "清丈持续#Y 24#!个月，新册质量起点为“详尽”（#Y 3#!）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#R −5#!，并计入忠诚目标#Y 5#!年。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]实行[oe_tu_pronoia|e]授地：忠诚再#R −6#!，并计入忠诚目标#Y 5#!年。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的长官出身豪族：该家族影响力#Y −30#!。\n清丈期间每月有#Y 12%#!的可能出事。"
 oe_tcd.1.b: "照常例清丈"
 oe_tcd.1.b.tt: "清丈持续#Y 24#!个月，新册质量起点为“可靠”（#Y 2#!）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#R −2#!，并计入忠诚目标#Y 5#!年。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]实行[oe_tu_pronoia|e]授地：忠诚再#R −5#!，并计入忠诚目标#Y 5#!年。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的长官出身豪族：该家族影响力#Y −15#!。\n清丈期间每月有#Y 8%#!的可能出事。"
 oe_tcd.1.c: "只核对旧册"
 oe_tcd.1.c.tt: "清丈持续#Y 24#!个月，新册质量起点为“粗疏”（#Y 1#!）。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]实行[oe_tu_pronoia|e]授地：忠诚再#R −3#!，并计入忠诚目标#Y 5#!年。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的长官出身豪族：该家族影响力#Y −5#!。\n清丈期间每月有#Y 4%#!的可能出事。"
 oe_tcd.2.t: "豪强隐田"
 oe_tcd.2.d1: "清丈官先丈量土地，再据此定下每一户应缴的税。册上少记一块地，持有人就少缴一份税。\n\n如今，清丈官在[SCOPE.sCountry('oe_tcd_ev_theme').GetName]发现，当地一位豪强把几处田产记在了佃户和亲戚的名下，册上的数目对不上。这位豪强与[SCOPE.sCharacter('oe_tcd_ev_ruler').GetName]的家族沾亲带故。"
 oe_tcd.2.d: "清丈官先丈量土地，再据此定下每一户应缴的税。册上少记一块地，持有人就少缴一份税。\n\n如今，清丈官在[SCOPE.sCountry('oe_tcd_ev_theme').GetName]发现，当地一位豪强把几处田产记在了佃户和亲戚的名下，册上的数目对不上。"
 oe_tcd.2.a: "依法追缴"
 oe_tcd.2.a.tt: "新册质量#G +1#!。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#R −3#!，并计入忠诚目标#Y 5#!年。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的长官出身豪族：该家族影响力#Y −10#!。"
 oe_tcd.2.b: "罚一笔钱了事"
 oe_tcd.2.b.tt: "新册质量不变。"
 oe_tcd.2.c: "睁一只眼闭一只眼"
 oe_tcd.2.c.tt: "新册质量#R −1#!。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#G +2#!，并计入忠诚目标#Y 5#!年。"
 oe_tcd.3.t: "修道院的金玺诏书"
 oe_tcd.3.d1: "阿索斯山的修道院保存着历代皇帝的金玺诏书。诏书常写明豁免：田产免缴赋税，官员不得进入。1318到1321年间，清丈官佩尔加梅诺斯与法里赛奥斯在帖撒罗尼迦和斯特里蒙两个军区，为阿索斯诸修道院逐处登记了田产和依附农户。\n\n如今，一座在[SCOPE.sCountry('oe_tcd_ev_theme').GetName]有田产的阿索斯修道院派人送来一份旧金玺诏书，说这些田产历来免税，清丈官无权登记。"
 oe_tcd.3.d: "皇帝赐给修道院的金玺诏书常写明豁免：田产免缴赋税，官员不得进入。诏书也有假的。佐格拉夫修道院有一份署名约翰五世、落款1342年1月的金玺诏书，其实写于1357到1372年之间。\n\n如今，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]境内的一座修道院拿出一份旧金玺诏书，说它的田产历来免税，清丈官无权登记。"
 oe_tcd.3.a: "尊重诏书，不予登记"
 oe_tcd.3.a.tt: "新册质量#R −1#!。"
 oe_tcd.3.b: "登记田产，免税照旧"
 oe_tcd.3.b.tt: "清丈多花#Y 3#!个月。\n新册质量不变。"
 oe_tcd.3.c: "查验诏书，照章征税"
 oe_tcd.3.c.tt: "新册质量#G +1#!。"
 oe_tcd.5.t: "农户逃进山里"
 oe_tcd.5.d: "册上登记的依附农户（paroikoi）要按册缴税。离开原地、不在任何册上的农户，在税务上被称为“自由人”（eleutheroi）。这种自由只是暂时的：下一次清丈找到他们，就会把他们重新登记为依附农户。\n\n如今，清丈官进村的消息一传开，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]有几个村子的农户赶着牲口逃进了山里。"
 oe_tcd.5.a: "派兵追回"
 oe_tcd.5.a.tt: "新册质量不变。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#R −2#!，并计入忠诚目标#Y 5#!年。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的辖区各地：叛乱度#R +0.5#!（#Y 2#!年）。"
 oe_tcd.5.b: "回乡者免税"
 oe_tcd.5.b.tt: "新册质量不变。"
 oe_tcd.5.c: "册上记作荒地"
 oe_tcd.5.c.tt: "新册质量#R −1#!。"
 oe_tcd.4.t: "新册告成"
 oe_tcd.4.d1: "清册记下一处田产的四至和面积，也记下每一户依附农户的名字、家人、房屋、牲口、土地，以及各自应缴的税。此后的赋税按新册征收。\n\n如今，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的清丈已经结束。新册详尽，几乎每一块地都有了着落。"
 oe_tcd.4.d2: "清册记下一处田产的四至和面积，也记下每一户依附农户的名字、家人、房屋、牲口、土地，以及各自应缴的税。此后的赋税按新册征收。\n\n如今，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的清丈已经结束。新册大体可靠，只有少数田产没有查清。"
 oe_tcd.4.d3: "清册记下一处田产的四至和面积，也记下每一户依附农户的名字、家人、房屋、牲口、土地，以及各自应缴的税。此后的赋税按新册征收。\n\n如今，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的清丈已经结束。新册粗疏，漏记了不少田产。"
 oe_tcd.4.d: "清册记下一处田产的四至和面积，也记下每一户依附农户的名字、家人、房屋、牲口、土地，以及各自应缴的税。此后的赋税按新册征收。\n\n如今，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的清丈已经结束。新册几乎无用，记下的田产比旧册还少。"
 oe_tcd.4.a3: "把新册存入国库"
 oe_tcd.4.a3.tt: "新册质量：“详尽”。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：财政效率#G +15#!（#Y 5#!年；近期职能加成只保留最新的一项）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的辖区各地：最大控制力#G +8%#!（#Y 10#!年）。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]为[oe_tu_exarchate|e]或宗室封邑：#Y 10#!年内每月多缴月收入的#Y 4%#!作为贡金。"
 oe_tcd.4.a2: "把新册存入国库"
 oe_tcd.4.a2.tt: "新册质量：“可靠”。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：财政效率#G +10#!（#Y 5#!年；近期职能加成只保留最新的一项）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的辖区各地：最大控制力#G +5%#!（#Y 10#!年）。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]为[oe_tu_exarchate|e]或宗室封邑：#Y 10#!年内每月多缴月收入的#Y 3%#!作为贡金。"
 oe_tcd.4.a1: "把新册存入国库"
 oe_tcd.4.a1.tt: "新册质量：“粗疏”。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：财政效率#G +5#!（#Y 5#!年；近期职能加成只保留最新的一项）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的辖区各地：最大控制力#G +3%#!（#Y 10#!年）。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]为[oe_tu_exarchate|e]或宗室封邑：#Y 10#!年内每月多缴月收入的#Y 2%#!作为贡金。"
 oe_tcd.4.a0: "把新册存入国库"
 oe_tcd.4.a0.tt: "新册质量：“无用”。\n新册无用：没有收益。"
 oe_tcd.4.b3: "从轻定额"
 oe_tcd.4.b3.tt: "按低一档的质量“可靠”生效。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：财政效率#G +10#!（#Y 5#!年；近期职能加成只保留最新的一项）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的辖区各地：最大控制力#G +5%#!（#Y 10#!年）。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]为[oe_tu_exarchate|e]或宗室封邑：#Y 10#!年内每月多缴月收入的#Y 3%#!作为贡金。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#G +3#!，并计入忠诚目标#Y 5#!年。"
 oe_tcd.4.b2: "从轻定额"
 oe_tcd.4.b2.tt: "按低一档的质量“粗疏”生效。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：财政效率#G +5#!（#Y 5#!年；近期职能加成只保留最新的一项）。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]的辖区各地：最大控制力#G +3%#!（#Y 10#!年）。\n若[SCOPE.sCountry('oe_tcd_ev_theme').GetName]为[oe_tu_exarchate|e]或宗室封邑：#Y 10#!年内每月多缴月收入的#Y 2%#!作为贡金。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#G +3#!，并计入忠诚目标#Y 5#!年。"
 oe_tcd.4.b1: "从轻定额"
 oe_tcd.4.b1.tt: "按低一档的质量“无用”生效。\n新册无用：没有收益。\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]：忠诚#G +3#!，并计入忠诚目标#Y 5#!年。"
 oe_tcd.9.t: "清丈：登记生效"
 oe_tcd.3.d_pre: "皇帝赐给修道院的金玺诏书常写明豁免：田产免缴赋税，官员不得进入。诏书也有假的。修道院与官府争田时，常有人拿出来历可疑的旧诏书。\n\n如今，[SCOPE.sCountry('oe_tcd_ev_theme').GetName]境内的一座修道院拿出一份旧金玺诏书，说它的田产历来免税，清丈官无权登记。"
