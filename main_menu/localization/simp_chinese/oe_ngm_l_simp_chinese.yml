 oe_ngm.2.a:0 "严厉推行大陆封锁体系"
 oe_ngm.2.b:0 "改颁战时官督特许贸易执照"
 oe_ngm.3.title:0 "海上暗网与中立航行权"
 oe_ngm.3.desc:0 "港口封锁令催生了庞大的沿海走私网、中立旗船籍与海上捕获法庭之争。海军部力主派遣武装中立护航船队冲破封锁，户部则要求严设税关缉私防线。"
 oe_ngm.3.a:0 "组建武装中立护航船队"
 oe_ngm.3.b:0 "整饬沿海缉私税关防线"
 oe_ngm.4.title:0 "第一次反霸大同盟结成"
 oe_ngm.4.desc:0 "各独立列强全权代表齐聚一堂，正式缔结第一次反霸大同盟。共同防务条约、反霸联防协定与维护欧亚均势之宣战法理已备妥待签。"
 oe_ngm.4.a:0 "签署第一次反霸同盟誓约"
 oe_ngm.4.b:0 "拨付国库补贴支援前线盟军"
 oe_ngm.5.title:0 "同盟战债与跨国军费补贴"
 oe_ngm.5.desc:0 "欧陆大战吞噬军费如泥沙俱下。银行团提议以关税作保发行跨国同盟主权战债，守旧大臣则力谏严守国内金银硬通货准备金。"
 oe_ngm.5.a:0 "承销同盟主权战时公债"
 oe_ngm.5.b:0 "严守本国金银准备金库"
 oe_ngm.6.title:0 "第二次反霸同盟浪潮再起"
 oe_ngm.6.desc:0 "脆弱的休战协议再度破裂，新的外交事变引爆第二次反霸同盟浪潮。平原与关隘之间，整编后的列强军团正蓄势展开新一轮多线围堵。"
 oe_ngm.6.a:0 "发起第二次反霸同盟多线反攻"
 oe_ngm.6.b:0 "沿大河要津构筑星堡防线"
 oe_ngm.7.title:0 "反霸联军全国总动员"
 oe_ngm.7.desc:0 "兵部呈上统一参谋图录、全国征兵名册与机动野战炮群编制。前线统帅请示：是推行全国总动员扩充大军，还是精编百战近卫精锐师？"
 oe_ngm.7.a:0 "颁行全国总动员与联军总参谋部"
 oe_ngm.7.b:0 "扩编百战近卫精锐军团"
 oe_ngm.8.title:0 "第三次反霸同盟与帝国决战"
 oe_ngm.8.desc:0 "十九世纪钟声敲响，第三次反霸同盟集结一切尚存之独立王廷展开决定性会战。陆上纵队与远洋战列舰队正从四面八方合围欧亚主战场。"
 oe_ngm.8.a:0 "全力推进欧亚均势决战"
 oe_ngm.8.b:0 "协同远洋封锁与两栖登陆作战"
 oe_ngm.9.title:0 "诸国大会战之巅峰对决"
 oe_ngm.9.desc:0 "五十万大军与千门野战炮在漫天硝烟中展开空前惨烈的诸国大会战。参谋官静候决胜军令：是以预备重炮群强轰敌阵中枢，还是以两翼军团大迂回合围？"
 oe_ngm.9.a:0 "投入预备炮兵群强轰中枢"
 oe_ngm.9.b:0 "闭合两翼大迂回合围铁钳"
 oe_ngm.10.title:0 "霸主疲敝与帝国过伸"
 oe_ngm.10.desc:0 "连年跨洲征战已令国库枯竭、百战老兵凋零、藩属人心浮动。众元帅私下进言：与其玉石俱焚，不如体面议和暂行摄政，抑或唤起老近卫军作最后死战？"
 oe_ngm.10.a:0 "体面退位议和以全社稷"
 oe_ngm.10.b:0 "号召老近卫军绝境死战到底"
 oe_ngm.11.title:0 "维也纳均势大会召开"
 oe_ngm.11.desc:0 "历经数十年反霸烽火，欧亚各国君主、宰相与全权大使云集维也纳大会，重绘疆界、恢复正统法统并缔造长治久安的列强协调体系。"
 oe_ngm.11.a:0 "力主正统均势与边界互保"
 oe_ngm.11.b:0 "索取商贸特权与海权战争赔款"
 oe_ngm.12.title:0 "中立缓冲邦与海峡互保"
 oe_ngm.12.desc:0 "和会委员会提议将河口要冲、山隘与关键海峡划为列强共同担保的永久中立缓冲走廊，永绝单极强权长驱直入之患。"
 oe_ngm.12.a:0 "签署中立缓冲走廊担保书"
 oe_ngm.12.b:0 "加固本国边防要塞重镇"
 oe_ngm.13.title:0 "欧亚协调和平总议定书"
 oe_ngm.13.desc:0 "各国外相草拟常设《欧亚协调和平议定书》，约定凡遇疆界争端即召开列强大使会议共商化解，以防欧陆大劫重演。"
 oe_ngm.13.a:0 "批准常设协调和平议定书"
 oe_ngm.13.b:0 "保留主权自主行动之特权"
 oe_ngm.14.title:0 "列强均势国际仲裁庭"
 oe_ngm.14.desc:0 "一起棘手的列强商贸与边疆争端被提交至由法学家与特使组成的国际仲裁庭——这是以公法条约取代大炮火力的历史性考验。"
 oe_ngm.14.a:0 "尊奉国际仲裁裁决与法统"
 oe_ngm.14.b:0 "寸土不让坚持历史主权宣示"
 oe_ngm.15.title:0 "工业霸权与外交协调并立"
 oe_ngm.15.desc:0 "燃煤铁厂、铁路勘测与近代领事密电正在重塑晚近世界格局。朝野激辩：帝国根基当系于蒸汽工业通商协定，还是宏阔的列强协调大枢密外交院？"
 oe_ngm.15.a:0 "缔结蒸汽时代工业通商协定"
 oe_ngm.15.b:0 "升格帝国协调大枢密外交院"
 oe_ngm.16.title:0 "帝国绝唱：古典纪元之黄昏与黎明"
 oe_ngm.16.desc:0 "一八三〇至一八三六年步入尾声，五个世纪的王朝兴衰、反霸烽烟、远洋勘合与蒸汽熔炉正汇聚于历史终章。帝国将以何种不朽遗产昂首迈入崭新的现代世纪？"
 oe_ngm.16.a:0 "加冕五百年均势与文脉荣光"
 oe_ngm.16.b:0 "点燃迈向新世纪的蒸汽工业熔炉"
