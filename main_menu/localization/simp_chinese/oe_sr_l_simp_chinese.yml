 oe_sr.1.t: "中兴之议"
 oe_sr.1.desc_l: "#F 1333年，安德洛尼卡三世收回了色萨利北部和东部；1340年，伊庇鲁斯也回到了帝国。#!\n\n如今帝国一方握有的历史大区已有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个，京城也在帝国手里。朝中议论下一步往哪里用力。中兴之业分八级旧疆，每一级的大区回到帝国手里，都会有一番庆贺与赏赐：\n1　色雷斯全境：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2，需要#Y 2#!\n2　希腊本土：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3，需要#Y 3#!\n3　多瑙河防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3，需要#Y 3#!\n4　西北边陲：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4，需要#Y 3#!\n5　亚洲门户：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5，需要#Y 4#!\n6　高原诸军区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6，需要#Y 4#!\n7　幼发拉底防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4，需要#Y 3#!\n8　海与岛：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4，需要#Y 3#!"
 oe_sr.1.desc_x: "#F 1333年，色萨利的豪强死后，安德洛尼卡三世收回了色萨利北部和东部，派总督治理。#!\n\n如今帝国一方握有的历史大区已有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个，京城也在帝国手里。朝中议论下一步往哪里用力。中兴之业分八级旧疆，每一级的大区回到帝国手里，都会有一番庆贺与赏赐：\n1　色雷斯全境：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2，需要#Y 2#!\n2　希腊本土：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3，需要#Y 3#!\n3　多瑙河防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3，需要#Y 3#!\n4　西北边陲：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4，需要#Y 3#!\n5　亚洲门户：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5，需要#Y 4#!\n6　高原诸军区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6，需要#Y 4#!\n7　幼发拉底防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4，需要#Y 3#!\n8　海与岛：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4，需要#Y 3#!"
 oe_sr.1.a: "西向：巴尔干与多瑙河"
 oe_sr.1.a.tt: "定下方略：西向。第1、2、3、4级旧疆复归时，奖励多一档\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.1.b: "东向：小亚细亚与幼发拉底"
 oe_sr.1.b.tt: "定下方略：东向。第5、6、7级旧疆复归时，奖励多一档\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.1.c: "海上：诸岛与海峡"
 oe_sr.1.c.tt: "定下方略：海上。第8、2级旧疆复归时，奖励多一档\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.1.d: "不立方略"
 oe_sr.1.d.tt: "[oe_tu_authority|e]#G +2#!\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.2.t: "旧疆复归"
 oe_sr.2.desc_1: "#F 1333年，色萨利的豪强死后，安德洛尼卡三世收回了色萨利北部和东部，派总督治理。#!\n\n“色雷斯全境”的旧疆回到了帝国：所含2个历史大区（菲利波波利斯—罗多彼、安基阿洛斯）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_2l: "#F 1349年，约翰六世把摩里亚交给儿子曼努埃尔治理，帝国在希腊南部又有了一位坐镇的宗室。#!\n\n“希腊本土”的旧疆回到了帝国：所含3个历史大区（尼科波利斯、希腊—底比斯、伯罗奔尼撒）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_2: "“希腊本土”的旧疆回到了帝国：所含3个历史大区（尼科波利斯、希腊—底比斯、伯罗奔尼撒）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_3: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区，当地原来的赋税办法照旧。#!\n\n“多瑙河防线”的旧疆回到了帝国：所含3个历史大区（下多瑙河—帕里斯特里翁、塞尔迪卡、斯科普里—奥赫里德）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!个。多瑙河防线就此复立。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_4: "“西北边陲”的旧疆回到了帝国：所含4个历史大区（都拉齐翁—阿夫隆、达尔马提亚、西尔米翁—萨瓦河、贝尔格莱德—莫拉瓦）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_5: "“亚洲门户”的旧疆回到了帝国：所含5个历史大区（奥普西金、奥普提马顿—马拉吉纳、新堡、色雷西安、米拉萨—梅拉努迪翁）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!个。据载科穆宁朝正是由此收回了小亚细亚西部的沿海。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_6: "“高原诸军区”的旧疆回到了帝国：所含6个历史大区（帕夫拉戈尼亚、安纳托利孔—弗里吉亚、布凯拉里翁、伊科尼翁—吕考尼亚、卡帕多基亚—哈尔西亚农、亚美尼亚孔）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_7: "“幼发拉底防线”的旧疆回到了帝国：所含4个历史大区（塞巴斯提亚—特弗里刻、梅利特内—日耳曼尼西亚、卡尔迪亚—本都沿岸、奇里乞亚）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!个。据载十世纪时帝国的东疆曾推到幼发拉底河；如今幼发拉底防线就此复立。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_8: "“海与岛”的旧疆回到了帝国：所含4个历史大区（凯法利尼亚—爱奥尼亚群岛、爱琴海群岛、克里特、塞浦路斯）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_x: "帝国又收回了一片旧疆。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.a: "宣示旧疆"
 oe_sr.2.a.tt: "这一级各大区里帝国自己拥有、还不是帝国核心的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_core_n')|0]#!处地点成为帝国的核心（别国手里的地不加）\n威望#G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_pres')|0]#!（在所定方略之内，奖励多一档）"
 oe_sr.2.b: "犒赏军团"
 oe_sr.2.b.tt: "[oe_tu_authority|e]#G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_auth')|0]#!（在所定方略之内，奖励多一档）\n帝国得到[ShowModifier('oe_sr_legions')]，持续#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_legion_y')|0]#!年"
 oe_sr.2.c: "安民实边"
 oe_sr.2.c.tt: "这一级各大区里帝国拥有的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_n')|0]#!处地点得到[ShowModifier('oe_sr_old_land')]，持续#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_y')|0]#!年"
 oe_sr.2.d: "安民实边，经营边区"
 oe_sr.2.d.tt: "在#Y [GetCountry('BYZ').Custom('OeSrFsReg')]#!免费开一份#bold #color_yellow 边区经营#!#!档案（不花权威和金币；这一级里帝国荒地最多、又能开档的大区）\n若这一级在所定方略之内，奖励多一档：这一级各大区里帝国拥有的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_n')|0]#!处地点另得[ShowModifier('oe_sr_old_land')]，持续#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_y')|0]#!年\n开不成时（例如档案位已满），改为这一级各大区里帝国拥有的地点得到[ShowModifier('oe_sr_old_land')]"
 oe_sr.3.t: "中兴"
 oe_sr.3.desc_x: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区，当地原来的赋税办法照旧。#!\n\n帝国一方已握有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个历史大区，奥斯曼人已不再比帝国强，或已不复存在。人们开始说，帝国中兴了。那些为衰弱的帝国写下的故事——京城的封锁、苏丹的附庸、色雷斯诸城的失守、最后的围城——只要帝国保持中兴，就不会再来；塞萨洛尼基即使被围，也不会再不战而降。"
 oe_sr.3.a: "举行凯旋式"
 oe_sr.3.a.tt: "威望#G +10#!\n稳定度#G +7#!"
 oe_sr.3.b: "告慰先帝，修缮陵寝与教堂"
 oe_sr.3.b.tt: "正统性#G +10#!\n教士满意度#G +5%#!"
 oe_sr.3.c: "不事张扬"
 oe_sr.3.c.tt: "[oe_tu_authority|e]#G +4#!"
 oe_sr.4.t: "改定方略"
 oe_sr.4.desc_x: "中兴之议定下的方略是#Y [GetCountry('BYZ').Custom('OeSrEmph')]#!。如今朝中有人请求重议：旧疆八级里，哪几级该先用力？方略只能改定一次，改了就不再更动。\n1　色雷斯全境：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2，需要#Y 2#!\n2　希腊本土：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3，需要#Y 3#!\n3　多瑙河防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3，需要#Y 3#!\n4　西北边陲：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4，需要#Y 3#!\n5　亚洲门户：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5，需要#Y 4#!\n6　高原诸军区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6，需要#Y 4#!\n7　幼发拉底防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4，需要#Y 3#!\n8　海与岛：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4，需要#Y 3#!"
 oe_sr.4.a: "西向：巴尔干与多瑙河"
 oe_sr.4.a.tt: "定下方略：西向。第1、2、3、4级旧疆复归时，奖励多一档\n[oe_tu_authority|e]#R −5#!；方略只能改定这一次"
 oe_sr.4.b: "东向：小亚细亚与幼发拉底"
 oe_sr.4.b.tt: "定下方略：东向。第5、6、7级旧疆复归时，奖励多一档\n[oe_tu_authority|e]#R −5#!；方略只能改定这一次"
 oe_sr.4.c: "海上：诸岛与海峡"
 oe_sr.4.c.tt: "定下方略：海上。第8、2级旧疆复归时，奖励多一档\n[oe_tu_authority|e]#R −5#!；方略只能改定这一次"
 oe_sr.4.d: "不立方略"
 oe_sr.4.d.tt: "方略取消：此后各级旧疆复归时都按平常的奖励\n[oe_tu_authority|e]#R −5#!；方略只能改定这一次"
 oe_sr.4.e: "维持原议"
 oe_sr.4.e.tt: "方略不变，不花权威；以后仍可再议一次"
 oe_sr.5.t: "死守还是开城"
 oe_sr.5.desc_a: "奥斯曼人已经合围了塞萨洛尼基，城中坚守的意志也已耗尽，显贵们准备照往例开城议和。守将请命：帝国正当中兴，只要皇帝一声令下，全城愿意再拼死一战。守住的几率是#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_ths_chance')|0]%#!（基础#Y 50%#!；帝国陆军不少于奥斯曼人时#G +15%#!；中兴的方略是西向或海上时#G +10%#!；最低#Y 30%#!，最高#Y 75%#!）。"
 oe_sr.5.desc_d: "奥斯曼人又一次封锁了塞萨洛尼基，城的四周都已落入敌手，城中坚守的意志已经耗尽，守军准备开城。守将请命：帝国正当中兴，只要皇帝一声令下，全城愿意再拼死一战。守住的几率是#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_ths_chance')|0]%#!（基础#Y 50%#!；帝国陆军不少于奥斯曼人时#G +15%#!；中兴的方略是西向或海上时#G +10%#!；最低#Y 30%#!，最高#Y 75%#!）。"
 oe_sr.5.a: "下令死守"
 oe_sr.5.a.tt: "守住的几率：#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_ths_chance')|0]%#!\n守住：围城解除，塞萨洛尼基仍归帝国；威望#G +10#!（皇子坐镇的那次围城，帖撒罗尼迦军区忠诚另#G +5#!）\n守不住：照往例开城：奥斯曼人仍合围着城时，塞萨洛尼基归奥斯曼人；合围已松时，城仍属帝国，按年向苏丹纳款；稳定度#R −7#!"
 oe_sr.5.b: "开城议和"
 oe_sr.5.b.tt: "照往例开城：奥斯曼人仍合围着城时，塞萨洛尼基归奥斯曼人；合围已松时，城仍属帝国，按年向苏丹纳款\n皇子坐镇的那次围城：威望#R −10#!"
 oe_sr.6.t: "塞萨洛尼基的结局"
 oe_sr.6.desc_held: "城守住了：奥斯曼人撤围而去，塞萨洛尼基仍在帝国手中。"
 oe_sr.6.desc_lost: "城没能守住：守军开城，塞萨洛尼基归了奥斯曼人。"
 oe_sr.6.desc_lostharac: "城没能守住，但奥斯曼人的合围已经松动：城仍属帝国，按年向苏丹纳款。"
 oe_sr.6.desc_gave: "城中开城议和，塞萨洛尼基归了奥斯曼人。"
 oe_sr.6.desc_harac: "城中与奥斯曼人议定：城仍属帝国，按年向苏丹纳款。"
 oe_sr.6.a: "知道了"
 oe_sr.6.a.tt: "只是消息，结果已经生效"
 oe_sr.21.t: "亚历山大与粮船"
 oe_sr.21.desc_held: "#F 645年，君士坦斯二世派曼努埃尔率舰队渡海，想夺回埃及；次年事败，曼努埃尔战死。#!\n\n埃及的征伐已经了结，亚历山大在帝国一方手里。京城的牧首提出，亚历山大牧首应由京城推举；科普特人的长老们请求皇帝承认科普特人自己的教会；粮官们只关心尼罗河的粮船能不能年年北上。"
 oe_sr.21.desc_x: "#F 645年，君士坦斯二世派曼努埃尔率舰队渡海，想夺回埃及；次年事败，曼努埃尔战死。#!\n\n埃及的征伐已经了结，可是亚历山大仍不在帝国一方手里，牧首的宝座无从谈起。科普特人的长老们请求皇帝承认科普特人自己的教会；粮官们只关心尼罗河的粮船能不能年年北上。"
 oe_sr.21.a: "由京城牧首推举亚历山大牧首"
 oe_sr.21.a.tt: "威望#G +10#!；教士满意度#G +5%#!\n帝国得到[ShowModifier('oe_sr_eg_see')]，持续#Y 20#!年\n[GetCountry('BYZ').Custom('OeSrEgN')]得到[ShowModifier('oe_sr_eg_unrest')]，持续#Y 10#!年（当地的科普特人不认这位牧首）\n只在亚历山大在帝国一方手里、普世牧首仍由帝国在京城主持时可选"
 oe_sr.21.b: "承认科普特教会"
 oe_sr.21.b.tt: "稳定度#G +7#!；教士满意度#R −5%#!\n[GetCountry('BYZ').Custom('OeSrEgN')]得到[ShowModifier('oe_sr_eg_peace')]，持续#Y 10#!年\n征伐中若推行过正教，这些地点上的[ShowModifier('oe_hc_coptic_conversion')]随之撤去"
 oe_sr.21.c: "尼罗河岁贡"
 oe_sr.21.c.tt: "帝国得到[ShowModifier('oe_hc_grain_ships')]：亚历山大在帝国一方手里时持续#Y 20#!年，否则#Y 10#!年（已有的从现在重新计时）"
 oe_sr.23.t: "罗马主教"
 oe_sr.23.desc_union: "#F 从537年到752年，罗马的主教须得皇帝认可，才能受祝圣。#!\n\n意大利的征伐已经了结。帝国与罗马的合一已经签下，教宗的使节说，合一既成，皇帝理当承认使徒彼得的继承人居于首位。"
 oe_sr.23.desc_avignon: "#F 从537年到752年，罗马的主教须得皇帝认可，才能受祝圣。#!\n\n罗马城已在帝国一方手里，教宗却仍住在阿维尼翁。罗马的教士分成两派：一派请皇帝承认教宗的首席，迎教宗回城；另一派说，城既归了罗马皇帝，就该有一位正教的主教。"
 oe_sr.23.desc_held: "#F 从537年到752年，罗马的主教须得皇帝认可，才能受祝圣。#!\n\n罗马城已在帝国一方手里。教宗的使节请皇帝承认教宗的首席；城里的希腊人和京城的主教们却说，城既归了罗马皇帝，就该有一位正教的主教。"
 oe_sr.23.desc_x: "#F 从537年到752年，罗马的主教须得皇帝认可，才能受祝圣。#!\n\n意大利的征伐已经了结，罗马城却不在帝国一方手里。教宗的使节仍来问：帝国承认不承认教宗的首席？"
 oe_sr.23.a: "承认教宗的首席"
 oe_sr.23.a.tt: "教宗对帝国的好感#G +30#!（#Y 20#!年）；每个天主教国家#G +10#!（#Y 10#!年）\n教士满意度#R −5%#!（正教的教士不满）"
 oe_sr.23.b: "在罗马另立正教主教"
 oe_sr.23.b.tt: "威望#G +25#!；教士满意度#G +5%#!\n教宗对帝国的好感#R −40#!（#Y 20#!年）；每个天主教国家#R −15#!（#Y 10#!年）\n只在罗马城在帝国一方手里时可选"
 oe_sr.23.c: "先不谈这件事"
 oe_sr.23.c.tt: "什么都不变；皇帝没有表态这件事会记下来"
 oe_sr.27.t: "大不里士商路"
 oe_sr.27.desc_heldsz: "#F 627年，希拉克略在尼尼微附近大败波斯军队；卡瓦德随即求和，帝国收回了失去的全部领土。#!\n\n波斯的征伐已经了结，大不里士在帝国一方手里，向东的丝路就从这里出发。穆扎法尔家已并吞因珠，据有设拉子与法尔斯；剩下的波斯诸王派人来问，帝国是要商路，还是要和平。"
 oe_sr.27.desc_held: "#F 627年，希拉克略在尼尼微附近大败波斯军队；卡瓦德随即求和，帝国收回了失去的全部领土。#!\n\n波斯的征伐已经了结，大不里士在帝国一方手里，向东的丝路就从这里出发。剩下的波斯诸王派人来问，帝国是要商路，还是要和平。"
 oe_sr.27.desc_xsz: "#F 627年，希拉克略在尼尼微附近大败波斯军队；卡瓦德随即求和，帝国收回了失去的全部领土。#!\n\n波斯的征伐已经了结，大不里士却仍不在帝国一方手里。穆扎法尔家已并吞因珠，据有设拉子与法尔斯；剩下的波斯诸王派人来问，帝国是要商路，还是要和平。"
 oe_sr.27.desc_x: "#F 627年，希拉克略在尼尼微附近大败波斯军队；卡瓦德随即求和，帝国收回了失去的全部领土。#!\n\n波斯的征伐已经了结，大不里士却仍不在帝国一方手里。剩下的波斯诸王派人来问，帝国是要商路，还是要和平。"
 oe_sr.27.a: "重开丝路"
 oe_sr.27.a.tt: "帝国得到[ShowModifier('oe_sr_silk_road')]，持续#Y 20#!年；大不里士在帝国一方手里时改为加倍的[ShowModifier('oe_sr_silk_road_2')]"
 oe_sr.27.b: "与波斯诸王讲和通商"
 oe_sr.27.b.tt: "首都在波斯与两河、不属帝国一方的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_pe_n')|0]#!个国家对帝国的好感#G +25#!（#Y 10#!年）\n帝国得到[ShowModifier('oe_sr_persia_peace')]，持续#Y 10#!年"
 oe_sr.28.t: "热那亚商站"
 oe_sr.28.desc_held: "#F 1261年的宁菲昂条约给了热那亚人在帝国各地关税上的优待。#!\n\n黑海的征伐已经了结，卡法在帝国一方手里，热那亚人的商站、仓栈和账房都等着新主人。"
 oe_sr.28.desc_gen: "#F 1261年的宁菲昂条约给了热那亚人在帝国各地关税上的优待。#!\n\n黑海的征伐已经了结。卡法仍是热那亚人的，可草原上的商路已经由帝国一方说了算。"
 oe_sr.28.desc_x: "#F 1261年的宁菲昂条约给了热那亚人在帝国各地关税上的优待。#!\n\n黑海的征伐已经了结。卡法既不在帝国一方手里，也不在热那亚人手里；草原上的商路却已由帝国一方说了算。"
 oe_sr.28.a: "交给罗马商社经营"
 oe_sr.28.a.tt: "商社的基金增加#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_bs_amt')|0]#!金币、自主#Y +3#!（京城商人或外国合伙的章程）；皇家专营的商社则把这#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_bs_amt')|0]#!金币直接交进国库\n数额：#Y 4#!个月的收入，卡法在帝国一方手里时#Y 6#!个月"
 oe_sr.28.b: "准许热那亚人重回黑海"
 oe_sr.28.b.tt: "热那亚的商业特权升一档（帝国少收一些关税，见意大利商业特权一线）\n热那亚对帝国的好感#G +30#!（#Y 10#!年）"
 oe_sr.28.c: "设黑海商务官"
 oe_sr.28.c.tt: "帝国得到[ShowModifier('oe_sr_bs_customs')]，持续#Y 20#!年；卡法在帝国一方手里时改为加倍的[ShowModifier('oe_sr_bs_customs_2')]"
 oe_sr_change_emph: "中兴之业"
 oe_sr_change_emph_card: "八级旧疆的进度（悬停查看）；方略可以改定一次。"
 oe_sr_change_emph_desc: "中兴之业的进度：#Y [GetCountry('BYZ').Custom('OeSrTier')]#!，已复归历史大区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个（段1要#Y 8#!个，段2要#Y 15#!个）；方略：#Y [GetCountry('BYZ').Custom('OeSrEmph')]#!。\n1　色雷斯全境：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2，需要#Y 2#!\n2　希腊本土：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3，需要#Y 3#!\n3　多瑙河防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3，需要#Y 3#!\n4　西北边陲：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4，需要#Y 3#!\n5　亚洲门户：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5，需要#Y 4#!\n6　高原诸军区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6，需要#Y 4#!\n7　幼发拉底防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4，需要#Y 3#!\n8　海与岛：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4，需要#Y 3#!\n下一级：[GetCountry('BYZ').Custom('OeSrNext')]。\n点击可以改定一次方略：花费#R 5#![oe_tu_authority|e]（只在选了新方略时扣），方略内的各级复归时奖励多一档。"
 oe_sr_change_emph_tt: "朝中重议中兴的方略（弹出“改定方略”；选了新方略才扣权威）"
 oe_sr_allow_emph: "中兴之议已经答复"
 oe_sr_allow_once: "方略还没有改定过"
 oe_sr_allow_open: "没有正在议的“改定方略”"
 oe_sr_allow_auth: "至少5点帝国权威"
