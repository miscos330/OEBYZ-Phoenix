 oe_sr_ct_goal_egypt: "埃及征伐的目标“亚历山大与粮船”：握有亚历山大，才能由京城牧首推举亚历山大牧首，粮船之利也加倍"
 oe_sr_ct_goal_italy: "意大利征伐的目标“罗马主教”：握有罗马，才能在那里另立正教主教"
 oe_sr_ct_goal_persia: "波斯征伐的目标“大不里士商路”：握有大不里士，重开的丝路之利加倍"
 oe_sr_ct_goal_blacksea: "黑海征伐的目标“热那亚商站”：握有卡法，商站的收益与商务官的关税都更多"
