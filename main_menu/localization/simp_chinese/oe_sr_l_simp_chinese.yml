 oe_sr_ct_next1: "第1级“色雷斯全境”：所含2个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!个，需要#Y 2#!个（菲利波波利斯—罗多彼、安基阿洛斯）"
 oe_sr_ct_next2: "第2级“希腊本土”：所含3个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!个，需要#Y 3#!个（尼科波利斯、希腊—底比斯、伯罗奔尼撒）"
 oe_sr_ct_next3: "第3级“多瑙河防线”：所含3个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!个，需要#Y 3#!个，其中须有下多瑙河—帕里斯特里翁（下多瑙河—帕里斯特里翁、塞尔迪卡、斯科普里—奥赫里德）"
 oe_sr_ct_next4: "第4级“西北边陲”：所含4个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!个，需要#Y 3#!个（都拉齐翁—阿夫隆、达尔马提亚、西尔米翁—萨瓦河、贝尔格莱德—莫拉瓦）"
 oe_sr_ct_next5: "第5级“亚洲门户”：所含5个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!个，需要#Y 4#!个（奥普西金、奥普提马顿—马拉吉纳、新堡、色雷西安、米拉萨—梅拉努迪翁）"
 oe_sr_ct_next6: "第6级“高原诸军区”：所含6个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!个，需要#Y 4#!个（帕夫拉戈尼亚、安纳托利孔—弗里吉亚、布凯拉里翁、伊科尼翁—吕考尼亚、卡帕多基亚—哈尔西亚农、亚美尼亚孔）"
 oe_sr_ct_next7: "第7级“幼发拉底防线”：所含4个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!个，需要#Y 3#!个，其中须有塞巴斯提亚—特弗里刻、梅利特内—日耳曼尼西亚（塞巴斯提亚—特弗里刻、梅利特内—日耳曼尼西亚、卡尔迪亚—本都沿岸、奇里乞亚）"
 oe_sr_ct_next8: "第8级“海与岛”：所含4个大区已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!个，需要#Y 3#!个（凯法利尼亚—爱奥尼亚群岛、爱琴海群岛、克里特、塞浦路斯）"
 oe_sr_ct_next_all: "八级旧疆都已复归"
 oe_sr.1.t: "中兴之议"
 oe_sr.1.desc_l: "#F 1333年，安德洛尼卡三世收回了色萨利北部和东部；1340年，伊庇鲁斯也回到了帝国。#!\n\n如今帝国一方握有的历史大区已有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个，京城也在帝国手里。朝中议论下一步往哪里用力。中兴之业分八级旧疆，每一级的大区回到帝国手里，都会有一番庆贺与赏赐：\n1　色雷斯全境：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2，需要#Y 2#!\n2　希腊本土：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3，需要#Y 3#!\n3　多瑙河防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3，需要#Y 3#!\n4　西北边陲：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4，需要#Y 3#!\n5　亚洲门户：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5，需要#Y 4#!\n6　高原诸军区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6，需要#Y 4#!\n7　幼发拉底防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4，需要#Y 3#!\n8　海与岛：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4，需要#Y 3#!"
 oe_sr.1.desc_x: "#F 1333年，色萨利的豪强死后，安德洛尼卡三世收回了色萨利北部和东部，派总督治理。#!\n\n如今帝国一方握有的历史大区已有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个，京城也在帝国手里。朝中议论下一步往哪里用力。中兴之业分八级旧疆，每一级的大区回到帝国手里，都会有一番庆贺与赏赐：\n1　色雷斯全境：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2，需要#Y 2#!\n2　希腊本土：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3，需要#Y 3#!\n3　多瑙河防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3，需要#Y 3#!\n4　西北边陲：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4，需要#Y 3#!\n5　亚洲门户：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5，需要#Y 4#!\n6　高原诸军区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6，需要#Y 4#!\n7　幼发拉底防线：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4，需要#Y 3#!\n8　海与岛：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4，需要#Y 3#!"
 oe_sr.1.a: "西向：巴尔干与多瑙河"
 oe_sr.1.a.tt: "定下方略：西向。第1、2、3、4级旧疆复归时，奖励多一档\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.1.b: "东向：小亚细亚与幼发拉底"
 oe_sr.1.b.tt: "定下方略：东向。第5、6、7级旧疆复归时，奖励多一档\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.1.c: "海上：诸岛与海峡"
 oe_sr.1.c.tt: "定下方略：海上。第8、2级旧疆复归时，奖励多一档\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.1.d: "不立方略"
 oe_sr.1.d.tt: "[oe_tu_authority|e]#G +2#!\n八级旧疆从此开列，每年一月核对一次"
 oe_sr.2.t: "旧疆复归"
 oe_sr.2.desc_1: "#F 1333年，色萨利的豪强死后，安德洛尼卡三世收回了色萨利北部和东部，派总督治理。#!\n\n“色雷斯全境”的旧疆回到了帝国：所含2个历史大区（菲利波波利斯—罗多彼、安基阿洛斯）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_2l: "#F 1349年，约翰六世把摩里亚交给儿子曼努埃尔治理，帝国在希腊南部又有了一位坐镇的宗室。#!\n\n“希腊本土”的旧疆回到了帝国：所含3个历史大区（尼科波利斯、希腊—底比斯、伯罗奔尼撒）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_2: "“希腊本土”的旧疆回到了帝国：所含3个历史大区（尼科波利斯、希腊—底比斯、伯罗奔尼撒）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_3: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区，当地原来的赋税办法照旧。#!\n\n“多瑙河防线”的旧疆回到了帝国：所含3个历史大区（下多瑙河—帕里斯特里翁、塞尔迪卡、斯科普里—奥赫里德）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!个。多瑙河防线就此复立。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_4: "“西北边陲”的旧疆回到了帝国：所含4个历史大区（都拉齐翁—阿夫隆、达尔马提亚、西尔米翁—萨瓦河、贝尔格莱德—莫拉瓦）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_5: "“亚洲门户”的旧疆回到了帝国：所含5个历史大区（奥普西金、奥普提马顿—马拉吉纳、新堡、色雷西安、米拉萨—梅拉努迪翁）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!个。据载科穆宁朝正是由此收回了小亚细亚西部的沿海。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_6: "“高原诸军区”的旧疆回到了帝国：所含6个历史大区（帕夫拉戈尼亚、安纳托利孔—弗里吉亚、布凯拉里翁、伊科尼翁—吕考尼亚、卡帕多基亚—哈尔西亚农、亚美尼亚孔）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_7: "“幼发拉底防线”的旧疆回到了帝国：所含4个历史大区（塞巴斯提亚—特弗里刻、梅利特内—日耳曼尼西亚、卡尔迪亚—本都沿岸、奇里乞亚）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!个。据载十世纪时帝国的东疆曾推到幼发拉底河；如今幼发拉底防线就此复立。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_8: "“海与岛”的旧疆回到了帝国：所含4个历史大区（凯法利尼亚—爱奥尼亚群岛、爱琴海群岛、克里特、塞浦路斯）里，已复归#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!个。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.desc_x: "帝国又收回了一片旧疆。皇帝要定下怎样庆贺这件事。"
 oe_sr.2.a: "宣示旧疆"
 oe_sr.2.a.tt: "这一级各大区里帝国自己拥有、还不是帝国核心的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_core_n')|0]#!处地点成为帝国的核心（别国手里的地不加）\n威望#G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_pres')|0]#!（在所定方略之内，奖励多一档）"
 oe_sr.2.b: "犒赏军团"
 oe_sr.2.b.tt: "[oe_tu_authority|e]#G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_auth')|0]#!（在所定方略之内，奖励多一档）\n帝国得到[ShowModifier('oe_sr_legions')]，持续#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_legion_y')|0]#!年"
 oe_sr.2.c: "安民实边"
 oe_sr.2.c.tt: "这一级各大区里帝国拥有的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_n')|0]#!处地点得到[ShowModifier('oe_sr_old_land')]，持续#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_y')|0]#!年"
 oe_sr.3.t: "中兴"
 oe_sr.3.desc_x: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区，当地原来的赋税办法照旧。#!\n\n帝国一方已握有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#!个历史大区，奥斯曼人已不再比帝国强，或已不复存在。人们开始说，帝国中兴了。"
 oe_sr.3.a: "举行凯旋式"
 oe_sr.3.a.tt: "威望#G +10#!\n稳定度#G +7#!"
 oe_sr.3.b: "告慰先帝，修缮陵寝与教堂"
 oe_sr.3.b.tt: "正统性#G +10#!\n教士满意度#G +5%#!"
 oe_sr.3.c: "不事张扬"
 oe_sr.3.c.tt: "[oe_tu_authority|e]#G +4#!"
