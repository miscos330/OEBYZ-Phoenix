l_simp_chinese:
 # Project Phoenix v31.0 WP35: 7 Famous Chinese Academies & Ancient Temples.
 oe_wp35_ming_yuelu_hall: "岳麓书院御书楼"
 oe_wp35_ming_yuelu_hall_desc: "坐落于长沙岳麓山下的千年书院御书楼，藏书浩瀚、讲学不绝，乃湖湘理学文脉重镇。"
 oe_wp35_ming_bailudong_academy: "白鹿洞书院"
 oe_wp35_ming_bailudong_academy_desc: "位于星子庐山五老峰下，经朱熹重兴并手订《白鹿洞书院揭示》，为天下四大书院之首。"
 oe_wp35_ming_songyang_academy: "嵩阳书院"
 oe_wp35_ming_songyang_academy_desc: "雄踞登封嵩山南麓、汉柏参天，二程兄弟曾于此传道授业，乃中原程朱理学发祥圣地。"
 oe_wp35_ming_yingtianfu_academy: "应天府书院"
 oe_wp35_ming_yingtianfu_academy_desc: "矗立于睢阳归德，范仲淹曾于此苦读执掌教席，开创宋明州府官办书院与科举育才先声。"
 oe_wp35_ming_shaolin_temple: "嵩山少林寺"
 oe_wp35_ming_shaolin_temple_desc: "隐于登封少室山密林，乃禅宗祖庭，亦以武僧戒律森严、护法卫国闻名海内。"
 oe_wp35_ming_baima_temple: "洛阳白马寺"
 oe_wp35_ming_baima_temple_desc: "始建于东汉永平年间的洛阳白马寺，素有“中国第一古刹”与释源祖庭之誉，译经传法绵延千载。"
 oe_wp35_ming_qufu_kongmiao: "曲阜孔庙杏坛奎文阁"
 oe_wp35_ming_qufu_kongmiao_desc: "曲阜孔庙核心之杏坛与奎文阁，珍藏历代御制碑刻与儒家典籍，乃礼乐教化万世宗师之所。"
 oe_wp35_ming_academies_patronage: "颁赐天下名院古刹御匾"
 oe_wp35_ming_academies_patronage.title: "颁赐天下名院古刹御匾"
 oe_wp35_ming_academies_patronage.desc: "向岳麓、白鹿洞、嵩阳、应天府四大书院及少林、白马、曲阜孔庙颁赐御书典籍与学田，弘扬华夏文教与千年古刹正脉。"
 oe_wp35_ming_academies_patronage.a: "钦派词臣颁赐御匾与经籍"
 oe_wp35_ming.1.title: "四大书院与名刹重光"
 oe_wp35_ming.1.desc: "自庐山五老峰云雾缭绕的白鹿洞书院、湘水之畔弦歌不绝的岳麓御书楼，至嵩山汉柏掩映的嵩阳书院、睢阳应天府书院，以及少林寺、洛阳白马寺与曲阜孔庙杏坛奎文阁，御赐金匾与官刻经籍令九州文教气象焕然一新。天下大儒、名山高僧与乡里士绅齐颂圣恩，恭请朝廷明定兴学育才与护持礼乐之长远方略。"
 oe_wp35_ming.1.a: "兴办书院讲学，广育经世济民之鸿儒"
 oe_wp35_ming.1.b: "护持千年古刹与圣庙礼乐，涵养海内民心"
 oe_wp35_ming.1.c: "特聘天下第一书院山长入朝总领文教编修"
 oe_wp35_ming.2.title: "天下书院科举与注疏大成"
 oe_wp35_ming.2.desc: "御赐学田、官刻经籍与金匾颁行天下四大书院及千年名刹八月之后，满载新刻五经注疏、各省方志图籍的书船与大批负笈饱学举子云集京师。礼部主考与翰林诸臣欣然奏报，本届会试策论气象宏阔、实务精当，人才济济远胜往科；朝廷正可借此文运大兴之良机，刊行新典普惠府州，或破格录用状元奇才以治天下。"
 oe_wp35_ming.2.a: "刊行新订经籍注疏颁行天下府州官学"
 oe_wp35_ming.2.b: "盛典嘉奖文教功臣以彰皇朝礼乐正统"
 oe_wp35_ming.2.c: "破格简拔本届翘楚进士入值御前参赞庶政"
 STATIC_MODIFIER_NAME_oe_wp35_mod_ming_academies_patronage: "御赐天下书院文教"
 STATIC_MODIFIER_DESC_oe_wp35_mod_ming_academies_patronage: "四大书院御书藏典与学田供养令科研进度、文化传统与内阁效率齐升。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_ming_monastic_sanctuary: "护持华夏名刹礼乐"
 STATIC_MODIFIER_DESC_oe_wp35_mod_ming_monastic_sanctuary: "少林、白马与曲阜孔庙的隆重礼遇增强国家安定、正统宽容与地方守御。"
