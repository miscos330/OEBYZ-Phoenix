 oe_react.13.desc:0 "盛大的王室联姻令京师旌旗招展、外使云集，按约送抵的丰厚嫁妆亦已入库。礼部与户部各献良策，商议如何借此良缘为王朝谋取最长远的威望与实利。"
 oe_react.13.a:0 "大兴礼乐外交，广结邦交声誉"
 oe_react.13.b:0 "收储嫁妆实银，充实国库民生"
 oe_react.14.title:0 "议会法案势头与宪政新机"
 oe_react.14.desc:0 "重磅法案在议会以压倒性多数通过，堂内掌声雷动。力主革新的议员纷纷进言，劝请君主趁此君臣同心、各等级融洽的良机，一举夯实法度根基或大兴公共工程。"
 oe_react.14.a:0 "固化议会共识，稳固朝野法度"
 oe_react.14.b:0 "借议会拨款势头，大兴全国基建"
 oe_react.15.title:0 "海疆寇警：倭寇与巴巴里掠夺者"
 oe_react.15.desc:0 "雾霭之中，吃水极浅的倭寇快船与巴巴里海盗船频频出没于近海航道，劫掠商船、袭扰渔港并焚毁盐仓。水师提督与沿海督抚急请御裁：是出动巡洋舰队正面清剿、颁布反制私掠状以盗制盗，还是加固岸防堡垒？"
 oe_react.15.a:0 "拨款整备靖海巡洋分舰队"
 oe_react.15.b:0 "颁行反制私掠状，以战养战"
 oe_react.15.c:0 "加固港防炮台与沿海烽燧"
 oe_react.16.title:0 "靖海巡洋凯旋"
 oe_react.16.desc:0 "炮火轰鸣穿透海雾，我军巡洋战舰在隐秘岛湾成功截击海寇主力。多艘海盗快船焚毁沉没，沿海商帮与港口居民欢欣鼓舞，翘首期盼海疆重归太平。"
 oe_react.16.a:0 "设立常备护航水道，永靖海疆"
 oe_react.16.b:0 "变卖缴获盗船货载充实府库"
 oe_react.17.title:0 "草原与边疆自由佣兵团效命"
 oe_react.17.desc:0 "骁勇的哥萨克游骑、解甲老兵与纵横边塞的自由佣兵团驻扎于关外，其首领遣使献策：若朝廷愿签五年军约或赐予边疆屯垦荒地，全团精锐愿为王师冲锋陷阵。"
 oe_react.17.a:0 "签约雇佣，即刻编入麾下客军"
 oe_react.17.b:0 "赐予边镇荒地，收编为戍边屯骑"
 oe_react.17.c:0 "谢绝外佣，严整本土王师军纪"
 oe_react.18.title:0 "大自由佣兵团特许状"
 oe_react.18.desc:0 "受雇自由佣兵团在边疆苦战中屡建奇功，诸位团长联名恳请王室颁授正式特许敕书。既可将其册封为长期低饷的常备客军，亦可将其中资深教官直接吸纳入常备正军序列。"
 oe_react.18.a:0 "颁授敕书，确立常备客军特权"
 oe_react.18.b:0 "延揽老练团长出任常备军教官"
