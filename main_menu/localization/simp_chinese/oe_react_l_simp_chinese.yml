 oe_react.1.title:0 "陷城难民潮"
 oe_react.1.desc:0 "失陷要塞的残垣仍在冒烟。绵延不绝的市民、织工与乡绅携家带口涌向京畿驰道，怀里紧抱着敌军入城前抢出的生计器物与传家细软。朝廷必须即刻决断如何安置这股战火流民。"
 oe_react.1.a:0 "广开城门，统筹安置迁徙"
 oe_react.1.b:0 "编入青壮，充实余城守御"
 oe_react.2.title:0 "秘档与圣物西迁"
 oe_react.2.desc:0 "敌军重炮轰开重镇外郭之际，学者、典史与教士趁着暮色护送满载泥金典籍、户籍册簿、圣像与府库银器的马车撤过石桥。究竟是倾力护送文脉与学者安抵后方，还是熔铸银器以充军饷？"
 oe_react.2.a:0 "拨款护送学者与秘藏手稿"
 oe_react.2.b:0 "熔银改铸军饷以解燃眉之急"
 oe_react.3.title:0 "珍宝遭劫与赎回议案"
 oe_react.3.desc:0 "坏消息传回宫廷：我国一件举世无双的传世珍宝已在战乱中被敌军掳走。中立商贾密报称，若秘密遣使重金赎买仍有望挽回珍品；而前线将领怒斥此等奇耻大辱唯有以血雪恨。"
 oe_react.3.a:0 "密遣商使出资赎还国宝"
 oe_react.3.b:0 "铭记国耻，誓以铁血讨还"
 oe_react.4.title:0 "惨败震荡与议会风波"
 oe_react.4.desc:0 "加盖黑漆火印的败报令朝野震动。野战惨败的消息刚抵京师，贵族代表与城邦巨贾便齐聚议事堂，严厉质询军费账目、将帅任免与各省征兵额度，要求朝廷立刻给出交代。"
 oe_react.4.a:0 "适度让权妥协，稳住后方大局"
 oe_react.4.b:0 "颁布战时军管，收拢统帅大权"
 oe_react.5.title:0 "重整山河之誓"
 oe_react.5.desc:0 "虽经一场惨烈败绩、折损无数旌旗，然王朝根基尚在。老练军官正于渡口收拢溃兵，军议会上争论不休：究竟应当即刻整训军制革新战法，还是号召各省义勇死守腹地？"
 oe_react.5.a:0 "痛定思痛，革新操典与军官团"
 oe_react.5.b:0 "号召四方义勇与辎重驰援前线"
 oe_react.6.title:0 "战前通牒与边防总动员"
 oe_react.6.desc:0 "边关密探快马急报：敌军先头部队已于界碑之外完成集结，正式宣战书不日将至。枢密院尚有最后片刻窗口，可抢先点燃边防烽燧或向列国宫廷揭露敌方挑衅。"
 oe_react.6.a:0 "点燃烽燧，抢先充实边关防务"
 oe_react.6.b:0 "急发外交照会，争取国际声援"
 oe_react.7.title:0 "内乱阴影下的边疆伺机者"
 oe_react.7.desc:0 "内战骤起，外围边镇的豪强与伺机而动的掠夺者顿时蠢蠢欲动。若朝廷不能火速安抚忠于王室的边防驻军，或颁布分化瓦解叛党的宽赦之令，恐将酿成内外夹击之危。"
 oe_react.7.a:0 "急拨重饷，牢牢稳住边镇守军"
 oe_react.7.b:0 "颁布特赦诏书，招抚摇摆城邑"
