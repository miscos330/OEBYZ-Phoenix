 oe_react.8.a:0 "官设驿馆商站，放大通衢红利"
 oe_react.8.b:0 "统一度量关津，广收商路厘金"
 oe_react.9.title:0 "传世杰作问世与艺文盛世"
 oe_react.9.desc:0 "王公、学士与外国使节齐聚艺苑，争相瞻仰我国新近落成的传世杰作。此作美名正随商路传遍四海，向天下宣告本朝正步入礼乐昌明的艺文黄金时代。"
 oe_react.9.a:0 "御赐资金，设立百工大师行会"
 oe_react.9.b:0 "陈列国宾殿堂，弘扬王朝威仪"
