l_simp_chinese:
 oe_flavor_byz.1002.t: "奥斯马里斯家族的皈依"
 oe_flavor_byz.1002.d: "三年过去，曾经的贝伊家族已渐渐习惯君士坦丁堡的钟声。今日，他们身着罗马式衣袍来到教堂，在祭司面前领受洗礼，公开承认东正教信仰。族中子弟习读希腊文，家中的礼俗亦随罗姆人的生活而改变。\n\n他们请求皇帝认可这场转变，并以希腊式姓氏“奥斯马里斯”载入簿册，使昔日的敌手成为帝国的臣民。洗礼可以接纳灵魂；宫廷是否愿意接纳这支家族，仍由我们决定。"
 oe_flavor_byz.1002.a: "接纳他们，旧日的仇敌也能成为罗马的子民。"
 oe_flavor_byz.1002.a.tt: "权威：#G +2#!。\n#Y 开启奥斯马里斯家族事件链#!。奥斯马里斯家族全体在世成员信奉#Y 东正教#!、采用#Y 罗姆文化#!；后续出生或登场的该家族成员同样适用。"
 oe_flavor_byz.1002.b: "洗礼不足以换取信任，驱逐他们。"
 oe_osman_expel.tt: "奥斯马里斯家族全体在世成员从游戏中消失；取消尚未发生的皈依，并永久关闭这条事件链。"
 oe_osman_arrived: "奥斯马里斯家族已迁入帝国"
