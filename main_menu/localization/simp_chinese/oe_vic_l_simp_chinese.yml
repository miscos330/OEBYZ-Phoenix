l_simp_chinese:
# NEW 2026-11-23 v21.0 Batch 2 True Building-Type Viceroyalties (oe_vic_, gen_v210_building_viceroys.py) — simp_chinese localization (225 keys). Edit gen_v210_building_viceroys.py, not this file.
 DLD:0 "德干伊克塔总督府"
 DLD_ADJ:0 "德干总督"
 oe_vic_name_qutlugh_khan:0 "忽都鲁汗"
 oe_vic_seat_dld:0 "德干道拉塔巴德总督衙署"
 oe_vic_seat_dld_desc:0 "德里苏丹国德干伊克塔总督在道拉塔巴德（德瓦吉里）山城设立的驻节衙署与常备兵营，统摄南方军政而不分割苏丹直辖土地。"
 DLG:0 "古吉拉特伊克塔总督府"
 DLG_ADJ:0 "古吉拉特总督"
 oe_vic_name_muqbil_gujarat:0 "马利克·穆克比勒"
 oe_vic_seat_dlg:0 "坎贝古吉拉特总督衙署"
 oe_vic_seat_dlg_desc:0 "德里苏丹国派驻坎贝港的古吉拉特伊克塔总督驻节衙署，监理阿拉伯海港关税与西岸驻军，领土仍归德里直辖。"
 DLM:0 "摩腊婆伊克塔总督府"
 DLM_ADJ:0 "摩腊婆总督"
 oe_vic_name_shihab_malwa:0 "马利克·希哈卜丁"
 oe_vic_seat_dlm:0 "达尔摩腊婆总督衙署"
 oe_vic_seat_dlm_desc:0 "德里苏丹国在摩腊婆高原重镇达尔设立的伊克塔总督衙署，扼守通往德干与古吉拉特的陆路咽喉并维系常备驻军。"
 DLJ:0 "东方—章普尔伊克塔总督府"
 DLJ_ADJ:0 "章普尔总督"
 oe_vic_name_ain_ul_mulk:0 "艾因·穆勒克"
 oe_vic_seat_dlj:0 "章普尔东方总督衙署"
 oe_vic_seat_dlj_desc:0 "德里苏丹国派驻恒河中游章普尔—阿瓦德的东方总督衙署，负责征调东线粮饷与镇守孟加拉门户。"
 DLP:0 "旁遮普—木尔坦边疆总督府"
 DLP_ADJ:0 "木尔坦边督"
 oe_vic_name_imad_ul_mulk:0 "伊马德·穆勒克·萨尔提兹"
 oe_vic_seat_dlp:0 "木尔坦西北边疆总督府"
 oe_vic_seat_dlp_desc:0 "德里苏丹国设于木尔坦的印度河防线总督堡垒，常备轻骑斥候抵御来自中亚与信德方向的入侵。"
 MMD:0 "大马士革副王府"
 MMD_ADJ:0 "大马士革副王"
 oe_vic_name_tankiz:0 "坦基兹·胡萨米"
 oe_vic_seat_mmd:0 "大马士革副王阿布拉克宫署"
 oe_vic_seat_mmd_desc:0 "马穆鲁克大马士革副王在城内设立的阿布拉克宫衙署，统摄叙利亚首席军务、驿站与商队护卫，土地仍归开罗苏丹直辖。"
 MMH:0 "阿勒颇副王府"
 MMH_ADJ:0 "阿勒颇副王"
 oe_vic_name_altunbugha_aleppo:0 "阿尔通布哈·纳西里"
 oe_vic_seat_mmh:0 "阿勒颇城堡副王衙署"
 oe_vic_seat_mmh_desc:0 "马穆鲁克北叙利亚副王驻节于阿勒颇大城堡的军政衙署，屏藩安纳托利亚与幼发拉底河防线。"
 MMK:0 "卡拉克—南叙利亚副王府"
 MMK_ADJ:0 "卡拉克副王"
 oe_vic_name_bahadir_karak:0 "巴哈迪尔·巴德里"
 oe_vic_seat_mmk:0 "卡拉克岩堡副王府"
 oe_vic_seat_mmk_desc:0 "马穆鲁克南叙利亚副王驻节于卡拉克山崖巨堡的军政衙署，控扼开罗、大马士革与汉志朝觐大道之间的枢纽。"
 HNT:0 "特兰西瓦尼亚沃伊沃德总督府"
 HNT_ADJ:0 "特兰西瓦尼亚总督"
 oe_vic_name_tamas_szecsenyi:0 "塞切尼·陶马什"
 oe_vic_seat_hnt:0 "阿尔巴尤利亚沃伊沃德总督署"
 oe_vic_seat_hnt_desc:0 "匈牙利国王设于阿尔巴尤利亚（久洛费海尔瓦尔）的特兰西瓦尼亚沃伊沃德衙署，统筹东线防务与议会，土地仍属匈牙利王冠直辖。"
 CST:0 "圣地亚哥—卡拉特拉瓦骑士团领"
 CST_ADJ:0 "卡斯蒂利亚骑士团"
 oe_vic_name_juan_nunez_prado:0 "胡安·努涅斯·德·普拉多"
 oe_vic_seat_cst:0 "卡拉特拉瓦骑士团总团部"
 oe_vic_seat_cst_desc:0 "圣地亚哥与卡拉特拉瓦骑士团在拉曼恰前沿卡拉特拉瓦堡设立的总团部与骑兵训练场，领土仍归卡斯蒂利亚王室直辖。"
 CSG:0 "安达卢西亚前沿督军区"
 CSG_ADJ:0 "安达卢西亚前沿"
 oe_vic_name_gonzalo_martinez:0 "贡萨洛·马丁内斯"
 oe_vic_seat_csg:0 "科尔多瓦前沿督军府"
 oe_vic_seat_csg_desc:0 "卡斯蒂利亚国王设于科尔多瓦的安达卢西亚前沿督军府（避开塞维利亚海贸事件检查），常备轻骑边军监控格拉纳达防线。"
 TIG:0 "提格雷海王总督府"
 TIG_ADJ:0 "提格雷海王"
 oe_vic_name_degna_mikael:0 "德格纳·米迦勒"
 oe_vic_seat_tig:0 "阿克苏姆提格雷海王府"
 oe_vic_seat_tig_desc:0 "所罗门王朝设于北部圣城阿克苏姆的海王（巴赫尔·内加什）总督府，监理红海盐铁香料商道与北境守备，土地仍归皇帝直辖。"
 oe_vic_seat_maintain:0 "总督治所行政维持"
 oe_vic_seat_maintain_desc:0 "维系总督治所衙署日常运作所需的文书纸张、簿记书吏与驻军账房开支。"
 oe_dlh_iqta:0 "伊克塔行省总督府"
 oe_dlh_iqta_desc:0 "德里苏丹国派驻行省重镇的建筑型伊克塔总督府。总督在治所持有驻军衙署并可就地招募常备军团，辖境土地与户口仍完全归苏丹国直辖；忠顺时协防并响应征调，离心时削弱地方控御。"
 LEAD_oe_dlh_iqta:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_dlh_iqta:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_dlh_iqta_call_tt:0 "总督府处于恭顺档位时，可应德里苏丹征调参与进攻战争。"
 oe_dlh_iqta_defend_tt:0 "总督府处于如常或恭顺档位时，将自动出兵协防德里苏丹国。"
 oe_vic_dlh_iqta_reform:0 "伊克塔行省总督体制"
 oe_vic_dlh_iqta_reform_desc:0 "由德里苏丹授予行省总督的建筑型军政驻节体制，依靠治所衙署与军粮补给维系地方常备驻军，而土地所有权仍归德里中枢。"
 oe_mam_niyabat:0 "叙利亚副王府"
 oe_mam_niyabat_desc:0 "马穆鲁克苏丹国派驻大叙利亚重镇的建筑型副王（纳伊布）总督府。副王在堡垒治所统领马穆鲁克常备驻军并维护驿道与商税，领土仍归开罗苏丹直辖；开罗政变时副王忠顺与否往往左右帝国存亡。"
 LEAD_oe_mam_niyabat:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_mam_niyabat:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_mam_niyabat_call_tt:0 "副王府处于恭顺档位时，可应马穆鲁克苏丹征调出征。"
 oe_mam_niyabat_defend_tt:0 "副王府处于如常或恭顺档位时，将出兵协防马穆鲁克苏丹国。"
 oe_vic_mam_niyabat_reform:0 "纳伊布副王驻节制"
 oe_vic_mam_niyabat_reform_desc:0 "开罗苏丹派驻叙利亚重镇的副王军政驻节体制，保障前线堡垒驻军粮饷与轻重骑战备，而不分割苏丹直辖领土。"
 oe_mam_sharifate:0 "两圣地谢里夫保护国"
 oe_mam_sharifate_desc:0 "受开罗苏丹护持的哈希姆谢里夫保护国（麦加与麦地那）。不可被随意吞并，仅占极低外交容量，以朝觐商道与两圣地监护权为宗主带来尊崇威望、宗教影响力与外交声誉。"
 LEAD_oe_mam_sharifate:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_mam_sharifate:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_hun_voivodate:0 "王室沃伊沃德总督府"
 oe_hun_voivodate_desc:0 "匈牙利国王委任特兰西瓦尼亚沃伊沃德统摄喀尔巴阡东疆的建筑型总督府。土地仍属匈牙利王冠直辖，总督府在阿尔巴尤利亚坐镇防务并协调塞克勒与萨克森边军；若王位继承动荡，则可能引发地方邦国觉醒。"
 LEAD_oe_hun_voivodate:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_hun_voivodate:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_hun_voivodate_call_tt:0 "沃伊沃德总督府处于恭顺档位时，可应匈牙利国王征调参战。"
 oe_hun_voivodate_defend_tt:0 "沃伊沃德总督府处于如常或恭顺档位时，将出兵协防匈牙利王国。"
 oe_vic_hun_voivodate_reform:0 "喀尔巴阡沃伊沃德制"
 oe_vic_hun_voivodate_reform_desc:0 "匈牙利王冠授予特兰西瓦尼亚总督的边防军政驻节体制，强化山地堡垒防卫与驻军维持，同时维持王室对全境的直接领有权。"
 oe_cas_adelantado:0 "前沿督军与骑士团领"
 oe_cas_adelantado_desc:0 "卡斯蒂利亚王室在收复失地前沿设立的建筑型骑士团总团与督军区。不割离王冠领土，而是以卡拉特拉瓦与科尔多瓦要塞为治所维系精锐骑士常备军；内战期间其立场举足轻重，后世王室亦可通过收归团长职完成中央集权。"
 LEAD_oe_cas_adelantado:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_cas_adelantado:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_cas_adelantado_call_tt:0 "骑士团领或督军区处于恭顺档位时，可应卡斯蒂利亚国王征调出征。"
 oe_cas_adelantado_defend_tt:0 "骑士团领或督军区处于如常或恭顺档位时，将自动协防卡斯蒂利亚王冠。"
 oe_vic_cas_adelantado_reform:0 "骑士团与前沿督军宪章"
 oe_vic_cas_adelantado_reform_desc:0 "卡斯蒂利亚前沿骑士团与边疆督军区的建筑型军事宪章，依托堡垒治所维持重骑兵与边防驻军，而不分割王室直属领地。"
 oe_eth_bahr_negash:0 "海王边疆总督府"
 oe_eth_bahr_negash_desc:0 "所罗门王朝埃塞俄比亚派驻提格雷北境、面向红海走廊的建筑型海王（巴赫尔·内加什）总督府。阿克苏姆及北部高地仍归皇帝直辖，海王府统筹红海商路关税与北疆山地守备。"
 LEAD_oe_eth_bahr_negash:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_eth_bahr_negash:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_eth_bahr_negash_call_tt:0 "海王总督府处于恭顺档位时，可应埃塞俄比亚皇帝征调出兵。"
 oe_eth_bahr_negash_defend_tt:0 "海王总督府处于如常或恭顺档位时，将出兵协防所罗门帝国。"
 oe_vic_eth_bahr_negash_reform:0 "提格雷海王边防体制"
 oe_vic_eth_bahr_negash_reform_desc:0 "埃塞俄比亚皇帝授予北疆海王的建筑型边防商贸体制，保障红海商路联通与阿克苏姆高地常备军维持。"
 STATIC_MODIFIER_NAME_oe_vic_seat_loyal_mod:0 "总督恭顺治所"
 STATIC_MODIFIER_DESC_oe_vic_seat_loyal_mod:0 "总督府与中枢同心协力，治所周边城防巩固、税赋按期征缴、常备与地方征召皆井然有序。"
 STATIC_MODIFIER_NAME_oe_vic_seat_restive_mod:0 "总督敷衍治所"
 STATIC_MODIFIER_DESC_oe_vic_seat_restive_mod:0 "总督阳奉阴违、拖延上缴税赋与军需，导致治所周边控制度下降并滋生地方骚动。"
 STATIC_MODIFIER_NAME_oe_vic_seat_defiant_mod:0 "总督离心治所"
 STATIC_MODIFIER_DESC_oe_vic_seat_defiant_mod:0 "行省总督公然截留赋税并勾结地方豪强，严重动摇宗主在治所周边的行政掌控。"
 STATIC_MODIFIER_NAME_oe_vic_subj_compliant_mod:0 "总督府·忠顺奉诏"
 STATIC_MODIFIER_DESC_oe_vic_subj_compliant_mod:0 "总督府谨守敕命、粮饷齐备，驻军士气高昂并积极协防宗主疆域。"
 STATIC_MODIFIER_NAME_oe_vic_subj_restive_mod:0 "总督府·观望懈怠"
 STATIC_MODIFIER_DESC_oe_vic_subj_restive_mod:0 "总督府对中枢政令持观望态度，行政配合趋于迟缓。"
 STATIC_MODIFIER_NAME_oe_vic_subj_defiant_mod:0 "总督府·尾大不掉"
 STATIC_MODIFIER_DESC_oe_vic_subj_defiant_mod:0 "总督府拥兵自重、与中枢渐行渐远，已成帝国边疆离心之患。"
 STATIC_MODIFIER_NAME_oe_vic_audit_harmonized_mod:0 "钦差巡察·总督肃然"
 STATIC_MODIFIER_DESC_oe_vic_audit_harmonized_mod:0 "朝廷派出钦差与账房核查各总督府钱粮并颁赐恩赏，既稳住边疆军心，又整肃了行省税政。"
 STATIC_MODIFIER_NAME_oe_vic_dlh_diwan_centralized_mod:0 "德里迪万中枢集权"
 STATIC_MODIFIER_DESC_oe_vic_dlh_diwan_centralized_mod:0 "苏丹收回诸行省伊克塔总督驻节权，将财赋与军政收归德里迪万官署统一调度，虽令旧贵族不满却极大巩固了中央统治。"
 STATIC_MODIFIER_NAME_oe_vic_mam_cairo_supremacy_mod:0 "开罗城堡独尊体制"
 STATIC_MODIFIER_DESC_oe_vic_mam_cairo_supremacy_mod:0 "苏丹撤销叙利亚三大副王驻节特权，将黎凡特精锐马穆鲁克与要塞防务尽数直隶于开罗城堡。"
 STATIC_MODIFIER_NAME_oe_vic_hun_crown_diet_mod:0 "特兰西瓦尼亚王冠议会宪章"
 STATIC_MODIFIER_DESC_oe_vic_hun_crown_diet_mod:0 "布达王室与特兰西瓦尼亚贵族、塞克勒人及萨克森城镇达成王冠议会协议，既平息了沃伊沃德割据之患，又铸就喀尔巴阡铁壁。"
 STATIC_MODIFIER_NAME_oe_vic_cas_royal_maestrazgo_mod:0 "王室总团长与前沿直辖制"
 STATIC_MODIFIER_DESC_oe_vic_cas_royal_maestrazgo_mod:0 "卡斯蒂利亚国王兼领圣地亚哥与卡拉特拉瓦骑士团总团长并收编安达卢西亚督军区，将骑士团领地财赋与重骑战力尽数纳入王室掌控。"
 STATIC_MODIFIER_NAME_oe_vic_eth_redsea_customs_mod:0 "红海王室关税直管"
 STATIC_MODIFIER_DESC_oe_vic_eth_redsea_customs_mod:0 "所罗门皇帝将提格雷海王总督府收归直辖，设立帝国直属红海商道税关与阿克苏姆常备卫队。"
 STATIC_MODIFIER_NAME_oe_vic_dlh_deccan_charter_mod:0 "德干百户长妥协敕令"
 STATIC_MODIFIER_DESC_oe_vic_dlh_deccan_charter_mod:0 "德里朝廷向道拉塔巴德与德干百户长让渡部分税权以换取效忠与兵员征发，暂时稳住南方战局。"
 STATIC_MODIFIER_NAME_oe_vic_dlh_gujarat_customs_mod:0 "坎贝—摩腊婆商税清丈"
 STATIC_MODIFIER_DESC_oe_vic_dlh_gujarat_customs_mod:0 "德里稽核古吉拉特海港与摩腊婆商路账簿，打通西岸海贸税源并安抚大商贾阶层。"
 STATIC_MODIFIER_NAME_oe_vic_dlh_multan_march_mod:0 "木尔坦印度河防线强化"
 STATIC_MODIFIER_DESC_oe_vic_dlh_multan_march_mod:0 "朝廷增拨军饷扩编木尔坦与章普尔边防骑军，构筑抵御草原南侵与东线叛乱的坚固屏障。"
 STATIC_MODIFIER_NAME_oe_vic_mam_tankiz_regency_mod:0 "坦基兹叙利亚大政"
 STATIC_MODIFIER_DESC_oe_vic_mam_tankiz_regency_mod:0 "大马士革副王坦基兹凭借深厚威望整饬叙利亚驿道、渠务与边防堡垒，令黎凡特商旅不绝。"
 STATIC_MODIFIER_NAME_oe_vic_mam_burji_garrison_mod:0 "布尔吉叙利亚铁骑驻屯"
 STATIC_MODIFIER_DESC_oe_vic_mam_burji_garrison_mod:0 "历经布尔吉政变考验后，开罗与叙利亚各堡垒整编精锐切尔克斯重骑，令马穆鲁克陆军战力焕然一新。"
 STATIC_MODIFIER_NAME_oe_vic_mam_mahmal_prestige_mod:0 "金轿护圣·两圣地监护者"
 STATIC_MODIFIER_DESC_oe_vic_mam_mahmal_prestige_mod:0 "开罗每年隆重护送金轿与埃及粮饷直抵麦加与麦地那谢里夫宫廷，令马穆鲁克苏丹在伊斯兰世界享有无上声望。"
 STATIC_MODIFIER_NAME_oe_vic_hun_voivode_charter_mod:0 "三民族特许边防宪章"
 STATIC_MODIFIER_DESC_oe_vic_hun_voivode_charter_mod:0 "特兰西瓦尼亚贵族、塞克勒边民与萨克森堡垒城镇获颁自治防卫特权，齐心扼守喀尔巴阡诸隘。"
 STATIC_MODIFIER_NAME_oe_vic_hun_szecsenyi_passes_mod:0 "塞切尼喀尔巴阡堡垒网"
 STATIC_MODIFIER_DESC_oe_vic_hun_szecsenyi_passes_mod:0 "沃伊沃德塞切尼·陶马什修筑阿尔巴尤利亚至喀尔巴阡山口的石堡链与轻骑哨站，有效震慑东欧强邻。"
 STATIC_MODIFIER_NAME_oe_vic_cas_order_knights_mod:0 "卡拉特拉瓦与圣地亚哥重骑"
 STATIC_MODIFIER_DESC_oe_vic_cas_order_knights_mod:0 "王室确认骑士团领地与军饷特权，令圣地亚哥与卡拉特拉瓦重装骑士团誓死效命于卡斯蒂利亚战旗之下。"
 STATIC_MODIFIER_NAME_oe_vic_cas_frontera_caballeros_mod:0 "安达卢西亚前沿骑士团练"
 STATIC_MODIFIER_DESC_oe_vic_cas_frontera_caballeros_mod:0 "科尔多瓦前沿督军区整编城镇轻骑兵与边堡戍卒，令卡斯蒂利亚在收复失地边疆常保战备与军威。"
 STATIC_MODIFIER_NAME_oe_vic_eth_bahr_trade_mod:0 "阿克苏姆—红海香料商路"
 STATIC_MODIFIER_DESC_oe_vic_eth_bahr_trade_mod:0 "提格雷海王总督府护航高地象牙、黄金与盐巴直抵红海港口，使所罗门帝国的商税与远洋声望节节攀升。"
 STATIC_MODIFIER_NAME_oe_vic_eth_tigray_synod_mod:0 "提格雷北境护教圣盟"
 STATIC_MODIFIER_DESC_oe_vic_eth_tigray_synod_mod:0 "阿克苏姆修院群与提格雷海王部族在皇帝主持下结成护教圣盟，凝聚高地军民抵御低地强敌的钢铁意志。"
 oe_vic_dec_audit_appease.title:0 "巡察总督府并颁赐协饷"
 oe_vic_dec_audit_appease.desc:0 "遣派朝廷钦差与账房巡查辖下诸建筑型总督府，一方面核查军政簿籍以杜绝中饱，另一方面按时颁赐协饷安抚边帅。执行后所有在任总督府忠诚#G +15#!，并获得为期#Y 5#!年的巡察加成。"
 oe_vic_dec_audit_appease.a:0 "颁诏遣使，核账颁饷"
 oe_vic_dec_dlh_recall_iqtas.title:0 "罢撤诸行省伊克塔总督府"
 oe_vic_dec_dlh_recall_iqtas.desc:0 "道拉塔巴德、坎贝、达尔、章普尔与木尔坦五处伊克塔总督府虽在开疆拓土之际立下汗马功劳，却屡成地方阿米尔拥兵自重之渊薮。如今中枢既稳，当召回诸督、裁撤衙署，将天下财赋与兵马尽数收归德里迪万官署直辖。"
 oe_vic_dec_dlh_recall_iqtas.a:0 "召回诸省总督，政归德里迪万"
 oe_vic_dec_mam_recall_niyabats.title:0 "裁撤叙利亚副王府并政归开罗"
 oe_vic_dec_mam_recall_niyabats.desc:0 "大马士革、阿勒颇与卡拉克三大叙利亚副王府手握重兵，素有尾大不掉之虞，每逢开罗宫廷更迭便动辄兴兵问鼎。趁今朝纲严明，当毅然罢撤三大副王驻节特权，将叙利亚诸堡防务尽数收归开罗城堡直隶。"
 oe_vic_dec_mam_recall_niyabats.a:0 "撤除副王驻节，总摄叙利亚军政"
 oe_vic_dec_hun_crown_diet.title:0 "召开特兰西瓦尼亚王冠议会"
 oe_vic_dec_hun_crown_diet.desc:0 "以匈牙利王冠之名召集特兰西瓦尼亚贵族、塞克勒边军首领与萨克森城镇代表共赴盛大王冠议会。通过颁行统一宪章并将阿尔巴尤利亚总督府并入王室直辖，可永绝日后王位继承动荡时特兰西瓦尼亚与斯拉沃尼亚离心自立之患。"
 oe_vic_dec_hun_crown_diet.a:0 "颁行王冠议会宪章，永固东疆"
 oe_vic_dec_cas_incorporate_orders.title:0 "收归骑士团总团长与安达卢西亚督军区"
 oe_vic_dec_cas_incorporate_orders.desc:0 "仿效伊比利亚王权集大成之道，由卡斯蒂利亚国王亲自兼领圣地亚哥与卡拉特拉瓦骑士团总团长，并将科尔多瓦安达卢西亚前沿督军区收归王室直管。自此骑士团广袤财源与前沿精骑皆唯王命是从，再无内战挟制之忧。"
 oe_vic_dec_cas_incorporate_orders.a:0 "王室兼领总团长，统摄前沿军务"
 oe_vic_dec_eth_centralize_bahr_negash.title:0 "收归提格雷海王府并直管红海税关"
 oe_vic_dec_eth_centralize_bahr_negash.desc:0 "阿克苏姆的提格雷海王总督府世代镇守红海走廊与北境群山，然地方豪酋每每截留盐铁香料商税、对皇廷征调阳奉阴违。今当裁撤分驻衙署，由万王之王亲派官吏直管红海商道税关与北疆防务。"
 oe_vic_dec_eth_centralize_bahr_negash.a:0 "裁撤海王驻节，直管北疆关税"
 oe_vic.1.t:0 "道拉塔巴德百户长骚乱与德干离心"
 oe_vic.1.d:0 "巍峨险峻的道拉塔巴德山城传回急报：驻屯德干的诸位「百户长」军官因不满德里中枢严苛的田赋清丈与频繁更易总督，已串联地方将校拒缴岁贡。德干伊克塔总督府正处于忠叛关头，若苏丹处置失当，整个南方行省都将陷入离心动荡。"
 oe_vic.1.a:0 "颁赐德干百户长减税宪章，安抚总督府军心"
 oe_vic.1.b:0 "遣王室铁骑南下弹压，以威慑立朝纲"
 oe_vic.1.c:0 "就地裁撤德干总督府，改由德里直接管辖"
 oe_vic.2.t:0 "坎贝海港与摩腊婆商道稽核"
 oe_vic.2.d:0 "自阿拉伯海名港坎贝与摩腊婆重镇达尔归来的度支账吏密奏称：西岸棉布香料贸易日进斗金，然解送德里国库之白银却不及十之二三。古吉拉特与摩腊婆两位总督均辩称税银悉数用于海防巡哨与驿道护商，苏丹须决断究竟严查账簿抑或宽容抚绥。"
 oe_vic.2.a:0 "严厉清查坎贝海港与达尔商税，充实国库"
 oe_vic.2.b:0 "宽免积欠并加拨经费，换取两省总督忠顺"
 oe_vic.3.t:0 "木尔坦边警与章普尔粮道"
 oe_vic.3.d:0 "木尔坦快马飞报印度河西岸屡现草原游骑窥伺，而东方章普尔—阿瓦德总督府亦奏报恒河中游今岁丰收、足供大军转输。若趁势厚恤旁遮普—木尔坦边疆总督府并与东方章普尔协力屯粮整军，必能为德里苏丹国铸就横贯北印的钢铁边防。"
 oe_vic.3.a:0 "增拨军饷扩编木尔坦骑军，协理章普尔粮储"
 oe_vic.3.b:0 "将边省余粮与税银尽数调拨京师国库"
 oe_vic.4.t:0 "1340年：大马士革副王坦基兹功高震主"
 oe_vic.4.d:0 "近三十年来，大马士革副王赛义夫丁·坦基兹兴修清真寺、水渠与阿布拉克华宫，恩威并施于叙利亚诸阿米尔之间，声望如日中天。然而开罗城堡内的近臣屡屡进谗，称坦基兹功高震主、叙利亚只知副王而不知苏丹，敦促陛下趁其尚未生变早作定夺。"
 oe_vic.4.a:0 "锁拿坦基兹抄没家产，另委亲信出任大马士革副王"
 oe_vic.4.b:0 "力排众议嘉奖坦基兹，倚其继续坐镇大叙利亚"
 oe_vic.4.c:0 "借机裁撤大马士革副王府，将叙利亚收归开罗直辖"
 oe_vic.5.t:0 "1382年：布尔吉政变与叙利亚三大副王府"
 oe_vic.5.d:0 "随着切尔克斯出身的布尔吉派阿米尔在开罗夺取大权，政局震荡迅速波及大马士革、阿勒颇与卡拉克三大叙利亚副王府。诸多效忠旧巴赫里朝的叙利亚将帅质疑新苏丹法统，纷纷闭城整军。开罗中枢必须迅速决断，方能避免黎凡特陷入全面内战。"
 oe_vic.5.a:0 "颁赐金银荣袍安抚叙利亚诸副王，整编布尔吉铁骑"
 oe_vic.5.b:0 "亲率开罗禁卫北伐立威，以铁腕压服叙利亚异己"
 oe_vic.5.c:0 "厚赏卡拉克副王府，以南叙利亚岩堡牵制北方诸帅"
 oe_vic.6.t:0 "金轿朝觐队与两圣地谢里夫保护国"
 oe_vic.6.d:0 "在麦加与麦地那两圣地谢里夫保护国归附开罗护持之下，每年自埃及启程的御赐金轿朝觐队（马哈迈勒）与运粮商船已成为马穆鲁克苏丹国威震四海的最高象征。汉志使节正恭候苏丹降旨，决定今年护圣粮饷与卫队之规制。"
 oe_vic.6.a:0 "隆重护送金轿并拨发埃及丰厚粮饷，彰显护圣尊荣"
 oe_vic.6.b:0 "缩减汉志恩赏，将红海商税留充开罗国库"
 oe_vic.7.t:0 "特兰西瓦尼亚沃伊沃德危机与王冠动荡"
 oe_vic.7.d:0 "布达王廷的继承动荡与政局困顿，令特兰西瓦尼亚与南部边疆的大领主蠢蠢欲动。阿尔巴尤利亚总督府内，匈牙利贵族、塞克勒边军首领与萨克森城镇代表激烈争辩：若王室无力捍卫喀尔巴阡诸邦，特兰西瓦尼亚与斯拉沃尼亚是否应当自立旗帜以求自保？"
 oe_vic.7.a:0 "确认特兰西瓦尼亚三等级特许权并厚赐总督府"
 oe_vic.7.b:0 "断然回绝贵族要挟，强硬宣示匈牙利王冠最高权威"
 oe_vic.7.c:0 "顺应地方自治呼声，立特兰西瓦尼亚（及危机中之斯拉沃尼亚）为邦国"
 oe_vic.8.t:0 "塞切尼·陶马什与阿尔巴尤利亚边防网"
 oe_vic.8.d:0 "特兰西瓦尼亚沃伊沃德塞切尼·陶马什自阿尔巴尤利亚上书奏称：拱卫匈牙利东疆的喀尔巴阡诸山口亟需加固石堡、增设烽燧并扩充轻骑巡哨。若王室此刻与沃伊沃德总督府协力兴建边防，必能将东线山岭化作坚不可摧之王冠盾墙。"
 oe_vic.8.a:0 "拨款资助塞切尼修筑山口堡垒网，提升总督忠诚"
 oe_vic.8.b:0 "将特兰西瓦尼亚盐矿岁入径直抽调布达国库"
 oe_vic.9.t:0 "特拉斯塔马拉风云与卡斯蒂利亚骑士团领"
 oe_vic.9.d:0 "卡斯蒂利亚王室的派系倾轧与内战阴云日益逼近，坐镇卡拉特拉瓦的圣地亚哥—卡拉特拉瓦骑士团领与安达卢西亚前沿督军区一时成为左右王冠归属的决定力量。诸骑士团总团长愿以重装铁骑效命，条件是王室确认其古老特许权；而宫廷法学家则力劝国王趁势没收团产。"
 oe_vic.9.a:0 "确认骑士团古老特许权，征召重装骑士卫护王冠"
 oe_vic.9.b:0 "强征骑士团领府库银钱，以彰国王无上权威"
 oe_vic.9.c:0 "倚重科尔多瓦安达卢西亚前沿督军区，整编边疆轻骑"
 oe_vic.10.t:0 "安达卢西亚前沿督军区与收复失地边防"
 oe_vic.10.d:0 "坐镇瓜达尔基维尔河畔科尔多瓦的安达卢西亚前沿督军禀报称：格拉纳达边境山地斥候交锋日频，亟需扩编城镇骑士团练并修缮前沿烽火哨塔。全力支持前沿督军区将极大磨砺卡斯蒂利亚陆军战力，然国库官吏亦提醒维系边贸与纳贡同样获利甚丰。"
 oe_vic.10.a:0 "拨款扩充科尔多瓦前沿骑军，强化收复失地边防"
 oe_vic.10.b:0 "收束前沿袭扰，优先收取边境贡金与商税"
 oe_vic.11.t:0 "提格雷海王总督府与红海商队走廊"
 oe_vic.11.d:0 "自圣城阿克苏姆传来提格雷海王（巴赫尔·内加什）捷报：尽管低地匪患不绝，高地出产的象牙、砂金与岩盐仍源源不断经由北境山口流向红海港湾。若皇帝与海王总督府携手护航商队并拓展红海通商，所罗门帝国的商税与外交声威必将大振。"
 oe_vic.11.a:0 "资助海王总督府护商卫队，兴盛阿克苏姆—红海贸易"
 oe_vic.11.b:0 "对北境商队加征皇室通行税，充盈中枢金库"
 oe_vic.12.t:0 "阿克苏姆北境护教圣盟与高地防务"
 oe_vic.12.d:0 "提格雷诸崖壁古修院的院长们与海王总督府麾下将领齐聚阿克苏姆，愿在皇帝见证下缔结护教圣盟，誓死拱卫所罗门正教与北境险隘。若赐予圣盟御准与恩赏，高地军民必将同仇敌忾；若强行推行中枢直令，则恐伤及北方领主离心。"
 oe_vic.12.a:0 "御准阿克苏姆护教圣盟并嘉奖海王总督府"
 oe_vic.12.b:0 "申明皇廷绝对主权，严令北境贵族与修院直隶朝廷"
