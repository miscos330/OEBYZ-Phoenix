 oe_msn_elr_14_hesperides_springboard:0 "赫斯珀里得斯跳板：大西洋前进海港"
 oe_msn_elr_14_hesperides_springboard_desc:0 "在百慕大、亚速尔群岛或直布罗陀巨岩筑起不沉的大西洋补给基地，浩瀚沧海顷刻化作新罗马舰队的皇家大道。依托这些坚固海岛[fort|e]投射压倒性的[maritime_presence|e]与[navy_tradition|e]，伊比利亚、地中海乃至故都君士坦丁堡皆已步入极乐[navy|e]的打击与贸易航程之内。"
 oe_msn_elr_14_hesperides_springboard_req_tt:0 "已建立赫斯珀里得斯前进基地，或直辖/由非主权附庸掌控蓬塔德尔加达、安格拉、百慕大或直布罗陀。"
 oe_msn_elr_15_nostos_or_new_world:0 "归乡重光或新大陆永恒纪元"
 oe_msn_elr_15_nostos_or_new_world_desc:0 "或高举紫衣鹰旗重登圣索菲亚穹顶完成史诗归乡，或庄严宣告摆脱旧大陆羁绊的新世界罗马独立纪元——历史的方向已彻底由紫衣天子定调。跻身全球顶级[great_power|e]之列，为极乐帝国加冕无与伦比的[prestige|e]、璀璨[cultural_tradition|e]与永恒法理[legitimacy|e]。"
 oe_msn_elr_15_nostos_or_new_world_req_tt:0 "直辖或由非主权附庸掌控君士坦丁堡，或已宣告新大陆纪元；且位列世界列强。"
 oe_msn_elr_16_imperium_bicephalum:0 "真·双头大帝：横跨两洋的永恒罗马"
 oe_msn_elr_16_imperium_bicephalum_desc:0 "双头鹰一首俯瞰赫斯珀里亚沃土、一首凝望欧亚旧陆沧海：永恒罗马已超越地理与时代桎梏，化作雄跨东西两洋的不朽巨帝。作为冠绝寰宇的头等[great_power|e]，凭借[capital|e]高耸[development|e]、坚实[stability|e]与传奇[prestige|e]，双头大帝将在盛典上铸就贯通新旧两界的终极帝国宪章。"
 oe_msn_elr_16_imperium_bicephalum_req_tt:0 "完成全部四条支柱，稳定度不低于 20，位列世界列强，首都发展度不低于 28，且达成双头大帝实体分封或极乐终局。"
 oe_msn_eth_destiny:0 "#bold #color_yellow 所罗门王座：埃塞俄比亚高原天命#!#!"
 oe_msn_eth_destiny_DESCRIPTION:0 "自阿克苏姆圣城与红海商道至非洲之角近代基督教强国"
 oe_msn_eth_destiny_CRITERIA_DESCRIPTION:0 "巩固高原正统教会、打通马萨瓦与泽拉红海商道并建设火器堡垒王师"
 oe_msn_eth_destiny_BUTTON_TOOLTIP:0 "开启埃塞俄比亚天命"
 oe_msn_eth_destiny_BUTTON_DETAILS:0 "衔接 v13.0 非洲三轴的所罗门埃塞俄比亚十项精炼任务树：夯实阿克苏姆—拉利贝拉—德卜勒伯尔汉高原王座、振兴《凯布拉·纳加斯特》经院与祭司王约翰跨洋外交、执掌马萨瓦与泽拉红海咖啡商路，并以高原阿姆巴要塞与近代火器军团成就非洲之角霸主！"
 oe_msn_eth_01_highland_throne:0 "高原王座：阿克苏姆、拉利贝拉与圣都"
 oe_msn_eth_01_highland_throne_desc:0 "自阿克苏姆方尖碑至拉利贝拉凿岩圣堂与德卜勒伯尔汉冬宫，重申所罗门皇室[legitimacy|e]可令[capital|e]根基磐固。统筹高原营建以抬升[development|e]，并安抚地方领主以维系持久[stability|e]。"
 oe_msn_eth_01_highland_throne_req_tt:0 "自身或附庸拥有阿克苏姆、拉利贝拉与德卜勒伯尔汉，稳定度不低于 5，且首都发展度达到 12。"
 oe_msn_eth_02_kebra_nagast_church:0 "《凯布拉·纳加斯特》与正统米亚菲派教会"
 oe_msn_eth_02_kebra_nagast_church_desc:0 "《凯布拉·纳加斯特》将锡安约柜与犹大雄狮血脉相连，赋予万王之王令群山修院一致景从的崇高[religious_influence|e]。广修圣堂[buildings|e]并厚待教士[estate_satisfaction|e]，使所罗门[crown_power|e]深植全境每一座高原教区。"
 oe_msn_eth_02_kebra_nagast_church_req_tt:0 "自身或附庸拥有阿克苏姆，稳定度不低于 10，建有神庙或修道院，且教士阶层满意度不低于 50%。"
 oe_msn_eth_03_gonder_rock_churches:0 "贡德尔石堡宫廷与高原经院典籍"
 oe_msn_eth_03_gonder_rock_churches_desc:0 "在贡德尔兴建雄伟石堡宫廷并于拉利贝拉广办吉兹文羊皮抄经院，彻底改易游牧行宫旧制而焕发[cultural_tradition|e]。倾力营建经院[buildings|e]可广布高原[literacy|e]，令阿比西尼亚皇家史册[prestige|e]远播四海。"
 oe_msn_eth_03_gonder_rock_churches_req_tt:0 "自身或附庸拥有贡德尔与拉利贝拉，国库达 200 金币，建有抄经室或图书馆，且首都发展度达到 16。"
 oe_msn_eth_04_prester_john_diplomacy:0 "祭司王约翰跨洋通使"
 oe_msn_eth_04_prester_john_diplomacy_desc:0 "自扎拉·雅各布朝廷遣使远赴罗马、里斯本与耶路撒冷，祭司王约翰的古老传说已化作务实的跨洋[diplomacy|e]。借重外使与工匠往来吸纳域外[institutions|e]及实用[advances|e]，令所罗门王朝的[diplomatic_reputation|e]响彻远海。"
 oe_msn_eth_04_prester_john_diplomacy_req_tt:0 "稳定度不低于 15，与海外基督教盟邦通使或进入地理大发现时代，且接纳封建制或文艺复兴思潮（或稳定度达 20）。"
 oe_msn_eth_05_massawa_red_sea_gate:0 "马萨瓦红海门户"
 oe_msn_eth_05_massawa_red_sea_gate_desc:0 "挥师东下厄立特里亚险峻断崖收复良港马萨瓦，彻底打破高原内陆受困之局并确立红海西岸[core|e]门户。广募熟习潮汐的沿岸[sailors|e]并经略海峡[maritime_presence|e]，为所罗门远航[navy|e]奠下坚实龙骨。"
 oe_msn_eth_05_massawa_red_sea_gate_req_tt:0 "自身或附庸拥有马萨瓦，并掌握至少一处海港。"
 oe_msn_eth_06_zeila_harar_corridor:0 "泽拉与哈拉尔东非商道"
 oe_msn_eth_06_zeila_harar_corridor_desc:0 "控扼石墙坚城哈拉尔与亚丁湾古港泽拉，令非洲之角乳香、象牙与高原谷物[trade|e]悉数纳入帝国关榷。严护商队往来并广建[market|e]驿站，既可强化东岸[control|e]，亦源源不断地为皇家府库注入[gold|e]。"
 oe_msn_eth_06_zeila_harar_corridor_req_tt:0 "自身或附庸拥有泽拉与哈拉尔，并建有市场或商队驿馆。"
 oe_msn_eth_07_indian_ocean_coffee_gold:0 "印度洋咖啡与高原黄金商网"
 oe_msn_eth_07_indian_ocean_coffee_gold_desc:0 "卡法咖啡、法佐格利沙金与高原没药吸引也门与古吉拉特商船云集东非港湾。引导季风[trade|e]反哺沿岸[prosperity|e]，既能大幅充盈国库[gold|e]，亦令塔纳湖至亚丁湾的商业[estates|e]日益殷实。"
 oe_msn_eth_07_indian_ocean_coffee_gold_req_tt:0 "国库达 400 金币，拥有至少 25 处领地，月度贸易与税收收入不低于 25，且建有码头或拥有至少 3 座海港。"
 oe_msn_eth_08_highland_amba_forts:0 "高原驿道与阿姆巴山地城堡"
 oe_msn_eth_08_highland_amba_forts_desc:0 "绝壁平顶的阿姆巴高台天险在高原星罗棋布，常年驻守着直属王室调遣的切瓦精锐卫戍军团。以皇家驿道串联山地[fort|e]，既可砥砺[army_tradition|e]与[manpower|e]动员，亦能稳固对边陲河谷的[control|e]。"
 oe_msn_eth_08_highland_amba_forts_req_tt:0 "拥有至少 18 处领地，陆军传统不低于 15，且建有切瓦阿姆巴堡垒或城堡（或稳定度达到 12）。"
 oe_msn_eth_09_modern_gunpowder_legions:0 "火器近代化所罗门王师"
 oe_msn_eth_09_modern_gunpowder_legions_desc:0 "深鉴阿达尔战事中火绳枪与青铜长炮改变战局的教训，王廷在高原突骑之侧整编常备火枪[regulars|e]与山地炮队。融汇近代火药[advances|e]以拔升[army_tradition|e]，将所罗门[army|e]锻造成威慑东非的铁壁雄师。"
 oe_msn_eth_09_modern_gunpowder_legions_req_tt:0 "进入地理大发现时代，国库达 300 金币，建有军械库或铸炮坊（或陆军传统达 25），且掌握枪阵火器进步或职业军队思潮（或陆军传统达 30）。"
 oe_msn_eth_10_solomonic_horn_hegemon:0 "非洲之角所罗门永恒霸主"
 oe_msn_eth_10_solomonic_horn_hegemon_desc:0 "自青尼罗河飞瀑峡谷至曼德海峡季风航道，全面中兴的所罗门帝国已巍然屹立为举世公认的[great_power|e]。坚如磐石的皇室[legitimacy|e]、蒸蒸日上的高原[prosperity|e]与赫赫[prestige|e]，共贺永恒万王之王。"
 oe_msn_eth_10_solomonic_horn_hegemon_req_tt:0 "自身或附庸拥有阿克苏姆与贡德尔，稳定度不低于 20，拥有至少 35 处领地，首都发展度达 22，且跻身列强或月度贸易与税收收入达 50。"
 oe_msn_tnc_destiny:0 "#bold #color_yellow 太阳鹰蛇：阿兹特克三城同盟天命#!#!"
 oe_msn_tnc_destiny_DESCRIPTION:0 "自特诺奇蒂特兰浮田立基至两洋商网与永不沉落的太阳帝国"
 oe_msn_tnc_destiny_CRITERIA_DESCRIPTION:0 "掌控圣地金字塔与三城同盟、贯通墨西哥湾与玛雅商道并完成近代军改"
 oe_msn_tnc_destiny_BUTTON_TOOLTIP:0 "开启阿兹特克天命"
 oe_msn_tnc_destiny_BUTTON_DETAILS:0 "衔接 v13.0 美洲古国史诗的阿兹特克十项精炼任务树：自特诺奇蒂特兰湖心浮田立基、巡礼特奥蒂瓦坎与乔卢拉圣地金字塔、确立三城同盟霸权、打通森波阿兰海湾与玛雅潘商路，并在跨洋来客抵达之际革新火器与外交，铸就永不沉落的太阳帝国！"
 oe_msn_tnc_01_chinampa_hearth:0 "湖心浮田：奠基特诺奇蒂特兰"
 oe_msn_tnc_01_chinampa_hearth_desc:0 "特斯科科湖畔以盘根柳桩与沃泥筑就的奇南帕浮田岁获数熟，源源不断养育着湖心[capital|e]数十万生民。增修防洪石堤与淡水引渠[buildings|e]可大幅抬升城邦[development|e]，为墨西加谷地带来连绵[prosperity|e]。"
 oe_msn_tnc_01_chinampa_hearth_req_tt:0 "自身或附庸拥有特诺奇蒂特兰，稳定度不低于 5，且建有粮仓或引水渠系统（或首都发展度达 14）。"
 oe_msn_tnc_02_sacred_pyramids_pilgrimage:0 "众神圣城：特奥蒂瓦坎与乔卢拉朝圣"
 oe_msn_tnc_02_sacred_pyramids_pilgrimage_desc:0 "率仪仗巡礼特奥蒂瓦坎亡灵大道并登临乔卢拉大金字塔，使墨西加王统庄严上承托尔特克古老法脉。稳握两座[core|e]圣城不仅彰显帝国[prestige|e]与天命[legitimacy|e]，更夯实中央盆地的礼法[control|e]。"
 oe_msn_tnc_02_sacred_pyramids_pilgrimage_req_tt:0 "自身或附庸拥有特奥蒂瓦坎与乔卢拉。"
 oe_msn_tnc_03_sun_priests_calmecac:0 "太阳祭司与卡尔梅卡克贵族学院"
 oe_msn_tnc_03_sun_priests_calmecac_desc:0 "环绕大神庙的卡尔梅卡克贵族学院之中，王公俊彦随太阳祭司潜心研习树皮画卷象形文、星历算术与治国之道。尊崇祭司[religious_influence|e]可涵养[cultural_tradition|e]与经典[literacy|e]，并稳固教士[estate_satisfaction|e]。"
 oe_msn_tnc_03_sun_priests_calmecac_req_tt:0 "自身或附庸拥有特诺奇蒂特兰，稳定度不低于 12，教士阶层满意度不低于 50%，且建有神庙或图书馆（或首都发展度达 18）。"
 oe_msn_tnc_04_triple_alliance_hegemony:0 "阿兹特克三城同盟霸权"
 oe_msn_tnc_04_triple_alliance_hegemony_desc:0 "统合特诺奇蒂特兰、特斯科科与特拉科潘三邦贡赋册籍，将星罗棋布的阿尔特佩特尔城邦铸为纵横中美洲的霸权中枢。严明[subjects|e]纳贡法度可凝聚[crown_power|e]与[stability|e]，并大幅壮大帝国常备[manpower|e]。"
 oe_msn_tnc_04_triple_alliance_hegemony_req_tt:0 "拥有至少 20 处领地，稳定度不低于 15，且拥有至少 2 个附庸国或陆军传统达到 18。"
 oe_msn_tnc_05_gulf_gateway_cempoala:0 "墨西哥湾门户：森波阿兰海岸"
 oe_msn_tnc_05_gulf_gateway_cempoala_desc:0 "挥师东下黑曜石峻岭定鼎托托纳克白灰石膏名城森波阿兰，使墨西加太阳战旗首次俯瞰浩瀚墨西哥湾。纳入沿海[core|e]据点并广泛征募水泽[sailors|e]，不仅确立海湾[maritime_presence|e]，亦为远航[navy|e]启锚开道。"
 oe_msn_tnc_05_gulf_gateway_cempoala_req_tt:0 "自身或附庸拥有森波阿兰，并掌握至少一处海港。"
 oe_msn_tnc_06_yucatan_maya_cities:0 "南进尤卡坦：玛雅潘诸城"
 oe_msn_tnc_06_yucatan_maya_cities_desc:0 "越过水网密布的塔巴斯科潟湖进克石灰岩名城玛雅潘，终将墨西哥中央谷地与加勒比海沿岸贯通为一。稳固东境[core|e]重镇既可衔接玛雅商舟[trade|e]网络，又能拉动半岛[development|e]并远播帝国[prestige|e]。"
 oe_msn_tnc_06_yucatan_maya_cities_req_tt:0 "自身或附庸拥有玛雅潘，并建有码头或拥有至少 3 座海港。"
 oe_msn_tnc_07_pochteca_cacao_gold:0 "波奇特卡远商与可可黄金税"
 oe_msn_tnc_07_pochteca_cacao_gold_desc:0 "佩剑远行的波奇特卡商帮深入索科努斯科与希卡兰戈，携翠绿咬鹃羽、美玉与上等可可豆齐聚特拉特洛尔科大[market|e]。扶持行商[estates|e]可化远途[trade|e]为充盈[gold|e]税源，更兼充王廷遍布诸邦的耳目。"
 oe_msn_tnc_07_pochteca_cacao_gold_req_tt:0 "国库达 400 金币，拥有至少 25 处领地，月度贸易与税收收入达 25，且建有市场或行会大厅（或市民满意度达 55%）。"
 oe_msn_tnc_08_obsidian_to_firearms:0 "黑曜石到钢铁火器军改"
 oe_msn_tnc_08_obsidian_to_firearms_desc:0 "昔日挥舞锋锐黑曜石战棒的雄鹰与美洲豹武士，如今在湖畔官营兵坊试锻精钢长戟并铸造青铜火铳。严格整训配装新式火器的[regulars|e]可磨砺[army_tradition|e]，令墨西加[army|e]借军事[advances|e]脱胎换骨。"
 oe_msn_tnc_08_obsidian_to_firearms_req_tt:0 "进入地理大发现时代或陆军传统达 20，且建有武器行会或军械库（或陆军传统达 25）。"
 oe_msn_tnc_09_transoceanic_visitors:0 "应对跨洋来客：外交与技术破局"
 oe_msn_tnc_09_transoceanic_visitors_desc:0 "当远洋高桅帆船破浪现身东海浅滩，特诺奇蒂特兰沉着镇定，不惑不惧地展开平等有度的跨洋[diplomacy|e]。审慎研习域外[institutions|e]与远海造船[advances|e]，在东西两半球赢得不可轻侮的主权[diplomatic_reputation|e]。"
 oe_msn_tnc_09_transoceanic_visitors_req_tt:0 "遭遇旧大陆或埃律西昂跨洋来客（或进入地理大发现时代），且接纳封建制、新大陆思潮或枪阵火器进步（或稳定度达 18）。"
 oe_msn_tnc_10_undying_sun_empire:0 "太阳帝国永不沉落"
 oe_msn_tnc_10_undying_sun_empire_desc:0 "第五太阳的光辉永不西沉，特诺奇蒂特兰白石长堤与恢弘神殿已获东西列邦公认为美洲主权[great_power|e]。蒸蒸日上的湖谷[prosperity|e]、坚如磐石的[stability|e]与万邦景仰的[prestige|e]，宣告墨西加盛世长存。"
 oe_msn_tnc_10_undying_sun_empire_req_tt:0 "自身或附庸拥有特诺奇蒂特兰，稳定度不低于 20，拥有至少 35 处领地，首都发展度达 24，且跻身列强或月度贸易与税收收入达 55。"
 oe_msn_csu_destiny:0 "#bold #color_yellow 四方苏尤：印加安第斯永恒天命#!#!"
 oe_msn_csu_destiny_DESCRIPTION:0 "自圣谷库斯科与印加古道至太平洋白银帝国"
 oe_msn_csu_destiny_CRITERIA_DESCRIPTION:0 "贯通印加皇家驿道与梯田奇普、统合基多至阿雷基帕四方苏尤并迈向大洋"
 oe_msn_csu_destiny_BUTTON_TOOLTIP:0 "开启印加四方天命"
 oe_msn_csu_destiny_BUTTON_DETAILS:0 "衔接 v13.0 安第斯古道与 v12.2 驿道署的印加十项精炼任务树：自圣谷库斯科（qusqu）奠基、修筑跨越雪峰的印加皇家驿道（Qhapaq Nan）与垂直生态梯田、以奇普结绳统筹四方苏尤、北定基多与奇穆南控阿雷基帕，在太平洋与近代化浪潮中成就永耀太阳的四方共主！"
 oe_msn_csu_01_sacred_valley_qusqu:0 "圣谷奠基：库斯科与太阳高地"
 oe_msn_csu_01_sacred_valley_qusqu_desc:0 "依美洲狮神形筑于安第斯群川交汇之地的库斯科，乃凝聚王室宗族的圣谷[capital|e]与世界肚脐。精治严丝合缝的石砌城郭以提升[development|e]，可确立萨帕印加[legitimacy|e]，令高山腹地[stability|e]长久安澜。"
 oe_msn_csu_01_sacred_valley_qusqu_req_tt:0 "自身或附庸拥有库斯科与基利亚鲁米约克，稳定度不低于 5，且首都发展度达到 12。"
 oe_msn_csu_02_qhapaq_nan_roads:0 "印加皇家驿道网与坦博驿站"
 oe_msn_csu_02_qhapaq_nan_roads_desc:0 "凿石云梯、草索悬桥与物资丰备的坦博驿站，将险峻山脊化作四通八达的皇家驿道。查斯基信使昼夜接力令[control|e]直抵边关，既利[army|e]疾行，亦借高原[trade|e]滋养沿线[prosperity|e]。"
 oe_msn_csu_02_qhapaq_nan_roads_req_tt:0 "自身或附庸拥有库斯科，并修通直达库斯科的印加皇家驿道、建有奇普坦博档案馆，或拥有至少 12 处领地。"
 oe_msn_csu_03_vertical_terraces_mita:0 "垂直生态梯田与米塔徭役仓廪"
 oe_msn_csu_03_vertical_terraces_mita_desc:0 "层叠石砌安第斯梯田兼收暖谷玉米与高寒马铃薯，藉米塔轮番徭役令官办储粮仓廪岁岁盈满。大力兴修水利与仓储[buildings|e]可维系农民[estate_satisfaction|e]，既促圣谷[development|e]跃升，亦厚积帝国[manpower|e]。"
 oe_msn_csu_03_vertical_terraces_mita_req_tt:0 "自身或附庸拥有库斯科，稳定度不低于 12，国库达 200 金币，农民满意度达 50%，且建有粮仓或引水渠系统（或首都发展度达 16）。"
 oe_msn_csu_04_quipu_coricancha_sun:0 "奇普结绳户籍与太阳神殿"
 oe_msn_csu_04_quipu_coricancha_sun_desc:0 "科里坎查太阳神殿金光熠熠的包金石壁之下，奇普书记官以五彩棉绳结数详录天下户籍、驼群与贡粮清单。完善此套[cabinet|e]稽核法度可大张[crown_power|e]，同时涵育安第斯[cultural_tradition|e]与太阳神[religious_influence|e]。"
 oe_msn_csu_04_quipu_coricancha_sun_req_tt:0 "自身或附庸拥有库斯科，稳定度不低于 15，教士满意度达 50%，且建有神庙或抄经室（或首都发展度达 18）。"
 oe_msn_csu_05_north_quito_chimu:0 "北定钦查苏尤：基多与奇穆昌昌"
 oe_msn_csu_05_north_quito_chimu_desc:0 "收服奇穆王朝土砖宏城昌昌并于赤道高原营建北都基多，钦查苏尤自荒漠绿洲至火山群峰尽归王室统御。整合两处[core|e]重镇可广泛吸纳奇穆金工[prosperity|e]，既扬帝国[prestige|e]，亦固北疆[control|e]。"
 oe_msn_csu_05_north_quito_chimu_req_tt:0 "自身或附庸拥有基多与昌昌。"
 oe_msn_csu_06_south_arequipa_coast:0 "南控科利亚苏尤：阿雷基帕与海岸"
 oe_msn_csu_06_south_arequipa_coast_desc:0 "阿雷基帕火山白石采场与太平洋丰饶渔湾，将阿尔蒂普拉诺牧场与南海航线连为一体。确立此南境[core|e]可提升沿岸[development|e]并增收[gold|e]，更沿秘鲁寒流培育熟谙风涛的[sailors|e]。"
 oe_msn_csu_06_south_arequipa_coast_req_tt:0 "自身或附庸拥有阿雷基帕，并掌握至少一处海港。"
 oe_msn_csu_07_pacific_ports_silver:0 "太平洋商港与安第斯白银国库"
 oe_msn_csu_07_pacific_ports_silver_desc:0 "高山银脉与满载红海菊贝的轻木商筏，令太平洋沿岸化作纵贯南美的贵金属商廊。规范港口[market|e]交割可扩大[trade|e]盈余并充实国库[gold|e]，同时严控白银流布以防[inflation|e]失衡。"
 oe_msn_csu_07_pacific_ports_silver_req_tt:0 "国库达 400 金币，拥有至少 25 处领地，月度贸易与税收收入达 25，且建有市场或码头（或拥有 4 座海港）。"
 oe_msn_csu_08_andean_mountain_forts:0 "安第斯云端要塞防线"
 oe_msn_csu_08_andean_mountain_forts_desc:0 "萨克塞瓦曼与奥扬泰坦博巨石锯齿城垣严丝合缝，雄踞云端山脊令来自海疆与峻岭的强敌望而却步。充实高山[fort|e]守备可淬炼[army_tradition|e]，既强韧帝国[army|e]战力，亦长久佑护四方[stability|e]。"
 oe_msn_csu_08_andean_mountain_forts_req_tt:0 "拥有至少 18 处领地，稳定度不低于 10，且建有城堡（或陆军传统达到 18）。"
 oe_msn_csu_09_oceanic_breakthrough:0 "太平洋破局：远洋船队与近代格致"
 oe_msn_csu_09_oceanic_breakthrough_desc:0 "遥承图帕克·尤潘基远航太平洋的古老遗志，皇家船厂将安第斯硬木船壳与远洋风帆[advances|e]融为一体。打造远海舰队可大幅磨砺[navy_tradition|e]，既张扬太平洋[maritime_presence|e]，亦主动吸纳世界[institutions|e]。"
 oe_msn_csu_09_oceanic_breakthrough_req_tt:0 "进入地理大发现时代或海军传统达 15，接纳封建制、新大陆思潮或职业军队进步（或海军传统达 20），且建有码头或船坞（或拥有 4 座海港）。"
 oe_msn_csu_10_lord_of_four_quarters:0 "塔万廷苏尤：四方共主永恒天命"
 oe_msn_csu_10_lord_of_four_quarters_desc:0 "钦查、安蒂、科利亚与昆蒂四方苏尤齐集库斯科纯金太阳圣盘之下，塔万廷苏尤巍然屹立为跨洋公认的[great_power|e]。至高皇室[legitimacy|e]、安第斯全域[prosperity|e]与绝世[prestige|e]，共铸四方共主永恒天命。"
 oe_msn_csu_10_lord_of_four_quarters_req_tt:0 "自身或附庸拥有库斯科，稳定度不低于 20，拥有至少 35 处领地，首都发展度达 22，且跻身列强或月度贸易与税收收入达 55。"
