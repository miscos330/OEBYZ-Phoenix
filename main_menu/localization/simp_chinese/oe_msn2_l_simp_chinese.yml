 STATIC_MODIFIER_NAME_oe_msn2_elr_m1:0 "极乐三教柱石与思想宽容"
 STATIC_MODIFIER_DESC_oe_msn2_elr_m1:0 "以西方正教、极乐多神复兴或西马库斯宽容宪章定鼎新大陆信仰根基，弘扬教化与文化传统。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_assim_mod:0 "极乐希腊族裔熔铸"
 STATIC_MODIFIER_DESC_oe_msn2_elr_assim_mod:0 "古希腊拉丁遗风与新大陆拓荒精神融为一体，令美洲行省加速归化认同极乐文明。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_colonist_mod:0 "东岸拓殖与切萨皮克丰收"
 STATIC_MODIFIER_DESC_oe_msn2_elr_colonist_mod:0 "跨越切萨皮克初年缺粮危机，源源不断的移民与垦殖船队沿北美东岸铺开罗马新城。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_m2:0 "赫斯珀里亚大陆霸主"
 STATIC_MODIFIER_DESC_oe_msn2_elr_m2:0 "自北岸冰雪峡湾至墨西哥湾与大平原腹地，极乐洲总督宪章与移民浪潮牢牢掌控西半球。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_silk_trade_mod:0 "极乐紫锦大西洋商潮"
 STATIC_MODIFIER_DESC_oe_msn2_elr_silk_trade_mod:0 "切萨皮克桑蚕御丝与紫锦工坊源源不断产出珍品，成为横跨大西洋的高利润旗舰货源。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_shipyard_mod:0 "铜甲船坞与希腊火军械"
 STATIC_MODIFIER_DESC_oe_msn2_elr_shipyard_mod:0 "标准化铜甲舰体舾装与虹吸喷火工坊令极乐洲舰队造船如飞、重舰威慑四海。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_m3:0 "六方总督区跨洋治理网"
 STATIC_MODIFIER_DESC_oe_msn2_elr_m3:0 "高效运转的总督区宪章大幅稳固诸督忠心、扩充外交承载力，并把全洲商力汇入新君堡。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_springboard_mod:0 "赫斯珀里得斯跨洋前进基地"
 STATIC_MODIFIER_DESC_oe_msn2_elr_springboard_mod:0 "牢握亚速尔、百慕大与直布罗陀前沿海港补给线，令极乐洲远征舰队纵横东西大洋。"
 STATIC_MODIFIER_NAME_oe_msn2_elr_m4:0 "双头鹰永耀：东西罗马大一统天命"
 STATIC_MODIFIER_DESC_oe_msn2_elr_m4:0 "跨越新旧两大陆的永恒罗马集钢铁纪律、跨洋商贸、高效直辖与启蒙格致于一身，傲立世界之巅。"
 STATIC_MODIFIER_NAME_oe_msn2_eth_m1:0 "祭司王约翰跨洋外交与正统教威"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m1:0 "所罗门王朝依托米亚菲派深厚法统与跨海使节往来，赢得地中海与印度洋列国敬重。"
 STATIC_MODIFIER_NAME_oe_msn2_eth_m2:0 "红海—印度洋咖啡与黄金商道"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m2:0 "打通马萨瓦、泽拉与哈拉尔海陆贸易网，将埃塞俄比亚高原咖啡、象牙与黄金远销印度洋。"
 STATIC_MODIFIER_NAME_oe_msn2_eth_m3:0 "高原阿姆巴要塞与近代火器军团"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m3:0 "依托险峻高原石城城堡并列装近代火绳枪与野战铜炮，所罗门王师固若金汤。"
 STATIC_MODIFIER_NAME_oe_msn2_eth_m4:0 "非洲之角所罗门永恒霸主"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m4:0 "从阿克苏姆、拉利贝拉到贡德尔与红海诸港，千年所罗门正统帝国以富强与威德傲立东非。"
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m1:0 "三城同盟霸权与湖谷统御"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m1:0 "特诺奇蒂特兰以圣地礼制与严明贡赋体系牢控中美诸邦，兵源充沛而附庸驯服。"
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m2:0 "波奇特卡远商与两洋可可黄金税"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m2:0 "贯通墨西哥湾与尤卡坦商道，波奇特卡特许商团把可可、羽饰与黄金源源汇入特诺奇蒂特兰国库。"
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m3:0 "落日防线：黑曜石与火器近代革新"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m3:0 "面对跨洋来客迅速吸收冶铁、火器与外交博弈之术，阿兹特克打破旧大陆技术垄断。"
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m4:0 "太阳帝国永不沉落天命"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m4:0 "以丰饶浮田粮仓、两洋商网与近代新军重塑美洲格局，特诺奇蒂特兰太阳王朝万世长明。"
 STATIC_MODIFIER_NAME_oe_msn2_csu_m1:0 "印加古道、梯田与奇普结绳政制"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m1:0 "贯通安第斯的皇家驿道、垂直生态粮仓与精密奇普账册，让万山险阻化作政令坦途。"
 STATIC_MODIFIER_NAME_oe_msn2_csu_m2:0 "太平洋商港与安第斯白银国库"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m2:0 "将基多、奇穆与阿雷基帕海岸港湾连为一体，丰沛矿产与海贸令库斯科府库充盈。"
 STATIC_MODIFIER_NAME_oe_msn2_csu_m3:0 "太平洋远航破局与近代舰队"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m3:0 "改造安第斯造船工坊并迎击跨洋来船，塔万廷苏尤迈向大洋强国之列。"
 STATIC_MODIFIER_NAME_oe_msn2_csu_m4:0 "塔万廷苏尤四方共主永恒天命"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m4:0 "北抵基多、南极智利海岸，印加古道与太阳神殿光耀安第斯群峰，成就南美不朽帝国。"
 oe_msn_elr_destiny:0 "#bold #color_yellow 极乐新罗马：跨大西洋双头鹰天命#!#!"
 oe_msn_elr_destiny_DESCRIPTION:0 "自切萨皮克登陆定都至六方总督区与东西罗马大重逢"
 oe_msn_elr_destiny_CRITERIA_DESCRIPTION:0 "立足新君堡、定鼎三教与族裔、经略美洲六方总督并重返故土成就双头大帝"
 oe_msn_elr_destiny_BUTTON_TOOLTIP:0 "开启极乐洲新罗马天命"
 oe_msn_elr_destiny_BUTTON_DETAILS:0 "专为西渡大西洋的极乐洲新罗马打造的十六项四柱天命任务树：统筹切萨皮克立国与三教元老院、北联文兰南会斯巴达尼亚、兴建极乐丝绸御坊与希腊火船坞、敕封美洲六大总督区，并在跨洋大重逢后抉择新大陆纪元或光复君堡缔造真·双头大帝！"
 oe_msn_elr_01_chesapeake_hearth:0 "切萨皮克圣火：奠基新君士坦丁堡"
 oe_msn_elr_01_chesapeake_hearth_desc:0 "穿越风暴大洋的罗马遗民在切萨皮克湾燃起不灭圣火，筑起新大陆紫衣皇都的最初根基。"
 oe_msn_elr_01_chesapeake_hearth_req_tt:0 "拥有切萨皮克或南塞蒙德，且稳定度不低于 5。"
 oe_msn_elr_02_elysian_senate:0 "召开极乐元老院与新罗马宪制"
 oe_msn_elr_02_elysian_senate_desc:0 "召集流亡贵族、水手首领与新城豪族共议国宪，让千年罗马共和与帝制传统在新大陆重生。"
 oe_msn_elr_02_elysian_senate_req_tt:0 "已召开极乐元老院，或国家拥有至少 8 处地点。"
 oe_msn_elr_03_three_faiths_pillar:0 "三教定鼎：西方牧首与古典宽容"
 oe_msn_elr_03_three_faiths_pillar_desc:0 "在西方正教、极乐罗马多神复兴与西马库斯宗教宽容间定下国是，凝聚跨洋帝国的精神支柱。"
 oe_msn_elr_03_three_faiths_pillar_req_tt:0 "已确立三教信仰路线，或稳定度不低于 15。"
 oe_msn_elr_04_hellenic_ethnogenesis:0 "极乐希腊族裔与古典文教熔铸"
 oe_msn_elr_04_hellenic_ethnogenesis_desc:0 "历经数代拓荒与典籍传承，新大陆罗马人熔铸出兼具古典优雅与边疆锐气的极乐文明。"
 oe_msn_elr_04_hellenic_ethnogenesis_req_tt:0 "已完成极乐希腊族裔熔铸，或国家拥有至少 18 处地点。"
 oe_msn_elr_05_pyrophoroi_and_copper:0 "喷火步兵与铜甲巨舰军备革新"
 oe_msn_elr_05_pyrophoroi_and_copper_desc:0 "将古老希腊火秘方与新大陆丰沛铜矿结合，锻造令大西洋诸强胆寒的喷火步兵与铜甲战舰。"
 oe_msn_elr_05_pyrophoroi_and_copper_req_tt:0 "已就绪喷火步兵或铜甲舰队，或进入地理大发现及更晚时代。"
 oe_msn_elr_06_eastern_seaboard:0 "经略美东海岸：突破初年拓殖瓶颈"
 oe_msn_elr_06_eastern_seaboard_desc:0 "沿大西洋良港连片辟土垦田，彻底告别流亡初期的孤岛困局，将东岸化作极乐洲沃土。"
 oe_msn_elr_06_eastern_seaboard_req_tt:0 "拥有至少 12 处地点。"
 oe_msn_elr_07_north_atlantic_kin:0 "北洋寻盟：维京文兰与圣劳伦斯"
 oe_msn_elr_07_north_atlantic_kin_desc:0 "北航冰雪峡湾探访古老维京文兰遗民，或沿曼哈顿与斯塔达科纳筑起极乐洲北疆屏障。"
 oe_msn_elr_07_north_atlantic_kin_req_tt:0 "已与北岸文兰接触，或直辖/附庸掌控曼哈顿或斯塔达科纳。"
 oe_msn_elr_08_gulf_and_laconians:0 "南洋盾阵：斯巴达尼亚与墨西哥湾"
 oe_msn_elr_08_gulf_and_laconians_desc:0 "挥师南下探索墨西哥湾与加勒比航道，结好尤卡坦失散拉科尼亚军团或据守哈瓦那与新奥尔良。"
 oe_msn_elr_08_gulf_and_laconians_req_tt:0 "已与斯巴达尼亚接触，或直辖/附庸掌控哈瓦那或布尔班查。"
 oe_msn_elr_09_masters_of_hesperia:0 "赫斯珀里亚大陆霸主"
 oe_msn_elr_09_masters_of_hesperia_desc:0 "无论是以辽阔直辖疆土横跨北美，还是借三方以上美洲总督区分治山河，西半球已奉紫鹰为尊。"
 oe_msn_elr_09_masters_of_hesperia_req_tt:0 "拥有至少 35 处地点，或建立至少 3 处美洲总督区。"
 oe_msn_elr_10_elysian_silk_looms:0 "切萨皮克桑蚕：兴建极乐丝绸御坊"
 oe_msn_elr_10_elysian_silk_looms_desc:0 "驯化北美桑林并设立皇家丝绸御坊，令新君堡的紫红锦缎在东西两洋千金难求。"
 oe_msn_elr_10_elysian_silk_looms_req_tt:0 "建成至少一座极乐丝绸御坊，或国库不少于 500 金币。"
 oe_msn_elr_11_greek_fire_dockyards:0 "新君堡希腊火船坞与铸炮局"
 oe_msn_elr_11_greek_fire_dockyards_desc:0 "在深水军港筑起铜甲造船坞与希腊火铸炮局，使帝国远洋海军兼具毁灭火力与惊人产能。"
 oe_msn_elr_11_greek_fire_dockyards_req_tt:0 "建成至少一座新君堡希腊火船坞，或海军传统不低于 25。"
 oe_msn_elr_12_six_exarchates_web:0 "敕封帝国总督区跨洋治理网"
 oe_msn_elr_12_six_exarchates_web_desc:0 "效法古典拉文纳与迦太基总督成例，以至少三座高效忠诚的极乐洲总督区统筹万里海疆。"
 oe_msn_elr_12_six_exarchates_web_req_tt:0 "拥有至少 3 处极乐洲总督区。"
 oe_msn_elr_13_great_reunion:0 "百年孤悬终结：跨大西洋大重逢"
 oe_msn_elr_13_great_reunion_desc:0 "大西洋迷雾散尽之日，旧大陆列强骇然望见紫帆铜甲舰队自西方破浪而来，重开东西千年对话。"
 oe_msn_elr_13_great_reunion_req_tt:0 "已触发《跨洋大重逢》，或进入地理大发现及更晚时代。"
 oe_msn_elr_14_hesperides_springboard:0 "赫斯珀里得斯跳板：大西洋前进海港"
 oe_msn_elr_14_hesperides_springboard_desc:0 "扼守亚速尔群岛、百慕大或直布罗陀海峡，为新罗马舰队投射地中海与欧陆打通不沉补给线。"
 oe_msn_elr_14_hesperides_springboard_req_tt:0 "已建立赫斯珀里得斯前进基地，或拥有蓬塔德尔加达、安格拉、百慕大或直布罗陀。"
 oe_msn_elr_15_nostos_or_new_world:0 "归乡重光或新大陆永恒纪元"
 oe_msn_elr_15_nostos_or_new_world_desc:0 "或高举双头鹰旗光复故都君士坦丁堡，或庄严宣告新大陆罗马独立纪元——历史由紫衣天子定调。"
 oe_msn_elr_15_nostos_or_new_world_req_tt:0 "直辖或由附庸掌控君士坦丁堡，或已宣告新大陆纪元。"
 oe_msn_elr_16_imperium_bicephalum:0 "真·双头大帝：横跨两洋的永恒罗马"
 oe_msn_elr_16_imperium_bicephalum_desc:0 "集元老院文治、美洲六督经略、极乐丝绸与希腊火海权及大重逢伟业于大成，双头鹰傲视东西两洋！"
 oe_msn_elr_16_imperium_bicephalum_req_tt:0 "完成全部四条支柱，稳定度不低于 20，且达成双头大帝实体分封或极乐终局。"
 oe_msn_eth_destiny:0 "#bold #color_yellow 所罗门王座：埃塞俄比亚高原天命#!#!"
 oe_msn_eth_destiny_DESCRIPTION:0 "自阿克苏姆圣城与红海商道至非洲之角近代基督教强国"
 oe_msn_eth_destiny_CRITERIA_DESCRIPTION:0 "巩固高原正统教会、打通马萨瓦与泽拉红海商道并建设火器堡垒王师"
 oe_msn_eth_destiny_BUTTON_TOOLTIP:0 "开启埃塞俄比亚天命"
 oe_msn_eth_destiny_BUTTON_DETAILS:0 "衔接 v13.0 非洲三轴的所罗门埃塞俄比亚十项精炼任务树：夯实阿克苏姆—拉利贝拉—德卜勒伯尔汉高原王座、振兴《凯布拉·纳加斯特》经院与祭司王约翰跨洋外交、执掌马萨瓦与泽拉红海咖啡商路，并以高原阿姆巴要塞与近代火器军团成就非洲之角霸主！"
 oe_msn_eth_01_highland_throne:0 "高原王座：阿克苏姆、拉利贝拉与圣都"
 oe_msn_eth_01_highland_throne_desc:0 "牢握阿克苏姆古老加冕圣城、拉利贝拉石凿教堂与德卜勒伯尔汉王廷，稳固所罗门皇统。"
 oe_msn_eth_01_highland_throne_req_tt:0 "拥有阿克苏姆、拉利贝拉与德卜勒伯尔汉，且稳定度不低于 5。"
 oe_msn_eth_02_kebra_nagast_church:0 "《凯布拉·纳加斯特》与正统米亚菲派教会"
 oe_msn_eth_02_kebra_nagast_church_desc:0 "修明王室法典与教会清规，调和高原修道院宗派分歧，弘扬所罗门圣裔的宗教向心力。"
 oe_msn_eth_02_kebra_nagast_church_req_tt:0 "拥有阿克苏姆，且稳定度不低于 10。"
 oe_msn_eth_03_gonder_rock_churches:0 "贡德尔石堡宫廷与高原经院典籍"
 oe_msn_eth_03_gonder_rock_churches_desc:0 "营建贡德尔石砌皇城并广护拉利贝拉经院抄经室，令吉兹文典籍与宫廷艺术蔚为大观。"
 oe_msn_eth_03_gonder_rock_churches_req_tt:0 "拥有贡德尔与拉利贝拉，且国库不少于 200 金币。"
 oe_msn_eth_04_prester_john_diplomacy:0 "祭司王约翰跨洋通使"
 oe_msn_eth_04_prester_john_diplomacy_desc:0 "派遣使节穿越红海与地中海联通欧亚基督教古国，打破孤悬态势，引入工匠、火器与外交声望。"
