 oe_el2_dec_charter_exarch_10.desc: "将帝国位于尼罗河三角洲与埃及行省的所有非首都直辖领地整编析出为#T 亚历山大·埃及总督区#!（帝国总督区），自动赋予全境核心、古典希拉称号与同源文化宗教，免除远疆低控制力之苦。花费 #Y 100#! 金。"
 oe_el2_dec_charter_exarch_10.a: "颁授亚历山大·埃及总督区金印宪章"
 oe_el2_dec_charter_exarch_10_req_tt: "在尼罗河三角洲与埃及行省直接拥有至少 #Y 3#! 处非首都地点，且该区尚无己方帝国总督区。"
 oe_el2_dec_charter_exarch_10_tt: "析出该区全部非首都直辖领地成立#T 亚历山大·埃及总督区#!（永不割让玩家首都）并自动加核心。"
 oe_el2_dec_hesperides_springboard.title: "筹建赫斯珀里得斯东征前进基地"
 oe_el2_dec_hesperides_springboard.desc: "面向亚速尔、马德拉、百慕大或直布罗陀筹建横渡大西洋的东征前进跳板：可选择重金外交购岛、发布光复奇袭令，或立即为已控岛屿修筑海港与粮仓。"
 oe_el2_dec_hesperides_springboard.a: "召开海军部大西洋跳板御前会议"
 oe_el2_dec_hesperides_springboard_tt: "开启#T 《赫斯珀里得斯东征前进基地》#!抉择事件，规划跨洋补给岛屿与东征航线。"
 oe_el2_dec_imperium_bicephalum_partition.title: "颁布《双头大帝跨洋分封大诏》"
 oe_el2_dec_imperium_bicephalum_partition.desc: "君士坦丁堡重归鹰旗之下！如今帝国横跨两洋，元老院请陛下作出真正重塑地图格局的终局裁决：迁都君堡并封美洲为极乐洲大总督区、定都新君堡并封旧大陆为东方罗马大总督区，抑或以双京共治联邦统筹万邦。"
 oe_el2_dec_imperium_bicephalum_partition.a: "召集群臣议定两洋大帝国体例"
 oe_el2_dec_imperium_bicephalum_partition_tt: "开启#T 《真·双头大帝：跨洋实体分封裁决》#!，可在三种实体版图格局中择一施行。"
 oe_el2_dec_readout.title: "查阅《极乐洲新罗马 2.0 实时遥测》"
 oe_el2_dec_readout.desc: "只读查阅当前帝国总督区数量（美洲/故土分区）、两座极乐洲御用工场建置数、跨洋大重逢、跳板、双头大帝分封及文兰/斯巴达尼亚状态（零消耗）。"
 oe_el2_dec_readout.a: "展开极乐洲新罗马 2.0 遥测面板"
 oe_el2_ci_elevate_exarchate: "敕升帝国总督区"
 oe_el2_ci_elevate_exarchate_desc: "花费 100 金将忠诚度达到 40 以上的常规附庸、殖民领或附庸化的文兰/斯巴达尼亚升格为新罗马专属的帝国总督区。"
 oe_el2_ci_elevate_exarchate_act: "敕升帝国总督区"
 oe_el2_ci_elevate_exarchate_text: "敕升帝国总督区"
 oe_el2_ci_elevate_exarchate_effect_text: "目标附庸将升格为帝国总督区并增进对宗主好感。"
 oe_el2_ci_elevate_exarchate_effect_text_past: "目标附庸已升格为帝国总督区。"
 dip_oe_el2_ci_elevate_exarchate_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 PROPOSE_oe_el2_ci_elevate_exarchate: "是否将 $RECIPIENT$ 敕升为帝国总督区？\n\n$INFO$"
 oe_el2_ci_elevate_loyal_tt: "目标附庸忠心至少达到 #Y 40#!。"
 oe_el2_ci_cede_zone_to_exarchate: "一键划拨同区新地予总督区"
 oe_el2_ci_cede_zone_to_exarchate_desc: "将本国在目标帝国总督区所属地理辖区内新近征服或拓殖的全部非首都直辖领地一次性无损移交并加核心给该总督区。"
 oe_el2_ci_cede_zone_to_exarchate_act: "划拨同区新地"
 oe_el2_ci_cede_zone_to_exarchate_text: "划拨同区新地"
 oe_el2_ci_cede_zone_to_exarchate_effect_text: "本国在该总督区辖区内的所有非首都地点将移交并加核心给该总督区。"
 oe_el2_ci_cede_zone_to_exarchate_effect_text_past: "已将同区全部非首都直辖地划拨予该总督区。"
 dip_oe_el2_ci_cede_zone_to_exarchate_CATEGORY: "CATEGORY_SUBJECT_ACTIONS"
 PROPOSE_oe_el2_ci_cede_zone_to_exarchate: "是否将同区所有非首都直辖地划拨给 $RECIPIENT$？\n\n$INFO$"
 oe_el2_ci_has_zone_lands_tt: "宗主在该总督区对应的地理辖区内拥有至少 1 处非首都直辖地点。"
 oe_el2_ci_cede_zone_tt: "将宗主位于该总督区对应疆域内的全部非首都地点移交并赋予核心。"
 oe_el2.1.title: "帝国总督区大宪章"
 oe_el2.1.desc: "随着首位极乐洲帝国总督在元老院前领受双头鹰金印，昔日查士丁尼与莫里斯时代的边疆总督法度在大西洋彼岸焕发新生。海湾百帆竞发，各省将士既各守封疆，又同归皇庭节制。"
 oe_el2.1.a: "颁布《总督区大宪章》，永固宗藩法度"
 oe_el2.1.a.tt: "获得 25 年#G 《帝国总督区大宪章》#!加成，强化附庸忠心、外交容量与拓殖移民。"
 oe_el2.1.b: "收缴首批总督区纳贡金充实国库"
 oe_el2.1.b.tt: "立即获得金币与帝国威望。"
 oe_el2.2.title: "跨洋大重逢"
 oe_el2.2.desc_tur: "破晓的海雾在大西洋中脊骤然散去，来自欧洲的大帆船与极乐洲铜甲巡航舰在亚速尔海域四目相对。商船水手带来的消息令整座切萨皮克皇宫陷入死寂：新月战旗正飘扬于狄奥多西三重城墙之上，奥斯曼苏丹已据守千年帝都君士坦丁堡！"
 oe_el2.2.desc_latin: "破晓的海雾在大西洋中脊骤然散去，欧洲来船与极乐洲巡洋舰在亚速尔海域相逢。来使带来的旧大陆消息令元老院怒火中烧：拉丁海洋共和国的商旗正高悬于金角湾畔，昔日十字军劫掠的阴影再度笼罩君士坦丁堡！"
 oe_el2.2.desc_roman: "破晓的海雾在大西洋中脊骤然散去，极乐洲舰队与旧大陆来船在亚速尔海域互鸣礼炮。令人热泪盈眶的消息传遍新都：博斯普鲁斯海峡的紫色双头鹰旗竟仍在猎猎飘扬——大西洋两岸的两支罗马血脉跨越百年隔绝，终于在浩瀚沧溟之上再度相认！"
 oe_el2.2.desc_celestial: "破晓的海雾在大西洋中脊骤然散去，极乐洲水师终于重新绘通通往直布罗陀与地中海的航图。然而欧洲水手绘声绘色讲述的奇闻却让全城目瞪口呆：君士坦丁堡城头竟飘扬着来自极东天朝的日月龙旗，东方天子已将疆域推抵博斯普鲁斯海峡！"
 oe_el2.2.desc_rus: "破晓的海雾在大西洋中脊骤然散去，极乐洲船队重新绘通直布罗陀与爱琴海航图。消息传回元老院，举朝震动：北方罗斯沙皇高举双头鹰旗南下黑海，自诩第三罗马的斯拉夫大军如今正驻守在君士坦丁堡的城垣之上！"
 oe_el2.2.desc_other: "破晓的海雾在大西洋中脊骤然散去，极乐洲铜甲舰队与旧大陆商船在亚速尔海域破浪初遇。百年孤悬的迷雾一朝揭开，直布罗陀、里斯本、罗马与君士坦丁堡的航图重现御案——新旧两个世界的命运，从此再度交织。"
 oe_el2.2.a: "重燃光复誓言：为东征故土备战"
 oe_el2.2.a.tt: "获得 25 年#G 《跨洋光复誓言》#!海军加成，并解锁#T 《筹建赫斯珀里得斯东征前进基地》#!决议。"
 oe_el2.2.b: "以极乐丝绸倾销旧大陆诸港"
 oe_el2.2.b.tt: "获得 20 年#G 《极乐丝绸倾销旧大陆》#!贸易暴利加成与金币。"
 oe_el2.2.c: "遣密使与旧大陆拜占庭残脉缔结双鹰密约"
 oe_el2.2.c.tt: "大幅增进与旧大陆拜占庭关系，并获得 25 年#G 《双鹰跨洋密约》#!加成。"
 oe_el2.3.title: "赫斯珀里得斯东征前进基地"
 oe_el2.3.desc: "若欲令铜甲舰队横渡浩瀚大西洋直指地中海，必先在亚速尔、马德拉、百慕大或直布罗陀确立一座稳固的中继海港。海军部呈上三策，请陛下御裁。"
 oe_el2.3.a: "外交重金购岛拓建（无主 150 金 / 邻国 650 金）"
 oe_el2.3.a.tt: "优先购得或拓建亚速尔/马德拉/百慕大/直布罗陀之一并赋予核心（绝不侵占其他人类玩家领地）。"
 oe_el2.3.b: "颁布奇袭令：授予光复 CB 与铜甲远征加成"
 oe_el2.3.b.tt: "对亚速尔、马德拉与直布罗陀实控国授予光复宣战理由，并获 15 年#G 《赫斯珀里得斯铜甲远征舰队》#!加成。"
 oe_el2.3.c: "拨款 120 金为已控前哨岛修筑海港与粮仓"
 oe_el2.3.c.tt: "在已持有的跳板岛（或首都）立即修筑船坞与粮仓，强化远洋补给能力。"
 oe_el2.4.title: "真·双头大帝：跨洋实体分封裁决"
 oe_el2.4.desc: "从切萨皮克的新君士坦丁堡到博斯普鲁斯的圣索菲亚穹顶，双头鹰的羽翼已同时覆盖新旧两界。然而万里大洋横亘其间，单凭一都直辖难以兼顾东西万里江山。今日元老院与百官齐聚紫殿，恭请圣上裁定两洋帝国的实体疆界与首都所在！"
 oe_el2.4.a: "迁都君士坦丁堡，保留切萨皮克西都直辖领并封余部为「极乐洲大总督区」"
 oe_el2.4.a.tt: "先将首都正式迁回#W 君士坦丁堡#!，#G 永久保留切萨皮克、南塞蒙德、基斯基亚克三处皇帝西都直辖领#!，再将其余美洲直辖领地析出为独立帝国总督区#T 《极乐洲大总督区》#!（若美洲仅余三地则不空析），既有区域总督区仍直属宗主。"
 oe_el2.4.b: "定都新君士坦丁堡，封旧大陆为「东方罗马大总督区」"
 oe_el2.4.b.tt: "保持首都位于美洲新都，将欧洲/西亚/北非直辖领地析出为#T 《东方罗马大总督区》#!，获永久#G 《新君士坦丁堡西极皇庭》#!加成。"
 oe_el2.4.c: "确立真·双京共治联邦：君堡与切萨皮克双核并峙"
 oe_el2.4.c.tt: "保留君士坦丁堡与切萨皮克双都直辖及双近距辐射核心，确立#T 《双头大帝国》#!国号并获永久#G 《真·双京共治联邦宪章》#!。"
 oe_el2.5.title: "北岸长船：文兰重逢"
 oe_el2.5.desc: "向北巡弋纽芬兰冰雪峡湾的极乐洲哨舰带回了意想不到的奇遇：在松林环绕的木寨港湾中，操着冰岛古语、乘着龙头长船的诺斯后裔已在此繁衍生息数代。当他们见到船头闪耀的双头鹰旗，老船长竟用略带口音的希腊语高呼起昔日瓦兰吉卫队的口号！"
 oe_el2.5.a: "以天主同胞之礼厚待文兰使团"
 oe_el2.5.a.tt: "与文兰建立友好关系，互通北洋毛皮与渔业贸易。"
 oe_el2.5.b: "敬重其先祖萨迦，听任古诺斯信仰在北岸复兴"
 oe_el2.5.b.tt: "文兰改奉古老北方信仰#Y 诺斯教#!，同时提升我方海军与文化传统。"
 oe_el2.6.title: "瓦兰吉血盟"
 oe_el2.6.desc: "文兰的战斧勇士听闻帝国在新大陆重建紫宫，成群结队乘长船南下切萨皮克求见陛下。他们愿以先祖在君士坦丁堡护卫皇帝的古老血誓，再度为新罗马披甲执斧。"
 oe_el2.6.a: "重订瓦兰吉血盟，招募北岸重斧卫队"
 oe_el2.6.a.tt: "获得 30 年#G 《北岸瓦兰吉血盟》#!加成，强化重步兵战力、陆军传统与毛皮渔业产出。"
 oe_el2.6.b: "婉拒军事血盟，仅续签北洋通商协定"
 oe_el2.6.b.tt: "获得金币与威望。"
 oe_el2.7.title: "北洋总督：文兰归宗"
 oe_el2.7.desc: "随着新罗马的商道与军港延伸至圣劳伦斯湾外，文兰诸领主聚议前程：或受领帝国金印编入北极乐总督区以求庇护，或在冰海风雪间坚守独立王冠。"
 oe_el2.7.a: "颁赐 250 金与总督金印，和平收编文兰为帝国总督区"
 oe_el2.7.a.tt: "和平将文兰收编为#T 《北极乐·文兰总督区》#!（帝国总督区附庸）。"
 oe_el2.7.b: "宣示北洋宗主权：以铁与火迫其归附"
 oe_el2.7.b.tt: "对文兰获得光复宣战理由并提升海军传统。"
 oe_el2.7.c: "尊重文兰独立王冠，永结北洋友邦"
 oe_el2.7.c.tt: "增进双边好感并获得威望。"
 oe_el2.8.title: "马克兰木材与毛皮特许"
 oe_el2.8.desc: "文兰船匠熟谙寒带巨松采伐与北洋捕猎之道。海军部建议颁布马克兰木材与毛皮特许状，将北方林场直接纳入新君士坦丁堡造舰体系。"
 oe_el2.8.a: "颁布特许状并拨款 150 金建设北岸木场"
 oe_el2.8.a.tt: "获得 30 年#G 《马克兰木材与毛皮特许状》#!加成，提升造船速度、水手与木材产出。"
 oe_el2.8.b: "仅向北洋商船课征常规关税"
 oe_el2.8.b.tt: "立即获得一笔关税收入。"
 oe_el2.9.title: "翠林青铜盾：尤卡坦的斯巴达尼亚"
 oe_el2.9.desc: "一艘在墨西哥湾遭遇飓风偏航的极乐洲巡洋舰，在尤卡坦北岸的石灰岩海崖下见到了匪夷所思的景象：一列身披青铜胸甲、高举拉姆达圆盾的方阵战士正以古雅典与摩里亚口音的希腊语盘问来客。他们自称是随西渡风暴失散的拉科尼亚远征军后裔——斯巴达尼亚的守望者！"
 oe_el2.9.a: "高举双头鹰旗致意失散的拉科尼亚同袍"
 oe_el2.9.a.tt: "与斯巴达尼亚缔结友好关系，提升陆军传统与威望。"
 oe_el2.9.b: "遣工匠携 100 金与铁炉支援尤卡坦要塞"
 oe_el2.9.b.tt: "资助斯巴达尼亚巩固城防，大幅提升双边好感与我方军威。"
 oe_el2.10.title: "拉科尼亚盾阵同盟"
 oe_el2.10.desc: "斯巴达尼亚的执政官遣使北上切萨皮克，提议以古老的拉科尼亚军律与新罗马的喷火军团互通操典，共御中美洲诸强与跨洋强敌。"
 oe_el2.10.a: "缔结拉科尼亚盾阵同盟，合练精锐步兵"
 oe_el2.10.a.tt: "获得 25 年#G 《拉科尼亚盾阵同盟》#!加成，全面提升陆军纪律、陆军传统与士气。"
 oe_el2.10.b: "互换兵法典籍而不结正式同盟"
 oe_el2.10.b.tt: "获得陆军传统与威望。"
 oe_el2.11.title: "敕封拉科尼亚军事总督区"
 oe_el2.11.desc: "面对中美洲腹地日益炽烈的战云，斯巴达尼亚议会愿承认新罗马皇帝为最高统帅，条件是保留其拉科尼亚军团名号与自治兵制，作为帝国镇守墨西哥湾南岸的前沿兵站。"
 oe_el2.11.a: "拨付 250 金军饷，敕封斯巴达尼亚为军事总督区"
 oe_el2.11.a.tt: "和平将斯巴达尼亚纳为帝国总督区并保留其拉科尼亚名号。"
 oe_el2.11.b: "尊其为自由盟邦，毋庸称臣"
 oe_el2.11.b.tt: "获得威望与陆军传统。"
 oe_el2.12.title: "斯巴达方阵与特诺奇蒂特兰"
 oe_el2.12.desc: "斯巴达尼亚的哨骑越过热带雨林与火山山口，直抵墨西哥谷地雄伟的湖上巨城特诺奇蒂特兰。那里的黑曜石武士与太阳神庙正严阵以待——帝国必须在联合远征与跨湾通商之间作出抉择。"
 oe_el2.12.a: "墨西哥谷地联合远征：以铜甲与方阵叩关"
 oe_el2.12.a.tt: "对特诺奇蒂特兰实控国授予宣战理由，并获 15 年#G 《拉科尼亚盾阵同盟》#!加成。"
 oe_el2.12.b: "缔结《白银与黑曜石和约》，共兴墨西哥湾商路"
 oe_el2.12.b.tt: "改善与特诺奇蒂特兰实控国关系，获 20 年#G 《白银与黑曜石和约》#!贸易加成与金币。"
 oe_el2.13.title: "[ROOT.GetCountry.GetCapital.GetName]桑蚕御丝坊"
 oe_el2.13.desc: "随方舟西渡而来的君士坦丁堡织匠终于在[ROOT.GetCountry.GetCapital.GetName]周边的红桑林中成功驯化蚕种。如今新罗马不仅能自产紫红御丝，更能进一步织就惊艳大西洋两岸的极乐紫锦！"
 oe_el2.13.a: "拨款 120 金在首都立即敕建「极乐丝绸御坊」"
 oe_el2.13.a.tt: "解锁#T 极乐丝绸御坊#!建筑（双 30% 利润率配方），并立即在首都建成一座。"
 oe_el2.13.b: "将织丝特许下放市民行会自由营建"
 oe_el2.13.b.tt: "解锁#T 极乐丝绸御坊#!建筑供各地自建，并获特许费与文化传统。"
 oe_el2.14.title: "[ROOT.GetCountry.GetCapital.GetName]希腊火船坞与铸炮局"
 oe_el2.14.desc: "结合丰富的松焦油、铜矿与硝石，帝国军械师在[ROOT.GetCountry.GetCapital.GetName]将千年秘传的希腊火虹吸管与远洋铜甲战舰舾装合炉并造，打造出专属于新罗马的近代海军兵工枢纽。"
 oe_el2.14.a: "拨款 150 金在沿海立即敕建「希腊火船坞与铸炮局」"
 oe_el2.14.a.tt: "解锁#T 新君堡希腊火船坞与铸炮局#!建筑（双 30% 利润率配方），并立即在沿海建成一座。"
 oe_el2.14.b: "将船坞图样颁行各省海军造船所"
 oe_el2.14.b.tt: "解锁#T 新君堡希腊火船坞与铸炮局#!建筑供各沿海城邑营建，并提升海军传统。"
 oe_el2.15.title: "五大总督区大议会"
 oe_el2.15.desc: "从北岸冰海到加勒比群岛，从密西西比平原到黄金安第斯，五位以上的帝国总督齐聚新君士坦丁堡紫殿共商宪章。新罗马以分治而统合、以海权而联陆的洲际大秩序已蔚然大观！"
 oe_el2.15.a: "确立常设五大总督区大议会"
 oe_el2.15.a.tt: "获得永久#G 《五大总督区大议会》#!加成，大幅强化附庸忠心、外交容量、贸易收入与水手。"
 oe_el2.15.b: "统筹海事税赋充盈帝国国库"
 oe_el2.15.b.tt: "获得 400 金、威望及 25 年总督区宪章加成。"
 oe_el2.16.title: "故土重光：旧大陆总督体系重构"
 oe_el2.16.desc: "色雷斯、安纳托利亚、拉文纳与亚历山大的双头鹰总督旗帜次第升起于地中海诸城。昔日跨海西渡的孤舟流民，如今已以两洋霸主之姿重塑旧大陆千年罗马行省！"
 oe_el2.16.a: "颁布《地中海故土总督新法》"
 oe_el2.16.a.tt: "获得永久#G 《故土总督体系重构》#!加成，强化文化同化、最大控制力与附庸忠心。"
 oe_el2.16.b: "将故土复建商税投入跨洋航运"
 oe_el2.16.b.tt: "获得 350 金、文化传统及 25 年故土总督区加成。"
 oe_el2.90.title: "【读数】极乐洲新罗马 2.0 实时遥测"
 oe_el2.90.desc: "#T 极乐洲新罗马 2.0 核心遥测（实时只读）：#!\n· 活跃帝国总督区总数：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_exarchate_count_val')|0]#!　｜　美洲督区：#G [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_amer_exarch_count_val')|0]#! / 6　｜　故土督区：#G [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_old_exarch_count_val')|0]#! / 4\n· 极乐丝绸御坊数：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_silk_count_val')|0]#!　｜　希腊火船坞数：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_arsenal_count_val')|0]#!\n· 跨洋大重逢：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_reunion_done_val')|0]#!　｜　赫斯珀里得斯跳板：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_springboard_done_val')|0]#!　｜　双头大帝分封轨（0未定/1东迁/2西坐/3双京）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_bicephalum_done_val')|0]#!\n· 北岸文兰状态（0未现/1接触/2血盟/3总督）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_vinland_state_val')|0]#!　｜　尤卡坦斯巴达尼亚状态（0未现/1接触/2同盟/3总督）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_spartania_state_val')|0]#!"
 oe_el2.90.a: "关闭读数面板"
