 STATIC_MODIFIER_NAME_oe_el2_exarchate_charter_mod: "帝国总督区大宪章"
 STATIC_MODIFIER_DESC_oe_el2_exarchate_charter_mod: "确立新罗马海外总督分治法度，提升附庸忠心、外交容量与拓殖移民规模。"
 STATIC_MODIFIER_NAME_oe_el2_reunion_zeal_mod: "跨洋光复誓言"
 STATIC_MODIFIER_DESC_oe_el2_reunion_zeal_mod: "百年孤悬终破迷雾，新罗马水师重燃横渡大西洋、收复故土的炽烈雄心。"
 STATIC_MODIFIER_NAME_oe_el2_atlantic_silk_glut_mod: "极乐丝绸倾销旧大陆"
 STATIC_MODIFIER_DESC_oe_el2_atlantic_silk_glut_mod: "来自切萨皮克的紫红御丝涌入欧洲诸港，为帝国带来源源不断的跨洋贸易暴利与声望。"
 STATIC_MODIFIER_NAME_oe_el2_secret_roman_accord_mod: "双鹰跨洋密约"
 STATIC_MODIFIER_DESC_oe_el2_secret_roman_accord_mod: "东西两支罗马皇脉跨越重洋互通声气，共守千年正统与地中海航道。"
 STATIC_MODIFIER_NAME_oe_el2_hesperides_fleet_mod: "赫斯珀里得斯铜甲远征舰队"
 STATIC_MODIFIER_DESC_oe_el2_hesperides_fleet_mod: "依托大西洋中继跳板岛整训东征舰队，大幅延展作战航程、水师士气与造船效率。"
 STATIC_MODIFIER_NAME_oe_el2_eastern_restoration_seat_mod: "君士坦丁堡重登皇座"
 STATIC_MODIFIER_DESC_oe_el2_eastern_restoration_seat_mod: "皇驾重归金角湾并敕封极乐洲大总督区，以旧都法统统筹大西洋两岸版图。"
 STATIC_MODIFIER_NAME_oe_el2_western_seat_mod: "新君士坦丁堡西极皇庭"
 STATIC_MODIFIER_DESC_oe_el2_western_seat_mod: "定都极乐洲并敕封东方罗马总督区执掌故土，使新大陆成为两洋帝国的贸易与拓殖中枢。"
 STATIC_MODIFIER_NAME_oe_el2_bicephalum_federation_mod: "真·双京共治联邦宪章"
 STATIC_MODIFIER_DESC_oe_el2_bicephalum_federation_mod: "君士坦丁堡与极乐新都双核并峙、统筹各翼总督区，展现双头大帝横跨两洋的制度伟力。"
 STATIC_MODIFIER_NAME_oe_el2_varangian_blood_pact_mod: "北岸瓦兰吉血盟"
 STATIC_MODIFIER_DESC_oe_el2_varangian_blood_pact_mod: "极乐洲与文兰诺斯人重续千年瓦兰吉护卫誓约，北洋毛皮渔获与重步兵战力齐增。"
 STATIC_MODIFIER_NAME_oe_el2_markland_charter_mod: "马克兰木材与毛皮特许状"
 STATIC_MODIFIER_DESC_oe_el2_markland_charter_mod: "北方松林船材与水手源源南下切萨皮克船坞，全面加速大西洋舰队扩建。"
 STATIC_MODIFIER_NAME_oe_el2_laconian_phalanx_mod: "拉科尼亚盾阵同盟"
 STATIC_MODIFIER_DESC_oe_el2_laconian_phalanx_mod: "与尤卡坦斯巴达尼亚军团并肩整军经武，严苛的拉科尼亚操典铸就铁血纪律。"
 STATIC_MODIFIER_NAME_oe_el2_obsidian_silver_accord_mod: "白银与黑曜石和约"
 STATIC_MODIFIER_DESC_oe_el2_obsidian_silver_accord_mod: "极乐洲、斯巴达尼亚与墨西哥谷地诸邦化干戈为商旅，白银与工坊货物流通两湾。"
 STATIC_MODIFIER_NAME_oe_el2_five_exarchates_council_mod: "五大总督区大议会"
 STATIC_MODIFIER_DESC_oe_el2_five_exarchates_council_mod: "美洲五大总督区代表齐聚极乐元老院共议海陆防务与商税，新罗马美洲秩序臻于鼎盛。"
 STATIC_MODIFIER_NAME_oe_el2_old_world_exarchates_mod: "故土总督体系重构"
 STATIC_MODIFIER_DESC_oe_el2_old_world_exarchates_mod: "色雷斯、安纳托利亚、拉文纳与亚历山大等旧大陆总督区次第重光，千年罗马行省秩序再现地中海。"
