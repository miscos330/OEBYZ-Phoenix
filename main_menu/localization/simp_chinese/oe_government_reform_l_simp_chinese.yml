#other
#=====================================

oe_byz_theme_system_subject: "帝国军区"
oe_byz_theme_system_subject_desc: "这个国家是[GetCountry('BYZ').GetName]的帝国军区，这是一个军政兼容的组织，它基本上解决了兵员和军费上的困难，也使人口流动中的无组织状态得到控制，缓和了尖锐的社会矛盾。\n\n军区法条规定的军饷、食物消耗和忠诚度效果由本改革直接施加；仅军饷补助随东罗马的军区军饷比例变化。"

oe_real_gov_reform_building_com: "帝国工程院"
oe_real_gov_reform_building_com_desc: "这个机构的主要职责是修建大型建筑，规划城市布局，组织工程项目等"

oe_byz_sub_gov_hun_country: "匈牙利边疆区"
oe_byz_sub_gov_hun_country_desc: "桀骜不驯的马扎尔人似乎不适合直接管辖，让我们设立边疆区，授予马扎尔人自治特权以保护疆界"

oe_byz_sub_gov_slovakia_country: "斯洛伐克黄金区"
oe_byz_sub_gov_slovakia_country_desc: "斯洛伐克地区出产大量的金银矿，我们理应对此地采取特别辖制"

oe_sub_mam_system_subject: "埃及领地"
oe_sub_mam_system_subject_desc: "埃及因其经济地位在帝国中享有特殊地位"

oe_sub_religion_system_subject: "五大牧首区"
oe_sub_religion_system_subject_desc: "这个国家是五大牧首区之一，明面上牧首区牧首具有至高仲裁权，但实际的世俗权力仍然掌握在当地总督手中"

oe_byz_rr_mil_subject: "远征兵团" 
oe_byz_rr_mil_subject_desc: "这个国家完全仰赖于远征而来的罗马军事兵团"

oe_byz_rr_mil_subject_end_I: "军事领主"
oe_byz_rr_mil_subject_end_I_desc: "这个国家通过军事远征获得了一片领地，野心勃勃，独立性强"

