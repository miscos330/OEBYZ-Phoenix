#=====================================
#BYZ
#=====================================

oe_byz_badsystem: "#R 琼筵序次#!"
oe_byz_badsystem_desc: "拜占庭帝国曾经#bold #color_yellow 辉煌#!#!高效的中央官僚制度如今只剩下一片空有头衔的断壁残垣，#bold #R 货币贬值，领土缩水，频繁内战#!#!严重打击了我们的官僚制度，现在帝国政府内充满了无能的亲信和谄媚奉承者，我们变得越来越像一个偏安一隅的希腊政权，而不是普世帝国"

oe_byz_goodsystem: "琼筵序次"
oe_byz_goodsystem_desc: "我们成功重组了东罗马的官僚系统，现在，皇帝的意志又可以通过忠诚地官僚们伸展到帝国各处，如臂指使"

oe_byz_crown_reform: "生于紫室"
oe_byz_crown_reform_desc: "我们是一个古老的中央集权帝国的皇帝，继承着罗马帝国的法统，我们皇室的尊贵无人能及"

oe_byz_lose_army: "依赖雇佣兵"
oe_byz_lose_army_desc: "拜占庭帝国的中央军队在小亚细亚接连不断的军事灾难中规模日益萎靡，各任统治者开始变得越来越喜欢使用外族雇佣兵而不是中央军队"

oe_byz_rebuild_army: "罗马军队新生"
oe_byz_rebuild_army_desc: "重新编定军籍、安排军饷并恢复操练之后，帝国终于有了一支可以长期依靠的军队。它尚未恢复往日的规模，却已迈出摆脱雇佣兵依赖的第一步。"
