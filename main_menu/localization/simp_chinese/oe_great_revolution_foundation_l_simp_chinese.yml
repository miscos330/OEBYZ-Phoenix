 oe_gr_republic_power_structure_law: "共和国权力结构"
 oe_gr_republic_power_structure_law_desc: "皇权退场后，罗马必须重新回答一个古老的问题：国家的命令究竟应当出自何人之口？"
 oe_gr_civic_assembly_policy: "公民大会"
 oe_gr_civic_assembly_policy_desc: "城市与乡村的代表共同议事。贵族身份与教会职位不再赋予议会席位；贵族和教士被排除在大会之外。"
 oe_roman_republic: "罗马共和国"
 oe_roman_republic_desc: "由市民与平民参与的共和议会。国家的权威必须在公开辩论、议案与公民的认可中重新建立。"
 STATIC_MODIFIER_NAME_oe_gr_newborn_republic: "共和国新生"
 STATIC_MODIFIER_DESC_oe_gr_newborn_republic: "旧王座倒下之际，罗马人第一次看见亲手重建国家的可能。热情鼓舞军队与官署，也使革命者愈发相信，他们有权将世界改造成理想中的模样。"
 STATIC_MODIFIER_NAME_oe_gr_chaotic_civic_assembly: "混乱的公民大会"
 STATIC_MODIFIER_DESC_oe_gr_chaotic_civic_assembly: "代表们终于能够发言，却尚未学会如何共同作出决定。程序争执、地方诉求与彼此矛盾的承诺，使每项议案都步履维艰。"
 oe_great_revolution.20.t: "筹备新政权"
 oe_great_revolution.20.d: "宫门外的街垒还没有拆除，临时政府的桌上已经堆满了请求：军队要饷，粮商要担保，行省要知道谁有权签署明日的命令。推翻皇帝只用了一夜，接管一个国家却不能只凭胜利的欢呼。\n\n行会与村社派来使者，愿为新政权献出信用与人力；三位才干卓著的公民也走进了官署。他们没有旧宫廷的显赫头衔，却带来了治理、交涉与统军的本领。人们尚不知道共和国将把罗马带往何处，只知道此刻终于有人肯为明天负责。"
 oe_great_revolution.20.a: "让罗马从今日重新运转。"
 oe_great_revolution.21.t: "成立公民大会"
 oe_great_revolution.21.d: "议事厅的门第一次向城市与乡村的代表同时敞开。工匠把带着墨迹的请愿书摊在案上，农人的使者念出征税与役期的清单；昨日只配站在门外等候的人，今日要求为国家的法律投下自己的声音。\n\n大会宣布，紫袍的血统与主教的权杖不再构成入席的资格。欢呼随即淹没了主持者的钟声：谁有权发言、何时结束辩论、怎样计算赞同，每一个问题都引来新的争执。罗马终于有了公民的大会，却还没有使公民共同决断的习惯。"
 oe_great_revolution.21.a: "国家的事务，交由公民议决。"
 oe_great_revolution.22.t: "为新国家命名"
 oe_great_revolution.22.d: "新的印玺即将刻成，外交文书却在国名一栏留下了空白。我们仍然是罗马，但皇帝不再代表罗马；国家需要一个名字，使远方的行省、军队与列国明白，这场革命究竟建立了什么。\n\n有人主张以共和国宣告权力的来源，有人希望以联邦许诺各地共同参与；另一些人则追溯更古老的誓言，将元老院与罗马人民并列其上。这个名字不会替我们平息争论，却将从此承载我们向世界作出的承诺。"
 oe_great_revolution.23.t: "[ROOT.GetCountry.GetNameWithNoTooltip]成立"
 oe_great_revolution.23.d: "新国名在公民大会中被宣读，随后送往军营、港口与每一座仍能收到首都公文的城市。印玺落下时，厅堂里短暂地安静了：街垒上的呼喊，终于变成一个能够签署法令、承担债务、向人民许诺明天的国家。\n\n[ROOT.GetCountry.GetNameWithNoTooltip]已经成立。它继承了罗马辽阔的疆土，也继承了尚未偿清的仇怨。今天的欢庆不能抹去明日的危险，但公民们终于有了一个愿意共同保卫的名字。此后，革命必须用自己的行动证明，它不仅能够推翻旧秩序，也能够建立新的秩序。"
 oe_great_revolution.23.a: "让这个名字配得上罗马人民。"
