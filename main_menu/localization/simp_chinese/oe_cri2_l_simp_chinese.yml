 oe_cri2_dec_lia_grand_granary_relief: "颁布全国常平救灾与水利兴修令"
 oe_cri2_dec_lia_grand_granary_relief.title: "颁布全国常平救灾与水利兴修令"
 oe_cri2_dec_lia_grand_granary_relief_desc: "在小冰期严寒期间由国库统一拨银购粮、向饥荒行省紧急拨粮并兴修防冻水利：推进小冰期救灾进度；累计达#G 3#!点后授予#Y 耐寒农政与常平永固#!并彻底化解危机。若正启用内阁行动#Y 常备粮仓平粜#!或处于温和模式，经费直降一半。"
 oe_cri2_dec_lia_grand_granary_relief.desc: "在小冰期严寒期间由国库统一拨银购粮、向饥荒行省紧急拨粮并兴修防冻水利：推进小冰期救灾进度；累计达#G 3#!点后授予#Y 耐寒农政与常平永固#!并彻底化解危机。若正启用内阁行动#Y 常备粮仓平粜#!或处于温和模式，经费直降一半。"
 oe_cri2_dec_lia_grand_granary_relief.a: "拨银开仓，兴修冬防农政"
 oe_cri2_dec_silver_standard_reform: "推行税制银本位与健全铸币大改革"
 oe_cri2_dec_silver_standard_reform.title: "推行税制银本位与健全铸币大改革"
 oe_cri2_dec_silver_standard_reform_desc: "在白银价格革命期间全面统一度量成色、废除陈旧实物摊派并将赋税锚定足色白银：即时压降通胀、授予长达四十年的#Y 税制银本位与健全铸币纪元#!并终结白银价格革命灾难。若正启用内阁行动#Y 反劣币铸币整顿#!，改革费用直降四成。"
 oe_cri2_dec_silver_standard_reform.desc: "在白银价格革命期间全面统一度量成色、废除陈旧实物摊派并将赋税锚定足色白银：即时压降通胀、授予长达四十年的#Y 税制银本位与健全铸币纪元#!并终结白银价格革命灾难。若正启用内阁行动#Y 反劣币铸币整顿#!，改革费用直降四成。"
 oe_cri2_dec_silver_standard_reform.a: "敕行银本位改制，重铸足色国币"
 oe_cri2.1.title: "严霜蔽野：小冰期大危机降临"
 oe_cri2.1.desc: "接连数冬的罕见严寒冻封了运河与海港，早霜与连阴雨吞噬了本季收成。州县告急文书雪片般飞入御前，粮价一日三涨，乡野已有流民聚集之象。朝廷必须即刻定下抗灾总方略。"
 oe_cri2.1.a: "即刻拨银开仓，向首都粮市与饥荒州县平粜救济"
 oe_cri2.1.b: "责令地方官自行筹措，严保国库现银"
 oe_cri2.2.title: "冰封河道与粮价暴涨"
 oe_cri2.2.desc: "凛冽寒风将大河与内陆运道化作坚冰，商船停摆，市镇米麦价格瞬间飙升。城中工匠与农众纷纷聚集在官仓门前，呼吁朝廷平价售粮。"
 oe_cri2.2.a: "动用常平仓平粜稳价（若启常备粮仓内阁行动，费用减半且成效加倍！）"
 oe_cri2.2.b: "颁布临时限价令，严惩囤积居奇商号"
 oe_cri2.2.c: "听任商帮高价调运以自发平抑缺口"
 oe_cri2.3.title: "跨海官粮专运：尼罗河粮船与江南漕运"
 oe_cri2.3.desc: "本土寒潮未退，但跨海大粮仓与南北水运干线仍可为饥荒地区输血。水师提督与度支大臣呈上紧急调粮图录，请示是否启用帝国远洋或漕运专船驰援灾区。"
 oe_cri2.3.a: "敕调亚历山大尼罗河粮船直抵饥荒市镇（联动埃及粮市！）"
 oe_cri2.3.b: "大运河与海运双轨北调江南官粮（联动海运漕粮！）"
 oe_cri2.3.c: "征召民间商船就近跨港转运余粮"
 oe_cri2.4.title: "草原雪灾与游牧南压"
 oe_cri2.4.desc: "一场罕见的暴风雪（白灾）席卷北方大草原，牲畜大量冻毙。走投无路的游牧部族正驱赶马群逼近农耕边疆，或求互市换粮，或图劫掠过冬。"
 oe_cri2.4.a: "开边市以茶粮换骏马，安抚草原部族"
 oe_cri2.4.b: "增调重兵戍守边墙与鹿砦，严阵拒敌"
 oe_cri2.5.title: "寒带农作革命：耐寒作物与深耕水利"
 oe_cri2.5.desc: "农官与地方乡绅汇报，引入耐寒谷物、推广轮耕深翻并整修排水冬渠，已在数处试验庄园显著抵御了霜害。若获国库资助，可于全国推广。"
 oe_cri2.5.a: "拨款在全国推广耐寒农法与冬防灌溉"
 oe_cri2.5.b: "令各地庄园自行仿效，国库暂不加支"
 oe_cri2.6.title: "饥荒流民潮与乡里请愿"
 oe_cri2.6.desc: "失收州县的流民成群涌入大城郊外，乡老与农众联名递上减赋缓征请愿书。一旦处置失当，这场寒灾恐将演变为席卷全国的农民大起义。"
 oe_cri2.6.a: "核准临时减赋缓征并设棚施粥，安抚流民"
 oe_cri2.6.b: "遣兵驱散流民、严催正供以保军费"
 oe_cri2.7.title: "白银狂潮：十六世纪价格革命爆发"
 oe_cri2.7.desc: "满载美洲波托西与日本石见白银的船队不断靠岸，欧亚各大市场的贵金属骤然泛滥。物价连年攀升、旧有定额田赋与军饷购买力缩水，国库与商帮同时卷入史无前例的货币风暴。"
 oe_cri2.7.a: "即刻整肃皇家造币厂成色并收缩铸币发行"
 oe_cri2.7.b: "顺势加铸银币充盈国库，延后结构改革"
 oe_cri2.8.title: "美洲与石见白银涌入欧亚商港"
 oe_cri2.8.desc: "成箱银锭在欧亚各大港口与丝绸、瓷器、胡椒竞价交割。海关官吏建议趁机征收白银过境关税并引导资本流向实体工坊，行会匠师则担忧外货与通胀击垮本土作坊。"
 oe_cri2.8.a: "对过境白银开征标准验色税，充实改革准备金"
 oe_cri2.8.b: "向市民行会减让商税以稳住手工业物价"
 oe_cri2.9.title: "一条鞭法与白银锚定宝钞"
 oe_cri2.9.desc: "面对滚滚东来的白银浪潮，户部与盐铁度支大臣提出划时代之计：废除繁杂徭役与实物征调，将田赋丁役合并折银征收；若与大元宝钞银本位改革相衔接，更可一举化银潮危机为商业黄金纪元！"
 oe_cri2.9.a: "敕行「一条鞭法与白银锚定宝钞」，一举平息白银革命！（联动宝钞改革！）"
 oe_cri2.9.b: "宝钞信用已危，忍痛废钞改银以求货币重生"
 oe_cri2.9.c: "稳步推行田赋折银试点，积累银本位改革经验"
 oe_cri2.10.title: "银币贬值与军饷骚动"
 oe_cri2.10.desc: "物价飞涨令按定额发放的银币军饷大打折扣，精锐禁军与边镇驻军纷纷投诉领到的却是含铜过高的劣质银币。若不能恢复足色发饷，营中恐生哗变。"
 oe_cri2.10.a: "重铸足色银币补足军饷差额，严惩铸币贪吏"
 oe_cri2.10.b: "强行推行掺铜减重银币以省国库支出"
 oe_cri2.11.title: "国库借贷膨胀与破产阴影"
 oe_cri2.11.desc: "欧亚大银号见通胀高企，纷纷抬高王室借贷利率并缩减信用额度。若不与银团重新议定债务展期并压缩开支，国库将在下一次大考中面临违约风暴。"
 oe_cri2.11.a: "与银团达成有序展期与财政紧缩协约"
 oe_cri2.11.b: "单方面暂停部分王室票息以应急筹款"
 oe_cri2.12.title: "帝国主权公债白银重整"
 oe_cri2.12.desc: "君士坦丁堡、威尼斯与热那亚票号联名照会财政部：白银购买力剧变已扭曲了早年发行的帝国主权公债票面价值。是否以足色白银重估本息，将决定未来数十年帝国信用。"
 oe_cri2.12.a: "以足色白银如约兑付主权公债，确立金字招牌（联动 v9.7 公债！）"
 oe_cri2.12.b: "与商帮折衷协商，以贸易特许抵扣部分票息"
 oe_cri2.13.title: "健全铸币与银本位告成"
 oe_cri2.13.desc: "随着足色银币通行全国、折银税制步入正轨且通胀回落至可控区间，席卷欧亚的十六世纪白银价格革命终于尘埃落定。帝国以焕然一新的近代财政体系迈入新纪元。"
 oe_cri2.13.a: "铭记铸币大改制，开启近代商业繁盛期"
 oe_cri2.14.title: "银价震荡与商帮挤兑"
 oe_cri2.14.desc: "海外银船延期抵港引发短期银根抽紧，数家大商号爆发汇票挤兑风波。国库是出面注资兜底以保商市秩序，还是任由投机银号自行出清？"
 oe_cri2.14.a: "动用国库准备金稳定票号清算秩序"
 oe_cri2.14.b: "任由投机商号自行出清，不耗官银"
 oe_cri2.15.title: "严寒退却：小冰期危机度过"
 oe_cri2.15.desc: "冰封多年的江河重现春汛，常平粮仓谷满仓盈，耐寒新作物与新修水利将荒年化作了丰稔之基。历尽严冬考验的臣民齐颂仁政，国势重焕生机。"
 oe_cri2.15.a: "厚赏农官与义仓守吏，永固抗灾之制"
