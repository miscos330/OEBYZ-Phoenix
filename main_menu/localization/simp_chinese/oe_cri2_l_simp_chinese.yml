 oe_cri2_silver_tide_luxury_demand: "跨洋白银潮奢品清算需求"
 oe_cri2_silver_tide_luxury_demand_desc: "美洲波托西与日本石见白银大量涌入欧亚枢纽市场，刺激了白银、丝绸、瓷器与胡椒的跨洲抢购与价格重估。"
 oe_cri2_lia_famine_relief_demand: "小冰期平准赈灾粮木需求"
 oe_cri2_lia_famine_relief_demand_desc: "严寒荒年里，朝廷通过常平仓与官营渠道紧急调拨小麦、食盐与薪炭木材以平抑粮价、救助冻馁州县。"
 STATIC_MODIFIER_NAME_oe_cri2_mild_crisis_buffer: "温和历史危机缓冲"
 STATIC_MODIFIER_DESC_oe_cri2_mild_crisis_buffer: "在温和历史危机模式下，地方义仓与温和财政缓冲机制大幅抵消了小冰期与白银价格革命的极端冲击。"
 STATIC_MODIFIER_NAME_oe_cri2_lia_resilient_agriculture: "耐寒农政与常平永固"
 STATIC_MODIFIER_DESC_oe_cri2_lia_resilient_agriculture: "历经小冰期严寒考验后，全国兴修深耕水利、广推耐寒作物并建立常态化义仓平粜体系，长远夯实了民生根基。"
 STATIC_MODIFIER_NAME_oe_cri2_lia_hardy_crops: "寒带新作物与冬耕推广"
 STATIC_MODIFIER_DESC_oe_cri2_lia_hardy_crops: "官府倡导轮作耐寒谷物、加固温室与冬春蓄水渠，在漫长冰季中稳住了主产区收成。"
 STATIC_MODIFIER_NAME_oe_cri2_lia_steppe_fortified: "边墙戒备抗御草原南压"
 STATIC_MODIFIER_DESC_oe_cri2_lia_steppe_fortified: "为阻挡因草原白灾南下寻草的游牧骑部，朝廷增筑边墙鹿砦并严整戍边军纪，边防稳固但部落关系趋紧。"
 STATIC_MODIFIER_NAME_oe_cri2_lia_steppe_trade_peace: "茶粮互市安抚草原雪灾"
 STATIC_MODIFIER_DESC_oe_cri2_lia_steppe_trade_peace: "以官茶与赈粮开放边疆互市换取骏马与停战誓约，虽分流了部分国库税入，却成功化解了寒冬边患。"
 STATIC_MODIFIER_NAME_oe_cri2_silver_standard_reformed: "税制银本位与健全铸币纪元"
 STATIC_MODIFIER_DESC_oe_cri2_silver_standard_reformed: "通过一条鞭折银、统一成色与健全主权信用，国家成功驾驭十六世纪白银狂潮，将通胀危机化为商业繁荣引擎。"
 STATIC_MODIFIER_NAME_oe_cri2_silver_mint_discipline: "皇家造币厂成色整肃"
 STATIC_MODIFIER_DESC_oe_cri2_silver_mint_discipline: "严查剪边劣币并回收成色不足之旧币，虽暂时压低了铸币盈余，却迅速稳住了银价与银号利率。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_noble_war_pay: "贵族军功抚恤与采邑保底"
 STATIC_MODIFIER_DESC_oe_cri2_pam_noble_war_pay: "议会核准向出征领主拨付军功抚恤并保底采邑免课，显著振奋士气与兵源，但国库税率随之让渡。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_noble_seats: "枢密院与司法席位世袭约"
 STATIC_MODIFIER_DESC_oe_cri2_pam_noble_seats: "向豪门世族开放枢密院与高等司法席位虽赢得阶层忠诚，却分薄了王权比例与内阁行政效能。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_silver_exchange: "商税折银与自由汇兑特许"
 STATIC_MODIFIER_DESC_oe_cri2_pam_silver_exchange: "允许商帮以足色银锭与汇票结算商税，活跃跨区贸易并缓和通胀，略减直接税征效率。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_convoy_insurance: "海商护航保费与港税减免"
 STATIC_MODIFIER_DESC_oe_cri2_pam_convoy_insurance: "由皇家海军与商帮共担护航保费并减免港税，显著提升海贸效率、压制海盗滋生，唯海军维护费稍增。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_municipal_mint: "自由市造币与度量衡自治"
 STATIC_MODIFIER_DESC_oe_cri2_pam_municipal_mint: "授予自由市与行会自主铸造辅币及校定度量衡之权，激发手工业产能与市民忠诚，但收缩了中央铸币收入。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_clergy_charity: "教区义赈与修道院施粥"
 STATIC_MODIFIER_DESC_oe_cri2_pam_clergy_charity: "拨款依托教区与修道院设立施粥所与应急粮仓，扩大储粮容量、安抚饥民并压低叛乱苗头。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_seminary: "神学院与古典抄经院津贴"
 STATIC_MODIFIER_DESC_oe_cri2_pam_seminary: "资助神学院与经典抄经院普及读写教育并巩固正统信仰宽容，唯经院保守风气略微放缓世俗科研步伐。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_open_granary: "常平仓开闸平价售粮"
 STATIC_MODIFIER_DESC_oe_cri2_pam_open_granary: "依议会请愿开闸平价发卖官粮并补贴市镇购粮，显著改善粮食供给，但短期牺牲部分国库税收。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_corvee_cap: "限劳役与禁止私加摊派"
 STATIC_MODIFIER_DESC_oe_cri2_pam_corvee_cap: "立法严限农忙劳役与地方私加摊派，激发自耕农原物料生产积极性，但大型官建工程进度随之放缓。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_cossack_register: "扩编登记哥萨克免税军籍"
 STATIC_MODIFIER_DESC_oe_cri2_pam_cossack_register: "扩增边疆登记哥萨克免税军籍，充盈国家人力并令来犯敌军深陷荒原损耗，唯略减边疆直税。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_pasture_rights: "确认边疆牧场与商道保护税"
 STATIC_MODIFIER_DESC_oe_cri2_pam_pasture_rights: "明文确认游牧部落传统牧场与商道护卫权，提升远征补给距离并安抚部众，但中央对边区控制度略有下降。"
 STATIC_MODIFIER_NAME_oe_cri2_pam_millet_autonomy: "确认商团与米勒特自治税约"
 STATIC_MODIFIER_DESC_oe_cri2_pam_millet_autonomy: "向异教商团与自治社群颁布成文税约与宗教保护，增进宽容度与商贸收益，略微引发传统教士阶层不满。"
 STATIC_MODIFIER_NAME_oe_cri2_charter_peasant_relief: "均田减赋与废除苛派宪章"
 STATIC_MODIFIER_DESC_oe_cri2_charter_peasant_relief: "朝廷在农民抗争压力下颁行均田减赋宪章：限制苛派摊征、保障口粮供给并放松农奴束缚，贵族特权则遭到压制。"
 STATIC_MODIFIER_NAME_oe_cri2_charter_free_cities: "自由城市自治与商税封顶宪章"
 STATIC_MODIFIER_DESC_oe_cri2_charter_free_cities: "商贸重镇与市民公社赢得自治宪章：封顶商税并扩大商会权力，商业繁荣走高，但王室直辖控制力与王权比例显著回落。"
 STATIC_MODIFIER_NAME_oe_cri2_charter_noble_magna_carta: "贵族大宪章与封建特权复辟"
 STATIC_MODIFIER_DESC_oe_cri2_charter_noble_magna_carta: "领主同盟迫使君主签署大宪章：大幅缩减王权并确认议会与采邑特权，虽换来贵族忠诚与充沛征召兵，却延缓了中央集权。"
 STATIC_MODIFIER_NAME_oe_cri2_charter_religious_toleration: "良心自由与宗教宽容敕令"
 STATIC_MODIFIER_DESC_oe_cri2_charter_religious_toleration: "效法《南特敕令》与《华沙联盟条约》精神，王权以成文敕令保障异端与异教社群的礼拜与公民安全，虽激怒强硬教士，却极大平息了宗教内乱。"
 STATIC_MODIFIER_NAME_oe_cri2_charter_cossack_hetmanate: "自由哥萨克军籍与边疆自治宪章"
 STATIC_MODIFIER_DESC_oe_cri2_charter_cossack_hetmanate: "边疆哥萨克赢得自治军籍与酋长会议特权：为帝国提供雄厚兵源与边防武力，代价则是地方控制上限与税额的让步。"
 STATIC_MODIFIER_NAME_oe_cri2_charter_steppe_autonomy: "草原与边疆部落自治约法"
 STATIC_MODIFIER_DESC_oe_cri2_charter_steppe_autonomy: "通过与起事部族订立边疆自治约法，朝廷确认部落世袭牧区与驿站补给义务，换取草原和平与畜产原料，但放松了郡县控制。"
 oe_cri2_test_charter_rebels: "宪章请愿起义军"
 oe_cri2_test_charter_rebels_country: "宪章请愿军"
 oe_cri2_test_charter_rebels_country_adjective: "宪章请愿军的"
 oe_cri2_little_ice_age: "小冰期大危机"
 oe_cri2_little_ice_age_desc: "十六世纪末至十八世纪初，北半球气候骤冷、河道封冻、霜期延长。粮食减产、饥荒蔓延与草原游牧南压接踵而至，唯有依托常平粮仓、跨海官粮与农政水利方能化险为夷。"
 oe_cri2_silver_price_revolution: "十六世纪白银价格革命"
 oe_cri2_silver_price_revolution_desc: "美洲波托西、中美洲银矿与日本石见银山的海量白银席卷欧亚商路。货币急剧膨胀、公债利率飙升与固定赋税缩水动摇着旧财政根基，迫使各国推行折银改制与健全铸币大改革。"
 oe_cri2_pa_nobles_war_indemnity: "贵族军功抚恤与采邑保底"
 oe_cri2_pa_nobles_war_indemnity_simple: "贵族军功抚恤"
 oe_cri2_pa_nobles_war_indemnity_desc: "贵族阶层要求议会核准军功抚恤与采邑免课保底，以换取全力支持法案：提升陆军士气与人力上限，但短期减损国库税收并强化贵族传统。"
 oe_cri2_pa_nobles_chancellery_seats: "枢密院与司法席位世袭化"
 oe_cri2_pa_nobles_chancellery_seats_simple: "枢密院世袭席位"
 oe_cri2_pa_nobles_chancellery_seats_desc: "大贵族要求在枢密院与高等法庭保留世袭席位，可显著安抚贵族满意度，但将削弱王权比例与内阁行政效率。"
 oe_cri2_pa_burghers_silver_commutation: "商税折银与自由汇兑特许"
 oe_cri2_pa_burghers_silver_commutation_simple: "商税折银汇兑"
 oe_cri2_pa_burghers_silver_commutation_desc: "市民与商帮提议改行商税折银与汇票自由流通：显著提升贸易收入并压低月度通胀，同时推进自由贸易取向，但略减直接税效率。"
 oe_cri2_pa_burghers_convoy_insurance: "海商护航保费与港税减免"
 oe_cri2_pa_burghers_convoy_insurance_simple: "海商护航保费"
 oe_cri2_pa_burghers_convoy_insurance_desc: "沿海商帮请求国家协办护航保费并减免港税：提升海上贸易效率、压制海盗滋生，但需承担额外的海军维护开支。"
 oe_cri2_pa_burghers_municipal_mint: "自由市造币与度量衡自治"
 oe_cri2_pa_burghers_municipal_mint_simple: "自由市造币自治"
 oe_cri2_pa_burghers_municipal_mint_desc: "城市行会要求享有辅币铸造与统一度量衡之自治权：提升全国生产效率与市民满意度并推动资本经济，但减少王室铸币收益。"
 oe_cri2_pa_clergy_famine_charity: "教区义赈与修道院赈灾拨款"
 oe_cri2_pa_clergy_famine_charity_simple: "教区修道院义赈"
 oe_cri2_pa_clergy_famine_charity_desc: "教士阶层呼吁拨付赈灾专款交由教区与修道院施粥储粮：扩大储粮容量、安抚农民并压低叛乱增长；若正处小冰期危机，额外推进#G +1#!抗灾进度。"
 oe_cri2_pa_clergy_seminary_patronage: "神学院与古典抄经院津贴"
 oe_cri2_pa_clergy_seminary_patronage_simple: "神学院抄经津贴"
 oe_cri2_pa_clergy_seminary_patronage_desc: "教士请求为各地神学院与经典抄经院增拨年度津贴：提升全国识字率与正统信仰宽容，唯略微放缓世俗科研速率。"
 oe_cri2_pa_peasants_granary_open: "常平仓开闸平价售粮"
 oe_cri2_pa_peasants_granary_open_simple: "常平仓平价售粮"
 oe_cri2_pa_peasants_granary_open_desc: "农民代表要求立即开闸平价发售常平仓官粮：大幅提升粮食供给与购粮效率并推动自由民倾向，虽暂损部分税入，但若处小冰期危机可额外推进#G +1#!抗灾进度。"
 oe_cri2_pa_peasants_corvee_cap: "限劳役与禁止私加摊派"
 oe_cri2_pa_peasants_corvee_cap_simple: "限劳役禁私派"
 oe_cri2_pa_peasants_corvee_cap_desc: "乡里农众恳请颁布法典限制劳役天数并严禁官吏私加摊派：提高原物料产出与农民满意度，但会放慢国家建筑营建速度。"
 oe_cri2_pa_cossacks_free_register: "扩编登记哥萨克免税军籍"
 oe_cri2_pa_cossacks_free_register_simple: "扩编哥萨克军籍"
 oe_cri2_pa_cossacks_free_register_desc: "哥萨克代表要求扩充官方免税军籍名额：显著充盈国家人力、加强领土敌军损耗并安抚哥萨克阶层，唯略微减损直税效率。"
 oe_cri2_pa_tribes_pasture_rights: "确认边疆牧场与商道保护税"
 oe_cri2_pa_tribes_pasture_rights_simple: "确认牧场与商道权"
 oe_cri2_pa_tribes_pasture_rights_desc: "部落首领要求确认边疆传统牧场与商道护卫权：拓展远征补给距离并稳固部落忠心，但会微幅降低月度中央控制度。"
 oe_cri2_pa_dhimmi_millet_autonomy: "确认商团与米勒特自治税约"
 oe_cri2_pa_dhimmi_millet_autonomy_simple: "米勒特自治税约"
 oe_cri2_pa_dhimmi_millet_autonomy_desc: "自治社群与异教商团请求确认成文税约与宗教保护：提升异教宽容与贸易收入并赢得齐米满意度，略微触动教士阶层不满。"
 oe_cri2_rd_peasant_land_relief: "均田减赋与废除苛派宪章"
 oe_cri2_rd_peasant_land_relief_desc: "饥荒与重役激起的农民起义要求朝廷颁布十五年均田减赋宪章并放松农奴束缚。"
 oe_cri2_rd_burgher_city_charter: "自由城市自治与商税封顶宪章"
 oe_cri2_rd_burgher_city_charter_desc: "通胀与重税下的市民叛军要求签订十五年自由城市自治与商税封顶宪章。"
 oe_cri2_rd_noble_magna_carta: "贵族大宪章与封建特权复辟"
 oe_cri2_rd_noble_magna_carta_desc: "不满集权与专制的贵族同盟要求君主签署十五年大宪章以保障议会与采邑特权。"
 oe_cri2_rd_religious_toleration: "良心自由与宗教宽容敕令"
 oe_cri2_rd_religious_toleration_desc: "宗教改革时代起的信仰叛军迫使王权颁布二十年宗教宽容敕令，取代血腥强制改宗。"
 oe_cri2_rd_cossack_free_register: "自由哥萨克军籍与边疆自治宪章"
 oe_cri2_rd_cossack_free_register_desc: "边疆哥萨克武装要求确认十五年自由军籍与边疆自治宪章。"
