 STATIC_MODIFIER_NAME_oe_v240_ea_srb_sabzevar_march:0 "萨尔巴达尔·进军萨卜泽瓦尔"
 STATIC_MODIFIER_DESC_oe_v240_ea_srb_sabzevar_march:0 "巴什廷起义军高呼「宁挂绞架、不屈暴敛」，在呼罗珊群山间星夜兼程，以昂扬斗志猛攻萨卜泽瓦尔。"
 STATIC_MODIFIER_NAME_oe_v240_ea_srb_dervish_commune:0 "萨尔巴达尔·苦行僧义社"
 STATIC_MODIFIER_DESC_oe_v240_ea_srb_dervish_commune:0 "谢赫哈里发一脉的什叶苦行僧团与呼罗珊农工结成共守盟社，令山城堡垒固若金汤、民心归附。"
 STATIC_MODIFIER_NAME_oe_v240_ea_inj_fars_campaign:0 "英朱王朝·法尔斯争锋"
 STATIC_MODIFIER_DESC_oe_v240_ea_inj_fars_campaign:0 "设拉子王廷厉兵秣马，誓与亚兹德及克尔曼的穆扎法尔人争夺伊朗南部丝路重镇与伊儿汗旧都遗产。"
 STATIC_MODIFIER_NAME_oe_v240_ea_inj_shiraz_court:0 "设拉子玫瑰与诗苑宫廷"
 STATIC_MODIFIER_DESC_oe_v240_ea_inj_shiraz_court:0 "英朱王公庇护诗圣哈菲兹一辈的文人雅士并广纳波斯湾商旅，令设拉子成为后伊儿汗时代最璀璨的波斯都会。"
 STATIC_MODIFIER_NAME_oe_v240_ea_krt_herat_autonomy:0 "赫拉特卡尔特自主雄镇"
 STATIC_MODIFIER_DESC_oe_v240_ea_krt_herat_autonomy:0 "穆伊兹丁·侯赛因摆脱戈尔甘残元宗主羁绊，以赫拉特坚城为屏，在蒙古余部与萨尔巴达尔之间巍然自立。"
 STATIC_MODIFIER_NAME_oe_v240_ea_krt_silk_caravans:0 "赫拉特呼罗珊商道枢纽"
 STATIC_MODIFIER_DESC_oe_v240_ea_krt_silk_caravans:0 "卡尔特宫廷巧施权变稳住戈尔甘边患，全力整修赫拉特大巴扎与阿富汗—波斯商道，关市之利倍增。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_ayas_treaty:0 "1337年阿亚斯和约港利"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_ayas_treaty:0 "奇里乞亚亚美尼亚被迫割让杰伊汉河东岸与阿亚斯商港并岁输重币，马穆鲁克威震东地中海北岸。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_levant_peace:0 "叙利亚北疆休兵通商"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_levant_peace:0 "苏丹以宽和停战稳定安纳托利亚南麓防线，减轻阿勒颇与大马士革守军耗费并活络地中海香料转运。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_citadel_supremacy:0 "开罗城堡王权独尊"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_citadel_supremacy:0 "阿拔斯挂名哈里发被逐往高埃及库斯看管，开罗城堡苏丹政令直贯迪万官署，再无宗法掣肘。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_caliphal_sanction:0 "开罗哈里发宗法庇佑"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_caliphal_sanction:0 "礼遇阿拔斯哈里发并尊崇爱资哈尔法学家，使马穆鲁克苏丹在伊斯兰世界赢得深厚宗法威望与国内安澜。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_bahri_compact:0 "巴赫里诸埃米尔与叙利亚总督盟约"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_bahri_compact:0 "纳西尔苏丹驾崩后，开罗重臣与大马士革、阿勒颇、卡拉克诸纳伊布达成权宜分权协定，暂遏骨肉相残。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_citadel_purge:0 "巴赫里禁卫铁腕清君侧"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_citadel_purge:0 "开罗摄政集团以皇家马穆鲁克精骑雷霆清洗异己埃米尔，虽激怒叙利亚诸督却锻造出凌厉禁卫战力。"
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_karak_arbitration:0 "卡拉克金库与叙利亚勤王军"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_karak_arbitration:0 "依托外约旦卡拉克绝壁堡垒的金库与叙利亚边军介入开罗继统之争，为巴赫里王朝注入坚韧边防武力。"
 STATIC_MODIFIER_NAME_oe_v240_ea_sgn_fakhruddin_revolt:0 "法赫鲁丁·索纳尔冈自立"
 STATIC_MODIFIER_DESC_oe_v240_ea_sgn_fakhruddin_revolt:0 "法赫鲁丁·穆巴拉克沙在索纳尔冈独立铸币称苏丹，借布拉马普特拉河网水师与孟加拉义卒抗衡德里。"
 STATIC_MODIFIER_NAME_oe_v240_ea_sgn_delta_charter:0 "东孟加拉河港敕封特许"
 STATIC_MODIFIER_DESC_oe_v240_ea_sgn_delta_charter:0 "暂奉德里苏丹名义敕封以换取东孟加拉关税自治，索纳尔冈细棉布与吉大港海贸蒸蒸日上。"
 STATIC_MODIFIER_NAME_oe_v240_ea_stn_ilyas_bid:0 "伊利亚斯沙·逐鹿全孟加拉"
 STATIC_MODIFIER_DESC_oe_v240_ea_stn_ilyas_bid:0 "萨特冈新主沙姆斯丁·伊利亚斯沙摆脱图格鲁克羁绊，挥师北窥高尔与潘杜亚，誓统孟加拉三督。"
 STATIC_MODIFIER_NAME_oe_v240_ea_stn_satgaon_port:0 "萨特冈恒河口黄金商埠"
 STATIC_MODIFIER_DESC_oe_v240_ea_stn_satgaon_port:0 "优先疏浚胡格利河道、广迎波斯与南洋帆船，使萨特冈一跃成为西孟加拉财源最盛的河海巨港。"
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_shahmir_stewardship:0 "沙阿·米尔理政克什米尔"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_shahmir_stewardship:0 "斯瓦特籍干臣沙阿·米尔整肃斯利那加仓廪与山口戍堡，令饱经战乱的克什米尔谷地重归有序。"
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_kota_rani_guard:0 "科塔女王与达马拉山谷卫队"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_kota_rani_guard:0 "克什米尔女王科塔·拉妮号召本土达马拉领主齐集杰赫勒姆河谷，力挽洛哈拉旧朝于危澜。"
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_shah_mir_sultanate:0 "1339年沙阿·米尔克什米尔苏丹国"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_shah_mir_sultanate:0 "沙姆斯丁·沙阿·米尔在斯利那加建号称苏丹，以宽平轻赋与波斯—克什米尔文教融合开创谷地新纪元。"
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_lohara_restoration:0 "洛哈拉印度教山国中兴"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_lohara_restoration:0 "科塔女王在因达尔科特击退政变、保住克什米尔古礼王统，喜马拉雅群峰间的印度教堡垒益发巍峨。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_sondhar_relief:0 "图格鲁克·桑达尔农贷赈荒"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_sondhar_relief:0 "穆罕默德·本·图格鲁克在萨尔加德瓦里行营平定艾因·穆尔克兵变后，大发桑达尔农贷与掘井垦荒以救河间饥荒。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_awadh_granary:0 "阿瓦德—江普尔粮道安抚"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_awadh_granary:0 "朝廷留任艾因·穆尔克坐镇阿瓦德与江普尔，换取源源不断的恒河粮船北运河间，稳住东方伊克塔人心。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_khammar_purge:0 "马尔瓦铁腕肃清百户埃米尔"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_khammar_purge:0 "德里支持阿齐兹·哈马尔在达尔城铁血诛杀跋扈百户军官，中央王权与抄没税赋陡增而诸总督离心暗涌。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_centurion_compact:0 "马尔瓦—德干百户埃米尔敕约"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_centurion_compact:0 "苏丹及时召回酷吏阿齐兹·哈马尔并重申马尔瓦与道拉塔巴德军官采邑保障，化德干兵变巨祸于无形。"
 STATIC_MODIFIER_NAME_oe_v240_ea_stc_yoshino_resolve:0 "吉野南朝·勤王死战之志"
 STATIC_MODIFIER_DESC_oe_v240_ea_stc_yoshino_resolve:0 "金崎落城之痛激起南朝勤王武士同仇敌忾，北畠显家率奥州精锐星夜西进，誓复平安京。"
 STATIC_MODIFIER_NAME_oe_v240_ea_stc_imperial_regalia:0 "吉野深山与三神器正统"
 STATIC_MODIFIER_DESC_oe_v240_ea_stc_imperial_regalia:0 "后醍醐天皇固守吉野天险并分遣诸皇子赴镇九州、东国，以三神器正统号令天下勤王义师。"
 STATIC_MODIFIER_NAME_oe_v240_ea_jap_kemmu_shikimoku:0 "室町幕府《建武式目》文治"
 STATIC_MODIFIER_DESC_oe_v240_ea_jap_kemmu_shikimoku:0 "足利尊氏受封征夷大将军后采行《建武式目》，倚重足利直义执掌京都政所与法庭，幕政渐入正轨。"
 STATIC_MODIFIER_NAME_oe_v240_ea_jap_shugo_network:0 "室町守护大名军功体制"
 STATIC_MODIFIER_DESC_oe_v240_ea_jap_shugo_network:0 "幕府大封斯波、细川、高师直等军功豪族以各国守护之权，迅速聚拢横扫列岛的强大武家战阵。"
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_irrawaddy_claim:0 "彬牙王统·伊洛瓦底正朔"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_irrawaddy_claim:0 "彬牙王廷以蒲甘正统自居，整训象兵水师直指隔江相望的实皆别宗，志在一统上缅甸。"
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_kyaukse_canals:0 "皎施稻仓水利整修"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_kyaukse_canals:0 "彬牙集中民力疏浚皎施十一渠灌溉网并加固江岸木城，以丰沛稻谷稳固上缅甸立国之本。"
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_kyawswa_elephants:0 "五白象王觉苏瓦一世亲军"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_kyawswa_elephants:0 "「五白象之主」觉苏瓦一世继位掌权，整编精锐御林象骑并威服东吁、卑谬诸封君，彬牙国势中兴。"
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_sangha_compact:0 "上座部僧伽与诸邦安抚约"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_sangha_compact:0 "彬牙王廷广施佛塔供养并确认东吁、卑谬世袭封地，以佛法威仪与分权安抚凝聚上缅甸诸侯。"
 STATIC_MODIFIER_NAME_oe_v240_ea_sag_shan_marches:0 "实皆北境抗掸木栅防线"
 STATIC_MODIFIER_DESC_oe_v240_ea_sag_shan_marches:0 "实皆沿亲敦江与伊洛瓦底江上游密筑木栅堡垒，全力抵御自勐卯南下的掸族轻骑劫掠。"
 STATIC_MODIFIER_NAME_oe_v240_ea_sag_river_toll:0 "实皆江口关市通商"
 STATIC_MODIFIER_DESC_oe_v240_ea_sag_river_toll:0 "实皆在两江交汇处设立渡口税关并缓和与南邻摩擦，借玉石、盐巴与米粮舟楫之利充实小朝廷。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_minh_tong_regency:0 "陈明宗太上皇摄政文治"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_minh_tong_regency:0 "陈明宗以太上皇之尊坐镇升龙辅政，重用朱文安等名儒清吏治、兴科举，使大越陈朝维持盛世气象。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_tran_princes:0 "陈朝宗室亲王与清化镇军"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_tran_princes:0 "重用陈氏宗室诸王统领禁军与清化、乂安边镇，令红河三角洲兼备内卫精兵与南疆铁壁。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_champa_claim:0 "大越纳制某·南巡占城策"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_champa_claim:0 "大越接纳占城流亡王子制某并陈兵化州海陆，以正统仲裁之名向茶和布底的毗阇耶宫廷施加雷霆压力。"
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_southern_watch:0 "北部湾海防与云屯商埠"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_southern_watch:0 "暂息南征锋芒，专意修筑南疆关隘并扩建云屯海港，广收南海与岭南往来商舶之利。"
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_amda_katama:0 "阿姆达·塞永御帐行营精兵"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_amda_katama:0 "所罗门雄主阿姆达·塞永统率流动御帐大营（Katama）巡行高原，令提格雷海王与诸省领主望风效命。"
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_monastic_accord:0 "埃塞俄比亚高原修院协和"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_monastic_accord:0 "皇室慷慨布施高原修道院并与埃沃斯塔泰沃斯一脉修好，教俗协和令吉兹文典籍与朝廷民望俱兴。"
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_ifat_march:0 "伊法特前线边军与泽拉威慑"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_ifat_march:0 "沿绍阿东麓与裂谷商路常驻高原精兵，随时震慑伊法特瓦拉什马苏丹并确保红海泽拉贡赋不绝。"
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_zeila_caravans:0 "高原—泽拉盐金象牙商队"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_zeila_caravans:0 "埃塞俄比亚与伊法特商路守将订立护商之约，令高原黄金、象牙与红海岩盐织品川流不息。"
 STATIC_MODIFIER_NAME_oe_v240_ea_son_ali_kolon_revival:0 "阿里·科隆·高城桑尼复兴"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_ali_kolon_revival:0 "桑海王子阿里·科隆智逃尼亚尼质子之羁、重返高城开创桑尼王朝，尼日尔河东湾重燃独立雄心。"
 STATIC_MODIFIER_NAME_oe_v240_ea_son_niger_armory:0 "高城暗蓄兵甲与撒哈拉商利"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_niger_armory:0 "表面暂维对马里宗主贡赋以麻痹尼亚尼耳目，暗中在高城积储盐金财赋与河防兵甲、厚积薄发。"
 STATIC_MODIFIER_NAME_oe_v240_ea_son_sorko_flotilla:0 "索尔科河师与西指廷巴克图"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_sorko_flotilla:0 "善驭舟楫的索尔科水手编成常备战船队沿尼日尔河西巡，令桑海既能疾袭廷巴克图亦可畅通河运。"
 STATIC_MODIFIER_NAME_oe_v240_ea_son_gao_entrepot:0 "高城撒哈拉盐金与学者集市"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_gao_entrepot:0 "广迎塔加扎盐商与马格里布学者驻足高城清真寺与市集，将桑海古都推向西非商贸与文教前沿。"
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_tlatelolco_market:0 "特拉特洛尔科双岛商市"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_tlatelolco_market:0 "特诺奇蒂特兰承认北邻特拉特洛尔科沙洲商市地位，湖中双岛互为集散，独木舟商队云集墨西哥谷地。"
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_tenoch_order:0 "特诺奇神庙中枢统御"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_tenoch_order:0 "墨西加长老特诺奇以战神神庙与堤道法度统御湖中沙洲，令初创之城纪律严明、守御坚不可摧。"
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_tepanec_auxiliaries:0 "特帕内克附庸精锐雇佣战团"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_tepanec_auxiliaries:0 "墨西加战士甘为阿兹卡波特萨尔科充当前锋苦战诸敌，在连年血战中淬炼出冠绝谷地的精锐武风。"
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_lake_autonomy:0 "特斯科科湖浮园蓄力自保"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_lake_autonomy:0 "截留部分浮园农产并暗结特斯科科阿科尔瓦贵族，在阿兹卡波特萨尔科监视下悄然涵养自立根基。"
 STATIC_MODIFIER_NAME_oe_v240_ea_chm_nancenpinco_conquest:0 "南森平科·奇穆沿海拓土"
 STATIC_MODIFIER_DESC_oe_v240_ea_chm_nancenpinco_conquest:0 "昌昌大王南森平科挥师南北扫荡秘鲁沙漠绿洲诸谷，将西坎与卡斯马沃土陆续纳入奇穆王冠版图。"
 STATIC_MODIFIER_NAME_oe_v240_ea_chm_chan_chan_canals:0 "昌昌莫切谷地大灌渠与金工"
 STATIC_MODIFIER_DESC_oe_v240_ea_chm_chan_chan_canals:0 "扩建莫切谷地巨型引水渠与昌昌土坯宫城金银作坊，以高度集中的绿洲水利与奢华工艺富甲安第斯海岸。"
 STATIC_MODIFIER_NAME_oe_v240_ea_coc_mercenary_guard:0 "科科姆·塔巴斯科雇佣卫队"
 STATIC_MODIFIER_DESC_oe_v240_ea_coc_mercenary_guard:0 "玛雅潘科科姆大君招募来自墨西哥湾沿岸的外邦武士拱卫城垣，以强力武备威慑休氏与诸城邦。"
 STATIC_MODIFIER_NAME_oe_v240_ea_coc_multepal_council:0 "玛雅潘诸邦共议（穆尔特帕尔）"
 STATIC_MODIFIER_DESC_oe_v240_ea_coc_multepal_council:0 "科科姆大君重申玛雅潘共议旧制，与马尼休氏及诸海滨城主共分可可、海盐商利，暂弭同盟内讧。"
 STATIC_MODIFIER_NAME_oe_v240_ea_xiu_uxmal_revival:0 "图图尔·休·乌斯马尔复兴同盟"
 STATIC_MODIFIER_DESC_oe_v240_ea_xiu_uxmal_revival:0 "马尼的休氏领主高举乌斯马尔古统旗号，密联尤卡坦西部诸城主蓄势抗衡玛雅潘科科姆暴政。"
 STATIC_MODIFIER_NAME_oe_v240_ea_xiu_mani_prosperity:0 "马尼可可林与盐田富庶"
 STATIC_MODIFIER_DESC_oe_v240_ea_xiu_mani_prosperity:0 "图图尔·休氏暂隐锋芒、深耕马尼果园与普克丘陵商路，静待玛雅潘同盟生变之机。"
 oe_v240_ea.1.t:0 "巴什廷义旗：进军萨卜泽瓦尔"
 oe_v240_ea.1.d:0 "1337年春，巴什廷村民怒杀横征暴敛的伊儿汗税吏，阿卜杜勒·拉扎克高举「宁挂绞架（萨尔巴达尔）、不屈暴政」大旗起事。眼下脱合帖木儿西征受挫，呼罗珊重镇萨卜泽瓦尔防务空虚。义军究竟趁势直扑萨卜泽瓦尔、开辟萨尔巴达尔公社基业，还是先倚重谢赫哈里发一脉苦行僧团整固巴什廷山城防务？"
 oe_v240_ea.1.a:0 "猛攻萨卜泽瓦尔，开创呼罗珊萨尔巴达尔公社"
 oe_v240_ea.1.b:0 "结盟谢赫哈里发苦行僧团，固守巴什廷与乡里公社"
 oe_v240_ea.2.t:0 "法尔斯与亚兹德：英朱—穆扎法尔之争"
 oe_v240_ea.2.d:0 "伊儿汗大统崩解之际，伊朗南部的设拉子与亚兹德陷入你死我活的霸权角逐。亚兹德的穆扎法尔枭雄穆巴里兹丁·穆罕默德已染指克尔曼，正虎视法尔斯沃土；与此同时，设拉子城内诗酒风流、商旅云集。英朱王朝究竟挥师东进先发制人争夺亚兹德，还是厚植设拉子宫廷文治商利、以繁华软实力号召波斯人心？"
 oe_v240_ea.2.a:0 "兴师问罪亚兹德，与穆扎法尔人决雌雄于伊朗南部"
 oe_v240_ea.2.b:0 "礼遇设拉子诗家学者，大兴法尔斯商埠与宫廷繁华"
 oe_v240_ea.3.t:0 "戈尔甘与萨卜泽瓦尔之间：赫拉特卡尔特自主"
 oe_v240_ea.3.d:0 "赫拉特王公穆伊兹丁·侯赛因登城西望，只见呼罗珊战火纷飞：戈尔甘的蒙古宗主脱合帖木儿西征折戟、威势大衰，萨尔巴达尔义军又在萨卜泽瓦尔与内沙布尔步步紧逼。卡尔特众将力主趁此良机摆脱戈尔甘附庸之名、在赫拉特自立为呼罗珊霸主；商帮长老则劝王公暂维名义朝贡、坐收中亚丝路商利。"
 oe_v240_ea.3.a:0 "摆脱脱合帖木儿宗主羁绊，以赫拉特雄镇自立呼罗珊"
 oe_v240_ea.3.b:0 "暂奉戈尔甘名义宗主，专力繁盛赫拉特巴扎与陆路丝商"
 oe_v240_ea.4.t:0 "1337年阿亚斯和约：奇里乞亚北疆定鼎"
 oe_v240_ea.4.d:0 "阿勒颇与大马士革马穆鲁克铁骑连年越过托罗斯山口痛击奇里乞亚，亚美尼亚国王莱翁四世遣使赴开罗乞和，愿割让杰伊汉河东岸与地中海重港阿亚斯并岁纳巨额赔款。强硬落实阿亚斯港权与贡约，既可充盈国库又能振奋阿勒颇总督军心；若施宽和停战，则可省却叙利亚北疆长期戍边之耗。"
 oe_v240_ea.4.a:0 "强硬落实阿亚斯商港与赔款条约，震慑奇里乞亚北境"
 oe_v240_ea.4.b:0 "缔结宽和停战协定，裁减叙利亚边防耗费并活络海贸"
 oe_v240_ea.5.t:0 "库斯流放：开罗阿拔斯哈里发风波"
 oe_v240_ea.5.d:0 "开罗城堡内突生宫闱嫌隙，苏丹纳西尔·穆罕默德怒责阿拔斯挂名哈里发穆斯塔克菲一世暗涉蜚语，下令将哈里发阖家百口押解南迁至上埃及重镇库斯严加软禁。坚持流放库斯可令苏丹政令独尊、绝无宗法牵制；若改行怀柔迎回开罗礼遇，则能安抚爱资哈尔法学家并扬大义于四方。"
 oe_v240_ea.5.a:0 "严囚阿拔斯宗室于上埃及库斯，确立开罗城堡绝对权威"
 oe_v240_ea.5.b:0 "迎回阿拔斯哈里发重返开罗，隆礼优恤以抚清流法学家"
 oe_v240_ea.6.t:0 "纳西尔驾崩后：巴赫里诸子争位与叙利亚诸督"
 oe_v240_ea.6.d:0 "1341年夏，威加四海的苏丹纳西尔·穆罕默德步入暮年并撒手人寰，身后八子并立，高孙、巴什塔克等开罗大埃米尔旋即围绕废立展开激烈倾轧；大马士革、阿勒颇与卡拉克三大叙利亚总督区亦按剑观望，随时准备问鼎开罗。朝廷究竟散财安抚三督以维脆弱共治，借禁卫铁腕清洗异己，还是倚重卡拉克绝壁金库与叙利亚勤王军定夺大位？"
 oe_v240_ea.6.a:0 "散财斡旋开罗诸埃米尔与大马士革、阿勒颇、卡拉克三督共治"
 oe_v240_ea.6.b:0 "纵开罗城堡禁卫雷霆清君侧，震慑骄横埃米尔与外镇"
 oe_v240_ea.6.c:0 "倚重卡拉克金库与大马士革边军进京裁决巴赫里大统"
 oe_v240_ea.7.t:0 "法赫鲁丁自立：索纳尔冈首举孟加拉独立之旗"
 oe_v240_ea.7.d:0 "1338年德里驻东孟加拉总督巴赫拉姆汗病逝，其司甲官法赫鲁丁果断夺取索纳尔冈，自立为苏丹法赫鲁丁·穆巴拉克沙并铸行独立银币！此时德里苏丹正为河间饥荒焦头烂额，高尔与萨特冈两督亦各怀鬼胎。索纳尔冈究竟毅然斩断德里宗主羁绊、开创独立东孟加拉苏丹国，还是向德里请封以换取恒河三角洲商贸自治？"
 oe_v240_ea.7.a:0 "独立铸币称苏丹，彻底斩断德里图格鲁克宗主羁绊"
 oe_v240_ea.7.b:0 "遣使向德里请领世袭敕封，保全东孟加拉商埠安宁"
 oe_v240_ea.8.t:0 "伊利亚斯沙崛起：萨特冈、高尔与孟加拉三督争雄"
 oe_v240_ea.8.d:0 "1338年萨特冈总督伊兹丁·叶海亚辞世后，其义弟哈吉·伊利亚斯迅速掌权并称沙姆斯丁·伊利亚斯沙；几乎同时，高尔将领阿拉丁·阿里沙推翻卡达尔汗、迁庭潘杜亚，与东面的法赫鲁丁形成孟加拉三督鼎立混战之局！伊利亚斯沙究竟趁势摆脱德里、挥师北指高尔争夺全孟加拉霸权，还是先深耕萨特冈河口商港、以商富兵？"
 oe_v240_ea.8.a:0 "摆脱德里羁绊，北窥高尔与潘杜亚以图一统孟加拉"
 oe_v240_ea.8.b:0 "扩建萨特冈胡格利河港，先揽西孟加拉海贸厚利"
 oe_v240_ea.9.t:0 "洛哈拉暮影：科塔女王与克什米尔权臣沙阿·米尔"
 oe_v240_ea.9.d:0 "历经蒙古残破之后，克什米尔国王乌陀耶那提婆于1338年驾崩，喜马拉雅山谷陷入权力真空。聪慧的科塔女王坐镇斯利那加王宫，然而来自斯瓦特的干臣沙阿·米尔早已掌握谷地税政与诸山口重兵。若委任沙阿·米尔总摄谷地仓廪边防，克什米尔将迅速复原却也令其羽翼丰满；若改集本土达马拉领主拱卫女王，则须直面即将爆发的宫廷摊牌。"
 oe_v240_ea.9.a:0 "委任权臣沙阿·米尔整肃斯利那加仓廪与山口戍堡"
 oe_v240_ea.9.b:0 "号召达马拉山谷领主拱卫科塔女王与洛哈拉旧统"
 oe_v240_ea.10.t:0 "1339年沙阿·米尔政变：克什米尔苏丹国肇兴"
 oe_v240_ea.10.d:0 "1339年秋，斯利那加朝堂暗流终于在因达尔科特堡垒彻底爆发。手握重兵且深得谷地乡绅支持的沙阿·米尔兵临城下，誓以「沙姆斯丁苏丹」之号建立克什米尔首个伊斯兰苏丹国，承诺轻徭薄赋、融合波斯与谷地文教。此刻唯有科塔女王的死忠领主背水一战，方能保住延续数百载的克什米尔印度教王统。"
 oe_v240_ea.10.a:0 "拥立沙姆斯丁·沙阿·米尔即位，建立克什米尔苏丹国"
 oe_v240_ea.10.b:0 "死守因达尔科特击退政变，中兴洛哈拉印度教山国"
 oe_v240_ea.11.t:0 "河间大饥荒与艾因·穆尔克阿瓦德兵变"
 oe_v240_ea.11.d:0 "恒河—亚穆纳河间连年大旱兼之重税，迫使图格鲁克朝廷驻跸萨尔加德瓦里赈荒行营，全赖阿瓦德—江普尔总督艾因·穆尔克源源不断运粮接济。然而一纸调令欲将其南调德干，顿引发阿瓦德诸将惊惧并在卡瑙季渡河举兵哗变！德里苏丹究竟铁骑平叛并拨发桑达尔农贷重振河间，还是收回成命留任艾因·穆尔克以保东方粮道与诸伊克塔归心？"
 oe_v240_ea.11.a:0 "挥师平定阿瓦德兵变，大发桑达尔农贷赈济河间饥民"
 oe_v240_ea.11.b:0 "收回调令留任艾因·穆尔克坐镇江普尔，换取恒河粮船不绝"
 oe_v240_ea.12.t:0 "阿齐兹·哈马尔达尔城之变：马尔瓦与德干百户危机"
 oe_v240_ea.12.d:0 "为打破中印骄将尾大不掉之势，德里朝廷于1344年派遣出身寒微的酷吏阿齐兹·哈马尔出督马尔瓦达尔城，孰料其竟于宴席间一举诱杀八十九名百户埃米尔（Amiran-i-Sada）！血讯瞬间震动马尔瓦、道拉塔巴德与江普尔诸镇，各地驻军人人自危、剑拔弩张。苏丹究竟嘉奖哈马尔铁血集权，还是速召酷吏回京、颁敕安抚诸伊克塔军官？"
 oe_v240_ea.12.a:0 "嘉奖阿齐兹·哈马尔铁血肃清，抄没百户采邑充实中枢"
 oe_v240_ea.12.b:0 "速召阿齐兹·哈马尔罢职，颁敕保障马尔瓦与德干诸督采邑"
 oe_v240_ea.13.t:0 "金崎落城与吉野南朝誓师"
 oe_v240_ea.13.d:0 "噩耗穿过吉野山岚直抵行宫：越前敦贺湾畔的金崎城历经酷寒断粮后终为足利军攻破，新田义贞虽突围而走，恒良、尊良二位亲王却壮烈殉难。然握有三神器的后醍醐天皇誓不屈服于京都北朝！吉野南朝究竟急召北畠显家率奥州勤王大军西上反攻，还是深筑吉野山城并分遣诸皇子镇守九州、东国以图持久抗战？"
 oe_v240_ea.13.a:0 "急诏北畠显家率勤王精锐西进，誓雪金崎之耻、反攻京都"
 oe_v240_ea.13.b:0 "固守吉野深山三神器正统，分遣诸皇子赴镇诸道持久图存"
 oe_v240_ea.14.t:0 "1338年征夷大将军宣下：室町幕府开创"
 oe_v240_ea.14.d:0 "继攻克金崎城并于石津击破北畠显家奥州大军后，1338年八月，京都北朝光明天皇正式宣下册封足利尊氏为征夷大将军，全新的武家政权——室町幕府自此立于平安京！尊氏面临立国大计：究竟奉行《建武式目》、倚重胞弟足利直义整顿京都政务与裁判秩序，还是广授斯波、细川、高师直等战将各国守护重权以速定天下？"
 oe_v240_ea.14.a:0 "奉行《建武式目》并委任足利直义整饬京都政所与法度"
 oe_v240_ea.14.b:0 "大封军功武家以诸国守护重权，迅速凝聚横扫列岛之势"
 oe_v240_ea.15.t:0 "伊洛瓦底江双王：彬牙与实皆骨肉争锋"
 oe_v240_ea.15.d:0 "宽阔的伊洛瓦底江两岸，同出敏象三兄弟血脉的彬牙与实皆两大王国隔水对峙，彼此皆以蒲甘古朝正统自居。彬牙王廷重臣激辩：究竟趁北境掸族尚未大举南下之际，先挥师渡江问鼎实皆、重统上缅甸，还是优先疏浚皎施稻仓古渠、厚积米粮兵力以待天时？"
 oe_v240_ea.15.a:0 "宣示彬牙蒲甘正统，整备象兵水师直指对岸实皆"
 oe_v240_ea.15.b:0 "疏浚皎施稻仓水利古渠，加固彬牙江防与民生根基"
 oe_v240_ea.16.t:0 "觉苏瓦一世登极：五白象之主重振彬牙"
 oe_v240_ea.16.d:0 "1340年秋，彬牙国王乌扎那让位于骁勇善战的异母弟觉苏瓦一世——人称「五白象之主（Nga-Si-Shin）」，并于1344年彻底掌权亲政。新王气象一振，彬牙究竟借此契机大练御林白象精锐威慑东吁、卑谬与北邻实皆，还是尊崇上座部僧伽、重申诸封君世袭敕令以凝聚上缅甸众心？"
 oe_v240_ea.16.a:0 "整训觉苏瓦一世御林五白象军，以铁血军威震慑诸邦"
 oe_v240_ea.16.b:0 "广施佛寺僧伽并安抚东吁、卑谬诸封君，缔造国内清平"
 oe_v240_ea.17.t:0 "实皆危局：宫廷纷争与北境掸族骑掠"
 oe_v240_ea.17.d:0 "进入1340年代初，地狭人稀的实皆王国陷入南北夹击：南岸彬牙王朝虎视眈眈，东北山谷间更有勐卯掸族轻骑沿亲敦江与伊洛瓦底江频频南下袭掠，而实皆宫廷内部亦因王位更迭动荡不已。实皆究竟倾力在北境隘口密筑木栅防线抗击掸骑，还是借两江渡口关市税银与审慎外交周旋图存？"
 oe_v240_ea.17.a:0 "沿亲敦江上游密筑木栅堡垒，誓死抵御北境掸族骑掠"
 oe_v240_ea.17.b:0 "设立两江渡口关市广聚税银，审慎外交以避双线受敌"
 oe_v240_ea.18.t:0 "太上皇摄政：陈明宗坐镇升龙辅政大越"
 oe_v240_ea.18.d:0 "承袭大越陈朝独有的「太上皇」共治旧制，太上皇陈明宗退居升龙后殿仍总揽军国大政，辅佐年少嗣君并重用名儒朱文安清肃朝纲。然清化、乂安山地边患时起，陈氏宗室诸王亦请扩大兵权以固南疆。大越究竟笃守陈明宗重儒兴学、清吏治之策，还是重用宗室亲王整饬清化边防大军？"
 oe_v240_ea.18.a:0 "笃行陈明宗太上皇文治，重用朱文安清吏治、兴科举"
 oe_v240_ea.18.b:0 "委任陈氏宗室诸王统领禁军与清化边镇，强军卫国"
 oe_v240_ea.19.t:0 "1342年占城继统之变：王子制某北奔求援"
 oe_v240_ea.19.d:0 "1342年占城老王制阿难去世，其婿茶和布底在毗阇耶篡夺王位，废黜正统嗣子制某；王子制某被迫逃往升龙，泣血恳请大越陈朝出兵匡扶。接纳制某并陈兵问罪占城，可借兴灭继绝之名压迫南邻朝贡；若按兵不动、专意经营南疆关防与云屯海港，则可安享北部湾商舶之利。"
 oe_v240_ea.19.a:0 "接纳占城王子制某，整备水陆大军向毗阇耶施压问罪"
 oe_v240_ea.19.b:0 "谨守南疆关隘、不轻动干戈，专力兴盛云屯海贸与海防"
 oe_v240_ea.20.t:0 "阿姆达·塞永晚年：所罗门御帐行营与修院之争"
 oe_v240_ea.20.d:0 "凭1332年东征大捷威震非洲之角的雄主阿姆达·塞永一世步入晚年，仍以庞大流动御帐行营（Katama）巡行高原，令提格雷海王与诸部领主莫敢不从。然以阿巴·埃沃斯塔泰沃斯为首的苦行修士竟公开斥责皇室婚俗，朝野教俗张力骤升。皇帝究竟彰显所罗门铁血王权、以行营精兵震慑天下，还是厚赐高原修院以弭教争？"
 oe_v240_ea.20.a:0 "彰显所罗门至高皇权，扩编御帐行营精兵并督率提格雷海王"
 oe_v240_ea.20.b:0 "慷慨布施高原修道院，与埃沃斯塔泰沃斯修院派握手言和"
 oe_v240_ea.21.t:0 "伊法特前线：泽拉贡赋与红海商道门户"
 oe_v240_ea.21.d:0 "虽在1332年败于埃塞俄比亚并俯首纳贡，瓦拉什马王朝治下的伊法特苏丹国仍牢牢扼守自绍阿高原通往哈勒尔与红海重港泽拉的贸易咽喉。阿姆达·塞永垂暮之际，低地埃米尔屡屡试探边防虚实。帝国究竟增兵东麓裂谷隘口、随时挥师直逼泽拉，还是与商路守将订立护商通市之约，坐享红海盐金象牙厚利？"
 oe_v240_ea.21.a:0 "重兵戍守绍阿—伊法特边疆，以武威压迫泽拉永保贡赋"
 oe_v240_ea.21.b:0 "特许高原—泽拉商队平安往来，广收红海盐金与象牙关税"
 oe_v240_ea.22.t:0 "智逃尼亚尼：阿里·科隆重返高城复兴桑海"
 oe_v240_ea.22.d:0 "《苏丹史》传诵至今：身为马里尼亚尼王廷质子的桑海王子阿里·科隆与弟苏莱曼·纳尔隐忍经年，暗沿东归大路埋藏兵甲粮秣；趁曼萨·穆萨盛世落幕、马里宫廷继统生变之机，二人星夜疾驰重返高城，树起桑尼王朝复兴大旗！桑海究竟即刻斩断马里宗主羁绊、宣告高城独立，还是暂以虚与委蛇之贡麻痹尼亚尼、暗中积蓄兵财？"
 oe_v240_ea.22.a:0 "毅然斩断马里宗主枷锁，宣告高城桑尼王朝独立复兴"
 oe_v240_ea.22.b:0 "暂维表面朝贡麻痹尼亚尼，暗在高城广蓄盐金与河防兵甲"
 oe_v240_ea.23.t:0 "执掌尼日尔河湾：高城索尔科水师与盐金商路"
 oe_v240_ea.23.d:0 "桑尼王朝在高城稳住脚跟之际，马里西方正陷入曼萨·马甘与苏莱曼的王室倾轧，整个尼日尔河东湾大势尽归高城视野。善驭急流的索尔科渔民愿编组战船水师溯流西指廷巴克图，而大批塔加扎盐商与马格里布学者亦慕名齐聚高城河畔集市。桑海究竟以水师锐气图谋西进，还是先将高城筑为萨赫勒第一商学巨埠？"
 oe_v240_ea.23.a:0 "编练索尔科战船水师，沿尼日尔河溯流威慑廷巴克图"
 oe_v240_ea.23.b:0 "广迎撒哈拉盐商与学者入驻高城，铸就西非商学重镇"
 oe_v240_ea.24.t:0 "1337年特拉特洛尔科分立：特斯科科湖上的双子沙洲"
 oe_v240_ea.24.d:0 "距墨西加人在特斯科科湖畔建立特诺奇蒂特兰仅十二载，1337年一支不甘久居其下的墨西加分支移居北侧沙洲，开辟新邑特拉特洛尔科并大兴独木舟码头与大集市。长老特诺奇与神庙议事会权衡应对：是特许北岛商市共荣、借双子岛之势广揽墨西哥谷地百货，还是重申战神神庙中枢威严、防止初创之城人心离散？"
 oe_v240_ea.24.a:0 "特许特拉特洛尔科北岛商市共荣，广聚湖上独木舟百货"
 oe_v240_ea.24.b:0 "严申特诺奇神庙中枢法度，统合湖中双岛以防外侮"
 oe_v240_ea.25.t:0 "阿兹卡波特萨尔科贡赋：特帕内克霸主麾下的墨西加"
 oe_v240_ea.25.d:0 "初立于沼泽沙洲之上的特诺奇蒂特兰尚为西岸强邦阿兹卡波特萨尔科的附庸，特帕内克税使不仅索要湖鱼、芦席与浮园收成，更征调剽悍的墨西加武士充当其称霸谷地的战争先锋。甘为霸主前锋苦战既可赢得宗主欢心、淬炼出无双战艺，亦可另辟蹊径——暗留浮园余粮并结交东岸特斯科科贵族以徐图自立。"
 oe_v240_ea.25.a:0 "忠勤效命阿兹卡波特萨尔科，在连年征战中淬炼墨西加精兵"
 oe_v240_ea.25.b:0 "截留浮园余粮蓄积财力，暗结东岸特斯科科阿科尔瓦贵族"
 oe_v240_ea.26.t:0 "南森平科雄图：自昌昌席卷秘鲁沙漠海岸"
 oe_v240_ea.26.d:0 "屹立在莫切河谷的昌昌巨型土坯宫城内，雄主南森平科北望帕卡特纳穆诸绿洲、南瞰瓦卡坦博与卡斯马谷地，志在将整个秘鲁北海岸串联为奇穆大帝国。奇穆究竟立即挥师南北扫荡沿海绿洲邦国，还是先倾力扩建莫切谷地大灌渠与昌昌金银工坊、厚植国本？"
 oe_v240_ea.26.a:0 "南北并进扫荡秘鲁沙漠绿洲，大拓昌昌奇穆王冠疆土"
 oe_v240_ea.26.b:0 "扩建莫切谷地引水大渠与昌昌金银作坊，富甲安第斯海滨"
 oe_v240_ea.27.t:0 "玛雅潘同盟暗涌：科科姆霸权与外邦雇佣卫队"
 oe_v240_ea.27.d:0 "石垣环绕的玛雅潘城内，掌权尤卡坦的科科姆王朝迫令诸邦贵族——尤以马尼的图图尔·休氏为首——留驻王庭为质。眼见诸城邦领主怨声渐起，科科姆大君面临抉择：是重金招募来自墨西哥湾塔巴斯科的外邦雇佣武士弹压异议、确立绝对霸权，还是重申古老的穆尔特帕尔诸邦共议旧制以安抚休氏人心？"
 oe_v240_ea.27.a:0 "重金雇佣塔巴斯科外邦武士拱卫玛雅潘，强压马尼休氏"
 oe_v240_ea.27.b:0 "重申玛雅潘穆尔特帕尔共议旧制，与休氏诸邦共分商利"
 oe_v240_ea.28.t:0 "马尼休氏暗流：抗衡玛雅潘科科姆霸权"
 oe_v240_ea.28.d:0 "承袭乌斯马尔古都荣光的马尼图图尔·休氏，深恨玛雅潘科科姆王朝骄横跋扈及外邦雇佣兵横行。尤卡坦西部诸城邦密使星夜潜入马尼，力劝阿苏托克·图图尔·休纠合西部诸侯剑指玛雅潘；老成祭司则劝其暂隐锋芒、深耕马尼可可林与盐田，静候科科姆自取灭亡之机。"
 oe_v240_ea.28.a:0 "密联尤卡坦西部诸城主，高举乌斯马尔古旗剑指玛雅潘"
 oe_v240_ea.28.b:0 "深耕马尼可可园与海盐商路，韬光养晦以待同盟生变"
