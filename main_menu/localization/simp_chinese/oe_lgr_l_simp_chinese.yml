 oe_lgr.14.a: "收容出走的显贵和教士"
 oe_lgr.14.a.tt: "花费#R 1#!个月的贸易与税收收入\n[oe_tu_patriarchate|e]#G +2#!"
 oe_lgr.14.b: "与[SCOPE.sCountry('oe_lgr_arta_c').GetName]通好"
 oe_lgr.14.b.tt: "[SCOPE.sCountry('oe_lgr_arta_c').GetName]对帝国好感#G +15#!，持续#Y 10#!年\n帝国与托科家的交情更深一层"
 oe_lgr.14.c: "按兵不动"
 oe_lgr.14.c.tt: "帝国不作表示"
 oe_lgr.4.t: "被俘的代理人"
 oe_lgr.4.desc_0: "#F 1386年起，纳瓦拉兵团由佩德罗·德·圣苏佩拉诺统领；次年兵团与威尼斯立了约，教皇又任命佩德罗为亚该亚的总代理。1394年末或1395年初，苏丹的边将带着骑兵进了摩里亚，与兵团合兵，夺取了阿科瓦。#!\n\n如今突厥人已经退走，摩里亚的希腊人趁势击败了兵团，俘获了佩德罗和阿尔卡迪亚的领主琴图廖内，[GetCountry('ACH').GetName]一时没了主事的人。威尼斯派人来说，愿出五万海佩伦把佩德罗赎回去。"
 oe_lgr.4.a: "收下威尼斯的赎金，放人"
 oe_lgr.4.a.tt: "获得#G 2#!个月的贸易与税收收入\n威尼斯对帝国好感#G +10#!，持续#Y 5#!年"
 oe_lgr.4.b: "以人换地：要亚该亚让出一处边地"
 oe_lgr.4.b.tt: "亚该亚一处与帝国接壤的地点（不是其首都）归帝国\n亚该亚对帝国好感#R −25#!，持续#Y 10#!年\n威尼斯对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lgr.4.c: "无偿放人，与亚该亚约为同好"
 oe_lgr.4.c.tt: "亚该亚对帝国好感#G +30#!，持续#Y 20#!年\n两国的交情只体现为好感，不结成真正的同盟"
 oe_lgr.20.t: "底比斯的归顺"
 oe_lgr.20.desc_0dv: "#F 1402年，内里奥的私生子安东尼奥夺回了雅典的下城，次年卫城也投降了；1405年安东尼奥与威尼斯议和，阿恰约利家从此在雅典坐稳。1430年，摩里亚的专制公们收取了亚该亚的腹地；不久，最后一位亚该亚亲王琴图廖内去世。#!\n\n如今，苏丹的大军都在北边，地峡以北空虚。帝国已经应允助战十字军，与苏丹的和约名存实亡。专制公请命：趁此出兵中希腊，取回底比斯，逼[SCOPE.sCountry('oe_lgr_ath20').GetName]低头。"
