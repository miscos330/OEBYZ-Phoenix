 oe_lgr.2.a: "结亲，并收下岳父借出的款子"
 oe_lgr.2.a.tt: "获得#G 2#!个月的贸易与税收收入\n[SCOPE.sCountry('oe_lgr_ath').GetName]对帝国好感#G +30#!，持续#Y 20#!年\n亚该亚对帝国好感#R −10#!，持续#Y 5#!年\n内里奥许诺身后把科林斯留给长女：日后买下科林斯只需#Y 3#!个月的收入，而不是#Y 5#!个月\n联姻只体现为好感和继承许诺，游戏里不会真的缔结婚姻"
 oe_lgr.2.b: "只结盟，不结亲"
 oe_lgr.2.b.tt: "[SCOPE.sCountry('oe_lgr_ath').GetName]对帝国好感#G +15#!，持续#Y 10#!年"
 oe_lgr.2.c: "婉拒：此人是拉丁人，又是亚该亚的封臣"
 oe_lgr.2.c.tt: "[SCOPE.sCountry('oe_lgr_ath').GetName]对帝国好感#R −10#!，持续#Y 5#!年\n亚该亚对帝国好感#G +10#!，持续#Y 5#!年"
 oe_lgr.3.t: "内里奥的遗嘱"
 oe_lgr.3.desc_3nk: "#F 1394年初，那不勒斯国王封内里奥·阿恰约利为雅典公爵；这一年，内里奥也答应向苏丹纳贡。9月17日，内里奥在科林斯立下遗嘱：雅典城捐给卫城上的圣母教堂，底比斯留给私生子，其余归小女儿，也就是凯法洛尼亚伯爵的夫人；嫁到摩里亚的长女，只得到免去丈夫所欠的那笔钱。八天后内里奥去世。专制公当年秋天就去攻科林斯，没有攻下；一两年后，伯爵自认守不住，把城卖给了专制公。#!\n\n如今，年迈的内里奥立下了遗嘱，内容传到了摩里亚。科林斯留给了小女儿和凯法洛尼亚伯爵；嫁到摩里亚的长女，只得到一句“所欠的款子一笔勾销”。当年的许诺落了空。眼下科林斯在[SCOPE.sCountry('oe_lgr_cor').GetName]手里。摩里亚的官员们说，地峡上的这座城未必有人守得住，也许花钱就能买下。"
