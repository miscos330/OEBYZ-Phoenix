 oe_lgr.3.a: "出钱买下科林斯"
 oe_lgr.3.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_lgr_cor_months')|0]#!个月的贸易与税收收入（内里奥许诺过科林斯时#Y 3#!个月，否则#Y 5#!个月）\n科林斯归帝国所有\n[SCOPE.sCountry('oe_lgr_cor').GetName]对帝国好感#G +10#!，持续#Y 5#!年"
 oe_lgr.3.b: "发兵去争"
 oe_lgr.3.b.tt: "获得对[SCOPE.sCountry('oe_lgr_cor').GetName]的宣战理由，持续#Y 5#!年\n[SCOPE.sCountry('oe_lgr_cor').GetName]对帝国好感#R −30#!，持续#Y 10#!年"
 oe_lgr.3.c: "认下遗嘱"
 oe_lgr.3.c.tt: "[SCOPE.sCountry('oe_lgr_cor').GetName]对帝国好感#G +15#!，持续#Y 10#!年"
 oe_lgr.11.t: "女婿西归"
 oe_lgr.11.desc_0: "#F 尼基福罗斯二世生在阿尔塔，父亲是伊庇鲁斯的最后一位专制公。1340年伊庇鲁斯的起事平定后，尼基福罗斯交出了最后几座城堡，娶了后来的皇帝约翰六世的女儿玛丽亚。1347年约翰六世登基，授女婿专制公之号；1351年起，尼基福罗斯替岳父镇守艾诺斯和赫勒斯滂沿岸诸城。1355年12月，塞尔维亚的斯特凡·杜尚去世；据说替塞尔维亚镇守色萨利的将领普雷柳布也在前后死去。#!\n\n如今，尼基福罗斯听说杜尚已死，阿尔塔落在[SCOPE.sCountry('oe_lgr_arta_lord').GetName]手里，前来请求皇帝放行：愿带着亲随西去，收复父亲的旧土。"
 oe_lgr.11.a: "放尼基福罗斯西去"
 oe_lgr.11.a.tt: "尼基福罗斯西去：伊庇鲁斯在阿尔塔一带复国，由此人统治（[SCOPE.sCountry('oe_lgr_arta_lord').GetName]在当地的土地交给伊庇鲁斯）\n伊庇鲁斯对帝国好感#G +25#!，持续#Y 10#!年"
 oe_lgr.11.b: "出钱出人，助其复国"
 oe_lgr.11.b.tt: "花费#R 2#!个月的贸易与税收收入\n尼基福罗斯西去：伊庇鲁斯在阿尔塔一带复国，由此人统治（[SCOPE.sCountry('oe_lgr_arta_lord').GetName]在当地的土地交给伊庇鲁斯）\n复国后的伊庇鲁斯成为帝国的罗马附属国\n伊庇鲁斯对帝国好感#G +25#!，持续#Y 10#!年\n此人日后战死沙场的可能从#Y 70%#!降到#G 50%#!"
 oe_lgr.11.c: "留此人镇守艾诺斯"
 oe_lgr.11.c.tt: "尼基福罗斯留在帝国；伊庇鲁斯不会由此人复国"
 oe_lgr.12.t: "色萨利的凯撒"
 oe_lgr.12.desc_c: "#F 1359年起，杜尚的兄弟西缅·乌罗斯以“塞尔维亚人和希腊人的皇帝”自居，驻在特里卡拉，统治色萨利。1370年西缅去世，儿子约翰·乌罗斯继位；两三年后约翰出家为僧，凯撒阿莱克修斯·安格洛斯·菲兰斯罗佩诺斯接掌了色萨利。约1382年起，这位凯撒承认在塞萨洛尼基理政的皇子为自己的宗主。#!\n\n如今，[SCOPE.sCountry('oe_lgr_ths_c').GetName]的统治者[SCOPE.sCharacter('oe_lgr_ths_r').GetFirstNameWithNoTooltip]派使者到塞萨洛尼基，求见那里的皇子：愿奉帝国为宗主，请皇帝授予凯撒之号。"
 oe_lgr.12.desc_x: "#F 1359年起，杜尚的兄弟西缅·乌罗斯以“塞尔维亚人和希腊人的皇帝”自居，驻在特里卡拉，统治色萨利。1370年西缅去世，儿子约翰·乌罗斯继位；两三年后约翰出家为僧，凯撒阿莱克修斯·安格洛斯·菲兰斯罗佩诺斯接掌了色萨利。约1382年起，这位凯撒承认在塞萨洛尼基理政的皇子为自己的宗主。#!\n\n如今，[SCOPE.sCountry('oe_lgr_ths_c').GetName]的统治者[SCOPE.sCharacter('oe_lgr_ths_r').GetFirstNameWithNoTooltip]派使者来到京城：愿奉帝国为宗主，请皇帝授予凯撒之号。"
 oe_lgr.12.a: "受其归附，授以凯撒之号"
 oe_lgr.12.a.tt: "按帝国[oe_tu_dignity|e]制度的规则授予[SCOPE.sCharacter('oe_lgr_ths_r').GetFirstNameWithNoTooltip]凯撒之号（花费与授予尊号时相同）\n色萨利对帝国好感#G +30#!，持续#Y 20#!年"
 oe_lgr.12.b: "只与之通好"
 oe_lgr.12.b.tt: "色萨利对帝国好感#G +15#!，持续#Y 10#!年"
 oe_lgr.12.c: "不予理会"
 oe_lgr.12.c.tt: "帝国不作答复"
 oe_lgr.13.t: "萨洛纳的女伯爵"
 oe_lgr.13.desc_0t: "#F 萨洛纳是加泰罗尼亚人法德里克家的伯爵领。1382年伯爵路易去世，遗孀海伦娜替年幼的女儿玛丽亚摄政。这位女伯爵是马修·坎塔库泽诺斯的女儿、皇帝约翰六世的孙女。1388年，阿拉贡国王还曾请女伯爵出任雅典的城堡长官。#!\n\n如今，色萨利已经落入苏丹之手，萨洛纳成了边城。苏丹的军队逼近了[SCOPE.sCountry('oe_lgr_sao').GetName]。据说城里的人并不心服这位摄政，已有人在盘算向苏丹开门。女伯爵派人来到帝国，请求设法相助。"
 oe_lgr.13.desc_0: "#F 萨洛纳是加泰罗尼亚人法德里克家的伯爵领。1382年伯爵路易去世，遗孀海伦娜替年幼的女儿玛丽亚摄政。这位女伯爵是马修·坎塔库泽诺斯的女儿、皇帝约翰六世的孙女。1388年，阿拉贡国王还曾请女伯爵出任雅典的城堡长官。#!\n\n如今，苏丹的军队逼近了[SCOPE.sCountry('oe_lgr_sao').GetName]。据说城里的人并不心服这位摄政，已有人在盘算向苏丹开门。女伯爵派人来到帝国，请求设法相助。"
 oe_lgr.13.a: "派船把女伯爵母女接到摩里亚"
 oe_lgr.13.a.tt: "花费#R 1#!个月的贸易与税收收入\n奥斯曼对帝国好感#R −10#!，持续#Y 5#!年\n萨洛纳城本身多半保不住"
 oe_lgr.13.b: "劝女伯爵向[SCOPE.sCountry('oe_lgr_ath13').GetName]求援"
 oe_lgr.13.b.tt: "[SCOPE.sCountry('oe_lgr_ath13').GetName]对帝国好感#G +10#!，持续#Y 5#!年\n萨洛纳城本身多半保不住"
 oe_lgr.13.c: "不予过问"
 oe_lgr.13.c.tt: "帝国不作答复"
 oe_lgr.14.t: "约阿尼纳开城"
 oe_lgr.14.desc_1ct: "#F 1429年夏，卡洛一世·托科去世，侄子卡洛二世继位。卡洛一世的几个私生子不服，以梅姆农为首向苏丹穆拉德二世求助，苏丹的大军随即开进了伊庇鲁斯。1430年10月，约阿尼纳的显贵们以保住自己的特权为条件，向苏丹开了城门。就在这前后，塞萨洛尼基也落入了苏丹之手。#!\n\n如今，约阿尼纳的城门已经向苏丹打开。城里有些显贵和教士不愿留在苏丹治下，正设法投奔帝国。阿尔塔还在[SCOPE.sCountry('oe_lgr_arta_c').GetName]手里。"
