 oe_lgr.1.t: "摩里亚的新邻居"
 oe_lgr.1.desc_2da: "#F 这支纳瓦拉佣兵原是都拉佐公爵招来的，1376年替公爵夺回了都拉佐。公爵去世后，佣兵们另寻雇主；1378年进入摩里亚，先受雇于医院骑士团，次年其中一队攻破了底比斯。1381年，名义上的拉丁皇帝据有了亚该亚；1383年此人去世，那不勒斯从此只是名义上的宗主，实权落到了兵团的首领们手里。1387年，兵团的首领与威尼斯立了约。#!\n\n如今，[GetCountry('ACH').GetName]的大小事务由兵团的首领们说了算，专制公的边界上多了一群靠刀剑吃饭的邻居。科林斯和雅典的新主人也在提防这些人。"
