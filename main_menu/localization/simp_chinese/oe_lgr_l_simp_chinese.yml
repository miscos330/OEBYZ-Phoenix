 oe_lgr.2.t: "科林斯领主的女儿"
 oe_lgr.2.desc_2s: "#F 佛罗伦萨人内里奥·阿恰约利是那不勒斯王国大总管尼科洛的养子。尼科洛死后，科林斯抵押到了内里奥名下；1371年塔兰托的腓力确认了此事，次年教皇在信里称内里奥为“科林斯城的领主”。1374年末或1375年初，内里奥又取了迈加拉。1385年，摩里亚的专制公娶了内里奥的长女，据说新娘是当时最美的女子。婚前内里奥许诺：自己身后，科林斯归这个女儿。同一年，内里奥攻进了雅典的下城。1388年5月，卫城也开了门。#!\n\n如今，内里奥已是[SCOPE.sCountry('oe_lgr_ath').GetName]的主人，派人来提亲：愿把长女嫁到摩里亚来，两家结为姻亲。帝国与此人早有盟约，如今是在盟约之外再加一层姻亲。"
