 oe_lgr.20.a: "进兵中希腊，收雅典为附属"
 oe_lgr.20.a.tt: "花费#R 2#!个月的贸易与税收收入\n花费#R 2#!个月的人力\n[SCOPE.sCountry('oe_lgr_ath20').GetName]成为帝国的罗马附属国\n奥斯曼对帝国好感#R −30#!，持续#Y 10#!年\n若日后六里墙下的战事以失利收场，次月雅典的附属关系随之解除"
 oe_lgr.20.b: "只收岁贡"
 oe_lgr.20.b.tt: "获得#G 2#!个月的贸易与税收收入\n[SCOPE.sCountry('oe_lgr_ath20').GetName]对帝国好感#R −10#!，持续#Y 5#!年"
 oe_lgr.20.c: "守住地峡，不出兵"
 oe_lgr.20.c.tt: "帝国不出兵中希腊"
 oe_lgr.90.t: "拉丁希腊：执行"
