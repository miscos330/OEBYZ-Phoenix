l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_venetian_muda: "威尼斯穆达官营武装商队"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_venetian_muda: "参议院按季竞标派遣官营武装长桨商船队远航亚历山大、塔纳与佛兰德斯，集海贸暴利与水师战备于一体。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_san_giorgio_bank: "热那亚圣乔治银行清算所"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_san_giorgio_bank: "公债券、汇票清算与黑海坚城商站令热那亚成为地中海首屈一指的金融巨擘，然公权须与大商董共治。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_condottieri_banners: "伦巴第雇佣兵队长铁约"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_condottieri_banners: "重金延揽名震亚平宁的雇佣兵队长与米兰精工板甲坊，野战冲锋锐不可当，然军费消耗甚巨。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_naples_crown_fleet: "那不勒斯新堡地中海枢密廷"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_naples_crown_fleet: "资助人文硕学、法学家与第勒尼安海战舰，使那不勒斯宫廷威名远播南欧与地中海。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_krakow_statutes: "卡齐米日法典与瓦维尔兴学"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_krakow_statutes: "统一王国成文法典、广筑砖石边堡并敕建克拉科夫大学，使波兰实现“受之于木，遗之于石”的跃升。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_krewo_union_pact: "克雷沃联合盟约"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_krewo_union_pact: "以王朝共主将波兰王冠与立陶宛大公国紧密相连，铸就东欧足以抗衡强敌的雄厚同盟。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_winged_hussars: "波立精锐重装骑兵旗队"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_winged_hussars: "操练长矛重甲贵族骑兵旗队，在广袤东欧原野上屡以雷霆冲锋一战定乾坤。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_sarai_silk_mint: "新萨莱丝路草原官窑"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_sarai_silk_mint: "白银丹格币制、驿站体系与伏尔加河税关将欧亚商队牢牢汇聚于术赤兀鲁思版图。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_steppe_kurultai_host: "草原忽里勒台精骑动员"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_steppe_kurultai_host: "以新颁札儿里黑特许状弥合草原诸部伯克裂痕，重现黑海与伏尔加铁骑千里奔袭威势。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_crimean_volga_gates: "黑海与伏尔加河商道雄关"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_crimean_volga_gates: "控扼克里米亚海港与伏尔加河弯要津，兼得轻骑兵源与黑海、罗斯跨洲贸易厚利。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_delhi_karkhana_canals: "亚穆纳灌渠与苏丹皇家工坊"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_delhi_karkhana_canals: "贯通两河平原的官修水利灌渠与德里皇家手工业工坊，为苏丹国大军与巨城提供丰沛粮帛器用。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_delhi_iqta_discipline: "整顿伊克塔采邑军役制"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_delhi_iqta_discipline: "严核战马点卯与各省伊克塔采邑税赋，既保德里重骑雄风又遏制地方埃米尔跋扈。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_vijayanagara_hampi: "毗奢耶那伽罗宝石与胡椒盛市"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_vijayanagara_hampi: "栋格珀德拉河畔的花岗岩水渠、神庙行会与宝石香料大市，汇聚阿拉伯战马与马拉巴尔胡椒，铸就南印商业奇观。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_nayankara_captains: "纳亚克世袭要塞将领制"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_nayankara_captains: "委任纳亚克军镇将领控扼德干山城要塞与骑兵定额，铸就毗奢耶那伽罗坚不可摧的南方护盾。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_hwacha_firepower: "火筒都监与抗倭火炮水师"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_hwacha_firepower: "设立火筒都监精炼火药，列装火炮巡海战船与神机箭车，令朝鲜半岛海疆化为烈火铁壁。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_joseon_hall_worthies: "集贤殿硕学与训民正音革新"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_joseon_hall_worthies: "汉阳集贤殿大儒创制训民正音谚文、测雨器与自击漏，令半岛识字率与历算政务齐头并进。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_joseon_dynastic_order: "朝鲜六曹集权与科举新秩序"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_joseon_dynastic_order: "整顿公田税籍并确立六曹议政府与科举文官秩序，奠定新王朝数百年治国根基。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_fez_madrasas: "非斯马林王朝经学院盛世"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_fez_madrasas: "精雕雪松木檐、马赛克庭院与卡鲁因、布伊纳尼亚经学院教席交相辉映，令非斯成为马格里布学术明珠。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_maghreb_gold_caravans: "西吉尔马萨金商道与海峡巡防"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_maghreb_gold_caravans: "护卫穿越撒哈拉的西非黄金驼队并控扼直布罗陀海峡锚地，令黄金源源汇入马格里布官窑。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_hafsid_tunis_souks: "哈夫斯突尼斯丝市与海防巡舰"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_hafsid_tunis_souks: "繁盛丝绸大市、地中海商馆条约与矫健的易弗里基叶战舰，使突尼斯稳居西西里与撒哈拉之间的黄金枢纽。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_chinampa_harvest: "特斯科科湖奇南帕水上丰穰田"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_chinampa_harvest: "柳枝固堤、淤泥肥田的奇南帕水上农田一年数熟，以惊人粮产养育墨西哥谷地巍峨巨城。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_triple_alliance: "阿兹特克三国同盟霸权"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_triple_alliance: "以特诺奇蒂特兰、特斯科科与特拉科潘三国同盟统筹贡赋册籍与鹰豹武士精兵，威服中美洲诸邦。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_qorikancha_sun: "帕查库蒂库斯科营建与太阳神殿"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_qorikancha_sun: "严丝合缝的巨石神殿与金箔映日的科里坎查太阳庙，向安第斯四方天下昭示印加宇宙秩序与王室威严。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_qhapaq_nan_quipu: "印加御道、结绳记事与高山粮仓"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_qhapaq_nan_quipu: "驿使接力、高山索桥、奇普结绳账册与遍布群山的官仓，将险峻安第斯山谷编织为运转精密的庞大帝国。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_italian_league: "亚平宁海贸与邦联宪章"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_italian_league: "统一海事保险、行会商法与雇佣兵契约规范，令亚平宁诸城邦在商贸与外交上独占鳌头。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_pl_commonwealth: "雅盖隆王冠联合宪章"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_pl_commonwealth: "联合议会、波罗的海粮贸特许与重装骑兵旗队，将波兰-立陶宛从波罗的海到黑海连为一体。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_steppe_yarlyk: "草原大札儿里黑商军法令"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_steppe_yarlyk: "明定商队护航、银币成色与诸部征召军令，使金帐及诸汗国兼享草原骑威与丝路厚利。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_delhi_prosperity: "德里皇家水利与铸币敕令"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_delhi_prosperity: "扩修恒河-亚穆纳两河灌渠并严核各省税册，为印度斯坦苏丹大军夯实财赋粮仓。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_vijayanagara_charter: "毗奢耶那伽罗军镇与香料宪章"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_vijayanagara_charter: "统筹神庙庄园、山城军镇与阿拉伯战马进口，保卫毗奢耶那伽罗南印霸业长青。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_joseon_reform: "汉阳集贤殿与经国大典"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_joseon_reform: "以金属活字印刷、经国律典与集贤殿历算研究并进，推动朝鲜迈入文治鼎盛之世。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_maghreb_renaissance: "马格里布经学院与商道宪章"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_maghreb_renaissance: "将非斯与突尼斯经学院文教传统与撒哈拉金商道结合，为北非诸邦带来恒久富庶与声望。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_aztec_alliance: "墨西哥谷地帝国贡赋盟约"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_aztec_alliance: "统筹湖堤粮仓、黑曜石武库与长途波奇特卡商探，令特诺奇蒂特兰霸威远震中美洲。"
 STATIC_MODIFIER_NAME_oe_v58_1337_mod_dec_inca_network: "塔万廷苏尤御道与劳役总宪"
 STATIC_MODIFIER_DESC_oe_v58_1337_mod_dec_inca_network: "扩筑安第斯石砌御道、官驿与高山储备粮仓，将漫长山脉牢牢凝聚于库斯科黄金旗帜之下。"
 oe_v58_1337_bld_venetian_arsenal_exp: "威尼斯兵工厂扩建总坞"
 oe_v58_1337_bld_venetian_arsenal_exp_desc: "扩建后的威尼斯新兵工厂以标准化龙骨构件、巨型制缆厅与流水线船台闻名地中海，竟可于一日之内舾装整艘武装战舰。"
 oe_v58_1337_bld_hampi_royal_bazaar: "毗奢耶那伽罗亨比皇家大市"
 oe_v58_1337_bld_hampi_royal_bazaar_desc: "延绵于维鲁帕克沙神庙前的花岗岩雕柱长廊大市，汇聚戈尔康达钻石、马拉巴尔胡椒、丝绸与霍尔木兹良马，盛况令欧亚使节叹为观止。"
 oe_v58_1337_bld_joseon_hall_worthies: "朝鲜汉阳集贤殿学府"
 oe_v58_1337_bld_joseon_hall_worthies_desc: "设于汉阳景福宫内的集贤殿网罗朝鲜半岛顶尖大儒、历算家与音韵学者，主持创制训民正音、编修历法农书与治国大典。"
 oe_v58_1337_bld_krakow_wawel_academy: "克拉科夫瓦维尔皇家学院"
 oe_v58_1337_bld_krakow_wawel_academy_desc: "由卡齐米日大帝敕建、雅德维加女王倾囊重兴的克拉科夫瓦维尔学院，为波兰与立陶宛培养世代法学家、天文学家与外交栋梁。"
 oe_v58_1337_bld_tenochtitlan_chinampa: "特诺奇蒂特兰奇南帕水上农网"
 oe_v58_1337_bld_tenochtitlan_chinampa_desc: "以芦苇席、柳根与湖底肥泥沿运河精巧筑就的奇南帕浮田群，将特斯科科湖化作四季丰收的绿色粮仓，支撑起中美洲第一大都会。"
 oe_v58_1337_bld_cusco_qorikancha: "库斯科科里坎查黄金太阳神殿"
 oe_v58_1337_bld_cusco_qorikancha_desc: "严丝合缝的黑石殿墙遍覆精锻金箔，科里坎查太阳神殿以神圣辐射线连接库斯科与安第斯四方行省，成为塔万廷苏尤的精神中枢。"
 oe_v58_1337_ref_italian_condotta_signoria: "亚平宁海商行会与雇佣军契约制"
 oe_v58_1337_ref_italian_condotta_signoria_desc: "融汇银号清算、官营武装商队与雇佣军审计契约，令亚平宁诸邦商业外交灵动无比，代价是高昂军费与强盛市民自治。"
 oe_v58_1337_ref_jagiellonian_sejm_union: "雅盖隆联合王冠与贵族议会制"
 oe_v58_1337_ref_jagiellonian_sejm_union_desc: "以宗教宽容、波立联合宪章与重甲贵族骑兵立国，缔造辽阔东欧强权，然国王施政与征税皆须屡经议会商议掣肘。"
 oe_v58_1337_ref_ulugh_ulus_kurultai: "大兀鲁思忽里勒台与草原驿站制"
 oe_v58_1337_ref_ulugh_ulus_kurultai_desc: "以四大喀喇赤伯克宗族共议忽里勒台、辅以草原驿站体系，维系疾风弓骑战力与欧亚商路关税，然部族共治易生内争。"
 oe_v58_1337_ref_delhi_iqta_chancery: "德里军务院与伊克塔税政体制"
 oe_v58_1337_ref_delhi_iqta_chancery_desc: "借军务院战马烙印查验、各省伊克塔账册与皇家工坊汇聚印度斯坦财兵大权，然高压集权屡令地方埃米尔心生怨望。"
 oe_v58_1337_ref_vijayanagara_nayankara_court: "毗奢耶那伽罗纳亚克军镇与神庙体制"
 oe_v58_1337_ref_vijayanagara_nayankara_court_desc: "以纳亚克军镇守御德干山城并以神庙资金广兴农田蓄水池，令南印富庶坚韧，但地方将领尾大不掉之势须常加防范。"
 oe_v58_1337_ref_joseon_sarim_censorate: "朝鲜三司言官与科举文治体制"
 oe_v58_1337_ref_joseon_sarim_censorate_desc: "设司宪府、司谏院与弘文馆三司清议并严行科举取士，官僚清廉、文教昌明，然重文轻武与党争清议亦制约军政。"
 oe_v58_1337_ref_maghreb_makhzen_guilds: "马格里布马赫赞枢廷与经院商政"
 oe_v58_1337_ref_maghreb_makhzen_guilds_desc: "整合非斯与突尼斯的城邦工匠行会、撒哈拉商队卫队与皇家经学院，陆海通商与文教并举，然须维系海防与山地部族平衡。"
 oe_v58_1337_ref_meso_andean_tribute_state: "阿兹特克贡赋城邦与印加米塔劳役体制"
 oe_v58_1337_ref_meso_andean_tribute_state_desc: "以周期公共劳役、浮田梯田官仓与精锐武士阶层维系湖泊与高原巨型帝国，粮草与军威俱盛，然沉重劳役常令底层庶民疲惫。"
 oe_v58_1337_dec_venetian_muda_convoys.title: "敕立官营穆达与黎凡特武装商船制"
 oe_v58_1337_dec_venetian_muda_convoys.desc: "规范按季竞标派遣的官营武装商船队，连通威尼斯、热那亚与亚历山大、君士坦丁堡及佛兰德斯大港。"
 oe_v58_1337_dec_venetian_muda_convoys.a: "竞标派遣官营武装商船队"
 oe_v58_1337_dec_venetian_muda_convoys_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_venetian_muda_convoys_eff_tt: "显著提升海贸效率、长桨战船战力与海军传统。"
 oe_v58_1337_dec_italian_condotta_charter.title: "签署亚平宁城邦商政与雇佣军契约宪章"
 oe_v58_1337_dec_italian_condotta_charter.desc: "确立海事保险法庭、文艺复兴宫廷学院与规范化的雇佣兵队长审计条约，全面提升意大利邦国实力。"
 oe_v58_1337_dec_italian_condotta_charter.a: "颁行亚平宁商法与军契宪章"
 oe_v58_1337_dec_italian_condotta_charter_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_italian_condotta_charter_eff_tt: "增强海贸收益、外交声誉与陆军传统。"
 oe_v58_1337_dec_union_of_krewo_statute.title: "颁布雅盖隆波立联合与双海宪章"
 oe_v58_1337_dec_union_of_krewo_statute.desc: "贯通克拉科夫王室法典与维尔纽斯大公枢密院，整编重装贵族骑兵旗队并振兴波罗的海粮贸。"
 oe_v58_1337_dec_union_of_krewo_statute.a: "批准波兰王冠与立陶宛大公国联合宪章"
 oe_v58_1337_dec_union_of_krewo_statute_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_union_of_krewo_statute_eff_tt: "大幅提升重装骑兵战力、属国忠诚与波立威望。"
 oe_v58_1337_dec_steppe_yarlyk_reform.title: "颁行草原金印札儿里黑商军大法"
 oe_v58_1337_dec_steppe_yarlyk_reform.desc: "重颁统御伏尔加河与克里米亚商道的金印札儿里黑诏令，规范银币成色与草原骑兵动员。"
 oe_v58_1337_dec_steppe_yarlyk_reform.a: "向诸部伯克颁行金印札儿里黑诏令"
 oe_v58_1337_dec_steppe_yarlyk_reform_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_steppe_yarlyk_reform_eff_tt: "显著强化轻骑兵威力、陆路丝贸与陆军传统。"
 oe_v58_1337_dec_delhi_sultanate_canals.title: "扩建亚穆纳灌渠与德里皇家工坊"
 oe_v58_1337_dec_delhi_sultanate_canals.desc: "引喜马拉雅雪水兴修恒河-亚穆纳两河灌渠，并整顿德里皇家手工业工坊与各省伊克塔税册。"
 oe_v58_1337_dec_delhi_sultanate_canals.a: "拨款兴修两河灌渠与皇家工坊"
 oe_v58_1337_dec_delhi_sultanate_canals_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_delhi_sultanate_canals_eff_tt: "显著提升全国生产效率、税收与社会稳定。"
 oe_v58_1337_dec_vijayanagara_nayankara_charter.title: "颁行亨比纳亚克军镇与香料通商宪章"
 oe_v58_1337_dec_vijayanagara_nayankara_charter.desc: "明定毗奢耶那伽罗各地纳亚克要塞守将的军役定额，同时庇护西海岸战马与胡椒商队。"
 oe_v58_1337_dec_vijayanagara_nayankara_charter.a: "颁行毗奢耶那伽罗军镇与海贸宪章"
 oe_v58_1337_dec_vijayanagara_nayankara_charter_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_vijayanagara_nayankara_charter_eff_tt: "增强国防坚韧、海贸收益与陆军传统。"
 oe_v58_1337_dec_joseon_hall_of_worthies.title: "敕建集贤殿与铸字所金属活字印刷"
 oe_v58_1337_dec_joseon_hall_of_worthies.desc: "汇聚半岛硕儒设立铸字所铸造铜活字，编修农书历法与经国律典，开创半岛文治新盛世。"
 oe_v58_1337_dec_joseon_hall_of_worthies.a: "拨款兴办集贤殿与皇家铸字所"
 oe_v58_1337_dec_joseon_hall_of_worthies_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_joseon_hall_of_worthies_eff_tt: "大幅加快科研速度、内阁效率与研究进度。"
 oe_v58_1337_dec_maghreb_madrasa_caravans.title: "兴办马格里布经学院并护持撒哈拉金道"
 oe_v58_1337_dec_maghreb_madrasa_caravans.desc: "自非斯布伊纳尼亚经学院、突尼斯宰图纳学府到西吉尔马萨绿洲驿馆，将北非学术繁盛与撒哈拉黄金商道融为一体。"
 oe_v58_1337_dec_maghreb_madrasa_caravans.a: "资助皇家经学院与撒哈拉商队护卫"
 oe_v58_1337_dec_maghreb_madrasa_caravans_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_maghreb_madrasa_caravans_eff_tt: "提升陆路商贸、科研速度与马格里布声望。"
 oe_v58_1337_dec_aztec_triple_alliance_pact.title: "缔结墨西哥谷地三国同盟与贡赋宪章"
 oe_v58_1337_dec_aztec_triple_alliance_pact.desc: "整合墨西哥谷地诸湖邦，以奇南帕丰产官仓、黑曜石武士会馆与贡赋名册确立中美洲霸主地位。"
 oe_v58_1337_dec_aztec_triple_alliance_pact.a: "立誓缔结中美洲三国同盟大约"
 oe_v58_1337_dec_aztec_triple_alliance_pact_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_aztec_triple_alliance_pact_eff_tt: "提升全国粮产、三军士气与陆军传统。"
 oe_v58_1337_dec_inca_qhapaq_nan_network.title: "筑造安第斯印加御道与高山官仓网"
 oe_v58_1337_dec_inca_qhapaq_nan_network.desc: "沿安第斯群峰开凿石阶御道、草编悬索桥、驿使接力站与高山储粮官仓，将四方天下连成铁板一块。"
 oe_v58_1337_dec_inca_qhapaq_nan_network.a: "征调米塔劳役贯通安第斯皇家御道"
 oe_v58_1337_dec_inca_qhapaq_nan_network_req_tt: "须处于 1337 年及以后时代（当前年份 >= 1337）"
 oe_v58_1337_dec_inca_qhapaq_nan_network_eff_tt: "加快大军山地机动、全国掌控与社会稳定。"
 oe_v58_1337.1.title: "威尼斯兵工厂的标准化流水线战船"
 oe_v58_1337.1.desc: "高墙环绕的威尼斯兵工厂内，大造船匠展示了一项惊艳地中海的革新：以预先编号的标准化橡木肋骨、绳索库与流水水道，令武装长桨战舰的舾装速度倍增。"
 oe_v58_1337.1.a: "扩建兵工厂标准化船台与官营穆达商队"
 oe_v58_1337.1.a.tt: "全面强化威尼斯海贸收益与长桨战舰霸权。"
 oe_v58_1337.1.b: "向地中海盟邦出售余船与精铸火炮创收"
 oe_v58_1337.1.b.tt: "迅速为威尼斯共和国国库带来丰厚杜卡特金币。"
 oe_v58_1337.1.c: "赐予兵工厂大匠特别行会荣衔以安民心"
 oe_v58_1337.1.c.tt: "凝聚威尼斯工匠向心力并稳固共和秩序。"
 oe_v58_1337.2.title: "热那亚圣乔治银行与黑海商业殖民站"
 oe_v58_1337.2.desc: "自克里米亚卡法、君城佩拉远至希俄斯与塞维利亚，热那亚大银行家提议将国债债券与黑海商站关税统一纳入圣乔治银行清算所，以资本之力驾驭地中海。"
 oe_v58_1337.2.a: "敕立圣乔治银行为共和国首席金融清算所"
 oe_v58_1337.2.a.tt: "大幅扩大热那亚商队容量与金融铸币收益。"
 oe_v58_1337.2.b: "加固卡法石堡并增派爱琴海护航战船"
 oe_v58_1337.2.b.tt: "强化热那亚东方海防与海军传统。"
 oe_v58_1337.2.c: "发行低息公债化解热那亚世家派系纷争"
 oe_v58_1337.2.c.tt: "平息城邦豪族内斗，稳固共和治安。"
 oe_v58_1337.3.title: "米兰维斯孔蒂与斯福尔扎：精工板甲与雇佣名将"
 oe_v58_1337.3.desc: "米兰制甲作坊锻造出的全套精钢板甲令全欧君王趋之若鹜，与此同时威震亚平宁的雇佣兵队长们正待价而沽，愿以铁骑长矛效命慷慨之主。"
 oe_v58_1337.3.a: "重金签约顶尖雇佣名将并配发米兰全钢板甲"
 oe_v58_1337.3.a.tt: "显著提升重装骑兵突击力与全军士气。"
 oe_v58_1337.3.b: "翻越阿尔卑斯向欧陆广销米兰精甲与丝织品"
 oe_v58_1337.3.b.tt: "将伦巴第精湛手工业化为丰厚国库金币。"
 oe_v58_1337.3.c: "拨款兴修伦巴第运河并营建米兰大教堂"
 oe_v58_1337.3.c.tt: "弘扬公国文化威望并凝聚伦巴第民心。"
 oe_v58_1337.4.title: "那不勒斯新堡与地中海人文王廷"
 oe_v58_1337.4.desc: "俯瞰那不勒斯海湾的新堡宫廷云集法学家、人文诗人与水师宿将，国王正权衡方略：是凭舰队争雄西西里与亚得里亚海，还是以文教礼法服远？"
 oe_v58_1337.4.a: "宏开新堡地中海枢密廷并整备王室舰队"
 oe_v58_1337.4.a.tt: "全面提升那不勒斯海军士气与外交声誉。"
 oe_v58_1337.4.b: "于加埃塔与萨莱诺船坞增造王室主力战船"
 oe_v58_1337.4.b.tt: "加快扩充海军传统与地中海投送实力。"
 oe_v58_1337.4.c: "整顿普利亚牧道关税以充盈南方王室财政"
 oe_v58_1337.4.c.tt: "稳增财政收入并保持南部行省安定。"
 oe_v58_1337.5.title: "卡齐米日大帝克拉科夫法典与石砌王国"
 oe_v58_1337.5.desc: "将散乱旧俗汇编为统一成文王法，敕建克拉科夫大学并整顿维利奇卡盐矿财源，波兰正自木筑旧邦蜕变为巍峨石砌王国。"
 oe_v58_1337.5.a: "颁行克拉科夫统一法典并厚赐瓦维尔大学"
 oe_v58_1337.5.a.tt: "显著提高内阁行政效率与波兰科研增速。"
 oe_v58_1337.5.b: "以维利奇卡盐矿厚利广筑边境砖石城堡"
 oe_v58_1337.5.b.tt: "充盈国库并夯实波兰国防根基。"
 oe_v58_1337.5.c: "敕封维斯瓦河诸城自治宪章以兴工商"
 oe_v58_1337.5.c.tt: "促进波兰城镇繁荣并稳固国内秩序。"
 oe_v58_1337.6.title: "克雷沃大联合：克拉科夫与维尔纽斯结盟"
 oe_v58_1337.6.desc: "北面条顿铁骑压境，东疆草原强权环伺。波兰与立陶宛重臣力主缔结克雷沃王朝大联合，将维斯瓦河至第聂伯河的广袤版图融为东欧砥柱。"
 oe_v58_1337.6.a: "签署克雷沃联合盟约并统筹两邦枢密外交"
 oe_v58_1337.6.a.tt: "大幅增强属国向心力与东欧外交分量。"
 oe_v58_1337.6.b: "合编波立联军重骑准备波罗的海决战"
 oe_v58_1337.6.b.tt: "凝聚波立联军实战精锐，震慑四邻强敌。"
 oe_v58_1337.6.c: "确认鲁塞尼亚与立陶宛贵族特权以安东疆"
 oe_v58_1337.6.c.tt: "维护多教派和谐与联合王国内部安定。"
 oe_v58_1337.7.title: "翼骑兵精锐旗队与联邦议会"
 oe_v58_1337.7.desc: "辽阔的鲁塞尼亚原野与波罗的海平原上，贵族骑兵旗队换装超长空心骑枪与弧形马刀，与此同时联邦议会中的贵族代表高呼“黄金自由”宪章。"
 oe_v58_1337.7.a: "倾力武装精锐重装长矛翼骑兵旗队"
 oe_v58_1337.7.a.tt: "铸就冠绝全欧的重装骑兵突击力与高昂士气。"
 oe_v58_1337.7.b: "特许但泽谷物出口舰队为联邦筹措军费"
 oe_v58_1337.7.b.tt: "以波罗的海谷物商银迅速充实国库。"
 oe_v58_1337.7.c: "通过协约法案调和王权与联邦议会分歧"
 oe_v58_1337.7.c.tt: "缓和君臣矛盾，巩固国内安定与法统。"
 oe_v58_1337.8.title: "新萨莱盛京：白银丹格与草原和平商道"
 oe_v58_1337.8.desc: "来自威尼斯、开罗与撒马尔罕的旅人无不惊叹于伏尔加河畔新萨莱的琉璃浴室、清真寺与万国大市，术赤兀鲁思正值草原丝路鼎盛之期。"
 oe_v58_1337.8.a: "统一新萨莱白银丹格币制并整顿伏尔加商关"
 oe_v58_1337.8.a.tt: "大幅提振陆上丝绸商贸与官窑铸币收入。"
 oe_v58_1337.8.b: "征收罗斯贡银扩编精锐万户铁骑"
 oe_v58_1337.8.b.tt: "迅速充实军资并精炼草原万户骑兵素养。"
 oe_v58_1337.8.c: "于新萨莱设大宴厚赏四大喀喇赤伯克世家"
 oe_v58_1337.8.c.tt: "安抚草原大族，稳固大汗统治根基。"
 oe_v58_1337.9.title: "脱脱迷失、也迪古与草原大动荡抉择"
 oe_v58_1337.9.desc: "自第聂伯河至乌拉尔草原，成吉思汗诸系宗王与权势伯克彼此倾轧。雄才大略的可汗须果断抉择：是召开大忽里勒台重整疾风铁骑，还是依托大河坚城坐收商税？"
 oe_v58_1337.9.a: "召开草原大忽里勒台重整诸部精锐铁骑"
 oe_v58_1337.9.a.tt: "大幅增强轻骑兵战力与草原疾行机动速度。"
 oe_v58_1337.9.b: "向大河商埠颁赐金印护商诏书稳固税源"
 oe_v58_1337.9.b.tt: "安定商市人心，确保草原商道财源滚滚。"
 oe_v58_1337.9.c: "礼聘经学家与文臣入幕以彰汗廷正统"
 oe_v58_1337.9.c.tt: "提升汗廷法统威望与四邻外交声誉。"
 oe_v58_1337.10.title: "克里米亚、喀山与诺盖：黑海与伏尔加商道雄关"
 oe_v58_1337.10.desc: "从巴赫奇萨赖到喀山与乌拉尔河草原，诸继业汗国各辟宏图。精明的可汗正将疾如闪电的草原弓骑与富庶的黑海、伏尔加商关熔于一炉。"
 oe_v58_1337.10.a: "以精锐骑兵卫队控扼黑海与伏尔加河商道"
 oe_v58_1337.10.a.tt: "兼得海陆商贸繁盛与丰沛草原兵源。"
 oe_v58_1337.10.b: "与黑海及罗斯商团议定白银通关协约"
 oe_v58_1337.10.b.tt: "不动干戈即收丰厚通关白银。"
 oe_v58_1337.10.c: "于汗国都城营建清真寺、宫苑与学舍"
 oe_v58_1337.10.c.tt: "增进王室正统威望与国内社会安定。"
 oe_v58_1337.11.title: "图格鲁克雄图：铜币实验与德干御道"
 oe_v58_1337.11.desc: "德里苏丹国疆域横跨旁遮普至孟加拉之际，大胆推行的代用铜币改制与远征德干的巨额军费正令各省埃米尔与官库承受空前压力。"
 oe_v58_1337.11.a: "严查各省伊克塔骑兵名册并恢复足色银币"
 oe_v58_1337.11.a.tt: "重振德里重骑军威与全国兵源动员。"
 oe_v58_1337.11.b: "动用国库足额赎回代用铜币以安商民"
 oe_v58_1337.11.b.tt: "迅速平抑市井动荡，恢复苏丹国信誉与稳定。"
 oe_v58_1337.11.c: "向恒河诸商埠加征临时军贡以充实德里"
 oe_v58_1337.11.c.tt: "迅速补足国库现银以解燃眉之急。"
 oe_v58_1337.12.title: "菲鲁兹沙亚穆纳灌渠与皇家工坊"
 oe_v58_1337.12.desc: "苏丹暂缓南征而大兴土木，水利官在两河平原开凿百里长渠引水灌田，同时三十六座皇家工坊日夜织锦、锻钢、装帧典籍，印度斯坦顿现富庶气象。"
 oe_v58_1337.12.a: "全线贯通亚穆纳灌渠并扩建三十六座皇家工坊"
 oe_v58_1337.12.a.tt: "全面提升全国粮食丰产与手工制造业效率。"
 oe_v58_1337.12.b: "于印度斯坦广筑新城、园林与经学院"
 oe_v58_1337.12.b.tt: "推动德里文教繁荣并提升科研与威望。"
 oe_v58_1337.12.c: "向地方地主有偿分水灌溉以增岁入"
 oe_v58_1337.12.c.tt: "迅速回收工程本银并充实国库。"
 oe_v58_1337.13.title: "诃里诃罗与布卡：栋格珀德拉河畔建毗奢耶那伽罗"
 oe_v58_1337.13.desc: "在栋格珀德拉河畔奇峻的花岗岩巨石群间，诃里诃罗与布卡兄弟筑起七重城墙、雕柱大市与维鲁帕克沙神庙，高举“胜利之城”旗帜凝聚南印度人心。"
 oe_v58_1337.13.a: "扩建亨比宝石大市并广纳霍尔木兹战马海贸"
 oe_v58_1337.13.a.tt: "显著提升南印海贸效率与都城持续繁荣。"
 oe_v58_1337.13.b: "资助泰卢固、卡纳达与梵文大儒及神庙行会"
 oe_v58_1337.13.b.tt: "夯实王朝正统威望并凝聚南印多语文化。"
 oe_v58_1337.13.c: "倾资采购阿拉伯良马与青铜火炮备战德干"
 oe_v58_1337.13.c.tt: "迅速充实德干前线战备与陆军传统。"
 oe_v58_1337.14.title: "纳亚克山城诸将与马拉巴尔胡椒海埠"
 oe_v58_1337.14.desc: "骁勇善战的纳亚克领主镇守德干诸座花岗岩山城，与此同时阿拉伯、大明与远西商船齐聚东西两海岸，竞相争购马拉巴尔胡椒与科罗曼德尔细棉布。"
 oe_v58_1337.14.a: "整编纳亚克要塞军镇铸成德干南方铁壁"
 oe_v58_1337.14.a.tt: "大幅加强国防坚韧度与全国征召兵源。"
 oe_v58_1337.14.b: "直征马拉巴尔香料港关税充实胜利之城内库"
 oe_v58_1337.14.b.tt: "广收南洋香料海税，极大充实国库。"
 oe_v58_1337.14.c: "在泰米尔与泰卢固河谷广筑石砌蓄水灌溉池"
 oe_v58_1337.14.c.tt: "厚植南印农桑水利并提升国家稳定。"
 oe_v58_1337.15.title: "崔茂宣火筒都监与荡倭火炮水师"
 oe_v58_1337.15.desc: "倭寇船队连年焚掠自济州至汉江的沿海粮仓。火药先驱崔茂宣上疏朝廷设立火筒都监，自炼焰硝并铸造舰载大炮与神机箭，以烈火荡平海患。"
 oe_v58_1337.15.a: "敕设火筒都监并全面列装火炮水师与火箭车"
 oe_v58_1337.15.a.tt: "显著强化朝鲜火炮战力与抗倭战船威力。"
 oe_v58_1337.15.b: "加固南道沿海石城与山间避难粮堡"
 oe_v58_1337.15.b.tt: "固守南道粮仓并稳固国内治安。"
 oe_v58_1337.15.c: "招抚海商船长编入官军协防海峡"
 oe_v58_1337.15.c.tt: "节省军费并吸收海上航海人才。"
 oe_v58_1337.16.title: "威化岛回军：高丽易代与朝鲜王朝肇基"
 oe_v58_1337.16.desc: "权门世族兼并公田、鸭绿江边危机四伏之际，百战名将李成桂与理学改革家郑道传率师回京，倡行科田法并迁都汉阳，开启朝鲜王朝五百年基业。"
 oe_v58_1337.16.a: "颁行朝鲜六曹经国体制并定鼎汉阳新都"
 oe_v58_1337.16.a.tt: "全面提升中枢内阁行政效率与新朝正统威望。"
 oe_v58_1337.16.b: "雷厉风行推行科田法重分公田充实国库"
 oe_v58_1337.16.b.tt: "破除权门积弊，充盈国家税赋府库。"
 oe_v58_1337.16.c: "礼遇开京旧勋臣以求政局平稳过渡"
 oe_v58_1337.16.c.tt: "避免剧烈震荡，维系朝野稳定。"
 oe_v58_1337.17.title: "世宗大王集贤殿与《训民正音》颁布"
 oe_v58_1337.17.desc: "汉阳景福宫集贤殿内，世宗大王与诸贤臣创制科学易学的《训民正音》谚文以惠万民，并同制测雨器、仰釜日晷与天象历算仪器，铸就朝鲜文治巅峰。"
 oe_v58_1337.17.a: "颁行《训民正音》并厚赐集贤殿历算学府"
 oe_v58_1337.17.a.tt: "大幅提高全民识字率与国家科研速度。"
 oe_v58_1337.17.b: "以铜活字精印《农事直说》颁行八道州县"
 oe_v58_1337.17.b.tt: "兴盛八道农桑并提升国内稳定与声望。"
 oe_v58_1337.17.c: "令集贤殿学者优先测绘北疆四郡六镇边图"
 oe_v58_1337.17.c.tt: "加强北疆边防经略与陆军战备经验。"
 oe_v58_1337.18.title: "非斯卡鲁因学府与布伊纳尼亚经学院"
 oe_v58_1337.18.desc: "在马林苏丹倾力赞助下，大匠于非斯精筑雪松雕檐、大理石喷泉与铜壶水钟，伊本·白图泰与伊本·赫勒敦等鸿儒旅者纷纷驻足，令摩洛哥文教冠绝西域。"
 oe_v58_1337.18.a: "重金资助非斯皇家经学院与天文典籍馆"
 oe_v58_1337.18.a.tt: "显著提升摩洛哥科研速度与文化传统威名。"
 oe_v58_1337.18.b: "赞助马格里布史志并遣使远通西非与埃及"
 oe_v58_1337.18.b.tt: "扬名伊斯兰世界并巩固国内正统。"
 oe_v58_1337.18.c: "抽征非斯皮革与铜器大市商税扩建海防"
 oe_v58_1337.18.c.tt: "迅速充实国库并积累海军传统。"
 oe_v58_1337.19.title: "西吉尔马萨黄金商队与直布罗陀海峡雄关"
 oe_v58_1337.19.desc: "满载马里沙金与撒哈拉岩盐的庞大驼队抵达西吉尔马萨绿洲，与此同时直布罗陀海峡与休达港外战云密布，商路与海防系于一身。"
 oe_v58_1337.19.a: "派精锐骑卫护持撒哈拉金道并加固海峡锚地"
 oe_v58_1337.19.a.tt: "提振陆路商贸效率与黄金铸币产出。"
 oe_v58_1337.19.b: "即刻将新到沙金铸为足色马林金第纳尔入库"
 oe_v58_1337.19.b.tt: "迅速化黄金商税为可观国库现款。"
 oe_v58_1337.19.c: "与阿特拉斯山地诸部结盟共御海上外患"
 oe_v58_1337.19.c.tt: "安抚山地诸部，稳固国内治安与民心。"
 oe_v58_1337.20.title: "哈夫斯突尼斯：丝绸大市、宰图纳与地中海巡舰"
 oe_v58_1337.20.desc: "扼守地中海咽喉的哈夫斯突尼斯既与威尼斯、热那亚和阿拉贡缔结丰厚商馆条约，又以矫健巡舰卫护易弗里基叶富庶港湾与宰图纳千年学府。"
 oe_v58_1337.20.a: "扩建突尼斯丝绸大市并整备地中海护航战船"
 oe_v58_1337.20.a.tt: "全面提升突尼斯海贸效率与水师士气。"
 oe_v58_1337.20.b: "向意西商团颁发特许商馆执照收取重金"
 oe_v58_1337.20.b.tt: "广纳地中海商税并缓和北岸外交压力。"
 oe_v58_1337.20.c: "厚赐宰图纳清真寺学者并广纳安达卢斯巧匠"
 oe_v58_1337.20.c.tt: "提升突尼斯学术科研、手工业与国内稳定。"
 oe_v58_1337.21.title: "奇南帕水上农田与特斯科科湖石堤巨城"
 oe_v58_1337.21.desc: "在特斯科科湖芦苇浅滩之上，墨西加工程大师打桩固堤、修筑可拆吊桥石道，并辟出肥沃无比的奇南帕水上农田，令湖心孤岛拔地而起为中美洲第一巨城。"
 oe_v58_1337.21.a: "大兴奇南帕水上农田并引查普尔特佩克清泉入城"
 oe_v58_1337.21.a.tt: "极大丰沛全国粮产并推动人口蓬勃增长。"
 oe_v58_1337.21.b: "加固湖上石堤堡垒并操练独木舟水战船队"
 oe_v58_1337.21.b.tt: "强化墨西哥谷地湖防战备与陆军传统。"
 oe_v58_1337.21.c: "盛开特拉特洛尔科水上大市广征百货商税"
 oe_v58_1337.21.c.tt: "迅速汇聚墨西哥谷地商贸财富充实国库。"
 oe_v58_1337.22.title: "伊兹科瓦特尔与内萨瓦尔科约特尔：铸就阿兹特克三国同盟"
 oe_v58_1337.22.desc: "推翻旧霸权之后，雄主伊兹科瓦特尔、谋臣特拉卡埃莱尔与诗人工程师内萨瓦尔科约特尔携手结成三国同盟，以鹰豹武士精兵与严密贡赋册威震中美洲两洋。"
 oe_v58_1337.22.a: "确立三国同盟贡赋册籍并扩建鹰豹武士会馆"
 oe_v58_1337.22.a.tt: "显著提升全军士气与中美洲诸属邦忠诚。"
 oe_v58_1337.22.b: "委任内萨瓦尔科约特尔修律法、筑防洪长堤"
 oe_v58_1337.22.b.tt: "推进工程文教、国内稳定与帝国威望。"
 oe_v58_1337.22.c: "派遣波奇特卡长途商团南下易取可可与翡翠"
 oe_v58_1337.22.c.tt: "以远途商贸丰厚国库并广增声望。"
 oe_v58_1337.23.title: "帕查库蒂重塑库斯科与科里坎查黄金太阳神殿"
 oe_v58_1337.23.desc: "击退强敌之后，尊号“重塑世界者”的萨帕印加帕查库蒂按圣美洲狮之形重建库斯科王城，并以精锻金箔遍覆科里坎查太阳神殿石壁，开启塔万廷苏尤盛世。"
 oe_v58_1337.23.a: "以黄金装点科里坎查神殿并昭告四方天下大统"
 oe_v58_1337.23.a.tt: "大幅提升萨帕印加正统威望与安第斯文化凝聚力。"
 oe_v58_1337.23.b: "于库斯科高崖筑造萨克塞华曼巨石锯齿要塞"
 oe_v58_1337.23.b.tt: "大幅锤炼陆军传统并铸就库斯科不破雄关。"
 oe_v58_1337.23.c: "赐予高原诸部酋长华美织锦与盛宴以结忠心"
 oe_v58_1337.23.c.tt: "怀柔安第斯诸部酋长，稳固帝国后方。"
 oe_v58_1337.24.title: "印加御道、奇普结绳账吏与高山储备官仓"
 oe_v58_1337.24.desc: "蜿蜒数千里的石砌御道跨越雪峰与沙海，飞奔的查斯基驿使、精通奇普结绳记账的官吏与满贮冻干马铃薯的高山官仓，令安第斯帝国政令军粮旬日可达四境。"
 oe_v58_1337.24.a: "全境贯通印加御道、草编索桥与奇普核算官署"
 oe_v58_1337.24.a.tt: "显著加快大军山地行军与中枢内阁行政效率。"
 oe_v58_1337.24.b: "广开安第斯高山石阶梯田并充实各省官仓"
 oe_v58_1337.24.b.tt: "充实高山战备粮仓，令帝国无惧灾荒与久战。"
 oe_v58_1337.24.c: "统筹高原白银与羊驼精织贡赋充盈王库"
 oe_v58_1337.24.c.tt: "迅速丰盈安第斯王库以资拓土之需。"
