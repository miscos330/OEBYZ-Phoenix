# NEW 2026-11-22 v13.5 Worker 2: 16 Historical & Regional Peace Treaties Library (oe_pt_ / oe_trty). Generated by gen_v135_peace_treaties.py; edit the generator, not this file.
 oe_pt_westphalian_sovereignty: "威斯特伐利亚主权与“教随国定”"
 oe_pt_westphalian_sovereignty_desc: "仿效1648年《威斯特伐利亚和约》，以国际公法确立邦国主权平等与“教随国定”原则，遏制跨国宗教干涉。胜方将获20年外交声望、异端宽容与立法效率增益；败方在20年内承受战争分数效率削弱并损及正统性与宗教影响。"
 oe_pt_westphalian_sovereignty_entry: "缔结《威斯特伐利亚主权条款》：确立邦国主权与宗教共存原则（持续20年）"
 oe_pt_westphalian_sovereignty_entry_short: "威斯特伐利亚主权"
 oe_pt_nerchinsk_border_trade: "尼布楚划界与边市协定"
 oe_pt_nerchinsk_border_trade_desc: "参照1689年《尼布楚条约》，以明文界碑划定欧亚陆疆并开放官督边市，化干戈为互市。胜方获25年商人运力、边防防御与外交声望增益；败方亦得25年稳定投入与边市贸易配额，令万里陆疆暂归安宁。"
 oe_pt_nerchinsk_border_trade_entry: "签署《尼布楚划界与边市协定》：勘定欧亚陆疆并开放25年互市通商"
 oe_pt_nerchinsk_border_trade_entry_short: "尼布楚划界互市"
 oe_pt_kuchuk_kaynarca_straits: "库楚克-凯纳吉海峡自由通航"
 oe_pt_kuchuk_kaynarca_straits_desc: "仿效1774年《库楚克-凯纳吉条约》，迫使掌控博斯普鲁斯、霍尔木兹、马六甲、亚丁、亚历山大或厄勒海峡等咽喉的败方向胜方商船永久敞开航道。胜方获25年海权商力、商人运力与威望增益；败方则痛失咽喉海贸红利。"
 oe_pt_kuchuk_kaynarca_straits_entry: "强制开放世界咽喉海峡自由通航（持续25年）"
 oe_pt_kuchuk_kaynarca_straits_entry_short: "海峡自由通航"
 oe_pt_mare_liberum_opening: "《海洋自由论》强制开海"
 oe_pt_mare_liberum_opening_desc: "援引1609年格劳秀斯《海洋自由论》，宣告公海不属于任何一国私产，废止败方对远洋商路的排他性封锁。胜方获20年贸易保护、海权商力与舰队航速增益；败方在20年内贸易中心权势与海权商力双双受挫。"
 oe_pt_mare_liberum_opening_entry: "强行推行《海洋自由论》：打破海商封锁并开放远洋航道（持续20年）"
 oe_pt_mare_liberum_opening_entry_short: "海洋自由开海"
 oe_pt_abolish_cartaz_monopoly: "废除卡塔兹（Cartaz）海洋垄断"
 oe_pt_abolish_cartaz_monopoly_desc: "彻底废止印度洋与南洋航线上的强制航海通行证（Cartaz）及武装抽税体制，还季风海贸以万国竞逐。胜方获25年贸易中心权势、商贸收入与俘船率增益；败方在25年内商贸收入与贸易保护能力大减。"
 oe_pt_abolish_cartaz_monopoly_entry: "废除印度洋与南洋“卡塔兹”海洋垄断体制（持续25年）"
 oe_pt_abolish_cartaz_monopoly_entry_short: "废除卡塔兹垄断"
 oe_pt_restitute_masterpieces: "强制归还掠夺传世名作"
 oe_pt_restitute_masterpieces_desc: "援引1815年维也纳和会文物归还先例，责令败方交出战乱掠夺或府库珍藏的传世艺术名作。优先物理运回最多2件原产地归属胜方的非无价名作；若无原产故物，则押运败方境内品质最高的1件非无价名作至胜方首都，并振奋全国文化传统与威望。"
 oe_pt_restitute_masterpieces_entry: "强制归还并物理运回败方珍藏的1至2件传世艺术名作至胜方首都"
 oe_pt_restitute_masterpieces_entry_short: "归还传世名作"
 oe_pt_celestial_cefeng_investiture: "天朝册封与奉表朝贡"
 oe_pt_celestial_cefeng_investiture_desc: "天朝上国依传统册封礼制颁授金印诏书，纳败方入朝贡体系。若满足附庸条件则即刻立其为朝贡国；胜方获20年天命正统、附庸忠诚与外交声望增益，受封方亦凭贡市特许获20年文化影响与商贸权势。"
 oe_pt_celestial_cefeng_investiture_entry: "颁授天朝册封金印：条件满足时立败方为朝贡附庸并授双边20年册封礼遇"
 oe_pt_celestial_cefeng_investiture_entry_short: "天朝册封朝贡"
 oe_pt_dismantle_great_hegemony: "拆解列强霸权宣称"
 oe_pt_dismantle_great_hegemony_desc: "迫使傲视四海的列强或超级帝国当众放弃霸权野心、重归多极均势格局。败方即刻痛失巨额威望，并在20年内蒙受外交声望、月度威望与战争分数效率重挫；胜方则以均势守护者之名获20年外交声望与外交容量增益。"
 oe_pt_dismantle_great_hegemony_entry: "拆解列强霸权宣称：重挫败方威望与扩张效率，确立胜方20年均势主导地位"
 oe_pt_dismantle_great_hegemony_entry_short: "拆解列强霸权"
 oe_pt_colonial_factory_concession: "海外特许商馆与通商口岸"
 oe_pt_colonial_factory_concession_desc: "效法近代通商口岸、奥斯曼特惠条约（Capitulations）、广州十三行与长崎出岛商馆先例，责令败方在沿海口岸批设特许商馆。胜方获25年商人运力、市民商额与商贸收入增益；败方虽致本国市民不满，却也因外来商馆而加快25年思潮传播。"
 oe_pt_colonial_factory_concession_entry: "在败方沿海口岸设立25年特许商馆与通商特权"
 oe_pt_colonial_factory_concession_entry_short: "特许商馆口岸"
 oe_pt_treaty_of_perpetual_peace: "永久和平与互保盟约"
 oe_pt_treaty_of_perpetual_peace_desc: "效法1686年俄波《永久和约》，以庄严誓词结束旷日持久的消耗战，为双方争取宝贵的休养生息窗口。缔约双方即刻大幅降低厌战度，并在15年内获得厌战衰减，胜方另享稳定投入与外交声望红利。"
 oe_pt_treaty_of_perpetual_peace_entry: "缔结《永久和平协定》：双方立减厌战并享15年休养生息红利"
 oe_pt_treaty_of_perpetual_peace_entry_short: "永久和平盟约"
 oe_pt_forced_religious_toleration: "强制宗教宽容与教民护佑敕令"
 oe_pt_forced_religious_toleration_desc: "借鉴《南特敕令》与《华沙联邦宽容条款》，责令异教败方颁布护佑少数教民的敕令并停止强制改宗。败方在25年内大幅提升异端与异教宽容但传教转化效率大减；胜方以教民护法之尊获20年宗教影响与外交声望增益。"
 oe_pt_forced_religious_toleration_entry: "责令败方颁行25年宗教宽容敕令并遏制强制改宗"
 oe_pt_forced_religious_toleration_entry_short: "强制宗教宽容"
 oe_pt_demilitarize_frontier_zone: "边疆非军事化与裁军协定"
 oe_pt_demilitarize_frontier_zone_desc: "迫使败方拆除前沿堡垒防线、裁撤边疆常备驻军并划定非军事缓冲带。败方在20年内承受全国防御、陆军维护效率与陆军传统衰减惩罚；胜方则凭借稳固边防获15年防御与陆军传统增益。"
 oe_pt_demilitarize_frontier_zone_entry: "划定边疆非军事缓冲区：削弱败方20年边防与军备维持能力"
 oe_pt_demilitarize_frontier_zone_entry_short: "边疆非军事化"
 oe_pt_silk_road_caravan_immunity: "丝路商队豁免与护路协定"
 oe_pt_silk_road_caravan_immunity_desc: "责令控制欧亚内陆丝路商埠的败方免除胜方商队关卡苛税并提供驿站护卫。胜方获20年商人运力与贸易中心权势增益；败方虽让渡部分贸易份额，却也借络绎商旅微幅提升本国市民满意度。"
 oe_pt_silk_road_caravan_immunity_entry: "订立丝路商队免税与护路协定（持续20年）"
 oe_pt_silk_road_caravan_immunity_entry_short: "丝路商队豁免"
 oe_pt_silver_indemnity_schedule: "白银岁币与铸币赔款"
 oe_pt_silver_indemnity_schedule_desc: "参照澶渊岁币与近代白银赔款先例，责令败方按其经济体量即刻缴纳一笔封顶安全折算的金银赔款，并在15年内承担铸币与商贸税负；胜方则以源源银锭充盈府库并加速15年营造工程。"
 oe_pt_silver_indemnity_schedule_entry: "征收按经济基数安全封顶的白银赔款并附15年铸币赔付安排"
 oe_pt_silver_indemnity_schedule_entry_short: "白银岁币赔款"
 oe_pt_scholarly_manuscript_tribute: "典籍抄本与百工引渡条款"
 oe_pt_scholarly_manuscript_tribute_desc: "责令拥有大学或丰富艺藏的败方开放藏书阁与工坊图谱，容许胜方史官与工匠抄录要籍并引渡百工技艺。胜方获20年科研速度、识字率与思潮传播增益，并在首都抄录生成一部高品质《格致农政历算典籍》；败方承受15年科研滞缓。"
 oe_pt_scholarly_manuscript_tribute_entry: "抄录败方典籍图谱并在胜方首都生成一部传世格致典籍（持续20年科研增益）"
 oe_pt_scholarly_manuscript_tribute_entry_short: "典籍百工引渡"
 oe_pt_revoke_privateer_letters: "吊销私掠特许状与反海盗公约"
 oe_pt_revoke_privateer_letters_desc: "责令败方当即吊销一切私掠许可证（Letters of Marque）并签署反海盗公约，肃清海上劫掠。败方在20年内私掠维持与雇佣开销剧增、俘船能力受挫；胜方则获20年贸易保护与反海盗海战强力加持。"
 oe_pt_revoke_privateer_letters_entry: "吊销败方私掠特许状并缔结20年海上反海盗公约"
 oe_pt_revoke_privateer_letters_entry_short: "吊销私掠特许"
 oe_pt_westphalian_sovereignty_tt: "若败方奉行正统性体制则损失 #N 10#! 点正统性；若其国教具宗教影响力机制则损失 #N 15#! 点宗教影响。"
 oe_pt_restitute_masterpieces_tt: "优先将败方境内原产地归属胜方的最多 #P 2#! 件非无价传世名作物理运回胜方首都；若无原产故物，则押运败方品质最高的 #P 1#! 件非无价名作至胜方首都并变更归属。"
 oe_pt_celestial_cefeng_investiture_tt: "若败方满足朝贡附庸条件，将即刻受封成为胜方的#Y 朝贡国#!。"
 oe_pt_silver_indemnity_schedule_tt: "败方按经济基数的 #Y 1.5#! 倍（封顶 #Y 25–400#! 杜卡特）向胜方一次性交付白银赔款。"
 oe_pt_scholarly_manuscript_tribute_tt: "两日内于胜方首都藏书馆完成抄录，生成一部高品质（#P 82#!）《#Y 格致农政历算典籍#!》传世抄本。"
 OE_PT_RESTITUTE_OWN_ORIGIN: "追索本国失落名作"
 OE_PT_AI_DIFFERENT_RELIGION: "异教外交博弈"
 OE_PT_AI_BORDER_NEIGHBOR: "陆疆接壤邻国"
 OE_PT_AI_MARITIME_STAKE: "海权商路利益"
