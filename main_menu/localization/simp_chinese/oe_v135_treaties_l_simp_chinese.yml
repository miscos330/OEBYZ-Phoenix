 oe_trty.1.t: "国宝凯旋：传世名作入京大典"
 oe_trty.1.d: "随着和约墨迹未干，一支由精锐仪仗护送的马车与船队已将自敌国府库索回的传世名作安然运抵我国首都。金箔画卷、古籍法典与稀世器物在宫门广场前逐一开箱验明正身，全城士民争相瞻仰。翰林学者与礼官联名请示：是将这批失而复得的瑰宝隆重陈列于殿堂以彰文治武功，还是先行编目修缮、深藏御库以泽被后世学术？"
 oe_trty.1.a: "大开宫廷展陈，令四海瞻仰文明正统"
 oe_trty.1.b: "收归御库精校修缮，供翰林与工匠研习"
 oe_trty.2.t: "抄本成卷：御前格致典籍落成"
 oe_trty.2.d: "依据《典籍抄本与百工引渡条款》，派往败方大学与藏书阁的史官、译员与工匠已满载图谱草稿归国。经过数日夜以继日的誊录、校勘与装帧，一部融合农政、历算、舆图与工艺精粹的《格致农政历算典籍》传世抄本正式入藏我国首都书府，成为国家学术跃升的新基石。"
 oe_trty.2.a: "立颁各郡学宫传抄研读"
 oe_trty.2.b: "封存为镇馆重宝，厚赏随行史官与百工"
 oe_trty.3.t: "威斯特伐利亚和约：万邦主权新序"
 oe_trty.3.d: "在庄严的大和约殿堂内，各国全权使节相继于羊皮纸诏书上落印。条约明文确认领土主权神圣不可侵犯，并以“教随国定”的公法原则为绵延多年的教派干戈画上句号。从此，列国折冲樽俎不再仅凭教义狂热，而须以条约法度与国家理性为依归。"
 oe_trty.3.a: "向万国通告主权公法新纪元"
 oe_trty.3.b: "命法曹编纂《万国公法释义》"
 oe_trty.4.t: "海道洞开：自由通航的凯歌"
 oe_trty.4.d: "随着海峡自由通航与打破海洋垄断的和约正式生效，昔日森严的关卡炮台与苛酷的通行证税吏被迫让路。悬挂我国旗帜的商船队正乘着顺风驶过咽喉海峡与季风大洋，各大港市的商会与海军提督纷纷发来捷报，庆贺海疆通衢重归畅通。"
 oe_trty.4.a: "命海军护航立碑，巩固远洋制海威望"
 oe_trty.4.b: "即刻抽收首季通商红利充实府库"
 oe_trty.5.t: "金印诏书：天朝册封大礼告成"
 oe_trty.5.d: "鸿胪寺正使已捧着御赐金印与册封诏书完成出使使命。远邦君长北面受印、奉表称藩，承诺按期遣使朝贡并开放互市。随着礼乐钟磬在宫廷奏响，天下共主的纲常名分再度彰显于四海之间。"
 oe_trty.5.a: "大朝受贺，昭示天命正统于四方"
 oe_trty.5.b: "赏赐回礼并整顿贡市税课"
 oe_trty.6.t: "霸权折戟：多极均势会议公报"
 oe_trty.6.d: "那座曾令诸邦战栗的超级强权终于在谈判桌上低头，被迫公开撤回其不可一世的霸权宣称。消息传遍欧亚各国宫廷，曾经惶惶不安的邻邦与中小国家纷纷遣使致贺，称颂我国以堂堂之师维系了天下均势与万国独立。"
 oe_trty.6.a: "阅兵庆功，宣誓捍卫多极均势"
 oe_trty.6.b: "借声威整饬内政，安抚疲惫州郡"
 oe_trty.7.t: "边市银约：陆疆与和平条约生效"
 oe_trty.7.d: "界碑既立、银锭入库、商队获颁免税通行符节，连年征战的边疆终于迎来久违的宁静。前线守军陆续换防休整，来自远方的驼队与商旅正沿着新近划定的安全驿道络绎而来，为战后的国计民生注入生机。"
 oe_trty.7.a: "抚恤军民，与民休息以固国本"
 oe_trty.7.b: "拨出专项商税充作国库储备"
 oe_trty.8.t: "万国和约殿堂：外交批准总览"
 oe_trty.8.d: "枢密文书院已将本朝缔结的各项历史和约条款——涵盖通商口岸特许商馆、宗教宽容敕令、边疆非军事化与吊销私掠特许状——逐条录入金册并盖玺存档。十六项跨文明外交和约机制均已全面就绪，随时可在未来每场大战的议和谈判中铸就历史新篇。"
 oe_trty.8.a: "归档国史金册，昭示外交威仪"
 oe_trty.8.b: "通令各地督抚严格督察条约履约"
