 OE_PT_AI_INDIAN_OCEAN_STAKE: "印度洋季风商道利益"
 OE_PT_AI_CELESTIAL_TRIBUTARY: "纳为天朝朝贡国"
 OE_PT_AI_WAR_WEARY: "厌战思安休养"
 OE_PT_AI_EURASIAN_TRADE: "欧亚内陆商路利害"
 OE_PT_AI_WEALTHY_FOE: "敌国财力丰厚"
 OE_PT_AI_SCHOLARLY_CENTER: "敌国拥有著名大学"
 STATIC_MODIFIER_NAME_oe_pt_westphalia_winner_mod: "威斯特伐利亚主权保障者"
 STATIC_MODIFIER_DESC_oe_pt_westphalia_winner_mod: "作为新国际公法与主权平等原则的缔造者，本国在列国间享有崇高外交威望与开明法度。"
 STATIC_MODIFIER_NAME_oe_pt_westphalia_loser_mod: "威斯特伐利亚和约约束"
 STATIC_MODIFIER_DESC_oe_pt_westphalia_loser_mod: "本国被迫承认邦国主权与宗教共存，跨境干涉与强硬索求受到国际条约掣肘。"
 STATIC_MODIFIER_NAME_oe_pt_nerchinsk_winner_mod: "尼布楚陆疆互市主导"
 STATIC_MODIFIER_DESC_oe_pt_nerchinsk_winner_mod: "界碑勘定而边市大开，万里陆疆商队络绎，边防井然有序。"
 STATIC_MODIFIER_NAME_oe_pt_nerchinsk_loser_mod: "尼布楚边市协约"
 STATIC_MODIFIER_DESC_oe_pt_nerchinsk_loser_mod: "虽以和约划定了边疆界限，定期官市仍为国境带来安稳与商机。"
 STATIC_MODIFIER_NAME_oe_pt_straits_open_winner_mod: "海峡自由通航特权"
 STATIC_MODIFIER_DESC_oe_pt_straits_open_winner_mod: "我国商船可畅行战略咽喉海峡而免受盘剥，远洋贸易大为兴盛。"
 STATIC_MODIFIER_NAME_oe_pt_straits_open_loser_mod: "海峡门户洞开"
 STATIC_MODIFIER_DESC_oe_pt_straits_open_loser_mod: "被迫向敌国开放咽喉海峡航道，令本国海贸税权与声望蒙尘。"
 STATIC_MODIFIER_NAME_oe_pt_mare_liberum_winner_mod: "《海洋自由论》海权护航"
 STATIC_MODIFIER_DESC_oe_pt_mare_liberum_winner_mod: "公海航行自由之说已载入和约，我国舰队与商船得以疾驰四海。"
 STATIC_MODIFIER_NAME_oe_pt_mare_liberum_loser_mod: "闭海垄断瓦解"
 STATIC_MODIFIER_DESC_oe_pt_mare_liberum_loser_mod: "对远洋航道的排他性垄断被强行打破，海商霸权大打折扣。"
 STATIC_MODIFIER_NAME_oe_pt_cartaz_broken_winner_mod: "破除卡塔兹季风商权"
 STATIC_MODIFIER_DESC_oe_pt_cartaz_broken_winner_mod: "废止印度洋武装通行证垄断后，我国商舶纵横香料诸港而利市百倍。"
 STATIC_MODIFIER_NAME_oe_pt_cartaz_broken_loser_mod: "卡塔兹海贸体系崩塌"
 STATIC_MODIFIER_DESC_oe_pt_cartaz_broken_loser_mod: "失去对印度洋航船的强制征税特权，远东与香料贸易收益大减。"
 STATIC_MODIFIER_NAME_oe_pt_restituted_pride_mod: "国宝归宗·文脉大振"
 STATIC_MODIFIER_DESC_oe_pt_restituted_pride_mod: "流失海外或夺自敌廷的传世名作凯旋入京，举国士民与艺苑无不欢欣鼓舞。"
 STATIC_MODIFIER_NAME_oe_pt_cefeng_suzerain_mod: "天朝册封宗主威仪"
 STATIC_MODIFIER_DESC_oe_pt_cefeng_suzerain_mod: "四夷宾服、奉表称臣，天朝礼乐与册封威德远播诸藩。"
 STATIC_MODIFIER_NAME_oe_pt_cefeng_tributary_mod: "天朝册封贡市特许"
 STATIC_MODIFIER_DESC_oe_pt_cefeng_tributary_mod: "既获天朝金印册封，本国使节得以借朝贡之机畅通中原厚利商市。"
 STATIC_MODIFIER_NAME_oe_pt_balance_keeper_mod: "万国均势守护者"
 STATIC_MODIFIER_DESC_oe_pt_balance_keeper_mod: "成功折损超级霸权之锋芒，使本国在列强外交舞台上成为公认的定海神针。"
 STATIC_MODIFIER_NAME_oe_pt_hegemon_humbled_mod: "霸权宣称受挫"
 STATIC_MODIFIER_DESC_oe_pt_hegemon_humbled_mod: "在天下瞩目下被迫签字让步，令本国昔日不可一世的霸主光环黯然失色。"
 STATIC_MODIFIER_NAME_oe_pt_factory_concession_winner_mod: "海外特许商馆网络"
 STATIC_MODIFIER_DESC_oe_pt_factory_concession_winner_mod: "凭和约设立的海外特许商馆源源汇聚珍货与关税红利。"
 STATIC_MODIFIER_NAME_oe_pt_factory_concession_loser_mod: "口岸商馆特许条约"
 STATIC_MODIFIER_DESC_oe_pt_factory_concession_loser_mod: "外商特许商馆虽令本土市民行会怨声载道，却也意外带来了新思潮与技艺。"
 STATIC_MODIFIER_NAME_oe_pt_perpetual_peace_winner_mod: "永久和平休养生息"
 STATIC_MODIFIER_DESC_oe_pt_perpetual_peace_winner_mod: "和约止戈之后，朝野得以抚恤疮痍、整饬内政而四邻敬服。"
 STATIC_MODIFIER_NAME_oe_pt_perpetual_peace_loser_mod: "战后停火休养"
 STATIC_MODIFIER_DESC_oe_pt_perpetual_peace_loser_mod: "久战终歇，军民得以在和约保障下逐步消弭厌战疲惫。"
 STATIC_MODIFIER_NAME_oe_pt_defender_toleration_winner_mod: "教民护法之尊"
 STATIC_MODIFIER_DESC_oe_pt_defender_toleration_winner_mod: "以和约迫使异邦善待教民，赢得了海内外信众与各国使节的敬仰。"
 STATIC_MODIFIER_NAME_oe_pt_forced_toleration_loser_mod: "条约宗教宽容敕令"
 STATIC_MODIFIER_DESC_oe_pt_forced_toleration_loser_mod: "受和约条款约束，官府必须保障不同教派礼拜自由，不得强行推行改宗。"
 STATIC_MODIFIER_NAME_oe_pt_secure_frontier_winner_mod: "稳固边防战略缓冲"
 STATIC_MODIFIER_DESC_oe_pt_secure_frontier_winner_mod: "敌国前沿拆防之后，我国边关压力顿减而军纪更为精进。"
 STATIC_MODIFIER_NAME_oe_pt_demilitarized_loser_mod: "边疆非军事化裁军"
 STATIC_MODIFIER_DESC_oe_pt_demilitarized_loser_mod: "要塞拆毁且兵备受限，令本国边防空虚、军费运转维艰。"
 STATIC_MODIFIER_NAME_oe_pt_caravan_immunity_winner_mod: "丝路商队免税特权"
 STATIC_MODIFIER_DESC_oe_pt_caravan_immunity_winner_mod: "凭护路敕令畅行内陆驿道，我国驼队与马帮独占丝路厚利。"
 STATIC_MODIFIER_NAME_oe_pt_caravan_immunity_loser_mod: "丝路驿道开放义务"
 STATIC_MODIFIER_DESC_oe_pt_caravan_immunity_loser_mod: "虽让渡了部分内陆关卡商权，络绎而来的过境商旅仍活跃了本地市集。"
 STATIC_MODIFIER_NAME_oe_pt_silver_indemnity_winner_mod: "白银赔款充盈官库"
 STATIC_MODIFIER_DESC_oe_pt_silver_indemnity_winner_mod: "源源流入的条约银锭充实了铸币局与工部营造经费。"
 STATIC_MODIFIER_NAME_oe_pt_silver_indemnity_loser_mod: "白银赔款铸币重负"
 STATIC_MODIFIER_DESC_oe_pt_silver_indemnity_loser_mod: "巨额白银外流压迫铸币收益与商贸周转，国库捉襟见肘。"
 STATIC_MODIFIER_NAME_oe_pt_manuscript_tribute_winner_mod: "万卷抄本与百工汇京"
 STATIC_MODIFIER_DESC_oe_pt_manuscript_tribute_winner_mod: "自敌邦引进的珍本图籍与工匠师徒极大推动了我国格致实学与识字普及。"
 STATIC_MODIFIER_NAME_oe_pt_manuscript_tribute_loser_mod: "典籍外流与工坊凋零"
 STATIC_MODIFIER_DESC_oe_pt_manuscript_tribute_loser_mod: "核心典籍被抄录外传、名匠流失，令本国学术演进一时受阻。"
 STATIC_MODIFIER_NAME_oe_pt_safe_sealanes_winner_mod: "肃清海盗·海疆清晏"
 STATIC_MODIFIER_DESC_oe_pt_safe_sealanes_winner_mod: "敌方私掠特许状尽数废止后，我国护航舰队得以牢牢掌控商路安全。"
 STATIC_MODIFIER_NAME_oe_pt_no_privateers_loser_mod: "禁绝私掠公约约束"
 STATIC_MODIFIER_DESC_oe_pt_no_privateers_loser_mod: "签署反海盗公约后，任何私掠活动都面临严厉制裁与高昂维系成本。"
 oe_trty.1.t: "国宝凯旋：传世名作入京大典"
 oe_trty.1.d: "随着和约墨迹未干，一支由精锐仪仗护送的马车与船队已将自敌国府库索回的传世名作安然运抵我国首都。金箔画卷、古籍法典与稀世器物在宫门广场前逐一开箱验明正身，全城士民争相瞻仰。翰林学者与礼官联名请示：是将这批失而复得的瑰宝隆重陈列于殿堂以彰文治武功，还是先行编目修缮、深藏御库以泽被后世学术？"
 oe_trty.1.a: "大开宫廷展陈，令四海瞻仰文明正统"
 oe_trty.1.b: "收归御库精校修缮，供翰林与工匠研习"
 oe_trty.2.t: "抄本成卷：御前格致典籍落成"
 oe_trty.2.d: "依据《典籍抄本与百工引渡条款》，派往败方大学与藏书阁的史官、译员与工匠已满载图谱草稿归国。经过数日夜以继日的誊录、校勘与装帧，一部融合农政、历算、舆图与工艺精粹的《格致农政历算典籍》传世抄本正式入藏我国首都书府，成为国家学术跃升的新基石。"
 oe_trty.2.a: "立颁各郡学宫传抄研读"
 oe_trty.2.b: "封存为镇馆重宝，厚赏随行史官与百工"
 oe_trty.3.t: "威斯特伐利亚和约：万邦主权新序"
 oe_trty.3.d: "在庄严的大和约殿堂内，各国全权使节相继于羊皮纸诏书上落印。条约明文确认领土主权神圣不可侵犯，并以“教随国定”的公法原则为绵延多年的教派干戈画上句号。从此，列国折冲樽俎不再仅凭教义狂热，而须以条约法度与国家理性为依归。"
 oe_trty.3.a: "向万国通告主权公法新纪元"
 oe_trty.3.b: "命法曹编纂《万国公法释义》"
 oe_trty.4.t: "海道洞开：自由通航的凯歌"
 oe_trty.4.d: "随着海峡自由通航与打破海洋垄断的和约正式生效，昔日森严的关卡炮台与苛酷的通行证税吏被迫让路。悬挂我国旗帜的商船队正乘着顺风驶过咽喉海峡与季风大洋，各大港市的商会与海军提督纷纷发来捷报，庆贺海疆通衢重归畅通。"
 oe_trty.4.a: "命海军护航立碑，巩固远洋制海威望"
 oe_trty.4.b: "即刻抽收首季通商红利充实府库"
 oe_trty.5.t: "金印诏书：天朝册封大礼告成"
 oe_trty.5.d: "鸿胪寺正使已捧着御赐金印与册封诏书完成出使使命。远邦君长北面受印、奉表称藩，承诺按期遣使朝贡并开放互市。随着礼乐钟磬在宫廷奏响，天下共主的纲常名分再度彰显于四海之间。"
 oe_trty.5.a: "大朝受贺，昭示天命正统于四方"
 oe_trty.5.b: "赏赐回礼并整顿贡市税课"
 oe_trty.6.t: "霸权折戟：多极均势会议公报"
 oe_trty.6.d: "那座曾令诸邦战栗的超级强权终于在谈判桌上低头，被迫公开撤回其不可一世的霸权宣称。消息传遍欧亚各国宫廷，曾经惶惶不安的邻邦与中小国家纷纷遣使致贺，称颂我国以堂堂之师维系了天下均势与万国独立。"
 oe_trty.6.a: "阅兵庆功，宣誓捍卫多极均势"
 oe_trty.6.b: "借声威整饬内政，安抚疲惫州郡"
 oe_trty.7.t: "边市银约：陆疆与和平条约生效"
 oe_trty.7.d: "界碑既立、银锭入库、商队获颁免税通行符节，连年征战的边疆终于迎来久违的宁静。前线守军陆续换防休整，来自远方的驼队与商旅正沿着新近划定的安全驿道络绎而来，为战后的国计民生注入生机。"
 oe_trty.7.a: "抚恤军民，与民休息以固国本"
 oe_trty.7.b: "拨出专项商税充作国库储备"
 oe_trty.8.t: "万国和约殿堂：外交批准总览"
 oe_trty.8.d: "枢密文书院已将本朝缔结的各项历史和约条款——涵盖通商口岸特许商馆、宗教宽容敕令、边疆非军事化与吊销私掠特许状——逐条录入金册并盖玺存档。十六项跨文明外交和约机制均已全面就绪，随时可在未来每场大战的议和谈判中铸就历史新篇。"
 oe_trty.8.a: "归档国史金册，昭示外交威仪"
 oe_trty.8.b: "通令各地督抚严格督察条约履约"
