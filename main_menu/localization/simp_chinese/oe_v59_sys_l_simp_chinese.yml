l_simp_chinese:
# Project Phoenix v59.0 Main Mod Localization (Simplified Chinese)
 oe_v59_sys_pi_maritime_charter: "海事特许法案"
 oe_v59_sys_pi_maritime_charter_desc: "向沿海航运商行授予王室护航、海事法庭与船坞特许权，加快造船与海上贸易效率，但略微触动土地贵族的既有利益。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_maritime_charter: "海事特许法案"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_maritime_charter: "特许船坞与护航商路提升了海权存在、海上贸易效率与造船速度。"
 oe_v59_sys_pi_imperial_grain_reserve: "帝国常平仓法案"
 oe_v59_sys_pi_imperial_grain_reserve_desc: "责令各省于丰年广设常平义仓，以备荒年与围城之急，以微幅财政让利换取粮食保障与乡里安定。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_grain_reserve: "帝国常平粮储"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_grain_reserve: "官办常平仓稳固了全国粮食供给并降低稳定成本，代价是小幅税收效率支出。"
 oe_v59_sys_pi_mercenary_audit: "雇佣军核查与常饷法案"
 oe_v59_sys_pi_mercenary_audit_desc: "派遣王室点验官清查佣兵名册、裁撤空饷并统一常饷拨付，大幅压缩雇佣军溢价与军费耗散，唯引起领兵贵族不满。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_mercenary_audit: "雇佣军核查与常饷"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_mercenary_audit: "严密的点验制度压低了雇佣军雇佣溢价并改善军队维持效率。"
 oe_v59_sys_pi_silk_spice_tariff: "丝绸与香料关税宪章"
 oe_v59_sys_pi_silk_spice_tariff_desc: "将陆路商队干道与香料转运港的厘金整合为统一税则，提振出口效率与陆路商贸，同时令贵金属流入带来轻度通胀。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_silk_spice_tariff: "丝绸与香料关税宪章"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_silk_spice_tariff: "统一长途关税激发了商队贸易与出口收益，但伴随轻微通胀压力。"
 oe_v59_sys_pi_printing_royal_academy: "印刷机与皇家科学院特许令"
 oe_v59_sys_pi_printing_royal_academy_desc: "核准活字印书坊并设立支薪皇家科学院，加速识字率提升、学术研究与思潮传播，纵然令保守教士心怀戒备。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_printing_academy: "印刷机与皇家科学院"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_printing_academy: "特许印刷与皇家学术资助推动了科研速度、识字率与制度思潮扩散。"
 oe_v59_sys_pi_religious_toleration_edict: "宗教宽容敕令"
 oe_v59_sys_pi_religious_toleration_edict_desc: "以成文法保障境内少数派教徒的良心自由与财产权益，有效缓和教派冲突并稳定各阶层，但必将引发教士阶层的强烈抗议。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_toleration_edict: "宗教宽容敕令"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_toleration_edict: "对少数派信仰的法律保障安抚了族群裂痕，却降低了教士阶层满意度。"
 oe_v59_sys_pi_colonial_viceroyalty: "殖民总督区监察法案"
 oe_v59_sys_pi_colonial_viceroyalty_desc: "在海外总督区与属国设立常驻王室审理院与财政巡按，提高属国忠诚、贡赋回报与移民统筹，但令列强对我们的霸权更趋警惕。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_colonial_viceroyalty: "殖民总督区监察"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_colonial_viceroyalty: "制度化的总督审计提高了属国忠诚度、属国收入与海外移民规模。"
 oe_v59_sys_pi_industrial_infra_bond: "工业基建公债法案"
 oe_v59_sys_pi_industrial_infra_bond_desc: "由议会发行公共工程债券，资助运河、收费大道、煤港与工场建设，以略高的借款利息换取全国建造速度与生产效率跃升。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_industrial_bond: "工业基建公债"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_industrial_bond: "公共工程融资显著加快了建造速度与工业产出，同时略微推高借款利率。"
 oe_v59_sys_pi_army_modernization_levy: "陆军近代化拨款法案"
 oe_v59_sys_pi_army_modernization_levy_desc: "经议会拨付专款编纂统一操典、兴办军校并革新火器兵工厂，以更高的常备军维持成本换取严明军纪与迅捷征募。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_army_modernization: "陆军近代化整编"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_army_modernization: "统一操典与近代兵工提升了军队训练度与征募速度，但增加了军费维护负担。"
 oe_v59_sys_pi_east_asian_memorial: "东亚密折与奏事改制"
 oe_v59_sys_pi_east_asian_memorial_desc: "推行密折奏事与御史巡察制度，绕过盘根错节的勋贵掣肘直达御前，显著提升内阁行政效率与地方控制力。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_east_asian_memorial: "密折奏事新制"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_east_asian_memorial: "密折直奏与台谏核查提高了内阁效率与各省控制力，代价是勋贵阶层不满。"
 oe_v59_sys_pa_nobles_officer_patents: "确认世袭军官委任状"
 oe_v59_sys_pa_nobles_officer_patents_simple: "世袭军官委任"
 oe_v59_sys_pa_nobles_officer_patents_desc: "贵族阶层要求确认五年期世袭军官委任特权以换取议会支持，将略微抬高常备军维持费。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_officer_patents: "世袭军官委任特权"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_officer_patents: "保留军官席位安抚了贵族阶层，但增加了军队维持开销。"
 oe_v59_sys_pa_burghers_free_port_charter: "自由港保税特许权"
 oe_v59_sys_pa_burghers_free_port_charter_simple: "自由港保税特许"
 oe_v59_sys_pa_burghers_free_port_charter_desc: "市民代表要求设立临时保税仓与自由港免税特许，以小幅让渡直接税收换取出口增长与议会赞成票。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_free_port: "自由港保税特许"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_free_port: "保税自由港特权提振了出口与市民满意度，但略微减少了直接税收入。"
 oe_v59_sys_pa_clergy_seminary_tithe: "资助教区神学院"
 oe_v59_sys_pa_clergy_seminary_tithe_simple: "教区神学院拨款"
 oe_v59_sys_pa_clergy_seminary_tithe_desc: "教士代表要求划拨什一专款资助教区神学院与传教士培养，以换取议会表决支持。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_seminary_tithe: "教区神学院资助"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_seminary_tithe: "官方资助的神学院加快了传教归化速度并安抚教士阶层，代价是小幅财政支出。"
 oe_v59_sys_pa_peasants_famine_granary: "开仓赈济乡里饥荒"
 oe_v59_sys_pa_peasants_famine_granary_simple: "乡里义仓赈济"
 oe_v59_sys_pa_peasants_famine_granary_desc: "农民代表呼吁于青黄不接之际开仓放粮并暂缓非急迫徭役，以换取基层对议会议案的拥护。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_famine_granary: "乡里义仓赈济"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_famine_granary: "应急粮赈增强了粮食保障与农民满意度，同时减缓了官府营造进度。"
 oe_v59_sys_pa_burghers_guild_patent: "维护手工业行会专利"
 oe_v59_sys_pa_burghers_guild_patent_simple: "手工业行会专利"
 oe_v59_sys_pa_burghers_guild_patent_desc: "城市行会请求议会确认专属印记与工坊专利，提升工艺产出并取悦市民，但推高了国内物价。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_guild_patent: "手工业行会专利"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_guild_patent: "受保护的工艺专利提高了工坊生产效率与市民满意度，但伴随轻微通胀。"
 oe_v59_sys_pa_nobles_hunting_forests: "保护领主狩猎林地"
 oe_v59_sys_pa_nobles_hunting_forests_simple: "领主林地专权"
 oe_v59_sys_pa_nobles_hunting_forests_desc: "地方贵族要求王室严查私伐与偷猎以维护庄园猎场，此举取悦贵族并加强乡间弹压，却令农民心怀怨怼。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_hunting_forests: "领主猎林法令"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_hunting_forests: "林地巡查取悦了庄园贵族并小幅增强控制力，但损害了农民阶层满意度。"
 oe_v59_sys_ord_varangian_axe: "瓦兰吉战斧骑士团"
 oe_v59_sys_ord_varangian_axe_desc: "承袭驻守君士坦丁堡御前、手持双手战斧的北欧—希腊亲卫誓约，将久经沙场的帝国将领与王室侍卫凝聚在铁血军纪之下。"
 oe_v59_sys_dec_ord_varangian_axe.title: "敕建瓦兰吉战斧骑士团"
 oe_v59_sys_dec_ord_varangian_axe.desc: "正式重整御前瓦兰吉斧卫团为帝国军事兄弟会，向君主、亲王与百战宿将授予战斧徽章。"
 oe_v59_sys_dec_ord_varangian_axe.a: "缔结瓦兰吉战斧之誓"
 oe_v59_sys_ord_danubian_dragon: "多瑙河巨龙骑士团"
 oe_v59_sys_ord_danubian_dragon_desc: "仿效匈牙利与巴尔干边境的蟠龙十字军兄弟会，凝聚多瑙河与喀尔巴阡沿线大领主与堡垒守将共守边疆要塞。"
 oe_v59_sys_dec_ord_danubian_dragon.title: "敕建多瑙河巨龙骑士团"
 oe_v59_sys_dec_ord_danubian_dragon.desc: "在多瑙河与巴尔干诸要塞颁布蟠龙徽章，缔结边疆大贵族与统帅的铁血防御盟誓。"
 oe_v59_sys_dec_ord_danubian_dragon.a: "高举蟠龙战旗"
 oe_v59_sys_ord_saint_stephen_lepanto: "圣斯德望与勒班陀海军骑士团"
 oe_v59_sys_ord_saint_stephen_lepanto_desc: "效法纵横地中海、清剿海盗航道的桨帆海军骑士团，授予舰队统帅与海港贵族赤十字勋章以守卫海权与船厂。"
 oe_v59_sys_dec_ord_saint_stephen_lepanto.title: "敕建圣斯德望与勒班陀海军骑士团"
 oe_v59_sys_dec_ord_saint_stephen_lepanto.desc: "创建地中海桨帆舰长与海军上将组成的海事骑士兄弟会，护卫远洋航道与商队安全。"
 oe_v59_sys_dec_ord_saint_stephen_lepanto.a: "祝圣海军十字勋章"
 oe_v59_sys_ord_imperial_keshig: "大汗怯薛禁卫兄弟会"
 oe_v59_sys_ord_imperial_keshig_desc: "遴选诸部那颜子弟与百战箭筒士编成宿卫怯薛，既是君主昼夜贴身护卫，亦是草原大将与统帅的摇篮。"
 oe_v59_sys_dec_ord_imperial_keshig.title: "编组大汗怯薛禁卫兄弟会"
 oe_v59_sys_dec_ord_imperial_keshig.desc: "召募功臣勋戚子弟与万户骁将入值御前怯薛，缔结忠于汗庭的草原精锐骑兵兄弟会。"
 oe_v59_sys_dec_ord_imperial_keshig.a: "颁赐黄金牌符"
 oe_v59_sys_ord_xuanjia_red_plume: "玄甲与赤羽先锋兄弟会"
 oe_v59_sys_ord_xuanjia_red_plume_desc: "承袭黑铁玄甲重骑与赤羽先锋之威名，授予破阵宿将与武举魁首虎符勋衔，铸就汉字文化圈最精锐的御前战团。"
 oe_v59_sys_dec_ord_xuanjia_red_plume.title: "敕建玄甲与赤羽先锋兄弟会"
 oe_v59_sys_dec_ord_xuanjia_red_plume.desc: "以玄铁重甲与赤羽徽旗为志，设立表彰忠勇统帅与禁军骁将的帝国武勋兄弟会。"
 oe_v59_sys_dec_ord_xuanjia_red_plume.a: "颁授虎符玄甲"
 oe_v59_sys_ord_qizilbash_immortals: "奇兹尔巴什与不死军骑士团"
 oe_v59_sys_ord_qizilbash_immortals_desc: "融合波斯古代不死近卫军传统与红帽奇兹尔巴什精骑之烈勇，将忠心耿耿的重骑将领与省督凝聚在万王之王旗下。"
 oe_v59_sys_dec_ord_qizilbash_immortals.title: "敕建奇兹尔巴什与不死军骑士团"
 oe_v59_sys_dec_ord_qizilbash_immortals.desc: "向御前铁骑与忠贞埃米尔颁赐赤冠与不死军长矛徽旗，铸就伊朗高原无坚不摧的近卫武团。"
 oe_v59_sys_dec_ord_qizilbash_immortals.a: "加戴红帽授矛"
 oe_v59_sys_ord_hachiman_bushido: "八幡武士道兄弟会"
 oe_v59_sys_ord_hachiman_bushido_desc: "在弓矢武神八幡大菩萨幡旗之下立誓，以严苛剑术修行、绝对忠义与终身尚武精神统摄麾下精锐武士将领。"
 oe_v59_sys_dec_ord_hachiman_bushido.title: "缔结八幡武士道兄弟会"
 oe_v59_sys_dec_ord_hachiman_bushido.desc: "在八幡神前集结麾下名将与旗本家臣，确立世代传承武家纪律与战魂的武士兄弟会。"
 oe_v59_sys_dec_ord_hachiman_bushido.a: "奉行八幡武誓"
 oe_v59_sys_ord_hesperian_eagle: "赫斯珀里亚金鹰骑士团"
 oe_v59_sys_ord_hesperian_eagle_desc: "以星辰加冕之银鹰为徽，表彰将罗马法统与古典文明播撒于旧陆新洲的元老重臣、航海巨擘与军团统帅。"
 oe_v59_sys_dec_ord_hesperian_eagle.title: "敕建赫斯珀里亚金鹰骑士团"
 oe_v59_sys_dec_ord_hesperian_eagle.desc: "创立象征罗马复兴与西方地平线的银鹰勋团，凝聚元老院贤臣与军团宿将。"
 oe_v59_sys_dec_ord_hesperian_eagle.a: "高举赫斯珀里亚银鹰"
 oe_v59_sys_encyclopedia_canon: "百科总典"
 oe_v59_sys_encyclopedia_canon_desc: "荟萃历代科学、律法与百工技艺的多卷本学术总典，惠泽后世无数读者。"
 oe_v59_sys_scientific_tractate: "近代科学巨著"
 oe_v59_sys_scientific_tractate_desc: "革新观测、航海与实证哲学的划时代数理与天文学论著。"
 oe_v59_sys_art_rihla_ibn_battuta: "伊本·白图泰游记：奇观异俗录"
 oe_v59_sys_art_rihla_ibn_battuta_desc: "历时三十载跋涉丹吉尔、德里、基卢瓦、廷巴克图与泉州后口述成书的宏伟游记，翔实记述了亚非欧各大王朝、商港与商道风貌。"
 oe_v59_sys_dec_mp_rihla.title: "资助编纂《伊本·白图泰游记》"
 oe_v59_sys_dec_mp_rihla.desc: "敕命宫廷书记官系统记录这位马格里布大旅行家跨越三大洲的见闻与城邦志略。"
 oe_v59_sys_dec_mp_rihla.a: "敕令编纂传世游记"
 oe_v59_sys.1.title: "伊本·白图泰游记"
 oe_v59_sys.1.desc: "历经数十载万里行脚、遍览绿洲商站与季风大港的法学旅行家愿在本朝庇护下口述毕生游历。宫廷抄手已备妥纸墨，静候陛下裁定这部地理与邦交奇书的流传之法。"
 oe_v59_sys.1.a: "装帧泥金御览本赠予各国使节"
 oe_v59_sys.1.b: "刊印商路地理注本广发商贾与学院"
 oe_v59_sys.1.c: "秘藏原本于宫廷御库以资治鉴"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_rihla_grand: "《游记》御前资助者"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_rihla_grand: "贯通三洲的地理声望提升了外交威望与陆路贸易效率。"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_rihla_copies: "《游记》商路指南"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_rihla_copies: "广为传抄的城邦志加快了思潮传播与出口贸易。"
 oe_v59_sys_art_yongle_dadian: "永乐大典"
 oe_v59_sys_art_yongle_dadian_desc: "汇聚两千余名翰林硕儒历时数载编纂而成的万余册皇皇巨典，囊括历代经史子集、天文历法、水利农医与治国典章。"
 oe_v59_sys_dec_mp_yongle.title: "敕修《永乐大典》"
 oe_v59_sys_dec_mp_yongle.desc: "征召天下翰林学士与名家抄手，将古今典籍、律令、农医与工艺尽数辑录为不朽大典。"
 oe_v59_sys_dec_mp_yongle.a: "开馆纂修大典"
 oe_v59_sys.2.title: "《永乐大典》纂修告成"
