 # Project Phoenix v45.0 Main Mod AI Calibration & Era Audio Localization (ZH).
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_late_medieval_restraint:0 "中世纪晚期边疆整固态势"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_late_medieval_restraint:0 "人工智能欧洲诸国将政务重心集中于本土整固与边疆城防，暂缓过早的跨洋殖民扩张。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_anatolian_balkan_focus:0 "安纳托利亚与巴尔干陆权重心"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_anatolian_balkan_focus:0 "安纳托利亚与巴尔干地区的人工智能国家优先筹措陆军征召与近疆战备，克制远洋航程扩张。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_discovery_atlantic_pace:0 "大航海时代大西洋远征节奏"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_discovery_atlantic_pace:0 "伊比利亚与大西洋人工智能海权延伸远洋探索航程与殖民补给，同时承受更高的欧陆陆军维系与外交摩擦。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_discovery_continental_restraint:0 "文艺复兴欧陆均势方略"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_discovery_continental_restraint:0 "欧洲内陆人工智能朝廷着力经营外交网络与城邑产力，避免脱离历史条件强行远洋殖民。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_confessional_coalition_balance:0 "教派与专制时代列强均势韧性"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_confessional_coalition_balance:0 "列强人工智能枢密院维系稳健的同盟体系与攻城效率，同时以更高的要塞与战疲成本避免无限期僵持。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_gunpowder_frontier_cohesion:0 "火药帝国边疆统合态势"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_gunpowder_frontier_cohesion:0 "奥斯曼、莫卧儿、大清与波斯等人工智能大帝国强化行省控制与边疆兵源，相应承受更高的军费与制度惰性。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_revolutionary_mobilization:0 "革命时代列强财政与动员节奏"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_revolutionary_mobilization:0 "后期列强人工智能强化战时税制、炮兵火力与大规模兵源动员，同时承担更高的国内动荡与军费压力。"
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_early_industrial_fiscal:0 "早期工业化海商与财政战备"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_early_industrial_fiscal:0 "步入早期工业化的人工智能强邦加快工坊产出、船坞建造与思潮传播，代价为传统贵族阶层不满与舰队开支上升。"
 oe_v45_aud_era_cues_title:0 "凤凰计划 v45.0 时代加权原声调度（1337—1836）"
 oe_v45_aud_era_cues_desc:0 "基于原版 Wwise 音频事件的无冲突时代加权原声调度，覆盖中世纪晚期、文艺复兴、大航海、教派专制、启蒙与革命诸时代。"
