 oe_v175m_dec_ulus_stipend: "萨莱冬粮协饷与草原补给"
 oe_v175m_dec_ulus_stipend.title: "萨莱冬粮协饷与草原补给"
 oe_v175m_dec_ulus_stipend.desc: "自萨莱汗廷拨发银饷、过冬粮草与战马补给至各术赤兀鲁思翼部，维系寒冬草原驻军战力。向所有现存术赤兀鲁思翼部拨付军饷（国库吃紧的翼部将获加倍赈济），降低其独立倾向，提升兀鲁思凝聚度，并赋予持续5年的#Y 萨莱冬粮协饷#!修正。"
 oe_v175m_dec_ulus_stipend_desc: "斥资150金币自萨莱向各术赤兀鲁思翼部拨发过冬粮草与协饷，提升翼部忠诚度与兀鲁思凝聚度，每5年可行一次。"
 oe_v175m_dec_ulus_stipend.a: "发粮拨饷，固守草原诸翼"
 STATIC_MODIFIER_NAME_oe_v175m_ulus_garrison_mod: "兀鲁思草原冬防后勤"
 STATIC_MODIFIER_DESC_oe_v175m_ulus_garrison_mod: "草原屯牧草料站与萨莱驿路补给维系着本翼部骑兵的冬季驻防，免于因严冬与欠饷裁散。"
 STATIC_MODIFIER_NAME_oe_v175m_sarai_stipend_mod: "萨莱冬粮协饷"
 STATIC_MODIFIER_DESC_oe_v175m_sarai_stipend_mod: "萨莱汗廷直拨的银饷与冬粮车队大幅减轻军费负担、抵御严冬损耗，并令翼部更加归心大汗。"
