l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_tbd_raid_loc: "遭劫"
 STATIC_MODIFIER_DESC_oe_tbd_raid_loc: "敌军越境劫掠，村舍被焚，牲口被赶走。"
 STATIC_MODIFIER_NAME_oe_tbd_raid_light_loc: "遭劫（轻）"
 STATIC_MODIFIER_DESC_oe_tbd_raid_light_loc: "敌军越境劫掠，城堡的守军挡住了大部分人马。"
 STATIC_MODIFIER_NAME_oe_tbd_deserted_loc: "边村空虚"
 STATIC_MODIFIER_DESC_oe_tbd_deserted_loc: "农户为躲避劫掠迁往内地，边村少有人烟。"
 STATIC_MODIFIER_NAME_oe_tbd_driven_loc: "押回的农户"
 STATIC_MODIFIER_DESC_oe_tbd_driven_loc: "官兵把逃走的农户押回边村，村里人心不安。"
 STATIC_MODIFIER_NAME_oe_tbd_fortified_loc: "城堡修缮"
 STATIC_MODIFIER_DESC_oe_tbd_fortified_loc: "边境的城堡（kastron）补好了城墙，添了守军。"
 STATIC_MODIFIER_NAME_oe_tbd_fortified: "城堡修缮"
 STATIC_MODIFIER_DESC_oe_tbd_fortified: "这个边镇修缮了边境的城堡。边患#G −20#!，遭劫的损失减半。"
 STATIC_MODIFIER_NAME_oe_tbd_levy: "边军新募"
 STATIC_MODIFIER_DESC_oe_tbd_levy: "这个边镇新募了一批边军。边患#G −10#!。"
 STATIC_MODIFIER_NAME_oe_tbd_hired: "外族佣兵"
 STATIC_MODIFIER_DESC_oe_tbd_hired: "这个边镇雇了外族佣兵守边。边患#G −15#!；佣兵每年可能滋事。"
 oe_tbd_fortify: "修缮城堡"
 oe_tbd_fortify_desc: "#F 十三世纪下半叶起，帝国各地分成小辖区（katepanikion），每区由一名凯法勒（kephale）兼管军政，治所常是一座城堡（kastron）。1342年起，塞尔维亚的斯特凡·杜尚接连夺取马其顿的城镇；1345年9月，塞莱在长期围困后陷落。#!\n修缮一个[oe_tu_march|e]的边境城堡。花费#R 100#!金币；同一边镇#Y 10#!年内只能修缮一次。效果#Y 10#!年：边患#G −20#!，遭劫的损失减半；该边镇部队补充速度#G +10%#!；其辖区的边境地点防御#G +15%#!。\n要向强邻纳币求和，请用“遣使纳币”。"
 oe_tbd_levy: "征募边军"
 oe_tbd_levy_desc: "#F 1261年以后，皇帝需要时，可以把领受普罗尼亚（pronoia）的兵士编成部队出征。#!\n在一个[oe_tu_march|e]征募边军。花费#R 50#!金币；同一边镇#Y 5#!年内只能征募一次。在其治所新建#G 2#!个军区兵团（兵种随时代）；#Y 5#!年内边患#G −10#!，该边镇人力#G +10%#!。\n要向强邻纳币求和，请用“遣使纳币”。"
 oe_tbd_hire: "雇佣外族"
 oe_tbd_hire_desc: "#F 1303年1月，安德洛尼卡二世雇来对付小亚细亚突厥诸侯的加泰罗尼亚佣兵团到达君士坦丁堡。1305年4月，佣兵团首领罗杰·德·弗洛尔在阿德里安堡被杀，佣兵团随后在色雷斯劫掠了两年。#!\n为一个[oe_tu_march|e]雇佣外族兵守边。花费#R 40#!金币；同一边镇#Y 5#!年内只能雇一次。#Y 5#!年内边患#G −15#!，该边镇陆军士气#G +5%#!；每年1月有#R 10%#!的可能佣兵滋事。\n要向强邻纳币求和，请用“遣使纳币”。"
 oe_tbd_fortify_card: "修缮边镇的边境城堡，边患下降，遭劫损失减半。"
 oe_tbd_levy_card: "在边镇新募边军，边患下降。"
 oe_tbd_hire_card: "为边镇雇外族兵守边，边患下降，但佣兵可能滋事。"
 oe_tbd_fortify_select: "选择边镇"
 oe_tbd_fortify_none: "@trigger_no!没有可选的边镇（只有边镇可以选；同一边镇#Y 10#!年内只能修缮城堡一次）。"
 oe_tbd_allow_fortify: "国库至少有#Y 100#!金币"
 oe_tbd_levy_select: "选择边镇"
 oe_tbd_levy_none: "@trigger_no!没有可选的边镇（只有边镇可以选；同一边镇#Y 5#!年内只能征募边军一次）。"
 oe_tbd_allow_levy: "国库至少有#Y 50#!金币"
 oe_tbd_hire_select: "选择边镇"
 oe_tbd_hire_none: "@trigger_no!没有可选的边镇（只有边镇可以选；同一边镇#Y 5#!年内只能雇佣外族一次）。"
 oe_tbd_allow_hire: "国库至少有#Y 40#!金币"
 oe_tbd_fortify_tt: "#R −100#!金币。\n所选[oe_tu_march|e]#Y 10#!年内：边患#G −20#!，遭劫的损失减半，部队补充速度#G +10%#!；其辖区的边境地点防御#G +15%#!。#Y 10#!年内不能再修缮该边镇。"
 oe_tbd_levy_tt: "#R −50#!金币。\n所选[oe_tu_march|e]的治所新建#G 2#!个军区兵团；#Y 5#!年内边患#G −10#!，人力#G +10%#!。#Y 5#!年内不能再征募。"
 oe_tbd_hire_tt: "#R −40#!金币。\n所选[oe_tu_march|e]#Y 5#!年内：边患#G −15#!，陆军士气#G +5%#!；每年1月有#R 10%#!的可能佣兵滋事。#Y 5#!年内不能再雇。"
 oe_tbd_band_2: "#R 边患#!"
 oe_tbd_band_1: "#Y 边患#!"
 oe_tbd_band_0: "边患"
 OE_TBD_CARD_TT: "边患 [Country.MakeScope.GetVariable('oe_tbd_pressure').GetValue|0]（#Y 0#!到#Y 100#!），每月按辖区边境的外国邻国重算：\n与帝国交战的邻国 [Country.MakeScope.GetVariable('oe_tbd_n_war').GetValue|0] 个，每个#Y +40#!；\n与帝国为敌（互为宿敌，或对帝国好感不高于#Y −50#!）的邻国 [Country.MakeScope.GetVariable('oe_tbd_n_hostile').GetValue|0] 个，每个#Y +25#!；\n兵力强于本[oe_tu_march|e]的其他邻国 [Country.MakeScope.GetVariable('oe_tbd_n_strong').GetValue|0] 个，每个#Y +10#!；\n城堡、边军与佣兵 −[Country.MakeScope.ScriptValue('oe_tbd_cut')|0]（城堡#Y −20#!，边军#Y −10#!，佣兵#Y −15#!）。\n边患达到#Y 40#!起，每月有“边患÷5”%的可能出事：全帝国每月至多一件，每个边镇#Y 12#!个月内至多#Y 2#!件。"
 oe_tbd.1.t: "边境遭劫"
 oe_tbd.1.d1: "1332年和1333年，艾登侯国的乌穆尔（1334年起为埃米尔）率船队在爱琴海四处劫掠，袭击了内格罗蓬特岛和希腊本土。1334年前后，安德洛尼卡三世的军队在帖撒罗尼迦附近击退了一大股突厥劫掠者。1342年底或1343年初，乌穆尔率约三百艘船溯埃夫罗斯河而上，在色雷斯劫掠了几个月。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的人马越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]。城堡的守军挡住了大部分人，但城外的村子还是遭了殃。"
 oe_tbd.1.d2: "1332年和1333年，艾登侯国的乌穆尔（1334年起为埃米尔）率船队在爱琴海四处劫掠，袭击了内格罗蓬特岛和希腊本土。1334年前后，安德洛尼卡三世的军队在帖撒罗尼迦附近击退了一大股突厥劫掠者。1342年底或1343年初，乌穆尔率约三百艘船溯埃夫罗斯河而上，在色雷斯劫掠了几个月。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的人马越过边境，劫掠了[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]，烧了村舍，赶走了牲口。"
 oe_tbd.1.d: "1332年和1333年，艾登侯国的乌穆尔（1334年起为埃米尔）率船队在爱琴海四处劫掠，袭击了内格罗蓬特岛和希腊本土。1334年前后，安德洛尼卡三世的军队在帖撒罗尼迦附近击退了一大股突厥劫掠者。1342年底或1343年初，乌穆尔率约三百艘船溯埃夫罗斯河而上，在色雷斯劫掠了几个月。\n\n如今，一股劫掠者越过边境，洗劫了[SCOPE.sCountry('oe_tbd_ev_theme').GetName]境内的村庄。"
 oe_tbd.1.a1: "拨款赈济"
 oe_tbd.1.a1.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]：遭劫（轻）#Y 2#!年，最大控制力#R −5%#!，每月繁荣#R −0.25%#!。\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚#R −1#!，并计入忠诚目标#Y 5#!年。\n国库损失半个月的税收，另拨一个月的税收赈济。"
 oe_tbd.1.b1: "让当地自己收拾"
 oe_tbd.1.b1.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]：遭劫#Y 2#!年，最大控制力#R −10%#!，每月繁荣#R −0.5%#!。\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚#R −3#!，并计入忠诚目标#Y 5#!年。\n国库损失半个月的税收。"
 oe_tbd.1.a2: "拨款赈济"
 oe_tbd.1.a2.tt: "城堡挡住了大部分劫掠者，损失减半。\n劫掠没有在当地留下长久的损失。\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚不变。\n国库损失四分之一个月的税收，另拨一个月的税收赈济。"
 oe_tbd.1.b2: "让当地自己收拾"
 oe_tbd.1.b2.tt: "城堡挡住了大部分劫掠者，损失减半。\n[SCOPE.sLocation('oe_tbd_ev_loc').GetName]：遭劫（轻）#Y 2#!年，最大控制力#R −5%#!，每月繁荣#R −0.25%#!。\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚#R −2#!，并计入忠诚目标#Y 5#!年。\n国库损失四分之一个月的税收。"
 oe_tbd.2.t: "边民内迁"
 oe_tbd.2.d1: "安德洛尼卡二世在位时，奥斯曼人在小亚细亚步步推进，大批难民涌入帝国的欧洲行省。1343到1345年间，突厥兵一再劫掠色雷斯乡间，君士坦丁堡一度缺粮。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]接连遭劫，农户们赶着牲口往内地逃。"
 oe_tbd.2.d: "安德洛尼卡二世在位时，奥斯曼人在小亚细亚步步推进，大批难民涌入帝国的欧洲行省。1343到1345年间，突厥兵一再劫掠色雷斯乡间，君士坦丁堡一度缺粮。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的边村接连遭劫，农户们赶着牲口往内地逃。"
 oe_tbd.2.a: "任其迁往内地"
 oe_tbd.2.a.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]：边村空虚#Y 5#!年，人口增长#R −0.5%#!，最大控制力#R −5%#!。"
 oe_tbd.2.b: "发放种子，免税招还"
 oe_tbd.2.b.tt: "国库支出#Y 2#!个月的税收。农户回到边村。"
 oe_tbd.2.c: "派兵押回"
 oe_tbd.2.c.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚#R −2#!，并计入忠诚目标#Y 5#!年。\n[SCOPE.sLocation('oe_tbd_ev_loc').GetName]：押回的农户#Y 2#!年，叛乱度#R +0.5#!。"
 oe_tbd.3.t: "边境投诚"
 oe_tbd.3.d1: "莫姆契尔是个保加利亚人。1341年以前，他带人投靠安德洛尼卡三世当佣兵，后来又去了塞尔维亚，为斯特凡·杜尚效力，手下聚起两千人。1343年，坎塔库泽努斯把罗多彼山中的梅罗佩地区交给他治理。1344年夏，他宣布自立，以克桑西为治所；1345年7月7日，他战死在佩里瑟奥里翁。\n\n如今，一队来自[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的兵士越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]，愿为帝国效力。"
 oe_tbd.3.d: "莫姆契尔是个保加利亚人。1341年以前，他带人投靠安德洛尼卡三世当佣兵，后来又去了塞尔维亚，为斯特凡·杜尚效力，手下聚起两千人。1343年，坎塔库泽努斯把罗多彼山中的梅罗佩地区交给他治理。1344年夏，他宣布自立，以克桑西为治所；1345年7月7日，他战死在佩里瑟奥里翁。\n\n如今，一队外国兵士越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]，愿为帝国效力。"
 oe_tbd.3.a: "编入[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的军中"
 oe_tbd.3.a.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：在治所新建#Y 1#!个军区兵团（兵种随时代）。"
 oe_tbd.3.b: "送往君士坦丁堡"
 oe_tbd.3.b.tt: "人力#G +3#!个月的人力增长。"
 oe_tbd.3.c: "拒之门外"
 oe_tbd.3.c.tt: "没有影响。"
 oe_tbd.4.t: "击退劫掠"
 oe_tbd.4.d1: "帝国的边防靠边境的城堡拖住来犯之敌，等待大军赶到。十三世纪下半叶起，各地的小辖区由凯法勒兼管军政，治所常是一座城堡（kastron）。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的人马越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]。新修的城堡关上了城门，守军在城头放箭，劫掠者没抢到什么就退走了。"
 oe_tbd.4.d: "帝国的边防靠边境的城堡拖住来犯之敌，等待大军赶到。十三世纪下半叶起，各地的小辖区由凯法勒兼管军政，治所常是一座城堡（kastron）。\n\n如今，一股劫掠者越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]。新修的城堡关上了城门，劫掠者没抢到什么就退走了。"
 oe_tbd.4.a: "犒赏守军"
 oe_tbd.4.a.tt: "国库支出#Y 1#!个月的税收。\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚#G +3#!，并计入忠诚目标#Y 5#!年。"
 oe_tbd.4.b: "上报朝廷，表彰边功"
 oe_tbd.4.b.tt: "威望#G +5#!。"
 oe_tbd.5.t: "佣兵滋事"
 oe_tbd.5.d: "1304年，加泰罗尼亚佣兵团在小亚细亚的库济库斯一带花光了两三倍的军饷，四处抢掠。1305年4月30日，佣兵团首领罗杰·德·弗洛尔在阿德里安堡被杀，佣兵团随后在色雷斯劫掠了两年。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_theme').GetName]雇来的外族佣兵嫌军饷太少，在乡间抢粮闹事。"
 oe_tbd.5.a: "国库加饷"
 oe_tbd.5.a.tt: "国库支出#Y 2#!个月的税收。"
 oe_tbd.5.b: "让[SCOPE.sCountry('oe_tbd_ev_theme').GetName]自己摆平"
 oe_tbd.5.b.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]：忠诚#R −5#!，并计入忠诚目标#Y 5#!年。"
 oe_tbd.5.c: "遣散佣兵"
 oe_tbd.5.c.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]失去“外族佣兵”：边患不再#Y −15#!。"
 oe_tbd.9.t: "边防：执行"
 oe_tbd.1.d1_pre: "1332年和1333年，艾登侯国的乌穆尔（1334年起为埃米尔）率船队在爱琴海四处劫掠，袭击了内格罗蓬特岛和希腊本土。1334年前后，安德洛尼卡三世的军队在帖撒罗尼迦附近击退了一大股突厥劫掠者。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的人马越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]。城堡的守军挡住了大部分人，但城外的村子还是遭了殃。"
 oe_tbd.1.d2_pre: "1332年和1333年，艾登侯国的乌穆尔（1334年起为埃米尔）率船队在爱琴海四处劫掠，袭击了内格罗蓬特岛和希腊本土。1334年前后，安德洛尼卡三世的军队在帖撒罗尼迦附近击退了一大股突厥劫掠者。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的人马越过边境，劫掠了[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]，烧了村舍，赶走了牲口。"
 oe_tbd.1.d_pre: "1332年和1333年，艾登侯国的乌穆尔（1334年起为埃米尔）率船队在爱琴海四处劫掠，袭击了内格罗蓬特岛和希腊本土。1334年前后，安德洛尼卡三世的军队在帖撒罗尼迦附近击退了一大股突厥劫掠者。\n\n如今，一股劫掠者越过边境，洗劫了[SCOPE.sCountry('oe_tbd_ev_theme').GetName]境内的村庄。"
 oe_tbd.2.d1_pre: "安德洛尼卡二世在位时，奥斯曼人在小亚细亚步步推进，大批难民涌入帝国的欧洲行省。1305到1307年间，加泰罗尼亚佣兵团以加里波利为据点劫掠色雷斯，还招来突厥人助战，乡间的农户纷纷逃进城里。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]接连遭劫，农户们赶着牲口往内地逃。"
 oe_tbd.2.d_pre: "安德洛尼卡二世在位时，奥斯曼人在小亚细亚步步推进，大批难民涌入帝国的欧洲行省。1305到1307年间，加泰罗尼亚佣兵团以加里波利为据点劫掠色雷斯，还招来突厥人助战，乡间的农户纷纷逃进城里。\n\n如今，[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的边村接连遭劫，农户们赶着牲口往内地逃。"
 oe_tbd.3.d1_pre: "1301年，约一万名阿兰人带着家眷渡过多瑙河，请求为帝国效力。安德洛尼卡二世收编了他们；次年他们随米海尔九世出征小亚细亚，却没能挡住突厥人。\n\n如今，一队来自[SCOPE.sCountry('oe_tbd_ev_foe').GetName]的兵士越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]的[SCOPE.sLocation('oe_tbd_ev_loc').GetName]，愿为帝国效力。"
 oe_tbd.3.d_pre: "1301年，约一万名阿兰人带着家眷渡过多瑙河，请求为帝国效力。安德洛尼卡二世收编了他们；次年他们随米海尔九世出征小亚细亚，却没能挡住突厥人。\n\n如今，一队外国兵士越过边境，来到[SCOPE.sCountry('oe_tbd_ev_theme').GetName]，愿为帝国效力。"
