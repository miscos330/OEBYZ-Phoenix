l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_ent_tier_steady: "帝国熵增一档：稳态有序"
 STATIC_MODIFIER_DESC_oe_ent_tier_steady: "帝国五维熵值维持在30以下，疆域、财政、边藩与军务运转井然；连续保持120个月（10年）将迎来「罗马和平 / 盛世永安」永久皇冠里程碑。"
 STATIC_MODIFIER_NAME_oe_ent_tier_pressure: "帝国熵增二档：承压运转"
 STATIC_MODIFIER_DESC_oe_ent_tier_pressure: "帝国五维熵值升至30–54：庞大的疆域、物价或战事已开始侵蚀税效与行省直控，宜及早通过大区整顿、稳币改革或休养生息压降熵值。"
 STATIC_MODIFIER_NAME_oe_ent_tier_crisis: "帝国熵增三档：危机警戒"
 STATIC_MODIFIER_DESC_oe_ent_tier_crisis: "帝国五维熵值高达55–79：行政衰减、边疆离心与通胀风险同步积聚，赋税、兵源与统治合法性明显下滑，随时可能诱发截税、通胀或行省骚动危机。"
 STATIC_MODIFIER_NAME_oe_ent_tier_decay: "帝国熵增四档：帝国衰朽边缘"
 STATIC_MODIFIER_DESC_oe_ent_tier_decay: "帝国五维熵值突破80：中央政令难及远疆，军费膨胀、税基萎缩、行省分离倾向飙升！唯有大刀阔斧推行结构性改制与休养生息，方能逆转帝国衰朽。"
 STATIC_MODIFIER_NAME_oe_ent_pax_imperialis: "罗马和平 / 盛世永安"
 STATIC_MODIFIER_DESC_oe_ent_pax_imperialis: "在坐拥150地以上庞大疆域的条件下连续10年将帝国五维熵值稳控在30以下，海内晏然、律法划一、商旅通衢；此后正向月度熵增速率永久削减25%。"
 STATIC_MODIFIER_NAME_oe_ent_mod_currency_reform: "币制稳银改革"
 STATIC_MODIFIER_DESC_oe_ent_mod_currency_reform: "回收劣币、整顿铸币纯度并设平准准备金，显著对冲维度2货币与白银通胀压力（维度2每月−0.65），代价是短期商贸收缩与市民不满。"
 STATIC_MODIFIER_NAME_oe_ent_mod_admin_inspect: "行政大区整顿与御史巡察"
 STATIC_MODIFIER_DESC_oe_ent_mod_admin_inspect: "遣御史与近卫巡察使核查行省税册、轮换边疆督军，同时大幅对冲维度1疆域过伸（−0.60/月）与维度3总督军阀化（−0.50/月），代价是贵族怨怼与军务磨合成本。"
 STATIC_MODIFIER_NAME_oe_ent_mod_tolerance_charter: "普世宽容与自治盟邦敕令"
 STATIC_MODIFIER_DESC_oe_ent_mod_tolerance_charter: "以帝国敕令保障异教社群礼俗与边疆自治盟邦权责，强力平抑维度4文化与宗教过载（−0.60/月）与分离主义，代价是保守教士阶层离心与宗教影响下滑。"
 STATIC_MODIFIER_NAME_oe_ent_mod_amnesty_peace: "休养生息大赦令"
 STATIC_MODIFIER_DESC_oe_ent_mod_amnesty_peace: "承平之际大赦逋赋、减免军徭并遣散冗兵，令维度5多线征战与霸权疲劳迅速清零（和平期额外−0.80/月），代价是短期税效与陆军战备松弛。"
 STATIC_MODIFIER_NAME_oe_ent_mod_silver_shock: "白银价格革命冲击"
 STATIC_MODIFIER_DESC_oe_ent_mod_silver_shock: "巨量域外贵金属涌入推高粮价与军饷，商路流转虽一时繁盛，通胀与陆军维持费却令国库捉襟见肘。"
 STATIC_MODIFIER_NAME_oe_ent_mod_satrap_defiance: "边藩总督截税风波"
 STATIC_MODIFIER_DESC_oe_ent_mod_satrap_defiance: "远疆总督借边防军需之名截留赋税，换来地方豪强暂安，中央岁入与行省直控却明显受损。"
 STATIC_MODIFIER_NAME_oe_ent_mod_provincial_turmoil: "异文化行省骚动"
 STATIC_MODIFIER_DESC_oe_ent_mod_provincial_turmoil: "高压征派激化了未同化行省的抵触情绪，地方分离主义抬头、征兵与维稳成本随之攀升。"
 STATIC_MODIFIER_NAME_oe_ent_mod_great_reform_triumph: "大一统中兴改制"
 STATIC_MODIFIER_DESC_oe_ent_mod_great_reform_triumph: "痛下决心清理积弊、重整税册与官僚体系，帝国重获高效内阁与财税活力，守旧贵族则仍心怀芥蒂。"
 STATIC_MODIFIER_NAME_oe_ent_mod_yuan_baochao_guard: "大元宝钞平准准备金司"
 STATIC_MODIFIER_DESC_oe_ent_mod_yuan_baochao_guard: "中书省设平准司以白银铜钱锚定至正新钞，有效压制通胀并活络海陆互市，但商帮特权与盐铁税效略有让渡。"
 STATIC_MODIFIER_NAME_oe_ent_mod_rus_guberniya_audit: "沙俄行省枢密审计令"
 STATIC_MODIFIER_DESC_oe_ent_mod_rus_guberniya_audit: "以枢密参议院统辖诸省总督并核查边疆哥萨克军籍，行省控制与兵源大振，代价是旧波雅尔勋贵抵制与行政开销增加。"
 oe_ent_dec_currency_reform.title: "帝国熵增反制：币制稳银改革"
 oe_ent_dec_currency_reform.desc: "收兑劣币、重铸高成色本位币并建立国库平准准备金：立即降低帝国熵值8点并压降通胀，10年内大幅对冲维度2货币与白银通胀压力（−0.65/月）；代价：金币220、市民阶层不满与短期商贸收缩。"
 oe_ent_dec_currency_reform.a: "颁行币制稳银改革敕令"
 oe_ent_dec_admin_inspect.title: "帝国熵增反制：行政大区整顿与御史巡察"
 oe_ent_dec_admin_inspect.desc: "遣御史与近卫巡察使核查行省税册并轮换边疆督军：立即降低帝国熵值10点（拜占庭/罗马额外提升总督区忠诚），10年内同步对冲维度1疆域过伸（−0.60/月）与维度3总督军阀化（−0.50/月）；代价：金币200、稳定−4与贵族不满。"
 oe_ent_dec_admin_inspect.a: "派遣御史巡察使整顿大区"
 oe_ent_dec_tolerance_charter.title: "帝国熵增反制：普世宽容与自治盟邦敕令"
 oe_ent_dec_tolerance_charter.desc: "向异文化与异教行省颁赐宗教宽容与自治盟邦特许：立即降低帝国熵值8点，10年内大幅对冲维度4文化与宗教过载（−0.60/月）并压低分离主义；代价：金币160、威望10与教士阶层不满。"
 oe_ent_dec_tolerance_charter.a: "颁赐普世宽容与自治盟邦敕令"
 oe_ent_dec_amnesty_peace.title: "帝国熵增反制：休养生息大赦令"
 oe_ent_dec_amnesty_peace.desc: "仅限和平时期颁行：大赦逋赋、遣散冗兵并抚恤民力，立即清零久战计数、大幅降低厌战度并削减帝国熵值12点，6年内和平期额外加速降熵（−0.80/月）；代价：金币180、威望12与短期税效及陆军士气下降。"
 oe_ent_dec_amnesty_peace.a: "颁布天下大赦、休养生息"
 OE_PILLARS_ENTROPY: "熵增"
 OE_PILLARS_ENTROPY_DESC: "打开帝国熵增可视化仪表盘：实时检视五维月度熵增账簿、近卫大区与总督区减负明细，并一键推行4项主动反制敕令。"
 OE_ENT_UI_TITLE: "帝国熵增总览"
 OE_ENT_UI_MODAL_TITLE: "帝国熵增可视化仪表盘"
 OE_ENT_UI_MODAL_CLOSE_TT: "关闭帝国熵增仪表盘悬浮窗。"
 OE_ENT_UI_STATE_ACTIVE: "#G 引擎运行中#!"
 OE_ENT_UI_STATE_STANDBY: "#medium 待机（未满门槛）#!"
 OE_ENT_UI_STATE_TT: "帝国熵增引擎在疆域达到150地（拜占庭/罗马/大元/俄罗斯）或200地（其他独立大帝国）、或罗马重负启动后自动激活；开局规则设为轻量模式时保持关闭。"
 OE_ENT_UI_BANNER_SUB: "五维透明月度账簿 · 零隐藏惩罚 · 连稳120月加冕「盛世永安」"
 OE_ENT_UI_BAR_LEFT: "0稳态"
 OE_ENT_UI_BAR_MID: "帝国熵增指数（0–100）"
 OE_ENT_UI_BAR_RIGHT: "100衰朽"
 OE_ENT_UI_BAR_TIERS: "刻度档位：0–29稳态有序 | 30–54承压运转 | 55–79危机警戒 | 80+帝国衰朽边缘"
 OE_ENT_UI_KPI_IDX: "当前熵值"
 OE_ENT_UI_KPI_IDX_TT: "帝国综合熵值（0–100）。每月末按五维净变化滚动更新，并同步唯一一档帝国熵增修正。"
 OE_ENT_UI_KPI_DELTA: "月度净变化"
 OE_ENT_UI_KPI_DELTA_TT: "五维月度熵增净和（绿降红升）。硬核规则下正向增长+35%；获得「盛世永安」后正向增长永久−25%。"
 OE_ENT_UI_KPI_PAX: "盛世永安进度"
 OE_ENT_UI_KPI_PAX_DONE: "#color_yellow 盛世永安已加冕#!"
 OE_ENT_UI_KPI_PAX_TT: "连续保持帝国熵值低于30满120个月（10年）且领土≥150地即可加冕「罗马和平 / 盛世永安」，永久削减25%正向月度熵增。"
 OE_ENT_UI_DIM_TITLE: "五维月度压力明细"
 OE_ENT_UI_D1: "维度1：疆域超载"
 OE_ENT_UI_D1_TT: "疆域过伸与行政衰减：超出150地后的领土规模推高月度熵增；可借近卫大区、总督区、迁都/双都、大元中书省、沙俄省制及「御史巡察」（−0.60/月）强力对冲。"
 OE_ENT_UI_D2: "维度2：货币通胀"
 OE_ENT_UI_D2_TT: "货币与白银价格革命冲击：高通胀（≥5%/10%/20%）、赤字举债与1550年后白银波动推高此项；可借大元宝钞/白银新政及「币制稳银改革」（−0.65/月）对冲。"
 OE_ENT_UI_D3: "维度3：军区离心"
 OE_ENT_UI_D3_TT: "边藩与总督军阀化压力：低忠军区/总督区与军务大区推高此项，文官大区可减压；非罗马大帝国由低稳定度触发；可借「御史巡察」（−0.50/月）对冲。"
 OE_ENT_UI_D4: "维度4：文化宗教"
 OE_ENT_UI_D4_TT: "多元帝国文化与宗教过载：宗教统一偏低（<80%/65%/50%）与超大版图推高此项；可借罗马化进程与「宽容宪章」（−0.60/月）强力平抑。"
 OE_ENT_UI_D5: "维度5：连年征战"
 OE_ENT_UI_D5_TT: "多线征战与霸权疲劳：战时、高厌战与连战≥36月持续升熵；和平期基础−2.00/月，高稳定（≥50）额外−1.00/月，「大赦休兵」再加−0.80/月。"
 OE_ENT_UI_MIT_TITLE: "治理减负与单轨合流账簿"
 OE_ENT_UI_MIT_REL: "近卫大区减负"
 OE_ENT_UI_MIT_REL_TT: "由帝国近卫大区政务院及12古典管区提供的月度行政减负快照（纯O(1)月度缓存，直接抵扣维度1疆域超载）。"
 OE_ENT_UI_MIT_CIV: "文官大区"
 OE_ENT_UI_MIT_CIV_TT: "已建文官元老型近卫大区数量：兼顾更高行政减负并直接压低维度3军区离心。"
 OE_ENT_UI_MIT_MIL: "军务大区"
 OE_ENT_UI_MIT_MIL_TT: "已建军务总督型近卫大区数量：强化边防军力，但会小幅增加维度3边藩离心，宜配合巡察或文官大区平衡。"
 OE_ENT_UI_MIT_LOY: "低忠军区/藩镇"
 OE_ENT_UI_MIT_LOY_TT: "当前忠诚档位偏低（≤1档）的军区与总督区数量快照（上限计4，每座使维度3每月+0.30）。"
 OE_ENT_UI_AR_MERGED: "已与「罗马重负」单轨合流：共享唯一熵增档位，零双重惩罚"
 OE_ENT_UI_AR_MERGED_TT: "帝国熵增已接管「罗马重负」帝国疲惫读数，并自动移除旧版疲惫修正，确保绝不叠加双重惩罚。"
 OE_ENT_UI_MIT_NOTE: "通用减压路径：保持和平（基础−2.0/月）与高稳定≥50（额外−1.0/月）是最稳健的降熵主轴；拜占庭/罗马可借近卫大区与总督区、大元可借中书省与宝钞新政、沙俄可借行省枢密改革长期锁低熵值。"
 OE_ENT_UI_ACT_TITLE: "主动反制敕令（一键直达）"
 OE_ENT_UI_BTN_CURRENCY: "币制稳银（−8熵）"
 OE_ENT_UI_BTN_CURRENCY_TT: "立即推行「币制稳银改革」（与国家决议同源）：需独立、金币≥220、无10年冷却、且通胀≥4%或熵值≥25。效果：熵值−8、压降通胀、10年内维度2每月−0.65（代价：金币220与市民不满）。"
 OE_ENT_UI_BTN_INSPECT: "御史巡察（−10熵）"
 OE_ENT_UI_BTN_INSPECT_TT: "立即推行「行政大区整顿与御史巡察」（与国家决议同源）：需独立、金币≥200、稳定≥0、无10年冷却、且熵值≥20。效果：熵值−10、总督区忠诚+10、10年内维度1−0.60/月与维度3−0.50/月（代价：金币200、稳定−4与贵族不满）。"
 OE_ENT_UI_BTN_TOLERANCE: "宽容宪章（−8熵）"
 OE_ENT_UI_BTN_TOLERANCE_TT: "立即推行「普世宽容与自治盟邦敕令」（与国家决议同源）：需独立、金币≥160、威望≥10、无10年冷却、且熵值≥20。效果：熵值−8、10年内维度4每月−0.60并降分离主义（代价：金币160、威望10与教士不满）。"
 OE_ENT_UI_BTN_AMNESTY: "大赦休兵（−12熵）"
 OE_ENT_UI_BTN_AMNESTY_TT: "立即推行「休养生息大赦令」（与国家决议同源）：需独立且处于和平、金币≥180、威望≥12、无6年冷却、且熵值≥15。效果：熵值−12、清零久战计数、大降厌战、6年内和平额外−0.80/月（代价：金币180、威望12与短期税效/士气下降）。"
 OE_ENT_UI_ACT_HINT: "按钮置灰表示引擎待机、冷却未满、处于战时或资源/门槛不足；亦可跳转决议页查看详情。"
 OE_ENT_UI_BTN_DECISIONS: "打开决议页"
 OE_ENT_UI_BTN_DECISIONS_TT: "跳转至国家决议面板查看全部熵增反制与帝国决议。"
 OE_ENT_UI_ROADMAP_TITLE: "帝国体量门槛 · 熵增解锁路线图"
 OE_ENT_UI_ROADMAP_PROG_LBL: "当前直辖领土进度（解锁门槛：150处）"
 OE_ENT_UI_ROADMAP_PROG_TT: "帝国熵增引擎在直辖领土达到150处（拜占庭/罗马/大元/俄罗斯）或200处（其他独立大帝国）、或进入罗马重负局势后于次月自动激活；轻量规则下保持关闭。"
 OE_ENT_UI_ROADMAP_SUB: "开局尚处中小体量阶段，帝国熵增暂处待机（零惩罚）；达到150处领土门槛后将自动切入顶部主标签并启动全套五维治理机制："
 OE_ENT_UI_ROADMAP_B1: "• #Y 行政过载监测#!：按月透明核算疆域超载、货币通胀、军区离心、文化宗教与连年征战五维压力，绝无隐藏惩罚。"
 OE_ENT_UI_ROADMAP_B2: "• #Y 腐败与边疆熵增对策#!：解锁币制稳银、御史巡察、宽容宪章与大赦休兵4项主动反制敕令，连稳120月加冕「盛世永安」。"
 OE_ENT_UI_ROADMAP_B3: "• #Y 行省分权减熵敕令#!：近卫大区政务院、总督区与罗马化进程直接抵扣月度熵增，并与「罗马重负」单轨合流零双罚。"
 OE_ENT_UI_JUMP_COURT: "前往《琼筵序次》"
 OE_ENT_UI_JUMP_COURT_TT: "跳转至开局即可使用的《琼筵序次》页面，任免七大宫廷官职、笼络豪族并扩充帝国元老院席位。"
 OE_ENT_UI_JUMP_EDICTS: "前往《帝国政令》"
 OE_ENT_UI_JUMP_EDICTS_TT: "跳转至开局即可使用的《行政令》页面，颁布军事、财政与皇权敕令。"
 oe_ent.1.t: "盛世之下的暗流：帝国熵增初显"
 oe_ent.1.d: "随着帝国版图跨越百城千邑，御前度支与枢密院的账簿上开始显现难以忽视的滞重：远疆文书往返日久、通胀与军费蚕食岁入、边藩大员渐生离心、异教异俗行省磨合吃力，连年征战更令国力透支。\n\n然而大帝国的衰朽绝非宿命——每一分帝国熵增皆源自疆域、货币、边藩、文化与征战五项可查之账，亦可借近卫大区、币制改革、巡察整顿、宽容敕令与休养生息主动化解。若能稳控低熵满十年，帝国更将迎来「罗马和平 / 盛世永安」的永世冠冕。"
 oe_ent.1.a: "即刻清丈税册与御前审计，防微杜渐"
 oe_ent.1.a.tt: "金币#R −120#!、稳定#G +2#!，帝国熵值#G −6#!。"
 oe_ent.1.b: "向地方勋贵与总督适度放权以缓和燃眉之急"
 oe_ent.1.b.tt: "金币#R −40#!、贵族满意度小幅提升，帝国熵值#G −3#!。"
 oe_ent.1.c: "维持现行旧章，暂观五维账簿变化"
 oe_ent.1.c.tt: "威望#G +5#!，帝国熵值#R +2#!。"
 oe_ent.2.t: "白银价格革命与帝国币制冲击"
 oe_ent.2.d: "来自跨洋航路与远疆矿脉的白银源源不断涌入各大口岸，叠加连年军费透支与成色参差的劣币流通，谷价与军饷一路飞涨。度支大臣急奏：若不趁早收兑劣币、重定本位或整顿关贸，通胀将持续推高帝国五维熵增中的货币重压。\n\n是咬牙动用国库存金重铸高成色稳币、向商帮加征临时平准关税，还是听任市价自发消化这股白银洪流？"
 oe_ent.2.a: "动用国库重铸高成色稳币并收兑劣币"
 oe_ent.2.a.tt: "金币#R −240#!、通胀下降、帝国熵值#G −8#!。"
 oe_ent.2.b: "向口岸商帮加征平准关税以缓冲物价波动"
 oe_ent.2.b.tt: "市民阶层不满，承受[ShowModifier('oe_ent_mod_silver_shock')]（#Y 8年#!），帝国熵值#G −3#!。"
 oe_ent.2.c: "放任铸币税与市价自由浮动，先充盈眼前国库"
 oe_ent.2.c.tt: "金币#G +120#!、通胀上升，承受[ShowModifier('oe_ent_mod_silver_shock')]（#Y 8年#!），帝国熵值#R +6#!。"
 oe_ent.3.t: "边疆总督截税与军阀化危机"
 oe_ent.3.d: "数座远离京畿的边防重镇传回令人震怒的密报：当地手握兵权的边疆总督与大员以「边墙修缮与欠饷补发」为名，公然截留本应解送中央的春秋两税，并私自募兵扩编亲卫！史书上无数盛极而衰的帝国，皆始于外重内轻、藩镇尾大不掉。\n\n陛下是铁腕遣使查账轮换边将、暂以包税妥协息事宁人，还是召聚枢密院与大区重臣共议分权界限？"
 oe_ent.3.a: "铁腕遣巡察使核查并强制轮换边疆督军"
 oe_ent.3.a.tt: "金币#R −180#!、稳定#R −4#!、贵族不满，帝国熵值#G −10#!（拜占庭/罗马额外提升总督区忠诚）。"
 oe_ent.3.b: "默许地方包税特权，换取边疆暂不生变"
 oe_ent.3.b.tt: "金币#R −60#!，承受[ShowModifier('oe_ent_mod_satrap_defiance')]（#Y 6年#!），帝国熵值#R +4#!。"
 oe_ent.3.c: "召开枢密院与地方代表共商分权安抚"
 oe_ent.3.c.tt: "金币#R −100#!、威望#R −8#!，帝国熵值#G −5#!。"
 oe_ent.4.t: "异文化行省骚动与认同考题"
 oe_ent.4.d: "横跨多种语言、律法与信仰的广袤疆域正在经受严峻磨合：数个新附与异教行省因税吏苛扰、教派摩擦与语言隔阂爆发联名抗议，地方集市罢市、征兵文书受阻，维度4的文化与宗教过载压力陡然升高。\n\n面对多元帝国的永恒考题，朝廷是颁赐自治盟邦与宗教宽容特许、斥资兴办官学与驿道加速文化交融，还是派驻强军高压征收？"
 oe_ent.4.a: "颁赐宗教宽容与地方自治盟邦特许状"
 oe_ent.4.a.tt: "金币#R −140#!、教士不满，帝国熵值#G −8#!。"
 oe_ent.4.b: "拨款兴建帝国官学与驿道，推进深度文教融合"
 oe_ent.4.b.tt: "金币#R −220#!、稳定#R −3#!，帝国熵值#G −10#!。"
 oe_ent.4.c: "派驻重兵强行征派，以威慑弹压地方骚动"
 oe_ent.4.c.tt: "金币#G +80#!，承受[ShowModifier('oe_ent_mod_provincial_turmoil')]（#Y 6年#!），帝国熵值#R +6#!。"
 oe_ent.5.t: "帝国衰朽大改革大考"
 oe_ent.5.d: "警钟响彻宫廷！帝国五维熵值已逼近衰朽临界，财税漏卮、边将专擅、物价失衡与民生疲敝交织成一场牵动国祚的系统性危机。往昔靠缝缝补补维系的旧体制已走到尽头——历史上的伟大王朝，唯在此刻断腕革新者方能续命百年，讳疾忌医者终将分崩离析。\n\n陛下是否愿付出沉重政治与财政代价发动「大一统中兴改制」，以换取彻底扭转熵增狂潮，还是与各阶层折中立约，抑或拖延苟安？"
 oe_ent.5.a: "断腕推行「大一统中兴改制」，彻底清丈税政与整军"
 oe_ent.5.a.tt: "金币#R −350#!、稳定#R −10#!、贵族重度不满，通胀下降，帝国熵值#G −25#!并获[ShowModifier('oe_ent_mod_great_reform_triumph')]（#Y 20年#!）。"
 oe_ent.5.b: "与各阶层及行省代表缔结折中宪约，减负止血"
 oe_ent.5.b.tt: "金币#R −200#!、威望#R −15#!、厌战度下降，帝国熵值#G −15#!。"
 oe_ent.5.c: "维持旧制并加派临时横征，暂避正面冲突"
 oe_ent.5.c.tt: "稳定#R −4#!、威望#R −10#!，帝国熵值#R +5#!。"
 oe_ent.6.t: "罗马和平 / 盛世永安加冕"
 oe_ent.6.d: "整整十年！在统御一百五十城以上广袤疆域的浩大尺度下，帝国连续一百二十个月将五维熵值稳稳压制在三十以下：行省法度井然、币制坚挺如山、边疆将帅效命、万民各安其业。\n\n史官提笔铭记这一跨越时代的治世丰碑——无论是昔日奥古斯都的「罗马和平」，还是汉唐盛世的「永安大治」，此刻皆化作永恒皇冠加诸帝国之上！此后一切正向熵增压力都将永久削减四分之一。"
 oe_ent.6.a: "昭告万邦「盛世永安」纪元开启，以德威定鼎四方"
 oe_ent.6.a.tt: "永久获得[ShowModifier('oe_ent_pax_imperialis')]（正向月度熵增永久#G −25%#!），威望#G +25#!、合法性#G +15#!，帝国熵值#G −10#!。"
 oe_ent.6.b: "以十年大治盈余充实平准国库、颁行商旅永安敕"
 oe_ent.6.b.tt: "永久获得[ShowModifier('oe_ent_pax_imperialis')]（正向月度熵增永久#G −25%#!），金币#G +250#!、稳定#G +8#!，帝国熵值#G −10#!。"
 oe_ent.7.t: "大元大一统治理：行省、宝钞与白银平准"
 oe_ent.7.d: "中兴之后的大元横跨漠北草原、中原腹地与江南海港，版图之宏大亘古罕见。然而中书省御史近日上疏指出：行省万里遥制、宝钞信用与域外白银流转若失衡，便会令大一统帝国重蹈至正末年的财政与地方失控覆辙。\n\n大汗陛下是敕设「宝钞平准准备金司」以白银稳钞抑胀、遣御史台大员巡察诸行省整肃吏治，还是因俗而治、稳持草原与汉地双轨旧章？"
 oe_ent.7.a: "敕设「大元宝钞平准准备金司」，以白银稳钞抑胀"
 oe_ent.7.a.tt: "金币#R −200#!、市民微不满，通胀下降，帝国熵值#G −12#!并获[ShowModifier('oe_ent_mod_yuan_baochao_guard')]（#Y 15年#!）。"
 oe_ent.7.b: "遣中书省与御史台巡察诸行省，严核岁赋军籍"
 oe_ent.7.b.tt: "金币#R −150#!、稳定#R −3#!、威望#G +10#!，帝国熵值#G −10#!。"
 oe_ent.7.c: "恪守草原与中原分治旧章，以静制动"
 oe_ent.7.c.tt: "稳定#G +4#!，帝国熵值#G −4#!。"
 oe_ent.8.t: "沙俄大一统治理：省制审计与边疆哥萨克整编"
 oe_ent.8.d: "自莫斯科白石克里姆林向东跨过伏尔加、乌拉尔与无垠草原，全罗斯沙皇的疆土正以惊人速度延展。随之而来的却是万里补给线、旧式衙门（Prikaz）职权交错，以及边疆哥萨克军团既善征战又难驯服的治理难题。\n\n沙皇陛下是推行「行省枢密审计令」统整全国总督辖区、向边疆哥萨克颁赐自治军屯特许以守边减负，还是暂依传统波雅尔杜马稳步过渡？"
 oe_ent.8.a: "颁行「沙俄行省枢密审计令」，统整诸省总督与税籍"
 oe_ent.8.a.tt: "金币#R −200#!、贵族不满，帝国熵值#G −12#!并获[ShowModifier('oe_ent_mod_rus_guberniya_audit')]（#Y 15年#!）。"
 oe_ent.8.b: "向边疆哥萨克军团颁赐自治军屯敕令，以边守边"
 oe_ent.8.b.tt: "金币#R −120#!、稳定#R −2#!、威望#G +10#!，帝国熵值#G −9#!。"
 oe_ent.8.c: "暂循波雅尔杜马与旧衙门旧例，缓图渐改"
 oe_ent.8.c.tt: "稳定#G +4#!，帝国熵值#G −4#!。"
 oe_ent.20.t: "帝国熵增：抉择生效"
 oe_ent.90.t: "帝国熵增：五维透明读数面板"
 oe_ent.90.d: "#T 帝国熵增总览（槽位65）#!\n当前熵值#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_index')|0]#!/100  当前档位#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_tier')|0]#!（1稳态/2承压/3警戒/4衰朽）  月度净变化#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_delta')|2]#!\n连续低熵(<30)#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_low_m')|0]#!/120月  盛世永安#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_pax')|0]#!  当前领土#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_locs')|0]#!  连战月数#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_war_m')|0]#!\n规则档位#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_rule')|0]#!（0轻量/1标准/2硬核+35%）  罗马重担合流#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_ar_sync')|0]#!（合流时自动移除双罚）\n\n#T 五维月度压力明细（纯O(1)透明账簿）#!\n维度1（疆域过伸与行政衰减）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_d1')|2]#!/月\n维度2（货币与白银通胀冲击）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_d2')|2]#!/月\n维度3（边藩与总督军阀化）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_d3')|2]#!/月\n维度4（文化与宗教过载）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_d4')|2]#!/月\n维度5（多线征战与霸权疲劳）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_d5')|2]#!/月\n\n#T 主动反制与跨线减负#!\n已生效反制决议数#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_cntrs')|0]#!/4  近卫大区减负#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_prf_rel')|2]#!  罗马总督区#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_exarchs')|0]#!  罗马化进度#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ent_rd_assim')|0]#!"
 oe_ent.90.a: "关闭"
 oe_ent.90.b: "刷新读数"
