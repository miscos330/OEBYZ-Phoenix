l_simp_chinese:
 oe_nf_land: "豪族拥有土地"
 oe_nf_industry: "豪族控制产业"
 OE_NF_NO_TERRITORIES: "该家族尚无控制地点。"
 OE_NF_EXPANSION_RULES: "完成收回豪族特权后，自动扩张永久停用。此前每五年向相邻的东罗马直属地点扩张一次；若没有据点，则随机选择一处合格的直属地点。受反垄断保护的省份永不再受豪族控制。影响力大于100且不超过400时，消耗50点额外扩张一次；大于400时，消耗150点额外扩张两次。无法完成额外扩张时不扣影响力。农村仅容一家，非农村可容不同家族，阿索斯山除外。"
