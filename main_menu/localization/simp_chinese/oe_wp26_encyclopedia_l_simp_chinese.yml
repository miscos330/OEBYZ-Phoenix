# Project Phoenix v30.0 WP26-B — Compliant Era Soundtrack Playlists & Bilingual Historical Encyclopedia. Generated by gen_v300_wp26_encyclopedia_and_music.py; edit the generator, not this file.
 oe_wp26_bio_none:0 ""
 game_concept_oe_wp26_enc_532_justinian_i:0 "查士丁尼一世（482—565）"
 game_concept_oe_wp26_enc_532_justinian_i_desc:0 "弗拉维乌斯·佩特鲁斯·萨巴提乌斯·查士丁尼生于伊利里亚的陶雷西乌姆，在舅父查士丁一世提携下于527年登基为东罗马皇帝，立志重整罗马法统、弥合教会分歧并收复地中海故土。532年1月平定尼卡暴动并与萨珊君主霍斯劳一世缔结《永久和约》后，他相继遣贝利撒留与纳尔塞斯西征，从汪达尔人手中光复北非，自东哥特人手中收回意大利，并克复伊比利亚南部海岸。\n\n尽管查士丁尼大瘟疫与波斯战火反复消耗国力，其最深远的功业仍在典章与营造：他敕纂《国法大全》集罗马千年法学之大成，又在焦土之上重建圣索菲亚大教堂，使君士坦丁堡稳居古典晚期欧亚文明的巅峰。"
 game_concept_oe_wp26_enc_532_theodora:0 "狄奥多拉皇后（约500—548）"
 game_concept_oe_wp26_enc_532_theodora_desc:0 "狄奥多拉出身君士坦丁堡竞技场演艺世家，嫁与查士丁尼一世并加冕奥古斯塔后，成为古典晚期最具政治手腕的共治皇后。532年1月尼卡暴动席卷京师、群臣力劝渡海出逃之际，她以「紫袍乃最体面的裹尸布」一语震慑御前，力主死守皇宫，终使政权转危为安。\n\n临政期间，她推动立法保障妇女财产权与婚姻权益、严惩强迫卖淫，同时在帝国东部暗中庇护一性论主教，巧妙维系叙利亚与埃及等富庶行省对君士坦丁堡的政治向心，与查士丁尼的正统宗教路线相辅相成。"
 game_concept_oe_wp26_enc_532_belisarius:0 "弗拉维乌斯·贝利撒留（约500—565）"
 game_concept_oe_wp26_enc_532_belisarius_desc:0 "贝利撒留是公元六世纪东罗马帝国最杰出的野战统帅。530年达拉之战中，他以精妙壕沟阵地与重装铁骑反击大破兵力占优的萨珊波斯大军，声震两河。532年协助平定尼卡暴动后，他于533年仅率一万五千精锐渡海远征北非，连战连捷于十里驿与特里卡马鲁姆，一役覆灭汪达尔王国。\n\n随后挥师意大利，连克西西里、那不勒斯、罗马与拉文纳，在兵寡援绝的绝境下死守罗马城逾一年之久。纵然屡遭宫廷猜忌与增援掣肘，他始终恪守臣节，晚年更于559年梅兰蒂亚斯之战临危出山，击退逼近帝都的库特里古尔骑兵。"
 game_concept_oe_wp26_enc_532_gen_narses:0 "贵族统帅纳尔塞斯（478—573）"
 game_concept_oe_wp26_enc_532_gen_narses_desc:0 "纳尔塞斯出身亚美尼亚宦官，历任皇室司库与大内侍，深得查士丁尼一世与狄奥多拉皇后倚重，亦是史册罕见的大器晚成名将。532年尼卡暴动危局中，他孤身携重金潜入竞技场策反蓝党，瓦解叛军联盟，为贝利撒留一举清场创造先机。\n\n七十四岁高龄之际，他获授全权与充足军费接掌意大利战局，巧合罗马主力与伦巴第、赫鲁利雇佣骑兵，先于552年塔吉奈之战阵斩东哥特名王托提拉，复于554年沃尔图诺河歼灭南下劫掠的法兰克—阿勒曼尼联军，为帝国奠定拉文纳统治基业。"
 game_concept_oe_wp26_enc_532_tribonian:0 "大法学家特里波尼安（约485—542）"
 game_concept_oe_wp26_enc_532_tribonian_desc:0 "特里波尼安出身潘菲利亚，藏书宏富、博通罗马历代律典，官至查士丁尼一世御前司法大臣（圣宫财政法务官），是帝国全面编纂法典的核心主持者。528年奉诏参与修律后，他旋即领衔编撰《学说汇纂》，仅用三年便从两千余卷古典法学家著述中去芜存菁，熔铸为体系严密的五十卷法典。\n\n此外，他还主持修订《法学阶梯》教科书与534年新版《查士丁尼法典》。虽于532年尼卡暴动期间一度被罢官以平众怒，事平后即获复用，直至542年大瘟疫中病逝前始终执掌帝国立法枢纽。"
 game_concept_oe_wp26_enc_532_john_cappadocian:0 "卡帕多西亚的约翰（约490—548后）"
 game_concept_oe_wp26_enc_532_john_cappadocian_desc:0 "卡帕多西亚的约翰于531至541年间出任东方近卫大区长官，是支撑查士丁尼一世连年西征与宏大营建的理财总管。他虽不以古典修辞见长，却精于稽核账目与精简冗员，大力裁撤冗余驿传与行省闲职，并率先以希腊语取代拉丁语颁布日常政令，大幅提升行政效率。\n\n他雷厉风行的税赋整顿为圣索菲亚重建与北非远征筹足巨饷——尽管他本人曾因军费浩繁力谏慎行——却也招致元老贵族与狄奥多拉皇后切齿痛恨，终在541年的宫廷政争中失势流放。"
 game_concept_oe_wp26_enc_532_khosrow_i:0 "霍斯劳一世·阿努希尔万（501—579）"
 game_concept_oe_wp26_enc_532_khosrow_i_desc:0 "萨珊波斯大王霍斯劳一世被伊朗史册尊为「阿努希尔万」（意为不朽之魂）。531年嗣位后，他于532年与东罗马签订《永久和约》换取休整，随即将帝国从马兹达克动乱中重塑一新：丈量田亩推行定额货币税、编练常备骑兵、将全国划分为东西南北四大军区以分权制衡。\n\n他文治武功兼擅，外交上联手突厥汗国覆灭嚈哒帝国，西线屡次在叙利亚与拉齐卡重创罗马防线；同时广纳雅典学院流亡的希腊哲人与印度医算学者于贡德沙普尔学宫，开创萨珊波斯的黄金盛世。"
 game_concept_oe_wp26_enc_532_emperor_wu_liang:0 "梁武帝萧衍（464—549）"
 game_concept_oe_wp26_enc_532_emperor_wu_liang_desc:0 "南梁开国皇帝萧衍于502年取代南齐定鼎建康，在位近半个世纪，缔造了南朝文治与江南文化最璀璨的鼎盛时代。早年他以骁将起家、整饬法度并兴办五馆太学，中晚年则笃信佛法、屡次舍身同泰寺，并亲涉经学、音律、书画与诗文，使建康成为东亚文脉渊薮。\n\n治下天监至大同盛世使梁朝国势一度远胜分裂的北魏，海上遣使远通扶南与天竺；然而晚年纵容宗室勋贵、轻信降将侯景，终在548至549年的侯景之乱中令台城陷落、江南繁华毁于一旦。"
 game_concept_oe_wp26_enc_532_chen_qingzhi:0 "白袍名将陈庆之（484—539）"
 game_concept_oe_wp26_enc_532_chen_qingzhi_desc:0 "陈庆之早年不过是萧衍身边的书僮棋伴，身形清瘦、不善弓马，却凭借沉着机变与严明军纪跃升为南北朝最传奇的战阵奇才。大通三年（529年），他奉命仅率七千身披白袍的精锐护送北魏北海王元颢北返，自淮河一路势如破竹。\n\n百余日间历战四十七合、连克三十二城，竟以孤军长驱直入北魏帝都洛阳，令北方豪强传唱「名师大将莫自牢，千兵万马避白袍」。虽因尔朱荣大军反扑被迫南撤，其晚年镇守淮北屡挫东魏，依然威震江淮。"
 game_concept_oe_wp26_enc_532_gao_huan:0 "渤海王高欢（496—547）"
 game_concept_oe_wp26_enc_532_gao_huan_desc:0 "高欢出身怀朔镇鲜卑化汉人军户，深谙六镇豪杰习俗与北地胡汉纠葛。532年他在韩陵之战以少胜多击溃尔朱氏联军，入主洛阳、旋即扶立东魏迁都邺城，自己坐镇军事重镇晋阳遥控朝政，成为华北东半壁无可撼动的霸主。\n\n高欢深谋远虑，以「鲜卑兵为汉人耕战、汉人供粟帛养鲜卑兵」调和胡汉矛盾，为日后北齐立国奠定根基。他与宇文泰围绕沙苑、邙山、玉壁展开的十余年铁血争锋，深刻塑造了东西魏对峙与隋唐统一的北方格局。"
 game_concept_oe_wp26_enc_532_yuwen_tai:0 "安定公宇文泰（507—556）"
 game_concept_oe_wp26_enc_532_yuwen_tai_desc:0 "宇文泰出身武川镇鲜卑豪族，534年接掌关陇贺拔岳旧部并迎立魏孝武帝西入长安，以地瘠民寡的关中一隅抗衡兵强马壮的东魏高欢。537年沙苑之战中，他以不足万人伏击大破高欢十余万大军，就此稳固西魏基业。\n\n比战场胜负更为深远的是他的制度创造：他创立府兵制与八柱国十二大将军体系，采苏绰《六条诏书》仿《周礼》设六官，将胡汉豪强熔铸为影响中国此后三百年的「关陇军事贵族集团」，直接孕育了北周、隋朝与盛唐的帝国骨架。"
 game_concept_oe_wp26_enc_532_gelimer:0 "汪达尔王盖利默（480—553）"
 game_concept_oe_wp26_enc_532_gelimer_desc:0 "盖利默是北非迦太基汪达尔—阿兰王国的末代君主。530年，他在阿利乌斯派旧贵族支持下废黜亲近东罗马的堂兄希尔德里克自立，却恰好给了查士丁尼一世出师问罪的绝佳口实。\n\n533年秋，正值汪达尔精锐主力远调撒丁岛平叛之际，贝利撒留突袭登陆北非。盖利默在十里驿分兵失期、又于特里卡马鲁姆兵败国破，退守帕普阿山巅熬过寒冬后终告投降。在君士坦丁堡凯旋式上，他仰望查士丁尼御座喃喃吟诵「虚空的虚空」，最终获赐加拉太庄园善终。"
 game_concept_oe_wp26_enc_532_amalasuntha:0 "东哥特女王阿玛拉逊莎（约495—535）"
 game_concept_oe_wp26_enc_532_amalasuntha_desc:0 "阿玛拉逊莎是东哥特大帝狄奥多里克才华卓绝的爱女。526年其父逝世后，她以摄政太后之尊辅佐幼王阿塔拉里克治理意大利，精通拉丁、希腊与哥特三语，竭力延续拉文纳宫廷「哥特武力护卫罗马元老文治」的精妙平衡，并与查士丁尼一世保持密切邦交。\n\n然而她执意让幼王接受罗马古典教育，招致保守哥特贵族强烈抵制。534年阿塔拉里克早逝后，她邀堂兄狄奥达哈德共治，却在535年遭其背叛囚杀于博尔塞纳湖心岛，由此引爆长达二十年的查士丁尼哥特光复战争。"
 game_concept_oe_wp26_enc_532_kaleb_aksum:0 "阿克苏姆王卡莱布（约514—540在位）"
 game_concept_oe_wp26_enc_532_kaleb_aksum_desc:0 "阿克苏姆国王卡莱布（古埃塞俄比亚碑铭称埃拉·阿茨贝哈）将东北非基督教帝国推向红海海权巅峰。525年，为声援惨遭希木叶尔王祖·努瓦斯迫害的纳季兰基督徒，卡莱布依托东罗马商船支援亲率大军横渡曼德海峡，一举征服南阿拉伯并将也门纳入阿克苏姆势力范围。\n\n查士丁尼一世曾屡遣使节游说卡莱布借红海—印度洋航路绕开萨珊波斯的丝绸垄断。晚年卡莱布主动禅位，将王冠敬献耶路撒冷圣墓教堂并隐修终老，被埃塞俄比亚教会尊为圣徒。"
 game_concept_oe_wp26_enc_532_yashodharman:0 "摩腊婆王耶输达曼（活跃于528—540）"
 game_concept_oe_wp26_enc_532_yashodharman_desc:0 "耶输达曼出身中印度摩腊婆的奥利卡拉王室，坐镇乌贾因与达沙普拉。六世纪初古典笈多帝国在阿尔浑匈人铁骑冲击下日渐倾颓之际，耶输达曼挺身而出，于约528年联合笈多残部迎战凶名赫赫的匈王密希拉古拉，一战大破强敌，彻底终结阿尔浑匈人对恒河平原的霸权。\n\n其立于松达尼的宏伟胜利石柱铭文自豪宣称威加布拉马普特拉河至阿拉伯海、喜马拉雅山至东高止山脉。虽其霸业随身逝而散，但这一关键胜仗保全了北印度古典学术与城市文明的延续。"
 game_concept_oe_wp26_enc_lm_hagia_sophia:0 "圣索菲亚大教堂与查士丁尼穹顶"
 game_concept_oe_wp26_enc_lm_hagia_sophia_desc:0 "532年1月尼卡暴动焚毁狄奥多西旧堂后，查士丁尼一世即召数学家特拉勒斯的安提米乌斯与米利都的伊西多尔，立誓兴建前所未有的圣智大教堂。工程仅历时五年便告竣工，于537年12月祝圣落成：其借帆拱承托的巨大穹顶如金链悬天，底座四十扇高窗倾泻天光，堂内遍布采自色萨利、弗里吉亚与埃及的斑斓大理石与金箔马赛克。\n\n近千年间，圣索菲亚既是普世牧首座堂与东罗马皇帝加冕圣殿，亦在1453年后深刻启发了奥斯曼古典穹顶建筑艺术，堪称横跨欧亚文明的永恒建筑丰碑。"
 game_concept_oe_wp26_enc_lm_corpus_juris_civilis:0 "《国法大全》（《查士丁尼法典》）"
 game_concept_oe_wp26_enc_lm_corpus_juris_civilis_desc:0 "查士丁尼一世于529至534年间敕令特里波尼安等人编纂的《国法大全》，将罗马共和国晚期至拜占庭初年的浩瀚法学文献熔为四部严密体系：汇编历代皇帝敕令的《查士丁尼法典》、精选古典法学家释义的五十卷《学说汇纂》、供法学院研习的《法学阶梯》，以及多以希腊文颁布的《新律》。\n\n这部巨著抢救了盖尤斯、帕比尼安与乌尔比安等法学大师的传世精髓，不仅维系东罗马千年法治，更自中世纪博洛尼亚法学复兴以来，深远塑造了近现代欧洲大陆、拉丁美洲乃至东亚的民法典传统。"
 game_concept_oe_wp26_enc_lm_theodosian_walls:0 "君士坦丁堡狄奥多西三重城墙"
 game_concept_oe_wp26_enc_lm_theodosian_walls_desc:0 "狄奥多西陆墙始建于408至413年近卫长官安提米乌斯任内，并于447年大地震后增筑外墙与宽阔护城壕，绵延六公里纵贯马尔马拉海至金角湾，将君士坦丁堡铸就为中世纪欧亚大陆最坚不可摧的钢铁堡垒。石灰岩与红砖相间的三重梯度防线配以九十六座棱角箭塔，使攻城器械难以近身。\n\n逾千年间，阿瓦尔人、萨珊波斯、阿拉伯哈里发舰队、保加利亚沙皇与罗斯远征军皆折戟于此，直至1453年奥斯曼超级攻城重炮昼夜轰击利库斯河谷防段，方才撕裂这道守护新罗马千载的石砌天堑。"
 game_concept_oe_wp26_enc_1204_theodore_laskaris:0 "狄奥多尔一世·拉斯卡里斯（约1175—1221）"
 game_concept_oe_wp26_enc_1204_theodore_laskaris_desc:0 "狄奥多尔一世·拉斯卡里斯乃拜占庭皇室女婿，1204年十字军攻破君士坦丁堡时曾率众血战御敌。城破之际他渡海退入比提尼亚，依托尼西亚与布尔萨收拢流亡贵族、军士与正教神职，并于1208年由流亡普世牧首加冕为皇帝，在小亚细亚西部擎起罗马正统薪火。\n\n面对西北拉丁帝国与东南罗姆苏丹国的两面夹击，他在1211年迈安德河畔安条克之战中亲手斩杀塞尔柱苏丹凯霍斯鲁一世，一战稳固尼西亚帝国国本，为后世1261年光复君士坦丁堡铺平道路。"
 game_concept_oe_wp26_enc_1204_baldwin_i:0 "君士坦丁堡的鲍德温一世（1172—1205）"
 game_concept_oe_wp26_enc_1204_baldwin_i_desc:0 "佛兰德伯爵鲍德温九世（兼埃诺伯爵六世）是第四次十字军中声望最著的法兰西北部诸侯。1204年4月十字军攻陷并洗劫君士坦丁堡、按《罗马尼亚帝国瓜分条约》分封各邦后，法威联合选举团忌惮蒙费拉托侯爵博尼法斯的野心，遂推举素以虔敬著称的鲍德温出任拉丁帝国开国皇帝。\n\n1204年5月16日他在圣索菲亚加冕，却只接手了一座财竭人空、强敌环伺的残破皇都。次年4月，他轻率进击保加利亚沙皇卡洛扬与库曼骑兵联军，在阿德里安堡惨败被俘，最终幽死于特尔诺沃囚塔之中。"
 game_concept_oe_wp26_enc_1204_enrico_dandolo:0 "威尼斯总督恩里科·丹多洛（约1107—1205）"
 game_concept_oe_wp26_enc_1204_enrico_dandolo_desc:0 "恩里科·丹多洛于1192年以逾八旬高龄且几近失明之躯当选威尼斯总督，却凭冷峻果决的政治铁腕改写了地中海格局。当第四次十字军无力偿付威尼斯造船巨债时，他步步运筹，先驱使十字军攻占亚得里亚海叛城扎达尔，继而借护送流亡王子之名将兵锋直指宿敌君士坦丁堡。\n\n攻城之际，年近九旬的丹多洛亲乘旗舰冲向金角湾海墙，战后为威尼斯夺得原拜占庭帝国八分之三的精要海港、克里特岛与爱琴海贸易霸权，奠定「海外领地」数百年基业，并于1205年病逝后安葬于圣索菲亚大教堂。"
 game_concept_oe_wp26_enc_1204_kaloyan:0 "保加利亚沙皇卡洛扬（约1170—1207）"
 game_concept_oe_wp26_enc_1204_kaloyan_desc:0 "卡洛扬（约安尼察）是复兴保加利亚第二帝国的阿森三兄弟幼弟，兼擅外交折冲与草原骑战。1204年，他巧借与教宗英诺森三世的教会联合谈判换取西方承认其王冠与独立大主教区；面对初建的拉丁帝国，他本愿睦邻相安，却遭鲍德温一世傲慢索地并要求称臣。\n\n卡洛扬遂联合不满拉丁统治的色雷斯希腊贵族与剽悍的库曼轻骑，于1205年4月在阿德里安堡诱敌深入、全歼拉丁重骑主力并生擒鲍德温一世，彻底遏制拉丁帝国在巴尔干的扩张势头，直至1207年围攻塞萨洛尼基前夕遇刺身亡。"
 game_concept_oe_wp26_enc_1204_genghis_khan:0 "铁木真·成吉思汗（约1162—1227）"
 game_concept_oe_wp26_enc_1204_genghis_khan_desc:0 "1204年正值铁木真统一漠北草原的决胜之年：继兼并克烈部后，他于该年夏在纳忽昏山大破强大的乃蛮部，收降畏兀儿掌印官塔塔统阿并命其以回鹘字母拼写蒙古语，奠定帝国文书制度雏形。两年后的1206年，他在斡难河源大忽里勒台被诸部共尊为「成吉思汗」。\n\n他打破氏族藩篱，推行严密的十户、百户、千户、万户军政合一制度，颁行《大扎撒》法典、任人唯贤、广开驿站与宗教宽容，亲手锻造出横扫西夏、金朝与花剌子模的铁骑雄师，开启了重塑欧亚贸易与文化交流的蒙古帝国时代。"
 game_concept_oe_wp26_enc_1204_emperor_ningzong:0 "宋宁宗赵扩（1168—1224）"
 game_concept_oe_wp26_enc_1204_emperor_ningzong_desc:0 "南宋宁宗赵扩于1194年临安即位，在位三十年间江南市舶商贸繁盛、青瓷书画与朱子理学渐成正宗，然淮河防线与朝堂党争暗流涌动。1204年，权相韩侂胄顺应朝野复土呼声，追封抗金名将岳飞为鄂王，力主整军筹备「开禧北伐」。\n\n然而1206至1207年北伐因四川吴曦叛降与后勤失调而受挫，宁宗朝政旋即转入史弥远主导的守成和议，以「嘉定和议」换得江淮暂安与东南富庶延续，殊不知漠北蒙古铁骑已在北方悄然崛起。"
 game_concept_oe_wp26_enc_1204_philip_ii_augustus:0 "法兰西国王腓力二世·奥古斯都（1165—1223）"
 game_concept_oe_wp26_enc_1204_philip_ii_augustus_desc:0 "卡佩王朝君主腓力二世·奥古斯都是中世纪法兰西王权集权的关键奠基人，将原本局促于法兰西岛一隅的王室领地扩建为西欧头号强国。正值东方君士坦丁堡陷落的1204年，他在西线攻克险峻的加亚尔堡，一举从英王约翰手中夺回诺曼底、安茹、曼恩与图赖讷，重创安茹帝国。\n\n1214年布汶之战大败英格兰—韦尔夫—佛兰德联军奠定西欧霸权之外，他还修筑巴黎城墙与卢浮宫要塞、铺设京城石板街道、颁赐巴黎大学特许状，并以领薪王室行政官取代世袭封建领主，深刻重塑了法兰西国家形态。"
 game_concept_oe_wp26_enc_1204_pope_innocent_iii:0 "教宗英诺森三世（1161—1216）"
 game_concept_oe_wp26_enc_1204_pope_innocent_iii_desc:0 "英诺森三世原名洛塔里奥·迪·塞尼，曾于巴黎研习神学、博洛尼亚精修教会法，1198年就任教宗后将中世纪罗马教权推向历史顶峰。他自诩「基督之代理人」，以「太阳与月亮」喻教权高于王权，先后介入德意志帝位之争、对英法两王颁布绝罚与禁礼令，并使英格兰、阿拉贡与保加利亚等国君主向圣座称臣。\n\n1204年第四次十字军攻掠扎达尔与君士坦丁堡时，他虽曾严辞谴责并施以绝罚，事后仍试图借拉丁帝国实现东西教会合一；1215年他亲自主持第四次拉特兰大公会议，系统确立了中世纪天主教会的教义、圣事与修会改革蓝图。"
 game_concept_oe_wp26_enc_1204_michael_epirus:0 "伊庇鲁斯的米海尔一世（约1170—1215）"
 game_concept_oe_wp26_enc_1204_michael_epirus_desc:0 "米海尔一世·科穆宁·杜卡斯出身安杰洛斯皇族旁支，1204年君士坦丁堡陷落后初随蒙费拉托侯爵博尼法斯西行，旋即脱离十字军、以阿尔塔为都汇聚希腊流亡贵族与地方武力，在峻岭环抱的伊庇鲁斯、阿卡纳尼亚与埃托利亚建起独立的拜占庭流亡政权。\n\n他外与威尼斯灵活周旋通商，内则频频出击蚕食拉丁塞萨洛尼基王国，成功稳固伊庇鲁斯专制国基业，使其成为西巴尔干与尼西亚帝国分庭抗礼、竞逐光复君士坦丁堡大业的核心力量。"
 game_concept_oe_wp26_enc_1204_alexios_trebizond:0 "特拉比松大科穆宁阿莱克修斯一世（约1182—1222）"
 game_concept_oe_wp26_enc_1204_alexios_trebizond_desc:0 "阿莱克修斯一世·大科穆宁乃科穆宁末帝安德洛尼卡一世之孙，幼年流亡格鲁吉亚，由姑母塔玛尔女王抚养成人。1204年4月——就在君士坦丁堡被十字军攻破前夕——他借格鲁吉亚王师沿黑海南岸西进，一举光复本都商港特拉比松。\n\n他与胞弟大卫自号「大科穆宁」，建立特拉比松帝国。依托本都山脉天险与通往波斯、高加索的黑海商路，这一偏安东北角的罗马皇族王朝竟比君士坦丁堡本身更长寿，巍然屹立至1461年方告终结。"
 game_concept_oe_wp26_enc_lm_hippodrome_cistern:0 "君士坦丁堡竞技场与地下水宫"
 game_concept_oe_wp26_enc_lm_hippodrome_cistern_desc:0 "君士坦丁堡城市中轴矗立着两座相辅相成的罗马市政奇观：一为君士坦丁大帝扩建的皇家竞技场，既是战车竞逐之所，亦是自尼卡暴动以来市民欢呼皇帝与表达政见的公共广场；一为查士丁尼一世营建的巴西利卡地下水宫，以三百三十六根古典大理石柱撑起可储水八万立方米的地下巨库，保障帝都在长年围城中水源不绝。\n\n1204年十字军洗劫皇都时，竞技场中脊无数古铜杰作——包括后来安置于威尼斯圣马可教堂的青铜四骏——遭拆掠殆尽，唯方尖碑与幽深水宫历经拜占庭与奥斯曼王朝沧桑而长存。"
 game_concept_oe_wp26_enc_lm_nicaean_exile_citadel:0 "尼西亚流亡帝都城垣"
 game_concept_oe_wp26_enc_lm_nicaean_exile_citadel_desc:0 "依偎阿斯卡尼亚湖畔的尼西亚拥有长达五公里的双层砖石城垣与逾百座半圆箭塔，早年曾见证基督教史影响深远的第一次与第七次普世大公会议。1204年帝都沦陷后，狄奥多尔一世与约翰三世·瓦塔齐斯在此增修外墙与深壕，将尼西亚锻造为小亚细亚不可逾越的罗马正统堡垒。\n\n高墙之内汇聚了流亡普世牧首衙署、续铸成色精良金币的帝国造币厂与抢救古典希腊典籍的抄经院，直至1261年米海尔八世自此发兵重入君士坦丁堡黄金门，方完成流亡半世纪的复国使命。"
 game_concept_oe_wp26_enc_1453_constantine_xi:0 "君士坦丁十一世·巴列奥略（1405—1453）"
 game_concept_oe_wp26_enc_1453_constantine_xi_desc:0 "君士坦丁十一世·巴列奥略乃曼努埃尔二世与海伦娜·德拉加什之第四子。早年出任莫雷阿专制公期间，他重修科林斯地峡六里长墙并一度收复整个伯罗奔尼撒，展现出卓著军政才干。1449年1月在米斯特拉斯加冕后，面对四面楚歌、财库空虚的残破帝都，他断然拒绝交城退隐的优渥条件，决意与万城之皇共存亡。\n\n1453年春历时五十三天的围城血战中，他亲临圣罗曼诺斯门最危急的缺口，与热那亚名将朱斯蒂尼亚尼并肩督战。5月29日城破之际，他卸下紫袍皇徽拔剑冲入敌阵壮烈殉国，在后世希腊民间化为终将苏醒的「大理石皇帝」传说。"
 game_concept_oe_wp26_enc_1453_mehmed_ii:0 "征服者穆罕默德二世（1432—1481）"
 game_concept_oe_wp26_enc_1453_mehmed_ii_desc:0 "1451年以十九岁之龄再度登基的奥斯曼苏丹穆罕默德二世，兼具冷酷军工革新魄力与宏阔帝国视野。他抢筑博斯普鲁斯海峡的鲁梅利堡、延揽匈牙利铸炮师乌尔班浇铸巨型青铜重炮，并在围城僵局中奇谋陆路拖船越岭入驻金角湾，终在1453年5月29日攻克君士坦丁堡，获尊「征服者」（法提赫）并自承「罗马凯撒」称号。\n\n此后三十年间，他相继吞并塞尔维亚、莫雷阿、特拉比松与波斯尼亚，招徕各族工匠复兴伊斯坦布尔、颁行《苏丹法典》确立中央集权，并在托普卡匹宫廷礼遇希腊学者、波斯文人与威尼斯画师贝利尼。"
 game_concept_oe_wp26_enc_1453_yu_qian:0 "兵部尚书于谦（1398—1457）"
 game_concept_oe_wp26_enc_1453_yu_qian_desc:0 "于谦出身杭州清流，少作《石灰吟》明志，一生清廉刚正。正统十四年（1449年）土木堡之变爆发，明军主力覆没、英宗被俘，京师震动、朝议纷劝南迁之际，时任兵部侍郎的于谦力排众议怒斥南迁，拥立郕王朱祁钰即位以绝敌挟持之念，并星夜急调两京河南山东备操军二十二万拱卫京师。\n\n德胜门外血战中，他亲披甲胄、以神机营火器伏击重创瓦剌太师也先铁骑，力挽大明倾厦，战后更创编京营「团营」精兵制度。景泰八年（1457年）夺门之变英宗复辟后，于谦蒙冤遇害，抄家之时唯见御赐蟒衣剑器，清风亮节垂范千古。"
 game_concept_oe_wp26_enc_1453_jingtai:0 "明代宗景泰帝朱祁钰（1428—1457）"
 game_concept_oe_wp26_enc_1453_jingtai_desc:0 "明代宗朱祁钰乃明宣宗次子、英宗异母弟。1449年土木之变突发，他临危受命由郕王监国进而登基改元景泰，充分倚重兵部尚书于谦等干臣，指挥打赢京师保卫战、整编十二团营、修治黄河沙湾决口并安定边防，使危机四伏的大明迅速转危为安。\n\n然而1450年也先出人意料放还英宗后，南宫软禁与易储风波令兄弟猜忌愈深。1457年初景泰帝病重之际，石亨、徐有贞等发动「夺门之变」拥英宗复辟，景泰帝旋遭废为郕王并暴卒，成为明史最富悲剧色彩的守成之君。"
 game_concept_oe_wp26_enc_1453_zhu_qizhen:0 "明英宗朱祁镇（1427—1464）"
 game_concept_oe_wp26_enc_1453_zhu_qizhen_desc:0 "明英宗朱祁镇是明代唯一两度登基（正统、天顺）的皇帝。他幼年承继仁宣盛世，却宠信宦官王振，正统十四年（1449年）轻率亲征瓦剌，酿成精锐尽丧、大驾蒙尘的土木之变。此后他羁留草原一年，归京后又在南宫幽居七载，尝尽冷暖。\n\n1457年借夺门之变复辟改元天顺后，他虽错杀功臣于谦酿成大憾，晚年亦重用贤相李贤整饬吏治，临终更下诏永久废除自明初延续的宫妃殉葬旧制，留下复杂而矛盾的历史评价。"
 game_concept_oe_wp26_enc_1453_casimir_iv:0 "卡齐米日四世·雅盖隆（1427—1492）"
 game_concept_oe_wp26_enc_1453_casimir_iv_desc:0 "卡齐米日四世·雅盖隆自1440年主政立陶宛大公国、1447年兼任波兰国王，在位四十五载将雅盖隆双君主国推向中东欧霸主之位。1454年他响应普鲁士联盟请求出兵反抗条顿骑士团，历经艰苦的十三年战争，终凭1466年《第二次托伦和约》收复波美拉尼亚与格但斯克，为波兰重新打通波罗的海黄金出海口。\n\n外交上他促成长子弗拉迪斯拉夫相继入主波希米亚与匈牙利王位，使雅盖隆家族势力纵贯波罗的海至亚得里亚海；内政则颁布《涅沙瓦条例》，推动波兰中小贵族议会（瑟姆）走向制度化。"
 game_concept_oe_wp26_enc_1453_frederick_iii:0 "哈布斯堡皇帝腓特烈三世（1415—1493）"
 game_concept_oe_wp26_enc_1453_frederick_iii_desc:0 "腓特烈三世是最后一位在罗马由教宗亲手加冕的神圣罗马帝国皇帝（1452年），亦是统治长达五十三载的隐忍谋略家。1453年他正式批准《大特权》，将奥地利升格为大公国，并留下深奥而自负的帝国格言「A.E.I.O.U.」。\n\n尽管生前屡遭匈牙利名王马加什·科尔温压制、甚至一度痛失维也纳，他却以惊人耐心熬过所有强敌，更于1477年促成长子马克西米利安迎娶勃艮第女继承人玛丽，将富庶尼德兰纳入哈布斯堡囊中，开启了「他国征战，唯奥联姻」的世纪霸业。"
 game_concept_oe_wp26_enc_1453_cosimo_medici:0 "科西莫·德·美第奇（1389—1464）"
 game_concept_oe_wp26_enc_1453_cosimo_medici_desc:0 "科西莫·德·美第奇执掌欧洲首屈一指的美第奇金融帝国，自1434年结束流放重返佛罗伦萨后，始终不居公侯之名，却凭选举控盘与雄厚财力成为共和国实际主宰。他力排旧怨、果断联手米兰新主弗朗切斯科·斯福尔扎，促成1454年《洛迪和约》，为意大利半岛换来长达四十年的均势和平。\n\n在文化赞助上，他慷慨资助布鲁内莱斯基的圣母百花大教堂穹顶、多纳泰罗雕塑、圣马可公共图书馆以及斐奇诺的柏拉图学院，使佛罗伦萨成为文艺复兴璀璨心脏，逝后获共和国尊赠「国父」荣衔。"
 game_concept_oe_wp26_enc_1453_francesco_sforza:0 "弗朗切斯科·斯福尔扎（1401—1466）"
 game_concept_oe_wp26_enc_1453_francesco_sforza_desc:0 "弗朗切斯科·斯福尔扎是十五世纪意大利最具谋略的雇佣军统帅（孔多蒂埃雷）。他继承父辈武装并迎娶米兰公爵菲利波·马里亚的私生女比安卡，1447年维斯孔蒂绝嗣、安布罗西奥共和国陷入内忧外患之际，他先助米兰挫败威尼斯，继而围城迫降，于1450年受拥戴入主米兰公爵之位。\n\n他与科西莫·德·美第奇携手奠定1454年《洛迪和约》与意大利联盟格局，在伦巴第兴修运河、整顿税政、重建斯福尔扎城堡并广招学者工匠，将武力夺权成功转化为文艺复兴欧洲最井然璀璨的公国朝廷之一。"
 game_concept_oe_wp26_enc_1453_george_podebrady:0 "波杰布拉迪的伊日（1420—1471）"
 game_concept_oe_wp26_enc_1453_george_podebrady_desc:0 "波杰布拉迪的伊日是波希米亚温和圣杯派（胡斯派）领袖，自1452年起以王国摄政之尊平息历时数十载的宗教内战。1457年幼王遗腹子拉斯洛早逝后，波希米亚等级会议于1458年推选伊日为王，使其成为中世纪晚期西欧首位非天主教君主。\n\n他恪守《巴塞尔协定》，以「两派共主」宽容政策维系天主教与胡斯派共存，抵御教廷与匈牙利十字军压力；1464年他更向欧洲诸王递交了一份惊世骇俗的常设和平联盟条约草案，主张以仲裁法庭化解争端并共御外侮，堪称近代国际法先声。"
 game_concept_oe_wp26_enc_1453_esen_taishi:0 "瓦剌太师也先（1407—1455）"
 game_concept_oe_wp26_enc_1453_esen_taishi_desc:0 "也先于1439年承父脱欢之位执掌瓦剌绰罗斯部，继而东并漠南、西服哈密、联络女真，缔造了元廷北撤以来草原最强大的游牧联盟。1449年因明朝削减贡马赏赐，也先兵分四路大举南下，在土木堡一战歼灭明军精锐并生擒明英宗，震动东亚。\n\n然京师城下折戟于谦团营与火器防线后，他转于1450年放还英宗以挑动明廷内耗；1453年他更打破非黄金家族不得称汗的草原铁律自立为大元天圣大可汗，终因触怒诸部而在两年内死于内乱。"
 game_concept_oe_wp26_enc_1453_pachacuti:0 "印加圣王帕查库蒂（1438—1471在位）"
 game_concept_oe_wp26_enc_1453_pachacuti_desc:0 "印加圣王帕查库蒂原名库西·尤潘基，1438年在昌卡人兵临库斯科城下之际力挽狂澜、反败为胜，登基后尊号「帕查库蒂」（意为「重塑天地者」）。短短一代人内，他将原本偏居高原河谷的库斯科邦国扩建为纵贯安第斯山脉的「四方帝国」（塔万廷苏尤）。\n\n他既是杰出征伐者，更是规划大师：以美洲狮轮廓重修库斯科都城，营建萨克塞瓦曼巨石要塞与马丘比丘圣城，铺设贯通群山的印加皇家大道与信使驿站，并依托结绳记事、国家粮仓与米塔劳役制度支撑起美洲最精密的帝国行政。"
 game_concept_oe_wp26_enc_lm_forbidden_city:0 "北京紫禁城（故宫）"
 game_concept_oe_wp26_enc_lm_forbidden_city_desc:0 "北京紫禁城自明永乐四年（1406年）敕建、历时十四载集天下楠木汉白玉与金砖于永乐十八年（1420年）落成，此后五百年间先后作为明清两代二十四位帝王的皇宫。全城紧扣北京神圣中轴线，十米高墙与宽阔筒子河环抱九百八十座木构殿宇，以黄琉璃瓦、须弥座汉白玉台基与斗拱飞檐将天人合一的礼制秩序凝于空间。\n\n自外朝太和殿颁诏受贺、命将出师，至内廷乾清宫与军机处运筹万里，紫禁城始终是近世东亚最具象征意义与治理权威的帝国中枢。"
 game_concept_oe_wp26_enc_lm_grand_canal_huaian:0 "大运河与淮安清口水利枢纽"
 game_concept_oe_wp26_enc_lm_grand_canal_huaian_desc:0 "明永乐九年（1411年）疏通会通河后，全长一千八百公里的京杭大运河成为明清帝国维系都城运转的命脉，岁运江南漕粮四百万石北抵京师。全线最凶险的咽喉位于淮安清口——裹挟巨沙的黄河夺淮入海，与运河、淮水在此三水交汇。\n\n十六世纪治河名臣潘季驯在此筑高家堰蓄洪泽湖清水，创行「束水攻沙、蓄清刷黄」奇策。坐镇淮安的漕运总督与河道总督衙门岁岁统筹闸坝浚治，使清口枢纽成为前工业时代人类规模最宏伟的国家水利工程奇迹。"
 game_concept_oe_wp26_enc_lm_porcelain_tower:0 "南京大报恩寺琉璃塔"
 game_concept_oe_wp26_enc_lm_porcelain_tower_desc:0 "南京大报恩寺琉璃塔始建于永乐十年（1412年）、竣工于宣德六年（1431年），矗立于中华门外秦淮河畔。塔身九层八面、高近七十八米，通体以官窑烧制的五彩琉璃构件拼砌而成，檐角悬一百四十余盏长明琉璃灯与青铜风铃，白昼流光溢彩、入夜灯火通明。\n\n自十七世纪荷兰使团随员约翰·纽霍夫绘版传回西方以来，此塔在欧洲享誉「世界中古七大奇迹」之列，深刻风靡十八世纪欧陆「中国风」园林艺术，直至1856年毁于太平天国战火，依然铭刻在中西文化交流史册。"
 game_concept_oe_wp26_enc_1648_louis_xiv:0 "太阳王路易十四（1638—1715）"
 game_concept_oe_wp26_enc_1648_louis_xiv_desc:0 "1648年《威斯特伐利亚和约》确认法兰西夺取阿尔萨斯之际，年仅十岁的路易十四正亲历投石党叛乱震荡巴黎的危机，由此立誓绝不再让贵族与高等法院掣肘王权。1661年马扎然枢机逝世后他正式亲政，倚重财政重臣柯尔贝尔、陆军部长卢瓦与筑城奇才沃邦，铸就欧洲绝对君主制的典范。\n\n他营建凡尔赛宫以华丽宫廷礼仪驯服大贵族，令法语风靡全欧外交与艺术界；半世纪间历经四场全欧同盟大战，将法兰西疆界推进至斯特拉斯堡与弗朗什-孔泰，并终令波旁王孙入承西班牙王冠。"
 game_concept_oe_wp26_enc_1648_oliver_cromwell:0 "护国公奥利弗·克伦威尔（1599—1658）"
 game_concept_oe_wp26_enc_1648_oliver_cromwell_desc:0 "奥利弗·克伦威尔原为亨廷登郡乡绅，四十余岁方才投笔从戎，却以惊人组织天赋锻造出纪律严明的「铁骑军」并促成国会「新模范军」，在马斯顿荒原（1644）、纳斯比（1645）与普雷斯顿（1648）连克保王军主力，并于1649年1月推动审判并处决国王查理一世。\n\n1653年出任英格兰、苏格兰与爱尔兰联邦护国公后，他铁腕平定爱尔兰与苏格兰，颁行《航海条例》在第一次英荷战争中重创荷兰海商霸权，又远征夺占西属牙买加，深刻重塑了英国海权崛起与宪政演进之路。"
 game_concept_oe_wp26_enc_1648_prince_dorgon:0 "摄政王多尔衮（1612—1650）"
 game_concept_oe_wp26_enc_1648_prince_dorgon_desc:0 "睿亲王多尔衮乃清太祖努尔哈赤第十四子，智勇兼备、统驭八旗精锐。1643年皇太极猝逝后，他在诸王纷争中促成幼侄福临（顺治帝）嗣位，自己以摄政王总揽军政大权。1644年春李自成攻破北京之际，他当机立断接纳吴三桂乞师，于山海关一片石大破大顺军，定鼎燕京。\n\n入关之后，他一面遣八旗铁骑与降明绿营南下江南、西进关中，一面沿袭明朝六部官制、重开科举并安抚士绅，奠定大清入主中原大局；唯强推薙发令激起江南剧烈抗争，直至1650年喀喇城狩猎猝逝。"
 game_concept_oe_wp26_enc_1648_shunzhi:0 "清世祖顺治帝福临（1638—1661）"
 game_concept_oe_wp26_enc_1648_shunzhi_desc:0 "清世祖爱新觉罗·福临五岁嗣位于盛京，1644年10月移驻紫禁城，成为大清入关后的首位君主。1650年摄政王多尔衮病逝后，年仅十三岁的顺治帝果断亲政、削平睿王旧党，并在满洲八旗贵胄与汉族儒臣之间努力探求共治平衡。\n\n他敏而好学，精研汉文典籍书画，亲近德国耶稣会天文学家汤若望以修历法，1653年隆重迎请五世达赖喇嘛入京受封，严惩科场与吏治腐败。惜乎1661年染痘早逝，年仅二十四岁，临终托孤于幼子康熙。"
 game_concept_oe_wp26_enc_1648_yongli:0 "南明永历帝朱由榔（1623—1662）"
 game_concept_oe_wp26_enc_1648_yongli_desc:0 "南明永历帝朱由榔乃明神宗万历帝之孙，1646年底在广东肇庆称帝，维系了历时最长、疆域最广的南明抗清政权。1648年江西金声桓、广东李成栋相继反正归明，永历朝廷一度光复南方七省，声势大振，并曾遣使远赴罗马教廷求援。\n\n随后他与原大西军余部孙可望、李定国联合据守云贵十余载，与东南海上的郑成功遥相呼应。终因内讧消耗与清军三路合围，被迫流亡缅甸，于1662年遭缅方移交吴三桂殉难昆明，南明陆上正朔至此落幕。"
 game_concept_oe_wp26_enc_1648_zheng_chenggong:0 "延平郡王郑成功（1624—1662）"
 game_concept_oe_wp26_enc_1648_zheng_chenggong_desc:0 "郑成功生于日本平户，父为纵横东亚海域的海商巨擘郑芝龙。1646年其父降清后，郑成功痛哭焚儒服毅然决裂，因获南明隆武帝赐国姓朱而尊称「国姓爷」，受永历帝册封延平郡王。他以厦门、金门为基地编练铁人精军与无敌水师，掌控中日及南洋海上贸易命脉。\n\n1659年他亲率十余万大军溯长江北伐，兵临南京城下惜败而还；1661年转锋东渡台湾海峡，围攻热兰遮城九个月，终在1662年2月迫使荷兰东印度公司投降，收复台湾并建立东宁政权，名震中西海疆史。"
 game_concept_oe_wp26_enc_1648_li_dingguo:0 "晋王李定国（1621—1662）"
 game_concept_oe_wp26_enc_1648_li_dingguo_desc:0 "李定国早年为张献忠大西军骁将，1647年张献忠战死后，他毅然摒弃流寇旧习、尊奉南明永历正朔，严明军纪、秋毫无犯，成为晚明抗清战场上最令清廷胆寒的柱石名将。\n\n1652年他率军东出桂林、北克衡州，先逼死清定南王孔有德，复于衡阳城外阵斩敬谨亲王尼堪，创下「两蹶名王、天下震动」的辉煌战绩，受封晋王。虽因孙可望内讧降清导致战略崩盘，他仍率残部护驾转战滇缅绝域，1662年闻永历帝殉难悲愤呕血而逝，临终犹嘱子部「宁死荒徼，无降也」。"
 game_concept_oe_wp26_enc_1648_shah_jahan:0 "莫卧儿皇帝沙贾汗（1592—1666）"
 game_concept_oe_wp26_enc_1648_shah_jahan_desc:0 "莫卧儿帝国第五代皇帝沙贾汗（原名胡拉姆王子，1628—1658在位）意为「世界之王」，将莫卧儿王朝的富庶与建筑艺术推向巅峰。1648年，他正式迁都新建的宏伟帝都沙贾汗纳巴德（旧德里），营建红堡、贾玛清真寺与缀满珍宝的孔雀宝座，更在阿格拉为爱妃穆塔兹·玛哈尔修筑举世无双的白色大理石泰姬陵。\n\n对外他慑服德干诸苏丹国并屡次远征巴尔赫与坎大哈；1657年卧病引发四子夺嫡血战，最终被三子奥朗则布囚于阿格拉堡八角塔中，晚年日日遥望泰姬陵直至辞世。"
 game_concept_oe_wp26_enc_1648_great_elector:0 "大选帝侯腓特烈·威廉（1620—1688）"
 game_concept_oe_wp26_enc_1648_great_elector_desc:0 "1640年三十年战争焦土之中继位的勃兰登堡—普鲁士选帝侯腓特烈·威廉，在1648年《威斯特伐利亚和约》中赢得后波美拉尼亚、马格德堡与明登等要地，更痛定思痛决意打造永不再受外军蹂躏的强兵富国。1653年他与容克贵族达成妥协，建立由中央消费税供养的常备军。\n\n1657至1660年间他巧借北方大战摆脱波兰对东普鲁士的宗主权，1675年费尔贝林之战大破瑞典名军获尊「大选帝侯」；1685年又颁布《波茨坦敕令》广纳两万法国胡格诺工商业难民，为后世普鲁士王国奠定军政与经济双基。"
 game_concept_oe_wp26_enc_1648_tsar_alexis:0 "沙皇阿列克谢一世（1629—1676）"
 game_concept_oe_wp26_enc_1648_tsar_alexis_desc:0 "罗曼诺夫王朝第二代沙皇、彼得大帝之父阿列克谢·米哈伊洛维奇素有「最宁静沙皇」之称，然其在位期间正是俄国剧烈转型的关键三十年。面对1648年莫斯科盐税暴动，他召集全俄缙绅会议于1649年颁行《会议法典》，确立长达近两世纪的帝国法制与农奴制度框架。\n\n对外他在1654年《佩列亚斯拉夫尔条约》中接纳哥萨克归附，经十三年俄波大战凭1667年《安德鲁索沃停战协定》夺取斯摩棱斯克、左岸乌克兰与基辅，并东拓西伯利亚直抵太平洋；内政则历经尼康牧首宗教改革分裂与拉辛起义，为彼得大帝改革铺垫基石。"
 game_concept_oe_wp26_enc_1648_queen_christina:0 "瑞典女王克里斯蒂娜（1626—1689）"
 game_concept_oe_wp26_enc_1648_queen_christina_desc:0 "瑞典「北方雄狮」古斯塔夫二世·阿道夫独女克里斯蒂娜是十七世纪欧洲学识最渊博、性情最奇特的君主之一。她力排老宰相奥克森谢纳的主战之议，积极促成1648年《威斯特伐利亚和约》，为瑞典赢得西波美拉尼亚、维斯马与不来梅-费尔登，在终结三十年战火的同时稳固了瑞典波罗的海霸权。\n\n她将斯德哥尔摩打造成「北方雅典」，延请哲人笛卡尔与欧陆学者汇聚宫廷；却于1654年震惊欧洲地主动禅位予表兄卡尔十世，皈依天主教并移居罗马，终生以艺术、歌剧与学术赞助人名闻天下。"
 game_concept_oe_wp26_enc_1648_khmelnytsky:0 "盖特曼博格丹·赫梅利尼茨基（1595—1657）"
 game_concept_oe_wp26_enc_1648_khmelnytsky_desc:0 "博格丹·赫梅利尼茨基出身受过耶稣会教育的罗斯小贵族与扎波罗热哥萨克军官。1648年春，他高举反抗波兰—立陶宛大贵族压迫的大旗，巧联克里米亚汗国骑兵，在黄水河、科尔孙与皮利亚夫齐接连重创波兰王军主力，光复第聂伯河流域并建立自治的哥萨克盖特曼国。\n\n面对波兰反扑与克里米亚盟友反复无常，他在1654年《佩列亚斯拉夫尔协定》中率哥萨克归附俄国沙皇阿列克谢一世，此举彻底逆转了东欧力量天平，标志波兰—立陶宛联邦由盛转衰、俄罗斯向黑海与欧洲腹地迈进的关键转折。"
 game_concept_oe_wp26_enc_1648_tokugawa_iemitsu:0 "江户幕府将军德川家光（1604—1651）"
 game_concept_oe_wp26_enc_1648_tokugawa_iemitsu_desc:0 "德川家光是江户幕府第三代将军、德川家康之孙，自诩「天生将军」，亲手完成了维系日本两百五十余年太平的幕藩制度体系。1635年他修订《武家诸法度》正式确立「参勤交代」制度，令诸国大名轮番赴江户觐见并将妻室留质城下，既削弱藩镇财力，亦催生江户繁华与五街道商贸。\n\n1638年平定岛原之乱后，他颁布严密海禁（锁国令），将对外交往严格收束于长崎出岛（荷兰与华商）、对马（朝鲜）、萨摩（琉球）与松前（虾夷）四口，在明清易代的东亚巨变中独保日本安稳。"
 game_concept_oe_wp26_enc_lm_versailles:0 "凡尔赛宫"
 game_concept_oe_wp26_enc_lm_versailles_desc:0 "凡尔赛宫原为路易十三的红砖狩猎行宫，经路易十四延请建筑师勒沃、芒萨尔、画师勒布伦与造园大师勒诺特尔数十载精雕细琢，于1682年成为法兰西王室与中枢政府驻地。长达七十三米的镜厅、严谨几何对称的法式御苑与精密水力喷泉，以无可匹敌的视觉威仪象征太阳王驾驭自然与贵族的绝对秩序。\n\n其风范令波茨坦无忧宫、维也纳美泉宫与圣彼得堡夏宫争相效仿，直至1789年10月大革命民众进军凡尔赛迫使路易十六返京，这座宫殿始终是欧洲古典宫廷政治与外交的最高舞台。"
 game_concept_oe_wp26_enc_lm_taj_mahal:0 "泰姬陵与沙贾汗纳巴德"
 game_concept_oe_wp26_enc_lm_taj_mahal_desc:0 "阿格拉亚穆纳河南岸的泰姬陵由莫卧儿皇帝沙贾汗敕建于1632至1648年、建筑大师乌斯塔德·艾哈迈德·拉合尔主持设计，将帖木儿—波斯四分御园格局、拉贾斯坦洁白大理石与宝石镶嵌工艺熔于一炉，堪称人类建筑史最纯粹和谐的杰作之一。\n\n恰在泰姬陵基本竣工的1648年，沙贾汗于德里正式启用规划严整的新都沙贾汗纳巴德及红堡、贾玛清真寺。双璧交辉背后，是纺织工坊与农税体量一度占据近世全球经济近四分之一的莫卧儿黄金时代。"
 game_concept_oe_wp26_enc_lm_westphalia_halls:0 "威斯特伐利亚和约厅（明斯特与奥斯纳布吕克）"
 game_concept_oe_wp26_enc_lm_westphalia_halls_desc:0 "1643至1648年10月24日间，代表欧洲近两百个君主国、帝国诸侯与共和国的百余名全权使节齐聚中立的威斯特伐利亚双城——天主教城明斯特与新教城奥斯纳布吕克——历经五年多边拉锯，终结了惨烈的三十年战争与八十年尼德兰独立战争。\n\n两地市政厅和约大厅签署的条约正式承认荷兰共和国与瑞士联邦独立，将加尔文宗纳入帝国合法教派、赋予德意志诸侯外交缔约权，开创了以主权国家平等与多边国际会议为核心的近代国际关系体系。"
 game_concept_oe_wp26_enc_1776_george_washington:0 "乔治·华盛顿（1732—1799）"
 game_concept_oe_wp26_enc_1776_george_washington_desc:0 "弗吉尼亚种植园主乔治·华盛顿早年历练于七年战争北美边疆，1775年受命出任大陆军总司令。面对装备精良的英军与捉襟见肘的军需补给，他熬过纽约失利与福吉谷严冬，既以费边式持久战保全有生力量，又以奇袭特伦顿、普林斯顿与1781年联手法军合围约克镇迫使大不列颠承认美国独立。\n\n比战场胜负更令世界震撼的是其共和风范：1783年他主动向文官国会交还兵权，1787年主持制定美国宪法，就任首任总统两届期满后毅然卸任归田，为现代宪政共和国树立了和平交权的典范。"
 game_concept_oe_wp26_enc_1776_qianlong:0 "清高宗乾隆帝弘历（1711—1799）"
 game_concept_oe_wp26_enc_1776_qianlong_desc:0 "清高宗爱新觉罗·弘历（乾隆帝）在位六十年（1735—1796）并以太上皇训政三年，将传统中华帝国的疆域版图与人口规模推向历史最高峰。其「十全武功」荡平准噶尔汗国、将新疆天山南北纳入版图、完善西藏金瓶掣签制度并震慑周边藩属，成就康乾盛世的辉煌顶点。\n\n他亦以多产诗文、广藏书画并敕纂《四库全书》著称于世，治下人口突破三亿；然而晚年宠信和珅、大兴文字狱、白莲教烽烟四起，加之冷拒英国马戛尔尼使团通商之请，也为近代百年变局埋下伏笔。"
 game_concept_oe_wp26_enc_1776_frederick_ii:0 "普鲁士腓特烈大帝（1712—1786）"
 game_concept_oe_wp26_enc_1776_frederick_ii_desc:0 "普鲁士国王腓特烈二世集长笛乐师、伏尔泰笔友与斜行阵战术奇才于一身，硬生生将原本偏居北德的普鲁士铸就为欧洲五大列强之一。1740年他果断出兵夺取富庶的西里西亚，并在1756至1763年以一敌三（奥、法、俄）的七年战争绝境中，凭罗斯巴赫与洛伊滕奇胜死守战果。\n\n他自称「国家第一公仆」，在无忧宫推崇开明专制：废除刑讯、宽容各教、疏浚奥得河沼泽、推广马铃薯种植并编修普鲁士法典；1772年借第一次瓜分波兰打通勃兰登堡与东普鲁士陆路相连，奠定近代德意志北方强权根基。"
 game_concept_oe_wp26_enc_1776_catherine_ii:0 "叶卡捷琳娜大帝（1729—1796）"
 game_concept_oe_wp26_enc_1776_catherine_ii_desc:0 "叶卡捷琳娜二世原为德意志安哈尔特-采尔布斯特公女索菲娅，远嫁俄国后潜心研习俄语、正教与宫廷权术，于1762年借近卫军政变登基。在位三十四载间，她全面推进彼得大帝未竟的南下宏图：切什梅海战歼灭奥斯曼舰队、1774年缔结《库楚克凯纳吉条约》、1783年兼并克里米亚汗国并兴建塞瓦斯托波尔与敖德萨，使俄罗斯牢牢立足黑海北岸。\n\n她与伏尔泰、狄德罗书信往还，颁布启蒙《训令》、创办冬宫艾尔米塔什珍藏馆与女子学院，并主导三次瓜分波兰；然1773至1775年普加乔夫大起义后，她转而通过《贵族特许状》深度强化农奴制与贵族联盟。"
 game_concept_oe_wp26_enc_1776_george_iii:0 "大不列颠国王乔治三世（1738—1820）"
 game_concept_oe_wp26_enc_1776_george_iii_desc:0 "乔治三世是汉诺威王朝首位生于不列颠、以英语为母语的君主。1760年即位之际，七年战争胜利正将大英帝国推向横跨北美与孟加拉的全球海权巅峰。然而为分摊庞大军债并维护议会至上权威，其内阁对北美殖民地强推印花税与茶叶税，最终引爆1775至1783年美国独立战争。\n\n尽管痛失北美十三州令其备遭争议，其长达六十年的统治却见证了英国第一次工业革命起飞、英属印度迅速扩张、皇家艺术学院与邱园勃兴，以及最终击败拿破仑帝国的漫长拉锯，唯晚年屡受精神顽疾困扰而由太子摄政。"
 game_concept_oe_wp26_enc_1776_louis_xvi:0 "法兰西国王路易十六（1754—1793）"
 game_concept_oe_wp26_enc_1776_louis_xvi_desc:0 "路易十六为人虔诚仁厚、精于制锁与航海舆图，1774年却接手了一个债台高筑、特权阶层顽固抗拒税改的旧制度法兰西。在外交大臣韦尔热纳筹划下，他于1778年毅然介入美国独立战争，遣罗尚博陆军与德·格拉斯舰队助美克捷约克镇，一雪七年战争前耻。\n\n然而这场跨洋凯旋彻底耗空了法兰西国库。随着杜尔哥、卡洛讷等财政改革受阻于高等法院，路易十六被迫于1789年重开尘封百七十五年的三级会议，由此点燃席卷欧洲的法国大革命烈焰，终在1793年走上协和广场断头台。"
 game_concept_oe_wp26_enc_1776_charles_iii:0 "西班牙国王卡洛斯三世（1716—1788）"
 game_concept_oe_wp26_enc_1776_charles_iii_desc:0 "卡洛斯三世早年治政那不勒斯与西西里二十五载（其间资助庞贝与赫库兰尼姆古城发掘），1759年入承西班牙王位后，被公认为西班牙波旁王朝最具才干的开明君主。在阿兰达、坎波马内斯与佛罗里达布兰卡等重臣辅佐下，他整治马德里市政、打破塞维利亚—加的斯贸易垄断、于1776年新设拉普拉塔总督区并全面推行波旁行政与财政改革。\n\n七年战争后他倾力重建无敌舰队，1779年借美国独立战争出兵收复梅诺卡岛与东西佛罗里达，令西班牙帝国迎来十八世纪最后的中兴。"
 game_concept_oe_wp26_enc_1776_maria_theresa:0 "玛丽亚·特蕾莎女大公（1717—1780）"
 game_concept_oe_wp26_enc_1776_maria_theresa_desc:0 "玛丽亚·特蕾莎是哈布斯堡王朝历史上唯一的女性执政者。1740年嗣位之初便遭普鲁士、法兰西与巴伐利亚联手发难，她在奥地利王位继承战争危急关头亲赴匈牙利国会慷慨陈辞、感召马扎尔贵族勤王，力挽帝国于既倒。\n\n此后四十年间，她倚重豪格维茨与考尼茨锐意革新：向贵族征税统一财政、兴办全国义务初等教育、创办特蕾莎军校，更促成1756年联法抗普的「外交革命」，自1765年起与锐进长子约瑟夫二世共治，将松散领邦锻造为坚韧的近代官僚强国。"
 game_concept_oe_wp26_enc_1776_king_jeongjo:0 "朝鲜正祖李祘（1752—1800）"
 game_concept_oe_wp26_enc_1776_king_jeongjo_desc:0 "朝鲜正祖李祘于1776年承继英祖大统，虽幼年历尽生父思悼世子惨案的政治风波，登基后却开创了朝鲜王朝十八世纪最璀璨的文治复兴。他创设奎章阁既藏天下秘籍、亦为延揽寒门与庶孽才俊的御前智囊，大力奖掖丁若镛等实学派大师。\n\n内政上他续行荡平策调和老少论党争，1791年颁布「辛亥通共」打破汉城六矣廛商业垄断以活络市井，并采西洋起重机械与实学设计营建水原华城，将礼制仁政与近代工程技术融于一身。"
 game_concept_oe_wp26_enc_1776_king_taksin:0 "暹罗吞武里大帝郑信（1734—1782）"
 game_concept_oe_wp26_enc_1776_king_taksin_desc:0 "郑信（达信大帝）父为潮州旅暹华商、母为泰族。1767年4月缅甸贡榜大军攻陷并焚毁阿瑜陀耶故都前夕，他仅率五百死士突围东进尖竹汶，短短七个月内整军造船、溯湄南河反攻逐走缅军，并定都吞武里重建暹罗国家。\n\n此后十余年间，他与麾下名将却克里、素拉西并肩征战，扫平割据、光复清迈兰纳、威服老挝与柬埔寨，同时力振农桑与对清朝广州的帆船商贸，虽于1782年晚年政变落幕，至今仍被尊为救亡复国的暹罗民族英雄。"
 game_concept_oe_wp26_enc_1776_hyder_ali:0 "迈索尔苏丹海德尔·阿里（约1720—1782）"
 game_concept_oe_wp26_enc_1776_hyder_ali_desc:0 "海德尔·阿里起于南印度迈索尔王国普通骑兵军官，凭战功与韬略于1761年总揽军政大权，成为十八世纪令英国东印度公司最为忌惮的军事革新枭雄。他延揽法国教官整训近代步炮、兴建国营兵工厂，更率先大规模列装射程远超欧式火炮的铁壳迈索尔火箭，并在治下实行务实宽容的宗教与税政治理。\n\n第一次英迈战争（1767—1769）中他长驱直抵马德拉斯城下迫签城下之盟；1780年再度于波利卢尔之战重创英军，将其反殖民军工强国衣钵传予爱子「迈索尔之虎」提普苏丹。"
 game_concept_oe_wp26_enc_lm_independence_hall:0 "费城独立厅"
 game_concept_oe_wp26_enc_lm_independence_hall_desc:0 "费城独立厅原为1753年竣工的乔治亚式红砖宾夕法尼亚州议会大厦，却在十八世纪后期化作现代宪政共和主义的诞生地。正是在其议事大厅内，第二届大陆会议于1775年任命乔治·华盛顿为总司令，并于1776年7月4日正式通过《独立宣言》，向世界宣示政府正当权力源于被治理者之同意。\n\n十一年后的1787年盛夏，各州代表重聚同一厅堂闭门激辩数月，起草完成确立三权分立与联邦共和体制的《美利坚合众国宪法》，其宪政范式深刻回荡于大西洋两岸与全球近代立宪浪潮。"
 game_concept_oe_wp26_enc_lm_siku_quanshu:0 "《四库全书》与文渊阁"
 game_concept_oe_wp26_enc_lm_siku_quanshu_desc:0 "乾隆三十八年（1773年）敕修、由纪昀总纂并汇聚三百六十余名硕学鸿儒与数千抄录官历时十载编成的《四库全书》，按经、史、子、集四部收录典籍三千四百六十一种、凡三万六千余册，堪称人类前现代规模最浩大的手抄类书与文献集成。\n\n全书共誊抄七部，仿宁波天一阁格局分藏于紫禁城文渊阁、圆明园文源阁、沈阳文溯阁、避暑山庄文津阁以及江南三阁，既极大保存中华典籍并推高乾嘉考据学巅峰，也伴随着严厉的违碍书目禁毁与删改，折射出盛清文治的双面镜像。"
 game_concept_oe_wp26_enc_lm_winter_palace:0 "冬宫与圣彼得堡"
 game_concept_oe_wp26_enc_lm_winter_palace_desc:0 "坐落于涅瓦河畔的第四代冬宫由意大利巴洛克大师拉斯特雷利设计，恰在1762年叶卡捷琳娜二世登基之际基本落成，以翡翠绿、纯白与鎏金立面矗立于彼得大帝亲手开辟的「欧洲之窗」圣彼得堡核心。宫内一千五百余间厅堂、约旦大厅与毗邻的艾尔米塔什画廊，昭示俄罗斯帝国从内陆莫斯科公国跃升为欧亚大帝国的宏阔气象。\n\n环绕冬宫的海军部船厂、俄罗斯科学院与青铜骑士雕像群，共同凝结了十八至十九世纪俄罗斯帝国面向海洋与欧陆的宏图雄心。"
 shanyang_huaian_desc:0 "山阳（淮安府治）扼守京杭大运河与古淮河交汇咽喉，自明永乐朝重开漕运以来便设有总督漕运公署，统筹天下岁运京师的数百万石江南税粮。城内府衙、钞关与盐运商行鳞次栉比，堪称明清帝国维系南北财政动脉的「运河之都」。"
 qinghe_huaian_desc:0 "清河（清口）坐落于黄河、淮河与大运河三水交汇的险要节点，自黄河夺淮南徙以来便成为牵动大运河生死存亡的水利心脏。明代治河名臣潘季驯与清代靳辅在此筑高家堰、修清口三闸以行「蓄清刷黄」之策，终令漕船得以安渡浊浪。"
 mysore_desc:0 "迈索尔坐落于南印度卡纳塔克高地肥沃的德干台原之上，自十六世纪末瓦迪亚尔王朝脱胎于毗奢耶那伽罗以来便是南印度重镇。十八世纪后期海德尔·阿里与提普苏丹在此建立近代化兵工厂，研发闻名欧洲的铁壳迈索尔战火箭，令迈索尔成为南亚抗衡东印度公司最顽强的军工堡垒。"
 munster_desc:0 "明斯特坐落于威斯特伐利亚平原心脏，既是古老的采邑主教都城，亦为汉萨同盟内陆重镇。1643至1648年间，欧洲天主教诸国全权使节齐聚明斯特市政厅和约大厅，与奥斯纳布吕克会场同步签署《威斯特伐利亚和约》，终结惨烈的三十年战争与八十年战争，开启近代主权国家外交体系。"
 berlin_desc:0 "坐落于施普雷河畔的柏林与科隆双城原为勃兰登堡选帝侯朴素的沙地都邑，历经三十年战争残破后，在大选帝侯腓特烈·威廉治下凭借广纳胡格诺工匠、修通运河与编练常备军迅速崛起。十八世纪在腓特烈大帝经营下，菩提树下大街、皇家学院与近代军政中枢将柏林铸就为欧洲新兴强权普鲁士的心脏。"
 potsdam_desc:0 "波茨坦环抱于哈韦尔河湖泊与松林之间，自1685年大选帝侯在此颁布容留新教难民的《波茨坦敕令》以来便与普鲁士国运紧密相连。十八世纪腓特烈二世在此葡萄梯田之巅营建洛可可杰作无忧宫，邀请伏尔泰等启蒙哲人清谈艺文，使波茨坦兼具普鲁士军营重镇与启蒙宫廷雅苑的双重气象。"
 shackamaxon_desc:0 "特拉华河与斯库尔基尔河交汇处的沙卡马克森原为莱纳佩部族会盟圣地，1682年威廉·佩恩在此缔结和平条约并规划出棋盘街廓的费城。十八世纪后期，费城跃居英属北美第一大港与启蒙学术重镇；1776年《独立宣言》与1787年美国宪法相继于此诞生，令这座河畔名城成为近代宪政共和的摇篮。"
 orkhon_desc:0 "鄂尔浑河谷水草丰美、群山环抱，自匈奴、柔然、突厥汗国至回鹘汗国与蒙古帝国，逾两千年间屡屡成为草原大汗牙帐与祭天圣地。河谷内矗立的突厥阙特勤碑、毗伽可汗碑与哈拉和林遗址，见证了无数游牧帝国在此汇聚欧亚丝路商旅并号令千里大漠的辉煌岁月。"
 toshima_kanto_desc:0 "丰岛（江户）坐落于武藏平原临海湾口，原为太田道灌所筑江户城所在。1590年德川家康入驻关东并于1603年开设江户幕府后，在三代将军德川家光参勤交代制度推动下，江户城天守与百万町人街区迅速勃兴，在十八世纪初跃升为当时全球人口最稠密、出版与浮世绘文化最炽盛的超级都会之一。"
 gonder_desc:0 "贡德尔雄踞塔纳湖北岸高原群山之间，1636年由埃塞俄比亚皇帝法西利德斯定为所罗门王朝固定帝都，结束了数百年移动行营传统。城内气势宏伟的法西尔盖比皇家石堡群融合阿克苏姆、葡萄牙与印度建筑风韵，使贡德尔成为十七至十八世纪东北非正教绘画、神学与宫廷礼乐的璀璨圣城。"
 bosra_desc:0 "布斯拉以当地乌黑玄武岩筑就于叙利亚南部豪兰沃野之上，罗马时代为阿拉伯行省首府与第三昔兰尼加军团驻地，拥有保存极佳的宏伟罗马剧场。公元六世纪，东罗马盟邦杰夫尼（伽萨尼）王国依托布斯拉与豪兰商道扼守叙利亚沙漠防线，见证了古典晚期阿拉伯—拜占庭文明的深度交融。"
 ujjain_desc:0 "乌贾因（古称阿槃提）坐落于中印度摩腊婆高原希普拉河畔，自孔雀与笈多王朝起便是印度天文学本初子午线所在、商旅云集的学术与圣城。公元六世纪初，摩腊婆名王耶输达曼以此为后盾挥师击溃阿尔浑匈人铁骑，保全了中印度古典梵语文学与历算传统的薪火延续。"
