l_simp_chinese:
 oe_byz_plan_subject_governor: "为属国规划总督府"
 oe_byz_plan_subject_governor_desc: "选择一个直属属国及其境内地点。若该地点已有地方总督治所，则将其拆除；否则，须满足原版建造条件且属国尚有总督府名额，令属国在该地点开工建造。施工中的总督府计入名额，建设与维护沿用原版规则。"
 oe_byz_choose_governor_location: "选择建造或拆除总督府的地点"
 oe_byz_no_governor_location: "@trigger_no!没有可拆除的地方总督治所，或没有满足建造条件与属国名额上限的地点。"
 oe_byz_grant_subject_political_influence: "为属国提供政治影响力"
 oe_byz_grant_subject_political_influence_desc: "选择一个直属属国。东罗马消耗20政治影响力，目标属国获得20政治影响力。"
 oe_byz_suppress_subject_rebellion: "压制属国叛乱"
 oe_byz_suppress_subject_rebellion_desc: "选择一个直属属国。东罗马支付相当于该属国一年收入的金币，使该属国所有叛乱进度降低40个百分点，最低为0。每个属国分别冷却15年。"
 oe_byz_subject_rebellion_suppression_cooldown: "压制属国叛乱"
 oe_byz_plan_subject_naval_governor: "为属国规划海军总督府"
 oe_byz_plan_subject_naval_governor_desc: "选择一个直属属国及其境内地点。若该地点已有海军总督府，则将其拆除；否则，须为符合原版条件的城市或大都会港口，且属国尚有海军总督名额，令属国在该地点开工建造。地点须未通过本国领土与首都连通，且不属于海外；不能是首都、历史首都或已有邻近度来源建筑的地点。施工中的海军总督府计入名额，建设与维护沿用原版规则。"
 oe_byz_choose_naval_governor_location: "选择建造或拆除海军总督府的地点"
 oe_byz_no_naval_governor_location: "@trigger_no!没有可拆除的海军总督府，或没有满足原版港口条件与属国海军总督名额上限的地点。"
