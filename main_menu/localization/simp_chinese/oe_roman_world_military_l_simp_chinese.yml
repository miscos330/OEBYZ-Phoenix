l_simp_chinese:
 oe_rw_mobilize_border: "动员边疆武装"
 oe_rw_mobilize_border_desc: "边疆的村落、牧场与领主可以在战时提供更多兵员。召集他们需要粮饷，也需要给这些家庭留下恢复生计的时间。\n\n仅#color_yellow 突厥贝伊国#!在#color_yellow 战争状态#!下可执行。花费#color_yellow 一个月税收与贸易收入#!的国库金币，获得#color_yellow 一年陆军征召兵规模＋20%#!，冷却#color_yellow 三年#!。AI在满足资金与冷却条件后自动执行。不消耗内帑、权威或民意。"
 oe_rw_latin_instructors_action: "引入拉丁军事教官"
 oe_rw_latin_instructors_action_desc: "意大利诸城与西方宫廷的军人，带来了另一套组织和训练士兵的经验。我们可以雇用这些教官，也必须容忍军营中出现更多不同的语言与习惯。\n\n#color_yellow 专制公、罗马正统、拉丁公国#!可执行。花费#color_yellow 一个月税收与贸易收入#!的国库金币，获得#color_yellow 三年训练度＋2.5%#!，价值观向#color_yellow 多元认同移动2.5#!。与“研究罗马战术”#bold 共用三年冷却#!。不消耗内帑、权威或民意。"
 oe_rw_study_roman_tactics: "研究罗马战术"
 oe_rw_study_roman_tactics_desc: "罗马的军书记载着行军、设营、侦察与应对不同敌军的方法。让军官共同研读这些经验，既能增强他们作战的信心，也使军队更加认同罗马的传统。\n\n所有成员可执行。花费#color_yellow 一个月税收与贸易收入#!的国库金币，获得#color_yellow 三年陆军士气＋5%#!，价值观向#color_yellow 罗马认同移动2.5#!。与“引入拉丁军事教官”#bold 共用三年冷却#!。不消耗内帑、权威或民意。"
 oe_rw_challenge_empire: "公开挑战帝国"
 oe_rw_challenge_empire_desc: "君士坦丁堡赋予其主人继承罗马的名义，却不能永远代替实力。既然我们已经成为文明圈内最强大的国家，就可以公开宣称：帝国的未来不必由眼下占据皇城的人决定。\n\n仅#bold #color_yellow 实力排名第一且不持有罗马正统#!#!的成员显示。须处于和平且能够向君士坦丁堡拥有者宣战。消耗#color_yellow 10威望#!，获得针对其君堡所在省份的#color_yellow 五年战争借口#!，双方关系各降低#R 50#!并逐年恢复。冷却#color_yellow 五年#!。\n此行动不立即宣战，不转移罗马正统，不消耗金币、内帑、权威或民意。"
 oe_rw_border_mobilization: "边疆武装动员"
 oe_rw_border_mobilization_desc: "边疆居民被召集起来，补充战时征召兵。"
 oe_rw_latin_instructors: "拉丁军事教官"
 oe_rw_latin_instructors_desc: "来自拉丁诸国的教官正在训练我们的军队。"
 oe_rw_roman_tactics: "研习罗马战术"
 oe_rw_roman_tactics_desc: "军官从罗马军书与作战传统中汲取经验，增强军队的信心。"
 oe_rw_imperial_challenge_opinion: "公开挑战帝国"
 oe_cb_challenge_roman_empire: "争夺帝国中心"
 oe_cb_challenge_roman_empire_desc: "以武力争夺君士坦丁堡所在省份，挑战其拥有者对罗马正统的主张。"
 OE_RW_MONTHLY_INCOME_AFFORD: "国库金币足以支付一个月的税收与贸易收入"
 OE_RW_MILITARY_STUDY_READY: "“引入拉丁军事教官”和“研究罗马战术”的三年共享冷却已结束"
