 oe_v150_exclave_charter_decision.title: "非拉铁非自由市特许状"
 oe_v150_exclave_charter_decision.desc: "深陷安纳托利亚突厥贝伊国重围的孤城非拉铁非（阿拉谢希尔）素来凭借地方民团自治坚守罗马紫旗。你可于1337年开局裁定：追认其为帝国柱石下的自治附庸自由市，或立即收回中央直辖。"
 oe_v150_exclave_charter_decision_desc: "于1337年开局裁定维持非拉铁非（OPH）自治附庸地位，或立即收回帝国直辖。"
 oe_v150_exclave_charter_decision.a: "御览非拉铁非自由市特许状"
 oe_v150_exclave.1.t: "非拉铁非自由市特许状"
 oe_v150_exclave.1.desc: "在萨鲁汗、艾登与盖尔米扬三方突厥贝伊国的合围之下，安纳托利亚内陆孤城非拉铁非（阿拉谢希尔）的市民与神职人员全凭地方城防与自治参议会，才令罗马紫旗屹立不倒。如今全城使节穿越突厥防线抵达君士坦丁堡，捧献城门金钥听候圣裁：陛下究竟是颁下金玺诏书，确认其以帝国忠顺附庸自由市的身份继续扼守东疆，还是即刻撤回自治特许状、将其重新纳入宫廷直辖？"
 oe_v150_exclave.1.a: "颁诏确认自治特许——令非拉铁非固守东疆"
 oe_v150_exclave.1.a.tt: "确认#Y 非拉铁非自由市#!为帝国自治附庸，获得#G +5#!帝国柱石权威、#G +10#!威望，并使非拉铁非的独立倾向降低#G -15#!。"
 oe_v150_exclave.1.b: "撤回自治特许——即刻恢复帝国直辖"
 oe_v150_exclave.1.b.tt: "立即将#Y 非拉铁非（阿拉谢希尔）#!收回罗马帝国中央直辖。"
