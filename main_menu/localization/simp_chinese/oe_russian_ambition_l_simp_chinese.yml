l_simp_chinese:
 oe_rus_authorize_boyars: "授权当地波雅尔"
 oe_rus_authorize_boyars_desc: "花费10政治影响力，在俄罗斯、鲁塞尼亚或大草原的一处本国省份授权波雅尔。省内须有尚未整合的地点，且不能已有波雅尔特权。全省地点获得50个百分点整合进度，并获得持续50年的波雅尔特权。冷却一年。"
 oe_rus_authorize_boyars_cooldown: "授权当地波雅尔"
 oe_rus_boyar_province: "可授权波雅尔的本国省份"
 STATIC_MODIFIER_NAME_oe_rus_boyar_privileges: "波雅尔特权"
 STATIC_MODIFIER_DESC_oe_rus_boyar_privileges: "地方贵族承认中央的权柄，换取世袭庄园与对农民的支配权。"
 oe_russian_ambition: "俄罗斯雄心"
 oe_russian_ambition_desc: "分裂的罗斯诸邦已归于同一旗帜之下。新生的俄罗斯将目光投向草原、乌拉尔与西伯利亚，在辽阔的边境寻求土地、财富与安全。俄罗斯灭亡时，局势结束。"
 oe_ra_outcome_fall: "俄罗斯雄心的终结"
 oe_ra_outcome_fall_desc: "俄罗斯已不复存在，向草原与西伯利亚扩张的事业随之中断。"
 oe_russian_ambition.1.t: "俄罗斯的崛起"
 oe_russian_ambition.1.d: "昔日各自为政的罗斯城邦，如今已被俄罗斯的名号联结起来。王公之间的争衡让位于共同的疆域与征赋，森林中的城镇、河道上的商旅和广袤平原上的农庄，正为新的国家积蓄力量。\n\n在东方，草原与乌拉尔山之外延伸着辽远的疆土；在西方，邻邦开始重新衡量这位统一的对手。俄罗斯的道路尚未注定，但它已拥有将雄心化为现实的潜力。"
 oe_russian_ambition.1.a: "北方的秩序正在改变。"
 oe_ra_expand_steppe: "向草原扩张"
 oe_ra_expand_steppe_desc: "花费25政治影响力与本国三个月收入，取得大草原或呼罗珊一处接壤省份的征服宣战理由。接壤可经本国或附属国；不能针对盟友、附属国或共主联邦伙伴。冷却六个月。"
 oe_ra_expand_steppe_cooldown: "向草原扩张"
 oe_ra_expand_siberia: "向西伯利亚扩张"
 oe_ra_expand_siberia_desc: "花费10政治影响力，取得乌拉尔、西西伯利亚或东西伯利亚一处接壤省份的征服宣战理由。省份须有目标国拥有的定居地点，不能选择完全未殖民的土地；不能针对盟友、附属国或共主联邦伙伴。冷却一年。"
 oe_ra_expand_siberia_cooldown: "向西伯利亚扩张"
 oe_ra_country_statistics: "#bold #Y 俄罗斯国力#!#!\n\n#W 税基#!    #Y [Country.GetTotalTaxBase|2]#!\n#W 人口#!    #Y [Country.GetTotalPopulation]#!\n#W 现役陆军#!    #Y [Country.GetArmySize]#!\n#W 拥有地点#!    #Y [Country.GetOwnedLocationCount|0]#!"
 oe_ra_expansion_explanation: "#bold 扩张方向#!\n#Y 草原与呼罗珊#!：开拓南方的边境。\n#Y 乌拉尔与西伯利亚#!：向森林与大河的深处进军。\n\n只有俄罗斯能够执行本局势的扩张行动。"
 oe_ra_observer: "可见俄罗斯雄心局势"
 oe_ra_actor: "俄罗斯雄心局势中的俄罗斯"
 oe_ra_foreign_frontier: "与俄罗斯或其附属国接壤的非友邦省份"
