# NEW 2026-11-21 v9.8 Worker 1: Religio Romana Renaming & Vanilla 1.4.9 Loc Bugfixes. Generated by gen_romp_pantheon.py.
 hellenism_religion:0 "罗马多神教"
 hellenism_religion_ADJ:0 "罗马多神教"
 hellenism_religion_desc:0 "罗马多神教（Religio Romana）承袭自卡皮托利乌姆三主神与奥林匹斯古典万神殿，以维系「众神和平（Pax Deorum）」、大祭司团礼制、神谕占兆与公民德行作为帝国存续之基石。\n\n从奥古斯都重建神庙、奥勒良尊奉无敌太阳、尤利安在君士坦丁堡复兴古典学园，到十五世纪格弥斯托士·卜列东在米斯特拉斯著《律法汇编》重燃圣火，这门古老的帝国信仰从未真正熄灭。借助「罗马诠释（Interpretatio Romana）」的包容气度，它将罗马古礼、希腊哲思与地中海诸邦神祇融为一炉，成为紫衣帝国的精神脊梁。"
 game_concept_omen_desc:0 "$game_concept_omens$是[ShowReligionAdjective('hellenism_religion')][religion|e]中与[Concept('gods', '众神')|e]相联结的超自然现象，可通过[ShowGenericActionName('select_omen_god')]与[ShowGenericActionName('select_omen')]行动召唤预兆。其神力随[ruler|e]的[ability|e]高低而增减。"
 game_concept_god_emperors_desc:0 "神皇是由于其事迹拥有非凡神圣性而在[ShowReligionAdjective('hellenism_religion')][religion|e]中得到承认的[character|e]。成为神皇的过程被称为封圣。"
 game_concept_heroes_desc:0 "在采纳英雄崇拜信条的[ShowReligionAdjective('hellenism_religion')][religion|e]中，事迹拥有非凡神圣性的[character|e]会被视为英雄。成为英雄的过程被称为封圣。"
 game_concept_divine_emperors_desc:0 "在采纳帝皇崇拜信条的[ShowReligionAdjective('hellenism_religion')][religion|e]中，事迹拥有非凡神圣性的[character|e]会被认可为神皇。成为神皇的过程被称为封圣。"
 hellenism_religion.31.title:0 "新的神谕降临我国"
 hellenism_religion.28.desc:0 "在和平时期，野心退却，审慎抬头，祭司常提及[ShowGodName('athena_god')]。他们坚称，智慧不仅是一种美德，更是一件武器，且唯有在[ROOT.GetCountry.GetFlavorRank]不为战事所扰时，方能锻造得最为精良。\n\n而今，有一项提案摆在我们面前，耗费颇巨，却合情合理；它承诺在铺张之处建立秩序，在疑云密布之处带来明晰。倘若我们拒绝，或许能保全钱币，但[ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]不会忘记，是我们自己拒绝了女神的箴言。"
