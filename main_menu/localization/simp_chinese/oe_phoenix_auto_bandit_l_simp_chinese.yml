 oe_phoenix_enable_auto_bandit_desc: "将乡道巡逻与山地清剿交由常备队伍持续办理。\n\n须现有人力#Y 大于1000#!，每月人力增长#Y 大于0#!。启用后每月稳定度#R −0.1#!、人力#R −50人#!；每四个月随机清除东罗马直接拥有地点的一座盗匪据点。月度检查发现已无据点，或凤凰涅槃灾难结束时，自动关闭并移除修正。再次开启重新计算四个月。"
 oe_phoenix_disable_auto_bandit: "关闭自动剿匪"
