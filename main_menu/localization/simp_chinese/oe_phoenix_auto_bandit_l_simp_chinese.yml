 MODIFIER_TYPE_NAME_oe_phoenix_auto_bandit_monthly_stability: "每月剿匪稳定度变化"
 MODIFIER_TYPE_DESC_oe_phoenix_auto_bandit_monthly_stability: "自动剿匪在每次灾难月度检查时实际结算的固定稳定度变化。"
