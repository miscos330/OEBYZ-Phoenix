 oe_eco_v97_dec_issue_bonds.title:0 "发行帝国主权公债"
 oe_eco_v97_dec_issue_bonds_desc:0 "依托帝国特许银行、商社或近代票号网络，面向君士坦丁堡、威尼斯与热那亚金融市场发行主权公债：即时筹集约#G 12个月#!税贸现银，并向三大金融市场注入#Y 3年#!白银、纸张、典籍与玻璃清算需求；须承担#Y 8年#!付息期，若通胀过高或战争疲惫深重将面临债信承压考验。"
 oe_eco_v97_dec_issue_bonds.desc:0 "依托帝国特许银行、商社或近代票号网络，面向君士坦丁堡、威尼斯与热那亚金融市场发行主权公债：即时筹集约#G 12个月#!税贸现银，并向三大金融市场注入#Y 3年#!白银、纸张、典籍与玻璃清算需求；须承担#Y 8年#!付息期，若通胀过高或战争疲惫深重将面临债信承压考验。"
 oe_eco_v97_dec_issue_bonds.a:0 "颁诏发债，联动欧亚银号认购"
 oe_eco_v97_dec_silk_spice_voyage:0 "筹组丝绸香料联合船队"
 oe_eco_v97_dec_silk_spice_voyage.title:0 "筹组丝绸香料联合船队"
 oe_eco_v97_dec_silk_spice_voyage_desc:0 "由国库与帝国商社合资筹组贯通君士坦丁堡、亚历山大港与泉州晋江（刺桐港）的联合船队：向三大枢纽市场双向注入#Y 3年#!丝绸、染料、细布、胡椒、丁香、香料与瓷器特殊需求，并带动本国首都市场#Y 2年#!造船物料行情；航期结算后将迎来丰厚分红或海损考验。"
 oe_eco_v97_dec_silk_spice_voyage.desc:0 "由国库与帝国商社合资筹组贯通君士坦丁堡、亚历山大港与泉州晋江（刺桐港）的联合船队：向三大枢纽市场双向注入#Y 3年#!丝绸、染料、细布、胡椒、丁香、香料与瓷器特殊需求，并带动本国首都市场#Y 2年#!造船物料行情；航期结算后将迎来丰厚分红或海损考验。"
 oe_eco_v97_dec_silk_spice_voyage.a:0 "拨银启航，贯通东西海市"
 oe_eco_v97_dec_grain_price_stabilize:0 "启动帝国平准粮仓入市"
 oe_eco_v97_dec_grain_price_stabilize.title:0 "启动帝国平准粮仓入市"
 oe_eco_v97_dec_grain_price_stabilize_desc:0 "针对战时与荒年粮价波动，拨银动用帝国平准粮仓：向君士坦丁堡、亚历山大港与本国首都市场注入#Y 2年#!小麦与食盐收储需求，并开启#Y 4年#!全国平准稳粮机制，提升粮食供给、阶层满意度与行省繁荣度。"
 oe_eco_v97_dec_grain_price_stabilize.desc:0 "针对战时与荒年粮价波动，拨银动用帝国平准粮仓：向君士坦丁堡、亚历山大港与本国首都市场注入#Y 2年#!小麦与食盐收储需求，并开启#Y 4年#!全国平准稳粮机制，提升粮食供给、阶层满意度与行省繁荣度。"
 oe_eco_v97_dec_grain_price_stabilize.a:0 "开仓平粜，稳固粮市"
 oe_eco_v97.1.t:0 "丝绸行情狂飙与织造扩产"
 oe_eco_v97.1.d:0 "联合船队带回的生丝、名贵染料与远东织锦在市场掀起抢购热潮，各大商埠的丝绸与细布行市持续看涨。行会总管与特许商社呈请朝廷裁定：是将这笔盈余再投入皇家丝坊扩产，还是直接变现分红充实国库？"
 oe_eco_v97.1.a:0 "扩建皇家丝坊，深耕织造长利"
 oe_eco_v97.1.b:0 "结算船队暴利，将红利归入国库"
 oe_eco_v97.2.t:0 "香料货船海损与银号挤兑"
 oe_eco_v97.2.d:0 "季风海域的骤暴与海盗袭扰令两艘满载胡椒、丁香与瓷器的联合货船失联，消息传回港口后，承保此批提单的银号门前挤满兑付票据的商贾。若听任挤兑蔓延，帝国商业信用将遭受重创。"
 oe_eco_v97.2.a:0 "由国库托底兑付并向船坞下单补船"
 oe_eco_v97.2.b:0 "听任投机商自担海损，严守国库现银"
 oe_eco_v97.3.t:0 "主权公债超额认购与低息窗口"
 oe_eco_v97.3.d:0 "君士坦丁堡、威尼斯与热那亚三地银号传回捷报：帝国新发主权公债甫一开簿便获超额认购，市场对帝国财政清偿力信心高涨。司库大臣提议趁机压低后续借贷利率，或顺势追加一笔低成本国债份额。"
 oe_eco_v97.3.a:0 "锁定低息借贷窗口，巩固国债声誉"
 oe_eco_v97.3.b:0 "趁热追加认购份额，再筹一笔现银"
 oe_eco_v97.4.t:0 "高通胀与债信承压：紧缩抑或重整"
 oe_eco_v97.4.d:0 "持续走高的通胀或沉重的战时消耗动摇了债市信心，承销公债的商团要求更高贴现率方肯续期。帝国必须立即抉择：是以铁腕增税回笼通货保住债信，还是单方面削减票息强行重整债务。"
 oe_eco_v97.4.a:0 "厉行紧缩加税，全力捍卫帝国债信"
 oe_eco_v97.4.b:0 "强行削减票息重整公债，承受信用代价"
 oe_eco_v97.5.t:0 "威尼斯—热那亚套利竞价战"
 oe_eco_v97.5.d:0 "威尼斯里亚托与热那亚圣乔治银行围绕帝国地中海结算权与远洋汇票展开激烈竞价。两座商业共和国竞相抛出更优厚的利率与船坞物料承揽条件，以求独占帝国枢纽订单。"
 oe_eco_v97.5.a:0 "借竞价压低融资利差，双向注入票据需求"
 oe_eco_v97.5.b:0 "签发联合船坞物料合约，拉动造船补给"
 oe_eco_v97.6.t:0 "泉州晋江瓷丝南洋大市井"
 oe_eco_v97.6.d:0 "晋江刺桐港千帆云集，景德镇瓷器、江南湖丝与南洋香料在此昼夜交割。市舶账簿显示东海与南海转口货量创下新高，正是把枢纽市井景气转化为帝国海贸红利的良机。"
 oe_eco_v97.6.a:0 "整饬市舶账簿，扩大瓷丝香料双向清关"
 oe_eco_v97.6.b:0 "征收特别市舶银钞，同时补足船坞物料"
 oe_eco_v97.7.t:0 "亚历山大港红海香料与粮船丰年"
 oe_eco_v97.7.d:0 "今年尼罗河泛滥适度、麦收大稔，加之红海季风商船满载印度胡椒与乳香抵达亚历山大港，港口仓廪与商馆一时爆满。总督奏请示下：是以平准粮仓与官库统筹收储，还是放手拍卖香料专卖特许。"
 oe_eco_v97.7.a:0 "统筹收储粮谷与香料，稳固帝国后勤命脉"
 oe_eco_v97.7.b:0 "向市民商团拍卖香料专卖特许换取现银"
 oe_eco_v97.8.t:0 "帝国商社年终红利与市场再投资"
 oe_eco_v97.8.d:0 "岁末盘点，帝国商社与特许银行联席账房呈上年度决算：五大欧亚商贸枢纽的差价套利与远洋专卖均录得可观净盈余。董事会恭候御裁这笔盈余的去向。"
 oe_eco_v97.8.a:0 "将盈余再投码头与工坊，延续市场景气"
 oe_eco_v97.8.b:0 "将年度红利悉数解入国库并昭告威望"
