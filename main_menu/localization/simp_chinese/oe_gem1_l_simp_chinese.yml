# NEW 2026-11-23 v19.5 Module 19.5-A (Lithuania & Novgorod): Lithuania & Novgorod Module Localization (simp_chinese) (oe_gem1_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_lit_nov.py; edit the generator, not this file.
 oe_msn_lit_destiny:0 "#bold #color_yellow 立陶宛大公国：双海之冠#!#!"
 oe_msn_lit_destiny_DESCRIPTION:0 "自维尔纽斯格迪米纳斯王冠与萨莫吉希亚铁盾，至贯通波罗的海与黑海的罗斯走廊、三教并蓄同盟及《立陶宛法典》大公强权"
 oe_msn_lit_destiny_CRITERIA_DESCRIPTION:0 "巩固维尔纽斯、特拉凯与考纳斯王权，于波罗的海击破条顿骑士团，经波洛茨克、斯摩棱斯克与基辅直抵黑海，并颁行立陶宛法典跻身欧陆列强。"
 oe_msn_lit_destiny_BUTTON_TOOLTIP:0 "开启立陶宛大公国天命之路"
 oe_msn_lit_destiny_BUTTON_DETAILS:0 "面向立陶宛大公国的三柱十二任务天命线：铁壁守卫萨莫吉希亚并整编追击骑士枪骑兵以挫败条顿骑士团；串联波洛茨克、斯摩棱斯克与基辅开辟波罗的海—黑海罗斯走廊；并借三教兼容、克雷沃与霍罗德沃同盟及立陶宛法典缔造东欧大公霸业。"
 oe_msn_lit_01_gediminid_crown:0 "维尔纽斯与特拉凯的格迪米纳斯王冠"
 oe_msn_lit_01_gediminid_crown_desc:0 "沿涅里斯河与涅曼河巩固维尔纽斯、特拉凯与考纳斯核心三角，确立格迪米纳斯王朝的绝对主权。"
 oe_msn_lit_01_gediminid_crown_req_tt:0 "直接或经由附庸控制维尔纽斯、特拉凯与考纳斯，且稳定度至少为 5。"
 oe_msn_lit_02_samogitian_shield:0 "抵御骑士团的萨莫吉希亚铁盾"
 oe_msn_lit_02_samogitian_shield_desc:0 "加固拉塞尼艾与梅迪宁凯的林间山堡与渡口，阻断条顿与利沃尼亚骑士团南北合流之途。"
 oe_msn_lit_02_samogitian_shield_req_tt:0 "直接或经由附庸控制拉塞尼艾与梅迪宁凯，且稳定度至少为 8。"
 oe_msn_lit_03_vytis_lancers:0 "整编追击骑士枪骑兵"
 oe_msn_lit_03_vytis_lancers_desc:0 "于特拉凯整训立陶宛贵族军团，打造能在野战中正面匹敌西欧重甲骑士的精锐追击骑士枪骑兵。"
 oe_msn_lit_03_vytis_lancers_req_tt:0 "直接或经由附庸控制特拉凯，拥有至少 200 金币，且已进入文艺复兴时代或之后。"
 oe_msn_lit_04_baltic_crusade_broken:0 "击碎波罗的海十字军封锁"
 oe_msn_lit_04_baltic_crusade_broken_desc:0 "夺取帕兰加、梅梅尔、柯尼斯堡或马尔堡之一，彻底打破骑士团对立陶宛波罗的海海岸的封锁。"
 oe_msn_lit_04_baltic_crusade_broken_req_tt:0 "直接或经由附庸控制帕兰加、梅梅尔、柯尼斯堡或马尔堡之一，稳定度至少为 12，且处于大发现时代或之后。"
 oe_msn_lit_05_daugava_polotsk:0 "波洛茨克与维捷布斯克德维纳商道"
 oe_msn_lit_05_daugava_polotsk_desc:0 "将波洛茨克与维捷布斯克两座罗斯河运重镇纳入大公版图，掌控通往里加的西德维纳河商脉。"
 oe_msn_lit_05_daugava_polotsk_req_tt:0 "直接或经由附庸同时控制波洛茨克与维捷布斯克。"
 oe_msn_lit_06_smolensk_bastion:0 "控扼第聂伯河要冲斯摩棱斯克"
 oe_msn_lit_06_smolensk_bastion_desc:0 "将要塞名城斯摩棱斯克收归维尔纽斯旗帜之下，稳固第聂伯河上游门户并遏制莫斯科西进。"
 oe_msn_lit_06_smolensk_bastion_req_tt:0 "直接或经由附庸控制斯摩棱斯克。"
 oe_msn_lit_07_kyiv_blue_waters:0 "基辅与蓝水河大捷"
 oe_msn_lit_07_kyiv_blue_waters_desc:0 "将基辅及切尔尼戈夫或沃里尼亚卢茨克从草原纳贡中解放，确立维尔纽斯作为南罗斯庇护者的正统地位。"
 oe_msn_lit_07_kyiv_blue_waters_req_tt:0 "直接或经由附庸控制基辅，且控制切尔尼戈夫或卢茨克之一。"
 oe_msn_lit_08_baltic_to_black_sea:0 "波罗的海至黑海罗斯大走廊"
 oe_msn_lit_08_baltic_to_black_sea_desc:0 "把波罗的海商网与达舍夫或白城黑海入海口贯通一体，令立陶宛大公国疆域横跨两海之间。"
 oe_msn_lit_08_baltic_to_black_sea_req_tt:0 "直接或经由附庸控制达舍夫、白城或里加之一，领土及附庸合计至少 140 处地点，且处于文艺复兴时代或之后。"
 oe_msn_lit_09_trifaith_synthesis:0 "异教、东正与天主三教并蓄"
 oe_msn_lit_09_trifaith_synthesis_desc:0 "在维尔纽斯与克雷沃之间调和波罗的海旧俗、罗斯东正教区与拉丁教廷外交，锻造多元包容的强韧政体。"
 oe_msn_lit_09_trifaith_synthesis_req_tt:0 "直接或经由附庸控制维尔纽斯与克雷沃，且稳定度至少为 10。"
 oe_msn_lit_10_krewo_horodlo_compact:0 "克雷沃与霍罗德沃同盟宪约"
 oe_msn_lit_10_krewo_horodlo_compact_desc:0 "以纹章联姻与制度对等平衡王朝同盟，确保立陶宛贵族与大公宝座在基督教诸国中享有一等尊荣。"
 oe_msn_lit_10_krewo_horodlo_compact_req_tt:0 "直接或经由附庸控制维尔纽斯，拥有至少 240 金币，且处于文艺复兴时代或之后。"
 oe_msn_lit_11_statute_chancery:0 "《立陶宛法典》与大公秘书处"
 oe_msn_lit_11_statute_chancery_desc:0 "由维尔纽斯大公秘书处纂修欧洲一流的文艺复兴成文法典，统一全境法庭、土地册籍与财政账簿。"
 oe_msn_lit_11_statute_chancery_req_tt:0 "直接或经由附庸控制维尔纽斯，稳定度至少为 15，且处于大发现时代或之后。"
 oe_msn_lit_12_grand_duchy_great_power:0 "大公强权：双海帝国巅峰"
 oe_msn_lit_12_grand_duchy_great_power_desc:0 "以成文法典、常胜追击骑士枪骑兵与贯通两海之商道统御维尔纽斯、波洛茨克、斯摩棱斯克与基辅，加冕立陶宛为欧亚永恒列强。"
 oe_msn_lit_12_grand_duchy_great_power_req_tt:0 "直接或经由附庸控制维尔纽斯、波洛茨克、斯摩棱斯克与基辅，稳定度至少为 18，且处于宗教改革时代或之后。"
 oe_msn_nov_destiny:0 "#bold #color_yellow 伟大诺夫哥罗德主君：北方主权共和国#!#!"
 oe_msn_nov_destiny_DESCRIPTION:0 "自圣索菲亚维彻钟声与汉萨彼得庭白银，至涅瓦要塞防线、波莫尔白海毛皮边疆及乌什库伊尼克伏尔加远征"
 oe_msn_nov_destiny_CRITERIA_DESCRIPTION:0 "捍卫维彻共和与普斯科夫—拉多加—涅瓦要塞链，执掌汉萨白银与波莫尔—伯朝拉毛皮边疆，挥师伏尔加河，缔造北方伟大共和国。"
 oe_msn_nov_destiny_BUTTON_TOOLTIP:0 "开启诺夫哥罗德主权共和国天命之路"
 oe_msn_nov_destiny_BUTTON_DETAILS:0 "面向诺夫哥罗德的三柱十二任务天命线：筑牢普斯科夫、旧拉多加、奥列舍克与涅瓦防线并组建乌什库伊尼克突击队；经波莫尔白海与伯朝拉开拓毛皮边疆并顺伏尔加河远征；再以彼得庭白银商贸与桦树皮市民文化铸就北方伟大共和国。"
 oe_msn_nov_01_veche_sophia_bell:0 "主权维彻与圣索菲亚之钟"
 oe_msn_nov_01_veche_sophia_bell_desc:0 "敲响圣索菲亚大教堂旁的青铜维彻钟，将诺夫哥罗德五区市民与旧鲁萨盐场凝聚在主权共和法度之下。"
 oe_msn_nov_01_veche_sophia_bell_req_tt:0 "直接或经由附庸控制诺夫哥罗德与旧鲁萨，且稳定度至少为 5。"
 oe_msn_nov_02_pskov_ladoga_belt:0 "普斯科夫、拉多加与奥列舍克要塞链"
 oe_msn_nov_02_pskov_ladoga_belt_desc:0 "连缀普斯科夫、旧拉多加至湖心要塞奥列舍克的石砌城垣，锁死诺夫哥罗德通往西方的咽喉。"
 oe_msn_nov_02_pskov_ladoga_belt_req_tt:0 "直接或经由附庸控制普斯科夫、旧拉多加与奥列舍克。"
 oe_msn_nov_03_neva_baltic_gate:0 "执掌涅瓦波罗的海门户"
 oe_msn_nov_03_neva_baltic_gate_desc:0 "牢控涅瓦河口、科波里耶及卡累利阿或伊万哥罗德边堡，确保诺夫哥罗德商船自由进出芬兰湾。"
 oe_msn_nov_03_neva_baltic_gate_req_tt:0 "直接或经由附庸控制涅瓦、科波里耶，并控制科列拉或伊万哥罗德之一，且稳定度至少为 10。"
 oe_msn_nov_04_ushkuiniki_river_host:0 "敕编乌什库伊尼克河道常备军"
 oe_msn_nov_04_ushkuiniki_river_host_desc:0 "将散落河湖的乌什库伊尼克冒险水手收编为共和国常设水上突击军，巡弋拉多加湖至伏尔加河诸水路。"
 oe_msn_nov_04_ushkuiniki_river_host_req_tt:0 "直接或经由附庸控制诺夫哥罗德，拥有至少 220 金币，且处于文艺复兴时代或之后。"
 oe_msn_nov_05_pomor_white_sea:0 "波莫尔白海与北德维纳毛皮海岸"
 oe_msn_nov_05_pomor_white_sea_desc:0 "统筹霍尔莫戈雷、阿尔汉格尔斯克与波莫里耶诸港，建成盐场、渔猎与黑貂皮仓交织的白海网络。"
 oe_msn_nov_05_pomor_white_sea_req_tt:0 "直接或经由附庸控制霍尔莫戈雷、阿尔汉格尔斯克与波莫里耶。"
 oe_msn_nov_06_pechora_fur_frontier:0 "伯朝拉与尤格拉毛皮边疆"
 oe_msn_nov_06_pechora_fur_frontier_desc:0 "自沃洛格达向东北推进至伯朝拉、普斯托泽尔斯克、梅津或大乌斯秋格，尽收北方泰加林黑貂珍裘。"
 oe_msn_nov_06_pechora_fur_frontier_req_tt:0 "直接或经由附庸控制沃洛格达，且控制伯朝拉、普斯托泽尔斯克、梅津或大乌斯秋格之一。"
 oe_msn_nov_07_volga_ushkuiniki_raids:0 "乌什库伊尼克伏尔加河远征"
 oe_msn_nov_07_volga_ushkuiniki_raids_desc:0 "顺维亚特卡与伏尔加河水系南下，将诺夫哥罗德白旗插上维亚特卡、科斯特罗马、雅罗斯拉夫尔或下诺夫哥罗德。"
 oe_msn_nov_07_volga_ushkuiniki_raids_req_tt:0 "直接或经由附庸控制维亚特卡、科斯特罗马、雅罗斯拉夫尔或下诺夫哥罗德之一，且处于文艺复兴时代或之后。"
 oe_msn_nov_08_master_russian_rivers:0 "统御全罗斯大河水系"
 oe_msn_nov_08_master_russian_rivers_desc:0 "慑服特维尔、莫斯科或喀山等陆权劲敌，将伏尔加流域与波罗的海水路统一于共和商贸旗帜之下。"
 oe_msn_nov_08_master_russian_rivers_req_tt:0 "直接或经由附庸控制特维尔、莫斯科或喀山之一，领土及附庸合计至少 210 处地点，且处于大发现时代或之后。"
 oe_msn_nov_09_peterhof_kontor:0 "汉萨彼得庭商站与波罗的海白银"
 oe_msn_nov_09_peterhof_kontor_desc:0 "整饬沃尔霍夫河畔的德意志彼得庭商站规制，使西欧呢绒与波罗的海白银依维彻律法源源汇入诺夫哥罗德。"
 oe_msn_nov_09_peterhof_kontor_req_tt:0 "直接或经由附庸控制诺夫哥罗德，且拥有至少 220 金币。"
 oe_msn_nov_10_birchbark_literacy:0 "桦树皮识字潮与共和司法宪章"
 oe_msn_nov_10_birchbark_literacy_desc:0 "发扬遍及市井的桦树皮契约书信文化，纂修《诺夫哥罗德司法宪章》，以法治筑牢共和国百年根基。"
 oe_msn_nov_10_birchbark_literacy_req_tt:0 "直接或经由附庸控制诺夫哥罗德，稳定度至少为 12，且处于文艺复兴时代或之后。"
 oe_msn_nov_11_northern_maritime_exchange:0 "波罗的海—北冰洋主权交易所"
 oe_msn_nov_11_northern_maritime_exchange_desc:0 "将诺夫哥罗德波罗的海关署与霍尔莫戈雷白海码头融为一体，打造足以媲美威尼斯与安特卫普的北方海贸枢纽。"
 oe_msn_nov_11_northern_maritime_exchange_req_tt:0 "直接或经由附庸控制诺夫哥罗德与霍尔莫戈雷，拥有至少 350 金币，且处于大发现时代或之后。"
 oe_msn_nov_12_great_republic_north:0 "北方伟大共和国：主权永续巅峰"
 oe_msn_nov_12_great_republic_north_desc:0 "以诺夫哥罗德、普斯科夫、涅瓦河口与霍尔莫戈雷为四极，凭磐石般的维彻共和制度与两海商权，伟大诺夫哥罗德屹立北方永世不朽。"
 oe_msn_nov_12_great_republic_north_req_tt:0 "直接或经由附庸控制诺夫哥罗德、普斯科夫、涅瓦与霍尔莫戈雷，稳定度至少为 18，且处于宗教改革时代或之后。"
 oe_gem1_lit_vytis_lancers:0 "立陶宛大公国追击骑士枪骑兵"
 oe_gem1_lit_vytis_lancers_desc:0 "高举维尔纽斯与特拉凯绯红追击骑士徽帜的重装贵族枪骑兵，兼具波罗的海林地机动力与摧枯拉朽的正面冲击力，专克条顿骑士团与草原骑军。"
 oe_gem1_nov_ushkuiniki_raiders:0 "诺夫哥罗德乌什库伊尼克河道突击队"
 oe_gem1_nov_ushkuiniki_raiders_desc:0 "乘轻吃水乌什库伊长舟纵横涅瓦河、北德维纳河与伏尔加河水系的诺夫哥罗德精锐河道突击手，擅于持斧登岸奇袭与林泽水域机动作战。"
 oe_gem1_dec_lithuanian_statute.title:0 "颁布《立陶宛第一法典》"
 oe_gem1_dec_lithuanian_statute.desc:0 "公元 #Y 1520#! 年后，维尔纽斯大公秘书处已统御波罗的海与罗斯广袤领地；今可将习惯法、等级权利与大公司法主权系统成文化，正式颁行划时代的《立陶宛第一法典》。"
 oe_gem1_dec_lithuanian_statute.a:0 "钤印并颁行《立陶宛法典》"
 oe_gem1_dec_veche_northern_charter.title:0 "颁行大维彻北方商贸宪章"
 oe_gem1_dec_veche_northern_charter.desc:0 "公元 #Y 1380#! 年后，于雅罗斯拉夫庭院通过统一共和商贸宪章，将波罗的海汉萨白银关税与波莫尔白海毛皮盐运船队纳入伟大诺夫哥罗德主权印玺之下。"
 oe_gem1_dec_veche_northern_charter.a:0 "经维彻大会表决批准北方商贸宪章"
 STATIC_MODIFIER_NAME_oe_gem1_mod_lithuanian_statute:0 "《立陶宛第一法典》"
 STATIC_MODIFIER_DESC_oe_gem1_mod_lithuanian_statute:0 "系统严密的文艺复兴成文法典统合波罗的海与罗斯各地法庭，令大公国主权、税收效率与各阶层忠心长治久安。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_veche_northern_charter:0 "大维彻北方商贸宪章"
 STATIC_MODIFIER_DESC_oe_gem1_mod_veche_northern_charter:0 "贯通波罗的海彼得庭关税与波莫尔白海毛皮船队的统一商贸宪章，令诺夫哥罗德市民富足、共和主权稳固。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m1:0 "波罗的海十字军克星"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m1:0 "击碎条顿骑士团对波罗的海海岸的封锁，使立陶宛追击骑士枪骑兵与边防堡垒威震北欧。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m2:0 "波罗的海—黑海罗斯走廊"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m2:0 "兼扼西德维纳河、第聂伯河与黑海入海通道，令维尔纽斯商旅云集、罗斯诸邦贡赋丰沛。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m3:0 "立陶宛大公秘书处复兴"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m3:0 "罗斯公文语成文法典、印刷典籍与三教兼容之政，使维尔纽斯跃居东欧人文思想重镇。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m4:0 "立陶宛双海大公强权"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m4:0 "以成文法典、常胜追击骑士枪骑兵与两海商道统御维尔纽斯、斯摩棱斯克与基辅，加冕立陶宛为欧陆永恒列强。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m1:0 "敕编乌什库伊尼克水上突击军"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m1:0 "严阵以待的河道突击队与波罗的海石堡防线，将诺夫哥罗德水网化作令敌胆寒的天险。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m2:0 "北方大河商权主君"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m2:0 "贯通沃尔霍夫河、北德维纳河、伯朝拉河与伏尔加河上游商网，确立无可匹敌的毛皮与白银霸权。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m3:0 "波罗的海—北冰洋主权商汇"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m3:0 "自涅瓦河口至霍尔莫戈雷的统一关署网络，将整个北欧与极北贸易尽纳诺夫哥罗德行会之手。"
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m4:0 "北方伟大共和国"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m4:0 "自普斯科夫与涅瓦河口绵延至白海与伏尔加河，主权维彻巍然屹立，成为北亚欧最璀璨的商业大共和国。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev1_a:0 "维尔纽斯大公秘书处"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev1_a:0 "罗斯语与拉丁语双语宪章令大公政务畅通无阻，大幅提升维尔纽斯在东欧的外交威望。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev1_b:0 "特拉凯共治边防"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev1_b:0 "敏捷边防斥候与密布河津寨堡使立陶宛西疆稳如磐石。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev2_a:0 "蓝水河常胜铁骑"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev2_a:0 "正面击破金帐汗国铁骑的辉煌胜利，令立陶宛重骑兵士气与突击威势空前高涨。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev2_b:0 "罗斯诸公归附契约"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev2_b:0 "遵循‘旧制不改、新法不苛’之策，令第聂伯河流域罗斯附庸忠心纳贡、拱卫大公。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev3_a:0 "特拉凯湖心石城"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev3_a:0 "环水而筑的特拉凯与考纳斯红砖堡垒，令一切西方入侵陷入漫长消耗战。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev3_b:0 "特拉凯多族亲卫营"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev3_b:0 "忠勇的卡拉伊姆与鞑靼卫队充实了大公兵源，亦彰显立陶宛海纳百川的立国风度。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev4_a:0 "维尔纽斯拉丁教区外交"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev4_a:0 "获欧陆诸国承认后，骑士团再无圣战借口，西欧思潮与文艺复兴亦加速传入立陶宛。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev4_b:0 "维尔纽斯三教和睦敕令"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev4_b:0 "成文信仰宽容将萨莫吉希亚长老、东正罗斯贵族与天主教市民和平凝聚于同一大公冠冕之下。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev5_a:0 "格伦瓦尔德枪骑兵战法"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev5_a:0 "严整机动的佯退反冲战法，使立陶宛重装枪骑兵威震波罗的海平原。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev5_b:0 "斯摩棱斯克铁血方阵"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev5_b:0 "在格伦瓦尔德血战稳住中军的斯摩棱斯克重步兵，为全军树立了钢铁纪律的典范。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev6_a:0 "维陶塔斯大公王冠"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev6_a:0 "卢茨克大会的煌煌盛仪，确立了维尔纽斯自波罗的海至黑海草原无可置疑的主权威仪。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev6_b:0 "霍罗德沃纹章同盟"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev6_b:0 "共享贵族纹章与枢密议席，令立陶宛大贵族与周边盟邦携手同心。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev7_a:0 "法典统一大公法庭"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev7_a:0 "成文法典遏止了封建私税，令大公国掌控力、财政效率与法学研习同步跃升。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev7_b:0 "立陶宛自由与宽容宪章"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev7_b:0 "受法律保障的市民特许与宗教和平，吸引宗教改革时代欧洲各地的工匠、印书师与学者纷至沓来。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev8_a:0 "两海大河商贸联盟"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev8_a:0 "木材、亚麻、谷物与黑海珍货沿戒备森严的立陶宛水路畅行无阻，富甲东欧。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev8_b:0 "海间大公霸主"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev8_b:0 "精锐追击骑士枪骑兵与雄厚罗斯兵源并举，令南北两线群雄皆不敢轻犯。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev9_a:0 "诺夫哥罗德领主议会"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev9_a:0 "老练的市长官与高效市政机构兼顾决断力与共和法统。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev9_b:0 "五区市民行会共治"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev9_b:0 "充满活力的市民行会与手工业坊市为共和国带来充沛商税与繁荣。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev10_a:0 "彼得庭白银协约"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev10_a:0 "统一衡器与毛皮验级标准后，波罗的海白银再度滚滚涌入，而共和国主权丝毫无损。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev10_b:0 "圣约翰蜂蜡毛皮专营会"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev10_b:0 "本土百年商团收回批发厚利，令诺夫哥罗德商队运力与工坊产出倍增。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev11_a:0 "乌什库伊尼克河道突击队"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev11_a:0 "轻捷迅猛的水陆突击队沿北方大河与林间陆运道闪电穿插，令传统封建重兵疲于奔命。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev11_b:0 "沃尔霍夫—伏尔加护航水师"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev11_b:0 "全副武装的共和巡航舰队护卫毛皮与白银船队，大幅提升海河商路控制力。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev12_a:0 "桦树皮市民学风"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev12_a:0 "遍及市井的识字与簿记素养，极大推动了共和国的学术革新与文化底蕴。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev12_b:0 "诺夫哥罗德司法宪章"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev12_b:0 "公开透明的陪审法庭与成文诉讼章程平息派系纷争，显著提升行省治理效率。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev13_a:0 "波莫尔科奇破冰船队"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev13_a:0 "抗冰耐航的波莫尔船厂助力诺夫哥罗德向极北边陲疾速开拓与建港。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev13_b:0 "白海海盐与黑貂商团"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev13_b:0 "规范化的北方盐业与毛皮拍卖行源源输出高价货品，充盈国库。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev14_a:0 "涅瓦—普斯科夫冬防铁壁"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev14_a:0 "层叠石堡与冰封沼泽防线令一切来犯大军在严冬补给线上血流成河。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev14_b:0 "诺夫哥罗德常备共和卫军"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev14_b:0 "领薪常备军官将市民民兵与乌什库伊尼克老兵整训成能征善战的共和劲旅。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev15_a:0 "北方主权海军部"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev15_a:0 "精良的波罗的海护航舰与白海巡弋编队将诺夫哥罗德海权遍布两海。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev15_b:0 "北方海贸自由清算宪章"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev15_b:0 "与尼德兰、英格兰及波罗的海商行直连清算，令诺夫哥罗德商埠冠绝北欧。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev16_a:0 "全罗斯联邦共和国"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev16_a:0 "宪章市议会与高效融合体制，使每一片归附公国皆化作繁荣兴盛的共和盟邦。"
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev16_b:0 "圣索菲亚共和大战旗"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev16_b:0 "铁血共和军纪与昂扬市民荣誉向世人证明，自由公民之师足以胜过一切专制帝国。"
 oe_gem1.1.title:0 "维尔纽斯与特拉凯的格迪米纳斯秘书处"
 oe_gem1.1.desc:0 "阿尔吉尔达斯坐镇维尔纽斯执掌大公大位，凯斯图蒂斯据守特拉凯屏障西疆，通晓罗斯公文语、拉丁文与德文的书吏云集朝廷，治理横跨波罗的海与罗斯的广袤疆域。大公秘书处今日之取向，将决定维尔纽斯是以法度外交统御天下，抑或以边塞铁骑定鼎东欧。"
 oe_gem1.1.a:0 "扩建维尔纽斯多语种大公秘书处"
 oe_gem1.1.b:0 "强化特拉凯西疆共治军政体制"
 oe_gem1.2.title:0 "蓝水河大捷"
 oe_gem1.2.desc:0 "在蓝水河畔，立陶宛与罗斯联军一举击溃金帐汗国三路万户精骑。随着第聂伯河谷的草原贡赋体系崩解，基辅、波多利亚与膏腴黑土平原尽向维尔纽斯敞开大门。"
 oe_gem1.2.a:0 "挥动重骑兵跨过第聂伯河乘胜追击"
 oe_gem1.2.b:0 "册封罗斯诸公自治以稳固南疆附庸"
 oe_gem1.3.title:0 "特拉凯湖心石堡"
 oe_gem1.3.desc:0 "数十年来条顿骑士团连绵不断的远征，让立陶宛深知木栅山寨已难挡攻城重械。匠师正于加尔韦湖礁岛筑起红砖石堡，与此同时，受邀迁居的卡拉伊姆人与鞑靼武士亦愿效忠大公、担任亲卫。"
 oe_gem1.3.a:0 "倾力建成红砖湖心堡垒与护城工事"
 oe_gem1.3.b:0 "于特拉凯特许卡拉伊姆与鞑靼亲卫屯垦"
 oe_gem1.4.title:0 "维尔纽斯受洗抑或三教并蓄"
 oe_gem1.4.desc:0 "西疆面临拉丁欧洲支持的条顿十字军压境，境内又聚居数以百万计的东正教罗斯臣民，维尔纽斯立于决定国运的信仰十字路口。接受天主教洗礼可釜底抽薪剥夺骑士团征讨借口并开启西方王冠之门，然调和波罗的海旧俗、东正教与天主教三方平衡，仍是社稷安泰之本。"
 oe_gem1.4.a:0 "奉行维尔纽斯受洗并融入拉丁外交体系"
 oe_gem1.4.b:0 "颁布异教、东正与天主三教和睦敕令"
 oe_gem1.5.title:0 "格伦瓦尔德雷霆大捷"
 oe_gem1.5.desc:0 "在四十面绣有追击骑士与格迪米纳斯立柱徽纹的战旗下，维陶塔斯大公率领立陶宛铁骑、萨莫吉希亚勇士与三支斯摩棱斯克精锐步兵挺进格伦瓦尔德原野。诈败回马枪与岿然不动的罗斯方阵合力碾碎条顿骑士团，铸就中世纪欧洲最震撼的决战之一。"
 oe_gem1.5.a:0 "将维陶塔斯追击骑士诈败包抄战术载入军典"
 oe_gem1.5.b:0 "嘉奖死战不退的斯摩棱斯克步兵团"
 oe_gem1.6.title:0 "卢茨克大会与维陶塔斯王冠"
 oe_gem1.6.desc:0 "诸国君王、帝国使节、教廷特使与草原诸汗齐聚卢茨克城堡，展开历时十三周的盛大外交大会。面对将立陶宛升格为独立王国的金冠邀约，维尔纽斯必须在彰显大公至高主权与深化霍罗德沃贵族纹章同盟之间作出决断。"
 oe_gem1.6.a:0 "宣示立陶宛宝座的独立王者尊严"
 oe_gem1.6.b:0 "深化霍罗德沃贵族纹章互盟体制"
 oe_gem1.7.title:0 "《立陶宛法典》纂修成书"
 oe_gem1.7.desc:0 "大公秘书处法学家呈上以罗斯公文语纂修的宏伟成文法典，将君主权责、产权保护、刑狱程序与信仰和平熔为一炉。放眼十六世纪欧洲，鲜有王国拥有如此系统严密的成文法治基石。"
 oe_gem1.7.a:0 "推行全境统一大公法庭与地籍税法"
 oe_gem1.7.b:0 "将市民自由与多教派和平写入法典总纲"
 oe_gem1.8.title:0 "波罗的海至黑海的东欧霸权"
 oe_gem1.8.desc:0 "从涅曼河与西德维纳河的琥珀商港与木筏船队，到基辅与南方大草原的丰饶粮仓，立陶宛大公国已成长为横贯欧陆的巨擘。维尔纽斯如今面临抉择：是将黄金世纪铸就为两海商贸枢纽，抑或成为傲视东欧的武勋霸主。"
 oe_gem1.8.a:0 "将第聂伯—涅曼水系打造成两海商贸通衢"
 oe_gem1.8.b:0 "以大公常胜雄师宣示东欧武勋霸权"
 oe_gem1.9.title:0 "大维彻大会的钟声"
 oe_gem1.9.desc:0 "当青铜大钟在雅罗斯拉夫庭院上空鸣响，来自诺夫哥罗德五区的波雅尔贵族、行会商人与自由工匠涌过沃尔霍夫大桥。露天大会推举市长官与千夫长，再度印证那句古老豪言：谁能抵挡上帝与伟大诺夫哥罗德主君？"
 oe_gem1.9.a:0 "强化领主议会与市长官施政效率"
 oe_gem1.9.b:0 "扩大商人与工匠在维彻大会中的议政权"
 oe_gem1.10.title:0 "汉萨彼得庭商站争端"
 oe_gem1.10.desc:0 "在彼得庭商站木栅之内，吕贝克与哥特兰商行抱怨诺夫哥罗德的蜂蜡验货与河道关税，扬言发动波罗的海贸易禁运；而诺夫哥罗德的蜂蜡与黑貂皮商团反指汉萨白银成色不足，要求夺回沃尔霍夫码头的主导权。"
 oe_gem1.10.a:0 "与汉萨同盟缔结对等白银贸易协约"
 oe_gem1.10.b:0 "强制推行本土蜂蜡与毛皮行会专营权"
 oe_gem1.11.title:0 "乌什库伊尼克河道舰队扬帆"
 oe_gem1.11.desc:0 "数十艘轻捷浅吃水的乌什库伊长舟顺流南下，直指科斯特罗马、下诺夫哥罗德与伏尔加中游。这支由豪门资助、悍勇水手驾驭的河道奇兵，既可深入陆权劲敌腹地奇袭立威，亦可转为护航船队清剿河匪。"
 oe_gem1.11.a:0 "将乌什库伊尼克编为锐利河道突击军团"
 oe_gem1.11.b:0 "敕命乌什库伊尼克转型商路护航水师"
 oe_gem1.12.title:0 "桦树皮识字潮与圣索菲亚书院"
 oe_gem1.12.desc:0 "与羊皮纸唯修院独享的诸邦迥异，诺夫哥罗德寻常商贩、匠人与主妇皆以银白桦树皮记账立契、书呈诉状、课徒识字。在圣索菲亚大主教座堂资助下，这场市民识字浪潮正孕育北方独特的法治与史学复兴。"
 oe_gem1.12.a:0 "捐建圣索菲亚市民学堂与编年史抄经院"
 oe_gem1.12.b:0 "为五区颁行成文《诺夫哥罗德司法宪章》"
 oe_gem1.13.title:0 "波莫尔人白海破冰远航"
 oe_gem1.13.desc:0 "霍尔莫戈雷的波莫尔造船匠研制成圆底科奇冰海帆船，遇浮冰挤压可借弧形船体上浮脱险。他们扬帆驶过白海，挺进科拉半岛、梅津与伯朝拉河口，开辟蕴藏海象牙、海盐与尤格拉黑貂皮的极北边疆。"
 oe_gem1.13.a:0 "资助波莫尔科奇船厂与极北拓殖特许状"
 oe_gem1.13.b:0 "兴办白海盐场与伯朝拉毛皮集市"
 oe_gem1.14.title:0 "涅瓦防线与舍隆河危机"
 oe_gem1.14.desc:0 "南方专制王权的铁骑与芬兰湾敌对舰队同时逼近，考验着自由的罗斯共和国能否在常备军时代屹立不倒。维彻大会必须当机立断：是依托涅瓦与普斯科夫的冬日要塞耗垮强敌，抑或编练一支严阵以待的共和常备军。"
 oe_gem1.14.a:0 "全面加固奥列舍克、科波里耶与普斯科夫冬防要塞"
 oe_gem1.14.b:0 "整编严明高效的共和国常备市民军"
 oe_gem1.15.title:0 "北海与白海航运宪章"
 oe_gem1.15.desc:0 "当大西洋帆船绕过挪威北角探寻东方航路、波罗的海商邦竞相求购罗斯舰船木材、大麻与毛皮之时，兼扼涅瓦与白海双门的诺夫哥罗德已掌握时代枢机。颁行宏伟的《北方海运宪章》，将使共和国跃升为海洋强权。"
 oe_gem1.15.a:0 "设立波罗的海—白海主权海军部"
 oe_gem1.15.b:0 "于诺夫哥罗德与霍尔莫戈雷开设自由国际清算所"
 oe_gem1.16.title:0 "全罗斯主权共和国"
 oe_gem1.16.desc:0 "出乎一切君主与大汗之意料，圣索菲亚的青铜维彻钟依然在北亚欧大地自由长鸣。从芬兰湾、白海直至伏尔加河上游，万千城镇仰望诺夫哥罗德，视其为宪章自治与共和法治的灯塔。"
 oe_gem1.16.a:0 "宣告自由城镇联邦共和国成立"
 oe_gem1.16.b:0 "高举圣索菲亚共和大战旗威临欧亚"
