# NEW 2026-11-22 v11.5 Worker 1 (oe_per_). Generated by gen_v115_persia.py; edit the generator, not this file.
 oe_per_isfahan_hikmat_school: "伊斯法罕哲学院派"
 oe_per_isfahan_hikmat_school_desc: "以穆拉·萨德拉为代表的伊斯法罕学者，把哲学思辨、神秘主义与经院神学熔于一炉。"
 oe_per_samarkand_zij_school: "撒马尔罕星表学派"
 oe_per_samarkand_zij_school_desc: "兀鲁伯在撒马尔罕建起天文台，召集学者测星制表，这一派重实测与算学。只有波斯与中亚的国家可以采用。"
 oe_per_naqsh_e_jahan_complex: "王家广场与商队学院"
 oe_per_naqsh_e_jahan_complex_desc: "环绕大广场的清真寺、经学院、巴扎与商队客栈。只能建在伊斯法罕、撒马尔罕、赫拉特、大不里士、设拉子与加兹温，每地一座；建在首都时另有全国加成。需要“伊斯法罕丝织工场”科技。"
 oe_per_naqsh_e_jahan_complex_maint: "日常维护"
 oe_per_royal_army_law: "伊朗军制"
 oe_per_royal_army_law_desc: "王的军队靠谁：是各部族的红头军旗，还是直属于王的常备三军。"
 oe_per_pol_qizilbash_banners: "红头部族军旗"
 oe_per_pol_qizilbash_banners_desc: "各部首领率本部骑兵出征，以封邑为酬。骑兵骁勇，但只听首领的号令。"
 oe_per_pol_abbas_triad_corps: "常备三军"
 oe_per_pol_abbas_triad_corps_desc: "由王直接供养的古拉姆近卫、火枪兵与炮兵，以王领的收入发饷。"
 oe_per_silk_monopoly_law: "生丝与商路"
 oe_per_silk_monopoly_law_desc: "里海沿岸的生丝是这个国家最值钱的出产。由谁来卖？"
 oe_per_pol_khassa_silk_monopoly: "王领生丝专卖"
 oe_per_pol_khassa_silk_monopoly_desc: "产丝各省划为王领，生丝只许卖给王的代理人。"
 oe_per_pol_new_julfa_guilds: "商帮特许"
 oe_per_pol_new_julfa_guilds_desc: "把生丝贸易交给信誉卓著的亚美尼亚等各族商帮，他们的商路远达海外。"
 oe_per_timurid_chancery_reform: "文治枢密院"
 oe_per_timurid_chancery_reform_desc: "仿撒马尔罕与赫拉特的宫廷，用精通波斯文与突厥文的文士掌管文书与财赋。"
 oe_per_shahanshah_eranshahr_reform: "万王之王"
 oe_per_shahanshah_eranshahr_reform_desc: "重拾伊朗古王的名号与礼仪，君临各族各教。"
 oe_per_priv_qizilbash_tiyul: "红头军封邑"
 oe_per_priv_qizilbash_tiyul_desc: "把各省的税收划给红头军首领，作为他们养兵的封邑。兵多了，王权弱了。"
 oe_per_priv_armenian_julfa_factors: "丝商特权"
 oe_per_priv_armenian_julfa_factors_desc: "准许亚美尼亚丝商自设街区、自理诉讼、自由礼拜，换取他们为王经营生丝。"
 oe_per_adv_zij_sultani: "苏丹星表"
 oe_per_adv_zij_sultani_desc: "在撒马尔罕的天文台上重测千余颗恒星的位置，编成当时最精确的星表。"
 oe_per_adv_chaldiran_gunpowder: "火器军改"
 oe_per_adv_chaldiran_gunpowder_desc: "骑兵在炮车与火绳枪前吃了大亏之后，开始铸炮、练火枪兵。"
 oe_per_adv_ghulam_standing_corps: "古拉姆常备军"
 oe_per_adv_ghulam_standing_corps_desc: "从高加索等地招来的王家奴仆，自幼受训，只效忠于王。"
 oe_per_adv_isfahan_silk_factories: "伊斯法罕丝织工场"
 oe_per_adv_isfahan_silk_factories_desc: "王家工场、巴扎与商队客栈连成一体。解锁建筑“王家广场与商队学院”。"
 oe_per_player_only_tt: "只有玩家操控的国家可以使用"
 oe_per_dec_patronize_samarkand_herat.title: "兴建天文台与画院"
 oe_per_dec_patronize_samarkand_herat.desc: "在撒马尔罕建天文台，在赫拉特设宫廷画院。需要拥有两城之一；花费 150 金币，提升文艺鼎盛度 20，效果持续 15 年。"
 oe_per_dec_patronize_samarkand_herat.a: "动工"
 oe_per_dec_abbas_triad_reform.title: "创立常备三军"
 oe_per_dec_abbas_triad_reform.desc: "设立直属于王的古拉姆近卫、火枪兵与炮兵。需要“火器军改”科技；花费 200 金币，军制轴向常备军一侧移动 30，效果持续 15 年。"
 oe_per_dec_abbas_triad_reform.a: "颁行"
 oe_per_dec_isfahan_nisf_e_jahan.title: "营建伊斯法罕新都"
 oe_per_dec_isfahan_nisf_e_jahan.desc: "在伊斯法罕营建大广场、四花园大道与王家工场，并在首都市场上掀起一阵丝绸热。需要拥有伊斯法罕；花费 250 金币，效果持续 20 年。"
 oe_per_dec_isfahan_nisf_e_jahan.a: "营建"
 oe_per_dec_hormuz_gulf_expedition.title: "收复波斯湾口"
 oe_per_dec_hormuz_gulf_expedition.desc: "集结兵船，夺回波斯湾口的航权。需要有港口，并且已有欧洲人在印度洋推行通行证制度，或已到 1600 年；花费 200 金币，效果持续 20 年。"
 oe_per_dec_hormuz_gulf_expedition.a: "出兵"
 oe_per.1.title: "伊儿汗国的遗产"
 oe_per.1.desc: "伊儿汗国已经名存实亡，大不里士、巴格达、设拉子与赫拉特各有其主，人人都自称正统。我们打算怎么做？"
 oe_per.1.a: "打出伊儿汗的旗号"
 oe_per.1.b: "先把自己的地方治理好"
 oe_per.2.title: "撒马尔罕还是赫拉特"
 oe_per.2.desc: "河中名城撒马尔罕坐拥清真经学院与群星璀璨的天文台，乃学术与律法重镇；呼罗珊明珠赫拉特则花园锦簇、诗画流芳，汇集天下文豪与巧匠。两座绝代名城各有千秋，朝廷资源有限，究竟要倾力垂青哪一座以作帝国文教之冠？"
 oe_per.2.a: "撒马尔罕：学者与天文台"
 oe_per.2.b: "赫拉特：诗人与画师"
 oe_per.3.title: "星表告成"
 oe_per.3.desc: "皇家天文台的巨型石砌六分仪与观测铜仪历经多年寒暑运转，众位天文学家与算学家终于精准测定了千余颗恒星的经纬方位，编纂成这部空前完备的崭新星表。如此旷世绝学，究竟该广抄颁行天下学界，还是密藏深宫作为王室独享？"
 oe_per.3.a: "抄送各地学者，奉星表学派为宗"
 oe_per.3.b: "藏于宫中"
 oe_per.4.title: "宫廷画院"
 oe_per.4.desc: "宫廷画院近来发现一位才华横溢的年轻画师，他笔下的细密画构图精妙、设色瑰丽如宝石，人物神态纤毫毕现，一经呈献便令满朝文武叹为观止。画院总管恳切奏请将其破格留侍宫中，赐予丰厚供养并为他广收门徒以光大画风。"
 oe_per.4.a: "厚加供养"
 oe_per.4.b: "照常例即可"
 oe_per.5.title: "红帽誓盟"
 oe_per.5.desc: "一个教团在山地各部中声势日盛，部族骑士戴上十二褶红帽，誓为导师效死。他们可以成为一支劲旅，也可能成为国中之国。"
 oe_per.5.a: "收为己用"
 oe_per.5.b: "敬而远之"
 oe_per.6.title: "火炮的教训"
 oe_per.6.desc: "前线传来消息：敌人把炮车连成一线，火绳枪齐射，我们最好的骑兵冲不过去。将领们争论该怎么办。"
 oe_per.6.a: "铸炮，练火枪兵"
 oe_per.6.b: "骑兵仍是根本"
 oe_per.7.title: "王与红头军"
 oe_per.7.desc: "由王室直接募饷、配发火枪与重炮的新军军团已经初具规模，操演井然有序。世代拥兵自重的红头军部族首领们敏锐察觉这支直属君主的劲旅正是冲着削弱他们权势而来，营帐之间暗流涌动，已有数位大酋长在暗中串联图谋生变。"
 oe_per.7.a: "削其封邑，以新军弹压"
 oe_per.7.b: "新旧并用"
 oe_per.8.title: "迁都伊斯法罕"
 oe_per.8.desc: "新都落成。大广场上马球与夜市相接，四花园大道直通河上的长桥。人们说，伊斯法罕就是半个天下。"
 oe_per.8.a: "举行盛典"
 oe_per.8.b: "一切从简"
 oe_per.9.title: "丝商迁入新城"
 oe_per.9.desc: "一批亚美尼亚丝商携家带口迁到都城河对岸，请求划地建城、自理教务。他们的商路从这里一直通到远方的海港。"
 oe_per.9.a: "划地，给予特许"
 oe_per.9.b: "照章纳税即可"
 oe_per.10.title: "伊斯法罕的哲人"
 oe_per.10.desc: "都城的经学院里出了一位大哲，他的学说把理性的论证与心灵的体悟合而为一，听讲的人挤满了庭院。"
 oe_per.10.a: "奉为官学"
 oe_per.10.b: "听其自便"
 oe_per.11.title: "海湾之战"
 oe_per.11.desc: "旨在夺取波斯湾战略咽喉的远征船队与登岸精兵已在沿海港湾集结完毕，万事俱备。就在起锚前夕，几家觊觎海湾商路的外国大商行遣使登门，愿派出装配重炮的远洋商船助战夺岛，唯一条件是战后须与他们按成分享港口关税。"
 oe_per.11.a: "联合他们，一举夺港"
 oe_per.11.b: "只用自己的兵船"
 oe_per.12.title: "王冠与名号"
 oe_per.12.desc: "历经连年开疆拓土，王国如今版图广袤、府库充盈，威震西亚与高原四方。朝堂之上重臣与史官展开热烈议论：值此中兴鼎盛之际，君主究竟该承续昔日伊儿汗驰骋欧亚的草原法统，还是重拾上古波斯诸王的伊朗沙赫至尊王冠？"
 oe_per.12.a: "伊朗沙赫"
 oe_per.12.b: "伊儿汗的继承者"
 oe_per.13.title: "萨迈拉的古寺"
 oe_per.13.desc: "屹立在底格里斯河畔萨迈拉古城、以宏伟螺旋宣礼塔闻名天下的大清真寺历经数百年风雨侵蚀，如今砖石斑驳、围墙倾颓，早已不复阿拔斯盛世旧观。当地长老与阿訇联名上书，恳请朝廷念及古迹威仪，拨出专款修缮这座伊斯兰世界瑰宝。"
 oe_per.13.a: "拨款修缮"
 oe_per.13.b: "国用不足，暂缓"
 oe_per.14.title: "兴都库什以南"
 oe_per.14.desc: "扼守兴都库什山南麓要冲的喀布尔已牢牢握于我军掌中，往南越过险峻山口，便是沃野千里、金银如山的印度斯坦大平原。探马回报，那里的诸苏丹国虽富庶繁华却彼此攻伐、内部分裂，帐下悍将纷纷摩拳擦掌，恳请大王下令整军南下。"
 oe_per.14.a: "整军南望"
 oe_per.14.b: "守住山口就够了"
 oe_per.90.title: "【读数】波斯与中亚"
 oe_per.90.desc: "v11.5 波斯与中亚读数（1 = 是，0 = 否）：\n· 本国是战区主角 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_protagonist')|0]#!，槽位 90 已运行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_pulses')|0]#! 次\n· 文艺鼎盛度 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_renaissance')|0]#!（0 至 100），军制轴 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_axis')|0]#!（负为红头军旗，正为常备军）\n· 已有红头军征召科技 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_levies')|0]#!，印度洋通行证制度已推行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_cartaz')|0]#!"
 oe_per.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_per_timurid_renaissance_mod: "文艺鼎盛"
 STATIC_MODIFIER_DESC_oe_per_timurid_renaissance_mod: "宫廷里学者、诗人与画师云集。"
 STATIC_MODIFIER_NAME_oe_per_patronage_mod: "天文台与画院"
 STATIC_MODIFIER_DESC_oe_per_patronage_mod: "王室出资供养天文台与画院。"
 STATIC_MODIFIER_NAME_oe_per_qizilbash_oath_mod: "红帽誓盟"
 STATIC_MODIFIER_DESC_oe_per_qizilbash_oath_mod: "各部骑士头戴十二褶红帽，誓为教团效死。"
 STATIC_MODIFIER_NAME_oe_per_qizilbash_banner_mod: "红头军旗下"
 STATIC_MODIFIER_DESC_oe_per_qizilbash_banner_mod: "军制偏重部族军旗，红头军征召兵尤为得力。"
 STATIC_MODIFIER_NAME_oe_per_ghulam_corps_mod: "王的常备军"
 STATIC_MODIFIER_DESC_oe_per_ghulam_corps_mod: "军制偏重直属于王的常备军。"
 STATIC_MODIFIER_NAME_oe_per_triad_corps_mod: "三军改制"
 STATIC_MODIFIER_DESC_oe_per_triad_corps_mod: "古拉姆、火枪兵与炮兵三军新立。"
 STATIC_MODIFIER_NAME_oe_per_nisf_e_jahan_mod: "半天下"
 STATIC_MODIFIER_DESC_oe_per_nisf_e_jahan_mod: "新都的广场、大道与花园，令远来的商旅惊叹。"
 STATIC_MODIFIER_NAME_oe_per_gulf_reclaimed_mod: "海湾重开"
 STATIC_MODIFIER_DESC_oe_per_gulf_reclaimed_mod: "波斯湾口的航路重新掌握在自己手里。"
 STATIC_MODIFIER_NAME_oe_per_eranshahr_crown_mod: "伊朗沙赫的王冠"
 STATIC_MODIFIER_DESC_oe_per_eranshahr_crown_mod: "君主以伊朗古王的继承者自居。"
 STATIC_MODIFIER_NAME_oe_per_full_ai_mod: "波斯强邻"
 STATIC_MODIFIER_DESC_oe_per_full_ai_mod: "规则“强化电脑对手”给予的加成。"
