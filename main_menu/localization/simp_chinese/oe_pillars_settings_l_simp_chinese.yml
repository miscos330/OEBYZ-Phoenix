 oe_pillars_debug.1.d: "此处用于手动测试游戏机制。\n\n“增加革命呼声”只在“革命的钟声”局势进行时显示；每次点击增加10点呼声，计入变化记录，并重新打开本菜单。呼声仍以100为上限。\n\n“返回”关闭此事件，不产生任何效果。"
