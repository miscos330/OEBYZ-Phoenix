l_simp_chinese:
 OE_CW2_ST_REBELS: "#R 叛军#!"
 OE_CW2_ST_CROWN: "#G 朝廷#!"
 OE_CW2_ST_FOREIGN: "外国"
 OE_CW2_SIDE_1: "我们是坎塔库泽诺斯一方：大势降到#Y 0#!我们获胜，升到#Y 100#!或叛军控制君士坦丁堡满#Y 3#!个月，约翰五世获胜。"
 OE_CW2_SIDE_2: "我们是约翰五世一方：大势升到#Y 100#!我们获胜，降到#Y 0#!或叛军控制君士坦丁堡满#Y 3#!个月，马修获胜。"
 STATIC_MODIFIER_NAME_oe_cw2_tzympe: "津佩堡的奥斯曼驻军"
 STATIC_MODIFIER_NAME_oe_cw2_gattilusio_fief: "加蒂卢西奥的封地"
 STATIC_MODIFIER_NAME_oe_cw2_concord: "勉强的和睦"
 STATIC_MODIFIER_NAME_oe_cw2_divided: "两帝分治"
 OE_CW2_REBELS_PAL: "巴列奥略派"
 OE_CW2_REBELS_PAL_country: "巴列奥略派"
 OE_CW2_REBELS_PAL_country_adjective: "巴列奥略派"
 OE_CW2_REBELS_KAN: "马修派"
 OE_CW2_REBELS_KAN_country: "马修派"
 OE_CW2_REBELS_KAN_country_adjective: "马修派"
 oe_cw2_war: "第二次内战"
 oe_cw2_war_desc: "约翰五世和坎塔库泽诺斯家族又打起来了：一边有威尼斯人的钱、杜尚的骑兵和热那亚冒险家的船，一边有奥斯曼援军。\n\n[GetCountry('BYZ').Custom('OeCw2Side')]\n大势：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_tide').GetValue|0]#! / #Y 100#!（#Y 100#! = 巴列奥略一方获胜，#Y 0#! = 坎塔库泽诺斯家族获胜）　已打了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#!个月\n大势每月随下面八座城的控制权变化（括号里是分量），外援也会推动它：\n君士坦丁堡（#Y 4#!）：[GetCountry('BYZ').Custom('OeCw2City_constantinople')]\n阿德里安堡（#Y 3#!）：[GetCountry('BYZ').Custom('OeCw2City_edirne')]\n狄迪摩提洪（#Y 2#!）：[GetCountry('BYZ').Custom('OeCw2City_demotica')]\n科莫蒂尼（#Y 1#!）：[GetCountry('BYZ').Custom('OeCw2City_komotini')]\n图拉真波利斯（#Y 1#!）：[GetCountry('BYZ').Custom('OeCw2City_traianopolis')]\n锡林布里亚（#Y 1#!）：[GetCountry('BYZ').Custom('OeCw2City_silivri')]\n四十教堂城（#Y 1#!）：[GetCountry('BYZ').Custom('OeCw2City_kirklareli')]\n比齐耶（#Y 1#!）：[GetCountry('BYZ').Custom('OeCw2City_vize')]\n\n打满#Y 4#!年，双方划界分治。"
 oe_cw2.1.t: "马修的不满"
 oe_cw2.1.desc: "长子#color_yellow;bold 马修#!本以为父亲登基后，皇位迟早是自己的。可当年的和约写得明白：约翰五世才是继承人。马修在宫里摔门而去，坎塔库泽诺斯家的老部下也在替马修抱不平。"
 oe_cw2.1.a: "把色雷斯东部封给马修"
 oe_cw2.1.a.tt: "#R 裂痕 +10#!（到#Y 60#!就会开战）\n马修得到以阿德里安堡为中心的封地，兼守塞尔维亚边境；巴列奥略家的人看在眼里"
 oe_cw2.1.b: "劝马修忍耐"
 oe_cw2.1.b.tt: "#G 裂痕 −5#!（到#Y 60#!就会开战）"
 oe_cw2.2.t: "约翰五世的封地"
 oe_cw2.2.desc: "约翰五世已经#Y [SCOPE.sCharacter('oe_cw2_j5').GetAgeInYears]#!岁，娶了皇帝的女儿，却仍像个人质一样住在宫里。巴列奥略家的旧臣劝约翰五世离开京城，到色雷斯西部去，有自己的封地和兵马。"
 oe_cw2.2.a: "让约翰五世去色雷斯西部"
 oe_cw2.2.a.tt: "#G 裂痕 −10#!（到#Y 60#!就会开战）\n约翰五世得到埃夫罗斯河下游的封地；一旦开战，那里会成为约翰五世的根据地"
 oe_cw2.2.b: "把约翰五世留在京城"
 oe_cw2.2.b.tt: "#R 裂痕 +10#!（到#Y 60#!就会开战）"
 oe_cw2.3.t: "威尼斯人的借款"
 oe_cw2.3.desc: "威尼斯的银行家看准了帝国的裂痕，愿意借给约翰五世一大笔钱，抵押是#color_yellow;bold 特内多斯#!岛，那座岛扼守着达达尼尔海峡的入口。有了这笔钱，谁都能招兵买马。"
 oe_cw2.3.a: "默许"
 oe_cw2.3.a.tt: "#R 裂痕 +15#!（到#Y 60#!就会开战）\n约翰五世有了自己的军费；一旦开战，每月#R 大势 +0.5#!"
 oe_cw2.3.b: "出面阻止"
 oe_cw2.3.b.tt: "#G 裂痕 −5#!（到#Y 60#!就会开战）"
 oe_cw2.3.c: "借下这笔钱"
 oe_cw2.3.c.tt: "#R 裂痕 +10#!（到#Y 60#!就会开战）\n坎塔库泽诺斯家族认定皇帝在招兵买马；一旦开战，每月#G 大势 +0.5#!"
 oe_cw2.3.d: "婉拒"
 oe_cw2.3.d.tt: "#G 裂痕 −5#!（到#Y 60#!就会开战）"
 oe_cw2.4.t: "两位皇帝"
 oe_cw2.4.desc: "帝国有两位皇帝，可只有一顶皇冠能传下去。约翰五世一天天长大，每当经过街市，百姓都向这位年轻的皇帝欢呼；马修的部下则说，坎塔库泽诺斯家打下的江山，凭什么让给巴列奥略。皇帝要做决定了。"
 oe_cw2.4.a: "退位，让约翰五世独掌帝国"
 oe_cw2.4.a.tt: "约翰六世退位出家，法名约阿萨夫；约翰五世成为唯一的皇帝；不打内战"
 oe_cw2.4.b: "立马修为共治皇帝"
 oe_cw2.4.b.tt: "#R 裂痕 +25#!（到#Y 60#!就会开战）\n马修成为共治皇帝，坎塔库泽诺斯家族的继承有了名分"
 oe_cw2.4.c: "厚赏约翰五世，稳住局面"
 oe_cw2.4.c.tt: "#G 裂痕 −15#!（到#Y 60#!就会开战）"
 oe_cw2.5.t: "坎塔库泽诺斯家的天下"
 oe_cw2.5.desc: "约翰五世已经#Y [SCOPE.sCharacter('oe_cw2_j5').GetAgeInYears]#!岁，早已亲政，可朝中要职仍握在#color_yellow;bold 坎塔库泽诺斯#!家的人手里。老摄政不再上朝，府上却天天有人去请示。皇帝的旧臣劝皇帝把权力收回来。"
 oe_cw2.5.a: "收回实权"
 oe_cw2.5.a.tt: "#R 裂痕 +15#!（到#Y 60#!就会开战）\n坎塔库泽诺斯家族影响力#G −100#!"
 oe_cw2.5.b: "让坎塔库泽诺斯家继续掌权"
 oe_cw2.5.b.tt: "#G 裂痕 −10#!（到#Y 60#!就会开战）\n#R [oe_tu_authority|e] −3#!"
 oe_cw2.6.t: "马修的封地"
 oe_cw2.6.desc: "坎塔库泽诺斯的长子#color_yellow;bold 马修#!要一块自己的封地：以阿德里安堡为中心的色雷斯东部，名义上替帝国守塞尔维亚边境。谁都看得出来，有了封地，马修就有了自己的兵。"
 oe_cw2.6.a: "封给马修"
 oe_cw2.6.a.tt: "#G 裂痕 −10#!（到#Y 60#!就会开战）\n马修得到以阿德里安堡为中心的封地；#R 一旦开战，那里会成为马修的根据地#!"
 oe_cw2.6.b: "拒绝"
 oe_cw2.6.b.tt: "#R 裂痕 +15#!（到#Y 60#!就会开战）"
 oe_cw2.7.t: "约翰五世起兵"
 oe_cw2.7.desc: "约翰五世在色雷斯西部举起了巴列奥略家的旗帜。威尼斯人的钱、杜尚的许诺，还有京城里对坎塔库泽诺斯家越来越多的怨言，都站在约翰五世一边。第二次内战开始了。"
 oe_cw2.7.a: "内战又开始了"
 oe_cw2.7.a.tt: "约翰五世带着色雷斯西部起兵，局势“第二次内战”开始"
 oe_cw2.8.t: "马修称帝"
 oe_cw2.8.desc: "马修在阿德里安堡被部下拥立为皇帝，马修的父亲在京城一言不发。坎塔库泽诺斯家族不肯把打下来的江山交出去，第二次内战开始了。"
 oe_cw2.8.a: "内战又开始了"
 oe_cw2.8.a.tt: "马修带着色雷斯东部起兵，局势“第二次内战”开始"
 oe_cw2.9.t: "勉强的和睦"
 oe_cw2.9.desc: "裂痕终究没有撕开。两家在宫中议定各守本分，帝国暂时躲过了第二场内战。可谁都知道，这份和睦是靠彼此提防维持的。"
 oe_cw2.9.a: "但愿能维持下去"
 oe_cw2.9.a.tt: "获得 [ShowModifier('oe_cw2_concord')]，持续#Y 10#!年"
 oe_cw2.10.t: "苏莱曼渡海"
 oe_cw2.10.desc: "奥尔汗的儿子#color_yellow;bold 苏莱曼#!带着一万奥斯曼兵渡过海峡，来帮坎塔库泽诺斯家族。奥斯曼兵替坎塔库泽诺斯家打回了色雷斯的城镇，顺手也把它们洗劫一空。苏莱曼要的报酬，是加里波利半岛上的#color_yellow;bold 津佩堡#!。"
 oe_cw2.10.a: "把津佩堡给苏莱曼"
 oe_cw2.10.a.tt: "#G 大势 −15#!（有利于坎塔库泽诺斯家族）\n奥斯曼援军站在我们一边（每月#G 大势 −1.5#!）\n加里波利获得 [ShowModifier('oe_cw2_tzympe')]：奥斯曼人从此在欧洲有了立足点"
 oe_cw2.10.b: "只付金币"
 oe_cw2.10.b.tt: "#G 大势 −8#!（有利于坎塔库泽诺斯家族）\n奥斯曼援军帮一年就走（每月#G 大势 −0.5#!）"
 oe_cw2.10.c: "出钱请奥尔汗收兵"
 oe_cw2.10.c.tt: "奥斯曼人不再插手这场内战"
 oe_cw2.10.d: "无力阻止"
 oe_cw2.10.d.tt: "#R 大势 −15#!（有利于坎塔库泽诺斯家族）\n奥斯曼援军站在坎塔库泽诺斯家族一边（每月#R 大势 −1.5#!）\n加里波利获得 [ShowModifier('oe_cw2_tzympe')]：奥斯曼人从此在欧洲有了立足点"
 oe_cw2.11.t: "杜尚的骑兵"
 oe_cw2.11.desc: "斯特凡·杜尚派了四千塞尔维亚骑兵来帮约翰五世。在杜尚看来，帝国打得越久，马其顿就越容易落进塞尔维亚的口袋。"
 oe_cw2.11.a: "无力阻止"
 oe_cw2.11.a.tt: "#R 大势 +10#!（有利于巴列奥略一方）\n塞尔维亚骑兵站在约翰五世一边（每月#R 大势 +0.5#!）"
 oe_cw2.11.b: "拿边城换杜尚收兵"
 oe_cw2.11.b.tt: "#R 塞尔维亚拿走马其顿边境最多1处地方#!，不再插手"
 oe_cw2.11.c: "接受援军"
 oe_cw2.11.c.tt: "#G 大势 +10#!（有利于巴列奥略一方）\n塞尔维亚骑兵站在我们一边（每月#G 大势 +0.5#!）"
 oe_cw2.11.d: "婉拒，免得引狼入室"
 oe_cw2.12.t: "季迪莫提洪之战"
 oe_cw2.12.desc: "苏莱曼的奥斯曼军在#color_yellow;bold 季迪莫提洪#!城外的平原上迎战塞尔维亚骑兵。突厥人多出一倍，塞尔维亚人几乎全军覆没。这是奥斯曼人在欧洲打赢的第一仗，色雷斯的百姓都看在眼里。"
 oe_cw2.12.a: "奥斯曼人在欧洲打赢了第一仗"
 oe_cw2.12.a.tt: "#G 大势 −15#!（有利于坎塔库泽诺斯家族）\n塞尔维亚骑兵不复存在"
 oe_cw2.12.b: "奥斯曼人在欧洲打赢了第一仗"
 oe_cw2.12.b.tt: "#R 大势 −15#!（有利于坎塔库泽诺斯家族）\n塞尔维亚骑兵不复存在"
 oe_cw2.13.t: "加蒂卢西奥的船"
 oe_cw2.13.desc: "约翰五世一方节节败退。这时来了一个热那亚冒险家，#color_yellow;bold 弗朗切斯科·加蒂卢西奥#!。此人带着自己的几条船和几百个亡命之徒，愿意替约翰五世打进京城，条件是娶约翰五世的妹妹玛丽亚。"
 oe_cw2.13.a: "出钱收买加蒂卢西奥"
 oe_cw2.13.a.tt: "#G 大势 −5#!（有利于坎塔库泽诺斯家族）"
 oe_cw2.13.b: "无力阻止"
 oe_cw2.13.b.tt: "#R 大势 +20#!（有利于巴列奥略一方）\n加蒂卢西奥的人在京城里接应约翰五世（每月#R 大势 +1#!）"
 oe_cw2.13.c: "答应这门亲事"
 oe_cw2.13.c.tt: "#G 大势 +20#!（有利于巴列奥略一方）\n加蒂卢西奥为我们作战（每月#G 大势 +1#!）；战后要把莱斯沃斯作为嫁妆封给加蒂卢西奥"
 oe_cw2.13.d: "拒绝"
 oe_cw2.14.t: "加里波利"
 oe_cw2.14.desc: "地震震塌了#color_yellow;bold 加里波利#!的城墙，苏莱曼的人马开进城里，修好了城墙，就再也不走了。京城里的人都在骂：是坎塔库泽诺斯家把突厥人请进了欧洲。"
 oe_cw2.14.a: "派人向奥尔汗索还"
 oe_cw2.14.a.tt: "#R 大势 +5#!（有利于巴列奥略一方）"
 oe_cw2.14.b: "无可奈何"
 oe_cw2.14.b.tt: "#R 大势 +10#!（有利于巴列奥略一方）"
 oe_cw2.14.c: "借题发挥"
 oe_cw2.14.c.tt: "#G 大势 +10#!（有利于巴列奥略一方）"
 oe_cw2.15.t: "苛捐"
 oe_cw2.15.desc: "为了还债、养兵，皇帝不得不加征新税。商人和市民怨声载道，连坎塔库泽诺斯家的老部下也劝皇帝手下留情。"
 oe_cw2.15.a: "照征不误"
 oe_cw2.15.a.tt: "#R 大势 +10#!（有利于巴列奥略一方）"
 oe_cw2.15.b: "免了新税"
 oe_cw2.15.b.tt: "#G 大势 −5#!（有利于坎塔库泽诺斯家族）"
 oe_cw2.16.t: "约阿萨夫修士"
 oe_cw2.16.desc: "老坎塔库泽诺斯在修道院里剃度，法名#color_yellow;bold 约阿萨夫#!。约翰五世成了帝国唯一的主人。马修的人马也许还在色雷斯，可坎塔库泽诺斯家已经输了。"
 oe_cw2.16.a: "帝国属于约翰五世"
 oe_cw2.16.a.tt: "约翰五世是唯一的皇帝；坎塔库泽诺斯出家，其家族影响力#Y −200#!；#G 正统性上升#!"
 oe_cw2.17.t: "坎塔库泽诺斯的皇冠"
 oe_cw2.17.desc: "巴列奥略家的旗帜倒下了。坎塔库泽诺斯家族保住了皇冠，马修将坐上父亲的皇位。帝国换了一个王朝，可色雷斯已经被两场内战打空了。"
 oe_cw2.17.a: "新王朝"
 oe_cw2.17.a.tt: "马修成为继承人；约翰五世被软禁在宫中；#G 稳定度上升#!"
 oe_cw2.17.b: "新王朝"
 oe_cw2.17.b.tt: "马修成为皇帝；约翰五世被废，退居宫中；#G 稳定度上升#!"
 oe_cw2.18.t: "两帝分治"
 oe_cw2.18.desc: "打了四年，谁也吃不掉谁。双方在色雷斯划界：马修以共治皇帝的身份守着阿德里安堡，约翰五世守着京城。帝国名义上仍是一个，实际上已经分成了两半。"
 oe_cw2.18.a: "至少不打了"
 oe_cw2.18.a.tt: "叛军的城镇归还帝国；获得 [ShowModifier('oe_cw2_divided')]，持续#Y 10#!年"
 oe_cw2.19.t: "马修的结局"
 oe_cw2.19.desc: "马修带着五千突厥兵去打塞尔维亚人的塞莱，在城外被德拉马的长官沃伊辛俘获。塞尔维亚人开出了赎金。皇帝出的价比谁都高，就能把马修要过来。"
 oe_cw2.19.a: "赎回马修，让其放弃帝号"
 oe_cw2.19.a.tt: "马修放弃帝号，日后可以去摩里亚"
 oe_cw2.19.b: "让塞尔维亚人留着马修"
 oe_cw2.19.b.tt: "马修死在塞尔维亚人的囚禁中"
 oe_cw2.20.t: "莱斯沃斯的嫁妆"
 oe_cw2.20.desc: "加蒂卢西奥娶了皇帝的妹妹玛丽亚，按约定要以#color_yellow;bold 莱斯沃斯#!岛作嫁妆。加蒂卢西奥会以帝国附庸的身份统治那里，钱币上仍铸着皇帝的十字纹。"
 oe_cw2.20.a: "封加蒂卢西奥为莱斯沃斯领主"
 oe_cw2.20.a.tt: "米蒂利尼和莫利沃斯获得 [ShowModifier('oe_cw2_gattilusio_fief')]"
 oe_cw2.20.b: "食言"
 oe_cw2.21.t: "军区再次站队"
 oe_cw2.21.desc: "又一场内战，各军区的将军又在观望。忠于皇帝的将军已经派兵来援，心怀不满的将军正在给叛军写信。"
 oe_cw2.21.a: "赦免动摇者，一个也不放走"
 oe_cw2.21.a.tt: "#R [oe_tu_authority|e] −5#!\n“离心”军区忠诚#G +15#!（计入忠诚目标#Y 5#!年），留在帝国一边\n#R “叛意”军区下月起兵，投奔叛军#!\n每个“忠贞”军区为帝国带来#G 2#!个月人力"
 oe_cw2.21.b: "任其去留"
 oe_cw2.21.b.tt: "#R “离心”和“叛意”军区下月起兵，投奔叛军#!\n每个“忠贞”军区为帝国带来#G 2#!个月人力"
