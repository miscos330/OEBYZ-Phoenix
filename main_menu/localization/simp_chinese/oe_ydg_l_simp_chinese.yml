 OE_YDG_PW_END2: "元祚已移"
 OE_YDG_PW_END3: "易主收束"
 OE_YDG_PW_END4: "已届终期"
 OE_YDG_PW_END8: "本局未启"
 OE_YDG_PW_WAIT: "未册立"
 OE_YDG_PW_DORM: "休眠（无储君）"
 OE_YDG_PW_T4: "内禅迫近"
 OE_YDG_PW_T3: "两宫分权"
 OE_YDG_PW_T2: "监国渐重"
 OE_YDG_PW_T1: "潜邸"
