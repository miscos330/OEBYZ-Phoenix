 OE_YDG_GD_3: "东宫"
 OE_YDG_GD_0: "未定"
 STATIC_MODIFIER_NAME_oe_ydg_favorites: "近侍弄权"
 STATIC_MODIFIER_DESC_oe_ydg_favorites: "内廷近侍与权幸上下其手，中书政令多受掣肘。"
 STATIC_MODIFIER_NAME_oe_ydg_two_palaces_rift: "两宫猜忌"
 STATIC_MODIFIER_DESC_oe_ydg_two_palaces_rift: "内禅之议未决，大明殿与东宫日生嫌隙，朝臣各怀观望。"
 STATIC_MODIFIER_NAME_oe_ydg_regency: "东宫总揽军政"
 STATIC_MODIFIER_DESC_oe_ydg_regency: "皇太子以监国之名总揽军政，号令暂归一处，得以专力平乱。"
 STATIC_MODIFIER_NAME_oe_ydg_chosgem: "搠思监当国"
 STATIC_MODIFIER_DESC_oe_ydg_chosgem: "搠思监与朴不花内外相结，朝政壅蔽，中书庶务滞缓。"
 oe_ydg.1.t: "哈麻内禅之谋"
 oe_ydg.1.desc_x: "#F 至正十六年（1356年），中书左丞相哈麻（康里根脚）与其弟御史大夫雪雪见朝廷多故，私议奉顺帝为太上皇、立皇太子即位以固宠幸；事泄，大明殿震怒（《元史》卷二〇五）。#!\n\n如今，京师宿卫诸卫（钦察、阿速、康里三卫向例不许汉人南人入宿卫）皆视朝廷动静，目前宿卫归于#Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!，东宫之势在#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!。大明殿密报称，哈麻兄弟已暗结东宫近侍，拟借内禅之议另立新局。"
 oe_ydg.1.a: "诛哈麻、雪雪"
 oe_ydg.1.a.tt: "东宫之势#Y −15#!；平乱朝局风向改善（朝议#G +6#!）。"
 oe_ydg.1.b: "罢哈麻、切责东宫"
 oe_ydg.1.b.tt: "东宫之势#Y −25#!；东宫深怀怨望，日后两宫反扑之势更烈。"
 oe_ydg.1.c: "姑容之"
 oe_ydg.1.c.tt: "东宫之势#Y +20#!；若宿卫尚未归权臣，则转向#bold #color_yellow 东宫#!#!。"
 oe_ydg.2.t: "内禅之议"
 oe_ydg.2.desc_res: "#F 至正二十年（1360年），中宫与皇太子遣宦者朴不花讽喻左丞相太平，示意劝顺帝内禅；太平辞不奉命，两宫由是愈相猜忌（《元史》卷一四〇）。#!\n\n自先前切责东宫以来，两宫积怨更深。如今东宫之势已至#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!，宿卫归于#Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!，中宫与东宫遣人讽喻左丞相太平，直言内禅之议。"
 oe_ydg.2.desc_x: "#F 至正二十年（1360年），中宫与皇太子遣宦者朴不花讽喻左丞相太平，示意劝顺帝内禅；太平辞不奉命，两宫由是愈相猜忌（《元史》卷一四〇）。#!\n\n如今，东宫之势已至#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!，宿卫归于#Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!。中宫与东宫再度托词军务繁重，遣人探问宰相太平口风，意在请天子退居太上皇、由东宫监国。"
 oe_ydg.2.a: "太平推诿，天子默许搁置"
 oe_ydg.2.a.tt: "东宫之势#Y +10#!；两宫裂痕已成，日后东宫恐对太平发难。"
 oe_ydg.2.b: "下诏切责东宫，收宿卫归天子"
 oe_ydg.2.b.tt: "花费#R 1#!个月收入与稳定#R −5#!（若宿卫本归天子，则赏赐与震荡减半）。\n东宫之势#Y −30#!；钦察、阿速等宿卫强制收归#bold #color_yellow 天子#!#!。"
 oe_ydg.2.c: "许议内禅，命皇太子监国"
 oe_ydg.2.c.tt: "东宫之势设为#Y 85#!，宿卫转归#bold #color_yellow 东宫#!#!；平乱之势#G +8#!。\n两宫暂得妥协，免除后续逐太平与征四省兵的内耗。"
 oe_ydg.3.t: "东宫逐太平"
 oe_ydg.3.desc_x: "#F 至正二十年（1360年）太平辞左丞相后，中宫与东宫犹恨前事；右丞相搠思监与朴不花屡构其罪，御史台劾疏接踵而至，朝政尽归东宫一党（《元史》卷一四〇，通说）。#!\n\n如今，东宫之势在#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!，宿卫归于#Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!。搠思监与东宫党羽交章弹劾太平，请罢其职、以搠思监专领中书庶务。"
 oe_ydg.3.a: "罢太平相职，任搠思监"
 oe_ydg.3.a.tt: "东宫之势#Y +10#!；平乱朝局风向恶化（朝议#R −8#!）。"
 oe_ydg.3.b: "力保太平，抑东宫"
 oe_ydg.3.b.tt: "东宫之势#Y −20#!；若宿卫在天子手，则额外得威望#G +5#!。"
 oe_ydg.4.t: "太子征四省藩王兵"
 oe_ydg.4.desc_x: "#F 至正二十四年（1364年），孛罗帖木儿称兵入京秉政，皇太子出奔太原冀宁，依扩廓帖木儿发诏征调岭北、甘肃、辽阳、陕西四省诸王及诸道兵马讨孛罗（《元史》卷四十六、卷一四一）。#!\n\n如今，孛罗帖木儿据京师秉政，宿卫归于#Y [GetCountry('CHI').Custom('oe_ydg_panel_guard')]#!，东宫之势在#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]#!。皇太子已出走冀宁，传檄四省藩王与扩廓兵马，朝廷面临择路。"
 oe_ydg.4.a: "发诏诸王勤王"
 oe_ydg.4.a.tt: "向在册诸王征调兵员（调用诸王线勤王效应）；恭顺诸王越多，平乱之势提升越多（#G +3#!至#G +8#!），离心诸王忠诚另降#R −5#!。\n东宫之势#Y +15#!。"
 oe_ydg.4.b: "专倚扩廓，不扰诸王"
 oe_ydg.4.b.tt: "不惊动诸王忠诚；扩廓帖木儿一系向心力上升（若割据河南则归附度#G +15#!），平乱之势#G +5#!。"
 oe_ydg.4.c: "诏太子归京议和"
 oe_ydg.4.c.tt: "若宿卫在权臣手，议和七成五不成（正统#R −5#!），成则东宫之势#Y −10#!；否则七成可成（东宫之势#Y −15#!）。"
 oe_ydg.20.t: "两宫与东宫：选项生效"
 oe_ydg.90.t: "【测试】两宫与东宫及宿卫：读数"
 oe_ydg.90.d: "#T 面板词#! 东宫 [GetCountry('CHI').Custom('oe_ydg_panel_power')]  宿卫 [GetCountry('CHI').Custom('oe_ydg_panel_guard')]\n#T 线与核心状态#!\n结束代码 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_end')|0]  已打开 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_opened')|0]  打开月 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_openm')|0]  东宫之势 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_power')|0]  宿卫归属 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_guard')|0]  宿卫锁定 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_glock')|0]\n#T 外部条件与漂移#!\n顺帝在位 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_togon')|0]  皇太子在世 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_cp')|0]  奇氏正位.29 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_gi29')|0]  权臣(个伯十脱百罗) [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_ministers')|0]  平乱势<40 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_shilo')|0]  中兴二阶+ [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_yr2')|0]  恭顺藩王 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_loyp')|0]  本线修正位 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_mods')|0]\n#T 四事件与选项#!\n.1状态/选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st1')|0]  选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c1')|0]  .2状态/选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st2')|0]  选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c2')|0]  .3状态/选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st3')|0]  选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c3')|0]  .4状态/选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_st4')|0]  选 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c4')|0]  议和成败 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_c4ok')|0]  东宫怨望 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_resent')|0]\n#T 调度#!\n月 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_m')|0]  同月守卫 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_evm')|0]  等待 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_wait')|0]  上次事件 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_last')|0]  已发数 [GetCountry('CHI').MakeScope.ScriptValue('oe_ydg_rd_cnt')|0]\n（结束：1皇太子登极、2元亡、3顺帝崩而别位继立、4到1370年、8未启；宿卫：1天子、2权臣、3东宫；状态：0未发、1已发、2过期；修正位：个近侍、十猜忌、百监国、千搠思监）"
 oe_ydg.90.a: "关闭"
 oe_ydg.90.b: "刷新"
