l_simp_chinese:
 oe_yuan_kurultai: "大元库里台与中书廷议"
 oe_yuan_kurultai_desc: "合草原诸王大聚会库里台与汉地中书省宰执政事为一炉，宗王贵戚、释道高僧与商贾司财共议军国大计，既维系骑射旧俗又兼顾中原税赋。"
 oe_ming_six_ministries: "天朝六部廷议"
 oe_ming_six_ministries_desc: "吏户礼兵刑工六部尚书与翰林阁臣廷推国策、勾稽钱粮，以文官铨选与科道言官共襄天子乾纲，辅以商民乡绅议政献策。"
 oe_ottoman_divan: "奥斯曼御前会议"
 oe_ottoman_divan_desc: "大维齐尔主持托普卡帕圆顶厅军国枢议，统合卡迪阿斯克尔、财务总管与边疆贝伊，令皇室集权与常备军纪律并行不悖。"
 oe_rus_zemsky_sobor: "全俄缙绅会议"
 oe_rus_zemsky_sobor_desc: "召集波雅尔贵族、正教圣主教会议、城镇工商代表与自由农社共襄全俄国是，在广袤林原之间凝聚各阶层协力与兵源动员。"
 oe_mamluk_majlis: "马穆鲁克苏丹御议会"
 oe_mamluk_majlis_desc: "开罗城堡的埃米尔军事议事与四大教法学派大法官、卡里米巨商共议伊克塔分封与红海香料关税，兼重重骑武备与尼罗河财赋。"
 oe_v150_choose_challenge_preset: "1337 剧本挑战预设"
 oe_v150_choose_challenge_preset.title: "1337 剧本挑战预设"
 oe_v150_choose_challenge_preset.desc: "于1337年开局自由择定本局挑战基调（零新增开局规则、完全免费、一键可关闭）：可在「标准历史凤凰」、「多极高压欧亚」、「硬核熵增与危机试炼」以及「1337极乐洲加速筹备」四轨之间任选其一。"
 oe_v150_choose_challenge_preset_desc: "于1337年开局自由择定本局挑战基调（零新增开局规则、完全免费、一键可关闭）。"
 oe_v150_choose_challenge_preset.a: "启阅1337挑战预设择定卷"
 oe_v150_preset.1.t: "1337 欧亚大势 · 挑战预设择定"
 oe_v150_preset.1.desc: "岁在1337，拜占庭余晖未尽，大元疆宇犹广，欧亚诸雄蠢蠢欲动。陛下可在此为本局择定一项完全自愿的挑战预设（不占用任何游戏规则槽位）；若偏爱原汁原味的历史进程，选择第一项即可静默关闭。"
 oe_v150_preset.1.a: "标准历史凤凰（无额外修正，直接关闭）"
 oe_v150_preset.1.a.tt: "不施加任何额外修正，保持标准历史平衡体验并关闭此开局择定。"
 oe_v150_preset.1.b: "多极高压欧亚（列强威望与军势激化）"
 oe_v150_preset.1.b.tt: "为玩家及欧亚各独立列强施加温和的「多极高压欧亚」修正（威望、外交声望、人力与纪律略升），每季度由全球内核同步，加剧多极争锋。"
 oe_v150_preset.1.c: "硬核熵增与危机试炼（年度熵增与霸权加压）"
 oe_v150_preset.1.c.tt: "激活全球内核年度硬核试炼钩子：大国承受控制度与厌战压力（换取微幅纪律与威望），且每年岁首为大型帝国额外推升#R +2#!熵增并推高霸权张力。"
 oe_v150_preset.1.d: "1337 极乐洲加速筹备（拜占庭远航先锋）"
 oe_v150_preset.1.d.tt: "赐予拜占庭50年「极乐洲远航加速筹备」修正（探索速度、殖民距离、水手与造船显著提速），助帝国提前数十年迈向第四奥德赛西渡。"
 STATIC_MODIFIER_NAME_oe_v150_preset_multipolar_mod: "多极高压欧亚"
 STATIC_MODIFIER_DESC_oe_v150_preset_multipolar_mod: "欧亚大陆列强竞逐白热化，各国朝廷厉兵秣马以争威望与话语权。"
 STATIC_MODIFIER_NAME_oe_v150_preset_hardcore_mod: "硬核熵增与危机试炼"
 STATIC_MODIFIER_DESC_oe_v150_preset_hardcore_mod: "广土众民的帝国承受更严苛的控制度与战备耗损，唯严明军纪与励精图治方能渡劫。"
 STATIC_MODIFIER_NAME_oe_v150_preset_elysia_fast: "1337 极乐洲远航加速筹备"
 STATIC_MODIFIER_DESC_oe_v150_preset_elysia_fast: "皇室船坞与远洋航海司提前扩编，为横渡大西洋寻访极乐洲积蓄水手、航程与远征船队。"
 oe_v150_preset.90.t: "v15.0 全球统一内核与原生体验诊断台账"
 oe_v150_preset.90.d: "#T 全球统一内核（oe_global_kernel）#!\n累计月脉冲：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_ticks')|0]#!  累计季脉冲：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_q_ticks')|0]#!  累计年脉冲：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_y_ticks')|0]#!\n最近执行月份序号：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_ran_m')|0]#!  已收拢冗余全图后备钩子：#G [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_consolidated_hooks')|0]#! 处\n\n#T 1337 挑战预设#!\n当前预设代码：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_gk_rd_preset')|0]#!（0未选 1标准 2多极高压 3硬核熵增 4极乐加速）\n\n#T 原生体验与军区 2.0#!\n文明议会：5 套（元/明/奥斯曼/罗斯/马穆鲁克）  触发器本地化：40 组（含正反 80 词条）  顶栏提醒：10 枚 O(1) 旗帜  军区并省：≤15 地、最多兼管 3 区、合并上限 45 地、保护海军军区；第二层级扩展区一键建制就绪。"
 oe_v150_preset.90.a: "关闭诊断台账"
