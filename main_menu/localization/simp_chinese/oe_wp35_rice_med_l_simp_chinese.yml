l_simp_chinese:
 # Project Phoenix v31.0 WP35: RICE Eastern Mediterranean Flavor.
 oe_wp35_rice_chios_mastic: "敕许希俄斯乳香专卖行会"
 oe_wp35_rice_chios_mastic.title: "敕许希俄斯乳香专卖行会"
 oe_wp35_rice_chios_mastic.desc: "将希俄斯岛南部设防的乳香村落编组为特许专卖行会，统筹行销开罗至威尼斯诸宫廷的珍贵乳香脂。"
 oe_wp35_rice_chios_mastic.a: "敕许希俄斯乳香专卖行会"
 oe_wp35_rice.1.title: "希俄斯之泪：乳香专卖体制"
 oe_wp35_rice.1.desc: "放眼四海，唯独希俄斯岛南部炽热干燥的石灰岩丘陵坡地，方能令漫山乳香树林渗出晶莹剔透的珍贵药用乳香树脂，自开罗苏丹宫廷至威尼斯药坊皆视若真金白银。俯瞰良港的税关拱厅之内，热那亚马奥纳商团股东、威尼斯海商执事与设防乳香村落的岛中长老各陈章程，静候朝廷裁定这笔独步爱琴海的专卖厚利归属。"
 oe_wp35_rice.1.a: "设立希俄斯马奥纳乳香专卖特许公司"
 oe_wp35_rice.1.b: "与岛中乡老共分专卖厚利以固民心"
 oe_wp35_rice.1.c: "延揽精明希俄斯乳香总经纪入掌海贸商政"
 STATIC_MODIFIER_NAME_oe_wp35_mod_chios_mastic_monopoly: "希俄斯乳香专卖"
 STATIC_MODIFIER_DESC_oe_wp35_mod_chios_mastic_monopoly: "设防乳香村落与严密出口登册令希俄斯独占高利润乳香贸易。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_chios_maona_guild: "希俄斯乳香商团"
 STATIC_MODIFIER_DESC_oe_wp35_mod_chios_maona_guild: "源源不断的爱琴海乳香外销丰盈国家商贸收入。"
 oe_wp35_rice_rhodes_commerce: "振兴罗得岛医院骑士团商港"
 oe_wp35_rice_rhodes_commerce.title: "振兴罗得岛医院骑士团商港"
 oe_wp35_rice_rhodes_commerce.desc: "加固罗得岛大港堡垒并敕许黎凡特航运商盟，令这座海岛要塞化为固若金汤的爱琴海转口重镇。"
 oe_wp35_rice_rhodes_commerce.a: "振兴罗得岛医院骑士团商港"
 oe_wp35_rice.2.title: "爱琴海砥柱：罗得岛大港商盟"
 oe_wp35_rice.2.desc: "在昔日巍然矗立青铜太阳神巨像的古老港口两侧，高耸厚重的石灰岩棱堡倒映于碧波之上；来自威尼斯、热那亚、亚历山大、塞浦路斯与克里特的桨帆商船云集泊位，等候淡水补给、船体修缮与战舰护航。海防统领与黎凡特商盟执事联袂进言，恭请圣裁将罗得岛打造成铁壁军港，抑或东地中海最繁华的自由转口大埠。"
 oe_wp35_rice.2.a: "修筑海港防波堤并组建护航战舰队"
 oe_wp35_rice.2.b: "减免过境港税以广招黎凡特四方客商"
 oe_wp35_rice.2.c: "拔擢久经风浪的罗得岛舰队统领入掌水师"
 STATIC_MODIFIER_NAME_oe_wp35_mod_rhodes_hospitaller_port: "罗得岛设防商港"
 STATIC_MODIFIER_DESC_oe_wp35_mod_rhodes_hospitaller_port: "坚不可摧的港湾棱堡与繁忙黎凡特船坞使罗得岛兼具军港与商埠之利。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_rhodes_sea_patrols: "爱琴海护航商盟"
 STATIC_MODIFIER_DESC_oe_wp35_mod_rhodes_sea_patrols: "久经风浪的罗得岛桨帆舰队守护东地中海航路安全。"
 oe_wp35_rice_lesbos_gattilusi: "赞助莱斯沃斯加蒂卢西人文庇护"
 oe_wp35_rice_lesbos_gattilusi.title: "赞助莱斯沃斯加蒂卢西人文庇护"
 oe_wp35_rice_lesbos_gattilusi.desc: "效法米蒂利尼的加蒂卢西领主，融汇希腊古典文脉、意大利文艺复兴学术与明矾贸易之利。"
 oe_wp35_rice_lesbos_gattilusi.a: "赞助莱斯沃斯加蒂卢西人文庇护"
 oe_wp35_rice.3.title: "米蒂利尼人文雅集：加蒂卢西庇护"
 oe_wp35_rice.3.desc: "在俯瞰米蒂利尼双良港、松香袅袅的山城古堡之中，来自君士坦丁堡的希腊语法名宿与热那亚人文主义者、文艺复兴建筑师并肩校抄珍本古籍；山下繁忙码头则停满装运爱琴海橄榄油、精制香皂与小亚细亚明矾的驳船等待封关启航。若获朝廷重资护持，莱斯沃斯岛必将成为沟通东西方古典文艺与海贸财富的璀璨明珠。"
 oe_wp35_rice.3.a: "资助希腊—拉丁双语人文抄经院与书库"
 oe_wp35_rice.3.b: "扩建米蒂利尼明矾与橄榄油货栈交易所"
 oe_wp35_rice.3.c: "延请博通希腊与拉丁双语的雅集名士入宫顾问"
 STATIC_MODIFIER_NAME_oe_wp35_mod_lesbos_gattilusi_court: "米蒂利尼加蒂卢西雅苑"
 STATIC_MODIFIER_DESC_oe_wp35_mod_lesbos_gattilusi_court: "融汇希腊学问、意式艺术与海岛手工业的东地中海人文名邑。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_gattilusi_humanism: "爱琴海人文庇护风尚"
 STATIC_MODIFIER_DESC_oe_wp35_mod_gattilusi_humanism: "沟通希腊与拉丁两大文明传统，极大抬升我国文化与外交声望。"
 oe_wp35_rice_coptic_alexandria: "护持亚历山大科普特文化遗产"
 oe_wp35_rice_coptic_alexandria.title: "护持亚历山大科普特文化遗产"
 oe_wp35_rice_coptic_alexandria.desc: "护持亚历山大古老的科普特抄本馆、尼罗河荒漠修院与世代精于财赋簿记的科普特文吏群体。"
 oe_wp35_rice_coptic_alexandria.a: "护持亚历山大科普特文化遗产"
 oe_wp35_rice.4.title: "尼罗河守望者：亚历山大科普特遗产"
 oe_wp35_rice.4.desc: "从亚历山大城古老的圣马可牧首藏经阁至瓦迪纳特伦荒漠中的设防修院，博学的科普特学者与世代相传的簿记文吏既珍藏着跨越千年的礼仪古卷，又掌握着精准丈量尼罗河泛滥田亩与税赋的独门计学。若朝廷颁诏护持其修院与典籍并广加延揽入朝，必能显著精进帝国财赋统计效能，并安抚埃及多元港口四海人心。"
 oe_wp35_rice.4.a: "颁诏保护科普特修院并延揽精明簿记文吏"
 oe_wp35_rice.4.b: "敕建亚历山大古籍译校学堂以兴尼罗河文脉"
 oe_wp35_rice.4.c: "特任资深亚历山大科普特总计吏入值中枢"
 STATIC_MODIFIER_NAME_oe_wp35_mod_coptic_alexandria_heritage: "亚历山大科普特遗产"
 STATIC_MODIFIER_DESC_oe_wp35_mod_coptic_alexandria_heritage: "薪火相传的科普特典籍与尼罗河博雅学风显著提升识字率与思潮传播。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_alexandrian_scribes: "亚历山大文吏计司"
 STATIC_MODIFIER_DESC_oe_wp35_mod_alexandrian_scribes: "熟谙簿记的亚历山大文吏提升中枢行政效能并促进不同教派和谐共处。"
 oe_wp35_rice_armenian_cilicia: "敕许奇里乞亚亚美尼亚商匠行会"
 oe_wp35_rice_armenian_cilicia.title: "敕许奇里乞亚亚美尼亚商匠行会"
 oe_wp35_rice_armenian_cilicia.desc: "扶植锡斯、阿达纳与塔尔苏斯的亚美尼亚丝织名匠、冶金行会与山隘商队，贯通安纳托利亚商道与黎凡特良港。"
 oe_wp35_rice_armenian_cilicia.a: "敕许奇里乞亚亚美尼亚商匠行会"
 oe_wp35_rice.5.title: "托罗斯山门户：奇里乞亚亚美尼亚行会"
 oe_wp35_rice.5.desc: "在险峻巍峨的锡斯山城古堡之下，横跨灌溉丰饶的阿达纳与塔尔苏斯沃野平原，技艺精湛的亚美尼亚丝织名匠、银铁冶金行会与商队执事正统筹自大不里士与波斯翻越托罗斯山隘南下地中海良港的浩荡商旅。若朝廷颁授行会特许并派兵严守山道关隘，奇里乞亚必将化作生丝、冶金与关厘滚滚而来的东方财富重镇。"
 oe_wp35_rice.5.a: "颁授奇里乞亚行会特许状并派兵护送山隘商队"
 oe_wp35_rice.5.b: "兴建奇里乞亚丝织机坊与塔尔苏斯商栈"
 oe_wp35_rice.5.c: "拔擢精干亚美尼亚商队大执事统筹东方丝路贸易"
 STATIC_MODIFIER_NAME_oe_wp35_mod_cilician_armenian_guilds: "奇里乞亚亚美尼亚行会"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cilician_armenian_guilds: "精巧的亚美尼亚工匠与托罗斯商队经纪推动奇里乞亚生产、商贸与山隘防务齐升。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_armenian_silk_network: "奇里乞亚丝路商网"
 STATIC_MODIFIER_DESC_oe_wp35_mod_armenian_silk_network: "连接波斯、安纳托利亚与黎凡特的亚美尼亚商贸网络显著提升全国生产与出口效率。"
 oe_wp35_rice.6.title: "东地中海商贸与人文红利"
 oe_wp35_rice.6.desc: "东地中海特许新政施行八月之后，来自爱琴海诸岛、亚历山大与奇里乞亚的商盟执事、远洋航海家与双语学者纷纷渡海入京报捷：各地关厘岁入节节攀升，珍本典籍与织造工艺交流络绎不绝。帝都码头货栈充盈着乳香、生丝、明矾与橄榄油，令开明庇护结出累累硕果，也引得四海客商愈发仰慕我国威望。"
 oe_wp35_rice.6.a: "将丰厚关厘红利投入首都商市与港口建设"
 oe_wp35_rice.6.b: "赞助多元学术交流与海港庆典以兴文脉"
 oe_wp35_rice.6.c: "延揽精通多语的黎凡特海贸总执事入朝参政"
