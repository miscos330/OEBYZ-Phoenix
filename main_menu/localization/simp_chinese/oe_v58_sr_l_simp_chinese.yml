l_simp_chinese:
 # Project Phoenix v58.0 — 欧亚陆海丝绸与香料走廊（简中）.
 oe_sit_v58_silk_road_spice_corridor: "欧亚陆海丝绸与香料走廊"
 oe_sit_v58_silk_road_spice_corridor_desc: "北起京兆、河西、撒马尔罕、大不里士至君士坦丁堡的陆上驼道，南连刺桐、满剌加、古里、霍尔木兹与亚历山大港的季风航线，欧亚诸国正竞相护航、征税并主宰生丝、瓷器、白银与香料的跨洲大动脉。"
 hint_oe_sit_v58_silk_road_spice_corridor: "局势指南：欧亚陆海丝绸与香料走廊"
 hint_oe_sit_v58_silk_road_spice_corridor_desc: "善用6项丝路互动行动、6类丝路商港建筑与4项商贸政令，调控“走廊活力（0-100）”与“海运份额（0-100）”。走廊活力达85将缔造欧亚黄金通商盛世；1650年后海运份额达75则开启远洋香料霸权时代。"
 oe_v58_sr_out_eurasian_golden_web: "欧亚黄金通商均衡"
 oe_v58_sr_out_eurasian_golden_web_desc: "陆上驼道帝国与季风海港城邦携手织就贯通黄海至地中海的繁荣商贸巨网。"
 oe_v58_sr_out_oceanic_hegemony: "远洋香料海权时代"
 oe_v58_sr_out_oceanic_hegemony_desc: "重装远洋香料船队与好望角贸易公司彻底压倒了古老的内陆丝绸驼道。"
 oe_v58_sr_out_corridor_transition: "古典丝香专卖的黄昏"
 oe_v58_sr_out_corridor_transition_desc: "至十八世纪后期，工业化帝国与全球航运体系重塑并吸纳了古老的欧亚丝绸与香料走廊。"
 OE_V58_SR_GUI_HDR_ERA: "走廊跨度"
 OE_V58_SR_GUI_HDR_VITALITY: "走廊活力"
 OE_V58_SR_GUI_CARD_TITLE: "生丝、青瓷与香料大动脉"
 OE_V58_SR_GUI_CARD_BODY: "陆路商道诸国与季风海权竞逐联通东亚、南亚、波斯、黎凡特与地中海的陆海双线商贸走廊。"
 OE_V58_SR_GUI_FLOW_LABEL: "欧亚走廊总活力"
 OE_V58_SR_GUI_MARITIME_LABEL: "远洋与季风海运份额"
 OE_V58_SR_GUI_FOOTNOTE: "走廊活力达85可达成“欧亚黄金通商均衡”；1650年后海运份额达75则触发“远洋香料海权时代”。"
 oe_v58_sr_legend_overland: "陆上丝绸之路主干线"
 oe_v58_sr_legend_maritime: "海上香料与瓷器季风环线"
 oe_v58_sr_legend_clearing: "地中海与草原转口清算带"
 oe_v58_sr_map_overland_tt: "陆上丝绸之路主干线：贯通中原、西域、河中、波斯与安纳托利亚的商队驿馆腹地。"
 oe_v58_sr_map_maritime_tt: "海上香料与瓷器季风环线：联通东南沿海、满剌加、马拉巴尔、霍尔木兹、红海与东非斯瓦希里港市的季风航路。"
 oe_v58_sr_map_clearing_tt: "转口清算带：汇集地中海、黎凡特、黑海与伊比利亚白银及奢侈品结算终点的枢纽区域。"
 oe_v58_sr_act_caravan_escort: "丝路商队护卫网"
 oe_v58_sr_act_caravan_escort_desc: "沿陆上丝绸之路各驿段派驻骑兵巡逻、筑固井堡并授任商队押运长官，震慑劫掠、保障驼队畅通。"
 oe_v58_sr_act_caravan_escort_tt: "提升丝路香料走廊活力（+7），并将商流拉回陆路驼道（海运份额 -4）。"
 oe_v58_sr_act_monsoon_spice_fleet: "季风香料船队"
 oe_v58_sr_act_monsoon_spice_fleet_desc: "顺应印度洋与南海季风规律编组武装商船队，直通马拉巴尔胡椒、香料群岛丁香与中华青花瓷贸易。"
 oe_v58_sr_act_monsoon_spice_fleet_tt: "提升丝路香料走廊活力（+8），并推动商路向远洋海运倾斜（海运份额 +7）。"
 oe_v58_sr_act_strait_toll_charter: "海峡隘口关税特许"
 oe_v58_sr_act_strait_toll_charter_desc: "在咽喉海峡与关隘颁行统一泊税、灯塔费与护航通行证制度，以可预期的规费秩序换取稳定关税进项。"
 oe_v58_sr_act_strait_toll_charter_tt: "提升丝路香料走廊活力（+4）并增强海上航道秩序（海运份额 +3）。"
 oe_v58_sr_act_merchant_guild_quarter: "特许蕃坊与商馆区"
 oe_v58_sr_act_merchant_guild_quarter_desc: "为远道而来的异域商帮划设自治蕃坊、商馆与市舶保税货栈，配备译员与商事公断所。"
 oe_v58_sr_act_merchant_guild_quarter_tt: "提升丝路香料走廊活力（+7）并扩大多族群港市网络（海运份额 +2）。"
 oe_v58_sr_act_silver_silk_exchange: "丝银汇兑票号"
 oe_v58_sr_act_silver_silk_exchange_desc: "特许跨洲金银成色鉴定所与汇票票号（飞钱与苏夫塔贾汇单），无需逐关运现即可结算丝绸、香料与瓷器大宗贸易。"
 oe_v58_sr_act_silver_silk_exchange_tt: "大幅提升丝路香料走廊活力（+8）与跨洋信用结算效率（海运份额 +4）。"
 oe_v58_sr_act_imperial_staple_monopoly: "御定丝香专卖榷场"
 oe_v58_sr_act_imperial_staple_monopoly_desc: "划定皇家专卖榷场与指定口岸，凡生丝、胡椒与外销瓷器皆须先经官秤核税并由官商优先承购。"
 oe_v58_sr_act_imperial_staple_monopoly_tt: "集中关税利润归于国库，但会略微抑制商路自由流通（走廊活力 -3，海运份额 -2）。"
 oe_v58_sr.1.title: "撒马尔罕黄金驼道"
 oe_v58_sr.1.desc: "河中青瓷穹顶之上烟尘滚滚，千峰驼队翻越帕米尔雪岭而下，满载江南生丝、于阗美玉与费尔干纳骏马。精于算账的粟特遗风牙商、波斯书吏与草原骑主齐聚撒马尔罕与布哈拉大驿馆拱门之下，以白银锭核对织金锦缎。若由朝廷出面修缮沿途井站、发给过所符牌并包保商路治安，丰厚的市舶与陆关关税便会源源流入府库；然而沿途部族首领索要厚赏，地方税吏亦借机盘剥，如何在安抚草原与整饬商道之间取舍，正待御裁。"
 oe_v58_sr.1.a: "兴筑官办大驿馆并派兵护商"
 oe_v58_sr.1.b: "将陆关转运税包租予河中商帮"
 oe_v58_sr.1.c: "对过境生丝锦缎课征重税"
 oe_v58_sr.2.title: "大不里士至特拉比松丝绸牙行"
 oe_v58_sr.2.desc: "自吉兰与马赞德兰桑林采收的新丝由骡队驮运，穿越大不里士高地翻越亚美尼亚群山，直抵特拉比松与黑海诸港。威尼斯、热那亚与亚美尼亚商馆赶在冬雪封锁齐加纳山口前竞相抬价抢购里海生丝。度支大臣奏报，若在高原关城设立官定丝秤并统一成色检验，不仅能扶持本土丝织坊市，还可稳握西亚商路定价权；但若强扣银锭或卡死出口配额，意商便会转道叙利亚与黎凡特口岸，令高地商道冷落。"
 oe_v58_sr.2.a: "统一度量丝秤并优待远来牙商"
 oe_v58_sr.2.b: "截留上等里海生丝供应本土织坊"
 oe_v58_sr.2.c: "向出价最高者拍卖独占出口牌照"
 oe_v58_sr.3.title: "帝都万商穹顶市集"
 oe_v58_sr.3.desc: "博斯普鲁斯海峡在欧亚两洲之间收束成咽喉，君士坦丁堡与加拉塔的拱顶大巴扎内回荡着数十种商旅方言。黑海麦船、北方貂皮、波斯生丝、安纳托利亚安哥拉羊毛与埃及胡椒在大理石柱廊间昼夜易手。无论是在金角湾设立皇家市舶税关，还是与海洋共和国谈判商馆特权，凡扼守此间海峡者皆可坐收欧亚转运之利。此刻商团正呈递请愿书，恳请朝廷裁定新季海陆关税章程。"
 oe_v58_sr.3.a: "扩建金角湾市舶司与保税货栈"
 oe_v58_sr.3.b: "与各国商帮订立对等互惠商约"
 oe_v58_sr.3.c: "对过峡外籍商船加征紧急附加税"
 oe_v58_sr.4.title: "京兆河西茶马驼队"
 oe_v58_sr.4.desc: "出黄河河套、沿河西走廊烽燧西行，驼铃声穿过甘州、沙州与吐鲁番绿洲，直入塔里木盆地诸城。朝廷茶马司以砖茶、织锦与铁锅换取西域良马、美玉与药材，使长安旧道再度繁盛。边镇督府奏言，维系大漠沿线屯田与井堡戍卒耗费银粮颇巨，但只要河西一线畅通无阻，东亚丝瓷便可源源西输中亚与波斯；若裁撤边防戍守，商路恐立遭劫掠而断绝。"
 oe_v58_sr.4.a: "拨银充实茶马司与绿洲屯戍井堡"
 oe_v58_sr.4.b: "向边关民商颁给勘合过所符牌"
 oe_v58_sr.4.c: "闭关互市以节流边镇粮饷"
 oe_v58_sr.5.title: "红海卡里米香料商帮"
 oe_v58_sr.5.desc: "随春日南风而至的大三角帆木船满载马拉巴尔胡椒、锡兰肉桂与也门香料，陆续泊靠吉达与苏伊士码头。财雄势大的卡里米商帮随即组织骆驼联队横越沙漠，将成捆香料运抵开罗与亚历山大港，售予候泊于地中海的威尼斯大帆船。廷臣就是否与卡里米巨商结盟争论不休：若准其自治通商，可借其雄厚信用拆借军费并保持海运兴旺；若收归王室专卖，虽能骤增眼前税入，却恐令商帮外逃。"
 oe_v58_sr.5.a: "确认卡里米商帮特许并护航红海船队"
 oe_v58_sr.5.b: "于开罗与亚历山大推行王室香料专卖"
 oe_v58_sr.5.c: "征发转运商队税款以修筑红海海防"
 oe_v58_sr.6.title: "霍尔木兹明珠海峡"
 oe_v58_sr.6.desc: "坐落于波斯湾咽喉的霍尔木兹岛既无甘泉亦无良田，其石库中却堆满印度棉布、波斯蔷薇露、阿拉伯骏马与巴林明珠。凡往来于巴士拉、设拉子与古吉拉特之间的商船，无不在此补给淡水、申报关税并换乘远洋船队。海商与港督联名上疏：若投资疏浚泊位、编组海湾巡防战船并平抑马匹与香料税率，这方礁岛即可成为坐拥波斯湾与阿拉伯海贸易枢纽的海上钱庄。"
 oe_v58_sr.6.a: "加固海峡泊位并颁行海湾统一税则"
 oe_v58_sr.6.b: "资助阿拉伯骏马换印度香料贸易"
 oe_v58_sr.6.c: "向过境采珠船与胡椒船队勒索贡金"
 oe_v58_sr.7.title: "古里季风万国帆影"
 oe_v58_sr.7.desc: "在椰林掩映的马拉巴尔海岸，古里（科泽科德）大港精准契合西南与东北季风交替之期：东来巨型华商宝船与西来阿拉伯柚木帆船同泊于碧波之间。来自西高止山脉的黑胡椒、豆蔻与干姜堆满海滨栈房，港内严守公允称量与失事商船不加掠夺的古法信义。商使建言，若派遣常驻领事与护航快船加入古里通商盟约，我朝商旅即可直采南亚核心香料货源。"
 oe_v58_sr.7.a: "派驻常设香料牙商与季风领航员"
 oe_v58_sr.7.b: "担保各国海商享有中立海事仲裁"
 oe_v58_sr.7.c: "陈兵海面强索黑胡椒优先采买额"
 oe_v58_sr.8.title: "满剌加海峡市舶枢纽"
 oe_v58_sr.8.desc: "背靠群山、避开苏门答腊飓风的满剌加海峡堪称亚洲诸海总闸门。港内分设四位港务长官（沙班达尔），分管古吉拉特商团、孟加拉与泰米尔商团、爪哇与马来群岛商团以及中华与琉球宝船，负责平息纠纷、校核度量并调度季风启航档期。若协力清剿海峡海盗并颁行《海上法典》，这条狭窄水道便会源源汇聚东亚丝瓷与香料群岛珍奇。"
 oe_v58_sr.8.a: "资助四方港务官并联合清剿海峡海盗"
 oe_v58_sr.8.b: "推行海峡泊税与护航凭证制度"
 oe_v58_sr.8.c: "分流香料船队改走巽他海峡航线"
 oe_v58_sr.9.title: "刺桐港外销青花瓷船队"
 oe_v58_sr.9.desc: "来自景德镇与德化龙窑的青花瓷器装入木箱，顺江而下运抵晋江（刺桐港）与广州码头。商船以细沙与茶叶防震压舱，上覆杭州绫罗绸缎，远销开罗、威尼斯与里斯本，身价倍增十倍。市舶司官员奏称，若广开官窑外销特许并核发商船勘合，海外白银必如潮涌入；但保守廷臣忧心海商坐大与倭寇走私，力主严控出海船额。"
 oe_v58_sr.9.a: "扩建外销官窑并广开市舶通商"
 oe_v58_sr.9.b: "特许定额勘合朝贡商船队出海"
 oe_v58_sr.9.c: "严申海禁以清肃沿海走私团伙"
 oe_v58_sr.10.title: "好望角绕航冲击波"
 oe_v58_sr.10.desc: "一纸急报震动威尼斯、开罗与大不里士的商馆钱庄：配备重炮的西洋大帆船已绕过非洲南端风浪角，直入印度洋源头抢购胡椒并炮击传统商船。一夜之间，里斯本香料市价骤降，黎凡特与红海传统转口关税剧烈震荡。欧亚各国皆面临百年未有之商路变局：究竟是倾力打造远洋武装商船以竞逐大洋，抑或是革新陆路与红海联运以守住旧商道命脉？"
 oe_v58_sr.10.a: "打造远洋武装船队迎战大洋时代"
 oe_v58_sr.10.b: "裁减陆关与红海转口税以稳住旧商道"
 oe_v58_sr.10.c: "构筑保护性关税壁垒抵御远洋商帮"
 oe_v58_sr.11.title: "威尼斯、开罗与崇高门廷外交"
 oe_v58_sr.11.desc: "地中海海洋共和国使节、黎凡特苏丹近臣与帝国宰相府秘使闭门密商东方香料商路之未来。案头摆着截然不同的方略：或是由威尼斯与安纳托利亚密运造船巨木南下苏伊士以组舰护航红海，或是在亚历山大与君士坦丁堡互授领事裁判与减税特约，抑或是对敌国商船颁布禁运令。在这场纵横捭阖的三角香料外交中，商路生死往往超越了教派藩篱。"
 oe_v58_sr.11.a: "签署互惠香料通商协定与领事条约"
 oe_v58_sr.11.b: "缔结黎凡特造船木材与海运联防密约"
 oe_v58_sr.11.c: "对商业劲敌实施战略禁运与封锁"
 oe_v58_sr.12.title: "白银换丝绸的跨洲大汇流"
 oe_v58_sr.12.desc: "自安第斯与日本银山经马尼拉、里斯本与热那亚流转而来，再汇入波斯铸币局与江南赋税库房，白银已化作贯通陆上丝路驼队与海上季风船队的共同血脉。从欧洲、伊斯兰世界、印度次大陆直至大明与东亚诸国，票号与钱庄正同步按银两汇率结算生丝、瓷器与胡椒期货。若能顺势建立严明成色与汇兑清算体系，本朝必可跃居欧亚金融枢纽，但亦须严防银价波动与货币贬值反噬民生。"
 oe_v58_sr.12.a: "设立帝国丝银双本位汇兑清算所"
 oe_v58_sr.12.b: "铸造标准通商金币与足色官银锭"
 oe_v58_sr.12.c: "严禁白银外流并充实内帑储备"
 building_type_oe_v58_sr_grand_caravanserai: "丝路大驿馆"
