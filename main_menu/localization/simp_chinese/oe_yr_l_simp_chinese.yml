 oe_yr.1.desc_tai4: "#F 至正十七年（1357年），太平召为中书左丞相。太平本名贺惟一，是汉人，受赐蒙古之名（《元史》卷一四〇）。#!\n\n如今，至正二十八年已过，大都依旧是朝廷的都城。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen1: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，红巾之乱已平，天命仍归大元。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen2: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，平乱以来的“至正中兴”已满两年。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen3: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，平乱之势两年不坠：群雄虽在，大局已稳。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen4: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，至正二十八年已过，大都依旧是朝廷的都城。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_x: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今朝局稍定。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.a: "汉法更化：任用汉臣，复经义取士，行汉法"
 oe_yr.1.a.tt: "路线定为“汉法更化”，以后不能更改。\n蒙古勋贵不悦。\n第一阶“安内”的条件：\n· 平乱不坏（必需）：平乱进行中时，平乱之势不低于#Y 50#!；\n　平乱已经收尾时，须是大元复振或照期收尾，且大都仍是都城\n· 再加下面三项中的至少两项：\n　— 钞法不低于“渐弊”\n　— 京仓不低于“平常”\n　— 各行省平均忠诚不低于#Y 40#!，且没有行省跌到最低一档\n· 连续满足#Y 6#!个月即过阶（中国王朝危机在身时暂停）。\n过阶时：蒙汉对立的强度#G −0.25#!（征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!），正统#G +5#!。\n危象（每月有一项就#R +1#!，没有就#G −1#!；满#Y 12#!则路线受挫，未过第一阶时即告中辍）：\n· 钞法不行；京师大饥\n· 平乱之势跌破#Y 35#!；行省平均忠诚低于#Y 30#!\n· 孛罗帖木儿当权；大都不再是都城；稳定低于#Y −10#!\n议定路线#Y 10#!年仍未过第一阶、失去大都、或平乱以失败告终，也会中辍。"
 oe_yr.1.b: "祖述国俗：以蒙古、色目为本，理财、诸王、漕运"
 oe_yr.1.b.tt: "路线定为“祖述国俗”，以后不能更改。\n第一阶“安内”的条件：\n· 平乱不坏（必需）：平乱进行中时，平乱之势不低于#Y 50#!；\n　平乱已经收尾时，须是大元复振或照期收尾，且大都仍是都城\n· 再加下面三项中的至少两项：\n　— 钞法不低于“渐弊”\n　— 京仓不低于“平常”\n　— 各行省平均忠诚不低于#Y 40#!，且没有行省跌到最低一档\n· 连续满足#Y 6#!个月即过阶（中国王朝危机在身时暂停）。\n过阶时：蒙汉对立的强度#G −0.25#!（征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!），正统#G +5#!。\n危象（每月有一项就#R +1#!，没有就#G −1#!；满#Y 12#!则路线受挫，未过第一阶时即告中辍）：\n· 钞法不行；京师大饥\n· 平乱之势跌破#Y 35#!；行省平均忠诚低于#Y 30#!\n· 孛罗帖木儿当权；大都不再是都城；稳定低于#Y −10#!\n议定路线#Y 10#!年仍未过第一阶、失去大都、或平乱以失败告终，也会中辍。"
 oe_yr.1.c: "暂缓再议"
 oe_yr.1.c.tt: "#Y 12#!个月后再议；至多推迟#Y 2#!次。"
 oe_yr.2.t: "安内告成"
 oe_yr.2.desc_an: "#F 至正十二年（1352年）三月，诏：“南人有才学者，依世祖旧制”，中书省、枢密院、御史台都可任用（《元史》卷四十二）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：汉臣入省，经筵再开，更化有了头绪。蒙汉对立的修正早已期满；其强度仍降低#G +0.25#!（各行省的忠诚目标#G +5#!），另得#bold #color_yellow 内外粗安#!#!：每月正统#G +0.02#!（每年正月续期）。"
 oe_yr.2.desc_ao: "#F 至正十二年（1352年）三月，诏：“南人有才学者，依世祖旧制”，中书省、枢密院、御史台都可任用（《元史》卷四十二）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：汉臣入省，经筵再开，更化有了头绪。蒙汉对立之势稍缓：强度降低#G +0.25#!，现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%；征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!。"
 oe_yr.2.desc_bn: "#F 世祖之制：宗王出镇四方，岁赐有常；国用仰给于理财之臣与海道的漕粮（通说）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：勋旧各安其位，诸王的岁赐如常，国用渐有着落。蒙汉对立的修正早已期满；其强度仍降低#G +0.25#!（各行省的忠诚目标#G +5#!），另得#bold #color_yellow 内外粗安#!#!：每月正统#G +0.02#!（每年正月续期）。"
 oe_yr.2.desc_bo: "#F 世祖之制：宗王出镇四方，岁赐有常；国用仰给于理财之臣与海道的漕粮（通说）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：勋旧各安其位，诸王的岁赐如常，国用渐有着落。蒙汉对立之势稍缓：强度降低#G +0.25#!，现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%；征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!。"
 oe_yr.2.desc_x: "#F 世祖之制：宗王出镇四方，岁赐有常；国用仰给于理财之臣与海道的漕粮（通说）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：勋旧各安其位，诸王的岁赐如常，国用渐有着落。蒙汉对立之势稍缓：强度降低#G +0.25#!，现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%；征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!。"
 oe_yr.2.a: "善"
 oe_yr.2.a.tt: "第一阶已过，正统#G +5#!。下一阶的事，朝中还在筹议。\n危象仍按月计算：满#Y 12#!时路线受挫，可能退回本阶以前。"
 oe_yr.7.t: "中兴受挫"
 oe_yr.7.desc_n1: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，路线还没有行稳，危象便接踵而至，中兴之议只得作罢。"
 oe_yr.7.desc_n2: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，路线议定已有10年，第一阶始终未成，中兴之议无疾而终。"
 oe_yr.7.desc_n3: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，大都已失，中兴无从谈起。"
 oe_yr.7.desc_n4: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，红巾之乱以朝廷失败告终，中兴无从谈起。"
 oe_yr.7.desc_ah: "#F 至正二十年（1360年），左丞相太平以疾辞位。此前皇太子与中宫谋“内禅”，使人示意太平，太平不应，由此失欢（一说，《元史》卷一四〇）。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_ag: "#F 行汉法的大臣得罪勋贵，往往不能久安其位。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_bh: "#F 至正十八年（1358年）以后，右丞相搠思监与宦者朴不花内外相结，贿赂公行（通说）。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_bg: "#F 倚重勋贵与理财之臣，钱财容易聚拢，怨望也容易积下。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_x: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.a: "罢更化之臣，以安众心"
 oe_yr.7.a.tt: "退回第一阶以前：此前减轻的蒙汉对立按原样恢复（修正尚未期满时连同修正）；本线的修正撤去。\n危象降到#Y 4#!；第一阶的条目重新计月。"
 oe_yr.7.b: "力保不移"
 oe_yr.7.b.tt: "花费#R 3#!个月的贸易与税收收入\n不退阶；危象降到#Y 6#!。每一阶只能力保一次。"
 oe_yr.7.c: "知道了"
 oe_yr.7.c.tt: "中兴之业到此为止：此前减轻的蒙汉对立已按原样恢复（修正尚未期满时连同修正），本线的修正撤去。"
