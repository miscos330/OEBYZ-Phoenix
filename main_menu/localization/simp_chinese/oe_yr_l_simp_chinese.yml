 oe_yr.1.t: "中兴之议"
 oe_yr.1.desc_toq1: "#F 后至元六年（1340年），脱脱逐伯颜，号为“更化”：复行科举，复太庙四时之祭，开经筵（据《元史》）。#!\n\n如今，红巾之乱已平，天命仍归大元。丞相脱脱仍在中书。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_toq2: "#F 后至元六年（1340年），脱脱逐伯颜，号为“更化”：复行科举，复太庙四时之祭，开经筵（据《元史》）。#!\n\n如今，平乱以来的“至正中兴”已满两年。丞相脱脱仍在中书。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_toq3: "#F 后至元六年（1340年），脱脱逐伯颜，号为“更化”：复行科举，复太庙四时之祭，开经筵（据《元史》）。#!\n\n如今，平乱之势两年不坠：群雄虽在，大局已稳。丞相脱脱仍在中书。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_toq4: "#F 后至元六年（1340年），脱脱逐伯颜，号为“更化”：复行科举，复太庙四时之祭，开经筵（据《元史》）。#!\n\n如今，至正二十八年已过，大都依旧是朝廷的都城。丞相脱脱仍在中书。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_tai1: "#F 至正十七年（1357年），太平召为中书左丞相。太平本名贺惟一，是汉人，受赐蒙古之名（《元史》卷一四〇）。#!\n\n如今，红巾之乱已平，天命仍归大元。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_tai2: "#F 至正十七年（1357年），太平召为中书左丞相。太平本名贺惟一，是汉人，受赐蒙古之名（《元史》卷一四〇）。#!\n\n如今，平乱以来的“至正中兴”已满两年。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
