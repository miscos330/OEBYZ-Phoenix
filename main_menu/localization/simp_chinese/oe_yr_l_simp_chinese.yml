 oe_yr.1.desc_tai4: "#F 至正十七年（1357年），太平召为中书左丞相。太平本名贺惟一，是汉人，受赐蒙古之名（《元史》卷一四〇）。#!\n\n如今，至正二十八年已过，大都依旧是朝廷的都城。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen1: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，红巾之乱已平，天命仍归大元。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen2: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，平乱以来的“至正中兴”已满两年。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen3: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，平乱之势两年不坠：群雄虽在，大局已稳。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_gen4: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今，至正二十八年已过，大都依旧是朝廷的都城。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.desc_x: "#F 世祖立国，兼用汉法与国俗；此后数十年，朝中“行汉法”与“祖述国俗”之争始终未息（通说）。#!\n\n如今朝局稍定。朝中有人请任用汉臣、复经义取士、行汉法；也有人主张以蒙古、色目为本，倚重诸王、理财与漕运。中兴之业，从哪一条路走？"
 oe_yr.1.a: "汉法更化：任用汉臣，复经义取士，行汉法"
 oe_yr.1.a.tt: "路线定为“汉法更化”，以后不能更改。\n蒙古勋贵不悦。\n第一阶“安内”的条件：\n· 平乱不坏（必需）：平乱进行中时，平乱之势不低于#Y 50#!；\n　平乱已经收尾时，须是大元复振或照期收尾，且大都仍是都城\n· 再加下面三项中的至少两项：\n　— 钞法不低于“渐弊”\n　— 京仓不低于“平常”\n　— 各行省平均忠诚不低于#Y 40#!，且没有行省跌到最低一档\n· 连续满足#Y 6#!个月即过阶（中国王朝危机在身时暂停）。\n过阶时：蒙汉对立的强度#G −0.25#!（征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!），正统#G +5#!。\n危象（每月有一项就#R +1#!，没有就#G −1#!；满#Y 12#!则路线受挫，未过第一阶时即告中辍）：\n· 钞法不行；京师大饥\n· 平乱之势跌破#Y 35#!；行省平均忠诚低于#Y 30#!\n· 孛罗帖木儿当权；大都不再是都城；稳定低于#Y −10#!\n议定路线#Y 10#!年仍未过第一阶、失去大都、或平乱以失败告终，也会中辍。"
 oe_yr.1.b: "祖述国俗：以蒙古、色目为本，理财、诸王、漕运"
 oe_yr.1.b.tt: "路线定为“祖述国俗”，以后不能更改。\n第一阶“安内”的条件：\n· 平乱不坏（必需）：平乱进行中时，平乱之势不低于#Y 50#!；\n　平乱已经收尾时，须是大元复振或照期收尾，且大都仍是都城\n· 再加下面三项中的至少两项：\n　— 钞法不低于“渐弊”\n　— 京仓不低于“平常”\n　— 各行省平均忠诚不低于#Y 40#!，且没有行省跌到最低一档\n· 连续满足#Y 6#!个月即过阶（中国王朝危机在身时暂停）。\n过阶时：蒙汉对立的强度#G −0.25#!（征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!），正统#G +5#!。\n危象（每月有一项就#R +1#!，没有就#G −1#!；满#Y 12#!则路线受挫，未过第一阶时即告中辍）：\n· 钞法不行；京师大饥\n· 平乱之势跌破#Y 35#!；行省平均忠诚低于#Y 30#!\n· 孛罗帖木儿当权；大都不再是都城；稳定低于#Y −10#!\n议定路线#Y 10#!年仍未过第一阶、失去大都、或平乱以失败告终，也会中辍。"
 oe_yr.1.c: "暂缓再议"
 oe_yr.1.c.tt: "#Y 12#!个月后再议；至多推迟#Y 2#!次。"
 oe_yr.2.t: "安内告成"
 oe_yr.2.desc_an: "#F 至正十二年（1352年）三月，诏：“南人有才学者，依世祖旧制”，中书省、枢密院、御史台都可任用（《元史》卷四十二）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：汉臣入省，经筵再开，更化有了头绪。蒙汉对立的修正早已期满；其强度仍降低#G +0.25#!（各行省的忠诚目标#G +5#!），另得#bold #color_yellow 内外粗安#!#!：每月正统#G +0.02#!（每年正月续期）。"
 oe_yr.2.desc_ao: "#F 至正十二年（1352年）三月，诏：“南人有才学者，依世祖旧制”，中书省、枢密院、御史台都可任用（《元史》卷四十二）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：汉臣入省，经筵再开，更化有了头绪。蒙汉对立之势稍缓：强度降低#G +0.25#!，现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%；征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!。"
 oe_yr.2.desc_bn: "#F 世祖之制：宗王出镇四方，岁赐有常；国用仰给于理财之臣与海道的漕粮（通说）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：勋旧各安其位，诸王的岁赐如常，国用渐有着落。蒙汉对立的修正早已期满；其强度仍降低#G +0.25#!（各行省的忠诚目标#G +5#!），另得#bold #color_yellow 内外粗安#!#!：每月正统#G +0.02#!（每年正月续期）。"
 oe_yr.2.desc_bo: "#F 世祖之制：宗王出镇四方，岁赐有常；国用仰给于理财之臣与海道的漕粮（通说）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：勋旧各安其位，诸王的岁赐如常，国用渐有着落。蒙汉对立之势稍缓：强度降低#G +0.25#!，现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%；征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!。"
 oe_yr.2.desc_x: "#F 世祖之制：宗王出镇四方，岁赐有常；国用仰给于理财之臣与海道的漕粮（通说）。#!\n\n如今，平乱之势不坏，钱粮与行省撑过了半年，朝廷终于腾得出手来：勋旧各安其位，诸王的岁赐如常，国用渐有着落。蒙汉对立之势稍缓：强度降低#G +0.25#!，现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%；征召兵与王室权力的惩罚随之减轻，各行省的忠诚目标#G +5#!。"
 oe_yr.2.a: "善"
 oe_yr.2.a.tt: "第一阶已过，正统#G +5#!。接下来进入第二阶“整纲”。\n第二阶“更化”的条件（全部满足并连满#Y 6#!个月）：\n· 采用“晋用汉官”政策；天朝选官非“直授”\n· 社会价值偏汉化达到#Y 20#!以上\n· 朝局不坏（将帅专兵不逾一份且孛罗未当权，或在整肃期内）\n· 完成“经理田粮”；钞法不低于“渐弊”；京仓不低于“平常”。\n第二阶“国俗”的条件（全部满足并连满#Y 6#!个月）：\n· 坚守“斥退汉官”政策；诸王岁赐不停\n· 在册藩王不少于#Y 3#!位，且平均忠诚不低于#Y 55#!\n· 朝局不坏（将帅专兵不逾一份且孛罗未当权，或在整肃期内）\n· 完成“经理田粮”；钞法不低于“渐弊”；京仓不低于“平常”。\n危象仍按月计算：满#Y 12#!时路线受挫，可能退回上一阶。"
 oe_yr.3.t: "更化有成"
 oe_yr.3.desc_nx: "#F 至正初年，欧阳玄、许有壬、危素等汉臣先后参与修史、典章与经筵，士大夫咸望朝廷复行汉法（据《元史》）。#!\n\n晋用汉官、经义取士与经理田粮诸务既定，连满半年而朝局不乱。旧日的管理混乱早已期满，如今蒙汉对立强度再降#G +0.25#!（行省忠诚目标再#G +5#!），另得#bold #color_yellow 文治渐复#!#!（内阁效率#G +3%#!），内阁亦开#bold #color_yellow 兴学校#!#!之举。老臣许有壬仍在朝中，金溪危素亦应诏入仕，堪任馆阁。"
 oe_yr.3.desc_nw: "#F 至正初年，欧阳玄、许有壬、危素等汉臣先后参与修史、典章与经筵，士大夫咸望朝廷复行汉法（据《元史》）。#!\n\n晋用汉官、经义取士与经理田粮诸务既定，连满半年而朝局不乱。旧日的管理混乱早已期满，如今蒙汉对立强度再降#G +0.25#!（行省忠诚目标再#G +5#!），另得#bold #color_yellow 文治渐复#!#!（内阁效率#G +3%#!），内阁亦开#bold #color_yellow 兴学校#!#!之举。金溪危素应诏入仕，堪任馆阁。"
 oe_yr.3.desc_no: "#F 至正初年，欧阳玄、许有壬、危素等汉臣先后参与修史、典章与经筵，士大夫咸望朝廷复行汉法（据《元史》）。#!\n\n晋用汉官、经义取士与经理田粮诸务既定，连满半年而朝局不乱。旧日的管理混乱早已期满，如今蒙汉对立强度再降#G +0.25#!（行省忠诚目标再#G +5#!），另得#bold #color_yellow 文治渐复#!#!（内阁效率#G +3%#!），内阁亦开#bold #color_yellow 兴学校#!#!之举。"
 oe_yr.3.desc_ox: "#F 至正初年，欧阳玄、许有壬、危素等汉臣先后参与修史、典章与经筵，士大夫咸望朝廷复行汉法（据《元史》）。#!\n\n晋用汉官、经义取士与经理田粮诸务既定，连满半年而朝局不乱。原版#bold #color_yellow 管理混乱#!#!随之除去，蒙汉对立强度再降#G +0.25#!（现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%，行省忠诚目标再#G +5#!）；内阁已开#bold #color_yellow 兴学校#!#!之举，可遣官分赴内地诸省广兴儒学。老臣许有壬仍在朝中，金溪危素亦应诏入仕，堪任馆阁。"
 oe_yr.3.desc_ow: "#F 至正初年，欧阳玄、许有壬、危素等汉臣先后参与修史、典章与经筵，士大夫咸望朝廷复行汉法（据《元史》）。#!\n\n晋用汉官、经义取士与经理田粮诸务既定，连满半年而朝局不乱。原版#bold #color_yellow 管理混乱#!#!随之除去，蒙汉对立强度再降#G +0.25#!（现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%，行省忠诚目标再#G +5#!）；内阁已开#bold #color_yellow 兴学校#!#!之举，可遣官分赴内地诸省广兴儒学。金溪危素应诏入仕，堪任馆阁。"
 oe_yr.3.desc_x: "#F 至正初年，欧阳玄、许有壬、危素等汉臣先后参与修史、典章与经筵，士大夫咸望朝廷复行汉法（据《元史》）。#!\n\n晋用汉官、经义取士与经理田粮诸务既定，连满半年而朝局不乱。原版#bold #color_yellow 管理混乱#!#!随之除去，蒙汉对立强度再降#G +0.25#!（现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%，行省忠诚目标再#G +5#!）；内阁已开#bold #color_yellow 兴学校#!#!之举，可遣官分赴内地诸省广兴儒学。"
 oe_yr.3.a: "善"
 oe_yr.3.a.tt: "第二阶“更化”告成：解锁内阁行动#bold #color_yellow 兴学校#!#!（内地诸省每月识字率#G +0.05#!、人口晋升#G +0.15%#!）；蒙汉对立强度再#G −0.25#!；管理混乱已撤（若该修正已期满，则改得#bold #color_yellow 文治渐复#!#!）。\n第三阶“复兴”的条件（全部满足并连满#Y 12#!个月）：\n· 仍守晋用汉官与经义取士；社会价值偏汉化达到#Y 40#!以上\n· 经本线开科取士至少#Y 2#!次；全国识字率较开议时提高#Y 3#!点\n· 钞法达到“通行”；京仓不低于“平常”\n· 行省平均忠诚不低于#Y 50#!；天朝威仪不低于#Y 50#!。"
 oe_yr.4.t: "国俗克振"
 oe_yr.4.desc_n: "#F 大元以宗亲分镇天下，岁赐不绝则藩屏自固；理财有方、漕运无缺，则国俗足以久安（通说）。#!\n\n国俗之政连满半年而朝局稳固：旧日的管理混乱早已期满，如今蒙汉对立强度再降#G +0.25#!（行省忠诚目标再#G +5#!）；在册诸王忠诚各#G +5#!，另得#bold #color_yellow 宗亲协力#!#!（征召兵#G +10%#!，每年正月续期）。"
 oe_yr.4.desc_x: "#F 大元以宗亲分镇天下，岁赐不绝则藩屏自固；理财有方、漕运无缺，则国俗足以久安（通说）。#!\n\n国俗之政连满半年而朝局稳固：宗王向心，岁赐如常，田赋钱粮俱有章法。原版#bold #color_yellow 管理混乱#!#!随之除去，蒙汉对立强度再降#G +0.25#!（现为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%，行省忠诚目标再#G +5#!）；在册诸王忠诚各#G +5#!，另得#bold #color_yellow 宗亲协力#!#!（征召兵#G +10%#!）。"
 oe_yr.4.a: "善"
 oe_yr.4.a.tt: "第二阶“国俗”告成：在册诸王忠诚各#G +5#!，获得#bold #color_yellow 宗亲协力#!#!（征召兵#G +10%#!）；蒙汉对立强度再#G −0.25#!；管理混乱已撤。\n第三阶“复兴”的条件（全部满足并连满#Y 12#!个月）：\n· 仍守“斥退汉官”政策且岁赐不停；诸王平均忠诚不低于#Y 65#!\n· 京仓达到“充裕”；钞法不低于“渐弊”\n· 行省平均忠诚不低于#Y 45#!；天朝威仪不低于#Y 50#!。"
 oe_yr.5.t: "经理田粮之议"
 oe_yr.5.desc_a: "#F 延祐元年（1314年），平章章闾请行“经理”田粮，遣官分往江浙、江西、河南三省，限四十日自实田亩；官吏苛急，虚增税额，“人不聊生，盗贼并起”，延祐二年（1315年）诏免三省自实田租（《元史》卷九十三）。#!\n\n如今整顿朝纲，户部请仿延祐故事，遣官分道核查江浙、江西、河南江北三省田亩，均定赋役。是要重金遣官缓行核实，还是径行括田入官以充国库？"
 oe_yr.5.desc_b: "#F 延祐元年（1314年），平章章闾请行“经理”田粮，遣官分往江浙、江西、河南三省，限四十日自实田亩；官吏苛急，虚增税额，“人不聊生，盗贼并起”，延祐二年（1315年）诏免三省自实田租（《元史》卷九十三）。#!\n\n如今国用浩繁，理财之臣请括江浙、江西、河南江北三省隐田入官，以充军国岁赐之费；亦有老臣鉴延祐之弊，请出钱遣官缓行经理。"
 oe_yr.5.desc_x: "#F 延祐元年（1314年），平章章闾请行“经理”田粮，遣官分往江浙、江西、河南三省，限四十日自实田亩；官吏苛急，虚增税额，“人不聊生，盗贼并起”，延祐二年（1315年）诏免三省自实田租（《元史》卷九十三）。#!\n\n如今整顿朝纲，户部请仿延祐故事，遣官分道核查江浙、江西、河南江北三省田亩，均定赋役。是要重金遣官缓行核实，还是径行括田入官以充国库？"
 oe_yr.5.a: "遣官经理，均定赋役"
 oe_yr.5.a.tt: "按月收入与贵族权力出资（3个月基数随贵族权力上浮，封顶10个月贸易与税收收入）。\n江浙、江西、河南江北三行省忠诚各#R −2#!；危象#R +2#!；完成第二阶“经理田粮”项。"
 oe_yr.5.b: "括田入官，以佐国用"
 oe_yr.5.b.tt: "得金#G +2#!个月的贸易与税收收入；贵族满意度大减，平民小加。\n江浙、江西、河南江北三行省忠诚各#R −5#!；危象#R +4#!；有#Y 25%#!机率令三省治所之一生发#bold #color_yellow 括田民怨#!#!（动乱#R +0.5#!，持续#Y 12#!个月）；完成“经理田粮”项。"
 oe_yr.5.c: "缓议"
 oe_yr.5.c.tt: "#Y 12#!个月后再议。"
 oe_yr.6.t: "复行经义取士"
 oe_yr.6.desc_x: "#F 后至元六年（1340年），脱脱复行科举；至正十一年（1351年）红巾初起，朝廷仍亲策进士八十三人，不废文教（《元史》卷四十二）。#!\n\n如今既定“汉法更化”，天朝选官却仍停留在“直授”旧制。礼部请照天朝旧例筹措经费，罢直授而复“经义取士”，使科举之路重开。"
 oe_yr.6.a: "罢直授，复经义取士"
 oe_yr.6.a.tt: "照原版天朝选官改制花费出资（6个月起，随天朝成员数略增）。\n天朝组织选官政策改为“经义取士”，社会价值大幅向汉化移动。"
 oe_yr.6.b: "缓之"
 oe_yr.6.b.tt: "首次暂缓将于#Y 12#!个月后再议一次；再次推辞则此后须自行改制。"
 oe_yr.7.t: "中兴受挫"
 oe_yr.7.desc_n1: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，路线还没有行稳，危象便接踵而至，中兴之议只得作罢。"
 oe_yr.7.desc_n2: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，路线议定已有10年，第一阶始终未成，中兴之议无疾而终。"
 oe_yr.7.desc_n3: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，大都已失，中兴无从谈起。"
 oe_yr.7.desc_n4: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，红巾之乱以朝廷失败告终，中兴无从谈起。"
 oe_yr.7.desc_ah: "#F 至正二十年（1360年），左丞相太平以疾辞位。此前皇太子与中宫谋“内禅”，使人示意太平，太平不应，由此失欢（一说，《元史》卷一四〇）。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_ag: "#F 行汉法的大臣得罪勋贵，往往不能久安其位。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_bh: "#F 至正十八年（1358年）以后，右丞相搠思监与宦者朴不花内外相结，贿赂公行（通说）。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_bg: "#F 倚重勋贵与理财之臣，钱财容易聚拢，怨望也容易积下。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.desc_x: "#F 元末朝中更张之议屡起屡罢，往往起于一时之安，败于一时之危（通说）。#!\n\n如今，危象接连而至（危象已满#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!），朝中有人请罢更化之臣，以安众心。"
 oe_yr.7.a: "罢更化之臣，以安众心"
 oe_yr.7.a.tt: "退回上一阶：本阶撤去或减轻的原版修正按原样恢复（尚未期满时连同修正）；本阶的奖励修正撤去。\n危象降到#Y 4#!；上一阶的条目重新计月。"
 oe_yr.7.b: "力保不移"
 oe_yr.7.b.tt: "花费#R 3#!个月的贸易与税收收入\n不退阶；危象降到#Y 6#!。每一阶只能力保一次。"
 oe_yr.7.c: "知道了"
 oe_yr.7.c.tt: "中兴之业到此为止：此前减轻或撤去的原版修正已按原样恢复（尚未期满时），本线的修正撤去。"
 oe_yr.8.t: "中兴告成：至正更化"
 oe_yr.8.desc_n: "#F 世祖初建大元，兼用汉法而定天下；后至元更化以来，朝野士大夫所望者，正此文治重光之日（据《元史》）。#!\n\n一整年里，汉官在省、经义取士连开两科、儒学渐兴、钱粮行省与天朝威仪俱全。旧弊既清，大元得长期修正#bold #color_yellow 至正更化#!#!（内阁效率#G +5%#!、每月正统#G +0.03#!，元祚未移则长存）。"
 oe_yr.8.desc_x: "#F 世祖初建大元，兼用汉法而定天下；后至元更化以来，朝野士大夫所望者，正此文治重光之日（据《元史》）。#!\n\n一整年里，汉官在省、经义取士连开两科、儒学渐兴、钱粮行省与天朝威仪俱全。久困朝廷的#bold #color_yellow 蒙汉对立#!#!与#bold #color_yellow 管理混乱#!#!悉数尽除，大元得长期修正#bold #color_yellow 至正更化#!#!（内阁效率#G +5%#!、每月正统#G +0.03#!，元祚未移则长存）。"
 oe_yr.8.a: "大元中兴"
 oe_yr.8.a.tt: "中兴路线圆满告成：蒙汉对立与管理混乱完全撤去，获得永久修正#bold #color_yellow 至正更化#!#!（内阁效率#G +5%#!、每月正统#G +0.03#!，元亡即撤）；危象不再计算。"
 oe_yr.9.t: "中兴告成：国俗中兴"
 oe_yr.9.desc_n: "#F 草原旧制以宗王藩屏、岁赐维系、漕粮足国；若能守成不坠，则大元仍可凭祖宗旧法雄踞朔漠与中原（通说）。#!\n\n一整年里，国俗不移、宗王倾心、京仓充裕、钱粮行省与天朝威仪俱全。旧弊既清，大元得长期修正#bold #color_yellow 国俗中兴#!#!（征召兵#G +10%#!、陆军士气#G +5%#!，元祚未移则长存）。"
 oe_yr.9.desc_x: "#F 草原旧制以宗王藩屏、岁赐维系、漕粮足国；若能守成不坠，则大元仍可凭祖宗旧法雄踞朔漠与中原（通说）。#!\n\n一整年里，国俗不移、宗王倾心、京仓充裕、钱粮行省与天朝威仪俱全。久困朝廷的#bold #color_yellow 蒙汉对立#!#!与#bold #color_yellow 管理混乱#!#!悉数尽除，大元得长期修正#bold #color_yellow 国俗中兴#!#!（征召兵#G +10%#!、陆军士气#G +5%#!，元祚未移则长存）。"
 oe_yr.9.a: "大元中兴"
 oe_yr.9.a.tt: "中兴路线圆满告成：蒙汉对立与管理混乱完全撤去，获得永久修正#bold #color_yellow 国俗中兴#!#!（征召兵#G +10%#!、陆军士气#G +5%#!，元亡即撤）；危象不再计算。"
 oe_yr.10.t: "开科取士"
 oe_yr.10.desc_x: "#F 大元科举三年一科；至正十一年（1351年）春，虽四方兵起，朝廷仍亲策进士八十三人，以笼络士心（《元史》卷四十二）。#!\n\n又届三年大比之期，礼部奏请开科取士。须留意：唯有经由此事开科，方计入中兴第三阶的科举次数（目前已开#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_keju')|0]#!科，需#Y 2#!科）。"
 oe_yr.10.a: "开科取士"
 oe_yr.10.a.tt: "照原版科举行动：天朝威仪小减，随即召来一位新科进士入朝；本线开科次数加1（36个月后再届大比）。"
 oe_yr.10.b: "今岁停科"
 oe_yr.10.b.tt: "不耗天朝威仪，也不计科举次数；36个月后再届大比。"
 oe_yr.11.t: "朝中两党"
 oe_yr.11.desc_ah: "#F 至正十七年（1357年），太平为中书左丞相。时皇太子与中宫渐起异议，朝中内外党争日炽（一说，《元史》卷一四〇）。#!\n\n如今两宫与外朝之争浮上台面，朝局随时可能失控：是要出资整肃朝纲、强保两年朝局，还是弥缝调停，抑或暂倚权臣以济急用？"
 oe_yr.11.desc_ag: "#F 行汉法既深，朝中清流与宫禁近幸往往互不相容，政令常为两党所掣肘（通说）。#!\n\n如今两宫与外朝之争浮上台面，朝局随时可能失控：是要出资整肃朝纲、强保两年朝局，还是弥缝调停，抑或暂倚权臣以济急用？"
 oe_yr.11.desc_bh: "#F 至正十八年（1358年），搠思监入为右丞相，与宦者朴不花表里用事，权势日重，朝臣多畏之（通说）。#!\n\n如今权臣与近幸表里用事，朝野议论纷纷：是要出资整肃朝纲、强保两年朝局，还是弥缝调停，抑或顺水推舟、借其聚财以济急用？"
 oe_yr.11.desc_bg: "#F 勋旧权臣与宫中近幸联手理财，虽能一时聚财，却易令中枢纪纲弛废（通说）。#!\n\n如今权臣与近幸表里用事，朝野议论纷纷：是要出资整肃朝纲、强保两年朝局，还是弥缝调停，抑或顺水推舟、借其聚财以济急用？"
 oe_yr.11.desc_x: "#F 行汉法既深，朝中清流与宫禁近幸往往互不相容，政令常为两党所掣肘（通说）。#!\n\n如今两宫与外朝之争浮上台面，朝局随时可能失控：是要出资整肃朝纲、强保两年朝局，还是弥缝调停，抑或暂倚权臣以济急用？"
 oe_yr.11.a: "整肃朝纲"
 oe_yr.11.a.tt: "花费#R 2#!个月的贸易与税收收入\n危象#R +2#!；今后#Y 24#!个月内，第二阶“朝局”一条视作满足。"
 oe_yr.11.b: "弥缝调停"
 oe_yr.11.b.tt: "不花钱也不增危象；第二阶“朝局”一条仍照常核验。"
 oe_yr.11.c: "倚权臣以济急"
 oe_yr.11.c.tt: "得金#G +2#!个月的贸易与税收收入；危象#R +3#!；今后#Y 12#!个月内，第二阶“朝局”一条无法满足。"
 oe_yr.20.t: "大元中兴：选项生效"
 oe_yr.90.t: "【测试】大元中兴：读数"
