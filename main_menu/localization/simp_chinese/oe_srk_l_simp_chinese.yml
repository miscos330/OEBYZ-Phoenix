 OE_SRK_CONC_0: "筹议中"
 oe_srk_dec_overland_caravan.title: "遣发双凤万里陆路官商队"
 oe_srk_dec_overland_caravan.desc: "循君士坦丁堡、特拉比松、大不里士、撒马尔罕与喀什噶尔至大都的古驿道遣发护卫官商队，拓展陆贸并深化双凤友谊，然护商轻骑耗费甚巨。"
 oe_srk_dec_overland_caravan.a: "拨帑护商，驼铃西东"
 oe_srk_dec_maritime_voyage.title: "启航刺桐亚历山大瓷香船队"
 oe_srk_dec_maritime_voyage.desc: "经刺桐港、印度洋、亚历山大与金角湾遣发官营香料青花瓷商船，海贸与航程倍增，惟护航轻舰维护费与海盗风险随之上升。"
 oe_srk_dec_maritime_voyage.a: "扬帆远洋，联通双港"
 oe_srk_dec_scholar_mission.title: "召开双凤历算与典籍大会"
 oe_srk_dec_scholar_mission.desc: "邀集希腊天文医家与大元司天台历算雕版名匠会讲译书，显著加速科研与思潮传播，然保守教士颇有疑虑。"
 oe_srk_dec_scholar_mission.a: "广延东西名宿，汇译典籍"
 oe_srk.1.t: "万里通使：丝路双凤相认"
 oe_srk.1.desc_dual: "#F 十三世纪以来，巴列奥略皇女玛丽亚远嫁蒙古、京师修士拉班扫马朝拜君士坦丁堡，及至一三三九至一三四二年马黎诺里经金角湾与卡法直抵大都，欧亚东西两端早已留下深厚渊源。#!\n\n如今，君士坦丁堡与大都两大中兴帝国竟同时屹立欧亚东西两极！双廷使者携希腊文与畏兀儿蒙古文国书在黑海与西域交汇，共议“丝路双凤”正式建交：是互设常驻使馆，还是仅遣特许商帮往来？"
 oe_srk.1.desc_west: "#F 十三世纪以来，巴列奥略皇女玛丽亚远嫁蒙古、京师修士拉班扫马朝拜君士坦丁堡，及至一三三九至一三四二年马黎诺里经金角湾与卡法直抵大都，欧亚东西两端早已留下深厚渊源。#!\n\n如今，东罗马重振地中海与黑海，商使循马黎诺里旧途东探丝路。虽东方局势变幻，君士坦丁堡朝廷仍决意重续“拂菻与契丹”千年通使之业：是广建东方使馆，还是专设特许商帮？"
 oe_srk.1.desc_east: "#F 十三世纪以来，巴列奥略皇女玛丽亚远嫁蒙古、京师修士拉班扫马朝拜君士坦丁堡，及至一三三九至一三四二年马黎诺里经金角湾与卡法直抵大都，欧亚东西两端早已留下深厚渊源。#!\n\n如今，中兴大元威振东亚，来自西海拂菻罗马的商使与希腊文书循丝路抵大都。虽西方烽烟未靖，中书省议定重启远西邦交：是在大都设立拂菻常驻馆驿，还是仅许行商代办往来？"
 oe_srk.1.a: "仅遣特许商帮代办往来，不设常驻国使"
 oe_srk.1.a.tt: "获得[ShowModifier('oe_srk_factor_ties')]（#Y 180#!个月：贸易收入增而外交声望略降）；若双凤并存则双方好感#G +20#!。"
 oe_srk.1.b: "互设常驻帝廷使馆（拂菻馆与契丹馆），正式建交"
 oe_srk.1.b.tt: "双方获得[ShowModifier('oe_srk_twin_legations')]（#Y 180#!个月：外交声望与陆贸提升，月控制略降）；若双凤并存则双方好感#G +50#!。"
 oe_srk.2.t: "万里陆路商队宪章"
 oe_srk.2.desc_open: "#F 陆上丝绸之路自君士坦丁堡渡黑海抵特拉比松，经大不里士、撒马尔罕与喀什噶尔翻越天山直入大都，沿途驿站安全与护商骑军决定着万里驼队的生死荣枯。#!\n\n如今，中亚与河中驿道已然畅通，特拉比松、大不里士与撒马尔罕商队络绎不绝。朝廷请示：是斥资共建万里陆路护商驿站，还是将沿途商税包予草原与绿洲商帮？"
 oe_srk.2.desc_tense: "#F 陆上丝绸之路自君士坦丁堡渡黑海抵特拉比松，经大不里士、撒马尔罕与喀什噶尔翻越天山直入大都，沿途驿站安全与护商骑军决定着万里驼队的生死荣枯。#!\n\n如今，黑海至中亚沿线仍偶有诸侯摩擦，长途商队需重兵护行方能贯通特拉比松、大不里士、撒马尔罕与喀什噶尔。朝廷将如何经略这条万里陆路？"
 oe_srk.2.a: "将沿途护商榷税包予草原与绿洲商帮"
 oe_srk.2.a.tt: "获得[ShowModifier('oe_srk_syndicate_tolls')]（#Y 180#!个月：贸易收入与市民满意度提升，全国月控制度下降）。"
 oe_srk.2.b: "拨帑共建君堡至大都陆路总驿与护商轻骑"
 oe_srk.2.b.tt: "双方获得[ShowModifier('oe_srk_overland_charter')]（#Y 180#!个月：陆贸#G +10%#!与商容大增，轻骑维护费#R +15%#!）；君士坦丁堡、特拉比松、撒马尔罕与大都获[ShowModifier('oe_srk_caravan_hub')]。"
 oe_srk.3.t: "海上丝路：刺桐、亚历山大与金角湾"
 oe_srk.3.desc_open: "#F 除陆路驼队外，经泉州刺桐港下南洋、越印度洋抵红海与亚历山大、再北入君士坦丁堡的海上丝路，乃青花瓷、生丝与丁香胡椒利润最巨的黄金航道。#!\n\n如今，大元刺桐港市舶司畅通无阻，西洋大舶直通印度洋与亚历山大港！朝廷是重金特许直航官商船队联通刺桐与金角湾，还是继续借重印度洋转口商舶？"
 oe_srk.3.desc_relay: "#F 除陆路驼队外，经泉州刺桐港下南洋、越印度洋抵红海与亚历山大、再北入君士坦丁堡的海上丝路，乃青花瓷、生丝与丁香胡椒利润最巨的黄金航道。#!\n\n如今，东南亚与印度洋帆樯云集，纵使东南海口管制尚严，刺桐瓷器与南洋香料仍借转口商船源源抵亚历山大与君士坦丁堡。朝廷是斥资组建特许远洋船队，还是顺势依托转口商帮？"
 oe_srk.3.a: "依托印度洋与亚历山大转口商舶维系海贸"
 oe_srk.3.a.tt: "获得[ShowModifier('oe_srk_broker_maritime')]（#Y 180#!个月：海贸小增且抑盗，市民满意度目标略降）。"
 oe_srk.3.b: "重金特许刺桐至金角湾官商瓷香直航船队"
 oe_srk.3.b.tt: "双方获得[ShowModifier('oe_srk_maritime_link')]（#Y 180#!个月：海贸#G +10%#!与航程#G +20%#!，轻舰维护费#R +15%#!且海盗风险略升）；晋江、亚历山大与君堡获[ShowModifier('oe_srk_porcelain_port')]。"
 oe_srk.4.t: "东西学人交汇：星历、雕版与医典"
 oe_srk.4.desc_ren: "#F 当君士坦丁堡的托勒密天文学、盖伦医学与希腊抄书馆，遇上大都回回司天台、郭守敬授时历、活字雕版与桑蚕农书，一场横跨欧亚的文明对话就此展开。#!\n\n如今，博斯普鲁斯文艺复兴思潮方兴未艾，东西方学者正热切互译天文历表与医典。朝廷是拨帑共建双凤译书院与天文台（恐招保守教士侧目），还是将交流限于舆图与桑蚕农艺？"
 oe_srk.4.desc_gen: "#F 当君士坦丁堡的托勒密天文学、盖伦医学与希腊抄书馆，遇上大都回回司天台、郭守敬授时历、活字雕版与桑蚕农书，一场横跨欧亚的文明对话就此展开。#!\n\n如今，东西使团随行天算家与画师呈上星盘、历书与印本典籍，请建常设学术交流机构。朝廷是广设双凤译书院，还是仅限于实用舆图与农书汇纂？"
 oe_srk.4.a: "仅交流实用航海舆图与桑蚕农艺，免惹教务争议"
 oe_srk.4.a.tt: "获得[ShowModifier('oe_srk_cartography_maps')]（#Y 180#!个月：思潮传播与稳定成本改善，科研速度略降）。"
 oe_srk.4.b: "拨帑共建双凤天算译书院，互译星历医典与印书术"
 oe_srk.4.b.tt: "双方获得[ShowModifier('oe_srk_scholar_exchange')]（#Y 180#!个月：科研#G +6%#!、思潮传播#G +10%#!与识字率提升，教士满意度目标下降）。"
 oe_srk.5.t: "火药、铸炮与丝瓷匠盟"
 oe_srk.5.desc_x: "#F 东方的火药配比、铜火铳与青花瓷窑，与西方的重型攻城铜炮、海战火器与皇室紫锦织造各擅胜场。匠师与秘方的跨境流动，既能铸就无匹军工，亦暗藏泄密之忧。#!\n\n如今，双廷工部与军器局拟定匠师互访名录：是破例开放火器铸炮与冶金工坊互鉴（提升攻城与产能，但火炮军费增且秘方易泄），还是严守军工、专通瓷器与丝锦行会？"
 oe_srk.5.a: "严守军工秘方，仅通青花瓷窑与丝锦行会"
 oe_srk.5.a.tt: "获得[ShowModifier('oe_srk_luxury_guilds')]（#Y 180#!个月：生产效率与贸易收入提升，攻城能力略降）；若大元钞法运行则宝钞信用#G +4#!。"
 oe_srk.5.b: "互派军器局铸炮匠与火药瓷窑大师切磋革新"
 oe_srk.5.b.tt: "双方获得[ShowModifier('oe_srk_gunpowder_guilds')]（#Y 180#!个月：攻城#G +8%#!与生产#G +6%#!提升，火炮维护费#R +15%#!且月控制略降）。"
 oe_srk.6.t: "汗八里与金角湾：正教与景教驿使"
 oe_srk.6.desc_x: "#F 大都阿速宿卫本奉东方正教，草原诸部亦多景教（东方教会）信众；而君士坦丁堡至今矗立着巴列奥略皇女所建的“蒙古圣母堂”，见证着跨越宗派的古道情谊。#!\n\n如今，正教与景教使僧请准沿丝路商站互修驿堂与施医院，以佑万里商旅。朝廷面临抉择：是护持沿途驿堂、展现跨欧亚包容气度，还是坚守纯世俗外交以安抚本土保守教士？"
 oe_srk.6.a: "坚守纯世俗商使仪轨，以安本土正统教士之心"
 oe_srk.6.a.tt: "获得[ShowModifier('oe_srk_secular_embassy')]（#Y 180#!个月：教士满意度与正统宽容提升，外交声望略降）。"
 oe_srk.6.b: "护持丝路正教与景教驿堂，续写蒙古圣母堂旧谊"
 oe_srk.6.b.tt: "双方获得[ShowModifier('oe_srk_ecumenical_chapels')]（#Y 180#!个月：异端与异教宽容及外交声望大增，教士满意度目标下降）；双方好感#G +25#!。"
 oe_srk.7.t: "丝路风波：草原劫掠、关税战与海盗"
 oe_srk.7.desc_x: "#F 万里丝路从非坦途：草原强盗截掠大不里士与撒马尔罕间的驼队、威尼斯与热那亚商帮嫉恨排挤、印度洋海盗伺机袭扰瓷器商舶，商路危机随时可能令数年经营付诸东流。#!\n\n如今，陆海两路同时告急：草原劫匪与印度洋海盗连番得手，更有竞争港口趁机加征过境重税！朝廷是急拨重帑增派陆海武装护航，还是以报复性重税应对、忍受商路收缩？"
 oe_srk.7.a: "加征报复性口岸重税，忍受长途商路暂时收缩"
 oe_srk.7.a.tt: "获得[ShowModifier('oe_srk_tariff_squeeze')]（#Y 72#!个月：税效略增，但陆贸与海贸效率各#R −8%#!且市民满意度下降）。"
 oe_srk.7.b: "急拨重帑增派轻骑与巡海轻舰护航，力保丝路畅通"
 oe_srk.7.b.tt: "双方获得[ShowModifier('oe_srk_route_escorts')]（#Y 120#!个月：贸易保护#G +15%#!与陆贸提升，轻骑与轻舰维护费各#R +15%#!）。"
 oe_srk.8.t: "丝路双凤大宪章"
 oe_srk.8.desc_dual: "#F 历经数十载的使节往来、驿站营造、学人互译与共克风波，横贯欧亚大陆的陆海丝路重现盛唐与元初之后最辉煌的黄金格局。#!\n\n如今，君士坦丁堡的罗马双头鹰与大都的大元黄金凤旌跨越万里遥相辉映！双廷拟定终局大约：是重金缔结贯通陆海与学术的“丝路双凤大宪章”，还是立定稳健的“金银丝瓷平衡商约”？"
 oe_srk.8.desc_solo: "#F 历经数十载的使节往来、驿站营造、学人互译与共克风波，横贯欧亚大陆的陆海丝路重现盛唐与元初之后最辉煌的黄金格局。#!\n\n如今，我朝凭借一国之雄厚国力独擎欧亚丝路火炬，令万里陆海通途不致中断。朝廷拟定长远定章：是斥资确立贯通陆海的“丝路凤凰大宪章”，还是以“金银丝瓷商约”稳健收利？"
 oe_srk.8.a: "立定“金银丝瓷平衡商约”，稳健维系跨洲汇兑"
 oe_srk.8.a.tt: "获得40年[ShowModifier('oe_srk_silver_silk_treaty')]（贸易收入、商容与稳定成本改善，月通胀略升）；若大元钞法运行则宝钞信用#G +6#!。本线完结。"
 oe_srk.8.b: "缔结“丝路双凤大宪章”，永固欧亚陆海与文教大业"
 oe_srk.8.b.tt: "双方获得40年[ShowModifier('oe_srk_twin_concordat')]（陆海贸易各#G +10%#!、外交与科研大振，月控制略降且轻骑轻舰维护费各#R +10%#!）；双方好感#G +50#!。本线完结。"
 oe_srk.20.t: "丝路双凤：选项生效"
