 # NEW 2026-11-21 v7.2 Stage 3 Package 1B (oe_srk_ Silk Road Twin Phoenix). Generated by gen_silk_phoenix.py; edit the generator, not this file.
 oe_srk_b_twin_phoenix: "丝路双凤通好"
 oe_srk_b_trade_envoys: "丝路商使往来"
 oe_srk_b_chapel_accord: "汗八里与君堡驿堂之谊"
 STATIC_MODIFIER_NAME_oe_srk_twin_legations: "双凤常驻使馆（拂菻馆与契丹馆）"
 STATIC_MODIFIER_DESC_oe_srk_twin_legations: "君士坦丁堡与大都互设常驻使馆，跨欧亚外交与陆贸效率提升，然异邦商使杂处令中枢控驭略耗。"
 STATIC_MODIFIER_NAME_oe_srk_factor_ties: "特许丝路行商代办"
 STATIC_MODIFIER_DESC_oe_srk_factor_ties: "仅以特许商帮维系东西往来，贸易收入稳增而帝国外交礼遇趋于冷淡。"
 STATIC_MODIFIER_NAME_oe_srk_overland_charter: "万里陆路商队宪章"
 STATIC_MODIFIER_DESC_oe_srk_overland_charter: "自君士坦丁堡经特拉比松、大不里士、撒马尔罕与喀什噶尔直达大都的驿路畅通，陆贸与商容大振而护商轻骑岁费高昂。"
 STATIC_MODIFIER_NAME_oe_srk_syndicate_tolls: "草原绿洲商帮包税"
 STATIC_MODIFIER_DESC_oe_srk_syndicate_tolls: "将沿途护商榷税包予中亚与黑海商帮，贸易收入与市民满意度提升，然国家控制度随之流失。"
 STATIC_MODIFIER_NAME_oe_srk_maritime_link: "刺桐亚历山大瓷香航路"
 STATIC_MODIFIER_DESC_oe_srk_maritime_link: "贯通刺桐港、亚历山大与金角湾的远洋香料瓷器航路，海贸与航程剧增，然轻船护航费重且海盗滋生略升。"
 STATIC_MODIFIER_NAME_oe_srk_broker_maritime: "印度洋转口商舶"
 STATIC_MODIFIER_DESC_oe_srk_broker_maritime: "依托阿拉伯与南洋转口商船维系海路通货，海贸小增且少盗警，然本国市民商帮利益受损。"
 STATIC_MODIFIER_NAME_oe_srk_scholar_exchange: "双凤天算译书院"
 STATIC_MODIFIER_DESC_oe_srk_scholar_exchange: "希腊托勒密历算、医学与大元授时历、雕版印书交汇互鉴，科研、思潮传播与识字率跃升，然保守教士颇有微词。"
 STATIC_MODIFIER_NAME_oe_srk_cartography_maps: "实用舆图与农书汇纂"
 STATIC_MODIFIER_DESC_oe_srk_cartography_maps: "仅交流航海舆图与桑蚕农艺而不涉神学哲学，思潮与稳定稳步改善，然前沿科研步伐稍缓。"
 STATIC_MODIFIER_NAME_oe_srk_gunpowder_guilds: "火器铸炮与瓷窑匠盟"
 STATIC_MODIFIER_DESC_oe_srk_gunpowder_guilds: "大元火药火铳与东罗马攻城铸炮、织锦瓷窑互通匠师，攻城能力与生产大涨，然火炮养费攀升且技术外流难控。"
 STATIC_MODIFIER_NAME_oe_srk_luxury_guilds: "丝瓷贡品行会"
 STATIC_MODIFIER_DESC_oe_srk_luxury_guilds: "严守军工机密、专通青花瓷与紫袍锦缎，生产与商贸收益丰厚，然攻城火器革新滞后。"
 STATIC_MODIFIER_NAME_oe_srk_ecumenical_chapels: "丝路正教与景教驿堂"
 STATIC_MODIFIER_DESC_oe_srk_ecumenical_chapels: "循蒙古圣母堂与汗八里阿速宿卫旧谊，在驿道沿线护持正教与景教礼拜堂，包容与外交大振而本土教士阶层不满。"
 STATIC_MODIFIER_NAME_oe_srk_secular_embassy: "纯世俗通商使团"
 STATIC_MODIFIER_DESC_oe_srk_secular_embassy: "将东西往来严限于世俗商贸与国书礼仪，本国教士与正统人心安稳，然跨宗教外交格局偏窄。"
 STATIC_MODIFIER_NAME_oe_srk_route_escorts: "陆海商路武装护航"
 STATIC_MODIFIER_DESC_oe_srk_route_escorts: "东西双廷共派轻骑与巡海轻舰弹压草原劫匪与印度洋海盗，商路保护大固而陆海维护费双双上涨。"
 STATIC_MODIFIER_NAME_oe_srk_tariff_squeeze: "报复性重税与商路收缩"
 STATIC_MODIFIER_DESC_oe_srk_tariff_squeeze: "以加征口岸重税应对外邦掣肘与劫掠，财政税效略增而陆海长途贸易与商民满意度齐跌。"
 STATIC_MODIFIER_NAME_oe_srk_twin_concordat: "丝路双凤大宪章"
 STATIC_MODIFIER_DESC_oe_srk_twin_concordat: "东罗马与大元横贯欧亚的陆海盟约正式定型，陆海商贸、外交与学术俱臻鼎盛，然万里护航与开放门户亦带来长久行政与军费重负。"
 STATIC_MODIFIER_NAME_oe_srk_silver_silk_treaty: "金银丝瓷平衡商约"
 STATIC_MODIFIER_DESC_oe_srk_silver_silk_treaty: "以君士坦丁堡金银与大元丝瓷构筑稳健汇兑通商机制，商税、商容与朝廷稳定俱佳，惟贵金属跨境涌动带来轻微通胀压力。"
 STATIC_MODIFIER_NAME_oe_srk_caravan_hub: "双凤陆路总驿"
 STATIC_MODIFIER_DESC_oe_srk_caravan_hub: "东西万里商队云集此城，商力与中心贸易权重显著增强，然胡汉流寓激增引发轻微街市躁动。"
 STATIC_MODIFIER_NAME_oe_srk_porcelain_port: "丝路瓷香大港"
 STATIC_MODIFIER_DESC_oe_srk_porcelain_port: "刺桐瓷器与地中海香料帆樯蔽港，商力与海上存在大增，然客商走私与港市摩擦并存。"
 OE_SRK_MODE_1: "双凤并耀（罗马与大元）"
 OE_SRK_MODE_2: "西凤东望（罗马单强）"
 OE_SRK_MODE_3: "东凤西通（大元单强）"
