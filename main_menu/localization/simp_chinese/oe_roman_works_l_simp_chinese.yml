 oe_roman_works.1.t: "万众重返竞技场"
 oe_roman_works.1.d: "重建的拱门向市民敞开，层层看台渐渐坐满。乐声与欢呼越过街巷，罗马终于不必只向废墟追问自己的荣光。"
 oe_roman_works.1.a: "这座城市仍然属于活着的罗马人。"
