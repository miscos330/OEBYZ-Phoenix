 oe_roman_works.7.t: "清水入城"
 oe_roman_works.7.d: "工匠撤去了最后一道临时挡板，清水顺着修复的水道流进城中。取水的队伍不再挤满远处的井口，沿线的田地也有了新的生机。"
 oe_roman_works.7.a: "这便是帝国为市民做的事。"
 oe_gw_nimes_waterworks: "尼姆帝国引水线"
 oe_gw_nimes_waterworks_desc: "从于泽斯的水源到尼姆城内，逐段恢复古代引水线。加尔桥只是工程的一部分，清水必须走完整条道路才能造福城市。\n\n本地人口增长+0.01%；人口容量+250K；本地原产规模上限+25%。"
