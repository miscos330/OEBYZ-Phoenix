 oe_roman_works.5.a: "愿教导与仁慈一同从这里传出。"
 oe_gw_carthage_ports: "迦太基双港"
 oe_gw_carthage_ports_desc: "在突尼斯所辖的古迦太基港址整修水道，分别建设商港和军港。旧日港湾的轮廓，将成为帝国经营阿非利加的新起点。\n\n本地造船速度+20%；本地水手+20%；贸易容量+10。"
