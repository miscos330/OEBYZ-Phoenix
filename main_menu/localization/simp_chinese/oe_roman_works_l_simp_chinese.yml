 oe_commission_carthage_ports_desc: "在突尼斯所辖的古迦太基港址整修水道，分别建设商港和军港。旧日港湾的轮廓，将成为帝国经营阿非利加的新起点。\n\n花费：#R 7000#!金币；基础工期：2920天。无权威花费。\n完工效果：本地造船速度+20%；本地水手+20%；贸易容量+10。\n竣工事件提供帝国权威#G +3#!，并保留该工程的其他竣工奖励。"
 oe_commission_carthage_ports.a: "重开商港与军港，让阿非利加重返海洋。"
 oe_commission_carthage_ports.desc: "在突尼斯所辖的古迦太基港址整修水道，分别建设商港和军港。旧日港湾的轮廓，将成为帝国经营阿非利加的新起点。\n\n花费：#R 7000#!金币；基础工期：2920天。无权威花费。\n完工效果：本地造船速度+20%；本地水手+20%；贸易容量+10。\n竣工事件提供帝国权威#G +3#!，并保留该工程的其他竣工奖励。"
 oe_roman_works.6.t: "双港再启"
 oe_roman_works.6.d: "随着古老防波堤与深水泊位全面修葺竣工，帝国都城的双港再度焕发昔日荣光。来自黑海与地中海的满载商船井然有序地在外港泊岸卸货，帝国战舰则驶入戒备森严的新建内港船坞整补修缮，厚重石堤稳稳挡住风浪，两座港湾终于各得其所。"
 oe_roman_works.6.a: "商帆与军旗，将在这里共同升起。"
 oe_gw_segovia_waterworks: "塞哥维亚帝国引水系统"
 oe_gw_segovia_waterworks_desc: "修缮古代引水渠的取水口、水槽和城内配水设施，使雄伟的石拱重新服务于市民、田地与工坊。\n\n本地人口增长+0.01%；本地叛乱度−5%；人口容量+250K；本地原产规模上限+25%。"
