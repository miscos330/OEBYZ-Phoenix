 oe_roman_works.100.t: "帝国军械局的选址"
 oe_roman_works.100.d: "武器样式、检验尺度和储备清册已经拟定。现在，我们需要择定一座城市，使附近的工匠与军队能够依托一处可靠的军械机构。\n\n塞萨洛尼基、锡瓦斯、热那亚与威尼斯各可开设一座；只有当前符合条件的地点可供选择。"
 oe_roman_works.100.cancel: "暂缓选址。"
