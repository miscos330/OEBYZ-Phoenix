 oe_roman_works.8.t: "高卢的清泉"
 oe_roman_works.8.d: "来自于泽斯的清水越过桥渠，最终流入尼姆的蓄水池。沿线官员逐一呈报完工，漫长的修缮终于连成一条可用的水道。"
 oe_roman_works.8.a: "让流水成为罗马归来的见证。"
 oe_gw_imperial_armory: "帝国军械局"
 oe_gw_imperial_armory_desc: "在塞萨洛尼基、锡瓦斯、热那亚或威尼斯设立军械局，统一武器样式、验收与储备。四地各可设立一座，为帝国不同战区提供可靠的装备。\n\n每座全国陆军维护效率+5%；本地征召速度+20%。"
