 oe_roman_works.9.t: "第一批制式军械"
 oe_roman_works.9.d: "[scope:oe_gw_site.GetName]的新军械局已完成验收。工匠按照统一的尺度交付第一批装备，军官们终于可以按清册领用，而不必临阵四处征集。"
 oe_roman_works.9.a: "将样式与尺度发往各军区。"
 oe_gw_nicaea_medicine: "尼西亚帝国医学院"
 oe_gw_nicaea_medicine_desc: "将医理讲授、药方抄录与病患照料置于同一所学院之中。受训的医者将带着知识走向帝国各地，使学问成为可以救人的技艺。\n\n全国疫病抗性+10%；研究速度+2.5%。"
