 oe_roman_works.10.t: "医学院开门"
 oe_roman_works.10.d: "新院舍的病床已铺好，讲席旁摆满整理过的医书。第一批学生跟随医者巡视病房，从辨认病症和照料病患开始自己的学业。"
 oe_roman_works.10.a: "愿学问最终落在救治之上。"
