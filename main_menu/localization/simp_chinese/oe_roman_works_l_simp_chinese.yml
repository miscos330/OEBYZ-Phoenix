 oe_roman_works.3.t: "海上的第二颗星"
 oe_roman_works.3.d: "暮色中，塔顶的火光第一次越过港口的水面。归航的船只依次转向航道，水手们从甲板上向那束久违的光欢呼。"
 oe_roman_works.3.a: "今夜起，水手们将记住这束光。"
