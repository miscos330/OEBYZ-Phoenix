 # NEW 2026-11-21 v7.1 yuan-phase3 (oe_ymar_ Quanzhou Ispah & Maritime). Generated by gen_yuan_maritime.py; edit the generator, not this file.
 oe_ymar_kor_joint_patrol: "联军防倭"
 oe_ymar_kor_left_alone: "坐视倭患"
 STATIC_MODIFIER_NAME_oe_ymar_coastal_patrol: "东南水寨巡防"
 STATIC_MODIFIER_DESC_oe_ymar_coastal_patrol: "朝廷在鄞县、福州增设水寨游弋防倭，海盗稍戢而水师轻舟养军费用大增。"
 STATIC_MODIFIER_NAME_oe_ymar_indian_ocean_ties: "刺桐印度洋商网"
 STATIC_MODIFIER_DESC_oe_ymar_indian_ocean_ties: "泉州蕃商旧网重归市舶司统辖，西洋海贸复盛，然海口豪商坐大而中枢控驭稍缓。"
 STATIC_MODIFIER_NAME_oe_ymar_sea_ban_mod: "大元海禁"
 STATIC_MODIFIER_DESC_oe_ymar_sea_ban_mod: "朝廷严申片板不许下海之令，沿海倭患与走私大减、内治渐固，然海贸与远洋航程剧缩。"
 STATIC_MODIFIER_NAME_oe_ymar_shibosi_mod: "市舶司重兴"
 STATIC_MODIFIER_DESC_oe_ymar_shibosi_mod: "泉州、庆元、福州三市舶司重开抽分，商税与远洋航程大涨，然水师维护昂贵且海盗觊觎繁盛航道。"
 STATIC_MODIFIER_NAME_oe_ymar_east_sea_patrol: "东海水师巡检司"
 STATIC_MODIFIER_DESC_oe_ymar_east_sea_patrol: "大元与高丽共设东海巡检，重船护航商道、肃清早期倭寇，然大舰常年养费甚巨。"
 STATIC_MODIFIER_NAME_oe_ymar_yuan_fleet: "西洋大舶先声"
 STATIC_MODIFIER_DESC_oe_ymar_yuan_fleet: "大元承袭忽必烈通海旧志，敕造西洋大舶巡航南洋与印度洋，声威远播而大舰岁费沉重。"
 STATIC_MODIFIER_NAME_oe_ymar_steady_customs: "守成市舶旧规"
 STATIC_MODIFIER_DESC_oe_ymar_steady_customs: "朝廷维持三港市舶抽分而不轻启远洋大役，海贸稳步生财而沿海仍有零星盗警。"
 STATIC_MODIFIER_NAME_oe_ymar_codified_ban: "海禁成法"
 STATIC_MODIFIER_DESC_oe_ymar_codified_ban: "海禁著为祖宗成法，朝廷专力中原田赋与内河控驭，沿海少盗而海外贸易长久萎缩。"
 STATIC_MODIFIER_NAME_oe_ymar_wokou_raids: "早期倭寇袭扰"
 STATIC_MODIFIER_DESC_oe_ymar_wokou_raids: "九州浪人与海商乘乱焚掠沿海港镇，商舶受惊，地方繁荣与海上存在受损。"
 STATIC_MODIFIER_NAME_oe_ymar_ispah_rule: "亦思巴奚割据刺桐"
 STATIC_MODIFIER_DESC_oe_ymar_ispah_rule: "波斯色目驻军据守晋江刺桐港，番舶仍通而朝廷政令不行，民情惶恐。"
 STATIC_MODIFIER_NAME_oe_ymar_fujian_war: "闽海兵燹"
 STATIC_MODIFIER_DESC_oe_ymar_fujian_war: "行省官军与亦思巴奚军拉锯于泉福漳之间，市井萧条，商船避港而去。"
 STATIC_MODIFIER_NAME_oe_ymar_militia_levy: "闽省乡勇勤王"
 STATIC_MODIFIER_DESC_oe_ymar_militia_levy: "地方大姓应陈友定号召招募乡勇讨逆，兵源大增而农商生产受损。"
 STATIC_MODIFIER_NAME_oe_ymar_zaytun_devastated: "刺桐凋敝"
 STATIC_MODIFIER_DESC_oe_ymar_zaytun_devastated: "亦思巴奚之乱平定后番坊残破、外商星散，昔日世界第一大港十载难复旧观。"
 STATIC_MODIFIER_NAME_oe_ymar_zaytun_network: "刺桐蕃商复市"
 STATIC_MODIFIER_DESC_oe_ymar_zaytun_network: "守法蕃商获准复业，泉州维系印度洋商路枢纽，然汉蕃杂处仍存摩擦。"
 STATIC_MODIFIER_NAME_oe_ymar_port_restrictions: "庆元闭关防倭"
 STATIC_MODIFIER_DESC_oe_ymar_port_restrictions: "庆元港严查海船、限制互市，倭寇难借商舶潜入，然港市商力随之减退。"
 STATIC_MODIFIER_NAME_oe_ymar_tally_trade: "庆元勘合互市"
 STATIC_MODIFIER_DESC_oe_ymar_tally_trade: "日僧与九州商船持勘合赴庆元交易铜磺刀剑，商力大振而走私与口岸骚乱难绝。"
 STATIC_MODIFIER_NAME_oe_ymar_shibosi_port: "市舶大港"
 STATIC_MODIFIER_DESC_oe_ymar_shibosi_port: "市舶司重兴带动万国商舶云集，港市繁荣而流民与私商杂沓难管。"
 STATIC_MODIFIER_NAME_oe_ymar_coastal_clearance: "严禁缉私"
 STATIC_MODIFIER_DESC_oe_ymar_coastal_clearance: "官兵严查海滨渔盐与私船，海盗与走私受抑、控制力上升，然滨海生计凋零。"
 STATIC_MODIFIER_NAME_oe_ymar_armed_merchants: "市舶武装商船"
 STATIC_MODIFIER_DESC_oe_ymar_armed_merchants: "市舶司准许大商自备兵械护航，航道得保而地方大商尾大不掉。"
 OE_YMAR_ISP_5: "蕃商归附"
 OE_YMAR_ISP_4: "平乱凋敝"
 OE_YMAR_ISP_3: "那兀纳专泉"
 OE_YMAR_ISP_2: "行省围剿"
 OE_YMAR_ISP_1: "招抚割据"
 OE_YMAR_ISP_0: "无事"
 OE_YMAR_POL_2: "市舶司重兴"
 OE_YMAR_POL_1: "严行海禁"
 OE_YMAR_POL_0: "旧制未定"
 oe_ymar.1.t: "倭寇初犯东南海疆"
 oe_ymar.1.desc_x: "#F 至正十年（1350年）起，日本南北朝内乱愈烈，九州豪族与浪人结船出海，连年侵扰高丽沿岸，渐及大元庆元（鄞县）与福州海疆，海运漕粮与沿海市舶同受其警。#!\n\n如今，鄞县与福州水师报称倭船频现外洋，高丽使臣亦入京告急。中书省请示：是拨帑筑寨、联高丽巡海，还是责成江浙与高丽自筹防御？"
 oe_ymar.1.a: "拨帑修筑鄞县、福州水寨，联高丽会剿"
 oe_ymar.1.a.tt: "我国获得[ShowModifier('oe_ymar_coastal_patrol')]（#Y 60#!个月：海盗滋生降而轻舟维护费增）；高丽对我国好感#G +15#!。"
 oe_ymar.1.b: "责成江浙行省与高丽自募乡兵防御"
 oe_ymar.1.b.tt: "鄞县与福州遭[ShowModifier('oe_ymar_wokou_raids')]（#Y 60#!个月）；高丽对我国好感#R −10#!；若海运线运行则京师漕粮#R −15#!万石。"
 oe_ymar.2.t: "刺桐兵变：亦思巴奚举兵"
 oe_ymar.2.desc_x: "#F 至正十七年三月（1357年），泉州（刺桐港）波斯驻军将领赛甫丁、阿迷里丁率“亦思巴奚”色目武装据晋江起事，北攻兴化、屡逼福州与龙溪，闽海大震。#!\n\n如今，刺桐港海道与市舶抽分落入亦思巴奚驻军之手，福建行省告急文书雪片般飞入大都。朝廷是姑且招抚授官以保海贸，还是严令行省发兵围剿？"
 oe_ymar.2.a: "权且招抚授官，以稳闽南税道"
 oe_ymar.2.a.tt: "晋江（泉州）获得[ShowModifier('oe_ymar_ispah_rule')]（#Y 60#!个月：外贸犹存而控制力大降、动荡上升）；江浙行省忠诚#R −5#!。"
 oe_ymar.2.b: "严令福建行省调兵围剿亦思巴奚"
 oe_ymar.2.b.tt: "晋江与福州遭[ShowModifier('oe_ymar_fujian_war')]（#Y 60#!个月）；抽调兵力令北方平乱之势#R −3#!。"
 oe_ymar.3.t: "那兀纳专泉与蕃坊内讧"
 oe_ymar.3.desc_x: "#F 至正二十二年（1362年），泉州市舶官僚那兀纳趁乱袭杀赛甫丁、阿迷里丁并独专泉州，色目教派与闽南汉民在晋江、福州、龙溪之间连年厮杀，刺桐繁华摇摇欲坠。#!\n\n如今，那兀纳据泉自重、四出劫掠。福建平章陈友定请率闽中乡勇南下清剿；另有泉州蕃商大老密遣使者入京，愿以保商换取内应倒戈。"
 oe_ymar.3.a: "命福建平章陈友定统率乡勇南下讨逆"
 oe_ymar.3.a.tt: "福州与龙溪（漳州）获得[ShowModifier('oe_ymar_militia_levy')]（#Y 48#!个月：征兵增而繁荣降）；为彻底剿平亦思巴奚铺路。"
 oe_ymar.3.b: "密晤刺桐胡商大老，许以保商换取倒戈"
 oe_ymar.3.b.tt: "花费#R 4#!个月收入换取蕃坊大老倒戈，避免闽南乡勇血洗刺桐，为日后收编印度洋商网留有余地。"
 oe_ymar.4.t: "陈友定克复泉州与刺桐抉择"
 oe_ymar.4.desc_merc: "#F 至正二十六年（1366年），忠元汉将陈友定率师克复泉州，斩杀那兀纳，历经十载的亦思巴奚兵乱遂告终结。战后如何处置刺桐蕃坊与色目商网，关乎大元海上财源兴衰。#!\n\n如今，在刺桐商界大老内应下，那兀纳伏诛、泉州复归朝廷。陈友定部将仍主严惩色目武装，蕃商则叩请朝廷兑现保商之诺、重开印度洋航道。"
 oe_ymar.4.desc_chen: "#F 至正二十六年（1366年），忠元汉将陈友定率师克复泉州，斩杀那兀纳，历经十载的亦思巴奚兵乱遂告终结。战后如何处置刺桐蕃坊与色目商网，关乎大元海上财源兴衰。#!\n\n如今，陈友定捷报抵京，泉州城头重树大元旌旗。闽省士绅力请尽剿亦思巴奚余党、以绝后患；市舶旧吏则谏言宽宥守法蕃商，以保刺桐印度洋商网。"
 oe_ymar.4.a: "嘉奖陈友定，尽剿亦思巴奚残部并严肃法纪"
 oe_ymar.4.a.tt: "清除闽海兵燹与割据修正，平乱之势#G +5#!；但外商大逃亡，晋江遭[ShowModifier('oe_ymar_zaytun_devastated')]（#Y 120#!个月）。"
 oe_ymar.4.b: "宽宥守法蕃商，收编刺桐印度洋商网"
 oe_ymar.4.b.tt: "晋江获[ShowModifier('oe_ymar_zaytun_network')]，我国获[ShowModifier('oe_ymar_indian_ocean_ties')]（均#Y 120#!个月：海贸大增而中枢控制与地方安宁承压）；江浙行省忠诚#R −5#!。"
 oe_ymar.5.t: "日本南北朝使僧与倭患"
 oe_ymar.5.desc_x: "#F 日本南北朝分立期间，九州征西府与室町幕府各遣禅僧商船渡海抵庆元（鄞县），一方面输卖硫磺、铜钱与刀剑，另一方面海盗浪人亦混迹商舶，真倭假商难辨。#!\n\n如今，又有日本使僧携表与商货停泊鄞县外港，请开市舶互市。市舶司请示：是责令日方先缉倭寇方准通商，还是发给勘合准其互市以弭海患？"
 oe_ymar.5.a: "责令日方缉捕倭寇，否则闭关停市"
 oe_ymar.5.a.tt: "鄞县获得[ShowModifier('oe_ymar_port_restrictions')]（#Y 60#!个月：海盗滋生降而商力受损），并压低倭患等级。"
 oe_ymar.5.b: "准于庆元市舶司勘合互市，以商弭寇"
 oe_ymar.5.b.tt: "鄞县获得[ShowModifier('oe_ymar_tally_trade')]（#Y 60#!个月：商力大涨，但口岸动荡与海盗滋生略增）。"
 oe_ymar.6.t: "海禁与市舶大辩论"
 oe_ymar.6.desc_x: "#F 元初世祖忽必烈承宋旧制而扩充市舶司，使泉州、庆元、福州成为贯通南洋与印度洋的大港；然元末倭患与亦思巴奚兵乱令朝中保守派力主海禁，以安内防寇为先。#!\n\n如今，大元历经乱局而犹守东南海疆，中书省就海疆国策展开大辩论：是严行海禁以绝倭患私商，还是重兴市舶司、续写通海旧业？"
 oe_ymar.6.a: "严行海禁：片板不许下海，固守海防"
 oe_ymar.6.a.tt: "国策转为#bold #color_yellow 海禁#!#!：获得[ShowModifier('oe_ymar_sea_ban_mod')]（#Y 180#!个月：海盗大降、控制力增，但海贸效率、贸易收入与海军航程剧减），清除沿海倭寇袭扰并关闭刺桐蕃商网。"
 oe_ymar.6.b: "重兴市舶司：复立三司，承世祖通海旧制"
 oe_ymar.6.b.tt: "国策转为#bold #color_yellow 市舶司重兴#!#!：获得[ShowModifier('oe_ymar_shibosi_mod')]（#Y 180#!个月：海贸、贸易收入与海军航程大增，但轻舟维护费增且招致海盗与走私压力）；晋江与鄞县获[ShowModifier('oe_ymar_shibosi_port')]。"
 oe_ymar.7.t: "海疆余波：走私暗潮与东海巡检"
 oe_ymar.7.desc_ban: "#F 海疆国策既定，新政利弊随之显现：严禁则滨海渔商失计而暗通私舶，重开市舶则帆樯蔽海而东海倭寇乘隙觊觎。#!\n\n如今，海禁推行数载，泉州与龙溪滨海生计困顿，豪强暗结走私海舶与倭寇互市。朝廷是严刑缉私清查海滨，还是酌开庆元勘合以舒民困？"
 oe_ymar.7.desc_open: "#F 海疆国策既定，新政利弊随之显现：严禁则滨海渔商失计而暗通私舶，重开市舶则帆樯蔽海而东海倭寇乘隙觊觎。#!\n\n如今，市舶司重兴以来税入渐丰，然东海航道商舶如织，倭寇与海盗频频伺机截掠。朝廷是斥资兴建东海水师巡检司（可联高丽共巡），还是准市舶大商自募武装商船护航？"
 oe_ymar.7.a: "严刑缉私，清查泉漳海滨"
 oe_ymar.7.a.tt: "晋江与龙溪获得[ShowModifier('oe_ymar_coastal_clearance')]（#Y 60#!个月：抑盗增控而繁荣受损）。"
 oe_ymar.7.b: "默许朝贡勘合，酌留庆元一线通商"
 oe_ymar.7.b.tt: "缓和海禁引发的商民怨望，维持基本勘合往来。"
 oe_ymar.7.c: "兴建东海水师巡检司，联高丽肃清海道"
 oe_ymar.7.c.tt: "肃清早期倭寇并清除沿海袭扰；获得[ShowModifier('oe_ymar_east_sea_patrol')]（#Y 120#!个月：贸易保护大增而重舰维护费增）；高丽对我国好感#G +15#!。"
 oe_ymar.7.d: "命市舶司自募武装商船护航"
 oe_ymar.7.d.tt: "晋江与鄞县获得[ShowModifier('oe_ymar_armed_merchants')]（#Y 120#!个月：贸易保护提升而地方控制上限下降）。"
 oe_ymar.8.t: "沧海定局：宝船先声与海疆新纪"
 oe_ymar.8.desc_open: "#F 历经元末乱局与海疆辩论，大元东南沿海秩序终归定型：或以西洋大舶续写忽必烈时代跨越印度洋的远航之志，或以海禁成法专力陆疆与中原内治。#!\n\n如今，泉州、庆元市舶殷实，造船坊呈上西洋大舶图样，请命遣使巡航南洋与印度洋，以振大元海上声威（需巨额造船与养舰之费）；亦有朝臣主张守成三港市舶，不启远役。"
 oe_ymar.8.desc_ban: "#F 历经元末乱局与海疆辩论，大元东南沿海秩序终归定型：或以西洋大舶续写忽必烈时代跨越印度洋的远航之志，或以海禁成法专力陆疆与中原内治。#!\n\n如今，海禁行之有年，沿海倭患已息而中原内治稳固。朝廷是著海禁为祖宗成法、永固陆疆，还是趁承平酌废海禁、重开刺桐市舶？"
 oe_ymar.8.a: "敕造西洋大舶，遣使巡航南洋与印度洋"
 oe_ymar.8.a.tt: "开启宝船先声（标记供丝路双凤后续联动）；获得常驻修正[ShowModifier('oe_ymar_yuan_fleet')]（元亡前有效：航程、海贸与外交威望大增，重舰维护费#R +20%#!）。本线完结。"
 oe_ymar.8.b: "守成市舶旧规，止步南洋诸港"
 oe_ymar.8.b.tt: "获得常驻修正[ShowModifier('oe_ymar_steady_customs')]（元亡前有效：稳健贸易收入与轻微海盗风险）。本线完结。"
 oe_ymar.8.c: "著海禁为祖宗成法，专力陆疆与漕运"
 oe_ymar.8.c.tt: "获得常驻修正[ShowModifier('oe_ymar_codified_ban')]（元亡前有效：控制力、税效与抑盗提升，海贸效率长久降低）。本线完结。"
 oe_ymar.8.d: "趁承平酌废海禁，复开刺桐市舶"
 oe_ymar.8.d.tt: "国策转为#bold #color_yellow 市舶司重兴#!#!：撤除海禁并获[ShowModifier('oe_ymar_shibosi_mod')]，晋江复立市舶大港。本线完结。"
 oe_ymar.20.t: "刺桐海疆与市舶：选项生效"
 oe_ymar.90.t: "【测试】刺桐海疆与市舶（ymar）：读数"
