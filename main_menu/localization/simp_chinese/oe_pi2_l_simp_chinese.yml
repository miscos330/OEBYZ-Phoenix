 oe_pi2_qizilbash_lancers:0 "波斯奇兹尔巴什重装枪骑兵"
 oe_pi2_qizilbash_lancers_desc:0 "伊朗高原头缠十二褶红巾的精锐重装枪骑兵，兼具复合弓袭射与铁甲战马冲锋，在高原旱原之上所向披靡。"
 oe_pi2_caucasus_khevsur_guard:0 "高加索赫夫苏尔山地重装卫队"
 oe_pi2_caucasus_khevsur_guard_desc:0 "身披精锻锁子甲、手持阔剑与铁圆盾的格鲁吉亚及亚美尼亚山地重步兵，扼守险峻隘口与悬崖修道院堡垒寸步不退。"
 oe_pi2_deccan_rocket_elephants:0 "德干—迈索尔火箭战象炮队"
 oe_pi2_deccan_rocket_elephants_desc:0 "披甲印度战象与铁壳火药火箭炮列协同作战的重火力军团，以震天火雨与巨象冲击撕裂敌阵并轰毁坚城。"
 oe_pi2_maratha_bargir_raiders:0 "马拉塔巴吉尔疾风轻骑"
 oe_pi2_maratha_bargir_raiders_desc:0 "由王库配给德干良驹的马拉塔精锐轻骑，精于闪电迂回、奇袭敌军粮道与西高止山丘陵游击奔袭。"
 oe_pi2_dec_isfahan_silk_monopoly.title:0 "设立伊斯法罕王家丝绸专卖司"
 oe_pi2_dec_isfahan_silk_monopoly.desc:0 "将吉兰与马赞德兰的里海生丝统归王家货栈专购专运，遣特许商队经安纳托利亚、波斯湾与黎凡特远销欧亚，使波斯丝绸化为稳固国库命脉。"
 oe_pi2_dec_isfahan_silk_monopoly.a:0 "颁行王家丝绸专卖敕令"
 oe_pi2_dec_caucasus_fortress_monastery.title:0 "缔结高加索堡垒修道院同盟"
 oe_pi2_dec_caucasus_fortress_monastery.desc:0 "将高山石砌瞭望塔、悬崖修道院与山地贵族领主纳入共同防务盟约，使高加索每一处峡谷隘口皆化作粮械充备的铁壁要塞。"
 oe_pi2_dec_caucasus_fortress_monastery.a:0 "祝圣高山要塞与修道院防线"
 oe_pi2_dec_monsoon_guild_charter.title:0 "颁授印度洋季风商帮特许宪章"
 oe_pi2_dec_monsoon_guild_charter.desc:0 "向古吉拉特、康坎、科罗曼德尔与孟加拉沿岸的造船匠帮、洪迪票号与远洋商团颁授特许宪章，配以官军水师护航并统一海港度量衡。"
 oe_pi2_dec_monsoon_guild_charter.a:0 "特许季风远洋商帮与护航水师"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev1_a:0 "札剌亦儿皇家书画院"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev1_a:0 "金碧辉煌的细密画手抄本与典雅波斯诗篇令本朝稳居伊尔汗国正统文化继承者之位。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev1_b:0 "双都度支官署整饬"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev1_b:0 "重编田土册籍与严密守卫的商队驿站将两河农产与阿塞拜疆大巴扎紧密相联。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev2_a:0 "设拉子玫瑰园文教盛世"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev2_a:0 "名扬四海的设拉子学院与诗社吸引各地法学家、诗人与使节纷至沓来，声望斐然。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev2_b:0 "亚兹德丝坊与法尔斯坚城"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev2_b:0 "兴盛的锦缎工坊与法尔斯石筑要塞为南方军政提供充沛财力与稳固后盾。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev3_a:0 "土库曼联盟精骑归附"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev3_a:0 "久经沙场的土库曼枪骑与弓骑源源充实主力军团，赋予我军迅猛突袭与决战冲击力。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev3_b:0 "波斯文官体制正统"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev3_b:0 "训练有素的波斯文书官僚守住城市繁荣、稳定商税并维持各省政令统一。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev4_a:0 "伊朗高原坎儿井水利网"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev4_a:0 "经由地下暗渠引入荒原的高山融雪令沙碛化作繁茂果园与富庶市镇。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev4_b:0 "帝国商队驿馆大道"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev4_b:0 "坚固的沿途驿馆既护卫丝绸香料驼队免遭劫掠，又令王命驿使昼夜飞驰畅通无阻。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev5_a:0 "阿达比勒红巾圣战热忱"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev5_a:0 "炽烈信仰凝聚部落铁骑，化作无坚不摧的突击先锋军团，锐不可当。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev5_b:0 "阿达比勒圣陵教化体系"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev5_b:0 "井然有序的教团网络与济贫善堂将乡村聚落与城市行会牢牢系于王权周围。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev6_a:0 "王家库尔奇近卫骑团"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev6_a:0 "直接效忠沙阿的精锐重装骑兵卫队坐镇中军，成为每场决战的定海神针。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev6_b:0 "大不里士帝国中枢文官厅"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev6_b:0 "老练的波斯文官将各省法度、铸币与王室领地整合成高效运转的帝国机器。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev7_a:0 "后查尔迪兰火药军制革新"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev7_a:0 "王家铸炮厂日夜赶制青铜长炮与火绳枪，将波斯骑术与近代齐射火力融为一体。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev7_b:0 "扎格罗斯坚壁清野战略"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev7_b:0 "清空边境粮草并遣轻骑沿山口袭扰敌军补给线，令沉重的火药远征军未待入冬便不战自溃。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev8_a:0 "皇家《列王纪》书画盛业"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev8_a:0 "无与伦比的宫廷艺术风雅远播莫卧儿印度、安纳托利亚与中亚诸邦，文化感召力空前。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev8_b:0 "加兹温内外双边要塞链"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev8_b:0 "星罗棋布的石堡与满盈军械库使帝国从容应对东西双线战事。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev9_a:0 "古拉姆与托凡奇王家常备军"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev9_a:0 "由国库支薪并统一装备精良火器与野炮的王家常备军令帝国陆军战力跃居欧亚前列。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev9_b:0 "王室直辖哈萨财赋体系"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev9_b:0 "由王廷直接征收丝绸与富庶农区赋税，大幅充盈国库并削弱封建割据。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev10_a:0 "伊斯法罕天下之半盛景"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev10_a:0 "冠绝当世的琉璃建筑、拱廊广场与御苑令伊斯法罕跻身世界顶级文明都城之列。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev10_b:0 "凯萨里耶大巴扎商贸总汇"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev10_b:0 "纵横交错的拱顶大市汇聚欧洲、奥斯曼、俄国与印度巨商，令帝都化作欧亚商汇总枢。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev11_a:0 "皇家卡汗内官营织造体系"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev11_a:0 "官办工坊统一天然染材与织造规制，使波斯锦缎与挂毯畅销欧亚、溢价倍增。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev11_b:0 "新朱尔法跨洲丝绸商网"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev11_b:0 "四通八达的跨国代理商号令伊斯法罕直连伏尔加河、地中海与印度洋各大商港。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev12_a:0 "霍尔木兹海峡海权光复"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev12_a:0 "驱逐外洋要塞之后，波斯海关与巡海舰船牢牢掌控整条波斯湾黄金航道。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev12_b:0 "波斯湾北岸自由商港宪章"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev12_b:0 "广邀印度、阿拉伯与西洋商船平等互市竞价，令北岸关市白银如潮涌入。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev13_a:0 "伊斯法罕哲理与学术昌明"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev13_a:0 "深邃哲思、天文历表与跨文明译著令波斯学术生生不息、泽被后世。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev13_b:0 "欧亚波斯盛世使节团"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev13_b:0 "携锦缎重礼与国书的精干使节纵横欧亚，为帝国广结外援、制衡强邻。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev14_a:0 "纳迪尔骆驼旋炮与重火枪雄师"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev14_a:0 "高机动回旋火炮与远程精准排枪自两河至印度河横扫一切旧式军阵。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev14_b:0 "里海—波斯湾双海海军督府"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev14_b:0 "采北方林木大造深水战舰，使波斯海军同时威慑里海与阿拉伯海航道。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev15_a:0 "高加索山地法典威信"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev15_a:0 "刚柔并济的山地律例令剽悍山民倾心效忠王权，既安内治又不损尚武之风。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev15_b:0 "高加索足色银币复兴"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev15_b:0 "成色精纯的银币重振特拉布宗、第比利斯、阿尼至里海沿岸的商旅往来。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev16_a:0 "赫夫苏尔山地卫队与石塔"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev16_a:0 "沉着勇毅的山地重步兵与环环相扣的石砌战塔令任何翻山来犯之敌寸步难行。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev16_b:0 "山地铁坊与陶罐葡萄酒业"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev16_b:0 "山地精铁冶炼与享誉千年的陶罐酿酒业铸就富足自给的高原重镇。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev17_a:0 "不屈高加索铁血抗战"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev17_a:0 "险峡伏击与死守坚城虽历血火，却保住了民族气节并锻造出百战山地精兵。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev17_b:0 "高加索保全社稷之策"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev17_b:0 "以沉着斡旋换取宝贵喘息，使果园、古抄本与城邦工匠免于玉石俱焚。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev18_a:0 "里海生丝与石脑油大港"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev18_a:0 "成捆上等生丝与石脑油商船往来里海，令自巴库至伏尔加河口关税滚滚而来。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev18_b:0 "杰尔宾特铁门海陆双防"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev18_b:0 "自山脊直抵浪涛的修缮石墙彻底锁死北方草原走廊，令游骑难越雷池。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev19_a:0 "山地梅利克要塞防卫同盟"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev19_a:0 "阿尔察赫与休尼克相连的险谷堡垒铸就高原腹地不可攻克的战略核心。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev19_b:0 "奇里乞亚—高原工艺融合"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev19_b:0 "地中海金工、染织与商汇技艺在高加索城邦行会焕发全新光彩。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev20_a:0 "萨德罗肖常备军区体系"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev20_a:0 "迅捷的分区动员将山地重步兵与新式火绳枪手无缝结合，战备效率倍增。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev20_b:0 "圣旗边防教区同心"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev20_b:0 "修院庄园供养边塞粮仓与伤兵院，令全境军民士气高昂、团结如铁。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev21_a:0 "高加索全境主权联防"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev21_a:0 "险关互通、火药共储与誓死守土的山地联军将帝国瓜分图谋彻底击碎。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev21_b:0 "高加索纵横平衡外交"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev21_b:0 "机敏使节自黑海至伏尔加河巧织反制盟网，令东西巨邻彼此投鼠忌器。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev22_a:0 "朱尔法欧亚商汇总号"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev22_a:0 "异地汇票、海运保单与生丝货栈令欧亚白银资本源源汇入高加索名城。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev22_b:0 "海外商帮印书兴学基金"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev22_b:0 "引入格鲁吉亚与亚美尼亚活字印模，使地图、史书与格致科学遍传群山城邑。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev23_a:0 "《政务法典》礼法新章"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev23_a:0 "条理严明的王家法典令各山地公国的赋税、铸币与司法步入近代正轨。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev23_b:0 "高加索圣艺典籍盛世"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev23_b:0 "高加索复调合唱、泥金福音书与雕版史典令山国文化荣光远耀四方。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev24_a:0 "双海近代山地要塞炮防"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev24_a:0 "新式山地炮台与棱堡防线牢牢锁住黑海东岸与里海铁门。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev24_b:0 "黑海—里海跨海转运大走廊"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev24_b:0 "横贯双海的陆路转运通道吸引黎凡特、俄国与波斯商货源源缴税通行。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev25_a:0 "亨比石坝水利灌溉网"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev25_a:0 "四季不绝的引河渠网令南印农田无惧季风旱涝，城邑粮仓常年丰盈。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev25_b:0 "神庙圣城百工宝石市集"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev25_b:0 "依托神庙兴起的百工坊市汇聚织布匠、青铜雕师与宝石巨商，税收日增。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev26_a:0 "阿拉伯良驹精锐骑军"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev26_a:0 "源源抵港的阿拉伯与波斯名马令本邦骑兵如虎添翼，平原突击锐不可当。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev26_b:0 "那耶卡军政封邑制度"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev26_b:0 "各省领兵大将按额供养步卒、战象与城防，并按期上缴稳固军赋。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev27_a:0 "索纳尔冈轻纱细布行会"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev27_a:0 "畅销中华、波斯与地中海的孟加拉细纱与生丝令滚滚白银汇入三角洲银库。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev27_b:0 "孟加拉纳瓦拉江海战船队"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev27_b:0 "装备轻炮的江海战舟纵横三角洲水网，既清剿海盗又威慑孟加拉湾海疆。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev28_a:0 "坎贝—苏拉特大商帮票汇"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev28_a:0 "信誉昭著的商业信用与海事商庭令西印良港成为万国商船趋之若鹜的财富磁石。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev28_b:0 "古吉拉特柚木远洋船坞"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev28_b:0 "耐蚀坚韧的印度柚木造就驰骋印度洋的重型商战大船，航程远超西洋橡木船。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev29_a:0 "比德尔大书院学术盛况"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev29_a:0 "汇聚印度洋沿岸的天文学家、名医与建筑巨匠令德干高原跃升为学术重镇。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev29_b:0 "加万行省均衡改制"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev29_b:0 "行省轮任与度支稽核有效遏制党争倾轧，令高原中枢政令畅达。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev30_a:0 "戈尔康达钻矿与神钢专卖"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev30_a:0 "官督宝石竞拍与坩埚钢锭外销令东德干富甲天下、国库充盈。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev30_b:0 "乌兹神钢王家兵仗局"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev30_b:0 "高碳坩埚钢锻造出削铁如泥的战刃、坚韧甲胄与耐炸精良枪管，全军锐气大盛。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev31_a:0 "德干火箭战象重炮军制"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev31_a:0 "呼啸裂空的铁壳火箭与重型青铜巨炮交相轰击，既惊溃敌骑又崩塌坚城。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev31_b:0 "德干石堡重炮防务体系"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev31_b:0 "玄武岩山巅的圆形炮台令每一座高原重镇皆化作难以逾越的火力要塞。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev32_a:0 "胜利之城文教盛世"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev32_a:0 "多语诗史、卡纳提克雅乐与宏伟神庙建筑共同铸就南印度千古盛世。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev32_b:0 "《花环政论》强军经贸之策"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev32_b:0 "整肃野战雄师并巧签沿海商约，令战马、火器与海港关税尽入掌中。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev33_a:0 "印度斯坦火药诸兵合击阵"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev33_a:0 "锁链野战炮阵死死压制敌军中路，两翼轻重骑兵迅猛合围歼敌，战无不胜。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev33_b:0 "曼萨卜达尔军政品级制"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev33_b:0 "以明晰薪俸品级将拉杰普特、阿富汗、德干与突厥名将统合于同一帝国军政体系。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev34_a:0 "次大陆大干道御驿体系"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev34_a:0 "飞马急递、官护商驿与疾行王师将孟加拉、印度斯坦与旁遮普铸为一体。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev34_b:0 "帝国足色白银卢比本位"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev34_b:0 "成色如一的白银卢比消除各省换汇损耗，令全境商货流转与税入激增。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev35_a:0 "托达尔·马尔扎布蒂税制"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev35_a:0 "按地力分等折银定税极大遏制吏治中饱，既倍增国库实收又激励开垦扩产。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev35_b:0 "扎明达尔乡绅协治税约"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev35_b:0 "与乡绅地主共议册籍维系乡里和睦，令军粮征调与农田水利顺畅推行。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev36_a:0 "万教协和与印波文融"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev36_a:0 "宏阔包容的宗教怀柔与交融雅艺令次大陆各族精英倾心效力社稷。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev36_b:0 "印波白玉镶宝宫苑盛景"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev36_b:0 "石雕巨匠以青金石、玛瑙与翡翠镶嵌白玉穹顶，令四海使节望之生敬。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev37_a:0 "次大陆卡利科印花棉布工潮"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev37_a:0 "冠绝全球的手工纺织产能使次大陆稳居世界工场之巅，银币源源不断涌入。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev37_b:0 "印度洋白银回流官铸局"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev37_b:0 "将外洋银锭悉数重铸为本朝银币，大幅夯实国库储备并稳固金融信用。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev38_a:0 "萨亚德里山堡与疾风奇袭战法"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev38_a:0 "险峻山堡与闪电骑兵游击相辅相成，令庞大入侵军团疲于奔命、不战自溃。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev38_b:0 "阿什塔·普拉丹八大臣中枢"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev38_b:0 "支薪专职的八大臣内阁将度支、司法、外交与军令尽收中枢，破除世袭包税积弊。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev39_a:0 "康坎海岛要塞与古拉布水师"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev39_a:0 "灵动凶猛的近海炮舰与坚不可摧的礁岛要塞宣示阿拉伯海沿岸不可侵犯的海权。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev39_b:0 "阿拉伯海本邦海权通行税制"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev39_b:0 "强制过往外洋商船遵守本邦海事执照并缴纳护航关税，化列强角逐为厚利。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev40_a:0 "迈索尔—德干铁管火箭军团"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev40_a:0 "漫天呼啸的铁壳火箭齐射轰散线列方阵、惊溃敌骑并引爆敌军弹药车。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev40_b:0 "南亚近代火药与铸炮工业"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev40_b:0 "水力精制硝磺磨坊与近代钻膛铸炮厂确保大军在持久近代战争中弹药充沛自给。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev41_a:0 "海港主权反公司垄断律"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev41_a:0 "重兵巡查并收回被滥用的免税特权，护佑本邦商民并严守寸土主权。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev41_b:0 "次大陆自主股份远洋商团"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev41_b:0 "汇聚本邦大票号资本并配以王师舰队护航，在远洋航线上与西洋公司正面竞雄。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev42_a:0 "次大陆近代化常备雄师"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev42_a:0 "近代线列操典融合德干火箭与疾风铁骑，铸就傲视欧亚大陆的不败王师。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_ev42_b:0 "次大陆洪迪近代金融工业"
 STATIC_MODIFIER_DESC_oe_pi2_mod_ev42_b:0 "雄厚的本土金融资本无需仰赖外债，即可驱动织造实业、深水船坞与科学学院腾飞。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_dec_isfahan_silk:0 "伊斯法罕王家丝绸专卖"
 STATIC_MODIFIER_DESC_oe_pi2_mod_dec_isfahan_silk:0 "王家生丝官栈与御用织锦工坊令里海商税与锦缎溢价源源汇入国库。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_dec_caucasus_compact:0 "高加索堡垒修道院盟约"
 STATIC_MODIFIER_DESC_oe_pi2_mod_dec_caucasus_compact:0 "设防修院、烽火石塔与山地精兵依托险峻隘口令一切来犯之敌损兵折将。"
 STATIC_MODIFIER_NAME_oe_pi2_mod_dec_monsoon_guild:0 "印度洋季风商帮宪章"
 STATIC_MODIFIER_DESC_oe_pi2_mod_dec_monsoon_guild:0 "受王室护航的本土远洋商帮与深水船坞乘冬夏两季风势执掌印度洋海贸枢纽。"
 oe_pi2.1.title:0 "札剌亦儿双都：巴格达与大不里士文脉"
 oe_pi2.1.desc:0 "随着伊尔汗国旧秩序瓦解，巴格达与大不里士双都反倒成为波斯书法家、天文学者与细密画巨匠云集的璀璨庇护所。宫廷大维齐正权衡：是将金银倾注于皇家书画工坊，还是先整顿底格里斯河至阿塞拜疆的官道税驿。"
 oe_pi2.1.a:0 "重金资助巴格达—大不里士细密画与典籍工坊"
 oe_pi2.1.b:0 "重修底格里斯—大不里士度支厅与商队官道"
 oe_pi2.2.title:0 "莫扎法尔王朝：设拉子玫瑰园文风"
 oe_pi2.2.desc:0 "在设拉子柏树庭园与亚兹德风塔之间，哈菲兹的波斯抒情诗臻于绝境，商人们织就的丝绸锦缎自开罗至德里备受追捧。文士与财赋官吏纷纷恳请宫廷颁赐特许，巩固法尔斯与伊朗南部的复兴气象。"
 oe_pi2.2.a:0 "兴办设拉子学院并广开波斯诗会"
 oe_pi2.2.b:0 "扶持亚兹德丝织行会并加固法尔斯关城"
 oe_pi2.3.title:0 "黑羊与白羊：土库曼部落联盟崛起"
 oe_pi2.3.desc:0 "在亚美尼亚、库尔德斯坦与西阿塞拜疆的夏季高山牧场上，黑羊与白羊土库曼部落联盟日益强盛。吸纳这些剽悍的游牧弓骑入阵可获雷霆机动力，却也可能牵动定居波斯文官体系的平衡。"
 oe_pi2.3.a:0 "赐予夏牧封地并收编土库曼精锐骑军"
 oe_pi2.3.b:0 "坚守波斯文官度支厅并严控部落税役"
 oe_pi2.4.title:0 "苏丹尼耶穹顶与伊朗坎儿井官道网"
 oe_pi2.4.desc:0 "在苏丹尼耶高耸的松石蓝穹顶之下，工匠与水利师呈上宏图：全面疏浚伊朗高原干旱腹地的地下坎儿井暗渠，并按一日行程间距兴建拱顶石砌商队驿馆，贯通各大巴扎。"
 oe_pi2.4.a:0 "大修高原坎儿井暗渠与绿洲粮仓"
 oe_pi2.4.b:0 "遍建王家拱顶商队驿馆与银币转运站"
 oe_pi2.5.title:0 "阿达比勒苏菲教团兴起与红巾誓师"
 oe_pi2.5.desc:0 "在毗邻里海林地的阿达比勒圣陵周围，炽热的宗教导师锻造出一支纪律严明、头戴十二褶赤红帽冠的虔诚武士团。来自阿塞拜疆、安纳托利亚与呼罗珊的数千精骑皆视阿达比勒为重铸波斯大一统帝国的火种。"
 oe_pi2.5.a:0 "高举十二褶红巾旗帜整编奇兹尔巴什先锋"
 oe_pi2.5.b:0 "将阿达比勒圣陵宗教基金纳入文治教化"
 oe_pi2.6.title:0 "大不里士红巾登基：伊朗统合新纪元"
 oe_pi2.6.desc:0 "在猎猎飞扬的赤红战旗下，传令官在大不里士宣告伊朗高原新万王之王登基，将古老的波斯王权传统与锐意进取的新朝体制熔于一炉。王家库尔奇近卫团与萨德尔教务司静候敕命。"
 oe_pi2.6.a:0 "敕编王家库尔奇近卫重骑与大军司"
 oe_pi2.6.b:0 "重用波斯大维齐并重编全国官僚文书体系"
 oe_pi2.7.title:0 "查尔迪兰之震：铁链火炮与火枪时代降临"
 oe_pi2.7.desc:0 "自西境雪片般飞来的急报令整座宫廷震动：敌军以铁链相连的炮车阵与排枪火绳齐射证明，单凭无畏的重骑冲锋已不足以击穿近代火药战阵。伊朗军事体制正站在生死攸关的十字路口。"
 oe_pi2.7.a:0 "倾力编练托凡奇火绳枪兵与图普奇野战炮军"
 oe_pi2.7.b:0 "推行西境坚壁清野与高原游击袭扰战法"
 oe_pi2.8.title:0 "加兹温新都与《列王纪》御制抄本"
 oe_pi2.8.desc:0 "为避西境突袭，宫廷内迁至加兹温，园林宫苑拔地而起，宫廷画师正以青金石与泥金绘就传世巨制《列王纪》。与此同时，边镇总督恳请沿阿塞拜疆与呼罗珊修筑永固石堡。"
 oe_pi2.8.a:0 "御制传世《列王纪》并兴建加兹温宫廷艺苑"
 oe_pi2.8.b:0 "巩固加兹温—大不里士—赫拉特边防要塞链"
 oe_pi2.9.title:0 "阿拔斯大帝新政与古拉姆王家常备军"
 oe_pi2.9.desc:0 "为彻底终结部落大贵族的掣肘，雄主推行雷霆军改：除扩充近代托凡奇火绳枪兵与青铜炮队外，更由王室直属领地供饷，编练一支直接效忠君主的格鲁吉亚、亚美尼亚与切尔克斯裔古拉姆常备精锐骑军。"
 oe_pi2.9.a:0 "编成直属王权的古拉姆骑兵与托凡奇火枪常备军"
 oe_pi2.9.b:0 "改部落封邑为王室直辖哈萨领地充实度支"
 oe_pi2.10.title:0 "伊斯法罕：天下之半（纳克什·贾汗广场）"
 oe_pi2.10.desc:0 "在扎因代河畔，一座气势恢宏的规划都城巍然耸立：宏阔的纳克什·贾汗广场四面环拱着钴蓝琉璃穹顶的皇家清真寺、阿里卡普宫观礼阁、凯萨里耶大巴扎与林荫查哈尔巴格御道。各国使节无不叹服：伊斯法罕乃天下之半。"
 oe_pi2.10.a:0 "敕建纳克什·贾汗大广场与钴蓝穹顶圣殿"
 oe_pi2.10.b:0 "大拓凯萨里耶大巴扎与全国银币铸造中心"
 oe_pi2.11.title:0 "皇家卡汗内工坊：波斯地毯与官营丝绸工场"
 oe_pi2.11.desc:0 "在伊斯法罕、卡尚与克尔曼的三十二座皇家卡汗内官坊内，织造巨匠以真丝金线编织绝世波斯地毯；新朱尔法亚美尼亚商团则将里海桑园生丝运销威尼斯、阿姆斯特丹与苏拉特，换回滚滚白银。"
 oe_pi2.11.a:0 "扩建皇家丝绸地毯官坊并统一外销品控"
 oe_pi2.11.b:0 "敕赐新朱尔法商团欧亚跨国丝贸特许权"
 oe_pi2.12.title:0 "光复霍尔木兹海峡与波斯湾海门"
 oe_pi2.12.desc:0 "百余年来，盘踞霍尔木兹盐岩孤岛的外洋炮垒对每一船波斯生丝与阿拉伯战马强征重税。如今我军沿岸兵马与协防战船蓄势待发，誓要收复海峡咽喉并营建王家直辖海贸巨港。"
 oe_pi2.12.a:0 "克复霍尔木兹并建波斯湾王家海防船坞"
 oe_pi2.12.b:0 "在海峡北岸开辟万国自由通商大港"
 oe_pi2.13.title:0 "伊斯法罕学派哲思与欧亚使节交会"
 oe_pi2.13.desc:0 "在伊斯法罕静谧典雅的琉璃经学院内，米尔·达马德与穆拉·萨德拉等哲人将古典希腊哲学与伊斯兰形而上学融会贯通，开创辉煌的伊斯法罕学派。欧洲、莫斯科与印度使节亦云集宫廷，竞相缔盟求学。"
 oe_pi2.13.a:0 "厚待伊斯法罕学派与东西典籍译馆"
 oe_pi2.13.b:0 "遣大型使团分赴欧亚诸强广结远交"
 oe_pi2.14.title:0 "纳迪尔沙阿中兴：骆驼旋炮与铁骑复兴"
 oe_pi2.14.desc:0 "历经边患动荡之后，一位绝世统帅在伊朗高原铸就亚洲最具威慑力的野战雄师：装备重型长管火枪的贾扎耶尔奇步兵、疾如雷电的呼罗珊铁骑，以及可在荒漠与险关间疾驰布阵的赞布拉克骆驼回旋炮队。"
 oe_pi2.14.a:0 "大编赞布拉克骆驼旋炮与贾扎耶尔奇重火枪团"
 oe_pi2.14.b:0 "同步营建里海与波斯湾双洋近代战舰水师"
 oe_pi2.15.title:0 "光辉者乔治五世与高加索山国中兴"
 oe_pi2.15.desc:0 "历经数代草原纳贡与诸侯割据，坚毅的王廷手腕终于令高加索沃野与桀骜山地部族重归一体。王家法学家呈上治理山区的《纪功法典》，度支官亦提议重铸足色银币以振商脉。"
 oe_pi2.15.a:0 "颁行《纪功法典》安抚山地诸部并肃整纲纪"
 oe_pi2.15.b:0 "铸行光辉银币并重开高加索商道关税"
 oe_pi2.16.title:0 "巴格拉季昂山崖堡垒与赫夫苏尔铁甲卫士"
 oe_pi2.16.desc:0 "在斯瓦涅季、赫夫苏列季与休尼克冰川幽谷之上，石砌战塔与绝壁教堂巍然并立。山地氏族愿以高山免税牧权为约，常备编练身披链甲、善守险关的赫夫苏尔山地重步兵团。"
 oe_pi2.16.a:0 "敕建赫夫苏尔山地重装卫队与烽火石塔网"
 oe_pi2.16.b:0 "兴修高山梯田、精铁冶坊与千年葡萄园"
 oe_pi2.17.title:0 "帖木儿铁蹄席卷高加索山谷"
 oe_pi2.17.desc:0 "南方平原狼烟蔽日，帖木儿铁骑直扑高加索隘口，胁迫诸邦俯首称臣并摧毁敢于抗命的城池。暮色之下，众山地领主聚议：是依托绝壁死战到底，还是以屈伸外交保全元气。"
 oe_pi2.17.a:0 "依托峡谷坚城血战抗击帖木儿铁骑"
 oe_pi2.17.b:0 "遣使周旋缓兵以保全农田、藏书与城郭"
 oe_pi2.18.title:0 "希尔万丝路良港：巴库、沙马基与杰尔宾特"
 oe_pi2.18.desc:0 "沿里海西岸，沙马基的丝绸大市、巴库长明石脑油井与杰尔宾特铁门雄关扼守着沟通阿斯特拉罕、罗斯与大不里士的商道咽喉。诸商帮联名上书，恳请扩建里海港埠。"
 oe_pi2.18.a:0 "扩建沙马基丝市与巴库里海货港"
 oe_pi2.18.b:0 "加固杰尔宾特铁门长墙并编建里海巡防船队"
 oe_pi2.19.title:0 "亚美尼亚山地梅利克领主与奇里乞亚流散工匠"
 oe_pi2.19.desc:0 "随着地中海商局变迁，来自奇里乞亚的亚美尼亚巨匠、船工与史家纷纷东归，与休尼克、哈钦及亚拉拉特高原自治不屈的山地梅利克领主会合，共谋外高加索文武中兴。"
 oe_pi2.19.a:0 "敕认山地梅利克要塞自治并整编高原义勇军"
 oe_pi2.19.b:0 "广纳奇里乞亚工匠、金银雕师与航海商贾"
 oe_pi2.20.title:0 "萨德罗肖四大军区旗与全境戒备"
 oe_pi2.20.desc:0 "环伺四邻的火药帝国步步紧逼，王廷枢密院决意将全国划为先锋、右翼、左翼与御林四大萨德罗肖常备军区旗，使每一处山谷皆能在数日之内集结精锐甲士与火绳枪队。"
 oe_pi2.20.a:0 "推行萨德罗肖四大常备军区并配发火绳枪"
 oe_pi2.20.b:0 "委任边防大主教兼领旗印凝聚军民同心"
 oe_pi2.21.title:0 "夹缝求生：破局奥斯曼—波斯瓜分密约"
 oe_pi2.21.desc:0 "密探呈来惊心急报：东西两大帝国正密谋以苏拉米山脊为界瓜分高加索。欲守社稷主权不堕，唯有缔结坚不可摧的山地联防铁盟，或以精妙连横纵横两大强邻之间。"
 oe_pi2.21.a:0 "号召全高加索诸城共缔武装自保铁盟"
 oe_pi2.21.b:0 "纵横东西宫廷并通使莫斯科与威尼斯制衡列强"
 oe_pi2.22.title:0 "新朱尔法商帮与横跨欧亚的白银汇网"
 oe_pi2.22.desc:0 "凭借家族合伙契约，活跃于朱尔法、第比利斯、伊斯法罕、威尼斯、阿姆斯特丹、阿斯特拉罕与马德拉斯的亚美尼亚及高加索大商号织就了横跨欧亚的精密商汇网。其大掌柜愿返乡设立本邦汇兑总号。"
 oe_pi2.22.a:0 "敕设本邦朱尔法白银汇兑与生丝交易所"
 oe_pi2.22.b:0 "引海外商帮巨资兴办活字印书坊与学院"
 oe_pi2.23.title:0 "高加索正教与使徒教会文教黄金时代"
 oe_pi2.23.desc:0 "从格拉季与姆茨赫塔的壁画学院到格拉佐尔与埃奇米阿津的古老抄经院，一场璀璨的文化复兴席卷群山。王家法臣编纂鸿篇巨制《政务法典》，史家、画师与复调圣咏团共谱千年不绝的文明华章。"
 oe_pi2.23.a:0 "颁行《政务法典》统一官制、税则与宫廷礼仪"
 oe_pi2.23.b:0 "振兴格拉季与埃奇米阿津学院、圣咏与雕版印书"
 oe_pi2.24.title:0 "双海雄关：贯通黑海与里海的高加索通衢"
 oe_pi2.24.desc:0 "宽阔坚实的近代山岭车马大道已翻越险隘，将巴统等黑海良港与第比利斯、埃里温及巴库里海码埠贯通一线。凭借新式山地铸铁炮台与兴盛的丝酒外贸，高加索不再是帝国缓冲带，而是傲立欧亚的双海枢纽。"
 oe_pi2.24.a:0 "在双海险隘部署近代山地铸铁炮兵要塞"
 oe_pi2.24.b:0 "开通黑海—里海国际商道自由转运关税区"
 oe_pi2.25.title:0 "毗奢耶那伽罗：亨比花岗岩圣城与通加巴德拉水渠"
 oe_pi2.25.desc:0 "在通加巴德拉河畔巨石嶙峋的花岗岩群山间，王家水利巨匠开凿宏伟石坝、高架渡槽与阶梯圣池，灌溉万顷稻田并滋养柱廊林立的繁华大市。神庙大祭司与行省长官联名奏请扩修全域水渠网。"
 oe_pi2.25.a:0 "大修通加巴德拉拦河石坝与阶梯蓄水圣池"
 oe_pi2.25.b:0 "资助神庙义仓与柱廊宝石丝棉大市"
 oe_pi2.26.title:0 "那耶卡军功封邑与阿拉伯战马海运"
 oe_pi2.26.desc:0 "在广袤的德干与卡纳蒂克平原上，精良战马与严整军团乃制胜之本。军务大臣奏请立定阿马拉—那耶卡军功封邑之制，并向霍尔木兹与亚丁马商签立专购海约，大批引入阿拉伯与波斯良驹。"
 oe_pi2.26.a:0 "与波斯湾及红海马商立约专购精锐战马"
 oe_pi2.26.b:0 "颁定那耶卡军功领地驻防与岁贡章程"
 oe_pi2.27.title:0 "索纳尔冈轻纱细布与孟加拉恒河水师"
 oe_pi2.27.desc:0 "在帕德马河与梅克纳河翡翠般的三角洲水道间，孟加拉织工纺出轻如蝉翼、整匹可穿指环的绝世细棉纱布；而在沿岸官船坞，修长迅捷的纳瓦拉桨帆战船正陆续下水，巡弋万顷河网与孟加拉湾。"
 oe_pi2.27.a:0 "扩建索纳尔冈细纱织坊并广拓海外棉丝贸易"
 oe_pi2.27.b:0 "大编孟加拉纳瓦拉三角洲战船水师"
 oe_pi2.28.title:0 "古吉拉特坎贝—苏拉特印度洋巨商行会"
 oe_pi2.28.desc:0 "往来于马六甲、基尔瓦与亚丁之间的远洋商船无不云集古吉拉特良港。在坎贝与苏拉特，声誉卓著的玛哈詹商帮议会跨三海清算票汇，柚木船坞则打造出坚固耐浪的三桅巨舶。"
 oe_pi2.28.a:0 "特许玛哈詹商帮议会与跨海洪迪票汇网"
 oe_pi2.28.b:0 "重奖柚木远洋大船坞并编建护商水师"
 oe_pi2.29.title:0 "德干古都比德尔与马哈茂德·加万学院"
 oe_pi2.29.desc:0 "在德干高原琉璃金彩辉映的宣礼塔下，一位远见卓识的大维齐兴建了三层宏伟学院，典藏数千卷波斯文、阿拉伯文与梵文名著。然而欲保朝政稳固，必须妥善调和本土德干贵族与西来文武才俊。"
 oe_pi2.29.a:0 "重资兴办比德尔大书院与多语典籍藏书楼"
 oe_pi2.29.b:0 "推行行省分权改革平衡本土与外来勋贵"
 oe_pi2.30.title:0 "戈尔康达金刚钻与德干乌兹坩埚神钢"
 oe_pi2.30.desc:0 "在克里希纳河谷，矿工不断采掘出晶莹绝世的戈尔康达金刚钻，令自伊斯法罕至巴黎的宫廷竞相求购；与此同时，泰伦加纳冶匠炼成的乌兹坩埚钢锭更是闻名天下的大马士革神刃之源。"
 oe_pi2.30.a:0 "设王室金刚钻库与乌兹神钢官营专卖"
 oe_pi2.30.b:0 "将乌兹坩埚神钢专供军械锻造刀铠与枪管"
 oe_pi2.31.title:0 "比贾布尔巨型青铜重炮与德干铁壳火箭"
 oe_pi2.31.desc:0 "在烈焰腾空的德干官营铸炮厂内，巨匠浇铸出威震南亚的巨型青铜攻城炮；火器匠师更以锻铁管装填黑火药，试制成可由骆驼与披甲战象齐射的铁壳战场火箭。"
 oe_pi2.31.a:0 "编建德干铁壳火箭与披甲战象重炮营"
 oe_pi2.31.b:0 "将巨型青铜重炮普遍布防于高原棱堡要塞"
 oe_pi2.32.title:0 "克里希纳德瓦拉亚盛世：八方诗圣与胜利之城"
 oe_pi2.32.desc:0 "各国使节无不惊叹于胜利之城宽阔大道上的盛景：红宝石与金刚钻满筐交易，雕镂繁复的高耸神庙塔门沐浴朝阳。朝堂之上，八大诗圣以泰卢固语、卡纳达语与梵语共谱华章，城外王师旌旗蔽日。"
 oe_pi2.32.a:0 "礼聘八大诗圣并广建雕刻石塔与水库"
 oe_pi2.32.b:0 "以强军威慑沿海商港并广通海外军贸"
 oe_pi2.33.title:0 "印度斯坦火药变革：车阵火炮与两翼包抄"
 oe_pi2.33.desc:0 "在尘土飞扬的北印度大平原上，一场震撼时代的战术革命正破茧而出：中亚疾风两翼包抄骑兵与绳索相连的牛车堡垒、青铜野战炮列及火绳枪步兵紧密协同。谁能率先掌握此等诸兵种合击之法，谁便将问鼎次大陆。"
 oe_pi2.33.a:0 "全面操演车阵火炮与两翼包抄诸兵种合击术"
 oe_pi2.33.b:0 "创设曼萨卜达尔品级军官制统合四方豪杰"
 oe_pi2.34.title:0 "大干道驿馆长廊与足色白银卢比新制"
 oe_pi2.34.desc:0 "一条绵延数千里、自孟加拉索纳尔冈经德里直抵拉合尔与开伯尔山口的林荫御道全线贯通，沿途里程石碑、水井、坚固驿馆与飞马驿递鳞次栉比；与此同时，帝国造币局开始统一铸行足色白银卢比。"
 oe_pi2.34.a:0 "贯通全境大干道驿馆与飞马达克邮递网"
 oe_pi2.34.b:0 "全国划一足色白银卢比币制并肃清私铸"
 oe_pi2.35.title:0 "拉贾·托达尔·马尔《扎布蒂》丈田税法"
 oe_pi2.35.desc:0 "为彻底革除包税勒索与灾年横征，度支名臣拉贾·托达尔·马尔遣丈量官携铁环竹尺清丈天下田亩，按十年收成与粮价均值制定《十年定税法》，既使国库岁入稳如磐石，亦令农夫荒年得享减免。"
 oe_pi2.35.a:0 "全国推行《十年定税法》铁环竹尺清丈田亩"
 oe_pi2.35.b:0 "与地方扎明达尔乡绅共审田册以安地方"
 oe_pi2.36.title:0 "众教明堂与印波文明大融合"
 oe_pi2.36.desc:0 "在赤红砂岩雕琢的众教明堂柱廊之下，伊斯兰法学家、印度教班智达、耆那教苦行僧、帕西拜火祭司与锡克乐师受王室礼聘畅论哲理；译馆以波斯文细密画精译《摩诃婆罗多》与《罗摩衍那》，白玉穹顶与莲花塔尖浑然天成。"
 oe_pi2.36.a:0 "宣示“万教协和”并兴办梵波典籍大译馆"
 oe_pi2.36.b:0 "敕建白玉宝石镶嵌宫苑与四分御园"
 oe_pi2.37.title:0 "印度织布狂潮：卡利科印花棉布吸纳全球白银"
 oe_pi2.37.desc:0 "自科罗曼德尔、古吉拉特至孟加拉，数十万纺纱女工、靛蓝染匠与雕版印布师织就色泽永固的印花棉布，从马尼拉、长崎至伦敦、里斯本无不趋之若鹜。满载美洲与日本银锭的巨船络绎抵港，只为换购我邦织锦棉布。"
 oe_pi2.37.a:0 "扩建沿岸印花棉布工坊与靛蓝染料园区"
 oe_pi2.37.b:0 "严控白银回流铸币关税并扩建海港造币厂"
 oe_pi2.38.title:0 "萨亚德里山堡与马拉塔自治王权（斯瓦拉杰）"
 oe_pi2.38.desc:0 "在云雾缭绕的西高止山玄武岩绝壁之上，莱加尔、普拉塔普加尔等数百座山地坚堡星罗棋布，构筑起斯瓦拉杰自治王权的钢铁脊梁。疾如疾风的巴吉尔轻骑自隐秘山口奔袭而出，断敌粮道、奇袭敌阵，转瞬又隐入崇山峻岭。"
 oe_pi2.38.a:0 "整编巴吉尔疾风轻骑并加固西高止山堡群"
 oe_pi2.38.b:0 "设立阿什塔·普拉丹八大臣政务院统理军政"
 oe_pi2.39.title:0 "康坎海防巨堡与阿拉伯海本土战舰队"
 oe_pi2.39.desc:0 "深知“谁主波涛即主印度商脉”的沿岸水师提督在康坎暗礁岛屿浇筑铅石海防巨堡，同时大造吃水浅、转向灵的古拉布与加尔巴特炮舰，依托礁石河口痛击笨重的西洋东印度公司巨舰。"
 oe_pi2.39.a:0 "大建辛杜杜尔格海岛炮堡与康坎本土战舰队"
 oe_pi2.39.b:0 "推行本邦海港通行护航制统一征收西洋商税"
 oe_pi2.40.title:0 "迈索尔—德干铁管火药火箭与重象炮阵"
 oe_pi2.40.desc:0 "迈索尔与德干军械巨匠研制出以锻铁筒配竹箭与利刃的近代火药火箭，射程逾一英里、齐射如火龙蔽空。再配以牵引重炮的披甲战象炮列，足以令西洋线列火枪方阵闻风丧胆。"
 oe_pi2.40.a:0 "成建制编练铁管火箭与战象重炮野战旅"
 oe_pi2.40.b:0 "广建官营精制火药磨坊与近代镗孔铸炮局"
 oe_pi2.41.title:0 "遏制东西洋东印度公司武装商馆扩张"
 oe_pi2.41.desc:0 "自富庶海港飞来的密报触目惊心：英法特许东印度公司正违约在商馆周围偷筑石砌棱堡，滥用免税执照倾轧本国商民，甚至在我疆土之内私募土兵武装。若不果断反制，海疆主权危在旦夕。"
 oe_pi2.41.a:0 "强拆违约外洋炮堡并严申海关主权律法"
 oe_pi2.41.b:0 "官商合办本土股份制远洋商船公司与西洋竞锋"
 oe_pi2.42.title:0 "次大陆近代觉醒：新式兵工厂与洪迪大银行"
