l_simp_chinese:
 oe_sit_v49_mercs_and_privateers: "传奇雇佣兵团与私掠海盗网络"
 oe_sit_v49_mercs_and_privateers_desc: "横跨从瓦兰吉重斧佣兵团、瑞士皇家卫队、匈牙利黑军、哥萨克塞契，到巴巴里私掠舰队与加勒比自由海盗共和国的漫长历史岁月，传奇雇佣军与武装私掠网络将刀剑与航道化为列强博弈的筹码，持续冲击着王权对常备军与公海贸易的垄断秩序。"
 oe_v49_mp_end_freebooter_age: "传奇佣兵与自由私掠黄金时代"
 oe_v49_mp_end_freebooter_age_desc: "遍布大洋的私掠执照、边疆自治军团与百战雇佣兵团已成长为左右全球格局的常设武力，开启了属于自由佣兵与私掠船长的传奇时代。"
 oe_v49_mp_end_sovereign_order: "皇家海防与国家常备军秩序确立"
 oe_v49_mp_end_sovereign_order_desc: "联合护航同盟、招安收编水师与严整的国家常备军终结了自由海盗与雇佣兵割据一方的岁月，公海商路与战场军权全面回归王室法度。"
 oe_v49_mp_end_twilight: "旧时代自由佣兵与海盗的落幕"
 oe_v49_mp_end_twilight_desc: "近代常备舰队与国家征兵制为流浪佣兵团与黄金时代私掠海盗的传奇画上了壮阔句点。"
 oe_v49_mp_map_caribbean_tt: "#Y 加勒比自由海盗共和国与西印度私掠海域#!"
 oe_v49_mp_map_barbary_tt: "#Y 巴巴里私掠舰队与北非地中海突击海岸#!"
 oe_v49_mp_map_swiss_tt: "#Y 瑞士皇家卫队与阿尔卑斯—西欧传奇佣兵圈#!"
 oe_v49_mp_map_varangian_tt: "#Y 瓦兰吉重斧海外佣兵团航路与近卫防区#!"
 oe_v49_mp_map_black_army_tt: "#Y 匈牙利黑军与喀尔巴阡常备佣兵腹地#!"
 oe_v49_mp_map_cossack_tt: "#Y 哥萨克塞契自治军团与黑海草原江河防线#!"
 oe_v49_mp_legend_caribbean: "加勒比自由海盗共和国"
