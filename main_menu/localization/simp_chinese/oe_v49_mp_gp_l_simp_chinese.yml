 oe_v49_mp_legend_swiss: "瑞士皇家卫队佣兵圈"
 oe_v49_mp_legend_varangian: "瓦兰吉海外佣兵团"
 oe_v49_mp_legend_black_army: "匈牙利黑军常备佣兵"
 oe_v49_mp_legend_cossack: "哥萨克塞契自治军团"
 OE_V49_MP_GUI_HDR_ERA: "活跃纪元"
 OE_V49_MP_GUI_HDR_METER: "自由私掠与佣兵指数"
 OE_V49_MP_GUI_CARD_TITLE: "重金买铁骑，黑旗掠大洋"
 OE_V49_MP_GUI_CARD_BODY: "签发跨洋私掠执照、按本国地域与时代动态招募传奇佣兵团（瑞士卫队、瓦兰吉、黑军、哥萨克塞契）、设立武装皇家特许商会，或缔结护航剿匪同盟将海盗收编为皇家水师。"
 OE_V49_MP_GUI_GAUGE_LABEL: "皇家常备秩序 (0) <-> 自由佣兵与私掠鼎盛 (100)"
 OE_V49_MP_GUI_FOOTNOTE: "1650年后，指数达到92以上将迎来自由佣兵与私掠黄金时代；压低至8以下则确立皇家海防与常备军垄断秩序。"
 oe_sit_v49_great_persons: "跨时代历史大师巡游与宫廷竞聘"
 oe_sit_v49_great_persons_desc: "从贝利撒留、伊本·赫勒敦，到达·芬奇、米开朗基罗、王阳明、戚继光、徐光启，再到艾萨克·牛顿、伏尔泰与莫扎特，横跨十二大历史剧本的旷世名将、哲人、通才与艺术巨匠巡游列国宫廷，静候慧眼识珠、敢于重金竞聘并设立科学院教席的明主礼遇。"
 oe_v49_gp_end_republic_of_letters: "横贯东西的天下文脉与群星盛世"
 oe_v49_gp_end_republic_of_letters_desc: "绵延数代的宫廷礼贤竞聘、皇家科学院教席与跨国思想沙龙已铸就贯通东西方的天下文脉，令科学与艺文的光辉世代长明。"
 oe_v49_gp_end_immortal_legacy: "群星璀璨的大师不朽遗产"
 oe_v49_gp_end_immortal_legacy_desc: "虽历代旷世大师终归史册，但他们留下的兵书典籍、宏伟穹顶、交响名篇与科学院传承依然矗立，成为近代文明的不朽基石。"
 oe_v49_gp_map_classical_med_tt: "#Y 古典地中海与北非学术圈（贝利撒留、伊本·赫勒敦）#!"
 oe_v49_gp_map_renaissance_tt: "#Y 文艺复兴工坊与帝国乐都核心区（达·芬奇、米开朗基罗、莫扎特）#!"
 oe_v49_gp_map_east_asia_tt: "#Y 东亚心学、兵学与中西会通圈（王阳明、戚继光、徐光启）#!"
 oe_v49_gp_map_enlightenment_tt: "#Y 大西洋皇家学会与启蒙文坛圈（艾萨克·牛顿、伏尔泰）#!"
 oe_v49_gp_legend_classical_med: "古典地中海与史学圈（贝利撒留、伊本·赫勒敦）"
 oe_v49_gp_legend_renaissance: "文艺复兴与帝国乐都（达·芬奇、米开朗基罗、莫扎特）"
 oe_v49_gp_legend_east_asia: "东亚经世名家圈（王阳明、戚继光、徐光启）"
 oe_v49_gp_legend_enlightenment: "启蒙科学文坛圈（牛顿、伏尔泰）"
 OE_V49_GP_GUI_HDR_ERA: "活跃纪元"
 OE_V49_GP_GUI_HDR_METER: "宫廷礼贤指数"
 OE_V49_GP_GUI_CARD_TITLE: "列国宫廷竞聘旷世奇才"
 OE_V49_GP_GUI_CARD_BODY: "横跨520至1836年全剧本重金竞聘十大历史大师，设立皇家科学院首席教席、定制传世巨作与典籍、刊印新式兵书与火器操典，并举办跨国思想沙龙抵御敌国挖角。"
 OE_V49_GP_GUI_GAUGE_LABEL: "全球宫廷礼贤与天下文脉指数"
 OE_V49_GP_GUI_FOOTNOTE: "十大历史大师依真实年代陆续巡游登场（自520年贝利撒留直至1791年莫扎特）；1785年后指数达95以上将铸就横贯东西的天下文脉盛世。"
 oe_v49_mp_act_letters_of_marque: "签发跨洋私掠许可证"
 oe_v49_mp_act_letters_of_marque_desc: "向身经百战的武装私掠船长颁授王室执照，准其袭扰宿敌商路并按成解缴战利白银，以海盗之刃削弱敌国财源。"
 oe_v49_mp_act_letters_of_marque_tt: "自由佣兵与私掠网络指数 #G +8#!，获得为期12年的 #Y 跨洋私掠许可证体制#! 修正，并增加 #G +4#! 海军传统。"
 oe_v49_mp_act_charter_company: "招募传奇雇佣兵团"
 oe_v49_mp_act_charter_company_desc: "依据本国所处地域与时代背景，重金签下瑞士皇家卫队、瓦兰吉重斧佣兵团、匈牙利黑军、哥萨克塞契或传奇私掠舰队的专属契约。"
 oe_v49_mp_act_charter_company_tt: "自由佣兵与私掠网络指数 #G +7#!，按本国地域与时代自动授予对应的 #Y 传奇雇佣兵团#! 修正（12年），并获得 #G +4#! 陆军传统。"
 oe_v49_mp_act_coopt_pirates: "收编海盗舰队组建皇家海军"
 oe_v49_mp_act_coopt_pirates_desc: "颁布御笔招安令与海军将校衔，将叱咤海疆的自由海盗船队、迅捷快船与暗礁海图一举纳入皇家水师编制。"
 oe_v49_mp_act_coopt_pirates_tt: "自由佣兵与私掠网络指数 #G -8#!（迈向皇家常备秩序），获得为期12年的 #Y 收编海盗组建的皇家舰队#! 修正，并增加 #G +5#! 海军传统。"
 oe_v49_mp_act_anti_piracy_pact: "缔结护航与剿匪同盟"
 oe_v49_mp_act_anti_piracy_pact_desc: "联合沿海通商诸国编组护航水师、修筑烽火灯塔并互通海情，协同围剿海盗巢穴以保商路畅通无阻。"
 oe_v49_mp_act_anti_piracy_pact_tt: "自由佣兵与私掠网络指数 #G -9#!（迈向皇家常备秩序），并获得为期12年的 #Y 联合护航与海上剿匪同盟#! 修正。"
 oe_v49_mp_act_cossack_charter: "册封边疆自由佣兵自治权"
 oe_v49_mp_act_cossack_charter_desc: "向哥萨克塞契与边疆自由战士颁授免税屯垦与自治宪章，换取他们常年拱卫国门并在大战时火速驰援。"
 oe_v49_mp_act_cossack_charter_tt: "自由佣兵与私掠网络指数 #G +6#!，并获得为期12年的 #Y 边疆自由佣兵自治册封诏#! 修正。"
 oe_v49_mp_act_royal_chartered_co: "设立武装皇家特许商会"
 oe_v49_mp_act_royal_chartered_co_desc: "御准设立拥有筑堡、铸炮与武装商船特权的皇家特许股份商会，以商养战开拓远洋航路并抗衡他国私掠。"
 oe_v49_mp_act_royal_chartered_co_tt: "自由佣兵与私掠网络指数 #G -4#!，获得为期12年的 #Y 武装皇家特许远洋商会#! 修正，并增加 #G +5#! 威望。"
 oe_v49_gp_act_royal_bidding: "宫廷重金竞聘巡游大师"
 oe_v49_gp_act_royal_bidding_desc: "遣使携带厚俸与御笔礼书奔赴四方，在诸国宫廷竞价中拔得头筹，延揽巡游天下的名将、通才与艺术巨匠。"
 oe_v49_gp_act_royal_bidding_tt: "全球宫廷礼贤指数 #G +7#!，获得为期12年的 #Y 皇家宫廷重金礼贤机制#! 修正，并增加 #G +5#! 威望。"
 oe_v49_gp_act_academy_chair: "设立皇家科学院首席教席"
 oe_v49_gp_act_academy_chair_desc: "于都城设立永续学田支撑的皇家科学院首席教席，汇聚海内外天算、格致与法政名家讲学著述，提速全国科研与识字。"
 oe_v49_gp_act_academy_chair_tt: "全球宫廷礼贤指数 #G +8#!，并获得为期12年的 #Y 皇家科学院首席教席#! 修正。"
 oe_v49_gp_act_commission_masterwork: "定制传世巨作与典籍"
 oe_v49_gp_act_commission_masterwork_desc: "拨付内帑礼请当世宗师主持宏伟穹顶、雕像壁画、乐章或皇朝典籍编纂，令本朝文教光华辉映千秋。"
 oe_v49_gp_act_commission_masterwork_tt: "全球宫廷礼贤指数 #G +7#!，获得为期12年的 #Y 敕造传世巨作与皇家典籍#! 修正，并增加 #G +6#! 威望。"
 oe_v49_gp_act_military_treatise: "刊印新式兵书与火器操典"
 oe_v49_gp_act_military_treatise_desc: "诏令宫廷名将与军械大师编撰并刊印步骑协同、筑垒围城与火器阵法图谱，颁行天下卫所整肃军容。"
 oe_v49_gp_act_military_treatise_tt: "全球宫廷礼贤指数 #G +6#!，获得为期12年的 #Y 新式兵书与火器操典刊印#! 修正，并增加 #G +5#! 陆军传统。"
 oe_v49_gp_act_grand_salon: "举办跨国思想沙龙"
 oe_v49_gp_act_grand_salon_desc: "广邀四海使节、硕学名儒与科学通才齐聚宫廷沙龙，纵论律法、天文、农政与艺文，铸就天下文坛佳话。"
 oe_v49_gp_act_grand_salon_tt: "全球宫廷礼贤指数 #G +8#!，并获得为期12年的 #Y 跨国思想沙龙与文坛枢纽#! 修正。"
 oe_v49_mp.1.title: "加勒比自由海盗共和国宣告成立"
 oe_v49_mp.1.desc: "从西印度群岛珊瑚礁环绕的浅水良港传来惊世消息：数百名流散的战时私掠水手、叛逃船员与精明舵手升起骷髅黑旗，在拿骚宣布建立奉行水手公议与均分战利品宪章的“自由海盗共和国”。他们以轻捷双桅快船横行加勒比与大西洋航道，公然蔑视诸国总督的法令，却又把廉价掠夺来的糖、烟草与白银源源倾销进沿岸港口，令朝廷与商帮陷入前所未有的博弈。"
 oe_v49_mp.1.a: "暗中提供避风港并向其签发针对宿敌的私掠执照"
 oe_v49_mp.1.b: "派遣皇家巡洋舰队封锁珊瑚礁并清剿海盗巢穴"
 oe_v49_mp.1.c: "借海事捕获法庭对走私拍卖暗收重税以充国库"
 oe_v49_mp.2.title: "巴巴里私掠舰队横扫地中海商路"
 oe_v49_mp.2.desc: "悬挂巴巴里私掠旗帜的三角帆巡洋舰与轻型桨帆战船趁着拂晓无风海面突袭商船队，凭借凌厉划桨速度轻松甩开行动迟缓的远洋方帆战舰。沿岸市镇的烽火台接连燃起警烟，惊魂未定的海商联名上书恳请朝廷护航或纳银赎商，而海军宿将则力主以毒攻毒，或者重金打造护航水师、或者招募深谙北非水道的老练私掠船长展开反制，以免地中海门户沦为敌方囊中之物。"
 oe_v49_mp.2.a: "招募反私掠快船舰队深入地中海展开以战养战"
 oe_v49_mp.2.b: "修筑海防炮台并编组常年巡弋的联合护航水师"
 oe_v49_mp.2.c: "与巴巴里诸港缔结通商赎金协定以保商船平安"
 oe_v49_mp.3.title: "瑞士皇家卫队的铁血死守"
 oe_v49_mp.3.desc: "在硝烟弥漫的宫廷突袭与险象环生的战阵危局中，受雇护驾的瑞士皇家卫队临危不乱，迅速列起密不透风的十八英尺长枪方阵与重戟盾墙。面对敌军重骑冲击与叛党重金劝降，这群阿尔卑斯山民吟唱故乡战歌、寸步不退，硬生生以血肉之躯死守宫门直至援军赶到。捷报传遍四海宫廷，世人皆叹唯有铁血守约的瑞士佣兵堪当王座最后屏障。"
 oe_v49_mp.3.a: "倍增银币军饷并续签终身宫廷御前卫队契约"
 oe_v49_mp.3.b: "延请瑞士队长将长枪方阵操典全面编入本国常备军"
 oe_v49_mp.3.c: "赐予幸存卫队军官荣誉勋爵与采邑以示殊恩"
 oe_v49_mp.4.title: "匈牙利黑军的欠饷风波"
 oe_v49_mp.4.desc: "仿效喀尔巴阡名将所建的常备重装佣兵“黑军”——汇聚重甲骑兵、波希米亚战车火枪手与攻城工匠的铁血精锐——因财政紧张已连月欠饷，此刻正收拢战旗屯驻冬营之外。大贵族借机阻挠加征军税，黑军统领们按剑静候朝廷裁决：若再无足额现银入营，这支足以横扫中欧的常备职业劲旅便将倒戈散去，甚或反噬沿途郡县，令边防与王权同时陷入险境。"
 oe_v49_mp.4.a: "急铸战时银币足额补发欠饷以稳固黑军军心"
 oe_v49_mp.4.b: "以边疆屯田与自治特权折抵欠饷化佣兵为边军"
 oe_v49_mp.4.c: "遣散高薪佣兵营队转而整肃直属王室的常备军制"
 oe_v49_mp.5.title: "瓦兰吉重斧佣兵团渡海来投"
 oe_v49_mp.5.desc: "乘着狭长战船破浪而来的北方重斧战士现身国门之外，这群身披精良锁子甲、肩扛长柄战斧的瓦兰吉海外佣兵以绝不涉足本土朋党之争、唯对雇主本人效死命而闻名遐迩。他们历经北欧峡湾、罗斯河道与博斯普鲁斯风云，如今愿以血盟立誓投效明主，只求足色金币军饷与建功立业的疆场舞台，令满朝勋贵既敬且畏，也让宫廷护卫格局迎来全新变数。"
 oe_v49_mp.5.a: "亲授血盟契约将其编为君主直属的瓦兰吉重斧近卫"
 oe_v49_mp.5.b: "特许其长船水师巡弋近海航道并护卫商港"
 oe_v49_mp.5.c: "仅延揽其百战军曹担任本国步卒的重甲格斗教头"
 oe_v49_mp.6.title: "哥萨克扁舟舰队奇袭大江海疆"
 oe_v49_mp.6.desc: "驻扎在大河沙洲堡垒中的哥萨克塞契自由军团再度掀起风云：数百名手持火绳枪与轻型佛郎机炮的哥萨克勇士驾驭芦苇护舷的轻捷扁舟，乘夜悄无声息越过封锁铁索，突袭敌境江海重镇后满载战利品凯旋而归。邻国使臣拍案抗议朝廷纵容边地游寇，塞契大酋长则高呼若获册封自治，愿世世代代为帝国充当草原与江海锋刃，朝廷须在边患与强援之间权衡取舍。"
 oe_v49_mp.6.a: "正式册封塞契自治名册并编入帝国边防轻骑与河军"
 oe_v49_mp.6.b: "颁赐边疆屯垦自治诏同时约束酋长须奉旨出征"
 oe_v49_mp.6.c: "严词撇清越境劫掠并改派直属正规军接管边防要隘"
 oe_v49_mp.7.title: "私掠船队劫获远洋白银大帆船"
 oe_v49_mp.7.desc: "主港教堂钟声大作，三艘弹痕累累的私掠护卫舰正拖曳着一艘巍峨华丽的远洋大帆船缓缓驶入防波堤！历经两昼夜海上炮战与跳帮血拼，底舱内堆满成箱银锭、胭脂虫染料与上等丝绸。码头百姓欢声雷动，海事法官、特许商会董事与满脸硝烟的私掠船长齐聚总督府外，翘首静候朝廷裁断这笔惊天横财究竟归入内帑、投入远洋商会，抑或重赏群雄。"
 oe_v49_mp.7.a: "依海事捕获法收取皇家重成白银充实国库并开放拍卖"
 oe_v49_mp.7.b: "将截获白银悉数注资武装皇家特许商会以扩建远洋船队"
 oe_v49_mp.7.c: "慷慨分红重赏参战船员以广召天下豪杰投奔我朝旗帜"
 oe_v49_mp.8.title: "桀骜海盗船长"
 oe_v49_mp.8.desc: "身戴沉重铁镣却神色自若、令周边海商闻风丧胆的传奇海盗提督此刻正立于海事法庭阶下。他抛出惊人筹码：若蒙圣恩颁授御笔特赦并委以官职，愿献出全部隐秘修船港湾、二十艘精锐炮船水手以及标明每一处暗礁与商路节点的秘传海图。愤怒的商帮代表与保守法吏则高呼国法难容，力主立押码头绞刑架以儆效尤，一纸朱批将牵动整片海域的归心。"
 oe_v49_mp.8.a: "御笔特赦并破格授以海防提督衔收编其船队与海图"
 oe_v49_mp.8.b: "押赴行刑码头明正典刑以震慑诸海盗并安抚商民"
 oe_v49_mp.8.c: "暗中放虎归海并补给火药命其专攻宿敌殖民航线"
 oe_v49_mp.9.title: "跨洋私掠许可证点燃商路复仇战"
 oe_v49_mp.9.desc: "我朝大举签发跨洋私掠执照引发了连锁海战报复：敌对海事衙门纷纷颁发反私掠特许状，专挑本国丝绸、香料与粮食货船下手。港口海运保费一夜翻倍，焦虑的航运公会连夜上陈利弊：究竟是彻底放开私掠船籍以攻代守，还是斥资组编护航商队、甚或设立中立海事仲裁所平抑航线动荡，亟待中枢决断，以免海上税关与远洋贸易陷入全面停摆。"
 oe_v49_mp.9.a: "扩大私掠船籍登记并授权纵深袭扰敌国远洋航道"
 oe_v49_mp.9.b: "动用国库贴息组建武装护航船队确保贸易命脉无虞"
 oe_v49_mp.9.c: "开设公正海事捕获法庭以重塑中立商船通航信心"
 oe_v49_mp.10.title: "边境大市上的传奇佣兵团竞价"
 oe_v49_mp.10.desc: "邻近大战方歇，数千名久经沙场的职业雇佣兵——涵盖精锐长枪手、重甲枪骑与攻城工兵——在名声赫赫的佣兵统领率领下开赴边境大市，公开向各国特使竞价待沽。驿馆内列国使臣早已摆满成箱金币与银元彼此抬价：谁能拔得头筹签下这支即插即用的钢铁劲旅，便既可在来日战事中占尽先机，又能断绝宿敌强兵之路，此番博弈堪称无声疆场。"
 oe_v49_mp.10.a: "力压群雄重金竞标将整支传奇佣兵团收入麾下"
 oe_v49_mp.10.b: "以边疆卫戍采邑与自治特权换取其低薪长年效力"
 oe_v49_mp.10.c: "拒绝整体雇佣但高薪延揽其火炮匠与教官充实官军"
 oe_v49_mp.11.title: "武装特许商会请铸炮与独占权"
 oe_v49_mp.11.desc: "海外特许商会的董事们身披天鹅绒礼袍入觐，献上三十门火炮武装大商船与星形海防堡垒的精巧铜模。他们陈情远洋商站与香料仓库孤悬万里之外，屡遭海盗与敌国舰队窥伺，恳请朝廷御准商会自行铸造重炮、招募武装佣兵并独占指定航线，以滚滚关税红利回报国库。朝中法吏却忧虑商帮坐大终成国中之国，力劝君主审慎划定商权与王权边界。"
 oe_v49_mp.11.a: "御准颁授全套武装特许状与远洋航线独占权"
 oe_v49_mp.11.b: "附加战时必须编入皇家护航水师的强制义务条款"
 oe_v49_mp.11.c: "驳回商帮私兵请求并由王室直接掌管远洋税关"
 oe_v49_mp.12.title: "护航与剿匪同盟港口大会"
 oe_v49_mp.12.desc: "来自各沿海通商强国的海军上将与港务司代表齐聚海滨行宫，商议缔结跨国联合剿匪护航宪章。大会提出统一商队夜航灯语、互相开放水师补给船坞，并严禁缔约港窝藏无照海盗船长。这一倡议令大洋商界欢欣鼓舞，却也直指各国暗中豢养私掠船队的灰色地带，考验着朝廷究竟选择澄澈海疆还是保留奇袭暗棋，与会诸国皆在静候我朝表态。"
 oe_v49_mp.12.a: "担任剿匪同盟盟主并派驻主力舰队肃清各处海盗巢穴"
 oe_v49_mp.12.b: "出资联建沿海灯塔与海情网但保留战时私掠特权"
 oe_v49_mp.12.c: "暗中退出盟约并在隐秘良港吸纳流散的自由私掠船长"
 oe_v49_mp.13.title: "佣兵大营的哗变危机"
 oe_v49_mp.13.desc: "河畔大营忽然响起叛逆的战鼓声，受雇驻扎的外国雇佣兵因不满成色不足的银币与迟到的粮草车队，竟公推军士委员会接管了火药辎重营。哗变佣兵拔剑喧嚣，扬言若日落前见不到足色金币与特赦文书，便将拔营洗劫附近富庶市镇。前线战事吃紧、地方州府告急，如何平息这场火烧眉毛的雇佣兵变考验着君主的铁腕与权变，亦关乎全军士气。"
 oe_v49_mp.13.a: "火速押运足色金币入营补饷以化解哗变保全战力"
 oe_v49_mp.13.b: "调遣皇家直属精锐连夜合围大营缴械法办首恶"
 oe_v49_mp.13.c: "改签边疆屯田折饷新约以削减现银负担"
 oe_v49_mp.14.title: "海盗黄金时代落幕与公海法典"
 oe_v49_mp.14.desc: "包铜战列舰队与体系严密的国家常备军正步步压缩自由海盗共和国与流浪佣兵团纵横驰骋的灰色疆域。海事法学家呈上一部划时代的《公海航行法典》，力主永久废止私掠并全面收归国家军权；而饱经风霜的佣兵统领与船长却进言称，灵动彪悍的契约劲旅与海上奇兵在列强博弈中依然无可替代。大洋与战场的旧时代正站在历史十字路口。"
 oe_v49_mp.14.a: "颁行《公海与国家常备军法典》终结自由私掠乱象"
 oe_v49_mp.14.b: "将百战老船长与佣兵教官悉数收编入皇家海陆军学院"
 oe_v49_mp.14.c: "保留隐秘私掠与传奇佣兵网络以备来日奇袭制胜"
 oe_v49_gp.1.title: "贝利撒留"
 oe_v49_gp.1.desc: "军机御帐之内骤然鸦雀无声——使臣急报，深谙重装具装骑兵机动穿插、极简后勤与闪电复国之道的旷世名将弗拉维乌斯·贝利撒留正待明主礼聘！从幼发拉底河畔到迦太基古城，精锐扈从骑兵无不景仰其威名，列国朝廷已纷纷派出满载金币的特使展开重金竞逐。若能将这位古典世界最后的战术奇才招致麾下，三军面貌必将焕然一新。"
 oe_v49_gp.1.a: "重金压倒列国竞价拜贝利撒留为三军统帅推行机动战法"
 oe_v49_gp.1.b: "礼请其专职编撰围城后勤与精骑操典并颁行全军"
 oe_v49_gp.1.c: "以凯旋国宴隆重礼遇交流兵法而暂守府库财力"
 oe_v49_gp.2.title: "伊本·赫勒敦"
 oe_v49_gp.2.desc: "自马格里布与开罗远道而来的商队护送着一位名动地中海的大法官、外交家兼史学宗师——伊本·赫勒敦。他手捧宏篇巨著《历史绪论》，精辟剖析王朝盛衰律、群体凝聚力与轻徭薄赋反增税入的财政奥秘。从格拉纳达到大马士革的诸国君主皆在重金竞邀其入幕，若我朝能延请这位社会史学鼻祖主持中枢政务与档案整理，国政必将井然有序。"
 oe_v49_gp.2.a: "重金礼聘伊本·赫勒敦出任首席政法史官革新内阁治道"
 oe_v49_gp.2.b: "为其专设皇家科学院讲席广招门徒研习历史兴衰律"
 oe_v49_gp.2.c: "资助抄译其财政政论颁发各省税吏参详而不设专席"
 oe_v49_gp.3.title: "达·芬奇"
 oe_v49_gp.3.desc: "一位远道而来的使者徐徐展开满纸反写手稿的奇异画册：可折叠浮桥、连发机关火炮、水利船闸、精密人体解剖图与光影幽微的传世肖像草稿跃然纸上！举世无双的文艺复兴通才列奥纳多·达·芬奇正权衡米兰、佛罗伦萨与诸国宫廷的竞聘报价，他只求一座经费充沛、不受俗务掣肘的皇家工坊，以便同步推进工程机械奇观与不朽丹青。"
 oe_v49_gp.3.a: "倾力竞标胜出并赐建达·芬奇专属通才工坊与画室"
 oe_v49_gp.3.b: "重托其专攻棱堡城防、运河船闸与新式攻城机械"
 oe_v49_gp.3.c: "高价购藏其工程机械手稿摹本入皇家书库供工匠研习"
 oe_v49_gp.4.title: "米开朗基罗"
 oe_v49_gp.4.desc: "性情刚烈却在雕凿、湿壁画与穹顶建筑三界独步天下的艺术巨擘米开朗基罗·博纳罗蒂刚结束白大理石采矿考察，正冷峻审视列国使节呈上的重金聘书。无论是营建令万邦仰望的首都大穹顶与宏阔壁画，还是设计能硬抗重炮轰击的几何棱堡，只要朝廷愿担负不菲石料经费并包容大师孤傲脾性，其不朽手笔必将为王朝铸就绵延数百载的荣光。"
 oe_v49_gp.4.a: "重金礼聘米开朗基罗主持都城穹顶、大理石群雕与城防工程"
 oe_v49_gp.4.b: "按其建筑手稿设立皇家雕塑与营建行会广育本土良匠"
 oe_v49_gp.4.c: "仅重金购藏一尊大理石杰作陈列御殿以节俭工费"
 oe_v49_gp.5.title: "王阳明：知行合一与心学靖难韬略"
 oe_v49_gp.5.desc: "朝野儒林与封疆大吏皆为一位文武兼资的旷代大儒所折服——阳明先生王守仁。他不仅倡立振聋发聩的“知行合一”与“致良知”心学，破除僵化章句之弊，更亲率民兵与地方官军闪电平定匪患叛乱，政务明决而治军如神。若朝廷能礼聘其入朝讲学并主持地方督抚新政，必将同时焕发官僚实干之风与三军果敢士气，扭转积弊沉疴。"
 oe_v49_gp.5.a: "拜王阳明总揽内阁刷新与边省靖难推行知行合一新政"
 oe_v49_gp.5.b: "广设阳明书院与讲席以启发新进官吏破除空谈陋习"
 oe_v49_gp.5.c: "官刻其语录传习录以弘文风同时维持礼部旧制平衡"
 oe_v49_gp.6.title: "戚继光·《纪效新书》鸳鸯阵"
 oe_v49_gp.6.desc: "纵横东南平倭、镇守蓟门御骑的传奇名将戚继光亲呈图文并茂的兵学巨著《纪效新书》。他痛陈花架子校场演武误国之弊，创制以十二人为一队、长短冷热兵器严密互补的“鸳鸯阵”与车营火器协同战术，更强调足额实饷、连坐赏罚与敌台棱堡固防。朝廷若倾力支持其编练新军并刊布兵书，必可锻造出一支百战不殆的钢铁雄师，威震海疆与塞北。"
 oe_v49_gp.6.a: "全额拨饷支持戚继光编练鸳鸯阵精锐并广筑空心敌台"
 oe_v49_gp.6.b: "官刻《纪效新书》与练兵实纪颁行天下卫所一体操演"
 oe_v49_gp.6.c: "采纳其海防烽燧警报规制并赐予荣衔嘉奖"
 oe_v49_gp.7.title: "徐光启·《农政全书》与红夷炮"
 oe_v49_gp.7.desc: "身旁陈列着精密浑天仪、汉译《几何原本》、耐寒番薯农艺图谱与长射程红夷重炮铸造图纸，博通中西的大儒重臣徐光启慷慨上疏，力倡“欲求超胜，必须会通”。他主张在朝廷支持下统筹历局改历、刊行《农政全书》广种高产新粮，并引进西洋测算弹道之法精铸重炮，一举贯通格致科研、民生仓廪与国防火器三大命脉，奠定百世富强根基。"
 oe_v49_gp.7.a: "倾力资助徐光启统筹历局译书、农政推广与重炮铸造"
 oe_v49_gp.7.b: "令其团队专攻天算几何与译书讲学以充实皇家科学院"
 oe_v49_gp.7.c: "仅官刻《农政全书》颁行各省劝农防荒以省军工开支"
 oe_v49_gp.8.title: "艾萨克·牛顿"
 oe_v49_gp.8.desc: "一束阳光穿过三棱镜在橡木案头折射出七彩光谱，案上叠满阐明万有引力、天体轨道与微积分法则的拉丁文手稿。然而艾萨克·牛顿绝非枯坐象牙塔的空谈学者：他既可执掌皇家学会引领格致革命与航海光学测算，亦能临危出任皇家铸币厂总监，以精密滚边防剪银币与铁腕缉私彻底肃清劣币通胀。列国学府与朝廷皆在竞相致敬礼聘。"
 oe_v49_gp.8.a: "拜牛顿兼领皇家科学院院长与铸币厂总监双兴科教币制"
 oe_v49_gp.8.b: "赐予皇家科学院首席教席专责培养航海天文与工程英才"
 oe_v49_gp.8.c: "出资赞助《原理》印行天下学府以博取启蒙赞助盛名"
 oe_v49_gp.9.title: "伏尔泰：启蒙铁笔与跨国宫廷沙龙"
 oe_v49_gp.9.desc: "宫廷广场车水马龙，全欧最负盛名亦最令权贵胆寒的启蒙铁笔——伏尔泰——带着机敏而犀利的微笑步入阶庭。从波茨坦到列国宫廷，无数君主争相与他通函论道：他的政论与哲理小说高举宽容、理性与法治大旗，既能令本国识字风气与文坛威望一日千里，又随时可能以辛辣讽刺刺痛保守教士与僵化枢臣。朝廷究竟该倾力礼遇还是谨慎设限？"
 oe_v49_gp.9.a: "奉伏尔泰为御前客卿并庇护其启蒙印书局广兴文教舆论"
 oe_v49_gp.9.b: "礼请其领衔跨国宫廷思想沙龙广结列国名士与使节"
 oe_v49_gp.9.c: "以礼赞赏其剧作但严守出版审查以免触怒保守阶层"
 oe_v49_gp.10.title: "莫扎特·维也纳宫廷交响"
 oe_v49_gp.10.desc: "千百支水晶烛火辉映着屏息凝神的列国大使，沃尔夫冈·阿马德乌斯·莫扎特在羽管键琴前奏响即兴协奏曲的最后辉煌和弦，余韵绕梁。此刻全欧宫廷剧院皆在争相延揽这位天纵乐圣：若能赐予丰厚终身宫廷乐长薪俸并配齐满编歌剧管弦乐团，我朝都城必将荣膺当世无可争议的音乐圣殿，令远来使节无不心折，更为王朝留下传颂百代的风雅佳话。"
 oe_v49_gp.10.a: "重金礼聘莫扎特出任首席宫廷乐长并扩建皇家歌剧乐团"
 oe_v49_gp.10.b: "敕令其为本朝谱写传世歌剧巨作并于国宴盛演"
 oe_v49_gp.10.c: "赐予丰厚演出赏金并资助民间音乐学院广传雅乐"
 oe_v49_gp.11.title: "敌国重金挖角我朝宫廷大师！"
 oe_v49_gp.11.desc: "截获的外交密信揭露了一桩令朝堂震动的消息：富庶敌国正暗遣特使携双倍高俸、大理石府邸与御赐勋章潜入都城，企图重金挖角我朝最负盛名的在聘大师！满朝文武痛陈若任由宗师改投他国，非但科研艺文蒙受重创，更将令帝国颜面扫地；司库大臣却皱眉叹息，跨国礼贤竞价水涨船高，若盲目加码恐令内帑吃紧，朝廷亟须果断拍板应对。"
 oe_v49_gp.11.a: "当即加码重金压过敌国报价将大师牢牢留在御前"
 oe_v49_gp.11.b: "颁授终身皇家科学院首席教席与自主治学特权以心留人"
 oe_v49_gp.11.c: "准其体面出访讲学但将全部手稿图纸留档皇家书库"
 oe_v49_gp.12.title: "皇家科学院的跨学科重大突破"
 oe_v49_gp.12.desc: "多年重金养士终于结出惊艳硕果！在皇家科学院并肩钻研的算学家、制图师、冶金巧匠与四海通才联手攻克难关，同时拿出了大幅提升航海测算精度的新星表与改良合金铸造秘法。学界欢呼恳请公开发表以开启民智、提速科研，而军械监与商会行首却争相奏请将成果优先拨付兵工铸炮或专利商营，如何配置这项跨学科突破将深远影响国运。"
 oe_v49_gp.12.a: "向全国书院与学府公开发表成果以全面加速科研演进"
 oe_v49_gp.12.b: "将冶金与弹道突破优先投入兵工铸炮并编入新式操典"
 oe_v49_gp.12.c: "向商帮工坊拍卖皇家专利执照以回笼大笔财政收入"
 oe_v49_gp.13.title: "传世巨作落成震惊四海使节"
 oe_v49_gp.13.desc: "锦绣帷幕在满堂惊叹与掌声中缓缓拉开，由我朝重金敕造的传世巨作正式呈现在列国使节、士绅名流与都城百姓眼前。无论是巧夺天工的宫殿雕塑、彩绘寰宇舆图，还是辉映千古的典籍乐章，其登峰造极的艺术气象无不向天下宣告：本朝不仅武备赫赫，更是四海仰望的礼乐文华之巅。礼部请示如何借此盛事放大帝国威望并广布德泽于万民。"
 oe_v49_gp.13.a: "举办万邦观礼大典并敕造陈列殿堂以扬本朝文化威望"
 oe_v49_gp.13.b: "精印摹本图录作为国礼遍赠列国宫廷以广结外交善缘"
 oe_v49_gp.13.c: "向都城万民免费开放观瞻以凝聚家国自豪与社会安稳"
 oe_v49_gp.14.title: "跨国思想沙龙的东西方激辩"
 oe_v49_gp.14.desc: "华灯高悬的穹顶沙龙之内，来自欧亚诸邦的学者、使节与兵家名士围绕律法公理、格致实证、财政革新与治国之道展开唇枪舌剑的激辩。锐意进取的硕学力主打破门户广开言路与实学，稳健大臣建言以中学西学互鉴折中，而保守宿老则忧心沙龙清议流于浮薄、动摇传统礼教纲常。君主的表态将决定未来十年朝堂学风走向与文明气象。"
 oe_v49_gp.14.a: "力挺跨文明实学激辩并将跨国沙龙确立为宫廷常设盛会"
 oe_v49_gp.14.b: "兼收并蓄编纂跨文明通典以铸就稳健宏阔的天下文脉"
 oe_v49_gp.14.c: "重申传统礼法纲常并审慎节制沙龙刊物以保政局安稳"
