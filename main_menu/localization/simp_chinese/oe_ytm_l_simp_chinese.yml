 OE_YTM_ROAD_1: "河中使道已开"
 OE_YTM_ROAD_0: "西域未通"
 oe_ytm_dec_western_protectorate.title: "敕复西域都护行台"
 oe_ytm_dec_western_protectorate.desc: "趁大元中兴之势重立吐鲁番与河西西域军政行台，维系天山南北驿站安全，然边骑戍守与控驭耗费甚巨。"
 oe_ytm_dec_western_protectorate.a: "拨帑开府，复立西域都护"
 oe_ytm_dec_samarkand_caravan.title: "遣使撒马尔罕与赫拉特官商队"
 oe_ytm_dec_samarkand_caravan.desc: "中亚陆路既通，朝廷可定期发遣官商使团携丝绸瓷器西赴撒马尔罕与赫拉特，增进陆贸、通好帖木儿后王并稳固宝钞信用。"
 oe_ytm_dec_samarkand_caravan.a: "整装西行，通商河中"
 oe_ytm.1.t: "撒马尔罕来讯：跛足征服者崛起"
 oe_ytm.1.desc_x: "#F 十四世纪七十年代，巴鲁剌思部首领帖木儿崛起于河中撒马尔罕与布哈拉。因非成吉思汗直系男嗣，帖木儿拥立察合台傀儡汗并尚黄金家族公主，自号“古列干（驸马）”，兵锋震动中亚。#!\n\n如今，商旅自撒马尔罕与天山疾驰入京，报称这位跛足征服者已兼并河中、虎视四方。枢密院请示：是立即拨帑加强河西与哈密边防，还是先遣胡商斥候西探河中虚实？"
 oe_ytm.1.a: "遣胡商斥候西探撒马尔罕，兼顾陆路通商"
 oe_ytm.1.a.tt: "获得[ShowModifier('oe_ytm_caravan_intel')]（#Y 96#!个月：陆贸效率与外交声望小增，全国月控制度略降）；西域战备升至#Y 1#!。"
 oe_ytm.1.b: "拨帑整饬河西与哈密边防，增调轻骑戍守"
 oe_ytm.1.b.tt: "获得[ShowModifier('oe_ytm_hexi_watch')]（#Y 96#!个月：城防与陆军士气提升，轻骑维护费#R +15%#!）；西域战备升至#Y 2#!。"
 oe_ytm.2.t: "帖木儿使团入大都"
 oe_ytm.2.desc_han: "#F 帖木儿既以“成吉思汗驸马”自居，面对犹据大都龙椅的忽必烈黄金家族直系大汗，却陷入微妙的法理悖论：既不能以“兴灭继绝”为名，便转而借朝贡仪礼与祖宗成法试探大都虚实。#!\n\n如今，帖木儿使团抵大都，竟指斥朝廷推行汉法更化已背弃成吉思汗大札撒，并索要西域商税与平礼国书。朝中宗王与汉臣激辩不休，大汗将如何答复这位巴鲁剌思“驸马”？"
 oe_ytm.2.desc_cus: "#F 帖木儿既以“成吉思汗驸马”自居，面对犹据大都龙椅的忽必烈黄金家族直系大汗，却陷入微妙的法理悖论：既不能以“兴灭继绝”为名，便转而借朝贡仪礼与祖宗成法试探大都虚实。#!\n\n如今，帖木儿使团抵大都要求平起平坐。然本朝既行祖述国俗、黄金家族诸王犹盛，宗室将领皆斥帖木儿不过巴鲁剌思部一介外戚驸马，岂敢与大汗分庭抗礼！"
 oe_ytm.2.desc_gen: "#F 帖木儿既以“成吉思汗驸马”自居，面对犹据大都龙椅的忽必烈黄金家族直系大汗，却陷入微妙的法理悖论：既不能以“兴灭继绝”为名，便转而借朝贡仪礼与祖宗成法试探大都虚实。#!\n\n如今，帖木儿使团自撒马尔罕抵大都，递上辞气傲慢的国书，试探大元对西域宗主权与朝贡仪轨的底线。朝廷面临强硬斥责、名义封羁或收缩关内三条抉择。"
 oe_ytm.2.a: "正告天下：大汗乃黄金家族唯一正统，严斥驸马僭越"
 oe_ytm.2.a.tt: "获得[ShowModifier('oe_ytm_genghisid_pride')]（#Y 144#!个月：士气与正统提升，重骑维护费#R +15%#!）；大元诸王忠诚#G +5#!；若帖木儿存续则双方恶感#R −60#!。"
 oe_ytm.2.b: "颁旨封帖木儿为“西域大元帅”，羁縻其西向用兵"
 oe_ytm.2.b.tt: "获得[ShowModifier('oe_ytm_western_deflection')]（#Y 144#!个月：外交与陆贸提升，月正统降低）；大元诸王忠诚#R −5#!；若帖木儿存续则双方好感#G +20#!。"
 oe_ytm.2.c: "严闭嘉峪关、敛兵固守河西，不涉中亚虚名"
 oe_ytm.2.c.tt: "获得[ShowModifier('oe_ytm_jiayuguan_retrench')]（#Y 144#!个月：防务与控制力提升，陆路贸易效率#R −12%#!）；大元诸王忠诚#R −5#!。"
 oe_ytm.3.t: "天山与塔里木之争"
 oe_ytm.3.desc_x: "#F 塔里木盆地与吐鲁番、喀什噶尔、叶尔羌扼守天山南北要冲，既是察合台诸部与帖木儿角逐的前沿，亦是大元通往河中的咽喉绿洲。#!\n\n如今，吐鲁番与喀什噶尔商路频传警讯，中亚诸部观望大都动向。朝廷是斥资在天山绿洲重设西域都护戍所，还是仅以哈密与绿洲诸城结为羁縻缓冲带？"
 oe_ytm.3.a: "以哈密与绿洲诸城为羁縻缓冲，保河西无虞"
 oe_ytm.3.a.tt: "获得[ShowModifier('oe_ytm_frontier_buffer')]（#Y 144#!个月：防务与稳定效率提升，陆贸略降）；哈密与吐鲁番获得[ShowModifier('oe_ytm_oasis_buffer')]。"
 oe_ytm.3.b: "斥资重设西域都护府，驻军吐鲁番、喀什噶尔与叶尔羌"
 oe_ytm.3.b.tt: "获得[ShowModifier('oe_ytm_protectorate_mod')]（#Y 144#!个月：陆贸#G +10%#!与外交声望提升，轻骑维护费#R +15%#!且月控制略降）；吐鲁番、喀什噶尔、叶尔羌获[ShowModifier('oe_ytm_oasis_garrison')]。"
 oe_ytm.4.t: "一四零五讹答剌寒冬：东征生死局"
 oe_ytm.4.desc_x: "#F 一四零四年冬，横扫西亚与印度的帖木儿率大军自撒马尔罕启程东征中国，冒严寒渡锡尔河抵讹答剌。史实中，这位年近七旬的征服者在一四零五年初病逝于讹答剌寒冬，东征骤止。#!\n\n如今，锡尔河畔暴雪连天，探马自讹答剌星夜驰报：帖木儿军中寒疫横行，东征前锋或将随主帅崩逝而瓦解；但亦有急报称河中精骑正冒雪强渡、决意与大元在天山决一死战！"
 oe_ytm.4.a: "【史实】严冬折戟：帖木儿病逝讹答剌，固守边关静待河中生变"
 oe_ytm.4.a.tt: "进入史实收束分支（帖木儿诸子内讧）；获得[ShowModifier('oe_ytm_otrar_vigil')]（#Y 60#!个月：防务与陆贸恢复，轻骑维护费#R +10%#!）。"
 oe_ytm.4.b: "【IF推演】东征未止！起大汗亲征大纛，迎击帖木儿河中主力"
 oe_ytm.4.b.tt: "开启大元与帖木儿东征大对决分支；获得[ShowModifier('oe_ytm_great_campaign')]（#Y 60#!个月：士气#G +8%#!、纪律#G +3%#!，重骑维护费#R +25%#!且月厌战上升）；帖木儿获东征修正且双方恶感加剧（绝不强行脚本宣战）。"
 oe_ytm.5.t: "河西走廊与河中之役"
 oe_ytm.5.desc_clash: "#F 讹答剌一冬决定了欧亚腹地的军事天平：若河中大军南溃内讧，大元可顺势重掌河西与吐鲁番通途；若帖木儿前锋果真东逼天山，则是黄金家族与河中铁骑跨越千里的生死较量。#!\n\n如今，帖木儿东征军与大元西路大军在吐鲁番与河西走廊展开血战，万里补给线绷紧欲断。大汗决断：是孤注一掷大举反攻、直逼撒马尔罕，还是依托河西堡垒坚壁清野、耗尽敌军锐气？"
 oe_ytm.5.desc_hist: "#F 讹答剌一冬决定了欧亚腹地的军事天平：若河中大军南溃内讧，大元可顺势重掌河西与吐鲁番通途；若帖木儿前锋果真东逼天山，则是黄金家族与河中铁骑跨越千里的生死较量。#!\n\n如今，讹答剌丧讯证实，帖木儿诸子已在撒马尔罕与赫拉特爆发争位混战，东征大军土崩瓦解。朝廷是拨款稳固吐鲁番与河西驿站以收西域商利，还是闭关自守、单靠嘉峪关榷税？"
 oe_ytm.5.a: "坚壁清野，依托哈密与河西重镇耗尽东征锐气"
 oe_ytm.5.a.tt: "获得[ShowModifier('oe_ytm_hexi_attrition')]（#Y 96#!个月：城防#G +12%#!，月厌战上升且陆贸受损）；哈密与吐鲁番留[ShowModifier('oe_ytm_corridor_scar')]。"
 oe_ytm.5.b: "全师西进反攻，击破前锋并威压撒马尔罕"
 oe_ytm.5.b.tt: "大获全胜！获得[ShowModifier('oe_ytm_transoxiana_triumph')]（#Y 144#!个月：威望、士气与陆贸俱增，重骑维护费#R +20%#!）；撒马尔罕获[ShowModifier('oe_ytm_silk_station')]。"
 oe_ytm.5.c: "稳守嘉峪关榷税，不轻易劳师西出"
 oe_ytm.5.c.tt: "获得[ShowModifier('oe_ytm_border_tariffs')]（#Y 144#!个月：税收效率#G +4%#!，陆路贸易效率#R −5%#!）。"
 oe_ytm.5.d: "趁河中内讧修葺吐鲁番驿道，畅通河西商路"
 oe_ytm.5.d.tt: "获得[ShowModifier('oe_ytm_corridor_secured')]（#Y 144#!个月：陆贸#G +8%#!与商容提升，轻骑维护费#R +10%#!）；吐鲁番获[ShowModifier('oe_ytm_silk_station')]。"
 oe_ytm.6.t: "后帖木儿定局"
 oe_ytm.6.desc_x: "#F 帖木儿霸业既转入守成，撒马尔罕与赫拉特渐成中亚与呼罗珊双核，东察合台诸部亦在天山南北重整旗鼓。中亚新秩序的格局，端赖大都的外交落子。#!\n\n如今，撒马尔罕、布哈拉与赫拉特的商使屡扣玉门关请通驿传。朝廷是与撒马尔罕、赫拉特互设常驻驿馆以重启欧亚陆贸，还是优先与察合台诸部订立划界安边条约？"
 oe_ytm.6.a: "与察合台诸部划定天山边约，稳固西陲牧界"
 oe_ytm.6.a.tt: "获得[ShowModifier('oe_ytm_chagatai_stabilized')]（#Y 144#!个月：防务与稳定效率提升，陆贸略降）；喀什噶尔与叶尔羌获[ShowModifier('oe_ytm_oasis_buffer')]。"
 oe_ytm.6.b: "与撒马尔罕、赫拉特互设常使驿馆，重开河中商道"
 oe_ytm.6.b.tt: "开启中亚丝路通畅标记（供丝路双凤联动）；获得[ShowModifier('oe_ytm_samarkand_embassy')]（#Y 144#!个月：陆贸#G +8%#!与外交提升，月控制略降）；撒马尔罕与赫拉特获[ShowModifier('oe_ytm_silk_station')]。"
 oe_ytm.7.t: "沙哈鲁和平使团抵大都"
 oe_ytm.7.desc_x: "#F 一四一九至一四二二年间，帖木儿之子沙哈鲁自赫拉特遣五百余人大型使团（画师火者盖耶速丁纪行）携天马与珍宝东赴中原，与兀鲁伯的撒马尔罕学派一道开创中亚与中国和平通商与历算交流的新纪元。#!\n\n如今，沙哈鲁与撒马尔罕的盛大使团已抵大都崇天门外，携西域骏马、星盘与波斯通商国书求见中兴大汗。礼部请示：是效平礼大国之谊缔结通商和约，还是责其恪守朝贡藩礼？"
 oe_ytm.7.a: "责令赫拉特与河中循旧制行朝贡藩礼"
 oe_ytm.7.a.tt: "获得[ShowModifier('oe_ytm_khan_suzerainty')]（#Y 144#!个月：威望与正统提升，陆贸效率#R −6%#!且外交声望略降）。"
 oe_ytm.7.b: "以平礼大国相待，缔结大都与赫拉特通商和约"
 oe_ytm.7.b.tt: "畅通欧亚中段丝路（联动丝路双凤）；获得[ShowModifier('oe_ytm_shah_rukh_accord')]（#Y 144#!个月：陆贸#G +10%#!、商容与科研提升，月威望略降）；若钞法运行则宝钞信用#G +4#!。"
 oe_ytm.8.t: "西域定局：大元西陲百年遗产"
 oe_ytm.8.desc_x: "#F 历经半世纪的河中风暴、讹答剌寒冬与沙哈鲁通使，大元经由中兴熬过了成吉思汗之后最险峻的西域大考，河西、天山与撒马尔罕之间的秩序终归尘埃落定。#!\n\n如今，西域经略大势已定，中书省请大汗为后世定下西陲国策：是以“大元欧亚和平”为纲、常开大都至撒马尔罕万里驿道，还是以“西域边塞重镇”为本、专务屯田固防？"
 oe_ytm.8.a: "筑牢西域边塞重镇，以屯田坚壁长保中原"
 oe_ytm.8.a.tt: "获得常驻修正[ShowModifier('oe_ytm_frontier_bastion')]（元亡前有效：城防与士气大增，要塞维护与陆贸效率略降）。本线完结。"
 oe_ytm.8.b: "昭告“大元欧亚和平”，贯通大都至撒马尔罕万里丝路"
 oe_ytm.8.b.tt: "开启欧亚和平贯通标记（供丝路双凤联动）；获得常驻修正[ShowModifier('oe_ytm_pax_eurasiana')]（元亡前有效：陆贸、商容与外交大振，轻骑维护费#R +15%#!）。本线完结。"
 oe_ytm.20.t: "大元与帖木儿：选项生效"
 oe_ytm.90.t: "大元中兴与帖木儿东征"
