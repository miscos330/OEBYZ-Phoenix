 oe_ytm_b_shah_rukh: "沙哈鲁平礼通好"
 STATIC_MODIFIER_NAME_oe_ytm_hexi_watch: "河西哈密严防"
 STATIC_MODIFIER_DESC_oe_ytm_hexi_watch: "大元在河西走廊与哈密增筑戍堡、整训边骑，西陲防务稳固而轻骑养军费用大增。"
 STATIC_MODIFIER_NAME_oe_ytm_caravan_intel: "撒马尔罕商队密探"
 STATIC_MODIFIER_DESC_oe_ytm_caravan_intel: "大都遣西域胡商与斥候探查河中动静，陆路商贸与外交声望小涨，然边关稽查略松。"
 STATIC_MODIFIER_NAME_oe_ytm_genghisid_pride: "黄金家族大汗威严"
 STATIC_MODIFIER_DESC_oe_ytm_genghisid_pride: "大都正告天下成吉思汗直系法统不可僭越，全军士气与正统昂扬，然重骑战备开支骤升。"
 STATIC_MODIFIER_NAME_oe_ytm_western_deflection: "羁縻西域大元帅策"
 STATIC_MODIFIER_DESC_oe_ytm_western_deflection: "朝廷以名义封号羁縻河中强藩、冀其西向用兵，外交与陆贸暂得喘息而天朝正统蒙尘。"
 STATIC_MODIFIER_NAME_oe_ytm_jiayuguan_retrench: "嘉峪关敛兵固守"
 STATIC_MODIFIER_DESC_oe_ytm_jiayuguan_retrench: "收缩玉门关外影响、专守河西堡垒，内治与守城俱固，然西域陆路商贸大幅萎缩。"
 STATIC_MODIFIER_NAME_oe_ytm_protectorate_mod: "复设西域都护府"
 STATIC_MODIFIER_DESC_oe_ytm_protectorate_mod: "大元于吐鲁番、喀什噶尔与叶尔羌重设西域军政都护，天山商路与威望大涨而骑兵戍边费重。"
 STATIC_MODIFIER_NAME_oe_ytm_frontier_buffer: "哈密绿洲羁縻带"
 STATIC_MODIFIER_DESC_oe_ytm_frontier_buffer: "以哈密与绿洲诸城为西陲缓冲，防务稳健且朝廷安定，然大都对天山商路的直接抽税偏弱。"
 STATIC_MODIFIER_NAME_oe_ytm_otrar_vigil: "讹答剌严冬戒备"
 STATIC_MODIFIER_DESC_oe_ytm_otrar_vigil: "河西边军顶风冒雪戒备西域，待帖木儿大军瓦解后商道渐复，惟严冬转运军费颇巨。"
 STATIC_MODIFIER_NAME_oe_ytm_great_campaign: "玉门关大汗亲征"
 STATIC_MODIFIER_DESC_oe_ytm_great_campaign: "面对跨越讹答剌严冬的帖木儿东征大军，大元尽起精骑迎战，士气与纪律大振而厌战与军费剧增。"
 STATIC_MODIFIER_NAME_oe_ytm_tim_eastern_march: "东征契丹大军"
 STATIC_MODIFIER_DESC_oe_ytm_tim_eastern_march: "帖木儿军跨越锡尔河寒冬直指天山与河西，攻势凌厉而长途补给与军费负担沉重。"
 STATIC_MODIFIER_NAME_oe_ytm_transoxiana_triumph: "威震河中"
 STATIC_MODIFIER_DESC_oe_ytm_transoxiana_triumph: "大元精骑在天山与河中边缘击退强敌，黄金家族威望与陆路商道俱振，惟远戍骑兵岁费高昂。"
 STATIC_MODIFIER_NAME_oe_ytm_hexi_attrition: "河西坚壁消耗战"
 STATIC_MODIFIER_DESC_oe_ytm_hexi_attrition: "以嘉峪关、哈密诸城坚壁清野消耗东征大军，守城坚不可摧，然长期拉锯带来厌战与商路阻滞。"
 STATIC_MODIFIER_NAME_oe_ytm_corridor_secured: "河西吐鲁番畅道"
 STATIC_MODIFIER_DESC_oe_ytm_corridor_secured: "趁帖木儿诸子内讧稳固吐鲁番与河西驿站，陆路商旅大通而边防骑兵维持费略增。"
 STATIC_MODIFIER_NAME_oe_ytm_border_tariffs: "西关榷税守成"
 STATIC_MODIFIER_DESC_oe_ytm_border_tariffs: "朝廷不涉中亚纷争而在嘉峪关设关抽税，田赋与关税稳收而长途陆贸活力略减。"
 STATIC_MODIFIER_NAME_oe_ytm_samarkand_embassy: "撒马尔罕赫拉特常使"
 STATIC_MODIFIER_DESC_oe_ytm_samarkand_embassy: "大都与撒马尔罕、赫拉特互设常驻使馆，中亚陆贸与外交大振，然西域往来繁密令控驭略耗。"
 STATIC_MODIFIER_NAME_oe_ytm_chagatai_stabilized: "察合台边疆安定约"
 STATIC_MODIFIER_DESC_oe_ytm_chagatai_stabilized: "与察合台诸部划定天山牧界、互不侵扰，边防与稳定成本改善而西行商利较为有限。"
 STATIC_MODIFIER_NAME_oe_ytm_shah_rukh_accord: "沙哈鲁平礼通商约"
 STATIC_MODIFIER_DESC_oe_ytm_shah_rukh_accord: "大元以平等国礼接待赫拉特沙哈鲁使团，陆路商贸、商容与天文历算交流俱兴，惟天朝独尊威望略让。"
 STATIC_MODIFIER_NAME_oe_ytm_khan_suzerainty: "大汗宗主仪轨"
 STATIC_MODIFIER_DESC_oe_ytm_khan_suzerainty: "大都坚持帖木儿后王行朝贡之礼，天朝威望与正统大增，然西域诸邦心怀芥蒂、商贸受阻。"
 STATIC_MODIFIER_NAME_oe_ytm_pax_eurasiana: "大元欧亚和平纪"
 STATIC_MODIFIER_DESC_oe_ytm_pax_eurasiana: "自大都至撒马尔罕驿传贯通、百货云集，大元重现欧亚腹地商旅盛景，惟长途护商骑军岁费不菲。"
 STATIC_MODIFIER_NAME_oe_ytm_frontier_bastion: "西域边塞重镇"
 STATIC_MODIFIER_DESC_oe_ytm_frontier_bastion: "以河西与西域重镇为万里铜墙，守备与士气雄厚，然要塞维护吃紧且商路偏向内敛。"
 STATIC_MODIFIER_NAME_oe_ytm_oasis_garrison: "西域都护绿洲戍所"
 STATIC_MODIFIER_DESC_oe_ytm_oasis_garrison: "大元戍军进驻丝路绿洲重镇，商旅安全、城防坚固，然驻军供亿引发地方轻微躁动。"
 STATIC_MODIFIER_NAME_oe_ytm_oasis_buffer: "边疆羁縻绿洲"
 STATIC_MODIFIER_DESC_oe_ytm_oasis_buffer: "绿洲城邦依约戍边纳贡，防务稳固而商市规模偏于保守。"
 STATIC_MODIFIER_NAME_oe_ytm_silk_station: "大元西域驿馆"
 STATIC_MODIFIER_DESC_oe_ytm_silk_station: "大都使节与商队常驻驿馆，带来旺盛商机与繁杂胡汉往来。"
 STATIC_MODIFIER_NAME_oe_ytm_corridor_scar: "河西兵燹焦土"
 STATIC_MODIFIER_DESC_oe_ytm_corridor_scar: "坚壁清野与拉锯战火令绿洲农商受创，城防犹在而繁荣需时恢复。"
