l_simp_chinese:
 # Project Phoenix v42.0: 跨时代拜占庭即时开局政体改革
 oe_v420_byz_1444_palaiologan_despotates:0 "巴列奥略专制公国与首席大臣制"
 oe_v420_byz_1444_palaiologan_despotates_desc:0 "通过首席大臣（Mesazon）统合君士坦丁堡皇庭与摩里亚、塞林布里亚等皇室专制公领，在国祚维艰之际维系内阁政务与皇室外交威望，代价是中央皇权有所分流。"
 oe_v420_byz_1444_theodosian_garrison:0 "狄奥多西城垣与六里墙戍卫制"
 oe_v420_byz_1444_theodosian_garrison_desc:0 "将君士坦丁堡三重陆墙与科林斯地峡六里墙纳入常备要塞守备体系，大幅强化城防韧性与驻军规模，但沉重的修缮与戍边开支持续挤压帝国税源。"
 oe_v420_byz_1444_mistral_renaissance_court:0 "米斯特拉斯古典学苑"
 oe_v420_byz_1444_mistral_renaissance_court_desc:0 "庇护活跃于米斯特拉斯与布拉赫奈宫的新柏拉图学者与古典文人，推动识字率、科研与希腊文脉复兴，但也时常引发保守修院教士阶层的抵触。"
 oe_v420_byz_1204_nicaean_exile_court:0 "尼西亚流亡皇庭与拉斯卡里斯法统"
 oe_v420_byz_1204_nicaean_exile_court_desc:0 "在第四次十字军洗劫君堡后于尼西亚重建帝国中枢与普世牧首座，重塑罗马正统法统与集权行政纪律，但流亡宫廷的维系显著加重了宫廷财政负担。"
 oe_v420_byz_1204_akritai_border_themes:0 "安纳托利亚边防军户与尼西亚军区"
 oe_v420_byz_1204_akritai_border_themes_desc:0 "沿桑加里奥斯河与门德雷斯河谷重整免税军屯边户（Akritai）与军区粮仓，强力保障尼西亚的要塞固守与征召恢复，代价是抑制了城市商团的自治诉求。"
