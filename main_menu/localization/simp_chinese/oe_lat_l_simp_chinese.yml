 oe_lat_fief:0 "拉丁罗马尼亚大采邑"
 oe_lat_fief_desc:0 "仿效1204年《罗马尼亚帝国分割条约》册封的专属实土拉丁大采邑。它与宗主共享地图色块但保留各自响亮的历史名号，必然响应宗主一切攻防征召，缴纳适度封建税贡，维系城堡守军与爱琴海桨帆舰队，且不受普通外交吞并或解约干扰。"
