 oe_lat_fief_subject_opinion:0 "拉丁帝国宗主权"
 oe_lat_fief_overlord_opinion:0 "拉丁罗马尼亚大采邑"
 oe_lat_fief_reform:0 "帝国分割条约大采邑制"
 oe_lat_fief_reform_desc:0 "依1204年《帝国分割条约》与《罗马尼亚阿萨伊斯法典》整编拉丁采邑治理体系，兼具坚固城防、重甲骑士、海贸活力与务实宽容。"
 oe_lat_op_enfeoffed:0 "获封帝国分割大采邑"
 oe_lat_op_catalan_corridor:0 "加泰罗尼亚—阿拉贡地中海大通道"
 oe_lat_op_cyprus_cilicia_pact:0 "塞浦路斯—奇里乞亚十字军盟约"
 oe_lat_op_tripartite_crusade:0 "天主教三方十字军同盟"
 oe_lat_op_venetian_accord:0 "威尼斯—拉丁爱琴海商贸协定"
 oe_lat_dec_proclaim_latin_empire.title:0 "宣告复辟拉丁帝国（Imperium Romaniae）"
 oe_lat_dec_proclaim_latin_empire.desc:0 "战旗既已重插君士坦丁堡城头，无需受制于时代枷锁或繁琐前置门槛，即刻于圣索菲亚大教堂庄严宣告复辟#Y 拉丁帝国（Imperium Romaniae）#!并晋升帝国等级！"
 oe_lat_dec_proclaim_latin_empire.a:0 "在圣索菲亚大教堂加冕罗马尼亚拉丁皇帝！"
 oe_lat_dec_proclaim_latin_empire_tt:0 "复辟#Y 拉丁帝国（LAT）#!，晋升为#Y 帝国#!等级，迁都#Y 君士坦丁堡#!并获赐核心，解锁#Y 帝国分割条约大采邑制#!，随后触发圣索菲亚加冕大典。"
 oe_lat_dec_catalan_aragon_corridor.title:0 "开辟加泰罗尼亚—阿拉贡地中海大通道"
 oe_lat_dec_catalan_aragon_corridor.desc:0 "将雅典与底比斯直接对接阿拉贡与西西里舰队，以阿尔莫加瓦尔弩手与加泰罗尼亚战舰锻造横跨伊比利亚—西西里—希腊的地中海霸权通道。"
 oe_lat_dec_catalan_aragon_corridor.a:0 "贯通巴塞罗那至雅典的地中海黄金通道"
 oe_lat_dec_catalan_aragon_corridor_tt:0 "获得持续#Y 30#!年的#Y 加泰罗尼亚—阿拉贡地中海大通道#!加成，大幅提升与#Y 阿拉贡#!及#Y 西西里#!的好感，并在雅典整编加泰罗尼亚弩手与战船。"
 oe_lat_dec_enfeoff_thessalonica.title:0 "帝国分割第一档：分封塞萨洛尼基王国采邑"
 oe_lat_dec_enfeoff_thessalonica.desc:0 "将在马其顿征服的非首都领地分封为专属#Y 拉丁塞萨洛尼基采邑#!（绝不割让首都、君士坦丁堡或色雷斯核心区）。"
 oe_lat_dec_enfeoff_thessalonica.a:0 "颁授塞萨洛尼基大采邑诏书"
 oe_lat_dec_enfeoff_thessalonica_req_tt:0 "在马其顿（不含色雷斯与君士坦丁堡）直接拥有至少#Y 3#!处非首都领地。"
 oe_lat_dec_enfeoff_thessalonica_tt:0 "在马其顿非首都直辖领地建立专属#Y 拉丁罗马尼亚大采邑#!——#Y 拉丁塞萨洛尼基采邑#!，随后触发封邑授旗大典。"
 oe_lat_dec_enfeoff_morea_athens.title:0 "帝国分割二至三档：分封摩里亚或雅典赫拉斯采邑"
 oe_lat_dec_enfeoff_morea_athens.desc:0 "依《帝国分割条约》重整中南希腊经典拉丁采邑：择一册封#Y 摩里亚法兰克采邑#!（伯罗奔尼撒）或#Y 雅典赫拉斯采邑#!（中希腊与爱琴海诸岛），绝不动用首都或色雷斯核心区。"
 oe_lat_dec_enfeoff_morea_athens.a:0 "第二档：分封亚该亚与摩里亚大采邑"
 oe_lat_dec_enfeoff_morea_athens.b:0 "第三档：分封雅典与赫拉斯大采邑"
 oe_lat_dec_enfeoff_morea_athens_req_tt:0 "在摩里亚（第二档尚未分封时）或中希腊与爱琴海诸岛（第三档尚未分封时）直接拥有至少#Y 3#!处非首都领地。"
 oe_lat_dec_enfeoff_morea_athens_a_tt:0 "在伯罗奔尼撒非首都领地建立专属#Y 摩里亚法兰克采邑#!（第二档；若条件仅满足第三档则改封雅典赫拉斯采邑）。"
 oe_lat_dec_enfeoff_morea_athens_b_tt:0 "在中希腊与爱琴海诸岛非首都领地建立专属#Y 雅典赫拉斯采邑#!（第三档；若条件仅满足第二档则改封摩里亚法兰克采邑）。"
 oe_lat_dec_enfeoff_nicaea_anatolia.title:0 "帝国分割第四档：分封尼西亚与安纳托利亚拉丁采邑"
 oe_lat_dec_enfeoff_nicaea_anatolia.desc:0 "将在马尔马拉、比提尼亚与西安纳托利亚征服的非首都领地分封为#Y 尼西亚拉丁采邑#!（绝不割让首都、君士坦丁堡或色雷斯核心区）。"
 oe_lat_dec_enfeoff_nicaea_anatolia.a:0 "颁授尼西亚与安纳托利亚大采邑诏书"
 oe_lat_dec_enfeoff_nicaea_anatolia_req_tt:0 "在马尔马拉或西安纳托利亚直接拥有至少#Y 4#!处非首都领地。"
 oe_lat_dec_enfeoff_nicaea_anatolia_tt:0 "在马尔马拉与西安纳托利亚非首都领地建立专属#Y 尼西亚拉丁采邑#!，随后触发封邑授旗大典。"
 oe_lat_dec_enfeoff_outremer.title:0 "帝国分割第五档：分封海外安条克大采邑"
 oe_lat_dec_enfeoff_outremer.desc:0 "将在奇里乞亚、安条克与黎凡特征服的非首都领地分封为#Y 安条克海外十字采邑#!（绝不割让首都、君士坦丁堡或色雷斯核心区）。"
 oe_lat_dec_enfeoff_outremer.a:0 "颁授海外安条克大采邑诏书"
 oe_lat_dec_enfeoff_outremer_req_tt:0 "在奇里乞亚或黎凡特直接拥有至少#Y 3#!处非首都领地。"
 oe_lat_dec_enfeoff_outremer_tt:0 "在奇里乞亚与黎凡特非首都领地建立专属#Y 安条克海外十字采邑#!，随后触发封邑授旗大典。"
 oe_lat_dec_muster_frankish_knights.title:0 "征召西欧十字军与加泰罗尼亚先遣劲旅"
 oe_lat_dec_muster_frankish_knights.desc:0 "遣募兵官赴法兰西、阿拉贡与意大利招募十字军精锐骑士或加泰罗尼亚弩手。每#Y 10年#!可施行一次，补充#G +3#!人力、#G +5#!陆军传统、两支常备先遣部队与#G 5年#!远征战力加成。"
 oe_lat_dec_muster_frankish_knights.a:0 "号召十字军精锐先遣齐聚战旗"
 oe_lat_dec_muster_frankish_knights_tt:0 "增加#G +3#!人力与#G +5#!陆军传统，在首都整编#Y 2#!支常备十字军骑士或加泰罗尼亚弩手，并赋予#Y 5#!年先遣增益（冷却 10 年）。"
 oe_lat_dec_tripartite_crusade_accord.title:0 "缔结天主教三方十字军同盟"
 oe_lat_dec_tripartite_crusade_accord.desc:0 "将拉丁罗马尼亚与#Y 罗得岛医院骑士团#!、#Y 马林堡德意志骑士团#!及#Y 罗马教廷#!连为一体，缔结横贯地中海与波罗的海的天主教三方十字军同盟。"
 oe_lat_dec_tripartite_crusade_accord.a:0 "缔结三方十字军神圣盟约"
 oe_lat_dec_tripartite_crusade_accord_tt:0 "缔结#Y 天主教三方十字军同盟#!，赋予我方、#Y 医院骑士团#!与#Y 条顿骑士团#!持续#Y 25#!年的圣战增益，提升与#Y 教宗国#!好感并召开三方十字军大公会议。"
 oe_sit_frankokratia:0 "爱琴海黄昏与拉丁复辟"
 oe_sit_frankokratia_desc:0 "在伯罗奔尼撒、阿提卡、爱琴海群岛、塞浦路斯、奇里乞亚与海峡之间，幸存的法兰克希腊十字军诸邦正面对拜占庭光复浪潮与安纳托利亚突厥诸贝伊国的三方大博弈。究竟是拉丁帝国在圣索菲亚重现辉煌，还是法兰克希腊在爱琴海黄昏中黯然落幕？"
 oe_sit_frankokratia_outcome_latin:0 "拉丁罗马尼亚复辟大捷"
 oe_sit_frankokratia_outcome_latin_desc:0 "满 24 个月后，拉丁帝国掌控君士坦丁堡，或拉丁复辟势能达到 80。"
 oe_sit_frankokratia_outcome_eastern:0 "法兰克希腊落幕：东方光复"
 oe_sit_frankokratia_outcome_eastern_desc:0 "满 24 个月且未复辟拉丁帝国时，拉丁复辟势能跌至 15 以下，或爱琴海核心拉丁诸邦悉数覆亡。"
 oe_sit_frankokratia_outcome_equilibrium:0 "爱琴海多极均势底定"
 oe_sit_frankokratia_outcome_equilibrium_desc:0 "至 1520 年各方皆未彻底倾覆对手时，爱琴海演变为拉丁、希腊与安纳托利亚诸邦长期并存的均势格局。"
 OE_LAT_SIT_TITLE:0 "爱琴海黄昏与拉丁复辟势能"
 OE_LAT_SIT_IDX_L:0 "东方光复与贝伊攻势（15）"
 OE_LAT_SIT_IDX_R:0 "拉丁帝国复辟（80）"
 OE_LAT_SIT_IDX_FOOT:0 "实时追踪安德拉维达、雅典、纳克索斯、内格罗蓬特、塞萨洛尼基、君士坦丁堡、布尔萨与安条克归属。达到 80 或于君士坦丁堡复辟拉丁帝国即获胜，跌至 15 则东方阵营胜出。"
 OE_LAT_SIT_PHASE_KPI:0 "爱琴海局势阶段"
 OE_LAT_SIT_FIEFS_KPI:0 "帝国分割大采邑"
 OE_LAT_SIT_PRESS_KPI:0 "东方反攻压力"
 OE_LAT_SIT_P1:0 "#Y 爱琴海黄昏危局#!"
 OE_LAT_SIT_P2:0 "#color_gold 爱琴海霸权角逐#!"
 OE_LAT_SIT_P3:0 "#color_orange 博斯普鲁斯决战#!"
