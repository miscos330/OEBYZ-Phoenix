 oe_msn_lat_a1_secure_baronies:0 "稳固拉丁男爵诸堡"
 oe_msn_lat_a1_secure_baronies_desc:0 "在摩里亚、阿提卡与爱琴海群岛的山丘之上，法兰克城堡孤悬于强敌环伺之中。稳固核心[fort|e]要塞并锤炼骑士[army_tradition|e]，方能令拉丁希腊立足不败。"
 oe_msn_lat_a1_secure_baronies_req_tt:0 "稳定度至少为 5，且陆军传统至少为 12 或拥有一座城堡。"
 oe_msn_lat_a2_unite_morea_attica:0 "一统摩里亚与阿提卡"
 oe_msn_lat_a2_unite_morea_attica_desc:0 "数十年来亚该亚亲王与雅典公爵在科林斯地峡内耗不休。将安德拉维达与雅典合归一统，铸就希腊本土坚不可摧的拉丁[control|e]腹地。"
 oe_msn_lat_a2_unite_morea_attica_req_tt:0 "自身或属国同时控制安德拉维达以及雅典或底比斯之一。"
 oe_msn_lat_a3_master_aegean_duchies:0 "制霸爱琴海群岛公国"
 oe_msn_lat_a3_master_aegean_duchies_desc:0 "从纳克索斯的大理石城堡到内格罗蓬特的海峡要冲，掌控基克拉泽斯与优卑亚岛将把爱琴海化作拱卫拉丁[trade|e]与桨帆航道的海上堡垒。"
 oe_msn_lat_a3_master_aegean_duchies_req_tt:0 "自身或属国同时控制纳克索斯与内格罗蓬特，且舰队规模达 10 艘或海军传统达 12。"
 oe_msn_lat_a4_break_beyliks:0 "粉碎安纳托利亚诸贝伊国"
 oe_msn_lat_a4_break_beyliks_desc:0 "铁甲十字军横渡爱琴海攻占士麦那、布尔萨与尼西亚，从根源粉碎安纳托利亚诸贝伊国私掠攻势，确立东地中海[army|e]霸权。"
 oe_msn_lat_a4_break_beyliks_req_tt:0 "自身或属国控制布尔萨、士麦那、伊兹尼克或马尼萨之一，或直接拥有马尔马拉／西安纳托利亚至少 3 处领地。"
 oe_msn_lat_b1_march_thessalonica:0 "进军塞萨洛尼基"
 oe_msn_lat_b1_march_thessalonica_desc:0 "昔日蒙费拉托的博尼法斯曾于塞萨洛尼基加冕称王。重夺这座扼守埃格纳提亚大道的[core|e]重港，直通君士坦丁堡的帝王之路豁然洞开。"
 oe_msn_lat_b1_march_thessalonica_req_tt:0 "自身或属国控制塞萨洛尼基。"
 oe_msn_lat_b2_storm_queen_of_cities:0 "兵临城下：光复万城之母"
 oe_msn_lat_b2_storm_queen_of_cities_desc:0 "拉丁十字战旗再度登上金角湾海墙，飘扬于君士坦丁堡穹顶之下。掌控博斯普鲁斯[market|e]咽喉，重掌帝国皇冠指日可待。"
 oe_msn_lat_b2_storm_queen_of_cities_req_tt:0 "自身或属国控制君士坦丁堡。"
 oe_msn_lat_b3_proclaim_imperium_romaniae:0 "加冕罗马尼亚拉丁帝国"
 oe_msn_lat_b3_proclaim_imperium_romaniae_desc:0 "在圣索菲亚大教堂璀璨穹顶之下，拉丁皇帝加冕受剑，将昔日支离破碎的法兰克诸侯国升格为至高无上的[legitimacy|e]帝国皇座。"
 oe_msn_lat_b3_proclaim_imperium_romaniae_req_tt:0 "直接拥有君士坦丁堡，并已宣告复辟拉丁帝国（LAT）。"
 oe_msn_lat_b4_enforce_partitio:0 "重订帝国分割条约大采邑体系"
 oe_msn_lat_b4_enforce_partitio_desc:0 "承袭1204年《罗马尼亚帝国分割条约》，君士坦丁堡自塞萨洛尼基、摩里亚至尼西亚与安条克广建拉丁大采邑，永固诸[subjects|e]忠诚与[crown_power|e]。"
 oe_msn_lat_b4_enforce_partitio_req_tt:0 "拥有至少 2 个活跃拉丁罗马尼亚大采邑，或自身及属国控制至少 45 处领地。"
 oe_msn_lat_c1_catalan_company_supremacy:0 "加泰罗尼亚大佣兵团霸权"
 oe_msn_lat_c1_catalan_company_supremacy_desc:0 "“钢铁觉醒！”的战吼响彻波奥蒂亚原野，加泰罗尼亚大佣兵团以百战锐气震慑诸侯。整编其精锐[army_tradition|e]与伊比利亚—西西里海路，赋予拉丁军锋所向披靡之力。"
 oe_msn_lat_c1_catalan_company_supremacy_req_tt:0 "自身或属国同时控制雅典与底比斯，且陆军传统达 15、已开启加泰罗尼亚—阿拉贡通道或推行常备加泰罗尼亚大佣兵团政策。"
 oe_msn_lat_c2_union_cyprus_cilicia:0 "联结塞浦路斯与奇里乞亚"
 oe_msn_lat_c2_union_cyprus_cilicia_desc:0 "将爱琴海拉丁诸邦与吕西尼昂塞浦路斯、奇里乞亚亚美尼亚山堡连成一气，构筑直指黎凡特海岸的基督教[maritime|e]前哨金桥。"
 oe_msn_lat_c2_union_cyprus_cilicia_req_tt:0 "自身或属国控制尼科西亚或西斯，或与塞浦路斯／奇里乞亚亚美尼亚结盟。"
 oe_msn_lat_c3_reclaim_antioch_jerusalem:0 "光复安条克与圣城耶路撒冷"
 oe_msn_lat_c3_reclaim_antioch_jerusalem_desc:0 "从奥龙特斯河畔的安条克坚城到圣城耶路撒冷，十字军战旗再度飘扬于海外圣地，令整个基督教世界为我们的无上[prestige|e]欢呼。"
 oe_msn_lat_c3_reclaim_antioch_jerusalem_req_tt:0 "自身或属国控制安条克或耶路撒冷。"
 oe_msn_lat_c4_tripartite_crusade:0 "天主教三方十字军同盟"
 oe_msn_lat_c4_tripartite_crusade_desc:0 "在教宗祝福下，拉丁帝国与罗得岛医院骑士团、马林堡德意志骑士团缔结三方十字军同盟，自波罗的海至黎凡特筑起坚不可摧的[manpower|e]与信仰长城。"
 oe_msn_lat_c4_tripartite_crusade_req_tt:0 "威望至少为 25，并已缔结《天主教三方十字军同盟》（或与医院骑士团／条顿骑士团结盟）。"
 oe_msn_lat_d1_assizes_prosperity:0 "阿萨伊斯法典与法制繁荣"
 oe_msn_lat_d1_assizes_prosperity_desc:0 "《罗马尼亚阿萨伊斯法典》以明晰律例保障葡萄园、丝绸工坊与市镇法庭运转，使首都成为法度严明的[development|e]与[prosperity|e]典范。"
 oe_msn_lat_d1_assizes_prosperity_req_tt:0 "稳定度至少为 8，且首都发展度达到 12 或繁荣度达到 25%。"
 oe_msn_lat_d2_aegean_commercial_monopoly:0 "爱琴海黄金商路垄断"
 oe_msn_lat_d2_aegean_commercial_monopoly_desc:0 "底比斯丝绸、摩里亚美酒、纳克索斯大理石与黎凡特香料尽汇于我方特许商港，铸就东地中海首屈一指的[trade|e]垄断网络。"
 oe_msn_lat_d2_aegean_commercial_monopoly_req_tt:0 "月均贸易与税收达到 20，或拥有市场、船坞或行会大厅。"
 oe_msn_lat_d3_uniate_ecclesiastical_peace:0 "东西教会和解与礼仪共融"
 oe_msn_lat_d3_uniate_ecclesiastical_peace_desc:0 "在拉丁大教堂与希腊大都会修院之间架起理解桥梁，抚平1204年的教派裂痕，为帝国带来持久的[estate_satisfaction|e]与教会和平。"
 oe_msn_lat_d3_uniate_ecclesiastical_peace_req_tt:0 "稳定度至少为 12，且已推行一项《爱琴海东西教会统合法》政策或教士满意度达 55%。"
 oe_msn_lat_d4_eternal_latin_romania:0 "永恒拉丁罗马尼亚帝国"
 oe_msn_lat_d4_eternal_latin_romania_desc:0 "自摩里亚与阿提卡诸堡延绵至圣索菲亚穹顶、安纳托利亚与海外圣地，法兰克骑士、加泰罗尼亚劲旅与希腊文明融为一炉，铸就辉耀地中海千秋的[crown_power|e]永恒帝国。"
 oe_msn_lat_d4_eternal_latin_romania_req_tt:0 "稳定度至少为 15，控制君士坦丁堡、塞萨洛尼基及雅典或安德拉维达，且拥有至少 2 个拉丁大采邑或控制 60 处领地（含属国）。"
 oe_lat_emp.1.title:0 "1337年法兰克希腊危局：爱琴海黄昏动员"
 oe_lat_emp.1.desc:0 "第四次十字军东征百余年后，散落希腊与爱琴海的拉丁诸邦正陷入米斯特拉斯拜占庭反攻、波奥蒂亚加泰罗尼亚宿敌与安纳托利亚突厥私掠舰队的三面夹击。安德拉维达、纳克索斯、内格罗蓬特与凯法利尼亚的男爵与市民紧急集会：是当即整编常备十字军精锐先遣迎战强敌，还是将应急战备金投入城堡整修与阿萨伊斯内政复兴？"
 oe_lat_emp.1.a:0 "吹响战号：整编法兰克骑士先遣与战备金库！"
 oe_lat_emp.1.b:0 "优先修筑男爵城堡，推行阿萨伊斯内政复兴"
 oe_lat_emp.2.title:0 "加泰罗尼亚大佣兵团宣言"
 oe_lat_emp.2.desc:0 "自1311年哈尔米罗斯之战击溃法兰克重骑以来，铁血顽强的加泰罗尼亚大佣兵团高擎圣乔治旗与阿拉贡红黄条纹旗统治着底比斯、雅典与新帕特雷。如今诸队长在雅典卫城前激辩公国前程：是紧密联结阿拉贡—西西里王室打通地中海霸权走廊，还是宣告独立自主的加泰罗尼亚雇佣兵军政公国？"
 oe_lat_emp.2.a:0 "效忠阿拉贡—西西里王室，贯通西地中海大通道"
 oe_lat_emp.2.b:0 "钢铁觉醒！宣告独立自主的加泰罗尼亚佣兵军政公国"
 oe_lat_emp.3.title:0 "塞浦路斯与奇里乞亚十字军盟约"
 oe_lat_emp.3.desc:0 "隔着狭窄的奇里乞亚海峡，塞浦路斯吕西尼昂王朝与奇里乞亚亚美尼亚海屯王朝世代联姻、唇齿相依，共同屹立在黎凡特基督教世界最前线。面对马穆鲁克大军与突厥舰队的觊觎，两国宫廷商议：是正式缔结攻守同盟的海外十字军联防契约，还是合力兴建法马古斯塔—阿亚斯丝路自由商埠？"
 oe_lat_emp.3.a:0 "缔结吕西尼昂—海屯海外十字军联防盟约"
 oe_lat_emp.3.b:0 "兴建法马古斯塔—阿亚斯丝绸香料商埠"
 oe_lat_emp.4.title:0 "圣索菲亚大教堂加冕：拉丁帝国复辟"
 oe_lat_emp.4.desc:0 "金角湾两岸钟声齐鸣，红底金十字皇旗再度高悬圣索菲亚大教堂大理石长廊。自1261年鲍德温二世出走以来，拉丁皇帝首次重新君临万城之母。新皇将如何向全欧与希腊东方昭告罗马尼亚帝国的复辟——以威严赫赫的拉丁十字军皇冠震慑四方，还是颁行拉丁—希腊双语共融帝宪？"
 oe_lat_emp.4.a:0 "承袭鲍德温与亨利皇冕，以无上拉丁帝威震慑四方！"
 oe_lat_emp.4.b:0 "颁行拉丁—希腊双语帝宪，抚绥君士坦丁堡军民"
 oe_lat_emp.5.title:0 "帝国分割采邑授封：塞萨洛尼基王国"
 oe_lat_emp.5.desc:0 "在帝国金阶之前，新任拉丁塞萨洛尼基领主依1204年旧制宣誓效忠，受领马其顿与塞萨洛尼基湾广袤疆域。皇廷将把这座北方大采邑定性为守卫埃格纳提亚大道的铁甲边防军镇，还是以商港农垦与宽容治理为重的阿萨伊斯采邑？"
 oe_lat_emp.5.a:0 "定为马其顿骑士边防军镇"
 oe_lat_emp.5.b:0 "定为商港农垦与宽容共治采邑"
 oe_lat_emp.6.title:0 "帝国分割采邑授封：摩里亚与雅典公国"
 oe_lat_emp.6.desc:0 "传令官高声宣读帝国册封诏书，重整伯罗奔尼撒、阿提卡与爱琴海诸岛的南希腊大采邑。依循《罗马尼亚阿萨伊斯法典》，这座新立大采邑将以法兰克—加泰罗尼亚堡垒重骑为先，还是推行希腊执政官与海港市民共荣之政？"
 oe_lat_emp.6.a:0 "以法兰克—加泰罗尼亚堡垒重骑镇守赫拉斯"
 oe_lat_emp.6.b:0 "授予执政官与爱琴海商会宽容特许"
 oe_lat_emp.7.title:0 "帝国分割采邑授封：尼西亚与安纳托利亚公国"
 oe_lat_emp.7.desc:0 "跨越马尔马拉海，比提尼亚、尼西亚与士麦那的沃野尽归拉丁帝国分割条约大采邑麾下，圆了当年佛兰德斯的亨利皇帝未能竟成的东方宏愿。皇廷是将尼西亚公国建为抵御安纳托利亚高原的铁血前线军镇，还是重开丝绸海贸与教区归化的繁荣行省？"
 oe_lat_emp.7.a:0 "建为尼西亚安纳托利亚铁骑前线"
 oe_lat_emp.7.b:0 "兴办马尔马拉丝贸与行省教区融汇"
 oe_lat_emp.8.title:0 "帝国分割采邑授封：海外安条克公国"
 oe_lat_emp.8.desc:0 "自奇里乞亚关隘直抵安条克石城与黎凡特海岸，海外十字军红十字旗再度在拉丁帝国宗主权下冉冉升起。这座最东端的海外大采邑是以常备圣战军镇捍卫圣地，还是重开朝圣航道与东方香料商港？"
 oe_lat_emp.8.a:0 "筑牢安条克与黎凡特十字军要塞军镇"
 oe_lat_emp.8.b:0 "重开黎凡特朝圣商港与香料贸易"
 oe_lat_emp.9.title:0 "天主教三方十字军大公会议"
 oe_lat_emp.9.desc:0 "身披罗得岛红底白十字、马林堡白袍黑十字的骑士团使节与罗马教廷枢机特使齐聚宫廷，与拉丁罗马尼亚旗帜并列。拉丁帝国、医院骑士团与德意志骑士团共商欧陆与地中海大战略：是立刻启动陆海协同大十字军攻势，还是设立常设三方海权舰队与圣战金库联盟？"
 oe_lat_emp.9.a:0 "誓师出征：发动天主教三方陆海联合大十字军！"
 oe_lat_emp.9.b:0 "共建三方常备地中海联合舰队与圣战金库"
 oe_lat_emp.10.title:0 "《罗马尼亚阿萨伊斯法典》大议会"
 oe_lat_emp.10.desc:0 "各地男爵、执事与海港市政代表齐聚一堂，修订久负盛名的《罗马尼亚帝国习惯法汇编》（阿萨伊斯法典）。明文确立法兰克采邑与市镇自治将深得贵族、市民与诸封邑拥戴；委任王室领薪执事则能强化中央集权与直属税收。"
 oe_lat_emp.10.a:0 "明文编纂男爵与市镇特许法权，安抚诸阶层"
 oe_lat_emp.10.b:0 "广设王室直属领薪执事，加强中枢税政控御"
 oe_lat_emp.11.title:0 "威尼斯—拉丁爱琴海商贸协定"
 oe_lat_emp.11.desc:0 "来自莫顿、科隆、干地亚与内格罗蓬特的威尼斯总管提出全面爱琴海商约：减免圣马可商船港税，换取威尼斯银行信贷、舰队护航与繁盛转口贸易。然而本国船主呼吁摆脱威尼斯掣肘，兴建自主可控的拉丁皇家船坞。"
 oe_lat_emp.11.a:0 "批准威尼斯爱琴海商贸协定，共兴东西海运"
 oe_lat_emp.11.b:0 "拒绝关税让步，自主扩建拉丁皇家船坞"
 oe_lat_emp.12.title:0 "希腊执政官与教区和解之议"
 oe_lat_emp.12.desc:0 "辖内各地的希腊执政官世家与东正教修院院长联名上书，恳请王座确认其田产契据、设置双语法官并保障仪轨自由。接纳本土希腊名门将换来长治久安与充沛赋税，而坚守法兰克—拉丁骑士特权则能激励十字军斗志与天主教传教。"
 oe_lat_emp.12.a:0 "颁授希腊执政官特许状与东正教礼仪自治"
