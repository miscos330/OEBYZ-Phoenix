 OE_LAT_SIT_LEGEND_TITLE:0 "爱琴海与海峡战区图例"
 OE_LAT_SIT_LEGEND_DESC:0 "国家本色：复辟拉丁帝国；绿色：法兰克希腊诸邦、塞浦路斯、奇里乞亚、罗得岛与拉丁大采邑；琥珀色：拜占庭帝国与地中海观望诸国；红色：奥斯曼与安纳托利亚诸贝伊国阵营。"
 oe_lat_sit_map_lat_tt:0 "复辟的拉丁帝国（Imperium Romaniae）。"
 oe_lat_sit_map_fief_tt:0 "受封于《帝国分割条约》的拉丁罗马尼亚大采邑。"
 oe_lat_sit_map_frank_tt:0 "为爱琴海拉丁存续与复辟而战的十字军诸邦。"
 oe_lat_sit_map_byz_tt:0 "致力于光复希腊与爱琴海的拜占庭阵营。"
 oe_lat_sit_map_tur_tt:0 "向爱琴海与巴尔干扩张的奥斯曼及安纳托利亚诸贝伊国。"
 oe_lat_sit_map_nbr_tt:0 "密切注视爱琴海局势的意大利、伊比利亚与教廷诸邦。"
 oe_msn_59_lat:0 "#bold #color_yellow 法兰克希腊与拉丁帝国：爱琴海十字复辟#!#!"
 oe_msn_59_lat_DESCRIPTION:0 "自亚该亚、加泰罗尼亚雅典、纳克索斯、内格罗蓬特、塞浦路斯与奇里乞亚起势，光复君士坦丁堡、重订帝国分割大采邑、挺进海外圣地并缔结天主教三方十字军同盟"
 oe_msn_59_lat_CRITERIA_DESCRIPTION:0 "一统拉丁希腊并击破安纳托利亚贝伊国、在君士坦丁堡复辟拉丁帝国并分封大采邑、贯通加泰罗尼亚—海外圣地与三方十字军同盟，最终成就永恒拉丁罗马尼亚盛世。"
 oe_msn_59_lat_BUTTON_TOOLTIP:0 "开启法兰克希腊与拉丁帝国复辟天命线"
 oe_msn_59_lat_BUTTON_DETAILS:0 "面向亚该亚、雅典、纳克索斯、内格罗蓬特、凯法利尼亚、塞浦路斯、奇里乞亚与拉丁帝国的四支十六阶旗舰任务树：破局爱琴海危局、复辟拉丁帝国与大采邑、开辟加泰罗尼亚—安条克圣战线，并缔造拉丁—希腊永续共荣。"
 oe_lat_law_assizes_romania:0 "罗马尼亚阿萨伊斯法典"
 oe_lat_law_assizes_romania_desc:0 "编纂法兰克希腊与拉丁帝国的封建习惯法典：确立王国政体是以世袭拉丁男爵采邑为本、推行希腊执政官双语共治，抑或颁行爱琴海商埠特许宪章。"
 oe_lat_pol_frankish_baronial_fiefs:0 "法兰克男爵采邑制"
 oe_lat_pol_frankish_baronial_fiefs_desc:0 "严守《阿萨伊斯法典》十二大男爵封邑与骑士效忠礼，稳固拉丁附庸忠诚、山堡防务与重骑战力。"
 oe_lat_pol_greek_archon_cogovernance:0 "希腊执政官共治法"
 oe_lat_pol_greek_archon_cogovernance_desc:0 "吸纳希腊本土执政官与乡绅名望进入行省法庭与税籍署，全面提升最高控制、税收效率、国家稳定与异派宽容。"
 oe_lat_pol_maritime_merchant_charters:0 "爱琴海商埠特许宪章"
 oe_lat_pol_maritime_merchant_charters_desc:0 "向爱琴海诸港的拉丁、威尼斯、加泰罗尼亚与希腊船主商会颁授自治关税特许状，激发海贸活力与海上存在。"
 oe_lat_law_company_levies:0 "佣兵团与拉丁骑士兵制法"
 oe_lat_law_company_levies_desc:0 "确立拉丁希腊与拉丁帝国的军事中坚体制：在常备加泰罗尼亚大佣兵团、法兰克—安茹精锐重骑与爱琴海私掠桨帆舰队之间择定军制。"
 oe_lat_pol_catalan_grand_company:0 "常备加泰罗尼亚大佣兵团"
 oe_lat_pol_catalan_grand_company_desc:0 "将百战加泰罗尼亚阿尔莫加瓦尔步兵与特许雇佣团编为常备劲旅，大幅削减雇佣军维护并提升野战士气与攻城能力。"
 oe_lat_pol_franco_angevin_vanguard:0 "法兰克—安茹骑士精锐先遣"
 oe_lat_pol_franco_angevin_vanguard_desc:0 "按西欧骑士名门之制整训法兰西、普瓦图与那不勒斯重甲枪骑兵团，铸就铁律军纪与重骑突击威仪。"
 oe_lat_pol_aegean_corsair_fleet:0 "爱琴海私掠与桨帆舰队制"
 oe_lat_pol_aegean_corsair_fleet_desc:0 "整合纳克索斯、内格罗蓬特与塞浦路斯船坞及特许基督教私掠舰队，全面增强桨帆战力、海军士气与水手兵源。"
 oe_lat_law_church_union:0 "爱琴海东西教会统合法"
 oe_lat_law_church_union_desc:0 "规范拉丁君主对待辖内东正教希腊与东方基督徒多数族群的宗教国策：严推拉丁化改宗、缔结东方礼共融折中宪章，或保障希腊大都会主教自治。"
 oe_lat_pol_strict_latinization:0 "严格拉丁化改宗法"
 oe_lat_pol_strict_latinization_desc:0 "大力资助多明我会与方济各会修院深入希腊与安纳托利亚传教，加快天主教改宗与教廷好感，但加剧异派摩擦。"
 oe_lat_pol_uniate_rite_compromise:0 "东方礼共融折中宪章"
 oe_lat_pol_uniate_rite_compromise_desc:0 "允许希腊礼与亚美尼亚礼在罗马共融下延续传统仪轨，兼得异派宽容、外交声誉与平稳行政整合。"
 oe_lat_pol_autonomous_greek_metropolitans:0 "希腊大都会主教自治法"
 oe_lat_pol_autonomous_greek_metropolitans_desc:0 "以宪章保障东正教大都会教座与修院财产自治换取臣民效忠，显著压制分离主义并激发地方繁荣。"
 OE_LAT_FIEF_THESSALONICA:0 "拉丁塞萨洛尼基采邑"
 OE_LAT_FIEF_THESSALONICA_ADJ:0 "拉丁塞萨洛尼基"
 OE_LAT_FIEF_MOREA:0 "摩里亚法兰克采邑"
 OE_LAT_FIEF_MOREA_ADJ:0 "摩里亚法兰克"
 OE_LAT_FIEF_ATHENS:0 "雅典赫拉斯采邑"
 OE_LAT_FIEF_ATHENS_ADJ:0 "雅典拉丁"
 OE_LAT_FIEF_NICAEA:0 "尼西亚拉丁采邑"
