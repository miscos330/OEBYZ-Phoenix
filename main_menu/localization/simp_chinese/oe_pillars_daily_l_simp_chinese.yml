l_simp_chinese:
 oe_pillars_daily.1.t: "豪族侵吞土地"
 oe_pillars_daily.1.d: "[SCOPE.sLocation('oe_daily_location').GetName]的农户将旧契呈到御前：[SCOPE.sDynasty('oe_daily_family').GetName]家族的管事正在重划田界，声称相邻的田亩原属本家。地方官查过地籍，却迟迟不肯落印。[SCOPE.sCharacter('oe_daily_head').GetName]的来信则提醒朝廷，这一家在当地自有多年经营的人情与声望。如今田契与家书一同摆上御案，等候裁断。"
 oe_pillars_daily.1.a: "按旧籍划界，命其停止侵占。"
 oe_pillars_daily.1.a.tt: "#R 权威 −1#!；#R [SCOPE.sDynasty('oe_daily_family').GetName]家族影响力 −10#!。阻止此次扩张。"
 oe_pillars_daily.1.b: "由内帑赎回争议田契，保全农户。"
 oe_pillars_daily.1.b.tt: "#R 内帑支出1个月收入（[SCOPE.GetValue('oe_daily_months_1')|2][gold_i]）#!。阻止此次扩张；须有足额内帑。"
 oe_pillars_daily.1.c: "准许重定田界，不再追究。"
 oe_pillars_daily.1.c.tt: "#R 民意 −2#!；[SCOPE.sDynasty('oe_daily_family').GetName]家族取得#R [SCOPE.sLocation('oe_daily_location').GetName]的土地控制#!。"
 oe_pillars_daily.2.t: "首都市民抗议"
 oe_pillars_daily.2.d: "首都官署前聚起了人群。面包铺的价钱、积压的诉状与吏员索取的杂费，被一项项喊给守卫听。街坊推来的代表坚持要见能作主的人；官员担心，若宫门始终不作回应，抱怨很快便会变成冲突。"
 oe_pillars_daily.2.a: "驱散他们。"
 oe_pillars_daily.2.a.tt: "#R 民意 -2#!。"
 oe_pillars_daily.2.b: "解决他们的诉求。"
 oe_pillars_daily.2.b.tt: "#R 内帑支出3个月收入（[SCOPE.GetValue('oe_daily_months_3')|2][gold_i]）#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.2.c: "清查[SCOPE.sDynasty('oe_daily_family').GetName]家族在首都控制的产业。"
 oe_pillars_daily.2.c.tt: "#R 权威 −1#!。移除[SCOPE.sDynasty('oe_daily_family').GetName]家族在首都的一层产业控制，其他家族的控制不受影响。"
 oe_pillars_daily.3.t: "迟来的粮船"
 oe_pillars_daily.3.d: "本该抵港的粮船仍无消息。磨坊主争购余粮，面包铺外的队伍逐日加长。港务官只能保证船只尚未报失，却说不出谷物何时入仓。御座若要稳住粮价，便须在市面耗尽存粮之前另作安排。"
 oe_pillars_daily.3.a: "由内帑购粮，平价出售。"
 oe_pillars_daily.3.a.tt: "#R 内帑支出2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。\n#G 民意 +1#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.3.b: "接受[SCOPE.sDynasty('oe_daily_family').GetName]家族的平粜提议。"
 oe_pillars_daily.3.b.tt: "#R [SCOPE.sDynasty('oe_daily_family').GetName]家族影响力 −30#!；该家取得#R [SCOPE.sLocation('oe_daily_location').GetName]的土地控制#!；#G 民意 +1#!。不支出内帑。"
 oe_pillars_daily.3.c: "等船到了，一切都会平息。"
 oe_pillars_daily.3.c.tt: "#R 民意 -2#!。"
 oe_pillars_daily.4.t: "老兵叩阙"
 oe_pillars_daily.4.d: "宫门外来了几名退役军士，手中仍留着当年的军籍与欠饷凭据。战事已歇，他们却无田可耕，也没有足以养家的积蓄。核查文书的官员确认这些人确曾服役；朝廷如今需要决定，是清偿旧欠，还是为他们另寻生计。"
 oe_pillars_daily.4.a: "他们为罗马流过血。"
 oe_pillars_daily.4.a.tt: "#R 内帑支出2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。\n#G 民意 +1#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.4.b: "由[SCOPE.sDynasty('oe_daily_family').GetName]家族安置这些老兵。"
 oe_pillars_daily.4.b.tt: "#G [SCOPE.sDynasty('oe_daily_family').GetName]家族影响力 +50#!；#G 民意 +1#!。由该家现有农村庄田安置，不支出内帑，不新增地点控制。"
 oe_pillars_daily.4.c: "军籍已经注销，朝廷不再欠他们什么。"
 oe_pillars_daily.4.c.tt: "#R 民意 -2#!。"
 oe_pillars_daily.5.t: "丰年"
 oe_pillars_daily.5.d: "各地送来的收成簿上，终于多了几行令人宽慰的数字。雨水适时，谷穗饱满，打谷场上堆起的新粮足以填补往年的亏空。农户盼着留些余粮修整屋舍，庄园管事则已备好向御座报喜的文书。这份难得的丰足，该如何分配？"
 oe_pillars_daily.5.a: "让农户留下这份余粮。"
 oe_pillars_daily.5.a.tt: "#G 民意 +2#!。"
 oe_pillars_daily.5.b: "诸庄园可向御座进献一份薄礼。"
 oe_pillars_daily.5.b.tt: "#G 内帑增加2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。"
 oe_pillars_daily.5.c: "将丰收的消息传遍诸城。"
 oe_pillars_daily.5.c.tt: "#G 权威 +1#!。\n#G 威望 +3#!。"
 oe_pillars_daily.6.t: "行会的庆典"
 oe_pillars_daily.6.d: "城中的行会准备合办一场庆典，彩布与灯油已经购齐，争执却出在游行的次序上。金匠不愿跟在织工身后，船主又坚持自己的旗帜应当靠近官员的席位。市民等着看热闹，行会长们则把这场体面之争带到了宫廷。"
 oe_pillars_daily.6.a: "由宫廷裁定次序，照常举行。"
 oe_pillars_daily.6.a.tt: "#R 权威 -1#!。\n#G 民意 +2#!。"
 oe_pillars_daily.6.b: "内帑添一份钱，给每家留足位置。"
 oe_pillars_daily.6.b.tt: "#R 内帑支出1个月收入（[SCOPE.GetValue('oe_daily_months_1')|2][gold_i]）#!。\n#G 民意 +2#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.6.c: "既然谁也不肯退让，那就取消。"
 oe_pillars_daily.6.c.tt: "#R 民意 -1#!。"
 oe_pillars_daily.7.t: "修院施粥"
 oe_pillars_daily.7.d: "修院门前支起了大锅，修士们用捐来的粮食为贫民熬粥。起初只有附近的孤寡前来，如今失去生计的工匠也排进了队伍。市民感念这份救济，却也有人问：为何最先打开仓门的不是皇帝的官署？修院的存粮已经不多，院长送来了求助的书信。"
 oe_pillars_daily.7.a: "以皇帝的名义追加赈济。"
 oe_pillars_daily.7.a.tt: "#R 内帑支出1个月收入（[SCOPE.GetValue('oe_daily_months_1')|2][gold_i]）#!。\n#G 民意 +3#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.7.b: "善行应当得到公开嘉许。"
 oe_pillars_daily.7.b.tt: "#G 民意 +1#!。\n#G 教士阶层满意度 +3%#!。"
 oe_pillars_daily.7.c: "由官署接办，救济不能只靠修士。"
 oe_pillars_daily.7.c.tt: "#G 权威 +1#!。\n#R 教士阶层满意度 -3%#!。"
 oe_pillars_daily.8.t: "账册中的破绽"
 oe_pillars_daily.8.d: "一名书记在核对旧账时，发现同一批木料被重复支取了货款。顺着几处涂改追查下去，一笔藏在虚报开支中的款项终于被追回。涉事的吏员已被看管，钱袋也摆上了案头。现在只待一道命令，决定这笔意外收回的钱该送往何处。"
 oe_pillars_daily.8.a: "将钱送回内帑。"
 oe_pillars_daily.8.a.tt: "#G 内帑增加2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。"
 oe_pillars_daily.8.b: "偿付那些被拖欠货款的商人与工匠。"
 oe_pillars_daily.8.b.tt: "#G 民意 +2#!。"
 oe_pillars_daily.8.c: "赏赐查案者，将此案公布于众。"
 oe_pillars_daily.8.c.tt: "#G 权威 +1#!。"
 oe_pillars_daily.9.t: "豪族献金"
 oe_pillars_daily.9.d: "[SCOPE.sDynasty('oe_daily_family').GetName]家族遣使送来数匣金币。[SCOPE.sCharacter('oe_daily_head').GetName]在信中称，帝廷用度繁重，本家愿尽臣属之责。随礼另附一张便笺，列着地方官近日查核的几处产业。使者并不明说所求，只盼御座记住这份忠诚，并让家族在朝野之间多得几分体面。"
 oe_pillars_daily.9.a: "收下献金，公开嘉许其忠诚。"
 oe_pillars_daily.9.a.tt: "#G 权威 +1#!；#G 内帑增加3个月收入（[SCOPE.GetValue('oe_daily_months_3')|2][gold_i]）#!；#G [SCOPE.sDynasty('oe_daily_family').GetName]家族影响力 +50#!。"
 oe_pillars_daily.9.b: "献金留下，允诺之事暂且搁置。"
 oe_pillars_daily.9.b.tt: "#G 内帑增加3个月收入（[SCOPE.GetValue('oe_daily_months_3')|2][gold_i]）#!；#R 权威 −1#!；#R 贵族阶层满意度 −3%#!。"
 oe_pillars_daily.9.c: "退还献金，地方查核照常进行。"
 oe_pillars_daily.9.c.tt: "#G 权威 +1#!；#R [SCOPE.sDynasty('oe_daily_family').GetName]家族影响力 −15#!。"
 oe_pillars_daily.10.t: "水渠决口"
 oe_pillars_daily.10.d: "乡间的一段水渠在夜里决口，泥水冲坏了道路，也截断了下游田地的水源。沿渠庄园相互推诿，都说失修的渠段不归自己照管。工匠已经估出修复所需的人手与石料；若再拖延，眼前的一处缺口便会变成整片田野的损失。"
 oe_pillars_daily.10.a: "立即拨款修复。"
 oe_pillars_daily.10.a.tt: "#R 内帑支出2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。\n#G 民意 +1#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.10.b: "让沿渠庄园共同承担。"
 oe_pillars_daily.10.b.tt: "#R 权威 -1#!。"
 oe_pillars_daily.10.c: "先作临时堵塞，来年再修。"
 oe_pillars_daily.10.c.tt: "#R 民意 -2#!。"
 oe_pillars_daily.11.t: "宫廷用度之争"
 oe_pillars_daily.11.d: "来访使节将至，礼官呈上织物、银器与宴席的清单。掌账者却将未付的账单一并送来，提醒御座宫廷的体面终究须以真金支付。是依旧例接待，还是铺陈一场足以使异邦记住罗马的盛宴，已到了必须落笔的时候。"
 oe_pillars_daily.11.a: "让使节见识罗马的气度。"
 oe_pillars_daily.11.a.tt: "#R 内帑支出2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。\n#G 权威 +1#!。\n#G 威望 +5#!。\n费用按事件出现时的内帑月收入计算，内帑余额不足时无法选择。"
 oe_pillars_daily.11.b: "照旧例办，不必另添排场。"
 oe_pillars_daily.11.b.tt: "#G 威望 +1#!。"
 oe_pillars_daily.11.c: "裁减宴席，把节省的钱用于市民救济。"
 oe_pillars_daily.11.c.tt: "#R 权威 -1#!。\n#G 民意 +2#!。"
 oe_pillars_daily.12.t: "归来的商旅"
 oe_pillars_daily.12.d: "一队远行的商旅平安归来，带回了异乡的货物，也带回了沿途市镇与港口的消息。为感谢官署颁发的通行文书，他们向宫廷献上一笔钱财。随行的商人还提到，几处驿舍亟待修缮；若愿听他们细说，旅途中的见闻也足以让来访使节听上许久。"
 oe_pillars_daily.12.a: "将献金收入内帑。"
 oe_pillars_daily.12.a.tt: "#G 内帑增加2个月收入（[SCOPE.GetValue('oe_daily_months_2')|2][gold_i]）#!。"
 oe_pillars_daily.12.b: "用它修缮商路上的驿舍。"
 oe_pillars_daily.12.b.tt: "#G 民意 +1#!。\n#G 市民阶层满意度 +3%#!。"
 oe_pillars_daily.12.c: "召他们入宫，向使节讲述旅途见闻。"
 oe_pillars_daily.12.c.tt: "#G 权威 +1#!。\n#G 威望 +3#!。"
 oe_pillars_daily.2.d.house: "首都官署前聚起了人群。面包铺的价钱、积压的诉状与吏员索取的杂费，被一项项喊给守卫听。街坊推来的代表坚持要见能作主的人；官员担心，若宫门始终不作回应，抱怨很快便会变成冲突。诉状中屡次提到[SCOPE.sDynasty('oe_daily_family').GetName]家族把持的作坊与铺面。[SCOPE.sCharacter('oe_daily_head').GetName]的门客坚持一切皆有契据，市民却要求朝廷先解除这些产业上的私家控制。"
 oe_pillars_daily.3.d.house: "本该抵港的粮船仍无消息。磨坊主争购余粮，面包铺外的队伍逐日加长。港务官只能保证船只尚未报失，却说不出谷物何时入仓。御座若要稳住粮价，便须在市面耗尽存粮之前另作安排。[SCOPE.sDynasty('oe_daily_family').GetName]家族愿调出庄园存粮，约束门客按平价出售；作为回报，他们请求获准经营[SCOPE.sLocation('oe_daily_location').GetName]的田产。[SCOPE.sCharacter('oe_daily_head').GetName]已将价目与田契一同呈上。"
 oe_pillars_daily.4.d.house: "宫门外来了几名退役军士，手中仍留着当年的军籍与欠饷凭据。战事已歇，他们却无田可耕，也没有足以养家的积蓄。核查文书的官员确认这些人确曾服役；朝廷如今需要决定，是清偿旧欠，还是为他们另寻生计。[SCOPE.sDynasty('oe_daily_family').GetName]家族在[SCOPE.sLocation('oe_daily_location').GetName]拥有庄田，愿接纳这些老兵及其家属。[SCOPE.sCharacter('oe_daily_head').GetName]的管事许诺提供住处、种粮与农具，但日后这些军士也将成为这家庄园的佃户和故旧。"
 oe_pillars_daily.11.d.house: "来访使节将至，礼官呈上织物、银器与宴席的清单。掌账者却将未付的账单一并送来，提醒御座宫廷的体面终究须以真金支付。是依旧例接待，还是铺陈一场足以使异邦记住罗马的盛宴，已到了必须落笔的时候。[SCOPE.sDynasty('oe_daily_family').GetName]家族另有提议：由本家承担添置银器与宴席的费用，只请在宴上为[SCOPE.sCharacter('oe_daily_head').GetName]保留显要席次，让来使也知晓谁在为皇座分忧。"
 oe_pillars_daily.11.d_option: "准许[SCOPE.sDynasty('oe_daily_family').GetName]家族赞助宴会。"
 oe_pillars_daily.11.d.tt: "#G 威望 +3#!；#G [SCOPE.sDynasty('oe_daily_family').GetName]家族影响力 +10#!。不支出内帑。"
