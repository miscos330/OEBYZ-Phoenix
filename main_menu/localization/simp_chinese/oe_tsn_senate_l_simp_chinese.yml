l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_tsn_war_levy: "战时征召"
 STATIC_MODIFIER_DESC_oe_tsn_war_levy: "元老院批准了为本次征伐加派兵员和粮饷。征伐结束时取消，最长5年。"
 OE_TSN_RESULT_PASS: "表决结果：议案通过。"
 OE_TSN_RESULT_FAIL: "表决结果：议案被否决。皇帝可以接受，也可以花5帝国权威强行通过。"
 oe_tsn_hist: "拜占庭的元老院（synkletos）一直延续到帕列奥列格时代，但那时它是首都高级显贵的集合，并非由各地选派。本作让特许城邦、总督区和宗室封邑在元老院占有席位，这是游戏化的创作，参照的是罗马自治市的市议会和意大利城邦的议会传统。"
 oe_tsn_rules: "席位：每个特许城邦2席，每个总督区和宗室封邑各1席，豪族名册上每家1席，每位在任宫廷官员1席。行省按忠诚和地位投票（特许城邦反对加征），豪族按影响力和是否为皇帝的政治盟友投票，官员按对皇帝的忠诚和所属阶层的满意度投票。赞成多于反对即通过；否决时，皇帝可以花5帝国权威强行通过，投反对票的行省忠诚 −10（计入忠诚目标5年），投反对票的豪族影响力 −25。"
 oe_tsn_tally: "赞成[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes').GetValue|0]席：特许城邦[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_c').GetValue|0]，总督区与封邑[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_t').GetValue|0]，豪族[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_h').GetValue|0]，宫廷官员[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_yes_o').GetValue|0]。\n反对[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no').GetValue|0]席：特许城邦[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_c').GetValue|0]，总督区与封邑[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_t').GetValue|0]，豪族[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]，宫廷官员[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_o').GetValue|0]。\n\n[GetCountry('BYZ').Custom('OeTsnResult')]"
 oe_tsn_levy_request: "提请加征贡金"
 oe_tsn_levy_request_desc: "请元老院议决加征贡金：若通过，总督区、特许城邦和宗室封邑在5年内多缴月收入的5%作为贡金；投反对票的特许城邦只多缴一半。提请时花费2帝国权威，此后10年内不能再提。\n\n元老院现有[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_seats_now').GetValue|0]席。$oe_tsn_rules$\n\n$oe_tsn_hist$"
 oe_tsn_levy_request.tt: "−2帝国权威\n元老院对加征贡金进行表决，10年内不能再提"
 oe_tsn_allow_auth: "帝国权威至少为2"
 oe_tsn_allow_cd: "距上次提请加征已满10年"
 oe_tsn_allow_active: "目前没有生效中的额外贡金"
 oe_tsn_allow_idle: "元老院没有待表决的议案"
 oe_tsn.1.d1: "$oe_tsn_hist$\n\n皇帝提请元老院议决：加征贡金。若通过，总督区、特许城邦和宗室封邑在5年内多缴月收入的5%作为贡金；投反对票的特许城邦只多缴一半。\n\n$oe_tsn_tally$"
 oe_tsn.1.d2: "$oe_tsn_hist$\n\n皇帝提请元老院议决：战时征召。新的征伐已经开始，皇帝要求各地为这场战争加派兵员和粮饷。若通过，本次征伐期间（最长5年）帝国陆军士气 +5%，人力 +10%，每月厌战 −0.05。\n\n$oe_tsn_tally$"
 oe_tsn.1.d3: "$oe_tsn_hist$\n\n皇帝提请元老院议决：设省。皇帝提议把附庸国[SCOPE.sCountry('oe_tsn_target').GetName]并入帝国，改设行省。\n\n$oe_tsn_tally$"
 oe_tsn.1.d4: "$oe_tsn_hist$\n\n皇帝提请元老院议决：授予罗马法统。皇帝提议授予[SCOPE.sCountry('oe_tsn_target').GetName]罗马法统，使之成为帝国的内地行省。\n\n$oe_tsn_tally$"
 oe_tsn.1.d: "$oe_tsn_hist$\n\n皇帝提请元老院议决一项议案。\n\n$oe_tsn_tally$"
 oe_tsn.1.t: "元老院表决"
 oe_tsn.1.a1: "照议执行"
 oe_tsn.1.a1.tt: "额外贡金：总督区、特许城邦和宗室封邑在5年内多缴月收入的5%作为贡金；投反对票的特许城邦只多缴一半（投反对票的特许城邦：[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]个）"
 oe_tsn.1.b1: "接受否决"
 oe_tsn.1.b1.tt: "不加征贡金。10年内不能再提此议"
 oe_tsn.1.c1: "强行通过"
 oe_tsn.1.c1.tt: "−5帝国权威\n投反对票的每个行省（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]个总督区或封邑、[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]个特许城邦）忠诚 −10（计入忠诚目标5年）\n投反对票的每个豪族（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]家）影响力 −25\n额外贡金：总督区、特许城邦和宗室封邑在5年内多缴月收入的5%作为贡金；投反对票的特许城邦只多缴一半（投反对票的特许城邦：[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]个）"
 oe_tsn.1.a2: "照议执行"
 oe_tsn.1.a2.tt: "获得“战时征召”，直到本次征伐结束（最长5年）：陆军士气 +5%，人力 +10%，每月厌战 −0.05"
 oe_tsn.1.b2: "接受否决"
 oe_tsn.1.b2.tt: "各地行省议论纷纷，但没有其他效果"
 oe_tsn.1.c2: "强行通过"
 oe_tsn.1.c2.tt: "−5帝国权威\n投反对票的每个行省（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]个总督区或封邑、[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]个特许城邦）忠诚 −10（计入忠诚目标5年）\n投反对票的每个豪族（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]家）影响力 −25\n获得“战时征召”，直到本次征伐结束（最长5年）：陆军士气 +5%，人力 +10%，每月厌战 −0.05"
 oe_tsn.1.a3: "照议执行"
 oe_tsn.1.a3.tt: "设省议案生效，按设省行动的说明执行"
 oe_tsn.1.b3: "接受否决"
 oe_tsn.1.b3.tt: "设省议案作废"
 oe_tsn.1.c3: "强行通过"
 oe_tsn.1.c3.tt: "−5帝国权威\n投反对票的每个行省（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]个总督区或封邑、[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]个特许城邦）忠诚 −10（计入忠诚目标5年）\n投反对票的每个豪族（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]家）影响力 −25\n设省议案生效，按设省行动的说明执行"
 oe_tsn.1.a4: "照议执行"
 oe_tsn.1.a4.tt: "授予罗马法统的议案生效，按该行动的说明执行"
 oe_tsn.1.b4: "接受否决"
 oe_tsn.1.b4.tt: "授予罗马法统的议案作废"
 oe_tsn.1.c4: "强行通过"
 oe_tsn.1.c4.tt: "−5帝国权威\n投反对票的每个行省（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]个总督区或封邑、[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]个特许城邦）忠诚 −10（计入忠诚目标5年）\n投反对票的每个豪族（[GetCountry('BYZ').MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]家）影响力 −25\n授予罗马法统的议案生效，按该行动的说明执行"
 oe_tsn.1.x: "知道了"
 oe_tsn.1.x.tt: "没有待表决的议案，没有其他效果。"
