l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_tsn_war_levy: "战时征召"
 STATIC_MODIFIER_DESC_oe_tsn_war_levy: "[oe_tu_senate|e]批准了为本次征伐加派兵员和粮饷。征伐结束时取消，最长#Y 5#!年。"
 OE_TSN_RESULT_PASS: "表决结果：议案#G 通过#!。"
 OE_TSN_RESULT_FAIL: "表决结果：议案#R 被否决#!。皇帝可以接受，也可以花#R 5#![oe_tu_authority|e]强行通过。"
 OE_TSN_DELEGATION_ON: "\n#T 四大近卫大区代表团席位上限已启用#!：每个大区最多派出#Y 4#!席（行省合计至多#Y 16#!席，平衡中央#Y 11#!席）。"
 oe_tsn_tally: "赞成#G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes').GetValue|0]#!席：[oe_tu_charter|e]#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_c').GetValue|0]#!，[oe_tu_exarchate|e]与封邑#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_t').GetValue|0]#!，豪族#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_h').GetValue|0]#!，宫廷官员#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_yes_o').GetValue|0]#!。\n反对#R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no').GetValue|0]#!席：特许城邦#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_c').GetValue|0]#!，总督区与封邑#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_t').GetValue|0]#!，豪族#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!，宫廷官员#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_o').GetValue|0]#!。[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnDelegationNote')]\n\n[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnResult')]"
 oe_tsn_levy_request: "提请加征贡金"
 oe_tsn_levy_request_desc: "请元老院议决加征贡金。若通过，[oe_tu_exarchate|e]、[oe_tu_charter|e]和宗室封邑在#Y 5#!年内多缴月收入的#G 5%#!作为贡金；投反对票的特许城邦只多缴一半。\n\n提请时花费#R 2#![oe_tu_authority|e]，此后#Y 10#!年内不能再提。\n\n[oe_tu_senate|e]现有#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_seats_value')|0]#!席（悬停查看席位与计票规则）。[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnDelegationNote')]\n$oe_tsn_pv_1$"
 oe_tsn_levy_request.tt: "#R −2#![oe_tu_authority|e]\n[oe_tu_senate|e]对加征贡金进行表决，#Y 10#!年内不能再提"
 oe_tsn_allow_auth: "[oe_tu_authority|e]至少为#Y 2#!"
 oe_tsn_allow_cd: "距上次提请加征已满#Y 10#!年"
 oe_tsn_allow_active: "目前没有生效中的额外贡金"
 oe_tsn_allow_idle: "元老院没有待表决的议案"
 oe_tsn.1.d1: "皇帝提请[oe_tu_senate|e]议决：#bold #color_yellow 加征贡金#!#!。若通过，[oe_tu_exarchate|e]、[oe_tu_charter|e]和宗室封邑在#Y 5#!年内多缴月收入的#G 5%#!作为贡金；投反对票的特许城邦只多缴一半。\n\n$oe_tsn_tally$"
 oe_tsn.1.d2: "皇帝提请[oe_tu_senate|e]议决：[ShowModifier('oe_tsn_war_levy')]。新的征伐已经开始，皇帝要求各地为这场战争加派兵员和粮饷。若通过，本次征伐期间（最长#Y 5#!年）帝国陆军士气#G +5%#!，人力#G +10%#!，每月厌战#G −0.05#!。\n\n$oe_tsn_tally$"
 oe_tsn.1.d3: "皇帝提请[oe_tu_senate|e]议决：[oe_tu_provincialise|e]。皇帝提议把附庸国[SCOPE.sCountry('oe_tsn_target').GetName]并入帝国，改设行省。\n\n$oe_tsn_tally$"
 oe_tsn.1.d4: "皇帝提请[oe_tu_senate|e]议决：#bold #color_yellow 授予罗马法统#!#!。皇帝提议授予[SCOPE.sCountry('oe_tsn_target').GetName]罗马法统，使之成为帝国的内地行省。\n\n$oe_tsn_tally$"
 oe_tsn.1.d: "随着号角与钟声在议事大厅外响起，皇帝遣宫廷礼官将一项关乎国政走向的重要议案正式提请[oe_tu_senate|e]审议表决。诸元老与帝国重臣在石阶座席间低声交换眼神，即将以唱票与举手表态决定朝廷方略的去留。\n\n$oe_tsn_tally$"
 oe_tsn.1.t: "元老院表决"
 oe_tsn.1.a1: "照议执行"
 oe_tsn.1.a1.tt: "额外贡金：[oe_tu_exarchate|e]、[oe_tu_charter|e]和宗室封邑在#Y 5#!年内多缴月收入的#G 5%#!作为贡金；投反对票的特许城邦只多缴一半（投反对票的特许城邦：#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!个）"
 oe_tsn.1.b1: "接受否决"
 oe_tsn.1.b1.tt: "不加征贡金。#Y 10#!年内不能再提此议"
 oe_tsn.1.c1: "强行通过"
 oe_tsn.1.c1.tt: "#R −5#![oe_tu_authority|e]\n投反对票的每个行省（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#!个[oe_tu_exarchate|e]或封邑、#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!个[oe_tu_charter|e]）忠诚#R −10#!（计入忠诚目标#Y 5#!年）\n投反对票的每个豪族（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!家）影响力#Y −25#!\n额外贡金：总督区、特许城邦和宗室封邑在#Y 5#!年内多缴月收入的#G 5%#!作为贡金；投反对票的特许城邦只多缴一半（投反对票的特许城邦：#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!个）"
 oe_tsn.1.a2: "照议执行"
 oe_tsn.1.a2.tt: "获得[ShowModifier('oe_tsn_war_levy')]，直到本次征伐结束（最长#Y 5#!年）：陆军士气#G +5%#!，人力#G +10%#!，每月厌战#G −0.05#!"
 oe_tsn.1.b2: "接受否决"
 oe_tsn.1.b2.tt: "各地行省议论纷纷，但没有其他效果"
 oe_tsn.1.c2: "强行通过"
 oe_tsn.1.c2.tt: "#R −5#![oe_tu_authority|e]\n投反对票的每个行省（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#!个[oe_tu_exarchate|e]或封邑、#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!个[oe_tu_charter|e]）忠诚#R −10#!（计入忠诚目标#Y 5#!年）\n投反对票的每个豪族（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!家）影响力#Y −25#!\n获得[ShowModifier('oe_tsn_war_levy')]，直到本次征伐结束（最长#Y 5#!年）：陆军士气#G +5%#!，人力#G +10%#!，每月厌战#G −0.05#!"
 oe_tsn.1.a3: "照议执行"
 oe_tsn.1.a3.tt: "[oe_tu_provincialise|e]议案生效，按设省行动的说明执行"
 oe_tsn.1.b3: "接受否决"
 oe_tsn.1.b3.tt: "[oe_tu_provincialise|e]议案作废"
 oe_tsn.1.c3: "强行通过"
 oe_tsn.1.c3.tt: "#R −5#![oe_tu_authority|e]\n投反对票的每个行省（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#!个[oe_tu_exarchate|e]或封邑、#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!个[oe_tu_charter|e]）忠诚#R −10#!（计入忠诚目标#Y 5#!年）\n投反对票的每个豪族（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!家）影响力#Y −25#!\n[oe_tu_provincialise|e]议案生效，按设省行动的说明执行"
 oe_tsn.1.a4: "照议执行"
 oe_tsn.1.a4.tt: "授予罗马法统的议案生效，按该行动的说明执行"
 oe_tsn.1.b4: "接受否决"
 oe_tsn.1.b4.tt: "授予罗马法统的议案作废"
 oe_tsn.1.c4: "强行通过"
 oe_tsn.1.c4.tt: "#R −5#![oe_tu_authority|e]\n投反对票的每个行省（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_tn').GetValue|0]#!个[oe_tu_exarchate|e]或封邑、#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_cn').GetValue|0]#!个[oe_tu_charter|e]）忠诚#R −10#!（计入忠诚目标#Y 5#!年）\n投反对票的每个豪族（#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.GetVariable('oe_tsn_no_h').GetValue|0]#!家）影响力#Y −25#!\n授予罗马法统的议案生效，按该行动的说明执行"
 oe_tsn.1.x: "知道了"
 oe_tsn.1.x.tt: "没有待表决的议案，没有其他效果。"
 oe_tsn_pv_1: "若此刻提请：赞成#G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_yes')|0]#!席，反对#R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no')|0]#!席，[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv1')]。\n反对票：[oe_tu_charter|e]#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_c')|0]#!，[oe_tu_exarchate|e]与封邑#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_t')|0]#!，豪族#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_h')|0]#!，宫廷官员#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv1_no_o')|0]#!。"
 oe_tsn_pv_2: "征伐一开始，[oe_tu_senate|e]就要表决[ShowModifier('oe_tsn_war_levy')]。按此刻的情形：赞成#G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_yes')|0]#!席，反对#R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no')|0]#!席，[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv2')]。\n反对票：[oe_tu_charter|e]#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_c')|0]#!，[oe_tu_exarchate|e]与封邑#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_t')|0]#!，豪族#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_h')|0]#!，宫廷官员#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv2_no_o')|0]#!。[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPvQueue')]"
 oe_tsn_pv_3: "若此刻提交：赞成#G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_yes')|0]#!席，反对#R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no')|0]#!席，[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv3')]。\n反对票：[oe_tu_charter|e]#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_c')|0]#!，[oe_tu_exarchate|e]与封邑#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_t')|0]#!，豪族#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_h')|0]#!，宫廷官员#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv3_no_o')|0]#!。\n附庸本身在[oe_tu_senate|e]没有席位，计票也不看提交的是哪个附庸，所以选哪个附庸，预计结果都一样。[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPvQueue')]"
 oe_tsn_pv_4: "若此刻提交：赞成#G [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_yes')|0]#!席，反对#R [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no')|0]#!席，[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPv4')]。\n反对票：[oe_tu_charter|e]#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_c')|0]#!，[oe_tu_exarchate|e]与封邑#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_t')|0]#!，豪族#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_h')|0]#!，宫廷官员#Y [GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.MakeScope.ScriptValue('oe_tsn_pv4_no_o')|0]#!。\n可选的行省忠诚都在#Y 70#!以上，有席位的不论是否被选中都投赞成（[oe_tu_march|e]没有席位），所以选哪个行省，预计结果都一样。[GetUniqueInternationalOrganization('oe_byz_empire_pillars').GetLeaderCountry.Custom('OeTsnPvQueue')]"
 OE_TSN_PV_PASS: "预计#G 通过#!"
 OE_TSN_PV_EMPTY: "元老院还没有席位，按规则#G 通过#!"
 OE_TSN_PV_FAIL: "预计#R 被否决#!"
 OE_TSN_PV_QUEUE: "\n另一项议案正在表决：此案要等它表决完才付表决，届时结果可能不同。"
