 oe_rec_arsenale_canal_line: "运河流水造船"
 oe_rec_arsenale_canal_line_desc: "造舰快三成半，新舰略有折损。"
 oe_rec_admiralty_navigation_corps: "海军学院精训"
 oe_rec_admiralty_navigation_corps_desc: "造舰更慢，但水兵带着 30 点经验上舰。"
 oe_form_adv_combined_arms_manuals: "诸兵种合成操典"
 oe_form_adv_combined_arms_manuals_desc: "把长矛、火器与火炮的配合写成操典。"
 oe_form_adv_arsenale_shipbuilding: "军械库造舰法"
 oe_form_adv_arsenale_shipbuilding_desc: "按统一规格造船，舰队更强、造得更快。"
 oe_form_adv_ordre_mixte_staff: "总参谋部"
 oe_form_adv_ordre_mixte_staff_desc: "由专职参谋拟定战法、调度各军。"
 oe_form_player_only_tt: "只有玩家操控的国家可以使用"
 oe_form_dec_compile_tactica.title: "编纂帝国兵法总集"
 oe_form_dec_compile_tactica.desc: "把历代兵书汇编成册颁行各军。花费 100 金币，效果持续 20 年。"
 oe_form_dec_compile_tactica.a: "颁行"
 oe_form_dec_standing_drill.title: "确立常备练兵条令"
 oe_form_dec_standing_drill.desc: "给各军定下统一的操练条令。花费 100 金币，效果持续 20 年。"
 oe_form_dec_standing_drill.a: "颁行"
 oe_form_dec_line_of_battle.title: "颁行海军战列线训令"
 oe_form_dec_line_of_battle.desc: "令舰队按训令列成战列线作战。1600 年以后、有港口的国家可用。花费 100 金币，效果持续 20 年。"
 oe_form_dec_line_of_battle.a: "颁行"
 oe_form.1.title: "空心方阵大演武"
 oe_form.1.desc: "京郊大校场上旌旗猎猎，各路军团依照帝国古兵书反复操演严整的空心方阵。身披重甲的步兵四面结阵、盾墙密不透风，阵中预留数道宽阔通道，专供全副披甲的铁骑随时突击而出、冲垮敌阵后再从容退回阵内重整，令观操将士赞叹不已。"
 oe_form.1.a: "令各军照此操练"
 oe_form.2.title: "两翼合围演习"
 oe_form.2.desc: "无垠草原之上马蹄如雷，各万户骑兵正展开声势浩大的两翼合围实战演习。中军精骑迎敌交锋后佯装败退，诱使假想敌阵型拉长脱节，潜伏于丘陵之后的左右两翼旋即拍马疾驰、如巨钳般骤然合拢，完美重现了草原铁骑百战百胜的祖传战法。"
 oe_form.2.a: "这是祖宗的战法"
 oe_form.3.title: "步火协同传入"
 oe_form.3.desc: "近来远方战场上兴起的新式大方阵战法传至我国军营：长矛手列阵如林以御重骑冲锋，火枪手则依托方阵四角与翼侧轮番齐射，步火协同威力惊人。然而军中浸淫旧制多年的老将们对此仍将信将疑，争论着究竟该先择一军试行，还是恪守固有操典。"
 oe_form.3.a: "选一军试行"
 oe_form.3.b: "照旧法操练"
 oe_form.4.title: "参谋们的争论"
 oe_form.4.desc: "大本营的沙盘前灯火通明，参谋军官们围绕最新战法展开激烈争论。一派主张将步兵展开为宽阔横队，以严明纪律发挥最大密度的火枪齐射威力；另一派则坚信厚重纵队机动迅捷、冲击如潮，足以一举撕裂敌军防线。两种思路针锋相对，亟待统帅定夺。"
 oe_form.4.a: "横队与纵队并用"
 oe_form.5.title: "舷侧齐射演训"
 oe_form.5.desc: "蔚蓝海面上炮声隆隆，硝烟随海风滚滚弥散。我军主力战舰严格保持间距，首尾相衔列成笔直的战列线，随着旗舰信号旗起落，各舰依次转向瞄准靶船，以整排舷侧重炮轰然齐射。水师提督称赞此等阵型足以在远洋决战中压倒一切散乱敌舰。"
 oe_form.5.a: "令各舰熟习队形"
 oe_form.6.title: "桨帆战术总结"
 oe_form.6.desc: "久历地中海与近海血战的老水手与桨舰船长们齐聚港务署，将毕生实战心得整理成册：如何借风浪与人力划桨摆出新月阵型，以舰首重炮轰碎敌船船艏，再令两翼轻舰迅速合围、抛出抓钩展开白刃接舷肉搏。这部桨帆战法实录堪为水师至宝。"
 oe_form.6.a: "刊行给各舰队"
 oe_form.7.title: "流水造船与水兵学堂"
 oe_form.7.desc: "官营船坞推行标准化零件与流水装配工艺后，战舰舾装与下水速度大幅跃升，军港之中新舰林立。眼见舰队规模日盛，水师重臣趁势上疏，提议在军港旁设立专门的水兵学堂，系统讲授天文导航、海图测绘与舰炮弹道之学，以免徒有巨舰而乏良才。"
 oe_form.7.a: "设立学堂"
 oe_form.7.b: "先顾造船"
 oe_form.8.title: "急募还是精训"
 oe_form.8.desc: "新订兵制条令即将颁行全国，朝堂之上却围绕兵源根基爆发分歧。主战派将领认为现代战事瞬息万变，唯有平时养精蓄锐、常年严训的职业精兵方堪大任；度支官僚则忧心常备军耗费巨靡，力主保留战时紧急征募的民兵体系以备不时之需。"
 oe_form.8.a: "以精训为本"
 oe_form.8.b: "有备无患，两法并存"
 oe_form.90.title: "【读数】军阵与练兵法"
 oe_form.90.desc_header: "v11.8 军阵与练兵法读数：新增 6 种阵型、4 种练兵法（在军队与舰队界面里选用）。"
 oe_form.90.a: "关闭"
