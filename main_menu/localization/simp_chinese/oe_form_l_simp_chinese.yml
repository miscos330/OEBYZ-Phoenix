 oe_form_menavlatoi_square: "重矛空心方阵"
 oe_form_menavlatoi_square_desc: "重步兵持长矛结成四面方阵，铁骑藏在阵内伺机出击。两翼与中军都以重步兵为主。"
 oe_form_steppe_crescent: "双翼合围新月阵"
 oe_form_steppe_crescent_desc: "中军佯退诱敌，两翼骑兵从外侧包抄。两翼全是骑兵。"
 oe_form_tercio_pike_shot: "步火大方阵"
 oe_form_tercio_pike_shot_desc: "长矛手居中，火枪手在外，野战炮随阵。中军厚实。"
 oe_form_ordre_mixte: "纵横混合阵"
 oe_form_ordre_mixte_desc: "炮兵集中在中央，横队齐射与纵队突击交替使用。"
 oe_form_line_of_battle: "战列线"
 oe_form_line_of_battle_desc: "重型战舰排成一条纵队，以全舷侧火炮压制敌人。"
 oe_form_galley_ram_crescent: "桨帆新月阵"
 oe_form_galley_ram_crescent_desc: "桨帆战舰排成弯月，两翼包抄接舷。"
 oe_rec_imperial_cadre: "近卫骨干精训"
 oe_rec_imperial_cadre_desc: "招募更慢，但新兵带着 35 点经验入伍。"
 oe_rec_emergency_conscription: "战时紧急征募"
