l_simp_chinese:
 oe_sit_v45_global_silver_flow: "全球白银环流与价格革命"
 oe_sit_v45_global_silver_flow_desc: "波托西、萨卡特卡斯与日本石见银山奔涌而出的海量白银，经由大西洋帆船、欧洲交易所与马尼拉航道汇聚向明清中国与印度次大陆，首次铸就贯通全球的贵金属环流。驾驭跨洋银贸、一条鞭折银与价格革命通胀，决定本国在这场货币大潮中的沉浮。"
 oe_v45_silver_end_global_standard: "稳固的全球白银本位秩序"
 oe_v45_silver_end_global_standard_desc: "严明成色的铸币律令、跨洋大帆船特许与现代交易所清算共同驯服了价格革命的震荡，将欧亚美商贸连为稳固长久的全球白银体系。"
 oe_v45_silver_end_price_shock: "漫长而剧烈的价格革命震荡"
 oe_v45_silver_end_price_shock_desc: "各国竞相囤银封关与暗中贬值铸币令物价震荡经久不息，旧式财政被迫在阵痛中重整税基。"
 oe_v45_silver_end_equilibrium: "十七世纪末全球银贸再平衡"
 oe_v45_silver_end_equilibrium_desc: "至公元1700年，欧亚美三大洲的白银购买力趋于收敛，人类史上首次全球贵金属套利狂潮归于新的均衡。"
 oe_v45_silver_map_producers_tt: "#Y 白银核心产区#!：安第斯、中美洲与日本石见等向全球输送海量精银的矿带。"
 oe_v45_silver_map_forwarders_tt: "#Y 白银转运枢纽#!：伊比利亚、西欧交易所与地中海黎凡特跨洋转运中枢。"
 oe_v45_silver_map_absorbers_tt: "#Y 白银终极吸纳区#!：以丝瓷茶棉与折银税制汇聚全球白银的东亚、南亚与东南亚市场。"
 oe_v45_silver_legend_producers: "白银产区（美洲 / 日本）"
 oe_v45_silver_legend_forwarders: "白银转运与清算枢纽"
 oe_v45_silver_legend_absorbers: "亚洲白银吸纳核心区"
 OE_V45_SILVER_GUI_HDR_ERA: "历史窗口"
 OE_V45_SILVER_GUI_HDR_METER: "全球白银指数"
 OE_V45_SILVER_GUI_CARD_TITLE: "跨洋白银环流与价格革命"
 OE_V45_SILVER_GUI_CARD_BODY: "源自美洲与日本的白银正经由欧洲交易所源源汇入明清中国与南亚市场。运用五项专属局势互动平衡海贸特许、一条鞭税制与铸币成色；将全球白银指数推升至85以上即可铸就“稳固的全球白银本位秩序”。"
 OE_V45_SILVER_GUI_GAUGE_LABEL: "全球白银指数（达85以上缔造白银本位盛世）"
 OE_V45_SILVER_GUI_FOOTNOTE: "数据地图说明：金色为美洲与日本白银产区；蓝色为欧洲与黎凡特白银转运清算枢纽；青色为东亚与南亚白银终极吸纳市场。"
 hint_oe_sit_v45_global_silver_flow: "[GetSituationByKey('oe_sit_v45_global_silver_flow').GetNameWithNoTooltip]"
 hint_oe_sit_v45_global_silver_flow_hint_text: "#T 局势概览#!\n@hint! #Y 《全球白银环流与价格革命》#! 活跃于 #Y 1550–1700年#!。通过实时 #Y 全球白银指数#!（0–100）与五项专属互动，在马尼拉大帆船、一条鞭折银、重商主义囤银、铸币成色整饬与阿姆斯特丹—安特卫普交易所之间抉择方略。"
 hint_oe_sit_v45_global_silver_flow_administrative: "当国内通胀抬升时，宜将“一条鞭折银税制”与“铸币成色整饬令”搭配施行，既享高效税入又遏止物价脱缰。"
 hint_oe_sit_v45_global_silver_flow_diplomatic: "兴办阿姆斯特丹—安特卫普交易所与马尼拉大帆船可稳步拉升全球白银指数至85以上，同时避免重商主义封关带来的外交失分。"
 hint_oe_sit_v45_global_silver_flow_military: "大帆船护航会提升海军维持开支，建议依托稳固港口与护航舰队保障战时白银动脉畅通。"
 oe_sit_v45_little_ice_age: "全球小冰期与十七世纪大危机"
 oe_sit_v45_little_ice_age_desc: "1570至1715年间，漫长的太阳黑子极小期令欧亚与北美温带骤然转寒，大河冰封、夏汛缩减，饥馑与流民动荡席卷半个地球。唯有广建常平仓、推广耐寒美洲新粮并统筹薪炭海运，方能率领苍生安度十七世纪大危机。"
 oe_v45_lia_end_resilient_recovery: "渡过小冰期的韧性农政大捷"
 oe_v45_lia_end_resilient_recovery_desc: "常平赈灾、耐寒马铃薯番薯与跨海调粮彻底战胜了严寒灾年，令渡劫诸国反而锻造出前所未有的农政韧性与民生根基。"
 oe_v45_lia_end_hard_thaw: "劫后严冬的沧桑复苏"
 oe_v45_lia_end_hard_thaw_desc: "连年霜冻与财税困顿留下了满目疮痍的寒冬记忆，唯待太阳回暖后休养生息、重垦荒田。"
 oe_v45_lia_end_solar_return: "太阳归暖与寒纪终结"
 oe_v45_lia_end_solar_return_desc: "至公元1715年，太阳黑子重现、霜期明显缩短，欧亚与北美田野重迎温暖长夏，十七世纪小冰期最严酷的寒谷终告落幕。"
 oe_v45_lia_map_severe_frost_tt: "#Y 极寒重霜带#!：高寒与大陆性腹地，深受短夏早霜与河道冰封重创。"
 oe_v45_lia_map_temperate_stress_tt: "#Y 寒潮承压产粮区#!：海洋性与冷干农牧区，饱受阴冷减产与冬薪紧缺考验。"
 oe_v45_lia_map_grain_buffer_tt: "#Y 温暖余粮调剂带#!：地中海与亚热带产区，为跨海紧急调粮提供关键余粮。"
 oe_v45_lia_legend_severe_frost: "极寒霜冻重灾腹地"
 oe_v45_lia_legend_temperate_stress: "低温承压农业带"
 oe_v45_lia_legend_grain_buffer: "温暖调粮余粮产区"
 OE_V45_LIA_GUI_HDR_ERA: "严寒纪元"
 OE_V45_LIA_GUI_HDR_METER: "抗灾韧性指数"
 OE_V45_LIA_GUI_CARD_TITLE: "共克十七世纪小冰期大危机"
 OE_V45_LIA_GUI_CARD_BODY: "寒潮与短夏正持续冲击欧亚及北美农耕腹地。通过常平仓、耐寒美洲高产作物、灾年蠲免农赋、御寒林政与紧急海运调粮五大举措，将小冰期抗灾韧性提升至85以上，即可赢得“渡过小冰期的韧性农政大捷”。"
 OE_V45_LIA_GUI_GAUGE_LABEL: "小冰期抗灾韧性（达85以上达成韧性农政大捷）"
 OE_V45_LIA_GUI_FOOTNOTE: "数据地图说明：冰蓝色为大陆性与高寒重霜区；石板蓝为低温承压农牧带；暖琥珀色为可供海运调剂的温暖余粮带。"
 hint_oe_sit_v45_little_ice_age: "[GetSituationByKey('oe_sit_v45_little_ice_age').GetNameWithNoTooltip]"
 hint_oe_sit_v45_little_ice_age_hint_text: "#T 局势概览#!\n@hint! #Y 《全球小冰期与十七世纪大危机》#! 跨越 #Y 1570–1715年#!，尤以 #Y 1615–1675年#! 极寒谷底最为凶险。尽早推行 #Y 耐寒美洲高产作物#! 与 #Y 常平仓赈灾粮储#! 可显著拉升抗灾韧性并逆转严冬衰减。"
 hint_oe_sit_v45_little_ice_age_administrative: "推行耐寒美洲高产作物可遏制1615–1675年的严冬韧性滑坡，配合常平仓与灾年蠲免农赋可牢牢稳住国内安定。"
 hint_oe_sit_v45_little_ice_age_diplomatic: "紧急海运调粮仰赖畅通航路，严冬粮荒期间宜避免无谓的多线海战封锁，确保南方余粮源源北运。"
 hint_oe_sit_v45_little_ice_age_military: "颁行御寒林木与薪炭统筹令可降低10%陆军损耗并增强要塞防御，在严冬行军围城时效用显著。"
 oe_sit_v45_atlantic_revolutions: "大西洋革命与宪政浪潮"
 oe_sit_v45_atlantic_revolutions_desc: "1775至1830年间，启蒙思潮、战争债负与殖民地自主运动汇流为席卷欧洲与美洲的大西洋宪政大潮。高举制宪议会与公民权利旗帜，缔结诸王正统协调同盟，抑或开辟稳健君主立宪妥协之路，一切尽在执政一念之间。"
 oe_v45_rev_end_constitutional_dawn: "宪政主权时代曙光"
 oe_v45_rev_end_constitutional_dawn_desc: "代议制宪与公民权利原则在大西洋两岸蔚为大观，成文宪法与公民同意成为近代国家法统的新基石。"
 oe_v45_rev_end_conservative_concert: "诸王正统协调秩序确立"
 oe_v45_rev_end_conservative_concert_desc: "各大君主宫廷通过正统协调会议与条约联防成功遏止激进风暴，使传统王朝秩序延续至新时代。"
 oe_v45_rev_end_balanced_charters: "大西洋宪政折中均势"
 oe_v45_rev_end_balanced_charters_desc: "至公元1830年，激进革命与僵化专制皆未独占天下，立宪君主国与新兴共和国在务实法制框架下达成历史性均势。"
 oe_v45_rev_map_constitutional_tt: "#Y 宪政革命阵营#!：共和国、革命强权以及推行制宪议会与权利宣言的革新国家。"
 oe_v45_rev_map_moderate_tt: "#Y 稳健立宪妥协阵营#!：以折中宪章调和王室法统与议会立法权的温和国家。"
 oe_v45_rev_map_concert_tt: "#Y 正统协调阵营#!：坚守王朝正统与大国协调外交机制的保守君主国。"
 oe_v45_rev_legend_constitutional: "宪政与革命阵营"
 oe_v45_rev_legend_moderate: "稳健君主立宪阵营"
 oe_v45_rev_legend_concert: "正统协调君主阵营"
 OE_V45_REV_GUI_HDR_ERA: "革命纪元"
 OE_V45_REV_GUI_HDR_METER: "革命狂热指数"
 OE_V45_REV_GUI_CARD_TITLE: "宪政主权浪潮与正统协调博弈"
 OE_V45_REV_GUI_CARD_BODY: "欧洲与美洲正被深刻的制度分歧撕裂。将革命狂热指数推至+75以上可迎来“宪政主权时代曙光”，压至-75以下可确立“诸王正统协调秩序”，或通过稳健君主立宪妥协案将其拉回均衡。"
 OE_V45_REV_GUI_GAUGE_LABEL: "革命狂热指数（-100 正统协调 <---> +100 宪政革命）"
 OE_V45_REV_GUI_FOOTNOTE: "数据地图说明：绯红色为宪政与革命阵营；翡翠绿为稳健立宪妥协阵营；皇家深蓝为正统协调君主阵营。"
 hint_oe_sit_v45_atlantic_revolutions: "[GetSituationByKey('oe_sit_v45_atlantic_revolutions').GetNameWithNoTooltip]"
 hint_oe_sit_v45_atlantic_revolutions_hint_text: "#T 局势概览#!\n@hint! #Y 《大西洋革命与宪政浪潮》#! 展开于 #Y 1775–1830年#!。其双向 #Y 革命狂热指数#! 跨越 #Y -100至+100#!，并随各国抉择实时更新地图阵营配色，最终通向三种截然不同的时代结局。"
 hint_oe_sit_v45_atlantic_revolutions_administrative: "召开制宪国民议会可显著提升立法与内阁效率但触怒贵族，而稳健君主立宪妥协案则偏重各阶层和谐与国家稳定。"
 hint_oe_sit_v45_atlantic_revolutions_diplomatic: "颁布公民权利宣言能激发识字率与制度传播却降低保守国家好感；缔结正统协调同盟则可换取丰厚外交声誉与正统性。"
 hint_oe_sit_v45_atlantic_revolutions_military: "动员国民自卫军可赋予+7%陆军士气与+12%人力增幅，助你在大西洋决战中以公民热血克敌，但需留意更高的军费开销。"
 oe_sit_v45_proto_industrialization: "早期工业化与蒸汽曙光"
 oe_sit_v45_proto_industrialization_desc: "1750至1836年间，高识字率与丰沛煤铁矿藏的交汇将人类推向史无前例的经济拐点。开凿煤铁运河、破除行会垄断、资助蒸汽抽水机、创办综合工艺学院并推行工场标准，率先点亮席卷全球的蒸汽与钢铁曙光。"
 oe_v45_ind_end_steam_age: "蒸汽与钢铁时代全面降临"
 oe_v45_ind_end_steam_age_desc: "蒸汽机、焦炭高炉、内河运河与综合工艺学院彻底击碎前近代产能天花板，引领工业先驱国家昂首跨入机器世纪。"
 oe_v45_ind_end_artisan_synthesis: "精工手工业与水力工坊合流"
 oe_v45_ind_end_artisan_synthesis_desc: "精雕细琢的高端手工业与水力作坊走出了一条温和演进之路，保有卓越商誉与社会安定。"
 oe_v45_ind_end_industrial_horizon: "机器世纪的新地平线"
 oe_v45_ind_end_industrial_horizon_desc: "至公元1836年，全球煤铁矿区灯火通明，古老的农耕帝国时代已正式交棒予蒸汽与钢铁的新纪元。"
 oe_v45_ind_map_coal_tt: "#Y 煤炭工业核心盆地#!：为蒸汽抽水机与焦炭炼铁提供澎湃动力的关键煤田。"
 oe_v45_ind_map_iron_tt: "#Y 铁矿冶金重镇#!：支撑高炉铸铁、精密机械与近代火炮的钢铁腹地。"
 oe_v45_ind_map_pioneer_tt: "#Y 早期工业化先驱国家#!：凭借高识字率与工艺革新领跑工业起飞的先锋强国。"
 oe_v45_ind_legend_coal: "煤炭能源盆地"
 oe_v45_ind_legend_iron: "铁矿冶金腹地"
 oe_v45_ind_legend_pioneer: "早期工业化先驱国家"
 OE_V45_IND_GUI_HDR_ERA: "工业曙光"
 OE_V45_IND_GUI_HDR_METER: "工业化指数"
 OE_V45_IND_GUI_CARD_TITLE: "煤铁运河、蒸汽工程与工艺学院起飞"
 OE_V45_IND_GUI_CARD_BODY: "坐拥高识字率与煤铁资源的国家正迈向机器大生产门槛。积极推行煤铁运河网、行会改革、蒸汽抽水机、工艺学院与工场质量标准五大举措，将工业化指数推升至85以上即可率先开启“蒸汽与钢铁时代”。"
 OE_V45_IND_GUI_GAUGE_LABEL: "早期工业化指数（达85以上全面开启蒸汽钢铁时代）"
 OE_V45_IND_GUI_FOOTNOTE: "数据地图说明：炽焰橙为煤炭能源盆地；钢蓝灰为铁矿冶金腹地；翠青色为高识字率与工业化先驱国家。"
 hint_oe_sit_v45_proto_industrialization: "[GetSituationByKey('oe_sit_v45_proto_industrialization').GetNameWithNoTooltip]"
 hint_oe_sit_v45_proto_industrialization_hint_text: "#T 局势概览#!\n@hint! #Y 《早期工业化与蒸汽曙光》#! 于 #Y 1750–1836年#! 间在世界步入革命时代或有大国同时具备 #Y 25%以上识字率与煤铁矿藏#! 时启动。运用五项专属互动将 #Y 工业化指数#! 从20推升至85以上。"
 hint_oe_sit_v45_proto_industrialization_administrative: "若坐拥煤铁行省，宜优先启动“蒸汽抽水机工程”与“煤铁运河网”，继而创办“综合工艺学院”实现科研与识字率双飞跃。"
 hint_oe_sit_v45_proto_industrialization_diplomatic: "改革城市行会会暂时触怒市民，创办工艺学院则略损教士满意度，建议错峰推行以维持各阶层忠诚稳定。"
 hint_oe_sit_v45_proto_industrialization_military: "推行工场质量标准可在提升产能与发展度的同时赋予+2%军纪加成，焦炭冶铁新法则能直接增强重炮围城威力。"
 oe_v45_act_silver_manila_galleon: "颁授马尼拉大帆船特许状"
 oe_v45_act_silver_manila_galleon_desc: "特许重装远洋大帆船往返于美洲、日本银矿与东亚、南亚丝瓷巨港之间，打通跨洋白银环流大动脉。"
 oe_v45_act_silver_manila_galleon_tt: "全球白银指数 #G +8#!，获得为期12年的 #Y 马尼拉大帆船白银特许状#! 修正，并确立本国跨洋银贸枢纽地位。"
 oe_v45_act_silver_single_whip: "推行一条鞭折银税制"
 oe_v45_act_silver_single_whip_desc: "合并繁杂的田赋、力役与杂派，一律折算为足色白银按亩征纳，将国家财政直接接入全球白银环流体系。"
 oe_v45_act_silver_single_whip_tt: "全球白银指数 #G +7#!，并获得为期12年的 #Y 一条鞭折银赋役新制#! 修正。"
 oe_v45_act_silver_bullion_mercantilism: "施行重商主义金银管控制"
 oe_v45_act_silver_bullion_mercantilism_desc: "颁布白银出境禁令与本国船运独占法，竭力将贵金属留存于皇家府库之内，以抵御外贸白银外流。"
 oe_v45_act_silver_bullion_mercantilism_tt: "全球白银指数 #R -6#!（保护主义囤银），并获得为期12年的 #Y 重商主义金银管控制#! 修正。"
