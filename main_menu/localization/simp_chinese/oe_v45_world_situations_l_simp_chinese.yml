 oe_v45_act_lia_maritime_grain_tt: "小冰期抗灾韧性 #G +8#!，并获得为期12年的 #Y 紧急海运调粮船队特许#! 修正。"
 oe_v45_act_rev_constituent_assembly: "召开制宪国民议会"
 oe_v45_act_rev_constituent_assembly_desc: "召集各省与城镇选派的代表齐聚议事厅起草成文宪法，将大西洋政局推向主权在民的代议体制。"
 oe_v45_act_rev_constituent_assembly_tt: "革命狂热指数 #G +16#!，将本国标示为 #Y 宪政革命阵营#!，并获得为期12年的 #Y 制宪国民议会体制#! 修正。"
 oe_v45_act_rev_declaration_rights: "颁布公民权利宣言"
