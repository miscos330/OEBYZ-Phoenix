 oe_v45_act_rev_declaration_rights_tt: "革命狂热指数 #G +18#!，将本国标示为 #Y 宪政革命阵营#!，并获得为期12年的 #Y 公民权利与法治宣言#! 修正。"
 oe_v45_act_rev_national_guard: "动员国民自卫军"
 oe_v45_act_rev_national_guard_desc: "在各大城镇组建公民志愿自卫军团并配发火枪，以全民武装捍卫宪政议会抵御外部干涉联军。"
 oe_v45_act_rev_national_guard_tt: "革命狂热指数 #G +14#!，陆军传统 #G +6#!，并获得为期12年的 #Y 全民动员的国民自卫军#! 修正。"
