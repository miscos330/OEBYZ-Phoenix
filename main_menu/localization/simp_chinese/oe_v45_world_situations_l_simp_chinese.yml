 oe_v45_act_lia_tax_moratorium_tt: "小冰期抗灾韧性 #G +8#!，稳定度 #G +5#!，并获得为期10年的 #Y 严寒灾年蠲免农赋诏#! 修正。"
 oe_v45_act_lia_forestry_fuel: "颁布御寒林木与薪炭统筹令"
