 oe_v45_act_rev_constitutional_compromise: "推行稳健君主立宪妥协案"
 oe_v45_act_rev_constitutional_compromise_desc: "颁布折中宪章，在保留君主法统与行政连续性的同时赋予议会立法与预算权，引导政局走出激进与守旧的两极对立。"
 oe_v45_act_rev_constitutional_compromise_tt: "使革命狂热指数向 #Y 0#! 温和回摆，将本国标示为 #Y 稳健立宪阵营#!，并获得为期12年的 #Y 稳健君主立宪妥协宪章#! 修正。"
 oe_v45_act_ind_coal_iron_canals: "特许开凿煤铁运河网"
 oe_v45_act_ind_coal_iron_canals_desc: "集资兴修配备多级船闸的内河运河，将深山煤矿、冶铁高炉与出海良港连成一线，成倍压低大宗燃料运输成本。"
 oe_v45_act_ind_coal_iron_canals_tt: "工业化进程指数 #G +9#!，将本国标示为 #Y 工业先驱强国#!，并获得为期14年的 #Y 特许煤铁航运运河网#! 修正。"
 oe_v45_act_ind_reform_guilds: "改革城市行会垄断旧制"
 oe_v45_act_ind_reform_guilds_desc: "废止束缚产能的城镇行会人数与机台限额，放开水力纺坊、铸铁工场与乡村包买商网络规模化扩张。"
 oe_v45_act_ind_reform_guilds_tt: "工业化进程指数 #G +9#!，并获得为期12年的 #Y 城市行会松绑与手工工场化#! 修正。"
 oe_v45_act_ind_steam_pumps: "资助蒸汽抽水机工程"
 oe_v45_act_ind_steam_pumps_desc: "向发明家与铁坊主授予皇家专利与研发拨款，批量制造矿井大气蒸汽抽水机与冷凝鼓风装置，解锁深层煤铁矿藏。"
 oe_v45_act_ind_steam_pumps_tt: "工业化进程指数 #G +11#!，科研进度 #G +10#!，并获得为期14年的 #Y 蒸汽抽水机与深井采煤工程#! 修正。"
 oe_v45_act_ind_polytechnic: "创办综合工艺学院"
 oe_v45_act_ind_polytechnic_desc: "设立专修应用数学、冶金化学与机械制图的国立工艺学院，为铁路运河、蒸汽机与精密兵工源源输送近代工程师。"
 oe_v45_act_ind_polytechnic_tt: "工业化进程指数 #G +10#!，科研进度 #G +12#!，并获得为期14年的 #Y 皇家综合工艺与工程院#! 修正。"
 oe_v45_act_ind_factory_standards: "推行工场质量与度量衡标准"
 oe_v45_act_ind_factory_standards_desc: "颁定全国统一精密度量衡、机械零件公差与纺织质检章程，令本国早期机器工场产品风行四海并反哺军工铸炮。"
 oe_v45_act_ind_factory_standards_tt: "工业化进程指数 #G +8#!，并获得为期12年的 #Y 工场标准度量衡与质检署#! 修正。"
 oe_v45_ws.1.title: "白银之山与跨洋银船的轰鸣"
 oe_v45_ws.1.desc: "从安第斯高原的波托西与萨卡特卡斯矿井，到日本石见银山的沿海深坑，奔涌不息的精炼白银正顺着太平洋与大西洋航道灌入塞维利亚、安特卫普、马尼拉、马六甲与广州的每一座码头。商贾们在港畔天平上并排称量冲压银元与官铸纹银，无不惊叹万里之外的一座银矿竟能在短短一代人之内令远方都城的面包与米价翻倍。户部与财政枢臣围坐于堆满银锭的账案前激烈陈词：我们究竟应当顺势融入这场史无前例的全球白银环流，还是筑起关税堤坝保护本国市价？"
 oe_v45_ws.1.a: "广开市舶关税，特许跨洋银船与清算商行入港通商。"
 oe_v45_ws.1.b: "严立白银成色检定与汇率平准规程，稳健承接银潮。"
 oe_v45_ws.1.c: "重征白银出境税并严禁实银外流，充实皇家内帑库存。"
 oe_v45_ws.2.title: "一条鞭法"
 oe_v45_ws.2.desc: "在东亚与南亚广袤的农耕帝国腹地，度支官吏正大刀阔斧地废除沿袭数百年的繁杂粮绢贡赋与无偿徭役，将其归并为一律按亩折纳称量白银的统一新税。此举带来的财政效率令人震撼：各省解运京师的税银迅捷数倍，军需官可直接持银向工坊采购火器甲胄，万里之外的欧美与日本商船更争相运银东来套利。然而乡里耆老亦忧心上书：一旦海路遭飓风或海盗阻断导致银根骤紧，乡民便不得不将整季秋收贱卖，只为凑足官府催缴的那几两碎银。"
 oe_v45_ws.2.a: "全面推行赋役折银，以统一银本位重塑帝国财政动脉。"
 oe_v45_ws.2.b: "准许荒年银粮兼收，为乡里农户保留实物完税的缓冲余地。"
 oe_v45_ws.2.c: "坚守本色粮绢旧制，拒绝将国家命脉系于海外银价涨落。"
 oe_v45_ws.3.title: "石见银山与朱印船的东海银路"
 oe_v45_ws.3.desc: "自朝鲜海峡传入的灰吹炼银新法，将日本石见与生野群山中的矿脉点化为世间屈指可数的白银宝库。悬有朱红敕印的朱印船队云集于长崎、澳门、马尼拉与大城港湾，以一箱箱泛着冷光的丁银换取江南生丝、孟加拉细布与西洋火绳枪。我朝海贸行商纷纷上陈，恳请朝廷尽快在东亚与南洋咽喉港口派驻官办银丝牙行、订立通商契约，以免庞大的东海转口利薮尽数落入竞争对手的特许公司囊中。"
 oe_v45_ws.3.a: "特许设立东亚丝银牙行，大力扩充远洋商船运力。"
 oe_v45_ws.3.b: "重金延聘灰吹炼银工匠，革新本国矿冶与铸币技艺。"
 oe_v45_ws.3.c: "对过境我海域的外国运银船队加征通行抽分关税。"
 oe_v45_ws.4.title: "价格革命席卷欧亚交易所"
 oe_v45_ws.4.desc: "萨拉曼卡、安特卫普与君士坦丁堡的学者相继发觉一桩令人困惑的怪象：纵使远洋船队源源不断地将堆积如山的白银卸上欧洲与黎凡特码头，仰赖固定地租的贵族、支领定额俸禄的书吏与边防长枪兵却愈发捉襟见肘。谷物、羊毛与木材价格连年翻番，而王室旧税却仍停留在百年前的名义银额之上。交易所内外贴满激愤的政论传单，质问蜂拥而至的贵金属究竟是富国之源，还是正在掏空国家真实购买力的通胀海市蜃楼？"
 oe_v45_ws.4.a: "依托中央白银交易所推行汇票清算，并按市价重估关税。"
 oe_v45_ws.4.b: "向常备军士与文官书吏增发物价津贴，稳住朝局与军心。"
 oe_v45_ws.4.c: "颁行严厉的皇家限价令，强行冻结都市粮布零售价格。"
 oe_v45_ws.5.title: "武装护航：大洋白银航道的血与火"
 oe_v45_ws.5.desc: "白银所至之处，私掠快船便如群狼般在逆风海峡悄然集结。自加勒比水道、菲尼斯特雷角直至南海诸岛，手持私掠特许状的武装快艇日夜紧盯满载八里亚尔银币的笨重宝船。各大海贸交易所的航运保费一夜飙升，维系各国兵工厂与海关税入的跨洲银链随时可能断裂。海军统帅建言建立春秋两季武装护航编队，而更具冒险精神的船长们则私下进言：何不干脆发放私掠委任状，直接截夺敌国银船？"
 oe_v45_ws.5.a: "拨款组建常设海军护航编队，并担保海贸保单以稳商路。"
 oe_v45_ws.5.b: "与周边海权诸国缔结联合护航与缉盗互助协定。"
 oe_v45_ws.5.c: "签发皇家私掠特许状，纵容海上劫掠以截获他国银锭。"
 oe_v45_ws.6.title: "皇家铸币局的成色大考"
 oe_v45_ws.6.desc: "连年战债与白银外流诱使多国宫廷暗中在钱币里掺入廉价红铜，引发激烈的劣币恐慌，商贩甚至在城门前拒收贬值铜银。我朝度支司稽查官亦密报：各省集市中早已混杂大量遭人剪边磨损的轻质银币，与精铸外贸银元并行流通。在商民信用彻底崩塌之前，朝廷必须决断：究竟是不惜重金收回劣币、重铸足色精银以定金融之锚，还是暗中减轻成色以暂解眼下军费燃眉之急？"
 oe_v45_ws.6.a: "不惜重金回收劣币，全面改铸滚边防剪的足色标准银元。"
 oe_v45_ws.6.b: "设立官商合办白银库行，以实银储备发行可兑现汇票。"
 oe_v45_ws.6.c: "暗中调低地方辅币含银成色，先行填补边军欠饷窟窿。"
 oe_v45_ws.7.title: "冰封大河：小冰期寒潮笼罩北半球"
 oe_v45_ws.7.desc: "手执黄铜望远镜的天文学家惊愕地发现太阳黑子几近绝迹，而从欧洲、安纳托利亚到神州大地与北美东岸的史官皆在编年史中写下同一幕惨景：五月飞霜冻死果花，九月大雪掩埋未割的麦穗。牛车竟能径直驶过冰封的泰晤士河、博斯普鲁斯海峡、多瑙河与大运河，高山冰川沿着牧场山谷步步南推。当麦价暴涨三倍、流民惶恐四散之时，所有君主都必须直面席卷十七世纪的全球小冰期大考。"
 oe_v45_ws.7.a: "倾国库积储大开常平仓与粥厂，倾力赈济受冻乡民。"
 oe_v45_ws.7.b: "在都城与重镇实施战时配给限价，派兵护送运粮车队。"
 oe_v45_ws.7.c: "令地方贵族与寺观自行设法救荒，优先保全中央军政财力。"
 oe_v45_ws.8.title: "耐寒新粮"
 oe_v45_ws.8.desc: "在传统冬麦与大麦频遭反季冻雨摧折的绝境中，农学家与远洋船员向朝廷呈献了跨越重洋而来的美洲奇种：深埋地下、不惧冰雹与乱兵践踏的马铃薯，能在贫瘠荒坡蔓延丰产的番薯，以及单位产量数倍于旧谷的耐寒玉米。守旧乡绅起初对这些外形古怪的块茎疑虑重重，但只要官府在通衢官道旁辟出皇家试种田并配以减税激励，这些美洲高产作物便足以彻底改写小冰期百年的饥馑宿命。"
 oe_v45_ws.8.a: "刊印农政新书并由官府免费派发马铃薯、番薯与玉米良种。"
 oe_v45_ws.8.b: "凡以耐寒新粮开垦荒山瘠地者，一律免征五年田赋。"
 oe_v45_ws.8.c: "谨守历代麦稻轮作旧规，以免新粮扰乱既有地租与什一税核算。"
 oe_v45_ws.9.title: "平准常平仓：以官储稳住寒冬粮价"
 oe_v45_ws.9.desc: "连续三个阴冷多雨的夏季令田间谷穗发芽霉烂，囤积居奇的奸商紧闭私仓静候天价。各省督抚奏报显示，凡建有官办常平仓与义仓、坚持丰年平价收储而荒年低价平粜的州府皆市井安宁，邻近无备之境却早已爆发抢米骚乱。若能将常平赈济制度化并辅以严厉的仓储审计，便能在漫长寒冬中为帝国筑起铜墙铁壁般的民生防线，唯须严防贪墨仓吏暗中掺沙盗粮。"
 oe_v45_ws.9.a: "在全国州县制度化兴建常平仓，并遣御史严查仓吏舞弊。"
 oe_v45_ws.9.b: "令地方商帮与行会与官府合资共储冬粮，分摊财政压力。"
 oe_v45_ws.9.c: "颁布戒严令强行查抄囤粮商栈，将存粮充入军政官仓。"
 oe_v45_ws.10.title: "催科、流民潮与十七世纪动荡"
 oe_v45_ws.10.desc: "纵观整个欧亚大陆，小冰期寒灾对赫赫王朝的杀伤力丝毫不逊于强敌压境。连年歉收令乡里赋税枯竭，而边防与战事开销却恰在此时登顶；焦急的税吏踏雪闯入村落强夺口粮与耕牛，将濒临饿毙的佃农逼成流亡官道的饥民，随时可能汇入流寇与邪教叛乱的洪流。边郡有司联名泣血上疏，恳请朝廷立颁恩诏豁免积欠田赋，莫让饥寒交迫的良善乡民最终揭竿而起。"
 oe_v45_ws.10.a: "立即颁行灾年蠲免农赋恩诏，拨发耕牛口粮安抚流民归乡。"
 oe_v45_ws.10.b: "推行以工代赈，募饥民修筑河堤桥道并抵销积欠税额。"
 oe_v45_ws.10.c: "遣骑兵弹压抗税乡里并强征足额钱粮，确保军饷丝毫不减。"
 oe_v45_ws.11.title: "严冬薪炭荒"
 oe_v45_ws.11.desc: "漫长严冬令伦敦、维也纳、北京与江户的每一座烟囱都须连续半年日夜燃火。城郊林地已被砍伐殆尽以供应民用暖炉、盐灶与玻璃窑，薪柴价格暴涨至工匠无力负担的境地，结冰的河溪更令水力磨坊全面停转。山林督办与工部匠师趁势呈上一份颇具远见的折子：若能借此严冬之机统筹林木轮伐，并大规模开采泥炭与浅层煤炭替代薪柴，不仅可保全珍贵的造船橡木，更为后世工业燃料体系埋下先声。"
 oe_v45_ws.11.a: "颁行科学林木轮伐法，并官办城镇煤炭与泥炭廉价薪栈。"
 oe_v45_ws.11.b: "寒冬期间开放皇家猎苑，准许受冻城镇贫民入林捡拾枯枝。"
 oe_v45_ws.11.c: "严禁民用伐木，所有优质林场一律封存专供海军船坞造舰。"
 oe_v45_ws.12.title: "破冰漕运：跨海紧急调粮大船队"
 oe_v45_ws.12.desc: "当北方平原与高地仍在春末暴风雪中苦苦挣扎之际，地中海沿岸、孟加拉、湄公河与南方水乡的温暖产区依然稻麦丰登。海商行会与漕运总督联手提出一项雄心勃勃的救荒方略：立即豁免一切粮船港税，征调加固冰船与远洋商船，并与温暖产粮区缔结紧急调粮互市协定，绝不让任何一省因天寒而绝粮。诚然，远距离跨海调粮耗资不菲，但凡能驾驭危机后勤的国家，终将在十七世纪大洗牌中脱颖而出。"
 oe_v45_ws.12.a: "签发免税跨海与运河紧急调粮特许，派水师全程护航保畅。"
 oe_v45_ws.12.b: "遣使与南方产粮诸国订立白银换粮的紧急双边贸易协定。"
 oe_v45_ws.12.c: "即刻颁布严厉禁粮出海令，囤积本国存粮以自保无虞。"
 oe_v45_ws.13.title: "启蒙报刊与文人共和国回响"
 oe_v45_ws.13.desc: "从波士顿、费城到巴黎、阿姆斯特丹、里斯本与布宜诺斯艾利斯，穿梭大西洋的快帆邮船如今装载着比火药更易燃的货物：成捆的宪政小册子、阐发分权学说的启蒙论著，以及彼岸议会的逐字辩论录。在我朝各大都市的咖啡馆与读书社里，律师、青年军官与商贾高声诵读着“主权在民与成文法约”的新声。书报检查官紧急请示御前：究竟是查封印坊严加钳制，还是延揽开明士人启动有序的宪政革新？"
 oe_v45_ws.13.a: "放宽报刊言论并延揽启蒙法学家筹议近代宪政改革。"
 oe_v45_ws.13.b: "以君主名义颁布折中改革宣言，兼顾王室法统与公民法权。"
 oe_v45_ws.13.c: "强化皇家书报审查并与友邦君主互通情报，严防激进思潮蔓延。"
 oe_v45_ws.14.title: "制宪厅宣誓：主权归属与税权之争"
 oe_v45_ws.14.desc: "数十年跨洋争霸累积的沉重国债，迫使大西洋两岸诸多朝廷不得不召集三级会议、行省议会与国民制宪大会。然而代表们甫一聚首高耸的穹顶议事厅，便坚决拒绝在未获成文宪法、预算审计权与公开司法保障之前批准任何新税。议事厅外的港湾广场挤满翘首以盼的市民，每当议员高呼颁布《公民权利宣言》便欢声雷动；世袭贵族则痛陈利害，警告一旦交出税权便等同于将王冠拱手让人。"
 oe_v45_ws.14.a: "承认制宪国民议会合法地位，以成文宪法确立议会税权与法治。"
 oe_v45_ws.14.b: "促成两院制宪章妥协，以上院贵族与下院民选代表相互制衡。"
 oe_v45_ws.14.c: "下令解散抗命的制宪集会，以皇权威严捍卫不可分割之主权。"
 oe_v45_ws.15.title: "三色帽徽、街垒与公民武装的崛起"
 oe_v45_ws.15.desc: "边疆异国联军集结的流言与都城面粉短缺的消息，令各大市井街区自黄昏至黎明群情激昂。手工业者、排字工人与太学生将鲜艳帽徽别上帽檐，从市政武库取出滑膛枪在石板广场列队操练，高呼组建效忠于宪政国家而非王朝雇佣兵的国民自卫军。老牌军官纷纷上书警示：这支饱含政治热忱的公民武装，既可能化作所向披靡的护国铁军，也可能在一夜之间摧毁传统军纪。"
 oe_v45_ws.15.a: "正式收编国民自卫军，推行唯才是举的近代军官晋升制度。"
 oe_v45_ws.15.b: "将城镇志愿兵有序纳入正规皇家预备旅，兼具士气与纪律。"
 oe_v45_ws.15.c: "遣精锐常备线列步兵与骑兵解除街头武装社团，严整城防秩序。"
 oe_v45_ws.16.title: "诸王正统协调会议的密约召书"
 oe_v45_ws.16.desc: "面对大洋两岸接连爆发的制宪运动与殖民地共和浪潮，各大君主国的首席宰相齐聚水晶吊灯辉映的宫廷大厅，召开庄严的国际协调会议。他们拟就了一份正统主义同盟议定书，号召列强共守历史疆界、王朝正统与外交联防，协力遏制革命火种跨海蔓延。驻会全权大使急电请示国策：我朝应当签署正统协调同盟、居中斡旋温和宪政方案，还是公开斥责此会乃旧时代专制诸王的枷锁？"
 oe_v45_ws.16.a: "正式加入正统协调同盟，以大国均势共维国际秩序与王朝法统。"
 oe_v45_ws.16.b: "在会上斡旋互不干涉条款，促成开明君主国与共和国和平共处。"
 oe_v45_ws.16.c: "严辞拒绝正统干涉密约，高举宪政自主与民族自决旗帜。"
 oe_v45_ws.17.title: "钦定宪章还是议会至上"
 oe_v45_ws.17.desc: "历经多年慷慨激昂的辩论与波诡云谲的外交危机后，欧美政坛涌现出一批务实政治家。他们深知无论是激进无度的街头风暴，还是僵化脆弱的旧式专制，皆难以长久治理日益复杂的近代商业社会。于是他们拟定了一份凝练的宪政妥协蓝图：司法独立、预算公开、保护产权与信仰宽容，同时保留免受党争频仍颠覆的稳健行政核心。我朝究竟应当采纳这条中庸宪政之道，还是继续高歌猛进抑或重收王权？"
 oe_v45_ws.17.a: "颁行稳健君主立宪妥协宪章，弥合王室、贵族与市民阶层裂痕。"
 oe_v45_ws.17.b: "进一步扩大选民资格，以明文确立议会至上与公民完全主权。"
 oe_v45_ws.17.c: "仅设御前咨议院听取建言，一切最终立法与军政大权仍归君主。"
 oe_v45_ws.18.title: "大西洋自由贸易与宪政新纪元"
 oe_v45_ws.18.desc: "自查尔斯顿、韦拉克鲁斯直至卡塔赫纳与里约热内卢，大西洋彼岸的诸多海港相继冲破封闭的重商主义殖民专卖，直接与欧陆宪政国家及海上共和国缔结通商条约。远洋商船带回的不仅是成舱咖啡、棉花与白银，还有译成六国文字的新宪章范本。随着这场波澜壮阔的革命时代迈向高潮，我朝礼部与商务署必须立即筹谋：如何在这片焕然一新的大西洋格局中重塑本国的海外商权与外交站位？"
 oe_v45_ws.18.a: "率先承认新兴宪政港埠法权，抢先缔结大西洋自由通商协定。"
 oe_v45_ws.18.b: "以中立调停者自居，向大西洋各派势力开放本国金融清算港口。"
 oe_v45_ws.18.c: "以海军护航与正统外交担保力挺旧日宗主帝国，维系传统秩序。"
 oe_v45_ws.19.title: "深井轰鸣"
 oe_v45_ws.19.desc: "数百年来，凡掘进至深层煤田与铁矿脉的矿工，一旦遭遇地下涌水淹没坑道便只能望坑兴叹、被迫弃井。然而就在今日，一座煤灰遍布的矿井口旁，铸铁汽缸喷吐着滚烫白雾，驱动沉重的橡木摇臂无需一匹挽马便将漆黑地下水源源不断地抽排而出。前来观摩的格致学者、铸炮巨匠与矿主无不屏息震撼：人类历史上头一回，沉睡地底的煤炭热能正被直接转化为永不疲倦的机械伟力！"
 oe_v45_ws.19.a: "授予皇家专利并拨发专项经费，大规模推广深井蒸汽抽水机。"
 oe_v45_ws.19.b: "先行在皇家兵工厂与干船坞开展蒸汽机实用试车与改良。"
 oe_v45_ws.19.c: "对喧嚣冒烟的燃煤机械加征重税，以护传统畜力排水与木炭行会。"
 oe_v45_ws.20.title: "乡村纺机与城市行会"
 oe_v45_ws.20.desc: "精明的棉毛商贾已开始绕开享有古老特权的城市行会，一面将原料分发给成百上千户乡村农舍织造，一面在湍急河湾兴建装有多锭纺车的水力大工场。城市行会元老手举发黄的中世纪羊皮纸特许状冲入市政厅抗议，痛斥无序扩张的工场将彻底摧毁百年师徒品控，并令大批手艺帮工流离失所。然而海关账簿却明明白白地显示：率先松绑行会限制的地区，其布匹与器物售价已比守旧对手低廉近半。"
 oe_v45_ws.20.a: "废除束缚产能的行会机台限额，特许大规模水力与手工工场兴办。"
 oe_v45_ws.20.b: "由官府出面调停，吸纳熟练行会师傅担任新式工场技师与领班。"
 oe_v45_ws.20.c: "重申城市行会专营特权并限制乡村机坊，力保传统匠作安稳。"
 oe_v45_ws.21.title: "焦炭高炉：钢铁熔流打破木炭瓶颈"
 oe_v45_ws.21.desc: "昔日铁坊主每逢周边林木枯竭、木炭断供，便只能眼睁睁看着高炉熄火停产。如今，一项足以改写文明史的冶金壮举正在砖砌高炉内迸发炽红金光：将原煤炼制为纯净焦炭后，巍峨高炉得以昼夜不息地连续运转数月，源源浇铸出毫无气孔的优质铁水，用以制造铁桥、蒸汽汽缸、精密机床底座与实心钻膛重炮。兴建焦炭铁冶基地虽须巨额投入，但凡掌控廉价钢铁之国，便握住了近代工业与国防的脊梁。"
 oe_v45_ws.21.a: "官商合资兴建焦炭高炉群与精密钻膛铸炮总厂。"
 oe_v45_ws.21.b: "向率先改用焦炭冶铁的民间铁坊主提供低息皇家长期信贷。"
 oe_v45_ws.21.c: "暂且经海贸采购外洋铸铁件，将国内资本留给利润丰厚的远洋贸易。"
 oe_v45_ws.22.title: "齿轮图谱与皇家综合工艺学院新风"
 oe_v45_ws.22.desc: "单靠孤身匠人在烛光下闭门摸索的时代已渐行渐远。在各地格致学会与皇家科学院内，数学家精确推演锅炉压强，化学家提纯纺织漂白剂与工业硫酸，制图师则将精密齿轮与机械蓝图雕版刊行于世。顶尖学者联名上表请旨，恳求朝廷打破纯古典书院窠臼，创立融汇数理格致与工坊实操的国立综合工艺学院，成批锻造通晓矿冶、水利、机械与炮兵弹道的近代工程栋梁。"
 oe_v45_ws.22.a: "重金创办国立综合工艺学院，附设冶金化学与机械实操工坊。"
 oe_v45_ws.22.b: "设立年度皇家工艺悬赏金，重奖纺织、采煤与水利实用发明。"
 oe_v45_ws.22.c: "维持太学与书院以古典法政、修辞及外交礼仪为主的传统课业。"
 oe_v45_ws.23.title: "船闸运河"
 oe_v45_ws.23.desc: "每逢秋雨泥泞，坑洼土路便死死扼住了原煤与生铁的运输咽喉：一匹挽马在烂泥车辙上竭尽全力仅能拉运一吨煤炭，而若牵引平底驳船行驶在平直运河上，却能轻松拉动三十吨重载平稳穿行于石拱渡槽与多级船闸之间。运河筹建财团在财政厅铺开勘测全图，证明只要打通连接内陆煤田、冶铁高炉与出海良港的人工水网，十年之内即可令全国燃料运价腰斩。"
 oe_v45_ws.23.a: "调遣工部工程师协办全国煤铁航运运河网，贯穿内陆与海港。"
 oe_v45_ws.23.b: "特许民间股份公司集资开凿收费运河，由官府核定通行水闸规费。"
 oe_v45_ws.23.c: "优先修筑便于大军疾行的碎石驿道，暂缓耗资巨大的商用运河工程。"
 oe_v45_ws.24.title: "烟囱新地平线与工场标准化大潮"
 oe_v45_ws.24.desc: "在率先步入早期工业化的广袤热土上，高耸的砖砌烟囱已与教堂尖顶、古老要塞并肩矗立，水力纺机、蒸汽锻锤与矿区铁轨的轰鸣日夜不息。然而爆发式增长亦伴随剧烈阵痛：劣质纺纱、锅炉炸裂与工时纠纷频发，既损及外贸商誉又暗藏都市动荡之忧。商务枢臣齐声吁请设立全国工场标准督察署，推行统一精密度量衡、可互换标准零件与锅炉安全检定，为本国正式迈入蒸汽钢铁时代奠定百年基石。"
 oe_v45_ws.24.a: "设立国立工场标准与精密度量衡督察署，引领高品质工业时代。"
 oe_v45_ws.24.b: "推行全面自由放任政策，免除繁杂检定以换取工场产能极速狂飙。"
 oe_v45_ws.24.c: "严控都城周边重工业烟囱扩张，扶持高附加值精工手工业工坊。"
