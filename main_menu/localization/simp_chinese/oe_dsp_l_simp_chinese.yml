l_simp_chinese:
 oe_dsp_hosted: "在君士坦丁堡受到款待"
 oe_dsp_delayed: "皇帝迟迟不肯续授尊号"
 oe_dsp_snub: "皇帝拒绝续授尊号"
 oe_dsp_thanked: "皇帝婉拒捐资，礼数周全"
 STATIC_MODIFIER_NAME_oe_dsp_walls_inscription: "海墙上的铭文"
 STATIC_MODIFIER_DESC_oe_dsp_walls_inscription: "受帝国册封的专制公出钱修缮海墙，名字刻在了塔楼上。"
 oe_dsp.1.t: "来自安卡拉的客人"
 oe_dsp.1.desc_vassal_west: "#F 1402年7月安卡拉一战后，塞尔维亚的斯特凡·拉扎列维奇取道君士坦丁堡回国。8月，替西行未归的曼努埃尔二世监国的约翰七世，授予斯特凡专制公的尊号。三年后，斯特凡娶了约翰七世皇后的姐妹。#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName]，[SCOPE.sCountry('oe_dsp_tc').GetName]的君主，从奥斯曼人的败军里脱身，正在君士坦丁堡逗留。皇帝仍在西方未归，由监国代为接见。奥斯曼诸王子正在争位，此人想要一个比本国称号更有分量的名分。按[oe_tu_family|e]，此人是“子”，可以受封[oe_tu_dignity|e]。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.1.desc_other_west: "#F 1402年7月安卡拉一战后，塞尔维亚的斯特凡·拉扎列维奇取道君士坦丁堡回国。8月，替西行未归的曼努埃尔二世监国的约翰七世，授予斯特凡专制公的尊号。三年后，斯特凡娶了约翰七世皇后的姐妹。#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName]，[SCOPE.sCountry('oe_dsp_tc').GetName]的君主，趁奥斯曼人内乱来到君士坦丁堡。皇帝仍在西方未归，由监国代为接见。奥斯曼诸王子正在争位，此人想要一个比本国称号更有分量的名分。按[oe_tu_family|e]，此人是“子”，可以受封[oe_tu_dignity|e]。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.1.desc_vassal: "#F 1402年7月安卡拉一战后，塞尔维亚的斯特凡·拉扎列维奇取道君士坦丁堡回国。8月，替西行未归的曼努埃尔二世监国的约翰七世，授予斯特凡专制公的尊号。三年后，斯特凡娶了约翰七世皇后的姐妹。#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName]，[SCOPE.sCountry('oe_dsp_tc').GetName]的君主，从奥斯曼人的败军里脱身，正在君士坦丁堡逗留。奥斯曼诸王子正在争位，此人想要一个比本国称号更有分量的名分。按[oe_tu_family|e]，此人是“子”，可以受封[oe_tu_dignity|e]。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.1.desc_other: "#F 1402年7月安卡拉一战后，塞尔维亚的斯特凡·拉扎列维奇取道君士坦丁堡回国。8月，替西行未归的曼努埃尔二世监国的约翰七世，授予斯特凡专制公的尊号。三年后，斯特凡娶了约翰七世皇后的姐妹。#!\n\n[SCOPE.sCharacter('oe_dsp_tr').GetName]，[SCOPE.sCountry('oe_dsp_tc').GetName]的君主，趁奥斯曼人内乱来到君士坦丁堡。奥斯曼诸王子正在争位，此人想要一个比本国称号更有分量的名分。按[oe_tu_family|e]，此人是“子”，可以受封[oe_tu_dignity|e]。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.1.a: "在布拉赫内宫授予专制公"
 oe_dsp.1.a.tt: "威望#R −20#!，[oe_tu_authority|e]#R −8#!（授予尊号的价码）\n典礼隆重：威望#G +5#!\n[SCOPE.sCharacter('oe_dsp_tr').GetName]终身持有#bold #color_yellow 专制公#!#!尊号（原有较低的尊号收回）；该国对我们的好感#G +40#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +15#!\n该国在#Y 20#!年内与帝国结下#bold #color_yellow 君士坦丁堡之谊#!#!：其君主身为帝国册封的专制公时，帝国危难时最先找它出钱相助"
 oe_dsp.1.b: "授予塞巴斯托克拉托"
 oe_dsp.1.b.tt: "威望#R −15#!，[oe_tu_authority|e]#R −6#!（授予尊号的价码）\n典礼隆重：威望#G +5#!\n[SCOPE.sCharacter('oe_dsp_tr').GetName]终身持有#bold #color_yellow 塞巴斯托克拉托#!#!尊号（原有较低的尊号收回）；该国对我们的好感#G +30#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +12#!\n该国在#Y 20#!年内与帝国结下#bold #color_yellow 君士坦丁堡之谊#!#!：其君主身为帝国册封的专制公时，帝国危难时最先找它出钱相助"
 oe_dsp.1.c: "设宴款待，不授尊号"
 oe_dsp.1.c.tt: "花费#R 1#!个月的贸易与税收收入\n威望#G +2#!\n该国对我们的好感#G +20#!（每年回落#Y 2#!）"
 oe_dsp.2.t: "约阿尼纳的使节"
 oe_dsp.2.desc_son: "#F 1382年，君士坦丁堡新派的大主教代表约翰五世，授予约阿尼纳的托马斯·普雷柳博维奇专制公之号。1386年，帝国使团又为托马斯的继任者、佛罗伦萨人埃萨乌行了授号礼。1415年，曼努埃尔二世授予卡洛·托科同样的尊号。#!\n\n[SCOPE.sCountry('oe_dsp_tc').GetName]的君主[SCOPE.sCharacter('oe_dsp_tr').GetName]据有约阿尼纳，遣使来请皇帝正式承认。按[oe_tu_family|e]，此人的位次：[SCOPE.sCountry('oe_dsp_tc').Custom('OeTwRank')]。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.2.desc_other: "#F 1382年，君士坦丁堡新派的大主教代表约翰五世，授予约阿尼纳的托马斯·普雷柳博维奇专制公之号。1386年，帝国使团又为托马斯的继任者、佛罗伦萨人埃萨乌行了授号礼。1415年，曼努埃尔二世授予卡洛·托科同样的尊号。#!\n\n[SCOPE.sCountry('oe_dsp_tc').GetName]的君主[SCOPE.sCharacter('oe_dsp_tr').GetName]据有约阿尼纳，遣使来请皇帝正式承认。按[oe_tu_family|e]，此人的位次：[SCOPE.sCountry('oe_dsp_tc').Custom('OeTwRank')]。此人不是“子”，按例不能受封专制公。若要破例，得多花些[oe_tu_authority|e]；对方愿意为此送上#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_fee_v').GetValue|0]#!金币的谢礼。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.2.a: "派大主教带去诏书，授予专制公"
 oe_dsp.2.a.tt: "威望#R −20#!，[oe_tu_authority|e]#R −8#!（授予尊号的价码）\n[SCOPE.sCharacter('oe_dsp_tr').GetName]终身持有#bold #color_yellow 专制公#!#!尊号（原有较低的尊号收回）；该国对我们的好感#G +40#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +15#!\n该国在#Y 20#!年内与帝国结下#bold #color_yellow 君士坦丁堡之谊#!#!：其君主身为帝国册封的专制公时，帝国危难时最先找它出钱相助"
 oe_dsp.2.b: "破例授予专制公，收下谢礼"
 oe_dsp.2.b.tt: "威望#R −20#!，[oe_tu_authority|e]#R −12#!（授予尊号的价码，破例另加#Y 4#!）\n谢礼：金币#G +[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_fee_v').GetValue|0]#!\n[SCOPE.sCharacter('oe_dsp_tr').GetName]终身持有#bold #color_yellow 专制公#!#!尊号（原有较低的尊号收回）；该国对我们的好感#G +40#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +15#!\n该国记为#bold #color_yellow 破例受封#!#!：其继任君主也可以遣使请求续授\n该国在#Y 20#!年内与帝国结下#bold #color_yellow 君士坦丁堡之谊#!#!：其君主身为帝国册封的专制公时，帝国危难时最先找它出钱相助"
 oe_dsp.2.c: "授予首席尊者"
 oe_dsp.2.c.tt: "威望#R −10#!，[oe_tu_authority|e]#R −4#!（授予尊号的价码）\n[SCOPE.sCharacter('oe_dsp_tr').GetName]终身持有#bold #color_yellow 首席尊者#!#!尊号（原有较低的尊号收回）；该国对我们的好感#G +25#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +8#!"
 oe_dsp.2.d: "不予理会"
 oe_dsp.3.t: "新君求冠"
 oe_dsp.3.desc_named: "#F 1427年斯特凡·拉扎列维奇去世，侄子久拉贾·布兰科维奇继位。1429年（一说1435年），约翰八世派乔治·菲兰斯罗佩诺斯把专制公的冠冕送到塞尔维亚。1446年，久拉贾之子拉扎尔迎娶托马斯·巴列奥略之女海伦娜，也戴上了专制公的冠冕。#!\n\n[SCOPE.sCountry('oe_dsp_tc').GetName]的上一位君主[SCOPE.sCharacter('oe_dsp_pv').GetName]生前受封专制公。[oe_tu_dignity|e]随人终身，不传给继任者。新君[SCOPE.sCharacter('oe_dsp_tr').GetName]遣使来请皇帝照旧授予。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.3.desc_other: "#F 1427年斯特凡·拉扎列维奇去世，侄子久拉贾·布兰科维奇继位。1429年（一说1435年），约翰八世派乔治·菲兰斯罗佩诺斯把专制公的冠冕送到塞尔维亚。1446年，久拉贾之子拉扎尔迎娶托马斯·巴列奥略之女海伦娜，也戴上了专制公的冠冕。#!\n\n[SCOPE.sCountry('oe_dsp_tc').GetName]的上一位君主生前受封专制公。[oe_tu_dignity|e]随人终身，不传给继任者。新君[SCOPE.sCharacter('oe_dsp_tr').GetName]遣使来请皇帝照旧授予。\n\n不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_dsp.3.a: "送去冠冕"
 oe_dsp.3.a.tt: "威望#R −20#!，[oe_tu_authority|e]#R −8#!（授予尊号的价码）\n续授只付一半：退还威望#G +10#!、[oe_tu_authority|e]#G +4#!（破例受封的国家只退威望）\n[SCOPE.sCharacter('oe_dsp_tr').GetName]终身持有#bold #color_yellow 专制公#!#!尊号（原有较低的尊号收回）；该国对我们的好感#G +40#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +15#!\n该国在#Y 20#!年内与帝国结下#bold #color_yellow 君士坦丁堡之谊#!#!：其君主身为帝国册封的专制公时，帝国危难时最先找它出钱相助"
 oe_dsp.3.b: "先看看此人是否可靠"
 oe_dsp.3.b.tt: "该国对我们的好感#R −10#!（每年回落#Y 2#!）\n#Y 2#!年后对方可以再来请求；只能缓这一次"
 oe_dsp.3.c: "不再授予"
 oe_dsp.3.c.tt: "该国对我们的好感#R −25#!（每年回落#Y 1#!）\n该国不再来请求续授"
 oe_dsp.4.t: "海墙上的铭文"
 oe_dsp.4.desc: "#F 君士坦丁堡海墙上，耶尼卡皮与库姆卡皮之间有一座塔楼，1448年的铭文记下了塞尔维亚专制公乔治（久拉贾）·布兰科维奇的名字。这块石刻今存伊斯坦布尔考古博物馆。#!\n\n帝国正处在危难之中。受我们册封的专制公[SCOPE.sCharacter('oe_dsp_tr').GetName]（[SCOPE.sCountry('oe_dsp_tc').GetName]的君主）送来#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_gift_v').GetValue|0]#!金币，说是给君士坦丁堡修城墙。"
 oe_dsp.4.a: "收下，刻石记功"
 oe_dsp.4.a.tt: "金币#G +[GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_gift_v').GetValue|0]#!\n君士坦丁堡获得[ShowModifier('oe_dsp_walls_inscription')]，持续#Y 20#!年"
 oe_dsp.4.b: "婉言谢绝，不欠人情"
 oe_dsp.4.b.tt: "威望#G +3#!\n该国对我们的好感#G +10#!（每年回落#Y 1#!）"
