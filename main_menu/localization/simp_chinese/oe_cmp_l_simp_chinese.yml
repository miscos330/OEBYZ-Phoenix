 game_concept_oe_tu_company_desc: "#F 拜占庭从没有给本国商人发过公司章程，这里的商社是一个“如果”。它的样子借自热那亚人：一说1346年出钱装备舰队、打下希俄斯的股东们，后来拿到了岛上的收入，这些股东的联合叫作“马奥纳”。#!\n\n罗马商社替帝国经营黑海的[oe_tu_emporion|e]，自己不另设商站。章程有三种：\n帝国专营：国库出本钱，净利全归国库，商社没有自己的主意；\n京城商人合股：商人出本钱，国库分一半净利；\n与热那亚人或威尼斯人合股：合伙人出本钱，国库分四成，合伙人对帝国更有好感。\n每年一月结账：毛利按商站的点数计，减去商站的维持费就是净利，国库按分成拿红利，其余留作本钱。国库在年底缺钱付维持费时，合股的商社先替它垫上。\n合股的商社一年比一年更有主意（自主度），注资和查账能压一压它；自主度到40时，股东会请求包收商税。\n商社成立满#Y 10#!年、商站合计#Y 3#!点以上（或有一处黎凡特的商站）以后，可以在商站旁边向当地的主人买一块沿海的地，或者买下商站所在的街区，也可以与黑海、黎凡特沿岸的小统治者订保护约；卖不卖、订不订，都由对方自己决定。买来的地设为罗马殖民城。\n合股的商社自主度到过#Y 40#!以后，就进入“坐大”：到#Y 70#!时商社会自行其是，到#Y 90#!或连续#Y 2#!年亏空时商社有危机；皇帝随时可以把商社收归国有（国库付本钱的一半给股东）。#Y 1360#!年以后，热那亚人手里的希俄斯的股份也可能出卖。受保护满#Y 10#!年的统治者，可能自愿成为帝国的朝贡国。连续#Y 5#!年失去京城或没有一处商站，商社就散伙。"
