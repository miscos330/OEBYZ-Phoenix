 oe_cmp_buy: "置地"
 oe_cmp_buy_desc: "由[oe_tu_company|e]出钱，在商站旁边向当地的主人买一块沿海的地，或者买下商站所在的街区。\n价钱从商社本钱出：街区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_q')|0]#!金币；一处村落#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_rural_settlement')|0]#!、城镇#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_town')|0]#!、城市#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_city')|0]#!金币。向那里的主人提出请求，由对方答复：卖地、只租一条街，或者回绝；对方是由人操控的国家时由其自己决定。回绝或#Y 2#!个月不答复时退回一半。买来的地设为罗马殖民城，与卖方停战#Y 5#!年；#Y 60#!个月买一处，本期最多#Y 4#!处。\n\n【商社账目】\n章程：[GetCountry('BYZ').Custom('OeCmpHolder')]；本钱#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币；国库分成#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#!；自主度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!（[GetCountry('BYZ').Custom('OeCmpAutoNext')]）\n去年的账：毛利#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!，维持费#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!，净利#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!，国库分得#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!（金币）[GetCountry('BYZ').Custom('OeCmpFarmNow')]\n商站点数：塔纳#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_tana').GetValue|0]#!、卡法#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_kaffa').GetValue|0]#!、特拉比松#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_trebizond').GetValue|0]#!、锡诺普#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_sinop').GetValue|0]#!、瓦尔纳#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_varna').GetValue|0]#!、基利亚#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_chilia').GetValue|0]#!（合计#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!点，今年维持费约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_upkeep_now')|0]#!金币）\n章程[GetCountry('BYZ').Custom('OeCmpStCharter')]\n注资：[GetCountry('BYZ').Custom('OeCmpStInvest')]；查账：[GetCountry('BYZ').Custom('OeCmpStAudit')]\n置地与保护约：[GetCountry('BYZ').Custom('OeCmpStLand')]\n坐大：[GetCountry('BYZ').Custom('OeCmpStGrow')]\n收归国有：[GetCountry('BYZ').Custom('OeCmpStNat')]\n希俄斯的股份：[GetCountry('BYZ').Custom('OeCmpStChios')]"
 oe_cmp_buy_tt: "价钱从商社本钱出：街区#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_q')|0]#!金币；一处村落#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_rural_settlement')|0]#!、城镇#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_town')|0]#!、城市#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_city')|0]#!金币。向那里的主人提出请求，由对方答复：卖地、只租一条街，或者回绝；对方是由人操控的国家时由其自己决定。回绝或#Y 2#!个月不答复时退回一半。买来的地设为罗马殖民城，与卖方停战#Y 5#!年；#Y 60#!个月买一处，本期最多#Y 4#!处。"
 oe_cmp_buy_card: "由罗马商社出钱，在商站旁边买地或买下街区。"
 oe_cmp_buy_select: "选择地点（亮着的可以问）"
 oe_cmp_buy_none: "@trigger_no!眼下没有可以问的地。"
 oe_cmp_protect: "订保护约"
 oe_cmp_protect_desc: "由[oe_tu_company|e]出钱，与黑海、黎凡特沿岸的一位小统治者订保护约。\n向一位小统治者提出保护约，由对方答复。订约后商社每年付#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#!金币给对方，对方对帝国好感#G +20#!，在那里买地更容易；本钱付不起时保护约中止，对方好感#R −10#!。最多#Y 3#!个。\n\n【商社账目】\n章程：[GetCountry('BYZ').Custom('OeCmpHolder')]；本钱#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币；国库分成#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#!；自主度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!（[GetCountry('BYZ').Custom('OeCmpAutoNext')]）\n去年的账：毛利#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!，维持费#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!，净利#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!，国库分得#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!（金币）[GetCountry('BYZ').Custom('OeCmpFarmNow')]\n商站点数：塔纳#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_tana').GetValue|0]#!、卡法#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_kaffa').GetValue|0]#!、特拉比松#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_trebizond').GetValue|0]#!、锡诺普#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_sinop').GetValue|0]#!、瓦尔纳#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_varna').GetValue|0]#!、基利亚#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_chilia').GetValue|0]#!（合计#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!点，今年维持费约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_upkeep_now')|0]#!金币）\n章程[GetCountry('BYZ').Custom('OeCmpStCharter')]\n注资：[GetCountry('BYZ').Custom('OeCmpStInvest')]；查账：[GetCountry('BYZ').Custom('OeCmpStAudit')]\n置地与保护约：[GetCountry('BYZ').Custom('OeCmpStLand')]\n坐大：[GetCountry('BYZ').Custom('OeCmpStGrow')]\n收归国有：[GetCountry('BYZ').Custom('OeCmpStNat')]\n希俄斯的股份：[GetCountry('BYZ').Custom('OeCmpStChios')]"
 oe_cmp_protect_tt: "向一位小统治者提出保护约，由对方答复。订约后商社每年付#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#!金币给对方，对方对帝国好感#G +20#!，在那里买地更容易；本钱付不起时保护约中止，对方好感#R −10#!。最多#Y 3#!个。"
 oe_cmp_protect_card: "由罗马商社出钱，与小统治者订保护约。"
 oe_cmp_protect_select: "选择受保护者的都城（亮着的可以问）"
