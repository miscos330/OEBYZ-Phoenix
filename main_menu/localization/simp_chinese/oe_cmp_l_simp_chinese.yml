 oe_cmp_nationalise: "收归国有"
 oe_cmp_nationalise_desc: "把[oe_tu_company|e]从股东手里收回来，改为帝国专营。\n国库付给股东#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_nat_cost')|0]#!金币（本钱的一半）；商社改为帝国专营：国库分成100%，自主度归零，以后不会再坐大；商税包收（如有）就此结束；京城商人合股时市民阶层满意度#R −5%#!；与意大利人合股时[GetCountry('BYZ').Custom('OeCmpPartner')]对帝国好感#R −20#!，持续#Y 10#!年。\n\n【商社账目】\n章程：[GetCountry('BYZ').Custom('OeCmpHolder')]；本钱#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币；国库分成#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#!；自主度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!（[GetCountry('BYZ').Custom('OeCmpAutoNext')]）\n去年的账：毛利#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!，维持费#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!，净利#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!，国库分得#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!（金币）[GetCountry('BYZ').Custom('OeCmpFarmNow')]\n商站点数：塔纳#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_tana').GetValue|0]#!、卡法#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_kaffa').GetValue|0]#!、特拉比松#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_trebizond').GetValue|0]#!、锡诺普#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_sinop').GetValue|0]#!、瓦尔纳#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_varna').GetValue|0]#!、基利亚#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_chilia').GetValue|0]#!（合计#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!点，今年维持费约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_upkeep_now')|0]#!金币）\n章程[GetCountry('BYZ').Custom('OeCmpStCharter')]\n注资：[GetCountry('BYZ').Custom('OeCmpStInvest')]；查账：[GetCountry('BYZ').Custom('OeCmpStAudit')]\n置地与保护约：[GetCountry('BYZ').Custom('OeCmpStLand')]\n坐大：[GetCountry('BYZ').Custom('OeCmpStGrow')]\n收归国有：[GetCountry('BYZ').Custom('OeCmpStNat')]\n希俄斯的股份：[GetCountry('BYZ').Custom('OeCmpStChios')]"
 oe_cmp_nationalise_tt: "国库付给股东#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_nat_cost')|0]#!金币（本钱的一半）；商社改为帝国专营：国库分成100%，自主度归零，以后不会再坐大；商税包收（如有）就此结束；京城商人合股时市民阶层满意度#R −5%#!；与意大利人合股时[GetCountry('BYZ').Custom('OeCmpPartner')]对帝国好感#R −20#!，持续#Y 10#!年。"
 oe_cmp_nationalise_card: "把罗马商社从股东手里收回，改为帝国专营。"
 oe_cmp.1.t: "章程"
 oe_cmp.1.d1: "#F 1346年，夺取希俄斯的热那亚舰队是由私人股东出钱装备的；一说公社还不起这笔钱，便把岛上的收入交给了股东们，这些股东的联合叫作“马奥纳”。1348年，约翰六世降低关税、借钱造船，想让帝国在粮食和海运上不再仰赖加拉塔。#!\n\n在[SCOPE.sLocation('oe_cmp_site').GetName]经营商馆的京城商人们联名上书。商人们说，帝国的[oe_tu_emporion|e]眼下合计#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!点，可各家各管一摊，货船自己张罗，出了事没人做主。商人们请皇帝颁一纸章程，把这些商站交给一家[oe_tu_company|e]经营：它有自己的本钱，赚了钱和国库分账。[GetCountry('BYZ').Custom('OeCmpE1Native')][GetCountry('BYZ').Custom('OeCmpE1Monem')]\n章程交给谁，决定谁出本钱、国库分多少、商社以后有多大的主意。"
 oe_cmp.1.d2: "#F 1346年，夺取希俄斯的热那亚舰队是由私人股东出钱装备的；一说公社还不起这笔钱，便把岛上的收入交给了股东们，这些股东的联合叫作“马奥纳”。1348年，约翰六世降低关税、借钱造船，想让帝国在粮食和海运上不再仰赖加拉塔。#!\n\n京城的商人们联名上书。商人们说，帝国的[oe_tu_emporion|e]眼下合计#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!点，可各家各管一摊，货船自己张罗，出了事没人做主。商人们请皇帝颁一纸章程，把这些商站交给一家[oe_tu_company|e]经营：它有自己的本钱，赚了钱和国库分账。[GetCountry('BYZ').Custom('OeCmpE1Native')][GetCountry('BYZ').Custom('OeCmpE1Monem')]\n章程交给谁，决定谁出本钱、国库分多少、商社以后有多大的主意。"
 oe_cmp.1.a: "由帝国专营"
 oe_cmp.1.a.tt: "国库出本钱#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_a')|0]#!金币（#Y 4#!个月的收入；要另有#Y 2#!个月储备）\n净利全归国库；商社没有自己的主意（自主度一直是#Y 0#!）\n市民阶层满意度#R −5%#!\n此后每年一月结一次账；开放柱石面板“财政诏令”里“商社”一组的两个行动：向商社注资、查账"
 oe_cmp.1.b: "由京城商人合股"
 oe_cmp.1.b.tt: "商人们凑出本钱#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_b')|0]#!金币，国库不出钱\n国库分得净利的#Y 50%#!\n商社每年自主度#R +2#!再加商站点数\n市民阶层满意度#G +5%#!\n此后每年一月结一次账；开放柱石面板“财政诏令”里“商社”一组的两个行动：向商社注资、查账"
 oe_cmp.1.c: "与热那亚人合股"
 oe_cmp.1.c.tt: "热那亚的股东出本钱#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_c')|0]#!金币\n国库分得净利的#Y 40%#!\n自主度从#R 10#!起，每年的增长是京城商人合股的#Y 1.5#!倍\n热那亚对帝国好感#G +15#!，持续#Y 10#!年\n此后每年一月结一次账；开放柱石面板“财政诏令”里“商社”一组的两个行动：向商社注资、查账"
 oe_cmp.1.d: "与威尼斯人合股"
 oe_cmp.1.d.tt: "威尼斯的股东出本钱#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_c')|0]#!金币\n国库分得净利的#Y 40%#!\n自主度从#R 10#!起，每年的增长是京城商人合股的#Y 1.5#!倍\n威尼斯对帝国好感#G +15#!，持续#Y 10#!年\n此后每年一月结一次账；开放柱石面板“财政诏令”里“商社”一组的两个行动：向商社注资、查账"
 oe_cmp.1.e: "暂不设立"
 oe_cmp.1.e.tt: "#Y 10#!年后商人们会再来请求；再拒绝一次，此事就不再提起"
 oe_cmp.2.t: "第一年的账"
 oe_cmp.2.d1: "#F 威尼斯的大商船由国家建造，每年按航线拍给商人合伙经营、结队出航；一说这就是人们所说的“穆达”。#!\n\n帝国专营的[oe_tu_company|e]结出了第一年的账：毛利#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!金币，商站维持费#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!金币，净利#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!金币。毛利已全数入了国库，商站的维持费由国库自付，国库净得#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!金币。商社本钱现有#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币，自主度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!。\n管账的官员问：这笔钱是留在国库，还是拨回商社，留作扩张的本钱？"
 oe_cmp.2.d2: "#F 威尼斯的大商船由国家建造，每年按航线拍给商人合伙经营、结队出航；一说这就是人们所说的“穆达”。#!\n\n[oe_tu_company|e]（[GetCountry('BYZ').Custom('OeCmpHolder')]）结出了第一年的账：毛利#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!金币，商站维持费#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!金币，净利#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!金币。照章程，国库分得净利的#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#!，即#G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!金币，已经入库。商社本钱现有#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币，自主度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!。\n股东们想把今年的红利留在商社里；户部的人却说，章程上国库的那一份还嫌少了。"
 oe_cmp.2.a: "照章分红"
 oe_cmp.2.a.tt: "账照年结办理，不再变动"
 oe_cmp.2.b: "今年的红利留作本钱"
 oe_cmp.2.b.tt: "国库退回今年的红利#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!金币，记入商社本钱\n商社自主度#R +5#!\n京城商人合股时市民阶层满意度#G +5%#!；与意大利人合股时[GetCountry('BYZ').Custom('OeCmpPartner')]对帝国好感#G +5#!，持续#Y 5#!年"
 oe_cmp.2.c: "抽成加码"
 oe_cmp.2.c.tt: "国库分成#G +10#!个百分点（最多比章程原值高#Y 20#!），从明年的账起\n商社自主度#G −5#!\n京城商人合股时市民阶层满意度#R −5%#!；与意大利人合股时[GetCountry('BYZ').Custom('OeCmpPartner')]对帝国好感#R −10#!，持续#Y 5#!年"
 oe_cmp.2.d: "入国库"
 oe_cmp.2.d.tt: "钱留在国库"
 oe_cmp.2.e: "留作扩张的本钱"
 oe_cmp.2.e.tt: "国库拿出今年的净利#R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#!金币，记入商社本钱"
 oe_cmp.3.t: "股东的请求"
 oe_cmp.3.d1: "#F 帝国向来把一地的税包给出价最高的人去收，史料称这些人为包税人。一说热那亚人在希俄斯，也是这样把岛上的收入攥在了手里。#!\n\n[oe_tu_company|e]的股东们请求：把从[SCOPE.sLocation('oe_cmp_site').GetName]一路运进京城的货物所纳的一成商税，包给商社去收。商社每年交一笔定额，多收的归自己。国库每年少收一些关税，商社每年毛利多#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#!金币；商社也多了几分底气。"
 oe_cmp.3.d2: "#F 帝国向来把一地的税包给出价最高的人去收，史料称这些人为包税人。一说热那亚人在希俄斯，也是这样把岛上的收入攥在了手里。#!\n\n[oe_tu_company|e]的股东们请求：把黑海来货所纳的一成商税，包给商社去收。商社每年交一笔定额，多收的归自己。国库每年少收一些关税，商社每年毛利多#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#!金币；商社也多了几分底气。"
 oe_cmp.3.a: "准其包收"
 oe_cmp.3.a.tt: "获得[ShowModifier('oe_cmp_customs_farmed')]，持续#Y 20#!年\n其间商社每年毛利多#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#!金币\n商社自主度#R +10#!"
 oe_cmp.3.b: "只准十年"
 oe_cmp.3.b.tt: "获得[ShowModifier('oe_cmp_customs_farmed')]，持续#Y 10#!年\n其间商社每年毛利多#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#!金币\n商社自主度#R +5#!"
 oe_cmp.3.c: "驳回"
 oe_cmp.3.c.tt: "花费#R 1#![oe_tu_authority|e]\n商社自主度#G −10#!\n京城商人合股时市民阶层满意度#R −5%#!；与意大利人合股时[GetCountry('BYZ').Custom('OeCmpPartner')]对帝国好感#R −10#!，持续#Y 5#!年"
 oe_cmp.11.t: "罗马人想买地"
 oe_cmp.11.d1: "#F 一说十四世纪的特拉比松皇帝先后把城中的街区和货栈给了威尼斯人和热那亚人，让外国商人自己管。#!\n\n君士坦丁堡的[oe_tu_company|e]派人来，愿出#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#!金币，买下[SCOPE.sLocation('oe_cmp_land').GetName]罗马商馆所在的那条街：街上的货栈、码头和住处从此归罗马商人自己管，可以筑墙，由皇帝派来的法官断案。地方仍然归我们。[GetCountry('BYZ').Custom('OeCmpE11Grant')]"
 oe_cmp.11.d2: "#F 一说十四世纪的特拉比松皇帝先后把城中的街区和货栈给了威尼斯人和热那亚人，让外国商人自己管。#!\n\n君士坦丁堡的[oe_tu_company|e]派人来，愿出#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#!金币，买下[SCOPE.sLocation('oe_cmp_land').GetName]一带的海岸：罗马商人在近旁有商馆，想要自己的码头和田地。来人说，地归了罗马人以后，照罗马的规矩设官治理。[GetCountry('BYZ').Custom('OeCmpE11Street')]"
 oe_cmp.11.a: "把地卖给罗马人"
 oe_cmp.11.a.tt: "[SCOPE.sLocation('oe_cmp_land').GetName]归拜占庭所有（那里设为罗马殖民城）\n我们得到#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#!金币\n与拜占庭停战#Y 5#!年\n我们对罗马人好感#R −5#!，持续#Y 5#!年"
 oe_cmp.11.b: "只租给罗马人一条街"
 oe_cmp.11.b.tt: "[SCOPE.sLocation('oe_cmp_street').GetName]的罗马商站升为特许商区（地方仍然归我们）\n我们得到#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#!金币"
 oe_cmp.11.c: "准罗马人买下这条街"
 oe_cmp.11.c.tt: "[SCOPE.sLocation('oe_cmp_land').GetName]的罗马商站升为特许商区：有围墙，有皇帝的法官（地方仍然归我们）\n我们得到#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#!金币"
 oe_cmp.11.d: "回绝"
 oe_cmp.11.d.tt: "罗马人几年内不会再来问（#Y 5#!年；不由人操控的国家#Y 2#!年）"
 oe_cmp.12.t: "对方的答复"
 oe_cmp.12.d1: "[SCOPE.sCountry('oe_cmp_seller').GetName]答应了：[SCOPE.sLocation('oe_cmp_land').GetName]一带的海岸卖给[oe_tu_company|e]，价钱#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#!金币。立约过户以后，那里设为罗马殖民城。"
 oe_cmp.12.d2: "[SCOPE.sCountry('oe_cmp_seller').GetName]答应了：[SCOPE.sLocation('oe_cmp_land').GetName]罗马商馆所在的那条街归罗马商人，价钱#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#!金币。"
 oe_cmp.12.d3: "[SCOPE.sCountry('oe_cmp_seller').GetName]不肯卖地，只肯在[SCOPE.sLocation('oe_cmp_street').GetName]给罗马商馆让出一条街，收一半的价钱#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#!金币；另一半退回商社。"
 oe_cmp.12.d4: "[SCOPE.sCountry('oe_cmp_seller').GetName]接受了[oe_tu_company|e]的保护约。"
 oe_cmp.12.d5: "[SCOPE.sCountry('oe_cmp_seller').GetName]谢绝了[oe_tu_company|e]的保护约。"
 oe_cmp.12.d6: "[SCOPE.sCountry('oe_cmp_seller').GetName]一直没有答复。照规矩，这份保护约作罢。"
 oe_cmp.12.d7: "[SCOPE.sCountry('oe_cmp_seller').GetName]一直没有答复。照规矩，这桩请求作罢，商社退回一半的钱（#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#!金币）。"
 oe_cmp.12.d8: "[SCOPE.sCountry('oe_cmp_seller').GetName]回绝了。商社花在路上和礼物上的钱拿不回来，退回一半（#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#!金币）。"
 oe_cmp.12.a: "立约过户"
 oe_cmp.12.a.tt: "[SCOPE.sLocation('oe_cmp_land').GetName]归帝国所有，随后设为罗马殖民城（弹出“新殖民城”）\n与[SCOPE.sCountry('oe_cmp_seller').GetName]停战#Y 5#!年\n[SCOPE.sCountry('oe_cmp_seller').GetName]对帝国好感#R −5#!，持续#Y 5#!年\n每年毛利多#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_land_amt')|0]#!金币（这块地还在帝国手里时）\n商社#Y 60#!个月内不再买地"
 oe_cmp.12.b: "立约"
 oe_cmp.12.b.tt: "[SCOPE.sLocation('oe_cmp_land').GetName]的商站升为特许商区（#G +2#!点）"
 oe_cmp.12.c: "就这样"
 oe_cmp.12.c.tt: "[SCOPE.sLocation('oe_cmp_street').GetName]的商站升为特许商区（#G +2#!点）\n商社本钱收回#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#!金币"
 oe_cmp.12.d: "订约"
 oe_cmp.12.d.tt: "商社每年付给[SCOPE.sCountry('oe_cmp_seller').GetName]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#!金币（本钱不够时保护约中止）\n[SCOPE.sCountry('oe_cmp_seller').GetName]对帝国好感#G +20#!（保护约期间）\n在[SCOPE.sCountry('oe_cmp_seller').GetName]那里买地，对方答应的几率#G +20#!个百分点"
 oe_cmp.12.e: "记下"
 oe_cmp.12.e.tt: "[SCOPE.sCountry('oe_cmp_seller').GetName]#Y 2#!年内不再问"
 oe_cmp.12.f: "只好作罢"
 oe_cmp.12.f.tt: "商社本钱收回#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#!金币\n[SCOPE.sCountry('oe_cmp_seller').GetName]几年内不再问（#Y 5#!年；不由人操控的国家#Y 2#!年）"
 oe_cmp.13.t: "罗马商社的保护约"
 oe_cmp.13.desc: "君士坦丁堡的[oe_tu_company|e]派人来，提出一份保护约：商社每年付给我们#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#!金币，我们的港口对罗马商人敞开；有事的时候，商社替我们在皇帝面前说话。来人说，这份约不要我们称臣，也不要我们出兵。"
 oe_cmp.13.a: "订约"
 oe_cmp.13.a.tt: "每年从罗马商社得到#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#!金币\n我们对罗马人好感#G +20#!（保护约期间）\n罗马人在我们这里买地，我们答应的几率#Y 20#!个百分点（我们自己仍然可以回绝）"
 oe_cmp.13.b: "谢绝"
 oe_cmp.13.b.tt: "罗马人#Y 2#!年内不会再来问"
 oe_cmp.14.t: "商社的船期"
 oe_cmp.14.desc: "#F 威尼斯的商船每年按定好的日子结队出港，往罗马尼亚和黑海，往亚历山大和贝鲁特；一说这样的船期就叫“穆达”。#!\n\n[oe_tu_company|e]成立已满十年，商站合计#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!点。股东们提出：商社的船从此也定下日子、结队出航，自己雇水手、自己担风险；也有人说，不如把货交给[GetCountry('BYZ').Custom('OeCmpE14Who')]的船队，省钱省事。\n此后柱石面板“财政诏令”里“商社”一组多两个行动：置地、订保护约。"
 oe_cmp.14.a: "自组船期"
 oe_cmp.14.a.tt: "获得[ShowModifier('oe_cmp_own_convoys')]，持续#Y 10#!年"
 oe_cmp.14.b: "搭意大利人的船"
 oe_cmp.14.b.tt: "[GetCountry('BYZ').Custom('OeCmpE14Who')]对帝国好感#G +10#!，持续#Y 10#!年"
 oe_cmp.20.t: "商社自行其是"
 oe_cmp.20.desc: "#F 1407年，热那亚把公债并给了圣乔治银行；后来连黑海的殖民地，也交给银行的官员去治理。#!\n\n[oe_tu_company|e]的自主度已到#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!。股东们在各处商馆里自己定价、自己雇船、自己同外国人谈条件，朝廷派去的官员反倒要看商馆的脸色；京城里有人说，商社快成了一个小朝廷。"
 oe_cmp.20.a: "默认既成事实"
 oe_cmp.20.a.tt: "商社自主度#R +5#!\n国库分成#R −5#!个百分点"
 oe_cmp.20.b: "派官员去港口"
 oe_cmp.20.b.tt: "花费#R 3#![oe_tu_authority|e]\n商社自主度#G −20#!"
 oe_cmp.20.c: "要商社替帝国出一支船"
 oe_cmp.20.c.tt: "商社本钱拿出#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_e20c_fund')|0]#!金币为帝国装船\n国库得到船款#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_e20c_gold')|0]#!金币\n商社自主度#G −10#!"
 oe_cmp.21.t: "受保护者的选择"
 oe_cmp.21.desc: "[oe_tu_company|e]的保护约订了已有#Y 10#!年。君士坦丁堡来人说，皇帝愿意收我们为朝贡之国：每年遣使献礼，皇帝赐给[oe_tu_dignity|e]与庇护；商社的保护约就此结束，往后由皇帝的朝廷照应。来人说，这只是名分上的事，不要我们的地，也不派官来。"
 oe_cmp.21.a: "成为皇帝的朝贡国"
 oe_cmp.21.a.tt: "我们成为拜占庭的朝贡国\n罗马商社的保护约结束，保护费不再付"
 oe_cmp.21.b: "维持保护约"
 oe_cmp.21.b.tt: "保护约照旧；#Y 10#!年内罗马人不再提起此事"
 oe_cmp.22.t: "希俄斯的股份"
 oe_cmp.22.desc: "#F 一说热那亚人打下希俄斯以后，出钱的股东们结成“马奥纳”，拿岛上的收入；又一说马奥纳在1360年代承认皇帝为名义上的宗主，每年向君士坦丁堡交一笔岁贡。#!\n\n[SCOPE.sLocation('oe_cmp_land').GetName]如今在[SCOPE.sCountry('oe_cmp_seller').GetName]手里，岛上的收入由热那亚的股东们经营。[oe_tu_company|e]的人打听到，有几家股东想把股份脱手。商社本钱现有#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币。"
 oe_cmp.22.a: "买下马奥纳的股份"
 oe_cmp.22.a.tt: "商社本钱付给[SCOPE.sCountry('oe_cmp_seller').GetName]#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_chios_price')|0]#!金币\n[SCOPE.sLocation('oe_cmp_land').GetName]归帝国所有，随后设为罗马殖民城（弹出“新殖民城”）\n[SCOPE.sCountry('oe_cmp_seller').GetName]与热那亚对帝国好感#R −20#!，持续#Y 10#!年\n热那亚的特权升一级（作补偿）\n与[SCOPE.sCountry('oe_cmp_seller').GetName]停战#Y 5#!年"
 oe_cmp.22.b: "只买每年的岁贡"
 oe_cmp.22.b.tt: "商社本钱付给[SCOPE.sCountry('oe_cmp_seller').GetName]#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_chios_trib_price')|0]#!金币\n此后#Y 20#!年，国库每年一月得#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_chios_trib_amt')|0]#!金币（希俄斯还在热那亚一方手里时）"
 oe_cmp.22.c: "不买"
 oe_cmp.22.c.tt: "此事不再提起"
 oe_cmp.23.t: "商社的危机"
 oe_cmp.23.d1: "#F 热那亚的公社欠股东的钱还不起，就把一处处收入交给股东们去收；后来公债都并进了圣乔治银行，银行比公社还有钱。#!\n\n[oe_tu_company|e]连续#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_short').GetValue|0]#!年亏空，本钱只剩#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#!金币。股东们来见皇帝：要么朝廷把商社接过去，要么少抽些分成，让商社喘口气。"
 oe_cmp.23.d2: "#F 热那亚的公社欠股东的钱还不起，就把一处处收入交给股东们去收；后来公债都并进了圣乔治银行，银行比公社还有钱。#!\n\n[oe_tu_company|e]的自主度到了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!。股东们不再等户部的批文，自己同外国的君主订约，京城的人都在问：商社究竟听谁的？"
 oe_cmp.23.a: "收归国有"
 oe_cmp.23.a.tt: "国库付给股东#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_nat_cost')|0]#!金币（本钱的一半）\n商社改为帝国专营：国库分成100%，自主度归零，以后不会再坐大\n商税包收（如有）就此结束\n京城商人合股时市民阶层满意度#R −5%#!；与意大利人合股时[GetCountry('BYZ').Custom('OeCmpPartner')]对帝国好感#R −20#!，持续#Y 10#!年"
 oe_cmp.23.b: "让步"
 oe_cmp.23.b.tt: "国库分成#R −10#!个百分点\n商社自主度#G −30#!"
 oe_cmp.23.c: "交给合伙人"
 oe_cmp.23.c.tt: "[GetCountry('BYZ').Custom('OeCmpPartner')]在帝国的特权升一级\n国库分成固定为#Y 20%#!\n不再记自主度：商社不会再有危机，也不能再收归国有"
 oe_cmp.24.t: "商社散伙"
 oe_cmp.24.d1: "（测试按钮）[oe_tu_company|e]奉命立即散伙，章程作废。受商社保护的统治者各自散去。[GetCountry('BYZ').Custom('OeCmpE24Fund')]"
 oe_cmp.24.d2: "君士坦丁堡如今不在帝国手里；[oe_tu_company|e]已经连续#Y 5#!年无处经营（没有京城，或没有一处开着的商站），章程无处可用。受商社保护的统治者各自散去。[GetCountry('BYZ').Custom('OeCmpE24Fund')]"
 oe_cmp.24.d3: "[oe_tu_company|e]已经连续#Y 5#!年无处经营（没有京城，或没有一处开着的商站），无事可做，章程作废。受商社保护的统治者各自散去。[GetCountry('BYZ').Custom('OeCmpE24Fund')]"
 oe_cmp.24.a: "就这样吧"
 oe_cmp.24.a.tt: "本线到此结束"
