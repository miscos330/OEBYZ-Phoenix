l_simp_chinese:
 oe_cof_latin_learning: "通晓拉丁学问的宫廷"
 oe_cof_galata_tolls: "金角湾的关税战"
 STATIC_MODIFIER_NAME_oe_cof_domestikos_command: "多梅斯蒂科斯督战"
 STATIC_MODIFIER_DESC_oe_cof_domestikos_command: "多梅斯蒂科斯的军事能力不低于#Y 60#!。征伐进行期间，战争压力每月#G −1#!。"
 STATIC_MODIFIER_NAME_oe_cof_domestikos_inept: "多梅斯蒂科斯不谙军务"
 STATIC_MODIFIER_DESC_oe_cof_domestikos_inept: "多梅斯蒂科斯的军事能力低于#Y 30#!。征伐进行期间，战争压力每月#R +1#!。"
 STATIC_MODIFIER_NAME_oe_cof_admiral_convoys: "大都督护航"
 STATIC_MODIFIER_DESC_oe_cof_admiral_convoys: "海军大都督的军事能力不低于#Y 60#!。海上征伐（埃及、北非、意大利、黑海）进行期间，战争压力每月#G −1#!。"
 STATIC_MODIFIER_NAME_oe_cof_admiral_ports: "大都督的港口"
 STATIC_MODIFIER_DESC_oe_cof_admiral_ports: "海军大都督的人掌管着几处港口的关税，作为大都督自费整修战船的回报。"
 STATIC_MODIFIER_NAME_oe_cof_horn_trade: "金角湾的商船"
 STATIC_MODIFIER_DESC_oe_cof_horn_trade: "降低关税之后，过往海峡的商船改到金角湾南岸靠港。"
 STATIC_MODIFIER_NAME_oe_cof_jewels_pawned: "皇冠珠宝在当铺"
 STATIC_MODIFIER_DESC_oe_cof_jewels_pawned: "帝国的皇冠珠宝押在威尼斯。赎回之前，每一次大典都提醒人们帝国有多穷。"
 oe_cof.1.t: "首席大臣的家财"
 oe_cof.1.desc: "特奥多尔·梅托希特斯从1305年起做安德罗尼卡二世的梅萨宗，替皇帝处理文书、传达旨意，后来又升任大罗格塞特。他成了当时最富有的人之一，出钱重修了科拉修道院，门廊的镶嵌画里还有他把教堂献给基督的画像。1328年老皇帝被孙子推翻，他跟着失势，家产全部没收，人被流放到狄迪摩提洪，四年后以修士的身份死在科拉。如今首席大臣[SCOPE.sCharacter('oe_cof_holder').GetName]的宅邸越修越大，[SCOPE.sCharacter('oe_cof_holder').GetSheHe]还认捐了城里的一座修道院。京城里有人说，这些钱来得太快了。\n\n首席大臣[SCOPE.sCharacter('oe_cof_holder').GetName]：行政能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.1.a: "由[SCOPE.sCharacter('oe_cof_holder').GetSheHe]去"
 oe_cof.1.a.tt: "威望#G +5#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]出身帝国大家族：该家族影响力#Y +30#!\n[oe_tu_authority|e]#R −2#!"
 oe_cof.1.b: "查[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的账"
 oe_cof.1.b.tt: "若[SCOPE.sCharacter('oe_cof_holder').GetName]行政能力不低于#Y 60#!：[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的账做得滴水不漏，只查出金币#G +75#!；否则：查出金币#G +150#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]出身帝国大家族：该家族影响力#Y −20#!"
 oe_cof.1.c: "照1328年的办法：撤职抄家"
 oe_cof.1.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去首席大臣之职，该职位空出，加成立即停止\n正统性#R −5#!\n金币#G +250#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]出身帝国大家族：该家族影响力#Y −50#!\n[oe_tu_authority|e]#G +3#!"
 oe_cof.2.t: "两支笔"
 oe_cof.2.desc: "尼基福罗斯·乔姆诺斯1294年起做安德罗尼卡二世的梅萨宗，第二年又执掌御前文书。1305年，梅萨宗一职给了特奥多尔·梅托希特斯，乔姆诺斯后来被派去治理塞萨洛尼基。到了1320年代，两人写了一篇又一篇文章互相攻击：乔姆诺斯说梅托希特斯的文字晦涩难懂，梅托希特斯讥笑乔姆诺斯不懂天文。如今首席大臣[SCOPE.sCharacter('oe_cof_holder').GetName]和首席秘书官[SCOPE.sCharacter('oe_cof_holder2').GetName]也在御前互不相让，同一份公文在两人之间退回了三次。"
 oe_cof.2.a: "支持首席大臣，把[SCOPE.sCharacter('oe_cof_holder2').GetName]派去[SCOPE.sCountry('oe_cof_theme').GetName]"
 oe_cof.2.a.tt: "[SCOPE.sCharacter('oe_cof_holder2').GetName]被撤去首席秘书官之职，该职位空出，加成立即停止\n[SCOPE.sCountry('oe_cof_theme').GetName]民政效率#G +15#!（#Y 5#!年）\n[oe_tu_authority|e]#G +2#!"
 oe_cof.2.b: "支持首席大臣"
 oe_cof.2.b.tt: "[SCOPE.sCharacter('oe_cof_holder2').GetName]被撤去首席秘书官之职，该职位空出，加成立即停止\n[oe_tu_authority|e]#G +2#!"
 oe_cof.2.c: "支持首席秘书官"
 oe_cof.2.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去首席大臣之职，该职位空出，加成立即停止\n正统性#R −5#!\n若[SCOPE.sCharacter('oe_cof_holder2').GetName]出身帝国大家族：该家族影响力#Y +30#!"
 oe_cof.2.d: "两人都留下，让他们写文章去"
 oe_cof.2.d.tt: "威望#G +5#!\n[oe_tu_authority|e]#R −3#!"
 oe_cof.3.t: "审判官受审"
 oe_cof.3.desc: "1329年，安德罗尼卡三世把旧有的十二人法庭改为四人，称“罗马人的普遍审判官”，其中至少一人是主教。没过几年，四人中有三人被控受贿。阿普罗斯主教约瑟夫、格拉巴斯和克莱达斯被判有罪，退还收下的钱，交出法官职位，被逐出君士坦丁堡，只有马塔兰戈斯无罪。审判官制度并没有因此废除，一直延续到帝国末年。如今普遍审判官[SCOPE.sCharacter('oe_cof_holder').GetName]也被人告到了御前。\n\n普遍审判官[SCOPE.sCharacter('oe_cof_holder').GetName]：行政能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.3.a: "公开审理，像1337年那样"
 oe_cof.3.a.tt: "#Y 50%#!：[SCOPE.sCharacter('oe_cof_holder').GetSheHe]被判有罪，退还赃款：金币#G +100#!，[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去普遍审判官之职，该职位空出，加成立即停止，[oe_tu_authority|e]#G +3#!，法官由中央委派的各军区：司法效率#G +10#!（#Y 5#!年）\n#Y 50%#!：[SCOPE.sCharacter('oe_cof_holder').GetSheHe]被判无罪，继续留任：威望#G +5#!，帝国权威#G +2#!"
 oe_cof.3.b: "私下罚款，让[SCOPE.sCharacter('oe_cof_holder').GetSheHe]留任"
 oe_cof.3.b.tt: "金币#G +60#!\n法官由中央委派的各军区：司法效率#R −10#!（#Y 5#!年）"
 oe_cof.3.c: "撤换[SCOPE.sCharacter('oe_cof_holder').GetSheHe]，由[SCOPE.sCharacter('oe_cof_cand').GetName]接任"
 oe_cof.3.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去普遍审判官之职，该职位空出，加成立即停止\n[SCOPE.sCharacter('oe_cof_cand').GetName]接任普遍审判官\n正统性#R −5#!"
 oe_cof.4.t: "各省的审判官"
 oe_cof.4.desc: "14世纪里，普遍审判官的做法从君士坦丁堡推广出去，塞萨洛尼基、摩里亚和利姆诺斯都设立了自己的审判官合议庭。如今普遍审判官[SCOPE.sCharacter('oe_cof_holder').GetName]上书说，[SCOPE.sCountry('oe_cof_theme').GetName]的诉讼堆积如山，案子都由[SCOPE.sCharacter('oe_cof_strategos').GetName]的亲信审理，请求派一位朝廷法官常驻那里。\n\n普遍审判官[SCOPE.sCharacter('oe_cof_holder').GetName]：行政能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.4.a: "派朝廷法官常驻[SCOPE.sCountry('oe_cof_theme').GetName]"
 oe_cof.4.a.tt: "[SCOPE.sCountry('oe_cof_theme').GetName]的法官改由中央委派（与军区属官的同名选项相同：俸禄每月由国库支付，#Y 2#!年内不能再调整属官）\n[SCOPE.sCountry('oe_cof_theme').GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_cof.4.b: "让[SCOPE.sCharacter('oe_cof_holder').GetName]亲自去巡视一趟"
 oe_cof.4.b.tt: "金币#R −50#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]行政能力不低于#Y 60#!：[SCOPE.sCountry('oe_cof_theme').GetName]司法效率#G +15#!（#Y 5#!年）；否则：[SCOPE.sCountry('oe_cof_theme').GetName]司法效率#G +5#!（#Y 5#!年）"
 oe_cof.4.c: "地方的事由地方办"
 oe_cof.4.c.tt: "[SCOPE.sCountry('oe_cof_theme').GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[SCOPE.sCountry('oe_cof_theme').GetName]司法效率#R −10#!（#Y 5#!年）"
 oe_cof.5.t: "拉丁人的书"
 oe_cof.5.desc: "德米特里奥斯·基多内斯从1347年起做约翰六世坎塔库泽努斯的梅萨宗，奉皇帝之命学了拉丁文，读写都很熟练。1354年12月，他译完了托马斯·阿奎那的《反异教大全》。他和弟弟反对帕拉马斯的神学，后来受到几次宗教会议的谴责。如今经手拉丁文书信的首席秘书官[SCOPE.sCharacter('oe_cof_holder').GetName]也在翻译拉丁人的书，修士们已经在议论[SCOPE.sCharacter('oe_cof_holder').GetSheHe]了。\n\n首席秘书官[SCOPE.sCharacter('oe_cof_holder').GetName]：行政能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('adm')|0]"
 oe_cof.5.a: "护着[SCOPE.sCharacter('oe_cof_holder').GetSheHe]"
 oe_cof.5.a.tt: "教士阶层满意度#R −10%#!\n若教宗国存在：教宗国对我们的好感#G +30#!（每年回落#Y 2#!）\n威望#G +5#!"
 oe_cof.5.b: "让[SCOPE.sCharacter('oe_cof_holder').GetSheHe]把译稿收起来"
 oe_cof.5.b.tt: "教士阶层满意度#G +5%#!"
 oe_cof.5.c: "撤去[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的职务，交给牧首处置"
 oe_cof.5.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去首席秘书官之职，该职位空出，加成立即停止\n正统性#R −5#!\n教士阶层满意度#G +10%#!"
 oe_cof.6.t: "一百万金币"
 oe_cof.6.desc: "1320年，安德罗尼卡二世加重赋税、从严征收，为下一年筹到了约一百万金币，打算养三千骑兵、造二十艘战船。可农民交的钱有许多进了经手官员的口袋，没过多久，祖孙之间的内战又打乱了这个计划。如今总税务长官[SCOPE.sCharacter('oe_cof_holder').GetName]拿出了一份方案，要重新清丈各军区的田产。\n\n总税务长官[SCOPE.sCharacter('oe_cof_holder').GetName]：外交能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.6.a: "由中央派员清丈"
 oe_cof.6.a.tt: "若[SCOPE.sCharacter('oe_cof_holder').GetName]外交能力不低于#Y 60#!：金币#G +200#!；否则：金币#G +100#!\n财务官由中央委派的各军区：财政效率#G +10#!（#Y 5#!年）\n其余各军区：忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_cof.6.b: "交给包税人去收"
 oe_cof.6.b.tt: "金币#G +150#!\n实行包税的各军区：司法效率#R −10#!（#Y 5#!年）"
 oe_cof.6.c: "不动旧册"
 oe_cof.6.c.tt: "没有变化"
 oe_cof.7.t: "当掉皇冠"
 oe_cof.7.desc: "1343年8月，内战正酣，安娜皇太后把帝国的皇冠珠宝押给威尼斯，借了三万杜卡特。钱很快花光了，珠宝锁进了圣马可的宝库，再也没有赎回来。如今国库见底，总税务长官[SCOPE.sCharacter('oe_cof_holder').GetName]提出了同样的办法。\n\n总税务长官[SCOPE.sCharacter('oe_cof_holder').GetName]：外交能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.7.a: "押给威尼斯人"
 oe_cof.7.a.tt: "金币#G +400#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]外交能力不低于#Y 60#!：[SCOPE.sCharacter('oe_cof_holder').GetSheHe]从威尼斯人那里多谈下一笔，金币#G +100#!；否则：没有额外收获\n威望#R −10#!\n获得[ShowModifier('oe_cof_jewels_pawned')]（每月威望#R −0.1#!，#Y 20#!年）\n赎回之前，宫中的大典会因此难办"
 oe_cof.7.b: "熔掉教堂的金银器"
 oe_cof.7.b.tt: "金币#G +300#!\n教士阶层满意度#R −15%#!"
 oe_cof.7.c: "向各军区摊派"
 oe_cof.7.c.tt: "每个金库不少于#Y 50#!的军区上缴#Y 50#!金币，并且忠诚#R −5#!，计入忠诚目标#Y 5#!年"
 oe_cof.8.t: "位次"
 oe_cof.8.desc: "《宫廷官职书》成书于1347到1368年之间，按次序列出宫中的各级官职，写明每一级戴什么帽子、持什么杖，以及一年中各个典礼上谁站在哪里。位次是可以改的：安德罗尼卡三世就把挚友坎塔库泽努斯担任的大多梅斯蒂科斯提到第四位，排在所有非皇族头衔之前。如今[SCOPE.sDynasty('oe_cof_family').GetName]家族的家主[SCOPE.sCharacter('oe_cof_family_head').GetName]要求在下一次大典上往前站，首席礼仪官[SCOPE.sCharacter('oe_cof_holder').GetName]来请示。\n\n首席礼仪官[SCOPE.sCharacter('oe_cof_holder').GetName]：外交能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.8.a: "准其所请"
 oe_cof.8.a.tt: "[SCOPE.sDynasty('oe_cof_family').GetName]家族影响力#Y +50#!\n[oe_tu_authority|e]#R −3#!"
 oe_cof.8.b: "一切照书"
 oe_cof.8.b.tt: "[oe_tu_authority|e]#G +2#!\n[SCOPE.sDynasty('oe_cof_family').GetName]家族影响力#Y −30#!"
 oe_cof.8.c: "交给[SCOPE.sCharacter('oe_cof_holder').GetName]去安排"
 oe_cof.8.c.tt: "若[SCOPE.sCharacter('oe_cof_holder').GetName]外交能力不低于#Y 60#!：[SCOPE.sCharacter('oe_cof_holder').GetSheHe]不改书上的次序，也给足了对方面子：[SCOPE.sDynasty('oe_cof_family').GetName]家族影响力#Y +20#!，[oe_tu_authority|e]#G +1#!；否则：两边都不满意：[SCOPE.sDynasty('oe_cof_family').GetName]家族影响力#Y −20#!，威望#R −5#!"
 oe_cof.9.t: "玻璃皇冠"
 oe_cof.9.desc: "1347年约翰六世加冕时，皇冠上镶的是玻璃，真正的宝石还押在威尼斯。当时的史家记载，加冕宴上没有一件金银器，杯盘都是锡器和陶器。如今又到了大典之期，帝国的珠宝也还在当铺里，首席礼仪官[SCOPE.sCharacter('oe_cof_holder').GetName]来问该怎么办。\n\n首席礼仪官[SCOPE.sCharacter('oe_cof_holder').GetName]：外交能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('dip')|0]"
 oe_cof.9.a: "赎回珠宝"
 oe_cof.9.a.tt: "金币#R −600#!\n威望#G +10#!\n正统性#G +5#!\n“皇冠珠宝在当铺”结束"
 oe_cof.9.b: "用玻璃照办"
 oe_cof.9.b.tt: "若[SCOPE.sCharacter('oe_cof_holder').GetName]外交能力不低于#Y 60#!：典礼依旧庄重：正统性#G +5#!；否则：人人都看出了寒酸：威望#R −5#!，正统性#R −5#!"
 oe_cof.9.c: "推迟大典"
 oe_cof.9.c.tt: "正统性#R −5#!"
 oe_cof.10.t: "大都督的私囊"
 oe_cof.10.desc: "阿列克修斯·阿波考科斯出身寒微，从税吏做起，后来掌管国家财政，攒下大笔家财，在锡林布里亚附近的埃皮巴泰修了一座设防的塔楼。1341年初他出任海军大都督，自掏十万金币重新装备了舰队。几个月后内战爆发，他成了摄政一方的首领。如今海军大都督[SCOPE.sCharacter('oe_cof_holder').GetName]也提出自己出钱整修战船，条件是由[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的人掌管几处港口的关税。\n\n海军大都督[SCOPE.sCharacter('oe_cof_holder').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.10.a: "接受"
 oe_cof.10.a.tt: "海军传统#G +5#!\n若有海上征伐（埃及、北非、意大利、黑海）正在进行：当前征伐压力#G −10#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]出身帝国大家族：该家族影响力#Y +40#!\n获得[ShowModifier('oe_cof_admiral_ports')]（关税收入#R −5%#!，#Y 10#!年）\n[oe_tu_authority|e]#R −2#!"
 oe_cof.10.b: "由国库出钱"
 oe_cof.10.b.tt: "金币#R −300#!\n海军传统#G +5#!\n若有海上征伐（埃及、北非、意大利、黑海）正在进行：当前征伐压力#G −10#!"
 oe_cof.10.c: "婉拒"
 oe_cof.10.c.tt: "若[SCOPE.sCharacter('oe_cof_holder').GetName]出身帝国大家族：该家族影响力#Y −10#!"
 oe_cof.11.t: "加拉塔的关税"
 oe_cof.11.desc: "1348年，约翰六世降低了君士坦丁堡的关税，商船不再停靠热那亚人的加拉塔，而是穿过金角湾到对岸靠港。国库空虚，他向私人借了五万金币造新船。热那亚人8月宣战，越过金角湾攻打帝国舰队，到1349年初，新舰队已经全军覆没。议和时热那亚赔了十万金币，关税特权却保住了。如今海军大都督[SCOPE.sCharacter('oe_cof_holder').GetName]说，加拉塔又抢走了海峡的生意。\n\n海军大都督[SCOPE.sCharacter('oe_cof_holder').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.11.a: "降低关税，扩建舰队"
 oe_cof.11.a.tt: "金币#R −200#!\n若热那亚存在：热那亚对我们的好感#R −30#!（每年回落#Y 2#!）\n若[SCOPE.sCharacter('oe_cof_holder').GetName]军事能力不低于#Y 60#!：舰队顶住了热那亚人：海军传统#G +5#!，获得[ShowModifier('oe_cof_horn_trade')]（关税收入#G +10%#!，#Y 10#!年）；否则：新舰队被击溃：海军传统#R −5#!，威望#R −10#!"
 oe_cof.11.b: "与热那亚人谈判"
 oe_cof.11.b.tt: "金币#G +100#!\n威望#R −5#!"
 oe_cof.11.c: "维持现状"
 oe_cof.11.c.tt: "没有变化"
 oe_cof.12.t: "集结营地"
 oe_cof.12.desc: "君士坦丁七世的论著列出了小亚细亚的六处军营，从比提尼亚的马拉吉纳一直排到达济蒙。出征之前，各军区的部队先到这些营地，与皇帝的主力会合，营里囤着粮草。如今征伐正在进行，多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]要求把[SCOPE.sCountry('oe_cof_theme').GetName]的部队编进[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的主力，[SCOPE.sCharacter('oe_cof_strategos').GetName]却坚持自己带兵。\n\n多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.12.desc.good: "君士坦丁七世的论著列出了小亚细亚的六处军营，从比提尼亚的马拉吉纳一直排到达济蒙。出征之前，各军区的部队先到这些营地，与皇帝的主力会合，营里囤着粮草。如今征伐正在进行，多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]要求把[SCOPE.sCountry('oe_cof_theme').GetName]的部队编进[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的主力，[SCOPE.sCharacter('oe_cof_strategos').GetName]却坚持自己带兵。[SCOPE.sCharacter('oe_cof_holder').GetName]久经战阵，军中都服[SCOPE.sCharacter('oe_cof_holder').GetSheHe]。\n\n多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.12.desc.bad: "君士坦丁七世的论著列出了小亚细亚的六处军营，从比提尼亚的马拉吉纳一直排到达济蒙。出征之前，各军区的部队先到这些营地，与皇帝的主力会合，营里囤着粮草。如今征伐正在进行，多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]要求把[SCOPE.sCountry('oe_cof_theme').GetName]的部队编进[SCOPE.sCharacter('oe_cof_holder').GetSheHe]的主力，[SCOPE.sCharacter('oe_cof_strategos').GetName]却坚持自己带兵。[SCOPE.sCharacter('oe_cof_holder').GetName]没打过几仗，军区的老兵并不服[SCOPE.sCharacter('oe_cof_holder').GetSheHe]。\n\n多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]"
 oe_cof.12.a: "统一交给[SCOPE.sCharacter('oe_cof_holder').GetName]指挥"
 oe_cof.12.a.tt: "若[SCOPE.sCharacter('oe_cof_holder').GetName]军事能力不低于#Y 60#!：当前征伐压力#G −10#!；否则：当前征伐压力#G −3#!\n[SCOPE.sCountry('oe_cof_theme').GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年"
 oe_cof.12.b: "让[SCOPE.sCharacter('oe_cof_strategos').GetName]带自己的兵"
 oe_cof.12.b.tt: "[SCOPE.sCountry('oe_cof_theme').GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[SCOPE.sCountry('oe_cof_theme').GetName]军务效率#G +10#!（#Y 5#!年）\n当前征伐压力#R +5#!"
 oe_cof.12.c: "撤换[SCOPE.sCharacter('oe_cof_holder').GetName]，由[SCOPE.sCharacter('oe_cof_cand').GetName]接任"
 oe_cof.12.c.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去多梅斯蒂科斯之职，该职位空出，加成立即停止\n[SCOPE.sCharacter('oe_cof_cand').GetName]接任多梅斯蒂科斯\n正统性#R −5#!\n[SCOPE.sCountry('oe_cof_theme').GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_cof.13.t: "陆与海"
 oe_cof.13.desc: "917年，斯科莱军团统帅利奥·福卡斯率军进攻保加利亚。按计划，罗曼努斯·雷卡平统率的舰队要把佩切涅格人渡过多瑙河助战，可罗曼努斯与佩切涅格人的首领起了争执，援军没有来。8月20日，帝国军队在阿谢洛河畔几乎全军覆没，罗曼努斯被追究战败之责。可是919年3月，他带着舰队占领了皇宫，把女儿嫁给年幼的君士坦丁七世，第二年登上了皇位；起兵反抗的利奥被弄瞎了双眼。如今多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]与海军大都督[SCOPE.sCharacter('oe_cof_holder2').GetName]也在御前互相指责。\n\n多梅斯蒂科斯[SCOPE.sCharacter('oe_cof_holder').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder').GetAbility('mil')|0]\n海军大都督[SCOPE.sCharacter('oe_cof_holder2').GetName]：军事能力 [SCOPE.sCharacter('oe_cof_holder2').GetAbility('mil')|0]"
 oe_cof.13.a: "站在[SCOPE.sCharacter('oe_cof_holder').GetName]一边"
 oe_cof.13.a.tt: "[SCOPE.sCharacter('oe_cof_holder2').GetName]被撤去海军大都督之职，该职位空出，加成立即停止\n正统性#R −5#!\n陆军传统#G +5#!\n若[SCOPE.sCharacter('oe_cof_holder2').GetName]出身帝国大家族：该家族影响力#Y −30#!"
 oe_cof.13.b: "站在[SCOPE.sCharacter('oe_cof_holder2').GetName]一边"
 oe_cof.13.b.tt: "[SCOPE.sCharacter('oe_cof_holder').GetName]被撤去多梅斯蒂科斯之职，该职位空出，加成立即停止\n正统性#R −5#!\n海军传统#G +5#!\n若[SCOPE.sCharacter('oe_cof_holder').GetName]出身帝国大家族：该家族影响力#Y −30#!"
 oe_cof.13.c: "划清职权，两人都留下"
 oe_cof.13.c.tt: "[oe_tu_authority|e]#R −2#!\n若有征伐正在进行：当前征伐压力#R +5#!\n若两人的军事能力都不低于#Y 60#!，两人各自憋着一口气：陆军传统#G +2.5#!，海军传统#G +2.5#!"
