 STATIC_MODIFIER_DESC_oe_nyu_1640_code_mod:0 "四十四部王公会盟制定全蒙统一法典，禁绝内战劫掠、确立互助御侮宪章。"
 STATIC_MODIFIER_NAME_oe_nyu_clan_pact_mod:0 "诸部草原战时互助盟约"
 STATIC_MODIFIER_DESC_oe_nyu_clan_pact_mod:0 "保留各部传统游牧自治而在外敌压境时联合出兵，轻捷灵活而成本低廉。"
 STATIC_MODIFIER_NAME_oe_nyu_camel_artillery_mod:0 "驼载佛朗机炮与火绳枪龙骑兵"
 STATIC_MODIFIER_DESC_oe_nyu_camel_artillery_mod:0 "以骆驼驮载轻型回旋炮并配属火绳枪骑兵，将草原高机动性与近代猛烈火力合二为一！"
 STATIC_MODIFIER_NAME_oe_nyu_armored_lancers_mod:0 "重甲长矛冲锋万户"
 STATIC_MODIFIER_DESC_oe_nyu_armored_lancers_mod:0 "精炼札甲与长矛冲阵战法，以山崩海啸般的重骑铁流碾碎步兵方阵。"
 STATIC_MODIFIER_NAME_oe_nyu_reclaim_mandate_mod:0 "北元中兴：重夺天命大元再临"
 STATIC_MODIFIER_DESC_oe_nyu_reclaim_mandate_mod:0 "跨越百年蛰伏，大汗铁骑南望大都，以文武兼备的新朝仪制重举大元帝国天命！"
 STATIC_MODIFIER_NAME_oe_nyu_steppe_confederacy_mod:0 "现代欧亚草原大联邦"
 STATIC_MODIFIER_DESC_oe_nyu_steppe_confederacy_mod:0 "以哈拉和林、呼和浩特与丝路驿城为枢纽，铸就兼具火炮新军、宽容法制与跨陆商网的现代草原强国！"
 oe_nyu_dec_six_tumens.title:0 "达延汗改制：一统左右翼六万户"
 oe_nyu_dec_six_tumens.desc:0 "废除割据异姓太师，将漠南漠北整编为察哈尔、喀尔喀、兀良哈、鄂尔多斯、土默特与永谢布六万户，显著提升人力、军纪、附庸忠诚与汗权凝聚力（持续30年）。"
 oe_nyu_dec_six_tumens.a:0 "确立六万户宪章"
 oe_nyu_dec_yellow_hat_council.title:0 "召集格鲁派黄教法会"
 oe_nyu_dec_yellow_hat_council.desc:0 "延请西藏格鲁派高僧主持草原法会并兴办蒙文译经书院，显著提升识字率、思潮传播速度与国内稳定（持续30年）。"
 oe_nyu_dec_yellow_hat_council.a:0 "启建草原黄教法会"
 oe_nyu_dec_horse_markets.title:0 "开设长城茶马丝绸互市"
 oe_nyu_dec_horse_markets.desc:0 "于长城沿线与青城商道设立受保护的茶马互市，以骏马毛皮换取丝绸、茶叶与税银，带来25年丰厚贸易与外交收益。"
 oe_nyu_dec_horse_markets.a:0 "颁布互市通商章程"
 oe_nyu.1.title:0 "北归哈拉和林"
 oe_nyu.1.desc:0 "大都陷落后，大元法统携传国玉玺北越阴山重归故都哈拉和林。昭宗爱猷识理达腊与扩廓帖木儿检阅漠北铁骑，誓保黄金家族九斿白纛不倒。"
 oe_nyu.1.a:0 "于哈拉和林重整大汗亲军铁骑"
 oe_nyu.1.b:0 "沿克鲁伦与色楞格河休养牧群人口"
 oe_nyu.2.title:0 "捕鱼儿海之变与大元玉玺守卫"
 oe_nyu.2.desc:0 "南方轻骑突袭捕鱼儿海大营，漠东诸部震动、权臣蠢蠢欲动。汗廷必须决断：是死守黄金家族典章法统号令诸部，还是化整为零以轻骑游击消耗强敌。"
 oe_nyu.2.a:0 "紧握传国玉玺与黄金家族正统威望"
 oe_nyu.2.b:0 "推行千里轻骑机动以大漠困敌"
 oe_nyu.3.title:0 "卫拉特四部崛起与漠北竞霸"
 oe_nyu.3.desc:0 "西方卫拉特四部凭借天山北路与阿尔泰草场迅速强盛，与东方鞑靼黄金家族围绕汗位与牧道展开角逐。合则草原威震欧亚，分则两败俱伤。"
 oe_nyu.3.a:0 "缔结东西蒙古草原和盟共御外侮"
 oe_nyu.3.b:0 "铁腕收编诸部确立单一汗权"
 oe_nyu.4.title:0 "也先太师一统漠北与河西商道"
 oe_nyu.4.desc:0 "雄才大略的也先太师西服哈密、东联女真，将分裂半世纪的蒙古各部再度凝聚于同一军令之下。浩荡数千人的贡马使团南赴边关，要求厚赐丝帛并扩开互市。"
 oe_nyu.4.a:0 "以草原雄兵威慑边关扩大朝贡贸易"
 oe_nyu.4.b:0 "兼控哈密至撒马尔罕西域绿洲商路"
 oe_nyu.5.title:0 "土木堡大捷：草原铁骑震动东亚"
 oe_nyu.5.desc:0 "大同与宣府塞外尘烟蔽日！草原骑兵截断水源、合围击溃仓促北征的南方大军，斩获无数火铳甲胄与军资，漠北军威一时达到自北归以来之顶峰！"
 oe_nyu.5.a:0 "乘胜张扬大汗威名迫开边境厚利"
 oe_nyu.5.b:0 "收编缴获火器与工匠改良草原武备"
 oe_nyu.6.title:0 "满都海哈屯护孤出征"
 oe_nyu.6.desc:0 "黄金家族几近绝嗣之际，智勇双全的满都海哈屯毅然拒绝权臣求婚，于成吉思汗八白室前立誓扶持年仅七岁的巴图蒙克即位，身披战甲携幼汗驰骋沙场平定群雄！"
 oe_nyu.6.a:0 "追随满都海战旗扫平割据重振黄金家族"
 oe_nyu.6.b:0 "以联姻盟约安抚漠南各部台吉"
 oe_nyu.7.title:0 "达延汗重组左右翼六万户"
 oe_nyu.7.desc:0 "巴图蒙克达延汗亲政后彻底革除擅权百年的异姓太师制，将漠南漠北整编为左翼（察哈尔、喀尔喀、兀良哈）与右翼（鄂尔多斯、土默特、永谢布）六万户，由黄金家族诸子世守！"
 oe_nyu.7.a:0 "颁行左右翼六万户宪章永固汗权"
 oe_nyu.7.b:0 "赋予河套鄂尔多斯右翼高度边防自治"
 oe_nyu.8.title:0 "达兰特里衮之战：平定右翼诸部"
 oe_nyu.8.desc:0 "右翼权贵不甘削权起兵叛乱，达延汗亲率左翼精锐疾驰鄂尔多斯草原决战达兰特里衮！此战将决定六万户统一体制能否在长城以北扎根百年。"
 oe_nyu.8.a:0 "亲率左翼铁骑一战定鼎河套右翼"
 oe_nyu.8.b:0 "招抚诸台吉以封牧换取世袭骑兵役"
 oe_nyu.9.title:0 "俺答汗筑归化青城（呼和浩特）"
 oe_nyu.9.desc:0 "土默特雄主俺答汗于丰州土默川沃野招揽农夫、铁匠与木工，广建板升农庄并筑起恢弘砖城“库库和屯”（青城/呼和浩特），草原由此迈向农牧商兼兴的新时代！"
 oe_nyu.9.a:0 "大兴青城砖墙、冶铁工坊与灌溉农田"
 oe_nyu.9.b:0 "保持冬城夏牧双轨格局不失骑射机动"
 oe_nyu.10.title:0 "隆庆和议与长城茶马互市"
 oe_nyu.10.desc:0 "历经百余年边境拉锯，双方在大同、宣府沿线议定和约：封王通贡、广开十余处官办马市。草原骏马与毛皮换回源源不断的丝绸、砖茶与铁器，北疆迎来难得的黄金和平期。"
 oe_nyu.10.a:0 "恪守和议广开茶马丝绸互市"
 oe_nyu.10.b:0 "抽调互市商税筹建漠北铁甲火器工坊"
 oe_nyu.11.title:0 "三世达赖与草原藏传佛教复兴"
 oe_nyu.11.desc:0 "青海湖畔仰华寺法会庄严，俺答汗迎请格鲁派高僧索南嘉措并上尊号“达赖喇嘛”，双方追认忽必烈与八思巴檀越旧盟。蒙文佛经翻译与书院浪潮迅速席卷大漠南北。"
 oe_nyu.11.a:0 "尊崇格鲁派檀越联盟并大译蒙文经典"
 oe_nyu.11.b:0 "并容长生天祖制与佛法寺院维持宽容"
 oe_nyu.12.title:0 "额尔德尼召与鄂尔浑河书院"
 oe_nyu.12.desc:0 "喀尔喀阿巴岱汗在旧都哈拉和林遗址旁兴建额尔德尼召，巍峨白塔与百座佛殿化作草原上的大学、藏书楼与医算馆，同时亦需整修贯通漠北的站赤驿道。"
 oe_nyu.12.a:0 "广设蒙藏译经院与草原律法学堂"
 oe_nyu.12.b:0 "重修大元站赤驿站贯通千里漠北"
 oe_nyu.13.title:0 "林丹汗的察哈尔抗金之役"
 oe_nyu.13.desc:0 "关外女真八旗步步西逼、不断分化科尔沁与漠南诸部。察哈尔大汗林丹汗高擎黄金家族正统大旗，一方面组织高僧译完百余卷蒙文《甘珠尔》，一方面誓师迎击东方强敌！"
 oe_nyu.13.a:0 "据守察哈尔力抗女真并广结抗金同盟"
 oe_nyu.13.b:0 "保全精锐西移青海联结卫拉特与雪域"
 oe_nyu.14.title:0 "1640《喀尔喀—卫拉特大法典》会"
 oe_nyu.14.desc:0 "面对东西强邻夹击，四十四部喀尔喀与卫拉特王公齐聚塔尔巴哈台召开全蒙忽里勒台，共颁《蒙古—卫拉特法典》，严禁诸部相攻、誓言外敌来犯必同舟共济！"
 oe_nyu.14.a:0 "签署全蒙统一大法典缔造常设联盟"
 oe_nyu.14.b:0 "保留各部自治仅立战时出兵盟约"
 oe_nyu.15.title:0 "近代草原新军"
 oe_nyu.15.desc:0 "面对定居帝国的排枪与野战重炮，草原名将革新战法：将青铜回旋炮架设于骆驼鞍背实现百里奔袭火力支援，并为精锐骑兵换装火绳枪与钢甲，令游牧雄师焕发近代锋芒。"
 oe_nyu.15.a:0 "编练驼载炮队与火绳枪龙骑万户"
 oe_nyu.15.b:0 "锻造重装札甲长矛冲阵铁骑"
 oe_nyu.16.title:0 "北元复兴之路"
 oe_nyu.16.desc:0 "跨越三个世纪的分裂、迁徙与浴火重生，大漠南北已矗立起兼具火炮新军、城镇商贸与统一法典的草原强国。如今汗廷站在历史岔口：是挥师南下光复大都重登天命，还是立足欧亚腹地建成富强永固的现代草原联邦？"
 oe_nyu.16.a:0 "挥师南下重夺大都，再兴大元天命"
 oe_nyu.16.b:0 "以和林与青城为枢，缔造现代欧亚草原联邦"
