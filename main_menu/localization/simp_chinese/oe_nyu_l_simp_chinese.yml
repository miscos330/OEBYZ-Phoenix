 STATIC_MODIFIER_DESC_oe_nyu_ortoo_post_mod:0 "重修贯穿大漠的驿站马递网，政令与军情数日可达千里边陲。"
 STATIC_MODIFIER_NAME_oe_nyu_ligdan_stand_mod:0 "林丹汗察哈尔抗金砥柱"
 STATIC_MODIFIER_DESC_oe_nyu_ligdan_stand_mod:0 "察哈尔大汗高举黄金家族正统旗帜力抗女真八旗扩张，凝聚东蒙死战决心。"
 STATIC_MODIFIER_NAME_oe_nyu_western_regroup_mod:0 "青海西移与高原联防"
 STATIC_MODIFIER_DESC_oe_nyu_western_regroup_mod:0 "保存有生骑兵西进青海联络卫拉特与雪域诸邦，以广袤纵深徐图后举。"
