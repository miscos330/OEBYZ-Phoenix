 STATIC_MODIFIER_DESC_oe_nyu_noble_levies_mod:0 "以封牧换取诸台吉常备战马与弓骑征召，大军云集瞬息可达。"
 STATIC_MODIFIER_NAME_oe_nyu_hohhot_city_mod:0 "归化青城（呼和浩特）筑城农商"
 STATIC_MODIFIER_DESC_oe_nyu_hohhot_city_mod:0 "俺答汗在土默川筑起砖城、寺庙与板升农庄，草原首次拥有兼融农耕、冶铁与商贸的永固都城！"
