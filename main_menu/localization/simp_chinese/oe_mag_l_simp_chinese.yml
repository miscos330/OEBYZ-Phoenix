l_simp_chinese:
 oe_mag_b_maghreb_rivalry: "马格里布三王朝霸权宿怨"
 oe_mag_b_maghreb_truce: "马格里布商道休战协约"
 oe_mag_b_gibraltar_accord: "直布罗陀海峡关税通商约"
 oe_mag_b_ottoman_corsair_bond: "奥斯曼—巴巴里海盗护航同盟"
 oe_mag_b_barbary_raids: "巴巴里私掠劫掠西地中海之恨"
 oe_mag_b_saharan_gold_tie: "跨撒哈拉黄金商队互市之谊"
 STATIC_MODIFIER_NAME_oe_mag_tripartite_hegemony: "马格里布霸权雄心"
 STATIC_MODIFIER_DESC_oe_mag_tripartite_hegemony: "马林、哈夫斯与扎扬三强逐鹿北非，轻骑与士气高昂，但周边疑忌加剧、维稳成本攀升。"
 STATIC_MODIFIER_NAME_oe_mag_caravan_truce: "马格里布商道休战协约"
 STATIC_MODIFIER_DESC_oe_mag_caravan_truce: "三朝暂罢干戈、共护马格里布沿线驿道与商港，商税与外交声誉稳步回升，但军旅锋芒稍敛。"
 STATIC_MODIFIER_NAME_oe_mag_berber_tribal_levies: "柏柏尔部落整军征召"
 STATIC_MODIFIER_DESC_oe_mag_berber_tribal_levies: "以封赏与牧场特权换取阿特拉斯山地及沙漠柏柏尔诸部效命，兵源充沛而王室中央控制受掣。"
 STATIC_MODIFIER_NAME_oe_mag_strait_guard_mod: "直布罗陀海峡铁锁守备"
 STATIC_MODIFIER_DESC_oe_mag_strait_guard_mod: "以休达与丹吉尔为支点修筑岸防炮台并常驻桨帆舰队，海峡封锁与守御坚固，舰队维持费随之加重。"
 STATIC_MODIFIER_NAME_oe_mag_strait_customs_mod: "休达—丹吉尔海峡关税通商"
 STATIC_MODIFIER_DESC_oe_mag_strait_customs_mod: "同伊比利亚诸国互开直布罗陀商税口岸，市民与关税同获利，但令宗教阶层与宫廷威望受损。"
 STATIC_MODIFIER_NAME_oe_mag_independent_taifa: "独立巴巴里莱伊斯私掠港"
 STATIC_MODIFIER_DESC_oe_mag_independent_taifa: "阿尔及尔、突尼斯与的黎波里的海盗船长行会自立门户，桨帆战船与私掠耐久暴涨，但国际声誉与内地控制受挫。"
 STATIC_MODIFIER_NAME_oe_mag_ottoman_eyalet_corsairs: "奥斯曼护翼下的巴巴里火炮舰队"
 STATIC_MODIFIER_DESC_oe_mag_ottoman_eyalet_corsairs: "奉君士坦丁堡苏丹为宗主，换取火炮工匠与耶尼切里驻军支援，海陆战力齐升而本土王权受宗主节制。"
 STATIC_MODIFIER_NAME_oe_mag_med_customs_order: "北非正规海关商港制"
 STATIC_MODIFIER_DESC_oe_mag_med_customs_order: "约束私掠船长并推行正规地中海海关契约，商税与市民阶层受益、海盗滋生受抑，却放弃了袭扰红利。"
 STATIC_MODIFIER_NAME_oe_mag_grand_corso_economy: "巴巴里大私掠护航经济"
 STATIC_MODIFIER_DESC_oe_mag_grand_corso_economy: "大批快帆桨船成群北上西地中海袭掠商船与海岸，水手与私掠收益暴增，却彻底断绝正规外贸与外交信任。"
 STATIC_MODIFIER_NAME_oe_mag_western_raid_pressure: "西地中海巴巴里劫掠承压"
 STATIC_MODIFIER_DESC_oe_mag_western_raid_pressure: "巴巴里快帆频频袭扰沿岸商港与航道，海贸收入与地方繁荣受损，但也倒逼海军加速练兵应对。"
 STATIC_MODIFIER_NAME_oe_mag_ransom_passports: "地中海赎金与海事通行证"
 STATIC_MODIFIER_DESC_oe_mag_ransom_passports: "向欧洲商船签发付费护航通行证并规范人质赎买，以细水长流的商利替代无序劫掠，唯舰队巡护开销不菲。"
 STATIC_MODIFIER_NAME_oe_mag_corsair_last_stand: "巴巴里诸港绝境抗击"
 STATIC_MODIFIER_DESC_oe_mag_corsair_last_stand: "面对大舰队炮击清剿，各私掠港筑垒死守并孤注一掷拼死反击，守御与海战狂热飙升，正规海贸几乎停摆。"
 STATIC_MODIFIER_NAME_oe_mag_piracy_pacified: "西地中海海盗清剿终局"
 STATIC_MODIFIER_DESC_oe_mag_piracy_pacified: "纵横百余年的巴巴里私掠网终被瓦解，西地中海商路重归通畅、海盗绝迹，但仍需维持常备舰队弹压。"
 STATIC_MODIFIER_NAME_oe_mag_regular_admiral_fleet: "改编正规北非远洋舰队"
 STATIC_MODIFIER_DESC_oe_mag_regular_admiral_fleet: "将散漫的莱伊斯私掠船队收编为直属国家的常备海军，海军传统与轻帆战力大进，水师军费显著上浮。"
 STATIC_MODIFIER_NAME_oe_mag_corsair_commission_mod: "巴巴里私掠特许状"
 STATIC_MODIFIER_DESC_oe_mag_corsair_commission_mod: "凭国家印玺敕封的私掠船队在西地中海四处出击，提升私掠耐久、桨帆战力与水手补给，却折损外交信誉。"
 STATIC_MODIFIER_NAME_oe_mag_mali_gold_caravans: "跨撒哈拉黄金商队盛世"
 STATIC_MODIFIER_DESC_oe_mag_mali_gold_caravans: "满载尼日尔河谷砂金的万峰驼队自尼亚尼、廷巴克图与高城北穿大漠，商利与威望如日中天，亦埋下物价通胀隐患。"
 STATIC_MODIFIER_NAME_oe_mag_salt_gold_regulation: "廷巴克图—高城盐金公允互市"
 STATIC_MODIFIER_DESC_oe_mag_salt_gold_regulation: "以官定盐金比价节制黄金外流并扶持学城民生，财税、稳定与繁荣稳健提升，短期外贸暴利相对克制。"
 STATIC_MODIFIER_NAME_oe_mag_gold_mint_surge: "撒哈拉砂金洪流与铸币过热"
 STATIC_MODIFIER_DESC_oe_mag_gold_mint_surge: "源源不断的撒哈拉黄金倾泻入菲斯与突尼斯铸币厂，财税商入暴涨的同时推高通胀压力，并向帝国货币体系传导。"
 STATIC_MODIFIER_NAME_oe_mag_sijilmasa_reserve: "西吉勒马萨黄金储备与平抑关税"
 STATIC_MODIFIER_DESC_oe_mag_sijilmasa_reserve: "设立官营黄金储备库以平抑过热铸币，压低通胀并安抚商团市民，代价是主动让渡部分即时税入。"
 STATIC_MODIFIER_NAME_oe_mag_roman_sahara_caravan: "罗马重返撒哈拉：帝国驼队特许"
 STATIC_MODIFIER_DESC_oe_mag_roman_sahara_caravan: "自迦太基与的黎波里启程的双鹰商队重溯古典费赞古道直抵廷巴克图，远商与帝威俱彰，伴随轻微黄金通胀。"
 STATIC_MODIFIER_NAME_oe_mag_saharan_caravan_mod: "跨撒哈拉盐金特许商队"
 STATIC_MODIFIER_DESC_oe_mag_saharan_caravan_mod: "官府护送的沙漠盐金商队贯通萨赫勒与马格里布，显著拉升商贸与商能，同时带来轻微通胀上行。"
 STATIC_MODIFIER_NAME_oe_mag_african_annona: "迦太基帝国谷仓与粮船常供"
 STATIC_MODIFIER_DESC_oe_mag_african_annona: "重修迦太基旧港与北非官立粮仓，源源不断的非洲谷船驶向君士坦丁堡，大幅缓解帝国粮荒与治理重压，惟海运补贴耗费国税。"
 STATIC_MODIFIER_NAME_oe_mag_carthage_merchant_lease: "突尼斯港商税包租契"
 STATIC_MODIFIER_DESC_oe_mag_carthage_merchant_lease: "将突尼斯码头关税包租予帝国特许商行，快速回笼金币并取悦市民，但削弱了帝国对北非港口的直辖控制。"
 STATIC_MODIFIER_NAME_oe_mag_limes_tripolitanus: "的黎波里罗马边墙防线"
 STATIC_MODIFIER_DESC_oe_mag_limes_tripolitanus: "沿古典的黎波里边墙遗迹重修烽燧、堑壕与要塞，牢控北非边疆并阻绝沙漠袭扰，代价是高昂要塞军费与柏柏尔部落疏离。"
 STATIC_MODIFIER_NAME_oe_mag_berber_foederati: "柏柏尔同盟军招抚协约"
 STATIC_MODIFIER_DESC_oe_mag_berber_foederati: "仿照查士丁尼旧例以岁赐招抚柏柏尔诸部充任边防轻骑同盟军，机动战力与部落安稳俱增，但边区自治扩张削弱中央控制。"
 STATIC_MODIFIER_NAME_oe_mag_west_med_patrol: "迦太基帝国西地中海常备巡弋"
 STATIC_MODIFIER_DESC_oe_mag_west_med_patrol: "以突尼斯、阿尔及尔与的黎波里为母港编组西地中海帝国常备巡防舰队，压制海盗滋生并确立海权，唯舰队维持费不轻。"
 STATIC_MODIFIER_NAME_oe_mag_coastal_watchtowers: "北非海岸烽燧与商船护航"
 STATIC_MODIFIER_DESC_oe_mag_coastal_watchtowers: "沿北非漫长海岸广设石筑烽燧与护航快船，兼顾防务与低廉投入，但对远海海盗的震慑力不及主动清剿。"
 STATIC_MODIFIER_NAME_oe_mag_carthage_christian_revival: "迦太基大主教区与罗马北非同化"
 STATIC_MODIFIER_DESC_oe_mag_carthage_christian_revival: "复兴圣西普里安与圣奥古斯丁时代的迦太基教会，强力推进北非罗马化同化运动与宣教传道，但激化异教社群摩擦。"
 STATIC_MODIFIER_NAME_oe_mag_african_synod_tolerance: "拉丁—柏柏尔—希腊北非宽容公会议"
 STATIC_MODIFIER_DESC_oe_mag_african_synod_tolerance: "在迦太基召开三语基督教公会议并保障北非多元社群安居，控制力与异教宽容显著改善、同化温和推进，但保守教士颇有微词。"
 STATIC_MODIFIER_NAME_oe_mag_carthage_admiralty_mod: "迦太基帝国海军都督府"
 STATIC_MODIFIER_DESC_oe_mag_carthage_admiralty_mod: "统筹西地中海海防的帝国非洲海军都督府，令海洋存在、桨帆战力与海军传统齐升并彻底清零海盗巢穴，代价是持续水师开销。"
 STATIC_MODIFIER_NAME_oe_mag_strait_bastion_loc: "直布罗陀海峡岸防堡垒"
 STATIC_MODIFIER_DESC_oe_mag_strait_bastion_loc: "矗立于海峡南岸的重炮城垒与船坞，扼守大西洋与地中海咽喉。"
 STATIC_MODIFIER_NAME_oe_mag_corsair_haven_loc: "巴巴里私掠军港与船坞"
 STATIC_MODIFIER_DESC_oe_mag_corsair_haven_loc: "私掠船长与水手云集的北非港湾，造船与水手充沛，却令海盗活跃、街坊躁动。"
 STATIC_MODIFIER_NAME_oe_mag_caravan_hub_loc: "跨撒哈拉黄金商队总站"
 STATIC_MODIFIER_DESC_oe_mag_caravan_hub_loc: "沙漠驼队卸下岩盐、砂金与象牙的繁华商驿，贸易辐射力与城市繁荣蒸蒸日上。"
 STATIC_MODIFIER_NAME_oe_mag_carthage_granary_loc: "迦太基帝国港与官立谷仓"
 STATIC_MODIFIER_DESC_oe_mag_carthage_granary_loc: "按古典圆形军商港制式重修的突尼斯—迦太基码头与巨型官仓，为帝国中枢源源输送粮秣。"
 STATIC_MODIFIER_NAME_oe_mag_limes_citadel_loc: "的黎波里边墙要塞"
 STATIC_MODIFIER_DESC_oe_mag_limes_citadel_loc: "扼守沙漠通衢的罗马边防石堡，大幅提升守备力与地方行政控制。"
 STATIC_MODIFIER_NAME_oe_mag_imperial_fleet_base_loc: "罗马非洲舰队母港"
 STATIC_MODIFIER_DESC_oe_mag_imperial_fleet_base_loc: "帝国常备战舰驻泊修造的北非军港，彻底肃清周边海盗巢穴并巩固海洋掌控。"
 STATIC_MODIFIER_NAME_oe_mag_carthage_see_loc: "迦太基大主教座堂与社群中心"
 STATIC_MODIFIER_DESC_oe_mag_carthage_see_loc: "重兴的迦太基主教座堂与拉丁—柏柏尔—希腊学苑，有力推动北非罗马化与城坊繁荣。"
 oe_mag_dec_gibraltar_fortress.title: "加固直布罗陀海峡要塞"
 oe_mag_dec_gibraltar_fortress.desc: "在实控的休达或丹吉尔修筑重型岸防炮台与桨帆船坞，锁死直布罗陀海峡门户，但将持续消耗舰队维持费。"
 oe_mag_dec_gibraltar_fortress.a: "拨银营建海峡铁锁岸防"
 oe_mag_dec_barbary_taifa.title: "敕封巴巴里私掠舰队（莱伊斯行会）"
 oe_mag_dec_barbary_taifa.desc: "向阿尔及尔、突尼斯或的黎波里的私掠船长颁授十五年期私掠特许状，壮大桨帆战船与水手补给，但会推高巴巴里热度并损及外交声誉。"
 oe_mag_dec_barbary_taifa.a: "颁授十五年期巴巴里私掠特许状"
 oe_mag_dec_saharan_caravan.title: "组织跨撒哈拉黄金盐商队"
 oe_mag_dec_saharan_caravan.desc: "拨款组织官府护送的沙漠盐金大商队，贯通廷巴克图、高城、菲斯与突尼斯的黄金商路，并推动撒哈拉黄金潮上行。"
 oe_mag_dec_saharan_caravan.a: "发遣官护跨撒哈拉黄金商队"
 oe_mag_dec_carthage_patrol.title: "迦太基海军巡弋：永久清剿西地中海海盗"
 oe_mag_dec_carthage_patrol.desc: "依托帝国实控的突尼斯、阿尔及尔与的黎波里设立迦太基海军都督府，彻底清剿巴巴里海盗巢穴并缓解帝国行政重负。"
 oe_mag_dec_carthage_patrol.a: "敕立迦太基海军都督府并清剿海患"
 oe_mag.1.t: "马格里布三王朝竞逐：马林、哈夫斯与扎扬"
 oe_mag.1.d: "自穆瓦希德帝国解体以来，北非马格里布陷入三足鼎立之局：菲斯与马拉喀什的马林王朝野心勃勃，突尼斯的哈夫斯王朝扼守中地中海要冲，而夹居其间的特莱姆森扎扬王朝则掌控着贯通阿特拉斯与撒哈拉的商路枢纽。\n\n三强之间的军政拉锯决定了未来百年北非的归属——是厉兵秣马争锋马格里布霸权、缔结商道休战协约，还是广授特权整编柏柏尔部落骑兵？"
 oe_mag.1.a: "厉兵秣马，问鼎马格里布唯一霸权！"
 oe_mag.1.a.tt: "花费#R 80金币#!，陆军传统#G +8#!，威望#G +10#!，与马格里布宿敌好感#R −45#!，获得[ShowModifier('oe_mag_tripartite_hegemony')]，持续#Y 30年#!。"
 oe_mag.1.b: "暂罢三朝干戈，共签马格里布商道休战协约"
 oe_mag.1.b.tt: "花费#R 60金币#!，稳定度#G +4#!，与马格里布邻国改善好感#G +35#!，获得[ShowModifier('oe_mag_caravan_truce')]，持续#Y 30年#!。"
 oe_mag.1.c: "赐予牧场特权，整编阿特拉斯柏柏尔部落征召兵"
 oe_mag.1.c.tt: "花费#R 70金币#!，部落阶层满意上升，获得[ShowModifier('oe_mag_berber_tribal_levies')]，持续#Y 30年#!（人力大增但降低中央控制）。"
 oe_mag.2.t: "直布罗陀门户：休达与丹吉尔的攻防"
 oe_mag.2.d: "隔海相望的葡萄牙与卡斯蒂利亚战船频频游弋于直布罗陀海峡，虎视眈眈地盯着北非门户休达与丹吉尔。这两座重镇既是格拉纳达最后的海上后援咽喉，亦是阻挡伊比利亚势力跨越海峡踏上马格里布的关键锁钥。\n\n面对来自海峡北岸日益逼近的舰炮与十字旗，我们是重金筑垒死守海峡门户，还是与伊比利亚各国试探签订海关通商约？"
 oe_mag.2.a: "重金加固休达与丹吉尔岸防堡垒，集结桨帆舰队锁死海峡"
 oe_mag.2.a.tt: "花费#R 140金币#!、人力#R −1#!，海军传统#G +8#!，于休达/丹吉尔筑[ShowModifier('oe_mag_strait_bastion_loc')]，获得[ShowModifier('oe_mag_strait_guard_mod')]，持续#Y 30年#!。"
 oe_mag.2.b: "同伊比利亚诸国缔结海峡关税通商约，暂换海上安宁"
 oe_mag.2.b.tt: "花费#R 80金币#!，威望#R −6#!，改善与葡萄牙/卡斯蒂利亚/西班牙关系（好感#G +30#!），获得[ShowModifier('oe_mag_strait_customs_mod')]，持续#Y 30年#!。"
 oe_mag.3.t: "巴巴里海盗网兴起：阿尔及尔、突尼斯与的黎波里"
 oe_mag.3.d: "随着伊比利亚流亡水手与安达卢西亚难民大量南渡，阿尔及尔、突尼斯与的黎波里的港湾骤然沸腾。成百上千名精通西地中海风向的私掠船长（莱伊斯）集结麾下快帆桨船，随时准备向基督教海岸发起雷霆反击。\n\n摆在北非宫廷面前有三条道路：任由莱伊斯行会以独立私掠港模式经营；向强盛的奥斯曼苏丹称臣求援，换取耶尼切里火炮与帝国庇护；抑或推行正规海关商港制以安商旅。"
 oe_mag.3.a: "敕许独立莱伊斯私掠行会，将北非诸港打造成令西方胆寒的海盗网"
 oe_mag.3.a.tt: "花费#R 120金币#!，海军传统#G +10#!，巴巴里热度升至#Y 2#!，建[ShowModifier('oe_mag_corsair_haven_loc')]，获得[ShowModifier('oe_mag_independent_taifa')]，持续#Y 35年#!。"
 oe_mag.3.b: "向奥斯曼苏丹称臣结援，换取耶尼切里火炮与帝国舰队护翼！"
 oe_mag.3.b.tt: "花费#R 100金币#!，陆军传统#G +10#!，海军传统#G +8#!，巴巴里热度升至#Y 3#!，与奥斯曼互增好感#G +60#!，获得[ShowModifier('oe_mag_ottoman_eyalet_corsairs')]，持续#Y 35年#!。"
 oe_mag.3.c: "约束私掠船长，整顿阿尔及尔与突尼斯正规海关商贸"
 oe_mag.3.c.tt: "花费#R 90金币#!，稳定度#G +4#!，清零巴巴里热度，获得[ShowModifier('oe_mag_med_customs_order')]，持续#Y 35年#!。"
 oe_mag.4.t: "巴巴里私掠护航经济与西地中海劫掠潮"
 oe_mag.4.d: "来自阿尔及尔、突尼斯与的黎波里的快帆船队已然主宰了西地中海的夏秋海季。满载战利品与赎金的船队令北非港口财源滚滚，而西西里、巴利阿里、安达卢西亚与意大利沿岸的基督教城邦却人人自危。\n\n船长行会请示下一步方略：全面放开大私掠潮狠狠打击西地中海基督教航运，还是转入规范化的海事通行证与赎金制度？"
 oe_mag.4.a: "全面放开巴巴里大私掠潮！重创西地中海基督教各国海贸"
 oe_mag.4.a.tt: "获得#G +160金币#!，海军传统#G +10#!，巴巴里热度达峰值#Y 3#!，对西地中海基督教列强施加[ShowModifier('oe_mag_western_raid_pressure')]与敌意，获得[ShowModifier('oe_mag_grand_corso_economy')]，持续#Y 30年#!。"
 oe_mag.4.b: "推行地中海海事通行证与赎金契约，将袭掠转为稳定岁入"
 oe_mag.4.b.tt: "获得#G +90金币#!，稳定度#G +3#!，巴巴里热度降至#Y 1#!，获得[ShowModifier('oe_mag_ransom_passports')]，持续#Y 30年#!。"
 oe_mag.5.t: "海盗黄金时代终局：地中海清剿与私掠转型"
 oe_mag.5.d: "随着大洋时代的火炮战列舰驰骋四海、加勒比与地中海两端的海盗黄金时代步入尾声，列强海军再也不愿容忍私掠港扼制要津。重炮舰队已抵近北非海岸，通牒限期解散私掠行会、交还被扣商船。\n\n持续百余年的巴巴里私掠格局迎来最终清算：是率领大舰队彻底清剿海盗巢穴以复西地中海海运，将私掠水手改编为正规国家海军，还是依托岸防堡垒孤注一掷抗击到底？"
 oe_mag.5.a: "铁腕清剿巴巴里私掠巢穴，重塑西地中海长治海权！"
 oe_mag.5.a.tt: "花费#R 200金币#!、人力#R −1.5#!，海军传统#G +12#!，清零巴巴里热度（若正承受罗马帝国重负则缓解#G −3#!），获得[ShowModifier('oe_mag_piracy_pacified')]，持续#Y 40年#!。"
 oe_mag.5.b: "招安并改编私掠水手为国家正规远洋舰队"
 oe_mag.5.b.tt: "花费#R 140金币#!，海军传统#G +10#!，清零巴巴里热度，获得[ShowModifier('oe_mag_regular_admiral_fleet')]，持续#Y 35年#!。"
 oe_mag.5.c: "绝不屈服！加固阿尔及尔与的黎波里炮台死守私掠传统"
 oe_mag.5.c.tt: "花费#R 120金币#!，威望#G +12#!，维持巴巴里热度#Y 2#!，获得[ShowModifier('oe_mag_corsair_last_stand')]，持续#Y 30年#!。"
 oe_mag.6.t: "黄金之国：马里与桑海的跨撒哈拉商队"
 oe_mag.6.d: "尼日尔河畔的尼亚尼、廷巴克图与高城灯火通明，来自布雷与班布克金矿的砂金正装入牛皮囊袋，静候着北穿撒哈拉的万峰驼队。北方菲斯与突尼斯的商馆正翘首以盼，愿以岩盐、铜器、丝帛与骏马换取西非黄金。\n\n马里与桑海的宫廷须定夺黄金输出尺度：是大规模派遣王室黄金商队北上大赚商利（却会推高撒哈拉黄金潮与通胀），还是在廷巴克图与高城实行公允盐金官价以保民生稳健？"
 oe_mag.6.a: "派遣王室黄金大商队北上菲斯与突尼斯，称雄跨撒哈拉商路！"
 oe_mag.6.a.tt: "获得#G +180金币#!，威望#G +10#!，撒哈拉黄金潮升至#Y 2#!（联动帝国通胀），建[ShowModifier('oe_mag_caravan_hub_loc')]并增进北非终端好感，获得[ShowModifier('oe_mag_mali_gold_caravans')]，持续#Y 35年#!。"
 oe_mag.6.b: "在廷巴克图与高城实行盐金公允官价，藏富于学城民生"
 oe_mag.6.b.tt: "获得#G +80金币#!，稳定度#G +5#!，撒哈拉黄金潮维持温和#Y 1#!，建[ShowModifier('oe_mag_caravan_hub_loc')]，获得[ShowModifier('oe_mag_salt_gold_regulation')]，持续#Y 35年#!。"
 oe_mag.7.t: "廷巴克图至菲斯：撒哈拉黄金涌入与通胀考验"
 oe_mag.7.d: "经由廷巴克图与高城北上的撒哈拉黄金驼队源源不断涌入菲斯、马拉喀什、西吉勒马萨与突尼斯。铸币厂日夜不息地熔铸金第纳尔，国库骤然充盈；但集市上的谷物与布匹价格也在悄然飞涨，这股黄金洪流甚至开始波及整个地中海的货币秩序。\n\n我们是放手大铸金币以充军国急用（将把撒哈拉黄金潮推至最高峰值），还是设立西吉勒马萨黄金储备库平抑通胀？"
 oe_mag.7.a: "放手大铸撒哈拉金第纳尔！以澎湃财力支撑强军霸业"
 oe_mag.7.a.tt: "获得#G +240金币#!，稳定度#R −3#!，将#bold #color_yellow 撒哈拉黄金潮#!#!推至峰值#Y 3#!（供后续帝国熵增通胀维读取），建[ShowModifier('oe_mag_caravan_hub_loc')]，获得[ShowModifier('oe_mag_gold_mint_surge')]，持续#Y 35年#!。"
 oe_mag.7.b: "设立西吉勒马萨黄金储备库与平抑关税，稳住币值物价"
 oe_mag.7.b.tt: "花费#R 100金币#!，稳定度#G +4#!，将撒哈拉黄金潮回落至#Y 1#!，建[ShowModifier('oe_mag_caravan_hub_loc')]，获得[ShowModifier('oe_mag_sijilmasa_reserve')]，持续#Y 35年#!。"
 oe_mag.8.t: "罗马重返撒哈拉：从突尼斯通往廷巴克图"
 oe_mag.8.d: "自塞普蒂米乌斯·塞维鲁皇帝时代以来，已逾千年未有罗马双鹰旌旗望见撒哈拉南缘的绿洲。如今随着帝国光复北非重镇，突尼斯与的黎波里的希腊—拉丁商团携带着柏柏尔向导呈上奏折：只消朝廷颁发敕令，帝国驼队即可沿费赞古道南下廷巴克图与高城，直接连通西非马里与桑海的黄金之源！\n\n紫室是否应资助这场跨越沙海的帝国远商壮举，还是谨守绿洲关隘、专收过境关税？"
 oe_mag.8.a: "敕许帝国跨撒哈拉商队南下廷巴克图！重续罗马沙漠古道"
 oe_mag.8.a.tt: "花费#R 160金币#!，威望#G +15#!，若撒哈拉黄金潮低于#Y 2#!则升至#Y 2#!，与马里/桑海互增好感#G +40#!，建[ShowModifier('oe_mag_caravan_hub_loc')]，获得[ShowModifier('oe_mag_roman_sahara_caravan')]，持续#Y 35年#!。"
 oe_mag.8.b: "谨守北非绿洲商关、课征过境关税以防黄金通胀外溢"
 oe_mag.8.b.tt: "花费#R 80金币#!，稳定度#G +4#!，将撒哈拉黄金潮压回#Y 1#!，获得[ShowModifier('oe_mag_sijilmasa_reserve')]，持续#Y 30年#!。"
 oe_mag.9.t: "非洲总督区深治（一）：重建迦太基港与帝国谷仓"
 oe_mag.9.d: "紫色双鹰再度飘扬在突尼斯湾与古迦太基遗址之上！自查士丁尼时代名将贝利撒留收复北非以来，非洲行省便以富饶的迈杰尔达河谷麦田与海上粮运闻名天下。\n\n非洲总督呈报深治第一步：若拨发巨款按古典圆形港制式重建迦太基码头与官立大谷仓，将源源不断地向君士坦丁堡输送公粮、显著缓解帝国行政重负；若财力吃紧，亦可将码头商税暂行包租予特许商行。"
 oe_mag.9.a: "拨款重建迦太基港与帝国官立谷仓，重开北非运粮航道！"
 oe_mag.9.a.tt: "推进非洲深治至第#Y 1#!步，花费#R 220金币#!，威望#G +12#!，缓解#bold #color_yellow 帝国重负#!#!#G −5#!（已设非洲管区/总督额外#G −2#!），于突尼斯建[ShowModifier('oe_mag_carthage_granary_loc')]，获得[ShowModifier('oe_mag_african_annona')]，持续#Y 40年#!。"
 oe_mag.9.b: "将突尼斯码头关税包租予帝国特许商团，轻装理政"
 oe_mag.9.b.tt: "推进非洲深治至第#Y 1#!步，花费#R 100金币#!，缓解#bold #color_yellow 帝国重负#!#!#G −2#!，升级突尼斯港区，获得[ShowModifier('oe_mag_carthage_merchant_lease')]，持续#Y 35年#!。"
 oe_mag.10.t: "非洲总督区深治（二）：的黎波里边墙与柏柏尔诸部"
 oe_mag.10.d: "沿海的迦太基港口初定，南方的阿特拉斯山地与的黎波里荒漠却暗潮涌动。善战的柏柏尔（阿马齐格）诸部骑兵熟稔每一处绿洲与山口，昔日拜占庭非洲总督区正是在边墙守备与部落叛乱之间耗尽了心血。\n\n非洲深治第二步摆在案头：是沿古典“的黎波里边墙（Limes Tripolitanus）”体系筑堡驻防以绝后患，还是仿效罗马同盟军（Foederati）旧例以岁赐招抚柏柏尔酋长为帝国戍边？"
 oe_mag.10.a: "重筑的黎波里罗马边墙要塞线，以铁壁烽燧牢控南疆"
 oe_mag.10.a.tt: "推进非洲深治至第#Y 2#!步，花费#R 200金币#!、人力#R −1.5#!，缓解#bold #color_yellow 帝国重负#!#!#G −3#!，建[ShowModifier('oe_mag_limes_citadel_loc')]，获得[ShowModifier('oe_mag_limes_tripolitanus')]，持续#Y 40年#!。"
 oe_mag.10.b: "以岁赐招抚柏柏尔诸部为帝国同盟轻骑，以夷制边"
 oe_mag.10.b.tt: "推进非洲深治至第#Y 2#!步，花费#R 120金币#!，陆军传统#G +8#!，缓解#bold #color_yellow 帝国重负#!#!#G −2#!，获得[ShowModifier('oe_mag_berber_foederati')]，持续#Y 40年#!。"
 oe_mag.11.t: "非洲总督区深治（三）：荡平阿尔及尔与的黎波里海盗巢穴"
 oe_mag.11.d: "纵使突尼斯粮港与内陆边墙渐次成型，盘踞在阿尔及尔、贝贾亚与的黎波里礁湾的巴巴里私掠船队仍是西地中海的心腹大患。帝国粮船一旦驶离迦太基湾，便屡遭快帆劫掠。\n\n非洲深治第三步要求彻底解决海患：动用帝国主力舰队对阿尔及尔与的黎波里海盗巢穴展开扫荡、改建帝国非洲舰队母港，还是仅沿海岸修筑烽燧并组织商船护航？"
 oe_mag.11.a: "出动帝国舰队彻底荡平阿尔及尔与的黎波里海盗巢穴！"
 oe_mag.11.a.tt: "推进非洲深治至第#Y 3#!步，花费#R 220金币#!、人力#R −2#!，海军传统#G +12#!，清零巴巴里热度，缓解#bold #color_yellow 帝国重负#!#!#G −3#!，建[ShowModifier('oe_mag_imperial_fleet_base_loc')]，获得[ShowModifier('oe_mag_west_med_patrol')]，持续#Y 40年#!。"
 oe_mag.11.b: "广建北非海岸石筑烽燧并组织常备商船护航"
 oe_mag.11.b.tt: "推进非洲深治至第#Y 3#!步，花费#R 110金币#!，海军传统#G +6#!，压低巴巴里热度，升级海防基地，获得[ShowModifier('oe_mag_coastal_watchtowers')]，持续#Y 35年#!。"
 oe_mag.12.t: "非洲总督区深治（四）：拉丁—柏柏尔—希腊基督教社群复兴"
 oe_mag.12.d: "迦太基港粮船如织、的黎波里边墙巍峨、西地中海波平浪静——非洲总督区终于迎来第四步收官大计。在圣西普里安与圣奥古斯丁曾经牧养的故土之上，古老的北非拉丁基督教遗裔、新迁来的希腊—罗马垦民与愿归帝国法统的柏柏尔社群齐聚迦太基大教堂。\n\n这是将北非真正融入帝国文明脉络的终局抉择：重立迦太基大主教区并全力加速北非罗马化同化进程，还是召开拉丁—柏柏尔—希腊宽容公会议，以多元共融凝聚北非民心？"
 oe_mag.12.a: "重立迦太基大主教区，强力推进北非罗马化同化与普世宣教！"
 oe_mag.12.a.tt: "完成非洲深治第#Y 4#!步，花费#R 200金币#!，稳定度#R −2#!，威望#G +15#!，缓解#bold #color_yellow 帝国重负#!#!#G −5#!（若已启非洲管区或北非同化运动则额外稳定#G +4#!、减负#G −3#!），建[ShowModifier('oe_mag_carthage_see_loc')]并获[ShowModifier('oe_mag_carthage_christian_revival')]，持续#Y 45年#!。"
 oe_mag.12.b: "召开拉丁—柏柏尔—希腊三语宽容公会议，以多元共融安抚北非"
 oe_mag.12.b.tt: "完成非洲深治第#Y 4#!步，花费#R 140金币#!，稳定度#G +5#!，缓解#bold #color_yellow 帝国重负#!#!#G −3#!（若已启非洲管区或北非同化运动则额外威望#G +8#!、减负#G −2#!），建[ShowModifier('oe_mag_carthage_see_loc')]并获[ShowModifier('oe_mag_african_synod_tolerance')]，持续#Y 45年#!。"
 oe_mag.20.t: "马格里布与迦太基总督区：选项生效"
 oe_mag.90.t: "【测试】马格里布、巴巴里海盗与迦太基总督区（63号槽）：状态读数"
 oe_mag.90.d: "#T 马格里布与巴巴里海盗#!\n三朝霸权(1霸/2和/3部) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_hegemony')|0]  海峡(1守/2商) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_strait')|0]  私掠模式(1独/2奥/3关) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_corsair_mode')|0]  海盗热度(0-3) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_corsair_heat')|0]  原版海盗局势 [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_vanilla_piracy')|0]  终局(1剿/2编/3守) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_piracy_settled')|0]\n#T 跨撒哈拉黄金商路(联动v8.5熵增)#!\n黄金潮(0-3) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_gold_surge')|0]  西非商队(1盛/2稳) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_wa_caravan')|0]  北非铸币(1涨/2储) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_mint')|0]  罗马撒哈拉(1通/2关) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_roman_sahara')|0]\n#T 迦太基总督区与63号槽#!\n深治步数(0-4) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_exarch_step')|0]  边墙(1墙/2柏) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_limes')|0]  复兴(1同/2宽) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_revival')|0]  帝国重负(-1无) [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_ar_strain')|0]  月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_m')|0]  结束码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_end')|0]  已发数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_mag_rd_cnt')|0]\n（结束码：0运行中、3超1685年关闭；黄金潮变量名：global_var:oe_mag_gold_surge）"
