l_simp_chinese:
 oe_hetaireia_barracks: "赫泰里亚军营"
 oe_hetaireia_barracks_desc: "军旗与圣像并列悬于营门之上。这里的士兵不以乡音区分彼此，而以共同的信仰和服役誓言相认。\n\n只能由东罗马在东正教地点修建。初始上限#Y 1级#!，完成#Y 扩招赫泰里亚#!后提高至#Y 2级#!。每级雇用#Y 1000名士兵#!，满额运转时提供本地人力#G +10#!。\n\n每个已建成等级分别提供赫泰里亚重步兵与埃特尼科伊轻步兵各#G 1个#!独立名额。罗姆文化地点上的每级军营另提供#G 1个#!图科波洛伊与罗姆甲胄骑兵共用名额；默西亚或特里巴利文化地点上的每级军营提供#G 1个#!正教卫道骑兵名额。"
 oe_hetaireia_tax_exemption: "免税权"
 oe_hetaireia_tax_exemption_desc: "皇帝以免税的敕令确认赫泰里亚的服役义务。军人的所得用于供养家眷、置备行装，而不再缴入税吏的账册。\n\n赫泰里亚满意度均衡#G +20%#!，阶层力量#Y +33%#!，征税上限#R −100%#!。"
 OE_TURCOPOLES_BARRACKS_LIMIT: "罗姆文化地点上的赫泰里亚军营"
 OE_TURCOPOLES_SHARED_LIMIT_TT: "所有时代的图科波洛伊与罗姆甲胄骑兵现有编制合计尚未达到军营提供的数量上限。"
 oe_turcopoles_1: "图科波洛伊弓骑兵"
 oe_turcopoles_1_desc: "从小亚细亚的牧场到色雷斯的驿道，罗姆骑手将弓马之技带入帝国军籍。他们披轻甲、备复合弓，在军阵两翼寻找敌人松动的瞬间。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!。"
 oe_turcopoles_2: "图科波洛伊骑射手"
 oe_turcopoles_2_desc: "军营中的合练使旧日的骑射本领有了共同的号令。图科波洛伊以轮番射击扰乱敌阵，再借轻捷的战马脱离追击。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!。"
 oe_turcopoles_3: "图科波洛伊轻枪骑兵"
 oe_turcopoles_3_desc: "面对愈发严整的步兵方阵，骑手们增添了轻矛。他们仍以侦察和袭扰为先，只在侧翼出现破绽时投身冲击。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!。"
 oe_turcopoles_4: "图科波洛伊火绳枪骑兵"
 oe_turcopoles_4_desc: "火绳枪的烟火开始取代一部分弓弦的轻响。图科波洛伊学习携枪驰骋、下马射击，在远行与交锋之间保留轻骑兵的敏捷。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!。"
 oe_turcopoles_5: "图科波洛伊卡宾枪骑兵"
 oe_turcopoles_5_desc: "统一配发的卡宾枪、马刀与鞍具使这些骑队更加整齐。他们守护军队的视野，袭击敌人的补给，并在追击中扩大胜果。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!。"
 oe_turcopoles_6: "图科波洛伊猎骑兵"
 oe_turcopoles_6_desc: "古老的图科波洛伊之名如今由训练有素的猎骑兵继承。他们以散开的队形遮蔽大军行踪，在战线破裂时迅速追入敌后。\n\n东罗马专属轻骑兵。普通与强化型号、两条骑兵线的所有时代共用直属罗姆文化地点上的赫泰里亚军营名额，每座军营提供1个名额。\n\n相比同代普通轻骑兵：兵力伤害#G +10%#!、战斗速度#G +1#!、移动速度#G +1#!。"
