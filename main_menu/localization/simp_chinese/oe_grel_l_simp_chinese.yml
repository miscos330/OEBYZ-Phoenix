# NEW 2026-11-21 v9.9 Worker 4: Global Religion Engine Deepening & 24 Holy Sites (oe_grel_). Generated by gen_v99_religion.py.
 oe_grel_nestorian_silk_charter:0 "东方教会丝路宣教宪章"
 oe_grel_nestorian_silk_charter_desc:0 "确立东方教会横跨美索不达米亚、河中与大都崇福司的宣教宪章，在巴比伦古统、汗廷护持与叙利亚—波斯译经之间决定东方基督教文明走向。"
 oe_grel_nestorian_imperial_rite:0 "东方圣统对异教帝国之礼仪"
 oe_grel_nestorian_imperial_rite_desc:0 "规范东方教会如何在大元、伊儿汗与印度洋诸国之间维系教区自治、宫廷祈福契约与跨洋商馆护助网络。"
 oe_grel_nest_seleucia_orthodoxy:0 "巴比伦—塞琉西亚古统"
 oe_grel_nest_seleucia_orthodoxy_desc:0 "恪守塞琉西亚—泰西封大牧首古礼与东方圣统正典，凝聚美索不达米亚与黎凡特教区向心力。"
 oe_grel_nest_khanbaliq_chongfusi:0 "汗八里·崇福司宫廷宣教"
 oe_grel_nest_khanbaliq_chongfusi_desc:0 "借重元廷崇福司统理也里可温之典制，将东方教会主教网与草原大汗宫廷紧密相连，拓宽丝路外交与多教共荣。"
 oe_grel_nest_syriac_translation_school:0 "叙利亚—波斯译经学院"
 oe_grel_nest_syriac_translation_school_desc:0 "承续尼西比斯与贡迪沙普尔译经学统，广译希腊医学、星历与神学典籍，以学术与识字推动丝路文明互通。"
 oe_grel_nest_khanate_blessing_pact:0 "草原汗廷祈福契约"
 oe_grel_nest_khanate_blessing_pact_desc:0 "循怯烈部与汪古部古例，为草原可汗与万户祈福免赋，换取教区安全、骑兵援军与商路通行特许。"
 oe_grel_nest_malabar_maritime_network:0 "印度洋圣多马商馆互助"
 oe_grel_nest_malabar_maritime_network_desc:0 "打通波斯湾、马拉巴尔圣多马教会与刺桐港海商网络，以教区信义担保远洋香料与丝绸汇兑。"
 oe_grel_nest_monastic_scriptoria:0 "修院苦修与抄本保存"
 oe_grel_nest_monastic_scriptoria_desc:0 "依托拉班·霍尔米兹德与两河山谷修道院苦修抄经，稳固教区民心并加速边疆族群归化。"
 oe_grel_miaphysite_ecumenical_rite:0 "非迦克墩大公礼仪律法"
 oe_grel_miaphysite_ecumenical_rite_desc:0 "统筹亚历山大科普特教会、亚美尼亚使徒教会与埃塞俄比亚所罗门正统教的普世礼仪路线，在隐修苦行、高加索大教长威权与阿克苏姆约柜王权之间确立圣统重心。"
 oe_grel_mia_alexandrian_desert_canon:0 "亚历山大科普特沙漠隐修道统"
 oe_grel_mia_alexandrian_desert_canon_desc:0 "尊崇圣马可宝座与尼罗河沙漠隐修先贤之教法，以忍耐、学识、严格教规与稳健传教护持教群。"
 oe_grel_mia_etchmiadzin_catholicosate:0 "亚美尼亚埃奇米阿津大教长威权"
 oe_grel_mia_etchmiadzin_catholicosate_desc:0 "以埃奇米阿津与西斯教座为高加索与奇里乞亚脊梁，联结亚美尼亚手工业行会与跨欧亚使节网络。"
 oe_grel_mia_aksumite_solomonic_ark:0 "阿克苏姆·约柜所罗门王权"
 oe_grel_mia_aksumite_solomonic_ark_desc:0 "奉阿克苏姆锡安约柜与《诸王之荣》圣约为立国根基，以高地城堡、坚毅民兵与边疆异教宣教护卫红海与尼罗河上游圣土。"
 oe_grel_islamic_waqf_madrasa_law:0 "瓦合甫宗教基金与经学院体制"
 oe_grel_islamic_waqf_madrasa_law_desc:0 "规范帝国瓦合甫善产基金的投向与大经师宫廷建制：兴建帝国大经学院增聘经师、护持苏菲道堂融合边疆，或严守沙里亚法学正统以强政令。"
 oe_grel_islamic_caliphate_legitimacy_law:0 "哈里发法统与两圣地监护宪章"
 oe_grel_islamic_caliphate_legitimacy_law_desc:0 "界定伊斯兰大权国家对两圣地监护权与最高宗教法统的宣称形态，决定帝国在乌玛世界中的号召力与正统格局。"
 oe_grel_isl_grand_madrasa_network:0 "帝国大经学院网络"
 oe_grel_isl_grand_madrasa_network_desc:0 "以御赐瓦合甫永业基金广建帝国大经学院，允许宫廷同时延聘更多大乌里玛经师讲学注经，代价是神职阶层权势随之上升。"
 oe_grel_isl_sufi_khanqah_patronage:0 "苏菲道堂教团护持"
 oe_grel_isl_sufi_khanqah_patronage_desc:0 "广施瓦合甫善产于梅夫拉纳、纳克什班迪、贝克塔什与钦什蒂苏菲道堂，以神秘灵修与慈悲教化缓和多元行省动荡。"
 oe_grel_isl_sharia_fiqh_orthodoxy:0 "严正沙里亚法学派正统"
 oe_grel_isl_sharia_fiqh_orthodoxy_desc:0 "尊崇正统法学派大法官裁决，统一商法、田赋与教律尺度，大幅提升立法效率、财税秩序与同教凝聚力。"
 oe_grel_isl_abbasid_shadow_caliphate:0 "开罗阿拔斯监护法统"
 oe_grel_isl_abbasid_shadow_caliphate_desc:0 "仿效马穆鲁克苏丹尊奉阿拔斯哈里发居于开罗之故事，以“正统护法苏丹”之名号凝聚逊尼诸邦外交威信。"
 oe_grel_isl_grand_caliphate_claim:0 "两圣地大哈里发宣称"
 oe_grel_isl_grand_caliphate_claim_desc:0 "以两圣地麦加与麦地那之实际护持者或帝国尊号，正式宣称普世大哈里发法统，以无上威权号令四方圣战与朝觐商道。"
 oe_grel_isl_twelver_imamate_regency:0 "十二伊玛目摄政与伊巴德公议"
 oe_grel_isl_twelver_imamate_regency_desc:0 "面向什叶派十二伊玛目大阿亚图拉摄政传统或伊巴德派公议伊玛目法统，强化圣律教化、守土决心与海陆商道自律。"
 oe_grel_cc_eastern_roman_policy:0 "对复兴东方帝国之教廷方针"
 oe_grel_cc_eastern_roman_policy_desc:0 "当君士坦丁堡的东方帝国屹立不倒甚至重返地中海舞台时，罗马公教廷与天主教诸国须表决对东方的长期方针：延续佛罗伦萨合一对话、维持拉丁护教警戒、缔结务实均势，或在旧神重临君堡时结成反异教神圣同盟。"
 oe_grel_cc_florence_dialogue:0 "佛罗伦萨合一续议"
 oe_grel_cc_florence_dialogue_desc:0 "以温和外交延续东西教会神学对话，放宽天东商贸与外交往来，提升天主教世界对异端基督徒之宽容与声誉，但相应放缓异端改宗。"
 oe_grel_cc_latin_crusade_vigil:0 "拉丁护教十字军警戒"
 oe_grel_cc_latin_crusade_vigil_desc:0 "防备复兴东罗马西进并动员托钵修会与护教传教网络，赋予罗马教廷与天主教诸国更强防务、士气与分轨异端/异教传教效率，唯收紧异端宽容。"
 oe_grel_cc_mediterranean_equilibrium:0 "地中海务实均势默契"
 oe_grel_cc_mediterranean_equilibrium_desc:0 "暂搁东西教会百年宿怨，聚焦地中海航运安全与抗衡外敌，惠及全天主教世界的海事商贸与稳定效率。"
 oe_grel_cc_anti_pagan_league:0 "反异教神圣十字军同盟"
 oe_grel_cc_anti_pagan_league_desc:0 "当君士坦丁堡重立古罗马多神祭坛之际，全天主教公教廷紧急拉响护教警报，号召拉丁诸王集结兵锋捍卫基督教世界。"
 oe_grel_hindu_bhakti_guru_law:0 "虔诚派与皇家古鲁书院法"
 oe_grel_hindu_bhakti_guru_law_desc:0 "确立次大陆王廷对古鲁经师、虔诚派民间布道与大庙宇神圣化身祭祀的制度扶持。"
 oe_grel_shinto_governance_law:0 "神道教务与神佛习合律"
 oe_grel_shinto_governance_law_desc:0 "统筹列岛神社与寺院之关系、本愿寺一向一揆羁縻对策以及南蛮切支丹传教管控，严格联动神道净洁与荣誉礼制。"
 oe_grel_theravada_chakravartin_law:0 "僧伽王权与转轮圣王法典"
 oe_grel_theravada_chakravartin_law_desc:0 "仿效锡兰、蒲甘与素可泰佛王古制，在护法转轮圣王、林居僧伽清修与南洋海路通商护法之间裁定国本。"
 oe_grel_hindu_royal_guru_college:0 "皇家古鲁书院"
 oe_grel_hindu_royal_guru_college_desc:0 "广延吠檀多、瑜伽与正理派大古鲁入宫讲学，增设宫廷宗教导师席位并加速全民识字与学术精进。"
 oe_grel_hindu_bhakti_movement:0 "虔诚派民间布道与化身共祭"
 oe_grel_hindu_bhakti_movement_desc:0 "护持以方言诗歌唱诵神恩的虔诚派运动，增开神明化身祭祀名额，凝聚庶民民心并提升跨教容忍。"
 oe_grel_hindu_temple_patronage:0 "大庙宇王权护持"
 oe_grel_hindu_temple_patronage_desc:0 "厚赐维查耶那伽罗与南印大庙宇田庄税赋，以神圣王权提升正统性、地方繁荣与国土防御。"
 oe_grel_shinto_shinbutsu_shugo:0 "神佛习合律"
 oe_grel_shinto_shinbutsu_shugo_desc:0 "承袭本地垂迹神佛习合古制，调和神社与佛寺教务，稳固净洁度、国内安定与多元包容。"
 oe_grel_shinto_ikko_containment:0 "本愿寺一向一揆羁縻令"
 oe_grel_shinto_ikko_containment_desc:0 "严控武装宗门庄园并收编僧兵粮道，以武家威严与荣誉整肃地方控制度与税赋秩序。"
 oe_grel_shinto_kirishitan_edict:0 "南蛮切支丹管控令"
 oe_grel_shinto_kirishitan_edict_desc:0 "严格核查南蛮商港传教活动，既严防教民割据又借出岛式特许窗口汲取海外技艺与净洁正统。"
 oe_grel_thera_chakravartin_code:0 "转轮圣王护法正统"
 oe_grel_thera_chakravartin_code_desc:0 "以十王法与转轮圣王护法威仪统摄僧俗，增益善业、王权正统与邻邦外交声望。"
 oe_grel_thera_forest_sangha:0 "林居僧伽清修改革"
 oe_grel_thera_forest_sangha_desc:0 "敕令大长老整饬寺产戒律并兴办巴利文抄经学院，显著提升民间识字、安定度与佛法归化速度。"
 oe_grel_thera_maritime_dharma:0 "锡兰—暹罗海路护法通商"
 oe_grel_thera_maritime_dharma_desc:0 "以康提佛牙寺与湄南河海港为枢纽，借僧伽遣使护航孟加拉湾与南海商船，兼收通商红利与和平声誉。"
 oe_asp_wittenberg_constantinople_letters:0 "维滕贝格—君堡神学通书"
 oe_asp_wittenberg_constantinople_letters_desc:0 "取材 1573–1581 年路德宗学者与君士坦丁堡普世牧首耶利米亚二世之历史神学通信，深化古典希腊文献研读与对东方基督教世界的外交共鸣。"
 oe_asp_reformed_printing_guilds:0 "改革宗印刷行会"
 oe_asp_reformed_printing_guilds_desc:0 "扶持城邦印刷工坊与方言经籍刻印行会，大幅加快学术研究、识字率增长与思潮传播。"
 oe_asp_consistory_civic_discipline:0 "市民宗教法庭与教区纪律"
 oe_asp_consistory_civic_discipline_desc:0 "仿效日内瓦公理会与长老法庭体制，严明市民风纪、稳定行政与税赋征收秩序。"
 oe_asp_huguenot_artisan_mutual_aid:0 "胡格诺工匠互助会"
 oe_asp_huguenot_artisan_mutual_aid_desc:0 "通过跨教区信徒工匠互助网络汇聚织造、钟表与金融专才，提升全国生产与出口效能。"
 oe_asp_royal_supremacy_colleges:0 "皇家至上法案经院"
 oe_asp_royal_supremacy_colleges_desc:0 "由王室直接统筹大学经院与主教律法，兼顾王权立法效率、正统威仪与教界清正。"
 oe_asp_anglican_maritime_chaplains:0 "海洋教区与海外随舰牧师"
 oe_asp_anglican_maritime_chaplains_desc:0 "随远洋舰队与海外商站派驻随舰牧师，砥砺海军士气、拓宽海贸航程并充实水手储备。"
 oe_asp_lutheran_princely_ordinances:0 "诸侯教会条例与学校法"
 oe_asp_lutheran_princely_ordinances_desc:0 "颁行系统的邦国教会与教区小学条例，使教务巡视、官僚行政与基础教育深度合流。"
 oe_asp_bohemian_chalice_guard:0 "波希米亚圣杯卫队"
 oe_asp_bohemian_chalice_guard_desc:0 "弘扬塔博尔车阵与圣杯派护教精神，大幅提振抗敌防御、陆军士气与持久战韧性。"
 oe_god_sulde_banner:0 "长生天战旗苏鲁锭"
 oe_god_sulde_banner_desc:0 "象征长生天赐予大汗之不败战魂苏鲁锭，战时护佑草原铁骑突袭与汗廷凝聚力。"
 oe_god_etugen_earth:0 "草原大地母神额图根"
 oe_god_etugen_earth_desc:0 "蒙突厥草原自古尊奉之大地母神额图根，护佑水草丰美、牧群繁衍与汗国生息繁盛。"
 oe_god_baishan_guardian:0 "白山长白护国神"
 oe_god_baishan_guardian_desc:0 "白山黑水间女真诸部世代祭祀之长白山神，护持骑射铁军与林海雪原天险。"
 oe_god_steppe_polaris:0 "丝路星辰商神"
 oe_god_steppe_polaris_desc:0 "照耀欧亚草原夜行商队之北辰星神，指引万里驿道互市与远途贸易往来。"
 oe_avatar_vishnu_jalashayi:0 "毗湿奴·南洋护航化身"
 oe_avatar_vishnu_jalashayi_desc:0 "安卧乳海而统御季风洋流之毗湿奴护航化身，护佑印度洋商港繁荣、远洋舰队士气与跨海通商。"
 oe_avatar_vishnu_deccan_chakradhara:0 "毗湿奴·德干法轮守护者"
 oe_avatar_vishnu_deccan_chakradhara_desc:0 "手持法轮镇护高原城邦之守护化身，强化全军纪律与地方控制度。"
 oe_avatar_vishnu_venkateshwara:0 "毗湿奴·蒂鲁帕蒂财富赐予者"
 oe_avatar_vishnu_venkateshwara_desc:0 "蒂鲁帕蒂七山圣殿尊奉之赐福化身，润泽国库赋税效率与民间生计繁荣。"
 oe_avatar_vishnu_hayagriva:0 "毗湿奴·马头明智书院化身"
 oe_avatar_vishnu_hayagriva_desc:0 "守护吠陀圣典与宫廷星算哲理之明智化身，加速帝国学术研究与全民识字。"
 oe_avatar_shiva_nataraja:0 "湿婆·纳塔拉贾宇宙之舞"
 oe_avatar_shiva_nataraja_desc:0 "承袭朱罗青铜造像与奇丹巴拉姆圣殿之湿婆宇宙之舞，激发文化传统、王廷威望与刚健战意。"
 oe_avatar_durga_mahishasura:0 "难近母·王权胜战化身"
 oe_avatar_durga_mahishasura_desc:0 "诛除魔军而护佑王权城垒之难近母胜战化身，赋予守土韧性、高昂军心与抗疲惫毅力。"
 oe_hs_khanbaliq_cross_cathedral:0 "汗八里景教大堂"
 oe_hs_zaytun_cross_monastery:0 "刺桐港也里可温十字寺"
 oe_hs_merv_metropolitan_see:0 "梅尔夫总主教座"
 oe_hs_school_of_nisibis:0 "尼西比斯学院圣座"
 oe_hs_rabban_hormizd_monastery:0 "拉班·霍尔米兹德修院"
 oe_hs_etchmiadzin_mother_see:0 "埃奇米阿津母座大教堂"
 oe_hs_ani_thousand_churches:0 "阿尼千座教堂古城"
 oe_hs_sis_cilician_catholicosate:0 "西斯奇里乞亚教座"
 oe_hs_lalibela_rock_churches:0 "拉利贝拉岩石教堂群"
 oe_hs_aksum_mary_of_zion:0 "阿克苏姆锡安圣母大教堂"
 oe_hs_al_azhar_mosque:0 "开罗爱资哈尔大清真寺"
 oe_hs_bukhara_kalyan_naqshbandi:0 "布哈拉卡扬大寺与圣陵"
 oe_hs_great_mosque_cordoba:0 "科尔多瓦大清真寺"
 oe_hs_konya_mevlana_dargah:0 "科尼亚鲁米梅夫拉纳道堂"
 oe_hs_ajmer_chishti_dargah:0 "阿杰梅尔钦什蒂圣陵"
 oe_hs_nizwa_ibadi_imamate_mosque:0 "尼兹瓦伊巴德大清真寺"
 oe_hs_aachen_imperial_cathedral:0 "亚琛帝国大教堂"
 oe_hs_prague_st_vitus:0 "布拉格圣维特大教堂"
 oe_hs_krakow_wawel_cathedral:0 "克拉科夫瓦维尔大教堂"
