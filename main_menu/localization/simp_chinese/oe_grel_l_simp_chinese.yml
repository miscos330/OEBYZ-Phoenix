 STATIC_MODIFIER_DESC_oe_grel_hellenic_fatwa_defense_mod:0 "大乌里玛就罗马背弃有经人身份颁布严正法特瓦，激励圣战防卫士气与同教凝聚。"
 oe_grel_hellenic_interpretatio_mod:0 "罗马万神殿与东方礼制共鸣"
 STATIC_MODIFIER_NAME_oe_grel_hellenic_interpretatio_mod:0 "罗马万神殿与东方礼制共鸣"
 STATIC_MODIFIER_DESC_oe_grel_hellenic_interpretatio_mod:0 "当复兴古罗马使节携古典多神祭礼与东方礼制文明相遇，双方围绕天地郊祀、诸神谱系与丝路通商结成奇异共鸣。"
 oe_grel_nest_dispatch_silk_bishop:0 "派遣丝路叙利亚语巡回主教"
 oe_grel_nest_dispatch_silk_bishop_desc:0 "遣使东方教会巡回主教巡视丝绸之路沿线教区与商站，提升跨区贸易范围、异教容忍与外交声望。"
 oe_grel_nest_chongfusi_academy:0 "主持崇福司医药与天文讲学"
 oe_grel_nest_chongfusi_academy_desc:0 "召集东方教会医官、译经师与历算学者开设讲堂，抉择以学术、商贸或抄经强盛教区。"
 oe_grel_nest_reconnect_three_sees:0 "重连巴格达—撒马尔罕—马拉巴尔圣座"
 oe_grel_nest_reconnect_three_sees_desc:0 "遣使联络东方教会三大历史重镇，重振跨越波斯湾与中亚的普世圣统威望。"
 oe_grel_nest_three_sees_tt:0 "巴格达、撒马尔罕或科钦至少一处已由有主国家治理且本国保持和平。"
 oe_grel_mia_chalcedonian_dialogue:0 "召开新迦克墩神学对话会"
 oe_grel_mia_chalcedonian_dialogue_desc:0 "邀请东方正统教与东正教神学家共议礼仪和解，化解千年隔阂并换取亚美尼亚、奇里乞亚与拜占庭之间的深层协作。"
 oe_grel_mia_nile_pilgrimage_charter:0 "红海—亚历山大朝圣护持"
 oe_grel_mia_nile_pilgrimage_charter_desc:0 "派遣使节协调开罗科普特牧首与埃塞俄比亚红海朝圣商道，巩固尼罗河流域教群纽带。"
 oe_grel_mia_armenian_monastic_patronage:0 "赞助亚美尼亚与奇里乞亚修院抄经"
 oe_grel_mia_armenian_monastic_patronage_desc:0 "厚赐埃奇米阿津、阿尼与西斯修道院抄经院，发扬文化传统、识字率与山地防御意志。"
 oe_grel_isl_invite_ulama_scholar:0 "礼聘四方大乌里玛经师"
 oe_grel_isl_invite_ulama_scholar_desc:0 "从开罗爱资哈尔、巴格达与撒马尔罕延聘正统法学派或苏菲大经师入朝效力，充实帝国经师席位。"
 oe_grel_isl_escort_hajj_caravan:0 "资助麦加朝觐商队护卫"
 oe_grel_isl_escort_hajj_caravan_desc:0 "拨款整备驼队与护卫骑兵护送朝觐商队前往麦加，提升威望、正统性与红海陆路商贸畅通。"
 oe_grel_isl_sufi_mediation:0 "邀请苏菲长老调解教派冲突"
 oe_grel_isl_sufi_mediation_desc:0 "恭请德高望重的苏菲教团长老巡访多教行省，平抑教派摩擦并增进国内安定。"
 oe_grel_steppe_kurultai_faith_debate:0 "召开汗廷百教大辩论"
 oe_grel_steppe_kurultai_faith_debate_desc:0 "循大蒙古汗廷百教论道古礼，延请回回经师、藏传高僧、景教书吏或萨满长老共议国策，灵活借重各教长处而免于急剧改宗震荡。"
 oe_grel_hindu_invoke_royal_avatar:0 "敕祭王权神明化身"
 oe_grel_hindu_invoke_royal_avatar_desc:0 "在大庙宇举行王权神明化身敕祭大典，当尚有可用化身席位时，可择一尊毗湿奴、湿婆或难近母地域王权化身护佑江山。"
 oe_grel_shinto_grand_shrine_offering:0 "神宫奉币祈福大典"
 oe_grel_shinto_grand_shrine_offering_desc:0 "遣敕使向伊势神宫与诸国一宫敬献锦帛神马，同时增益净洁度、武家荣誉与守土神威。"
 oe_grel_thera_sangha_merit_council:0 "举办上座部僧伽结集大典"
 oe_grel_thera_sangha_merit_council_desc:0 "召集康提、蒲甘或素可泰大长老诵读三藏律典，增益善业功德、正统性与四境安泰。"
 oe_grel.1.t:0 "崇福司医药与星历讲学大典"
 oe_grel.1.desc:0 "来自尼西比斯、撒马尔罕与刺桐港的东方教会学者云集御前，带来叙利亚语医典、星盘算法与丝路商路图录。诸位主教静候旨意，决定本届讲学之重心所在。"
 oe_grel.1.a:0 "兴办御前西域医药与历算讲堂"
 oe_grel.1.b:0 "派遣叙利亚语巡回主教打通丝路商站"
 oe_grel.2.t:0 "丝路古教：东方教会请托帝国庇护"
 oe_grel.2.desc:0 "横跨巴格达、撒马尔罕与大都的东方教会（景教）总主教团遣使来朝。彼等世代通晓叙利亚语、波斯语与医算，愿以丝路情报、译经学问与商路人脉回报帝国的宽容与庇护。"
 oe_grel.2.a:0 "颁赐特许庇护状，任用也里可温医官与商使"
 oe_grel.2.b:0 "仅许其照常纳赋，不另赐特权"
 oe_grel.3.t:0 "新迦克墩神学对话会"
 oe_grel.3.desc:0 "东正教与亚美尼亚、科普特、埃塞俄比亚等东方正统教大主教聚首一堂，围绕基督神人二性之千年措辞差异展开诚挚对话。无论选择礼仪互敬还是严守古训，皆将深远塑造黎凡特与高加索基督教世界之格局。"
 oe_grel.3.a:0 "签署礼仪互敬协定，携手共保东方基督教"
 oe_grel.3.b:0 "坚持既有正统教义，但维持友好邦交"
 oe_grel.4.t:0 "尼罗河与红海圣徒朝圣约章"
 oe_grel.4.desc:0 "来自阿克苏姆、拉利贝拉与尼罗河谷的朝圣团穿越红海与沙漠，请求王廷护持通往亚历山大圣马可宝座与耶路撒冷之古道。稳固此道不仅凝聚科普特与埃塞俄比亚教群，更可打通红海香料商脉。"
 oe_grel.4.a:0 "敕建红海—亚历山大朝圣护持驿道"
 oe_grel.4.b:0 "重点整饬高地与尼罗河修院防御"
 oe_grel.5.t:0 "四方大乌里玛经师入朝"
 oe_grel.5.desc:0 "帝国颁布礼贤诏书之后，三位声名远播的伊斯兰大经师应召而至：一位精通哈乃斐派帝国政律，一位深谙沙斐仪派商法与海贸裁断，另一位则是德高望重的纳克什班迪苏菲大长老。"
 oe_grel.5.a:0 "礼聘哈乃斐派帝国大法学家"
 oe_grel.5.b:0 "礼聘沙斐仪派海商与经学院大儒"
 oe_grel.5.c:0 "礼聘纳克什班迪苏菲教团大长老"
 oe_grel.6.t:0 "维滕贝格通书与东方学术使团"
 oe_grel.6.desc:0 "欧洲宗教改革与特伦托大公会议的波澜跨越地中海与丝绸之路：维滕贝格新教神学家致信东方正教圣座探讨古希腊教父经典，而耶稣会博学使团则携最新星历与算学仪器叩响东方宫廷大门。"
 oe_grel.6.a:0 "开展跨教派经典与学术对话"
 oe_grel.6.b:0 "延请耶稣会博学士入宫修历讲学"
 oe_grel.6.c:0 "婉拒外来争辩，恪守本土道统"
 oe_grel.7.t:0 "汗廷百教大辩论"
 oe_grel.7.desc:0 "遵循草原大汗廷百教论道之旧制，回回大经师、藏传佛教大喇嘛、景教书吏与草原萨满长老齐聚金帐御前。大汗须裁定今岁汗廷借重哪一派学统辅佐治理，而无需动摇本族祖制根基。"
 oe_grel.7.a:0 "延请河中回回经师整肃商税与驿律"
 oe_grel.7.b:0 "延请藏传高僧主持护国大法会"
 oe_grel.7.c:0 "重用畏兀儿与也里可温文书司"
 oe_grel.7.d:0 "坚守长生天与苏鲁锭纯正古风"
 oe_grel.8.t:0 "王权神明化身敕祭大典"
 oe_grel.8.desc:0 "大庙宇婆罗门祭司已备妥圣火与青铜神像，恭请国王亲临主祭，择一尊镇护海陆疆土与王室文教的地域神明化身奉入国祀。"
 oe_grel.8.a:0 "奉祭毗湿奴·南洋护航化身（需拥有海港）"
 oe_grel.8.b:0 "奉祭毗湿奴·德干法轮守护者"
 oe_grel.8.c:0 "奉祭湿婆·纳塔拉贾宇宙之舞"
 oe_grel.8.d:0 "奉祭难近母·王权胜战化身"
 oe_grel.8.e:0 "于大庙奉行王权祈福大典"
 oe_grel.9.t:0 "旧神重临：君士坦丁堡的古典祭坛"
 oe_grel.9.desc:0 "令人震骇的急报传遍整个基督教世界：君士坦丁堡的罗马皇帝竟公开重燃古罗马多神祭火，在昔日大公会议之都重祭朱庇特与雅典娜！朝野主教与人文主义学者顿时分为两派，争论究竟应举起护教圣旗，还是展开新柏拉图式理性辩难。"
 oe_grel.9.a:0 "拉响护教警报，集结反异教神圣戒备"
 oe_grel.9.b:0 "遣派博学士展开新柏拉图人文辩难"
 oe_grel.10.t:0 "凯撒重归异教：乌玛世界的法特瓦"
 oe_grel.10.desc:0 "来自安纳托利亚与地中海的商船传来惊天异闻：罗马皇帝已弃绝基督教经典而复辟希腊罗马古神崇拜！开罗、大马士革与撒马尔罕的乌里玛学者激辩不休——是即刻颁布法特瓦号召捍卫天经，还是由苏菲与亚里士多德学派哲人与罗马展开思辨交锋？"
 oe_grel.10.a:0 "颁布严正法特瓦，振奋捍卫天经之志"
 oe_grel.10.b:0 "开启亚里士多德与苏菲哲学的跨文明辩难"
 oe_grel.11.t:0 "罗马万神殿与东方礼制的跨洲共鸣"
 oe_grel.11.desc:0 "远自君士坦丁堡而来的使节与商队带来一则令东方宫廷颇感亲切的奇讯：西方罗马帝国已重兴古老的天地郊祀与诸神祭典，并循古典“罗马诠释”之传统，将东方诸国的神谱、长生天与礼乐秩序视为宇宙大道的不同映照。"
 oe_grel.11.a:0 "礼遇罗马使节，共叙诸神礼乐与丝路通商"
 oe_grel.11.b:0 "淡然观之，谨守本国传统礼制"
