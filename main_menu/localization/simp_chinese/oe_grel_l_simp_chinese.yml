 STATIC_MODIFIER_DESC_oe_grel_hellenic_neoplatonic_dialogue_mod:0 "学者以雅典与亚历山大古典哲学为桥梁，与复兴古罗马展开克制而深邃的思想辩难，助长学术与思潮。"
 oe_grel_hellenic_fatwa_defense_mod:0 "捍卫天经之法特瓦"
