l_simp_chinese: 
#=====================================
#phoenix_nirvana
#=====================================

phoenix_nirvana: "凤凰涅槃"
phoenix_nirvana_desc: "毫无疑问，帝国已经陷入了远比1204年，甚至历史上任何时候更加#bold #R 危险#!#!的境地，[ShowSituationName('rise_of_the_ottomans')]蚕食了我们在小亚细亚的重要兵源地，崛起的[GetCountry('SER').GetName]让我们的巴尔干领土不得安生，帝国境内更是因为连年的中央集权衰弱而一塌糊涂。但我们永远不会忘记我们是伟大的#bold #color_yellow 罗马人#!#!与[GetCountry('BYZ').GetCulture.GetName]#bold #color_yellow 人#!#!的后代，无论前方是怎样的黑暗与煎熬，我们都决心要把[GetCountry('BYZ').GetName]带向一个#bold #G 她从未预见过的未来#!#!"

OE_BYZ_GUI_ROMEI: "#color_yellow 罗马帝国#!"
OE_BYZ_GUI_ROMEII: ""
OE_BYZ_GUI_ROMEIII: "#bold #R 风虎云龙机易失，城狐社鼠罪难逃。:#!#!\n#color_yellow #bold 统治王朝: #!#![GetCountry('BYZ').GetGovernment.GetRuler.GetDynasty.GetName]\n$oe_byz_nobleI_reformmm_var$：$oe_byz_nobleI_refor_counter$/3"


oe_byz_press_claims: "收复帝国失地"
oe_byz_press_claims_desc: "巴尔干和安纳托利亚是帝国的旧土。城墙可以易主，罗马的权利却不会随一场败仗而消散。持有#bold #color_yellow 罗马正统#!#!的君主，可以向邻接的失地提出要求，为收复之战取得名义。\n\n须处于和平且未征召征召兵；不可针对本国、直属附庸或盟友。费用沿用原制：#color_yellow 国库金币（随收入计算）、5稳定度、5政府力量#!，冷却#color_yellow 一年#!。金币由行动国国库支付，不使用内帑；不消耗帝国柱石的权威或民意。具体金额见费用栏。\n\n不能对处于“承认地方统治”十年保护期内的国家使用此行动。\n\n选择匈牙利拥有的邻接省份时，获得#Y 圣斯蒂芬王冠#!宣战理由；匈牙利省份不受巴尔干与安纳托利亚范围限制。"
oe_byz_press_claims_tt: "给予我们一个#bold #color_yellow 巴尔干#!#!或#bold #color_yellow 安纳托利亚#!#!地区的#bold #R 宣称战争借口#!#!"

oe_byz_latin_attack: "废黜伊庇鲁斯亲王"
oe_byz_latin_attack_desc: "14世纪初，伊庇鲁斯由Andronikos.Palaiologos统治，但其权力薄弱，国内存在亲拜占庭派（主张与君士坦丁堡联合）和独立派（倾向与拉丁人或塞尔维亚人结盟）的激烈斗争。拜占庭皇帝安德洛尼卡三世在大臣约翰·坎塔库泽诺斯的辅佐下，试图恢复帝国在希腊地区的权威。此前，拜占庭已通过外交和军事手段逐步控制色萨利、马其顿部分地区，伊庇鲁斯成为下一个目标。"
oe_byz_latin_attack_tt: "皇帝将亲自围攻#R 阿尔塔#!，逼迫伊庇鲁斯人臣服"

oe_byz_reform_nobleI: "[GetCountry('BYZ').GetGovernment.GetRuler.GetDynasty.GetName]改革"
oe_byz_reform_nobleI_desc: "经年累月的内战和政策混乱给我国造成的裂痕依然触目惊心，中央权威在乡村依然被视若无物，随着局势逐渐稳定，我们应当派遣训练有素的官僚下乡填补缺额，打击地方豪强的越权并清查田亩，严课税收。"
oe_byz_reform_nobleI_tt: "我们将开启一个包含3个事件的事件链，至少要完成其中#G 2个事件#!才能获得奖励，全部完成拥有额外的#G 永久奖励#!"

oe_byz_reform_nobleII: "普罗尼亚制度的命运"
oe_byz_reform_nobleII_desc: "在帝国乡村，普罗尼亚制度的失败触目惊心，农民被迫失去自由，依附于拥有土地的普罗尼亚尔，造成了拜占庭帝国的农奴化。不忠诚的地方势力向我们隐瞒人口，财税乃至于兵员，成型的普罗尼亚制度条文也为贵族豪强的土地兼并大开方便之门，导致了严重的土地兼并，随着亚细亚和巴尔干方向的威胁被击退，我们可以选择改革这项制度，或者彻底废除它并重新重用官僚网络"
oe_byz_reform_nobleII_tt: "我们将选择继续加强普罗尼亚制度，或者彻底废除"


oe_byz_reform_peasantI: "重建中央军队"
oe_byz_reform_peasantI_desc: "安德洛尼卡二世解散中央军队和帝国海军的举措真是史上最愚蠢的行为，并导致了帝国在小亚细亚与希腊地区的一系列军事崩溃，让我们怀着对这位愚蠢皇帝的不满，埋头苦干，直到中央军队恢复到与我国荣耀相匹配的程度"
oe_byz_reform_peasantI_tt: "我们可以通过以下行动增加$oe_byz_nobleII_reformmm_var$\n君主指挥的军队赢得#G 战斗胜利#!：增加1点\n拜占庭军队赢得#G 重大战斗胜利#!：增加3点\n君主指挥的军队#R 战斗失败#!：减少1点\n拜占庭军队在#R 重大战斗中失败#!：减少5点\n拜占庭#G 赢得战争胜利#!：增加2点\n拜占庭#R 在战争中失败#!：减少10点\n拜占庭#R 收到外交侮辱#!：减少1点\n拜占庭军队夺取#G 重要地点#!：增加3点\n"

oe_create_theme: "创建帝国军区"
oe_create_theme_desc: "向所选的历史军区颁下军区敕令，由将军统领该辖区。地图上高亮的是可建军区的辖区中心所在省份：须拥有该#Y 历史军区#!的中心地点及至少一半地点；首都辖区不设军区。历史军区以外的巴尔干、安纳托利亚、亚美尼亚高地、瓦拉几亚与黎凡特仍按地区设立。此后，辖区不再向中央提供#Y 征召兵#!，而由军区自行募兵，为帝国守备与征战。\n\n消耗#Y 5点权威#!；不消耗民意或内帑金币。" # FIX 2026-11-17 theme-rework
oe_create_theme_tt: "创建帝国军区"

oe_byz_destroy_thief: "剿灭流寇"
oe_byz_destroy_thief_desc: "乡间遍布的流寇对我们的农村生态造成了严重打击，我们应当向乡间派出正规军进行剿匪"

oe_byz_phoe_invest_army: "投资军备"
oe_byz_phoe_invest_army_desc: "招募、操练与置办军械，都需要长期而稳定的投入。拨出国库经费，让帝国军队在下一场战争到来前做好准备。\n\n按后续方案获得#G 2／3／5#!陆军改革分，并支付相应国库金币。沿用原行动的金币花费及#Y 六个月#!冷却；须处于和平且未征召征召兵。#Y 不使用内帑#!，不消耗权威或民意。"
oe_byz_phoe_invest_army_tt: "我们将根据选择增加$oe_byz_nobleII_reformmm_var$"

oe_byz_crown_over_noble: "皇权独尊"
oe_byz_crown_over_noble_desc: "皇帝是一个凌驾于所有人之上的超脱存在，我们会向所有得意忘形的贵族证明这一点"
oe_byz_crown_over_noble_tt: "我们将逆转地方贵族势力膨胀的现象，重建皇权的统治力\n#R （本事件将结束“凤凰涅槃”局势）#!"

oe_byz_create_bank_org: "创建帝国银行监会"
oe_byz_create_bank_org_desc: "我们注意到了帝国金融行业的一些发展，让我们将它们置于帝国的管理之下"
oe_byz_create_bank_org_over_tt: "我们将创建#G 国际组织#!“帝国银行监会”"

oe_bbyz_phoe_own_greek_country: "和同胞和平统一"
oe_bbyz_phoe_own_greek_country_desc: "我们没必要与流落海外的同胞兵戎相向，和平统一是所有人乐见其成的事情"
oe_bbyz_phoe_own_greek_country_tt: "[target_country.GetName]变成我国的罗马同盟附庸"

oe_byz_fate_Basileus: "皇权至上"
oe_byz_fate_Basileus_desc: "我们已经妥善处理了帝国的土地政策，是时候提醒所有人，巴西琉斯是一个多么至高无上的存在了"
oe_byz_fate_Basileus_tt: "选择该行动将重整帝国政制，确立#Y 皇帝的统治#!，并禁用行动#Y 与军事贵族合作#!和#Y 保护自由农民#!。"

oe_protect_peasants: "保护自由农民"
oe_protect_peasants_desc: "自由农民是我国统治的根基，阴险的军事贵族已经在我国历史上无数次掀起内战与叛乱，我们不能相信他们"

oe_protect_noble: "与军事贵族合作"
oe_protect_noble_desc: "巴西琉斯是全体精英的利益代表，我们应该加强与军事贵族的合作，共创强盛罗马"

won_fate_of_the_phoenix_disaster_variable: "已结束灾难#Y 凤凰涅槃#!"

#=====================================
#john_war
#=====================================

john_war: "权臣与后宫"
john_war_desc: "我国正处在宫廷与社会的一种双重撕裂之中，王宫内，崛起的地方实力派领袖[GetCountry('BBY').GetGovernment.GetRuler.GetName]和以[GetCountry('BAP').GetGovernment.GetRuler.GetName]为首的正统官僚集团隔阂日深；社会上，[GetCountry('BYZ').GetGovernment.GetEstateName('burghers_estate')]阶层和[GetCountry('BYZ').GetGovernment.GetEstateName('clergy_estate')]阶层对于不断膨胀的[GetCountry('BYZ').GetGovernment.GetEstateName('nobles_estate')]阶层愈发不满,冲突不断。自1328年，安德洛尼卡三世通过内战推翻他的祖父以来，#R 内战#!的阴影从未自[GetCountry('BYZ').GetName]#bold #color_yellow 帝国#!#!远去，如果我们不能妥善处理愈发严重的分歧，那么我们就必须认真考虑一场#R 毁灭性的内战#!"

# PAUSED: OE_BYZ_GUI_ROMEIV: "#bold #R 李斯秦相囹圄死，赵高城阙为墟时#!#!\n#bold #color_yellow 权力天平：#!#!$oe_byz_nobleIII_reformmm_var$：$oe_byz_nobleIII_refor_counter$#bold #R  / #!#!$oe_byz_nobleIV_reformmm_var$：$oe_byz_nobleIV_refor_counter$\n#bold #color_yellow 民意支撑：#!#!$oe_byz_nobleV_reformmm_var$：$oe_byz_nobleV_refor_counter$\n当安德洛尼卡去世时，若武勋贵族势力大于官僚势力超过$oe_byz_nobleV_reformmm_var$，则[GetCountry('BBY').GetGovernment.GetRuler.GetName]会成功控制#bold #color_yellow 君士坦丁堡#!#!，并加冕为共治皇帝。若官僚势力大于武勋贵族势力超过$oe_byz_nobleV_reformmm_var$，则[GetCountry('BBY').GetGovernment.GetRuler.GetName]会在胁迫下交出兵权，屈从于中央政府。如果都不满足，则我们会堕入#bold #R 内战！#!#!"


oe_byz_john_war_noble: "恩惠军事贵族"
oe_byz_john_war_noble_desc: "地方军事豪族是我们政权的重要支撑力量，让我们通过给予这些贵族更多的名誉与权利，来换得他们的忠诚"
oe_byz_john_war_noble_tt: "增加1点阶级对立，增加2点武勋势力"

# PAUSED: oe_byz_john_war_gov: "青睐宫廷大臣"
# PAUSED: oe_byz_john_war_gov_desc: "君士坦丁堡的能臣干吏们一直是我们治国理政的重要帮手，让我们加强宫廷大臣的权利，以方便他们更好地开展工作"
# PAUSED: oe_byz_john_war_gov_tt: "增加1点阶级对立，增加2点官僚势力"

oe_byz_john_war_clergy: "打压静修派争论"
oe_byz_john_war_clergy_desc: "我们注意到了静修派的外溢现象，这一原本学术性的神学争论如今已经广泛性地在我们的社会中传播开来，挑动起了大量的社会对立。让我们运用中央权威使喋喋不休的两派注意自己的言辞，并平息社会大众间的争吵"
oe_byz_john_war_clergy_tt: "减少3点阶级对立"

oe_byz_john_war_noble_manpower: "任命贵族征兵"
oe_byz_john_war_noble_manpower_desc: "我们将命令地方贵族加强征兵工作，为中央提供更多可用兵源（会导致贵族势力增加2点，阶级对立增加1点）"

# PAUSED: oe_byz_john_war_gov_tax: "派遣官僚收税"
# PAUSED: oe_byz_john_war_gov_tax_desc: "我们将派遣官僚到地方督导收税工作，减少层层贪墨的现象并迫使地方豪族补缴一些税款（会导致官僚势力增加2点，阶级对立增加1点）"

#=====================================
#empire_debt
#=====================================

empire_debt: "东方贸易"
empire_debt_desc: "沿着海上和陆上丝绸之路，东地中海是所有东方商品通往西欧的最后一站，也是世界上利润最为丰富的贸易之一，来自埃及与叙利亚的东方香料如[ShowGoodsName('cloves')]，[ShowGoodsName('pepper')]，还有[ShowGoodsName('tea')]与[ShowGoodsName('porcelain')]，来自黑海沿岸的[ShowGoodsName('slaves_goods')]与大宗粮食，来自黎凡特的[ShowGoodsName('dyes')]和中国，波斯与拜占庭的[ShowGoodsName('fine_cloth')]是东方贸易的主要内容"

OE_BYZ_GUI_ROMEVV: "#color_yellow #bold 所有货物于每月到港结算#!#!\n#color_yellow #bold 黑海贸易到港量：\n#!#![ShowGoodsName('fur')]：#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_ed_east_trade_goods_quantity_kafa_fur').GetValue|2]#!\n[ShowGoodsName('slaves_goods')]：#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_ed_east_trade_goods_quantity_kafa_slaves').GetValue|2]#!\n#color_yellow #bold 黎凡特海贸易到港量：\n#!#![ShowGoodsName('cloves')]：#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_ed_east_trade_goods_quantity_alex_cloves').GetValue|2]#!\n[ShowGoodsName('pepper')]：#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_ed_east_trade_goods_quantity_alex_pepper').GetValue|2]#!\n[ShowGoodsName('porcelain')]：#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_ed_east_trade_goods_quantity_alex_porcelain').GetValue|2]#!\n[ShowGoodsName('lacquerware')]：#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_ed_east_trade_goods_quantity_alex_lacquerware').GetValue|2]#!"


oe_byz_move_debt: "降低铸币含金量"
oe_byz_move_debt_desc: "我国国库财源枯竭，不得不降低铸币含金量以获得更多收入\n\n消耗#Y 2点权威#!；不消耗民意或内帑金币。"
oe_byz_move_debt_tt: "我们将继续降低货币的含金量，并一次性铸造大量货币。这将为我们带来#G 大量一次性收入#!，并导致我们的#R 通货膨胀加剧#!和#R 商业信用崩塌#!"

oe_byz_rebuild_money: "提高铸币含金量"
oe_byz_rebuild_money_desc: "我国经济情况尚有余力，我们决心投入资金和精力以恢复我们古老神圣的货币信用\n\n消耗#Y 2点权威#!；不消耗民意或内帑金币。"
oe_byz_rebuild_money_tt: "我们将提高货币的含金量，并花费资金回购重铸民众手中的劣币，以便于重建货币信用，这将帮助我们#G 提升商业信用#!"

oe_byz_ed_own_whole_east_trade: "东方贸易霸权"
oe_byz_ed_own_whole_east_trade_desc: "从[ShowLocationName('constantinople')]到[ShowLocationName('alexandria')]，从黑海沿岸的草原到红海沿岸的沙漠，只剩下一个国家的声音。我国已垄断了所有东方贸易的主要通路，没有任何国家可以越过我国的意志继续经营这条东方商路，让我们宣告东方贸易霸权，驯服这条财富之路"
oe_byz_ed_own_whole_east_trade_over: "已触发东方贸易霸权"
oe_byz_ed_own_whole_east_trade_tt: "我国将成为无可置疑的，#G 唯一#!的东方贸易强国并垄断所有东方贸易货物直到局势结束"

oe_byz_ed_sell_salves: "兜售东方商品"
oe_byz_ed_sell_salves_desc: "我们将向选择的市场兜售商品\n#R 进货：#![to.GetName][goods.GetName][goods.GetIcon]\n#G 出口：#![from.GetName][goods.GetName][goods.GetIcon]"
oe_byz_ed_sell_salves_tt: "我们将选择有商品储存的市场，然后向目标市场出口，按照市场差价直接获得收益（不消耗贸易容量）"

oe_byz_rebuild_empire_navy: "重建海军优势"
oe_byz_rebuild_empire_navy_desc: "由于安德洛尼卡二世的愚蠢行径，我们的海上优势荡然无存。几乎从零开始重建帝国海军是一个极其艰巨的过程，但我们做到了。我们现在拥有了对拉丁人的海军优势"
oe_byz_rebuild_empire_navy_over: "已执行局势行动“重建海军优势”"
oe_byz_rebuild_empire_navy_tt: "解锁海军能力：#G 收复爱琴群岛#!"

oe_byz_reown_aegean: "光复爱琴海"
oe_byz_reown_aegean_desc: "古老的爱琴海见过夺取金羊毛的英雄伊阿宋率阿尔戈英雄远航，亦守望过亚历山大从马其顿一路向东，在来来往往的历史中，罗马是她时间最长的统治者，碧海蓝天之间，我们从未离开"
oe_byz_reown_aegean_over: "已执行局势行动“光复爱琴海”"
oe_byz_reown_aegean_tt: "#Y 拉丁人劫掠海岸#!事件将不再发生"

#=====================================
#rome_reconquista
#=====================================

rome_reconquista: "罗马再征服"
# NEW 2026-11-17 Roman Reconquest: replaced by oe_rome_reconquista_l_*.yml: rome_reconquista_desc: "东方的罗马国家始终将光复帝国版图视为自己的最高理想，随着东罗马内外为之一靖，她注定要踏上无数#bold #color_yellow 罗马先帝#!#!都走过的道路。欧洲人不久就将认识到，帝国本身就是比突厥异教徒更危险的存在"

OE_BYZ_GUI_ROMEX: "#bold #R 南风一扫胡尘静，西入长安到日边。#!\n#color_yellow 复兴狂热：#!$oe_byz_rr_rome_hope_counter$\n@trigger_yes!解锁军事远征机制\n@trigger_yes!解锁罗马建筑\n@trigger_yes!解锁军械革新#!"


oe_rr_attach_south_ita: "发起南意大利军事远征"
oe_rr_attach_south_ita_desc: "南意大利依然生活着许多信仰正教的同胞，必须保护他们免受拉丁异端的迫害"
oe_rr_attach_south_ita_tt: "#R #bold 发动攻势！#!#!"

oe_rr_help_mil_attack: "支援军事远征"
oe_rr_help_mil_attack_desc: "我们的远征兵团似乎遇到了麻烦，让我们增派援军帮助他们"
oe_rr_help_mil_attack_tt: "我们将向[target_country.GetName]增派援军"

oe_rr_attach_ebi: "发起伊比利亚军事远征"
oe_rr_attach_ebi_desc: "在布匿战争时期，这里是迦太基的领地，同时也是第二次布匿战争中汉尼拔所率领的远征军的前进基地。迦太基在第二次布匿战争中失败，这块领地被并入罗马共和国，成为罗马行省之一。"

oe_rr_attach_eng: "发起不列颠远征"
oe_rr_attach_eng_desc: "罗马征服不列颠是一个复杂的历史过程，始于凯撒的两次进攻，最终在公元43年由克劳狄乌斯成功征服，标志着罗马对不列颠的统治开始。"

oe_rr_attach_kataiji: "发起北非远征"
oe_rr_attach_kataiji_desc: "据说迦太基被罗马施以诅咒，在周围的田野被撒了盐，要它不能有任何生命生存。"

oe_rr_order_rr_country_peace: "结束军事远征"
oe_rr_order_rr_country_peace_desc: "我们的军事远征赢得基本胜利，是时候结束了"
oe_rr_order_rr_country_peace_tt: "[target_country.GetName]将与所有交战国谈和"

oe_rr_sit_create_theme: "创建帝国军区"
oe_rr_sit_create_theme_desc: "我们将在选择的省份创建帝国军区，当地不再向我们提供征召兵，而是自行募兵为我们而战"

oe_rr_sit_byz_press_claims: "收复帝国失地"
oe_rr_sit_byz_press_claims_desc: "光复罗马帝国的故土是帝国的最高理想"
oe_rr_sit_byz_press_claims_tt: "给予我们一个关于[target.GetName]地点所有者的宣战理由"

oe_rr_reown_rome: "庆祝光复失地"
oe_rr_reown_rome_desc: "帝国奇迹般地收复了失地，我们必须举报盛大的凯旋式与庆祝活动来宣传我们伟大的胜利"
oe_rr_reown_rome_tt: "触发“光复[target_location.GetName]”事件"
oe_rr_reown_rome_text: "选择要庆祝光复的目标"

oe_rr_build_policy_org: "帝国行政体系复兴"
oe_rr_build_policy_org_desc: "在再征服的道路上，一个像过去一样辉煌高效的帝国行政体系必不可少"
oe_rr_build_policy_org_tt: "创建国际组织“帝国行政体系”"

oe_rr_destiny_of_tur: "突厥人的命运"
oe_rr_destiny_of_tur_desc: "自曼齐克尔特战役以后，突厥人便成为了我们最头疼的麻烦，光复小亚细亚一度成为了遥不可及的梦想，但如今，我们再一次收复了小亚细亚的每一寸土地，现在是时候决定这些迁徙而来的突厥民族的命运了"
oe_rr_destiny_of_tur_tt: "我们将尝试同化突厥人，并解锁特殊兵种"

oe_rr_destiny_of_albania: "阿尔巴尼亚人的命运"
oe_rr_destiny_of_albania_desc: "阿尔巴尼亚族是巴尔干半岛的主要民族之一，主要分布在阿尔巴尼亚，科索沃、北马其顿、希腊等地亦有聚居。该族自称“什基普塔尔人”，使用阿尔巴尼亚语，其起源可追溯至古代伊利里亚人"
oe_rr_destiny_of_albania_tt: "我们将尝试同化阿尔巴尼亚人，并解锁特殊兵种"

oe_end: "光复罗马帝国"
oe_end_desc: "我们谱写了人类史上最恢弘壮阔的史诗，重新征服了罗马帝国的每一寸土地"

