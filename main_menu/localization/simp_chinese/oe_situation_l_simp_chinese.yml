oe_rr_start_sci_mil: "军械研发"
oe_rr_start_sci_mil_desc: "我们将专注于试验最先进和最前卫的武器，以保证帝国的军事科技始终领先于她的宿敌。\n分数获取方式：军队中含有#Y 军械革新军团#!，在战斗胜利后根据战斗地点地形，气候，植被获得相应分数\n平地作战：平地&高原\n温和性气候作战：海洋性气候&地中海气候\n崎岖地形作战：丘陵&山地\n森林地形作战：树林&森林\n原野作战：草地&荒原"

oe_rr_start_sci_mil_choose_text: "选择要研发的军械"
oe_rr_start_sci_mil_I_tt: "研发完成"

