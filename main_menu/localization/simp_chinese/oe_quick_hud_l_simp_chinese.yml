l_simp_chinese:
 OE_QHUD_BRAND: "快捷栏"
 OE_QHUD_TOGGLE_TT: "展开或折叠《凤凰计划》快捷导航栏（可拖动位置，亦可在开局规则中默认关闭）。"
 OE_QHUD_PILLARS: "帝国柱石"
 OE_QHUD_PILLARS_TT: "一键打开“帝国柱石”国际组织面板（诏令、改革、军区、附庸、编年史、宫廷）。"
 OE_QHUD_RWORLD: "罗马世界"
 OE_QHUD_RWORLD_TT: "一键打开“罗马世界”国际组织面板（霸业征伐、文化同化、君堡城建、帝国工程）。"
 OE_QHUD_BANK: "帝国银行"
 OE_QHUD_BANK_TT: "一键打开“帝国特许银行”国际组织面板。"
 OE_QHUD_YUAN: "天朝中书"
 OE_QHUD_YUAN_TT: "一键打开“天朝中书”面板与大元朝政总览。"
 OE_QHUD_YOKE: "鞑靼枷锁"
 OE_QHUD_YOKE_TT: "一键打开“鞑靼枷锁”国际组织面板。"
 OE_QHUD_DECISIONS: "决议"
 OE_QHUD_DECISIONS_TT: "一键打开国家决议面板。"
 OE_QHUD_GOV: "政体"
 OE_QHUD_GOV_TT: "一键打开政府与内阁面板。"
 OE_QHUD_DIPLO: "外交"
 OE_QHUD_DIPLO_TT: "一键打开外交面板。"
 OE_QHUD_TURMOILS: "动荡"
 OE_QHUD_TURMOILS_TT: "一键打开国家动荡、灾难与认同运动面板。"
 OE_QHUD_ENTROPY: "熵增"
 OE_QHUD_ENTROPY_TT: "展开或关闭帝国熵增可视化仪表盘悬浮窗（五维月度账簿与4项主动反制敕令）。"
