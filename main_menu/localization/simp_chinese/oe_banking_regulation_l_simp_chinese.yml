l_simp_chinese:
 oe_ir_banking: "规范银行业"
 oe_ir_banking_desc: "将分散的放贷与汇兑业务纳入统一的特许章程，使帝国的商路有可靠的信用相随。\n\n须完成#Y 中央集权#!并接纳#Y 银行业#!思潮。消耗#R 50权威#!，解锁财政令#Y 允许创办更多银行#!。永久获得债券上限#G +2#!、贷款利率#G −1%#!。此改革只能完成一次。"
 oe_ir_banking_done: "已完成规范银行业"
 OE_BANKING_UNLOCK_FOUNDING: "解锁财政令#G 允许创办更多银行#!。"
 oe_pillars_found_chartered_bank: "允许创办更多银行"
 oe_pillars_found_chartered_bank_desc: "选择总行所在地，依照帝国银行监会原有的领土、思潮与技术条件，创办对应的特许银行。所需地点须由东罗马直接拥有。\n\n沿用各银行的总行、分支与#G 3000金币#!初始资金；每种银行仅能创办一次。本行动无额外花费或冷却。\n\n#Y 总行地点与银行#!：塞萨洛尼基—铸币特许银行；热那亚—圣乔治银行；威尼斯—公共银行；安卡拉—安纳托利亚农业银行；狄奥多罗—黑海银行；雅典—报业银行；贝鲁特—黎凡特商业银行；亚历山大—尼罗河银行；罗马—中央银行；突尼斯—迦太基银行；巴勒莫—西西里矿业银行。"
 OE_BANKING_CHOOSE_SEAT: "选择特许银行的总行地点"
 OE_BANKING_NO_SEAT: "@trigger_no!没有尚未创办且满足条件的特许银行。"
 oe_ir_banking_modifier: "规范银行业"
