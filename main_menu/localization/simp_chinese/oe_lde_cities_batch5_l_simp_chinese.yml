# Generated by gen_lde_cities_batch5.py (tools repository). Do not edit by hand: change the generator and run it again.
 mystras_desc: "米斯特拉斯依偎在泰格托斯山陡峭的山脊之上，俯瞰斯巴达古地与欧罗塔斯河谷。这座最初由法兰克阿哈伊亚公国筑起的坚城，在1262年归返拜占庭后跃升为莫雷阿专制国都城。十四至十五世纪间，格弥斯托士·普勒托等学者汇聚于此，使米斯特拉斯成为帝国黄昏中最璀璨的巴列奥略文艺复兴重镇。"
 iznik_desc: "坐落于阿斯卡尼亚湖东岸的伊兹尼克古称尼西亚，曾两度承办影响基督教世界千年的普世大公会议。1204年君士坦丁堡陷落后，拉斯卡里斯王朝以尼西亚为流亡故都，积蓄力量并于1261年光复帝都。1331年奥斯曼人攻克此城后，尼西亚以精湛的釉下彩陶艺与坚固的罗马城墙继续见证安纳托利亚的政权更迭。"
 antioch_desc: "扼守奥龙特斯河谷与叙利亚门户的安条克，自希腊化时代起便是东地中海最繁华的都会之一，亦为早期基督教五大牧首区之一。历经罗马、拜占庭、阿拉伯与十字军安条克公国的反复争夺，古城虽在1268年马穆鲁克破城后元气大伤，却仍凭险峻的西尔皮乌斯山城垣与商路咽喉地位闻名近东。"
 acre_desc: "阿卡坐拥黎凡特海岸难得的深水海湾，自腓尼基与托勒密时代便掌控迦南沿海航运。耶路撒冷失陷后，阿卡成为十字军耶路撒冷王国最后百年的都城，威尼斯、热那亚与圣殿骑士团在此云集争利。1291年马穆鲁克攻陷阿卡终结了十字军在圣地的统治，但其深港遗址仍令东西海商觊觎不已。"
 beirut_desc: "贝鲁特背靠黎巴嫩山雪峰、面向地中海碧波，在罗马帝国时代以闻名遐迩的法学院著称于世，为《查士丁尼法典》贡献良多。中世纪时期，这座海港成为黎凡特生丝、香料与玻璃器皿销往意大利海商共和国的重要口岸。在马穆鲁克与德鲁兹山民势力的交错治理下，贝鲁特始终维系着活跃的滨海商贸网络。"
 famagusta_desc: "1291年阿卡陷落后，大批黎凡特商贾与贵族渡海涌入塞浦路斯东岸的法马古斯塔，使其一夜跃升为东地中海最富庶的转口巨港。吕西尼昂王朝的国王们常在此地的哥特式圣尼古拉大教堂加冕耶路撒冷王冠。凭借宏伟的海防城垣与免税商埠，法马古斯塔成为热那亚、威尼斯与奥斯曼竞逐海权的必争锁钥。"
 corfu_desc: "科孚岛扼守亚得里亚海咽喉，两座临海双峰堡垒犹如铁闸般俯视奥特朗托海峡。中世纪以来，该岛在拜占庭、伊庇鲁斯与安茹那不勒斯之间几经易手，最终于1386年投入威尼斯共和国怀抱。作为威尼斯“海外领地”的首席海军基地，科孚数度击退奥斯曼巨舰围攻，成为阻挡东地中海兵锋西进的海上盾牌。"
 chios_desc: "希俄斯岛紧邻小亚细亚西岸，以全地中海独一无二的乳香树脂与丰茂柑橘园闻名遐迩。1346年热那亚私人舰队夺占此岛，由朱斯蒂尼亚尼商团股份公司实行长达两百余年的特许统治。凭借乳香专卖与附近福西亚的明矾矿贸易，希俄斯在拜占庭衰落与奥斯曼兴起之间左右逢源，成为爱琴海最富饶的商埠之一。"
 split_desc: "斯普利特生长于罗马皇帝戴克里先退位宫殿的宏伟石垣之内，将帝国古迹与中世纪达尔马提亚海港融为一体。这座享有自治特许的亚得里亚海名城长期在匈牙利—克罗地亚王冠与威尼斯共和国之间寻求平衡。城内罗马柱廊改建的圣多米尼乌斯座堂与繁忙的盐木码头，见证了斯拉夫腹地与意大利海洋文明的深度交融。"
 zadar_desc: "扎达尔盘踞在达尔马提亚北岸的一座狭长半岛上，拥有古罗马广场遗迹与坚固的海陆双重城防。作为威尼斯商船往来亚得里亚海的眼中钉，这座富庶商港在1202年遭第四次十字军受威尼斯驱使围攻洗劫，成为改写拜占庭国运的历史转折点。此后数百年间，扎达尔屡次反抗威尼斯统治，终在十五世纪成为共和国在达尔马提亚的首府。"
 skopje_desc: "斯科普里雄踞瓦尔达尔河上游盆地，扼守贯穿巴尔干中部的南北交通大动脉。自塞尔维亚国王米卢廷于1282年攻占此城后，斯科普里跃升为涅马尼亚王朝的政治心脏；1346年复活节，斯特凡·杜尚正是在此加冕为“塞尔维亚人与希腊人的皇帝”。1392年奥斯曼人入据后，此城改称于斯屈普，成为进军巴尔干腹地的重要前进基地。"
 serres_desc: "塞雷斯坐落于肥沃的斯特鲁马河下游平原，背依陡峭的卫城山堡，扼守君士坦丁堡通往塞萨洛尼基的埃格纳提亚大道。十四世纪拜占庭内战期间，斯特凡·杜尚于1345年夺取此城，其后约万·乌格列沙专制公以塞雷斯为首府统治东马其顿。1371年马里查河惨败后，塞雷斯一度重归拜占庭，旋即于1383年落入奥斯曼囊中。"
 plovdiv_desc: "普罗夫迪夫古称腓力波利斯，建于马里查河畔的七座花岗岩山丘之上，坐拥剧场与竞技场等古罗马遗存。作为色雷斯腹地通往君士坦丁堡的皇家大道咽喉，此城在拜占庭与保加利亚第二帝国之间反复易手。十四世纪中叶保加利亚重控此城不久，奥斯曼大军便于1364年将其攻占，更名菲利贝并经营为鲁米利亚重镇。"
 erzurum_desc: "埃尔祖鲁姆高踞亚美尼亚高原西缘，拜占庭时代称狄奥多西波利斯，历来是安纳托利亚通往波斯与高加索的险要关城。塞尔柱与伊儿汗国时期，这里筑起宏伟的双宣礼塔神学院与商队驿站，汇聚黑海特拉比松与大不里士之间的万里商旅。高寒多雪的地形与厚重玄武岩城墙，使其成为奥斯曼与萨法维波斯百年角力的东疆锁钥。"
 tarsus_desc: "塔尔苏斯坐落于奇里乞亚肥沃的冲积平原上，紧扼穿越托罗斯山脉的奇里乞亚门山口，亦是使徒保罗的故乡。中世纪时，此城作为奇里乞亚亚美尼亚王国的重要加冕城市与海陆门户，见证了鲁本与海屯王朝同拜占庭、十字军及蒙古伊儿汗国的纵横捭阖。十四世纪中后期马穆鲁克攻灭亚美尼亚王国后，塔尔苏斯归入拉马赞土库曼侯国治下。"
 urfa_desc: "乌尔法古称埃德萨，坐落于上美索不达米亚与安纳托利亚交界的旱原绿洲，是叙利亚基督教文学与圣像传统的重要发祥地。第一次十字军东征后，此城成为东方首个十字军国家埃德萨伯国都城，直至1144年被赞吉攻陷引发第二次东征。十四世纪以降，乌尔法在马穆鲁克、黑羊与白羊王朝之间更迭，依然是幼发拉底河上游的重要商旅驿站。"
 van_desc: "凡城依偎在咸水凡湖东岸的峭壁巨岩之下，岩巅雄踞着乌拉尔图王国时代便已开凿的千年悬崖堡垒。中世纪此地为瓦斯普拉坎亚美尼亚故地，历经拜占庭吞并、塞尔柱进军与蒙古铁蹄。凭借湖畔绿洲与通往阿塞拜疆的山口，凡城在奥斯曼与萨法维波斯的反复拉锯中始终是东安纳托利亚不可动摇的军事重镇。"
 patras_desc: "帕特雷扼守科林斯湾西口，是伯罗奔尼撒半岛面朝亚得里亚海与意大利的首要良港，并因使徒圣安德烈殉道圣地而备受基督教世界尊崇。第四次十字军后，此城长期由拉丁大主教在法兰克阿哈伊亚公国框架内自治统治，成为威尼斯商船收购葡萄干与丝绸的重镇。1430年君士坦丁·巴列奥略收复帕特雷，一度令整个伯罗奔尼撒重归罗马版图。"
 naxos_desc: "纳克索斯岛是基克拉泽斯群岛中面积最大、物产最丰饶的岛屿，盛产大理石、美酒与金刚砂。1207年威尼斯贵族马可·萨努多占据此岛，建立起统治爱琴海诸岛三个半世纪的群岛公国，并在古卫城筑起坚固的拉丁城堡。萨努多与克里斯波两代公爵家族以纳克索斯为基地周旋于威尼斯与奥斯曼之间，留下独具风貌的拉丁—希腊海岛文化。"
 suceava_desc: "苏恰瓦坐落于喀尔巴阡山东麓的丘陵河谷，1388年由佩特鲁·穆沙特大公定为摩尔达维亚公国首都。在斯特凡大公统治的半个世纪里，苏恰瓦王堡屡次顶住奥斯曼苏丹穆罕默德二世与波兰王师的猛烈围攻，城周修院更以绚丽的壁画与圣徒遗骨凝聚正教信仰。这座连接黑海港口与利沃夫商道的坚都，见证了摩尔达维亚最辉煌的黄金时代。"
 targoviste_desc: "特尔戈维什泰位于喀尔巴阡山南麓与多瑙河平原交界处，自老米尔恰大公时期起便取代坎普隆成为瓦拉几亚公国的王庭所在。大公宫殿的钦迪亚瞭望塔俯瞰着通往特兰西瓦尼亚山口的商道，见证了弗拉德三世在1462年夜袭奥斯曼御营的惊世之战。直至十七世纪末迁都布加勒斯特前，这座古城一直是瓦拉几亚政教与印刷文化的枢纽。"
 iasi_desc: "雅西坐落于巴赫卢伊河谷的七座丘陵间，扼守连接摩尔达维亚腹地、波兰与黑海草原的商旅要津。1564年亚历山德鲁·勒普什内亚努大公将首都自苏恰瓦迁至此地后，雅西迅速成长为巴尔干北方最负盛名的正教文化都会。1642年雅西宗教会议在此召开，城内三圣主教教堂的精雕石墙与希腊—斯拉夫印刷机深刻影响了整个东欧正教世界。"
 varna_desc: "瓦尔纳坐拥黑海西岸优良的深水海湾，自古希腊奥德索斯殖民地时期便活跃于黑海航运网络。中世纪时，它是保加利亚第二帝国通往热那亚与威尼斯商船的主要出海口，输出多瑙河平原的谷物、蜂蜡与皮革。1444年11月，波匈联军在城外与穆拉德二世爆发瓦尔纳决战并惨遭覆没，彻底粉碎了基督教欧洲驰援君士坦丁堡的最后希望。"
 gallipoli_desc: "加里波利扼守达达尼尔海峡最狭窄的咽喉渡口，自古便是连接欧亚两洲的海上锁钥与拜占庭舰队母港。1354年一场强烈地震震塌城墙后，奥斯曼王子苏莱曼率军乘虚渡海占领此城，夺得了奥斯曼人在欧洲大陆的首块永久桥头堡。此后奥斯曼在此营建庞大的帝国海军船厂，依托加里波利掌控海峡并步步鲸吞巴尔干。"
 arta_desc: "阿尔塔环抱于阿腊赫托斯河的马蹄形河湾之中，1204年君士坦丁堡陷落后被米海尔·科穆宁·杜卡斯定为伊庇鲁斯专制国首都。十三世纪的阿尔塔教堂林立、学风炽盛，宏伟的帕雷戈里蒂萨圣母堂融汇了拜占庭穹顶与西方石雕工艺。十四至十五世纪间，这座古城先后历经奥尔西尼、阿尔巴尼亚部族与托科家族统治，最终于1449年并入奥斯曼帝国。"
 kruje_desc: "克鲁亚巍然屹立于阿尔巴尼亚中部陡峭的石灰岩山崖之上，扼守从亚得里亚海平原通往内陆群山的门户。1190年此城曾是首个中世纪阿尔巴尼亚公国的摇篮；1443年，民族英雄乔治·卡斯特里奥蒂——世称斯坎德培——光复父祖故城克鲁亚，高举双头鹰战旗抗击奥斯曼大军。此后二十五年间，这座孤悬绝壁的山城接连挫败穆拉德二世与穆罕默德二世亲征，被欧洲赞为基督教世界的东方之盾。"
 smederevo_desc: "斯梅代雷沃坐落于多瑙河与耶扎瓦河交汇处的三角平地，是1427年塞尔维亚专制公久拉吉·布兰科维奇将贝尔格莱德归还匈牙利后倾国力新建的末代都城。仿照君士坦丁堡城垣建造的二十五座雄伟方塔与护城河，使其成为欧洲规模最大的平地石堡。1459年奥斯曼攻陷斯梅代雷沃，标志着中世纪塞尔维亚国家的最终覆亡。"
 theodoro_desc: "狄奥多罗盘踞在克里米亚西南山区的曼古普孤峰台地之上，四周悬崖绝壁犹如天然巨垒，是黑海北岸哥特人与希腊正教徒共同守望的袖珍公国都城。依托克里米亚山地林泉与卡拉米塔良港，狄奥多罗公国在热那亚卡法城与克里米亚汗国之间纵横周旋，并长期维系与特拉比松及莫斯科的王室联姻。1475年底，奥斯曼大军苦攻半年方破此山城，熄灭了黑海北岸最后一盏罗马正统灯火。"
 vladimir_desc: "弗拉基米尔雄踞克利亚济马河北岸高地，十二世纪中叶在安德烈·博戈柳布斯基与“大窝”弗谢沃洛德治下崛起为东北罗斯的政治与宗教中心。城内白石雕砌的圣母安息座堂、圣德米特里教堂与宏伟金门，奠定了俄罗斯中世纪建筑的典范。即便后来莫斯科取代其实际权柄，历代莫斯科大公仍须亲赴弗拉基米尔圣母安息座堂加冕，以继承全罗斯大公法统。"
 tver_desc: "特维尔扼守伏尔加河上游与特韦尔察河交汇处，坐拥连接诺夫哥罗德与东北罗斯腹地的水路要津。十四世纪初，特维尔大公米哈伊尔率先夺得弗拉基米尔大公诰命，与莫斯科展开长达百余年的生死争霸，并于1327年爆发震惊金帐汗国的抗蒙大起义。城内富商阿法纳西·尼基京更曾于十五世纪远游印度，留下俄国最早的东方行纪，直至1485年特维尔终为伊凡三世兼并。"
 ryazan_desc: "梁赞雄踞奥卡河中游右岸，历来是东北罗斯直面钦察草原游牧铁骑的第一道铁闸。1237年拔都西征首当其冲的旧梁赞惨遭焚毁，幸存者遂迁建新城佩列亚斯拉夫尔—梁赞于险峻河崖之上。十四至十五世纪间，梁赞大公奥列格屡次在莫斯科、立陶宛与金帐汗国之间纵横博弈，直至1521年归入莫斯科版图，继续担任拱卫俄国南疆的边防重镇。"
 smolensk_desc: "斯摩棱斯克扼守第聂伯河上游通往伏尔加与西德维纳河的水陆转运点，自瓦良格—希腊商道时代起便是东欧交通心脏。因其直扼莫斯科西疆咽喉，这座被誉为“俄罗斯钥匙”的古城在莫斯科与立陶宛—波兰之间爆发了长达数世纪的拉锯血战。十六世纪末沙皇鲍里斯·戈东诺夫在此筑起长达六公里的红砖巨墙，令斯摩棱斯克成为东欧最坚不可摧的边疆要塞之一。"
 nizhny_novgorod_desc: "下诺夫哥罗德建于伏尔加河与奥卡河交汇的险峻山岬之上，由弗拉基米尔大公尤里于1221年筑城，是罗斯面向伏尔加保加尔与喀山的东部门户。十六世纪初兴建的石砌克里姆林多次击退喀山铁骑，并为伊凡四世东征喀山提供了关键前哨。大动荡时代，库兹马·米宁与波扎尔斯基公爵正是在此召集义军光复莫斯科，后来兴起的马卡里耶夫大集市更令该城跃居全俄商贸心脏。"
 yaroslavl_desc: "雅罗斯拉夫尔建于伏尔加河与科托罗斯尔河交汇的河角高地，相传由智者雅罗斯拉夫大公建城于十一世纪初。归入莫斯科版图后，凭借连通白海阿尔汉格尔斯克与伏尔加河下游的黄金水道，雅罗斯拉夫尔在十六至十七世纪成长为全俄第二富庶的商贸大城。1612年莫斯科被波军占据期间，雅罗斯拉夫尔曾充当罗斯临时国都，城内遍布绚丽的琉璃砖教堂与富商府邸。"
 suzdal_desc: "苏兹达尔坐落于卡缅卡河蜿蜒环绕的肥沃黑土原野之中，早于莫斯科数百年便已成为罗斯东北部最古老的政教中心。在尤里·多尔戈鲁基治下，苏兹达尔与罗斯托夫共同孕育了强大的弗拉基米尔—苏兹达尔大公国。尽管后来政治中心西移，城内星罗棋布的克里姆林、圣母圣诞座堂与救世主叶夫菲米修道院仍使苏兹达尔成为罗斯正教艺术与隐修传统的瑰宝。"
 veliky_ustyug_desc: "大乌斯秋格矗立于苏霍纳河与尤格河交汇成北德维纳河的起点，是连通伏尔加流域、白海商港与乌拉尔彼岸的北方水陆枢纽。十六世纪英国商船开辟白海航线后，这座皮毛与黑银工艺名城骤然暴富，商帮修建起数十座精美的白石教堂。更为传奇的是，叶罗费·哈巴罗夫与谢苗·迭日涅夫等拓荒先驱皆出自大乌斯秋格，从这里开启了俄罗斯横跨西伯利亚直抵太平洋的壮阔征程。"
 kazan_desc: "喀山雄踞伏尔加河中游与卡马河汇口附近的战略高地，承袭伏尔加保加尔商贸血脉，并于1438年前后成为脱胎于金帐汗国的喀山汗国都城。凭借丰饶的森林皮毛、良田与扼控伏尔加航道的优势，喀山与莫斯科展开了逾百年的激烈抗衡。1552年伊凡四世动用重炮与地道攻陷喀山克里姆林，一举打通俄罗斯沿伏尔加河南下里海并东进乌拉尔的帝国通途。"
 astrakhan_desc: "阿斯特拉罕坐落于伏尔加河浩瀚三角洲的里海入海口，毗邻昔日可萨故都阿提尔，是贯通草原丝路、波斯生丝贸易与北方毛皮的跨洲转口大港。金帐汗国解体后，此地于十五世纪中叶独立为阿斯特拉罕汗国，坐收盐湖、鲟鱼与过境商税之利。1556年俄军攻占此城并筑起白石克里姆林后，印度、亚美尼亚、波斯与布哈拉商馆云集于此，使阿斯特拉罕成为俄国面向东方海洋的门户。"
 sarai_al_jadid_desc: "新萨莱雄踞伏尔加河下游东岸，由金帐大汗月即别于十四世纪上半叶大举营建，很快发展为欧亚草原规模最宏大的国际都会。清真寺、宫殿、陶窑、铸币厂与意大利、罗斯、花剌子模商队客栈鳞次栉比，见证了术赤兀鲁思控御东欧与中亚的鼎盛威权。十四世纪末大动荡与1395年帖木儿铁蹄的洗劫重创了这座草原帝都，然而萨莱之名仍在欧亚史册中久久回响。"
 derbent_desc: "杰尔宾特卡在大高加索山脉与里海波涛之间仅三公里宽的狭长走廊上，波斯语意为“关隘之门”，历来被尊为连接欧亚草原与近东的“铁门”。公元六世纪萨珊波斯修筑的纳林卡拉山堡与直伸入海的双道巨石长墙，千百年来阻挡着一波又一波北方游牧铁骑南下。这座融合波斯、阿拉伯、阿塞拜疆与高加索诸族风貌的古城，始终是里海西岸不可逾越的战略锁钥。"
 baku_desc: "巴库依偎在阿普歇伦半岛南岸的避风港湾内，背靠海风呼啸的石灰岩城垣与神秘的少女塔，是里海西岸条件最卓越的天然良港。自十二世纪沙马基大地震后，希尔万沙王朝将冬宫与朝廷迁至巴库，筑起精美的石雕宫殿群，并凭周遭地表自燃的天然石脑油火井与盐田闻名远近。十五世纪起，巴库成为连接波斯生丝与莫斯科伏尔加商船的重要海运枢纽。"
 tbilisi_desc: "第比利斯建于库拉河峡谷的硫磺温泉之畔，自公元五世纪伊比利亚国王瓦赫坦一世迁都以来，便一直是格鲁吉亚文明的心脏。十二世纪大卫四世收复此城后，第比利斯迎来巴格拉季昂王朝的黄金时代，高悬崖顶的纳里卡拉城堡俯瞰着教堂、清真寺与商队驿站比邻而居的多元街区。虽历经花剌子模、蒙古、帖木儿与波斯屡次兵燹，这座高加索名都始终以顽强生命力屹立于东西商道之巅。"
 yerevan_desc: "埃里温坐落于拉兹丹河谷肥沃的阿拉拉特平原北缘，遥望白雪皑皑的亚拉腊神山，其建城历史可追溯至公元前782年的乌拉尔图埃雷布尼要塞。中世纪晚期，随着阿尼衰落与周边商路重构，埃里温逐渐跃升为东亚美尼亚的行政与集市中心。十六至十八世纪间，这座俯瞰阿拉斯河谷的砖石堡垒成为萨法维波斯与奥斯曼帝国反复争夺的前沿要津，城周葡萄园与果林织就高原绿洲。"
 ani_desc: "阿尼雄踞阿胡良河深邃峡谷环抱的玄武岩三角台地之上，十至十一世纪作为巴格拉提德亚美尼亚王国首都，以“千座教堂之城”的盛誉名震东西。其宏伟的圣母座堂、精巧的尖拱石雕与高耸的双重城墙，汇集了当时高加索最杰出的建筑匠艺与丝路财富。尽管在塞尔柱征服、蒙古劫掠与1319年大地震后逐渐荒凉，阿尼的残垣断壁依然是亚美尼亚中世纪荣光的永恒丰碑。"
 poltava_desc: "波尔塔瓦坐落于第聂伯河左岸沃尔斯克拉河畔的高地，自基辅罗斯时代起便是拱卫森林草原前沿的边防据点。十七世纪此城成为扎波罗热哥萨克左岸酋长国的重要团部驻地，扼守克里米亚通往乌克兰腹地的草原通道。1709年盛夏，彼得大帝在此大败瑞典国王卡尔十二世，波尔塔瓦决战一举终结瑞典北方霸权，宣告俄罗斯帝国作为欧洲头等强权正式登场。"
 halych_desc: "哈利奇坐落于德涅斯特河上游河岸，因周边富饶的岩盐矿藏与盐商通道得名，是加利西亚—沃里尼亚公国乃至加利西亚王国的古老摇篮。十二至十三世纪间，雅罗斯拉夫·奥斯莫梅斯尔与丹尼尔国王在此统御西南罗斯，与匈牙利、波兰及教廷展开频繁外交往来。1241年蒙古洗劫削弱了古城繁华，然而哈利奇都主教区与王冠法统仍长久回荡于红鲁塞尼亚大地。"
 polotsk_desc: "波洛茨克踞于西德维纳河与波洛塔河交汇之处，是白俄罗斯大地最古老的公国都城，早在九世纪便已见诸编年史。十一世纪中叶，公国仿效基辅与诺夫哥罗德建起雄伟的圣索菲亚大教堂，以彰显与基辅分庭抗礼的独立气度。并入立陶宛大公国后，波洛茨克凭借通往里加的波罗的海商路保持高度自治，成为东正教印刷术与西德维纳河贸易的要津。"
 minsk_desc: "明斯克兴起于斯维斯洛奇河畔的林地高丘，最初作为波洛茨克公国南疆的木堡据点，在十一世纪末逐渐成长为鲁塞尼亚诸公争夺的要冲。归属立陶宛大公国后，明斯克于1499年获颁马格德堡城市自治特许状，手工业行会、集市广场与拉丁—东正教堂共同塑造了繁盛的市民社会。地处维尔纽斯通往斯摩棱斯克与基辅大道交汇处的区位，使该城成为白俄罗斯腹地不可或缺的政治商贸中枢。"
 tobolsk_desc: "托博尔斯克建于1587年，巍然矗立于额尔齐斯河与托博尔河交汇处的陡峭白垩悬崖之上，距离西伯利亚汗国旧都卡什利克仅咫尺之遥。作为俄罗斯沙皇国在西伯利亚设立的首座行政、军事与东正教都主教首府，这里筑起了全西伯利亚唯一一座宏伟的石砌克里姆林。在逾两个世纪里，托博尔斯克统辖着从乌拉尔延伸至太平洋的广袤疆土，并控制着价值连城的紫貂皮毛贡赋与中俄商道。"
 qashliq_desc: "卡什利克又名伊斯凯尔，雄踞额尔齐斯河右岸险峻河崖，十五世纪末起取代成吉—图拉成为西伯利亚汗国首都。在昔班系汗王库楚姆统治下，这座由木栅与土壕护卫的林原都会统领鄂毕河与额尔齐斯河流域的皮毛贡赋，并积极引入布哈拉伊斯兰学者与商队。1582年哥萨克首领叶尔马克在丘瓦什角击溃汗军并攻占卡什利克，由此揭开了俄罗斯跨越乌拉尔征服整个北亚的序幕。"
 mangazeya_desc: "曼加泽亚奇迹般崛起于北极圈内塔兹河畔的永冻苔原之上，由无畏的波莫尔海员于1601年循喀拉海冰海航道建立。在短短数十年的鼎盛期里，这座被称为“金光闪闪的曼加泽亚”的极北木堡汇聚了数以万计的珍稀紫貂皮与海象牙，其富庶名声甚至远播西欧宫廷。由于沙皇廷忧虑外国海船借道北极侵入西伯利亚，1619年朝廷严令封闭海路，这座冰雪奇迹城终在世纪中叶归于寂静。"
 tomsk_desc: "托木斯克于1604年应鄂毕河畔尤什塔鞑靼首领托扬求援而建，雄踞托木河东岸陡坡，俯瞰广袤的西西伯利亚针叶林与草原过渡带。作为扼制准噶尔瓦剌与叶尼塞吉尔吉斯游牧骑兵北上的铁壁木堡，托木斯克屡次顶住草原围攻，保护了俄国西伯利亚交通干线。随着西伯利亚驿道贯通，这里凭借商栈、铁匠铺与学堂发展为鄂毕流域的商贸文化重镇。"
 irkutsk_desc: "伊尔库茨克始建于1661年安加拉河畔，紧邻浩瀚深邃的贝加尔湖，迅速跃升为东西伯利亚无可争议的政商心脏。来自布里亚特草原的牧民、俄国皮毛商人与穿越戈壁的华商在此交汇，使这座木雕窗花斑斓的边城成为中俄恰克图万里茶道与俄美太平洋商社的后勤总站。十八世纪以降，伊尔库茨克凭借雄厚商资与东正教教区学校，赢得“西伯利亚巴黎”的美誉。"
 yeniseysk_desc: "叶尼塞斯克建于1619年宽阔的叶尼塞河中游西岸，扼守从鄂毕流域翻越马科夫斯基陆运道进入东西伯利亚的唯一咽喉，被誉为“西伯利亚诸城之父”。正是从这座原木要塞出发，彼得·别克托夫等哥萨克拓荒队东渡勒拿河建立雅库茨克、远抵阿穆尔河与太平洋岸。凭借丰厚的紫貂集市、造船木场与铁器铸造，叶尼塞斯克在十七世纪成为全俄东进探险的总司令部。"
 kyakhta_desc: "恰克图坐落于贝加尔湖以南的色楞格河支流谷地，与南侧大清买卖城隔界相望。1727年中俄签订《恰克图条约》后，这里被钦定为两国陆路互市的唯一法定口岸，开启了延续百余年的“万里茶道”传奇。驼队将福建武夷红茶、湖丝与棉布北运至此，换取西伯利亚紫貂、海獭皮与欧洲呢绒，令这座偏居漠北草原的边境双城一度富甲北亚。"
 tula_russia_desc: "图拉坐落于莫斯科正南乌帕河畔，扼守通往克里米亚草原的穆拉夫斯基大道，十六世纪初筑起的红砖克里姆林曾屡次挫败鞑靼铁骑北犯。依托周边丰饶的褐铁矿与密林木炭，图拉铁匠世代精于锻造甲胄火器；1712年彼得大帝在此设立俄罗斯首座皇家兵工厂后，图拉彻底奠定了“俄罗斯枪炮之都”的崇高地位。除了军工绝艺，当地独具匠心的茶炊与姜饼亦享誉全俄。"
 lviv_desc: "利沃夫由加利西亚国王丹尼尔于十三世纪中叶为其子列夫所建，坐落于波罗的海与黑海分水岭的群丘之间。并入波兰王国后，这座享受仓储特权的自由大城成为连接克拉科夫、摩尔达维亚与克里米亚丝路商队的中东欧转口总汇。波兰天主教徒、鲁塞尼亚正教徒、亚美尼亚巨商、犹太学者与德意志工匠在此共居并立，缔造了文艺复兴时期最璀璨的多元石城风貌。"
 trakai_desc: "特拉凯依偎在维尔纽斯以西碧波环绕的湖群之间，是立陶宛大公格迪米纳斯之子科斯图提斯与维陶塔斯大公长期驻跸的王室行宫。矗立于加尔韦湖心孤岛上的红砖水堡既能抵御条顿骑士团铁骑突袭，又见证了1410年格伦瓦尔德大捷前后的大公国鼎盛外交。维陶塔斯大公还曾自克里米亚迁来突厥语卡拉伊姆人与鞑靼骑兵拱卫城池，赋予特拉凯别具一格的跨欧亚人文印记。"
 basra_desc: "巴士拉始建于公元636年阿拉伯河畔，最初作为阿拉伯军营崛起，很快跃升为波斯湾北端最繁华的海运巨港。阿拔斯王朝时期，这里既是阿拉伯语语法学、哲学与《一千零一夜》水手辛巴达传说的摇篮，又是满载印度香料、中国瓷器与东非木材帆船的终点。历经蒙古、贾拉伊尔与奥斯曼—波斯争锋，纵横交错的运河与无垠枣林仍使巴士拉屹立为两河通向印度洋的咽喉。"
 karbala_desc: "卡尔巴拉坐落于幼发拉底河以西的荒漠绿洲边缘，因公元680年先知外孙侯赛因在此殉难而成为什叶派伊斯兰世界最庄严的圣城之一。历代布韦希、伊儿汗、贾拉伊尔与萨法维君主竞相修缮侯赛因与阿巴斯的镀金穹顶圣陵，开凿运河引幼发拉底河水滋润圣城。来自波斯、伊拉克、黎凡特与印度的亿万朝圣者络绎不绝，使卡尔巴拉同时成为伊斯兰法学研讨与跨区商贸的重要中心。"
 ardabil_desc: "阿尔达比勒坐落于萨巴兰雪山东麓的高原盆地，扼守里海西南岸通往大不里士的丝绸商道，自古便是阿塞拜疆的富庶重镇。十三世纪末，苏菲圣哲谢赫·萨菲丁在此创立萨法维教团，使这座山城化作万众朝拜的宗教圣地与政治策源地。1501年其后裔伊斯梅尔率红头奇兹尔巴什武士从阿尔达比勒出发统一波斯，城内的谢赫·萨菲丁陵园更以举世闻名的丝织地毯与中国青花瓷藏室流芳千古。"
 maragheh_desc: "马拉盖依偎在萨汉德火山南坡的肥沃果园谷地之中，紧邻乌尔米耶湖东岸，曾被旭烈兀选为伊儿汗国初年的首都。1259年，波斯天文学巨匠纳西尔丁·图西奉旭烈兀之命在城外山丘兴建马拉盖天文台，汇聚来自中亚、叙利亚乃至中国的星历学家共同编纂《伊儿汗天文表》。尽管汗国都城后来北迁大不里士，马拉盖的红蓝釉砖陵塔与科学遗泽仍辉映整个伊斯兰世界。"
 qazvin_desc: "加兹温坐落于厄尔布尔士山脉南麓的商旅十字路口，连通大不里士、里海吉兰丝区与伊斯法罕腹地，自萨珊时代建城起便是波斯北方的战略要津。1555年萨法维沙阿塔赫马斯普一世为避开奥斯曼锋芒将首都自大不里士迁至加兹温，大兴四十柱宫、皇家书画院与宏伟集市。在近半个世纪的国都岁月里，加兹温孕育了璀璨的波斯细密画与书法艺术，至今仍是伊朗高原的文化重镇。"
 shiraz_desc: "设拉子坐落于扎格罗斯山脉南段法尔斯高原的翠绿盆地，毗邻波斯波利斯古迹，因躲过成吉思汗与旭烈兀铁蹄的直接屠戮而在十三至十四世纪跃升为波斯文明的避风港。在因朱与穆扎法尔王朝资助下，这座“玫瑰、夜莺与美酒之城”孕育了萨迪与哈菲兹两位不朽诗圣，更以精美的设拉子细密画抄本和镶嵌木艺蜚声欧亚。作为连接波斯湾港口与伊朗腹地的枢纽，设拉子至今仍是波斯雅韵的化身。"
 mashhad_desc: "马什哈德坐落于呼罗珊东北部的卡沙夫河谷，最初只是古城图斯近郊的萨纳巴德村，因公元818年什叶派第八伊玛目阿里·礼萨在此遇害安葬而得名“殉道之地”。蒙古铁蹄摧毁旧图斯后，幸存居民陆续聚居圣陵四周，在帖木儿王朝高哈儿沙德王后与萨法维诸王的宏伟营造下，马什哈德跃升为波斯东北最显赫的圣城与商贸都会。其巍峨的蓝釉穹顶与神学院历来是守护呼罗珊抵御乌兹别克铁骑的信仰灯塔。"
 nishapur_desc: "内沙布尔坐落于比纳卢德雪山南麓，昔日与木鹿、赫拉特、巴尔赫并称“呼罗珊四明珠”，不仅盛产享誉欧亚的绝品绿松石，亦是天文学家兼诗人欧玛尔·海亚姆与神秘诗人阿塔尔的故乡。尽管1221年蒙古大军的报复性屠城与屡次大地震彻底摧毁了旧城辉煌，勤劳的呼罗珊人仍在坎儿井滋润的绿洲边顽强重建。在伊儿汗与萨尔巴达尔政权时代，内沙布尔依然是呼罗珊西翼重要的工艺与商路节点。"
 yazd_desc: "亚兹德孤悬于卢特荒漠与卡维尔盐漠之间的干旱盆地，凭人类巧夺天工的地下坎儿井与高耸泥砖捕风塔在酷暑中筑起清凉绿洲。马可·波罗曾由衷赞叹亚兹德的金丝锦缎与繁忙商队，而偏居大漠的地理屏障使其在十三至十四世纪免遭战火毁灭，成长为穆扎法尔王朝与帖木儿时代的学艺乐土。这座土坯穹顶连绵的古城，至今仍是伊朗琐罗亚斯德教延续千年圣火的最后堡垒。"
 kerman_desc: "克尔曼矗立于伊朗东南高原的荒漠绿洲之中，扼守波斯腹地南下霍尔木兹海峡与东通锡斯坦、印度的商道总汇。十三至十四世纪，库特鲁格汗王朝与穆扎法尔诸王在此大兴清真寺、神学院与商队驿站，令当地铜器锻造、精细披肩与华美波斯地毯行销印度洋两岸。在阿拔斯大帝重臣甘贾利汗重修广场与大巴扎后，克尔曼作为波斯东南门户的商业活力愈发炽盛。"
 balkh_desc: "巴尔赫坐落于兴都库什山北麓与阿姆河之间的广袤绿洲，自古巴克特里亚时代便以“诸城之母”的美誉冠绝中亚。这座丝路古都曾先后是琐罗亚斯德教圣地、佛教纳瓦毗诃罗大寺所在，以及阿拔斯、萨曼与伽色尼时代伊斯兰学术的耀眼明珠。虽经成吉思汗与帖木儿战火摧残，巴尔赫在乌兹别克昔班尼与阿斯特拉罕王朝时期再度崛起为统御阿姆河以南的副汗大都。"
 ghazni_desc: "加兹尼雄踞海拔两千二百余米的阿富汗东部高地，扼守从呼罗珊与喀布尔南下坎大哈及印度河平原的兵家要道。十至十二世纪，马哈茂德苏丹以加兹尼为都建立横跨伊朗东部与北印度的伽色尼帝国，城内汇聚比鲁尼与菲尔多西等一代宗师，留下巍峨的星形砖砌宣礼塔。纵使古尔王朝烈火与蒙古铁骑抹去了昔日宫阙，加兹尼高堡依然是历代中亚霸主窥伺印度斯坦的必经阶梯。"
 kabul_desc: "喀布尔盘踞在兴都库什群峰环抱的高原谷地，紧扼通往印度次大陆的开伯尔山口西钥，自贵霜王朝起便是连接中亚与印度的商旅总闸。城内瓜果飘香、雪水长流，在帖木儿王朝末叶依然凭借山势险固吸引着逃难王族。1504年，失去河中故土的帖木儿后裔巴布尔占据喀布尔并以此为龙兴基地经营二十载，最终挥师南下帕尼帕特开创莫卧儿帝国，死后亦嘱咐魂归此城巴布尔花园。"
 merv_desc: "木鹿坐落于卡拉库姆大沙漠南缘的穆尔加布河三角洲绿洲，曾是丝绸之路中亚段最宏伟的国际都会。塞尔柱苏丹桑贾尔治下，木鹿凭借十余座藏书浩瀚的公共书库与精密水利系统号称当时世界第一大城，引来欧亚各地的学者与商队。1221年拖雷领蒙古大军屠城溃坝几乎将古城夷为平地，然而依靠肥沃绿洲，帖木儿之子沙哈鲁在十五世纪重修水坝并新建城垣，令木鹿在呼罗珊东疆重燃生机。"
 urgench_desc: "玉龙杰赤雄踞阿姆河下游花剌子模大绿洲，曾是花剌子模沙阿帝国富甲中亚的首都，也是金帐汗国时期钦察草原通往呼罗珊和中国的首席商贸明珠。十四世纪旅行家伊本·白图泰盛赞此城街市如沸、学者云集，并留下了拔都后裔统治下高耸入云的忽都鲁·帖木儿宣礼塔。尽管1388年帖木儿五征花剌子模将玉龙杰赤夷为平地、加之阿姆河改道，古城余晖仍深植于中亚记忆之中。"
 khiva_desc: "希瓦坐落于克孜勒库姆与卡拉库姆两片大漠夹峙的花剌子模南缘绿洲，因甘甜的赫伊瓦克古井与丝路商队驿站而兴。十六世纪末阿姆河改道令旧都玉龙杰赤日渐枯竭后，乌兹别克昔班尼后裔将希瓦定为希瓦汗国首都，在土坯巨墙护卫的伊钦·卡拉内城中营造出满目蓝釉瓷砖的宫殿、神学院与宣礼塔。这座犹如大漠明珠般的围城，长久守护着花剌子模独树一帜的绿洲文明。"
 khujand_desc: "苦盏扼守锡尔河流出费尔干纳盆地的咽喉峡口，相传正是亚历山大大帝在公元前329年修筑的“极东亚历山大城”。作为河中地区东接天山丝路、西通撒马尔罕的必经渡口，这座古城以坚固的河滨城堡、甘美石榴园与丝织工坊闻名遐迩。1220年花剌子模名将帖木儿灭里率千余勇士在苦盏河心孤岛力抗蒙古大军的壮举，更令此城在中亚史诗中永垂不朽。"
 kokand_desc: "浩罕坐落于肥沃的费尔干纳盆地西缘，扼守翻越帕米尔与天山山口通往喀什噶尔及塔里木绿洲的商道总汇。早在十世纪此地已有商镇记载，历经蒙古西征摧残后，十八世纪初明格部乌兹别克首领在此筑城立都，开创横跨锡尔河流域的浩罕汗国。凭借繁荣的丝棉集市、铁器作坊与穿梭葱岭的安集延商帮，浩罕迅速跃升为中亚东部举足轻重的政商强权。"
 otrar_desc: "讹答剌矗立在锡尔河中游与阿里斯河交汇处的草原前沿绿洲，既是十世纪大哲学家法拉比的故乡，也是河中农耕文明与钦察游牧世界交锋的边疆巨镇。1218年讹答剌守将海儿汗劫杀蒙古商队并斩杀使者，直接点燃了成吉思汗挥师西征、重塑欧亚格局的滔天战火。战后重建的讹答剌在帖木儿帝国时期仍是北疆重镇，1405年冬，正欲率军东征大明的帖木儿大帝便在城中病逝。"
 turkestan_desc: "突厥斯坦古称亚西，位于锡尔河以北草原与绿洲交界处，因十二世纪突厥苏菲大圣艾哈迈德·亚萨维在此传教归真而成为整个突厥世界朝觐的精神圣城。十四世纪末，帖木儿大帝亲命波斯名匠在城中兴建宏伟的碧蓝穹顶亚萨维陵墓，其巍峨拱门堪称中亚砖瓦建筑绝唱。十六至十八世纪，突厥斯坦更成为哈萨克汗国可汗驻跸与贵族安葬的政治圣都，连结起万里草原与河中商道。"
 yarkand_desc: "叶尔羌坐落于昆仑山北麓与塔克拉玛干沙漠西南缘的叶尔羌河大绿洲，扼守南道商队翻越喀喇昆仑山口通往克什米尔与河中的战略咽喉。自古莎车王国以来，此城便以良玉集散、桑蚕丝绸与繁茂果园享誉西域。1514年察合台后裔赛德汗以此为都建立叶尔羌汗国，统合天山南北绿洲近两百年，城内宫廷雅集更将十二木卡姆古典乐舞推向巅峰。"
 khotan_desc: "于阗依傍玉龙喀什河与喀拉喀什河润泽的南疆绿洲，两千余年来以温润无瑕的和田羊脂白玉独步天下，亦是古代中原蚕桑丝织技艺经西域传往西方的传奇中转站。汉唐时期于阗曾是大乘佛教兴盛的千年古国，玄奘西行归国时曾在此停留讲经。十一世纪归入喀喇汗国伊斯兰文化圈后，于阗仍凭采玉业、精织地毯与丝路南道商旅维系着不绝的繁荣。"
 kucha_desc: "龟兹坐落于天山南麓丝路北道腹心，凭丰富的铜铁矿藏与绿洲农耕自汉代起便是西域三十六国中最强盛的邦国之一。唐代朝廷曾将安西大都护府治所迁设于此，使龟兹成为中原经略西域的军政总枢；附近克孜尔千佛洞的绚丽壁画、鸠摩罗什的佛典译业与靡靡动听的龟兹琵琶乐，更深刻塑造了隋唐乃至整个东亚的宗教与音乐风貌。"
 turpan_desc: "吐鲁番深陷于天山东段火焰山下的低洼盆地，依靠从博格达雪峰引流千里的地下坎儿井，在酷烈火洲中孕育出甘甜的葡萄、哈密瓜与棉田。九至十三世纪高昌回鹘王国以邻近的高昌与交河故城为都，兼收佛教、摩尼教与景教文化，成为丝路北道最灿烂的绿洲文明。十四世纪高昌王室东迁后，吐鲁番逐渐取代故城成为东察合台汗国重镇，扼守西域东出河西走廊的北翼通道。"
 hami_desc: "哈密雄踞河西走廊西端尽头与天山东段交接的孤立大绿洲，素有“西域咽喉”之称，往来中原与天山南北的商旅与使团无不在此补水休整。大元时期，察合台后王出伯一系之威武西宁王镇守于此，沟通河西与西域驿路；明代永乐年间则设哈密卫并封忠顺王，使之成为明廷羁縻西域诸国的第一前哨。十五至十六世纪间，明朝与吐鲁番汗国围绕哈密展开数十年的反复争夺，足见其战略分量。"
 beshbalik_desc: "别失八里突厥语意为“五城”，坐落于天山北麓准噶尔盆地南缘，前身为盛唐镇守天山以北的北庭大都护府治所。九世纪起这里成为高昌回鹘汗国的避暑夏都，十三世纪初率先归附成吉思汗，后成为大元与窝阔台、察合台诸王在西北反复争夺的兵家重地。十四世纪中叶东察合台汗国更常以此城之名见诸汉文史籍，彰显其号令天山北道草原的余威。"
 karakorum_desc: "哈拉和林建于漠北杭爱山东麓鄂尔浑河谷，1235年窝阔台大汗兴筑城垣与万安宫，使其成为横跨欧亚的大蒙古帝国心脏。来自罗马教廷、法兰西、罗斯、波斯与中原的使臣与工匠齐聚于此，银树喷泉、佛寺、清真寺与景教教堂在草原风雪中交相辉映。忽必烈迁都大都后，这里改设为岭北行省治所和宁路，1368年元廷北撤后再度成为北元捍卫黄金家族祖地的象征。"
 shangdu_desc: "上都原名开平，坐落于滦河上游水草丰美的金莲川草原，由忽必烈于1256年命汉臣刘秉忠依中华礼制与草原游牧传统合璧兴建。1260年忽必烈在此即大汗位，定都大都后仍实行两都巡幸制，每逢盛夏率百官宗王北巡上都避暑理政、召开忽里台。马可·波罗笔下大理石宫殿与竹构御殿的梦幻盛景令西方流传“世外上都”之名，直至1358年红巾军火焚宫阙方渐趋衰落。"
 fuliang_desc: "浮梁坐落于赣东北昌江河谷群山之间，因盛产高岭瓷土与优质松柴，其辖下景德镇自北宋景德年间便以“瓷都”盛名冠绝天下。元代朝廷在此专设浮梁瓷局，成功烧造出釉色湛蓝、纹饰华丽的元青花与卵白釉枢府瓷，经由泉州与大运河远销波斯、奥斯曼与欧洲宫廷。明清时期御窑厂窑火昼夜不息，使浮梁成为全球前近代手工业分工与跨洋贸易的巅峰象征。"
 jiangdu_desc: "江都古称扬州，雄踞长江与京杭大运河交汇之十字咽喉，自隋唐起便以“扬一益二”的繁华闻名海内。元明时期，两淮盐运使司坐镇于此，掌控全国最丰厚的官盐专卖税收，大批徽州与山西盐商汇集城中，筑起瘦西湖畔精雅园林与繁华戏楼。南来漕粮与北上商货川流不息，使江都长久居于东南财赋与风雅文化的中心。"
 kaifeng_desc: "开封古称汴梁，雄峙黄河中下游冲积平原，曾作为北宋国都东京缔造《清明上河图》中百万人口的夜市奇观与活字印刷繁华。金元两代先后以此为南京与河南江北行省治所，依然是连接大都与江南漕运驿道的中原枢纽。明代朱元璋分封周王于此，尽管屡遭黄河泛滥与1642年水淹劫难，开封古城层层叠压的城垣仍铭刻着中原千载兴衰。"
 luoyang_desc: "洛阳坐落于伊水、洛水润泽的河洛盆地，背依邙山、面朝龙门，素有“十三朝古都”之誉，是中华礼乐制度、丝绸之路东端与佛教初传白马寺的圣地。城南龙门石窟绵延千年的佛像雕刻，见证了北魏与盛唐的气象万千。虽自宋代以后政治重心东移，元明时期作为河南府治所的洛阳，依然以国色天香的牡丹、儒学书院与厚重王气令天下士人神往。"
 jingzhao_desc: "京兆古称长安，雄踞沃野千里的关中盆地中心，曾作为周、秦、汉、隋、唐等大一统盛世的帝都，开启贯通欧亚的陆上丝绸之路。元代此城称奉元路，为陕西行省治所，镇抚关陇、控扼西域与巴蜀；1369年明军入关后改名西安，并依托隋唐皇城基址修筑雄伟的明代砖石城墙与钟鼓楼。作为大西北政教与军防锁钥，这座千年古城至今散发着雄浑厚重的帝王气韵。"
 chengdu_desc: "成都坐落于都江堰千年水利滋润的川西平原腹心，因蜀锦织造甲天下而得名“锦官城”，素享“天府之国”美誉。历经十三世纪宋元半世纪血战，成都于1286年升为四川行省治所，依托茶马贸易、井盐与蜀锦逐步复苏。元末明玉珍据蜀称大夏，明清则以成都为西南总枢，使这座闲适而富庶的盆地名都再度焕发勃勃生机。"
 jiangxia_desc: "江夏雄踞长江与汉水交汇处的蛇山黄鹤楼下，历代为武昌府治所，与隔江相望的汉阳、汉口共筑“九省通衢”之战略格局。元代朝廷在此设立管辖两湖、两广与贵州的湖广行省，使江夏成为镇抚华中与西南溪洞的军政中枢。元末陈友谅曾据武昌称大汉皇帝，明代楚王开府于此，滚滚长江舟楫如织，赋予此城吞吐八方的枢纽气派。"
 nanchang_desc: "南昌坐落于赣江下游与浩瀚鄱阳湖之滨，素以滕王阁序千古绝唱闻名天下，元代称龙兴路并设江西行省治所，统辖赣粤两地。作为连接长江水系与翻越大庾岭通往广州的南北大动脉中转站，南昌商贾云集、书院林立。1363年朱元璋侄儿朱文正率守军在洪都城下死守八十五日挫败陈友谅六十万大军，为随后鄱阳湖决战与大明肇基写下决定性序章。"
 minxian_desc: "闽县即福州古城核心，坐落于闽江下游群山环抱的盆地之中，因遍植常绿榕树而雅称“榕城”。唐五代闽国奠定了三山鼎峙的城池格局，至明代福建布政使司与市舶司先后驻设于此，使福州跃升为东南海防重镇与中琉朝贡册封舰队的唯一法定启航港。城外船坞精于建造大型福船，郑和七下西洋的宝船编队亦曾数度在闽江口长乐太平港整装候风。"
 xiangyang_desc: "襄阳雄踞汉水中游南岸、与北岸樊城隔江互为犄角，北通南阳盆地、南控江汉平原，历来有“铁打的襄阳”与“华夏第一城池”之誉。十三世纪六十至七十年代，南宋军民在襄阳与樊城浴血固守整整六年，直至元军调来西域回回炮方才破城，一举打开灭宋通途。深阔护城河与巍峨砖垣，使襄阳始终是决定中国南北统一与分裂的兵家必争锁钥。"
 kunming_desc: "昆明坐落于碧波浩渺的滇池北岸，四季如春、群峰拱卫，元代称中庆路，由色目名臣赛典赤·赡思丁在此创立云南行省治所并兴修水利、广建孔庙与清真寺。元末梁王把匝剌瓦尔密镇守昆明直至1382年明军入滇，此后沐英家族世镇云南二百余年，将大批中原卫所军民迁入滇池盆地。作为茶马古道与通往缅甸、澜沧商路的中枢，昆明融汇汉、回与西南诸族风采。"
 shigatse_desc: "日喀则坐落于雅鲁藏布江与年楚河交汇处的丰饶河谷，是西藏后藏地区政教与农牧商贸的核心都会。十四世纪中叶帕木竹巴政权在此兴筑险峻的桑珠孜宗堡，俯瞰通往尼泊尔、拉萨与阿里高原的商旅驿道；1447年一世达赖喇嘛创建宏伟的扎什伦布寺，后来更成为历代班禅额尔德尼的驻锡祖庭。金色佛殿与白墙宗堡相映生辉，使日喀则长久屹立为雪域西翼的庄严明珠。"
 sakya_desc: "萨迦深藏于后藏仲曲河谷的苍茫群山之间，因灰白岩土得名，1073年昆氏家族在此创立藏传佛教萨迦派祖庭。十三世纪，萨迦班智达与侄儿八思巴同蒙古皇室缔结檀越关系，八思巴更受忽必烈尊为大元帝师并掌宣政院，使萨迦成为统领吐蕃十三万户的雪域政教中心。城内红白黑三色巨墙的萨迦南寺珍藏数万卷古写本佛经，见证了汉藏蒙跨文明交融的辉煌时代。"
 shazhou_desc: "沙州即闻名世界的敦煌，雄踞河西走廊最西端党河润泽的戈壁绿洲，扼守玉门关与阳关外丝绸之路南北两道的分岔总口。城东南鸣沙山断崖上绵延千年的莫高窟佛像、壁画与藏经洞典籍，荟萃了汉、藏、粟特、吐蕃与回鹘多元文明精华。元代察合台后王西宁王曾于此勒石刻六体真言碑，明初则设沙州卫以控御大漠咽喉，使这座大漠明珠历劫犹耀。"
 qufu_desc: "曲阜坐落于泰山南麓泗水河畔，原为西周鲁国故都，因先师孔子诞生、讲学与归葬于此而被尊为整个东亚儒家文明的最高圣城。历代帝王皆优渥敕封孔子嫡裔衍圣公，不断扩建规模堪比皇宫的孔庙、孔府与苍柏森森的孔林。无论王朝兴替、南北分合，来自中华、朝鲜、日本与越南的士子皆以瞻仰曲阜杏坛为平生夙愿，使其成为超越政权更迭的礼教精神坐标。"
 hetu_ala_desc: "赫图阿拉坐落于辽东群山环抱的苏子河谷台地，满语意为“横岗”，是建州女真勃兴的龙兴之地。1603年努尔哈赤在此修筑内外两重木石城垣、统合女真各部并创制八旗军政体制，于1616年在此登基建立后金政权、定元天命。尽管九年后朝廷西迁沈阳，这座隐于林海雪原间的山岗旧都仍被清室尊为“兴京”，铭刻着满洲崛起并改写东亚版图的起点。"
 nurgan_desc: "奴儿干位于黑龙江下游入海口附近的特林绝壁之上，扼守阿穆尔河与鞑靼海峡通往库页岛的水陆交汇点，世居尼夫赫与通古斯渔猎部族。元代朝廷在此设立征东元帅府以经略东北极边；明永乐九年，宦官亦失哈率千人船队远航至此创立奴儿干都指挥使司，并于绝壁修筑永宁寺、竖立汉满蒙藏四体碑铭。这座远悬亚欧大陆东北尽头的江崖重镇，见证了中华王朝触及鄂霍次克海的壮阔足迹。"
 kaesong_desc: "开城古称松都，背枕松岳山、临近礼成江入海口碧澜渡，自公元919年王建定都起作为高丽王朝国都长达近五百年。城内满月台宫阙气象森严，高丽青瓷、活字金属印书与闻名东亚的《高丽大藏经》皆诞生于此，商港碧澜渡更云集宋元与大食海商。1392年朝鲜王朝迁都汉阳后，开城人凭借高丽红参与精明商帮网络依然稳居半岛首屈一指的商业都会。"
 gyeongju_desc: "庆州古称金城与徐罗伐，坐落于半岛东南兄山江平原，曾作为新罗王朝国都绵延近千年，享有“无墙博物馆”之盛誉。七世纪新罗统一半岛后，庆州成长为与长安、奈良遥相辉映的东亚都会，瞻星台、佛国寺、石窟庵与鎏金王冠尽显盛世风华。高丽时期朝廷尊其为东京，虽政治重心北移，庆州深厚的佛教艺术与新罗文脉始终滋养着朝鲜半岛。"
 nara_desc: "奈良古称平城京，坐落于群山环抱的大和盆地北缘，710年仿照盛唐长安棋盘格局营建，是日本首个宏伟的常设律令制帝都。城内巍峨的东大寺卢舍那大佛、兴福寺与珍藏丝路珍宝的正仓院，凝聚了天平文化博采中亚、印度与盛唐文明的璀璨结晶。虽在794年迁都平安京后不再为皇居，奈良南都诸大寺的僧兵财力与佛学权威仍在中世纪日本举足轻重。"
 osaka_desc: "大坂雄踞淀川入海口与濑户内海东端，自古代难波津起便是畿内京都通往西日本与东亚大陆的海运门户。十五世纪末净土真宗在此筑起坚不可摧的石山本愿寺寺内町，抗衡织田信长逾十年；1583年丰臣秀吉于故址大兴金碧辉煌的大坂城，迅速将大坂推向全日本商业心脏。江户时代各藩藏屋敷鳞次栉比，米市、银号与剧场云集，为大坂赢得“天下厨房”的赫赫威名。"
 kagoshima_desc: "鹿儿岛面向烟波浩渺的锦江湾与终年冒烟的樱岛活火山，自镰仓时代起便是九州豪族萨摩岛津氏世代经营的本据。凭借面向东海与琉球列岛的天然良港，鹿儿岛既是日本对琉球王国及南洋朝贡贸易的门户，也是十六世纪中叶方济各·沙勿略登岸传教与南蛮铁炮传入本土的窗口。1609年岛津氏以此为基地远征琉球，使这座火山脚下的南国坚城成为江户时代最桀骜强大的雄藩都城。"
 ayodhya_desc: "阿瑜陀耶坐落于湄南河、巴塞河与华富里河三水环抱的冲积岛屿之上，由乌通王于1351年筑城立都，迅速发展为称雄中南半岛四百余年的暹罗大城王国心脏。密如蛛网的运河与金光璀璨的佛塔林立岛间，来自大明、日本、波斯、印度与葡萄牙、荷兰的商馆沿河而立，使其成为南洋最富庶繁华的国际水都。直至1767年缅甸大军破城焚毁之前，阿瑜陀耶一直是东南亚海上贸易与外交的璀璨明珠。"
 malacca_desc: "马六甲扼守连接印度洋与南海的最窄海上咽喉，约1400年由流亡王子拜里米苏拉创立苏丹国，并依托郑和下西洋设立官厂与明廷册封护持而迅速腾飞。每逢东西季风交替，中国丝瓷、马鲁古丁香、印度棉布与阿拉伯乳香在此云集易手，马来语与伊斯兰信仰亦由此播撒整个南洋群岛。1511年葡萄牙总督阿方索·德·阿尔布开克攻占此港，更令马六甲成为欧亚列强争夺香料海权的世纪焦点。"
 pasai_desc: "八昔又称苏木都剌，坐落于苏门答腊岛北端马六甲海峡西口，是十三世纪末东南亚最早改宗伊斯兰教的苏丹国都城之一。马可·波罗与伊本·白图泰皆曾造访此港，盛赞其繁盛的胡椒与樟脑贸易以及宫廷内博学多才的伊斯兰法学家。作为传教与商贸双料灯塔，八昔不仅培育了后来马六甲与爪哇诸苏丹国的礼法传统，更将“苏门答腊”之名赋予整座大岛。"
 banten_desc: "万丹雄踞爪哇岛西端、直扼沟通爪哇海与印度洋的巽他海峡，十六世纪初改宗伊斯兰教并脱离巽他王国独立后，迅速崛起为南洋首屈一指的胡椒贸易霸主。当葡萄牙占领马六甲令穆斯林商船改道南航时，中国帆船、古吉拉特海商、阿拉伯人以及后来接踵而至的荷兰与英格兰东印度公司皆云集万丹港竞购胡椒。在阿贡苏丹治下，万丹凭借强盛舰队与大清真寺写就爪哇海洋强权的辉煌篇章。"
 surabaya_desc: "苏腊巴亚坐落于爪哇岛东北岸布兰塔斯河口，与马都拉岛隔海峡相望，天然深水良港庇护着往来满者伯夷帝国腹地与香料群岛的巨型帆船。早在1293年元军远征爪哇时，此地便因阻击大军而载入史册；满者伯夷强盛时期，苏腊巴亚既是皇家海军出海远征的母港，也是爪哇大米换取马鲁古丁香与肉豆蔻的中转大站。十六世纪以降，苏腊巴亚公国成为爪哇北部抗衡马打蓝与荷兰势力的海商重镇。"
 ternate_desc: "特尔纳特是马鲁古群岛北端一座由巍峨加马拉马火山筑就的袖珍海岛，在十七世纪以前，此处与南侧宿敌蒂多雷几乎垄断了全人类唯一的丁香产地。凭借这枚重若黄金的芳香花蕾，特尔纳特苏丹国建立起横跨苏拉威西至巴布亚的海洋贡赋网，并在十五世纪皈依伊斯兰教。十六世纪起，葡萄牙、西班牙与荷兰舰队接踵而至筑堡争锋，将这座火山小岛推向早期全球化香料战争的风暴中心。"
 mrauk_u_desc: "妙乌坐落于孟加拉湾东岸加叻丹河谷的丘陵迷宫之中，1430年由阿拉干国王明苏蒙营建为都，借天然水道、人工堤坝与厚重石墙筑成易守难攻的水陆名城。十六至十七世纪的阿拉干王国以妙乌为核心，凭借精锐水师纵横孟加拉湾，既迎纳葡萄牙雇佣炮手与荷兰东印度商馆，又修建起西陶寺、考当寺等兼具佛塔庄严与城堡气魄的巨石神殿，铸就若开海岸独树一帜的海洋佛国传奇。"
 vientiane_desc: "万象展布于湄公河中游宽阔平坦的冲积大湾北岸，自古为老挝盆地稻作与商道交汇之沃土。1560年澜沧国王赛塔提腊为避开缅甸东吁大军锋芒，将都城自琅勃拉邦南迁至此，并兴建金光熠熠的塔銮圣塔与供奉玉佛的玉佛寺，使万象跃居百万象之国的政教心脏。凭借湄公河舟楫连接清迈、阿瑜陀耶与越南山道，这座佛音缭绕的河畔都城见证了老挝古典礼法与佛教文化的鼎盛时代。"
 agra_desc: "阿格拉依傍蜿蜒南流的亚穆纳河西岸，扼守德里通往马尔瓦与德干高原的门户，1504年由德里洛迪苏丹西坎达尔定为新都而骤然兴起。莫卧儿帝国建立后，阿克巴大帝以红砂岩筑起巍峨的阿格拉红堡，沙贾汗更以洁白大理石与宝石镶嵌建起举世无双的泰姬陵，将印伊建筑艺术推向极致。在莫卧儿鼎盛百年间，这座河畔帝都汇聚四海工匠、珠宝商与使节，富丽甲于南亚。"
 multan_desc: "木尔坦坐落于杰纳布河畔旁遮普南部平原，自亚历山大东征时代起便是印度河流域扼控波伦山口与阿富汗商队的古老锁钥。城中曾以巍峨太阳神庙闻名南亚，自公元八世纪归入伊斯兰世界后，又凭巴哈乌丁·扎卡里亚与沙阿·鲁克尼·阿拉姆等苏菲圣哲的八角蓝釉砖陵墓赢得“圣徒之城”美誉。在德里苏丹国、蒙古突袭与莫卧儿治下，木尔坦始终以繁盛的丝棉染织与马匹贸易兴旺不衰。"
 panipat_desc: "伯尼巴德坐落于德里西北仅九十公里的亚穆纳河西岸平原，紧扼沿大干道南下印度斯坦腹地的最后咽喉，被命运注定为印度历史的决战古场。1526年巴布尔在此以车阵与野战火炮击溃洛迪大军，开创莫卧儿帝国；1556年阿克巴在此再破强敌重光帝业；1761年阿富汗杜兰尼王朝又在此重创马拉塔同盟。三次改变南亚国运的惊世会战，令这座看似平缓的冲积城镇名震天下。"
 thatta_desc: "特达雄踞印度河广阔三角洲顶点，十四世纪中叶由信德本土萨马王朝兴建为都，很快取代老港代布尔成为阿拉伯海北岸首屈一指的商贸大都。高踞城西马克利山岗的百万方精雕砂岩与蓝釉砖皇家陵墓群，见证了萨马、阿尔贡与塔尔汗诸朝融合古吉拉特石刻与波斯帖木儿风韵的建筑奇观。凭借享誉印度洋的精细丝棉织物与繁盛海港，特达直至印度河下游淤积改道前始终富庶非凡。"
 jaunpur_desc: "章普尔建于1359年恒河支流戈默蒂河畔，由德里苏丹菲鲁兹·沙阿·图格鲁克营建；1394年马利克·萨尔瓦尔在此开创独立沙尔基苏丹国后，这座东方名都迎来了璀璨百年的黄金时代。当帖木儿洗劫德里令北印动荡之际，大批波斯与印度学者、诗人、音乐家南迁章普尔，为其赢得“东方设拉子”的雅号。城中雄伟的阿塔拉清真寺以高耸梯形巨拱独创沙尔基风格，至今令人叹为观止。"
 gaur_desc: "高达雄踞恒河与默哈嫩达河交汇处的肥沃三角洲高地，曾是古代波罗与塞纳王朝名都，十五世纪中叶起更成为独立孟加拉苏丹国富甲南亚的国都。城内绵延十余公里的巨型土垒与红砖雕花大清真寺、达基尔门与金色圆顶建筑群，令初抵此地的葡萄牙使节惊叹其规模胜过里斯本。依靠恒河冲积沃土的稻米、蔗糖与丝绸出产，高达一度繁盛至极，直至十六世纪末恒河改道与瘟疫肆虐方渐归沉寂。"
 sonargaon_desc: "索纳尔冈梵语意为“黄金之村”，坐落于梅克纳河、布拉马普特拉河与拉基亚河交汇的东孟加拉水乡，十四世纪中叶由法赫鲁丁·穆巴拉克·沙阿立为独立孟加拉苏丹国初都。伊本·白图泰与明代郑和船队随行官马欢皆曾亲临此地，盛赞其织造如蝉翼般轻薄透明的极品“穆斯林细纱”棉布，行销中国、阿拉伯与欧洲。作为东孟加拉航运与纺织之魂，索纳尔冈直至莫卧儿迁治达卡前始终领风气之先。"
 surat_desc: "苏拉特坐落于达布蒂河注入坎贝湾的河口良港，十六世纪随着老港坎贝泥沙淤塞，这座古吉拉特商埠一跃成为莫卧儿帝国最富饶的西海门户。不仅是印度穆斯林扬帆西渡麦加的“朝觐之门”，城中更有帝国最繁忙的铸币厂、巨商银行家与竞相设馆的葡萄牙、英格兰、荷兰和法兰西商队。来自全印度的印花棉布、靛蓝与香料在此换取美洲与日本白银，令苏拉特名动全球商海。"
 diu_desc: "第乌是卡提阿瓦半岛南端一座与大陆仅隔狭窄水道的小岛，凭险固海防与深水锚地扼守坎贝湾咽喉，是中世纪古吉拉特苏丹国控御阿拉伯海商船的海军重镇。1509年2月，葡萄牙总督弗朗西斯科·德·阿尔梅达在第乌外海击溃古吉拉特、马穆鲁克埃及与卡利卡特联合舰队，一举奠定葡萄牙称霸印度洋百年的海权格局。1535年葡军获准在岛东端修筑巨石城堡后，第乌两度顶住奥斯曼与古吉拉特联军围攻，牢牢守住葡属印度北翼。"
 chittor_desc: "吉多尔雄踞拉杰普塔纳平原拔地而起的百米绝壁孤山之上，长达五公里的岩巅围城内宫殿、水池与神庙星罗棋布，是梅瓦尔拉杰普特西索迪亚王朝的铁血圣都。1303年阿拉丁·卡尔吉、1535年古吉拉特苏丹与1568年阿克巴大帝三度兴师苦攻，拉杰普特武士每次皆在绝境中死战到底，使吉多尔化作北印骑士荣耀与宁死不屈精神的不朽象征。屹立山巅的九层胜利塔，至今俯瞰着梅瓦尔的苍茫原野。"
 bijapur_desc: "比贾布尔坐落于德干高原西部的玄武岩台地，最初由卡利亚尼遮娄其王朝建城，1489年巴赫曼尼苏丹国分裂后成为阿迪勒·沙希王朝统治近两百年的华丽国都。在易卜拉欣二世等崇尚艺文的苏丹赞助下，此城融汇波斯、奥斯曼与德干本土工艺，修筑起拥有前近代世界最大单跨砖石穹顶之一的高尔·贡巴兹陵墓，并铸造出重逾五十吨的“草原之主”青铜巨炮。直至1686年奥朗则布率莫卧儿大军攻克前，比贾布尔一直是德干文化与军工的巅峰代表。"
 golconda_desc: "戈尔孔达矗立于德干东部一座拔地百米的花岗岩陡峰之上，原为卡卡提亚王朝牧羊山堡，1518年起成为库特布·沙希王朝富甲天下的都城。其三重厚重花岗岩城墙与巧夺天工的声学预警拱门易守难攻，更因独占克里希纳河谷冲积矿场而成为近代以前全球唯一的钻石产销霸主，光明之山与希望蓝钻皆由此流向欧亚王室。富可敌国的财富吸引无数商旅，直至1687年历经八个月血战方落入莫卧儿之手。"
 goa_desc: "果阿依偎在西高止山脉与阿拉伯海之间的曼多维河与祖阿里河双河口深水良港，中世纪曾是卡丹巴、毗奢耶那伽罗与比贾布尔苏丹竞相争夺的阿拉伯战马进口咽喉。1510年葡萄牙总督阿尔布开克攻克此城，将其定为统辖从东非莫桑比克延伸至澳门的“葡属东方领地”总督府首都。宏伟的巴洛克大教堂、圣方济各·沙勿略圣骨堂与香料船坞并立河岸，令“黄金果阿”成为东西方海洋文明碰撞交融的传奇都市。"
 kozhikode_desc: "科泽科德在明代中国史籍中雅称“古里”，坐落于马拉巴尔海岸黑胡椒主产区前沿，由扎莫林王公世代统治，是中世纪印度洋最开放诚信的自由贸易王都。来自阿拉伯、埃及与大明的巨舰借季风往来云集，郑和七下西洋屡次以此为西洋总会驿站，并立碑铭记邦交；1498年瓦斯科·达·伽马率葡船首抵印度正是在此抛锚。连绵百年的香料商战与海上角逐，令古里大港成为大航海时代绕不开的历史地标。"
 kochi_desc: "科钦坐落于马拉巴尔海岸深邃静谧的回水潟湖入海口，因1341年一场改变河道的大洪水冲开深水航道而取代古城穆济里斯，迅速崛起为南印最安全的天然避风港。在科钦王公宽容开明的治理下，印度教徒、圣多马基督徒、阿拉伯海商、远航华商与历史悠久的马拉巴尔犹太社群和谐共居。十六世纪初科钦联手葡萄牙抗衡宿敌古里，其后又历荷兰东印度公司经营，绵延不绝地输出黑胡椒与豆蔻。"
 thanjavur_desc: "坦贾武尔坐落于高韦里河肥沃三角洲的稻作粮仓腹地，九至十一世纪曾作为朱罗帝国鼎盛时期的王都，派出庞大舰队远航锡兰、孟加拉乃至三佛齐。罗茶罗乍一世于公元1010年建成的布里哈迪希瓦拉花岗岩大神庙，以高耸入云的塔楼与精美失蜡法湿婆青铜造像震撼后世。纵使后来历经潘迪亚、毗奢耶那伽罗纳亚克与马拉塔彭斯莱王朝更迭，坦贾武尔依然稳居泰米尔古典乐舞与金箔绘画的最高殿堂。"
 kanchipuram_desc: "甘吉布勒姆坐落于巴拉尔河北岸的泰米尔腹地，昔日为帕拉瓦王朝数百年都城，因遍布湿婆教、毗湿奴教以及古代佛教与耆那教殿宇而被尊为印度七大圣城之一与“千庙之城”。唐代玄奘曾远涉至此惊叹其伽蓝林立，禅宗初祖菩提达摩亦相传出身此地王族。除了宏伟的凯拉萨纳塔石雕神庙与古典梵文书院，当地工匠织造的金线桑蚕纱丽亦世代享誉南亚。"
 kandy_desc: "康提深藏于锡兰岛中央群峰叠嶂、密林环绕的高地盆地之中，凭借险峻山隘与环抱城池的马哈韦利河构成天然铁壁。十五世纪末康提王国在此崛起，随着滨海低地陆续落入葡萄牙与荷兰东印度公司之手，康提迎奉象征锡兰王权正统的佛牙舍利入驻佛牙寺，成为岛上唯一屹立不倒的独立僧伽罗佛教堡垒。凭借精妙山地游击战与外交周旋，康提顽强抗拒欧洲殖民强权长达三百年之久。"
 galle_desc: "加勒雄踞锡兰岛西南端伸入印度洋的岩石岬角，是自古代波斯、阿拉伯与中国海船便熟知的季风补给良港。1409年明代航海家郑和曾在此立下以汉文、泰米尔文与波斯文镌刻的三语布施锡兰山佛寺碑，铭记印度洋多元信仰共融的盛景。十六至十七世纪葡萄牙与荷兰先后在此修筑雄伟的珊瑚石星形海防要塞，使加勒成为统御锡兰肉桂、象牙与宝石出口的坚固海洋堡垒。"
 kathmandu_desc: "加德满都坐落于喜马拉雅山南麓翠绿肥沃的谷地中央，扼守翻越雪山山口往来印度恒河平原与西藏高原的商贸大动脉。在马拉王朝统治的数百年间，纽瓦尔工匠在杜巴广场筑起层檐叠宇的红砖木雕王宫、佛塔与神庙，将印度教与藏传佛教艺术融为一体，并向拉萨与大元宫廷输送了阿尼哥等绝世巧匠。凭借过境商税与精妙铜雕木刻，这座群山环抱的谷地王都长久闪耀着喜马拉雅文明之光。"
 srinagar_desc: "斯利那加依偎在喜马拉雅群峰雪水汇聚的克什米尔河谷中心，杰赫勒姆河穿城而过，七座木桥与碧波荡漾的达尔湖勾勒出如诗水城画卷。1339年沙阿·米尔建立克什米尔苏丹国后，波斯苏菲圣哲与工艺师蜂拥而至，孕育出举世闻名的克什米尔帕什米纳羊绒披肩、彩漆纸浆工艺与藏传—伊斯兰木构清真寺。莫卧儿诸帝更视此城为“人间天堂”，沿湖修建夏利马尔与尼沙特阶梯花园，令其盛名远播四海。"
 daulatabad_desc: "道拉塔巴德古称德瓦吉里，依托一座四周人工凿成垂直光滑绝壁的圆锥形玄武岩孤峰而建，外绕深壕、吊桥与漆黑曲折的岩心暗道，号称中世纪印度最不可逾越的陆地天险。此城原为雅达瓦王朝富庶的马哈拉施特拉都城，1327年德里苏丹穆罕默德·宾·图格鲁克更突发奇想强令德里全城官民南迁至此，更名“幸运之城”道拉塔巴德以图统御整个次大陆。虽迁都最终功败垂成，这座绝壁铁堡仍作为巴赫曼尼与艾哈迈德讷格尔诸朝的西德干锁钥屹立不倒。"
 damietta_desc: "达米埃塔扼守尼罗河东支注入地中海的咽喉河口，自古是埃及通往黎凡特与意大利的繁荣商港，以洁白精细的达米埃塔亚麻织物与稻米闻名地中海。因其直通开罗腹地，这座水网重镇在第五次与第七次十字军东征中屡遭强攻，1219年十字军破城苦守、1249年法王路易九世更是率大军登岸占领此城，随后在曼苏拉惨败被俘。马穆鲁克苏丹遂夷平旧港并在内陆重建坚城，牢牢锁住尼罗河东翼门户。"
 suez_desc: "苏伊士坐落于红海苏伊士湾最北端荒漠海滨，紧邻古代法老与图拉真运河遗迹，自十五世纪马穆鲁克王朝时代起便取代阿伊扎布成为开罗直通红海与麦加的海运枢纽。当葡萄牙舰队在十六世纪初封锁红海口并威胁圣地时，马穆鲁克与随后的奥斯曼苏丹倾力在苏伊士兴建大型皇家海军船厂，将安纳托利亚松木经尼罗河与驼队千里运抵此地装配桨帆战舰。这座扼守两洋狭颈的沙漠军港，成为奥斯曼远征印度洋与也门的前进基地。"
 tripoli_desc: "的黎波里由腓尼基人始建为奥亚港，凭地中海中段避风良湾成为撒哈拉费赞绿洲与乍得湖商队北出地中海的首要出海口，源源不断转运苏丹黄金、象牙与驼鸟羽。中世纪此城在突尼斯哈夫斯王朝、热那亚舰队与本土巴尼·阿马尔家族之间反复易手；1510年西班牙攻占并转交马耳他医院骑士团驻守，1551年则由奥斯曼海盗名将德拉古特夺取。此后在卡拉曼利帕夏治下，的黎波里成为令欧美商船闻风丧胆的巴巴里海盗与贸易坚城。"
 kairouan_desc: "凯鲁万由阿拉伯名将奥克巴·伊本·纳菲于公元670年建于突尼斯内陆平原，是伊斯兰教在马格里布建立的第一座军政与信仰圣城。城内巍峨的奥克巴大清真寺以古罗马石柱林立祈祷厅与阶梯方塔闻名北非，阿格拉布王朝修建的巨型蓄水池与马利基法学院更曾吸引全西伊斯兰世界的学者负笈而来。即便在十一世纪希拉尔游牧劫掠与首都东迁突尼斯之后，凯鲁万仍凭深厚法学传统与精美手工地毯享有北非第一圣城尊荣。"
 bejaia_desc: "贝贾亚依山傍海坐落于卡比利亚陡峻海岸的深水海湾，十一世纪末经哈马德王朝大举营建，迅速跃升为西地中海与马格里布最富庶的学术与海贸都会。这座被称为“小麦加”的港口不仅云集比萨、热那亚与阿拉贡商馆、盛产优质的“布日”蜂蜡烛，更是十二世纪末年轻的比萨数学家斐波那契随父经商并系统习得印度—阿拉伯数字之地。历经穆瓦希德与哈夫斯王朝繁荣，直至1510年西班牙入侵前，贝贾亚始终是连接欧洲与北非知识商业的璀璨桥梁。"
 algiers_desc: "阿尔及尔面朝宽阔半月形海湾，因近岸四座礁岛而得阿拉伯名“群岛城”，中世纪原为归附特莱姆森与贝贾亚的滨海商镇。1516年奥鲁奇与海雷丁·巴巴罗萨兄弟应城民之邀抵御西班牙人并献城归附奥斯曼帝国后，阿尔及尔摇身一变成为西地中海最具威慑力的奥斯曼海军总督府与巴巴里私掠舰队母港。1541年神圣罗马皇帝查理五世亲征惨败城下，更令这座白墙阶梯般的山海坚城威震基督教欧洲近三百年。"
 tlemcen_desc: "特莱姆森坐落于西阿尔及利亚清泉涌流的高原台地，扼守马格里布东西走廊并直连穿越撒哈拉的西吉勒马萨黄金商道。十三世纪中叶至十六世纪中叶，阿卜杜勒瓦迪德扎扬王朝以此为都历时三百余年，大兴细腻精致的安达卢斯—摩尔风格清真寺、神学院与水渠，令此城赢得“马格里布明珠”的赞誉。尽管屡遭摩洛哥马林王朝围攻、甚至在其城外筑起曼苏拉围城军营，特莱姆森始终凭商业活力与深厚学风傲立西马格里布。"
 walata_desc: "瓦拉塔雄踞毛里塔尼亚东南沙漠崖麓的荒漠绿洲，十三世纪初随着古加纳王国奥达戈斯特与昆比萨利赫衰落，迅速取而代之成为跨撒哈拉黄金与盐巴商队抵达西非萨赫勒的第一座大站。1352年大旅行家伊本·白图泰横越死亡沙海后，正是先抵瓦拉塔才踏入马里帝国疆域，并记述了城中马苏法柏柏尔妇女享有高度社会自由与精美彩绘泥屋的奇风。直至十五世纪廷巴克图全面兴起前，瓦拉塔一直是西非沟通北非学界与商界的关键绿洲门户。"
 taghaza_desc: "塔盖扎深藏于撒哈拉大沙漠腹地最酷烈荒芜的干涸盐湖盆地，四周数百里寸草不生，却因蕴藏无尽洁白厚实的岩盐矿层而成为支撑西非诸帝国命脉的奇迹矿城。这里的奴隶与矿工甚至直接用硕大盐砖垒砌房屋与清真寺、覆以骆驼皮作顶，全赖北非与马里商队运来椰枣、小米和肉干维生。无数驼队冒死深入塔盖扎切割整块盐板南运廷巴克图换取等重黄金，使这座盐砌孤城成为中世纪世界最震撼的贸易奇观。"
 niani_desc: "尼亚尼坐落于桑科拉尼河畔、紧邻富饶的布雷金矿区与森林草原交界处，被广泛视为十三世纪松迪亚塔·凯塔缔造的马里帝国核心王都。在曼萨·穆萨震惊开罗与欧洲的黄金朝觐时代，这座由泥砖宫殿、清真寺与工匠村落组成的王城统治着从大西洋岸直抵尼日尔河大拐弯的广袤西非疆域。伊本·白图泰在1352年亲赴此地觐见曼萨·苏莱曼，盛赞帝国法度严明、行旅平安，留下了中世纪西非黄金王朝最珍贵的实录。"
 agadez_desc: "阿加德兹矗立在撒哈拉中南部阿伊尔高原南缘，十五世纪初由图阿雷格各部联合创立阿伊尔苏丹国后，迅速跃升为连接的黎波里、开罗与豪萨诸邦的跨漠商道枢纽。城中高达二十七米的土坯木刺大清真寺宣礼塔始建于十六世纪初，既是沙漠商队百里之外可见的导航灯塔，亦是撒哈拉泥砖建筑的巅峰杰作。盐队、驼群、皮匠与银匠云集于此，使阿加德兹数百年来始终扮演着撒哈拉之门的传奇角色。"
 katsina_desc: "卡齐纳坐落于尼日利亚北部开阔的萨赫勒草原，是古老“豪萨七邦”中最靠北的商贸门户，直接承接来自阿加德兹与加达梅斯的跨撒哈拉商队。十五世纪末在伊斯兰学者马吉里与苏丹易卜拉欣·马吉推动下，卡齐纳兴建著名的戈比劳土坯宣礼塔，很快成长为与廷巴克图遥相呼应的西非伊斯兰法学与文学重镇。十七至十八世纪，凭精湛皮革染色、棉布织造与宽厚税制，卡齐纳更一度超越卡诺成为豪萨大地首屈一指的商贸都会。"
 ngazargamu_desc: "恩加扎尔加穆建于约1470年约贝河与科马杜古河交汇处，由赛法瓦王朝梅·阿里·加吉在离开乍得湖东岸卡涅姆故地后倾力营建为博尔努帝国新都。绵延数公里的巨大土垣之内，宏伟的烧砖王宫与四座大清真寺蔚为壮观，人口鼎盛时号称二十万，令全中苏丹地区望风披靡。在迈·伊德里斯·阿劳马治下，博尔努从奥斯曼的黎波里引入火绳枪兵与重装铁甲骑兵，以恩加扎尔加穆为基点称霸乍得湖盆地逾三百年。"
 benin_desc: "贝宁城坐落于西非赤道雨林腹地，是埃多族奥巴国王统治的贝宁王国圣都，城外蜿蜒纵横的巨型土墙与护城壕沟工程浩大，堪称前近代人类最大规模的土方奇迹之一。十六至十七世纪造访此城的葡萄牙与荷兰旅行家惊叹于其笔直宽阔的棕榈大道、夜明棕油路灯以及规整井然的宫廷秩序。更令后世震撼的是皇家铜匠行会以失蜡法铸造的贝宁黄铜浮雕板与王母雕像，展现非洲古典宫廷艺术的绝顶成就。"
 ife_desc: "伊费坐落于尼日利亚西南部的丘陵林地之间，在约鲁巴神话中被尊为创世起点与诸邦王权的神圣发祥地，无论奥约帝国还是贝宁王室皆奉伊费奥尼王为精神宗主。公元十二至十五世纪，伊费步入灿烂的古典盛世，城内铺满精巧碎陶片镶嵌的庭院与大街，工匠更铸造出举世震惊的写实黄铜与赤陶人像，其优雅神态与精密工艺令世界艺术史为之折服。这座灵气盎然的圣城，数百年来始终维系着约鲁巴文明的精神向心力。"
 dongola_desc: "旧栋古拉雄踞尼罗河第三与第四瀑布之间的东岸砂岩高崖，自公元六世纪起作为努比亚基督教强国马库里亚王国首都绵延逾八百载。652年努比亚神箭手曾在此城下重创阿拉伯大军并缔结延续六百余年的《巴克特互不侵犯条约》，使红砖教堂、绚丽科普特—拜占庭壁画与宫殿得以沿尼罗河畔巍然屹立。十四世纪初马穆鲁克扶植穆斯林王公登基并将王座大厅改建为清真寺后，栋古拉见证了努比亚从基督教古国向伊斯兰苏丹文化的深刻转型。"
 suakin_desc: "萨瓦金奇特而优雅地建于红海西岸一座由珊瑚礁构筑的圆形海岛之上，与阿拉伯对岸吉达港遥遥相望，凭借狭长曲折的天然礁道抵御外敌突袭。自中世纪阿伊扎布衰落以来，萨瓦金成为努比亚、芬吉苏丹国与西非朝圣者横渡红海奔赴麦加的首要良港，源源输出黄金、象牙、阿拉伯树胶与珍珠。1517年奥斯曼帝国进驻此岛设立阿比西尼亚省总督驻地后，精雕珊瑚石楼阁与木格凉窗更铸就了红海独一无二的建筑风貌。"
 lalibela_desc: "拉利贝拉古称罗哈，深藏于埃塞俄比亚拉斯塔高地海拔两千五百米的红褐火山岩群山之中，十二世纪末至十三世纪初由扎格维王朝圣王拉利贝拉倾国力营建。因1187年耶路撒冷落入穆斯林之手阻断朝圣之路，国王誓言在非洲之角山巅亲手打造一座“新耶路撒冷”，命匠人自整块红色火山凝灰岩由上而下整凿出十一座宏伟教堂，尤以十字形圣乔治教堂堪称世界建筑奇迹。即便所罗门王朝复位后，这座凿岩圣城依然是埃塞俄比亚正教绵延不绝的朝圣圣地。"
 harar_desc: "哈拉尔雄踞埃塞俄比亚东缘海拔一千八百米的清凉高地，扼守从泽拉与柏培拉海港通往非洲之角内陆高原的商道咽喉。1520年阿达尔苏丹国迁都至此并由埃米尔努尔筑起开有五道城门的巨石围墙后，哈拉尔跃升为东非最显赫的伊斯兰学府与圣城，城内清真寺与圣徒陵墓星罗棋布。除了宗教威望，哈拉尔更是世界优质阿拉比卡咖啡、象牙与精织布匹的集散重镇，在非洲之角宗教战争与商贸交融中留下深刻烙印。"
 zeila_desc: "泽拉坐落于亚丁湾南岸伸入碧海的低平沙咀之上，自古典时代阿瓦利忒斯港起便是埃塞俄比亚高地与阿拉伯半岛、印度洋之间最重要的商贸桥梁。中世纪此港作为伊法特苏丹国与阿达尔苏丹国的核心出海口，源源不断向也门、埃及与印度输出乳香、没药、黄金、象牙、咖啡及皮革，并迎来伊斯兰信仰与波斯、中国瓷器。十六世纪奥斯曼与葡萄牙舰队在红海口激烈角逐，屡次炮轰泽拉，却难掩其千年海商古港的辉煌印记。"
 zanzibar_desc: "桑给巴尔岛隔海峡遥望东非大陆，凭借季风洋流与天然避风浅海，自中世纪起便深度融入繁荣的斯瓦希里珊瑚石城商贸圈。来自阿曼、波斯设拉子、古吉拉特乃至中国远航船队的商货在此与非洲内陆的象牙、金砂与红树林原木交汇，催生出独具魅力的斯瓦希里语与海洋文明。十六世纪葡萄牙短暂设站后，阿曼亚鲁巴与布赛义德王朝接踵经营，将桑给巴尔塑造成掌控东非海岸、香飘四海的丁香与象牙明珠。"
 mbanza_kongo_desc: "姆班扎刚果雄踞刚果河下游以南肥沃凉爽的高原台地，十四世纪末由卢凯尼·卢阿·尼米建为刚果王国王都，统御中非西南部庞大的铁器、拉菲亚棕榈织布与海贝货币贸易网。1483年葡萄牙航海家迪奥戈·康抵达刚果河口后，刚果国王恩津加·恩库武与阿方索一世主动接纳天主教并派贵族子弟远赴里斯本与罗马求学，将王都改名圣萨尔瓦多并兴建非洲撒哈拉以南最早的石砌大教堂。这座高原大都，见证了中非古国与大西洋世界风云激荡的百年交锋。"
