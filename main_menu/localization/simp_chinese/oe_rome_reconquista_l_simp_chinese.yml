 OE_RR_START_TT: "“罗马再征服”局势开启，复兴狂热从#Y 40#!起步。各地区的征伐胜负、光复城市和凯旋式会改变它；归零则再征服之梦破碎。"
 OE_RR_BROKEN_TT: "局势结束，已光复的地区和修正保留。#Y 20#!年内获得“专注余下的疆土”。#Y 20#!年后可以重燃再征服。"
 oe_rr.20.t: "帝国中兴"
 oe_rr.20.d: "三个地区已重归帝国。市集上的商人开始用旧日的行省名称谈论远方的货物，元老院的老人说，自希拉克略以后，没有哪一代人见过这样的局面。"
 oe_rr.20.a: "这只是开始"
 oe_rr.21.t: "罗马重光"
 oe_rr.21.d: "六个地区已经光复。从君士坦丁堡出发的使节，如今能在帝国的土地上一路走到大海的另一端。"
 oe_rr.21.a: "罗马从未离去"
 OE_RR_AUTH_20: "帝国权威#G +20#!"
 OE_RR_AUTH_30: "帝国权威#G +30#!"
 oe_rr.22.t: "万国归一"
 oe_rr.22.d: "十个地区全部光复。只要罗马、亚历山大、安条克与迦太基四座古都都在帝国手中，并且天下无战事，皇帝便可以宣告罗马光复。"
 oe_rr.22.a: "准备宣告"
 OE_RR_FINAL_TT: "罗马世界面板的“罗马光复”行动可以使用了（条件见其说明）。"
 oe_rr.40.t: "重燃再征服"
 oe_rr.40.d: "二十年过去了。新一代的将领没有见过当年的败退，他们在宫廷里谈论的，又是迦太基、罗马与亚历山大。"
 oe_rr.40.a: "重燃再征服（帝国权威#R −30#!，复兴狂热从#Y 25#!起步）"
 oe_rr.40.b: "时机未到"
 OE_RR_REKINDLE_LATER: "以后不会再提示；“罗马再征服”保持结束。"
