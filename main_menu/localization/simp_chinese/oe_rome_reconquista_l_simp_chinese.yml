 rome_reconquista_desc: "东方的罗马国家始终将光复帝国版图视为自己的最高理想，随着东罗马内外为之一靖，她注定要踏上无数#bold #color_yellow 罗马先帝#!#!都走过的道路。欧洲人不久就将认识到，帝国本身就是比突厥异教徒更危险的存在。\n\n复兴狂热：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_rr_hope').GetValue|0]#!（[GetCountry('BYZ').Custom('OeRrTierName')]）　已光复：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_rr_count').GetValue|0]#! / #Y 10#!\n\n埃及：[GetCountry('BYZ').Custom('OeRrStatus_egypt')]\n北非：[GetCountry('BYZ').Custom('OeRrStatus_africa')]\n意大利：[GetCountry('BYZ').Custom('OeRrStatus_italy')]\n法兰西：[GetCountry('BYZ').Custom('OeRrStatus_france')]\n伊比利亚：[GetCountry('BYZ').Custom('OeRrStatus_iberia')]\n不列颠：[GetCountry('BYZ').Custom('OeRrStatus_britain')]\n德意志：[GetCountry('BYZ').Custom('OeRrStatus_germany')]\n波斯：[GetCountry('BYZ').Custom('OeRrStatus_persia')]\n黑海：[GetCountry('BYZ').Custom('OeRrStatus_blacksea')]\n阿拉伯：[GetCountry('BYZ').Custom('OeRrStatus_arabia')]\n\n光复#Y 3#!个地区：帝国中兴；#Y 6#!个：罗马重光；#Y 10#!个并拥有罗马、亚历山大、安条克、迦太基：可宣告罗马光复。复兴狂热归零则再征服之梦破碎。"
 OE_RR_CARD_TITLE: "罗马再征服"
 OE_RR_CARD_STATE: "状态：[GetCountry('BYZ').Custom('OeRrState')]"
 OE_RR_CARD_HOPE: "复兴狂热#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_rr_hope').GetValue|0]#! / #Y 100#!　[GetCountry('BYZ').Custom('OeRrTierName')]"
 OE_RR_CARD_HOPE_TT: "复兴狂热代表罗马从统治者到黎民对光复帝国版图的认可。\n征伐大胜#Y +15#!、议和#Y +8#!、败退#Y −15#!；光复城市#Y +3#!（罗马#Y +5#!）；凯旋式#Y +5#!；宣传事件 ±#Y 3#!–#Y 5#!。\n一场征伐满#Y 3#!年后每年#Y −3#!；连续#Y 5#!年没有征伐时每年#Y −2#!。\n消沉#Y 1#!–#Y 24#!：宣布征伐花费#R +50%#!、正统性下降；平稳#Y 25#!–#Y 59#!；高涨#Y 60#!–#Y 84#!：陆军士气#G +5%#!、征伐事件进度#G +2#!；狂热#Y 85#!–#Y 100#!：陆军士气#G +10%#!、征伐压力每月#G −1#!、稳定度投资下降。"
