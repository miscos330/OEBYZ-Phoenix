# NEW 2026-11-22 v11.2 Worker 4 (oe_cel_). Generated by gen_v112_celestial_events.py; edit the generator, not this file.
 oe_cel.1.title: "天命所归"
 oe_cel.1.desc: "天命在我。朝廷依本朝的制度设[ROOT.GetCountry.Custom('GetCelestialCourtBureau')]统御藩属，以[ROOT.GetCountry.Custom('GetCelestialDecreeStyle')]号令天下。宗藩、羁縻与四海都护，从此各有名分。"
 oe_cel.1.a: "承续正统"
 oe_cel.2.title: "投下宗王请升大兀鲁思"
 oe_cel.2.desc: "一位投下宗王上表，请以其份地升为大兀鲁思，位在诸王之上。许之则宗王感恩用命；不许，他难免怨望。"
 oe_cel.2.a: "准其所请"
 oe_cel.2.b: "不许"
 oe_cel.3.title: "塞王出镇"
 oe_cel.3.desc: "本朝首位宗室亲王奉敕辞阙，率领仪仗与护卫甲士启程就藩，出镇边陲要冲。亲王坐镇一方、控扼险隘，既可为朝廷充当稳固屏藩、震慑外患，却也手握亲军与地方财赋；护卫甲士若过于强盛，日后一旦朝纲松弛，便难免埋下尾大不掉的隐忧。"
 oe_cel.3.a: "厚其护卫，以固边防"
 oe_cel.3.b: "薄其兵权，以防不测"
 oe_cel.4.title: "亲藩受封"
 oe_cel.4.desc: "开国功臣与宗室受封为王，各镇一方。他们手握重兵，平乱得力；朝廷也须留心，不让封王成为割据的开端。"
 oe_cel.4.a: "倚为屏藩"
 oe_cel.4.b: "恩威并用，徐图裁抑"
 oe_cel.5.title: "客帝定鼎之问"
 oe_cel.5.desc: "我们并非中原旧主，如今却执掌天命。朝野都在观望：新朝会全盘接受天朝制度，还是保留本国法统？可以在决议中作出抉择。"
 oe_cel.5.a: "容后定夺"
 oe_cel.6.title: "[ROOT.GetCountry.Custom('GetCelestialCrisisName')]"
 oe_cel.6.desc: "朝廷下令削藩，藩王拒不奉诏，传檄各地，指斥朝中奸臣离间骨肉。是发兵讨伐，是夺其护卫、徐徐图之，还是收回成命？"
 oe_cel.6.a: "发兵讨伐"
 oe_cel.6.b: "夺其护卫，徐徐图之"
 oe_cel.6.c: "收回成命"
 oe_cel.7.title: "平藩告成"
 oe_cel.7.desc: "抗命称兵的藩王终在王师合围之下溃败伏诛，僭越旗帜尽数倾倒，叛军所据城池与府库俱已收归朝廷节制。捷报传遍内外诸司与边疆各镇，朝野上下震动，天下藩属无不凛然敬畏，自此再无人敢轻视天子诏令与中枢法度。"
 oe_cel.7.a: "天下一统"
 oe_cel.8.title: "裂土妥协"
 oe_cel.8.desc: "征讨叛藩的战事迁延日久，朝廷终究未能以雷霆之势将其制服，只得在疲敝之中议和妥协，默许那位藩王继续割据自处。自此藩国气焰日炽，礼数渐亏，俨然与中枢分庭抗礼，四方封臣暗中观望，朝廷多年积攒的威信已大不如前。"
 oe_cel.8.a: "忍一时之辱"
 oe_cel.9.title: "藩王薨逝"
 oe_cel.9.desc: "讣告自藩府驰报京师，一位镇守一方的宗室藩王已然薨逝。按本朝旧制与宗藩惯例，爵位与封国本应由其嫡长子嗣顺理承袭；然朝中亦有重臣进言，主张趁此新旧交替之机收回亲王封号、裁抑护卫，将其降为寻常附庸以消弭后患。"
 oe_cel.9.a: "许其子嗣续封"
 oe_cel.9.b: "乘机收回封号"
 oe_cel.10.title: "出镇亲王身故"
 oe_cel.10.desc: "奉旨出镇远方的宗室亲王在任所积劳成疾，不幸病逝于异乡。当地官吏与随行护卫已整肃仪仗、备妥棺椁，准备护送亲王灵柩万里归葬祖茔。究竟是特颁优诏、厚加赙赠以彰宗室勋劳，还是按常制从简治丧，尚待朝廷明示。"
 oe_cel.10.a: "厚加赙赠"
 oe_cel.10.b: "依例办理"
 oe_cel.11.title: "[ROOT.GetCountry.Custom('GetCelestialDuhuTitle')]开府"
 oe_cel.11.desc: "朝廷在万里之外的新附要冲正式开府置官，钦颁金印、符节与仪仗，命重臣统辖当地军政与通商事务。自此天子号令跨越山海、直达异域绝境，沿途舟车勘探所得舆图、物产与风土皆源源呈报中枢，与朝廷共享远略之利。"
 oe_cel.11.a: "威德远被"
 oe_cel.12.title: "三洲开府"
 oe_cel.12.desc: "天朝设于域外的都护府如今已横跨三大战区，旌旗遥相呼应，驿传与海道络绎不绝。无论草原诸部还是远洋邦国，皆遣使奉表称臣、朝贡不绝，四夷宾服之象渐显，一个以天子为尊的天下秩序已初具规模。"
 oe_cel.12.a: "天下之势初成"
 oe_cel.13.title: "[ROOT.GetCountry.Custom('GetCelestialPacifierTitle')]授印"
 oe_cel.13.desc: "远方边地的部族首领恭敬领受朝廷颁发的官印与敕书，正式称臣纳款，誓言世守其土、按期入贡并拱卫边防。朝廷秉持羁縻怀柔之策，不强改其衣冠律俗，亦不轻动干戈，只要部众恪守盟约、不生事端，便许其安享世袭之权。"
 oe_cel.13.a: "因俗而治"
 oe_cel.14.title: "土司抗流"
 oe_cel.14.desc: "朝廷推行改土归流的风声刚刚传遍山谷，世袭相承的土司与各寨头人便闻讯哗变，纷纷纠集部众、据险立栅，声言祖宗世守之地绝不容流官夺取。山道已被封锁，税吏受阻难行，究竟是发兵雷霆镇压，还是遣使厚赠安抚，须即刻决断。"
 oe_cel.14.a: "发兵镇压"
 oe_cel.14.b: "加意安抚"
 oe_cel.15.title: "改流告成"
 oe_cel.15.desc: "历经勘界、清丈与招抚，一处昔日实行羁縻制度的边地终于正式裁撤土司、改设流官治理。新任州县官吏已到任视事，当地百姓编入黄册户籍，按亩纳粮服役，律令教化一体施行，从此与中原内地再无二致。"
 oe_cel.15.a: "与内地一体"
 oe_cel.16.title: "雷霆郡县"
 oe_cel.16.desc: "朝廷雷霆出击，一举废除世代盘踞的土司制度，在广袤边地新设郡县、派驻流官。然而旧主虽去，新附百姓尚存疑惧，山野之间流言四起、人心未定；若要令新设郡县长治久安，既须驻兵弹压不轨，亦须蠲免赋役、发粟赈济以安民心。"
 oe_cel.16.a: "驻兵镇抚"
 oe_cel.16.b: "蠲免赋役，发粟赈济"
 oe_cel.17.title: "[ROOT.GetCountry.Custom('GetCelestialCourtBureau')]会盟"
 oe_cel.17.desc: "各路羁縻宣慰司与边疆土司首领应诏齐集指定重镇举行会盟大典。帐前陈设仪仗，宣读天子敕谕，诸首领依次重申君臣名分、核定岁贡章程，并领受朝廷赏赐的锦帛银器。礼成而散，漫长边疆暂得安宁稳固。"
 oe_cel.17.a: "恩威并著"
 oe_cel.18.title: "治国大辩论"
 oe_cel.18.desc: "朝中为治国之道争论不休：一派主张[ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')]，一派主张[ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]。天子的取舍，将定下一代人的风气。"
 oe_cel.18.a: "取[ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')]"
 oe_cel.18.b: "取[ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]"
 oe_cel.19.title: "大辩论定论"
 oe_cel.19.desc: "连日来震动朝堂的大辩论终于渐趋平息，各派重臣与言官不再各执一词。随着御前圣旨颁行天下，礼部与地方诸司依次奉行，朝野上下皆接受了天子的最终裁断，政令归于统一，动荡的人心也随之安定下来。"
 oe_cel.19.a: "定于一尊"
 oe_cel.20.title: "天命衰微"
 oe_cel.20.desc: "近来水旱灾异频仍，星象示警，府库渐空，天命衰微的迹象已难掩饰。各藩属国使臣与地方豪强暗中交头接耳，私下议论纷纷：如今坐镇紫宸的天子是否失德于天，还配不配继续执掌这副统御四海的社稷重器？"
 oe_cel.20.a: "祭天修德"
 oe_cel.20.b: "流言不足为虑"
 oe_cel.21.title: "宝船四海通商"
 oe_cel.21.desc: "朝廷毅然改弦更张，颁行宝船四海通商之宏策。船厂日夜赶工，数丈高的多桅巨舶满载丝绸、瓷器与茶砖扬帆出海，远航南洋乃至西洋绝域；消息传开，万国商旅闻风辐辏，满载香料与白银的商船接踵驶入天朝诸港。"
 oe_cel.21.a: "扬帆四海"
 oe_cel.22.title: "丝路双凤，东西共主"
 oe_cel.22.desc: "罗马人的皇帝成了天朝的天子。丝路两端的两个帝国，如今同奉一人为主。君士坦丁堡与中原的使者相向而行，在途中相遇。"
 oe_cel.22.a: "东西共主"
 oe_cel.23.title: "扶桑遇新罗马"
 oe_cel.23.desc: "扶桑的都护府传来消息：大洋彼岸已有罗马人立国，自称极乐洲新罗马。跨过两大洋而来的两个帝国，在新大陆相遇了。"
 oe_cel.23.a: "遣使通好"
 oe_cel.24.title: "四海日不落"
 oe_cel.24.desc: "天朝分设于域外的都护府如今已遍及六大战区，从东海群岛到西域沙漠，再到遥远大洋彼岸，处处皆有奉旨开府的汉唐遗风再现。无论日出还是日落之处，皆有诸邦臣民奉行天子正朔，真正成就了日月所照、莫非王土的盛世气象。"
 oe_cel.24.a: "日月所照，莫非王土"
 oe_cel.25.title: "五户丝折钞与行省改流朝议"
 oe_cel.25.desc: "中书省奏请整顿投下分地赋役：一议循「镇藩不治藩」旧制，由行省代征民赋并折钞发放「五户丝」岁赐，保留宗王投下名分而不损其尊；一议乘国势鼎盛，折钞赎买投下分地、彻底改流为行省直辖常规藩属。"
 oe_cel.25.a: "五户丝折钞·镇藩不治藩"
 oe_cel.25.b: "废投下收归行省"
 oe_cel.26.title: "旧港宣慰司与满剌加敕封"
 oe_cel.26.desc: "南洋海峡风帆如织。旧港与满剌加既入天朝声教，商舶往来南海与西洋皆须经此咽喉。朝廷可颁敕印立镇国山碑、广开市舶，或增设都护水师补给站以控扼海峡。"
 oe_cel.26.a: "颁敕印立碑，广开南洋市舶"
 oe_cel.26.b: "增设都护水师补给站"
 oe_cel.27.title: "宝船抵古里与锡兰立碑"
 oe_cel.27.desc: "巨型宝船穿越季风抵达西洋大港古里与锡兰山。使团依汉、泰米尔、波斯三语勒石立碑，布施香火、与印度洋岸邦互市通好，将天朝市舶声威直推印度洋西岸。"
 oe_cel.27.a: "立三语碑，与西洋诸邦互市通好"
 oe_cel.27.b: "精绘西洋针经海图"
 oe_cel.28.title: "哈密卫与西域丝路羁縻驿传"
 oe_cel.28.desc: "哈密、吐鲁番与喀什噶尔绿洲重通天朝驿道。驼队载着丝绸、玉石与药材往来关内外，朝廷可立羁縻驿站固守丝路通途，或专收贡道关市银税充实内帑。"
 oe_cel.28.a: "立哈密卫驿站，畅通丝路贡道"
 oe_cel.28.b: "抽分西域贡道市税"
 oe_cel.29.title: "奴儿干都司永宁寺立碑"
 oe_cel.29.desc: "钦差官军沿松花江、黑龙江巡抵奴儿干与宁古塔，于特林崖畔勒立永宁寺碑，宣慰东北诸部、开置驿站与皮毛马市，使白山黑水长奉天朝正朔。"
 oe_cel.29.a: "勒石永宁寺，巡边羁縻黑水诸卫"
 oe_cel.29.b: "广开东北皮毛马市"
 oe_cel.30.title: "召还亲王·留京宿卫"
 oe_cel.30.desc: "外镇亲王奉诏卸甲归京，于午门丹陛前捧圭入觐。朝廷赐京师王府奉朝请、留京宿卫，既消外藩拥兵自重之患，亦彰骨肉恩礼。"
 oe_cel.30.a: "赐京师王府，奉朝请宿卫中枢"
 oe_cel.30.b: "厚赐金帛以慰宗室人心"
 oe_cel.90.title: "【读数】天朝四海 2.0"
 oe_cel.90.desc_header: "v12.0 天朝日不落 2.0 读数（0 主线槽位）："
 oe_cel.90.desc_not_emperor: "\n· 本国没有执掌天命，以下各项不适用。"
