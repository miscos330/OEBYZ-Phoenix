# NEW 2026-11-22 v11.2 Worker 4 (oe_cel_). Generated by gen_v112_celestial_events.py; edit the generator, not this file.
 oe_cel.1.title: "天命所归"
 oe_cel.1.desc: "天命在我。朝廷依本朝的制度设[ROOT.GetCountry.Custom('GetCelestialCourtBureau')]统御藩属，以[ROOT.GetCountry.Custom('GetCelestialDecreeStyle')]号令天下。宗藩、羁縻与四海都护，从此各有名分。"
 oe_cel.1.a: "承续正统"
 oe_cel.2.title: "投下宗王请升大兀鲁思"
 oe_cel.2.desc: "一位投下宗王上表，请以其份地升为大兀鲁思，位在诸王之上。许之则宗王感恩用命；不许，他难免怨望。"
 oe_cel.2.a: "准其所请"
 oe_cel.2.b: "不许"
 oe_cel.3.title: "塞王出镇"
 oe_cel.3.desc: "本朝第一位宗室亲王就藩。亲王有护卫甲士，可为朝廷屏藩；但护卫太盛，日后也可能尾大不掉。"
 oe_cel.3.a: "厚其护卫，以固边防"
 oe_cel.3.b: "薄其兵权，以防不测"
 oe_cel.4.title: "亲藩受封"
 oe_cel.4.desc: "开国功臣与宗室受封为王，各镇一方。他们手握重兵，平乱得力；朝廷也须留心，不让封王成为割据的开端。"
 oe_cel.4.a: "倚为屏藩"
 oe_cel.4.b: "恩威并用，徐图裁抑"
 oe_cel.5.title: "客帝定鼎之问"
 oe_cel.5.desc: "我们并非中原旧主，如今却执掌天命。朝野都在观望：新朝会全盘接受天朝制度，还是保留本国法统？可以在决议中作出抉择。"
 oe_cel.5.a: "容后定夺"
 oe_cel.6.title: "[ROOT.GetCountry.Custom('GetCelestialCrisisName')]"
 oe_cel.6.desc: "朝廷下令削藩，藩王拒不奉诏，传檄各地，指斥朝中奸臣离间骨肉。是发兵讨伐，是夺其护卫、徐徐图之，还是收回成命？"
 oe_cel.6.a: "发兵讨伐"
 oe_cel.6.b: "夺其护卫，徐徐图之"
 oe_cel.6.c: "收回成命"
 oe_cel.7.title: "平藩告成"
 oe_cel.7.desc: "抗命的藩王已被平定，天下再无人敢轻视朝廷的号令。"
 oe_cel.7.a: "天下一统"
 oe_cel.8.title: "裂土妥协"
 oe_cel.8.desc: "朝廷终究没能制服藩王，只得听其自处。藩国俨然敌体，朝廷的威信大不如前。"
 oe_cel.8.a: "忍一时之辱"
 oe_cel.9.title: "藩王薨逝"
 oe_cel.9.desc: "一位藩王去世了。按惯例由其子嗣继承封国；朝廷也可以乘此机会收回封号，只留一个寻常的附庸。"
 oe_cel.9.a: "许其子嗣续封"
 oe_cel.9.b: "乘机收回封号"
 oe_cel.10.title: "出镇亲王身故"
 oe_cel.10.desc: "奉命出镇的宗室亲王在任上去世，灵柩将归葬故里。"
 oe_cel.10.a: "厚加赙赠"
 oe_cel.10.b: "依例办理"
 oe_cel.11.title: "[ROOT.GetCountry.Custom('GetCelestialDuhuTitle')]开府"
 oe_cel.11.desc: "朝廷在远方设府置官，颁给印信。自此号令可达异域，探索所得与天子共享。"
 oe_cel.11.a: "威德远被"
 oe_cel.12.title: "三洲开府"
 oe_cel.12.desc: "天朝的都护府已遍及三大战区。四夷宾服，天下之势初成。"
 oe_cel.12.a: "天下之势初成"
 oe_cel.13.title: "[ROOT.GetCountry.Custom('GetCelestialPacifierTitle')]授印"
 oe_cel.13.desc: "地方首领受印称臣，世守其土，按期入贡。朝廷不改其俗，只要它不生事端。"
 oe_cel.13.a: "因俗而治"
 oe_cel.14.title: "土司抗流"
 oe_cel.14.desc: "改土归流的消息传开，世袭的土司与头人聚众相抗，声言祖宗之地不可夺。"
 oe_cel.14.a: "发兵镇压"
 oe_cel.14.b: "加意安抚"
 oe_cel.15.title: "改流告成"
 oe_cel.15.desc: "一处羁縻之地改设流官，编户纳粮，与内地无异。"
 oe_cel.15.a: "与内地一体"
 oe_cel.16.title: "雷霆郡县"
 oe_cel.16.desc: "朝廷一举废除土司、设立郡县。新附之地人心未定，需要镇抚，也需要赈济。"
 oe_cel.16.a: "驻兵镇抚"
 oe_cel.16.b: "蠲免赋役，发粟赈济"
 oe_cel.17.title: "[ROOT.GetCountry.Custom('GetCelestialCourtBureau')]会盟"
 oe_cel.17.desc: "各羁縻宣慰司与土司的首领齐集会盟，重申名分，领受赏赐。边地暂得安宁。"
 oe_cel.17.a: "恩威并著"
 oe_cel.18.title: "治国大辩论"
 oe_cel.18.desc: "朝中为治国之道争论不休：一派主张[ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')]，一派主张[ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]。天子的取舍，将定下一代人的风气。"
 oe_cel.18.a: "取[ROOT.GetCountry.Custom('GetCelestialIdeologyLeft')]"
 oe_cel.18.b: "取[ROOT.GetCountry.Custom('GetCelestialIdeologyRight')]"
 oe_cel.19.title: "大辩论定论"
 oe_cel.19.desc: "争论渐息，朝野接受了天子的裁断。"
 oe_cel.19.a: "定于一尊"
 oe_cel.20.title: "天命衰微"
 oe_cel.20.desc: "天命衰微，灾异频仍。藩属私下议论：天子是否还配得上这个位子？"
 oe_cel.20.a: "祭天修德"
 oe_cel.20.b: "流言不足为虑"
 oe_cel.21.title: "宝船四海通商"
 oe_cel.21.desc: "朝廷改行宝船通商之策。巨舶扬帆，远及异域，万国商旅辐辏而来。"
 oe_cel.21.a: "扬帆四海"
 oe_cel.22.title: "丝路双凤，东西共主"
 oe_cel.22.desc: "罗马人的皇帝成了天朝的天子。丝路两端的两个帝国，如今同奉一人为主。君士坦丁堡与中原的使者相向而行，在途中相遇。"
 oe_cel.22.a: "东西共主"
 oe_cel.23.title: "扶桑遇新罗马"
 oe_cel.23.desc: "扶桑的都护府传来消息：大洋彼岸已有罗马人立国，自称极乐洲新罗马。跨过两大洋而来的两个帝国，在新大陆相遇了。"
 oe_cel.23.a: "遣使通好"
 oe_cel.24.title: "四海日不落"
 oe_cel.24.desc: "天朝的都护府已遍及六大战区。无论日出日落之处，皆有奉天子正朔者。"
 oe_cel.24.a: "日月所照，莫非王土"
 oe_cel.90.title: "【读数】天朝四海"
 oe_cel.90.desc_header: "v11.2 天朝四海读数（0 主线槽位）："
 oe_cel.90.desc_not_emperor: "\n· 本国没有执掌天命，以下各项不适用。"
 oe_cel.90.desc_track: "\n· 轨道编号 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_track_value')|0]#!（1 大元 2 大明汉家 3 大清满洲 4 汉字圈 5 域外）；官署 #Y [ROOT.GetCountry.Custom('GetCelestialCourtBureau')]#!；危机名 #Y [ROOT.GetCountry.Custom('GetCelestialCrisisName')]#!"
 oe_cel.90.desc_override_on: "\n· 轨道测试覆盖：#R 已开启#!"
 oe_cel.90.desc_override_off: "\n· 轨道测试覆盖：未开启"
 oe_cel.90.desc_counts: "\n· 大都护府 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_duhu_count_value')|0]#! 个，覆盖战区 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_zone_count_value')|0]#! 个；削藩热度 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_revocation_heat_value')|0]#!"
 oe_cel.90.desc_crisis_on: "\n· 削藩危机：#R 进行中#!"
 oe_cel.90.desc_crisis_off: "\n· 削藩危机：无"
 oe_cel.90.a: "关闭"
 oe_cel.90.b: "刷新"
 STATIC_MODIFIER_NAME_oe_cel_frontier_princes_mod: "塞王屏藩"
 STATIC_MODIFIER_DESC_oe_cel_frontier_princes_mod: "宗藩拥有强大的护卫，为朝廷守边。"
 STATIC_MODIFIER_NAME_oe_cel_guards_stripped_mod: "护卫被夺"
 STATIC_MODIFIER_DESC_oe_cel_guards_stripped_mod: "朝廷逐步削去了这位藩王的护卫。"
 STATIC_MODIFIER_NAME_oe_cel_fiefs_subdued_mod: "平藩余威"
 STATIC_MODIFIER_DESC_oe_cel_fiefs_subdued_mod: "平定叛藩之后，无人敢轻视朝廷。"
 STATIC_MODIFIER_NAME_oe_cel_fiefs_defiant_mod: "裂土之耻"
 STATIC_MODIFIER_DESC_oe_cel_fiefs_defiant_mod: "朝廷没能制服藩王，威信受损。"
 STATIC_MODIFIER_NAME_oe_cel_gtgl_resistance_mod: "土司抗流"
 STATIC_MODIFIER_DESC_oe_cel_gtgl_resistance_mod: "改流激起了土司的反抗。"
 STATIC_MODIFIER_NAME_oe_cel_ideology_left_mod: "治国之道：集权与教化"
 STATIC_MODIFIER_DESC_oe_cel_ideology_left_mod: "天子在大辩论中选择了重集权、重教化的一派。"
 STATIC_MODIFIER_NAME_oe_cel_ideology_right_mod: "治国之道：变通与实务"
 STATIC_MODIFIER_DESC_oe_cel_ideology_right_mod: "天子在大辩论中选择了重变通、重实务的一派。"
 STATIC_MODIFIER_NAME_oe_cel_twin_phoenix_mod: "丝路双凤"
 STATIC_MODIFIER_DESC_oe_cel_twin_phoenix_mod: "一位君主同时执掌罗马与天朝的法统。"
 STATIC_MODIFIER_NAME_oe_cel_sun_never_sets_mod: "四海日不落"
 STATIC_MODIFIER_DESC_oe_cel_sun_never_sets_mod: "天朝的都护府遍及六大战区。"
