 oe_emd.11.t: "法马古斯塔的御缰"
 oe_emd.11.desc_lgp: "#F 1372年秋，塞浦路斯新王在法马古斯塔加冕为耶路撒冷国王，热那亚人和威尼斯人为谁执御马的右缰争执不下，演成了巷战。此后热那亚的舰队开来，城门据说是为谈判而开的，法马古斯塔就此落入热那亚人手里。次年的和约把法马古斯塔留给了热那亚，国王付了巨额赔款，国王的叔父雅克也被押往热那亚。不到十年前，塞浦路斯国王劫掠亚历山大，本意之一就是让东方的商路改走这座港口。#!\n\n如今，法马古斯塔归了热那亚。东地中海最富的港口落进了加拉塔那些热那亚人的同胞手里；塞浦路斯还要付赔款、交人质，威尼斯人咽不下这口气。加拉塔的热那亚人也在庆祝。听说热那亚人正与皇子暗中往来。"
