 oe_emd.3.desc_b: "#F 1386年，米尔恰继位为瓦拉几亚君侯。多瑙河是公国与奥斯曼人之间唯一的屏障，南岸由谁做主，北岸的君侯向来不肯袖手旁观。#!\n\n如今，[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的人马正渡过多瑙河，去帮[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]争夺王位；[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]的势#Y +10#!。帝国押的正是此人，多瑙河彼岸多了一位同道。"
