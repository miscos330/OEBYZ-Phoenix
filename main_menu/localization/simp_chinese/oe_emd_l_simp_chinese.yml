 oe_emd.2.t: "罗维纳的消息"
 oe_emd.2.desc_lhc: "#F 1386年，米尔恰继位为瓦拉几亚君侯；1395年3月，君侯在布拉索夫与匈牙利国王西吉斯蒙德结盟。苏丹巴耶济德渡过多瑙河来攻，两军在阿尔杰什河一带交战，日期有1394年秋、1395年5月两说。随苏丹出战的塞尔维亚领主马尔科战死；至于谁胜谁负，各家说法不一。#!\n\n如今，多瑙河北岸传来消息：[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]挡住了苏丹，奥斯曼大军退回了河南。瓦拉几亚的使者来到京城，苏丹的耳目也在看帝国怎么说。京城正被围困，城中的人也听到了这个消息。"
 oe_emd.2.desc_lh: "#F 1386年，米尔恰继位为瓦拉几亚君侯；1395年3月，君侯在布拉索夫与匈牙利国王西吉斯蒙德结盟。苏丹巴耶济德渡过多瑙河来攻，两军在阿尔杰什河一带交战，日期有1394年秋、1395年5月两说。随苏丹出战的塞尔维亚领主马尔科战死；至于谁胜谁负，各家说法不一。#!\n\n如今，多瑙河北岸传来消息：[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]挡住了苏丹，奥斯曼大军退回了河南。瓦拉几亚的使者来到京城，苏丹的耳目也在看帝国怎么说。"
 oe_emd.2.desc_lc: "#F 1386年，米尔恰继位为瓦拉几亚君侯；1395年3月，君侯在布拉索夫与匈牙利国王西吉斯蒙德结盟。苏丹巴耶济德渡过多瑙河来攻，两军在阿尔杰什河一带交战，日期有1394年秋、1395年5月两说。随苏丹出战的塞尔维亚领主马尔科战死；至于谁胜谁负，各家说法不一。#!\n\n如今，多瑙河北岸传来消息：瓦拉几亚人没能挡住苏丹，据说苏丹在那边扶起了一位听话的君侯。逃出来的瓦拉几亚人到京城求助，苏丹的耳目也在看帝国怎么说。京城正被围困，城中的人也听到了这个消息。"
