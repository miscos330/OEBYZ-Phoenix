 oe_emd.12.a: "出一份钱，帮塞浦路斯凑国王的赎金"
 oe_emd.12.a.tt: "花费#R 2#!个月的贸易与税收收入\n塞浦路斯对帝国好感#G +25#!，持续#Y 20#!年\n塞浦路斯会记住帝国的这份情"
 oe_emd.12.b: "遣使开罗，为岛上的正教徒求宽待"
 oe_emd.12.b.tt: "花费#R 1#!个月的贸易与税收收入\n马穆鲁克对帝国好感#G +15#!，持续#Y 10#!年\n[oe_tu_patriarchate|e]#G +2#!"
 oe_emd.12.c: "派修士去岛上，安抚那里的希腊人"
 oe_emd.12.c.tt: "塞浦路斯对帝国好感#R −15#!，持续#Y 10#!年\n[oe_tu_church_parties|e]份额：静修派#Y +2#!\n[oe_tu_patriarchate|e]#G +3#!"
 oe_emd.12.d: "隔岸观火"
 oe_emd.12.d.tt: "帝国不插手这件事"
 oe_emd.13.t: "摩里亚的新娘"
 oe_emd.13.desc_nt: "#F 希罗基蒂亚之后，塞浦路斯年年向开罗纳贡。吕西尼昂家的国王历来在拉丁人的王族和贵族里择偶，岛上的臣民却大半是守东方教会礼仪的希腊人。据说1440年秋，塞浦路斯国王约翰二世的第一位妻子、出身蒙费拉托巴列奥略家族的王后去世，国王要再娶。1442年2月，摩里亚专制公狄奥多二世之女海伦娜在尼科西亚的圣索菲亚主教堂嫁给国王，据说那天海伦娜刚满十四岁。#!\n\n如今，塞浦路斯王室派人来到京城，想为[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_groom').GetCharacter.GetFirstNameWithNoTooltip]从皇族里求娶一位公主。宫中适龄的是[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_bride_c').GetCharacter.GetFirstNameWithNoTooltip]，今年#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_emd_bride_c').GetCharacter.GetAgeInYears]#!岁。皇族人丁单薄，宫里再没有第二位公主了。"
