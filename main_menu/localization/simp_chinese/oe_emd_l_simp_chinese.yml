 oe_emd.1.t: "圣山上的瓦拉几亚金币"
 oe_emd.1.desc_las: "#F 瓦拉几亚君侯尼古拉·亚历山大在世时，开始大笔资助圣山的库特卢穆修道院。1364年11月君侯去世，院长哈里同转而向继位的弗拉迪斯拉夫求助；新君开出的条件是：自己与院长同列“创建人”，并让瓦拉几亚修士入住。1369年秋，瓦拉几亚又送来一笔大额捐赠。据说修士尼科迪姆也从圣山北上，在君侯支持下到多瑙河以北修建修道院。#!\n\n如今，[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的使者带着金币来到京城：瓦拉几亚愿意出钱扩建圣山的修道院，只求让本国修士入住，并把君侯列为创建人。圣山在帝国治下，此事要皇帝点头。翁格罗瓦拉几亚的都主教由我们的牧首祝圣，君侯的请求更不好回绝。"
 oe_emd.1.desc_la: "#F 瓦拉几亚君侯尼古拉·亚历山大在世时，开始大笔资助圣山的库特卢穆修道院。1364年11月君侯去世，院长哈里同转而向继位的弗拉迪斯拉夫求助；新君开出的条件是：自己与院长同列“创建人”，并让瓦拉几亚修士入住。1369年秋，瓦拉几亚又送来一笔大额捐赠。据说修士尼科迪姆也从圣山北上，在君侯支持下到多瑙河以北修建修道院。#!\n\n如今，[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的使者带着金币来到京城：瓦拉几亚愿意出钱扩建圣山的修道院，只求让本国修士入住，并把君侯列为创建人。圣山在帝国治下，此事要皇帝点头。"
