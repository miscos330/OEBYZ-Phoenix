 oe_emd.12.t: "希罗基蒂亚"
 oe_emd.12.desc_n: "#F 1424年9月，马穆鲁克的舰队第一次登上塞浦路斯，焚掠了莱梅索斯；1425年夏又来了四十艘船，法马古斯塔的热那亚总督向苏丹称臣，拉纳卡和莱梅索斯遭劫。1426年7月，一百多艘船第三次来攻；7月7日，塞浦路斯军在希罗基蒂亚溃败，国王雅努斯被俘，押往开罗，拉纳卡和尼科西亚遭劫。据说岛上的希腊农民趁乱起事，奉一个叫阿莱克西斯的人为王。国王在开罗被关了约十个月，付了二十万第纳尔的赎金，又答应年年纳贡，才得以回国；据说国王回到帕福斯的那天，阿莱克西斯被处死。#!\n\n如今，马穆鲁克人在塞浦路斯大获全胜，塞浦路斯王国向开罗低了头：要凑一大笔赎金，往后还得年年纳贡。岛上的希腊人望向君士坦丁堡；亚历山大、安条克和耶路撒冷的三位牧首也都在这位苏丹治下，帝国怎么表态，开罗都看在眼里。"
