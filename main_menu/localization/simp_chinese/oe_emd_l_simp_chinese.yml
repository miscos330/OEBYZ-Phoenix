 oe_emd.3.t: "多瑙河彼岸的岳父"
 oe_emd.3.desc_nb: "#F 安卡拉之后，随苏丹一同被俘的王子穆萨获释。1409年前后，穆萨渡过黑海进入鲁米利亚，与瓦拉几亚君侯米尔恰结盟；据说君侯还把女儿嫁给了这位王子。1411年，穆萨打败了据有鲁米利亚的兄长，随后兵临君士坦丁堡。#!\n\n如今，[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的人马正渡过多瑙河，去帮[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]争夺王位；[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]的势#Y +10#!。帝国押的正是此人，多瑙河彼岸多了一位同道。"
 oe_emd.3.desc_n: "#F 安卡拉之后，随苏丹一同被俘的王子穆萨获释。1409年前后，穆萨渡过黑海进入鲁米利亚，与瓦拉几亚君侯米尔恰结盟；据说君侯还把女儿嫁给了这位王子。1411年，穆萨打败了据有鲁米利亚的兄长，随后兵临君士坦丁堡。#!\n\n如今，[GetCountry('WAL').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的人马正渡过多瑙河，去帮[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]争夺王位；[GetCountry('BYZ').MakeScope.GetVariable('oe_emd_pr').GetCharacter.GetFirstNameWithNoTooltip]的势#Y +10#!。帝国并没有押此人，得想想怎么应对。"
