# NEW 2026-11-24 v26.1 WP15-3 Ming Historical Gap Arcs & 15 Curated East Asian Landmarks (oe_wfm_, gen_v261_wanfang_ming_landmarks.py) — 0 vanilla overrides, 0 oe_pmng overlap, G09/G12/G_ELR_ISOLATION compliant. Edit gen_v261_wanfang_ming_landmarks.py, not this file.
 STATIC_MODIFIER_NAME_oe_wfm_mod_border_princes:0 "洪武九塞王屏藩北疆"
 STATIC_MODIFIER_DESC_oe_wfm_mod_border_princes:0 "燕、晋、秦、宁诸塞王分镇长城沿线，极大强化北疆御敌防务与军伍传统，然藩王拥兵自重亦略分中枢皇权。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_central_commissions:0 "五军都督府直统边卫"
 STATIC_MODIFIER_DESC_oe_wfm_mod_central_commissions:0 "节制藩王护卫并由五军都督府轮调将领直统边卫，稳固皇权与地方控驭，唯招致宗室勋贵不满。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_jianwen_reduction:0 "建文宽政与急进削藩"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jianwen_reduction:0 "采齐泰、黄子澄之议雷厉削藩并礼遇文臣，提升内阁行政与中枢皇权，然骤然触动宗室勋贵生变之心。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_princely_compromise:0 "渐进恩抚宗藩岁禄"
 STATIC_MODIFIER_DESC_oe_wfm_mod_princely_compromise:0 "以丰厚宗禄换取塞王渐次交还兵权，缓和朝野张力并安抚贵族阶层，然朝廷常年岁禄支出大增。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingnan_scholars:0 "靖难平息·文官清流主政"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingnan_scholars:0 "建文朝廷守住金陵大统，翰林清流主持国政、文教科研蔚然成风，但北方边防军费维系愈发吃力。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingnan_regency:0 "靖难定鼎·北军勋武执政"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingnan_regency:0 "历经靖难血战的北方精骑与勋武大将入主中枢，大明军纪与陆军士气显著提振，唯儒林清流心存芥蒂且军费偏高。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_literati_amnesty:0 "宽释清流·安抚江南士林"
 STATIC_MODIFIER_DESC_oe_wfm_mod_literati_amnesty:0 "宽免抗命清流并延揽江南宿儒入值翰林，抚平靖难创伤、光大文脉稳定朝局，唯帝王威慑略逊于铁腕清洗。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_iron_orthodoxy:0 "严刑立威与建州羁縻整编"
 STATIC_MODIFIER_DESC_oe_wfm_mod_iron_orthodoxy:0 "严峻法度震慑朝堂并整编建州卫所羁縻秩序，中枢控驭与皇权大增，却令士林寒心、清议受损。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_grand_coordinators:0 "仁宣巡抚定制·统筹三司"
 STATIC_MODIFIER_DESC_oe_wfm_mod_grand_coordinators:0 "简派重臣巡抚各省、统筹布政按察都司三司事权，内阁效能与地方控制稳步提升，唯巡抚衙门公费相应增加。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_three_commissions:0 "循守祖制·三司分权制衡"
 STATIC_MODIFIER_DESC_oe_wfm_mod_three_commissions:0 "恪守洪武三司分立祖制以防地方督抚专权，节省官俸、稳固税入与法度，然跨司应急协调稍显迟缓。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_renxuan_recuperation:0 "仁宣之治·宽赋息民"
 STATIC_MODIFIER_DESC_oe_wfm_mod_renxuan_recuperation:0 "罢停远征糜费、蠲免江南重赋并充实预备仓，海内呈现仁宣承平繁庶气象，唯远洋商贸拓展暂缓。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_maritime_readiness:0 "保留龙江船政·海疆常备"
 STATIC_MODIFIER_DESC_oe_wfm_mod_maritime_readiness:0 "在休养生息之余保留龙江船厂技艺与巡海图册，维系远洋航贸效率与水师传统，需常年拨银维护船政。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_tumu_emergency:0 "土木惊变·死守京师紧急动员"
 STATIC_MODIFIER_DESC_oe_wfm_mod_tumu_emergency:0 "大驾蒙尘之际力排南迁浮议、急调勤王之师死守京师，防务与动员韧性剧增，唯全国厌战情绪随之攀升。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_tumu_retrenchment:0 "南储转运·收缩边防"
 STATIC_MODIFIER_DESC_oe_wfm_mod_tumu_retrenchment:0 "紧急南迁府库并收缩塞外前哨以保全江南税基与朝局稳定，然天朝北疆威望大受折损。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_yu_qian_camps:0 "于谦团营新军与京师保卫战"
 STATIC_MODIFIER_DESC_oe_wfm_mod_yu_qian_camps:0 "兵部尚书于谦拣选京营精锐合编团营、于德胜门外血战却敌，大明军纪、守城防务与陆军传统大振，军饷耗费亦增。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_capital_militia:0 "京畿民壮与卫所轮戍"
 STATIC_MODIFIER_DESC_oe_wfm_mod_capital_militia:0 "广征北直隶与山东卫所军余充实京畿防线，兵源与城防维护宽裕，唯仓促征调之师纪律略逊常备精营。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_southern_palace_truce:0 "优礼南宫·兄弟释嫌"
 STATIC_MODIFIER_DESC_oe_wfm_mod_southern_palace_truce:0 "以尊礼优待归朝太上皇，安抚勋贵旧臣并缓和朝堂猜忌，然两宫并立亦暗分天子独断之权。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingtai_centralization:0 "景泰独断·严防南宫"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingtai_centralization:0 "严密南宫宿卫并倚重景泰文武重臣整肃中枢，皇权与内阁效率上升，却令旧勋贵与外戚怨望暗生。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_tianshun_restoration:0 "天顺复辟·勋戚重掌朝纲"
 STATIC_MODIFIER_DESC_oe_wfm_mod_tianshun_restoration:0 "英宗复登大宝、恢复正统血脉正朔并封赏夺门勋戚，皇室正统与贵族满意回升，然冤杀于谦致京营改革受挫。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingtai_continuity:0 "粉碎夺门·景泰新政续统"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingtai_continuity:0 "于谦团营及时护驾挫败夺门密谋，景泰改革内阁与新军体制得以完整延续，唯遭保守勋贵长年掣肘。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_martial_exams:0 "首开武举·文武并重"
 STATIC_MODIFIER_DESC_oe_wfm_mod_martial_exams:0 "定制三年一科武举乡会试，广纳天下通晓兵法弓马之才出任将弁，陆军传统与士气稳步提升，唯科场公费略增。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_humane_rites:0 "诏废宫妃殉葬·仁政垂范"
 STATIC_MODIFIER_DESC_oe_wfm_mod_humane_rites:0 "毅然颁诏永废洪武以来宫妃殉葬旧俗，天下士民感念天子仁德、正统与威望俱增，仅触动极少数泥古宗室。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_wokou_crackdown:0 "朱纨铁腕清剿双屿走私"
 STATIC_MODIFIER_DESC_oe_wfm_mod_wokou_crackdown:0 "严厉捣毁双屿海商巢穴并肃清海禁私船，沿海封锁与守御强化，却令东南豪商大族受损不满。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_coastal_accommodation:0 "东南海商权宜羁縻"
 STATIC_MODIFIER_DESC_oe_wfm_mod_coastal_accommodation:0 "默许东南沿海商帮自行疏通海路以安抚市井，海贸效率与市民满意回升，但偏远海湾中枢控制力随之下降。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_hu_zongxian_intel:0 "胡宗宪东南经略·谍战分化"
 STATIC_MODIFIER_DESC_oe_wfm_mod_hu_zongxian_intel:0 "总督胡宗宪巧施反间招抚并统筹浙直兵饷，未战先分化汪直徐海诸部，内阁调度与军心大振，唯密谍开销不菲。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_coastal_fort_chain:0 "浙闽沿海卫所堡寨锁链"
 STATIC_MODIFIER_DESC_oe_wfm_mod_coastal_fort_chain:0 "沿浙闽海岸广筑卫所堡寨与烽燧联防，有效迟滞倭寇突袭并降低守城耗费，但近海航运周转受到掣肘。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_yu_dayou_fleet:0 "俞大猷「俞龙」福船水师"
 STATIC_MODIFIER_DESC_oe_wfm_mod_yu_dayou_fleet:0 "名将俞大猷广造高大坚固的福船战舰与火攻舟师，决胜闽广外洋令贼船闻风丧胆，唯水师常备维养耗银颇巨。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_estuary_watch:0 "江口哨船与港汊巡防"
 STATIC_MODIFIER_DESC_oe_wfm_mod_estuary_watch:0 "以轻捷哨船严密布防长江、钱塘与闽江口，保障内河安宁与水军士气，然商船查验稽留略损商税。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_pacific_customs:0 "东南靖海·通市弭盗新章"
 STATIC_MODIFIER_DESC_oe_wfm_mod_pacific_customs:0 "借靖海大捷顺势以通市代严禁，化私商为纳税良贾，东南海贸效率与商容大增，唯海防戒备略趋松弛。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_iron_coast_guard:0 "东南铁壁海防常备制"
 STATIC_MODIFIER_DESC_oe_wfm_mod_iron_coast_guard:0 "于浙闽粤常设海防水师并严核海船照验，彻底断绝倭患死灰复燃，唯沿海商帮深感管制森严。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_river_emergency:0 "黄河夺淮·紧急堵口赈济"
 STATIC_MODIFIER_DESC_oe_wfm_mod_river_emergency:0 "急调官银粮米堵口抢险并赈济江淮灾民，稳住粮产与地方秩序，但岁入税效短期承压。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_canal_bypass:0 "开凿运河避黄新渠"
 STATIC_MODIFIER_DESC_oe_wfm_mod_canal_bypass:0 "新开越河避开黄河泥沙淤塞段，力保大运河南粮北运畅通与工商业运转，唯繁重河工徭役令乡农疲惫。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_pan_jixun_hydraulics:0 "潘季驯束水攻沙·蓄清刷黄"
 STATIC_MODIFIER_DESC_oe_wfm_mod_pan_jixun_hydraulics:0 "河道总督潘季驯加固高家堰并筑缕堤遥堤，行蓄清刷黄、束水攻沙奇策，淮扬粮产、繁荣与漕运大兴，需常年拨银岁修。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_multi_branch_diversion:0 "分黄导淮·多支泄洪方略"
 STATIC_MODIFIER_DESC_oe_wfm_mod_multi_branch_diversion:0 "开挖多支引河分流黄淮洪峰，减轻百姓筑堤苦役并保障农收，唯支流分散略降地方集中管治效率。"
 STATIC_MODIFIER_NAME_oe_wfm_mod_landmark_patronage:0 "工部营造·名胜奇观兴修诏"
 STATIC_MODIFIER_DESC_oe_wfm_mod_landmark_patronage:0 "敕命工部统筹巧匠、画师与水利名家修缮营造中华及东亚传世名胜，彰显礼乐文华与营造工艺，唯宫廷常年工费相应增加。"
 oe_wfm_bld_forbidden_city:0 "北京紫禁城·太和殿御苑"
 oe_wfm_bld_forbidden_city_desc:0 "雄峙北京（大都）中轴之巅的皇城宫阙，重檐鎏金与汉白玉须弥座尽显天朝礼制气象，稳固都城控驭并光大文华威仪。"
 oe_wfm_bld_porcelain_tower:0 "南京大报恩寺琉璃塔"
 oe_wfm_bld_porcelain_tower_desc:0 "矗立南京（上元）秦淮之滨的九层五彩琉璃宝塔，昼映云霞、夜悬明灯，乃明代官窑烧造技艺与江南繁华之绝世丰碑。"
 oe_wfm_bld_yuelu_academy:0 "长沙岳麓书院"
 oe_wfm_bld_yuelu_academy_desc:0 "坐落长沙岳麓山下的千年理学重镇，号称「惟楚有材，于斯为盛」，极大提振湖湘识字率、思潮传布与儒林传统。"
 oe_wfm_bld_dujiangyan:0 "成都都江堰水利枢纽"
 oe_wfm_bld_dujiangyan_desc:0 "扼守岷江出山口（灌州）的无坝引水千古水利工程，鱼嘴分水、飞沙堰排沙、宝瓶口引流，永保天府成都平原沃野丰收。"
 oe_wfm_bld_potala_palace:0 "拉萨布达拉宫"
 oe_wfm_bld_potala_palace_desc:0 "依拉萨玛布日山凌空而起的雪域宫堡圣殿，红白宫墙巍峨庄严，融汇藏传佛学典籍传承、高原守御与雪域文脉威仪。"
 oe_wfm_bld_confucius_temple:0 "曲阜孔庙·衍圣公府"
 oe_wfm_bld_confucius_temple_desc:0 "巍然屹立山东曲阜的天下文庙祖庭与衍圣公府，历代天子崇祀不绝，乃华夏礼乐正统与东亚儒学文脉的精神中枢。"
 oe_wfm_bld_lingqu_canal:0 "桂林兴安灵渠"
 oe_wfm_bld_lingqu_canal_desc:0 "穿行桂林兴安的千年南北水运奇观，铧嘴分湘入漓、贯通长江与珠江两大水系，极大便利岭南漕粮商旅与中枢通达。"
 oe_wfm_bld_jiayuguan:0 "嘉峪关·天下第一雄关"
 oe_wfm_bld_jiayuguan_desc:0 "雄踞河西肃州戈壁与祁连雪山之间的明长城西端首关，三重城楼瓮城铁壁锁钥西域丝路，大幅强化边防守御与驻军韧性。"
 oe_wfm_bld_mogao_caves:0 "敦煌莫高窟千佛洞"
 oe_wfm_bld_mogao_caves_desc:0 "开凿于沙州鸣沙山东麓的千佛石窟艺术宝库，壁画彩塑与藏经洞卷帙绵延千载，见证丝绸之路东西文明交融互鉴。"
 oe_wfm_bld_quanzhou_citong:0 "泉州刺桐港·清净寺"
 oe_wfm_bld_quanzhou_citong_desc:0 "名扬四海的刺桐港（晋江）商埠与百年花岗岩清净古寺，汇聚番舶市舶与闽南海商，显著提升本地商容、贸易枢纽力与海权存在。"
 oe_wfm_bld_chengde_resort:0 "承德避暑山庄·热河行宫"
 oe_wfm_bld_chengde_resort_desc:0 "建于燕山塞外宜兴州（热河）的皇家园林行宫，兼融江南水景与漠北围场气象，乃朝廷会盟蒙古诸王、怀柔边疆之政治重地。"
 oe_wfm_bld_gyeongbokgung:0 "汉城景福宫"
 oe_wfm_bld_gyeongbokgung_desc:0 "背倚北岳山雄峙汉城（南京）的朝鲜法宫正殿，集贤殿与勤政殿见证训民正音与半岛数百年儒家礼治文明。"
 oe_wfm_bld_thang_long:0 "升龙皇城"
 oe_wfm_bld_thang_long_desc:0 "镇守红河三角洲的升龙千年皇城，文庙科举与重城砖垒并立，是大越王朝维系中枢权威与抵御外侮的坚固核心。"
 oe_wfm_bld_osaka_castle:0 "大坂城天守阁"
 oe_wfm_bld_osaka_castle_desc:0 "屹立摄津淀川入海口的巨石城郭与金箔天守，既控扼畿内水陆险要，又坐拥日本列岛最繁盛的米市商埠。"
 oe_wfm_bld_angkor_wat:0 "吴哥窟圣殿与蓄水池"
 oe_wfm_bld_angkor_wat_desc:0 "莲花宝塔巍然矗立于广袤巴莱蓄水渠之间的吴哥石窟圣殿，融汇中南半岛古典石雕艺术与季风稻作水利之大成。"
 oe_wfm_dec_imperial_landmarks_patronage.title:0 "敕命工部兴修东亚传世名胜"
 oe_wfm_dec_imperial_landmarks_patronage.desc:0 "敕令工部统筹天下名匠、石工与水利宿儒，修缮营造我国治下之中华及东亚传世名胜古迹。消耗 #Y 150#! 金币，获得持续 25 年的文化与营造赞助修正。"
 oe_wfm_dec_imperial_landmarks_patronage.a:0 "颁行工部名胜营造诏书"
 oe_wfm.1.t:0 "洪武分封九塞王"
 oe_wfm.1.d:0 "残元铁骑犹在塞外伺机南窥，大明朝堂遂议边防长策。若行分封九塞王之制，令燕、晋、秦、宁诸王携重兵出镇北平、太原、西安与大宁，可借天潢贵胄屏藩长城；然老成大臣亦忧藩王拥兵日久，他日恐成尾大不掉之患。"
 oe_wfm.1.a:0 "分封九塞王出镇长城要冲"
 oe_wfm.1.b:0 "严守五军都督府直统边卫之制"
 oe_wfm.2.t:0 "建文即位与急进削藩"
 oe_wfm.2.d:0 "洪武创业元勋渐凋，北方诸塞王雄踞边镇、护卫精强，俨然与中枢分庭抗礼。太常寺卿黄子澄与兵部尚书齐泰力劝新君当机立断、雷厉削藩以固中央；亦有稳健廷臣请行缓图厚禄之策，以免逼反强藩。"
 oe_wfm.2.a:0 "采齐黄之议，雷厉削夺诸藩兵权"
 oe_wfm.2.b:0 "以厚禄恩抚诸王，徐图收归护卫"
 oe_wfm.3.t:0 "靖难之役·国祚抉择"
 oe_wfm.3.d:0 "削藩急令终致烽烟四起，北平燕师以「清君侧」为名挥师南下，与应天朝廷大军激战于淮泗大运河沿线。大明正值国祚转折关头：究系北方久经沙场之勋武势力入主中枢，抑或金陵儒林文官守住大统？"
 oe_wfm.3.a:0 "北军靖难定鼎，重塑大明尚武新朝"
 oe_wfm.3.b:0 "力守长江天堑，保住建文儒林朝廷"
 oe_wfm.4.t:0 "方孝孺拒草诏与建州卫所整编"
 oe_wfm.4.d:0 "靖难兵戈初歇，朝廷旋即面对南北两重考验：江南大儒方孝孺宁死不肯草拟即位诏书，天子须在宽释士林以安文心与铁腕立威之间定夺；与此同时，辽东边外建州女真诸部内附请封，亦须妥定卫所羁縻格局。"
 oe_wfm.4.a:0 "宽释方孝孺与江南清流，以恩信羁縻建州"
 oe_wfm.4.b:0 "严刑确立正朔威权，严密辽东建州卫所管控"
 oe_wfm.5.t:0 "仁宣之治与巡抚制度定型"
 oe_wfm.5.d:0 "历经永乐朝连年北伐与大兴土木，内阁「三杨」杨士奇、杨荣、杨溥辅佐朝纲，力主由开边转向内治。三杨上疏请将钦差巡抚定制化，以统筹各省布政、按察、都司三司事权，化解地方推诿积弊。"
 oe_wfm.5.a:0 "定制各省巡抚，统筹三司振肃吏治"
 oe_wfm.5.b:0 "循守洪武三司分立祖制，节减衙门耗费"
 oe_wfm.6.t:0 "仁宣休养生息与海疆备御"
 oe_wfm.6.d:0 "户部黄册奏报，连年北伐与远洋船队耗银巨万，江南重赋与沿边驿传渐显疲态。文臣力请减赋息民、充实常平仓以铸就仁宣盛世；东南水师宿将则恳请保留龙江船政技艺与海图，勿使大明海权一朝废弛。"
 oe_wfm.6.a:0 "蠲免江南重赋，充实预备仓与民生休养"
 oe_wfm.6.b:0 "保留龙江船厂工匠与海疆巡哨常备"
 oe_wfm.7.t:0 "正统十四年·土木堡惊变"
 oe_wfm.7.d:0 "居庸关外急报如雷贯耳：仓促北征之大军在土木堡遭草原铁骑合围溃败，边镇震动、京师门户洞开！朝堂上一时人心惶惶，竟有大臣倡议南迁金陵以避锋芒；危急存亡之际，兵部侍郎于谦挺身厉声斥责南迁之议，请以死社稷之志固守北京。"
 oe_wfm.7.a:0 "力挺于谦：言南迁者可斩，誓死固守北京！"
 oe_wfm.7.b:0 "暗移府库银粮南储，收缩防线待机反攻"
 oe_wfm.8.t:0 "景泰监国与于谦北京保卫战"
 oe_wfm.8.d:0 "景泰帝朱祁钰临危登极，委任于谦总督京师防务。于谦急运通州漕粮入城、列阵德胜门外以神机火炮击退瓦剌铁骑，战后更力主挑选三大营精锐合编「团营」常备新军，一扫宣德以来京营废弛积弊。"
 oe_wfm.8.a:0 "采于谦之策，常设团营精锐护卫京师"
 oe_wfm.8.b:0 "广调北直隶与山东卫所军余轮番戍守"
 oe_wfm.9.t:0 "太上皇归朝与南宫暗潮"
 oe_wfm.9.d:0 "京师既安、瓦剌无奈送还太上皇朱祁镇，然旧主居于南宫、新君坐镇大内，两宫并立遂成景泰朝最隐微的政治暗礁。关于南宫仪节与东宫储位之争日渐白热，勋贵旧臣与景泰新贵各怀心思。"
 oe_wfm.9.a:0 "优礼南宫、以孝悌公开安抚旧臣勋贵"
 oe_wfm.9.b:0 "严密南宫宿卫，稳固景泰朝廷中枢威权"
 oe_wfm.10.t:0 "景泰八年·夺门之变"
 oe_wfm.10.d:0 "景泰八年春寒未褪，代宗病重不能视朝。大将石亨、内官曹吉祥与副都御史徐有贞乘夜率甲士撞开南宫铁门，拥太上皇朱祁镇复登奉天殿，史称「夺门之变」。黎明将至，紫禁城内外剑拔弩张：究系天顺复辟既成定局，抑或于谦团营及时勤王护驾？"
 oe_wfm.10.a:0 "天顺复辟既成，英宗重登大宝"
 oe_wfm.10.b:0 "于谦团营迅速平乱，粉碎夺门密谋"
 oe_wfm.11.t:0 "诏废宫妃殉葬与首开武举"
 oe_wfm.11.d:0 "历经土木惊变与宫廷波澜，中明朝廷终以两项垂范后世的德政与新制开启新章：其一，正式定制三年一科「武举」以广纳兼通韬略弓马的良将；其二，毅然颁诏永废洪武以来残酷的宫妃殉葬旧俗，海内士民莫不称颂。"
 oe_wfm.11.a:0 "定制天下武举，广纳通晓韬略之将才"
 oe_wfm.11.b:0 "颁诏永废宫妃殉葬，以仁德礼制垂范天下"
 oe_wfm.12.t:0 "嘉靖东南倭寇起：双屿风波"
 oe_wfm.12.d:0 "严苛海禁与勃兴的东亚白银贸易剧烈碰撞，以徽商汪直等海商豪强为首、兼募东瀛浪人的武装走私集团盘踞舟山双屿等外海岛屿，走私受阻遂化商为盗，浙直闽广沿海州县烽烟骤起。"
 oe_wfm.12.a:0 "支持巡抚朱纨铁腕捣毁双屿走私巢穴"
 oe_wfm.12.b:0 "暗中疏通东南海商豪族，缓和沿海冲突"
 oe_wfm.13.t:0 "胡宗宪总督东南：抚剿并用"
 oe_wfm.13.d:0 "东南倭患蔓延浙直腹地，新任总督胡宗宪统筹全局，上呈「抚剿并用、以贼攻贼」之方略：一方面密遣谋士离间汪直、徐海诸部，一方面整合江南粮饷军械，为陆海决战奠定胜局。"
 oe_wfm.13.a:0 "拨银支持胡宗宪密谍分化与全线统筹"
 oe_wfm.13.b:0 "先于浙闽沿海广筑卫所堡寨联防固守"
 oe_wfm.14.t:0 "俞大猷「俞龙」水师与闽广清剿"
 oe_wfm.14.d:0 "陆上练兵渐见奇功之际，宿将俞大猷力陈「海上防倭当以大船制小船」：请兵部广造高大坚固、配备火炮火器的福建福船巨舰，以「俞龙」水师决胜南澳与闽广外洋，彻底截断倭寇海上根基。"
 oe_wfm.14.a:0 "敕造俞大猷重型福船水师，决胜外洋"
 oe_wfm.14.b:0 "以轻捷哨船严守江河港汊与近海要冲"
 oe_wfm.15.t:0 "东南靖海终局：通市弭盗"
 oe_wfm.15.d:0 "历经浙闽粤十余载陆海苦战，东南大股倭寇终告荡平。然久历海疆的督抚重臣皆言「市通则寇转为商，市禁则商转为寇」：朝廷唯有于通市征税与常备海防间定下长治久安之法，方能永绝东南海患。"
 oe_wfm.15.a:0 "顺势通市抽分，化私商为纳税良贾"
 oe_wfm.15.b:0 "常设铁壁海防水师，严核海船户籍照验"
 oe_wfm.16.t:0 "黄河夺淮与漕运淤塞危机"
 oe_wfm.16.d:0 "黄河连年携沙淤高河床，南决入淮之势愈演愈烈！浊浪倒灌洪泽湖，不仅危及凤阳皇陵与江淮农田，更令维系京师命脉的大运河徐淮河段频频淤阻，南粮北运危在旦夕。"
 oe_wfm.16.a:0 "急拨国库官银堵口抢险，赈济江淮灾区"
 oe_wfm.16.b:0 "开凿越河新渠避黄保漕，力保粮船北上"
 oe_wfm.17.t:0 "潘季驯《河防一览》：束水攻沙"
 oe_wfm.17.d:0 "四任总理河道的治河大师潘季驯进呈《河防一览》，痛陈历来分流泄洪致水缓沙停之弊，提出千古奇策「以堤束水，以水攻沙；蓄清刷黄」：高筑高家堰蓄积清澈淮水，配合缕堤遥堤约束黄河水势，借急流自刷河床泥沙直入大海。"
 oe_wfm.17.a:0 "全面施行潘季驯高家堰与束水攻沙大工"
 oe_wfm.17.b:0 "改行多支分流泄洪，以纾江淮百姓徭役"
