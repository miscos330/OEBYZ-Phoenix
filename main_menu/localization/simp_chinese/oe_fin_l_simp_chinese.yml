# NEW 2026-11-22 v16.5 Module 16.5-B: Sovereign Finance, Central Banks & Speculative Bubble Disaster (oe_fin_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v165_finance_twilight.py; edit the generator, not this file.
 oe_fin_speculative_bubble_crash: "投机泡沫与主权债务崩盘"
 oe_fin_speculative_bubble_crash_desc: "失控的股份投机、纸币信用过度扩张与利滚利的主权战债引爆了灾难性的金融崩盘。保证金追缴令商业信贷骤然枯竭，国债利率飙升，储户围堵交易所挤兑实银。唯有推行央行准备金稽核、金银稳定法案与财政整顿，方可重建近代信用秩序。"
 oe_fin_cab_issue_sovereign_bonds: "发行主权永久公债"
 oe_fin_cab_issue_sovereign_bonds_desc: "命内阁财政重臣在交易所承销主权永久统一公债，显著压低银行与公债利率、扩大举债上限并提高税收效率，代价是带来轻微通胀压力与贵族阶层微怨。"
 oe_fin_cab_issue_sovereign_bonds_action: "$oe_fin_cab_issue_sovereign_bonds$"
 oe_fin_cab_issue_sovereign_bonds_active: "正在发行主权永久公债"
 oe_fin_cab_issue_sovereign_bonds_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('bond_interest')]"
 oe_fin_cab_issue_sovereign_bonds_action_progress_wordier: "主权永久公债发行中"
 oe_fin_cab_issue_sovereign_bonds_action_progress_long_wordier: "主权永久公债承销进行中"
 oe_fin_cab_issue_sovereign_bonds_action_progress_tooltip: "降低银行与国债利率、提升举债容量与税效，同时缓步推升通胀与市场投机热度。"
 oe_fin_cab_central_bank_audit: "央行金银储备核查"
 oe_fin_cab_central_bank_audit_desc: "派遣内阁稽核专员清查中央银行金银库存与票据贴现账簿，大幅压制月度通胀、拓宽安全铸币阈值、持续冷却泡沫热度并推进金融危机善后，代价是略微削减铸币与短期贸易收益。"
 oe_fin_cab_central_bank_audit_action: "$oe_fin_cab_central_bank_audit$"
 oe_fin_cab_central_bank_audit_active: "正在开展央行金银储备核查"
 oe_fin_cab_central_bank_audit_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('monthly_inflation')]"
 oe_fin_cab_central_bank_audit_action_progress_wordier: "央行金银储备核查中"
 oe_fin_cab_central_bank_audit_action_progress_long_wordier: "央行金银储备专项核查进行中"
 oe_fin_cab_central_bank_audit_action_progress_tooltip: "稽核央行金银储备，压低月度通胀与借贷利率、冷却投机泡沫热度并稳固主权信用。"
 oe_fin_player_only_tt: "由人类玩家控制"
 oe_fin_consol_cd_tt: "过去15年内未曾发行永久统一公债"
 oe_fin_bullion_cd_tt: "过去12年内未曾颁布金银本位稳定法案"
 oe_fin_dec_charter_central_bank.title: "特许设立主权中央银行"
 oe_fin_dec_charter_central_bank.desc: "特许设立国家中央银行，统管国库金银准备金与公债发行，长久夯实国家信用并显著降低投机泡沫崩盘风险。"
 oe_fin_dec_charter_central_bank.a: "颁授主权中央银行特许状"
 oe_fin_dec_charter_central_bank_tt: "斥资250杜卡特使泡沫热度下降#G -18#!，推进危机稳定进程，并获得持续40年的“主权中央银行特许章程”修正。"
 oe_fin_dec_issue_consol_bonds.title: "发行永久统一公债"
 oe_fin_dec_issue_consol_bonds.desc: "在国内外交易所发行新一期永久主权统一公债，即时筹措充沛国库流动资金，并在未来十五年间优化债息与借贷容量。"
 oe_fin_dec_issue_consol_bonds.a: "挂牌发行永久统一公债"
 oe_fin_dec_issue_consol_bonds_tt: "筹得受限主权现银（150至900杜卡特），增加#R +12#!投机热度，并获得持续15年的“永久主权统一公债”修正（冷却15年）。"
 oe_fin_dec_bullionist_stabilization.title: "颁布金银本位稳定法案"
 oe_fin_dec_bullionist_stabilization.desc: "强制规定流通纸券须有足额金银准备金支撑并回笼投机浮券，显著压低通胀、冷却泡沫热度并推进债务崩盘危机解决。"
 oe_fin_dec_bullionist_stabilization.a: "正式颁布金银本位稳定法案"
 oe_fin_dec_bullionist_stabilization_tt: "耗费180杜卡特压降通胀、削减泡沫热度#G -25#!、推进稳定步骤，并获得持续15年的“金银本位稳定法案”修正（冷却12年）。"
 STATIC_MODIFIER_NAME_oe_fin_mod_central_bank_charter: "主权中央银行特许章程"
 STATIC_MODIFIER_DESC_oe_fin_mod_central_bank_charter: "国家特许中央银行统管金银准备金、贴现商业票据并稳定国债信用，令王朝在战时与平时皆可稳健筹资。"
 STATIC_MODIFIER_NAME_oe_fin_mod_perpetual_consols: "永久主权统一公债"
 STATIC_MODIFIER_DESC_oe_fin_mod_perpetual_consols: "将短期高息战债整合为可自由流通的永久统一公债，大幅降低展期风险并吸引四海资本认购。"
 STATIC_MODIFIER_NAME_oe_fin_mod_bullionist_act: "金银本位稳定法案"
 STATIC_MODIFIER_DESC_oe_fin_mod_bullionist_act: "强制实行足额金银准备与季度金库稽核，重塑纸币兑付信心并有效遏制过度投机。"
 STATIC_MODIFIER_NAME_oe_fin_mod_joint_stock_fever: "官商股份集资热潮"
 STATIC_MODIFIER_DESC_oe_fin_mod_joint_stock_fever: "交易所巷口人潮涌动，商民竞相认购官商特许股份，为港口与工场注入充沛资本，亦暗埋投机躁动。"
 STATIC_MODIFIER_NAME_oe_fin_mod_overseas_equity_boom: "远洋公司股票盛世"
 STATIC_MODIFIER_DESC_oe_fin_mod_overseas_equity_boom: "远洋特许公司丰厚分红推高股价，令航海股份成为钱庄、咖啡馆经纪与大商号竞相追逐的硬通抵押品。"
 STATIC_MODIFIER_NAME_oe_fin_mod_paper_credit_expansion: "纸币信用扩张"
 STATIC_MODIFIER_DESC_oe_fin_mod_paper_credit_expansion: "汇票与银行券的广泛流通令商业流动性远超国库实存铸币，推动工商业加速运转。"
 STATIC_MODIFIER_NAME_oe_fin_mod_speculative_euphoria: "交易所投机狂热"
 STATIC_MODIFIER_DESC_oe_fin_mod_speculative_euphoria: "自贵族沙龙至码头酒肆，人人借贷炒作期货与股权，一夜暴富的神话背后暗藏崩盘惊雷。"
 STATIC_MODIFIER_NAME_oe_fin_mod_margin_call_shock: "追缴保证金与信贷冻结"
 STATIC_MODIFIER_DESC_oe_fin_mod_margin_call_shock: "经纪商为补足杠杆亏空竞相抛售抵押资产，致使商业信贷骤然枯竭，大批商货滞留港区。"
 STATIC_MODIFIER_NAME_oe_fin_mod_bourse_panic_run: "交易所挤兑风潮"
 STATIC_MODIFIER_DESC_oe_fin_mod_bourse_panic_run: "恐慌储户蜂拥围堵票号与钱庄，要求将贬值纸券兑回白银，令公私信用濒临冰点。"
 STATIC_MODIFIER_NAME_oe_fin_mod_austerity_retrenchment: "紧急财政紧缩整顿"
 STATIC_MODIFIER_DESC_oe_fin_mod_austerity_retrenchment: "大幅裁撤宫廷冗费并严守债息偿付，虽招致各阶层怨声载道，却成功将王朝拉离违约悬崖。"
 STATIC_MODIFIER_NAME_oe_fin_mod_bullion_suspension: "紧急停止金银兑付"
 STATIC_MODIFIER_DESC_oe_fin_mod_bullion_suspension: "危机期间暂停纸币兑付金银保住了最后库存，却也令市面流通券被迫折价交易。"
 STATIC_MODIFIER_NAME_oe_fin_mod_lender_last_resort: "央行最后贷款人机制"
 STATIC_MODIFIER_DESC_oe_fin_mod_lender_last_resort: "中央银行以惩罚性利率向持有优良抵押品的商号敞开再贴现窗口，成功止住挤兑连锁反应。"
 STATIC_MODIFIER_NAME_oe_fin_mod_sinking_fund: "法定国债偿债基金"
 STATIC_MODIFIER_DESC_oe_fin_mod_sinking_fund: "将专项关税盈余固定划入偿债基金逐年削减本金，令王朝在各国金融市场赢得头等信用。"
 STATIC_MODIFIER_NAME_oe_fin_mod_bond_syndicate_access: "国际公债承销财团"
 STATIC_MODIFIER_DESC_oe_fin_mod_bond_syndicate_access: "跨国银团联手承销本国主权公债，将发行网络铺向欧洲与地中海诸大金融中心，大幅压低融资成本。"
 STATIC_MODIFIER_NAME_oe_fin_mod_war_bond_subscription: "爱国战争公债认购"
 STATIC_MODIFIER_DESC_oe_fin_mod_war_bond_subscription: "市民、行会与地方城镇踊跃认购战时国债，将举国同仇敌忾化作源源不断的军需后勤。"
 STATIC_MODIFIER_NAME_oe_fin_mod_exchange_regulation: "崩盘后交易所监管法"
 STATIC_MODIFIER_DESC_oe_fin_mod_exchange_regulation: "通过强制审计特许章程、限制杠杆保证金与公开账簿，有效杜绝空壳投机同时护航实体贸易。"
 STATIC_MODIFIER_NAME_oe_fin_mod_modern_credit_order: "近代主权信用金融秩序"
 STATIC_MODIFIER_DESC_oe_fin_mod_modern_credit_order: "成熟的中央银行、深厚的国债市场与透明的财政预算铸就持久信用优势，使帝国免受投机泡沫崩盘侵扰。"
 STATIC_MODIFIER_NAME_oe_fin_mod_currency_distrust: "纸币信用动摇危机"
 STATIC_MODIFIER_DESC_oe_fin_mod_currency_distrust: "商贾窖藏实银并对无准备金国库券索要高额贴水，令国家税收与商业互信同步受损。"
 oe_fin.101.title: "官商股份集资热潮"
 oe_fin.101.desc: "大商号与宫廷金融家联名请愿，请求设立享有国家特许权的股份公司。认购额度在数小时内售罄，巨额资本涌入交易所，在刺激商贸腾飞的同时也推升了市场投机热度。"
 oe_fin.101.a: "批准广开认购，特许设立官商股份公司"
 oe_fin.101.b: "施加严格章程审计与准备金门槛"
 oe_fin.102.title: "远洋公司股票盛世"
 oe_fin.102.desc: "远洋特许船队满载香料、茶叶与白银凯旋，交易所股价翻倍飙升。贵族、市民乃至小吏纷纷抵押田产与积蓄，只为抢购一份海外贸易股权。"
 oe_fin.102.a: "扩大远洋特许权，尽享分红盛世"
 oe_fin.102.b: "开征资本利得税以充实国库准备金"
 oe_fin.103.title: "纸币信用大扩张"
 oe_fin.103.desc: "领衔银行家提议以未来税入为担保，大规模发行不记名银行券与可流通国库券。纸币信用能以远胜铸币的速度激活工商业与军备筹资，但一旦失控便会诱发通胀风暴。"
 oe_fin.103.a: "授权广泛发行银行券，全面激活信贷增长"
 oe_fin.103.b: "将每张纸券严格锚定于金库金银实储"
 oe_fin.104.title: "交易所投机狂热"
 oe_fin.104.desc: "郁金香合约、南海年金与密西西比土地股票在交易所飙出天价。小册子作家嘲笑稳健派杞人忧天，经纪商更将每一枚金币加上十倍杠杆。财政顾问警告：只要一笔分红落空，狂欢便会瞬间炸裂。"
 oe_fin.104.a: "放任市场狂飙，趁高位抛售王室配股"
 oe_fin.104.b: "严控杠杆期货交易，强行给交易所降温"
 oe_fin.105.title: "追缴保证金恐慌"
 oe_fin.105.desc: "投机泡沫轰然破裂！一家领头远洋公司未能按期派息，股价在午钟敲响前断崖式暴跌。经纪商四处砸门追缴保证金，破产财团拖垮清算银行，主权国债收益率瞬间飙升。"
 oe_fin.105.a: "宣布紧急清算展期并启动金融稳定方案"
 oe_fin.105.b: "任由投机者破产清算，死守王室金库"
 oe_fin.106.title: "交易所大挤兑"
 oe_fin.106.desc: "黎明未至，数以千计的恐慌储户便堵满交易所与贴现所门前大道，挥舞纸券高喊兑付实银。卫兵在铁门前严阵以待，破产谣言正席卷整个京师。"
 oe_fin.106.a: "开库拨付应急白银以平息挤兑人潮"
 oe_fin.106.b: "关闭交易所铁闸并调派城防民兵戒严"
 oe_fin.107.title: "主权违约悬崖"
 oe_fin.107.desc: "利滚利的债务本息已吞噬惊人比例的年度税入。外国债主拒绝展期到期军债，除非王室典押海关税权或立即推行雷厉风行的财政紧缩。"
 oe_fin.107.a: "推行紧急紧缩，全额恪守每一笔债息"
 oe_fin.107.b: "单方面对债权人实行强制减息"
 oe_fin.108.title: "紧急暂停金银兑付"
 oe_fin.108.desc: "金银铸币不断外流至海外口岸，中央金库存底已跌至警戒线。财政委员会激辩是否暂停现金兑付以待贸易回暖——此举虽会招致通胀，却可避免金库彻底见底。"
 oe_fin.108.a: "暂行停止金银兑付以保全金库底仓"
 oe_fin.108.b: "加征应急关税死守金银本位兑付"
 oe_fin.109.title: "中央银行最后贷款人"
 oe_fin.109.desc: "正当大批经营稳健的商号面临突发性流动性枯竭之际，中央银行董事提议果断履行最后贷款人职责：以严谨的惩罚性利率，凭优质商业票据敞开提供紧急再贴现。"
 oe_fin.109.a: "敞开央行贴现窗口，救助偿付健全的商号"
 oe_fin.109.b: "仅限救助国家军械与粮饷核心承运商"
 oe_fin.110.title: "国家公共债务整合"
 oe_fin.110.desc: "数十笔期限杂乱、利率悬殊的短期借款、包税预付款与地方欠条令国库疲于奔命。财政改革派提议将其全部整并为统一透明、公开交易的永久国债。"
 oe_fin.110.a: "将全部旧债整并为统一永久公债"
 oe_fin.110.b: "动用国库现银直接赎回高息包税契约"
 oe_fin.111.title: "法定国债偿债基金"
 oe_fin.111.desc: "财政大臣呈上法定偿债基金方案：每季固定拨付盈余，在公开市场回购并注销国债本金，以此稳固债券市价并为后世大幅压低举债利率。"
 oe_fin.111.a: "设立不可挪用的法定偿债基金"
 oe_fin.111.b: "保持盈余机动以备海防与边警之急"
 oe_fin.112.title: "纸币信用动摇危机"
 oe_fin.112.desc: "伪钞泛滥与国库超发重创纸币公信力。铺户纷纷挂出双套价牌——现银一价，纸券暴涨——若不果断挽回信用，市面交易恐将全面瘫痪。"
 oe_fin.112.a: "按面额回收贬值纸钞并公开销毁超发票券"
 oe_fin.112.b: "颁布严刑法令强制商民按面额收受官钞"
 oe_fin.113.title: "国际公债承销财团"
 oe_fin.113.desc: "横跨阿姆斯特丹、伦敦、热那亚与君士坦丁堡的跨国银团主动提出承销我国主权公债，将本国财政信用直接接入全球资本市场。"
 oe_fin.113.a: "以透明条款接纳国际银团联合承销"
 oe_fin.113.b: "限定国债仅由本国阶层与行会认购"
 oe_fin.114.title: "爱国战争公债认购"
 oe_fin.114.desc: "面对列强博弈与飙升的舰队及炮兵军费，朝廷推出小面额爱国战争公债。行会、军官与市井百姓在市政厅外排起长队，踊跃认购以支援国家防务。"
 oe_fin.114.a: "全国开放爱国战争公债认购名册"
 oe_fin.114.b: "配套设立战后专项偿还税以稳固债信"
 oe_fin.115.title: "崩盘后金融监管改革"
 oe_fin.115.desc: "历经投机风波后的冷静反思中，法学家与财政学者起草全面交易所监管法案：强制审计资产负债表、取缔空壳泡沫公司，并将商业存款与高风险股权承销严格隔离。"
 oe_fin.115.a: "颁布严格交易所监管与公开审计法令"
 oe_fin.115.b: "依托商界董事会实行宽松自律监管"
 oe_fin.116.title: "近代主权信用金融秩序"
 oe_fin.116.desc: "历经繁荣、恐慌与制度淬炼，我国中央银行、永久公债市场与公开审计预算已赢得全球无双信誉，得以远低于劲敌的利率筹建强军与近代实业。"
 oe_fin.116.a: "颁布近代主权信用金融大宪章"
 oe_fin.116.b: "将头等主权信用直接投向近代工场与舰队建设"
