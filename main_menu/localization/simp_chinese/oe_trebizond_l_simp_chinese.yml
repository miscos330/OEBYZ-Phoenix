 oe_tre.1.t: "被休的皇女"
 oe_tre.1.desc: "#F 1339年7月，特拉比松皇帝巴西尔不顾皇后伊琳娜（安德洛尼卡三世的女儿），与情妇、特拉比松人伊琳娜公开成婚。据说牧首约翰十四世站在皇后一边。#!\n\n特拉比松传来消息：巴西尔皇帝另娶了情妇，陛下的女儿[SCOPE.sCharacter('oe_tre_irene').GetName]在宫中备受冷落。这桩重婚在特拉比松和君士坦丁堡都引起了非议。"
 oe_tre.1.desc2: "#F 1339年7月，特拉比松皇帝巴西尔不顾皇后伊琳娜（安德洛尼卡三世的女儿），与情妇、特拉比松人伊琳娜公开成婚。据说牧首约翰十四世站在皇后一边。#!\n\n特拉比松传来消息：巴西尔皇帝另娶了情妇，先帝的女儿[SCOPE.sCharacter('oe_tre_irene').GetName]在宫中备受冷落。这桩重婚在特拉比松和君士坦丁堡都引起了非议。"
 oe_tre.1.a: "请牧首出面，斥其重婚"
 oe_tre.1.a.tt: "特拉比松对我们的好感#R −15#!（每年减弱#Y 3#!）\n帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.1.b: "遣使送礼，劝巴西尔回心转意"
 oe_tre.1.b.tt: "特拉比松对我们的好感#G +10#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.1.c: "不过问特拉比松的家事"
 oe_tre.1.c.tt: "帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.2.t: "特拉比松的女皇"
 oe_tre.2.desc: "#F 1340年4月巴西尔暴卒，时人疑是皇后下毒。皇后伊琳娜占住卫城，斯科拉里奥伊据守圣欧根尼修道院与之对抗。皇后把对手特拉比松人伊琳娜和巴西尔的两个儿子送到君士坦丁堡；史家或称人质，或称托付。#!\n\n[SCOPE.sCharacter('oe_tre_irene').GetName]如今是特拉比松的女皇，可城里的豪族并不服气，#bold #color_yellow 斯科拉里奥伊#!#!更是公然作对。巴西尔的遗孀和孩子们已经到了京城，住进了宫中。"
 oe_tre.2.a: "派佣兵助女皇守城"
 oe_tre.2.a.tt: "特拉比松获得[ShowModifier('oe_tre_byz_guard')]，持续#Y 24#!个月\n特拉比松对我们的好感#G +15#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.2.b: "收下人质，静观其变"
 oe_tre.2.b.tt: "巴西尔的遗孀和孩子们留在君士坦丁堡"
 oe_tre.2.c: "把孩子们当皇子抚养"
 oe_tre.2.c.tt: "帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n将来皇子回国时，帝国在特拉比松的影响另#G +10#!"
 oe_tre.3.t: "为女皇择婿"
 oe_tre.3.desc: "#F 女皇伊琳娜请父皇从拜占庭贵族中选一位丈夫。安德洛尼卡三世正筹备伊庇鲁斯的战事，没有回音；1341年，京城的摄政们选中了巴西尔的叔父米海尔·大科穆宁。#!\n\n[SCOPE.sCharacter('oe_tre_irene').GetName]的信使来到宫中：女皇需要一位镇得住豪族的丈夫，请陛下在帝国的贵族中为其择婿。可眼下伊庇鲁斯的战事正急。"
 oe_tre.3.desc2: "#F 女皇伊琳娜请父皇从拜占庭贵族中选一位丈夫。安德洛尼卡三世正筹备伊庇鲁斯的战事，没有回音；1341年，京城的摄政们选中了巴西尔的叔父米海尔·大科穆宁。#!\n\n[SCOPE.sCharacter('oe_tre_irene').GetName]的信使来到宫中：女皇需要一位镇得住豪族的丈夫，请京城的朝廷在帝国的贵族中为其择婿。"
 oe_tre.3.a: "遣米海尔·大科穆宁携三艘战船前往"
 oe_tre.3.a.tt: "帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_mich').GetName]启程前往特拉比松；能否成婚即位，要看城中局势和帝国的影响"
 oe_tre.3.b: "只送去金钱和卫队"
 oe_tre.3.b.tt: "帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n特拉比松的[ShowModifier('oe_tre_byz_guard')]延长#Y 12#!个月（没有就获得#Y 12#!个月）"
 oe_tre.3.c: "暂且搁下"
 oe_tre.3.c.tt: "帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.4.t: "城郊的大火"
 oe_tre.4.desc: "#F 1341年7月，突厥人焚烧特拉比松城郊，女皇的拜占庭佣兵不战而逃，瘟疫随之而来。巴西尔的姐姐安娜·阿纳胡特卢由拉兹人拥立，入城称帝；同月，米海尔·大科穆宁带着三艘战船赶到，当夜就被拘押。#!\n\n特拉比松城郊火光冲天，城中大乱。[SCOPE.sCharacter('oe_tre_anna').GetName]在拉兹人的拥立下入城称帝，[SCOPE.sCharacter('oe_tre_irene').GetName]失了皇位，搭一艘西方船回到君士坦丁堡。[GetCountry('BYZ').Custom('OeTreE4Mich')]"
 oe_tre.4.desc2: "#F 1341年7月，突厥人焚烧特拉比松城郊，女皇的拜占庭佣兵不战而逃，瘟疫随之而来。巴西尔的姐姐安娜·阿纳胡特卢由拉兹人拥立，入城称帝；同月，米海尔·大科穆宁带着三艘战船赶到，当夜就被拘押。#!\n\n大火过后，米海尔·大科穆宁的战船赶到，突厥人退走，豪族也收起了野心。[SCOPE.sCharacter('oe_tre_irene').GetName]与米海尔成婚，米海尔即位为特拉比松皇帝。"
 oe_tre.4.desc3: "#F 1341年7月，突厥人焚烧特拉比松城郊，女皇的拜占庭佣兵不战而逃，瘟疫随之而来。巴西尔的姐姐安娜·阿纳胡特卢由拉兹人拥立，入城称帝；同月，米海尔·大科穆宁带着三艘战船赶到，当夜就被拘押。#!\n\n大火过后，特拉比松一片狼藉，可[SCOPE.sCharacter('oe_tre_r').GetName]仍坐在皇位上：拉兹人想拥立的人已经不在了。"
 oe_tre.4.a: "迎回皇女，向新女皇抗议"
 oe_tre.4.a.tt: "特拉比松对我们的好感#R −20#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.4.b: "承认安娜"
 oe_tre.4.b.tt: "特拉比松对我们的好感#G +20#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.4.c: "暗中接济流亡的斯科拉里奥伊"
 oe_tre.4.c.tt: "特拉比松对我们的好感#R −10#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.4.d: "送去贺礼"
 oe_tre.4.d.tt: "特拉比松对我们的好感#G +20#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.4.e: "道贺即可"
 oe_tre.4.f: "送去援助，帮特拉比松重建"
 oe_tre.4.f.tt: "特拉比松对我们的好感#G +20#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.4.g: "致函慰问即可"
 oe_tre.5.t: "斯科拉里奥伊的使者"
 oe_tre.5.desc: "#F 1342年8月，尼基塔斯·斯科拉里斯等人坐威尼斯船来到君士坦丁堡，请米海尔之子约翰回国。约翰雇了三艘热那亚桨帆船，9月入城即位，安娜被勒死。史家对帝国朝廷是否公开支持此事说法不一。#!\n\n#bold #color_yellow 斯科拉里奥伊#!#!的使者到了京城。这些人不愿再奉[SCOPE.sCharacter('oe_tre_r').GetName]为主，要请[SCOPE.sCharacter('oe_tre_j3').GetName]回特拉比松即位。[GetCountry('BYZ').Custom('OeTreCw')]"
 oe_tre.5.a: "公开支持：拨给船只和士兵"
 oe_tre.5.a.tt: "帝国在特拉比松的影响#G +15#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_j3').GetName]必能入城即位（#Y 20#!天后）"
 oe_tre.5.b: "默许使者自行雇热那亚船"
 oe_tre.5.b.tt: "帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_j3').GetName]自行出发，#Y 20#!天后见分晓；成功的可能随帝国在特拉比松的影响而定（现为#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_succ_ch')|0]%#!），失败则影响#R −5#!"
 oe_tre.5.c: "扣下约翰，不放其回国"
 oe_tre.5.c.tt: "特拉比松对我们的好感#G +10#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#R −15#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_j3').GetName]留在帝国，日后可以作为特拉比松皇位的人选"
 oe_tre.6.t: "父子易位"
 oe_tre.6.desc: "#F 1344年5月，斯科拉里奥伊放出被囚的米海尔，立为皇帝，把约翰三世关进修道院；不久米海尔把儿子送到君士坦丁堡，再送到阿德里安堡看管。#!\n\n特拉比松又变了天：#bold #color_yellow 斯科拉里奥伊#!#!从利姆尼亚放出[SCOPE.sCharacter('oe_tre_mich').GetName]，立为皇帝，把[SCOPE.sCharacter('oe_tre_j3').GetName]送到了君士坦丁堡。新皇帝请我们替其看管这个儿子。"
 oe_tre.6.desc2: "#F 1344年5月，斯科拉里奥伊放出被囚的米海尔，立为皇帝，把约翰三世关进修道院；不久米海尔把儿子送到君士坦丁堡，再送到阿德里安堡看管。#!\n\n特拉比松又变了天：#bold #color_yellow 斯科拉里奥伊#!#!派人来京城迎回[SCOPE.sCharacter('oe_tre_mich').GetName]，立为皇帝，把[SCOPE.sCharacter('oe_tre_j3').GetName]送了过来。新皇帝请我们替其看管这个儿子。"
 oe_tre.6.a: "应米海尔之请，把约翰三世看管在阿德里安堡"
 oe_tre.6.a.tt: "特拉比松对我们的好感#G +15#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_j3').GetName]留在帝国"
 oe_tre.6.b: "以礼相待，留在宫中"
 oe_tre.6.b.tt: "特拉比松对我们的好感#R −10#!（每年减弱#Y 2#!）\n[SCOPE.sCharacter('oe_tre_j3').GetName]留在宫中；将来若改立此人，帝国在特拉比松的影响另#G +5#!"
 oe_tre.6.c: "向米海尔索取看管之费"
 oe_tre.6.c.tt: "特拉比松对我们的好感#R −5#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_j3').GetName]留在帝国"
 oe_tre.7.t: "热那亚人的报复"
 oe_tre.7.desc: "#F 1348年，热那亚人占了刻拉苏斯；次年5月，卡法的舰队击毁特拉比松的小舰队，大公约翰·卡巴西特斯战死。和约把莱昂托卡斯特隆让给了热那亚人。#!\n\n热那亚人与特拉比松开战，卡法的舰队击毁了特拉比松的战船。特拉比松被迫把城外的莱昂托卡斯特隆让给热那亚人（[ShowModifier('oe_tre_leonkastron')]，#Y 20#!年），来信向帝国求援。[GetCountry('BYZ').Custom('OeTreGal')]"
 oe_tre.7.a: "居间调停"
 oe_tre.7.a.tt: "特拉比松的[ShowModifier('oe_tre_leonkastron')]缩短为#Y 10#!年\n特拉比松对我们的好感#G +10#!（每年减弱#Y 2#!）\n帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.7.b: "与特拉比松同仇敌忾"
 oe_tre.7.b.tt: "特拉比松对我们的好感#G +20#!（每年减弱#Y 2#!）\n热那亚对我们的好感#R −15#!（每年减弱#Y 1#!）\n帝国在特拉比松的影响#G +10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.7.c: "隔岸观火"
 oe_tre.7.c.tt: "帝国在特拉比松的影响#R −5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）"
 oe_tre.8.t: "在君士坦丁堡长大的皇子"
 oe_tre.8.desc: "#F 1349年12月，巴西尔之子约翰从君士坦丁堡回到特拉比松，次年1月在圣欧根尼教堂加冕，改名阿莱克修斯。约翰六世·坎塔库泽诺斯出力扶其即位，为的是排除与巴列奥略家结好的米海尔父子。#!\n\n[SCOPE.sCharacter('oe_tre_cand').GetName]在京城长大，如今已经#Y [SCOPE.sCharacter('oe_tre_cand').GetAgeInYears]#!岁。特拉比松的豪族厌倦了[SCOPE.sCharacter('oe_tre_r').GetName]，派人来问：帝国肯不肯把巴西尔的儿子送回去？[GetCountry('BYZ').Custom('OeTreCourt')][GetCountry('BYZ').Custom('OeTreWards')]"
 oe_tre.8.a: "遣舰护送，并许以皇亲之女"
 oe_tre.8.a.tt: "帝国在特拉比松的影响#G +15#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_cand').GetName]在#Y 20#!天后回到特拉比松即位\n帝国为其定下一门亲事：约翰六世在位时是坎塔库泽诺斯家的狄奥多拉，否则是皇族的一位女儿；新郎满#Y 13#!岁时完婚"
 oe_tre.8.b: "让斯科拉里奥伊自己接走"
 oe_tre.8.b.tt: "帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_cand').GetName]在#Y 20#!天后回到特拉比松即位"
 oe_tre.8.c: "改立约翰三世"
 oe_tre.8.c.tt: "帝国在特拉比松的影响#G +5#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n约翰三世曾在宫中受礼遇时，影响另#G +5#!\n[SCOPE.sCharacter('oe_tre_j3').GetName]在#Y 20#!天后回到特拉比松即位，[SCOPE.sCharacter('oe_tre_cand').GetName]留在京城"
 oe_tre.8.d: "留下皇子，不插手"
 oe_tre.8.d.tt: "帝国在特拉比松的影响#R −10#!（现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!）\n[SCOPE.sCharacter('oe_tre_cand').GetName]留在京城，日后或可作为筹码；本线到此结束"
 oe_tre.9.t: "圣欧根尼的加冕"
 oe_tre.9.desc: "#F 1350年1月21日，不满十二岁的阿莱克修斯三世在圣欧根尼教堂加冕，母亲伊琳娜在场。次年，坎塔库泽诺斯家的狄奥多拉嫁给了这位少年皇帝。#!\n\n[SCOPE.sCharacter('oe_tre_alx_s').GetName]在圣欧根尼教堂加冕为特拉比松皇帝。按[oe_tu_family|e]的名分，特拉比松是帝国的“子”。[GetCountry('BYZ').Custom('OeTreTier')]我们要怎样对待这位新君？"
 oe_tre.9.a: "收为朝贡之国"
 oe_tre.9.a.tt: "特拉比松有#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_trib_ch')|0]%#!的可能接受成为我们的朝贡国，由附庸阶梯接手\n若被拒绝：特拉比松对我们的好感#R −10#!，改为结为至亲之盟"
 oe_tre.9.b: "结为至亲之盟"
 oe_tre.9.b.tt: "特拉比松对我们的好感#G +25#!（每年减弱#Y 1#!）\n我们获得[ShowModifier('oe_tre_kinship')]，持续#Y 10#!年\n没有同盟就与特拉比松结盟\n新君尚未成年：成年后可以授予[oe_tu_dignity|e]"
 oe_tre.9.c: "授予尊号"
 oe_tre.9.c.tt: "授予[SCOPE.sCharacter('oe_tre_alx_s').GetName]专制公（能授时）或首席尊者的[oe_tu_dignity|e]，按尊号的规矩花费威望和[oe_tu_authority|e]"
 oe_tre.9.d: "礼送而已"
 oe_tre.9.d.tt: "特拉比松对我们的好感#G +10#!（每年减弱#Y 2#!）"
 oe_tre.10.t: "皇子成年"
 oe_tre.10.desc: "#F 1282年，米海尔八世授特拉比松的约翰二世专制公之号，并把女儿欧多基娅许配给约翰二世。#!\n\n[SCOPE.sCharacter('oe_tre_alx_s').GetName]加冕时，我们许诺过：成年之后，帝国会授予其[oe_tu_dignity|e]。如今这位皇帝已经成年。"
 oe_tre.10.a: "授予专制公"
 oe_tre.10.a.tt: "[SCOPE.sCharacter('oe_tre_alx_s').GetName]获得专制公的[oe_tu_dignity|e]；花费#R 20#!威望、#R 8#![oe_tu_authority|e]"
 oe_tre.10.b: "授予首席尊者"
 oe_tre.10.b.tt: "[SCOPE.sCharacter('oe_tre_alx_s').GetName]获得首席尊者的[oe_tu_dignity|e]；花费#R 10#!威望、#R 4#![oe_tu_authority|e]"
 oe_tre.10.c: "作罢"
 oe_tre.10.c.tt: "特拉比松对我们的好感#R −10#!（每年减弱#Y 2#!）"
 oe_tre.11.t: "皇女之死"
 oe_tre.11.desc: "#F 史实中，伊琳娜在巴西尔死后掌权一年有余，1341年被废后回到君士坦丁堡。#!\n\n噩耗从特拉比松传来：皇女[SCOPE.sCharacter('oe_tre_irene').GetName]在特拉比松的宫变中丧生。"
 oe_tre.11.a: "要求特拉比松谢罪"
 oe_tre.11.a.tt: "特拉比松对我们的好感#R −20#!（每年减弱#Y 2#!）\n本线到此结束"
 oe_tre.11.b: "为皇女举哀，不再追究"
 oe_tre.11.b.tt: "特拉比松对我们的好感#G +10#!（每年减弱#Y 2#!）\n本线到此结束"
