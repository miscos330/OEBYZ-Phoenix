oe_character_cabinet_experience_trait_I: "初仕学步"
desc_oe_character_cabinet_experience_trait_I: "这个角色刚步入内阁任职不久，经验尚浅"
oe_character_cabinet_experience_trait_II: "略通笔墨"
desc_oe_character_cabinet_experience_trait_II: "这个角色已在内阁任职一年以上，熟悉各种官僚事务"
oe_character_cabinet_experience_trait_III: "案牍劳形"
desc_oe_character_cabinet_experience_trait_III: "这个角色在内阁任职四年以上，是内阁中处理事务的主力"
oe_character_cabinet_experience_trait_IV: "谙熟枢要"
desc_oe_character_cabinet_experience_trait_IV: "这个角色在内阁任职八年以上，能力高超，人脉通达"
oe_character_cabinet_experience_trait_V: "肱骨老臣"
desc_oe_character_cabinet_experience_trait_V: "这个角色长达十六年于内阁中任职，见证过多次官场变迁，依旧屹立不倒"

