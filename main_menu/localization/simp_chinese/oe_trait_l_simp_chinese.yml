#=====================================
#andronikosIII
#=====================================

oe_byz_andronikos_iii_I: "“明星”皇帝"
desc_oe_byz_andronikos_iii_I: "安德洛尼卡三世英俊、健谈，热爱哲学辩论与奢华宴饮，是首都民众眼中的“明星皇帝”。然而无度的欢宴与私生活，也在侵蚀他的身体和身为帝国领袖的威望。\n\n初始健康值为#Y 10#!，当前健康值：#Y [GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_andronikos_current_health')|1]#!。健康值不会自动减少，由相关事件或行动扣减。降至0时触发“皇帝病重”：东罗马正统性-10，安德洛尼卡三世去世。"
oe_byz_andronikos_iii_II: "前敌统帅"
desc_oe_byz_andronikos_iii_II: "安德洛尼卡三世常在阵中指挥，甚至亲自冲锋，擅长使用重装骑兵和突厥轻骑兵。战术体系围绕骑兵的机动性和冲击力构建\n\n安德洛尼卡三世专属军事特质，不会随机生成。"

