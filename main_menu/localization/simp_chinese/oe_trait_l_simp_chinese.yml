#=====================================

oe_rr_attach_south_ita_trait: "远征将军"
desc_oe_rr_attach_south_ita_trait: "这个角色是一场军事远征的最高领袖"

#=====================================
#JohnV
#=====================================

child_byz_john_V: "养尊处优的童年"
desc_child_byz_john_V: "约翰五世生于君士坦丁堡皇宫，物质优渥，接受标准的皇室教育（神学、古典文学、军事理论）。"
child_byz_john_V_after_1341: "被尊为正统的傀儡"
desc_child_byz_john_V_after_1341: "随着安德洛尼卡三世的暴毙，九岁的约翰五世被卷入前所未有的风暴中，残酷的政治斗争给约翰五世留下了一生的阴影"

#=====================================
#JohnVI
#=====================================

oe_byz_john_VI_bad: "夸夸其谈的作家"
desc_oe_byz_john_VI_bad: "坎塔库泽诺斯是一位高产的作家，喜欢在其作品中为自己的行为辩护，并贬低自己的对手。很不幸的是，他这些夸夸其谈的作品大多流传到了后世"

