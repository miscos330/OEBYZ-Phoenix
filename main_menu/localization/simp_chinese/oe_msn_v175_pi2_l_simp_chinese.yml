 oe_msn_mar_destiny_BUTTON_TOOLTIP:0 "开启德干与马拉塔印度洋天命"
 oe_msn_mar_destiny_BUTTON_DETAILS:0 "马拉塔（MHR）、德干（DEC）、巴赫曼尼（BAH）、孟加拉（BNG）、古吉拉特（GUJ）及1337年本土诸邦十二任务三支柱天命链：固守浦那、莱加尔、道拉塔巴德、比贾布尔与戈尔康达，驰骋巴吉尔快骑与铁管火箭战象营，执掌康坎、苏拉特与索纳尔冈，捍卫印度洋双海主权。"
 oe_msn_mar_01_sahyadri_swarajya:0 "萨亚德里与德干星火：立基自治王权"
 oe_msn_mar_01_sahyadri_swarajya_desc:0 "在马哈拉施特拉、德干、古吉拉特、奥里萨或孟加拉稳固根基，燃起自治王权与海陆中兴之火。"
 oe_msn_mar_01_sahyadri_swarajya_req_tt:0 "拥有浦那、道拉塔巴德、比贾布尔、戈尔康达、萨拉吉里、焦哈尔、索纳尔冈、苏拉特或卡塔克之一，且稳定度至少为 5。"
 oe_msn_mar_02_bargir_light_horse:0 "整编巴吉尔疾风轻骑与山堡守备军"
 oe_msn_mar_02_bargir_light_horse_desc:0 "由王库配马整编巴吉尔疾风轻骑并充实玄武岩山堡粮械，精熟游击奇袭战法。"
 oe_msn_mar_02_bargir_light_horse_req_tt:0 "持有至少 180 金币，且稳定度至少为 8。"
 oe_msn_mar_03_deccan_rocket_batteries:0 "德干铁管火箭与披甲战象炮阵"
 oe_msn_mar_03_deccan_rocket_batteries_desc:0 "将锻铁火药火箭与披甲战象、青铜野炮合编成军，以烈焰铁雨震慑敌胆。"
 oe_msn_mar_03_deccan_rocket_batteries_req_tt:0 "持有至少 240 金币，且处于地理大发现时代或之后。"
 oe_msn_mar_04_ashta_pradhan_command:0 "八大臣中枢与德干—马拉塔合成雄师"
 oe_msn_mar_04_ashta_pradhan_command_desc:0 "以严整的阿什塔·普拉丹八大臣政务院统领巴吉尔快骑与火箭重炮，称雄次大陆。"
 oe_msn_mar_04_ashta_pradhan_command_req_tt:0 "控制至少 35 个地块、稳定度至少 14，且处于宗教改革时代或之后。"
 oe_msn_mar_05_pune_raigarh_desh:0 "马哈拉施特拉核心：浦那、莱加尔与萨塔拉"
 oe_msn_mar_05_pune_raigarh_desh_desc:0 "掌控西高止山腹地名城浦那以及莱加尔或萨塔拉山堡，奠定斯瓦拉杰心脏地带。"
 oe_msn_mar_05_pune_raigarh_desh_req_tt:0 "拥有浦那，且拥有莱加尔或萨塔拉之一。"
 oe_msn_mar_06_deccan_sultanates:0 "德干高原重镇：道拉塔巴德、比贾布尔与戈尔康达"
 oe_msn_mar_06_deccan_sultanates_desc:0 "收复道拉塔巴德/比贾布尔与戈尔康达/比德尔，尽揽德干金刚钻库与重炮雄城。"
 oe_msn_mar_06_deccan_sultanates_req_tt:0 "拥有道拉塔巴德或比贾布尔之一，且拥有戈尔康达或比德尔之一。"
 oe_msn_mar_07_konkan_gujarat_seaboard:0 "阿拉伯海门户：果阿、康坎与苏拉特"
 oe_msn_mar_07_konkan_gujarat_seaboard_desc:0 "掌控果阿/孟买/达博尔海防岸线以及苏拉特或坎贝巨港，执掌西印海贸。"
 oe_msn_mar_07_konkan_gujarat_seaboard_req_tt:0 "拥有果阿、孟买或达博尔之一，拥有苏拉特或坎贝之一，且控制至少 30 个地块。"
 oe_msn_mar_08_bengal_oceanic_arc:0 "双海贯通：自阿拉伯海直抵孟加拉湾"
 oe_msn_mar_08_bengal_oceanic_arc_desc:0 "东拓至索纳尔冈、高尔或卡塔克，将阿拉伯海与孟加拉湾双翼商脉融为一体。"
 oe_msn_mar_08_bengal_oceanic_arc_req_tt:0 "拥有索纳尔冈、高尔或卡塔克之一，且处于地理大发现时代或之后。"
 oe_msn_mar_09_wootz_muslin_looms:0 "乌兹神钢、印花棉布与孟加拉轻纱工坊"
 oe_msn_mar_09_wootz_muslin_looms_desc:0 "扶持乌兹坩埚钢坊、印花棉布与轻纱织机，使全球白银源源流入本邦。"
 oe_msn_mar_09_wootz_muslin_looms_req_tt:0 "稳定度至少为 10，且处于文艺复兴时代或之后。"
 oe_msn_mar_10_hundi_monsoon_banking:0 "洪迪银号票汇与辛杜杜尔格海岛要塞"
 oe_msn_mar_10_hundi_monsoon_banking_desc:0 "以贯通全印的洪迪银号信用资助礁岛海防要塞与康坎古拉布战船坞。"
 oe_msn_mar_10_hundi_monsoon_banking_req_tt:0 "持有至少 300 金币。"
 oe_msn_mar_11_expel_company_monopolies:0 "破除西洋东印度公司海港垄断"
 oe_msn_mar_11_expel_company_monopolies_desc:0 "严申本邦海事主权并组建自主远洋舰队，令任何西洋公司休想在印度海岸颐指气使。"
 oe_msn_mar_11_expel_company_monopolies_req_tt:0 "拥有港口且稳定度至少为 15，且处于宗教改革时代或之后。"
 oe_msn_mar_12_hindavi_ocean_bastion:0 "斯瓦拉杰与印度洋永恒主权铁壁加冕"
 oe_msn_mar_12_hindavi_ocean_bastion_desc:0 "兼控高原雄城与东西双海门户，加冕傲立近代世界的南亚主权海陆帝国。"
 oe_msn_mar_12_hindavi_ocean_bastion_req_tt:0 "拥有浦那、戈尔康达或索纳尔冈之一，拥有果阿或苏拉特之一，稳定度至少 18，且处于专制时代或之后。"
