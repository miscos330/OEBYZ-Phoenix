 oe_msn_geo_11_dasturlamali_renaissance_desc:0 "瓦赫坦六世编纂《政务法典》并在第比利斯兴办格鲁吉亚首座活字印坊，将鲁斯塔韦利史诗与近代律法传布四方。结合印刷[institutions|e]与普及[literacy|e]，既优化[cabinet|e]行政，亦加速王国迈向各项[advances|e]。"
 oe_msn_geo_11_dasturlamali_renaissance_req_tt:0 "宗教改革时代起，稳定度不低于 15，接纳印刷术思潮，拥有印刷工坊或图书馆，且首都发展度不低于 22。"
 oe_msn_geo_12_crown_of_queen_tamar:0 "塔玛尔第二黄金时代辉煌加冕"
 oe_msn_geo_12_crown_of_queen_tamar_desc:0 "西起黑海峭壁、东抵里海沙岸、南望亚拉拉特雪巅，格鲁吉亚五十字旗再度高扬于媲美塔玛尔黄金时代的统一山国。依托[capital|e]极盛[prosperity|e]与崇高[legitimacy|e]，第比利斯终以不屈[great_power|e]之尊光耀欧亚。"
 oe_msn_geo_12_crown_of_queen_tamar_req_tt:0 "专制时代起，控制第比利斯、埃里温与巴库，稳定度不低于 18，首都发展度不低于 26，且为列强或商税月收入不低于 95。"
 oe_msn_jal_destiny:0 "#bold #color_yellow 后伊尔汗国波斯：巴格达与大不里士承绪天命#!#!"
 oe_msn_jal_destiny_DESCRIPTION:0 "自札剌亦儿、黑羊白羊与阿达比勒崛起迈向红巾重骑、光复霍尔木兹与伊斯法罕天下之半"
 oe_msn_jal_destiny_CRITERIA_DESCRIPTION:0 "统合巴格达、大不里士、设拉子、伊斯法罕、霍尔木兹与赫拉特的后伊尔汗国诸邦，将奇兹尔巴什铁骑锻造成近代火药王师，令伊斯法罕成为天下之半。"
 oe_msn_jal_destiny_BUTTON_TOOLTIP:0 "开启巴格达与大不里士承绪天命"
 oe_msn_jal_destiny_BUTTON_DETAILS:0 "札剌亦儿、黑羊、白羊、莫扎法尔、因朱与阿达比勒等后伊尔汗国诸邦十二任务三支柱天命链：重聚两河与伊朗高原名都，编练奇兹尔巴什重骑与后查尔迪兰火药常备军，克复霍尔木兹与呼罗珊，加冕伊斯法罕天下之半与欧亚万王之王。"
 oe_msn_jal_01_heirs_of_the_ilkhan:0 "伊尔汗承绪：定鼎两河与高原名都"
 oe_msn_jal_01_heirs_of_the_ilkhan_desc:0 "伊尔汗国四分五裂之际，率先定鼎两河沃土与伊朗高原名都，方能重振[capital|e]气象并彰显正统[crown_power|e]，令诸部埃米尔归心。重修沿途商旅驿馆与市场可使东西丝路[trade|e]再兴，为动荡已久的河山奠定长久[stability|e]。"
 oe_msn_jal_01_heirs_of_the_ilkhan_req_tt:0 "直接或通过属国控制巴格达、大不里士、设拉子、亚兹德、阿达比勒或伊斯法罕之一，稳定度至少 5，并拥有市场或驿站商馆。"
 oe_msn_jal_02_qizilbash_banners:0 "整编奇兹尔巴什重装枪骑兵"
 oe_msn_jal_02_qizilbash_banners_desc:0 "头戴十二褶红帽的土库曼重装枪骑自安纳托利亚与阿塞拜疆云集高原，誓效王旗，为帝国注入充沛[manpower|e]并淬炼铁血[army_tradition|e]。妥善协调诸部酋长与地方[estates|e]权责，方能化狂热骑射为所向披靡的攻坚重骑。"
 oe_msn_jal_02_qizilbash_banners_req_tt:0 "持有至少 180 金币与 8 稳定度，拥有城堡或兵器行会，且贵族阶层满意度至少 45%（若有）。"
 oe_msn_jal_03_tofangchi_tupchi:0 "超越查尔迪兰：托凡奇火枪与炮军革新"
 oe_msn_jal_03_tofangchi_tupchi_desc:0 "查尔迪兰的炮火警示世人，仅凭铁骑冲锋难破火阵，[army|e]必须编练托凡奇火枪手与图普奇炮兵等常备[regulars|e]。广纳火器[advances|e]并严整操典，可令帝国[army_tradition|e]与东西强邻分庭抗礼。"
 oe_msn_jal_03_tofangchi_tupchi_req_tt:0 "地理大发现时代或之后，持有至少 240 金币与 20 陆军传统，拥有铸炮厂或练兵场，且接纳职业军队思潮或解锁长矛火枪进阶。"
 oe_msn_jal_04_ghulam_zamburak_corps:0 "古拉姆王家常备军与骆驼旋炮"
 oe_msn_jal_04_ghulam_zamburak_corps_desc:0 "由内帑直养高加索古拉姆禁卫，既可使[crown_power|e]摆脱部落掣肘，又将常备[regulars|e]与机动骆驼旋炮融为一体。再配以新式边疆[fort|e]体系，高原腹心从此固若金汤，国祚[stability|e]愈加绵长。"
 oe_msn_jal_04_ghulam_zamburak_corps_req_tt:0 "宗教改革时代或之后，控制至少 35 个地块，稳定度至少 14、陆军传统至少 30，并拥有兵营或棱堡。"
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan:0 "双都合璧：巴格达与大不里士"
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan_desc:0 "巴格达扼守底格里斯河肥沃冲积平原，大不里士总控阿塞拜疆群山关隘，双城合璧堪称帝国[capital|e]枢机与稳固[core|e]基石。贯通两都驿道与商队大路必将催生都市[development|e]，令王室无上[prestige|e]远播伊斯兰诸邦。"
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan_req_tt:0 "直接或通过非主权属国同时控制巴格达与大不里士。"
 oe_msn_jal_06_fars_isfahan_shiraz:0 "波斯腹心：伊斯法罕与设拉子"
 oe_msn_jal_06_fars_isfahan_shiraz_desc:0 "自设拉子玫瑰园至伊斯法罕苍穹宝顶，波斯腹地乃帝国深化[control|e]与扎根[core|e]的命脉所在。护持绿洲巴扎与官道商旅，可令丝茶香料汇入各大[market|e]，使法尔斯处处涌现[prosperity|e]。"
 oe_msn_jal_06_fars_isfahan_shiraz_req_tt:0 "直接或通过属国控制伊斯法罕与设拉子，并拥有伊斯兰经学院或驿站商馆。"
 oe_msn_jal_07_hormuz_gulf_dominion:0 "克复霍尔木兹海峡与巴士拉海门"
 oe_msn_jal_07_hormuz_gulf_dominion_desc:0 "掌控霍尔木兹海峡与巴士拉河口，便扼住了波斯湾通往印度洋的[trade|e]咽喉，令滚滚关税化作国库[gold|e]。在海湾驻泊战船既能涵养[navy_tradition|e]，更可铸就坚不可摧的[maritime_presence|e]以御外洋舰队。"
 oe_msn_jal_07_hormuz_gulf_dominion_req_tt:0 "直接或通过属国控制霍尔木兹及巴士拉或克尔曼之一，控制至少 30 个地块，并拥有海港。"
 oe_msn_jal_08_khorasan_herat_mashhad:0 "呼罗珊东屏：马什哈德与赫拉特"
 oe_msn_jal_08_khorasan_herat_mashhad_desc:0 "呼罗珊既是抵御草原南侵的东屏，更是波斯[cultural_tradition|e]熠熠生辉的摇篮。重兵驻守赫拉特与马什哈德可巩固边疆[fort|e]与驿道[control|e]，并震慑河中诸部使沿边[subjects|e]恪守臣节。"
 oe_msn_jal_08_khorasan_herat_mashhad_req_tt:0 "地理大发现时代或之后，直接或通过属国控制马什哈德与赫拉特，并拥有城堡或驿站商馆。"
 oe_msn_jal_09_baghdad_shiraz_ateliers:0 "书画院细密画与《列王纪》文脉"
 oe_msn_jal_09_baghdad_shiraz_ateliers_desc:0 "巴格达、大不里士与设拉子的细密画师以青金石与金箔抄绘《列王纪》，令帝国[cultural_tradition|e]冠绝当世。广建书院艺馆等文化[buildings|e]可提升朝野[literacy|e]，使王室[prestige|e]播扬于德里与君士坦丁堡之间。"
 oe_msn_jal_09_baghdad_shiraz_ateliers_req_tt:0 "文艺复兴时代或之后，稳定度至少 10、首都发展度至少 22，并拥有艺术学院或抄经院。"
 oe_msn_jal_10_qanat_karkhaneh_silk:0 "坎儿井水利与皇家卡汗内丝毯官坊"
 oe_msn_jal_10_qanat_karkhaneh_silk_desc:0 "地下坎儿井引雪山融水滋养桑园，皇家卡汗内官坊则在精良[buildings|e]中织就名扬欧亚的吉兰生丝与波斯锦毯。源源不断的跨洲[trade|e]汇入白银[gold|e]，令高原诸绿洲行省尽享丰饶[prosperity|e]。"
 oe_msn_jal_10_qanat_karkhaneh_silk_req_tt:0 "持有至少 300 金币，月度贸易与税收收入至少 25，并拥有引水渠系统或丝绸生产行会。"
 oe_msn_jal_11_isfahan_nisf_e_jahan:0 "伊斯法罕：天下之半宏城告成"
 oe_msn_jal_11_isfahan_nisf_e_jahan_desc:0 "伊玛目广场四周琉璃清真寺、拱桥与长廊巴扎拔地而起，以宏大[development|e]将帝国[capital|e]铸为天下之半。广纳亚美尼亚、印度与泰西商贾汇聚[market|e]，令各行会与商帮的[estate_satisfaction|e]水涨船高。"
 oe_msn_jal_11_isfahan_nisf_e_jahan_req_tt:0 "宗教改革时代或之后，直接或通过属国控制伊斯法罕，稳定度至少 15、首都发展度至少 32，拥有艺术学院或大学，且市民阶层满意度至少 50%（若有）。"
 oe_msn_jal_12_shahanshah_eurasia:0 "万王之王：两河、伊朗与波斯湾一统"
 oe_msn_jal_12_shahanshah_eurasia_desc:0 "自底格里斯河畔至霍尔木兹海峡归于一尊，万王之王以无双[legitimacy|e]重执欧亚十字路口，跻身当世[great_power|e]。精干的帝国[cabinet|e]与与时俱进的[institutions|e]相辅相成，开启绵延百年的波斯黄金纪元。"
 oe_msn_jal_12_shahanshah_eurasia_req_tt:0 "专制主义时代或之后，直接或通过属国控制巴格达、大不里士、伊斯法罕与霍尔木兹，稳定度至少 18，且为列强或月度贸易与税收收入至少 90。"
 oe_msn_mar_destiny:0 "#bold #color_yellow 德干与马拉塔自治王权：印度洋双海铁壁天命#!#!"
 oe_msn_mar_destiny_DESCRIPTION:0 "自萨亚德里山堡与巴吉尔轻骑迈向德干火箭战象、康坎海堡、古吉拉特—孟加拉商帮与印度洋主权铁壁"
 oe_msn_mar_destiny_CRITERIA_DESCRIPTION:0 "统合德干、马哈拉施特拉、康坎、古吉拉特与孟加拉，编练巴吉尔疾风轻骑与铁管火箭战象炮队，驱逐西洋特许公司垄断，铸就屹立阿拉伯海与孟加拉湾的主权海陆铁壁。"
 oe_msn_mar_destiny_BUTTON_TOOLTIP:0 "开启德干与马拉塔印度洋天命"
 oe_msn_mar_destiny_BUTTON_DETAILS:0 "马拉塔（MHR）、德干（DEC）、巴赫曼尼（BAH）、孟加拉（BNG）、古吉拉特（GUJ）及1337年本土诸邦十二任务三支柱天命链：固守浦那、莱加尔、道拉塔巴德、比贾布尔与戈尔康达，驰骋巴吉尔快骑与铁管火箭战象营，执掌康坎、苏拉特与索纳尔冈，捍卫印度洋双海主权。"
 oe_msn_mar_01_sahyadri_swarajya:0 "萨亚德里与德干星火：立基自治王权"
 oe_msn_mar_01_sahyadri_swarajya_desc:0 "在西高止山云雾缭绕的玄武岩绝壁与德干河谷之间，斯瓦拉杰自治誓言点燃了主权[legitimacy|e]，筑稳王权[capital|e]。凭借险峻山岭[fort|e]与商市财源，新邦得以在群雄环伺中迅速夯实内部[stability|e]。"
 oe_msn_mar_01_sahyadri_swarajya_req_tt:0 "直接或通过属国控制浦那、道拉塔巴德、比贾布尔、戈尔康达、萨拉吉里、焦哈尔、索纳尔冈、苏拉特或卡塔克之一，稳定度至少 5，并拥有城堡或市场。"
 oe_msn_mar_02_bargir_light_horse:0 "整编巴吉尔疾风轻骑与山堡守备军"
 oe_msn_mar_02_bargir_light_horse_desc:0 "由王室配发战马兵甲的巴吉尔轻骑与马瓦拉山地步兵精通奇袭游击战法，在德干险关屡挫强敌并铸就[army_tradition|e]。广征山地精壮充实[manpower|e]，使这支直属[regulars|e]军团迅疾如风且摆脱世袭贵族掣肘。"
 oe_msn_mar_02_bargir_light_horse_req_tt:0 "持有至少 180 金币与 8 稳定度，拥有兵器行会或城堡，且贵族阶层满意度至少 45%（若有）。"
 oe_msn_mar_03_deccan_rocket_batteries:0 "德干铁管火箭与披甲战象炮阵"
 oe_msn_mar_03_deccan_rocket_batteries_desc:0 "以德干精炼铁管配竹尾制成的火龙火箭，与重甲战象牵引的大炮协同齐射，呼啸火雨令敌骑闻风丧胆。将本土火器[advances|e]融入实战操典，大幅革新帝国[army|e]，令[army_tradition|e]与疆场[prestige|e]俱盛。"
 oe_msn_mar_03_deccan_rocket_batteries_req_tt:0 "地理大发现时代或之后，持有至少 240 金币与 20 陆军传统，拥有铸炮厂或练兵场，且接纳职业军队思潮或解锁长矛火枪进阶。"
 oe_msn_mar_04_ashta_pradhan_command:0 "八大臣中枢与德干—马拉塔合成雄师"
 oe_msn_mar_04_ashta_pradhan_command_desc:0 "仿效八大臣合议旧制，受禄于朝的中枢[cabinet|e]将财政、司法、谍报与兵权分司统筹，显著强化[crown_power|e]。配以新式棱堡[fort|e]与常备卫戍，自高原至河谷的辽阔疆土皆稳固纳入中央[control|e]。"
 oe_msn_mar_04_ashta_pradhan_command_req_tt:0 "宗教改革时代或之后，控制至少 35 个地块，稳定度至少 14、陆军传统至少 30，并拥有兵营或棱堡。"
 oe_msn_mar_05_pune_raigarh_desh:0 "马哈拉施特拉核心：浦那、莱加尔与萨塔拉"
 oe_msn_mar_05_pune_raigarh_desh_desc:0 "高踞康坎绝壁的莱加尔鹰巢要塞与浦那、萨塔拉高原沃土唇齿相依，构成自治王权坚不可摧的[core|e]基业。在此群峰圣地登基称王既能彰显[prestige|e]、拉动城邑[development|e]，更能凝聚忠勇山地[estates|e]之心。"
 oe_msn_mar_05_pune_raigarh_desh_req_tt:0 "直接或通过非主权属国控制浦那，并控制莱加尔或萨塔拉之一。"
 oe_msn_mar_06_deccan_sultanates:0 "德干高原重镇：道拉塔巴德、比贾布尔与戈尔康达"
 oe_msn_mar_06_deccan_sultanates_desc:0 "攻克道拉塔巴德、比贾布尔与盛产名钻的戈尔康达，使整座德干高原尽入帝国[core|e]，并为国库带来丰沛[gold|e]。贯通原本割据的高原商道可重振内陆[market|e]贸易，将中央[control|e]稳固推向中印腹心。"
 oe_msn_mar_06_deccan_sultanates_req_tt:0 "直接或通过非主权属国同时控制道拉塔巴德或比贾布尔之一，以及戈尔康达或比德尔之一。"
 oe_msn_mar_07_konkan_gujarat_seaboard:0 "阿拉伯海门户：果阿、康坎与苏拉特"
 oe_msn_mar_07_konkan_gujarat_seaboard_desc:0 "越过西高止山直抵康坎海岸与古吉拉特巨港苏拉特，便将阿拉伯海的万邦[trade|e]与沿海[prosperity|e]尽收囊中。兴建本土桨帆快舰队可涵养[navy_tradition|e]，在印度洋西岸建立起令外商敬畏的[maritime_presence|e]。"
 oe_msn_mar_07_konkan_gujarat_seaboard_req_tt:0 "直接或通过属国控制果阿、孟买或达博尔之一及苏拉特或坎贝之一，控制至少 30 个地块，并拥有海港。"
 oe_msn_mar_08_bengal_oceanic_arc:0 "双海贯通：自阿拉伯海直抵孟加拉湾"
 oe_msn_mar_08_bengal_oceanic_arc_desc:0 "自苏拉特棉港东抵索纳尔冈轻纱之乡与奥里萨河口，双海贯通铸就横跨次大陆的超级[market|e]与[prosperity|e]走廊。双洋良港在握，既能吸引沿线[subjects|e]归附，更令帝国在南亚与东南亚的[diplomacy|e]举足轻重。"
 oe_msn_mar_08_bengal_oceanic_arc_req_tt:0 "地理大发现时代或之后，直接或通过属国控制索纳尔冈、高尔或卡塔克之一，并拥有至少 6 座海港。"
 oe_msn_mar_09_wootz_muslin_looms:0 "乌兹神钢、印花棉布与孟加拉轻纱工坊"
 oe_msn_mar_09_wootz_muslin_looms_desc:0 "泰伦加纳坩埚精炼的乌兹神钢、手绘德干印花棉布与轻若烟雾的孟加拉细纱，在行会[buildings|e]中源源产出并风靡欧亚。厚护匠师规章可汇聚滚滚[gold|e]，既涵养独特的[cultural_tradition|e]，又催生城镇[prosperity|e]。"
 oe_msn_mar_09_wootz_muslin_looms_req_tt:0 "文艺复兴时代或之后，稳定度至少 10、首都发展度至少 22，并拥有精纺布行会或布匹行会。"
 oe_msn_mar_10_hundi_monsoon_banking:0 "洪迪银号票汇与辛杜杜尔格海岛要塞"
 oe_msn_mar_10_hundi_monsoon_banking_desc:0 "信用卓著的洪迪银号票汇贯通印度洋季风商路，既平抑[inflation|e]波动，又为商旅周转源源不绝的[gold|e]。辛杜杜尔格与维贾亚杜尔格等海岛[fort|e]则护佑水师商船，令海商群体的[estate_satisfaction|e]大为提振。"
 oe_msn_mar_10_hundi_monsoon_banking_req_tt:0 "持有至少 300 金币，月度贸易与税收收入至少 25，并拥有码头或行会大厅。"
 oe_msn_mar_11_expel_company_monopolies:0 "破除西洋东印度公司海港垄断"
 oe_msn_mar_11_expel_company_monopolies_desc:0 "效法名将坎霍吉·安格雷的护海铁律，本土炮舰向西洋东印度公司征收主权通航税，夺回港口[trade|e]主导权。精锐[navy|e]护航既保障印度[sailors|e]生计，更令近海[maritime_presence|e]从此不容外夷染指。"
 oe_msn_mar_11_expel_company_monopolies_req_tt:0 "宗教改革时代或之后，拥有海港、稳定度至少 15、海军传统至少 20，拥有海关或造船厂，且市民阶层满意度至少 50%（若有）。"
 oe_msn_mar_12_hindavi_ocean_bastion:0 "斯瓦拉杰与印度洋永恒主权铁壁加冕"
 oe_msn_mar_12_hindavi_ocean_bastion_desc:0 "自萨亚德里山堡至苏拉特与孟加拉海口，斯瓦拉杰巍然屹立为工业与海权并盛的[great_power|e]，与西洋列强平起平坐。自主革新的[institutions|e]、崇高[legitimacy|e]与全面[development|e]，铸就永不沦落殖民之手的独立印度。"
 oe_msn_mar_12_hindavi_ocean_bastion_req_tt:0 "专制主义时代或之后，直接或通过属国控制浦那、戈尔康达或索纳尔冈之一及果阿或苏拉特之一，稳定度至少 18，且为列强或月度贸易与税收收入至少 90。"
