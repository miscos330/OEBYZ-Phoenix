 oe_msn_geo_07_shirvan_caspian_gates:0 "希尔万丝港：巴库与杰尔宾特铁门"
 oe_msn_geo_07_shirvan_caspian_gates_desc:0 "顺库拉河东进控制沙马基丝坊、巴库商港与萨珊古墙杰尔宾特铁门，彻底锁住里海西岸走廊。将希尔万纳为[core|e]既大兴东方[trade|e]、充实国库[gold|e]，更把草原南下咽喉的[control|e]握于手中。"
 oe_msn_geo_07_shirvan_caspian_gates_req_tt:0 "控制巴库以及杰尔宾特或沙马基之一（可经由附庸），自身及附庸地点不少于 22 处，且拥有商队驿站或市场。"
