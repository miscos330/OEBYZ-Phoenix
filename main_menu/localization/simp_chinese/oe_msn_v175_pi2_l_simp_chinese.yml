 oe_msn_geo_destiny_CRITERIA_DESCRIPTION:0 "自黑海至里海统合卡尔特利、伊梅列季、萨姆茨赫、亚美尼亚与希尔万，编练赫夫苏尔山地卫队并筑堡垒修道院防线力抗东西强邻，加冕高加索第二黄金时代。"
 oe_msn_geo_destiny_BUTTON_TOOLTIP:0 "开启高加索巴格拉季昂天命"
 oe_msn_geo_destiny_BUTTON_DETAILS:0 "格鲁吉亚与高加索十二任务三支柱天命链：统合第比利斯、库塔伊西、埃里温、巴库与杰尔宾特，以萨德罗肖军区与赫夫苏尔山地重装卫队铸就险隘铁壁，贯通黑海—里海生丝美酒商道与新朱尔法商汇，再现塔玛尔女王黄金盛世。"
 oe_msn_geo_01_brilliant_recovery:0 "光辉者中兴：稳固高加索山国根基"
 oe_msn_geo_01_brilliant_recovery_desc:0 "趁伊儿汗国瓦解之机挣脱蒙古贡赋，光辉者乔治五世在库拉河谷重申王法并重建饱经战火的山城。修缮城镇[buildings|e]既重振河谷[development|e]与国家[stability|e]，更令巴格拉季昂王朝[legitimacy|e]重光。"
 oe_msn_geo_01_brilliant_recovery_req_tt:0 "控制第比利斯、库塔伊西、阿哈尔齐赫、埃里温或巴库之一（可经由附庸），稳定度不低于 5，且拥有城堡或市场。"
 oe_msn_geo_02_khevsur_sadrosho:0 "萨德罗肖军区与赫夫苏尔山地卫队"
 oe_msn_geo_02_khevsur_sadrosho_desc:0 "将全境划为四大萨德罗肖军区，由山地公爵统率锁甲赫夫苏尔剑士，令格鲁吉亚在强敌犯境时瞬间动员。凝聚贵族[estates|e]既能征集精悍[manpower|e]，更把山国[army|e]淬炼出刚毅[army_tradition|e]。"
 oe_msn_geo_02_khevsur_sadrosho_req_tt:0 "金币不低于 180，稳定度不低于 8，拥有武器行会或城堡，且贵族阶层满意度不低于 50%。"
 oe_msn_geo_03_darial_fortresses:0 "达里亚尔险隘与石砌瞭望塔防线"
 oe_msn_geo_03_darial_fortresses_desc:0 "从斯瓦涅季石砌瞭望塔群到达里亚尔与罗基铁门峡谷，险峻雪山隘口令草原铁骑每进一步皆付血价。结合近代军工[advances|e]加固山岳[fort|e]网络，既牢握高地[control|e]，亦磨砺出百战精锐[regulars|e]。"
 oe_msn_geo_03_darial_fortresses_req_tt:0 "文艺复兴时代起，稳定度不低于 12，拥有军械库或城堡，且陆军传统不低于 18 或已解锁职业军队。"
 oe_msn_geo_04_defy_the_empires:0 "山国铁盾：力挫东西帝国瓜分图谋"
 oe_msn_geo_04_defy_the_empires_desc:0 "当奥斯曼苏丹与波斯沙阿密谋以阿马西亚和约瓜分高加索之际，团结的格鲁吉亚铁盾毅然粉碎列强图谋。凭棱堡[fort|e]防线与雄浑[army_tradition|e]捍卫[crown_power|e]，令山国[prestige|e]震动东西两帝。"
 oe_msn_geo_04_defy_the_empires_req_tt:0 "宗教改革时代起，控制第比利斯与阿哈尔齐赫，稳定度不低于 15，拥有棱堡或兵营，且陆军传统不低于 25。"
 oe_msn_geo_05_kartli_imereti_samtskhe:0 "光复三邦：卡尔特利、伊梅列季与萨姆茨赫"
 oe_msn_geo_05_kartli_imereti_samtskhe_desc:0 "利希山脉屡屡将格鲁吉亚割裂为卡尔特利、伊梅列季与萨姆茨赫三邦，频频招致外敌乘隙而入。光复三邦并确立统一[core|e]，既强化全境[control|e]与内部[stability|e]，更汇聚高加索全体[manpower|e]。"
 oe_msn_geo_05_kartli_imereti_samtskhe_req_tt:0 "控制第比利斯、库塔伊西与阿哈尔齐赫（可经由附庸），且教士阶层满意度不低于 50%。"
 oe_msn_geo_06_armenian_highlands:0 "亚拉拉特之盾：埃里温、阿尼与卡尔斯"
 oe_msn_geo_06_armenian_highlands_desc:0 "一如塔玛尔女王名将光复千堂古城阿尼与阿拉斯河谷，将埃里温与卡尔斯纳入护翼方能拱卫亚拉拉特南麓。收编高原[core|e]既增进基督教[religious_influence|e]与周边[diplomacy|e]，更令山城重现[prosperity|e]。"
