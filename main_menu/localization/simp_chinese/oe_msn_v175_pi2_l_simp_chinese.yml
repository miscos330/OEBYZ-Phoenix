 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m3:0 "伊斯法罕天下之半与皇家卡汗内盛世"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m3:0 "钴蓝琉璃广场、坎儿井御苑与皇家丝毯官坊铸就冠绝当世的伊朗声望与财源。"
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m4:0 "两河、高原与波斯湾万王之王"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m4:0 "以近代伊朗盛世兼控巴格达、大不里士、伊斯法罕与霍尔木兹，重现横跨罗马与印度之间的伟岸帝国。"
