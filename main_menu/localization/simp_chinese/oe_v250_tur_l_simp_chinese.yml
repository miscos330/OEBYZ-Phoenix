l_simp_chinese:
# NEW 2026-11-24 v25.0 Phase 4A: 1337-1460 Deep Flavor & Mechanic Packs (TUR/FRA/ENG) (oe_v250_tur_, 0 mainline slots, 0 rules, 0 vanilla overrides) — simp_chinese localization for Ottoman Beylik (1337-1460) (149 keys). Edit gen_v250_1337_tur_fra_eng.py, not this file.
 oe_v250_tur_reform_ghazi_uc_beys:0 "加齐边疆乌赤贝伊制"
 oe_v250_tur_reform_ghazi_uc_beys_desc:0 "将鲁米利亚与安纳托利亚前线托付给自主行动的加齐边疆贝伊，源源不断征集轻骑兵与高昂圣战士气，代价则是王室集权削弱、地方管控趋缓与稳定维护趋重。"
 oe_v250_tur_reform_timar_defterhane:0 "帝国地籍司提马尔采邑制"
 oe_v250_tur_reform_timar_defterhane_desc:0 "在布尔萨与埃迪尔内设立帝国地籍司，以清丈簿册严核各省提马尔税籍，显著提升赋税、内阁效率与直辖掌控，却引发旧贵族不满、军费加重并压缩部落征召规模。"
 oe_v250_tur_priv_timar_sipahis:0 "西帕希世袭提马尔封地"
 oe_v250_tur_priv_timar_sipahis_desc:0 "向效忠苏丹的各省西帕希骑兵确认可承袭的提马尔采邑，强化重骑兵战力与人力储备，同时扩大贵族阶层权势、削减王室权力并拉低贵族税赋上限。"
 oe_v250_tur_priv_ahi_silk_guilds:0 "阿希行会与布尔萨丝路商馆"
 oe_v250_tur_priv_ahi_silk_guilds_desc:0 "敕免布尔萨与安卡拉阿希工匠行会及丝路商馆的苛杂税捐，提振手工业产出与陆路商运，代价是市民阶层权势膨胀、商税上限下调并招致军功贵族微词。"
 oe_v250_tur_cab_tahrir_survey:0 "省区地籍清丈簿"
 oe_v250_tur_cab_tahrir_survey_desc:0 "派遣帝国财政司书记官赴目标行省逐户清丈田亩、果园与提马尔岁入，提升当地控制度、发展度与国家税效，但会引起农民不满与稳定维护成本微升。"
 oe_v250_tur_cab_tahrir_survey_action:0 "省区地籍清丈簿：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_tur_cab_tahrir_survey_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行省区地籍清丈簿"
 oe_v250_tur_cab_tahrir_survey_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_tur_cab_tahrir_survey_action_progress_wordier:0 "省区地籍清丈簿（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_tur_cab_tahrir_survey_action_progress_tooltip:0 "派遣帝国财政司书记官赴目标行省逐户清丈田亩、果园与提马尔岁入，提升当地控制度、发展度与国家税效，但会引起农民不满与稳定维护成本微升。"
 oe_v250_tur_cab_tahrir_survey_select_province:0 "选择开展地籍清丈的行省"
 oe_v250_tur_cab_tahrir_survey_no_provinces:0 "@trigger_no! 当前没有可开展地籍清丈的行省。"
 oe_v250_tur_cab_rumeli_akinji:0 "鲁米利亚阿金吉边防斥候"
 oe_v250_tur_cab_rumeli_akinji_desc:0 "统筹巴尔干沿河的阿金吉轻骑斥候开展常态巡边与侦察，强化轻骑战力、围城效率与陆军传统，却会损害邻邦外交声誉并加重军费负担。"
 oe_v250_tur_cab_rumeli_akinji_action:0 "鲁米利亚阿金吉边防斥候"
 oe_v250_tur_cab_rumeli_akinji_active:0 "正在执行：鲁米利亚阿金吉边防斥候"
 oe_v250_tur_cab_rumeli_akinji_action_progress:0 "执行中"
 oe_v250_tur_cab_rumeli_akinji_action_progress_wordier:0 "鲁米利亚阿金吉边防斥候（执行中）"
 oe_v250_tur_cab_rumeli_akinji_action_progress_tooltip:0 "统筹巴尔干沿河的阿金吉轻骑斥候开展常态巡边与侦察，强化轻骑战力、围城效率与陆军传统，却会损害邻邦外交声誉并加重军费负担。"
 oe_v250_tur_dec_iznik_madrasah.title:0 "兴建伊兹尼克奥尔汗经学院"
 oe_v250_tur_dec_iznik_madrasah.desc:0 "为伊兹尼克奥尔汗经学院拨付永久瓦克夫教产，培养治理布尔萨与边疆诸郡的法官与学者。耗费90金币，持续25年提升科研与教士识字率，同时提高教士权势并略微降低直征税效。"
 oe_v250_tur_dec_iznik_madrasah.a:0 "拨付教产并延揽名师大儒"
 oe_v250_tur_dec_gelibolu_arsenal.title:0 "兴建加里波利帝国船坞"
 oe_v250_tur_dec_gelibolu_arsenal.desc:0 "将加里波利岸港扩建为奥斯曼首座常设达达尼尔海峡帝国船坞。耗费120金币，持续25年强化桨帆战舰战力、水手储备与海权威慑，同时增加海军与陆军维护开支。"
 oe_v250_tur_dec_gelibolu_arsenal.a:0 "动工兴筑赫勒斯滂桨帆船台"
 oe_v250_tur_dec_edirne_seat.title:0 "定都埃迪尔内·鲁米利亚行台"
 oe_v250_tur_dec_edirne_seat.desc:0 "将阿德里安堡营建为鲁米利亚宫廷重镇埃迪尔内，稳固巴尔干前线统治。耗费110金币，持续25年提升控制度、人力与附庸忠诚，却会触发周边忌惮并推高稳定维护成本。"
 oe_v250_tur_dec_edirne_seat.a:0 "于埃迪尔内营建苏丹行宫"
 oe_v250_tur_dec_tophane_foundry.title:0 "敕建奥斯曼青铜巨炮铸造局"
 oe_v250_tur_dec_tophane_foundry.desc:0 "延揽巴尔干与安纳托利亚铸炮大师，于帝国官炉浇筑攻城青铜巨炮。1425年起可用，耗费150金币，持续25年显著强化围城效率与炮兵火力，但军费与税效承受沉重代价。"
 oe_v250_tur_dec_tophane_foundry.a:0 "点燃帝国巨炮熔炉"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_iznik_madrasah:0 "伊兹尼克奥尔汗经学院"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_iznik_madrasah:0 "伊兹尼克经学院源源输送卡迪法官与文书官员，推动学术与律法建设，同时也壮大了教士阶层势力并分流部分田赋。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_gelibolu_arsenal:0 "加里波利帝国船坞"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_gelibolu_arsenal:0 "达达尼尔海峡常设船坞使奥斯曼舰队牢控渡口并威慑爱琴海，但高昂船料与工匠俸禄持续消耗国库。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_edirne_seat:0 "埃迪尔内鲁米利亚行台"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_edirne_seat:0 "坐镇埃迪尔内令奥斯曼军政辐射巴尔干诸邦并压服附庸，但也因锋芒毕露而损耗外交亲和并增加维稳压力。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_dec_tophane_foundry:0 "帝国青铜巨炮铸造局"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_dec_tophane_foundry:0 "官铸青铜巨炮足以轰裂色雷斯与多瑙河沿线坚城，但巨额铜锡采购与炮兵薪饷令国库绷紧。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev1_aegean_dockyards:0 "卡拉西爱琴海船坞"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev1_aegean_dockyards:0 "卡拉西造船匠与老练船长替奥斯曼打造出首支海峡分舰队，提升海战与水手实力，却抬高海军维护并略微削减陆上税效。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev1_bursa_focus:0 "布尔萨陆权与丝市优先"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev1_bursa_focus:0 "集中财力经营布尔萨商馆与骑兵牧场，强化陆贸与轻骑战力，但海权与海军士气相对滞后。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev1_karasi_autonomy:0 "卡拉西豪族怀柔约章"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev1_karasi_autonomy:0 "尊重卡拉西本土特权令周边土库曼侯国稍安、维稳更易，代价则是王室直辖削弱且贵族权势抬升。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev2_gallipoli_bridgehead:0 "加里波利渡海桥头堡"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev2_gallipoli_bridgehead:0 "渡海移民与精骑在海峡西岸站稳脚跟，大幅增强攻城与圣战士气，但引发基督教诸邦警觉并推高要塞维护负担。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev2_mercenary_transit:0 "海峡雇佣军渡约"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev2_mercenary_transit:0 "凭武装渡峡协定换取拜占庭银钱与外交缓和，国库充盈，却令渴望圣战建功的加齐骑士心生不满。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev2_strait_watch:0 "安纳托利亚海峡固防"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev2_strait_watch:0 "加固海峡东岸堡垒使比提尼亚固若金汤，但战略趋于保守而削弱围城进取势头。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev3_rumeli_beylerbey:0 "鲁米利亚总督区统御"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev3_rumeli_beylerbey:0 "统一的鲁米利亚总督府强化了巴尔干行政掌控与军纪协同，但常设幕府开支与边将不满随之攀升。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev3_ucbey_autonomy:0 "巴尔干乌赤贝伊自治边镇"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev3_ucbey_autonomy:0 "纵任世袭边将分路掠边极大激发了轻骑锐气与兵源征集，却使王室权柄分散、田赋流失。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev4_pencik_corps:0 "彭奇克卡皮库鲁常备军"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev4_pencik_corps:0 "直属苏丹的常薪近卫步兵显著拔高军纪、重步战力与王权比重，代价是军费高企且旧贵族阶层离心。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev4_ghazi_primacy:0 "加齐部族武士尊崇"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev4_ghazi_primacy:0 "维系自由民骑兵的核心地位换得贵族拥戴与低廉军费，却错失中央常备步兵纪律并助长贵族势大。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev4_garrison_pencik:0 "要塞彭奇克守备队"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev4_garrison_pencik:0 "将王室战俘专用于边城守备强化了要塞防御与驻军恢复，但增加了要塞维护费并略减野战人力。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev5_sipahi_timars:0 "地籍西帕希提马尔军屯"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev5_sipahi_timars:0 "以农赋直接换取骑兵军役显著扩充了人力与重骑力量，却减少了国库直征现金税并略微分散王权。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev5_crown_cash_tax:0 "苏丹直辖现银皇庄"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev5_crown_cash_tax:0 "直接征缴现银令国库充实、王权集中，却缩减了地方西帕希兵源并加重乡民税负。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev6_beylik_purchase:0 "安纳托利亚联姻购地盟约"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev6_beylik_purchase:0 "合法的联姻嫁妆与购地条约极大提升外交信誉与安纳托利亚整合度，但巨额赎金使财政与战力投入暂受掣肘。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev6_beylik_force:0 "铁血安纳托利亚霸权"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev6_beylik_force:0 "强硬武力威慑激发了全军士气与征战效率，却令周边侯国敌视加深且附庸猜忌渐生。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev7_balkan_vassals:0 "巴尔干朝贡附庸网络"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev7_balkan_vassals:0 "巴尔干基督教附庸提供稳定的忠诚协作与外交余地，但间接统治削弱了直辖税效与宗教归化速度。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev7_direct_sanjaks:0 "巴尔干直辖桑贾克体制"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev7_direct_sanjaks:0 "派驻土耳其桑贾克贝伊直辖新土提高了控制度与兵源征集，却引发地方抵触、维稳昂贵且令附庸寒心。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev8_kapikulu_divan:0 "卡皮库鲁集权底万"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev8_kapikulu_divan:0 "宫廷出身的维齐尔大幅强化内阁效率与苏丹集权，但也激化土耳其旧贵族怨恨并略微推高稳定维护成本。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev8_candarli_viziers:0 "钱达尔勒名门大维齐尔制"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev8_candarli_viziers:0 "倚重钱达尔勒等传统名臣稳固了王朝正统、朝局稳定与贵族合作，但削弱了苏丹个人的集权比重。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev9_conciliate_beys:0 "安纳托利亚诸部怀柔备御"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev9_conciliate_beys:0 "暂缓高压政策安抚了土库曼诸部并加固城防，代价则是帝国威望受损、王权暂时退让。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev9_defy_timur:0 "雷霆苏丹总动员"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev9_defy_timur:0 "破釜沉舟的强硬集权提振了军纪与决战士气，却令厌战情绪飙升、诸阶层怨愤且附庸动摇。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev10_ulema_orthodoxy:0 "正统乌里玛秩序整肃"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev10_ulema_orthodoxy:0 "果断肃清异端重建了中央掌控、教法统一与教士效忠，但挫伤农民归心并压缩异教宽容度。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev10_agrarian_relief:0 "乱后乡里宽赋安民"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev10_agrarian_relief:0 "减免积欠赋役令乡村休养生息、跨教和谐，代价则是国库税效下滑且正统教士颇有微词。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev11_bronze_bombards:0 "瓦尔纳时代青铜巨炮"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev11_bronze_bombards:0 "官铸青铜巨炮使奥斯曼攻城能力跃升新境，但高昂炮队军费与略微迟缓的骑兵投入成为必然代价。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev11_danube_horsemen:0 "多瑙河疾骑与坚堡防线"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev11_danube_horsemen:0 "灵动骑军与加固河堡有效化解十字军突进，却令强攻重城的速度有所放缓并提高城堡维护费。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev12_fratricide_law:0 "帝国无分割继承法典"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev12_fratricide_law:0 "铁腕杜绝宗室分裂极大巩固了王权、控制度与军纪，却令列国震骇并令王朝合法性与外交声誉蒙尘。"
 STATIC_MODIFIER_NAME_oe_v250_tur_mod_ev12_divan_succession:0 "帝国底万共议继承宪章"
 STATIC_MODIFIER_DESC_oe_v250_tur_mod_ev12_divan_succession:0 "枢密共议继承赢得教法界赞誉、王朝正统与外交亲和，代价则是王室集权受制、贵族与教士影响力上升。"
 oe_v250_tur.1.t:0 "并吞卡拉西与爱琴海船坞"
 oe_v250_tur.1.d:0 "邻邦卡拉西侯国内讧迭起，巴勒克埃西尔、贝尔加马与达达尼尔海峡东岸门户洞开，埃夫雷诺斯与哈吉·伊尔贝伊等宿将水师悉数来投。若大举投入卡拉西船坞便可叩开渡海入欧之门，但布尔萨元老却忧心兴建水师将分流安纳托利亚骑兵军资与丝市商本。"
 oe_v250_tur.1.a:0 "收编卡拉西水师宿将并扩建爱琴海桨帆船坞"
 oe_v250_tur.1.b:0 "专注布尔萨丝路商市与安纳托利亚骑兵"
 oe_v250_tur.1.c:0 "保留卡拉西旧贵族自治以安抚西小亚细亚"
 oe_v250_tur.2.t:0 "钦佩堡与渡海登临加里波利"
 oe_v250_tur.2.d:0 "拜占庭内战未息，色雷斯地震又震裂了达达尼尔海峡西岸防线。王子苏莱曼帕夏已立足钦佩堡并直指残破的加里波利城墙：若火速渡运土库曼部众与骑兵扎根欧洲，奥斯曼便能永立巴尔干门户，却也可能在安纳托利亚后方未稳之际激起希腊与巴尔干诸国联手反扑。"
 oe_v250_tur.2.a:0 "渡运加齐部众过峡并筑牢加里波利桥头堡"
 oe_v250_tur.2.b:0 "借雇佣军约换取拜占庭黄金与渡峡通行权"
 oe_v250_tur.2.c:0 "先固安纳托利亚海峡要塞再图西进"
 oe_v250_tur.3.t:0 "拉拉·沙欣与鲁米利亚贝伊勒贝伊区"
 oe_v250_tur.3.d:0 "马里察河谷的迅猛推进已超出布尔萨宫廷的直接节制。穆拉德一世的宿将恩师拉拉·沙欣帕夏建言以埃迪尔内为治所设立统一的鲁米利亚贝伊勒贝伊总督区，统筹巴尔干战局与军政法度；而埃夫雷诺斯等边疆乌赤贝伊却主张维持分散突袭体制以保进取锐气。"
 oe_v250_tur.3.a:0 "授命拉拉·沙欣出任鲁米利亚总督统辖巴尔干"
 oe_v250_tur.3.b:0 "维持边疆乌赤贝伊分庭自主突袭之制"
 oe_v250_tur.4.t:0 "创设五一战俘征募与卡皮库鲁近卫军"
 oe_v250_tur.4.d:0 "维齐尔钱达尔勒·卡拉·哈利勒与学者鲁斯泰姆联袂上奏：按法征收五分之一战俘（彭奇克制），训育为只效忠苏丹个人的常薪步兵——耶尼切里近卫军。此举可铸就制衡土库曼大贵族的王室铁军，但常年军饷与战利品抽成必将激怒旧派加齐骑兵。"
 oe_v250_tur.4.a:0 "颁行彭奇克征募制并组建卡皮库鲁常备步兵"
 oe_v250_tur.4.b:0 "婉拒宫廷仆兵制而尊崇加齐部族武士传统"
 oe_v250_tur.4.c:0 "仅以五一战俘充实要塞守军以求折中平衡"
 oe_v250_tur.5.t:0 "塔赫里尔地籍清丈与提马尔分授"
 oe_v250_tur.5.d:0 "帝国丈量官已将新附各桑贾克的农户灶口、水磨与葡萄园逐一登册。底万枢密议事面临立国财政抉择：将清丈村落广分提马尔采邑以不耗白银供养数千重甲西帕希骑兵，抑或将最肥沃的河谷平原留作苏丹直辖皇庄（哈斯）直接征收现银赋税？"
 oe_v250_tur.5.a:0 "广分清丈村落为西帕希骑兵提马尔采邑"
 oe_v250_tur.5.b:0 "保留膏腴平原为苏丹直辖现银皇庄"
 oe_v250_tur.6.t:0 "安纳托利亚侯国外交：格尔米扬与哈米德"
 oe_v250_tur.6.d:0 "当奥斯曼旌旗席卷鲁米利亚之际，格尔米扬与哈米德两大安纳托利亚侯国畏惧卡拉曼逼迫，主动抛来和平结盟之枝：格尔米扬愿以王室联姻嫁妆献出屈塔希亚诸邑，哈米德贝伊亦暗示愿以重金出让伊斯帕尔塔周边高地城镇。然主战将领却力主凭利剑一统小亚细亚，免耗国库白银。"
 oe_v250_tur.6.a:0 "以王室联姻与白银赎买和平吸纳两侯国"
 oe_v250_tur.6.b:0 "拒付赎金而以铁骑威慑确立安纳托利亚霸权"
 oe_v250_tur.7.t:0 "科索沃原野与巴尔干附庸体系"
 oe_v250_tur.7.d:0 "在巴尔干中部隘口与塞尔维亚、波斯尼亚及保加利亚诸侯激战连连，令高门直面疆域扩张过速的治理难题。若将战败基督教公侯收为朝贡附庸，令其岁输白银并出重骑助战，可腾出主力回援安纳托利亚；若废除本土王室改设直辖桑贾克，则虽可加深管控却必遭顽强反抗。"
 oe_v250_tur.7.a:0 "册封巴尔干公侯为朝贡附庸并征调助战重骑"
 oe_v250_tur.7.b:0 "废除本土公庭并推行奥斯曼直辖桑贾克制"
 oe_v250_tur.8.t:0 "帝国底万枢密院的集权之争"
 oe_v250_tur.8.d:0 "随着奥斯曼由边疆侯国蜕变为跨洲帝国，帝国底万枢密院内部爆发路线暗战：宫廷出身的卡皮库鲁官僚力主将印玺与财簿尽归唯苏丹是从的奴仆官员，而显赫的钱达尔勒土耳其名门则强调旧贵族重臣方能维系法统正朔、节制君主专断。"
 oe_v250_tur.8.a:0 "拔擢卡皮库鲁宫廷官僚执掌帝国底万"
 oe_v250_tur.8.b:0 "尊崇钱达尔勒土耳其世族蝉联大维齐尔"
 oe_v250_tur.9.t:0 "帖木儿铁蹄阴影与空位期警兆"
 oe_v250_tur.9.d:0 "撒马尔罕使节携倨傲国书抵境，勒令奥斯曼苏丹复立被废的安纳托利亚诸侯并向帖木儿称臣。小亚细亚中部新降的土库曼部落人心浮动，宫廷史官私下忧惧：一旦在安卡拉一线决战失利，奥斯曼皇室恐将陷入诸子割据的空位劫难。"
 oe_v250_tur.9.a:0 "怀柔安纳托利亚旧贝伊并固守要隘避其锋芒"
 oe_v250_tur.9.b:0 "强硬回绝撒马尔罕并实施战时总动员集权"
 oe_v250_tur.10.t:0 "重整乾坤：谢赫·贝德雷丁起义危机"
 oe_v250_tur.10.d:0 "连年内乱与沉重军役令艾登至多布罗加的贫农、失地骑兵与异端苦行僧怨声载道，纷纷追随法学家兼神秘主义者谢赫·贝德雷丁，宣扬财富共享与跨教平等。联合正统逊尼乌里玛铁腕镇压可迅速重建秩序，而减免乡民赋税虽能平息民怨却必招正统教士激烈反对。"
 oe_v250_tur.10.a:0 "倚重正统逊尼乌里玛铁腕平息异端叛乱"
 oe_v250_tur.10.b:0 "颁行乡里减赋恩赦并宽容边疆教团"
 oe_v250_tur.11.t:0 "瓦尔纳边防与攻城巨炮铸造"
 oe_v250_tur.11.d:0 "匈牙利战车阵与教宗十字军舰队频频进逼多瑙河下游与瓦尔纳海岸，色雷斯三重巨墙亦非云梯所能轻克。穆拉德二世麾下炮匠恳请广购铜锡铸造撼城青铜巨炮，而传统骑将则坚称唯有敏捷轻骑与多瑙河坚堡方能克敌制胜。"
 oe_v250_tur.11.a:0 "重金浇筑青铜攻城巨炮并组建炮手军团"
 oe_v250_tur.11.b:0 "优先强化鲁米利亚快骑与多瑙河边堡"
 oe_v250_tur.12.t:0 "弑兄法典与帝国枢密继承之辨"
 oe_v250_tur.12.d:0 "安卡拉战后诸子骨肉相残的惨痛记忆仍萦绕奥斯曼宫廷。正当帝国迈向鼎盛之际，法学家们激烈争论：究竟应将「为世界秩序（尼扎姆·阿莱姆）起见，新君得诛诸弟」写入冷酷法典，抑或将储位裁定交由大维齐尔与首席法官组成的帝国枢密会议共议？"
 oe_v250_tur.12.a:0 "颁行尼扎姆·阿莱姆弑兄法典以绝皇室分裂"
 oe_v250_tur.12.b:0 "确立帝国底万枢密院共议继承宪制"
