 # NEW 2026-11-19 Yuan track Y7 (oe_y7_ the late-Yuan suppression). Generated by gen_yuan_y7.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_y7_court_command: "朝廷总兵"
 STATIC_MODIFIER_DESC_oe_y7_court_command: "朝廷派重臣总领诸路兵马，抵消一部分红巾之乱与蒙汉对立造成的兵员损失。份数越多，加成越大。"
 STATIC_MODIFIER_NAME_oe_y7_militia: "义兵万户府"
 STATIC_MODIFIER_DESC_oe_y7_militia: "朝廷授地方豪强以官职，许其聚众讨贼。"
 STATIC_MODIFIER_NAME_oe_y7_warlord_army: "将帅专兵"
 STATIC_MODIFIER_DESC_oe_y7_warlord_army: "大军四散之后，义兵将帅各领其众，朝廷号令渐难行于军中。"
 STATIC_MODIFIER_NAME_oe_y7_general_sway: "将帅坐大"
 STATIC_MODIFIER_DESC_oe_y7_general_sway: "将帅各拥重兵，便宜行事，威望更在朝廷号令之上。"
 STATIC_MODIFIER_NAME_oe_y7_tammachi_hold: "蒙古军镇戍"
 STATIC_MODIFIER_DESC_oe_y7_tammachi_hold: "河南、山东的蒙古、探马赤军留在本镇，坚守城池。"
 STATIC_MODIFIER_NAME_oe_y7_garrison_thin: "镇戍空虚"
 STATIC_MODIFIER_DESC_oe_y7_garrison_thin: "河南、山东的蒙古军尽数从征，各城守备空虚。"
 STATIC_MODIFIER_NAME_oe_y7_touxia_levy: "五投下从征"
 STATIC_MODIFIER_DESC_oe_y7_touxia_levy: "鲁王率弘吉剌等五部投下之兵从征。"
 STATIC_MODIFIER_NAME_oe_y7_scattered: "大军四散"
 STATIC_MODIFIER_DESC_oe_y7_scattered: "罢相诏到，号称百万的大军一朝四散，不少人转投起事者。"
 STATIC_MODIFIER_NAME_oe_y7_court_rift: "朝堂失和"
 STATIC_MODIFIER_DESC_oe_y7_court_rift: "皇帝力排众议留下丞相，弹劾者心怀不满。"
 STATIC_MODIFIER_NAME_oe_y7_restoration: "至正中兴"
 STATIC_MODIFIER_DESC_oe_y7_restoration: "高邮克复，丞相留任，朝野以为中兴有望。"
 STATIC_MODIFIER_NAME_oe_y7_despair: "人心离散"
 STATIC_MODIFIER_DESC_oe_y7_despair: "官军屡败，百姓不再相信朝廷能平定乱事。"
 STATIC_MODIFIER_NAME_oe_y7_seat_guard: "宗王镇所"
 STATIC_MODIFIER_DESC_oe_y7_seat_guard: "宗王的王府与怯薛驻在此地。"
 STATIC_MODIFIER_NAME_oe_y7_garrison: "淮江镇戍"
 STATIC_MODIFIER_DESC_oe_y7_garrison: "元初以汉军及新附军戍守淮、江以南的重镇。"
 STATIC_MODIFIER_NAME_oe_y7_title_zhennan: "镇南王"
 STATIC_MODIFIER_DESC_oe_y7_title_zhennan: "《元史》所载的镇南王，镇守扬州。"
 STATIC_MODIFIER_NAME_oe_y7_title_weishun: "威顺王"
 STATIC_MODIFIER_DESC_oe_y7_title_weishun: "《元史》所载的威顺王，镇守武昌。"
 STATIC_MODIFIER_NAME_oe_y7_title_xuanrang: "宣让王"
 STATIC_MODIFIER_DESC_oe_y7_title_xuanrang: "《元史》所载的宣让王，镇守庐州。"
 STATIC_MODIFIER_NAME_oe_y7_title_chaghan: "义兵统帅"
 STATIC_MODIFIER_DESC_oe_y7_title_chaghan: "乃蛮人，家于颍州沈丘，至正十二年起义兵讨贼。"
 STATIC_MODIFIER_NAME_oe_y7_bolod_regime: "孛罗秉政"
 STATIC_MODIFIER_DESC_oe_y7_bolod_regime: "孛罗帖木儿入京为相，诛皇帝的狎臣，罢三宫不急的营造，沙汰宦官，减省钱粮；朝野却多视之为跋扈之臣。"
 STATIC_MODIFIER_NAME_oe_y7_bolod_command: "节制天下军马"
 STATIC_MODIFIER_DESC_oe_y7_bolod_command: "皇帝倚孛罗帖木儿以制东宫，命其节制天下军马。"
 STATIC_MODIFIER_NAME_oe_y7_two_courts: "两宫相猜"
 STATIC_MODIFIER_DESC_oe_y7_two_courts: "皇帝不肯处置孛罗帖木儿，皇太子一方心怀不满，朝中分作两党。"
 STATIC_MODIFIER_NAME_oe_y7_title_bolod: "太尉"
 STATIC_MODIFIER_DESC_oe_y7_title_bolod: "答失八都鲁之子，至正二十二年三月加太尉，领兵驻守大同（《元史》卷四十六、卷二〇七）。"
 STATIC_MODIFIER_NAME_oe_y7_heir_command: "皇太子总兵"
 STATIC_MODIFIER_DESC_oe_y7_heir_command: "皇太子亲自总领兵马，诸军多了一分锐气，朝中却多了一处发号施令的地方。"
 STATIC_MODIFIER_NAME_oe_y7_title_henan: "河南王"
 STATIC_MODIFIER_DESC_oe_y7_title_henan: "至正二十五年闰十月封河南王，代皇太子亲征，总制关陕、晋冀、山东等处并迤南一应军马（《元史》卷四十六、卷一四一）。"
 STATIC_MODIFIER_NAME_oe_y7_title_huai: "淮王"
 STATIC_MODIFIER_DESC_oe_y7_title_huai: "宣让王帖木儿不花，至正二十七年八月进封淮王（《元史》卷四十七、卷一一七）。"
 STATIC_MODIFIER_NAME_oe_y7_title_regent: "监国"
 STATIC_MODIFIER_DESC_oe_y7_title_regent: "皇帝北行，诏留守京城，监理国事（《元史》卷四十七）。"
 STATIC_MODIFIER_NAME_oe_y7_dadu_stand: "固守京城"
 STATIC_MODIFIER_DESC_oe_y7_dadu_stand: "皇帝不肯北行，诸怯薛歹登城固守。"
 STATIC_MODIFIER_NAME_oe_y7_dadu_left: "銮舆北奔"
 STATIC_MODIFIER_DESC_oe_y7_dadu_left: "皇帝夜开健德门北去，京城只剩留守的宗王、大臣。"
 STATIC_MODIFIER_NAME_oe_y7_rtr_yuan_crisis: "红巾大乱危局"
 STATIC_MODIFIER_DESC_oe_y7_rtr_yuan_crisis: "四方烽烟并起，朝政军需俱受掣肘，反叛滋生加速，但兵源惩戒仍留余地，不致彻底失能。"
 STATIC_MODIFIER_NAME_oe_y7_strife_levy_floor: "平乱军政底线"
 STATIC_MODIFIER_DESC_oe_y7_strife_levy_floor: "非常之际调配行省宿卫与军饷，对冲党争积弊，保住朝廷起码的征召与养兵底线。"
 STATIC_MODIFIER_NAME_oe_y7_ai_factional_decay: "朝堂党争衰朽"
 STATIC_MODIFIER_DESC_oe_y7_ai_factional_decay: "元廷权臣党争不息、军政废弛，征召锐减、赋税糜烂，各地城防与官军士气俱难维系。"
 STATIC_MODIFIER_NAME_oe_y7_ai_gaoyou_collapse: "高邮罢相崩解"
 STATIC_MODIFIER_DESC_oe_y7_ai_gaoyou_collapse: "高邮临阵罢相之后，中枢威信扫地、行省号令不行，官军兵源与城防长期难复旧观。"
 STATIC_MODIFIER_NAME_oe_y7_rtr_support_of_the_people: "民心归附"
 STATIC_MODIFIER_DESC_oe_y7_rtr_support_of_the_people: "起事首领深得乡里流民拥戴，士气、军纪与义军战力均得合理提振。"
 STATIC_MODIFIER_NAME_oe_y7_mng_zhu_command: "淮西统帅威望"
 STATIC_MODIFIER_DESC_oe_y7_mng_zhu_command: "淮西诸将归心，军纪严整，攻取郡县后的抚绥整顿尤为迅捷。"
 STATIC_MODIFIER_NAME_oe_y7_mng_mandate_surge: "淮西义旗大振"
 STATIC_MODIFIER_DESC_oe_y7_mng_mandate_surge: "大明立帜金陵、豪杰景从，兵员补员、攻城锐气与全军士气均获持续提振。"
 STATIC_MODIFIER_NAME_oe_y7_prince_shumiyuan_seat: "亲王行枢密府"
 STATIC_MODIFIER_DESC_oe_y7_prince_shumiyuan_seat: "内地出镇亲王获授实权开府，扩建怯薛防务，大幅强化镇所征召、城防与弹压。"
 STATIC_MODIFIER_NAME_oe_y7_prince_capital_guard: "宗王还卫京师"
 STATIC_MODIFIER_DESC_oe_y7_prince_capital_guard: "内地出镇亲王奉诏还朝宿卫，增强大都与全国防务及官军士气。"
 STATIC_MODIFIER_NAME_oe_y7_prince_overseas_marque: "敕封边海藩王"
 STATIC_MODIFIER_DESC_oe_y7_prince_overseas_marque: "平乱渐定之后，改封出镇宗王经略边疆与海道，彰显大元天威。"
 STATIC_MODIFIER_NAME_oe_y7_act_marshal_mod: "平乱大帅节度"
 STATIC_MODIFIER_DESC_oe_y7_act_marshal_mod: "朝廷起复或委任大帅总领前线诸军，士气大振，军饷调度亦更顺畅。"
 STATIC_MODIFIER_NAME_oe_y7_act_mediate_mod: "诸将释嫌协剿"
 STATIC_MODIFIER_DESC_oe_y7_act_mediate_mod: "大都遣使调停前线诸将内讧，朝政效能回升，诸路兵马重归协力。"
 STATIC_MODIFIER_NAME_oe_y7_rtr_branch_shumiyuan_loc: "行省便宜行事"
 STATIC_MODIFIER_DESC_oe_y7_rtr_branch_shumiyuan_loc: "朝廷特许该行省便宜行事，迅速拉升战时控制度与本地征召。"
 STATIC_MODIFIER_NAME_oe_y7_act_white_lotus_mod: "弥勒降世·广纳流民"
 STATIC_MODIFIER_DESC_oe_y7_act_white_lotus_mod: "义军广纳四方流民，兵员补员与征召规模显著加快。"
 STATIC_MODIFIER_NAME_oe_y7_act_tuntian_mod: "高筑墙广积粮"
 STATIC_MODIFIER_DESC_oe_y7_act_tuntian_mod: "义军注重城防修缮与军屯积粮，后勤韧性大增。"
 STATIC_MODIFIER_NAME_oe_y7_act_north_expedition_mod: "檄文北伐"
 STATIC_MODIFIER_DESC_oe_y7_act_north_expedition_mod: "义军盟主发布北伐檄文，士气高昂，攻城拔寨之势更锐。"
 oe_y7_bias_awe: "慑于兵威"
 oe_y7_bias_amnesty: "受朝廷官爵"
 oe_y7_bias_terror: "徐州屠城"
 oe_y7_bias_submit: "高邮受抚"
 oe_y7_bias_estranged: "与朝廷相猜"
 oe_y7_bias_trusted: "朝廷倚重"
 oe_y7_bias_feud: "关中构兵"
 oe_y7_bias_prince_summon: "敕调勤王赏赐"
 oe_y7.1.t: "红巾起于颍州"
 oe_y7.1.d1: "#F 至正十一年五月（1351年），颍州刘福通以红巾为号起事，攻陷颍州；同月，朝廷命同知枢密院事秃赤往讨（《元史》卷四十二）。宣让、威顺二王曾遭伯颜贬黜，脱脱当政后为之平反（卷一一七）。#!\n\n如今，红巾四起，丞相脱脱请总制天下兵马。\n镇南王（扬州）、威顺王（武昌）、宣让王（庐州）已在各自镇所整兵：镇所仍在大元手中的，率怯薛出战，镇所所在路得[ShowModifier('oe_y7_seat_guard')]；扬州、淮安、庐州、集庆、杭州、武昌、龙兴、襄阳、安庆九城中仍归大元的，得[ShowModifier('oe_y7_garrison')]（失城即去，1360年起全部撤去）。\n狱中的韩山童趁乱脱身。\n说明：#bold #color_yellow 平乱之势#!#!（#Y 0#!–#Y 100#!）每月向目标值移动至多#Y 3#!点，目标看大元在中华的疆域、红巾的家数、战况与事件；#bold #color_yellow 朝议#!#!只在脱脱当政时有意义，关系到日后罢相的可能。"
 oe_y7.1.d2: "#F 至正十一年五月（1351年），颍州刘福通以红巾为号起事，攻陷颍州；同月，朝廷命同知枢密院事秃赤往讨（《元史》卷四十二）。宣让、威顺二王曾遭伯颜贬黜，脱脱当政后为之平反（卷一一七）。#!\n\n如今，红巾四起，丞相脱脱请总制天下兵马。\n镇南王（扬州）、威顺王（武昌）、宣让王（庐州）已在各自镇所整兵：镇所仍在大元手中的，率怯薛出战，镇所所在路得[ShowModifier('oe_y7_seat_guard')]；扬州、淮安、庐州、集庆、杭州、武昌、龙兴、襄阳、安庆九城中仍归大元的，得[ShowModifier('oe_y7_garrison')]（失城即去，1360年起全部撤去）。\n说明：#bold #color_yellow 平乱之势#!#!（#Y 0#!–#Y 100#!）每月向目标值移动至多#Y 3#!点，目标看大元在中华的疆域、红巾的家数、战况与事件；#bold #color_yellow 朝议#!#!只在脱脱当政时有意义，关系到日后罢相的可能。"
 oe_y7.1.d3: "#F 至正十一年五月（1351年），颍州刘福通以红巾为号起事，攻陷颍州；同月，朝廷命同知枢密院事秃赤往讨（《元史》卷四十二）。宣让、威顺二王曾遭伯颜贬黜，脱脱当政后为之平反（卷一一七）。#!\n\n如今，红巾四起，朝中却无重臣总揽兵柄。\n镇南王（扬州）、威顺王（武昌）、宣让王（庐州）已在各自镇所整兵：镇所仍在大元手中的，率怯薛出战，镇所所在路得[ShowModifier('oe_y7_seat_guard')]；扬州、淮安、庐州、集庆、杭州、武昌、龙兴、襄阳、安庆九城中仍归大元的，得[ShowModifier('oe_y7_garrison')]（失城即去，1360年起全部撤去）。\n狱中的韩山童趁乱脱身。\n说明：#bold #color_yellow 平乱之势#!#!（#Y 0#!–#Y 100#!）每月向目标值移动至多#Y 3#!点，目标看大元在中华的疆域、红巾的家数、战况与事件；#bold #color_yellow 朝议#!#!只在脱脱当政时有意义，关系到日后罢相的可能。"
 oe_y7.1.d: "#F 至正十一年五月（1351年），颍州刘福通以红巾为号起事，攻陷颍州；同月，朝廷命同知枢密院事秃赤往讨（《元史》卷四十二）。宣让、威顺二王曾遭伯颜贬黜，脱脱当政后为之平反（卷一一七）。#!\n\n如今，红巾四起，朝中却无重臣总揽兵柄。\n镇南王（扬州）、威顺王（武昌）、宣让王（庐州）已在各自镇所整兵：镇所仍在大元手中的，率怯薛出战，镇所所在路得[ShowModifier('oe_y7_seat_guard')]；扬州、淮安、庐州、集庆、杭州、武昌、龙兴、襄阳、安庆九城中仍归大元的，得[ShowModifier('oe_y7_garrison')]（失城即去，1360年起全部撤去）。\n说明：#bold #color_yellow 平乱之势#!#!（#Y 0#!–#Y 100#!）每月向目标值移动至多#Y 3#!点，目标看大元在中华的疆域、红巾的家数、战况与事件；#bold #color_yellow 朝议#!#!只在脱脱当政时有意义，关系到日后罢相的可能。"
 oe_y7.1.a: "命丞相脱脱总制天下兵马"
 oe_y7.1.a.tt: "获得[ShowModifier('oe_y7_court_command')]，计#Y 2#!份，到高邮之役见分晓为止。\n#bold #color_yellow 朝议#!#!定为#Y 60#!，#bold #color_yellow 平乱之势#!#!定为#Y 50#!。"
 oe_y7.1.b: "命宗王、行省各自讨捕"
 oe_y7.1.b.tt: "获得[ShowModifier('oe_y7_court_command')]，计#Y 1#!份，到高邮之役见分晓为止。\n#bold #color_yellow 朝议#!#!定为#Y 50#!，#bold #color_yellow 平乱之势#!#!定为#Y 45#!。\n三王镇所的[ShowModifier('oe_y7_seat_guard')]改为#Y 2#!份。"
 oe_y7.1.c: "命知枢密院事统兵，宗王、行省各自讨捕"
 oe_y7.1.c.tt: "获得[ShowModifier('oe_y7_court_command')]，计#Y 1#!份，到高邮之役见分晓为止。\n#bold #color_yellow 朝议#!#!定为#Y 50#!，#bold #color_yellow 平乱之势#!#!定为#Y 40#!。\n三王镇所的[ShowModifier('oe_y7_seat_guard')]改为#Y 2#!份。"
 oe_y7.2.t: "征调探马赤与五投下"
 oe_y7.2.d: "#F 《元史·兵志》说，元初宗王镇边，“河洛、山东据天下腹心，则以蒙古、探马赤军列大府以屯之”；淮、江以南则以汉军及新附军戍守。至正十二年八月，朝廷命翰林学士承旨阔怯镇遏五投下百姓（卷四十二）。#!\n\n如今，河南、山东的蒙古、探马赤军尚在本镇，弘吉剌等五部的投下也可征调。"
 oe_y7.2.a: "尽发河南、山东蒙古军从征"
 oe_y7.2.a.tt: "#Y 2#!团（轻骑#Y 1#!、重骑#Y 1#!）出现在大元离汴梁最近的地方，由新任的蒙古军万户统领。\n获得[ShowModifier('oe_y7_garrison_thin')]，#Y 5#!年。\n平乱之势的目标值#G +5#!（此项每月回落#Y 1#!）。"
 oe_y7.2.b: "留镇本地，坚守城池"
 oe_y7.2.b.tt: "获得[ShowModifier('oe_y7_tammachi_hold')]，到高邮之役见分晓为止。\n平乱之势的目标值#G +2#!（此项每月回落#Y 1#!）。"
 oe_y7.2.c: "诏鲁王率五投下之兵助战"
 oe_y7.2.c.tt: "#Y 2#!团（重骑#Y 2#!）出现在大元离汴梁最近的地方，兵员出自鲁王封地。\n获得[ShowModifier('oe_y7_touxia_levy')]，#Y 3#!年。\n鲁王的忠诚#R −5#!。\n平乱之势的目标值#G +4#!（此项每月回落#Y 1#!）。"
 oe_y7.3.t: "沙河夜惊"
 oe_y7.3.d: "#F 至正十二年闰三月，知枢密院事也先帖木儿驻军沙河，军中夜惊，全军溃散，退屯朱仙镇，尽弃军资器械（《元史》卷四十二、卷一三八）。也先帖木儿是丞相脱脱之弟。#!\n\n如今，前线大营一夜之间溃散，各军士气大挫。\n大元各支陆军的士气已损失#R 15%#!；平乱之势的目标值#R −8#!（此项每月回落#Y 1#!）。"
 oe_y7.3.a: "罢也先帖木儿兵柄"
 oe_y7.3.a.tt: "朝议#R −5#!。\n平乱之势的目标值#G +3#!（此项每月回落#Y 1#!）。"
 oe_y7.3.b: "丞相庇护其弟"
 oe_y7.3.b.tt: "日后朝中议丞相之罪时，罢相的可能更大（权重+5）。"
 oe_y7.4.t: "义兵四起"
 oe_y7.4.d: "#F 至正十二年，沈丘察罕帖木儿与罗山李思齐起义兵讨贼，起初只有数百人，不久得万人（《元史》卷一四一）。至正十三、十四年间，朝廷陆续在江西、河南、淮南等地设立义兵千户所、万户府（卷四十三）。#!\n\n如今，河南的地方豪强请求朝廷授官，许其聚众讨贼。"
 oe_y7.4.a: "授以官职，立义兵万户府"
 oe_y7.4.a.tt: "获得[ShowModifier('oe_y7_militia')]；高邮之役之后改为[ShowModifier('oe_y7_warlord_army')]。\n#Y 2#!团（轻步#Y 1#!、轻骑#Y 1#!）出现在大元离沈丘最近的地方，由察罕帖木儿统领。\n河南江北行省的忠诚#G +3#!。\n平乱之势的目标值#G +6#!（此项每月回落#Y 1#!）。"
 oe_y7.4.b: "不许民间聚兵，专任官军"
 oe_y7.4.b.tt: "朝议#G +5#!。\n平乱之势的目标值#R −4#!（此项每月回落#Y 1#!）。"
 oe_y7.5.t: "徐州之役：出师"
 oe_y7.5.d1: "#F 至正十一年八月，芝麻李等攻陷徐州。次年八月，脱脱以右丞相分省于外，督制诸处军马，往讨徐州（《元史》卷四十二）。#!\n\n如今，徐州落在[SCOPE.sCountry('oe_y7_o').GetName]手中，运河为之不通。\n战役：大元在#Y 6#!个月内控制徐州即为成功。"
 oe_y7.5.d: "#F 至正十一年八月，芝麻李等攻陷徐州。次年八月，脱脱以右丞相分省于外，督制诸处军马，往讨徐州（《元史》卷四十二）。#!\n\n如今，徐州已不在大元手中，运河为之不通。\n战役：大元在#Y 6#!个月内控制徐州即为成功。"
 oe_y7.5.a: "丞相亲征"
 oe_y7.5.a.tt: "#Y 3#!团（轻步#Y 1#!、重步#Y 1#!、轻骑#Y 1#!）出现在大元离徐州最近的地方。\n朝议#R −3#!。"
 oe_y7.5.b: "遣将往讨"
 oe_y7.5.b.tt: "#Y 2#!团（轻步#Y 1#!、轻骑#Y 1#!）出现在大元离徐州最近的地方。"
 oe_y7.6.t: "徐州之役：结果"
 oe_y7.6.d1: "#F 至正十二年九月，脱脱收复徐州，屠其城，芝麻李遁走；脱脱随即在军中拜为太师（《元史》卷四十二、卷一三八）。#!\n\n如今，官军已入徐州。"
 oe_y7.6.d: "#F 至正十二年九月，脱脱收复徐州，屠其城，芝麻李遁走；脱脱随即在军中拜为太师（《元史》卷四十二、卷一三八）。#!\n\n如今，期限已到，官军仍未能控制徐州。"
 oe_y7.6.a: "屠城以儆"
 oe_y7.6.a.tt: "徐州人口#R −20%#!；所有割据国对大元的好感#R −25#!，#Y 10#!年（#bold #color_yellow 徐州屠城#!#!）。\n平乱之势的目标值#G +12#!（此项每月回落#Y 1#!）。\n朝议#G +8#!。\n在与徐州守方的战争中，大元的战争分数#G +15#!。\n河南江北行省的忠诚#G +5#!。"
 oe_y7.6.b: "宣抚胁从"
 oe_y7.6.b.tt: "平乱之势的目标值#G +8#!（此项每月回落#Y 1#!）。\n朝议#G +5#!。\n在与徐州守方的战争中，大元的战争分数#G +15#!。\n河南江北行省的忠诚#G +5#!。"
 oe_y7.6.c: "退保淮北"
 oe_y7.6.c.tt: "平乱之势的目标值#R −10#!（此项每月回落#Y 1#!）。\n朝议#R −8#!。"
 oe_y7.7.t: "宗王失镇"
 oe_y7.7.d1: "#F 镇南王一系自脱欢起出镇扬州；孛罗不花于天历二年（1329年）袭封（《元史》卷一〇八）。#!\n\n如今，扬州已不在大元手中，镇南王孛罗不花随军退走。\n扬州一路的[ShowModifier('oe_y7_seat_guard')]已撤去；平乱之势的目标值#R −6#!（此项每月回落#Y 1#!）；河南江北行省的忠诚#R −5#!。"
 oe_y7.7.d2: "#F 至正十二年正月，邹普胜攻陷武昌，威顺王宽彻普化与平章和尚弃城而走，朝廷追夺其印（《元史》卷四十二、卷一一七）。#!\n\n如今，武昌已不在大元手中，威顺王宽彻普化随军退走。\n武昌一路的[ShowModifier('oe_y7_seat_guard')]已撤去；平乱之势的目标值#R −6#!（此项每月回落#Y 1#!）；湖广行省的忠诚#R −5#!。"
 oe_y7.7.d: "#F 宣让王帖木儿不花于天历二年由镇南王改封，移镇庐州；至正十二年六月平庐州境内之贼受赏（《元史》卷一〇八、卷四十二）。#!\n\n如今，庐州已不在大元手中，宣让王帖木儿不花随军退走。\n庐州一路的[ShowModifier('oe_y7_seat_guard')]已撤去；平乱之势的目标值#R −6#!（此项每月回落#Y 1#!）；河南江北行省的忠诚#R −5#!。"
 oe_y7.7.a: "追夺王印"
 oe_y7.7.a.tt: "这位宗王不再统兵。\n朝议#G +3#!。\n在册藩王的忠诚各#R −2#!（宗室见宗王被夺印而不安）。"
 oe_y7.7.b: "责令戴罪讨贼"
 oe_y7.7.b.tt: "这位宗王仍然统兵。\n朝议#R −2#!。"
 oe_y7.8.t: "宗王还镇"
 oe_y7.8.d1: "#F 至正十四年十二月，诏威顺王还镇湖广（《元史》卷四十三）。#!\n\n如今，扬州已重归大元，镇南王孛罗不花请求还镇。"
 oe_y7.8.d2: "#F 至正十四年十二月，诏威顺王还镇湖广（《元史》卷四十三）。#!\n\n如今，武昌已重归大元，威顺王宽彻普化请求还镇。"
 oe_y7.8.d: "#F 至正十四年十二月，诏威顺王还镇湖广（《元史》卷四十三）。#!\n\n如今，庐州已重归大元，宣让王帖木儿不花请求还镇。"
 oe_y7.8.a: "诏还镇，复其印"
 oe_y7.8.a.tt: "镇所一路重得[ShowModifier('oe_y7_seat_guard')]；镇所中没有统帅的大元军队由这位宗王统领。\n平乱之势的目标值#G +4#!（此项每月回落#Y 1#!）。"
 oe_y7.8.b: "改以行省官守之"
 oe_y7.8.b.tt: "这位宗王不再还镇。\n朝议#G +3#!。"
 oe_y7.9.t: "招安"
 oe_y7.9.d: "#F 方国珍屡降屡叛。至正十五年四月，朝廷遣使招安张士诚，命镇南王孛罗不花与淮南行省商议（《元史》卷四十四）。#!\n\n如今，[SCOPE.sCountry('oe_y7_o').GetName]战事不利，遣使表示愿受朝廷官爵。"
 oe_y7.9.a: "授以官爵，许其归顺"
 oe_y7.9.a.tt: "对方的归附度#G +60#!；对大元的好感#G +100#!，#Y 24#!个月（#bold #color_yellow 受朝廷官爵#!#!）；两国白和。\n朝议#R −3#!。\n好感到期后，归附度又会每月下降。屡降屡叛，正在于此。\n若对方据有江南产粮之地，每年春天可向其征粮北运。"
 oe_y7.9.b: "不许，必剿之"
 oe_y7.9.b.tt: "平乱之势的目标值#G +3#!（此项每月回落#Y 1#!）。"
 oe_y7.10.t: "哈麻之谮"
 oe_y7.10.d1: "#F 至正十三年正月，哈麻为中书平章政事；同年，哈麻等人暗中向皇帝进献西天僧（《元史》卷四十三）。#!\n\n如今，哈麻出入宫禁，屡在奇皇后与皇太子面前言丞相的短处。\n奇皇后与哈麻声气相通，日后罢相的可能更大（权重+5）。"
 oe_y7.10.d: "#F 至正十三年正月，哈麻为中书平章政事；同年，哈麻等人暗中向皇帝进献西天僧（《元史》卷四十三）。#!\n\n如今，哈麻出入宫禁，屡在皇帝面前言丞相的短处。"
 oe_y7.10.a: "倚重脱脱，疏远哈麻"
 oe_y7.10.a.tt: "朝议#G +8#!。此后朝议每#Y 4#!个月#R −1#!。"
 oe_y7.10.b: "宠信哈麻"
 oe_y7.10.b.tt: "朝议#R −5#!。此后朝议每#Y 2#!个月#R −1#!。"
 oe_y7.11.t: "高邮之役：总制诸王诸省军"
 oe_y7.11.d1: "#F 至正十三年五月，张士诚起于泰州，陷高邮，国号大周。十四年九月，诏脱脱总制诸王各爱马、诸省各翼军马出征高邮，西域、西番皆发兵来助（《元史》卷四十三、卷一三八）。#!\n\n如今，[SCOPE.sCountry('oe_y7_o').GetName]据守高邮。\n战役：大元在#Y 6#!个月内控制目标，或对手不复存在、归顺朝廷，即为成功。"
 oe_y7.11.d2: "#F 至正十三年五月，张士诚起于泰州，陷高邮，国号大周。十四年九月，诏脱脱总制诸王各爱马、诸省各翼军马出征高邮，西域、西番皆发兵来助（《元史》卷四十三、卷一三八）。#!\n\n如今，红巾诸部以[SCOPE.sCountry('oe_y7_o').GetName]为首，其都城在[SCOPE.sLocation('oe_y7_l').GetName]。\n战役：大元在#Y 6#!个月内控制目标，或对手不复存在、归顺朝廷，即为成功。"
 oe_y7.11.d: "#F 至正十三年五月，张士诚起于泰州，陷高邮，国号大周。十四年九月，诏脱脱总制诸王各爱马、诸省各翼军马出征高邮，西域、西番皆发兵来助（《元史》卷四十三、卷一三八）。#!\n\n如今，群盗暂息，没有值得大举的目标。"
 oe_y7.11.a: "大举出师"
 oe_y7.11.a.tt: "#Y 4#!团（轻步#Y 1#!、重步#Y 1#!、轻骑#Y 1#!、重骑#Y 1#!）出现在大元离目标最近的地方。\n高丽仍受征东节制时，另有高丽轻骑#Y 1#!团随征。\n在册的AI藩王按其档位出人力相助，其忠诚随之下降。\n朝议#R −5#!。\n#Y 3#!个月后，朝中将议丞相之罪。"
 oe_y7.11.c: "命宗王总兵"
 oe_y7.11.c.tt: "#Y 4#!团（轻步#Y 1#!、重步#Y 1#!、轻骑#Y 1#!、重骑#Y 1#!）出现在大元离目标最近的地方。\n高丽仍受征东节制时，另有高丽轻骑#Y 1#!团随征。\n战役结束之后，诸军由将帅分领。"
 oe_y7.11.b: "缓师，先固江淮"
 oe_y7.11.b.tt: "[ShowModifier('oe_y7_court_command')]降为#Y 1#!份。\n平乱之势的目标值#R −5#!（此项每月回落#Y 1#!）。\n朝议#G +5#!。\n丞相之罪仍将在高邮之役的窗口期末议起，且罢相的可能更大（权重+10）。"
 oe_y7.11.e: "缓师，先固江淮"
 oe_y7.11.e.tt: "平乱之势的目标值#R −5#!（此项每月回落#Y 1#!）。"
 oe_y7.12.t: "罢相诏"
 oe_y7.12.d: "#F 至正十四年十二月，诏书以脱脱“老师费财，已逾三月”为由，削其官爵，安置淮安路；其弟也先帖木儿安置宁夏路，改命太不花、月阔察儿、雪雪总兵。此前哈麻已在皇太子与奇皇后面前谮毁脱脱（《元史》卷四十三、卷一三八）。#!\n\n如今，弹劾丞相的奏章堆满御案。罢与不罢，在此一举。\n若由AI决断，下诏罢相的可能为#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_dw').GetValue|0]#!%（在#Y 25#!到#Y 75#!之间）。"
 oe_y7.12.a: "下诏削其官爵"
 oe_y7.12.a.tt: "脱脱罢官，永不再入内阁；大元失去[ShowModifier('yua_dictator_powers')]。\n失去[ShowModifier('oe_y7_court_command')]；获得[ShowModifier('oe_y7_scattered')]，#Y 12#!个月；已立的义兵转为[ShowModifier('oe_y7_warlord_army')]。\n大元每支陆军士气#R −20%#!。\n平乱之势最多为#Y 40#!；河南江北、江浙两行省的忠诚各#R −5#!。\n将帅专兵的时代开始。"
 oe_y7.12.b: "力排众议，诏脱脱毕其功"
 oe_y7.12.b.tt: "获得[ShowModifier('oe_y7_court_rift')]，#Y 60#!个月。\n朝议定为#Y 55#!，此后不再自然下降。\n高邮之役的期限延长#Y 4#!个月；没有出师的，丞相即刻留任，但没有[ShowModifier('oe_y7_restoration')]。"
 oe_y7.13.t: "高邮之役：结局"
 oe_y7.13.d1: "#F 至正十四年十一月，脱脱兵至高邮，连战皆捷（《元史》卷四十三）。#!\n\n如今，[SCOPE.sCountry('oe_y7_o').GetName]已无力再战。"
 oe_y7.13.d2: "#F 至正十四年十一月，脱脱兵至高邮，连战皆捷（《元史》卷四十三）。#!\n\n如今，高邮之敌已无力再战。"
 oe_y7.13.d: "#F 至正十四年十一月，脱脱兵至高邮，连战皆捷（《元史》卷四十三）。#!\n\n如今，延长的期限已到，高邮仍未攻下，“老师费财”之议又起。\n再议的结果由掷骰决定（玩家与AI相同）：下诏罢相的可能为#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_dw').GetValue|0]#!%。"
 oe_y7.13.a: "受降，收其地"
 oe_y7.13.a.tt: "对手的地点不超过#Y 15#!处时，并入大元；否则在与大元的战争中，大元的战争分数#G +40#!，对手的归附度#G +50#!。\n转入至正中兴：获得[ShowModifier('oe_y7_restoration')]（至脱脱去世、离任或1362年为止）；[ShowModifier('oe_y7_court_command')]改为#Y 1#!份。\n平乱之势的目标值#G +15#!（此项每月回落#Y 1#!）。\n朝议#G +10#!。\n河南江北行省的忠诚#G +8#!。"
 oe_y7.13.b: "授官招抚"
 oe_y7.13.b.tt: "对手的归附度#G +100#!，两国白和；其对大元的好感#G +100#!，#Y 36#!个月（#bold #color_yellow 高邮受抚#!#!）。\n转入至正中兴：获得[ShowModifier('oe_y7_restoration')]（至脱脱去世、离任或1362年为止）；[ShowModifier('oe_y7_court_command')]改为#Y 1#!份。\n平乱之势的目标值#G +15#!（此项每月回落#Y 1#!）。\n朝议#G +10#!。\n河南江北行省的忠诚#G +8#!。"
 oe_y7.13.c: "再议"
 oe_y7.13.c.tt: "按上面的可能掷骰：罢相则一如罢相诏；留任则转入至正中兴，但没有[ShowModifier('oe_y7_restoration')]。"
 oe_y7.14.t: "百万之师一朝而散"
 oe_y7.14.d: "#F 罢相的诏书传到军中，大军四散，不少人转投起事者（《元史》卷一三八）。#!\n\n如今，各路兵马纷纷散去，将帅各领其众。\n罢相的后果已经生效：[ShowModifier('oe_y7_scattered')]（#Y 12#!个月）；已立义兵的，转为[ShowModifier('oe_y7_warlord_army')]。"
 oe_y7.14.a: "事已至此"
 oe_y7.15.t: "脱脱之死"
 oe_y7.15.d: "#F 至正十五年三月，脱脱被流放云南镇西路；十二月，哈麻矫诏遣使鸩杀脱脱，年四十二（《元史》卷一三八）。#!\n\n如今，脱脱死于贬所的消息传到大都。"
 oe_y7.15.a: "不问"
 oe_y7.15.b: "追究矫诏之人"
 oe_y7.15.b.tt: "此事会被记下。"
 oe_y7.16.t: "汴梁之役：出师"
 oe_y7.16.d1: "#F 至正十八年五月（1358年），刘福通攻汴梁，守将竹贞弃城而走，刘福通自安丰迎其主韩林儿入居汴梁，以为都城。十九年五月，察罕帖木儿大发秦、晋诸军讨汴梁，围其城（《元史》卷四十五、卷一四一）。#!\n\n如今，汴梁落在[SCOPE.sCountry('oe_y7_o').GetName]手中，察罕帖木儿请督诸军往攻。\n战役：#Y 8#!个月内，大元或归附大元的割据国控制汴梁（地图上的开封）即为成功。"
 oe_y7.16.d: "#F 至正十八年五月（1358年），刘福通攻汴梁，守将竹贞弃城而走，刘福通自安丰迎其主韩林儿入居汴梁，以为都城。十九年五月，察罕帖木儿大发秦、晋诸军讨汴梁，围其城（《元史》卷四十五、卷一四一）。#!\n\n如今，汴梁已不在大元手中，察罕帖木儿请督诸军往攻。\n战役：#Y 8#!个月内，大元或归附大元的割据国控制汴梁（地图上的开封）即为成功。"
 oe_y7.16.a: "许之，命察罕帖木儿督诸军攻汴梁"
 oe_y7.16.a.tt: "#Y 2#!团（轻步#Y 1#!、轻骑#Y 1#!）出现在大元离汴梁最近的地方，由察罕帖木儿统领。"
 oe_y7.16.b: "命其固守关陕"
 oe_y7.16.b.tt: "平乱之势的目标值#R −3#!（此项每月回落#Y 1#!）。"
 oe_y7.17.t: "汴梁之役：结果"
 oe_y7.17.d1: "#F 至正十九年八月，察罕帖木儿督诸将攻破汴梁，刘福通奉韩林儿出走，退据安丰。朝廷以察罕帖木儿为河南行省平章政事，兼同知河南行枢密院事、陕西行台御史中丞，依前便宜行事（《元史》卷四十五）。#!\n\n如今，汴梁已重归朝廷一方。"
 oe_y7.17.d: "#F 至正十九年八月，察罕帖木儿督诸将攻破汴梁，刘福通奉韩林儿出走，退据安丰。朝廷以察罕帖木儿为河南行省平章政事，兼同知河南行枢密院事、陕西行台御史中丞，依前便宜行事（《元史》卷四十五）。#!\n\n如今，期限已到，汴梁仍在敌手。"
 oe_y7.17.a: "以察罕帖木儿为河南行省平章政事"
 oe_y7.17.a.tt: "平乱之势的目标值#G +10#!（此项每月回落#Y 1#!）。\n大元已有[ShowModifier('oe_y7_warlord_army')]时，另获得[ShowModifier('oe_y7_general_sway')]。"
 oe_y7.17.b: "犒赏诸军"
 oe_y7.17.b.tt: "平乱之势的目标值#G +10#!（此项每月回落#Y 1#!）。"
 oe_y7.17.c: "退守"
 oe_y7.17.c.tt: "平乱之势的目标值#R −6#!（此项每月回落#Y 1#!）。"
 oe_y7.18.t: "益都之变"
 oe_y7.18.d1: "#F 至正二十一年八月，察罕帖木儿下山东，田丰、王士诚皆降，遂围益都。二十二年六月，田丰、王士诚复叛，刺杀察罕帖木儿，走入益都城；诸将推扩廓帖木儿为总兵官，复围益都。扩廓帖木儿本是察罕帖木儿的外甥，自幼被养为子。朝廷追封察罕帖木儿为忠襄王，后改封颍川王；十一月，扩廓帖木儿攻克益都，取田丰、王士诚之心以祭（《元史》卷四十六、卷一四一）。#!\n\n如今，察罕帖木儿在军中遇刺身亡，扩廓帖木儿袭总其兵。"
 oe_y7.18.d: "#F 至正二十一年八月，察罕帖木儿下山东，田丰、王士诚皆降，遂围益都。二十二年六月，田丰、王士诚复叛，刺杀察罕帖木儿，走入益都城；诸将推扩廓帖木儿为总兵官，复围益都。扩廓帖木儿本是察罕帖木儿的外甥，自幼被养为子。朝廷追封察罕帖木儿为忠襄王，后改封颍川王；十一月，扩廓帖木儿攻克益都，取田丰、王士诚之心以祭（《元史》卷四十六、卷一四一）。#!\n\n如今，察罕帖木儿在军中遇刺身亡，部众由其养子统领。"
 oe_y7.18.a: "厚葬之，追封王爵"
 oe_y7.25.t: "削夺之议"
 oe_y7.25.d1: "#F 至正二十三年（1363年），御史大夫老的沙、知枢密院事秃坚帖木儿得罪于皇太子，逃奔大同，孛罗帖木儿将二人藏匿在营中。老的沙是皇帝的母舅，皇帝几次将此事搁下不问；丞相搠思监与宦者朴不花依附皇太子，诬孛罗帖木儿与老的沙图谋不轨。二十四年三月，诏解孛罗帖木儿兵权，削其官爵，孛罗帖木儿拒不奉诏（《元史》卷四十六、卷一四一、卷二〇四、卷二〇五、卷二〇七）。#!\n\n如今，孛罗帖木儿拥兵大同，与驻守太原的扩廓帖木儿连年相攻；奇皇后与皇太子倚扩廓帖木儿为外援，弹劾孛罗帖木儿的奏章接连不断。"
 oe_y7.25.d2: "#F 至正二十三年（1363年），御史大夫老的沙、知枢密院事秃坚帖木儿得罪于皇太子，逃奔大同，孛罗帖木儿将二人藏匿在营中。老的沙是皇帝的母舅，皇帝几次将此事搁下不问；丞相搠思监与宦者朴不花依附皇太子，诬孛罗帖木儿与老的沙图谋不轨。二十四年三月，诏解孛罗帖木儿兵权，削其官爵，孛罗帖木儿拒不奉诏（《元史》卷四十六、卷一四一、卷二〇四、卷二〇五、卷二〇七）。#!\n\n如今，孛罗帖木儿拥兵大同，与驻守太原的扩廓帖木儿连年相攻；皇太子倚扩廓帖木儿为外援，弹劾孛罗帖木儿的奏章接连不断。"
 oe_y7.25.d3: "#F 至正二十三年（1363年），御史大夫老的沙、知枢密院事秃坚帖木儿得罪于皇太子，逃奔大同，孛罗帖木儿将二人藏匿在营中。老的沙是皇帝的母舅，皇帝几次将此事搁下不问；丞相搠思监与宦者朴不花依附皇太子，诬孛罗帖木儿与老的沙图谋不轨。二十四年三月，诏解孛罗帖木儿兵权，削其官爵，孛罗帖木儿拒不奉诏（《元史》卷四十六、卷一四一、卷二〇四、卷二〇五、卷二〇七）。#!\n\n如今，孛罗帖木儿拥兵大同，不听朝廷调遣；奇皇后与皇太子一方弹劾孛罗帖木儿的奏章接连不断。"
 oe_y7.25.d: "#F 至正二十三年（1363年），御史大夫老的沙、知枢密院事秃坚帖木儿得罪于皇太子，逃奔大同，孛罗帖木儿将二人藏匿在营中。老的沙是皇帝的母舅，皇帝几次将此事搁下不问；丞相搠思监与宦者朴不花依附皇太子，诬孛罗帖木儿与老的沙图谋不轨。二十四年三月，诏解孛罗帖木儿兵权，削其官爵，孛罗帖木儿拒不奉诏（《元史》卷四十六、卷一四一、卷二〇四、卷二〇五、卷二〇七）。#!\n\n如今，孛罗帖木儿拥兵大同，不听朝廷调遣；皇太子一方弹劾孛罗帖木儿的奏章接连不断。"
 oe_y7.25.a: "下诏解其兵权，削其官爵"
 oe_y7.25.a.tt: "孛罗帖木儿将拒不奉诏，#Y 2#!个月后称兵向阙。\n平乱之势的目标值#R −2#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +10#!。"
 oe_y7.25.b: "寝其事，不问"
 oe_y7.25.b.tt: "获得[ShowModifier('oe_y7_two_courts')]，#Y 24#!个月。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −10#!。\n孛罗帖木儿留镇大同；#Y 24#!个月后此事不再提起。"
 oe_y7.26.t: "孛罗称兵向阙"
 oe_y7.26.d: "#F 至正二十四年四月，秃坚帖木儿领兵入居庸关，至清河列营，非得搠思监、朴不花不肯退兵；皇帝将二人交出，二人皆被杀。七月，孛罗帖木儿亲率兵再向京师，也速领兵驻昌平，“军士皆无斗志”，皇太子出奔冀宁。孛罗帖木儿入见于宣文阁，自诉无罪，“皆泣，帝亦泣”。八月，以孛罗帖木儿为中书右丞相，节制天下军马（《元史》卷四十六、卷一四二、卷二〇七）。#!\n\n如今，孛罗帖木儿拒不奉诏，大同之兵已向居庸关进发。\n若闭城拒守，将孛罗帖木儿挡回大同的可能为#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_win26').GetValue|0]#!%（看#bold #color_yellow 平乱之势#!#!；扩廓帖木儿在世且未与大元交战时更高；在#Y 15#!到#Y 70#!之间）。"
 oe_y7.26.a: "纳之，以孛罗帖木儿为中书右丞相"
 oe_y7.26.a.tt: "孛罗帖木儿交出兵权，入内阁为首（原任内阁首脑被换下），大元获得[ShowModifier('yua_dictator_powers')]；获得[ShowModifier('oe_y7_bolod_regime')]，到孛罗帖木儿去世或离任为止。\n稳定#R −7#!，正统#R −10#!。\n平乱之势的目标值#R −6#!（此项每月回落#Y 1#!）。\n[ShowModifier('oe_y7_general_sway')]多一份（至多#Y 3#!份，每份王室权力#R −5%#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −25#!，对大元的好感#R −75#!，#Y 24#!个月（与朝廷相猜）。\n在册藩王的忠诚各#R −2#!（皇太子承制征调诸王之兵）。\n#Y 12#!个月后，孛罗帖木儿的结局见分晓。"
 oe_y7.26.b: "闭城拒守，发兵逆击"
 oe_y7.26.b.tt: "按上面的可能掷一次。\n挡回：孛罗帖木儿败归大同；平乱之势的目标值#G +4#!（此项每月回落#Y 1#!）；#Y 9#!个月后定孛罗帖木儿之罪。\n挡回时，扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +15#!。\n挡不住：孛罗帖木儿照样入京，“纳之”的后果全部生效，另外稳定#R −7#!，大元每支陆军士气#R −30%#!。"
 oe_y7.27.t: "孛罗帖木儿的结局"
 oe_y7.27.d1: "#F 至正二十五年，孛罗帖木儿将奇皇后幽禁于诸色总管府百日；皇太子在冀宁调诸道兵讨之，也速领兵回到永平，击破其部将姚伯颜不花。孛罗帖木儿“日与老的沙饮宴，荒淫无度，酗酒杀人”。七月乙酉，威顺王之子和尚受皇帝密旨，结勇士伯颜达儿等，刺孛罗帖木儿于延春阁李树下（《元史》卷四十六、卷一一四、卷一一七、卷二〇七）。#!\n\n如今，孛罗帖木儿秉政将近一年，京城内外怨声四起，皇帝暗中召近臣商议。"
 oe_y7.27.d2: "#F 至正二十四年五月，扩廓帖木儿屯兵冀宁，分三路进攻大同；二十五年四月乙卯，关保攻入大同（《元史》卷四十六）。#!\n\n如今，孛罗帖木儿兵败退回大同，部众离散，朝廷要定其罪。"
 oe_y7.27.d: "#F 至正二十五年，孛罗帖木儿将奇皇后幽禁于诸色总管府百日；皇太子在冀宁调诸道兵讨之，也速领兵回到永平，击破其部将姚伯颜不花。孛罗帖木儿“日与老的沙饮宴，荒淫无度，酗酒杀人”。七月乙酉，威顺王之子和尚受皇帝密旨，结勇士伯颜达儿等，刺孛罗帖木儿于延春阁李树下（《元史》卷四十六、卷一一四、卷一一七、卷二〇七）。#!\n\n如今，孛罗帖木儿已不在朝中，此事无须再议。"
 oe_y7.27.a: "密旨除之"
 oe_y7.27.a.tt: "孛罗帖木儿身死；大元失去[ShowModifier('yua_dictator_powers')]和[ShowModifier('oe_y7_bolod_regime')]。\n[ShowModifier('oe_y7_general_sway')]少一份。\n平乱之势的目标值#G +4#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +30#!，对大元的好感#G +75#!，#Y 36#!个月（朝廷倚重）。\n在册藩王的忠诚各#G +2#!。"
 oe_y7.27.b: "倚孛罗帖木儿以制东宫"
 oe_y7.27.b.tt: "获得[ShowModifier('oe_y7_bolod_command')]，到孛罗帖木儿去世、离任或本线结束为止。\n[ShowModifier('oe_y7_general_sway')]多一份（至多#Y 3#!份，每份王室权力#R −5%#!）。\n平乱之势的目标值#R −4#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −40#!，对大元的好感#R −75#!，#Y 24#!个月（与朝廷相猜）。\n扩廓帖木儿与朝廷从此离心：本线不再为扩廓帖木儿安排封王、总兵之事。"
 oe_y7.27.c: "赦其死，夺其兵"
 oe_y7.27.c.tt: "孛罗帖木儿不再统兵，永不入内阁。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +10#!。"
 oe_y7.27.f: "诛之"
 oe_y7.27.f.tt: "孛罗帖木儿身死。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +20#!。"
 oe_y7.27.e: "事已至此"
 oe_y7.28.t: "封河南王"
 oe_y7.28.d1: "#F 至正二十五年九月，扩廓帖木儿扈从皇太子还京，与伯撒里同为丞相；“居两月，即请南还视师”。皇太子屡次请求亲出督师，皇帝难以决断。闰十月辛未，封扩廓帖木儿为河南王，代皇太子亲征，总制关陕、晋冀、山东等处并迤南一应军马。此前奇皇后曾传旨，要扩廓帖木儿以重兵拥皇太子入城，扩廓帖木儿到京城三十里外便遣散其军，“由是皇太子心衔之”（《元史》卷四十六、卷一一四、卷一四一）。#!\n\n如今，扩廓帖木儿据有河南、山西，兵强马壮，屡请南下讨贼；皇太子也屡请亲出督师。"
 oe_y7.28.d: "#F 至正二十五年九月，扩廓帖木儿扈从皇太子还京，与伯撒里同为丞相；“居两月，即请南还视师”。皇太子屡次请求亲出督师，皇帝难以决断。闰十月辛未，封扩廓帖木儿为河南王，代皇太子亲征，总制关陕、晋冀、山东等处并迤南一应军马。此前奇皇后曾传旨，要扩廓帖木儿以重兵拥皇太子入城，扩廓帖木儿到京城三十里外便遣散其军，“由是皇太子心衔之”（《元史》卷四十六、卷一一四、卷一四一）。#!\n\n如今，扩廓帖木儿统领其父的旧部，屡请南下讨贼；皇太子也屡请亲出督师。"
 oe_y7.28.a: "封扩廓帖木儿为河南王，代皇太子总制诸道军马"
 oe_y7.28.a.tt: "[ShowModifier('oe_y7_general_sway')]多一份（至多#Y 3#!份，每份王室权力#R −5%#!）。\n平乱之势的目标值#G +8#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +40#!，对大元的好感#G +75#!，#Y 36#!个月（朝廷倚重）。\n扩廓帖木儿在大元朝中时：得“河南王”名号，并统领大元在汴梁附近控制之地的一支无统帅的陆军（有的话）。\n#Y 5#!个月后，关中诸将对扩廓帖木儿的态度见分晓。"
 oe_y7.28.b: "许皇太子亲出督师"
 oe_y7.28.b.tt: "获得[ShowModifier('oe_y7_heir_command')]，到本线结束为止。\n平乱之势的目标值#G +3#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −15#!。\n扩廓帖木儿仍领旧职：本线不再为扩廓帖木儿安排关中、抚军院之事。"
 oe_y7.28.c: "仍其旧职"
 oe_y7.28.c.tt: "扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −10#!。\n扩廓帖木儿仍领旧职：本线不再为扩廓帖木儿安排关中、抚军院之事。"
 oe_y7.29.t: "关中拒命"
 oe_y7.29.d1: "#F 李思齐与察罕帖木儿同起义兵，“齿位相等”，不肯居扩廓帖木儿之下；张良弼首先拒命，孔兴、脱列伯各请另为一军。至正二十六年三月，扩廓帖木儿遣关保、虎林赤西攻张良弼于鹿台，李思齐之兵与张良弼会合。二十七年正月，诸将会于含元殿旧址，推李思齐为盟主，同拒扩廓帖木儿。扩廓帖木儿受命南征，“顾乃退居彰德，又惟务用兵陕西”。是年诏分潼关以西属李思齐，以东属扩廓帖木儿，各罢兵还镇（《元史》卷四十七、卷一四一）。#!\n\n如今，李思齐、张良弼等关中诸将不肯听扩廓帖木儿调遣，扩廓帖木儿请移兵西讨。"
 oe_y7.29.d: "#F 李思齐与察罕帖木儿同起义兵，“齿位相等”，不肯居扩廓帖木儿之下；张良弼首先拒命，孔兴、脱列伯各请另为一军。至正二十六年三月，扩廓帖木儿遣关保、虎林赤西攻张良弼于鹿台，李思齐之兵与张良弼会合。二十七年正月，诸将会于含元殿旧址，推李思齐为盟主，同拒扩廓帖木儿。扩廓帖木儿受命南征，“顾乃退居彰德，又惟务用兵陕西”。是年诏分潼关以西属李思齐，以东属扩廓帖木儿，各罢兵还镇（《元史》卷四十七、卷一四一）。#!\n\n如今，关中诸将不肯听扩廓帖木儿调遣，扩廓帖木儿请移兵西讨。"
 oe_y7.29.a: "听扩廓帖木儿西讨"
 oe_y7.29.a.tt: "平乱之势的目标值#R −6#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +5#!。\n李思齐是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −25#!。\n扩廓帖木儿与李思齐各据一国、都由AI掌握、都不是别国的附属且互不交战时：两国互相的好感#R −100#!，#Y 60#!个月（关中构兵）。不会因此开战。\n陕西行省的忠诚#R −5#!。\n#Y 8#!个月后，朝中将议扩廓帖木儿的兵权。"
 oe_y7.29.b: "下诏和解，分潼关东西，各守其地"
 oe_y7.29.b.tt: "平乱之势的目标值#R −2#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −10#!。\n李思齐是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +10#!。\n陕西行省的忠诚#G +3#!。\n#Y 8#!个月后，朝中将议扩廓帖木儿的兵权。"
 oe_y7.29.c: "改命李思齐总关陕之兵"
 oe_y7.29.c.tt: "平乱之势的目标值#R −4#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#R −30#!。\n李思齐是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +30#!，对大元的好感#G +75#!，#Y 36#!个月（朝廷倚重）。\n#Y 8#!个月后，朝中将议扩廓帖木儿的兵权。"
 oe_y7.30.t: "大抚军院"
 oe_y7.30.d: "#F 至正二十七年八月丙午，诏皇太子总天下兵马。貊高上疏说：“总兵官扩廓帖木儿，岁与官军仇杀……乞降明诏，别选重臣，以总大兵”；朝廷为皇太子设立大抚军院，“专备扩廓帖木儿”。十月壬子，罢去扩廓帖木儿的太傅、中书左丞相及所兼各职，仍为河南王，其兵分属诸将（《元史》卷四十七、卷一四一）。#!\n\n如今，扩廓帖木儿总兵在外，与关中诸将相攻不已；有人上疏请别选重臣，皇太子一方请设抚军院以分其兵。"
 oe_y7.30.a: "落其官，分其兵"
 oe_y7.30.a.tt: "获得[ShowModifier('oe_y7_heir_command')]，到本线结束为止。\n[ShowModifier('oe_y7_general_sway')]少一份。\n平乱之势的目标值#R −8#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!降到至多#Y 10#!（已经更低就不动），对大元的好感#R −75#!，#Y 24#!个月（与朝廷相猜）。\n扩廓帖木儿在大元朝中时：不再统兵，仍保留“河南王”名号。"
 oe_y7.30.b: "罢抚军院之议，仍任扩廓帖木儿"
 oe_y7.30.b.tt: "[ShowModifier('oe_y7_general_sway')]多一份（至多#Y 3#!份，每份王室权力#R −5%#!）。\n平乱之势的目标值#G +3#!（此项每月回落#Y 1#!）。\n扩廓帖木儿是割据一方的君主、且未与大元交战时：其#bold #color_yellow 归附度#!#!#G +15#!。"
 oe_y7.19.t: "追复脱脱"
 oe_y7.19.d: "#F 至正二十三年十一月壬申，御史台上言，故丞相脱脱“平徐州，收六合，大功垂成，浮言构难，奉诏谢兵，就贬以没”，请还其宣命，皇帝从之（《元史》卷四十六）。#!\n\n如今，御史台为脱脱上言，请还其宣命。"
 oe_y7.19.a: "还其宣命"
 oe_y7.31.t: "北奔之议"
 oe_y7.31.d1: "#F 至正二十八年（1368年）二月，诏削扩廓帖木儿爵邑，命诸军讨之；明兵至河南，李思齐、张良弼解兵西还。闰七月，扩廓帖木儿擒貊高、关保，朝廷罢大抚军院，复命扩廓帖木儿仍前河南王、太傅、中书左丞相。是月，明兵至通州。乙丑，诏淮王帖木儿不花监国，庆童为中书左丞相，同守京城。丙寅，皇帝御清宁殿议北行，宦者伯颜不花恸哭进谏：“天下者，世祖之天下，陛下当以死守，奈何弃之！”皇帝不听，夜半开健德门北去（《元史》卷四十七、卷一一七、卷一四一、卷一四二）。#!\n\n如今，敌军逼近京城，京畿已有失陷之地。淮王帖木儿不花请留守京城；朝中议论纷纷，或请北行，或请死守。扩廓帖木儿刚刚恢复官爵，却远在外地，救不了京城之急。\n说明：这件事只关乎朝廷的去留，不迁都。大都若失，原版的“北奔上都”等事件照常发生。"
