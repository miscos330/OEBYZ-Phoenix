 oe_y7.32.e: "事已至此"
 oe_y7.32.e.tt: "本线对大都的安排到此为止：大都的“固守京城”“銮舆北奔”与“监国”名号都撤去。此后大都在和约里易主、大元迁都、北元等，都由原版事件接手。"
 oe_y7.33.t: "扬州镇南王行府之议"
 oe_y7.33.d: "#F 镇南王府世镇扬州，控扼两淮漕运与长江咽喉。红巾既起，扬州行府乃朝廷维系江淮之屏障（《元史》卷一〇八）。#!\n\n如今，镇南王孛罗不花奉诏统理扬州军务，朝议对其行府定位意见不一：实权开府、召还宿卫，抑或俟中兴改封边海。"
 oe_y7.33.a: "实权开府，设亲王行枢密府"
 oe_y7.33.a.tt: "扬州所在路获[ShowModifier('oe_y7_prince_shumiyuan_seat')]（10年），并耗人力征募亲王侍卫骑2团。\n朝议#R −3#!。"
 oe_y7.33.b: "危局撤藩，召还大都宿卫"
 oe_y7.33.b.tt: "撤去扬州王府镇戍，获[ShowModifier('oe_y7_prince_capital_guard')]（15年）。"
 oe_y7.33.c: "中兴改封，敕封边疆海外藩王"
 oe_y7.33.c.tt: "获[ShowModifier('oe_y7_prince_overseas_marque')]（20年），经略边海。\n平乱之势的目标值#G +5#!（此项每月回落#Y 1#!）。"
 oe_y7.34.t: "武昌威顺王行府之议"
 oe_y7.34.d: "#F 威顺王出镇武昌，总制荆湖水陆要冲。湖广既动，王府权责与行省分际亟须圣裁（《元史》卷一一七）。#!\n\n如今，威顺王宽彻普化奉诏统理武昌军务，朝议对其行府定位意见不一：实权开府、召还宿卫，抑或俟中兴改封边海。"
 oe_y7.34.a: "实权开府，设亲王行枢密府"
 oe_y7.34.a.tt: "武昌所在路获[ShowModifier('oe_y7_prince_shumiyuan_seat')]（10年），并耗人力征募亲王侍卫骑2团。\n朝议#R −3#!。"
 oe_y7.34.b: "危局撤藩，召还大都宿卫"
 oe_y7.34.b.tt: "撤去武昌王府镇戍，获[ShowModifier('oe_y7_prince_capital_guard')]（15年）。"
 oe_y7.34.c: "中兴改封，敕封边疆海外藩王"
 oe_y7.34.c.tt: "获[ShowModifier('oe_y7_prince_overseas_marque')]（20年），经略边海。\n平乱之势的目标值#G +5#!（此项每月回落#Y 1#!）。"
 oe_y7.35.t: "庐州宣让王行府之议"
 oe_y7.35.d: "#F 宣让王移镇庐州，扼守淮西门户。朝廷当决断是否授以实权开府，或召还大都宿卫（《元史》卷一〇八、卷一一七）。#!\n\n如今，宣让王帖木儿不花奉诏统理庐州军务，朝议对其行府定位意见不一：实权开府、召还宿卫，抑或俟中兴改封边海。"
 oe_y7.35.a: "实权开府，设亲王行枢密府"
 oe_y7.35.a.tt: "庐州所在路获[ShowModifier('oe_y7_prince_shumiyuan_seat')]（10年），并耗人力征募亲王侍卫骑2团。\n朝议#R −3#!。"
 oe_y7.35.b: "危局撤藩，召还大都宿卫"
 oe_y7.35.b.tt: "撤去庐州王府镇戍，获[ShowModifier('oe_y7_prince_capital_guard')]（15年）。"
 oe_y7.35.c: "中兴改封，敕封边疆海外藩王"
 oe_y7.35.c.tt: "获[ShowModifier('oe_y7_prince_overseas_marque')]（20年），经略边海。\n平乱之势的目标值#G +5#!（此项每月回落#Y 1#!）。"
