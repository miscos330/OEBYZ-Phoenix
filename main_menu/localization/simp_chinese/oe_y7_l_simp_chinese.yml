ry.MakeScope.GetVariable('oe_y7_r_slow').GetValue|0]  留任 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_keep').GetValue|0]\n#T 量表#!\n平乱之势 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_shi').GetValue|0]  目标 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_t').GetValue|0]  加成 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_bonus').GetValue|0]  朝议 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_court').GetValue|0]  总兵份数 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_cmd').GetValue|0]  强度×100 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_i').GetValue|0]  中华地点档 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_share').GetValue|0]（4八成以上 … 0不足三成半）  红巾家数 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_rebels').GetValue|0]  可征兵 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_levy').GetValue|0]\n#T 脱脱、宗王、战役#!\n脱脱 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_toqto').GetValue|0]（0未当政、1在任、2被罢、3留任、4已死）  当政 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_incharge').GetValue|0]  义兵 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_militia').GetValue|0]（0无、1义兵、2将帅专兵）  招安 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_amnesty').GetValue|0] 次（本阶段 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_amnph').GetValue|0]，上次 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_amnm').GetValue|0]）  高丽兵 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_kor').GetValue|0]\n镇南王 状态 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_ps1').GetValue|0] 失 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_pl1').GetValue|0] 守 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_ph1').GetValue|0]  威顺王 状态 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_ps2').GetValue|0] 失 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_pl2').GetValue|0] 守 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_ph2').GetValue|0]  宣让王 状态 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_ps3').GetValue|0] 失 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_pl3').GetValue|0] 守 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_ph3').GetValue|0]（0未建、1在镇、2失镇、3还镇、4死或离开、5不还镇）\n战役 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_camp').GetValue|0]（0无、1徐州、2高邮）  期限 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_campend').GetValue|0]  已分胜负 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_campdone').GetValue|0]  成功 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_campok').GetValue|0]\n红巾进行中 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_rtr').GetValue|0]  已结束 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_rtrend').GetValue|0]  判定大元已崩溃 [ROOT.GetCountry.MakeScope.GetVariable('oe_y7_r_fallen').GetValue|0]"
