 oe_y7.31.a: "北奔，留宗王监国"
 oe_y7.31.a.tt: "大都得[ShowModifier('oe_y7_dadu_left')]，#Y 12#!个月或到城破为止。\n淮王（或宣让王）帖木儿不花在大元朝中时：得“监国”名号，并统领大都一支无统帅的大元陆军（有的话）。\n之后大都若破，大元只失威望；若连续#Y 6#!个月不再告急，便算解围，此事不再提起。"
 oe_y7.31.b: "固守京城"
 oe_y7.31.b.tt: "#Y 2#!团（重步#Y 1#!、重骑#Y 1#!）出现在大元的大都（诸怯薛歹）。\n大都得[ShowModifier('oe_y7_dadu_stand')]，#Y 12#!个月。\n战役“守大都”：#Y 8#!个月后大元仍控制大都、京城不再告急，即为守住；仍在告急则每次延#Y 3#!个月。城破则正统#R −20#!、稳定#R −12#!，大元每支陆军士气#R −50%#!。"
 oe_y7.32.t: "大都的结局"
 oe_y7.32.d1: "#F 至正二十八年闰七月丙寅夜半，皇帝开健德门北去。八月庚午，明兵入京城；淮王帖木儿不花与中书左丞相庆童出齐化门，皆被杀，淮王时年八十三（《元史》卷四十七、卷一一七、卷一四二）。#!\n\n如今，大都城破。皇帝早已北去，监国的宗王帖木儿不花死于城中。"
 oe_y7.32.d2: "#F 至正二十八年闰七月丙寅夜半，皇帝开健德门北去。八月庚午，明兵入京城；淮王帖木儿不花与中书左丞相庆童出齐化门，皆被杀，淮王时年八十三（《元史》卷四十七、卷一一七、卷一四二）。#!\n\n如今，大都城破。皇帝早已北去，留守的宗王、大臣或死或散。"
 oe_y7.32.d3: "#F 至正二十八年闰七月丙寅夜半，皇帝开健德门北去。八月庚午，明兵入京城；淮王帖木儿不花与中书左丞相庆童出齐化门，皆被杀，淮王时年八十三（《元史》卷四十七、卷一一七、卷一四二）。#!\n\n如今，大都城破。皇帝死守不去，到此只得仓皇出城，天下震动。"
 oe_y7.32.d4: "#F 至正二十八年闰七月丙寅夜半，皇帝开健德门北去。八月庚午，明兵入京城；淮王帖木儿不花与中书左丞相庆童出齐化门，皆被杀，淮王时年八十三（《元史》卷四十七、卷一一七、卷一四二）。#!\n\n如今，围城之敌已经退去，京城无恙。"
 oe_y7.32.d: "#F 至正二十八年闰七月丙寅夜半，皇帝开健德门北去。八月庚午，明兵入京城；淮王帖木儿不花与中书左丞相庆童出齐化门，皆被杀，淮王时年八十三（《元史》卷四十七、卷一一七、卷一四二）。#!\n\n如今，大都的局势又有变化，此事无须再议。"
 oe_y7.32.a: "国都既失"
 oe_y7.32.a.tt: "本线对大都的安排到此为止：大都的“固守京城”“銮舆北奔”与“监国”名号都撤去。此后大都在和约里易主、大元迁都、北元等，都由原版事件接手。"
 oe_y7.32.b: "城破之日"
 oe_y7.32.b.tt: "大元每支陆军士气#R −50%#!。\n本线对大都的安排到此为止：大都的“固守京城”“銮舆北奔”与“监国”名号都撤去。此后大都在和约里易主、大元迁都、北元等，都由原版事件接手。"
