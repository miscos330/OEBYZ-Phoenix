 oe_y7.90.b: "刷新读数"
 oe_y7_name_1: "孛罗不花"
 oe_y7_name_2: "宽彻普化"
 oe_y7_name_3: "帖木儿不花"
 oe_y7_name_4: "察罕帖木儿"
