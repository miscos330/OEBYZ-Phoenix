# NEW 2026-11-22 v12.2 Worker 1: Imperial Road Office Auto-Builder (simp_chinese). Generated by gen_v122_imperial_roads.py; edit the generator, not this file.
 oe_road_dec_open_console: "帝国驿道署：智能自动修路总控"
 oe_road_dec_open_console.title: "帝国驿道署：智能自动修路总控"
 oe_road_dec_open_console.desc: "开启帝国驿道署总控面板，配置智能自动修路的开关、三大路由模式（皇权邻近度网 / 市场工场商路网 / 文化同化 2.0 冲刺网）、帝国大道优先策略、国库保留红线与每月段数上限。全额按原价与原工期施工，并自动避让已启用的外部自动修路模组。"
 oe_road_dec_open_console.a: "召见驿道总监"
 oe_road_dec_open_ledger: "帝国驿道署：修路实时台账"
 oe_road_dec_open_ledger.title: "帝国驿道署：修路实时台账"
 oe_road_dec_open_ledger.desc: "查阅本国自动修路的实时状态、当前可用最高道路等级、国库安全起修线、外部自动修路模组避让状态与累计修建段数。"
 oe_road_dec_open_ledger.a: "展开路政台账"
 oe_road_human_only_tt: "仅限人类玩家操作，AI 永不启用以保证零性能损耗"
 oe_road.1.t: "帝国驿道署 · 智能自动修路总控"
 oe_road.1.d: "#T 运行状态#! 自动修路：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_enabled')|0]#!（1=开启 0=暂停）｜外部修路避让：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_ogas_yield')|0]#!（1=检测到外部自动修路模组已开启，本署自动礼让绝不重复扣费）\n#T 当前策略#! 路由模式：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_mode')|0]#!（1=皇权邻近度 2=市场与工场 3=文化同化2.0冲刺）｜道路等级策略：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_tier_policy')|0]#!（1=最强帝国大道优先 2=经济铺网）\n#T 财政与限速#! 国库现存：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_gold')|0]#! 杜卡特｜国库红线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_floor_value')|0]#! 杜卡特｜起修安全线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_safe_gold')|0]#! 杜卡特｜月限：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_pacing_cap')|0]#! 段/月\n#T 当前可用最高道路码#! #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_best_tier_code')|0]#!（7=铁路 6=西伯利亚御道 5=近代路 4=罗马皇道 3=蒙元驿道 2=石砌路 1=碎石路 0=未解锁）"
 oe_road.1.a: "开启 / 暂停自动修路总开关"
 oe_road.1.b: "立即执行一轮修路巡检并查阅台账"
 oe_road.1.c: "配置智能路由模式与道路等级策略"
 oe_road.1.e: "配置国库保留红线与每月修路限速"
 oe_road.1.f: "查看驿道署实时只读路政台账"
 oe_road.1.z: "保存并关闭总控台"
 oe_road.10.t: "帝国驿道署 · 智能路由与道路等级策略"
 oe_road.10.d: "#T 当前路由与等级配置#! 路由模式：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_mode')|0]#!｜道路等级策略：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_tier_policy')|0]#!｜最高可用道路码：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_best_tier_code')|0]#!\n\n#T 三大路由模式说明#!\n1. #Y 皇权邻近度网（默认）#!：优先连接高人口、高税基城镇都会、未连首都地块与海外总督行署，快速拉升全国邻近度与控制力。\n2. #Y 市场与工场商路网#!：优先贯通市场中心、海港、六座帝国御用工场、海关与募民局以及低市场通达度产区。\n3. #Y 文化同化 2.0 冲刺网#!：精准锁定卡在 0.50 / 0.65 控制力门槛下方的非主流文化城镇、建有学府建筑的都会、零道路摩擦边区与拥有十年边疆融合激励的新殖民重镇。\n\n#T 道路等级策略说明#!\n1 = 最强帝国大道优先（自动按 7 级阶梯优先铺设并升级为本文明专属大道与铁路）｜2 = 经济实用铺网（仅补无路边，乡村铺碎石路、城镇铺石砌或二级帝国大道）。"
 oe_road.10.a: "设为 Mode 1：皇权邻近度网（默认）"
 oe_road.10.b: "设为 Mode 2：市场、港口与御用工场商路网"
 oe_road.10.c: "设为 Mode 3：文化同化 2.0 冲刺网"
 oe_road.10.e: "切换道路等级策略（1=最强帝国大道 / 2=经济铺网）"
 oe_road.10.z: "返回驿道署总控台"
 oe_road.20.t: "帝国驿道署 · 国库红线与施工节奏"
 oe_road.20.d: "#T 双层财政熔断与限速配置#!\n当前国库：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_gold')|0]#! 杜卡特｜国库保留红线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_floor_value')|0]#! 杜卡特（档位：300 / 800 / 1500 / 3000 / 5000）\n当前起修安全线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_safe_gold')|0]#! 杜卡特（保留红线 + 当前道路等级单段缓冲金，每段开工前逐笔复检，绝不透支借贷）\n每月修路限速：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_pacing_cap')|0]#! 段/月（档位：保守 2 / 标准 5 / 帝国大基建 10 段）"
 oe_road.20.a: "轮换国库保留红线（300 / 800 / 1500 / 3000 / 5000）"
 oe_road.20.b: "轮换每月修路限速（2 / 5 / 10 段）"
 oe_road.20.z: "返回驿道署总控台"
 oe_road.90.t: "帝国驿道署 · 透明只读路政台账"
 oe_road.90.d: "#T 实时状态#! 开关：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_enabled')|0]#!｜模式：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_mode')|0]#!｜等级策略：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_tier_policy')|0]#!｜外部修路避让：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_ogas_yield')|0]#!｜最高可用道路码：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_best_tier_code')|0]#!\n#T 预算参数#! 国库现存：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_gold')|0]#!｜国库红线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_floor_value')|0]#!｜安全起修线：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_safe_gold')|0]#!｜月限：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_pacing_cap')|0]#! 段\n#T 工程实绩#! 本年已动工：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_yr_segments')|0]#! 段｜累计总动工：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_life_segments')|0]#! 段｜文化同化非主流路段：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_road_rd_cul2_segments')|0]#! 段"
 oe_road.90.a: "关闭路政台账"
 oe_road.90.b: "返回驿道署总控台"
 oe_road.90.c: "清零累计修建统计"
