l_simp_chinese:
 oe_ir_succession: "确保继承稳定"
 oe_ir_succession_desc: "将皇位的传承置于宫廷私谊之上，使新君接过的既有冠冕，也有服从冠冕的朝廷。\n\n须完成#Y 中央集权#!，王室力量#Y 大于40%#!，且不存在影响力#Y 大于200#!的非政治盟友豪族。完成后永久获得宫廷支出效率#G +10%#!。只能完成一次。"
 oe_ir_succession_done: "已完成确保继承稳定"
 oe_ir_succession_modifier: "确保继承稳定"
 OE_IR_SUCCESSION_NO_RIVAL: "没有非政治盟友豪族的影响力大于#Y 200#!"
 OE_NF_OPENING_ALLY_TT: "将#Y 坎塔库泽诺斯家族#!设为政治盟友，解锁盟友专属互动；该家族每月影响力#R +1#!。君主去世时解除盟约。"
 oe_succession_settlement.1.t: "坎塔库泽诺斯的野心"
 oe_succession_settlement.1.d: "安德洛尼卡三世的灵柩尚未远离宫门，他生前以友谊维系的平衡便已开始崩解。如今御座由摄政者代行职权，每一道诏令、每一枚印玺，都成了宫廷争夺的筹码。\n\n约翰·坎塔库泽诺斯以先帝故交和重臣自居，宣称无人比自己更懂得先帝的遗愿。他的书信传向庄园与军营，旧部登门，亲族奔走，原本寄托于皇帝信任的权势，正变成只听命于家族的力量。\n\n他仍在众人面前许诺守护皇室，然而城中的传言已经换了措辞：这位权臣究竟要做幼主的屏障，还是皇座真正的主人？"
 oe_succession_settlement.1.a: "先帝留下的信任，已经不足以维系朝廷。"
 OE_NF_KANTAKOUZENOS_AMBITION_TT: "坎塔库泽诺斯家族影响力#R +300#!（仍受#Y 1000#!上限限制）。"
 oe_nf_andronikos_iii_died: "安德洛尼卡三世已经去世"
 oe_nf_kantakouzenos_ambition_seen: "坎塔库泽诺斯的野心事件已触发"
 OE_NF_SOVEREIGN_DYNASTY_RULE: "东罗马统治者的家族不能成为豪族；已经登记的统治者家族会失去豪族地位并解除其豪族地点控制。摄政者家族不在此限。"
