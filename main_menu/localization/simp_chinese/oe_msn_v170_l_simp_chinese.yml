 oe_msn_mal_09_sankore_university:0 "桑科雷大学与廷巴克图万卷书库"
 oe_msn_mal_09_sankore_university_desc:0 "广礼桑科雷学者、天文学家与法学名宿，使廷巴克图文光闪耀非洲与地中海。"
 oe_msn_mal_09_sankore_university_req_tt:0 "拥有廷巴克图，且处于文艺复兴时代或之后。"
 oe_msn_mal_10_gold_standard_treasury:0 "黄金铸币与帝国大藏府"
