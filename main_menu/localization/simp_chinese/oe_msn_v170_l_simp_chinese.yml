 oe_msn_kil_08_zimbabwe_gold_corridor:0 "津巴布韦金脉与全岸珊瑚链"
 oe_msn_kil_08_zimbabwe_gold_corridor_desc:0 "将索法拉与大津巴布韦高原金脉或北方拉穆帆船网无缝衔接，成就非洲首富商轴。"
