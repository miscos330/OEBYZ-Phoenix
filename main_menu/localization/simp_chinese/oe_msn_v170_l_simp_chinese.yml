 oe_msn_kil_05_zanzibar_pemba_straits_req_tt:0 "拥有桑给巴尔与巴加莫约。"
 oe_msn_kil_06_mombasa_malindi_league:0 "蒙巴萨与马林迪北方石城联盟"
