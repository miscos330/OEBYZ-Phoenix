 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m1:0 "萨赫勒火药新军与索法铁骑"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m1:0 "索法重甲骑兵与精锐萨赫勒火绳枪步卒协同作战，横扫草原与撒哈拉绿洲战场。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m2:0 "尼日尔大河水师与河湾统主"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m2:0 "战船水师与沿岸河港将杰内、廷巴克图与加奥熔铸为畅通无阻的帝国大动脉。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m3:0 "桑科雷学府与跨撒哈拉商贸霸权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m3:0 "廷巴克图浩瀚藏书与王室金盐驼队令萨赫勒成为财富与学术双璧交辉的天下名枢。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m4:0 "永恒西非火药黄金帝国"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m4:0 "以黄金、学术与近代火炮统驭尼亚尼、廷巴克图与加奥，尼日尔帝国雄踞西非千秋不朽。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m1:0 "破浪折戟：抗击西洋舰队之盾"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m1:0 "轻捷炮装三角帆船与珊瑚礁海防炮台令东非每一座良港都化作来犯舰队的折戟之地。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m2:0 "索法拉—津巴布韦金象牙走廊"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m2:0 "畅通的内陆商路与南方门户将高原黄金与象牙源源不断汇入斯瓦希里王库。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m3:0 "季风帆船商网与斯瓦希里文华"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m3:0 "星盘领航帆船、斯瓦希里编年史与远洋商栈将东非紧密织入阿拉伯、印度与马来海贸网络。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m4:0 "印度洋环海永恒季风共主"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m4:0 "自索法拉、基尔瓦至蒙巴萨与桑给巴尔，斯瓦希里王旗乘季风而飘扬，独霸印度洋西岸千秋。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m1:0 "禁奴主权敕令与王家火枪卫队"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m1:0 "严禁掠民的港口缉私法度与王家火枪亲军护佑赤道人口根基与国家尊严。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m2:0 "刚果河盆地与几内亚湾共主"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m2:0 "贯通一体的雨林水网与大西洋自主商港将赤道非洲铸就为兴盛富强的贸易强国。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m3:0 "大西洋平等国使与赤道文书院"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m3:0 "平等外交使团、王家印书坊与举世赞叹的青铜象牙工坊赢得大西洋两岸持久敬重。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m4:0 "中西非赤道复兴盛世永存"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m4:0 "自刚果盆地至贝宁湾独立富强、工艺与宪制并耀，赤道王国盛名照彻千秋。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m1:0 "林地火枪对等与白银盟链威权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m1:0 "精锐林地火枪游骑与炉火纯青的白银盟链外交令大西洋列强不敢轻越雷池一步。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m2:0 "五大湖毛皮与水陆转运霸权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m2:0 "扼守尼亚加拉与北方湖网，将北美最丰饶的毛皮与内湖贸易尽数汇入长屋府库。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m3:0 "贝珠法典与龟岛联邦宪政"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m3:0 "成文化后的《大和平法》融合联邦协商、全民文教与平等邦谊，光耀北美东部林海。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m4:0 "龟岛永恒主权长屋联邦"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m4:0 "疆域自莫霍克河谷绵延至五大湖畔，大和平树荫庇一座永不屈服的北美大陆主权强邦。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m1:0 "丛林石堡铁壁与霍尔坎劲旅"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m1:0 "多层石灰岩丛林要塞、萨克贝伏击驰道与革新钢刃霍尔坎步兵粉碎一切外敌入侵。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m2:0 "加勒比翡翠可可商舟海权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m2:0 "远航雪松巨舟与珊瑚礁灯塔贯通墨西哥湾盐场、尤卡坦良港与佩滕翡翠商道。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m3:0 "玛雅历算观象台与本草医学"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m3:0 "阶梯金字塔天文历算、圣井引水农政与本草防疫令玛雅诸城生生不息、学术昌明。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m4:0 "第二玛雅黄金时代千秋永耀"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m4:0 "自玛雅潘、奇琴伊察至诺佩滕，浴火重生的玛雅文明以科学、武功与主权辉映中美洲千秋。"
 oe_msn_mal_destiny:0 "#bold #color_yellow 马里与桑海：尼日尔黄金帝国天命#!#!"
 oe_msn_mal_destiny_DESCRIPTION:0 "自班布克黄金与桑科雷学府迈向尼日尔河水师与西非火药帝国霸权"
 oe_msn_mal_destiny_CRITERIA_DESCRIPTION:0 "掌控班布克金矿，整编索法重骑与阿斯基亚行省，统合杰内、廷巴克图、加奥与撒哈拉盐道，加冕近代西非火药帝国。"
 oe_msn_mal_destiny_BUTTON_TOOLTIP:0 "开启马里—桑海天命"
 oe_msn_mal_destiny_BUTTON_DETAILS:0 "马里与桑海十二任务三支柱天命链：经略班布克黄金、整备索法重甲骑兵与萨赫勒火药新军，统辖杰内、廷巴克图、加奥与塔加扎盐道，并以桑科雷大学、金本位府库与跨撒哈拉商贸霸权加冕西非盛世。"
 oe_msn_mal_01_gold_of_bambuk:0 "班布克黄金与尼日尔王基"
 oe_msn_mal_01_gold_of_bambuk_desc:0 "自松迪亚塔颁行库鲁坎福加大宪章以来，班布克与布雷冲积沙金矿脉便是尼日尔诸王立国之本。稳固河湾[capital|e]可大幅推升本土[development|e]并广聚[gold|e]，令萨赫勒王朝[legitimacy|e]深植人心。"
 oe_msn_mal_01_gold_of_bambuk_req_tt:0 "自身或附庸拥有尼亚尼或加奥，以及凯斯、西吉里或加奥之一，稳定度不低于 5，且首都发展度达到 12。"
 oe_msn_mal_02_sofa_cavalry_corps:0 "整编索法重甲骑兵军团"
 oe_msn_mal_02_sofa_cavalry_corps_desc:0 "身披厚实绗缝棉甲与北非柏柏尔锁子甲的索法精锐骑军，乃纵横尼日尔草原的王室直属铁骑骨干。将之整编为常备[regulars|e]可大幅拔升[army_tradition|e]，令帝国[army|e]借精锐[manpower|e]威震萨赫勒。"
 oe_msn_mal_02_sofa_cavalry_corps_req_tt:0 "国库达 180 金币，稳定度不低于 10，且建有城堡或武器行会（或陆军传统达到 15）。"
 oe_msn_mal_03_askia_imperial_cabinet:0 "阿斯基亚中央官署与统一度量"
 oe_msn_mal_03_askia_imperial_cabinet_desc:0 "效法阿斯基亚·穆罕默德改制旧俗，中央特设河运、林牧、农税与统一度量衡专署总揽各行省庶务。建立专业化帝国[cabinet|e]可大振[crown_power|e]，令中央[control|e]贯通千里河山并长保[stability|e]。"
 oe_msn_mal_03_askia_imperial_cabinet_req_tt:0 "稳定度不低于 12，进入文艺复兴时代，且建有会计房或行会大厅（或市民满意度达 50%）。"
 oe_msn_mal_04_sahel_gunpowder_army:0 "萨赫勒火药新军劲旅"
 oe_msn_mal_04_sahel_gunpowder_army_desc:0 "深铭通迪比之战火器压境的沉痛教训，王室铸坊为索法军团全面配装精良燧发火枪与轻型青铜野战炮。积极吸纳火药[advances|e]与近代[institutions|e]并砥砺[army_tradition|e]，铸就横扫西非的火药[army|e]。"
 oe_msn_mal_04_sahel_gunpowder_army_req_tt:0 "自身或附庸拥有廷巴克图或加奥，稳定度不低于 15，进入宗教改革时代，建有兵营或军械库（或陆军传统达 30），且掌握枪阵火器或炮兵思潮（或陆军传统达 35）。"
 oe_msn_mal_05_djenne_inland_delta:0 "杰内大清真寺与内陆三角洲"
 oe_msn_mal_05_djenne_inland_delta_desc:0 "尼日尔内陆三角洲的季节沃水泛滥，令宏伟泥砖大清真寺矗立的杰内与塞古沃野化作西非丰饶粮仓。纳入两座[core|e]河港可大幅抬升流域[development|e]与百工[prosperity|e]，将沙金[trade|e]源源北输。"
 oe_msn_mal_05_djenne_inland_delta_req_tt:0 "自身或附庸拥有杰内与塞古。"
 oe_msn_mal_06_timbuktu_gao_axis:0 "大河双璧：廷巴克图与加奥"
 oe_msn_mal_06_timbuktu_gao_axis_desc:0 "在大漠骆驼商队与大河独木舟交汇的尼日尔河大弯，廷巴克图与加奥并峙为西非学术与王权双璧。稳握双城[core|e]轴线可倍增关榷[gold|e]，显著拓展枢纽[market|e]辐射并令帝国[prestige|e]遍及苏丹。"
 oe_msn_mal_06_timbuktu_gao_axis_req_tt:0 "自身或附庸拥有廷巴克图与加奥。"
 oe_msn_mal_07_taghaza_salt_caravans:0 "塔加扎盐池与瓦拉塔驼道"
 oe_msn_mal_07_taghaza_salt_caravans_desc:0 "自塔加扎荒漠盐池开凿的厚重岩盐，在瓦拉塔绿洲商门素与南方纯金等重交换，维系西非民生。派驻精兵护卫驼道水井可延伸大漠[control|e]，完善绿洲驿站[buildings|e]并保障商业[estates|e]的跨沙[trade|e]。"
 oe_msn_mal_07_taghaza_salt_caravans_req_tt:0 "自身或附庸拥有瓦拉塔或塔加扎，拥有至少 40 处领地，且建有商队驿馆或市场（或月度贸易与税收收入达 25）。"
 oe_msn_mal_08_niger_river_fleet:0 "统御尼日尔大河战船水师"
 oe_msn_mal_08_niger_river_fleet_desc:0 "在帝国海科伊水师提督统领下，数百艘拼板武装大战船昼夜巡弋卡巴拉至布萨激流的千里河道。常备熟习水性的大河[sailors|e]可磨砺[navy_tradition|e]，既护佑干流[trade|e]无阻，亦强化全线[maritime_presence|e]。"
 oe_msn_mal_08_niger_river_fleet_req_tt:0 "自身或附庸拥有廷巴克图、加奥与杰内，进入地理大发现时代，且建有码头或贸易枢纽（或月度贸易与税收收入达 35）。"
 oe_msn_mal_09_sankore_university:0 "桑科雷大学与廷巴克图万卷书库"
 oe_msn_mal_09_sankore_university_desc:0 "桑科雷与津加雷贝尔学府群中，数万法学家与抄书匠校勘天文医律典籍，卷帙之贵胜于黄金。广建书院[buildings|e]可推升全民[literacy|e]，既焕发西非[cultural_tradition|e]，亦厚植教士[estate_satisfaction|e]。"
 oe_msn_mal_09_sankore_university_req_tt:0 "自身或附庸拥有廷巴克图，进入文艺复兴时代，教士满意度不低于 50%，且建有伊斯兰经学院、大学或图书馆。"
 oe_msn_mal_10_gold_standard_treasury:0 "黄金铸币与帝国大藏府"
 oe_msn_mal_10_gold_standard_treasury_desc:0 "鉴戒曼萨·穆萨朝觐挥金致开罗金价暴跌旧事，帝国大藏府严核成色铸造标准米斯卡尔金币。审慎统筹国库[gold|e]既可抑制[inflation|e]，亦令国内[estates|e]信服并巩固跨海[prestige|e]。"
 oe_msn_mal_10_gold_standard_treasury_req_tt:0 "国库达 320 金币，自身或附庸拥有尼亚尼或加奥，且月度贸易与税收收入不低于 30。"
 oe_msn_mal_11_trans_saharan_hegemony:0 "跨撒哈拉黄金驼道霸权"
 oe_msn_mal_11_trans_saharan_hegemony_desc:0 "贯通卡诺靛蓝染坊与西撒哈拉千年驼道，使尼日尔王廷同时执掌大漠黄金与大西洋商路咽喉。借重近代商业[institutions|e]可铸就洲际[trade|e]霸权，拓展[market|e]纵深并彰显萨赫勒[diplomatic_reputation|e]。"
 oe_msn_mal_11_trans_saharan_hegemony_req_tt:0 "自身或附庸拥有廷巴克图及昆比萨利赫或卡诺之一，稳定度不低于 15，进入宗教改革时代，且接纳全球贸易或银行业思潮（或月度贸易与税收收入达 55）。"
 oe_msn_mal_12_west_african_gunpowder_empire:0 "西非火药黄金帝国永恒加冕"
 oe_msn_mal_12_west_african_gunpowder_empire_desc:0 "自塞内加尔河至乍得湖，灿烂黄金冠冕与近代火药劲旅共同护卫大一统尼日尔帝国跻身世界[great_power|e]。全域[prosperity|e]、学府[prestige|e]与稳固[crown_power|e]，携手开启西非黄金盛世崭新纪元。"
 oe_msn_mal_12_west_african_gunpowder_empire_req_tt:0 "自身或附庸拥有尼亚尼、廷巴克图与加奥，稳定度不低于 18，进入专制时代，首都发展度达 24，且跻身列强或月度贸易与税收收入达 75。"
 oe_msn_kil_destiny:0 "#bold #color_yellow 基尔瓦与斯瓦希里：印度洋季风共主天命#!#!"
 oe_msn_kil_destiny_DESCRIPTION:0 "自斯瓦希里珊瑚石城与索法拉金路迈向抗击西洋舰队与印度洋季风霸权"
 oe_msn_kil_destiny_CRITERIA_DESCRIPTION:0 "统合马林迪、蒙巴萨、桑给巴尔、基尔瓦至索法拉的珊瑚石城，打造武装三角帆船抗击西洋舰队，加冕印度洋季风海权共主。"
 oe_msn_kil_destiny_BUTTON_TOOLTIP:0 "开启基尔瓦—斯瓦希里天命"
 oe_msn_kil_destiny_BUTTON_DETAILS:0 "基尔瓦与斯瓦希里海岸十二任务三支柱天命链：兴建季风三角帆船坞与海防炮台以挫败西洋舰队，统合桑给巴尔、蒙巴萨、马林迪、索法拉与津巴布韦黄金走廊，以胡苏尼库布瓦商都与印度洋季风网加冕海权共主。"
 oe_msn_kil_01_swahili_coral_cities:0 "斯瓦希里珊瑚石城定鼎"
 oe_msn_kil_01_swahili_coral_cities_desc:0 "自基尔瓦岛至松戈姆纳拉，白灰珊瑚石清真寺、宏阔石砌码头与拱廊商庭矗立于碧波礁盘之上。精治海岛[capital|e]可稳步抬升沿岸[development|e]，笃定设拉子王室[legitimacy|e]并广聚季风[prosperity|e]。"
 oe_msn_kil_01_swahili_coral_cities_req_tt:0 "自身或附庸拥有基尔瓦岛与松戈姆纳拉（或蒙巴萨与桑给巴尔），稳定度不低于 5，且首都发展度达到 12。"
 oe_msn_kil_02_monsoon_dhow_shipyards:0 "季风武装三角帆船坞"
 oe_msn_kil_02_monsoon_dhow_shipyards_desc:0 "椰纤缝合的姆特佩舟与敏捷三角帆战船乘借东北与西南季风，往来阿曼与马达加斯加之间。扩建船坞[buildings|e]可育出精锐[sailors|e]并砥砺[navy_tradition|e]，令斯瓦希里武装[navy|e]扬帆远航。"
 oe_msn_kil_02_monsoon_dhow_shipyards_req_tt:0 "掌握至少一处海港，国库达 180 金币，且建有码头或拥有至少 3 座海港。"
 oe_msn_kil_03_coastal_cannon_batteries:0 "珊瑚石海防炮台与锁港铁链"
 oe_msn_kil_03_coastal_cannon_batteries_desc:0 "质地多孔的珊瑚石城墙可巧妙卸去铁弹猛烈冲击，配以横江锁港巨链令礁岸航道化作来犯舰队绝地。在海防[fort|e]遍置青铜重炮，既砺[army_tradition|e]与[navy_tradition|e]，亦牢守各港[control|e]。"
 oe_msn_kil_03_coastal_cannon_batteries_req_tt:0 "稳定度不低于 12，进入地理大发现时代，且建有城堡或铸炮坊（或海军传统达到 20）。"
 oe_msn_kil_04_defy_portuguese_armadas:0 "怒海折戟：挫败西洋铁炮舰队"
 oe_msn_kil_04_defy_portuguese_armadas_desc:0 "当西洋卡拉克铁炮帆船横行海面并强索独占通行证，武装三角帆船与礁岸重炮令东非碧浪成其葬身之地。融通舷炮[advances|e]与近代[institutions|e]，不仅稳守沿岸[maritime_presence|e]，更扬不屈[prestige|e]。"
 oe_msn_kil_04_defy_portuguese_armadas_req_tt:0 "自身或附庸拥有基尔瓦岛，稳定度不低于 15，进入宗教改革时代，建有造船厂或棱堡（或海军传统达 30），且掌握炮兵思潮或枪阵火器（或海军传统达 35）。"
 oe_msn_kil_05_zanzibar_pemba_straits:0 "桑给巴尔与巴加莫约海峡"
 oe_msn_kil_05_zanzibar_pemba_straits_desc:0 "温古贾岛与内陆象牙商队终点巴加莫约之间的避风水道，是深水泊地与腹地商路之枢纽。稳控两处[core|e]海峡可推升海岛[development|e]，执掌沿岸[trade|e]并强化对内陆门户的[control|e]。"
 oe_msn_kil_05_zanzibar_pemba_straits_req_tt:0 "自身或附庸拥有桑给巴尔与巴加莫约。"
 oe_msn_kil_06_mombasa_malindi_league:0 "蒙巴萨与马林迪北方石城联盟"
 oe_msn_kil_06_mombasa_malindi_league_desc:0 "终结蒙巴萨天然深水岛港与马林迪宽阔泊地数百年倾轧，将北方斯瓦希里珊瑚石城尽数收归一旗。整合两座[core|e]海防重港可广募熟谙季风的[sailors|e]，扩大北岸[maritime_presence|e]并拔升[navy_tradition|e]。"
 oe_msn_kil_06_mombasa_malindi_league_req_tt:0 "自身或附庸拥有蒙巴萨与马林迪。"
 oe_msn_kil_07_sofala_gold_ivory:0 "索法拉金港与莫桑比克海峡"
 oe_msn_kil_07_sofala_gold_ivory_desc:0 "自穆塔帕高原南运的沙金与上等象牙汇聚索法拉潮汐港湾，转输坎贝与阿拉伯诸国。稳据南岸[core|e]金港可令国库[gold|e]税源大增，既壮大海路[trade|e]，亦带旺海峡沿岸[prosperity|e]。"
 oe_msn_kil_07_sofala_gold_ivory_req_tt:0 "自身或附庸拥有索法拉以及莫桑比克或克利马内之一，拥有至少 28 处领地，且月度贸易与税收收入不低于 25。"
 oe_msn_kil_08_zimbabwe_gold_corridor:0 "津巴布韦金脉与全岸珊瑚链"
 oe_msn_kil_08_zimbabwe_gold_corridor_desc:0 "自大津巴布韦雄伟无泥巨石高塔至拉穆红树林群岛，一部统一关榷册籍同时统揽内陆金脉与珊瑚商港。贯通腹地[market|e]与海港[trade|e]大动脉，既能聚敛充盈[gold|e]，亦令海权王朝[crown_power|e]日隆。"
 oe_msn_kil_08_zimbabwe_gold_corridor_req_tt:0 "自身或附庸拥有索法拉及大津巴布韦或拉穆之一，进入地理大发现时代，且建有贸易枢纽或市场（或月度贸易与税收收入达 35）。"
 oe_msn_kil_09_husuni_kubwa_emporium:0 "胡苏尼库布瓦万国商庭"
 oe_msn_kil_09_husuni_kubwa_emporium_desc:0 "悬崖之巅的胡苏尼库布瓦宫殿群，将穹顶觐见厅与堆满明瓷与古吉拉特棉布的拱顶货栈融为一体。扩建商庭[buildings|e]可提升市民[estate_satisfaction|e]，既壮大中枢[market|e]，亦显赫王城[prestige|e]。"
 oe_msn_kil_09_husuni_kubwa_emporium_req_tt:0 "自身或附庸拥有基尔瓦岛，国库达 240 金币，且建有市场或行会大厅（或市民满意度达 55%）。"
 oe_msn_kil_10_swahili_chronicle_letters:0 "《基尔瓦编年史》与斯瓦希里文苑"
 oe_msn_kil_10_swahili_chronicle_letters_desc:0 "以优美斯瓦希里韵律与阿拉伯书法写就的《基尔瓦编年史》及史诗长歌，在沿岸各城清真寺间代代传诵。兴办经院[buildings|e]可显著提升海港[literacy|e]，厚植海洋[cultural_tradition|e]并广布[religious_influence|e]。"
 oe_msn_kil_10_swahili_chronicle_letters_req_tt:0 "自身或附庸拥有基尔瓦岛，进入文艺复兴时代，教士满意度不低于 50%，且建有伊斯兰经学院、图书馆或大学。"
 oe_msn_kil_11_monsoon_trade_network:0 "贯通印度洋的季风帆船商网"
 oe_msn_kil_11_monsoon_trade_network_desc:0 "斯瓦希里远洋商团在亚丁、马斯喀特、卡利卡特与马六甲广设商馆，随季风起落稳妥结算巨额跨海汇票。拥抱近代商业[institutions|e]可成就跨海[trade|e]霸权，广结[diplomatic_reputation|e]并稳握全洋[maritime_presence|e]。"
 oe_msn_kil_11_monsoon_trade_network_req_tt:0 "自身或附庸拥有基尔瓦岛与蒙巴萨，稳定度不低于 15，进入宗教改革时代，且接纳全球贸易或银行业思潮（或月度贸易与税收收入达 55）。"
 oe_msn_kil_12_lord_indian_ocean_rim:0 "印度洋环海永恒海权共主"
 oe_msn_kil_12_lord_indian_ocean_rim_desc:0 "自德尔加杜角至非洲之角，每一座珊瑚石商港与季风航道齐向跻身世界[great_power|e]的斯瓦希里帝国致敬。绵长[prosperity|e]、所向披靡的[navy|e]舰队与璀璨海洋[prestige|e]，共同加冕印度洋永恒共主。"
 oe_msn_kil_12_lord_indian_ocean_rim_req_tt:0 "自身或附庸拥有基尔瓦岛、蒙巴萨、桑给巴尔与索法拉，稳定度不低于 18，进入专制时代，首都发展度达 24，且跻身列强或月度贸易与税收收入达 75。"
 oe_msn_kon_destiny:0 "#bold #color_yellow 刚果与贝宁：赤道主权复兴天命#!#!"
 oe_msn_kon_destiny_DESCRIPTION:0 "自姆班扎刚果与贝宁青铜行会迈向刚果盆地统合、禁奴敕令与大西洋平等复兴"
 oe_msn_kon_destiny_CRITERIA_DESCRIPTION:0 "兴盛姆班扎刚果与贝宁青铜行会，统合赤道水系与大西洋商港，颁行禁奴主权敕令，成就中西非近代复兴盛世。"
 oe_msn_kon_destiny_BUTTON_TOOLTIP:0 "开启刚果—贝宁天命"
 oe_msn_kon_destiny_BUTTON_DETAILS:0 "刚果、贝宁与奥约十二任务三支柱天命链：修筑宏伟城垣、培育青铜行会与王家火枪亲军，颁布反奴隶贸易主权敕令，贯通刚果盆地与尼日尔三角洲至大西洋商港，开启外交平等与工艺昌明的中西非复兴。"
 oe_msn_kon_01_mbanza_benin_guilds:0 "姆班扎刚果与贝宁青铜行会"
 oe_msn_kon_01_mbanza_benin_guilds_desc:0 "伊贡街失蜡青铜工匠、姆班扎刚果王室冶铁行会与奥约织工，共同托起赤道王国的工艺殿堂。兴治王都[capital|e]可推升城邦[development|e]，厚待百工[estates|e]并稳固世代相承的王室[legitimacy|e]。"
 oe_msn_kon_01_mbanza_benin_guilds_req_tt:0 "自身或附庸拥有姆班扎刚果、贝宁或奥约伊莱之一，稳定度不低于 5，且首都发展度达到 12。"
 oe_msn_kon_02_bronze_wall_defenses:0 "巨型城防土垣与护城深壕"
 oe_msn_kon_02_bronze_wall_defenses_desc:0 "绵延数十里的伊亚巨型夯土城垣与引水成河的深邃濠沟环抱雨林王都，令茂林险道化作铜墙铁壁。不断修缮固守环城[fort|e]不仅砥砺[army_tradition|e]，更牢控腹地[control|e]而保社稷长久[stability|e]。"
 oe_msn_kon_02_bronze_wall_defenses_req_tt:0 "国库达 180 金币，稳定度不低于 10，且建有城堡（或陆军传统达到 15）。"
 oe_msn_kon_03_royal_flintlock_guards:0 "王家火枪亲军与铸械工坊"
 oe_msn_kon_03_royal_flintlock_guards_desc:0 "绝不仰赖海外商贾施舍火药与枪械，王室铸坊自主锻造枪管并整训精锐王宫火枪亲军，与重盾前锋协同作战。编练常备[regulars|e]可磨砺[army_tradition|e]，令赤道[army|e]借充沛[manpower|e]震慑四方。"
 oe_msn_kon_03_royal_flintlock_guards_req_tt:0 "稳定度不低于 12，进入地理大发现时代，且建有军械库或武器行会（或陆军传统达 22）。"
 oe_msn_kon_04_anti_slave_trade_edict:0 "王室禁绝奴隶贸易主权敕令"
 oe_msn_kon_04_anti_slave_trade_edict_desc:0 "遥承阿方索一世致里斯本的抗争国书，王室颁布主权敕令严禁人口贩运并缉拿不法贩奴船。严行[crown_power|e]可保全本土[manpower|e]生息，既获庶民[estate_satisfaction|e]，亦赢大西洋两岸[prestige|e]。"
 oe_msn_kon_04_anti_slave_trade_edict_req_tt:0 "稳定度不低于 15，进入宗教改革时代，农民满意度不低于 50%，且接纳全球贸易思潮或枪阵火器进步（或陆军传统达 32）。"
 oe_msn_kon_05_congo_niger_heartland:0 "统合刚果与尼日尔雨林腹心"
 oe_msn_kon_05_congo_niger_heartland_desc:0 "将古老神圣加冕圣城与刚果、尼日尔雨林腹地行省尽归王廷贡赋册籍，令各省总督直隶中央调遣。稳固本土[core|e]腹心既强化王权[control|e]，亦滋养赤道[prosperity|e]并长保宗室[stability|e]。"
 oe_msn_kon_05_congo_niger_heartland_req_tt:0 "自身或附庸拥有姆班扎刚果与姆班扎姆巴塔，或贝宁与乌戈通，或奥约伊莱与伊费。"
 oe_msn_kon_06_atlantic_river_ports:0 "扼守大西洋入海商港门户"
 oe_msn_kon_06_atlantic_river_ports_desc:0 "牢牢扼守索约刚果河口，或洛安果、埃科与瓦里潟湖良港，令远洋外舶唯遵王室关榷方可入港通商。严密经营入海[core|e]门户可招募水乡[sailors|e]，张扬几内亚湾[maritime_presence|e]并组建护海[navy|e]。"
 oe_msn_kon_06_atlantic_river_ports_req_tt:0 "自身或附庸拥有索约、洛安果、埃科或瓦里之一，并掌握至少一处海港。"
 oe_msn_kon_07_equatorial_basin_dominion:0 "刚果盆地与三角洲商道统御"
 oe_msn_kon_07_equatorial_basin_dominion_desc:0 "自罗安达海贝渔场至伊达与卡拉巴尔河口大市，满载红铜锭、棕榈油与岩盐的商舟络绎不绝。统筹大河流域[trade|e]可丰盈国库[gold|e]，促进跨区[market|e]融通并加深腹地[control|e]。"
 oe_msn_kon_07_equatorial_basin_dominion_req_tt:0 "拥有至少 24 处领地，月度贸易与税收收入达 22，且自身或附庸拥有罗安达、姆班扎索约、伊达或卡拉巴尔之一。"
 oe_msn_kon_08_congo_basin_hegemon:0 "刚果盆地与几内亚湾霸主"
 oe_msn_kon_08_congo_basin_hegemon_desc:0 "总揽刚果盆地与几内亚湾大河水系，将昔日各自为政的雨林诸邦凝为纵贯大西洋与腹心的共荣霸主。大力增修港埠[buildings|e]可借大河[trade|e]滋养全境[prosperity|e]，同时令四方[subjects|e]倾心归附。"
 oe_msn_kon_08_congo_basin_hegemon_req_tt:0 "拥有至少 36 处领地，进入地理大发现时代，且建有码头或贸易枢纽（或拥有至少 4 座海港）。"
 oe_msn_kon_09_atlantic_sovereign_diplomacy:0 "大西洋平等王室国交"
 oe_msn_kon_09_atlantic_sovereign_diplomacy_desc:0 "遣派身着礼服的贵族特使以平等仪节远赴里斯本、罗马与阿姆斯特丹，宣告赤道君主与海外列王分庭抗礼。善运跨洋[diplomacy|e]可拔升[diplomatic_reputation|e]，择善吸纳域外[institutions|e]并捍卫国交[prestige|e]。"
 oe_msn_kon_09_atlantic_sovereign_diplomacy_req_tt:0 "稳定度不低于 10，进入文艺复兴时代，且接纳封建制或文艺复兴思潮（或稳定度达 16）。"
 oe_msn_kon_10_brass_ivory_commerce:0 "青铜、锦布与胡椒兴商富国"
 oe_msn_kon_10_brass_ivory_commerce_desc:0 "精雕细琢的青铜浮雕牌、绒质拉菲草锦布、象牙盐罐与贝宁胡椒远销大西洋彼岸，倍受各国宫廷珍重。广设行会[buildings|e]既可换取丰厚[gold|e]，亦弘扬本土[cultural_tradition|e]并带动腹地[development|e]。"
 oe_msn_kon_10_brass_ivory_commerce_req_tt:0 "国库达 280 金币，且建有市场或行会大厅（或月度贸易与税收收入达 28）。"
 oe_msn_kon_11_equatorial_printing_courts:0 "赤道文书院与王室印书殿"
 oe_msn_kon_11_equatorial_printing_courts_desc:0 "王室印书殿并印基刚果、埃多、约鲁巴成文法典与域外格致论著，彻底摆脱外师束缚而自主培育文官贤才。兴办学堂[buildings|e]可广开[literacy|e]，令[cabinet|e]行政精敏并催生自主[advances|e]涌流。"
 oe_msn_kon_11_equatorial_printing_courts_req_tt:0 "稳定度不低于 15，进入宗教改革时代，且建有印刷工坊、大学或图书馆（或首都发展度达 20）。"
 oe_msn_kon_12_central_west_african_renaissance:0 "中西非赤道复兴永恒盛世"
 oe_msn_kon_12_central_west_african_renaissance_desc:0 "昂然屹立于大西洋东岸而不受任何外邦奴役，赤道帝国凭青铜学府、自主兵坊与平等洁净商贸跻身世界[great_power|e]。灿烂[prosperity|e]、深厚[cultural_tradition|e]与卓绝[prestige|e]，共同礼赞中西非赤道复兴永恒盛世。"
 oe_msn_kon_12_central_west_african_renaissance_req_tt:0 "拥有至少 45 处领地，稳定度不低于 18，进入专制时代，首都发展度达 24，且跻身列强或月度贸易与税收收入达 70。"
 oe_msn_iro_destiny:0 "#bold #color_yellow 易洛魁联邦：龟岛永恒长屋天命#!#!"
 oe_msn_iro_destiny_DESCRIPTION:0 "自《大和平法》与奥农达加圣火迈向林地火枪对等、五大湖霸权与龟岛主权联邦"
 oe_msn_iro_destiny_CRITERIA_DESCRIPTION:0 "以《大和平法》统合五部，编练林地火枪游骑实现武备对等，称雄五大湖水陆商道，建立龟岛永恒主权联邦。"
 oe_msn_iro_destiny_BUTTON_TOOLTIP:0 "开启易洛魁联邦天命"
 oe_msn_iro_destiny_BUTTON_DETAILS:0 "易洛魁联邦十二任务三支柱天命链：缔行《大和平法》、以奥农达加圣火统合五部并编练燧发火枪林地游骑，执掌尼亚加拉与五大湖毛皮转运霸权，以贝珠外交档案与成文联邦宪政加冕龟岛主权共和国。"
 oe_msn_iro_01_great_law_of_peace:0 "宣示《大和平法》与圣树誓约"
 oe_msn_iro_01_great_law_of_peace_desc:0 "苍翠和平大白松之下，缔和者与海华沙将战斧深埋地下奔流，化五部百年血仇为一炉同心的长屋誓约。谨守《大和平法》可固全境[stability|e]与议会[legitimacy|e]，滋养[capital|e]生机并远扬[prestige|e]。"
 oe_msn_iro_01_great_law_of_peace_req_tt:0 "自身或附庸拥有五部核心领地之一，稳定度不低于 5，且首都发展度达 8（或稳定度达 10）。"
 oe_msn_iro_02_longhouse_confederacy:0 "缔建奥农达加长屋联邦"
 oe_msn_iro_02_longhouse_confederacy_desc:0 "奥农达加中央议事圣火之侧，氏族长母共同推举五十位酋长议定国是，使东门至西门声气相通、同心一致。健全长屋联邦[parliament|e]既促核心[development|e]，亦协调各部[estates|e]并夯实整体[control|e]。"
 oe_msn_iro_02_longhouse_confederacy_req_tt:0 "成为易洛魁联邦或控制奥农达加与卡纳乔哈里，且建有粮仓或行会大厅（或稳定度达 10）。"
 oe_msn_iro_03_flintlock_woodland_parity:0 "毛皮换枪：林地游骑火器对等"
 oe_msn_iro_03_flintlock_woodland_parity_desc:0 "以厚实上等海狸毛皮换取精良荷英燧发枪并悉心培育本土枪匠，令林地游骑在莽林伏击中尽占火力先机。编组精锐游骑[regulars|e]可磨砺[army_tradition|e]，借火器[advances|e]铸就锐不可当的联邦[army|e]。"
 oe_msn_iro_03_flintlock_woodland_parity_req_tt:0 "国库达 180 金币，进入地理大发现时代，且建有武器行会或军械库（或陆军传统达到 18）。"
 oe_msn_iro_04_covenant_chain_sovereignty:0 "白银盟链武装主权平衡"
 oe_msn_iro_04_covenant_chain_sovereignty_desc:0 "屡屡擦亮白银盟链并在英法荷等大西洋列强间纵横捭阖，令长屋联邦武装自立、倍受各殖民总督竞相礼敬。娴熟[diplomacy|e]兼修近代[institutions|e]，既扬联邦[diplomatic_reputation|e]，亦固自主[crown_power|e]。"
 oe_msn_iro_04_covenant_chain_sovereignty_req_tt:0 "稳定度不低于 15，进入宗教改革时代，且接纳枪阵火器思潮或进步（或陆军传统达 28）。"
 oe_msn_iro_05_five_nations_united:0 "五部一统：自莫霍克至塞内卡"
 oe_msn_iro_05_five_nations_united_desc:0 "守望东门的莫霍克、奥奈达、圣火守护奥农达加、卡尤加与西门塞内卡五部精诚携手，并立于五指湖畔。一统祖地[core|e]可汇聚充沛[manpower|e]，既令湖谷[prosperity|e]日盛，亦扬长屋[prestige|e]于四邻。"
 oe_msn_iro_05_five_nations_united_req_tt:0 "成为易洛魁联邦，或自身及附庸拥有莫霍克至塞内卡全部五部祖地。"
 oe_msn_iro_06_mohawk_hudson_corridor:0 "萨拉托加—提康德罗加与安大略湖口"
 oe_msn_iro_06_mohawk_hudson_corridor_desc:0 "凡能控扼莫霍克河谷、尚普兰湖与安大略湖间水陆转运咽喉者，皆握北美东北部兵家必争之战略动脉。占领此间[core|e]水口可固边疆[fort|e]防务，广收河道[trade|e]关利并大幅强化东境[control|e]。"
 oe_msn_iro_06_mohawk_hudson_corridor_req_tt:0 "自身或附庸同时拥有萨拉托加与提康德罗加，或拥有奥斯威戈。"
 oe_msn_iro_07_niagara_huron_beaver_realm:0 "尼亚加拉险关与北方海狸猎场"
 oe_msn_iro_07_niagara_huron_beaver_realm_desc:0 "牢牢把守尼亚加拉大瀑险关与北方特卡伦托水陆捷径，令全洲最丰饶的北方海狸猎场尽归联邦调停统辖。稳握湖口[core|e]可将毛皮[trade|e]悉数汇入本邦[market|e]，令联邦府库[gold|e]财源滚滚而来。"
 oe_msn_iro_07_niagara_huron_beaver_realm_req_tt:0 "自身或附庸拥有尼亚加拉及特卡伦托或奥索萨内之一，拥有至少 30 处领地，且月度贸易与税收收入达 20。"
 oe_msn_iro_08_great_lakes_hegemony:0 "五大湖内海与河口总霸权"
 oe_msn_iro_08_great_lakes_hegemony_desc:0 "自麦基诺海峡、底特律河口直至潮涌的哈德逊河入海口，桦皮商舟与纵帆船皆悬海华沙盟带旗帜往来不绝。统御内海[trade|e]枢纽可强固湖海[maritime_presence|e]，广结[subjects|e]并播撒全域[prosperity|e]。"
 oe_msn_iro_08_great_lakes_hegemony_req_tt:0 "自身或附庸拥有尼亚加拉及底特律水道、麦基诺或曼哈顿之一，进入宗教改革时代，且建有贸易枢纽或市场（或月度贸易与税收收入达 35）。"
 oe_msn_iro_09_wampum_council_archives:0 "贝珠盟带档案馆与联邦雄辩术"
 oe_msn_iro_09_wampum_council_archives_desc:0 "紫白海贝精工编织的盟带将历代条约、氏族世系与联邦法典铭刻为活态史记，由守录长老当众庄严诵读。兴建档案[buildings|e]可厚植[cultural_tradition|e]，既广布[literacy|e]，亦助长联邦[diplomacy|e]雄辩之威。"
 oe_msn_iro_09_wampum_council_archives_req_tt:0 "稳定度不低于 10，进入文艺复兴时代，且建有图书馆或抄经室（或稳定度达 15）。"
 oe_msn_iro_10_fur_trade_treasury:0 "三姐妹粮仓与联邦毛皮金库"
 oe_msn_iro_10_fur_trade_treasury_desc:0 "玉米、攀豆与南瓜共生互补的三姐妹农田盈满桦皮地下窖仓，规范的毛皮拍卖亦为各部兴建筹集充裕公帑。增修仓储与集市[buildings|e]可推动[development|e]，厚积联邦[gold|e]并常保村社[prosperity|e]。"
 oe_msn_iro_10_fur_trade_treasury_req_tt:0 "国库达 260 金币，且建有粮仓或市场（或月度贸易与税收收入达 22）。"
 oe_msn_iro_11_federal_republic_turtle_island:0 "成文宪政长屋联邦"
 oe_msn_iro_11_federal_republic_turtle_island_desc:0 "以双语雕版刊行《大和平法》并健全联邦代议大会，令龟岛分权宪政典范声名远播大西洋两岸学界。融汇长屋[parliament|e]制衡与近代[institutions|e]，既广开民智[literacy|e]，亦固共和[stability|e]。"
 oe_msn_iro_11_federal_republic_turtle_island_req_tt:0 "稳定度不低于 15，进入宗教改革时代，接纳印刷术或新大陆思潮（或稳定度达 20），且建有印刷工坊或大学（或首都发展度达 18）。"
 oe_msn_iro_12_sovereign_confederacy_turtle_island:0 "龟岛永恒主权长屋联邦"
 oe_msn_iro_12_sovereign_confederacy_turtle_island_desc:0 "雄伟长屋联邦自碧波五大湖一路绵延至大西洋潮岸，已获世界东西列邦宫廷一致承认为北美主权[great_power|e]。自由[parliament|e]共治、全洲[prosperity|e]与巍然[prestige|e]，共同护佑龟岛主权联邦千秋万代长存。"
 oe_msn_iro_12_sovereign_confederacy_turtle_island_req_tt:0 "自身或附庸拥有奥农达加、卡纳乔哈里与尼亚加拉，稳定度不低于 18，进入专制时代，首都发展度达 22，且跻身列强或月度贸易与税收收入达 60。"
 oe_msn_may_destiny:0 "#bold #color_yellow 玛雅同盟：第二玛雅黄金时代天命#!#!"
 oe_msn_may_destiny_DESCRIPTION:0 "自玛雅潘同盟中兴与圣井梯田农政迈向丛林石堡、加勒比商舟与第二玛雅黄金时代"
 oe_msn_may_destiny_CRITERIA_DESCRIPTION:0 "横跨尤卡坦与佩滕重振玛雅潘同盟，兴盛圣井梯田农政与天文历算，营建丛林要塞击退征服者，开启第二玛雅黄金时代。"
 oe_msn_may_destiny_BUTTON_TOOLTIP:0 "开启玛雅同盟天命"
 oe_msn_may_destiny_BUTTON_DETAILS:0 "玛雅同盟十二任务三支柱天命链：统合玛雅潘、奇琴伊察、马尼、坎佩切与诺佩滕，编练霍尔坎贵族步兵并筑丛林石堡抗击征服者，执掌加勒比翡翠与可可商舟航线，以圣井水利、天文历算与草药防疫加冕第二玛雅黄金时代。"
 oe_msn_may_01_league_of_mayapan_revival:0 "玛雅潘同盟重兴定基"
 oe_msn_may_01_league_of_mayapan_revival_desc:0 "彻底弭平科科姆与修氏两大望族积年血仇，在玛雅潘洁白石灰岩城垣内重开穆尔特帕尔共治大议会。复兴中枢[capital|e]可拉动城邦[development|e]，重铸尤卡坦[legitimacy|e]并恢复半岛[stability|e]。"
 oe_msn_may_01_league_of_mayapan_revival_req_tt:0 "自身或附庸拥有玛雅潘、马尼或诺佩滕之一，稳定度不低于 5，且首都发展度达到 12。"
 oe_msn_may_02_holkan_noble_regiments:0 "整编霍尔坎贵族常备战团"
 oe_msn_may_02_holkan_noble_regiments_desc:0 "身披厚实盐浸硬棉甲、由百战纳科姆宿将统率的霍尔坎受薪贵族战团，全面取代了昔日农闲征发的临时乡勇。编练常备[regulars|e]可磨砺[army_tradition|e]，既强韧低地[army|e]战力，亦统合各邦[manpower|e]。"
 oe_msn_may_02_holkan_noble_regiments_req_tt:0 "国库达 180 金币，稳定度不低于 10，且建有城堡或武器行会（或陆军传统达到 15）。"
 oe_msn_may_03_jungle_bastions_steel:0 "雨林石灰岩堡垒与钢刃革新"
 oe_msn_may_03_jungle_bastions_steel_desc:0 "拆解重锻缴获船铁、修筑石灰岩甬道棱堡并依托地下暗井藏粮，将喀斯特密林化作令外敌胆寒的天然迷宫。固守雨林[fort|e]要隘可砥砺[army_tradition|e]，融入冶铁[advances|e]并牢控边疆[control|e]。"
 oe_msn_may_03_jungle_bastions_steel_req_tt:0 "稳定度不低于 12，进入地理大发现时代，且建有城堡或军械库（或陆军传统达到 22）。"
 oe_msn_may_04_defy_conquistadors:0 "丛林石堡破铁甲：力挫征服者"
 oe_msn_may_04_defy_conquistadors_desc:0 "正如钱波顿岸滩曾将西洋铁甲登陆军驱回怒涛，如今一统的玛雅火枪队与石堡防线彻底粉碎跨洋征服者远征。融汇近代[institutions|e]与战阵[advances|e]，既证玛雅[army|e]铁血，更铸不屈[prestige|e]。"
 oe_msn_may_04_defy_conquistadors_req_tt:0 "自身或附庸拥有玛雅潘与奇琴伊察，稳定度不低于 15，进入宗教改革时代，且接纳枪阵火器思潮或进步（或陆军传统达 32）。"
 oe_msn_may_05_chichen_itza_mani_union:0 "北尤卡坦圣三角：玛雅潘、奇琴伊察与马尼"
 oe_msn_may_05_chichen_itza_mani_union_desc:0 "将玛雅潘坚城、奇琴伊察巍峨羽蛇神金字塔与修氏马尼王廷联为一体，重塑北尤卡坦神圣三角格局。整合三座[core|e]名城可推动半岛[development|e]，厚植传统[religious_influence|e]并稳握北境[control|e]。"
 oe_msn_may_05_chichen_itza_mani_union_req_tt:0 "自身或附庸拥有玛雅潘、奇琴伊察与马尼。"
 oe_msn_may_06_puuk_champoton_coast:0 "墨西哥湾门户：坎佩切与钱波顿"
 oe_msn_may_06_puuk_champoton_coast_desc:0 "坎佩切石灰岩海湾与屡挫外敌的钱波顿河口，牢牢护佑着尤卡坦半岛西翼墨西哥湾门户。经略两处[core|e]良港可征募善驾风浪的普顿[sailors|e]，张扬海湾[maritime_presence|e]并打造沿岸[navy|e]。"
 oe_msn_may_06_puuk_champoton_coast_req_tt:0 "自身或附庸拥有坎佩切与钱波顿，并掌握至少一处海港。"
 oe_msn_may_07_peten_tikal_lowlands:0 "佩滕雨林盆地：诺佩滕与蒂卡尔古城"
 oe_msn_may_07_peten_tikal_lowlands_desc:0 "重修白石萨克贝古道直通湖岛要塞诺佩滕与高耸入云的蒂卡尔神庙，令古典腹地与北邦重联。复兴南境[core|e]故土既添雨林[prosperity|e]与[gold|e]税入，更令玛雅[prestige|e]重耀中美洲。"
 oe_msn_may_07_peten_tikal_lowlands_req_tt:0 "自身或附庸拥有诺佩滕与蒂卡尔，且拥有至少 24 处领地。"
 oe_msn_may_08_caribbean_jade_cacao_routes:0 "加勒比翡翠与可可商舟通衢"
 oe_msn_may_08_caribbean_jade_cacao_routes_desc:0 "满载莫塔瓜翡翠、可可与海盐的四十桨红杉商舟，沿埃卡布礁岸贯通洪都拉斯至希卡兰戈。执掌加勒比[trade|e]通衢可扩充港市[market|e]财富，丰盈国库[gold|e]并稳固海疆[maritime_presence|e]。"
 oe_msn_may_08_caribbean_jade_cacao_routes_req_tt:0 "自身或附庸拥有埃卡布以及查克特马尔或希卡兰戈之一，进入地理大发现时代，月度贸易与税收收入达 28，且建有码头或贸易枢纽（或拥有 4 座海港）。"
 oe_msn_may_09_cenote_terrace_agronomy:0 "圣井水利与雨林梯田农政"
 oe_msn_may_09_cenote_terrace_agronomy_desc:0 "灰泥蓄水圣井、低洼湿地台田与林下复合农政巧妙化解喀斯特半岛旱季之忧，保障万民岁稔年丰。兴修水利储粮[buildings|e]可稳步提升全域[development|e]，厚植农民[estate_satisfaction|e]并广布[prosperity|e]。"
 oe_msn_may_09_cenote_terrace_agronomy_req_tt:0 "自身或附庸拥有玛雅潘或诺佩滕，进入文艺复兴时代，且建有粮仓或引水渠系统（或农民满意度达 55%）。"
 oe_msn_may_10_venus_almanac_observatories:0 "金星历典与玛雅天文观象台"
 oe_msn_may_10_venus_almanac_observatories_desc:0 "圆形蜗牛观象塔顶之上，玛雅星象祭司以精妙的二十进位零值算术准确推演金星运行周期与日月交食。资助观象与藏书[buildings|e]可大幅推升[literacy|e]，既耀[cultural_tradition|e]，亦护树皮古籍[advances|e]。"
 oe_msn_may_10_venus_almanac_observatories_req_tt:0 "自身或附庸拥有玛雅潘，国库达 260 金币，且建有神庙或图书馆（或首都发展度达 16）。"
 oe_msn_may_11_mayan_medical_renaissance:0 "本草防疫院与双语典籍印坊"
 oe_msn_may_11_mayan_medical_renaissance_desc:0 "绝不任由域外瘟疫与烈火焚毁千年文明典籍，玛雅本草防疫院与双语印坊并存《奇兰巴兰》与雨林新药典。融汇医馆[buildings|e]与印刷[institutions|e]，既护生民[manpower|e]繁衍，亦令全境[literacy|e]日新。"
 oe_msn_may_11_mayan_medical_renaissance_req_tt:0 "稳定度不低于 15，进入宗教改革时代，接纳印刷术或新大陆思潮（或稳定度达 20），且建有医院或印刷工坊（或首都发展度达 20）。"
 oe_msn_may_12_second_mayan_golden_age:0 "第二玛雅黄金时代辉煌加冕"
 oe_msn_may_12_second_mayan_golden_age_desc:0 "新巴克顿纪元的巍峨石碑铭刻第二玛雅黄金时代，洁白石灰岩诸城已昂然屹立为加勒比主权[great_power|e]。兴盛[prosperity|e]、薪火不绝的[cultural_tradition|e]与卓然[prestige|e]，共贺玛雅盛世千秋永驻。"
 oe_msn_may_12_second_mayan_golden_age_req_tt:0 "自身或附庸拥有玛雅潘、奇琴伊察与诺佩滕，稳定度不低于 18，进入专制时代，首都发展度达 24，且跻身列强或月度贸易与税收收入达 65。"
