 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m1:0 "萨赫勒火药新军与索法铁骑"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m1:0 "索法重甲骑兵与精锐萨赫勒火绳枪步卒协同作战，横扫草原与撒哈拉绿洲战场。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m2:0 "尼日尔大河水师与河湾统主"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m2:0 "战船水师与沿岸河港将杰内、廷巴克图与加奥熔铸为畅通无阻的帝国大动脉。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m3:0 "桑科雷学府与跨撒哈拉商贸霸权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m3:0 "廷巴克图浩瀚藏书与王室金盐驼队令萨赫勒成为财富与学术双璧交辉的天下名枢。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_mal_m4:0 "永恒西非火药黄金帝国"
 STATIC_MODIFIER_DESC_oe_aa2_msn_mal_m4:0 "以黄金、学术与近代火炮统驭尼亚尼、廷巴克图与加奥，尼日尔帝国雄踞西非千秋不朽。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m1:0 "破浪折戟：抗击西洋舰队之盾"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m1:0 "轻捷炮装三角帆船与珊瑚礁海防炮台令东非每一座良港都化作来犯舰队的折戟之地。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m2:0 "索法拉—津巴布韦金象牙走廊"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m2:0 "畅通的内陆商路与南方门户将高原黄金与象牙源源不断汇入斯瓦希里王库。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m3:0 "季风帆船商网与斯瓦希里文华"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m3:0 "星盘领航帆船、斯瓦希里编年史与远洋商栈将东非紧密织入阿拉伯、印度与马来海贸网络。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kil_m4:0 "印度洋环海永恒季风共主"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kil_m4:0 "自索法拉、基尔瓦至蒙巴萨与桑给巴尔，斯瓦希里王旗乘季风而飘扬，独霸印度洋西岸千秋。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m1:0 "禁奴主权敕令与王家火枪卫队"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m1:0 "严禁掠民的港口缉私法度与王家火枪亲军护佑赤道人口根基与国家尊严。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m2:0 "刚果河盆地与几内亚湾共主"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m2:0 "贯通一体的雨林水网与大西洋自主商港将赤道非洲铸就为兴盛富强的贸易强国。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m3:0 "大西洋平等国使与赤道文书院"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m3:0 "平等外交使团、王家印书坊与举世赞叹的青铜象牙工坊赢得大西洋两岸持久敬重。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_kon_m4:0 "中西非赤道复兴盛世永存"
 STATIC_MODIFIER_DESC_oe_aa2_msn_kon_m4:0 "自刚果盆地至贝宁湾独立富强、工艺与宪制并耀，赤道王国盛名照彻千秋。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m1:0 "林地火枪对等与白银盟链威权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m1:0 "精锐林地火枪游骑与炉火纯青的白银盟链外交令大西洋列强不敢轻越雷池一步。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m2:0 "五大湖毛皮与水陆转运霸权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m2:0 "扼守尼亚加拉与北方湖网，将北美最丰饶的毛皮与内湖贸易尽数汇入长屋府库。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m3:0 "贝珠法典与龟岛联邦宪政"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m3:0 "成文化后的《大和平法》融合联邦协商、全民文教与平等邦谊，光耀北美东部林海。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_iro_m4:0 "龟岛永恒主权长屋联邦"
 STATIC_MODIFIER_DESC_oe_aa2_msn_iro_m4:0 "疆域自莫霍克河谷绵延至五大湖畔，大和平树荫庇一座永不屈服的北美大陆主权强邦。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m1:0 "丛林石堡铁壁与霍尔坎劲旅"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m1:0 "多层石灰岩丛林要塞、萨克贝伏击驰道与革新钢刃霍尔坎步兵粉碎一切外敌入侵。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m2:0 "加勒比翡翠可可商舟海权"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m2:0 "远航雪松巨舟与珊瑚礁灯塔贯通墨西哥湾盐场、尤卡坦良港与佩滕翡翠商道。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m3:0 "玛雅历算观象台与本草医学"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m3:0 "阶梯金字塔天文历算、圣井引水农政与本草防疫令玛雅诸城生生不息、学术昌明。"
 STATIC_MODIFIER_NAME_oe_aa2_msn_may_m4:0 "第二玛雅黄金时代千秋永耀"
 STATIC_MODIFIER_DESC_oe_aa2_msn_may_m4:0 "自玛雅潘、奇琴伊察至诺佩滕，浴火重生的玛雅文明以科学、武功与主权辉映中美洲千秋。"
 oe_msn_mal_destiny:0 "#bold #color_yellow 马里与桑海：尼日尔黄金帝国天命#!#!"
