 oe_msn_kil_11_monsoon_trade_network_desc:0 "以基尔瓦与蒙巴萨为双枢，执掌黄金、象牙、香料与瓷器的跨印度洋季风总贸易。"
 oe_msn_kil_11_monsoon_trade_network_req_tt:0 "拥有基尔瓦基西瓦尼与蒙巴萨、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_kil_12_lord_indian_ocean_rim:0 "印度洋环海永恒海权共主"
 oe_msn_kil_12_lord_indian_ocean_rim_desc:0 "以无敌季风舰队与珊瑚石城同盟统驭基尔瓦、蒙巴萨、桑给巴尔与索法拉，加冕印度洋永恒共主。"
 oe_msn_kil_12_lord_indian_ocean_rim_req_tt:0 "拥有基尔瓦基西瓦尼、蒙巴萨、桑给巴尔与索法拉、稳定度至少 18，且处于专制时代或之后。"
 oe_msn_kon_destiny:0 "#bold #color_yellow 刚果与贝宁：赤道主权复兴天命#!#!"
 oe_msn_kon_destiny_DESCRIPTION:0 "自姆班扎刚果与贝宁青铜行会迈向刚果盆地统合、禁奴敕令与大西洋平等复兴"
 oe_msn_kon_destiny_CRITERIA_DESCRIPTION:0 "兴盛姆班扎刚果与贝宁青铜行会，统合赤道水系与大西洋商港，颁行禁奴主权敕令，成就中西非近代复兴盛世。"
 oe_msn_kon_destiny_BUTTON_TOOLTIP:0 "开启刚果—贝宁天命"
 oe_msn_kon_destiny_BUTTON_DETAILS:0 "刚果、贝宁与奥约十二任务三支柱天命链：修筑宏伟城垣、培育青铜行会与王家火枪亲军，颁布反奴隶贸易主权敕令，贯通刚果盆地与尼日尔三角洲至大西洋商港，开启外交平等与工艺昌明的中西非复兴。"
 oe_msn_kon_01_mbanza_benin_guilds:0 "姆班扎刚果与贝宁青铜行会"
 oe_msn_kon_01_mbanza_benin_guilds_desc:0 "稳固姆班扎刚果、贝宁或奥约伊莱王基，特许王家青铜铸造与工艺行会。"
 oe_msn_kon_01_mbanza_benin_guilds_req_tt:0 "拥有姆班扎刚果、贝宁或奥约伊莱之一，且稳定度至少为 5。"
 oe_msn_kon_02_bronze_wall_defenses:0 "巨型城防土垣与护城深壕"
 oe_msn_kon_02_bronze_wall_defenses_desc:0 "扩建环城巨垣、瞭望堡楼与行省要塞，令王都与诸邦坚不可摧。"
 oe_msn_kon_02_bronze_wall_defenses_req_tt:0 "持有至少 180 金币，且稳定度至少为 10。"
 oe_msn_kon_03_royal_flintlock_guards:0 "王家火枪亲军与铸械工坊"
 oe_msn_kon_03_royal_flintlock_guards_desc:0 "编练常备王家火枪亲军并建本土修械铁坊，使王国武备足以匹敌远洋舰队陆战队。"
 oe_msn_kon_03_royal_flintlock_guards_req_tt:0 "稳定度至少为 12，且处于地理大发现时代或之后。"
 oe_msn_kon_04_anti_slave_trade_edict:0 "王室禁绝奴隶贸易主权敕令"
 oe_msn_kon_04_anti_slave_trade_edict_desc:0 "严检一切离港船只、铁腕禁绝贩卖良民之恶行，护佑赤道亿兆生民与国本元气。"
 oe_msn_kon_04_anti_slave_trade_edict_req_tt:0 "稳定度至少为 15，且处于宗教改革时代或之后。"
 oe_msn_kon_05_congo_niger_heartland:0 "统合刚果与尼日尔雨林腹心"
 oe_msn_kon_05_congo_niger_heartland_desc:0 "将姆班扎刚果与姆巴塔、贝宁与乌戈顿或奥约伊莱与伊费核心诸省紧握手中。"
 oe_msn_kon_05_congo_niger_heartland_req_tt:0 "拥有（姆班扎刚果与姆巴塔）、（贝宁与乌戈顿）或（奥约伊莱与伊费）组合之一。"
 oe_msn_kon_06_atlantic_river_ports:0 "扼守大西洋入海商港门户"
 oe_msn_kon_06_atlantic_river_ports_desc:0 "掌控索约、洛安戈、埃科或瓦里等大西洋河口要港，使远洋通商尽归本国税关。"
 oe_msn_kon_06_atlantic_river_ports_req_tt:0 "拥有索约、洛安戈、埃科或瓦里之一。"
 oe_msn_kon_07_equatorial_basin_dominion:0 "刚果盆地与三角洲商道统御"
 oe_msn_kon_07_equatorial_basin_dominion_desc:0 "将王国版图拓展至至少二十四个地块，涵盖富饶内河流域与沿海转运重镇。"
 oe_msn_kon_07_equatorial_basin_dominion_req_tt:0 "控制至少 24 个地块，并拥有罗安达、姆班扎索约、伊达或卡拉巴尔之一。"
 oe_msn_kon_08_congo_basin_hegemon:0 "刚果盆地与几内亚湾霸主"
 oe_msn_kon_08_congo_basin_hegemon_desc:0 "将三十六个丰饶雨林与沿海省市统合成赤道非洲最雄厚的经济引擎。"
 oe_msn_kon_08_congo_basin_hegemon_req_tt:0 "控制至少 36 个地块，且处于地理大发现时代或之后。"
 oe_msn_kon_09_atlantic_sovereign_diplomacy:0 "大西洋平等王室国交"
 oe_msn_kon_09_atlantic_sovereign_diplomacy_desc:0 "以完全平等的主权君主之礼与远洋诸朝互致国书、互设使节。"
 oe_msn_kon_09_atlantic_sovereign_diplomacy_req_tt:0 "稳定度至少为 10，且处于文艺复兴时代或之后。"
 oe_msn_kon_10_brass_ivory_commerce:0 "青铜、锦布与胡椒兴商富国"
 oe_msn_kon_10_brass_ivory_commerce_desc:0 "力推青铜艺术品、拉菲亚锦布、铜锭与胡椒出口，以正当繁华实业充实国库。"
 oe_msn_kon_10_brass_ivory_commerce_req_tt:0 "持有至少 280 金币。"
 oe_msn_kon_11_equatorial_printing_courts:0 "赤道文书院与王室印书殿"
 oe_msn_kon_11_equatorial_printing_courts_desc:0 "在王都融汇本土史官档案与近代活字印坊，兴盛多语外交与格致学术。"
 oe_msn_kon_11_equatorial_printing_courts_req_tt:0 "稳定度至少为 15，且处于宗教改革时代或之后。"
 oe_msn_kon_12_central_west_african_renaissance:0 "中西非赤道复兴永恒盛世"
 oe_msn_kon_12_central_west_african_renaissance_desc:0 "统驭四十五个不受外侮、富足昌明的行省，加冕璀璨永恒的中西非赤道复兴盛世。"
 oe_msn_kon_12_central_west_african_renaissance_req_tt:0 "控制至少 45 个地块、稳定度至少 18，且处于专制时代或之后。"
 oe_msn_iro_destiny:0 "#bold #color_yellow 易洛魁联邦：龟岛永恒长屋天命#!#!"
 oe_msn_iro_destiny_DESCRIPTION:0 "自《大和平法》与奥农达加圣火迈向林地火枪对等、五大湖霸权与龟岛主权联邦"
 oe_msn_iro_destiny_CRITERIA_DESCRIPTION:0 "以《大和平法》统合五部，编练林地火枪游骑实现武备对等，称雄五大湖水陆商道，建立龟岛永恒主权联邦。"
 oe_msn_iro_destiny_BUTTON_TOOLTIP:0 "开启易洛魁联邦天命"
 oe_msn_iro_destiny_BUTTON_DETAILS:0 "易洛魁联邦十二任务三支柱天命链：缔行《大和平法》、以奥农达加圣火统合五部并编练燧发火枪林地游骑，执掌尼亚加拉与五大湖毛皮转运霸权，以贝珠外交档案与成文联邦宪政加冕龟岛主权共和国。"
 oe_msn_iro_01_great_law_of_peace:0 "宣示《大和平法》与圣树誓约"
 oe_msn_iro_01_great_law_of_peace_desc:0 "在指湖或莫霍克祖地燃起和平圣火，开启五部团结建邦伟业。"
 oe_msn_iro_01_great_law_of_peace_req_tt:0 "拥有五部核心圣地之一，且稳定度至少为 5。"
 oe_msn_iro_02_longhouse_confederacy:0 "缔建奥农达加长屋联邦"
 oe_msn_iro_02_longhouse_confederacy_desc:0 "将东方门户莫霍克与护火核心奥农达加紧系于同一长屋联邦之中。"
 oe_msn_iro_02_longhouse_confederacy_req_tt:0 "成立易洛魁联邦（IRO），或同时拥有奥农达加（tsikahiotsisto）与卡纳乔哈里（canajoharie）。"
 oe_msn_iro_03_flintlock_woodland_parity:0 "毛皮换枪：林地游骑火器对等"
 oe_msn_iro_03_flintlock_woodland_parity_desc:0 "以毛皮贸易盈余装备精良燧发火枪，编练横扫密林的易洛魁林地游骑步兵。"
 oe_msn_iro_03_flintlock_woodland_parity_req_tt:0 "持有至少 180 金币，且处于地理大发现时代或之后。"
 oe_msn_iro_04_covenant_chain_sovereignty:0 "白银盟链武装主权平衡"
 oe_msn_iro_04_covenant_chain_sovereignty_desc:0 "以无敌林地火枪步兵配以纵横捭阖的白银盟链外交，令大西洋列强敬畏我疆。"
 oe_msn_iro_04_covenant_chain_sovereignty_req_tt:0 "稳定度至少为 15，且处于宗教改革时代或之后。"
 oe_msn_iro_05_five_nations_united:0 "五部一统：自莫霍克至塞内卡"
 oe_msn_iro_05_five_nations_united_desc:0 "自莫霍克河至塞内卡西境，将五部全部祖地议事席统于长屋旗帜之下。"
 oe_msn_iro_05_five_nations_united_req_tt:0 "成立易洛魁联邦（IRO），或同时拥有五部全部祖地核心地块。"
 oe_msn_iro_06_mohawk_hudson_corridor:0 "萨拉托加—提康德罗加与安大略湖口"
 oe_msn_iro_06_mohawk_hudson_corridor_desc:0 "扼守萨拉托加、提康德罗加或奥斯威戈水陆咽喉，尽握北方商舟来往要道。"
 oe_msn_iro_06_mohawk_hudson_corridor_req_tt:0 "同时拥有萨拉托加与提康德罗加，或拥有奥斯威戈。"
 oe_msn_iro_07_niagara_huron_beaver_realm:0 "尼亚加拉险关与北方海狸猎场"
 oe_msn_iro_07_niagara_huron_beaver_realm_desc:0 "夺占雄伟的尼亚加拉转运咽喉以及多伦多（tkaronto）或奥索萨内，独揽安大略—休伦毛皮通道。"
 oe_msn_iro_07_niagara_huron_beaver_realm_req_tt:0 "拥有尼亚加拉及多伦多/奥索萨内之一，且控制至少 30 个地块。"
 oe_msn_iro_08_great_lakes_hegemony:0 "五大湖内海与河口总霸权"
 oe_msn_iro_08_great_lakes_hegemony_desc:0 "自尼亚加拉将长屋国威延伸至底特律海峡、麦基诺或曼哈顿港，锁死北美核心动脉。"
 oe_msn_iro_08_great_lakes_hegemony_req_tt:0 "拥有尼亚加拉及底特律/麦基诺/曼哈顿之一，且处于宗教改革时代或之后。"
 oe_msn_iro_09_wampum_council_archives:0 "贝珠盟带档案馆与联邦雄辩术"
 oe_msn_iro_09_wampum_council_archives_desc:0 "在奥农达加设立常设贝珠盟约档案馆，令易洛魁外交礼仪与法理传扬四方。"
 oe_msn_iro_09_wampum_council_archives_req_tt:0 "稳定度至少为 10，且处于文艺复兴时代或之后。"
 oe_msn_iro_10_fur_trade_treasury:0 "三姐妹粮仓与联邦毛皮金库"
 oe_msn_iro_10_fur_trade_treasury_desc:0 "以丰产玉米豆瓜三姐妹农政配以规范毛皮关税，充实长屋联邦公库。"
 oe_msn_iro_10_fur_trade_treasury_req_tt:0 "持有至少 260 金币。"
 oe_msn_iro_11_federal_republic_turtle_island:0 "成文宪政长屋联邦"
 oe_msn_iro_11_federal_republic_turtle_island_desc:0 "颁行成文《大和平法》、双语学校与联邦仲裁庭，开创近代北美宪政联邦先河。"
 oe_msn_iro_11_federal_republic_turtle_island_req_tt:0 "稳定度至少为 15，且处于宗教改革时代或之后。"
 oe_msn_iro_12_sovereign_confederacy_turtle_island:0 "龟岛永恒主权长屋联邦"
 oe_msn_iro_12_sovereign_confederacy_turtle_island_desc:0 "以近代联邦盛世兼控奥农达加、卡纳乔哈里与尼亚加拉，加冕龟岛永不屈服的主权联邦。"
 oe_msn_iro_12_sovereign_confederacy_turtle_island_req_tt:0 "拥有奥农达加、卡纳乔哈里与尼亚加拉、稳定度至少 18，且处于专制时代或之后。"
 oe_msn_may_destiny:0 "#bold #color_yellow 玛雅同盟：第二玛雅黄金时代天命#!#!"
 oe_msn_may_destiny_DESCRIPTION:0 "自玛雅潘同盟中兴与圣井梯田农政迈向丛林石堡、加勒比商舟与第二玛雅黄金时代"
 oe_msn_may_destiny_CRITERIA_DESCRIPTION:0 "横跨尤卡坦与佩滕重振玛雅潘同盟，兴盛圣井梯田农政与天文历算，营建丛林要塞击退征服者，开启第二玛雅黄金时代。"
 oe_msn_may_destiny_BUTTON_TOOLTIP:0 "开启玛雅同盟天命"
 oe_msn_may_destiny_BUTTON_DETAILS:0 "玛雅同盟十二任务三支柱天命链：统合玛雅潘、奇琴伊察、马尼、坎佩切与诺佩滕，编练霍尔坎贵族步兵并筑丛林石堡抗击征服者，执掌加勒比翡翠与可可商舟航线，以圣井水利、天文历算与草药防疫加冕第二玛雅黄金时代。"
 oe_msn_may_01_league_of_mayapan_revival:0 "玛雅潘同盟重兴定基"
 oe_msn_may_01_league_of_mayapan_revival_desc:0 "稳固玛雅潘、马尼或诺佩滕城基，重振古老的玛雅城邦共治同盟。"
 oe_msn_may_01_league_of_mayapan_revival_req_tt:0 "拥有玛雅潘、马尼或诺佩滕之一，且稳定度至少为 5。"
 oe_msn_may_02_holkan_noble_regiments:0 "整编霍尔坎贵族常备战团"
 oe_msn_may_02_holkan_noble_regiments_desc:0 "整编身披盐浸硬棉甲的职业霍尔坎贵族战团，精熟热带雨林闪电攻坚。"
 oe_msn_may_02_holkan_noble_regiments_req_tt:0 "持有至少 180 金币，且稳定度至少为 10。"
 oe_msn_may_03_jungle_bastions_steel:0 "雨林石灰岩堡垒与钢刃革新"
 oe_msn_may_03_jungle_bastions_steel_desc:0 "在尤卡坦丘陵与佩滕湖岸营建石灰岩堡垒，同时仿造精钢武器与火器装备守军。"
 oe_msn_may_03_jungle_bastions_steel_req_tt:0 "稳定度至少为 12，且处于地理大发现时代或之后。"
 oe_msn_may_04_defy_conquistadors:0 "丛林石堡破铁甲：力挫征服者"
 oe_msn_may_04_defy_conquistadors_desc:0 "令玛雅潘与奇琴伊察在跨洋入侵风暴中岿然不动，昭告玛雅本土永不可征服。"
 oe_msn_may_04_defy_conquistadors_req_tt:0 "拥有玛雅潘与奇琴伊察、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_may_05_chichen_itza_mani_union:0 "北尤卡坦圣三角：玛雅潘、奇琴伊察与马尼"
 oe_msn_may_05_chichen_itza_mani_union_desc:0 "统合科科姆与休氏故地并收复奇琴伊察圣井金字塔，定鼎尤卡坦北部核心。"
 oe_msn_may_05_chichen_itza_mani_union_req_tt:0 "拥有玛雅潘、奇琴伊察与马尼。"
 oe_msn_may_06_puuk_champoton_coast:0 "墨西哥湾门户：坎佩切与钱波顿"
 oe_msn_may_06_puuk_champoton_coast_desc:0 "掌控西岸良港坎佩切（kaan_peech）与钱波顿（chakan_putum），握紧墨西哥湾盐运与海防。"
 oe_msn_may_06_puuk_champoton_coast_req_tt:0 "拥有坎佩切（kaan_peech）与钱波顿（chakan_putum）。"
 oe_msn_may_07_peten_tikal_lowlands:0 "佩滕雨林盆地：诺佩滕与蒂卡尔古城"
 oe_msn_may_07_peten_tikal_lowlands_desc:0 "收复佩滕湖心岛堡诺佩滕与巍峨古都蒂卡尔（yax_mutal），南北玛雅重归一统。"
 oe_msn_may_07_peten_tikal_lowlands_req_tt:0 "拥有诺佩滕与蒂卡尔（yax_mutal），且控制至少 24 个地块。"
 oe_msn_may_08_caribbean_jade_cacao_routes:0 "加勒比翡翠与可可商舟通衢"
 oe_msn_may_08_caribbean_jade_cacao_routes_desc:0 "兼控埃卡布与切图马尔（chactemal）或西卡兰科，独占环半岛加勒比海商舟大航线。"
 oe_msn_may_08_caribbean_jade_cacao_routes_req_tt:0 "拥有埃卡布及切图马尔或西卡兰科，且处于地理大发现时代或之后。"
 oe_msn_may_09_cenote_terrace_agronomy:0 "圣井水利与雨林梯田农政"
 oe_msn_may_09_cenote_terrace_agronomy_desc:0 "整修岩溶圣井蓄水池、石墙果园与湿地台田，供养繁盛稠密的玛雅大城。"
 oe_msn_may_09_cenote_terrace_agronomy_req_tt:0 "拥有玛雅潘或诺佩滕，且处于文艺复兴时代或之后。"
 oe_msn_may_10_venus_almanac_observatories:0 "金星历典与玛雅天文观象台"
 oe_msn_may_10_venus_almanac_observatories_desc:0 "在玛雅潘广建天文观象台与树皮纸历典库，令玛雅零位算术与历法代代光大。"
