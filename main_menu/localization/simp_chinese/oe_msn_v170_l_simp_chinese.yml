 oe_msn_mal_11_trans_saharan_hegemony_req_tt:0 "拥有廷巴克图及昆比萨利赫或卡诺、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_mal_12_west_african_gunpowder_empire:0 "西非火药黄金帝国永恒加冕"
 oe_msn_mal_12_west_african_gunpowder_empire_desc:0 "以近代火药军团、桑科雷学术与滚滚黄金统合尼亚尼、廷巴克图与加奥，圆成松迪亚塔与阿斯基亚千秋伟业。"
 oe_msn_mal_12_west_african_gunpowder_empire_req_tt:0 "拥有尼亚尼、廷巴克图与加奥、稳定度至少 18，且处于专制时代或之后。"
 oe_msn_kil_destiny:0 "#bold #color_yellow 基尔瓦与斯瓦希里：印度洋季风共主天命#!#!"
 oe_msn_kil_destiny_DESCRIPTION:0 "自斯瓦希里珊瑚石城与索法拉金路迈向抗击西洋舰队与印度洋季风霸权"
 oe_msn_kil_destiny_CRITERIA_DESCRIPTION:0 "统合马林迪、蒙巴萨、桑给巴尔、基尔瓦至索法拉的珊瑚石城，打造武装三角帆船抗击西洋舰队，加冕印度洋季风海权共主。"
 oe_msn_kil_destiny_BUTTON_TOOLTIP:0 "开启基尔瓦—斯瓦希里天命"
 oe_msn_kil_destiny_BUTTON_DETAILS:0 "基尔瓦与斯瓦希里海岸十二任务三支柱天命链：兴建季风三角帆船坞与海防炮台以挫败西洋舰队，统合桑给巴尔、蒙巴萨、马林迪、索法拉与津巴布韦黄金走廊，以胡苏尼库布瓦商都与印度洋季风网加冕海权共主。"
 oe_msn_kil_01_swahili_coral_cities:0 "斯瓦希里珊瑚石城定鼎"
 oe_msn_kil_01_swahili_coral_cities_desc:0 "稳固基尔瓦基西瓦尼与松戈姆纳拉（或蒙巴萨与桑给巴尔）的珊瑚石城统治，开启海权征程。"
 oe_msn_kil_01_swahili_coral_cities_req_tt:0 "拥有基尔瓦基西瓦尼与松戈姆纳拉（或蒙巴萨与桑给巴尔），且稳定度至少为 5。"
 oe_msn_kil_02_monsoon_dhow_shipyards:0 "季风武装三角帆船坞"
 oe_msn_kil_02_monsoon_dhow_shipyards_desc:0 "扩建东非硬木船坞，建造精于珊瑚礁海战与远洋护航的斯瓦希里武装三角帆船。"
 oe_msn_kil_02_monsoon_dhow_shipyards_req_tt:0 "拥有海港且持有至少 180 金币。"
 oe_msn_kil_03_coastal_cannon_batteries:0 "珊瑚石海防炮台与锁港铁链"
 oe_msn_kil_03_coastal_cannon_batteries_desc:0 "在外洋战舰现身南方海平线之前，以珊瑚石海防棱堡与青铜长炮锁死各港航道。"
 oe_msn_kil_03_coastal_cannon_batteries_req_tt:0 "稳定度至少为 12，且处于地理大发现时代或之后。"
 oe_msn_kil_04_defy_portuguese_armadas:0 "怒海折戟：挫败西洋铁炮舰队"
 oe_msn_kil_04_defy_portuguese_armadas_desc:0 "以战果昭告四海：东非珊瑚石堡与炮装三角帆船绝不向任何外洋通行执照与总督屈膝。"
