 oe_msn_kil_09_husuni_kubwa_emporium:0 "胡苏尼库布瓦万国商庭"
 oe_msn_kil_09_husuni_kubwa_emporium_desc:0 "将基尔瓦悬崖珊瑚宫与万国商庭建设为东非最璀璨的海洋商业中心。"
 oe_msn_kil_09_husuni_kubwa_emporium_req_tt:0 "拥有基尔瓦基西瓦尼，且持有至少 240 金币。"
 oe_msn_kil_10_swahili_chronicle_letters:0 "《基尔瓦编年史》与斯瓦希里文苑"
