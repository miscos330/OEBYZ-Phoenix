 oe_tmc.1.a: "照此出征"
 oe_tmc.1.a.tt: "观望和抗命的军区这次不出兵\n若征伐大胜，可以再追究抗命的军区"
 oe_tmc.1.b: "出钱让抗命者出兵"
 oe_tmc.1.b.tt: "−[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_pay_cost').GetValue|0]金币（每个抗命军区#Y 60#!）\n抗命的军区改为应召，各出#Y 1#!个团（边疆军区出骑兵；本次征召总数不超过#Y 8#!个团）\n战争压力 −[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0]（收回抗命带来的压力）"
 oe_tmc.1.c: "以军法相胁"
 oe_tmc.1.c.tt: "抗命的军区忠诚#R −10#!，并计入忠诚目标#Y 5#!年\n抗命的军区改为应召，各出#Y 1#!个团（边疆军区出骑兵；本次征召总数不超过#Y 8#!个团）\n战争压力 −[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0]（收回抗命带来的压力）"
 oe_tmc.2.t: "前锋之请"
 oe_tmc.2.desc: "979年3月，巴尔达斯·福卡斯在潘卡利亚亲自出阵，与叛将巴尔达斯·斯克莱罗斯单打独斗。斯克莱罗斯身受重伤，叛军随即溃散。将军冲在最前面，一战就能定局；可他一旦倒下，全军也会跟着动摇。\n\n[SCOPE.sCountry('oe_tmc_theme').GetName]的[SCOPE.sCharacter('oe_tmc_strat').GetName]请求亲自统率前锋，说这是[SCOPE.sCountry('oe_tmc_theme').GetName]的士兵应得的荣誉。"
 oe_tmc.2.a: "准其所请"
 oe_tmc.2.a.tt: "当前征伐进度#G +6#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[SCOPE.sCharacter('oe_tmc_strat').GetName]立下头功：若这场征伐以大胜告终，[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]凯旋时会功高震主\n#Y 20%#!：一个月后[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]在前锋战死"
 oe_tmc.2.b: "前锋另派他人"
 oe_tmc.2.b.tt: "当前征伐进度#G +3#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#R −3#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.3.t: "征兵迟缓"
 oe_tmc.3.desc: "十世纪，领有军役田的士兵要么亲自出征，要么出钱供养一名士兵；到十一世纪，兵役大多已经折成了钱。帕列奥列格时代，约翰·塔尔哈尼奥特斯在1298到1300年间整顿色雷斯西翁军区的普洛尼亚，想把封地重新变成兵员；他一离开，改革就没了下文。\n\n[SCOPE.sCountry('oe_tmc_theme').GetName]的[SCOPE.sCharacter('oe_tmc_strat').GetName]来信说，地方上的领主还在收庄稼，兵马要晚些才能出发。信里没有说晚多久。"
 oe_tmc.3.a: "派钦差督促"
 oe_tmc.3.a.tt: "[oe_tu_authority|e]#R −2#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n[SCOPE.sCountry('oe_tmc_theme').GetName]改为应召，出#Y 1#!个团（边疆军区出骑兵；本次征召总数不超过#Y 8#!个团）"
 oe_tmc.3.b: "准其折钱代役"
 oe_tmc.3.b.tt: "[SCOPE.sCountry('oe_tmc_theme').GetName]从金库交出最多#Y 100#!金币给国库\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#G +3#!，并计入忠诚目标#Y 5#!年\n[SCOPE.sCountry('oe_tmc_theme').GetName]仍不算应召"
 oe_tmc.3.c: "不再催促"
 oe_tmc.3.c.tt: "当前征伐战争压力#R +3#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]仍不算应召"
 oe_tmc.4.t: "阵前争功"
 oe_tmc.4.desc: "1040年，乔治·马尼阿克斯在西西里打了胜仗，敌将却从海上逃走。他怪罪统领舰队的斯特凡，当众羞辱了他。斯特凡是皇帝的姻亲，一封告状信送回京城，马尼阿克斯就被召回下狱，西西里不久又得而复失。\n\n[SCOPE.sCountry('oe_tmc_theme').GetName]的[SCOPE.sCharacter('oe_tmc_strat').GetName]和[SCOPE.sCountry('oe_tmc_theme2').GetName]的[SCOPE.sCharacter('oe_tmc_strat2').GetName]在营中争功，都说是对方贻误了战机。两边的士兵已经不肯同营。"
 oe_tmc.4.a: "支持[SCOPE.sCharacter('oe_tmc_strat').GetName]"
 oe_tmc.4.a.tt: "当前征伐进度#G +3#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#G +5#!，[SCOPE.sCountry('oe_tmc_theme2').GetName]忠诚#R −8#!，均计入忠诚目标#Y 5#!年"
 oe_tmc.4.b: "支持[SCOPE.sCharacter('oe_tmc_strat2').GetName]"
 oe_tmc.4.b.tt: "当前征伐进度#G +3#!\n[SCOPE.sCountry('oe_tmc_theme2').GetName]忠诚#G +5#!，[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#R −8#!，均计入忠诚目标#Y 5#!年"
 oe_tmc.4.c: "令二人各让一步"
 oe_tmc.4.c.tt: "[oe_tu_authority|e]#R −2#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]和[SCOPE.sCountry('oe_tmc_theme2').GetName]忠诚各#G +2#!，均计入忠诚目标#Y 5#!年\n调解耗了时日：当前征伐战争压力#R +3#!"
 oe_tmc.5.t: "将军阵亡"
 oe_tmc.5.desc: "990年代，塞萨洛尼基督军格里高利·塔罗尼特斯的儿子阿硕特率前锋追击保加利亚人，中了萨穆伊尔的埋伏。格里高利带着主力赶去救援，战死阵中。\n\n[SCOPE.sCountry('oe_tmc_theme').GetName]的[SCOPE.sCharacter('oe_tmc_fallen').GetName]在前线阵亡。按军区的规矩，部将已经接过兵权，新的将军也已选出。全军都在看朝廷怎样对待死者。"
 oe_tmc.5.a: "国葬并抚恤遗属"
 oe_tmc.5.a.tt: "#R −100#!金币\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#G +8#!，并计入忠诚目标#Y 5#!年\n当前征伐战争压力#G −3#!"
 oe_tmc.5.b: "就地安葬，战事要紧"
 oe_tmc.5.b.tt: "[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#R −3#!，并计入忠诚目标#Y 5#!年\n当前征伐战争压力#R +3#!"
 oe_tmc.6.t: "军区论功"
 oe_tmc.6.desc1: "按旧例，出征归来，有功的将军会得到朝廷的尊衔和赏赐。\n\n这场征伐以大胜告终。应召出兵的[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_rew').GetValue|0]个军区都在等着论功行赏。"
 oe_tmc.6.desc2: "按旧例，出征归来，有功的将军会得到朝廷的尊衔和赏赐。\n\n这场征伐以议和收场。应召出兵的[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_rew').GetValue|0]个军区出了力，也在等朝廷的回报。"
 oe_tmc.6.desc: "1071年在曼齐刻尔特，统领后备军的安德罗尼库斯·杜卡斯不顾皇帝的命令，径直撤回营地，败局由此而定。打了败仗，总要有人来担罪责。\n\n这场征伐以败退告终。应召出兵的[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_rew').GetValue|0]个军区折了兵马，边疆军区要独自面对得势的敌人。"
 oe_tmc.6.a: "加授尊衔"
 oe_tmc.6.a.tt: "[oe_tu_authority|e]#R −3#!\n应召的军区忠诚#G +10#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.6.b: "赏赐金帛"
 oe_tmc.6.b.tt: "−[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_gift_cost').GetValue|0]金币（每个应召军区#Y 40#!，最多#Y 400#!）\n应召的军区忠诚#G +8#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.6.c: "荣耀归于皇帝"
 oe_tmc.6.c.tt: "威望#G +10#!\n应召的军区忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.6.d: "皇帝引咎"
 oe_tmc.6.d.tt: "合法性#R −5#!\n应召的军区忠诚#R −3#!；边疆军区（不论是否应召）忠诚再#R −3#!；均计入忠诚目标#Y 5#!年"
 oe_tmc.6.e: "归咎将军"
 oe_tmc.6.e.tt: "应召的军区忠诚#R −5#!；边疆军区（不论是否应召）忠诚再#R −5#!；均计入忠诚目标#Y 5#!年"
 oe_tmc.6.f: "抚恤阵亡将士"
 oe_tmc.6.f.tt: "#R −150#!金币\n应召的军区忠诚#R −2#!；边疆军区（不论是否应召）忠诚再#R −5#!；均计入忠诚目标#Y 5#!年"
 oe_tmc.7.t: "追究抗命"
 oe_tmc.7.desc: "利奥六世约900年写成的《战术》专有一章讲军中刑罚，按罪行轻重，从死刑、肉刑到赔偿和罚金不等。\n\n征伐已经大胜。当初公开抗命、拒不出兵的[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_pun').GetValue|0]个军区，如今都派人来京城道贺。朝中有人说，现在正是清算的时候。"
 oe_tmc.7.a: "撤换抗命的将军"
 oe_tmc.7.a.tt: "[oe_tu_authority|e]#G +2#!\n每个抗命的军区：#Y 80%#!：将军卸任，由新将军接任；#Y 20%#!：将军拒不交权，下月起兵"
 oe_tmc.7.b: "罚没军区金库"
 oe_tmc.7.b.tt: "每个抗命的军区从金库交出最多#Y 100#!金币给国库，忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.7.c: "既往不咎"
 oe_tmc.7.c.tt: "[oe_tu_authority|e]#R −2#!\n抗命的军区忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.8.t: "功高震主"
 oe_tmc.8.desc1: "970年，巴尔达斯·斯克莱罗斯在阿卡迪奥波利斯大败罗斯人，从此深得军心。976年朝廷解除他在东方的兵权，他的士兵就跟着他起兵，叛乱打了三年才平定。\n\n[SCOPE.sCountry('oe_tmc_theme').GetName]的[SCOPE.sCharacter('oe_tmc_strat').GetName]从前线凯旋。京城的百姓在街上喊[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]的名字，老兵们说只认[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]的旗号。[SCOPE.sCountry('oe_tmc_theme').GetName]的忠诚已经低于#Y 40#!，兵力又在各军区中排在前三，宫中已经有人说[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]在觊觎皇位。"
 oe_tmc.8.desc: "970年，巴尔达斯·斯克莱罗斯在阿卡迪奥波利斯大败罗斯人，从此深得军心。976年朝廷解除他在东方的兵权，他的士兵就跟着他起兵，叛乱打了三年才平定。\n\n[SCOPE.sCountry('oe_tmc_theme').GetName]的[SCOPE.sCharacter('oe_tmc_strat').GetName]从前线凯旋。京城的百姓在街上喊[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]的名字，老兵们说只认[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]的旗号。"
 oe_tmc.8.a: "为[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]举行凯旋式"
 oe_tmc.8.a.tt: "威望#G +5#!，合法性#R −5#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年\n[SCOPE.sCountry('oe_tmc_theme').GetName]军务效率#G +10#!（#Y 5#!年）"
 oe_tmc.8.b: "召入京城，授以高位"
 oe_tmc.8.b.tt: "[oe_tu_authority|e]#R −2#!\n[SCOPE.sCharacter('oe_tmc_strat').GetName]卸任，由新将军接任\n[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_tmc.8.c: "收缴兵权"
 oe_tmc.8.c.tt: "[oe_tu_authority|e]#R −3#!\n[SCOPE.sCountry('oe_tmc_theme').GetName]一半的军队（向上取整）改归帝国\n[SCOPE.sCountry('oe_tmc_theme').GetName]当前忠诚#R −10#!\n#Y 10#!年内不能再次收缴[SCOPE.sCountry('oe_tmc_theme').GetName]的兵权"
 oe_tmc.8.d: "不加理会"
 oe_tmc.8.d.tt: "[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年\n若[SCOPE.sCountry('oe_tmc_theme').GetName]忠诚跌破#Y 40#!且兵力居各军区前三，[SCOPE.sCharacter('oe_tmc_strat').GetName]就会觊觎皇位：宫廷阴谋发生政变时，有#Y 40%#!的可能由[SCOPE.sCharacter('oe_tmc_strat').GetSheHe]带兵篡位"
