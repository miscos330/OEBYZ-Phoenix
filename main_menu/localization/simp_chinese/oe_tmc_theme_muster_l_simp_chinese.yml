l_simp_chinese:
 oe_tmc.1.t: "军区征召"
 oe_tmc.1.desc1: "十世纪的皇帝出征之前，先传檄各军区。各军区的兵马自带给养，到马拉吉纳、多利莱昂、卡伊萨雷亚等集结营地与御营会合；君士坦丁七世的出征条例把这些营地从西到东一一列出。帕列奥列格王朝的常备军很少，1321年只有约三千骑兵，打大仗要靠领有普洛尼亚的骑士应召。\n\n征伐埃及的诏令已经传到各军区。\n\n应召出兵：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_sent').GetValue|0]#!个军区，共#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_regs').GetValue|0]#!个团\n观望拖延：[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_late').GetValue|0]个军区\n公开抗命：#R [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_refused').GetValue|0]#!个军区，战争压力已因此 +[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0]\n\n（“忠贞”的军区出#Y 2#!个团，步兵、骑兵各#Y 1#!；“平稳”的出#Y 1#!个团，边疆军区出骑兵，其余出步兵；一场征伐最多征召#Y 8#!个团，超出的军区留守本地，仍算应召。“离心”的观望拖延；“离叛”的公开抗命，每个使战争压力#R +3#!，最多#R +15#!。战后论功只算应召的军区。）"
 oe_tmc.1.desc2: "十世纪的皇帝出征之前，先传檄各军区。各军区的兵马自带给养，到马拉吉纳、多利莱昂、卡伊萨雷亚等集结营地与御营会合；君士坦丁七世的出征条例把这些营地从西到东一一列出。帕列奥列格王朝的常备军很少，1321年只有约三千骑兵，打大仗要靠领有普洛尼亚的骑士应召。\n\n征伐北非的诏令已经传到各军区。\n\n应召出兵：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_sent').GetValue|0]#!个军区，共#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_regs').GetValue|0]#!个团\n观望拖延：[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_late').GetValue|0]个军区\n公开抗命：#R [GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_n_refused').GetValue|0]#!个军区，战争压力已因此 +[GetCountry('BYZ').MakeScope.GetVariable('oe_tmc_refuse_press').GetValue|0]\n\n（“忠贞”的军区出#Y 2#!个团，步兵、骑兵各#Y 1#!；“平稳”的出#Y 1#!个团，边疆军区出骑兵，其余出步兵；一场征伐最多征召#Y 8#!个团，超出的军区留守本地，仍算应召。“离心”的观望拖延；“离叛”的公开抗命，每个使战争压力#R +3#!，最多#R +15#!。战后论功只算应召的军区。）"
