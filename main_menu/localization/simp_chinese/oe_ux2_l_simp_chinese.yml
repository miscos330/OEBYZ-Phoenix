 STATIC_MODIFIER_DESC_oe_ux2_mod_global_suzerain_compact: "明晰划定的跨洋宗主势力圈稳固远方保护国与属邦秩序，并显著增强本朝在列强折冲中的话语权。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_oceanic_trade_portolans: "特许远洋商港针路簿"
 STATIC_MODIFIER_DESC_oe_ux2_mod_oceanic_trade_portolans: "经官方核校的远洋港湾水深图与季风船期表降低海运损耗，令海贸效率与商队运力节节攀升。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_imperial_corridor_charter: "贯陆驰道驿站特许令"
 STATIC_MODIFIER_DESC_oe_ux2_mod_imperial_corridor_charter: "纵横交错的驰道干线与驿传站所将边陲与京畿连为一体，商旅货流与军政急递均大幅提速。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_canal_rail_engineering_corps: "大运河与蒸汽铁道工兵团"
 STATIC_MODIFIER_DESC_oe_ux2_mod_canal_rail_engineering_corps: "皇家水利测绘师与蒸汽机车工程师统筹勘定船闸、跨谷桥隧与铁道枢纽，催生全境开发与思潮传播。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_fiscal_toll_registry: "水陆干线关津税籍统录"
 STATIC_MODIFIER_DESC_oe_ux2_mod_fiscal_toll_registry: "统一稽核的桥闸、运河与驿站关津账册杜绝中饱私囊，将干线商流财富稳步汇入国库。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_imperial_granary_almanac: "皇家农时与常平仓历书"
 STATIC_MODIFIER_DESC_oe_ux2_mod_imperial_granary_almanac: "遍布郡县的寒潮预警与常平仓存粮稽核令朝廷得以抢在严冬荒歉之前调运赈粮，稳固社稷民心。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_parliamentary_census_charter: "议会国势普查与合议宪章"
 STATIC_MODIFIER_DESC_oe_ux2_mod_parliamentary_census_charter: "向议会与大公会议公开透明的国势账册化解党派猜忌，增强法案支持度与君主合法性。"
 STATIC_MODIFIER_NAME_oe_ux2_mod_quarantine_frontier_watch: "疫疠与灾荒边防巡察司"
 STATIC_MODIFIER_DESC_oe_ux2_mod_quarantine_frontier_watch: "依托帝国驿道构建的疫疠快报与边防巡察网及早阻断灾疫蔓延，维系地方控制与文教传承。"
 oe_ux2.1.t: "帝国御制舆图馆与国家大账册"
 oe_ux2.1.desc: "宫廷舆图大师与度支主事在御前图阁正式呈献六幅战略专题舆图与十五项统一度量国家账册指标。无论是四十七大命运任务强权与行省控制梯度，还是宗藩势力圈与帝国水陆干线，欧亚天下的兴衰脉络皆可一览无余。"
 oe_ux2.1.a: "设立帝国御制舆图测绘署"
 oe_ux2.1.b: "统一度量组建大司农鱼鳞账册总署"
 oe_ux2.1.c: "颁行鸿胪宗藩疆界图谱"
 oe_ux2.2.t: "子午线地球仪与跨洋宗藩势力圈"
 oe_ux2.2.desc: "黄铜浑天仪与手绘羊皮地球仪矗立于大殿中央。各国使节沿经纬子午线勘定跨洋宗藩势力圈与远洋航路，精密权衡远方保护国、朝贡体系与海贸节点如何重塑世界列强格局。"
 oe_ux2.2.a: "向水师颁授本初子午航海星图册"
 oe_ux2.2.b: "缔结跨洋宗藩势力圈协约"
 oe_ux2.2.c: "敕颁特许远洋商港针路簿"
 oe_ux2.3.t: "帝国驰道、大运河与蒸汽枢纽总勘"
 oe_ux2.3.desc: "自各省归来的工部勘察使汇集了涵盖铺装官道、帝国驿路、大运河船闸与新兴蒸汽铁道枢纽的贯陆总图。借由精确定位交通干线瓶颈，朝廷得以将星散市镇锻造为高效运转的帝国经济大动脉。"
 oe_ux2.3.a: "扩充贯陆驰道驿站特许令"
 oe_ux2.3.b: "组建大运河与蒸汽铁道工兵团"
 oe_ux2.3.c: "整顿水陆干线关津税籍统录"
 oe_ux2.4.t: "小冰期气候农历与大账册国势审计"
 oe_ux2.4.desc: "绵延不绝的寒潮、起伏难测的收成与局部疫疠促使中枢将气候灾荒舆图与常平仓及议会审计合璧推行。凭借气候志与粮储账册的提前预警，明君得以在严冬饥馑酿成动乱之前妥善抚民防灾。"
 oe_ux2.4.a: "颁行皇家农时与常平仓历书"
 oe_ux2.4.b: "向议会与大公会议呈递国势普查账册"
 oe_ux2.4.c: "设立疫疠与灾荒边防巡察司"
