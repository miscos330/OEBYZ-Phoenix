 STATIC_MODIFIER_DESC_oe_cul2_hyb_anatolia_auton_mod:0 "沿袭地方行会与村社旧制以保全税源与宗教宽容，同时维持既有族群界线。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_magna_sym_mod:0 "大希腊—意拜海洋合流"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_magna_sym_mod:0 "希腊古典学者西传与意大利航海法典、银行术东来相得益彰，催生文艺复兴与海商双丰收。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_magna_assim_mod:0 "亚得里亚—爱琴海主流整合"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_magna_assim_mod:0 "以统一帝国法典和官学收编海港精英，强化主流文化传统与立法秩序。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_magna_auton_mod:0 "海洋商埠自治特许"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_magna_auton_mod:0 "尊重威尼斯、热那亚与南意商邦原有自治居留区，以换取丰厚商贸网络与市民效忠。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_yuan_sym_mod:0 "汉蒙色目文教合流"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_yuan_sym_mod:0 "双语国子监、色目天文历算与中原科举文官融为一体，将多民族帝国结构转化为独特治理红利。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_yuan_assim_mod:0 "大一统礼法归宗"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_yuan_assim_mod:0 "以礼法统一与皇室集权引导南北族群趋同，加速同化并巩固皇权。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_yuan_auton_mod:0 "因俗而治·诸族各安"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_yuan_auton_mod:0 "汉法与草原旧制分途并举，换得各阶层安稳纳税与宗教和睦。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_rus_sym_mod:0 "罗斯—草原驿骑融合"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_rus_sym_mod:0 "归附鞑靼王公、哥萨克边民与草原驿站制度融入罗斯军政体系，显著强化轻骑战力与疆域通联。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_rus_assim_mod:0 "伏尔加—草原王化整合"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_rus_assim_mod:0 "以城寨、修院与官府迁民稳步将草原边区纳入东斯拉夫主流治理体系。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_rus_auton_mod:0 "卡西莫夫式边藩自治"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_rus_auton_mod:0 "保留鞑靼世袭封邑与哥萨克军区自治以换取充沛边防兵源与纵深防御。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_balkan_sym_mod:0 "巴尔干希斯东正学术共同体"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_balkan_sym_mod:0 "阿索斯山、奥赫里德与特尔诺沃抄经院织就希腊语与教会斯拉夫语并行之文教网络，显著消弭巴尔干族群隔阂。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_balkan_assim_mod:0 "巴尔干主流文教一统"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_balkan_assim_mod:0 "以统一礼仪语言与官学体系推动巴尔干山地向核心文化靠拢，提升文化影响与立法效率。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_balkan_auton_mod:0 "巴尔干修院与乡里共治"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_balkan_auton_mod:0 "尊重巴尔干各族地方教区与乡里传统，赢得教士与农民阶层拥戴并大幅压低分离情绪。"
 oe_cul2_hyb.1.t:0 "安纳托利亚的双重血脉"
 oe_cul2_hyb.1.d:0 "历经数代征战与通商，安纳托利亚的希腊匠人、卡帕多细亚村社与突厥边防骑兵已在市集、丝坊与宫廷诗会中彼此交织。从科尼亚到士麦那，地方长老与行会代表齐聚朝堂，请示帝国应如何定调这片丰饶高原的文明未来。"
 oe_cul2_hyb.1.a:0 "倡导希土双语共生，融汇丝路商贸与边防骑射"
 oe_cul2_hyb.1.b:0 "兴办官学与军区教化，稳步引归主体正统"
 oe_cul2_hyb.1.c:0 "恪守各族乡里与行会旧例，以宽容换取长治久安"
 oe_cul2_hyb.2.t:0 "大希腊的再起：意拜海洋文明合流"
 oe_cul2_hyb.2.d:0 "希腊抄本学者跨海西赴意大利城邦讲授柏拉图与修昔底德，而威尼斯、热那亚与那不勒斯的航海法典、复式簿记与火炮造船术亦源源东流。横跨爱琴海与亚得里亚海的商港精英正呼吁将这场双向交流制度化。"
 oe_cul2_hyb.2.a:0 "赞助双语人文学院与海事商馆，共享文艺复兴红利"
 oe_cul2_hyb.2.b:0 "借帝国法典统合港市精英，巩固主流文化正统"
 oe_cul2_hyb.2.c:0 "维持各海洋商埠自治特许，全力拓展地中海商路"
 oe_cul2_hyb.3.t:0 "大都的百语枢机"
 oe_cul2_hyb.3.d:0 "在大都的国子监、司天台与江南书肆之间，中原经史、蒙古草原法统与畏兀儿、波斯色目学者的天文算术正激荡出前所未见的欧亚帝国气象。朝中儒臣与草原宗王就如何平衡多族治理展开了决定性辩论。"
 oe_cul2_hyb.3.a:0 "定立双语国子监与色目历算院，化多族为帝国红利"
 oe_cul2_hyb.3.b:0 "以大一统礼法与官学统合朝野，加速核心认同凝聚"
 oe_cul2_hyb.3.c:0 "坚持因俗而治、南北分途，确保各阶层安居纳赋"
 oe_cul2_hyb.4.t:0 "伏尔加与顿河之风"
 oe_cul2_hyb.4.d:0 "随着东斯拉夫拓垦者沿大河挺进钦察草原，归附的鞑靼王公、自由哥萨克军团与古老的草原驿站体系正在重塑北境帝国的军事与行政脉络。杜马与边疆总督请旨裁定如何安顿这股桀骜而强悍的边疆力量。"
 oe_cul2_hyb.4.a:0 "吸纳草原驿站与归附骑兵战术，打造欧亚边防劲旅"
 oe_cul2_hyb.4.b:0 "筑堡迁民并推行东斯拉夫官府教化，稳步同化草原"
 oe_cul2_hyb.4.c:0 "仿卡西莫夫旧例敕封边藩自治，换取永固边疆兵源"
 oe_cul2_hyb.5.t:0 "阿索斯至特尔诺沃"
 oe_cul2_hyb.5.d:0 "在阿索斯山圣山修院、奥赫里德教座与特尔诺沃抄经院之间，希腊语神学经典与教会斯拉夫语译本正日夜流转。共同的东正礼仪与静修传统为化解巴尔干群山间的族群宿怨提供了历史契机。"
 oe_cul2_hyb.5.a:0 "资助希腊语与教会斯拉夫语双语抄经院，共建东正学术共同体"
 oe_cul2_hyb.5.b:0 "以统一官学与牧首礼仪引导巴尔干走向核心文化一统"
 oe_cul2_hyb.5.c:0 "敕保各族修院与乡里自治权，彻底消弭巴尔干分离动荡"
 oe_cul2_cap.1.t:0 "文化之都·君士坦丁堡光华"
 oe_cul2_cap.1.d:0 "从圣索菲亚穹顶到金角湾畔的书院与画坊，君士坦丁堡再度令东西方学者、使节与匠师心驰神往。在欧亚七大历史名城的年度文化影响力竞逐中，新罗马傲然折桂，荣膺当今世界文化之都！"
 oe_cul2_cap.1.a:0 "广迎四方贤达，令新罗马文脉播于四海"
 oe_cul2_cap.1.b:0 "深耕帝国典章与古典传承，固本培元"
 oe_cul2_cap.2.t:0 "文化之都·永恒之城罗马"
 oe_cul2_cap.2.d:0 "台伯河畔的石碑、图书馆与艺术作坊重焕生机，雕塑家、法学家与人文大师从欧洲各地纷至沓来。罗马在欧亚七大文化首都竞逐中脱颖而出，赢得当今世界文化之都的崇高桂冠！"
 oe_cul2_cap.2.a:0 "宣扬永恒之城风雅，广布宫廷语言与艺术声望"
 oe_cul2_cap.2.b:0 "将此盛誉化为恒久学术传统与国祚安宁"
 oe_cul2_cap.3.t:0 "文化之都·塞纳河畔巴黎"
 oe_cul2_cap.3.d:0 "巴黎的大学讲坛、宫廷沙龙与印刷工坊正成为各国贵族与学者争相效仿的典范。在欧亚七大文化首都年度竞逐中，巴黎力压群雄，荣登世界文化之都宝座！"
 oe_cul2_cap.3.a:0 "以巴黎风尚引领列国宫廷与文坛"
 oe_cul2_cap.3.b:0 "厚植学院根基，巩固王国文化传统"
 oe_cul2_cap.4.t:0 "世界文化之都：大都万国衣冠来朝"
 oe_cul2_cap.4.d:0 "大都的观象台、国子监、书肆与礼乐仪轨令陆海丝路上的使节与旅人叹为观止。在欧亚七大文化首都年度评比中，这座东方巨都傲视群伦，获誉世界文化之都！"
 oe_cul2_cap.4.a:0 "颁行典籍礼乐，使天下慕华风而归心"
 oe_cul2_cap.4.b:0 "以文教礼制润泽苍生，永固四海安宁"
 oe_cul2_cap.5.t:0 "文化之都·尼罗河明珠开罗"
 oe_cul2_cap.5.d:0 "爱资哈尔经学院的讲席、尼罗河商埠的译馆与宏伟穹顶清真寺汇聚了横跨地中海与印度洋的智慧之光。在欧亚七大文化首都竞逐中，开罗脱颖而出，荣膺世界文化之都！"
 oe_cul2_cap.5.a:0 "兴盛爱资哈尔讲学，令四海学子负笈而来"
 oe_cul2_cap.5.b:0 "珍藏典籍经卷，绵延百年学术道统"
 oe_cul2_cap.6.t:0 "文化之都·丝路蓝穹撒马尔罕"
 oe_cul2_cap.6.d:0 "列吉斯坦广场的琉璃经学院、精密天文台与波斯突厥双语诗坛令撒马尔罕熠熠生辉，成为连接河中、波斯、印度与中原的智慧心脏。撒马尔罕荣登欧亚七大文化首都之巅！"
 oe_cul2_cap.6.a:0 "广邀丝路星算大师与画匠，扬名欧亚"
 oe_cul2_cap.6.b:0 "兴修书院驿馆，厚积河中文脉根基"
 oe_cul2_cap.7.t:0 "文化之都·白石之城莫斯科"
 oe_cul2_cap.7.d:0 "克里姆林宫的金顶圣堂、皇家印书坊与博学史官令北境文脉蔚然大观，令欧洲与草原诸国刮目相看。莫斯科在欧亚七大文化首都竞逐中后来居上，荣膺世界文化之都！"
 oe_cul2_cap.7.a:0 "向四方彰显白石都城之威仪与文华"
 oe_cul2_cap.7.b:0 "深化圣堂书院与史馆传统，奠定万年基业"
 oe_cul2_cap.8.t:0 "文化霸权易主"
 oe_cul2_cap.8.d:0 "四方使节与游学名士纷纷议论，欧亚另一座大都会在文化影响力与文教盛名上已悄然超越我国，夺走了世界文化之都的桂冠。面对这场跨越百年的软实力竞逐，朝廷须即刻作出回应！"
 oe_cul2_cap.8.a:0 "启动宫廷重金兴艺计划，誓夺文化影响力桂冠"
 oe_cul2_cap.8.b:0 "推进书院格致与识字革新，以学术底蕴厚积薄发"
 oe_cul2_cap.9.t:0 "区域文明灯塔：帝国都城享誉一方"
 oe_cul2_cap.9.d:0 "凭借卓越的文化影响力、繁华都市规模与兴盛的学府艺苑，我国所辖的文化名城已在所属欧亚大区拔得头筹，荣膺区域文明灯塔之誉。继续兴建大学、书院与艺术杰作，便可冲击全球世界文化之都的至高桂冠！"
 oe_cul2_cap.9.a:0 "以此为基，向世界文化之都迈进"
