 oe_cul2_priv_accepted_guild_charter:0 "接受族群行会特许状"
 oe_cul2_priv_accepted_guild_charter_desc:0 "允许被接受文化的商贾与工匠在帝国商港组建受保护的同乡行会与公证庭，显著提升海港贸易力与市民满意度，代价是让渡部分王室直征税率与市民阶层权势。"
