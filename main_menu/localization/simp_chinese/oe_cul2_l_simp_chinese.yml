 STATIC_MODIFIER_DESC_oe_cul2_rivalry_patronage_mod:0 "为夺回世界文化之都桂冠，朝廷不惜加重宫廷开支以广延大师、兴建艺苑。"
 STATIC_MODIFIER_NAME_oe_cul2_rivalry_academy_mod:0 "文化反超·书院格致革新"
 STATIC_MODIFIER_DESC_oe_cul2_rivalry_academy_mod:0 "面对宿敌的文化超越，帝国转而深耕书院教育、学术传统与全民识字以厚积薄发。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_anatolia_sym_mod:0 "希土安纳托利亚共生体"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_anatolia_sym_mod:0 "希腊宫廷丝织、鲁姆诗歌与安纳托利亚边防轻骑融会贯通，换来持久商贸与文化辐射，代价是同化节奏放缓。"
 STATIC_MODIFIER_NAME_oe_cul2_hyb_anatolia_assim_mod:0 "安纳托利亚有序整合"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_anatolia_assim_mod:0 "通过兴办军区学堂与官府教化稳步推进安纳托利亚向主体认同靠拢，代价是短期阶层摩擦上升。"
