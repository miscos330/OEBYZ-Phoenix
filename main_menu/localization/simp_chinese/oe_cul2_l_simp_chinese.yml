 STATIC_MODIFIER_NAME_oe_cul2_world_cultural_capital_mod:0 "世界文化之都"
 STATIC_MODIFIER_DESC_oe_cul2_world_cultural_capital_mod:0 "在欧亚七大历史名城年度文化影响力竞逐中折桂，赢得无可争议的软实力霸权、外交威望与顶尖名家云集。"
