 oe_orthodox_defender_1: "正教卫道骑兵"
 oe_orthodox_defender_1_desc: "出身保加利亚与塞尔维亚的勇士，世代熟习轻骑侦察与侧翼驰击。如今，默西亚与特里巴利的军营为他们披上重甲，使忠诚与勇猛化为帝国阵线两翼的坚实屏障。他们在圣像与军旗下列阵，以坚韧的队列迎击敌军。"
