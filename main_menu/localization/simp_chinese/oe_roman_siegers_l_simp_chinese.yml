l_simp_chinese:
 oe_roman_sieger_3_normal: "罗马攻城者"
 oe_roman_sieger_3_normal_desc: "帝国的攻城者让丈量城墙、勘定炮位与持续轰击成为一门严谨的技艺。工程军官计算射界，炮手校准装药，辎重队则源源不断地运来火药与炮弹，直到坚城为皇帝敞开大门。"
