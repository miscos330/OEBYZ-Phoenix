 oe_hetaireia_imperial_artillery: "帝国炮兵体系"
 oe_hetaireia_imperial_artillery_desc: "将分散的铸炮工坊、军械仓库与炮兵训练纳入同一套帝国规制。炮手接受共同的操典，工程军官拥有清晰的指挥权限，使每一次围城都能汇聚帝国的火力。\n\n罗马攻城者额外获得：轰击效率参数 #G +0.1#!、兵力伤害 #G +10%#!、主动性 #G +1#!。"
 OE_ROMAN_SIEGERS_UPGRADE_TT: "将现有罗马攻城者升级为帝国炮兵体系对应型号，保留所在时代。"
 OE_ROMAN_SIEGERS_DOWNGRADE_TT: "将现有罗马攻城者恢复为普通型号，移除本特权提供的额外加成。"
 OE_ORTHODOX_DEFENDER_BARRACKS: "默西亚与特里巴利军营"
 OE_ORTHODOX_DEFENDER_CAP_TT: "正教卫道骑兵数量尚未达到默西亚、特里巴利文化地点上的赫泰里亚军营总数；所有时代共用名额。"
