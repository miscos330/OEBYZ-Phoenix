 oe_yk.1.t: "高丽请命"
 oe_yk.1.desc_r1ln: "#F 高丽国王世为元朝驸马，新王即位，要由元廷降诏册封。至正十一年（1351年），元廷废忠定王，改立在大都宿卫多年的王祺，是为恭愍王（通说）。#!\n\n高丽新王遣使入朝，奉表请命，求赐册封与印信。高丽一向恭顺，使臣言辞谦卑。若准其所请，高丽当献上谢恩方物，约值#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（高丽三个月的收入）。"
 oe_yk.1.desc_r1l: "#F 高丽国王世为元朝驸马。新王即位，要遣使到大都请命，由元廷降诏册封、赐给印信，才算名正言顺。#!\n\n高丽新王遣使入朝，奉表请命，求赐册封与印信。高丽一向恭顺，使臣言辞谦卑。若准其所请，高丽当献上谢恩方物，约值#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（高丽三个月的收入）。"
 oe_yk.1.desc_r1on: "#F 高丽国王世为元朝驸马，新王即位，要由元廷降诏册封。至正十一年（1351年），元廷废忠定王，改立在大都宿卫多年的王祺，是为恭愍王（通说）。#!\n\n高丽新王遣使入朝请封。使臣礼数周全，话里却听得出高丽朝中自有主张。若准其所请，高丽当献上谢恩方物，约值#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（高丽三个月的收入）。"
 oe_yk.1.desc_r1o: "#F 高丽国王世为元朝驸马。新王即位，要遣使到大都请命，由元廷降诏册封、赐给印信，才算名正言顺。#!\n\n高丽新王遣使入朝请封。使臣礼数周全，话里却听得出高丽朝中自有主张。若准其所请，高丽当献上谢恩方物，约值#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（高丽三个月的收入）。"
 oe_yk.1.desc_r2ln: "#F 元朝公主下嫁高丽国王，已成惯例。至正九年（1349年），在大都宿卫的王祺娶魏王之女宝塔实里，即后来的鲁国大长公主（一说）。#!\n\n高丽遣使请婚：国王愿尚元室之女，以续两国的姻亲。高丽国中亲元的大臣极力促成此事。"
 oe_yk.1.desc_r2l: "#F 自忠烈王尚元世祖之女以来，元朝公主下嫁高丽国王，已成惯例。高丽的驸马之制，只许国王娶宗主家族的女子。#!\n\n高丽遣使请婚：国王愿尚元室之女，以续两国的姻亲。高丽国中亲元的大臣极力促成此事。"
 oe_yk.1.desc_r2on: "#F 元朝公主下嫁高丽国王，已成惯例。至正九年（1349年），在大都宿卫的王祺娶魏王之女宝塔实里，即后来的鲁国大长公主（一说）。#!\n\n高丽遣使请婚：国王愿尚元室之女。此议多半出于国王本人，高丽朝中未必齐心。"
 oe_yk.1.desc_r2o: "#F 自忠烈王尚元世祖之女以来，元朝公主下嫁高丽国王，已成惯例。高丽的驸马之制，只许国王娶宗主家族的女子。#!\n\n高丽遣使请婚：国王愿尚元室之女。此议多半出于国王本人，高丽朝中未必齐心。"
 oe_yk.1.desc_r3l: "#F 元廷向高丽索取贡女，高丽人家有女儿的，往往早早嫁出，以免被选中。据说元统年间（1333–1335年）前后，高丽人李穀上书请罢贡女，元廷一度听从（一说）。#!\n\n高丽遣使上书，请罢每年选送的贡女。表文说，百姓为避选女，女儿往往早嫁，民间怨声不断。高丽素来恭顺，此请措辞恳切。"
 oe_yk.1.desc_r3o: "#F 元廷向高丽索取贡女，高丽人家有女儿的，往往早早嫁出，以免被选中。据说元统年间（1333–1335年）前后，高丽人李穀上书请罢贡女，元廷一度听从（一说）。#!\n\n高丽遣使上书，请罢每年选送的贡女。表文说，百姓为避选女，女儿往往早嫁，民间怨声不断。措辞虽恭，其意甚坚。"
 oe_yk.1.desc_r4l: "#F 高丽有事，往往向元廷求援求赐；元廷的赏赐，向来也是羁縻属国的手段。#!\n\n高丽遣使来，陈说国中艰难，请朝廷赐予钱帛。使臣说，高丽世受国恩，危难之际只能仰仗朝廷。"
 oe_yk.1.desc_r4o: "#F 高丽有事，往往向元廷求援求赐；元廷的赏赐，向来也是羁縻属国的手段。#!\n\n高丽遣使来，陈说国中艰难，请朝廷赐予钱帛。使臣话说得客气，求的却是实打实的钱。"
 oe_yk.1.desc_r5l: "#F 元朝在辽阳设沈王封号，以王氏旁支统管辽东高丽遗民。自王暠以来，沈王一系世尚蒙古公主、久居大都，每逢高丽换王，便常上书争讼高丽王位。#!\n\n高丽新王遣使入朝请封，不料沈王一系也趁机上书大都，称高丽王位本应由沈王兼领，请求朝廷改立。高丽向来恭顺，此番王位之争，全看朝廷如何裁断。"
 oe_yk.1.desc_r5o: "#F 元朝在辽阳设沈王封号，以王氏旁支统管辽东高丽遗民。自王暠以来，沈王一系世尚蒙古公主、久居大都，每逢高丽换王，便常上书争讼高丽王位。#!\n\n高丽新王遣使入朝请封，沈王一系也同时上书大都，力陈高丽朝政难驯，自请权署高丽国事。两造俱在京师候旨，高丽王位归属一时悬而未决。"
 oe_yk.1.desc_x: "#F 高丽有事，往往向元廷求援求赐；元廷的赏赐，向来也是羁縻属国的手段。#!\n\n高丽遣使入朝。"
 oe_yk.1.a: "准封，赐印诰"
 oe_yk.1.a.tt: "花费#R 1#!个月的贸易与税收收入\n高丽献上谢恩方物约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（不足时有多少给多少），归本国\n高丽新王受封；高丽正统#G +5#!\n蒙古影响（原版计数）#Y +1#!"
 oe_yk.1.b: "准封，命世子入侍为质"
 oe_yk.1.b.tt: "照准封，不收方物\n高丽对本国的好感#R −10#!（#bold #color_yellow 质子宿卫#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y +2#!"
 oe_yk.1.c: "不准，令别议"
 oe_yk.1.c.tt: "高丽正统#R −10#!；国王仍未受封，下次请命时还会再请\n高丽对本国的好感#R −20#!（#bold #color_yellow 不准册封#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y −2#!\n不废立国王"
 oe_yk.1.d: "赐婚宗室女"
 oe_yk.1.d.tt: "花费#R 2#!个月的贸易与税收收入\n一位孛儿只斤氏的宗室女嫁给高丽国王\n高丽对本国的好感#G +20#!（#bold #color_yellow 尚主#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y +2#!"
 oe_yk.1.e: "许以后议"
 oe_yk.1.e.tt: "#Y 48#!个月后高丽可以再请"
 oe_yk.1.f: "驳回"
 oe_yk.1.f.tt: "高丽对本国的好感#R −10#!（#bold #color_yellow 请婚见拒#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y −1#!"
 oe_yk.1.g: "准其所请"
 oe_yk.1.g.tt: "儒臣称颂仁政\n高丽对本国的好感#G +15#!（#bold #color_yellow 罢贡女#!#!，#Y 60#!个月）\n高丽稳定#G +2.5#!"
 oe_yk.1.h: "照旧选送"
 oe_yk.1.h.tt: "高丽对本国的好感#R −15#!（#bold #color_yellow 选送贡女#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y −1#!"
 oe_yk.1.i: "厚赐"
 oe_yk.1.i.tt: "本国付给高丽约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_gift_big')|0]#!金（高丽六个月的收入，至多本国三个月的收入）\n高丽对本国的好感#G +20#!（#bold #color_yellow 厚赐#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y +1#!"
 oe_yk.1.j: "薄赐"
 oe_yk.1.j.tt: "本国付给高丽约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_gift_small')|0]#!金（高丽两个月的收入）\n高丽对本国的好感#G +5#!（#bold #color_yellow 薄赐#!#!，#Y 60#!个月）"
 oe_yk.1.k: "不赐"
 oe_yk.1.k.tt: "高丽对本国的好感#R −10#!（#bold #color_yellow 不赐#!#!，#Y 60#!个月）"
 oe_yk.1.l: "仍立高丽世子，驳沈王之请"
 oe_yk.1.l.tt: "高丽新王受封；高丽正统#G +5#!\n沈王对本国的好感#R −15#!（#bold #color_yellow 驳沈王之请#!#!，#Y 60#!个月）\n沈王忠诚#R −5#!"
 oe_yk.1.m: "以沈王权署高丽国事"
 oe_yk.1.m.tt: "高丽的自由意愿#R +15#!\n高丽对本国的好感#R −20#!（#bold #color_yellow 以沈王权署国事#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y +2#!\n沈王对本国的好感#G +25#!（#bold #color_yellow 许署高丽国事#!#!，#Y 60#!个月）\n沈王忠诚#G +10#!\n记入沈王权署高丽之局（不废立高丽国王）"
 oe_yk.1.n: "两存之，召两造入京对质"
 oe_yk.1.n.tt: "高丽对本国的好感#R −5#!（#bold #color_yellow 两造入京对质#!#!，#Y 60#!个月）\n沈王对本国的好感#R −5#!（#bold #color_yellow 两造入京对质#!#!，#Y 60#!个月）\n高丽王位请封暂缓#Y 12#!个月再议"
 oe_yk.2.t: "遣使入元"
 oe_yk.2.desc_a1: "#F 高丽与元廷之间，册封、婚姻、贡献，都要遣使往来。#!\n\n国王新立，按惯例当遣使到大都请元廷册封。准封须备谢恩方物，约值#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（本国三个月的收入）；不请封，元廷未必追究，国中却会有人议论名分不正。"
 oe_yk.2.desc_a2: "#F 高丽与元廷之间，册封、婚姻、贡献，都要遣使往来。#!\n\n又到了遣使入元的时候。这一次向元廷求什么，还是此番不遣使？"
 oe_yk.2.a: "请封"
 oe_yk.2.a.tt: "使臣下月到大都，由元廷裁决\n准封：国王受封、正统#G +5#!，本国献上约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金的方物；或命世子入侍为质；或不准（正统#R −10#!）"
 oe_yk.2.b: "请婚"
 oe_yk.2.b.tt: "使臣下月到大都，由元廷裁决\n赐婚：一位孛儿只斤氏的宗室女嫁给国王；或许以后议；或驳回"
 oe_yk.2.c: "请罢贡女"
 oe_yk.2.c.tt: "使臣下月到大都，由元廷裁决\n准其所请：本国稳定#G +2.5#!；或照旧选送"
 oe_yk.2.d: "请赐"
 oe_yk.2.d.tt: "使臣下月到大都，由元廷裁决\n厚赐：约本国六个月的收入；薄赐：约两个月的收入；或不赐"
 oe_yk.2.e: "此番不遣使"
 oe_yk.2.e.tt: "国王未受封时，#Y 12#!个月后再议（至多#Y 3#!次）；否则#Y 48#!个月后再议"
 oe_yk.3.t: "奇氏贵盛"
 oe_yk.3.desc_h: "#F 奇皇后出身高丽，原是贡女。至正十三年（1353年），皇后所生的爱猷识理达腊立为皇太子（通说，《元史》卷四十三）。#!\n\n如今，皇后的族人在高丽愈发显贵，奇氏一门托人求朝廷推恩。高丽国王对此敢怒不敢言。"
 oe_yk.3.desc_g: "#F 奇皇后出身高丽，原是贡女。皇后得宠以后，奇氏的族人在高丽骤然显贵。#!\n\n如今，皇后的族人在高丽愈发显贵，奇氏一门托人求朝廷推恩。高丽国王对此敢怒不敢言。"
 oe_yk.3.a: "推恩奇氏一门"
 oe_yk.3.a.tt: "高丽得#bold #color_yellow 奇氏势盛#!#!#Y 36#!个月：对宗主忠诚#G +5#!、贵族势力#Y +5%#!、每月正统#Y −0.05#!\n蒙古影响（原版计数）#Y +1#!\n1356年前后若高丽与本国决裂，奇氏的权势随之而去"
 oe_yk.3.b: "抑外戚，只赐金帛"
 oe_yk.3.b.tt: "花费#R 1#!个月的贸易与税收收入\n奇氏的族人在高丽不再加恩"
 oe_yk.4.t: "征兵于高丽"
 oe_yk.4.desc_h: "#F 元朝用兵，常征高丽之兵从征。至正十四年（1354年），高丽派兵随脱脱南征高邮，崔莹也在军中（通说）。#!\n\n如今朝廷用兵不息，有人建议诏高丽发兵助讨。高丽答应的机会约为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p4_sv')|0]#!%（蒙古影响越深越肯答应；高丽自己在打仗或离心时则难）。"
 oe_yk.4.desc_g: "#F 元朝用兵，常征高丽之兵从征。#!\n\n如今朝廷用兵不息，有人建议诏高丽发兵助讨。高丽答应的机会约为#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p4_sv')|0]#!%（蒙古影响越深越肯答应；高丽自己在打仗或离心时则难）。"
 oe_yk.4.a: "诏高丽发兵助讨"
 oe_yk.4.a.tt: "高丽是人类玩家时，由高丽自己答复；否则按上面的机会掷骰\n高丽答应：两团高丽轻骑在战地附近为本国所用（高丽人力#Y −2#!）；高丽对本国的好感#R −10#!（#bold #color_yellow 征兵#!#!，#Y 60#!个月）；蒙古影响（原版计数）#Y +1#!；平乱之势#G +2#!。\n高丽推辞：高丽的自由意愿#R +5#!；蒙古影响（原版计数）#Y −1#!；本国对高丽的好感#R −15#!（#bold #color_yellow 抗命不发兵#!#!，#Y 60#!个月）。"
 oe_yk.4.b: "不征"
 oe_yk.4.b.tt: "高丽照旧"
 oe_yk.5.t: "元廷征兵"
 oe_yk.5.desc_x: "#F 元朝用兵，常征高丽之兵从征；发不发、发多少，高丽朝中每每争论。#!\n\n如今元廷遣使来，诏本国发兵助讨南方的叛乱。"
 oe_yk.5.a: "发兵两团"
 oe_yk.5.a.tt: "两团轻骑归元廷调用；本国人力#R −2#!\n本国对元廷的好感#Y −10#!（#bold #color_yellow 征兵#!#!）\n蒙古影响（原版计数）#Y +1#!"
 oe_yk.5.b: "只发一团"
 oe_yk.5.b.tt: "一团轻骑归元廷调用；本国人力#R −1#!\n本国对元廷的好感#Y −5#!（#bold #color_yellow 征兵（一团）#!#!）"
 oe_yk.5.c: "推辞"
 oe_yk.5.c.tt: "本国的自由意愿#Y 5#!\n蒙古影响（原版计数）#Y −1#!\n元廷对本国的好感#R −15#!（#bold #color_yellow 抗命不发兵#!#!）"
 oe_yk.6.t: "奇氏之诛"
 oe_yk.6.desc_b1k1s1: "#F 至正丙申五月，高丽恭愍王设曲宴诛杀奇辙、权谦、卢頙及其党羽，罢征东行省理问所，停用元朝年号，恢复旧官制；据说其西北面兵马使印珰亦攻鸭绿江以西八站，破婆娑府等三站（攻站已核，问罪与杀印珰谢罪据通说）。#!\n\n急报自辽阳传来：高丽王设曲宴诛杀奇辙等附元重臣，罢征东行省理问所，据说其边将亦越鸭绿江攻掠西岸八站。奇氏一门原本势倾一国，如今骤遭诛灭，后宫闻讯大怒。且双城总管府亦已落入高丽之手，东北屏藩动摇。"
 oe_yk.6.desc_b1k1s0: "#F 至正丙申五月，高丽恭愍王设曲宴诛杀奇辙、权谦、卢頙及其党羽，罢征东行省理问所，停用元朝年号，恢复旧官制；据说其西北面兵马使印珰亦攻鸭绿江以西八站，破婆娑府等三站（攻站已核，问罪与杀印珰谢罪据通说）。#!\n\n急报自辽阳传来：高丽王设曲宴诛杀奇辙等附元重臣，罢征东行省理问所，据说其边将亦越鸭绿江攻掠西岸八站。奇氏一门原本势倾一国，如今骤遭诛灭，后宫闻讯大怒。所幸双城总管府尚在朝廷手中，辽阳东路犹未尽失。"
 oe_yk.6.desc_b1k0s1: "#F 至正丙申五月，高丽恭愍王设曲宴诛杀奇辙、权谦、卢頙及其党羽，罢征东行省理问所，停用元朝年号，恢复旧官制；据说其西北面兵马使印珰亦攻鸭绿江以西八站，破婆娑府等三站（攻站已核，问罪与杀印珰谢罪据通说）。#!\n\n急报自辽阳传来：高丽王设曲宴诛杀奇辙等附元重臣，罢征东行省理问所，据说其边将亦越鸭绿江攻掠西岸八站。高丽朝中亲元旧臣一时失势，京师群臣议论纷纷。且双城总管府亦已落入高丽之手，东北屏藩动摇。"
 oe_yk.6.desc_b1k0s0: "#F 至正丙申五月，高丽恭愍王设曲宴诛杀奇辙、权谦、卢頙及其党羽，罢征东行省理问所，停用元朝年号，恢复旧官制；据说其西北面兵马使印珰亦攻鸭绿江以西八站，破婆娑府等三站（攻站已核，问罪与杀印珰谢罪据通说）。#!\n\n急报自辽阳传来：高丽王设曲宴诛杀奇辙等附元重臣，罢征东行省理问所，据说其边将亦越鸭绿江攻掠西岸八站。高丽朝中亲元旧臣一时失势，京师群臣议论纷纷。所幸双城总管府尚在朝廷手中，辽阳东路犹未尽失。"
 oe_yk.6.desc_b2k1s1: "#F 至正年间，高丽趁中原多事，渐行去元之策，停奉元朝旧制与驸马之规，不再事事听命于大都。#!\n\n急报自辽阳传来：高丽废除驸马旧规，不再奉行元廷法度，俨然已有离心之势。奇氏一门原本势倾一国，如今骤遭诛灭，后宫闻讯大怒。且双城总管府亦已落入高丽之手，东北屏藩动摇。"
 oe_yk.6.desc_b2k1s0: "#F 至正年间，高丽趁中原多事，渐行去元之策，停奉元朝旧制与驸马之规，不再事事听命于大都。#!\n\n急报自辽阳传来：高丽废除驸马旧规，不再奉行元廷法度，俨然已有离心之势。奇氏一门原本势倾一国，如今骤遭诛灭，后宫闻讯大怒。所幸双城总管府尚在朝廷手中，辽阳东路犹未尽失。"
 oe_yk.6.desc_b2k0s1: "#F 至正年间，高丽趁中原多事，渐行去元之策，停奉元朝旧制与驸马之规，不再事事听命于大都。#!\n\n急报自辽阳传来：高丽废除驸马旧规，不再奉行元廷法度，俨然已有离心之势。高丽朝中亲元旧臣一时失势，京师群臣议论纷纷。且双城总管府亦已落入高丽之手，东北屏藩动摇。"
 oe_yk.6.desc_b2k0s0: "#F 至正年间，高丽趁中原多事，渐行去元之策，停奉元朝旧制与驸马之规，不再事事听命于大都。#!\n\n急报自辽阳传来：高丽废除驸马旧规，不再奉行元廷法度，俨然已有离心之势。高丽朝中亲元旧臣一时失势，京师群臣议论纷纷。所幸双城总管府尚在朝廷手中，辽阳东路犹未尽失。"
 oe_yk.6.a: "遣使责问，令献罪人"
 oe_yk.6.a.tt: "高丽是人类玩家时，由高丽自行答复；否则按下列机会掷骰\n高丽谢罪（#Y 70#!%）：高丽归罪边将，稳定#Y −2.5#!；本国威望#G +5#!；蒙古影响（原版计数）#Y +1#!。\n高丽不答（#Y 30#!%）：两朝结怨；高丽自由意愿#R +5#!。"
 oe_yk.6.b: "隐忍不问"
 oe_yk.6.b.tt: "暂且隐忍，不加问罪；若奇皇后尚在世，中宫衔恨难平，日后或再起废立之议"
 oe_yk.6.c: "下诏削高丽王爵"
 oe_yk.6.c.tt: "高丽正统#R −10#!\n高丽对本国的好感#R −30#!（#bold #color_yellow 削爵之诏#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y −2#!\n两朝结怨，废立之议将提前于一至三年内浮现"
 oe_yk.7.t: "元使问罪"
 oe_yk.7.desc_x: "#F 至正丙申之变后，通说元廷曾遣使责问高丽诛奇氏、攻鸭绿江西八站之事，高丽归罪边将印珰，杀之以谢元廷。#!\n\n大元使臣已至开京，厉辞责问诛杀外戚与边军越境之事，勒令本国献出罪人、上表谢罪。朝廷中主和与主抗两派各执一词。"
 oe_yk.7.a: "谢罪，归罪边将"
 oe_yk.7.a.tt: "本国稳定#R −2.5#!；大元威望#Y 5#!\n蒙古影响（原版计数）#Y +1#!\n暂且平息元廷怒火"
 oe_yk.7.b: "置之不答"
 oe_yk.7.b.tt: "本国自由意愿#Y 5#!\n与大元结下深怨，日后元廷或生废立之心"
 oe_yk.8.t: "嘉高丽之忠"
 oe_yk.8.desc_y1: "#F 至正末年，四方群雄并起，藩属多怀观望。高丽若始终奉行元朝正朔与征东旧制，对大元而言便是一处难得的东藩屏障。#!\n\n高丽朝中虽有罢除理问所、去元自立之议，国王却力排众议，仍奉大元正朔，征东旧制得以保全。中书省请朝廷降诏嘉奖，以安东藩。"
 oe_yk.8.desc_def: "#F 至正末年，四方群雄并起，藩属多怀观望。高丽若始终奉行元朝正朔与征东旧制，对大元而言便是一处难得的东藩屏障。#!\n\n中原多事以来，高丽恭顺如故，朝贡不绝，从未生出异志。中书省请朝廷加恩褒美，以固东藩之心。"
 oe_yk.8.a: "加封国王，赐金印"
 oe_yk.8.a.tt: "花费#R 2#!个月的贸易与税收收入\n高丽对本国的好感#G +15#!（#bold #color_yellow 加封#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y +1#!\n高丽稳定#G +2.5#!；此后跳过废立之役，高丽线进入尾声"
 oe_yk.8.b: "降诏褒美"
 oe_yk.8.b.tt: "此后跳过废立之役，高丽线进入尾声"
 oe_yk.9.t: "红巾东窜"
 oe_yk.9.desc_c61: "#F 红巾军于至正十九年（1359年）与二十一年（1361年）两度东入高丽，后一次甚至攻陷开京，高丽国王南奔，次年初方才收复故都。#!\n\n辽阳急报：红巾军大举东窜，竟已攻破高丽都城！贼军东向虽稍分我辽东之患，高丽危在旦夕，朝廷当如何应对？"
 oe_yk.9.desc_w61: "#F 红巾军于至正十九年（1359年）与二十一年（1361年）两度东入高丽，后一次甚至攻陷开京，高丽国王南奔，次年初方才收复故都。#!\n\n辽阳奏报：大股红巾贼越鸭绿江东窜高丽，高丽正举国苦战。贼势东分，朝廷是发辽阳兵夹击，还是坐观其斗？"
 oe_yk.9.desc_c59: "#F 至正十九年（1359年），关先生、破头潘等红巾军渡鸭绿江东入高丽，连破西京等地，一时分散了辽阳与大都方向的贼势。#!\n\n辽阳急报：红巾军大举东窜，竟已攻破高丽都城！贼军东向虽稍分我辽东之患，高丽危在旦夕，朝廷当如何应对？"
 oe_yk.9.desc_w59: "#F 至正十九年（1359年），关先生、破头潘等红巾军渡鸭绿江东入高丽，连破西京等地，一时分散了辽阳与大都方向的贼势。#!\n\n辽阳奏报：大股红巾贼越鸭绿江东窜高丽，高丽正举国苦战。贼势东分，朝廷是发辽阳兵夹击，还是坐观其斗？"
 oe_yk.9.desc_cg: "#F 红巾军在辽东转战，屡屡东渡鸭绿江窜入高丽，使高丽北疆大震，也在一定程度上分散了贼军压向辽阳与大都的兵力。#!\n\n辽阳急报：红巾军大举东窜，竟已攻破高丽都城！贼军东向虽稍分我辽东之患，高丽危在旦夕，朝廷当如何应对？"
 oe_yk.9.desc_wg: "#F 红巾军在辽东转战，屡屡东渡鸭绿江窜入高丽，使高丽北疆大震，也在一定程度上分散了贼军压向辽阳与大都的兵力。#!\n\n辽阳奏报：大股红巾贼越鸭绿江东窜高丽，高丽正举国苦战。贼势东分，朝廷是发辽阳兵夹击，还是坐观其斗？"
 oe_yk.9.a: "移文辽阳，与高丽夹击"
 oe_yk.9.a.tt: "花费#R 2#!个月的贸易与税收收入\n平乱之势#G +3#!（贼势分于东方）\n高丽对本国的好感#G +15#!（#bold #color_yellow 夹击红巾#!#!，#Y 60#!个月）\n高丽向背不为敌对时，蒙古影响（原版计数）#Y +1#!"
 oe_yk.9.b: "坐观其斗"
 oe_yk.9.b.tt: "平乱之势#G +1#!\n高丽对本国的好感#R −10#!（#bold #color_yellow 坐观红巾#!#!，#Y 60#!个月）"
 oe_yk.9.c: "乘其危索贡"
 oe_yk.9.c.tt: "从高丽索取约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（高丽三个月收入，不足有多少给多少）归本国\n高丽对本国的好感#R −20#!（#bold #color_yellow 乘危索贡#!#!，#Y 60#!个月）\n蒙古影响（原版计数）#Y −1#!"
 oe_yk.10.t: "废立之议"
 oe_yk.10.desc_g1r1: "#F 至正末年，奇皇后衔恨高丽诛灭奇氏，高丽人崔濡在元廷鼓动，请废高丽王而立忠宣王之子德兴君王譓（蒙古名塔思帖木儿）。德兴君王譓乃忠宣王之子，忠宣王亦为初代沈王，辽阳沈王旧部与东宫同气连枝。#!\n\n中宫奇皇后犹恨高丽诛灭奇氏之仇，力劝朝廷下诏废高丽王，改立忠宣王之子德兴君王譓，并调辽阳兵护送过江。近来高丽都城曾为红巾军攻破，元气大伤，主战者皆称此乃天赐良机。（当前估算废立成算约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%，其中沈王恭顺协同加成+#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!%；两国之间并不直接宣战。）"
 oe_yk.10.desc_g1r0: "#F 至正末年，奇皇后衔恨高丽诛灭奇氏，高丽人崔濡在元廷鼓动，请废高丽王而立忠宣王之子德兴君王譓（蒙古名塔思帖木儿）。德兴君王譓乃忠宣王之子，忠宣王亦为初代沈王，辽阳沈王旧部与东宫同气连枝。#!\n\n中宫奇皇后犹恨高丽诛灭奇氏之仇，力劝朝廷下诏废高丽王，改立忠宣王之子德兴君王譓，并调辽阳兵护送过江。高丽国力虽受边患牵制，然根基未绝，朝中亦有人忧虑劳师远征、徒生边衅。（当前估算废立成算约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%，其中沈王恭顺协同加成+#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!%；两国之间并不直接宣战。）"
 oe_yk.10.desc_g0r1: "#F 至正末年，奇皇后衔恨高丽诛灭奇氏，高丽人崔濡在元廷鼓动，请废高丽王而立忠宣王之子德兴君王譓（蒙古名塔思帖木儿）。德兴君王譓乃忠宣王之子，忠宣王亦为初代沈王，辽阳沈王旧部与东宫同气连枝。#!\n\n朝中旧臣与辽阳沈王故部纷纷上言，请下诏废黜违命的高丽王，改立忠宣王之子德兴君王譓，由辽阳发兵护送入丽。近来高丽都城曾为红巾军攻破，元气大伤，主战者皆称此乃天赐良机。（当前估算废立成算约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%，其中沈王恭顺协同加成+#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!%；两国之间并不直接宣战。）"
 oe_yk.10.desc_g0r0: "#F 至正末年，奇皇后衔恨高丽诛灭奇氏，高丽人崔濡在元廷鼓动，请废高丽王而立忠宣王之子德兴君王譓（蒙古名塔思帖木儿）。德兴君王譓乃忠宣王之子，忠宣王亦为初代沈王，辽阳沈王旧部与东宫同气连枝。#!\n\n朝中旧臣与辽阳沈王故部纷纷上言，请下诏废黜违命的高丽王，改立忠宣王之子德兴君王譓，由辽阳发兵护送入丽。高丽国力虽受边患牵制，然根基未绝，朝中亦有人忧虑劳师远征、徒生边衅。（当前估算废立成算约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_p10_sv')|0]#!%，其中沈王恭顺协同加成+#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_syg_deokheung_bonus')|0]#!%；两国之间并不直接宣战。）"
 oe_yk.10.a: "立德兴君，发辽阳兵一万送之"
 oe_yk.10.a.tt: "花费#R 6#!个月的贸易与税收收入\n本国人力#R −5#!（一万辽阳兵之半出自朝廷调拨）\n下个月德兴君渡鸭绿江入义州省，在高丽境内竖起篡位叛军（两国之间不开战），至多六个月后于随州（定州）达川结算\n若沈王为大元恭顺附属，结算成算额外#G +5%#!（一期曾以沈王权署高丽时叛军初势更盛）"
 oe_yk.10.b: "只下诏废立，不发兵"
 oe_yk.10.b.tt: "高丽正统#R −10#!\n高丽对本国的好感#R −25#!（#bold #color_yellow 废立之诏#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y −2#!\n不发辽阳兵，不放叛军；高丽线进入尾声"
 oe_yk.10.c: "罢议，复认高丽王"
 oe_yk.10.c.tt: "高丽对本国的好感#G +20#!（#bold #color_yellow 复认王位#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y +1#!\n复认现任高丽王位，高丽线进入尾声"
 oe_yk.11.t: "德兴君犯境"
 oe_yk.11.desc_x: "#F 至正二十三年末至次年正月，元廷发辽阳兵一万护送德兴君王譓渡鸭绿江，占义州、宣州，南下至随州（定州）达川，为崔莹、李成桂等击败，退回元境。#!\n\n元廷下诏废立，辽阳兵已护送德兴君王譓逼近鸭绿江。若迎战，义州一带将竖起德兴君的拥立军；若遣使谢罪，则须献上约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（本国三个月的收入）以求复认王位。"
 oe_yk.11.a: "发兵拒之于达川"
 oe_yk.11.a.tt: "义州省竖起德兴君的拥立军（初始进度15%），六个月内于随州（定州）达川结算（玩家主动应对时叛军成算减半）"
 oe_yk.11.b: "遣使谢罪，请复王位"
 oe_yk.11.b.tt: "不起叛军；本国向大元献上约#Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yk_kor3m_sv')|0]#!金（不足有多少给多少），正统#R −5#!\n蒙古影响（原版计数）#Y +2#!\n下个月由元廷裁决是否复认王位"
 oe_yk.12.t: "达川之报"
 oe_yk.12.desc_f64: "#F 至正二十四年（1364年）正月，护送德兴君的辽阳军南下至随州（定州）达川，为高丽将领崔莹、李成桂等击败，退回元境。同年元廷复认恭愍王位；恭愍王请押还德兴君，元帝诏杖一百零七下再送回，终未送还。#!\n\n败报传来：护送德兴君之军在随州（定州）达川大败，德兴君狼狈逃回元境，已无力再图高丽。中书省请示：是顺势复认高丽王位，还是坚持不复其位？"
 oe_yk.12.desc_fg: "#F 护送德兴君的辽阳军渡鸭绿江南下至随州（定州）达川，为高丽名将崔莹、李成桂等击败，残军退回元境。高丽遣使请押还德兴君，元廷虽言杖一百零七下，终未送还。#!\n\n败报传来：护送德兴君之军在随州（定州）达川大败，德兴君狼狈逃回元境，已无力再图高丽。中书省请示：是顺势复认高丽王位，还是坚持不复其位？"
 oe_yk.12.desc_w: "#F 辽阳军护送德兴君王譓过鸭绿江，克定随州（定州）达川，进逼开京，竟成废立之举。新王凭大元兵威登位，国中根基尚浅。#!\n\n捷报传来：德兴君之军克定随州（定州）达川，高丽已改立新王！新王遣使入朝谢恩，朝廷当厚加恩赉，还是只予册封？"
 oe_yk.12.desc_ap: "#F 元廷废立之诏下达，高丽国王未待两军交锋，便急遣使臣奉表谢罪、献上方物，恳请朝廷收回成命、复认王位。#!\n\n高丽使臣捧着谢罪表文与方物跪伏殿前，恳请朝廷念在藩国世修职贡之份上，撤回废立之议、复认高丽王位。"
 oe_yk.12.a: "复认高丽王位"
 oe_yk.12.a.tt: "高丽对本国的好感#G +20#!（#bold #color_yellow 复认王位#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y +1#!\n承认现任高丽王位，避免两朝长期敌对"
 oe_yk.12.b: "不复其位"
 oe_yk.12.b.tt: "高丽向背转为敌对（持续十年）；高丽自由意愿#R +10#!\n高丽对本国的好感#R −30#!（#bold #color_yellow 废立之仇#!#!，#Y 120#!个月）"
 oe_yk.12.c: "册立新王，厚加恩赉"
 oe_yk.12.c.tt: "花费#R 2#!个月的贸易与税收收入\n高丽得#bold #color_yellow 元立新王#!#!#Y 120#!个月：对宗主忠诚#G +10#!、每月正统#Y −0.05#!\n蒙古影响（原版计数）#Y +3#!\n高丽新王受封"
 oe_yk.12.d: "只册封"
 oe_yk.12.d.tt: "蒙古影响（原版计数）#Y +2#!\n高丽新王受封"
 oe_yk.12.e: "受其谢罪，复其王位"
 oe_yk.12.e.tt: "高丽对本国的好感#G +20#!（#bold #color_yellow 复认王位#!#!，#Y 120#!个月）\n蒙古影响（原版计数）#Y +1#!\n复认高丽王位"
 oe_yk.12.f: "仍不复位"
 oe_yk.12.f.tt: "高丽向背转为敌对（持续十年）；高丽自由意愿#R +10#!\n高丽对本国的好感#R −30#!（#bold #color_yellow 废立之仇#!#!，#Y 120#!个月）"
 oe_yk.20.t: "大元与高丽：选项生效"
