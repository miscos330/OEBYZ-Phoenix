oe_gen_gold_control: "热那亚人控股矿场"
oe_gen_gold_control_desc: "按照条约，这处矿场的一部分开采权被抵押给热那亚人，他们可以从这些矿产中获得不菲的收益"
oe_gen_gold_control_maintain: "特权开采"

oe_gen_latin_house: "热那亚商站"
oe_gen_latin_house_desc: "这里是[GetCountry('GEN').GetName]的商业前哨，为热那亚提供重要的商业影响力"
oe_gen_latin_house_maintain: "拉丁商路"

oe_ven_latin_house: "威尼斯商站"
oe_ven_latin_house_desc: "这里是[GetCountry('VEN').GetName]的商业前哨，为威尼斯提供重要的商业影响力"


oe_byz_theme_system: "军区兵营"
oe_byz_theme_system_desc: "帝国军队的集结治所，向建筑所有者提供相当于当地税基15%的金币和每月3人力。"
oe_byz_theme_system_maintain: "军事管理"

oe_byz_theme_system_noble: "军区首府"
oe_byz_theme_system_noble_desc: "军区长官及高级将领的驻节首府，向建筑所有者提供相当于当地税基100%的金币，并保留固定金币与人力收入。"
oe_byz_theme_system_noble_maintain: "军区行政"

oe_byz_bank: "银行"
oe_byz_bank_desc: "这座建筑是金融活动的中心，主持存款，放贷，国债发行，汇票兑换，金融投资等各项业务"

oe_gov_burchen_building: "文官办公室"
oe_gov_burchen_building_desc: "这栋建筑是行政官僚的主要办公和文档存储地点"


oe_sub_tax_get_building: "行省征税所"
oe_sub_tax_get_building_desc: "这座机构负责将本地的税收上缴中央"

oe_byz_memory_victory_building: "胜利纪念碑"
oe_byz_memory_victory_building_desc: "这座建筑用于纪念我国取得的伟大胜利"
oe_byz_memory_victory_building_maintain: "纪念碑维护"

