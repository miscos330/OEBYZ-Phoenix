l_simp_chinese: 
#=====================================
#constantinople
#=====================================

oe_byz_Hagia_Sophia: "圣索菲亚大教堂"
oe_byz_Hagia_Sophia_desc: "圣索菲亚大教堂，是拜占庭帝国的主教堂，因巨大的圆顶而闻名于世，乃拜占庭建筑代表、东正教的中心教堂、拜占庭帝国极盛时代的纪念碑。"
oe_byz_Hagia_Sophia_maintain: "普世教堂生产方式"

oe_byz_constantinople_gold_door: "金门"
oe_byz_constantinople_gold_door_desc: "金门是君士坦丁堡城墙最雄伟的陆上门户，常用于凯旋仪式。"
oe_byz_constantinople_gold_door_maintain: "金门仪仗"


oe_byz_constantinople_small_palace: "布拉赫内宫"
oe_byz_constantinople_small_palace_desc: "位于狄奥多西城墙西北角，金角湾畔。自科穆宁王朝后成为主要的皇家住所。相比于曾经辉煌宏大的大皇宫建筑群，它更像一个防御严密的城堡要塞"
oe_byz_constantinople_small_palace_maintain: "罗马皇宫御用"

oe_byz_constantinople_holy_church_desc: "圣使徒教堂是帝国第二大教堂，也是皇帝与牧首的传统安葬地"
oe_byz_constantinople_holy_church: "圣使徒教堂"
oe_byz_constantinople_holy_church_maintain: "圣使徒教堂维护"

oe_byz_constantinople_water_palace: "地下水宫"
oe_byz_constantinople_water_palace_desc: "地下水宫于6世纪时期，由朱斯提尼安大帝下令建造，动用七千名奴隶历时多年完成，主要用于宫廷供水及战争储备。建筑长140米、宽70米，由336根高9米的科林斯式石柱支撑，石柱多取自安纳托利亚地区神殿，储水量最高可达10万吨"
oe_byz_constantinople_water_palace_maintain: "地下水宫维护"
OE_BYZ_oe_byz_constantinople_water_palace_DESC: "修缮地下水宫"

oe_byz_constantinople_great_arena: "大跑马场"
oe_byz_constantinople_great_arena_desc: "在整个东罗马时期，赛马场都是君士坦丁堡社会生活的中心，尽管赛马场因为1204年灾难性的洗劫而遭到严重破坏，但是其中矗立的诸如图特摩斯三世方尖碑，蛇柱，薄菲力雕像等古老的传奇艺术品依然彰显出帝国过去的无尽辉煌"
oe_byz_constantinople_great_arena_maintain: "大跑马场维护"

oe_byz_constantinople_big_palace: "大皇宫"
oe_byz_constantinople_big_palace_desc: "君士坦丁堡大皇宫是东罗马帝国宏伟壮丽和文化遗产的永恒象征。它由君士坦丁一世皇帝于4世纪早期建立，作为拜占庭帝国的政治和礼仪中心，象征着罗马权力与基督教意义的延续。"

oe_byz_constantinople_rebuild_port: "普罗潘提斯港口"
oe_byz_constantinople_rebuild_port_desc: "普罗潘提斯港口是君士坦丁堡面向马尔马拉海一侧的港口，这个繁荣的港口曾一度因为淤积的原因被废弃，在重新清理了淤积后，这座港口很快便会回到曾经繁荣的状态"
oe_byz_constantinople_rebuild_port_maintain: "港口维护"

oe_valuns_water_building: "瓦伦斯水道桥"
oe_valuns_water_building_desc: "瓦伦斯水道桥是君士坦丁堡的核心供水设施，由罗马皇帝瓦伦斯于公元368-375年间主导建造。该建筑采用双层石拱结构，原始长度超过1000米，最大高度达29米。"
oe_valuns_water_building_maintain: "水道桥维护"
OE_BYZ_oe_valuns_water_building_DESC: "瓦伦斯水道桥修缮"

oe_byz_constantinople_university: "君士坦丁堡大学"
oe_byz_constantinople_university_desc: "君士坦丁堡大学于公元425年建校，旨在通过系统化教育培养国家治理人才。教学对象突破阶层限制，既培养官僚精英也招收平民子弟。教学内容涵盖修辞学，哲学和法学等等"
oe_byz_constantinople_university_maintain: "学术论文"

oe_byz_constantinople_rome_university: "新罗马牧首大学"
oe_byz_constantinople_rome_university_desc: "新罗马牧首大学起初只是一所仅拥有三名教授的神学院，其历史最早可以追溯到5世纪。如今牧首大学提供完整的宗教教育，包括教授福音、使徒书信和圣诗等等"

#=====================================
#historic_building
#=====================================

oe_byz_mint: "塞萨洛尼基皇家铸币厂"
oe_byz_mint_desc: "铸币官与贵族监理在此核验贵金属、维护帝国的币制与地方行政。\n\n仅可建于塞萨洛尼基，上限一级，开局由东罗马拥有一级。雇佣100名贵族，每月标准维护消耗0.1黄金与0.2白银，不产出商品。提供本地邻近度产生+80。"
oe_byz_mint_maintain: "皇家铸币厂维护"

oe_byz_athos: "阿索斯山修道院"
oe_byz_athos_desc: "阿索斯山（又称“圣山”）在中世纪拜占庭帝国中拥有极其独特和重要的地位。它不仅是东正教世界的精神灯塔和修道主义中心，也是一个在政治、经济和文化上具有高度自治权的特殊区域。关于其藏书，阿索斯山无疑是中世纪世界最重要的手稿收藏和抄写中心之一，产生了并保存了海量的珍贵藏书。"
oe_byz_athos_maintain: "阿索斯藏书"

 oe_byz_greek_capital: "雅典卫城"
 oe_byz_greek_capital_desc: "修复后的卫城容纳了帝国在希腊的行政中枢。官署收存税册，听取地方陈情，并将皇帝的诏令传往周边城镇。"


 oe_byz_build_demotica_house: "豪族庄园"
 oe_byz_build_demotica_house_desc: "豪族持有的家族庄园，为其提供收入、兵员与地方影响。庄园随家族传承，不因家主入朝或去世而被撤销。"
oe_demotica_house_maintain: "高朋满座"

oe_byz_alasehir_city: "绝境要塞"
oe_byz_alasehir_city_desc: "随着拜占庭帝国在小亚细亚的全面败退，这座城市陷入了突厥人的全面包围之中，但是我们永远不会放弃抵抗，直到敌人的刀剑将我们全部消灭"
oe_alasehir_city_maintain: "自治民兵"

oe_byz_mis_burgher: "米斯特拉斯城堡"
oe_byz_mis_burgher_desc: "米斯特拉斯城堡的历史起源于第四次十字军东征。1206年和1207年十字军攻占伯罗奔尼萨后，来自法国北部奥布河畔的巴尔的贵族杰弗里一世成为阿凯亚侯国的君主，他的弟弟威廉二世攻占了拉科尼亚的其他地方，于1249年在当时没有人居住的米斯特拉斯建造了一座非常坚固的城堡，这座城堡的作用在于控制拉科尼亚。1259年拜占庭军队俘获了威廉，只有通过交出米斯特拉斯和其他城堡他才获得自由。"
oe_byz_mis_burgher_maintain: "伯罗奔尼撒城堡维护"

oe_byz_monem_sea_burgher: "莫奈姆瓦夏海上要塞"
oe_byz_monem_sea_burgher_desc: "莫奈姆瓦夏位于伯罗奔尼撒半岛东海岸，其核心是一座与大陆仅通过一条狭窄堤道相连的巨大岩石岛屿。这座岩山高出海面近300米，四面几乎是垂直的悬崖，无法从海上攀爬。1204年君士坦丁堡陷落后，莫奈姆瓦夏是未被十字军征服的三个拜占庭据点之一。它成为了莫里亚地区拜占庭抵抗的中心。"

oe_byz_edirne_burgher: "阿德里安堡"
oe_byz_edirne_burgher_desc: "125年，罗马皇帝哈德良重建此城，作为巴尔干半岛的军事枢纽，扼守从君士坦丁堡到中欧的通道"
oe_byz_edirne_burgher_maintain: "阿德里安堡防卫"

#=====================================
#normal_building
#=====================================

oe_byz_pronia_house: "普罗尼亚大庄园"
oe_byz_pronia_house_desc: "这是大普罗尼亚尔的私有庄园，由于中央权威的衰弱，他们已经将普罗尼亚地产变成了世袭罔替的私有财产，并逼迫大量的自由农民破产成为他们的依附农"
oe_pronia_house_maintain: "地主武装"

oe_byz_pronia_good_house: "军役地产"
oe_byz_pronia_good_house_desc: "这片土地上的小普罗尼亚尔严格遵守着普罗尼亚制度的规定，并在国家需要时忠诚地为国而战"
oe_pronia_good_house_maintain: "权利与义务"

oe_byz_build_country_gov: "行政总署"
oe_byz_build_country_gov_desc: "这里是地区的最高权力中心，其长官在此办公、居住和审判。"

oe_byz_clergy_house: "乡村礼拜堂"
oe_byz_clergy_house_desc: "这是任何一个虔诚的基督教聚落都必须具备的建筑"
oe_byz_clergy_house_maintain: "信仰与福利"

oe_byz_bad_thief_greek: "盗匪据点"
oe_byz_bad_thief_greek_desc: "由于帝国的治理失败，无数破产农民和无家可归者已经被迫选择落草为寇，当地的乡间盗匪横行，治安情况极差。"
oe_byz_bad_thief_greek_maintain: "草莽山贼"

oe_byz_defend_wall_I: "边防军营地"
oe_byz_defend_wall_I_desc: "边防军“Aκρίται”一词来源于希腊语Akron/Akra，意即“边境”。防人一词的官方用法泛指居住在东部边境的军、民及居住在那些地区的穆斯林。在防人歌的文学影响下，人们常将帝国边防军当作驻扎在边境的军队。事实上，边防军是职业军人与本地军区民兵及非常规军的混编部队。"
oe_byz_defend_wall_I_maintain: "巡逻戍卫"

oe_byz_pronia_better_house: "军役地产"
oe_byz_pronia_better_house_desc: "这片土地上的小普罗尼亚尔严格遵守着普罗尼亚制度的规定，并在国家需要时忠诚地为国而战"

oe_byz_east_trade_burgher: "东方商行"
oe_byz_east_trade_burgher_desc: "这间商行专门负责在市场内转运东方商品"
oe_byz_east_trade_burgher_maintain_I: "商路转运"
oe_byz_east_trade_burgher_maintain_II: "商路转运"
oe_byz_east_trade_burgher_maintain_III: "商路转运"
oe_byz_east_trade_burgher_maintain_IV: "商路转运"

oe_byz_tagmata_house: "军团练场"
oe_byz_tagmata_house_desc: "这里是东罗马精锐中央军的训练场地"
oe_byz_tagmata_house_maintain: "军事训练"
EFFECTIVE_tagmata_BUILDINGS: "有效的军团练场"

