 oe_mfg_dec_eparch_silk_charter.title: "颁布紫袍敕令"
 oe_mfg_dec_eparch_silk_charter.desc: "仿《市政官之书》旧制，重申朝廷对御用丝织的专营，并在首都市场上掀起一阵锦缎热。花费 150 金币，效果持续 15 年。"
 oe_mfg_dec_eparch_silk_charter.a: "颁布敕令"
 oe_mfg_dec_imperial_kiln_commission.title: "遣督陶官驻御窑"
 oe_mfg_dec_imperial_kiln_commission.desc: "派督陶官常驻御窑监造贡瓷，并带动瓷器与茶叶的需求。花费 150 金币，效果持续 15 年。"
 oe_mfg_dec_imperial_kiln_commission.a: "遣官督陶"
 oe_mfg_dec_demidov_ural_concession.title: "授冶铁特许状"
 oe_mfg_dec_demidov_ural_concession.desc: "把官办铁厂交给能干的铁匠世家经营，换取源源不断的生铁。花费 200 金币，效果持续 15 年。"
 oe_mfg_dec_demidov_ural_concession.a: "授予特许"
 oe_mfg_dec_arsenale_assembly_charter.title: "推行军械库造舰标准"
 oe_mfg_dec_arsenale_assembly_charter.desc: "照军械库的办法，统一船材构件的规格，沿岸流水装配。花费 200 金币，效果持续 15 年。"
 oe_mfg_dec_arsenale_assembly_charter.a: "推行标准"
 oe_mfg.1.title: "紫袍工场专营"
 oe_mfg.1.desc: "敕令重申：真紫锦缎只许御用工场织造，严禁私贩出境。行会首领前来请示，这条禁令要执行到什么地步。"
 oe_mfg.1.a: "一匹也不许外流"
 oe_mfg.1.b: "次等的可以外销，换取金银"
 oe_mfg.2.title: "钴料运抵御窑"
 oe_mfg.2.desc: "从西域运来的上等钴料到了御窑。督陶官请示：烧成的贡瓷稍有瑕疵，是照旧例当场打碎深埋，还是发卖民间？"
 oe_mfg.2.a: "碎瓷深埋，贡瓷只供御用"
 oe_mfg.2.b: "发卖民间，贴补窑厂"
 oe_mfg.3.title: "试炮大典"
 oe_mfg.3.desc: "皇家兵工厂倾力浇铸的第一批重型青铜大炮被拖运至城郊试炮场举行隆重试炮大典。随着火绳落下，炮口喷出滚滚浓烟与烈焰，轰鸣巨响震彻数里之外，厚重靶墙应声化为碎石；亲临观礼的朝廷重臣与外国使节无不神色震动。"
 oe_mfg.3.a: "重赏工匠"
 oe_mfg.3.b: "令各军操演火器"
 oe_mfg.4.title: "冶铁特许与指派劳役"
 oe_mfg.4.desc: "铁厂主人请求把邻近村庄的农民指派到铁厂服役，说不这样就炼不出足够的铁。地方官担心激起民变。"
 oe_mfg.4.a: "准许指派"
 oe_mfg.4.b: "只许雇工"
 oe_mfg.5.title: "一日下水"
 oe_mfg.5.desc: "推行全新标准化构件与流水舾装法后，官营船坞向世人展现了惊世骇俗的造舰效率：一艘战舰从光秃龙骨驶入装配渠，到安装桨架、火炮、绳索并高挂满帆下水，竟仅仅耗费了短短一日。受邀观摩的异国使节看得目瞪口呆，盛赞其鬼斧神工。"
 oe_mfg.5.a: "这是国家的威仪"
 oe_mfg.6.title: "水晶工匠出逃"
 oe_mfg.6.desc: "几名掌握水晶玻璃技艺的工匠逃往国外，带走了配方。是严惩其家属、派人追回，还是索性放开，让匠人与学者自由往来？"
 oe_mfg.6.a: "严惩叛匠，守住技艺"
 oe_mfg.6.b: "放开交流"
 oe_mfg.7.title: "丝商迁入王都"
 oe_mfg.7.desc: "一批世代精于缫丝、织锦与长途贩运的工匠与丝商携家带口迁入王都，看中此地的繁盛市集与御用工场庇护。他们已在王室工场旁的河岸边筑起崭新的作坊街区，织机声昼夜不绝，正恭候朝廷赐予行会特许与免税优待。"
 oe_mfg.7.a: "给予庇护与特许"
 oe_mfg.8.title: "坩埚钢与细棉布行销四方"
 oe_mfg.8.desc: "我国工坊以秘法冶炼出的高碳坩埚钢刀剑韧利绝伦，织染坊出产的印花细棉布亦轻柔鲜艳，两项绝技产品一经面世便名动四海。来自五湖四海的商队与海商竞相高价收购、昼夜转运至欧亚各大市场，国中匠坊订单络绎不绝。"
 oe_mfg.8.a: "扩大生产"
 oe_mfg.9.title: "远方的瓷茶热"
 oe_mfg.9.desc: "万里之外的异域宫廷与豪门贵族近来掀起了一股狂热的瓷器与饮茶风尚，竞相以陈设我国名窑瓷器、品饮清香佳茗为无上风雅。远洋商船队蜂拥驶抵口岸抢购货源，一船船雪亮白银随之源源流入国境，令窑场与茶山一片鼎沸。"
 oe_mfg.9.a: "多烧外销瓷"
 oe_mfg.10.title: "军火供不应求"
 oe_mfg.10.desc: "前线战火愈演愈烈，枪炮弹药消耗如流水般惊人，市面上的硝石、精铜与锡锭价格顷刻间一路飙升。尽管皇家兵工厂的炉火昼夜不熄、工匠轮班赶工，军械产出依旧难以填补前线的巨大缺口，究竟是不惜重金采买还是令全军节省弹药，亟待御裁。"
 oe_mfg.10.a: "不惜代价采买原料"
 oe_mfg.10.b: "令各军节省弹药"
 oe_mfg.11.title: "精钢流水线"
 oe_mfg.11.desc: "皇家兵工厂彻底革新锻造工艺，全面改用高纯度精钢铸造枪管与炮栓，并订立严苛的统一量规，使每一枚零件皆按标准尺寸批量加工、彼此互换无碍。革新落成之后，兵工厂的军械产量比从前猛增一大截，质量亦更加整齐精良。"
 oe_mfg.11.a: "推广到各厂"
 oe_mfg.12.title: "工场金奖"
 oe_mfg.12.desc: "汇聚多国名匠珍品与奇技淫巧的盛大工商业评比会落下帷幕。面对各地选送的织锦、钟表、精钢器皿与名窑瓷器，评委与各方客商一致折服于我国御用工场的绝佳工艺，将最高荣誉金奖颁予本国出品，令海内外商界赞誉如潮。"
 oe_mfg.12.a: "昭告天下"
 oe_mfg.90.title: "【读数】御用工场"
 oe_mfg.90.desc: "v11.8 御用工场读数：\n· 织造坊 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_silk_count')|0]#!，兵工厂 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_arsenal_count')|0]#!，御窑 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_kiln_count')|0]#!，铁炉 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_ural_count')|0]#!，军械库 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_arsenale_count')|0]#!，钢棉工坊 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_mfg_karkhaneh_count')|0]#!"
 oe_mfg.90.a: "关闭"
