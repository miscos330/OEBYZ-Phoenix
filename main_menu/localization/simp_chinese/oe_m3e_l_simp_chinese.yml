# NEW 2026-11-23 v21.0 Module E Part 1 (Worker 14A): 41 T2/T3 Mission Climax Events & 123 Static Modifiers (oe_m3e_). Generated by gen_v210_missions_t23.py.
 oe_m3e.1.t:0 "不朽至善共和国：海洋联邦大宪章"
 oe_m3e.1.d:0 "从圣马可广场熠熠生辉的飞狮雕像，到干地亚海防石墙与伦巴第河岸诸城，海洋联邦各地代表齐聚总督府前。没有任何列强密约能迫使威尼斯屈膝；我们的[navy|e]、里亚托[trade|e]与高效[cabinet|e]已令共和国以独立[great_power|e]之姿傲立世间。大议会此刻须抉择至善共和国迈向新世纪的立国柱石。"
 oe_m3e.1.a:0 "加冕海洋领地：永驻军械库舰队与黎凡特商权"
 STATIC_MODIFIER_NAME_oe_m3e_ven_maritime_federation_mod:0 "不朽海洋联邦"
 STATIC_MODIFIER_DESC_oe_m3e_ven_maritime_federation_mod:0 "标准化军械库船台与联邦黎凡特商港联袂守护威尼斯在地中海航道上的永恒霸权。"
 oe_m3e.1.b:0 "固守意大利本土共同体与伦巴第工商业"
 STATIC_MODIFIER_NAME_oe_m3e_ven_terraferma_shield_mod:0 "本土盾牌与工坊联盟"
 STATIC_MODIFIER_DESC_oe_m3e_ven_terraferma_shield_mod:0 "阿尔卑斯棱堡与伦巴第—威尼托工坊群将北意塑造成攻无不破的共和腹地。"
 oe_m3e.1.c:0 "弘扬阿尔杜斯学术共和与威尼斯文化外交"
 STATIC_MODIFIER_NAME_oe_m3e_ven_aldine_enlightenment_mod:0 "威尼斯启蒙文脉"
 STATIC_MODIFIER_DESC_oe_m3e_ven_aldine_enlightenment_mod:0 "威尼斯印书坊、常驻使团与艺术工坊将人文光辉与共和声望播撒至全欧宫廷。"
 oe_m3e.2.t:0 "高傲之城永耀：欧亚海洋金融联邦"
 oe_m3e.2.d:0 "圣乔治宫内的黄金天平昼夜不息，来自里斯本、安特卫普、卡法与塞维利亚的汇票尽数以热那亚斯库多清算。凭充沛[gold|e]储备、星罗[trade|e]商站与铁甲[navy|e]共立不朽宪章，热那亚已作为独立[great_power|e]傲视诸王。总督与银行执事会此刻须为金融共和国定下百年宏策。"
 oe_m3e.2.a:0 "确立欧亚主权票据清算中枢"
 STATIC_MODIFIER_NAME_oe_m3e_gen_clearinghouse_mod:0 "圣乔治主权清算中枢"
 STATIC_MODIFIER_DESC_oe_m3e_gen_clearinghouse_mod:0 "热那亚汇票与严密金银储备执掌全欧信用市场，令财政稳如磐石而通胀绝迹。"
 oe_m3e.2.b:0 "扩编马奥纳武装舰队与双海商站网"
 STATIC_MODIFIER_NAME_oe_m3e_gen_maona_armada_mod:0 "马奥纳武装海运网"
 STATIC_MODIFIER_DESC_oe_m3e_gen_maona_armada_mod:0 "由商股供养的护航舰队与海岛商站，确保热那亚帆影自直布罗陀至克里米亚畅行无阻。"
 oe_m3e.2.c:0 "永固二十八氏族共和宪政与都市荣华"
 STATIC_MODIFIER_NAME_oe_m3e_gen_alberghi_charter_mod:0 "永恒氏族共和宪章"
 STATIC_MODIFIER_DESC_oe_m3e_gen_alberghi_charter_mod:0 "热那亚商贾豪族的宪政和谐持续推动都市兴盛，并赋予共和国显赫的外交威望。"
 oe_m3e.3.t:0 "五月三日王冠：三海立宪联邦"
 oe_m3e.3.d:0 "钟声自瓦维尔响彻华沙、维尔纽斯与基辅，大瑟姆在无惧任何强邻刺刀的欢呼声中正式批准《五月三日宪法》。彻底废除掣肘否决权后，我们的[parliament|e]、铁血[army|e]与繁荣[trade|e]走廊将波罗的海与黑海连为不倒[great_power|e]。立宪联邦此刻须为新生的三海王冠确立永恒志业。"
 oe_m3e.3.a:0 "确立近代立宪瑟姆与公民自由大宪章"
 STATIC_MODIFIER_NAME_oe_m3e_plc_may_third_charter_mod:0 "五月三日宪政大典"
 STATIC_MODIFIER_DESC_oe_m3e_plc_may_third_charter_mod:0 "多数表决制、国民教育与市民参政把波兰立陶宛塑造成欧陆最富生命力的立宪大国。"
 oe_m3e.3.b:0 "永铸翼骑兵铁阵与三海边防铁壁"
 STATIC_MODIFIER_NAME_oe_m3e_plc_winged_hussars_mod:0 "三海铁翼雷霆"
 STATIC_MODIFIER_DESC_oe_m3e_plc_winged_hussars_mod:0 "近代化翼骑兵与常备边疆兵团枕戈待旦，令一切企图瓜分联邦的同盟望风披靡。"
 oe_m3e.3.c:0 "弘扬维斯瓦—第聂伯谷仓与多教宽容联邦"
 STATIC_MODIFIER_NAME_oe_m3e_plc_intermarium_union_mod:0 "三海谷仓与宽容之邦"
 STATIC_MODIFIER_DESC_oe_m3e_plc_intermarium_union_mod:0 "宗教宽容与贯通两海的粮食贸易将波兰、立陶宛与鲁塞尼亚诸族紧密凝聚于富足之中。"
 oe_m3e.4.t:0 "神龙骑士凯旋：圣斯蒂芬不朽王冠"
 oe_m3e.4.d:0 "从布达巍峨城堡山至贝尔格莱德白石要塞与喀尔巴阡峻岭，神龙勋章徽记在中欧最雄伟的河流王国上空屹立不倒。我们的铁血[army|e]、科尔文[cultural_tradition|e]与多教共治[parliament|e]未曾折戟，匈牙利已以无可争议的[great_power|e]雄踞一方。王国议会齐聚布达，为圣斯蒂芬王冠定下不朽大业。"
 oe_m3e.4.a:0 "永铸常备黑军与多瑙钢铁边防"
 STATIC_MODIFIER_NAME_oe_m3e_hun_black_army_mod:0 "布达不朽黑军"
 STATIC_MODIFIER_DESC_oe_m3e_hun_black_army_mod:0 "由王室常年供养的职业兵团与多瑙河要塞链，将喀尔巴阡盆地化作坚不可摧的钢铁壁垒。"
 oe_m3e.4.b:0 "缔造喀尔巴阡多族宽容共治联邦"
 STATIC_MODIFIER_NAME_oe_m3e_hun_danubian_charter_mod:0 "多瑙诸族共治宪章"
 STATIC_MODIFIER_DESC_oe_m3e_hun_danubian_charter_mod:0 "信仰宽容与公正王宪将马扎尔、斯拉夫、萨克森与克罗地亚诸部牢牢凝聚于圣冠之下。"
 oe_m3e.4.c:0 "光大科尔文文艺复兴与多瑙金福林商路"
 STATIC_MODIFIER_NAME_oe_m3e_hun_corvinian_golden_mod:0 "科尔文黄金盛世"
 STATIC_MODIFIER_DESC_oe_m3e_hun_corvinian_golden_mod:0 "皇家书院、足色金福林与兴旺的多瑙河商港，令布达跃升为兼擅文教与财富的中欧明珠。"
 oe_m3e.5.t:0 "双头白鹰重振：巴尔干正教大帝国"
 oe_m3e.5.d:0 "自俯瞰多瑙河的贝尔格莱德危崖至斯科普里、佩奇修道院与温暖南海港湾，塞尔维亚王冠在欧陆最古老的十字路口巍然凯旋。承续杜尚法统、深厚[religious_influence|e]与群山淬炼的[army|e]英风，帝国已作为捍卫[legitimacy|e]的永恒[great_power|e]屹立于世。帝国大会此刻须为巴尔干正教霸业定下万世国策。"
 oe_m3e.5.a:0 "高举杜尚之剑：巴尔干钢铁军团与边防"
 STATIC_MODIFIER_NAME_oe_m3e_ser_dusan_legions_mod:0 "巴尔干钢铁之盾"
 STATIC_MODIFIER_DESC_oe_m3e_ser_dusan_legions_mod:0 "山地火枪兵团、重装骑兵与多瑙河棱堡使塞尔维亚腹地化作任何帝国皆难以逾越的铁壁。"
 oe_m3e.5.b:0 "弘扬自主大牧首区与东南欧正教同盟"
 STATIC_MODIFIER_NAME_oe_m3e_ser_orthodox_commonwealth_mod:0 "东南欧正教柱石"
 STATIC_MODIFIER_DESC_oe_m3e_ser_orthodox_commonwealth_mod:0 "佩奇大牧首区与巴尔干正教同盟将东南欧诸民凝聚于坚如磐石的精神与外交团结之中。"
 oe_m3e.5.c:0 "兴盛巴尔干银脉商路与贝尔格莱德启蒙"
 STATIC_MODIFIER_NAME_oe_m3e_ser_silver_enlightenment_mod:0 "贝尔格莱德银脉与启蒙"
 STATIC_MODIFIER_DESC_oe_m3e_ser_silver_enlightenment_mod:0 "巴尔干富银矿脉、海陆商队与近代书院将塞尔维亚塑造成兴旺发达的东南欧商贸学术枢纽。"
 oe_m3e.6.t:0 "浑天仪圣冠"
 oe_m3e.6.d:0 "满载马拉巴尔胡椒、摩鹿加丁香、中华生丝与巴西黄金的印度大帆船群在贝伦塔下抛锚，里斯本全城钟声齐鸣。从休达与大西洋群岛至果阿和马六甲，无敌[navy|e]、全球[trade|e]特许网与广布[maritime_presence|e]已令葡萄牙跻身顶尖[great_power|e]。王室枢密院此刻须为双洋帝国择定万世长策。"
 oe_m3e.6.a:0 "永固印度大帆船航线与全球香料专营"
 STATIC_MODIFIER_NAME_oe_m3e_por_carreira_monopoly_mod:0 "印度航线海洋霸主"
 STATIC_MODIFIER_DESC_oe_m3e_por_carreira_monopoly_mod:0 "重炮护航的香料大帆船队与里斯本印度院清算体系，确保葡萄牙牢牢执掌双洋商贸命脉。"
 oe_m3e.6.b:0 "加固海外总督要塞链与远洋重炮舰队"
 STATIC_MODIFIER_NAME_oe_m3e_por_estado_armada_mod:0 "海外总督铁链舰队"
 STATIC_MODIFIER_DESC_oe_m3e_por_estado_armada_mod:0 "矗立各大海峡咽喉的石砌要塞与重炮舰队，在大西洋与印度洋上筑起不可撼动的海防长链。"
 oe_m3e.6.c:0 "推进蓬巴尔启蒙商政与跨洋联邦建设"
 STATIC_MODIFIER_NAME_oe_m3e_por_pombaline_atlantic_mod:0 "蓬巴尔双洋革新"
 STATIC_MODIFIER_DESC_oe_m3e_por_pombaline_atlantic_mod:0 "理性高效的近代部院、拓殖宪章与航海科学，令里斯本与海外诸省同步迈入富强盛世。"
 oe_m3e.7.t:0 "北方雄狮加冕"
 oe_m3e.7.d:0 "从斯德哥尔摩群岛王宫至里加繁华港埠与重兵扼守的海峡，蓝底金十字旗在一统的波罗的海内湖上空猎猎作响。依托贝里斯拉根铁厂、冷峻严整的卡罗林[regulars|e]与常备[navy|e]，瑞典绝非昙花一现，而是兼具强固[crown_power|e]的永恒[great_power|e]。国会与御前会议此刻须为北方大帝国定立国本。"
 oe_m3e.7.a:0 "永立卡罗林军事学院与齐射突击法典"
 STATIC_MODIFIER_NAME_oe_m3e_swe_carolean_doctrine_mod:0 "不败卡罗林军典"
 STATIC_MODIFIER_DESC_oe_m3e_swe_carolean_doctrine_mod:0 "排枪齐射、白刃突击与分兵后勤体系相融，使瑞典王师成为令全欧敬畏的近代战法标杆。"
 oe_m3e.7.b:0 "统御波罗的海内湖：海权船队与环海商盟"
 STATIC_MODIFIER_NAME_oe_m3e_swe_baltic_imperium_mod:0 "波罗的海永恒霸权"
 STATIC_MODIFIER_DESC_oe_m3e_swe_baltic_imperium_mod:0 "稳控里加、塔林与海峡航道，将北欧木材、谷物与精铁贸易的丰厚红利尽数汇入斯德哥尔摩。"
 oe_m3e.7.c:0 "振兴北方精钢工场与皇家格致科学院"
 STATIC_MODIFIER_NAME_oe_m3e_swe_polhem_science_mod:0 "北方工程启蒙盛世"
 STATIC_MODIFIER_DESC_oe_m3e_swe_polhem_science_mod:0 "精密冶铁工场、机械作坊与皇家科学院将瑞典丰饶矿藏转化为领先全欧的近代工业实力。"
 oe_m3e.8.t:0 "不落黄金世纪"
 oe_m3e.8.d:0 "艾湾港内桅樯如林，东印度公司巨舰满载肉豆蔻与茶叶与波罗的海粮船并泊，阿姆斯特丹交易所的利率牵动全欧君主。强敌舰队未能压垮联合海军部，陆上狂澜亦未淹没圩田防线；凭远洋[trade|e]、无畏[navy|e]与自由[literacy|e]，共和国已跻身璀璨[great_power|e]。三级会议此刻须为不落黄金世纪定下指针。"
 oe_m3e.8.a:0 "永续阿姆斯特丹金融霸权与东印度商网"
 STATIC_MODIFIER_NAME_oe_m3e_ned_global_bourse_mod:0 "阿姆斯特丹世界交易所"
 STATIC_MODIFIER_DESC_oe_m3e_ned_global_bourse_mod:0 "股份资本、稳健汇兑银行储备与全球商站网，将阿姆斯特丹永久铸成世界金融与贸易心脏。"
 oe_m3e.8.b:0 "宣示《海洋自由论》：大洋战列海军部"
 STATIC_MODIFIER_NAME_oe_m3e_ned_mare_liberum_mod:0 "自由海洋大海军部"
 STATIC_MODIFIER_DESC_oe_m3e_ned_mare_liberum_mod:0 "训练有素的战列舰队与昼夜运转的赞河船厂，以尼德兰铁炮捍卫通达四海的航运霸权。"
 oe_m3e.8.c:0 "弘扬良知自由、光学科学与画坛盛世"
 STATIC_MODIFIER_NAME_oe_m3e_ned_conscience_golden_mod:0 "良知自由与格致明灯"
 STATIC_MODIFIER_DESC_oe_m3e_ned_conscience_golden_mod:0 "庇护全欧最富远见的学者、工匠与出版家，使尼德兰成为永不枯竭的科学发明与艺术源泉。"
 oe_m3e.9.t:0 "圣瓦茨拉夫永恒王冠"
 oe_m3e.9.d:0 "自布拉格城堡山钟楼远眺摩拉维亚、西里西亚与卢萨蒂亚诸镇，圣瓦茨拉夫王冠领地完整独立、百业兴隆。没有任何外邦王朝折断我们的法统；融合银矿富庶、查理大学[literacy|e]、铁壁[fort|e]与首席选侯[diplomacy|e]，布拉格已昂然成为[great_power|e]。波希米亚议会与王廷此刻须为王国确立百年大计。"
 oe_m3e.9.a:0 "兴盛波希米亚工坊：水晶、银币与西里西亚织造"
 STATIC_MODIFIER_NAME_oe_m3e_boh_crystal_industry_mod:0 "波希米亚工业心脏"
 STATIC_MODIFIER_DESC_oe_m3e_boh_crystal_industry_mod:0 "水晶工艺行会、王家塔勒造币厂与西里西亚纺织重镇，将王冠领地铸造成中欧最富庶的工商业中枢。"
 oe_m3e.9.b:0 "巩固首席选侯威仪与波希米亚不陷堡垒"
 STATIC_MODIFIER_NAME_oe_m3e_boh_electoral_bastion_mod:0 "不陷选侯钢铁堡垒"
 STATIC_MODIFIER_DESC_oe_m3e_boh_electoral_bastion_mod:0 "星形要塞锁控群山隘口、铁血军风震慑四邻，布拉格在德意志与中欧事务中享有至高权威。"
 oe_m3e.9.c:0 "光大查理大学启蒙与黄金布拉格文脉"
 STATIC_MODIFIER_NAME_oe_m3e_boh_carolinum_beacon_mod:0 "黄金布拉格人文殿堂"
 STATIC_MODIFIER_DESC_oe_m3e_boh_carolinum_beacon_mod:0 "天文学家、法学家与建筑巨匠云集查理大学，令波希米亚学术光辉与典雅文治照耀中欧。"
 oe_m3e.10.t:0 "北方铁血王国"
 oe_m3e.10.d:0 "在自波茨坦、柏林飘扬至柯尼斯堡与弗罗茨瓦夫的黑鹰战旗下，全欧目睹了一座以钢铁意志自北方沙原崛起的新兴巨邦。凭借精密如钟表的[cabinet|e]行政、所向披靡的掷弹兵[regulars|e]与开明[literacy|e]，普鲁士已巍然跻身顶尖[great_power|e]。王座此刻须为普鲁士世纪定下永恒魂魄。"
 oe_m3e.10.a:0 "铸就普鲁士总参谋部与斜行战术铁军"
 STATIC_MODIFIER_NAME_oe_m3e_pru_iron_legions_mod:0 "波茨坦铁血军纪"
 STATIC_MODIFIER_DESC_oe_m3e_pru_iron_legions_mod:0 "疾风骤雨般的排枪节奏、征兵区储备与总参谋部运筹，使普鲁士陆军成为欧陆最锋利之剑。"
 oe_m3e.10.b:0 "推行施泰因—哈登贝格择优文官与工业强国"
 STATIC_MODIFIER_NAME_oe_m3e_pru_merit_state_mod:0 "钢铁总务署文官体系"
 STATIC_MODIFIER_DESC_oe_m3e_pru_merit_state_mod:0 "廉洁严明的文官考选、高效税制与西里西亚冶铁工场，驱动着全欧最精密的国家机器。"
 oe_m3e.10.c:0 "弘扬无忧宫启蒙与阿尔贝蒂娜理性哲学"
 STATIC_MODIFIER_NAME_oe_m3e_pru_sanssouci_reason_mod:0 "无忧宫理性启蒙"
 STATIC_MODIFIER_DESC_oe_m3e_pru_sanssouci_reason_mod:0 "普及义务学堂、柯尼斯堡哲学思辨与皇家学院相辅相成，将普鲁士责任精神与格致革新融为一体。"
