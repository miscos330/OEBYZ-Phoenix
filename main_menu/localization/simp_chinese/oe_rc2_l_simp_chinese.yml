 # NEW 2026-11-23 v21.0 Module C: Byzantine Reconquest & Hegemony Campaigns 2.0 (oe_rc2_) — Localization (simp_chinese). Generated by gen_v210_byz_reconquest2.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_rc2_approach_ultimatum_mod: "帝国最后通牒与归顺宪章"
 STATIC_MODIFIER_DESC_oe_rc2_approach_ultimatum_mod: "帝国特使随军先行颁布保护宪章与归顺条件，显著缓和战区敌意并安抚各藩邦军心。"
 STATIC_MODIFIER_NAME_oe_rc2_subversion_mod: "战区策反与内应谍网"
 STATIC_MODIFIER_DESC_oe_rc2_subversion_mod: "帝国重金收买敌境将弁、城门守吏与向导内应，令围城与行军推进大幅提速。"
 STATIC_MODIFIER_NAME_oe_rc2_subverted_defense_mod: "防线遭策反与军心分裂"
 STATIC_MODIFIER_DESC_oe_rc2_subverted_defense_mod: "帝国暗中分化与重金策反令城防将士互相猜忌，要塞守备与前线士气随之动摇。"
 STATIC_MODIFIER_NAME_oe_rc2_approach_blitz_mod: "全面收复诏书：雷霆突进"
 STATIC_MODIFIER_DESC_oe_rc2_approach_blitz_mod: "君士坦丁堡颁下寸土必争的全面收复诏书，军团士气与割地效率高涨，却也引发高昂军费与周边列强警觉。"
 STATIC_MODIFIER_NAME_oe_rc2_supply_generous_overlord_mod: "丰厚帝国总后勤拨款"
 STATIC_MODIFIER_DESC_oe_rc2_supply_generous_overlord_mod: "君士坦丁堡全额承担前线粮栈与海运补给开支，虽加重国库负担，却换来远征诸军军纪严明、效忠无贰。"
 STATIC_MODIFIER_NAME_oe_rc2_supply_generous_subject_mod: "帝国总后勤署足额配给"
 STATIC_MODIFIER_DESC_oe_rc2_supply_generous_subject_mod: "源源不断自君士坦丁堡运抵的军饷、干粮与攻城器械，使远征军团斗志昂扬且损耗大减。"
 STATIC_MODIFIER_NAME_oe_rc2_supply_standard_overlord_mod: "常规行省征发配给"
 STATIC_MODIFIER_DESC_oe_rc2_supply_standard_overlord_mod: "帝国国库与沿线行省按例分摊远征军粮饷，兼顾财政承受力与前线作战稳定。"
 STATIC_MODIFIER_NAME_oe_rc2_supply_standard_subject_mod: "帝国常例军需补给"
 STATIC_MODIFIER_DESC_oe_rc2_supply_standard_subject_mod: "按期抵达的帝国常规补给船队维持着军营日常粮秣与基本士气。"
 STATIC_MODIFIER_NAME_oe_rc2_supply_austerity_overlord_mod: "紧缩军费：就地征掠补给"
 STATIC_MODIFIER_DESC_oe_rc2_supply_austerity_overlord_mod: "大幅削减国库军费拨款并令远征军就地筹粮，虽省下巨额开支，却助长沿途仇恨与边将猜忌。"
 STATIC_MODIFIER_NAME_oe_rc2_supply_austerity_subject_mod: "补给匮乏与就地筹饷"
 STATIC_MODIFIER_DESC_oe_rc2_supply_austerity_subject_mod: "君士坦丁堡长期拖欠补给，迫使将士在敌境四处劫掠维生，军中怨声载道且对朝廷离心日深。"
 STATIC_MODIFIER_NAME_oe_rc2_purged_generals_mod: "清洗边将与军权震荡"
 STATIC_MODIFIER_DESC_oe_rc2_purged_generals_mod: "紧急召回并清洗手握重兵的远征名将虽稳住了皇权，却令前线士气与军中指挥经验蒙受损失。"
 STATIC_MODIFIER_NAME_oe_rc2_autonomous_legions_mod: "远征军帅自筹战利品"
 STATIC_MODIFIER_DESC_oe_rc2_autonomous_legions_mod: "默许远征统帅自行截留战利品虽暂缓财政压力并刺激攻城，却助长骄兵悍将尾大不掉与地方分离主义。"
 STATIC_MODIFIER_NAME_oe_rc2_overextension_t1_mod: "帝国过扩疲惫·一阶：边防吃紧"
 STATIC_MODIFIER_DESC_oe_rc2_overextension_t1_mod: "多线征伐或久战不休令帝国财政与军政体系承压，宫廷与军费开支攀升，国内各阶层开始流露厌战情绪。"
 STATIC_MODIFIER_NAME_oe_rc2_overextension_t2_mod: "帝国过扩疲惫·二阶：穷兵黩武"
 STATIC_MODIFIER_DESC_oe_rc2_overextension_t2_mod: "连年跨区苦战与多线过扩已逼近帝国国力极限，财政军费剧增，行省分离主义与本土叛乱风险骤然抬头。"
 STATIC_MODIFIER_NAME_oe_rc2_frontier_consolidation_mod: "休养生息与整顿边防"
 STATIC_MODIFIER_DESC_oe_rc2_frontier_consolidation_mod: "趁承平之机整饬边防要塞、清核税籍并抚恤疲敝民力，令帝国控制度、繁荣与各阶层满意度稳步回升。"
 STATIC_MODIFIER_NAME_oe_rc2_italy_reconcile_mod: "罗马教廷与五牧首和解"
 STATIC_MODIFIER_DESC_oe_rc2_italy_reconcile_mod: "与罗马教廷达成体面的教会共治协约，显著缓和西方拉丁世界敌意并巩固皇帝正统威望。"
 STATIC_MODIFIER_NAME_oe_rc2_italy_crush_mod: "铁血震慑拉丁同盟"
 STATIC_MODIFIER_DESC_oe_rc2_italy_crush_mod: "断然拒绝拉丁教廷调停，以铁骑与攻城锤宣告罗马帝国对亚平宁无可置疑的最高主权。"
 STATIC_MODIFIER_NAME_oe_rc2_italy_guilds_mod: "伦巴第与海上行会特许协约"
 STATIC_MODIFIER_DESC_oe_rc2_italy_guilds_mod: "以御赐特许宪章将意大利商行、毛纺行会与造船厂纳入帝国商路网络，海贸与桨帆舰队齐兴。"
 STATIC_MODIFIER_NAME_oe_rc2_egypt_annona_mod: "重开帝国阿诺纳运粮舰队"
 STATIC_MODIFIER_DESC_oe_rc2_egypt_annona_mod: "自亚历山大港启航的庞大运粮船队再度源源不断输往君士坦丁堡与各战区军营，帝国粮储充盈。"
 STATIC_MODIFIER_NAME_oe_rc2_egypt_coptic_mod: "科普特自治与亚历山大牧首协约"
 STATIC_MODIFIER_DESC_oe_rc2_egypt_coptic_mod: "保障科普特教会与尼罗河地方士绅的传统自治，使埃及秩序迅速稳固，但改宗推进相应放缓。"
 STATIC_MODIFIER_NAME_oe_rc2_egypt_customs_mod: "红海海关与卡里米香料关税"
 STATIC_MODIFIER_DESC_oe_rc2_egypt_customs_mod: "帝国税吏接管亚历山大与达米埃塔海关，对经红海北上的东方香料课以丰厚关税。"
 STATIC_MODIFIER_NAME_oe_rc2_africa_navy_mod: "迦太基总督区战舰队"
 STATIC_MODIFIER_DESC_oe_rc2_africa_navy_mod: "重修突尼斯湾船坞与海军要塞，扫清巴巴里海盗并牢牢扼守地中海中部水道。"
 STATIC_MODIFIER_NAME_oe_rc2_africa_berber_mod: "柏柏尔同盟军边疆宪章"
 STATIC_MODIFIER_DESC_oe_rc2_africa_berber_mod: "归附帝国的柏柏尔部族担任沙漠向导与边疆骑兵，大幅降低内陆损耗并稳固撒哈拉北缘防线。"
 STATIC_MODIFIER_NAME_oe_rc2_africa_ports_mod: "北非粮港与橄榄庄园总署"
 STATIC_MODIFIER_DESC_oe_rc2_africa_ports_mod: "复兴迦太基沿岸粮仓与橄榄油出口港，为帝国供应丰沛食粮与稳定的海贸税源。"
 STATIC_MODIFIER_NAME_oe_rc2_iberia_accord_mod: "伊比利亚联合十字军协约"
 STATIC_MODIFIER_DESC_oe_rc2_iberia_accord_mod: "与伊比利亚诸基督教王国划定协同进军边界，有效缓和西欧敌意并增强属邦信任。"
 STATIC_MODIFIER_NAME_oe_rc2_iberia_spania_mod: "斯帕尼亚与西哥特罗马法统"
 STATIC_MODIFIER_DESC_oe_rc2_iberia_spania_mod: "高举查士丁尼斯帕尼亚行省旧旗，严明军纪并强化帝国在伊比利亚的领土法统索求。"
 STATIC_MODIFIER_NAME_oe_rc2_iberia_strait_mod: "赫拉克勒斯之柱海峡关税"
 STATIC_MODIFIER_DESC_oe_rc2_iberia_strait_mod: "驻守直布罗陀海峡与卡塔赫纳的帝国舰队掌控两洋咽喉，拓宽远洋贸易航程并壮大重型战舰。"
 STATIC_MODIFIER_NAME_oe_rc2_gaul_claim_mod: "清算查理曼西帝法统"
 STATIC_MODIFIER_DESC_oe_rc2_gaul_claim_mod: "公开宣告法兰克西帝名号僭越无效，激发全军罗马荣光与皇权凝聚，同时招致西欧诸邦戒备。"
 STATIC_MODIFIER_NAME_oe_rc2_gaul_nobles_mod: "高卢贵族与行省议会怀柔宪章"
 STATIC_MODIFIER_DESC_oe_rc2_gaul_nobles_mod: "承认高卢世家与地方议会在罗马法框架下的传统特权，迅速平息反抗并稳步提升行省控制。"
 STATIC_MODIFIER_NAME_oe_rc2_gaul_trade_mod: "里昂—马赛罗讷河谷商贸宪章"
 STATIC_MODIFIER_DESC_oe_rc2_gaul_trade_mod: "贯通马赛良港与里昂大集市，将西欧呢绒与白银商流汇聚于帝国财政体系之中。"
 STATIC_MODIFIER_NAME_oe_rc2_britain_naval_mod: "英吉利海峡制海权宪章"
 STATIC_MODIFIER_DESC_oe_rc2_britain_naval_mod: "远洋重舰纵横英吉利海峡，牢牢保障跨海补给通道畅通并显著优化舰队维护效率。"
 STATIC_MODIFIER_NAME_oe_rc2_britain_client_mod: "不列颠附庸王国与哈德良长城防线"
 STATIC_MODIFIER_DESC_oe_rc2_britain_client_mod: "修缮北方长城边堡并确立不列颠属邦共治格局，令防线坚不可摧且附庸忠诚大增。"
 STATIC_MODIFIER_NAME_oe_rc2_britain_monopoly_mod: "康沃尔锡矿与不列颠羊毛专卖"
 STATIC_MODIFIER_DESC_oe_rc2_britain_monopoly_mod: "设立帝国锡矿与羊毛专卖货栈，将康沃尔锡锭与不列颠精纺羊毛化为源源不断的国库收益。"
 STATIC_MODIFIER_NAME_oe_rc2_persia_seleucid_mod: "塞琉古—罗马东方大疆界诏令"
 STATIC_MODIFIER_DESC_oe_rc2_persia_seleucid_mod: "承继亚历山大、图拉真与希拉克略之东方雄略，强化东线劲旅军纪、攻城威力与兵源征募。"
 STATIC_MODIFIER_NAME_oe_rc2_persia_accord_mod: "幼发拉底河分界与双雄共治协约"
 STATIC_MODIFIER_DESC_oe_rc2_persia_accord_mod: "沿幼发拉底与扎格罗斯确立对等疆界与礼仪共治，大幅缓解厌战情绪并平息两河流域动荡。"
 STATIC_MODIFIER_NAME_oe_rc2_persia_silk_mod: "丝绸商队与底格里斯护商总署"
 STATIC_MODIFIER_DESC_oe_rc2_persia_silk_mod: "沿大不里士至巴格达广设护商驿站，将波斯生丝与东方珍货源源不断导入帝国市场。"
 STATIC_MODIFIER_NAME_oe_rc2_arabia_spice_mod: "亚丁—苏伊士香料走廊宪章"
 STATIC_MODIFIER_DESC_oe_rc2_arabia_spice_mod: "打通亚丁至苏伊士的帝国直航香料走廊，大幅拓展印度洋贸易航程与海上商业掌控力。"
 STATIC_MODIFIER_NAME_oe_rc2_arabia_foederati_mod: "加萨尼—阿拉伯沙漠同盟军"
 STATIC_MODIFIER_DESC_oe_rc2_arabia_foederati_mod: "复兴古老的加萨尼沙漠同盟军制度，依托熟谙水井与商道的阿拉伯骑兵大幅降低荒漠损耗。"
 STATIC_MODIFIER_NAME_oe_rc2_arabia_truce_mod: "圣城休战与朝觐护航协定"
 STATIC_MODIFIER_DESC_oe_rc2_arabia_truce_mod: "以帝国敕令保障麦加与麦地那朝觐商队安全通行，显著缓和整个伊斯兰世界的敌意与反抗。"
 STATIC_MODIFIER_NAME_oe_rc2_blacksea_bastion_mod: "赫尔松—克里米亚海军堡垒"
 STATIC_MODIFIER_DESC_oe_rc2_blacksea_bastion_mod: "加固克里米亚港塞并巡弋黑海桨帆舰队，将北岸打造为抵御草原与海盗袭扰的铜墙铁壁。"
 STATIC_MODIFIER_NAME_oe_rc2_blacksea_buffer_mod: "黑海草原缓冲带与边防轻骑"
 STATIC_MODIFIER_DESC_oe_rc2_blacksea_buffer_mod: "在钦察草原前沿编练边防轻骑与驻防缓冲带，兼顾兵源扩充与广袤草原行军机动。"
 STATIC_MODIFIER_NAME_oe_rc2_blacksea_emporium_mod: "黑海丝路与克里米亚谷仓总埠"
 STATIC_MODIFIER_DESC_oe_rc2_blacksea_emporium_mod: "亚速平原粮船与北道丝绸商队齐聚克里米亚诸埠，令黑海再度成为帝国专属的繁荣内海。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage1_mod: "消化一阶：军事管制与驻防摩擦"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage1_mod: "新收复战区仍处于战后军事管制期，繁重驻防开销与地方分离情绪持续考验帝国治理。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage1_governor_mod: "消化一阶：军区总督与军户清丈"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage1_governor_mod: "派驻精干军区总督清丈田亩、编置军户，显著减轻占领摩擦并加快中枢控制渗透。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage1_concil_mod: "消化一阶：市政安民与免税怀柔"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage1_concil_mod: "以短期减免田赋与市税换取新附城镇安定与生机恢复，虽暂损税入却极大缓和叛乱隐患。"
 STATIC_MODIFIER_NAME_oe_rc2_martial_levy_mod: "严苛军法与战时征发"
 STATIC_MODIFIER_DESC_oe_rc2_martial_levy_mod: "以高压军法强征军需，虽短期强化皇权掌控，却进一步激起被占领地区的地下反抗。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage2_civil_mod: "消化二阶：民用税政与行省总督府"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage2_civil_mod: "设立民用行省总督府统理赋税与市政，令新附之地的财政收益、城镇繁荣与控制度同步跃升。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage2_military_mod: "消化二阶：边疆军区与军户总督区"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage2_military_mod: "广授军户世袭份地并建置边疆军区，既扩充兵源、加固城防，又强力震慑地方叛乱。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage2_judicial_mod: "消化二阶：巴西利卡帝国法典行省"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage2_judicial_mod: "在战区全面推行《巴西利卡法典》与帝国巡回法庭，推动文化同化、稳固皇权并消弭分离意识。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage3_citizenship_mod: "消化三阶：帝国公民权与行省入籍元老院"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage3_citizenship_mod: "向完成整合的新行省全面颁授罗马市民权并增补元老席位，使其化作中兴帝国牢不可破的财政与人文柱石。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage3_demesne_mod: "消化三阶：皇室直辖行省与帝国税籍大成"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage3_demesne_mod: "新行省彻底并入帝国中枢税籍与皇室直辖体系，带来丰厚持久的赋税回报与稳固中央集权。"
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage3_autonomy_mod: "消化三阶：多元行省共荣与帝国商贸联盟"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage3_autonomy_mod: "以高度繁荣的多元行省自治格局凝聚地方商民与世家，使新领地长治久安且商贸兴旺。"
 STATIC_MODIFIER_NAME_oe_rc2_incorporated_province_loc_mod: "帝国正式整合行省"
 STATIC_MODIFIER_DESC_oe_rc2_incorporated_province_loc_mod: "历经军事管制与军区建制洗礼后，此地正式融入帝国行省体系，享有持久的秩序、繁荣与罗马化活力。"
 oe_rc2_dec_supply_doctrine.title: "调整帝国远征补给档位"
 oe_rc2_dec_supply_doctrine.desc: "召集帝国军需总管署，在「丰厚总后勤拨款」「常规行省配给」与「紧缩就地筹饷」之间调整远征军团补给档位（冷却12个月）。"
 oe_rc2_dec_supply_doctrine.a: "召开帝国军需总管会议"
 oe_rc2_dec_consolidate_frontiers.title: "休养生息与整顿边防"
 oe_rc2_dec_consolidate_frontiers.desc: "趁帝国处于和平且无远征战事之机，拨付150金币全面清除帝国过扩疲惫，安抚厌战阶层、恢复控制度并推动新收复行省的消化进程（冷却5年）。"
 oe_rc2_dec_consolidate_frontiers.a: "下诏休养生息与整顿边防"
 oe_rc2_dec_provincial_settlement.title: "推进新收复行省建制与消化"
 oe_rc2_dec_provincial_settlement.desc: "在新收复战区历经至少4年治理且国内稳定时，拨付200金币加速推进战后三段消化：由「第一阶段·军事管制」晋升「第二阶段·军区与总督区建制」，或由「第二阶段」完成「第三阶段·帝国行省正式整合」。"
 oe_rc2_dec_provincial_settlement.a: "派遣帝国钦差推进建制"
 oe_rc2.1.t: "出师诏略：远征战前战略方针"
 oe_rc2.1.d: "帝国双头鹰旗已在出征前线迎风猎猎，各路统帅正静候陛下定夺本战区的最高方略：是由特使先行颁布归顺宪章、劝降弱邦以缓敌意，还是以重金收买敌境派系、策反内应以利攻城，抑或颁下寸土必争的全面收复诏书、雷霆横扫全区？"
 oe_rc2.1.a: "帝国最后通牒与归顺宪章（劝降弱邦、缓和敌意）"
 oe_rc2.1.b: "重金分化敌方派系与策反内应（250金币，强化围城）"
 oe_rc2.1.c: "全面收复诏书：雷霆突进（高战分士气，高敌意与开销）"
 oe_rc2.2.t: "帝国总后勤署：远征军补给档位"
 oe_rc2.2.d: "跨海维持远征军团与远征附庸的粮秣军饷耗费甚巨。军需总管向陛下呈上三份后勤拨款方案：由君士坦丁堡全额供应丰厚粮饷、按常例由行省分摊配给，抑或紧缩军费令前线就地筹粮——后者虽可省钱，若久拖必生哗变之忧。"
 oe_rc2.2.a: "丰厚帝国总后勤拨款（高军费负担，远征军高忠诚与战力）"
 oe_rc2.2.b: "常规行省征发配给（收支与士气均衡）"
 oe_rc2.2.c: "紧缩军费：就地征掠补给（省国库，久行恐酿将领兵变）"
 oe_rc2.3.t: "贝利撒留与纳尔西斯之影"
 oe_rc2.3.d: "君士坦丁堡长期紧缩军费，令前线远征大营怨气沸腾。密报传回大皇宫：手握重兵的远征统帅已开始以私人名义分赏战利品，营中甚至传出拥立新君的流言——千年前贝利撒留与纳尔西斯功高震主的旧影再度笼罩帝国。"
 oe_rc2.3.a: "紧急颁赏恩饷350金币并升格为丰厚补给"
 oe_rc2.3.b: "紧急召回并清洗桀骜边将（稳固皇权，损伤士气）"
 oe_rc2.3.c: "默许远征军帅自行截留战利品（省财却助长尾大不掉）"
 oe_rc2.11.t: "意大利战区"
 oe_rc2.11.d: "随着帝国军团挺进亚平宁，拉文纳、那不勒斯与台伯河畔的政治棋局豁然展开：罗马教廷暗中试探五牧首共治的和解可能，强硬派拉丁诸侯则鼓吹反抗希腊统治的十字军同盟，而富庶的伦巴第与海上商埠行会正权衡东罗马皇帝能否保障其贸易特权。"
 oe_rc2.11.a: "和解罗马教廷与重立五牧首共治（200金币，缓和敌意）"
 oe_rc2.11.b: "粉碎拉丁同盟并强立罗马正统（大增威望与攻城力）"
 oe_rc2.11.c: "签署伦巴第与海上行会特许协约（商贸与桨帆舰齐兴）"
 oe_rc2.12.t: "埃及战区"
 oe_rc2.12.d: "肥沃的尼罗河三角洲与古老的亚历山大港再度响起希腊语号令。帝国官员勘查着曾养活罗马七百年的巨型粮仓，科普特主教与卡里米香料商行则静候君士坦丁堡的决断：重开阿诺纳运粮舰队、承认科普特教会自治，还是独揽红海海关重利？"
 oe_rc2.12.a: "重开帝国阿诺纳运粮舰队（200金币，丰沛粮产与繁荣）"
 oe_rc2.12.b: "缔结科普特自治与亚历山大牧首协约（稳固控制、减分离）"
 oe_rc2.12.c: "设立红海海关与卡里米香料关税总署（财税海贸大涨）"
 oe_rc2.13.t: "北非战区"
 oe_rc2.13.d: "从的黎波里到迦太基旧港，再到马格里布星罗棋布的海盗港湾，帝国双头鹰重返当年贝利撒留西征首胜之地。重建迦太基总督区战舰队可肃清地中海海盗，与内陆柏柏尔部族结盟或振兴沿海粮港则各具经略之妙。"
 oe_rc2.13.a: "重建迦太基总督区战舰队（200金币，制海肃清海盗）"
 oe_rc2.13.b: "颁布柏柏尔同盟军边疆宪章（150金币，大减沙漠损耗）"
 oe_rc2.13.c: "振兴地中海粮港与橄榄庄园总署（粮产与商税双收）"
 oe_rc2.14.t: "伊比利亚战区"
 oe_rc2.14.d: "踏入伊比利亚的帝国军团，正与历经数百年收复失地运动锤炼出的诸基督教王国狭路相逢。御前重臣激烈争论：是与半岛诸王共商联合十字军分界，还是高举查士丁尼斯帕尼亚行省法统全面争雄，抑或扼守直布罗陀海峡独占两洋关税？"
 oe_rc2.14.a: "与伊比利亚诸王签署联合十字军协约（150金币，缓和西欧）"
 oe_rc2.14.b: "宣称斯帕尼亚与西哥特罗马法统（强军纪与战分效率）"
 oe_rc2.14.c: "确立赫拉克勒斯之柱海峡关税霸权（远洋航程与重舰增益）"
 oe_rc2.15.t: "高卢战区：查理曼遗影与罗讷河谷"
 oe_rc2.15.d: "从马赛沿罗讷河北上直至里昂与巴黎，法兰克城堡之下依然纵横着古老的罗马驰道。围绕查理曼加冕正统的千年公案在此达到顶点：帝国既可公开清算西帝僭号以振皇威，亦可怀柔高卢贵族议会，或借里昂—马赛商道大兴财源。"
 oe_rc2.15.a: "清算查理曼西帝法统（士气威望大振，招致西欧戒备）"
 oe_rc2.15.b: "颁布高卢贵族与行省议会怀柔宪章（安抚贵族、稳固控制）"
 oe_rc2.15.c: "颁行里昂—马赛罗讷河谷商贸宪章（赋税与海陆贸易并兴）"
 oe_rc2.16.t: "不列颠战区"
 oe_rc2.16.d: "越过风高浪急的英吉利海峡，便是霍诺留时代罗马军团撤离近千年之久的不列颠行省。经略这座天涯海岛必须在三条方略中抉择：重金建设海峡重舰制海权、重建拱卫北疆的不列颠附庸王国，或垄断康沃尔锡矿与不列颠羊毛专卖。"
 oe_rc2.16.a: "颁布英吉利海峡制海权宪章（200金币，强化重舰与海军维护）"
 oe_rc2.16.b: "确立不列颠附庸王国与哈德良长城防线（附庸忠诚与城防）"
 oe_rc2.16.c: "设立康沃尔锡矿与不列颠羊毛专卖（财税与市民满意大增）"
 oe_rc2.17.t: "波斯战区：泰西封双雄之争"
 oe_rc2.17.d: "渡过幼发拉底河、遥望泰西封废墟，罗马与波斯这对千年宿敌再度狭路相逢。御前议事厅分歧激烈：或效法塞琉古与希拉克略直抵扎格罗斯大疆界，或以幼发拉底河为界缔结双雄共治协约，抑或将两河流域建成繁华的丝绸护商总署。"
 oe_rc2.17.a: "宣称塞琉古—罗马东方大疆界（军纪攻城与兵源强化）"
 oe_rc2.17.b: "缔结幼发拉底河分界与双雄共治协约（减厌战与分离主义）"
 oe_rc2.17.c: "设立丝绸商队与底格里斯护商总署（商贸与繁荣齐增）"
 oe_rc2.18.t: "阿拉伯战区：红海门户与荒漠商队"
 oe_rc2.18.d: "从亚丁香料良港到汉志朝觐古道，远征军团深入酷烈荒漠，后勤与盟约远比刀锋更能决定胜负。帝国可斥资打通亚丁—苏伊士香料走廊、复兴古老的加萨尼阿拉伯同盟军，或颁下圣城休战与朝觐护航敕令以化干戈为玉帛。"
 oe_rc2.18.a: "打通亚丁—苏伊士香料走廊（150金币，远洋香料贸易飞跃）"
 oe_rc2.18.b: "复兴加萨尼—阿拉伯沙漠同盟军（150金币，大降沙漠损耗）"
 oe_rc2.18.c: "颁布圣城休战与朝觐护航协定（大幅缓和伊斯兰世界敌意）"
 oe_rc2.19.t: "黑海战区"
 oe_rc2.19.d: "在钦察大草原与卡法、苏达克、塔纳诸港交汇之处，君士坦丁堡古老的北方屏障亟待重筑。帝国参谋提出三策：将克里米亚筑成扼控黑海的海军堡垒、编练草原边防轻骑建立缓冲带，或重兴克里米亚谷仓与黑海丝绸总埠。"
 oe_rc2.19.a: "筑造赫尔松—克里米亚海军堡垒（180金币，城防与制海）"
 oe_rc2.19.b: "建立黑海草原缓冲带与边防轻骑（机动减耗与兵源增长）"
 oe_rc2.19.c: "设立黑海丝路与克里米亚谷仓总埠（粮食与商税大丰收）"
 oe_rc2.20.t: "战后消化·第一阶段"
 oe_rc2.20.d: "战火虽已暂歇，但疆场凯旋不过是帝国长治久安的起点。残破城垣、观望的市民与尚未清丈的田土，仍需历经军事管制、军区建制直至行省整合的三段消化。在第一阶段军事管制期，陛下打算采取何种治策？"
 oe_rc2.20.a: "派驻军区总督并清丈军户（200金币，减轻摩擦、加快消化）"
 oe_rc2.20.b: "施行严苛军法管制与战时征发（得150金币，助长反抗）"
 oe_rc2.20.c: "怀柔地方市政并暂免赋税（150金币，安民消弭分离）"
 oe_rc2.21.t: "战后消化·第二阶段"
 oe_rc2.21.d: "历经数年军事管制与清丈安抚，新收复战区的动荡已被平息，帝国终于得以撤除临时军管、确立常设罗马行省制度。请为本战区总督区选定核心宪章偏向：民用税政总督府、军用屯田军区，抑或司法法典行省？"
 oe_rc2.21.a: "民用税政宪章：行省总督府（赋税、繁荣与控制并增）"
 oe_rc2.21.b: "军用军区宪章：边疆军户总督区（兵源、城防与军费优化）"
 oe_rc2.21.c: "司法法典宪章：巴西利卡法典行省（同化、皇权与稳定提升）"
 oe_rc2.22.t: "战后消化·第三阶段"
 oe_rc2.22.d: "税籍清核完毕，帝国驰道贯通城乡，各级法庭与市政官皆奉皇帝诏令行事。这片昔日烽火连天的远征战区，终于走完从军事管制到军区建制的漫长消化之路，正式跻身罗马帝国行省之列！"
 oe_rc2.22.a: "颁赐完整罗马市民权与元老席位（持久税入、控制与同化）"
 oe_rc2.22.b: "收归皇室直辖行省与帝国税籍整合（300金币，强化皇权财税）"
 oe_rc2.22.c: "确立多元行省自治与帝国商路枢纽（商贸兴旺、长治久安）"
