 oe_navy_dromon_1: "德龙猛战舰"
 oe_navy_dromon_1_desc: "德龙猛承载着帝国大舰队的威仪。宽阔而坚固的船体容纳重装水兵与密集火力；从希腊火喷管到成列重炮，击碎敌舰始终比追逐敌帆更为重要。这一代保留了桨帆与传统舰上武器的运用。\n\n#Y 时代升级路径：#!研发原版海军革新#Y 《早期克拉克帆船》#!后自动解锁下一代（完整链：早期克拉克帆船 → 克拉克帆船 → 盖伦帆船 → 双层甲板船 → 三层甲板船），完成后可直接在舰队界面点击升级。"
