 oe_navy_karabisian_1: "卡拉比西安桨帆舰"
 oe_navy_karabisian_1_desc: "卡拉比西安继承了帝国早期常备舰队的名字。桨手整齐划一的节奏、熟知海峡的舵手与近距离倾泻的火力，使这些战舰成为群岛和狭海之间最可靠的屏障。这一代保留了桨帆与传统舰上武器的运用。"
