 oe_navy_ousiakos_1: "乌西亚科斯轻型帆舰"
 oe_navy_ousiakos_1_desc: "乌西亚科斯将帝国标准战舰的旧称带入新的时代。它们扬帆巡弋于商路与海峡之间，追逐海盗、护卫船队，并以迅捷的航速和足够有力的火炮守住皇帝的海疆。这一代保留了桨帆与传统舰上武器的运用。\n\n#Y 时代升级路径：#!研发原版海军革新#Y 《三桅帆船》#!后自动解锁下一代（完整链：三桅帆船 → 卡拉维尔帆船 → 轻型帆船 → 护卫舰 → 重型护卫舰），完成后可直接在舰队界面点击升级。"
