 oe_navy_chelandion_1: "哈兰迪亚战舰"
 oe_navy_chelandion_1_desc: "由德龙猛传统发展而来的哈兰迪亚，肩负着运送帝国军队的重任。宽大的舱室容纳士兵与粮秣，加固船体和自卫武器则使它在护航舰未及赶来时仍有一战之力。这一代保留了桨帆与传统舰上武器的运用。"
