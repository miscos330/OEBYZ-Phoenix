l_simp_chinese:
 oe_navy_dromon_1: "德龙猛战舰"
 oe_navy_dromon_1_desc: "德龙猛承载着帝国大舰队的威仪。宽阔而坚固的船体容纳重装水兵与密集火力；从希腊火喷管到成列重炮，击碎敌舰始终比追逐敌帆更为重要。这一代保留了桨帆与传统舰上武器的运用。"
