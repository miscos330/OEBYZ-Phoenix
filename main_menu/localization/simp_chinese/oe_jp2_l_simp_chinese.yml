 oe_jp2_dec_unite_chrysanthemum_sword.title: "菊与刀之大一统"
 oe_jp2_dec_unite_chrysanthemum_sword.desc: "坐拥京都、江户或大阪并统辖四十座以上领地后，正式宣告公武合一与列岛大一统法度。花费 200 金币。"
 oe_jp2_dec_unite_chrysanthemum_sword.a: "诏告海内一统"
 oe_jp2_dec_open_rangaku_academy.title: "开设官立兰学塾"
 oe_jp2_dec_open_rangaku_academy.desc: "设立官办兰学翻译学府，系统译介西洋天文、航海、解剖医学与火器典籍。需拥有港口且年份不早于 1640 年；花费 150 金币。"
 oe_jp2_dec_open_rangaku_academy.a: "敕建兰学塾"
 oe_jp2_dec_modernize_coastal_defenses.title: "近代海防炮台与反射炉"
 oe_jp2_dec_modernize_coastal_defenses.desc: "在海湾咽喉构筑近代台场炮台并以反射炉铸造大口径铁炮，从容应对远洋铁舰叩关之变。需拥有港口且年份不早于 1780 年；花费 250 金币。"
 oe_jp2_dec_modernize_coastal_defenses.a: "构筑海防台场"
 STATIC_MODIFIER_NAME_oe_jp2_mod_sankin_kotai: "参勤交代制度"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sankin_kotai: "诸藩大名须隔年率队赴幕府都城参勤并留眷属为质，使财力与兵权牢牢受制于幕府。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_sword_hunt: "天下刀狩令"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sword_hunt: "民间收缴的刀枪与铁炮熔铸为大佛殿铁钉，一揆动乱由此锐减，常备武士军纪更趋严整。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_shuinsen_charter: "幕府朱印船特许"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shuinsen_charter: "持有幕府朱印状的武装商船载运白银与刀剑远航暹罗、吕宋与安南，满载生丝与香料归港。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_bakufu_banner_levy: "幕府旗本大军役"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bakufu_banner_levy: "直属旗本与谱代家臣按石高定额悉数集结于将军马印之下，队列森严而士气如虹。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_chrysanthemum_sword: "菊与刀之大一统"
 STATIC_MODIFIER_DESC_oe_jp2_mod_chrysanthemum_sword: "京都朝廷的菊纹正统与统御列藩的武家霸权合而为一，列岛山河尽归统一法度。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_rangaku_academy: "幕府兰学塾"
 STATIC_MODIFIER_DESC_oe_jp2_mod_rangaku_academy: "官立兰学塾广集译官与学者，系统译介泰西天文、炮术、理化与解剖新知。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_coastal_bastions: "近代海防台场体系"
 STATIC_MODIFIER_DESC_oe_jp2_mod_coastal_bastions: "海湾要冲遍筑台场炮台并配属铁铸重炮与新式巡防战舰，扼守通往江户与畿内的水道。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_court_mediation: "朝廷公武调停"
 STATIC_MODIFIER_DESC_oe_jp2_mod_court_mediation: "公卿敕使往返斡旋，借朝廷清望弥合武家裂痕，暂维公武秩序。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_shugo_marshal: "守护大名半济军权"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shugo_marshal: "幕府准许诸国守护行使半济之权，以庄园年贡招募国人武士奔赴南北战场。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_muromachi_protocol: "室町花之御所仪制"
 STATIC_MODIFIER_DESC_oe_jp2_mod_muromachi_protocol: "三管领与四职环卫室町花之御所，以繁复庄严的礼仪秩序统摄天下武家。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_meitoku_accord: "明德南北合一"
 STATIC_MODIFIER_DESC_oe_jp2_mod_meitoku_accord: "三种神器重归京都，长达五十六载的南北朝分立终告落幕，朝野人心复归安定。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_kitayama_culture: "北山金阁风雅"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kitayama_culture: "金阁映池、能乐幽玄，禅宗意境与公家风雅交融，令京都文化声震东亚。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_tokusei_relief: "德政令宽免农债"
 STATIC_MODIFIER_DESC_oe_jp2_mod_tokusei_relief: "颁行德政令免除乡民高利贷契，暂平畿内土一揆，却令土仓与酒屋银根骤紧。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_bakufu_crackdown: "护商镇压土一揆"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bakufu_crackdown: "幕府遣兵护卫京都土仓与座商、铁腕驱散一揆，保住商税财源却加深乡野怨气。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_sengoku_mobilization: "战国乱世总动员"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sengoku_mobilization: "应仁烽火焚尽旧日守护秩序，各地大名趁势整军经武，列岛迈入弱肉强食的战国时代。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_higashiyama_arts: "东山侘寂茶禅"
 STATIC_MODIFIER_DESC_oe_jp2_mod_higashiyama_arts: "银阁寂静，茶道、花道、水墨与枯山水臻于化境，成为乱世武家修心交际的共同语言。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_ashigaru_drill: "足轻长枪操典"
 STATIC_MODIFIER_DESC_oe_jp2_mod_ashigaru_drill: "统一配发长柄朱枪并施以严苛队列操练，使足轻步阵彻底压倒传统的骑马单挑。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_ikko_concordat: "寺内町和约"
 STATIC_MODIFIER_DESC_oe_jp2_mod_ikko_concordat: "承认净土真宗寺内町的自治特许，化狂热门徒为保境安民的坚盾。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_daimyo_suppression: "清剿一向宗武装"
 STATIC_MODIFIER_DESC_oe_jp2_mod_daimyo_suppression: "以重兵围剿武装寺院并拆毁寺内町濠垒，确立世俗大名对宗教势力的绝对统御。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_bunkokuho_code: "战国分国法典"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bunkokuho_code: "成文分国法明定家臣法度、治水役赋与撰钱标准，将零散领地整合为高效领国。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_kunitomo_gunsmiths: "国友与堺城铁炮锻坊"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kunitomo_gunsmiths: "国友与堺城匠师攻克螺旋卷锻枪管与尾栓螺钉工艺，令国产铁炮得以大批量列装。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_okehazama_audacity: "桶狭间奇袭之风"
 STATIC_MODIFIER_DESC_oe_jp2_mod_okehazama_audacity: "借暴雨山谷实施闪电奇袭的战例深入军心，将校皆崇尚决断迅速、以寡击众。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_rakuichi_rakuza: "乐市乐座自由商法"
 STATIC_MODIFIER_DESC_oe_jp2_mod_rakuichi_rakuza: "废除关卡津料与旧座垄断，吸引四方行商与工匠云集城下町，商贸财税日盛。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_nagashino_volley: "长筱三段击火器战法"
 STATIC_MODIFIER_DESC_oe_jp2_mod_nagashino_volley: "拒马栅后铁炮足轻分列三排轮番装填齐射，绵密火网足以粉碎最精锐的重骑冲锋。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_azuchi_atakebune: "安土天守与铁甲安宅船"
 STATIC_MODIFIER_DESC_oe_jp2_mod_azuchi_atakebune: "高耸入云的石垣天守阁与覆铁抗火的大安宅船并峙水陆，铸就压倒性军备优势。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_osaka_citadel: "大阪巨城与天下粮仓"
 STATIC_MODIFIER_DESC_oe_jp2_mod_osaka_citadel: "雄踞淀川入海口的巨石大城既是畿内铁壁，更汇聚全国米谷与金银转运枢纽。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_taiko_kenchi: "太阁检地石高账簿"
 STATIC_MODIFIER_DESC_oe_jp2_mod_taiko_kenchi: "统一丈量尺规并逐村核定石高田籍，革除旧庄园重重叠叠的苛杂领属，赋税清朗。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_heino_bunri: "兵农分离常备制"
 STATIC_MODIFIER_DESC_oe_jp2_mod_heino_bunri: "农夫专务耕织、武士移居城下食禄，军队彻底摆脱农忙羁绊，常年堪战。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_sekigahara_hegemony: "关原霸业定鼎"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sekigahara_hegemony: "美浓关原一战定鼎乾坤，大封谱代、改易外样，列藩莫不俯首奉令。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_bakuhan_order: "幕藩体制与士农工商"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bakuhan_order: "《武家诸法度》与士农工商定分制度并行不悖，开启延续百余年的泰平盛世。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_shimabara_pacification: "寺请宗门账与海防严禁"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shimabara_pacification: "推行严密的寺请宗门人别账并强化九州海港盘查，杜绝境外秘密结社。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_shimabara_clemency: "九州轻赋绥靖"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shimabara_clemency: "罢黜酷吏、宽减荒年田赋并留开商路，既抚慰九州民心亦保通商之利。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_dejima_rangaku: "出岛商馆与兰学窗口"
 STATIC_MODIFIER_DESC_oe_jp2_mod_dejima_rangaku: "长崎出岛每年递交《阿兰陀风说书》，带来泰西历算、光学仪器与海外时局密报。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_genroku_renaissance: "元禄町人浮世绘"
 STATIC_MODIFIER_DESC_oe_jp2_mod_genroku_renaissance: "浮世绘、歌舞伎、人形净琉璃与俳谐风靡江户、京都与大阪，町人文化臻于极盛。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_kyoho_fiscal: "享保新田开发与堂岛米市"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kyoho_fiscal: "奖励新田开发、编纂《公事方御定书》并整顿大阪堂岛米会所，重振幕府财政。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_kaitai_shinsho: "《解体新书》实证学风"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kaitai_shinsho: "亲验实测取代空谈古注，实证解剖、星象观测与格致之学在列岛士林蔚然成风。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_reverberatory_foundry: "反射炉近代铸炮局"
 STATIC_MODIFIER_DESC_oe_jp2_mod_reverberatory_foundry: "列藩仿泰西图谱建成耐火砖反射炉，成功熔铸大口径近代铁炮，开启近代冶金先声。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_blackships_opening: "开国通商与师夷长技"
 STATIC_MODIFIER_DESC_oe_jp2_mod_blackships_opening: "正视蒸汽铁舰之威，务实开港通商并遣使游学泰西，加速吸纳近代军工与航运技术。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_sonno_joi_defiance: "尊王攘夷海防死守"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sonno_joi_defiance: "志士高举尊王大义、厉兵秣马严守海疆，誓不屈服于坚船利炮之威慑。"
 STATIC_MODIFIER_NAME_oe_jp2_mod_meiji_dawn: "维新大纲：富国强兵"
 STATIC_MODIFIER_DESC_oe_jp2_mod_meiji_dawn: "破除旧藩壁垒，兴办新式陆海军、近代船厂与国民学制，日本正迈向富国强兵的新纪元。"
 oe_jp2.1.title: "两统迭立：南北朝正统之争"
 oe_jp2.1.desc: "吉野深山与京都御所两座朝廷并立颁诏，各地守护趁机以半济之权扩充私领。乱世将启，我等究竟应奉敕调停公武裂痕，还是放手授予诸国守护征伐军权？"
 oe_jp2.1.a: "遣公卿敕使调停南北公武裂痕"
 oe_jp2.1.b: "颁行半济令，授予诸国守护征伐军权"
 oe_jp2.2.title: "室町花之御所落成"
 oe_jp2.2.desc: "京都北廓室町通畔落成华美绝伦的「花之御所」，樱柳环池、殿宇巍峨。幕府借此确立三管领与四职轮值之制，将桀骜难驯的诸国守护纳入室町礼仪秩序。"
 oe_jp2.2.a: "定立三管领四职仪制，以礼统御诸藩"
 oe_jp2.2.b: "节俭御所开销，将资财充作诸国驻军"
 oe_jp2.3.title: "明德和约：南北朝合一"
 oe_jp2.3.desc: "历经半个多世纪的兵燹与正统之辩，京都与吉野使节终在明德年间达成和议。三种神器奉迎回京，南北两朝合流归一，久盼和平的公卿与庶民无不额手称庆。"
 oe_jp2.3.a: "举行大典奉迎神器，诏告天下南北合一"
 oe_jp2.3.b: "趁旧部解甲之际乘势收拢诸国兵权"
 oe_jp2.4.title: "金阁耀世：北山文化兴盛"
 oe_jp2.4.desc: "北山镜湖池畔金阁熠熠生辉，五山禅僧、渡海画师与世阿弥等能乐宗师云集幕下。公家典雅与武家禅意水乳交融，开创璀璨夺目的北山文化盛世。"
 oe_jp2.4.a: "倾力赞助金阁、能乐与五山禅林"
 oe_jp2.4.b: "将唐船贸易厚利转投沿海水师船坞"
 oe_jp2.5.title: "嘉吉之变与德政土一揆"
 oe_jp2.5.desc: "一场血溅宴席的弑逆震动天下，未及旬日，数万背负重债的畿内乡民与马借揭竿围攻京都土仓与酒屋，高呼颁布「德政令」以毁弃债契。"
 oe_jp2.5.a: "颁布德政令免除乡债，安抚畿内农众"
 oe_jp2.5.b: "派兵护卫土仓商馆，铁腕弹压土一揆"
 oe_jp2.6.title: "应仁之乱：京都化为焦土"
 oe_jp2.6.desc: "将军与管领家督之争终酿滔天兵祸，东西两军在京都街巷厮杀十一年，公卿邸宅与千年古刹尽付祝融。硝烟散尽之时，幕府威令扫地，波澜壮阔的战国乱世就此揭幕。"
 oe_jp2.6.a: "顺应乱世铁律，倾全领之力整军备战"
 oe_jp2.6.b: "抢救京都典籍图册，优先重建畿内坊市"
 oe_jp2.7.title: "银阁寂静：东山文化与侘寂之道"
 oe_jp2.7.desc: "虽值四海鼎沸，东山银阁之畔却孕育出幽玄寂寥的审美新境。草庵茶道、水墨山水、立花与枯山水广为流传，成为大名与豪商在烽火间隙以艺会友的精神纽带。"
 oe_jp2.7.a: "延请茶道宗师与画匠，兴盛东山风雅"
 oe_jp2.7.b: "借茶室密会笼络诸侯与堺城豪商"
 oe_jp2.8.title: "足轻革命：长枪方阵主宰战场"
 oe_jp2.8.desc: "昔日被视作杂役的足轻，如今身披具足、手持三间长柄朱枪结成森严方阵。当整齐划一的枪林如浪推进，孤勇的骑马武士单挑之风已然成为过眼云烟。"
 oe_jp2.8.a: "统一三间长枪制式，编练常备足轻步阵"
 oe_jp2.8.b: "仍重武士精锐本阵，仅以足轻辅佐两翼"
 oe_jp2.9.title: "加贺一向一揆：百姓持国"
 oe_jp2.9.desc: "高举「进者往生极乐，退者无间地狱」的六字名号旗帜，加贺净土真宗门徒击溃守护大名、建立「百姓持国」的自治政权，各地寺内町一时声势震天。"
 oe_jp2.9.a: "与门徒议和并承认寺内町自治特许"
 oe_jp2.9.b: "兴兵讨伐武装寺院，确立大名世俗法统"
 oe_jp2.10.title: "战国分国法：富国强兵之基"
 oe_jp2.10.desc: "从甲斐、骏河到越后，一代枭雄纷纷颁布成文「分国法」：禁止家臣私斗、规范撰钱令、兴修堤防并厘定检地赋税，将破碎庄园锻造为紧密高效的战国领国。"
 oe_jp2.10.a: "颁行成文分国法，整饬家臣与领国税政"
 oe_jp2.10.b: "宽容国人旧制，换取战时速发援兵"
 oe_jp2.11.title: "种子岛铁炮与国友堺城锻坊"
 oe_jp2.11.desc: "南蛮商船携火绳枪漂抵种子岛后，国友与堺城的锻冶名匠迅速破译尾栓螺钉与螺旋卷锻绝技。不数年间，近畿铁炮作坊炉火昼夜不息，产量冠绝当世。"
 oe_jp2.11.a: "重金包揽国友与堺城铁炮锻坊，大规模列装"
 oe_jp2.11.b: "向铁炮商课税，专事储备硝石与铅弹"
 oe_jp2.12.title: "桶狭间雷雨奇袭"
 oe_jp2.12.desc: "东海大军挟数倍之众西上进京，阵营绵延山谷。忽逢盛夏暴雨倾盆，奇兵借雷雨掩护沿密林急袭本阵，一战斩将夺旗，震骇天下诸侯。"
 oe_jp2.12.a: "将奇袭决断之策写入军法，提拔胆略新将"
 oe_jp2.12.b: "引以为戒，严密侦候并修筑要隘城寨"
 oe_jp2.13.title: "乐市乐座：破除关津垄断"
 oe_jp2.13.desc: "数百年来，公家与寺社把持的「座」与林立关卡严重窒息商旅。如今在城下町颁行「乐市乐座」，废除关钱与垄断特权，四方商贾工匠闻风而至，市井骤然繁华。"
 oe_jp2.13.a: "废除关津垄断，全面推行乐市乐座"
 oe_jp2.13.b: "保留旧座特许并向豪商高价征收运上金"
 oe_jp2.14.title: "长筱合战与铁炮三段击"
 oe_jp2.14.desc: "连绵三重马防栅之后，三千铁炮足轻依溪流地形列阵待敌。当威震关东的赤备精骑冒雨冲阵，轮番装填的连绵齐射响彻山谷，宣告火器时代正式降临日本。"
 oe_jp2.14.a: "确立铁炮轮射与马防栅阵地战法"
 oe_jp2.14.b: "以轻快铁炮游击配合精锐重甲突击"
 oe_jp2.15.title: "安土天守阁与铁甲安宅船"
 oe_jp2.15.desc: "琵琶湖畔巍然矗立七层金碧辉煌的安土天守阁，大阪湾上覆以铁板、搭载大筒的巨型安宅船破浪出击，水陆双重重器令诸侯望风归附。"
 oe_jp2.15.a: "营建巨石天守阁并敕造铁甲安宅战船"
 oe_jp2.15.b: "专注打造轻捷关船舰队，控制濑户内海航道"
 oe_jp2.16.title: "大阪巨城与黄金茶室"
 oe_jp2.16.desc: "石山本愿寺旧址之上，数万石工自濑户内海运来巨石筑起气吞山河的大阪城。金碧耀目的天守之中，天下人设黄金茶室宴请列藩诸侯，尽显海内一统气象。"
 oe_jp2.16.a: "以大阪巨城威震畿内，广聚全国米银转运"
 oe_jp2.16.b: "散财赏赐功臣诸侯，以恩信稳固天下联盟"
 oe_jp2.17.title: "太阁检地：确立全国石高制"
 oe_jp2.17.desc: "检地奉行携统一尺竿与京枡丈量全国每一块水田，逐村登记耕农与石高产额。延续数百年、层层盘剥的中世庄园旧弊由此一扫而空，国家财税根基豁然清朗。"
 oe_jp2.17.a: "铁腕推行全国统一尺规的太阁检地"
 oe_jp2.17.b: "准许外样大名自行呈报石高账册以安人心"
 oe_jp2.18.title: "刀狩令与兵农分离"
 oe_jp2.18.desc: "敕令严禁百姓私藏刀枪与铁炮，收缴兵器悉数融铸；同时令武士脱离田庄、移居城下食禄。兵农分离既成定局，乡村烽烟渐息，常备军政格局焕然一新。"
 oe_jp2.18.a: "彻底推行兵农分离，锻造城下常备武士团"
 oe_jp2.18.b: "在边远海疆保留乡士民兵以防外患"
 oe_jp2.19.title: "关原雾散：天下分け目"
 oe_jp2.19.desc: "深秋浓雾笼罩美浓关原隘口，十五万东西大军旌旗蔽日。枪炮齐鸣与山头观望之间，暗通款曲的诸侯临阵倒戈，一昼夜激战便决出了此后二百六十年的天下归属。"
 oe_jp2.19.a: "大行转封改易，以关原之威定鼎天下霸权"
 oe_jp2.19.b: "宽宥归降西军诸侯，早息干戈休养生息"
 oe_jp2.20.title: "江户开府、幕藩体制与士农工商"
 oe_jp2.20.desc: "江户幕府颁行《武家诸法度》与一国一城令，以亲藩、谱代与外样大名犬牙交错拱卫江户与畿内，并确立士农工商四民秩序，开启「幕藩体制」的长治久安。"
 oe_jp2.20.a: "颁布《武家诸法度》，确立幕藩与四民秩序"
 oe_jp2.20.b: "赐予江户与大阪町人特许商权，激发海内经济"
 oe_jp2.21.title: "岛原天草之乱"
 oe_jp2.21.desc: "苛政重税与严酷禁教逼得岛原与天草数万农众与浪人聚义原城遗址。原城死守数月方才平息，此变剧烈震动江户中枢，迫使幕府重新审视九州政令与海禁尺度。"
 oe_jp2.21.a: "厉行寺请宗门改与海防锁国，根绝境外渗透"
 oe_jp2.21.b: "严惩贪酷藩吏、宽减九州赋税并保留通商口岸"
 oe_jp2.22.title: "出岛明灯：兰学启蒙之窗"
 oe_jp2.22.desc: "纵然海禁森严，长崎港内的扇形人工岛出岛依然灯火长明。荷兰商船不仅运来生丝、玻璃镜片与自鸣钟，更逐年呈递海外风说书与西洋医算典籍，由长崎通词悄然译介全国。"
 oe_jp2.22.a: "敕许长崎通词研习泰西典籍，培育兰学萌芽"
 oe_jp2.22.b: "严限出岛只理生丝铜银贸易，严禁异学流传"
 oe_jp2.23.title: "元禄浮世绘、歌舞伎与町人盛世"
 oe_jp2.23.desc: "百年承平令江户跃居天下巨邑之列。大阪米商与江户町人挥金如土，歌舞伎戏园座无虚席，多色浮世绘版画与俳谐诗集风行市井，缔造绚丽奔放的元禄文化高峰。"
 oe_jp2.23.a: "放宽町人刊印与艺能之风，纵情元禄风华"
 oe_jp2.23.b: "颁行俭约令抑制奢靡，维系武士米禄价值"
 oe_jp2.24.title: "享保改革与大阪堂岛米会所"
 oe_jp2.24.desc: "米价剧烈起伏与财政赤字困扰幕府。改革派主张奖励新田开发、正式敕许大阪堂岛米会所规范期货交易，并解除除宗教外的泰西科技译书禁令。"
 oe_jp2.24.a: "推行享保财政革新，敕许堂岛米市并解禁西书"
 oe_jp2.24.b: "向诸藩征收上米之役，速补幕府国库亏空"
 oe_jp2.25.title: "《解体新书》与实证格致之潮"
 oe_jp2.25.desc: "江户兰医群贤历时数载对照荷兰解剖图谱与实证观察，终将《解体新书》付梓刊行。其精确绝伦震动医林，点燃列岛研习泰西医学、天文与测绘的熊熊热潮。"
 oe_jp2.25.a: "官助医学译书与全国海疆实测绘图"
 oe_jp2.25.b: "将译书归入官府秘藏，仍以汉学正统为主"
 oe_jp2.26.title: "天保困局与反射炉海防铸炮"
 oe_jp2.26.desc: "荒年米骚动与频频现身长崎、虾夷海面的西洋军舰令幕藩体制岌岌可危。佐贺、萨摩等雄藩率先依荷兰冶金典籍试建反射炉，力图自铸近代大口径海防铁炮。"
 oe_jp2.26.a: "广建反射炉铸造近代重炮，革新列岛海防"
 oe_jp2.26.b: "厉行天保俭约并解散株仲间以抑物价"
 oe_jp2.27.title: "黑船压境：浦贺海面风云"
 oe_jp2.27.desc: "滚滚煤烟染黑江户湾口天际，漆黑船体的西洋蒸汽铁舰驶抵浦贺海面，长射程开花炮直指海防台场，外使递交国书强索开港通商与煤炭补给之权，举国震动。"
 oe_jp2.27.a: "审时度势策略开国，广派留学生师夷长技"
 oe_jp2.27.b: "高举尊王攘夷大旗，死守海峡寸步不让"
 oe_jp2.28.title: "维新黎明：富国强兵与开国图强"
 oe_jp2.28.desc: "京都朝堂、江户幕臣与西南雄藩的志士群起激荡，终凝成「富国强兵、广求知识于世界」的维新洪流。破除藩阀旧壳、兴办近代军工与国民新学，东瀛列岛正迎来破晓新纪元。"
 oe_jp2.28.a: "颁行维新大纲，全面迈向富国强兵近代化"
 oe_jp2.28.b: "推行公武合体与列藩会议，稳健渐进图强"
