 oe_jp2_act_bakufu_banner_levy: "召集幕府旗本军役"
 oe_jp2_act_bakufu_banner_levy_desc: "按石高军役定额征召直属旗本与诸藩劲旅齐聚马印之下，提升陆军传统、全国人力与重步兵战力。"
 PERFORM_oe_jp2_act_bakufu_banner_levy_ACTION_SETUP: "当施行「召集幕府旗本军役」幕府行动时。"
