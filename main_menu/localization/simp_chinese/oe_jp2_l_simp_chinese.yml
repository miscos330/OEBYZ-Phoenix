# NEW 2026-11-22 v15.5 Module 15.5-A: Japan Sengoku & Shogunate Deep Overhaul (oe_jp2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v155_japan.py; edit the generator, not this file.
 oe_jp2_ashigaru_spearmen: "足轻长枪队"
 oe_jp2_ashigaru_spearmen_desc: "战国乱世锤炼出的纪律严明之足轻步兵，手持长柄朱枪结阵推进，是日本战国阵线的核心基石。"
 oe_jp2_teppo_ashigaru: "铁炮足轻队"
 oe_jp2_teppo_ashigaru_desc: "列装堺城与国友精锻种子岛火绳枪的齐射步兵，善借马防栅施展三段连射，足以击溃最精锐的重骑冲锋。"
 oe_jp2_hatamoto_samurai: "旗本近卫武士"
 oe_jp2_hatamoto_samurai_desc: "直属于大名与将军马印之下的谱代精锐武士，披挂坚固当世具足，百战死守不退半步。"
 oe_jp2_atakebune: "安宅船重型战舰"
 oe_jp2_atakebune_desc: "覆铁抗火、舱楼巍峨的日本巨型橹桨战舰，舷侧密布铁炮矢眼与大筒火炮，犹如驰骋近海的海上巨城。"
 oe_jp2_tenshu_jokamachi: "天守阁城下町"
 oe_jp2_tenshu_jokamachi_desc: "以高耸石垣天守为核心、环绕武家屋敷与町人坊市的日本城下町。仅可建于京都、江户、大阪、安土、名古屋等历史名城，大幅增强城防、控制度与守备实力。"
 oe_jp2_tenshu_jokamachi_maint: "天守阁城下町维护"
 oe_jp2_sakai_egoshu_hall: "堺会合众自由商馆"
 oe_jp2_sakai_egoshu_hall_desc: "仿效堺城三十六会合众自治议事传统设立的自由商馆。仅可建于堺、大阪、博多、长崎、江户等日本重要商港，显著拓展商队运力、贸易枢纽权重与水手储备。"
 oe_jp2_sakai_egoshu_hall_maint: "会合众商馆维护"
 oe_jp2_act_enforce_sankin_kotai: "颁行参勤交代令"
 oe_jp2_act_enforce_sankin_kotai_desc: "命幕府诸大名隔年率队赴都参勤并留质眷属，以国库资费与武家满意度为代价，显著提升全国控制度、王权与附庸忠诚。"
 PERFORM_oe_jp2_act_enforce_sankin_kotai_ACTION_SETUP: "当施行「颁行参勤交代令」幕府行动时。"
