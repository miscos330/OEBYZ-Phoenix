 oe_jp2_act_charter_shuinsen: "敕发朱印船状"
 oe_jp2_act_charter_shuinsen_desc: "向获准远航南洋的武装商船颁发幕府朱印状，提升海军传统、海外贸易距离与海上贸易效率。"
 PERFORM_oe_jp2_act_charter_shuinsen_ACTION_SETUP: "当施行「敕发朱印船状」幕府行动时。"
