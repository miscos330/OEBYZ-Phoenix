 oe_jp2_act_sword_hunt_edict_desc: "收缴乡野农众与一揆私藏刀枪铁炮，提升国家稳定、军队训练度与全国控制度，削弱农民阶层武装势力。"
 PERFORM_oe_jp2_act_sword_hunt_edict_ACTION_SETUP: "当施行「颁布天下刀狩令」幕府行动时。"
