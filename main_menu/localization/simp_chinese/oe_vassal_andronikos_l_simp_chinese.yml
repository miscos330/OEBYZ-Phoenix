l_simp_chinese:
 OE_VAS_STAGE_1: "帝国向苏丹称臣纳贡。苏丹会不时要求随军出征、送皇子为质。"
 OE_VAS_STAGE_2: "篡位之战：大势#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_tide').GetValue|0]#! / #Y 100#!（升到#Y 100#!皇帝获胜，降到#Y 0#!或叛军占住君士坦丁堡满#Y 2#!个月，篡位者即位）；已打了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_wm').GetValue|0]#!个月，打满#Y 24#!个月双方城下议和。大势每月随君士坦丁堡、塞林布里亚、乔尔卢、梅特赖、比齐耶的控制权变化；苏丹的援兵每月#R −1.5#!，威尼斯的船每月#G +1#!。"
 OE_VAS_STAGE_3: "篡位者在位，老皇帝被关在阿内马斯塔楼。苏丹仍是帝国的宗主。"
 OE_VAS_STAGE_4: "老皇帝已经复位，篡位者退守加拉塔，继承问题悬而未决。"
 oe_vas_vassalage: "臣属苏丹"
 oe_vas_vassalage_desc: "#F 马里查河之后，约翰五世承认了奥斯曼苏丹的宗主权。此后几十年，帝国一边纳贡随军，一边在苏丹和自家的皇子之间求生。#!\n\n[GetCountry('BYZ').Custom('OeVasStage')]\n苏丹的耐心：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_patience').GetValue|0]#! / #Y 100#!（降到#Y 0#!苏丹就会翻脸；推辞随军、拒送人质、拖欠贡金都会让它下降，按时纳贡每年回升#Y 5#!）\n每年贡金：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_tribute').GetValue|0]#!金币，每年一月支付；协议到期自动续约。“岁币与停战”卡片上的“停付岁币”可以停付，但会触怒苏丹。\n奥斯曼的兵力连续#Y 12#!个月不到我们的#Y 1.5#!倍，就可以考虑挣脱枷锁。"
 STATIC_MODIFIER_NAME_oe_vas_vassal: "臣属苏丹"
 STATIC_MODIFIER_NAME_oe_vas_tenedos_ven: "特内多斯之债"
 STATIC_MODIFIER_NAME_oe_vas_tenedos_dispute: "特内多斯之争"
 STATIC_MODIFIER_NAME_oe_vas_turk_aid: "苏丹的援兵"
 STATIC_MODIFIER_NAME_oe_vas_selymbria: "塞林布里亚封邑"
 STATIC_MODIFIER_NAME_oe_vas_one_eye: "独眼"
 STATIC_MODIFIER_NAME_oe_vas_hostage: "苏丹宫中的人质"
 oe_vas_refused_op: "拒绝称臣"
 oe_vas_stall_op: "拖延称臣"
 oe_vas_defied_op: "拒不交出王子"
 oe_vas_tenedos_ven_glad: "得到特内多斯"
 oe_vas_tenedos_spurned: "特内多斯之请被拒"
 oe_vas_tenedos_gen_angry: "特内多斯给了威尼斯"
 oe_vas_tenedos_gen_glad: "许以特内多斯"
 oe_vas_tenedos_ven_angry: "特内多斯许给了热那亚"
 oe_vas_galata_betrayed: "皇帝食言"
 oe_vas_venice_help: "助老皇帝复位"
 oe_vas_galata_siege: "加拉塔被围"
 OE_VAS_REBELS: "篡位者一党"
 OE_VAS_REBELS_country: "篡位者一党"
 OE_VAS_REBELS_country_adjective: "篡位者一党"
 oe_vas.1.t: "苏丹的条件"
 oe_vas.1.desc: "#F 马里查河一战之后，塞尔维亚诸侯不是战死就是称臣，帝国在色雷斯再也找不到援手。约翰五世最终承认了穆拉德一世的宗主权：纳贡，随军出征，送一位皇子到苏丹宫中。#!\n\n如今[SCOPE.sCharacter('oe_vas_su').GetName]的使者也来到了君士坦丁堡，开出的条件和当年一样：每年纳贡，皇帝随军出征，再送一位皇子去苏丹的宫廷。答应了，京城和剩下的几座城还能保住；拒绝了，色雷斯的突厥骑兵随时可以兵临城下。"
 oe_vas.1.a: "接受臣属"
 oe_vas.1.a.tt: "每年一月向奥斯曼纳贡#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!金币（我们#Y 3#!个月的总收入），第一年当即付清；双方停战#Y 5#!年；已在向奥斯曼纳币的，沿用原协议\n签约的代价：威望#R −15#!，[oe_tu_authority|e] #R −5#!，[oe_tu_senate|e]会为这笔岁币议论纷纷\n获得 [ShowModifier('oe_vas_vassal')]，直到臣属结束\n局势“臣属苏丹”开始：苏丹会要求随军出征、送皇子为质；苏丹的耐心降到#Y 0#!就会翻脸"
 oe_vas.1.b: "拒绝"
 oe_vas.1.b.tt: "奥斯曼对我们的好感#R −50#!（#Y 5#!年）\n苏丹#Y 3#!年后还会再提；拒绝#Y 3#!次就不再提"
 oe_vas.1.c: "以西方的援助为辞拖延"
 oe_vas.1.c.tt: "奥斯曼对我们的好感#R −20#!（#Y 2#!年）\n苏丹#Y 2#!年后再来"
 oe_vas.2.t: "随军出征"
 oe_vas.2.desc: "#F 1373年，约翰五世按约定带兵随穆拉德出征小亚细亚。罗马皇帝替苏丹打仗，在当时人看来比纳贡更屈辱。#!\n\n今年[SCOPE.sCharacter('oe_vas_su').GetName]要征讨小亚细亚的突厥诸侯，按约定，罗马皇帝要带兵随行。宫里吵成一片：有人说皇帝亲自去才显得恭顺，有人说派一支军区兵就够了，也有人劝干脆出钱了事。"
 oe_vas.2.desc_alt: "#F 安德洛尼卡四世靠苏丹的兵马夺下皇位，即位后把加里波利交还穆拉德，照旧向苏丹纳贡称臣。#!\n\n今年[SCOPE.sCharacter('oe_vas_su').GetName]又要出征，派人来提醒[SCOPE.sCharacter('oe_vas_h').GetName]：当初是谁帮着打开了城门。宫里都明白，新皇帝的皇位是苏丹给的，推辞的代价不小；可皇位还没坐稳，一旦离开京城，又怕老皇帝的人趁机生事。"
 oe_vas.2.a: "皇帝亲自随军"
 oe_vas.2.a.tt: "苏丹的耐心#G +15#!"
 oe_vas.2.b: "派一支军区兵马"
 oe_vas.2.b.tt: "一个陆军[oe_tu_course|e]的军区出兵，忠诚#R −5#!（计入忠诚目标#Y 5#!年）\n苏丹的耐心#G +10#!"
 oe_vas.2.c: "出钱免役"
 oe_vas.2.c.tt: "花费我们#Y 1#!个月的总收入\n苏丹的耐心#G +5#!"
 oe_vas.2.d: "推辞"
 oe_vas.2.d.tt: "苏丹的耐心#R −25#!"
 oe_vas.3.t: "皇子为质"
 oe_vas.3.desc: "#F 约翰五世的次子曼努埃尔曾在奥斯曼宫中为质，后来又不得不随苏丹出征。#!\n\n[SCOPE.sCharacter('oe_vas_su').GetName]要一位皇子去宫中“学习礼仪”。谁都明白，这是人质。苏丹点名要的是皇帝的次子[SCOPE.sCharacter('oe_vas_s').GetName]。"
 oe_vas.3.a: "送[SCOPE.sCharacter('oe_vas_s').GetName]去"
 oe_vas.3.a.tt: "[SCOPE.sCharacter('oe_vas_s').GetName]获得#bold #color_yellow 苏丹宫中的人质#!#!，持续#Y 5#!年，不能进入内阁\n苏丹的耐心#G +20#!"
 oe_vas.3.b: "改送长孙[SCOPE.sCharacter('oe_vas_g').GetName]"
 oe_vas.3.b.tt: "[SCOPE.sCharacter('oe_vas_g').GetName]去苏丹宫中为质#Y 5#!年\n[SCOPE.sCharacter('oe_vas_h').GetName]心怀怨恨\n苏丹的耐心#G +10#!"
 oe_vas.3.c: "拒绝"
 oe_vas.3.c.tt: "苏丹的耐心#R −20#!"
 oe_vas.4.t: "两位王子的同谋"
 oe_vas.4.desc: "#F 1373年5月，安德洛尼卡和穆拉德的儿子萨乌吉在色雷斯会合，一同起兵，要推翻各自的父亲。#!\n\n密探送来消息：[SCOPE.sCharacter('oe_vas_h').GetName]和[SCOPE.sCharacter('oe_vas_su').GetName]的儿子[SCOPE.sCharacter('oe_vas_t').GetName]在色雷斯碰了头。两个等不及继位的年轻人约好一起起兵，一个要推翻罗马皇帝，一个要推翻苏丹。"
 oe_vas.4.a: "先发制人，拘押[SCOPE.sCharacter('oe_vas_h').GetName]"
 oe_vas.4.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]被关押#Y 5#!年，关押期间不能做继承人\n[SCOPE.sCharacter('oe_vas_h').GetName]心怀怨恨\n苏丹的耐心#G +5#!"
 oe_vas.4.b: "静观其变"
 oe_vas.4.b.tt: "一个月后见分晓"
 oe_vas.4.c: "向苏丹告发"
 oe_vas.4.c.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]心怀怨恨；一个月后见分晓\n苏丹的耐心#G +10#!"
 oe_vas.5.t: "苏丹的要求"
 oe_vas.5.desc: "#F 起事很快失败了。穆拉德刺瞎了萨乌吉，随后把萨乌吉处死，并要约翰五世同样处置安德洛尼卡。约翰五世只刺瞎了儿子一只眼睛。#!\n\n起事失败了。[SCOPE.sCharacter('oe_vas_su').GetName]刺瞎了[SCOPE.sCharacter('oe_vas_t').GetName]，随后把[SCOPE.sCharacter('oe_vas_t').GetName]处死，接着派人来到君士坦丁堡：皇帝也必须这样处置[SCOPE.sCharacter('oe_vas_h').GetName]，否则两国的约定就此作废。"
 oe_vas.5.a: "刺瞎双眼"
 oe_vas.5.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]双目失明，#R 失去继承资格#!，并被关押#Y 5#!年\n[SCOPE.sCharacter('oe_vas_h').GetName]的长子若在世，同样受刑\n苏丹的耐心#G +30#!"
 oe_vas.5.b: "只刺一只眼睛"
 oe_vas.5.b.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]获得#bold #color_yellow 独眼#!#!，保留继承资格，但被关押#Y 5#!年，心怀怨恨\n苏丹的耐心#G +15#!"
 oe_vas.5.c: "拒绝"
 oe_vas.5.c.tt: "奥斯曼对我们的好感#R −50#!（#Y 10#!年）\n苏丹的耐心#R −40#!"
 oe_vas.6.t: "次子为储"
 oe_vas.6.desc: "#F 安德洛尼卡被关进了阿内马斯塔楼，约翰五世改立次子曼努埃尔为继承人。#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName]被关进了阿内马斯塔楼。皇帝下诏，立[SCOPE.sCharacter('oe_vas_s').GetName]为继承人。"
 oe_vas.6.a: "立[SCOPE.sCharacter('oe_vas_s').GetName]为继承人"
 oe_vas.6.a.tt: "[SCOPE.sCharacter('oe_vas_s').GetName]成为继承人"
 oe_vas.7.t: "威尼斯要特内多斯"
 oe_vas.7.desc: "#F 约翰五世从罗马回国途中在威尼斯因欠债被扣，威尼斯人要以特内多斯岛抵债。#!\n\n威尼斯人拿着皇帝当年欠下的债据上门了：用#bold #color_yellow 特内多斯#!#!岛抵债，再加一笔现钱。这座岛扼守着达达尼尔海峡的入口。热那亚人放话，岛要是给了威尼斯，加拉塔就不会坐视。"
 oe_vas.7.a: "交岛抵债"
 oe_vas.7.a.tt: "获得 [ShowModifier('oe_vas_tenedos_ven')]，持续#Y 20#!年\n威尼斯对我们的好感#G +20#!，热那亚#R −30#!\n皇冠珠宝若还押在威尼斯，就一并赎回（#G 威望上升#!）"
 oe_vas.7.b: "拒绝"
 oe_vas.7.b.tt: "威尼斯对我们的好感#R −20#!"
 oe_vas.8.t: "加拉塔的帮手"
 oe_vas.8.desc: "#F 1376年7月，热那亚人帮安德洛尼卡逃出囚禁，安德洛尼卡随即投奔了苏丹。#!\n\n热那亚人买通了狱卒，[SCOPE.sCharacter('oe_vas_h').GetName]连夜逃出阿内马斯塔楼，躲进了金角湾对岸的加拉塔。城里都在猜，[SCOPE.sCharacter('oe_vas_h').GetName]下一步会去找谁。"
 oe_vas.8.a: "全城搜捕"
 oe_vas.8.a.tt: "#G 40%#!的可能把[SCOPE.sCharacter('oe_vas_h').GetName]抓回来；否则[SCOPE.sCharacter('oe_vas_h').GetName]会去投奔苏丹"
 oe_vas.8.b: "加强城防"
 oe_vas.8.b.tt: "一旦打起来，开局#G 大势 +10#!；[SCOPE.sCharacter('oe_vas_h').GetName]会去投奔苏丹"
 oe_vas.8.c: "听之任之"
 oe_vas.8.c.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]会去投奔苏丹"
 oe_vas.9.t: "王子的筹码"
 oe_vas.9.desc: "#F 安德洛尼卡许诺把加里波利交还奥斯曼人，换来了苏丹的骑兵。#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName]到了[SCOPE.sCharacter('oe_vas_su').GetName]的营帐，许下重礼：只要苏丹帮忙夺下京城，就把帝国在海峡边的城堡交给苏丹，贡金照付不误。苏丹还在掂量。"
 oe_vas.9.a: "出更高的价"
 oe_vas.9.a.tt: "花费一年的贡金\n#G 60%#!的可能苏丹按兵不动：[SCOPE.sCharacter('oe_vas_h').GetName]只能留在加拉塔，不会有篡位之战；否则苏丹出兵"
 oe_vas.9.b: "求威尼斯派船"
 oe_vas.9.b.tt: "威尼斯的船站在我们一边：打起来以后，每月#G 大势 +1#!"
 oe_vas.9.c: "全力备战"
 oe_vas.9.c.tt: "开局#G 大势 +10#!"
 oe_vas.10.t: "金门之变"
 oe_vas.10.desc: "#F 1376年8月12日，安德洛尼卡借奥斯曼和热那亚的兵马攻入君士坦丁堡，囚禁了约翰五世和曼努埃尔。#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName]带着突厥人和热那亚人的兵马来到城下，城里也有人在暗中接应。皇帝要守住京城，也要守住皇位。"
 oe_vas.10.a: "守住京城"
 oe_vas.10.a.tt: "若城外还有我们的城镇，[SCOPE.sCharacter('oe_vas_h').GetName]会在那里起兵，局势“臣属苏丹”显示篡位之战的大势；叛军占住君士坦丁堡满#Y 2#!个月，[SCOPE.sCharacter('oe_vas_h').GetName]即位\n若城外已无我们的城镇，这是一场宫门之变，一个月内见分晓"
 oe_vas.11.t: "新皇入城"
 oe_vas.11.desc: "#F 安德洛尼卡四世在1377年10月加冕，把父亲和弟弟关进了阿内马斯塔楼。#!\n\n城门开了。[SCOPE.sCharacter('oe_vas_h').GetName]在圣索菲亚大教堂加冕为皇帝；老皇帝[SCOPE.sCharacter('oe_vas_e').GetName]和[SCOPE.sCharacter('oe_vas_s').GetName]被关进了阿内马斯塔楼。从今天起，帝国效忠的是新皇帝。"
 oe_vas.11.a: "新皇登基"
 oe_vas.11.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]成为皇帝；[SCOPE.sCharacter('oe_vas_e').GetName]和[SCOPE.sCharacter('oe_vas_s').GetName]被关押#Y 10#!年\n[SCOPE.sCharacter('oe_vas_h').GetName]的长子若在世，立为继承人\n苏丹仍是帝国的宗主，贡金照付"
 oe_vas.12.t: "两头许诺"
 oe_vas.12.desc: "#F 安德洛尼卡四世把特内多斯许给了热那亚，可岛上的守军不服，把岛交给了威尼斯，两大海上共和国由此开战。#!\n\n热那亚人来讨回报了：热那亚人帮新皇帝越狱、夺城，要的是#bold #color_yellow 特内多斯#!#!岛。可威尼斯人也盯着这座岛，两边都在等皇帝表态。"
 oe_vas.12.a: "把特内多斯许给热那亚"
 oe_vas.12.a.tt: "热那亚对我们的好感#G +20#!，威尼斯#R −40#!\n获得 [ShowModifier('oe_vas_tenedos_dispute')]，持续#Y 5#!年"
 oe_vas.12.b: "食言"
 oe_vas.12.b.tt: "热那亚对我们的好感#R −20#!"
 oe_vas.13.t: "加里波利"
 oe_vas.13.desc: "#F 1376年到1377年间，安德洛尼卡四世把萨伏伊伯爵十年前夺回的加里波利交还给了奥斯曼人。#!\n\n[SCOPE.sCharacter('oe_vas_su').GetName]的使者来取约定的报酬：#bold #color_yellow 加里波利#!#!。这是帝国在海峡欧洲一侧最要紧的城堡。"
 oe_vas.13.a: "交出加里波利"
 oe_vas.13.a.tt: "#R 加里波利交给奥斯曼#!\n苏丹的耐心恢复到#Y 100#!"
 oe_vas.13.b: "违约"
 oe_vas.13.b.tt: "#R 苏丹的耐心降到0#!：苏丹会翻脸"
 oe_vas.14.t: "越狱复位"
 oe_vas.14.desc: "#F 1379年7月1日，约翰五世和曼努埃尔逃出阿内马斯塔楼，在苏丹的支持下复位；安德洛尼卡退入热那亚人的加拉塔。#!\n\n[SCOPE.sCharacter('oe_vas_e').GetName]和[SCOPE.sCharacter('oe_vas_s').GetName]逃出了阿内马斯塔楼。城里不少人还记得老皇帝；[SCOPE.sCharacter('oe_vas_su').GetName]也派人传话：只要贡金再加两成，苏丹愿意帮老皇帝复位。"
 oe_vas.14.a: "迎老皇帝复位，借苏丹之力"
 oe_vas.14.a.tt: "[SCOPE.sCharacter('oe_vas_e').GetName]复位，[SCOPE.sCharacter('oe_vas_h').GetName]退守加拉塔\n每年贡金#R +20%#!\n苏丹的耐心#G +20#!"
 oe_vas.14.b: "迎老皇帝复位，借威尼斯的船"
 oe_vas.14.b.tt: "[SCOPE.sCharacter('oe_vas_e').GetName]复位，[SCOPE.sCharacter('oe_vas_h').GetName]退守加拉塔\n威尼斯对我们的好感#G +20#!\n苏丹的耐心#R −10#!"
 oe_vas.14.c: "封锁海陆，把人抓回来"
 oe_vas.14.c.tt: "[SCOPE.sCharacter('oe_vas_e').GetName]和[SCOPE.sCharacter('oe_vas_s').GetName]被抓回，再关#Y 5#!年；#Y 3#!年内不会再有越狱\n苏丹的耐心#R −30#!"
 oe_vas.15.t: "加拉塔的人质"
 oe_vas.15.desc: "#F 安德洛尼卡退入加拉塔时带走了母亲海伦娜等皇室成员作人质，热那亚人随即关闭了城门。#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName]退进加拉塔时带走了几位皇室成员作人质。热那亚人关上了城门，城里的人只能隔着金角湾观望。"
 oe_vas.15.a: "围攻加拉塔"
 oe_vas.15.a.tt: "热那亚对我们的好感#R −30#!\n人质获释，继承问题提前摊牌（#G 威望上升#!）"
 oe_vas.15.b: "谈判"
 oe_vas.15.b.tt: "开始谈判，继承问题提前摊牌"
 oe_vas.16.t: "继承之约"
 oe_vas.16.desc: "#F 1381年，约翰五世与安德洛尼卡和解：安德洛尼卡和儿子约翰重新成为继承人，越过了曼努埃尔，并以塞林布里亚为封邑。#!\n\n僵持了这么久，各方终于坐下来谈。[SCOPE.sCharacter('oe_vas_h').GetName]愿意放下兵器，条件是自己和儿子[SCOPE.sCharacter('oe_vas_g').GetName]重新成为继承人，再得到#bold #color_yellow 塞林布里亚#!#!作封邑。[SCOPE.sCharacter('oe_vas_s').GetName]的人坚决反对。"
 oe_vas.16.a: "认长子一系为继承人"
 oe_vas.16.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]回京，重新成为继承人（若已失明，则由[SCOPE.sCharacter('oe_vas_g').GetName]继承）\n塞林布里亚获得 [ShowModifier('oe_vas_selymbria')]\n[SCOPE.sCharacter('oe_vas_s').GetName]心怀不满，日后可能另有打算"
 oe_vas.16.b: "坚持立[SCOPE.sCharacter('oe_vas_s').GetName]"
 oe_vas.16.b.tt: "[SCOPE.sCharacter('oe_vas_s').GetName]仍是继承人\n[SCOPE.sCharacter('oe_vas_h').GetName]留在加拉塔，不再回京"
 oe_vas.17.t: "都灵和约"
 oe_vas.17.desc: "#F 1381年8月8日，威尼斯和热那亚在都灵议和：特内多斯交给萨伏伊伯爵，拆除城堡，迁走岛民。#!\n\n威尼斯和热那亚终于议和。为了不让对方得到#bold #color_yellow 特内多斯#!#!，两家同意拆毁岛上的城堡，把岛民迁走，谁也不许占。"
 oe_vas.17.a: "一座空岛"
 oe_vas.17.a.tt: "与特内多斯有关的修正全部取消"
 oe_vas.18.t: "苏丹的怒火"
 oe_vas.18.desc: "#F 约翰五世之后的皇帝们一再想摆脱奥斯曼的宗主权，每一次都招来了苏丹的兵锋。#!\n\n[SCOPE.sCharacter('oe_vas_su').GetName]的耐心耗尽了。使者带回一句话：罗马皇帝既然不守约定，苏丹也就不必再守。"
 oe_vas.18.a: "走着瞧"
 oe_vas.18.a.tt: "臣属结束：岁币协议作废，双方#R 停战取消#!；协议还在的话，威望#R −10#!，奥斯曼对我们的好感#R −40#!"
 oe_vas.19.t: "挣脱枷锁"
 oe_vas.19.desc: "#F 安卡拉之战后，奥斯曼陷入空位期，帝国在加里波利条约中免除了贡赋。#!\n\n奥斯曼人的兵锋已经不如从前，帝国的军队又能挡住突厥骑兵了。朝中有人说，是时候不再向苏丹纳贡了。"
 oe_vas.19.a: "停止纳贡"
 oe_vas.19.a.tt: "岁币协议结束，不算背约；#G 威望上升#!"
 oe_vas.19.b: "照旧纳贡，求个太平"
 oe_vas.19.b.tt: "岁币照付，直到协议到期；不再随军、送人质"
 oe_vas.20.t: "篡位者败亡"
 oe_vas.20.desc: "#F 1376年，安德洛尼卡四世夺城成功；这一次，京城守住了。#!\n\n[SCOPE.sCharacter('oe_vas_h').GetName]的人马在城下溃散，[SCOPE.sCharacter('oe_vas_h').GetName]本人被擒。皇帝下令把[SCOPE.sCharacter('oe_vas_h').GetName]重新关进阿内马斯塔楼。"
 oe_vas.20.a: "关进阿内马斯塔楼"
 oe_vas.20.a.tt: "[SCOPE.sCharacter('oe_vas_h').GetName]被关押#Y 10#!年；叛军的城镇归还帝国"
 oe_vas.21.t: "城下之盟"
 oe_vas.21.desc: "#F 约翰五世与安德洛尼卡四世在1381年和解，安德洛尼卡以塞林布里亚为封邑。#!\n\n仗打了两年，谁也吃不掉谁。双方在城下议和：[SCOPE.sCharacter('oe_vas_h').GetName]放下兵器，重新成为继承人，以#bold #color_yellow 塞林布里亚#!#!为封邑。"
 oe_vas.21.a: "至少不打了"
 oe_vas.21.a.tt: "叛军的城镇归还帝国；[SCOPE.sCharacter('oe_vas_h').GetName]重新成为继承人（若已失明，则由[SCOPE.sCharacter('oe_vas_g').GetName]继承）\n塞林布里亚获得 [ShowModifier('oe_vas_selymbria')]"
