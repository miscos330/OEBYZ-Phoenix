 oe_teu_ordensmark_subject_opinion:0 "大团长宗主权"
 oe_teu_ordensmark_overlord_opinion:0 "东方骑士大封邑"
 oe_tom_ordensmark_reform:0 "骑士大封邑堡垒制"
 oe_tom_ordensmark_reform_desc:0 "以红砖骑士城堡、库尔姆法典边疆城镇与军事修会管区构筑的封邑体制，大幅降低要塞维护、加速东向拓殖文化同化与天主教改宗，并锤炼精锐德意志重装骑兵。"
 oe_tom_op_enfeoffed:0 "获封东方骑士大封邑"
 oe_tom_op_circuit:0 "大团长东巡授旗"
 oe_tom_op_byz_holy_alliance:0 "黑十字与双头鹰神圣同盟"
 oe_tom_op_byz_papal_demand:0 "强索教宗首席权威"
 oe_tom_dec_grand_master_circuit.title:0 "大团长东巡与封邑授旗"
 oe_tom_dec_grand_master_circuit.desc:0 "率领大团长枢庭亲赴东方各骑士大封邑巡阅授旗，使全部东方骑士大封邑的独立倾向降低#G -15#!、大幅提升好感，并赋予持续#Y 5#!年的东向拓殖同化与天主教改宗加成。"
 oe_tom_dec_grand_master_circuit.a:0 "亲授东方诸封邑圣旗"
 oe_tom_dec_grand_master_circuit_tt:0 "全部活跃的东方骑士大封邑降低#G 15#!独立倾向、提升#G +35#!好感，并获得持续#Y 5#!年的东向拓殖同化与改宗增益（冷却 5 年）。"
 oe_tom_dec_levy_ordensmark_host.title:0 "征调东方大封邑骑士联军"
 oe_tom_dec_levy_ordensmark_host.desc:0 "自马林堡向东方草原吹响征召战号，动员全部东方骑士大封邑的重装骑兵与攻城纵队参战。军事协同增益将随活跃大封邑数量按#Y 1–2#!、#Y 3–4#!与#Y 5+#!三档递增。"
 oe_tom_dec_levy_ordensmark_host.a:0 "集结黑十字诸封邑联军"
 oe_tom_dec_levy_ordensmark_host_tt:0 "按当前活跃东方骑士大封邑数量赋予持续#Y 5#!年的战时协同增益（1–2 先遣／3–4 大圣战／5+ 欧亚总动员），并动员全部封邑军队（冷却 5 年）。"
 oe_tom_dec_reintegrate_march.title:0 "分封自治 vs 改流直辖"
 oe_tom_dec_reintegrate_march.desc:0 "随着东方诸骑士大封邑日渐富庶成熟，大团长枢庭面临帝国体制抉择：和平改流直辖一座忠诚成熟的骑士大封邑以扩大直属版图，或是确认各封邑的永久自治特许以换取随封邑数量递增的常驻联邦加成。"
 oe_tom_dec_reintegrate_march.a:0 "改流直辖：和平收回一座忠诚大封邑"
 oe_tom_dec_reintegrate_march.b:0 "分封自治：确认永久封邑联邦特许"
 oe_tom_dec_reintegrate_march_req_tt:0 "至少有一个由 AI 控制的东方骑士大封邑独立倾向低于#Y 30#!。"
 oe_tom_dec_reintegrate_march_a_tt:0 "和平吞并规模最大且忠诚的 AI 东方骑士大封邑（独立倾向 < 30），获赐其首府核心，并获得持续#Y 15#!年的改流直辖总管体制加成。"
 oe_tom_dec_reintegrate_march_b_tt:0 "保留各封邑自治地位，令全部大封邑独立倾向降低#G -15#!，并激活按 1+、3+、5+ 封邑三档常驻生效的#Y 东方封邑自治联邦#!加成。"
 oe_sit_northern_crusade:0 "北方十字军与波罗的海圣战"
 oe_sit_northern_crusade_desc:0 "在东波罗的海的林海河网与红砖城堡之间，德意志骑士团、利沃尼亚骑士团与波兰、立陶宛围绕萨莫吉希亚、东向拓殖与东欧霸权展开殊死角逐。究竟是马林堡成就东方圣战霸业，还是波兰—立陶宛联军折断黑十字旗？"
 oe_sit_northern_crusade_outcome_order:0 "骑士团东方霸权确立"
 oe_sit_northern_crusade_outcome_order_desc:0 "波罗的海圣战势能达到 80（满 24 个月），或德意志骑士团掌控维尔纽斯、华沙及至少两个活跃东方骑士大封邑。"
 oe_sit_northern_crusade_outcome_plu:0 "波兰—立陶宛联盟大捷"
 oe_sit_northern_crusade_outcome_plu_desc:0 "德意志骑士团覆亡、圣战势能跌至 15 以下，或波兰—立陶宛联邦夺取马尔堡。"
 oe_sit_northern_crusade_outcome_settlement:0 "波罗的海边疆均势底定"
 oe_sit_northern_crusade_outcome_settlement_desc:0 "至 1525 年双方皆未彻底击倒对手时，北方圣战演变为长期稳定的波罗的海均势格局。"
 OE_TOM_SIT_TITLE:0 "北方十字军势能与东向拓殖进度"
 OE_TOM_SIT_MOM_L:0 "波立抗衡阵线（15）"
 OE_TOM_SIT_MOM_R:0 "骑士团东扩霸权（80）"
 OE_TOM_SIT_MOM_FOOT:0 "实时追踪萨莫吉希亚、利沃尼亚、维尔纽斯、华沙控制权与已建大封邑数量。达到 80 确立骑士团东方霸权，跌至 15 则波立联盟获胜。"
