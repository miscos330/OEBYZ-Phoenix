 oe_msn_teu_a1_break_lithuanian_raid:0 "击溃立陶宛侵袭"
 oe_msn_teu_a1_break_lithuanian_raid_desc:0 "在雾霭笼罩的涅曼河畔，立陶宛骑兵每逢隆冬便试探骑士团的边防木堡。巩固普鲁士[fort|e]防线、锤炼十字军[army_tradition|e]，吹响波罗的海反攻号角。"
 oe_msn_teu_a1_break_lithuanian_raid_req_tt:0 "自身或属国控制马尔堡或派尔努，稳定度至少为 5，且陆军传统至少为 12 或拥有城堡。"
 oe_msn_teu_a2_consolidate_livland:0 "整合利沃尼亚大总管区"
 oe_msn_teu_a2_consolidate_livland_desc:0 "将里加、派尔努、库尔兰与波罗的海诸主教区整合于利沃尼亚大总管区麾下，以铁血军团取代内耗教区，筑牢北方[control|e]与[trade|e]基石。"
 oe_msn_teu_a2_consolidate_livland_req_tt:0 "自身或属国控制里加与派尔努，且已分封利沃尼亚大总管区（第一档）或稳定度至少为 8。"
 oe_msn_teu_a3_samogitian_corridor:0 "打通萨莫吉希亚走廊"
 oe_msn_teu_a3_samogitian_corridor_desc:0 "百年来萨莫吉希亚如楔子般隔断普鲁士与利沃尼亚。夺取梅梅尔与涅曼河渡口，令南北两翼骑士团领地连成一气，贯通波罗的海[core|e]干道。"
 oe_msn_teu_a3_samogitian_corridor_req_tt:0 "自身或属国控制梅梅尔，并控制拉塞尼艾、希奥利艾、帕兰加或考纳斯之一。"
 oe_msn_teu_a4_reverse_of_tannenberg:0 "逆转坦能堡：粉碎波立联军"
 oe_msn_teu_a4_reverse_of_tannenberg_desc:0 "历史曾预言骑士团折戟坦能堡，然而今日铁骑反破波兰—立陶宛联军。克复维尔纽斯与维斯瓦平原，铸就无可撼动的东欧[army|e]霸权。"
 oe_msn_teu_a4_reverse_of_tannenberg_req_tt:0 "同时分封立陶宛边疆与维斯瓦大封邑，或自身及属国同时控制维尔纽斯/考纳斯与华沙/克拉科夫/波兹南之一。"
 oe_msn_teu_b1_kulm_law_prosperity:0 "库尔姆法典与东向拓殖繁荣"
 oe_msn_teu_b1_kulm_law_prosperity_desc:0 "《库尔姆法典》以明晰市政特许权吸引德意志市民、工匠与垦农东渡维斯瓦河。深耕城市[development|e]与领地[prosperity|e]，为东扩圣战提供不竭财源。"
 oe_msn_teu_b1_kulm_law_prosperity_req_tt:0 "自身或属国控制海乌姆诺、托伦或但泽，稳定度至少为 8，且首都发展度达到 12。"
 oe_msn_teu_b2_marienburg_brick_fortress:0 "马林堡红砖要塞之冠"
 oe_msn_teu_b2_marienburg_brick_fortress_desc:0 "矗立于诺加特河畔的红砖马林堡，既是基督教世界最宏伟的哥特式[fort|e]，亦是大团长枢庭与东方诸城堡的建筑典范。"
 oe_msn_teu_b2_marienburg_brick_fortress_req_tt:0 "自身或属国控制马尔堡，持有至少 180 金币，并建有城堡、骑士团要塞或棱堡。"
 oe_msn_teu_b3_imperial_bailiwicks:0 "帝国辖区与骑士管区网络"
 oe_msn_teu_b3_imperial_bailiwicks_desc:0 "遍布法兰克尼亚、科布伦茨与波希米亚的帝国辖区源源不断向普鲁士输送骑士新血与白银，稳固[crown_power|e]与教士[estate_satisfaction|e]。"
 oe_msn_teu_b3_imperial_bailiwicks_req_tt:0 "进入文艺复兴时代，稳定度至少 12、威望至少 20，且拥有修道院、骑士团管区或大学（或教士满意度达 55%）。"
 oe_msn_teu_b4_reichsschild_or_rimini:0 "帝国之盾与里米尼金玺主权"
 oe_msn_teu_b4_reichsschild_or_rimini_desc:0 "援引神圣罗马皇帝腓特烈二世颁发的《里米尼金玺诏书》，骑士团国确立与选帝侯比肩的独立主权，无论坚守骑士团体制还是迈向普鲁士世俗王冠，皆永掌东方[subjects|e]与[legitimacy|e]。"
 oe_msn_teu_b4_reichsschild_or_rimini_req_tt:0 "进入大航海时代，稳定度至少为 15，且控制至少 45 处领地（含属国）或拥有至少 2 个东方骑士大封邑。"
 oe_msn_teu_c1_vistula_granary_march:0 "维斯瓦粮仓大封邑"
 oe_msn_teu_c1_vistula_granary_march_desc:0 "将但泽的汉萨运粮码头与马佐夫舍、大波兰沃野贯通，令北欧最丰饶的谷物[market|e]尽归黑十字旗下。"
 oe_msn_teu_c1_vistula_granary_march_req_tt:0 "自身或属国控制但泽，且已分封维斯瓦大封邑（第三档）或控制华沙或波兹南。"
 oe_msn_teu_c2_avenge_lake_peipus:0 "雪耻冰湖之战：克复诺夫哥罗德"
 oe_msn_teu_c2_avenge_lake_peipus_desc:0 "1242年楚德湖碎冰曾吞噬骑士团冲锋的铁蹄。今日将黑十字旗插上普斯科夫与大诺夫哥罗德城头，一雪百年旧耻并执掌北方毛皮[trade|e]。"
 oe_msn_teu_c2_avenge_lake_peipus_req_tt:0 "分封诺夫哥罗德—冰湖北方骑士团（第四档），或自身及属国同时控制诺夫哥罗德与普斯科夫。"
 oe_msn_teu_c3_dnieper_frontier_kiev:0 "第聂伯边疆：基辅大封邑"
 oe_msn_teu_c3_dnieper_frontier_kiev_desc:0 "自斯摩棱斯克沿第聂伯河大动脉挥师南下基辅，重开古老的瓦良格—希腊商道，将黑十字的[control|e]推进至黑土草原门户。"
 oe_msn_teu_c3_dnieper_frontier_kiev_req_tt:0 "分封基辅—鲁塞尼亚骑士团（第五档），或自身及属国控制基辅以及斯摩棱斯克或明斯克之一。"
 oe_msn_teu_c4_cross_over_moscow_volga:0 "黑十字加冕莫斯科与伏尔加"
 oe_msn_teu_c4_cross_over_moscow_volga_desc:0 "兵临莫斯科白石城垣与下诺夫哥罗德伏尔加河口，将德意志骑士团的远东圣战推至罗斯腹地，向欧亚纵深投射无匹[manpower|e]与[prestige|e]。"
 oe_msn_teu_c4_cross_over_moscow_volga_req_tt:0 "分封莫斯科—伏尔加远东圣战骑士团（第六档），或自身及属国控制莫斯科以及下诺夫哥罗德、弗拉基米尔或特维尔之一。"
 oe_msn_teu_d1_black_sea_pontus_march:0 "饮马黑海：克里米亚圣战封邑"
 oe_msn_teu_d1_black_sea_pontus_march_desc:0 "当身披白袍黑十字的骑士在卡法与克里米亚暖海饮马，德意志骑士团正式达成从波罗的海冰原直抵黑海[market|e]的两海伟业。"
 oe_msn_teu_d1_black_sea_pontus_march_req_tt:0 "分封黑海—克里米亚圣战骑士团（第七档），或自身及属国控制卡法、索尔哈特或克尔克耶尔之一。"
 oe_msn_teu_d2_baltic_black_sea_road:0 "波罗的海—黑海琥珀毛皮大道"
 oe_msn_teu_d2_baltic_black_sea_road_desc:0 "普鲁士琥珀、诺夫哥罗德黑貂与乌克兰麦浪沿骑士团城堡驿站南下，在卡法与黑海香料丝绸汇流，织就贯通欧亚南北的[trade|e]黄金大动脉。"
 oe_msn_teu_d2_baltic_black_sea_road_req_tt:0 "自身或属国同时控制但泽/里加与卡法/索尔哈特/塔纳，且月均贸易税收达 30（或拥有市场建筑）。"
 oe_msn_teu_d3_black_cross_double_eagle:0 "黑十字与双头鹰"
 oe_msn_teu_d3_black_cross_double_eagle_desc:0 "隔着黑海波涛，来自马林堡的北方黑十字骑士团与君士坦丁堡的双头鹰皇座正面相会。无论结成欧亚基督教神圣同盟还是以剑定盟主，骑士团的[prestige|e]皆将重塑欧亚格局。"
 oe_msn_teu_d3_black_cross_double_eagle_req_tt:0 "确立黑海克里米亚据点，并完成《黑十字与双头鹰》事件抉择（或控制君士坦丁堡／拜占庭已覆亡）。"
 oe_msn_teu_d4_eternal_gross_ordensstaat:0 "永恒大骑士团帝国（Gross-Ordensstaat）"
 oe_msn_teu_d4_eternal_gross_ordensstaat_desc:0 "自马林堡、里加延绵至基辅、莫斯科与克里米亚海岸，众星拱月般的东方骑士大封邑拱卫基督教世界东疆。红砖城堡、钢铁军纪与至高[crown_power|e]辉耀千秋。"
 oe_msn_teu_d4_eternal_gross_ordensstaat_req_tt:0 "稳定度至少为 18，确立黑海据点，控制马尔堡、里加、基辅及莫斯科或诺夫哥罗德，且总领地达 90 处（含属国）或拥有至少 4 个骑士大封邑。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_charter:0 "东方骑士大封邑建制诏书"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_charter:0 "新建的红砖城堡管区、边疆免税特许与忠诚骑士团驻军稳固了新立的东方大封邑。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_military:0 "军事骑士型大封邑"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_military:0 "奉大团长诏命建成东方铁盾，将封邑十一税悉数投入重装骑兵、红砖堡垒与攻城武库。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_settler:0 "移民传教型大封邑"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_settler:0 "依《库尔姆法典》招徕德意志市民与天主教区扎根东疆，加速文化同化、改宗与城镇繁荣。"
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_overlord:0 "大团长东巡授旗"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_overlord:0 "大团长亲赴东方诸大封邑巡阅授旗，彰显骑士团无上权威，凝聚诸封邑向心力。"
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_march:0 "大团长亲授战旗"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_march:0 "受领大团长亲授圣旗后，封邑司令官全力推行天主教教化与东向拓殖市政建制。"
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier1:0 "东方大封邑骑士联军（先遣）"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier1:0 "来自东方大封邑的骑士战旗汇入黑十字主力，显著增强重骑突击与野战士气。"
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier2:0 "东方大封邑骑士联军（大圣战）"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier2:0 "三个以上东方骑士大封邑齐应大团长战号，铁甲骑兵与攻城纵队如潮水般席卷战线。"
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier3:0 "东方大封邑骑士联军（欧亚总动员）"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier3:0 "自波罗的海至伏尔加与黑海的五座以上骑士大封邑倾巢出动，化作横扫欧亚大陆的钢铁十字军洪流。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_mobilized:0 "大封邑战时总动员"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_mobilized:0 "封邑各骑士管区尽开武库与粮仓，全力支援大团长远征。"
 STATIC_MODIFIER_NAME_oe_tom_mod_direct_rule:0 "改流直辖总管体制"
 STATIC_MODIFIER_DESC_oe_tom_mod_direct_rule:0 "将成熟忠诚的骑士大封邑改流归直辖，强化中央控制力与直属财税汲取。"
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_1:0 "东方封邑自治联邦（一阶）"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_1:0 "尊重东方封邑自治特许，为骑士团换来稳定的骑士税贡、商道通行与坚不可摧的边防忠诚。"
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_2:0 "东方封邑自治联邦（二阶）"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_2:0 "三座以上自治骑士大封邑连横东欧，将广袤边疆纳入马林堡主导的繁荣封建网络。"
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_3:0 "东方封邑自治联邦（三阶）"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_3:0 "五座以上自治骑士大封邑横贯波罗的海至黑海，以最小行政损耗维系大骑士团帝国的欧亚霸权。"
 STATIC_MODIFIER_NAME_oe_tom_mod_peipus_avenged_a:0 "冰湖雪耻：北境铁骑"
 STATIC_MODIFIER_DESC_oe_tom_mod_peipus_avenged_a:0 "一雪1242年楚德湖冰原旧耻，骑士团严冬纵队驰骋北境林海冰湖而无所畏惧。"
 STATIC_MODIFIER_NAME_oe_tom_mod_peipus_avenged_b:0 "波罗的海—诺夫哥罗德毛皮琥珀汉萨"
 STATIC_MODIFIER_DESC_oe_tom_mod_peipus_avenged_b:0 "骑士团商馆全面掌控诺夫哥罗德、普斯科夫与里加的珍稀毛皮、蜂蜡与波罗的海琥珀贸易。"
 STATIC_MODIFIER_NAME_oe_tom_mod_tannenberg_reversed_a:0 "逆转坦能堡：黑十字凯旋"
 STATIC_MODIFIER_DESC_oe_tom_mod_tannenberg_reversed_a:0 "在坦能堡改写历史的辉煌大捷令自莱茵河至第聂伯河的诸侯皆震慑于黑十字威名。"
 STATIC_MODIFIER_NAME_oe_tom_mod_tannenberg_reversed_b:0 "马林堡永久和约"
 STATIC_MODIFIER_DESC_oe_tom_mod_tannenberg_reversed_b:0 "败北强敌在马林堡圣殿前立誓永守和约，既充盈国库亦稳固各东方边疆封邑。"
 STATIC_MODIFIER_NAME_oe_tom_mod_papal_primacy_march:0 "教宗首席圣战进军"
 STATIC_MODIFIER_DESC_oe_tom_mod_papal_primacy_march:0 "宣告拉丁教会对博斯普鲁斯海峡的最高权威，点燃十字军狂热并强化南下色雷斯的攻城力量。"
 STATIC_MODIFIER_NAME_oe_tom_mod_black_cross_eagle_teu:0 "黑十字与双头鹰神圣同盟"
 STATIC_MODIFIER_DESC_oe_tom_mod_black_cross_eagle_teu:0 "与君士坦丁堡双头鹰并肩镇守波罗的海至博斯普鲁斯海峡，德意志骑士团铸就欧亚基督教北方长城。"
 STATIC_MODIFIER_NAME_oe_tom_mod_black_cross_eagle_byz:0 "欧亚基督教神圣同盟"
 STATIC_MODIFIER_DESC_oe_tom_mod_black_cross_eagle_byz:0 "驻守克里米亚的德意志骑士团稳固黑海北岸防线，令新罗马得以全力经略安纳托利亚与草原边疆。"
 STATIC_MODIFIER_NAME_oe_tom_mod_euxine_accord:0 "黑海通商协定"
 STATIC_MODIFIER_DESC_oe_tom_mod_euxine_accord:0 "连通卡法、塔纳与君士坦丁堡的互惠港口特许状开辟了从波罗的海直抵地中海的繁盛商路。"
 STATIC_MODIFIER_NAME_oe_tom_mod_byz_defiance:0 "狄奥多西城墙的傲然抗争"
 STATIC_MODIFIER_DESC_oe_tom_mod_byz_defiance:0 "断然回绝北方拉丁骑士团的臣服通牒，新罗马在海峡两岸燃起不屈的东正教防卫斗志。"
 STATIC_MODIFIER_NAME_oe_tom_mod_brick_ordensburg:0 "边疆红砖城堡营建计划"
 STATIC_MODIFIER_DESC_oe_tom_mod_brick_ordensburg:0 "来自马林堡的红砖匠师在东方诸封邑兴筑护城河城堡要塞，兼具坚固防务与低廉维护。"
 STATIC_MODIFIER_NAME_oe_tom_mod_ostsiedlung_wave:0 "东向拓殖移民与教区浪潮"
 STATIC_MODIFIER_DESC_oe_tom_mod_ostsiedlung_wave:0 "成批德意志农夫、工匠与教区神父涌向边疆骑士管区周围，扎根落户并弘扬正统信仰。"
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_order_victory:0 "骑士团波罗的海霸权"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_order_victory:0 "在北方十字军博弈中大获全胜，德意志骑士团无可争议地执掌波罗的海海岸与东欧平原。"
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_pl_victory:0 "波兰—立陶宛波罗的海大捷"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_pl_victory:0 "成功遏止骑士团东扩狂潮后，波兰与立陶宛合流一体，成为中东欧屹立不倒的霸主之盾。"
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_crusade_legacy:0 "北方十字军不朽遗产"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_crusade_legacy:0 "数代边疆圣战铸就了波罗的海诸边区铁血不屈的尚武传统。"
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_baltic_peace:0 "波罗的海边疆均势和平"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_baltic_peace:0 "维斯瓦河与涅曼河沿线疆界底定，迎来了汉萨商贸繁荣与外交长治久安。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_samogitia:0 "贯通普鲁士—利沃尼亚走廊"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_samogitia:0 "穿过萨莫吉希亚的稳固陆上干道将马林堡与里加彻底连为一体。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_tannenberg:0 "逆转坦能堡之承袭"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_tannenberg:0 "力挫波兰—立陶宛联军的赫赫战功铸就德意志重装枪骑兵的不败传奇。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_marienburg:0 "红砖哥特要塞之冠"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_marienburg:0 "马林堡宏伟的穹顶大厅与重重外郭城墙树立了骑士团筑城工程的最高典范。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_bailiwicks:0 "帝国辖区常备供奉"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_bailiwicks:0 "德意志帝国各辖区源源不断向大团长总庭输送白银、学者与贵族志愿骑士。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_rimini:0 "里米尼金玺至高主权"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_rimini:0 "凭借帝国金玺与沙场大胜，骑士团国对旗下一切大封邑享有至高无上的宗主权威。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_vistula:0 "维斯瓦谷物垄断"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_vistula:0 "从马佐夫舍与大波兰顺维斯瓦河直抵但泽的运粮船队令全国城镇与要塞仓廪充实。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_dnieper:0 "第聂伯河边疆守望"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_dnieper:0 "俯瞰基辅与斯摩棱斯克的红砖堡垒群牢牢锁住波罗的海通往黑海草原的中枢桥梁。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_volga:0 "伏尔加远东边疆之主"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_volga:0 "黑十字越过莫斯科直抵伏尔加河，带来浩瀚战略纵深与丰厚东方贡赋。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_amber_fur_road:0 "波罗的海—黑海琥珀毛皮大道"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_amber_fur_road:0 "南北水陆关税畅通无阻，将波罗的海琥珀、北方黑貂与黑海香料汇成源源不绝的财富引擎。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_black_cross_eagle:0 "黑十字与双头鹰荣光"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_black_cross_eagle:0 "在黑海之滨与千年帝都交汇，使德意志骑士团跃升为纵横欧亚大陆的基督教世界超级强权。"
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_gross_ordensstaat:0 "永恒大骑士团帝国"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_gross_ordensstaat:0 "自普鲁士与利沃尼亚绵延至波兰、罗斯与克里米亚，大团长统御的联邦式大骑士团帝国傲立欧亚青史。"
