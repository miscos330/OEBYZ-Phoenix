 oe_tom_dec_transfer_frontier_land.title:0 "补划新占边区领土"
 oe_tom_dec_transfer_frontier_land.desc:0 "将在已建 M1—M4 边区历史界线内新征服的非核心领土移交对应统领边区。不白送免费核心，但赋予 #G +25%#! 整合进度并使受领边区降低 #G -3#! 独立倾向。"
 oe_tom_dec_transfer_frontier_land.a:0 "将新占边疆地块移交对应边区"
 oe_tom_dec_transfer_frontier_land_tt:0 "将已建 M1—M4 边区范围内的直辖非核心地块移交对应边区，并附加 +25% 整合进度（冷却 2 年）。"
 oe_tom_dec_reintegrate_march.title:0 "定向改流直辖或确认边区自治"
 oe_tom_dec_reintegrate_march.desc:0 "召开马林堡总团会议，在满足成熟条件（建区满 25 年、独立倾向 < 25、领地 <= 35 格）的 M1—M4 边区中定向择一改流直辖（耗 #R 200 金#!、#R 20 威望#! 并令余下边区 #R +15 独立倾向#!），或确认自治边区协约。"
 oe_tom_dec_reintegrate_march.a:0 "召开总团会议商议边区改流或自治"
 oe_tom_dec_reintegrate_march_req_tt:0 "至少有一个 AI 边区已建满 25 年、独立倾向低于 25 且领地不超过 35 格，或尚未确认边区自治协约。"
 oe_tom_dec_reintegrate_march_a_tt:0 "开启定向改流抉择事件，可自由选择收回 M1/M2/M3/M4 或确认边区自治（冷却 5 年）。"
 oe_tom_dec_grand_master_circuit.title:0 "大团长东巡与边区授旗"
 oe_tom_dec_grand_master_circuit.desc:0 "每 8 年率领大团长枢庭巡阅东方诸边区，耗费 #R 150 金币#! 与 #R 10 威望#! 使全部边区降低 #G -8#! 独立倾向、增进好感并推动异教宣教。"
 oe_tom_dec_grand_master_circuit.a:0 "亲赴东方诸边区巡阅授旗"
 oe_tom_dec_grand_master_circuit_tt:0 "全部活跃边区降低 #G 8#! 独立倾向、提升 #G +25#! 好感，并获得 5 年异教宣教与忠诚增益（冷却 8 年）。"
 oe_tom_dec_levy_ordensmark_host.title:0 "征调东方边区骑士联军"
 oe_tom_dec_levy_ordensmark_host.desc:0 "征召东方各活跃边区的重装骑兵战旗协同出征，持续 #Y 5年#!，依 #Y 1—2#! 与 #Y 3—4#! 边区两档递增战力并承担额外军费维护。"
 oe_tom_dec_levy_ordensmark_host.a:0 "集结东方边区骑士联军"
 oe_tom_dec_levy_ordensmark_host_tt:0 "依活跃边区数赋予 5 年重骑与士气协同增益（1—2 先遣／3—4 总动员），并附带军费维护代价（冷却 6 年）。"
 oe_teu_dec_buy_estonia.title:0 "外交洽购丹属爱沙尼亚（1346兜底）"
 oe_teu_dec_buy_estonia.desc:0 "承袭1346年条顿购入丹属爱沙尼亚的历史先例，向丹麦国王出价 #Y 280 金币#! 和平收购塔林、纳尔瓦与爱沙尼亚公国全境，优先交由利沃尼亚分支管辖。"
 oe_teu_dec_buy_estonia.a:0 "遣使携银赴丹麦洽购爱沙尼亚"
 oe_teu_dec_buy_estonia_tt:0 "向丹麦发出 280 金币正式购地提议，若丹麦应允则将丹属爱沙尼亚全部地块移交利沃尼亚（或其缺位时归我方直辖）。"
 oe_teu_dec_prussian_bishoprics_concordat.title:0 "普鲁士四大主教区教务整编"
 oe_teu_dec_prussian_bishoprics_concordat.desc:0 "与效忠普鲁士团国的四大历史主教区——桑比亚（SMD）、波美萨尼亚（PMS）、库尔姆（CHL）与自治的瓦尔米亚（ERM）——缔结教务整编协约：和平并入忠诚教区，或为瓦尔米亚确立自治与收编之抉择。"
 oe_teu_dec_prussian_bishoprics_concordat.a:0 "召开普鲁士四主教区教务会议"
 oe_teu_dec_prussian_bishoprics_concordat_req_tt:0 "至少有一个普鲁士主教区（SMD/PMS/CHL/ERM）为我方 AI 附庸，独立倾向低于 35 且好感达到 120。"
 oe_teu_dec_prussian_bishoprics_concordat_tt:0 "开启普鲁士四大主教区协约事件（冷却 10 年）：可和平整合一处忠诚教区，或就瓦尔米亚自治与收编作出抉择。"
 oe_teu_dec_livonian_confederation_diplomacy.title:0 "教廷斡旋：利沃尼亚邦联分步整合"
 oe_teu_dec_livonian_confederation_diplomacy.desc:0 "摒弃粗暴强吞，依托教廷特使与地方议会每 #Y 12年#! 循序渐进地将一处顺服的利沃尼亚邦国（库尔兰、厄塞尔、多尔帕特、里加大主教区或里加市）并入利沃尼亚骑士团，或重申联邦自治协约。"
 oe_teu_dec_livonian_confederation_diplomacy.a:0 "请教廷特使主持利沃尼亚邦联斡旋"
 oe_teu_dec_livonian_confederation_diplomacy_tt:0 "开启利沃尼亚邦联分步斡旋事件（冷却 12 年）：每次最多整合一处顺服小邦入利沃尼亚，或签署邦联自治协约。"
 oe_teu_dec_1525_reformation_crossroads.title:0 "1525年历史抉择：世俗化普鲁士或反宗教改革总团国"
 oe_teu_dec_1525_reformation_crossroads.desc:0 "宗教改革席卷波罗的海诸港之际，决定骑士团国终局命运：或顺应历史世俗化为路德宗普鲁士公国（合法破除改宗锁定、成立 PRU、分家帝国辖区并无缝接轨普鲁士天命线），或坚守天主教铸就反宗教改革波罗的海大骑士团国。"
 oe_teu_dec_1525_reformation_crossroads.a:0 "召开总团终局会议，决断国运"
 oe_teu_dec_1525_reformation_crossroads_tt:0 "触发 1525 双终局事件：世俗化为普鲁士 PRU（并处置利沃尼亚／库尔兰），或确立反宗教改革天主教大骑士团国。"
 oe_sit_northern_crusade:0 "北方十字军与波罗的海博弈"
 oe_sit_northern_crusade_desc:0 "在普鲁士红砖堡垒、自治的利沃尼亚邦联与萨莫吉希亚林海之间，条顿骑士团与波兰、立陶宛展开跨世纪博弈。克雷沃受洗动摇圣战法理，普鲁士邦联撼动内政根基——波罗的海终将走向波立遏制、1525世俗化普鲁士，抑或骑士团破局？"
 oe_sit_northern_crusade_outcome_order:0 "骑士团波罗的海霸权确立"
 oe_sit_northern_crusade_outcome_order_desc:0 "波罗的海圣战势能达到 80（满 24 个月），或条顿骑士团掌控维尔纽斯、普沃茨克及至少两个活跃东疆统领边区。"
 oe_sit_northern_crusade_outcome_plu:0 "波兰—立陶宛联盟大捷"
 oe_sit_northern_crusade_outcome_plu_desc:0 "波罗的海双骑士团覆亡（且未世俗化转普鲁士）、圣战势能跌至 15 以下，或波兰—立陶宛联邦夺取马尔堡。"
 oe_sit_northern_crusade_outcome_settlement:0 "波罗的海新秩序与1525定鼎"
 oe_sit_northern_crusade_outcome_settlement_desc:0 "条顿骑士团完成 1525 世俗化转为普鲁士公国（PRU），或局势持续至 1525 年双方形成持久波罗的海均势格局。"
 OE_TOM_SIT_TITLE:0 "北方十字军势能与双危机态势"
 OE_TOM_SIT_MOM_L:0 "波立抗衡阵线（15）"
 OE_TOM_SIT_MOM_R:0 "骑士团波罗的海霸权（80）"
 OE_TOM_SIT_MOM_FOOT:0 "实时追踪普鲁士、塔林、里加、萨莫吉希亚、维尔纽斯、普沃茨克、M1—M4 边区、克雷沃法理危机（-12）与邦联高张力（-8）；转普鲁士 PRU 将和平定鼎。"
 OE_TOM_SIT_PHASE_KPI:0 "圣战阶段"
 OE_TOM_SIT_MARCHES_KPI:0 "东疆统领边区"
 OE_TOM_SIT_BUND_KPI:0 "普鲁士邦联张力"
 OE_TOM_SIT_P1:0 "#Y 波罗的海圣战期#!"
 OE_TOM_SIT_P2:0 "#color_yellow 克雷沃法理危机#!"
 OE_TOM_SIT_P3:0 "#color_orange 邦联与决战危局#!"
 OE_TOM_SIT_P4:0 "#G 黑十字波罗的海盛世#!"
 OE_TOM_SIT_LEGEND_TITLE:0 "北方圣战战区图例"
 OE_TOM_SIT_LEGEND_DESC:0 "国家本色：条顿骑士团／普鲁士直辖核心；绿色：M1—M4 东疆统领边区与利沃尼亚盟友；红色：波兰—立陶宛联盟阵营；琥珀色：北欧、汉萨、罗斯与帝国观察国。"
 oe_tom_sit_map_teu_tt:0 "条顿骑士团或世俗化普鲁士核心直辖领。"
 oe_tom_sit_map_march_tt:0 "镇守东波罗的海辐射圈的有限骑士统领边区。"
 oe_tom_sit_map_order_ally_tt:0 "效忠或协从条顿骑士团的利沃尼亚与附庸诸邦。"
 oe_tom_sit_map_pl_tt:0 "抗衡北方十字军的波兰—立陶宛联盟阵营。"
 oe_tom_sit_map_nbr_tt:0 "注视波罗的海格局的北欧、汉萨、罗斯与帝国观察国。"
 oe_teu_act_guest_crusaders:0 "延请西欧客座骑士"
 oe_teu_act_guest_crusaders_cd:0 "延请西欧客座骑士"
 oe_teu_act_guest_crusaders_desc:0 "延请莱茵兰与帝国客座骑士赴波罗的海助战（与客卿远征决议共享 8 年冷却），补充人力、陆军传统、重骑士气并提升势能 +4；克雷沃受洗危机后金币开销 +50% 且效果减半。"
 oe_teu_act_guest_crusaders_tt:0 "使十字军势能提升 #G +4#!（克雷沃危机后仅 +2；与客卿远征决议共享冷却）。"
 oe_teu_act_fortify_ordensburgen:0 "加固红砖统领堡"
 oe_teu_act_fortify_ordensburgen_cd:0 "加固红砖统领堡"
 oe_teu_act_fortify_ordensburgen_desc:0 "拨款加固普鲁士与利沃尼亚红砖城堡，获得 5 年 +10% 要塞防御与维护效率，并使十字军势能提升 #G +3#!。"
 oe_teu_act_fortify_ordensburgen_tt:0 "使十字军势能提升 #G +3#!（行动偏移区间 -20 至 +20）。"
 oe_teu_act_curia_plea:0 "向罗马教廷申辩法理"
 oe_teu_act_curia_plea_cd:0 "向罗马教廷申辩法理"
 oe_teu_act_curia_plea_desc:0 "仅在立陶宛受洗触发克雷沃危机后可用：耗费金币与威望赴罗马教廷申辩，解除当前康斯坦茨教廷谴责、获得 5 年外交缓解并拉回 #G +3#! 势能。"
 oe_teu_act_curia_plea_tt:0 "清除当前教廷谴责修正，获得 5 年教廷特许缓解，并使十字军势能提升 #G +3#!。"
 oe_teu_act_pl_defensive_levy:0 "波立联防总动员"
 oe_teu_act_pl_defensive_levy_cd:0 "波立联防总动员"
 oe_teu_act_pl_defensive_levy_desc:0 "动员波兰贵族骑兵与立陶宛边防军，获得 5 年 +8% 防御、+8% 轻骑战力与 +5% 士气，并将十字军势能压低 #R -4#!。"
 oe_teu_act_pl_defensive_levy_tt:0 "使十字军势能向波立反制方偏移 #R -4#!（行动偏移区间 -20 至 +20）。"
 oe_teu_act_constance_indictment:0 "康斯坦茨公会议控诉"
 oe_teu_act_constance_indictment_cd:0 "康斯坦茨公会议控诉"
 oe_teu_act_constance_indictment_desc:0 "效仿波兰法学家弗沃德科维奇在康斯坦茨公会议上的著名控诉，向全基督教世界质询骑士团越权征伐。立陶宛改宗天主教后威力翻倍：势能直降 #R -6#! 并推高条顿普鲁士邦联离心度 #R +10#!。"
 oe_teu_act_constance_indictment_tt:0 "压低十字军势能 #R -3#!；立陶宛改宗天主教后翻倍为 #R -6#! 并推高条顿邦联张力 #R +10#!。"
 oe_teu_act_baltic_trade_charter:0 "波罗的海中立商约"
 oe_teu_act_baltic_trade_charter_cd:0 "波罗的海中立商约"
 oe_teu_act_baltic_trade_charter_desc:0 "护航中立商船分享汉萨海贸红利，获得 5 年海贸与外交增益；若普鲁士邦联张力已高，还将暗中助长普鲁士港市离心（+6 邦联张力）。"
 oe_msn_56_teu:0 "#bold #color_yellow 条顿骑士团：波罗的海骑士团国与1525终局#!#!"
 oe_msn_56_teu_DESCRIPTION:0 "自1346爱沙尼亚购地、萨莫吉希亚、哥特兰与新马克出发，历经克雷沃法理危机与普鲁士邦联风暴，构筑有限东疆边区（M1—M4）并迎来1525双终局"
 oe_msn_56_teu_CRITERIA_DESCRIPTION:0 "完成波罗的海闭环（爱沙尼亚、萨莫吉希亚、哥特兰／新马克）、整编四主教区与利沃尼亚邦联、经受坦能堡与普鲁士邦联考验、确立有限东疆防线（M1—M4）并抉择1525时代终局。"
 oe_msn_56_teu_BUTTON_TOOLTIP:0 "开启条顿骑士团波罗的海史实天命线"
 oe_msn_56_teu_BUTTON_DETAILS:0 "面向条顿骑士团（1337 与 1453 双剧本兼容）的四支十六阶波罗的海史实任务树：闭环波罗的海、治理四主教区与普鲁士邦联、设立有限东疆边区（M1—M4），并在1525世俗化普鲁士（无缝接轨普鲁士天命线）与反宗教改革大骑士团国之间决断终局。"
 oe_tom.1.title:0 "萨莫吉希亚林野洗礼与维陶塔斯遗部"
 oe_tom.1.desc:0 "在杜比萨河与涅曼河畔的古老橡木林深处，新任萨莫吉希亚—立陶宛边区统领接受受洗萨莫吉希亚长老的效忠誓言，而忠于立陶宛大公的游击残部仍在沼泽林野出没。团廷是将重金投入涅曼河红砖碉堡链严防死守，还是委任双语修道士与宽容乡约和平感化林野教区？"
 oe_tom.1.a:0 "沿涅曼河渡口广筑红砖碉堡链，严防林野伏击"
 oe_tom.1.b:0 "派驻双语宣教修会并礼遇本土自由民长老"
 oe_tom.2.title:0 "普斯科夫圣三一大教堂与汉萨毛皮商馆"
 oe_tom.2.desc:0 "韦利卡亚河畔，普斯科夫白石克罗姆要塞与圣三一大教堂的穹顶如今迎风矗立在黑十字枪骑旗下。骑士团审慎止步于佩普斯湖—卢加河防线而未盲目深入无垠罗斯腹地；北疆元帅请示：究竟是将普斯科夫打造成抗寒铁壁前哨，还是重开连接纳尔瓦与里加的汉萨毛皮蜂蜡商馆？"
 oe_tom.2.a:0 "加固佩普斯—卢加严冬戍防要塞链"
 oe_tom.2.b:0 "特许开设普斯科夫—纳尔瓦汉萨毛皮商馆"
 oe_tom.3.title:0 "波洛茨克德维纳河海关与道加瓦堡垒"
 oe_tom.3.desc:0 "满载松木、大麻与蜂蜡的平底货船正沿西德维纳河自波洛茨克顺流直下里加海港。将东翼边界克制地锁定在德维纳河分水岭，使新任波洛茨克边区长官得以从容抉择：是在上游要津连建石砌河防堡垒，还是整顿波洛茨克水运海关以充边库？"
 oe_tom.3.a:0 "在波洛茨克与维捷布斯克筑造西德维纳河防堡垒"
 oe_tom.3.b:0 "设立西德维纳河木料与蜂蜡统一水运海关"
 oe_tom.4.title:0 "普沃茨克康拉德旧约与维斯瓦粮道"
 oe_tom.4.desc:0 "百余年前，马佐夫舍公爵康拉德邀条顿骑士团进驻维斯瓦河护边；今日黑十字旗却已飘扬在普沃茨克、多布任与库亚维城头。深知再染指克拉科夫或波兹南必将招致天主教世界群起围攻，南翼边区长官请示：是加固维斯瓦中游桥头堡防线，还是安抚库亚维乡绅畅通直抵但泽的运粮商道？"
 oe_tom.4.a:0 "在普沃茨克与多布任构筑维斯瓦桥头堡防线"
 oe_tom.4.b:0 "颁行库亚维—马佐夫舍运粮宪章，宽抚地方乡绅"
 oe_tom.5.title:0 "马林堡总团议政：定向边区改流直辖"
 oe_tom.5.desc:0 "马林堡总团议政厅案头陈列着诸东疆边区的封册与账簿。和平收回一座成熟忠诚的边区（建区满 25 年、独立倾向低于 25 且领地不超 35 格）需耗费 200 金币与 20 威望，并会令余下边区产生 10 年戒惧（独立倾向 +15）；抑或我们可确认自治协约以稳固联邦。"
 oe_tom.5.a:0 "定向改流 M1：收回萨莫吉希亚—立陶宛边区（200金/20威望）"
 oe_tom.5.b:0 "定向改流 M2：收回佩普斯湖—普斯科夫边区（200金/20威望）"
 oe_tom.5.c:0 "定向改流 M3：收回西德维纳—波洛茨克边区（200金/20威望）"
 oe_tom.5.d:0 "定向改流 M4：收回库亚维—马佐夫舍边区（200金/20威望）"
 oe_tom.5.e:0 "暂不改流：确认有限边区自治协约（-75金）"
 oe_tom.8.title:0 "1242年楚德湖冰湖雪耻"
 oe_tom.8.desc:0 "一个多世纪前，楚德湖碎冰曾吞噬骑士团重骑冲锋。如今黑十字旗稳立普斯科夫与伊兹博尔斯克城头，在克制可守的佩普斯防线上彻底雪耻百年旧账。"
 oe_tom.8.a:0 "于楚德湖畔立碑雪耻，整训北境寒冬骑兵"
 oe_tom.8.b:0 "开辟普斯科夫—波罗的海毛皮蜂蜡商路"
 oe_tom.9.title:0 "格伦瓦尔德决战与波立和局"
 oe_tom.9.desc:0 "无论是正面经受住波兰—立陶宛联军的沙场大考，还是在克雷沃变局后以老练治术稳住边疆均势，马林堡终究挺过了最凶险的命运试炼。团廷是将此役铸为铁血军事荣耀，还是缔结务实的《马林堡永久和约》？"
 oe_tom.9.a:0 "铭刻坦能堡军事荣耀（+2%纪律 / -8%维护效率）"
 oe_tom.9.b:0 "缔结《马林堡永久和约》（金币、稳定与稳健治国）"
 oe_tom.10.title:0 "黑十字与双头鹰"
 oe_tom.10.desc:0 "跨越万里征尘，白袍黑十字骑士竟奇迹般立足克里米亚石砌要塞，隔黑海遥望君士坦丁堡穹顶。东罗马皇帝的使节静候大团长决断：是与双头鹰缔结跨洲基督教同盟，还是高举教宗首席权威？"
 oe_tom.10.a:0 "与君士坦丁堡缔结欧亚基督教神圣同盟"
 oe_tom.10.b:0 "向君士坦丁堡宣示罗马教宗首席权威"
 oe_tom.11.title:0 "黑十字使节：黑海同盟之约"
 oe_tom.11.desc:0 "远抵克里米亚诸港的条顿骑士团遣使驶入金角湾，向新罗马提议缔结《黑十字与双头鹰》基督教神圣同盟。"
 oe_tom.11.a:0 "签署《黑十字与双头鹰》神圣同盟"
 oe_tom.11.b:0 "仅缔结务实的黑海通商协定"
 oe_tom.12.title:0 "北方黑十字最后通牒"
 oe_tom.12.desc:0 "自克里米亚渡海而来的条顿传令官要求东方教会承认罗马教宗首席权威，瞬间激起君士坦丁堡军民对1204年的惨痛记忆。"
 oe_tom.12.a:0 "依托狄奥多西城墙严辞回绝北方通牒"
 oe_tom.12.b:0 "以务实的黑海商约缓和北方冲突"
 oe_tom.14.title:0 "北方十字军时代定鼎"
 oe_tom.14.desc:0 "历经数代跨越普鲁士、利沃尼亚、立陶宛与波兰的隆冬征战、康斯坦茨法理交锋与时代裂变，北方十字军的大时代终于落下帷幕，波罗的海新秩序由此定鼎。"
 oe_tom.14.a:0 "铭记并承袭波罗的海边疆尚武传统"
 oe_tom.14.b:0 "化疆界底定为波罗的海长久商贸繁荣"
 oe_tom.15.title:0 "维尔纽斯的洗礼：十字军旗帜的动摇"
 oe_tom.15.desc:0 "克拉科夫与维尔纽斯钟声齐鸣：立陶宛已受洗改宗天主教并与波兰结成联合！一夜之间，条顿骑士团百年来“向欧洲最后异教徒发动圣战”的立国法理轰然动摇。西欧客座十字军应召锐减（费用暴涨 50%、收益减半），日后若主动向天主教波立宣战更将招致康斯坦茨公会议与教廷谴责！马林堡将择何道破局转型？"
 oe_tom.15.a:0 "路1：东转向罗斯正教边疆（普斯科夫与诺夫哥罗德）"
 oe_tom.15.b:0 "路2：融入神罗世俗诸侯法统（放弃狂热圣战换取外交正统）"
 oe_tom.15.c:0 "路3：援引《里米尼金玺诏书》强硬以剑立国（孤立与邦联激化）"
 oe_tom.16.title:0 "康斯坦茨的质询：以剑传教之辩"
 oe_tom.16.desc:0 "在立陶宛改宗天主教后仍主动向天主教波立开战，立刻给了波兰法学家保罗·弗沃德科维奇在康斯坦茨公会议上控诉骑士团的铁证！罗马教廷震怒降下严厉谴责（外交声誉暴跌且受谴期间东疆边区不再自动参战），波立全军士气凝聚，普鲁士市民更对无止境的战税怨声载道。"
 oe_tom.16.a:0 "强硬驳斥控诉，承受十年教廷谴责与外交孤立"
 oe_tom.16.b:0 "向罗马教廷献金斡旋，将谴责期缩减至五年（-120金/-15威望）"
 oe_tom.17.title:0 "玛丽恩韦德尔请愿书：普鲁士邦联成立"
 oe_tom.17.desc:0 "来自但泽、托伦、埃尔布隆格的市议会代表与库尔姆乡绅骑士齐聚玛丽恩韦德尔，正式缔结《普鲁士邦联》（Preußischer Bund）！面对沉重战税、大商官专卖挤压与连年征伐，他们呈上请愿书要求设立普鲁士等级会议咨政权。妥协将让渡二十年王权与市民税限但大幅降温，强硬驳回则将令三大商港控制度暴跌并逼近全面起义。"
 oe_tom.17.a:0 "妥协让权：批准普鲁士等级会议宪章（邦联张力 -35）"
 oe_tom.17.b:0 "驳回请愿：坚持团廷专卖集权（三大港控制 -20，张力 +20）"
 oe_tom.18.title:0 "普鲁士邦联起义与十三年战争危局"
 oe_tom.18.desc:0 "皇家普鲁士的怒火彻底爆发！但泽、托伦与埃尔布隆格市议会紧闭城门驱逐骑士团税官、接管官仓，并密遣使节南下克拉科夫恳请波兰国王出兵接管普鲁士。马林堡正面临立国以来最严峻的内政与外患双重危机！"
 oe_tom.18.a:0 "武力镇压邦联市镇（重创控制与财税，波兰可能趁机介入！）"
 oe_tom.18.b:0 "紧急大让步：斥资赎买并颁行宽大等级宪章以止戈（-180金/-20威望）"
 oe_tom.24.title:0 "普鲁士邦联密使抵临克拉科夫"
 oe_tom.24.desc:0 "但泽、托伦与埃尔布隆格市议会代表跪陈波兰王座之前，控诉条顿骑士团暴政并愿奉波兰国王为皇家普鲁士护主，恳请波兰出兵声援！"
 oe_tom.24.a:0 "公开声援普鲁士邦联，宣示收复皇家普鲁士！"
 oe_tom.24.b:0 "暂且按兵不动，稳固国内财政与稳度"
 oe_tom.19.title:0 "1525年抉择：十字架与铁鹰"
 oe_tom.19.desc:0 "路德宗布道回荡在哥尼斯堡与但泽街头，中世纪十字军时代已渐行渐远。立于1525年历史十字路口，大团长面临两条截然相反的国运之路：其一，顺应史实将骑士团国世俗化为路德宗普鲁士公国（合法卸除骑士团改宗锁、成立 PRU 并无缝接轨普鲁士天命线，代价是与神罗五大辖区及教皇决裂，并处置利沃尼亚与东疆边区）；其二，坚守天主教铸就反宗教改革波罗的海总团国，保留大议会、帝国辖区与四边区框架，但须承受二十五年铁腕清教的惨痛内政代价。"
 oe_tom.19.a:0 "终局 I：世俗化为路德宗普鲁士（转 PRU / 接轨普鲁士天命线 / 辖区分家）"
 oe_tom.19.b:0 "终局 II：坚守天主教，确立反宗教改革波罗的海大骑士团国"
 oe_tom.20.title:0 "利沃尼亚分流：库尔兰公国之约"
 oe_tom.20.desc:0 "随着普鲁士世俗化改制，北翼利沃尼亚分支亦面临何去何从的抉择。我们可以仿效1561年维尔纽斯协议将其改组为忠诚的路德宗库尔兰—利沃尼亚世俗公国附庸，或强行直并入普鲁士王冠承受剧烈行政震荡，抑或体面解约任其留守天主教阵营免陷北疆泥潭。"
 oe_tom.20.a:0 "改组为库尔兰—利沃尼亚世俗公国（路德宗附庸，稳固海贸）"
 oe_tom.20.b:0 "直接并入普鲁士王冠（-15 稳定度与 15 年行政过载）"
 oe_tom.20.c:0 "和平解约，任其留在天主教阵营自立（免除北疆负担）"
 oe_tom.21.title:0 "条顿骑士团出价洽购丹属爱沙尼亚"
 oe_tom.21.desc:0 "条顿骑士团大团长的使节携沉重银箱抵临宫廷，愿出价 280 金币和平收购鞭长莫及且动荡不安的丹属爱沙尼亚（塔林与纳尔瓦）。售地可即刻充盈王室国库，拒绝则保留波罗的海前哨但将面临骑士团的边境施压。"
 oe_tom.21.a:0 "接受 280 金币，将丹属爱沙尼亚售予骑士团阵营"
 oe_tom.21.b:0 "断然回绝，坚守塔林与爱沙尼亚领地"
 oe_tom.22.title:0 "普鲁士四大主教区教务协约会议"
 oe_tom.22.desc:0 "桑比亚、波美萨尼亚、库尔姆与瓦尔米亚四位主教齐聚马林堡共商教区法权。早已与骑士团融为一体的忠诚教区可经协约和平并入直辖；而素具自治传统的瓦尔米亚则摆出真实取舍：保留其自治以换取教士拥护、教廷好感与学术助益，抑或强行收编并承受罗马不满。"
 oe_tom.22.a:0 "和平并入一处忠诚主教区（桑比亚／波美萨尼亚／库尔姆）"
 oe_tom.22.b:0 "确认瓦尔米亚主教区历史自治（教士满意、科研与教廷好感）"
 oe_tom.22.c:0 "强行收编瓦尔米亚主教区（承受教廷 -40 好感与教士不满）"
 oe_tom.23.title:0 "教廷特使调停利沃尼亚邦联"
 oe_tom.23.desc:0 "受邀调停里加、多尔帕特与派尔努纷争的教廷特使郑重申明：利沃尼亚诸主教区与里加自由市皆具教廷敕许，不可一朝粗暴抹平。借由十余年一轮的耐心外交与教廷贡银，我方可稳步将一处顺服小邦并入利沃尼亚骑士团，或签署联邦协约巩固北翼忠诚。"
 oe_tom.23.a:0 "经教廷斡旋并入一处顺服的利沃尼亚邦国（-160金/-15威望）"
 oe_tom.23.b:0 "重申利沃尼亚邦联联邦协约，稳固北翼忠诚与海贸（-60金）"
 OE_TOM_MARCH_SAMAITEN:0 "萨莫吉希亚—立陶宛统领边区（Samaiten-Litauen）"
 OE_TOM_MARCH_SAMAITEN_ADJ:0 "萨莫吉希亚边区"
 oe_tom_dec_enfeoff_samaiten.title:0 "册封 M1 东疆边区：萨莫吉希亚—立陶宛统领边区（Samaiten-Litauen）"
 oe_tom_dec_enfeoff_samaiten.desc:0 "在萨莫吉希亚与西中立陶宛（41格）的征服领地上设立有限统领边区（绝不动用普鲁士、利沃尼亚、哥特兰或新马克）。仅赐首府 1 处核心、自动宽容当地原生文化、计入 4 边区硬上限并占 0.60 外交容量，且必须满足实控首府、至少 8 格领地、建有红砖城堡与和平稳度四项硬前置。"
 oe_tom_dec_enfeoff_samaiten.a:0 "颁授萨莫吉希亚—立陶宛有限边区诏书"
 oe_tom_dec_enfeoff_samaiten_req_tt:0 "实控区域首府（Raseiniai / Kaunas / Vilnius），在萨莫吉希亚与西中立陶宛（41格）拥有至少 #Y 8#! 处非核心区领地，且区内建有至少 1 座城堡、骑士团要塞或棱堡。"
 oe_tom_dec_enfeoff_samaiten_tt:0 "建立有限东疆统领边区——#Y 萨莫吉希亚—立陶宛统领边区（Samaiten-Litauen）#!（仅送首府 1 核、自动宽容本土文化、硬上限 4 边区），随后触发专属地区风味事件。"
 OE_TOM_MARCH_PLESKAU:0 "佩普斯湖—普斯科夫北方边区（Pleskau-Peipus）"
 OE_TOM_MARCH_PLESKAU_ADJ:0 "普斯科夫边区"
 oe_tom_dec_enfeoff_pleskau.title:0 "册封 M2 东疆边区：佩普斯湖—普斯科夫北方边区（Pleskau-Peipus）"
 oe_tom_dec_enfeoff_pleskau.desc:0 "在佩普斯湖、普斯科夫与卢加河防线（28格）的征服领地上设立有限统领边区（绝不动用普鲁士、利沃尼亚、哥特兰或新马克）。仅赐首府 1 处核心、自动宽容当地原生文化、计入 4 边区硬上限并占 0.60 外交容量，且必须满足实控首府、至少 6 格领地、建有红砖城堡与和平稳度四项硬前置。"
 oe_tom_dec_enfeoff_pleskau.a:0 "颁授佩普斯—普斯科夫有限边区诏书"
 oe_tom_dec_enfeoff_pleskau_req_tt:0 "实控区域首府（Pskov / Koporye），在佩普斯湖、普斯科夫与卢加河防线（28格）拥有至少 #Y 6#! 处非核心区领地，且区内建有至少 1 座城堡、骑士团要塞或棱堡。"
 oe_tom_dec_enfeoff_pleskau_tt:0 "建立有限东疆统领边区——#Y 佩普斯湖—普斯科夫北方边区（Pleskau-Peipus）#!（仅送首府 1 核、自动宽容本土文化、硬上限 4 边区），随后触发专属地区风味事件。"
 OE_TOM_MARCH_POLOZK:0 "西德维纳—波洛茨克河防边区（Düna-Polozk）"
 OE_TOM_MARCH_POLOZK_ADJ:0 "德维纳—波洛茨克边区"
 oe_tom_dec_enfeoff_polozk.title:0 "册封 M3 东疆边区：西德维纳—波洛茨克河防边区（Düna-Polozk）"
 oe_tom_dec_enfeoff_polozk.desc:0 "在西德维纳上游、波洛茨克、维捷布斯克与布拉斯劳（30格）的征服领地上设立有限统领边区（绝不动用普鲁士、利沃尼亚、哥特兰或新马克）。仅赐首府 1 处核心、自动宽容当地原生文化、计入 4 边区硬上限并占 0.60 外交容量，且必须满足实控首府、至少 6 格领地、建有红砖城堡与和平稳度四项硬前置。"
 oe_tom_dec_enfeoff_polozk.a:0 "颁授德维纳—波洛茨克有限边区诏书"
 oe_tom_dec_enfeoff_polozk_req_tt:0 "实控区域首府（Polotsk / Vitebsk），在西德维纳上游、波洛茨克、维捷布斯克与布拉斯劳（30格）拥有至少 #Y 6#! 处非核心区领地，且区内建有至少 1 座城堡、骑士团要塞或棱堡。"
 oe_tom_dec_enfeoff_polozk_tt:0 "建立有限东疆统领边区——#Y 西德维纳—波洛茨克河防边区（Düna-Polozk）#!（仅送首府 1 核、自动宽容本土文化、硬上限 4 边区），随后触发专属地区风味事件。"
 OE_TOM_MARCH_KUJAWIEN:0 "库亚维—马佐夫舍边境护国区（Kujawien-Masowien）"
 OE_TOM_MARCH_KUJAWIEN_ADJ:0 "库亚维—马佐夫舍边区"
 oe_tom_dec_enfeoff_kujawien.title:0 "册封 M4 东疆边区：库亚维—马佐夫舍边境护国区（Kujawien-Masowien）"
 oe_tom_dec_enfeoff_kujawien.desc:0 "在多布任、库亚维、北马佐夫舍与纳克沃（28格）的征服领地上设立有限统领边区（绝不动用普鲁士、利沃尼亚、哥特兰或新马克）。仅赐首府 1 处核心、自动宽容当地原生文化、计入 4 边区硬上限并占 0.60 外交容量，且必须满足实控首府、至少 6 格领地、建有红砖城堡与和平稳度四项硬前置。"
 oe_tom_dec_enfeoff_kujawien.a:0 "颁授库亚维—马佐夫舍有限边区诏书"
 oe_tom_dec_enfeoff_kujawien_req_tt:0 "实控区域首府（Plock / Warsaw / Inowroclaw），在多布任、库亚维、北马佐夫舍与纳克沃（28格）拥有至少 #Y 6#! 处非核心区领地，且区内建有至少 1 座城堡、骑士团要塞或棱堡。"
 oe_tom_dec_enfeoff_kujawien_tt:0 "建立有限东疆统领边区——#Y 库亚维—马佐夫舍边境护国区（Kujawien-Masowien）#!（仅送首府 1 核、自动宽容本土文化、硬上限 4 边区），随后触发专属地区风味事件。"
 oe_msn_teu_a1_nemunas_iron_curtain:0 "涅曼河铁幕"
 oe_msn_teu_a1_nemunas_iron_curtain_desc:0 "雾霭笼罩的涅曼河畔，红砖团堡扼守普鲁士东疆。巩固[fort|e]防线、锤炼[army_tradition|e]，在立陶宛尚未受洗之际确立北方圣战之师。"
 oe_msn_teu_a1_nemunas_iron_curtain_req_tt:0 "自身或属国控制马尔堡或派尔努，稳定度至少为 5，且拥有至少 1 座城堡、骑士团要塞或棱堡。"
 oe_msn_teu_a2_estonia_1346:0 "1346 爱沙尼亚购地"
 oe_msn_teu_a2_estonia_1346_desc:0 "无论循1346年圣乔治夜起义后的丹麦售地旧例，抑或借外交购地促成协议，将塔林与纳尔瓦纳入骑士团北翼保护，彻底闭环芬兰湾南岸[trade|e]与边防。"
 oe_msn_teu_a2_estonia_1346_req_tt:0 "自身或属国（含利沃尼亚骑士团）同时控制塔林与纳尔瓦。"
 oe_msn_teu_a3_samogitian_land_bridge:0 "萨莫吉希亚陆桥"
 oe_msn_teu_a3_samogitian_land_bridge_desc:0 "百年来萨莫吉希亚隔断普鲁士与利沃尼亚南北两翼。稳控梅梅尔与核心渡口，令南北两翼骑士团联为贯通的波罗的海[control|e]陆桥。"
 oe_msn_teu_a3_samogitian_land_bridge_req_tt:0 "自身或属国控制梅梅尔、拉塞尼艾或帕兰加之一，并掌控萨莫吉希亚至少 6 处领地。"
 oe_msn_teu_a4_trial_of_tannenberg:0 "坦能堡的试炼"
 oe_msn_teu_a4_trial_of_tannenberg_desc:0 "无论是在格伦瓦尔德原野以铁骑定胜负，还是在克雷沃联合后以老练外交与波立达成持久和局，骑士团必须以[army|e]与治术经受住这场生死大考。"
 oe_msn_teu_a4_trial_of_tannenberg_req_tt:0 "对波兰或立陶宛赢得一场战争，或控制考纳斯／普沃茨克之一，或在克雷沃危机后保持和平且稳定度达 15。"
 oe_msn_teu_b1_kulm_and_bishoprics:0 "库尔姆法与四大主教区"
 oe_msn_teu_b1_kulm_and_bishoprics_desc:0 "将《库尔姆法典》市镇规制与普鲁士四大主教区（瓦尔米亚、桑比亚、波美萨尼亚、库尔姆）教务协约融为一体，夯实本土[development|e]与教士市民[estate_satisfaction|e]。"
 oe_msn_teu_b1_kulm_and_bishoprics_req_tt:0 "控制托伦、马尔堡与哥尼斯堡，首都发展度至少 12，且已开展主教区协约或保持桑比亚与波美萨尼亚忠诚。"
 oe_msn_teu_b2_marienburg_brick_crown:0 "红砖哥特之冠：马林堡"
 oe_msn_teu_b2_marienburg_brick_crown_desc:0 "屹立于诺加特河畔的红砖高堡既是基督教世界最宏伟的哥特式[fort|e]，亦是骑士团总司库与行政中枢的建筑典范。"
 oe_msn_teu_b2_marienburg_brick_crown_req_tt:0 "控制马尔堡（建有城堡／骑士团要塞／棱堡且发展度至少 15），并持有至少 150 金币。"
 oe_msn_teu_b3_neumark_and_gotland:0 "新马克陆桥与哥特兰海盾"
 oe_msn_teu_b3_neumark_and_gotland_desc:0 "无论1398年征讨哥特兰维塔利海盗，还是1402年典购新马克打通马林堡至德意志的陆路通道，骑士团由此稳固西向[trade|e]与帝国生命线。"
 oe_msn_teu_b3_neumark_and_gotland_req_tt:0 "自身或属国控制维斯比（哥特兰），或掌控新马克行省至少 3 处领地。"
 oe_msn_teu_b4_prussian_confederation:0 "直面普鲁士邦联"
 oe_msn_teu_b4_prussian_confederation_desc:0 "骑士团专卖体制与但泽、托伦、埃尔布隆格等汉萨重镇自治诉求的碰撞决定十五世纪团国兴衰。妥善化解邦联危机，方能永固国内[crown_power|e]与市镇安宁。"
 oe_msn_teu_b4_prussian_confederation_req_tt:0 "到达 1420 年或文艺复兴时代，且已化解普鲁士邦联危机（离心度 <= 25、已颁行等级宪章或平定起义）。"
 oe_msn_teu_c1_livonian_confederation:0 "调停利沃尼亚邦联"
 oe_msn_teu_c1_livonian_confederation_desc:0 "尊重利沃尼亚团长的历史自治地位，以教廷斡旋与外交调停协调里加、多尔帕特与库尔兰诸邦，筑牢北方[subjects|e]向心力与波罗的海[trade|e]。"
 oe_msn_teu_c1_livonian_confederation_req_tt:0 "自身或属国控制里加、塔尔图与库尔迪加，且若利沃尼亚存在则其独立倾向低于 40。"
 oe_msn_teu_c2_samogitia_march_m1:0 "涅曼—萨莫吉希亚边区（M1）"
 oe_msn_teu_c2_samogitia_march_m1_desc:0 "在萨莫吉希亚与西立陶宛设立有限统领边区（M1），或经直辖与属国完整掌控萨莫吉希亚全境，将骑士团的秩序与[control|e]扎根林海。"
 oe_msn_teu_c2_samogitia_march_m1_req_tt:0 "册封萨莫吉希亚—立陶宛边区（M1），或自身及属国完整掌控萨莫吉希亚全境 16 处领地。"
 oe_msn_teu_c3_peipus_defense_m2:0 "冰湖旧账：佩普斯防线（M2）"
 oe_msn_teu_c3_peipus_defense_m2_desc:0 "稳控普斯科夫、伊兹博尔斯克与佩普斯湖—卢加河防线，在不盲目深入广袤罗斯腹地的前提下雪耻1242冰湖旧账，筑牢北境[fort|e]屏障。"
 oe_msn_teu_c3_peipus_defense_m2_req_tt:0 "册封佩普斯湖—普斯科夫边区（M2），或自身及属国同时控制普斯科夫与伊兹博尔斯克。"
 oe_msn_teu_c4_eastern_shields_m3_m4:0 "东疆双盾：德维纳或库亚维（M3 / M4）"
 oe_msn_teu_c4_eastern_shields_m3_m4_desc:0 "沿西德维纳河波洛茨克或维斯瓦中游库亚维—马佐夫舍北翼完成有限东疆屏障建设，以克制而稳固的[subjects|e]与[control|e]网络守护波罗的海霸权。"
 oe_msn_teu_c4_eastern_shields_m3_m4_req_tt:0 "册封西德维纳—波洛茨克边区（M3）或库亚维—马佐夫舍边区（M4）之一，或拥有至少 2 个活跃统领边区。"
 oe_msn_teu_d1_mergentheim_and_empire:0 "梅尔根特海姆与帝国诸侯"
 oe_msn_teu_d1_mergentheim_and_empire_desc:0 "在神罗“帝国之盾”诸侯法统与《里米尼金玺诏书》独立主权之间确立国本，维系梅尔根特海姆与德意志诸辖区的政治纽带与外交[prestige|e]。"
 oe_msn_teu_d1_mergentheim_and_empire_req_tt:0 "威望至少为 20，且已完成帝国之盾或里米尼路线抉择（或已进入宗教改革时代）。"
 oe_msn_teu_d2_amber_and_hansa:0 "波罗的海琥珀与汉萨新约"
 oe_msn_teu_d2_amber_and_hansa_desc:0 "将原版萨姆兰琥珀专卖法度与但泽、哥尼斯堡的汉萨商港结合，令普鲁士跃升为北欧最稳健的海贸[market|e]枢纽。"
 oe_msn_teu_d2_amber_and_hansa_req_tt:0 "控制但泽与哥尼斯堡，拥有至少 2 座市场或船坞，并启用琥珀专卖法（或汉萨商贸政策）。"
 oe_msn_teu_d3_1525_crossroads:0 "1525 宗教改革十字路口"
 oe_msn_teu_d3_1525_crossroads_desc:0 "随着宗教改革席卷波罗的海诸港，1525年的历史十字路口悄然降临：是顺应时代世俗化为路德宗普鲁士公国，还是坚守天主教铸就反宗教改革大骑士团国[crown_power|e]？"
 oe_msn_teu_d3_1525_crossroads_req_tt:0 "进入宗教改革时代（或 1520 年）并完成《1525年抉择：十字架与铁鹰》（或已成立普鲁士）。"
 oe_msn_teu_d4_baltic_destiny:0 "铁鹰新生 / 永恒波罗的海黑十字"
 oe_msn_teu_d4_baltic_destiny_desc:0 "自马林堡、哥尼斯堡延展至但泽、里加与塔林，波罗的海骑士团国完成百年蜕变——或化作铁鹰新生无缝步入普鲁士近代王权，或以反宗教改革黑十字总团国铸就永恒[crown_power|e]。"
 oe_msn_teu_d4_baltic_destiny_req_tt:0 "稳定度至少为 15，且自身或属国控制马尔堡、哥尼斯堡、但泽，以及里加或塔林之一。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_charter:0 "东方统领边区建制诏书"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_charter:0 "新建的红砖城堡管区、边疆驻军与本土宽容协约稳固了新立的东方统领边区。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_reint_unease:0 "诸边区改流疑惧"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_reint_unease:0 "目睹毗邻边区被改流直辖，余下诸统领边区对马林堡心生戒备与离心。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m1_nemunas_forts:0 "涅曼河红砖碉堡链"
 STATIC_MODIFIER_DESC_oe_tom_mod_m1_nemunas_forts:0 "沿涅曼河构筑的红砖碉堡链固守萨莫吉希亚林野，代价是边境商贸受限。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m1_forest_missions:0 "萨莫吉希亚林野教区宣教团"
 STATIC_MODIFIER_DESC_oe_tom_mod_m1_forest_missions:0 "双语修道士在萨莫吉希亚林野和平传教并安抚自由民，加快异教改宗与地方繁荣，唯防务略松。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m2_peipus_garrison:0 "佩普斯湖严冬戍防军团"
 STATIC_MODIFIER_DESC_oe_tom_mod_m2_peipus_garrison:0 "耐寒常备戍军常年巡弋普斯科夫与伊兹博尔斯克冰湖前沿，唯军需维护开销偏高。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m2_fur_kontor:0 "普斯科夫—纳尔瓦汉萨毛皮商馆"
 STATIC_MODIFIER_DESC_oe_tom_mod_m2_fur_kontor:0 "普斯科夫特许汉萨商馆统筹北方毛皮、蜂蜡与亚麻贸易，提振商税而略减要塞防务。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m3_dvina_bastions:0 "西德维纳上游堡垒链"
 STATIC_MODIFIER_DESC_oe_tom_mod_m3_dvina_bastions:0 "扼守波洛茨克与维捷布斯克的河防堡垒群强化纵深控御与城防，代价是更高的筑城维护费。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m3_polotsk_customs:0 "波洛茨克德维纳河海关"
 STATIC_MODIFIER_DESC_oe_tom_mod_m3_polotsk_customs:0 "沿道加瓦河统一度量衡与木料亚麻关税，充盈边区商库而略缓战备。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m4_vistula_bridgehead:0 "维斯瓦桥头堡防线"
 STATIC_MODIFIER_DESC_oe_tom_mod_m4_vistula_bridgehead:0 "普沃茨克与多布任重兵团堡扼守维斯瓦南岸渡口防备波兰反攻，代价是高昂军费。"
 STATIC_MODIFIER_NAME_oe_tom_mod_m4_grain_charter:0 "库亚维—马佐夫舍运粮宪章"
 STATIC_MODIFIER_DESC_oe_tom_mod_m4_grain_charter:0 "沿维斯瓦河顺流而下的库亚维与马佐夫舍粮船充实波罗的海官仓与商税，代价是向地方乡绅让渡部分中枢权。"
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_overlord:0 "大团长东巡授旗"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_overlord:0 "大团长亲赴东方诸边区巡阅授旗，维系附庸效忠与外交声望。"
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_march:0 "大团长亲授战旗"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_march:0 "受领马林堡圣旗后，边区统领专务异教边民宣教与边防驻守。"
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier1:0 "东方边区骑士联军（先遣）"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier1:0 "来自一至两座东方边区的骑士战旗汇入主力，提升重骑突击与野战士气，代价是更高军费。"
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier2:0 "东方边区骑士联军（总动员）"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier2:0 "三至四座东方边区齐应黑十字战号，重装骑兵与攻城纵队锐气倍增，唯军费支出沉重。"
 STATIC_MODIFIER_NAME_oe_tom_mod_march_mobilized:0 "边区战时动员"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_mobilized:0 "边区各骑士管区开仓放粮、整备军械，全力策应大团长出征。"
 STATIC_MODIFIER_NAME_oe_tom_mod_direct_rule:0 "改流直辖总管体制"
 STATIC_MODIFIER_DESC_oe_tom_mod_direct_rule:0 "将成熟边区改流归直辖，强化中枢权力与地方控制，但也令骑士贵族阶层不满。"
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_1:0 "东方边区自治协约（一阶）"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_1:0 "尊重有限边区自治特许，换来稳健边贸与附庸忠诚，略微分散中枢集权。"
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_2:0 "东方边区自治协约（二阶）"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_2:0 "三至四座自治边区连成稳固的波罗的海防卫与商贸弧线，代价是中枢集权受地方分权制约。"
 STATIC_MODIFIER_NAME_oe_tom_mod_crusade_legitimacy_waning:0 "十字军法理危机（克雷沃受洗）"
