 oe_teu_ordensmark:0 "东方骑士统领边区"
 oe_teu_ordensmark_desc:0 "由条顿骑士团在东波罗的海辐射圈册封的有限实土统领边区（硬上限 4 个：M1—M4）。边区承担真实外交容量（0.60）与实力比压力（-0.20），自动宽容本土文化、专注异教宣教，并仅在忠诚且宗主未遭教廷谴责时自动响应进攻征召。"
