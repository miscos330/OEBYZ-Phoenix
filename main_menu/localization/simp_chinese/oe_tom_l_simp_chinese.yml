 OE_TOM_SIT_LEGEND_TITLE:0 "北方圣战战区图例"
 OE_TOM_SIT_LEGEND_DESC:0 "国家本色：德意志骑士团直辖核心；绿色：东方骑士大封邑与利沃尼亚盟友；红色：波兰—立陶宛对抗阵营；琥珀色：关注波罗的海格局的罗斯、北欧与帝国邻邦。"
 oe_tom_sit_map_teu_tt:0 "德意志骑士团普鲁士核心直辖领。"
 oe_tom_sit_map_march_tt:0 "镇守东方边疆的德意志骑士大封邑。"
 oe_tom_sit_map_order_ally_tt:0 "效忠或协从德意志骑士团的利沃尼亚与附庸诸邦。"
 oe_tom_sit_map_pl_tt:0 "抗衡北方十字军的波兰—立陶宛联盟阵营。"
 oe_tom_sit_map_nbr_tt:0 "密切注视北方十字军局势的波罗的海、北欧、罗斯与中欧邻国。"
 oe_msn_56_teu:0 "#bold #color_yellow 德意志骑士团：一路分封东扩与黑十字圣战#!#!"
 oe_msn_56_teu_DESCRIPTION:0 "自马林堡、利沃尼亚与萨莫吉希亚起兵，横扫波兰、诺夫哥罗德、基辅、莫斯科与克里米亚，直抵《黑十字与双头鹰》欧亚史诗终局"
 oe_msn_56_teu_CRITERIA_DESCRIPTION:0 "整合利沃尼亚与萨莫吉希亚走廊、逆转坦能堡、完善马林堡红砖要塞与帝国辖区体制，一路分封东方骑士大封邑直抵诺夫哥罗德、基辅、莫斯科与克里米亚，加冕永恒大骑士团帝国。"
 oe_msn_56_teu_BUTTON_TOOLTIP:0 "开启德意志骑士团一路分封东扩天命线"
 oe_msn_56_teu_BUTTON_DETAILS:0 "面向德意志骑士团（及承继团务的利沃尼亚骑士团）的四支十六阶旗舰任务树：破波立、逆转坦能堡；兴库尔姆法典与红砖马林堡；一路分封维斯瓦、诺夫哥罗德、基辅、莫斯科与克里米亚大封邑；饮马黑海与双头鹰对话。"
 oe_tom.8.title:0 "1242年冰湖之战雪耻"
 oe_tom.8.desc:0 "一个多世纪前，楚德湖碎裂的冰面吞噬了骑士团重甲修士的冲锋，成为北方圣战最沉痛的伤疤。如今，白袍黑十字战旗高悬普斯科夫与大诺夫哥罗德城头，沃尔霍夫河畔钟声回荡，百年旧耻终得昭雪。"
 oe_tom.8.a:0 "在楚德湖畔竖立凯旋石柱，整训寒冬铁骑"
 oe_tom.8.b:0 "设立波罗的海—诺夫哥罗德毛皮琥珀汉萨商馆"
 oe_tom.9.title:0 "逆转坦能堡：黑十字大捷"
 oe_tom.9.desc:0 "敌国编年史官曾预言波兰与立陶宛合兵之日便是骑士团末路。然而马林堡的钢铁枪骑与严密堡垒网彻底粉碎了波立联军，维尔纽斯与波兰腹地尽入黑十字锋芒之下。"
 oe_tom.9.a:0 "宣告大团长东欧凯旋"
 oe_tom.9.b:0 "颁行《马林堡永久和约》，稳固诸大封邑"
 oe_tom.10.title:0 "黑十字与双头鹰"
 oe_tom.10.desc:0 "站在卡法与克里米亚的石砌烽楼之上，德意志骑士团的桨帆战舰隔黑海遥望圣索菲亚大教堂的穹顶。君士坦丁堡的使节静候大团长决断：是与双头鹰结成欧亚基督教神圣同盟、共抗奥斯曼与草原汗国，还是拔剑南指、强索教宗首席权威？"
 oe_tom.10.a:0 "与拜占庭缔结欧亚基督教神圣同盟"
 oe_tom.10.b:0 "强索教宗首席权威，厉兵秣马南指君士坦丁堡"
 oe_tom.11.title:0 "黑十字使节：欧亚基督教神圣同盟之约"
 oe_tom.11.desc:0 "身披白袍黑十字的骑士使团自克里米亚渡海抵达金角湾，奉上大团长金玺诏书。已从波罗的海一路分封至黑海北岸的德意志骑士团，提议与新罗马缔结《黑十字与双头鹰》神圣同盟，共御草原与东方强敌。"
 oe_tom.11.a:0 "签署《黑十字与双头鹰》神圣同盟"
 oe_tom.11.b:0 "缔结黑海通商协定，谨守东正教独立自主"
 oe_tom.12.title:0 "北方最后通牒：黑十字强索教宗首席"
 oe_tom.12.desc:0 "自普鲁士纵横至克里米亚的德意志骑士团大团长派来传令官，傲然要求君士坦丁堡承认罗马教宗对东方教会的首席权威。1204年的惨痛记忆瞬间激起帝都军民的滔天义愤。"
 oe_tom.12.a:0 "依托狄奥多西城墙严辞回绝北方骑士团"
 oe_tom.12.b:0 "以务实的黑海通商休战缓和北方兵锋"
 oe_tom.13.title:0 "东方大封邑拓殖与红砖城堡营建"
 oe_tom.13.desc:0 "在东方各骑士大封邑的河道码头上，满载红砖、灰浆与德意志垦民、教区神父的船队络绎不绝。每一座拔地而起的红砖堡垒城镇都在加深黑十字对东欧平原的掌控——大团长将如何引导本轮五年边疆建设？"
 oe_tom.13.a:0 "资助边疆红砖城堡与封邑首府营建"
 oe_tom.13.b:0 "推动全封邑东向拓殖移民与天主教传教浪潮"
 oe_tom.14.title:0 "北方十字军终局定鼎"
 oe_tom.14.desc:0 "历经数十年跨越普鲁士、利沃尼亚、立陶宛与波兰的隆冬征战、城堡围攻与纵横捭阖，波罗的海圣战终于尘埃落定。胜者的旗帜将主宰北方平原此后百年的秩序。"
 oe_tom.14.a:0 "承袭北方十字军铁血尚武传统"
 oe_tom.14.b:0 "化边疆凯旋为波罗的海持久商贸繁荣"
 OE_TOM_MARCH_LIVLAND:0 "利沃尼亚大总管区（Livland）"
 OE_TOM_MARCH_LIVLAND_ADJ:0 "利沃尼亚骑士团"
 oe_tom_dec_enfeoff_livland.title:0 "第1档东扩分封：册封利沃尼亚大总管区（Livland）"
 oe_tom_dec_enfeoff_livland.desc:0 "将在利沃尼亚、爱沙尼亚与库尔兰征服的非首都领地册封为专属东方骑士大封邑（绝不割让首都与普鲁士核心区）。新立大封邑共享骑士团地图色块、必应一切攻防征召、缴纳适度骑士税并启用骑士大封邑堡垒制。"
 oe_tom_dec_enfeoff_livland.a:0 "颁授利沃尼亚大封邑诏书"
 oe_tom_dec_enfeoff_livland_req_tt:0 "利沃尼亚骑士团为我方属国，或我方在利沃尼亚、爱沙尼亚与库尔兰（不含普鲁士）直接拥有至少#Y 3#!处非首都领地。"
 oe_tom_dec_enfeoff_livland_tt:0 "将利沃尼亚骑士团及附庸波罗的海诸主教区（里加、库尔兰、厄塞尔、多尔帕特）合并为定都里加或派尔努的统一#Y 东方骑士大封邑#!，随后触发授旗大典。"
 oe_tom.1.title:0 "封邑授旗大典：利沃尼亚大总管区（Livland）"
 oe_tom.1.desc:0 "在马林堡高坛之前，新任利沃尼亚大总管区（Livland）大总管单膝跪地，受领统辖利沃尼亚、爱沙尼亚与库尔兰的黑十字战旗与铁印。大团长将把这座新立的东方骑士大封邑定性为以重骑堡垒为先的铁血军团，还是以库尔姆法典移民与天主教传教为先的拓殖封邑？"
 oe_tom.1.a:0 "将利沃尼亚定为军事骑士型大封邑"
 oe_tom.1.b:0 "将利沃尼亚定为移民传教型大封邑"
 OE_TOM_MARCH_LITAUEN:0 "立陶宛—萨莫吉希亚边疆骑士团（Litauen-Mark）"
 OE_TOM_MARCH_LITAUEN_ADJ:0 "立陶宛边疆骑士团"
 oe_tom_dec_enfeoff_litauen.title:0 "第2档东扩分封：册封立陶宛—萨莫吉希亚边疆骑士团（Litauen-Mark）"
 oe_tom_dec_enfeoff_litauen.desc:0 "将在立陶宛与萨莫吉希亚征服的非首都领地册封为专属东方骑士大封邑（绝不割让首都与普鲁士核心区）。新立大封邑共享骑士团地图色块、必应一切攻防征召、缴纳适度骑士税并启用骑士大封邑堡垒制。"
 oe_tom_dec_enfeoff_litauen.a:0 "颁授立陶宛边疆大封邑诏书"
 oe_tom_dec_enfeoff_litauen_req_tt:0 "在立陶宛与萨莫吉希亚（不含普鲁士）直接拥有至少#Y 4#!处非首都领地。"
 oe_tom_dec_enfeoff_litauen_tt:0 "在立陶宛与萨莫吉希亚的非首都直辖领地上建立专属#Y 东方骑士大封邑#!——#Y 立陶宛—萨莫吉希亚边疆骑士团（Litauen-Mark）#!（绝不动用首都或普鲁士核心），随后触发授旗大典。"
 oe_tom.2.title:0 "封邑授旗大典：立陶宛—萨莫吉希亚边疆骑士团（Litauen-Mark）"
 oe_tom.2.desc:0 "在马林堡高坛之前，新任立陶宛—萨莫吉希亚边疆骑士团（Litauen-Mark）大总管单膝跪地，受领统辖立陶宛与萨莫吉希亚的黑十字战旗与铁印。大团长将把这座新立的东方骑士大封邑定性为以重骑堡垒为先的铁血军团，还是以库尔姆法典移民与天主教传教为先的拓殖封邑？"
 oe_tom.2.a:0 "将立陶宛边疆定为军事骑士型大封邑"
 oe_tom.2.b:0 "将立陶宛边疆定为移民传教型大封邑"
 OE_TOM_MARCH_WEICHSEL:0 "维斯瓦—波兰骑士大封邑（Weichsel-Mark）"
 OE_TOM_MARCH_WEICHSEL_ADJ:0 "维斯瓦骑士团"
 oe_tom_dec_enfeoff_weichsel.title:0 "第3档东扩分封：册封维斯瓦—波兰骑士大封邑（Weichsel-Mark）"
