 oe_teu_ordensmark:0 "东方骑士大封邑"
 oe_teu_ordensmark_desc:0 "由德意志骑士团（或其承袭骑士团体制的帝国／普鲁士继承者）在东方边疆册封的专属实土骑士大封邑。它与宗主共享地图色块但保留各自响亮的封邑名号，必然响应宗主一切攻防征召，缴纳适度的骑士十一税，加速东向拓殖同化与改宗，且不受普通外交吞并或解约脚本干扰。"
