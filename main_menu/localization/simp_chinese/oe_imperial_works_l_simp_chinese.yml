l_simp_chinese:
 OE_WORKS_TAB: "帝国工程"
 OE_WORKS_TAB_DESC: "修渠、营田、储粮、营建海军基地，以帝国的工程供养城池、守护海路。"
 OE_WORKS_OPEN: "点击查看希腊与西安纳托利亚的帝国工程"
 OE_WORKS_GRAIN_FLAVOR: "色雷斯的田野与首都的粮仓息息相关。整饬乡村的水利与田籍，依照供粮计划安排耕作，让道路与海港为君士坦丁堡送来更丰足的收成。"
 OE_WORKS_PROGRESS: "色雷斯增粮工程：#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_thrace_food_projects_used')|0] / 5#!"
 OE_WORKS_FIVE_PROJECTS_TT: "“在色雷斯增产粮食”累计执行不足五次"
 OE_WORKS_FOOD_TARGET_TT: "色雷斯有本国拥有、原材料为粮食商品且尚未获得“供养首都”的农村地点"
 oe_works_thrace_food: "在色雷斯增产粮食"
 oe_works_thrace_food_desc: "选择本国在#Y 色雷斯#!的一处农村粮食产地，投入#Y 1000金币#!，永久赋予#Y 供养首都#!：本地农民自主度#R -10%#!、原产上限#G +100%#!、本地粮食产出#G +33%#!。\n\n每处地点仅可投资一次；本行动累计最多执行#Y 五次#!，没有冷却。"
 oe_works_thrace_food_choose: "选择色雷斯的农村粮食产地"
 oe_works_thrace_food_none: "没有符合条件且尚未获得“供养首都”的本国色雷斯农村粮食产地。"
 oe_supply_the_capital: "供养首都"
 oe_supply_the_capital_desc: "这一聚落被列入首都粮食供应计划，官员依田籍协调耕作、劳役与水利，扩大生产并将收成运往君士坦丁堡。"
 oe_planned_production: "规划增产"
 oe_planned_production_desc: "皇室官员依田籍规划耕作与水利，协调农户的劳役与收成，使供养首都成为乡村的长久职责。仅可授予拥有“供养首都”的地点。"
 oe_works_thrace_food_projects: "色雷斯增粮工程次数"
 OE_WORKS_MEDITERRANEAN_OPEN: "点击查看地中海的帝国工程"
 OE_WORKS_MEDITERRANEAN_FLAVOR: "从罗得岛的船坞到直布罗陀的海峡，船材、帆索与水手汇聚在皇帝的港湾。完成“驱逐外夷”后，可筹建五座帝国海军基地；完成“我们的海”后，再增加五次工程机会，并将船坞网络延伸至西地中海。"
 OE_WORKS_NAVAL_PROGRESS: "已批准海军基地工程：#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_naval_bases_used')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_naval_bases_limit')|0]#!"
 OE_WORKS_NAVAL_SLOTS_TT: "尚有海军基地工程次数：初始上限五次，完成“我们的海”后累计上限十次"
 OE_WORKS_NAVAL_TARGET_TT: "东罗马直接拥有至少一处已开放且尚未批准海军基地工程的指定地点"
 oe_works_imperial_naval_base: "建设帝国海军基地"
 oe_works_imperial_naval_base_desc: "花费#Y 1000金币#!与#Y 25政治影响力#!，选择东罗马直接拥有的一处指定地点，解锁并开始修建一级#Y 帝国海军基地#!。每处地点仅可批准一次，本行动初始最多执行五次；完成“我们的海”后累计上限提高至十次。\n\n最初选址：罗得岛、干地亚、雅典、卡拉马塔、阿卡、亚历山大、托布鲁克、莱梅索斯、安塔基亚、士麦那、科孚、拉乌吉亚。\n完成“我们的海”后新增：那不勒斯、热那亚、威尼斯、突尼斯、卡列尔、休塔德利亚、马塞尔哈、巴塞罗那、卡塔赫那、休达、贾巴尔塔里克、马耳他、帕莱穆。"
 oe_works_imperial_naval_base_choose: "选择海军基地所在地"
 oe_works_imperial_naval_base_none: "没有尚未批准建设且由东罗马直接拥有的合格选址；“我们的海”可解锁更多地点。"
 oe_imperial_naval_base: "帝国海军基地"
 oe_imperial_naval_base_desc: "由帝国工程授权兴建的常备海军基地，雇佣1000名士兵，为舰队提供水手、修缮与港务服务。建成后：本地每月水手+30、舰船修理速度+10%、港口容量+0.15；国家内陆海邻近度影响-2%。每处地点限一级。"
 oe_imperial_naval_base_maintenance: "帝国海军基地维护"
 oe_works_naval_base_projects: "已批准海军基地工程数"
 oe_works_naval_base_site: "帝国海军基地选址"
