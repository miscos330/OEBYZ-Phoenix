 oe_geo.6.desc_gn: "#F 使者在特拉比松和格鲁吉亚的宫廷之间往返，商量婚期和聘礼。格鲁吉亚的风俗是男方出聘礼，这一回却是女方答应送钱。#!\n\n如今，迎亲的船已在金角湾候命，[GetCountry('GEO').GetName]的宫里却没有适龄、未嫁的公主可以远嫁。"
 oe_geo.6.desc_gr: "#F 使者在特拉比松和格鲁吉亚的宫廷之间往返，商量婚期和聘礼。格鲁吉亚的风俗是男方出聘礼，这一回却是女方答应送钱。#!\n\n如今，迎亲的船已在金角湾候命。[GetCountry('GEO').GetName]的宫里，[GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetFirstNameWithNoTooltip]（[GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetAgeInYears]岁）已经备好了行装，只等皇帝[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]的船来。按约，国王会随新娘送来聘礼。"
