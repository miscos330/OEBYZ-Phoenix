 oe_geo.3.d: "隔岸观火"
 oe_geo.3.d.tt: "帝国不过问此事"
 oe_geo.1.t: "伊维隆的两个修团"
 oe_geo.1.desc_a: "#F 十世纪末，两位格鲁吉亚修士在圣山（阿索斯山）建起了伊维隆修道院，此后格鲁吉亚的王室和贵族一代代出钱供养。院里渐渐有了希腊、格鲁吉亚两个修团；到十三世纪中叶，已是希腊人院长代表全院签字。#!\n\n如今，院里的希腊修士上书牧首，请求把修院交给希腊人掌管，礼拜改用希腊语；格鲁吉亚修士则说，修院本是格鲁吉亚人建的。[GetCountry('GEO').GetName]的国王也派人来过问。圣山在帝国治下，牧首的文书一下，地方上就要照办。"
 oe_geo.1.desc_x: "#F 十世纪末，两位格鲁吉亚修士在圣山（阿索斯山）建起了伊维隆修道院，此后格鲁吉亚的王室和贵族一代代出钱供养。院里渐渐有了希腊、格鲁吉亚两个修团；到十三世纪中叶，已是希腊人院长代表全院签字。#!\n\n如今，院里的希腊修士上书牧首，请求把修院交给希腊人掌管，礼拜改用希腊语；格鲁吉亚修士则说，修院本是格鲁吉亚人建的。[GetCountry('GEO').GetName]的国王也派人来过问。圣山如今不在帝国手里，但山上的修院仍归牧首管辖。"
 oe_geo.1.a: "照希腊修团的请求，由牧首签署文书"
 oe_geo.1.a.tt: "[oe_tu_patriarchate|e]#G +2#!\n[oe_tu_church_parties|e]份额：静修派#Y +2#!\n格鲁吉亚对帝国好感#R −15#!，持续#Y 10#!年"
 oe_geo.1.b: "两个修团轮流主事，格鲁吉亚语的礼拜照旧"
 oe_geo.1.b.tt: "格鲁吉亚对帝国好感#G +20#!，持续#Y 10#!年\n格鲁吉亚会记住帝国的这份情谊\n[oe_tu_patriarchate|e]#R −1#!"
 oe_geo.1.c: "请格鲁吉亚国王出资重修，换一座礼拜堂保留旧礼"
 oe_geo.1.c.tt: "获得#G 1#!个月的贸易与税收收入\n格鲁吉亚对帝国好感#G +5#!，持续#Y 5#!年"
 oe_geo.4.t: "不肯签字的主教"
 oe_geo.4.desc_it: "#F 1439年7月，佛罗伦萨的会议签署了合一诏书。格鲁吉亚教会也派了人：第比利斯的都主教代表宗主教出席，却没有在诏书上签字。据说这位主教散尽了随身的财物，一路流浪，后来才被人找到，送往威尼斯；另一位格鲁吉亚代表拿出安条克牧首的信，劝人不要同意改动信经。#!\n\n如今，合一已经签了，东方的教会却没有跟着签。[GetCountry('GEO').GetName]的宗主教在等京城的说法。伊维隆的格鲁吉亚修团至今仍用自己的语言礼拜，第比利斯记得帝国当年的宽容。两家往来已久，有话不妨直说。"
