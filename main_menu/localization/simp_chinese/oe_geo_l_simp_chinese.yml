 oe_geo.6.desc_x: "#F 使者在特拉比松和格鲁吉亚的宫廷之间往返，商量婚期和聘礼。格鲁吉亚的风俗是男方出聘礼，这一回却是女方答应送钱。#!\n\n如今，迎亲的船已在金角湾候命，[GetCountry('GEO').GetName]的宫里却没有适龄、未嫁的公主可以远嫁。"
 oe_geo.6.a: "迎格鲁吉亚的新娘入京"
 oe_geo.6.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetFirstNameWithNoTooltip]移居君士坦丁堡，嫁给皇帝[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]\n获得#G 6#!个月的贸易与税收收入\n帝国获得[ShowModifier('oe_geo_dowry')]，持续#Y 10#!年：税收效率#G +2%#!，每月威望#G +0.05#!\n格鲁吉亚对帝国好感#G +30#!，持续#Y 20#!年\n格鲁吉亚会记住帝国的这份情谊"
 oe_geo.6.b: "迎特拉比松的新娘入京"
 oe_geo.6.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetFirstNameWithNoTooltip]移居君士坦丁堡，嫁给皇帝[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]\n帝国获得[ShowModifier('oe_geo_pontic_bride')]，持续#Y 10#!年：每月威望#G +0.05#!\n特拉比松对帝国好感#G +30#!，持续#Y 20#!年"
 oe_geo.6.c: "先收下聘礼，婚期再议"
 oe_geo.6.c.tt: "获得#G 3#!个月的贸易与税收收入\n婚期未定"
 oe_geo.6.d: "时局太紧，婚事作罢"
 oe_geo.6.d.tt: "女方的朝廷对帝国好感#R −15#!，持续#Y 10#!年"
 oe_geo.90.t: "格鲁吉亚：执行"
