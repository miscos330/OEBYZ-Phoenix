 oe_geo.5.a: "定下格鲁吉亚的亲事"
 oe_geo.5.a.tt: "格鲁吉亚对帝国好感#G +20#!，持续#Y 20#!年\n九到十五个月后，迎亲的船才会出发"
 oe_geo.5.b: "改聘特拉比松的公主"
 oe_geo.5.b.tt: "特拉比松对帝国好感#G +25#!，持续#Y 20#!年\n若帝国在特拉比松已有经营：影响#G +10#!\n格鲁吉亚对帝国好感#R −10#!，持续#Y 5#!年\n九到十五个月后，迎亲的船才会出发"
 oe_geo.5.c: "皇帝不再续弦"
 oe_geo.5.c.tt: "婚事就此搁下"
 oe_geo.6.t: "迎亲的船"
 oe_geo.6.desc_lgs: "#F 使者在特拉比松和格鲁吉亚的宫廷之间往返，商量婚期和聘礼。格鲁吉亚的风俗是男方出聘礼，这一回却是女方答应送钱。1451年9月，使者带着格鲁吉亚的使节回到京城，约定次年春天再去迎亲。#!\n\n如今，时局紧张：帝国正与奥斯曼人交战，或京城正被围困，迎亲的船出不了海。"
 oe_geo.6.desc_lgg: "#F 使者在特拉比松和格鲁吉亚的宫廷之间往返，商量婚期和聘礼。格鲁吉亚的风俗是男方出聘礼，这一回却是女方答应送钱。1451年9月，使者带着格鲁吉亚的使节回到京城，约定次年春天再去迎亲。#!\n\n如今，迎亲的船已在金角湾候命，皇位上的人却已不能迎娶这位新娘：或已成婚，或不宜成婚。"
 oe_geo.6.desc_lgn: "#F 使者在特拉比松和格鲁吉亚的宫廷之间往返，商量婚期和聘礼。格鲁吉亚的风俗是男方出聘礼，这一回却是女方答应送钱。1451年9月，使者带着格鲁吉亚的使节回到京城，约定次年春天再去迎亲。#!\n\n如今，迎亲的船已在金角湾候命，[GetCountry('GEO').GetName]的宫里却没有适龄、未嫁的公主可以远嫁。"
