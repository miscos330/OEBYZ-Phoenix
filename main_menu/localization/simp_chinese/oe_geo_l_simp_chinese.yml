 oe_geo.4.a: "写信给格鲁吉亚的宗主教，解释合一"
 oe_geo.4.a.tt: "[oe_tu_church_parties|e]份额：亲合一派#Y +2#!\n格鲁吉亚对帝国好感#R −10#!，持续#Y 10#!年\n教廷对帝国好感#G +5#!，持续#Y 5#!年"
