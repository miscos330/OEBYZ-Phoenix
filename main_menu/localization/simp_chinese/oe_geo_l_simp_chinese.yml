 oe_geo.5.t: "使者东行"
 oe_geo.5.desc_lrt: "#F 1449年秋，新即位的皇帝君士坦丁十一世派亲信乔治·斯弗兰齐斯东行，带着教士、贵族、乐师和士兵，到特拉比松和格鲁吉亚物色新娘；皇帝前后两位妻子都已去世。1451年2月，使者在特拉比松听到苏丹穆拉德二世的死讯，一度建议迎娶苏丹的遗孀、塞尔维亚的公主玛拉，玛拉不肯再嫁。使者最后看中了格鲁吉亚的公主。格鲁吉亚的风俗是男方出聘礼，使者却开口要嫁妆；据说国王最后答应给五万六千杜卡特、珠宝和礼服，另每年三千杜卡特。#!\n\n如今，皇帝[GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]尚未续弦。东方来信：[GetCountry('GEO').GetName]的国王愿意把一位公主嫁到京城。朝中也有人主张改聘特拉比松的公主。两家往来已久，这门亲事水到渠成。"
