 oe_geo.2.c.tt: "帝国不过问此事"
 oe_geo.3.t: "第比利斯陷落"
 oe_geo.3.desc_bpk: "#F 北方的汗劫掠了伊朗北部，帖木儿随即挥军西来，进了高加索。1386年11月下旬，第比利斯城破；格鲁吉亚国王巴格拉特五世手执兵器被俘，与王后安娜和幼子一同被带到征服者面前。国王假意改宗，帖木儿便派兵送国王回国；据说这支上万人的护送军在山谷里中了王子乔治的埋伏，全军覆没，国王就此脱身。#!\n\n如今，[GetCountry('GEO').GetName]的国王已经回到国中，第比利斯却已残破。逃出来的教士把消息带到了京城。王后是我们遣使认过的亲戚。帝国自己也正向苏丹低头，朝中不少人不愿多事。"
