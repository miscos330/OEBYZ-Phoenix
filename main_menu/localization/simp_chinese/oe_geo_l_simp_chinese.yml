 oe_geo.2.t: "坎塔库泽诺斯家的外孙女"
 oe_geo.2.desc_rk: "#F 特拉比松皇帝阿莱克修斯三世的长女安娜，母亲狄奥多拉出自坎塔库泽诺斯家。1362年春，特拉比松的使团到过君士坦丁堡，为这位公主与皇长子议婚，后来不了了之。1367年6月，十岁的安娜嫁给了格鲁吉亚国王巴格拉特五世，父皇和祖母亲自送亲；国王的前一位王后也是特拉比松人，前一年死于瘟疫。#!\n\n如今，婚事的消息传到了京城：[GetCountry('GEO').GetName]与特拉比松成了姻亲，黑海东岸两家同教的王室连在了一起。特拉比松的朝廷与我们是旧交，这门亲事也有帝国的一份面子。这也是坎塔库泽诺斯家的喜事。朝中有人提议遣使道贺。"
 oe_geo.2.desc_r: "#F 特拉比松皇帝阿莱克修斯三世的长女安娜，母亲狄奥多拉出自坎塔库泽诺斯家。1362年春，特拉比松的使团到过君士坦丁堡，为这位公主与皇长子议婚，后来不了了之。1367年6月，十岁的安娜嫁给了格鲁吉亚国王巴格拉特五世，父皇和祖母亲自送亲；国王的前一位王后也是特拉比松人，前一年死于瘟疫。#!\n\n如今，婚事的消息传到了京城：[GetCountry('GEO').GetName]与特拉比松成了姻亲，黑海东岸两家同教的王室连在了一起。特拉比松的朝廷与我们是旧交，这门亲事也有帝国的一份面子。朝中有人提议遣使道贺。"
 oe_geo.2.desc_k: "#F 特拉比松皇帝阿莱克修斯三世的长女安娜，母亲狄奥多拉出自坎塔库泽诺斯家。1362年春，特拉比松的使团到过君士坦丁堡，为这位公主与皇长子议婚，后来不了了之。1367年6月，十岁的安娜嫁给了格鲁吉亚国王巴格拉特五世，父皇和祖母亲自送亲；国王的前一位王后也是特拉比松人，前一年死于瘟疫。#!\n\n如今，婚事的消息传到了京城：[GetCountry('GEO').GetName]与特拉比松成了姻亲，黑海东岸两家同教的王室连在了一起。这也是坎塔库泽诺斯家的喜事。朝中有人提议遣使道贺。"
 oe_geo.2.desc_x: "#F 特拉比松皇帝阿莱克修斯三世的长女安娜，母亲狄奥多拉出自坎塔库泽诺斯家。1362年春，特拉比松的使团到过君士坦丁堡，为这位公主与皇长子议婚，后来不了了之。1367年6月，十岁的安娜嫁给了格鲁吉亚国王巴格拉特五世，父皇和祖母亲自送亲；国王的前一位王后也是特拉比松人，前一年死于瘟疫。#!\n\n如今，婚事的消息传到了京城：[GetCountry('GEO').GetName]与特拉比松成了姻亲，黑海东岸两家同教的王室连在了一起。朝中有人提议遣使道贺。"
 oe_geo.2.a: "遣使第比利斯送礼，认下这门亲"
 oe_geo.2.a.tt: "花费#R 1#!个月的贸易与税收收入\n格鲁吉亚对帝国好感#G +20#!，持续#Y 10#!年\n特拉比松对帝国好感#G +10#!，持续#Y 10#!年\n格鲁吉亚会记住帝国的这份情谊\n若帝国在特拉比松已有经营：影响#G +5#!"
 oe_geo.2.b: "请两国照应帝国在黑海东岸的商人"
 oe_geo.2.b.tt: "帝国获得[ShowModifier('oe_geo_pontic_trade')]，持续#Y 10#!年：贸易收入#G +2%#!\n格鲁吉亚对帝国好感#G +5#!，持续#Y 5#!年"
