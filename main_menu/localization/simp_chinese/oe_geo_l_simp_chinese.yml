 oe_geo.3.b: "在圣索菲亚为东方的基督徒祈祷"
 oe_geo.3.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +2#!"
 oe_geo.3.c: "把消息压下，别让它搅动与苏丹的关系"
