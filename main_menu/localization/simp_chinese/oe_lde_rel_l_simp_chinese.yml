l_simp_chinese:
 oe_lde_rel_miaphysite_desc: "中世纪盛期，埃塞俄比亚所罗门王朝在阿姆达·塞翁一世与扎拉·雅各布等君主治下达到全盛：朝廷不仅整饬修院制度与礼仪典籍，还屡次遣使赴佛罗伦萨与地中海诸国通问。在红海与尼罗河之间，埃塞俄比亚教会借助与亚历山大科普特宗座及君士坦丁堡的教务往来，维系起跨越红海与东非高原的基督教桥梁。"
 oe_lde_rel_nestorianism_desc: "大元一朝，景教以“也里可温”之名再度沿着陆海丝绸之路兴盛一时：漠南阴山之北的汪古部赵王世家世代奉教，东南海丝大港泉州（刺桐港）留存大批叙利亚文与回鹘文景教墓碑，而远在红海口外的索科特拉岛亦长期保留着隶属东方教会的基督徒社群，共同勾勒出横跨欧亚陆海的远东遗脉。"
 oe_lde_rel_orthodox_desc: "14至15世纪，帝国虽屡遭外患，东正教思想却涌现多流并进的复兴：以格里高利·帕拉马与根纳季二世（斯科拉里奥斯）为代表的静修派正统、格弥斯托斯·普莱顿在米斯特拉斯复兴的新柏拉图学派，以及贝萨里翁等希腊人文主义者架起的希拉学术桥梁。北方罗斯则在佛罗伦萨合一引发争议后于1448年由莫斯科教会自主推选都主教，并于1589年获君士坦丁堡承认升格为莫斯科牧首区。"
 oe_lde_rel_safavid_school_desc: "从1334年萨菲丁去世到1501年伊斯玛仪一世称沙阿，阿尔达比勒萨非教团完成了由和平的逊尼派苏菲修行团体向武装什叶派王朝的剧烈蜕变。土库曼奇兹尔巴什部众尊奉教团首领为兼领精神导师与尘世君权的“完美导师”，将宗教热忱转化为横扫伊朗高原与高加索的军事力量。"
 oe_lde_rel_shia_desc: "伊朗什叶化的关键力量源自阿塞拜疆阿尔达比勒的萨非教团：它早年本是遵奉沙斐仪学派的逊尼派苏菲教团，15世纪在谢赫朱奈德与海达尔领导下逐步转向武装化的十二伊玛目什叶派，并吸纳安纳托利亚与阿塞拜疆的土库曼部落结成头戴红帽的“奇兹尔巴什”。1501年伊斯玛仪一世借这股力量攻取大不里士立国，彻底重塑了近东的教派版图。"
