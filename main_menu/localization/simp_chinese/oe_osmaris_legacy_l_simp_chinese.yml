 oe_byz_constantinople_manuel_academy: "曼努埃尔军事学院"
 oe_byz_constantinople_manuel_academy_desc: "城墙区的校舍保存着曼努埃尔留下的操练手稿。军官在此研习行军、扎营与临敌变阵，使一人的经验成为帝国军队共同的学问。\n每级全国训练度#G +1%#!，最高#Y 5级#!。每次扩建花费国库#R 2000#!金币，基础工期#Y 365天#!。\n\n$OE_ACADEMY_ARMY_SCORE_100$"
 oe_city_manuel_academy_maintenance: "曼努埃尔军事学院"
 oe_byz_constantinople_osman_company: "奥斯曼公司"
 oe_byz_constantinople_osman_company_desc: "金角湾港区的商馆仍悬挂红底金色星月旗。它承接奥斯马里斯家的商路、船舶与货栈，让散布各地的买卖汇入同一套账册。\n每级贸易容量#G +1#!、全国出口效率#G +1%#!；君士坦丁堡属于东罗马时，奥斯马里斯豪族每月影响力#G +0.2#!。最高#Y 10级#!。每次扩建花费国库#R 1000#!金币，基础工期#Y 365天#!。"
 oe_city_osman_company_maintenance: "奥斯曼公司"
 oe_flavor_byz.1009.t: "奥斯马里斯：不息的号令"
 oe_flavor_byz.1009.d: "（原名：穆拉德一世）\n\n曼努埃尔已经离世，校场上却仍能听见他教过的号令。老军官们整理他的手稿，将散在各营的训练规程抄写成册。有人记得他纠正新兵握矛时的耐心，也有人仍会为他近乎苛刻的军纪摇头；说到最后，他们都承认，这些经验不该随其主人一同埋葬。\n\n御前因此收到一份联名呈请：在君士坦丁堡的城墙区设立军事学院，让年轻军官在同一处学习阵法、营务和军中责任。以曼努埃尔之名立校，既是纪念，也是将他的事业交给后来之人。"
 oe_flavor_byz.1009.a: "让他的学问继续守护帝国。"
 oe_flavor_byz.1009.a.tt: "在君士坦丁堡#Y 城墙区#!解锁#Y 曼努埃尔军事学院#!，立即免费建成#G 1级#!。\n每级全国训练度#G +1%#!，最高#Y 5级#!；每次扩建#R 2000#!金币，基础工期#Y 365天#!。"
 oe_flavor_byz.1009.historical_info: "历史上的穆拉德一世是奥斯曼君主，1389年在科索沃战役期间身亡。以曼努埃尔之名在东罗马任教及其身后的军事学院，均为本模组的架空设定。"
 oe_osmaris_constantine_name: "君士坦丁"
 oe_osmaris_good: "好人"
 oe_flavor_byz.1010.t: "奥斯马里斯：好人君士坦丁"
 oe_flavor_byz.1010.d: "（原名：穆罕默德一世）\n\n巴西尔留下的账册曾经厚得令人羡慕，如今却成了奥斯马里斯家最沉重的负担。接连失事的商船带走了货物与预付的银钱；继承人争执船份、货栈与欠契，远方的代理则各自观望。那张横贯帝国的商路，眼看就要被债务与家族争端撕成碎片。\n\n君士坦丁没有追问谁该先为灾祸负责。他逐一拜访债主，为欠薪的水手筹集口粮，劝亲族暂缓分产，把还能出海的船只重新装满。他的衣袍已改作罗马式样，商馆中却依旧悬着家传的红底金色星月旗；在这面旗帜下，他坚持先让所有人活过眼前的难关。正因如此，受过他照应的人开始称他为“好人”。\n\n但善意不能独自填平账上的窟窿。他带着重整商路的计划来到御前，恳请内廷给予一笔周转资金。若能保住货栈、船队与信用，这个濒临破产的商业家业，仍有重新站稳的一天。"
 oe_flavor_byz.1010.a: "我们会帮助奥斯马里斯。"
 oe_flavor_byz.1010.a.tt: "内帑支出#R 六个月收入#!，合计#R [SCOPE.GetValue('oe_osmaris_aid_cost')|2]#!金币。\n权威#G +2#!。\n$oe_osmaris_house_reward_50_tt$\n#Y 五年后#!触发“奥斯马里斯投资的回报”，内帑获得届时#G 二十四个月收入#!。"
 oe_flavor_byz.1010.b: "他们得自己度过难关。"
 oe_flavor_byz.1010.b.tt: "$oe_osmaris_house_reward_50_tt$"
 oe_flavor_byz.1010.lapsed: "这份援助请求已无法照办。"
 oe_flavor_byz.1010.lapsed.tt: "人物或家族状态已经改变，不扣除内帑，也不发放奖励。"
 oe_flavor_byz.1010.historical_info: "穆罕默德一世是巴耶济德一世之子，在奥斯曼王朝因安卡拉战败而陷入的继承内战中胜出，于1413—1421年统治重新统一的奥斯曼国家。他致力于恢复秩序与王朝权威。君士坦丁重整家族商业的经历，是对其历史角色的架空改写。"
 oe_flavor_byz.1011.t: "奥斯马里斯投资的回报"
 oe_flavor_byz.1011.d: "五年前交付的那笔周转资金，如今随新的账册回到了内廷。奥斯马里斯家的商馆重新付清了到期的债务，修复的船只恢复航行，曾经各自观望的代理也再次接受同一套账房的调度。红底金色星月旗又出现在满载货物的桅杆之间。\n\n君士坦丁主持的重整终于结出成果。公司的代表呈上内廷应得的回报：当年用于维系信用的钱，已经转化为新的货物、航次与盈余。账册最后一页留给皇帝亲自验收。"
 oe_flavor_byz.1011.a: "信任并未落空。"
 oe_flavor_byz.1011.a.tt: "内帑获得#G 二十四个月收入#!，合计#G [SCOPE.GetValue('oe_osmaris_return_amount')|2]#!金币。"
 oe_flavor_byz.1011.historical_info: "历史上的穆罕默德一世结束了奥斯曼王朝的继承内战，恢复了分裂国家的统一。本事件借用“重整家业”的主题，描绘架空的商业复苏与投资回报。"
