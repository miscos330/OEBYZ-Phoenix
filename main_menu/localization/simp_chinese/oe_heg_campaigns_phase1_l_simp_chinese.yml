 oe_hc_egypt_declare: "宣布征伐埃及"
 oe_hc_egypt_declare_desc: "花费#R 1000#!金币（复兴狂热消沉时#R 1500#!）与#R 10#![oe_tu_authority|e]，对首都位于埃及、且不属于帝国及其附庸的所有国家宣战，并开启“埃及征伐”战役。战役期间，帝国一方攻下的非首都城镇直接归帝国所有。同一时间只能进行一场征伐。\n\n$oe_tsn_pv_2$"
 oe_hc_egypt_pay: "拨付埃及军饷"
 oe_hc_egypt_pay_desc: "花费#R 300#!金币，战争压力#G −15#!。冷却#Y 6#!个月。"
 oe_hc_egypt_peace: "埃及议和收兵"
 oe_hc_egypt_peace_desc: "战役进度不低于#Y 40#!时可用。结束所有征伐战争，已得土地保留，奖励少于大胜。"
