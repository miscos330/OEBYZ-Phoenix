 oe_hc_egypt: "埃及征伐"
 oe_hc_egypt_desc: "帝国的军团正在埃及作战。\n\n战役进度：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_egypt_progress').GetValue|0]#!　战争压力：#R [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_egypt_pressure').GetValue|0]#!　已历 [GetCountry('BYZ').MakeScope.GetVariable('oe_hc_egypt_months').GetValue|0] 个月\n\n进度达到#Y 80#!即大胜；进度不低于#Y 40#!时可以议和收兵；压力达到#Y 100#!即败退；满#Y 10#!年按当时进度结算。"
