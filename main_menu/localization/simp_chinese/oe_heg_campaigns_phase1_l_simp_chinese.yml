 STATIC_MODIFIER_NAME_oe_hc_grain_ships: "粮船重开"
 STATIC_MODIFIER_NAME_oe_hc_romanization: "罗马化"
 STATIC_MODIFIER_NAME_oe_hc_coptic_conversion: "强制改宗"
 STATIC_MODIFIER_NAME_oe_hc_apulian_greeks: "阿普利亚希腊人"
 oe_hc.1.a: "加派工匠与攻城器械（#Y 200#!金币，进度#G +5#!）"
 oe_hc.1.b: "继续围困（压力#R +5#!）"
 oe_hc.1.t: "围城僵持"
 oe_hc.1.d: "前线战报传来，敌军要塞的石筑壁垒与深壕远比工兵先前勘察的更为坚固。连续数周的炮击与坑道掘进收效甚微，连绵阴雨灌满战壕，军粮渐渐见底，漫长而枯燥的围城战令营中士卒怨声渐起，亟需增派巧匠与重型攻城器械破局。"
 oe_hc.2.a: "隔离营地（人力#R −2#!，压力#G −5#!）"
 oe_hc.2.b: "照常行军（压力#R +10#!）"
 oe_hc.2.t: "营中疫病"
 oe_hc.2.d: "连日酷暑与污浊水源令凶猛的热病在拥挤的军营帐篷间骤然蔓延，染疫士卒高烧不退、成批倒下，减员速度甚至超过正面交锋。随军医师联名向大营紧急请命，请求立刻划界隔离整片染疫营区，否则这场营中瘟疫恐将彻底拖垮整支远征大军。"
 oe_hc.3.a: "付钱换取中立（#Y 300#!金币）"
 oe_hc.3.b: "拒绝（压力#R +10#!；#Y 30%#!该国加入敌方）"
 oe_hc.3.t: "外国干预"
 oe_hc.3.d: "一个区外强国的使节抵达营中，表示其主君“关切”这场战争，并暗示可以保持中立——只要价钱合适。"
 oe_hc.4.a: "从国库补发（#Y 200#!金币，压力#G −10#!）"
 oe_hc.4.b: "许诺战后分赏（压力#R +5#!，威望 −轻微）"
 oe_hc.4.t: "军饷拖欠"
 oe_hc.4.d: "由于后方转运受阻、战费浩繁，前线将士的军饷已整整拖欠三个月，分文未见。营中鞋袜破烂、口粮掺糠，士气日趋低落，各团军官终于联名向御前上书陈情：若朝廷再不设法补发欠饷，只怕再严明的军法也难以弹压濒临哗变的将士。"
 oe_hc.11.a: "君士坦丁堡将不再挨饿（粮食修正#Y 10#!年，压力#G −10#!）"
 oe_hc.11.t: "粮船重开"
 oe_hc.11.d: "亚历山大港的灯塔与石砌码头上，帝国双头鹰战旗迎风猎猎招展。历经数百年沧桑阻隔，满载尼罗河三角洲金黄麦粮的庞大运粮船队终于再度扬帆北上，乘着顺风驶向金角湾；君士坦丁堡的粮仓重得活水，千年古都将不再受饥馑威胁。"
 oe_hc.12.a: "宽容科普特教会（进度#G +5#!，压力#G −5#!）"
 oe_hc.12.b: "推行正教（新得地点改宗加快#Y 20#!年，压力#R +10#!）"
 oe_hc.12.t: "科普特人"
 oe_hc.12.d: "埃及的科普特教会在异族统治下熬过了几百年，他们在观望：新来的罗马人会宽容他们，还是又一次强迫他们改宗？"
 oe_hc.13.a: "等待水退（压力#R +5#!）"
 oe_hc.13.b: "冒险抢渡（一半机会进度#G +8#!，否则压力#R +10#!）"
 oe_hc.13.t: "尼罗河水位"
 oe_hc.13.d: "熟悉水文的当地向导策马急报：今年尼罗河上游汛期来得比往年早得多，浑浊的河水正迅速漫过浅滩与堤岸，原本可涉水而过的渡口很快将被洪流吞没。大军此刻进退维谷，究竟是扎营静待秋后水退，还是趁水位未满冒险强渡，全凭主将决断。"
 oe_hc.21.a: "与部族结盟（#Y 300#!金币，压力#G −10#!）"
 oe_hc.21.b: "讨伐部族（进度#G +5#!，压力#R +10#!）"
 oe_hc.21.t: "柏柏尔部族"
 oe_hc.21.d: "几支纵横北非内陆的柏柏尔部族遣使骑骆驼来到帝国大营外求见。这些熟谙荒漠绿洲、隐秘水井与山谷小道的部族首领表示，只要罗马先将真金白银点清交付，他们便愿充当大军向导，并提供大批耐旱骆驼与沿途水源补给，助帝国深入腹地。"
 oe_hc.22.a: "沿途修建水站（#Y 200#!金币，压力#G −5#!）"
 oe_hc.22.b: "强行军（进度#G +5#!，人力#R −2#!）"
 oe_hc.22.t: "沙漠补给线"
 oe_hc.22.d: "随着军团步步深入北非内陆、远离地中海沿岸港埠，补给车队在烈日炙烤的荒原与干涸河谷间越拉越长。驮马接连倒毙，干粮与淡水日渐告罄，后勤押运队屡遭风沙与游骑袭扰，每一囊清水都比金币更加珍贵，前锋推进已显露疲态。"
 oe_hc.23.a: "在旧港立碑纪念（威望增加，压力#G −10#!）"
 oe_hc.23.t: "迦太基旧港"
 oe_hc.23.d: "突尼斯城外的金色海岸线在阳光下铺展，帝国军团的旗帜终于重临当年贝利撒留率军登陆、光复阿非利加的古老滩头。俯瞰迦太基旧港残存的防波堤与石柱，将士们无不肃然起敬，千年罗马荣光仿佛在这一刻重回北非大地。"
 oe_hc.31.a: "与教宗和解，以保护者身份入城（正统性增加，进度#G +5#!）"
 oe_hc.31.b: "以罗马皇帝身份强行入城（威望大增，压力#G −10#!，稳定度#R −1#!）"
 oe_hc.31.t: "罗马之钥"
 oe_hc.31.d: "历经数百年风云变幻，古老的奥勒良城墙大门终于向帝国军团缓缓敞开，罗马城重见紫袍与鹰旗。教宗特使自梵蒂冈匆匆出迎，在城门前郑重叩问：陛下此番入主永恒之城，究竟是作为教会尊贵的保护者和平临幸，还是以无上罗马皇帝之尊君临旧都？"
 oe_hc.32.a: "付#Y 500#!金币换取威尼斯中立"
 oe_hc.32.b: "拒绝，威尼斯封锁补给（压力#R +15#!）"
 oe_hc.32.t: "威尼斯舰队"
 oe_hc.32.d: "飘扬着圣马可飞狮旗的威尼斯战舰群正在亚得里亚海窄道上来回游弋，如影随形地监视着我军沿海补给船队。共和国使者随即登门拜会，言辞婉转地表示威尼斯愿意“保证海上航道畅通无阻”——前提是帝国先奉上一笔数目可观的酬金。"
 oe_hc.33.a: "重建拜占庭的意大利（进度#G +5#!，阿普利亚同化加快#Y 20#!年）"
 oe_hc.33.t: "南意希腊人"
 oe_hc.33.d: "巴里与阿普利亚一带世代通行希腊语的沿海城镇听闻王师逼近，不等攻城器械抵近便自发敞开城门。年迈的乡绅与正教神父捧着圣像出城相迎，高呼皇帝圣名，迎接阔别数个世纪的帝国军团重返昔日的南意督军区故土。"
 oe_hc.41.a: "以长枪方阵迎击（进度#G +5#!，压力#R +5#!）"
 oe_hc.41.b: "避其锋芒，坚守营垒（压力#G −5#!，进度#R −3#!）"
 oe_hc.41.t: "法兰克骑士"
 oe_hc.41.d: "法兰西的贵族重骑兵在原野上排开密不透风的冲击横队，战马披挂精钢马甲，长枪如林。这种势如雷霆的密集冲锋正是他们数百年来威震西欧的立身之本，也是引以为傲的王牌战法；前锋将领急请御前定夺破阵方略。"
 oe_hc.42.a: "接受调停（压力#G −10#!，进度#R −5#!）"
 oe_hc.42.b: "拒绝，帝国无需拉丁教宗裁决（进度#G +5#!，压力#R +5#!）"
 oe_hc.42.t: "教宗的调停"
 oe_hc.42.d: "远在阿维尼翁的教宗派出红衣特使赶赴前线大营，宣称愿以西方教会领袖之尊在帝国与法兰西诸侯之间居中斡旋、促成停战。接纳调停虽可暂缓兵锋、减轻军中疲惫，却难免在西欧诸邦眼中抬高拉丁教廷的裁断之权。"
 oe_hc.43.a: "在西岱岛举行感恩礼拜（威望增加，压力#G −10#!）"
 oe_hc.43.t: "卢泰西亚"
 oe_hc.43.d: "塞纳河畔的巴黎城门在帝国战鼓声中洞开，铁骑与步兵沿古老石道开入西岱岛。距罗马军团上一次统治这片高卢腹地已逾千年，彼时这座河流要冲还被铭刻在帝国行省版图之上，称作卢泰西亚；如今双头鹰旗再度高悬于旧日名城上空。"
 oe_hc.51.a: "接受（进度#G +5#!，压力#G −5#!，威望 −轻微）"
 oe_hc.51.b: "拒绝，异教徒同样是敌人（压力#R +5#!）"
 oe_hc.51.t: "马林王朝的使节"
 oe_hc.51.d: "非斯的马林王朝苏丹派来使节：只要帝国承认他在海峡两岸的利益，他愿意渡海出兵，从南方牵制卡斯蒂利亚。"
 oe_hc.52.a: "沿河谷修建补给站（#Y 200#!金币，压力#G −5#!）"
 oe_hc.52.b: "就地征粮（进度#G +5#!，压力#R +5#!）"
 oe_hc.52.t: "梅塞塔高原"
 oe_hc.52.d: "深入卡斯蒂利亚腹地的梅塞塔高原后，军团领教了伊比利亚内陆的严酷风土：盛夏烈日灼石、滴水难寻，寒冬朔风刺骨、道路冰封。随着战线不断西推，后方补给车队在荒凉台地上越拉越长，粮草与马料转运愈发捉襟见肘。"
 oe_hc.53.a: "完成查士丁尼未竟之业（威望增加，进度#G +5#!）"
 oe_hc.53.t: "西哥特旧都"
 oe_hc.53.d: "扼守塔霍河高崖的托莱多城终于降下敌旗，向帝国军团献城归顺。这座巍峨石城曾是西哥特王国的荣耀旧都，当年查士丁尼大帝派出的西征远征军虽收复贝提卡海岸，终究未能踏足此地；今日将士终于完成了先帝未竟的伊比利亚伟业。"
 oe_hc.61.a: "以重骑兵强行冲阵（进度#G +5#!，人力#R −2#!）"
 oe_hc.61.b: "稳扎稳打，步步为营（压力#R +5#!）"
 oe_hc.61.t: "长弓手"
 oe_hc.61.d: "不列颠原野上骤然响起尖锐破空之声，英格兰长弓手依托木桩与坡地倾泻出遮天蔽日的漫天箭雨。紫杉长弓射程惊人、穿透力极强，我军前锋转眼间伤亡惨重、阵脚受挫；中军大帐内诸将眉头紧锁，正在激烈商讨下一步破敌之策。"
 oe_hc.62.a: "加价雇用商船（#Y 200#!金币，压力#G −5#!）"
 oe_hc.62.b: "等待风停（压力#R +10#!）"
 oe_hc.62.t: "海峡风暴"
 oe_hc.62.d: "英吉利海峡风云突变，狂风卷起数丈巨浪，将我军横渡海峡的运兵船队吹得七零八落。虽未酿成覆灭大祸，后续满载军粮、马料与箭矢的补给船队却全数被迫滞留对岸港湾，前线营垒眼看就要面临断粮断械之险。"
 oe_hc.63.a: "罗马回来了（威望大增，压力#G −10#!）"
 oe_hc.63.t: "伦迪尼乌姆"
 oe_hc.63.d: "泰晤士河畔的伦敦城门敞开，帝国旗帜在古老城墙与塔楼之上迎风舒展。自西罗马末世军团奉诏撤离不列颠行省以来，已经过去了九百余年；这座昔日名为伦迪尼乌姆的帝国边陲重镇，如今终于再度回到罗马皇帝的版图之中。"
 oe_hc.71.a: "效法希拉克略，长驱直入（进度#G +8#!，压力#R +10#!）"
 oe_hc.71.b: "稳步推进（压力#G −5#!）"
 oe_hc.71.t: "希拉克略的先例"
 oe_hc.71.d: "面对盘踞两河与高原的波斯强敌，营中熟读史书的将领纷纷提起希拉克略大帝的辉煌先例：公元627年，他毅然越过险峻的扎格罗斯山脉，孤军直捣萨珊帝国腹地，一战粉碎宿敌主力而定乾坤。如今诸将请示，究竟是效法先帝长驱直入，还是稳扎稳打步步推进。"
 oe_hc.72.a: "接受（#Y 200#!金币，进度#G +5#!，压力#G −5#!）"
 oe_hc.72.b: "婉拒"
 oe_hc.72.t: "亚美尼亚人"
 oe_hc.72.d: "熟悉高原关隘与山谷通道的亚美尼亚各家贵族派使者前来军营接洽。他们表示愿意为帝国军团充当向导，并派出精熟山地作战的本土骑兵协同出击，唯一的条件是战后帝国必须承认并保留他们在高加索与高原各处的世袭领地。"
 oe_hc.73.a: "在泰西封废墟前检阅军团（威望大增，进度#G +5#!）"
 oe_hc.73.t: "泰西封故地"
 oe_hc.73.d: "底格里斯河畔的名城巴格达已尽数归于帝国掌控，军团旗帜在城头林立。顺着河谷往南行不过数里，便是萨珊波斯旧都泰西封那座高耸残破的拱门废墟；站在历代罗马皇帝梦寐以求的东方极点前，全军上下无不豪情激荡。"
 oe_hc.81.a: "雇用热那亚船队（#Y 300#!金币，压力#G −10#!）"
 oe_hc.81.b: "征用商站存粮（金币#G +200#!，压力#R +5#!）"
 oe_hc.81.t: "热那亚商站"
 oe_hc.81.d: "驻扎克里米亚卡法港的热那亚商站大班派人赶到军营，表示愿动用他们熟谙黑海风浪的商船队为远征军抢运粮草与干鱼。这群精明的利古里亚商人开出的运费与包船价码着实不菲，然黑海北岸补给维艰，是破费雇船还是强征其存粮，须速作权衡。"
 oe_hc.82.a: "赠送圣像与金币（#Y 200#!金币，进度#G +5#!）"
 oe_hc.82.b: "不必依赖他们（压力#R +5#!）"
 oe_hc.82.t: "罗斯诸公"
 oe_hc.82.d: "尽管山河阻隔、草原强敌环伺，基辅都主教至今仍由君士坦丁堡普世牧首区祝圣任命，同宗同源的东正教纽带始终未断。听闻罗马军团进军黑海北岸，罗斯诸公中颇有胸怀远志者暗中遣使联络，愿在辽阔草原上出兵策应帝国征伐。"
 oe_hc.83.a: "重开草原商路（威望增加，压力#G −10#!）"
 oe_hc.83.t: "塔奈斯"
 oe_hc.83.d: "扼守顿河入海口的贸易重镇塔纳已落入帝国掌控，双头鹰旗在亚速海畔的木石城垒上高高升起。早在大殖民时代，古希腊商旅便称这里为塔奈斯，将其视作通往东方大草原与丝绸商路的极北尽头；如今这座黄金咽喉重归罗马之手。"
 oe_hc.91.a: "雇用向导（#Y 300#!金币，压力#G −10#!）"
 oe_hc.91.b: "自行寻路（进度#G +5#!，人力#R −2#!）"
 oe_hc.91.t: "贝都因向导"
 oe_hc.91.d: "几支世居阿拉伯大漠边缘的贝都因部族遣使骑驼来到帝国营门外。他们熟知红海与内陆荒漠间每一口暗井、绿洲与隐秘沙谷的方位，表示只要陛下赏下丰厚金币，便愿引路护航，使大军免于在滚烫黄沙中迷途渴毙。"
 oe_hc.92.a: "租船走红海（#Y 300#!金币，压力#G −10#!）"
 oe_hc.92.b: "坚持陆路行军（压力#R +5#!）"
 oe_hc.92.t: "红海航线"
 oe_hc.92.d: "面对阿拉伯半岛酷热难当的无垠戈壁，参谋官与埃及港务官联名献策：与其令重装步骑顶着烈日强穿荒漠、白白损耗人马，不如在埃及红海沿岸租用熟悉季风与暗礁的商船，直接沿红海航道向南投送兵力与军粮。"
 oe_hc.93.a: "保护圣城，严禁劫掠（稳定度#G +1#!，进度#G +5#!）"
 oe_hc.93.b: "以征服者身份入城（威望大增，压力#R +10#!）"
 oe_hc.93.t: "圣城"
 oe_hc.93.d: "帝国铁骑踏破汉志险关，圣城麦加的城门已在王师面前洞开，消息如雷霆般震动四方。从安达卢斯到印度洋沿岸，整个伊斯兰世界此刻都在屏息凝望，看罗马皇帝究竟会严令护城禁掠以示宽仁，还是以胜利征服者之姿傲然入城。"
 oe_hc.100.a: "愿上帝护佑罗马"
 oe_hc.100.t: "征伐开始"
 oe_hc.100.d: "宣战诏书已在广场与军营前高声宣读，号角齐鸣，各路军团整肃旗帜、踏上漫漫远征之途。此番跨区征伐胜负攸关国运，战役实时进度、前线战果与后方战争压力皆可在罗马世界面板的对应战区栏内随时查核统筹。"
 oe_hc.101.a: "胜利属于罗马（威望大增、帝国权威#G +15#!、稳定度#G +1#!）"
 oe_hc.101.t: "征伐大胜"
 oe_hc.101.d: "敌军主力在连番决战中彻底崩溃，残部弃甲溃逃，沿途重镇与要塞纷纷望风归降。双头鹰战旗已插遍这片曾属古罗马的广袤疆土，帝国的辉煌大胜无可争议，整场地区征伐终于迎来震古烁今的凯旋时刻。"
 oe_hc.102.a: "保住所得（威望增加、帝国权威#G +5#!）"
 oe_hc.102.t: "议和收兵"
 oe_hc.102.d: "连年征伐令交战双方均已筋疲力尽，国库消耗甚巨，前线士卒亦思归心切。两国使节终在边境营帐内签署停战和约：帝国牢牢保住了战役期间攻克的新附土地与战略要隘，主力军团则按约整队凯旋休整。"
 oe_hc.103.a: "来日方长（威望损失、稳定度#R −1#!）"
 oe_hc.103.t: "征伐败退"
 oe_hc.103.d: "军中再也撑不下去，将军们下令撤退。已经得到的土地仍在帝国手中，但十年内无法再对这里发动征伐。"
 oe_hc.110.t: "新土治理"
 oe_hc.110.d: "硝烟渐散，此番远征新近收复的广袤土地正等待清晰的统治章程。朝中诸臣各陈方略：既可耗费帝国威权将其编为新设军区，也可强力推行罗马化教化以同化旧民，或干脆交由罗马同盟诸邦代为经略，全凭陛下权衡定夺。"
 oe_hc.110.a: "设立军区（#Y 5#!帝国权威）"
 oe_hc.110.a.tt: "在新得的最大城市设立军区，治所之外的新得地点都设为该军区的治所辖地；远近档按到君士坦丁堡的距离计算。新军区的地位为[oe_tu_exarchate|e]，每月把一成收入上缴国库。"
 oe_hc.110.b: "推行罗马化（稳定度#R −1#!）"
 oe_hc.110.b.tt: "新得地点#Y 20#!年内同化加快、改宗加快。"
 oe_hc.110.c: "交给罗马同盟（威望增加）"
 oe_hc.110.c.tt: "以新得的最大城市为首都建立一个罗马同盟附庸，其余新得地点一并交给它。"
