# NEW 2026-11-23 v21.0 Fourth Rome (ELR / Nova Elysia) Deepening (oe_el4_). Generated by gen_v210_fourth_rome.py.
 oe_elysian_senate:0 "极乐新罗马元老院"
 oe_elysian_senate_desc:0 "设立于新君士坦丁堡的第四罗马最高审议机构，囊括贵族、教士、海商市民与边疆自由农四大阶层，并享有在新大陆乡村领地自由召开议会的宪政特权。"
 oe_el4_parl_chesapeake_estates:0 "《切萨皮克庄园封地法》"
 oe_el4_parl_chesapeake_estates_desc:0 "经极乐元老院勘定切萨皮克诸河谷庄园封地，稳固流亡贵族忠诚、行省控制度与常年田赋岁入。"
 oe_el4_parl_appalachian_themes:0 "《阿巴拉契亚边防军区法》"
 oe_el4_parl_appalachian_themes_desc:0 "沿蓝岭与阿巴拉契亚山口设立世袭边防军区，强化要塞守备、边疆兵源征募与堡垒维持效率。"
 oe_el4_parl_western_silk_guild:0 "《西海丝绸行会特许状》"
 oe_el4_parl_western_silk_guild_desc:0 "向切萨皮克桑蚕丝坊与商团颁授帝国专营印记，提振西海丝绸商利、商人势力与市民满意度。"
 oe_el4_parl_atlantic_marine_insurance:0 "《大西洋远洋商船保险法》"
 oe_el4_parl_atlantic_marine_insurance_desc:0 "由元老院背书设立大西洋商船互助保险金，共担风暴与私掠风险，大幅提升海贸效率、商人运力与海上控制力。"
 oe_el4_parl_new_rome_patriarchate_code:0 "《新罗马大牧首区法典》"
 oe_el4_parl_new_rome_patriarchate_code_desc:0 "统一极乐新罗马诸教区的圣堂田产、教区法曹与边疆传教规程，提升宗教威望、宣教效率与教士阶层拥护。"
 oe_el4_parl_asclepius_hospice_act:0 "《阿斯克勒庇俄斯救济院法案》"
 oe_el4_parl_asclepius_hospice_act_desc:0 "由元老院与教会共同出资兴建沿海检疫港与阿斯克勒庇俄斯救济院，强力抵御美洲风土疫病并护持人口增长。"
 oe_el4_parl_freeholder_homestead_act:0 "《新大陆自由农授田法》"
 oe_el4_parl_freeholder_homestead_act_desc:0 "向在波托马克与詹姆斯河谷拓荒定居的农家颁授永业田契，提振农民阶层满意度、边疆移民活力与粮食产量。"
 oe_el4_parl_maize_wheat_agronomy:0 "《美洲玉米—小麦混作推广令》"
 oe_el4_parl_maize_wheat_agronomy_desc:0 "向各郡颁行地中海冬麦与美洲玉米、豆类轮作农书，令切萨皮克粮仓丰实、人口稳步繁衍。"
 oe_el4_pa_nobles_senatorial_stipend:0 "敕赐元老边疆庄园禄米"
 oe_el4_pa_nobles_senatorial_stipend_simple:0 "元老边疆禄米"
 oe_el4_pa_nobles_senatorial_stipend_desc:0 "流亡世家议员要求在五年内优恤其边疆庄园赋额以换取元老院赞成票，可迅速拉升支持度与贵族满意度。"
 oe_el4_pa_burghers_harbor_tariff_rebate:0 "核准切萨皮克港关税减免"
 oe_el4_pa_burghers_harbor_tariff_rebate_simple:0 "海港关税减免"
 oe_el4_pa_burghers_harbor_tariff_rebate_desc:0 "切萨皮克海商行会愿在元老院大力支持当前法案，条件是五年内放宽港埠关税上限并扩增商人权限。"
 oe_el4_pa_burghers_shipyard_charter:0 "颁行海商船坞林木特许"
 oe_el4_pa_burghers_shipyard_charter_simple:0 "船坞林木特许"
 oe_el4_pa_burghers_shipyard_charter_desc:0 "海商船匠请求特许采伐沿岸橡木以扩建船台，换取市民代表在元老院投下赞成票。"
 oe_el4_pa_clergy_monastic_glebe:0 "确认新大陆修院教产豁免"
 oe_el4_pa_clergy_monastic_glebe_simple:0 "修院教产豁免"
 oe_el4_pa_clergy_monastic_glebe_desc:0 "教士议员承诺全力支持当前议案，条件是五年内保全美洲修道院田产的免税特权并资助教区文教。"
 oe_el4_pa_clergy_hospice_tithe:0 "拨款资助救济院与抄经馆"
 oe_el4_pa_clergy_hospice_tithe_simple:0 "救济院与抄经馆拨款"
 oe_el4_pa_clergy_hospice_tithe_desc:0 "教会与医官团恳请国库拨付专款扶持港口救济院与抄经馆，以换取教士阶层支持并增强抗疫力。"
 oe_el4_pa_peasants_frontier_tax_holiday:0 "颁布边疆垦荒免赋期"
 oe_el4_pa_peasants_frontier_tax_holiday_simple:0 "边疆垦荒免赋"
 oe_el4_pa_peasants_frontier_tax_holiday_desc:0 "自由农代表要求给予新垦田园五年免赋期以换取农民阶层赞成票，可稳定提升粮食供给与乡间满意度。"
 oe_el4_pm_chesapeake_oak_shipwrights:0 "切萨皮克橡木造船工坊"
 oe_el4_pm_chesapeake_oak_shipwrights_desc:0 "利用切萨皮克丰饶橡木、松焦油与麻绳赶制远洋船材与索具，奠定新罗马早期海贸与造船经济基石。"
 oe_el4_pm_copper_sheathed_rigging:0 "覆铜远洋船材精作"
 oe_el4_pm_copper_sheathed_rigging_desc:0 "以美洲红铜薄板与精良工具包覆船壳，打造耐蚀远洋船材以支撑泛大西洋航线与舰队补给。"
 oe_el4_pm_appalachian_iron_steel:0 "阿巴拉契亚高炉冶钢"
 oe_el4_pm_appalachian_iron_steel_desc:0 "依托阿巴拉契亚铁矿与煤炭进行高炉冶炼，产出坚韧钢材供应船锚、火炮与边疆筑城。"
 oe_el4_pm_chesapeake_refined_steel:0 "切萨皮克坩埚精炼钢"
 oe_el4_pm_chesapeake_refined_steel_desc:0 "将美洲生铁、精铜与煤炭入炉二次精炼，锻造对接帝国战略物资体系的高品质精炼钢。"
 oe_el4_chesapeake_shipwright_guild:0 "切萨皮克造船行会"
 oe_el4_chesapeake_shipwright_guild_desc:0 "极乐新罗马自建国初期即可兴建的沿海造船行会，融合拜占庭造舰工艺与弗吉尼亚橡木资源，为切萨皮克市场提供稳健海贸与造船托底。"
 oe_el4_appalachian_foundry:0 "阿巴拉契亚帝国钢铁铸造厂"
 oe_el4_appalachian_foundry_desc:0 "随大航海时代高炉冶金解锁的新大陆重工业核心，将阿巴拉契亚铁铜矿脉转化为精炼钢战略物资，全面对接帝国工业闭环。"
 oe_el4_adv_chesapeake_akritai:0 "切萨皮克边防戍卫军制"
 oe_el4_adv_chesapeake_akritai_desc:0 "将拜占庭边防阿克里泰戍卫传统移植至切萨皮克木栅与要塞防线，解锁切萨皮克边防戍卫步兵。"
 oe_el4_adv_elysian_dromon:0 "极乐巡海德罗蒙战舰工艺"
 oe_el4_adv_elysian_dromon_desc:0 "结合切萨皮克浅水湾地貌改良古典罗马德罗蒙桨帆战舰，解锁极乐巡海德罗蒙战舰。"
 oe_el4_adv_algonquin_peltasts:0 "阿尔冈昆协从轻步兵操典"
 oe_el4_adv_algonquin_peltasts_desc:0 "融汇古希腊轻盾投枪阵与阿尔冈昆林地游击伏击战术，解锁阿尔冈昆协从轻步兵。"
 oe_el4_adv_atlantic_ironclad:0 "大西洋希腊火蒸汽铁甲舰"
 oe_el4_adv_atlantic_ironclad_desc:0 "将切萨皮克精炼钢装甲、革命时代蒸汽锅炉与高压希腊火喷射管合为一体，解锁大西洋希腊火蒸汽铁甲舰。"
 oe_el4_chesapeake_akritai:0 "切萨皮克边防戍卫步兵"
 oe_el4_chesapeake_akritai_desc:0 "第一时代极乐专属重装边防步兵，承袭拜占庭阿克里泰传统，擅守木栅堡垒与新大陆河谷要隘。"
 oe_el4_elysian_dromon:0 "极乐巡海德罗蒙战舰"
 oe_el4_elysian_dromon_desc:0 "第一时代极乐专属巡海桨帆战舰，吃水浅而航速捷，专事切萨皮克湾巡弋与近海护航。"
 oe_el4_algonquin_peltasts:0 "阿尔冈昆协从轻步兵"
 oe_el4_algonquin_peltasts_desc:0 "文艺复兴时代极乐专属林地轻步兵，兼具罗马军纪与原住民丛林游击专长，在北美森林与湿地战力卓著。"
 oe_el4_atlantic_ironclad:0 "大西洋希腊火蒸汽铁甲舰"
 oe_el4_atlantic_ironclad_desc:0 "革命时代极乐巅峰蒸汽铁甲主力舰，披挂精炼钢重甲并搭载重炮与高压希腊火，纵横大西洋无敌手。"
 oe_el4_human_only_tt:0 "由玩家国家操控"
 oe_el4_dec_restore_senate.title:0 "重开极乐元老院与清理部族旧制"
 oe_el4_dec_restore_senate.desc:0 "面向极乐新罗马与既有存档的零冷却应急宪政修复决议：立即将议会切换为可召开乡村议会的《极乐新罗马元老院》并绑定首都驻地，彻底清除残留部落改革与特权，恢复四大阶层满意度并补齐对应档位的七十五年平滑经济过渡修正。"
 oe_el4_dec_restore_senate.a:0 "重开极乐元老院，彻底肃清部族残毒。"
 oe_el4_dec_restore_senate_tt:0 "将议会切换为 #Y 极乐新罗马元老院#!并绑定首都，清除全部残留部落改革与特权，恢复阶层满意度并启用对应建国经济过渡档位。"
 oe_el4_dec_foederati_border_charter.title:0 "颁行罗马边民同盟宪章"
 oe_el4_dec_foederati_border_charter.desc:0 "仿效古典罗马盟邦之制，将境内原住民部落纳入边民同盟宪章：大幅压缩部落阶级政治权力并显著拉升其满意度，将边疆摩擦转化为兵源与皮毛岁入。"
 oe_el4_dec_foederati_border_charter.a:0 "钤印颁行边民同盟宪章。"
 oe_el4_dec_foederati_border_charter_tt:0 "授予 #Y 25 年#!《罗马边民同盟宪章》修正（降低部落阶级权力、提升满意度与人力原料）并立即安抚部落阶层。"
 oe_el4_dec_civic_assimilation_act.title:0 "推行极乐公民同化宪章"
 oe_el4_dec_civic_assimilation_act.desc:0 "在边疆推行设市编户与双语学堂，逐步消化部落阶级并大幅加速文化同化，将地方政治重心平滑转移至自由农与海商市民。"
 oe_el4_dec_civic_assimilation_act.a:0 "编户齐民，推行罗马公民同化。"
 oe_el4_dec_civic_assimilation_act_tt:0 "授予 #Y 25 年#!《极乐公民同化宪章》修正（大幅削弱部落阶级权力，加速同化并扶植农民与市民阶层）。"
 oe_el4_dec_chesapeake_free_port.title:0 "敕建西海通商特许港"
 oe_el4_dec_chesapeake_free_port.desc:0 "拨款扩建切萨皮克母港的免税堆栈、深水码头与帝国商事法庭，打破美洲早期孤岛小市场困局，令首都贸易中心体量与海贸收益迈上新台阶。"
 oe_el4_dec_chesapeake_free_port.a:0 "敕建西海通商特许港。"
 oe_el4_dec_chesapeake_free_port_tt:0 "为首都授予 #Y 25 年#!《切萨皮克帝国通商特许港》并全国获得《西海通商特许港宪章》，同步提升首都发展度与繁荣度。"
 oe_el4_free_port_cd_tt:0 "近十五年内未重复召开特许港扩建"
 oe_el4_dec_exarchate_council.title:0 "召开泛大西洋总督联席会议"
 oe_el4_dec_exarchate_council.desc:0 "召集极乐新罗马诸总督区（Exarchate）代表赴新君士坦丁堡召开泛大西洋联席会议，大幅压低附庸独立倾向、汇集海防舰队贡金，并在文兰或斯巴达尼亚存续时激活跨洋联防加成。"
 oe_el4_dec_exarchate_council.a:0 "召开泛大西洋总督联席会议。"
 oe_el4_dec_exarchate_council_tt:0 "降低全体 #Y 极乐总督区#!独立倾向并获得 #Y 15 年#!《泛大西洋总督联席会议》修正与海防贡金；若文兰或斯巴达尼亚存续，额外激活《文兰—斯巴达尼亚跨洋联防盟约》。"
 oe_el4_exarchate_cd_tt:0 "总督联席会议未处于十五年冷却期"
 oe_el4_dec_atlantic_synod.title:0 "召开大西洋正教大公会议"
 oe_el4_dec_atlantic_synod.desc:0 "在新圣索菲亚大教堂召集西海正教诸大主教与修道院长，颁布美洲宣教法典，强力提升宗教威望、宣教转化与正教向心力。"
 oe_el4_dec_atlantic_synod.a:0 "召集西海正教大公会议。"
 oe_el4_dec_atlantic_synod_tt:0 "获得 #Y 15 年#!《大西洋正教大公会议圣谕》修正并提升教士阶层满意度。"
 oe_el4_dec_neoplatonic_academy.title:0 "敕建西海新柏拉图学园"
 oe_el4_dec_neoplatonic_academy.desc:0 "在西海万神殿庇佑下于首都敕建古典哲学、天文与罗马法学园，显著加快科研速度、国民识字率与前沿思潮扩散。"
 oe_el4_dec_neoplatonic_academy.a:0 "点亮西海新柏拉图学园之灯。"
 oe_el4_dec_neoplatonic_academy_tt:0 "获得 #Y 20 年#!《西海新柏拉图学园》修正并提升首都发展度与文化底蕴。"
 oe_el4_dec_chesapeake_sanctuary_edicts.title:0 "颁布切萨皮克宽容庇护工匠令"
 oe_el4_dec_chesapeake_sanctuary_edicts.desc:0 "依托切萨皮克宽容联合教会向欧陆受迫害工匠与学者发出庇护诏书，直接招徕流亡市民定居首都并拉升宽容度、识字率与发展度。"
 oe_el4_dec_chesapeake_sanctuary_edicts.a:0 "敞开切萨皮克港门，广纳流亡工匠学人。"
 oe_el4_dec_chesapeake_sanctuary_edicts_tt:0 "获得 #Y 20 年#!《切萨皮克宽容庇护工匠令》修正，向首都迁入熟练市民并提升发展度。"
 oe_el4_rel_dec_cd_tt:0 "宗教路线专享决议未处于十五年冷却期"
 oe_el4.1.title:0 "阿巴拉契亚山口初探"
 oe_el4.1.desc:0 "从蓝岭密林归来的极乐斥候禀报：阿巴拉契亚群山深处存在可通车马的隘口，直抵肥沃的西方河谷与内陆林地诸部。元老院就应在山口筑垒设防，还是开辟和平皮毛商道展开激辩。"
 oe_el4.1.a:0 "在蓝岭山口构筑石堡烽燧线"
 oe_el4.1.a.tt:0 "获得 #Y 25 年#!《蓝岭山口烽燧线》修正并提升陆军传统。"
 oe_el4.1.b:0 "开辟通往内陆的和平林地商道"
 oe_el4.1.b.tt:0 "获得 #Y 25 年#!《阿巴拉契亚林地商道》修正，探明俄亥俄与肯塔基腹地并增进部族好感。"
 oe_el4.2.title:0 "新大陆风土热与阿斯克勒庇俄斯检疫港"
 oe_el4.2.desc:0 "湿热的切萨皮克盛夏带来令流亡者始料未及的沼泽风土热与痢疾，新垦港埠人口损耗加剧。曾供职君士坦丁堡官立医馆的医师主张斥资兴建常设阿斯克勒庇俄斯检疫港，节俭派议员则提议合编阿尔冈昆草药方典以应急。"
 oe_el4.2.a:0 "兴建阿斯克勒庇俄斯检疫港并编纂医典"
 oe_el4.2.a.tt:0 "获得 #Y 35 年#!《阿斯克勒庇俄斯检疫医典》修正（#Y +30% 疾病抗性#!与人口增长），并为 1492 重逢期大疫病奠定防线。"
 oe_el4.2.b:0 "合编希腊—阿尔冈昆草药方典"
 oe_el4.2.b.tt:0 "以较低开销获得 #Y 25 年#!《阿尔冈昆—希腊草药方典》修正并提升农民满意度。"
 oe_el4.3.title:0 "第一代土生新罗马人的宪法之争"
 oe_el4.3.desc:0 "登陆三十余年后，生于切萨皮克湾的第一代土生新罗马青年已踏入极乐元老院议事厅。不同于怀念旧都的流亡父辈，他们将极乐洲视为永世基业，呼吁以成文宪章界定皇权、元老院与自由民之权责。"
 oe_el4.3.a:0 "颁布二代新罗马宪政平衡约"
 oe_el4.3.a.tt:0 "获得 #Y 25 年#!《二代新罗马宪政平衡约》修正，同步抬升议会支持、立法效率与阶层满意度。"
 oe_el4.3.b:0 "重申巴西琉斯在西海的集权威望"
 oe_el4.3.b.tt:0 "提升合法性、稳定度并向中央集权微调社会价值观。"
 oe_el4.3.c:0 "扩充切萨皮克自由农与市民宪章"
 oe_el4.3.c.tt:0 "提升农民与市民阶层满意度，并向自由民方向推进社会价值观。"
 oe_el4.4.title:0 "桑蚕试种与烟草玉米贸易抉择"
 oe_el4.4.desc:0 "当年随方舟从摩里亚秘密携来的蚕种终于在弗吉尼亚桑树上试养成功，与此同时切萨皮克河畔庄园的烟草与玉米亦连年大熟。行会主张集中资本扶持皇家桑蚕丝业，庄园主则呼吁大开烟草玉米贸易以做大本土市场。"
 oe_el4.4.a:0 "扶植切萨皮克皇家桑蚕丝业"
 oe_el4.4.a.tt:0 "获得 #Y 25 年#!《切萨皮克皇家桑蚕丝业》修正，并提升首都发展度与市民满意度。"
 oe_el4.4.b:0 "扩大切萨皮克烟草与玉米出口庄园"
 oe_el4.4.b.tt:0 "获得 #Y 25 年#!《切萨皮克金叶与玉米丰年》修正并充盈国库与粮食储量。"
 oe_el4.5.title:0 "大湖区皮毛同盟与易洛魁外交"
 oe_el4.5.desc:0 "沿萨斯奎哈纳河北上的商队带回了大湖区与易洛魁长屋联盟的贝珠信物与上等海狸皮。缔结皮毛互市同盟可令北疆安宁数代，但边防将领警告须防内陆强部坐大。"
 oe_el4.5.a:0 "缔结大湖区皮毛与长屋互市同盟"
 oe_el4.5.a.tt:0 "获得 #Y 25 年#!《大湖区皮毛同盟》修正，增进易洛魁邻邦友好并安抚部族阶层。"
 oe_el4.5.b:0 "转而整饬北方河谷边防堡垒"
 oe_el4.5.b.tt:0 "获得 #Y 20 年#!《蓝岭山口烽燧线》边防修正并提升陆军传统与威望。"
 oe_el4.6.title:0 "密西西比河内陆远征"
 oe_el4.6.desc:0 "在林地向导引领下，极乐测绘官翻越西部流域分水岭，惊见一条比多瑙河更为浩荡的西方大河奔涌向南。元老院为之震撼，议决如何经略这条贯通大陆腹地的黄金水道。"
 oe_el4.6.a:0 "沿西方大河建立内陆商站网"
 oe_el4.6.a.tt:0 "探明密西西比与田纳西流域，并获得 #Y 25 年#!《西方大河内陆商站网》修正。"
 oe_el4.6.b:0 "以巴西琉斯之名勒石宣誓并绘制舆图"
 oe_el4.6.b.tt:0 "探明西方大河流域并大幅提升帝国威望与文化底蕴。"
 oe_el4.7.title:0 "佛罗里达海峡与加勒比外海哨站"
 oe_el4.7.desc:0 "沿大西洋暖流南下的极乐探险舰队绕过阳光炽烈的半岛，驶入珊瑚礁环绕的碧蓝群岛海域。扼守佛罗里达海峡与暖流航道，将决定未来美洲与旧大陆间全部航线的制海权。"
 oe_el4.7.a:0 "设立佛罗里达海峡与加勒比巡防前哨"
 oe_el4.7.a.tt:0 "探明佛罗里达海域并获得 #Y 25 年#!《佛罗里达海峡与加勒比巡防站》修正与海军传统。"
 oe_el4.7.b:0 "派遣轻巡分舰队清剿南洋私掠者"
 oe_el4.7.b.tt:0 "探明佛罗里达海岸，扩充水手储备并缴获海盗财宝充盈国库。"
 oe_el4.8.title:0 "黄金城传闻与中美洲初触"
 oe_el4.8.desc:0 "越过南方暖海，极乐航海家惊见宏伟的阶梯金字塔、繁华的独木舟港埠与精雕黄金、白银和黑曜石的匠师。中美洲诸邦使节亦对罗马精钢与提尔紫绸赞叹不已。"
 oe_el4.8.a:0 "派遣正式使团缔结白银与黑曜石商约"
 oe_el4.8.a.tt:0 "获得 #Y 25 年#!《中美洲白银与黑曜石使节商约》修正，并收获首批白银商利与威望。"
 oe_el4.8.b:0 "派遣军工斥候测绘中美洲沿海要塞"
 oe_el4.8.b.tt:0 "显著提升陆海军传统并积累远征战备威望。"
 oe_el4.9.title:0 "1453 远洋讣告：旧君士坦丁堡的命运"
 oe_el4.9.desc:0 "一艘自亚速尔群岛乘风西来的破损商船带回震动新君堡的远洋羊皮信函：旧大陆君士坦丁堡的狄奥多西城墙正饱受巨炮与战火摧折，无数流亡希腊学者与匠人正翘首西望。新罗马举国肃然。"
 oe_el4.9.a:0 "广开港门迎接 1453 流亡学人与匠师"
 oe_el4.9.a.tt:0 "获得 #Y 30 年#!《1453 君堡流亡学人大潮》修正，向首都迁入流亡市民并提升发展度。"
 oe_el4.9.b:0 "在双头鹰旗下起誓东归复仇"
 oe_el4.9.b.tt:0 "获得 #Y 30 年#!《西海东归复仇圣誓》修正，全面振奋陆海士气与帝国威望。"
 oe_el4.10.title:0 "北大西洋寻访文兰后裔"
 oe_el4.10.desc:0 "顺着北方鳕鱼渔场越过迷雾海角的极乐船长，邂逅了仍传唱着旧拜占庭瓦兰吉战斧卫队歌谣的北欧文兰后裔。重续这份跨越数世纪的古老盟谊，将令新罗马北翼海陆生威。"
 oe_el4.10.a:0 "重续瓦兰吉卫队与文兰水手兄弟盟"
 oe_el4.10.a.tt:0 "获得 #Y 25 年#!《北大西洋瓦兰吉兄弟盟》修正（纪律、海军射程与水手）并立即补充水手。"
 oe_el4.10.b:0 "以布匹铜器互市换取北方干鱼与船材"
 oe_el4.10.b.tt:0 "通过北方互市充实国库并提升海商市民阶层满意度。"
 oe_el4.11.title:0 "铜壳远洋船坞与大西洋制海权准备"
 oe_el4.11.desc:0 "航海官与船长纷纷示警：伊比利亚与西欧列强的探险船队正步步深入大西洋。赶在旧大陆列强抵达美洲之前，极乐海军总署提议全面扩建切萨皮克铜壳船坞与大西洋主力舰队。"
 oe_el4.11.a:0 "全面推行铜壳远洋船坞与主力舰计划"
 oe_el4.11.a.tt:0 "获得 #Y 25 年#!《铜壳远洋船坞与大西洋制海令》修正并大幅提升海军传统。"
 oe_el4.11.b:0 "转而加固沿海要塞并积蓄战备金库"
 oe_el4.11.b.tt:0 "获得 #Y 20 年#!《蓝岭山口烽燧线》防务修正并提升稳定度与陆军传统。"
 oe_el4.12.title:0 "四罗马正统宣示：跨洋大棋局"
 oe_el4.12.desc:0 "随着跨洋航线重新贯通东西半球，使节带回了欧亚诸强竞逐罗马法统的消息——扼守博斯普鲁斯的奥斯曼帝国、自诩第三罗马的莫斯科公国与雄踞中欧的神圣罗马帝国。极乐元老院庄严齐聚，第四罗马必须向天下昭告自己的终极天命！"
 oe_el4.12.a:0 "宣告唯一第四罗马正统——誓师东归收复圣城！"
 oe_el4.12.a.tt:0 "获得 #Y 30 年#!《唯一第四罗马正统宣示》修正，震慑旧大陆诸帝国宣称者并为东归收复路线蓄势。"
 oe_el4.12.b:0 "宣告双头鹰跨洋共治——迈向东西双都联邦！"
 oe_el4.12.b.tt:0 "获得 #Y 30 年#!《双头鹰跨洋共治宣言》修正，拓展外交容量与附庸忠诚，衔接东西双都跨洋联邦路线。"
 oe_el4.12.c:0 "宣告永恒极乐——屹立西半球的独立罗马盛世！"
 oe_el4.12.c.tt:0 "获得 #Y 30 年#!《永恒极乐西海帝国威仪》修正，全面拉升国内繁荣、科研效率与阶层和睦。"
 oe_el4.13.title:0 "大西洋正教教区的本土礼仪"
 oe_el4.13.desc:0 "在切萨皮克与波托马克河谷间，一座座正教圣堂拔地而起。西海正教诸主教就是否将圣咏礼仪译为阿尔冈昆语以加速教化，抑或严守纯正希腊语礼仪展开商议。"
 oe_el4.13.a:0 "效法西里尔与美多德传统推行双语边疆礼仪"
 oe_el4.13.a.tt:0 "获得 #Y 25 年#!《大西洋正教大公会议圣谕》修正并提升农民与部族满意度。"
 oe_el4.13.b:0 "恪守君士坦丁堡纯正希腊圣咏传统"
 oe_el4.13.b.tt:0 "提升教士阶层满意度、君主合法性与古典希腊文化底蕴。"
 oe_el4.14.title:0 "三宗座共融还是大西洋独立牧首？"
 oe_el4.14.desc:0 "跨洋联系重启后，来自东欧与地中海的正教大主教们致函垂询：新君士坦丁堡在正教牧首体系中居于何位？是宣告完全独立的大西洋大牧首区，还是与旧君堡、莫斯科缔结三宗座共融？"
 oe_el4.14.a:0 "宣告新君士坦丁堡独立大西洋大牧首区"
 oe_el4.14.a.tt:0 "获得 #Y 30 年#!《独立大西洋正教大牧首区》修正并显著提升威望与合法性。"
 oe_el4.14.b:0 "缔结三宗座正教共融圣约"
 oe_el4.14.b.tt:0 "获得 #Y 30 年#!《三宗座正教共融圣约》修正，大幅增强外交声誉与基督教世界好感。"
 oe_el4.15.title:0 "西海万神殿：新柏拉图学园启幕"
 oe_el4.15.desc:0 "复兴西海万神殿的哲人与祭司上书元老院，提议在新君士坦丁堡神殿之侧兴建宏伟的新柏拉图学园，将古典哲学、格致自然与罗马法学合为一体。"
 oe_el4.15.a:0 "由国库重金敕建西海新柏拉图学园"
 oe_el4.15.a.tt:0 "获得 #Y 30 年#!《西海新柏拉图学园》修正并提升首都发展度与科研效率。"
 oe_el4.15.b:0 "资助巡回哲人讲学以涵养地方文教"
 oe_el4.15.b.tt:0 "无需巨额拨款即可提升文化底蕴、国内稳定与教士市民满意度。"
 oe_el4.16.title:0 "赫斯珀里亚太阳神观星台"
 oe_el4.16.desc:0 "侍奉赫斯珀里亚太阳神的星象家已完整测绘西半球星空，并铸成可在大西洋风浪中精准测定纬度的青铜星盘，请求拨款修建沿海观星台。"
 oe_el4.16.a:0 "沿大西洋岸兴建赫斯珀里亚观星台"
 oe_el4.16.a.tt:0 "获得 #Y 30 年#!《赫斯珀里亚太阳神观星台》修正并提升海军传统与远洋航程。"
 oe_el4.16.b:0 "将星图免费刊行于切萨皮克海商行会"
 oe_el4.16.b.tt:0 "赢得海商市民阶层盛赞，并直接收获商利与威望。"
 oe_el4.17.title:0 "切萨皮克宽容联合教会协约"
 oe_el4.17.desc:0 "在切萨皮克宽容联合教会旗帜下，正教司祭、古典学者与原住民长老齐聚新君士坦丁堡，商议共建向帝国全体臣民敞开的联合救济院与市立学堂。"
 oe_el4.17.a:0 "批准《切萨皮克教会宽容协约》"
 oe_el4.17.a.tt:0 "获得 #Y 30 年#!《切萨皮克教会宽容协约》修正并提升国内稳定与宽容度。"
 oe_el4.17.b:0 "由市民行会主导兴办世俗市立学堂"
 oe_el4.17.b.tt:0 "提升市民满意度并推动首都发展与识字进步。"
 oe_el4.18.title:0 "避风良港：吸纳欧陆宗教战争流亡工匠"
 oe_el4.18.desc:0 "随着旧大陆宗教战争烽烟四起，满载欧陆织布匠、枪械师、印刷工与学者的船队纷纷跨越重洋，向切萨皮克宽容联合教会寻求庇护。敞开国门将带来实打实的人口迁入、发展度与识字率跃升。"
 oe_el4.18.a:0 "赐予公民权与工坊启动金，全面接纳流亡匠师"
 oe_el4.18.a.tt:0 "获得 #Y 30 年#!《切萨皮克宽容庇护工匠令》修正，向首都迁入大批熟练市民与自由农并大幅提升发展度。"
 oe_el4.18.b:0 "征收适度入港税并准许自由定居"
 oe_el4.18.b.tt:0 "收取入港关税充盈国库，并吸纳一批熟练市民定居首都。"
 oe_el4.19.title:0 "林地酋长大会与部落阶级归化抉择"
 oe_el4.19.desc:0 "随着罗马农庄沿切萨皮克河岸不断延展，境内部落人口围绕狩猎林地与赋役归属的不满日益浮现。若听之任之将沦为常年隐患；若因势利导，则可将其化作忠诚的边民同盟或归化为帝国自由农与市民。"
 oe_el4.19.a:0 "与林地酋长缔结《罗马边民同盟宪章》"
 oe_el4.19.a.tt:0 "获得 #Y 25 年#!《罗马边民同盟宪章》修正（削弱部落政治权力、大幅恢复部落满意度并增加人力与原料产出）。"
 oe_el4.19.b:0 "在边疆诸郡推行《极乐公民同化宪章》"
 oe_el4.19.b.tt:0 "获得 #Y 25 年#!《极乐公民同化宪章》修正（大幅压缩部落权力、加速文化同化并扶植自由农与市民）。"
 oe_el4.19.c:0 "达成务实的林地与元老院折中协定"
 oe_el4.19.c.tt:0 "获得 #Y 20 年#!《林地酋长与元老院协定》修正，温和缓解各阶层摩擦。"
 oe_el4.20.title:0 "边疆新生代：双语公民还是自治同盟区"
 oe_el4.20.desc:0 "自首次林地协约签署一代人后，波托马克河畔兴起的希腊—阿尔冈昆混居市镇向极乐元老院请愿确立永久法律地位。他们的代表既能流畅诵读希腊律法，亦通晓美洲本土方言。"
 oe_el4.20.a:0 "颁授完全罗马公民权与自治市宪章"
 oe_el4.20.a.tt:0 "续延 #Y 25 年#!《极乐公民同化宪章》，提升首都发展度与农民、市民满意度。"
 oe_el4.20.b:0 "设立帝国法官监理的边疆自治同盟区"
 oe_el4.20.b.tt:0 "获得 #Y 25 年#!《边疆自治同盟区》修正，扩充文化接纳容量并提升部落满意度与兵源。"
 STATIC_MODIFIER_NAME_oe_el4_founded_t2_mod:0 "切萨皮克立足期（二阶）"
 STATIC_MODIFIER_DESC_oe_el4_founded_t2_mod:0 "极乐新罗马从建国初期的方舟应急补贴平滑过渡至切萨皮克立足阶段：持续的国库托底、宫廷外交减负、抗疫护持与丰产粮仓护送帝国稳步成长，彻底消除财政断崖。"
 STATIC_MODIFIER_NAME_oe_el4_founded_t3_mod:0 "新罗马自立期（三阶）"
 STATIC_MODIFIER_DESC_oe_el4_founded_t3_mod:0 "建国半世纪后，递减式国库补贴、维护减免与抗疫屏障助力切萨皮克市场、大西洋船坞与总督区体系完成最后接棒，令第四罗马迈向完全自立。"
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_chesapeake_estates:0 "切萨皮克庄园封地法"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_chesapeake_estates:0 "极乐元老院勘定切萨皮克诸河畔庄园封地，稳固流亡世家忠诚、地方管控与田赋岁入。"
