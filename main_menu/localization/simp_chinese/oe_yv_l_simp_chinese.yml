 # NEW 2026-11-18 Yuan track Y4 (oe_yv_ events). Generated by gen_yuan_y4.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_yv_grand_chancellor: "大丞相专权"
 STATIC_MODIFIER_DESC_oe_yv_grand_chancellor: "伯颜加号大丞相，独揽朝政，宗王与朝臣都要看大丞相的脸色。伯颜离开朝堂时，这一修正随之消失。"
 STATIC_MODIFIER_NAME_oe_yv_yellow_river_breach: "黄河决口"
 STATIC_MODIFIER_DESC_oe_yv_yellow_river_breach: "黄河决堤，沿河州县的田地被水淹没，灾民四处流散。"
 STATIC_MODIFIER_NAME_oe_yv_wenzong_son: "文宗遗孤在朝"
 STATIC_MODIFIER_DESC_oe_yv_wenzong_son: "文宗之子燕帖古思没有流放，仍以宗王的身份留在宫中。元统元年立帝时有“万岁之后传位燕帖古思”的约定，朝中念旧的人仍把燕帖古思看作另一位可能的君主。燕帖古思死去或离开大元时，这一修正随之消失，最长10年。"
 STATIC_MODIFIER_NAME_oe_yv_sole_chancellor: "独相专权"
 STATIC_MODIFIER_DESC_oe_yv_sole_chancellor: "脱脱以中书右丞相独秉大政，枢密、宣政诸司多承风旨，政令虽易推行，君权与朝纲却不免为权相所分。脱脱去世、被罢或大元倾覆时，这一修正随之消失。"
 STATIC_MODIFIER_NAME_oe_yv_divided_chancery: "两相分权"
 STATIC_MODIFIER_DESC_oe_yv_divided_chancery: "中书左右二相互相牵制，凡事须经多番商议，政令推行稍缓，但朝中不致一家独大。脱脱复相或还朝时提前撤去。"
 oe_yv_tib_situ: "元廷授予大司徒之号"
 oe_yv_tib_rebuked: "元廷斥责擅废萨迦"
 oe_yv_name_ayushiridara: "爱猷识理达腊"
 oe_yv.1.t: "至元三年民变：广州与汝宁"
 oe_yv.1.d: "至元三年（1337年）正月，广州增城县民朱光卿起事，党羽石昆山、钟大明率众相从，号称“大金国”，改元“赤符”。朝廷命指挥狗札里、江西行省左丞沙的前往讨伐。二月，棒胡在汝宁府信阳州起事，朝廷命河南行省左丞庆童领兵往讨；汝宁府献上缴获的弥勒佛像、小旗、伪宣敕和紫金印。\n\n如今，两处的乱事仍未平息：岭南的朱光卿聚众称号，河南的棒胡打着弥勒佛的旗号。怎样处置，要由朝廷决定。"
 oe_yv.1.a: "发兵会讨"
 oe_yv.1.a.tt: "行省忠诚：江西行省#R −3#!，河南江北行省#R −3#!。"
 oe_yv.1.b: "责成地方官员"
 oe_yv.1.b.tt: "行省忠诚：江西行省#R −8#!，河南江北行省#R −8#!。"
 oe_yv.1.c: "招抚胁从之众"
 oe_yv.1.c.tt: "行省忠诚：江西行省#R −2#!，河南江北行省#R −2#!。"
 oe_yv.2.t: "禁汉人、南人执持军器"
 oe_yv.2.d: "至元三年四月（1337年5月），朝廷下令：汉人、南人、高丽人不得执持军器，凡有马者拘入官；同月又禁汉人、南人学习蒙古、色目文字。禁令颁下的次日，伯颜受命统领宣镇侍卫军，朝廷赐钞三千锭，建宣镇侍卫府。到八月，朝廷放宽了高丽人执持军器的禁令，仍许乘马。\n\n如今，禁令已经拟成，等待颁行各地。这是伯颜的主张。\n说明：“蒙汉对立”的强度会决定日后红巾军起义开始时“红巾军起义”修正的大小。"
 oe_yv.2.a: "严行禁令"
 oe_yv.2.b: "只禁军器，不收马匹"
 oe_yv.2.c: "收回成命"
 oe_yv.3.t: "至元三年民变：惠州与合州"
 oe_yv.3.d: "至元三年四月（1337年5月），合州大足县民韩法师起事，自称“南朝赵王”。同月，惠州归善县民聂秀卿、谭景山等私造军器，拜戴甲为“定光佛”，与朱光卿相结为乱，朝廷命江西行省左丞沙的追捕。五月，又命四川行省参知政事举理等追捕韩法师。\n\n如今，岭南、蜀中又有人以佛号、王号聚众。若与先前的乱事连成一片，地方恐怕难以收拾。"
 oe_yv.3.a: "命沙的、举理分头追捕"
 oe_yv.3.a.tt: "行省忠诚：江西行省#R −3#!，四川行省#R −3#!。"
 oe_yv.3.b: "趁势搜缴民间兵器"
 oe_yv.3.b.tt: "行省忠诚：江西行省#R −6#!，四川行省#R −6#!。"
 oe_yv.3.c: "只诛首恶，宽赦胁从"
 oe_yv.3.c.tt: "行省忠诚：江西行省#R −2#!，四川行省#R −2#!。"
 oe_yv.4.t: "乃蛮台袭国王"
 oe_yv.4.d: "札剌亦儿部木华黎的后人世袭“国王”之号。朵儿只在天历二年（1329年）袭国王，奉诏前往辽阳就国。后至元三年（1337年），朝廷诏乃蛮台袭国王，授以金印；乃蛮台自至顺元年（1330年）起知岭北行枢密院事。（《朵儿只传》把换人记在至元四年，与《乃蛮台传》不同。）\n\n如今，诏书已下，乃蛮台接过了国王的金印。"
 oe_yv.4.a: "准其袭封"
 oe_yv.5.t: "朵儿只出镇辽阳"
 oe_yv.5.d: "至元四年三月（1338年4月），朝廷以国王朵儿只为辽阳行省左丞相。朵儿只此前承袭札剌亦儿国王，去年这一称号改由乃蛮台承袭。\n\n如今，朵儿只已经启程前往辽阳，东北的政务交到了这位老国王手中。"
 oe_yv.5.a: "命其悉心镇抚"
 oe_yv.5.a.tt: "朵儿只出任辽阳行省长官，原长官回朝（朵儿只在世、辽阳行省仍是大元的边地行省时）。"
 oe_yv.6.t: "伯颜进大丞相"
 oe_yv.6.d: "至元五年十月（1339年11月），顺帝下诏命伯颜为大丞相，加“元德上辅功臣”之号，赐七宝玉书龙虎金符。同年，伯颜擅杀郯王彻彻秃，又贬黜宣让王帖木儿不花、威顺王宽彻普化。\n\n如今，伯颜请加大丞相之号，诏书等着皇帝用印。"
 oe_yv.6.a: "加伯颜为大丞相"
 oe_yv.6.a.tt: "伯颜离开朝堂时（被罢黜、去世或离开内阁），“大丞相专权”随即消失。"
 oe_yv.6.b: "不允所请"
 oe_yv.7.t: "脱脱罢黜伯颜"
 oe_yv.7.d: "至元六年二月（1340年3月），伯颜出城打猎，侄子脱脱奉顺帝之旨将伯颜罢黜，贬为河南行省左丞相；三月又诏徙南恩州阳春县安置，伯颜死在途中的龙兴路驿舍。这年十月，脱脱出任中书右丞相，此前右丞相之职由脱脱的父亲马札儿台担任。\n\n如今，伯颜仍然把持朝政。皇帝与脱脱已经定下计策，只等伯颜离开京城。"
 oe_yv.7.a: "依计行事"
 oe_yv.7.a.tt: "伯颜被逐出内阁，永不叙用，贬往南方，不久死于途中。"
 oe_yv.7.b: "揭发脱脱的密谋"
 oe_yv.7.c: "罢黜伯颜，不立权相"
 oe_yv.7.c.tt: "伯颜被逐出内阁，永不叙用，贬往南方，不久死于途中。"
 oe_yv.8.t: "至元六年的行省人事"
 oe_yv.8.d1: "至元六年（1340年），朵儿只由辽阳行省左丞相迁河南行省左丞相，史称为政如在辽阳时；乃蛮台拜岭北行省左丞相，仍兼国王、知行枢密院事。\n\n如今，伯颜已经倒台，脱脱主持朝政，各地的长官开始换班。"
 oe_yv.8.d: "至元六年（1340年），朵儿只由辽阳行省左丞相迁河南行省左丞相，史称为政如在辽阳时；乃蛮台拜岭北行省左丞相，仍兼国王、知行枢密院事。\n\n如今，朝廷调整了两处行省的长官。"
 oe_yv.8.a: "照准"
 oe_yv.8.a.tt: "朵儿只出任河南江北行省长官，原长官回朝；若朵儿只此时仍任辽阳行省长官，辽阳行省另派新长官。\n乃蛮台出任岭北行省长官，原长官回朝。\n（各项只在当事人在世、该行省仍是大元的行省时生效。）\n行省忠诚：河南江北行省#G +5#!。"
 oe_yv.9.t: "黄河决白茅堤"
 oe_yv.9.d: "至正四年夏五月（1344年夏），大雨下了二十多天，黄河暴涨，平地水深两丈多，向北冲决白茅堤。沿河的济宁、单州、虞城、砀山、金乡、鱼台、丰、沛、定陶、楚丘、武城，直到曹州、东明、巨野、郓城、嘉祥、汶上、任城等地，都遭了水灾。\n\n如今，河南江北和腹里沿河一带一片汪洋，灾民流离失所。朝廷要决定怎样赈济。"
 oe_yv.9.a: "开仓赈济"
 oe_yv.9.a.tt: "沿河州县（济宁、任城、嘉祥、巨野、郓城、单州、金乡、鱼台、曹州、定陶、楚丘、汶上、东明、虞城、砀山、丰、沛、武城一带，共#Y 8#!个省份）中大元占有的地方得“黄河决口”（#Y 5#!年）：本地食物产出#R −15%#!，本地人口增长#R −0.3%#!，人口加入叛军的阈值#R −3%#!。\n行省忠诚：河南江北行省#R −3#!。"
 oe_yv.9.b: "责令地方自行赈恤"
 oe_yv.9.b.tt: "沿河州县（济宁、任城、嘉祥、巨野、郓城、单州、金乡、鱼台、曹州、定陶、楚丘、汶上、东明、虞城、砀山、丰、沛、武城一带，共#Y 8#!个省份）中大元占有的地方得“黄河决口”（#Y 8#!年）：本地食物产出#R −15%#!，本地人口增长#R −0.3%#!，人口加入叛军的阈值#R −3%#!。\n行省忠诚：河南江北行省#R −8#!。"
 oe_yv.10.t: "贾鲁治河"
 oe_yv.10.d1: "至正十一年四月（1351年5月），朝廷命贾鲁以工部尚书为总治河防使，征发汴梁、大名等十三路民夫十五万人、庐州等地戍军二万人供役。工程四月二十二日开工，七月疏凿成，八月引河水回归故道，九月可以行船，十一月堤埽全部完工。\n\n如今，治河的诏令已下，民夫正在河上集结。怎样用这些人，要由朝廷决定。\n说明：1350年以后，只要大元的稳定度低于95、正统性低于50，或几个阶层（平民算两个）的满意度低于75%，红巾军起义都可能开始；开始时“蒙汉对立”的强度决定“红巾军起义”修正的大小。"
 oe_yv.10.d: "至正十一年四月（1351年5月），朝廷命贾鲁以工部尚书为总治河防使，征发汴梁、大名等十三路民夫十五万人、庐州等地戍军二万人供役。工程四月二十二日开工，七月疏凿成，八月引河水回归故道，九月可以行船，十一月堤埽全部完工。\n\n如今，黄河决口多年，一直没有回到故道。朝廷要决定是否大举治河。\n说明：1350年以后，只要大元的稳定度低于95、正统性低于50，或几个阶层（平民算两个）的满意度低于75%，红巾军起义都可能开始；开始时“蒙汉对立”的强度决定“红巾军起义”修正的大小。"
 oe_yv.10.a: "疏塞并举，限期完工"
 oe_yv.10.a.tt: "行省忠诚：河南江北行省#R −5#!。\n（尚未开工时）黄河工程随即开工（原版“治理黄河工程”及其后续事件）。"
 oe_yv.10.b: "给钱雇役，宽限工期"
 oe_yv.10.b.tt: "行省忠诚：河南江北行省#R −2#!。\n（尚未开工时）黄河工程随即开工（原版“治理黄河工程”及其后续事件）。"
 oe_yv.10.c: "不复故道，只修北堤"
 oe_yv.10.c.tt: "沿河仍带“黄河决口”的省份：这一修正改为从现在起再持续#Y 6#!年。\n行省忠诚：河南江北行省#R −5#!。"
 oe_yv_name_changchub_gyaltsen: "绛曲坚赞"
 oe_yv.11.t: "帕木竹巴掌卫藏"
 oe_yv.11.d: "绛曲坚赞生于1302年，九岁出家，1322年起任帕木竹巴万户长，以乃东为治所。萨迦的官员曾在1336年和1346年两次扣押绛曲坚赞。到1349年，卫地大部连同拉萨已归帕木竹巴；1354年，帕竹的兵马进逼萨迦，后藏大部也归于绛曲坚赞。\n\n如今，帕木竹巴的兵马已经逼近萨迦。萨迦的法座保不保得住，就在眼前。"
 oe_yv.11.a: "帕木竹巴掌政"
 oe_yv.11.b: "萨迦力保法座"
 oe_yv.11.b.tt: "绛曲坚赞留在国内，仍是帕木竹巴的首领。"
 oe_yv.12.t: "宣政院议帕木竹巴"
 oe_yv.12.d: "1354年起，帕木竹巴的绛曲坚赞取代萨迦，掌管卫藏大部。1357年，绛曲坚赞接受了元朝皇帝所授的“大司徒”之号。\n\n如今，吐蕃换了主人。宣政院请示：是承认帕木竹巴，还是责其擅废萨迦？"
 oe_yv.12.a: "授绛曲坚赞大司徒之号"
 oe_yv.12.b: "斥其擅废萨迦"
 oe_yv.13.t: "撤文宗庙主"
 oe_yv.13.d1: "元统元年（1333年），文宗皇后卜答失里与大臣议立顺帝时言明：皇帝百年之后，传位于文宗之子燕帖古思，如武宗、仁宗兄弟相传的旧例。至元六年六月（1340年7月），伯颜已经倒台，顺帝下诏追究文宗与近臣“谋为不轨，使我皇考饮恨上宾”：撤去太庙中文宗的神主；太皇太后卜答失里削去尊号，迁往东安州安置；太子燕帖古思流放高丽。监察御史崔敬上言燕帖古思不宜放逐，诏书不答。七月，燕帖古思死在流放途中（一说为押送的人所害）。此前半年，至元五年十二月（1340年1月），奇氏为顺帝生下皇子爱猷识理达腊（一说生于至元四年）。\n\n如今，诏书已经拟好，只等皇帝用印。燕帖古思仍在宫中，皇子爱猷识理达腊尚在襁褓。"
 oe_yv.13.d: "元统元年（1333年），文宗皇后卜答失里与大臣议立顺帝时言明：皇帝百年之后，传位于文宗之子燕帖古思，如武宗、仁宗兄弟相传的旧例。至元六年六月（1340年7月），伯颜已经倒台，顺帝下诏追究文宗与近臣“谋为不轨，使我皇考饮恨上宾”：撤去太庙中文宗的神主；太皇太后卜答失里削去尊号，迁往东安州安置；太子燕帖古思流放高丽。监察御史崔敬上言燕帖古思不宜放逐，诏书不答。七月，燕帖古思死在流放途中（一说为押送的人所害）。此前半年，至元五年十二月（1340年1月），奇氏为顺帝生下皇子爱猷识理达腊（一说生于至元四年）。\n\n如今，诏书已经拟好，只等皇帝用印。燕帖古思仍在宫中。"
 oe_yv.13.a: "依诏撤庙，流放燕帖古思"
 oe_yv.13.a.tt: "皇子爱猷识理达腊立为储君（皇子在世、身在大元时）。\n燕帖古思不得继承皇位，流放高丽，#Y 31#!天后死于途中。"
 oe_yv.13.b: "从崔敬之言，留燕帖古思为宗王"
 oe_yv.13.b.tt: "皇子爱猷识理达腊立为储君（皇子在世、身在大元时）；燕帖古思以宗王的身份留在宫中，不再是储君。\n“文宗遗孤在朝”在燕帖古思死去或离开大元时随即撤去，最长#Y 10#!年：每月正统性#R −0.03#!，内阁效率#R −3%#!。"
 oe_yv.14.t: "脱脱辞相"
 oe_yv.14.d: "至正四年五月（1344年6月），右丞相脱脱以疾请辞，一说因朝中宗勋与两宫牵制、难展所长而引疾自退。顺帝诏允所请，封脱脱为郑王，食邑安丰，赐金印，以博尔术四世孙阿鲁图继任中书右丞相，与左丞相别儿怯不花分领省事。\n\n如今，脱脱的辞表已递至御前。是准许脱脱卸任、复归左右二相分权之制，还是加以挽留、仍令独秉中书？"
 oe_yv.14.a: "准其辞相，以阿鲁图继之"
 oe_yv.14.a.tt: "若已有“独相专权”，随即撤去；记入脱脱辞相离任（1347年前后可能触发别儿怯不花之劾；脱脱仍留内阁名籍，不影响原版科举与三史事件）。\n“两相分权”在脱脱复相或还朝时提前撤去，最长#Y 5#!年：内阁效率#R −3%#!。"
 oe_yv.14.b: "挽留脱脱，仍兼两相"
 oe_yv.14.b.tt: "“独相专权”在脱脱去世、被罢或大元倾覆时随即撤去，最长#Y 10#!年：内阁效率#G +8%#!，每月正统性#R −0.03#!。"
 oe_yv.15.t: "别儿怯不花之劾与徙甘州"
 oe_yv.15.d: "至正七年（1347年），左丞相别儿怯不花素与脱脱有隙，构陷脱脱之父马札儿台，朝廷诏徙马札儿台于甘肃甘州。脱脱上疏请随父同行，赴甘州侍奉。顺帝左右近臣哈麻出身康里部，屡在御前称述脱脱之孝与才干，为马札儿台父子缓颊，自此颇得顺帝信重。\n\n如今，别儿怯不花的弹章与脱脱请随父行的奏疏同在案头。朝廷要决定是否令马札儿台父子赴甘州，还是将二人留在大都。"
 oe_yv.15.a: "听脱脱随父赴甘州，记哈麻之言"
 oe_yv.15.a.tt: "脱脱随父赴甘州，哈麻因在御前为脱脱辩白而渐得信重（记入全局变量，为日后朝局与东宫之争埋下伏笔；脱脱仍留内阁名籍，不影响原版事件）。"
 oe_yv.15.b: "留马札儿台父子于京，抑别儿怯不花"
 oe_yv.15.b.tt: "马札儿台父子留居大都，提前结束脱脱辞相状态并撤去“两相分权”。"
 oe_yv.16.t: "脱脱复相与追封"
 oe_yv.16.d1: "至正九年闰七月（1349年夏秋），马札儿台既殁，顺帝召脱脱还朝，复拜中书右丞相，兼领中书、枢密诸事；随后即议行至正变钞与贾鲁治河。朝廷并追封脱脱曾祖、祖、父三代王爵，广施宗勋恩赏，元末封爵渐趋宽滥。\n\n此前哈麻在御前屡为脱脱说话，此时也跻身近要。如今，脱脱奉诏还朝，河防与钞法之议迫在眉睫。是授脱脱右丞相独秉中书、或并加追封以结宗勋，还是仍分左右二相？"
 oe_yv.16.d2: "至正九年闰七月（1349年夏秋），马札儿台既殁，顺帝召脱脱还朝，复拜中书右丞相，兼领中书、枢密诸事；随后即议行至正变钞与贾鲁治河。朝廷并追封脱脱曾祖、祖、父三代王爵，广施宗勋恩赏，元末封爵渐趋宽滥。\n\n如今，脱脱奉诏还朝，河防与钞法之议迫在眉睫。是授脱脱右丞相独秉中书、或并加追封以结宗勋，还是仍分左右二相？"
 oe_yv.16.d3: "至正九年闰七月（1349年夏秋），马札儿台既殁，顺帝召脱脱还朝，复拜中书右丞相，兼领中书、枢密诸事；随后即议行至正变钞与贾鲁治河。朝廷并追封脱脱曾祖、祖、父三代王爵，广施宗勋恩赏，元末封爵渐趋宽滥。\n\n如今，脱脱自至正四年以来仍居中书独相之位，河防与钞法之议迫在眉睫。朝廷要决定是否续授独相、并加追封以结宗勋，还是趁此时改复左右二相分权。"
 oe_yv.16.d: "至正九年闰七月（1349年夏秋），马札儿台既殁，顺帝召脱脱还朝，复拜中书右丞相，兼领中书、枢密诸事；随后即议行至正变钞与贾鲁治河。朝廷并追封脱脱曾祖、祖、父三代王爵，广施宗勋恩赏，元末封爵渐趋宽滥。\n\n如今，脱脱身在京师，河防与钞法之议迫在眉睫。是拜脱脱为右丞相独秉中书、或并加追封以结宗勋，还是仍分左右二相？"
 oe_yv.16.a: "拜脱脱为右丞相，兼领中书"
 oe_yv.16.a.tt: "清除脱脱辞相状态与“两相分权”。\n“独相专权”在脱脱被罢、去世或大元倾覆时随即撤去，最长#Y 5#!年：内阁效率#G +8%#!，每月正统性#R −0.03#!。"
 oe_yv.16.b: "复相并追封其祖、加恩宗勋"
 oe_yv.16.b.tt: "清除脱脱辞相状态与“两相分权”；追封三代与加恩宗勋虽损朝廷威望，却换来勋贵配合。\n“独相专权”在脱脱被罢、去世或大元倾覆时随即撤去，最长#Y 5#!年：内阁效率#G +8%#!，每月正统性#R −0.03#!。"
 oe_yv.16.c: "仍分左右二相，不授独相"
 oe_yv.16.c.tt: "清除脱脱辞相状态；若已有“独相专权”，随即撤去。\n“两相分权”持续#Y 3#!年：内阁效率#R −3%#!。"
