 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_military:0 "加固边疆堡垒并提升军区与附庸征召动员能力的战备总令。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_fiscal_subject:0 "帝国财赋稽核令"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_fiscal_subject:0 "强化地方征税稽核但引起部分附庸不满的财赋总令。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_fiscal_overlord:0 "帝国财赋清册"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_fiscal_overlord:0 "中央财赋稽核机制提升了来自全体附庸的财政进贡收益。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_frontier_subsidy:0 "帝国边疆补贴"
 STATIC_MODIFIER_DESC_oe_wp33_mod_frontier_subsidy:0 "来自帝国国库的应急补贴，稳固陷入困境的边疆军区或附庸。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_colonial_audit:0 "海外殖民稽核"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_colonial_audit:0 "为期一年的海外特许状与总督区稽核行动，加速移民迁徙与附庸忠诚，但令本土阶层略有怨言。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_colonial_charter:0 "总督特许状妥协"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_colonial_charter:0 "放宽海外议会特许权限以安抚殖民忠诚并延展殖民航程，代价是本土税收效率小幅回落。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_colonial_mercantile:0 "王室重商关税督察"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_colonial_mercantile:0 "严格执行航海与关税章程以提升附庸贡赋与贸易保护，代价是海外附庸忠诚下降。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_gp_centralize:0 "列强中央集权革新"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_gp_centralize:0 "强化中枢内阁运作效能与国家威望，但触动传统阶层既得利益。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_gp_consolidate:0 "宫廷与阶层和解"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_gp_consolidate:0 "通过温和让步换取国内稳定与阶层满意，代价是王室阶层权力小幅回落。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_culture_assimilate:0 "古典文化同化方略"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_culture_assimilate:0 "大力推广宫廷主流文化与法制以加速人口同化与文化传统积累，但压缩异端容忍度。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_culture_cosmopolitan:0 "多元包容共治方略"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_culture_cosmopolitan:0 "以成文法保障多元族群与教派容忍以维持疆域安定，代价是文化同化速度放缓。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_culture_syncretic:0 "学术汇通思潮方略"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_culture_syncretic:0 "赞助跨文化学院与译馆加速思潮传播与科研进度，代价是维持传统稳定的成本上升。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_wonders_builders:0 "帝国大匠营建特许"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_wonders_builders:0 "统筹全国建筑师与石匠行会加速奇观工程与威望积累，代价是建筑维护负担提高。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_wonders_sitonia:0 "官仓粮秣与市政修缮"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_wonders_sitonia:0 "将财政投入公共粮仓、水道与地方管控以稳步抬升繁荣与控制力，略微压缩净税率。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_diplo_accord:0 "帝国和平与御藩盟约"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_diplo_accord:0 "以正式外交保证提升国际声誉与附庸忠诚，代价是适当减免附庸贡赋抽取。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_diplo_leases:0 "特许银行与海贸租约稽核"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_diplo_leases:0 "整顿海外商港租约与特许银行账目以拓展商队力量与外交容量，令本土行会略有不满。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_era_reform:0 "时代革新与思潮纲领"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_era_reform:0 "顺应时代思潮推进科研与制度革新，代价是传统体制下的稳定维系成本提高。"
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_era_horizon:0 "战略外交与寰宇视野"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_era_horizon:0 "扩建驻外使馆与情报网络以提升外交声誉与外交官增速，消耗少量财政税收效率。"
 oe_wp33.201.t:0 "殖民帝国与自治脉搏"
 oe_wp33.201.d_overlord:0 "御前勘察官已完成对海外殖民特许状与总督区的全面稽核。凤凰计划在国家决议面板提供了四大核心殖民治理决议：（一）“殖民特许税与贸易让步”，用于权衡关税收益与独立倾向；（二）“仲裁殖民总督区疆界”，平息边疆纠纷并促成发展；（三）自专制时代起开放的“颁授殖民自治宪章”，引导和平自治领转型；（四）“整并海外飞地”与哥伦布大交换作物引进决议。帝国枢密院应采取何种海外方略？"
 oe_wp33.201.d_subject:0 "各地殖民议会代表已汇总本领在宗主体系下的最新态势。自宗教改革时代起，殖民领可通过哥伦布大交换决议引入旧大陆牲畜与庄园农牧；一旦进入专制时代且独立倾向达到55或以上，国家决议面板将解锁“颁布殖民地独立宣言”，同时亦可借自治宪章与宗主国展开和平博弈。本领议会当下应如何定策？"
 oe_wp33.201.a:0 "颁行总督特许状妥协方案"
 oe_wp33.201.b:0 "严申王室重商与关税督察"
 oe_wp33.201.c:0 "仅归档本次殖民稽核卷宗"
 oe_wp33.202.t:0 "列强专属机制简报"
 oe_wp33.202.d_byz:0 "帝国书记处已整理罗马-拜占庭治国全卷。拜占庭与复兴罗马拥有凤凰计划全套核心支柱：涵盖安纳托利亚八峰烽燧链、科拉学院及君堡/地中海奇观在内的28项伟大工程，兵工厂（Armamenton）、普罗诺亚（Pronoia）与官仓粮政（Sitonia），五牧首区教会外交，带绝嗣回归机制的帝国军区，以及已直接接入本控制台“帝国敕令”页签的《军事教范》三大战备动员。"
 oe_wp33.202.d_tur:0 "帝国迪万会议已梳理奥斯曼专属机制全卷。高门王朝拥有围绕卡皮库鲁禁卫军扩编与苏丹中枢集权博弈、边疆行省统辖、火药陆军革新与东地中海海权拓展的专属决议与改革链条。请在大举扩张之际审慎平衡军功贵族与朝廷稳定。"
 oe_wp33.202.d_per:0 "王室书院已汇总伊朗高原治国卷宗。波斯、白羊王朝与黑羊王朝解锁围绕奇兹尔巴什部族动员与古拉姆近卫官僚改革的专属决议，并串联丝绸之路商贸扶持与高原教派整合路径。"
 oe_wp33.202.d_rus:0 "沙皇枢密院已汇编罗斯大国机制卷宗。莫斯科与俄罗斯拥有“第三罗马”法统、服役贵族与中枢行政整编、草原边塞筑垒、正教自主教会及欧亚大陆东进拓展等一系列专属改革与事件链。"
 oe_wp33.202.d_ind:0 "帝国朝廷已整理南亚大国机制卷宗。莫卧儿、德里苏丹国与毗奢耶那伽罗各自拥有围绕曼萨布达尔与行省税册、多元宗教宽容或正统教法、德干高原军政经略及印度洋海贸枢纽的专属治国路径。"
 oe_wp33.202.d_west:0 "枢密院已核定西欧海权大国卷宗。法兰西、卡斯蒂利亚/西班牙与英格兰/不列颠解锁涵盖王权集权与议会宪章、海外殖民总督区、东印度及特许贸易公司、无敌舰队与皇家海军教范，以及革命时代浪潮的完整专属系统。"
 oe_wp33.202.d_east:0 "内阁大学士已进呈天朝大国机制卷宗。大明、中华帝国与大清拥有涵盖科举与内阁政务、海疆与朝贡体系、卫所/八旗边防治理及财政整顿的专属决议与改革路径，助您安度王朝周期危机。"
 oe_wp33.202.d_gp:0 "身为举世公认的列强，本国已全面解锁凤凰计划通用帝国系统：涵盖本控制台“帝国敕令”页签中的六大附庸总敕令、帝国文化融合法案、御前密电局谍报网、特许银行商行、海外殖民特许状以及列强危机应对体系。"
 oe_wp33.202.a:0 "推进中枢行政集权革新"
 oe_wp33.202.b:0 "促成宫廷与各阶层和解"
 oe_wp33.202.c:0 "归档本次列强机制简报"
 oe_wp33.203.t:0 "文化融合与同化方略"
 oe_wp33.203.d_default:0 "本国当前处于均衡默认文化方略。在法案界面中，王国与帝国级国家可解锁“帝国文化融合法案”，含古典同化、帝国多元主义、联邦米勒特制与学术汇通四大长期国策，并可配合宫廷语言与文化融合行动推进疆域整合。请选择一项立即生效的3年期文化行政方略："
 oe_wp33.203.d_assim:0 "当前方略：古典文化同化。各地官署正积极推广主体宫廷文化，与法案界面“古典同化”国策及本控制台“批量指令”中的文化融合令相得益彰。您可延续此路，或转为多元包容与学术汇通。"
 oe_wp33.203.d_cosmo:0 "当前方略：多元包容共治。帝国以成文法保障异质社群与教派安宁，最适合多民族广土帝国配合“帝国多元主义”或“联邦米勒特制”法案稳固统治。您可继续秉持包容，或转向同化与汇通。"
 oe_wp33.203.d_syncretic:0 "当前方略：学术汇通思潮。皇家学院与译馆正吸纳诸族学脉以加速思潮与科研进步，与“学术汇通”法案形成联动。请择定未来三年的文化方略："
 oe_wp33.203.a:0 "推行古典文化同化方略"
 oe_wp33.203.b:0 "推行多元包容共治方略"
 oe_wp33.203.c:0 "推行学术汇通思潮方略"
 oe_wp33.204.t:0 "伟大工程与帝国奇观清册"
 oe_wp33.204.d_byz:0 "帝国工部已清点全境奇观与支柱工程筹备状况。拜占庭与复兴罗马可在国家决议面板兴建安纳托利亚八峰烽燧链、格雷戈拉斯科拉学院、首都宫殿奇观、边疆要塞群与地中海伟大工程，同时统筹赛马场盛会、各大战区凯旋式、兵工厂、普罗诺亚领地及官仓粮政（Sitonia）储备。"
 oe_wp33.204.d_world:0 "全国各地大匠已完成基础设施与奇观工程勘测。请查阅“基础设施决议”与“国家专属决议”面板，随国库、稳定度与时代演进逐步解锁区域奇观、皇家学院、帝国大道与城防工程。工部当下应侧重大兴土木抑或官仓市政维护？"
 oe_wp33.204.a:0 "颁授帝国大匠营建特许"
 oe_wp33.204.b:0 "充实官仓粮秣与市政维护"
 oe_wp33.204.c:0 "仅登记本次奇观清册"
 oe_wp33.205.t:0 "帝国和平与双边条约稽核"
 oe_wp33.205.d_peace:0 "帝国文书房已刷新帝国总账附庸清册并稽核和平外交格局。和平时期核心可用的凤凰系统包括：“批量指令”与“帝国敕令”中的附庸统筹总令、特许银行商行与借贷监管、海贸租约、双边和平条约，以及自大航海时代起在决议面板解锁的“御前密电局”外交谍报体系。"
 oe_wp33.205.d_war:0 "帝国正处于战争状态，文书房已同步刷新帝国总账清册。建议在“战略手册”页签开启“战时紧急动员自动切换”令全体附庸自动转入固防征召，于“帝国总账”页签紧盯低忠诚或负债附庸，并善用特许银行信贷与外交安抚维系同盟阵线。"
 oe_wp33.205.a:0 "颁布帝国和平与御藩安抚"
 oe_wp33.205.b:0 "稽核特许银行与海贸租约"
 oe_wp33.205.c:0 "维持现行外交条约态势"
 oe_wp33.206.t:0 "战役与时代指引手册"
 oe_wp33.206.d_age1:0 "当前时代：传统时代。凤凰计划开局重心：稳固核心直辖领与附庸网络，借“帝国总账”页签盘点军区与附庸，在“战略手册”配置零开销自动化开关，善用“批量指令”推进建设或边防，并为文艺复兴时期的伟大工程与特许银行积蓄国库与稳定度。"
 oe_wp33.206.d_age2:0 "当前时代：文艺复兴时代。本时代核心解锁：筹建区域伟大工程、皇家学院与大道基建；晋升王国或帝国后启用“帝国文化融合法案”；筹设特许银行商行；并结合“批量指令”与“帝国敕令”规模化统御附庸体系。"
 oe_wp33.206.d_age3:0 "当前时代：大航海时代。海洋与新大陆全面展开：签发海外殖民特许状并将海外飞地整并为统一殖民总督区，在决议面板设立“御前密电局”掌控谍报，拓展海上丝路与海贸租约，并善用本页“殖民脉搏”统筹海外殖民领。"
 oe_wp33.206.d_age4:0 "当前时代：宗教改革时代。信仰博弈与全球大交换加速：触发“全球哥伦布大交换”决议引入新大陆高产作物或旧大陆农牧，通过本页“文化方略”权衡同化与宽容路线，并加固军区与边疆要塞防线。"
 oe_wp33.206.d_age5:0 "当前时代：专制时代。中央集权与全球霸权并进：平衡王室权力与各阶层满意度，审慎抉择“殖民自治宪章”与日渐高涨的海外独立倾向（海外殖民领独立倾向达55+将可宣告独立），并充分发动列强专属改革与特许贸易公司。"
 oe_wp33.206.d_age6:0 "当前时代：革命时代。凤凰计划终局时代到来：直面革命浪潮、立宪与工业化转型、殖民地独立风云与后期列强危机。请全面运用五页签凤凰帝国总控台统筹全球附庸、战时动员与外交大局。"
 oe_wp33.206.a:0 "确立时代革新与科研纲领"
 oe_wp33.206.b:0 "拓展战略外交与寰宇视野"
 oe_wp33.206.c:0 "合上战役与时代指引手册"
 OE_WP33_DIR_BUILD_TITLE:0 "帝国兴建总令"
 OE_WP33_DIR_BUILD_DESC:0 "所有附庸与军区获得+10%建造速度、+10%月度发展修正与-10%原料产地建造耗时（持续5年）。"
 OE_WP33_DIR_BUILD_TT:0 "向所有符合条件的附庸、封邑、军区、总督区、边区与朝贡国颁布帝国兴建总令。自动替换既有指令，切换冷却14天。"
 OE_WP33_ACTIVE_DIR_1:0 "帝国兴建总令"
 OE_WP33_DIR_ASSIMILATE_TITLE:0 "帝国文化融合总令"
 OE_WP33_DIR_ASSIMILATE_DESC:0 "所有附庸与军区获得+25%人口文化同化速度与+0.20%月度控制力增长（持续5年）。"
 OE_WP33_DIR_ASSIMILATE_TT:0 "统筹所有附庸与边疆军区推进文化融合与行政管控。自动替换既有指令，切换冷却14天。"
 OE_WP33_ACTIVE_DIR_2:0 "帝国文化融合总令"
 OE_WP33_DIR_CONVERT_TITLE:0 "教会宣教归正令"
 OE_WP33_DIR_CONVERT_DESC:0 "所有附庸与军区获得+25%人口宗教转化速度与+15%宣教建筑效能（持续5年）。"
 OE_WP33_DIR_CONVERT_TT:0 "向所有附庸与军区派遣教会宣教团加速宗教统一。自动替换既有指令，切换冷却14天。"
 OE_WP33_ACTIVE_DIR_3:0 "教会宣教归正令"
 OE_WP33_DIR_MILITARY_TITLE:0 "边塞固防与征召动员令"
 OE_WP33_DIR_MILITARY_DESC:0 "所有附庸与边疆军区获得+15%要塞防御、+15%征召兵规模与+20%征召速度（持续5年）。"
 OE_WP33_DIR_MILITARY_TT:0 "令边疆军区、边区及全体附庸进入固防与征召战备状态。自动替换既有指令，切换冷却14天。"
 OE_WP33_ACTIVE_DIR_4:0 "边塞固防与征召动员令"
 OE_WP33_DIR_FISCAL_TITLE:0 "帝国财赋稽核令"
 OE_WP33_DIR_FISCAL_DESC:0 "宗主国获得+10%附庸进贡收入；附庸获得+9%税收效率，但对宗主忠诚度-5（持续5年）。"
 OE_WP33_DIR_FISCAL_TT:0 "全面稽核各附庸与军区的赋税与贡金，以轻微忠诚度代价换取更高财政回报。自动替换既有指令，切换冷却14天。"
 OE_WP33_ACTIVE_DIR_5:0 "帝国财赋稽核令"
 OE_WP33_AUTO_DIR_TITLE:0 "自动续期现行附庸总令"
 OE_WP33_AUTO_DIR_DESC:0 "每年战略手册例行脉冲自动为既有及新获附庸续期现行总令，无需手动补发。"
 OE_WP33_AUTO_DIR_TT:0 "开关现行批量附庸指令的年度自动续期（仅对玩家生效，零逐帧脚本开销）。"
 OE_WP33_AUTO_SUB_TITLE:0 "自动拨款补贴困境边疆军区与附庸"
 OE_WP33_AUTO_SUB_DESC:0 "当国库余额不低于500金币时，每年最多向3个财政困境或低忠诚附庸各拨款50金币并降低5点独立倾向。"
 OE_WP33_AUTO_SUB_TT:0 "开关困境边疆军区与附庸自动拨款补贴，严格遵守500金币国库安全底线及单附庸2年冷却。"
 OE_WP33_QUIET_ADMIN_TITLE:0 "静默常规政务通知模式"
 OE_WP33_QUIET_ADMIN_DESC:0 "开启后台静默模式：战略手册自动化与帝国总账例行盘点安静运行，减少常规政务干扰。"
 OE_WP33_QUIET_ADMIN_TT:0 "切换指令坞常规政务后台静默运行模式，所有自动效果照常生效。"
 OE_WP33_AUTO_WAR_TITLE:0 "战时紧急动员自动切换"
 OE_WP33_AUTO_WAR_DESC:0 "进入战争状态时自动记录平时指令并切换为边塞固防与征召动员令；和平后自动恢复原指令。"
 OE_WP33_AUTO_WAR_TT:0 "开关战时自动切换动员总令并在战后恢复原平时指令的功能。"
 OE_WP33_WP47_DIR_1_TITLE:0 "总括财赋征调敕令"
 OE_WP33_WP47_DIR_1_DESC:0 "宗主+12%附庸进贡收入；全体附庸+12%税收效率、-8对宗主忠诚度、+5独立倾向（持续5年）。"
 OE_WP33_WP47_DIR_1_TT:0 "帝国全境附庸敕令（需求：附庸数>=2，共享5年冷却）。立即向全体符合条件的附庸颁布总括财赋征调敕令，自动替换既有帝国附庸敕令。"
 OE_WP33_WP47_ACTIVE_1:0 "总括财赋征调"
 OE_WP33_WP47_DIR_2_TITLE:0 "全境边防总动员敕令"
 OE_WP33_WP47_DIR_2_DESC:0 "全体附庸+15%人力、+15%征召规模、+20%征召速度、+3%训练度、-4对宗主忠诚度（持续5年）。"
 OE_WP33_WP47_DIR_2_TT:0 "帝国全境附庸敕令（需求：附庸数>=2，共享5年冷却）。令全体符合条件的附庸与军区全面进入战时征召动员状态。"
 OE_WP33_WP47_ACTIVE_2:0 "全境边防总动员"
 OE_WP33_WP47_DIR_3_TITLE:0 "正教宣化总令"
 OE_WP33_WP47_DIR_3_DESC:0 "全体附庸+25%人口宗教转化速度、+20%宣教建筑效能、+5%教士满意度（持续5年）。"
 OE_WP33_WP47_DIR_3_TT:0 "帝国全境附庸敕令（需求：附庸数>=2，共享5年冷却）。向全体符合条件的附庸与军区派遣帝国宣教团加速宗教统一。"
 OE_WP33_WP47_ACTIVE_3:0 "正教宣化总令"
 OE_WP33_WP47_DIR_4_TITLE:0 "文化融合与行政统辖敕令"
 OE_WP33_WP47_DIR_4_DESC:0 "全体附庸+25%人口文化同化速度、+0.25%月度控制力、+10%控制力传播速度（持续5年）。"
 OE_WP33_WP47_DIR_4_TT:0 "帝国全境附庸敕令（需求：附庸数>=2，共享5年冷却）。统筹全体附庸与军区推进文化融合与帝国行政统辖。"
 OE_WP33_WP47_ACTIVE_4:0 "文化融合统辖"
 OE_WP33_WP47_DIR_5_TITLE:0 "边塞坚壁筑城敕令"
 OE_WP33_WP47_DIR_5_DESC:0 "全体附庸+20%要塞防御、+2%守军增长、+20%守军规模、+0.50敌军损耗（持续5年）。"
 OE_WP33_WP47_DIR_5_TT:0 "帝国全境附庸敕令（需求：附庸数>=2，共享5年冷却）。令全体附庸与边疆军区坚壁清野、加固要塞与守军防线。"
 OE_WP33_WP47_ACTIVE_5:0 "边塞坚壁筑城"
 OE_WP33_WP47_DIR_6_TITLE:0 "怀柔安抚总令"
 OE_WP33_WP47_DIR_6_DESC:0 "消耗60金币与5威望：附庸-10独立倾向、+25好感、+12忠诚；宗主+8附庸忠诚、+1外交声誉（5年）。"
 OE_WP33_WP47_DIR_6_TT:0 "帝国全境附庸敕令（需求：附庸数>=2、金币>=60、威望>=5，共享5年冷却）。颁赐荣衔与特许状全面安抚诸附庸与军区。"
 OE_WP33_WP47_ACTIVE_6:0 "怀柔安抚总令"
 OE_WP33_WP47_PRAE_FLEET_TITLE:0 "动员帝国军区舰队"
 OE_WP33_WP47_PRAE_FLEET_DESC:0 "消耗75金币（需港口）：+12个月水手、+5海军传统、+25%造船与水手、+15%桨帆战力、+10%海军士气（5年）。"
 OE_WP33_WP47_PRAE_FLEET_TT:0 "《军事教范》战时总动员（拜占庭/罗马专属，需求：拥有港口、金币>=75，5年冷却）。与国家军区舰队动员行动共用冷却。"
 OE_WP33_WP47_PRAE_TAGMATA_TITLE:0 "点验帝国中央禁军（塔格马塔）"
 OE_WP33_WP47_PRAE_TAGMATA_DESC:0 "消耗90金币：+6个月人力、+5陆军传统、+15%重骑战力、+5%训练度、+8%陆军士气、+10%移速（5年）。"
 OE_WP33_WP47_PRAE_TAGMATA_TT:0 "《军事教范》战时总动员（拜占庭/罗马专属，需求：金币>=90，5年冷却）。与国家中央禁军点验行动共用冷却。"
 OE_WP33_WP47_PRAE_ROADS_TITLE:0 "护持帝国大道与名刹修院"
 OE_WP33_WP47_PRAE_ROADS_DESC:0 "消耗100金币（需和平）：+6威望、+4正统、+8%教士满意度、+15%控制传播，并提升君堡/塞萨洛尼基/圣山/特里卡拉繁荣控制（5年）。"
 OE_WP33_WP47_PRAE_ROADS_TT:0 "《军事教范》内政护持（拜占庭/罗马专属，需求：处于和平、金币>=100，5年冷却）。与国家大道与名刹护持行动共用冷却。"
 OE_WP33_COMPASS_COL_TITLE:0 "殖民帝国与自治脉搏"
 OE_WP33_COMPASS_COL_DESC:0 "拥有海外殖民地、殖民特许状或身为殖民领时可用。赋予1年殖民稽核修正（+8%殖民迁移、+4附庸忠诚、-2%阶层满意度），并开启四大殖民特许/自治/独立决议指引。"
 OE_WP33_COMPASS_COL_TT:0 "需求：拥有海外殖民附庸、殖民特许状，或自身为殖民领（冷却180天）。施加1年殖民稽核修正并开启殖民体系总览事件。"
 OE_WP33_COMPASS_GP_TITLE:0 "列强专属机制简报"
 OE_WP33_COMPASS_GP_DESC:0 "为主要列强（拜占庭/罗马、奥斯曼、波斯、罗斯、莫卧儿/印度、法兰西、西班牙、不列颠、明/清）及任意列强开启专属机制简报，梳理独有决议、制度与改革路径。"
 OE_WP33_COMPASS_GP_TT:0 "列强或指定历史大国可用（奥斯曼、波斯、罗斯、莫卧儿、德里、毗奢耶那伽罗、法兰西、卡斯蒂利亚/西班牙、英格兰/不列颠、拜占庭/罗马、明/清等），冷却180天。"
 OE_WP33_COMPASS_CUL_TITLE:0 "文化融合与同化方略"
 OE_WP33_COMPASS_CUL_DESC:0 "检视帝国文化整合姿态，在“加速同化”“多元宽容”“学术汇通”三项带代价方略间切换，并指引帝国文化融合法案与宫廷语言路径。"
 OE_WP33_COMPASS_CUL_TT:0 "开启文化融合与同化方略切换面板（冷却180天），检视帝国文化融合法案并切换3年期平衡修正姿态。"
 OE_WP33_COMPASS_WON_TITLE:0 "伟大工程与帝国奇观清册"
 OE_WP33_COMPASS_WON_DESC:0 "汇总帝国奇观与伟大工程筹备度、拜占庭/罗马兵工厂/普罗诺亚/粮仓制度状态及区域营建投资路径，可选颁布大匠特许状或粮仓市政令。"
 OE_WP33_COMPASS_WON_TT:0 "查阅伟大工程与帝国奇观清册（冷却180天），核对营建前置条件并可选颁布3年期大匠营建或粮仓市政修正。"
 OE_WP33_COMPASS_DIP_TITLE:0 "帝国和平与双边条约稽核"
 OE_WP33_COMPASS_DIP_DESC:0 "刷新帝国总账附庸清册，汇总现行附庸特许状、特许银行商行、海贸租约、御前密电局与和平外交态势，并可选颁布和平安抚或海贸租约稽核。"
 OE_WP33_COMPASS_DIP_TT:0 "执行帝国和平与双边条约稽核（冷却180天），同步刷新附庸清册并开启外交、特许银行与海贸租约简报。"
 OE_WP33_COMPASS_ERA_TITLE:0 "战役与时代指引手册"
