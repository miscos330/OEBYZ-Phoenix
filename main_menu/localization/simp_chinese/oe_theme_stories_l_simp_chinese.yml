 oe_theme_story.19.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.19.c: "各让一步"
 oe_theme_story.19.c.tt: "[oe_tu_authority|e]#R −3#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +3#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]忠诚#G +3#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.20.t: "将军宿怨"
 oe_theme_story.20.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]和[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetGovernment.GetRuler.GetName]的旧怨又起，两人在给皇帝的奏报里互相攻讦。"
 oe_theme_story.20.a: "居中调解"
 oe_theme_story.20.a.tt: "[oe_tu_authority|e]#R −3#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.20.b: "分而治之"
 oe_theme_story.20.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n#Y 10#!年内[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]和[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]都不会响应其他军区的连锁起兵"
 oe_theme_story.20.c: "坐视"
 oe_theme_story.20.c.tt: "随机一方忠诚#R −10#!（计入忠诚目标#Y 5#!年）"
 oe_theme_story.21.t: "联手御敌"
 oe_theme_story.21.d: "敌军正在围攻[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]辖内的城池。[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]派人飞马求援：离得最近的是[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]的兵马，可京城的援军也在路上。"
 oe_theme_story.21.a: "令[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]出兵"
 oe_theme_story.21.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.21.b: "由中央驰援"
 oe_theme_story.21.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.22.t: "京城大阅"
 oe_theme_story.22.d: "各军区的将军齐聚京城，准备在竞技场前接受皇帝检阅。排场大小，全凭皇帝一句话。"
 oe_theme_story.22.a: "盛大阅兵"
 oe_theme_story.22.a.tt: "所有军区忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.22.b: "从简"
 oe_theme_story.22.b.tt: "所有军区忠诚#G +2#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.23.t: "海盗横行"
 oe_theme_story.23.d: "突厥埃米尔的轻舟又出现在[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的海面上，劫走商船，掳走沿岸的村民。艾登的乌穆尔之流，从来不缺效仿的人。"
 oe_theme_story.23.a: "出海清剿"
 oe_theme_story.23.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +15#!（#Y 5#!年）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.23.b: "缴纳赎金"
 oe_theme_story.23.c: "商船结队护航"
 oe_theme_story.23.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]财政效率#R −10#!（#Y 5#!年）"
 oe_theme_story.24.t: "意商求港"
 oe_theme_story.24.d: "热那亚和威尼斯的商人来到[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]，想在港口租一片码头和仓库，并请求减免关税。"
 oe_theme_story.24.a: "给予特许"
 oe_theme_story.24.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]财政效率#R −10#!（#Y 5#!年）"
 oe_theme_story.24.b: "只许短期"
 oe_theme_story.24.c: "拒绝"
 oe_theme_story.24.c.tt: "热那亚和威尼斯对我们的好感下降（逐年恢复）"
 oe_theme_story.25.t: "海火残卷"
 oe_theme_story.25.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的工匠在旧兵器库里翻出几页残卷，上面记着“海火”的配方和虹吸管的做法，字迹已经模糊。"
 oe_theme_story.25.a: "资助复原"
 oe_theme_story.25.a.tt: "东罗马获得[ShowModifier('oe_ts_sea_fire')]，持续#Y 20#!年（海军士气#G +10%#!）"
 oe_theme_story.25.b: "献入宫中秘藏"
 oe_theme_story.26.t: "拉丁诸侯"
 oe_theme_story.26.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的拉丁领主联名上书，要求保留他们世袭的采邑和法庭。"
 oe_theme_story.26.a: "保留封建特权"
 oe_theme_story.26.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +15#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]民政效率#R −10#!（#Y 5#!年）"
 oe_theme_story.26.b: "推行罗马法"
 oe_theme_story.26.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]民政效率#G +15#!（#Y 5#!年）"
 oe_theme_story.27.t: "主教之争"
 oe_theme_story.27.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的主教座堂里同时坐着一位拉丁主教和一位希腊主教，双方的信众已经在街上动了手。"
 oe_theme_story.27.a: "支持正教主教"
 oe_theme_story.27.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.27.b: "两教并存"
 oe_theme_story.27.b.tt: "[oe_tu_authority|e]#R −2#!"
 oe_theme_story.28.t: "城市议会"
 oe_theme_story.28.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的城市议会要求自己管理市场和城防，只向帝国缴纳定额的贡金。"
 oe_theme_story.28.a: "承认议会"
 oe_theme_story.28.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]财政效率#G +15#!（#Y 5#!年）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[oe_tu_authority|e]#R −2#!"
 oe_theme_story.28.b: "解散议会"
 oe_theme_story.28.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年\n[oe_tu_authority|e]#G +2#!"
 oe_theme_story.29.t: "圣德米特里节"
 oe_theme_story.29.d: "十月的圣德米特里节，塞萨洛尼基城里挤满了商人和朝圣者。城中的权贵和码头上的水手行会却为节庆的开销吵了起来，水手们说，城里的钱都进了权贵的口袋。"
 oe_theme_story.29.a: "偏向权贵"
 oe_theme_story.29.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]司法效率#R −10#!（#Y 5#!年）\n城中的水手和平民会记住这件事"
 oe_theme_story.29.b: "安抚行会"
 oe_theme_story.29.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]民政效率#G +15#!（#Y 5#!年）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n城中的权贵会记住这件事"
 oe_theme_story.29.c: "两不相帮"
 oe_theme_story.30.t: "米斯特拉的宫廷"
 oe_theme_story.30.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]在米斯特拉的宫廷聚起了一批学者和工匠，人们开始叫它“小君士坦丁堡”。将军请求皇帝赐予专制公的头衔。"
 oe_theme_story.30.a: "赐予专制公头衔"
 oe_theme_story.30.a.tt: "[oe_tu_authority|e]#R −5#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +20#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.30.b: "资助学者"
 oe_theme_story.30.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]民政效率#G +15#!（#Y 5#!年）"
 oe_theme_story.30.c: "一切照旧"
 oe_theme_story.30.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.31.t: "加布拉斯家族"
 oe_theme_story.31.d: "卡尔迪亚的山民只认加布拉斯家族。两百年前，这个家族的公爵曾在这里自立。如今他们的后人要求按旧例自己统领边军。"
 oe_theme_story.31.a: "准其按旧例统兵"
 oe_theme_story.31.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +15#!，并计入忠诚目标#Y 5#!年\n[oe_tu_authority|e]#R −2#!"
 oe_theme_story.31.b: "征调边军入京"
 oe_theme_story.31.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +15#!（#Y 5#!年）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.32.t: "克里特的庄园"
 oe_theme_story.32.d: "威尼斯人统治克里特时分出去的庄园，如今还在拉丁地主手里，希腊农民要求分回土地。"
 oe_theme_story.32.a: "保留庄园"
 oe_theme_story.32.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]财政效率#G +15#!（#Y 5#!年）"
 oe_theme_story.32.b: "分田给农民"
 oe_theme_story.32.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]财政效率#R −10#!（#Y 5#!年）"
 oe_theme_story.33.t: "曼古普的哥特人"
 oe_theme_story.33.d: "曼古普的山城里还住着说日耳曼语的哥特人，他们的王公自称狄奥多罗之主，愿意向皇帝称臣，只求保住自己的港口和葡萄园。"
 oe_theme_story.33.a: "承认哥特王公"
 oe_theme_story.33.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.33.b: "开放港口贸易"
 oe_theme_story.33.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]财政效率#G +15#!（#Y 5#!年）"
 oe_theme_story.34.t: "尼西亚城下"
 oe_theme_story.34.d: "奥斯曼人的营帐又扎到了尼西亚城外。古老的城墙见过第一次大公会议，也见过十字军，现在它需要人来守。"
 oe_theme_story.34.a: "修缮城墙"
 oe_theme_story.34.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]营建效率#G +15#!（#Y 5#!年）"
 oe_theme_story.34.b: "与奥斯曼人互市"
 oe_theme_story.34.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.34.c: "出兵驱逐"
 oe_theme_story.34.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +15#!（#Y 5#!年）"
