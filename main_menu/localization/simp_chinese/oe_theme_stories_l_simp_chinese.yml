 oe_theme_story.5.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]在[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]屡战屡胜，市井都在传唱其名。人们开始拿此人和皇帝比较，这种比较对皇帝并不有利。"
 oe_theme_story.5.a: "许其凯旋入城"
 oe_theme_story.5.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.5.b: "加授尊号"
 oe_theme_story.5.b.tt: "[oe_tu_authority|e]#R −5#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +20#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.5.c: "低调处理"
 oe_theme_story.5.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.6.t: "截获密信"
 oe_theme_story.6.d: "宫中的密探截下了一封[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]写给外人的信。措辞含糊，却足以让人起疑。"
 oe_theme_story.6.a: "当面质问"
 oe_theme_story.6.a.tt: "#Y 60%#!：将军认罪，[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!（计入忠诚目标#Y 5#!年）\n#Y 40%#!：将军惊惧，[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，且有#R 20%#!的可能下月起兵"
 oe_theme_story.6.b: "暗中监视"
 oe_theme_story.6.b.tt: "[oe_tu_authority|e]#R −2#!\n下次[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚跌破#Y 30#!时立即发出预警"
 oe_theme_story.6.c: "立即撤换"
 oe_theme_story.6.c.tt: "#Y 70%#!：[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]卸任，由新将军接任\n#R 30%#!：[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]拒绝交出兵权，下月起兵"
 oe_theme_story.7.t: "游骑犯边"
 oe_theme_story.7.d: "异教游骑越过边界，劫掠了[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的几座村庄。边民都在看将军怎么做。"
 oe_theme_story.7.a: "出兵追击"
 oe_theme_story.7.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +15#!（#Y 5#!年）"
 oe_theme_story.7.b: "加固要塞"
 oe_theme_story.7.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]立即开工修筑要塞，工程费由军区金库支付；已有工程在建时，改为军区金库#R −80#!"
 oe_theme_story.7.c: "坚壁清野"
 oe_theme_story.7.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]辖区各地获得[ShowModifier('oe_ts_scorched_earth')]（#Y 5#!年）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.8.t: "边疆英雄"
 oe_theme_story.8.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的边地出了一位以一当十的阿克里泰。人们说，迪吉尼斯又回来了。"
 oe_theme_story.8.a: "授予军役田"
 oe_theme_story.8.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +15#!（#Y 5#!年）"
 oe_theme_story.8.b: "召入京城禁卫"
 oe_theme_story.8.c: "令诗人传唱"
 oe_theme_story.9.t: "越境逃民"
 oe_theme_story.9.d: "战火那边的百姓拖家带口逃进[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]，只求一块能种的地。"
 oe_theme_story.9.a: "安置垦荒"
