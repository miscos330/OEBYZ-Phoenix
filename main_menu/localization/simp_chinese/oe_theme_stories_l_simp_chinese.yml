 oe_theme_story.1.t: "新官上任"
 oe_theme_story.1.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]刚到[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]上任。按旧例，新任将军要从京城领走印绶仪仗，地方上的人就看这排场，来掂量此人在皇帝心里的分量。"
 oe_theme_story.1.a: "赐印绶仪仗"
 oe_theme_story.1.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.1.b: "派皇室监军随行"
 oe_theme_story.1.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]司法效率#G +15#!（#Y 5#!年）"
 oe_theme_story.1.c: "照常"
 oe_theme_story.2.t: "豪门求亲"
 oe_theme_story.2.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]的豪族托人向[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]提亲。两家联姻之后，将军在地方上的根基会更稳，豪族的手也会伸进军营。"
 oe_theme_story.2.a: "准许联姻"
 oe_theme_story.2.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年\n[oe_tu_authority|e]#R −2#!"
 oe_theme_story.2.b: "赐婚皇族旁支"
 oe_theme_story.2.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +15#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.2.c: "不许"
 oe_theme_story.2.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.3.t: "父死子继"
 oe_theme_story.3.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]年事已高，上书请求日后由儿子接掌[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]。军区一旦成了世袭的家业，下一位皇帝未必还管得动它。"
 oe_theme_story.3.a: "口头允诺"
 oe_theme_story.3.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +15#!，并计入忠诚目标#Y 5#!年\n[oe_tu_authority|e]#R −3#!"
 oe_theme_story.3.b: "召其子入京为质"
 oe_theme_story.3.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年\n[oe_tu_authority|e]#G +2#!"
 oe_theme_story.3.c: "婉拒"
 oe_theme_story.3.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.4.t: "老将请辞"
 oe_theme_story.4.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]请求解甲归田。此人在[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]多年，老兵们只认其旗号。"
 oe_theme_story.4.a: "准其荣归"
 oe_theme_story.4.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]卸任，由新将军接任\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年"
 oe_theme_story.4.b: "挽留"
 oe_theme_story.4.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#G +5#!，并计入忠诚目标#Y 5#!年\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +10#!（#Y 5#!年）"
