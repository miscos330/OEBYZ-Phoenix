 oe_theme_story.13.a: "重申巴西尔二世的护田法令"
 oe_theme_story.13.a.tt: "[oe_tu_authority|e]#G +2#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]军务效率#G +15#!（#Y 5#!年）\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]忠诚#R −10#!，并计入忠诚目标#Y 5#!年"
