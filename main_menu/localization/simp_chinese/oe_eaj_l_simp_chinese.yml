# NEW 2026-11-22 v11.5 Worker 3 (oe_eaj_). Generated by gen_v115_japan_korea.py; edit the generator, not this file.
 oe_eaj_jiphyeonjeon_gunsmith_foundry: "学士院、铁炮坊与船坞"
 oe_eaj_jiphyeonjeon_gunsmith_foundry_desc: "把学士院、铁炮作坊与战船船坞设在一处的官营工场。只能建在京都、江户、大阪、堺、长崎、博多、开京、汉城、东莱与顺天，每地一座；建在首都时另有全国加成。需要“石见灰吹银”科技。"
 oe_eaj_jiphyeonjeon_gunsmith_foundry_maint: "日常维护"
 oe_eaj_maritime_policy_law: "海国国策"
 oe_eaj_maritime_policy_law_desc: "日本四面环海。是闭关自守，只留一个窗口，还是发给商船朱印状，放他们远航？"
 oe_eaj_pol_sakoku_dejima: "锁国与出岛"
 oe_eaj_pol_sakoku_dejima_desc: "禁止国人出海，外国商船只许停靠长崎的一座人工岛。西洋的学问仍从这扇窗口传进来。"
 oe_eaj_pol_shuinsen_pacific: "朱印船"
 oe_eaj_pol_shuinsen_pacific_desc: "持朱印状的商船受幕府保护，可以远航南洋各港。"
 oe_eaj_joseon_naval_scholarship_law: "实学与海防"
 oe_eaj_joseon_naval_scholarship_law_desc: "国家的精力有限：是兴文教，还是整水师？"
 oe_eaj_pol_hunminjeongeum_silhak: "正音与实学"
 oe_eaj_pol_hunminjeongeum_silhak_desc: "推行人人学得会的拼音文字，由学士院编印农书、医书与历法。"
 oe_eaj_pol_panokseon_naval_defense: "板屋船水师"
 oe_eaj_pol_panokseon_naval_defense_desc: "造平底双层的板屋船，舷侧列炮，辅以覆顶的龟船。"
 oe_eaj_tenka_fubu_bakufu_reform: "天下布武"
 oe_eaj_tenka_fubu_bakufu_reform_desc: "兵农分离，收缴民间兵器，丈量全国田亩；大名的常备铁炮队只听一个号令。"
 oe_eaj_joseon_uijeongbu_reform: "议政府与集贤殿"
 oe_eaj_joseon_uijeongbu_reform_desc: "由议政府总领六曹，另设集贤殿聚集年轻学士，专事著述与进讲。"
 oe_eaj_priv_sakai_shuinsen_merchants: "豪商特许"
 oe_eaj_priv_sakai_shuinsen_merchants_desc: "承认堺与博多豪商的自治，许他们持朱印状出海。"
 oe_eaj_priv_yangban_seowon_academies: "书院与乡兵"
 oe_eaj_priv_yangban_seowon_academies_desc: "准许两班在乡里自建书院、免其田税；有外敌入侵时，书院的儒生就是义兵的首领。"
 oe_eaj_adv_hunminjeongeum_metal_type: "金属活字"
 oe_eaj_adv_hunminjeongeum_metal_type_desc: "用铜铸的活字印书，又快又清楚。"
 oe_eaj_adv_tanegashima_volley_fire: "铁炮轮射"
 oe_eaj_adv_tanegashima_volley_fire_desc: "铁炮足轻分成数列，轮番装填射击，弹雨不绝。"
 oe_eaj_adv_iwami_haifuki_silver: "石见灰吹银"
 oe_eaj_adv_iwami_haifuki_silver_desc: "用灰吹法从矿石里提炼白银，产量大增。解锁建筑“学士院、铁炮坊与船坞”。"
 oe_eaj_adv_geobukseon_hakikjin: "龟船与鹤翼阵"
 oe_eaj_adv_geobukseon_hakikjin_desc: "覆顶带刺的龟船冲乱敌阵，主力舰队展开成鹤翼，以舷炮合围。"
 oe_eaj_player_only_tt: "只有玩家操控的国家可以使用"
 oe_eaj_dec_kango_tally_compact.title: "重定勘合通商"
 oe_eaj_dec_kango_tally_compact.desc: "遣使与大陆朝廷议定勘合贸易，以换取铜钱、生丝与书籍。花费 100 金币，效果持续 15 年。"
 oe_eaj_dec_kango_tally_compact.a: "遣使"
 oe_eaj_dec_iwami_haifuki_boom.title: "石见银山大扩产"
 oe_eaj_dec_iwami_haifuki_boom.desc: "请来懂灰吹法的工匠，大举开采石见银山；白银多了，首都市场上对瓷器、茶叶与丝绸的需求也随之上涨。需要拥有石见；花费 150 金币，效果持续 20 年。"
 oe_eaj_dec_iwami_haifuki_boom.a: "扩产"
 oe_eaj_dec_edo_sakoku_or_shuinsen.title: "定都江户，决定国策"
 oe_eaj_dec_edo_sakoku_or_shuinsen.desc: "在江户营建新都，并就锁国还是开海作出决断。需要拥有江户，并且已到 1580 年；花费 250 金币。所选国策的效果持续 30 年。"
 oe_eaj_dec_edo_sakoku_or_shuinsen.a: "营建"
 oe_eaj_dec_sejong_hunminjeongeum.title: "颁行训民正音"
 oe_eaj_dec_sejong_hunminjeongeum.desc: "由集贤殿创制新文字并颁行全国。需要朝鲜王朝已经建立并拥有汉城；花费 150 金币，效果持续 20 年。"
 oe_eaj_dec_sejong_hunminjeongeum.a: "颁行"
 oe_eaj_dec_yi_sunsin_turtle_fleet.title: "敕造龟船水师"
 oe_eaj_dec_yi_sunsin_turtle_fleet.desc: "在南方各水营赶造板屋船与龟船。需要有港口，并且渡海大战已经爆发或已有“龟船与鹤翼阵”科技；花费 200 金币，效果持续 20 年。"
 oe_eaj_dec_yi_sunsin_turtle_fleet.a: "下令"
 oe_eaj.1.title: "勘合符"
 oe_eaj.1.desc: "使节带回了勘合符：持符的官船可以入港贸易，没有符的一律视为海寇。西国的大名与商人都想分到几道。"
 oe_eaj.1.a: "由幕府统一掌管"
 oe_eaj.1.b: "分给出资的大名与寺社"
 oe_eaj.2.title: "下克上"
 oe_eaj.2.desc: "京都的号令出不了城。各地的守护被家臣取代，家臣又被自己的家臣取代。有本事的人看到了机会。"
 oe_eaj.2.a: "整顿军制，扩充足轻"
 oe_eaj.2.b: "结好朝廷与邻国"
 oe_eaj.3.title: "铁炮传来"
 oe_eaj.3.desc: "一艘外国船漂到了南方的种子岛，船上的人带着一种能在百步外击穿铠甲的火器。岛主出重金买下两支，命铁匠仿造。"
 oe_eaj.3.a: "重金求购，命堺的铁匠量产"
 oe_eaj.3.b: "不过是奇巧之物"
 oe_eaj.4.title: "银潮"
 oe_eaj.4.desc: "石见的银山用上了灰吹法，出银成倍增加。外国商船闻风而来，愿意用生丝、瓷器换银。"
 oe_eaj.4.a: "以银换货"
 oe_eaj.4.b: "存入府库"
 oe_eaj.5.title: "山门的僧兵"
 oe_eaj.5.desc: "比睿山上的大寺拥有僧兵数千，收容我们的敌人，还封锁了通往京都的道路。将领们请求动手，也有人劝说万万不可。"
 oe_eaj.5.a: "焚山"
 oe_eaj.5.b: "谈判，令其解除武装"
 oe_eaj.6.title: "南蛮船"
 oe_eaj.6.desc: "外国的大黑船开进了长崎，带来火药、生丝，也带来了传教士。当地的大名已经受洗。"
 oe_eaj.6.a: "开港通商"
 oe_eaj.6.b: "只许通商，不许传教"
 oe_eaj.7.title: "江户的决断"
 oe_eaj.7.desc: "新都已经建成，天下也已安定。现在要定下今后两百年的国策：闭关，还是开海？"
 oe_eaj.7.a: "锁国，只留长崎一口"
 oe_eaj.7.b: "发给朱印状，放商船远航"
 oe_eaj.8.title: "火筒都监"
 oe_eaj.8.desc: "一位官员花了多年向外国商人求教，终于学会了炼硝的办法。他请求设立专门的官署，造火药、火筒，装到战船上去打海寇。"
 oe_eaj.8.a: "设都监，造火筒战船"
 oe_eaj.8.b: "海寇不足为患"
 oe_eaj.9.title: "训民正音"
 oe_eaj.9.desc: "新创的二十八个字母，聪明人一个早上就能学会，笨人十天也够了。许多大臣上疏反对，说这会让人丢掉汉文。"
 oe_eaj.9.a: "颁行全国"
 oe_eaj.9.b: "先在宫中与官府试用"
 oe_eaj.10.title: "北疆的镇堡"
 oe_eaj.10.desc: "北方的部族屡屡越江劫掠。边将请求在沿江增设镇堡，移民实边，并配发新造的多发火箭车。"
 oe_eaj.10.a: "设镇移民，配发火车"
 oe_eaj.10.b: "以招抚为主"
 oe_eaj.11.title: "渡海大战"
 oe_eaj.11.desc: "海峡对岸集结了前所未见的大军与船队。这一仗将决定东亚的海疆归谁。"
 oe_eaj.11.a: "全国动员"
 oe_eaj.11.b: "先整水师，断其粮道"
 oe_eaj.12.title: "鹤翼阵"
 oe_eaj.12.desc: "水师在南海岸连战连捷：龟船先冲进敌阵，板屋船随后展开成鹤翼，舷炮齐发。敌人的运粮船过不来了。"
 oe_eaj.12.a: "乘胜追击"
 oe_eaj.12.b: "固守海峡"
 oe_eaj.13.title: "十三艘"
 oe_eaj.13.desc: "水师在一场败仗里几乎全军覆没，只剩十三艘战船。朝廷打算裁撤水师，让将士上岸作战。统帅上疏说：臣还有十三艘船。"
 oe_eaj.13.a: "准他在海峡迎战"
 oe_eaj.13.b: "向大陆朝廷求援"
 oe_eaj.14.title: "新的均势"
 oe_eaj.14.desc: "大战过去了几十年，两岸都在休养生息。对马的岛主来信，建议恢复使节往来。"
 oe_eaj.14.a: "互派通信使"
 oe_eaj.14.b: "海上仍须戒备"
 oe_eaj.90.title: "【读数】日本与朝鲜"
 oe_eaj.90.desc: "v11.5 日本与朝鲜读数（1 = 是，0 = 否）：\n· 本国是战区主角 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_protagonist')|0]#!，槽位 92 已运行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_pulses')|0]#! 次\n· 日本一方 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_japan')|0]#!，拥有领地 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_land')|0]#!，朝鲜半岛一方 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_korea')|0]#!，朝鲜王朝已建立 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_joseon')|0]#!\n· 拥有江户 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_edo')|0]#!，汉城 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_seoul')|0]#!，石见 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_iwami')|0]#!，种子岛 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_tane')|0]#!\n· 渡海大战已爆发 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_imjin')|0]#!，传教团已东来 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_jesuit')|0]#!，日本国策 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_path')|0]#!（1 锁国，2 朱印船）"
 oe_eaj.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_eaj_kango_trade_mod: "勘合贸易"
 STATIC_MODIFIER_DESC_oe_eaj_kango_trade_mod: "凭勘合符与大陆通商。"
 STATIC_MODIFIER_NAME_oe_eaj_teppo_mod: "仿造铁炮"
 STATIC_MODIFIER_DESC_oe_eaj_teppo_mod: "本国的铁匠已经能大量仿造铁炮。"
 STATIC_MODIFIER_NAME_oe_eaj_iwami_silver_mod: "银山大开"
 STATIC_MODIFIER_DESC_oe_eaj_iwami_silver_mod: "石见的白银源源运出。"
 STATIC_MODIFIER_NAME_oe_eaj_sakoku_mod: "锁国"
 STATIC_MODIFIER_DESC_oe_eaj_sakoku_mod: "海禁森严，国内安定。"
 STATIC_MODIFIER_NAME_oe_eaj_shuinsen_mod: "朱印船远航"
 STATIC_MODIFIER_DESC_oe_eaj_shuinsen_mod: "朱印船往来于南洋各港。"
 STATIC_MODIFIER_NAME_oe_eaj_hwatong_mod: "火筒都监"
 STATIC_MODIFIER_DESC_oe_eaj_hwatong_mod: "设官专造火药与火筒，装备战船。"
 STATIC_MODIFIER_NAME_oe_eaj_hunminjeongeum_mod: "训民正音"
 STATIC_MODIFIER_DESC_oe_eaj_hunminjeongeum_mod: "新文字颁行，百姓也能读书写信。"
 STATIC_MODIFIER_NAME_oe_eaj_hwacha_forts_mod: "北疆火车"
 STATIC_MODIFIER_DESC_oe_eaj_hwacha_forts_mod: "北方各镇配备了多发火箭车。"
 STATIC_MODIFIER_NAME_oe_eaj_turtle_fleet_mod: "龟船水师"
 STATIC_MODIFIER_DESC_oe_eaj_turtle_fleet_mod: "水师新造龟船，操练阵法。"
 STATIC_MODIFIER_NAME_oe_eaj_tongsinsa_mod: "通信使"
 STATIC_MODIFIER_DESC_oe_eaj_tongsinsa_mod: "两国互派使节，重开贸易。"
 STATIC_MODIFIER_NAME_oe_eaj_craft_synergy_mod: "船坞与窑业之利"
 STATIC_MODIFIER_DESC_oe_eaj_craft_synergy_mod: "扶持船坞或窑漆产业带来的收益。"
 STATIC_MODIFIER_NAME_oe_eaj_full_ai_mod: "东亚强邻"
 STATIC_MODIFIER_DESC_oe_eaj_full_ai_mod: "规则“强化电脑对手”给予的加成。"
