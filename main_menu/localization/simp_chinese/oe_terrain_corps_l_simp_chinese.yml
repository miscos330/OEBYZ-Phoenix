 oe_almogavars_1: "阿尔莫加瓦尔"
 oe_almogavars_1_desc: "阿尔莫加瓦尔曾是加泰罗尼亚大团锋利的矛尖。他们轻装行军，习惯在贫瘠山野中寻找道路与粮食，在敌阵尚未转向之前便从岩坡与灌丛间突入。如今，加泰罗尼亚已归帝国统辖，这些伊比利亚勇士的锋芒将朝向罗马的敌人。\n\n山地战斗 #G +100%#!，丘陵战斗 #G +50%#!，移动速度 #G +0.5#!，主动性 #G +2#!。\n\n解锁条件：东罗马及其各级附属国拥有加泰罗尼亚地区全部可征服地点。"
