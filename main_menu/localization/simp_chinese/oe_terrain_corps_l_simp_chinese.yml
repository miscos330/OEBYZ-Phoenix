 oe_albanian_pass_1: "阿尔巴尼亚隘口团"
 oe_albanian_pass_1_desc: "阿尔巴尼亚山民记得每一处隘口的风声与落石。他们在陡坡上扎稳脚步，以岩壁掩护侧翼，将强敌的兵力挤入狭窄的道路。隘口团并不以华丽的冲锋闻名，而以百折不挠的坚守，让帝国的敌人在群山之间付出代价。\n\n山地战斗 #G +125%#!，丘陵战斗 #G +25%#!，所受士气伤害 #G -20%#!，所受兵力伤害 #G -10%#!。\n\n解锁条件：东罗马及其各级附属国拥有阿尔巴尼亚地区全部可征服地点。"
