 oe_armenian_corps_1: "亚美尼亚战团"
 oe_armenian_corps_1_desc: "亚美尼亚的将领与战士曾为马其顿王朝撑起军阵。随着帝国重返安纳托利亚与东方高地，古老的服役传统再度延续。披甲的战团熟悉高原上的寒风和起伏丘陵，以坚固队列守住山脊，在崎岖的疆土上恢复罗马的军威。\n\n高原战斗 #G +100%#!，丘陵战斗 #G +75%#!，山地战斗 #G +25%#!，所受兵力伤害 #G -15%#!。\n\n解锁条件：东罗马及其各级附属国拥有亚美尼亚高地地区全部可征服地点。"
