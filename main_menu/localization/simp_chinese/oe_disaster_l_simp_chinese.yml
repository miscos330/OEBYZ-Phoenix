#=====================================
#tur_sword_crisis
#=====================================

tur_sword_crisis: "安纳托利亚空心化"
tur_sword_crisis_desc: "自11世纪40年代开始，来自呼罗珊的乌古斯突厥人出现在了东罗马亚美尼亚地区的边境上，开始对拜占庭的安纳托利亚领土进行劫掠和破坏。随着#bold #color_yellow 曼齐刻尔特战役#!#!的惨败导致东罗马在小亚细亚的边防彻底崩溃以及自巴西尔二世死后数十年的内乱和军区制瓦解导致安纳托利亚内陆的空心化，突厥游牧部落自亚美尼亚不断涌入，成为游荡在安纳托利亚内陆河谷和荒废的乡村间一个个相对独立的游牧团伙。\n尽管如今罗马已经重新征服了失去的土地，但是数百年来安纳托利亚空心化造成的可怕后果依然在这片土地上挥之不去，突厥骠骑的黑色阴影依然在高原上神出鬼没，不断反抗着我们的统治"
tur_sword_crisis_end_tt: ""

#=====================================
#fate of phoenix
#=====================================

oe_fate_of_the_phoenix: "凤凰涅槃"
oe_fate_of_the_phoenix_desc: "毫无疑问，帝国已经陷入了远比1204年，甚至历史上任何时候更加#bold #R 危险#!#!的境地，[ShowSituationName('rise_of_the_ottomans')]蚕食了我们在小亚细亚的重要兵源地，崛起的[GetCountry('SER').GetName]让我们的巴尔干领土不得安生，帝国境内更是因为连年的中央集权衰弱而一塌糊涂。但我们永远不会忘记我们是伟大的#bold #color_yellow 罗马人#!#!与[GetCountry('BYZ').GetCulture.GetName]#bold #color_yellow 人#!#!的后代，无论前方是怎样的黑暗与煎熬，我们都决心要把[GetCountry('BYZ').GetName]带向一个#bold #G 她从未预见过的未来#!#!"



