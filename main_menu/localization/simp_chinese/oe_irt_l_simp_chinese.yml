l_simp_chinese:
 oe_irt_b_sheep_rivalry: "黑白羊高原争霸宿怨"
 oe_irt_b_despina_alliance: "狄奥多拉联姻与东翼盟约"
 oe_irt_b_ottoman_pincer: "安纳托利亚东西夹击警讯"
 oe_irt_b_chaldiran_frontier: "查尔迪兰火药边疆敌对"
 STATIC_MODIFIER_NAME_oe_irt_black_sheep_ascendancy: "黑羊部大不里士霸权"
 STATIC_MODIFIER_DESC_oe_irt_black_sheep_ascendancy: "黑羊土库曼轻骑席卷阿塞拜疆与巴格达，士气与威望激增，但部落酋长势力膨胀并削弱中央控制。"
 STATIC_MODIFIER_NAME_oe_irt_tabriz_war_seat: "大不里士战时行营"
 STATIC_MODIFIER_DESC_oe_irt_tabriz_war_seat: "各部骑兵云集大不里士备战四方，兵源充沛却令城坊商民饱受骚扰。"
 STATIC_MODIFIER_NAME_oe_irt_persian_diwan: "波斯文官底万承续"
 STATIC_MODIFIER_DESC_oe_irt_persian_diwan: "延揽旧札剌亦儿与帖木儿文士主持财赋与省政，税效与内阁俱兴，却惹来游牧部落不满与轻骑懈怠。"
 STATIC_MODIFIER_NAME_oe_irt_white_sheep_surge: "乌尊·哈桑白羊崛起"
 STATIC_MODIFIER_DESC_oe_irt_white_sheep_surge: "白羊铁骑纵横大不里士、伊斯法罕与设拉子之间，军威与整合速度陡升，而部落尾大不掉与维稳开销亦同步攀升。"
 STATIC_MODIFIER_NAME_oe_irt_plateau_citadels: "伊朗高原名城守备"
 STATIC_MODIFIER_DESC_oe_irt_plateau_citadels: "依托大不里士、伊斯法罕、设拉子与赫拉特坚城拒敌，守御稳固且财税井然，却暂失草原争锋之锐气。"
 STATIC_MODIFIER_NAME_oe_irt_eastern_pincer: "本都—白羊东翼夹击同盟"
 STATIC_MODIFIER_DESC_oe_irt_eastern_pincer: "狄奥多拉·科穆宁公主远嫁白羊宫廷，联通特拉比松、君士坦丁堡与大不里士构成反奥斯曼东翼战线，跨教派联姻亦招致保守教士非议。"
 STATIC_MODIFIER_NAME_oe_irt_pontic_caravans: "特拉比松—大不里士商队协定"
 STATIC_MODIFIER_DESC_oe_irt_pontic_caravans: "避开危险的军事结盟，专务黑海至阿塞拜疆的生丝商队关税，商利稳健却难借外援磨砺军旅。"
 STATIC_MODIFIER_NAME_oe_irt_gunpowder_reforms: "奥特卢克贝利火器改制"
 STATIC_MODIFIER_DESC_oe_irt_gunpowder_reforms: "痛定思痛引入野战火炮与火绳枪车阵，纪律与炮兵战力大进，高昂炮兵维持费与游牧贵族抵制接踵而至。"
 STATIC_MODIFIER_NAME_oe_irt_turcoman_horsemen: "草原弓骑旧制坚守"
 STATIC_MODIFIER_DESC_oe_irt_turcoman_horsemen: "坚持以机动轻骑与部落突袭制胜，兵源恢复迅速、部落归心，却在火炮围城与阵地攻防中渐显短板。"
 STATIC_MODIFIER_NAME_oe_irt_qizilbash_zeal: "阿尔达比勒奇兹尔巴什狂热"
 STATIC_MODIFIER_DESC_oe_irt_qizilbash_zeal: "红帽土库曼战士奉伊斯玛仪为精神导师与尘世沙赫，士气与改宗速度飙升，但异派宽容剧降且部落势力大炽。"
 STATIC_MODIFIER_NAME_oe_irt_sunni_continuity: "波斯传统逊尼法统延续"
 STATIC_MODIFIER_DESC_oe_irt_sunni_continuity: "节制激进苏菲教团以维系高原教派平衡与商税秩序，国内安稳宽容，却少了席卷高原的宗教锐气。"
 STATIC_MODIFIER_NAME_oe_irt_chaldiran_musketeers: "查尔迪兰后皇家火枪禁军"
 STATIC_MODIFIER_DESC_oe_irt_chaldiran_musketeers: "直面火炮与新军的残酷洗礼后，组建直属王室的火绳枪军团与焦土防线，纪律与火器大成，税赋与部落满意承压。"
 STATIC_MODIFIER_NAME_oe_irt_zagros_bulwark: "扎格罗斯山隘坚壁清野"
 STATIC_MODIFIER_DESC_oe_irt_zagros_bulwark: "避免在平原与强敌火炮硬撼，依托扎格罗斯山口要塞拖垮远征之师，守势坚如磐石而进取威名稍减。"
 STATIC_MODIFIER_NAME_oe_irt_royal_silk_monopoly: "加兹温—伊斯法罕王室生丝专卖"
 STATIC_MODIFIER_DESC_oe_irt_royal_silk_monopoly: "迁都腹地并收归吉兰生丝外销大权，王室集权、贸易与财政全面跃升，却狠狠触动奇兹尔巴什酋长与私商利益。"
 STATIC_MODIFIER_NAME_oe_irt_royal_capital_seat: "伊朗高原皇家新都"
 STATIC_MODIFIER_DESC_oe_irt_royal_capital_seat: "宫阙、巴扎与丝绸商馆云集新都，贸易中心与城市发展突飞猛进，大兴土木亦伴随轻微城坊躁动。"
 STATIC_MODIFIER_NAME_oe_irt_amirs_compact: "奇兹尔巴什酋长与行省丝商共治"
 STATIC_MODIFIER_DESC_oe_irt_amirs_compact: "保留部落领主封地与地方商帮分成，兵源充足且国政平顺，王室直辖财权则显著分散。"
 STATIC_MODIFIER_NAME_oe_irt_gunpowder_empire: "伊朗火药帝国与丝路中枢"
 STATIC_MODIFIER_DESC_oe_irt_gunpowder_empire: "以火炮禁军、中央底万与生丝专卖统摄整个伊朗高原，威慑东西两翼，而高压集权令维稳与部落抚绥常年绷紧。"
 STATIC_MODIFIER_NAME_oe_irt_plateau_equilibrium: "阿马西亚与伊朗高原均势"
 STATIC_MODIFIER_DESC_oe_irt_plateau_equilibrium: "以划界和约与多元宽政稳定阿塞拜疆、波斯与呼罗珊，商旅繁盛、山河稳固，而尚武扩张锋芒有所收敛。"
 STATIC_MODIFIER_NAME_oe_irt_silk_caravanserai_net: "高原驿馆与生丝商道网"
 STATIC_MODIFIER_DESC_oe_irt_silk_caravanserai_net: "修缮大不里士、伊斯法罕、加兹温至赫拉特的商队驿馆，显著提振商贸与繁荣，驿道驻防开销略微加重。"
 oe_irt_dec_despina_embassy.title: "重续特拉比松—伊朗高原商盟"
 oe_irt_dec_despina_embassy.desc: "遣使重申黑海本都与大不里士之间的外交通商协定，提升商路收益并维系东翼友谊，须付出礼金与威望折让。"
 oe_irt_dec_despina_embassy.a: "遣使重申本都—高原协定"
 oe_irt_dec_gunpowder_foundry.title: "敕建伊朗高原皇家铸炮局"
 oe_irt_dec_gunpowder_foundry.desc: "在大不里士、伊斯法罕、加兹温或赫拉特设立官营火炮铸造局，彻底补足野战火器短板，代价是沉重的国库、兵源与部落不满。"
 oe_irt_dec_gunpowder_foundry.a: "拨银营建高原铸炮局"
 oe_irt_dec_silk_caravanserais.title: "整修大不里士—伊斯法罕生丝驿馆"
 oe_irt_dec_silk_caravanserais.desc: "定期拨款整修大不里士、伊斯法罕、加兹温、设拉子与赫拉特之间的商队驿站，提振丝路商税与繁荣并略增驻防开销。"
 oe_irt_dec_silk_caravanserais.a: "敕修高原丝路驿馆网"
 oe_irt.1.t: "札剌亦儿余晖与黑羊部崛起"
 oe_irt.1.d: "帖木儿身后大乱刚过，伊尔汗国旧疆的最后余脉在巴格达与大不里士日渐凋零。黑羊部土库曼骑兵趁势控扼阿塞拜疆与两河商道，伊朗高原自此跨入土库曼诸部与波斯文官拉锯的新纪元。"
 oe_irt.1.a: "确立黑羊部大不里士与巴格达骑兵霸权"
 oe_irt.1.a.tt: "推进伊朗后期线至阶段#Y 1#!，消耗#R 90#!金币、稳定#R −3#!，获得#G +10#!威望与[ShowModifier('oe_irt_black_sheep_ascendancy')]（#Y 25#!年，部落力量上升而控制度略降）；若直辖大不里士则挂[ShowModifier('oe_irt_tabriz_war_seat')]。"
 oe_irt.1.b: "维系波斯文官底万与城市税制传统"
 oe_irt.1.b.tt: "推进伊朗后期线至阶段#Y 1#!，消耗#R 70#!金币、威望#R −8#!，获得[ShowModifier('oe_irt_persian_diwan')]（#Y 25#!年，部落满意度与轻骑战力略降）。"
 oe_irt.2.t: "乌尊·哈桑与白羊王朝的兴盛"
 oe_irt.2.d: "白羊部雄主乌尊·哈桑从迪亚巴克尔挥师东进，直指黑羊与帖木儿诸王争持不下的大不里士、伊斯法罕与设拉子。整个伊朗西部与法尔斯的霸权天平剧烈倾斜，各地城防与游牧部族皆须选边应对。"
 oe_irt.2.a: "倚重白羊精骑角逐阿塞拜疆与法尔斯霸权"
 oe_irt.2.a.tt: "推进至阶段#Y 2#!，消耗#R 110#!金币、人力#R −2#!，获得#G +8#!陆军传统与[ShowModifier('oe_irt_white_sheep_surge')]（#Y 25#!年，部落力量上升且维稳成本增加），并加剧黑白羊宿怨。"
 oe_irt.2.b: "固守大不里士、设拉子与赫拉特高原名城防线"
 oe_irt.2.b.tt: "推进至阶段#Y 2#!，消耗#R 100#!金币、稳定#R −3#!，获得[ShowModifier('oe_irt_plateau_citadels')]（#Y 25#!年，月度威望略降）。"
 oe_irt.3.t: "狄奥多拉公主与特拉比松—白羊同盟"
 oe_irt.3.d: "面对奥斯曼铁骑步步东逼，特拉比松科穆宁皇室将狄奥多拉公主（德斯皮娜·哈敦）嫁与白羊雄主乌尊·哈桑。这桩跨越信仰的王朝联姻意在贯通本都、君士坦丁堡与大不里士，在安纳托利亚东翼铸就制衡强敌的战略钳口。"
 oe_irt.3.a: "缔结狄奥多拉联姻盟约，构筑反奥斯曼东翼钳口"
 oe_irt.3.a.tt: "消耗#R 120#!金币、稳定#R −2#!，获得#G +12#!威望与[ShowModifier('oe_irt_eastern_pincer')]（#Y 25#!年，保守教士满意度略降），大幅增进白羊与特拉比松/罗马关系并触发奥斯曼警觉。"
 oe_irt.3.b: "避免卷入安纳托利亚大战，仅签黑海—大不里士商队约"
 oe_irt.3.b.tt: "消耗#R 50#!金币、威望#R −6#!，获得[ShowModifier('oe_irt_pontic_caravans')]（#Y 25#!年，陆军传统略降）。"
 oe_irt.4.t: "奥特卢克贝利之役：火器与铁骑的碰撞"
 oe_irt.4.d: "在幼发拉底河上游的奥特卢克贝利原野，纵横高原的土库曼精骑迎面撞上了战车垒阵、铜炮与火绳枪的密集齐射。这场血战给伊朗与小亚细亚诸邦敲响了震耳欲聋的警钟：不改火器，难争天下。"
 oe_irt.4.a: "重金铸炮改制，组建战车火绳枪新军"
 oe_irt.4.a.tt: "推进至阶段#Y 3#!，消耗#R 180#!金币、人力#R −2.5#!、稳定#R −3#!，获得#G +10#!陆军传统与[ShowModifier('oe_irt_gunpowder_reforms')]（#Y 30#!年，炮兵维护上升且部落不满）。"
 oe_irt.4.b: "坚守草原弓骑机动传统，倚重游牧袭扰战术"
 oe_irt.4.b.tt: "推进至阶段#Y 3#!，消耗#R 80#!金币、威望#R −5#!，获得[ShowModifier('oe_irt_turcoman_horsemen')]（#Y 25#!年，要塞防御与炮兵战力受损）。"
 oe_irt.5.t: "阿尔达比勒教团与伊斯玛仪崛起"
 oe_irt.5.d: "源自阿尔达比勒的萨非教团在奇兹尔巴什红帽土库曼战士簇拥下席卷大不里士与加兹温。少年沙赫伊斯玛仪立十二伊玛目什叶派为国教，以烈火般的宗教凝聚重塑波斯版图，却也点燃了高原空前的教派剧震。"
 oe_irt.5.a: "奉行萨非十二伊玛目新制，号召奇兹尔巴什诸部"
 oe_irt.5.a.tt: "推进至阶段#Y 4#!，消耗#R 120#!金币、稳定#R −6#!，获得#G +15#!威望与[ShowModifier('oe_irt_qizilbash_zeal')]（#Y 30#!年，异端宽容剧降且部落力量大增）；若为波斯/黑白羊则转奉什叶派。"
 oe_irt.5.b: "约束激进教团武装，维系逊尼—波斯宽容旧序"
 oe_irt.5.b.tt: "推进至阶段#Y 4#!，消耗#R 100#!金币、人力#R −2#!，获得[ShowModifier('oe_irt_sunni_continuity')]（#Y 30#!年，陆军士气与威望略降）。"
 oe_irt.6.t: "查尔迪兰回响与火药边疆"
 oe_irt.6.d: "西线火炮与新军长驱直入阿塞拜疆，查尔迪兰的硝烟粉碎了骑兵无敌的神话，也将大不里士暴露于随时受袭的前线。朝廷必须在血火教训中决定未来的国防根基：不惜代价打造皇家火枪军，还是退守扎格罗斯山隘坚壁清野？"
 oe_irt.6.a: "倾力编练皇家火枪炮兵禁军，以焦土战抗衡西线强敌"
 oe_irt.6.a.tt: "消耗#R 200#!金币、人力#R −3#!、稳定#R −3#!，获得#G +12#!陆军传统与[ShowModifier('oe_irt_chaldiran_musketeers')]（#Y 30#!年，税效与部落满意度承压），并加剧与奥斯曼边疆敌对。"
 oe_irt.6.b: "谋求战术休战，重筑扎格罗斯山口与内陆堡垒群"
 oe_irt.6.b.tt: "消耗#R 110#!金币、威望#R −10#!，获得[ShowModifier('oe_irt_zagros_bulwark')]（#Y 25#!年，威望与进攻士气略降）。"
 oe_irt.7.t: "皇家新都与生丝专卖：集权抑或部落"
 oe_irt.7.d: "随着宫廷自濒临前线的大不里士渐次内迁加兹温与伊斯法罕，波斯生丝经阿勒颇、特拉比松与波斯湾源源流入东西方市场。是将生丝贸易收归王室专卖以削弱奇兹尔巴什酋长，还是与部落领主及行省商帮分利共治？"
 oe_irt.7.a: "定鼎加兹温—伊斯法罕并推行王室生丝专卖集权"
 oe_irt.7.a.tt: "推进至阶段#Y 5#!，消耗#R 220#!金币、稳定#R −5#!，获得[ShowModifier('oe_irt_royal_silk_monopoly')]（#Y 35#!年，部落与市民满意度承压）；若直辖伊斯法罕或加兹温则挂[ShowModifier('oe_irt_royal_capital_seat')]。"
 oe_irt.7.b: "与奇兹尔巴什酋长及行省丝商分润共治"
 oe_irt.7.b.tt: "推进至阶段#Y 5#!，消耗#R 90#!金币、威望#R −8#!，获得[ShowModifier('oe_irt_amirs_compact')]（#Y 35#!年，王室力量与税效有所折让）。"
 oe_irt.8.t: "伊朗高原的百年均势"
 oe_irt.8.d: "自1411年伊尔汗余脉落幕以来，黑羊、白羊、帖木儿诸王与萨非新朝在大不里士、巴格达、伊斯法罕、设拉子、加兹温与赫拉特之间百转千回。火炮、生丝与外交和约共同铸就了近代早期伊朗高原的新秩序。"
 oe_irt.8.a: "宣示火药帝国与丝路中枢霸业"
 oe_irt.8.a.tt: "完成伊朗后期线（阶段#Y 6#!），消耗#R 200#!金币、稳定#R −4#!，获得#G +20#!威望与[ShowModifier('oe_irt_gunpowder_empire')]（#Y 50#!年，维稳成本与部落摩擦增加）。"
 oe_irt.8.b: "确立阿马西亚式的东西边疆均势与宽政繁荣"
 oe_irt.8.b.tt: "完成伊朗后期线（阶段#Y 6#!），消耗#R 120#!金币、威望#R −8#!，获得#G +6#!稳定与[ShowModifier('oe_irt_plateau_equilibrium')]（#Y 50#!年，陆军士气略降）。"
 oe_irt.20.t: "伊朗高原后期线：选项生效"
 oe_irt.90.t: "【测试】伊朗高原后期线：状态读数"
 oe_irt.90.d: "#T 伊朗后期主线(1411-1560)#!\n阶段(0..6) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_stage')|0]  狄奥多拉盟约(1盟/2商) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_despina')|0]  火器改制(1火器/2弓骑) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_gun')|0]\n#T 萨非与集权#!\n萨非路线(1什叶/2逊尼) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_safavid')|0]  丝绸集权(1王室/2部落) [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_cent')|0]\n#T 调度#!\n已发事件 [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_cnt')|0]  上次运行月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_irt_rd_m')|0]"
 oe_irt.90.a: "关闭"
 oe_irt.90.b: "刷新"
