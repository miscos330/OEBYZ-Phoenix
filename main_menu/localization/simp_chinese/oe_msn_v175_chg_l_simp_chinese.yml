# NEW 2026-11-23 v17.5 Steppe Storm, Eurasian Plates & Reactive World — Module 17.5-B: v17.5 Chagatai Destiny Mission Tree oe_msn_44_chg (simp_chinese) (oe_chg2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v175_chagatai_eurasia.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_chg2_msn_m1:0 "河中草原火药精锐军团"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m1:0 "天山骑射手、撒马尔罕重装铁骑与王室青铜火炮协同作战，使察合台大军成为所向披靡的近代劲旅。"
 STATIC_MODIFIER_NAME_oe_chg2_msn_m2:0 "大一统察合台兀鲁思"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m2:0 "自伊犁河谷至阿姆河畔与塔里木绿洲，诸部与阿米尔尽数归心一统汗廷。"
 STATIC_MODIFIER_NAME_oe_chg2_msn_m3:0 "察合台丝路文艺复兴"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m3:0 "坎儿井水利、石砌商队驿舍与撒马尔罕—喀什学院令中亚文教昌隆、百业繁华。"
 STATIC_MODIFIER_NAME_oe_chg2_msn_m4:0 "永恒丝绸之路大汗帝国"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m4:0 "坐拥阿力麻里、撒马尔罕与喀什噶尔三大枢轴，兼有铁骑火器与大陆商路霸权，察合台大汗之业永垂千秋。"
 oe_msn_chg_destiny:0 "#bold #color_yellow 察合台汗国：丝绸之路的永恒大汗#!#!"
 oe_msn_chg_destiny_DESCRIPTION:0 "从阿力麻里忽里勒台与天山铁骑，到河中一统、塔里木坎儿井绿洲与丝路火药霸权"
 oe_msn_chg_destiny_CRITERIA_DESCRIPTION:0 "稳固阿力麻里中枢，整编天山骑射手与撒马尔罕重装铁骑，统一河中、塔里木盆地与呼罗珊门户，加冕近代察合台丝路大帝国。"
 oe_msn_chg_destiny_BUTTON_TOOLTIP:0 "开启察合台汗国天命之路"
 oe_msn_chg_destiny_BUTTON_DETAILS:0 "专为察合台汗国及其继承政权打造的十二任务三支柱天命树：精炼天山骑射手、撒马尔罕丝路重骑与河中火药炮队；将阿力麻里、撒马尔罕、布哈拉、喀什噶尔、高昌与巴尔赫统于一尊；兴建天山驿站网、坎儿井水利与中亚学院，重铸陆上丝路黄金时代。"
 oe_msn_chg_01_almaliq_kurultai:0 "阿力麻里忽里勒台会盟"
 oe_msn_chg_01_almaliq_kurultai_desc:0 "在伊犁河谷水草丰美的阿力麻里召会草原那颜与河中绿洲阿米尔，于白纛之下重申宗室盟约，是遏止察合台汗国东西分裂的关键一举。提振[horde_unity|e]、凝聚诸路[subjects|e]并修缮汗廷[buildings|e]，方能夯实[stability|e]，重树中亚大汗的无上威权。"
 oe_msn_chg_01_almaliq_kurultai_req_tt:0 "直接或通过属国控制阿力麻里，稳定度不低于 5，且统辖察合台阿米尔附庸、至少 2 个附庸或建有忽里勒台/商队旅舍。"
 oe_msn_chg_02_tianshan_riders:0 "整编天山骑射手精锐"
 oe_msn_chg_02_tianshan_riders_desc:0 "胯下七河良驹、手持绿洲巧匠精制的角质复合弓，天山骑射手在险峻山口与无垠草原之间往来如风。修缮武备[buildings|e]并坚持围猎演武以淬炼[army_tradition|e]，将锻造出一支奔袭千里的迅捷[army|e]，令喀什噶尔至阿姆河两岸尽听汗廷号令。"
 oe_msn_chg_02_tianshan_riders_req_tt:0 "国库不少于 160 金币，稳定度不低于 8，且陆军传统不低于 15 或建有城堡/武器行会。"
 oe_msn_chg_03_samarkand_cataphracts:0 "精铸撒马尔罕丝路重装铁骑"
 oe_msn_chg_03_samarkand_cataphracts_desc:0 "将撒马尔罕铁匠铺精锻的锁子甲与扎甲披挂在草原精骑战马之上，催生出兼备重甲防护与雷霆冲锋之力的丝路重装铁骑。扶植都市军械[buildings|e]并积累深厚[army_tradition|e]，令大汗的精锐[army|e]得以摧枯拉朽地碾碎一切割据强梁，横扫河中疆场。"
 oe_msn_chg_03_samarkand_cataphracts_req_tt:0 "直接或通过属国控制撒马尔罕，稳定度不低于 12，且陆军传统不低于 20 或建有军械库/武器行会。"
 oe_msn_chg_04_transoxiana_gunpowder:0 "河中火药炮队近代化"
 oe_msn_chg_04_transoxiana_gunpowder_desc:0 "东接中华火铳冶铸之艺、西通奥斯曼火枪炮队操典，地处欧亚十字路口的河中汗国得天独厚地引领着内亚军事革新。吸纳火器[advances|e]并兴建铸炮[buildings|e]，不仅令察合台[army_tradition|e]与常备[regulars|e]战力倍增，更使汗国在大火药时代昂然不落下风。"
 oe_msn_chg_04_transoxiana_gunpowder_req_tt:0 "直接或通过属国控制撒马尔罕，稳定度不低于 15，处于地理大发现或更晚时代，且已研习火药革新、建有铸炮坊/手铳行会或陆军传统不低于 25。"
 oe_msn_chg_05_transoxiana_jewels:0 "河中双璧：撒马尔罕与布哈拉"
 oe_msn_chg_05_transoxiana_jewels_desc:0 "撒马尔罕与布哈拉宛如镶嵌在阿姆河与锡尔河之间的双璧明珠，汇聚着名闻遐迩的造纸坊、丝绸大巴扎与琉璃经学院。夯实这两座河中[core|e]都会并完善商学[buildings|e]，必将催生蓬勃的城市[development|e]与[prosperity|e]，令西部兀鲁思的过境[trade|e]岁入源源不断。"
 oe_msn_chg_05_transoxiana_jewels_req_tt:0 "直接或通过属国控制撒马尔罕与布哈拉，且建有市场/经学院或月商税收入不低于 22。"
 oe_msn_chg_06_tarim_oases:0 "统御塔里木诸绿洲名城"
 oe_msn_chg_06_tarim_oases_desc:0 "环绕塔克拉玛干沙海而建的喀什噶尔与高昌绿洲城邦，是连接河中与中原大都无可替代的商旅锁钥。无论直辖巩固东部[core|e]咽喉，抑或委任忠诚阿米尔[subjects|e]协同镇守，都能牢牢护住和田玉与丝绸[trade|e]通道，为汗廷带来源源不绝的过境[gold|e]。"
 oe_msn_chg_06_tarim_oases_req_tt:0 "直接或通过属国控制喀什噶尔与高昌，且统辖察合台阿米尔附庸或建有商队旅舍。"
 oe_msn_chg_07_khorasan_hindukush:0 "呼罗珊与兴都库什南大门"
 oe_msn_chg_07_khorasan_hindukush_desc:0 "稳控「诸城之母」巴尔赫并进而掌握赫拉特或喀布尔，便同时握住了通往波斯高原与富庶北印度的两把南下钥匙。凭借直辖[core|e]与众藩[subjects|e]共拥八十城之广土，察合台大汗的赫赫[prestige|e]直逼伊朗与恒河平原，尽展中亚霸主雄风。"
 oe_msn_chg_07_khorasan_hindukush_req_tt:0 "直接或通过属国控制巴尔赫及赫拉特或喀布尔，且直辖与属国总计拥有至少 80 处地点。"
 oe_msn_chg_08_unite_the_uluses:0 "重铸一统察合台兀鲁思"
 oe_msn_chg_08_unite_the_uluses_desc:0 "跨越历史中东西分裂为蒙兀儿斯坦与河中汗国的宿命，如今一位英明大汗将阿力麻里、撒马尔罕与喀什噶尔重新熔为一统江山。伴随高涨的[horde_unity|e]、俯首帖耳的[subjects|e]与至高[legitimacy|e]，大忽里勒台必须在此裁决汗国灵魂：究竟拥抱河中都市融合、恪守草原札撒，抑或建立阿米尔联邦？"
 oe_msn_chg_08_unite_the_uluses_req_tt:0 "直接或通过属国同时控制阿力麻里、撒马尔罕与喀什噶尔，处于文艺复兴或更晚时代，且位列世界列强或拥有至少 3 个附庸。"
 oe_msn_chg_09_silk_road_yam:0 "复兴帝国丝路大驿道"
 oe_msn_chg_09_silk_road_yam_desc:0 "沿中亚古道重修石砌商队旅舍、恢复银牌护商制度与驿马轮换站赤，令横贯欧亚大陆腹地的丝绸之路重焕生机。广建驿道商栈[buildings|e]并厚待商帮以提升[estate_satisfaction|e]，不仅令东西方陆上[trade|e]驼铃不绝，更源源为汗廷带回充裕关市[gold|e]。"
 oe_msn_chg_09_silk_road_yam_req_tt:0 "直接或通过属国控制阿力麻里，国库不少于 220 金币，月商税收入不低于 20，且建有商队旅舍或市场。"
 oe_msn_chg_10_fergana_karez:0 "费尔干纳与吐鲁番坎儿井大水利"
 oe_msn_chg_10_fergana_karez_desc:0 "引天山与帕米尔皑皑雪水贯入绵延地下的坎儿井与干渠，令干旱的费尔干纳与吐鲁番绿洲化作桑林葡萄与麦浪翻涌的塞外江南。大兴农田水利[buildings|e]不仅稳步推升绿洲[development|e]与农桑[prosperity|e]，更为横跨沙海的察合台汗国夯实了长治久安的人口与[stability|e]根基。"
 oe_msn_chg_10_fergana_karez_req_tt:0 "直接或通过属国控制苦盏或吐鲁番，处于文艺复兴或更晚时代，且建有粮仓/引水渠系统或首都发展度不低于 20。"
 oe_msn_chg_11_chagatai_renaissance:0 "引领察合台文艺复兴盛世"
 oe_msn_chg_11_chagatai_renaissance_desc:0 "在撒马尔罕雷吉斯坦琉璃穹顶之下与仰望星河的大理石观象台间，察合台突厥语诗豪、波斯天文学家与书法大家共同点燃了璀璨的中亚文艺复兴。赞助高等学府[buildings|e]并接纳时代[institutions|e]，将令汗国的[literacy|e]、[cultural_tradition|e]与科技[advances|e]足以同佛罗伦萨、君堡和大都争辉。"
 oe_msn_chg_11_chagatai_renaissance_req_tt:0 "直接或通过属国控制撒马尔罕，稳定度不低于 15，处于宗教改革或更晚时代，且已接纳印刷术思潮或建有经学院/大学。"
 oe_msn_chg_12_eternal_silk_khaganate:0 "永恒丝绸之路大汗帝国"
 oe_msn_chg_12_eternal_silk_khaganate_desc:0 "以阿力麻里、撒马尔罕与喀什噶尔为三鼎之足，重归一统的察合台汗国凭近代火药劲旅、坎儿井沃野与贯通欧亚的丝路繁华屹立内亚之巅。作为震撼四海的头等[great_power|e]，依托蓬勃的[capital|e][development|e]、坚实[stability|e]与煌煌[prestige|e]，永恒丝绸之路大汗帝国将在大典上确立流芳百代的终极宏纲。"
 oe_msn_chg_12_eternal_silk_khaganate_req_tt:0 "完成三条支线，直接或通过属国同时控制阿力麻里、撒马尔罕与喀什噶尔，稳定度不低于 18，处于专制或更晚时代，位列世界列强且首都发展度不低于 28。"
