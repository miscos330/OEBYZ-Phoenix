 STATIC_MODIFIER_NAME_oe_chg2_msn_m1:0 "河中草原火药精锐军团"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m1:0 "天山骑射手、撒马尔罕重装铁骑与王室青铜火炮协同作战，使察合台大军成为所向披靡的近代劲旅。"
 STATIC_MODIFIER_NAME_oe_chg2_msn_m2:0 "大一统察合台兀鲁思"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m2:0 "自伊犁河谷至阿姆河畔与塔里木绿洲，诸部与阿米尔尽数归心一统汗廷。"
 STATIC_MODIFIER_NAME_oe_chg2_msn_m3:0 "察合台丝路文艺复兴"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m3:0 "坎儿井水利、石砌商队驿舍与撒马尔罕—喀什学院令中亚文教昌隆、百业繁华。"
 STATIC_MODIFIER_NAME_oe_chg2_msn_m4:0 "永恒丝绸之路大汗帝国"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m4:0 "坐拥阿力麻里、撒马尔罕与喀什噶尔三大枢轴，兼有铁骑火器与大陆商路霸权，察合台大汗之业永垂千秋。"
 oe_msn_chg_destiny:0 "#bold #color_yellow 察合台汗国：丝绸之路的永恒大汗#!#!"
 oe_msn_chg_destiny_DESCRIPTION:0 "从阿力麻里忽里勒台与天山铁骑，到河中一统、塔里木坎儿井绿洲与丝路火药霸权"
 oe_msn_chg_destiny_CRITERIA_DESCRIPTION:0 "稳固阿力麻里中枢，整编天山骑射手与撒马尔罕重装铁骑，统一河中、塔里木盆地与呼罗珊门户，加冕近代察合台丝路大帝国。"
 oe_msn_chg_destiny_BUTTON_TOOLTIP:0 "开启察合台汗国天命之路"
 oe_msn_chg_destiny_BUTTON_DETAILS:0 "专为察合台汗国及其继承政权打造的十二任务三支柱天命树：精炼天山骑射手、撒马尔罕丝路重骑与河中火药炮队；将阿力麻里、撒马尔罕、布哈拉、喀什噶尔、高昌与巴尔赫统于一尊；兴建天山驿站网、坎儿井水利与中亚学院，重铸陆上丝路黄金时代。"
 oe_msn_chg_01_almaliq_kurultai:0 "阿力麻里忽里勒台会盟"
 oe_msn_chg_01_almaliq_kurultai_desc:0 "稳固伊犁河谷都城阿力麻里的中枢威权，召集草原那颜与绿洲阿米尔齐聚白纛之下。"
 oe_msn_chg_01_almaliq_kurultai_req_tt:0 "直接或通过属国控制阿力麻里，且稳定度至少为5。"
 oe_msn_chg_02_tianshan_riders:0 "整编天山骑射手精锐"
 oe_msn_chg_02_tianshan_riders_desc:0 "为七河骑军配齐复合弓与高原良驹，锻造驰骋山地与草原的精锐骑射劲旅。"
 oe_msn_chg_02_tianshan_riders_req_tt:0 "拥有至少160金币，且稳定度至少为8。"
 oe_msn_chg_03_samarkand_cataphracts:0 "精铸撒马尔罕丝路重装铁骑"
 oe_msn_chg_03_samarkand_cataphracts_desc:0 "依托撒马尔罕精钢甲坊编练重装铁骑，以雷霆冲锋粉碎任何步兵方阵。"
 oe_msn_chg_03_samarkand_cataphracts_req_tt:0 "直接或通过属国控制撒马尔罕，且稳定度至少为12。"
 oe_msn_chg_04_transoxiana_gunpowder:0 "河中火药炮队近代化"
 oe_msn_chg_04_transoxiana_gunpowder_desc:0 "将青铜野战炮与火绳枪兵融入草原铁骑体系，令察合台雄师傲视各大火药帝国。"
 oe_msn_chg_04_transoxiana_gunpowder_req_tt:0 "处于地理大发现时代或之后，直接或通过属国控制撒马尔罕，且稳定度至少为15。"
 oe_msn_chg_05_transoxiana_jewels:0 "河中双璧：撒马尔罕与布哈拉"
 oe_msn_chg_05_transoxiana_jewels_desc:0 "牢牢掌握撒马尔罕与布哈拉两座河中明珠，夯实汗国西部财赋重镇。"
 oe_msn_chg_05_transoxiana_jewels_req_tt:0 "直接或通过属国同时控制撒马尔罕与布哈拉。"
 oe_msn_chg_06_tarim_oases:0 "统御塔里木诸绿洲名城"
 oe_msn_chg_06_tarim_oases_desc:0 "牢牢统辖喀什噶尔与高昌两座丝路重镇，尽控塔克拉玛干南北商道。"
 oe_msn_chg_06_tarim_oases_req_tt:0 "直接或通过属国同时控制喀什噶尔与高昌。"
 oe_msn_chg_07_khorasan_hindukush:0 "呼罗珊与兴都库什南大门"
 oe_msn_chg_07_khorasan_hindukush_desc:0 "稳控古城巴尔赫及赫拉特或喀布尔，打通通往波斯高原与北印度的战略通衢。"
 oe_msn_chg_07_khorasan_hindukush_req_tt:0 "控制巴尔赫、控制赫拉特或喀布尔，且直辖与属国总计拥有至少80个地区。"
 oe_msn_chg_08_unite_the_uluses:0 "重铸一统察合台兀鲁思"
 oe_msn_chg_08_unite_the_uluses_desc:0 "彻底跨越历史上的东西分裂魔咒，以阿力麻里、撒马尔罕与喀什噶尔共铸一统江山。"
 oe_msn_chg_08_unite_the_uluses_req_tt:0 "处于文艺复兴时代或之后，直接或通过属国同时控制阿力麻里、撒马尔罕与喀什噶尔。"
 oe_msn_chg_09_silk_road_yam:0 "复兴帝国丝路大驿道"
 oe_msn_chg_09_silk_road_yam_desc:0 "重修贯通中亚的皇家驿站、银牌护商与石砌商队旅舍，令丝路百货日夜流转。"
 oe_msn_chg_09_silk_road_yam_req_tt:0 "直接或通过属国控制阿力麻里，且拥有至少220金币。"
 oe_msn_chg_10_fergana_karez:0 "费尔干纳与吐鲁番坎儿井大水利"
 oe_msn_chg_10_fergana_karez_desc:0 "在苦盏与吐鲁番大兴地下坎儿井与雪水干渠，使绿洲农桑与桑蚕倍增。"
 oe_msn_chg_10_fergana_karez_req_tt:0 "处于文艺复兴时代或之后，直接或通过属国控制苦盏或吐鲁番。"
 oe_msn_chg_11_chagatai_renaissance:0 "引领察合台文艺复兴盛世"
 oe_msn_chg_11_chagatai_renaissance_desc:0 "资助皇家观象台、经学院与察合台文学大兴，使撒马尔罕与喀什之光照耀欧亚。"
 oe_msn_chg_11_chagatai_renaissance_req_tt:0 "处于宗教改革时代或之后，直接或通过属国控制撒马尔罕，且稳定度至少为15。"
 oe_msn_chg_12_eternal_silk_khaganate:0 "永恒丝绸之路大汗帝国"
 oe_msn_chg_12_eternal_silk_khaganate_desc:0 "以阿力麻里、撒马尔罕与喀什噶尔为三鼎之足，兼有近代火药劲旅与丝路无尽繁华，察合台宗室终登欧亚永恒霸业之巅。"
 oe_msn_chg_12_eternal_silk_khaganate_req_tt:0 "处于绝对主义时代或之后，直接或通过属国同时控制阿力麻里、撒马尔罕与喀什噶尔，且稳定度至少为18。"
