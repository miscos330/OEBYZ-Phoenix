 oe_ind2.1.title: "区域产业振兴"
 oe_ind2.1.desc: "朝廷首度降旨设立专项扶持令，倾力振兴指定地区的特色手工业与工坊集群。官库拨付启动银两并修筑运道，各色工坊如雨后春笋般相继开张，匠户云集；与此同时，地方官吏的政绩账簿上也多了一项关乎实业成败的新考成。"
 oe_ind2.1.a: "以实效考核地方"
 oe_ind2.2.title: "丝绸行会争夺原料"
 oe_ind2.2.desc: "近来市面生丝价格节节攀升，货源日趋紧俏。城中世代经营的本地丝绸行会与手持重金的外来客商在蚕市上竞相抬价、争购原料，双方互不相让，甚至爆发殴斗并一路闹上官府公堂，亟待朝廷裁断究竟优先供给本土织坊还是听凭市场竞价。"
 oe_ind2.2.a: "先供本地织坊"
 oe_ind2.2.b: "价高者得"
 oe_ind2.3.title: "军工优先，市民抱怨"
 oe_ind2.3.desc: "为赶制前线急需的甲胄、火炮与火药，官府将城中大批壮年工匠与杂役尽数抽调至皇家兵工厂昼夜赶工。城内寻常作坊、染坊与铺面顿时人手奇缺、几近停摆，市民生计受阻，街头巷尾怨声载道，恳请朝廷酌留劳力以顾民生。"
 oe_ind2.3.a: "前线要紧"
 oe_ind2.3.b: "留一部分劳力给民间"
 oe_ind2.4.title: "船坞工匠请求世袭"
 oe_ind2.4.desc: "官营船坞的资深造船匠与木作大匠联名递上陈情书，恳请朝廷恩准他们的子弟世袭船坞匠籍与职缺。老工匠们坚称，舰体弧度、榫卯水密与桅杆配重皆赖父子口传心授，唯有世袭其职方能保百年精艺不致失传；然亦有官员力主唯才是用。"
 oe_ind2.4.a: "准其世袭"
 oe_ind2.4.b: "唯才是用"
 oe_ind2.5.title: "指派劳役激起不满"
 oe_ind2.5.desc: "被官府强行签派前往偏远矿场、冶炼炉与大型土木工地服役的农民劳苦不堪，食宿简陋且耽误农时，营中逃亡与怠工之事屡禁不止。怨气正迅速向周边乡里蔓延，地方官吏忧心忡忡地上报朝廷，唯恐再不妥善安抚便会激起民变。"
 oe_ind2.5.a: "减免他们的赋役"
 oe_ind2.5.b: "照旧执行"
 oe_ind2.6.title: "白银大单"
 oe_ind2.6.desc: "来自万里之外的远洋大商帮驶入港湾，一口气签下规模空前的采购大单，指名要购尽当地名窑烧制的青花瓷器、精雕漆器与上等新茶，且全部以沉甸甸的足色银锭现款结算。各大窑场、茶行与作坊闻讯振奋，纷纷摩拳擦掌准备昼夜赶工。"
 oe_ind2.6.a: "接单赶工"
 oe_ind2.7.title: "棉布与香料畅销"
 oe_ind2.7.desc: "我国工坊出品的细密印花棉布色泽鲜亮、经久耐洗，配以香气浓郁的上等香料，在海内外各大集市上供不应求、价高易售。巨额利润源源涌入商栈的同时，远方竞争对手的织坊却因销路惨淡而叫苦不迭，纷纷上书各自君主请求设卡阻拦。"
 oe_ind2.7.a: "趁势扩大"
 oe_ind2.8.title: "工业黄金时代"
 oe_ind2.8.desc: "历经多年悉心经营，朝廷直属的御用工场、各省蓬勃兴起的地方特色产业与井然有序的用工制度终于相得益彰、融为一体。炉火昼夜不熄，织机声传遍街巷，商路车水马龙，百工兴旺、货通四海的工业黄金时代已然降临。"
 oe_ind2.8.a: "百工兴旺"
 oe_ind2.9.title: "专营还是放任"
 oe_ind2.9.desc: "随着手工工场规模日渐庞大，朝堂之上围绕实业管制爆发激烈论战。保守重臣主张坚持官营专卖旧制，由朝廷统一核定原料、工价与劳力调配，以保税源稳固；新锐策士则呼吁放宽行会与官营枷锁，听凭工匠商民自由流动竞逐。"
 oe_ind2.9.a: "坚持专营"
 oe_ind2.9.b: "放宽管制"
 oe_ind2.10.title: "原料告急"
 oe_ind2.10.desc: "旷日持久的战事令前线弹药与兵甲消耗远超预期，各地仓库的硝石、硫磺、精铜与生铁纷纷告罄，商路采买亦因封锁而接济不上。皇家兵工厂的炉火已面临停歇之虞，督造官星夜呈递急报，恳请朝廷即刻拨款向海外与周边紧急调拨原料。"
 oe_ind2.10.a: "动用国库采买"
 oe_ind2.10.b: "让前线等一等"
