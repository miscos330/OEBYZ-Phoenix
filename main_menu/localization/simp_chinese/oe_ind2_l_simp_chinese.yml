 oe_ind_imperial_silk_corridor: "丝绸与锦缎走廊"
 oe_ind_imperial_silk_corridor_desc: "在一个地区扶持养蚕、染色与织锦。"
 oe_ind_gunpowder_ordnance_zone: "火药军工产区"
 oe_ind_gunpowder_ordnance_zone_desc: "在一个地区扶持火器、火炮、硝石与钢材的生产。1450 年以后可用。"
 oe_ind_imperial_kiln_lacquer_belt: "瓷漆茶艺带"
 oe_ind_imperial_kiln_lacquer_belt_desc: "在一个地区扶持瓷器、漆器与茶叶。东亚国家可用，1650 年以后各国可用。"
 oe_ind_arsenale_maritime_shipyards: "船坞航运带"
 oe_ind_arsenale_maritime_shipyards_desc: "在一个地区扶持海军物资、焦油、木料与舰炮。需要有港口。"
 oe_ind_ural_metallurgy_basin: "重冶铁矿带"
 oe_ind_ural_metallurgy_basin_desc: "在一个地区扶持铁、钢、煤、兵器与工具。1500 年以后可用。"
 oe_ind_indian_ocean_cotton_spices: "棉纺与香料带"
 oe_ind_indian_ocean_cotton_spices_desc: "在一个地区扶持棉花、细布与香料。"
 oe_emp_eparch_royal_monopoly: "官营御坊优先制"
 oe_emp_eparch_royal_monopoly_desc: "劳力优先配给官营的工场与官署。"
 oe_emp_wartime_ordnance_priority: "战时军工优先制"
 oe_emp_wartime_ordnance_priority_desc: "劳力优先配给兵工厂、军营与城防。"
 oe_emp_arsenale_maritime_corps: "海事船坞优先制"
 oe_emp_arsenale_maritime_corps_desc: "劳力优先配给船坞与商贸建筑。"
 oe_emp_pripisnye_state_foundry: "指派劳役与荒政优先制"
 oe_emp_pripisnye_state_foundry_desc: "劳力优先配给矿场、农田与基础设施，利于救荒。"
 oe_ind2_adv_regional_charters: "区域产业特许"
 oe_ind2_adv_regional_charters_desc: "朝廷给地方行会颁发特许，可以多扶持一个地区的产业。"
 oe_ind2_adv_cameral_labor_allocation: "官房用工调配"
 oe_ind2_adv_cameral_labor_allocation_desc: "官府统筹调配劳力，改换用工制度更省事。"
 oe_ind2_player_only_tt: "只有玩家操控的国家可以使用"
 oe_ind2_dec_adopt_eparch_monopoly.title: "改行官营御坊优先制"
 oe_ind2_dec_adopt_eparch_monopoly.desc: "把用工制度改为官营御坊优先。花费 50 金币。"
 oe_ind2_dec_adopt_eparch_monopoly.a: "改行此制"
 oe_ind2_dec_adopt_wartime_ordnance.title: "改行战时军工优先制"
 oe_ind2_dec_adopt_wartime_ordnance.desc: "把用工制度改为战时军工优先。花费 50 金币。"
 oe_ind2_dec_adopt_wartime_ordnance.a: "改行此制"
 oe_ind2_dec_adopt_arsenale_corps.title: "改行海事船坞优先制"
 oe_ind2_dec_adopt_arsenale_corps.desc: "把用工制度改为海事船坞优先。花费 50 金币。"
 oe_ind2_dec_adopt_arsenale_corps.a: "改行此制"
 oe_ind2_dec_adopt_pripisnye_foundry.title: "改行指派劳役与荒政优先制"
 oe_ind2_dec_adopt_pripisnye_foundry.desc: "把用工制度改为指派劳役与荒政优先。花费 50 金币。"
 oe_ind2_dec_adopt_pripisnye_foundry.a: "改行此制"
 oe_ind2.1.title: "区域产业振兴"
 oe_ind2.1.desc: "朝廷第一次明令扶持一个地区的产业。作坊纷纷开张，地方官也多了一项考成。"
 oe_ind2.1.a: "以实效考核地方"
 oe_ind2.2.title: "丝绸行会争夺原料"
 oe_ind2.2.desc: "丝价上涨，本地行会与外来客商争购生丝，闹到官府。"
 oe_ind2.2.a: "先供本地织坊"
 oe_ind2.2.b: "价高者得"
 oe_ind2.3.title: "军工优先，市民抱怨"
 oe_ind2.3.desc: "劳力都被调去兵工厂，城里的作坊招不到人，市民怨声载道。"
 oe_ind2.3.a: "前线要紧"
 oe_ind2.3.b: "留一部分劳力给民间"
 oe_ind2.4.title: "船坞工匠请求世袭"
 oe_ind2.4.desc: "船坞的工匠请求让子弟世袭其职，说这样手艺才不会失传。"
 oe_ind2.4.a: "准其世袭"
 oe_ind2.4.b: "唯才是用"
 oe_ind2.5.title: "指派劳役激起不满"
 oe_ind2.5.desc: "被指派到矿场和工地服役的农民怨气很大，地方官担心出事。"
 oe_ind2.5.a: "减免他们的赋役"
 oe_ind2.5.b: "照旧执行"
 oe_ind2.6.title: "白银大单"
 oe_ind2.6.desc: "远方商人一次订走了大批瓷器、漆器和茶叶，用白银付账。"
 oe_ind2.6.a: "接单赶工"
 oe_ind2.7.title: "棉布与香料畅销"
 oe_ind2.7.desc: "我们的印花棉布和香料卖得很好，远方的织坊叫苦不迭。"
 oe_ind2.7.a: "趁势扩大"
 oe_ind2.8.title: "工业黄金时代"
 oe_ind2.8.desc: "御用工场、地方产业与用工制度配合得当，百工兴旺。"
 oe_ind2.8.a: "百工兴旺"
 oe_ind2.9.title: "专营还是放任"
 oe_ind2.9.desc: "朝中争论：是坚持官营专卖、由朝廷调配劳力，还是放宽管制、听民自便？"
 oe_ind2.9.a: "坚持专营"
 oe_ind2.9.b: "放宽管制"
 oe_ind2.10.title: "原料告急"
 oe_ind2.10.desc: "战事拖长，硝石与铜铁都接济不上，兵工厂请求紧急调拨。"
 oe_ind2.10.a: "动用国库采买"
 oe_ind2.10.b: "让前线等一等"
 oe_ind2.90.title: "【读数】区域产业与用工制度"
 oe_ind2.90.desc_header: "v11.8 区域产业与用工读数（Slot 89）：\n· 季度脉冲次数 #Y [GetGlobalVariable('oe_ind2_pulse_count').GetValue|0]#!"
