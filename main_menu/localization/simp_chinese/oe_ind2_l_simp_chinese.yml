 oe_ind2.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_ind2_triad_synergy_mod: "工业三维协同"
 STATIC_MODIFIER_DESC_oe_ind2_triad_synergy_mod: "御用工场、区域产业与用工制度互相配合。"
 STATIC_MODIFIER_NAME_oe_ind2_guild_privilege_mod: "船坞工匠世袭特权"
 STATIC_MODIFIER_DESC_oe_ind2_guild_privilege_mod: "船坞工匠的子弟世代承袭手艺与特权。"
 STATIC_MODIFIER_NAME_oe_ind2_free_labour_mod: "自由用工"
 STATIC_MODIFIER_DESC_oe_ind2_free_labour_mod: "朝廷放宽对用工的管制。"
 STATIC_MODIFIER_NAME_oe_ind2_state_monopoly_mod: "重商专营"
 STATIC_MODIFIER_DESC_oe_ind2_state_monopoly_mod: "朝廷坚持官营与专卖。"
