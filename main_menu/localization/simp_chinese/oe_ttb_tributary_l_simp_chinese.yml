 oe_ttb_marriage: "皇室许婚"
 oe_ttb_harbour_op: "驻港通商之约"
 oe_ttb_peace_op: "收受岁币"
 oe_ttb_broken: "拜占庭背约"
 oe_ttb_arrears: "拜占庭拖欠岁币"
 oe_ttb_buy_peace: "遣使纳币"
 oe_ttb_buy_peace_desc: "向一个兵力多于我们、与我们接壤（或隔一片海相望）或正在与我们交战的国家派出使节，以每年的岁币换取#Y 5#!年的双向停战。每年的岁币为我们#Y 3#!个月的总收入（现在约[GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]金币），签约时定下，当场付第一年，此后每年一月支付。\n对方正与我们交战时，只有在战场上没占上风才会接受，战争随即结束（双方都是战争领袖时白和；否则不是领袖的一方退出战争）。不在交战时，对方接受的可能为#Y 70%#!，对我们的好感低于#Y −50#!时为#Y 40%#!。被拒绝后#Y 12#!个月内不能再向该国求和。\n接受后：威望#R −15#!，[oe_tu_authority|e]#R −5#!，对方对我们的好感#G +25#!（#Y 5#!年）。同一国家只能有一份协议，同时最多#Y 3#!份。付不出岁币或中途停付：协议作废，停战取消，威望#R −10#!，对方对我们的好感#R −40#!（背约，#Y 5#!年）。\n[oe_tu_senate|e]的反应：每付一笔岁币（签约时和每年一月），元老院对岁币的非议就上升：这笔钱每相当于我们#Y 1#!个月的总收入，加#Y 2#!点；此前付过的岁币还被记着的，每有一笔再多加#Y 25%#!（最多算#Y 4#!笔；每付一笔记一笔，每年一月淡忘#Y 0.5#!笔）。非议每月回落#Y 3%#!，再减#Y 0.25#!。现为[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]，[GetCountry('BYZ').Custom('OeTtbSenTier')]。\n达到#Y 15#!：贵族的满意度目标#R −3%#!；进入时每个[oe_tu_charter|e]忠诚#R −3#!（计入忠诚目标#Y 5#!年）。非议降到#Y 5#!以下时解除。\n达到#Y 40#!：贵族的满意度目标#R −6%#!（取代上一级）；进入时每个在元老院有席位的行省（特许城邦、[oe_tu_exarchate|e]、宗室封邑）忠诚#R −3#!（计入忠诚目标#Y 5#!年），帝国权威#R −2#!。非议降到#Y 15#!以下时退回上一级。\n达到#Y 70#!：贵族的满意度目标#R −10%#!（取代上一级）；进入时每个在元老院有席位的行省（特许城邦、总督区、宗室封邑）忠诚#R −5#!（计入忠诚目标#Y 5#!年），帝国权威#R −3#!。非议降到#Y 40#!以下时退回上一级。\n忠诚低的行省在元老院表决时更可能投反对票；贵族的满意度低时，贵族出身的宫廷官员也是如此。"
 oe_ttb_buy_peace_select: "选择求和的对象"
 oe_ttb_buy_peace_none: "@trigger_no!没有可以纳币求和的国家（对方须兵力多于我们，且与我们接壤、隔一片海相望或正在交战，并且还没有协议）。"
 oe_ttb_buy_peace_tt: "使节带着第一年的岁币（约[GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]金币）前往所选国家，对方的答复随即送回。"
 oe_ttb_refused_tt: "该国在近#Y 12#!个月内拒绝过我们的使节"
 oe_ttb_allow_count: "同时进行的纳币协议少于#Y 3#!份"
 oe_ttb_allow_gold: "国库至少有第一年的岁币（[GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]金币）"
 oe_ttb_allow_any: "至少有一份纳币协议"
 oe_ttb_stop_peace: "停付岁币"
 oe_ttb_stop_peace_desc: "不再向一个国家支付岁币。协议作废，停战取消，威望#R −10#!，该国对我们的好感#R −40#!（背约，#Y 5#!年）。与一月付不出岁币的后果相同。"
 oe_ttb_stop_peace_select: "选择要停付的协议"
 oe_ttb_stop_peace_none: "@trigger_no!我们没有在向任何国家支付岁币。"
 oe_ttb_stop_peace_tt: "协议作废，停战取消。威望#R −10#!，该国对我们的好感#R −40#!（背约，#Y 5#!年）。"
 oe_ttb_tt_ally_cd: "由朝贡国升为罗马同盟已满#Y 10#!年"
 oe_ttb.1.t: "新的朝贡国"
 oe_ttb.1.d: "1304年，热那亚贵族贝内德托·扎卡里亚夺取了希俄斯岛。安德罗尼卡二世无力收回，只好承认既成事实，把岛作为封地授给他，先以#Y 10#!年为期，此后每五年续约一次。1329年，安德罗尼卡三世率舰队收回了这座岛。1355年，弗朗切斯科·加蒂卢西奥帮助约翰五世重回君士坦丁堡，受封莱斯沃斯领主，娶了皇帝的妹妹玛丽亚，以皇帝封臣的身份统治这座岛。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_trib').GetName]向皇帝称臣纳贡。皇帝要给这个新的藩属一个名分。"
 oe_ttb.1.a: "授其君主首席尊者之号"
 oe_ttb.1.a.tt: "通过[oe_tu_dignity|e]制度授予[SCOPE.sCountry('oe_ttb_ev_trib').GetName]的君主首席尊者：威望#R −10#!，[oe_tu_authority|e]#R −4#!。\n受封君主终身持有尊号，每月威望#G +0.05#!。\n[SCOPE.sCountry('oe_ttb_ev_trib').GetName]对我们的好感#G +25#!（每年回落#Y 2#!），君主在位期间另#G +10#!；作为附庸，对宗主的忠诚#G +8#!。\n[SCOPE.sCountry('oe_ttb_ev_trib').GetName]#Y 5#!年内不能再受封。\n只有该国在“君王大家庭”中有位次、君主可以受封、我们负担得起时才出现。"
 oe_ttb.1.b: "许以皇室联姻"
 oe_ttb.1.b.tt: "[SCOPE.sCountry('oe_ttb_ev_trib').GetName]对我们的好感#G +30#!（#Y 10#!年）。\n威望#G +5#!。\n这只是许诺，不会安排真正的婚事。"
 oe_ttb.1.c: "准其驻港通商"
 oe_ttb.1.c.tt: "我们获得“藩属港口与商路”#Y 10#!年：商人力量#G +5%#!，海上存在#G +10%#!（只保留一份，再次授予时重新计满#Y 10#!年）。\n[SCOPE.sCountry('oe_ttb_ev_trib').GetName]对我们的好感#G +15#!（#Y 10#!年）。"
 oe_ttb.2.t: "朝贡国请为同盟"
 oe_ttb.2.d: "1312年加里波利一战之后，塞尔维亚国王米卢廷派诺瓦克·格雷博斯特雷克率第二支援军到小亚细亚，帮安德罗尼卡二世对付突厥人。皇帝厚赏了这支援军，1313年颁给希兰达尔修道院的金玺诏书还特意感谢米卢廷的援助。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_trib').GetName]向皇帝纳贡已满十年，同帝国关系亲近。它的使节来问，能否像罗马同盟那样在战时追随皇帝，换得更亲近的地位。"
 oe_ttb.2.a: "接纳为罗马同盟"
 oe_ttb.2.a.tt: "[SCOPE.sCountry('oe_ttb_ev_trib').GetName]由朝贡国改为罗马同盟：参加我们的每一场战争，贡金按罗马同盟的规定为#Y 10%#!，双方都不能单方面解除，不能被吞并。\n成为罗马同盟满#Y 10#!年、对我们的好感不低于#Y 50#!后，可在民政敕令中升为行省化附庸，再往后可以[oe_tu_provincialise|e]。"
 oe_ttb.2.b: "再等几年"
 oe_ttb.2.b.tt: "[SCOPE.sCountry('oe_ttb_ev_trib').GetName]仍是朝贡国。#Y 5#!年后若条件仍然满足，会再提出。"
 oe_ttb.3.t: "宗主名分"
 oe_ttb.3.d: "皇帝以前也有过名义上的封臣。1304到1329年，扎卡里亚家族统治希俄斯，名义上是皇帝的封臣；1355年起，加蒂卢西奥家族也以皇帝封臣的身份统治莱斯沃斯。\n\n如今，帝国柱石的权威达到#Y 50#!，皇帝又有了收纳藩属的名分。"
 oe_ttb.3.a: "四方来朝"
 oe_ttb.3.a.tt: "（已经生效）我们获得“宗主名分”：可以通过外交提议，把其他国家收为朝贡国（原版朝贡国：按年交贡，不能被吞并，双方都可以解除）；外交声誉#G +1#!。\n[oe_tu_authority|e]跌到#Y 40#!以下时失去这一名分，已有的朝贡国照旧。\n新的朝贡国会请求名分；朝贡满#Y 10#!年、对我们的好感不低于#Y 50#!、属东方教会或在罗马世界中的，可以升为罗马同盟。"
 oe_ttb.4.t: "宗主名分旁落"
 oe_ttb.4.d: "如今，帝国柱石的权威跌到了#Y 40#!以下。皇帝暂时没有收纳新藩属的名分，已有的朝贡国照旧。"
 oe_ttb.4.a: "来日再图"
 oe_ttb.4.a.tt: "（已经生效）失去“宗主名分”：不能再收新的朝贡国。[oe_tu_authority|e]回到#Y 50#!以上时恢复。"
 oe_ttb.5.t: "岁币换来停战"
 oe_ttb.5.d1: "如今，[SCOPE.sCountry('oe_ttb_ev_t').GetName]收下了我们的岁币，我们之间的战争就此结束。双方停战#Y 5#!年。每年一月我们付给[SCOPE.sCountry('oe_ttb_ev_t').GetName][GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_ev_amt').GetValue|0]金币，第一年的岁币已经付清。哪一年付不出，或我们中途停付，停战就作废。"
 oe_ttb.5.d: "如今，[SCOPE.sCountry('oe_ttb_ev_t').GetName]收下了我们的岁币。双方停战#Y 5#!年。每年一月我们付给[SCOPE.sCountry('oe_ttb_ev_t').GetName][GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_ev_amt').GetValue|0]金币，第一年的岁币已经付清。哪一年付不出，或我们中途停付，停战就作废。"
 oe_ttb.5.a: "只好如此"
 oe_ttb.5.a.tt: "（已经生效）威望#R −15#!，[oe_tu_authority|e]#R −5#!。\n[SCOPE.sCountry('oe_ttb_ev_t').GetName]对我们的好感#G +25#!（#Y 5#!年）。\n[oe_tu_senate|e]对岁币的非议 +[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_last').GetValue|0]，现为[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]，[GetCountry('BYZ').Custom('OeTtbSenTier')]。"
 oe_ttb.6.t: "使节无功而返"
 oe_ttb.6.d1: "1331年尼西亚失陷后，安德罗尼卡三世向奥尔罕提出纳贡求和，奥尔罕没有接受。尼科米底亚被围数年，1337年仍然陷落。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_t').GetName]在战场上占着上风，不肯收我们的岁币。"
 oe_ttb.6.d: "1331年尼西亚失陷后，安德罗尼卡三世向奥尔罕提出纳贡求和，奥尔罕没有接受。尼科米底亚被围数年，1337年仍然陷落。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_t').GetName]拒绝了我们的岁币。"
 oe_ttb.6.a: "另想办法"
 oe_ttb.6.a.tt: "没有花费。[SCOPE.sCountry('oe_ttb_ev_t').GetName]在#Y 12#!个月内不会再接见我们的求和使节。"
 oe_ttb.7.t: "岁币协议作废"
 oe_ttb.7.d1: "如今，国库拿不出今年该付给[SCOPE.sCountry('oe_ttb_ev_t').GetName]的岁币。协议作废，停战随之取消。"
 oe_ttb.7.d: "如今，我们与[SCOPE.sCountry('oe_ttb_ev_t').GetName]又打了起来，岁币协议随之作废。"
 oe_ttb.7.a: "这是背约"
 oe_ttb.7.a.tt: "（已经生效）停战取消。威望#R −10#!。\n[SCOPE.sCountry('oe_ttb_ev_t').GetName]对我们的好感#R −40#!（背约，#Y 5#!年）。"
 oe_ttb.7.b: "不必再付了"
 oe_ttb.7.b.tt: "（已经生效）不再支付岁币。这一次我们没有背约的惩罚。"
 oe_ttb.8.t: "纳币求和：答复"
 oe_ttb.1.d_pre: "1304年，热那亚贵族贝内德托·扎卡里亚夺取了希俄斯岛。安德罗尼卡二世无力收回，只好承认既成事实，把岛作为封地授给他，先以#Y 10#!年为期，此后每五年续约一次。1329年，安德罗尼卡三世率舰队收回了这座岛。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_trib').GetName]向皇帝称臣纳贡。皇帝要给这个新的藩属一个名分。"
 oe_ttb.3.d_pre: "皇帝以前也有过名义上的封臣。1304到1329年，扎卡里亚家族统治希俄斯，名义上是皇帝的封臣。\n\n如今，帝国柱石的权威达到#Y 50#!，皇帝又有了收纳藩属的名分。"
 oe_ttb.6.d1_pre: "1331年尼西亚失陷后，安德罗尼卡三世向奥尔罕提出纳贡求和，奥尔罕没有接受。尼科米底亚已被围困多年。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_t').GetName]在战场上占着上风，不肯收我们的岁币。"
 oe_ttb.6.d_pre: "1331年尼西亚失陷后，安德罗尼卡三世向奥尔罕提出纳贡求和，奥尔罕没有接受。尼科米底亚已被围困多年。\n\n如今，[SCOPE.sCountry('oe_ttb_ev_t').GetName]拒绝了我们的岁币。"
