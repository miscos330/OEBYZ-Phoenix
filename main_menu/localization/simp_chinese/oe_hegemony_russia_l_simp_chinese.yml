l_simp_chinese:
 OE_RW_RUSSIA: "俄罗斯"
 OE_RW_RUSSIA_DESC: "从黑海诸港沿大河溯流而上，草原与森林之间的罗斯世界向帝国敞开。商路、谷物与古老的信仰，将成为罗马北方方略的根基。"
 OE_RW_RUSSIA_OPEN: "点击地图展开俄罗斯行动"
 OE_RW_RUSSIA_ACTIONS: "俄罗斯行动"
 OE_RW_RUSSIA_HINT: "点击地图查看行动；点击关闭收起行动面板。"
 OE_RW_KAFFA: "卡法"
 OE_RW_KAFFA_OWNER: "卡法的拥有者"
 OE_HEG_RUSSIA_ACTIONS_HINT: "先施行黑海方略。其余行动要求东罗马及其各级附属国完全拥有克里米亚的全部可征服地点。"
 OE_HEG_BLACK_SEA_PLAN_REQUIRED: "已完成黑海方略"
 OE_HEG_CRIMEA_REQUIRED: "东罗马及其各级附属国拥有克里米亚地区全部可征服地点；军事占领不算"
 OE_HEG_BOSPORUS_LAND_REQUIRED: "东罗马在大草原大区至少直接拥有一处可以划给博斯普鲁斯王国的地点"
 oe_heg_plan_black_sea: "黑海方略"
 oe_heg_plan_black_sea_desc: "花费1000金币，将克里米亚地区纳入罗马文明圈，并开启向罗斯世界进军的后续行动。"
 oe_heg_plan_black_sea_effect: "花费#R 1000#!金币，将克里米亚地区纳入罗马文明圈。"
 oe_heg_black_sea_plan_done: "已完成：黑海方略"
 oe_heg_invade_russia: "远征罗斯世界"
 oe_heg_invade_russia_desc: "花费200金币、20政治影响力和5稳定度，选择一个首都位于大草原、鲁塞尼亚或俄罗斯大区的外国，获得以夺取其首都为战争目标的宣战理由。"
 oe_heg_invade_russia_effect: "花费#R 200#!金币、#R 20#!政治影响力和#R 5#!稳定度，获得针对所选国家的“帝国远征”宣战理由，战争目标为夺取其首都，有效期15年。"
 oe_heg_restore_bosporus: "复兴博斯普鲁斯王国"
 oe_heg_restore_bosporus_desc: "花费1000金币与50政治影响力，将大草原大区内东罗马直接拥有的领土交予复兴的博斯普鲁斯王国。保留塔曼、塔纳、克索奈索斯、卢斯塔、索尔代亚、卡法、沃斯波罗及图阿普谢省。"
 oe_heg_restore_bosporus_effect: "花费#R 1000#!金币、#R 50#!政治影响力。划出符合条件的东罗马直属领土，建立信奉东正教、以哥特文化为主流文化的博斯普鲁斯王国，附庸类型为黑海王国。开启哥特文化认同运动，并为卡法、塔纳、克索奈索斯永久授予“黑海自贸港”修正。"
 oe_heg_bosporus_restored: "已完成：复兴博斯普鲁斯王国"
 OE_BOSPORUS_KINGDOM: "博斯普鲁斯"
 OE_BOSPORUS_KINGDOM_ADJ: "博斯普鲁斯"
 oe_black_sea_kingdom: "黑海王国"
 oe_black_sea_kingdom_desc: "依托黑海商路与草原沃土的自治王国，为帝国供应粮秣、牲畜与战马，守护北方航道。"
 oe_black_sea_free_port: "黑海自贸港"
 oe_black_sea_free_port_desc: "帝国以特许状保障这里的商贸，扩充市集与仓栈，使黑海诸港成为谷物、马匹与远方货物汇聚之地。"
 oe_gothic_identity_movement: "哥特文化认同运动"
 oe_gothic_identity_movement_desc: "克里米亚的古老教堂与新兴港埠，重新联系起山地、草原与海岸。随着帝国法度、学校和军伍深入各地，克里米亚人口将在哥特之名下融入罗马世界。仅在东罗马及其各级附属国境内、仍有克里米亚文化人口的地点传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"

 STATIC_MODIFIER_NAME_oe_black_sea_free_port: "$oe_black_sea_free_port$"
 STATIC_MODIFIER_DESC_oe_black_sea_free_port: "$oe_black_sea_free_port_desc$"
