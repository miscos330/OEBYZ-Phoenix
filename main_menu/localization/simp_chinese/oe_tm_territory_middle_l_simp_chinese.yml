 oe_tm.1.t: "设省"
 oe_tm.1.d: "公元17年，卡帕多细亚末代国王阿凯劳斯死后，提比略把这个附庸王国改为行省。1018年，巴西尔二世收服保加利亚，在其故地设保加利亚军区，治所在斯科普里；他下令沿用保加利亚原有的税制，保加利亚贵族也保住了地位。\n\n元老院通过了设省的议案。原附庸国已经并入帝国，故地分设为下列行省："
 oe_tm.1.d1_frontier: "\n· [SCOPE.sCountry('oe_tm_t1').GetName]（边镇）"
 oe_tm.1.d1_exarch: "\n· [SCOPE.sCountry('oe_tm_t1').GetName]（总督区）"
 oe_tm.1.d2_frontier: "\n· [SCOPE.sCountry('oe_tm_t2').GetName]（边镇）"
 oe_tm.1.d2_exarch: "\n· [SCOPE.sCountry('oe_tm_t2').GetName]（总督区）"
 oe_tm.1.d3_frontier: "\n· [SCOPE.sCountry('oe_tm_t3').GetName]（边镇）"
 oe_tm.1.d3_exarch: "\n· [SCOPE.sCountry('oe_tm_t3').GetName]（总督区）"
 oe_tm.1.dk: "\n\n原统治者[SCOPE.sCharacter('oe_tm_king').GetName]已经来到君士坦丁堡。可以让[SCOPE.sCharacter('oe_tm_king').GetHerHim]出任[SCOPE.sCountry('oe_tm_t1').GetName]的首任长官。"
 oe_tm.1.a: "请[SCOPE.sCharacter('oe_tm_king').GetName]出任首任长官"
 oe_tm.1.a.tt: "[SCOPE.sCharacter('oe_tm_king').GetName]出任[SCOPE.sCountry('oe_tm_t1').GetName]的长官，朝廷原先指派的人选作罢。[SCOPE.sCountry('oe_tm_t1').GetName]忠诚#G +10#!，并计入忠诚目标#Y 5#!年。"
 oe_tm.1.b: "由朝廷另派长官"
 oe_tm.1.b.tt: "[SCOPE.sCharacter('oe_tm_king').GetName]留在君士坦丁堡。[SCOPE.sCountry('oe_tm_t1').GetName]忠诚#R −5#!，并计入忠诚目标#Y 5#!年；[oe_tu_authority|e]#G +3#!。"
 oe_tm.1.c: "就这样办"
 oe_tm.1.c.tt: "各行省由朝廷指派的长官治理。"
 oe_tm.2.t: "元老院否决设省"
 oe_tm.2.d: "奥古斯都在位时多保留附庸王国，往往等国王去世后才改设行省。\n\n元老院否决了把[SCOPE.sCountry('oe_tm_rej').GetName]设为行省的议案。消息传到那里的宫廷，帝国的打算已经人尽皆知。"
 oe_tm.2.a: "暂且作罢"
 oe_tm.2.a.tt: "[SCOPE.sCountry('oe_tm_rej').GetName]#Y 5#!年内不能再提[oe_tu_provincialise|e]；它对帝国的好感#R −20#!（每年回升#Y 2#!）。"
 oe_tm.3.t: "附庸离心"
 oe_tm.3.d: "公元17年，提比略把科马基尼并入叙利亚行省。38年，卡利古拉又把它交还给安条克四世，作为附庸王国。\n\n[SCOPE.sCountry('oe_tm_dem').GetName]对帝国的不满已经持续三年。那里的宫廷要求恢复罗马同盟的旧约，不再受行省化的约束。"
 oe_tm.3.a: "恢复同盟旧约"
 oe_tm.3.a.tt: "[SCOPE.sCountry('oe_tm_dem').GetName]退回罗马同盟：贡金降为#Y 10%#!，不再只与皇族通婚；#Y 10#!年内不能再整合为行省化附庸。"
 oe_tm.3.b: "以帝国权威安抚"
 oe_tm.3.b.tt: "[oe_tu_authority|e]#R −10#!；[SCOPE.sCountry('oe_tm_dem').GetName]对帝国的好感#G +25#!（每年回落#Y 2#!）；不满的计时重新开始。"
 oe_tm.4.t: "同盟出兵"
 oe_tm.4.d: "罗马的同盟者向来以出兵为主要义务，按约出兵，换取帝国的庇护。1312年前后，塞尔维亚国王米卢廷派诺瓦克·格雷博斯特雷克率兵，助安德罗尼卡二世对付小亚细亚的突厥人。\n\n征伐开始，帝国向各附庸发出征召："
 oe_tm.4.a1_1: "\n· [SCOPE.sCountry('oe_tm_a1').GetName]应召，出兵#Y 1#!个团"
