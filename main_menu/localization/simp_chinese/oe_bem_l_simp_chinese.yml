l_simp_chinese:
 oe_bem_b_tubingen_dialogue: "图宾根—君堡神学往来"
 oe_bem_b_tubingen_rebuke: "君堡牧首严拒新教异端"
 oe_bem_b_pan_orthodox_league: "泛正教大公会议同盟"
 oe_bem_b_catholic_friction: "东方正教抵制特兰托会议"
 oe_bem_b_prot_covert_aid: "宗教战争暗助新教同盟"
 oe_bem_b_war_rel_hostile: "东罗马干涉三十年宗教战争"
 oe_bem_b_monarchist_horror: "震怒于第二罗马共和革命"
 oe_bem_b_constit_accord: "立宪紫衣帝国宪制互敬"
 STATIC_MODIFIER_NAME_oe_bem_tubingen_correspondence: "图宾根—君堡印刷与通信通道"
 STATIC_MODIFIER_DESC_oe_bem_tubingen_correspondence: "牧首耶利米亚二世在神学上严守正统，却保留与德意志大学和印刷坊的书信通道；学术科研受益，保守教士阶层则心存疑虑。"
 STATIC_MODIFIER_NAME_oe_bem_orthodox_bulwark: "严守正教古道壁垒"
 STATIC_MODIFIER_DESC_oe_bem_orthodox_bulwark: "断然拒绝与西方新教往来，国内正教凝聚力与教士拥戴大涨，但西方新思潮传入随之迟滞。"
 STATIC_MODIFIER_NAME_oe_bem_wittenberg_colloquy: "君堡—维滕贝格联合学理会议"
 STATIC_MODIFIER_DESC_oe_bem_wittenberg_colloquy: "跨越教派樊篱举办希腊与德意志学人共议，思潮与外交声誉跃升，却招致国内正教教士的激烈反弹。"
 STATIC_MODIFIER_NAME_oe_bem_pan_orthodox_mod: "泛正教大公会议宪章"
 STATIC_MODIFIER_DESC_oe_bem_pan_orthodox_mod: "以君士坦丁堡为核心统合巴尔干与东欧正教牧区抵御反宗教改革渗透，本教凝聚大增而异端与天主教关系趋紧。"
 STATIC_MODIFIER_NAME_oe_bem_polemical_chair: "帝国学院反辩神学讲座"
 STATIC_MODIFIER_DESC_oe_bem_polemical_chair: "在君士坦丁堡学院专设神学与文献辨析讲座，提高帝国识字与正统性，宫廷拨款与教会辩论亦加重负担。"
 STATIC_MODIFIER_NAME_oe_bem_war_rel_protestant_aid: "三十年风暴：暗助新教商权"
 STATIC_MODIFIER_DESC_oe_bem_war_rel_protestant_aid: "暗中资助德意志新教诸侯牵制哈布斯堡与神圣罗马帝国，换取中欧商路与炮术情报，代价是天主教世界与保守教士不满。"
 STATIC_MODIFIER_NAME_oe_bem_war_rel_neutral_freight: "中立军需与谷物海运"
 STATIC_MODIFIER_DESC_oe_bem_war_rel_neutral_freight: "在西欧深陷宗教血战时高价承运粮秣、硝石与军资，国库商税大增，但列强皆讥帝国唯利是图。"
 STATIC_MODIFIER_NAME_oe_bem_war_rel_danube_push: "多瑙河与亚得里亚战备动员"
 STATIC_MODIFIER_DESC_oe_bem_war_rel_danube_push: "趁中欧列强无暇东顾整军经武、压迫多瑙河与亚得里亚边境，军心与攻城锐增，军费与贵族负担随之攀升。"
 STATIC_MODIFIER_NAME_oe_bem_confessional_fortress: "威斯特伐利亚后：正教国教坚壁"
 STATIC_MODIFIER_DESC_oe_bem_confessional_fortress: "在教派战争落幕后锁定正教国教体制，国内秩序与教会忠诚稳如磐石，对外来思潮则趋于保守。"
 STATIC_MODIFIER_NAME_oe_bem_imperial_toleration_edict: "威斯特伐利亚后：帝国宗教宽容宪章"
 STATIC_MODIFIER_DESC_oe_bem_imperial_toleration_edict: "颁行宽容法令吸纳避难西欧工匠与商帮，商贸与思潮加速传播，正教保守派教士却深感教权受削。"
 STATIC_MODIFIER_NAME_oe_bem_line_theme_standing: "帝国线列常备军团制"
 STATIC_MODIFIER_DESC_oe_bem_line_theme_standing: "废除世袭普罗诺亚旧制，全面编练滑膛枪线列常备职业军团；全军纪律与士气脱胎换骨，但军饷重负与旧勋贵怨恨急剧飙升。"
 STATIC_MODIFIER_NAME_oe_bem_gradual_theme_battalions: "渐进新式军区步兵营"
 STATIC_MODIFIER_DESC_oe_bem_gradual_theme_battalions: "在保留贵族世袭军官特权的前提下分期编练火枪步兵营，纪律与兵源稳步改善，但仍须承担免税与军饷折损。"
 STATIC_MODIFIER_NAME_oe_bem_magnate_purge_aftermath: "平定旧勋贵叛乱创伤"
 STATIC_MODIFIER_DESC_oe_bem_magnate_purge_aftermath: "铁腕抄没色雷斯与安纳托利亚反叛采邑确立了皇室控制，但连年清乡令行省繁荣与岁入在短期内明显受创。"
 STATIC_MODIFIER_NAME_oe_bem_crown_demesne_secured: "皇室直领与常备军确立"
 STATIC_MODIFIER_DESC_oe_bem_crown_demesne_secured: "彻底清除旧普罗诺亚大族掣肘，将没收庄园划归皇室直辖，行省控制力与财税大振，残存贵族则长怀芥蒂。"
 STATIC_MODIFIER_NAME_oe_bem_compromised_army_mod: "妥协退化：半新旧混合军区"
 STATIC_MODIFIER_DESC_oe_bem_compromised_army_mod: "在旧勋贵抗命压力下重颁贵族免税特许，线列军制被迫折中退化：纪律远逊预期，国库岁入反遭长期侵蚀。"
 STATIC_MODIFIER_NAME_oe_bem_golden_horn_manuf: "金角湾皇家官营手工工场"
 STATIC_MODIFIER_DESC_oe_bem_golden_horn_manuf: "在金角湾与塞萨洛尼基敕建官营丝绒、铸炮与造船大工场，税效、产效与发展提速，却加重劳役负担并推高通胀。"
 STATIC_MODIFIER_NAME_oe_bem_imperial_academy_sci: "君士坦丁堡帝国格物科学院"
 STATIC_MODIFIER_DESC_oe_bem_imperial_academy_sci: "将古老的君堡大学改组为近代自然科学与数学研究院，科研与识字大跃升，但教士阶层与国库经费皆感吃紧。"
 STATIC_MODIFIER_NAME_oe_bem_basilicae_absolutist: "《新巴西利卡法典》：绝对皇权版"
 STATIC_MODIFIER_DESC_oe_bem_basilicae_absolutist: "统一整合查士丁尼法典与四大近卫大区律令，内阁效率与全国控制力剧增，但地方自治与市民阶层备受压抑。"
 STATIC_MODIFIER_NAME_oe_bem_basilicae_estates: "《新巴西利卡法典》：元老院与等级宪章"
 STATIC_MODIFIER_DESC_oe_bem_basilicae_estates: "以成文法明确皇权、元老院与近卫大区议会的分权边界，各阶层满意与外交信誉提升，中央税效与直控则略有让渡。"
 STATIC_MODIFIER_NAME_oe_bem_diafotismos_patronage: "紫衣启蒙：开明学社与官报"
 STATIC_MODIFIER_DESC_oe_bem_diafotismos_patronage: "庇护君堡、塞萨洛尼基与雅典的启蒙报馆、古典译社与法政沙龙，科研与思潮飞跃，却令教士与旧秩序加速承压。"
 STATIC_MODIFIER_NAME_oe_bem_imperial_censorship: "帝国书报审查与思想禁令"
 STATIC_MODIFIER_DESC_oe_bem_imperial_censorship: "查封激进报馆、严控外来启蒙小册子，短期稳住皇权控制与教会支持，代价是学术滞后与市民阶层离心。"
 STATIC_MODIFIER_NAME_oe_bem_revolutionary_ferment: "革命风暴拍打狄奥多西城墙"
 STATIC_MODIFIER_DESC_oe_bem_revolutionary_ferment: "公民权、宪法与民族主权口号席卷博斯普鲁斯与行省港市，思潮涌动而旧贵族与朝廷秩序陷入剧烈震荡。"
 STATIC_MODIFIER_NAME_oe_bem_second_roman_republic: "第二罗马共和国：公民军团与主权复归"
 STATIC_MODIFIER_DESC_oe_bem_second_roman_republic: "元老院与罗马人民复归最高主权！公民征兵、科研与市民热情空前高涨，代价是旧贵族与教士阶层敌对及全欧君主侧目。"
 STATIC_MODIFIER_NAME_oe_bem_republic_conservative_charter: "元老院温和罗马共和宪制"
 STATIC_MODIFIER_DESC_oe_bem_republic_conservative_charter: "由元老院与富有市民主导的稳健共和体制，兼顾公民军力与社会过渡，但阶层妥协削弱了财政效率与旧阶层忠诚。"
 STATIC_MODIFIER_NAME_oe_bem_constitutional_basileia: "立宪紫衣帝国：两院共治宪章"
 STATIC_MODIFIER_DESC_oe_bem_constitutional_basileia: "皇帝在成文法典之下，与元老院及公民议会共治帝国；内阁、思潮、商贸与各阶层满意度全面受益，皇室独断与直控则受宪制约束。"
 STATIC_MODIFIER_NAME_oe_bem_constitutional_constrained: "仓促立宪：妥协折中君主宪章"
 STATIC_MODIFIER_DESC_oe_bem_constitutional_constrained: "缺乏前期法典与议会根基而仓促颁行的宪章虽勉强平息革命风暴，却在合法性、行政直控与稳定成本上留下隐痛。"
 STATIC_MODIFIER_NAME_oe_bem_autocrat_assimilated: "神圣自专君主制：罗马化一体铁腕"
 STATIC_MODIFIER_DESC_oe_bem_autocrat_assimilated: "凭藉前期广土罗马同化奠定的深厚认同，铁腕自专皇权稳住大局、军纪与正统高涨，仅承受轻微分离张力与市民科研滞后。"
 STATIC_MODIFIER_NAME_oe_bem_autocrat_unrest: "神圣自专君主制：民族主义浪潮反噬"
 STATIC_MODIFIER_DESC_oe_bem_autocrat_unrest: "拒绝宪制改革又缺乏充分罗马同化基础，巴尔干、意大利与近东行省爆发激烈民族离心，虽保皇权军纪，繁荣与科研皆遭重创。"
 STATIC_MODIFIER_NAME_oe_bem_millennium_steam_empire: "1836蒸汽紫衣帝国：千年工业冠冕"
 STATIC_MODIFIER_DESC_oe_bem_millennium_steam_empire: "蒸汽机、炼铁高炉与早铁轨沿着博斯普鲁斯与色萨利轰鸣延伸，产效、商贸与帝威登峰造极，而劳工阵痛与物价亦随之而来。"
 STATIC_MODIFIER_NAME_oe_bem_millennium_balanced_crown: "1836五百年国祚：新罗马秩序永固"
 STATIC_MODIFIER_DESC_oe_bem_millennium_balanced_crown: "从1337风雨飘摇到1836巍然屹立，帝国以稳健内阁与法治秩序跨入近代纪元，常备海陆防务的维持费则提醒后世居安思危。"
 STATIC_MODIFIER_NAME_oe_bem_dec_drills_mod: "线列军区实弹演武"
 STATIC_MODIFIER_DESC_oe_bem_dec_drills_mod: "按近代步兵操典组织大规模线列齐射与炮兵协同演武，全军纪律与士气提振，但火药弹药消耗令军费承压。"
 STATIC_MODIFIER_NAME_oe_bem_dec_magnate_concession_mod: "旧勋贵采邑和解特许"
 STATIC_MODIFIER_DESC_oe_bem_dec_magnate_concession_mod: "以阶段性减税与荣誉封衔换取旧普罗诺亚大族配合军改，国内怨恨与稳定压力缓解，岁入效率则短期受损。"
 STATIC_MODIFIER_NAME_oe_bem_dec_printing_bureau_mod: "帝国官报与法典印书局"
 STATIC_MODIFIER_DESC_oe_bem_dec_printing_bureau_mod: "由君堡官营印书局统一刊行法令、学术译著与双语官报，加速全国思潮与识字提升，却伴随教士非议与行政磨合成本。"
 STATIC_MODIFIER_NAME_oe_bem_dec_steam_charter_mod: "金角湾蒸汽工场皇家特许状"
 STATIC_MODIFIER_DESC_oe_bem_dec_steam_charter_mod: "特许煤铁与蒸汽动力工场入驻君士坦丁堡沿岸，工业产出与税基显著扩张，同时推高通胀并加剧底层劳工摩擦。"
 oe_bem_dec_line_theme_drills.title: "举行线列军区实弹演武"
 oe_bem_dec_line_theme_drills.desc: "按绝对主义时代新操典调集线列步兵团与野战炮兵进行实弹齐射演武，提升全军纪律与士气，并在军改退化后重立常备军旗标（代价：金币与陆军维持费）。"
 oe_bem_dec_line_theme_drills.a: "颁诏调集线列军区演武"
 oe_bem_dec_pacify_magnates.title: "整饬与安抚旧勋贵采邑"
 oe_bem_dec_pacify_magnates.desc: "在常备军区改制引发贵族剧烈反弹之际，以阶段性财政补贴与荣誉封衔缓和色雷斯及安纳托利亚大族怨恨（旧勋贵怨恨下降20点，代价：金币、威望与短期税效折损）。"
 oe_bem_dec_pacify_magnates.a: "颁赐采邑和解特许与封衔"
 oe_bem_dec_imperial_printing_press.title: "敕设帝国官报与法典印书局"
 oe_bem_dec_imperial_printing_press.desc: "在君士坦丁堡设立由皇室直辖的官报与法典印书局，统一刊印新法典、学术译著与近代公文，大幅提速全国思潮传播与识字（代价：金币、教士不满与稳定成本）。"
 oe_bem_dec_imperial_printing_press.a: "御批设立帝国官报印书局"
 oe_bem_dec_industrial_charter.title: "颁行金角湾蒸汽工场特许状"
 oe_bem_dec_industrial_charter.desc: "在革命与工业化黎明之际，向君士坦丁堡金角湾沿岸的煤铁与蒸汽动力工场颁发皇家特许状，加速工业化落地并扩张税基（代价：高额投资、通胀与底层劳工承压）。"
 oe_bem_dec_industrial_charter.a: "签发金角湾蒸汽工场特许状"
 oe_bem.1.t: "耶利米亚二世牧首与图宾根信札"
 oe_bem.1.d: "随着德意志宗教改革席卷拉丁基督教世界，图宾根大学的路德宗神学家将希腊文译本《奥格斯堡信纲》呈递君士坦丁堡普世牧首座，恳请东方教会评断教义、共抗罗马教廷。这封横跨多瑙河与阿尔卑斯山的书简，令博斯普鲁斯的宫廷与大牧首院陷入深思。\n\n面对西方新教伸出的橄榄枝，帝国当在驳正神学的同时维系德意志印刷与学术往来、断然划清正教古道界限，还是借人文思潮破格召开联合学理会议？"
 oe_bem.1.a: "神学严正驳难，但保留德意志印刷与使节通道"
 oe_bem.1.a.tt: "金币#R −80#!、教士满意度小幅下降，推动#bold #color_yellow 印刷术#!#!与#bold #color_yellow 教派主义#!#!传播，获得[ShowModifier('oe_bem_tubingen_correspondence')]（#Y 30年#!）；德意志新教诸邦好感提升。"
 oe_bem.1.b: "效法正教古道传统，严辞断绝新教异端往来"
 oe_bem.1.b.tt: "宗教影响力#G +15#!，获得[ShowModifier('oe_bem_orthodox_bulwark')]（#Y 30年#!；若文艺复兴曾走静修派额外稳定#G +4#!）；新教诸国好感下降。"
 oe_bem.1.c: "【IF】召开君堡—维滕贝格联合学理会议"
 oe_bem.1.c.tt: "需希拉人文派传承或开启IF规则：金币#R −120#!、稳定#R −5#!、教会张力大增，大幅推进#bold #color_yellow 教派主义#!#!与#bold #color_yellow 印刷术#!#!，获得[ShowModifier('oe_bem_wittenberg_colloquy')]（#Y 30年#!）。"
 oe_bem.2.t: "特兰托反改与泛正教大公会议"
 oe_bem.2.d: "天主教会借特兰托会议重整旗鼓，耶稣会士与拉丁传教团正向东地中海、达尔马提亚与东欧正教边境渗透，试图以东仪天主教会瓦解正教统一。亚历山大、安条克、耶路撒冷与北方罗斯牧首区的使节纷纷致书君士坦丁堡，呼吁帝国作出果断回应。\n\n皇帝与大牧首是将召聚全正教世界召开大公会议筑牢信仰防线，还是依托帝国学院设立反辩神学讲座、以学术与出版迎战拉丁传教团？"
 oe_bem.2.a: "召开泛正教大公会议，统合东欧与东地中海正教防线"
 oe_bem.2.a.tt: "金币#R −180#!、宗教影响力#G +20#!，获得[ShowModifier('oe_bem_pan_orthodox_mod')]（#Y 35年#!；若双鹰共治生效额外威望#G +12#!）；罗斯好感提升，天主教列强好感下降。"
 oe_bem.2.b: "在帝国学院设立反辩神学讲座，以文献与出版迎击拉丁渗透"
 oe_bem.2.b.tt: "金币#R −130#!（若帝国学院等级达标减为#Y 80#!）、教士满意度小幅下降，推进#bold #color_yellow 教派主义#!#!，获得[ShowModifier('oe_bem_polemical_chair')]（#Y 35年#!）。"
 oe_bem.3.t: "三十年宗教风暴中的紫色帝国"
 oe_bem.3.d: "德意志与中欧的教派积怨彻底引爆为席卷大陆的宗教大战。天主教同盟与新教同盟在莱茵河与多瑙河上游彼此撕裂，列强焦头烂额、国库枯竭，全欧粮食、硝石与佣兵价格一日三涨。\n\n站在多瑙河下游与爱琴海门户，新罗马可以暗中资助新教同盟削弱西方竞争对手、保持武装中立高价承运军需，还是趁西欧失血之机经略多瑙河与亚得里亚防线？"
 oe_bem.3.a: "暗助新教同盟以弱西方神罗，换取德意志商权与炮术情报"
 oe_bem.3.a.tt: "金币#R −200#!、教士不满，推进#bold #color_yellow 火炮思潮#!#!，获得[ShowModifier('oe_bem_war_rel_protestant_aid')]（#Y 25年#!）；新教列强好感提升，天主教与哈布斯堡好感大降。"
 oe_bem.3.b: "严守武装中立，以帝国商船高价承运粮秣与军需"
 oe_bem.3.b.tt: "金币#G +150#!、威望#R −10#!，推进#bold #color_yellow 全球贸易#!#!，获得[ShowModifier('oe_bem_war_rel_neutral_freight')]（#Y 25年#!）。"
 oe_bem.3.c: "趁西欧混战整军经武，压迫多瑙河与亚得里亚边境"
 oe_bem.3.c.tt: "金币#R −120#!、贵族不满，推进#bold #color_yellow 火炮思潮#!#!，获得[ShowModifier('oe_bem_war_rel_danube_push')]（#Y 25年#!）。"
 oe_bem.4.t: "威斯特伐利亚后的帝国定位"
 oe_bem.4.d: "历经百年教派攻伐，欧洲各国筋疲力尽，逐步确立了以主权国家与外交均势为核心的近代国际格局。宗教十字军的旧梦逐渐退潮，摆在君士坦丁堡面前的，是如何在教派时代之后安顿庞大的多民族、多教派帝国。\n\n第一幕尘埃落定：帝国将以正教国教坚壁稳固腹心，还是颁布宗教宽容宪章吸纳西欧逃亡工匠与商帮、为绝对主义时代蓄力？"
 oe_bem.4.a: "锁定正教国教坚壁，以信仰纯一稳固帝国根基"
 oe_bem.4.a.tt: "稳定#G +5#!、教会张力缓和，结束第一幕并获得[ShowModifier('oe_bem_confessional_fortress')]（#Y 40年#!）。"
 oe_bem.4.b: "颁行帝国宗教宽容宪章，吸纳西欧工匠与商帮"
 oe_bem.4.b.tt: "金币#R −100#!、教士不满、革命张力微升，推进#bold #color_yellow 全球贸易#!#!，结束第一幕并获得[ShowModifier('oe_bem_imperial_toleration_edict')]（#Y 40年#!）。"
 oe_bem.5.t: "线列军区改革"
 oe_bem.5.d: "步入绝对主义时代，欧洲战场已彻底属于燧发滑膛枪线列齐射、刺刀方阵与标准口径野战炮。昔日支撑帝国复兴的传统军区征召兵与世袭普罗诺亚采邑贵族，在高度纪律化的常备职业军团面前愈发显得冗员低效、尾大不掉。\n\n兵部尚书呈上两套军制改制蓝图：要么彻底废除旧普罗诺亚采邑、以国库直发军饷编练常备线列军团（必将激起旧勋贵滔天怨恨！），要么渐进编练新式军区步兵营并保留世家军官特权。改制一旦确立，将为帝国迈向近代正规兵种体系打下根基。"
 oe_bem.5.a: "彻底废除旧普罗诺亚，编练帝国线列常备职业军团"
 oe_bem.5.a.tt: "确立#bold #color_yellow 常备线列军改#!#!旗标，按月收入支出金币（最高#R −200#!）、贵族重度不满、旧勋贵怨恨#R +65#!（达到警戒将引爆抗命危机！），推进#bold #color_yellow 军事革命#!#!，获得[ShowModifier('oe_bem_line_theme_standing')]（#Y 45年#!）。"
 oe_bem.5.b: "渐进编练新式军区步兵营，保留贵族世袭军官特权"
 oe_bem.5.b.tt: "确立#bold #color_yellow 常备线列军改#!#!旗标，按月收入支出金币（最高#R −120#!）、旧勋贵怨恨#R +35#!，推进#bold #color_yellow 军事革命#!#!，获得[ShowModifier('oe_bem_gradual_theme_battalions')]（#Y 45年#!）。"
 oe_bem.5.c: "国库拮据：以阶层折抵与威望让步分期试行线列营（免扣金币）"
 oe_bem.5.c.tt: "确立#bold #color_yellow 常备线列军改#!#!旗标，不耗国库金币，代价为稳定#R −4#!、威望#R −12#!、贵族不满及旧勋贵怨恨#R +45#!，推进#bold #color_yellow 军事革命#!#!并获得[ShowModifier('oe_bem_gradual_theme_battalions')]（#Y 45年#!）。"
 oe_bem.6.t: "色雷斯与安纳托利亚勋贵抗命"
 oe_bem.6.d: "军区改制触动了数百年盘根错节的土地与税赋既得利益！色雷斯、比提尼亚与安纳托利亚腹地的旧普罗诺亚大族暗中串联，联合拒绝上缴新编线列军税、扣押宫廷清丈官吏，并扬言若朝廷不恢复世家免税古制，便要效法中世纪旧例拥立边疆督军抗命！\n\n这是绝对主义改革最凶险的关口：是斥巨资、冒内耗铁腕镇压并没收反叛采邑以绝后患，还是退让妥协重颁免税特许、眼看常备军改制折中退化？"
 oe_bem.6.a: "铁腕镇压并没收反叛采邑，彻底清除世家掣肘"
 oe_bem.6.a.tt: "金币#R −250#!、稳定#R −8#!、贵族重度不满，承受[ShowModifier('oe_bem_magnate_purge_aftermath')]（#Y 5年#!），成功后永久清零旧勋贵怨恨、强化常备军旗标并获[ShowModifier('oe_bem_crown_demesne_secured')]（#Y 30年#!）。"
 oe_bem.6.b: "退让妥协重颁免税特许，换取行省暂安（军改降级）"
 oe_bem.6.b.tt: "威望#R −15#!，常备军改制失效并降级为[ShowModifier('oe_bem_compromised_army_mod')]（#Y 35年#!），撤销常备线列军改旗标直至日后重整演武。"
 oe_bem.7.t: "金角湾官营工场与帝国格物科学院"
 oe_bem.7.d: "十七世纪末至十八世纪初，手工工场与近代科学革命席卷欧亚商路。君士坦丁堡金角湾沿岸的旧式行会作坊正面临规模化分工工场的挑战，而昔日拜占庭文艺复兴留下的帝国学院，也迎来了向近代数学、天文与格物科学院转型的契机。\n\n朝廷财力有限，当优先敕建官营丝绒、铸炮与造船手工工场夯实重商税基，还是将君士坦丁堡大学改组为帝国格物科学院、引领科学革命？"
 oe_bem.7.a: "兴建金角湾官营丝绒、铸炮与造船手工工场"
 oe_bem.7.a.tt: "金币#R −300#!、农民不满，推进#bold #color_yellow 手工工场#!#!思潮，获得[ShowModifier('oe_bem_golden_horn_manuf')]（#Y 35年#!）。"
 oe_bem.7.b: "改组君士坦丁堡大学为帝国格物科学院"
 oe_bem.7.b.tt: "金币#R −220#!（新柏拉图/人文派传承减为#Y 160#!且思潮提速）、教士不满、革命张力微升，推进#bold #color_yellow 科学革命#!#!，获得[ShowModifier('oe_bem_imperial_academy_sci')]（#Y 35年#!）。"
 oe_bem.8.t: "《新巴西利卡法典》编纂"
 oe_bem.8.d: "从查士丁尼《民法大全》到利奥六世《巴西利卡》，罗马帝国历来以成文法统驭广土众民。然而历经数百年疆域变迁、近卫大区重设与近代商贸兴起，各地习惯法、教廷敕令与军区旧例早已彼此抵牾，亟需一部贯通全帝国的近代成文法典。\n\n法学家委员会呈上两份草案：一部是将一切裁决收归御前内阁的绝对主义集权法典，另一部则是承认元老院与近卫大区等级议会职权的帝国成文法——后者也将为未来立宪埋下深远伏笔。"
 oe_bem.8.a: "颁布中央集权版《新巴西利卡法典》（绝对君主制）"
 oe_bem.8.a.tt: "金币#R −180#!、革命张力上升，缓解光复负担并结束第二幕，获得[ShowModifier('oe_bem_basilicae_absolutist')]（#Y 40年#!；若四大近卫大区齐备或唯有一帝结局额外威望#G +15#!）。"
 oe_bem.8.b: "颁布等级制帝国成文法，保留元老院与大区议会职权"
 oe_bem.8.b.tt: "金币#R −150#!，奠定#bold #color_yellow 立宪根基#!#!（第三幕立宪帝国代价减半！），缓解光复负担并结束第二幕，获得[ShowModifier('oe_bem_basilicae_estates')]（#Y 40年#!）。"
 oe_bem.9.t: "紫衣启蒙"
 oe_bem.9.d: "步入革命时代（1737年后），启蒙思潮在欧亚大陆全面绽放。史实中流散维也纳与威尼斯的“现代希腊启蒙（Diafotismos）”，此刻竟直接在屹立不倒的君士坦丁堡、塞萨洛尼基、雅典与亚历山大爆发：报馆林立、古希腊共和经典重印、世俗法理与公民权利论在咖啡馆与沙龙中热议不休。\n\n皇室将以开明专制之姿庇护学人、借启蒙加速近代化（却无可避免地推高革命压力），还是设立严厉书报审查机构压制激进思潮？"
 oe_bem.9.a: "以开明专制庇护启蒙学人、报馆与世俗法学沙龙"
 oe_bem.9.a.tt: "金币#R −150#!、教士不满、革命压力#R +25#!，推进#bold #color_yellow 启蒙思潮#!#!，获得[ShowModifier('oe_bem_diafotismos_patronage')]（#Y 30年#!）。"
 oe_bem.9.b: "设立帝国书报审查局，严禁激进民权小册子流传"
 oe_bem.9.b.tt: "金币#R −80#!、市民不满、革命压力#G −15#!，获得[ShowModifier('oe_bem_imperial_censorship')]（#Y 30年#!）。"
 oe_bem.10.t: "旧大陆的风暴"
 oe_bem.10.d: "旧秩序正在全欧洲轰然崩解！革命口号、三色徽章与“民族主权”传单穿越阿尔卑斯山与地中海，拍打在屹立千年的狄奥多西城墙之下。君士坦丁堡竞技场旧址聚满高呼宪法的市民与学生，元老院辩论彻夜不息，行省驻军亦在观望御前决断。\n\n站在十八世纪末的历史绝壁之上，千年帝国必须交出属于自己的终极宪制回答：复归“第二罗马共和国”、转型“立宪紫衣帝国”，还是以铁腕神圣自专君主制正面迎战民族与革命浪潮？"
 oe_bem.10.a: "路径一：召开公民大会——宣告“第二罗马共和国”复归主权！"
 oe_bem.10.a.tt: "承受短期动荡[ShowModifier('oe_bem_revolutionary_ferment')]，立即进入#bold #color_yellow 第二罗马共和国#!#!宪制终局抉择（.11）。"
 oe_bem.10.b: "路径二：召聚元老院与公民代表——缔造“立宪紫衣帝国”"
 oe_bem.10.b.tt: "承受短期动荡[ShowModifier('oe_bem_revolutionary_ferment')]，立即进入#bold #color_yellow 立宪紫衣帝国#!#!宪制终局抉择（.12；有前期立宪根基者代价减半）。"
 oe_bem.10.c: "路径三：拒斥革命妥协——坚持“神圣自专君主制与帝国大清算”"
 oe_bem.10.c.tt: "承受短期动荡[ShowModifier('oe_bem_revolutionary_ferment')]，立即进入#bold #color_yellow 神圣自专君主制#!#!终局抉择（.13；联动全帝国罗马同化进度）。"
 oe_bem.11.t: "第二罗马共和国"
 oe_bem.11.d: "“元老院与罗马人民（SPQR）复归主权！”千年帝号在欢呼与惊愕中落幕，执政官与国民议会在君士坦丁堡重新升起共和鹰旗。公民普遍兵役制与近代工业思潮如决堤江河般席卷帝国，但全欧君主制列强视此为灭顶威胁，国内旧贵族与教会也对新政权怒目而视。\n\n新生的第二罗马共和国将彻底贯彻激进公民共和宪章，还是由元老院与有产市民主导一份较为温和的共和法统？"
 oe_bem.11.a: "彻底实行公民共和与全民动员宪章（激进第二共和国）"
 oe_bem.11.a.tt: "政体转为#bold #color_yellow 共和国#!#!，稳定#R −10#!、贵族与教士剧烈不满、全欧君主列强好感大降，大力推进#bold #color_yellow 全民动员#!#!与#bold #color_yellow 工业化#!#!，获得[ShowModifier('oe_bem_second_roman_republic')]（#Y 60年#!）。"
 oe_bem.11.b: "由元老院与有产市民执掌温和共和宪章"
 oe_bem.11.b.tt: "政体转为#bold #color_yellow 共和国#!#!，稳定#R −6#!、贵族不满，推进#bold #color_yellow 全民动员#!#!，获得[ShowModifier('oe_bem_republic_conservative_charter')]（#Y 60年#!）。"
 oe_bem.12.t: "立宪紫衣帝国"
 oe_bem.12.d: "紫衣皇帝在圣索菲亚与元老院大厅庄严宣誓效忠《帝国大宪章》：“皇帝在法典之下，元老院与公民议会共治天下！”古老的罗马帝冠没有在革命烈火中碎裂，而是借两院代议制平滑接纳了启蒙法治与早期工业化的澎湃浪潮。\n\n若前期《新巴西利卡法典》已为帝国埋下立宪根基，此次转型将事半功倍；否则朝廷仍须付出高昂财力与政治妥协方能推行完整宪章。"
 oe_bem.12.a: "颁布完整两院制《紫衣帝国大宪章》，全面吸纳启蒙与工业红利"
 oe_bem.12.a.tt: "若有立宪根基：按月收入支出金币（最高#R −120#!）、稳定#R −3#!（否则按月收入最高#R −260#!、稳定#R −8#!）；推进#bold #color_yellow 启蒙思潮#!#!与#bold #color_yellow 工业化#!#!，获得[ShowModifier('oe_bem_constitutional_basileia')]（#Y 60年#!）。"
 oe_bem.12.b: "颁行审慎折中宪章，以有限让步换取平稳过渡（降级宪制；国库不足时改付威望与稳定）"
 oe_bem.12.b.tt: "若国库足额付金币#R −100#!与稳定#R −4#!（国库不足时免扣金币，改付稳定#R −6#!与威望#R −12#!）；推进#bold #color_yellow 启蒙思潮#!#!，获得降级态[ShowModifier('oe_bem_constitutional_constrained')]（#Y 60年#!）。"
 oe_bem.13.t: "神圣自专君主制与帝国民族大清算"
 oe_bem.13.d: "皇帝严词拒绝任何限制皇权的宪法要求，宣布紫衣帝统源自上天与罗马法统，不容暴民染指！皇家线列军团开进首都广场，解散激进社团，并在多民族帝国全境展开铁腕大清算。\n\n然而十九世纪的民族主义烈火早已点燃：凡在过往数百年间深入推行过罗马化同化的行省尚可安然无恙；若帝国同化根基尚浅，巴尔干、意大利与近东必将爆发剧烈离心骚动！"
 oe_bem.13.a: "厉行铁腕自专皇权，以罗马一统法统弹压离心浪潮"
 oe_bem.13.a.tt: "金币#R −150#!、市民不满；若已开启≥#Y 3#!项罗马同化则获轻损版[ShowModifier('oe_bem_autocrat_assimilated')]，否则稳定#R −6#!并爆发强烈分离[ShowModifier('oe_bem_autocrat_unrest')]（#Y 60年#!）。"
 oe_bem.13.b: "颁布战时戒严与全国军管征兵，以武力锁死旧秩序"
 oe_bem.13.b.tt: "金币#R −220#!、稳定#R −4#!，推进#bold #color_yellow 全民动员#!#!，并依罗马同化进度分别赋予[ShowModifier('oe_bem_autocrat_assimilated')]或[ShowModifier('oe_bem_autocrat_unrest')]（#Y 60年#!）。"
 oe_bem.14.t: "帝国蒸汽与千年句点"
 oe_bem.14.d: "十九世纪初叶，蒸汽机的轰鸣与炼铁高炉的火光沿着金角湾、塞萨洛尼基与色萨利绵延开来，早期的铁轨与蒸汽轮船正将博斯普鲁斯与地中海连成一体。回望自1337年风雨飘摇之境起步的五百年长卷——内战、黑死病、文艺复兴、近卫大区重光、教派风暴、线列军改乃至革命大潮——新罗马不仅活了下来，更亲手改写了近世世界的版图。\n\n站在1836年新纪元的门槛上，帝国将为这五百年史诗刻下怎样的终章印记？"
 oe_bem.14.a: "全速拥抱蒸汽、煤铁与早铁轨，铸就近代工业新罗马"
 oe_bem.14.a.tt: "金币#R −300#!、威望#G +25#!、底层劳工承压，推进#bold #color_yellow 工业化#!#!，收官近世三幕并获得[ShowModifier('oe_bem_millennium_steam_empire')]（#Y 40年#!）。"
 oe_bem.14.b: "以稳健法治与海陆秩序收束五百年国祚，从容跨入近代"
 oe_bem.14.b.tt: "金币#R −150#!、稳定#G +8#!、威望#G +15#!，收官近世三幕并获得[ShowModifier('oe_bem_millennium_balanced_crown')]（#Y 40年#!）。"
 oe_bem.20.t: "拜占庭近世现代化：选项生效"
