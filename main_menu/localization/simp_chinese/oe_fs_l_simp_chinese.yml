l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_fs_crown_land: "皇产"
 STATIC_MODIFIER_NAME_oe_fs_held_land: "新土直辖"
 STATIC_MODIFIER_NAME_oe_fs_new_rule: "新民旧俗"
 STATIC_MODIFIER_NAME_oe_fs_crown_won: "废黜的王冠"
 STATIC_MODIFIER_NAME_oe_fs_exking_court: "授衔留京"
 STATIC_MODIFIER_NAME_oe_fs_exking_monk: "遁入修院"
 oe_fs_old_house: "旧王归来，复为专制公"
 oe_fs.1.t: "战后安排"
 oe_fs.1.desc_kr: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区；当地原来的赋税办法照旧。#!\n\n[oe_fs_cap.GetName]的王冠已经落到皇帝手里。新得的土地里还没有划进军区的有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#!处；旧都一带的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#!处可以留作#bold #color_yellow 皇产#!#!，由帝国直辖。其余#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_rest_n')|0]#!处怎样安排，要皇帝定夺。\n\n旧王[oe_fs_k.GetFirstNameWithNoTooltip]已被带到京城，等候发落。"
 oe_fs.1.desc_k: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区；当地原来的赋税办法照旧。#!\n\n[oe_fs_cap.GetName]的王冠已经落到皇帝手里。新得的土地里还没有划进军区的有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#!处，地方不大，都可以留作#bold #color_yellow 皇产#!#!，由帝国直辖。\n\n旧王[oe_fs_k.GetFirstNameWithNoTooltip]已被带到京城，等候发落。"
 oe_fs.1.desc_r: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区；当地原来的赋税办法照旧。#!\n\n[oe_fs_cap.GetName]的王冠已经落到皇帝手里。新得的土地里还没有划进军区的有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#!处；旧都一带的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#!处可以留作#bold #color_yellow 皇产#!#!，由帝国直辖。其余#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_rest_n')|0]#!处怎样安排，要皇帝定夺。"
 oe_fs.1.desc_x: "#F 1018年，巴西尔二世灭了保加利亚，在它的土地上设了军区；当地原来的赋税办法照旧。#!\n\n[oe_fs_cap.GetName]的王冠已经落到皇帝手里。新得的土地里还没有划进军区的有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#!处，地方不大，都可以留作#bold #color_yellow 皇产#!#!，由帝国直辖。"
 oe_fs.1.a: "废除王冠，其余土地分设军区"
 oe_fs.1.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_cost_a')|0]#![oe_tu_authority|e]\n设立#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_nth')|0]#!个军区，治所各在不同的地区；其余土地按远近归入各军区。接壤外国的军区为[oe_tu_march|e]，否则为[oe_tu_exarchate|e]\n其余土地得到[ShowModifier('oe_fs_new_rule')]，持续#Y 5#!年\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#!处皇产得到[ShowModifier('oe_fs_crown_land')]，持续#Y 20#!年；帝国得到[ShowModifier('oe_fs_crown_won')]，持续#Y 10#!年\n若办不成，其余土地照“暂不处置”办理"
 oe_fs.1.b: "废除王冠，封一位宗室为专制公"
 oe_fs.1.b.tt: "其余土地设一个军区，治所在人口最多的一处；宗室中年纪最长的一位受封为专制公，这个军区成为宗室封邑\n花费#R 10#![oe_tu_authority|e]和#R 10#!威望（与封宗室专制公的行动同价）\n其余土地得到[ShowModifier('oe_fs_new_rule')]，持续#Y 5#!年\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#!处皇产得到[ShowModifier('oe_fs_crown_land')]，持续#Y 20#!年；帝国得到[ShowModifier('oe_fs_crown_won')]，持续#Y 10#!年\n若办不成，其余土地照“暂不处置”办理"
 oe_fs.1.c: "立一位当地领主为专制公，归入罗马同盟"
 oe_fs.1.c.tt: "以[oe_fs_s1.GetName]为都立一个公国，作为帝国的罗马同盟附庸；其余土地都归它\n威望#G +5#!；若[oe_tu_dignity|e]还有名额，其君主受封专制公尊号\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#!处皇产得到[ShowModifier('oe_fs_crown_land')]，持续#Y 20#!年；帝国得到[ShowModifier('oe_fs_crown_won')]，持续#Y 10#!年\n若立国不成，其余土地照“暂不处置”办理"
 oe_fs.1.d: "暂不处置，全部直辖"
 oe_fs.1.d.tt: "其余土地得到[ShowModifier('oe_fs_held_land')]，持续#Y 10#!年；以后仍可照常设立军区\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#!处皇产得到[ShowModifier('oe_fs_crown_land')]，持续#Y 20#!年；帝国得到[ShowModifier('oe_fs_crown_won')]，持续#Y 10#!年"
 oe_fs.2.t: "旧王"
 oe_fs.2.desc_hl: "#F 1340年，伊庇鲁斯的年轻君主尼基福罗斯投降以后，娶了坎塔库泽诺斯家的女儿，得了帝国的高衔。#!\n\n昔日的君主[oe_fs_k.GetFirstNameWithNoTooltip]被带到了京城。此人如今没有了王冠，却仍有旧日的名望，皇帝要定下其去处。"
 oe_fs.2.desc_h: "#F 1018年保加利亚归附以后，当地的贵族保住了原来的地位。#!\n\n昔日的君主[oe_fs_k.GetFirstNameWithNoTooltip]被带到了京城。此人如今没有了王冠，却仍有旧日的名望，皇帝要定下其去处。"
 oe_fs.2.desc_xl: "#F 1340年，伊庇鲁斯的年轻君主尼基福罗斯投降以后，娶了坎塔库泽诺斯家的女儿，得了帝国的高衔。#!\n\n可是旧王一家在路上散了，没能带到京城。"
 oe_fs.2.desc_x: "#F 1018年保加利亚归附以后，当地的贵族保住了原来的地位。#!\n\n可是旧王一家在路上散了，没能带到京城。"
 oe_fs.2.a: "授以尊衔，留居京城"
 oe_fs.2.a.tt: "此人得到#bold #color_yellow 授衔留京#!#!（入内阁时办事略强）\n威望#G +5#!"
 oe_fs.2.b: "送入修院"
 oe_fs.2.b.tt: "此人得到#bold #color_yellow 遁入修院#!#!，不能再入内阁、继位、领兵或婚娶\n稳定#G +7#!"
 oe_fs.2.c: "让其回去，做新公国的专制公"
 oe_fs.2.c.tt: "此人成为[oe_fs_a.GetName]的君主\n[oe_fs_a.GetName]对帝国的好感#G +25#!，每年减少#Y 2#!"
 oe_fs.2.d: "任为新军区的第一任将军"
 oe_fs.2.d.tt: "此人成为[oe_fs_t1.GetName]的统治者\n[oe_fs_t1.GetName]的忠诚#G +10#!"
 oe_fs.2.e: "王族已散"
 oe_fs.2.e.tt: "什么也不发生"
 oe_fs.12.t: "筑堡置屯"
 oe_fs.12.desc_r1: "#F 1240年代，约翰三世把库曼人安置在色雷斯、马其顿和弗里吉亚，条件是为帝国当兵。#!\n\n[GetCountry('BYZ').Custom('OeFsRegEv')]的边区经营到了第三步。立籍已满，地方上的户口和田亩都登记在册。招民也有了着落：新户已经落在[oe_fs_pk.GetName]。边地只有修起堡垒、安下兵户，才算守得住。"
 oe_fs.12.desc_r2: "#F 1240年代，约翰三世把库曼人安置在色雷斯、马其顿和弗里吉亚，条件是为帝国当兵。#!\n\n[GetCountry('BYZ').Custom('OeFsRegEv')]的边区经营到了第三步。立籍已满，地方上的户口和田亩都登记在册。这里没有可招民的荒地，招民一步就省下了。边地只有修起堡垒、安下兵户，才算守得住。"
 oe_fs.12.desc_r3: "#F 1240年代，约翰三世把库曼人安置在色雷斯、马其顿和弗里吉亚，条件是为帝国当兵。#!\n\n[GetCountry('BYZ').Custom('OeFsRegEv')]的边区经营到了第三步。立籍已满，地方上的户口和田亩都登记在册。招民却迟迟没有办成。边地只有修起堡垒、安下兵户，才算守得住。"
 oe_fs.12.a: "在边地修一座堡垒"
 oe_fs.12.a.tt: "花费#R 150#!金币\n在[oe_fs_fl.GetName]修一座#bold #color_yellow 城堡#!#!，立即建成；造不了时，当地改得[ShowModifier('oe_fs_fort_loc')]，持续#Y 20#!年"
 oe_fs.12.b: "招外族兵户入军区"
 oe_fs.12.b.tt: "花费#R 3#![oe_tu_authority|e]和#R 150#!金币（与“安置兵户”行动同价）\n[oe_fs_ths.GetName]得到外族兵户：兵员更多、募兵更快，辖区人口增长更快，持续#Y 20#!年，头#Y 5#!年地方不太安定；同一军区#Y 30#!年内只安置一次"
 oe_fs.12.c: "以本地农户为兵户"
 oe_fs.12.c.tt: "花费#R 3#![oe_tu_authority|e]和#R 150#!金币（与“安置兵户”行动同价）\n[oe_fs_ths.GetName]得到本地兵户：兵员和募兵略增，辖区里的人更快同化，地方也较安定，持续#Y 20#!年；同一军区#Y 30#!年内只安置一次"
 oe_fs.12.d: "把边地授作普罗尼亚"
 oe_fs.12.d.tt: "[oe_fs_thp.GetName]的[oe_tu_fiscal|e]改为[oe_tu_pronoia|e]（与军区官制里“授地”同效；两年内不能再改官制）\n不花钱"
 oe_fs.12.e: "暂缓一年再议"
 oe_fs.12.e.tt: "#Y 12#!个月后再议一次；下次不能再缓"
 oe_fs.12.f: "就此作罢，不筑不屯"
 oe_fs.12.f.tt: "这一步什么也不做，经营照常往下走"
 oe_fs.13.t: "招资"
 oe_fs.13.desc_x: "#F 1318年11月，清丈官把阿索斯山伊维隆修道院在帖撒罗尼迦军区的田产和依附农户逐一登记，为修院出具了清册。#!\n\n[GetCountry('BYZ').Custom('OeFsRegE13')]的边区经营到了第四步。户口已经在册，边防也有了着落，可要让这里兴旺起来，还缺一笔本钱。出钱的人都要回报，请谁出资，要皇帝定夺。"
 oe_fs.13.a: "请一家豪族出资"
 oe_fs.13.a.tt: "国库得到#G +200#!金币，由[GetCountry('BYZ').Custom('OeFsHouse')]家出\n此后#Y 20#!年，每年一月付回报：前#Y 10#!年每年#R 24#!金币，后#Y 10#!年每年#R 12#!金币；付不起时记作欠款，下次先还，并且[oe_tu_authority|e]#R −1#!\n契约期内[GetCountry('BYZ').Custom('OeFsHouse')]家的影响每年#Y +3#!；拖欠的那一年再#Y +5#!\n大区里帝国的地得到[ShowModifier('oe_fs_backed')]，持续#Y 20#!年\n可以用帝国柱石行动“赎回边区股份”提前了结\n#Y 10#!年后到第五步归化"
 oe_fs.13.b: "请阿索斯山的修院出资"
 oe_fs.13.b.tt: "国库得到#G +150#!金币，不付回报\n[oe_fs_mk.GetName]得到[ShowModifier('oe_fs_monk_loc')]，持续#Y 20#!年；教士阶层的满意度略升\n大区里帝国的地得到[ShowModifier('oe_fs_backed')]，持续#Y 20#!年\n#Y 10#!年后到第五步归化"
 oe_fs.13.c: "请当地的修院出资"
 oe_fs.13.c.tt: "国库得到#G +150#!金币，不付回报\n[oe_fs_mk.GetName]得到[ShowModifier('oe_fs_monk_loc')]，持续#Y 20#!年；教士阶层的满意度略升\n大区里帝国的地得到[ShowModifier('oe_fs_backed')]，持续#Y 20#!年\n#Y 10#!年后到第五步归化"
 oe_fs.13.d: "请罗马商社出资"
 oe_fs.13.d.tt: "[oe_tu_company|e]从本钱里借给国库#G +200#!金币\n此后#Y 20#!年，每年一月付回报：前#Y 10#!年每年#R 24#!金币，后#Y 10#!年每年#R 12#!金币；付不起时记作欠款，下次先还，并且[oe_tu_authority|e]#R −1#!\n回报付进商社的本钱；商社由此更有底气，自主度略升（由商社自己记账）\n若商社被收归国有或解散，契约随之了结\n大区里帝国的地得到[ShowModifier('oe_fs_backed')]，持续#Y 20#!年\n可以用帝国柱石行动“赎回边区股份”提前了结\n#Y 10#!年后到第五步归化"
 oe_fs.13.e: "由国库自筹"
 oe_fs.13.e.tt: "花费#R 150#!金币；不欠任何人\n[oe_tu_authority|e]#G +2#!\n大区里帝国的地得到[ShowModifier('oe_fs_backed')]，持续#Y 20#!年\n#Y 10#!年后到第五步归化"
 oe_fs.13.f: "无人出资，照常经营"
 oe_fs.13.f.tt: "这一步什么也不做\n#Y 10#!年后到第五步归化"
 oe_fs.14.t: "归化"
 oe_fs.14.desc_x: "#F 七到十世纪，帝国在边境的隘口设克莱苏拉，由一名长官专管守关；边地安定以后，不少克莱苏拉升为正式的军区。#!\n\n[GetCountry('BYZ').Custom('OeFsRegE14')]的边区经营已满#Y 10#!年。当年的荒地有了村落，堡垒和兵户守着边界，这块边地可以算是帝国自己的了。"
 oe_fs.14.a: "趁势推行罗马化"
 oe_fs.14.a.tt: "在这一带发起罗马世界的认同运动（与罗马世界面板上相应的按钮同效）\n[oe_fs_cen.GetName]得到[ShowModifier('oe_fs_settled')]；这份边区经营就此完成，该大区不再开档"
 oe_fs.14.b: "记功立碑，到此为止"
 oe_fs.14.b.tt: "[oe_fs_cen.GetName]得到[ShowModifier('oe_fs_settled')]；这份边区经营就此完成，该大区不再开档"
 STATIC_MODIFIER_NAME_oe_fs_prog_loc: "边区立籍"
 STATIC_MODIFIER_NAME_oe_fs_fort_loc: "边堡"
 oe_fs_fort_paid: "边区经营已付工钱"
 oe_fs_cl_reg_none: "（某大区）"
 oe_fs_cl_free: "空着"
 oe_fs_cl_p1_s1: "[GetCountry('BYZ').Custom('OeFsRegP1')]，第一步立籍（#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p1_w')|0]#!/#Y 24#!个月）"
 oe_fs_cl_p1_s2: "[GetCountry('BYZ').Custom('OeFsRegP1')]，第二步招民（第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p1_w')|0]#!个月，最多#Y 36#!个月）"
 oe_fs_cl_p1_s3: "[GetCountry('BYZ').Custom('OeFsRegP1')]，第三步筑堡置屯（等候定夺）"
 oe_fs_cl_p2_s1: "[GetCountry('BYZ').Custom('OeFsRegP2')]，第一步立籍（#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p2_w')|0]#!/#Y 24#!个月）"
 oe_fs_cl_p2_s2: "[GetCountry('BYZ').Custom('OeFsRegP2')]，第二步招民（第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p2_w')|0]#!个月，最多#Y 36#!个月）"
 oe_fs_cl_p2_s3: "[GetCountry('BYZ').Custom('OeFsRegP2')]，第三步筑堡置屯（等候定夺）"
 oe_fs_cl_p3_s1: "[GetCountry('BYZ').Custom('OeFsRegP3')]，第一步立籍（#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p3_w')|0]#!/#Y 24#!个月）"
 oe_fs_cl_p3_s2: "[GetCountry('BYZ').Custom('OeFsRegP3')]，第二步招民（第#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p3_w')|0]#!个月，最多#Y 36#!个月）"
 oe_fs_cl_p3_s3: "[GetCountry('BYZ').Custom('OeFsRegP3')]，第三步筑堡置屯（等候定夺）"
 oe_fs_open_prog: "经营边区"
 oe_fs_open_prog_desc: "为一个历史大区开一份边区经营档案，一步步把新得或荒芜的边地变成帝国自己的：第一步#bold #color_yellow 立籍#!#!（#Y 24#!个月），第二步#bold #color_yellow 招民#!#!（由[oe_tu_resettle|e]去办，招什么人照常由皇帝定），第三步#bold #color_yellow 筑堡置屯#!#!（修边堡、招兵户或授地），第四步#bold #color_yellow 招资#!#!（请豪族、修院或[oe_tu_company|e]出钱，或由国库自筹），#Y 10#!年后第五步#bold #color_yellow 归化#!#!（可趁势推行罗马化）。\n花费#R 3#![oe_tu_authority|e]和#R 100#!金币。同时最多#Y 3#!份。帝国在该大区要有至少#Y 3#!处地，其中至少#Y 2#!处是荒地，或有一处是近#Y 20#!年从外国手里得来的。战火烧到该大区时（那里有地被占，或与交战国接壤），计时暂停。\n现在：档案一：[GetCountry('BYZ').Custom('OeFsP1')]；档案二：[GetCountry('BYZ').Custom('OeFsP2')]；档案三：[GetCountry('BYZ').Custom('OeFsP3')]。在第四、五步的#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_wait4_n')|0]#!份，出资契约#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_bk_n')|0]#!份。"
 oe_fs_open_prog_card: "为一个历史大区开一份边区经营：立籍、招民、筑堡置屯、招资、归化。"
 oe_fs_open_prog_select: "选择大区（亮着的大区可以开档）"
 oe_fs_open_prog_none: "@trigger_no!没有可以开档的大区：帝国在该大区要有3处以上的地，并有荒地或新得的地；已在经营的大区不能再开。"
 oe_fs_open_prog_tt: "花费#R 3#![oe_tu_authority|e]和#R 100#!金币，为所选大区开一份边区经营档案，从第一步立籍开始。"
 oe_fs_allow_calm: "帝国没有内战"
 oe_fs_allow_slot: "正在经营的边区不到3份"
