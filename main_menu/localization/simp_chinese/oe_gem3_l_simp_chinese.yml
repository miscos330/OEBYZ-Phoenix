# NEW 2026-11-23 v19.5 Renaissance Republics & Alpine Bastions — Module 19.5-C: Florence & Old Swiss Confederacy Localization (simp_chinese) (oe_gem3_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_flo_swi.py; edit the generator, not this file.
 oe_gem3_flo_black_bands:0 "佛罗伦萨黑旗军"
 oe_gem3_flo_black_bands_desc:0 "效法乔瓦尼“黑旗军”成制的托斯卡纳精锐长矛火绳枪重步兵，兼具市民军纪、精钢胸甲与山地渡河野战协同之威。"
 oe_gem3_swi_reislaufer_pikemen:0 "瑞士雇佣长矛方阵"
 oe_gem3_swi_reislaufer_pikemen_desc:0 "源自瑞士各州世袭民兵的阿尔卑斯重装长矛与战戟方阵，擅长正面粉碎封建重骑冲锋，并以铜墙铁壁守御险峻山口。"
 oe_gem3_dec_medici_bank_charter.title:0 "颁布梅第奇银行特许状"
 oe_gem3_dec_medici_bank_charter.desc:0 "特许佛罗伦萨复式记账银号组建泛欧汇兑与教廷清结算网络；在银行业思潮传抵佛罗伦萨或公元 #Y 1397#! 年后即可颁行。"
 oe_gem3_dec_medici_bank_charter.a:0 "在市政长老会钤印颁布梅第奇银行特许状"
 oe_gem3_dec_tagsatzung_neutrality.title:0 "颁布联邦议会武装中立盟约"
 oe_gem3_dec_tagsatzung_neutrality.desc:0 "汲取阿尔卑斯争霸的血泪教训，由联邦议会确立永久武装中立国策：不卷入列强王位混战，而将每座山口要隘铸成不可逾越的堡垒（公元 #Y 1515#! 年后可颁行）。"
 oe_gem3_dec_tagsatzung_neutrality.a:0 "批准永久武装中立盟约"
 STATIC_MODIFIER_NAME_oe_gem3_mod_medici_bank_charter:0 "梅第奇银行特许状"
 STATIC_MODIFIER_DESC_oe_gem3_mod_medici_bank_charter:0 "复式账簿、教廷清算特权与泛欧分支网络将佛罗伦萨推上欧洲金融之巅。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_tagsatzung_neutrality:0 "联邦议会武装中立盟约"
 STATIC_MODIFIER_DESC_oe_gem3_mod_tagsatzung_neutrality:0 "永久武装中立以固若金汤的阿尔卑斯山垒震慑外敌，同时赢得全欧诸国的外交敬重。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m1:0 "梅第奇泛欧金融网络"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m1:0 "设于罗马、威尼斯、里昂与布鲁日的佛罗伦萨银号分行将信用与金银源源汇回阿诺河畔。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m2:0 "马基雅维利市民军与黑旗战阵"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m2:0 "忠于共和国的托斯卡纳市民征兵制与黑旗长矛火枪精锐彻底取代了不可靠的雇佣队长。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m3:0 "佛罗伦萨人文硕学盛会"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m3:0 "拜占庭学者、希腊古籍与托斯卡纳学园共同将佛罗伦萨塑造成基督教世界的思想灯塔。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m4:0 "文艺复兴不朽摇篮"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m4:0 "统御托斯卡纳、执掌欧陆金融清算并庇护不朽艺术，佛罗伦萨的荣光跨越世纪长存。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m1:0 "瑞士雇佣兵联邦军纪"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m1:0 "自勃艮第至伦巴第威名远播的联邦长矛方阵兼具雷霆冲击力与钢铁凝聚力。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m2:0 "越山联邦山口霸权"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m2:0 "同时控扼阿尔卑斯南北要冲，确保了联邦商道畅通与无懈可击的战略纵深。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m3:0 "阿尔卑斯改教与学术圣殿"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m3:0 "州际宗教和约与兴盛出版业吸引全欧顶尖学者、印刷匠与钟表大师云集瑞士。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m4:0 "阿尔卑斯铁堡与永久中立"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m4:0 "不可攻破的高山堡垒、严整的市民武装与信誉昭著的金融金库令瑞士邦联永保不可侵犯之尊。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev1_a:0 "梳毛工行会和议"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev1_a:0 "承认手工业行会代表权提升了城中产能并平息了工坊骚动。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev1_b:0 "市政长老会大行会定序"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev1_b:0 "恢复七大行会主导地位，稳住了富商信贷与财政秩序。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev2_a:0 "梅第奇泛欧清算网络"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev2_a:0 "以佛罗伦萨为本位的汇票通行罗马至布鲁日，信贷成本冠绝欧洲。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev2_b:0 "梅第奇实业资本注资"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev2_b:0 "银号盈余源源流入高级丝织机坊与托斯卡纳工商作坊。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev3_a:0 "佛罗伦萨海事执政官舰队"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev3_a:0 "托斯卡纳官营商船直接将精纺呢绒运往地中海各港，摆脱外邦航运盘剥。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev3_b:0 "阿诺河—第勒尼安关津枢纽"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev3_b:0 "阿诺河航道运费锐减，使内陆工坊与远洋市场紧密衔接。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev4_a:0 "布鲁内莱斯基穹顶营造术"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev4_a:0 "精巧起重机械与几何砌筑技艺令佛罗伦萨成为全欧营造典范。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev4_b:0 "佛罗伦萨透视法工坊"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev4_b:0 "线性透视与数理测绘革新了绘画、雕塑乃至军工测绘诸业。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev5_a:0 "希腊古典人文复兴"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev5_a:0 "拜占庭学者与新译古典典籍在佛罗伦萨点燃全欧学术复兴之火。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev5_b:0 "佛罗伦萨大公会议声望"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev5_b:0 "在百花穹顶下汇聚东西方使团令佛罗伦萨外交威望蜚声四海。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev6_a:0 "洛伦佐文艺复兴黄金时代"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev6_a:0 "不朽画作、雕塑与新柏拉图学派著述使佛罗伦萨荣光播撒全欧。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev6_b:0 "梅第奇意大利均势外交"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev6_b:0 "老练的佛罗伦萨使节制衡各方诸侯同盟，维系阿诺河畔长久安宁。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev7_a:0 "护卫佛罗伦萨艺文火种"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev7_a:0 "从狂热烈焰中保全工坊与典藏，令文艺复兴之光薪火不绝。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev7_b:0 "大议会清廉共和整饬"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev7_b:0 "扩大市民大议会基础，遏制奢靡贪腐并凝聚城邦危机时期的民心。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev8_a:0 "佛罗伦萨黑旗军操典"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev8_a:0 "装备长矛与火绳枪的市民精兵与老兵以严明纪律守卫托斯卡纳疆土。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev8_b:0 "托斯卡纳星形棱堡防线"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev8_b:0 "由佛罗伦萨工程大师设计的低矮斜角砖石棱堡有效化解了攻城重炮之威。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev9_a:0 "森帕赫死战军魂"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev9_a:0 "无畏的瑞士步兵方阵以排山倒海之势正面撞碎贵族铁骑阵线。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev9_b:0 "《森帕赫军约》战阵法度"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev9_b:0 "严禁胜前劫掠并规定各州民兵坚守战列，铸就瑞士联军钢铁纪律。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev10_a:0 "圣哥达关津特许税制"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev10_a:0 "规范透明的过境关税与安全山地驿站为联邦金库带来滚滚财源。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev10_b:0 "圣哥达花岗岩险关"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev10_b:0 "驻防石桥与峻峭绝壁让任何妄图翻越山口的敌军陷入绝境。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev11_a:0 "联邦共管领地制度"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev11_a:0 "各州轮派总管征收稳固赋税，使老八州在共同治理中更加休戚与共。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev11_b:0 "高原城镇自治宪章"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev11_b:0 "尊重城镇传统特权使新近纳入版图的高原重镇成为联邦忠实盾牌。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev12_a:0 "格朗松与穆尔滕常胜军"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev12_a:0 "缴获的勃艮第火炮与所向披靡的长矛楔阵宣告瑞士成为欧洲第一步兵强权。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev12_b:0 "勃艮第战利品公库"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev12_b:0 "缴获的金银器皿与巨额赎金为各州兴建了崭新的市政厅、军械库与公仓。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev13_a:0 "各州雇佣兵承揽岁金"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev13_a:0 "列强军饷津贴源源注入州立公库，归国老兵更为联邦保留了宝贵实战底蕴。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev13_b:0 "本土精锐长矛常备军"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev13_b:0 "节制外派佣兵使大批久经沙场的山地长矛老兵长驻国内护卫疆土。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev14_a:0 "联邦各州教派共处和约"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev14_a:0 "承认各州自主裁定教务，令瑞士邦联在全欧宗教战争烽火中维系不裂。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev14_b:0 "阿尔卑斯印刷与学术圣地"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev14_b:0 "巴塞尔、苏黎世与日内瓦跃居全欧神学、医学与自然哲学出版重镇。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev15_a:0 "联邦议会《边防联防条例》"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev15_a:0 "跨州烽火警讯与山地驻军联动体系有效震慑了一切列强越境企图。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev15_b:0 "阿尔卑斯公正调停者"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev15_b:0 "敌对列强皆敬重瑞士中立地位，屡屡将和谈使团与条约托管于联邦名城。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev16_a:0 "瑞士精密钟表工艺"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev16_a:0 "巧夺天工的计时器与光学仪具自伦敦畅销至君士坦丁堡，附加值冠绝同侪。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev16_b:0 "阿尔卑斯信誉金库"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev16_b:0 "欧洲商贾与王公竞相将金银资产托付于中立瑞士的高墙与铁律信用之后。"
 oe_msn_flo_destiny:0 "#bold #color_yellow 佛罗伦萨共和国：文艺复兴摇篮#!#!"
 oe_msn_flo_destiny_DESCRIPTION:0 "从羊毛行会与梅第奇金融网络，走向托斯卡纳一统、百花穹顶营造与文艺复兴不朽摇篮"
 oe_msn_flo_destiny_CRITERIA_DESCRIPTION:0 "稳固市政长老会与弗罗林金币本位，构筑梅第奇泛欧银行帝国，以市民武装一统比萨与锡耶纳，并以人文学术与艺术巅峰加冕佛罗伦萨。"
 oe_msn_flo_destiny_BUTTON_TOOLTIP:0 "开启佛罗伦萨共和国天命任务树"
 oe_msn_flo_destiny_BUTTON_DETAILS:0 "专为佛罗伦萨与托斯卡纳打造的十二项三支柱天命任务树：铸就弗罗林金币与梅第奇泛欧清算网络；统合比萨、利沃诺、锡耶纳并建马基雅维利黑旗军；兴建百花穹顶、举办佛罗伦萨大公会议并振兴柏拉图学园。"
 oe_msn_swi_destiny:0 "#bold #color_yellow 瑞士老邦联：阿尔卑斯铁堡#!#!"
 oe_msn_swi_destiny_DESCRIPTION:0 "从森林诸州永久誓约与圣哥达税道，走向森帕赫战戟、雇佣兵铁纪与永久武装中立"
 oe_msn_swi_destiny_CRITERIA_DESCRIPTION:0 "联结森林诸州与伯尔尼、苏黎世，控扼圣哥达及阿尔卑斯险隘，砥砺瑞士雇佣长矛方阵，铸就不可侵犯的永久中立圣殿。"
 oe_msn_swi_destiny_BUTTON_TOOLTIP:0 "开启瑞士老邦联天命任务树"
 oe_msn_swi_destiny_BUTTON_DETAILS:0 "专为瑞士及1337年创始诸州打造的十二项三支柱天命任务树：于森帕赫挫败哈布斯堡铁骑并锻造瑞士长矛方阵；掌控圣哥达山口、瑞士高原、莱茵河湾与提契诺；健全联邦议会、宗教和约、精密制表与阿尔卑斯永久武装中立。"
 oe_msn_flo_01_signoria_wool_guilds:0 "市政长老会与羊毛行会"
 oe_msn_flo_01_signoria_wool_guilds_desc:0 "以羊毛行会与精纺商团的兴盛稳固佛罗伦萨市政长老会根基，使精良的托斯卡纳毛织品成为共和国财政命脉。"
 oe_msn_flo_01_signoria_wool_guilds_req_tt:0 "控制佛罗伦萨（直接或通过附庸）且稳定度至少为 5。"
 oe_msn_flo_02_gold_florin_standard:0 "金币弗罗林本位"
 oe_msn_flo_02_gold_florin_standard_desc:0 "严守弗罗林金币纯度，使自布鲁日至君士坦丁堡的商贾皆以佛罗伦萨金币作为通行结算本位。"
 oe_msn_flo_02_gold_florin_standard_req_tt:0 "控制佛罗伦萨（直接或通过附庸）且拥有至少 160 金币。"
 oe_msn_flo_03_medici_banking_network:0 "梅第奇泛欧金融网"
 oe_msn_flo_03_medici_banking_network_desc:0 "在罗马、威尼斯、里昂与布鲁日广设分支银号，以复式账簿与教廷信贷铸就佛罗伦萨纵横欧洲的金融权柄。"
 oe_msn_flo_03_medici_banking_network_req_tt:0 "控制佛罗伦萨并拥有至少 240 金币，且已颁布梅第奇银行特许状、接纳银行业思潮或达到 1420 年。"
 oe_msn_flo_04_european_clearinghouse:0 "基督教世界清结算中心"
 oe_msn_flo_04_european_clearinghouse_desc:0 "将佛罗伦萨汇票与主权承销银团打造成近代早期欧洲首屈一指的跨境清算枢纽。"
 oe_msn_flo_04_european_clearinghouse_req_tt:0 "在地理大发现时代或之后控制佛罗伦萨（直接或通过附庸），且稳定度至少为 12。"
 oe_msn_flo_05_port_of_pisa:0 "比萨良港与托斯卡纳海岸"
 oe_msn_flo_05_port_of_pisa_desc:0 "夺取阿诺河口的比萨与利沃诺，打破佛罗伦萨的内陆桎梏，开辟直航亚历山大港、佛兰德斯与黎凡特的托斯卡纳海路。"
 oe_msn_flo_05_port_of_pisa_req_tt:0 "控制比萨与利沃诺（直接或通过附庸）。"
 oe_msn_flo_06_siena_tuscan_unification:0 "锡耶纳归心与托斯卡纳一统"
 oe_msn_flo_06_siena_tuscan_unification_desc:0 "终结数百年来教皇党与皇帝党的城邦宿怨，将锡耶纳与阿雷佐或卢卡一并纳入托斯卡纳统一版图。"
 oe_msn_flo_06_siena_tuscan_unification_req_tt:0 "控制锡耶纳，并控制阿雷佐或卢卡之一（直接或通过附庸）。"
 oe_msn_flo_07_machiavellian_militia:0 "马基雅维利市民军与黑旗军"
 oe_msn_flo_07_machiavellian_militia_desc:0 "以常备托斯卡纳市民征兵制与铁纪黑旗军取代反复无常的雇佣队长，使利剑唯忠于红百合旗帜。"
 oe_msn_flo_07_machiavellian_militia_req_tt:0 "在地理大发现时代或之后控制佛罗伦萨、比萨与锡耶纳（直接或通过附庸），且稳定度至少为 12。"
 oe_msn_flo_08_tyrrhenian_porto_franco:0 "利沃诺自由港与第勒尼安航线"
 oe_msn_flo_08_tyrrhenian_porto_franco_desc:0 "颁布利沃诺自由港特许状，以圣斯德望骑士团舰队与皮翁比诺海防要塞护卫托斯卡纳海上商路。"
 oe_msn_flo_08_tyrrhenian_porto_franco_req_tt:0 "控制利沃诺与皮翁比诺，且直接或通过附庸拥有至少 16 处地点。"
 oe_msn_flo_09_brunelleschi_duomo:0 "布鲁内莱斯基穹顶与佛罗伦萨画派"
 oe_msn_flo_09_brunelleschi_duomo_desc:0 "以布鲁内莱斯基无拱架八角穹顶加冕圣母百花大教堂，让透视法与文艺复兴营造术在阿诺河畔工坊群芳竞艳。"
 oe_msn_flo_09_brunelleschi_duomo_req_tt:0 "在文艺复兴时代或之后控制佛罗伦萨（直接或通过附庸），且拥有至少 200 金币。"
 oe_msn_flo_10_council_greek_scholars:0 "佛罗伦萨大公会议与希腊学者"
 oe_msn_flo_10_council_greek_scholars_desc:0 "迎请拜占庭硕学鸿儒与希腊古籍典藏汇聚佛罗伦萨，点燃席卷全欧的柏拉图哲学与古典人文复兴火种。"
 oe_msn_flo_10_council_greek_scholars_req_tt:0 "在文艺复兴时代或之后控制佛罗伦萨（直接或通过附庸），且稳定度至少为 10。"
 oe_msn_flo_11_platonic_academy:0 "柏拉图学园与乌菲齐典藏"
 oe_msn_flo_11_platonic_academy_desc:0 "资助卡雷吉柏拉图学园、劳伦齐亚纳图书馆与乌菲齐画廊，令佛罗伦萨在艺术与科学领域独步天下。"
 oe_msn_flo_11_platonic_academy_req_tt:0 "在宗教改革时代或之后控制佛罗伦萨（直接或通过附庸），且稳定度至少为 15。"
 oe_msn_flo_12_cradle_of_renaissance:0 "托斯卡纳大公国与文艺复兴摇篮"
 oe_msn_flo_12_cradle_of_renaissance_desc:0 "疆土贯通佛罗伦萨、比萨与锡耶纳，金融通达欧陆，市民劲旅护邦，艺文冠绝古今——佛罗伦萨永铸文艺复兴不朽摇篮。"
 oe_msn_flo_12_cradle_of_renaissance_req_tt:0 "在专制主义时代或之后控制佛罗伦萨、比萨与锡耶纳（直接或通过附庸），且稳定度至少为 18。"
 oe_msn_swi_01_eternal_pact:0 "森林诸州永久同盟誓约"
 oe_msn_swi_01_eternal_pact_desc:0 "重申卢塞恩湖畔的《永久同盟宪章》誓约，将阿尔卑斯山谷自由公社紧密团结起来以抵御外部封建代官。"
 oe_msn_swi_01_eternal_pact_req_tt:0 "控制施维茨、阿尔特多夫、卢塞恩、伯尔尼或苏黎世之一（直接或通过附庸）且稳定度至少为 5。"
 oe_msn_swi_02_sempach_stand:0 "抗击哈布斯堡与森帕赫血战"
 oe_msn_swi_02_sempach_stand_desc:0 "如莫加滕与森帕赫战役般精训山地战戟步兵，迎面击溃重甲骑士冲锋，向天下昭示自由步兵足以挫败皇室霸权。"
 oe_msn_swi_02_sempach_stand_req_tt:0 "控制卢塞恩、施维茨或伯尔尼之一（直接或通过附庸）且稳定度至少为 8。"
 oe_msn_swi_03_reislaufer_contracts:0 "瑞士雇佣兵契约与铁血军纪"
 oe_msn_swi_03_reislaufer_contracts_desc:0 "规范各州雇佣兵承揽契约，令列强王室为瑞士长矛方阵支付重酬，同时以严苛军法维持联邦野战霸权。"
 oe_msn_swi_03_reislaufer_contracts_req_tt:0 "在文艺复兴时代或之后拥有至少 160 金币且稳定度至少为 10。"
 oe_msn_swi_04_alpine_redoubt_bastions:0 "阿尔卑斯堡垒群与险隘要塞"
 oe_msn_swi_04_alpine_redoubt_bastions_desc:0 "沿阿尔特多夫至伯尔尼的峻岭峡谷与桥头关隘广筑石堡防线，令任何外敌皆难越雷池一步。"
 oe_msn_swi_04_alpine_redoubt_bastions_req_tt:0 "在地理大发现时代或之后控制阿尔特多夫与伯尔尼（直接或通过附庸）。"
 oe_msn_swi_05_gotthard_pass_tolls:0 "圣哥达山口与阿尔卑斯税道"
 oe_msn_swi_05_gotthard_pass_tolls_desc:0 "掌控乌里与施维茨境内的魔鬼桥与圣哥达骡道，对往返伦巴第与莱茵河之间的每支商队征收稳固关津税款。"
 oe_msn_swi_05_gotthard_pass_tolls_req_tt:0 "控制阿尔特多夫与施维茨（直接或通过附庸）。"
 oe_msn_swi_06_bern_zurich_guilds:0 "伯尔尼高原与苏黎世行会"
 oe_msn_swi_06_bern_zurich_guilds_desc:0 "将伯尔尼广袤的阿勒河谷领地与苏黎世繁盛的丝麻行会融为一体，使森林农村诸州与工商都市相得益彰。"
 oe_msn_swi_06_bern_zurich_guilds_req_tt:0 "控制伯尔尼与苏黎世（直接或通过附庸）。"
 oe_msn_swi_07_aargau_vaud_rhine:0 "莱茵河湾与日内瓦湖门户"
 oe_msn_swi_07_aargau_vaud_rhine_desc:0 "自卢塞恩向外推进至莱茵河渡口巴塞尔或西境日内瓦、洛桑湖滨，为瑞士高原筑牢天然疆界。"
 oe_msn_swi_07_aargau_vaud_rhine_req_tt:0 "控制卢塞恩，并控制巴塞尔、日内瓦或洛桑之一（直接或通过附庸）。"
 oe_msn_swi_08_transalpine_confederacy:0 "越山门户：提契诺与格劳宾登"
 oe_msn_swi_08_transalpine_confederacy_desc:0 "在稳控联邦五大核心州城之余兼领贝林佐纳或库尔，彻底掌握中阿尔卑斯南北两麓咽喉。"
 oe_msn_swi_08_transalpine_confederacy_req_tt:0 "在地理大发现时代或之后控制伯尔尼、苏黎世、施维茨、阿尔特多夫与卢塞恩，并控制贝林佐纳或库尔之一。"
 oe_msn_swi_09_tagsatzung_diet:0 "联邦议会常务制度"
 oe_msn_swi_09_tagsatzung_diet_desc:0 "确立各州代表定期齐聚联邦议会共商共管领地、关税与对外邦交的制度传统。"
 oe_msn_swi_09_tagsatzung_diet_req_tt:0 "在文艺复兴时代或之后稳定度至少为 10 且拥有至少 160 金币。"
 oe_msn_swi_10_alpine_reformation:0 "阿尔卑斯宗教改革与教派和约"
 oe_msn_swi_10_alpine_reformation_desc:0 "以州际宗教和约化解苏黎世与日内瓦改教浪潮的撕裂危机，使瑞士成为全欧印刷巨匠与博学之士的避风港。"
 oe_msn_swi_10_alpine_reformation_req_tt:0 "在宗教改革时代或之后控制苏黎世或日内瓦（直接或通过附庸），且稳定度至少为 12。"
 oe_msn_swi_11_clockmakers_vaults:0 "阿尔卑斯精密制表与州立金库"
 oe_msn_swi_11_clockmakers_vaults_desc:0 "汇集胡格诺制表工坊与审慎商行信贷，打造精密钟表制造与固若磐石的州立金银储备库。"
 oe_msn_swi_11_clockmakers_vaults_req_tt:0 "在宗教改革时代或之后拥有至少 300 金币且稳定度至少为 15。"
 oe_msn_swi_12_fortress_alps_neutrality:0 "永久武装中立与阿尔卑斯铁堡"
 oe_msn_swi_12_fortress_alps_neutrality_desc:0 "背靠不可攻破的阿尔卑斯山垒、严整的联邦武装民兵与信誉昭著的金融金库，瑞士邦联永立为欧洲坚不可摧的中立圣殿。"
 oe_msn_swi_12_fortress_alps_neutrality_req_tt:0 "在专制主义时代或之后控制伯尔尼、苏黎世、施维茨、阿尔特多夫与卢塞恩（直接或通过附庸），且稳定度至少为 18。"
 oe_gem3.1.title:0 "梳毛工起义"
 oe_gem3.1.desc:0 "羊毛行会中长期无权的梳毛工与染匠攻入市政厅，要求设立小行会席位、减免债务并废除苛重的毛织税负。"
 oe_gem3.1.a:0 "准许梳毛工设立新行会并参政议政"
 oe_gem3.1.b:0 "力挺大商团行会并铁腕恢复秩序"
 oe_gem3.2.title:0 "梅第奇银行创立"
 oe_gem3.2.desc:0 "乔瓦尼·迪比奇·德·梅第奇将银号总部迁至佛罗伦萨，首创分支合伙制、复式记账法与教廷存款清算业务，令阿诺河畔成为欧洲金融心脏。"
 oe_gem3.2.a:0 "特许梅第奇银号拓展泛欧清算分行"
 oe_gem3.2.b:0 "引导梅第奇资本注入市政毛织与丝绸工坊"
 oe_gem3.3.title:0 "征服比萨与出海门户"
 oe_gem3.3.desc:0 "随着阿诺河口与比萨港向佛罗伦萨敞开大门，共和国终于得以组建自有官营桨帆商队，直航佛兰德斯、亚历山大港与黎凡特。"
 oe_gem3.3.a:0 "设立海事执政官并建造官营桨帆商队"
 oe_gem3.3.b:0 "将比萨关津码头建成托斯卡纳转口贸易枢纽"
 oe_gem3.4.title:0 "布鲁内莱斯基的百花大教堂穹顶"
 oe_gem3.4.desc:0 "建筑大师菲利波·布鲁内莱斯基提出无需木制拱架的双壳人字砌砖穹顶奇想，并创制自古典时代以来未有之精密起重机械。"
 oe_gem3.4.a:0 "倾力资助布鲁内莱斯基的穹顶工程奇迹"
 oe_gem3.4.b:0 "在各市政行会推广其透视绘测与工坊制度"
 oe_gem3.5.title:0 "1439年佛罗伦萨大公会议与希腊硕学"
 oe_gem3.5.desc:0 "东罗马皇帝、牧首与普莱通、贝萨里翁等希腊硕学莅临佛罗伦萨出席大公会议，携来满箱珍稀的柏拉图哲学与古典科学手抄本。"
 oe_gem3.5.a:0 "重金礼聘希腊学者并兴办译经书院"
 oe_gem3.5.b:0 "借大公会议之势拓展教廷与东方邦交"
 oe_gem3.6.title:0 "洛伦佐黄金时代与柏拉图学园"
 oe_gem3.6.desc:0 "在“华丽者”洛伦佐的慷慨庇护下，菲奇诺、皮科、波提切利与少年米开朗基罗荟萃卡雷吉别墅与圣马可花园，佛罗伦萨跃居欧洲文化巅峰。"
 oe_gem3.6.a:0 "慷慨资助柏拉图学园与雕塑园林"
 oe_gem3.6.b:0 "推行洛伦佐式意大利均势外交"
 oe_gem3.7.title:0 "萨沃纳罗拉虚荣篝火与市政长老会"
 oe_gem3.7.desc:0 "圣马可修道院修士萨沃纳罗拉痛斥奢靡享乐，号召激进市民在市政广场焚毁华服名画；市政长老会则在狂热民意与教廷绝罚威胁间进退维谷。"
 oe_gem3.7.a:0 "弹压狂热风潮以护佑人文艺术与城邦自由"
 oe_gem3.7.b:0 "顺势推进清廉共和与大议会宪政改革"
 oe_gem3.8.title:0 "马基雅维利市民军与黑旗军成军"
 oe_gem3.8.desc:0 "市政厅秘书尼科洛·马基雅维利力陈雇佣兵之弊，倡建常备托斯卡纳市民征兵军团，并与黑旗军精锐长矛火绳枪战法合流。"
 oe_gem3.8.a:0 "颁行市民军条例并精训黑旗长矛火枪军"
 oe_gem3.8.b:0 "在托斯卡纳畿辅广筑近代棱堡防御体系"
 oe_gem3.9.title:0 "森帕赫血战与温克尔里德壮举"
 oe_gem3.9.desc:0 "森帕赫城外哈布斯堡重甲骑士结成长矛铁壁之时，义士阿诺德·冯·温克尔里德舍身揽矛入怀，为联邦战戟勇士撕开决定胜负的血路。"
 oe_gem3.9.a:0 "以森帕赫死战精神铸就各州步兵军魂"
 oe_gem3.9.b:0 "颁布《森帕赫军约》严明联军军纪"
 oe_gem3.10.title:0 "圣哥达山口特许状与阿尔卑斯税道"
 oe_gem3.10.desc:0 "沿圣哥达山口修筑的石砌栈道、雪地驿站与除雪夫役，使中阿尔卑斯成为连接米兰、巴塞尔与斯特拉斯堡的最短商贸动脉。"
 oe_gem3.10.a:0 "特许各州骡运商帮并兴建山口关津税署"
 oe_gem3.10.b:0 "加固山口险桥与峡谷关隘防务"
 oe_gem3.11.title:0 "八州同盟西进阿尔高"
 oe_gem3.11.desc:0 "趁神圣罗马帝国政局动荡之际，老八州同盟大军挥师哈布斯堡故地阿尔高，创设由联邦议会共同管辖的共管领地。"
 oe_gem3.11.a:0 "设立由联邦议会共管的阿尔高共管领地"
 oe_gem3.11.b:0 "确认新附城镇自治宪章以广募忠勇民兵"
 oe_gem3.12.title:0 "勃艮第战争：格朗松与穆尔滕大捷"
 oe_gem3.12.desc:0 "大胆查理华丽绝伦的勃艮第大军与精锐野战炮队在格朗松与穆尔滕被冲锋的瑞士长矛楔阵碾作齑粉，震动全欧王廷。"
 oe_gem3.12.a:0 "缴获勃艮第重炮并精练长矛战戟突击方阵"
 oe_gem3.12.b:0 "将格朗松巨额战利品均分各州充实公库"
 oe_gem3.13.title:0 "瑞士雇佣长矛方阵威震欧陆"
 oe_gem3.13.desc:0 "施瓦本战争大破帝国佣兵之后，自巴黎至罗马的欧洲君主竞相奉上重金津贴，只求延揽瑞士雇佣长矛军团与教廷近卫。"
 oe_gem3.13.a:0 "由各州官府统一签发雇佣兵承揽特许"
 oe_gem3.13.b:0 "留驻精锐长矛老兵专司阿尔卑斯本土防务"
 oe_gem3.14.title:0 "苏黎世与日内瓦宗教改革"
 oe_gem3.14.desc:0 "苏黎世的慈运理与日内瓦的加尔文先后掀起波澜壮阔的归正宗改革，而森林诸州仍坚定捍卫古老的天主教礼仪，联邦面临教派分歧大考。"
 oe_gem3.14.a:0 "斡旋《卡佩尔宗教和约》确立各州信仰自决"
 oe_gem3.14.b:0 "广纳全欧流亡印刷匠、学者与手艺名家"
 oe_gem3.15.title:0 "联邦议会的永久武装中立国策"
 oe_gem3.15.desc:0 "面对德意志、法兰西与意大利列强阵营剑拔弩张的格局，联邦议会决议以武装中立护持主权：未经联邦准许，任何外军休想借道阿尔卑斯山口。"
 oe_gem3.15.a:0 "颁行《联邦边防联防条例》统合各州守备"
 oe_gem3.15.b:0 "以中立之身充任欧陆列强调停人与安全通途"
 oe_gem3.16.title:0 "阿尔卑斯精密制表与州立金库"
 oe_gem3.16.desc:0 "日内瓦与汝拉山谷的制表名匠将精微黄铜擒纵技艺与巴塞尔、苏黎世审慎稳健的商行信贷相结合，铸就誉满欧洲的精密制造与安全金融传奇。"
 oe_gem3.16.a:0 "特许日内瓦—汝拉精密钟表工匠行会"
 oe_gem3.16.b:0 "兴建固若金汤的阿尔卑斯州立金库与清算银号"
