 oe_gem3.8.b:0 "在托斯卡纳畿辅广筑近代棱堡防御体系"
 oe_gem3.9.title:0 "森帕赫血战与温克尔里德壮举"
 oe_gem3.9.desc:0 "森帕赫城外哈布斯堡重甲骑士结成长矛铁壁之时，义士阿诺德·冯·温克尔里德舍身揽矛入怀，为联邦战戟勇士撕开决定胜负的血路。"
 oe_gem3.9.a:0 "以森帕赫死战精神铸就各州步兵军魂"
 oe_gem3.9.b:0 "颁布《森帕赫军约》严明联军军纪"
 oe_gem3.10.title:0 "圣哥达山口特许状与阿尔卑斯税道"
 oe_gem3.10.desc:0 "沿圣哥达山口修筑的石砌栈道、雪地驿站与除雪夫役，使中阿尔卑斯成为连接米兰、巴塞尔与斯特拉斯堡的最短商贸动脉。"
 oe_gem3.10.a:0 "特许各州骡运商帮并兴建山口关津税署"
 oe_gem3.10.b:0 "加固山口险桥与峡谷关隘防务"
 oe_gem3.11.title:0 "八州同盟西进阿尔高"
 oe_gem3.11.desc:0 "趁神圣罗马帝国政局动荡之际，老八州同盟大军挥师哈布斯堡故地阿尔高，创设由联邦议会共同管辖的共管领地。"
 oe_gem3.11.a:0 "设立由联邦议会共管的阿尔高共管领地"
 oe_gem3.11.b:0 "确认新附城镇自治宪章以广募忠勇民兵"
 oe_gem3.12.title:0 "勃艮第战争：格朗松与穆尔滕大捷"
 oe_gem3.12.desc:0 "大胆查理华丽绝伦的勃艮第大军与精锐野战炮队在格朗松与穆尔滕被冲锋的瑞士长矛楔阵碾作齑粉，震动全欧王廷。"
 oe_gem3.12.a:0 "缴获勃艮第重炮并精练长矛战戟突击方阵"
 oe_gem3.12.b:0 "将格朗松巨额战利品均分各州充实公库"
 oe_gem3.13.title:0 "瑞士雇佣长矛方阵威震欧陆"
 oe_gem3.13.desc:0 "施瓦本战争大破帝国佣兵之后，自巴黎至罗马的欧洲君主竞相奉上重金津贴，只求延揽瑞士雇佣长矛军团与教廷近卫。"
 oe_gem3.13.a:0 "由各州官府统一签发雇佣兵承揽特许"
 oe_gem3.13.b:0 "留驻精锐长矛老兵专司阿尔卑斯本土防务"
 oe_gem3.14.title:0 "苏黎世与日内瓦宗教改革"
 oe_gem3.14.desc:0 "苏黎世的慈运理与日内瓦的加尔文先后掀起波澜壮阔的归正宗改革，而森林诸州仍坚定捍卫古老的天主教礼仪，联邦面临教派分歧大考。"
 oe_gem3.14.a:0 "斡旋《卡佩尔宗教和约》确立各州信仰自决"
 oe_gem3.14.b:0 "广纳全欧流亡印刷匠、学者与手艺名家"
 oe_gem3.15.title:0 "联邦议会的永久武装中立国策"
 oe_gem3.15.desc:0 "面对德意志、法兰西与意大利列强阵营剑拔弩张的格局，联邦议会决议以武装中立护持主权：未经联邦准许，任何外军休想借道阿尔卑斯山口。"
 oe_gem3.15.a:0 "颁行《联邦边防联防条例》统合各州守备"
 oe_gem3.15.b:0 "以中立之身充任欧陆列强调停人与安全通途"
 oe_gem3.16.title:0 "阿尔卑斯精密制表与州立金库"
 oe_gem3.16.desc:0 "日内瓦与汝拉山谷的制表名匠将精微黄铜擒纵技艺与巴塞尔、苏黎世审慎稳健的商行信贷相结合，铸就誉满欧洲的精密制造与安全金融传奇。"
 oe_gem3.16.a:0 "特许日内瓦—汝拉精密钟表工匠行会"
 oe_gem3.16.b:0 "兴建固若金汤的阿尔卑斯州立金库与清算银号"
