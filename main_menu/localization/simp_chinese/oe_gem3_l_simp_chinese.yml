 oe_gem3_flo_black_bands:0 "佛罗伦萨黑旗军"
 oe_gem3_flo_black_bands_desc:0 "效法乔瓦尼“黑旗军”成制的托斯卡纳精锐长矛火绳枪重步兵，兼具市民军纪、精钢胸甲与山地渡河野战协同之威。"
 oe_gem3_swi_reislaufer_pikemen:0 "瑞士雇佣长矛方阵"
 oe_gem3_swi_reislaufer_pikemen_desc:0 "源自瑞士各州世袭民兵的阿尔卑斯重装长矛与战戟方阵，擅长正面粉碎封建重骑冲锋，并以铜墙铁壁守御险峻山口。"
 oe_gem3_dec_medici_bank_charter.title:0 "颁布梅第奇银行特许状"
 oe_gem3_dec_medici_bank_charter.desc:0 "特许佛罗伦萨复式记账银号组建泛欧汇兑与教廷清结算网络；在银行业思潮传抵佛罗伦萨或公元 #Y 1397#! 年后即可颁行。"
 oe_gem3_dec_medici_bank_charter.a:0 "在市政长老会钤印颁布梅第奇银行特许状"
 oe_gem3_dec_tagsatzung_neutrality.title:0 "颁布联邦议会武装中立盟约"
 oe_gem3_dec_tagsatzung_neutrality.desc:0 "汲取阿尔卑斯争霸的血泪教训，由联邦议会确立永久武装中立国策：不卷入列强王位混战，而将每座山口要隘铸成不可逾越的堡垒（公元 #Y 1515#! 年后可颁行）。"
 oe_gem3_dec_tagsatzung_neutrality.a:0 "批准永久武装中立盟约"
 STATIC_MODIFIER_NAME_oe_gem3_mod_medici_bank_charter:0 "梅第奇银行特许状"
 STATIC_MODIFIER_DESC_oe_gem3_mod_medici_bank_charter:0 "复式账簿、教廷清算特权与泛欧分支网络将佛罗伦萨推上欧洲金融之巅。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_tagsatzung_neutrality:0 "联邦议会武装中立盟约"
 STATIC_MODIFIER_DESC_oe_gem3_mod_tagsatzung_neutrality:0 "永久武装中立以固若金汤的阿尔卑斯山垒震慑外敌，同时赢得全欧诸国的外交敬重。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m1:0 "梅第奇泛欧金融网络"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m1:0 "设于罗马、威尼斯、里昂与布鲁日的佛罗伦萨银号分行将信用与金银源源汇回阿诺河畔。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m2:0 "马基雅维利市民军与黑旗战阵"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m2:0 "忠于共和国的托斯卡纳市民征兵制与黑旗长矛火枪精锐彻底取代了不可靠的雇佣队长。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m3:0 "佛罗伦萨人文硕学盛会"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m3:0 "拜占庭学者、希腊古籍与托斯卡纳学园共同将佛罗伦萨塑造成基督教世界的思想灯塔。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_flo_m4:0 "文艺复兴不朽摇篮"
 STATIC_MODIFIER_DESC_oe_gem3_msn_flo_m4:0 "统御托斯卡纳、执掌欧陆金融清算并庇护不朽艺术，佛罗伦萨的荣光跨越世纪长存。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m1:0 "瑞士雇佣兵联邦军纪"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m1:0 "自勃艮第至伦巴第威名远播的联邦长矛方阵兼具雷霆冲击力与钢铁凝聚力。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m2:0 "越山联邦山口霸权"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m2:0 "同时控扼阿尔卑斯南北要冲，确保了联邦商道畅通与无懈可击的战略纵深。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m3:0 "阿尔卑斯改教与学术圣殿"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m3:0 "州际宗教和约与兴盛出版业吸引全欧顶尖学者、印刷匠与钟表大师云集瑞士。"
 STATIC_MODIFIER_NAME_oe_gem3_msn_swi_m4:0 "阿尔卑斯铁堡与永久中立"
 STATIC_MODIFIER_DESC_oe_gem3_msn_swi_m4:0 "不可攻破的高山堡垒、严整的市民武装与信誉昭著的金融金库令瑞士邦联永保不可侵犯之尊。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev1_a:0 "梳毛工行会和议"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev1_a:0 "承认手工业行会代表权提升了城中产能并平息了工坊骚动。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev1_b:0 "市政长老会大行会定序"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev1_b:0 "恢复七大行会主导地位，稳住了富商信贷与财政秩序。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev2_a:0 "梅第奇泛欧清算网络"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev2_a:0 "以佛罗伦萨为本位的汇票通行罗马至布鲁日，信贷成本冠绝欧洲。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev2_b:0 "梅第奇实业资本注资"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev2_b:0 "银号盈余源源流入高级丝织机坊与托斯卡纳工商作坊。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev3_a:0 "佛罗伦萨海事执政官舰队"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev3_a:0 "托斯卡纳官营商船直接将精纺呢绒运往地中海各港，摆脱外邦航运盘剥。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev3_b:0 "阿诺河—第勒尼安关津枢纽"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev3_b:0 "阿诺河航道运费锐减，使内陆工坊与远洋市场紧密衔接。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev4_a:0 "布鲁内莱斯基穹顶营造术"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev4_a:0 "精巧起重机械与几何砌筑技艺令佛罗伦萨成为全欧营造典范。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev4_b:0 "佛罗伦萨透视法工坊"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev4_b:0 "线性透视与数理测绘革新了绘画、雕塑乃至军工测绘诸业。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev5_a:0 "希腊古典人文复兴"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev5_a:0 "拜占庭学者与新译古典典籍在佛罗伦萨点燃全欧学术复兴之火。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev5_b:0 "佛罗伦萨大公会议声望"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev5_b:0 "在百花穹顶下汇聚东西方使团令佛罗伦萨外交威望蜚声四海。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev6_a:0 "洛伦佐文艺复兴黄金时代"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev6_a:0 "不朽画作、雕塑与新柏拉图学派著述使佛罗伦萨荣光播撒全欧。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev6_b:0 "梅第奇意大利均势外交"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev6_b:0 "老练的佛罗伦萨使节制衡各方诸侯同盟，维系阿诺河畔长久安宁。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev7_a:0 "护卫佛罗伦萨艺文火种"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev7_a:0 "从狂热烈焰中保全工坊与典藏，令文艺复兴之光薪火不绝。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev7_b:0 "大议会清廉共和整饬"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev7_b:0 "扩大市民大议会基础，遏制奢靡贪腐并凝聚城邦危机时期的民心。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev8_a:0 "佛罗伦萨黑旗军操典"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev8_a:0 "装备长矛与火绳枪的市民精兵与老兵以严明纪律守卫托斯卡纳疆土。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev8_b:0 "托斯卡纳星形棱堡防线"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev8_b:0 "由佛罗伦萨工程大师设计的低矮斜角砖石棱堡有效化解了攻城重炮之威。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev9_a:0 "森帕赫死战军魂"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev9_a:0 "无畏的瑞士步兵方阵以排山倒海之势正面撞碎贵族铁骑阵线。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev9_b:0 "《森帕赫军约》战阵法度"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev9_b:0 "严禁胜前劫掠并规定各州民兵坚守战列，铸就瑞士联军钢铁纪律。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev10_a:0 "圣哥达关津特许税制"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev10_a:0 "规范透明的过境关税与安全山地驿站为联邦金库带来滚滚财源。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev10_b:0 "圣哥达花岗岩险关"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev10_b:0 "驻防石桥与峻峭绝壁让任何妄图翻越山口的敌军陷入绝境。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev11_a:0 "联邦共管领地制度"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev11_a:0 "各州轮派总管征收稳固赋税，使老八州在共同治理中更加休戚与共。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev11_b:0 "高原城镇自治宪章"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev11_b:0 "尊重城镇传统特权使新近纳入版图的高原重镇成为联邦忠实盾牌。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev12_a:0 "格朗松与穆尔滕常胜军"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev12_a:0 "缴获的勃艮第火炮与所向披靡的长矛楔阵宣告瑞士成为欧洲第一步兵强权。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev12_b:0 "勃艮第战利品公库"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev12_b:0 "缴获的金银器皿与巨额赎金为各州兴建了崭新的市政厅、军械库与公仓。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev13_a:0 "各州雇佣兵承揽岁金"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev13_a:0 "列强军饷津贴源源注入州立公库，归国老兵更为联邦保留了宝贵实战底蕴。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev13_b:0 "本土精锐长矛常备军"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev13_b:0 "节制外派佣兵使大批久经沙场的山地长矛老兵长驻国内护卫疆土。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev14_a:0 "联邦各州教派共处和约"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev14_a:0 "承认各州自主裁定教务，令瑞士邦联在全欧宗教战争烽火中维系不裂。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev14_b:0 "阿尔卑斯印刷与学术圣地"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev14_b:0 "巴塞尔、苏黎世与日内瓦跃居全欧神学、医学与自然哲学出版重镇。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev15_a:0 "联邦议会《边防联防条例》"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev15_a:0 "跨州烽火警讯与山地驻军联动体系有效震慑了一切列强越境企图。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev15_b:0 "阿尔卑斯公正调停者"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev15_b:0 "敌对列强皆敬重瑞士中立地位，屡屡将和谈使团与条约托管于联邦名城。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev16_a:0 "瑞士精密钟表工艺"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev16_a:0 "巧夺天工的计时器与光学仪具自伦敦畅销至君士坦丁堡，附加值冠绝同侪。"
 STATIC_MODIFIER_NAME_oe_gem3_mod_ev16_b:0 "阿尔卑斯信誉金库"
 STATIC_MODIFIER_DESC_oe_gem3_mod_ev16_b:0 "欧洲商贾与王公竞相将金银资产托付于中立瑞士的高墙与铁律信用之后。"
 oe_msn_flo_destiny:0 "#bold #color_yellow 佛罗伦萨共和国：文艺复兴摇篮#!#!"
 oe_msn_flo_destiny_DESCRIPTION:0 "从羊毛行会与梅第奇金融网络，走向托斯卡纳一统、百花穹顶营造与文艺复兴不朽摇篮"
 oe_msn_flo_destiny_CRITERIA_DESCRIPTION:0 "稳固市政长老会与弗罗林金币本位，构筑梅第奇泛欧银行帝国，以市民武装一统比萨与锡耶纳，并以人文学术与艺术巅峰加冕佛罗伦萨。"
 oe_msn_flo_destiny_BUTTON_TOOLTIP:0 "开启佛罗伦萨共和国天命任务树"
 oe_msn_flo_destiny_BUTTON_DETAILS:0 "专为佛罗伦萨与托斯卡纳打造的十二项三支柱天命任务树：铸就弗罗林金币与梅第奇泛欧清算网络；统合比萨、利沃诺、锡耶纳并建马基雅维利黑旗军；兴建百花穹顶、举办佛罗伦萨大公会议并振兴柏拉图学园。"
 oe_msn_swi_destiny:0 "#bold #color_yellow 瑞士老邦联：阿尔卑斯铁堡#!#!"
 oe_msn_swi_destiny_DESCRIPTION:0 "从森林诸州永久誓约与圣哥达税道，走向森帕赫战戟、雇佣兵铁纪与永久武装中立"
 oe_msn_swi_destiny_CRITERIA_DESCRIPTION:0 "联结森林诸州与伯尔尼、苏黎世，控扼圣哥达及阿尔卑斯险隘，砥砺瑞士雇佣长矛方阵，铸就不可侵犯的永久中立圣殿。"
 oe_msn_swi_destiny_BUTTON_TOOLTIP:0 "开启瑞士老邦联天命任务树"
 oe_msn_swi_destiny_BUTTON_DETAILS:0 "专为瑞士及1337年创始诸州打造的十二项三支柱天命任务树：于森帕赫挫败哈布斯堡铁骑并锻造瑞士长矛方阵；掌控圣哥达山口、瑞士高原、莱茵河湾与提契诺；健全联邦议会、宗教和约、精密制表与阿尔卑斯永久武装中立。"
 oe_msn_flo_01_signoria_wool_guilds:0 "市政长老会与羊毛行会"
 oe_msn_flo_01_signoria_wool_guilds_desc:0 "旧宫议事厅内，出身羊毛与呢绒精整行会的长老将英格兰上等原毛染织为全欧趋之若鹜的绯红细呢。扶持城邦行会[buildings|e]既巩固市政共和[stability|e]，更为[capital|e]带来持续增长的城市[development|e]。"
 oe_msn_flo_01_signoria_wool_guilds_req_tt:0 "控制佛罗伦萨（可经由附庸），稳定度不低于 5，拥有纺织行会或精纺行会，且市民阶层满意度不低于 50%。"
 oe_msn_flo_02_gold_florin_standard:0 "金币弗罗林本位"
 oe_msn_flo_02_gold_florin_standard_desc:0 "以二十四开纯金铸造、镌刻百合花与圣若望像的弗罗林金币，成为全欧君王与教宗信赖的硬通货。严控货币[inflation|e]不仅拓宽跨邦[trade|e]，更为城邦聚敛丰厚[gold|e]并赢得四海[prestige|e]。"
 oe_msn_flo_02_gold_florin_standard_req_tt:0 "控制佛罗伦萨（可经由附庸），金币不低于 160，拥有市场或行会大厅，且商税月收入不低于 20。"
 oe_msn_flo_03_medici_banking_network:0 "梅第奇泛欧金融网"
 oe_msn_flo_03_medici_banking_network_desc:0 "依托复式簿记与遍布罗马、布鲁日、里昂及伦敦的分号网络，佛罗伦萨钱庄为教廷与王室调度巨款。接纳先进金融[institutions|e]既将信用化为[diplomacy|e]筹码，亦拓展[market|e]并赢得[estate_satisfaction|e]。"
 oe_msn_flo_03_medici_banking_network_req_tt:0 "文艺复兴时代起，控制佛罗伦萨，金币不低于 240，拥有账房，且具备梅第奇银行特许、银行业思潮或年份不早于 1420。"
 oe_msn_flo_04_european_clearinghouse:0 "基督教世界清结算中心"
 oe_msn_flo_04_european_clearinghouse_desc:0 "老桥柜台签发的汇票如今无需搬运一箱金银，便能清算从安特卫普至那不勒斯的各国公债。执掌全欧[trade|e]清结算既涵养托斯卡纳[prosperity|e]，亦稳控[inflation|e]并大幅抬升[diplomatic_reputation|e]。"
 oe_msn_flo_04_european_clearinghouse_req_tt:0 "大航海时代起，控制佛罗伦萨，稳定度不低于 12，拥有贸易枢纽或商人区，商税月收入不低于 55，且首都发展度不低于 24。"
 oe_msn_flo_05_port_of_pisa:0 "比萨良港与托斯卡纳海岸"
