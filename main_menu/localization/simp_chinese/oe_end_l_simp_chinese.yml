 # NEW 2026-11-22 v11.0 Worker 3 Slot 86: 1750-1836 Eurasian Endgame Great War (oe_end_). Generated by gen_endgame_great_war.py; edit the generator, not this file.
 OE_END_CB_BALANCE_REASON: "敌方属于帝国霸权轴心"
 OE_END_CB_GREAT_WAR_REASON: "敌方属于欧亚均势大同盟"
 STATIC_MODIFIER_DESC_oe_end_armed_neutrality_mod: "在两大阵营殊死厮杀之际高举武装中立旗帜，借军火与粮船转运大获商利，但遭交战列强蔑视并折损威望。"
 STATIC_MODIFIER_DESC_oe_end_atlantic_crusade_mod: "新旧大陆的战列舰横越大西洋展开制海权与登陆决战，显著增强重舰火力、水师士气与远洋水手征募。"
 STATIC_MODIFIER_DESC_oe_end_central_miracle_mod: "凭藉卓越的内线机动与铁血军纪在强敌环伺的中欧平原屹立不倒，极大振奋全军战力，却令国家承受沉重战争损耗。"
 STATIC_MODIFIER_DESC_oe_end_coalition_aligned_mod: "加入欧亚均势大同盟，列强抛弃旧怨共抗单极霸权，鼓舞士气与外交协作，但须维持沉重的战时军备。"
 STATIC_MODIFIER_DESC_oe_end_concert_guarantor_mod: "作为击退单极霸权的均势大同盟主导国，在维也纳式世界和平会议上确立多极协调秩序，惠及外交、商贸与国内长治久安。"
 STATIC_MODIFIER_DESC_oe_end_congress_charter_mod: "战后列强依维也纳式和平大会原则互相担保疆界并建立常设使节协调机制，消弭战疲并开启长时段和平重建。"
 STATIC_MODIFIER_DESC_oe_end_continental_blockade_mod: "以主力舰队与岸防关税卡死敌方商港与补给线，强化封锁与主力舰战力，却不可避免地伤及本国海运商贸。"
 STATIC_MODIFIER_DESC_oe_end_diplomatic_revolution_mod: "打破延续数百年的世仇格局，促成跨文明与跨教派的战略大改组，大幅拓展外交容量与关系修好效率。"
 STATIC_MODIFIER_DESC_oe_end_exhausted_compromise_mod: "历经旷日持久的跨洲大战后，筋疲力尽的列强在世界和平大会上锁定疆界并转入休养生息，快速消减厌战并恢复地方繁荣。"
 STATIC_MODIFIER_DESC_oe_end_hegemon_aligned_mod: "加入欧亚终局大战的帝国霸权阵营，依托霸主体系提升军纪与战果效率，却须共同承受列强猜忌与对抗压力。"
 STATIC_MODIFIER_DESC_oe_end_ideological_fervor_mod: "革命理念与正统王权的终极碰撞点燃了举国狂热，带来庞大志愿兵源与高昂士气，同时剧烈冲击国内稳定成本。"
 STATIC_MODIFIER_DESC_oe_end_levee_en_masse_mod: "举国上下一切人力物力皆奉于前线决战，换取空前的兵源与高昂士气，但急剧加重军费开支与厌战消耗。"
 STATIC_MODIFIER_DESC_oe_end_med_campaign_mod: "围绕君士坦丁堡、威尼斯、亚历山大与那不勒斯展开两栖夺港决战，提升水师士气与围城效率但抬升海军维持费。"
 STATIC_MODIFIER_DESC_oe_end_new_world_primacy_mod: "趁旧世界列强在欧亚大陆流血不止之际，稳固大西洋西岸的贸易霸权、商队容量与跨洋声威。"
 STATIC_MODIFIER_DESC_oe_end_orient_expedition_mod: "调集远洋护航舰队与跨洲商路补给支援欧亚东翼战区，拓宽水手储备与海贸效率，但加重远洋舰队维保开销。"
 STATIC_MODIFIER_DESC_oe_end_revolutionary_order_mod: "革命阵营在终局大战中横扫旧制度，法典、宪政与新思潮席卷欧亚大陆，极大加速科研与思潮进步，却持续冲击传统法统。"
 STATIC_MODIFIER_DESC_oe_end_unipolar_imperium_mod: "在 1750–1836 欧亚终局大战中压倒所有制衡列强，确立无可争议的全球霸主地位，威望与战果效率永载史册，但宿敌怨恨长存。"
 STATIC_MODIFIER_DESC_oe_end_war_bonds_mod: "依托近代主权清算体系向国内外债商发行长期战时国债，拓宽借贷上限并压低利息，但增大战后财政整顿压力。"
 STATIC_MODIFIER_DESC_oe_end_war_subsidy_mod: "源自「皮特黄金」式的跨洲军费金援源源不断注入前线，显著提振盟军士气、兵源补充与联合作战凝聚力。"
 STATIC_MODIFIER_NAME_oe_end_armed_neutrality_mod: "武装中立同盟护航利润"
 STATIC_MODIFIER_NAME_oe_end_atlantic_crusade_mod: "跨大西洋远征舰队"
