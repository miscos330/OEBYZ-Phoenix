 oe_end.1.a: "吹响总体战号角，以雷霆之势抢占先机"
 oe_end.1.b: "稳健调遣后备军团并巩固外交后方"
 oe_end.1.d: "积蓄逾半世纪的霸权极化与列强猜忌终于在一夜之间彻底引爆。从博斯普鲁斯到莱茵河，从莫斯科草原到南海与切萨皮克湾，各大强权纷纷在「帝国霸权轴心」与「欧亚均势大同盟」之间亮明旗帜。作为阵营核心，我廷必须决定这场世纪大战的动员基调。"
 oe_end.1.t: "欧亚终局大战爆发"
 oe_end.10.a: "慷慨拨付「皮特黄金」式军费金援撑住盟军战线"
 oe_end.10.b: "增发紧急战时主权国债优先充实本国军库"
 oe_end.10.d: "数年连绵不绝的跨洲大战几乎掏空了列强国库。前线盟邦雪片般递来紧急军费求援信，而首都金融银行家则提出以高额长期主权国债度过难关。"
 oe_end.10.t: "国库告急与跨洲军费金援博弈"
 oe_end.11.a: "增派武装护航舰队捍卫公海自由与中立商权"
 oe_end.11.b: "毅然放弃中立，加入欧亚均势大同盟讨伐霸主"
 oe_end.11.d: "交战霸主的巡洋舰以查缉战时禁运品为名，在公海强行扣押了数艘悬挂武装中立旗帜的商船并拖入捕获法庭拍卖。国内海商与议会群情激愤，怒斥霸权践踏海洋公法！"
 oe_end.11.t: "中立商船遭截：武装中立同盟危机"
 oe_end.12.a: "斥资安抚同阵营盟友，誓将决战进行到底"
 oe_end.12.b: "顺应厌战民意，开启秘密渠道筹备世界和平大会"
 oe_end.12.d: "连年征发令各主要交战国债台高筑、壮丁锐减，密探截获了部分疲惫盟友在中立国首都试探单独媾和的密电。究竟是以重金外交维系阵营不散，还是顺水推舟筹备世界和平大会？"
 oe_end.12.t: "前线厌战与盟友秘密媾和风波"
 oe_end.13.a: "勒石纪功，见证帝国霸权时代降临"
 oe_end.13.d: "横跨五大跨洲战区的欧亚终局大战尘埃落定！帝国霸权轴心击碎了一切围堵与反霸联军，敌国全权代表被迫在城下之盟上画押。自此以降，欧亚大陆与大洋航道皆仰望唯一帝国之威权，史家将此役铭记为近世单极霸权的巅峰。"
 oe_end.13.t: "终局落幕：单极帝国霸权确立"
 oe_end.14.a: "签押《欧亚协调会最后总议定书》，共迎和平新纪元"
 oe_end.14.d: "华灯初上，欧亚与大西洋列强的全权大使齐聚和平大会大厅，正式签署《欧亚均势与协调会最后总议定书》！单极霸权野心已被欧亚均势大同盟成功遏制，各国约定以常设大使会议与疆界担保维系长久和平，开启崭新的多极协调纪元。"
 oe_end.14.t: "终局落幕·欧亚协调会闭幕"
 oe_end.15.a: "宣告旧制度终结，迎接启蒙与革命新纪元"
 oe_end.15.d: "三色战旗插遍欧亚重镇，旧王朝的封建特权与世袭壁垒在终局大战的烈火中灰飞烟灭！新法典、公民宪章与启蒙理性随胜利者的大军传遍四方，世界彻底告别旧制度，迈入风起云涌的近代新纪元。"
 oe_end.15.t: "终局落幕：启蒙与大革命新纪元"
 oe_end.16.a: "签署世纪妥协和约，转入战后休养生息"
 oe_end.16.d: "历时多年的跨洲总体战耗尽了两大阵营的最后一份国力与兵源。在世界和平大会的谈判桌前，没有哪一方能够彻底吞并对手；列强最终务实签署《世纪妥协停战总约》，锁定各自既得疆界，让饱受战火蹂躏的欧亚生灵得以休养生息。"
 oe_end.16.t: "终局落幕·世纪妥协和约"
 oe_end.2.a: "签押划时代外交革命协定，共赴前线"
 oe_end.2.b: "保留外交行动自由，静观列强折冲"
 oe_end.2.d: "正如 1756 年《凡尔赛条约》一夜逆转哈布斯堡与波旁二百年世仇，当超级霸权阴影笼罩欧亚大陆之际，昔日在战场兵戎相见的宿敌悄然交换了秘密全权国书。旧有地缘阵线土崩瓦解，全新的跨洲大联盟正在宫廷密室中成形。"
 oe_end.2.t: "外交革命：两百年世仇一朝握手"
 oe_end.3.a: "加入「帝国霸权轴心」（阵营 A）"
 oe_end.3.b: "加入「欧亚均势大同盟」（阵营 B）"
 oe_end.3.c: "宣示「武装中立同盟」，借战时商贸套利"
 oe_end.3.d: "两大跨洲阵营的特使同时递上国书与最后通牒。一方许诺在新霸权秩序中分封厚利，另一方高呼均势生存之道，而国内商帮则力主高举武装中立大旗渔翁得利。此刻的抉择将铭刻在本国五百年史册之中。"
 oe_end.3.t: "欧亚终局大战：列强抉择时刻"
 oe_end.4.a: "倾注军费增援地中海主力舰队与两栖军团"
 oe_end.4.b: "固守咽喉要塞与商船护航线以蓄积水师传统"
 oe_end.4.d: "地中海与巴尔干战区骤然成为双方争夺欧亚枢纽的咽喉战场。围绕君士坦丁堡、威尼斯、亚历山大与那不勒斯四大海港，战列舰队与两栖远征军正展开殊死拉锯。"
 oe_end.4.t: "地中海与博斯普鲁斯海峡决战"
 oe_end.5.a: "乘胜发动决定性中欧总攻，力挽战局"
 oe_end.5.b: "依托要塞防线休整兵源以备持久鏖战"
 oe_end.5.d: "在巴黎、维也纳、柏林与伦敦交织的中欧—西欧核心战区，多路大军呈钳形合围之势。前线统帅凭借果决的内线机动与严苛军纪在绝境中撕开缺口，全欧震动，胜负天平随之剧烈摆动。"
 oe_end.5.t: "中欧大陆会战与「内线突围奇迹」"
 oe_end.6.a: "派遣远洋护航舰队与跨洲兵马介入东翼战区"
 oe_end.6.b: "稳固东方白银与丝绸贸易线以充实军库"
 oe_end.6.d: "终局大战的烽火越过乌拉尔与印度洋，直抵大都、江户丰岛与马尼拉大港。白银大帆船航道与欧亚陆上丝路同时卷入封锁与护航争夺，东方大国的军力投送正改写欧亚总账。"
 oe_end.6.t: "东亚海域与丝路双凤跨洲介入"
 oe_end.7.a: "派出跨洋远征舰队横渡大西洋，左右终局天平"
 oe_end.7.b: "借旧大陆大战之机坐收新世界海洋商贸独霸"
 oe_end.7.d: "大西洋两岸炮声隆隆！围绕切萨皮克湾、哈瓦那与里斯本构成的跨洋三角，旧世界帝国与极乐洲新罗马（或新大陆强权）正面临历史性抉择：是横渡大西洋倾力介入欧亚决战，还是趁旧大陆流血不止之际确立新世界独霸？"
 oe_end.7.t: "跨大西洋战区"
 oe_end.8.a: "动员意识形态志愿军团奔赴前线决死一战"
 oe_end.8.b: "节制激进狂热，优先稳固国内宪制与社稷"
 oe_end.8.d: "终局大战不再只是疆域与霸权的较量——革命宣言、公民军团与正统王权神圣同盟的思潮正将每一座首都化作意识形态的熔炉。志愿兵高唱战歌奔赴前线，而旧贵族与教士阶层则忧心社稷动摇。"
 oe_end.8.t: "三色旗与旧王冠：意识形态总对决"
 oe_end.9.a: "铁腕收紧全域港口封锁线，不惜商损也要窒息敌国"
 oe_end.9.b: "暗中发放特许执照默许中立商船绕封补给"
 oe_end.9.d: "交战双方竞相颁布严酷的港口禁运与大陆封锁令，企图扼杀对手的关税与军工命脉。然而咖啡、蔗糖、硝石与棉布价格飙升，从波罗的海到加勒比海的隐秘走私船队正令各国海关焦头烂额。"
 oe_end.9.t: "大陆封锁令与全球走私暗潮"
 oe_end.90.a: "审计完毕。"
 oe_end.90.d: "1750–1836 欧亚终局大战（oe_sit_eurasian_great_war）实时参数：\n· 局势状态（0未启 / 1进行中 / 2已结）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_state')|0]｜终局代码（1霸主 / 2维也纳 / 3革命 / 4妥协）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_outcome')|0]\n· 本国阵营代码（0未站队 / 1霸权轴心A / 2均势同盟B / 3武装中立）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_bloc')|0]\n· 两大阵营列强数（A : B）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_members_a')|0] : [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_members_b')|0]｜W2 四维霸权张力：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_heg2_tension')|0] / 100\n· 终局天平（0均势同盟↔100霸权轴心）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_balance')|0] / 100｜全球战争疲惫：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_exhaustion')|0] / 100\n· 18 战略锚点控制比（A : B）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_score_a')|0] : [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_score_b')|0]\n· 五大战区得分（-20B..+20A）：地中海 [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t1')|0]｜中欧 [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t2')|0]｜东欧印度 [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t3')|0]｜东亚太平 [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t4')|0]｜大西洋极乐洲 [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t5')|0]"
 oe_end.90.t: "《欧亚终局大战》战局总览"
 oe_end_act_armed_neutrality: "宣示武装中立同盟"
 oe_end_act_armed_neutrality_desc: "在两大跨洲阵营对峙之际宣示武装中立，借战时护航与转口贸易斩获丰厚金币与持续 8 年的商贸加成，但将折损威望且仍面临战火波及风险。"
 oe_end_act_join_coalition_bloc: "加入欧亚均势大同盟（阵营 B）"
 oe_end_act_join_coalition_bloc_desc: "抛弃旧怨加入「欧亚均势大同盟」，获得持续 10 年的士气与外交协作加成，将终局天平推向均势同盟 -4，合力围堵单极霸主。"
 oe_end_act_join_hegemon_bloc: "加入帝国霸权轴心（阵营 A）"
 oe_end_act_join_hegemon_bloc_desc: "正式站队头号霸主领衔的「帝国霸权轴心」，获得持续 10 年的霸权盟约军纪与战果加成，将终局天平推向霸权阵营 +4，并与均势大同盟势成水火。"
 oe_end_act_levee_en_masse: "颁行「全民总动员令」（Levée en Masse）"
 oe_end_act_levee_en_masse_desc: "以金币、稳定与厌战为代价立即征召 18 个月兵源并开启持续 6 年的全民总动员加成，将终局天平推向本阵营 ±4 并使全球战争疲惫 +4。"
 oe_end_act_summon_peace_congress: "召集维也纳式世界和平会议"
 oe_end_act_summon_peace_congress_desc: "当全球战争疲惫 ≥ 65、终局天平已现决胜倾角（≥ 75 或 ≤ 25）或时至 1825 年后，出资召集列强大使共商世界和平会议，强力推进终局结算。"
 oe_end_act_war_subsidy_chest: "拨付跨洲军费金援（「皮特黄金」）"
 oe_end_act_war_subsidy_chest_desc: "向所属阵营的前线领袖与盟军拨付巨额跨洲军费补贴，付与持续 5 年的军费金援加成并推动终局天平向本阵营大幅倾斜（±5）。"
 oe_end_adv_total_mobilization: "总体战与国家总动员体制"
 oe_end_adv_total_mobilization_desc: "将国民兵役、战时兵工、跨洲后勤与主权国债纳入统一参谋调度，使帝国足以在横跨欧亚与大西洋的终局大战中维持持久总攻。"
 oe_end_blockade_cd_tt: "距离上次颁布大陆封锁与护航法案已满 10 年冷却。"
 oe_end_bonds_cd_tt: "距离上次发行世纪大战主权国债已满 10 年冷却。"
 oe_end_cb_balance_of_power: "欧亚均势反霸大战"
 oe_end_cb_balance_of_power_PROV: "粉碎单极霸权、重建均势体系的同盟决战"
 oe_end_cb_balance_of_power_desc: "绝不允许任何单一帝国吞并欧亚大陆！作为欧亚均势大同盟成员，我们将联合诸强向霸权轴心发动反霸决战，迫使其退回维也纳式均势格局。"
 oe_end_cb_great_war: "欧亚终局霸权决战"
 oe_end_cb_great_war_PROV: "确立跨洲单极霸权的终局大战"
 oe_end_cb_great_war_desc: "欧亚终局大战已经引爆！作为帝国霸权轴心成员，我们将对均势大同盟及一切阻挠帝国秩序的列强发动总体决战，以夺取敌都与五大战区霸权定鼎天下。"
 oe_end_dec_congress_charter.a: "勒石颁行跨洲和平宪章"
 oe_end_dec_congress_charter.desc: "欧亚终局大战尘埃落定之后，借世界和平会议之威仪正式颁布跨洲疆界担保宪章，消弭战疲、削减帝国熵增并赢得列强普遍敬重。"
 oe_end_dec_congress_charter.title: "颁布《欧亚均势与疆界担保宪章》"
 oe_end_dec_congress_charter_tt: "获得稳定、威望、大幅降低厌战与帝国熵增（#G -12#!），并获持续 #Y 25 年#! 的欧亚均势宪章修正与列强外交好感。"
 oe_end_dec_continental_blockade.a: "下令全面封锁敌港航道"
 oe_end_dec_continental_blockade.desc: "调集主力舰队封锁敌国商港并管控战略物资流向，借经济绞杀动摇对手战争机器。"
 oe_end_dec_continental_blockade.title: "颁行大陆封锁与反封锁护航法案"
 oe_end_dec_continental_blockade_tt: "获得持续 #Y 10 年#! 的大陆封锁修正（封锁效率与主力舰战力大幅提升，海贸效率略降），并将终局天平推向本阵营 #G ±3#!。"
 oe_end_dec_diplomatic_revolution.a: "签押外交革命同盟密约"
 oe_end_dec_diplomatic_revolution.desc: "仿效 1756 年《凡尔赛条约》之先例，主动化解与同阵营昔日宿敌的百年积怨，建立跨文明联合作战同盟网。"
 oe_end_dec_diplomatic_revolution.title: "促成「外交革命」大改组"
 oe_end_dec_diplomatic_revolution_tt: "化解与所有同阵营列强的敌对偏置并转为战友关系，获得持续 #Y 15 年#! 的外交革命新同盟修正，并触发外交革命盛典。"
 oe_end_dec_war_bonds_issue.a: "核准发行长期战时国债"
 oe_end_dec_war_bonds_issue.desc: "面向全国商帮与金融清算网络发行世纪大战长期国债，筹措海量军费；若已研发主权金融清算科技（经济 2.0），将额外筹得巨款且免除稳定损耗。"
 oe_end_dec_war_bonds_issue.title: "发行世纪大战长期国债"
 oe_end_dec_war_bonds_issue_tt: "立即筹得与年收入挂钩的大笔战时军费，并获得持续 #Y 10 年#! 的长期国债信用修正（拥有主权清算科技可额外获 #G +250#! 金币且不损稳定）。"
 oe_end_map_anchor_tt: "五大战区十八大战略记分锚点之一（每季度驱动终局天平）。"
 oe_end_map_bloc_a_tt: "帝国霸权轴心成员国与附庸（阵营 A）。"
 oe_end_map_bloc_b_tt: "欧亚均势大同盟成员国与附庸（阵营 B）。"
 oe_end_map_leader_a_tt: "帝国霸权轴心领衔强权（阵营 A 领袖）。"
 oe_end_map_leader_b_tt: "欧亚均势大同盟领衔强权（阵营 B 领袖）。"
 oe_end_map_neutral_tt: "武装中立同盟成员国（借战时航运套利，暂不站队）。"
 oe_end_op_bloc_archenemy: "终局大战敌对阵营宿敌"
 oe_end_op_bloc_comrade: "终局大战同阵营战友"
 oe_end_op_congress_guarantor: "世界和平会议均势担保"
 oe_end_op_neutral_violation: "战时截击中立商船风波"
 oe_end_player_only_tt: "仅限玩家操作的国家可以主动颁行此决议。"
 oe_end_timeline_concert: "维也纳式欧亚协调会闭幕，列强确立跨洲均势体系。"
 oe_end_timeline_hegemon: "欧亚终局大战以单极帝国霸权确立落幕。"
 oe_end_timeline_peace: "世界和平大会签署世纪妥协和约，欧亚终局大战尘埃落定。"
 oe_end_timeline_revolution: "革命阵营赢得欧亚终局大战，开启启蒙与大革命新纪元。"
 oe_end_timeline_start: "1750–1836 欧亚终局大战爆发，欧亚与大西洋列强裂分为两大跨洲阵营。"
 oe_sit_eurasian_great_war: "1750–1836 欧亚终局大战"
 oe_sit_eurasian_great_war_concert: "维也纳式欧亚协调会与均势复辟"
 oe_sit_eurasian_great_war_concert_desc: "欧亚均势大同盟挫败单极霸权企图（终局天平 ≤ 15，或霸主高熵崩溃且天平 ≤ 35）。列强召开维也纳式世界和平会议，确立多极均势与疆界担保体系。"
 oe_sit_eurasian_great_war_desc: "随着后期霸权极化、宿敌外交革命与革命思潮席卷全球，欧亚大陆与大西洋两岸裂分为「帝国霸权轴心」与「欧亚均势大同盟」两大阵营。战火同时在地中海、中欧、东欧—印度洋、东亚太平洋与大西洋—极乐洲五大跨洲战区燃烧，唯有一方彻底压倒对手或召开维也纳式世界和平会议，方能定鼎近世终局。"
 oe_sit_eurasian_great_war_hegemon: "单极帝国霸权确立"
 oe_sit_eurasian_great_war_hegemon_desc: "帝国霸权轴心在五大战区彻底压倒对手（终局天平 ≥ 85，或均势同盟领袖崩溃且天平 ≥ 70，且非革命政权主导）。霸主确立横跨欧亚的无上威仪。"
 oe_sit_eurasian_great_war_peace: "筋疲力尽的世纪妥协和约"
 oe_sit_eurasian_great_war_peace_desc: "全球战争疲惫值达到 85、世界和平大会达成妥协或时至 1835 年。各大强权在精疲力竭之际签署跨洲停战和约，锁定既得疆界以图百年休养。"
 oe_sit_eurasian_great_war_revolution: "启蒙与大革命新纪元"
 oe_sit_eurasian_great_war_revolution_desc: "革命阵营在终局大战中夺取压倒性胜利（终局天平 ≥ 85 且霸权阵营领袖为革命国家）。旧王朝秩序瓦解，宪政与革命新思潮席卷欧亚。"
