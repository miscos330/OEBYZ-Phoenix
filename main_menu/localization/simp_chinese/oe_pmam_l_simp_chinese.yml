# NEW 2026-11-22 v10.0 Worker 1 (Slot 76): Playable Mamluks Spice & Caliphate (oe_pmam_). Generated by gen_playable_mam.py; edit the generator, not this file.
 oe_pmam_player_only_tt: "仅限玩家国家可执行此项操作。"
 oe_pmam_karimi_cd_tt: "当前未处于卡里米商团特许换约冷却中。"
 oe_pmam_fifth_corps_tier_tt: "第五军团火器改革尚未达到满级（低于 #Y 4#! 阶）。"
 oe_pmam_fifth_corps_cd_tt: "当前未处于第五军团扩编整训冷却中。"
 oe_pmam_dec_charter_karimi_guild_tt: "向卡里米红海大商团颁发御赐特许宪章：大幅提升卡里米商团活度并强化红海—亚历山大香料贸易。"
 oe_pmam_dec_commission_fifth_corps_tt: "扩编「第五军团」（Al-Tabaqa al-Khamisa）火绳枪新军 +1 阶，解锁火枪方阵与红海炮舰战力，但会令传统骑射埃米尔不满。"
 oe_pmam_dec_abolish_iqta_farming_tt: "彻底废除伊克塔军事包税制、推行国家俸禄常备军，并授予「近代马穆鲁克新军」政体改革。"
 STATIC_MODIFIER_NAME_oe_pmam_rawk_audit_mod: "纳西尔土地清丈重核"
 STATIC_MODIFIER_DESC_oe_pmam_rawk_audit_mod: "苏丹铁腕重核埃及与叙利亚田亩税册，收回私占官田充实国库，却令诸埃米尔怀恨在心。"
 STATIC_MODIFIER_NAME_oe_pmam_emir_iqta_appeased_mod: "诸埃米尔伊克塔抚慰"
 STATIC_MODIFIER_DESC_oe_pmam_emir_iqta_appeased_mod: "以新封伊克塔采邑安抚军奴诸将，换取重装骑兵效命与暂时宫廷安宁。"
 STATIC_MODIFIER_NAME_oe_pmam_burji_elite_mod: "布尔吉切尔克思选帝军团"
 STATIC_MODIFIER_DESC_oe_pmam_burji_elite_mod: "巴尔古格创立的切尔克思军奴选帝体制令最善战的埃米尔执掌大权，重骑冲锋与军事传统凌厉无匹，然王统继承暗流涌动。"
 STATIC_MODIFIER_NAME_oe_pmam_bahri_dynasty_mod: "巴赫里世袭苏丹法统"
 STATIC_MODIFIER_DESC_oe_pmam_bahri_dynasty_mod: "稳固钦察巴赫里世袭血统，平息宫廷政变潮，令开罗行政秩序与法统威望稳步提升。"
 STATIC_MODIFIER_NAME_oe_pmam_cairo_caliphate_mod: "开罗阿拔斯哈里发与两圣城监护"
 STATIC_MODIFIER_DESC_oe_pmam_cairo_caliphate_mod: "奉养开罗阿拔斯哈里发并护持麦加、麦地那两圣城朝觐商道，令苏丹在全逊尼世界享有无上宗教威仪。"
 STATIC_MODIFIER_NAME_oe_pmam_karimi_boom_mod: "卡里米红海香料黄金网"
 STATIC_MODIFIER_DESC_oe_pmam_karimi_boom_mod: "活力充沛的卡里米大商团将马拉巴尔胡椒、摩鹿加丁香与也门香料源源运抵开罗与亚历山大，东地中海商利滚滚而来。"
 STATIC_MODIFIER_NAME_oe_pmam_karimi_strain_mod: "卡里米商团萎缩"
 STATIC_MODIFIER_DESC_oe_pmam_karimi_strain_mod: "过度的国家专卖与强制摊派令红海大商团纷纷转往别港，亚历山大香料货源渐趋紧张。"
 STATIC_MODIFIER_NAME_oe_pmam_karimi_charter_mod: "御赐卡里米特许分红宪章"
 STATIC_MODIFIER_DESC_oe_pmam_karimi_charter_mod: "苏丹以律法保障卡里米商帮船货安全并按成抽税，商船云集吉达与亚历山大。"
 STATIC_MODIFIER_NAME_oe_pmam_barsbay_tarh_mod: "巴尔斯拜 1428 国营香料专卖（Tarh）"
 STATIC_MODIFIER_DESC_oe_pmam_barsbay_tarh_mod: "王室强行统购胡椒与砂糖并向欧商定额摊派，短期内国库暴增，但长远压抑民间商帮生机。"
 STATIC_MODIFIER_NAME_oe_pmam_levant_wall_mod: "阿勒颇—大马士革北疆壁垒"
 STATIC_MODIFIER_DESC_oe_pmam_levant_wall_mod: "在叙利亚北疆险关大修石堡、囤积粮械并整编边防骑团，严防安纳托利亚雄师南下。"
 STATIC_MODIFIER_NAME_oe_pmam_levant_detente_mod: "黎凡特商贸互不侵犯协约"
 STATIC_MODIFIER_DESC_oe_pmam_levant_detente_mod: "与北方强权划定叙利亚边界并互开商路，使苏丹得以抽身全力经营红海与印度洋。"
 STATIC_MODIFIER_NAME_oe_pmam_ven_suez_timber_mod: "威尼斯—苏伊士秘密船材同盟"
 STATIC_MODIFIER_DESC_oe_pmam_ven_suez_timber_mod: "威尼斯秘送达尔马提亚橡木、火炮铸匠与造船总师经亚历山大驼运至苏伊士，令红海舰队迅速成型！"
 STATIC_MODIFIER_NAME_oe_pmam_ven_levant_dividend_mod: "亚历山大—苏伊士联合抗葡红利"
 STATIC_MODIFIER_DESC_oe_pmam_ven_levant_dividend_mod: "威尼斯通过秘密援建马穆鲁克红海舰队守护东地中海香料通道，分享亚历山大丰厚胡椒税利。"
 STATIC_MODIFIER_NAME_oe_pmam_diu_triumph_mod: "1509 第乌大捷：红海香料霸权延续"
 STATIC_MODIFIER_DESC_oe_pmam_diu_triumph_mod: "胡赛因·库尔迪舰队携手古吉拉特与卡利卡特在第乌击破葡萄牙封锁！好望角未能截断红海命脉，开罗香料盛世再延半世纪。"
 STATIC_MODIFIER_NAME_oe_pmam_diu_fiscal_shock_mod: "第乌失利与香料财政震荡"
 STATIC_MODIFIER_DESC_oe_pmam_diu_fiscal_shock_mod: "葡萄牙武装通行证封锁曼德海峡，红海关税锐减，逼迫开罗朝廷痛下决心革新军制与税基。"
 STATIC_MODIFIER_NAME_oe_pmam_fifth_corps_cadre_mod: "第五军团（Al-Tabaqa al-Khamisa）火枪新军"
 STATIC_MODIFIER_DESC_oe_pmam_fifth_corps_cadre_mod: "突破传统马穆鲁克重骑兵对火绳枪的鄙夷，征召马穆鲁克后裔（Awlad al-Nas）与开罗工匠编成常备火枪与炮兵军团。"
 STATIC_MODIFIER_NAME_oe_pmam_trajan_suez_canal_mod: "图拉真—苏伊士双海船闸通航"
 STATIC_MODIFIER_DESC_oe_pmam_trajan_suez_canal_mod: "尼罗河—红海古运河在马穆鲁克主导下彻底浚通！地中海与印度洋舰队商船直通无阻，苏丹国执掌世界东西航运咽喉。"
 STATIC_MODIFIER_NAME_oe_pmam_suez_canal_loc_mod: "苏伊士双海船闸总署"
 STATIC_MODIFIER_DESC_oe_pmam_suez_canal_loc_mod: "连通地中海与红海的巨型船闸与造船干坞，令本地商容与海权投送倍增。"
 STATIC_MODIFIER_NAME_oe_pmam_red_sea_coffee_web_mod: "亚丁—吉达—霍尔木兹香料咖啡网"
 STATIC_MODIFIER_DESC_oe_pmam_red_sea_coffee_web_mod: "掌控亚丁、吉达与马斯喀特要津后，印度洋胡椒与也门摩卡咖啡齐汇开罗市场，缔造跨越波斯湾与红海的商业帝国。"
 STATIC_MODIFIER_NAME_oe_pmam_nile_shuna_granary_mod: "尼罗河大坝与帝国常平舒纳粮仓（Shuna）"
 STATIC_MODIFIER_DESC_oe_pmam_nile_shuna_granary_mod: "依托尼罗河泛滥水文修筑堤闸并广设皇家舒纳粮仓，不仅稳固埃及与汉志粮荒救灾，更令苏丹国成为东地中海无可撼动的粮仓霸主。"
 STATIC_MODIFIER_NAME_oe_pmam_salaried_army_mod: "废除伊克塔：国家俸禄常备军制"
 STATIC_MODIFIER_DESC_oe_pmam_salaried_army_mod: "终结延续三百年的军事包税山头割据，全国田赋直入开罗户部并按月发饷养兵，苏丹国迈入近代中央集权强国行列。"
 STATIC_MODIFIER_NAME_oe_pmam_nile_cotton_shipyard_mod: "尼罗河长绒棉与亚历山大近代船厂"
 STATIC_MODIFIER_DESC_oe_pmam_nile_cotton_shipyard_mod: "在三角洲兴办官营长绒棉纺厂与亚历山大重炮铸造船坞，孕育中东最早的近代工业浪潮。"
 STATIC_MODIFIER_NAME_oe_pmam_azhar_enlightenment_mod: "阿兹哈尔学府革新与阿拉伯启蒙"
 STATIC_MODIFIER_DESC_oe_pmam_azhar_enlightenment_mod: "在尊崇阿兹哈尔千年经学传统的同时增设航海、测绘、医学与工程讲席，令开罗再度成为伊斯兰与地中海世界的思想灯塔。"
 STATIC_MODIFIER_NAME_oe_pmam_dual_sea_sultanate_mod: "红海—尼罗河双海近代苏丹国"
 STATIC_MODIFIER_DESC_oe_pmam_dual_sea_sultanate_mod: "击退欧洲列强对苏伊士地峡的觊觎，以常备火炮军团、蒸汽前夜舰队与稳固主权财政傲立 19 世纪之门！"
 STATIC_MODIFIER_NAME_oe_pmam_coptic_nile_accord_mod: "科普特与埃塞俄比亚红海通商协定"
 STATIC_MODIFIER_DESC_oe_pmam_coptic_nile_accord_mod: "向埃及科普特社群与埃塞俄比亚所罗门王朝授予宗教保护与红海通商特许，换取尼罗河上游永宁与可观商税。"
 oe_pmam_b_ven_timber_pact: "苏伊士秘密船材抗葡同盟"
 oe_pmam_b_diu_clash: "1509 第乌印度洋香料决战"
 oe_pmam_b_levant_detente: "黎凡特商贸互不侵犯协约"
 oe_pmam_b_levant_rivalry: "叙利亚北疆军事对峙"
 oe_pmam_b_coptic_nile_accord: "尼罗河—红海科普特通商盟约"
 oe_pmam_b_caliphate_prestige: "开罗哈里发两圣城护法威望"
 oe_pmam_ref_spice_sultanate: "红海香料苏丹国"
 oe_pmam_ref_spice_sultanate_desc: "以开罗、亚历山大、吉达与亚丁为骨架，将卡里米商团资本与国家海军护航熔为一体，构筑横跨地中海与印度洋的香料商业霸权。"
 oe_pmam_ref_reformed_mamluk_army: "近代马穆鲁克新军"
 oe_pmam_ref_reformed_mamluk_army_desc: "以「第五军团」常备火绳枪步兵与重炮营补齐传统重装骑兵短板，并废除伊克塔军事包税建立中央直辖俸禄军制。"
 oe_pmam_spice_monopoly_law: "红海香料专卖与商栈法"
 oe_pmam_spice_monopoly_law_desc: "抉择苏丹国对红海—亚历山大香料走廊的经营方略：扶植卡里米自由商团分红、施行巴尔斯拜式国营摊派专卖，或与威尼斯结成亚历山大船材商贸协约。"
 oe_pmam_pol_karimi_free_charter: "卡里米自由特许宪章"
 oe_pmam_pol_karimi_free_charter_desc: "保障卡里米商团自主经营与船队信用，以温和关税换取红海海贸长期繁荣与市民阶层拥护。"
 oe_pmam_pol_barsbay_tarh_monopoly: "巴尔斯拜国营摊派专卖（Tarh）"
 oe_pmam_pol_barsbay_tarh_monopoly_desc: "由苏丹国库统购胡椒、丁香与砂糖并定额配售，大幅抬升王室岁入与中央集权，却压低卡里米私商活度。"
 oe_pmam_pol_venetian_alexandria_accord: "亚历山大—威尼斯联合商约"
 oe_pmam_pol_venetian_alexandria_accord_desc: "向威尼斯与地中海伙伴开放亚历山大优惠商栈以换取造船木料、铁料与海军技艺，合力抗衡好望角分流。"
 oe_pmam_karimi_funduq: "卡里米香料商栈总署"
 oe_pmam_karimi_funduq_desc: "设于开罗、亚历山大、吉达、亚丁与苏伊士的巨型石砌拱廊香料货栈（Funduq），集胡椒丁香验货、汇票清算与红海护航调度于一体，显著提升本地国内商人容量与贸易中心权势。"
 oe_pmam_karimi_funduq_maint: "卡里米香料商栈（运营维护）"
 oe_pmam_fifth_corps_arquebusiers: "第五军团火绳枪新军"
 oe_pmam_fifth_corps_arquebusiers_desc: "苏丹高里顶住传统骑兵贵族压力编练的「第五军团」（Al-Tabaqa al-Khamisa）常备火绳枪方阵，以马穆鲁克后裔与开罗工匠为骨干，专克重甲骑阵与堡垒守军。"
 oe_pmam_red_sea_war_galley: "红海苏伊士重炮桨帆舰"
 oe_pmam_red_sea_war_galley_desc: "在苏伊士船坞用达尔马提亚与黎巴嫩橡木装配的红海专用重炮桨帆战舰，吃水浅、转向灵且舰首配备重型青铜臼炮，专事在红海暗礁与第乌海峡迎战远洋帆船。"
 oe_pmam_adv_fifth_corps: "第五军团火绳枪与苏伊士炮舰制式"
 oe_pmam_adv_fifth_corps_desc: "将「第五军团」火绳枪操典与苏伊士红海重炮桨帆舰造船术定为国制，全面提升重步兵与桨帆战舰战力。"
 oe_pmam_dec_charter_karimi_guild.title: "特许卡里米红海大商团"
 oe_pmam_dec_charter_karimi_guild.desc: "向掌控红海—印度洋香料航线的卡里米大商团颁赐御印特许宪章，保障吉达、亚丁与亚历山大货栈信用，提振卡里米活度与海贸税源。"
 oe_pmam_dec_charter_karimi_guild.a: "颁赐卡里米特许御印"
 oe_pmam_dec_commission_fifth_corps.title: "扩编第五军团火绳枪新军"
 oe_pmam_dec_commission_fifth_corps.desc: "顶住传统骑射贵族对火器的轻视，招募马穆鲁克后裔（Awlad al-Nas）与开罗工匠扩编「第五军团」（Al-Tabaqa al-Khamisa，最高 4 阶），列装火绳枪方阵与红海炮舰。"
 oe_pmam_dec_commission_fifth_corps.a: "征募新兵扩编第五军团"
 oe_pmam_dec_abolish_iqta_farming.title: "废除伊克塔包税推行直辖俸禄"
 oe_pmam_dec_abolish_iqta_farming.desc: "收回诸埃米尔世袭或私占的伊克塔军役田赋，全部改归开罗户部统筹并按月发饷供养常备军，彻底消除马穆鲁克山头割据。"
 oe_pmam_dec_abolish_iqta_farming.a: "颁诏废除伊克塔包税制"
 oe_pmam.1.t: "纳西尔苏丹身后之乱与《纳西尔清丈》税册重核"
 oe_pmam.1.d: "雄主纳西尔·穆罕默德苏丹驾崩之后，开罗城堡内的军奴诸埃米尔旋即陷入激烈争权，昔日 1315 年《纳西尔土地清丈》（Rawk al-Nasiri）所确立的伊克塔（Iqta'）田赋账册遭权贵大肆篡改侵占。新主必须立刻定夺：是分封采邑息事宁人，还是铁腕重核埃及与叙利亚税册？"
 oe_pmam.1.a: "铁腕重核《纳西尔清丈》税册，收回私占王室官田"
 oe_pmam.1.b: "加封伊克塔采邑安抚诸埃米尔，换取重骑效忠"
 oe_pmam.2.t: "巴尔古格夺权：巴赫里还是布尔吉？"
 oe_pmam.2.d: "长达四十年的宫廷暗斗终至临界点。驻守开罗城堡塔楼（Burj）的切尔克思军奴领袖巴尔古格（Barquq）率精锐拥兵逼宫，宣称软弱的钦察巴赫里（Bahri）世袭幼主已无力御侮，唯有力战脱颖而出的选帝军奴强主方能保卫伊斯兰心脏！"
 oe_pmam.2.a: "拥立布尔吉切尔克思体制：以选帝强主锻造精锐铁骑"
 oe_pmam.2.b: "力保巴赫里世袭苏丹法统，整肃城堡兵变"
 oe_pmam.3.t: "阿拔斯开罗哈里发与两圣城监护权"
 oe_pmam.3.d: "开罗宫廷奉养着巴格达陷落后仅存的阿拔斯哈里发血脉，而每年从开罗出发的金色圣轿（Mahmal）朝觐队更将麦加与麦地那牢牢系于苏丹权柄之下。借哈里发册封诏书与两圣城护法威望，苏丹足以在逊尼诸国间树立无可替代的宗教正统！"
 oe_pmam.3.a: "厚奉开罗哈里发与两圣城朝觐队，宣示逊尼护法正统"
 oe_pmam.3.b: "循旧例简办朝觐仪典，优先将财力留作边防军饷"
 oe_pmam.4.t: "巴尔斯拜 1428 香料专卖令与卡里米商团"
 oe_pmam.4.d: "为填补军费与伊克塔减收缺口，苏丹巴尔斯拜（Barsbay）的财政官建议颁布严厉的国营香料专卖令与强制摊派制（Tarh）——由王室垄断胡椒、丁香与蔗糖购销，迫使威尼斯与卡里米商团按官价买单。此举可令国库立获巨款，却可能重创维系数百年的卡里米红海私商网络。"
 oe_pmam.4.a: "与卡里米商团签立特许分红宪章，共拓红海香料黄金网"
 oe_pmam.4.b: "强行颁布 Tarh 国营香料专卖令，立攫巨额国库白银"
 oe_pmam.5.t: "黎凡特北疆警报：安纳托利亚雄狮的阴影"
 oe_pmam.5.d: "托罗斯山脉以北风云骤紧：无论是势如破竹的奥斯曼苏丹还是重振旗鼓的东罗马帝国，其铁蹄与火炮都已直逼阿勒颇（Aleppo）与大马士革（Damascus）门户。叙利亚总督急递密信，请示开罗立即拨银筑防，或遣使以黎凡特商贸利益换取北疆休战。"
 oe_pmam.5.a: "增筑阿勒颇与大马士革石堡防线，以剑盾捍卫叙利亚"
 oe_pmam.5.b: "遣使缔结黎凡特商贸互不侵犯协约，稳住北线专注红海"
 oe_pmam.6.t: "好望角惊雷与威尼斯秘密船材使团"
 oe_pmam.6.d: "来自亚丁与卡利卡特的快船带回令开罗宫廷震骇的噩耗：葡萄牙重炮帆船绕过非洲南端闯入印度洋，强行推行武装通行证（Cartaz）并截杀前往吉达的香料商船！危急关头，利益休戚与共的威尼斯密使潜入亚历山大，提议秘密供应达尔马提亚橡木、铜炮与造船名匠，经尼罗河与骆驼商队直运苏伊士，助马穆鲁克速建一支足以抗衡里斯本的红海战舰队！"
 oe_pmam.6.a: "缔结《亚历山大—苏伊士秘密船材同盟》，全力速建红海舰队！"
 oe_pmam.6.b: "婉拒拉丁人插手苏伊士船坞，仅征用黎巴嫩雪松自建战舰"
 oe_pmam.7.t: "决战印度洋：1509 第乌海战的命运转折"
 oe_pmam.7.d: "苏伊士船坞的战舰已扬帆驶出曼德海峡！埃米尔胡赛因·库尔迪（Amir Husain al-Kurdi）率领马穆鲁克红海舰队抵达印度西岸第乌（Diu），与古吉拉特水师及卡利卡特扎莫林结阵迎战葡萄牙总督阿尔梅达的远洋重舰。此役将决定红海香料命脉是再续半世纪辉煌，还是从此陨落于好望角浪涛之中！"
 oe_pmam.7.a: "全军压上第乌海峡，携手古吉拉特与卡利卡特粉碎封锁！"
 oe_pmam.7.b: "退守亚丁与吉达海峡险要，以游击护航消耗远来葡军"
 oe_pmam.8.t: "骑射骄傲还是火绳枪？「第五军团」成军"
 oe_pmam.8.d: "马穆鲁克精锐骑兵世代以「富鲁西亚」（Furusiyya）骑射武士道自傲，鄙称火绳枪（Bunduqiyya）是怯懦步卒的卑劣器物。然而炮火轰鸣的时代已不容迟疑——苏丹下令绕开保守贵族，直接招募马穆鲁克后裔（Awlad al-Nas）、土库曼射手与开罗工匠组建直属王室的「第五军团」（Al-Tabaqa al-Khamisa）火枪炮兵！"
 oe_pmam.8.a: "力排众议组建「第五军团」火绳枪与重炮常备军！"
 oe_pmam.8.b: "仅编练少量攻城炮手辅佐传统重装骑阵"
 oe_pmam.9.t: "图拉真—苏伊士古运河浚通"
 oe_pmam.9.d: "自法老尼科与罗马皇帝图拉真时代便深埋沙海的尼罗河—红海古水道，如今在开罗总工程师的测绘下重见天日。随着巨型石砌船闸在苏伊士合拢，地中海的商船与红海战舰无需再绕道万里好望角或驼运拆装，东西双海彻底归于苏丹掌中！"
 oe_pmam.9.a: "倾国之力竣工苏伊士双海船闸，贯通地中海与印度洋！"
 oe_pmam.9.b: "修缮开罗—苏伊士驿道货站，暂缓巨额运河开支"
 oe_pmam.10.t: "亚丁、吉达与霍尔木兹的红海商站网"
 oe_pmam.10.d: "随着亚丁、吉达与阿曼海岸尽入势力范围，红海与阿拉伯海再无割据税卡。除了传统的印度胡椒与爪哇丁香外，源自也门高地的摩卡咖啡（Coffee）正风靡开罗与地中海诸港，为苏丹国开辟出全新的黄金财源！"
 oe_pmam.10.a: "统合亚丁—吉达—马斯喀特商站网，独占香料与咖啡枢纽"
 oe_pmam.10.b: "提高咖啡与香料出口关税以充实舰队军费"
 oe_pmam.11.t: "尼罗河大坝、舒纳帝国粮仓与小冰期救灾"
 oe_pmam.11.d: "严寒与歉收席卷欧亚大陆之际，唯独定期泛滥的尼罗河谷仍是地中海世界最肥沃的谷仓。开罗水利官呈请修筑三角洲分洪大坝并扩建皇家「舒纳」（Shuna）大粮仓——既可平抑小冰期饥荒动荡，又能凭余粮出口令汉志与东地中海诸邦仰开罗鼻息！"
 oe_pmam.11.a: "兴修尼罗河分洪大坝与帝国舒纳粮仓，稳固仓廪兼济灾荒"
 oe_pmam.11.b: "高价向缺粮诸国抛售尼罗河官粮，大发荒年之财"
 oe_pmam.12.t: "废除军事包税：伊克塔采邑转为国家俸禄制"
 oe_pmam.12.d: "历经第五军团火器革新与数代财政整顿，苏丹终于具备一举拔除三百年顽疾的底气！诏书宣示全国：割据性的伊克塔（Iqta'）包税封地即日起全部收归国有，所有军团改由开罗中央国库按月核发银饷，昔日军奴派系门阀就此转化为听命国家的近代常备劲旅。"
 oe_pmam.12.a: "彻底废除伊克塔包税，确立中央集权常备俸禄军！"
 oe_pmam.12.b: "以终身年金赎买埃米尔旧特权，温和渐进收权"
 oe_pmam.13.t: "尼罗河长绒棉与亚历山大近代造船厂"
 oe_pmam.13.d: "肥沃的尼罗河三角洲试种出洁白柔韧的长绒棉，欧洲与奥斯曼布商竞相抢购；与此同时，亚历山大港的新式干坞与皇家铸炮厂也已拔地而起，令苏丹国在东方率先迈出近代制造与远洋造船的坚实步伐。"
 oe_pmam.13.a: "兴办国营长绒棉纺织工场与亚历山大重炮造船厂"
 oe_pmam.13.b: "放手由卡里米商行承建棉厂，朝廷坐享关税分成"
 oe_pmam.14.t: "阿兹哈尔学府革新与阿拉伯启蒙"
 oe_pmam.14.d: "千年名校开罗阿兹哈尔大学迎来思想激荡的新时代。开明学者与皇家工匠提议在保留古典法学与经注学脉的同时，增设近代天文测绘、航海图志、外科医学与印刷译馆，让阿拉伯语世界重新接轨全球科学前沿。"
 oe_pmam.14.a: "在阿兹哈尔增设测绘、医学与航海译馆，引领阿拉伯启蒙"
 oe_pmam.14.b: "尊崇传统乌里玛权威，仅在军校内秘密研习近代工程"
 oe_pmam.15.t: "守护苏伊士：迎战欧洲列强东进"
 oe_pmam.15.d: "18 世纪末叶，大西洋与地中海列强的远征舰队频频窥伺亚历山大与苏伊士地峡，企图将通往印度的捷径据为殖民禁脔。然而他们面对的早已不是昔日分裂的旧苏丹国，而是手握双海船闸、常备火炮军团与丰厚香料国库的「红海—尼罗河双海近代苏丹国」！"
 oe_pmam.15.a: "宣告「红海—尼罗河双海近代苏丹国」，寸土不让迎击列强！"
 oe_pmam.15.b: "以武装中立开放苏伊士国际通航，广收万国过境重税"
 oe_pmam.16.t: "科普特与埃塞俄比亚红海通商协定"
 oe_pmam.16.d: "尼罗河上游的埃塞俄比亚所罗门王朝使团携黄金、象牙与亚历山大科普特牧首的亲笔书信抵达开罗。若苏丹正式保障境内科普特教会安宁并向埃塞商船开放红海免税码头，不仅可永保尼罗河上游水源和平，更能将东非腹地的黄金与香料尽纳开罗商网。"
 oe_pmam.16.a: "颁赐科普特护教特许并与埃塞俄比亚缔结红海通商协定"
 oe_pmam.16.b: "维持旧例课征红海全额关税，不另颁特别豁免"
