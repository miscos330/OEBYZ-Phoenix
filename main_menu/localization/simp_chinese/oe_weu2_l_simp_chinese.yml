# NEW 2026-11-22 v11.5 Worker 4 (oe_weu2_). Generated by gen_v115_western_europe.py; edit the generator, not this file.
 oe_weu2_propaganda_admiralty_house: "海军部与东方学院"
 oe_weu2_propaganda_admiralty_house_desc: "海军部、特许公司的总部与培养远方使节的学院合在一座大楼里。只能建在维也纳、布拉格、罗马、里斯本、巴黎、伦敦、阿姆斯特丹、安特卫普、柏林、德累斯顿与慕尼黑，每地一座；建在首都时另有全国加成。需要“传信部与万国舆图”科技。"
 oe_weu2_propaganda_admiralty_house_maint: "日常维护"
 oe_weu2_continental_maritime_law: "陆上与海上的国本"
 oe_weu2_continental_maritime_law_desc: "国家把力量放在哪里：帝国的联防、普世的教务、东方的航路，还是特许公司。"
 oe_weu2_pol_reichskreise_defense: "帝国大区联防"
 oe_weu2_pol_reichskreise_defense_desc: "把帝国划成若干大区，各区自行摊派兵员与军费，共同防御。"
 oe_weu2_pol_propaganda_fide_missions: "普世教务"
 oe_weu2_pol_propaganda_fide_missions_desc: "由罗马直接派遣和管理远方的传教士，不再假手于各国王室。"
 oe_weu2_pol_carreira_cartaz_network: "印度航线与通行证"
 oe_weu2_pol_carreira_cartaz_network_desc: "占据几处海峡要塞，在整片大洋上强制推行通行证。"
 oe_weu2_pol_chartered_east_india_acts: "特许公司与航海条例"
 oe_weu2_pol_chartered_east_india_acts_desc: "把远洋贸易交给合股的特许公司，并规定本国的货物只许本国的船运。"
 oe_weu2_reichskammergericht_reform: "帝国大区与最高法院"
 oe_weu2_reichskammergericht_reform_desc: "诸侯之间永久禁止私战，争端交给常设的帝国最高法院裁断，各大区负责执行判决。"
 oe_weu2_chartered_maritime_admiralty: "海军部与特许商社"
 oe_weu2_chartered_maritime_admiralty_desc: "设常设的海军部统管舰队、船坞与军官，特许商社负责海外的贸易与据点。"
 oe_weu2_priv_imperial_free_cities: "自由市特许"
 oe_weu2_priv_imperial_free_cities_desc: "确认各商业城市的自治权与它们的金融网络，换取稳定的税收与贷款。"
 oe_weu2_priv_jesuit_colleges_charter: "学院特许"
 oe_weu2_priv_jesuit_colleges_charter_desc: "准许修会在各城开办学院，教授文法、数学与天文，学费全免。"
 oe_weu2_adv_reichsreform_circles: "帝国改革"
 oe_weu2_adv_reichsreform_circles_desc: "帝国议会定期召开，设大区、法院与共同税。"
 oe_weu2_adv_albuquerque_chokepoints: "三处锁钥"
 oe_weu2_adv_albuquerque_chokepoints_desc: "不必占领整片海岸，只要守住几处海峡，就能控制一片大洋的贸易。"
 oe_weu2_adv_propaganda_fide_cartography: "传信部与万国舆图"
 oe_weu2_adv_propaganda_fide_cartography_desc: "传教士带着星图、钟表与舆图远赴东方，也把各地的见闻寄回来。解锁建筑“海军部与东方学院”。"
 oe_weu2_adv_joint_stock_line_of_battle: "合股公司与战列线"
 oe_weu2_adv_joint_stock_line_of_battle_desc: "合股集资造出更多更大的船，舰队排成一线，依次以舷炮轰击。"
 oe_weu2_player_only_tt: "只有玩家操控的国家可以使用"
 oe_weu2_dec_convene_reichskreise.title: "召集帝国大区"
 oe_weu2_dec_convene_reichskreise.desc: "召集各大区按额出兵出饷，共同防御。需要正处于战争中或已到 1500 年；花费 150 金币，效果持续 15 年。"
 oe_weu2_dec_convene_reichskreise.a: "召集"
 oe_weu2_dec_westphalia_settlement.title: "主持和会"
 oe_weu2_dec_westphalia_settlement.desc: "在明斯特与奥斯纳布吕克召开和会，了结教派战争。需要已到 1600 年；花费 250 金币。所选方案的效果持续 30 年。"
 oe_weu2_dec_westphalia_settlement.a: "召开和会"
 oe_weu2_dec_propaganda_fide_asia.title: "遣使团东行"
 oe_weu2_dec_propaganda_fide_asia.desc: "派遣精通天文历算的修士前往印度、中国与日本。需要信奉天主教，并且已到 1540 年；花费 200 金币，效果持续 20 年。此后印度与日本的相关事件会出现传教团。"
 oe_weu2_dec_propaganda_fide_asia.a: "派遣"
 oe_weu2_dec_por_three_straits_cartaz.title: "确立三处锁钥与通行证"
 oe_weu2_dec_por_three_straits_cartaz.desc: "以果阿、马六甲与霍尔木兹为锁钥，在印度洋上推行通行证。需要已发现通往印度的航路、或拥有果阿、或已到 1510 年；花费 250 金币，效果持续 30 年。此后波斯与印度的国家可以作出回应。"
 oe_weu2_dec_por_three_straits_cartaz.a: "下令"
 oe_weu2_dec_charter_east_india_company.title: "敕立东印度公司"
 oe_weu2_dec_charter_east_india_company.desc: "把东方贸易的专营权授予一家合股公司，并在首都市场上掀起一阵造船热。需要有港口，并且已到 1600 年；花费 250 金币，效果持续 20 年。"
 oe_weu2_dec_charter_east_india_company.a: "颁给特许状"
 oe_weu2.1.title: "帝国议会"
 oe_weu2.1.desc: "来自神圣罗马帝国各地的世俗诸侯、选帝侯、采邑主教与帝国自由市代表齐集议会大厅，锦袍与徽章交错辉映。摆在众人面前的核心议题只有一个：面对虎视眈眈的外部强敌，帝国防务的庞大军费究竟该由谁分摊、联军统帅权又该归谁执掌？"
 oe_weu2.1.a: "按大区摊派，各区自选统帅"
 oe_weu2.1.b: "统一交给皇帝"
 oe_weu2.2.title: "教派的裂痕"
 oe_weu2.2.desc: "一位修士的论纲传遍了各地的印刷所，诸侯与城市纷纷表态。一场公会议开了又停、停了又开，裂痕反而越来越深。"
 oe_weu2.2.a: "坚守旧教"
 oe_weu2.2.b: "容忍新说"
 oe_weu2.3.title: "布拉格的窗口"
 oe_weu2.3.desc: "愤怒的贵族把皇帝的两名大臣从城堡的窗口扔了出去。两大教派同盟都在征兵，没有人还能置身事外。"
 oe_weu2.3.a: "与同教派的诸侯结盟动员"
 oe_weu2.3.b: "尽量保持中立"
 oe_weu2.4.title: "焦土上的常备军"
 oe_weu2.4.desc: "战争把这片土地毁了一半。选帝侯得出结论：再也不能靠雇佣兵和别人的保证，必须有一支自己的常备军，哪怕为此向贵族让步。"
 oe_weu2.4.a: "建常备军"
 oe_weu2.4.b: "先恢复民生"
 oe_weu2.5.title: "和约"
 oe_weu2.5.desc: "历经数十年席卷中欧的惨烈教争与连绵战火，城郭化为焦土，农田荒芜千里，精疲力竭的交战各方终于派出全权使节齐聚两座指定和谈名城。历经经年累月的唇枪舌剑，摆在锦缎长桌上的最终和约草案呈现出截然不同的两条历史道路。"
 oe_weu2.5.a: "各邦主权，各教并存"
 oe_weu2.5.b: "由皇帝一统，终结教争"
 oe_weu2.6.title: "重修罗马"
 oe_weu2.6.desc: "罗马城里处处是脚手架：新的大教堂、新的穹顶、新的广场。花费惊人，但全欧洲的艺术家都在往这里赶。"
 oe_weu2.6.a: "继续修"
 oe_weu2.6.b: "量力而行"
 oe_weu2.7.title: "东行的修士"
 oe_weu2.7.desc: "修士们带着星图、自鸣钟与舆图上了船。有人主张入乡随俗，穿当地士人的衣服、讲当地的道理；也有人认为教义一步也不能让。"
 oe_weu2.7.a: "入乡随俗"
 oe_weu2.7.b: "谨守教义"
 oe_weu2.8.title: "三处锁钥"
 oe_weu2.8.desc: "总督的计划很简单：果阿是基地，马六甲是东门，霍尔木兹是西门。守住这三处，整片大洋的香料就只能走我们的航线。"
 oe_weu2.8.a: "照此行事"
 oe_weu2.8.b: "先稳固已有的商站"
 oe_weu2.9.title: "海盟来袭"
 oe_weu2.9.desc: "不堪忍受海上垄断与强征通行证的印度洋沿岸诸邦终于摒弃前嫌，悄然结成声势浩大的反抗海盟。由多国战舰与武装商船拼凑而成的联合舰队正在季风口岸加紧集结，他们公开撕毁通行证协定，更趁夜突袭了我们设于海滨的数处商站。"
 oe_weu2.9.a: "集中大船，寻求决战"
 oe_weu2.9.b: "对一部分港口免证，分化他们"
 oe_weu2.10.title: "交易所的钟声"
 oe_weu2.10.desc: "公司的股份向所有人发售，从大商人到女仆都来认购。船队的目标是东方的香料群岛，那里原来是别人的地盘。"
 oe_weu2.10.a: "全力支持公司"
 oe_weu2.10.b: "要求公司分红给国库"
 oe_weu2.11.title: "航海条例"
 oe_weu2.11.desc: "新法规定：运进本国的货物，只许用本国的船或货物原产国的船。这是冲着那个替全世界跑运输的邻国去的，战争恐怕难免。"
 oe_weu2.11.a: "颁行，并扩建舰队"
 oe_weu2.11.b: "颁行，但留有通融"
 oe_weu2.12.title: "大臣的船坞"
 oe_weu2.12.desc: "锐意进取的财政大臣向御前呈上一份气魄宏大的重商主义蓝图，主张由国家统筹兴建皇家海军、扩充深水船坞并组建特许东印度公司，借此夺取全球海上贸易份额。他慷慨陈词：在列强争霸的新时代，商业与关税正是永不停歇的不流血之战。"
 oe_weu2.12.a: "照他的计划拨款"
 oe_weu2.12.b: "陆军才是根本"
 oe_weu2.13.title: "大洋彼岸的紫袍"
 oe_weu2.13.desc: "航海者带回消息：大洋彼岸出现了一个自称罗马继承者的国家，城市、港口与舰队一应俱全。我们的渔场与航线就在它的家门口。"
 oe_weu2.13.a: "联合其他海上强国加以遏制"
 oe_weu2.13.b: "先与它通商"
 oe_weu2.14.title: "南方的海峡"
 oe_weu2.14.desc: "半岛与对岸为那道海峡争了几百年。无论谁最后占了上风，地中海与大西洋之间的门户都握在他手里。我们的重心该放在哪一边？"
 oe_weu2.14.a: "面向大西洋"
 oe_weu2.14.b: "面向欧陆"
 oe_weu2.90.title: "【读数】西欧"
 oe_weu2.90.desc: "v11.5 西欧读数（1 = 是，0 = 否）：\n· 本国是战区主角 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_protagonist')|0]#!，槽位 93 已运行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_pulses')|0]#! 次\n· 帝国诸侯 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_empire')|0]#!，大西洋强国 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_atlantic')|0]#!\n· 通行证制度已推行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_cartaz')|0]#!，传教团已东行 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_jesuit')|0]#!，抗通行证海盟已成立 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_league')|0]#!\n· 本国带有葡属印度总督府变量 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_estado')|0]#!（只有装了相应扩展包并颁布过该决议才会是 1），大洋彼岸的新罗马已建立 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_elysia')|0]#!"
 oe_weu2.90.a: "关闭"
 STATIC_MODIFIER_NAME_oe_weu2_reichskreise_mod: "大区联防"
 STATIC_MODIFIER_DESC_oe_weu2_reichskreise_mod: "各大区已按额出兵出饷。"
