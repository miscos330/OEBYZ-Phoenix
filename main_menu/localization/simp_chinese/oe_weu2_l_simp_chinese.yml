 STATIC_MODIFIER_DESC_oe_weu2_league_mobilised_mod: "同一教派的诸侯结盟备战。"
 STATIC_MODIFIER_NAME_oe_weu2_iron_kingdom_mod: "铁的王国"
 STATIC_MODIFIER_DESC_oe_weu2_iron_kingdom_mod: "焦土之上建起了一支常备军。"
 STATIC_MODIFIER_NAME_oe_weu2_westphalian_balance_mod: "主权均势"
 STATIC_MODIFIER_DESC_oe_weu2_westphalian_balance_mod: "各邦主权与各教派并存，写进了和约。"
 STATIC_MODIFIER_NAME_oe_weu2_imperial_unity_mod: "帝国一统"
 STATIC_MODIFIER_DESC_oe_weu2_imperial_unity_mod: "皇帝的权威压倒了诸侯。"
 STATIC_MODIFIER_NAME_oe_weu2_propaganda_fide_mod: "传信部"
 STATIC_MODIFIER_DESC_oe_weu2_propaganda_fide_mod: "罗马直接管理远方的教务。"
 STATIC_MODIFIER_NAME_oe_weu2_carreira_da_india_mod: "印度航线"
 STATIC_MODIFIER_DESC_oe_weu2_carreira_da_india_mod: "三处海峡要塞与通行证制度控制着大洋的贸易。"
 STATIC_MODIFIER_NAME_oe_weu2_viceroyalty_synergy_mod: "总督府协同"
 STATIC_MODIFIER_DESC_oe_weu2_viceroyalty_synergy_mod: "东方的总督府与航线互相配合。"
 STATIC_MODIFIER_NAME_oe_weu2_east_india_company_mod: "特许东印度公司"
 STATIC_MODIFIER_DESC_oe_weu2_east_india_company_mod: "合股的特许公司垄断了本国的东方贸易。"
 STATIC_MODIFIER_NAME_oe_weu2_atlantic_league_mod: "大西洋同盟"
 STATIC_MODIFIER_DESC_oe_weu2_atlantic_league_mod: "为了对付大洋彼岸的新对手，各国暂时放下了彼此的争端。"
 STATIC_MODIFIER_NAME_oe_weu2_shipyard_synergy_mod: "船坞产业之利"
 STATIC_MODIFIER_DESC_oe_weu2_shipyard_synergy_mod: "扶持船坞产业带来的收益。"
 STATIC_MODIFIER_NAME_oe_weu2_full_ai_mod: "西欧强邻"
 STATIC_MODIFIER_DESC_oe_weu2_full_ai_mod: "规则“强化电脑对手”给予的加成。"
