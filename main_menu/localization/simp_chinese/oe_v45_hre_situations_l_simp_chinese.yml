l_simp_chinese:
 oe_sit_v45_hre_golden_bull: "黄金诏书与选帝侯宪制"
 oe_sit_v45_hre_golden_bull_desc: "公元1345至1410年间，神圣罗马皇帝、七大选帝侯、帝国自由市与各邦诸侯围绕《黄金诏书》根本宪典展开激烈博弈，决定中欧帝国未来走向皇权至上抑或选侯共治。"
 oe_v45_hre_bull_out_imperial: "黄金诏书皇权至上"
 oe_v45_hre_bull_out_imperial_desc: "成文化的《黄金诏书》确立了罗马皇帝的司法主导权、境内和平令执行力与加冕至尊威望，令帝国皇权大振。"
 oe_v45_hre_bull_out_electoral: "选帝侯与诸侯自治宪制"
 oe_v45_hre_bull_out_electoral_desc: "严密的《选举宣誓书》与不可分割的选侯特权铸就了诸侯与自由市共治帝国的宪政基石。"
 oe_v45_hre_bull_out_compromise: "纽伦堡—梅斯宪制妥协"
 oe_v45_hre_bull_out_compromise_desc: "至公元1410年，围绕《黄金诏书》的宪政角力在皇帝尊荣与诸侯特权之间达成务实平衡。"
 oe_v45_hre_map_emperor_tt: "#Y 神圣罗马皇帝#!：执掌罗马皇冠与帝国境内和平令的最高宗主。"
 oe_v45_hre_map_elector_tt: "#Y 帝国选帝侯#!：执掌罗马人之王选票的七大帝国支柱之一。"
 oe_v45_hre_map_free_city_tt: "#Y 帝国自由市#!：直属皇帝管辖的自治工商业名城。"
 oe_v45_hre_map_prince_tt: "#Y 帝国诸侯#!：在皇权与诸侯自治间纵横权衡的帝国成员邦。"
 oe_sit_v45_hre_imperial_diet: "帝国永恒议会与帝国大改革"
 oe_sit_v45_hre_imperial_diet_desc: "公元1470至1600年间，皇帝与诸阶层齐聚沃尔姆斯、奥格斯堡、纽伦堡与雷根斯堡，致力缔造帝国最高法院、普通便士税、十大行政大区与雷根斯堡永恒议会等常设联邦制度。"
 oe_v45_hre_diet_out_reform: "帝国大改革全面落成"
 oe_v45_hre_diet_out_reform_desc: "帝国最高法院、十大行政大区与常设议会成功将神圣罗马帝国锻造为法治严明、运转高效的联邦宪政共同体。"
 oe_v45_hre_diet_out_federation: "雷根斯堡永恒议会联邦"
 oe_v45_hre_diet_out_federation_desc: "雷根斯堡永恒议会作为中欧常驻使节国会稳固存续，以法理外交协调诸侯与自由市纷争。"
 oe_v45_hre_diet_out_particularism: "邦国分立与地方自固"
 oe_v45_hre_diet_out_particularism_desc: "至公元1600年，各邦抵制统一税制令帝国大改革未能尽功，诸侯与城市转而专注强化自身邦国治理。"
 oe_v45_hre_diet_map_emperor_tt: "#Y 帝国皇冠#!：主持帝国大改革与永恒议会宪政议程的中枢。"
 oe_v45_hre_diet_map_elector_tt: "#Y 选帝侯院#!：左右帝国立法与财政决议的议会首席院。"
 oe_v45_hre_diet_map_free_city_tt: "#Y 自由市院#!：承办帝国议会并维系商路金融命脉的自治城邦。"
 oe_v45_hre_diet_map_circle_tt: "#Y 帝国行政大区成员#!：参与十大行政大区联防与最高法院司法的邦国。"
 oe_sit_v45_hre_confessional_leagues: "帝国教派同盟与宗教和约"
 oe_sit_v45_hre_confessional_leagues_desc: "公元1555至1655年间，宗教改革将神圣罗马帝国划分为天主教同盟、新教福音同盟与温和调停诸侯三大阵营，中欧在威斯特伐利亚宗教对等和约与全面教派大战之间步履维艰。"
 oe_v45_hre_confess_out_westphalia: "威斯特伐利亚教派对等和约"
 oe_v45_hre_confess_out_westphalia_desc: "明斯特与奥斯纳布吕克双城和会确立天主教与新教在帝国内部的法理对等，开启近代国际外交新纪元。"
 oe_v45_hre_confess_out_militant: "教派同盟铁血决胜"
 oe_v45_hre_confess_out_militant_desc: "针锋相对的武装同盟动员压倒了外交妥协，锻造出精锐铁军却也在德意志大地上留下深重信仰裂痕。"
 oe_v45_hre_confess_out_augsburg: "奥格斯堡疲敝休战"
 oe_v45_hre_confess_out_augsburg_desc: "至公元1655年，持续百年的教派竞逐渐归疲敝，各邦在属地信仰惯例下步入漫长休养生息。"
 oe_v45_hre_confess_map_catholic_tt: "#Y 天主教同盟邦国#!：奉行罗马天主教并支持旧教防务阵线的帝国领地。"
 oe_v45_hre_confess_map_protestant_tt: "#Y 新教福音同盟邦国#!：捍卫路德宗与归正宗信仰自由的新教诸侯或自由市。"
 oe_v45_hre_confess_map_conciliatory_tt: "#Y 温和调停诸侯#!：力主“教随国定”妥协与威斯特伐利亚和平斡旋的帝国邦国。"
 oe_sit_v45_hre_austro_prussian_dualism: "奥普双雄争霸与帝国黄昏"
 oe_sit_v45_hre_austro_prussian_dualism_desc: "公元1740至1820年间，哈布斯堡奥地利、霍亨索伦勃兰登堡—普鲁士与“第三德意志”中等邦国围绕西里西亚、《国事诏书》、领地大整并与千年神圣罗马皇冠的存废展开终极争锋。"
 oe_v45_hre_dual_out_habsburg: "哈布斯堡皇冠中兴"
 oe_v45_hre_dual_out_habsburg_desc: "维也纳成功整合帝国枢密机构与多瑙河雄师，击退北方挑战并令千年神圣罗马皇冠在近代重焕荣光。"
 oe_v45_hre_dual_out_prussia: "霍亨索伦北德霸权"
 oe_v45_hre_dual_out_prussia_desc: "军区铁律与冷峻韬略将勃兰登堡—普鲁士推上北德霸主宝座，彻底打破哈布斯堡数世纪的独尊格局。"
 oe_v45_hre_dual_out_twilight: "旧帝国黄昏与主权邦国"
 oe_v45_hre_dual_out_twilight_desc: "领地大整并与时代巨浪为千年神圣罗马旧制画上庄严句点，近代化的德意志诸邦正式步入主权国家新纪元。"
 oe_v45_hre_dual_map_habsburg_tt: "#Y 哈布斯堡皇权阵营#!：以维也纳与罗马皇冠为核心、捍卫《国事诏书》的帝国势力。"
 oe_v45_hre_dual_map_prussia_tt: "#Y 霍亨索伦北方强权#!：厉行军区征兵与铁血改革、角逐北德霸权的勃兰登堡—普鲁士。"
 oe_v45_hre_dual_map_third_germany_tt: "#Y 第三德意志中等邦国#!：在维也纳与柏林之间纵横捭阖、谋求宪制均势的德意志诸邦。"
 hint_oe_sit_v45_hre_golden_bull: "[GetSituationByKey('oe_sit_v45_hre_golden_bull').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_golden_bull_hint_text: "#T 局势概览#!\n@hint! #Y 《黄金诏书与选帝侯宪制》#! 于 #Y 1345–1410年#! 间在神圣罗马帝国存续时触发。数据地图以金色标示皇帝、深红标示选帝侯、青蓝标示自由市、琥珀标示诸侯。通过5项专属互动推进 #Y 宪制天平#!（-100选侯自治至+100皇权至上）并将 #Y 金印编纂度#! 提至70以上即可锁定终局。"
 hint_oe_sit_v45_hre_golden_bull_administrative: "推行帝国境内和平令与敕保自由市自治权，可在稳步提升金印编纂度的同时夯实帝国商路税源与控制力。"
 hint_oe_sit_v45_hre_golden_bull_diplomatic: "若扮演皇帝，可通过编纂七大选帝侯宪章与召开法兰克福加冕议会将天平推至+65并收获额外帝国权威；若扮演选帝侯或诸侯，则可宣示选举宣誓书将天平拉向-65以赢得选侯自治结局。"
 hint_oe_sit_v45_hre_golden_bull_military: "维系帝国内部和平将使金印编纂度按月自然增长；反之若皇位长期空缺，宪制天平将迅速倒向选侯自治。"
 hint_oe_sit_v45_hre_imperial_diet: "[GetSituationByKey('oe_sit_v45_hre_imperial_diet').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_imperial_diet_hint_text: "#T 局势概览#!\n@hint! #Y 《帝国永恒议会与帝国大改革》#! 跨越 #Y 1470–1600年#!。追踪 #Y 帝国大改革势头#!（0..100）与 #Y 议会共识度#!（0..100），围绕帝国最高法院、普通便士税、十大行政大区与雷根斯堡永恒议会塑造帝国联邦体制。"
 hint_oe_sit_v45_hre_imperial_diet_administrative: "开征普通便士税可大幅拉升改革势头（+16）并充实国库，但会折损议会共识（-6）；宜搭配帝国最高法院与雷根斯堡永恒议会以将共识稳守在55以上。"
 hint_oe_sit_v45_hre_imperial_diet_diplomatic: "非皇帝邦国可递交诸阶层陈情书以提升国内稳定与议会共识，并抑制过度中央集权，引导帝国走向联邦共治。"
 hint_oe_sit_v45_hre_imperial_diet_military: "划编十大行政大区可为参与邦国提供显著城防与兵源加成，同时尽量避免皇帝长期陷入战争以防议会共识按月流失。"
 hint_oe_sit_v45_hre_confessional_leagues: "[GetSituationByKey('oe_sit_v45_hre_confessional_leagues').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_confessional_leagues_hint_text: "#T 局势概览#!\n@hint! #Y 《帝国教派同盟与宗教和约》#! 跨越 #Y 1555–1655年#!。数据地图清晰区分天主教同盟（深红）、新教福音同盟（深蓝）与温和调停诸侯（金色）。通过互动左右 #Y 教派对峙张力#!（-100..+100）与 #Y 威斯特伐利亚和谈进度#!（0..100）。"
 hint_oe_sit_v45_hre_confessional_leagues_administrative: "颁行“教随国定”与斡旋威斯特伐利亚和会可换取丰厚的异端容忍、繁荣度与科研速度，代价仅是宗教改宗速度放缓。"
 hint_oe_sit_v45_hre_confessional_leagues_diplomatic: "将威斯特伐利亚和谈推至85（或在1595年后将教派张力降至-60以下）即可达成教派对等和约，斩获+6帝国权威与长达40年的外交文化黄金期。"
 hint_oe_sit_v45_hre_confessional_leagues_military: "筹建天主教同盟金库、结集新教福音同盟或强制执行教会保留条款可换取强力陆军加成，但会将教派张力推向+85并触发铁血教派霸权结局。"
 hint_oe_sit_v45_hre_austro_prussian_dualism: "[GetSituationByKey('oe_sit_v45_hre_austro_prussian_dualism').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_austro_prussian_dualism_hint_text: "#T 局势概览#!\n@hint! #Y 《奥普双雄争霸与帝国黄昏》#! 跨越 #Y 1740–1820年#!。数据地图以金色标示哈布斯堡奥地利与皇冠、普鲁士蓝标示霍亨索伦勃兰登堡—普鲁士、翠绿标示第三德意志中等邦国。围绕 #Y 奥普双雄天平#!（-100..+100）与 #Y 旧帝国完整度#!（0..100）展开终极博弈。"
 hint_oe_sit_v45_hre_austro_prussian_dualism_administrative: "推行领地整并改革可大幅提升控制力、整合速度与税收效率，但每次施行都会削弱旧帝国完整度（-10），加速中世纪帝国步入黄昏。"
 hint_oe_sit_v45_hre_austro_prussian_dualism_diplomatic: "维也纳阵营借《国事诏书》担保与皇冠革新将天平推至+70且完整度守在50以上即可赢得哈布斯堡中兴；第三德意志邦国则可凭诸侯同盟护持完整度并制衡双雄。"
 hint_oe_sit_v45_hre_austro_prussian_dualism_military: "勃兰登堡—普鲁士可结合军区征兵动员与皇冠裁断将双雄天平压至-70以成就霍亨索伦北德霸权；而奥普直接交战将令旧帝国法统完整度按月飞速流失。"
 OE_V45_HRE_BULL_HDR_L: "帝国宪制天平"
 OE_V45_HRE_BULL_HDR_R: "金印宪典编纂度"
 OE_V45_HRE_BULL_CARD_TITLE: "《黄金诏书》与选帝侯宪制（1345–1410）"
 OE_V45_HRE_BULL_CARD_BODY: "罗马皇帝、七大选帝侯、帝国自由市与各邦诸侯围绕神圣罗马帝国根本宪典展开博弈。当金印编纂度达到70以上时，将宪制天平推向+65（皇权至上）或-65（选侯自治）即可一锤定音。"
 OE_V45_HRE_GAUGE_BULL_CONST: "选帝侯自治（-100） <-> 帝国皇权至上（+100）"
 OE_V45_HRE_GAUGE_BULL_CODIF: "《黄金诏书》成典推进度"
 OE_V45_HRE_DIET_HDR_L: "帝国大改革势头"
 OE_V45_HRE_DIET_HDR_R: "帝国议会诸阶层共识"
 OE_V45_HRE_DIET_CARD_TITLE: "帝国永恒议会与帝国大改革（1470–1600）"
 OE_V45_HRE_DIET_CARD_BODY: "兴建帝国最高法院、开征普通便士税、划编十大行政大区并敕立雷根斯堡永恒议会。改革势头达85且议会共识达55即可建成常设帝国大改革体系；诸侯亦可借陈情书捍卫地方自治。"
 OE_V45_HRE_GAUGE_DIET_MOMENTUM: "帝国大改革制度推进势头"
 OE_V45_HRE_GAUGE_DIET_CONSENSUS: "三院议会与诸阶层共识度"
 OE_V45_HRE_CONFESS_HDR_L: "教派对峙张力"
 OE_V45_HRE_CONFESS_HDR_R: "威斯特伐利亚和谈进度"
 OE_V45_HRE_CONFESS_CARD_TITLE: "帝国教派同盟与奥格斯堡—威斯特伐利亚和约（1555–1655）"
 OE_V45_HRE_CONFESS_CARD_BODY: "天主教同盟、新教福音同盟与温和调停诸侯激烈角力。将威斯特伐利亚和谈推至85（或1595年后将教派张力降至-60以下）即可缔结宗教对等和约；若张力飙升至+85则将步入铁血教派霸权。"
 OE_V45_HRE_GAUGE_CONFESS_TENSION: "宗教和解（-100） <-> 教派全面决裂（+100）"
 OE_V45_HRE_GAUGE_CONFESS_ACCORD: "奥格斯堡—威斯特伐利亚外交和解度"
 OE_V45_HRE_DUAL_HDR_L: "奥普双雄天平"
 OE_V45_HRE_DUAL_HDR_R: "旧帝国法统完整度"
 OE_V45_HRE_DUAL_CARD_TITLE: "奥普双雄争霸与神圣罗马帝国黄昏（1740–1820）"
 OE_V45_HRE_DUAL_CARD_BODY: "哈布斯堡维也纳、霍亨索伦柏林与“第三德意志”中等邦国在千年帝国的黄昏展开终极对决。将双雄天平推至+70且完整度达50可迎哈布斯堡中兴；推至-70则成就北德霸权；完整度跌破10或至1806年则步入领地整并与帝国黄昏。"
 OE_V45_HRE_GAUGE_DUAL_BALANCE: "北德普鲁士霸权（-100） <-> 哈布斯堡皇权（+100）"
 OE_V45_HRE_GAUGE_DUAL_INTEGRITY: "神圣罗马旧帝国法统存续度"
 oe_v45_hre_act_codify_seven_electorates: "编纂七大选帝侯金印宪章"
 oe_v45_hre_act_codify_seven_electorates_desc: "以《黄金诏书》正式确立七大选帝侯领地不可分割与法定多数选举制，大幅推进金印成典进度并提升帝国权威。"
 oe_v45_hre_act_codify_seven_electorates_tt: "金印编纂度 #G +14#!，帝国权威 #G +3#!；若由皇帝推行则使宪制天平向皇权倾斜，若由选帝侯推行则向选侯自治倾斜。"
 oe_v45_hre_act_guarantee_free_cities: "敕保帝国自由市特许自治权"
 oe_v45_hre_act_guarantee_free_cities_desc: "确认士瓦本、法兰克尼亚与莱茵诸帝国自由市的直属地位、行会自治与免税集市宪章，振兴帝国商贸网络。"
 oe_v45_hre_act_guarantee_free_cities_tt: "金印编纂度 #G +10#!，并依据主导方推动宪制天平（皇帝+8 / 自由市或诸侯-6）。"
 oe_v45_hre_act_territorial_landfriede: "颁行帝国境内和平令（兰德弗里德）"
 oe_v45_hre_act_territorial_landfriede_desc: "在帝国各大官道颁行宣誓公和平令以弹压私斗与劫掠骑士，巩固地方治安控制并强化皇权法度。"
 oe_v45_hre_act_territorial_landfriede_tt: "宪制天平向皇权倾斜 #G +10#!，金印编纂度 #G +12#!，帝国权威 #G +3#!。"
 oe_v45_hre_act_princely_capitulation: "宣示选帝侯与诸侯选举宣誓书"
 oe_v45_hre_act_princely_capitulation_desc: "要求未来罗马人之王签署具约束力的选举宣誓书，明确保障诸侯关税、司法豁免与邦国自治特权。"
 oe_v45_hre_act_princely_capitulation_tt: "宪制天平向选侯自治倾斜 #Y -14#!，金印编纂度 #G +10#!。"
 oe_v45_hre_act_frankfurt_coronation_diet: "召开法兰克福加冕帝国大议会"
 oe_v45_hre_act_frankfurt_coronation_diet_desc: "召集帝国掌玺诸大公与各邦代表齐聚法兰克福与亚琛，隆重确立选帝加冕仪制并推动《黄金诏书》终稿落印。"
 oe_v45_hre_act_frankfurt_coronation_diet_tt: "金印编纂度 #G +16#!，帝国权威 #G +4#!，并依据主持方推动宪制天平（皇帝+10 / 选帝侯-8）。"
 oe_v45_hre_act_reichskammergericht: "设立帝国最高法院（帝国枢密法庭）"
 oe_v45_hre_act_reichskammergericht_desc: "颁敕建立独立于君主私庭的帝国最高法院，以罗马法理裁断各邦疆界与城市争端，大力推动帝国大改革。"
 oe_v45_hre_act_reichskammergericht_tt: "帝国大改革势头 #G +14#!，议会共识度 #G +8#!，帝国权威 #G +3#!。"
 oe_v45_hre_act_common_penny_tax: "开征帝国“普通便士”统一防务税"
 oe_v45_hre_act_common_penny_tax_desc: "向全帝国臣民与邦国摊派普通便士统一税款以充实国防与司法财政，强力提速大改革，却也令诸阶层颇有微词。"
 oe_v45_hre_act_common_penny_tax_tt: "帝国大改革势头 #G +16#!，帝国权威 #G +4#!，议会共识度 #R -6#!。"
 oe_v45_hre_act_imperial_circles: "划编帝国十大行政大区（莱希克赖斯）"
 oe_v45_hre_act_imperial_circles_desc: "将全帝国诸侯与自由市编组为协同防务与财政监察的十大行政大区，全面夯实联邦国防与大改革根基。"
 oe_v45_hre_act_imperial_circles_tt: "帝国大改革势头 #G +14#!，议会共识度 #G +10#!，帝国权威 #G +3#!。"
 oe_v45_hre_act_regensburg_perpetual_diet: "敕建雷根斯堡帝国永恒议会"
 oe_v45_hre_act_regensburg_perpetual_diet_desc: "将临时召集的帝国会议改制为常驻雷根斯堡的三院常设使节议会，令选帝侯、诸侯与自由市共商国是。"
 oe_v45_hre_act_regensburg_perpetual_diet_tt: "帝国大改革势头 #G +12#!，议会共识度 #G +14#!，帝国权威 #G +3#!。"
 oe_v45_hre_act_estates_gravamina: "申诉帝国诸阶层陈情书（格拉瓦米纳）"
 oe_v45_hre_act_estates_gravamina_desc: "在帝国议会正式递交诸阶层陈情书，捍卫邦国传统特权并遏止皇室单方面集权征税。"
 oe_v45_hre_act_estates_gravamina_tt: "议会共识度 #G +14#!，同时使中央化大改革势头放缓 #Y -10#!。"
 oe_v45_hre_act_cuius_regio: "颁行“教随国定”宗教妥协法案"
 oe_v45_hre_act_cuius_regio_desc: "宣示奉行奥格斯堡“教随国定”原则并保障异教臣民体面迁徙权，大幅缓和教派对峙张力并将本邦列为调停诸侯。"
 oe_v45_hre_act_cuius_regio_tt: "教派张力 #G -14#!，威斯特伐利亚和谈进度 #G +14#!，并将本邦在地图上标示为温和调停诸侯。"
 oe_v45_hre_act_catholic_league_treasury: "筹建天主教同盟战备金库"
 oe_v45_hre_act_catholic_league_treasury_desc: "汇集巴伐利亚、奥地利与莱茵教会诸侯军资建立天主教同盟战备金库，武装捍卫旧教法统，急剧推升教派对峙张力。"
 oe_v45_hre_act_catholic_league_treasury_tt: "教派张力 #R +16#!，威斯特伐利亚和谈进度 #R -6#!，并动员天主教同盟野战精兵。"
 oe_v45_hre_act_evangelical_union: "结集新教福音同盟军备"
 oe_v45_hre_act_evangelical_union_desc: "联合路德宗与归正宗诸侯及自由市组建宣誓防务同盟，统筹火炮工坊与军费，强势抗衡旧教压力。"
 oe_v45_hre_act_evangelical_union_tt: "教派张力 #R +16#!，威斯特伐利亚和谈进度 #R -6#!，并大幅提振新教同盟战备。"
 oe_v45_hre_act_westphalian_congress: "斡旋明斯特与奥斯纳布吕克双城和会"
 oe_v45_hre_act_westphalian_congress_desc: "在明斯特与奥斯纳布吕克同步主持天主教与新教使团谈判，起草威斯特伐利亚宗教对等与主权和约。"
 oe_v45_hre_act_westphalian_congress_tt: "教派张力 #G -18#!，威斯特伐利亚和谈进度 #G +18#!，帝国权威 #G +3#!。"
 oe_v45_hre_act_ecclesiastical_reservation: "严格执行教会领地保留条款"
 oe_v45_hre_act_ecclesiastical_reservation_desc: "动用帝国敕令严禁选侯大主教领与主教领被世俗化改宗，维护皇权与教会产业，却令教派摩擦骤然加剧。"
 oe_v45_hre_act_ecclesiastical_reservation_tt: "教派张力 #R +14#!，条约法理界定 #G +4#!，帝国权威 #G +3#!。"
 oe_v45_hre_act_pragmatic_sanction: "担保《国事诏书》哈布斯堡继承权"
 oe_v45_hre_act_pragmatic_sanction_desc: "争取帝国议会与欧陆列强共同担保《国事诏书》的不可分割继承权，强力稳固维也纳皇权优势与旧帝国完整度。"
 oe_v45_hre_act_pragmatic_sanction_tt: "双雄天平向哈布斯堡皇权倾斜 #G +16#!，旧帝国完整度 #G +10#!，帝国权威 #G +4#!。"
 oe_v45_hre_act_prussian_cantonal: "推行普鲁士军区征兵动员制"
 oe_v45_hre_act_prussian_cantonal_desc: "全面施行军区编户征兵制与铁血步兵操典，打造纪律冠绝欧陆的北德劲旅，猛烈将双雄天平扭向北方霸权。"
 oe_v45_hre_act_prussian_cantonal_tt: "双雄天平向北德霸权倾斜 #Y -16#!，旧帝国法统完整度 #R -6#!。"
 oe_v45_hre_act_third_germany_league: "缔结“第三德意志”诸侯同盟（菲尔斯滕邦德）"
 oe_v45_hre_act_third_germany_league_desc: "联络巴伐利亚、萨克森、汉诺威与符腾堡等中等邦国结成诸侯自保同盟，在奥普夹缝中维护帝国宪制均衡。"
 oe_v45_hre_act_third_germany_league_tt: "抑制哈布斯堡独大（双雄天平 #Y -8#!），同时显著稳固旧帝国宪制完整度 #G +12#!。"
 oe_v45_hre_act_imperial_mediatization: "推行《帝国代表团主要决议》领地整并"
 oe_v45_hre_act_imperial_mediatization_desc: "整并零碎教会飞地与微小封建领主，构建近代理性化邦国版图与税制，却也深刻动摇了旧帝国的中世纪根基。"
 oe_v45_hre_act_imperial_mediatization_tt: "旧帝国完整度 #R -10#!，双雄天平依推行者偏移（皇帝/奥地利+8，他邦-8），大幅强化本国行政整合。"
 oe_v45_hre_act_dissolve_or_renew_crown: "裁断神圣罗马皇冠的革新与存废"
 oe_v45_hre_act_dissolve_or_renew_crown_desc: "启动千年神圣罗马皇冠的终极宪制裁断：由维也纳主导则力挽狂澜重振皇冠与完整度，由柏林或诸侯主导则加速旧帝国解构。"
 oe_v45_hre_act_dissolve_or_renew_crown_tt: "决定性推动双雄天平与帝国完整度（皇帝/奥地利各+14且帝国权威+5；普鲁士/挑战者则各-14加速旧制瓦解）。"
 oe_v45_hre.1.title: "纽伦堡七印金诏"
 oe_v45_hre.1.desc: "在寒风猎猎的纽伦堡城堡大厅内，帝国法学家将三十一章拉丁文宪典草案与沉甸甸的纯金印玺呈于诸侯与大主教案前。数代以来，每次先皇驾崩后频发的双帝并立、教廷干预批准与莱茵河畔的内战早已令德意志遍体鳞伤。如今御前枢密院提议以《黄金诏书》明文锁定七大选帝侯席位，规定选侯领地行长子继承制而永不分割，并确立在法兰克福多数票当选即具合法效力而毋须外部核准——然而满座王公暗自思忖：这份金印究竟是在重铸罗马皇帝的至尊权威，还是在为七大选侯永固寡头割据的法统？"
 oe_v45_hre.1.a: "强化皇帝对选帝程序与加冕宣誓的法理主导权。"
 oe_v45_hre.1.b: "全面确认七大选帝侯的矿税专卖、铸币权与终审豁免特权。"
 oe_v45_hre.1.c: "在金诏中写入皇权与选帝侯团对等互保条款，谋求宪制折中。"
 oe_v45_hre.2.title: "士瓦本与莱茵自由市同盟的请愿"
 oe_v45_hre.2.desc: "来自乌尔姆、奥格斯堡、纽伦堡、法兰克福与施派尔的富商代表团身着天鹅绒长袍步入御前，呈上厚厚的白银关税账簿与联名急疏。因忧惧囊中羞涩的君主将帝国自由市典押给周边公爵，数十座自治城邦已暗中结成士瓦本与莱茵城市同盟，并自筹弩手民兵与雇佣长矛队守望相助。各地领地诸侯怒斥城市结盟公然违背《黄金诏书》禁结私党之律，而城市执政官则据理力争：唯有保全自由市免遭典押与兼并，帝国的商道集市、手工业行会与白银信贷方能长盛不衰。"
 oe_v45_hre.2.a: "下诏严禁典押帝国自由市，以皇权直辖护佑商道自治。"
 oe_v45_hre.2.b: "勒令解散武装城市同盟，安抚领地诸侯与选帝侯阶层。"
 oe_v45_hre.2.c: "设立城市与诸侯共治的莱茵—多瑙河关税仲裁庭。"
 oe_v45_hre.3.title: "莱茵劫掠骑士与帝国境内和平令"
 oe_v45_hre.3.desc: "在莱茵河、美因河与内卡河两岸的险峻崖堡之间，家道中落的小骑士阶层竟将中世纪传统“私斗宣战权”异化为明目张胆的官道勒索。驶往法兰克福复活节大集市的商队频频在非法收税城堡下遭伏，商人被迫重金雇佣武装护卫，而缺乏直属兵力的帝国法官面对满案诉状竟束手无策。眼下主教、诸侯与城市议会一致呼吁颁行铁腕《帝国境内和平令》，组建骑兵巡防队踏平匪巢，但各方又彼此提防，唯恐常设执法兵权落入政敌手中。"
 oe_v45_hre.3.a: "任命帝国和平令专使发兵拔除非法收税城堡，以皇法立威。"
 oe_v45_hre.3.b: "将治安执法与缉匪之权下放予各邦诸侯与地方议会自行裁处。"
 oe_v45_hre.3.c: "招抚落魄骑士编入官饷商道护卫队，化匪为兵护卫集市。"
 oe_v45_hre.4.title: "伦斯选侯盟约与选举宣誓博弈"
 oe_v45_hre.4.desc: "在莱茵河畔四大选侯疆界交汇的伦斯“王者石座”核桃林下，美因茨、科隆、特里尔三大教宗选侯与普法尔茨、萨克森、勃兰登堡、波希米亚四大世俗选侯使团肃穆会盟。他们以“帝国七大支柱”自居，坚称未经选帝侯团事先同意，任何君主皆不得割让帝国采邑、加征非常税赋或以帝国名义兴兵。皇室枢密顾问急谏称，若签署书面《选举宣誓书》，罗马皇帝恐将沦为诸侯间的“平等首席”；但若强硬抗拒七大选侯，下届皇位选举势必陷入宪政僵局。"
 oe_v45_hre.4.a: "断然拒绝苛刻宣誓条款，重申皇帝对帝国采邑的直接处置权。"
 oe_v45_hre.4.b: "庄严签署《选举宣誓书》，以成文宪章保障选帝侯与诸侯自由。"
 oe_v45_hre.4.c: "改设轮流于帝国名城召开的选帝侯年度例会，以共议代对抗。"
 oe_v45_hre.5.title: "法兰克福大钟与亚琛查理曼王冠"
 oe_v45_hre.5.desc: "法兰克福圣巴塞洛缪大教堂的钟声响彻云霄，纹章号角在罗马人广场上礼迎帝国七大掌职官共赴加冕御宴。自手捧银印的德意志大掌玺官、高擎帝国宝剑的大元帅，到斟满法兰克尼亚美酒的大司酒官，每一项庄严仪轨皆彰显出自1345年以来铸就的帝国宪制尊荣。当各国使节与朝圣人潮护送帝国圣器启程前往亚琛、仰望查理曼大理石御座之际，朝野上下必须决断：这座焕然一新的帝国法统在未来百年将秉持何种精神前行？"
 oe_v45_hre.5.a: "宣诏罗马皇冠对德意志全境拥有不可分割之至尊法统。"
 oe_v45_hre.5.b: "昭告帝国乃选帝侯、诸侯与自由市共治之联邦兄弟盟约。"
 oe_v45_hre.5.c: "资助布拉格、维也纳与海德堡大学法学院，培育通晓帝国宪典的法学家。"
 oe_v45_hre.6.title: "沃尔姆斯帝国议会与永恒和平"
 oe_v45_hre.6.desc: "在沃尔姆斯高耸的哥特式穹顶下，大主教选侯、世俗公爵与自由市律政官齐聚一堂，拉开帝国史上最具雄心的宪政改革大幕。面对西方强盛王权与沿多瑙河西进的劲敌，改革派政治家痛陈中世纪封建征召已难保德意志周全。他们郑重提出颁布永久废除私斗的《永恒境内和平令》，并设立由精研罗马法的法学博士坐镇、独立于君主私庭的帝国最高法院——要求皇帝与诸侯今后皆以成文司法取代兵戎相见，令帝国迈入近代宪政新局。"
 oe_v45_hre.6.a: "批准《永恒和平令》并重资充实帝国最高法院常设法官席位。"
 oe_v45_hre.6.b: "坚持由皇帝独揽大法官任命权，牢牢掌控终审司法中枢。"
 oe_v45_hre.6.c: "为选帝侯与大公国保留领地内初审与部分终审豁免条款。"
 oe_v45_hre.7.title: "帝国“普通便士税”的征稽风波"
 oe_v45_hre.7.desc: "帝国税吏方才携税册出发征收史无前例的全国性财产人头税——“普通便士税”，抗议浪潮便自阿尔卑斯山麓席卷至北海诸港。帝国自由骑士怒称贵族当以长矛鲜血效命而非缴纳贱民铜币，自由市抱怨商贾账簿惨遭双重盘剥而诸侯领地却屡屡虚报家产，各地邦议会更扣押税款、要求先获得审核每一枚弗罗林金币去向的监督权。然而一旦缺乏稳定财源，刚成立的帝国最高法院与边疆联防驻军都将面临难以为继的断饷危机。"
 oe_v45_hre.7.a: "由法兰克福帝国国库司严格统一催缴，立下全国税制铁规。"
 oe_v45_hre.7.b: "改采按《帝国兵役税籍册》由各邦国库自行分摊军费与兵员配额。"
 oe_v45_hre.7.c: "暂缓直接人头税征收，改以临时商路关税与自愿捐输救济边防。"
 oe_v45_hre.8.title: "帝国十大行政大区与协同防务蓝图"
 oe_v45_hre.8.desc: "制图师在帝国议会长桌上铺开一幅恢宏的中欧疆域图，将数百个犬牙交错的公国、主教领、伯国与自由市悉数划编为十大行政大区——自士瓦本、法兰克尼亚、巴伐利亚直至上萨克森、下莱茵—威斯特伐利亚与奥地利。各大区将自设区议会并推举大区督军，负责强制执行最高法院判决、稽查银币成色以防劣币横行，并在外敌犯境时统一征调联军。中小邦国视行政大区为抵御强邻吞并的护身符，而各大王室亦在盘算如何借督军之职执掌区域牛耳。"
 oe_v45_hre.8.a: "赋予十大行政大区督军常设军械库与统一铸币稽查之权。"
 oe_v45_hre.8.b: "令行政大区专司统一银币成色、度量衡标准与跨邦商道修筑。"
 oe_v45_hre.8.c: "将行政大区议会限定为咨议协调机构，保留诸侯完整兵权。"
 oe_v45_hre.9.title: "雷根斯堡永恒议会与三院宪政格局"
 oe_v45_hre.9.desc: "在雷根斯堡旧市政厅木构穹顶的帝国大厅内，一场史无前例的制度蜕变正在成形：选帝侯院、诸侯院与帝国自由市院三院使节不再于几周耗资巨大的御前盛会后便草草散场，而是长年常驻此地，全年不间断地审议条约、税额与帝国律令。批评者讥讽议会充斥着冗长羊皮纸公文与围绕红丝绒座椅座次的繁文缛节，但老练的外交家却深知，这座永不落幕的联邦使节议会，正为林立纷繁的德意志邦国锻造出全欧罕见的常设宪政平台与协调机制。"
 oe_v45_hre.9.a: "赋予帝国自由市院与选帝侯院、诸侯院对等的表决与立宪权。"
 oe_v45_hre.9.b: "派驻皇帝首席全权专员统辖三院议程，强化中央法政主导。"
 oe_v45_hre.9.c: "规定一切帝国新法皆须经选帝侯院一致同意方可生效。"
 oe_v45_hre.10.title: "帝国诸阶层陈情书与骑士团之怨"
 oe_v45_hre.10.desc: "一捆捆加盖火漆的《陈情书》——囊括宪政、财税与教会积弊的正式申诉——在帝国议会书记官案头堆积如山。各地领地阶层抗议皇室屡屡为域外王朝私利卷入战火，帝国直属骑士痛陈火器步兵与邦国官僚正逐步吞噬他们世代相传的自由地位，而城市市民代表则猛烈抨击教廷法庭规费将德意志白银源源不断输往阿尔卑斯山以南。帝国如何回应这些来自四面八方的呼声，将直接决定大改革究竟能赢得全境衷心拥护，还是在各阶层杯葛中功亏一篑。"
 oe_v45_hre.10.a: "颁行《帝国议会决议录》，以财政公开与限权承诺正面回应陈情。"
 oe_v45_hre.10.b: "特许帝国骑士组建直属皇室的自主骑士团区，制衡割据诸侯。"
 oe_v45_hre.10.c: "将棘手陈情悉数驳回各邦诸侯法庭自行处置，以免议会失控。"
 oe_v45_hre.11.title: "奥格斯堡宗教和约与“教随国定”"
 oe_v45_hre.11.desc: "在奥格斯堡富丽堂皇的商贾大厅内，筋疲力尽的天主教与路德宗全权代表终于敲定一项足以载入史册的妥协法案，试图为德意志数十年宗教流血画上休止符。依据“教随国定”原则，各主权诸侯皆有权在自家疆界内确立罗马天主教或奥格斯堡信条为公教，而信仰不同的臣民亦依法享有变卖产业、平安迁徙他邦之权。然而这份羊皮纸和约仍暗藏两处致命隐患：归正宗新教邦国被排斥在合法保护伞之外，而归属未决的主教领地更如遍布帝国的火药桶，稍有火星便将引燃滔天巨变。"
 oe_v45_hre.11.a: "在双教派共居自由市设立对等市政议席，拓宽宗教和解基石。"
 oe_v45_hre.11.b: "严守奥格斯堡条文字面界限，断然拒绝扩大其他教派特权。"
 oe_v45_hre.11.c: "暗中资助神学院与教派防务密约，为日后信仰决战未雨绸缪。"
 oe_v45_hre.12.title: "教会保留条款与科隆选帝侯风波"
 oe_v45_hre.12.desc: "一道宪政惊雷骤然劈落莱茵兰：一位在任的选侯大主教公开皈依新教，却拒绝交出大教堂选侯领地，企图将这座古老的教会选帝侯国改制为世袭新教公国。天主教诸侯立时援引《教会领地保留条款》——凡改宗之主教须自动放弃领地——皆因一旦科隆易帜，选帝侯团的多数席位便将永久倒向新教阵营！新教法学家则反唇相讥，称保留条款本是皇室强行附加而未经诸侯一致认可。转瞬之间，莱茵河两岸战鼓雷动，整个帝国的选帝平衡危如累卵。"
 oe_v45_hre.12.a: "动用巴伐利亚与帝国联军强制执行教会保留条款，保卫旧教选侯席位。"
 oe_v45_hre.12.b: "否认保留条款效力，支持新教诸侯接管世俗化主教领地。"
 oe_v45_hre.12.c: "由大教堂圣职团与各方斡旋折中人选，竭力维系选侯席位均势。"
 oe_v45_hre.13.title: "多瑙沃特事变与双教派武装同盟"
 oe_v45_hre.13.desc: "一场原本发生于新教占多数的帝国自由市多瑙沃特街头的天主教圣体游行冲突，竟迅速演变为席卷全帝国的宪政大分裂。随着该城遭到帝国放逐令制裁并被巴伐利亚军队接管，雷根斯堡议会中的新教诸侯彻底认定帝国司法已不再公正。短短数月间，普法尔茨选侯便牵头组建武装“新教福音同盟”，巴伐利亚公爵亦针锋相对成立“天主教同盟”予以回击——整座神圣罗马帝国骤然撕裂为剑拔弩张的两大军事阵营，只待一粒火星便将引爆欧陆浩劫。"
 oe_v45_hre.13.a: "高举教派同盟战旗，紧急囤积火药军械以备决战。"
 oe_v45_hre.13.b: "仿效萨克森稳健路线组建中立调停党，拒入任何武装教派同盟。"
 oe_v45_hre.13.c: "交由帝国行政大区联合仲裁团恢复多瑙沃特自由市宪章以平息众怒。"
 oe_v45_hre.14.title: "布拉格掷窗风潮与波希米亚雷霆"
 oe_v45_hre.14.desc: "惊惶失措的信使策马奔入德意志各大都城，带来布拉格赫拉德恰尼城堡的骇人剧变：因围绕保障新教礼拜自由的《皇帝敕令书》爆发激烈冲突，愤怒的波希米亚贵族阶层竟将皇室摄政大臣从枢密厅高窗掷出窗外！一夜之间，这场原本局限于波希米亚王冠领的争端，势将把天主教同盟、新教福音同盟乃至西班牙、丹麦、瑞典与法兰西尽数卷入席卷中欧的惨烈大战。帝国诸侯与自由市陷入残酷抉择：是趁乱投身烽火搏取信仰完胜，还是竭力灭火以防德意志沦为焦土？"
 oe_v45_hre.14.a: "立即挥师动员野战大军，以沙场决战定夺波希米亚与帝国乾坤。"
 oe_v45_hre.14.b: "向布拉格与维也纳共提宗教自由担保仲裁案，阻止域外列强介入。"
 oe_v45_hre.14.c: "加固本邦城防并宣布行政大区武装中立，静观波希米亚局势演变。"
 oe_v45_hre.15.title: "明斯特与奥斯纳布吕克双城和约"
 oe_v45_hre.15.desc: "历经数年往返于天主教和会驻地明斯特与新教和会驻地奥斯纳布吕克的艰苦穿梭谈判，逾百位全权外交官终于备齐火漆，准备为《威斯特伐利亚和约》郑重落印。条约草案正式承认天主教、路德宗与归正宗在帝国内部享有平等法理地位，以“基准年份”一劳永逸地划定教产归属，并在帝国宪政框架下确认各邦诸侯与自由市的领土主权。无论世人将其盛赞为近代国际法与欧洲均势外交的曙光，还是扼腕叹息普世基督教大一统的终结，中欧历史已然翻开崭新一页。"
 oe_v45_hre.15.a: "全盘签署《威斯特伐利亚和约》，确立三教派对等法统与全面大赦。"
 oe_v45_hre.15.b: "在签署和约的同时设立帝国战后复兴基金，赈济饱经战火的城镇农庄。"
 oe_v45_hre.15.c: "拒签妥协条款，坚持在战场上争取更具压倒性的信仰与领土胜果。"
 oe_v45_hre.16.title: "《国事诏书》与西里西亚闪电博弈"
 oe_v45_hre.16.desc: "维也纳皇宫鎏金镜廊内烛影摇曳，哈布斯堡王朝依据历尽千辛换来的《国事诏书》启动继承大典，宣告奥地利、波希米亚与匈牙利领地永不分割。然而欧陆列强在担保条约上的墨迹尚未干透，身着普鲁士深蓝军服、操练严酷的霍亨索伦精锐师团便已陈兵奥得河畔，虎视眈眈直指富庶的西里西亚亚麻城镇与矿脉！全德意志的选帝侯与自由市屏息凝望：古老的帝国秩序究竟能围绕维也纳岿然不动，还是将被骤然崛起的北方军事劲旅彻底击碎？"
 oe_v45_hre.16.a: "号召帝国议会与忠义诸侯驰援维也纳，全力捍卫《国事诏书》法统。"
 oe_v45_hre.16.b: "趁机在北方雷霆出击，打破哈布斯堡对帝国皇冠与中欧的垄断。"
 oe_v45_hre.16.c: "要求先召开选帝侯仲裁会议并获领土保障，再决定本邦站队。"
 oe_v45_hre.17.title: "军区征兵制与波茨坦铁血操典"
 oe_v45_hre.17.desc: "自波茨坦校场至马格德堡与柯尼斯堡演武坪，一台前所未见的近代军事机器令全欧军事观察家目瞪口呆。依托严密的军区编户征兵制，每一座贵族庄园与乡村教区皆固定向常备团输送兵源，士兵经年累月锤炼出倍速齐射与斜行翼侧突击绝技，令阵线如精密钟表般运转。维也纳与慕尼黑的宫廷大臣为此激烈争辩：究竟应当效法柏林大刀阔斧推行铁血军政税制，还是依托启蒙法典、多瑙河财赋与神圣罗马皇冠的深厚外交威望与之周旋？"
 oe_v45_hre.17.a: "全面引进军区征兵与斜行操典，以钢铁纪律重塑野战陆军。"
 oe_v45_hre.17.b: "推行开明专制式中央财税、教育与常设军务近代化大改革。"
 oe_v45_hre.17.c: "避免穷兵黩武，将国库重资投入启蒙学院、瓷器工坊与城市商贸。"
 oe_v45_hre.18.title: "诸侯同盟与“第三德意志”"
 oe_v45_hre.18.desc: "惊闻维也纳意图以遥远的奥属尼德兰置换巴伐利亚领地，又同样警惕霍亨索伦王朝在北德不断扩张，萨克森、汉诺威、美因茨、符腾堡、巴登与黑森诸邦毅然携手缔结“德意志诸侯同盟”（菲尔斯滕邦德）。作为文教璀璨、商贸兴旺的“第三德意志”中坚力量，这些中等邦国庄严宣告：神圣罗马帝国既非维也纳随意交换的私产，亦非柏林独霸的兵营，而是属于全体德意志邦国依法均衡共治的家园。奥普两强骤然醒悟，若失却慕尼黑、德累斯顿与魏玛的支持，谁也无法单方面重塑帝国版图。"
 oe_v45_hre.18.a: "力挺德意志诸侯同盟，以第三势力捍卫帝国宪制均衡与邦国自主。"
 oe_v45_hre.18.b: "向中等邦国选侯奉上优厚皇室担保与礼遇，重塑维也纳核心联盟。"
 oe_v45_hre.18.c: "吸纳北德诸邦加入以柏林为核心的关税协定与共同防务集团。"
 oe_v45_hre.19.title: "帝国代表团大决议与领地大整并"
 oe_v45_hre.19.desc: "雷根斯堡特别帝国代表团抛出八百年来最为激进的中欧版图重构方案：《帝国代表团主要决议》拟将古老的教会主教领与修道院领全面世俗化，并把数十座微小自由市与骑士采邑整并入较大的近代王国与大公国！一夜之间，长年支撑哈布斯堡选帝多数的教会选侯席位几乎化为乌有，维也纳骤然面对一个由野心勃勃的世俗强邦主宰的新德意志。然而改革派亦坦言，唯有终结三百余个中世纪碎片化领地的割据乱象，德意志方能积蓄国力以抵御革命浪潮与外敌铁骑。"
 oe_v45_hre.19.a: "大刀阔斧推行领地整并与教会世俗化，锻造高效近代邦国。"
 oe_v45_hre.19.b: "力保残存教会选侯与帝国自由市宪章，竭力延缓旧帝国法统解体。"
 oe_v45_hre.19.c: "以近代国家年金与文武官职妥善安抚失地主教与骑士，平稳过渡。"
 oe_v45_hre.20.title: "双头鹰的黄昏"
 oe_v45_hre.20.desc: "维也纳霍夫堡宫阳台与柏林、慕尼黑、法兰克福的枢密厅内一片肃穆，千年神圣罗马帝国的命运终于站上历史悬崖。革命风暴、反法同盟战火与长达数十年的奥普双雄对峙，早已将古老的中世纪帝国宪制拉扯至崩溃边缘。在奥托大帝传世千载的八角皇冠被永久封存抑或重铸为近代中欧联邦之前，德意志诸君必须写下最终的历史判词：是力挽狂澜复兴神圣罗马皇权、由北方铁血雄狮重塑新秩序，还是坦然告别帝国黄昏、迈入近代主权邦国的新时代？"
 oe_v45_hre.20.a: "颁行《帝国联邦革新宪典》，令双头鹰皇冠在近代焕发新生！"
 oe_v45_hre.20.b: "顺应铁血时势，推动以北方军政改革为首的德意志新联盟！"
 oe_v45_hre.20.c: "体面解除各邦中世纪封建效忠誓约，正式步入近代主权国家纪元。"
 oe_v45_hre_mod_bull_imperial_prerogative: "黄金诏书皇权至上宪制"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_bull_imperial_prerogative: "黄金诏书皇权至上宪制"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_bull_imperial_prerogative: "集权化的加冕法统与帝国御前枢密院监督显著抬升罗马皇权，但习惯自治的诸侯阶层对皇室严密稽核心生抵触。"
 oe_v45_hre_mod_bull_electoral_liberties: "选帝侯特权与诸侯自治宪章"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_bull_electoral_liberties: "选帝侯特权与诸侯自治宪章"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_bull_electoral_liberties: "成文化的领地豁免权、铸币权与选举宣誓书令诸侯与自由市受益匪浅，但也削弱了皇权集中调度之力。"
 oe_v45_hre_mod_bull_metz_compromise: "纽伦堡—梅斯帝国宪制平衡"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_bull_metz_compromise: "纽伦堡—梅斯帝国宪制平衡"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_bull_metz_compromise: "《黄金诏书》在七大选帝侯世袭特权与皇帝尊荣之间奠定平衡，以稍缓军备动员为代价换得持久宪制安宁。"
 oe_v45_hre_mod_diet_reichsreform_triumph: "帝国大改革常设宪政体系"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_diet_reichsreform_triumph: "帝国大改革常设宪政体系"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_diet_reichsreform_triumph: "帝国最高法院、十大行政大区与雷根斯堡永恒议会共同铸就高效联邦治理框架，但也引发官僚经费增长与诸阶层磨擦。"
 oe_v45_hre_mod_diet_regensburg_federation: "雷根斯堡永恒议会联邦共治"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_diet_regensburg_federation: "雷根斯堡永恒议会联邦共治"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_diet_regensburg_federation: "雷根斯堡常驻使节议会以法理与外交化解各大区纷争，显著提升商贸与声望，却令军事反应略显迟缓。"
 oe_v45_hre_mod_diet_princely_particularism: "帝国邦国分立与地方自固"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_diet_princely_particularism: "帝国邦国分立与地方自固"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_diet_princely_particularism: "随着帝国大改革步履维艰，各邦诸侯与自由市转而深耕本土城防与财政，全帝国共同威望则随之黯淡。"
 oe_v45_hre_mod_confess_westphalian_parity: "威斯特伐利亚教派对等和约"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_confess_westphalian_parity: "威斯特伐利亚教派对等和约"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_confess_westphalian_parity: "天主教与新教诸侯在法理上实现平等共处，终结宗教战乱并振兴中欧学术商旅，唯教派动员狂热随之消退。"
 oe_v45_hre_mod_confess_militant_triumph: "教派同盟铁血霸权"
