 oe_v250_men_dec_ita_condottieri_silk.title:0 "敕建丝织工坊与常设佣兵约署"
 oe_v250_men_dec_ita_condottieri_silk.desc:0 "奖掖栽桑养蚕、水力纺丝工坊并设立常设佣兵约署，严核职业佣兵队长契约。耗费110金币，持续25年提升生产效率、军纪与全国发展度，但军费负担加重且民兵征召池缩减。"
 oe_v250_men_dec_ita_condottieri_silk.a:0 "敕建水力丝坊并签署常设佣兵契约"
 oe_v250_men_dec_ita_condottieri_silk_tt:0 "提升已控制的#Y 米兰#!或#Y 佛罗伦萨#!发展度，并在25年内施行#Y 丝织工坊与常设佣兵约署#!。"
 oe_v250_men.10.t:0 "巴尔迪银号震荡与市政信用重塑"
 oe_v250_men.10.d:0 "北欧王室接连违约令巴尔迪与佩鲁齐两大银号轰然倒塌，信用危机瞬间席卷佛罗伦萨新市场与米兰维斯孔蒂铸币局。若将市政债务整编为公债「市政山」并捍卫佛罗林金币成色，虽能重振税效与城市繁荣却抬高融资利率并惹怒商帮；若转投伦巴第甲胄丝织实业或向豪门贵族征收紧急摊派，亦各有利弊。"
 oe_v250_men.10.a:0 "设立市政公债基金并严守佛罗林金币成色"
 oe_v250_men.10.b:0 "将资金转向伦巴第甲胄锻坊与精纺丝机"
 oe_v250_men.10.c:0 "向乡绅贵族征收紧急捐税以托底行会储户"
 oe_v250_men.11.t:0 "卡塔斯托财产税册与佣兵队长合约"
 oe_v250_men.11.d:0 "旷日持久的波河谷与托斯卡纳拉锯战令旧式间接消费税不堪重负，而与此同时，建筑大师正筑起宏伟穹顶，人文馆藏亦日臻丰沛。若推行详明公开的卡塔斯托财产税册并重金聘任精锐佣兵队长，可令税效与军纪大涨，代价则是军费沉重与豪门富商切齿；若倾财兴建文艺复兴穹顶与人文书院，则学术文华冠绝诸邦，却不免令行伍锐气稍减。"
 oe_v250_men.11.a:0 "推行卡塔斯托税册并延揽精锐佣兵队长"
 oe_v250_men.11.b:0 "资助人文穹顶、图书馆与文艺复兴学术"
 oe_v250_men.12.t:0 "洛迪和约与意大利均势联盟"
 oe_v250_men.12.d:0 "君士坦丁堡陷落的消息震动拉丁世界，连年拉锯亦令米兰、佛罗伦萨与威尼斯俱疲。弗朗切斯科·斯福尔扎与科西莫·美第奇倡议在洛迪缔结意大利均势和约，首创常驻大使制度以维系半岛平衡。若签署洛迪和约，可换取外交声誉、常驻使节与城市繁荣，却令长期和平下的攻城武备趋缓；若拒绝均势而谋求波河与阿诺河霸权，则攻势锐利却深陷外交孤立与高昂军费。"
 oe_v250_men.12.a:0 "签署洛迪和约并首设常驻大使馆"
 oe_v250_men.12.b:0 "拒绝均势妥协并力争北意大利霸权"
 oe_v250_men_ref_swe_landslag_council:0 "马格努斯·埃里克松全国法典与王国参议会"
 oe_v250_men_ref_swe_landslag_council_desc:0 "以全国统一的《马格努斯·埃里克松法典》取代割裂的地方习惯法，增进稳定、全国控制与自由农保障，代价则是王室专断受限且旧贵族司法特权受损。"
 oe_v250_men_priv_swe_bergslagen_charter:0 "贝里斯拉根铜铁矿工特许状"
 oe_v250_men_priv_swe_bergslagen_charter_desc:0 "向达拉纳与西曼兰的贝里斯拉根矿主行会颁授采矿与林木特许，显著拉升原料开采与手工业产值，代价是市民阶层权势攀升、商税上限下调并引发领主贵族不满。"
 oe_v250_men_cab_swe_bergslagen_mining:0 "贝里斯拉根皇家矿政巡查"
 oe_v250_men_cab_swe_bergslagen_mining_desc:0 "派遣皇家矿政司与冶炼检官巡查目标行省的铁炉、木炭配额与铜山股份，提升当地原料产出、生产效率与发展度，但会增加宫廷行政成本并引发乡农劳役不满。"
 oe_v250_men_cab_swe_bergslagen_mining_action:0 "贝里斯拉根皇家矿政巡查：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_swe_bergslagen_mining_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行贝里斯拉根皇家矿政巡查"
 oe_v250_men_cab_swe_bergslagen_mining_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_swe_bergslagen_mining_action_progress_wordier:0 "贝里斯拉根皇家矿政巡查（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_swe_bergslagen_mining_action_progress_tooltip:0 "派遣皇家矿政司与冶炼检官巡查目标行省的铁炉、木炭配额与铜山股份，提升当地原料产出、生产效率与发展度，但会增加宫廷行政成本并引发乡农劳役不满。"
