# NEW 2026-11-24 v25.0 Batch 3 Pack B: 1337-1460 Med/East/North Tracks (MAM/DLH/JAP/MLO-FLO/SWE/DAN) (oe_v250_men_, 0 mainline slots, 0 rules, 0 vanilla overrides) — simp_chinese localization (272 keys). Edit gen_v250_1337_med_east_north.py, not this file.
 oe_v250_men_ref_mam_bahri_diwan:0 "巴赫里城堡军务院"
 oe_v250_men_ref_mam_bahri_diwan_desc:0 "在开罗城堡统核伊克塔兵册、苏丹直属马穆鲁克营伍与各省防务，显著强化重骑兵、军纪与内阁效率，但军费负担趋重并引发资深埃米尔不满与维稳承压。"
 oe_v250_men_priv_mam_karimi_guild:0 "卡里米香料商团特许"
 oe_v250_men_priv_mam_karimi_guild_desc:0 "确认卡里米大商号在红海与亚历山大港的香料栈房特权，提振海贸与海权存在感，代价是市民阶层权势攀升、商税上限下调并招致军功贵族微词。"
 oe_v250_men_cab_mam_rawk_cadastre:0 "纳西尔尼罗河田籍清丈"
 oe_v250_men_cab_mam_rawk_cadastre_desc:0 "派遣开罗城堡丈田官巡行尼罗河灌区与叙利亚平原，重估河汛田亩与伊克塔税额，提升地方控制、粮产与国家税效，却会引发领主埃米尔与自耕农双双怨怼。"
 oe_v250_men_cab_mam_rawk_cadastre_action:0 "纳西尔尼罗河田籍清丈：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_mam_rawk_cadastre_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行纳西尔尼罗河田籍清丈"
 oe_v250_men_cab_mam_rawk_cadastre_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_mam_rawk_cadastre_action_progress_wordier:0 "纳西尔尼罗河田籍清丈（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_mam_rawk_cadastre_action_progress_tooltip:0 "派遣开罗城堡丈田官巡行尼罗河灌区与叙利亚平原，重估河汛田亩与伊克塔税额，提升地方控制、粮产与国家税效，却会引发领主埃米尔与自耕农双双怨怼。"
 oe_v250_men_cab_mam_rawk_cadastre_select_province:0 "选择开展尼罗河田籍清丈的行省"
 oe_v250_men_cab_mam_rawk_cadastre_no_provinces:0 "@trigger_no! 当前没有可开展田籍清丈的行省。"
 oe_v250_men_dec_mam_alexandria_guard.title:0 "筑固亚历山大与杜姆亚特海防"
 oe_v250_men_dec_mam_alexandria_guard.desc:0 "重修法罗斯沿岸炮台、港口铁链与三角洲巡航船坞，以防塞浦路斯与法兰克海盗突袭。耗费110金币，持续25年增强桨帆战力、全国防御与水手储备，同时推高海军与要塞维护开销。"
 oe_v250_men_dec_mam_alexandria_guard.a:0 "架设港湾铁链并整备三角洲巡海船队"
 oe_v250_men_dec_mam_alexandria_guard_tt:0 "提升#Y 亚历山大#!发展度与#Y 杜姆亚特#!繁荣度，并在25年内施行#Y 亚历山大与杜姆亚特海防#!。"
 oe_v250_men.1.t:0 "纳西尔·穆罕默德身后之变"
 oe_v250_men.1.d:0 "在位经年的苏丹纳西尔·穆罕默德驾崩后，资深巴赫里埃米尔诸派齐聚开罗城堡狮门，一面争相挟持年幼的卡拉温诸子，一面觊觎尼罗河谷与叙利亚最丰饶的伊克塔采邑。若依托城堡军务院与苏丹亲卫固守中枢，虽可维系军纪与王权却将激怒诸将并抬高军费；若向大埃米尔分润采邑或转求开罗乌里玛大法官斡旋，则各有深远得失。"
 oe_v250_men.1.a:0 "依托城堡军务院与苏丹亲卫稳固中枢"
 oe_v250_men.1.b:0 "与资深巴赫里埃米尔共分伊克塔采邑"
 oe_v250_men.1.c:0 "延请开罗乌里玛与四派大法官出面斡旋"
 oe_v250_men.2.t:0 "亚历山大港劫难与红海香料专营"
 oe_v250_men.2.d:0 "自塞浦路斯与罗得岛出没的拉丁战舰频频叩关，令开罗深感尼罗河口海防之危；与此同时，印度洋胡椒与丁香仍源源不绝经吉达、苏伊士汇入亚历山大商栈。若由苏丹宫廷强推香料官营并扩建海防桨帆，可充盈税库与战备却会触怒商贾、招致外交摩擦；若放权卡里米商团并重续地中海商约，虽能繁荣商运却削弱王室直接掌控。"
 oe_v250_men.2.a:0 "推行苏丹香料官营并整备黎凡特护海舰队"
 oe_v250_men.2.b:0 "特许卡里米船队并重续地中海商栈条约"
 oe_v250_men.3.t:0 "巴尔库克登极与布尔吉近卫改制"
 oe_v250_men.3.d:0 "随着末代卡拉温幼主沦为权臣傀儡，切尔克斯宿将赛义夫丁·巴尔库克顺势而起，筹建布尔吉王朝，力图以城堡塔楼近卫的军功晋升制取代巴赫里世袭旧制，并严守大马士革、阿勒颇与东地中海门户。若大刀阔斧重塑布尔吉军制，可令骑兵与兵源焕然一新，却会引动正统争议与军饷攀升；若怀柔叙利亚诸总督并兴办开罗经学院，则能广结文教人望，代价是中央控驭与士气相对舒缓。"
 oe_v250_men.3.a:0 "整肃布尔吉切尔克斯近卫并严固叙利亚边镇"
 oe_v250_men.3.b:0 "怀柔叙利亚诸总督并广建开罗经学院"
 oe_v250_men_ref_dlh_tughluq_iqta:0 "图格鲁克伊克塔与财政部清册"
 oe_v250_men_ref_dlh_tughluq_iqta_desc:0 "借德里中央财政部严核各省穆克提的伊克塔结余与骑兵定额，强化税效、全国控制与人力征集，代价则是贵族与农民阶层双双怨望且维稳开销增加。"
 oe_v250_men_priv_dlh_muqti_cavalry:0 "穆克提行省骑兵分封制"
 oe_v250_men_priv_dlh_muqti_cavalry_desc:0 "向效忠苏丹的突厥与阿富汗埃米尔确认稳定行省伊克塔领地，壮大重骑战力与征召规模，同时助长贵族权势、压低贵族税赋上限并削弱王室集权。"
 oe_v250_men_cab_dlh_amir_i_kohi:0 "农垦部桑达尔垦荒贷"
 oe_v250_men_cab_dlh_amir_i_kohi_desc:0 "派遣中央农垦官赴目标行省发放桑达尔种子农贷、开凿水井并复垦荒田，提升粮食产量与繁荣度，代价是宫廷财政垫支与短期税效让利。"
 oe_v250_men_cab_dlh_amir_i_kohi_action:0 "农垦部桑达尔垦荒贷：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_dlh_amir_i_kohi_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行农垦部桑达尔垦荒贷"
 oe_v250_men_cab_dlh_amir_i_kohi_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_dlh_amir_i_kohi_action_progress_wordier:0 "农垦部桑达尔垦荒贷（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_dlh_amir_i_kohi_action_progress_tooltip:0 "派遣中央农垦官赴目标行省发放桑达尔种子农贷、开凿水井并复垦荒田，提升粮食产量与繁荣度，代价是宫廷财政垫支与短期税效让利。"
 oe_v250_men_cab_dlh_amir_i_kohi_select_province:0 "选择推行农垦部垦荒贷的行省"
 oe_v250_men_cab_dlh_amir_i_kohi_no_provinces:0 "@trigger_no! 当前没有可推行农垦部垦荒贷的行省。"
 oe_v250_men_dec_dlh_yamuna_canals.title:0 "开凿亚穆纳河与萨特莱杰河灌渠"
 oe_v250_men_dec_dlh_yamuna_canals.desc:0 "引亚穆纳河与萨特莱杰河水源修筑长年干渠，灌溉哈里亚纳平原与上多阿布的麦田、甘蔗与果园。耗费115金币，持续25年提升粮产、生产效率与繁荣度，但宫廷修缮开支繁重且需减免农税上限。"
 oe_v250_men_dec_dlh_yamuna_canals.a:0 "凿渠开闸润泽多阿布沃野"
 oe_v250_men_dec_dlh_yamuna_canals_tt:0 "提升#Y 德里#!发展度与#Y 帕尼帕特#!繁荣度，并在25年内施行#Y 亚穆纳与萨特莱杰灌渠#!。"
 oe_v250_men.4.t:0 "多阿布饥荒与桑达尔农贷"
 oe_v250_men.4.d:0 "连年季风失约叠加多阿布重税，令恒河与亚穆纳河之间村落凋敝，苏丹穆罕默德·本·图格鲁克一度移驻恒河畔萨尔加德瓦里营帐救荒。若专设农垦部大举发放桑达尔籽种耕牛贷，虽能重振粮仓却耗财甚巨；若严厉追缴伊克塔欠税以补国库，又恐加剧乡野离心；若干脆减免田赋并由乡绅自治储粮，则令中央税收与掌控双双受损。"
 oe_v250_men.4.a:0 "设立农垦部并广发桑达尔耕牛籽种农贷"
 oe_v250_men.4.b:0 "严核各省伊克塔欠赋以充实德里府库"
 oe_v250_men.4.c:0 "蠲免多阿布田赋并委托乡长就地储粮"
 oe_v250_men.5.t:0 "菲鲁兹沙的皇家工坊与世袭采邑"
 oe_v250_men.5.d:0 "历经德干与孟加拉连年苦战后，菲鲁兹沙·图格鲁克的廷臣力主休养生息：扩建皇家卡尔哈纳织造工坊、革除苛杂商税，并准许忠勤将校将伊克塔采邑传予子嗣。然而边疆宿将却忧心，世袭封禄势必侵蚀苏丹集权，令军队在面对西北强敌时渐失铁血纪律。"
 oe_v250_men.5.a:0 "扩建皇家工坊并准许忠臣世袭伊克塔"
 oe_v250_men.5.b:0 "坚持中央现银发饷与旁遮普边防严训"
 oe_v250_men.6.t:0 "印度河边防警备与多阿布粮堡"
 oe_v250_men.6.d:0 "河中风烟迭起，加之章普尔、马尔瓦与古吉拉特诸邦蠢蠢欲动，德里苏丹国西北关隘与多阿布腹地同受夹击。若沿木尔坦—拉合尔—帕尼帕特一线筑牢储粮要塞，可令京畿固若金汤却须承受沉重堡垒维护与税效损耗；若大举招募阿富汗与拉其普特边军助战，虽得雄兵锐气，却令贵族坐大、政局维稳趋难。"
 oe_v250_men.6.a:0 "筑牢拉合尔—帕尼帕特防线并充实多阿布粮堡"
 oe_v250_men.6.b:0 "缔结边防盟约广募阿富汗与拉其普特劲旅"
 oe_v250_men_ref_jap_muromachi_kanrei:0 "室町管领与守护大名合议制"
 oe_v250_men_ref_jap_muromachi_kanrei_desc:0 "在京都确立三管领与四职合议体制以统筹各省守护大名，提升内阁效率、附庸忠诚与王朝正统，代价则是幕府直辖王权受限且中央税效略降。"
 oe_v250_men_priv_jap_za_merchants:0 "京都座商行会与土仓金融特许"
 oe_v250_men_priv_jap_za_merchants_desc:0 "向京都酒坊、织造座商及土仓金融商颁授专营特许，显著提振手工业产值与陆路商运，代价是市民权势膨胀、商税上限下调并引发乡间农民债务怨恨。"
 oe_v250_men_cab_jap_hanzei_stewardship:0 "管领守护调停与半济监理"
 oe_v250_men_cab_jap_hanzei_stewardship_desc:0 "委派幕府重臣巡行调停诸国守护纷争并核验半济庄园税份，显著稳固附庸忠诚、外交声誉与掌控度，却会压缩中央直征税效并惹恼寺院庄园势力。"
 oe_v250_men_cab_jap_hanzei_stewardship_action:0 "管领守护调停与半济监理"
 oe_v250_men_cab_jap_hanzei_stewardship_active:0 "正在执行：管领守护调停与半济监理"
 oe_v250_men_cab_jap_hanzei_stewardship_action_progress:0 "执行中"
 oe_v250_men_cab_jap_hanzei_stewardship_action_progress_wordier:0 "管领守护调停与半济监理（执行中）"
 oe_v250_men_cab_jap_hanzei_stewardship_action_progress_tooltip:0 "委派幕府重臣巡行调停诸国守护纷争并核验半济庄园税份，显著稳固附庸忠诚、外交声誉与掌控度，却会压缩中央直征税效并惹恼寺院庄园势力。"
 oe_v250_men_dec_jap_tenryuji_fleet.title:0 "敕许天龙寺船与勘合贸易"
 oe_v250_men_dec_jap_tenryuji_fleet.desc:0 "敕准自博多与摄津启航的天龙寺船与勘合贸易船队通航大陆港口，输入铜钱、丝绸与典籍。耗费100金币，持续25年提振海贸、科研与文化传统，但海军维护费用攀升且招致保守武家微词。"
 oe_v250_men_dec_jap_tenryuji_fleet.a:0 "颁授勘合符信并启航通商"
 oe_v250_men_dec_jap_tenryuji_fleet_tt:0 "提升#Y 京都#!发展度与#Y 博多#!繁荣度，并在25年内施行#Y 天龙寺与勘合海贸#!。"
 oe_v250_men.7.t:0 "天龙寺船与东亚勘合海贸"
 oe_v250_men.7.d:0 "禅僧梦窗疏石与足利幕府重臣建言自博多与摄津遣发官许商船「天龙寺船」赴大陆互市，不论盈亏皆向京都上纳定额铜钱。若大力支持官许商队，可振兴海贸与水手池却须承受护航开支并遭保守武家非议；若仅限禅院使船出航，则文教昌盛而商利收窄；若放权九州水军豪族巡海，又将削弱幕府中枢与周边外交。"
 oe_v250_men.7.a:0 "扶植天龙寺商船并规范博多海运"
 oe_v250_men.7.b:0 "仅限五山禅院使节乘船往来以重文教威仪"
 oe_v250_men.7.c:0 "授命九州海族豪强分担海峡巡防"
 oe_v250_men.8.t:0 "观应扰乱与半济之法"
 oe_v250_men.8.d:0 "足利氏内部的观应扰乱令镰仓至京都武士阵营四分五裂。为尽快收拢诸国守护效命幕府，军中诸将力请颁行《半济之法》，准许守护截留公家与寺院庄园半数田租充作军粮；然而幕府评定众却警告，一旦放开半济，守护必将借机坐大为割据一方的守护大名。"
 oe_v250_men.8.a:0 "颁行《半济之法》以稳固诸国守护效忠"
 oe_v250_men.8.b:0 "严护庄园地籍并由幕府奉行直接审断"
 oe_v250_men.9.t:0 "北山文化与金阁寺落成"
 oe_v250_men.9.d:0 "随着南北朝合一、京都重归太平，将军于洛北营建的北山殿（金阁寺）融公家典雅与禅宗清寂于一炉，广庇世阿弥能乐、水墨画师与大陆通使。若倾力赞助北山文教与外交盛典，可令文化传统、科研与国际声望大振，却将推高宫廷开支；若将京都商税尽数充实直属奉公众卫队，则强干弱枝，代价则是军费繁重与京都商民怨言。"
 oe_v250_men.9.a:0 "宏扬北山文教、五山学术与东亚外交"
 oe_v250_men.9.b:0 "以京都商税充实将军直属奉公众亲卫"
 oe_v250_men_ref_ita_civic_chancery:0 "伦巴第—托斯卡纳市政枢密院"
 oe_v250_men_ref_ita_civic_chancery_desc:0 "延揽人文主义公证官、商法学者与行会代表入主常设市政枢密院，加快科研、手工产值与内阁治理，代价则是传统征召兵源萎缩且常备雇佣军费高企。"
 oe_v250_men_priv_ita_arti_banks:0 "大行会与佛罗林银号特许"
 oe_v250_men_priv_ita_arti_banks_desc:0 "将金银成色检验、丝绸规制与国际汇票业务托付大行会与银号寡头，提升陆贸效率与市民识字率，代价是市民权势独大、商税上限下调并疏离乡绅贵族。"
 oe_v250_men_cab_ita_catasto_survey:0 "卡塔斯托财产清册与丝坊督造"
 oe_v250_men_cab_ita_catasto_survey_desc:0 "在目标行省逐户核查工坊、田产与动产资本，同步规范丝织品标准与卡塔斯托税册，显著提升地方产值、发展度与控制，却招致富商市民与乡绅贵族抗议。"
