 oe_v250_men_dec_swe_stora_kopparberg.title:0 "敕颁大铜山矿业特许状"
 oe_v250_men_dec_swe_stora_kopparberg.desc:0 "向法伦大铜山矿业股份团颁授皇家特许状，并规范经斯德哥尔摩出海的瑞典生铁贸易。耗费95金币，持续25年提振原料产出、生产效率与国家税效，但需让渡部分商税上限并承担矿政监理开支。"
 oe_v250_men_dec_swe_stora_kopparberg.a:0 "钤印颁行大铜山皇家特许状"
 oe_v250_men_dec_swe_stora_kopparberg_tt:0 "提升#Y 法伦#!发展度与#Y 斯德哥尔摩#!繁荣度，并在25年内施行#Y 大铜山皇家特许状#!。"
 oe_v250_men.13.t:0 "大铜山特许状与《全国法典》颁布"
 oe_v250_men.13.d:0 "厄勒布鲁与斯德哥尔摩的皇家法学家已完成瑞典首部统一法典《马格努斯·埃里克松全国法典》的编纂，并拟同步向法伦大铜山矿工团颁授特许状。若推行统一法典并扶植矿工行会，可显著提升稳定、原料产出与全国控制，代价则是大贵族不满与宫廷开销上升；若保留各省旧法官特权或强收矿山直营皇租，则各走极端、得失分明。"
 oe_v250_men.13.a:0 "颁行统一《全国法典》并特许贝里斯拉根矿团"
 oe_v250_men.13.b:0 "保留各省旧法官与大领主地方司法特权"
 oe_v250_men.13.c:0 "将一切铜铁矿坑收归王室直接抽成"
 oe_v250_men.14.t:0 "斯德哥尔摩德意志市民与波罗的海铁贸"
 oe_v250_men.14.d:0 "来自吕贝克与但泽的汉萨富商把持斯德哥尔摩码头，几乎垄断贝里斯拉根生铁的波罗的海外运，激起瑞典本土市民就市政议席的激烈争执。若强制推行瑞典与德意志市民平分议席并扶持本土铁贸集散，可壮大本国手工业与王室掌控却招致汉萨外交报复与海贸摩擦；若重申汉萨特许，则能维系银钱畅通与城市繁荣，代价则是商税上限受损且市民寡头坐大。"
 oe_v250_men.14.a:0 "严行市政议席均等并扶持本土生铁集散"
 oe_v250_men.14.b:0 "重申汉萨贸易特许以维系波罗的海银货通流"
 oe_v250_men.15.t:0 "恩厄尔布雷克特与阿尔博加四阶层议会"
 oe_v250_men.15.d:0 "不堪外来税吏苛索与波罗的海战时封锁窒息铁矿外销，达拉纳矿工与自由农在恩厄尔布雷克特率领下揭竿而起，并于阿尔博加召开史无前例的四阶层王国议会，令农民、市民与贵族、教士共商国是。若将四阶层议会与自由农民兵制度化，可极大激发士气与人力却会削弱王权与贵族旧威；若仍将国政局限于大贵族参议会，则内阁顺手却令乡间自由农深怀怨怼。"
 oe_v250_men.15.a:0 "确立四阶层王国议会与自由农民兵传统"
 oe_v250_men.15.b:0 "将王国军政仍局限于大贵族参议会"
 oe_v250_men_ref_dan_atterdag_crown:0 "阿特达格王室赎地与丹麦王国大会"
 oe_v250_men_ref_dan_atterdag_crown_desc:0 "通过丹麦王国大会追赎被典押的王室堡垒并重申王权法统，提升税效、王室比重与北欧外交声誉，代价则是债主大贵族不满且维稳开销增加。"
 oe_v250_men_priv_dan_skane_herring:0 "斯科讷鲱鱼大集与海峡领航行会"
 oe_v250_men_priv_dan_skane_herring_desc:0 "向斯科讷秋季鲱鱼腌制商与厄勒海峡领航行会颁授集市特许，提振海贸与水手储备，代价是市民权势抬升、商税上限下调并增加护航经费。"
 oe_v250_men_cab_dan_sound_dues:0 "厄勒海峡关税与波罗的海巡防"
 oe_v250_men_cab_dan_sound_dues_desc:0 "于赫尔辛格与哥本哈根外海常驻皇家税关巡船，核查过境波罗的海商船并征收海峡通行税，提升税效、海权与轻舰战力，却会损害外交声誉并加重海军维护。"
 oe_v250_men_cab_dan_sound_dues_action:0 "厄勒海峡关税与波罗的海巡防"
 oe_v250_men_cab_dan_sound_dues_active:0 "正在执行：厄勒海峡关税与波罗的海巡防"
 oe_v250_men_cab_dan_sound_dues_action_progress:0 "执行中"
 oe_v250_men_cab_dan_sound_dues_action_progress_wordier:0 "厄勒海峡关税与波罗的海巡防（执行中）"
 oe_v250_men_cab_dan_sound_dues_action_progress_tooltip:0 "于赫尔辛格与哥本哈根外海常驻皇家税关巡船，核查过境波罗的海商船并征收海峡通行税，提升税效、海权与轻舰战力，却会损害外交声誉并加重海军维护。"
 oe_v250_men_dec_dan_krogen_sound_dues.title:0 "兴筑克罗根堡并开征厄勒海峡税"
 oe_v250_men_dec_dan_krogen_sound_dues.desc:0 "于厄勒海峡最窄处赫尔辛格筑起克罗根海防要塞，向一切进出波罗的海的商船开征王室海峡税。耗费105金币，持续25年显著提升税效、海权威慑与海贸收益，但会招致列强忌恨并推高要塞维保开销。"
 oe_v250_men_dec_dan_krogen_sound_dues.a:0 "动工兴建克罗根堡并开征海峡关税"
 oe_v250_men_dec_dan_krogen_sound_dues_tt:0 "提升#Y 赫尔辛格#!发展度与#Y 哥本哈根#!繁荣度，并在25年内施行#Y 克罗根厄勒海峡税#!。"
 oe_v250_men.16.t:0 "瓦尔德马四世“重见天日者”赎回国土"
 oe_v250_men.16.d:0 "历经八年无王之乱、国土大部典押给荷尔斯泰因伯爵与德意志债主后，瓦尔德马四世（绰号「阿特达格」，意为重见天日）登基誓言逐城赎回西兰、菲英与日德兰故土。若出售遥远爱沙尼亚领地并铁腕征税赎回王城，可迅速光复王室税基与掌控却令农绅俱苦；若借重日德兰贵族集资或抵押斯科讷渔税整军，则各有长短得失。"
 oe_v250_men.16.a:0 "变卖远疆典产并铁腕征税赎回王室故土"
 oe_v250_men.16.b:0 "与日德兰贵族订约集资共同赎回王领"
 oe_v250_men.16.c:0 "质押斯科讷鲱鱼关税以优先重整王室城防"
 oe_v250_men.17.t:0 "斯科讷鲱鱼市场与汉萨同盟纷争"
 oe_v250_men.17.d:0 "每年深秋，数以千计商船云集斯科讷与马尔默抢捕欧洲最富饶的鲱鱼汛，而丹麦重掌斯科讷与哥特兰岛已激起吕贝克及科隆联盟的全面海上对抗。若调集皇家重舰硬撼汉萨封锁，可捍卫波罗的海海权却耗费巨额舰队军费并招致外交孤立；若签署施特拉尔松德式的妥协和约，虽能重开银盐贸易、恢复繁荣，却不得不让渡部分税效与王室威望。"
 oe_v250_men.17.a:0 "硬撼汉萨同盟并封锁整备厄勒海峡"
 oe_v250_men.17.b:0 "缔结施特拉尔松德式妥协以重通波罗的海银货"
 oe_v250_men.18.t:0 "玛格丽特一世与卡尔马联盟盛典"
 oe_v250_men.18.d:0 "凭借纵横罗斯基勒、奥斯陆与斯德哥尔摩的卓绝外交手腕，玛格丽特一世齐聚北欧三国主教与大贵族于卡尔马，共戴一主、缔结卡尔马联盟。若以怀柔议会外交经营三国同盟，可大幅稳固附庸忠诚与外交容量，代价则是王室集权受限与宫廷开销上升；若以哥本哈根与厄勒海峡税为核心强推财政集权，则丹麦府库充盈、王权大振，却难免埋下北方附庸离心之患。"
 oe_v250_men.18.a:0 "以怀柔议会外交维系卡尔马三国同盟"
 oe_v250_men.18.b:0 "以哥本哈根与海峡税为核心强推北欧财政集权"
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_mam_alexandria_guard:0 "亚历山大与杜姆亚特海防"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_mam_alexandria_guard:0 "加固的三角洲港堡与常备桨帆巡队护卫埃及与黎凡特海岸，却需长期承受高昂船队与要塞维保支出。"
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev1_citadel_diwan:0 "开罗城堡亲卫主政"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev1_citadel_diwan:0 "苏丹直属马穆鲁克掌控军政提升了军纪与王室比重，但高额军饷与大埃米尔的不满如影随形。"
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev1_bahri_compact:0 "巴赫里埃米尔采邑协约"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev1_bahri_compact:0 "安抚资深军酋换得士气高涨与贵族拥戴，代价则是贵族阶层坐大且国库直收税效下滑。"
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev1_ulama_mediation:0 "开罗大法官监政和约"
