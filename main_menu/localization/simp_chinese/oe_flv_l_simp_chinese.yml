 oe_frontier_scorched_earth_stance: "边疆坚壁清野"
 oe_frontier_scorched_earth_stance_desc: "[subject|e]将全力固守本境、光复己方失地并截击渗入的敌方散兵，同时维系军需补给，严禁盲目深入敌境送战。"
 oe_frontier_scorched_earth_stance_desc_all: "我们所有[subjects|e]将全力固守本境、光复己方失地并截击渗入的敌方散兵，同时维系军需补给，严禁盲目深入敌境送战。"
 oe_maritime_convoy_escort_stance: "海道护航封锁"
 oe_maritime_convoy_escort_stance_desc: "[subject|e]将倾力清剿海盗、执行海上护航补给、封锁敌港与要冲海峡并争夺制海权，陆军仅作本土守备。"
 oe_maritime_convoy_escort_stance_desc_all: "我们所有[subjects|e]将倾力清剿海盗、执行海上护航补给、封锁敌港与要冲海峡并争夺制海权，陆军仅作本土守备。"
 oe_silk_road_garrison_stance: "丝路要道警备"
 oe_silk_road_garrison_stance_desc: "[subject|e]将优先清剿商道叛军与流寇、保障宗主与联军陆路后勤补给，并积极集结主力支援友军会战与围城。"
 oe_silk_road_garrison_stance_desc_all: "我们所有[subjects|e]将优先清剿商道叛军与流寇、保障宗主与联军陆路后勤补给，并积极集结主力支援友军会战与围城。"
 oe_insult_byz_ven_fourth_crusade: "当年趁火打劫第四次十字军的泻湖商贩，竟也配在[COUNTRY.GetName]面前谈论荣誉？总有一天，[TARGET_COUNTRY.GetName]会把偷走的青铜骏马连本带利还回来！"
 oe_insult_byz_gen_galata: "[TARGET_COUNTRY.GetAdjective]商馆不过是寄生在金角湾对岸的贪婪水蛭，待帝国舰队升起紫旗，你们的关税账簿便只配拿来引火。"
 oe_insult_byz_tur_bosphorus: "在博斯普鲁斯海峡边搭起几顶毡帐，便以为自己能与千年罗马并肩？[TARGET_COUNTRY.GetName]不过是高原上又一阵注定消散的沙尘！"
 oe_insult_byz_hre_false_emperor: "莱茵河畔的法兰克蛮族也敢盗用奥古斯都之名？[TARGET_COUNTRY.GetName]的所谓皇冠，在君士坦丁堡的紫室眼里不过是一顶镀锡戏帽！"
 oe_insult_byz_catholic_schism: "[TARGET_COUNTRY.GetName]背离七次普世大公会议的古训，却在西方炫耀残缺的教义，难怪你们的宫廷既无正统法度，亦失圣哲威仪。"
 oe_insult_byz_rebel_vassal: "莫忘了是谁赐予[TARGET_COUNTRY.GetName]封号与衣食！若敢对[COUNTRY.GetName]心怀异志，狄奥多西城墙外的斩首台随时为叛臣敞开。"
 oe_insult_byz_greek_fire: "请把[TARGET_COUNTRY.GetName]的木船尽量排得整齐些——我们的希腊火喷管最喜欢在海面上欣赏连成一片的火把。"
 oe_insult_byz_senate_decree: "[TARGET_COUNTRY.GetName]那群争吵不休的市侩议员，连罗马元老院最末等书吏的礼仪都学不会，却妄想拿铜臭丈量帝国江山。"
 oe_insult_byz_barbarian_crown: "昔日你们的先祖尚在林中披兽皮饮血时，罗马法典已照耀地中海；如今[TARGET_COUNTRY.GetName]换上一件锦袍，便忘了自己的蛮荒出身么？"
 oe_insult_byz_heathen_foe: "多少自诩无敌的异教强敌曾折戟于君士坦丁堡三重城垣之下？[TARGET_COUNTRY.GetName]若想步其后尘，帝国军区随时奉陪！"
 oe_insult_yuan_rebel_prince: "背弃成吉思汗《大札撒》与大汗宗主的叛逆之徒！[TARGET_COUNTRY.GetName]就像挣脱缰绳的劣马，迟早要在草原烈风中摔断脊梁。"
 oe_insult_yuan_southern_rebels: "盘踞水乡泽国的草寇也敢妄称天命？[TARGET_COUNTRY.GetName]不过是坐井观天的蛙鸣，待大军南下，尔等城池顷刻灰飞烟灭！"
 oe_insult_yuan_mandate_envoy: "[TARGET_COUNTRY.GetName]使节既不通朝贡礼仪，又不识天朝文教，来[COUNTRY.GetName]上书不过是徒增鸿胪寺官吏的笑柄。"
 oe_insult_yuan_timur_usurper: "撒马尔罕的僭号跋扈之辈竟敢窥伺河西与中原？[TARGET_COUNTRY.GetName]若胆敢东进半步，黄沙大漠便是尔等大军的葬身之地！"
 oe_insult_yuan_korean_tribute: "[TARGET_COUNTRY.GetName]岁贡迟滞、言辞敷衍，莫非以为隔着鸭绿江便能躲过天朝问责？趁早备齐表文与骏马前来请罪吧！"
 oe_insult_yuan_wokou_pirates: "东海孤岛上的流寇与倭船鼠辈，只敢趁夜劫掠渔村！[TARGET_COUNTRY.GetName]若再纵容海盗犯境，我们的楼船水师定叫尔等片板不存。"
 oe_insult_yuan_jiaochao_wealth: "大都与江南一座税关的岁入便胜过[TARGET_COUNTRY.GetName]举国库藏，你们与其炫耀寒酸刀枪，不如先学会如何让百姓吃饱饭。"
 oe_insult_yuan_keshig_riders: "当我们的怯薛铁骑鸣镝齐发之时，[TARGET_COUNTRY.GetName]的步卒阵线就像秋风里的芦苇一样不堪一击。"
 oe_insult_yuan_yam_speed: "我们站赤驿卒传递捷报的速度，比[TARGET_COUNTRY.GetName]诸将下达撤退军令还要快上十倍！"
 oe_insult_yuan_western_barbarians: "泰西远邦万里迢迢而来，无非是眼馋天朝的生丝、瓷器与茶砖；[TARGET_COUNTRY.GetName]竟也摆起傲慢架子，实在令人发笑。"
 oe_insult_rus_sarai_taxmen: "告诉[TARGET_COUNTRY.GetName]那些腐朽的达鲁花赤税吏：他们再也休想从伏尔加河与奥卡河勒索走一文银币！等待你们的只有罗斯战斧与寒铁！"
 oe_insult_rus_polish_sejm: "[TARGET_COUNTRY.GetName]的贵族议会整日吵得像乡间集市，只需一个醉醺醺的施拉赫塔喊声反对，你们连发兵的诏书都签不出来！"
 oe_insult_rus_swedish_ice: "[TARGET_COUNTRY.GetName]莫非已经忘了涅瓦河的寒流？若你们的帆船再敢越过波罗的海东岸，我们就请你们重温冰下沉舟的滋味。"
 oe_insult_rus_teutonic_knights: "身披重甲的骑士老爷们在楚德湖冰面上沉得比石头还快——[TARGET_COUNTRY.GetName]还要再送多少铁罐头来喂我们的湖鱼？"
 oe_insult_rus_third_rome_claim: "两座罗马已然动摇，而第三座罗马巍然屹立！[TARGET_COUNTRY.GetName]那些虚伪的拉丁使节休想拿空头许诺蒙蔽正教牧首与沙皇。"
 oe_insult_rus_steppe_forts: "草原掠夺的旧时代早已终结！[TARGET_COUNTRY.GetName]的轻骑撞上我们的鹿砦防线与射击军齐射，只会留下满地折断的弓箭。"
 oe_insult_rus_ottoman_black_sea: "黑海北岸绝非[TARGET_COUNTRY.GetName]的后花园，待双头鹰军旗南下草原，博斯普鲁斯的波涛都将听见罗斯钟声！"
 oe_insult_glh_wooden_palisades: "缩在潮湿木栅栏后面瑟瑟发抖的纳税农夫！[TARGET_COUNTRY.GetName]若不按时牵来良马与貂皮，我们的铁蹄就会替你们拆掉城墙。"
 oe_insult_glh_steppe_tribute: "[TARGET_COUNTRY.GetName]不过是[COUNTRY.GetName]牧场边缘的肥羊，在万户骑兵跨上战马之前，最好自己把城门钥匙双手奉上！"
 oe_insult_glh_settled_softness: "久居暖阁的定居软骨头连硬弓都拉不开，[TARGET_COUNTRY.GetName]竟还敢向长生天庇佑的草原雄鹰口出狂言？"
