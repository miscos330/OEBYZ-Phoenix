 oe_build_yam_post_road_demand: "建造[ShowRoadTypeNameWithNoTooltip('oe_yam_post_road')]"
 oe_maintain_yam_post_road_demand: "维护[ShowRoadTypeNameWithNoTooltip('oe_yam_post_road')]"
 oe_adv_yam_post_road: "天下站赤驿传网"
 oe_adv_yam_post_road_desc: "整合通政院水陆站户、草料驿栈与海青金牌急递体系，修建兼顾草原骑兵机动力与丝路商旅补给的大元站赤驿道。"
 oe_siberian_trakt: "西伯利亚帝国驿路"
 oe_siberian_trakt_desc: "专为林海冻土与万里茶皮商道修筑的圆木垫基与驿站[road|e]，冬行雪橇、夏通马车，加速乌拉尔以东的屯垦移民与欧亚陆路贸易流通。"
