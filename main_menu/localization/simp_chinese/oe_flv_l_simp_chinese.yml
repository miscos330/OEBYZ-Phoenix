 oe_via_imperialis: "帝国石砌御道"
 oe_via_imperialis_desc: "承袭罗马大道工法的双层石砌[road|e]，以深基碎石、灰浆与整块条石铺就，兼具重装军团急行军、驿邮直达与帝都政令通达之效。"
