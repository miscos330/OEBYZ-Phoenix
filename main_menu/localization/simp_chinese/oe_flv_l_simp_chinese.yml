 oe_build_via_imperialis: "建造$oe_via_imperialis$"
 oe_build_via_imperialis_demand: "建造[ShowRoadTypeNameWithNoTooltip('oe_via_imperialis')]"
 oe_adv_via_imperialis: "帝国石砌御道工法"
 oe_adv_via_imperialis_desc: "复兴《查士丁尼法典》驿道工务制度，在巴尔干、安纳托利亚与地中海行省间修筑全天候帝国石砌御道，大幅缩短首都政令衰减与军团调动耗时。"
 oe_yam_post_road: "大元站赤驿道"
 oe_yam_post_road_desc: "沿万里欧亚商旅干线布设水陆站赤与换马驿馆的疾驰[road|e]，凭金牌海青符日夜兼程换乘，令大汗与朝廷诏命数日可达边疆万里。"
