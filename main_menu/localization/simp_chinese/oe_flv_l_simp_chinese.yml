 oe_flv_dec_imperial_style.title: "敕定国号与帝国尊号"
 oe_flv_dec_imperial_style.desc: "依循当前政体、都城与疆域格局，在历代正统国号之间敕定本国对外尊称。冷却时间：#Y 5年#!。"
 oe_flv_dec_imperial_style.a: "召集群臣议定国号"
