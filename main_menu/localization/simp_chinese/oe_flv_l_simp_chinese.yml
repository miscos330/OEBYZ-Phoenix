 oe_trait_porphyrogenitus_scholar: "紫室博学者"
 oe_trait_porphyrogenitus_scholar_desc: "生于紫室而通晓古典希腊修辞、罗马法典与帝国典章的博学之主，令君士坦丁堡书院与行省文教大兴。"
 desc_oe_trait_porphyrogenitus_scholar: "生于紫室而通晓古典希腊修辞、罗马法典与帝国典章的博学之主，令君士坦丁堡书院与行省文教大兴。"
 oe_trait_porphyrogenitus_scholar_die_desc: "[CHARACTER.GetSheHe|U]生于紫室而好古博学，所撰典章与经义注疏将长久流传于帝国书院。"
 oe_trait_varangian_veteran: "瓦兰吉卫队老兵"
 oe_trait_varangian_veteran_desc: "久历近卫斧兵死战洗礼的铁血悍将，深谙重步兵方阵抗压、战术协同与临阵稳军之道。"
 desc_oe_trait_varangian_veteran: "久历近卫斧兵死战洗礼的铁血悍将，深谙重步兵方阵抗压、战术协同与临阵稳军之道。"
 oe_trait_varangian_veteran_die_desc: "[CHARACTER.GetSheHe|U]曾随瓦兰吉近卫百战不屈，其临阵持重之名令敌我双方皆深感敬畏。"
 oe_trait_great_yassa_keeper: "大札撒守护者"
 oe_trait_great_yassa_keeper_desc: "笃守成吉思汗军法与草原合围旧制的英武之君，令诸部宗王敬畏服从、万户铁骑疾驰如风。"
 desc_oe_trait_great_yassa_keeper: "笃守成吉思汗军法与草原合围旧制的英武之君，令诸部宗王敬畏服从、万户铁骑疾驰如风。"
 oe_trait_great_yassa_keeper_die_desc: "[CHARACTER.GetSheHe|U]一生恪守《大札撒》军法，草原诸部至今传颂其整肃铁骑、号令万户的威名。"
 oe_trait_sanjiao_sage: "三教通儒"
 oe_trait_sanjiao_sage_desc: "兼融儒家礼治、道家无为与佛家慈悲的明德之主，善调多教共治与中书省枢机政务。"
 desc_oe_trait_sanjiao_sage: "兼融儒家礼治、道家无为与佛家慈悲的明德之主，善调多教共治与中书省枢机政务。"
 oe_trait_sanjiao_sage_die_desc: "[CHARACTER.GetSheHe|U]博通儒释道三教义理，以宽仁礼治抚安天下，身后深受四海臣民追思。"
 oe_trait_third_rome_zealot: "第三罗马护教者"
 oe_trait_third_rome_zealot_desc: "以承续东正教普世法统为己任的虔诚君主，借教会祝圣与圣像威仪凝聚万民向心与皇权正统。"
 desc_oe_trait_third_rome_zealot: "以承续东正教普世法统为己任的虔诚君主，借教会祝圣与圣像威仪凝聚万民向心与皇权正统。"
 oe_trait_third_rome_zealot_die_desc: "[CHARACTER.GetSheHe|U]毕生捍卫正教法统与第三罗马圣业，教区钟声久久传颂其虔诚功绩。"
 oe_trait_siberian_pathfinder: "西伯利亚开拓者"
 oe_trait_siberian_pathfinder_desc: "熟稔冰河舟楫、林海越冬与边堡补给的拓荒猛将，纵使深入极寒冻土亦能保全士卒疾进万里。"
 desc_oe_trait_siberian_pathfinder: "熟稔冰河舟楫、林海越冬与边堡补给的拓荒猛将，纵使深入极寒冻土亦能保全士卒疾进万里。"
 oe_trait_siberian_pathfinder_die_desc: "[CHARACTER.GetSheHe|U]曾率军破冰开道、踏遍万里冻土，为后世留下一座座边堡与通途。"
 oe_flv.1.t: "敕定罗马国号与尊称"
 oe_flv.1.d: "宫廷书记官与元老院仪礼大总管呈上金玺诏稿，请陛下择定本朝用于万国国书、印信与史册的正式国号。无论承继东罗马千年紫室传统、高举共和元老院旗帜，抑或光复东西二都而称普世帝国，皆由圣意裁断。"
 oe_flv.1.a: "奉行《罗马帝国》正统国号"
 oe_flv.1.b: "昭告《罗马元老院与人民》（SPQR）"
 oe_flv.1.c: "敕号《普世罗马帝国》"
 oe_flv.1.cancel: "暂维持现行国号"
 oe_flv.2.t: "敕定大元与大蒙古国号"
 oe_flv.2.d: "中书省平章与蒙古怯薛宗王齐聚大殿，商议颁行天下的国书玺印称谓：是以大都为本承天命而称《大元大蒙古国》，是以草原宗主旧号称《大蒙古兀鲁思》，抑或整顿漠北旗帐而称《北元》？"
 oe_flv.2.a: "奉行《大元大蒙古国》国号"
 oe_flv.2.b: "恢复《大蒙古兀鲁思》大汗尊号"
 oe_flv.2.c: "以《北元》汗廷为号"
 oe_flv.2.cancel: "暂维持现行国号"
 oe_flv.3.t: "敕定罗斯公国与沙皇国号"
 oe_flv.3.d: "克里姆林书吏院与波雅尔议事厅呈上新的国玺图样：随着疆土渐广、诸公归附，我国对外诏书究应沿用《莫斯科大公国》古号、改称统合诸邦的《全罗斯沙皇国》，抑或迈入近世而号《全俄罗斯帝国》？"
 oe_flv.3.a: "沿用《莫斯科大公国》古号"
 oe_flv.3.b: "加冕敕号《全罗斯沙皇国》"
 oe_flv.3.c: "迈入近世，敕号《全俄罗斯帝国》"
 oe_flv.3.cancel: "暂维持现行国号"
 oe_flv.10.t: "帝国石砌御道初成"
 oe_flv.10.d: "首段按古典罗马双层碎石与整石板工法修筑的帝国御道已正式竣工，石碑上铭刻着自黄金里程碑起算的里数。商队、驿使与重装军团得以昼夜兼程，帝都威仪再度沿着大道伸向四方行省。"
 oe_flv.10.a: "立碑铭记罗马工务复兴"
 oe_flv.10.b: "犒赏役夫与行省司工"
 oe_flv.11.t: "大元站赤驿道贯通"
 oe_flv.11.d: "首条配备换马驿馆、草料栈房与金牌急递规制的站赤驿道已正式开通。佩戴海青牌的信使昼夜疾驰不息，万里疆域的军情与商旅贡赋从此得以飞速汇聚朝廷。"
 oe_flv.11.a: "赐海青金牌，旌表天下站户"
 oe_flv.11.b: "充实驿站马政与粮秣储备"
 oe_flv.12.t: "西伯利亚帝国驿路初通"
 oe_flv.12.d: "首段穿行林海冻土的西伯利亚帝国驿路已铺设圆木垫基并建起官办驿站。无论严冬雪橇抑或夏秋商车，皆可沿此干道东进垦殖、运出紫貂与万里茶砖，令极北边疆与帝国核心血脉相连。"
 oe_flv.12.a: "嘉奖穿行冰原的边疆开拓名将"
 oe_flv.12.b: "增拨驿栈木料与冬粮补给"
