 oe_adv_siberian_trakt: "西伯利亚大驿路制"
 oe_adv_siberian_trakt_desc: "以乌拉尔至贝加尔湖的官办驿栈、渡口与伐木垫路规制贯通严寒林海，解锁兼具高市场通达与人口迁徙效率的西伯利亚帝国驿路。"
