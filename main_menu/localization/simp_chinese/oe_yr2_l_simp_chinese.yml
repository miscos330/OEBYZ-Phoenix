l_simp_chinese:
 oe_yr2_dec_chao_reserve_audit: "核查各路平准库钞本"
 oe_yr2_dec_chao_reserve_audit.title: "核查各路平准库钞本"
 oe_yr2_dec_chao_reserve_audit_desc: "遣中书省户部官巡核各行省平准库白银准备金，拨库银充实钞本、平抑虚估并出具平准账簿奏报。冷却5年。"
 oe_yr2_dec_chao_reserve_audit.desc: "遣中书省户部官巡核各行省平准库白银准备金，拨库银充实钞本、平抑虚估并出具平准账簿奏报。冷却5年。"
 oe_yr2_dec_chao_reserve_audit.a: "拨银入库并呈核查账簿"
 oe_yr2_dec_chao_reserve_audit.tt: "提升交钞钞信10点、压降通胀2%，并触发《平准库钞本核查奏报》议决后续货币策。"
 oe_yr2_dec_silver_peg_reform: "行钞银兼行法"
 oe_yr2_dec_silver_peg_reform.title: "行钞银兼行法"
 oe_yr2_dec_silver_peg_reform_desc: "当交钞钞信危殆或大元中兴步入二阶段时，准以白银铸币兜底至正交钞，建立20年银钞平准锚定机制，彻底扭转恶性通胀死循环。冷却20年。"
 oe_yr2_dec_silver_peg_reform.desc: "当交钞钞信危殆或大元中兴步入二阶段时，准以白银铸币兜底至正交钞，建立20年银钞平准锚定机制，彻底扭转恶性通胀死循环。冷却20年。"
 oe_yr2_dec_silver_peg_reform.a: "颁行银钞兼行平准诏"
 oe_yr2_dec_silver_peg_reform.tt: "立即提升交钞钞信12点、压降通胀3%，并获20年《银钞平准锚定》国家修正。"
 oe_yr2_dec_grain_convoy_escort: "遣水师万户府押运海漕"
 oe_yr2_dec_grain_convoy_escort.title: "遣水师万户府押运海漕"
 oe_yr2_dec_grain_convoy_escort_desc: "抽调沿海万户府水师护航刘家港至直沽的江南海漕船队，震慑倭寇与海枭并在风汛期内大幅降低沉船耗粮。冷却4年。"
 oe_yr2_dec_grain_convoy_escort.desc: "抽调沿海万户府水师护航刘家港至直沽的江南海漕船队，震慑倭寇与海枭并在风汛期内大幅降低沉船耗粮。冷却4年。"
 oe_yr2_dec_grain_convoy_escort.a: "整饬护漕船队出港"
 oe_yr2_dec_grain_convoy_escort.tt: "立即为大都漕仓补粮25单位，并在4年内降低海盗滋生与台风沉船耗损。"
 oe_yr2_dec_touxia_grand_review: "大元诸王与边省投下大计"
 oe_yr2_dec_touxia_grand_review.title: "大元诸王与边省投下大计"
 oe_yr2_dec_touxia_grand_review_desc: "统核梁王、辽阳行省及宗室投下藩王的岁赐与户籍，择定是以厚赐岁币怀柔宗亲，还是遣御史清核隐户以收财权。冷却8年。"
 oe_yr2_dec_touxia_grand_review.desc: "统核梁王、辽阳行省及宗室投下藩王的岁赐与户籍，择定是以厚赐岁币怀柔宗亲，还是遣御史清核隐户以收财权。冷却8年。"
 oe_yr2_dec_touxia_grand_review.a: "厚颁岁赐以固宗藩之心"
 oe_yr2_dec_touxia_grand_review.a.tt: "全体活跃宗王与辽阳行省忠诚度显著上升，并获8年《厚赐怀柔宗藩》修正。"
 oe_yr2_dec_touxia_grand_review.b: "遣御史清核投下隐匿户籍"
 oe_yr2_dec_touxia_grand_review.b.tt: "略降宗王与辽阳忠诚，换取8年《清核投下财权》税收与王权增益。"
 oe_yr2_grant_touxia_charter: "赐投下岁赐与虎符"
 oe_yr2_grant_touxia_charter_desc: "由大都户部拨付岁赐金帛并赐下虎符，显著提升目标投下藩王或边省的忠诚度、好感与勤王战力。冷却10年。"
 oe_yr2_grant_touxia_charter_act: "向[SCOPE.sCountry('recipient').GetName]赐下投下岁赐与虎符"
 oe_yr2_grant_touxia_charter_effect_text: "[SCOPE.sCountry('actor').GetName]向[SCOPE.sCountry('recipient').GetName]拨付岁赐金帛并赐下勤王虎符。"
 oe_yr2_grant_touxia_charter_effect_text_past: "[SCOPE.sCountry('actor').GetName]已向[SCOPE.sCountry('recipient').GetName]拨付岁赐金帛并赐下勤王虎符。"
