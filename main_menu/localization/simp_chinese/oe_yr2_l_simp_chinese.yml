 oe_yr2_grant_cd_tt: "该藩王近10年内未接受过投下岁赐虎符"
 oe_yr2_curtail_touxia_audit: "遣御史核检投下户籍"
 oe_yr2_curtail_touxia_audit_desc: "遣御史台按察使核减目标藩王私属投下户，削弱其地方割据兵财实力并为大元中书省收回税权，但会降低该藩忠诚度。冷却12年。"
 oe_yr2_curtail_touxia_audit_act: "遣御史核检[SCOPE.sCountry('recipient').GetName]的投下户籍"
 oe_yr2_curtail_touxia_audit_effect_text: "[SCOPE.sCountry('actor').GetName]遣御史核减[SCOPE.sCountry('recipient').GetName]的私属投下户籍。"
 oe_yr2_curtail_touxia_audit_effect_text_past: "[SCOPE.sCountry('actor').GetName]已遣御史核减[SCOPE.sCountry('recipient').GetName]的私属投下户籍。"
 PROPOSE_oe_yr2_curtail_touxia_audit: "是否遣御史核检$RECIPIENT$的投下户籍？\n\n$INFO$"
 oe_yr2_curtail_cd_tt: "该藩王近12年内未被御史核检投下户籍"
 oe_yr2.1.t: "平准库钞本核查奏报"
 oe_yr2.1.d: "中书省户部遣官奔走腹里与江浙诸路，逐库盘验平准库现存银锭与旧钞销毁底册。新拨银本已经入库，京师与江南钱肆闻风稍安，现请圣裁余银用法：是趁势焚毁残钞紧缩市面，还是贷放盐粮商号以活流通？"
 oe_yr2.1.a: "焚毁残钞、严守钞本准绳"
 oe_yr2.1.a.tt: "进一步提振交钞钞信并稳步压低通胀。"
 oe_yr2.1.b: "将余银贷予盐粮大商以活市肆"
 oe_yr2.1.b.tt: "回笼一笔短期商利并取悦市民阶层，但略增通胀压力。"
 oe_yr2.2.t: "江南盐引兑钞风暴"
 oe_yr2.2.d: "两淮、两浙盐场商贾持大宗盐引齐聚杭州与平江平准库，声称市面新印交钞虚估日甚，若不准以实银兑付盐本，便停运官盐。江浙财赋乃帝国命脉，一旦盐课停滞，京师岁计势必告急。"
 oe_yr2.2.a: "开库拨银照额兑付盐引"
 oe_yr2.2.a.tt: "耗费重金但大幅修复交钞信用并压降通胀。"
 oe_yr2.2.b: "别发江南盐课保值特钞"
 oe_yr2.2.b.tt: "以小损朝廷颜面换取十年盐税与贸易稳健。"
 oe_yr2.2.c: "严旨勒令商贾强收官钞"
 oe_yr2.2.c.tt: "强收短期财赋，但重创钞信、推高通胀并激怒商民。"
 oe_yr2.3.t: "大都钱庄挤兑与中书省救市"
 oe_yr2.3.d: "物价腾踊之风波及京畿，大都积水潭畔多家斡脱钱庄与解典库遭京城军民连日挤兑。若任其倒闭，京师百业瘫痪、宿卫粮饷断绝；但若全由户部兜底，内帑立见枯竭。"
 oe_yr2.3.a: "开内帑平准银库担保京城存银"
 oe_yr2.3.a.tt: "耗资甚巨，却立止挤兑、大振钞信与京畿安定。"
 oe_yr2.3.b: "敕立蒙汉合营斡脱清算总行"
 oe_yr2.3.b.tt: "分摊救市成本并建立十年低息清算网络。"
 oe_yr2.3.c: "封库冻兑并查抄囤银豪商"
 oe_yr2.3.c.tt: "抄没现银充库，但重损稳定度、钞信与长期商贸。"
 oe_yr2.4.t: "平准库回笼旧钞奏功"
 oe_yr2.4.d: "连年核查钞本与银钞平准之策终见大效：各路平准库回笼破损旧钞数百万锭，市肆米绢价格复归平稳，西域商旅与江南牙行皆乐于收受中统、至正宝钞。中书省请借此嘉瑞重定财税格局。"
 oe_yr2.4.a: "定立永制银钞平准大册"
 oe_yr2.4.a.tt: "巩固钞信并赋予帝国十五年财税正统红利。"
 oe_yr2.4.b: "诏免各路商税三分以藏富于民"
 oe_yr2.4.b.tt: "以惠民减税换取十二年繁荣与各阶层满意度。"
 oe_yr2.5.t: "黑水洋飓风与沉船救灾"
 oe_yr2.5.d: "夏汛南风骤变为黑水洋飓风，满载江浙漕米的平底沙船在成山头外遭遇惊涛骇浪，多艘粮舟触礁倾覆。沿海万户府急报大都：若不速筹抢救与补船，今岁京畿漕储恐现大缺口。"
 oe_yr2.5.d_escort: "夏汛飓风突袭黑水洋，所幸朝廷早遣水师万户府押运护航，引导大部漕船及时驶入登莱避风澳，仅少数尾船受损。沿海将领请示如何借势抢修船队并补足北运余粮。"
 oe_yr2.5.a: "拨款组派沿海救捞水师并抚恤船户"
 oe_yr2.5.a.tt: "护漕舰队在任时可反增漕粮，无护航时大幅止损并得八年海事救捞加成。"
 oe_yr2.5.b: "开沿河官仓平价济运以稳民心"
 oe_yr2.5.b.tt: "耗费较轻并稳固人心，护漕在任可保粮仓微盈。"
 oe_yr2.5.c: "征发沿海民夫强造替补漕船"
 oe_yr2.5.c.tt: "免耗库银补回部分漕粮，但损及稳定度与农民满意。"
 oe_yr2.6.t: "倭寇与方国珍余部劫粮对策"
 oe_yr2.6.d: "东海岛屿间倭寇浪人与浙东海枭余部勾连，专伺江南海漕出港之际截劫粮舟。中书省议论纷纭：一派主张招抚海枭授以海运万户虚衔，一派主张调集水师雷霆合剿，另有汉臣建议暂改大运河内陆转运。"
 oe_yr2.6.a: "招抚海枭授以海运万户官衔"
 oe_yr2.6.a.tt: "立解海上劫粮之患并补粮25单位，但略损威望与皇室集权。"
 oe_yr2.6.b: "调集南北水师出海合剿倭寇"
 oe_yr2.6.b.tt: "花金锻造强悍反海盗水师，大幅压制海盗并提升海军传统。"
 oe_yr2.6.c: "疏浚会通河改行大运河陆转"
 oe_yr2.6.c.tt: "绕开东海风险、增补漕粮并改善南北驿运，但耗资较高。"
 oe_yr2.7.t: "太仓直沽义仓平粜"
 oe_yr2.7.d: "江南新米大批抵岸，直沽海口千帆云集。京畿粮价因新漕入仓而回落，有司奏请于直沽与太仓水次兴建常平义仓，岁丰则籴、岁歉则粜，或将余粮拨充京师大营军储。"
 oe_yr2.7.a: "于直沽兴建常平义仓平粜济民"
 oe_yr2.7.a.tt: "大增漕仓35单位、提升稳定并强化直沽粮运枢纽15年。"
 oe_yr2.7.b: "拨充京师宿卫与边防军储"
 oe_yr2.7.b.tt: "补充20单位漕粮与人力，强化全国守军与补员10年。"
 oe_yr2.8.t: "海运新航道与南洋番粮互市"
 oe_yr2.8.d: "泉州（晋江）与明州海商借季风开辟通往占城、真腊与爪哇的新航线，满载占城早熟稻米与南洋香料北返，既能缓解京师单一依赖江南漕粮之忧，又可扩大宝钞与瓷丝出海流通。"
 oe_yr2.8.a: "敕开泉州南洋番粮瓷丝互市"
 oe_yr2.8.a.tt: "大增漕粮40单位、提振钞信，并获十五年南洋互市红利。"
 oe_yr2.8.b: "扶植远洋深水商船会馆"
 oe_yr2.8.b.tt: "提升海军传统、造船效率与海权商业实力十五年。"
 oe_yr2.10.t: "扩廓帖木儿总领天下兵马之议"
 oe_yr2.10.d: "河南王扩廓帖木儿（王保保）麾下晋冀精骑纪律严明、屡挫劲敌，朝中主战派力请授其总领天下兵马重任以廓清中原；但东宫近臣与诸宗王忌其兵权过重，主张派员分掌山西粮台加以节制。"
 oe_yr2.10.a: "拜扩廓帖木儿为太傅、总领天下兵马"
 oe_yr2.10.a.tt: "大振大元军威与陆军传统，若扩廓封藩存在则大增其好感与锋锐。"
 oe_yr2.10.b: "分设晋冀兵马监司以衡朝局"
 oe_yr2.10.b.tt: "强化皇权集权、军费效率与国家安定，但令扩廓一系心怀芥蒂。"
 oe_yr2.11.t: "辽阳行省与东道诸王驿道防务"
 oe_yr2.11.d: "辽阳行省平章与东道诸王联名驰奏：辽东至松花江沿岸站赤驿道漫长，兼防高丽边情与女真万户，乞请大都加拨戍饷与军马；京畿宿卫统领则提议抽调部分辽东精骑入卫大都怯薛。"
 oe_yr2.11.a: "增拨东道驿饷以固辽阳与宗王防线"
 oe_yr2.11.a.tt: "提升辽阳行省与东道四王忠诚，强化帝国驿道与边防十五年。"
 oe_yr2.11.b: "抽调辽阳精骑入卫大都怯薛"
 oe_yr2.11.b.tt: "立获大批人力并强化京畿兵力，但降低辽阳行省忠诚度。"
 oe_yr2.12.t: "上都忽里台新盟"
 oe_yr2.12.d: "大元历经烽火而国祚重振，黄金家族诸王与行省重臣再会于上都滦河之畔。古老的投下世封旧制已难完全适配近代帝国的军政需求：是乘中兴之势将诸王世封改制为领俸帝国节度总督，还是重申成吉思汗以来的宗亲共治新盟？"
 oe_yr2.12.a: "改投下世封为帝国领俸节度总督"
 oe_yr2.12.a.tt: "以短期动荡和宗王不满换取三十年强劲皇权、税收与控制力。"
 oe_yr2.12.b: "重申上都黄金家族共治新盟"
 oe_yr2.12.b.tt: "以盛大岁赐凝聚全体诸王，获三十年高附庸忠诚、正统与军心。"
 STATIC_MODIFIER_NAME_oe_yr2_silver_chao_peg: "银钞平准锚定"
