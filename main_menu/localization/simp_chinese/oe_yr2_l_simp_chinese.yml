 STATIC_MODIFIER_NAME_oe_yr2_audit_sound_notes: "焚残守本钞政"
 STATIC_MODIFIER_DESC_oe_yr2_audit_sound_notes: "销毁残破旧钞并严核库本，提升商民对官钞的信心。"
 STATIC_MODIFIER_NAME_oe_yr2_audit_merchant_credit: "平准商贷活市"
 STATIC_MODIFIER_DESC_oe_yr2_audit_merchant_credit: "将平准余银低息贷予盐粮商号，刺激贸易并取悦市民。"
 STATIC_MODIFIER_NAME_oe_yr2_salt_voucher_stabilizer: "江南盐引稳钞"
 STATIC_MODIFIER_DESC_oe_yr2_salt_voucher_stabilizer: "以两淮两浙官盐专卖收入为江南钞币提供信用支撑。"
 STATIC_MODIFIER_NAME_oe_yr2_dadu_market_rescued: "中书省稳市护兑"
 STATIC_MODIFIER_DESC_oe_yr2_dadu_market_rescued: "朝廷担保大都钱庄存银，迅速恢复京畿信用与繁荣。"
 STATIC_MODIFIER_NAME_oe_yr2_ortoq_clearing_guild: "斡脱合营清算行"
 STATIC_MODIFIER_DESC_oe_yr2_ortoq_clearing_guild: "蒙汉商帮联合清算网络降低了融资利息并扩展商力。"
 STATIC_MODIFIER_NAME_oe_yr2_dadu_credit_freeze: "京畿冻兑查抄"
 STATIC_MODIFIER_DESC_oe_yr2_dadu_credit_freeze: "强硬冻结钱庄兑付虽加强了朝廷控制，却打击商市信心。"
 STATIC_MODIFIER_NAME_oe_yr2_chao_ledger_triumph: "银钞平准永制"
 STATIC_MODIFIER_DESC_oe_yr2_chao_ledger_triumph: "制度化的平准账簿使交钞信用坚如磐石，惠及全境财税。"
 STATIC_MODIFIER_NAME_oe_yr2_tax_rebate_boom: "减税藏富于民"
 STATIC_MODIFIER_DESC_oe_yr2_tax_rebate_boom: "朝廷让利于商民，带动全境手工业与市肆欣欣向荣。"
 STATIC_MODIFIER_NAME_oe_yr2_convoy_escort: "水师万户府护漕"
