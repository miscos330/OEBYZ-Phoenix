l_simp_chinese:
 oe_belisarius_retired: "退休"
 oe_belisarius_retired_desc: "此人已奉命退出军政职任，不能进入内阁，也不能指挥军队或舰队，不能担任琼筵序次职位。退休不会令其出家或迁居。"
 oe_flavor_byz.1017.t: "拉文纳的桂冠"
 oe_flavor_byz.1017.d: "（穆罕默德二世）\n\n从意大利送来的捷报，已经足以铺满御前的长桌。三十处城镇与乡野归入帝国的疆土，贝利萨留斯的名字，也随这些捷报传遍了半岛。\n\n如今，意大利使节把银器、锦缎和桂冠送到他的军帐。有人请求他裁断城中的争执，有人把献给皇帝的礼物，先呈给这位决定城门何时打开的统帅。士兵们在营火旁高呼他的名字，随军文书写下的皇帝称号，却一封比一封简短。\n\n没有人能指出他究竟在哪一刻逾越了臣子的本分。他仍称自己奉诏出征，仍将土地交给帝国。然而，宫廷已经开始不安：当人们谈论罗马在意大利的胜利时，首先想起的，究竟是皇帝，还是他的将军？"
 oe_flavor_byz.1017.a: "这是他应得的。"
 oe_flavor_byz.1017.a.tt: "权威 #R -10#!。贝利萨留斯继续保留任职与指挥资格。"
 oe_flavor_byz.1017.b: "让他退休。"
 oe_flavor_byz.1017.b.tt: "贝利萨留斯获得“退休”特质，退出内阁与军队／舰队指挥职务，不能再次担任这些职务；同时退出琼筵序次。其意大利与新月沃地的个人征服能力停止生效。"
 oe_flavor_byz.1017.historical_info: "本事件将“功高震主”的宫廷困境置于架空的东罗马复兴战争之中。历史上的穆罕默德二世是奥斯曼苏丹，而不是受东罗马皇帝节制的将军；事件标题中的桂冠象征军功与声望，不要求实际取得拉文纳地点。"
 oe_flavor_byz.1018.t: "远征两河"
 oe_flavor_byz.1018.d: "（穆罕默德二世）\n\n东方的战书已经送抵宫廷。贝利萨留斯展开一幅标有幼发拉底河与底格里斯河的地图，沿着河道逐一指出渡口、仓城和省会。他不再是那个等待别人认可的年轻军官；攻破要塞的经验，已使他明白如何让一场胜利牵动整片土地。\n\n“陛下，两河之间的城市依靠商路、堤渠与粮仓相连。让敌人在每一座城中重新组织抵抗，便是把时间交还给他们。请准许我在夺下省会的当日接收乡野，派官吏随军进入仓廪与衙署。那些仍闭门坚守的要塞，再由我们的军队逐一解决。”\n\n战后的治理仍将漫长。但在此刻，他请求的，是让罗马的诏令与军旗一同向东方推进。"
 oe_flavor_byz.1018.a: "越过两河，将胜利化作帝国的疆土。"
 oe_flavor_byz.1018.a.tt: "贝利萨留斯亲自指挥东罗马军队时，对新月沃地地区的交战敌国地点启用强征服：普通地点或要塞被攻克后立即归东罗马所有；若夺取省会，同省所有属于交战敌国、且没有要塞的新月沃地地点同时归东罗马所有。其他要塞仍需逐个攻克。\n#Y 不新增核心#!，保留原有核心。中立与友方领土不受影响。能力只属于贝利萨留斯，退休或去世后不再生效。"
 oe_flavor_byz.1018.historical_info: "贝利萨留斯统率东罗马军队远征两河，是本事件链的架空设定。省会陷落带动无要塞地点易主的强征服效果属于本模组的游戏机制。"
