 oe_yc.1.t: "变钞之议"
 oe_yc.1.desc_t: "#F 至正十年（1350年），据载左司都事武祺建议更定钞法，吏部尚书偰哲笃附议：以中统交钞一贯折铜钱一千文，抵至元宝钞两贯，再铸至正通宝钱与历代铜钱并用。丞相召集群臣集议，集贤大学士吕思诚当廷反对，说这样行不通。#!\n\n如今，丞相脱脱主持集议，等朝廷拿主意。\n\n说明：此后每年正月，朝廷都要议一次岁用，定下当年印钞的多少；#bold #color_yellow 钞信#!#!的高低决定钞法的好坏。"
 oe_yc.1.desc_x: "#F 至正十年（1350年），据载左司都事武祺建议更定钞法，吏部尚书偰哲笃附议：以中统交钞一贯折铜钱一千文，抵至元宝钞两贯，再铸至正通宝钱与历代铜钱并用。丞相召集群臣集议，集贤大学士吕思诚当廷反对，说这样行不通。#!\n\n如今，集议到了御前，等朝廷拿主意。\n\n说明：此后每年正月，朝廷都要议一次岁用，定下当年印钞的多少；#bold #color_yellow 钞信#!#!的高低决定钞法的好坏。"
 oe_yc.1.a: "行至正交钞，并铸至正通宝"
 oe_yc.1.a.tt: "钞信#R −15#!\n此后岁用之议照常。"
 oe_yc.1.b: "从吕思诚议，不变钞"
 oe_yc.1.b.tt: "钞信#G +5#!\n旧钞难以多印：此后岁用之议里“增印”“不计成数”所得减半。"
 oe_yc.1.c: "只铸至正通宝，不更钞"
 oe_yc.1.c.tt: "钞信#R −5#!"
 oe_yc.2.t: "岁用之议"
 oe_yc.2.desc_o: "正月，中书省与户部议今年的用度。[ROOT.GetCountry.Custom('OeYcNeedNone')][ROOT.GetCountry.Custom('OeYcNeedWar')][ROOT.GetCountry.Custom('OeYcNeedWorks')][ROOT.GetCountry.Custom('OeYcNeedGold')][ROOT.GetCountry.Custom('OeYcNeedC10')]眼下#bold #color_yellow 钞信#!#!为#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_trust').GetValue|0]#!（[ROOT.GetCountry.Custom('OeYcTier')]），通胀#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_infl').GetValue|1]#!%。\n\n朝廷没有更钞，旧钞难以多印：增印所得只有一半。"
 oe_yc.2.desc_x: "正月，中书省与户部议今年的用度。[ROOT.GetCountry.Custom('OeYcNeedNone')][ROOT.GetCountry.Custom('OeYcNeedWar')][ROOT.GetCountry.Custom('OeYcNeedWorks')][ROOT.GetCountry.Custom('OeYcNeedGold')][ROOT.GetCountry.Custom('OeYcNeedC10')]眼下#bold #color_yellow 钞信#!#!为#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_trust').GetValue|0]#!（[ROOT.GetCountry.Custom('OeYcTier')]），通胀#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_infl').GetValue|1]#!%。"
 oe_yc.2.a: "收钞节用"
 oe_yc.2.a.tt: "钞信#G +8#!\n平乱仍在进行时：平乱“势”的加权#R −2#!\n军饷因此不足。"
 oe_yc.2.b: "照额印造"
 oe_yc.2.b.tt: "钞信#R −2#!"
 oe_yc.2.c: "增印以济军需"
 oe_yc.2.c.tt: "钞信#R −8#!\n平乱仍在进行时：平乱“势”的加权#G +3#!\n若原版“匮绝之时”给的“高通货膨胀”也在身，两份通胀会叠加。"
 oe_yc.2.d: "不计成数"
 oe_yc.2.d.tt: "钞信#R −15#!\n平乱仍在进行时：平乱“势”的加权#G +5#!\n若原版“匮绝之时”给的“高通货膨胀”也在身，两份通胀会叠加。\n只在今年国用缺口最大或国库已空时可选。"
 oe_yc.3.t: "钞法大坏"
 oe_yc.3.desc_x: "#F 史载新钞行用不久，物价涨了十倍以上；后来京师用十锭钞也换不到一斗粟，各地百姓以物易物，钞几乎没人再用，国家的用度由此大乏。#!\n\n如今，#bold #color_yellow 钞信#!#!已经跌到谷底：各路发下去的军饷钞，市上没人肯收。"
 oe_yc.3.a: "军饷改以实物折支"
 oe_yc.3.a.tt: "粮帛代钞，军中稳了些，市面上更少见钱。"
 oe_yc.3.b: "听之"
 oe_yc.3.b.tt: "钞法照旧。"
 oe_yc.4.t: "收钞复信"
 oe_yc.4.desc_x: "红巾之乱渐平，朝中有人上言：要中兴，先得让钞重新取信于民——收回滥发的钞，三年之内不再增印。可眼下#bold #color_yellow 钞信#!#!只有#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_trust').GetValue|0]#!，通胀#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_infl').GetValue|1]#!%，收钞要花一大笔钱。"
 oe_yc.4.a: "三年收钞"
 oe_yc.4.a.tt: "钞信#G +25#!"
 oe_yc.4.b: "从缓"
 oe_yc.4.b.tt: "钞信#G +5#!"
 oe_yc.90.t: "钞法读数"
 oe_yc.90.desc: "钞法读数（线在跑 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_on')|0]，结束代码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_end')|0]；月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_m')|0]）\n钞信 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_trust')|0]，档 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_tier')|0]，目标 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_stgt')|0]，信用账 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_cred')|0]；通胀 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_sinfl')|1]%\n变钞 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_reform')|0]，今年印造 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_print')|0]；国用缺口 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_need')|0]（战役 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_nwar')|0]，河工 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_nworks')|0]，金少 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_ngold')|0]，雇役 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_nc10')|0]）\n事件：.1 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_st1')|0]，.3 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_st3')|0]，.4 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_st4')|0]；岁用之议 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_n2')|0] 次，误期 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_lapse2')|0] 次，上次 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_y')|0] 年；最近一件 .[ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_last')|0]；等待 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_wait')|0]\n原版第41号 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_v41')|0]；标志 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_sflags')|0]；平乱阶段 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_phase')|0]，战役 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_camp')|0]，平乱结局 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_y7end')|0]；中兴起月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_p3m')|0]；坏结局起月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_yc_rd_badm')|0]"
 oe_yc.90.a: "知道了"
