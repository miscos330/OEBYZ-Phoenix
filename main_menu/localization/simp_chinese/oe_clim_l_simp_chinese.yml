 STATIC_MODIFIER_NAME_oe_clim_nomad_winter_herd_mod:0 "冬窝牧场与畜群护栏"
 STATIC_MODIFIER_DESC_oe_clim_nomad_winter_herd_mod:0 "依时令在避风冬窝与夏牧场间转场放牧，为游牧军政体系保住越冬畜群与军粮补给，避免严冬自溃。"
 STATIC_MODIFIER_NAME_oe_clim_eternal_steppe_mod:0 "长生天游牧大汗之道"
 STATIC_MODIFIER_DESC_oe_clim_eternal_steppe_mod:0 "坚守移动斡耳朵、骑兵驰道与严冬作战传统，将苦寒风雪与广袤草原转化为令农耕强敌胆寒的战略主场。"
 STATIC_MODIFIER_NAME_oe_clim_sedentary_gunpowder_mod:0 "定居化火器王朝改制"
 STATIC_MODIFIER_DESC_oe_clim_sedentary_gunpowder_mod:0 "将游牧军帐改制为筑城官署、铸炮工坊与田赋册籍，使草原汗国蜕变为财政稳固、火器精良的近世定居王朝。"
 STATIC_MODIFIER_NAME_oe_clim_dzud_pasture_accord_mod:0 "冬窝草场分牧盟约"
 STATIC_MODIFIER_DESC_oe_clim_dzud_pasture_accord_mod:0 "各部在白灾寒潮中依盟约共享避风河谷冬窝，大幅降低牲畜冻毙并消弭部族抢牧火并。"
 STATIC_MODIFIER_NAME_oe_clim_dzud_fodder_levy_mod:0 "大汗御用干草征储"
 STATIC_MODIFIER_DESC_oe_clim_dzud_fodder_levy_mod:0 "沿驿道征调干草与燕麦专供战马军团，保住骑兵战力却加重了牧民冬季负担。"
 STATIC_MODIFIER_NAME_oe_clim_ilkhan_divan_cadastre_mod:0 "波斯底万与牧税鱼鳞册"
 STATIC_MODIFIER_DESC_oe_clim_ilkhan_divan_cadastre_mod:0 "起用波斯文官底万统一编纂绿洲田赋与牧群定额税册，兼顾城市财源与游牧军役。"
 STATIC_MODIFIER_NAME_oe_clim_ilkhan_noyan_tumens_mod:0 "那颜万户草原军屯"
 STATIC_MODIFIER_DESC_oe_clim_ilkhan_noyan_tumens_mod:0 "维护传统那颜万户的牧场份地与军权，换取精锐骑兵统帅在两河与伊朗高原死战效忠。"
 STATIC_MODIFIER_NAME_oe_clim_yuan_horse_fairs_mod:0 "漠南茶马互市定例"
 STATIC_MODIFIER_DESC_oe_clim_yuan_horse_fairs_mod:0 "规范塞北茶马互市，以草原良马与皮毛易换中原粮布铁器，令亲王封地与商旅双双受益。"
 STATIC_MODIFIER_NAME_oe_clim_yuan_yam_banners_mod:0 "站赤驿道与亲王怯薛卫"
 STATIC_MODIFIER_DESC_oe_clim_yuan_yam_banners_mod:0 "整饬站赤驿站并扩编骑马探哨，在风雪封山之际维系漠北与辽东诸王封地的迅捷号令。"
 STATIC_MODIFIER_NAME_oe_clim_oirat_great_code_mod:0 "草原大法典与牧区轮牧制"
 STATIC_MODIFIER_DESC_oe_clim_oirat_great_code_mod:0 "颁行成文草原大法典，统一井泉养护、四季轮牧与部族命价裁断，令草原诸部凝成一体。"
 STATIC_MODIFIER_NAME_oe_clim_oasis_caravan_tolls_mod:0 "绿洲商道护卫与驿税"
 STATIC_MODIFIER_DESC_oe_clim_oasis_caravan_tolls_mod:0 "由草原轻骑护送天山南北与河中绿洲商队，将过境商税与粮械补给源源引入大汗府库。"
 STATIC_MODIFIER_NAME_oe_clim_lia_tax_remission_mod:0 "小冰期荒年蠲免钱粮"
 STATIC_MODIFIER_DESC_oe_clim_lia_tax_remission_mod:0 "严寒歉收之年果断蠲免丁粮并缓征旧欠，虽短期减少国库岁入，却稳住了农庄人丁与地方秩序。"
 STATIC_MODIFIER_NAME_oe_clim_lia_state_stockpiles_mod:0 "官仓严冬备荒储粮"
 STATIC_MODIFIER_DESC_oe_clim_lia_state_stockpiles_mod:0 "严禁荒年私运余粮出境并充实官府常备仓廪，全力保住边军与京畿市镇的越冬口粮。"
 STATIC_MODIFIER_NAME_oe_clim_ice_sled_convoys_mod:0 "冰河橇运与破冰漕运"
 STATIC_MODIFIER_DESC_oe_clim_ice_sled_convoys_mod:0 "在大河冰封之际调集雪橇驿队与破冰船夫打通冬季补给线，力保京师与重镇不断薪米。"
 STATIC_MODIFIER_NAME_oe_clim_frost_fair_charter_mod:0 "冰上冬市减税通商令"
 STATIC_MODIFIER_DESC_oe_clim_frost_fair_charter_mod:0 "冰封期间减免停航港税并特许冰面冬市交易，在漫长酷寒中为市民与行商留出一线生机。"
 STATIC_MODIFIER_NAME_oe_clim_bread_assize_mod:0 "平价义粥与官定粮价令"
 STATIC_MODIFIER_DESC_oe_clim_bread_assize_mod:0 "官府设立平粜局与施粥厂并严惩囤积居奇，以财政补贴稳住寒冬饥民与城厢治安。"
 STATIC_MODIFIER_NAME_oe_clim_grain_requisition_mod:0 "军管征粮与强保京畿"
 STATIC_MODIFIER_DESC_oe_clim_grain_requisition_mod:0 "遣兵查抄乡间余粮优先供应军队与首都，虽暂时遏制兵变，却令乡野怨声载道。"
 STATIC_MODIFIER_NAME_oe_clim_granary_relief_mod:0 "常平仓跨市购粮赈灾"
 STATIC_MODIFIER_DESC_oe_clim_granary_relief_mod:0 "度支官署动用真金白银在区域市场采买平价粮谷并转运饥荒行省，以真实供需调度斩断严冬大饥。"
 STATIC_MODIFIER_NAME_oe_clim_granary_private_guild_mod:0 "官督商办粮商运粜团"
 STATIC_MODIFIER_DESC_oe_clim_granary_private_guild_mod:0 "招募官督商办粮商团在各市场跨区采买调运，减轻官府垫资压力并疏通跨省粮食商路。"
 STATIC_MODIFIER_NAME_oe_clim_hydraulic_dikes_mod:0 "御筑堤防与梯田蓄水渠"
 STATIC_MODIFIER_DESC_oe_clim_hydraulic_dikes_mod:0 "兴修石砌堤坝、蓄水陂塘与山地灌溉渠系，令农田在酷寒、旱涝交替的小冰期仍能保墒稳产。"
 STATIC_MODIFIER_NAME_oe_clim_winter_forestry_mod:0 "官营薪炭林与泥炭采场"
 STATIC_MODIFIER_DESC_oe_clim_winter_forestry_mod:0 "统筹薪炭林轮伐与泥炭采掘，保障百姓严冬取暖与工坊冶炼不因酷寒断薪。"
 STATIC_MODIFIER_NAME_oe_clim_sweet_potato_relief_mod:0 "番薯金薯引种与山地垦殖"
 STATIC_MODIFIER_DESC_oe_clim_sweet_potato_relief_mod:0 "耐旱耐瘠的番薯与玉米广植于丘陵旱地，补齐稻麦歉收缺口，极大缓解东亚小冰期饥馑危机。"
 STATIC_MODIFIER_NAME_oe_clim_nongzheng_manual_mod:0 "官刻《农政全书》与劝农司"
 STATIC_MODIFIER_DESC_oe_clim_nongzheng_manual_mod:0 "各省雕版刊行新农书并官发良种薯藤，令荒政农学广布州县，稳步抬升田赋与农村繁荣。"
 STATIC_MODIFIER_NAME_oe_clim_potato_revolution_mod:0 "北欧与罗斯马铃薯农业革命"
 STATIC_MODIFIER_DESC_oe_clim_potato_revolution_mod:0 "埋藏土下的耐寒马铃薯无惧霜冻与兵燹践踏，使北欧、中欧与罗斯寒地亩产热量倍增，彻底改写人口天花板。"
 STATIC_MODIFIER_NAME_oe_clim_crown_potato_estates_mod:0 "王室示范农庄与推广马铃薯令"
 STATIC_MODIFIER_DESC_oe_clim_crown_potato_estates_mod:0 "王室示范农庄与官令推广迅速打破乡民疑虑，将高产薯类纳入轮作休耕体系并充实军需储备。"
 STATIC_MODIFIER_NAME_oe_clim_maize_expansion_mod:0 "高地与草原玉米丰收潮"
 STATIC_MODIFIER_DESC_oe_clim_maize_expansion_mod:0 "生长期短、适应力强的玉米迅速扎根小亚细亚高地、巴尔干山谷、印度高原与非洲稀树草原，筑牢乡野粮仓。"
 STATIC_MODIFIER_NAME_oe_clim_maize_market_surplus_mod:0 "玉米饲料与畜牧商品化"
 STATIC_MODIFIER_DESC_oe_clim_maize_market_surplus_mod:0 "充裕的玉米秸秆与谷粒极大壮大了役畜与肉畜养殖，同步拉动乡间产出效率与区域商税。"
 STATIC_MODIFIER_NAME_oe_clim_agrarian_boom_smallholders_mod:0 "新大陆作物驱动的人口复兴"
 STATIC_MODIFIER_DESC_oe_clim_agrarian_boom_smallholders_mod:0 "充裕的家庭余粮催生村落繁衍与荒地新垦，带领王朝昂然走出小冰期低谷并迈向人口新高峰。"
 STATIC_MODIFIER_NAME_oe_clim_agrarian_boom_urban_mod:0 "农商盈余与市镇繁荣潮"
 STATIC_MODIFIER_DESC_oe_clim_agrarian_boom_urban_mod:0 "低廉稳固的口粮供给将大量乡野劳力释放至工坊、行会与港口市镇，全面加速工商业与文教勃兴。"
 STATIC_MODIFIER_NAME_oe_clim_pox_highland_quarantine_mod:0 "高山避疫封锁线"
 STATIC_MODIFIER_DESC_oe_clim_pox_highland_quarantine_mod:0 "封锁隘口并疏散谷地大邑，虽暂时减缓赋税与贸易流转，却有效阻滞了处女地天花向腹地扩散。"
 STATIC_MODIFIER_NAME_oe_clim_pox_communal_relief_mod:0 "社仓互助与草药疗护"
 STATIC_MODIFIER_DESC_oe_clim_pox_communal_relief_mod:0 "部族互助照护病患、引山泉净水并开仓共济玉米口粮，避免天花大疫演变为无人照料的次生饥荒。"
 STATIC_MODIFIER_NAME_oe_clim_immunity_recovery_mod:0 "群体免疫形成与人口重振"
 STATIC_MODIFIER_DESC_oe_clim_immunity_recovery_mod:0 "劫后新生世代逐步建立稳固群体免疫，重修梯田、城邦与部族联盟，美洲大地迎来漫长而坚韧的人口复苏。"
 STATIC_MODIFIER_NAME_oe_clim_syncretic_medicine_mod:0 "本草药学与种痘防卫体系"
 STATIC_MODIFIER_DESC_oe_clim_syncretic_medicine_mod:0 "融汇本土百草药方与人痘接种防疫经验，建立起足以抵御旧大陆烈性传染病的常设医防体系。"
 STATIC_MODIFIER_NAME_oe_clim_cholera_port_cordon_mod:0 "海港检疫封航与石灰消毒令"
 STATIC_MODIFIER_DESC_oe_clim_cholera_port_cordon_mod:0 "对抵港商船实施严厉检疫并动员市政人员以生石灰清涤棚户水井，以短期海贸代价压制霍乱蔓延。"
 STATIC_MODIFIER_NAME_oe_clim_cholera_municipal_wards_mod:0 "市立隔离病房与沸水净饮令"
 STATIC_MODIFIER_DESC_oe_clim_cholera_municipal_wards_mod:0 "征用仓房设立隔离病房并强制推行沸水净饮与清扫沟渠，在不彻底锁死港口的前提下遏制死亡攀升。"
 STATIC_MODIFIER_NAME_oe_clim_sanitary_waterworks_mod:0 "近代净水管道与下水道工程"
 STATIC_MODIFIER_DESC_oe_clim_sanitary_waterworks_mod:0 "兴建砖砌暗渠下水道、砂滤自来水厂并绘测水井疫源图，从根源上斩断近代工业都市的水源霍乱循环。"
 STATIC_MODIFIER_NAME_oe_clim_public_health_board_mod:0 "全国公共卫生监察总局"
 STATIC_MODIFIER_DESC_oe_clim_public_health_board_mod:0 "设立常任公共卫生监察署，推行跨港检疫协定与死因统计册，将抗疫惨痛教训升华为近代公共卫生治理。"
 STATIC_MODIFIER_NAME_oe_clim_crop_acclimatization_mod:0 "官营新大陆作物驯化苗圃"
 STATIC_MODIFIER_DESC_oe_clim_crop_acclimatization_mod:0 "官办试种苗圃在沿海与山地分试新大陆良种，大幅缩短新作物水土驯化周期并稳定首轮收成。"
 oe_clim_virgin_soil_pox:0 "哥伦布大交换处女地天花"
 oe_clim_virgin_soil_pox_desc:0 "1510年至1620年间随跨大西洋航线传入缺乏抗体人群的烈性天花疫潮，席卷沿海城邦与河谷重镇，最终在新生世代逐步建立群体免疫后渐趋平息。"
 oe_clim_virgin_soil_pox_location_modifier:0 "[location|e]的处女地天花疫潮"
 oe_clim_industrial_cholera:0 "十九世纪港市与工业霍乱"
 oe_clim_industrial_cholera_desc:0 "1815年至1836年间沿近代航运与拥挤工业码头肆虐的水源性霍乱，重创排水失修的港市，直至过滤净水厂、砖砌下水道与公共卫生检疫署将其彻底遏制。"
 oe_clim_industrial_cholera_location_modifier:0 "[location|e]的近代港市霍乱"
 oe_clim_choose_eternal_steppe_tt:0 "我们重申 #Y 长生天游牧大汗之道#!，保留移动军政体制并获得无与伦比的骑兵机动与严冬统御。"
 oe_clim_sedentarize_horde_tt:0 "我部游牧军政体制将平稳改制为 #Y 定居化火器君主国#!，开启现代田赋与火炮军制新纪元。"
 oe_clim_granary_buy_food_tt:0 "官府度支将在首都所属[market|e]真实采买大宗主粮，并火速调运至最多 #Y 4#! 个饥荒或余粮吃紧的[provinces|e]。"
 oe_clim_dec_nomad_way.title:0 "定鼎草原汗国百年国策"
 oe_clim_dec_nomad_way.desc:0 "面对火器普及、筑城林立与严寒考验，我部游牧军政汗国必须抉择百年归宿：或坚守长生天游牧大汗的铁骑与严冬主场，或彻底定居改制为根基稳固的火器君主王朝。"
 oe_clim_dec_nomad_way.a:0 "召开大忽里台定鼎国策"
 oe_clim_dec_nomad_way_tt:0 "召开决定性的 #Y 草原十字路口#! 大议，在「长生天游牧大汗」与「定居火器王朝」两条道路间作出终极抉择。"
 oe_clim_dec_granary_market_relief.title:0 "常平仓跨市采买平粜赈灾"
 oe_clim_dec_granary_market_relief.desc:0 "当小冰期严寒或灾荒令粮仓告急时，朝廷可遣使携真金白银入市采买主粮现货，急运赈济濒临饥荒的行省。"
 oe_clim_dec_granary_market_relief.a:0 "入市购粮并急运赈省"
 oe_clim_dec_granary_market_relief_tt:0 "直接从首都所属[market|e]采买区域主粮并补充饥荒[provinces|e]存粮（冷却10年）。"
 oe_clim_dec_adopt_new_world_crops.title:0 "官颁推广美洲高产新作物"
 oe_clim_dec_adopt_new_world_crops.desc:0 "源自美洲的番薯、马铃薯与玉米耐寒耐旱耐贫瘠，在旧大陆谷物绝收的山地与寒坡仍能丰产。由朝廷兴办苗圃并颁种推广，可为王朝筑起抵御小冰期大饥的铁壁。"
 oe_clim_dec_adopt_new_world_crops.a:0 "拨银设苗圃并颁行新农书"
 oe_clim_dec_adopt_new_world_crops_tt:0 "启动适配本区域的 #Y 番薯、马铃薯或玉米#! 引种大计，显著提升乡野粮食产出与抗灾韧性。"
 oe_clim.1.title:0 "白灾肆虐：寒冰封锁冬窝牧场"
 oe_clim.1.desc:0 "一场罕见的冻雨在草原表层结成坚硬冰壳，牛羊无法刨雪啃草。若不能迅速统筹避风河谷冬窝或沿驿道急调干草，不等开春，各部畜群与我军铁骑都将陷入饥毙绝境。"
 oe_clim.1.a:0 "开放汗廷避风河谷冬窝与各部共度严冬"
 oe_clim.1.b:0 "急征干草燕麦优先保住精锐战马军团"
 oe_clim.2.title:0 "草原十字路口"
 oe_clim.2.desc:0 "大汗金帐之内，铁炮铸师、文官税吏与白发那颜争论不休。一派力主坚守移动斡耳朵与长生天古制，以无敌骑兵与寒冬机动纵横欧亚；另一派则主张入城建政、清丈田赋并大兴火炮，将游牧汗国彻底改制为永固基业的定居火器王朝。"
 oe_clim.2.a:0 "坚守长生天游牧大汗之道——马鞍即是吾王座！"
 oe_clim.2.b:0 "定居建城，改制为近世火器君主王朝！"
 oe_clim.3.title:0 "伊尔汗国遗绪"
 oe_clim.3.desc:0 "在两河冲积平原与伊朗高原之间，我部草原铁骑统御着古老的灌溉城邑与繁华巴扎。若能以波斯文官底万统筹财赋，抑或继续倚重草原那颜万户，将决定我部在伊尔汗故地的兴衰走向。"
 oe_clim.3.a:0 "起用波斯文官底万编纂绿洲与牧群统一税册"
 oe_clim.3.b:0 "确认那颜万户的传统牧场份地与骑兵军权"
 oe_clim.4.title:0 "东方诸王封地"
 oe_clim.4.desc:0 "镇守漠南与辽东草原的诸王掌握着辽阔牧场与贯通中原、漠北的站赤驿道。商旅恳请重开茶马互市以易粮布，而边将则呼吁加筑驿堡、充实骑哨以备不虞。"
 oe_clim.4.a:0 "沿南口关隘特许定期茶马互市以通粮货"
 oe_clim.4.b:0 "整饬站赤驿堡并扩编亲王怯薛轻骑哨探"
 oe_clim.5.title:0 "草原大法典与内亚绿洲商道"
 oe_clim.5.desc:0 "在天山隘口、阿尔泰夏牧场与钦察草原之上，诸部常因井泉草场与绿洲商税纷争不休。颁行统一的草原大法典，抑或将骑兵编为丝路商队护卫以收厚利，皆可为汗国奠定长久之计。"
 oe_clim.5.a:0 "向各部颁行草原大法典以定轮牧与法纪"
 oe_clim.5.b:0 "派骑兵护卫绿洲商道并兴建官营驿馆收税"
 oe_clim.6.title:0 "蔽日火山灰"
 oe_clim.6.desc:0 "淡铜色的薄霾笼罩天际，仲夏飞霜、麦稻绝收与连月暴雪席卷半个地球。钦天监与星象家议论远方火山喷发，而各地督抚急报：仓廪渐空、流民四起，若不及时赈抚必生大变。"
 oe_clim.6.a:0 "下诏蠲免荒年钱粮并缓征旧欠以安民心"
 oe_clim.6.b:0 "严禁余粮外运并充实官府常备越冬粮仓"
 oe_clim.7.title:0 "大河坚冰封航与冰上冬市"
 oe_clim.7.desc:0 "往日千帆竞发的运河、大江与海峡竟结起数尺坚冰，漕船与粮驳困死冰面数月动弹不得。水上补给线陷入瘫痪，而胆大的市民与行商却在冰冻河面上搭起了热闹的冬市棚摊。"
 oe_clim.7.a:0 "调集官营冰橇驿队与破冰船夫强通冬季粮道"
 oe_clim.7.b:0 "减免封港停航杂税并特许举办有序的冰上冬市"
 oe_clim.8.title:0 "严寒粮荒与城厢抢米风潮"
 oe_clim.8.desc:0 "连年酷寒歉收令各大市镇米面价格暴涨三倍，饥肠辘辘的市民围堵粮行与官仓。朝廷必须立刻抉择：动用国库向市场购粮平粜施粥，抑或遣兵强征乡间余粮以保京畿军需。"
 oe_clim.8.a:0 "立刻动用国库入市购粮并推行平价官粮与义粥"
 oe_clim.8.b:0 "派遣军管征粮队强行查抄地方囤粮专供重镇"
 oe_clim.9.title:0 "常平仓显威：跨市采买平粜稳粮"
 oe_clim.9.desc:0 "度支官署将常平仓古制化为真实高效的跨区调度：以实银在区域市场大宗采买主粮，组织船队与车帮星夜驰援饥荒行省，在流民四散之前稳住粮价与生计。"
 oe_clim.9.a:0 "由官署直接从区域市场大宗购粮并拨付饥荒行省"
 oe_clim.9.b:0 "特许官督商办粮商团承担跨区采买与平价运粜"
 oe_clim.10.title:0 "大兴水利：石砌堤防与梯田蓄水"
 oe_clim.10.desc:0 "小冰期不仅酷寒漫长，更伴随大旱与冰融洪涝交替肆虐。水利河工与农官奏请大修石砌长堤、蓄水陂塘，或统筹官营薪炭林与泥炭采场，令王朝腹地足以安渡数十年气候剧变。"
 oe_clim.10.a:0 "拨发巨款大修河堤石坝、排灌渠系与山地陂塘"
 oe_clim.10.b:0 "开辟官营薪炭林与泥炭采场以保寒冬柴薪工坊"
 oe_clim.11.title:0 "漂洋金薯"
 oe_clim.11.desc:0 "往返吕宋的海商将耐旱番薯藤绞入缆绳带回闽粤，又携来成袋金黄玉米。在稻麦遇旱即枯的丘陵坡地与沙洲荒壤上，这些漂洋过海的新大陆作物竟结出惊人丰收，令乡民奉为救荒奇宝。"
 oe_clim.11.a:0 "广颁番薯藤苗鼓励山地垦殖以彻底弭平荒灾"
 oe_clim.11.b:0 "官刻新农书并令州县劝农司推广玉米与轮作之法"
 oe_clim.12.title:0 "冻土下的宝藏"
 oe_clim.12.desc:0 "曾被视作奇花异草的安第斯马铃薯，在欧亚北部的凛冽霜风中展露出惊人价值。它深埋土下，既不怕晚霜冻害，也难被过境骑兵焚毁，每亩热量产出竟达黑麦与燕麦的三倍之多。"
 oe_clim.12.a:0 "免税鼓励北方各省农庄全面扩种高产马铃薯"
 oe_clim.12.b:0 "兴办王室示范农庄并令领主庄园定额配发薯种"
 oe_clim.13.title:0 "旱地金穗"
 oe_clim.13.desc:0 "从小亚细亚与巴尔干山坡，到尼罗河畔、德干高原与西非草原，美洲玉米以惊人速度扎根繁衍。它生长期短、耐旱高产，既为村落奉上金黄口粮，又为耕牛战马提供丰美草料。"
 oe_clim.13.a:0 "在旱区与山地行省全面推广自耕农玉米梯田"
 oe_clim.13.b:0 "以充裕玉米饲料带动畜牧肥育与市镇肉粮贸易"
 oe_clim.14.title:0 "哥伦布作物丰收潮与人口新纪元"
 oe_clim.14.desc:0 "美洲薯类与玉米扎根数十载后，笼罩王朝的小冰期饥荒阴霾终于散去。各地粮仓充盈，原本荒芜的山地遍布新村，低廉充沛的主粮正源源不断地托举起新一轮人口与工商勃兴。"
 oe_clim.14.a:0 "扶植乡野自耕农与荒地新垦，夯实人口长远根基"
 oe_clim.14.b:0 "借低廉粮价壮大市镇工坊、行会与港埠商贸"
 oe_clim.15.title:0 "无声烈火"
 oe_clim.15.desc:0 "随跨洋接触登陆的陌生烈性天花在毫无抗体的人群中如野火般蔓延。整村整族同时病倒，田亩荒芜、政令受阻，部族议事会与君主必须立刻决断避疫封锁或共济救护之策。"
 oe_clim.15.a:0 "封锁隘口并将大邑人群疏散至高山清净避疫地"
 oe_clim.15.b:0 "组织部族草药看护并开仓共济玉米以免次生饥荒"
 oe_clim.16.title:0 "劫后重生"
 oe_clim.16.desc:0 "历经一代人的惨痛煎熬后，无声烈火终不再所向披靡。幸存者后代对天花展现出越来越强的抵抗力，各地城邦将祖传本草医术与隔离防疫经验融为一体，重建起生机勃勃的家园。"
 oe_clim.16.a:0 "大举重垦荒废河谷梯田，迎来人口与城邦复兴"
 oe_clim.16.b:0 "资助融合本草药方与种痘之术的新式医馆行会"
 oe_clim.17.title:0 "码头蓝死病"
 oe_clim.17.desc:0 "飞驰的远洋商船与拥挤的工业码头将一种可怕的水源烈疫带遍四海。在污水渗入水井的棚户陋巷中，患者往往数小时内脱水殒命。港埠官署必须在严厉海港封锁与全城救治间果断决断。"
 oe_clim.17.a:0 "实行严厉海港检疫封航并强制生石灰清涤棚户"
 oe_clim.17.b:0 "征设市立隔离病房并全城强制推行沸水净饮令"
 oe_clim.18.title:0 "净水与暗渠"
 oe_clim.18.desc:0 "医师们一笔一画绘出的死因分布图终于揭穿了元凶：受污染的市政水井与露天污水沟。高瞻远瞩的工程师与医界泰斗联名上书，力主兴建砂滤自来水网、砖砌下水暗渠并常设公共卫生总局。"
 oe_clim.18.a:0 "倾力兴建近代砖砌下水暗渠与砂滤自来水厂"
 oe_clim.18.b:0 "常设全国公共卫生监察总局并缔结跨港检疫协约"
