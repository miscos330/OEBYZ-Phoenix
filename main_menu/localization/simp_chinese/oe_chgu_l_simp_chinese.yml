 oe_chgu_dec_summon_transoxiana_amirs.title:0 "召见河中与锡尔河诸阿米尔"
 oe_chgu_dec_summon_transoxiana_amirs.desc:0 "由阿力麻里汗廷颁降金牌，召见费尔干纳、石国—讹答剌、撒马尔罕与塔里木诸阿米尔赴会。赐赏金银可降低全部阿米尔独立倾向#G -15#!、提升察合台汗廷权威#G +10#!，并向府库空虚的万户拨发冬粮津贴，每#Y 5#!年可行一次。"
 oe_chgu_dec_summon_transoxiana_amirs.a:0 "颁降金牌会盟，安抚十七万户阿米尔"
 oe_chgu_dec_integrate_fergana_otrar.title:0 "整并费尔干纳—讹答剌丝路走廊"
 oe_chgu_dec_integrate_fergana_otrar.desc:0 "当汗廷威望稳固且安集延与赭石镇尽在掌握时，将费尔干纳万户与石国—讹答剌万户由自治的察合台阿米尔兀鲁思改制为可正常外交吞并的附庸，打通自七河直抵锡尔河与费尔干纳谷地的直辖丝路走廊。"
 oe_chgu_dec_integrate_fergana_otrar.a:0 "改制费尔干纳与石国—讹答剌为可吞并附庸"
 oe_chgu_dec_proclaim_moghulistan_revival.title:0 "宣示蒙兀儿斯坦中兴大业"
 oe_chgu_dec_proclaim_moghulistan_revival.desc:0 "无论在1347年东西分裂之后抑或十四世纪中叶风云际会之际，号召阿力麻里、仰吉八里、喀什噶尔与高昌东翼诸部重整察合台草原正统。若为游牧汗国则部落团结度#G +20#!，大幅安抚朵豁剌惕、高昌与别失八里—叶密立三翼，并赋予#Y 35#!年中兴强军增益。"
 oe_chgu_dec_proclaim_moghulistan_revival.a:0 "高举蒙兀儿斯坦中兴大纛，凝聚东翼诸部"
 STATIC_MODIFIER_NAME_oe_chgu_mod_ulus_frontier_garrison:0 "察合台万户边屯冬储"
 STATIC_MODIFIER_DESC_oe_chgu_mod_ulus_frontier_garrison:0 "依托绿洲冬粮囤仓与天山牧场补给线，该察合台实封万户在严冬与边防戍守期间军资充裕、无惧断粮。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_west_amir_confed:0 "西察合台阿米尔联盟体制"
 STATIC_MODIFIER_DESC_oe_chgu_mod_west_amir_confed:0 "摆脱阿力麻里东廷羁縻后，西察合台十四阿米尔各展旌旗，凭借河中绿洲商税与突厥—蒙古骑军在两河之间纵横驰骋。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_qazaghan_hegemony:0 "加兹罕河中霸权"
 STATIC_MODIFIER_DESC_oe_chgu_mod_qazaghan_hegemony:0 "击溃合赞汗并合纵合剌温纳与河中诸部后，大异密加兹罕以盟主之尊号令西察合台群雄，奠定河中阿米尔分治格局。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_east_moghul_wing:0 "东察合台东翼忠藩"
 STATIC_MODIFIER_DESC_oe_chgu_mod_east_moghul_wing:0 "天山南北与塔里木诸部恪守东察合台旧约，朵豁剌惕、高昌与别失八里—叶密立三翼同心拱卫蒙兀儿斯坦汗廷。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_moghulistan_khanate:0 "东察合台（蒙兀儿斯坦）汗统"
 STATIC_MODIFIER_DESC_oe_chgu_mod_moghulistan_khanate:0 "纵使河中十四阿米尔脱离直辖，东察合台仍完整承袭七河、准噶尔与塔里木草原正统，厉兵秣马以待重光西域。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_dec_amir_summons:0 "河中与锡尔河诸阿米尔会盟"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dec_amir_summons:0 "费尔干纳、石国—讹答剌与河中诸部阿米尔齐聚汗廷重申效忠，令十七万户政令畅通、离心暂息。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_dec_fergana_otrar_corridor:0 "费尔干纳—讹答剌丝路走廊整并"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dec_fergana_otrar_corridor:0 "将安集延、赭石镇与讹答剌纳入中枢直辖整合轨道后，锡尔河粮仓与费尔干纳丝路关隘源源不断充实大汗府库。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_dec_moghulistan_revival:0 "蒙兀儿斯坦中兴大业"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dec_moghulistan_revival:0 "阿力麻里、别失八里—叶密立、喀什噶尔与高昌诸部精诚团结，蒙兀儿斯坦铁骑军威重振、再现天山雄风。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_fergana_silk_tax:0 "费尔干纳丝路商税特许"
 STATIC_MODIFIER_DESC_oe_chgu_mod_fergana_silk_tax:0 "安集延、阿克西与奥什施行宽平合理的丝路过境榷税，吸引河中与喀什商队昼夜穿梭于费尔干纳谷地。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_fergana_tribute:0 "费尔干纳重赋征榷"
 STATIC_MODIFIER_DESC_oe_chgu_mod_fergana_tribute:0 "汗廷向富庶的费尔干纳绿洲加征银赋与丝税，虽使大汗府库立见充盈，却也悄然助长了地方阿米尔的离心暗潮。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_otrar_border_watch:0 "讹答剌—石国锡尔河边防"
 STATIC_MODIFIER_DESC_oe_chgu_mod_otrar_border_watch:0 "自赭石镇、讹答剌至突厥斯坦密布骑哨与边堡，严密扼守锡尔河渡口，令北方白帐骑兵不敢轻越雷池。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_syr_darya_truce:0 "锡尔河草场互市和约"
 STATIC_MODIFIER_DESC_oe_chgu_mod_syr_darya_truce:0 "讹答剌与昔格纳克划界定牧、罢兵互市，锡尔河两岸重归安宁，钦察草原与河中之间的商旅再度畅行无阻。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_beshbalik_marches:0 "别失八里—叶密立北疆戍骑"
 STATIC_MODIFIER_DESC_oe_chgu_mod_beshbalik_marches:0 "驻防仰吉八里、博尔塔拉与额敏河谷的精锐万户戍骑严阵以待，为伊犁中枢筑起抵御东方劲旅的北疆铁屏。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_dzungaria_caravans:0 "天山北道大元互市通使"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dzungaria_caravans:0 "仰吉八里、乌鲁木齐与高昌驿站联袂通好河西与大元边镇，天山北道茶马丝帛商队络绎不绝、税利倍增。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_qazaghan_crushed:0 "粉碎加兹罕河中兵变"
 STATIC_MODIFIER_DESC_oe_chgu_mod_qazaghan_crushed:0 "大汗果断挥师击溃加兹罕联盟，将1347年东西分裂的滔天巨澜遏止于萌芽，十七万户仍旧共奉阿力麻里白纛。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_west_council_pact:0 "西察合台十四阿米尔盟议"
 STATIC_MODIFIER_DESC_oe_chgu_mod_west_council_pact:0 "河中十四阿米尔订立盟议、共保商路，撒马尔罕、赭石镇与安集延等名城在群雄分治之局中依旧百业兴旺。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_west_iron_emir:0 "河中铁血阿米尔霸主"
 STATIC_MODIFIER_DESC_oe_chgu_mod_west_iron_emir:0 "摒弃松散会盟的权宜之计，雄主扩充铁骑劲旅、以铁血兵威震慑四邻，蓄势待发以图统一整个河中大地。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_tughlugh_islam:0 "秃黑鲁帖木儿伊斯兰圣旗"
 STATIC_MODIFIER_DESC_oe_chgu_mod_tughlugh_islam:0 "阿力麻里、别失八里—叶密立与朵豁剌惕共奉伊斯兰正教，草原部众与塔里木绿洲凝为一体，汗国士气大振。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_tianshan_pluralism:0 "天山草原多教并容旧宪"
 STATIC_MODIFIER_DESC_oe_chgu_mod_tianshan_pluralism:0 "恪守成吉思汗多教并容遗训，令长生天牧部、高昌佛寺、景教文士与绿洲商贾齐心效忠东察合台汗廷。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_moghul_west_campaign:0 "秃黑鲁帖木儿西征河中大军"
 STATIC_MODIFIER_DESC_oe_chgu_mod_moghul_west_campaign:0 "东察合台精骑如风暴般越过锡尔河与费尔干纳山口，誓将河中十四阿米尔重新纳入察合台汗统之下。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_moghul_home_bastion:0 "七河与准噶尔天山壁垒"
 STATIC_MODIFIER_DESC_oe_chgu_mod_moghul_home_bastion:0 "大汗暂缓远征河中，专心经营阿力麻里、仰吉八里与喀什噶尔防务与农牧屯储，将天山南北化为铜墙铁壁。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_chg_centralization_triumph:0 "大一统察合台枢密中枢"
 STATIC_MODIFIER_DESC_oe_chgu_mod_chg_centralization_triumph:0 "伊犁、费尔干纳、石国—讹答剌与别失八里—叶密立尽归一体，察合台汗国彻底跨越藩镇分裂，跻身欧亚丝路霸主之列。"
 STATIC_MODIFIER_NAME_oe_chgu_mod_chg_steppe_supremacy:0 "察合台永恒铁骑汗国"
 STATIC_MODIFIER_DESC_oe_chgu_mod_chg_steppe_supremacy:0 "合东西两翼十七万户精锐于一炉，察合台铁骑雄踞帕米尔至阿尔泰山中亚通衢，所向披靡、威加四海。"
 oe_chgu.1.title:0 "费尔干纳丝路榷税与天山商道"
 oe_chgu.1.desc:0 "满载布哈拉锦缎、巴达赫尚青金石与喀什美玉的商队终年穿行于安集延、阿克西与奥什之间的天山隘口。新近实封的费尔干纳万户上书阿力麻里汗廷，恳请颁行宽平的丝路过境榷税特许以兴修驿馆；汗廷重臣中却有不少人主张趁谷地富庶加征重额银赋，以充实大汗府库。"
 oe_chgu.1.a:0 "颁行宽平丝路商税特许，厚抚费尔干纳万户"
 oe_chgu.1.b:0 "向安集延与阿克西加征重额王室银赋"
 oe_chgu.2.title:0 "锡尔河畔：讹答剌与白帐边衅"
 oe_chgu.2.desc:0 "在讹答剌、突厥斯坦与昔格纳克交界的锡尔河芦苇湿地，金帐左翼白帐的游骑近来屡屡与我石国—讹答剌万户巡哨争夺冬牧草场与商队渡口。赭石镇守将急请大汗增援边屯、严防北寇，草原使臣则建议与昔格纳克划界定牧、以和议保住通往萨莱的北方商路。"
 oe_chgu.2.a:0 "增援讹答剌与赭石镇万户戍军，严守锡尔河边防"
 oe_chgu.2.b:0 "与北方草原订立锡尔河草场互市和约"
 oe_chgu.3.title:0 "别失八里—叶密立：准噶尔与元廷边务"
 oe_chgu.3.desc:0 "天山雪岭北麓，别失八里—叶密立万户扼守着自仰吉八里、乌鲁木齐至额敏河谷的广袤草原通衢，东接大元甘肃行省边镇与阿尔泰山牧场。仰吉八里那颜奏报东方瓦剌与窝阔台余部牧骑蠢蠢欲动、亟须严整北疆防务，高昌商帮则力陈应借通使互市畅通天山北道财源。"
 oe_chgu.3.a:0 "严整别失八里—叶密立北疆戍骑，固守准噶尔门户"
 oe_chgu.3.b:0 "借仰吉八里与高昌通使河西，大兴天山北道互市"
 oe_chgu.4.title:0 "1347年加兹罕兵变与东西察合台决裂"
 oe_chgu.4.desc:0 "阿力麻里草原汗廷与河中定居突厥—蒙古阿米尔之间的积怨终于在1347年彻底爆发。合剌温纳大异密加兹罕振臂一呼，串联起撒马尔罕、布哈拉、巴尔赫、巴鲁剌思、费尔干纳与石国—讹答剌等西翼十四个阿米尔兀鲁思公开抗命；天山以东唯有朵豁剌惕、高昌与别失八里—叶密立三翼仍奉大汗为共主——察合台汗国已站在彻底东西分立的生死关口。"
 oe_chgu.4.a:0 "东西分家已成定局：西翼十四阿米尔自立，东翼三部重立东察合台"
 oe_chgu.4.b:0 "倾举国铁骑西讨加兹罕，死守察合台一统！（反制线）"
 oe_chgu.5.title:0 "西察合台十四阿米尔同盟与河中争雄"
 oe_chgu.5.desc:0 "阿力麻里的号令在锡尔河以西灰飞烟灭之后，合剌温纳、亚萨兀里、巴鲁剌思、费尔干纳与石国—讹答剌等十四个阿米尔政权各以本色旗号割据河中绿洲。名义上的傀儡可汗受制于加兹罕之手，河中群雄正面临抉择：是共守十四阿米尔盟议以保商贸繁荣，还是扩军厉兵以铁血争夺撒马尔罕独尊霸业？"
 oe_chgu.5.a:0 "共守十四阿米尔盟议，保全河中绿洲商贸繁华"
 oe_chgu.5.b:0 "厉兵秣马扩编铁骑，问鼎河中独尊霸权"
 oe_chgu.6.title:0 "秃黑鲁帖木儿皈依与蒙兀儿斯坦重整"
 oe_chgu.6.desc:0 "纵横七河、准噶尔与塔里木盆地，在喀什噶尔朵豁剌惕异密拥戴下即位的秃黑鲁帖木儿汗正面临立国信仰的重大抉择。率阿力麻里与别失八里—叶密立草原诸部皈依伊斯兰正教，可借宗教纽带牢牢凝聚喀什绿洲并为日后西征河中大造声势；若恪守成吉思汗多教并容古宪，则可稳住高昌佛寺与东疆长生天牧部。"
 oe_chgu.6.a:0 "率阿力麻里与别失八里—叶密立皈依逊尼派，凝聚东察合台"
 oe_chgu.6.b:0 "恪守成吉思汗多教并容古宪，广纳天山百教商民"
 oe_chgu.7.title:0 "秃黑鲁帖木儿西征河中"
 oe_chgu.7.desc:0 "随着河中盟主加兹罕遇刺身亡，西察合台十四个阿米尔政权自赭石镇、费尔干纳至撒马尔罕与巴尔赫陷入混战内讧。坐镇伊犁河谷与别失八里—叶密立的东察合台大军摩拳擦掌：是趁河中群龙无首挥师西渡锡尔河、一举重圆察合台旧土，还是立足天山南北深耕屯牧、永固蒙兀儿斯坦根基？"
 oe_chgu.7.a:0 "铁骑西渡锡尔河，经讹答剌与费尔干纳光复河中！"
 oe_chgu.7.b:0 "暂缓西征，全力固守七河、叶密立与塔里木壁垒"
 oe_chgu.8.title:0 "察合台集权大成：天山与河中复归一体"
 oe_chgu.8.desc:0 "历经十四世纪中叶草原分崩离析的严酷考验，阿力麻里的察合台白纛再度统御自仰吉八里、伊犁河谷经费尔干纳与石国—讹答剌直抵河中腹地的万里丝路通衢。长老、文书官与诸万户将领齐聚汗廷，恭请大汗定鼎国策：是以枢密文治铸就永固的丝路大帝国，还是以无敌铁骑重现草原大汗雄威？"
 oe_chgu.8.a:0 "定鼎大一统察合台枢密文治，永固丝路霸业"
 oe_chgu.8.b:0 "加冕察合台永恒铁骑大汗，以武威震慑欧亚"
