l_simp_chinese:
 oe_aip_imperial_restorer: "帝国中兴者"
 oe_aip_imperial_restorer_desc: "该国以光复历史帝国故土、强化中枢控制度与常备兵员为志，在财政与国内稳健时沿历史核心走廊主动收复失地。"
 oe_aip_thalassocracy_hegemon: "海权商贸霸主"
 oe_aip_thalassocracy_hegemon_desc: "该国专注远洋贸易、港口据点、殖民商道与审慎和谈，严格回避在缺乏海运依托的深广内陆陷入消耗战。"
 oe_aip_celestial_suzerain: "天朝怀柔宗主"
 oe_aip_celestial_suzerain_desc: "执掌天命之朝廷以安邦固本、礼治藩属与怀柔四夷为纲，重朝贡羁縻而慎启无名兵端，避免过度兼并贫瘠外域。"
 oe_aip_gunpowder_conqueror: "火药征服者"
 oe_aip_gunpowder_conqueror_desc: "正值火药军事革新的强势帝国敢于果断用兵、收束阶层特权并连续扩张，在战意与国力鼎盛期主动打破地区僵局。"
 oe_aip_enlightened_reformer: "开明维新君主"
 oe_aip_enlightened_reformer_desc: "步入近世启蒙阶段的开明朝廷优先吸纳新思潮、推动社会变革与文教通商，以审慎有序的内政革新引领时代。"
 oe_aip_concert_balancer: "均势协调家"
 oe_aip_concert_balancer_desc: "坐镇万国协调会或直面霸权失衡的列强崇尚多边外交、集体防卫与公允和约，着力维系欧亚均势并遏制单极霸主。"
