 oe_aip.90.title: "【槽位 95 读数】史诗 AI 性格与欧亚全局编排"
 oe_aip.90.desc: "#T 第 18 条规则与同步时钟#!\n· 生效模式：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_rule_mode')|0]（1=标准全开 / 2=仅协调会·关性格切换 / 3=关闭）｜热切覆盖值：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_override')|0]｜性格切换开关：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_pers_enabled')|0]\n· 累计同步次数：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_sync_runs')|0]｜最近同步年月：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_last_y')|0].[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_last_m')|0]（错峰 6 月 / 12 月，避开 3 月财政管家）\n\n#T 六大动态史诗 AI 性格全球分布#!（合计 [ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_total')|0] 国）\n· 1 帝国中兴者：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_1')|0] ｜ 2 海权商贸霸主：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_2')|0] ｜ 3 天朝怀柔宗主：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_3')|0]\n· 4 火药征服者：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_4')|0] ｜ 5 开明维新君主：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_5')|0] ｜ 6 均势协调家：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_6')|0]\n\n#T 财政紧缩让位保护与协调会联动#!\n· 财政紧缩受保护国数（oe_ai2_fiscal_austerity）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_cnt_austerity')|0]｜让位自检结果：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_guard_test')|0]（0=未测 / 1=通过·未覆盖 / 2=异常）\n· 万国协调会存在：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_concert_exists')|0]｜成员数：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_concert_members')|0]｜本国性格码：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_self_pers')|0]｜本国协调席位码：[ROOT.GetCountry.MakeScope.ScriptValue('oe_aip_rd_self_concert')|0]（2=五强 / 1=成员 / 0=非成员）"
