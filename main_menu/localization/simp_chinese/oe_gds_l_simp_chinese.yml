l_simp_chinese:
# NEW 2026-11-23 v19.0 Module 19.0-A: Strategic Trade Goods, Great Intercontinental Canals, Pop Social Mobility & Late-Game Situations Bridges (oe_gds_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v190_goods_canals.py; edit the generator, not this file.
 oe_refined_steel: "坩埚与转炉精炼钢"
 oe_refined_steel_desc: "经密封黏土坩埚与鼓风转炉精炼而成的纯净高碳钢，广泛用于精密火炮、铁道钢轨、航海天文钟游丝与近代重型机械。"
 oe_porcelain_tea_chests: "外销瓷茶箱"
 oe_porcelain_tea_chests_desc: "以精细青花外销瓷压舱、上覆防潮铅衬名茶的远洋特制货箱，是横贯欧亚与新大陆海上丝路最具暴利的顶级奢侈商品。"
 oe_industrial_chemicals: "纯碱、染料与工业化工品"
 oe_industrial_chemicals_desc: "由铅室硫酸法与纯碱工坊规模化产出的碱剂、漂白剂与色牢化学染料，为近代纺织、玻璃与彩瓷制造业提供核心原料。"
 oe_chronometers: "航海天文钟与精密仪器"
 oe_chronometers_desc: "配有常平架与温差补偿摆轮的黄铜航海天文钟、六分仪与测绘仪器，彻底破解远洋经度难题并引领近代航海与天文学革命。"
 oe_gds_steel_works: "坩埚与转炉精炼钢厂"
 oe_gds_steel_works_desc: "自1620年起可营建的高级冶金工场，以铁、煤与粗钢精炼坩埚及转炉精炼钢，同时显著提升当地钢材产量与城镇营建效率。"
 oe_gds_porcelain_export_kiln: "皇家外销瓷茶窑场"
 oe_gds_porcelain_export_kiln_desc: "自1560年起可营建的外销工艺窑场，将精瓷与名茶封装为防潮外销瓷茶箱，大幅提升当地商队运力与贸易中心实力。"
 oe_gds_chemical_manufactory: "纯碱与工业化工厂"
 oe_gds_chemical_manufactory_desc: "自1680年起可营建的近代化工工场，以海盐、明矾、染料与煤炭制取纯碱与工业化工品，并提升当地染料、明矾产出与生产效率。"
 oe_gds_chronometer_guild: "航海天文钟与精密仪器行会"
 oe_gds_chronometer_guild_desc: "自1710年起可营建的精密钟表与光学工坊，制造航海天文钟与测绘仪器，同步加快当地造船速度、海权存在感与思潮传播。"
 oe_gds_pm_crucible_refined_steel: "黏土坩埚精炼均质钢"
 oe_gds_pm_crucible_refined_steel_desc: "以耐火黏土坩埚在焦炭炉中重熔渗碳钢与熟铁，去除夹渣，浇铸组织致密的高碳均质精钢锭。"
 oe_gds_pm_bessemer_converter_steel: "鼓风转炉批量精炼钢"
 oe_gds_pm_bessemer_converter_steel_desc: "向倾转式炼钢炉底鼓入高温气流迅速脱碳，将铁水大批量转化为军工、铁道与船壳所需的优质精炼钢。"
 oe_gds_pm_canton_tea_porcelain_chests: "铅衬远洋外销瓷茶箱"
 oe_gds_pm_canton_tea_porcelain_chests_desc: "以防潮铅箔密封名茶并配装青花外销瓷器，置入坚固硬木箱中压舱防震，专供跨越重洋的万里海商航队。"
 oe_gds_pm_cobalt_chemical_export_chests: "精制钴彩珐琅御窑外销箱"
 oe_gds_pm_cobalt_chemical_export_chests_desc: "采用工业精制釉料、钴蓝彩剂与防潮蜡纸衬垫，批量烧制彩绘御瓷并配装上等名茶，风靡欧亚宫廷与商埠。"
 oe_gds_pm_leblanc_soda_vitriol: "铅室硫酸与纯碱制法"
 oe_gds_pm_leblanc_soda_vitriol_desc: "在铅衬反应室中以煤炭焙烧海盐、明矾与硝石，规模化制取纯碱、矿酸与纺织漂白化工试剂。"
 oe_gds_pm_industrial_dye_reagents: "蒸馏媒染剂与色牢化学染料"
 oe_gds_pm_industrial_dye_reagents_desc: "借玻璃曲颈甑蒸馏浓缩媒染剂与标准色锭，源源供应织造工场、彩瓷窑厂与精密玻璃作坊。"
 oe_gds_pm_brass_marine_chronometers: "常平架黄铜航海天文钟"
 oe_gds_pm_brass_marine_chronometers_desc: "精雕黄铜擒纵机构、光学透镜与镀金摆轮并配装常平架，使远洋舰队得以在大洋之上精准测定经度。"
 oe_gds_pm_precision_bimetallic_chronometers: "温差补偿双金属精密天文钟"
 oe_gds_pm_precision_bimetallic_chronometers_desc: "以精炼钢游丝、化学蚀刻银质刻度盘与光学六分仪棱镜成批装配全天候温补天文钟，武装帝国海军与科学院。"
 oe_gds_realm_urban_mobility_tt: "我国发展度最高的最多#Y 2#!座城镇或城市中，将有#G 农民#!人口晋升为城镇#G 劳工#!与#G 市民#!。"
 oe_gds_dec_suez_canal.title: "开凿苏伊士跨洲运河"
 oe_gds_dec_suez_canal.desc: "横穿苏伊士地峡开凿深水跨洲运河，将地中海畔的廷尼斯与红海畔的苏伊士直接相连。于世界地图上实际开通苏伊士运河航道，将两地升格为永久海运枢纽并促进市民阶层跃升，同时获得永久#G 苏伊士运河主权与通航红利#!修正。花费#Y 3000#!金币。"
 oe_gds_dec_suez_canal.a: "动工贯通红海与地中海"
 oe_gds_dec_panama_canal.title: "开凿巴拿马两洋运河"
 oe_gds_dec_panama_canal.desc: "在巴拿马地峡修建阶梯式巨石船闸，将丘丘雷斯与巴拿马城之间的两洋通道彻底贯通。于世界地图上实际开通巴拿马运河航道，将地峡双港打造为永久跨洋商贸枢纽并促进市民跃升，同时获得永久#G 巴拿马运河主权与两洋红利#!修正。花费#Y 3500#!金币。"
 oe_gds_dec_panama_canal.a: "凿通大西洋与太平洋水道"
 oe_gds_dec_kiel_canal.title: "开凿基尔波罗的海—北海运河"
 oe_gds_dec_kiel_canal.desc: "横穿荷尔斯泰因连接基尔峡湾与伦茨堡，修筑坚固海闸使波罗的海商船与海军免于绕行日德兰半岛。将基尔与伦茨堡升格为永久双海船闸港区并促进市民跃升，同时获得永久#G 基尔运河主权与双海优势#!修正。花费#Y 2200#!金币。"
 oe_gds_dec_kiel_canal.a: "贯通荷尔斯泰因双海运河"
 oe_gds_dec_volga_don_canal.title: "开凿伏尔加—顿河草原运河"
 oe_gds_dec_volga_don_canal.desc: "在伏尔加河畔的别利亚缅与顿河支流伊洛夫利亚之间以永久船闸取代古老陆上拖船道，贯通里海与黑海两大水系。全面提升两镇发展度、促进市民跃升，并获得永久#G 伏尔加—顿河运河主权红利#!修正。花费#Y 2000#!金币。"
 oe_gds_dec_volga_don_canal.a: "凿通伏尔加与顿河水系"
 oe_gds_dec_grand_canal_dredge.title: "敕修京杭大运河全线大疏浚"
 oe_gds_dec_grand_canal_dredge.desc: "调集天下河工与水利名臣疏浚淤塞闸口、重筑石岸减水坝，全面畅通自杭州经江都（扬州）、临清直抵大都的万里漕运动脉。永久强化沿线运河都会并促进市民跃升，同时获得永久#G 京杭大运河全线畅通盛世#!修正。花费#Y 2400#!金币。"
 oe_gds_dec_grand_canal_dredge.a: "兴工疏浚南北万里大运河"
 STATIC_MODIFIER_NAME_oe_gds_loc_suez_canal_hub: "苏伊士跨洲运河船闸枢纽"
 STATIC_MODIFIER_DESC_oe_gds_loc_suez_canal_hub: "深水运河船闸与花岗岩码头令苏伊士地峡化作贯通地中海与印度洋的黄金咽喉，商船云集、百业勃兴。"
 STATIC_MODIFIER_NAME_oe_gds_loc_panama_canal_hub: "巴拿马两洋运河船闸枢纽"
 STATIC_MODIFIER_DESC_oe_gds_loc_panama_canal_hub: "阶梯式巨石船闸将远洋商舰托举越过美洲分水岭，使大西洋与太平洋航线自此直通无阻。"
 STATIC_MODIFIER_NAME_oe_gds_loc_kiel_canal_hub: "基尔波罗的海—北海运河港区"
 STATIC_MODIFIER_DESC_oe_gds_loc_kiel_canal_hub: "坚固水闸与宽阔纤道使粮船、木材舰与战列舰无需绕行日德兰半岛即可直穿荷尔斯泰因通航两海。"
 STATIC_MODIFIER_NAME_oe_gds_loc_volga_don_canal_hub: "伏尔加—顿河草原运河闸口"
 STATIC_MODIFIER_DESC_oe_gds_loc_volga_don_canal_hub: "草原阶梯船闸将伏尔加河下游与顿河水系相连，开辟出一条从里海直通黑海的内陆航运大动脉。"
 STATIC_MODIFIER_NAME_oe_gds_loc_grand_canal_hub: "大运河疏浚御闸漕运枢纽"
 STATIC_MODIFIER_DESC_oe_gds_loc_grand_canal_hub: "重修石堤、减水坝与疏浚深槽令万艘漕粮、丝绸与外销瓷船昼夜往返江南与京师，沿河市镇繁华倍增。"
 STATIC_MODIFIER_NAME_oe_gds_mod_suez_canal_dominion: "苏伊士运河主权与通航红利"
 STATIC_MODIFIER_DESC_oe_gds_mod_suez_canal_dominion: "执掌苏伊士跨洲水道令欧亚海程骤减一半，滚滚通航关税与远洋战略投送能力尽归我朝。"
 STATIC_MODIFIER_NAME_oe_gds_mod_panama_canal_dominion: "巴拿马运河主权与两洋红利"
 STATIC_MODIFIER_DESC_oe_gds_mod_panama_canal_dominion: "扼守巴拿马船闸将大西洋与太平洋航网合二为一，免去绕行合恩角之险，极大延展商贸与舰队航程。"
 STATIC_MODIFIER_NAME_oe_gds_mod_kiel_canal_dominion: "基尔运河主权与双海优势"
 STATIC_MODIFIER_DESC_oe_gds_mod_kiel_canal_dominion: "直穿荷尔斯泰因的运河绕开了丹麦海峡关卡，将波罗的海粮木商贸与北海舰队枢纽无缝衔接。"
 STATIC_MODIFIER_NAME_oe_gds_mod_volga_don_canal_dominion: "伏尔加—顿河运河主权红利"
 STATIC_MODIFIER_DESC_oe_gds_mod_volga_don_canal_dominion: "贯通里海与亚速海将欧亚草原大河化作一体化的商贸、漕粮与帝国行政物流干道。"
 STATIC_MODIFIER_NAME_oe_gds_mod_grand_canal_dominion: "京杭大运河全线畅通盛世"
 STATIC_MODIFIER_DESC_oe_gds_mod_grand_canal_dominion: "全线疏浚畅通的大运河稳固北疆粮储，将江南财赋工坊与中枢王权紧密相连，国课充盈、海宇晏安。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_crucible_steel_crown: "御用坩埚与转炉精钢署"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_crucible_steel_crown: "帝国冶金署统一坩埚耐火料与转炉炼钢标准，令兵工厂、船坞与铁道工程的精钢供应稳健充沛。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_steel_guild_patents: "开放冶金行会精钢专利"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_steel_guild_patents: "各地民间铁匠与市民工场获准共享精钢冶炼专利，吸引大批乡民入城晋升为熟练工匠与市民。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_export_kiln_monopoly: "皇家外销瓷茶装运专卖署"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_export_kiln_monopoly: "官窑印记与海防茶引保障外销青花瓷与防潮茶箱品质如一，在海外诸港稳获高额白银溢价。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_export_tea_consortia: "自由海商瓷茶联合商帮"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_export_tea_consortia: "自泉州至君士坦丁堡的商帮合股筹资，派遣快船满载瓷茶箱往来万里海路，商力倍增。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_chemical_state_works: "官办纯碱与工业化工局"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_chemical_state_works: "官办铅室化工工坊稳定产出纯碱、硫酸与色牢染料，全面赋能织造、玻璃与军工火药百业。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_chemical_municipal_guilds: "市政药剂与漂染化工行会"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_chemical_municipal_guilds: "城镇染匠、药剂师与玻璃匠组成特许化工行会，普及新式工艺并带动城镇阶层向上跃升。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_admiralty_chronometers: "海军部制式航海天文钟"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_admiralty_chronometers: "凡主力战舰与远洋商船皆配发常平架精密天文钟，极大减少触礁迷航损耗并开辟远洋直航新线。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_horological_academies: "皇家钟表与精密仪器学院"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_horological_academies: "钟表大师与光学匠师在皇家学院授徒立说，培育出引领测绘、航海与近代精密机械的工匠世代。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_suez_open_toll: "苏伊士运河万国通航税约"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_suez_open_toll: "对各国和平商船施行公开定额通行税制，令苏伊士运河成为源源不断的关税宝库与外交佳话。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_suez_fortress_gate: "苏伊士要塞水师闸防"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_suez_fortress_gate: "沿河重炮台与铁闸要塞牢牢锁住两海咽喉，令唯独获我朝敕准之舰队方可自由穿梭红海与地中海。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_panama_free_port: "跨巴拿马地峡自由港商社"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_panama_free_port: "两洋河口皆设保税自由港与巨型栈房，使巴拿马运河成为大西洋与太平洋全球贸易的绝对中枢。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_panama_admiralty: "巴拿马两洋海军总督署"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_panama_admiralty: "地峡巨型船坞与要塞煤栈使一支主力舰队即可在加勒比海与环太平洋之间闪电机动、威慑两洋。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_kiel_free_channel: "基尔波罗的海免绕道商渠"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_kiel_free_channel: "商船队纷纷告别风急浪险的斯卡格拉克海峡，改走风平浪静的荷尔斯泰因运河，商行收益节节攀升。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_kiel_naval_basin: "基尔双海舰队机动母港"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_kiel_naval_basin: "基尔与伦茨堡的深水军港令舰队可在一夜之间于波罗的海与北海战区往复驰援，掌握北方海权。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_volga_don_trade_artery: "里海—黑海内河商贸大动脉"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_volga_don_trade_artery: "波斯生丝、阿斯特拉罕池盐与草原粮谷经伏尔加—顿河船闸直抵黑海与地中海商埠，货畅其流。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_volga_don_flotilla: "帝国草原内河水师与兵站"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_volga_don_flotilla: "内河炮艇与补给驳船编队将帝国威权与军需粮草疾速投送至黑海—里海草原疆域的每一座重镇。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_grand_canal_tribute_fleets: "大运河万艘漕粮官运舰队"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_grand_canal_tribute_fleets: "扩编后的漕运总督船队与闸官体系确保南北官仓丰盈无虞，纵逢旱涝亦能稳固京畿与边镇军民。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_grand_canal_merchant_locks: "大运河特许商帮闸口市镇"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_grand_canal_merchant_locks: "向私商瓷绸棉布驳船放宽过闸班期，令自杭州、江都至临清的沿河闸口纷纷崛起为富庶工商业都会。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_tordesillas_mare_liberum: "欧亚海洋自由法理宣言"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_tordesillas_mare_liberum: "严词驳斥伊比利亚瓜分世界的经线敕谕，本朝法学家与水师共同宣告：浩瀚大洋乃天下公海，非两王私产。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_tordesillas_eurasian_accord: "欧亚诸强平行海权协约"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_tordesillas_eurasian_accord: "联络地中海、印度洋与东亚各朝订立互惠通商海约，在伊比利亚势力圈之外构筑独立自主的远洋商网。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_antimeridian_convoys: "东方香料与白银大帆船护航队"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_antimeridian_convoys: "武装巨舶纵横马六甲、马尼拉、长崎与霍尔木兹之间的反子午线航道，牢牢掌握白银换瓷茶的全球暴利。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_antimeridian_straits: "海峡要冲帝国海事管辖权"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_antimeridian_straits: "常备巡洋舰队与海峡炮台宣示不容挑战的通行管辖权，将远来列强的垄断野心挡在要冲之外。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_escort_syndicate: "跨欧亚联防剿匪护航同盟"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_escort_syndicate: "联合快速护卫舰队清剿加勒比、巴巴里与马六甲海盗巢穴，为万里商道重塑安宁秩序。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_privateer_charters: "帝国私掠许可证与劫掠特许"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_privateer_charters: "颁授私掠敕令将桀骜海盗收编为替国效力的海上游击劲旅，专截敌国运银舰队并充盈国库。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_marine_insurance: "特许远洋海运保险公所"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_marine_insurance: "港埠海运承保商号以大数法则共担海难与劫掠风险，纵使海盗横行亦能令远洋信贷低息畅行。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_piracy_corsair_amnesty: "皇家海盗招安与引航水师"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_piracy_corsair_amnesty: "受诏招安的宿将海盗与走私舵手改任皇家海岸引航员与快舰管带，将隐秘航图化为帝国制海奇兵。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_constitutional_charter: "帝国宪章议政大会"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_constitutional_charter: "主动颁行立宪约法并召集议政大会，将汹涌革命思潮化作有序改革动力，文教与市民经济齐飞。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_legitimist_concert: "正统王权联防与御前书禁"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_legitimist_concert: "严密检视海外激进传单并强化卫戍，联合正统君主稳固皇权法度与各省行政直辖。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_civil_code: "统一民法典与任人唯贤官制"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_civil_code: "统一商事法典、统一度量衡并废除门第桎梏，令新兴市民与寒门俊彦源源涌入工商业与文官体系。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_traditional_estates: "维护传统等级与行省古法"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_traditional_estates: "重申贵族、教士与地方行省的古老特权，维系乡土秩序与法统连续，免受急进变法之震荡。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_constitutional_compact: "跨欧亚宪制和平公约"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_constitutional_compact: "欧亚诸立宪帝国与新政邦国共缔和平约章，推动自由通商、学术互鉴与近代国际法秩序。"
 STATIC_MODIFIER_NAME_oe_gds_mod_ev_rev_congress_of_crowns: "欧亚诸皇正统协调大会"
 STATIC_MODIFIER_DESC_oe_gds_mod_ev_rev_congress_of_crowns: "自君士坦丁堡、维也纳至莫斯科与大都的诸君共结正统同盟，以严明军纪与强固中枢维系欧亚均势。"
 oe_gds.1.title: "坩埚与转炉精炼钢的突破"
 oe_gds.1.desc: "冶金名匠攻克了耐火黏土坩埚与强鼓风脱碳技艺，将原本脆硬的生铁转化为纯净柔韧的精炼钢。炮厂、弹簧匠与造船坞争相求购，周边乡民也纷纷涌入炉火昼夜不熄的工业城镇，成长为产业劳工与新兴市民。"
 oe_gds.1.a: "设立御用坩埚与转炉精钢工场"
 oe_gds.1.b: "向民间冶金行会开放精钢专利"
 oe_gds.2.title: "青花外销窑与远洋瓷茶箱热潮"
 oe_gds.2.desc: "自广州、泉州至亚历山大与阿姆斯特丹的万里商埠间，远洋海商发明了一桩暴利绝配：以沉重坚固的外销青花瓷压舱，其上叠放防潮铅衬名茶箱。欧亚宫廷竞相抢购瓷茶箱，沿江沿海的窑工与打包工匠迅速崛起为殷实市民。"
 oe_gds.2.a: "设立皇家外销瓷茶装运专卖署"
 oe_gds.2.b: "特许海商瓷茶联合商帮自由出海"
 oe_gds.3.title: "铅室纯碱与工业化工革命"
 oe_gds.3.desc: "格致化学家不再受制于稀缺的草木灰与天然染料，他们在城镇建起铅室反应釜与玻璃蒸馏甑，直接以海盐、明矾与煤炭批量合成纯碱、硫酸与色牢媒染剂。织造、玻璃与彩瓷诸业由此迎来成倍跃升。"
 oe_gds.3.a: "兴建官办纯碱与工业化工工场"
 oe_gds.3.b: "特许市政药剂与漂染化工行会"
 oe_gds.4.title: "经度悬赏与精密航海天文钟"
 oe_gds.4.desc: "数百年来，远洋舰队一旦驶离海岸便只能靠推算航位估测经度，屡屡在暗礁之上折戟沉沙。如今，精密钟表大师献上配有温差补偿摆轮的常平架航海天文钟，纵使穿越赤道酷暑与怒海狂涛亦能分秒不差地校准经度。"
 oe_gds.4.a: "为皇家舰队与远洋商船配发制式天文钟"
 oe_gds.4.b: "敕建皇家钟表与精密仪器学院"
 oe_gds.5.title: "苏伊士运河通航：红海与地中海合流"
 oe_gds.5.desc: "礼炮轰鸣响彻大漠沙丘，最后一道土坝轰然掘开，地中海的碧波奔涌入渠，与红海怒涛融为一体。彩旗蔽空的帝国首航舰队缓缓驶过花岗岩船闸，自此欧亚海程骤减一半，全球海权格局为之改写。"
 oe_gds.5.a: "颁行苏伊士运河万国通航税约"
 oe_gds.5.b: "将苏伊士运河铸成帝国水师铁闸要塞"
 oe_gds.6.title: "巴拿马运河贯通：两洋锁钥初成"
 oe_gds.6.desc: "历经数载劈山凿石与克服丛林瘴疠，横跨巴拿马地峡的宏伟船闸终于轰然开启。人类史上首次有巨轮借阶梯水闸平稳越过美洲分水岭，无需绕行风暴肆虐的合恩角便从大西洋直入浩瀚太平洋。"
 oe_gds.6.a: "特许设立跨地峡自由港商社"
 oe_gds.6.b: "设立巴拿马两洋海军总督署"
 oe_gds.7.title: "基尔运河竣工：直穿荷尔斯泰因双海"
 oe_gds.7.desc: "自基尔峡湾经伦茨堡直抵北海河口的巨石船闸全线合龙，满载粮木的商船与主力战舰自此可在平静运河中直穿荷尔斯泰因。商贾欢呼免受北方海峡风浪与重税盘剥，水师将领更赞叹握住了两海机动捷径。"
 oe_gds.7.a: "开辟低税高效的波罗的海免绕道商渠"
 oe_gds.7.b: "扩建基尔双海舰队机动母港"
 oe_gds.8.title: "伏尔加—顿河运河合龙：里海黑海相连"
 oe_gds.8.desc: "昔日游牧部众与纤夫须在荒原旱地艰难拖舟越岭，如今别利亚缅与伊洛夫利亚之间的阶梯船闸令深吃水驳船自伏尔加河顺畅驶入顿河。波斯丝绸与草原麦粮自此水路直通黑海与地中海。"
 oe_gds.8.a: "大兴里海—黑海内河商贸大动脉"
 oe_gds.8.b: "编练帝国草原内河炮艇与兵站水师"
 oe_gds.9.title: "万里京杭大运河大疏浚告成"
 oe_gds.9.desc: "自丝绸云集的杭州启程，横渡江都浩荡长江，经临清税关直抵大都太仓，全线疏浚一新的运河深槽与石闸之上万帆竞发。沿河都会商贾云集、百工鳞次，南北帝国的经济命脉再度奔腾澎湃。"
 oe_gds.9.a: "扩编南北官运漕粮与御瓷舰队"
 oe_gds.9.b: "广开沿河特许商帮闸口市镇"
 oe_gds.10.title: "托尔德西里亚斯经线与欧亚海权之辩"
 oe_gds.10.desc: "舆图官将一具描金地球仪呈于御前：伊比利亚诸王竟以纸上经线贯通两极，妄图将远洋航路与新大陆尽数私分于两家之手。自君士坦丁堡、大都、开罗至诸海上邦国无不震动，使节齐询我朝当如何回应此等海权垄断。"
 oe_gds.10.a: "宣告公海自由法理，正面挑战经线垄断"
 oe_gds.10.b: "联络欧亚诸强缔结平行海权通商协约"
 oe_gds.11.title: "反子午线风云：马六甲与香料大洋"
 oe_gds.11.desc: "当托尔德西里亚斯经线向地球背面延伸，竟径直划过香料群岛、马六甲与中国海。满载美洲白银的大西洋卡拉维尔帆船与东方福船、三角帆船及桨帆战舰正面交汇，将印度洋与环太平洋融为一体的财富与争霸大舞台。"
 oe_gds.11.a: "特许编组东方香料与白银大帆船护航队"
 oe_gds.11.b: "重兵扼守海峡要冲，宣示帝国海事管辖权"
 oe_gds.12.title: "大海盗时代蔓延：加勒比、巴巴里与马六甲"
 oe_gds.12.desc: "大海盗时代掀起的海上狂澜早已越出西印度群岛。老练的加勒比海盗、巴巴里私掠者与南海巨寇跨洲互通航图与黑市火药，自阿尔及尔至马六甲海峡频频劫掠运银船队与远洋瓷茶快船。"
 oe_gds.12.a: "牵头组建跨欧亚联防剿匪护航同盟"
 oe_gds.12.b: "广发私掠许可证以盗制敌"
 oe_gds.13.title: "海盗巢穴、海运保险公所与招安舵手"
 oe_gds.13.desc: "连年海上护航战迫使港埠商号与海军衙门各自求变。富商倡议效法近代承保制度筹建远洋海运保险公所共担风险；水师将领则建言颁布招安敕令，将熟悉暗礁密道的宿寇收编为皇家引航员与快舰管带。"
 oe_gds.13.a: "特许设立远洋海运保险与护航承保公所"
 oe_gds.13.b: "颁布皇家海盗招安令并编组引航水师"
 oe_gds.14.title: "大革命浪潮激荡欧亚诸都"
 oe_gds.14.desc: "震撼西方的革命风暴无视山海与王朝疆界。译成多国文字的宪法小册子与民权檄文在君士坦丁堡咖啡馆、大都与莫斯科书院以及伊斯坦布尔市集竞相传抄。朝廷必须在街头先于庙堂做出抉择之前定下国策。"
 oe_gds.14.a: "敕召帝国宪章议政大会，主动立宪疏导"
 oe_gds.14.b: "结成正统王权联防并严行书禁维稳"
 oe_gds.15.title: "民法典编纂与欧亚新市民阶层"
 oe_gds.15.desc: "无论是受革命浪潮激荡还是由庙堂自上而下主导维新，陈旧割裂的封建关卡、行会垄断与世袭官荫皆已难以为继。法学家呈上一部条理明晰的统一民法典，保障商产契约、唯才授官，并打通乡民晋升城镇市民与百工的通途。"
 oe_gds.15.a: "颁行统一民法典与唯才任官新制"
 oe_gds.15.b: "维系传统等级契约与行省古法自治"
 oe_gds.16.title: "跨欧亚大局底定：正统协调抑或宪制公约"
 oe_gds.16.desc: "随着革命战火的硝烟渐次散去，欧亚各大帝国的全权使节齐聚议事厅，商定十九世纪的全球秩序。精炼钢、跨洲大运河与觉醒的近代市民社会已将世界紧密相连，今日签下的协约将定义全新的全球纪元。"
 oe_gds.16.a: "倡导跨欧亚宪制和平与自由通商公约"
 oe_gds.16.b: "主导欧亚诸皇正统协调均势大会"
