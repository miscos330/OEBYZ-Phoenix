 oe_aud2_player_only_tt:0 "仅人类玩家操控的国家可资助帝国宫廷乐团或切换区域交响乐章心境"
 oe_aud2_dec_imperial_kapellmeister.title:0 "帝国宫廷乐长与区域交响乐章"
 oe_aud2_dec_imperial_kapellmeister.desc:0 "资助帝国宫廷乐团以礼赞欧亚五大音乐传统（拜占庭圣咏、东亚古琴琵琶、波斯桑图尔与草原马头琴、印度拉格、欧洲交响乐章），获得适度的威望与文化增益，或手动轮换当前国家的区域交响乐章心境（1—5）。"
 oe_aud2_dec_imperial_kapellmeister.a:0 "资助帝国宫廷乐团与圣咏大典"
 oe_aud2_dec_imperial_kapellmeister.b:0 "轮换区域交响乐章心境（1—5）"
 oe_aud2_dec_patronize_tt:0 "授予“帝国宫廷乐长”修正持续 10 年，每 10 年可额外获得 +5 威望，并开启圣索菲亚帝国圣咏盛会。"
 oe_aud2_dec_cycle_suite_tt:0 "依次轮换国家当前的区域交响乐章心境变量（1=拜占庭、2=东亚、3=波斯与草原、4=印度、5=欧洲），轮换一周后恢复按首都区域自动匹配。"
 oe_aud2.1.title:0 "圣索菲亚圣咏与帝国铜管"
 oe_aud2.1.desc:0 "大教堂穹顶之下汇聚了各地圣咏领唱与宫廷号角乐师，他们将古老的拜占庭应答圣咏与雄浑的帝国铜管融为一体。礼官与学者建言由皇室出资编订晚祷与加冕礼乐谱，永垂王朝威仪。"
 oe_aud2.1.a:0 "御赐基金供养大教堂圣咏与帝国铜管团"
 oe_aud2.1.b:0 "委约编创朝会与外交典礼世俗礼乐"
 oe_aud2.2.title:0 "古琴、琵琶与宫廷鼓乐大典"
 oe_aud2.2.desc:0 "从大都御道到江南水榭，声名远播的古琴名士、琵琶国手与宫廷司鼓齐聚京师，盼望获得朝廷礼遇。若设立统一礼乐机构，既可规整宗庙朝会雅乐，又能令文教声韵传遍四方郡县。"
 oe_aud2.2.a:0 "敕建太常礼乐署统领宫廷雅乐"
 oe_aud2.2.b:0 "扶植各地丝竹乐社与民间雅集"
 oe_aud2.3.title:0 "桑图尔、草原吟游与拉格乐会"
 oe_aud2.3.desc:0 "贯通伊斯法罕、撒马尔罕、鄂尔浑草原与德干高原的商路，将波斯桑图尔名家、马头琴史诗歌手与印度晨间拉格乐师引至我国都城。主持这场跨文明乐会，足以彰显帝国海纳百川的博大气象。"
 oe_aud2.3.a:0 "召开木卡姆与草原吟游大乐会"
 oe_aud2.3.b:0 "沿丝绸商路兴办行旅乐馆与驿舍"
 oe_aud2.4.title:0 "大音乐厅与 1836 终章交响"
 oe_aud2.4.desc:0 "巴洛克管风琴圣乐、宫廷小步舞曲与全编制交响弦乐在都城大音乐厅交汇升华。宫廷乐长与学院名家提议委约一部气势恢宏的欧亚史诗交响曲，纪念跨越五百载的治国伟业、远洋航路与学术复兴。"
 oe_aud2.4.a:0 "委约谱写《1836 终章交响曲》"
 oe_aud2.4.b:0 "刊印室内乐总谱广颁学院与沙龙"
 STATIC_MODIFIER_NAME_oe_aud2_mod_imperial_kapellmeister:0 "帝国宫廷乐长"
 STATIC_MODIFIER_DESC_oe_aud2_mod_imperial_kapellmeister:0 "受封的宫廷乐师、抄谱官与乐团总监提升王朝典礼气度，彰显皇庭的文化号召力。"
 STATIC_MODIFIER_NAME_oe_aud2_mod_byzantine_choir:0 "圣索菲亚帝国圣咏团"
 STATIC_MODIFIER_DESC_oe_aud2_mod_byzantine_choir:0 "庄严的应答圣咏与帝国礼仪铜管在大教堂穹顶之下回响，凝聚教士与臣民对皇权的敬仰。"
 STATIC_MODIFIER_NAME_oe_aud2_mod_east_asian_ensemble:0 "太常礼乐署"
 STATIC_MODIFIER_DESC_oe_aud2_mod_east_asian_ensemble:0 "规整编钟、古琴名家与丝竹雅乐调和朝廷大典、太学教化与四方使节宴飨。"
 STATIC_MODIFIER_NAME_oe_aud2_mod_persian_steppe_bards:0 "木卡姆与草原吟游乐会"
 STATIC_MODIFIER_DESC_oe_aud2_mod_persian_steppe_bards:0 "桑图尔琴师、商路诗人与马头琴史诗歌手以雄浑乐章连结边疆贵族与多元都会。"
 STATIC_MODIFIER_NAME_oe_aud2_mod_grand_concert_symphony:0 "大音乐厅与 1836 终章交响"
 STATIC_MODIFIER_DESC_oe_aud2_mod_grand_concert_symphony:0 "公共音乐厅、巴洛克管风琴大教堂与全编制交响乐团使王朝成为欧亚艺术与学术的璀璨灯塔。"
