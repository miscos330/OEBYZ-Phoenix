#=====================================
#law
#=====================================

oe_byz_feudal_de_jure: "拜占庭法学"
oe_byz_feudal_de_jure_desc: "拜占庭法律在中世纪有极大权威性，不仅拜占庭帝国本国臣民，其周边国家的臣民，从事地中海、远东贸易的商人也乐于接受它，很多法律规定在当时乃至现在来看都是非常严谨和具有前瞻性的，这完全得益于拜占庭悠久的法学研究和法律传统。"

#=====================================
#law
#=====================================

oe_byz_bad_patriarchate_law: "教会福利体系"
oe_byz_bad_patriarchate_law_desc: "随着我国中央集权体制的崩塌，教会越来越多地承担起了诸如赈灾，教育，医疗等本应由我国政府承担的工作，我们必须感谢教会在这一风雨飘摇的年代支撑起最后的社会保障网络"
oe_byz_good_patriarchate_law: "东方正统教会"
oe_byz_good_patriarchate_law_desc: "我们成功稳定了社会，现在教会不再需要过分承担大部分的基层福利"
oe_byz_better_patriarchate_law: "皇权与教权"
oe_byz_better_patriarchate_law_desc: "尼西亚会议规定，皇权高于教权，教权服务于皇权。如今，忠于皇室的东罗马官僚们牢牢控制住了教士组织，教权将永久依附于皇权而存在，并沦为政治的奴仆"
oe_byz_best_patriarchate_law: "开明教会"
oe_byz_best_patriarchate_law_desc: "随着我国经济，文化与艺术的不断繁荣，我们决心对牧首区进行改革，摈弃愚昧与腐朽的概念，与时代的浪潮站在一起"
byz_rebuild_patriarchateI_tt: "在完全消灭所有[ShowBuildingTypeName('oe_byz_bad_thief_greek')]，并完成#G 继续恢复帝国权威#!后解锁"
byz_rebuild_patriarchateII_tt: "待开发内容，敬请期待"
byz_rebuild_patriarchateIII_tt: "待开发内容，敬请期待"

#=====================================
#law
#=====================================

oe_byz_cultural_tradition: "西方文明古国"
oe_byz_cultural_tradition_desc: "我们是希腊人与罗马人的后裔，绵延了千年的文明古国，深厚的文化传统必将带领我们一次次如紫凤凰般浴火重生，克服一切困难"

#=====================================
#law
#=====================================

oe_byz_administrative_system_II: "拜占庭官僚"
oe_byz_administrative_system_II_desc: "庞大的职业官僚阶层是拜占庭社会的特色，尽管这一传统官僚结构在1204年的灾难后遭遇了严重打击，但是最困难的时刻已经过去，忠诚高效的文官将会替皇帝将社会治理地井井有条"
oe_byz_administrative_system_I: "地方封建化"
oe_byz_administrative_system_I_desc: "拜占庭帝国后期，土地兼并日益严重，小农经济破产，政府下令禁止土地兼并，结果遭到各地军政长官与当地大地主的联合反抗。"
unlocked_oe_byz_administrative_system_II_law: "复兴官僚管理"
oe_byz_administrative_system_II_tt: "在#G 普罗尼亚的命运#!中选择重建官僚行政"
oe_byz_administrative_system_III_tt: "在#G 普罗尼亚的命运#!中选择修补普罗尼亚制度"

#=====================================
#law
#=====================================

oe_byz_court_customs: "拜占庭式宫廷"
oe_byz_court_customs_desc: "我国王室礼仪文化盛极一时，它一方面承袭了罗马帝国王室礼仪活动的基本形式与内容，另一方面也彰显了拜占庭文化融贯东西、海纳百川的内涵。然而，我国亦因为宫廷阴谋而扬名天下，频繁的宫廷政变与内斗也为我国宫廷赢得了“拜占庭式宫廷阴谋”的“美誉”"

#=====================================
#law
#=====================================

oe_byz_medieval_levy: "普罗尼亚征召"
oe_byz_medieval_levy_desc: "普罗尼亚制度催生的拥有土地的小普罗尼亚贵族是我国坚定的拥护者，他们将秉持着荣耀忠实地为国而战。"
oe_byz_medieval_levy_tt: "未在#G 普罗尼亚的命运#!中选择废除普罗尼亚制度"

#=====================================
#law
#=====================================

oe_byz_distribution_of_power_law: "名义元老院"
oe_byz_distribution_of_power_law_desc: "元老院曾经是罗马举足轻重的最高权力机构，但现在的成员主要是首都君士坦丁堡的世袭贵族、高级官僚、富商和学者名流。它成了一个封闭的、代表首都既得利益者的“贵族俱乐部”。其头衔纯粹是荣誉和社会地位的象征，可以买卖或赏赐，与具体职权无关。"

#=====================================
#law
#=====================================

oe_lose_precious_metal_distribution_law: "颜面尽失的金银管制"
oe_lose_precious_metal_distribution_law_desc: "尽管帝国法律明文规定禁止金银出口，但是拥有特权的意大利商人以及帝国赖以生存的进口项一直在持续不断地腐蚀我们的金银储备，要扭转局面必须要建立良好的经济并终结意大利人的特权"
oe_good_precious_metal_distribution_law: "金银管制法"
oe_good_precious_metal_distribution_law_desc: "我们成功恢复了曾一度沦为一纸空文的金银管制法，现在金银将源源不断地集中在帝国内，成为我们金融稳定的基石。"

#=====================================
#law
#=====================================

oe_bad_mining_law: "不忠诚的承包者"
oe_bad_mining_law_desc: "随着中央控制力下降。教会、修道院、地方豪强、私人承包商成为地方矿场承包的重要参与者。意大利商人（尤其是热那亚人）通过贷款或条约，也获得了部分矿区的开采权或收益份额。"
oe_good_mining_law: "国家矿产委员会"
oe_good_mining_law_desc: "我们逐个肃清了矿场开采界的流毒，让地头蛇们认识到了皇权的威严。巴西琉斯已经下令，将全国矿场主权收归国有，并成立一个国家矿产委员会，负责勘探，统计，招标和监管全国矿场。"

#=====================================
#law
#=====================================

oe_administrative_rome_system: "罗马体制"
oe_administrative_rome_system_desc: "罗马体制就像一艘忒修斯之船，在漫长的历史中已经被时光改变地面目全非，但无论我们采取什么样的措施来治理罗马，唯一不变的是罗马行政体系强大的适应力与韧性" 

#=====================================
#law
#=====================================

oe_byz_bad_censorship: "牧首审查"
oe_byz_bad_censorship_desc: "尽管皇权具有干预权，但大多数异端作品都由主持的牧首独自完成，在虔诚的拜占庭社会里，教会稳当地把控着宗教话语权，人们对任何异端的声音视而不见。"
oe_byz_good_censorship: "官僚联合审查"
oe_byz_good_censorship_desc: "牧首独自审查异端造成的冤案堆积如山，皇帝适时介入，并进行了适当的改革，现在一个由官僚组成的联合审查会将会代替皇帝对牧首们行使监察权，任何宗教审判都要经过该委员会的审查，大大避免了冤案错案的产生，并抑制了教士们滥用权力的现象。"

#=====================================
#law
#=====================================

oe_byz_maritime_bad: "意大利海上霸权"
oe_byz_maritime_bad_desc: "威尼斯人和热那亚人定义了爱琴海的商业秩序，我们衰弱的海军暂时无法与他们相抗衡，我们的商人往往要屈从于意大利人定义的海洋法。"
oe_byz_maritime_good: "拜占庭海洋法"
oe_byz_maritime_good_desc: "拜占庭的法条再一次通行在“我们的海”的碧海青天之上，我们详尽严谨的法典几乎攘括了海事活动中所有的事项与可能的纠纷，我们的统治的海洋与港口将变得井井有条。"

#=====================================
#policy_org_law
#=====================================

OE_BYZ_POLICY_ORG_LAWS: "大区敕令"
oe_policy_org_law_get_burch_I_tri_tt_I: "#Y 帝国宫廷#!"
oe_policy_org_law_get_burch_I_tri_tt_II: "#Y 实权部门#!"
# PAUSED: oe_policy_org_law_get_burch_I: "买官鬻爵"
# PAUSED: oe_policy_org_law_get_burch_I_desc: "由于混乱的治理和财政困难，买官鬻爵已成为常见现象"
# PAUSED: oe_policy_org_law_get_burch_II: "选贤举能"
# PAUSED: oe_policy_org_law_get_burch_II_desc: "我们选拔官员优先以成绩和能力为先，并严厉打击买官现象"
# PAUSED: oe_policy_org_law_get_burch: "选官制度"
# PAUSED: oe_policy_org_law_get_burch_desc: "决定了我国官僚产生与晋升的方式"
oe_policy_org_law_what_burch: "选官范围"
oe_policy_org_law_what_burch_desc: "什么样的人能够成为官僚"
oe_policy_org_law_what_burch_I: "仅限基督教罗马人"
oe_policy_org_law_what_burch_I_desc: "只有信仰基督教的罗马人才有资格成为官僚"
oe_policy_org_law_what_burch_II: "仅限基督教徒"
oe_policy_org_law_what_burch_II_desc: "只有信仰基督教才有资格成为官僚"
oe_policy_org_law_what_burch_III: "一律平等"
oe_policy_org_law_what_burch_III_desc: "任何人都有机会成为官僚"
oe_policy_org_law_burch_say: "行政语言"
oe_policy_org_law_burch_say_desc: "决定了我国行政机构使用的行政语言"
oe_policy_org_law_burch_say_I: "希腊语"
oe_policy_org_law_burch_say_I_desc: "希腊语是我国一切行政机构都必须掌握和熟练使用的语言" # FIX 2026-11-17 P2：键名笔误，原为 oe_policy_org_law_burch_say_desc
oe_policy_org_law_burch_say_II: "因地制宜"
oe_policy_org_law_burch_say_II_desc: "除了希腊语，行政机构的其他语言可以根据当地的通用语灵活决定"

#=====================================
#bank_org_law
#=====================================

OE_BANK_ORG_LAWS: "金融条例"
oe_org_law_save_money: "储蓄法"
oe_org_law_save_money_desc: "存钱，取钱，这是银行业最基本的功能，决定了金融行业最主要的资金来源"
oe_org_law_save_money_I: "收取管理费"
oe_org_law_save_money_I_desc: "早期的银行储蓄不仅不产生利息，还要因为提供了安全的存钱地点而向客户收费"
oe_org_law_save_money_II: "死期利息"
oe_org_law_save_money_II_desc: "随着我国金融行业的进步，储蓄已经不再仅仅被视作需要保管的累赘，反而是催生更多收入的财富之源。出于各行业投资周期长，我们现在仅为大额死期存款提供稳定的利息"
oe_org_law_save_money_III: "活期利息"
oe_org_law_save_money_III_desc: "由于流动性的大大增加，我们的银行已经可以为随取随用的活期存款提供利息，这反过来吸引了大量市民和平民阶层的存款"
oe_org_law_paper_set_money: "汇票兑换"
oe_org_law_paper_set_money_desc: "汇票类似于支票，使用者可凭汇票在银行兑换等额的货币，在东地中海通常用于大宗跨国贸易的交易中"
oe_org_law_paper_set_money_I: "五花八门的汇票"
oe_org_law_paper_set_money_I_desc: "帝国各个特许银行都有自己的专属汇票，这导致了汇票管理的混乱以及不同银行间不通用等各种问题"
oe_org_law_paper_set_money_II: "紫色汇票"
oe_org_law_paper_set_money_II_desc: "由帝国官方亲自印制的汇票，以标志性的紫色被称为紫色汇票，在帝国下辖的所有官方机构以及特许银行间通用"
oe_org_law_paper_protect_money: "保险法"
oe_org_law_paper_protect_money_desc: "保险制度是金融行业最基本的服务之一，为保障的项目提供风险对冲"
oe_org_law_paper_protect_money_I: "海上保险"
oe_org_law_paper_protect_money_I_desc: "商人们在航海前，向资金提供者（早期承保人）签署一份借贷契约。如果船只安全抵达，借款人需偿还本金和高额“利息”；如果船只失事，则借款免除。这实质上是一种风险对赌协议，是保险的雏形"
oe_org_law_paper_protect_money_II: "人寿保险"
oe_org_law_paper_protect_money_II_desc: "17世纪，数学家们开始研究人口死亡率。最具里程碑意义的是天文学家埃德蒙·哈雷于1693年根据布雷斯劳城数据编制了第一张生命表，揭示了年龄与死亡率的数学关系。"
oe_org_law_protect_money_III: "保险法"
oe_org_law_protect_money_III_desc: "专业的“精算师”职业出现，他们运用日益精确的死亡率表、概率论和复利数学，使保险产品的定价和准备金提取高度科学化。政府也开始介入监管，制定保险公司偿付能力标准和经营规范，保护投保人利益。"

#=====================================
#religion_city_law
#=====================================

oe_walk_for_religion_yelusa_law: "耶路撒冷朝圣法"
oe_walk_for_religion_yelusa_law_desc: "我们控制了三教圣城耶路撒冷，每年都有无数虔诚的信徒来这里朝圣"
yelusa_allow_everyone_policy: "允许所有信徒朝圣"
yelusa_allow_everyone_policy_desc: "任何人都有权向神证明自己的虔诚"
yelusa_forbid_muslin_policy: "禁止异教徒朝圣"
yelusa_forbid_muslin_policy_desc: "我们解放耶路撒冷的意义就是将她从异教徒的玷污下解放出来"
yelusa_forbid_enemy_policy: "禁止异端异教朝圣"
yelusa_forbid_enemy_policy_desc: "只有信仰唯一真信的教徒才允许靠近这座神圣的城市"
yelusa_for_money_policy: "朝圣收费"
yelusa_for_money_policy_desc: "我们才不管那些人信仰什么，只要愿意付钱那就是上帝"
yelusa_allow_byz_policy: "耶路撒冷牧首区"
yelusa_allow_byz_policy_desc: "罗马帝国对耶路撒冷的管理由来已久，城中依然留存着许多罗马修建的建筑。牧首区允许所有教徒朝圣"
oe_walk_for_religion_maika_law: "两圣城监护人"
oe_walk_for_religion_maika_law_desc: "伊斯兰世界的两圣城，麦加和麦地那已经处于我国的控制之下"
maika_allow_everyone_policy: "允许穆斯林朝觐"
maika_allow_everyone_policy_desc: "此举不仅能大大安抚国内的穆斯林，还能从朝觐活动中赚取可观的税收"
maika_forbid_muslin_policy: "关停朝觐活动"
maika_forbid_muslin_policy_desc: "尽管穆斯林依然允许进入麦加，但是不再有每年由官方协助举办的朝觐活动"
maika_forbid_byz_policy: "克尔白教堂"
maika_forbid_byz_policy_desc: "罗马人将把克尔白清真寺改造为教堂，天房被运至君士坦丁的大跑马场陈列，十字架在先知清真寺立起"

#=====================================
#theme_law
#=====================================
 OE_BYZ_EMPIRE_THEME_ORG_LAWS: "帝国法度"
oe_byz_empire_theme_org_law_army_rule_II: "军区法律"
 oe_byz_empire_theme_org_law_army_rule_II_desc: "军区的统辖、军籍与供养皆须有章可循。皇帝可以将地方军政委诸总督，也可以在完成中央集权后，将各军重新纳入御座的直接节制。"
 oe_byz_empire_theme_org_law_army_rule_II_I: "中央统制"
 oe_byz_empire_theme_org_law_army_rule_II_I_desc: "由御座统一核定军籍、粮秣与军政任命，地方将军奉皇帝之命掌军。\n\n#Y 东罗马：#!王室力量#G +10%#!。\n#Y 地方军区：#!陆军维护效率最高#G +800%#!、食物消耗#G −20%#!、对宗主国忠诚度#G +50#!。\n\n须完成帝国改革#Y 中央集权#!。陆军维护效率随帝国财政的#Y 军区军饷#!滑条线性缩放：0%拨款时为#Y 0%#!，50%时为#G +400%#!，100%时为#G +800%#!。食物消耗及其他修正不随该滑条缩放。"
oe_byz_empire_theme_org_law_army_rule_IV: "战术"
 oe_byz_empire_theme_org_law_army_rule_IV_desc: "罗马的疆域横跨山岭、平原与海峡，诸军不能以同一种阵法应对所有敌人。御座定下#Y 战术#!，使各军在共同的操典之下作战。"
oe_byz_empire_theme_org_law_army_rule_IV_I: "步兵战术"
 oe_byz_empire_theme_org_law_army_rule_IV_I_desc: "以坚实步阵承受冲击，以队列与盾墙守住战线。令步兵成为诸军的脊梁，使敌人每前进一步都须付出代价。"
oe_byz_empire_theme_org_law_army_rule_IV_II: "机动战术"
 oe_byz_empire_theme_org_law_army_rule_IV_II_desc: "不与敌人争一时之坚，而争行军与交战之先。以骑兵牵制、迂回与追击，使迟缓的敌军处处受制。"
oe_byz_empire_theme_org_law_army_rule_IV_III: "火力压制"
 oe_byz_empire_theme_org_law_army_rule_IV_III_desc: "让密集的投射与火炮先行撼动敌阵，再命诸军乘势而进。敌人的勇气，亦须承受铁与火的考验。"
oe_byz_empire_theme_org_law_army_rule_IV_IV: "人海战术"
 oe_byz_empire_theme_org_law_army_rule_IV_IV_desc: "广集兵员，轮番接战，以更厚的阵列耗尽敌军的锐气。此策仰赖充足的人力与持续的供养，亦使御座承担更大的军政责任。"

#=====================================
#rus_law
#=====================================

RUS_RELIGION_LAWS: "都主教区教条"
rus_religion_law_church_rule_II_I_tri_tt_II: "#Y 教区#!"

rus_religion_law_church_rule_I: "现状"
rus_religion_law_church_rule_I_desc: "在蒙古人来到东欧大草原以后，我们就对罗斯诸教会失去了实际的控制权。尤其是在1204年的灾难以后，我国的国力已经大不如前，无力穿过充满了游牧军队的大草原，与罗斯人建立可靠的联系"
rus_religion_law_church_rule_I_I: "与罗斯诸教会失去联系"
rus_religion_law_church_rule_I_I_desc: "我们共同信仰的兄弟正在遭受着蒙古人的屠戮与压迫，这无疑打击了普世牧首区的威信"
rus_religion_law_church_rule_II: "罗斯教会"
rus_religion_law_church_rule_II_desc: "在击碎鞑靼枷锁后，东罗马重新和罗斯教会建立了联系，普世牧首区神圣的荣光又一次普照到了罗斯大地上。"
rus_religion_law_church_rule_II_I: "普世牧首任命主教"
rus_religion_law_church_rule_II_I_desc: "走进基辅或莫斯科的牧首区总部，来自君士坦丁波利斯的主教或许正在与某个修道院的院长侃侃而谈。漫步于修道院的长廊中，修士们都以前往东罗马学习神学为荣，并热烈地讨论着正在东罗马国内流行的神学问题"

