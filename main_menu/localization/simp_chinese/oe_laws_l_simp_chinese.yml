 oe_byz_theme_governor_administration_desc: "军区总督受命守卫疆土，统筹地方军籍与粮秣。地方军政因而得以维系，御座却须容忍总督在辖区内保有较大的权柄。\n\n#Y 东罗马：#!王室力量#R −10%#!。\n#Y 地方军区：#!陆军维护效率最高#G +800%#!、食物消耗#G −20%#!。\n\n开局实行此制；陆军维护效率随帝国财政的#Y 军区军饷#!滑条线性缩放：0%拨款时为#Y 0%#!，50%时为#G +400%#!，100%时为#G +800%#!。食物消耗及其他修正不随该滑条缩放。"

