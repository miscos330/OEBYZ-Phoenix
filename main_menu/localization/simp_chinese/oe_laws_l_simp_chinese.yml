 oe_byz_ed_money_over: "货币信用重建完成"
 oe_byz_empire_theme_org_law_army_rule_I: "军纪法度"
 oe_byz_empire_theme_org_law_army_rule_III: "军役兵源"
 oe_byz_empire_theme_org_law_army_rule_III_I: "强枝弱干"
 oe_byz_empire_theme_org_law_army_rule_III_II: "强干弱枝"
 oe_byz_empire_theme_org_law_army_rule_III_II_desc: "中枢朝廷威权赫赫，中央大军尽揽天下精锐，地方武装不敢妄动。"
 oe_byz_empire_theme_org_law_army_rule_III_I_desc: "地方军阀盘根错节，往往率先挑拣各省最精壮的丁壮兵员。"
 oe_byz_empire_theme_org_law_army_rule_III_desc: "决定地方兵源更多流向地方军区武装还是帝国中央军。"
 oe_byz_empire_theme_org_law_army_rule_I_I: "军纪废弛"
 oe_byz_empire_theme_org_law_army_rule_I_II: "军令如山"
 oe_byz_empire_theme_org_law_army_rule_I_III: "军事法庭"
 oe_byz_empire_theme_org_law_army_rule_I_III_desc: "在古罗马军团中，统帅对士卒掌握绝对的生杀大权，对于逃兵与哗变等重罪皆以速审军法严惩，堪称后世军事法庭之雏形。古罗马军法典明晰界定了各项违纪罪责。如今我们复兴并推进了这一古老传统，专设的军事法庭将令每名将士在犯禁之前三思而后行。"
 oe_byz_empire_theme_org_law_army_rule_I_II_desc: "我们严明军纪，仅允许统军将领依法向城邑征收军费，严禁士卒私自劫掠百姓。"
 oe_byz_empire_theme_org_law_army_rule_I_I_desc: "随着职业常备军迅速瓦解，替我们作战的雇佣兵与地方武装几乎毫无军纪可言，无论敌我疆土皆遭肆意劫掠。"
 oe_byz_empire_theme_org_law_army_rule_I_I_tri_tt_I: "帝国皇位"
 oe_byz_empire_theme_org_law_army_rule_I_I_tri_tt_II: "地方军政督府"
 oe_byz_empire_theme_org_law_army_rule_I_desc: "军纪是一支军队最核心的特质之一，决定了军队在攻占城池后的行为规范。"
 oe_byz_empire_theme_org_law_army_rule_V: "军需后勤"
 oe_byz_empire_theme_org_law_army_rule_V_I: "中枢统筹调拨"
 oe_byz_empire_theme_org_law_army_rule_V_I_desc: "由中央朝廷统一负责地方武装的粮饷与后勤补给。"
 oe_byz_empire_theme_org_law_army_rule_V_desc: "协调一致的后勤补给是多支武装联合作战的关键支柱。"
 oe_byz_road_to_roman_situation: "罗马复兴"
 phoenix_nirvana.600.d: "自 1204 年以来，我们陷入了难以置信的虚弱，游牧民与拉丁人轮番践踏帝国疆土。幸而那段惨痛岁月已成过往：我们成功遏制了地方豪强势力，重整了中央常备军，并在小亚细亚击退了突厥人。如今我们可以自豪地宣告：罗马局势已然稳固，正是时候着手收复祖宗故土。"
