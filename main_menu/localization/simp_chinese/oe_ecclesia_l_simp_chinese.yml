l_simp_chinese:
 oe_ecc_merged_reason: "并入普世牧首区"
 OE_ECC_EMPTY: ""
 OE_ECC_ATHOS_LINE: "\n\n居中斡旋的是阿索斯山的修士，与我们的牧首同出一门。"
 OE_ECC_UNION_LINE: "\n\n使团里有人私下问起：皇帝当年真的在罗马向教皇低了头？"
 OE_ECC_TARNOVO_LINE: "\n\n叶夫蒂米的门生在阿索斯和斯图狄翁修道院求过学，认得通往君士坦丁堡的路。"
 OE_ECC_CHR_SER_1: "与塞尔维亚教会和解，承认了佩奇的牧首。"
 OE_ECC_CHR_SER_2: "佩奇降回大主教区，塞尔维亚教会重归普世牧首区。"
 OE_ECC_CHR_SER_3: "两次拒绝了佩奇的使团，分裂依旧。"
 OE_ECC_CHR_SER_V2: "帝国已不领导普世牧首区，塞尔维亚的问题无从谈起。"
 OE_ECC_CHR_SER_V1: "塞尔维亚没有来求和解。"
 OE_ECC_CHR_SER_OPEN: "塞尔维亚的教会问题尚未了结。"
 OE_ECC_CHR_TAR_1: "特尔诺沃的教区由希腊主教接管。"
 OE_ECC_CHR_TAR_2: "特尔诺沃的教区并入普世牧首区，保留了斯拉夫礼仪。"
 OE_ECC_CHR_TAR_3: "特尔诺沃的牧首区得以保留。"
 OE_ECC_CHR_TAR_V2: "帝国已不领导普世牧首区，保加利亚的问题无从谈起。"
 OE_ECC_CHR_TAR_SELF: "保加利亚的教会已自行归入普世牧首区。"
 OE_ECC_CHR_TAR_V1: "特尔诺沃的教区问题始终没有出现。"
 OE_ECC_CHR_TAR_OPEN: "保加利亚的教区问题尚未出现。"
 oe_ecc_synod: "主持圣主教会议"
 oe_ecc_synod_desc: "召开君士坦丁堡的圣主教会议，在[oe_tu_church_parties|e]之间作出裁断。花费#R 5#![oe_tu_authority|e]、#R 100#!金币；#Y 10#!年内只能召开一次；内战中不能召开。\n\n三派：静修派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!、理性派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!、亲合一派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!；当道：[GetCountry('BYZ').Custom('OeEccDom')]。[patriarch|e]的派别：[GetCountry('BYZ').Custom('OeEccPatF')]。[oe_tu_patriarchate|e]：#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_pres').GetValue|0]#!。\n教区：罗斯[GetCountry('BYZ').Custom('OeEccSee_rus')]，立陶宛[GetCountry('BYZ').Custom('OeEccSee_lit')]，瓦拉几亚[GetCountry('BYZ').Custom('OeEccSee_wal')]，摩尔达维亚[GetCountry('BYZ').Custom('OeEccSee_mol')]，塞尔维亚[GetCountry('BYZ').Custom('OeEccSee_ser')]，特尔诺沃[GetCountry('BYZ').Custom('OeEccSee_tar')]。"
 oe_ecc_synod_tt: "[oe_tu_authority|e]#R −5#!，#R −100#!金币。\n圣主教会议在圣索菲亚召开，随后选择议题；#Y 10#!年内不能再开。"
 oe_ecc_synod_card: "召开圣主教会议，在教会三派之间作出裁断。"
 oe_ecc_synod_allow_live: "教会三派已经形成，帝国仍领导普世牧首区"
 oe_ecc_synod_allow_auth: "帝国权威至少为5"
 oe_ecc_synod_allow_gold: "国库至少有100金币"
 oe_ecc_synod_allow_cd: "距上次圣主教会议已满10年"
 oe_ecc_synod_allow_peace: "不在内战中"
