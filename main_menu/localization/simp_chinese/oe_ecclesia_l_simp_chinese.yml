 OE_ECC_EMP_OTHER: "另一派"
 OE_ECC_SEE_0: "未设"
 OE_ECC_SEE_1: "归属"
 OE_ECC_SEE_2: "争议"
 OE_ECC_SEE_3: "自主"
 OE_ECC_SEE_4: "脱离"
 oe_ecc_name_neilos: "尼洛斯"
 OE_ECC_CHR_RUS_ISIDORE: "伊西多尔去了罗斯，罗斯的教会怎样对待合一，要看以后。罗斯教区：[GetCountry('BYZ').Custom('OeEccSee_rus')]，立陶宛教区：[GetCountry('BYZ').Custom('OeEccSee_lit')]。"
 OE_ECC_CHR_RUS_JONAH: "约纳受了祝圣，罗斯与君士坦丁堡相安无事。罗斯教区：[GetCountry('BYZ').Custom('OeEccSee_rus')]，立陶宛教区：[GetCountry('BYZ').Custom('OeEccSee_lit')]。"
 OE_ECC_CHR_RUS_CYPRIAN: "西普里安已受祝圣，约定日后继承全罗斯。罗斯教区：[GetCountry('BYZ').Custom('OeEccSee_rus')]，立陶宛教区：[GetCountry('BYZ').Custom('OeEccSee_lit')]。"
 OE_ECC_CHR_RUS_RUN: "罗斯教区：[GetCountry('BYZ').Custom('OeEccSee_rus')]，立陶宛教区：[GetCountry('BYZ').Custom('OeEccSee_lit')]。"
 OE_ECC_CHR_RUS_BROKE: "罗斯的主教们不经君士坦丁堡自选都主教，罗斯的教会自立了。"
 OE_ECC_CHR_RUS_AUTO: "罗斯的教会自主，仍与君士坦丁堡共融。"
 OE_ECC_CHR_RUS_KEPT: "到1449年，罗斯的教会仍在君士坦丁堡之下。"
 OE_ECC_CHR_RUS_OFF: "帝国已不领导普世牧首区。"
 OE_ECC_CHR_RUS_NOFW: "帝国没有领导普世牧首区，罗斯的都主教无从谈起。"
 OE_ECC_CHR_RUS_SELF: "罗斯的教会已经自立。"
 OE_ECC_CHR_RUS_NOHOST: "罗斯已没有留在普世牧首区的正教国家。"
 OE_ECC_CHR_RUS_NEVER: "1449年前，罗斯的都主教问题始终没有出现。"
 OE_ECC_ALEXIUS_LINE: "\n\n莫斯科推举的，正是大公宫廷里德高望重的阿列克谢。"
 OE_ECC_MON_3: "豁免"
 OE_ECC_MON_2: "常例"
 OE_ECC_MON_1: "半数作普罗尼亚"
 OE_ECC_MON_0: "入官"
 OE_ECC_NOBLE_MON_LINE: "\n\n贵族们也坐不住：不少修院是各大家族出钱供养的，田庄里有这些家族的一份。"
 OE_ECC_ATHOS_WAL_1: "\n\n信里还说，当年帝国准许入住的瓦拉几亚修士也在联名之列，那座修院的另一位创建人、多瑙河那边的君侯已经答应出钱。"
 OE_ECC_ATHOS_WAL_2: "\n\n信里还说，当年收下瓦拉几亚金币的那座修院，已经另派人去多瑙河那边求助。"
 OE_ECC_ATHOS_WAL_3: "\n\n信里还提了一句：当年瓦拉几亚君侯要为圣山出钱，京城却请君侯先顾京城的教堂；如今山上的人只能指望京城。"
 OE_ECC_CHR_RUS_REFUSED: "罗斯不认与罗马的合一，把伊西多尔赶下了都主教的座位。罗斯教区：[GetCountry('BYZ').Custom('OeEccSee_rus')]，立陶宛教区：[GetCountry('BYZ').Custom('OeEccSee_lit')]。"
 OE_ECC_DISPUTE_LINE: "\n\n当年的会议没有给教义下定论，学者们至今还在著书争辩，这位学者也是其中之一。"
