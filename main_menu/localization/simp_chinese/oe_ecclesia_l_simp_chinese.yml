 STATIC_MODIFIER_NAME_oe_ecc_mon_1: "收一半修院地产"
 STATIC_MODIFIER_NAME_oe_ecc_mon_0: "修院地产入官"
 oe_ecc.1.t: "佩奇来的使团"
 oe_ecc.1.desc.a: "#F 1375年，塞尔维亚的拉扎尔大公派阿索斯山的修士伊萨亚出使君士坦丁堡。牧首斐洛提奥斯撤销了当年的绝罚，承认塞尔维亚教会为牧首区；有争议的南方教区归还君士坦丁堡。#!\n\n[SCOPE.sCharacter('oe_ecc_envoy').GetName]的使团来到圣索菲亚，带来佩奇[patriarch|e]的书信：请求撤销绝罚，承认佩奇的牧首和那里的[autocephalous_patriarchate|e]。作为交换，杜尚当年夺去的希腊教区，愿意交还君士坦丁堡。土耳其人的威胁一年比一年近，双方都需要朋友。[GetCountry('BYZ').Custom('OeEccAthosLine')][GetCountry('BYZ').Custom('OeEccUnionLine')]"
 oe_ecc.1.desc.b: "#F 1375年，塞尔维亚的拉扎尔大公派阿索斯山的修士伊萨亚出使君士坦丁堡。牧首斐洛提奥斯撤销了当年的绝罚，承认塞尔维亚教会为牧首区；有争议的南方教区归还君士坦丁堡。#!\n\n当年君士坦丁堡没有颁布绝罚，却也从未承认佩奇的[patriarch|e]。如今[SCOPE.sCharacter('oe_ecc_envoy').GetName]的使团来到圣索菲亚，带来佩奇牧首的书信：请求承认佩奇的牧首和那里的[autocephalous_patriarchate|e]。作为交换，杜尚当年夺去的希腊教区，愿意交还君士坦丁堡。土耳其人的威胁一年比一年近，双方都需要朋友。[GetCountry('BYZ').Custom('OeEccAthosLine')][GetCountry('BYZ').Custom('OeEccUnionLine')]"
 oe_ecc.1.a: "承认佩奇的牧首"
 oe_ecc.1.a.tt: "撤销对塞尔维亚教会的绝罚（如有），对方的怨恨随之消除\n我们与[SCOPE.sCountry('oe_ecc_pec_lord').GetName]互相好感#G +50#!\n[oe_tu_authority|e]#G +3#!（接纳过乌格列莎时为#G +5#!）\n获得[ShowModifier('oe_ecc_peace_of_churches')]，持续#Y 20#!年\n静修派得势时：教士满意度#G +10%#!\n[SCOPE.sCountry('oe_ecc_pec_lord').GetName]威望#Y +5#!"
 oe_ecc.1.b: "要求佩奇降回大主教区"
 oe_ecc.1.b.tt: "花费#R 5#![oe_tu_authority|e]\n佩奇的[autocephalous_patriarchate|e]解散，其中的正教国家归入普世牧首区\n我们对归入的国家好感#Y +25#!\n获得[ShowModifier('oe_ecc_pec_returned')]，持续#Y 20#!年\n[SCOPE.sCountry('oe_ecc_pec_lord').GetName]对我们好感#R −30#!\n[SCOPE.sCountry('oe_ecc_pec_lord').GetName]稳定度#Y −7#!"
 oe_ecc.1.c: "不予承认"
 oe_ecc.1.c.tt: "[SCOPE.sCountry('oe_ecc_pec_lord').GetName]对我们好感#R −10#!\n#Y 10#!年后对方可能再派使团来（只再来一次）"
 oe_ecc.1.d: "不予承认"
 oe_ecc.1.d.tt: "[SCOPE.sCountry('oe_ecc_pec_lord').GetName]对我们好感#R −10#!\n塞尔维亚教会的问题就此搁置"
 oe_ecc.2.t: "维丁的请求"
 oe_ecc.2.desc: "#F 伊凡·斯拉齐米尔在维丁自立后，与特尔诺沃反目，把维丁的教区交给君士坦丁堡的牧首管辖。此事的年份，史料有1371年和1381年两说。#!\n\n[SCOPE.sCharacter('oe_ecc_vid_ruler').GetName]派人来到君士坦丁堡：维丁的都主教不愿再听特尔诺沃的号令，请求归入君士坦丁堡的[Concept('autocephalous_patriarchate','普世牧首区')|e]。特尔诺沃一定会抗议。"
 oe_ecc.2.a: "接纳维丁的教区"
 oe_ecc.2.a.tt: "维丁归入普世牧首区\n我们对维丁好感#Y +25#!\n维丁对我们好感#G +30#!\n保加利亚对我们好感#R −20#!"
 oe_ecc.2.b: "婉拒，尊重特尔诺沃"
 oe_ecc.2.b.tt: "保加利亚对我们好感#G +20#!"
 oe_ecc.3.t: "特尔诺沃的空座"
 oe_ecc.3.desc.a: "#F 1393年7月17日，特尔诺沃在三个月的围城后陷落，牧首叶夫蒂米被流放到色雷斯。次年，君士坦丁堡的圣主教会议派一位都主教前往特尔诺沃。此后近五百年，保加利亚的教区都归普世牧首管辖。#!\n\n特尔诺沃落入了奥斯曼人之手，保加利亚[patriarch|e]的宝座空了。圣主教会议在问：保加利亚的教区，现在归谁管？[GetCountry('BYZ').Custom('OeEccTarnovoLine')]"
 oe_ecc.3.desc.b: "#F 1393年7月17日，特尔诺沃在三个月的围城后陷落，牧首叶夫蒂米被流放到色雷斯。次年，君士坦丁堡的圣主教会议派一位都主教前往特尔诺沃。此后近五百年，保加利亚的教区都归普世牧首管辖。#!\n\n特尔诺沃落入了[SCOPE.sCountry('oe_ecc_tarnovo_owner').GetName]之手，保加利亚[patriarch|e]的宝座空了。圣主教会议在问：保加利亚的教区，现在归谁管？[GetCountry('BYZ').Custom('OeEccTarnovoLine')]"
 oe_ecc.3.a: "派希腊主教，由圣主教会议直辖"
 oe_ecc.3.a.tt: "特尔诺沃的[autocephalous_patriarchate|e]（若还在）并入普世牧首区后解散；保加利亚和维丁的正教会归入普世牧首区\n我们对归入的国家好感#Y +25#!\n[oe_tu_authority|e]#G +3#!\n获得[ShowModifier('oe_ecc_greek_bishops')]，持续#Y 20#!年\n保加利亚对我们好感#R −25#!（静修派得势时只#R −5#!）"
 oe_ecc.3.b: "并入，但保留斯拉夫礼仪和文字"
 oe_ecc.3.b.tt: "特尔诺沃的[autocephalous_patriarchate|e]（若还在）并入普世牧首区后解散；保加利亚和维丁的正教会归入普世牧首区\n这笔钱资助斯拉夫文的抄经坊\n我们对归入的国家好感#Y +25#!\n[oe_tu_authority|e]#G +1#!\n获得[ShowModifier('oe_ecc_slavonic_rite')]，持续#Y 20#!年\n保加利亚对我们好感#R −5#!"
 oe_ecc.3.c: "保留特尔诺沃牧首区"
 oe_ecc.3.c.tt: "特尔诺沃的[autocephalous_patriarchate|e]照旧\n保加利亚对我们好感#G +20#!"
 oe_ecc.21.t: "教会的三派"
 oe_ecc.21.desc: "#F 1341年的两次会议没有平息静修之争。内战中，牧首约翰十四世·卡勒卡斯站到反帕拉马斯的一边，1344年绝罚了帕拉马斯；争论一直延续到1351年的布拉赫奈会议。#!\n\n如今教会分成[oe_tu_church_parties|e]：静修派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!、理性派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!、亲合一派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!，当道的是[GetCountry('BYZ').Custom('OeEccDom')]。现任[patriarch|e]属[GetCountry('BYZ').Custom('OeEccPatF')]。普世牧首区的[oe_tu_patriarchate|e]为#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_pres').GetValue|0]#!。\n\n三派的份额每年一月变化，牧首的派别、会议的裁断和皇帝的取舍都会推动它们。帝国柱石里的“主持圣主教会议”随时可以查看这些读数。"
 oe_ecc.21.a: "知道了"
 oe_ecc.22.t: "圣主教会议"
 oe_ecc.22.desc: "#F 君士坦丁堡的圣主教会议由牧首主持，京城附近的都主教和主教出席。皇帝常派大臣列席，有时亲自到场；1341年判巴尔拉姆的会议就由安德洛尼卡三世主持。#!\n\n会议在圣索菲亚召开。[oe_tu_church_parties|e]：静修派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!、理性派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!、亲合一派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!，当道的是[GetCountry('BYZ').Custom('OeEccDom')]。皇帝要会议议哪一件事？"
 oe_ecc.22.a: "申明静修派的教义"
 oe_ecc.22.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y +8#!，理性派#Y −4#!，亲合一派#Y −4#!\n教士满意度#G +5%#!"
 oe_ecc.22.b: "支持学者的意见"
 oe_ecc.22.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y −4#!，理性派#Y +8#!，亲合一派#Y −4#!\n教士满意度#R −5%#!"
 oe_ecc.22.c: "为合一谈判铺路"
 oe_ecc.22.c.tt: "[oe_tu_church_parties|e]份额：静修派#Y −5#!，理性派#Y −3#!，亲合一派#Y +8#!\n教皇国对我们好感#G +15#!\n教士满意度#R −5%#!"
 oe_ecc.22.d: "只议教务"
 oe_ecc.22.d.tt: "[oe_tu_patriarchate|e]#G +3#!"
 oe_ecc.30.t: "圣主教会议报上的人选"
 oe_ecc.30.desc.a: "#F 1347年2月，会议罢黜了牧首约翰十四世·卡勒卡斯。同年5月，静修派的修士伊西多尔继任牧首。#!\n\n卡勒卡斯已退居修院。圣主教会议报上了继任的人选，皇帝要从中选一位。所选的人若不属当道的一派，会众会不服。"
 oe_ecc.30.desc.b: "#F 1353年，牧首卡利斯托斯一世不肯为马太·坎塔库泽诺斯加冕，离开了牧首之位；继任的菲洛泰奥斯次年为马太加冕。#!\n\n拒绝加冕的[patriarch|e]已退居修院。圣主教会议报上了继任的人选，皇帝要从中选一位。所选的人若不属当道的一派，会众会不服。"
 oe_ecc.30.desc.c: "新君要换一位[patriarch|e]，前任已退居修院。圣主教会议报上了继任的人选，皇帝要从中选一位。所选的人若不属当道的一派，会众会不服。"
 oe_ecc.30.desc.d: "#F 1439年6月，牧首约瑟夫二世在佛罗伦萨去世，没有等到合一签字。1440年5月，赞成合一的梅特罗法内斯二世继任牧首。#!\n\n佛罗伦萨之后，皇帝要一位肯承认合一的[patriarch|e]；前任已退居修院。圣主教会议报上了继任的人选，皇帝要从中选一位。所选的人若不属当道的一派，会众会不服。"
 oe_ecc.30.desc.e: "#F 君士坦丁十一世1449年在米斯特拉即位。据说皇帝入京后始终没有在圣索菲亚补行加冕，因为京城的牧首主张合一。#!\n\n合一作罢。新皇帝要一位肯主持加冕礼的[patriarch|e]；前任已退居修院。圣主教会议报上了继任的人选，皇帝要从中选一位。所选的人若不属当道的一派，会众会不服。"
 oe_ecc.30.desc.f: "[patriarch|e]之位出缺，前任已退居修院。圣主教会议报上了继任的人选，皇帝要从中选一位。所选的人若不属当道的一派，会众会不服。"
 oe_ecc.30.a: "选阿索斯山的修士[SCOPE.sCharacter('oe_ecc_c1').GetName]"
 oe_ecc.30.a.tt: "[SCOPE.sCharacter('oe_ecc_c1').GetName]成为[patriarch|e]，属静修派\n[oe_tu_church_parties|e]份额：静修派#Y +4#!\n若当道的是另一派：花费#R 3#![oe_tu_authority|e]（已写明皇帝的教会权利时为#R 1#!），并获得[ShowModifier('oe_ecc_pat_rift')]，持续#Y 5#!年"
 oe_ecc.30.b: "选宫廷里的学者[SCOPE.sCharacter('oe_ecc_c2').GetName]"
 oe_ecc.30.b.tt: "[SCOPE.sCharacter('oe_ecc_c2').GetName]成为[patriarch|e]，属理性派\n[oe_tu_church_parties|e]份额：理性派#Y +4#!\n若当道的是另一派：花费#R 3#![oe_tu_authority|e]（已写明皇帝的教会权利时为#R 1#!），并获得[ShowModifier('oe_ecc_pat_rift')]，持续#Y 5#!年"
 oe_ecc.30.c: "选与拉丁人打过交道的修士[SCOPE.sCharacter('oe_ecc_c3').GetName]"
 oe_ecc.30.c.tt: "[SCOPE.sCharacter('oe_ecc_c3').GetName]成为[patriarch|e]，属亲合一派\n[oe_tu_church_parties|e]份额：亲合一派#Y +4#!\n教皇国对我们好感#G +15#!\n教士满意度#R −5%#!\n若当道的是另一派：花费#R 5#![oe_tu_authority|e]（已写明皇帝的教会权利时为#R 3#!），并获得[ShowModifier('oe_ecc_pat_rift')]，持续#Y 5#!年"
 oe_ecc.32.t: "新君与牧首"
 oe_ecc.32.desc.a: "#F 1347年2月，约翰·坎塔库泽诺斯进入君士坦丁堡。此人一向庇护帕拉马斯，新朝廷站在静修派一边。#!\n\n新君登基。现任[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]属[GetCountry('BYZ').Custom('OeEccPatF')]，新君更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人。要不要换一位牧首？"
 oe_ecc.32.desc.b: "#F 1376年，安德洛尼卡四世在热那亚人和土耳其人的帮助下夺取京城，罢黜牧首菲洛泰奥斯，另立马卡里奥斯。#!\n\n新君登基。现任[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]属[GetCountry('BYZ').Custom('OeEccPatF')]，新君更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人。要不要换一位牧首？"
 oe_ecc.32.desc.c: "#F 1379年，约翰五世复位，罢黜了篡位者所立的马卡里奥斯；次年尼洛斯继任牧首。#!\n\n新君登基。现任[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]属[GetCountry('BYZ').Custom('OeEccPatF')]，新君更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人。要不要换一位牧首？"
 oe_ecc.32.desc.d: "#F 1390年，约翰七世短暂夺取京城，马卡里奥斯随之复任牧首。#!\n\n新君登基。现任[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]属[GetCountry('BYZ').Custom('OeEccPatF')]，新君更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人。要不要换一位牧首？"
 oe_ecc.32.desc.e: "#F 1402年，曼努埃尔二世西行求援，留守京城的约翰七世罢黜了牧首马太一世；皇帝回来后，马太复位。#!\n\n皇帝西行未归，留守京城的人更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人，想换掉[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]（[GetCountry('BYZ').Custom('OeEccPatF')]）。要不要换一位牧首？"
 oe_ecc.32.desc.f: "#F 1354年底，约翰五世重掌君士坦丁堡，坎塔库泽诺斯退位为修士。次年初，卡利斯托斯一世复任牧首，为马太加冕的菲洛泰奥斯去职。#!\n\n新君登基。现任[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]属[GetCountry('BYZ').Custom('OeEccPatF')]，新君更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人。要不要换一位牧首？"
 oe_ecc.32.desc.g: "新君登基。现任[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]属[GetCountry('BYZ').Custom('OeEccPatF')]，新君更中意[GetCountry('BYZ').Custom('OeEccEmpF')]的人。要不要换一位牧首？"
 oe_ecc.32.a: "换一位新君中意的牧首"
 oe_ecc.32.a.tt: "教士满意度#R −5%#!\n[oe_tu_patriarchate|e]#R −2#!\n[SCOPE.sCharacter('oe_ecc_pat').GetName]退居修院；圣主教会议报上新君中意的一派和最大一派的人选"
 oe_ecc.32.b: "留任现任牧首"
 oe_ecc.32.b.tt: "教士满意度#G +5%#!"
 oe_ecc.33.t: "牧首拒绝加冕"
 oe_ecc.33.desc: "#F 1353年，约翰六世·坎塔库泽诺斯要立儿子马太为共治皇帝。牧首卡利斯托斯一世不肯为马太加冕，宁可去职；次年，新牧首菲洛泰奥斯为马太戴上了皇冠。#!\n\n我们宣布马太为共治皇帝，[patriarch|e][SCOPE.sCharacter('oe_ecc_pat').GetName]却不肯主持加冕礼，说帝国已有合法的继承人。没有牧首的加冕，人们会说这顶皇冠来路不正。"
 oe_ecc.33.a: "罢黜牧首，另请人加冕"
 oe_ecc.33.a.tt: "教士满意度#R −10%#!\n[oe_tu_patriarchate|e]#R −3#!\n[SCOPE.sCharacter('oe_ecc_pat').GetName]退居修院；圣主教会议报上三派的人选（史实上是菲洛泰奥斯）"
 oe_ecc.33.b: "不行加冕礼，只发诏书"
 oe_ecc.33.b.tt: "教士满意度#G +5%#!"
 oe_ecc.40.t: "1347年二月的会议"
 oe_ecc.40.desc.a: "#F 1347年2月初，皇太后安娜召集会议，罢黜了反帕拉马斯的牧首约翰十四世·卡勒卡斯；几天后坎塔库泽诺斯进入京城，另一次会议为帕拉马斯恢复名誉，绝罚了阿金迪诺斯。#!\n\n内战结束了，静修之争还没有。[patriarch|e]卡勒卡斯仍在位，此人在战争中站在反帕拉马斯的一边。圣主教会议在等皇帝表态。"
 oe_ecc.40.desc.b: "#F 1347年2月初，皇太后安娜召集会议，罢黜了反帕拉马斯的牧首约翰十四世·卡勒卡斯；几天后坎塔库泽诺斯进入京城，另一次会议为帕拉马斯恢复名誉，绝罚了阿金迪诺斯。#!\n\n内战结束了，静修之争还没有。当年绝罚帕拉马斯的判决仍未撤销，圣主教会议在等皇帝表态。"
 oe_ecc.40.a: "罢黜卡勒卡斯，为帕拉马斯恢复名誉"
 oe_ecc.40.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y +10#!，理性派#Y −8#!，亲合一派#Y −2#!\n[oe_tu_patriarchate|e]#G +3#!\n教士满意度#G +5%#!\n卡勒卡斯退居修院；圣主教会议报上三派的人选（史实上是静修派的伊西多尔）"
 oe_ecc.40.b: "为帕拉马斯恢复名誉"
 oe_ecc.40.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +10#!，理性派#Y −8#!，亲合一派#Y −2#!\n[oe_tu_patriarchate|e]#G +3#!\n教士满意度#G +5%#!"
 oe_ecc.40.c: "牧首留任，教义再议"
 oe_ecc.40.c.tt: "[oe_tu_church_parties|e]份额：静修派#Y −2#!，理性派#Y +5#!，亲合一派#Y −3#!\n学者们的争论还会持续#Y 10#!年"
 oe_ecc.41.t: "布拉赫奈的会议"
 oe_ecc.41.desc: "#F 1351年5月下旬，会议在布拉赫奈宫召开，确认帕拉马斯的教义为正统，反对者受到绝罚；会议的文告（tomos）送往各地教会。#!\n\n[oe_tu_church_parties|e]：静修派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!、理性派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!、亲合一派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!。皇帝可以让会议作出定论，也可以给两派都留些余地。"
 oe_ecc.41.a: "发布会议文告，帕拉马斯的教义为正统"
 oe_ecc.41.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y +12#!，理性派#Y −10#!，亲合一派#Y −2#!\n[oe_tu_patriarchate|e]#G +5#!\n获得[ShowModifier('oe_ecc_tomos')]，持续#Y 10#!年"
 oe_ecc.41.b: "两派各留余地"
 oe_ecc.41.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y −2#!，理性派#Y +4#!，亲合一派#Y −2#!\n[oe_tu_patriarchate|e]#R −2#!"
 oe_ecc.42.t: "1368年的会议"
 oe_ecc.42.desc: "#F 1368年4月，牧首菲洛泰奥斯主持会议，把已故的格里高利·帕拉马斯列为圣人，并定罪阿索斯山大拉伏拉修院的修士普罗霍罗斯·基多内斯：此人用拉丁学者的方法著书反驳帕拉马斯，被革去司铎之职。#!\n\n帕拉马斯已经去世，各地的修院早把此人当圣人敬奉，圣主教会议提议正式封圣。同时有人告发大拉伏拉修院的修士普罗霍罗斯·基多内斯，说此人照拉丁学者的办法著书，反驳帕拉马斯的教义；普罗霍罗斯的兄长德米特里奥斯是朝中的重臣。[oe_tu_church_parties|e]：静修派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!、理性派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!、亲合一派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!。"
 oe_ecc.42.a: "封帕拉马斯为圣人，定罪普罗霍罗斯"
 oe_ecc.42.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y +6#!，理性派#Y −6#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.42.b: "只封圣，不追究"
 oe_ecc.42.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +3#!"
 oe_ecc.42.c: "不封圣"
 oe_ecc.42.c.tt: "[oe_tu_church_parties|e]份额：静修派#Y −6#!，理性派#Y +4#!，亲合一派#Y +2#!\n教士满意度#R −10%#!"
 oe_ecc.50.t: "全罗斯的都主教出缺"
 oe_ecc.50.desc: "#F 1353年3月，基辅与全罗斯都主教狄奥格诺斯图斯在莫斯科去世。莫斯科推举修士阿列克谢继任；阿列克谢前往君士坦丁堡，1354年受祝圣为基辅与全罗斯都主教。#!\n\n罗斯的都主教之位空了。[SCOPE.sCountry('oe_ecc_rus_host').GetName]的使团带着礼物来到圣索菲亚，请求为本国推举的人祝圣。[GetCountry('BYZ').Custom('OeEccAlexiusLine')]\n\n罗斯的都主教向来由君士坦丁堡祝圣，其中不少是希腊人。圣主教会议在等皇帝的意思。"
 oe_ecc.50.a: "为[SCOPE.sCountry('oe_ecc_rus_host').GetName]推举的人祝圣"
 oe_ecc.50.a.tt: "[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +30#!\n[oe_tu_patriarchate|e]#G +3#!\n金币是祝圣的礼金"
 oe_ecc.50.b: "派一位希腊人去当都主教"
 oe_ecc.50.b.tt: "[oe_tu_patriarchate|e]#G +5#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −25#!"
 oe_ecc.50.c: "先拖着，看谁出价高"
 oe_ecc.50.c.tt: "[oe_tu_patriarchate|e]#R −5#!\n罗斯教区：争议，#Y 5#!年后恢复为归属"
 oe_ecc.51.t: "立陶宛要自己的都主教"
 oe_ecc.51.desc.a: "#F 立陶宛大公阿尔吉尔达斯治下有大批正教臣民，大公不愿让这些人听命于莫斯科的都主教。1355年前后，君士坦丁堡应其所请，另立罗曼为立陶宛都主教；1356年的会议同时确认了阿列克谢和罗曼，1361年划定两人的教区。#!\n\n[SCOPE.sCountry('oe_ecc_lit').GetName]的使者又来了：大公治下的罗斯人不愿听命于[SCOPE.sCountry('oe_ecc_rus_host').GetName]那边的都主教，请求另立一位立陶宛的都主教。[SCOPE.sCountry('oe_ecc_rus_host').GetName]已经派人来说：罗斯只能有一位都主教。"
 oe_ecc.51.desc.b: "#F 立陶宛大公阿尔吉尔达斯治下有大批正教臣民，大公不愿让这些人听命于莫斯科的都主教。1355年前后，君士坦丁堡应其所请，另立罗曼为立陶宛都主教；1356年的会议同时确认了阿列克谢和罗曼，1361年划定两人的教区。#!\n\n[SCOPE.sCountry('oe_ecc_lit').GetName]的使者来了：大公治下的罗斯人不愿听命于[SCOPE.sCountry('oe_ecc_rus_host').GetName]那边的都主教，请求另立一位立陶宛的都主教。[SCOPE.sCountry('oe_ecc_rus_host').GetName]已经派人来说：罗斯只能有一位都主教。"
 oe_ecc.51.a: "另立一位立陶宛都主教"
 oe_ecc.51.a.tt: "立陶宛教区：归属\n[SCOPE.sCountry('oe_ecc_lit').GetName]对我们好感#G +30#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −25#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.51.b: "罗斯只能有一位都主教"
 oe_ecc.51.b.tt: "[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +15#!\n[SCOPE.sCountry('oe_ecc_lit').GetName]对我们好感#R −25#!"
 oe_ecc.51.c: "收下礼物，暂不答复"
 oe_ecc.51.c.tt: "[oe_tu_patriarchate|e]#R −3#!\n#Y 5#!年后对方会再来（只再来一次）"
 oe_ecc.52.t: "西普里安的祝圣"
 oe_ecc.52.desc: "#F 1375年12月2日，牧首菲洛泰奥斯祝圣修士西普里安为“基辅、罗斯与立陶宛都主教”，约定阿列克谢死后由西普里安继承全罗斯。莫斯科对此极为不满。#!\n\n[SCOPE.sCountry('oe_ecc_lit').GetName]派人来求一位都主教，推举的是一位饱学的修士。圣主教会议提议：祝圣此人为“基辅、罗斯与立陶宛都主教”，等[SCOPE.sCountry('oe_ecc_rus_host').GetName]现任的都主教去世，再由此人继承全罗斯，罗斯的教会重归一位都主教。[SCOPE.sCountry('oe_ecc_rus_host').GetName]不会高兴。"
 oe_ecc.52.a: "祝圣西普里安"
 oe_ecc.52.a.tt: "立陶宛教区：归属\n约定此人日后继承全罗斯的都主教之位\n[SCOPE.sCountry('oe_ecc_lit').GetName]对我们好感#G +30#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −25#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.52.b: "不许，罗斯的教会不能分开"
 oe_ecc.52.b.tt: "[SCOPE.sCountry('oe_ecc_lit').GetName]对我们好感#R −25#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +15#!"
 oe_ecc.53.t: "莫斯科的人选"
 oe_ecc.53.desc: "#F 阿列克谢死后，莫斯科大公季米特里不认西普里安，另派亲信米佳伊去君士坦丁堡受祝圣；米佳伊1379年死在城外。同行的皮缅1380年受了祝圣，据说凭的是伪造的文书。此后十年，罗斯同时有两三位都主教。#!\n\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]的都主教去世了。按约定，西普里安应当继承全罗斯；[SCOPE.sCountry('oe_ecc_rus_host').GetName]却另派使团前来，请求为本国推举的人祝圣。使团的人还以大公的名义，在城里借了不少钱。"
 oe_ecc.53.a: "坚持西普里安"
 oe_ecc.53.a.tt: "罗斯教区：争议\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −25#!\n立陶宛对我们好感#G +10#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.53.b: "承认[SCOPE.sCountry('oe_ecc_rus_host').GetName]的人选"
 oe_ecc.53.b.tt: "罗斯教区：归属\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +30#!\n立陶宛对我们好感#R −25#!\n[oe_tu_patriarchate|e]#R −5#!\n金币是对方使团以大公的名义借来打点的"
 oe_ecc.53.c: "两个都认"
 oe_ecc.53.c.tt: "罗斯教区：争议\n[oe_tu_patriarchate|e]#R −8#!"
 oe_ecc.54.t: "一位都主教，全罗斯"
 oe_ecc.54.desc: "#F 1389年2月，牧首安东尼四世召开会议，认西普里安为全罗斯唯一的都主教；次年，莫斯科大公瓦西里一世接纳了西普里安。#!\n\n罗斯的两位都主教已经争了好几年，各地的主教无所适从。圣主教会议请皇帝定夺：认哪一位为全罗斯唯一的都主教？"
 oe_ecc.54.a: "开会认西普里安为全罗斯唯一的都主教"
 oe_ecc.54.a.tt: "罗斯教区：归属\n[oe_tu_patriarchate|e]#G +5#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −10#!\n立陶宛对我们好感#G +10#!"
 oe_ecc.54.b: "承认[SCOPE.sCountry('oe_ecc_rus_host').GetName]一方"
 oe_ecc.54.b.tt: "罗斯教区：归属\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +15#!\n立陶宛对我们好感#R −25#!\n[oe_tu_patriarchate|e]#R −3#!"
 oe_ecc.55.t: "礼拜里的皇帝之名"
 oe_ecc.55.desc: "#F 约1393年，莫斯科大公瓦西里一世下令礼拜时不再为皇帝祝祷，说罗斯有教会，却没有皇帝。牧首安东尼四世写信驳斥：基督徒不能只有教会而没有皇帝。#!\n\n消息从罗斯传来：[SCOPE.sCountry('oe_ecc_rus_host').GetName]的教堂里，礼拜时已经不再为皇帝祝祷。圣主教会议问：要不要由牧首写信，把话说清楚？"
 oe_ecc.55.a: "牧首去信：教会离不开皇帝"
 oe_ecc.55.a.tt: "[oe_tu_patriarchate|e]#G +3#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −10#!"
 oe_ecc.55.b: "不去计较"
 oe_ecc.55.b.tt: "[oe_tu_patriarchate|e]#R −5#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +10#!\n日后向罗斯募捐，所得只有#Y 75%#!"
 oe_ecc.56.t: "维托夫特的都主教"
 oe_ecc.56.desc: "#F 1414年或1415年，立陶宛大公维托夫特让境内的正教主教自行推选格里高利·灿布拉克为都主教。牧首叶夫蒂米奥斯二世罢黜并绝罚了灿布拉克；灿布拉克约在1420年去世。#!\n\n[SCOPE.sCountry('oe_ecc_lit').GetName]的主教们没有等君士坦丁堡，自己选出了一位都主教，大公派人来请求追认。[SCOPE.sCountry('oe_ecc_rus_host').GetName]已经抗议了。"
 oe_ecc.56.a: "罢黜并绝罚擅立的都主教"
 oe_ecc.56.a.tt: "立陶宛教区：脱离，#Y 6#!年后恢复为归属\n[SCOPE.sCountry('oe_ecc_lit').GetName]对我们好感#R −50#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +10#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.56.b: "事后承认"
 oe_ecc.56.b.tt: "立陶宛教区：归属\n[SCOPE.sCountry('oe_ecc_lit').GetName]对我们好感#G +30#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −25#!\n[oe_tu_patriarchate|e]#R −5#!"
 oe_ecc.57.t: "谁去罗斯"
 oe_ecc.57.desc: "#F 1436年，罗斯的主教们推举的约纳来到君士坦丁堡，牧首约瑟夫二世却已选定了希腊人伊西多尔。1437年，伊西多尔到了莫斯科，同年9月便动身去意大利，参加与罗马商谈合一的会议。#!\n\n罗斯的都主教之位又空了。[SCOPE.sCountry('oe_ecc_rus_host').GetName]推举的人已在城中等候；可是主张与罗马合一的人另有打算：派一位懂拉丁人、赞成合一的都主教去罗斯，罗斯的教会就会跟着走。如今[oe_tu_church_parties|e]：静修派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!、理性派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!、亲合一派#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!。"
 oe_ecc.57.a: "派亲合一派的伊西多尔"
 oe_ecc.57.a.tt: "[oe_tu_church_parties|e]份额：亲合一派#Y +3#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −25#!\n罗斯日后怎样对待合一，要看此人"
 oe_ecc.57.b: "为罗斯推举的约纳祝圣"
 oe_ecc.57.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +2#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +30#!"
 oe_ecc.58.t: "莫斯科拒绝合一"
 oe_ecc.58.desc: "#F 1441年3月，都主教伊西多尔从佛罗伦萨回到莫斯科，在圣母安息大教堂的礼拜中先为教皇祝祷。大公瓦西里二世和罗斯的主教们不认合一；伊西多尔被关进修院，同年秋天逃往西方。#!\n\n消息从罗斯传来：我们派去的都主教伊西多尔在[SCOPE.sCountry('oe_ecc_rus_host').GetName]宣布了与罗马的合一，那里的君主和主教们不认，把伊西多尔赶下了都主教的座位。罗斯的教会如今没有我们承认的牧人。"
 oe_ecc.58.a: "派人申斥"
 oe_ecc.58.a.tt: "罗斯教区：争议\n[oe_tu_patriarchate|e]#R −3#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −20#!\n罗斯教区争议满#Y 5#!年而合一仍在，罗斯的主教会自选都主教"
 oe_ecc.58.b: "不再追究"
 oe_ecc.58.b.tt: "罗斯教区：争议\n[oe_tu_patriarchate|e]#R −5#!\n罗斯教区争议满#Y 5#!年而合一仍在，罗斯的主教会自选都主教"
 oe_ecc.59.t: "罗斯自己选了都主教"
 oe_ecc.59.desc: "#F 1448年12月15日，罗斯的主教们在莫斯科开会，不经君士坦丁堡，自行选约纳为都主教。罗斯教会的自主由此开始。#!\n\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]的主教们开了会，没有派人来君士坦丁堡求祝圣，自己选出了一位都主教。来信写得客气，意思却明白：只要京城还与罗马合一，罗斯就不从这里领受牧人。"
 oe_ecc.59.a: "抗议"
 oe_ecc.59.a.tt: "罗斯教区：脱离\n[oe_tu_patriarchate|e]#R −10#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#R −10#!"
 oe_ecc.59.b: "默认"
 oe_ecc.59.b.tt: "罗斯教区：脱离\n[oe_tu_patriarchate|e]#R −8#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]对我们好感#G +5#!"
 oe_ecc.60.t: "瓦拉几亚的都主教"
 oe_ecc.60.desc.a: "#F 1359年，牧首卡利斯托斯一世设立翁格罗瓦拉几亚都主教区：原维奇纳都主教雅辛托斯移驻瓦拉几亚君侯的都城阿尔杰什，成为第一任都主教。#!\n\n[SCOPE.sCountry('oe_ecc_wal').GetName]的君侯又派人来了：多瑙河下游的维奇纳已经荒废，那里的都主教雅辛托斯愿意移驻瓦拉几亚。君侯请求设立瓦拉几亚自己的都主教区，归普世牧首管辖。"
 oe_ecc.60.desc.b: "#F 1359年，牧首卡利斯托斯一世设立翁格罗瓦拉几亚都主教区：原维奇纳都主教雅辛托斯移驻瓦拉几亚君侯的都城阿尔杰什，成为第一任都主教。#!\n\n[SCOPE.sCountry('oe_ecc_wal').GetName]的君侯派人来到君士坦丁堡：多瑙河下游的维奇纳已经荒废，那里的都主教雅辛托斯愿意移驻瓦拉几亚。君侯请求设立瓦拉几亚自己的都主教区，归普世牧首管辖。"
 oe_ecc.60.a: "认雅辛托斯为翁格罗瓦拉几亚都主教"
 oe_ecc.60.a.tt: "瓦拉几亚教区：归属\n[SCOPE.sCountry('oe_ecc_wal').GetName]对我们好感#G +30#!\n[oe_tu_patriarchate|e]#G +3#!"
 oe_ecc.60.b: "让对方再等等"
 oe_ecc.60.b.tt: "[SCOPE.sCountry('oe_ecc_wal').GetName]对我们好感#R −25#!\n#Y 3#!年后对方会再来（只再来一次）"
 oe_ecc.60.c: "仍不答应"
 oe_ecc.60.c.tt: "[SCOPE.sCountry('oe_ecc_wal').GetName]对我们好感#R −25#!\n瓦拉几亚的都主教区不再提起"
 oe_ecc.61.t: "摩尔达维亚的约瑟夫"
 oe_ecc.61.desc: "#F 1386年前后，摩尔达维亚自行立约瑟夫·穆沙特为都主教。君士坦丁堡不认，另派希腊人耶利米前往；耶利米被摩尔达维亚人赶走，君士坦丁堡随即绝罚了摩尔达维亚。#!\n\n[SCOPE.sCountry('oe_ecc_mol').GetName]的使者来到君士坦丁堡，请求承认本国自己选出的都主教约瑟夫。约瑟夫没有经过普世牧首的祝圣；认了，就开了先例。"
 oe_ecc.61.a: "承认摩尔达维亚自己选的约瑟夫"
 oe_ecc.61.a.tt: "摩尔达维亚教区：归属\n[SCOPE.sCountry('oe_ecc_mol').GetName]对我们好感#G +30#!\n[oe_tu_patriarchate|e]#R −2#!（开了先例）"
 oe_ecc.61.b: "另派希腊人耶利米"
 oe_ecc.61.b.tt: "摩尔达维亚教区：争议\n[SCOPE.sCountry('oe_ecc_mol').GetName]对我们好感#R −25#!\n[oe_tu_patriarchate|e]#G +1#!"
 oe_ecc.62.t: "与摩尔达维亚教会和解"
 oe_ecc.62.desc: "#F 1401年，君士坦丁堡的圣主教会议撤销对摩尔达维亚的绝罚，承认约瑟夫·穆沙特为摩尔达维亚都主教。#!\n\n与[SCOPE.sCountry('oe_ecc_mol').GetName]的教会争了这些年，那里的人照旧只认约瑟夫。土耳其人一年比一年近，圣主教会议在问：是不是该和解了？"
 oe_ecc.62.a: "撤销绝罚，承认约瑟夫"
 oe_ecc.62.a.tt: "摩尔达维亚教区：归属\n我们与[SCOPE.sCountry('oe_ecc_mol').GetName]互相好感#G +50#!\n[oe_tu_patriarchate|e]#G +3#!"
 oe_ecc.62.b: "维持绝罚"
 oe_ecc.62.b.tt: "摩尔达维亚教区：脱离\n[SCOPE.sCountry('oe_ecc_mol').GetName]对我们好感#R −50#!\n[oe_tu_patriarchate|e]#R −3#!"
 oe_ecc.70.t: "一半修院地产"
 oe_ecc.70.desc: "#F 1371年9月，塞尔维亚人在马里查河战败，土耳其人逼近马其顿。镇守塞萨洛尼基的曼努埃尔把修院的田庄（包括阿索斯山各修院在当地的产业）收作普罗尼亚，分给士兵，说等时局好了再还；相传收去的有一半。#!\n\n土耳其人一年比一年近，塞萨洛尼基的守军却无地可分。有人提议：把修院的田庄收回一半，作[oe_tu_pronoia|e]分给士兵，等时局好了再还。修士们搬出历代皇帝的金玺诏书抗议。[GetCountry('BYZ').Custom('OeEccNobleMonLine')]"
 oe_ecc.70.a: "收一半修院地产，分给士兵"
 oe_ecc.70.a.tt: "修院地产改为“半数作普罗尼亚”：获得[ShowModifier('oe_ecc_mon_1')]，[ShowModifier('oe_ecc_mon_3')]（若有）取消\n获得相当于#G 6#!个月的人力\n教士满意度#R −10%#!\n[oe_tu_church_parties|e]份额：静修派#Y −4#!，理性派#Y +2#!，亲合一派#Y +2#!\n[oe_tu_patriarchate|e]#R −2#!\n#Y 10#!年后，修院会来要回田产"
 oe_ecc.70.b: "只向修院借一年的地租"
 oe_ecc.70.b.tt: "教士满意度#R −5%#!"
 oe_ecc.70.c: "不动修院"
 oe_ecc.70.c.tt: "教士满意度#G +5%#!\n[oe_tu_church_parties|e]份额：静修派#Y +2#!"
 oe_ecc.71.t: "修院要回田产"
 oe_ecc.71.desc.a: "#F 收地的时候说的是“等时局好了再还”。修院把这句话记了下来，此后一再上书讨要。#!\n\n修院的人又来了。修院的田庄作[oe_tu_pronoia|e]已有多年。如今边境无事，国库也有了些积蓄，各修院联名上书：该把田产还给教会了。领着这些田庄的士兵自然不肯。"
 oe_ecc.71.desc.b: "#F 收地的时候说的是“等时局好了再还”。修院把这句话记了下来，此后一再上书讨要。#!\n\n修院的田庄作[oe_tu_pronoia|e]已有多年。如今边境无事，国库也有了些积蓄，各修院联名上书：该把田产还给教会了。领着这些田庄的士兵自然不肯。"
 oe_ecc.71.a: "把那一半还给修院"
 oe_ecc.71.a.tt: "修院地产恢复“常例”：[ShowModifier('oe_ecc_mon_1')]取消\n教士满意度#G +10%#!\n[oe_tu_church_parties|e]份额：静修派#Y +3#!"
 oe_ecc.71.b: "再拖一拖"
 oe_ecc.71.b.tt: "教士满意度#R −5%#!\n[oe_tu_church_parties|e]份额：静修派#Y −2#!\n#Y 10#!年后修院会再来"
 oe_ecc.71.c: "折价补偿修院，了结此事"
 oe_ecc.71.c.tt: "修院地产恢复“常例”：[ShowModifier('oe_ecc_mon_1')]取消"
 oe_ecc.71.d: "余下的一半也收归国库"
 oe_ecc.71.d.tt: "修院地产全部“入官”：获得[ShowModifier('oe_ecc_mon_0')]，[ShowModifier('oe_ecc_mon_1')]取消；此后每年一月静修派份额#Y −3#!\n教士满意度#R −10%#!\n[oe_tu_church_parties|e]份额：静修派#Y −4#!，理性派#Y +2#!，亲合一派#Y +2#!\n[oe_tu_patriarchate|e]#R −3#!"
 oe_ecc.72.t: "圣山的新主人"
 oe_ecc.72.desc: "#F 奥斯曼人占据马其顿之后，阿索斯山的修院派人去见苏丹，换来保全修院和田产的文书。此后几百年，圣山在苏丹治下照旧修行。#!\n\n圣山已不在帝国手里，山下的田庄也归了奥斯曼人。修院的长老们来信：山上有人主张去见苏丹，求一纸保全修院的特许状，只是要花钱打点。京城肯不肯出这笔钱？[GetCountry('BYZ').Custom('OeEccAthosWalLine')]"
 oe_ecc.72.a: "让圣山自谋出路"
 oe_ecc.72.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y −3#!"
 oe_ecc.72.b: "出钱替圣山向苏丹求特许状"
 oe_ecc.72.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +4#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.80.t: "向罗斯求援"
 oe_ecc.80.desc: "#F 1398年，京城被围已经四年。曼努埃尔二世和牧首写信向莫斯科求援。莫斯科没有派兵，都主教西普里安却在罗斯各地为君士坦丁堡募捐，大公和百姓都出了钱。#!\n\n城外是奥斯曼人的营寨，城里的粮食和钱都在减少。有人提议：请牧首写信给罗斯的都主教，在[SCOPE.sCountry('oe_ecc_rus_host').GetName]各地为君士坦丁堡募捐。凭[oe_tu_patriarchate|e]如今的分量，大约能募到#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ecc_alms_value')|0]#!金币。"
 oe_ecc.80.a: "牧首写信，请罗斯的都主教募捐"
 oe_ecc.80.a.tt: "[oe_tu_patriarchate|e]#R −1#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]决定捐多少；银子约#Y 3#!个月后运到"
 oe_ecc.80.b: "不向北方伸手"
 oe_ecc.81.t: "君士坦丁堡的求援信"
 oe_ecc.81.desc: "#F 1398年前后，君士坦丁堡的皇帝和牧首向莫斯科求援。莫斯科没有派兵，都主教西普里安却在罗斯各地为君士坦丁堡募捐。#!\n\n君士坦丁堡的牧首来信：京城被奥斯曼人围困多年，皇帝请罗斯的正教徒施以援手，求的是#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_v').GetValue|0]#!金币。我们的都主教已经准备在各地募捐，只等我们的意思。"
 oe_ecc.81.a: "慷慨解囊"
 oe_ecc.81.a.tt: "我们出一半，其余由各地的僧俗捐出；君士坦丁堡收到#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_v').GetValue|0]#!金币"
 oe_ecc.81.b: "略表心意"
 oe_ecc.81.b.tt: "君士坦丁堡收到#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ecc_alms_half')|0]#!金币"
 oe_ecc.81.c: "推说路远"
 oe_ecc.81.c.tt: "君士坦丁堡什么也收不到\n君士坦丁堡的[oe_tu_patriarchate|e]#Y −2#!"
 oe_ecc.82.t: "北方来的银子"
 oe_ecc.82.desc.a: "#F 1398年至1400年间，罗斯的僧俗为君士坦丁堡捐出银子，数目的说法不一。#!\n\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_from').GetCountry.GetName]的银子运到了，一共#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_got').GetValue|0]#!金币。都主教在信里说，大公和各地的僧俗都出了钱。"
 oe_ecc.82.desc.b: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_from').GetCountry.GetName]的回信到了：路途遥远，爱莫能助。"
 oe_ecc.82.a: "替皇帝谢过大公"
 oe_ecc.82.b: "北方指望不上了"
 oe_ecc.90.t: "圣山来的修士"
 oe_ecc.90.desc: "#F 静修派的修士常从阿索斯山来到京城，在修院里讲解静默的祈祷；帕拉马斯和好几位牧首都出自圣山。#!\n\n几位阿索斯山的修士到了京城，在城里的修院讲解静默的祈祷，来听的人挤满了院子。有人提议请这些修士进宫讲道；宫里的学者劝皇帝离这些人远一点。"
 oe_ecc.90.a: "请修士进宫讲道"
 oe_ecc.90.a.tt: "[oe_tu_church_parties|e]份额：静修派#Y +3#!\n教士满意度#G +5%#!"
 oe_ecc.90.b: "敬而远之"
 oe_ecc.90.b.tt: "[oe_tu_church_parties|e]份额：理性派#Y +2#!"
 oe_ecc.91.t: "学者的抄本"
 oe_ecc.91.desc: "#F 14世纪的君士坦丁堡和塞萨洛尼基学风很盛：学者校勘古人的哲学、天文和数学著作，开馆授徒。静修派的修士对这类“外邦的学问”多有非议。#!\n\n宫廷里的一位学者请求资助：重抄一批古人的哲学和天文著作，再开一间学堂。[GetCountry('BYZ').Custom('OeEccDisputeLine')]"
 oe_ecc.91.a: "资助抄本与学堂"
 oe_ecc.91.a.tt: "[oe_tu_church_parties|e]份额：理性派#Y +3#!"
 oe_ecc.91.b: "不予理会"
 oe_ecc.91.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +1#!"
 oe_ecc.92.t: "拉丁修士来访"
 oe_ecc.92.desc: "#F 金角湾对岸的佩拉有拉丁人的修院，那里的修士常过海来，与希腊学者谈论两个教会的分歧；有的希腊人因此倒向罗马。#!\n\n几位拉丁修士求见，想在宫中与我们的神学家当面论道。主张合一的人乐见其成；静修派的修士要求把来人请走。"
 oe_ecc.92.a: "以礼相待"
 oe_ecc.92.a.tt: "[oe_tu_church_parties|e]份额：亲合一派#Y +3#!\n教皇国对我们好感#G +15#!\n教士满意度#R −5%#!"
 oe_ecc.92.b: "请来人离开"
 oe_ecc.92.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y +2#!"
 oe_ecc.93.t: "皇帝的教会权利"
 oe_ecc.93.desc: "#F 相传1380年代牧首尼洛斯在位时，圣主教会议应约翰五世的要求，把皇帝在教会里的权利逐条写明：皇帝可以否决都主教的人选，可以调任主教、合并教区。条文的年份和细目，今人的说法不一。#!\n\n皇帝在教会里历来有些不成文的权利。有人提议让圣主教会议把这些权利逐条写明，免得日后争执；主教们并不情愿。"
 oe_ecc.93.a: "让会议写明皇帝的权利"
 oe_ecc.93.a.tt: "教士满意度#R −10%#!\n今后任命不属当道一派的[patriarch|e]，花费的[oe_tu_authority|e]减少#G 2#!"
 oe_ecc.93.b: "教会的事交给会议自理"
 oe_ecc.93.b.tt: "教士满意度#G +5%#!\n[oe_tu_patriarchate|e]#G +2#!"
 oe_ecc.94.t: "修院求赐金玺诏书"
 oe_ecc.94.desc: "#F 历代皇帝用金玺诏书赐给修院田产，免去赋税和差役；阿索斯山各修院至今保存着这样的诏书。#!\n\n一座修院派人进京，带着前朝诏书的抄本，请皇帝也颁一道金玺诏书，免去修院田庄的赋税。如今修院地产：[GetCountry('BYZ').Custom('OeEccMon')]。"
 oe_ecc.94.a: "颁赐金玺诏书"
 oe_ecc.94.a.tt: "修院地产升一级（入官、半数作普罗尼亚、常例、豁免，依次向上），修正随之更换\n教士满意度#G +5%#!"
 oe_ecc.94.b: "不赐"
 oe_ecc.94.b.tt: "[oe_tu_church_parties|e]份额：静修派#Y −1#!"
