l_simp_chinese:
 oe_itw_b_exarchate_threat: "忌惮东罗马意大利督府野心"
 oe_itw_b_italian_protector: "东罗马声援意大利诸邦自主"
 oe_itw_b_adriatic_accord: "亚得里亚海务实分界约"
 oe_itw_b_cambrai_hostile: "康布雷危机期间的东罗马施压"
 oe_itw_b_rome_shield: "东罗马护卫罗马城之谊"
 oe_itw_b_bologna_protest: "博洛尼亚加冕的东方帝国抗议"
 oe_itw_b_peninsular_balance: "意大利半岛均势保证人"
 oe_itw_b_trade_neutrality: "亚得里亚与第勒尼安商贸中立"
 STATIC_MODIFIER_NAME_oe_itw_exarchate_ambition: "意大利督府旧统之志"
 STATIC_MODIFIER_DESC_oe_itw_exarchate_ambition: "重申查士丁尼时代意大利督府法统，激发全军尚武与帝威，却引发西方外交孤立与军费攀升。"
 STATIC_MODIFIER_NAME_oe_itw_italian_liberties: "意大利自由守护者"
 STATIC_MODIFIER_DESC_oe_itw_italian_liberties: "以“抵御越山强权”之名联结意大利城邦，赢得外交声望与海权威慑，却需常年承担外交津贴。"
 STATIC_MODIFIER_NAME_oe_itw_adriatic_neutrality: "亚得里亚商贸中立"
 STATIC_MODIFIER_DESC_oe_itw_adriatic_neutrality: "在拉丁列强互耗之际保持武装中立、承接转口商流，财税稳固却令帝国的西方声望受损。"
 STATIC_MODIFIER_NAME_oe_itw_magna_graecia_push: "大希腊南意经略"
 STATIC_MODIFIER_DESC_oe_itw_magna_graecia_push: "皇家舰队频繁巡弋阿普利亚与那不勒斯海域，强化攻城与海战威慑，但舰队补给耗资甚巨。"
 STATIC_MODIFIER_NAME_oe_itw_south_italy_ports: "那不勒斯与巴勒莫港市特权"
 STATIC_MODIFIER_DESC_oe_itw_south_italy_ports: "以护航协定换取南意与西西里海港的优惠税率，商运兴盛却令国内保守贵族质疑朝廷妥协。"
 STATIC_MODIFIER_NAME_oe_itw_exile_talent: "南意希腊裔学者与水手归流"
 STATIC_MODIFIER_DESC_oe_itw_exile_talent: "收容因那不勒斯战乱北迁的南意学者与工匠，文教研究受益，却与旧贵族争夺宫廷恩荫。"
 STATIC_MODIFIER_NAME_oe_itw_ravenna_banner: "拉文纳督府旌旗"
 STATIC_MODIFIER_DESC_oe_itw_ravenna_banner: "高举拉文纳旧都旗号挑战威尼斯亚得里亚霸权，桨帆战舰战力大增，商路却因对峙承压。"
 STATIC_MODIFIER_NAME_oe_itw_venetian_detente: "亚得里亚分界缓和"
 STATIC_MODIFIER_DESC_oe_itw_venetian_detente: "与威尼斯务实划定势力范围，造船与远洋商运提速，却让视1204年为奇耻的臣民深感憋屈。"
 STATIC_MODIFIER_NAME_oe_itw_genoese_counterweight: "热那亚—亚得里亚商贸制衡"
 STATIC_MODIFIER_DESC_oe_itw_genoese_counterweight: "扶植热那亚与中小港市对抗威尼斯垄断，商税与外交斡旋增益，但商帮纷争消耗朝廷精力。"
 STATIC_MODIFIER_NAME_oe_itw_cambrai_reckoning: "康布雷清算威尼斯"
 STATIC_MODIFIER_DESC_oe_itw_cambrai_reckoning: "趁欧洲列强围攻威尼斯之机施压清算旧怨，军威与攻城气势大振，市民商界却因商路震荡不满。"
 STATIC_MODIFIER_NAME_oe_itw_venetian_protectorate: "庇护危境中的威尼斯"
 STATIC_MODIFIER_DESC_oe_itw_venetian_protectorate: "向孤立无援的威尼斯出售帝国庇护与特许，商贸红利丰厚，但招致法奥教廷各方侧目。"
 STATIC_MODIFIER_NAME_oe_itw_aloof_prudence: "冷观列强合纵连横"
 STATIC_MODIFIER_DESC_oe_itw_aloof_prudence: "不为朝秦暮楚的意大利同盟所动，专务内阁与税政整理，代价是暂时放弃西方外交话语权。"
 STATIC_MODIFIER_NAME_oe_itw_imperial_protector_rome: "罗马城护教帝国"
 STATIC_MODIFIER_DESC_oe_itw_imperial_protector_rome: "在西方雇佣兵威胁罗马之际伸出援手，东罗马外交声望响彻全欧，却激起国内正教强硬派教士抗议。"
 STATIC_MODIFIER_NAME_oe_itw_orthodox_vindication: "东方正统之鉴"
 STATIC_MODIFIER_DESC_oe_itw_orthodox_vindication: "以罗马浩劫昭告西方帝统失德，国内正教教士与信仰凝聚力大涨，却令天主教诸国关系结冰。"
 STATIC_MODIFIER_NAME_oe_itw_roman_archives: "抢救意大利古典手稿"
 STATIC_MODIFIER_DESC_oe_itw_roman_archives: "趁乱重金抢救罗马与北意图书馆珍本并礼聘学者，科研与文化影响提升，宫廷开销引发合法性非议。"
 STATIC_MODIFIER_NAME_oe_itw_pike_and_shot: "长矛火枪方阵与野战青铜炮"
 STATIC_MODIFIER_DESC_oe_itw_pike_and_shot: "吸纳意大利战争最新火器方阵与野战炮术，全军纪律与攻城锐增，但军饷与火药维护成本高昂。"
 STATIC_MODIFIER_NAME_oe_itw_stratioti_condottieri: "斯特拉蒂奥提轻骑与雇佣队长战术"
 STATIC_MODIFIER_DESC_oe_itw_stratioti_condottieri: "将希腊斯特拉蒂奥提轻骑的机动与意大利雇佣队长的合同兵制融为一体，机动作战凌厉而纪律稍难驯服。"
 STATIC_MODIFIER_NAME_oe_itw_native_drill: "本土军区操典有限改良"
 STATIC_MODIFIER_DESC_oe_itw_native_drill: "维持低成本的本土军区兵役与后勤，人力充裕且维持费节俭，但在攻坚重炮战场上略显迟滞。"
 STATIC_MODIFIER_NAME_oe_itw_bologna_arbitration: "博洛尼亚东方帝国仲裁"
 STATIC_MODIFIER_DESC_oe_itw_bologna_arbitration: "公然挑战西方加冕独占权并要求以东罗马为仲裁共主，帝威与外交容量跃升，国内却承受长期备战压力。"
 STATIC_MODIFIER_NAME_oe_itw_bologna_balance: "博洛尼亚两帝互认与城邦自主"
 STATIC_MODIFIER_DESC_oe_itw_bologna_balance: "以保障米兰与佛罗伦萨自主为条件斡旋东西两帝对等互认，商贸与外交顺遂，却须在皇号礼仪上作出妥协。"
 STATIC_MODIFIER_NAME_oe_itw_bologna_charters: "博洛尼亚意大利商埠关税特许"
 STATIC_MODIFIER_DESC_oe_itw_bologna_charters: "借列强议和之际签下遍及米兰、佛罗伦萨与海港的永久商约，商税丰厚，陆军锐气则因重商而略缓。"
 STATIC_MODIFIER_NAME_oe_itw_end_exarchate: "重光意大利督府：三强争霸胜局"
 STATIC_MODIFIER_DESC_oe_itw_end_exarchate: "东罗马在意大利战争中立稳亚平宁足跟，帝威与军魂登峰造极，但跨海驻防与西方忌惮成为长久重负。"
 STATIC_MODIFIER_NAME_oe_itw_end_balance: "亚平宁均势宪章：东西调停者"
 STATIC_MODIFIER_DESC_oe_itw_end_balance: "东罗马成为意大利半岛均势的公认保证人，外交与地中海海贸繁荣，代价是克制了军事扩张锋芒。"
 STATIC_MODIFIER_NAME_oe_itw_end_withdrawal: "战略回撤东方：专务帝国腹心"
 STATIC_MODIFIER_DESC_oe_itw_end_withdrawal: "主动抽身亚平宁泥潭，将财力与行政重心收归东地中海与安纳托利亚，内政稳健但西方威望回落。"
 STATIC_MODIFIER_NAME_oe_itw_stratioti_levy: "皇家斯特拉蒂奥提轻骑营"
 STATIC_MODIFIER_DESC_oe_itw_stratioti_levy: "按意大利战场合同重金编练的希腊轻骑兵团，机动作战出众，军饷开销亦随之增加。"
 STATIC_MODIFIER_NAME_oe_itw_italian_envoy: "驻意大利诸邦常设使团"
 STATIC_MODIFIER_DESC_oe_itw_italian_envoy: "在威尼斯、米兰、佛罗伦萨与那不勒斯常驻帝国使节，外交与商运畅通，保守派却质疑拉丁礼仪浸染。"
 STATIC_MODIFIER_NAME_oe_itw_exarchate_seat: "重设拉文纳—意大利督府驻节"
 STATIC_MODIFIER_DESC_oe_itw_exarchate_seat: "在意大利实地重开帝国督府衙门，威震亚得里亚海两岸，而跨海统辖的行政成本亦不菲。"
 oe_itw_dec_stratioti_contract.title: "召募皇家斯特拉蒂奥提轻骑营"
 oe_itw_dec_stratioti_contract.desc: "在意大利战争年代重金编练精锐的希腊斯特拉蒂奥提轻骑兵团，提升轻骑战力与行军速度，但需承担额外的陆军维持开销。"
 oe_itw_dec_stratioti_contract.a: "签发轻骑兵团军饷契约"
 oe_itw_dec_italian_embassy.title: "遣使意大利诸邦议和促商"
 oe_itw_dec_italian_embassy.desc: "向威尼斯、佛罗伦萨、米兰、热那亚与那不勒斯派出常设使节，在战乱半岛维系罗马外交信誉与商路畅通（代价：国内保守派略微非议）。"
 oe_itw_dec_italian_embassy.a: "厚礼通使亚平宁诸邦"
 oe_itw_dec_proclaim_exarchate.title: "敕复拉文纳—意大利督府"
 oe_itw_dec_proclaim_exarchate.desc: "既然帝国已在拉文纳、那不勒斯、巴勒莫或罗马重新立稳足跟，便可正式重开查士丁尼时代的意大利督府驻节，号令亚得里亚海西岸。"
 oe_itw_dec_proclaim_exarchate.a: "重开意大利督府衙门"
 oe_itw.1.t: "越山之师：意大利战争爆发"
 oe_itw.1.d: "1494年前后，法兰西王师携重型青铜野战炮翻越阿尔卑斯山南下亚平宁，与阿拉贡、哈布斯堡及意大利诸邦围绕那不勒斯与北意霸权展开长达半世纪的血战。在史实中，法王查理八世甚至从流亡的安德烈亚斯手中买下了拜占庭帝号宣称，作为南下东征的旗号。\n\n然而此刻，活生生的东罗马帝国依然屹立于博斯普鲁斯海峡！面对阿尔卑斯以北的铁蹄践踏昔日罗马故土，帝国将如何定调对意大利战争的战略？"
 oe_itw.1.a: "宣示古老意大利督府法统，以第三强权之姿强势介入"
 oe_itw.1.a.tt: "确立#bold #color_yellow 督府介入#!#!立场，金币#R −100#!、稳定#R −5#!，获得[ShowModifier('oe_itw_exarchate_ambition')]（#Y 20年#!）；法兰西、阿拉贡、教皇国好感下降。"
 oe_itw.1.b: "标榜“意大利自由守护者”，联结诸邦制衡越山强权"
 oe_itw.1.b.tt: "确立#bold #color_yellow 半岛均势#!#!立场，金币#R −80#!，获得[ShowModifier('oe_itw_italian_liberties')]（#Y 20年#!）；佛罗伦萨、米兰、那不勒斯好感提升，法兰西好感下降。"
 oe_itw.1.c: "严守亚得里亚商贸中立，坐观拉丁诸强互耗"
 oe_itw.1.c.tt: "确立#bold #color_yellow 商贸中立#!#!立场，威望#R −8#!，获得[ShowModifier('oe_itw_adriatic_neutrality')]（#Y 20年#!）；威尼斯、热那亚好感提升。"
 oe_itw.2.t: "大希腊与那不勒斯之争"
 oe_itw.2.d: "战火迅速烧向意大利南部——那不勒斯与西西里的巴勒莫自古便是希腊殖民的“大希腊”故土，也是中世纪东罗马伦巴第军区的旧疆。如今法兰西与阿拉贡围绕那不勒斯王位殊死相搏，亚得里亚海西岸的阿普利亚港市人心惶惶。\n\n君士坦丁堡的舰队与使节近在咫尺，朝廷当借机重申南意旧土权、以护航换取那不勒斯与巴勒莫港市免税，还是收容避乱而来的南意希腊裔学者与水手？"
 oe_itw.2.a: "派出皇家舰队巡弋阿普利亚，重申大希腊旧土权"
 oe_itw.2.a.tt: "金币#R −90#!，意大利影响力提升，获得[ShowModifier('oe_itw_magna_graecia_push')]（#Y 15年#!）；那不勒斯、阿拉贡、法兰西好感下降。"
 oe_itw.2.b: "与那不勒斯及西西里密约护航，换取巴勒莫与南意港市特权"
 oe_itw.2.b.tt: "金币#R −60#!，获得[ShowModifier('oe_itw_south_italy_ports')]（#Y 15年#!）；那不勒斯与西西里好感提升。"
 oe_itw.2.c: "避开南意泥潭，吸纳逃离战火的希腊裔学者与水手"
 oe_itw.2.c.tt: "稳定#R −4#!，获得[ShowModifier('oe_itw_exile_talent')]（#Y 15年#!）。"
 oe_itw.3.t: "拉文纳督府与威尼斯宿怨"
 oe_itw.3.d: "亚得里亚海西岸的拉文纳曾是查士丁尼时代帝国驻意大利督府的治所，城中圣维塔莱大教堂的马赛克至今仍闪耀着紫袍帝后的荣光。随着教皇国与威尼斯围绕罗马涅和拉文纳的控制权爆发激战，东罗马在亚得里亚海的千年宿敌威尼斯陷入两线承压。\n\n面对拉文纳旧都与威尼斯的商海霸权，朝廷应趁势声索拉文纳旧统、与威尼斯务实划界分利，还是暗中扶植热那亚商团制衡威尼斯？"
 oe_itw.3.a: "高举拉文纳督府旧旗，挑战威尼斯亚得里亚海霸权"
 oe_itw.3.a.tt: "金币#R −80#!，意大利影响力提升，获得[ShowModifier('oe_itw_ravenna_banner')]（#Y 15年#!）；威尼斯好感大降，教皇国好感提升。"
 oe_itw.3.b: "与威尼斯密定亚得里亚分界约，换取其退出爱琴海争端"
 oe_itw.3.b.tt: "威望#R −12#!，获得[ShowModifier('oe_itw_venetian_detente')]（#Y 15年#!）；威尼斯好感提升，教皇国好感下降。"
 oe_itw.3.c: "资助热那亚与中小港市商团抗衡威尼斯垄断"
 oe_itw.3.c.tt: "金币#R −70#!，获得[ShowModifier('oe_itw_genoese_counterweight')]（#Y 15年#!）；热那亚好感提升，威尼斯好感下降。"
 oe_itw.4.t: "康布雷同盟与合纵连横"
 oe_itw.4.d: "1508年，教廷、法兰西、哈布斯堡与阿拉贡联手缔结“康布雷同盟”，誓要瓜分傲慢的威尼斯共和国；然而不出三年，列强又因忌惮法兰西独大而瞬间反目，转头拉拢威尼斯组建“神圣同盟”。意大利外交瞬息万变，盟友与仇敌只在一纸密约之间。\n\n昔日1204年主导劫掠君士坦丁堡的威尼斯正处生死边缘。东罗马当顺势落井下石清算百年旧怨，向危难中的威尼斯高价出售帝国庇护，还是冷眼旁观拉丁同盟朝秦暮楚？"
 oe_itw.4.a: "顺势加入反威施压，清算第四次十字军百年旧怨"
 oe_itw.4.a.tt: "金币#R −90#!，意大利影响力提升，获得[ShowModifier('oe_itw_cambrai_reckoning')]（#Y 15年#!）；威尼斯好感大降，教廷、法兰西、哈布斯堡好感提升。"
 oe_itw.4.b: "反向向危难中的威尼斯出售庇护，迫其重金纳礼"
 oe_itw.4.b.tt: "获得金币#G +120#!、威望#R −8#!，获得[ShowModifier('oe_itw_venetian_protectorate')]（#Y 15年#!）；威尼斯好感大涨，法兰西与哈布斯堡好感下降。"
 oe_itw.4.c: "坐观拉丁同盟朝秦暮楚，专务国内兵备与财税"
 oe_itw.4.c.tt: "威望#R −5#!，获得[ShowModifier('oe_itw_aloof_prudence')]（#Y 15年#!）。"
 oe_itw.5.t: "罗马之劫与两罗马的抉择"
 oe_itw.5.d: "连年血战彻底引爆了雇佣兵欠饷的灾难——失控的帝国雇佣兵团兵临罗马城下，洗劫圣城、围困教皇的惊变（1527年“罗马之劫”）震动整个基督教世界。第一罗马的宫廷在火光中颤抖，而博斯普鲁斯的第二罗马却巍然屹立。\n\n这是数百年未有之历史转折：东罗马是派遣舰队与使团向危难中的罗马伸出援手、以“护教帝国”震撼西欧，还是向正教世界痛斥西方帝统失德，抑或趁乱抢救罗马与意大利宫廷的珍贵古典藏书？"
 oe_itw.5.a: "遣舰队与使团护卫罗马城，重塑“护教罗马帝国”威望"
 oe_itw.5.a.tt: "金币#R −110#!，获得[ShowModifier('oe_itw_imperial_protector_rome')]（#Y 20年#!）；教皇国好感大涨，哈布斯堡好感下降，国内正教教士不满。"
 oe_itw.5.b: "以罗马惨劫为鉴，向正教世界昭告西方帝统失德"
 oe_itw.5.b.tt: "威望#G +10#!、宗教影响力#G +15#!，获得[ShowModifier('oe_itw_orthodox_vindication')]（#Y 20年#!）；教皇国与哈布斯堡好感下降。"
 oe_itw.5.c: "重金抢救罗马与意大利宫廷的古典手稿与流亡学者"
 oe_itw.5.c.tt: "金币#R −75#!，获得[ShowModifier('oe_itw_roman_archives')]（#Y 20年#!）。"
 oe_itw.6.t: "雇佣队长、火枪与希腊轻骑兵"
 oe_itw.6.d: "意大利战争不仅是外交的修罗场，更是欧洲军事革命的熔炉：瑞士与德意志长矛方阵、西班牙火绳枪大方阵、法军野战青铜炮，以及威尼斯重金雇佣的希腊“斯特拉蒂奥提”轻骑兵，正在彻底改写中世纪以来的战争形态。\n\n派驻意大利的帝国观察员呈上厚厚的军制奏折。帝国陆军将如何取舍这场昂贵而残酷的军事革新？"
 oe_itw.6.a: "全面引入长矛火枪方阵与野战青铜炮制"
 oe_itw.6.a.tt: "金币#R −120#!、贵族满意度下降，获得[ShowModifier('oe_itw_pike_and_shot')]（#Y 25年#!；高额陆军维持费）。"
 oe_itw.6.b: "融合希腊斯特拉蒂奥提轻骑与意大利雇佣队长战术"
 oe_itw.6.b.tt: "金币#R −80#!、稳定#R −4#!，获得[ShowModifier('oe_itw_stratioti_condottieri')]（#Y 25年#!）。"
 oe_itw.6.c: "坚持本土军区操典，仅做低耗有限改良"
 oe_itw.6.c.tt: "金币#R −40#!，获得[ShowModifier('oe_itw_native_drill')]（#Y 25年#!；攻城能力略降但节俭省兵）。"
 oe_itw.7.t: "博洛尼亚和约与帝国仲裁"
 oe_itw.7.d: "围绕米兰公国与佛罗伦萨共和国的反复厮杀令半岛精疲力竭。列强与教廷齐聚博洛尼亚商讨停战与神圣罗马皇帝加冕礼——在史实中，1530年博洛尼亚加冕宣告了哈布斯堡对意大利的独霸。\n\n但在本局中，东罗马的舰队与使节赫然在场！面对米兰、佛罗伦萨的命运与“谁才是真罗马皇帝”的两帝法理交锋，朝廷在博洛尼亚会议上如何落子？"
 oe_itw.7.a: "强硬否决西方独占加冕，要求以东罗马为博洛尼亚仲裁共主"
 oe_itw.7.a.tt: "金币#R −100#!、威望#G +15#!，意大利影响力大增，获得[ShowModifier('oe_itw_bologna_arbitration')]（#Y 20年#!）；哈布斯堡与教廷好感下降，米兰、佛罗伦萨好感提升。"
 oe_itw.7.b: "以保障米兰与佛罗伦萨自主为条件，斡旋东西两帝对等互认"
 oe_itw.7.b.tt: "威望#R −10#!，获得[ShowModifier('oe_itw_bologna_balance')]（#Y 20年#!）；米兰、佛罗伦萨、教廷、哈布斯堡好感提升。"
 oe_itw.7.c: "趁列强议和之际，在意大利商埠签定永久关税特许"
 oe_itw.7.c.tt: "获得金币#G +100#!、威望#R −8#!，获得[ShowModifier('oe_itw_bologna_charters')]（#Y 20年#!）；米兰与佛罗伦萨好感提升。"
 oe_itw.8.t: "意大利半岛的终局"
 oe_itw.8.d: "历经半个世纪的铁火、合纵与瘟疫，意大利战争终于迎来尾声。瓦卢瓦法兰西、哈布斯堡与东罗马三强在亚平宁半岛的角力尘埃落定，拉文纳、那不勒斯、米兰与罗马的命运都因博斯普鲁斯的介入而改写。\n\n站在十六世纪中叶的十字路口，帝国必须为这段意大利大博弈画上最终句号：重立意大利督府、作为半岛均势的永久保证人，还是战略回撤东方专务腹心？"
 oe_itw.8.a: "重光意大利督府：双头鹰旗正式俯瞰亚平宁半岛"
 oe_itw.8.a.tt: "结局一（#bold #color_yellow 重光督府#!#!）：金币#R −150#!、稳定#R −8#!、威望#G +25#!，获得[ShowModifier('oe_itw_end_exarchate')]（#Y 35年#!）；西方列强好感全面下降。"
 oe_itw.8.b: "确立亚平宁均势宪章：东罗马居间调停东西诸邦"
 oe_itw.8.b.tt: "结局二（#bold #color_yellow 半岛均势#!#!）：金币#R −80#!、威望#G +15#!，获得[ShowModifier('oe_itw_end_balance')]（#Y 35年#!）；意大利诸邦与教廷好感提升。"
 oe_itw.8.c: "战略回撤东方：抽身亚平宁泥潭，专务东地中海腹心"
 oe_itw.8.c.tt: "结局三（#bold #color_yellow 战略回撤#!#!）：威望#R −15#!、稳定#G +8#!，获得[ShowModifier('oe_itw_end_withdrawal')]（#Y 35年#!）。"
 oe_itw.20.t: "意大利战争干涉：选项生效"
 oe_itw.90.t: "意大利战争帝国干涉总览"
 oe_itw.90.d: "#T 意大利战争干涉状态#!\n原版局势激活 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_sit')|0]  意大利据点 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_foot')|0]  立场(1督府/2均势/3中立) [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_stance')|0]  半岛影响力 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_inf')|0]\n#T 结局与进度#!\n终局(1督府/2均势/3回撤) [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_out')|0]  主线完成 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_done')|0]\n#T 调度#!\n月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_m')|0]  结束代码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_end')|0]  已发数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_cnt')|0]\n（结束代码：0运行中、1主线完成、3超1570年、8暂无合格东罗马宿体）"
