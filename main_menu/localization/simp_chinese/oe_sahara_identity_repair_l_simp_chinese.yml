 OE_SAHARAN_MARCH: "撒哈拉边疆领"
 OE_SAHARAN_MARCH_ADJ: "撒哈拉"
 oe_found_saharan_march.title: "成立撒哈拉边疆领"
 oe_found_saharan_march.desc: "绿洲中的井泉与城垒维系着穿越沙海的商路。将帝国在撒哈拉绿洲和西撒哈拉地区直接拥有的全部地点交由边疆领守护，使驼队与戍卒共同维持罗马在沙漠中的秩序。新国家采用罗马文化、信奉东正教，以罗马边疆领的身份附属于东罗马。此决议只能执行一次。"
 oe_found_saharan_march.a: "让罗马的旌旗守望绿洲。"
 OE_SAHARAN_MARCH_TERRITORY_REQUIRED: "东罗马直接拥有撒哈拉绿洲或西撒哈拉地区至少一个可征服地点"
