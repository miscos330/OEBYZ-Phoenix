 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_tur_kapikulu: "扩编卡皮库鲁与耶尼切里军团"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_tur_kapikulu: "强化德夫希尔梅征募显著提升奥斯曼精锐步兵纪律与兵源，但军费维护加重并引发国内阶层摩擦。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_tur_porte_reform: "整饬高门军纪与中枢纲常"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_tur_porte_reform: "遏制耶尼切里干政显著稳固帝国安定、王权力量与财政效率，代价是短期内主力步兵纪律略微回落。"
 oe_wp35_civ.1.a: "扩编耶尼切里兵营并配发新式火绳枪操练"
 oe_wp35_civ.1.b: "兼顾卡皮库鲁精兵与地方西帕希采邑骑士"
 oe_wp35_civ.1.c: "拔擢身经百战的耶尼切里阿迦总领操典"
 oe_wp35_civ_tur_expand_kapikulu: "扩编卡皮库鲁与耶尼切里常备军"
 oe_wp35_civ_tur_expand_kapikulu.title: "扩编卡皮库鲁与耶尼切里常备军"
 oe_wp35_civ_tur_expand_kapikulu.desc: "扩大德夫希尔梅征募并增设耶尼切里兵营，锻造威震四方的近卫步兵精旅，在精锐纪律与军费、阶层平衡间作出取舍。"
 oe_wp35_civ_tur_expand_kapikulu.a: "召见耶尼切里军团阿迦商议扩军"
 oe_wp35_civ.1.title: "德夫希尔梅征募与耶尼切里兵营"
 oe_wp35_civ.1.desc: "托普卡帕御前庭院之中，身着盛装的耶尼切里旗手肃然列阵，各省法官呈上新一批德夫希尔梅征募清册。扩编由国库直饷的卡皮库鲁常备军必将铸就令敌胆寒的严明军纪与重步兵战力，然而老臣亦忧心忡忡地进谏：尾大不掉的近卫军营历来最易借赏赐干政。"
 oe_wp35_civ.2.a: "清查空饷名册，重申大维齐尔节制军政之权"
 oe_wp35_civ.2.b: "颁赐仪典赏银安抚兵营以维持主力军纪"
 oe_wp35_civ.2.c: "简拔铁腕革弊的科普鲁律式贤臣入值御前议政厅"
 oe_wp35_civ_tur_curb_janissaries: "整饬耶尼切里干政与兵营纲纪"
 oe_wp35_civ_tur_curb_janissaries.title: "整饬耶尼切里干政与兵营纲纪"
 oe_wp35_civ_tur_curb_janissaries.desc: "清核近卫军饷册、轮调耶尼切里宿将并重振大维齐尔文官统辖权，以短期兵锋微损换取帝国长治久安与各阶层拥护。"
 oe_wp35_civ_tur_curb_janissaries.a: "清核近卫饷册，重申高门文治威权"
 oe_wp35_civ.2.title: "高门肃纪：裁抑耶尼切里干政"
 oe_wp35_civ.2.desc: "户部审计官查出退役耶尼切里军官私吞空饷、插手京城商行税利之后，市井茶肆间顿时传出军营酝酿掀翻行军铜锅的流言。此刻正是高门展现决断的关头：如何在不自毁精锐根基的前提下，雷厉风行地整肃兵营、重建皇权与文治威信。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_per_qizilbash: "奇兹尔巴什部落骑兵大军"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_per_qizilbash: "狂热骁勇的红帽土库曼骑兵大幅提升轻骑战力、士气与征召规模，但部落埃米尔坐大稀释了王室地方控制力。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_per_ghulam: "阿拔斯沙阿古拉姆常备新军"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_per_ghulam: "直属王室的古拉姆火枪骑兵与炮兵纵队强化军纪、炮战与中央集权，代价是军费攀升且部落征召兵萎缩。"
 oe_wp35_civ.3.a: "赐予边疆牧场采邑，全面动员奇兹尔巴什骑兵"
 oe_wp35_civ.3.b: "借机收束部族兵权，编练直属王室的古拉姆火器营"
 oe_wp35_civ.3.c: "任命战功赫赫的奇兹尔巴什名将镇守边疆"
 oe_wp35_civ_per_mobilize_qizilbash: "动员奇兹尔巴什部落铁骑"
 oe_wp35_civ_per_mobilize_qizilbash.title: "动员奇兹尔巴什部落铁骑"
 oe_wp35_civ_per_mobilize_qizilbash.desc: "传檄征召自大不里士至呼罗珊的红帽部落骑兵，爆发凌厉的轻骑突击与高昂士气，代价是地方部落自治势力抬头。"
 oe_wp35_civ_per_mobilize_qizilbash.a: "于伊朗高原竖起红帽部落战旗"
 oe_wp35_civ.3.title: "红帽铁骑集结：奇兹尔巴什诸部"
 oe_wp35_civ.3.desc: "伊朗高原诸山口烟尘蔽日，沙姆鲁、乌斯塔吉鲁与阿夫沙尔诸部酋长高举锦旗率领精骑云集御营。他们如疾风骤雨般的骑射与冲锋足以击溃强敌大军，但每向部落埃米尔分封一处省督领地，王室直辖财赋与控制力便要随之削弱一分。"
 oe_wp35_civ.4.a: "常设古拉姆火枪与野战炮兵精锐兵团"
 oe_wp35_civ.4.b: "保留奇兹尔巴什轻骑先锋以安抚草原诸部"
 oe_wp35_civ.4.c: "延揽精通火炮攻防的古拉姆新军统帅入掌军务"
 oe_wp35_civ_per_ghulam_reform: "推行阿拔斯沙阿古拉姆新军改革"
 oe_wp35_civ_per_ghulam_reform.title: "推行阿拔斯沙阿古拉姆新军改革"
 oe_wp35_civ_per_ghulam_reform.desc: "收编行省入王室直辖领以供养效忠沙阿的古拉姆火枪兵与青铜野战炮队，打破部落豪强对波斯军权的垄断。"
 oe_wp35_civ_per_ghulam_reform.a: "敕建青铜炮厂与古拉姆常备兵营"
 oe_wp35_civ.4.title: "火炮与王权新军：古拉姆改制"
 oe_wp35_civ.4.desc: "王都新建铸炮工坊内炉火熊熊，大匠正检视刚出模的青铜野战长炮，校场上由王室生丝专卖供养的古拉姆近卫骑兵与火枪步兵齐步操演。守旧部落长老对兵权旁落颇多怨怼，但焕然一新的波斯常备军已足以同欧亚各大火药帝国分庭抗礼。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_rus_cossack_frontier: "敕许边疆哥萨克军团"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_rus_cossack_frontier: "自治的顿河、伏尔加与西伯利亚哥萨克军团大幅强化轻骑突袭、边疆拓殖与兵源，代价是免税特权与地方控制力稀释。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_rus_zemsky_sobor: "全俄缙绅会议与中央衙门集权"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_rus_zemsky_sobor: "缙绅会议协和各阶层并辅以严密中央衙门体系，显著提升王权、安定与内阁效能，但节制了无序边疆流民拓荒。"
 oe_wp35_civ.5.a: "确认边疆免税自治，大力扩充哥萨克骑兵与东进拓殖"
 oe_wp35_civ.5.b: "改派莫斯科中央衙门总督直辖边疆堡寨"
 oe_wp35_civ.5.c: "敕封威震草原的哥萨克阿塔曼统领边防骑军"
 oe_wp35_civ_rus_cossack_hosts: "敕许边疆哥萨克军团特许状"
 oe_wp35_civ_rus_cossack_hosts.title: "敕许边疆哥萨克军团特许状"
 oe_wp35_civ_rus_cossack_hosts.desc: "向顿河荒野与乌拉尔河畔的边疆木寨颁赐火药、粮秣与沙皇特许状，以边疆免税自治换取精锐哥萨克轻骑与迅猛东进拓殖。"
 oe_wp35_civ_rus_cossack_hosts.a: "向草原边塞颁赐沙皇敕书与火药军资"
 oe_wp35_civ.5.title: "荒原烽燧：哥萨克边疆军团"
 oe_wp35_civ.5.desc: "自顿河险峻的江心木寨至越过乌拉尔山的桦木边堡，剽悍的哥萨克阿塔曼献上缴获的草原战旗，同时请求沙皇赐予粮饷、火药与免除税吏盘剥的自治特权。扶植这批无畏骑手必将极大加快东方拓殖并壮大轻骑兵威，但莫斯科税吏在广袤边疆恐难收得一文钱粮。"
 oe_wp35_civ.6.a: "确立全俄缙绅会议与中央衙门法典，稳固集权与安定"
 oe_wp35_civ.6.b: "疏导躁动武人奔赴边疆哥萨克军区开疆立功"
 oe_wp35_civ.6.c: "起用老成谋国的名臣总领莫斯科中央衙门改制"
 oe_wp35_civ_rus_zemsky_sobor: "召开全俄缙绅会议与权衡特辖制"
 oe_wp35_civ_rus_zemsky_sobor.title: "召开全俄缙绅会议与权衡特辖制"
 oe_wp35_civ_rus_zemsky_sobor.desc: "召集波雅尔贵族、服役地主、教士与市民代表齐聚莫斯科，以制度化的中央衙门与缙绅会议取代暴烈特辖动荡，稳固皇权与内政效率。"
 oe_wp35_civ_rus_zemsky_sobor.a: "于克里姆林宫召开全俄各阶层缙绅会议"
 oe_wp35_civ.6.title: "全俄缙绅会议与特辖制之争"
 oe_wp35_civ.6.desc: "克里姆林宫多棱宫彩绘穹顶之下，来自全俄各郡的服役贵族、大主教与商界长老齐聚一堂，共议罗斯法典与中枢体制。强硬的皇室近臣力主效法特辖军铁腕清洗割据波雅尔豪门，而稳健派重臣则主张借全俄缙绅会议与中央衙门将各阶层牢牢凝聚于沙皇法度之下。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_ind_mansabdar: "曼萨布达尔与纳亚克军政品级制"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_ind_mansabdar: "将田赋包税与兵员定额严密挂钩，大幅提升兵源、税效与重骑战力，但提高了军饷维护并引发旧贵族抵触。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_ind_sulh_i_kul: "苏勒赫库勒宽容诏与德干神庙庇护"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_ind_sulh_i_kul: "推行万教和合与慷慨修缮南北名刹神庙显著稳固政权正统与臣民和谐，代价是传教速度放缓与宗教狂热兵源略减。"
 oe_wp35_civ.7.a: "严核品级骑额与田亩清册，强化军政税收与重骑兵威"
 oe_wp35_civ.7.b: "辅以惠及各教群体的寺庙田产免税以缓和地方怨气"
 oe_wp35_civ.7.c: "拔擢清廉精干的度支军务大将总领清丈与点兵"
 oe_wp35_civ_ind_mansabdar: "厘定曼萨布达尔军政品级与税赋册"
 oe_wp35_civ_ind_mansabdar.title: "厘定曼萨布达尔军政品级与税赋册"
 oe_wp35_civ_ind_mansabdar.desc: "建立严密稽核的文武品级与轮换采邑兵赋制度，将次大陆地方豪强熔铸为高效输财供兵的重骑军政骨干。"
 oe_wp35_civ_ind_mansabdar.a: "颁行帝国军政品级敕令与点验兵册"
 oe_wp35_civ.7.title: "品秩与骑额：曼萨布达尔体制革新"
 oe_wp35_civ.7.desc: "红砂岩校场之上，司马吏为战马烙上帝国印记，度支大臣逐一核验各郡乡田赋清册与每位将领承诺供养的骑兵定额。严格推行曼萨布达尔与纳亚克品级考核必令国库岁入与重装骑军双双大增，而世袭豪强则对频繁清查采邑暗怀不满。"
 oe_wp35_civ.8.a: "颁诏确立万教和合国策，护持次大陆诸教圣地"
 oe_wp35_civ.8.b: "转而侧重扩充曼萨布达尔精骑以备南征北战"
 oe_wp35_civ.8.c: "延揽博通诸教经典的哲人名臣入值中枢"
 oe_wp35_civ_ind_sulh_i_kul: "颁布苏勒赫库勒宽容诏与名刹庇护"
 oe_wp35_civ_ind_sulh_i_kul.title: "颁布苏勒赫库勒宽容诏与名刹庇护"
 oe_wp35_civ_ind_sulh_i_kul.desc: "延请各派宗教学者于宫廷讲学论道，并慷慨修缮印度斯坦与德干名刹神庙，以传教放缓换取深厚政权正统与万民和合。"
 oe_wp35_civ_ind_sulh_i_kul.a: "开启诸教论道殿并颁赐名刹香火田"
 oe_wp35_civ.8.title: "万教和合：苏勒赫库勒与德干名刹庇护"
 oe_wp35_civ.8.desc: "油灯辉映的精雕砂岩拱廊之下，苏菲隐士、婆罗门大学者、耆那苦行僧与波斯史官应诏齐聚，共论律法、星历与仁政之道。明诏推行“万教和合”并平等护持南北印度教神庙与清真圣地，必能赢得次大陆多元臣民发自肺腑的拥戴，唯独激进传教士对改宗放缓颇感怅然。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_tur_koprulu_nizam: "科普吕吕整肃与新军近代化"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_tur_koprulu_nizam: "铁腕大维齐尔清查与欧式操练的新军纵队显著提升奥斯曼军纪、炮战与中枢控制力，代价是军费维护攀升并触动保守贵族利益。"
 oe_wp35_civ_tur_koprulu_nizam: "科普吕吕整肃与新军近代化"
 oe_wp35_civ_tur_koprulu_nizam.title: "科普吕吕整肃与新军近代化"
 oe_wp35_civ_tur_koprulu_nizam.desc: "推进奥斯曼帝国体制革新的第三阶段巅峰抉择：于君士坦丁堡推行科普吕吕式铁腕整肃并编练近代化新军炮步劲旅。"
 oe_wp35_civ_tur_koprulu_nizam.a: "颁诏推行科普吕吕整肃与新军近代化"
 oe_wp35_civ.9.title: "高门抉择：科普吕吕整肃与新军近代化"
 oe_wp35_civ.9.desc: "俯瞰金角湾的御前议政厅内，厚重的帝国清丈税册与新铸青铜野战炮图样、近代步炮操典并列案头。历经卡皮库鲁扩军与禁卫肃纪两重淬炼之后，苏丹终于迎来决定国运的巅峰抉择：是将全权托付给铁腕名相科普吕吕·穆罕默德帕夏以开启中兴新军纪元、雷霆推行强硬军改，抑或审慎折衷以维系高门均衡。"
 oe_wp35_civ.9.a: "起用科普吕吕·穆罕默德帕夏整肃高门并编练近代新军"
 oe_wp35_civ.9.b: "不顾旧兵营反弹，强行推行铁腕炮兵与军籍清洗"
 oe_wp35_civ.9.c: "以温和调停兼顾高门文治与旧部安抚，稳步渐进"
 oe_wp35_civ.21.title: "博斯普鲁斯回响：奥斯曼近代化之果"
 oe_wp35_civ.21.desc: "托普卡帕大政诏令颁行八月之后，纪律严明的新军方阵已在君士坦丁堡巍峨城垣下列队演武，自多瑙河畔至阿勒颇的清查关厘亦源源涌入中枢国库。旧禁卫掮客与地方阿扬豪强虽暗自忌惮，却已难阻京师新政生根发芽——此刻正是将中兴成果永固为帝国法度的关键一跃。"
 oe_wp35_civ.21.a: "于君士坦丁堡敕建帝国工兵与炮兵学堂，永固新军基业"
 oe_wp35_civ.21.b: "将清查盈余悉数归入内帑国库并整饬全境度支"
 oe_wp35_civ.21.c: "向效忠新政的京师行会与各省法官颁赐恩诏以固民心"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_per_isfahan_silk: "伊斯法罕王室丝绸专卖与火器宫廷"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_per_isfahan_silk: "王室统筹的生丝商队与皇家攻城炮局令伊朗成为商贸、文教与火器强权，但压制了独立巴扎商行的议价空间并抬高军费。"
 oe_wp35_civ_per_isfahan_silk_monopoly: "伊斯法罕王室丝绸专卖与火器革新"
 oe_wp35_civ_per_isfahan_silk_monopoly.title: "伊斯法罕王室丝绸专卖与火器革新"
 oe_wp35_civ_per_isfahan_silk_monopoly.desc: "推进波斯军政改革的第三阶段巅峰抉择：于伊斯法罕确立王室生丝专卖体系，以滚滚商利供养辉煌宫廷与近代攻城重炮。"
 oe_wp35_civ_per_isfahan_silk_monopoly.a: "于伊斯法罕敕立王室丝绸专卖与火器局"
 oe_wp35_civ.10.title: "伊斯法罕半天下：王室丝绸专卖与火器宫廷"
 oe_wp35_civ.10.desc: "伊斯法罕宏伟王室广场四周的青蓝穹顶之下，新焦勒法亚美尼亚商团展开流光溢彩的里海生丝，一旁则是皇家工匠新铸的青铜攻城巨炮。历经奇兹尔巴什骑兵动员与古拉姆常备军改制之后，沙阿既可委任干练改革重臣阿拉维尔迪汗总揽丝绸专卖与火器革新、缔造黄金盛世，亦可强收王领或与巴扎商帮折衷分利。"
 oe_wp35_civ.10.a: "委任改革名臣阿拉维尔迪汗统筹王室丝绸专卖与皇家炮队"
 oe_wp35_civ.10.b: "强硬收编私商货栈，全力扩建王室攻城铸炮工场"
 oe_wp35_civ.10.c: "向新焦勒法与巴扎商帮颁授共享出口特许以缓和商界摩擦"
 oe_wp35_civ.22.title: "沙阿的商队：伊斯法罕黄金盛景"
 oe_wp35_civ.22.desc: "王室丝绸专卖施行八月之后，伊斯法罕大巴扎彩釉生辉，满载生丝的骆驼商队络绎奔赴霍尔木兹、阿勒颇与阿斯特拉罕。列强使节无不惊叹沙阿严整的火炮方阵与璀璨宫廷气派，而地方商老仍上书恳请酌减王室专卖配额。"
 oe_wp35_civ.22.a: "于伊斯法罕广建皇家丝织工坊与宏伟驿站商栈"
 oe_wp35_civ.22.b: "将丝绸白银盈余倾注于常设野战炮弹药武库"
 oe_wp35_civ.22.c: "酌减忠顺波斯与亚美尼亚商帮关厘以稳固国内商市"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_rus_table_of_ranks: "官秩表与西伯利亚拓殖宪章"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_rus_table_of_ranks: "十四品功绩官秩与官督西伯利亚拓殖宪章显著提升全俄内阁效率、皇权、科研与东进移民，但激起世袭波雅尔旧贵的强烈不满。"
 oe_wp35_civ_rus_table_of_ranks: "官秩表与西伯利亚拓殖宪章"
 oe_wp35_civ_rus_table_of_ranks.title: "官秩表与西伯利亚拓殖宪章"
 oe_wp35_civ_rus_table_of_ranks.desc: "推进俄罗斯帝国体制革新的第三阶段巅峰抉择：废除世袭门第座次、颁行功绩官秩表并敕立西伯利亚系统拓殖宪章。"
 oe_wp35_civ_rus_table_of_ranks.a: "颁行帝国官秩表与西伯利亚拓殖宪章"
 oe_wp35_civ.11.title: "以功代荫：官秩表与西伯利亚大拓殖"
 oe_wp35_civ.11.desc: "飞雪轻拂克里姆林宫红墙，枢密书吏在御案前铺开十四品文武官秩表与从鄂毕河延绵至东海的貂皮贡赋舆图。历经哥萨克边防军团与全俄缙绅会议两重历练后，沙皇面临决定帝国走向的终极抉择：是破格起用卓异法制名臣米哈伊尔·斯佩兰斯基彻底革除门第积弊、强力推行西伯利亚王室拓殖，抑或委任鲍里斯·戈东诺夫式老练重臣以调和波雅尔传统与中枢集权。"
 oe_wp35_civ.11.a: "起用改革名臣米哈伊尔·斯佩兰斯基总纂功绩官秩表与法典"
 oe_wp35_civ.11.b: "铁腕推行西伯利亚堡寨拓殖宪章与服役贵族强制点验"
 oe_wp35_civ.11.c: "委任鲍里斯·戈东诺夫式斡旋重臣调和波雅尔世族与新政"
 oe_wp35_civ.23.title: "自克里姆林至寒林：新服役帝国的回响"
 oe_wp35_civ.23.desc: "官秩表震撼莫斯科世袭豪门八月之后，寒门俊彦与青年军官已充实崭新的中央部院，冬日雪橇亦将满载西伯利亚珍贵貂皮的岁贡源源运抵国库。旧波雅尔世族虽仍闭门怨望，但全俄的行政触角已稳健贯通欧陆宫廷与万里东方大河。"
 oe_wp35_civ.23.a: "于莫斯科敕立帝国科学院与法政书院，永固近代文治"
 oe_wp35_civ.23.b: "扩建跨乌拉尔海关税站与西伯利亚毛皮专卖岁入"
 oe_wp35_civ.23.c: "向效忠官秩表的服役乡绅颁赐世业地契以安朝野"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_ind_peacock_treasury: "帝国迪万账房与孔雀宝座财政"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_ind_peacock_treasury: "标准化的十年田赋清丈法与帝国银币体系令次大陆岁入、生产与宫廷威仪冠绝天下，但削弱了柴明达尔豪强自主并带来轻微通胀。"
 oe_wp35_civ_ind_peacock_court: "帝国迪万账房与孔雀宝座财政革新"
 oe_wp35_civ_ind_peacock_court.title: "帝国迪万账房与孔雀宝座财政革新"
 oe_wp35_civ_ind_peacock_court.desc: "推进印度帝国体制革新的第三阶段巅峰抉择：推行十年均田清丈法与统一铸币厂，铸就富甲四海的帝国迪万账房与孔雀宝座财政。"
 oe_wp35_civ_ind_peacock_court.a: "整饬帝国迪万账房与孔雀宝座财政"
 oe_wp35_civ.12.title: "天竺度支大典：帝国迪万账房与孔雀宝座"
 oe_wp35_civ.12.desc: "镶嵌青金石与红玛瑙的大理石殿堂之内，度支清丈官展开涵盖古吉拉特、孟加拉与德干的十年农产清册，托盘中闪耀着成色划一的帝国标准银卢比。在曼萨布达尔品级制与万教和合国策的基础之上，君主既可拜授理财圣手拉贾·托达尔·马尔总领帝国迪万账房、亦可借孔雀宝座盛典扬威四海，或与世袭柴明达尔温和定税。"
 oe_wp35_civ.12.a: "拜授理财名臣拉贾·托达尔·马尔总领帝国迪万账房与清丈"
 oe_wp35_civ.12.b: "营建孔雀宝座盛廷并统一铸币以彰帝国赫赫天威"
 oe_wp35_civ.12.c: "与各地柴明达尔豪族商定宽松定额税约以固四境安宁"
 oe_wp35_civ.24.title: "大干道银流：帝国迪万账房丰收"
 oe_wp35_civ.24.desc: "帝国迪万账房统一度量衡与税册八月之后，自古吉拉特至孟加拉的棉丝织机日夜轰鸣，满载银币与织物的商队在皇家护卫下穿行大干道。四方商贾盛赞税率透明、市井繁盛，唯独世袭大地主仍对严密清丈暗感拘束。"
 oe_wp35_civ.24.a: "拨付国库白银扩建皇家织坊与大干道驿站商路"
 oe_wp35_civ.24.b: "铸造足色帝国标准银卢比以稳固全国金融与市场"
 oe_wp35_civ.24.c: "向奉公守法的地方迪万与名刹行会赐予税额宽减"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_fra_intendants: "王室监察官与平定投石党"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_fra_intendants: "直属国王的行省监察官全面强化法兰西王权、内阁效能与地方控制，但招致投石党显贵与高等法院的强烈不满与躁动。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_fra_versailles_colbert: "柯尔贝尔工场与凡尔赛宫廷"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_fra_versailles_colbert: "王室特许手工工场与璀璨凡尔赛宫廷显著推升法兰西生产、出口、文化影响与威望，代价是奢华宫廷开支与各阶层税负压力。"
 oe_wp35_civ_fra_intendants: "王室监察官与平定投石党"
 oe_wp35_civ_fra_intendants.title: "王室监察官与平定投石党"
 oe_wp35_civ_fra_intendants.desc: "向法兰西各财政总辖区派遣直属王室的监察官以清查税赋、压制割据高等法院并平定投石党贵族叛乱，以“国家理性”重塑中央权威。"
 oe_wp35_civ_fra_intendants.a: "敕派王室监察官巡辖全法各省"
 oe_wp35_civ.13.title: "国家理性：王室监察官与平定投石党"
 oe_wp35_civ.13.desc: "巴黎王宫烛火通明的密室之中，急报频传：各地高等法院公然抗拒王室敕令，骄横外省公爵更暗中串联纠集投石党私兵。派遣只听命于御前会议的王室监察官驻节全法，必能一举粉碎封建割据、确立铁腕中央集权，然而全法世袭显贵亦必为特权尽失而切齿震怒。"
 oe_wp35_civ.13.a: "委任黎塞留枢机总揽大权，广派王室监察官平定投石党"
 oe_wp35_civ.13.b: "改以兴办皇家工场与统一国内关税化解阶层对立"
 oe_wp35_civ.13.c: "与巴黎高等法院达成温和宪制妥协以保京师安宁"
 oe_wp35_civ_fra_versailles_mercantilism: "柯尔贝尔工场与凡尔赛宫廷"
 oe_wp35_civ_fra_versailles_mercantilism.title: "柯尔贝尔工场与凡尔赛宫廷"
 oe_wp35_civ_fra_versailles_mercantilism.desc: "兴建皇家织锦、镜片与海军补给工场，并将巴黎近郊王廷打造为冠绝全欧的文化灯塔，以繁复宫廷礼仪驯服大贵族。"
 oe_wp35_civ_fra_versailles_mercantilism.a: "敕建柯尔贝尔皇家工场与凡尔赛辉煌宫廷"
 oe_wp35_civ.14.title: "金丝机杼与万镜之殿：柯尔贝尔与凡尔赛"
 oe_wp35_civ.14.desc: "巴黎与法兰西岛各地，精巧丝织大匠、威尼斯制镜师与皇家造船工匠云集官营工场，宫廷建筑师则铺开足以令全欧君主叹为观止的凡尔赛大理石长廊蓝图。起用理财巨擘让-巴蒂斯特·柯尔贝尔统筹重商关税、皇家工场与宫廷气象，必将令法兰西傲视群雄，然高昂建造与宫廷礼仪开支亦令国人肩负沉重。"
 oe_wp35_civ.14.a: "拜授让-巴蒂斯特·柯尔贝尔总领皇家工场与凡尔赛重商大计"
 oe_wp35_civ.14.b: "优先强化行省监察官财税稽核，节制宫廷铺张"
 oe_wp35_civ.14.c: "向里昂与巴黎商帮颁授更宽松的自主出口特许权"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_spa_tercio_doctrine: "西班牙大方阵兵制革新"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_spa_tercio_doctrine: "长矛兵与火绳枪手严密协同的百战大方阵铸就全欧最令敌胆寒的重步兵与攻城劲旅，代价是高昂军饷维护与严苛募兵折损。"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_spa_casa_contratacion: "塞维利亚通商院与珍宝船队稽核"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_spa_casa_contratacion: "塞维利亚海图署、统一关税册与武装珍宝船队大幅提升远洋贸易、商业力量与王室税效，但美洲白银涌入推高通胀并惹怒非特许商帮。"
 oe_wp35_civ_spa_tercio_reforms: "西班牙大方阵兵制革新"
 oe_wp35_civ_spa_tercio_reforms.title: "西班牙大方阵兵制革新"
 oe_wp35_civ_spa_tercio_reforms.desc: "将卡斯蒂利亚与西班牙野战步兵整编为长矛与火绳枪严密协同的职业大方阵，铸就纵横欧陆战场的不败常备步兵劲旅。"
 oe_wp35_civ_spa_tercio_reforms.a: "颁行西班牙大方阵常备兵制敕令"
 oe_wp35_civ.15.title: "长矛如林，火铳如壁：西班牙大方阵"
 oe_wp35_civ.15.desc: "卡斯蒂利亚风尘扑面的大校场上，百战步兵队长正反复演练由十八尺白蜡木长矛方阵与炽烈火绳枪翼队紧密掩护的新式战法。将全军改制托付给“大队长”贡萨洛·费尔南德斯·德·科尔多瓦，必令西班牙大方阵威震佛兰德斯至亚平宁诸战场，但供养常年脱产的精锐职业兵团亦将对国库提出严峻考验。"
 oe_wp35_civ.15.a: "拜授名将贡萨洛·德·科尔多瓦统编西班牙职业大方阵"
 oe_wp35_civ.15.b: "转而优先强化塞维利亚通商院与远洋珍宝船队护航"
 oe_wp35_civ.15.c: "兼顾地方城镇民兵与精简皇家火炮教导营，减轻军费压力"
 oe_wp35_civ_spa_casa_contratacion: "塞维利亚通商院与珍宝船队稽核"
 oe_wp35_civ_spa_casa_contratacion.title: "塞维利亚通商院与珍宝船队稽核"
 oe_wp35_civ_spa_casa_contratacion.desc: "在塞维利亚通商院统筹大洋海图测绘、王室五一抽税稽核与武装大帆船珍宝船队，广聚跨洋财源并严防走私漏税与通胀失控。"
 oe_wp35_civ_spa_casa_contratacion.a: "于塞维利亚通商院稽核珍宝船队与跨洋商政"
 oe_wp35_civ.16.title: "瓜达尔基维尔河畔：塞维利亚通商院稽核"
 oe_wp35_civ.16.desc: "塞维利亚黄金塔畔车水马龙的码头上，王室验银官逐箱称量远渡重洋的银锭，首席航海测绘官则秘密修订武装印度船队航路海图。起用精明强干的奥利瓦雷斯伯爵公爵统筹通商院稽核与帝国军政分摊，必将收获浩瀚远洋税利，尽管白银狂潮亦会推高物价并令外埠商行深感束缚。"
 oe_wp35_civ.16.a: "委任奥利瓦雷斯伯爵公爵铁腕稽核塞维利亚通商院与珍宝船队"
 oe_wp35_civ.16.b: "将跨洋珍宝白银直接倾注于常备西班牙大方阵扩编"
 oe_wp35_civ.16.c: "向塞维利亚与加的斯商帮放宽大西洋航运特许以兴市面"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_rhomaioi: "希腊—安纳托利亚罗马融合"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_rhomaioi: "将君士坦丁堡希腊古典文脉与卡帕多西亚、本都及安纳托利亚边区传统熔为一炉，大幅加快同化、扩大文化容量与繁荣，但引致保守教士抵触。"
 oe_wp35_civ_syn_rhomaioi: "希腊—安纳托利亚罗马融合"
 oe_wp35_civ_syn_rhomaioi.title: "希腊—安纳托利亚罗马融合"
 oe_wp35_civ_syn_rhomaioi.desc: "以共同的罗马法度与君士坦丁堡学风为纽带，将爱琴海希腊人与安纳托利亚高原诸族熔铸为焕然一新的罗马公民共同体。"
 oe_wp35_civ_syn_rhomaioi.a: "颁布希腊—安纳托利亚罗马融合宪章"
 oe_wp35_civ.17.title: "海峡两岸共此城邦：希腊—安纳托利亚罗马融合"
 oe_wp35_civ.17.desc: "从君士坦丁堡的大理石讲堂至尼西亚、士麦那与特拉布宗的繁华市集，通晓双语的军区法官、边防武士与巧匠正将希腊古典人文与坚韧的安纳托利亚高原风俗融汇一体。由皇廷正式颁诏确立“希腊—安纳托利亚罗马融合”法统，必将令爱琴海两岸凝聚为生生不息的帝国核心，尽管京师守旧清流仍对古今礼俗之变心存疑虑。"
 oe_wp35_civ.17.a: "颁诏确立希腊—安纳托利亚罗马公民大融合，焕发海峡繁荣"
 oe_wp35_civ.17.b: "设立双语军区法庭与帝国文官学馆，稳固正统与治道"
 oe_wp35_civ.17.c: "拔擢博通两地文脉的安纳托利亚—希腊大书记官入阁辅政"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_rumelia: "鲁米利亚多元行政融合"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_rumelia: "将奥斯曼中枢治术与巴尔干鲁米利亚行会、多语行政及米勒特自治相融，显著提升宽容、文化容量与地方控制，代价是改宗放缓与保守教士不满。"
 oe_wp35_civ_syn_rumelia: "鲁米利亚多元行政融合"
 oe_wp35_civ_syn_rumelia.title: "鲁米利亚多元行政融合"
 oe_wp35_civ_syn_rumelia.desc: "以埃迪尔内至多瑙河为核心确立鲁米利亚多元行政融合体制，在公正帝国法度下凝聚突厥、希腊、斯拉夫与阿尔巴尼亚诸城行会。"
 oe_wp35_civ_syn_rumelia.a: "颁行鲁米利亚多元行政融合法典"
 oe_wp35_civ.18.title: "巴尔干通衢：鲁米利亚多元共治"
 oe_wp35_civ.18.desc: "在埃迪尔内穹顶林立的拱廊商市，以及连通君士坦丁堡、贝尔格莱德与塞萨洛尼基的帝国大道沿线，突厥蒂玛尔骑士、希腊海商、斯拉夫银矿匠与犹太染织坊同城共业、互通有无。由高门正式将这套鲁米利亚多元行政制度化，必将令巴尔干各省政通人和、控制稳固，唯独严厉的保守法学家对改宗步调放缓颇有微词。"
 oe_wp35_civ.18.a: "颁行鲁米利亚米勒特宪章与多语行省法庭，稳固巴尔干控制"
 oe_wp35_civ.18.b: "扶植巴尔干跨族群工匠行会与埃迪尔内商队货栈"
 oe_wp35_civ.18.c: "任命通晓多语的资深鲁米利亚总督统筹巴尔干融合政务"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_hindustani: "印波印度斯坦宫廷融合"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_hindustani: "波斯宫廷典雅文风与梵文格致、拉杰普特尚武传统及印度斯坦方言艺术水乳交融，显著加速科研、扩大文化影响与宽容，但放缓了单一正统改宗。"
 oe_wp35_civ_syn_hindustani: "印波印度斯坦宫廷融合"
 oe_wp35_civ_syn_hindustani.title: "印波印度斯坦宫廷融合"
 oe_wp35_civ_syn_hindustani.desc: "于德里与阿格拉赞助灿烂的印波印度斯坦宫廷文化融合，将波斯史学、印度天算与印度斯坦诗词乐舞共冶一炉。"
 oe_wp35_civ_syn_hindustani.a: "诏兴印波印度斯坦宫廷文化融合"
 oe_wp35_civ.19.title: "恒河与亚穆纳交汇：印波印度斯坦宫廷融合"
 oe_wp35_civ.19.desc: "德里与阿格拉皇家译书局内，波斯书法名家正为梵文史诗绘制金碧细密画，拉杰普特天算学者、古典乐师与印度斯坦诗人在同一座大殿中以融汇波斯与本土词韵的雅言唱和。由帝国正式庇护这场印波文化大融合，必将激发天算科技、建筑艺术与万民归心的璀璨盛景，纵然保守教士对宫廷兼收并蓄略有非议。"
 oe_wp35_civ.19.a: "敕建帝国印度斯坦文教与天算研究院，引领次大陆文明之巅"
 oe_wp35_civ.19.b: "主持波斯文与梵文经典互译以增帝国正统与治政智慧"
 oe_wp35_civ.19.c: "延揽负有盛名的印度斯坦诗坛名臣入值御前参政"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_creole_atlantic: "跨大西洋克里奥尔帝国宪章"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_creole_atlantic: "向海外克里奥尔精英授予平等帝国法权与港口商事自治，显著推动跨洋移民、海贸效率与附庸忠诚，代价是母国王权与直辖控制略有分散。"
 oe_wp35_civ_syn_creole_atlantic: "跨大西洋克里奥尔帝国宪章"
 oe_wp35_civ_syn_creole_atlantic.title: "跨大西洋克里奥尔帝国宪章"
 oe_wp35_civ_syn_creole_atlantic.desc: "向大西洋彼岸的克里奥尔臣民颁授共同帝国法权与港口商事宪章，将万里远洋据点凝结为休戚与共的跨海联邦。"
 oe_wp35_civ_syn_creole_atlantic.a: "颁行跨大西洋克里奥尔帝国宪章"
 oe_wp35_civ.20.title: "双半球共戴一冠：跨大西洋克里奥尔宪章"
 oe_wp35_civ.20.desc: "在大西洋彼岸座座繁忙港市之中，世代扎根海外的商贾、航海家、垦殖领主与混血法学家已孕育出既承袭母国语脉又融汇新世界气象的克里奥尔社会。颁行《跨大西洋克里奥尔帝国宪章》、承认海外市政议会与平等商权，必将大幅提振跨洋移民、海贸活力与海外藩属忠诚，代价则是母国中枢对远洋的直接控制略有放松。"
 oe_wp35_civ.20.a: "于东西两半球同步颁行跨大西洋克里奥尔帝国宪章"
 oe_wp35_civ.20.b: "特许设立跨洋商事公会与港口法庭以广开海贸财源"
 oe_wp35_civ.20.c: "特召干练海外克里奥尔总督代表入值母国御前枢密院"
