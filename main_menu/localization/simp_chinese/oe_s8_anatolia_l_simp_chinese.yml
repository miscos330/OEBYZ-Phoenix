 STATIC_MODIFIER_NAME_oe_s8_theologo_consul: "阿亚苏鲁克的威尼斯领事"
 STATIC_MODIFIER_DESC_oe_s8_theologo_consul: "1337年春，艾登家族在阿亚苏鲁克的领主与威尼斯的克里特公爵订约：威尼斯人可以在这里通商、派驻领事，双方约定不再劫掠对方的海岸。拉丁人把这座港口叫作西奥洛戈。"
 STATIC_MODIFIER_NAME_oe_s8_malatya_frontier: "马穆鲁克的北方门户"
 STATIC_MODIFIER_DESC_oe_s8_malatya_frontier: "1315年马穆鲁克军攻入马拉蒂亚，此后这座城一度归埃雷特纳管辖。1338年起，开罗的苏丹重新在这里派驻守将，把它当作叙利亚以北的边境重镇。"
 STATIC_MODIFIER_NAME_oe_s8_darende_seized: "杜尔卡迪尔人新占之地"
 STATIC_MODIFIER_DESC_oe_s8_darende_seized: "1338至1339年间，杜尔卡迪尔的卡拉贾向北扩张，从埃雷特纳手里夺取了达伦代。城里的人还没有认下新主人。"
 STATIC_MODIFIER_NAME_oe_s8_own_name: "以自己的名义铸币"
 STATIC_MODIFIER_DESC_oe_s8_own_name: "埃雷特纳本是伊儿汗国留在安纳托利亚的将领，先后奉札剌亦儿的大哈桑和开罗的马穆鲁克苏丹为主。1340年，埃雷特纳停止以马穆鲁克苏丹之名诵呼图白；1341年起以自己的名义铸币，钱币上用了苏丹的称号。"
 oe_s8_bw_theologo: "在阿亚苏鲁克与我们订约通商"
 oe_s8_bw_darende: "夺走了达伦代"
 oe_s8_bw_khutba: "不再以我们苏丹的名义诵呼图白"
 oe_s8_b_khutba_kept: "仍以我们苏丹的名义诵呼图白"
 oe_s8.4.t: "苏丹之号"
 oe_s8.4.desc: "#F 埃雷特纳本是伊儿汗国留在安纳托利亚的将领。汗国瓦解后，埃雷特纳先奉札剌亦儿的大哈桑为主，又遣使开罗，被马穆鲁克苏丹承认为鲁姆的总督。1340年，埃雷特纳停止以马穆鲁克苏丹之名诵呼图白；1341年起以自己的名义铸币，钱币上第一次出现了苏丹的称号。#!\n\n如今，我们已经不向任何人称臣。朝臣请君主决断：是以自己的名义铸币、诵呼图白，还是继续在呼图白里提开罗苏丹的名字，给自己留一条退路。"
 oe_s8.4.a: "以自己的名义铸币、诵呼图白"
 oe_s8.4.a.tt: "国家等级升为王国：国号改称苏丹国，君主改称苏丹。\n获得[ShowModifier('oe_s8_own_name')]，持续#Y 10#!年。\n埃及（不是玩家时）对我们好感#R −15#!，持续#Y 10#!年。"
 oe_s8.4.b: "仍在呼图白里提开罗的苏丹"
 oe_s8.4.b.tt: "埃及（不是玩家时）对我们好感#G +10#!，持续#Y 5#!年。\n国家等级不变。"
 oe_s8.90.t: "安纳托利亚地区事件：执行"
