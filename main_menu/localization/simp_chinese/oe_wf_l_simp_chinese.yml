l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_wf_era_wenzhi_mod:0 "文治纪元（景明·弘治风范）"
 STATIC_MODIFIER_DESC_oe_wf_era_wenzhi_mod:0 "朝廷以文德治天下，崇尚内阁票拟、经筵讲学与六部考课，显著提升内阁效率、学术研究与稳定度投入，但武备军费维持成本随之上升。"
 STATIC_MODIFIER_NAME_oe_wf_era_wugong_mod:0 "武功纪元（永乐·洪武风范）"
 STATIC_MODIFIER_DESC_oe_wf_era_wugong_mod:0 "天子以赫赫武功昭示四方，整饬卫所边镇、激励将士用命，提振陆军士气、人力储备与威望，但军兴靡费加重朝廷开销与乡农负担。"
 STATIC_MODIFIER_NAME_oe_wf_era_shoucheng_mod:0 "守成纪元（仁宣·休养风范）"
 STATIC_MODIFIER_DESC_oe_wf_era_shoucheng_mod:0 "朝廷与民休息、务实理财、整饬州县控制，增进赋税效率、地方控制与稳定度维系，但尚武锐气与兵员动员随之趋缓。"
 STATIC_MODIFIER_NAME_oe_wf_era_zhongxing_mod:0 "中兴改元（万历初政·隆庆开新）"
 STATIC_MODIFIER_DESC_oe_wf_era_zhongxing_mod:0 "于承平渐衰或危局低谷之际改元振作，集中内阁之力挽回稳定、地方控制与天命威权，却不可避免地招致勋贵与富商阶层抵触。"
 STATIC_MODIFIER_NAME_oe_wf_era_haiyu_mod:0 "海宇通商（隆庆开关·万方来朝）"
 STATIC_MODIFIER_DESC_oe_wf_era_haiyu_mod:0 "开市舶、通海宇、怀远人，使海贸效率、外交声望与商贾实力大增，但也引来守旧乡绅与勋贵对重商逾制之非议。"
 STATIC_MODIFIER_NAME_oe_wf_era_jubilee_mod:0 "纪元十载·海宇升平"
 STATIC_MODIFIER_DESC_oe_wf_era_jubilee_mod:0 "同一吉号历十载升平，朝野同庆、编纂实录，彰显正统、威望与中华文教光华，惟大典赏赐令宫廷支出颇巨。"
 STATIC_MODIFIER_NAME_oe_wf_era_steadfast_mod:0 "固守旧元·不改常制"
 STATIC_MODIFIER_DESC_oe_wf_era_steadfast_mod:0 "面对灾异危局仍坚持祖宗旧元不改，彰显天子镇定自若之气度，巩固正统与军心，但民间祈求改元易象之怨气较难平息。"
 STATIC_MODIFIER_NAME_oe_wf_era_tributary_calendar_mod:0 "奉行天朝正朔"
 STATIC_MODIFIER_DESC_oe_wf_era_tributary_calendar_mod:0 "奉天子新颁年号与大统历为正朔，既显尊王礼法、增进外交声望与本朝正统，亦需岁时遣使修贡以维礼仪。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_stage_1_mod:0 "天命周期·兴盛初元"
 STATIC_MODIFIER_DESC_oe_wf_cycle_stage_1_mod:0 "王朝肇兴未久，法度森严而朝气勃发，正统、军心与地方控制俱盛，惟酬功封赏与建制开支使宫廷用度渐增。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_stage_2_mod:0 "天命周期·守成承平"
 STATIC_MODIFIER_DESC_oe_wf_cycle_stage_2_mod:0 "承平日久，赋役册籍完备、文教昌明、社稷安泰，然官僚因循与武备弛懈之象亦悄然滋生。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_stage_3_mod:0 "天命周期·晚季积弊"
 STATIC_MODIFIER_DESC_oe_wf_cycle_stage_3_mod:0 "历世积弊深重，勋戚兼并、党争误国、边饷虚耗，赋税、控制力与内阁效能齐落，唯有推行大刀阔斧之中兴变法方能挽狂澜于既倒。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_audit_mod:0 "都察院稽考朝纲"
 STATIC_MODIFIER_DESC_oe_wf_cycle_audit_mod:0 "严申常朝点卯与都察院考成之法，革除章奏留中积习，振作内阁与地方控制，却令惯于怠政之勋贵权臣大为不满。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_cadastre_mod:0 "清丈田亩·抑兼并"
 STATIC_MODIFIER_DESC_oe_wf_cycle_cadastre_mod:0 "敕令清丈天下田亩、查核诡寄隐田，使国库田赋复归充实、自耕农负担减轻，但触怒豪宗勋戚阶层。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_frontier_pay_mod:0 "内帑拨银·实边固防"
 STATIC_MODIFIER_DESC_oe_wf_cycle_frontier_pay_mod:0 "天子亲发内帑银两清偿九边欠饷，并严核军需冒领，军心与兵源为之一振，宫廷财政则相应承压。"
 STATIC_MODIFIER_NAME_oe_wf_cycle_zhongxing_mod:0 "中兴大治·考成重光"
 STATIC_MODIFIER_DESC_oe_wf_cycle_zhongxing_mod:0 "考成法与一条鞭并举，涤荡晚季沉疴，国库、内阁与天命气象焕然一新，虽令旧贵怨望、新政成本颇高，仍足启数十年中兴之局。"
 STATIC_MODIFIER_NAME_oe_wf_huangen_investiture_mod:0 "天朝敕封·金印正名"
 STATIC_MODIFIER_DESC_oe_wf_huangen_investiture_mod:0 "奉天朝敕书金印正位承统，令国内觊觎者息心、邻邦敬畏，正统与外交声望俱升，唯岁贡礼仪开支亦随之增加。"
 STATIC_MODIFIER_NAME_oe_wf_huangen_relief_mod:0 "天朝赈济与协防军资"
 STATIC_MODIFIER_DESC_oe_wf_huangen_relief_mod:0 "天朝急拨赈银、军械与协防教官驰援，令将士士气与兵源及时回稳，但须承担转运供给与驿站差役，略损本地税收效率。"
 STATIC_MODIFIER_NAME_oe_wf_huangen_kanhe_mod:0 "勘合贸易加额特许"
 STATIC_MODIFIER_DESC_oe_wf_huangen_kanhe_mod:0 "获赐额外勘合符契，准许商船马帮扩额往来天朝港市与互市，海陆商贸大兴，但引来保守世族对商贾坐大之警惕。"
 STATIC_MODIFIER_NAME_oe_wf_huangen_sinicize_mod:0 "请学汉化·国子监特许"
 STATIC_MODIFIER_DESC_oe_wf_huangen_sinicize_mod:0 "遣子弟入国子监游学并译行天朝典章律令，显著提振科研、识字率与思潮传播，同时推动社会向汉化演进，引发本土传统贵族不满并削弱固有文化保守度。"
 STATIC_MODIFIER_NAME_oe_wf_huangen_classics_mod:0 "颁赐经籍与官刻典籍"
 STATIC_MODIFIER_DESC_oe_wf_huangen_classics_mod:0 "获赐天朝官刻经史、农政与历算典籍，在保有本国旧俗的前提下稳步提升科研与文教识字，仅需朝廷拨款维持书院刻印。"
 STATIC_MODIFIER_NAME_oe_wf_emperor_grace_mod:0 "厚往薄来·怀柔万方"
 STATIC_MODIFIER_DESC_oe_wf_emperor_grace_mod:0 "秉持厚往薄来之古训，大赐金印锦缎以安四夷之心，外交声望、属国忠诚与天命俱增，但内库赏赐耗费不菲。"
 STATIC_MODIFIER_NAME_oe_wf_emperor_kanhe_mod:0 "广颁勘合·优免蕃税"
 STATIC_MODIFIER_DESC_oe_wf_emperor_kanhe_mod:0 "向恭顺藩属宽免市舶抽分并增发勘合，密切海贸纽带与属国归心，但关津直接税收略有让利。"
 STATIC_MODIFIER_NAME_oe_wf_exam_balanced_mod:0 "南北榜衡平取士"
 STATIC_MODIFIER_DESC_oe_wf_exam_balanced_mod:0 "殿试兼顾南北地域分卷取士，既安天下士心、广开寒门文脉，又充实内阁干才，唯扩员录用略增朝廷俸禄支出。"
 STATIC_MODIFIER_NAME_oe_wf_exam_noble_mod:0 "恩荫世家·勋贵优容"
 STATIC_MODIFIER_DESC_oe_wf_exam_noble_mod:0 "扩充恩荫与世家保举名额，有效笼络勋贵大族并稳固朝堂礼秩，却使寒门实学受阻，略损科研与内阁效率。"
 STATIC_MODIFIER_NAME_oe_wf_exam_practical_mod:0 "实学策问·科场肃弊"
 STATIC_MODIFIER_DESC_oe_wf_exam_practical_mod:0 "改以河工、钱粮、边防实学策问取士并严查科场关节，令科研、内阁与地方治理俱进，但大触保守勋贵与教士阶层既得利益。"
 STATIC_MODIFIER_NAME_oe_wf_penitence_mod:0 "罪己诏·省躬恤民"
 STATIC_MODIFIER_DESC_oe_wf_penitence_mod:0 "天子下诏引咎自责并敕免苛敛，迅速安抚民怨、加速稳定回升，但皇室威望受损且短期赋税征收相应收缩。"
 STATIC_MODIFIER_NAME_oe_wf_gov_diligent_mod:0 "躬亲勤政·乾纲独断"
 STATIC_MODIFIER_DESC_oe_wf_gov_diligent_mod:0 "天子日理万机、亲批章奏，使内阁效率、皇权与地方控制大为增强，然宫廷中枢运转开销激增且令朝臣勋贵倍感掣肘。"
 STATIC_MODIFIER_NAME_oe_wf_gov_hands_off_mod:0 "垂拱委政·内阁票拟"
 STATIC_MODIFIER_DESC_oe_wf_gov_hands_off_mod:0 "天子垂拱而治、委任内阁与六部循例票拟，既省宫廷靡费、安抚士绅商贾并降低维稳成本，但也使皇权与地方直控有所松弛。"
 oe_wf_cab_changwei_inspect:0 "厂卫巡缉·肃贪控度"
 oe_wf_cab_changwei_inspect_desc:0 "派遣东厂与锦衣卫缇骑巡缉指定行省，清查贪墨隐赋、强化地方与全国控制度，但会引起勋贵与商贾阶层不满并微损皇室威望。"
 oe_wf_cab_changwei_inspect_action:0 "执行：厂卫巡缉·肃贪控度"
 oe_wf_cab_changwei_inspect_active:0 "正在执行：厂卫巡缉·肃贪控度"
 oe_wf_cab_changwei_inspect_action_progress:0 "厂卫巡缉进度"
 oe_wf_cab_changwei_inspect_action_progress_wordier:0 "厂卫巡缉正在推进"
 oe_wf_cab_changwei_inspect_action_progress_long_wordier:0 "厂卫缇骑正在稽查地方官吏与钱粮册籍，行省控制度持续攀升，士绅商贾则心存戒惧。"
 oe_wf_cab_changwei_inspect_action_progress_tooltip:0 "厂卫巡缉·肃贪控度的当前推进度"
 oe_wf_cab_changwei_inspect_select_province:0 "选择厂卫巡缉的行省"
 oe_wf_cab_changwei_inspect_no_provinces:0 "@trigger_no! 当前没有可供厂卫巡缉的受控行省"
 oe_wf_cab_diligent_governance:0 "勤政理政·内阁票拟"
 oe_wf_cab_diligent_governance_desc:0 "命大学士直庐值宿、协理晨朝票拟并督催六部庶政，提升内阁效率、稳定度投入与赋税征收，但宫廷运转开销与精力耗损随之加重。"
 oe_wf_cab_diligent_governance_action:0 "执行：勤政理政·内阁票拟"
 oe_wf_cab_diligent_governance_active:0 "正在执行：勤政理政·内阁票拟"
 oe_wf_cab_diligent_governance_action_progress:0 "勤政理政进度"
 oe_wf_cab_diligent_governance_action_progress_wordier:0 "勤政理政·内阁票拟正在推进"
 oe_wf_cab_diligent_governance_action_progress_long_wordier:0 "内阁正昼夜票拟章奏、稽核六部钱谷案牍，全国政务运转随之提速。"
 oe_wf_cab_diligent_governance_action_progress_tooltip:0 "勤政理政·内阁票拟的当前推进度"
 oe_wf_need_huangen_25_tt:0 "@trigger_no! 需要至少 #Y 25#! 点皇恩（可通过遣使朝贡与恪守藩礼积累）"
 oe_wf_need_huangen_30_tt:0 "@trigger_no! 需要至少 #Y 30#! 点皇恩方可奉表请学汉化特许"
 oe_wf_need_tributary_tt:0 "@trigger_no! 需要至少拥有一名恭顺属国或中华天朝朝贡成员"
 oe_wf_dec_proclaim_era_name.title:0 "建元改元·昭告正朔"
 oe_wf_dec_proclaim_era_name.desc:0 "召礼部与翰林院共议吉号，为今上颁定本朝年号气象（每代君主限颁一次，冷却 15 年），奉行我朝正朔之藩属亦可同沐轻度礼乐气象。本体系获《萬方景明》（Pax Solis）制作团队正式授权并基于 EU5 引擎原生重制。"
 oe_wf_dec_proclaim_era_name.a:0 "召礼部拟定吉号并颁告天下"
 oe_wf_dec_send_tribute_mission.title:0 "遣使朝贡·积攒皇恩"
 oe_wf_dec_send_tribute_mission.desc:0 "遣使团赍奉方物、良马或礼表入觐天朝京师以积攒 #Y 皇恩#!（5 年冷却），日后可凭皇恩请封正名、求请天朝赈济协防、申领勘合贸易加额或遣使请学汉化。"
 oe_wf_dec_send_tribute_mission.a:0 "遣使入朝进献方物"
 oe_wf_dec_petition_imperial_aid.title:0 "奉表陈情·请施皇恩"
 oe_wf_dec_petition_imperial_aid.desc:0 "动用已积累的 #Y 皇恩#!（至少 25 点）上表天朝，乞请敕封金印正名、紧急赈银与兵源协防，或增发勘合贸易符契（8 年冷却）。"
 oe_wf_dec_petition_imperial_aid.a:0 "呈递奏疏乞请天恩"
 oe_wf_dec_petition_sinicization_charter.title:0 "遣使请学·汉化特许"
 oe_wf_dec_petition_sinicization_charter.desc:0 "消耗 #Y 30#! 点皇恩上表请学，乞准遣王室子弟入国子监肄业并颁赐经史典章，以提振科研、识字率与思潮传播，同时承接相应的文化汉化演进权衡（15 年冷却）。"
 oe_wf_dec_petition_sinicization_charter.a:0 "上表乞准遣使入监请学"
 oe_wf_dec_bestow_royal_favor.title:0 "颁赐皇恩·怀柔万方"
 oe_wf_dec_bestow_royal_favor.desc:0 "秉持厚往薄来之天朝大度，拨银 #Y 75#! 颁赐金印、锦缎或勘合优免予恭顺藩属，增进诸藩皇恩、属国忠诚与天命威望（10 年冷却）。"
 oe_wf_dec_bestow_royal_favor.a:0 "遣钦差颁赐金印与赏赉"
 oe_wf_dec_special_grace_exam.title:0 "诏开恩科殿试"
 oe_wf_dec_special_grace_exam.desc:0 "拨银 #Y 60#! 特开恩科殿试（12 年冷却），于南北榜衡平取士、勋贵世家恩荫与实学策问肃弊三策间权衡阶层满意、识字文教与官僚效能。"
 oe_wf_dec_special_grace_exam.a:0 "诏开京师贡院举行恩科"
 oe_wf_dec_penitential_edict.title:0 "颁行罪己诏"
 oe_wf_dec_penitential_edict.desc:0 "当国步维艰、稳定低谷、厌战高企或天命示警之际，天子可下诏引咎自省，以威望与正统为代价急复稳定度并平息民怨（15 年冷却）。"
 oe_wf_dec_penitential_edict.a:0 "亲拟罪己诏颁示天下"
 oe_wf_dec_toggle_governance_style.title:0 "勤政与垂拱之辨"
 oe_wf_dec_toggle_governance_style.desc:0 "定夺未来十年中枢理政之道（10 年冷却）：或躬亲勤政集权以强内阁与控制度，或垂拱委政内阁以安抚阶层、节减宫廷耗费。"
 oe_wf_dec_toggle_governance_style.a:0 "裁定中枢勤政或垂拱之制"
 oe_wf.1.t:0 "建元改元·昭告正朔"
 oe_wf.1.d:0 "圜丘礼成，翰林学士与礼部堂官恭呈历代雅号五类：或效景明、弘治、宣德之文治清明；或扬永乐、洪武、天启之赫赫武功；或取仁宣、嘉靖之守成休养；若值守成晚季或国运低谷，更可颁万历初政、隆庆开新之中兴吉号；亦可仿海宇通商之志，开万方来朝新局。今上欲以何种气象定鼎本朝正朔？"
 oe_wf.1.a:0 "文治纪元（景明·弘治·宣德风范）：崇文重阁，整饬吏治"
 oe_wf.1.b:0 "武功纪元（永乐·洪武·天启风范）：扬威边塞，振作军备"
 oe_wf.1.c:0 "守成纪元（仁宣·休养风范）：与民休息，务实税控"
 oe_wf.1.e:0 "中兴改元（万历初政·隆庆开新）：革故鼎新，挽回天命"
 oe_wf.1.f:0 "海宇通商（隆庆开关·万方来朝）：开港市舶，怀柔四海"
 oe_wf.2.t:0 "纪元十载·海宇升平"
 oe_wf.2.d:0 "自今上颁行本朝年号以来，海内升平已逾十载，仓廪充盈而四夷循期修贡。翰林学士与礼部公卿合词上请，愿举行十载纪元大典、编纂实录并勒石记盛；亦有御史进言，不如借此吉辰减免州县田赋，与天下百姓同享升平。"
 oe_wf.2.a:0 "举行十载大典并敕修实录"
 oe_wf.2.b:0 "减免乡农岁赋以庆升平"
 oe_wf.3.t:0 "改元禳灾·以谢天谴"
 oe_wf.3.d:0 "连年动荡、兵连祸结或天命低迷之际，钦天监与都察院纷纷上疏，援引古制请天子“改元禳灾”，以新吉号重迎天眷、安定人心。然亦有老成宿儒力谏，谓一世一元乃祖宗常法，临危改元恐示怯于天下。"
 oe_wf.3.a:0 "顺应天象，改元禳灾并重择吉号"
 oe_wf.3.b:0 "固守旧元不改，以镇定示天下"
 oe_wf.10.t:0 "盛极转守·承平之世"
 oe_wf.10.d:0 "国朝受命已历一甲子，开国草创之锐气渐化为文教昌明、府库丰盈的承平气象。然边镇宿将亦密奏提醒：承平日久、恩荫日广，若不早作绸缪，官僚因循与军备弛懈恐将在数十年后酿成大患。"
 oe_wf.10.a:0 "编纂会典，以礼法维系承平"
 oe_wf.10.b:0 "拨银整饬边镇秋操，延缓晚季怠政"
 oe_wf.11.t:0 "晚季积弊·天命示警"
 oe_wf.11.d:0 "历世隐田逃赋、朝堂党争与边饷虚耗积重难返，国库入不敷出，州县控制日渐松弛。天命周期已步入晚季积弊之局：若不蓄积改革之势以图大变法，王朝恐将在内外交困中步履维艰。"
 oe_wf.11.a:0 "正视沉疴，蓄积中兴大改革之势"
 oe_wf.11.b:0 "加派临时辽饷杂税以解燃眉之急"
 oe_wf.12.t:0 "朝政倦怠·章奏留中"
 oe_wf.12.d:0 "各省督抚急奏积压宫中、久不批复，六部官僚互相推诿掣肘。都察院御史伏阙进谏，请天子整肃朝纲、严立程限以破怠政之风。"
 oe_wf.12.a:0 "严申常朝稽考，整顿吏治并蓄改革之势"
 oe_wf.12.b:0 "仍交内阁循例处置，免伤朝臣和气"
 oe_wf.13.t:0 "勋戚兼并·田赋失额"
 oe_wf.13.d:0 "皇庄勋戚与豪门大户借免税特权大肆兼并民田，诡寄花分、逃避正供，致使小民赋役日重、流民渐起。革新大臣力请清丈全国田亩、归并田赋。"
 oe_wf.13.a:0 "敕行清丈田亩，抑豪强而蓄变法之势"
 oe_wf.13.b:0 "姑息勋戚田产，暂安朝堂权贵"
 oe_wf.14.t:0 "边饷告急·九边催粮"
 oe_wf.14.d:0 "九边总兵连发急报，称军饷拖欠数月、槽米霉变，戍卒鼓噪之势已现。若朝廷不速发内帑清偿并严核军需，边防必将动摇。"
 oe_wf.14.a:0 "发内帑实边并严核军饷，兼蓄改革之势"
 oe_wf.14.b:0 "听任边将就地筹粮，暂省国库支出"
 oe_wf.15.t:0 "张居正式大改革契机·考成新政"
 oe_wf.15.d:0 "历经数番清丈与整饬，一位极具魄力的内阁首辅已具备推行全面中兴变法的天时与声望。若能毅然委以重任，统筹考成法、清丈田赋与边防整军，虽必遭守旧勋戚与清流激烈反弹，却足以一举扭转晚季积弊、实现王朝中兴复位！"
 oe_wf.15.a:0 "力排众议，全力推行考成新政以图“中兴复位”"
 oe_wf.15.b:0 "改行温和节流之策，仅缓一时积弊"
 oe_wf.16.t:0 "中兴复位·国祚重光"
 oe_wf.16.d:0 "考成新政雷厉风行，冗官尽裁、太仓充盈、九边兵精粮足。史官盛赞本朝达成真正之 #Y 中兴再造#!——晚季沉疴一扫而空，天命盛衰周期正式复位回稳至“守成承平”新阶段！"
 oe_wf.16.a:0 "载入国史实录，重振天命威仪"
 oe_wf.16.b:0 "颁恩四海藩属，彰显中兴盛象"
 oe_wf.20.t:0 "遣使朝贡·积攒皇恩"
 oe_wf.20.d:0 "我国使团已抵天朝京师，礼部官员正引领入朝觐见。无论是进献珍贵方物、选派助战良马兵员，抑或呈递尊王礼表，皆可为本国赢得宝贵的 #Y 皇恩#!，留作他日请封、求援或请学之资。"
 oe_wf.20.a:0 "进献丝帛珍玩与地方方物（+18 皇恩）"
 oe_wf.20.b:0 "选献战马并派兵员协防（+28 皇恩）"
 oe_wf.20.c:0 "循礼修表、呈献文籍致敬（+14 皇恩）"
 oe_wf.21.t:0 "奉表陈情·动用皇恩"
 oe_wf.21.d:0 "我国历年恪守藩礼，已在天朝积下深厚 #Y 皇恩#!。如今使者奉表陈情，可将皇恩化作实利：或请天朝颁赐金印敕封以固王统正名；或乞天朝急拨赈银与协防兵源共渡难关；或请加额颁赐勘合符契以兴海陆商贸。"
 oe_wf.21.a:0 "请敕封继位与金印正名（消耗 25 皇恩）"
 oe_wf.21.b:0 "请天朝赈济银两与协防兵源（消耗 35 皇恩）"
 oe_wf.21.c:0 "请勘合贸易加额特许（消耗 30 皇恩）"
 oe_wf.21.e:0 "暂缓上表，保留皇恩以备后用"
 oe_wf.22.t:0 "天朝敕封·金印正名"
 oe_wf.22.d:0 "天朝钦差赍奉朱批敕书与镀金王印抵至我国都城，宣诏册封今上正位承统。朝野内外与周边邻国皆敬惮天朝威望，本国正统与外交声望为之大振。"
 oe_wf.22.a:0 "设香案隆重受封，铭谢皇恩"
 oe_wf.23.t:0 "天朝赈济与协防抵达"
 oe_wf.23.d:0 "天朝念我国恪守藩礼，特遣钦差押运赈济银两、军械粮秣与随行教官星夜驰援，及时补足我国府库与兵源缺口。"
 oe_wf.23.a:0 "接领天朝赈银与协防军资"
 oe_wf.24.t:0 "勘合贸易加额诏准"
 oe_wf.24.d:0 "天朝礼部与市舶司已批复我国奏请，增发编号勘合符契，准许我国商舶与马帮扩额往来中华港市，商路财源滚滚而来。"
 oe_wf.24.a:0 "向商帮颁发新增勘合符契"
 oe_wf.25.t:0 "遣使请学·汉化特许"
 oe_wf.25.d:0 "天子嘉许我国慕化向学之诚，敕准遣使入国子监肄业并赐予官刻典章经籍。我国既可乘势推行深度的礼制与文教汉化以大兴科研识字，亦可仅择取农政历算典籍而保留本土旧俗。"
 oe_wf.25.a:0 "广设译馆、全盘研习天朝礼法典章（深度汉化）"
 oe_wf.25.b:0 "专取官刻经籍与历算农政，徐图渐进"
 oe_wf.26.t:0 "颁赐皇恩·厚往薄来"
 oe_wf.26.d:0 "诸藩使臣齐聚午门之外候旨。朝廷既可秉持厚往薄来之古训，大赐金印锦缎以深固藩属皇恩与向心力；亦可借广颁勘合、宽免市舶抽分以繁盛东亚朝贡海贸。"
 oe_wf.26.a:0 "厚赐金印锦缎，广施皇恩于诸藩"
 oe_wf.26.b:0 "增颁勘合符契并宽免蕃商抽分"
 oe_wf.27.t:0 "天朝赐印颁恩"
 oe_wf.27.d:0 "天朝特使持节莅临我国都城，宣读嘉奖敕书并厚赐金印锦缎，盛赞我国岁时恭顺、不失藩礼。我国于朝贡体系中的声望与 #Y 皇恩#! 储备随之再度充盈。"
 oe_wf.27.a:0 "奉安天朝赐印，彰显尊荣正统"
 oe_wf.27.b:0 "开启港埠商栈，与天朝使团共襄互市"
 oe_wf.30.t:0 "恩科殿试·取士三难"
 oe_wf.30.d:0 "天下举子云集京师赴考恩科，考官却呈上棘手三难：江南文风鼎盛，若不衡平南北榜恐失北方士心；勋贵世家则暗通关节、力求扩充恩荫优容名额；革新派考官更揭发科场弊案，力主改试河工钱粮实学策问并严惩舞弊豪门。天子将如何御批定夺？"
 oe_wf.30.a:0 "行南北榜衡平取士，兼安海内士心"
 oe_wf.30.b:0 "优容世家恩荫，以笼络勋贵大族"
 oe_wf.30.c:0 "改试实学策问，并严查科场弊案"
 oe_wf.31.t:0 "金榜题名·庶吉士分派"
 oe_wf.31.d:0 "南北榜衡平发榜后，四方士林交口称颂公正。吏部现请旨定夺：新科进士俊彦应当优先派往地方州县历练牧民，抑或选入翰林院充任庶吉士深造？"
 oe_wf.31.a:0 "派赴州县亲民历练，固本安民"
 oe_wf.31.b:0 "选拔俊彦入翰林院观政研学"
 oe_wf.32.t:0 "言官弹劾恩荫不公"
 oe_wf.32.d:0 "恩荫世家放榜未几，都察院多名言官便联名上疏弹劾，斥责徇私优容勋贵有违科举公器之本义，朝野清议一时沸然。"
 oe_wf.32.a:0 "降旨温言安抚言官，稍平清议"
 oe_wf.32.b:0 "力挺勋贵世家，驳回言官弹劾"
 oe_wf.33.t:0 "科场弊案大狱定谳"
 oe_wf.33.d:0 "三法司彻查科场舞弊案，已顺藤摸瓜查实数家权贵暗通考官泄题。若依法严办大狱，必能震慑豪强、大振革新声势；若改判罚银免罪，则可充盈国库并免致勋贵激烈反扑。"
 oe_wf.33.a:0 "依法严惩舞弊豪门，以正纲纪并蓄改革之势"
 oe_wf.33.b:0 "改判巨额罚银纳赎，暂缓阶层冲突"
 oe_wf.34.t:0 "罪己诏·省躬谢天"
 oe_wf.34.d:0 "值此国步维艰、灾异示警之际，天子亲诣太庙颁行罪己诏，当众省躬自责用人失察与征敛过重。若肯深切引咎并佐以蠲免赈济，虽大损皇室威望与正统，却能立时平息民怨、急复社稷稳定。"
 oe_wf.34.a:0 "痛切引咎自省，并颁大赦减赋安民"
 oe_wf.34.b:0 "循例告庙自省，裁冗节用徐图回稳"
 oe_wf.35.t:0 "勤政与垂拱之辨"
 oe_wf.35.d:0 "内阁大学士与近侍围绕中枢理政之道展开激辩：若天子躬亲勤政、日批万机，则皇权、内阁效率与地方控制俱盛，唯宫廷开销沉重且朝臣倍感掣肘；若垂拱而治、委政内阁票拟，则阶层安泰、用度节省且维稳轻松，然皇权直控亦将随之松弛。"
 oe_wf.35.a:0 "躬亲勤政：乾纲独断，亲理万机"
 oe_wf.35.b:0 "垂拱委政：委任内阁，与民休养"
