l_simp_chinese:
 oe_rw_divide_bulgaria_serbia: "离间保加利亚和塞尔维亚"
 oe_rw_divide_bulgaria_serbia_desc: "保加利亚与塞尔维亚的盟约使北方诸君主能够相互倚仗。让使臣带着金钱、承诺和精心挑选的消息北上，拆散这份威胁帝国的联合。\n\n仅在两国结盟且尚未执行时显示，仅持有罗马正统者可执行。花费100金币、1外交官、5正统性，解除两国盟约。只能执行一次，完成后不再显示。"
 oe_rw_found_moldavian_governorate: "摩尔达维亚总督府"
 oe_rw_found_moldavian_governorate_desc: "当帝国掌握瓦拉几亚，喀尔巴阡山以东的河谷便不再遥远。将零散的城堡、关隘与市镇纳入一道总督敕令，使多瑙河以北获得长久的秩序。\n\n瓦拉几亚地区所有可征服地点须由东罗马及其各级附属国拥有，仅持有罗马正统者可执行。花费200金币，设立一次性的摩尔达维亚总督府。整合所有首都位于摩尔达维亚且全国地点数不超过20的国家全部领土，以及东罗马及其附属国在摩尔达维亚的地点。总督府为东罗马的行省化附庸。"
 OE_DANUBE_MOLDAVIA_HAS_SOURCE: "摩尔达维亚地区至少有一个可用于设立总督府的地点。"
 OE_DANUBE_MOLDAVIA_FOUND_EFFECT: "花费200金币，将符合条件的摩尔达维亚小国全部领土及东罗马与附属国在该地区的地点合并为#Y 摩尔达维亚总督府#!，成为东罗马的#Y 行省化附庸#!。若金帐汗国在该地区仍拥有1至9个地点，触发“驱逐蒙古人”。"
 OE_MOLDAVIAN_GOVERNORATE: "摩尔达维亚总督府"
 OE_MOLDAVIAN_GOVERNORATE_ADJ: "摩尔达维亚"
 oe_danube_settlement.1.t: "驱逐蒙古人"
 oe_danube_settlement.1.d: "总督的印信已经送抵摩尔达维亚，但金帐汗国的征税者仍驻留在一些渡口与市镇。他们的旗帜提醒着当地居民：来自草原的命令尚未完全退去。\n\n总督请求派遣军队逐走这些驻留者，把汗廷控制的土地归入新设官署。军需与伤亡将由帝国承担；我们也可以就此止步，让总督府的建立本身成为足以告慰朝廷的一场胜利。"
 oe_danube_settlement.1.a: "让汗廷的旗帜退离河谷。"
 oe_danube_settlement.1.b: "新总督府已经证明了帝国的威望。"
 OE_DANUBE_MONGOL_HANDOVER: "将金帐汗国在摩尔达维亚地区拥有的全部地点交给摩尔达维亚总督府。"
 pe_byz_wallachian_protectorate: "穿刺公的末日"
 pe_byz_wallachian_protectorate_desc: "终结瓦拉几亚旧有的统治安排，设立接受罗马庇护的新政权。仅东罗马以“吸血鬼的故乡”宣战理由进攻瓦拉几亚时可用，花费100战争分数。"
 OE_DANUBE_WALLACHIA_TREATY_EFFECT: "将瓦拉几亚在瓦拉几亚地区拥有的领土组建为#Y 瓦拉几亚保护领#!，成为东罗马的#Y 罗马同盟#!；其在摩尔达维亚地区的全部领土归东罗马。摩尔达维亚地区所有可通行陆地地点加入#Y 罗马文明圈#!。"
 OE_WALLACHIAN_PROTECTORATE: "瓦拉几亚保护领"
 OE_WALLACHIAN_PROTECTORATE_ADJ: "瓦拉几亚"
 pe_byz_wallachian_protectorate_entry_short: "穿刺公的末日"
 pe_byz_wallachian_protectorate_entry: "建立东罗马的罗马同盟附庸瓦拉几亚保护领；瓦拉几亚在摩尔达维亚地区的领土归东罗马，该地区加入罗马文明圈。"
