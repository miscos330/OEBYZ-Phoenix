# NEW 2026-11-23 v19.5 Module 19.5-B: Kingdom of Scotland & Crown of Aragon Localization (simp_chinese, 240 keys) (oe_gem2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_sco_ara.py; edit the generator, not this file.
 oe_msn_sco_destiny:0 "#bold #color_yellow 苏格兰王国：北方至高王冠#!#!"
 oe_msn_sco_destiny_DESCRIPTION:0 "从光复爱丁堡、重续老同盟与平定群岛领主，到圣安德鲁斯文艺复兴、大西洋航运与苏格兰启蒙盛世"
 oe_msn_sco_destiny_CRITERIA_DESCRIPTION:0 "从邓弗姆林光复爱丁堡以统一低地，整编皇家圆矛长枪兵与大迈克尔号舰队，平定高地群岛并引领苏格兰启蒙运动。"
 oe_msn_sco_destiny_BUTTON_TOOLTIP:0 "开启苏格兰王国天命任务线"
 oe_msn_sco_destiny_BUTTON_DETAILS:0 "面向苏格兰的十二项三支柱天命任务：光复爱丁堡、重续法苏老同盟并打造皇家圆矛长枪兵与大迈克尔号主力舰队；平定群岛领主、收回奥克尼与进军爱尔兰海门户；发展北海鲱鱼羊毛贸易、圣安德鲁斯大学与苏格兰启蒙运动。"
 oe_msn_sco_01_liberate_edinburgh:0 "光复爱丁堡与统一低地"
 oe_msn_sco_01_liberate_edinburgh_desc:0 "从邓弗姆林王座出师，肃清盘踞爱丁堡与斯特灵的僭位守军，令苏格兰低地重归一统王权。"
 oe_msn_sco_01_liberate_edinburgh_req_tt:0 "控制爱丁堡、邓弗姆林与斯特灵（直接或通过附庸），且稳定度至少为5。"
 oe_msn_sco_02_auld_alliance_guard:0 "老同盟与法国苏格兰近卫队"
 oe_msn_sco_02_auld_alliance_guard_desc:0 "重续与法兰西的古老盟约并遣苏格兰精锐骑士赴欧充任王室近卫，借大陆强援制衡南方强敌。"
 oe_msn_sco_02_auld_alliance_guard_req_tt:0 "稳定度至少为8，且与法兰西结盟或国库至少保有180金币。"
 oe_msn_sco_03_schiltron_pikemen:0 "整编皇家矛阵长枪兵"
 oe_msn_sco_03_schiltron_pikemen_desc:0 "将久经战阵的苏格兰圆矛阵改造为常备文艺复兴长枪劲旅，以严明操典和王室军械立威北方。"
 oe_msn_sco_03_schiltron_pikemen_req_tt:0 "在文艺复兴时代或之后控制爱丁堡（直接或通过附庸），并已解锁职业军队思潮科技。"
 oe_msn_sco_04_great_michael_fleet:0 "大迈克尔号与皇家苏格兰海军"
 oe_msn_sco_04_great_michael_fleet_desc:0 "在纽黑文与克莱德船厂兴建厚木重炮大克拉克战舰，争雄北海并护卫苏格兰商队航线。"
 oe_msn_sco_04_great_michael_fleet_req_tt:0 "在大发现时代或之后控制爱丁堡与格拉斯哥（直接或通过附庸），且国库至少保有260金币。"
 oe_msn_sco_05_lordship_of_the_isles:0 "群岛领主与高地氏族归心"
 oe_msn_sco_05_lordship_of_the_isles_desc:0 "将因弗内斯、艾莱岛与刘易斯岛纳入王室法统，令赫布里底桨船领主与高地诸氏族归附王庭。"
 oe_msn_sco_05_lordship_of_the_isles_req_tt:0 "控制因弗内斯、艾莱岛与刘易斯岛（直接或通过附庸）。"
 oe_msn_sco_06_northern_isles_marches:0 "奥克尼群岛与南方边区要塞"
 oe_msn_sco_06_northern_isles_marches_desc:0 "收回北方奥克尼与设得兰群岛，同时在贝里克与南方边疆广筑石砌堡塔以固国门。"
 oe_msn_sco_06_northern_isles_marches_req_tt:0 "控制奥克尼、贝里克，以及设得兰或邓弗里斯之一（直接或通过附庸）。"
 oe_msn_sco_07_celtic_sea_bastion:0 "爱尔兰海与诺森布里亚屏障"
 oe_msn_sco_07_celtic_sea_bastion_desc:0 "将苏格兰兵锋推向北海峡对岸的卡里克弗格斯或南下纽卡斯尔与卡莱尔，铸就牢不可破的北方霸业。"
 oe_msn_sco_07_celtic_sea_bastion_req_tt:0 "控制卡里克弗格斯、纽卡斯尔或卡莱尔之一，且直接或通过附庸保有至少45处地块。"
 oe_msn_sco_08_caledonian_atlantic:0 "喀里多尼亚大西洋航运天命"
 oe_msn_sco_08_caledonian_atlantic_desc:0 "将格拉斯哥与克莱德湾打造为远洋门户，以苏格兰商船、木材与特许公司连通北大西洋诸港。"
 oe_msn_sco_08_caledonian_atlantic_req_tt:0 "在大发现时代或之后控制格拉斯哥与爱丁堡（直接或通过附庸），且稳定度至少为12。"
 oe_msn_sco_09_north_sea_herring_wool:0 "北海鲱鱼与羊毛商贸"
 oe_msn_sco_09_north_sea_herring_wool_desc:0 "特许阿伯丁与邓迪皇家自治市船队远捕北海鲱鱼、精腌鲑鱼并出口高地羊毛，畅销弗兰德斯诸市。"
 oe_msn_sco_09_north_sea_herring_wool_req_tt:0 "控制阿伯丁与邓迪（直接或通过附庸），且国库至少保有200金币。"
 oe_msn_sco_10_st_andrews_renaissance:0 "圣安德鲁斯大学与苏格兰文艺复兴"
 oe_msn_sco_10_st_andrews_renaissance_desc:0 "资助法夫海岸最古老的圣安德鲁斯学府，兴办印刷坊、教区学校与宫廷诗社，开启苏格兰文艺复兴。"
 oe_msn_sco_10_st_andrews_renaissance_req_tt:0 "在文艺复兴时代或之后控制圣安德鲁斯（直接或通过附庸），且稳定度至少为10。"
 oe_msn_sco_11_scottish_enlightenment:0 "爱丁堡学派与苏格兰启蒙运动"
 oe_msn_sco_11_scottish_enlightenment_desc:0 "在爱丁堡与格拉斯哥培育法学家、伦理哲学家、工程师与政治经济学家，令全欧赞誉苏格兰为北方雅典。"
 oe_msn_sco_11_scottish_enlightenment_req_tt:0 "在宗教改革时代或之后控制爱丁堡与格拉斯哥（直接或通过附庸），且稳定度至少为15。"
 oe_msn_sco_12_sovereign_crown_north:0 "北方至高王冠"
 oe_msn_sco_12_sovereign_crown_north_desc:0 "以一统的低地、高地与群岛为根基，凭铁律矛阵、大西洋航运与启蒙智识加冕北方永恒王权。"
 oe_msn_sco_12_sovereign_crown_north_req_tt:0 "在专制时代或之后控制爱丁堡、格拉斯哥、圣安德鲁斯与艾莱岛（直接或通过附庸），且稳定度至少为18。"
 oe_msn_ara_destiny:0 "#bold #color_yellow 阿拉贡王冠：红黄四条旗的陆间海#!#!"
 oe_msn_ara_destiny_DESCRIPTION:0 "从海事领事馆、皇家船坞与马略卡撒丁航道，到西西里晚祷、那不勒斯王位、瓦伦西亚丝绸交易所与陆间海霸业"
 oe_msn_ara_destiny_CRITERIA_DESCRIPTION:0 "颁行海事领事法典，整编阿尔莫加瓦尔陆战队与皇家桨船舰队，统合马略卡、撒丁、西西里与那不勒斯，令红黄四条旗称雄陆间海。"
 oe_msn_ara_destiny_BUTTON_TOOLTIP:0 "开启阿拉贡王冠天命任务线"
 oe_msn_ara_destiny_BUTTON_DETAILS:0 "面向阿拉贡王冠的十二项三支柱天命任务：颁行海事领事法典、扩建巴塞罗那皇家船坞并整编阿尔莫加瓦尔陆战队；统合马略卡、撒丁、西西里、那不勒斯与爱琴海公国；依托议会特许法、瓦伦西亚丝绸交易所与地中海领事银行缔造陆间海霸业。"
 oe_msn_ara_01_consulate_of_the_sea:0 "巴塞罗那与瓦伦西亚海事领事馆"
 oe_msn_ara_01_consulate_of_the_sea_desc:0 "稳固萨拉戈萨、巴塞罗那与瓦伦西亚三大核心领地，设立海事领事法庭以统领西地中海加泰罗尼亚商船。"
 oe_msn_ara_01_consulate_of_the_sea_req_tt:0 "控制巴塞罗那、瓦伦西亚与萨拉戈萨（直接或通过附庸），且稳定度至少为5。"
 oe_msn_ara_02_royal_shipyards_drassanes:0 "巴塞罗那皇家桨船厂"
 oe_msn_ara_02_royal_shipyards_drassanes_desc:0 "扩建宏伟的哥特式皇家船坞，量产高速战列桨船与舰队索具，颁行严整的加泰罗尼亚海军法令。"
 oe_msn_ara_02_royal_shipyards_drassanes_req_tt:0 "控制巴塞罗那（直接或通过附庸），国库至少保有180金币，且稳定度至少为8。"
 oe_msn_ara_03_almogavar_marines:0 "唤醒钢铁：阿尔莫加瓦尔陆战队"
 oe_msn_ara_03_almogavar_marines_desc:0 "将传奇的比利牛斯山岳奇兵整编为常备两栖陆战队，以标枪、短刃与战吼横扫地中海沿岸堡垒。"
 oe_msn_ara_03_almogavar_marines_req_tt:0 "在文艺复兴时代或之后控制巴塞罗那（直接或通过附庸），并已解锁职业军队思潮科技。"
 oe_msn_ara_04_catalan_grand_duchies:0 "加泰罗尼亚大军团与地中海公国"
 oe_msn_ara_04_catalan_grand_duchies_desc:0 "重申对雅典、新帕特雷或马格里布海门的王权宣称，令红黄四条旗在东地中海与北非沿岸猎猎飘扬。"
 oe_msn_ara_04_catalan_grand_duchies_req_tt:0 "在大发现时代或之后控制雅典、新帕特雷或突尼斯之一（直接或通过附庸）。"
 oe_msn_ara_05_mallorca_sardinia:0 "马略卡王冠与撒丁岛霸权"
 oe_msn_ara_05_mallorca_sardinia_desc:0 "收回帕尔马的航海制图中心并平定卡利亚里与撒丁全境，将巴利阿里至撒丁岛航道化为阿拉贡内海。"
 oe_msn_ara_05_mallorca_sardinia_req_tt:0 "控制帕尔马、卡利亚里，以及奥里斯塔诺或萨萨里之一（直接或通过附庸）。"
 oe_msn_ara_06_sicilian_vespers:0 "西西里晚祷的正统继承者"
 oe_msn_ara_06_sicilian_vespers_desc:0 "将巴勒莫与墨西拿重新纳入巴塞罗那王室直统，扼守地中海粮仓西西里与亚平宁咽喉海峡。"
 oe_msn_ara_06_sicilian_vespers_req_tt:0 "控制巴勒莫与墨西拿（直接或通过附庸）。"
 oe_msn_ara_07_naples_inheritance:0 "宽宏者阿方索与那不勒斯王位"
 oe_msn_ara_07_naples_inheritance_desc:0 "凯旋入主那不勒斯并控制南意海港，将西西里与意大利南部共铸为光芒耀眼的文艺复兴共主王庭。"
 oe_msn_ara_07_naples_inheritance_req_tt:0 "控制那不勒斯，以及加埃塔、巴里或萨莱诺之一（直接或通过附庸）。"
 oe_msn_ara_08_dual_crown_or_thalassocracy:0 "伊比利亚共主或地中海海权帝国"
 oe_msn_ara_08_dual_crown_or_thalassocracy_desc:0 "无论是在托莱多加冕伊比利亚共主，还是威服热那亚与雅典以成海上霸主，阿拉贡都将主导南欧格局。"
 oe_msn_ara_08_dual_crown_or_thalassocracy_req_tt:0 "在大发现时代或之后控制托莱多、热那亚或雅典之一，且直接或通过附庸保有至少95处地块。"
 oe_msn_ara_09_cortes_and_fueros:0 "阿拉贡议会、总委员会与特许法典"
 oe_msn_ara_09_cortes_and_fueros_desc:0 "协调王室权威、萨拉戈萨特许法典与加泰罗尼亚总委员会，使复合君主国诸邦心悦诚服地共担国用。"
 oe_msn_ara_09_cortes_and_fueros_req_tt:0 "控制萨拉戈萨与巴塞罗那（直接或通过附庸），且稳定度至少为10。"
 oe_msn_ara_10_lonja_de_la_seda:0 "瓦伦西亚黄金时代与丝绸交易所"
 oe_msn_ara_10_lonja_de_la_seda_desc:0 "在瓦伦西亚建起螺旋石柱林立的丝绸交易所，汇聚银行家、丝织行会与文坛巨擘，缔造商业黄金时代。"
 oe_msn_ara_10_lonja_de_la_seda_req_tt:0 "在文艺复兴时代或之后控制瓦伦西亚（直接或通过附庸），且国库至少保有240金币。"
 oe_msn_ara_11_mediterranean_consulates:0 "地中海领事网与市政银行体系"
 oe_msn_ara_11_mediterranean_consulates_desc:0 "将巴塞罗那与瓦伦西亚市政公共银行连通西西里至亚历山大港的海外领事网，以金融信用铸就海权霸业。"
 oe_msn_ara_11_mediterranean_consulates_req_tt:0 "在宗教改革时代或之后控制巴塞罗那与瓦伦西亚（直接或通过附庸），且稳定度至少为15。"
 oe_msn_ara_12_mare_nostrum_four_bars:0 "红黄四条旗的陆间海"
 oe_msn_ara_12_mare_nostrum_four_bars_desc:0 "将巴塞罗那、瓦伦西亚、帕尔马、巴勒莫与那不勒斯共揽于统一海事法典之下，红黄四条旗加冕陆间海至尊。"
 oe_msn_ara_12_mare_nostrum_four_bars_req_tt:0 "在专制时代或之后控制巴塞罗那、瓦伦西亚、帕尔马、巴勒莫与那不勒斯（直接或通过附庸），且稳定度至少为18。"
 oe_gem2_sco_schiltron_pikemen:0 "苏格兰皇家圆矛长枪兵"
 oe_gem2_sco_schiltron_pikemen_desc:0 "由苏格兰著名的圆矛枪墙演变而来的文艺复兴常备重装长枪劲旅。需于文艺复兴时代并解锁职业军队思潮后方可招募，擅在丘陵、山地与湿地扼阻敌军骑兵狂潮。"
 oe_gem2_ara_almogavar_marines:0 "阿拉贡阿尔莫加瓦尔陆战队"
 oe_gem2_ara_almogavar_marines_desc:0 "承袭比利牛斯山岳奇兵血脉的文艺复兴常备两栖突击步兵。需于文艺复兴时代并解锁职业军队思潮后方可招募，凭惊人机动与高昂士气冲击横扫海岸要塞与崎岖山地。"
 oe_gem2_dec_st_andrews_charter.title:0 "敕建圣安德鲁斯大学"
 oe_gem2_dec_st_andrews_charter.desc:0 "自#Y 1410#!年起且控制圣安德鲁斯时可颁行：赐予永久王家与教会特许状，创建苏格兰第一座大学，永久提升全国识字率、科研速度与文化传统。"
 oe_gem2_dec_st_andrews_charter.a:0 "钤印颁布圣安德鲁斯大学皇家特许状"
 oe_gem2_dec_consulat_del_mar.title:0 "颁行海事领事法典"
 oe_gem2_dec_consulat_del_mar.desc:0 "自#Y 1345#!年起且控制巴塞罗那、瓦伦西亚或帕尔马时可颁行：在全国诸港颁布享誉地中海的加泰罗尼亚海商法典，永久提升海上存在感、海运贸易效率与商人力量。"
 oe_gem2_dec_consulat_del_mar.a:0 "颁布施行《海事领事法典》"
 STATIC_MODIFIER_NAME_oe_gem2_mod_dec_st_andrews:0 "圣安德鲁斯大学皇家特许状"
 STATIC_MODIFIER_DESC_oe_gem2_mod_dec_st_andrews:0 "苏格兰古老的海岸学府世代培育博学神职、法政名士与人文思想家。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_dec_consulat_mar:0 "海事领事法典宪章"
 STATIC_MODIFIER_DESC_oe_gem2_mod_dec_consulat_mar:0 "系统成文的加泰罗尼亚海商法统筹西地中海诸港的航运、保险与商事裁判。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m1:0 "皇家圆矛阵长枪兵操典"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m1:0 "严整的文艺复兴长枪方阵融合苏格兰不屈士气与山地固守优势。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m2:0 "凯尔特海与边区诸领守护者"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m2:0 "统御赫布里底、北方群岛与爱尔兰海门户，令兵源、水手与边防堡垒源源不绝。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m3:0 "北方雅典"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m3:0 "爱丁堡、格拉斯哥与圣安德鲁斯以启蒙哲学、法学与工程创新照耀欧陆。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m4:0 "北方至高王冠"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m4:0 "低地、高地与群岛合而为一，凭铁纪王师与远洋船队奠定苏格兰永恒盛世。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m1:0 "唤醒钢铁两栖陆战先锋"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m1:0 "久经沙场的阿尔莫加瓦尔陆战队以疾风步速与雷霆冲击称雄地中海战局。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m2:0 "两西西里共主王冠"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m2:0 "巴勒莫与那不勒斯共归阿拉贡王庭，令海外诸邦忠心归附、正统威仪远扬。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m3:0 "加泰罗尼亚地中海商贸网"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m3:0 "瓦伦西亚丝绸交易所、巴塞罗那市政银行与海外领事网汇聚滔天商利。"
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m4:0 "红黄四条旗的陆间海"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m4:0 "囊括巴塞罗那、瓦伦西亚、帕尔马、巴勒莫与那不勒斯，阿拉贡王冠成为地中海无可争议的主宰。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev1_a:0 "爱丁堡要塞重光"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev1_a:0 "爱丁堡城堡的戏剧性光复稳固了洛锡安王权，极大鼓舞了苏格兰全境守御意志。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev1_b:0 "低地光复先锋"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev1_b:0 "久历战火的低地长矛手与边区骑兵乘胜追击，誓要收复每一寸沦陷郡邑。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev2_a:0 "法苏老同盟契约"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev2_a:0 "与大陆强国并肩的外交格局与归国近卫队老兵，令苏格兰在基督教世界声望卓著。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev2_b:0 "大陆边防协饷"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev2_b:0 "来自海外盟邦的协饷化作绵延边疆的石砌堡塔与充实守军。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev3_a:0 "高地王室郡法"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev3_a:0 "王室郡守与严整王师将爱丁堡的政令稳稳延伸至北方幽谷与西部海湾。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev3_b:0 "赫布里底桨船盟约"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev3_b:0 "受抚的西部氏族首领为苏格兰王室源源不断提供敏捷桨船水手与勇猛高地武士。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev4_a:0 "圣安德鲁斯王家学院"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev4_a:0 "丰厚的王室拨款吸引欧陆名师云集法夫，为苏格兰培育大批博学神职与文官。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev4_b:0 "苏格兰法政文官团"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev4_b:0 "科班出身的法学家全面革新王室法庭、郡政审计与自治市特许制度。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev5_a:0 "纽黑文皇家主力舰队"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev5_a:0 "新建船坞与重炮克拉克主力舰令皇家苏格兰海军威震北海。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev5_b:0 "北海武装商队"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev5_b:0 "武装护航的苏格兰羊毛、海盐与鲱鱼商船在坎普维尔、但泽与波尔多畅行无阻。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev6_a:0 "高地低地文化合流"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev6_a:0 "王室兼扶苏格兰诗人、盖尔吟游乐师与教区学堂，令全国各阶层凝聚如一。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev6_b:0 "高地阔剑与长枪联军"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev6_b:0 "凶悍的高地阔剑突击队与严整的低地长枪阵相辅相成，铸就令人生畏的苏格兰野战军。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev7_a:0 "喀里多尼亚大西洋公司"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev7_a:0 "资本雄厚的克莱德商船队纵横北大西洋烟草、鳕鱼与毛皮航路。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev7_b:0 "达连两洋拓荒壮举"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev7_b:0 "无畏的远洋拓殖壮举激发出高涨的航海抱负与海外移民热潮。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev8_a:0 "苏格兰启蒙学派"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev8_a:0 "普及教区的国民教育与星光熠熠的大学讲席令苏格兰跃居全欧科学与思想前沿。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev8_b:0 "克莱德工商业引擎"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev8_b:0 "股份制银行、精密工坊与商业革新令苏格兰生产力与国库收入扶摇直上。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev9_a:0 "海事领事法典体系"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev9_a:0 "公正透明的加泰罗尼亚海事仲裁大幅降低海运风险，广纳地中海四方商贾。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev9_b:0 "加泰罗尼亚清剿海盗舰队"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev9_b:0 "港口护航税供养的轻快桨船常年巡弋巴利阿里与撒丁航道，海盗闻风丧胆。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev10_a:0 "卡斯佩宪制协约"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev10_a:0 "三邦合议定立的法统平息了地域猜忌，令复合王室合法性固若金汤。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev10_b:0 "伊比利亚王室联姻枢密院"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev10_b:0 "贯穿半岛的王室亲缘网络使阿拉贡外交成为纵横南欧的利器。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev11_a:0 "宽宏者文艺复兴宫廷"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev11_a:0 "资助洛伦佐·瓦拉等人文大师与加泰罗尼亚学人，使阿拉贡文治声誉远播意西两地。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev11_b:0 "两西西里总督体制"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev11_b:0 "巴勒莫与那不勒斯总督协同治政，将谷物、水手与贡税源源不断输往王庭。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev12_a:0 "皇家船坞量产体系"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev12_a:0 "流水线式的地中海造船工艺令阿拉贡战列桨船既廉且速，威压群雄。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev12_b:0 "阿尔莫加瓦尔跳帮陆战队"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev12_b:0 "精锐加泰罗尼亚陆战队既擅海上跳帮白刃，又精两栖强攻海防坚城。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev13_a:0 "契约宪政与议会协和"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev13_a:0 "尊重各邦特许法换来诸阶层鼎力襄助与稳健低息的市政公债信用。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev13_b:0 "阿拉贡最高皇家枢密院"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev13_b:0 "中央派驻的钦差与枢密院官员高效统筹伊比利亚与意大利诸邦军需税赋。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev14_a:0 "瓦伦西亚丝绸盛世"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev14_a:0 "流光溢彩的瓦伦西亚天鹅绒与锦缎从那不勒斯畅销至安特卫普。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev14_b:0 "丝绸交易所金融清算网"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev14_b:0 "王室担保的汇票清算业务使阿拉贡诸城跃升为西地中海首屈一指的金融枢纽。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev15_a:0 "四条旗地中海海权国"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev15_a:0 "举国资源尽归无敌舰队、航海制图与地中海商贸霸权。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev15_b:0 "伊比利亚双王共主霸业"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev15_b:0 "阿拉贡宪政声望与陆海大军交相辉映，确立无可匹敌的南欧陆海权威。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev16_a:0 "陆间海至高霸主"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev16_a:0 "独步地中海诸港、商贸博览会与远洋航道，令阿拉贡王冠永耀史册。"
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev16_b:0 "四条旗海防壁垒"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev16_b:0 "星形海港要塞与严整炮兵团令阿拉贡漫长海岸线固若金汤。"
 oe_gem2.1.title:0 "光复爱丁堡城堡"
 oe_gem2.1.desc:0 "在伪装运送酒粮的商车掩护下，威廉·道格拉斯率精锐奇袭玄武岩绝壁上的爱丁堡城堡并一举夺回！随着洛锡安咽喉要塞重归正统，大卫二世的旗帜在苏格兰低地声势大振。"
 oe_gem2.1.a:0 "重整爱丁堡王庭与城堡常备守军"
 oe_gem2.1.b:0 "厚赏低地战团并乘胜反击南方边区"
 oe_gem2.2.title:0 "重续老同盟与法苏盟约"
 oe_gem2.2.desc:0 "携鸢尾花国书的法兰西使节自巴黎远道而来，提议重续自罗伯特·布鲁斯时代传承的法苏老同盟。法兰西军费、名将教官与苏格兰近卫队荣衔，为苏格兰提供了制衡南方霸权的大陆支点。"
 oe_gem2.2.a:0 "缔结文森条约并派遣苏格兰近卫队赴法"
 oe_gem2.2.b:0 "将法方军援投入本国自治市与边防城堡"
 oe_gem2.3.title:0 "平定群岛领主与高地诸部"
 oe_gem2.3.desc:0 "盘踞艾莱岛与斯凯岛桨船要塞的麦克唐纳群岛领主向来视赫布里底为独立海国，屡屡袭扰马里湾并觊觎罗斯伯爵领。王室必须抉择：以铁血平叛，抑或以王室敕令招抚高地海主。"
 oe_gem2.3.a:0 "以哈洛之威申明王法并在高地推行郡制"
 oe_gem2.3.b:0 "承认群岛桨船特权以换取效忠与海防义务"
 oe_gem2.4.title:0 "圣安德鲁斯大学建校诏书"
 oe_gem2.4.desc:0 "法夫海岸钟声齐鸣，教宗诏书正式敕准在圣安德鲁斯建立苏格兰首座大学！苏格兰学子、法学家与神学家再不必远涉重洋赴巴黎或牛津求学，一座北方学术灯塔已在本土升起。"
 oe_gem2.4.a:0 "捐资设立教会法、修辞学与自然哲学王家教席"
 oe_gem2.4.b:0 "侧重王室法政与自治市财政实务教育"
 oe_gem2.5.title:0 "詹姆斯四世大迈克尔号下水"
 oe_gem2.5.desc:0 "法夫苍翠的橡木林化作一座海上移动堡垒——全基督教世界最为宏伟的克拉克巨舰大迈克尔号下水！船壳厚达十尺、遍布青铜重炮的她泊于福斯湾，向全欧宣告苏格兰步入文艺复兴海军强国之列。"
 oe_gem2.5.a:0 "以大迈克尔号为核心组建常备皇家船坞舰队"
 oe_gem2.5.b:0 "以王室护航舰掩护往返波罗的海与弗兰德斯的商队"
 oe_gem2.6.title:0 "高地文艺复兴与氏族宪章"
 oe_gem2.6.desc:0 "从斯特灵宫廷的苏格兰语诗坛与盖尔竖琴乐社，到泰河与克莱德河畔拔地而起的石砌塔楼宅邸，一股生机勃勃的文化浪潮正弥合低地自治市与高地山谷的隔阂。"
 oe_gem2.6.a:0 "赞助盖尔语与苏格兰语双语典籍及高地庄园兴建"
 oe_gem2.6.b:0 "将高地氏族步兵团编入常备皇家矛阵序列"
 oe_gem2.7.title:0 "北大西洋与达连海外特许公司"
 oe_gem2.7.desc:0 "雄心勃勃的爱丁堡银行家与格拉斯哥船主联袂呈递海外特许状，欲组建苏格兰贸易公司远航新大陆与印度洋。若辅以稳健补给与北大西洋港站，苏格兰商业或将开拓宏伟海外版图。"
 oe_gem2.7.a:0 "稳步承保北大西洋与新苏格兰远洋贸易站"
 oe_gem2.7.b:0 "孤注一掷派遣热带地峡远征队沟通两大洋"
 oe_gem2.8.title:0 "苏格兰启蒙运动曙光"
 oe_gem2.8.desc:0 "随着议会颁布史无前例的教育法令、令每一教区皆设学堂，苏格兰四大古老学府迸发出璀璨思想火花。在爱丁堡沙龙与格拉斯哥工坊间，先驱学者正重塑伦理哲学、商业经济学、化学与蒸汽工程。"
 oe_gem2.8.a:0 "创设爱丁堡皇家学会以兴自然与人文科学"
 oe_gem2.8.b:0 "将启蒙政治经济学运用于克莱德工业与现代银行"
 oe_gem2.9.title:0 "海事领事法典颁行"
 oe_gem2.9.desc:0 "巴塞罗那、瓦伦西亚与帕尔马的法学家与资深船长协力编纂成《海事领事法典》，详定海运契约、海损保险、打捞与捕获规程。自直布罗陀至黎凡特，加泰罗尼亚海商法成为全地中海商贸准绳。"
 oe_gem2.9.a:0 "在阿拉贡诸港与海外领事馆全面施行海事法典"
 oe_gem2.9.b:0 "授权海事领事征收护航税以清剿海盗"
 oe_gem2.10.title:0 "卡斯佩妥协协议"
 oe_gem2.10.desc:0 "当古老的巴塞罗那王室面临绝嗣危机，来自阿拉贡、加泰罗尼亚与瓦伦西亚各三名德高望重的法学家与主教齐聚埃布罗河畔卡斯佩镇。他们摒弃毁灭性内战，以庄严法理投票定立新君。"
 oe_gem2.10.a:0 "将三邦宪制仲裁确立为复合王国的永恒基石"
 oe_gem2.10.b:0 "借特拉斯塔马拉联姻纽带扩大伊比利亚外交影响"
 oe_gem2.11.title:0 "宽宏者阿方索入主那不勒斯"
 oe_gem2.11.desc:0 "穿过新堡凯旋门镀金雕饰，宽宏者阿方索国王盛装入主那不勒斯！统合阿拉贡、加泰罗尼亚、瓦伦西亚、马略卡、撒丁、西西里与那不勒斯的盛大宫廷，广聚意大利人文巨匠与加泰罗尼亚名将。"
 oe_gem2.11.a:0 "将那不勒斯新堡打造为西地中海人文主义明珠"
 oe_gem2.11.b:0 "将南意整编为总督辖区以供养帝国舰队"
 oe_gem2.12.title:0 "加泰罗尼亚地中海皇家船坞"
 oe_gem2.12.desc:0 "在巴塞罗那皇家船坞高耸的石拱之下，数百名造船匠、制缆师与铸炮师正同步赶造整支桨船战舰队。配上马略卡精准海图与阿尔莫加瓦尔陆战队，地中海诸敌莫敢樱锋。"
 oe_gem2.12.a:0 "在皇家船坞推行标准化桨船船体与舰首青铜炮"
 oe_gem2.12.b:0 "扩建海兵营房以精训阿尔莫加瓦尔登舰奇兵"
 oe_gem2.13.title:0 "阿拉贡议会与古老特许法"
 oe_gem2.13.desc:0 "随着王室战线横跨意大利与比利牛斯，萨拉戈萨议会、加泰罗尼亚议会与阿拉贡大法官重申古老的契约誓言：只要君主恪守各邦特许法与自由，诸阶层必竭诚输税效命。"
 oe_gem2.13.a:0 "恪守古老特许法并与总委员会共推财政革新"
 oe_gem2.13.b:0 "设立统一的阿拉贡皇家枢密院以总揽政令"
 oe_gem2.14.title:0 "瓦伦西亚丝绸交易所落成"
 oe_gem2.14.desc:0 "建筑宗师佩雷·孔普特在瓦伦西亚城心筑起一座商业圣殿——丝绸交易所！在棕榈穹顶与螺旋石柱大厅之下，丝织名匠、热那亚银行家与黎凡特香料商云集交易，令瓦伦西亚冠绝伊比利亚。"
 oe_gem2.14.a:0 "特许皇家丝织行会并举办地中海免税博览会"
 oe_gem2.14.b:0 "在交易所偏殿扩建瓦伦西亚市政清算银行"
 oe_gem2.15.title:0 "伊比利亚共主抑或地中海海权帝国"
