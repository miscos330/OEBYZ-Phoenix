l_simp_chinese:
 oe_sit_v47_mamluk_suez: "马穆鲁克苏伊士运河与红海香料霸权"
 oe_sit_v47_mamluk_suez_desc: "1485至1585年间，绕行好望角的葡萄牙舰队悍然冲击维系千年的印度洋—红海—地中海香料大动脉。重掘古法老—马穆鲁克苏伊士大运河、密运威尼斯造船松木与青铜重炮、逆转第乌海战并繁荣开罗香料交易所，缔造横跨两海的红海海权霸业！"
 oe_v47_suez_out_thalassocracy: "两海大运河与红海—印度洋海权霸业"
 oe_v47_suez_out_thalassocracy_desc: "随着大苦湖船闸全线贯通与红海重炮舰队扬威阿拉伯海，商船得以自亚历山大直航卡利卡特与第乌，开罗、威尼斯与印度洋盟友共同加冕欧亚香料海权霸主。"
 oe_v47_suez_out_cape_triumph: "好望角航路垄断胜利"
 oe_v47_suez_out_cape_triumph_desc: "大西洋克拉克巨舰成功切断红海香料动脉并确立里斯本绕行好望角的垄断优势，迫使开罗与威尼斯重整黎凡特陆贸与工坊经济。"
 oe_v47_suez_out_dual_route: "红海与好望角双航道均势"
 oe_v47_suez_out_dual_route_desc: "至公元1585年，红海船队与好望角大帆船在百年博弈中达成持久共处，东西两条香料通道并行不悖、各擅胜场。"
 oe_v47_suez_map_mamluk_tt: "#Y 马穆鲁克苏伊士与红海核心轴心#!：主导大运河开凿、红海船坞与香料转口的埃及—红海诸港。"
 oe_v47_suez_map_venice_tt: "#Y 威尼斯松木与青铜炮同盟#!：为红海主力舰队提供兵工厂造船良材、重炮与欧洲金币的亚得里亚海强邦。"
 oe_v47_suez_map_india_tt: "#Y 印度洋香料同盟伙伴#!：供应黑胡椒、柚木战舰与联军水师的古吉拉特与马拉巴尔富饶海邦。"
 oe_v47_suez_map_portugal_tt: "#Y 葡萄牙好望角远洋舰队#!：企图绕行非洲南端、以大西洋巨舰夺取亚洲香料垄断权的强劲对手。"
 oe_v47_suez_legend_mamluk: "马穆鲁克埃及与红海轴心"
 oe_v47_suez_legend_venice: "威尼斯造船与地中海商团"
 oe_v47_suez_legend_india: "古吉拉特与卡利卡特印度洋盟友"
 oe_v47_suez_legend_portugal: "葡萄牙好望角远洋对手"
 OE_V47_SUEZ_GUI_HDR_L: "苏伊士运河进度"
 OE_V47_SUEZ_GUI_HDR_R: "红海香料霸权"
 OE_V47_SUEZ_GUI_CARD_TITLE: "两海大运河与印度洋香料决战"
 OE_V47_SUEZ_GUI_CARD_BODY: "葡萄牙好望角远洋舰队正步步紧逼开罗与威尼斯的千年香料命脉。协调威尼斯造船松木与铜炮船队、重掘法老—马穆鲁克苏伊士大运河、遣红海重炮舰队赴第乌决战并创办开罗香料交易所。将运河进度推升至85以上且香料霸权达75以上，即可加冕横跨两海的“红海—印度洋海权霸业”！"
 OE_V47_SUEZ_GUI_GAUGE_1: "苏伊士运河开凿进度（达85以上实现两海通航）"
 OE_V47_SUEZ_GUI_GAUGE_2: "红海香料霸权（75以上击溃好望角垄断；20以下为葡萄牙获胜）"
 OE_V47_SUEZ_GUI_FOOTNOTE: "数据地图说明：鎏金色为马穆鲁克埃及与红海轴心；海蓝青为威尼斯商团；翠绿色为古吉拉特与卡利卡特印度洋盟友；绯红色为葡萄牙好望角舰队。"
 hint_oe_sit_v47_mamluk_suez: "[GetSituationByKey('oe_sit_v47_mamluk_suez').GetNameWithNoTooltip]"
 hint_oe_sit_v47_mamluk_suez_hint_text: "#T 局势概览#!\n@hint! #Y 《马穆鲁克苏伊士运河与红海香料霸权》#! 于 #Y 1485–1585年#! 间当玩家执掌埃及、威尼斯、葡萄牙或印度洋周边强国时激活（非玩家剧场默认约束AI不乱跑）。将 #Y 苏伊士运河进度推升至85以上#! 且 #Y 红海香料霸权达75以上#! 即可达成“两海海权霸业”结局；葡萄牙若将香料霸权压低至20以下则可达成“好望角垄断”结局。"
 hint_oe_sit_v47_mamluk_suez_administrative: "执行“开凿法老—马穆鲁克苏伊士大运河”可单次猛推+14运河进度并激活每月自动增长；配合专属政府改革“红海苏伊士海军总署”可事半功倍。"
 hint_oe_sit_v47_mamluk_suez_diplomatic: "“威尼斯造船松木与青铜炮船队”与“开罗—亚历山大香料交易所”可同步抬升两项核心进度条，并借助威尼斯与印度洋盟友共同压制大西洋竞争者。"
 hint_oe_sit_v47_mamluk_suez_military: "派遣“红海重炮主力舰队”（+12%桨帆船战力、+8%海军士气）并争夺曼德海峡咽喉，可在第乌与索科特拉正面压制葡萄牙远洋克拉克战舰。"
 oe_sit_v47_samarkand_renaissance: "兀鲁伯撒马尔罕文艺复兴与中亚火药十字路口"
 oe_sit_v47_samarkand_renaissance_desc: "公元1444年，身为君主亦是旷世天文学家的兀鲁伯在撒马尔罕执掌傲视全球的巨型大理石观象台与雷吉斯坦学者殿堂。1444至1565年间，抢先粉碎1449年反动宫廷密谋、刊行《苏丹天文历表》、将球面三角算学融入青铜重炮铸造并扩建丝路驿馆，带领中亚率先点亮近世科学—火药黄金时代！"
 oe_v47_samarkand_out_golden_age: "撒马尔罕科学—火药黄金时代"
 oe_v47_samarkand_out_golden_age_desc: "战胜1449年逆流的撒马尔罕大天文台与皇家弹道学院，将河中铸成引领欧亚实证天文学、麻纸出版与近代重炮兵学的璀璨文明之巅。"
 oe_v47_samarkand_out_reaction: "观象台蒙尘与星算学者流散"
 oe_v47_samarkand_out_reaction_desc: "宗室动荡令河中凝聚力瓦解，阿里·库什吉等星算大师流散至君士坦丁堡、波斯与印度宫廷，将撒马尔罕的科学火种播撒向四海八方。"
 oe_v47_samarkand_out_crossroads: "屹立不倒的丝路火药十字路口"
 oe_v47_samarkand_out_crossroads_desc: "至公元1565年，河中、波斯与北印度在坚固商队驿堡、青铜铸炮工坊与多语种波斯—突厥学术交融中形成了持久的火药帝国均势。"
 oe_v47_sam_map_timurid_tt: "#Y 帖木儿与河中复兴核心区#!：以撒马尔罕、布哈拉与赫拉特为中心的科学天文与丝路心脏。"
 oe_v47_sam_map_persia_tt: "#Y 波斯与萨法维—土库曼劲敌#!：在伊朗高原争夺呼罗珊、丝路关隘与教派炮火霸权的西方豪强。"
 oe_v47_sam_map_india_tt: "#Y 北印度与喀布尔南方地平线#!：自开伯尔山口俯瞰的德里、拉合尔与印度斯坦丰饶大平原。"
 oe_v47_sam_map_silkroad_tt: "#Y 草原与丝路边疆带#!：贯通喀什噶尔与草原防线的丝路外围商道与游牧博弈前沿。"
 oe_v47_sam_legend_timurid: "帖木儿与河中复兴核心"
 oe_v47_sam_legend_persia: "波斯与萨法维—土库曼对手"
 oe_v47_sam_legend_india: "北印度与开伯尔南方地平线"
 oe_v47_sam_legend_silkroad: "中亚草原与丝路外围"
 OE_V47_SAM_GUI_HDR_L: "撒马尔罕科学指数"
 OE_V47_SAM_GUI_HDR_R: "帖木儿宗室凝聚力"
 OE_V47_SAM_GUI_CARD_TITLE: "巨型观象台、弹道重炮与黄金丝路"
 OE_V47_SAM_GUI_CARD_BODY: "兀鲁伯大天文台正傲立于十五世纪人类科学之巅，但1449年反动密谋与宗室内讧随时可能令河中分崩离析。刊行《苏丹天文历表》、创办撒马尔罕弹道重炮学院、扩建丝路驿馆网、资助雷吉斯坦博学宫廷并召开诸王公和解大会。将科学指数推升至85以上且凝聚力达70以上，即可加冕“撒马尔罕科学—火药黄金时代”！"
 OE_V47_SAM_GUI_GAUGE_1: "撒马尔罕科学突破指数（达85以上解锁科学—火药黄金时代）"
 OE_V47_SAM_GUI_GAUGE_2: "帖木儿宗室凝聚力（70以上稳固黄金时代；20以下触发观象台蒙尘）"
 OE_V47_SAM_GUI_FOOTNOTE: "数据地图说明：撒马尔罕青瓷色为帖木儿与河中核心；绯红色为波斯与萨法维对手；藏红金为北印度南方地平线；钴蓝色为中亚草原与丝路外围。"
 hint_oe_sit_v47_samarkand_renaissance: "[GetSituationByKey('oe_sit_v47_samarkand_renaissance').GetNameWithNoTooltip]"
 hint_oe_sit_v47_samarkand_renaissance_hint_text: "#T 局势概览#!\n@hint! #Y 《兀鲁伯撒马尔罕文艺复兴与中亚火药十字路口》#! 于 #Y 1444–1565年#! 间当玩家执掌河中、波斯或北印度势力时激活（非玩家剧场默认约束AI）。将 #Y 撒马尔罕科学指数推升至85以上#! 且 #Y 帖木儿凝聚力保持在70以上#!，即可加冕“科学—火药黄金时代”！"
 hint_oe_sit_v47_samarkand_renaissance_administrative: "优先刊行《苏丹天文历表》（科学+12）并启用专属政府改革“撒马尔罕天文经学院”，即可触发稳定的月度科学增长；同时确保撒马尔罕、布哈拉与赫拉特安定以维系凝聚力。"
 hint_oe_sit_v47_samarkand_renaissance_diplomatic: "及时召开“帖木儿诸王公和解大会”（凝聚力+13、藩属忠诚+8）并扩建丝路商队驿馆网，可在1449年密谋与萨法维冲突爆发前筑牢王朝团结。"
 hint_oe_sit_v47_samarkand_renaissance_military: "创办“撒马尔罕弹道重炮学院”（+12%炮兵战力、+8%围城能力）并列装铁链重炮车营，足以令河中大军正面击破草原游牧骑兵与波斯红头军。"
 oe_v47_act_suez_venetian_timber_convoy: "特许威尼斯松木与青铜炮船队"
 oe_v47_act_suez_venetian_timber_convoy_desc: "向威尼斯兵工厂定购达尔马提亚橡木、船帆与青铜火炮，经亚历山大与尼罗河驳船转运至苏伊士船坞装配红海主力舰队。"
 oe_v47_act_suez_venetian_timber_convoy_tt: "苏伊士运河进度 #G +10#!、红海香料霸权 #G +8#!，并获得为期12年的 #Y 威尼斯造船松木与青铜炮船队#! 修正。"
 oe_v47_act_suez_dredge_pharaonic_canal: "开凿法老—马穆鲁克苏伊士大运河"
 oe_v47_act_suez_dredge_pharaonic_canal_desc: "征调埃及水利工匠与石砌船闸师沿古法老运河旧迹疏浚尼罗河至大苦湖与苏伊士湾水道，让商船与炮舰无需转陆直通两海。"
 oe_v47_act_suez_dredge_pharaonic_canal_tt: "苏伊士运河进度 #G +14#!、威望 #G +6#!，并获得为期14年的 #Y 法老—马穆鲁克苏伊士大运河工程#! 修正。"
 oe_v47_act_suez_diu_artillery_armada: "派遣红海重炮主力舰队出征印度洋"
 oe_v47_act_suez_diu_artillery_armada_desc: "自苏伊士与吉达誓师出动装备重型青铜火炮的红海主力舰队，会师古吉拉特与卡利卡特水师，粉碎葡萄牙对阿拉伯海的封锁。"
 oe_v47_act_suez_diu_artillery_armada_tt: "红海香料霸权 #G +12#!、海军传统 #G +6#!，并获得为期12年的 #Y 红海重炮主力舰队#! 修正。"
 oe_v47_act_suez_cairo_spice_bourse: "特许开罗—亚历山大香料交易所"
 oe_v47_act_suez_cairo_spice_bourse_desc: "在开罗与亚历山大设立统一检定品级、推行卡里米汇票清算的香料交易所，以更短航程与丰沛货源压制里斯本好望角航线。"
 oe_v47_act_suez_cairo_spice_bourse_tt: "红海香料霸权 #G +10#!、苏伊士运河进度 #G +5#!，并获得为期12年的 #Y 开罗—亚历山大香料交易所#! 修正。"
 oe_v47_act_suez_cape_blockade_counter: "争夺曼德海峡与季风洋商路"
 oe_v47_act_suez_cape_blockade_counter_desc: "派遣高速季风巡舰与守备炮兵争夺索科特拉、亚丁与第乌咽喉：葡萄牙可借此压制红海香料霸权，红海同盟则可反手撕裂大西洋封锁。"
 oe_v47_act_suez_cape_blockade_counter_tt: "改变红海香料霸权（葡萄牙执行 #R -11#!，红海与印度洋同盟执行 #G +9#!），并获得为期12年的 #Y 季风海峡护航与破交海战#! 修正。"
 oe_v47_act_sam_zij_sultani_tables: "刊行《苏丹天文历表》与精密星算"
 oe_v47_act_sam_zij_sultani_tables_desc: "以撒马尔罕上等麻纸精抄刊行兀鲁伯九百余颗恒星实测星表与精密三角函数表，分赠欧亚各国天文台、航海家与官府司天机构。"
 oe_v47_act_sam_zij_sultani_tables_tt: "撒马尔罕科学指数 #G +12#!、帖木儿凝聚力 #G +4#!、科研进度 #G +10#!，并获得为期14年的 #Y 《苏丹天文历表》与精密星算#! 修正。"
 oe_v47_act_sam_artillery_academy: "创办撒马尔罕弹道与重炮学院"
 oe_v47_act_sam_artillery_academy_desc: "汇聚大天文台数学家、青铜铸炮巨匠与火药化学师，以精密弹道算学锻造震慑草原与波斯的近代化重炮兵团。"
 oe_v47_act_sam_artillery_academy_tt: "撒马尔罕科学指数 #G +11#!、帖木儿凝聚力 #G +5#!、陆军传统 #G +6#!，并获得为期14年的 #Y 撒马尔罕弹道算学与重炮学院#! 修正。"
 oe_v47_act_sam_silk_caravanserai: "扩建丝绸之路官办商队驿馆网"
 oe_v47_act_sam_silk_caravanserai_desc: "在撒马尔罕、布哈拉、赫拉特与喀什噶尔之间兴建石砌商队驿堡、蓄水池与官办税关，令陆上丝路车水马龙、生生不息。"
 oe_v47_act_sam_silk_caravanserai_tt: "帖木儿凝聚力 #G +9#!、撒马尔罕科学指数 #G +5#!，并获得为期12年的 #Y 丝绸之路官办商队驿馆网#! 修正。"
 oe_v47_act_sam_patronize_madrasa: "资助雷吉斯坦与赫拉特博学宫廷圈"
 oe_v47_act_sam_patronize_madrasa_desc: "以皇家瓦克夫基金长期赡养阿里·库什吉天文学派、波斯史家、青瓷建筑师与赫拉特细密画院，铸就东方的文艺复兴心脏。"
 oe_v47_act_sam_patronize_madrasa_tt: "撒马尔罕科学指数 #G +10#!、帖木儿凝聚力 #G +6#!、威望 #G +8#!，并获得为期14年的 #Y 雷吉斯坦与赫拉特博学宫廷圈#! 修正。"
 oe_v47_act_sam_reconcile_mirzas: "召开帖木儿诸王公宫廷和解大会"
 oe_v47_act_sam_reconcile_mirzas_desc: "召集河中与赫拉特诸位米尔扎、察合台异姓异部贵族及波斯文官共赴撒马尔罕订立宗室盟约，化解1449年式的宫廷政变与内战危机。"
 oe_v47_act_sam_reconcile_mirzas_tt: "帖木儿凝聚力 #G +13#!、稳定度 #G +5#!，并获得为期14年的 #Y 帖木儿诸王公宫廷和解盟约#! 修正。"
 oe_v47_ref_mamluk_red_sea_admiralty: "红海苏伊士海军总署"
 oe_v47_ref_mamluk_red_sea_admiralty_desc: "设立统辖苏伊士运河船闸、地中海—红海造船厂与印度洋重炮舰队的常设海军迪万总署，将传统骑射苏丹国蜕变为横跨两海的香料海权强国，但常年舰队维保高昂并触怒传统领地埃米尔。"
 oe_v47_ref_samarkand_observatory_court: "撒马尔罕天文经学院"
 oe_v47_ref_samarkand_observatory_court_desc: "将兀鲁伯大天文台与雷吉斯坦经学院升格为直属汗庭的国家科学院，贯通球面三角算学、精密星历与重炮弹道冶金，令科研、识字率与炮兵威力齐头并进，却招致守旧教士抵触并推高宫廷经费。"
 oe_v47_ref_andalusian_convivencia: "新科尔多瓦共荣宪章"
 oe_v47_ref_andalusian_convivencia_desc: "在伊比利亚与马格里布复兴昔日科尔多瓦与格拉纳达的多元共荣法制，保护不同信仰的学者、医师、手艺人与跨海商帮在联合商事法庭共生共荣，极大提升宽容、科研与海贸，却放缓改宗速度并激怒强硬教士。"
 oe_v47_ref_three_crowns_crusade_council: "多瑙—博斯普鲁斯圣战议会"
 oe_v47_ref_three_crowns_crusade_council_desc: "将瓦尔纳十字军大捷后的联合战时议会制度化，统筹匈牙利、波兰、波希米亚与巴尔干诸基督教王冠的常备兵站、重炮围城与同盟外交，战力与声望卓著，但军费高昂且加剧异教行省摩擦。"
 oe_v47_eu2.1.title: "苏丹坎苏赫·古里的红海枢密御前议"
 oe_v47_eu2.1.desc: "来自卡利卡特、亚丁与亚历山大的十万火急密报接连飞抵开罗城堡：武装到牙齿的葡萄牙克拉克巨舰已绕过好望角，在阿拉伯海炮击季风商船，企图彻底掐断养活开罗国库与威尼斯大商船的红海香料命脉。苏丹坎苏赫·古里召集军政埃米尔、卡里米大商帮首领与威尼斯密使，在铺满苏伊士地峡古图的御案前彻夜商议。若埃及只守着沙漠故步自封，亚历山大的海关终将枯竭；唯有重掘古法老通海大运河并打造重炮红海舰队，方能将印度洋与地中海的黄金命脉牢牢攥在手中。"
 oe_v47_eu2.1.a: "采纳宏大蓝图：与威尼斯秘密结盟，同步启动苏伊士运河与红海重炮舰队计划。"
 oe_v47_eu2.1.b: "当务之急乃制海权：优先扩建吉达与亚丁炮台，火速编组红海远征水师。"
 oe_v47_eu2.1.c: "谨防劳民伤财：暂缓冒险造船与开河，转而整顿埃及与叙利亚陆路关税以充府库。"
 oe_v47_eu2.2.title: "威尼斯兵工厂的松木与青铜重炮秘运"
 oe_v47_eu2.2.desc: "富庶的埃及坐拥尼罗河粮仓与滚滚金币，却独缺建造远洋重炮战舰所需的笔直橡木与桅杆松材。同样面临里斯本新航路生死威胁的威尼斯元老院，遂在亚历山大港向我方抛出惊天密约：由威尼斯著名的兵工厂预制达尔马提亚船肋、沥青缆索与重型青铜长管炮，并秘密派遣资深船匠随船运抵罗塞塔，再经尼罗河驳船与骆驼商队昼夜接力运往苏伊士船坞装配下水。尽管教廷密探已风闻此事并扬言谴责，但面对共同的海贸生死劫，威尼斯与开罗的利益从未如此紧紧相连。"
 oe_v47_eu2.2.a: "签署亚历山大造船与火炮密约，重金延请威尼斯船匠扩建苏伊士船坞。"
 oe_v47_eu2.2.b: "以重金买断全套木料与铜炮图纸，同时令本国工匠跟班学艺以防受制于人。"
 oe_v47_eu2.2.c: "谢绝威尼斯中间商，改由黎巴嫩与西里西亚山林自采雪松木以保自主。"
 oe_v47_eu2.3.title: "胡赛因·库尔迪与苏伊士重炮舰队誓师出征"
 oe_v47_eu2.3.desc: "在苏伊士与吉达炽热的沙岸码头上，红海千年来从未见过的壮观阵仗在晨潮中列队待发：一列按地中海战舰规格精造的重型桨帆炮舰与高舷大帆船昂首破浪，船艏架满黄铜重炮，两翼簇拥着满载黎凡特水手与披甲马穆鲁克火枪手的敏捷阿拉伯帆船。大将胡赛因·库尔迪立于旗舰舰桥，只待苏丹一声令下，便将趁季风东出曼德海峡，直趋印度焦尔与第乌港与古吉拉特、卡利卡特水师会师。船舱中每一枚铸铁实心弹，都承载着欧亚旧商路的生死兴衰。"
 oe_v47_eu2.3.a: "授予胡赛因海战全权并倍增火药与青铜重炮配给，务求一战定鼎阿拉伯海。"
 oe_v47_eu2.3.b: "稳扎稳打：留半数战舰驻守曼德海峡与吉达，以确保红海腹地万无一失。"
 oe_v47_eu2.3.c: "避免与大西洋巨舰正面硬拼，改派轻快拉丁帆战船开展游击破交战。"
 oe_v47_eu2.4.title: "第乌海战大逆转：印度洋海权的十字路口"
 oe_v47_eu2.4.desc: "第乌岛坚固石堡外的碧蓝海面上炮声震天，高悬红十字巨帆的葡萄牙总督主力舰队正顺风压向马穆鲁克、古吉拉特与卡利卡特三国联合水师。在原本的历史轨迹中，指挥分歧与弹药告罄令联军功败垂成；但此刻，凭借威尼斯工艺铸造的重型舰炮、古吉拉特守将马利克·阿亚兹岸防炮台的精准齐射，以及灵活穿插的桨帆包抄编队，红海—印度洋联军终于迎来了在公海重创大西洋入侵者的绝佳契机。这一战的胜负，将决定未来百年印度洋与地中海谁主沉浮！"
 oe_v47_eu2.4.a: "岸炮与重炮战舰协同交叉火力全开，趁风向逆转一举击溃葡萄牙主力舰队！"
 oe_v47_eu2.4.b: "下令接舷夺船：生擒受损的葡萄牙克拉克帆船，彻底仿制大西洋深海船体工艺。"
 oe_v47_eu2.4.c: "见好就收：在战场威慑下迫使对方缔结海权分界协定，各守果阿与红海航道。"
 oe_v47_eu2.5.title: "重掘古法老通海大运河：连接尼罗河与红海"
 oe_v47_eu2.5.desc: "深入图米拉特干谷实地勘测的埃及水利官与威尼斯工程师带回了振奋人心的发现：从尼罗河三角洲东支经蒂姆萨赫湖与大苦湖直抵苏伊士湾的古法老—哈里发大运河石砌堤岸遗迹依然清晰可辨。只要沿古老低地疏浚泥沙、拓宽河槽并以巨石加固护坡，满载香料、铜炮与丝绸的远洋货船便无需再于沙漠中卸货驼运，可直接自亚历山大溯尼罗河而上，穿大苦湖直航红海与印度洋！这项足以媲美金字塔的旷世土木工程，正等待御笔朱批。"
 oe_v47_eu2.5.a: "倾国库之力并征集全国水利工匠，按可通大型商船与炮舰的规格全线深挖运河。"
 oe_v47_eu2.5.b: "免除苛酷徭役，改发运河过境税债券并高薪雇佣自由匠人稳步分段施工。"
 oe_v47_eu2.5.c: "放弃高风险大运河，改为铺筑开罗至苏伊士的高速石板马车大道与重兵驿堡。"
 oe_v47_eu2.6.title: "大苦湖潮汐船闸与尼罗河水位之争"
 oe_v47_eu2.6.desc: "苏伊士大运河掘进过半之际，一阵源自古典典籍的恐慌席卷工地：古希腊地理学家曾警告红海大潮水位高于尼罗河三角洲，若贸然掘通地峡，咸苦海水恐将倒灌并毁掉下埃及万顷良田。危急关头，熟谙伦巴第多级人字闸门技艺的威尼斯水利师与埃及尼罗尺测量官联手拿出解方：依托大苦湖天然蓄水盆地构筑三道巨型石灰岩船闸，既可彻底消弭潮汐落差、阻隔海水倒灌，又能借尼罗河汛期淡水冲刷淤沙。这项精妙设计需要加拨重金与数月严密测绘。"
 oe_v47_eu2.6.a: "不惜工本建造大苦湖三级人字石砌船闸，彻底攻克两海潮差与咸水倒灌难题！"
 oe_v47_eu2.6.b: "采取稳妥折中方案：按尼罗河汛期水文建造季节性双闸池，严保农田水利安全。"
 oe_v47_eu2.6.c: "畏惧海水倒灌之患：在最后一道沙脊保留陆上滚木拖船道，停止直通掘进。"
 oe_v47_eu2.7.title: "卡里米香料大商帮与古吉拉特商站复兴"
 oe_v47_eu2.7.desc: "数十年来，王室苛刻的胡椒强购专卖令曾富可敌国的开罗卡里米大商帮元气大伤，迫使无数商贾将白银窖藏地下。如今，为避开葡萄牙海盗劫掠而云集苏伊士与吉达的古吉拉特棉布大商与也门咖啡经纪人亟需稳健信贷，卡里米商帮元老遂联名向苏丹请愿：只要朝廷废除武断的官价征购，商帮愿立刻重开跨海汇票清算，出资组建联合武装香料船队、担保海运保险，并向红海海军总署提供源源不断的低息战时信贷。"
 oe_v47_eu2.7.a: "恢复卡里米商帮自治与汇票信用，特许埃及—古吉拉特联合商站自由运营。"
 oe_v47_eu2.7.b: "官督商办：组建王室与卡里米各占半股的红海香料银行，平分转口厚利。"
 oe_v47_eu2.7.c: "坚持王室绝对专卖权，拒绝向大商帮让渡一丝财政权柄。"
 oe_v47_eu2.8.title: "开罗—亚历山大香料交易所空前盛世"
 oe_v47_eu2.8.desc: "在开罗汗哈利利拱廊大市与亚历山大港阳光灿烂的石砌码头上，马拉巴尔黑胡椒、马鲁古丁香、班达肉豆蔻与也门摩卡咖啡的馥郁芬芳弥漫全城。随着苏伊士水运日畅，威尼斯、热那亚、佛罗伦萨与拉古萨的金币如洪流般涌上大理石清算案——经红海直抵地中海的香料比绕行好望角风暴航线的货物早到足足半年，成色更鲜、成本更低！财政大臣齐声进言：趁此千载难逢的盛景，当立即立法将开罗—亚历山大香料交易所铸成欧亚金融心脏。"
 oe_v47_eu2.8.a: "立法确立开罗—亚历山大香料期货清算与官定衡器标准，吸引全欧金银汇聚。"
 oe_v47_eu2.8.b: "将暴涨的海关盈余全数反哺苏伊士石砌船闸与红海干船坞扩建工程。"
 oe_v47_eu2.8.c: "以巨额商税赏赐禁卫军士并大兴开罗清真寺与经学院，宣扬盛世威仪。"
 oe_v47_eu2.9.title: "葡萄牙舰队突袭索科特拉与曼德海峡咽喉"
 oe_v47_eu2.9.desc: "自亚丁烽火台直至吉达朝觐码头，警钟骤然长鸣：葡萄牙名将阿尔布克尔克率领一支精锐远洋舰队奇袭索科特拉岛，并悍然闯入曼德海峡咽喉，企图从外部死死封锁红海入口，焚毁所有驶向苏伊士的香料货船！虽然狭窄红海的逆风与暗礁令笨重的大西洋克拉克帆船举步维艰，但港内商贾已因保费暴涨而人心惶惶。若不能迅速加固“泪之门”两岸要塞并将敌舰驱回印度洋深海，我方苦心经营的红海霸业将面临窒息之危。"
 oe_v47_eu2.9.a: "在卡马兰岛、亚丁与吉达急筑重炮棱堡，并令红海主力舰队出击彻底逐退来犯敌舰！"
 oe_v47_eu2.9.b: "联合也门水师与红海两岸部族断绝敌舰淡水补给，以坚壁清野拖垮远道而来的舰队。"
 oe_v47_eu2.9.c: "避其锋芒：暂将高价香料改道霍尔木兹与巴士拉陆路转运，待敌舰季风退却再复航。"
 oe_v47_eu2.10.title: "卡利卡特扎莫林与马拉巴尔胡椒同盟"
 oe_v47_eu2.10.desc: "坐拥印度最富饶黑胡椒海岸的卡利卡特（科泽科德）扎莫林王特使，携精雕柚木宝匣与国书抵达苏伊士港。面对欧洲势力强行垄断马拉巴尔自由港的霸道行径，扎莫林提出缔结跨越阿拉伯海的永久《季风海洋同盟》：马拉巴尔船厂愿源源提供耐腐耐磨的顶级印度柚木船体与精悍的库恩贾利水师船长，而开罗与威尼斯方面则负责供应青铜火炮、足色白银与红海避风良港。两大文明海岸若能携手，大西洋来客将再无立足之地！"
 oe_v47_eu2.10.a: "正式缔结马拉巴尔—红海柚木与胡椒同盟，互派常驻海军领事与商馆护卫。"
 oe_v47_eu2.10.b: "重金向马拉巴尔船厂订造耐盐防蛀的柚木重型旗舰，专司苏伊士—印度直航。"
 oe_v47_eu2.10.c: "仅签通商互惠条约，避免为万里之外的印度海岸承担强制出兵义务。"
 oe_v47_eu2.11.title: "火器革新派与传统骑射埃米尔的正面交锋"
 oe_v47_eu2.11.desc: "振兴红海海权的青铜铸炮厂与海军炮术学堂，此刻却在开罗城堡内掀起了一场剧烈的政军风暴。经历过印度洋海战洗礼的少壮派将领与海军提督援引安纳托利亚与欧洲步炮协同的战例，痛陈单靠传统马穆鲁克重骑冲锋与长矛骑射，已绝难守住叙利亚边防与耗资巨大的苏伊士运河。然而骄傲的元老埃米尔们却按剑拍案，怒斥火绳枪与重炮乃有失骑士尊严的卑劣器物，实则畏惧常备火器新军彻底动摇其世袭特权。"
 oe_v47_eu2.11.a: "力排众议推行第五军团火器改革，成建制编练火绳枪步兵、野战炮队与海军陆战队！"
 oe_v47_eu2.11.b: "采取折中妥协：仅在红海海军总署与运河要塞普及火器，保留陆军传统骑兵尊荣。"
 oe_v47_eu2.11.c: "安抚保守贵族：维系传统骑士军制，仅在战时临时雇佣外籍炮手助战。"
 oe_v47_eu2.12.title: "两海合流大典：地中海与印度洋的黄金航门"
 oe_v47_eu2.12.desc: "号角齐鸣、定音鼓震天、岸防青铜巨炮鸣响礼炮，随着苏伊士新石砌码头最后一道木围堰缓缓开启，高悬绯金旌旗与威尼斯商徽的巨型桨帆炮舰平稳驶过大苦湖石砌船闸，昂首切入碧波万顷的红海！岸堤上，满身泥尘的埃及水利工匠、卡里米银行家、威尼斯领事与古吉拉特船长齐声欢呼。西方直到三百年后方才梦寐以求的跨海通衢，竟在文艺复兴时代于开罗与苏伊士之间提前化为现实——一座联结两海、辐射欧亚的伟大海权商贸帝国正冉冉升起！"
 oe_v47_eu2.12.a: "昭告天下两海大运河正式通航，确立苏伊士帝国海关与红海—印度洋海权霸业！"
 oe_v47_eu2.12.b: "设立开罗—威尼斯—卡利卡特常设联合海务委员会，永保两海航道和平繁荣。"
 oe_v47_eu2.12.c: "将船闸定为王室最高战略禁地，对所有过境船只征收高额通行金币以充实军备。"
 oe_v47_eu2.13.title: "兀鲁伯巨型大理石六分仪与《苏丹历表》问世"
 oe_v47_eu2.13.desc: "在撒马尔罕城外库哈克山丘高耸的青瓷穹顶之下，身为君主亦是旷世天文学家的兀鲁伯缓步走入深凿岩层的四十米巨型大理石六分仪轨道。借着正午穹顶孔洞投下的一缕细如刀锋的日光，他与首席弟子阿里·库什吉精测黄赤交角与恒星年长度，误差竟小至一分以内，一举超越同期欧洲、中华与阿拉伯世界的所有天文台！然而在辉煌的观象台外，嫉妒的宗室王公与守旧派已暗中窃语，指责沉迷星算的君王荒废了帖木儿铁骑的征伐威权。"
 oe_v47_eu2.13.a: "向欧亚诸国颁行《苏丹天文历表》，并设立永不裁撤的皇家天文与算学教授席位！"
 oe_v47_eu2.13.b: "令学者将精密三角算学立刻投入大炮弹道测距与全国田亩舆图测绘，以实效服众。"
 oe_v47_eu2.13.c: "低调将星表定性为校准祈祷与斋月时刻的宗教历书，以平息守旧教士的猜忌。"
 oe_v47_eu2.14.title: "粉碎1449年宫廷密谋：天文王的生死逆转"
 oe_v47_eu2.14.desc: "一封在撒马尔罕城门外被截获的密信，揭穿了直指王座心脏的惊天逆谋：心怀怨恨的王子阿卜杜·拉蒂夫已暗中勾结极端守旧托钵僧与失意察合台贵族，密谋在阿姆河畔伏击天文王兀鲁伯，夺取雷吉斯坦并彻底捣毁大天文台。中亚文明的命运此刻悬于一线——若忠于汗庭的撒马尔罕禁卫军与炮队能够抢在逆党集结铁骑之前雷霆出击，不仅可保住君王与学者的性命，更将令撒马尔罕文艺复兴冲破1449年的历史魔咒！"
 oe_v47_eu2.14.a: "先发制人！遣忠勇禁卫军与皇家炮兵连夜突袭逆党大营，彻底粉碎反动政变！"
 oe_v47_eu2.14.b: "分化瓦解：敕封巴尔赫为边疆重镇分藩，以政治妥协剥离王室逆党的军权根基。"
 oe_v47_eu2.14.c: "退让求全：将部分经学院教务交还守旧法学家，换取叛党放下武器。"
 oe_v47_eu2.15.title: "撒马尔罕与赫拉特诸米尔扎的宗室和解盟约"
 oe_v47_eu2.15.desc: "自帖木儿大帝辞世以来，突厥—蒙古传统诸子分封制留下的继承内战魔咒始终折磨着河中与呼罗珊：每一代掌管赫拉特、撒马尔罕、设拉子与喀布尔的王公总会在内耗中流尽鲜血，最终坐视草原游牧劲敌渔翁得利。在古尔-埃米尔陵寝金碧辉煌的马赛克穹顶下，波斯资深维齐尔与宗室元老呈上一份石破天惊的宪制方略：设立常设诸王公枢密院，确立撒马尔罕最高汗廷正统，同时赋予赫拉特与喀布尔世袭文化分藩与议政席位，一劳永逸终结骨肉相残。"
 oe_v47_eu2.15.a: "颁行《帖木儿诸王公盟约》，以成文法统将撒马尔罕、赫拉特与喀布尔凝为一体。"
 oe_v47_eu2.15.b: "彻底削藩改制：以受薪的波斯—突厥流官总督取代世袭王公食邑，大权独揽。"
 oe_v47_eu2.15.c: "恪守草原忽里勒台旧俗，仍以军功威望决断各支米尔扎的权位高下。"
 oe_v47_eu2.16.title: "撒马尔罕弹道算学与青铜重炮学院"
 oe_v47_eu2.16.desc: "在泽拉夫尚河畔的皇家工坊区，一场将纯数理算学与青铜冶金融为一炉的军事革命正悄然爆发。精通兀鲁伯精密象限仪的天文学者，与来自叙利亚、安纳托利亚及丝路东端的铸炮巨匠携手合作，首次试验标准颗粒化黑火药、带刻度的炮膛仰角标尺与整体浇铸的重型攻城青铜炮。在撒马尔罕郊外靶场，仅凭算表校准的三轮齐射便在两倍常规射程外精准轰塌砖石模拟堡垒——中亚的数学家们向世人证明，笔尖下的三角公式同样能锻造出世间最骇人的雷霆炮火！"
 oe_v47_eu2.16.a: "重金设立撒马尔罕皇家弹道算学与重炮学院，批量装备精密刻度青铜火炮。"
 oe_v47_eu2.16.b: "因地制宜：优先研制便于绿洲与草原疾行的骆驼驮载回旋轻炮与火绳枪队。"
 oe_v47_eu2.16.c: "将多余的青铜铸炮工艺与半成品高价售予周边诸国，迅速回笼白银国库。"
 oe_v47_eu2.17.title: "阿里·库什吉与行星自转学说的科学突破"
 oe_v47_eu2.17.desc: "在雷吉斯坦经学院流光溢彩的青瓷讲堂内，兀鲁伯最为器重的天文学巨擘阿里·库什吉面对来自君士坦丁堡、大不里士与德里的学者与使节，展开一卷绘满水星与地球几何轨迹的羊皮图谱。他掷地有声地宣告：天文学必须彻底摆脱僵化的亚里士多德哲学教条，唯有实测数据与纯粹数学推演方为真理之尺，甚至大胆推论地球自转与一切实测天象并无矛盾！若汗庭敢于庇护这一石破天惊的实证学派，欧亚大陆的近代科学革命将比欧洲提前整整一个世纪在撒马尔罕破晓。"
 oe_v47_eu2.17.a: "颁赐皇家护学敕令力挺阿里·库什吉实证学派，广邀欧亚数理名家来此公开辩难！"
 oe_v47_eu2.17.b: "采取温和策略：先在宫廷司天监与各国使节圈内精印流布，避免引发教派论战。"
 oe_v47_eu2.17.c: "为稳固宗教界人心，下令限制关于地球自转的激进猜想，仅保留历法算表。"
 oe_v47_eu2.18.title: "黄金之路：贯通中亚的官办商队驿馆网络"
 oe_v47_eu2.18.desc: "纵使西方航海家正尝试绕行大洋，欧亚大陆跳动的腹地动脉依然奔涌在通往撒马尔罕的黄金丝路上。满载大明青花瓷、布哈拉彩绸、巴达赫尚青金石与呼罗珊精钢的双峰驼队日夜汇聚于撒马尔罕穹顶大巴扎——前提是沿途匪患与层层私卡不致令商旅绝迹。帝国驿传总管呈上宏图：自喀什噶尔经撒马尔罕、赫拉特直至大不里士，每隔一日马程便筑起一座配备蓄水穹池、钱庄与官兵护卫的石砌大商队驿堡，以陆路极速安全之利抗衡远洋海运。"
 oe_v47_eu2.18.a: "全线兴建官办石砌商队驿馆网，并推行皇家商路失窃赔付制以招徕天下商贾！"
 oe_v47_eu2.18.b: "在撒马尔罕划设免税外商坊市，优待来自中华、印度与黎凡特的大商帮常驻互市。"
 oe_v47_eu2.18.c: "趁商路繁忙在阿姆河渡口加征过境抽税，优先充实当季军政急需的国库现银。"
 oe_v47_eu2.19.title: "撒马尔罕水力精造麻纸与欧亚典籍流布"
 oe_v47_eu2.19.desc: "在环绕撒马尔罕城的湍急水渠两岸，数十座巨型水轮日夜驱动木碓，将桑皮与麻布精捣成享誉欧亚的顶级撒马尔罕光润麻纸——自开罗、佛罗伦萨直至阿格拉与北京，无不以得一页撒马尔罕名纸为荣。如今，造纸大匠与雕版刻工联名上奏，请求扩建皇家水力造纸与刊书坊，成批印制波斯语、察合台突厥语与阿拉伯语三语对照的代数、医典、天文与炮兵实操课本，让帝国的书香与近代行政识字率迅速漫溢全境。"
 oe_v47_eu2.19.a: "特许兴办撒马尔罕水力造纸与三语科学刊书坊，令实用典籍与算学课本广传四方。"
 oe_v47_eu2.19.b: "主打高端奢华路线，向欧亚各国宫廷高价出口泥金撒马尔罕名纸与精装抄本。"
 oe_v47_eu2.19.c: "严控典籍与炮术图谱外流，仅限宫廷秘阁内部抄录以防机密落入敌国之手。"
 oe_v47_eu2.20.title: "钦察草原铁骑与河中车营重炮的世纪决战"
 oe_v47_eu2.20.desc: "北方锡尔河畔黄尘蔽日，数以万计的钦察—乌兹别克草原轻骑与弓骑正集结于绿洲边缘，虎视眈眈企图席卷富庶的河中果园与名城。在旧日战法下，传统帖木儿骑兵在开阔草原上屡屡陷入游牧大军的迂回包围；然而此刻，撒马尔罕兵学与弹道学者已综合安纳托利亚与波希米亚车营精髓，研制出以粗铁链相连、架满青铜鹰炮与火绳枪手的移动战车堡垒。只要在北疆正面列成钢铁火网，便能将不可一世的草原狂飙彻底碾碎于硝烟之中！"
 oe_v47_eu2.20.a: "全军列装铁链重炮车营与火绳枪齐射阵法，以近代火力正面粉碎草原铁骑攻势！"
 oe_v47_eu2.20.b: "刚柔并济：加固锡尔河渡口堡垒，同时以撒马尔罕白银分化招抚友好的草原部族。"
 oe_v47_eu2.20.c: "以骑制骑：依托察合台重甲长矛骑兵与马弓手出塞迎击，不改先祖游牧战风。"
 oe_v47_eu2.21.title: "红头军东进与呼罗珊的教派炮火交锋"
 oe_v47_eu2.21.desc: "在辽阔的伊朗高原上，头戴绯红缠头的萨法维红头军与崛起的土库曼强藩正以大不里士与伊斯法罕为根基缔造狂热新朝，并将凌厉兵锋直指呼罗珊明珠赫拉特与梅尔夫丝路重镇。炽烈的教派热情与近代火药国力在呼罗珊广袤的黄沙原野上迎头相撞。我朝究竟应当凭借撒马尔罕压倒性的重炮与车营火力西出定鼎伊朗，还是以波斯文教纽带促成东西两大宫廷的划界和解，都将彻底改写整个伊斯兰东方的百年版图！"
 oe_v47_eu2.21.a: "挥师西进！调遣撒马尔罕重炮兵团决战梅尔夫与赫拉特，誓保呼罗珊门户不失！"
 oe_v47_eu2.21.b: "以共同的波斯文教传统为桥，缔结呼罗珊通商与学者互访协定，化干戈为玉帛。"
 oe_v47_eu2.21.c: "收缩防线：沿阿姆河构筑纵深堡垒群，保存精锐主力以固河中核心腹地。"
 oe_v47_eu2.22.title: "赫拉特宫廷画院与比赫扎德的细密画黄金时代"
 oe_v47_eu2.22.desc: "自巴格达全盛与佛罗伦萨文艺复兴以来，从未有一座宫廷能汇聚如此璀璨的群星：在赫拉特柏树林立的御花园与撒马尔罕流彩琉璃门廊下，旷世画圣比赫扎德为细密画注入前所未有的生动神韵，诗坛巨擘阿里·希尔·纳沃伊更将察合台突厥语与古典波斯语共同推上文学巅峰，建筑巨匠则雕琢出令四海赞叹的肋拱青瓷穹顶。慷慨资助这场与天文科学交相辉映的艺术大潮，必令我朝声威远播欧亚大陆每一个角落。"
 oe_v47_eu2.22.a: "重金扩建赫拉特与撒马尔罕皇家书画院，礼赞比赫扎德与纳沃伊的艺术高峰！"
 oe_v47_eu2.22.b: "令细密画师与大天文台制图官携手合作，编绘图文并茂的欧亚天文地理巨典。"
 oe_v47_eu2.22.c: "节制宫廷雅玩赏赐，将盈余经费优先拨付给边境重镇与火器兵工厂。"
 oe_v47_eu2.23.title: "巴布尔的南方地平线：喀布尔与开伯尔山口之望"
 oe_v47_eu2.23.desc: "立于喀布尔清凉的群山果园之间，年轻睿智的帖木儿宗室才俊巴布尔正越过蜿蜒险峻的开伯尔山口，极目眺望雾霭中丰饶富庶的旁遮普与印度斯坦大平原。在原本的历史里，失去故土撒马尔罕的流亡迫使他孤注一掷南下；但在此番欣欣向荣的撒马尔罕文艺复兴时代，手握精密青铜重炮、火绳枪车营与波斯文官体系的强盛中亚帝国，既可顺势挥师南下问鼎德里，亦可凭兴都库什商道将阿姆河与恒河连成史无前例的跨洲商贸共荣圈！"
 oe_v47_eu2.23.a: "精锐尽出！以撒马尔罕重炮与火铳武装巴布尔先锋军，自喀布尔俯瞰印度斯坦！"
 oe_v47_eu2.23.b: "将喀布尔打造为中亚—印度大宗商贸枢纽，以和平通商吸纳恒河平原的绵帛与黄金。"
 oe_v47_eu2.23.c: "将巴布尔等宗室干才召回河中腹地，全力巩固撒马尔罕根本与天文兵学重镇。"
 oe_v47_eu2.24.title: "欧亚子午线：撒马尔罕科学—火药黄金时代加冕"
 oe_v47_eu2.24.desc: "来自威尼斯、开罗、君士坦丁堡、阿格拉与北京的使节学者云集在雷吉斯坦广场璀璨的青瓷宣礼塔下，共同见证欧亚大陆前所未有的文明奇迹：冲破1449年暗夜存续至今的兀鲁伯大天文台，已扩建为集黄铜星盘、精密机械钟、水力刊书坊与皇家弹道炮术院于一体的超级科学殿堂，其测定的子午线成为从地中海到黄海各国舆图的共同基准！昔日天文王脆弱的理想，终于在中亚腹地绽放为贯通科学、丝路商贸与近代火药强权的灿烂黄金时代。"
 oe_v47_eu2.24.a: "昭告四海确立撒马尔罕基准子午线与欧亚科学院，加冕科学—火药黄金时代！"
 oe_v47_eu2.24.b: "借盛世威望在阿姆河至兴都库什全境统一火药配比、铸币成色与国家度量衡。"
 oe_v47_eu2.24.c: "向开罗、欧洲与印度广派撒马尔罕学术使团，以精密历法与星算赢得万邦敬仰。"
 oe_v47_mod_venetian_timber_convoy: "威尼斯造船松木与青铜炮船队"
 STATIC_MODIFIER_NAME_oe_v47_mod_venetian_timber_convoy: "威尼斯造船松木与青铜炮船队"
 STATIC_MODIFIER_DESC_oe_v47_mod_venetian_timber_convoy: "达尔马提亚橡木、船用缆索与威尼斯青铜炮匠源源运抵红海船坞，大幅提升战舰战力与建船效率，但须向亚得里亚海商团让渡部分税利。"
 oe_v47_mod_pharaonic_canal_works: "法老—马穆鲁克苏伊士大运河工程"
 STATIC_MODIFIER_NAME_oe_v47_mod_pharaonic_canal_works: "法老—马穆鲁克苏伊士大运河工程"
 STATIC_MODIFIER_DESC_oe_v47_mod_pharaonic_canal_works: "数万名水利工程师、石匠与民夫沿古法老河道疏浚大苦湖并筑起潮汐船闸，推动沿岸繁荣与发展，却令民间劳役与工程养护开支骤增。"
 oe_v47_mod_red_sea_armada: "红海重炮主力舰队"
 STATIC_MODIFIER_NAME_oe_v47_mod_red_sea_armada: "红海重炮主力舰队"
 STATIC_MODIFIER_DESC_oe_v47_mod_red_sea_armada: "配备重型舰首青铜火炮的地中海式大型炮舰纵横苏伊士至第乌航道，海战火力与士气凌厉无双，但海军常年维护费颇为沉重。"
 oe_v47_mod_cairo_spice_bourse: "开罗—亚历山大香料交易所"
 STATIC_MODIFIER_NAME_oe_v47_mod_cairo_spice_bourse: "开罗—亚历山大香料交易所"
 STATIC_MODIFIER_DESC_oe_v47_mod_cairo_spice_bourse: "统一清算胡椒、丁香与肉桂期货的超级交易所将卡里米商帮、威尼斯与古吉拉特商站连为一体，海贸与商力大增，但王室直辖权势相对分薄。"
