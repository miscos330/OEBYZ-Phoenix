# NEW 2026-11-22 v17.0 Across Eras & Symphonies — Module 17.0-C1: Africa & Americas Finale Units, Events & Modifiers Localization (simp_chinese) (oe_aa2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v170_africa_americas.py; edit the generator, not this file.
 oe_aa2_mali_sofa_cavalry:0 "马里—桑海索法重甲骑兵"
 oe_aa2_mali_sofa_cavalry_desc:0 "萨赫勒帝国御林精锐重装骑兵，披挂棉甲与锁子甲，擅长在尼日尔河草原与商道沙原发动雷霆冲击。"
 oe_aa2_kilwa_dhow:0 "斯瓦希里基尔瓦武装三角帆船"
 oe_aa2_kilwa_dhow_desc:0 "以东非硬木缝合龙骨并装备青铜回旋炮的斯瓦希里武装三角帆战船，凭季风航速称雄沿岸水道与印度洋航线。"
 oe_aa2_iroquois_forest_rangers:0 "易洛魁林地游骑火枪兵"
 oe_aa2_iroquois_forest_rangers_desc:0 "融合林地潜行斥候传统与精良燧发火枪的易洛魁轻步兵，善在密林丘陵间以精准齐射与机动伏击重创敌阵。"
 oe_aa2_maya_holkan_warriors:0 "玛雅霍尔坎贵族步兵"
 oe_aa2_maya_holkan_warriors_desc:0 "尤卡坦与佩滕城邦久经沙场的职业霍尔坎贵族战团，身披盐水浸硬棉甲，手持黑曜石重刃，精于热带丛林近战攻坚。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev1_a:0 "黄金朝觐盛世礼遇"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev1_a:0 "雄厚黄金储备与宽宏宫廷礼遇吸引跨撒哈拉建筑师、法学家与驼队大商云集尼日尔河畔。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev1_b:0 "镀金索法禁军整备"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev1_b:0 "王家黄金专款采买棉铁马铠、北非良马并充实尼日尔河上游军粮仓廪。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev2_a:0 "桑科雷抄经与藏书盛况"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev2_a:0 "受王室资助的抄写师与装帧工匠将廷巴克图铸就为萨赫勒学术与识字文教的璀璨灯塔。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev2_b:0 "桑科雷行省司法网"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev2_b:0 "出自廷巴克图讲堂的法官们在各行省统一商约律例、裁断田土纠纷，令帝国政令通达无阻。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev3_a:0 "阿斯基亚帝国行省制"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev3_a:0 "专司农政、河运与税赋的王廷各司将广袤的尼日尔诸省牢牢统合于高效中枢之下。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev3_b:0 "万加拉商帮自治特许"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev3_b:0 "获得自治特许的万加拉与朱拉大商号广通票汇信用，令商税丰沛而市镇欣欣向荣。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev4_a:0 "希科伊尼日尔河水师"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev4_a:0 "常备巡河战船令帝国军团沿尼日尔河湾疾驰转进，既可侧击草原游骑，又能严守河关厘金。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev4_b:0 "尼日尔河漕运粮船"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev4_b:0 "成群商驳常年将内陆三角洲的稻米、小米与可乐果源源输往廷巴克图与加奥市场。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev5_a:0 "萨赫勒火药军改"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev5_a:0 "王家兵仗局经大西洋与的黎波里商路购入火枪并仿制硝药，将萨赫勒机动与排枪齐射融为一体。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev5_b:0 "撒哈拉水井坚壁防线"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev5_b:0 "重兵把守绿洲堡垒并派出轻骑袭扰补给，令跨沙来犯之敌尚未抵河便已师老兵疲。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev6_a:0 "帝国金盐官运专卖"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev6_a:0 "官军护航的阿扎莱运盐巨队以沙漠岩盐直易冲积沙金，使帝国府库岁入大增。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev6_b:0 "萨赫勒—大西洋双轨商汇"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev6_b:0 "将内陆驼队货栈与大西洋沿岸商站平等衔接，使西非工坊源源吸纳近代铁器、火药与商汇制度。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev7_a:0 "胡苏尼库布瓦盛殿威仪"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev7_a:0 "巍峨珊瑚石大殿与保税货栈引得印度洋各国使节与船主纷至沓来，威仪远扬。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev7_b:0 "基尔瓦苏丹通宝币制"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev7_b:0 "成色统一的斯瓦希里铸币通行于索法拉至拉穆诸港，极大活络海市贸易并充实关税。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev8_a:0 "季风星盘武装帆船公会"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev8_a:0 "武装三角帆战船与老练星盘舵师巡弋珊瑚水道，令斯瓦希里海上威权远及重洋。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev8_b:0 "印度洋季风常驻商馆"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev8_b:0 "常驻海外的斯瓦希里商馆代办平抑季风换季价差，直通香料、棉布与瓷器大市。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev9_a:0 "索法拉金象牙专运"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev9_a:0 "严密守卫的沿海金栈与高原诸邦睦邻商约确保黄金与象牙源源不断汇入王库。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev9_b:0 "斯瓦希里珊瑚石造船坞"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev9_b:0 "扩建的硬木船坞与珊瑚石滑道大幅加快战商船下水，并培育大批熟谙季风的水手。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev10_a:0 "斯瓦希里反舰炮台与炮船"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev10_a:0 "吃水浅、航速快的火炮三角帆船与珊瑚石海防要塞依托暗礁水道痛击笨重外洋战舰。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev10_b:0 "反卡塔兹季风海盟"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev10_b:0 "精干使节串联东非诸城与红海、印度香料港共享水师情报与铸炮匠师，共破封锁。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev11_a:0 "斯瓦希里石城海事联邦"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev11_a:0 "共享海港宪章、统一水师旗号与联合商事法庭令东非诸港声气相通、共荣共盛。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev11_b:0 "斯瓦希里王家海关总署"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev11_b:0 "王家港口监督官自帕泰至索法拉划一税率，将丰沛关税直接化为常备远洋舰队军费。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev12_a:0 "西印度洋季风海权"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev12_a:0 "莫桑比克海峡与索马里海域无与伦比的舰队投送力牢牢锁住东非黄金与香料动脉。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev12_b:0 "三大洲珊瑚石贸易总汇"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev12_b:0 "开放货栈清算、海运保险公会与万国商坊令斯瓦希里海岸跃升为举世不可或缺的金融商枢。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev13_a:0 "王家青铜与象牙御用行会"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev13_a:0 "传世青铜浮雕、象牙礼器与精织拉菲亚锦缎令王室声誉蜚声海外，畅销万邦。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev13_b:0 "赤道王国巨型城垣工事"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev13_b:0 "纵横交错的环城巨壕与密林王道将都城营造成固若金汤的赤道雄城。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev14_a:0 "大西洋平等国使互派"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev14_a:0 "博学王室使臣以平等主权君主之礼周旋欧洲列朝，携回活字印机、航海图志与新学典籍。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev14_b:0 "严管口岸主权商约"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev14_b:0 "外洋商船仅准停靠王家指定河港并接受官吏核税，既得通商之利又保国体安稳。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev15_a:0 "王家赤道火枪亲军"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev15_a:0 "精练常备火枪亲军与本土铁匠修械坊相辅相成，足以震慑外寇觊觎与藩镇异心。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev15_b:0 "王室火药专卖管制"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev15_b:0 "凡进口火药与铜炮一律归王家税关统购统配，杜绝豪强私藏军火并充实王库。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev16_a:0 "王室禁奴主权敕令"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev16_a:0 "王家缉私官登船搜检、释放被掠良民并驱逐贩奴恶商，护佑人口根基与道德威望。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev16_b:0 "赤道物产兴商转型"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev16_b:0 "将外洋采购引导至胡椒、拉菲亚织布、铜锭与蜂蜡，铸就健康持久的正当远洋贸易。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev17_a:0 "赤道内河商市联运网"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev17_a:0 "沿河官设独木舟驿站与津渡木桥将广袤雨林诸省连为一体，商贸与地方开发齐头并进。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev17_b:0 "赤道冶铜锻铁与织布工坊"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev17_b:0 "本土铁铜冶师与织布工坊源源产出精良农具与布匹，大幅减少对西洋舶来品的依赖。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev18_a:0 "赤道宪政与学术复兴"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev18_a:0 "成文宪政法典、多语外交档案馆与格致工学院为赤道王国注入绵延百年的制度活力。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev18_b:0 "大西洋海防要塞与自主船队"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev18_b:0 "近代石砌海防堡垒与自主远洋商战船队将中西非主权国威远播南大西洋。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev19_a:0 "大和平树五部圣约"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev19_a:0 "《大和平法》以联邦和睦终结血仇内耗，令部族凝聚力、外交清誉与生聚元气蒸蒸日上。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev19_b:0 "五箭齐心军事同盟"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev19_b:0 "五箭束于一处则坚不可折；各部战酋统一号令，林地劲旅协同作战威震四邻。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev20_a:0 "奥农达加联邦共识政体"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev20_a:0 "氏族主母监督与一致表决机制杜绝专权内讧，使长屋各邦秩序井然、民心归附。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev20_b:0 "贝珠档案与雄辩使团"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev20_b:0 "专职贝珠典藏官逐字铭记历次盟约，令易洛魁外交雄辩术威名远播北美大陆。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev21_a:0 "林地火枪游骑对等战力"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev21_a:0 "易洛魁神射手精熟林间快装齐射与散兵伏击，在茂林山地间令欧洲正规军望风披靡。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev21_b:0 "多口岸毛皮竞价商权"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev21_b:0 "借沿海诸洋商互相竞争抬高毛皮收价，长屋商队大获盈余并牢握外交主动权。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev22_a:0 "五大湖转运水道霸权"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev22_a:0 "迅捷独木舟突击队与林地火枪手尽控尼亚加拉至底特律水陆要津，令北方毛皮悉数经奥农达加集散。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev22_b:0 "广延梁木部族融合"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev22_b:0 "依循长屋纳新古礼接纳周边部民为平等成员，迅速恢复村社人口与玉米三姐妹农田生机。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev23_a:0 "璀璨白银盟链主权"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev23_a:0 "正式主权条约保障、中立通商走廊与列强外交承认牢牢护佑易洛魁疆域不受侵犯。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev23_b:0 "长屋堡寨与枪械工坊"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev23_b:0 "棱堡式木石要寨与本土修枪铸弹工坊令五部本土成为任何殖民军团皆难逾越的铜墙铁壁。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev24_a:0 "龟岛联邦成文宪政"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev24_a:0 "双语印刷的联邦成文宪法、最高仲裁庭与国民学院令易洛魁成为东西半球瞩目的宪政典范。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev24_b:0 "五大湖自主实业与水师"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev24_b:0 "五大湖船坞、炼铁工场与高产农政将联邦铸就为屹立北美腹地的近代大陆强权。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev25_a:0 "中兴玛雅潘共治同盟"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev25_a:0 "城邦共治与诸族盟约弥合尤卡坦北部世仇，令半岛重归和平繁盛。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev25_b:0 "玛雅潘霍尔坎常备战团"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev25_b:0 "直属同盟大统帅的职业棉甲霍尔坎战团军纪森严，以长矛与黑曜石刃威定尤卡坦。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev26_a:0 "玛雅历算观象学院"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev26_a:0 "珍贵历算典籍、零位算术与精密天文学令玛雅文教昌明、声誉卓著。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev26_b:0 "圣井水利与历法农政"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev26_b:0 "将雨季历算、岩溶圣井蓄水与低地梯田巧妙结合，令尤卡坦玉米与蔬果连年丰登。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev27_a:0 "加勒比玛雅远航商舟"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev27_a:0 "图卢姆与埃卡布的珊瑚岸灯塔指引繁盛航线，将墨西哥湾盐场与南方可可园紧连一体。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev27_b:0 "玛雅潘可可翡翠官市"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev27_b:0 "官定衡器与市场判官严惩伪劣可可豆，大幅提振商税与手工业繁荣。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev28_a:0 "玛雅本草防疫体系"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev28_a:0 "祭司医师推行草药蒸汽浴、圣井洁水令与林间分散居住，大幅减轻跨洋疫病的人口浩劫。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev28_b:0 "钢刃火器霍尔坎精兵"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev28_b:0 "玛雅铁匠将缴获精钢长矛、刀剑与火绳枪融入丛林战术，以彼之矛痛击来犯征服者。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev29_a:0 "萨克贝丛林石堡防网"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev29_a:0 "环环相扣的石灰岩石堡与高效白石驰道将尤卡坦与佩滕化作令外敌丧胆的热带堡垒。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev29_b:0 "尤卡坦海崖火炮要塞"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev29_b:0 "扼守坎佩切与加勒比珊瑚礁岸的石灰岩炮台有效击退海盗与舰队袭扰，护佑玛雅商船。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev30_a:0 "玛雅第二黄金时代"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev30_a:0 "焕然一新的观象台、本草医学院与双语印书院令玛雅文明跻身世界学术前沿。"
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev30_b:0 "尤卡坦—佩滕主权联邦"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev30_b:0 "近代化加勒比船坞、丰饶梯田农庄与精锐守备军团令玛雅主权稳居墨西哥湾与加勒比海之巅。"
 oe_aa2.1.title:0 "曼萨·穆萨的黄金遗产"
 oe_aa2.1.desc:0 "从开罗到非斯的商队编年史仍在传颂曼萨·穆萨携万斤黄金朝觐震动地中海金市的传奇。尼日尔河畔的宫廷内，游吟史官与度支大臣正商议如何经略班布克与布雷金矿的滚滚财源。"
 oe_aa2.1.a:0 "维系王家金本位与四海礼聘"
 oe_aa2.1.b:0 "将黄金投入索法重骑禁军与粮仓"
 oe_aa2.2.title:0 "廷巴克图与桑科雷学派"
 oe_aa2.2.desc:0 "抵达廷巴克图的骆驼商队不仅满载沙漠岩盐，更带来了来自安达卢西亚与埃及的天文、医药、诗歌与法学抄本。桑科雷与津加里贝尔的泥砖讲堂内学子云集、书声琅琅。"
 oe_aa2.2.a:0 "重金资助桑科雷抄书院与藏书阁"
 oe_aa2.2.b:0 "派任桑科雷法学家出任各省卡迪法官"
 oe_aa2.3.title:0 "阿斯基亚行省改制与官僚新章"
 oe_aa2.3.desc:0 "随着萨赫勒疆土横跨大西洋水系与尼日尔大河湾，旧式氏族纳贡已难驾驭繁华商镇。改革派重臣提议改行支薪总督、统一度量衡并设立直属宫廷的度支巡察官。"
 oe_aa2.3.a:0 "推行阿斯基亚支薪行省与度量衡监察"
 oe_aa2.3.b:0 "特许跨撒哈拉商帮自治税关"
 oe_aa2.4.title:0 "尼日尔大河战舰水师"
 oe_aa2.4.desc:0 "蜿蜒千里穿过干旱草原的尼日尔河既是帝国命脉，亦是天然通衢。卡巴拉与加奥的造船匠人打造出宽大修长的战舟，可迅捷运载整支骑兵中队、军粮驳船与河岸弓手。"
 oe_aa2.4.a:0 "设立希科伊大河水师督府"
 oe_aa2.4.b:0 "扩建商运粮驳与沿岸河港码埠"
 oe_aa2.5.title:0 "穿沙火绳枪：摩洛哥远征警报"
 oe_aa2.5.desc:0 "自塔加扎盐池疾驰而来的斥候呈上急报：马格里布苏丹正集结安达卢西亚火绳枪手与铸铜野炮，图谋穿越撒哈拉奇袭尼日尔河。以长矛著称的草原贵族必须直面火药时代的严峻考验。"
 oe_aa2.5.a:0 "为索法重骑与步卒配发火绳枪并建火药坊"
 oe_aa2.5.b:0 "坚壁清野并扼守撒哈拉驼道水井"
 oe_aa2.6.title:0 "萨赫勒金盐双脉复兴"
 oe_aa2.6.desc:0 "尽管欧洲轻帆船沿大西洋岸往来不绝，但我朝精锐护商巡队与重开张的塔加扎、陶代尼盐矿令内陆大商道重焕生机。沙金、可乐果、染布与典籍再度汇聚于尼日尔河湾。"
 oe_aa2.6.a:0 "统管塔加扎盐矿与班布克金矿官商专卖"
 oe_aa2.6.b:0 "贯通撒哈拉驼道与大西洋河口双轨商市"
 oe_aa2.7.title:0 "胡苏尼库布瓦珊瑚石宫"
 oe_aa2.7.desc:0 "矗立于基尔瓦港悬崖之上、以洁白珊瑚石筑成的百室巨宫胡苏尼库布瓦，令自丹吉尔至霍尔木兹的旅人叹为观止。八角浴池、穹顶厅堂与宏阔商庭尽显斯瓦希里文明气象。"
 oe_aa2.7.a:0 "扩建崖上珊瑚商庭与大朝觐殿"
 oe_aa2.7.b:0 "铸行基尔瓦银铜通宝以利沿岸诸城互市"
 oe_aa2.8.title:0 "季风三角帆船与星盘舵师"
 oe_aa2.8.desc:0 "每逢冬令，东北季风送来阿拉伯与古吉拉特商船；春风一起，西南季风又护送东非满载船队北航。斯瓦希里星象舵师已将西印度洋每一处珊瑚暗礁与星辰纬度尽数载入海图。"
 oe_aa2.8.a:0 "敕建武装三角帆船队与星盘航海公会"
 oe_aa2.8.b:0 "与亚丁、古吉拉特共建季风常驻商馆"
 oe_aa2.9.title:0 "索法拉黄金与内陆象牙通衢"
 oe_aa2.9.desc:0 "自大津巴布韦石城高原南下的商队满载冲积沙金、铜锭与上等象牙抵达沿海转运港索法拉。紧握这座南方门户，便足以令整条斯瓦希里珊瑚海岸稳居非洲首富。"
 oe_aa2.9.a:0 "重兵护卫索法拉金库与赞比西河道商栈"
 oe_aa2.9.b:0 "以金银税利扩建斯瓦希里珊瑚石造船厂"
 oe_aa2.10.title:0 "迎战西洋铁炮舰队"
 oe_aa2.10.desc:0 "满载舷侧青铜巨炮的西洋高帆克拉克战舰已绕过好望角驶入东非海域，强逼斯瓦希里诸苏丹纳贡并购买通行执照。若不立即革新战船与海港炮台，绵延数百年的季风海贸将落入外人之手。"
 oe_aa2.10.a:0 "为武装三角帆船加装火炮并筑珊瑚石海防炮台"
 oe_aa2.10.b:0 "联合红海与古吉拉特诸港共缔反执照海盟"
 oe_aa2.11.title:0 "斯瓦希里石城联邦同盟"
 oe_aa2.11.desc:0 "数百年来，从拉穆、马林迪到蒙巴萨、桑给巴尔与基尔瓦的珊瑚石城屡因海贸关税彼此倾轧。面对大洋列强逼近，诸城长老与船东贵族齐聚一堂，共商持久海邦联邦大计。"
 oe_aa2.11.a:0 "缔结斯瓦希里石城共治海事议会"
 oe_aa2.11.b:0 "统一沿岸海关厘金并设王家海军总监"
 oe_aa2.12.title:0 "印度洋季风海权帝国"
 oe_aa2.12.desc:0 "斯瓦希里铜底护卫舰与武装三角帆船护航商队纵横于好望角、马拉巴尔与马六甲之间。诗人们以阿拉伯字母书写斯瓦希里史诗，传唱不落幕的季风海权盛世。"
 oe_aa2.12.a:0 "宣示西印度洋季风主权与常备远洋舰队"
 oe_aa2.12.b:0 "建基尔瓦为亚非欧三大洲自由海贸总汇"
 oe_aa2.13.title:0 "贝宁青铜铸匠与王室工艺行会"
 oe_aa2.13.desc:0 "在巍峨城垣环护的王城坊间，失蜡法大匠正将炽烈黄铜浇铸成宫廷浮雕铜板、君王造像与礼器编钟，工艺精妙绝伦。象牙雕师与拉菲亚织布匠亦齐请颁赐王室行会特许。"
 oe_aa2.13.a:0 "特许王家青铜铸造与象牙雕刻御用行会"
 oe_aa2.13.b:0 "兴筑宏伟城防土垣与王道驿路"
 oe_aa2.14.title:0 "致罗马与里斯本的平等国书"
 oe_aa2.14.desc:0 "远洋帆船停泊于刚果河口与贝宁湾外，载来丝绸、明镜与欧洲君王的使者。宫廷书吏拒绝卑躬屈膝，而是挥毫拟就平等国书，宣示王国完整主权并要求对等互派工匠、印书师与学者。"
 oe_aa2.14.a:0 "遣派王室正使与留学生团出使欧洲诸国"
 oe_aa2.14.b:0 "恪守祖制长老院并严限外商口岸专约"
 oe_aa2.15.title:0 "大西洋火枪贸易与王室军械主权"
 oe_aa2.15.desc:0 "火绳枪、熟铁枪管与黑火药桶已流入沿海河口商市，若任由地方领主私购，必将动摇王廷权柄。国王必须决断如何将近代火器收归王用，同时防微杜渐。"
 oe_aa2.15.a:0 "组建王家火枪亲军并设王室铸铁修械坊"
 oe_aa2.15.b:0 "颁布硝磺火器王室专卖禁令"
 oe_aa2.16.title:0 "铁腕遏制跨洋贩奴恶潮"
 oe_aa2.16.desc:0 "唯利是图的沿海牙人与外洋船主竟开始掳掠自由民乃至小贵族贩往大西洋种植园，令乡里人心惶惶、国本动摇。义愤填膺的王廷法官奏请颁布雷霆敕令彻底禁绝此害。"
 oe_aa2.16.a:0 "颁行王室禁奴敕令并严查一切离港外船"
 oe_aa2.16.b:0 "以胡椒、铜锭、锦布与棕榈油替代人口贸易"
 oe_aa2.17.title:0 "雨林河网与内陆商道贯通"
 oe_aa2.17.desc:0 "从通航千里的刚果河干流到水网密布的尼日尔河三角洲，独木舟商队与整修后的雨林驰道将铜币、铁农具、食盐与熏鱼源源送入赤道腹地。"
 oe_aa2.17.a:0 "贯通刚果盆地与几内亚湾内河联运商市"
 oe_aa2.17.b:0 "扩建腹地铜铁冶坊与纺织工场"
 oe_aa2.18.title:0 "赤道近代主权王国"
 oe_aa2.18.desc:0 "当周边诸多沿海邦国在殖民风暴中分崩离析之际，我王国将古老长老宪制、蜚声四海的青铜工艺、完善文书档案与精锐火器步军熔铸一炉，巍然屹立为近代非洲强国。"
 oe_aa2.18.a:0 "颁行近代主权宪章并设立王家科学院"
 oe_aa2.18.b:0 "修筑星形海防要塞并建自主大西洋商船队"
 oe_aa2.19.title:0 "和平缔造者与海华沙贝珠盟带"
 oe_aa2.19.desc:0 "历经数代横亘指湖与莫霍克谷地的血亲仇杀后，和平缔造者与海华沙手捧紫白贝珠串立于圣湖之畔。五部受邀将干戈深埋于大白松树根之下，同栖一座象征团结的伟大长屋之中。"
 oe_aa2.19.a:0 "于大和平树下埋葬干戈，共立五部同盟"
 oe_aa2.19.b:0 "结成五部攻守同盟，以长屋战团共御外侮"
 oe_aa2.20.title:0 "奥农达加五十酋长联邦议会"
 oe_aa2.20.desc:0 "奥农达加圣火厅炊烟袅袅，五十位联邦酋长循古礼分席议政：莫霍克与塞内卡为兄长部，奥奈达与卡尤加为幼弟部，奥农达加司护火仲裁，必俟众议归于一致方行国策。"
 oe_aa2.20.a:0 "确立氏族主母推举权与联邦全体一致议程"
 oe_aa2.20.b:0 "广制贝珠盟约档案并育联邦外交使才"
 oe_aa2.21.title:0 "毛皮贸易与燧发火枪外交"
 oe_aa2.21.desc:0 "沿哈德逊河与圣劳伦斯河溯流而上的跨洋商船狂热求购海狸毛皮，愿以精钢战斧、毛毯与燧发火枪相易。议会必须借机实现火器对等，同时绝不让外商商站反客为主。"
 oe_aa2.21.a:0 "以毛皮易取精良燧发枪，编练林地游骑火枪团"
 oe_aa2.21.b:0 "纵横捭阖，令大西洋各商站竞价收购毛皮"
 oe_aa2.22.title:0 "五大湖海狸毛皮争霸"
 oe_aa2.22.desc:0 "随着东部溪流海狸渐稀，休伦湖、伊利湖与安大略湖周边的丰饶毛皮猎场成为北美战略必争之地。竞争部族及其跨洋盟友正围绕尼亚加拉至麦基诺的每一处水陆转运口展开激烈角逐。"
 oe_aa2.22.a:0 "劲旅西进，夺占尼亚加拉与五大湖毛皮水陆咽喉"
 oe_aa2.22.b:0 "延展长屋梁木，以养子礼吸纳周边部族壮大人口"
 oe_aa2.23.title:0 "白银盟链均势外交"
 oe_aa2.23.desc:0 "当大西洋列强为争夺北美东岸霸权兵戎相见时，各方使臣携重礼奔赴奥农达加请求擦亮白银盟链。凭借左右南北战局的关键砝码，长屋联邦以公认主权仲裁者之姿纵横列强之间。"
 oe_aa2.23.a:0 "以平等主权国之礼重铸白银盟链与自由商约"
 oe_aa2.23.b:0 "加固莫霍克—安大略木石堡寨并建联邦枪械工坊"
 oe_aa2.24.title:0 "易洛魁近代联邦宪政共和国"
 oe_aa2.24.desc:0 "大西洋两岸的哲人与政治家无不惊叹于长屋古老的联邦制度——军政分权、代表可罢免、主权诸邦和平联合。如今大议会准备将《大和平法》法典化，迎接近代世界新纪元。"
 oe_aa2.24.a:0 "编纂《大和平法》成文宪法并兴办联邦学院"
 oe_aa2.24.b:0 "兴办大湖船坞与工坊，筑龟岛富强实业之盾"
 oe_aa2.25.title:0 "玛雅潘同盟中兴大议"
 oe_aa2.25.desc:0 "在长达九公里的玛雅潘石灰岩环城之内，科科姆、休、切尔与伊察诸大贵族代表齐聚羽蛇神彩绘神庙之下。若不重振古老的穆尔特帕尔共治议会，尤卡坦诸邦恐将陷入分裂混战。"
 oe_aa2.25.a:0 "重申尤卡坦穆尔特帕尔贵族共治宪章"
 oe_aa2.25.b:0 "整编常备霍尔坎贵族步兵团以威服诸邦"
 oe_aa2.26.title:0 "德累斯顿历算与玛雅天文复兴"
 oe_aa2.26.desc:0 "端坐于阶梯石灰岩观象台之巅的玛雅祭司天文学家，正精确推算金星会合周期与日月蚀时刻，并以包含零号的二十进制数学工整绘录于树皮纸折叠历典之上。"
 oe_aa2.26.a:0 "兴建观象台与阿马特树皮纸历典抄录院"
 oe_aa2.26.b:0 "以精密历法指导圣井引水与梯田农时"
 oe_aa2.27.title:0 "可可通货与加勒比远航商舟"
 oe_aa2.27.desc:0 "长达四十英尺、配二十五名桨手的雪松巨型商舟穿梭于科苏梅尔岛与洪都拉斯湾之间，满载精织棉袍、埃马尔海盐、翡翠斧、黑曜石刃与通行中美洲的珍贵可可豆通货。"
 oe_aa2.27.a:0 "扩建加勒比环海远航商舟与沿海灯塔商港"
 oe_aa2.27.b:0 "规范玛雅潘可可、海盐与翡翠官定市衡"
 oe_aa2.28.title:0 "抗击跨洋瘟疫与钢铁入侵"
 oe_aa2.28.desc:0 "越过东方旭日之海而来的奇异帆船不仅载来披甲钢刃骑兵，更挟带席卷繁华市集的未知热疫。然尤卡坦与佩滕星罗棋布的丛林城邦深谙本草医道，且手握密林天险。"
 oe_aa2.28.a:0 "推行玛雅本草防疫隔离与丛林分屯避疫策"
 oe_aa2.28.b:0 "缴获锻造西洋精钢与火药，武装霍尔坎步兵"
 oe_aa2.29.title:0 "尤卡坦石灰岩丛林要塞群"
 oe_aa2.29.desc:0 "横跨普克丘陵、图卢姆海崖与佩滕湖心岛堡诺佩滕，玛雅工匠将多层石灰岩棱堡、隐蔽陷坑与白色石砌萨克贝驰道融为一体，令守军来去如风、令入侵者寸步难行。"
 oe_aa2.29.a:0 "加固普克山地石堡与萨克贝白石伏击驰道"
 oe_aa2.29.b:0 "于图卢姆与坎佩切营建珊瑚石海防炮台"
 oe_aa2.30.title:0 "中美洲玛雅第二黄金时代"
