 oe_msn_dan_destiny_BUTTON_DETAILS:0 "丹麦与挪威十二任务三支柱天命链：严征厄勒通行税并建成皇家海军部与王法典禁军，统合斯科讷、挪威峡湾、石勒苏益格与哥特兰岛，并以北大西洋渔业、海峡关税与武装中立同盟共创双海盛世。"
 oe_msn_dan_01_crown_of_the_straits:0 "海峡王冠：稳固西兰与奥斯陆"
 oe_msn_dan_01_crown_of_the_straits_desc:0 "在哥本哈根、罗斯基勒或奥斯陆稳固王权秩序，凝聚北欧海洋核心。"
 oe_msn_dan_01_crown_of_the_straits_req_tt:0 "拥有哥本哈根、罗斯基勒或奥斯陆之一，且稳定度至少为 5。"
 oe_msn_dan_02_helsingor_sound_dues:0 "赫尔辛厄炮台：确立厄勒海峡通行税"
 oe_msn_dan_02_helsingor_sound_dues_desc:0 "加固赫尔辛厄海峡要塞，对往来北海与波罗的海的每艘商船征缴通行税。"
 oe_msn_dan_02_helsingor_sound_dues_req_tt:0 "拥有赫尔辛厄与哥本哈根，且稳定度至少为 10。"
 oe_msn_dan_03_royal_danish_admiralty:0 "霍尔门皇家船坞与海军部"
 oe_msn_dan_03_royal_danish_admiralty_desc:0 "兴建深水军舰船台与木材军需库，源源打造重型北欧战列舰队。"
 oe_msn_dan_03_royal_danish_admiralty_req_tt:0 "持有至少 220 金币，且处于文艺复兴时代或之后。"
 oe_msn_dan_04_kongeloven_royal_guard:0 "《王法典》与丹麦王家近卫团"
 oe_msn_dan_04_kongeloven_royal_guard_desc:0 "统一王权对舰队与王家近卫团的最高统帅权，保卫丹挪双王国长治久安。"
 oe_msn_dan_04_kongeloven_royal_guard_req_tt:0 "稳定度至少为 15，且处于宗教改革时代或之后。"
 oe_msn_dan_05_scanian_shore_lund:0 "海峡两岸尽归王土：隆德与马尔默"
 oe_msn_dan_05_scanian_shore_lund_desc:0 "牢牢掌控隆德与马尔默，将厄勒海峡东西两岸尽数握于掌心。"
 oe_msn_dan_05_scanian_shore_lund_req_tt:0 "拥有隆德与马尔默。"
 oe_msn_dan_06_norwegian_fjords_bergen:0 "挪威峡湾双港：奥斯陆与卑尔根"
 oe_msn_dan_06_norwegian_fjords_bergen_desc:0 "将挪威林木峡湾、奥斯陆要冲与卑尔根商港同丹麦王室紧密融为一体。"
 oe_msn_dan_06_norwegian_fjords_bergen_req_tt:0 "拥有奥斯陆与卑尔根。"
 oe_msn_dan_07_schleswig_lubeck_gate:0 "日德兰南门：石勒苏益格与弗伦斯堡"
 oe_msn_dan_07_schleswig_lubeck_gate_desc:0 "稳守石勒苏益格与弗伦斯堡南境咽喉，压制汉萨同盟的商业竞争。"
 oe_msn_dan_07_schleswig_lubeck_gate_req_tt:0 "拥有石勒苏益格与弗伦斯堡，且控制至少 65 个地块。"
 oe_msn_dan_08_kalmar_baltic_sovereign:0 "维斯比与波罗的海：卡尔马海上霸主"
 oe_msn_dan_08_kalmar_baltic_sovereign_desc:0 "兼控维斯比海岛雄城、哥本哈根与奥斯陆，坐实北欧海上无双霸权。"
 oe_msn_dan_08_kalmar_baltic_sovereign_req_tt:0 "拥有维斯比、哥本哈根与奥斯陆，且处于宗教改革时代或之后。"
 oe_msn_dan_09_north_atlantic_fisheries:0 "北大西洋渔场与北欧海图"
 oe_msn_dan_09_north_atlantic_fisheries_desc:0 "依托奥胡斯、卑尔根与尼达罗斯的鳕鱼鲱鱼渔船队与航海传统开拓北大西洋海路。"
 oe_msn_dan_09_north_atlantic_fisheries_req_tt:0 "拥有卑尔根、尼达罗斯或奥胡斯之一，且处于文艺复兴时代或之后。"
 oe_msn_dan_10_sound_customs_treasury:0 "王家财务院与海峡关税总账"
 oe_msn_dan_10_sound_customs_treasury_desc:0 "在哥本哈根王家财务院推行精密账簿审计，将海峡税款转化为持久海洋财富。"
 oe_msn_dan_10_sound_customs_treasury_req_tt:0 "拥有哥本哈根，且持有至少 300 金币。"
 oe_msn_dan_11_nordic_armed_neutrality:0 "北欧法典与武装中立护航"
 oe_msn_dan_11_nordic_armed_neutrality_desc:0 "以开明法典配以武装中立护航舰队，在列强海战纷争中独享繁盛远洋商利。"
 oe_msn_dan_11_nordic_armed_neutrality_req_tt:0 "稳定度至少为 15，且处于专制时代或之后。"
 oe_msn_dan_12_eternal_lord_two_seas:0 "永恒北方双海共主"
 oe_msn_dan_12_eternal_lord_two_seas_desc:0 "以无敌舰队与昌盛海贸统合哥本哈根、奥斯陆与隆德，加冕永恒北方双海共主。"
 oe_msn_dan_12_eternal_lord_two_seas_req_tt:0 "拥有哥本哈根、奥斯陆与隆德、稳定度至少 18，且处于专制时代或之后。"
 oe_msn_pap_destiny:0 "#bold #color_yellow 教皇国：圣彼得永恒双钥天命#!#!"
 oe_msn_pap_destiny_DESCRIPTION:0 "自阿维尼翁重返罗马与光复圣彼得教产迈向穹顶辉煌与神圣仲裁"
 oe_msn_pap_destiny_CRITERIA_DESCRIPTION:0 "重振罗马圣座，组建瑞士近卫军并贯彻特伦托革新，收复翁布里亚、马尔凯与罗马涅，竣工圣彼得大教堂。"
 oe_msn_pap_destiny_BUTTON_TOOLTIP:0 "开启教皇国天命"
 oe_msn_pap_destiny_BUTTON_DETAILS:0 "教皇国十二任务三支柱天命链：自阿维尼翁重返罗马、弥合大分裂并组建瑞士近卫军与特伦托教会，收复佩鲁贾、安科纳、博洛尼亚、拉文纳、乌尔比诺与费拉拉，并以梵蒂冈图书馆、圣彼得大教堂与普世传教加冕永恒之城。"
 oe_msn_pap_01_return_to_eternal_city:0 "重返永恒之城：罗马与维泰博"
 oe_msn_pap_01_return_to_eternal_city_desc:0 "以稳固虔诚治理罗马与维泰博，令宗座重镇台伯河畔永恒之城。"
 oe_msn_pap_01_return_to_eternal_city_req_tt:0 "拥有罗马与维泰博，且稳定度至少为 5。"
 oe_msn_pap_02_heal_western_schism:0 "弥合西方大分裂：唯一罗马圣座"
 oe_msn_pap_02_heal_western_schism_desc:0 "重申拉丁基督教世界教法一统，彻底平息对立教宗纷争。"
 oe_msn_pap_02_heal_western_schism_req_tt:0 "拥有罗马，且稳定度至少为 10。"
 oe_msn_pap_03_warrior_pope_swiss_guard:0 "宗座瑞士近卫军与圣天使堡防务"
 oe_msn_pap_03_warrior_pope_swiss_guard_desc:0 "招募忠勇无畏的瑞士长戟近卫队并加固圣天使堡，守护教廷独立自主。"
 oe_msn_pap_03_warrior_pope_swiss_guard_req_tt:0 "拥有罗马、至少 220 金币，且处于文艺复兴时代或之后。"
 oe_msn_pap_04_tridentine_church_triumphant:0 "特伦托革新：凯旋公教会"
 oe_msn_pap_04_tridentine_church_triumphant_desc:0 "全面贯彻特伦托神学院制度、教区视察与公教正统复兴。"
 oe_msn_pap_04_tridentine_church_triumphant_req_tt:0 "拥有罗马、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_pap_05_umbria_marche_restored:0 "光复翁布里亚与马尔凯：佩鲁贾与安科纳"
 oe_msn_pap_05_umbria_marche_restored_desc:0 "将内陆重镇佩鲁贾至亚得里亚海商港安科纳重新纳入教廷直辖。"
 oe_msn_pap_05_umbria_marche_restored_req_tt:0 "拥有佩鲁贾与安科纳。"
 oe_msn_pap_06_romagna_bologna_ravenna:0 "收复罗马涅故土：博洛尼亚与拉文纳"
 oe_msn_pap_06_romagna_bologna_ravenna_desc:0 "收复博洛尼亚大学城与古都拉文纳，将教皇国北疆稳固于波河之畔。"
 oe_msn_pap_06_romagna_bologna_ravenna_req_tt:0 "拥有博洛尼亚与拉文纳。"
 oe_msn_pap_07_urbino_ferrara_fiefs:0 "收回公爵采邑：乌尔比诺与费拉拉"
 oe_msn_pap_07_urbino_ferrara_fiefs_desc:0 "将文艺荟萃的乌尔比诺与费拉拉公国并入统一强盛的意大利中部教廷领地。"
 oe_msn_pap_07_urbino_ferrara_fiefs_req_tt:0 "拥有乌尔比诺与费拉拉，且控制至少 32 个地块。"
 oe_msn_pap_08_arbiter_of_italy:0 "意大利仲裁者：完整圣彼得教产"
 oe_msn_pap_08_arbiter_of_italy_desc:0 "兼控罗马、博洛尼亚与安科纳，令教宗在意大利与全欧外交棋局中举足轻重。"
 oe_msn_pap_08_arbiter_of_italy_req_tt:0 "拥有罗马、博洛尼亚与安科纳，且处于宗教改革时代或之后。"
 oe_msn_pap_09_vatican_library_humanism:0 "梵蒂冈图书馆与罗马人文复兴"
 oe_msn_pap_09_vatican_library_humanism_desc:0 "在梵蒂冈宗座图书馆广聚希腊与拉丁古籍，延揽盛期文艺复兴艺术宗师。"
 oe_msn_pap_09_vatican_library_humanism_req_tt:0 "拥有罗马，且处于文艺复兴时代或之后。"
 oe_msn_pap_10_saint_peters_basilica:0 "营建圣彼得大教堂巍峨穹顶"
 oe_msn_pap_10_saint_peters_basilica_desc:0 "于梵蒂冈山丘筑起基督教世界最恢宏的大教堂穹顶，迎接四海禧年朝圣人潮。"
 oe_msn_pap_10_saint_peters_basilica_req_tt:0 "拥有罗马，且持有至少 320 金币。"
 oe_msn_pap_11_propaganda_fide_missions:0 "普世传信部：远洋宗座传教团"
 oe_msn_pap_11_propaganda_fide_missions_desc:0 "自罗马统筹多语种圣经印坊与全球修会传教团，将宗座声望播撒至各大洲。"
 oe_msn_pap_11_propaganda_fide_missions_req_tt:0 "拥有罗马、稳定度至少 15，且处于宗教改革时代或之后。"
 oe_msn_pap_12_kingdom_of_god_on_earth:0 "永恒双钥：地上神国荣光"
 oe_msn_pap_12_kingdom_of_god_on_earth_desc:0 "以圣彼得穹顶、特伦托革新与完整教产统合罗马、博洛尼亚与拉文纳，加冕永恒双钥天命。"
 oe_msn_pap_12_kingdom_of_god_on_earth_req_tt:0 "拥有罗马、博洛尼亚与拉文纳、稳定度至少 18，且处于专制时代或之后。"
