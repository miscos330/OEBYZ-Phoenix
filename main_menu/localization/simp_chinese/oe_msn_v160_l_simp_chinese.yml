 oe_msn_boh_01_golden_bull_prague:0 "布拉格金玺诏书：稳固伏尔塔瓦核心"
 oe_msn_boh_01_golden_bull_prague_desc:0 "凭1356年《金玺诏书》位列帝国首席世俗选侯，布拉格在查理大桥与城堡山尖塔映衬下雄踞伏尔塔瓦河畔。夯实波希米亚[capital|e]根基既彰显王室[legitimacy|e]与[stability|e]，更为王国赢得显赫帝国[prestige|e]。"
