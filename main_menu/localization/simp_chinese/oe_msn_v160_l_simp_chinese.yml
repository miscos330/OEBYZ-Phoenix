 oe_msn_boh_04_unconquered_bohemian_bastion_req_tt:0 "处于宗教改革时代或之后，拥有布拉格并控制海布，稳定度至少15，建成棱堡并接纳教派确立思潮。"
 oe_msn_boh_05_moravian_margraviate:0 "摩拉维亚边区：布尔诺与奥洛穆茨"
