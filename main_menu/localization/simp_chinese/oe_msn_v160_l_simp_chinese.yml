 oe_msn_boh_12_crown_of_saint_wenceslas_req_tt:0 "处于专制时代或之后，拥有布拉格并控制布尔诺与弗罗茨瓦夫，稳定度至少18，建成星形堡垒或证券交易所，且位列列强或月收至少70。"
