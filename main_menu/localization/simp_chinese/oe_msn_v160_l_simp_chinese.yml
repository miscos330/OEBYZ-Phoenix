 oe_msn_boh_02_bethlehem_chapel_reform_req_tt:0 "拥有布拉格，稳定度至少为10、市民满意度至少50%，并建成大教堂或神庙。"
 oe_msn_boh_03_wagenburg_war_wagons:0 "胡斯战车军械库：重装火器战车"
