 oe_msn_pru_04_canton_potsdam_grenadiers_req_tt:0 "处于专制时代或之后，稳定度至少为15、陆军传统至少为40，并接纳军事革命思潮。"
 oe_msn_pru_05_unite_berlin_konigsberg:0 "双京合璧：贯通柏林与柯尼斯堡"
 oe_msn_pru_05_unite_berlin_konigsberg_desc:0 "将施普雷河畔的选侯都城柏林与普雷格尔河口的加冕名城柯尼斯堡紧密相连，把南北分置的领地铸为独立王国。贯通双京[core|e]大幅提升[legitimacy|e]与疆域[control|e]，并带动王都的[development|e]腾飞。"
 oe_msn_pru_05_unite_berlin_konigsberg_req_tt:0 "直接或通过属国控制柏林与柯尼斯堡，且首都发展度至少为18。"
 oe_msn_pru_06_pomeranian_baltic_corridor:0 "波罗的海走廊：什切青与但泽"
 oe_msn_pru_06_pomeranian_baltic_corridor_desc:0 "收复奥得河口什切青与维斯瓦河门户但泽，既消除横亘勃兰登堡与东普鲁士的走廊隔阂，又斩获波罗的海深水良港。坐镇海岸[core|e]激活远洋[trade|e]，培育[navy_tradition|e]并稳步拓展北方[maritime_presence|e]。"
 oe_msn_pru_06_pomeranian_baltic_corridor_req_tt:0 "直接或通过属国控制什切青与但泽，且至少拥有4座港口。"
 oe_msn_pru_07_conquest_of_silesia:0 "西里西亚大捷：夺取弗罗茨瓦夫与格沃古夫"
 oe_msn_pru_07_conquest_of_silesia_desc:0 "借莫尔维茨、霍亨弗里德贝格与洛伊滕的迅雷捷报夺得富庶西里西亚，令普鲁士税源、铁矿与织造产能一夜倍增。收编这片膏腴[core|e]使国库[gold|e]充盈、百业[prosperity|e]兴盛，更彰显铁血[army|e]的震世威名。"
 oe_msn_pru_07_conquest_of_silesia_req_tt:0 "控制弗罗茨瓦夫与格沃古夫，控制至少45处地点，且陆军传统至少为28。"
 oe_msn_pru_08_magdeburg_elbian_hegemony:0 "易北河要冲：马格德堡与北德霸权"
 oe_msn_pru_08_magdeburg_elbian_hegemony_desc:0 "自焦土中重建为易北河中游最森严的江防巨堡，马格德堡把普鲁士霸权牢牢钉在北德意志大平原心脏。稳握这座河畔[core|e]既筑牢[fort|e]盾牌，更令王国[prestige|e]与德意志[diplomacy|e]威望无可匹敌。"
 oe_msn_pru_08_magdeburg_elbian_hegemony_req_tt:0 "处于宗教改革时代或之后，控制马格德堡、柏林与柯尼斯堡，并建成兵营或棱堡。"
 oe_msn_pru_09_konigsberg_albertina:0 "柯尼斯堡阿尔贝蒂娜大学与北方人文"
 oe_msn_pru_09_konigsberg_albertina_desc:0 "1544年由阿尔布雷希特公爵创建的阿尔贝蒂娜大学，成为波罗的海沿岸人文学术、数理与康德哲学的明灯。兴建高校[buildings|e]推动[institutions|e]与[literacy|e]普及，使普鲁士[cultural_tradition|e]与武功齐名。"
 oe_msn_pru_09_konigsberg_albertina_req_tt:0 "处于文艺复兴时代或之后，拥有柯尼斯堡或柏林，建成一座大学并接纳文艺复兴思潮。"
 oe_msn_pru_10_general_directory_fisc:0 "总务署财政与柏林战备金库"
 oe_msn_pru_10_general_directory_fisc_desc:0 "在总务署严苛账目下，节俭王室宛如斯巴达管家，排干奥得沼泽、吸纳胡格诺工匠，将白银塔勒悉数存入柏林战备金库。清廉[cabinet|e]理财有效抑制[inflation|e]，积蓄巨额[gold|e]并夯实全域[prosperity|e]。"
 oe_msn_pru_10_general_directory_fisc_req_tt:0 "拥有柏林或波茨坦，国库至少300金币、月度贸易与税收至少25，并建成一座市场。"
 oe_msn_pru_11_sanssouci_stein_hardenberg:0 "无忧宫启蒙与施泰因-哈登贝格革新"
 oe_msn_pru_11_sanssouci_stein_hardenberg_desc:0 "从无忧宫启蒙清谈到解放农奴、编纂民法与推行择优任官的施泰因-哈登贝格革新，普鲁士以自上而下的魄力脱胎换骨。开明改制加速[advances|e]与[literacy|e]跃升，同步壮大首都的[development|e]与[crown_power|e]。"
 oe_msn_pru_11_sanssouci_stein_hardenberg_req_tt:0 "处于专制时代或之后，稳定度至少为15、首都发展度至少为28，并建成铸铁厂或证券交易所。"
 oe_msn_pru_12_iron_kingdom_north:0 "北方铁血王国"
 oe_msn_pru_12_iron_kingdom_north_desc:0 "将贫瘠沙原百炼成钢，北方铁血王国挺立为欧陆新晋巨柱，文官、学者与掷弹兵皆依精密钟表般的法度齐步前行。昂首跻身[great_power|e]，普鲁士将无敌[army|e]铁纪、高效[cabinet|e]与震世[prestige|e]熔铸一体。"
 oe_msn_pru_12_iron_kingdom_north_req_tt:0 "处于专制时代或之后，控制柏林、柯尼斯堡与弗罗茨瓦夫，稳定度至少18，建成星形堡垒，且位列列强或陆军传统至少55。"
 oe_msn_dan_destiny:0 "#bold #color_yellow 丹麦与挪威：厄勒海峡与双海霸主天命#!#!"
 oe_msn_dan_destiny_DESCRIPTION:0 "自卡尔马与厄勒海峡通行税迈向北海波罗的海双海王冠"
 oe_msn_dan_destiny_CRITERIA_DESCRIPTION:0 "扼守哥本哈根与赫尔辛厄海峡税关，统合斯科讷、挪威与石勒苏益格，锻造皇家舰队并引领北欧海贸与启蒙。"
 oe_msn_dan_destiny_BUTTON_TOOLTIP:0 "开启丹麦-挪威天命"
 oe_msn_dan_destiny_BUTTON_DETAILS:0 "丹麦与挪威十二任务三支柱天命链：严征厄勒通行税并建成皇家海军部与王法典禁军，统合斯科讷、挪威峡湾、石勒苏益格与哥特兰岛，并以北大西洋渔业、海峡关税与武装中立同盟共创双海盛世。"
 oe_msn_dan_01_crown_of_the_straits:0 "海峡王冠：稳固西兰与奥斯陆"
 oe_msn_dan_01_crown_of_the_straits_desc:0 "贝尔特水道与厄勒海峡将往来波罗的海的万千风帆尽数引过西兰岛畔，赋予丹麦王冠执掌北方双海的天然门户。稳固海滨[capital|e]既夯实王朝[legitimacy|e]与海岸[control|e]，更确立先发[maritime_presence|e]。"
 oe_msn_dan_01_crown_of_the_straits_req_tt:0 "拥有哥本哈根、罗斯基勒或奥斯陆，稳定度至少为5，拥有港口并建成一处码头。"
 oe_msn_dan_02_helsingor_sound_dues:0 "赫尔辛厄炮台：确立厄勒海峡通行税"
 oe_msn_dan_02_helsingor_sound_dues_desc:0 "在赫尔辛厄克伦堡青铜巨炮威慑下，每艘汉萨商船与荷兰帆船皆须降帆报关，将丰厚的厄勒通行税径直纳归王室。固守海峡[fort|e]令[gold|e]滚滚而来，同时淬炼[navy_tradition|e]并掌握北方[trade|e]话语权。"
 oe_msn_dan_02_helsingor_sound_dues_req_tt:0 "拥有赫尔辛厄与哥本哈根，稳定度至少为10、月度贸易与税收至少18，并建成一座城堡。"
 oe_msn_dan_03_royal_danish_admiralty:0 "霍尔门皇家船坞与海军部"
 oe_msn_dan_03_royal_danish_admiralty_desc:0 "在霍尔门皇家船坞中，御用造船师用挪威橡木铺设重型战舰龙骨，并由常驻新博德营区的丹挪职业水手执掌风帆。完备海防[buildings|e]支撑起常备[navy|e]，锤炼精干[sailors|e]并稳步推高[navy_tradition|e]。"
 oe_msn_dan_03_royal_danish_admiralty_req_tt:0 "处于文艺复兴时代或之后，国库至少220金币、海军传统至少20，并建成一座船坞。"
 oe_msn_dan_04_kongeloven_royal_guard:0 "《王法典》与丹麦王家近卫团"
 oe_msn_dan_04_kongeloven_royal_guard_desc:0 "在哥本哈根市民与教士共抗围城后的拥戴下，1665年《王法典》确立世袭法统，王家近卫团持戟护卫罗森堡王宫。接纳近代[institutions|e]高度凝聚[crown_power|e]，令王国[stability|e]与[regulars|e]威仪并重。"
 oe_msn_dan_04_kongeloven_royal_guard_req_tt:0 "处于宗教改革时代或之后，稳定度至少为15，建成兵营或造船厂并接纳教派确立思潮。"
 oe_msn_dan_05_scanian_shore_lund:0 "海峡两岸尽归王土：隆德与马尔默"
 oe_msn_dan_05_scanian_shore_lund_desc:0 "牢握隆德古老主座教堂与马尔默鲱鱼商市，确保厄勒海峡两岸尽归丹麦王土，绝不容强敌隔海架炮窥伺王都。稳固斯科讷[core|e]使海峡[control|e]万无一失，既滋养两岸[prosperity|e]，亦永保关税[trade|e]。"
 oe_msn_dan_05_scanian_shore_lund_req_tt:0 "直接或通过属国控制隆德与马尔默，且至少拥有6座港口。"
 oe_msn_dan_06_norwegian_fjords_bergen:0 "挪威峡湾双港：奥斯陆与卑尔根"
 oe_msn_dan_06_norwegian_fjords_bergen_desc:0 "自奥斯陆峡湾阿克什胡斯堡到卑尔根布吕根木码头，挪威为双王冠源源提供桅杆松木、鳕鱼干与世代无畏的远洋水手。凝聚丹挪[core|e]极大充实[sailors|e]储备，拓宽[maritime_presence|e]并夯实[navy|e]远航之基。"
 oe_msn_dan_06_norwegian_fjords_bergen_req_tt:0 "直接或通过属国控制奥斯陆与卑尔根，并在国内拥有至少一座渔村。"
 oe_msn_dan_07_schleswig_lubeck_gate:0 "日德兰南门：石勒苏益格与弗伦斯堡"
 oe_msn_dan_07_schleswig_lubeck_gate_desc:0 "稳控石勒苏益格与弗伦斯堡，将日德兰牲畜商道、公国良港及通往汉堡与吕贝克的南大门尽收哥本哈根旗下。筑牢南境[core|e]既掌握北德[diplomacy|e]主动，又提振市民[estate_satisfaction|e]并丰盈[market|e]税利。"
 oe_msn_dan_07_schleswig_lubeck_gate_req_tt:0 "控制石勒苏益格与弗伦斯堡，控制至少65处地点，且市民阶层满意度至少为50%。"
 oe_msn_dan_08_kalmar_baltic_sovereign:0 "维斯比与波罗的海：卡尔马海上霸主"
 oe_msn_dan_08_kalmar_baltic_sovereign_desc:0 "以哥特兰岛石墙重镇维斯比为前哨，丹麦巡防舰队扼守波罗的海中央航道，重现玛格丽特女王昔日宏图。稳握岛屿[core|e]彰显卓越[navy_tradition|e]，将王室[maritime_presence|e]与北欧[prestige|e]推向顶峰。"
 oe_msn_dan_08_kalmar_baltic_sovereign_req_tt:0 "处于宗教改革时代或之后，拥有哥本哈根并控制维斯比与奥斯陆，且海军传统至少为32。"
 oe_msn_dan_09_north_atlantic_fisheries:0 "北大西洋渔场与北欧海图"
 oe_msn_dan_09_north_atlantic_fisheries_desc:0 "自第谷在汶岛筑起观天堡到指引冰岛与法罗渔船的王家海图，北欧格致之学将幽深北大西洋化作明晰通途。接纳先进[institutions|e]同步提升[literacy|e]与航海[advances|e]，令北方[cultural_tradition|e]大放光彩。"
 oe_msn_dan_09_north_atlantic_fisheries_req_tt:0 "处于文艺复兴时代或之后，控制卑尔根、尼达罗斯或奥胡斯，建成账房或大学并接纳文艺复兴思潮。"
 oe_msn_dan_10_sound_customs_treasury:0 "王家财务院与海峡关税总账"
 oe_msn_dan_10_sound_customs_treasury_desc:0 "在王家财务院森严的审计厅内，书吏逐笔核验途经哥本哈根交易所的波罗的海木材、粮船与东印特兰奎巴商船。严密的[cabinet|e]总账有效稳控[inflation|e]，聚敛丰厚[gold|e]并滋养王都的[development|e]。"
 oe_msn_dan_10_sound_customs_treasury_req_tt:0 "拥有哥本哈根，国库至少300金币、首都发展度至少为22，并建成一座市场。"
 oe_msn_dan_11_nordic_armed_neutrality:0 "北欧法典与武装中立护航"
 oe_msn_dan_11_nordic_armed_neutrality_desc:0 "当诸强在大洋上兵戎相见，丹麦护航舰队在统一北欧法典下守护中立商队，借自由航运赚取全球巨额运费红利。稳健[diplomacy|e]与武装[navy|e]护航相辅相成，令王室[diplomatic_reputation|e]与[trade|e]双双大兴。"
 oe_msn_dan_11_nordic_armed_neutrality_req_tt:0 "处于专制时代或之后，稳定度至少为15、月收至少55，并建成证券交易所或造船厂。"
 oe_msn_dan_12_eternal_lord_two_seas:0 "永恒北方双海共主"
 oe_msn_dan_12_eternal_lord_two_seas_desc:0 "自烟波浩渺的挪威峡湾与北大西洋，至金碧辉煌的厄勒关署与维斯比，丹麦国旗在北方双海上空猎猎飘扬。巍然跻身[great_power|e]，丹麦将无敌[navy|e]、跨海[trade|e]与稳固[crown_power|e]铸成永恒共主之业。"
 oe_msn_dan_12_eternal_lord_two_seas_req_tt:0 "处于专制时代或之后，拥有哥本哈根并控制奥斯陆与隆德，稳定度至少18，建成星形堡垒或造船厂，且位列列强或月收至少70。"
 oe_msn_pap_destiny:0 "#bold #color_yellow 教皇国：圣彼得永恒双钥天命#!#!"
 oe_msn_pap_destiny_DESCRIPTION:0 "自阿维尼翁重返罗马与光复圣彼得教产迈向穹顶辉煌与神圣仲裁"
 oe_msn_pap_destiny_CRITERIA_DESCRIPTION:0 "重振罗马圣座，组建瑞士近卫军并贯彻特伦托革新，收复翁布里亚、马尔凯与罗马涅，竣工圣彼得大教堂。"
 oe_msn_pap_destiny_BUTTON_TOOLTIP:0 "开启教皇国天命"
 oe_msn_pap_destiny_BUTTON_DETAILS:0 "教皇国十二任务三支柱天命链：自阿维尼翁重返罗马、弥合大分裂并组建瑞士近卫军与特伦托教会，收复佩鲁贾、安科纳、博洛尼亚、拉文纳、乌尔比诺与费拉拉，并以梵蒂冈图书馆、圣彼得大教堂与普世传教加冕永恒之城。"
 oe_msn_pap_01_return_to_eternal_city:0 "重返永恒之城：罗马与维泰博"
 oe_msn_pap_01_return_to_eternal_city_desc:0 "历经阿维尼翁流亡的漫长岁月后，圣座重返罗马与维泰博终于在台伯河畔重燃宗座[stability|e]。修缮[capital|e]内荒废已久的宏伟圣殿[buildings|e]引来八方朝圣者，令拉丁核心重焕昔日生机与蓬勃[development|e]。"
 oe_msn_pap_01_return_to_eternal_city_req_tt:0 "控制罗马与维泰博（可经由附庸），稳定度不低于 5，且拥有大教堂或神庙。"
 oe_msn_pap_02_heal_western_schism:0 "弥合西方大分裂：唯一罗马圣座"
 oe_msn_pap_02_heal_western_schism_desc:0 "阿维尼翁与比萨的对立教宗曾令拉丁基督教世界四分五裂，唯有归于一统方能重振罗马[religious_influence|e]。借高明[diplomacy|e]凝聚修院与教士[estates|e]，圣彼得宝座终将再度享誉万邦[prestige|e]。"
 oe_msn_pap_02_heal_western_schism_req_tt:0 "控制罗马（可经由附庸），稳定度不低于 10，教士阶层满意度不低于 55%，且拥有修道院或缮写室。"
 oe_msn_pap_03_warrior_pope_swiss_guard:0 "宗座瑞士近卫军与圣天使堡防务"
 oe_msn_pap_03_warrior_pope_swiss_guard_desc:0 "外邦劲旅横行亚平宁之际，尤利乌斯二世加固圣天使堡并召来瑞士戟兵护卫梵蒂冈。以充沛[gold|e]筑牢宗座[fort|e]、整训精锐[regulars|e]，为战斗教会淬炼历久弥坚的[army_tradition|e]。"
 oe_msn_pap_03_warrior_pope_swiss_guard_req_tt:0 "文艺复兴时代起，控制罗马，金币不低于 220，拥有军械库或城堡，且陆军传统不低于 15 或已解锁职业军队。"
 oe_msn_pap_04_tridentine_church_triumphant:0 "特伦托革新：凯旋公教会"
 oe_msn_pap_04_tridentine_church_triumphant_desc:0 "面对北方新教浪潮冲击，特伦托公会议严明神学院纪纲与巴洛克礼仪典籍，令公教[institutions|e]焕然一新。广印正统教义诏令既全面提升了教士[literacy|e]，更以深厚[religious_influence|e]奠定绵延百年的宗座[stability|e]。"
 oe_msn_pap_04_tridentine_church_triumphant_req_tt:0 "宗教改革时代起，控制罗马，稳定度不低于 15，接纳教派主义思潮，且拥有大学或印刷工坊。"
 oe_msn_pap_05_umbria_marche_restored:0 "光复翁布里亚与马尔凯：佩鲁贾与安科纳"
 oe_msn_pap_05_umbria_marche_restored_desc:0 "阿尔沃诺斯枢机早已洞见，若翁布里亚山城与亚得里亚良港各自为政，罗马宗主权便沦为空谈。将佩鲁贾与安科纳纳为[core|e]可稳固东岸[control|e]，并借黎凡特[trade|e]润泽教产[prosperity|e]。"
 oe_msn_pap_05_umbria_marche_restored_req_tt:0 "控制佩鲁贾与安科纳（可经由附庸），且拥有至少一处港口。"
 oe_msn_pap_06_romagna_bologna_ravenna:0 "收复罗马涅故土：博洛尼亚与拉文纳"
 oe_msn_pap_06_romagna_bologna_ravenna_desc:0 "从博洛尼亚的世家高塔到拉文纳的镶嵌画大殿，古老总督辖区久已抗拒罗马直辖。收复罗马涅并确立[core|e]归属，不仅充实教廷[manpower|e]与北疆[control|e]，更锤炼出刚毅[army_tradition|e]。"
 oe_msn_pap_06_romagna_bologna_ravenna_req_tt:0 "控制博洛尼亚与拉文纳（可经由附庸），且拥有城堡或市场。"
 oe_msn_pap_07_urbino_ferrara_fiefs:0 "收回公爵采邑：乌尔比诺与费拉拉"
 oe_msn_pap_07_urbino_ferrara_fiefs_desc:0 "乌尔比诺的蒙特费尔特罗公爵与费拉拉的埃斯特家族曾以教宗代理自居，终归须向圣座缴还采邑。将显赫[subjects|e]故土纳入直属[core|e]，既能提振教廷[crown_power|e]，亦可安抚地方贵族[estates|e]。"
 oe_msn_pap_07_urbino_ferrara_fiefs_req_tt:0 "控制乌尔比诺与费拉拉（可经由附庸），自身及附庸地点不少于 32 处，且贵族阶层满意度不低于 50%。"
 oe_msn_pap_08_arbiter_of_italy:0 "意大利仲裁者：完整圣彼得教产"
 oe_msn_pap_08_arbiter_of_italy_desc:0 "西起第勒尼安海滨、东抵波河三角洲，横贯中部的完整圣彼得教产足以制衡亚平宁半岛各路诸侯。依托近代[fort|e]防线与精锐常备[army|e]，罗马将以无可争议的[great_power|e]气度与[diplomatic_reputation|e]仲裁意大利风云。"
 oe_msn_pap_08_arbiter_of_italy_req_tt:0 "宗教改革时代起，控制罗马、博洛尼亚与安科纳，拥有棱堡或兵营，且为列强或商税月收入不低于 90。"
 oe_msn_pap_09_vatican_library_humanism:0 "梵蒂冈图书馆与罗马人文复兴"
 oe_msn_pap_09_vatican_library_humanism_desc:0 "尼古拉五世与西斯都四世广搜流散的希腊抄本与拉丁古典著作，向全欧学者敞开梵蒂冈图书馆大门。拥抱人文主义[institutions|e]并大兴艺文[buildings|e]，令罗马城邦兼收[literacy|e]昌明与[cultural_tradition|e]极盛之誉。"
 oe_msn_pap_09_vatican_library_humanism_req_tt:0 "文艺复兴时代起，控制罗马，接纳文艺复兴思潮，且拥有图书馆或艺术学院。"
 oe_msn_pap_10_saint_peters_basilica:0 "营建圣彼得大教堂巍峨穹顶"
 oe_msn_pap_10_saint_peters_basilica_desc:0 "布拉曼特、拉斐尔与米开朗基罗于使徒墓上筑起巍峨穹顶，令每一位步入罗马的朝圣者心生敬畏。倾注巨额[gold|e]营造圣殿令[capital|e]焕然一新，大幅跃升[development|e]并播扬宗座[prestige|e]。"
 oe_msn_pap_10_saint_peters_basilica_req_tt:0 "控制罗马，金币不低于 320，首都发展度不低于 22，且拥有大教堂。"
 oe_msn_pap_11_propaganda_fide_missions:0 "普世传信部：远洋宗座传教团"
 oe_msn_pap_11_propaganda_fide_missions_desc:0 "罗马多语种活字印坊昼夜不息，传教团乘远洋帆船自果阿直抵长崎，将普世传信部的福音播撒四海五洲。融汇跨洲[diplomacy|e]网络与远洋[trade|e]航线，令宗座[religious_influence|e]与域外学术[advances|e]交相辉映。"
 oe_msn_pap_11_propaganda_fide_missions_req_tt:0 "宗教改革时代起，控制罗马，稳定度不低于 15，拥有印刷工坊或港务署，且拥有至少 4 座港口或商税月收入不低于 75。"
 oe_msn_pap_12_kingdom_of_god_on_earth:0 "永恒双钥：地上神国荣光"
 oe_msn_pap_12_kingdom_of_god_on_earth_desc:0 "世俗之剑与天国双钥此刻合而为一，从阿尔卑斯山麓南至墨西拿海峡，列邦诸侯尽皆俯首归心罗马圣座。凭借至高神圣[legitimacy|e]与[capital|e]无匹[prosperity|e]，永恒之城终以[great_power|e]威仪裁断基督教世界命运。"
 oe_msn_pap_12_kingdom_of_god_on_earth_req_tt:0 "专制时代起，控制罗马、博洛尼亚与拉文纳，稳定度不低于 18，首都发展度不低于 30，且为列强或掌控不少于 55 处地点。"
