l_simp_chinese:
 OE_TFR_PANEL_HELP: "逐国设置规模，0为关闭；陆军上限100,000人。每年补充一次，金币不足1000时停止。"
 OE_TFR_SIZE_TT: "现有正规军编制／目标编制。征召兵不计入；现有兵力超过目标时不会裁军。人数不足一个完整团的缺额保留至以后。"
 OE_TFR_SOLDIERS: "陆军人数"
 OE_TFR_SHIPS: "海军艘数"
 OE_TFR_COST_TT: "年度补充由各军区自行支付。陆军按轻步兵→重步兵→轻骑兵→重骑兵→炮兵，每种一个团循环；海军按重型帆船→桨帆船→桨帆船→桨帆船循环。顺序跨年保留，尚未解锁的类别暂跳过。\n\n征募基础价目（金币／千人）：轻步20、重步30、轻骑60、重骑100、炮兵100；舰船按每千名船员500金币计。应用对应兵种建造费用修正，最低费用为基础价的10%且不少于1金币。人力／水手按型号完整编制扣除。每次生成前检查1000金币门槛及资源，不举债补充。采用军区当前可用的原版型号。"
 OE_TFR_COUNTRY: "军区"
 OE_TFR_UNIT: "单位"
 OE_TFR_CURRENT: "现有规模"
 OE_TFR_TARGET: "目标规模"
 OE_TFR_TARGET_TT: "使用右侧上下箭头调整目标。\n陆军：每次增减1,000人；按住Shift增减10,000人。\n海军：每次增减1艘；按住Shift增减10艘。\n目标为0时关闭年度补充。"
 OE_TFR_INCREASE: "增加目标：陆军1,000人／海军1艘"
 OE_TFR_INCREASE_FAST: "增加目标：陆军10,000人／海军10艘"
 OE_TFR_DECREASE: "减少目标：陆军1,000人／海军1艘"
 OE_TFR_DECREASE_FAST: "减少目标：陆军10,000人／海军10艘"
