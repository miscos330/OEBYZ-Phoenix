 oe_dip2_dec_audit_diplomatic_corps.title: "检阅使团与驻外密网"
 oe_dip2_dec_audit_diplomatic_corps.desc: "召回并稽核各国驻外使节与情报据点的账册与密档，肃清旧日泄密风波与外交裂痕残留，整饬使团纪律并在五年内扩大外交容量与声誉。冷却十年。"
 oe_dip2_dec_audit_diplomatic_corps.a: "拨付整顿经费，全面核查驻外使团与密网。"
 oe_dip2_player_only_tt: "仅限玩家国家手动执行此项使团稽核"
 oe_dip2_audit_corps_cd_tt: "当前未处于使团稽核的十年冷却期内"
 STATIC_MODIFIER_NAME_oe_dip2_cipher_advantage: "破译敌军密电优势"
 STATIC_MODIFIER_DESC_oe_dip2_cipher_advantage: "通过破译敌国军政密码，我方参谋与谍报司洞悉其调动与城防薄弱点，显著提升围城效率与战术优势。"
 STATIC_MODIFIER_NAME_oe_dip2_cipher_compromised: "密电系统失守"
 STATIC_MODIFIER_DESC_oe_dip2_cipher_compromised: "外国密探已破译我方部分通讯密本，要塞布防与反间体系陷入被动。"
 STATIC_MODIFIER_NAME_oe_dip2_cipher_scandal: "密信窃听外交风波"
 STATIC_MODIFIER_DESC_oe_dip2_cipher_scandal: "破译外国使馆密件的行径被公开揭露，各国宫廷对我方使节戒备重重。"
 STATIC_MODIFIER_NAME_oe_dip2_field_codebook_broken: "敌军战地密码本破译"
 STATIC_MODIFIER_DESC_oe_dip2_field_codebook_broken: "前线缴获并译出敌军野战密码本，我军得以抢占补给要道与围城先机。"
 STATIC_MODIFIER_NAME_oe_dip2_exile_pretender_shadow: "流亡宣称者阴影"
 STATIC_MODIFIER_DESC_oe_dip2_exile_pretender_shadow: "受外国重金扶持的流亡王族在境外频发檄文，不断侵蚀王权正统并煽动贵族与地方骚动。"
 STATIC_MODIFIER_NAME_oe_dip2_pretender_rally: "境外宣称攻势奏效"
 STATIC_MODIFIER_DESC_oe_dip2_pretender_rally: "我方扶持的流亡宣称者在敌国掀起倒戈潮，显著提振我方谍网声势与外交威望。"
 STATIC_MODIFIER_NAME_oe_dip2_hostage_surety_mod: "皇室质子担保威信"
 STATIC_MODIFIER_DESC_oe_dip2_hostage_surety_mod: "外国王族以质子身份留驻我方宫廷，彰显我朝在外交与盟约中的担保地位。"
 STATIC_MODIFIER_NAME_oe_dip2_hostage_goodwill_mod: "礼送质子仁信美誉"
 STATIC_MODIFIER_DESC_oe_dip2_hostage_goodwill_mod: "以隆重礼遇护送皇室质子平安归国，赢得诸国君主对我朝信义的赞誉。"
 STATIC_MODIFIER_NAME_oe_dip2_foreign_talent_surge: "延揽客卿大师热潮"
 STATIC_MODIFIER_DESC_oe_dip2_foreign_talent_surge: "重金礼聘的外邦硕学与政务大师带来全新著述与见识，推动学术研究与谍报视野齐进。"
 STATIC_MODIFIER_NAME_oe_dip2_foreign_marshal_surge: "外邦名将整军之效"
 STATIC_MODIFIER_DESC_oe_dip2_foreign_marshal_surge: "新投效我朝的外邦宿将革新军中操典与阵法，稳步提升陆军传统与战场战术。"
 STATIC_MODIFIER_NAME_oe_dip2_talent_retention_reform: "宫廷留才整顿"
 STATIC_MODIFIER_DESC_oe_dip2_talent_retention_reform: "痛定思痛后提高核心官僚俸禄并严防外国掮客渗透，重振学术与反间防线。"
 STATIC_MODIFIER_NAME_oe_dip2_dynastic_guarantor: "跨国王朝法统担保者"
 STATIC_MODIFIER_DESC_oe_dip2_dynastic_guarantor: "邻邦承认我方王室在继承顺位中的优先地位，大幅增强本朝外交声誉与统治正统。"
 STATIC_MODIFIER_NAME_oe_dip2_dynastic_rift: "王朝继承公开裂痕"
 STATIC_MODIFIER_DESC_oe_dip2_dynastic_rift: "公开驳回邻邦的王朝继承通牒引发法统争议，令宫廷外交声誉与正统度短暂受挫。"
 STATIC_MODIFIER_NAME_oe_dip2_whisper_network: "宫廷暗桩密网"
 STATIC_MODIFIER_DESC_oe_dip2_whisper_network: "御前密使织就的耳目网络严防外谍渗透并震慑不轨之徒，但也令大贵族心怀猜忌。"
 STATIC_MODIFIER_NAME_oe_dip2_court_calm_mod: "朝堂肃清暂稳"
 STATIC_MODIFIER_DESC_oe_dip2_court_calm_mod: "通过果断流放或肃清不安分派系，宫廷与地方叛乱势头得以暂时压制。"
 STATIC_MODIFIER_NAME_oe_dip2_cipher_bureau_mod: "常设御前密电局"
 STATIC_MODIFIER_DESC_oe_dip2_cipher_bureau_mod: "专职密码破译官与反间书记官常年轮值，为国家提供持久稳定的情报攻防优势。"
 STATIC_MODIFIER_NAME_oe_dip2_corps_audited_mod: "使团稽核整饬新风"
 STATIC_MODIFIER_DESC_oe_dip2_corps_audited_mod: "经过全面稽核的驻外使团运转高效，外交容量、外交官补充与国际声誉同步抬升。"
 STATIC_MODIFIER_NAME_oe_dip2_royal_hostage_char: "留驻宫廷皇室质子"
 STATIC_MODIFIER_DESC_oe_dip2_royal_hostage_char: "作为跨国和平担保留驻他国宫廷的王族质子，享礼遇而不得领兵或入阁执政。"
 STATIC_MODIFIER_NAME_oe_dip2_poached_master_char: "新聘外邦客卿大师"
 STATIC_MODIFIER_DESC_oe_dip2_poached_master_char: "应重金礼聘转投新主的杰出名臣或宿将，正意气风发地施展平生所学。"
 STATIC_MODIFIER_NAME_oe_dip2_court_whisperer_char: "御前密敕暗桩总管"
 STATIC_MODIFIER_DESC_oe_dip2_court_whisperer_char: "奉君主密令暗中监听朝堂与使馆动向的腹心耳目，不再兼任野战统帅。"
 oe_dip2.1.title: "密信破译行迹败露"
 oe_dip2.1.desc: "我方潜伏在外国使馆邮路上的密探在抄录军政密函时被对方卫队撞破，虽勉强焚毁了部分底稿，但密蜡印记与联络暗号已落入敌手。对方使节正气势汹汹地要求宫廷给个交代。"
 oe_dip2.1.a: "公开矢口否认，硬扛外交风波"
 oe_dip2.1.a.tt: "承担两年 #Y 密信窃听外交风波#!（外交声誉与谍网构筑下降），保全暗线骨干与国库。"
 oe_dip2.1.b: "推出替罪密使并花钱平息丑闻"
 oe_dip2.1.b.tt: "损失 #R 15#! 威望与 #R 35#! 金币，迅速切割关系以避免长期外交声誉惩罚。"
 oe_dip2.2.title: "敌军战地密码本破译成功"
 oe_dip2.2.desc: "密电室彻夜灯火通明——密码书记官终于从截获的军邮中比对出敌军野战司令部的最新换表规律。敌军粮秣车队的转运日期、援军行军路线以及城防换防口令已赫然摊在御前案头。"
 oe_dip2.2.a: "火速密发前线统帅，抢攻薄弱环节"
 oe_dip2.2.a.tt: "获得两年 #Y 敌军战地密码本破译#!（围城能力与军事战术提升）并增加 #G +5#! 陆军传统。"
 oe_dip2.2.b: "严守绝密，转作外交与后续渗透筹码"
 oe_dip2.2.b.tt: "获得 #G +10#! 威望，若目标国仍在交涉视野内则额外增补 #G +15#! 谍网。"
 oe_dip2.3.title: "外国宫廷暗中资助流亡宣称者"
 oe_dip2.3.desc: "边防密报证实，敌对列强正挥金如土资助流亡在外的我朝王族宣称者。盖有伪造国玺的讨逆檄文与许诺封邑的密信正通过走私商船潜入国内，部分失意大贵族已开始暗通款曲。"
 oe_dip2.3.a: "斥重金遣死士跨国剪除流亡团伙"
 oe_dip2.3.a.tt: "支付高额秘密经费，立即清除 #Y 流亡宣称者阴影#! 负面状态。"
 oe_dip2.3.b: "退让怀柔大贵族以稳固正统与朝局"
 oe_dip2.3.b.tt: "牺牲 #R 10#! 威望安抚朝臣，换取 #G +5#! 正统度与 #G +3#! 稳定度。"
 oe_dip2.3.c: "严饬内廷反间并硬扛流言风波"
 oe_dip2.3.c.tt: "获得三年 #Y 朝堂肃清暂稳#!（压低叛乱增长与稳定度维持成本），不耗国库。"
 oe_dip2.4.title: "流亡傀儡在敌国掀起倒戈风波"
 oe_dip2.4.desc: "我方重金资助的流亡宣称者已在敌国边境集结起一批不满现状的失意骑士与旧部。虽然尚未颠覆其王座，但敌方朝堂顿时人心惶惶，不少边防军官秘密向我方驻外密探递出了投诚试探。"
 oe_dip2.4.a: "趁势扩大宣传攻势，震动敌国朝野"
 oe_dip2.4.a.tt: "获得三年 #Y 境外宣称攻势奏效#!（谍网构筑与月度威望提升）并立即获得 #G +10#! 威望。"
 oe_dip2.4.b: "低调收编倒戈军官，榨取军事情报"
 oe_dip2.4.b.tt: "获得 #G +4#! 陆军传统，并对目标国追加 #G +15#! 点谍网。"
 oe_dip2.5.title: "外国重金挖走我方宫廷大师"
 oe_dip2.5.desc: "枢密院传来令人震怒的急报：一名备受器重的宫廷才俊竟在昨夜携带着私人手稿悄然离境，现已现身于外国君主的御前阶下。调查表明，敌国驻外密探早在数月前便开出了令人咋舌的黄金俸禄。"
 oe_dip2.5.a: "发出严正外交抗议并反制其驻馆谍网"
 oe_dip2.5.a.tt: "挽回 #G +5#! 威望，并趁机对挖角国反插 #G +15#! 点谍网以备报复。"
 oe_dip2.5.b: "痛定思痛，拨款推行宫廷留才与反间整顿"
 oe_dip2.5.b.tt: "花费 #R 60#! 金币，获得五年 #Y 宫廷留才整顿#!（研究速度与反间效率提升）。"
 oe_dip2.6.title: "客卿大师进呈治国与兵法策论"
 oe_dip2.6.desc: "近日经由秘密渠道重金延揽入朝的外邦名家已渐渐熟悉本朝风物。在御前奏对中，他呈上一卷融合异域经验与本朝实情的厚重策论，令在座文武大臣皆为之动容。"
 oe_dip2.6.a: "颁行书院与礼部，化作本族文化薪火"
 oe_dip2.6.a.tt: "为主流文化注入 #G +5#! 文化传统，并额外获得 #G +8#! 威望。"
 oe_dip2.6.b: "交由枢密院与水陆诸将编入新式操典"
 oe_dip2.6.b.tt: "立即获得 #G +6#! 陆军传统与 #G +4#! 海军传统。"
 oe_dip2.7.title: "跨国王朝继承权外交通牒"
 oe_dip2.7.desc: "一封措辞强硬却引经据典的王室通牒送抵宫廷：某同宗邻国援引往昔联姻谱系与宗法旧约，趁我朝继承格局未稳之际，公开要求承认其王室在我方继承顺位中的优先法统。满朝文武霎时议论沸腾。"
 oe_dip2.7.a: "权宜承认其优先顺位，换取和平与国内喘息"
 oe_dip2.7.a.tt: "获得 #G +3#! 稳定度并改善双边关系，同时令通牒方获得十年 #Y 跨国王朝法统担保者#! 红利。"
 oe_dip2.7.b: "支付巨额婚嫁法统赔款，买断其继承声索"
 oe_dip2.7.b.tt: "向对方赔付一笔丰厚黄金，彻底平息本次王朝法统争议而不失王冠独立。"
 oe_dip2.7.c: "严词驳回无理僭越，宁以兵戎捍卫王统"
 oe_dip2.7.c.tt: "获得 #G +10#! 威望，但承受五年 #Y 王朝继承公开裂痕#!，且对方将获得五年 #Y 宣称王位#! 宣战理由。"
 oe_dip2.8.title: "皇室质子处置裁决"
 oe_dip2.8.desc: "留驻本国宫廷充当和平担保的外国皇室质子已度过数载春秋，其母国使节近日频频探询归期。究竟是以君子大度隆重护送其返国换取万邦称颂，还是趁机索取一笔丰厚的皇室赎金，全凭御前圣断。"
 oe_dip2.8.a: "以国礼护送质子荣归故国"
 oe_dip2.8.a.tt: "将皇室质子礼送归国，获得 #G +15#! 威望、五年 #Y 礼送质子仁信美誉#! 并大幅提升母国好感。"
 oe_dip2.8.b: "向其母国索取高额皇室赎金后放行"
 oe_dip2.8.b.tt: "遣返皇室质子并收获一笔可观的皇室赎金，但会令其母国对我方怀恨。"
 oe_dip2.8.c: "暂缓归期，继续将其留置宫廷观望"
 oe_dip2.8.c.tt: "暂不释放质子，仅损失 #R 2#! 威望，日后仍可再次裁决。"
 oe_dip2.9.title: "宫廷暗桩呈递机密黑档"
 oe_dip2.9.desc: "深夜的御书房内，受我方密敕的暗桩总管呈上一份封漆完好的密报：数名地方豪门与外邦商贾私下串联、偷逃关津并窥探军情的铁证尽在其中。这份黑档既可化作充盈内帑的利器，亦可成为震慑朝野的雷霆。"
 oe_dip2.9.a: "暗中敲打勒索，令其破财消灾充盈国库"
 oe_dip2.9.a.tt: "秘密征收一笔可观罚款充入国库，仅微损 #R 5#! 威望。"
 oe_dip2.9.b: "公之于众并雷厉肃清，彻底震慑不轨之徒"
 oe_dip2.9.b.tt: "获得 #G +4#! 稳定度与五年 #Y 朝堂肃清暂稳#!，显著压低叛乱增长。"
 oe_dip2.10.title: "【W1 审计读数】谍报、宫廷与内阁实务状态"
 oe_dip2.10.desc: "#T v12.5 W1（oe_dip2_）只读验收读数#!\n· 国家：[ROOT.GetCountry.GetName]\n· 累计 W1 谍报/宫廷/决议行动次数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_ops').GetValue|0]#!\n· 常设御前密电局 (0/1)：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_bureau').GetValue|0]#!  |  宫廷暗桩密网 (0/1)：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_whisper').GetValue|0]#!  |  破译军情优势 (0/1)：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_cipher').GetValue|0]#!\n· W4 跨工位联动软标记 — 常备粮仓激活 (oe_dip2_granary_active_flag)：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_granary').GetValue|0]#!  |  反劣币整顿激活 (oe_dip2_coinage_active_flag)：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_coinage').GetValue|0]#!\n· 当前留驻宫廷之皇室质子人数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_dip2_rd_hostages').GetValue|0]#!"
 oe_dip2.10.a: "关闭 W1 审计读数册"
 oe_dip2.10.a.tt: "本读数事件不改动任何游戏状态。"
