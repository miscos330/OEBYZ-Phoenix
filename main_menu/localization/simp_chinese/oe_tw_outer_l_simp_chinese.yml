 oe_tw_need_authority_tt: "[oe_tu_authority|e]至少为#Y 4#!"
 oe_tw.1.t: "授予尊号"
 oe_tw.1.d: "拜占庭人把周边的君主排进一个“君王大家庭”：皇帝是父，正教诸侯是子，与皇帝对等的大君主是兄弟，其余的君主是友。皇帝还把宫廷尊号授给外国君主，用荣誉和年金换取他们的忠诚。1082年，阿历克塞一世授予威尼斯总督首席尊者的尊号；1402年，约翰七世在君士坦丁堡授予塞尔维亚的斯特凡·拉扎列维奇专制公的尊号。\n\n受封者：[SCOPE.sCharacter('oe_tw_tr').GetName]，[SCOPE.sCountry('oe_tw_tc').GetName]的君主。位次：[SCOPE.sCountry('oe_tw_tc').Custom('OeTwRank')]。现有尊号：[SCOPE.sCountry('oe_tw_tc').Custom('OeTwTitleName')]。\n\n专制公：只授予“子”，在位君主中至多#Y 2#!人；威望#R −20#!，帝国权威#R −8#!。\n塞巴斯托克拉托：只授予“子”，在位君主中至多#Y 2#!人；威望#R −15#!，帝国权威#R −6#!。\n凯撒：任何位次，在位君主中至多#Y 1#!人；不授予已有帝国凯撒尊号者；威望#R −15#!，帝国权威#R −10#!。\n首席尊者：任何位次，在位君主中至多#Y 3#!人；威望#R −10#!，帝国权威#R −4#!。\n已有较高尊号的君主不能改授较低的尊号；不符合条件或我们负担不起的尊号不会出现在选项里。"
 oe_tw.1.a: "授予专制公"
 oe_tw.1.a.tt: "威望#R −20#!，[oe_tu_authority|e]#R −8#!\n受封君主终身获得专制公[oe_tu_dignity|e]（每月威望#G +0.1#!），原有较低的尊号收回\n该国对我们的好感#G +40#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +15#!\n该国#Y 5#!年内不能再受封"
 oe_tw.1.b: "授予塞巴斯托克拉托"
 oe_tw.1.b.tt: "威望#R −15#!，[oe_tu_authority|e]#R −6#!\n受封君主终身获得塞巴斯托克拉托[oe_tu_dignity|e]（每月威望#G +0.08#!），原有较低的尊号收回\n该国对我们的好感#G +30#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +12#!\n该国#Y 5#!年内不能再受封"
 oe_tw.1.c: "授予凯撒尊号"
 oe_tw.1.c.tt: "威望#R −15#!，[oe_tu_authority|e]#R −10#!\n受封君主终身获得凯撒[oe_tu_dignity|e]（每月威望#G +0.08#!），原有较低的尊号收回\n该国对我们的好感#G +30#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +12#!\n该国#Y 5#!年内不能再受封"
 oe_tw.1.e: "授予首席尊者"
 oe_tw.1.e.tt: "威望#R −10#!，[oe_tu_authority|e]#R −4#!\n受封君主终身获得首席尊者[oe_tu_dignity|e]（每月威望#G +0.05#!），原有较低的尊号收回\n该国对我们的好感#G +25#!（每年回落#Y 2#!），君主在位期间另#G +10#!\n若该国是帝国的附庸：对宗主的忠诚#G +8#!\n该国#Y 5#!年内不能再受封"
 oe_tw.1.f: "暂不授予"
 oe_tw.1.f.tt: "不花费任何东西"
 oe_tw.2.t: "旧省归来"
 oe_tw.2.d: "帝国从不轻易放弃失去的行省。地籍册里还留着那里的村庄和应纳的税额；土地收回之后，皇帝就派清丈官（anagrapheus）去重新丈量、登记人户，把它重新写进帝国的账簿。\n\n曾随军区叛离的[GetCountry('BYZ').Custom('OeTwRetRegion')]，有[GetCountry('BYZ').MakeScope.GetVariable('oe_tw_ret_count').GetValue|0]处地点重新回到帝国手中。\n今年旧省归来带来的复兴狂热：+[GetCountry('BYZ').MakeScope.GetVariable('oe_tw_hope_year').GetValue|0]（只在罗马再征服进行中计入，每收回一处#Y +1#!，每年最多#Y +5#!）。"
 oe_tw.2.a: "重设官署，重造地籍"
 oe_tw.2.a.tt: "[oe_tu_authority|e]#G +3#!"
 oe_tw.2.b: "宽赦随叛的旧部"
 oe_tw.2.b.tt: "每个军区忠诚#G +3#!，并计入忠诚目标#Y 5#!年"
 oe_tw.3.t: "来自君士坦丁堡的金玺诏书"
 oe_tw.3.d: "罗马皇帝的使节带来一份盖着金印的诏书。皇帝把[ROOT.GetCountry.Custom('OeTwTitleName')]的尊号授予我们的君主[SCOPE.sCharacter('oe_tw_me').GetName]，随诏书送来的还有礼袍和年金。在君士坦丁堡的宫廷里，这意味着我们在“君王大家庭”中有了更靠前的位置；在我们自己的宫廷里，有人为此骄傲，也有人担心欠下皇帝的人情。"
 oe_tw.3.a: "接受尊号"
 oe_tw.3.a.tt: "（以下效果已经生效）我们的君主终身持有这一[oe_tu_dignity|e]，每月威望上升\n我们对罗马帝国的好感上升\n若我们是罗马帝国的附庸：对宗主的忠诚上升"
 oe_tw.1.d_pre: "拜占庭人把周边的君主排进一个“君王大家庭”：皇帝是父，正教诸侯是子，与皇帝对等的大君主是兄弟，其余的君主是友。皇帝还把宫廷尊号授给外国君主，用荣誉和年金换取他们的忠诚。1082年，阿历克塞一世授予威尼斯总督首席尊者的尊号；1160年代，曼努埃尔一世为匈牙利王子贝拉首创了专制公的尊号。\n\n受封者：[SCOPE.sCharacter('oe_tw_tr').GetName]，[SCOPE.sCountry('oe_tw_tc').GetName]的君主。位次：[SCOPE.sCountry('oe_tw_tc').Custom('OeTwRank')]。现有尊号：[SCOPE.sCountry('oe_tw_tc').Custom('OeTwTitleName')]。\n\n专制公：只授予“子”，在位君主中至多#Y 2#!人；威望#R −20#!，帝国权威#R −8#!。\n塞巴斯托克拉托：只授予“子”，在位君主中至多#Y 2#!人；威望#R −15#!，帝国权威#R −6#!。\n凯撒：任何位次，在位君主中至多#Y 1#!人；不授予已有帝国凯撒尊号者；威望#R −15#!，帝国权威#R −10#!。\n首席尊者：任何位次，在位君主中至多#Y 3#!人；威望#R −10#!，帝国权威#R −4#!。\n已有较高尊号的君主不能改授较低的尊号；不符合条件或我们负担不起的尊号不会出现在选项里。"
