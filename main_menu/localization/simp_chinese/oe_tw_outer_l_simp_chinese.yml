 oe_tw_grant_title: "授予尊号"
 oe_tw_grant_title_desc: "把宫廷[oe_tu_dignity|e]授给“君王大家庭”中的一位君主：帝国附庸或罗马文明圈成员的在位成年君主。受封君主的国家对我们的好感上升；若它是帝国的附庸，对宗主的忠诚也上升。同一国家#Y 5#!年内只能受封一次。\n\n专制公：只授予“子”，在位君主中至多#Y 2#!人；威望#R −20#!，[oe_tu_authority|e]#R −8#!。\n塞巴斯托克拉托：只授予“子”，在位君主中至多#Y 2#!人；威望#R −15#!，帝国权威#R −6#!。\n凯撒：任何位次，在位君主中至多#Y 1#!人；不授予已有帝国凯撒尊号者；威望#R −15#!，帝国权威#R −10#!。\n首席尊者：任何位次，在位君主中至多#Y 3#!人；威望#R −10#!，帝国权威#R −4#!。\n已有较高尊号的君主不能改授较低的尊号；改授较高的尊号时，原尊号收回。尊号随君主终身，不传给继任者。"
 oe_tw_grant_title_select: "选择受封的君主"
 oe_tw_grant_title_none: "@trigger_no!没有可以受封的君主"
 oe_tw_grant_cd_tt: "该国近#Y 5#!年内已受过[oe_tu_dignity|e]"
 oe_tw_grant_title_effect: "在随后的事件中选择要授予的尊号"
