 STATIC_MODIFIER_NAME_oe_tw_rank_son_mod: "君王大家庭：子"
 STATIC_MODIFIER_DESC_oe_tw_rank_son_mod: "在君士坦丁堡的宫廷礼仪里，皇帝是“君王大家庭”的父亲。正教诸侯的君主被称作皇帝的“子”，位次最亲。本国与罗马帝国彼此的好感因此上升。"
 STATIC_MODIFIER_NAME_oe_tw_rank_brother_mod: "君王大家庭：兄弟"
 STATIC_MODIFIER_DESC_oe_tw_rank_brother_mod: "与皇帝地位相当的大君主被称作皇帝的“兄弟”，这是外国君主在拜占庭礼仪里能得到的最高位次。本国与罗马帝国彼此的好感因此上升。"
 STATIC_MODIFIER_NAME_oe_tw_rank_friend_mod: "君王大家庭：友"
 STATIC_MODIFIER_DESC_oe_tw_rank_friend_mod: "其余的君主被称作皇帝的“友”。他们在大家庭里有一席之地，只是离父亲最远。本国与罗马帝国彼此的好感因此略有上升。"
 STATIC_MODIFIER_NAME_oe_tw_title_despotes: "专制公"
 STATIC_MODIFIER_DESC_oe_tw_title_despotes: "罗马皇帝授予的最高尊号，位在皇帝之下、众尊号之首。1163年曼努埃尔一世首创此号，授予匈牙利王子贝拉；1402年，代叔父曼努埃尔二世摄政的约翰七世在君士坦丁堡把它授予塞尔维亚的斯特凡·拉扎列维奇。"
 STATIC_MODIFIER_NAME_oe_tw_title_sebastokrator: "塞巴斯托克拉托"
 STATIC_MODIFIER_DESC_oe_tw_title_sebastokrator: "约1081年阿历克塞一世为兄长伊萨克设立，位在凯撒之上；1163年专制公设立后居第二。保加利亚和塞尔维亚的宫廷后来也仿用此号。"
 STATIC_MODIFIER_NAME_oe_tw_title_kaisar: "凯撒（外藩）"
 STATIC_MODIFIER_DESC_oe_tw_title_kaisar: "古老的凯撒之号在12世纪降为第三等尊号。705年，查士丁尼二世把它授予保加利亚汗特尔维尔，这是外国君主受封凯撒的著名先例。此号与帝国宫廷自己的凯撒（皇位继承人选）无关。"
 STATIC_MODIFIER_NAME_oe_tw_title_protosebastos: "首席尊者"
 STATIC_MODIFIER_DESC_oe_tw_title_protosebastos: "阿历克塞一世所设的尊号。1082年，他的金玺诏书授予威尼斯总督首席尊者之号并附年俸，以换取威尼斯舰队对诺曼人作战。"
 STATIC_MODIFIER_NAME_oe_tw_court_despotes: "君主受封专制公"
 STATIC_MODIFIER_DESC_oe_tw_court_despotes: "本国君主身受罗马皇帝授予的专制公尊号。若本国是罗马帝国的附庸，对宗主的忠诚因此提高。"
 STATIC_MODIFIER_NAME_oe_tw_court_sebastokrator: "君主受封塞巴斯托克拉托"
 STATIC_MODIFIER_DESC_oe_tw_court_sebastokrator: "本国君主身受罗马皇帝授予的塞巴斯托克拉托尊号。若本国是罗马帝国的附庸，对宗主的忠诚因此提高。"
 STATIC_MODIFIER_NAME_oe_tw_court_kaisar: "君主受封凯撒"
 STATIC_MODIFIER_DESC_oe_tw_court_kaisar: "本国君主身受罗马皇帝授予的凯撒尊号。若本国是罗马帝国的附庸，对宗主的忠诚因此提高。"
 STATIC_MODIFIER_NAME_oe_tw_court_protosebastos: "君主受封首席尊者"
 STATIC_MODIFIER_DESC_oe_tw_court_protosebastos: "本国君主身受罗马皇帝授予的首席尊者尊号。若本国是罗马帝国的附庸，对宗主的忠诚因此提高。"
