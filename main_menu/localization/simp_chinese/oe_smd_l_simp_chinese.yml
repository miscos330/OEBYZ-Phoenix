 oe_smd.3.t: "坎塔库泽诺斯家的新娘"
 oe_smd.3.desc_d: "#F 专制公斯特凡没有儿子，继承人是外甥久拉贾·布兰科维奇。史书说，久拉贾娶了约翰六世皇帝的孙女伊琳妮·坎塔库泽妮（成婚的年份说法不一）；伊琳妮的兄弟托马斯日后做了塞尔维亚的统兵大将。#!\n\n如今，塞尔维亚的使者来提亲：专制公的继承人要娶妻，宫里有没有一位出身好的姑娘？专制公的[oe_tu_dignity|e]本是皇帝授予的，这门亲事顺理成章。"
 oe_smd.3.desc_x: "#F 专制公斯特凡没有儿子，继承人是外甥久拉贾·布兰科维奇。史书说，久拉贾娶了约翰六世皇帝的孙女伊琳妮·坎塔库泽妮（成婚的年份说法不一）；伊琳妮的兄弟托马斯日后做了塞尔维亚的统兵大将。#!\n\n如今，塞尔维亚的使者来提亲：专制公的继承人要娶妻，宫里有没有一位出身好的姑娘？"
 oe_smd.3.a: "许嫁一位坎塔库泽妮"
 oe_smd.3.a.tt: "嫁妆：花费#R 1#!个月的贸易与税收收入\n塞尔维亚对帝国好感#G +40#!，每年回落#Y 1#!\n塞尔维亚的宫廷里从此有了皇帝的亲戚。"
 oe_smd.3.b: "许嫁一位巴列奥略家的公主"
 oe_smd.3.b.tt: "嫁妆：花费#R 2#!个月的贸易与税收收入\n塞尔维亚对帝国好感#G +50#!，每年回落#Y 1#!\n皇家的女儿远嫁，宫里有人不满。"
 oe_smd.3.c: "婉拒"
 oe_smd.3.c.tt: "塞尔维亚对帝国好感#R −10#!，持续#Y 5#!年"
 oe_smd.4.t: "斯梅代雷沃的城墙"
 oe_smd.4.desc_t: "#F 1427年，专制公斯特凡去世，外甥久拉贾继位，按约把[GetLocationByKey('belgrad').GetName]还给了匈牙利，要在多瑙河边另起新都。[GetLocationByKey('smederevo').GetName]的要塞随即动工；一说它的城墙是照着君士坦丁堡的样子修的。#!\n\n如今，专制公的人来到宫里，问帝国能不能借几个懂城防的工匠。专制公夫人出身帝国，来人特意提起了这一层。"
 oe_smd.4.desc_x: "#F 1427年，专制公斯特凡去世，外甥久拉贾继位，按约把[GetLocationByKey('belgrad').GetName]还给了匈牙利，要在多瑙河边另起新都。[GetLocationByKey('smederevo').GetName]的要塞随即动工；一说它的城墙是照着君士坦丁堡的样子修的。#!\n\n如今，专制公的人来到宫里，问帝国能不能借几个懂城防的工匠。"
 oe_smd.4.a: "派工匠去"
 oe_smd.4.a.tt: "花费#R 2#!个月的贸易与税收收入\n塞尔维亚对帝国好感#G +20#!，持续#Y 10#!年\n斯梅代雷沃成为塞尔维亚的都城以后，那里得到[ShowModifier('oe_smd_walls')]，持续#Y 50#!年\n日后苏丹来围斯梅代雷沃时，城守住的几率#G +15%#!"
 oe_smd.4.b: "只送一笔钱"
 oe_smd.4.b.tt: "花费#R 1#!个月的贸易与税收收入\n日后苏丹来围斯梅代雷沃时，城守住的几率#G +5%#!"
 oe_smd.4.c: "京城的城墙自己都修不起"
 oe_smd.4.c.tt: "专制公只好自己想办法。"
 oe_smd.5.t: "流亡的专制公"
 oe_smd.5.desc_zt: "#F 1439年，[GetLocationByKey('smederevo').GetName]被围三个月后陷落。专制公久拉贾早已去了匈牙利；久拉贾的女儿马拉嫁在苏丹穆拉德的宫中。#!\n\n如今，专制公的使者找到了皇帝：请帝国在西方替主人说话，或者借一笔钱招兵。专制公手里只剩下零星几座城。专制公夫人出身帝国，使者特意提起了这一层。"
 oe_smd.5.desc_z: "#F 1439年，[GetLocationByKey('smederevo').GetName]被围三个月后陷落。专制公久拉贾早已去了匈牙利；久拉贾的女儿马拉嫁在苏丹穆拉德的宫中。#!\n\n如今，专制公的使者找到了皇帝：请帝国在西方替主人说话，或者借一笔钱招兵。专制公手里只剩下零星几座城。"
 oe_smd.5.desc_t: "#F 1439年，[GetLocationByKey('smederevo').GetName]被围三个月后陷落。专制公久拉贾早已去了匈牙利；久拉贾的女儿马拉嫁在苏丹穆拉德的宫中。#!\n\n如今，专制公的使者找到了皇帝：请帝国在西方替主人说话，或者借一笔钱招兵。塞尔维亚已经没有一寸土地留在专制公手里。专制公夫人出身帝国，使者特意提起了这一层。"
 oe_smd.5.desc_x: "#F 1439年，[GetLocationByKey('smederevo').GetName]被围三个月后陷落。专制公久拉贾早已去了匈牙利；久拉贾的女儿马拉嫁在苏丹穆拉德的宫中。#!\n\n如今，专制公的使者找到了皇帝：请帝国在西方替主人说话，或者借一笔钱招兵。塞尔维亚已经没有一寸土地留在专制公手里。"
 oe_smd.5.a: "在佛罗伦萨和布达替专制公说话"
 oe_smd.5.a.tt: "匈牙利和教廷对帝国好感#G +10#!，持续#Y 10#!年\n塞尔维亚（若还在）对帝国好感#G +20#!，持续#Y 10#!年\n日后匈牙利与苏丹议和时，更可能替专制公要回都城。"
 oe_smd.5.b: "借钱给专制公招兵"
 oe_smd.5.b.tt: "花费#R 3#!个月的贸易与税收收入\n专制公若日后回到斯梅代雷沃，#Y 1#!年后塞尔维亚还给帝国#Y 2#!个月的收入（付不起时有多少付多少）"
 oe_smd.5.c: "不能得罪苏丹"
 oe_smd.5.c.tt: "奥斯曼对帝国好感#G +10#!，持续#Y 5#!年\n塞尔维亚对帝国好感#R −20#!，持续#Y 10#!年"
 oe_smd.6.t: "匈雅提的求援"
 oe_smd.6.desc_lhv: "#F 1455年，[GetLocationByKey('novo_brdo').GetName]再陷，苏丹穆罕默德随即率大军与船队北上围攻[GetLocationByKey('belgrad').GetName]。匈雅提冲破河上封锁，又在城下打退总攻，苏丹负伤退兵；三个星期后，匈雅提死于营中瘟疫。#!\n\n如今，匈牙利的使者找到流亡的朝廷，说苏丹要沿多瑙河北上，仍请帝国出船出钱。照眼下的情形，[GetLocationByKey('belgrad').GetName]守住的机会约有#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_smd_bel_odds').GetValue|0]#!%。求援的信是匈雅提亲自派人送来的，城防眼下全仗这位老将。可皇帝眼下也在向苏丹纳贡，公然援匈必会惹怒苏丹。"
