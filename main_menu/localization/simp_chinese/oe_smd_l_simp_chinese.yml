 oe_smd.7.desc_x: "#F 1458年初，专制公拉扎尔·布兰科维奇去世。遗孀海伦娜是摩里亚专制公托马斯·巴列奥略之女；此后波斯尼亚王子斯特凡·托马舍维奇入主[GetLocationByKey('smederevo').GetName]，不久城门向苏丹打开，塞尔维亚亡国。#!\n\n如今，[GetLocationByKey('smederevo').GetName]的信使来到御前：专制公夫人向娘家问计，孤城难守，该怎么办？"
 oe_smd.7.a: "劝专制公夫人去找波斯尼亚"
 oe_smd.7.a.tt: "斯梅代雷沃将另寻波斯尼亚的庇护，多瑙河畔的变局照旧。"
 oe_smd.7.b: "劝专制公夫人向苏丹称臣，保住城"
 oe_smd.7.b.tt: "奥斯曼对帝国好感#G +10#!，持续#Y 10#!年\n若塞尔维亚尚不是附属国且与奥斯曼同为AI、互不交战，塞尔维亚成为奥斯曼的纳贡国\n斯梅代雷沃开城的期限推迟约十年（至1468–1469年）"
 oe_smd.7.c: "请专制公夫人带人来帝国"
 oe_smd.7.c.tt: "花费#R 1#!个月的贸易与税收收入\n#Y 10#!年内招民垦荒的花费减半、冷却缩短"
 oe_smd.90.t: "塞尔维亚与多瑙河：执行"
