 OE_SMD_SO_5: "南方诸侯：领主们的土地并入了奥斯曼。"
 OE_SMD_SO_2: "南方诸侯：普里莱普与韦尔布日德的领主向苏丹称臣。"
 OE_SMD_SO_1: "南方诸侯：普里莱普的领主向苏丹称臣。"
 OE_SMD_SO_F: "南方诸侯：领主国没有建成。"
 OE_SMD_SO_3: "南方诸侯：塞尔维亚或奥斯曼在玩家或帝国一方手里，此事没有发生。"
 OE_SMD_SO_X: "南方诸侯：这几年南方没有自立的领主。"
 OE_SMD_SO_W: "南方诸侯：还没到时候（1371年秋起）。"
 OE_SMD_KO_E1B1: "最后的要塞：贝尔格莱德顶住了苏丹的围攻，可斯梅代雷沃还是向苏丹开了城，塞尔维亚亡国。"
 OE_SMD_KO_E1B2: "最后的要塞：贝尔格莱德与斯梅代雷沃先后陷落，多瑙河防线崩塌，塞尔维亚亡国。"
 OE_SMD_KO_E1: "最后的要塞：斯梅代雷沃向苏丹开了城，塞尔维亚亡国。"
 OE_SMD_KO_E2: "最后的要塞：塞尔维亚凭纳贡多撑了十年，终究还是并入了奥斯曼。"
 OE_SMD_KO_E3B1: "最后的要塞：贝尔格莱德守住了，斯梅代雷沃也没有陷落，塞尔维亚在多瑙河畔留了下来。"
 OE_SMD_KO_E3: "最后的要塞：斯梅代雷沃没有向苏丹开城，塞尔维亚在多瑙河畔留了下来。"
 OE_SMD_KO_B1: "多瑙河防线：贝尔格莱德顶住了苏丹的大军与船队。"
 OE_SMD_KO_B2: "多瑙河防线：贝尔格莱德落入了奥斯曼手中。"
 OE_SMD_KO_14: "多瑙河防线：新布尔多再次落入奥斯曼手中。"
 OE_SMD_KO_12: "多瑙河防线：塞格德和约之后，专制公回到了斯梅代雷沃，仍向苏丹纳贡。"
 OE_SMD_KO_FG: "多瑙河防线：斯梅代雷沃陷落，塞尔维亚并入了奥斯曼，专制公流亡在外。"
 OE_SMD_KO_F1: "多瑙河防线：斯梅代雷沃陷落，专制公只剩下泽塔海边的几座城。"
 OE_SMD_KO_F2: "多瑙河防线：斯梅代雷沃顶住了苏丹的围攻。"
 OE_SMD_KO_10: "多瑙河防线：专制公把都城迁到了新修的斯梅代雷沃。"
 OE_SMD_KO_9: "多瑙河防线：贝尔格莱德还给了匈牙利。"
 OE_SMD_KO_78: "专制公国：贝尔格莱德成了专制公的都城，泽塔也归了塞尔维亚。"
 OE_SMD_KO_7: "专制公国：塞尔维亚不再向苏丹纳贡，贝尔格莱德成了专制公的都城。"
 OE_SMD_KO_68: "专制公国：塞尔维亚不再向苏丹纳贡，泽塔也归了塞尔维亚。"
 OE_SMD_KO_6: "专制公国：安卡拉之后，塞尔维亚不再向苏丹纳贡。"
 OE_SMD_KO_8: "泽塔：泽塔的领主把国家传给了塞尔维亚。"
 OE_SMD_KO_1: "科索沃：塞尔维亚成了苏丹的纳贡国。"
 OE_SMD_KO_2: "科索沃：塞尔维亚人没有向苏丹低头。"
 OE_SMD_KO_3: "科索沃：塞尔维亚或奥斯曼在玩家或帝国一方手里，此事没有发生。"
 OE_SMD_KO_X: "科索沃：苏丹没有北上与塞尔维亚决战。"
 OE_SMD_KO_W: "科索沃：还没到时候（1389年夏起）。"
