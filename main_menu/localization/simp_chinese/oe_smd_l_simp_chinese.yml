 oe_smd.6.a: "出船出钱"
 oe_smd.6.a.tt: "花费#R 3#!个月的贸易与税收收入\n日后苏丹围攻贝尔格莱德时，城守住的几率#G +10%#!\n匈牙利对帝国好感#G +20#!，持续#Y 10#!年\n奥斯曼对帝国好感#R −15#!，持续#Y 10#!年\n若帝国正向苏丹纳贡：苏丹的耐心#R −10#!"
 oe_smd.6.b: "只出钱"
 oe_smd.6.b.tt: "花费#R 1#!个月的贸易与税收收入\n日后苏丹围攻贝尔格莱德时，城守住的几率#G +5%#!\n匈牙利对帝国好感#G +10#!，持续#Y 10#!年"
 oe_smd.6.c: "不管"
 oe_smd.6.c.tt: "匈牙利人只好独自守卫贝尔格莱德。"
 oe_smd.7.t: "专制公夫人海伦娜"
 oe_smd.7.desc_ml: "#F 1458年初，专制公拉扎尔·布兰科维奇去世。遗孀海伦娜是摩里亚专制公托马斯·巴列奥略之女；此后波斯尼亚王子斯特凡·托马舍维奇入主[GetLocationByKey('smederevo').GetName]，不久城门向苏丹打开，塞尔维亚亡国。#!\n\n如今，[GetLocationByKey('smederevo').GetName]的信使来到御前：专制公夫人向娘家问计，孤城难守，该怎么办？专制公夫人的父亲托马斯仍在米斯特拉，娘家尚有立足之地。可皇帝也已经没有了京城。"
 oe_smd.7.desc_m: "#F 1458年初，专制公拉扎尔·布兰科维奇去世。遗孀海伦娜是摩里亚专制公托马斯·巴列奥略之女；此后波斯尼亚王子斯特凡·托马舍维奇入主[GetLocationByKey('smederevo').GetName]，不久城门向苏丹打开，塞尔维亚亡国。#!\n\n如今，[GetLocationByKey('smederevo').GetName]的信使来到御前：专制公夫人向娘家问计，孤城难守，该怎么办？专制公夫人的父亲托马斯仍在米斯特拉，娘家尚有立足之地。"
