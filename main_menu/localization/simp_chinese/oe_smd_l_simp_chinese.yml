 oe_smd.1.c: "不见"
 oe_smd.1.c.tt: "塞尔维亚人只好另想办法。"
 oe_smd.2.t: "科索沃的消息"
 oe_smd.2.desc_ky: "#F 1389年6月，拉扎尔与苏丹穆拉德在科索沃原野相遇，两人都死在那一天；塞尔维亚的贵族死伤殆尽。拉扎尔的遗孀米莉察为年幼的儿子斯特凡摄政。#!\n\n如今，消息从北方传来：塞尔维亚人在科索沃流了血，却没有向苏丹低头。"
 oe_smd.2.desc_k: "#F 1389年6月，拉扎尔与苏丹穆拉德在科索沃原野相遇，两人都死在那一天；塞尔维亚的贵族死伤殆尽。拉扎尔的遗孀米莉察为年幼的儿子斯特凡摄政。#!\n\n如今，消息从北方传来：塞尔维亚人在科索沃流了血，却没有向苏丹低头。"
 oe_smd.2.desc_y: "#F 1389年6月，拉扎尔与苏丹穆拉德在科索沃原野相遇，两人都死在那一天；塞尔维亚的贵族死伤殆尽。第二年夏天，拉扎尔的遗孀米莉察向新苏丹巴耶济德称臣。#!\n\n如今，消息从北方传来：塞尔维亚成了苏丹的纳贡国，塞尔维亚的兵要随苏丹出征了。"
 oe_smd.2.desc_x: "#F 1389年6月，拉扎尔与苏丹穆拉德在科索沃原野相遇，两人都死在那一天；塞尔维亚的贵族死伤殆尽。拉扎尔的遗孀米莉察为年幼的儿子斯特凡摄政。#!\n\n如今，消息从北方传来：塞尔维亚成了苏丹的纳贡国，塞尔维亚的兵要随苏丹出征了。"
