 oe_smd.1.t: "拉扎尔的使者"
 oe_smd.1.desc_euv: "#F 1386年，苏丹穆拉德取了[GetLocationByKey('nis').GetName]。据说[GetLocationByKey('krusevac').GetName]的拉扎尔大公随后在普洛奇尼克挡住了苏丹，又派人四处联络：波斯尼亚、匈牙利，也到了君士坦丁堡。#!\n\n如今，塞尔维亚的使者到了宫里：请帝国出钱，至少不要替苏丹出兵。照眼下的情形，到了决战的时候，塞尔维亚人不向苏丹低头的机会约有#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!%。两国的教会已经和解，使者在宫里受到了礼遇。使者还记得，马里查河之前帝国出过兵。何况皇帝自己也在向苏丹纳贡。"
