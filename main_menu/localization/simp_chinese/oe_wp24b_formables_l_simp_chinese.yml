l_simp_chinese:
 oe_wp24b_adv_rom_renovatio_senatus: "元老院复兴法典"
 oe_wp24b_adv_rom_renovatio_senatus_desc: "以帝国统一宪章重整元老院法权与各行省长官职司，并解锁“凤凰帝国广场”独特建筑。"
 oe_wp24b_adv_rom_palatini_cohort: "帕拉丁御前禁卫编练"
 oe_wp24b_adv_rom_palatini_cohort_desc: "在皇廷直属军营常设精锐禁卫军团，融合方阵纪律与火器齐射战术，解锁“帕拉丁御前禁卫军”独特兵种。"
 oe_wp24b_bld_forum_of_phoenix: "凤凰帝国广场"
 oe_wp24b_bld_forum_of_phoenix_desc: "集帝国最高法廷、元老院档案库与凯旋柱廊于一体的大理石礼仪中枢，彰显重光罗马的法统与繁华。"
 oe_wp24b_pm_forum_of_phoenix: "凤凰帝国广场日常维护"
 oe_wp24b_u_palatini_guard: "帕拉丁御前禁卫军"
 oe_wp24b_u_palatini_guard_desc: "披甲执铳的帝国宫廷重步兵，擅长在火枪齐射与长矛突击下稳守战线中坚。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_rom_senate_concord: "元老院复兴协约"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_rom_senate_concord: "元老院法统与行省代表制度提升帝国立法与外交威望，同时略微分散皇廷直属集权。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_rom_aquila_legions: "重光军团金鹰军纪"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_rom_aquila_legions: "严整的常备军团训练锤炼战场纪律与陆军传统，但提高了常规军费开支。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_rom_mare_nostrum: "地中海通商和平"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_rom_mare_nostrum: "统一的帝国大道与海运税关扩大商贸与手工业收益，略微削弱传统贵族的关津特权。"
 oe_wp24b.101.title: "金鹰重临：重光罗马之天命"
 oe_wp24b.101.desc: "从七丘之城到金角湾畔，传令官向四海宣告罗马帝国之重光。元老、统帅与诸省执政官齐聚凤凰金鹰旗下，亟待裁定帝国新时代的立国方略。"
 oe_wp24b.101.a: "颁布《元老院复兴敕令》，重建帝国共和法理共治"
 oe_wp24b.101.b: "重树金鹰军旗，整编常备帝国军团"
 oe_wp24b.101.c: "重修帝国大道与海港税关，复兴“我们的海”商路"
 oe_wp24b.102.title: "凤凰广场典章汇编"
 oe_wp24b.102.desc: "首季凯旋庆典落幕，法学家与营造匠师呈上完备的行省律典与常备军籍册，请陛下御笔钦定施行天下。"
 oe_wp24b.102.a: "镌刻石碑颁行天下，充实各省法廷经费"
 oe_wp24b.102.b: "向诸阶层与戍边军团颁赐凯旋恩赏"
 oe_wp24b_adv_lat_outremer_code: "海外封建法典"
 oe_wp24b_adv_lat_outremer_code_desc: "以《罗马尼亚法例》统合法兰克骑士封邑与爱琴海商贸特许状，并解锁“拉丁宗主教堡垒”独特建筑。"
 oe_wp24b_adv_lat_cataphract_knights: "拉丁铁甲骑士团制"
 oe_wp24b_adv_lat_cataphract_knights_desc: "融汇西欧重甲夹枪冲锋与东方具装铁骑工艺，解锁“拉丁具装骑士”独特兵种。"
 oe_wp24b_bld_latin_patriarchate_citadel: "拉丁宗主教堡垒"
 oe_wp24b_bld_latin_patriarchate_citadel_desc: "兼具大教堂与要塞功能的拉丁宗主教驻节堡垒，兼设十字军枢密议事厅与海峡守军库房。"
 oe_wp24b_pm_latin_patriarchate_citadel: "拉丁宗主教堡垒日常维护"
 oe_wp24b_u_latin_cataphract_knights: "拉丁具装骑士"
 oe_wp24b_u_latin_cataphract_knights_desc: "融合法兰克骑士重枪冲击与东地中海具装铠甲的精锐重骑兵。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_lat_assizes_romania: "罗马尼亚法例盟约"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_lat_assizes_romania: "以成文封建盟约缓和封臣与希腊地方势力矛盾，增强稳定与外交威望，但让渡了部分皇室集权。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_lat_crusader_bastion: "海峡十字军堡垒"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_lat_crusader_bastion: "精锐骑士戍卫体系显著提振陆军士气与要塞防卫，但提高了常规军费支出。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_lat_aegean_charters: "爱琴海商埠宪章"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_lat_aegean_charters: "打通海峡与爱琴海商路，提升贸易收入与海军士气，略微引起教会保守派不满。"
 oe_wp24b.201.title: "罗马尼亚皇冠：拉丁帝国之天命"
 oe_wp24b.201.desc: "拉丁帝国旗帜高悬海峡之上，法兰克男爵、大教堂主教与海上城邦领事齐聚议事，商定这座横跨东西方的海外帝国该如何长治久安。"
 oe_wp24b.201.a: "颁行《罗马尼亚法例》，协调拉丁男爵与希腊贵族"
 oe_wp24b.201.b: "号召西欧骑士驰援，固守博斯普鲁斯堡垒"
 oe_wp24b.201.c: "向爱琴海商埠颁赐航海与关税特许状"
 oe_wp24b.202.title: "拉丁宗主教枢密会议"
 oe_wp24b.202.desc: "来自基督教诸国的使节与海峡城堡守将齐聚宗主教院，正式封存帝国封邑名录与海防条约。"
 oe_wp24b.202.a: "强化宗主教文书署与西欧外交使团"
 oe_wp24b.202.b: "充实骑士采邑与爱琴海港口驻防"
 oe_wp24b_adv_pru_ordensstaat_arsenal: "骑士团军械库体制"
 oe_wp24b_adv_pru_ordensstaat_arsenal_desc: "将波罗的海骑士团旧日军库改制为中央统管的铸炮工坊与兵站体系，并解锁“柯尼斯堡大军械库”独特建筑。"
 oe_wp24b_adv_pru_black_eagle_corps: "黑鹰掷弹兵军团"
 oe_wp24b_adv_pru_black_eagle_corps_desc: "在黑鹰旗帜下推行铁通条分排齐射操典与严苛军官学院，解锁“黑鹰掷弹兵”独特兵种。"
 oe_wp24b_bld_konigsberg_grand_armory: "柯尼斯堡大军械库"
 oe_wp24b_bld_konigsberg_grand_armory_desc: "集青铜铸炮坊、火药库与士官候补生兵营于一体的波罗的海核心军政枢纽。"
 oe_wp24b_pm_konigsberg_grand_armory: "柯尼斯堡大军械库日常维护"
 oe_wp24b_u_black_eagle_grenadiers: "黑鹰掷弹兵"
 oe_wp24b_u_black_eagle_grenadiers_desc: "在硝烟炮火中保持严整齐步推进与高速排枪齐射的精锐掷弹突击步兵。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_pru_canton_drill: "普鲁士兵区军纪"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_pru_canton_drill: "兵区轮训与铁血操典显著提升全军训练度与陆军传统，但增加了常规军事维持开支。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_pru_general_directory: "战争与王领总务署"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_pru_general_directory: "严谨的财务审计与官僚考绩提升内阁效能与正税收益，略微压缩传统贵族免税特权。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_pru_baltic_foundries: "波罗的海书院与官营工坊"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_pru_baltic_foundries: "理工书院与官营工坊协同推进生产效率与学术研究，代价是宫廷财政资助增加。"
 oe_wp24b.301.title: "铁血黑鹰：普鲁士国家之天命"
 oe_wp24b.301.desc: "波罗的海沿岸的旧骑士团领地已蜕变为高效严整的近代国家机器。陆军元帅、财政度支官与柯尼斯堡学者齐聚御前，共商黑鹰王国之立国纲领。"
 oe_wp24b.301.a: "颁行《兵区征募条例》，确立常备军团操练"
 oe_wp24b.301.b: "设立战争与王领总务署，整肃财政官僚"
 oe_wp24b.301.c: "扶持柯尼斯堡书院与波罗的海官营工坊"
 oe_wp24b.302.title: "柯尼斯堡参谋部宪章"
 oe_wp24b.302.desc: "军政督察官呈上全国首次军械库、兵区名册与军官委任稽核总账。"
 oe_wp24b.302.a: "钦定军官考选与火炮口径标准"
 oe_wp24b.302.b: "嘉奖筹措边防军需的地方阶层"
 oe_wp24b_adv_mng_yongle_secretariat: "永乐内阁与海宇遗规"
 oe_wp24b_adv_mng_yongle_secretariat_desc: "承续内阁票拟典制与远洋宝船船政规制，兼顾中枢文治与四海宣威，并解锁“都察院御史台”独特建筑。"
 oe_wp24b_adv_mng_shenji_musketeers: "神机营火器三段击"
 oe_wp24b_adv_mng_shenji_musketeers_desc: "完善神机营火铳轮番齐射、车营结阵与官营火药局督造制度，解锁“神机营御前火铳卫”独特兵种。"
 oe_wp24b_bld_imperial_censorate_pavilion: "都察院御史台"
 oe_wp24b_bld_imperial_censorate_pavilion_desc: "纠察百官、稽核行省政绩并掌理科举档案的大明中枢风宪重署。"
 oe_wp24b_pm_imperial_censorate_pavilion: "都察院御史台日常维护"
 oe_wp24b_u_shenji_musketeer_guards: "神机营御前火铳卫"
 oe_wp24b_u_shenji_musketeer_guards_desc: "依托战车盾阵施展三段轮番齐射的大明御前精锐火器禁军。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mng_grand_secretariat: "内阁票拟与风宪整肃"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mng_grand_secretariat: "明晰的内阁部院协同与巡按考课提升行政效能与学术进步，唯略微增加宫廷政务经费。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mng_shenji_frontier: "神机火器与九边戒备"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mng_shenji_frontier: "充实的火器督造与边墙防务增强攻城与要塞守御能力，同时提高了常规军费负担。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mng_maritime_tribute: "南海市舶通商之制"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mng_maritime_tribute: "规范化市舶贸易显著提振国库商税与商帮竞争力，略微触动传统农桑徭役秩序。"
 oe_wp24b.401.title: "日月重明：大明中兴之天命"
 oe_wp24b.401.desc: "大明中兴底定中原，内阁阁臣、九边督师与沿海市舶司使齐集丹墀，静候圣裁以立本朝兴盛之大纲。"
 oe_wp24b.401.a: "重振内阁票拟与都察院巡按考核"
 oe_wp24b.401.b: "扩充神机营火器局与九边戍卫防务"
 oe_wp24b.401.c: "重开市舶提举司，通商南海万邦"
 oe_wp24b.402.title: "都察院风宪考成奏疏"
 oe_wp24b.402.desc: "巡按御史自两京十三布政使司覆命归朝，呈上赋役黄册、常平仓账与官办船厂清册。"
 oe_wp24b.402.a: "核定赋役黄册，兴办国子监书院"
 oe_wp24b.402.b: "蠲免积欠钱粮，休养生息安抚州县"
 oe_wp24b_adv_mch_eight_banner_council: "八旗议政与军机枢密"
 oe_wp24b_adv_mch_eight_banner_council_desc: "以八旗兵民合一户籍为基石并设中枢军机议政体制，兼顾动员效率与机密决断，解锁“盛京御前武库”独特建筑。"
 oe_wp24b_adv_mch_gilded_banner_guard: "镶黄御前亲军铁骑"
 oe_wp24b_adv_mch_gilded_banner_guard_desc: "为上三旗亲军配发精工棉铁甲、强弓与马刀，形成远射近突兼备的精锐重骑，解锁“御前金甲八旗重骑”独特兵种。"
 oe_wp24b_bld_mukden_imperial_armory: "盛京御前武库"
 oe_wp24b_bld_mukden_imperial_armory_desc: "坐镇盛京的八旗祖庭军械总库，统筹重甲、劲弓与攻城重炮之督造与调拨。"
 oe_wp24b_pm_mukden_imperial_armory: "盛京御前武库日常维护"
 oe_wp24b_u_gilded_banner_cavalry: "御前金甲八旗重骑"
 oe_wp24b_u_gilded_banner_cavalry_desc: "兼具关外骑射机动与重甲凿阵冲锋威力的上三旗御前精锐重骑兵。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mch_banner_muster: "八旗大阅驻防"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mch_banner_muster: "世袭八旗驻防体系充实兵源与战场士气，但提高了常备军俸开支。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mch_grand_council: "军机密折中枢"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mch_grand_council: "密折奏事与军机处直辖大幅提升皇权与内阁效率，略微节制旗主宗室旧权。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mch_dual_chancery: "满汉合署与理藩体制"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mch_dual_chancery: "满汉合署与理藩体制促进疆域整合与赋税征管，代价是宫廷双语官署开支增加。"
 oe_wp24b.501.title: "八旗耀日：大清帝国之天命"
 oe_wp24b.501.desc: "盛京阙下与长城诸关之间，八色旗帜猎猎生风。诸旗贝勒、蒙古盟部与汉臣文官肃立御前，恭候钦定新朝治国方略。"
 oe_wp24b.501.a: "扩编八旗驻防兵籍，强化关内外机动威慑"
 oe_wp24b.501.b: "设立军机处直承密折，强化中枢乾纲独断"
 oe_wp24b.501.c: "推行满汉合署与藩部理藩院，统筹多族一统"
 oe_wp24b.502.title: "盛京武库与八旗大阅敕谕"
 oe_wp24b.502.desc: "八旗都统呈上新铸红衣重炮、校阅清册与关内外驻防舆图，请示御览定夺。"
 oe_wp24b.502.a: "御驾亲临校场大阅上三旗精锐"
 oe_wp24b.502.b: "拨银充实义仓与八旗官学"
 oe_wp24b_adv_yua_great_yassa_yam: "大扎撒法与帝国驿站"
 oe_wp24b_adv_yua_great_yassa_yam_desc: "重修横贯欧亚草原的站赤驿道并申明《大扎撒》法度，统合草原万户与农耕州县，解锁“哈拉和林黄金斡耳朵行宫”独特建筑。"
 oe_wp24b_adv_yua_kheshig_lancers: "怯薛御前宿卫重兴"
 oe_wp24b_adv_yua_kheshig_lancers_desc: "重兴大汗直属日夜宿卫怯薛军，编练重甲长枪与强弓兼备的草原亲卫，解锁“怯薛御前铁枪重骑”独特兵种。"
 oe_wp24b_bld_karakorum_orda_pavilion: "哈拉和林黄金斡耳朵行宫"
 oe_wp24b_bld_karakorum_orda_pavilion_desc: "大忽里台会盟圣殿与站赤驿道总枢，贯通草原万户军政与丝路商旅银道。"
 oe_wp24b_pm_karakorum_orda_pavilion: "哈拉和林黄金斡耳朵行宫日常维护"
 oe_wp24b_u_kheshig_imperial_lancers: "怯薛御前铁枪重骑"
 oe_wp24b_u_kheshig_imperial_lancers_desc: "大汗亲统的札甲铁枪怯薛宿卫，以大纵深侧翼包抄与雷霆冲阵闻名天下。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_yua_kurultai_tumens: "长生天万户军威"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_yua_kurultai_tumens: "统合的草原万户骑兵兼具迅捷机动力与高昂士气，代价是常备军费负担上升。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_yua_yam_caravans: "站赤驿道与牌符商旅"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_yua_yam_caravans: "重畅的欧亚站赤驿路与牌符制度复兴商旅财源，略微约束部族贵族的私掠税利。"
 STATIC_MODIFIER_NAME_oe_wp24b_mod_yua_dual_court: "大汗双轨中书政制"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_yua_dual_court: "以黄金家族法统衔接中书省文官体制，显著稳固国本并提升内阁效能，唯略增宫廷开销。"
 oe_wp24b.601.title: "白纛重光：北元中兴之天命"
 oe_wp24b.601.desc: "从鄂尔浑河谷到漠南诸关，万户那颜、怯薛千户与中书文吏齐聚九斿白纛之下，共议大元黄金家族重兴之大计。"
 oe_wp24b.601.a: "高举九斿白纛，整军号令草原六万户"
