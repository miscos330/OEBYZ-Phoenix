l_simp_chinese:
 OE_HEG_ROMAN_LEGITIMACY_REQUIRED: "持有罗马文明圈的“罗马正统”身份"
 OE_HEG_ROMAN_ACTIONS_NOTICE: "罗马霸业在完成“终结乱局”后开放。所有行动均须由持有“罗马正统”的东罗马执行。"
 OE_RW_ITALY: "意大利"
 OE_RW_ITALY_DESC: "从普利亚的海岸到台伯河畔，旧日帝国的道路仍通向罗马。鹰旗将循着这些道路归来，而亚得里亚海上的旧账，也终有清算之日。"
 OE_RW_ITALY_OPEN: "查看意大利行动"
 OE_RW_ITALY_ACTIONS: "意大利行动"
 OE_RW_ITALY_HINT: "点击地图，在原地展开意大利行动面板。"
 OE_RW_ROME: "罗马"
 OE_RW_ROME_OWNER: "罗马当前拥有者"
 OE_HEG_ITALY_ACTIONS_HINT: "先筹划入侵，再循海岸与古道推进。筹划、进军罗马和对威尼斯复仇各限一次；驱逐诺曼人与取得入侵借口可重复执行。"
 OE_HEG_ITALY_PLAN_REQUIRED: "已完成“筹划入侵意大利”"
 OE_HEG_SOUTH_ITALY_COVERED: "普利亚与巴西利卡塔的全部可拥有地点，均由东罗马及其附庸拥有或军事占领"
 OE_HEG_SOUTH_ITALY_OCCUPATION: "上述两个地区内至少有一处可接收的敌方军事占领地"
 OE_HEG_ROME_YEAR: "东罗马或其附庸连续军事占领敌方罗马超过一年"
 OE_HEG_VENICE_YEAR: "东罗马或其附庸连续军事占领敌方威尼斯超过一年"
 OE_HEG_ROME_PROGRESS: "连续占领：罗马 [GuiScope.SetRoot(GetLocationByKey('rome').MakeScope).ScriptValue('oe_heg_hold_duration')|0]／366天"
 OE_HEG_VENICE_PROGRESS: "连续占领：威尼斯 [GuiScope.SetRoot(GetLocationByKey('venice').MakeScope).ScriptValue('oe_heg_hold_duration')|0]／366天"
 OE_HEG_CHOOSE_INVASION_TARGET: "选择在目标地区拥有土地的外部国家"
 oe_heg_plan_italy: "筹划入侵意大利"
 oe_heg_plan_italy_desc: "书记官展开心中早已熟悉的地图，海军将领逐一报出港湾与风向。帝国对意大利的权利，从未随驻军的撤离而消失；如今，该为这些古老的权利备好粮秣与船只了。"
 oe_heg_plan_italy_effect: "花费1000国库金币，将意大利大区纳入罗马文明圈，并解锁后续意大利行动。此筹划只能完成一次。"
 oe_heg_plan_italy_done: "已完成：筹划入侵意大利"
 oe_heg_drive_out_normans: "驱逐诺曼人"
 oe_heg_drive_out_normans_desc: "南意大利的城镇曾向帝国纳税，也曾在外来征服者的旗帜下易主。如今普利亚与巴西利卡塔尽在我军掌握之中，让帝国的官吏接收城门，将暂时的占领写成永久的疆界。"
 oe_heg_drive_out_normans_effect: "立即将普利亚与巴西利卡塔两个地区内，东罗马及其附庸军事占领的敌方地点直接划归东罗马。附庸已经拥有的土地不转移。本行动无额外费用，可再次收复失地。"
 oe_heg_march_on_rome: "进军罗马"
 oe_heg_march_on_rome_desc: "军旗在台伯河畔驻留已逾一年，城门与道路都已熟悉帝国驻军的号令。七丘之城不应只是战争地图上的一处占领地；让诏书宣告，罗马已重归罗马。"
 oe_heg_march_on_rome_effect: "立即取得罗马地点的所有权与控制权。无额外费用，仅能完成一次。"
 oe_heg_march_on_rome_done: "已完成：进军罗马"
 oe_heg_revenge_on_venice: "对威尼斯复仇"
 oe_heg_revenge_on_venice_desc: "一年的军靴声，终于压过了潟湖上往来的桨声。君士坦丁堡的旧伤未曾愈合，今日御座要向这座海上商都讨回旧债。胜利会换来国内的欢呼，也会让远方诸侯重新掂量帝国的野心。"
 oe_heg_revenge_on_venice_effect: "立即取得威尼斯地点，将其等级降低一级，并增加50点荒废（繁荣度降低50个百分点）。东罗马承受以威尼斯为中心、基础值50的侵略扩张，按原生敌意规则传播；国内贵族与平民阶层满意度各提高5个百分点。无额外费用，仅能完成一次。"
 oe_heg_revenge_on_venice_done: "已完成：对威尼斯复仇"
 oe_heg_invade_italy: "入侵意大利"
 oe_heg_invade_italy_desc: "为西方的征程备好诏令与使节。凡仍据有意大利土地的外部君主，都将收到帝国的最后通牒；他们的首都，是下一场战争的目标。"
 oe_heg_invade_italy_effect: "花费100国库金币，选择在意大利大区拥有地点、且不属于东罗马及其附庸集团的国家，取得以占领其首都为目标的十五年战争借口。可重复执行，不立即宣战。冷却三个月。"
 oe_heg_invade_egypt: "入侵埃及"
 oe_heg_invade_egypt_desc: "从叙利亚的驿站到埃及的港口，帝国的使节将沿古老的商路送出诏书。占据东方行省的君主必须作出答复，军队则已准备前往他们的都城。"
 oe_heg_invade_egypt_effect: "花费100国库金币，选择在埃及大区或黎凡特地区拥有地点、且不属于东罗马及其附庸集团的国家，取得以占领其首都为目标的十五年战争借口。可重复执行，不立即宣战。冷却三个月。"
 oe_heg_invade_africa: "入侵北非"
 oe_heg_invade_africa_desc: "海岸上的据点为舰队提供了锚地，却不足以让阿非利加安定下来。将诏书送往仍在马格里布持地的君主，宣告帝国的军队将直抵其都城。"
 oe_heg_invade_africa_effect: "花费100国库金币，选择在马格里布大区拥有地点、且不属于东罗马及其附庸集团的国家，取得以占领其首都为目标的十五年战争借口。可重复执行，不立即宣战；仍要求东罗马或其附庸拥有亚历山大。冷却三个月。"
 oe_heg_capital_invasion: "帝国征讨"
 oe_heg_capital_invasion_desc: "帝国已为收复旧土作好筹备，现以夺取对方首都为战争目标，迫使占据这些土地的君主屈服。"
