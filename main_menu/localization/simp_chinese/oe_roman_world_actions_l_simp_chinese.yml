l_simp_chinese:
 oe_byz_ecumenical_patriarch_policy: "普世牧首"
 oe_byz_ecumenical_patriarch_policy_desc: "君士坦丁堡牧首的职责不止于照料一国的信众。自古老的教会会议以来，普世牧首便以新罗马的教座为中心，维系东方教会的共同信仰。皇帝守护教会，牧首主持教务；两者的合作仍是帝国秩序的重要支柱。"
 oe_rw_recruit_turkic_mercenaries: "招募突厥佣兵"
 oe_rw_recruit_turkic_mercenaries_desc: "安纳托利亚的战士并非只为一位贝伊效命。只要酬金可靠，他们的骑兵与步兵也愿意追随新的军旗。\n\n所有罗马文明圈成员均可使用。消耗#color_yellow 200国库金币#!，招募#color_yellow 3队轻骑兵、2队轻步兵#!，合约#color_yellow 120个月#!，费用倍率#color_yellow 0.8#!。冷却#color_yellow 一年#!；合约期间仍须支付维护费用。此处金币由行动国国库支付，不使用内帑，不消耗权威或民意。"
 oe_rw_turkic_mercenary_company: "突厥佣兵团"
 oe_rw_classical_revival: "#bold #color_yellow 复兴古希腊-罗马文艺#!#!"
 oe_rw_classical_revival_desc: "荷马、柏拉图与古代史家的著作从未完全离开我们的书架。如今，学者希望使它们重新走进课堂，艺术家也开始从古人的作品中寻找新的表达。宫廷的支持，或许能让君士坦丁堡成为这一风潮的中心。\n\n仅持有#bold #color_yellow 罗马正统#!#!的国家可执行。消耗#color_yellow 100国库金币#!，冷却#color_yellow 十年#!，但整个事件链#bold 只能开启一次#!。立即触发首个事件，随后两个事件各间隔一年；部分选项另需支付半年收入。\n文艺复兴已经出现，或第三个事件触发后，此行动不再显示。国库金币不使用内帑，不消耗权威或民意。\n\n#Y 文艺复兴进程：[GuiScope.SetRoot(GetInternationalOrganization('oe_byz_roman_world').MakeScope).ScriptValue('oe_rw_renaissance_progress')|0] / 3#!"
 oe_rw_recognize_local_rule: "承认地方统治"
 oe_rw_recognize_local_rule_desc: "帝国可以暂时承认既成的边界，让地方统治者以一笔款项换取安心。只是向诸国宣称罗马的权利可以商议，也会削弱我们在其他谈判中的声望。\n\n仅持有#bold #color_yellow 罗马正统#!#!的国家可执行，选择一个#color_yellow 接壤的有地成员#!。获得相当于该国#color_yellow 半年税收与贸易收入#!的国库金币，并承受#color_yellow 一年外交声誉−2#!。此后#color_yellow 十年#!内，持有罗马正统的国家均不能对该目标使用“收复帝国失地”，也不能重复承认。\n无金币、权威或民意花费，冷却#color_yellow 一年#!；所得金币进入国家国库，不进入内帑。此行动不扣除目标国库，也不订立停战协定。"
 oe_rw_recognition_concessions: "承认地方统治"
 oe_rw_recognition_concessions_desc: "我们以承认地方统治换取眼前的利益。其他宫廷正在衡量：帝国还有多少主张，可以用同样的办法讨价还价。"
 OE_RW_RECOGNITION_TARGET: "选择承认其统治的邻国"
 OE_RW_RECOGNITION_NO_TARGET: "没有符合条件的接壤成员"
 OE_RW_NOT_ALREADY_RECOGNIZED: "该国目前不在十年承认期限内"
 OE_RW_CLAIM_RECOGNITION_BLOCK: "目标国家不在“承认地方统治”的十年保护期内"
 OE_RW_REVIVAL_ONCE: "罗马文明圈尚未开启过这条事件链"
 OE_RW_RENAISSANCE_PROGRESS_TITLE: "文艺复兴进程"
 OE_RW_RENAISSANCE_PROGRESS_DESC: "三次选择，各有一次推进新文艺的机会。\n#color_yellow 0—1分#!：无结算奖励。\n#color_yellow 2分#!：获得20威望。\n#color_yellow 3分#!：获得20威望，并将尚未出现的文艺复兴诞生地锁定在君士坦丁堡，保留原版出现年代。\n\n分数随选项实时更新，奖励在第三个事件选择完毕后结算一次。若文艺复兴已在事件链进行期间出现，不会迁移既有诞生地。"
 OE_RW_RENAISSANCE_ADD_SCORE: "#bold #color_yellow 文艺复兴进程＋1#!#!"
 OE_RW_RENAISSANCE_BIRTHPLACE_SECURED: "文艺复兴将在原版出现年代于#bold #color_yellow 君士坦丁堡#!#!诞生。"
 oe_rw_renaissance.1.title: "对古希腊-罗马文艺研究的新风潮"
 oe_rw_renaissance.1.desc: "君士坦丁堡的书库并不缺少古人的名字，缺少的是能够从容研读它们的人。近来，一批教师、抄写员和宫廷学者开始互相传阅旧抄本：有人校订荷马的诗篇，有人重新讲授柏拉图，也有人从古代史家的叙述中寻找治理国家的经验。\n他们请求宫廷出资，从修院、私人藏书和海外商人手中购入更多书籍，再将校订后的文本送入学馆。战争已经夺去了许多城池，学者们却相信，#bold #color_yellow 罗马仍可以凭借学问使诸国倾听自己的声音#!#!。这项事业需要耐心，也需要一笔并不轻省的资助。"
 oe_rw_renaissance.1.a: "购买更多的古籍，鼓励他们的研究。"
 oe_rw_renaissance.1.b: "我不在乎。"
 oe_rw_renaissance.2.title: "邀请意大利艺术家"
 oe_rw_renaissance.2.desc: "往来意大利的使者带回了一些画稿，也带回了新的谈论。那里的画家试着让人物拥有更自然的姿态，让建筑与山川显出远近的层次。这些技法并非凭空而来，其中也能辨认出我们自己的圣像传统。\n一位来自托斯卡纳的画家愿意接受邀请，带着他的手稿与技艺来到君士坦丁堡。在支持者看来，他可以与本地画师共同工作，让东西两岸的经验在同一间画室中相遇。反对者则提醒宫廷：#bold 国库里的每一枚金币，还有更迫切的用途#!。"
 oe_rw_renaissance.2.a: "他们是优秀的艺术家。"
 oe_rw_renaissance.2.b: "我们没有钱进行奢侈活动。"
 oe_rw_renaissance.3.title: "教会思想统治的松动"
 oe_rw_renaissance.3.desc: "古籍的讨论已经越过学馆的门槛。宫廷中的学者开始主张，修辞、历史与道德哲学也应有自己的研究空间；认识人的处境与责任，不必事事先等待神学家的裁断。\n教会内部对此意见不一。一些教士愿意参与辩论，另一些人却担忧，宫廷若公开支持这种主张，传统教导的地位便会受到动摇。支持者将它称为学问的生机，反对者则视之为秩序松动的开端。\n我们终于必须表明态度：#bold #color_yellow 为新的研究留下余地，还是重申教会无可置疑的地位？#!#!\n\n$OE_RW_RENAISSANCE_PROGRESS_DESC$"
 oe_rw_renaissance.3.a: "鼓励人文主义思想。"
 oe_rw_renaissance.3.b: "教会的地位不可撼动。"
