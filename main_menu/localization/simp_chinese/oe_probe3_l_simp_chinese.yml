 # v21.0 统一实机探针 P10-P22 只读回执（由 gen_v210_probes.py 生成）
 oe_probe3.90.t: "《帝国经纬》实机探针回执"
 oe_probe3.90.d: "以下为 v21.0 全量 13 组实机探针只读核验结果（CMDLOG=0，不改动存档格局）：\n• P10（金帐防连崩与扎尼别护盾，预期 1111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p10').GetValue|0]\n• P11（察合台三翼 FRG/OTR/BSB + 17 埃米尔，预期 1111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p11').GetValue|0]\n• P12（12 建筑型总督区 DLH/MAM/HUN/CAS/ETH，预期 1111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p12').GetValue|0]\n• P13（JAL/GRG/TIB/MAL 专门附庸 + PHM 曼陀罗，预期 1111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p13').GetValue|0]\n• P14（P1 战略商品闭环与 6 套局势 GUI，预期 111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p14').GetValue|0]\n• P15（P2/P3 旗舰任务树与美术/子模组，预期 111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p15').GetValue|0]\n• P16（第四罗马 ELR 元老院与 75 年三段经济，预期流亡前 1111 / 新罗马实机 11111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p16').GetValue|0]\n• P17（模块 A 全局数值平衡合规，预期 1111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p17').GetValue|0]\n• P18（模块 B 法律 2.0 与过渡联动，预期 111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p18').GetValue|0]\n• P19（模块 C 拜占庭征讨 2.0，预期 1）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p19').GetValue|0]\n• P20（模块 D 人口同化 2.0，预期 111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p20').GetValue|0]\n• P21（模块 E 41 任务树 + 6 灾难 + 竞争性 AI，预期 11111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p21').GetValue|0]\n• P22（模块 F 6 新议会 + 27 附庸锁 + 8 内核钩子，预期 111）：[ROOT.GetCountry.MakeScope.Var('oe_probe3_p22').GetValue|0]"
 oe_probe3.90.a: "关闭诊断面板"
 oe_probe3.90.b: "重新运行全部 13 组探针（P10–P22）"
 oe_probe3.90.b.tt: "静默重新执行全部 13 组只读 v21.0 引擎探针（P10–P22）并刷新本诊断面板。"
