 # NEW 2026-11-18 fourth round D4 (oe_trc_). Generated by gen_round4_reclaim.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_trc_settle_a: "恢复旧制"
 STATIC_MODIFIER_DESC_oe_trc_settle_a: "帝国重新派来官员，照旧日的册籍收税、管辖。地方回到熟悉的秩序里。"
 STATIC_MODIFIER_NAME_oe_trc_settle_b: "授地安兵"
 STATIC_MODIFIER_DESC_oe_trc_settle_b: "朝廷把这里一部分赋税的征收权授给士兵，以酬报他们的兵役。兵源多了，农户的负担也重了。"
 STATIC_MODIFIER_NAME_oe_trc_settle_bp: "授地安兵（普罗尼亚）"
 STATIC_MODIFIER_DESC_oe_trc_settle_bp: "朝廷把这里一部分赋税的征收权作为普罗尼亚授给士兵。普罗尼亚持有者可以编成部队随军出征，所以征召的兵员更多。"
 STATIC_MODIFIER_NAME_oe_trc_settle_c: "免税招民"
 STATIC_MODIFIER_DESC_oe_trc_settle_c: "因战乱荒弃的土地依法归国家所有。朝廷暂免这里的赋税，招逃散的农户回乡，也让外来的人户落脚。这几年官府从这里收得很少。"
 STATIC_MODIFIER_NAME_oe_trc_settle_d: "修院领地"
 STATIC_MODIFIER_DESC_oe_trc_settle_d: "这里的田产交给了修道院。皇帝赐给修院的特权，多半是免缴赋税、官员不得进入。修士管理田庄，地方也因此安定。"
 oe_trc_region_unknown: "旧辖区"
 oe_trc.1.t: "安置收复的故省"
 oe_trc.1.d1: "1333年前后，塞萨利的统治者斯特凡·加布里埃洛普洛斯去世，他的继承人彼此争斗，伊庇鲁斯的约翰二世·奥尔西尼趁机出兵。安德罗尼卡三世命驻帖撒罗尼迦的米哈伊尔·莫诺马霍斯进兵，夺回了塞萨利的北部和东部，并留他以首席尊者（protosebastos）的头衔治理这个新行省。当地此前一直自立的阿尔巴尼亚人也被帝国制服。\n\n如今，[GetCountry('BYZ').Custom('OeTrcRegion')]有[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处故省重新归帝国治理，其中[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处的居民以正教徒为主。战乱之后，这里田地荒芜，人户逃散，旧日的官署也不复存在。朝廷要决定怎样安置这些地方。所选的安置方式持续#Y 5#!年。"
 oe_trc.1.d2: "1337年，安德罗尼卡三世率军进入伊庇鲁斯北部，先平定了阿尔巴尼亚人的袭扰。为儿子尼基弗鲁斯二世摄政的安娜最终交出了专制公国，帝国派塞奥多尔·西纳德诺斯任总督。1339年，伊庇鲁斯爆发了拥立尼基弗鲁斯的叛乱。次年皇帝与约翰·坎塔库泽努斯亲临，尼基弗鲁斯交出托莫卡斯特隆，娶了坎塔库泽努斯的女儿玛丽亚，受封泛至尊者（panhypersebastos）。约翰·安格洛斯随后出任伊庇鲁斯总督，驻阿尔塔。\n\n如今，[GetCountry('BYZ').Custom('OeTrcRegion')]有[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处故省重新归帝国治理，其中[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处的居民以正教徒为主。战乱之后，这里田地荒芜，人户逃散，旧日的官署也不复存在。朝廷要决定怎样安置这些地方。所选的安置方式持续#Y 5#!年。"
 oe_trc.1.d3: "皇帝赐给修道院的特权，多半是禁止官员进入修院的田产，并豁免赋税（exkousseia）。阿索斯山的伊维隆修道院在帖撒罗尼迦军区有田产和依附农户。1318年11月，清丈官康斯坦丁·佩尔加梅诺斯与格奥尔基·法里赛奥斯登记了这些田产和农户，为修院出具了清册。\n\n如今，[GetCountry('BYZ').Custom('OeTrcRegion')]有[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处故省重新归帝国治理，其中[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处的居民以正教徒为主。战乱之后，这里田地荒芜，人户逃散，旧日的官署也不复存在。朝廷要决定怎样安置这些地方。所选的安置方式持续#Y 5#!年。"
 oe_trc.1.d: "十四世纪的帝国仍在收回失地。1333年前后，安德罗尼卡三世收回了塞萨利，留米哈伊尔·莫诺马霍斯以首席尊者的头衔治理新行省。1337至1340年间，他又收回了伊庇鲁斯：专制公尼基弗鲁斯二世交出托莫卡斯特隆，娶了约翰·坎塔库泽努斯的女儿，受封泛至尊者。\n\n如今，[GetCountry('BYZ').Custom('OeTrcRegion')]有[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处故省重新归帝国治理，其中[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处的居民以正教徒为主。战乱之后，这里田地荒芜，人户逃散，旧日的官署也不复存在。朝廷要决定怎样安置这些地方。所选的安置方式持续#Y 5#!年。"
 oe_trc.1.a: "恢复旧制"
 oe_trc.1.a.tt: "这[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处地点各得“恢复旧制”（#Y 5#!年）：每月控制力#G +1%#!，最大控制力#G +5%#!。"
 oe_trc.1.b: "授地安兵"
 oe_trc.1.b.tt: "这[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处地点各得“授地安兵”（#Y 5#!年）：每月人力#G +25%#!，本地征召规模#G +25%#!，本地每月繁荣度#R −0.25%#!。\n若帝国实行[oe_tu_pronoia|e]授地，本地征召规模改为#G +50%#!（目前没有实行）。"
 oe_trc.1.bp: "授地安兵"
 oe_trc.1.bp.tt: "这[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处地点各得“授地安兵（普罗尼亚）”（#Y 5#!年）：每月人力#G +25%#!，本地征召规模#G +50%#!，本地每月繁荣度#R −0.25%#!。\n帝国实行[oe_tu_pronoia|e]授地，征召规模的加成更大。"
 oe_trc.1.c: "免税招民"
 oe_trc.1.c.tt: "这[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处地点各得“免税招民”（#Y 5#!年）：本地人口增长#G +0.5%#!，移民吸引力#G +0.5#!，最大控制力#R −50%#!。\n最大控制力下降，是因为朝廷几年内少收赋税：本地的税收和兵源都随控制力减少。"
 oe_trc.1.m1: "把田产交给阿索斯山的修道院"
 oe_trc.1.m1.tt: "居民以正教徒为主的[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处地点各得“修院领地”（#Y 5#!年）：本地叛乱度#G −20%#!，本地人口皈依速度#G +25%#!，本地教士阶层力量#G +25%#!，最大控制力#R −10%#!（修院免税，官员不得进入）。\n其余地点按“恢复旧制”安置：每月控制力#G +1%#!，最大控制力#G +5%#!。\n教士阶层满意度#G +5%#!。"
 oe_trc.1.m2: "交给修院"
 oe_trc.1.m2.tt: "居民以正教徒为主的[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处地点各得“修院领地”（#Y 5#!年）：本地叛乱度#G −20%#!，本地人口皈依速度#G +25%#!，本地教士阶层力量#G +25%#!，最大控制力#R −10%#!（修院免税，官员不得进入）。\n其余地点按“恢复旧制”安置：每月控制力#G +1%#!，最大控制力#G +5%#!。\n教士阶层满意度#G +5%#!。"
 oe_trc.9.t: "收复安置：安置生效"
 oe_trc.1.d_pre: "十四世纪的帝国仍在收回失地。1333年前后，安德罗尼卡三世收回了塞萨利，留米哈伊尔·莫诺马霍斯以首席尊者的头衔治理新行省。\n\n如今，[GetCountry('BYZ').Custom('OeTrcRegion')]有[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0]处故省重新归帝国治理，其中[GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0]处的居民以正教徒为主。战乱之后，这里田地荒芜，人户逃散，旧日的官署也不复存在。朝廷要决定怎样安置这些地方。所选的安置方式持续#Y 5#!年。"
