l_simp_chinese:
 OE_THS_ENC_YES: "#R 已合围#!"
 OE_THS_ENC_NO: "#G 未合围#!"
 OE_THS_VEN_YES: "威尼斯可以接手"
 OE_THS_VEN_NO: "威尼斯无法接手"
 OE_THS_FATE_EXEC: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_c2').GetCharacter.GetName]被俘，处以绞刑。"
 OE_THS_FATE_NONE: ""
 oe_ths_city: "塞萨洛尼基之围"
 oe_ths_city_desc: "奥斯曼人封锁了塞萨洛尼基。#bold #color_yellow 城心#!#!降到#Y 0#!，城就守不住了。\n\n城心#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#! / #Y 100#!　封锁已#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!个月　[GetCountry('BYZ').Custom('OeThsEncircled')]　[GetCountry('BYZ').Custom('OeThsVenOk')]\n\n城心每月#R −1#!；奥斯曼人控制城周围至少#Y 2#!处地方（#bold #color_yellow 合围#!#!）时再#R −1#!；威尼斯的桨帆船在港时#G +1#!。封锁坚持到期限、城心仍不低于#Y 30#!时，围城解除。"
 oe_ths_mustafa: "穆斯塔法之乱"
 oe_ths_mustafa_desc: "帝国放出的奥斯曼王子与苏丹争夺王位。押中的话，新苏丹会交出加里波利，帝国不再纳贡；押错了，新苏丹会兴兵问罪。\n\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n帝国：[GetCountry('BYZ').Custom('OeBetBack')]，押注深度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_stake').GetValue|0]#! / #Y 3#!　已过#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月\n\n每月，两人的势随战局起落；据有王座的苏丹#Y +3#!；帝国所押的一方#Y +1#!，另加押注深度。势达到#Y 90#!、只剩一人，或满#Y 18#!个月时决出胜负。"
 STATIC_MODIFIER_NAME_oe_ths_second_court: "第二朝廷"
 STATIC_MODIFIER_NAME_oe_ths_two_courts: "两个朝廷"
 STATIC_MODIFIER_NAME_oe_ths_blockaded: "被封锁"
 STATIC_MODIFIER_NAME_oe_ths_privileges: "开城的特权"
 STATIC_MODIFIER_NAME_oe_ths_harac: "向苏丹纳款"
 STATIC_MODIFIER_NAME_oe_ths_harac_pay: "塞萨洛尼基的贡款"
 STATIC_MODIFIER_NAME_oe_ths_custody: "看管奥斯曼王子"
 STATIC_MODIFIER_NAME_oe_ths_siege_scars: "围城的创伤"
 STATIC_MODIFIER_NAME_oe_ths_ven_pledge: "威尼斯的承诺"
 oe_ths_defiance: "皇子抗命"
 oe_ths_custody_op: "看管王子"
 oe_ths_kept_faith: "守约"
 oe_ths_handed_over: "交还了王子"
 oe_ths_handed_over_2: "交出了王子"
 oe_ths_mus_grateful: "扶持登位"
 oe_ths_mus_betrayed: "扶持叛王"
 oe_ths_1424_spurned: "拒绝和约"
 oe_ths_ven_help: "并肩守城"
 oe_ths_handover: "献出塞萨洛尼基"
 oe_ths_ven_rival: "接手塞萨洛尼基"
 oe_ths_overture: "示好"
 oe_ths.1.t: "秘密出航"
 oe_ths.1.desc_slighted: "#F 1382年秋，约翰五世与长子一系和解之后，被越过继承的次子曼努埃尔秘密乘船去了塞萨洛尼基，在那里自立朝廷，不奉父命，转而抗击奥斯曼人。#!\n\n如今，继承之约把皇位留给了长子一系，[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]被越了过去。皇子不甘向苏丹低头，悄悄登船去了塞萨洛尼基，城中的显贵和守军纷纷前来拜见。一座与京城分庭抗礼的#bold #color_yellow 第二朝廷#!#!正在形成。"
 oe_ths.1.desc_threat: "#F 1382年秋，约翰五世与长子一系和解之后，被越过继承的次子曼努埃尔秘密乘船去了塞萨洛尼基，在那里自立朝廷，不奉父命，转而抗击奥斯曼人。#!\n\n如今，奥斯曼人的兵锋已经逼近马其顿，京城却一味忍让。[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]不甘坐视，悄悄登船去了塞萨洛尼基，城中的显贵和守军纷纷前来拜见。一座与京城分庭抗礼的#bold #color_yellow 第二朝廷#!#!正在形成。"
 oe_ths.1.a: "默认既成事实"
 oe_ths.1.a.tt: "塞萨洛尼基获得[ShowModifier('oe_ths_second_court')]，帝国获得[ShowModifier('oe_ths_two_courts')]，第二朝廷存在期间一直生效\n奥斯曼人兵临马其顿后，最早约#Y 8#!个月城会被围\n塞萨洛尼基的军区（如有）忠诚#G +5#!\n臣属苏丹期间，苏丹的耐心#R −5#!；否则奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_ths.1.b: "召皇子回京"
 oe_ths.1.b.tt: "第二朝廷就此作罢\n塞萨洛尼基的军区（如有）忠诚#R −10#!"
 oe_ths.1.c: "暗中资助"
 oe_ths.1.c.tt: "花费#R 2#!个月的贸易与税收收入\n同“默认既成事实”：塞萨洛尼基获得[ShowModifier('oe_ths_second_court')]，帝国获得[ShowModifier('oe_ths_two_courts')]\n城被围时，#bold #color_yellow 城心#!#!另加#G +10#!\n塞萨洛尼基的军区（如有）忠诚#G +5#!\n臣属苏丹期间，苏丹的耐心#R −15#!；否则奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_ths.2.t: "塞莱之后"
 oe_ths.2.desc: "#F 1383年9月，奥斯曼军攻陷塞莱，掳走居民为奴；10月，大军开到塞萨洛尼基城下。统帅先下通牒：开城投降，或者城破之日屠城。曼努埃尔召集全城，劝众人死守，可许多人想要投降。#!\n\n如今，奥斯曼人的大军开到了塞萨洛尼基城下，要求开城。[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]召集全城的显贵和百姓，城里有人主战，也有人主降。\n\n塞萨洛尼基获得[ShowModifier('oe_ths_blockaded')]。全城坚守的意志称为#bold #color_yellow 城心#!#!，眼下是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!：每月#R −1#!；奥斯曼人控制城周围至少#Y 2#!处地方（#bold #color_yellow 合围#!#!）时再#R −1#!。城心降到#Y 0#!，城就守不住了；封锁满#Y 4#!年时城心不低于#Y 30#!，围城就会解除。"
 oe_ths.2.a: "号召全城死守"
 oe_ths.2.a.tt: "城心#G +10#!\n臣属苏丹期间，苏丹的耐心#R −10#!；否则奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_ths.2.b: "皇帝出钱出兵"
 oe_ths.2.b.tt: "花费#R 3#!个月的贸易与税收收入\n城心#G +20#!\n臣属苏丹期间，苏丹的耐心#R −15#!；否则奥斯曼对帝国好感#R −10#!，持续#Y 5#!年"
 oe_ths.2.c: "劝皇子与帕夏谈判"
 oe_ths.2.c.tt: "城心#R −15#!\n臣属苏丹期间，苏丹的耐心#G +10#!；否则奥斯曼的不满（如有）消除"
 oe_ths.3.t: "西方的回音"
 oe_ths.3.desc_scandal: "#F 围城一年年拖下去，塞萨洛尼基始终没有等来援军。#!\n\n如今，城中派人渡海，向威尼斯和教廷求援。帝国此前向西方许诺过教会合一，已在国内惹来非议；再提此事，教士们只会更加不满。"
 oe_ths.3.desc_plain: "#F 围城一年年拖下去，塞萨洛尼基始终没有等来援军。#!\n\n如今，城中派人渡海，向威尼斯和教廷求援。"
 oe_ths.3.a: "向威尼斯求船"
 oe_ths.3.a.tt: "#G 50%#!的可能威尼斯派来桨帆船：#Y 12#!个月内城心每月#G +1#!，威尼斯对帝国好感#G +10#!\n#R 50%#!的可能威尼斯婉拒"
 oe_ths.3.b: "向教皇许诺合一"
 oe_ths.3.b.tt: "城心#G +10#!\n若与罗马的合一从没签过：合一谈判开始，持续#Y 5#!年；教廷对帝国好感#G +5#!，持续#Y 5#!年"
 oe_ths.3.c: "不求外人"
 oe_ths.3.c.tt: "不花钱，封锁照旧"
 oe_ths.4.t: "城中的分歧"
 oe_ths.4.desc: "#F 封锁一年年拖下去，城中主张投降的人越来越多。#!\n\n如今，城里的粮价飞涨，主降的显贵四处串联，百姓也开始动摇。"
 oe_ths.4.a: "散财安民"
 oe_ths.4.a.tt: "花费#R 1#!个月的贸易与税收收入\n城心#G +5#!"
 oe_ths.4.b: "拘押主降的显贵"
 oe_ths.4.b.tt: "城心#G +10#!\n塞萨洛尼基的军区（如有）忠诚#R −5#!"
 oe_ths.4.c: "听之任之"
 oe_ths.4.c.tt: "城心#R −10#!"
 oe_ths.5.t: "开城"
 oe_ths.5.desc: "#F 1387年4月6日，塞萨洛尼基的居民逼曼努埃尔离城；三天后城门打开。城市得到特权，交纳一笔贡赋，接纳一支小守军，没有遭到洗劫。#!\n\n如今，城里已无力再守。显贵们请[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]离开，准备与奥斯曼人议定开城的条件。眼下[GetCountry('BYZ').Custom('OeThsEncircled')]：已合围时，城归奥斯曼人，保留特权；未合围时，城仍属帝国，但要按年向苏丹纳款。"
 oe_ths.5.a: "开城纳款"
 oe_ths.5.a.tt: "已合围：塞萨洛尼基归奥斯曼，获得[ShowModifier('oe_ths_privileges')]，持续#Y 20#!年\n未合围：塞萨洛尼基仍属帝国，城获得[ShowModifier('oe_ths_harac')]，帝国获得[ShowModifier('oe_ths_harac_pay')]，各持续#Y 15#!年\n第二朝廷结束\n臣属苏丹期间，苏丹的耐心#G +20#!；否则奥斯曼的不满（如有）消除"
 oe_ths.5.b: "倾尽府库再守一年"
 oe_ths.5.b.tt: "花费#R 6#!个月的贸易与税收收入\n城心设为#Y 35#!，封锁再撑约#Y 12#!个月（只能选一次）"
 oe_ths.6.t: "第二朝廷的终结"
 oe_ths.6.desc_held: "#F 1387年，塞萨洛尼基没能撑到援军，开城投降。#!\n\n如今，封锁已满四年，城中军民始终没有屈服，奥斯曼人的大军终于撤走。[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]回京复命，父子言归于好。帝国威望#G +10#!，塞萨洛尼基的军区（如有）忠诚#G +5#!。"
 oe_ths.6.desc_quiet: "#F 1387年塞萨洛尼基开城以后，曼努埃尔流寓爱琴海诸岛，后来与父亲和解。#!\n\n如今，奥斯曼人的大军始终没有到来。#Y 5#!年过去，第二朝廷失去了存在的理由，[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]回到京城，父子言归于好。"
 oe_ths.6.desc_gone: "#F 1387年塞萨洛尼基开城以后，曼努埃尔流寓爱琴海诸岛，后来与父亲和解。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName]已经不在了，第二朝廷随之瓦解，塞萨洛尼基重归京城的号令。"
 oe_ths.6.desc_safe: "#F 1387年塞萨洛尼基开城以后，曼努埃尔流寓爱琴海诸岛，后来与父亲和解。#!\n\n如今，奥斯曼人自顾不暇，城外的威胁烟消云散，第二朝廷也随之结束，塞萨洛尼基重归京城的号令。"
 oe_ths.6.a: "重归一统"
 oe_ths.6.a.tt: "[ShowModifier('oe_ths_second_court')]与[ShowModifier('oe_ths_two_courts')]移除"
 oe_ths.10.t: "投奔的王子"
 oe_ths.10.desc_ths: "#F 1416年前后，奥斯曼王子穆斯塔法起兵反对苏丹穆罕默德一世，兵败后逃进塞萨洛尼基。苏丹索人；帝国与苏丹约定，把穆斯塔法软禁在利姆诺斯岛，帝国每年得到一笔供养金。奥斯曼人称此人为冒名者。#!\n\n如今，奥斯曼王族的[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_cand').GetCharacter.GetName]与苏丹失和，带着几名随从逃进了塞萨洛尼基，请求帝国庇护。苏丹的使节随后赶到，要帝国交人。"
 oe_ths.10.desc_city: "#F 1416年前后，奥斯曼王子穆斯塔法起兵反对苏丹穆罕默德一世，兵败后逃进塞萨洛尼基。苏丹索人；帝国与苏丹约定，把穆斯塔法软禁在利姆诺斯岛，帝国每年得到一笔供养金。奥斯曼人称此人为冒名者。#!\n\n如今，奥斯曼王族的[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_cand').GetCharacter.GetName]与苏丹失和，带着几名随从逃进了君士坦丁堡，请求帝国庇护。苏丹的使节随后赶到，要帝国交人。"
 oe_ths.10.a: "软禁于利姆诺斯"
 oe_ths.10.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_cand').GetCharacter.GetName]来到帝国，由帝国看管\n帝国获得[ShowModifier('oe_ths_custody')]，看管期间一直生效\n奥斯曼对帝国好感#G +10#!，持续#Y 10#!年\n苏丹换代时，帝国可以放此人去争夺王位"
 oe_ths.10.b: "交还苏丹"
 oe_ths.10.b.tt: "奥斯曼对帝国好感#G +25#!，持续#Y 10#!年\n此事就此了结"
 oe_ths.10.c: "礼送出境"
 oe_ths.10.c.tt: "此人离开帝国，此事就此了结"
 oe_ths.11.t: "苏丹驾崩"
 oe_ths.11.desc: "#F 1421年5月，苏丹穆罕默德一世去世，穆拉德二世即位。帝国朝中两派相争：共治皇帝约翰八世主张放出穆斯塔法，许以支持，换取加里波利；老皇帝曼努埃尔主张守约。约翰八世一派占了上风，帝国的船把穆斯塔法送到加里波利附近登岸。#!\n\n如今，奥斯曼的王座换了主人，新苏丹[SCOPE.sCharacter('oe_ths_su').GetName]刚刚即位。帝国看管的[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName]仍在。朝中有人主张放此人去争王位，事成之后交出加里波利；也有人主张守约，继续看管。"
 oe_ths.11.a: "放出王子，许以加里波利"
 oe_ths.11.a.tt: "局势#bold #color_yellow 穆斯塔法之乱#!#!开始：[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName]与新苏丹争位，帝国押[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName]（势#G +10#!，押注深度#Y 1#!）\n[ShowModifier('oe_ths_custody')]移除\n争位最多#Y 18#!个月；押中的话，新苏丹会交出加里波利，帝国不再纳贡"
 oe_ths.11.b: "守约，继续看管"
 oe_ths.11.b.tt: "奥斯曼对帝国好感#G +25#!，持续#Y 10#!年\n继续看管，供养照旧（如有）"
 oe_ths.11.c: "把王子交给新苏丹"
 oe_ths.11.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName]交给奥斯曼，囚禁#Y 10#!年\n[ShowModifier('oe_ths_custody')]移除\n奥斯曼对帝国好感#G +40#!，持续#Y 10#!年\n此事就此了结"
 oe_ths.12.t: "加里波利的钥匙"
 oe_ths.12.desc: "#F 穆斯塔法由帝国的船只送到加里波利附近登岸，随即夺取加里波利和埃迪尔内，据有鲁米利亚。帝国派人去索要加里波利，遭到拒绝。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]已在鲁米利亚站稳了脚跟，势#G +10#!。按照约定，加里波利应当交给帝国。\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 oe_ths.12.a: "遣使索要加里波利"
 oe_ths.12.a.tt: "#G 30%#!的可能对方交出加里波利\n#R 70%#!的可能对方拒绝，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]的势#R −5#!"
 oe_ths.12.b: "先助此人夺取江山"
 oe_ths.12.b.tt: "花费#R 2#!个月的贸易与税收收入\n押注深度#G +1#!（最多#Y 3#!），所押一方的势#G +10#!"
 oe_ths.12.c: "转而与新苏丹修好"
 oe_ths.12.c.tt: "改押[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]，押注深度归零\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]的势#G +10#!，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]的势#Y −10#!\n奥斯曼对帝国好感#G +10#!，持续#Y 5#!年"
 oe_ths.13.t: "乌卢阿巴特湖畔"
 oe_ths.13.desc: "#F 1422年初，穆斯塔法渡海进攻布尔萨，在乌卢阿巴特湖畔与穆拉德二世对峙。鲁米利亚的诸侯连夜倒戈，穆斯塔法兵败逃走，不久被擒，被处以绞刑。#!\n\n如今，两军在安纳托利亚隔水对峙，鲁米利亚的诸侯开始动摇，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]的势上升了。\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 oe_ths.13.a: "送船送兵"
 oe_ths.13.a.tt: "押注深度#G +1#!（最多#Y 3#!），所押一方的势#G +15#!"
 oe_ths.13.b: "只送钱"
 oe_ths.13.b.tt: "花费#R 2#!个月的贸易与税收收入\n所押一方的势#G +8#!"
 oe_ths.13.c: "抽身，改押苏丹"
 oe_ths.13.c.tt: "改押[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]，押注深度归零"
 oe_ths.13.d: "静观其变"
 oe_ths.13.d.tt: "局势照常发展"
 oe_ths.14.t: "穆斯塔法之乱的结局"
 oe_ths.14.desc_won: "#F 1422年春，穆斯塔法兵败被擒，被处以绞刑；同年夏天，穆拉德二世兴兵围攻君士坦丁堡，报复帝国。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]登上了苏丹之位。帝国押对了人，新苏丹会兑现诺言吗？"
 oe_ths.14.desc_turned: "#F 1422年春，穆斯塔法兵败被擒，被处以绞刑；同年夏天，穆拉德二世兴兵围攻君士坦丁堡，报复帝国。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]坐稳了王位。帝国中途改换门庭，站在了胜者一边。[GetCountry('BYZ').Custom('OeThsMusFate')]"
 oe_ths.14.desc_lost: "#F 1422年春，穆斯塔法兵败被擒，被处以绞刑；同年夏天，穆拉德二世兴兵围攻君士坦丁堡，报复帝国。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]赢得了王位。帝国押错了人，新苏丹不会忘记。[GetCountry('BYZ').Custom('OeThsMusFate')]"
 oe_ths.14.desc_none: "#F 1422年春，穆斯塔法兵败被擒，被处以绞刑；同年夏天，穆拉德二世兴兵围攻君士坦丁堡，报复帝国。#!\n\n如今，争位的人都已出局，这场变故没有分出帝国所期望的结果。帝国的押注落空，也不欠谁什么。"
 oe_ths.14.a: "知道了"
 oe_ths.14.a.tt: "押中王子：约#Y 30#!天后，新苏丹会来兑现约定\n中途改押苏丹并胜：与奥斯曼停战#Y 10#!年，奥斯曼对帝国好感#G +25#!\n押错：约#Y 30#!天后，新苏丹会兴兵问罪\n无人胜出：此事了结"
 oe_ths.15.t: "践约的苏丹"
 oe_ths.15.desc_reneged: "#F 穆斯塔法兵败身死，许给帝国的加里波利从未兑现。#!\n\n如今，新苏丹[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]派来使节，感谢帝国的帮助，却对加里波利绝口不提。帝国不必再向苏丹纳贡，两国停战#Y 15#!年。"
 oe_ths.15.desc_given: "#F 穆斯塔法兵败身死，许给帝国的加里波利从未兑现。#!\n\n如今，新苏丹[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]派来使节，感谢帝国的帮助：加里波利交给了帝国。帝国不必再向苏丹纳贡，两国停战#Y 15#!年。"
 oe_ths.15.desc_plain: "#F 穆斯塔法兵败身死，许给帝国的加里波利从未兑现。#!\n\n如今，新苏丹[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]派来使节，感谢帝国的帮助。帝国不必再向苏丹纳贡，两国停战#Y 15#!年。"
 oe_ths.15.a: "受之"
 oe_ths.15.a.tt: "奥斯曼对帝国好感#G +40#!，持续#Y 20#!年\n与奥斯曼停战#Y 15#!年\n#G 不再向苏丹纳贡#!：取消对奥斯曼的岁币协议（如有）"
 oe_ths.16.t: "兵临城下"
 oe_ths.16.desc: "#F 1422年6月，穆拉德二世为报复帝国扶持穆斯塔法，围攻君士坦丁堡。8月，苏丹的幼弟“小穆斯塔法”在安纳托利亚起事，围城随之解除；据杜卡斯记载，帝国为此出过钱。#!\n\n如今，新苏丹[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName]记恨帝国押了对手，大军开到了君士坦丁堡城下。奥斯曼对帝国好感#R −30#!，持续#Y 10#!年。"
 oe_ths.16.a: "资助奥斯曼王族起事"
 oe_ths.16.a.tt: "花费#R 3#!个月的贸易与税收收入\n[SCOPE.sCharacter('oe_ths_kin').GetName]在安纳托利亚起事：奥斯曼稳定#G −2.5#!\n围城解除；约#Y 1#!年后苏丹会提出和约，条件较宽"
 oe_ths.16.b: "死守城墙"
 oe_ths.16.b.tt: "君士坦丁堡有#bold #color_yellow 狄奥多西城墙#!#!时：稳定#R −2.5#!，花费#R 2#!个月的人力\n没有时：稳定#R −7#!，花费#R 4#!个月的人力，君士坦丁堡获得[ShowModifier('oe_ths_siege_scars')]，持续#Y 5#!年\n约#Y 1#!年后苏丹会提出和约"
 oe_ths.16.c: "献金求和"
 oe_ths.16.c.tt: "花费#R 6#!个月的贸易与税收收入\n围城解除；约#Y 6#!个月后苏丹会提出和约，条件较宽"
 oe_ths.17.t: "1424年的和约"
 oe_ths.17.desc_mild: "#F 1424年2月，约翰八世与穆拉德二世议和：帝国再度向苏丹纳贡，交出色雷斯的若干城市，大致退回1403年以前的疆界。#!\n\n如今，奥斯曼的大军已经撤走，苏丹的使节带来和约：帝国重新向苏丹纳贡。帝国此前的让步换来了宽和的条件，苏丹没有索要土地。"
 oe_ths.17.desc_harsh: "#F 1424年2月，约翰八世与穆拉德二世议和：帝国再度向苏丹纳贡，交出色雷斯的若干城市，大致退回1403年以前的疆界。#!\n\n如今，奥斯曼的大军已经撤走，苏丹的使节带来和约：帝国重新向苏丹纳贡，并交还加里波利条约收回的城市（塞萨洛尼基一带除外）。"
 oe_ths.17.a: "接受"
 oe_ths.17.a.tt: "按岁币协议重新向苏丹纳贡：先付一笔岁币，以后每年一月续付；另有威望#R −15#!、[oe_tu_authority|e]#R −5#!，与奥斯曼停战#Y 5#!年（已有岁币协议时不再重签）\n条件严苛时：加里波利条约收回、又不在塞萨洛尼基一带的城市交还奥斯曼"
 oe_ths.17.b: "拒绝"
 oe_ths.17.b.tt: "奥斯曼对帝国好感#R −50#!，持续#Y 10#!年\n#R 与奥斯曼的停战取消#!\n塞萨洛尼基可能再次被封锁"
 oe_ths.20.t: "封锁塞萨洛尼基"
 oe_ths.20.desc: "#F 1422年6月，奥斯曼边疆诸侯封锁了塞萨洛尼基。城中向京城求援，京城只派来一位将领，既无兵，也无饷。#!\n\n如今，奥斯曼人的军队又一次封锁了塞萨洛尼基，城中派人向京城求援。\n\n塞萨洛尼基获得[ShowModifier('oe_ths_blockaded')]。全城坚守的意志称为#bold #color_yellow 城心#!#!，眼下是#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!：每月#R −1#!；奥斯曼人控制城周围至少#Y 2#!处地方（#bold #color_yellow 合围#!#!）时再#R −1#!。城心降到#Y 0#!，城就守不住了；封锁满#Y 5#!年时城心不低于#Y 30#!，围城就会解除。封锁满#Y 8#!个月或城心降到#Y 25#!以下时，威尼斯可能愿意接手这座城。"
 oe_ths.20.a: "派一位将领，无兵无饷"
 oe_ths.20.a.tt: "城心#G +5#!"
 oe_ths.20.b: "派兵派饷"
 oe_ths.20.b.tt: "花费#R 3#!个月的贸易与税收收入\n城心#G +20#!"
 oe_ths.20.c: "让城里自筹"
 oe_ths.20.c.tt: "城心#R −5#!"
 oe_ths.21.t: "城中的两派"
 oe_ths.21.desc: "#F 封锁之下，富人不肯为共同的防务出钱，平民闹事，要求与奥斯曼人和解。#!\n\n如今，塞萨洛尼基的显贵和百姓吵成了两派：一派要守，一派要和。"
 oe_ths.21.a: "逼显贵出钱共守"
 oe_ths.21.a.tt: "城心#G +10#!"
 oe_ths.21.b: "弹压闹事的百姓"
 oe_ths.21.b.tt: "城心#G +5#!"
 oe_ths.21.c: "听任议和派"
 oe_ths.21.c.tt: "城心#R −10#!"
 oe_ths.22.t: "献城威尼斯"
 oe_ths.22.desc: "#F 1423年春，专制公安德洛尼卡经内格罗蓬特向威尼斯献城，条件是尊重居民的财产、习俗、商业权利和东正教会，由威尼斯负责防守；此事可能没有先请示京城。9月，威尼斯的桨帆船驶进了港口。#!\n\n如今，塞萨洛尼基的守臣派人来报：威尼斯人愿意接手这座城，并负责防守。守臣没等京城答复，已经与威尼斯人谈好了条件。\n\n城心#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!，封锁已#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!个月。"
 oe_ths.22.a: "交给威尼斯"
 oe_ths.22.a.tt: "塞萨洛尼基归威尼斯，获得[ShowModifier('oe_ths_ven_pledge')]，持续#Y 10#!年\n威尼斯对帝国好感#G +30#!，持续#Y 20#!年\n奥斯曼对威尼斯好感#G −30#!，持续#Y 10#!年\n封锁结束"
 oe_ths.22.b: "再守下去"
 oe_ths.22.b.tt: "花费#R 2#!个月的贸易与税收收入\n城心#G +15#!"
 oe_ths.22.c: "向苏丹求和"
 oe_ths.22.c.tt: "花费#R 6#!个月的贸易与税收收入\n#G 60%#!的可能苏丹解围：封锁结束，奥斯曼对帝国好感#G +10#!，持续#Y 5#!年\n#R 40%#!的可能钱白花，城心#R −10#!"
 oe_ths.23.t: "城的结局"
 oe_ths.23.desc_fell: "#F 1430年3月29日，穆拉德二世攻破了塞萨洛尼基，劫掠三天。#!\n\n如今，城心耗尽，奥斯曼人已经控制了城的四周。守军开城投降，塞萨洛尼基归了奥斯曼人。"
 oe_ths.23.desc_harac: "#F 1430年3月29日，穆拉德二世攻破了塞萨洛尼基，劫掠三天。#!\n\n如今，城心耗尽，但奥斯曼人没能合围。城中的显贵与奥斯曼人议定：城仍属帝国，按年向苏丹纳款。塞萨洛尼基获得[ShowModifier('oe_ths_harac')]，帝国获得[ShowModifier('oe_ths_harac_pay')]，各持续#Y 15#!年。"
 oe_ths.23.desc_held: "#F 1430年3月29日，穆拉德二世攻破了塞萨洛尼基，劫掠三天。#!\n\n如今，封锁已满五年，城中军民始终没有屈服，奥斯曼人撤走了。帝国威望#G +10#!。"
 oe_ths.23.a: "知道了"
 oe_ths.23.a.tt: "[ShowModifier('oe_ths_blockaded')]移除，封锁结束"
 oe_ths.24.t: "1430年3月"
 oe_ths.24.desc: "#F 1430年3月29日，穆拉德二世攻破了威尼斯治下的塞萨洛尼基，劫掠三天。7月，威尼斯与奥斯曼议和，承认失去此城。#!\n\n如今，消息传来：威尼斯人守了几年，塞萨洛尼基还是落入了奥斯曼人之手。"
 oe_ths.24.a: "知道了"
 oe_ths.24.a.tt: "只是消息，没有效果"
 oe_ths.90.t: "（隐藏）放出王子：押宝第2局"
 oe_ths.91.t: "（隐藏）交城给威尼斯"
 oe_ths.92.t: "（隐藏）1387年开城"
 oe_ths.93.t: "（隐藏）1424年的和约"
 oe_ths.94.t: "（隐藏）收留来投的王子"
 oe_ths.95.t: "（隐藏）把王子交给苏丹"
 oe_ths.96.t: "（隐藏）索要加里波利"
