 oe_sub_establish_duhu_protectorate_desc: "将位于西域、漠北、东北、青藏或交趾等边疆大区的附庸册立为东方羁縻都护府；若其控有喀什噶尔、别失八里、奴儿干或昇龙，将自动激活历史都护府专属加成。冷却15年。"
