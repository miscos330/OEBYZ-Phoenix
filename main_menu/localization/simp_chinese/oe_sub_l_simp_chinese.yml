 oe_sub_foederati: "同盟边藩"
 oe_sub_foederati_desc: "承袭罗马古典边防盟邦旧制的军事附庸。几乎不缴常规金钱岁币，改以常备兵源与边疆守御效忠帝国；宗主可代修要塞道路并征召军团，强制参与一切防御战与宗主进攻战，须先削藩改制方可吞并。"
 LEAD_oe_sub_foederati: "$LIST$是[SUBJECT_TYPE.GetName]"
