 oe_sub_charter_city_overlord_opinion: "商业特许城邦"
 oe_sub_brother_kingdom: "共主兄弟王国"
 oe_sub_brother_kingdom_desc: "由帝国级宗主敕封的同教或同王朝共治王国。尊荣极高而离心甚微，为宗主提供正统与外交容量并转输高额列强积分；满50年且好感极高后方可依礼整合，并支持派遣宗王子弟出镇监国。"
 LEAD_oe_sub_brother_kingdom: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_sub_brother_kingdom: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_sub_brother_kingdom_subject_opinion: "帝国兄长宗主"
 oe_sub_brother_kingdom_overlord_opinion: "共主兄弟王国"
 oe_sub_protectorate_duhu: "东方羁縻都护府"
 oe_sub_protectorate_duhu_desc: "承袭汉唐大元安西、北庭、奴儿干与安南都护府旧制的边疆羁縻体系。外交容量消耗极低，宗主可代建驰道边城并强制调停其私斗；保留地方风俗以换取高控制与低叛意，若控有四大历史都护坐标更可触发帝国威望加成。"
 LEAD_oe_sub_protectorate_duhu: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_sub_protectorate_duhu: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_sub_protectorate_duhu_subject_opinion: "天朝都护宗主"
 oe_sub_protectorate_duhu_overlord_opinion: "羁縻都护府"
 STATIC_MODIFIER_NAME_oe_sub_foederati_muster: "边藩整军备战"
 STATIC_MODIFIER_DESC_oe_sub_foederati_muster: "获颁同盟边藩敕书后加紧充实边防营伍与城池防务。"
 STATIC_MODIFIER_NAME_oe_sub_duhu_anxi: "安西都护府节度"
 STATIC_MODIFIER_DESC_oe_sub_duhu_anxi: "控扼喀什噶尔与葱岭丝路咽喉，兼护西域绿洲商旅与边关守备。"
 STATIC_MODIFIER_NAME_oe_sub_duhu_beiting: "北庭都护府节度"
 STATIC_MODIFIER_DESC_oe_sub_duhu_beiting: "镇抚别失八里与天山北麓草场，稳控草原驿道与游牧边军。"
 STATIC_MODIFIER_NAME_oe_sub_duhu_nurgan: "奴儿干都司镇抚"
 STATIC_MODIFIER_DESC_oe_sub_duhu_nurgan: "坐镇黑龙江口奴儿干城，抚绥东北林海诸部并维持边疆管辖。"
 STATIC_MODIFIER_NAME_oe_sub_duhu_annan: "安南都护府节度"
 STATIC_MODIFIER_DESC_oe_sub_duhu_annan: "控守昇龙与交趾海陆津要，沟通南海市舶并安抚岭南边鄙。"
 STATIC_MODIFIER_NAME_oe_sub_duhu_overlord_network: "四镇都护丝路威望"
 STATIC_MODIFIER_DESC_oe_sub_duhu_overlord_network: "所属羁縻都护府控扼西域、北庭、奴儿干或安南重镇，为帝国带来商路红利与四方声望。"
 STATIC_MODIFIER_NAME_oe_sub_four_duhu_glory: "四方都护盛世威仪"
 STATIC_MODIFIER_DESC_oe_sub_four_duhu_glory: "多处历史都护重镇齐归藩屏，帝国声威震慑欧亚边疆，诸藩望风归附。"
 STATIC_MODIFIER_NAME_oe_sub_fort_comp_tax: "关隘让渡减税补偿"
 STATIC_MODIFIER_DESC_oe_sub_fort_comp_tax: "宗主收回边疆战略关隘后特予五年赋税宽减以资补偿。"
 STATIC_MODIFIER_NAME_oe_sub_requisitioned_fleet: "征调藩邦联合作战舰队"
 STATIC_MODIFIER_DESC_oe_sub_requisitioned_fleet: "沿海附庸应诏献船并调拨水师协同作战，大幅缓解帝国舰队维护与海军传统积累。"
 STATIC_MODIFIER_NAME_oe_sub_tribute_remitted: "宗主恩免岁币"
 STATIC_MODIFIER_DESC_oe_sub_tribute_remitted: "宗主特旨宽免岁币十年，藩库得以休养生息，君民皆感天恩。"
 STATIC_MODIFIER_NAME_oe_sub_overlord_remit_tribute: "蠲免藩贡以安四方"
 STATIC_MODIFIER_DESC_oe_sub_overlord_remit_tribute: "帝国主动减收部分属国岁贡以换取藩邦长久忠顺。"
 STATIC_MODIFIER_NAME_oe_sub_heavy_war_tribute: "军兴特别重饷负担"
 STATIC_MODIFIER_DESC_oe_sub_heavy_war_tribute: "为宗主应急筹措军兴特别岁币导致短期税政紧绷、民怨上升。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_engineers: "帝国工兵团驻藩援建"
 STATIC_MODIFIER_DESC_oe_sub_imperial_engineers: "宗主派遣工部匠师与工程兵团协助修筑城垣、港埠与市政基建。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_drill: "帝国教导团军制整训"
 STATIC_MODIFIER_DESC_oe_sub_imperial_drill: "宗主教导团将官按帝国操典整训藩军队列与火器战术，军纪与士气显著提升。"
 STATIC_MODIFIER_NAME_oe_sub_shared_commercial_code: "帝国统一商法与度量衡"
 STATIC_MODIFIER_DESC_oe_sub_shared_commercial_code: "宗藩两地通行统一契约法典与度量衡标准，商旅通畅且新知思潮传布倍速。"
 STATIC_MODIFIER_NAME_oe_sub_frontier_subsidy: "帝国边防常备戍饷"
 STATIC_MODIFIER_DESC_oe_sub_frontier_subsidy: "宗主按岁拨付前线要塞戍守专款，极大减轻强敌当面之藩邦军防开支。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_diet_authority: "群藩述职帝国仪威"
 STATIC_MODIFIER_DESC_oe_sub_imperial_diet_authority: "诸藩君主齐聚帝都述职宣誓，朝纲肃穆而宗主权威广布天下。"
 STATIC_MODIFIER_NAME_oe_sub_famous_general_garrison: "帝国名将镇守边藩"
 STATIC_MODIFIER_DESC_oe_sub_famous_general_garrison: "宗主敕封的宿将出镇督师，严整边军纪律并深得当地军民敬服。"
 STATIC_MODIFIER_NAME_oe_sub_dynastic_regency: "宗王子弟出镇监国"
 STATIC_MODIFIER_DESC_oe_sub_dynastic_regency: "帝室宗亲开府监国，既稳宗藩血脉羁縻，又震慑地方离心势力。"
 STATIC_MODIFIER_NAME_oe_sub_heir_at_imperial_court: "藩邦世子入京侍学"
 STATIC_MODIFIER_DESC_oe_sub_heir_at_imperial_court: "本邦世子或宗室子弟正在帝都侍学受教，朝野恪守臣节而不敢轻动。"
 STATIC_MODIFIER_NAME_oe_sub_court_educated_bond: "御前侍学归藩亲善"
 STATIC_MODIFIER_DESC_oe_sub_court_educated_bond: "曾于帝都受教的世子归国秉政，推崇宗主典章制度并长期维系宗藩睦谊。"
 STATIC_MODIFIER_NAME_oe_sub_overlord_honor_prestige: "广颁藩邦荣衔声誉"
 STATIC_MODIFIER_DESC_oe_sub_overlord_honor_prestige: "帝国以尊贵荣衔羁縻四方藩君，外交声望与宫廷威仪随之俱增。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_resident: "御前驻藩监督使（都护长史）"
 STATIC_MODIFIER_DESC_oe_sub_imperial_resident: "宗主委派干练重臣驻藩稽核赋税与地方控制，政令贯通但略抑本邦内阁自主。"
 STATIC_MODIFIER_NAME_oe_sub_resident_tribute_gain: "驻藩监督岁入核增"
 STATIC_MODIFIER_DESC_oe_sub_resident_tribute_gain: "御前监督使厘清属国财赋账目，使宗主岁贡分成更为充盈。"
 STATIC_MODIFIER_NAME_oe_sub_dynastic_marriage_bond: "宗藩赐婚姻盟"
 STATIC_MODIFIER_DESC_oe_sub_dynastic_marriage_bond: "帝室赐婚缔结血缘纽带，有效稳固宗藩互信并抵御外敌离间。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_bastion_loc: "帝国敕赐边防要塞"
 STATIC_MODIFIER_DESC_oe_sub_imperial_bastion_loc: "宗主划转并拨款加固的前线堡垒，城防与周边控制均获强化。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_engineers_loc: "帝国工兵营驻点"
 STATIC_MODIFIER_DESC_oe_sub_imperial_engineers_loc: "帝国工兵团在此城驻点施工，营造效率与地方繁荣稳步攀升。"
 STATIC_MODIFIER_NAME_oe_sub_frontier_marshal_char: "敕封镇边大将"
 STATIC_MODIFIER_DESC_oe_sub_frontier_marshal_char: "受宗主敕封出镇边藩的名将，统兵威望与临阵指挥更上一层。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_viceroy_char: "御前出镇监国亲王"
 STATIC_MODIFIER_DESC_oe_sub_imperial_viceroy_char: "奉帝室诏命出镇藩邦的宗室监国，兼理政务外交而威仪赫然。"
 STATIC_MODIFIER_NAME_oe_sub_hostage_at_court_char: "帝都御学堂质宿侍学"
 STATIC_MODIFIER_DESC_oe_sub_hostage_at_court_char: "奉诏居留宗主帝都侍学修礼，期间暂不领兵出征。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_honor_title_char: "帝国敕授藩君荣衔"
 STATIC_MODIFIER_DESC_oe_sub_imperial_honor_title_char: "获帝国御赐塞巴斯托克拉托、亲王或大波雅尔等显赫荣衔，名望卓著。"
 STATIC_MODIFIER_NAME_oe_sub_resident_commission_char: "奉使驻藩监督长史"
 STATIC_MODIFIER_DESC_oe_sub_resident_commission_char: "正奉命出任驻藩监督使，十年任期内专司稽核藩务而不兼本国内阁职守。"
 STATIC_MODIFIER_NAME_oe_sub_imperial_academy_grad_char: "御前书院拔擢门生"
 STATIC_MODIFIER_DESC_oe_sub_imperial_academy_grad_char: "经宗主御前书院悉心栽培的藩邦俊彦，政务、外交与兵略兼进。"
 STATIC_MODIFIER_NAME_oe_sub_house_arrest_char: "押解帝都严加看管"
 STATIC_MODIFIER_DESC_oe_sub_house_arrest_char: "因在藩邦跋扈弄权被槛车押回帝都软禁，剥夺领兵与入阁资格。"
