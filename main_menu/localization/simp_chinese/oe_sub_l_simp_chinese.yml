 oe_sub_foederati_overlord_opinion: "同盟边藩"
 oe_sub_charter_city: "商业特许城邦"
 oe_sub_charter_city_desc: "依帝国特许状自治的沿海自由贸易共和国，仿克尔宋、拉古萨、刺桐港与诺夫哥罗德商埠旧制。免除远征进攻兵役以换取高额商业分成、船坞泊权与双向思潮高速传播，并向宗主输送商队配额。"
 LEAD_oe_sub_charter_city: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_sub_charter_city: "$LIST$的[SUBJECT_TYPE.GetName]。"
