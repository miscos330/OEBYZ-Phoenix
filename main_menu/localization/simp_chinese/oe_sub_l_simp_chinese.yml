 oe_sub.30.t: "御前仲裁：藩属私斗"
 oe_sub.30.d: "两方属国使节跪列丹墀之下，各呈兵祸与疆界状纸。宗主既已强令停兵结约，如今朝堂上下都在静候帝国最终裁断：是秉公各戒以彰法度，抑或偏护一方以收人心？"
 oe_sub.30.a: "秉公裁断、各戒其过"
 oe_sub.30.b: "偏护首告之藩以固忠诚"
 oe_sub.30.c: "各罚岁银以戒轻启兵端"
 oe_sub.40.t: "群藩述职大典"
 oe_sub.40.d: "四方藩君与使臣依礼赴京述职，奉上岁贡簿册并宣誓效忠帝国。御史台亦借此机会清点各藩朝贺仪节，探察是否存在怀贰蓄异之徒。"
 oe_sub.40.a: "颁赐玺书、嘉奖勤藩并戒异志"
 oe_sub.40.b: "敕设大宴、广布帝室恩泽"
 oe_sub.40.c: "严申藩律、震慑四方诸侯"
 oe_sub.50.t: "宗王开府出镇"
 oe_sub.50.d: "帝室宗亲已抵达藩邦首府，当地贵族与官吏齐集城门迎候仪仗。宗主当决定是赐予全权节钺以安政局，抑或再遣府库官佐随行助其理政。"
 oe_sub.50.a: "赐节钺仪仗、总摄藩邦大政"
 oe_sub.50.b: "敕遣府库匠佐随行协理营造"
 oe_sub.55.t: "藩邦世子侍学归国"
 oe_sub.55.d: "入京御学堂侍学五年的藩邦世子已通晓帝国典章、礼乐与兵法，藩邦使臣亦已奉表恭迎归国。如今礼送还藩，正可化昔日质宿之嫌为世代亲善之纽带。"
 oe_sub.55.a: "厚赐书卷仪仗、礼送还藩"
 oe_sub.55.b: "留任御前近侍、再历三年"
 oe_sub.60.t: "四方都护安边报捷"
