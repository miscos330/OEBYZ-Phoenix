 oe_sub_demote_to_direct_vassal_desc: "将高度忠诚的同盟边藩、商业特许城邦、兄弟王国或羁縻都护府降格回标准直辖附庸，以重新开启外交吞并路径，但会引发显著自由渴望上升与不满。冷却20年。"
