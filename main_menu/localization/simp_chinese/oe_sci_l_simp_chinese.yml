 oe_sci_cab_calibrate_observatory_action_progress_tooltip: "精密校准星表、经度与远洋罗盘数据，助力科学革命与启蒙思潮传播，并提升海权与探索效率。"
 oe_sci_player_only_tt: "仅人类玩家可亲自颁行此启蒙科学里程碑决议。"
 oe_sci_free_build_tt: "皇家启蒙敕令免除兴建费用"
 oe_sci_dec_muteferrika_ferman.title: "颁行穆特费里卡御准印书敕令"
 oe_sci_dec_muteferrika_ferman.desc: "效法 1727 年苏丹御旨与大穆夫提世俗专印教令，正式核准阿拉伯字母活字印书局开印历史、地理、词典与兵制算学著作，免除首座印书局建造成本、刊印《治国方略》传世初本，并将此壮举载入全球启蒙印刷档案。"
 oe_sci_dec_muteferrika_ferman.a: "颁布御旨，开印世俗科学典籍"
 oe_sci_dec_charter_royal_society.title: "特许创立皇家科学学会"
 oe_sci_dec_charter_royal_society.desc: "向国内自然哲学家与实验仪器名匠颁发皇家特许状，以“不轻信任何人之言”为院训成立皇家科学学会，免建费落成学会殿堂、刊印《哲学汇刊》创刊合集，并将此里程碑写入全球启蒙档案。"
 oe_sci_dec_charter_royal_society.a: "颁发皇家特许状，立实证科学之基"
 oe_sci_dec_publish_encyclopedie.title: "刊行《科学、艺术与工艺百科全书》"
 oe_sci_dec_publish_encyclopedie.desc: "集结启蒙学者与百工铜版画师于都城编修出版宏伟的《百科全书》，免建费在首都设立启蒙百科编修印书院、献上《百科全书》传世名作，并向全欧亚文人共和国宣告启蒙出版里程碑。"
 oe_sci_dec_publish_encyclopedie.a: "付梓刊行，绘就人类知识之树"
 oe_sci_dec_siku_qintianjian.title: "开馆总纂《四库全书》与钦天合历"
 oe_sci_dec_siku_qintianjian.desc: "征召翰林学士与钦天监历算官于大都、上元、吴县或建阳兴建文渊四库与钦天观象馆，总纂四部典籍并校定精密星表；若耶稣会东传已开启，将额外触发中西合历科研共鸣加成。"
 oe_sci_dec_siku_qintianjian.a: "开馆校书观象，汇通古今历算"
 oe_sci_dec_aldine_jiangnan_boom.title: "扶植八开活字与江南吴县建阳书坊潮"
 oe_sci_dec_aldine_jiangnan_boom.desc: "减免威尼斯、美因茨、阿姆斯特丹或江南吴县、建阳商业书坊的纸墨税赋，推动便携八开古典善本与大众雕版蒙学读本席卷市井，献上双端刻书传世善本并点燃早期印刷识字率跃升。"
 oe_sci_dec_aldine_jiangnan_boom.a: "轻税惠坊，广布善本于天下"
 STATIC_MODIFIER_NAME_oe_sci_muteferrika_ferman_mod: "穆特费里卡御旨开印"
 STATIC_MODIFIER_DESC_oe_sci_muteferrika_ferman_mod: "苏丹御旨与世俗专印教令护航新式阿拉伯活字印书局，提升科研速度、图书产量并降低思潮接纳花费。"
 STATIC_MODIFIER_NAME_oe_sci_hattat_guild_compromise_mod: "书法抄书匠行会和解补贴"
 STATIC_MODIFIER_DESC_oe_sci_hattat_guild_compromise_mod: "朝廷资助传统书法家专攻圣典与御制手卷，换取教界与行会对世俗科学印刷的支持。"
 STATIC_MODIFIER_NAME_oe_sci_royal_society_charter_mod: "皇家科学学会特许状"
 STATIC_MODIFIER_DESC_oe_sci_royal_society_charter_mod: "以实证实验为核心的皇家学会网络带动全国科研速度、思潮增长与新募大师造诣。"
 STATIC_MODIFIER_NAME_oe_sci_peer_review_journal_mod: "《哲学汇刊》同行评审制度"
 STATIC_MODIFIER_DESC_oe_sci_peer_review_journal_mod: "定期公开发表并经同行复核的科学论文持续拉升科研效率、月识字率与国家创新倾向。"
 STATIC_MODIFIER_NAME_oe_sci_encyclopedie_publication_mod: "《百科全书》工艺与理性传播"
 STATIC_MODIFIER_DESC_oe_sci_encyclopedie_publication_mod: "百科全书精印铜版工艺图谱流布工坊与沙龙，全面提高识字率、全国生产效率与思潮扩散速度。"
 STATIC_MODIFIER_NAME_oe_sci_open_press_defence_mod: "护持自由出版与公开论辩"
 STATIC_MODIFIER_DESC_oe_sci_open_press_defence_mod: "朝廷拒绝全面查禁百科印坊，令科研与思潮扩散保持昂扬势头，但保守教士颇有微词。"
 STATIC_MODIFIER_NAME_oe_sci_royal_censorship_board_mod: "皇家书报总检署"
 STATIC_MODIFIER_DESC_oe_sci_royal_censorship_board_mod: "严密审查坊间印本维系了正统威望、稳定投入与教界欢心，却稍稍放缓了前沿科研步伐。"
 STATIC_MODIFIER_NAME_oe_sci_siku_qintianjian_mod: "四库总纂与钦天合历"
 STATIC_MODIFIER_DESC_oe_sci_siku_qintianjian_mod: "官修大典与精密观象历算双管齐下，同步增进科研速度、文化传统与士绅教士识字率上限。"
 STATIC_MODIFIER_NAME_oe_sci_jesuit_calendar_resonance_mod: "中西合历远东观象共鸣"
 STATIC_MODIFIER_DESC_oe_sci_jesuit_calendar_resonance_mod: "借助耶稣会东传带来的望远镜与几何星表，钦天监与朝廷学者实现跨洲天文历算突破。"
 STATIC_MODIFIER_NAME_oe_sci_aldine_jiangnan_boom_mod: "欧亚商业刻书黄金潮"
 STATIC_MODIFIER_DESC_oe_sci_aldine_jiangnan_boom_mod: "便携八开本与江南吴县、建阳商业书坊令纸张与图书产销两旺，持续推高全国识字率。"
 STATIC_MODIFIER_NAME_oe_sci_classical_archive_mod: "古典孤本精校印书库"
 STATIC_MODIFIER_DESC_oe_sci_classical_archive_mod: "将濒危古希腊、阿拉伯与中原善本抢救入印并广为校勘，厚植国家文化影响力、传统底蕴与科研实力。"
 STATIC_MODIFIER_NAME_oe_sci_meridian_resonance_mod: "赤道子午线实证凯旋共振"
 STATIC_MODIFIER_DESC_oe_sci_meridian_resonance_mod: "跨洲子午线大地测量实证了地球扁率与精密经度，强力推动启蒙思潮扩散、科研加速与远洋探索。"
 STATIC_MODIFIER_NAME_oe_sci_observatory_calibration_mod: "观象台经纬星表校准"
 STATIC_MODIFIER_DESC_oe_sci_observatory_calibration_mod: "新校赤道经纬仪与航海天文历同步强化国家科研、海权控制与思潮吸收。"
 STATIC_MODIFIER_NAME_oe_sci_enlightenment_leap_mod: "启明跃迁：识字与思潮共振"
 STATIC_MODIFIER_DESC_oe_sci_enlightenment_leap_mod: "高识字率、传世科学名作与地标印书学院彼此激荡，进入科研与思潮加速跃迁期。"
 oe_sci.1.t: "御旨与教令"
 oe_sci.1.d: "金角湾晨光透过工坊长窗，易卜拉欣·穆特费里卡与工匠们捧起刚铸成的阿拉伯铅活字版与苏丹金色御旨。大穆夫提颁下的教令划定了精妙界线：尊崇《古兰经》与圣训仍归传统书法抄写，而历史、世界舆图、词典、天文与兵制方略得以放手排印。墨香在帝都回荡，宫廷正待陛下定夺印书局的扩印尺度。"
 oe_sci.1.a: "恪守世俗教令界线，稳健刊行史地词典"
 oe_sci.1.b: "扩大格致兵制印量，扶植新兴印刷工坊"
 oe_sci.2.t: "伊斯坦布尔抄书匠行会请愿风波"
 oe_sci.2.d: "数百名手执芦苇笔与墨盒的传统抄书匠（Hattat）齐聚清真寺广场外陈情，忧心活字印机将断绝世代抄书生计。大宰相与谢赫伊斯兰提议以官款补贴名家专事精装手抄与宫廷细密画，而印书局则恳请朝廷力排众议、加速添置新机。"
 oe_sci.2.a: "拨款补贴抄书名家，以手抄圣典与活字世俗并行"
 oe_sci.2.b: "力挺印书局扩产，任由效率引领书业更替"
 oe_sci.3.t: "1660《不轻信任何人之言》"
 oe_sci.3.d: "橡木穹顶大厅内，黄铜气泵、棱镜与折射望远镜陈列于长桌之上。受赐皇家特许状的自然哲学家们立下响亮院训——“不轻信任何人之言”，宣告一切学说皆须经公开实验与精密观测验证。学会正请示陛下是否追加专款建置实验仪器库，以推动跨国学术通信。"
 oe_sci.3.a: "嘉许实证精神，授予学会皇家荣誉与常态资助"
 oe_sci.3.b: "追加国库专款购置精密仪器，抢占科学革命先机"
 oe_sci.4.t: "1665《哲学汇刊》创刊"
 oe_sci.4.d: "皇家科学学会首期期刊《哲学汇刊》正式付梓，首创由同行学者匿名评议实验记录、公开刊载观测数据与器具图纸的制度。自此之后，天涯海角的学者不必依赖秘传手稿，皆可按图复验并接力推进人类知识前沿。"
 oe_sci.4.a: "确立严格同行评审机制，铸就百年权威学刊"
 oe_sci.4.b: "加印廉价单行本广布工坊与商埠，加速知识普及"
 oe_sci.5.t: "1751《百科全书》刊行"
 oe_sci.5.d: "烛火摇曳的启蒙沙龙与铜版印坊里，厚重的对开本《科学、艺术与工艺详解百科全书》陆续成书。编纂诸贤将制铁、织布、钟表、造船与天文光学悉数绘入铜版图谱，并绘制恢宏的人类理性知识之树，令工匠技艺首次与古典哲学并肩登堂入室。"
 oe_sci.5.a: "广布百科全书与工艺图谱，点燃启蒙理性浪潮"
 oe_sci.5.b: "以皇家荣衔礼遇编者，兼顾传统秩序与学术声望"
 oe_sci.6.t: "百科书报查禁与地下印坊风波"
 oe_sci.6.d: "随着百科全书与政论小册子风靡茶馆书肆，保守教界与旧制法官联名弹劾部分辞条冒犯成宪，要求收缴铅版、查封违禁印坊；而开明大臣警告，苛刻查禁只会迫使印商转入地下与境外，反令本国痛失启蒙人才与出版税收。"
 oe_sci.6.a: "护持公开学术论辩，限制书检官越权查封"
 oe_sci.6.b: "设立皇家书报总检署，优先稳固王权正统与教界安宁"
 oe_sci.7.t: "《四库全书》与钦天监合历"
 oe_sci.7.d: "文渊阁内朱丝栏黄绫函套浩如烟海，数千翰林学士校勘经史子集四部典籍；不远处的古观象台上，青铜赤道经纬仪与新式望远镜并立，钦天监历算官将古今星表与实测交食数据合校成书，令帝国典籍与数理观象交相辉映。"
 oe_sci.7.a: "重用钦天历算与实学条目，广推中西合璧数理之学"
 oe_sci.7.b: "彰明典籍正统与文治威仪，以四部总汇垂范后世"
 oe_sci.8.t: "钦天监历法之争：古法与西算交锋"
 oe_sci.8.d: "日食将临之际，钦天监内守旧历官与采用三角实测的新法算师爆发激烈争执，各自呈递时刻截然不同的预报奏折。满朝文武聚焦观象台，等待陛下裁定是否当众实测日食分秒以决高下。"
 oe_sci.8.a: "命两派当众实测日食，唯以天象分秒为准绳"
 oe_sci.8.b: "设双轨校历署调和两派，维系朝堂和睦与渐进改良"
 oe_sci.9.t: "阿尔杜斯八开本与江南刻书潮"
 oe_sci.9.d: "无论在威尼斯运河畔的斜体活字印坊，还是江南吴县精雕书肆与福建建阳麻沙书市，轻便平价的新式印本正飞入寻常商贾与学子案头。昔日仅存于贵族书库的农书、算经与古典史著，如今在市井茶坊便可随手翻阅。"
 oe_sci.9.a: "顺应商刻大众化浪潮，推动市民识字与算学普及"
 oe_sci.9.b: "官府延聘名儒精校善本，树典雅学术之标杆"
 oe_sci.10.t: "抢救古典孤本"
 oe_sci.10.d: "随着战火与沧桑变迁，大批珍贵的古希腊哲学、天文学与医学羊皮卷孤本辗转流落书肆。精通古语的校勘学者与活字印师联合上书，恳请朝廷出资收购并排印成千百部精校本，使千年绝学免于兵燹散佚。"
 oe_sci.10.a: "出资抢救并排印全套古典孤本，立万世书库"
 oe_sci.10.b: "择要誊录宫廷典藏，弘扬帝国文教声望"
 oe_sci.11.t: "建阳麻沙本与吴县精刻"
 oe_sci.11.d: "建阳书坊凭借廉价高效的雕版快印将日用类书、本草与算学歌诀行销四方，吴县刻工则以纤毫毕现的套色精刻赢得士林赞誉。两地书市交相激荡，令市井商民识字率节节攀升，地方书税与纸业亦随之兴盛。"
 oe_sci.11.a: "宽减书坊纸墨杂征，助推识字率与出版长盛"
 oe_sci.11.b: "规范书市牙税与版籍登记，充实国库并抚慰书商"
 oe_sci.12.t: "赤道子午线测量凯旋"
 oe_sci.12.d: "远赴赤道高地完成子午线弧度实测的科学远征队凯旋而归，携回以精密象限仪与摆钟记录的海量大地测量数据！消息传遍皇家科学院与各国观象台，地球扁率之争一锤定音，全新绘制的《赤道子午线实测星图志》正引领全境迈入启蒙科学黄金时代。"
 oe_sci.12.a: "颁行《赤道子午线实测星图志》，掀起全境启蒙跃迁"
 oe_sci.12.b: "隆重嘉奖远征学者，扬帝国科学声威于四海"
 oe_sci.90.t: "启蒙科学、印刷与皇家学会"
