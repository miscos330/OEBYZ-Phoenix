 oe_sci_cab_patronize_encyclopedia_action_progress_tooltip: "调集全国印坊与学者编纂科学工艺百科全书，拉升月识字率、科研效率、书籍产能与市民满意度。"
 oe_sci_cab_calibrate_observatory: "钦天观象与历算校准"
 oe_sci_cab_calibrate_observatory_desc: "命行政大臣主持皇家观象台校准赤道经纬仪与航海星表，启动时额外授予三年观象历算增益，同步提升科研速度、海权存在、远航探索与思潮传播。"
