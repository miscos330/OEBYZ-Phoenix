 oe_sci_woa_celestial_atlas: "天文星图志"
 oe_sci_woa_celestial_atlas_desc: "依据精密浑仪与子午线实测绘制的星象海图全册，推动思潮传播、贸易中心力量与全国海权存在。"
 oe_sci_woa_celestial_atlas_name_0: "《$ADJECTIVE|U$赤道星表图志》"
 oe_sci_woa_celestial_atlas_name_1: "《$FIRST_NOUN|U$子午线实测星图》"
 oe_sci_woa_celestial_atlas_name_2: "《$ADJECTIVE|U$$FIRST_NOUN|U$观象全图》"
 oe_sci_art_usul_al_hikem: "《治国方略》与《万库卢词典》御印初本"
 oe_sci_art_usul_al_hikem_desc: "1727 年伊斯坦布尔御旨印书局用阿拉伯活字刊行的开山世俗典籍，兼载双语词典、世界舆图与兵制方略。"
 oe_sci_art_philosophical_transactions: "《哲学汇刊》创刊合集"
 oe_sci_art_philosophical_transactions_desc: "皇家学会确立同行评审与公开实验报告制度后的首部科学期刊汇编，成为启蒙时代实验科学之基石。"
 oe_sci_art_encyclopedie_diderot: "《科学、艺术与工艺详解百科全书》"
 oe_sci_art_encyclopedie_diderot_desc: "荟萃启蒙哲人与百工铜版图谱的宏伟百科巨著，以人类理性知识之树重塑全欧亚的出版与思潮格局。"
 oe_sci_art_siku_quanshu_almanac: "《四库全书总目》与《钦天监新法算书》"
 oe_sci_art_siku_quanshu_almanac_desc: "合经史子集四部善本总目与钦天监中西合璧历算星表于一馆，见证东亚帝国典籍集成与精密天文观象巅峰。"
 oe_sci_art_aldine_jiangnan_canon: "《八开古典精校本》与《江南建阳善本志》"
 oe_sci_art_aldine_jiangnan_canon_desc: "欧亚两端商业印刷革命的典范合帙：威尼斯便携斜体八开本与江南吴县、建阳精雕善本交相辉映。"
 oe_sci_art_meridian_star_atlas: "《赤道子午线实测星图志》"
 oe_sci_art_meridian_star_atlas_desc: "跨洲子午线测量远征队归国后由皇家科学院与观象台合校的精密大地经纬与赤道星图全册。"
 oe_sci_pm_aldine_octavo: "阿尔杜斯八开斜体活字"
 oe_sci_pm_aldine_octavo_desc: "仿效威尼斯阿尔杜斯印书坊的便携八开本与斜体铅活字工艺，大幅压低古典与科学典籍的排印成本，同时保持稳健的坊间利润。"
 oe_sci_pm_muteferrika_type: "穆特费里卡阿拉伯铜铅活字"
 oe_sci_pm_muteferrika_type_desc: "按照 1727 年伊斯坦布尔御准印书局工艺铸造阿拉伯字母活字并配用套色墨料，专印历史、世界地理、词典与兵制算学诸书。"
 oe_sci_pm_jiangnan_woodblock: "江南吴县建阳雕版套印"
 oe_sci_pm_jiangnan_woodblock_desc: "结合福建建阳商刻速印与江南吴县精雕枣梨木版及朱墨套印传统，无需铅锡依赖即可海量刊行算学、农书、本草与科举蒙学读本。"
 oe_sci_pm_encyclopedia_folio: "启蒙皇家对开插图百科精印"
 oe_sci_pm_encyclopedia_folio_desc: "动用精刻铜版工艺图谱与大型对开活字印机成套印制《百科全书》、学会汇刊与官修大典，单座印坊产书量提升五成。"
 oe_sci_muteferrika_press: "穆特费里卡御准印书局"
 oe_sci_muteferrika_press_desc: "奉御旨与大穆夫提世俗专印教令设立的活字印书局，可建于君士坦丁堡、开罗、大不里士、巴格达、非斯或德里，以稳健毛利量产世俗科学典籍并拉升市民识字率与科研速度。"
 oe_sci_royal_scientific_society: "皇家科学学会殿堂"
 oe_sci_royal_scientific_society_desc: "秉持“不轻信任何人之言”实证精神的皇家科学院，可建于伦敦、巴黎、威尼斯、阿姆斯特丹、莱顿、柏林、维也纳、涅瓦、君士坦丁堡或美因茨，常设实验仪器与同行评审期刊，显著加速科研与艺术大师涌现。"
 oe_sci_royal_society_maint: "皇家学会仪器与期刊维护"
 oe_sci_siku_qintianjian_hall: "文渊四库与钦天观象馆"
 oe_sci_siku_qintianjian_hall_desc: "融合官修巨帙典籍馆藏与钦天监观象测历职责的东亚学术地标，可建于大都、上元、吴县或建阳，兼采江南雕版套印与对开精印工艺，稳步提升教士市民识字率、图书产出与文化传统。"
 oe_sci_encyclopedia_scriptorium: "启蒙百科编修印书院"
 oe_sci_encyclopedia_scriptorium_desc: "解锁“文人共和国”科技后可在任何国家首都兴建的跨文明启蒙编修出版中枢，自由切换阿尔杜斯八开、江南雕版或皇家对开百科精印工艺，驱动全国识字率与思潮加速。"
 oe_sci_adv_aldine_jiangnan_publishing: "八开活字与江南商刻"
 oe_sci_adv_aldine_jiangnan_publishing_desc: "吸收威尼斯便携斜体八开本与江南吴县、建阳商业雕版刻书的双向革新，解锁两种高效印刷配方并全面提升识字率与图书产量。"
 oe_sci_adv_empirical_transactions: "实证实验与学会汇刊"
 oe_sci_adv_empirical_transactions_desc: "确立公开可复现实验与同行评审科学期刊制度，解锁皇家科学学会殿堂并加速科研与思潮扩散。"
 oe_sci_adv_secular_imperial_press: "世俗敕印与帝国官修"
 oe_sci_adv_secular_imperial_press_desc: "以国家法度与御旨统筹世俗科学活字印刷与大型官修典籍观象机构，解锁穆特费里卡御准印书局与文渊四库钦天观象馆，并大幅降低思潮接纳成本。"
 oe_sci_adv_republic_of_letters: "跨洲文人共和国"
 oe_sci_adv_republic_of_letters_desc: "跨国通信网、译书沙龙与百科全书编纂将欧亚学者紧密相连，解锁首都启蒙百科编修印书院并增加可雇大师名额与文化影响力。"
 oe_sci_adv_encyclopedic_synthesis: "百科理性总成"
 oe_sci_adv_encyclopedic_synthesis_desc: "将实验科学、工艺图谱与近代法理融为统一的启蒙知识体系，赋予工业革命前夜的终极科研速度、识字率上限与立法效率跃升。"
 oe_sci_press_charter_law: "出版与学术特许法"
 oe_sci_press_charter_law_desc: "确立国家对活字印刷、官修大典与学会期刊的制度框架：在保护抄书匠与教界的世俗专印敕令、稳固王权的官修总纂书检、以及鼓励实验争鸣的开放同行评审宪章之间作出抉择。"
 oe_sci_pol_muteferrika_secular_ferman: "世俗专印敕令"
 oe_sci_pol_muteferrika_secular_ferman_desc: "效法 1727 年奥斯曼御旨与教令的折中智慧：礼敬宗教典籍的传统手抄地位，同时以国家特许全力刊印历史、舆图、词典与格致算学诸书。"
 oe_sci_pol_imperial_compendium_censor: "官修总纂书检"
 oe_sci_pol_imperial_compendium_censor_desc: "由朝廷翰林与书检官统筹编纂传世巨帙、收编天下善本并核定正统口径，强化王权、正统、稳定与文化传统，但趋于守成。"
 oe_sci_pol_nullius_in_verba_open: "开放同行评审宪章"
 oe_sci_pol_nullius_in_verba_open_desc: "以“不轻信任何人之言”为立院信条，保障学会期刊与百科工艺图谱自由论辩，大幅拉升识字率、思潮传播与科研速度，但会引起保守教士不满。"
 oe_sci_cab_imperial_translation_bureau: "主持皇家译书局"
 oe_sci_cab_imperial_translation_bureau_desc: "委派外交重臣统筹外邦科学论著、星表与航海志的译介出版，加速全国思潮传播、降低接纳成本并提升外交声望与文化影响力。"
