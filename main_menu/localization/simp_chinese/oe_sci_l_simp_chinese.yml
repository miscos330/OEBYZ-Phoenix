 oe_sci_woa_encyclopedia_compendium: "百科全书大典"
 oe_sci_woa_encyclopedia_compendium_desc: "总汇百工技艺、史地算学与古典文献的巨帙典籍，为藏书都城带来持久识字率上限、思潮扩散与文化影响力。"
 oe_sci_woa_encyclopedia_compendium_name_0: "《$ADJECTIVE|U$百工百科全书》"
