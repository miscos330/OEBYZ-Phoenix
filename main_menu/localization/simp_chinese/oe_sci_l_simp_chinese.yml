 ARTIST_TYPE_NAME_oe_sci_natural_philosopher: "自然哲学家"
 ARTIST_TYPE_DESC_oe_sci_natural_philosopher: "以实验实证与数理推演探究自然律的学会学者，常驻宫廷即可显著加速科研进程与思潮传播。"
 ARTIST_TYPE_NAME_oe_sci_imperial_astronomer: "钦天历算官"
 ARTIST_TYPE_DESC_oe_sci_imperial_astronomer: "主持观象台测绘、星表编修与远洋经度校准的皇家历算大师，同步助力学术科研与远洋贸易航程。"
 oe_sci_woa_scientific_treatise: "科学论著"
 oe_sci_woa_scientific_treatise_desc: "记录实证实验、力学光学或治国实学的传世科学名著，永久提升馆藏地识字率、思潮传播与全国科研速度。"
