 oe_sci_cab_patronize_encyclopedia: "资助百科全书编修"
 oe_sci_cab_patronize_encyclopedia_desc: "派遣行政大臣协调印刷坊、铜版画师与各科学者编纂百科辞典，显著提升全国月识字率、科研速度与图书产出。"
