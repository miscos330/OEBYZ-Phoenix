l_simp_chinese:
 oe_ir_coinage: "改革币制"
 oe_ir_coinage_desc: "以统一的成色、重量与铸印重建帝国货币的信用。消耗#R 50权威#!，只能完成一次。\n\n若海佩伦特权已达到最高等级，解锁并实施#Y 海佩伦铸币#!；否则获得#Y 废除海佩伦#!修正，铸币收入#R −100%#!，持续#Y 24个月#!，并解锁、实施#Y 十字币铸币#!。"
 oe_hyperpyron_coinage: "海佩伦铸币"
 oe_hyperpyron_coinage_desc: "重铸可信的帝国货币，以金、银、铜三种币材维系城镇与乡野的交易。"
 oe_state_guild_mining: "国有行会控制"
 oe_state_guild_mining_desc: "由帝国监督的行会核定矿籍、组织开采并保障供货，使地下的财富服务于共同的繁荣。"
 OE_PURPLE_MINES_UNLOCK: "解锁城镇特权#Y 紫室采矿场#!。"
 oe_purple_mines: "紫室采矿场"
 oe_purple_mines_desc: "列入紫室矿籍的矿场由皇室保障其权利，并招徕矿工、商旅和冶炼工匠。仅限铁、铜、锡、铅、煤炭、明矾或硝石产地。"
 oe_precious_metals_control: "金银管制法"
 oe_precious_metals_control_desc: "金银须先满足帝国铸币与国内交换的需要，不得任由外商运出国境。"
 oe_rhodian_maritime_law: "《罗得海法》"
 oe_rhodian_maritime_law_desc: "以罗得岛传承的海上法度裁断船货、共同海损与商旅纠纷，令帝国的港口各守同一准绳。"
 oe_rhodian_antipiracy_law: "《罗得海法》"
 oe_rhodian_antipiracy_law_desc: "帝国舰队依海法护卫航道，对劫掠船货、庇护海盗者追究其罪。"
 oe_professional_army_tradition: "职业军队传统"
 oe_professional_army_tradition_desc: "帝国的军力建立在常备军籍、长期操练和稳定供养之上，征召仅为补充。"
 oe_higher_academies: "高等学府"
 oe_higher_academies_desc: "使研习古典、法学与治国之术的学府成为培育帝国官员和学者的共同园地。"
 oe_honorary_nobility: "贵族荣衔化"
 oe_honorary_nobility_desc: "显贵的尊荣出自皇帝所授的名位与公共服务，地方的权柄则归于统一的法度。"
 oe_roman_bureaucracy: "东罗马官僚制"
 oe_roman_bureaucracy_desc: "以熟悉法典和文书的官员贯通中央与地方，使诏令、税册与奏报在帝国境内畅行。"
 oe_revised_book_of_eparch: "新编《市政官书》"
 oe_revised_book_of_eparch_desc: "重订行会、工坊与市集的章程，厘清从生产到出售的责任，恢复城市生活的秩序。"
 oe_pax_romana: "罗马治下的和平"
 oe_pax_romana_desc: "在共同的公民权与法度之下，各地居民可以保有其语言和习俗，并安享帝国所保障的和平。"
 oe_logothetes_cabinet: "诸罗格塞特"
 oe_logothetes_cabinet_desc: "由诸罗格塞特分掌财政、军籍、邮驿与文书，以明确的职责共同辅佐御座。\n\n实行后解锁内阁行动：促进人口生育、帝国医疗保障、贸易总署。"
 oe_imperial_council: "东罗马御前咨议"
 oe_imperial_council_desc: "教士与市民代表奉召入朝，在皇帝面前陈述地方事务与共同需要，使御座的决断兼听臣民之言。"
 STATIC_MODIFIER_NAME_oe_abolish_hyperpyron: "废除海佩伦"
 STATIC_MODIFIER_DESC_oe_abolish_hyperpyron: "旧币正在回收，新币尚待流通；帝国暂时承受重整铸币体系的代价。"
 oe_armenian_identity_movement: "亚美尼亚文化认同运动"
 oe_armenian_identity_movement_desc: "高地的要塞、修院与商路再度置于帝国法度之下。亚美尼亚居民在共同服役、求学与通商中，以自身的传统参与罗马的复兴。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_ARMENIA_TITLE: "开启亚美尼亚文化认同运动"
 OE_RW_ASSIM_ARMENIA_ROW: "亚美尼亚文化"
 OE_RW_ASSIM_ARMENIA_FLAVOR: "将高地与平原的居民重新联结于共同的罗马家园。"
 OE_RW_ASSIM_ARMENIA_SOURCES: "转化[ShowCultureName('armenian_culture')]人口。"
 OE_RW_ASSIM_ARMENIA_TARGET: "逐步形成罗马文化组中的[ShowCultureName('oe_armenian_greek_culture')]文化，仅在东罗马及其各级附属国境内有亚美尼亚人口的地点传播。\n\n只能成功开启#Y 一次#!，持续#Y 30年#!，结束后不可再次开启。"
 OE_RW_ASSIM_ARMENIA_CONDITION: "东罗马及其附属国拥有亚美尼亚高地和亚美尼亚地区合计至少80%的可征服地点。"
 OE_RW_ASSIM_ARMENIA_NOT_STARTED: "尚未成功开启亚美尼亚文化认同运动；该运动只能开启一次"
 OE_RW_ASSIM_ARMENIA_WAITING: "尚未开启"
 OE_RW_ASSIM_ARMENIA_STARTED: "已开启，不能再次开启"
 OE_RW_ASSIM_ARMENIA_PROGRESS: "当前拥有：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_armenia_owned')|0]／[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_armenia_total')|0]；开启需至少[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_armenia_required')|0]处。"
