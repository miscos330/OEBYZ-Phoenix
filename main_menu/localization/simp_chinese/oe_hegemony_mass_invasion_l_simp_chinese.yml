l_simp_chinese:
 oe_heg_mass_invasion: "大规模入侵"
 oe_heg_mass_invasion_desc: "军团奉统一的诏令推进，沿途驿站优先供给军需。此番征讨期间，任何和约都须等待御座宣布收兵。"
 OE_HEG_MASS_INVASION_BONUS_TT: "成功发动后，东罗马获得#Y 大规模入侵#!：陆军移动速度#G +10%#!，#R 禁止和平#!。该修正不叠加、无固定期限，可通过“结束大规模入侵”移除。"
 oe_heg_end_mass_invasion: "结束大规模入侵"
 oe_heg_end_mass_invasion_desc: "向各路统帅发出收兵的诏令，召回使节，与所有正在交战的敌国议定停战。\n\n花费#Y 25#!政治影响力，移除“大规模入侵”修正，并使东罗马当前参与的#Y 全部战争#!达成白和平，包括其他战区的战争。已经正式转移所有权的领土不由本行动返还。此行动没有次数限制或冷却；再次获得该修正后可再次执行。"
 OE_HEG_END_MASS_INVASION_EFFECT: "消耗25政治影响力，移除“大规模入侵”修正，解除其禁止和平效果；与目前所有交战国家达成白和平。"
