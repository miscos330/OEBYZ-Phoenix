l_simp_chinese:
 OE_ALERT_RIGHT_DISMISS: "右键：本局游戏暂隐此提醒"
 OE_ALERT_CTA_ENTROPY_PILLARS: "左键：打开「帝国柱石」面板查看熵增仪表盘"
 OE_ALERT_CTA_ENTROPY_MODAL: "左键：打开帝国熵增可视化仪表盘"
 OE_ALERT_CTA_PRF: "左键：打开「帝国近卫大区政务院」面板"
 OE_ALERT_CTA_EXARCH: "左键：打开「帝国柱石」军区与附庸页"
 OE_ALERT_CTA_DECISIONS: "左键：打开国家决议面板"
 OE_ALERT_HIGH_ENTROPY_TITLE: "帝国熵增警戒（≥60）"
 OE_ALERT_HIGH_ENTROPY_DESC: "帝国五维熵值已攀升至#R 60#!以上，正承受高档税效、兵源与控制度惩罚，并面临边疆截税、白银通胀或帝国衰朽大考危机。建议立即查看熵增仪表盘并推行主动反制敕令。"
 OE_ALERT_PRF_AVAIL_TITLE: "近卫大区 / 古典管区可敕设"
 OE_ALERT_PRF_AVAIL_DESC: "帝国已满足新设近卫大区或敕封古典管区副长官的条件，可通过「帝国近卫大区政务院」委任文官或军务大区以显著压降帝国熵增与行政重负。"
 OE_ALERT_EXARCH_DISLOYAL_TITLE: "军区 / 总督区忠诚偏低"
 OE_ALERT_EXARCH_DISLOYAL_DESC: "至少有一座军区或罗马总督区处于低忠诚档位，正持续推高维度3军区离心熵增，并存在抗命或兵变隐患。请前往「帝国柱石」军区与附庸页安抚或巡察整顿。"
 OE_ALERT_SILK_OPEN_TITLE: "海上丝路走廊敕令就绪"
 OE_ALERT_SILK_OPEN_DESC: "南亚与东南亚海上丝路走廊已有关键口岸特许或季风护航舰队决议就绪，可前往国家决议面板签署通商敕令、提升走廊繁荣层级。"
 OE_ALERT_FAR_POST_TITLE: "远洋商站 / 远航特使就绪"
 OE_ALERT_FAR_POST_DESC: "印度洋或大西洋远航航路已具备派遣商馆特使或敕建海外补给站的条件，可前往国家决议面板开启远洋经营。"
