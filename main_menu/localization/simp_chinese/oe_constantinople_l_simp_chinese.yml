 oe_byz_constantinople_civic_center: "君士坦丁市政中心"
 oe_byz_constantinople_civic_center_desc: "都城的道路、供水与公共建筑，需要有人统筹工匠、材料和工期。市政中心汇集负责营建事务的贵人，使各项工程得以同时推进，而不必彼此等待。"
 oe_city_civic_maintenance: "都城市政事务"
 OE_CITY_EXPAND: "扩建"
 OE_CITY_PREPAID_PROJECT: "都城扩建拨款"
 OE_CITY_PROJECT_SUMMARY: "国库 #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_price')|0]#! 金币 · 剩余 #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_remaining')|0]#! 次"
 OE_CITY_EXPAND_DESC: "拨付#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_price')|0] 枚国库金币#!，增加该建筑一级上限，并立即提交一级工程，从#Y 0 进度#!开始施工。\n\n君士坦丁堡必须有#Y 空闲建筑队列#!，由本国控制且未被围攻。工程不会再次扣除建造金币；正常工期与后续运营仍然适用。\n\n本项目剩余 #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_remaining')|0]#! 次。提交后即消耗一次扩建机会，取消工程不会返还机会。"
 OE_CITY_QUEUE_STATUS: "空闲建筑队列：#Y [GuiScope.SetRoot(GetLocationByKey('constantinople').MakeScope).ScriptValue('oe_city_civil_free')|0]#! / [GuiScope.SetRoot(GetLocationByKey('constantinople').MakeScope).ScriptValue('oe_city_civil_capacity')|0]"
