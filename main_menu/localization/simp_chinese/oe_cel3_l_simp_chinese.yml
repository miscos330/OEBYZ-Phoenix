 oe_cel3_ci_grant_zone_lands_tt: "把本国在该大都护府所属大区内的全部非首都自有地点移交予其直辖、授予核心，并降低其独立倾向。"
 STATIC_MODIFIER_NAME_oe_cel3_duhu_charter_mod: "敕设大都护府新政"
 STATIC_MODIFIER_DESC_oe_cel3_duhu_charter_mod: "初膺天朝虎符与铜印，边疆大都护府得以迅速整饬军政、招抚民心并巩固对天子的效忠。"
 STATIC_MODIFIER_NAME_oe_cel3_first_charter_mod: "八方开府初诏"
 STATIC_MODIFIER_DESC_oe_cel3_first_charter_mod: "天朝首开一键跨洲敕设大都护府之先例，远藩仰慕天威，海疆投送与宗藩号召力显著提升。"
 STATIC_MODIFIER_NAME_oe_cel3_frontier_trade_mod: "都护互市通商"
 STATIC_MODIFIER_DESC_oe_cel3_frontier_trade_mod: "以大都护府为丝路与海丝节点设立官营互市，贡赋与转口商税源源回流国库。"
 STATIC_MODIFIER_NAME_oe_cel3_tribute_audience_mod: "万国来朝·鸿胪大宴"
 STATIC_MODIFIER_DESC_oe_cel3_tribute_audience_mod: "五年一度的朝贡大典顺利举行，四裔商队与贡船汇集京师，宗藩岁入与商市活力全面高涨。"
 STATIC_MODIFIER_NAME_oe_cel3_grand_tribute_festival_mod: "四海白银与香料盛典"
 STATIC_MODIFIER_DESC_oe_cel3_grand_tribute_festival_mod: "横跨三大洲以上的万国贡船同日抵港，白银、香料、丝瓷在天朝大市高频周转，天命威望如日中天。"
 STATIC_MODIFIER_NAME_oe_cel3_ocean_charting_mod: "四海针路海图编修"
 STATIC_MODIFIER_DESC_oe_cel3_ocean_charting_mod: "礼部与水师汇聚各国贡使呈献的海图针路，大修宝船并拓展远洋补给航程。"
 STATIC_MODIFIER_NAME_oe_cel3_dynastic_seal_mod: "承天换制·都护金印"
 STATIC_MODIFIER_DESC_oe_cel3_dynastic_seal_mod: "朝廷依本朝典章重铸各区大都护府印信与官号，令行省、都司、将军辖区名实相符，威震八荒。"
 STATIC_MODIFIER_NAME_oe_cel3_sun_never_sets_mod: "四海臣服·天朝日不落"
 STATIC_MODIFIER_DESC_oe_cel3_sun_never_sets_mod: "五大跨洲大都护府星罗棋布，陆海丝路首尾相连，天朝威仪跨越山海昼夜不息。"
 STATIC_MODIFIER_NAME_oe_cel3_eight_directions_mod: "八方归化·日月所照莫非王土"
 STATIC_MODIFIER_DESC_oe_cel3_eight_directions_mod: "八大跨洲大都护府齐备，欧亚非美诸洋尽入朝贡体系，华夏礼乐与四海商贸达至亘古未有之极盛。"
 STATIC_MODIFIER_NAME_oe_cel3_pacific_meridian_mod: "太平洋子午线商约"
 STATIC_MODIFIER_DESC_oe_cel3_pacific_meridian_mod: "天朝与极乐洲新罗马在太平洋划定互惠航道与子午线贸易港，双日商船自由往返于新洲与东海之间。"
 STATIC_MODIFIER_NAME_oe_cel3_silver_porcelain_mod: "白银换丝瓷条约"
 STATIC_MODIFIER_DESC_oe_cel3_silver_porcelain_mod: "美洲白银与华夏丝绸瓷器按官定比价跨洋对流，令太平洋两岸市场持续繁荣兴旺。"
 STATIC_MODIFIER_NAME_oe_cel3_pacific_rivalry_mod: "太平洋霸权对峙"
 STATIC_MODIFIER_DESC_oe_cel3_pacific_rivalry_mod: "东海宝船水师与极乐洲铜甲舰队在大洋深处针锋相对，激发全国造船热潮与海军锐气。"
 STATIC_MODIFIER_NAME_oe_cel3_io_demarcation_mod: "印度洋航道划界协约"
 STATIC_MODIFIER_DESC_oe_cel3_io_demarcation_mod: "天朝与罗马在锡兰、古里与红海之间议定公平关税与护航界线，印度洋香料通道畅通无阻。"
 STATIC_MODIFIER_NAME_oe_cel3_io_spice_contest_mod: "印度洋香料航路争霸"
 STATIC_MODIFIER_DESC_oe_cel3_io_spice_contest_mod: "为独掌锡兰与马六甲至波斯湾的香料命脉，水师常年巡弋印度洋各大咽喉要港。"
 STATIC_MODIFIER_NAME_oe_cel3_twin_suns_charter_mod: "跨欧亚双日和平大宪章"
 STATIC_MODIFIER_DESC_oe_cel3_twin_suns_charter_mod: "东西两大日不落帝国在欧亚万国协调框架下互认宗藩秩序与学术通流，开启百年盛世均势。"
 STATIC_MODIFIER_NAME_oe_cel3_celestial_primacy_mod: "天无二日·天朝独断"
 STATIC_MODIFIER_DESC_oe_cel3_celestial_primacy_mod: "天子拒绝与泰西平分礼制正统，宣示普天之下唯有华夏正朔独尊，皇权与天命声威倍增。"
 STATIC_MODIFIER_NAME_oe_cel3_duhu_stipend_mod: "天朝赐敕赏银"
 STATIC_MODIFIER_DESC_oe_cel3_duhu_stipend_mod: "京师特使颁赐锦缎银两以慰远藩将士，大都护府上下感念皇恩，地方治理愈加安稳。"
 STATIC_MODIFIER_NAME_oe_cel3_duhu_discipline_mod: "都护考成整肃"
 STATIC_MODIFIER_DESC_oe_cel3_duhu_discipline_mod: "御史巡按四海诸都护府，严核兵额税册，虽令远藩略有怨言，却大振朝廷纲纪与贡赋实效。"
 STATIC_MODIFIER_NAME_oe_cel3_daqin_envoy_mod: "大秦泰西通使"
 STATIC_MODIFIER_DESC_oe_cel3_daqin_envoy_mod: "泰西·大秦大都护府设立后，地中海与西欧诸城邦学者商贾络绎入华，东西文明深度交汇。"
 STATIC_MODIFIER_NAME_oe_cel3_daqin_arsenal_mod: "泰西火器舆图局"
 STATIC_MODIFIER_DESC_oe_cel3_daqin_arsenal_mod: "朝廷延揽泰西大都护府治下工匠与星历家，改铸重炮、精绘坤舆全图，军工与学术并进。"
 STATIC_MODIFIER_NAME_oe_cel3_xinzhou_envoy_mod: "新洲跨洋银邮"
 STATIC_MODIFIER_DESC_oe_cel3_xinzhou_envoy_mod: "新洲大都护府开通直航东海的跨太平洋官邮银船，将美洲矿藏与珍产稳定汇入天朝海贸网络。"
 STATIC_MODIFIER_NAME_oe_cel3_pacific_charts_mod: "沧溟东洋季风航图"
 STATIC_MODIFIER_DESC_oe_cel3_pacific_charts_mod: "扶桑与新洲水师合力测绘北太平洋黑潮与贸易风航路，彻底打通东西两半球远洋补给线。"
 oe_cel3.1.title: "敕设八方大都护府诏书"
 oe_cel3.1.desc: "丹陛之下，鸿胪寺宣读天子金诏，颁授鎏金虎符与都护铜印。自此边疆远土不再受制于万里直辖之损耗，而由天朝大都护府代镇一方、怀柔百族、通商四海。"
 oe_cel3.1.a: "颁虎符铜印，确立八方开府之制"
 oe_cel3.1.b: "兼开都护市舶互市，以商养边"
 oe_cel3.2.title: "万国来朝·亚洋贡船与丝路商队"
 oe_cel3.2.desc: "五年一度的万国来朝大典如期而至。来自各处大都护府与宣慰司的彩帆贡船与驼队鱼贯入京，将贡银、胡椒、丁香、丝绸与皮草汇入天朝核心市场，令市舶商力与天命声威同步高涨。"
 oe_cel3.2.a: "鸿胪设宴迎贡，大开京师贡市"
 oe_cel3.2.b: "厚赐回赏诸都护，以恩抚远"
 oe_cel3.3.title: "万国来朝·四海白银与香料盛典"
 oe_cel3.3.desc: "横跨三大洲以上的诸大都护府使团齐聚阙下！东海宝船、南洋香料船、安息驼队、泰西商舶与新洲银船同季抵港，天朝京师跃升为举世白银与珍奇的总枢纽，万邦咸服，盛况空前。"
 oe_cel3.3.a: "开四海大关，通汇万国银货"
 oe_cel3.3.b: "令水师汇纂各国针路，扩建远洋宝船"
 oe_cel3.4.title: "承天换制·三朝都护印信更定"
 oe_cel3.4.desc: "随着本朝典章确立与多方大都护府渐成体系，礼部奏请依当前正朔（大元行省兀鲁思、大明都护都司、大清将军办事大臣或四海礼制）统一更定各区官号与铜印，使内外名实相副。"
 oe_cel3.4.a: "依本朝正朔重铸各区都护金印"
 oe_cel3.4.b: "敕谕远藩恪守旧约，宽宥安抚"
 oe_cel3.5.title: "四海臣服·天朝日不落"
 oe_cel3.5.desc: "五大跨洲大都护府已然屹立于山海之间！从葱岭朔漠到南洋西洋，龙旗与都护官署昼夜交替映照日月。海外封藩不仅免去了万里控地之疲，更使天朝财赋、商力与天命源源不绝。"
 oe_cel3.5.a: "诏告天下：日月出入，皆我藩屏"
 oe_cel3.6.title: "八方归化·日月所照莫非王土"
 oe_cel3.6.desc: "八大跨洲大都护府尽数落成！安西、北庭、奴儿干、安南、南洋、西洋、安息、泰西、扶桑、新洲星汉灿烂，纵横万里之陆海通道尽归天朝礼乐与市舶秩序。史官濡墨，书此千古未有之大一统盛景。"
 oe_cel3.6.a: "勒石纪功，永镇八方四海"
 oe_cel3.7.title: "太平洋双日相逢"
 oe_cel3.7.desc: "天朝东洋宝船自扶桑与新洲远航大洋，与跨越美洲西岸的极乐洲新罗马铜甲舰队在太平洋海岬不期而遇！龙旗与紫金双头鹰旗在落日波涛上隔海相望——东西两座日不落帝国，将决定这座浩瀚大洋的命运。"
 oe_cel3.7.a: "缔结《太平洋子午线商约》，互惠通航"
 oe_cel3.7.b: "签署《白银换丝瓷条约》，大开两洋互市"
 oe_cel3.7.c: "陈舰太平洋，以天朝水师争雄沧溟"
 oe_cel3.8.title: "印度洋双凤会盟"
 oe_cel3.8.desc: "天朝南洋与西洋大都护府的巨型福船巡弋锡兰与古里之时，与掌控埃及、红海及印度洋门户的罗马舰队遥相呼应。东西两大帝国正立于季风香料航道的核心交叉口：是划界共荣，还是争夺印度洋霸权？"
 oe_cel3.8.a: "议定《印度洋航道划界协约》，共享香料盛利"
 oe_cel3.8.b: "厉兵秣马，独掌西洋香料航路霸权"
 oe_cel3.9.title: "欧亚万国协调会·双日共治"
 oe_cel3.9.desc: "东西两大帝国皆已在多洲建成稳固的海外都护与总督体系。随着跨欧亚外交秩序日趋成熟，东西方使臣提议召开最高规格的双日会盟，以《跨欧亚双日和平大宪章》界定礼仪、海权与通商规则。"
 oe_cel3.9.a: "签署《跨欧亚双日和平大宪章》，共治四海"
 oe_cel3.9.b: "天无二日，坚持天朝礼制独断之权"
 oe_cel3.10.title: "远藩抚绥与都护忠心考核"
 oe_cel3.10.desc: "诸跨洲大都护府僻处万里之外，兵强财足。朝堂议政分作两派：户部与鸿胪寺建言颁赐赏银丝绸以柔远安藩，都察院则力主遣御史巡按考成，以严纲纪、振天命。"
 oe_cel3.10.a: "赐敕赏银，厚抚诸方大都护府"
 oe_cel3.10.b: "遣御史整顿纲纪，提振天命岁贡"
 oe_cel3.11.title: "大秦泰西来使"
 oe_cel3.11.desc: "泰西·大秦大都护府正式开府建牙！自君士坦丁堡、罗马、威尼斯以至里斯本的使节、工匠与学者奉表入京，盛赞天朝声教远播西极，并献上西洋精纺呢绒、典籍与铸炮图谱。"
 oe_cel3.11.a: "隆礼接待泰西使团，广开欧亚互市"
 oe_cel3.11.b: "斥资延揽泰西工匠，兴办火器舆图局"
 oe_cel3.12.title: "扶桑极东·新洲来使"
 oe_cel3.12.desc: "新洲大都护府横跨浩瀚太平洋巍然立府！自加利福尼亚湾、墨西哥高原与安第斯山麓启航的官邮银船越过万里碧波抵华，携来白银、可可、蔗糖与全新东洋海图。"
 oe_cel3.12.a: "敕设跨太平洋官邮银船，汇聚新洲珍货"
 oe_cel3.12.b: "表彰远洋水师，精绘沧溟季风海图"
 oe_cel3.90.title: "天朝四海都护与万国朝贡"
 oe_cel3.90.desc_header: "#Y 【天朝 3.0 · 跨洲大都护府与万国来朝系统实时状态】#!\n"
