 oe_cel3_dem_tribute_americas: "万国来朝·新洲银船贡需"
 oe_cel3_dem_tribute_americas_desc: "横渡太平洋的新洲贡船满载白银、可可、烟草与蔗糖入港，令天朝核心市场掀起跨洋珍货与银两清结算热潮。"
