 oe_van_v97_cint_assign_war_role:0 "战时定向指令：指定单附庸战区职责"
 oe_van_v97_cint_assign_war_role_desc:0 "战时对单个忠顺参战附庸精准指派战区职责：在协同围城总攻、联合海上封锁或边镇坚壁清野三项战令中择一授予（持续2年），与全军总令与附庸军姿灵活配合。单附庸冷却2年。"
