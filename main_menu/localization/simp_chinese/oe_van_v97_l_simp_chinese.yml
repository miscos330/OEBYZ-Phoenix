 oe_van_v97.1.t:0 "御前战令：指定附庸战区职责"
 oe_van_v97.1.d:0 "枢密军务署已接通[SCOPE.sCountry('oe_van_v97_role_subject').GetName]的前线将佐。请为该参战附庸选定未来#Y 2年#!的专项战区职责（将替换其既有战时指令）："
 oe_van_v97.1.a:0 "指派：协同围城总攻（围城+15%、陆军士气+5%）"
 oe_van_v97.1.b:0 "指派：联合海上封锁（封锁+25%、海军士气+8%、护航+15%）"
 oe_van_v97.1.c:0 "指派：边镇坚壁清野（防御+20%、敌军损耗+1.5、驻军+20%）"
 oe_van_v97.1.e:0 "暂不改动其既有部署，退还军需费"
 oe_van_v97.2.t:0 "和平改制：近代阶层宪章生效"
 oe_van_v97.2.d:0 "不同于以流血与动乱硬性剥夺旧特权的惨烈覆辙，朝廷以赎买补偿与成文宪章顺利将中世纪旧阶层特权转化为近代制度。各阶层代表对帝国的稳健改制表示认可，群臣请示后续政务重心："
 oe_van_v97.2.a:0 "乘势强化文官统筹与皇室集权（5年新政势能）"
 oe_van_v97.2.b:0 "广施安抚以巩固全国安定（稳定度与威望提升）"
 oe_van_v97.3.t:0 "联军参谋会议：附庸战时协同部署"
 oe_van_v97.3.d:0 "宗主战时总令已通过驿使发往各忠顺参战附庸大营。大将军呈请是否额外抽调一笔军需经费，组建帝国联军参谋军需署以进一步稳固藩属军心并提升围城协同。"
 oe_van_v97.3.a:0 "拨银设立联军参谋军需署（2年附庸忠诚+8、围城+6%）"
 oe_van_v97.3.b:0 "沿用常规后勤体系，节约军费"
