l_simp_chinese:
 oe_red_b_holy_accord: "圣地朝圣与东方牧首护教约"
 oe_red_b_holy_friction: "耶路撒冷与亚历山大教务龃龉"
 oe_red_b_solomonic_compact: "所罗门高原—罗马红海盟谊"
 oe_red_b_red_sea_charter: "马萨瓦与亚丁红海商站特许"
 STATIC_MODIFIER_NAME_oe_red_pilgrim_charter: "东方牧首护教与朝圣特许"
 STATIC_MODIFIER_DESC_oe_red_pilgrim_charter: "以常年香火资助与开罗国书换取耶路撒冷、亚历山大与西奈朝圣畅通，外交声誉和宗教影响大增，但国库岁入略承开销。"
 STATIC_MODIFIER_NAME_oe_red_levant_defiance: "圣地护教强硬姿态"
 STATIC_MODIFIER_DESC_oe_red_levant_defiance: "拒向开罗委曲求全，以罗马皇帝正教护法名义震慑黎凡特，激发国内士气与教士拥戴，却令对外斡旋趋于僵硬。"
 STATIC_MODIFIER_NAME_oe_red_solomonic_bridge: "所罗门高原—罗马教务桥梁"
 STATIC_MODIFIER_DESC_oe_red_solomonic_bridge: "阿克苏姆、贡德尔与拉利贝拉使团跨越尼罗河与红海而来，缓和一性论与正教隔阂并引工匠南下，保守教士颇有微词。"
 STATIC_MODIFIER_NAME_oe_red_alexandrian_brokers: "亚历山大中介商路"
 STATIC_MODIFIER_DESC_oe_red_alexandrian_brokers: "搁置与埃塞俄比亚的深层教义往来，专注通过亚历山大港与开罗商行收税牟利，财税丰盈而远海声望受限。"
 STATIC_MODIFIER_NAME_oe_red_spice_charter: "马萨瓦—亚丁香料商站特许"
 STATIC_MODIFIER_DESC_oe_red_spice_charter: "在马萨瓦与亚丁设立特许商栈直通印度洋胡椒航路，贸易收益与海上存在大增，但远海护航与要塞维系成本水涨船高。"
 STATIC_MODIFIER_NAME_oe_red_barsbay_monopoly: "红海官营香料专卖"
 STATIC_MODIFIER_DESC_oe_red_barsbay_monopoly: "以强制官卖和重税护航紧控红海胡椒通道，国库税效与舰队威仪上升，却重创本土市民与外商合作意愿。"
 STATIC_MODIFIER_NAME_oe_red_canal_survey: "图拉真古运河水文勘测"
 STATIC_MODIFIER_DESC_oe_red_canal_survey: "调集埃及与帝国工匠实测瓦迪图米拉特河床与苏伊士潮汐，增进官署筹算与长远繁荣，却持续吞噬中央税入。"
 STATIC_MODIFIER_NAME_oe_red_suez_survey_camp: "苏伊士勘测工营"
 STATIC_MODIFIER_DESC_oe_red_suez_survey_camp: "勘测船队与测绘营帐云集苏伊士地峡，带动当地营造发展，征派向导与补给亦引发些许骚动。"
 STATIC_MODIFIER_NAME_oe_red_overland_caravans: "苏伊士—开罗陆路驼队转运"
 STATIC_MODIFIER_DESC_oe_red_overland_caravans: "放弃耗资惊人的开凿大计，改以修缮驿站与武装驼队维系红海陆运，商路稳妥省费，却难成震古烁今之伟业。"
 STATIC_MODIFIER_NAME_oe_red_canal_fiscal_strain: "古运河大役财力重负"
 STATIC_MODIFIER_DESC_oe_red_canal_fiscal_strain: "全面开掘尼罗河至苏伊士古航道令国库与农夫不堪重负，唯有赫赫帝威支撑大役前行。"
 STATIC_MODIFIER_NAME_oe_red_suez_corvee_unrest: "苏伊士夫役瘟疫与民怨"
 STATIC_MODIFIER_DESC_oe_red_suez_corvee_unrest: "酷暑泥沙与繁重徭役令苏伊士工地逃亡频仍，地方控制度与繁荣度显著下滑。"
 STATIC_MODIFIER_NAME_oe_red_canal_guild_debt: "运河募匠行会债负"
 STATIC_MODIFIER_DESC_oe_red_canal_guild_debt: "以重金雇募自由石匠与水利行会分期疏浚，缓和了强制劳役之怨，却背负沉重行会债息。"
 STATIC_MODIFIER_NAME_oe_red_suez_guild_works: "苏伊士雇匠水利工坊"
 STATIC_MODIFIER_DESC_oe_red_suez_guild_works: "石闸工坊与疏浚驳船在苏伊士有序施工，推进地方建置而仅留轻微市井摩擦。"
 STATIC_MODIFIER_NAME_oe_red_canal_retrenchment: "暂缓运河财政紧缩"
 STATIC_MODIFIER_DESC_oe_red_canal_retrenchment: "中止地峡挖掘工程以休养国库，短期税赋有所回缓，朝廷威信却因半途而废蒙尘。"
 STATIC_MODIFIER_NAME_oe_red_trajan_canal_open: "罗马图拉真红海运河枢纽"
 STATIC_MODIFIER_DESC_oe_red_trajan_canal_open: "重浚贯通的法老—图拉真古运河令苏伊士化作地中海与印度洋交汇的永久商港与造船重镇，巨量舟楫往来亦带来常年治理考验。"
 STATIC_MODIFIER_NAME_oe_red_trajan_canal_fortified: "苏伊士帝国关闸军港"
 STATIC_MODIFIER_DESC_oe_red_trajan_canal_fortified: "以重兵要塞与帝国关闸严密锁控图拉真运河出口，舰队整备与红海威慑臻于极境，高额关防也令商民颇觉严苛。"
 STATIC_MODIFIER_NAME_oe_red_free_canal_charter: "图拉真运河低税通商宪章"
 STATIC_MODIFIER_DESC_oe_red_free_canal_charter: "广邀地中海与印度洋商船低税经行苏伊士运河，商利与造舰齐飞，但特许商团壮大略微稀释王室直辖权。"
 STATIC_MODIFIER_NAME_oe_red_imperial_canal_tolls: "帝国红海关闸重税制"
 STATIC_MODIFIER_DESC_oe_red_imperial_canal_tolls: "对过境运河的香料与丝绸征收重额国税并以战舰缉私，财税与海军战力俱强，却令列国与商贾怨声载道。"
 STATIC_MODIFIER_NAME_oe_red_erythraean_compact: "埃塞—罗马红海联合海防约"
 STATIC_MODIFIER_DESC_oe_red_erythraean_compact: "借马萨瓦补给港与阿比西尼亚高原援军共扼红海咽喉，抗衡印度洋远来强敌，联合舰队维持费用亦令国内税效承压。"
 STATIC_MODIFIER_NAME_oe_red_chokepoint_garrisons: "红海三关独立重防"
 STATIC_MODIFIER_DESC_oe_red_chokepoint_garrisons: "在苏伊士、马萨瓦与亚丁自建铁壁防线，不倚外援而专守海峡门户，要塞维系与外交疏离随之加重。"
 STATIC_MODIFIER_NAME_oe_red_erythraean_hegemony: "红海—印度洋双海霸权"
 STATIC_MODIFIER_DESC_oe_red_erythraean_hegemony: "从亚历山大港直贯苏伊士、马萨瓦与亚丁的帝国海道彻底成型，商舰云集、威震双海，而庞大疆域的维稳与防务开支同样惊人。"
 STATIC_MODIFIER_NAME_oe_red_red_sea_commonwealth: "圣地与红海诸邦均衡共荣"
 STATIC_MODIFIER_DESC_oe_red_red_sea_commonwealth: "以宗教宽容、朝圣特许与互惠关约联结开罗、耶路撒冷与阿克苏姆，长治久安且商民殷实，中央集权则有所折让。"
 STATIC_MODIFIER_NAME_oe_red_sinai_endowment: "西奈圣凯瑟琳与圣地常例香火"
 STATIC_MODIFIER_DESC_oe_red_sinai_endowment: "定期拨银修缮西奈山古修院与耶路撒冷圣墓教堂，赢得教士阶层拥护与普世正教清望，岁入略受分流。"
 oe_red_dec_sinai_pilgrimage.title: "资助耶路撒冷与西奈圣凯瑟琳修院"
 oe_red_dec_sinai_pilgrimage.desc: "拨付国库岁银修缮圣墓教堂与西奈山古修院，巩固东方正教与高原教会纽带，但需持续分流国内税入。"
 oe_red_dec_sinai_pilgrimage.a: "拨银护持圣地古修院"
 oe_red_dec_solomonic_embassy.title: "遣使所罗门高原与阿克苏姆王廷"
 oe_red_dec_solomonic_embassy.desc: "派遣火器工匠、护卫与礼仪使节经红海赴埃塞俄比亚，换取红海沿岸呼应与跨教派合作。"
 oe_red_dec_solomonic_embassy.a: "遣使阿克苏姆与贡德尔"
 oe_red_dec_trajan_canal_charter.title: "敕建并贯通苏伊士图拉真古运河"
 oe_red_dec_trajan_canal_charter.desc: "集结重金与大批民夫疏浚苏伊士古航道并落成关闸，为苏伊士赋予永久性的双海商贸与造舰枢纽地位。"
 oe_red_dec_trajan_canal_charter.a: "动工贯通图拉真古运河"
 oe_red.1.t: "耶路撒冷朝圣者与东方牧首区"
 oe_red.1.d: "亚历山大港十字军余波未平，耶路撒冷、亚历山大与西奈山圣凯瑟琳修道院的教士联名遣使陈情。开罗苏丹将罗马朝廷视作东方正教徒的天然代言人：是以重金香火与外交文书维系护教特许，还是强硬宣示帝国对圣地的护法宗主权？"
 oe_red.1.a: "遣使开罗并拨银资助东方三牧首与圣凯瑟琳修院"
 oe_red.1.a.tt: "消耗#R 80#!金币，获得#G +5#!威望、#G +10#!宗教影响与[ShowModifier('oe_red_pilgrim_charter')]（#Y 25#!年，含税效折让），并改善罗马与马穆鲁克关系。"
 oe_red.1.b: "拒绝委曲求全，强硬宣示圣地护教宗主权"
 oe_red.1.b.tt: "消耗#R 50#!金币、稳定#R −4#!，获得#G +12#!威望与[ShowModifier('oe_red_levant_defiance')]（#Y 25#!年，外交声誉承压），并加剧与开罗的教务摩擦。"
 oe_red.2.t: "所罗门王座的使者"
 oe_red.2.d: "来自阿克苏姆、贡德尔与拉利贝拉的埃塞俄比亚修士渡海北来。西方人将他们的君主传颂为“祭司王约翰”，而使者则自称“万王之王”所罗门王室的臣仆，希望借工匠、典籍与红海联络架起一性论与正教世界的桥梁。"
 oe_red.2.a: "厚礼款待并遣工匠典籍南下，缔结高原—红海教务桥梁"
 oe_red.2.a.tt: "消耗#R 75#!金币、稳定#R −2#!，获得#G +12#!宗教影响与[ShowModifier('oe_red_solomonic_bridge')]（#Y 25#!年，保守教士满意度略降），并与埃塞俄比亚结好。"
 oe_red.2.b: "严守教义界限，仅经亚历山大港维持常规转口商贸"
 oe_red.2.b.tt: "威望#R −6#!，获得[ShowModifier('oe_red_alexandrian_brokers')]（#Y 20#!年，外交声誉略降）。"
 oe_red.3.t: "红海香料之门：马萨瓦与亚丁"
 oe_red.3.d: "从印度马拉巴尔驶来的胡椒商船穿过亚丁湾，经马萨瓦与红海北上亚历山大港。随着开罗宫廷屡次收紧官营专卖、沿岸诸邦觊觎转口厚利，如何打通红海—印度洋门户成为关乎国运的商战抉择。"
 oe_red.3.a: "在马萨瓦与亚丁敕设特许商站，直通印度洋航路"
 oe_red.3.a.tt: "消耗#R 120#!金币、人力#R −1#!，获得[ShowModifier('oe_red_spice_charter')]（#Y 25#!年，要塞维护效率略降），并改善与也门、马萨瓦沿岸关系。"
 oe_red.3.b: "推行红海官营香料专卖与重税武装护航"
 oe_red.3.b.tt: "消耗#R 60#!金币、稳定#R −4#!，获得[ShowModifier('oe_red_barsbay_monopoly')]（#Y 25#!年，市民阶层满意度与外交声誉承压）。"
 oe_red.4.t: "勘测图拉真古运河遗迹"
 oe_red.4.d: "工部典籍与埃及老匠指出，自法老涅科与罗马皇帝图拉真以降，经瓦迪图米拉特连通尼罗河与苏伊士红海的古运河河道犹有遗痕。若重疏此道，地中海帆樯即可直窥印度洋；然风沙淤塞、潮差险恶，仅前期勘测便耗费不赀。"
 oe_red.4.a: "遣水工大队全面勘测瓦迪图米拉特与苏伊士地峡"
 oe_red.4.a.tt: "消耗#R 150#!金币、人力#R −1.5#!（若已完成埃及水利规划则减为#R 100#!金币、#R −1#!人力），推进运河至阶段#Y 1#!并获[ShowModifier('oe_red_canal_survey')]（#Y 15#!年）；若直辖苏伊士则挂[ShowModifier('oe_red_suez_survey_camp')]。"
 oe_red.4.b: "放弃巨额开凿风险，改以陆路驿站与驼队转运红海货物"
 oe_red.4.b.tt: "消耗#R 60#!金币，维持陆路转运并获[ShowModifier('oe_red_overland_caravans')]（#Y 20#!年，月度威望略降）。"
 oe_red.5.t: "开掘法老与图拉真古运河"
 oe_red.5.d: "勘测图册已呈御前，苏伊士地峡清淤筑闸之役一触即发。尼罗河汛期水毁、烈日酷暑与漫天沙暴时刻吞噬着银库与丁壮：是以雷霆手段强征民夫抢工，是倾尽国库雇募自由水利行会，还是暂且下马止损？"
 oe_red.5.a: "强征民夫全线开挖，务期早日贯通苏伊士水闸"
 oe_red.5.a.tt: "消耗#R 350#!金币、人力#R −4#!、稳定#R −6#!，运河推进至施工阶段#Y 2#!，承受[ShowModifier('oe_red_canal_fiscal_strain')]（#Y 12#!年）；若直辖苏伊士将爆发[ShowModifier('oe_red_suez_corvee_unrest')]（#Y 10#!年）。"
 oe_red.5.b: "重金雇募自由石匠与水利行会，分期稳步疏浚"
 oe_red.5.b.tt: "消耗#R 480#!金币、人力#R −1.5#!、稳定#R −2#!，运河推进至施工阶段#Y 2#!，承受[ShowModifier('oe_red_canal_guild_debt')]（#Y 12#!年）；苏伊士仅受较轻[ShowModifier('oe_red_suez_guild_works')]。"
 oe_red.5.c: "财政堪忧，下诏暂缓地峡开凿工程"
 oe_red.5.c.tt: "威望#R −12#!、稳定#R −2#!，工程暂搁（日后仍可通过苏伊士决议重启），获得[ShowModifier('oe_red_canal_retrenchment')]（#Y 10#!年）。"
 oe_red.6.t: "罗马红海运河通航大典"
 oe_red.6.d: "伴随最后一道石闸轰然启开，尼罗河碧水与红海咸潮在苏伊士蓄水池交汇。自图拉真皇帝以来尘封千年的水道重现人间！如今必须定下这座咽喉巨港的百年关政：以低税通商广招天下商船，还是筑垒设关以重税军港锁控双海？"
 oe_red.6.a: "颁行低税通商宪章，使苏伊士成为自由双海巨港"
 oe_red.6.a.tt: "消耗完工经费（已施工阶段为#R 150#!金币、稳定#R −2#!；未施工则加征#R 250#!金币、人力#R −2#!、稳定#R −3#!），获得#G +20#!威望、解除工地动荡，为苏伊士赋予永久[ShowModifier('oe_red_trajan_canal_open')]，全国获[ShowModifier('oe_red_free_canal_charter')]（#Y 35#!年）。"
 oe_red.6.b: "建苏伊士帝国关闸军港，征收双海重额过境税"
 oe_red.6.b.tt: "消耗#R 120#!金币、人力#R −1.5#!、稳定#R −2#!，获得#G +15#!威望、解除工地动荡，为苏伊士赋予永久[ShowModifier('oe_red_trajan_canal_fortified')]，全国获[ShowModifier('oe_red_imperial_canal_tolls')]（#Y 35#!年）。"
 oe_red.7.t: "埃塞俄比亚—罗马红海海防盟约"
 oe_red.7.d: "绕道好望角的西欧火炮战舰与横扫黎凡特的东方强权同时逼近曼德海峡，红海不再是宁静的古老内湖。阿克苏姆与贡德尔的所罗门朝廷倡议共组红海联合巡防，以对抗外海觊觎者；而军中强硬派则主张独占苏伊士、马萨瓦与亚丁三关。"
 oe_red.7.a: "缔结埃塞—罗马红海联合巡防盟约，共扼曼德海峡"
 oe_red.7.a.tt: "消耗#R 140#!金币、人力#R −2#!，获得#G +10#!海军传统与[ShowModifier('oe_red_erythraean_compact')]（#Y 30#!年，税效略承巡防军费），并巩固与埃塞俄比亚盟谊。"
 oe_red.7.b: "独立重防苏伊士、马萨瓦与亚丁三关要塞"
 oe_red.7.b.tt: "消耗#R 120#!金币、稳定#R −3#!，获得#G +8#!陆军传统与[ShowModifier('oe_red_chokepoint_garrisons')]（#Y 30#!年，要塞维护与外交声誉承压）。"
 oe_red.8.t: "红海诸门：厄立特里亚海的黎明"
 oe_red.8.d: "从耶路撒冷的朝圣古道到苏伊士的石闸巨港，从亚历山大港的货栈到马萨瓦、亚丁与阿克苏姆高原，百余年苦心经营终成跨越地中海与印度洋的宏伟格局。朝廷须为这条双海走廊定下终局国策。"
 oe_red.8.a: "确立红海—印度洋双海海洋霸权"
 oe_red.8.a.tt: "完成红海与图拉真运河线，消耗#R 200#!金币、稳定#R −4#!，获得#G +20#!威望与[ShowModifier('oe_red_erythraean_hegemony')]（#Y 50#!年，维稳与要塞开支相应提高）。"
 oe_red.8.b: "以宽容护教与互惠关约缔造圣地—红海共荣秩序"
 oe_red.8.b.tt: "完成红海与图拉真运河线，消耗#R 150#!金币、威望#R −8#!，获得#G +6#!稳定与[ShowModifier('oe_red_red_sea_commonwealth')]（#Y 50#!年，王室阶层力量略降）。"
 oe_red.20.t: "红海与图拉真运河：选项生效"
