l_simp_chinese: 
#南望雅典
oe_byz_missions_athens: "#bold #color_yellow 南望雅典#!#!"
oe_byz_missions_athens_BUTTON_DETAILS: "由于[GetCharacter('byz_andronikos_ii_palaiologos').GetName]时期加泰罗尼亚佣兵团灾难性的背叛，帝国最终失去了雅典。这群叛徒的后裔此刻正窃据着富饶肥沃的阿提卡平原，玷污我国重要的城市，古代希腊文明的中心，雅典。我们不能容忍这些无法无天的拉丁人继续在南方统治下去"
oe_byz_missions_athens_BUTTON_TOOLTIP: "征途启程"
oe_byz_missions_athens_DESCRIPTION: "雅典娜女神向我们微笑"
oe_byz_missions_athens_CRITERIA_DESCRIPTION: "将拉丁人从希腊南部驱逐"

oe_byz_missions_athens_I: "南部诸国"
oe_byz_missions_athens_I_desc: "希腊南部林林总总地分布着诸多拉丁公国，它们是拉丁人屡次背叛罗马人留下的成果，来自于不忠于帝国的佣兵团和拉丁帝国的遗产。拉丁人的战斗力不可小觑，但是他们在体量上完全不是我们的对手，阻止我们踏平南方的，是来自域外的西方大国，那不勒斯和西西里为这些拉丁公国提供了独立保障，如果发生战争，威尼斯和热那亚也会为他们提供支援"

oe_byz_missions_athens_II: "巩固色萨利盆地"
oe_byz_missions_athens_II_desc: "色萨利盆地是前往雅典的必经之路，如果要向南方进军，我们就必须保证色萨利的稳定与安全，以免影响军队的粮草和后勤\n#Y 每月扣除5杜卡特和50人力#!"

oe_byz_missions_athens_III: "遣使教皇"
oe_byz_missions_athens_III_desc: "并非所有西方大国都甘愿与帝国作对，我们应当尝试一下外交，派一支使团前往罗马，看看能否让一些国家停止与帝国的敌对\n#Y 对我们好感度高于0的西方大国会出席罗马会议，并可能在教宗的斡旋下退出此事。与我们关系高于50的西方大国必然会退出#!"

oe_byz_missions_athens_IV: "巩固伊庇鲁斯"
oe_byz_missions_athens_IV_desc: "伊庇鲁斯的统治者在罗马与拉丁人之间摇摆不定，为了防止伊庇鲁斯在战争中背叛我们，应当彻底结束他们的自治地位"

oe_byz_missions_athens_V: "进军雅典"
oe_byz_missions_athens_V_desc: "进军雅典的时机已经成熟，前进！"

oe_byz_missions_athens_VI: "平定伯罗奔尼撒"
oe_byz_missions_athens_VI_desc: "雅典城已入我手，整个伯罗奔尼撒都应当屈服于我们"

oe_byz_missions_athens_VII: "重建卫城"
oe_byz_missions_athens_VII_desc: "雅典卫城因拉丁人的疏忽而荒草丛生，破败不堪，我们会出资修复卫城，重建雅典的荣耀"

oe_byz_missions_athens_VIII: "促进大理石开采"
oe_byz_missions_athens_VIII_desc: "大理石是雅典的支柱行业，没有任何地方的石料比雅典更加出名"

oe_byz_missions_athens_IX: "鼓励农业"
oe_byz_missions_athens_IX_desc: "阿提卡平原有多种宝贵的农业产品，我们应当充分发挥其潜力"

oe_byz_missions_athens_X: "雅典重建"
oe_byz_missions_athens_X_desc: "在我们的治理下，雅典城焕然一新，新的时代开始了"

oe_byz_missions_athens_XI: "栖代梦人的故乡"
oe_byz_missions_athens_XI_desc: "伯罗奔尼撒半岛是斯巴达人的故乡，上面资源丰富，潜力无穷"

oe_byz_missions_athens_XII: "南部光复"
oe_byz_missions_athens_XII_desc: "经过我们的英勇奋战，希腊南部重回帝国，拉丁人被永久驱逐"
oe_byz_missions_athens_XII_tt: "#Y 希腊南部的拉丁人将被驱逐#!"

#安纳托利亚再征服
oe_byz_missions_tur: "#bold #color_yellow 安纳托利亚再征服#!#!"
oe_byz_missions_tur_BUTTON_DETAILS: "自从曼齐克特战役后，帝国在亚细亚的边境线就不再安全和稳固，无数突厥部族从东方迁徙而来，侵蚀肥沃而富饶的安纳托利亚半岛。在经历数百年的衰落螺旋后，帝国几乎接近完全丢失了在安纳托利亚的土地，无数同胞被迫屈居于突厥人的淫威之下。安纳托利亚半岛是帝国财政和兵源最重要的支撑之一，无论如何，我们必须收复故土，否则帝国将无法生存"
oe_byz_missions_tur_BUTTON_TOOLTIP: "征途启程"
oe_byz_missions_tur_DESCRIPTION: "以剑之名"
oe_byz_missions_tur_CRITERIA_DESCRIPTION: "夺回失地，驱逐突厥人"

