 oe_german_holy_empire_desc: "与东罗马共戴一位君主的德意志附属帝国。"
 oe_german_kingdom: "德意志王国"
 oe_german_kingdom_desc: "拥有本国君主、效忠东罗马的统一德意志国家。"
 oe_germany_netherlands_kingdom: "尼德兰王国"
 oe_germany_netherlands_kingdom_desc: "共同的王冠保障低地城市的贸易，同时维系对罗马的忠诚。"
 oe_german_unification: "统一的德意志"
 oe_german_unification_desc: "以共同的道路、法令和议会连接德意志各地。解锁建筑：德意志国会大厦。"
 oe_german_army: "德意志陆军"
 oe_german_army_desc: "将诸邦旧军编为共同服役的陆军，统一训练、指挥与军需。解锁内阁行动：德意志陆军体系。"
 oe_german_army_system: "德意志陆军体系"
 oe_german_army_system_desc: "由内阁协调行军、操练和补员，基础效果为陆军移动速度+10%、训练度+5%、补员速度+10%，随内阁效率提高。"
