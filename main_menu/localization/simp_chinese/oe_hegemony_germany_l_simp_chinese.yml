 OE_RW_GERMANY_NO_HRE: "神圣罗马帝国已不存在"
 OE_RW_GERMANY_CONTROL_TT: "以神圣罗马帝国国际组织当前包含的所有地点为总数。\n只要地点由东罗马或其任意层级属国直接拥有，或由其中任一国家军事占领，即计入控制；同一地点只计一次，独立盟友不计入。\n\n此处显示罗马及属国的总体进度。“终结伪帝国”仍按原条件检查东罗马本国对皇帝、选帝侯首都及帝国地点的占领与所有权。"
 oe_church_state_harmony: "教国和谐"
 oe_church_state_harmony_desc: "皇帝维护教会的秩序，牧首与司祭安抚帝国的臣民。皇权与教权各守其职，以共同的信仰维系国家的安宁。\n\n东罗马帝国完成“传播正教”帝国改革后可选。维稳效率+10%，每月宗教影响力+0.1，教士满意度+5%。"
