 oe_hegemony_germany.1.t: "汉萨同盟的命运"
 oe_hegemony_germany.1.desc: "帝国的旗帜已经降下，北方商人的账簿却仍在流转。汉萨商馆遍布诸海，市议会派来的使节希望保住旧日的贸易网络。皇帝必须决定，这个不以疆土而以契约维系的同盟，在新的罗马秩序中将处于何种地位。"
 oe_hegemony_germany.1.a: "摧毁该商业同盟。"
 oe_hegemony_germany.1.b: "要求他们臣服。"
 oe_hegemony_germany.1.c: "我们不在意。"
 oe_hegemony_germany.2.t: "波希米亚的命运"
 oe_hegemony_germany.2.desc: "布拉格的王冠曾是伪帝国最有分量的支柱之一。如今波希米亚和摩拉维亚的代表来到御前，有人请求保留一道边疆王冠，有人主张把西里西亚与卢萨蒂亚一并划入。帝国也可以收回这些土地的治理权，或将它们留待德意志的新秩序。"
 oe_hegemony_germany.2.a: "成立波希米亚边疆领。"
 oe_hegemony_germany.2.b: "成立大波希米亚。"
 oe_hegemony_germany.2.c: "将波希米亚留给德意志。"
 oe_hegemony_germany.2.d: "我们必须直接统治波希米亚。"
 oe_hegemony_germany.3.t: "尼德兰的命运"
 oe_hegemony_germany.3.desc: "运河、港口与织造城市把尼德兰连成一片富庶之地。当地商人希望以一顶共同的王冠保障贸易，宫廷也有人提议只在北部设立边疆领，将南方城市留在皇帝手中。另一条道路，则是由罗马官员亲自治理全部低地。"
 oe_hegemony_germany.3.a: "成立统一的尼德兰王国。"
 oe_hegemony_germany.3.b: "成立尼德兰边疆领。"
 oe_hegemony_germany.3.c: "我们必须拥有整个尼德兰。"
 oe_hegemony_germany.4.t: "莱茵河的命运"
 oe_hegemony_germany.4.desc: "军团再次来到莱茵河畔。御案上列着旧日分封方案中留给罗马的沿岸领地：莱茵兰的大部、美因茨、奥彭海姆、沃尔姆斯和海德堡以外的普法尔茨。这些土地可以合为一个边疆王国，纳入罗马直接治理，或交给将来统一的德意志。河东诸侯的广大内陆，不属于这次莱茵沿岸的安排。"
 oe_hegemony_germany.4.a: "释放莱茵边疆领。"
 oe_hegemony_germany.4.b: "莱茵河是我们的自然疆界。"
 oe_hegemony_germany.4.c: "将莱茵地区留给德意志。"
 oe_hegemony_germany.5.t: "瑞士的命运"
 oe_hegemony_germany.5.desc: "阿尔卑斯山的谷地与隘口决定着意大利和德意志之间的交通。罗曼蒂、瑞士与雷蒂亚的代表各有古老的权利，却都必须面对同一个问题：山地将由罗马直接治理，交给一个边疆王国，还是归入统一的德意志？"
 oe_hegemony_germany.5.a: "成立雷蒂亚边疆领。"
 oe_hegemony_germany.5.b: "我们必须直接统治该地区。"
 oe_hegemony_germany.5.c: "把他们留给一个统一的德意志。"
 oe_hegemony_germany.6.t: "奥地利的命运"
 oe_hegemony_germany.6.desc: "多瑙河两岸的领地和通向意大利的山口，如今都等待皇帝的裁断。维也纳的旧宫廷可以成为新边疆王国的中心；帝国也可以派遣自己的官员，或将这些土地交给未来的德意志王冠。"
 oe_hegemony_germany.6.a: "成立奥地利边疆领。"
 oe_hegemony_germany.6.b: "我们必须直接统治该地区。"
 oe_hegemony_germany.6.c: "把他们留给一个统一的德意志。"
 oe_hegemony_germany.7.t: "德意志的命运"
 oe_hegemony_germany.7.desc: "选侯的印玺与诸侯的誓书已经失去了旧日的意义。剩下的德意志土地需要一种长久的秩序：皇帝可以亲自兼领新的神圣罗马帝国，另立一位德意志国王，或彻底打碎统一的希望。此前划归罗马直接统治的土地，不在这次分封之列。"
 oe_hegemony_germany.7.a: "成立一个统一的神圣罗马帝国。"
 oe_hegemony_germany.7.b: "成立一个统一的德意志王国。"
 oe_hegemony_germany.7.c: "德意志不能统一！"
 oe_hegemony_germany.8.t: "巴伐利亚的命运"
 oe_hegemony_germany.8.desc: "南德意志的诸侯与城市等待着最后的安排。巴伐利亚、施瓦本和法兰克尼亚可以组成一个服从罗马的边疆王国。若皇帝坚持亲自治理，新的行政负担和地方抵触也必须由帝国承担。"
 oe_hegemony_germany.8.a: "成立巴伐利亚边疆领。"
 oe_hegemony_germany.8.b: "我们必须直接统治巴伐利亚。"
 oe_hegemony_germany.9.t: "西北德意志的命运"
 oe_hegemony_germany.9.desc: "从威斯特伐利亚到下萨克森，贸易道路穿过众多旧领地。以汉诺威为名的新边疆王国能够统合这些地方；直接统治则要求罗马接过每一项未了的争端与义务。"
 oe_hegemony_germany.9.a: "成立汉诺威边疆领。"
 oe_hegemony_germany.9.b: "我们必须直接统治。"
 oe_hegemony_germany.10.t: "东北德意志的命运"
 oe_hegemony_germany.10.desc: "易北河以东的土地与波罗的海港口，是此次安排的最后一部分。勃兰登堡可以成为边疆王国的中心，把萨克森与北方沿海诸地联系起来。若拒绝这顶王冠，罗马就必须独自维系这些远方领地的秩序。"
 oe_hegemony_germany.10.a: "成立勃兰登堡边疆领。"
 oe_hegemony_germany.10.b: "我们必须直接统治。"
