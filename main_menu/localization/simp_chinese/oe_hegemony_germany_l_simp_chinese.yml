 OE_HEG_GERMANY_HRE_DESTROYED: "罗马皇帝终结了伪帝国"
 OE_HEG_GERMANY_WAR_NAME: "终结伪帝国之战"
 OE_GERMANY_DEFER_LAND: "这些土地保留到“德意志的命运”中，由统一德意志的方案分配；不会标为罗马保留直辖地。"
 oe_heg_germany_plan_desc: "花费1000金币，将南、北德意志所有可通行陆地纳入罗马文明圈，并解锁本面板后续行动。"
 oe_heg_germany_plan_effect: "花费1000金币，将南、北德意志所有可通行陆地纳入罗马文明圈，并解锁本面板后续行动。"
 oe_heg_germany_invasion_desc: "花费50政治影响力与5000金币，对神圣罗马帝国皇帝宣战，并令帝国全部成员加入同一场防御战争：“终结伪帝国之战”。帝国内属于东罗马的附属国也将脱离并加入敌方。"
 oe_heg_germany_invasion_effect: "花费50政治影响力与5000金币，对神圣罗马帝国皇帝宣战，并令帝国全部成员加入同一场防御战争：“终结伪帝国之战”。帝国内属于东罗马的附属国也将脱离并加入敌方。"
 oe_heg_germany_end_desc: "花费3外交官与100金币，解散神圣罗马帝国，将全部成员国拥有的地点转交东罗马，不新增核心。随后依次处理汉萨、波希米亚、尼德兰、莱茵河、瑞士、奥地利与德意志的命运；若拒绝统一德意志，继续处理巴伐利亚、西北和东北德意志。"
 oe_heg_germany_end_effect: "花费3外交官与100金币，解散神圣罗马帝国，将全部成员国拥有的地点转交东罗马，不新增核心。随后依次处理汉萨、波希米亚、尼德兰、莱茵河、瑞士、奥地利与德意志的命运；若拒绝统一德意志，继续处理巴伐利亚、西北和东北德意志。"
 oe_heg_germany_imperial_war: "终结伪帝国"
 oe_heg_germany_imperial_war_desc: "向冒用罗马帝号的帝国发起战争，令其诸侯共同接受真正罗马皇帝的裁断。"
