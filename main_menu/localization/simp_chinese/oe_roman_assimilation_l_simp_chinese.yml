 OE_RW_ASSIM_FLAVOR: "一道城墙可以划出疆界，共同的法度与生活却要经过几代人的积累。学校中的语言、集市上的往来与军伍中的同袍，正让四方臣民逐渐认同同一个罗马。"
 OE_RW_ASSIM_TURKISH: "[ShowCultureName('turkish_culture')]文化"
 OE_RW_ASSIM_TURKISH_DESC: "突厥部族已在小亚细亚扎根。随着帝国重建秩序，土耳其与土库曼人口将在共同的法度、语言与日常往来中，逐渐形成[ShowCultureName('oe_tur_greek_culture')]文化认同。"
 OE_RW_ASSIM_OWNERSHIP: "安纳托利亚所有权：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_anatolia_owned')|0]／[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_anatolia_total')|0]处可征服地点"
