l_simp_chinese:
 OE_ROMAN_WORLD_SHARED_HERITAGE: "罗马文明圈"
 OE_ROMAN_WORLD_OVERVIEW: "以#Y 君士坦丁堡#!为中心，罗马的城镇、信仰与政治传统仍将周边诸国联系在一起。皇帝、贝伊、专制公与拉丁领主彼此争战，也沿用着同一片土地留下的道路、商路与制度。\n\n文明圈内的兼并引发较少敌意；而谁能掌握君士坦丁堡，谁便占据了争夺#Y 罗马正统#!的中心。"
 OE_ROMAN_WORLD_NO_MEMBERS: "目前没有符合这一身份的成员。"
 OE_ROMAN_FILTER_ALL: "全部"
 OE_ROMAN_FILTER_ALL_DESC: "查看罗马文明圈中的全部有地国家。一个国家可以拥有多种特殊地位；全部成员只计数一次。"
 OE_ROMAN_FILTER_BYZ: "罗马正统"
 OE_ROMAN_FILTER_BEYLIK: "突厥贝伊"
 OE_ROMAN_FILTER_PRINCE: "专制公"
 OE_ROMAN_FILTER_LATIN_DUCHY: "拉丁公国"
 OE_ROMAN_FILTER_ORTHODOX_KINGDOM: "东方基督教"
 oe_byz_roman_world_orthodox_kingdom: "东方基督教"
 oe_byz_roman_world_orthodox_kingdom_desc: "从君士坦丁堡到高加索，东方的教会传统跨越国界，也保留着各自的礼仪与教义。凡国教为#Y 东正教或基督合性派#!的成员，均列于此类，#Y 不受国家等级限制#!。"
 OE_ROMAN_CONTEST_TAB: "群雄逐鹿"
 OE_ROMAN_CONTEST_LEADERS: "群雄竞逐"
 OE_ROMAN_CONTEST_RANK_1: "#bold #color_yellow 第一#!#!"
 OE_ROMAN_CONTEST_RANK_2: "#bold 第二#!"
 OE_ROMAN_CONTEST_RANK_3: "#bold 第三#!"
 OE_ROMAN_CONTEST_VACANT: "虚位以待"
 OE_ROMAN_CONTEST_QUOTE: "#bold #color_yellow 秦失其鹿，天下共逐之。#!#!"
 OE_ROMAN_CONTEST_QUOTE_SOURCE: "#bold #color_yellow ——《史记·淮阴侯列传》#!#!"
 OE_ROMAN_CONTEST_ACTIONS: "帝国之争"
 OE_ROMAN_CONTEST_RULES: "旧日帝国的土地上，诸国各凭实力争取自己的位置。\n\n#bold 实力得分#!＝#color_yellow 军事力量＋国家税基#!。所有有地成员均参与排名，包括附庸；前三名按游戏日更新，领土易手时也会重新计算。同分时由成员排序决定先后，名次本身不授予罗马正统或组织领袖地位。"
 OE_ROMAN_CONTEST_SCORE_BREAKDOWN: "#bold 实力得分#!\n军事力量：[GuiScope.SetRoot(Country.MakeScope).ScriptValue('oe_roman_world_contest_military')|1]\n国家税基：[GuiScope.SetRoot(Country.MakeScope).ScriptValue('oe_roman_world_contest_tax')|1]\n\n$OE_ROMAN_CONTEST_RULES$"
