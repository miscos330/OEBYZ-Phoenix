l_simp_chinese: 
#=====================================
#situation
#=====================================

 oe_noble: "拜占庭豪族"
 oe_noble_desc: "拜占庭豪族以家族庄园、私人财富与世代积累的军政关系为根基，维持自己的家兵，并参与帝国政治。家主更替不会使家族消失。"

#=====================================
#theme
#=====================================

oe_empire_theme: "帝国军区"
oe_empire_theme_desc: "这个国家是[GetCountry('BYZ').GetName]的帝国军区，这是一个军政兼容、兵农合一的组织，它基本上解决了兵员和军费上的困难，也使人口流动中的无组织状态得到控制，缓和了尖锐的社会矛盾。"

#=====================================
#region_special
#=====================================

oe_sub_hun: "匈牙利边疆区"
oe_sub_hun_desc: "桀骜不驯的马扎尔人似乎不适合直接管辖，让我们设立边疆区，授予马扎尔人自治特权以保护疆界"

oe_sub_slova: "斯洛伐克黄金区"
oe_sub_slova_desc: "斯洛伐克地区出产大量的金银矿，我们理应对此地采取特别辖制"

oe_sub_mam: "皇室领地·埃及"
oe_sub_mam_desc: "埃及是皇帝的私产与粮仓，由皇帝亲派总督治理。它不必经过同盟的阶梯，可以直接设省。"

oe_sub_religion: "五大牧首区"
oe_sub_religion_desc: "这个国家是五大牧首区之一，明面上牧首区牧首具有至高仲裁权，但实际的世俗权力仍然掌握在当地总督手中"

#=====================================
#bank
#=====================================

oe_bank: "帝国特许银行"
oe_bank_desc: "特许银行始于安德洛尼卡二世对商业行会的妥协和传奇银行家的奋斗，是带有帝国官方背景的国家特许银行机构，主持存款、放贷、国债发行、汇票兑换及金融投资。为宗主国提供银行利率−0.5%、政府债券上限+33%、信誉加成+10%。"

#=====================================
#normal
#=====================================

oe_rome_sub: "罗马同盟"
oe_rome_sub_desc: "罗马在这个国家具有强大的影响力，其被视为罗马人民的朋友与同盟者"

oe_rome_sub_II: "行省化附庸"
oe_rome_sub_II_desc: "这个国家的自治特权已经遭到大幅削弱，距离成为罗马的内部行政区只有一步之遥"

oe_sub_rr_indep: "远征兵团"
oe_sub_rr_indep_desc: "这个国家完全仰赖于远征而来的罗马军事兵团"

oe_real_gov: "官僚机构"
oe_real_gov_desc: "这个国家是东罗马帝国的官僚机构，成立的意义就是作为行政机器为皇帝服务，有自己的预算与行政人员"
