oe_bank: "帝国特许银行"
oe_bank_desc: "特许银行始于安德洛尼卡二世对商业行会的妥协和传奇银行家的奋斗，是带有帝国官方背景的国家特许银行机构，主持存款、放贷、国债发行、汇票兑换及金融投资。为宗主国提供银行利率−0.5%、政府债券上限+33%、信誉加成+10%。"

