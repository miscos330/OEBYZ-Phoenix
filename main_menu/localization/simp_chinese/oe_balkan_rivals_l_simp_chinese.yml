l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_br_simeon_unrest: "西蒙的拥护者"
 STATIC_MODIFIER_NAME_oe_br_ottoman_auxiliaries: "奥斯曼辅军"
 STATIC_MODIFIER_NAME_oe_br_western_aid: "西方援助"
 STATIC_MODIFIER_NAME_oe_br_union_scandal: "改宗的丑闻"
 STATIC_MODIFIER_NAME_oe_br_tenedos: "特内多斯的代价"
 OE_BR_JEWELS_YES: "\n\n威尼斯人还没忘记：太后当年押在他们金库里的皇冠珠宝，至今没有赎回。"
 OE_BR_JEWELS_NO: ""
 oe_br.1.t: "斯科普里的加冕"
 oe_br.1.d: "复活节那天，斯特凡·杜尚在斯科普里加冕，自称“塞尔维亚人和罗马人的皇帝”。为他加冕的是他刚刚擅自升格的塞尔维亚牧首，没有经过君士坦丁堡的同意。帝国的西邻，如今也有了一位罗马皇帝。"
 oe_br.1.a: "罗马只有一个皇帝"
 oe_br.1.a.tt: "塞尔维亚对我们的好感 −50（每年回落2）"
 oe_br.1.b: "默认他的称号，换取和平"
 oe_br.1.b.tt: "塞尔维亚对我们的好感 +50（每年回落2）"
 oe_br.2.t: "牧首的绝罚"
 oe_br.2.d: "君士坦丁堡牧首卡利斯托斯拟好了绝罚文书：塞尔维亚的皇帝和他擅立的牧首，都将被逐出教会。只等皇帝点头。"
 oe_br.2.a: "颁布绝罚"
 oe_br.2.a.tt: "塞尔维亚对我们的好感 −100（每年回落2）"
 oe_br.2.b: "暂缓，留条后路"
 oe_br.3.t: "杜尚之死"
 oe_br.3.d: "斯特凡·杜尚死了，年轻的乌罗什五世压不住父亲留下的大贵族，杜尚的兄弟西蒙已在色萨利自称皇帝。被塞尔维亚夺走的帝国旧地，此刻无人真正守着。"
 oe_br.3.a: "宣称失地"
 oe_br.3.a.tt: "获得对塞尔维亚的“恢复罗马疆界”宣战理由，20年\n塞尔维亚对我们的好感 −30（每年回落2）"
 oe_br.3.b: "扶持西蒙"
 oe_br.3.b.tt: "塞尔维亚在色萨利和伊庇鲁斯的地方获得“西蒙的拥护者”（10年，动荡上升）"
 oe_br.3.c: "与新君修好"
 oe_br.3.c.tt: "塞尔维亚对我们的好感 +50（每年回落2）"
 oe_br.4.t: "塞雷的和解"
 oe_br.4.d: "统治塞雷的约万·乌格列沙派人来到君士坦丁堡：他愿意让治下的教会重新服从君士坦丁堡牧首，结束多年的绝罚。奥斯曼人的威胁，让他比杜尚更需要朋友。"
 oe_br.4.a: "接纳他"
 oe_br.4.a.tt: "将来若塞尔维亚瓦解，接收塞雷的代价减半"
 oe_br.4.b: "拒绝"
 oe_br.5.t: "马里查河之后"
 oe_br.5.d: "塞尔维亚的贵族在马里查河几乎全军覆没，塞雷群龙无首。城里的人在问：该向谁开门？"
 oe_br.5.a: "派兵接收"
 oe_br.5.a.tt: "−300金和3个月人力（接纳过乌格列沙时减半）\n塞雷和附近最多2处塞尔维亚的地方回归帝国"
 oe_br.5.b: "按兵不动"
 oe_br.6.t: "赖着不走的援军"
 oe_br.6.d: "内战结束了，奥尔汗派来的援军却还在色雷斯过冬。他们说要等军饷，可村子里的粮仓已经空了。"
 oe_br.6.a: "出钱请走"
 oe_br.6.b: "出兵驱逐"
 oe_br.6.b.tt: "奥斯曼对我们的好感 −50（每年回落2）"
 oe_br.6.c: "划一处要塞安置他们"
 oe_br.6.c.tt: "色雷斯一处地方交给奥斯曼\n获得“奥斯曼辅军”10年"
 oe_br.7.t: "被劫的王子"
 oe_br.7.d: "奥尔汗的小儿子哈利勒在伊兹米特湾被海盗掳走，关在福西亚的城堡里。奥尔汗派人来求：只要帝国帮忙把儿子救回来，赎金他出一半，还愿意让哈利勒迎娶一位帝国公主。"
 oe_br.7.a: "出钱赎回，许下婚约"
 oe_br.7.a.tt: "奥斯曼对我们的好感 +100（每年回落1）\n与奥斯曼停战10年"
 oe_br.7.b: "扣作人质"
 oe_br.7.b.tt: "奥斯曼对我们的好感 −100（每年回落2）"
 oe_br.8.t: "萨伏伊伯爵的十字军"
 oe_br.8.d: "太后安娜的亲戚、萨伏伊的“绿伯爵”阿梅迪奥带着十五艘船和一千七百人来到海峡，要从奥斯曼人手里夺回加里波利。他缺的是船和钱。"
 oe_br.8.a: "出钱租威尼斯战船助他攻城"
 oe_br.8.a.tt: "加里波利回归帝国"
 oe_br.8.b: "婉拒"
 oe_br.9.t: "皇帝西行"
 oe_br.9.d: "奥斯曼人已经打到色雷斯的城下，国库空空如也。皇帝考虑亲自去罗马，在圣彼得大教堂向教皇宣誓服从，换西方的骑士和战船。"
 oe_br.9.a: "西行，改宗"
 oe_br.9.a.tt: "获得“西方援助”10年\n获得“改宗的丑闻”10年（正教徒心寒）\n回程时会经过威尼斯……"
 oe_br.9.b: "留在君士坦丁堡"
 oe_br.10.t: "威尼斯的债主"
 oe_br.10.d: "罗马没有给皇帝多少东西。回程路过威尼斯时，皇帝付不出借款和船钱，被威尼斯商人扣在了城里。威尼斯人说：把特内多斯岛给我们，债就一笔勾销。[GetCountry('BYZ').Custom('OeBrJewels')]"
 oe_br.10.a: "以特内多斯岛抵债"
 oe_br.10.a.tt: "获得“特内多斯的代价”20年（威尼斯享有关税特权，税收效率 −5%；EU5地图上没有特内多斯岛，以此代替割地）"
 oe_br.10.b: "筹钱赎人"
 oe_br.10.c: "等儿子来救"
 oe_br_denied_title: "否认了我们的皇帝称号"
 oe_br_recognised_title: "默认了我们的皇帝称号"
 oe_br_anathema: "绝罚了我们的君主和牧首"
 oe_br_claimed_lands: "宣称我们的土地"
 oe_br_new_friendship: "与新君修好"
 oe_br_expelled: "驱逐了我们的援军"
 oe_br_halil_ransomed: "赎回了哈利勒"
 oe_br_halil_held: "扣押了哈利勒"
