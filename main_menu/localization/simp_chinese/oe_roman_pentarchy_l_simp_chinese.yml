l_simp_chinese:
 OE_RW_ASSIM_PENTARCHY_TITLE: "开启东西教会合一"
 OE_RW_ASSIM_PENTARCHY_ROW: "五大牧首区归一"
 OE_RW_ASSIM_PENTARCHY_FLAVOR: "罗马、君士坦丁堡、亚历山大、安条克与耶路撒冷的五大圣座，终于同处帝国的庇护之下。东西教会的使者再次共聚一堂，商议弥合延续数百年的裂痕，让分立的祭坛重新见证共同的信仰。"
 OE_RW_ASSIM_PENTARCHY_CONDITION: "东罗马及其各级附庸同时拥有罗马、亚历山大、安条克、耶路撒冷与君士坦丁堡。军事占领不计入。"
 OE_RW_ASSIM_PENTARCHY_NOT_STARTED: "尚未开启东西教会合一认同运动"
 OE_RW_ASSIM_PENTARCHY_PROGRESS: "当前拥有圣座：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_pentarchy_cities_owned_count')|0]／5。"
 OE_RW_ASSIM_PENTARCHY_TARGET: "开启“东西教会合一”认同运动，促使基督徒逐步归于东正教。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_PENTARCHY_RULES: "只能开启一次。运动强烈优先从罗马发源，沿用既有的基督教人口传播规则与速度。"
 OE_RW_ASSIM_PENTARCHY_WAITING: "尚未开启"
 OE_RW_ASSIM_PENTARCHY_STARTED: "已开启：东西教会合一"
