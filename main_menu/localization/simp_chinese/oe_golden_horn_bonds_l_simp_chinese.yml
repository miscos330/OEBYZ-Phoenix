l_simp_chinese:
 oe_giustinia_dynasty: "朱斯蒂尼亚"
 oe_golden_horn_bank.1.t: "金角湾银行的提议"
 oe_golden_horn_bank.1.d: "朱斯蒂尼亚初来君士坦丁堡时，不过是一个来自热那亚、凭账簿与信用谋生的商人。安德洛尼卡二世在位期间，他从小额汇兑与借贷做起，将生意伸入宫廷、商馆与港口。待到皇帝不得不依赖他的筹款与周转时，这位白手起家的银行家终于迫使皇帝让步，取得特许状，创办了拥有官方背景的金角湾银行。此后，他皈依东正教，融入帝国官员的社会；朱斯蒂尼亚家族与巴列奥略皇室的良好往来，也使这家银行的信用延续至今。\n\n如今，帝国国库再度吃紧。银行送来一项筹资计划：由政府与特许银行共同以信誉担保，发行能够交易的债券，向愿意出资的商人和财主筹集国库所需的钱款。今日以信誉取得的资金，终究要由往后的收入偿付——但至少眼下，军饷与账单不必再等待。"
 oe_golden_horn_bank.1.a: "批准这个计划。"
 oe_golden_horn_bank.1.b: "奇技淫巧罢了。"
 STATIC_MODIFIER_NAME_oe_golden_horn_bond_charter: "金角湾债券特许状"
 STATIC_MODIFIER_DESC_oe_golden_horn_bond_charter: "政府与金角湾银行共同为帝国信用背书，允许国库通过发行债券融资，并使债券上限#G +1#!。"
 oe_golden_horn_bond_decision: "已裁定金角湾银行的债券提议"
