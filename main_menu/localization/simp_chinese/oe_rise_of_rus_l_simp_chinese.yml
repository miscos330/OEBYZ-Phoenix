 oe_rus_unify_russia: "统一俄罗斯"
 oe_rus_unify_russia_desc: "计分第一的罗斯公国可执行。俄罗斯地区内，不得存在首都位于该地区、且既非本国也非本国各级附属国的东斯拉夫文化组国家。执行后吞并所有首都位于俄罗斯地区的本国各级附属国，并立即获得该地区全部可征服地点的核心。本行动在整场局势中只能执行一次，无额外花费。"
 oe_rus_first_power: "计分第一的罗斯公国"
