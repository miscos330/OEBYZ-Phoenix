l_simp_chinese:
 oe_rise_of_rus: "罗斯人的崛起"
 oe_rise_of_rus_desc: "金帐汗国衰落，鞑靼的贡赋与敕令不再能够约束罗斯诸邦。在森林、河流与草原之间，各公国正争夺重建罗斯秩序的权柄。局势每月更新实力排名；俄罗斯成立或进入专制主义时代时结束。"
 oe_rus_outcome_russia: "罗斯归于一统"
 oe_rus_outcome_russia_desc: "俄罗斯已经成立，公国间争夺罗斯领导权的时代宣告结束。"
 oe_rus_outcome_age: "公国时代的落幕"
 oe_rus_outcome_age_desc: "专制主义时代已经到来，罗斯诸邦的竞争转入新的篇章。"
 oe_rus_ambition: "罗斯人的雄心"
 oe_rus_ambition_desc: "从鞑靼枷锁下崛起的罗斯强国，正以兵戈与盟约谋求统一。仅计分前三的国家保有此修正。"
 oe_rus_orthodox_resurgence: "正教诸邦的复兴"
 oe_rus_generous_gifts: "丰厚的帝国回礼"
 oe_rus_courteous_gifts: "体面的帝国回礼"
 oe_rus_refused_gifts: "拒绝回礼"
 oe_rus_rivalry: "罗斯霸权之争"
 oe_rus_generous_return: "丰厚的回礼"
 oe_rus_courteous_return: "体面的回礼"
 oe_rus_spurned_tribute: "朝贡遭到冷遇"
 oe_rus_yoke_dissolved: "金帐汗国统治的崩溃"
 oe_rus_yoke_rewards_tt: "鞑靼枷锁已解除。除金帐汗国外，所有原成员已获得20稳定度与相当于本国一年收入的金币。"
 oe_rus_map_top_tt: "罗斯三强之一；每月按综合实力重新排名。"
 oe_rus_scoring_explanation: "每月计分：税基每点1分；每千可用陆军征召兵1分；每千正规兵编制10分；每千储备人力0.5分；每万人口1分；每座城市或大都市10分。附属国与共主联邦成员的分数归入最终宗主国或联邦主导国，且每国只计算一次。"
 oe_rus_rank_first: "第一强国 · [Country.GetName]"
 oe_rus_rank_second: "第二强国 · [Country.GetName]"
 oe_rus_rank_third: "第三强国 · [Country.GetName]"
 oe_rus_score_card: "综合得分：[Country.MakeScope.GetVariable('oe_rus_score').GetValue|2]\n本国得分：[Country.MakeScope.GetVariable('oe_rus_personal_score').GetValue|2]\n拥有“罗斯人的雄心”，并与另两强互有固定−200关系修正。"
 oe_rus_tribute: "向罗马帝国朝贡"
 oe_rus_tribute_desc: "花费本国六个月收入，献上数量各等于本国税基的毛皮、牲畜与啤酒。三档回礼金币为送礼国税基的5倍、3倍、1倍；四种答复共用一个可累计的好感修正，分别变化+50、+10、−50、−100；累计上限+50、下限−100，每年向零衰减10点。丰厚回礼令罗马帝国获得+0.5外交声誉，持续五年；拒绝回礼仍使帝国外交声誉−0.5，持续一年。冷却五年。"
 oe_rus_purchase: "收购罗斯公国"
 oe_rus_purchase_desc: "支付目标国三年收入与25政治影响力，将税基较低、对我们关系高于50且与本国势力接壤的独立罗斯公国收为附庸。目标不能属于前三强或任何共主联邦。冷却一年。"
 oe_rus_contest: "罗斯争霸"
 oe_rus_contest_desc: "花费10政治影响力，取得对目标罗斯国家一个与本国接壤省份的征服宣战理由。不能针对本国附属、宗主、联邦伙伴、盟友、与本国处于停战期或本国已有宣战借口的国家。冷却两年。"
 oe_rus_integrate_union: "整合共主联邦"
 oe_rus_integrate_union_desc: "联邦主导国花费50政治影响力，并向入盟超过25年的非主导成员支付其一年收入，将其转为采邑。冷却五年。"
 oe_rus_build_kremlin: "营建克里姆林宫"
 oe_rus_build_kremlin_desc: "花费本国三个月收入与25政治影响力，在罗斯地区的一座非首都城市或大都市解锁并修建克里姆林宫。每国最多五座，超过上限时保留最早建成的五座。位于国家首都，或由非东斯拉夫国家拥有的克里姆林宫会移除。冷却五年。"
 oe_rus_kremlin: "克里姆林宫"
 oe_rus_kremlin_desc: "木墙、门楼与驻军围成的城中堡垒，将地方权柄与防御汇于一处。每国至多五座，仅东斯拉夫国家能够维持；不能建于国家首都，所在地成为首都后会自动移除。"
 oe_rus_kremlin_maintenance: "克里姆林宫驻防维护"
 oe_rise_of_rus.1.t: "罗斯人的崛起"
 oe_rise_of_rus.1.d: "曾令东欧诸公俯首的金帐汗国，已无力维持昔日的威势。征贡的使者不再随处受人敬畏，远方汗廷颁下的敕令也逐渐失去了分量。\n\n森林与河流之间，罗斯人的城镇重新筑起木墙，王公们召集军队、缔结婚盟，争相收拢分裂已久的土地。摆脱鞑靼枷锁只是开端；在漫长的东欧平原上，一个新的强权正缓缓成形。"
 oe_rise_of_rus.1.a: "留意北方的消息。"
 oe_rise_of_rus.1.b: "正教政权又一次推翻了野蛮人的统治。"
 oe_rise_of_rus.2.t: "金帐汗国统治的崩溃"
 oe_rise_of_rus.2.d: "弗拉基米尔大公曾奉汗廷之命，向罗斯诸邦征收贡赋。如今，汗国的武力已不足以支撑这项权柄，旧有的征贡秩序随之瓦解。\n\n诸城的钟声宣告枷锁落地。原本流向草原的财赋将留在本国，恢复农庄、市场与城防。自由带来了安宁，也让各位王公看见了争夺罗斯领导权的机会。"
 oe_rise_of_rus.2.a: "罗斯不再向汗廷低头。"
 oe_rise_of_rus.3.t: "来自罗斯的贡品"
 oe_rise_of_rus.3.d: "[SCOPE.sCountry('oe_rus_sender').GetName]的使者抵达君士坦丁波利斯，带来了北方的毛皮、成群牲畜与装满啤酒的木桶。这些货物已在首都售出。\n\n使者向皇帝致意，也在等待帝国的答复。一份回礼，既是两国情谊的凭证，也是罗马在正教世界中声望的尺度。"
 oe_rise_of_rus.3.a: "丰厚的回礼。"
 oe_rise_of_rus.3.b: "体面的回礼。"
 oe_rise_of_rus.3.c: "微薄的回礼。"
 oe_rise_of_rus.3.d_option: "不进行回礼。"
