 oe_rus_purchase_cooldown: "收购罗斯公国"
 oe_rus_contest_cooldown: "罗斯争霸"
 oe_rus_integrate_union_cooldown: "整合共主联邦"
 oe_rus_build_kremlin_cooldown: "营建克里姆林宫"

 oe_rus_integrate_kyiv: "整合基辅"
 oe_rus_integrate_kyiv_desc: "立陶宛作为联邦主导国，与基辅在同一共主联邦中各自满50年后，可花费50政治影响力直接吞并基辅。"
 oe_rus_grant_metropolitan: "授权罗斯自主都主教区"
 oe_rus_grant_metropolitan_desc: "花费50宗教影响力，授予属于东罗马领导的普世牧首区的独立罗斯国家自主都主教区。目标须以东斯拉夫文化为主流文化，首都位于俄罗斯、鲁塞尼亚或大草原，且不能是共主联邦的非主导国。该国对东罗马好感度+50，永久获得教士征税上限+25%、每月宗教影响力+0.1、文化影响力+10%。每国只能获授一次，行动冷却一年。"
 oe_rus_support_through_church: "通过教会支持罗斯国家"
 oe_rus_support_through_church_desc: "花费50宗教影响力，为属于东罗马领导的普世牧首区、首都位于俄罗斯、鲁塞尼亚或大草原的东斯拉夫文化国家提供三年的教会支持：征召兵规模+10%、正统信仰+1、教士阶层满意度+5%。已有该修正的国家不能重复选择。冷却三个月。"
 oe_rus_provide_mercenaries: "为罗斯国家提供雇佣兵"
 oe_rus_provide_mercenaries_desc: "花费1600人力与本国三个月收入，在首都位于俄罗斯、鲁塞尼亚或大草原的东斯拉夫文化国家首都，组建两队当前可用轻步兵与三队轻骑兵，并交由目标国雇用。雇佣兵费用倍率为正常的10%；若交付失败，将返还人力及实际支付的金币，并取消冷却。冷却三年。"
 oe_rus_autonomous_metropolitan: "罗斯自主都主教区"
 oe_rus_autonomous_metropolitan_desc: "帝国与普世牧首认可了本国教会的自主权，地方都主教得以整顿教产、培育学识，并在罗斯诸邦间巩固自身的声望。"
 oe_rus_catholic_orthodox_support: "正统大公教会的支持"
 oe_rus_catholic_orthodox_support_desc: "来自君士坦丁波利斯的支持使主教与地方教士团结于王公麾下，以教会的声望鼓舞军民。"
 oe_rus_metropolitan_recognition: "自主都主教区获帝国承认"
 oe_rus_roman_mercenary_company: "帝国援罗斯雇佣军"
 oe_rus_grant_metropolitan_cooldown: "授权罗斯自主都主教区"
 oe_rus_support_through_church_cooldown: "通过教会支持罗斯国家"
 oe_rus_provide_mercenaries_cooldown: "为罗斯国家提供雇佣兵"

