l_simp_chinese:
 oe_byd_blockade: "京城封锁"
 oe_byd_blockade_desc: "苏丹的大军围住了京城。城墙挡得住强攻，挡不住饥饿和绝望。\n\n已围#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月　粮储#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#! / 100（每月#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_food_delta')|1]#!）　城心#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#! / 100（每月#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_morale_delta')|1]#!）　城防#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_defense')|0]#!\n[GetCountry('BYZ').Custom('OeBydWest')]\n[GetCountry('BYZ').Custom('OeBydCrusade')]\n[GetCountry('BYZ').Custom('OeBydAssault')]\n\n粮储每月：基数#R −3#!，海上偷运#G +1#!；普罗潘提斯港口#Y 3#!级以上#G +0.5#!；粮仓每级#G +0.5#!；威尼斯或热那亚对帝国不怀敌意#G +1#!；奥斯曼舰队超过帝国两倍#R −1#!；苏丹迁怒#R −1#!；突厥街区#G +1#!；帖木儿与奥斯曼交战#G +2#!；京城真被围攻#R −3#!。粮储低于#Y 25#!时京城闹饥荒，降到#Y 0#!时断粮。\n城心每月：随粮储#G +0.5#!到#R −3#!；蓄水池、水宫、水道桥合计#Y 3#!级以上或有医院#G +0.5#!；法军守城#G +0.5#!；皇帝离京#R −0.5#!（有西方的援兵时不扣）；帖木儿与奥斯曼交战#G +1#!；京城真被围攻#R −1#!。城心低于#Y 25#!时人心绝望，达到#Y 75#!时众志成城；城心为#Y 0#!满#Y 3#!个月，苏丹会开出议和条件。\n城防＝狄奥多西城墙等级×#Y 2#!＋海墙等级×#Y 2#!＋军械库等级，法军守城再加#Y 2#!，城心高低再加减。修粮仓、蓄水池、医院和城墙，京城就能撑得更久。"
 OE_BYD_WEST_AWAY: "皇帝在西方求援，已离京#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_west_m').GetValue|0]#!个月；[GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName]留守京城。"
 OE_BYD_WEST_ENVOY: "帝国的使节正在西方各国的宫廷求援。"
 OE_BYD_WEST_BACK: "皇帝已从西方归来。"
 OE_BYD_WEST_LOST: "西行的皇帝没能回来。"
 OE_BYD_WEST_HOME: "皇帝在京城。"
 OE_BYD_CR_WON: "十字军在尼科波利斯获胜。"
 OE_BYD_CR_WRATH: "十字军在尼科波利斯惨败；苏丹迁怒帝国，粮储每月#R −1#!。"
 OE_BYD_CR_LOST: "十字军在尼科波利斯惨败。"
 OE_BYD_CR_GOING: "十字军正在多瑙河畔集结。"
 OE_BYD_CR_NONE: "西方还没有派来十字军。"
 OE_BYD_AS_HELD: "上一次强攻被打退了。"
 OE_BYD_AS_LOST: "上一次强攻中，外垒失守。"
 OE_BYD_AS_NONE: "苏丹还没有强攻过陆墙。"
 OE_BYD_SETTLE_HIGH: "京城挺了过来，人心振奋：[oe_tu_authority|e]#G +5#!，民意#G +5#!。"
 OE_BYD_SETTLE_MID: "京城挺了过来：[oe_tu_authority|e]#G +2#!。"
 OE_BYD_SETTLE_LOW: "京城虽然保住了，人心已经涣散：[oe_tu_authority|e]#R −3#!，民意#R −5#!。"
 STATIC_MODIFIER_NAME_oe_byd_blockade_loc: "围城下的京城"
 STATIC_MODIFIER_NAME_oe_byd_blockade: "京城被封锁"
 STATIC_MODIFIER_NAME_oe_byd_famine: "城中饥荒"
 STATIC_MODIFIER_NAME_oe_byd_starving: "城中断粮"
 STATIC_MODIFIER_NAME_oe_byd_despair: "京城人心绝望"
 STATIC_MODIFIER_NAME_oe_byd_despair_loc: "守军丧气"
 STATIC_MODIFIER_NAME_oe_byd_resolve: "众志成城"
 STATIC_MODIFIER_NAME_oe_byd_french_garrison: "法兰西守军"
 STATIC_MODIFIER_NAME_oe_byd_watch: "加固的城墙"
 STATIC_MODIFIER_NAME_oe_byd_emperor_abroad: "皇帝西行"
 STATIC_MODIFIER_NAME_oe_byd_west_aid: "西方的援兵"
 STATIC_MODIFIER_NAME_oe_byd_grain_privilege: "粮船商约"
 STATIC_MODIFIER_NAME_oe_byd_exodus: "出城的人"
 STATIC_MODIFIER_NAME_oe_byd_rebuild: "重建城郊"
 STATIC_MODIFIER_NAME_oe_byd_nicopolis_tur: "尼科波利斯之败"
 oe_byd_host_king: "在京城款待了我们落难的君主"
 oe_byd_shut_out: "对落难的十字军闭门不纳"
 oe_byd_quarter_op: "在君士坦丁堡让出了突厥街区"
 oe_byd_french_thanks: "厚礼送回了法兰西援军"
 oe_byd_west_court: "曾来我们的宫廷求援"
 oe_byd_grain_buyer: "高价买下了我们的粮食"
 oe_byd.1.t: "塞雷的召见"
 oe_byd.1.desc_tribute: "#F 1393—1394年之交，巴耶济德把巴尔干的基督徒附庸召到塞雷，一度打算全部处死，最后关头才作罢。曼努埃尔二世脱身回京，此后再不应召。1394年，苏丹在博斯普鲁斯东岸修起堡垒，开始封锁君士坦丁堡。#!\n\n如今，苏丹[GetCountry('TUR').GetGovernment.GetRuler.GetName]又派人来召皇帝觐见。去了，未必回得来；不去，大军就会围住京城。帝国年年纳贡，苏丹要的已经不只是钱。"
 oe_byd.1.desc_plain: "#F 1393—1394年之交，巴耶济德把巴尔干的基督徒附庸召到塞雷，一度打算全部处死，最后关头才作罢。曼努埃尔二世脱身回京，此后再不应召。1394年，苏丹在博斯普鲁斯东岸修起堡垒，开始封锁君士坦丁堡。#!\n\n如今，苏丹[GetCountry('TUR').GetGovernment.GetRuler.GetName]又派人来召皇帝觐见。去了，未必回得来；不去，大军就会围住京城。"
 oe_byd.1.a: "不再应召"
 oe_byd.1.a.tt: "局势#bold #color_yellow 京城封锁#!#!开始：粮储起点#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_food_start')|0]#!（#Y 60#!，粮仓每级再加#Y 8#!），城心起点#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_morale_start')|0]#!（随民意）\n对奥斯曼的岁币协议（如有）作废，不算背约\n[oe_tu_authority|e]#G +3#!"
 oe_byd.1.b: "赴召，加纳贡金"
 oe_byd.1.b.tt: "与奥斯曼签订#Y 5#!年的岁币协议：现在先付一年（#Y 3#!个月的总收入），威望#R −15#!，[oe_tu_authority|e]#R −5#!\n若此前已赴召过（已#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_rd_defers')|0]#!次）：另有[oe_tu_authority|e]#R −5#!，民意#R −5#!\n苏丹#Y 3#!年内不再召见"
 oe_byd.1.c: "赴召，加纳贡金"
 oe_byd.1.c.tt: "一次付给苏丹#R 6#!个月的贸易与税收收入，岁币协议续#Y 5#!年\n若此前已赴召过（已#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_rd_defers')|0]#!次）：另有[oe_tu_authority|e]#R −5#!，民意#R −5#!\n苏丹#Y 3#!年内不再召见"
 oe_byd.1.d: "遣使拖延"
 oe_byd.1.d.tt: "花费#R 1#!个月的贸易与税收收入\n#G 50%#!的可能苏丹作罢，#Y 12#!个月后再召\n#R 50%#!的可能苏丹视为羞辱：局势照样开始，城心起点#R −10#!"
 oe_byd.2.t: "十字军之邀"
 oe_byd.2.desc: "#F 1395年起，匈牙利国王西吉斯蒙德向西方各国求援：勃艮第公爵出钱，讷韦尔伯爵约翰挂帅，各地骑士纷纷东来。1396年，威尼斯船队载着医院骑士驶入马尔马拉海，帝国也派出十艘船。#!\n\n如今，匈牙利的[GetCountry('HUN').GetGovernment.GetRuler.GetName]派来使者：一支十字军正在多瑙河畔集结，要把突厥人赶出欧洲，请帝国出船出钱。\n胜算：基础#Y 15%#!，十字军声势每级再加#Y 10%#!，匈牙利已在与奥斯曼交战时再加#Y 10%#!，教皇的十字军正以奥斯曼为目标时再加#Y 5%#!，瓦拉几亚在罗维纳守住、又没有臣属苏丹时再加#Y 5%#!，最多#Y 50%#!。"
 oe_byd.2.a: "出船出钱"
 oe_byd.2.a.tt: "花费#R 3#!个月的贸易与税收收入\n十字军声势#Y 2#!（最高）：胜算更大；若败了，苏丹的怒火也更大\n约#Y 5#!个月后传来战报"
 oe_byd.2.b: "只出钱"
 oe_byd.2.b.tt: "花费#R 1#!个月的贸易与税收收入\n十字军声势#Y 1#!\n约#Y 5#!个月后传来战报"
 oe_byd.2.c: "置身事外"
 oe_byd.2.c.tt: "城心#R −5#!\n即使十字军败了，苏丹也不会迁怒帝国\n约#Y 5#!个月后传来战报"
 oe_byd.3.t: "尼科波利斯"
 oe_byd.3.desc_won: "#F 1396年9月25日，十字军在尼科波利斯城下惨败，讷韦尔伯爵等许多贵族被俘，次年以二十万弗罗林赎回。西吉斯蒙德乘船逃入黑海，经君士坦丁堡从海路回国。#!\n\n如今，捷报传来：十字军在多瑙河畔击败了苏丹的大军！苏丹军心动摇，城外的营寨也松动了。\n城心#G +15#!，粮储#G +10#!；奥斯曼获得[ShowModifier('oe_byd_nicopolis_tur')]，持续#Y 5#!年。"
 oe_byd.3.desc_lost2: "#F 1396年9月25日，十字军在尼科波利斯城下惨败，讷韦尔伯爵等许多贵族被俘，次年以二十万弗罗林赎回。西吉斯蒙德乘船逃入黑海，经君士坦丁堡从海路回国。#!\n\n如今，战报传来：十字军在多瑙河畔大败。[GetCountry('HUN').GetGovernment.GetRuler.GetName]的船停在金角湾外，请求入城。苏丹的大军又回到了城下。\n城心#R −10#!；帝国出船出钱最多，苏丹迁怒帝国：#Y 18#!个月内粮储每月#R −1#!。"
 oe_byd.3.desc_lost1: "#F 1396年9月25日，十字军在尼科波利斯城下惨败，讷韦尔伯爵等许多贵族被俘，次年以二十万弗罗林赎回。西吉斯蒙德乘船逃入黑海，经君士坦丁堡从海路回国。#!\n\n如今，战报传来：十字军在多瑙河畔大败。[GetCountry('HUN').GetGovernment.GetRuler.GetName]的船停在金角湾外，请求入城。苏丹的大军又回到了城下。\n城心#R −10#!；帝国出过钱，苏丹迁怒帝国：#Y 9#!个月内粮储每月#R −1#!。"
 oe_byd.3.desc_lost0: "#F 1396年9月25日，十字军在尼科波利斯城下惨败，讷韦尔伯爵等许多贵族被俘，次年以二十万弗罗林赎回。西吉斯蒙德乘船逃入黑海，经君士坦丁堡从海路回国。#!\n\n如今，战报传来：十字军在多瑙河畔大败。[GetCountry('HUN').GetGovernment.GetRuler.GetName]的船停在金角湾外，请求入城。苏丹的大军又回到了城下。\n城心#R −10#!；帝国置身事外，苏丹没有迁怒帝国。"
 oe_byd.3.a: "款待落难的国王"
 oe_byd.3.a.tt: "花费#R 1#!个月的贸易与税收收入\n匈牙利对帝国好感#G +20#!，持续#Y 10#!年\n约#Y 2#!个月后，苏丹会派来使者"
 oe_byd.3.b: "闭门谢客"
 oe_byd.3.b.tt: "匈牙利对帝国好感#R −10#!，持续#Y 5#!年\n苏丹迁怒的期限减半\n约#Y 2#!个月后，苏丹会派来使者"
 oe_byd.3.c: "鸣钟谢恩"
 oe_byd.3.c.tt: "[oe_tu_authority|e]#G +3#!"
 oe_byd.4.t: "苏丹的最后通牒"
 oe_byd.4.desc: "#F 尼科波利斯之后，巴耶济德回到城下，要求开城投降；此前此后，突厥人几次猛攻陆墙。据记载，城中还划出一片街区给突厥人居住，设了法官和清真寺。#!\n\n如今，苏丹的使者站在城门前：交出京城，皇帝可以保全性命；否则，大军攻城。城防现为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_defense')|0]#!。"
 oe_byd.4.a: "誓死守城"
 oe_byd.4.a.tt: "城心#G +10#!（城防不低于#Y 7#!时），否则#G +5#!\n苏丹随时可能强攻陆墙"
 oe_byd.4.b: "让出一块街区"
 oe_byd.4.b.tt: "城心#R −10#!\n[oe_tu_authority|e]#R −5#!\n城中设立突厥街区，奥斯曼对帝国好感#G +25#!，持续#Y 10#!年\n#Y 24#!个月里粮储每月#G +1#!"
 oe_byd.4.c: "献金缓攻"
 oe_byd.4.c.tt: "花费#R 4#!个月的贸易与税收收入\n#Y 24#!个月内苏丹不会强攻"
 oe_byd.5.t: "元帅的船队"
 oe_byd.5.desc: "#F 1397年起，皇帝一再遣使去法兰西和英格兰。1399年，法王查理六世派元帅布锡考特率六艘船、一千二百人来援——此人三年前在尼科波利斯被俘，赎身归国。法军与守军一同出城，扫荡沿岸的突厥据点。#!\n\n如今，一支法兰西船队冲过海峡，驶进了金角湾。"
 oe_byd.5.a: "联兵出城"
 oe_byd.5.a.tt: "花费#R 1#!个月的贸易与税收收入\n粮储#G +15#!\n城心#G +10#!\n#R 25%#!的可能出城失利：城心改为#R −5#!\n约#Y 3#!个月后，宫中会商议皇帝是否亲赴西方"
 oe_byd.5.b: "请法军留下守城"
 oe_byd.5.b.tt: "花费#R 2#!个月的贸易与税收收入\n京城获得[ShowModifier('oe_byd_french_garrison')]，持续#Y 36#!个月\n城心#G +5#!\n约#Y 3#!个月后，宫中会商议皇帝是否亲赴西方"
 oe_byd.5.c: "厚礼送回"
 oe_byd.5.c.tt: "法兰西对帝国好感#G +10#!，持续#Y 10#!年\n约#Y 3#!个月后，宫中会商议皇帝是否亲赴西方"
 oe_byd.6.t: "皇帝西行"
 oe_byd.6.desc_rg: "#F 1399年12月10日，曼努埃尔二世随布锡考特乘船西行，把妻儿安置在摩里亚，京城交给侄子约翰七世。此后三年半，皇帝走过威尼斯、帕多瓦、米兰、巴黎和伦敦。#!\n\n如今，外援一次比一次少。有人提议由皇帝亲自去西方各国的宫廷求援，京城交给[SCOPE.sCharacter('oe_byd_rg').GetName]。"
 oe_byd.6.desc_norg: "#F 1399年12月10日，曼努埃尔二世随布锡考特乘船西行，把妻儿安置在摩里亚，京城交给侄子约翰七世。此后三年半，皇帝走过威尼斯、帕多瓦、米兰、巴黎和伦敦。#!\n\n如今，外援一次比一次少。有人提议由皇帝亲自去西方各国的宫廷求援，可宫中找不到能托付京城的人。"
 oe_byd.6.a: "亲赴西方"
 oe_byd.6.a.tt: "[SCOPE.sCharacter('oe_byd_rg').GetName]留守京城\n帝国获得[ShowModifier('oe_byd_emperor_abroad')]，直到皇帝回京\n城心#G +5#!\n约#Y 6#!个月后皇帝到达意大利和巴黎；封锁结束#Y 8#!个月后，或离京满#Y 42#!个月时，皇帝回京"
 oe_byd.6.b: "派使节代行"
 oe_byd.6.b.tt: "花费#R 1#!个月的贸易与税收收入\n约#Y 6#!个月后使节到达巴黎，收获比皇帝亲往少"
 oe_byd.6.c: "皇帝留在京城"
 oe_byd.6.c.tt: "城心#G +5#!\n不向西方求援"
 oe_byd.7.t: "从威尼斯到巴黎"
 oe_byd.7.desc_emp: "#F 1400年4月，皇帝在威尼斯登岸，经帕多瓦、维琴察、帕维亚到米兰；6月3日，法王查理六世在沙朗通迎接，在巴黎以盛大的仪式款待。皇帝在巴黎住了很久，一直在等西方的援兵。#!\n\n如今，皇帝到了巴黎。西方的君主们以礼相待，许下许多诺言，可兵马迟迟不见。"
 oe_byd.7.desc_env: "#F 1400年4月，皇帝在威尼斯登岸，经帕多瓦、维琴察、帕维亚到米兰；6月3日，法王查理六世在沙朗通迎接，在巴黎以盛大的仪式款待。皇帝在巴黎住了很久，一直在等西方的援兵。#!\n\n如今，帝国的使节到了巴黎。西方的君主们以礼相待，许下许多诺言，可兵马迟迟不见。"
 oe_byd.7.a: "收下年金与许诺"
 oe_byd.7.a.tt: "获得#G 3#!个月的贸易与税收收入（使节代行时#G 2#!个月）\n法兰西对帝国好感#G +10#!，持续#Y 10#!年\n城心#G +5#!（封锁仍在时）"
 oe_byd.7.b: "在巴黎论道"
 oe_byd.7.b.tt: "[oe_tu_authority|e]#G +2#!"
 oe_byd.7.c: "催各国即刻出兵"
 oe_byd.7.c.tt: "帝国获得[ShowModifier('oe_byd_west_aid')]，持续#Y 10#!年（已有[ShowModifier('oe_br_western_aid')]时改为威望小增）\n以上只有#G 30%#!的可能；#R 70%#!的可能只得到空头许诺，威望小减"
 oe_byd.8.t: "伦敦的冬天"
 oe_byd.8.desc_paid: "#F 1400年12月，英王亨利四世在布莱克希思迎接皇帝，留皇帝在埃尔特姆宫过了圣诞节，又为帝国筹款。1401年2月，皇帝回到巴黎。#!\n\n如今，皇帝渡海到了英格兰。英格兰的宫廷设宴款待，答应为帝国筹款。英格兰早已为帝国解囊一次，这回给得少些。"
 oe_byd.8.desc_plain: "#F 1400年12月，英王亨利四世在布莱克希思迎接皇帝，留皇帝在埃尔特姆宫过了圣诞节，又为帝国筹款。1401年2月，皇帝回到巴黎。#!\n\n如今，皇帝渡海到了英格兰。英格兰的宫廷设宴款待，答应为帝国筹款。"
 oe_byd.8.a: "收下英格兰的捐款"
 oe_byd.8.a.tt: "获得#G 4#!个月的贸易与税收收入（英格兰早已为帝国西行出过钱时#G 2#!个月）\n英格兰对帝国好感#G +10#!，持续#Y 10#!年"
 oe_byd.8.b: "请英王派兵"
 oe_byd.8.b.tt: "帝国获得[ShowModifier('oe_byd_west_aid')]，持续#Y 10#!年（已有[ShowModifier('oe_br_western_aid')]时改为威望小增）\n以上只有#G 25%#!的可能；否则只得到些许威望"
 oe_byd.10.t: "摄政的密约"
 oe_byd.10.desc: "#F 皇帝在外期间，京城里一再有人出城与巴耶济德议和，牧首马太一世为此发通谕，威胁绝罚。有记载说约翰七世答应苏丹：若苏丹战胜帖木儿就交出京城。这一说法至今有争议。#!\n\n如今，城中缺粮，人心浮动。有人私下与苏丹的营寨往来议和，传言留守京城的[GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName]也知情。"
 oe_byd.10.a: "默许谈判"
 oe_byd.10.a.tt: "粮储#G +10#!\n城心#G +5#!\n#Y 12#!个月内苏丹不会强攻\n此事会被记下"
 oe_byd.10.b: "请牧首发通谕"
 oe_byd.10.b.tt: "城心#G +10#!\n[oe_tu_authority|e]#G +3#!\n粮储#R −5#!"
 oe_byd.10.c: "暗中监视"
 oe_byd.10.c.tt: "花费#R 1#!个月的贸易与税收收入\n此事会被记下"
 oe_byd.9.t: "皇帝归来"
 oe_byd.9.desc_pact: "#F 1402年11月，皇帝离开法兰西，次年6月回到京城，收回了约翰七世的权力，推翻其与突厥人订下的部分条款，把约翰七世打发到利姆诺斯。#!\n\n如今，皇帝离京#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_west_m').GetValue|0]#!个月后回到了京城，[GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName]交还了大权。[ShowModifier('oe_byd_emperor_abroad')]随之移除。城里人都知道，皇帝不在时，有人与苏丹私下往来。"
 oe_byd.9.desc_plain: "#F 1402年11月，皇帝离开法兰西，次年6月回到京城，收回了约翰七世的权力，推翻其与突厥人订下的部分条款，把约翰七世打发到利姆诺斯。#!\n\n如今，皇帝离京#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_west_m').GetValue|0]#!个月后回到了京城，[GetCountry('BYZ').MakeScope.GetVariable('oe_byd_regent').GetCharacter.GetName]交还了大权。[ShowModifier('oe_byd_emperor_abroad')]随之移除。"
 oe_byd.9.a: "褒奖留守的人"
 oe_byd.9.a.tt: "此事会被记下"
 oe_byd.9.b: "追究密约"
 oe_byd.9.b.tt: "[oe_tu_authority|e]#G +3#!\n此事会被记下"
 oe_byd.9.c: "既往不咎"
 oe_byd.9.c.tt: "此事不再提起"
 oe_byd.11.t: "东方的风暴"
 oe_byd.11.desc: "#F 1400年起，帖木儿与巴耶济德互致辱骂的书信，又联络被奥斯曼吞并的突厥诸侯。1402年7月，两军在安卡拉决战。#!\n\n如今，帖木儿的大军压向奥斯曼的东境，苏丹不得不把围城的兵马调往亚洲。\n城心#G +10#!；两国交战期间，粮储每月#G +2#!，城心每月#G +1#!。"
 oe_byd.11.a: "趁机出城收粮"
 oe_byd.11.a.tt: "粮储#G +15#!\n城心#G +5#!"
 oe_byd.11.b: "加固城墙，静观其变"
 oe_byd.11.b.tt: "京城获得[ShowModifier('oe_byd_watch')]，持续#Y 24#!个月"
 oe_byd.13.t: "苏丹的条件"
 oe_byd.13.desc_w3: "#F 围城的几年里，京城里一再有人主张与苏丹议和。1401年，约翰七世出城与巴耶济德谈判，围城一度解除。#!\n\n如今，城中人心已散，城心跌到#Y 0#!已经#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_zero_m').GetValue|0]#!个月。主和的人公开说，再不议和，城门就要从里面打开了。苏丹的使者开出条件：年年纳贡，再让出一块街区。"
 oe_byd.13.desc_w1: "#F 围城的几年里，京城里一再有人主张与苏丹议和。1401年，约翰七世出城与巴耶济德谈判，围城一度解除。#!\n\n如今，奥斯曼换了苏丹，[GetCountry('TUR').GetGovernment.GetRuler.GetName]派来使者：只要帝国年年纳贡，城外的营寨可以撤走。"
 oe_byd.13.desc_w2: "#F 围城的几年里，京城里一再有人主张与苏丹议和。1401年，约翰七世出城与巴耶济德谈判，围城一度解除。#!\n\n如今，京城已被围#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。苏丹也厌倦了旷日持久的围城，派来使者：只要帝国年年纳贡，城外的营寨可以撤走。"
 oe_byd.13.a: "接受条件"
 oe_byd.13.a.tt: "若与奥斯曼还没有岁币协议：签订#Y 5#!年的协议，现在先付一年（#Y 3#!个月的总收入），威望#R −15#!，[oe_tu_authority|e]#R −5#!\n若已有协议：一次付给苏丹#R 6#!个月的贸易与税收收入，协议续#Y 5#!年\n局势#bold #color_yellow 京城封锁#!#!结束：议和纳贡"
 oe_byd.13.b: "接受条件"
 oe_byd.13.b.tt: "若与奥斯曼还没有岁币协议：签订#Y 5#!年的协议，现在先付一年（#Y 3#!个月的总收入），威望#R −15#!，[oe_tu_authority|e]#R −5#!\n若已有协议：一次付给苏丹#R 6#!个月的贸易与税收收入，协议续#Y 5#!年\n城中设立突厥街区，奥斯曼对帝国好感#G +25#!，持续#Y 10#!年\n局势#bold #color_yellow 京城封锁#!#!结束：议和纳贡"
 oe_byd.13.c: "拒绝"
 oe_byd.13.c.tt: "城心#G +5#!\n苏丹换了人时，此后以新苏丹为围城者\n#Y 24#!个月后苏丹可能再提"
 oe_byd.13.d: "拒绝，严惩主和派"
 oe_byd.13.d.tt: "[oe_tu_authority|e]#R −10#!\n城心#G +20#!\n#Y 24#!个月后苏丹可能再提"
 oe_byd.12.t: "围城的终结"
 oe_byd.12.desc_c1cap: "#F 1402年7月，帖木儿在安卡拉击溃奥斯曼大军，巴耶济德被俘。围城的突厥军队随之散去，城中的突厥街区被拆除，困守八年的京城重新打开了城门。#!\n\n如今，苏丹兵败被俘，奥斯曼人自顾不暇，封锁瓦解了。京城被围了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。\n[GetCountry('BYZ').Custom('OeBydSettle')]\n威望#G +10#!；城中的突厥街区（如有）被拆除。"
 oe_byd.12.desc_c1: "#F 1402年7月，帖木儿在安卡拉击溃奥斯曼大军，巴耶济德被俘。围城的突厥军队随之散去，城中的突厥街区被拆除，困守八年的京城重新打开了城门。#!\n\n如今，奥斯曼王族兵戎相见，再也顾不上京城，封锁瓦解了。京城被围了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。\n[GetCountry('BYZ').Custom('OeBydSettle')]\n威望#G +10#!；城中的突厥街区（如有）被拆除。"
 oe_byd.12.desc_c2: "#F 1402年7月，帖木儿在安卡拉击溃奥斯曼大军，巴耶济德被俘。围城的突厥军队随之散去，城中的突厥街区被拆除，困守八年的京城重新打开了城门。#!\n\n如今，苏丹再也凑不齐围城的兵马，营寨自己散了。京城被围了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。\n[GetCountry('BYZ').Custom('OeBydSettle')]\n威望#G +10#!；城中的突厥街区（如有）被拆除。"
 oe_byd.12.desc_c3: "#F 1402年7月，帖木儿在安卡拉击溃奥斯曼大军，巴耶济德被俘。围城的突厥军队随之散去，城中的突厥街区被拆除，困守八年的京城重新打开了城门。#!\n\n如今，帝国与苏丹议定了条件，城外的营寨撤走了。京城被围了#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#!个月。\n[GetCountry('BYZ').Custom('OeBydSettle')]"
 oe_byd.12.a: "谢恩游行"
 oe_byd.12.b: "修复城外的村庄"
 oe_byd.12.b.tt: "花费#R 2#!个月的贸易与税收收入\n京城获得[ShowModifier('oe_byd_rebuild')]，持续#Y 10#!年"
 oe_byd.14.t: "城中的饥荒"
 oe_byd.14.desc: "#F 围城的后几年，京城一再闹饥荒，1400年初尤其严重。#!\n\n如今，粮储只剩#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#!，城中的面包一天比一天贵。"
 oe_byd.14.a: "开仓放粮"
 oe_byd.14.a.tt: "粮储#G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_granary_relief')|0]#!（#Y 10#!，粮仓每多一级再加#Y 3#!）\n城心#G +5#!"
 oe_byd.14.b: "向加拉塔高价买粮"
 oe_byd.14.b.tt: "花费#R 2#!个月的贸易与税收收入\n粮储#G +15#!"
 oe_byd.14.c: "按户配给"
 oe_byd.14.c.tt: "粮储#G +5#!\n城心#R −10#!"
 oe_byd.15.t: "翻墙出城的人"
 oe_byd.15.desc: "#F 1400年初的饥荒中，许多人翻过城墙，投奔城外的突厥人。#!\n\n如今，城心已降到#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#!。每天夜里都有人缒城而出，投奔苏丹的营寨。"
 oe_byd.15.a: "听其离去"
 oe_byd.15.a.tt: "粮储#G +5#!\n城心#G +3#!\n京城获得[ShowModifier('oe_byd_exodus')]，持续#Y 5#!年"
 oe_byd.15.b: "紧闭城门"
 oe_byd.15.b.tt: "城心#R −5#!"
 oe_byd.15.c: "发饷留人"
 oe_byd.15.c.tt: "花费#R 1#!个月的贸易与税收收入\n城心#G +5#!"
 oe_byd.16.t: "威尼斯的粮船"
 oe_byd.16.desc: "#F 围城期间，海上封得不严，威尼斯和热那亚的商船常常冒险运粮进城。#!\n\n如今，一支威尼斯船队载着粮食停在金角湾外。船主开出两种价钱：现钱，或者商约上的让步。"
 oe_byd.16.a: "高价买下"
 oe_byd.16.a.tt: "花费#R 2#!个月的贸易与税收收入\n粮储#G +15#!\n威尼斯对帝国好感#G +5#!，持续#Y 5#!年"
 oe_byd.16.b: "以商约换粮"
 oe_byd.16.b.tt: "粮储#G +20#!\n帝国获得[ShowModifier('oe_byd_grain_privilege')]，持续#Y 10#!年"
 oe_byd.16.c: "婉拒"
 oe_byd.16.c.tt: "船队另找买主"
 oe_byd.17.t: "陆墙下的强攻"
 oe_byd.17.desc: "#F 1395年夏秋，以及尼科波利斯之后到1397年春，突厥人几次猛攻陆墙，都被守军打退。#!\n\n如今，苏丹的大军开到陆墙下，准备强攻。城防#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_defense')|0]#!，守住的几率约为#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_hold_chance')|0]%#!。"
 oe_byd.17.a: "全城上墙"
 oe_byd.17.a.tt: "守住（几率#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_hold_chance')|0]%#!）：城心#G +10#!\n失守外垒：城心#R −10#!，粮储#R −5#!"
 oe_byd.17.b: "请加拉塔的热那亚人相助"
 oe_byd.17.b.tt: "花费#R 1#!个月的贸易与税收收入\n守住的几率再加#G 15%#!\n守住（几率#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_byd_hold_chance_gen')|0]%#!）：城心#G +10#!\n失守外垒：城心#R −10#!，粮储#R −5#!"
 oe_byd.90.t: "京城封锁：执行"
