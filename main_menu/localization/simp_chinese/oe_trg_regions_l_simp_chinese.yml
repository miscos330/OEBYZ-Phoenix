 STATIC_MODIFIER_NAME_oe_trg_kephale_defiant: "总凯法勒抗命"
 STATIC_MODIFIER_DESC_oe_trg_kephale_defiant: "大区的总凯法勒不听首都号令。总凯法勒的加成改为忠诚目标 −5，事务线效率不再加成。"
 oe_trg_region_1: "色雷斯"
