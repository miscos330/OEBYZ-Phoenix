 oe_trg.1.x: "暂不任命"
 oe_trg.1.x.tt: "不花费帝国权威，没有其他效果。"
 oe_trg.2.t: "总凯法勒抗命"
 oe_trg.2.d: "总凯法勒权势一大，就容易把辖区当作自己的地盘。1341年内战爆发后，许多城镇和要塞的长官看哪一方得势就投向哪一方，首都的命令出了城门便没有人理会。\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName]（[GetCountry('BYZ').Custom('OeTrgEvRegion')]总凯法勒）扣下了首都征调的兵员和钱粮，回信说本地另有急务。[GetCountry('BYZ').Custom('OeTrgEvRegion')]的各行省长官都在看皇帝怎么处置。"
 oe_trg.2.a: "罢免[SCOPE.sCharacter('oe_trg_kephale').GetHerHim]"
 oe_trg.2.a.tt: "[SCOPE.sCharacter('oe_trg_kephale').GetName]卸任，[GetCountry('BYZ').Custom('OeTrgEvRegion')]的总凯法勒出缺\n[GetCountry('BYZ').Custom('OeTrgEvRegion')]每个行省忠诚 −5（计入忠诚目标5年）\n若[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]出身名册上的豪族：该家族影响力 −50"
 oe_trg.2.b: "让步，承认[SCOPE.sCharacter('oe_trg_kephale').GetHerHis]的安排"
 oe_trg.2.b.tt: "−3帝国权威\n若[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]出身名册上的豪族：该家族影响力 +50\n[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]继续任职，5年内不再为此生事"
 oe_trg.2.c: "训诫了事"
 oe_trg.2.c.tt: "[GetCountry('BYZ').Custom('OeTrgEvRegion')]每个行省获得“总凯法勒抗命”，为期2年：总凯法勒的加成改为忠诚目标 −5，事务线效率不再加成\n[SCOPE.sCharacter('oe_trg_kephale').GetName]继续任职"
 oe_trg.3.t: "总凯法勒请求封邑"
 oe_trg.3.da: "1349年，约翰六世的儿子、专制公曼努埃尔·坎塔库泽努斯到摩里亚就任，半独立地统治这片土地；此后萨洛尼卡也几度交给皇子治理。总凯法勒统辖一方的做法，就这样让位给了宗室封邑。\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName]（[GetCountry('BYZ').Custom('OeTrgEvRegion')]总凯法勒）上书，请求把[GetCountry('BYZ').Custom('OeTrgEvRegion')]作为[SCOPE.sCharacter('oe_trg_kephale').GetHerHis]的封地。[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]出身皇室，可以受封：[GetCountry('BYZ').Custom('OeTrgEvRegion')]最大的内地行省[SCOPE.sCountry('oe_trg_fief').GetName]将改为专制公国，由[SCOPE.sCharacter('oe_trg_kephale').GetHerHim]出任专制公。"
 oe_trg.3.db: "1349年，约翰六世的儿子、专制公曼努埃尔·坎塔库泽努斯到摩里亚就任，半独立地统治这片土地；此后萨洛尼卡也几度交给皇子治理。总凯法勒统辖一方的做法，就这样让位给了宗室封邑。\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName]（[GetCountry('BYZ').Custom('OeTrgEvRegion')]总凯法勒）上书，请求把[GetCountry('BYZ').Custom('OeTrgEvRegion')]作为[SCOPE.sCharacter('oe_trg_kephale').GetHerHis]的封地。按惯例只有皇室成员才能受封专制公国，[GetCountry('BYZ').Custom('OeTrgEvRegion')]也可能没有可以分封的内地行省。皇帝只能拒绝，或另作补偿。"
 oe_trg.3.a: "册封为专制公"
 oe_trg.3.a.tt: "[SCOPE.sCountry('oe_trg_fief').GetName]改为宗室封邑（专制公国），每月把收入的5%上缴国库\n[SCOPE.sCharacter('oe_trg_kephale').GetName]迁往[SCOPE.sCountry('oe_trg_fief').GetName]出任专制公，原任长官回到宫廷\n[SCOPE.sCharacter('oe_trg_kephale').GetName]卸去总凯法勒，[GetCountry('BYZ').Custom('OeTrgEvRegion')]的总凯法勒出缺"
 oe_trg.3.b: "以尊号和田产代替封地"
 oe_trg.3.b.tt: "−3帝国权威\n若[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]出身名册上的豪族：该家族影响力 +50\n[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]继续任职，5年内不再为此生事"
 oe_trg.3.c: "拒绝并罢免[SCOPE.sCharacter('oe_trg_kephale').GetHerHim]"
 oe_trg.3.c.tt: "[SCOPE.sCharacter('oe_trg_kephale').GetName]卸任，[GetCountry('BYZ').Custom('OeTrgEvRegion')]的总凯法勒出缺\n[GetCountry('BYZ').Custom('OeTrgEvRegion')]每个行省忠诚 −5（计入忠诚目标5年）\n若[SCOPE.sCharacter('oe_trg_kephale').GetSheHe]出身名册上的豪族：该家族影响力 −50"
 oe_trg.4.t: "总凯法勒出缺"
 oe_trg.4.d: "[SCOPE.sCharacter('oe_trg_gone').GetName]不再担任[GetCountry('BYZ').Custom('OeTrgEvRegion')]总凯法勒：[SCOPE.sCharacter('oe_trg_gone').GetSheHe]已经去世、离开宫廷或登上皇位。[GetCountry('BYZ').Custom('OeTrgEvRegion')]各行省的“总凯法勒辖治”随之取消，可以在帝国柱石中重新任命。"
 oe_trg.4.a: "另择贤能"
 oe_trg.4.a.tt: "没有其他效果。"
