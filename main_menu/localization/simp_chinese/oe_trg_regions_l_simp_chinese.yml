 oe_trg_appoint: "任命总凯法勒"
 oe_trg_appoint_desc: "从宫廷中选一位成年人（不能是皇帝或储君），任命为一个大区的总凯法勒，花费3帝国权威。只有至少有2个行省、尚无总凯法勒的大区可选。\n\n在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。\n\n出身豪族且家族影响力达到500，或统辖4个以上行省且有一项能力达到70的总凯法勒会坐大：他可能不听号令，或请求以大区为封地。\n\n八个大区：色雷斯、马其顿与色萨利、希腊与群岛、多瑙河与伊利里库姆、西安纳托利亚、东安纳托利亚、意大利、海外诸地。\n\n14世纪的帝国在若干卡特潘区之上设总凯法勒（katholike kephale）统辖一方，任职者多是皇帝的亲属或大族子弟。到世纪末，这一职位随宗室专制公国的兴起而消失。"
 oe_trg_appoint.tt: "选择大区后花费3帝国权威。"
 oe_trg_allow_auth: "帝国权威至少为3"
 oe_trg_allow_open: "至少有一个大区拥有2个以上行省且没有总凯法勒"
 OE_TRG_SELECT: "选择总凯法勒人选"
 OE_TRG_NONE: "@trigger_no!宫廷里没有合适的人选"
 oe_trg_dismiss: "罢免总凯法勒"
 oe_trg_dismiss_desc: "罢免一位总凯法勒，他所辖大区的“总凯法勒辖治”随之取消。\n\n若此人已经坐大（家族影响力达到500，或统辖4个以上行省且有一项能力达到70），该大区每个行省忠诚 −5（计入忠诚目标5年），他的家族影响力 −50。"
 oe_trg_dismiss.tt: "总凯法勒卸任。若他已经坐大：该大区每个行省忠诚 −5（计入忠诚目标5年），他的家族影响力 −50。"
 oe_trg_allow_any: "至少有一位在任的总凯法勒"
 OE_TRG_SELECT_DISMISS: "选择要罢免的总凯法勒"
 OE_TRG_NONE_DISMISS: "@trigger_no!没有在任的总凯法勒"
 oe_trg.1.t: "任命总凯法勒"
 oe_trg.1.d: "14世纪，帝国的基层单位是卡特潘区，由凯法勒兼管军政。为了统筹相邻的几个区，皇帝有时在其上任命一位总凯法勒（katholike kephale），任职者多是皇帝的亲属或大族子弟。到世纪末，这个职位随着宗室专制公国的兴起而消失。\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName]已在御前候命。请选择[SCOPE.sCharacter('oe_trg_kephale').GetHerHim]统辖的大区，任命花费3帝国权威。只列出至少有2个行省、尚无总凯法勒的大区。"
 oe_trg.1.r1: "统辖色雷斯（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_1').GetValue|0]个行省）"
 oe_trg.1.r1.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任色雷斯总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r2: "统辖马其顿与色萨利（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_2').GetValue|0]个行省）"
 oe_trg.1.r2.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任马其顿与色萨利总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r3: "统辖希腊与群岛（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_3').GetValue|0]个行省）"
 oe_trg.1.r3.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任希腊与群岛总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r4: "统辖多瑙河与伊利里库姆（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_4').GetValue|0]个行省）"
 oe_trg.1.r4.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任多瑙河与伊利里库姆总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r5: "统辖西安纳托利亚（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_5').GetValue|0]个行省）"
 oe_trg.1.r5.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任西安纳托利亚总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r6: "统辖东安纳托利亚（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_6').GetValue|0]个行省）"
 oe_trg.1.r6.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任东安纳托利亚总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r7: "统辖意大利（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_7').GetValue|0]个行省）"
 oe_trg.1.r7.tt: "−3帝国权威\n[SCOPE.sCharacter('oe_trg_kephale').GetName]出任意大利总凯法勒。在任期间，该大区每个行省获得“总凯法勒辖治”（每年刷新）：忠诚目标 +5，五条事务线效率各 +5。任职者去世、离开宫廷、登基或被罢免时卸任。"
 oe_trg.1.r8: "统辖海外诸地（[GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_8').GetValue|0]个行省）"
