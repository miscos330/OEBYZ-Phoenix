 oe_sit_two_emperors: "两帝之争"
 oe_sit_two_emperors_desc: "自800年查理曼加冕以来，基督教世界便悬而未决的「两帝问题（Zweikaiserproblem）」随着新罗马重返亚平宁、伊利里亚与多瑙河流域而正面引爆。君士坦丁堡与神圣罗马帝国围绕唯一罗马正统展开持久角逐，法兰西、教宗国、选帝侯与宗教同盟亦卷入这场横跨近世的欧陆大博弈。"
 oe_sit_two_emperors_outcome_concord: "双罗马和约（Pax Duorum Imperiorum）"
 oe_sit_two_emperors_outcome_concord_desc: "东西和解度达到80且天平处于35至65之间连续满12个月（双方非交战状态）。两帝签署《多瑙—亚平宁分治宪章》，互认尊号并开启跨欧通商合作。"
 oe_sit_two_emperors_outcome_retreat: "帝国回撤（Imperial Retreat）"
 oe_sit_two_emperors_outcome_retreat_desc: "两帝天平跌至15以下、东罗马宿体覆灭，或1680年后东罗马丧失全部八大争议重镇且天平不高于35。神罗重振西方权威，东罗马承受二十年威望与外交重挫。"
 oe_sit_two_emperors_outcome_revolution: "旧秩序倾覆（革命时代收束）"
 oe_sit_two_emperors_outcome_revolution_desc: "步入革命时代并爆发革命局势（或至1790年）。自由平等与主权在民的新浪潮令千年帝号辩论黯然失色，两帝旧秩序在时代风暴前体面收束。"
 oe_sit_two_emperors_outcome_unus: "唯有一帝（Unus Imperator）"
 oe_sit_two_emperors_outcome_unus_desc: "两帝正统天平达到85，或东罗马直接控制罗马且同时控制维也纳或亚琛满12个月（或神罗已无有效皇帝）。神圣罗马帝国将被彻底解体，世间唯余新罗马一帝。"
 oe_twe.1.a: "天无二日，绝不退让半步！"
 oe_twe.1.b: "先留外交余地，审慎试探彼岸。"
 oe_twe.1.d: "君士坦丁堡的紫衣御玺与中欧神圣罗马帝国的金玺诏书，终于在意大利、伊利里亚与多瑙河畔迎面相撞。八百年前查理曼加冕埋下的正统裂痕再难掩饰——法王、教宗、选帝侯与宗教同盟的使节正蜂拥而至，静候两座帝国的抉择。"
 oe_twe.1.t: "两帝之争：谁是唯一的罗马皇帝？"
 oe_twe.10.a: "旧世界已逝，直面革命新时代。"
 oe_twe.10.d: "启蒙哲学、宪政诉求与革命狂潮席卷欧洲，民众与议会不再关心八百年前谁曾接受查理曼或查士丁尼的皇冠。千年「两帝之争」在新时代风暴面前悄然落幕，两座古老帝国都必须直面革命时代的生死考验。"
 oe_twe.10.t: "旧秩序倾覆：革命风暴下的两帝余晖"
 oe_twe.2.a: "重金刊印法理檄文，力压异议。"
 oe_twe.2.b: "降温笔战，释放东西对话信号。"
 oe_twe.2.d: "随着两帝张力攀升，罗马教廷与欧陆法学家就「帝权转移（Translatio Imperii）」展开激烈笔战。西方援引教宗加冕权与《金玺诏书》，东方则高举查士丁尼法典与不绝的罗马元老院传承，各方宫廷皆须表态。"
 oe_twe.2.t: "教廷冠冕抗议与东西法统之辩"
 oe_twe.20.t: "两帝之争：终局结算"
 oe_twe.3.a: "拨饷增防，把守多瑙与亚得里亚要隘！"
 oe_twe.3.b: "缔结务实通航规约，暂避两线消耗。"
 oe_twe.3.d: "布达、拉文纳与威尼斯航道上的驻军频繁对峙，边疆总督与选帝侯皆警告一场全面帝国大战一触即发。是要倾注军费筑垒增兵，还是暂订通航与边务规约？"
 oe_twe.3.t: "多瑙河与亚得里亚前线告急"
 oe_twe.4.a: "接受密约，共同掣肘中欧帝权。"
 oe_twe.4.b: "婉拒密谋，维持审慎中立。"
 oe_twe.4.d: "为打破中欧帝权的合围，巴黎密使悄然越过阿尔卑斯与爱琴海，提议以商贸特许和秘密军援打造横跨欧陆的牵制阵线。这一超越教派的现实政治算计必将激怒保守教士。"
 oe_twe.4.t: "法王密使：两面牵制之策"
 oe_twe.5.a: "顺势纵横捭阖，借教派大战扩大优势。"
 oe_twe.5.b: "稳住内政，趁战火疲惫推动东西缓和。"
 oe_twe.5.d: "新教同盟与天主教同盟在德意志刀兵相见，整个神圣罗马帝国陷入教派火海。两座罗马帝国既可借这场欧陆混战强行改写均势，亦可趁各方疲惫之际促成东西缓和。"
 oe_twe.5.t: "宗教战争风暴中的双鹰"
 oe_twe.6.a: "拨款支持常设使团，推进《双罗马和约》。"
 oe_twe.6.b: "斥责妥协草案，重申帝国寸土不让。"
 oe_twe.6.d: "历经连年外交斡旋，维也纳与君士坦丁堡的专使终于坐上同一张长桌，草拟《多瑙—亚平宁分治宪章》：互认东西帝号、厘清贸易关税并撤除前沿挑衅。强硬派斥之为耻辱，务实派则视之为百年和平之基。"
 oe_twe.6.t: "东西使节密商：两罗马分治蓝图"
 oe_twe.7.a: "世间唯余一罗马，万邦共仰紫衣！"
 oe_twe.7.d: "随着德意志神圣罗马帝国的解散，自公元800年绵延至今的两帝之争终于画上句号。新罗马的紫衣双头鹰成为基督教世界唯一的罗马法统象征，然而治理横跨欧亚的广土与安抚桀骜勋贵才刚刚开始。"
 oe_twe.7.t: "唯有一帝（Unus Imperator）"
 oe_twe.8.a: "愿东西两罗马长保和平与通商。"
 oe_twe.8.d: "东西两帝在诸国见证下共同签署《多瑙—亚平宁分治宪章》，正式互认彼此的罗马帝号与传统疆界。尽管双帝都向强硬派付出了颜面代价，但跨越地中海与中欧的商旅与外交黄金时代已然揭幕。"
 oe_twe.8.t: "双罗马和约（Pax Duorum Imperiorum）"
 oe_twe.9.a: "铭记此役，审视帝国新的边界。"
 oe_twe.9.d: "经过漫长的外交与战略较量，东罗马西进亚平宁与多瑙河的攻势终于折戟。神圣罗马帝国稳住了中欧法统与选帝侯秩序，而君士坦丁堡不得不收缩战线，在二十年的威望阴霾中休养生息。"
 oe_twe.9.t: "帝国回撤（Imperial Retreat）"
 oe_twe.90.a: "了解。"
