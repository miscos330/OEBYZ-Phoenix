 oe_twe_act_hre_diet_defiance_cd: "帝国议会重申《金玺诏书》"
 oe_twe_act_hre_diet_defiance_desc: "神罗皇帝消耗10点帝国权威（不足则支付160+金币）并折损贵族满意度5%，获得五年「金玺诏书帝国壁垒」修正；天平向西推回#color_gold −8#!，张力#R +5#!。冷却五年。"
 oe_twe_act_papal_arbitration: "教廷与选帝侯冠冕仲裁"
 oe_twe_act_papal_arbitration_cd: "教廷与选帝侯冠冕仲裁"
 oe_twe_act_papal_arbitration_desc: "教宗国或神罗选帝侯支付120+金币并消耗宗教影响（或威望）10点进行仲裁：获五年仲裁修正；若张力≥50或天平偏向东帝，则推高和解度#G +5#!并降张力−3，否则坚护西方帝冠使天平#color_gold −3#!并增张力+2（全局每年最多推动一次）。本国冷却六年。"
