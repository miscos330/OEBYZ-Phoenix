 OE_TWE_BAL_FOOT: "天平 ≥ 85（或直接持有罗马+维也纳/亚琛满12月）达成「唯有一帝」并安全解体神罗；跌至 ≤ 15 则落入「帝国回撤」。八大争议重镇与神罗帝国权威每月自动驱动天平。"
