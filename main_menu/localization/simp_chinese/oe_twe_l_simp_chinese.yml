 STATIC_MODIFIER_DESC_oe_twe_adriatic_accord_mod: "在紧张对峙中暂保亚得里亚商路畅通，兼顾商贸与外交通道，但令强硬派质疑帝国威仪。"
 STATIC_MODIFIER_DESC_oe_twe_concord_talks_mod: "双方派驻常设专使核定礼仪与边界草案，增进外交互信与国内稳定，却须克制扩张言辞。"
 STATIC_MODIFIER_DESC_oe_twe_concordat_mod: "东西两帝正式互认尊号与势力边界，欧洲迎来罕见的跨海通商与外交协作期，但双帝均须承受向彼岸妥协的威望损耗。"
 STATIC_MODIFIER_DESC_oe_twe_danube_alert_mod: "两帝沿多瑙河与亚得里亚海要塞严阵以待，防务与军心同步提升，但持续战备压榨军费开支。"
 STATIC_MODIFIER_DESC_oe_twe_envoy_detente_mod: "东西使节在多瑙河与亚得里亚之间往返磋商分界草案，缓和外交张力却折损强硬派眼中的帝国颜面。"
 STATIC_MODIFIER_DESC_oe_twe_french_subsidy_mod: "巴黎暗中资助新罗马牵制中欧帝权，开辟地中海商贸与外交通道，却招致国内天主教教士强烈不满。"
 STATIC_MODIFIER_DESC_oe_twe_hre_bulwark_mod: "神圣罗马帝国议会重申西方帝冠法统并整军备战，提升陆军士气但加重军费维持负担。"
 STATIC_MODIFIER_DESC_oe_twe_hre_vindicated_mod: "神圣罗马帝国顶住东罗马西进浪潮，帝国权威与皇室声望重振，但庞大的常备防务仍消耗着财政。"
 STATIC_MODIFIER_DESC_oe_twe_imperial_diet_schism_mod: "借欧陆教派大战重塑结盟与军制，拓宽外交容量与军纪，却引发国内传统教士阶层非议。"
 STATIC_MODIFIER_DESC_oe_twe_old_order_shaken_mod: "启蒙与革命浪潮席卷欧陆，千年两帝法统之争在主权在民与新思潮面前骤然失色，旧制度稳固成本陡升。"
 STATIC_MODIFIER_DESC_oe_twe_papal_crown_mod: "罗马教廷与选帝侯借帝国冠冕法理斡旋东西之争，提升外交声望但须承担维系旧秩序的政治成本。"
 STATIC_MODIFIER_DESC_oe_twe_prot_eastern_relief_mod: "新教同盟趁神罗腹背受敌与新罗马暗通声气，增强本土防御与军心，但遭天主教列强严厉指责。"
 STATIC_MODIFIER_DESC_oe_twe_translatio_edict_mod: "君士坦丁堡公然重申唯一罗马帝统，提升皇室威望与强硬姿态，但引起西方诸廷的普遍戒备与外交孤立。"
 STATIC_MODIFIER_DESC_oe_twe_unus_imperator_mod: "德意志神圣罗马帝号终结，世间唯余新罗马一帝。帝国威望与号令冠绝欧陆，却须长期承受广土治理与旧贵族掣肘。"
 STATIC_MODIFIER_DESC_oe_twe_west_retreat_mod: "东罗马在两帝法统角逐中失利退守巴尔干与东地中海，威望与外交声誉重挫二十年，唯得借收缩防线固本清源。"
