 oe_twe_act_protestant_subsidy_desc: "新教或新教同盟成员支付100+金币并损耗稳定度2.5，与君堡互通军情：获五年防御与士气修正，招致神罗皇帝与教廷敌意−25，并推高天平#G +3#!、张力#R +3#!（全局每年最多推动一次）。本国冷却六年。"
 oe_twe_act_translatio_edict: "颁布《新罗马唯一帝诏》"
 oe_twe_act_translatio_edict_cd: "颁布《新罗马唯一帝诏》"
 oe_twe_act_translatio_edict_desc: "东罗马支付180+金币并承受五年外交声誉−1及神罗、教宗好感−25；两帝天平向东推高#G +8#!（控制至少3处争议重镇时再#G +4#!），帝权张力#R +6#!。冷却五年。"
