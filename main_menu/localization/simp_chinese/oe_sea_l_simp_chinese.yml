 oe_sea_b_malabar_charter: "卡利卡特香料特许商约"
 oe_sea_b_bengal_silk: "松纳尔冈丝棉互市协定"
 oe_sea_b_daiviet_tribute: "升龙—南海朝贡互市之谊"
 oe_sea_b_indochina_rivalry: "中南半岛边防与海权摩擦"
 oe_sea_b_malacca_envoy: "马六甲海峡通商特使"
 oe_sea_b_monsoon_league: "印度洋—南洋季风联航同盟"
 STATIC_MODIFIER_NAME_oe_sea_deccan_equilibrium: "后德里德干均势防务"
 STATIC_MODIFIER_DESC_oe_sea_deccan_equilibrium: "在德里苏丹国裂解之际稳住德干腹地防线与河谷关隘，陆军士气与防御增强，常备驻防军费略微上升。"
 STATIC_MODIFIER_NAME_oe_sea_gujarat_ports_accord: "古吉拉特双港商税协约"
 STATIC_MODIFIER_DESC_oe_sea_gujarat_ports_accord: "打通坎贝与苏拉特往来红海及阿拉伯海的商船通道，贸易收入与商人力大增，王室直辖权略向商帮折让。"
 STATIC_MODIFIER_NAME_oe_sea_deccan_gunpowder: "德干战马与早期火器军改"
 STATIC_MODIFIER_DESC_oe_sea_deccan_gunpowder: "经果阿与马拉巴尔重金购入波斯战马并引入早期火铳与臼炮，纪律与炮兵威力大进，但军费攀升且旧勋贵颇有怨言。"
 STATIC_MODIFIER_NAME_oe_sea_war_elephant_corps: "莱楚尔铁甲战象军团"
 STATIC_MODIFIER_DESC_oe_sea_war_elephant_corps: "以德干重甲战象与山地坚城构筑正面防线，陆军士气与守城韧性卓著，但火炮攻城与税赋效率相对受限。"
 STATIC_MODIFIER_NAME_oe_sea_malabar_monopoly: "马拉巴尔王室胡椒专卖"
 STATIC_MODIFIER_DESC_oe_sea_malabar_monopoly: "由朝廷直接统管卡利卡特与果阿的胡椒出口并设关缉私，税效与海贸收益增长，却引起地方商民与外邦怨望。"
 STATIC_MODIFIER_NAME_oe_sea_calicut_charter_mod: "《卡利卡特香料特许状》"
 STATIC_MODIFIER_DESC_oe_sea_calicut_charter_mod: "与罗马商社或大元市舶司互换关税分成与商栈保护，贸易收入、商人力与思潮传播齐升，代价是让渡部分本土税效与护航开支。"
 STATIC_MODIFIER_NAME_oe_sea_local_pepper_brokers: "扎莫林本地胡椒行帮旧例"
 STATIC_MODIFIER_DESC_oe_sea_local_pepper_brokers: "沿袭马拉巴尔传统商帮代理抽税，财政安稳且少纷争，然远洋海上存在与跨洋商路影响有所收缩。"
 STATIC_MODIFIER_NAME_oe_sea_sonargaon_compact: "《松纳尔冈丝棉商约》"
 STATIC_MODIFIER_DESC_oe_sea_sonargaon_compact: "将恒河三角洲极品细棉布与生丝纳入印度洋—南洋联航体系，贸易收入、生产与思潮加速成长，王室直辖控驭略有分散。"
 STATIC_MODIFIER_NAME_oe_sea_bengal_royal_looms: "高尔—孟加拉官营织造局"
 STATIC_MODIFIER_DESC_oe_sea_bengal_royal_looms: "集中工匠在三角洲内河兴办官营丝棉作坊并严控外商渗透，生产与税效稳固，外部商人力相对偏弱。"
 STATIC_MODIFIER_NAME_oe_sea_timurid_southward_push: "帖木儿—河中铁骑南下势能"
 STATIC_MODIFIER_DESC_oe_sea_timurid_southward_push: "中亚与伊朗战局促使河中火器骑兵全力经略印度河与德里平原，纪律与骑兵冲击力剧增，维稳与军费承压。"
 STATIC_MODIFIER_NAME_oe_sea_iron_resistance_india: "次大陆铁血拒敌总动员"
 STATIC_MODIFIER_DESC_oe_sea_iron_resistance_india: "北印与德干诸邦紧急整军备战、坚壁清野以抗衡西北铁骑，防御与陆军士气高涨，但战时征发压缩商贸与税基。"
 STATIC_MODIFIER_NAME_oe_sea_panipat_gunpowder_mod: "帕尼帕特火器近代化"
 STATIC_MODIFIER_DESC_oe_sea_panipat_gunpowder_mod: "全面推行火绳枪战车车阵与野战铜炮编成，纪律、炮兵威力与军事革新突飞猛进，高额军费与旧武士阶层不满接踵而至。"
 STATIC_MODIFIER_NAME_oe_sea_panipat_iron_bulwark: "铁血拒敌：本土重步与堡垒防线"
 STATIC_MODIFIER_DESC_oe_sea_panipat_iron_bulwark: "拒绝照搬外邦车阵而以本土重步兵、战象与雄关险隘硬撼火炮，防御与士气稳固，但火炮威力与思潮吸纳略显迟滞。"
 STATIC_MODIFIER_NAME_oe_sea_daiviet_tribute_trade: "升龙—南海朝贡互市体制"
 STATIC_MODIFIER_DESC_oe_sea_daiviet_tribute_trade: "以朝贡勘合与中兴大元或中原商船互通南海货殖，贸易收入、商人力与外交声誉齐升，须在礼仪威望上有所谦让。"
 STATIC_MODIFIER_NAME_oe_sea_daiviet_nam_tien: "大越南进自主经略"
 STATIC_MODIFIER_DESC_oe_sea_daiviet_nam_tien: "立足红河三角洲独立自主并沿中南半岛海岸南进垦殖，陆军士气与领土整合加速，周边外交摩擦与维稳开销亦随之上升。"
 STATIC_MODIFIER_NAME_oe_sea_malacca_free_strait: "马六甲海峡自由总汇体制"
 STATIC_MODIFIER_DESC_oe_sea_malacca_free_strait: "以低关税、公平市舶法与多语港务长广招泉州、爪哇、印度与红海商舶，商贸、海上存在与思潮传播大盛，巡海防务开支不菲。"
 STATIC_MODIFIER_NAME_oe_sea_malacca_toll_fleet: "马六甲武装护航与海峡重税"
 STATIC_MODIFIER_DESC_oe_sea_malacca_toll_fleet: "以重型巡海船队强制缉私并征收海峡过境重税，国库税效与海军士气大涨，却压抑外商积极性并招致邻邦猜忌。"
 STATIC_MODIFIER_NAME_oe_sea_nusantara_spice_charter: "爪哇—巨港群岛香料商栈特许"
 STATIC_MODIFIER_DESC_oe_sea_nusantara_spice_charter: "帕拉帕誓言盛极之后向泉州与印度洋商队开放特罗乌兰与巨港香料港，海贸、海上存在与思潮加速成长，王室对边岛直控略减。"
 STATIC_MODIFIER_NAME_oe_sea_java_inland_focus: "爪哇内陆稻作与王廷固本"
 STATIC_MODIFIER_DESC_oe_sea_java_inland_focus: "收缩远海商栈以专务爪哇腹地水利稻作与王权礼法，国内税效与稳定成本大为改善，海上扩张力则明显回落。"
 STATIC_MODIFIER_NAME_oe_sea_siam_royal_junks: "阿瑜陀耶王室御船海贸队"
 STATIC_MODIFIER_DESC_oe_sea_siam_royal_junks: "由暹罗王室直接造船往来南海、马六甲与孟加拉湾，贸易收入、海上存在与商人力齐升，船队维护费显著加重。"
 STATIC_MODIFIER_NAME_oe_sea_siam_river_hegemony: "湄南河谷农税与中南陆权"
 STATIC_MODIFIER_DESC_oe_sea_siam_river_hegemony: "深耕湄南河平原税基并统合中南半岛陆上诸藩，税效与陆军士气稳健提升，远洋商帮力量相对受抑。"
 STATIC_MODIFIER_NAME_oe_sea_monsoon_league_mod: "印度洋—南洋季风联航协约"
 STATIC_MODIFIER_DESC_oe_sea_monsoon_league_mod: "东西航路诸国共约统一季风航期、灯塔补给与护航分摊，商贸、海权与思潮传播俱兴，须承担常年巡海与海关折让。"
 STATIC_MODIFIER_NAME_oe_sea_exclusive_harbors_mod: "海港排他重关体制"
 STATIC_MODIFIER_DESC_oe_sea_exclusive_harbors_mod: "坚持对过境海舶征收排他性重税而不加入跨洋降税体系，税效与王室集权上升，思潮传播与国际声誉受阻。"
 STATIC_MODIFIER_NAME_oe_sea_grand_maritime_charter: "东西大洋海上丝路永恒宪章"
 STATIC_MODIFIER_DESC_oe_sea_grand_maritime_charter: "从泉州刺桐经马六甲、卡利卡特直抵亚丁与图拉真运河的全链海上丝路彻底贯通，商贸、商人力、海上存在与思潮传播臻于鼎盛，而万里护航与开放门户亦带来长久开销。"
 STATIC_MODIFIER_NAME_oe_sea_armed_monsoon_order: "季风大洋武装护航秩序"
 STATIC_MODIFIER_DESC_oe_sea_armed_monsoon_order: "以常备重舰锁定印度洋与南洋关键海峡咽喉，海军士气、贸易保护与海贸收入俱强，但舰队维系费用高昂且令列国生畏。"
 STATIC_MODIFIER_NAME_oe_sea_monsoon_convoy_mod: "季风联航官商船队"
 STATIC_MODIFIER_DESC_oe_sea_monsoon_convoy_mod: "顺应冬夏信风定期派出贯通泉州、马六甲、马拉巴尔与红海的联合商队，贸易收益与思潮交汇提速，伴随护航支出。"
 STATIC_MODIFIER_NAME_oe_sea_corridor_tier_1: "海上丝路全链增益（一阶：单段通航）"
 STATIC_MODIFIER_DESC_oe_sea_corridor_tier_1: "海上丝路东、中、西三大节点中已打通一处，签约沿线国初享跨海贸易与思潮微增，须分担基础巡海费用。"
 STATIC_MODIFIER_NAME_oe_sea_corridor_tier_2: "海上丝路全链增益（二阶：双段联航）"
 STATIC_MODIFIER_DESC_oe_sea_corridor_tier_2: "海上丝路三大关键节点中已有两段畅通，季风商船跨洋接力令贸易、海上存在与思潮传播明显跃升，护航支出同步增加。"
 STATIC_MODIFIER_NAME_oe_sea_corridor_tier_3: "海上丝路全链增益（三阶：全链贯通）"
 STATIC_MODIFIER_DESC_oe_sea_corridor_tier_3: "刺桐港、马六甲—卡利卡特中枢与亚丁—图拉真运河三段全链贯通！沿线签约国共享巨额跨洋海贸红利与思潮飞跃，同时承担全洋面护航维系重负。"
 STATIC_MODIFIER_NAME_oe_sea_malabar_spice_port: "马拉巴尔香料特许总港"
 STATIC_MODIFIER_DESC_oe_sea_malabar_spice_port: "卡利卡特与果阿海岸云集东西方胡椒商船与货栈，港口商权与发展跃升，异邦水手往来亦带来些许市井喧嚣。"
 STATIC_MODIFIER_NAME_oe_sea_sonargaon_loom_hub: "松纳尔冈丝棉外销总坊"
 STATIC_MODIFIER_DESC_oe_sea_sonargaon_loom_hub: "恒河三角洲河港汇聚万千织机与远洋商船，贸易权重与港口繁荣大振，人烟辐辏带来轻微地方躁动。"
 STATIC_MODIFIER_NAME_oe_sea_thang_long_emporium: "升龙—红河南海互市港"
 STATIC_MODIFIER_DESC_oe_sea_thang_long_emporium: "红河口与升龙城联通大元市舶与南洋商船，商贸与水运建置稳步攀升，城坊流寓略增治理负担。"
 STATIC_MODIFIER_NAME_oe_sea_malacca_strait_hub: "马六甲海峡季风总汇港"
 STATIC_MODIFIER_DESC_oe_sea_malacca_strait_hub: "东西信风在此换季交汇，来自泉州、爪哇、印度与红海的商船鳞次栉比，成为南洋第一商贸与造船大港。"
 STATIC_MODIFIER_NAME_oe_sea_java_spice_entrepot: "爪哇—巨港群岛香料商栈"
 STATIC_MODIFIER_DESC_oe_sea_java_spice_entrepot: "丁香、肉豆蔻与胡椒经特罗乌兰与巨港装船远航东西两洋，地方商力与水手补给显著增强。"
 STATIC_MODIFIER_NAME_oe_sea_ayodhya_royal_port: "阿瑜陀耶湄南河御船商港"
 STATIC_MODIFIER_DESC_oe_sea_ayodhya_royal_port: "湄南河口遍布王室御船坞与外商货栈，贸易枢纽权重与造船效率显著抬升，河港税关繁忙而略生摩擦。"
 oe_sea_dec_calicut_charter.title: "缔结《卡利卡特香料特许状》"
 oe_sea_dec_calicut_charter.desc: "拨出商站营建金并让渡部分港口关税分成，正式将马拉巴尔胡椒门户（卡利卡特与果阿）接入全链海上丝路体系。"
 oe_sea_dec_calicut_charter.a: "颁授卡利卡特香料特许状"
 oe_sea_dec_sonargaon_compact.title: "缔结《松纳尔冈丝棉商约》"
 oe_sea_dec_sonargaon_compact.desc: "与恒河三角洲织坊行帮签署丝棉长约，将松纳尔冈细棉布与生丝纳入印度洋—南洋定期商船航线。"
 oe_sea_dec_sonargaon_compact.a: "签署松纳尔冈丝棉商约"
 oe_sea_dec_malacca_entrepot.title: "营建马六甲海峡自由总汇"
 oe_sea_dec_malacca_entrepot.desc: "拨款扩建马六甲港栈并颁行低税市舶章程，联通泉州刺桐、爪哇香料群岛与马拉巴尔胡椒港。"
 oe_sea_dec_malacca_entrepot.a: "颁行马六甲海峡自由港章程"
 oe_sea_dec_monsoon_fleet.title: "派遣印度洋—南洋季风联航商队"
 oe_sea_dec_monsoon_fleet.desc: "顺应季风规律派出满载香料、瓷器与丝棉的官商联合船队，刷新海上丝路全链等级并换取十五年期商贸与思潮收益。"
 oe_sea_dec_monsoon_fleet.a: "拨银整装季风联航商队"
 oe_sea.1.t: "后德里德干均势与古吉拉特港"
 oe_sea.1.d: "随着德里苏丹国对南方的统驭动摇，德干高原与印度西岸的格局骤然重塑。毗奢耶那伽罗立足南方名城，古尔伯加一带的德干穆斯林诸侯自立称雄，而古吉拉特的坎贝与苏拉特商港则成为联通阿拉伯海、红海与波斯湾的黄金门户。\n\n面对群雄并起的新局，我们是优先筑牢德干腹地防线以稳均势，还是以商港关税协约抢占西印度洋贸易先机？"
 oe_sea.1.a: "筑牢德干河谷防线与边防军镇，稳握次大陆均势"
 oe_sea.1.a.tt: "花费#R 120金币#!，陆军传统#G +8#!，获得[ShowModifier('oe_sea_deccan_equilibrium')]，持续#Y 25年#!。"
 oe_sea.1.b: "与坎贝、苏拉特商港缔结关税互惠，打通西印度洋航线"
 oe_sea.1.b.tt: "花费#R 90金币#!，改善与古吉拉特商港持有国关系，获得[ShowModifier('oe_sea_gujarat_ports_accord')]，持续#Y 25年#!。"
 oe_sea.2.t: "德干火药与战象"
 oe_sea.2.d: "毗奢耶那伽罗与德干北方穆斯林诸侯围绕莱楚尔河间地与果阿、卡利卡特两处要港展开经年拉锯。谁掌握马拉巴尔与康坎港口，谁便能以香料换取来自波斯湾与阿拉伯的良种战马，并率先延揽西亚炮匠铸造早期火铳与攻城臼炮。\n\n在传统重甲战象与耗金巨大的火器骑兵改制之间，军议陷入激烈争论。"
 oe_sea.2.a: "重金购入波斯战马并延聘西亚火器匠师，推行德干火药军改"
 oe_sea.2.a.tt: "花费#R 180金币#!，稳定度#R −2#!，陆军传统#G +10#!，获得[ShowModifier('oe_sea_deccan_gunpowder')]，持续#Y 30年#!。"
 oe_sea.2.b: "倚重铁甲战象军团与山地坚城，以逸待劳固守河间地"
 oe_sea.2.b.tt: "花费#R 110金币#!，威望#G +8#!，获得[ShowModifier('oe_sea_war_elephant_corps')]，持续#Y 30年#!。"
 oe_sea.3.t: "马拉巴尔胡椒门户"
 oe_sea.3.d: "印度西南岸的卡利卡特（科泽科德）与果阿堆满黑胡椒、豆蔻与肉桂，是连接红海亚丁与南洋马六甲的印度洋核心中转港。随着跨洋帆船云集，本地商帮与远洋使节竞相叩关求约。\n\n若罗马商社或大元市舶司正活跃于东西洋面，我们可与之互换关税分成、正式颁授《卡利卡特香料特许状》，将马拉巴尔枢纽接入全链海上丝路；亦可坚持王室专卖或沿袭本地扎莫林商帮旧例。"
 oe_sea.3.a: "收归卡利卡特与果阿香料榷关，推行王室胡椒专卖并接入海路"
 oe_sea.3.a.tt: "花费#R 150金币#!，成为#bold #color_yellow 海上丝路签约国#!#!，升级马拉巴尔港口，获得[ShowModifier('oe_sea_malabar_monopoly')]，持续#Y 30年#!。"
 oe_sea.3.b: "与罗马商社及大元市舶司共签《卡利卡特香料特许状》，互换关税分成"
 oe_sea.3.b.tt: "花费#R 180金币#!，威望#R −8#!（让渡关税分成与外交成本），成为#bold #color_yellow 海上丝路签约国#!#!，升级卡利卡特并增进双边好感，获得[ShowModifier('oe_sea_calicut_charter_mod')]，持续#Y 35年#!。"
 oe_sea.3.c: "沿袭本地扎莫林商帮旧例抽税，不涉跨洋长约"
 oe_sea.3.c.tt: "稳定度#G +3#!，获得[ShowModifier('oe_sea_local_pepper_brokers')]，持续#Y 25年#!。"
 oe_sea.4.t: "孟加拉三角洲"
 oe_sea.4.d: "恒河与布拉马普特拉河交汇处的松纳尔冈与高尔城，素以轻如蝉翼的达卡细棉布与生丝闻名东西两洋。每逢东北季风起时，满载白银与瓷器的海舶便驶入孟加拉湾，期盼以长期商约锁定三角洲货源。\n\n我们既可签署《松纳尔冈丝棉商约》融入印度洋—南洋联航大网，也可将织坊收归王室专营以保内库税入。"
 oe_sea.4.a: "签署《松纳尔冈丝棉商约》，联通孟加拉湾与东西海贸船队"
 oe_sea.4.a.tt: "花费#R 160金币#!，威望#R −5#!，成为#bold #color_yellow 海上丝路签约国#!#!，升级松纳尔冈商港并增进合作国好感，获得[ShowModifier('oe_sea_sonargaon_compact')]，持续#Y 30年#!。"
 oe_sea.4.b: "在高尔与松纳尔冈兴办官营丝棉织局，慎对外商开放"
 oe_sea.4.b.tt: "花费#R 120金币#!，升级松纳尔冈织造枢纽，获得[ShowModifier('oe_sea_bengal_royal_looms')]，持续#Y 30年#!。"
 oe_sea.5.t: "帖木儿遗产南下"
 oe_sea.5.d: "进入十六世纪，伊朗高原强权崛起与河中东线防务壁垒令帖木儿后裔及中亚铁骑在西北受挫。携带着奥斯曼式野战火炮与河中骑兵遗产的南下浪潮越过开伯尔山口，直指旁遮普与德里平原，莫卧儿新潮山雨欲来！\n\n面对席卷印度河的铁骑与火药风暴，我们是顺势吸纳河中—喀布尔火器骑兵遗产争夺北印霸权，还是集结次大陆诸邦铁血拒敌？"
 oe_sea.5.a: "吸纳河中火器骑兵遗产，全力角逐印度河与德里霸权"
 oe_sea.5.a.tt: "花费#R 200金币#!，稳定度#R −4#!，陆军传统#G +12#!（若莫卧儿已成立则同步赋能），获得[ShowModifier('oe_sea_timurid_southward_push')]，持续#Y 30年#!。"
 oe_sea.5.b: "铁血拒敌！动员旁遮普、德里与德干联军死守西北雄关"
 oe_sea.5.b.tt: "花费#R 180金币#!，人力#R −2#!，威望#G +10#!，获得[ShowModifier('oe_sea_iron_resistance_india')]，持续#Y 30年#!。"
 oe_sea.6.t: "帕尼帕特火器革新"
 oe_sea.6.d: "帕尼帕特原野的硝烟彻底改写了印度次大陆的战争法则：以铁链相连的大车车阵、轮番齐射的火绳枪手与集中部署的野战铜炮，在正面战场击碎了旧式战象与重骑冲击。无论德里、毗奢耶那伽罗抑或新锐莫卧儿，都必须立刻作出抉择。\n\n彻底推行火器近代化需耗巨资并触怒旧武士阶层；而坚持本土重步与山城坚壁虽能稳住国内，却须承受火炮代差风险。"
 oe_sea.6.a: "全面推行帕尼帕特火器近代化，编练火绳枪车阵与野战炮兵"
 oe_sea.6.a.tt: "花费#R 260金币#!，稳定度#R −4#!，贵族满意下降，陆军传统#G +12#!，获得[ShowModifier('oe_sea_panipat_gunpowder_mod')]，持续#Y 35年#!。"
 oe_sea.6.b: "铁血拒敌：整编本土重步兵、战象与山地堡垒以坚壁耗敌"
 oe_sea.6.b.tt: "花费#R 160金币#!，人力#R −1.5#!，稳定度#G +3#!，获得[ShowModifier('oe_sea_panipat_iron_bulwark')]，持续#Y 35年#!。"
 oe_sea.7.t: "升龙南顾"
 oe_sea.7.d: "红河三角洲的升龙（今河内古称）北接中兴大元与岭南，南扼南海瓷器与沉香航道，东望泉州刺桐港。随着大元海防重整、南洋航运日盛，升龙朝廷站在十字路口：\n\n是遣使北上订立朝贡互市勘合，借南海商流充实国库并接入海上丝路；还是厉行自主南进，沿中南半岛海岸经略占婆、独掌一方？"
 oe_sea.7.a: "订立升龙—南海朝贡互市约，借海贸通商联通泉州与南洋"
 oe_sea.7.a.tt: "花费#R 110金币#!，威望#R −5#!，成为#bold #color_yellow 海上丝路签约国#!#!，升级升龙港并增进与中原大国好感，获得[ShowModifier('oe_sea_daiviet_tribute_trade')]，持续#Y 30年#!。"
 oe_sea.7.b: "厉行自主南进，经略红河平原并向占婆沿岸拓展疆土"
 oe_sea.7.b.tt: "花费#R 140金币#!，稳定度#R −2#!，陆军传统#G +8#!，与邻国产生边防摩擦，获得[ShowModifier('oe_sea_daiviet_nam_tien')]，持续#Y 30年#!。"
 oe_sea.8.t: "马六甲海峡兴起"
 oe_sea.8.d: "三佛齐旧部王子巴里苏拉在马来半岛西岸择地建港，马六甲（满剌加）凭扼守印度洋与南海咽喉之利迅速崛起。东北季风送来泉州丝瓷，西南季风送来古吉拉特细布与马拉巴尔胡椒，无数商船在此停泊候风交易。\n\n若马六甲苏丹国已立则顺势挂接，绝不强拆疆界；我们须为海峡定下海贸规制：推行低税自由总汇，还是以武装舰队征收海峡重税？"
 oe_sea.8.a: "确立马六甲自由转口总汇与多语港务法，打通海上丝路中枢"
 oe_sea.8.a.tt: "花费#R 160金币#!，成为#bold #color_yellow 海上丝路签约国#!#!，升级马六甲枢纽并增进海峡使节好感，获得[ShowModifier('oe_sea_malacca_free_strait')]，持续#Y 35年#!。"
 oe_sea.8.b: "组建海峡巡海舰队弹压海盗，对过境商船征收高额关防税"
 oe_sea.8.b.tt: "花费#R 190金币#!，海军传统#G +10#!，升级马六甲枢纽，获得[ShowModifier('oe_sea_malacca_toll_fleet')]，持续#Y 35年#!。"
 oe_sea.9.t: "帕拉帕誓言之后"
 oe_sea.9.d: "加查·马达立下帕拉帕誓言、哈奄·武禄治下盛极一时之后，满者伯夷王朝在特罗乌兰与巨港面临新的抉择。马鲁古丁香与肉豆蔻经爪哇海源源北运，来自刺桐港与印度洋的远洋商队纷纷请求开设香料商栈。\n\n开放群岛香料港特许可将爪哇牢牢嵌入跨洋海贸网络；若转向内陆稻作固本，则能安稳国内却会让出南洋海权。"
 oe_sea.9.a: "向泉州与印度洋开放特罗乌兰—巨港香料商栈特许"
 oe_sea.9.a.tt: "花费#R 140金币#!，威望#R −5#!，成为#bold #color_yellow 海上丝路签约国#!#!，升级爪哇—巨港香料枢纽，获得[ShowModifier('oe_sea_nusantara_spice_charter')]，持续#Y 30年#!。"
 oe_sea.9.b: "收缩海外藩属、深耕爪哇腹地水利稻作与王廷正统"
 oe_sea.9.b.tt: "花费#R 80金币#!，稳定度#G +4#!，获得[ShowModifier('oe_sea_java_inland_focus')]，持续#Y 30年#!。"
 oe_sea.10.t: "湄南河商帆"
 oe_sea.10.d: "湄南河下游的阿瑜陀耶汇聚稻米、苏木、象牙与锡矿，正迅速成为中南半岛连接暹罗湾与孟加拉湾的商贸劲旅。在马六甲海峡商潮与北邻大越、中原船队交错之际，暹罗诸邦面临海陆战略抉择：\n\n是倾力打造王室御船队直接角逐南洋与印度洋转口贸易，还是立足湄南河谷农税与陆上藩邦经营中南半岛霸权？"
 oe_sea.10.a: "敕造阿瑜陀耶王室御船队，全面角逐南海与孟加拉湾海贸"
 oe_sea.10.a.tt: "花费#R 160金币#!，海军传统#G +8#!，成为#bold #color_yellow 海上丝路签约国#!#!，升级阿瑜陀耶河港，获得[ShowModifier('oe_sea_siam_royal_junks')]，持续#Y 30年#!。"
 oe_sea.10.b: "深耕湄南河谷农税与陆上藩属，稳固中南半岛陆权霸业"
 oe_sea.10.b.tt: "花费#R 100金币#!，陆军传统#G +8#!，获得[ShowModifier('oe_sea_siam_river_hegemony')]，持续#Y 30年#!。"
 oe_sea.11.t: "季风商船大汇流"
 oe_sea.11.d: "随着东端泉州刺桐、中枢马六甲与卡利卡特、西端亚丁与红海商道相继活跃，跨越两洋的季风商船开始形成前所未有的接力网。各国市舶司官员、商社代表与海峡港主齐聚议事，倡议缔结统一航期、共担护航并互惠降税的《印度洋—南洋季风联航协约》。\n\n加入联航体系可共享全链商利与前沿思潮，却须分担远洋护航重负；固守排他重关虽保眼前税源，却恐错失跨洋大势。"
 oe_sea.11.a: "签署《印度洋—南洋季风联航协约》，共担护航并推进全链通航"
 oe_sea.11.a.tt: "花费#R 240金币#!，稳定度#R −2#!，成为#bold #color_yellow 海上丝路签约国#!#!并增进沿线强权好感，刷新全链等级，获得[ShowModifier('oe_sea_monsoon_league_mod')]，持续#Y 35年#!。"
 oe_sea.11.b: "拒签跨洋降税条约，坚守本国海港排他重关利权"
 oe_sea.11.b.tt: "花费#R 100金币#!，威望#G +10#!，获得[ShowModifier('oe_sea_exclusive_harbors_mod')]，持续#Y 30年#!。"
 oe_sea.12.t: "海上丝路全链贯通"
 oe_sea.12.d: "东起泉州刺桐港、经升龙与爪哇汇于马六甲海峡，穿孟加拉湾与卡利卡特香料门户，西抵亚丁湾并直贯红海图拉真运河与君士坦丁堡——纵横东西万里的全链海上丝绸之路终于在季风鼓荡中完整闭环！\n\n香料、青花瓷、细棉布、生丝与新世界白银在此奔流交汇，航海历算与火器工坊随商船遍传欧亚。若丝路双凤线正处于运行之中，此番全链贯通亦将为其海上里程碑注入磅礴动力。"
 oe_sea.12.a: "颁行《东西大洋海上丝路永恒宪章》，共享商贸红利与跨洋思潮"
 oe_sea.12.a.tt: "花费#R 300金币#!，威望#G +20#!，完结本线并反哺#bold #color_yellow 丝路双凤海上积分#!#!（若已开启），刷新全链阶梯加成，获得[ShowModifier('oe_sea_grand_maritime_charter')]，持续#Y 45年#!。"
 oe_sea.12.b: "构筑季风大洋武装护航秩序，以重舰炮火锁定海峡海权"
 oe_sea.12.b.tt: "花费#R 260金币#!，海军传统#G +15#!，完结本线并反哺#bold #color_yellow 丝路双凤海上积分#!#!（若已开启），刷新全链阶梯加成，获得[ShowModifier('oe_sea_armed_monsoon_order')]，持续#Y 45年#!。"
 oe_sea.20.t: "南亚与东南亚海上丝路：选项生效"
 oe_sea.90.t: "南亚与东南亚海上丝路总览"
