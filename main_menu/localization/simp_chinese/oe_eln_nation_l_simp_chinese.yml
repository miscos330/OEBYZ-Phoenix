# NEW 2026-11-21 v10.5 Worker 2: Act II Foundation of Nova Elysia (oe_eln_). Generated by gen_elysia_nation.py.
 oe_elysian_greek:0 "极乐希腊人"
 oe_eln_ref_senatus_novae_elysiae:0 "极乐洲元老院体制"
 oe_eln_ref_senatus_novae_elysiae_desc:0 "在新君士坦丁堡重组承袭自古罗马与拜占庭元老院的新大陆宪政中枢，协调流亡贵族、海商行会与边疆自由民，统筹西海疆域的行政控制与移民垦殖。"
 oe_eln_ref_basileus_hesperiae:0 "赫斯珀里亚世袭巴西琉斯"
 oe_eln_ref_basileus_hesperiae_desc:0 "确立日落之海的世袭紫室皇权：以战时统帅与大西洋海权中枢凌驾门阀派系，凭借严明军纪与远洋舰队威仪巩固帝国法统。"
 oe_eln_ref_res_publica_elysia:0 "极乐洲古典共和元老院"
 oe_eln_ref_res_publica_elysia_desc:0 "仿效罗马古典元老院与执政官共治传统，将大西洋航运商团、新大陆学苑与流亡世家纳入审议体制，以海贸繁荣与学术革新兴邦。"
 oe_eln_frontier_citizenship_law:0 "极乐洲边疆公民权法"
 oe_eln_frontier_citizenship_law_desc:0 "界定极乐洲新罗马在北美东岸及阿巴拉契亚边疆的公民资格、原住民盟邦地位与跨海移民准入准则。"
 oe_eln_atlantic_admiralty_law:0 "大西洋海军总署法"
 oe_eln_atlantic_admiralty_law_desc:0 "确立新君士坦丁堡与切萨皮克船坞的海军建制，抉择远洋主力铜甲舰队、大西洋私掠截击或武装护航商路。"
 oe_eln_pol_foederati_civitas:0 "罗马联邦公民权"
 oe_eln_pol_foederati_civitas_desc:0 "循古典罗马盟邦成例，向归附的波瓦坦、南塞蒙德与波托马克部落授予以粮换防的准公民权，化解边疆敌意并共享新大陆玉米丰收。"
 oe_eln_pol_colonial_limes:0 "边疆军屯长城法"
 oe_eln_pol_colonial_limes_desc:0 "在波托马克至阿巴拉契亚隘口推行武装屯田与卫戍堡垒，强化人力征募、要塞固守与帝国同化节奏，以铁腕压制边患。"
 oe_eln_pol_open_asylum:0 "大西洋庇护港宪章"
 oe_eln_pol_open_asylum_desc:0 "向饱受旧大陆战火与教派倾轧的希腊工匠、地中海航海家与欧陆学者敞开极乐洲港门，大幅拉升跨洋移民潮、识字率与思潮传播。"
 oe_eln_pol_senatorial_patriciate:0 "流亡元老宗族法"
 oe_eln_pol_senatorial_patriciate_desc:0 "以新大陆采邑与世袭元老席位凝聚渡海贵族血脉，维护拜占庭宫廷礼仪与法统传承，稳固国内秩序与文化底蕴。"
 oe_eln_pol_copper_fleet:0 "铜甲远洋主力舰队"
 oe_eln_pol_copper_fleet_desc:0 "集中切萨皮克橡木与铁矿资源打造覆铜抗蚀重舰，铸就足以横跨大西洋、正面迎击欧洲列强无敌舰队的帝国主力。"
 oe_eln_pol_corsair_letters:0 "大西洋私掠截击特许"
 oe_eln_pol_corsair_letters_desc:0 "向百慕大、罗阿诺克与外滩水手签发帝国私掠特许状，在佛罗里达海峡与西大西洋专事封锁与袭扰敌国宝船。"
 oe_eln_pol_merchant_convoys:0 "远洋武装商船护航制"
 oe_eln_pol_merchant_convoys_desc:0 "组建由新君堡海商行会出资、帝国舰队护航的定期帆船商队，大幅扩张海上贸易航程、海贸利润与沿海制海威慑。"
 oe_eln_priv_exiled_senators:0 "流亡元老院门阀特权"
 oe_eln_priv_exiled_senators_desc:0 "承认随方舟西渡的君士坦丁堡旧贵族在极乐洲元老院中的世袭议席与新垦庄园管辖权，以稳定政局并增进外交威望，代价是分润部分皇权。"
 oe_eln_priv_maritime_guilds:0 "新君士坦丁堡海商行会"
 oe_eln_priv_maritime_guilds_desc:0 "向切萨皮克湾的希腊造船匠、远洋领航员与港口商团授予关税包税与造船专营特权，显著提升造船速度与海贸实力，但减少皇室直接税收。"
 oe_eln_priv_frontier_freeholders:0 "边疆军屯自由民特许"
 oe_eln_priv_frontier_freeholders_desc:0 "仿照古拜占庭军屯士兵（Stratiotai）传统，免除新大陆边疆垦殖自耕农的徭役并授予永业田契，换取充沛的民兵兵源、粮食产出与西进移民活力。"
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_breakwater:0 "新君堡金角防波堤工程"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_breakwater:0 "元老院拨款修筑的切萨皮克湾巨型石堤与深水灯塔，显著强化新罗马母港的海上存在、海贸收益与港口防御。"
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_pyrophoroi:0 "希腊火火器局特别军费"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_pyrophoroi:0 "元老院批准的火器局专项军费，加速卡吕波波利斯硝石精炼与重装火枪队操演，提升陆军纪律与攻城威力。"
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_grain_pact:0 "波瓦坦玉米平粜协定"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_grain_pact:0 "以铁器与织物换取波瓦坦与南塞蒙德丰产玉米的常年平粜协定，充实新大陆官仓并安抚边疆民生。"
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_copper_keel:0 "铜甲远洋舰建造法案"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_copper_keel:0 "以国会立法保障切萨皮克造船厂的橡木、生铁与覆铜配额，大幅缩短远洋重舰工期并提升舰队战力。"
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_asylum:0 "大西洋工匠学者招徕令"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_asylum:0 "元老院担保流亡欧陆工匠与学者在极乐洲享免税安家之利，推动跨洋移民潮、识字率与前沿思潮汇聚新都。"
 STATIC_MODIFIER_NAME_oe_eln_mod_parl_nostos_bonds:0 "重返圣城东征国债"
 STATIC_MODIFIER_DESC_oe_eln_mod_parl_nostos_bonds:0 "由元老院担保发行的大西洋东征战争债券，凝聚全境人力、海军士气与远海补给能力，为重返旧世界积蓄雷霆之势。"
 STATIC_MODIFIER_NAME_oe_eln_mod_polybian_balance:0 "波利比乌斯混合宪政"
 STATIC_MODIFIER_DESC_oe_eln_mod_polybian_balance:0 "新君堡元老院兼采君主统帅、贵族审议与市民行会之长，令新生的极乐洲在稳定与效率间取得精妙平衡。"
 STATIC_MODIFIER_NAME_oe_eln_mod_foederati_compact:0 "赫斯珀里亚罗马盟邦协约"
 STATIC_MODIFIER_DESC_oe_eln_mod_foederati_compact:0 "与波瓦坦、南塞蒙德及周边阿尔冈昆诸部缔结的罗马联邦契约，以互市互保换取粮草自给、林地向导与宽容治世。"
 STATIC_MODIFIER_NAME_oe_eln_mod_appalachian_limes:0 "波托马克—蓝岭铁血边疆令"
 STATIC_MODIFIER_DESC_oe_eln_mod_appalachian_limes:0 "沿切萨皮克上游与阿巴拉契亚隘口强推罗马式武装边墙与军屯，以铁血卫戍换取迅速领土扩张与同化。"
 STATIC_MODIFIER_NAME_oe_eln_mod_elysian_ethnogenesis:0 "极乐希腊新文明觉醒"
 STATIC_MODIFIER_DESC_oe_eln_mod_elysian_ethnogenesis:0 "流亡希腊血脉在大西洋西岸淬炼出兼具拜占庭法统与新大陆拓荒气魄的极乐希腊认同，文化创造力与思潮吸收力空前高涨。"
 STATIC_MODIFIER_NAME_oe_eln_mod_hellenic_orthodoxy_culture:0 "君士坦丁堡纯正希腊学统"
 STATIC_MODIFIER_DESC_oe_eln_mod_hellenic_orthodoxy_culture:0 "极乐洲元老院恪守旧都古典礼乐与纯正希腊语统，以毫不动摇的帝国法统正统性维系海外流亡者的精神灯塔。"
 STATIC_MODIFIER_NAME_oe_eln_mod_maritime_charter_ascendant:0 "海商行会主政新港"
 STATIC_MODIFIER_DESC_oe_eln_mod_maritime_charter_ascendant:0 "元老院裁定新君堡海商行会掌管大西洋关税与船坞扩张权，令商船队与港口贸易蒸蒸日上。"
 STATIC_MODIFIER_NAME_oe_eln_mod_dynatoi_land_tenure:0 "流亡门阀世袭采邑制"
 STATIC_MODIFIER_DESC_oe_eln_mod_dynatoi_land_tenure:0 "元老院确认旧贵族在新大陆河谷的世袭田产与军事领率权，稳固骑士与卫戍秩序并强化中央控制。"
 STATIC_MODIFIER_NAME_oe_eln_mod_senatorial_compromise:0 "两院关税与田赋折中案"
 STATIC_MODIFIER_DESC_oe_eln_mod_senatorial_compromise:0 "元老院以折中法案调和海商行会与流亡贵族之争，兼顾税政效率与国内和谐。"
 STATIC_MODIFIER_NAME_oe_eln_mod_bilingual_civitates:0 "波托马克双语自治城邦"
 STATIC_MODIFIER_DESC_oe_eln_mod_bilingual_civitates:0 "希腊文与阿尔冈昆语并行的联邦自治市在切萨皮克诸河畔落成，彻底消弭边疆分离主义并激发繁荣与农商交流。"
 STATIC_MODIFIER_NAME_oe_eln_mod_federated_magistrates:0 "联邦双轨长官制"
 STATIC_MODIFIER_DESC_oe_eln_mod_federated_magistrates:0 "由帝国总督与部落长老共同主持的边疆法庭有效维护和平，兼顾帝国法度与地方习惯。"
 STATIC_MODIFIER_NAME_oe_eln_mod_blue_ridge_bastions:0 "蓝岭阿巴拉契亚星堡带"
 STATIC_MODIFIER_DESC_oe_eln_mod_blue_ridge_bastions:0 "矗立在蓝岭山口的石砌星堡与烽燧线构筑起坚不可摧的西部屏障，磨砺出久经沙场的边疆常备军。"
 STATIC_MODIFIER_NAME_oe_eln_mod_frontier_watch_truce:0 "阿巴拉契亚划界停战协定"
 STATIC_MODIFIER_DESC_oe_eln_mod_frontier_watch_truce:0 "以清晰界碑与定期互市换取内陆部落十年休战，使极乐洲得以专注沿海建设与外交布局。"
 STATIC_MODIFIER_NAME_oe_eln_mod_imperial_monopoly:0 "帝国黄金烟叶与官粮专卖局"
 STATIC_MODIFIER_DESC_oe_eln_mod_imperial_monopoly:0 "由新君堡国库直辖的阿纳科斯蒂亚烟草与帕蒙基玉米专卖局源源不断充盈帝国金库，虽略损海商自由，却铸就雄厚财力。"
 STATIC_MODIFIER_NAME_oe_eln_mod_purple_caravans:0 "紫袍海商与新大陆自由商队"
 STATIC_MODIFIER_DESC_oe_eln_mod_purple_caravans:0 "开放烟叶、玉米与皮草的跨省商队与远洋自由出口，令极乐洲各大港口商贾云集、繁荣倍增。"
 STATIC_MODIFIER_NAME_oe_eln_mod_nova_elysia_ascendant:0 "极乐洲新罗马成年礼"
 STATIC_MODIFIER_DESC_oe_eln_mod_nova_elysia_ascendant:0 "历经宪政、文化、商贸与边疆四重淬炼，极乐洲已从流亡避难所蜕变为屹立大西洋西岸的完整新罗马强权。"
 STATIC_MODIFIER_NAME_oe_eln_mod_atlantic_vanguard:0 "圣火西海东望先锋"
 STATIC_MODIFIER_DESC_oe_eln_mod_atlantic_vanguard:0 "极乐洲将新大陆的丰饶物产尽数化为坚船利炮与精锐远征军，时刻准备越洋重燃君士坦丁堡的永恒圣火。"
 STATIC_MODIFIER_NAME_oe_eln_foederati_loc_mod:0 "罗马盟邦互市堡"
 STATIC_MODIFIER_DESC_oe_eln_foederati_loc_mod:0 "按《罗马盟邦法案》设立的希腊—原住民共治互市区，稳固地方粮产、人力征调与和平秩序。"
 STATIC_MODIFIER_NAME_oe_eln_limes_march_loc_mod:0 "极乐洲军屯边墙"
 STATIC_MODIFIER_DESC_oe_eln_limes_march_loc_mod:0 "沿波托马克与阿巴拉契亚修筑的罗马式屯垦要塞区，强化城防、驻军补员与人口同化速率。"
 STATIC_MODIFIER_NAME_oe_eln_cash_crop_hub_loc_mod:0 "紫袍黄金烟叶种植园枢"
 STATIC_MODIFIER_DESC_oe_eln_cash_crop_hub_loc_mod:0 "新大陆高产烟叶与玉米集散重镇，汇集商队资本并带动当地发展与繁荣。"
 STATIC_MODIFIER_NAME_oe_eln_nea_athenai_port_loc_mod:0 "新雅典哈德逊自由港"
 STATIC_MODIFIER_DESC_oe_eln_nea_athenai_port_loc_mod:0 "坐拥哈德逊河口天然深水良港的新雅典城，汇聚北方皮草商路、学苑书局与大西洋海商船队。"
 STATIC_MODIFIER_NAME_oe_eln_northern_fleet_base_loc_mod:0 "哈德逊北方舰队要塞"
 STATIC_MODIFIER_DESC_oe_eln_northern_fleet_base_loc_mod:0 "扼守哈德逊河口的装甲船坞与海防炮台，威慑北大西洋对手并守护极乐洲北翼航道。"
 STATIC_MODIFIER_NAME_oe_eln_outer_banks_beacons_loc_mod:0 "新米斯特拉斯外滩灯塔"
 STATIC_MODIFIER_DESC_oe_eln_outer_banks_beacons_loc_mod:0 "矗立在罗阿诺克沙洲的青铜镜面导航灯塔与避风锚地，保障南翼商船穿越风暴洋流并吸引定居者。"
 STATIC_MODIFIER_NAME_oe_eln_southern_patrol_loc_mod:0 "罗阿诺克南翼巡洋哨站"
 STATIC_MODIFIER_DESC_oe_eln_southern_patrol_loc_mod:0 "隐蔽于外滩水道间的快速巡洋舰与私掠船母港，随时前出拦截加勒比北上的敌对船队。"
 oe_eln_parl_chesapeake_breakwater:0 "修筑新君堡金角防波堤"
 oe_eln_parl_chesapeake_breakwater_desc:0 "由极乐洲元老院筹款修筑切萨皮克湾巨型防波堤与深水灯塔，把新君士坦丁堡打造为媲美旧金角湾的大西洋不沉母港。"
 oe_eln_parl_pyrophoroi_funding:0 "追加希腊火火枪局军费"
 oe_eln_parl_pyrophoroi_funding_desc:0 "向卡吕波波利斯皇家军械局追加硝石与黄铜专款，支援希腊火引信与新式火枪兵团的常年操练与量产。"
 oe_eln_parl_foederati_grain_pact:0 "批准波瓦坦玉米平粜协定"
 oe_eln_parl_foederati_grain_pact_desc:0 "经元老院批准与切萨皮克原住民部落续签铁器换玉米的长期平粜协定，充实公仓并安抚新大陆农垦阶层。"
 oe_eln_parl_copper_keel_act:0 "铜甲远洋舰建造法案"
 oe_eln_parl_copper_keel_act_desc:0 "统筹弗吉尼亚橡木林场与铜矿冶炼配额，资助切萨皮克船坞批量建造覆铜抗蚀的远洋主力重舰。"
 oe_eln_parl_atlantic_asylum_charter:0 "颁布欧陆流亡工匠招徕令"
 oe_eln_parl_atlantic_asylum_charter_desc:0 "向流散地中海与欧洲的希腊船匠、印书工与古典学者颁布免税安家诏书，并组织切萨皮克向周边新省的有序移民潮。"
 oe_eln_parl_nostos_war_bonds:0 "发行重返君士坦丁堡东征国债"
 oe_eln_parl_nostos_war_bonds_desc:0 "在极乐洲站稳脚跟后，由元老院发行专项东征国债以筹措远洋舰队与陆军战费，宣告西海新罗马终将重返故都。"
 oe_eln.1.title:0 "极乐洲元老院首次会议"
 oe_eln.1.desc:0 "切萨皮克湾的木石议事厅已经落成，身着紫边长袍的流亡元老、切萨皮克船东代表与新垦边疆的百夫长齐聚新君士坦丁堡。旧世界已隔万里重洋，眼前的新罗马亟待确立根本大法：是继续由世袭巴西琉斯以铁腕统摄西海，还是复兴元老院与执政官共治的古典共和，抑或效法波利比乌斯所盛赞的混合宪政？"
 oe_eln.1.a:0 "确立赫斯珀里亚世袭巴西琉斯皇权"
 oe_eln.1.a.tt:0 "元老院宪政轴大幅偏向皇权（-35），启用#Y 极乐洲元老院体制#!与#Y 赫斯珀里亚世袭巴西琉斯#!改革，并提升正统性。"
 oe_eln.1.b:0 "宣告极乐洲古典共和元老院共治"
 oe_eln.1.b.tt:0 "元老院宪政轴大幅偏向共和元老（+35），启用#Y 极乐洲元老院体制#!与#Y 极乐洲古典共和元老院#!改革，并提升稳定度与海商向心力。"
 oe_eln.1.c:0 "采纳波利比乌斯式混合宪政折中案"
 oe_eln.1.c.tt:0 "微调宪政轴（+5），启用#Y 极乐洲元老院体制#!改革，授予二十年期#Y 波利比乌斯混合宪政#!修正并增进文化传统。"
 oe_eln.2.title:0 "波瓦坦大酋长与罗马盟邦法案"
 oe_eln.2.desc:0 "随着新君士坦丁堡的炊烟沿詹姆斯河与波托马克河溯流而上，掌握上游沃土的波瓦坦部族联盟与南塞蒙德、拉帕汉诺克诸部派出使节前来试探虚实。元老院内顿时激辩四起：一派主张援引帝国古典成例颁布《罗马盟邦法案》，以铁器、盐巴与准公民权换取持久盟约与玉米粮仓；另一派则要求立即颁行《波托马克—蓝岭铁血边疆令》，筑堡屯兵直取阿巴拉契亚。"
 oe_eln.2.a:0 "颁布《罗马盟邦法案》，与切萨皮克诸部缔结联邦盟约"
 oe_eln.2.a.tt:0 "锁定第二幕原住民路线为#G 罗马盟邦（Foederati）#!：与现存切萨皮克诸部缔结十五年互不侵犯并大幅改善关系，接纳南塞蒙德与波瓦坦为宽容文化，开启后续双语城邦剧情线。"
 oe_eln.2.b:0 "颁布《铁血边疆令》，以堡垒军屯强推波托马克防线"
 oe_eln.2.b.tt:0 "锁定第二幕原住民路线为#R 铁血边疆（Limes）#!：耗资整备边防并赋予切萨皮克诸地军屯要塞修正、提升陆军传统，但激怒周边部落并引出阿巴拉契亚防线危机。"
 oe_eln.12.title:0 "极乐洲希腊人的诞生"
 oe_eln.12.desc:0 "自紫旗插上切萨皮克湾以来，整整四分之一世纪已然流逝。生于新君士坦丁堡、长于波托马克橡木林与大西洋海风中的新一代，口中虽仍吟诵荷马与拜占庭法典，却在航海术、玉米耕作、议事习惯与词汇中融汇了美洲风物。学者们高呼：一支崭新的「极乐希腊」民族已在西海呱呱坠地！"
 oe_eln.12.a:0 "拥抱大西洋新生：正式确立极乐希腊主体文化"
 oe_eln.12.a.tt:0 "国家主体文化演化为#Y 极乐希腊人#!（同时保留#Y 希腊人#!为接受文化），将美洲直辖地的希腊人口转为极乐希腊人，增进文化传统与文化影响力并获三十年复兴修正。"
 oe_eln.12.b:0 "恪守君士坦丁堡纯正希腊学统"
 oe_eln.12.b.tt:0 "保持原有主体文化，大幅提升文化传统、威望与正统性，并获二十五年#Y 君士坦丁堡纯正希腊学统#!修正。"
 oe_eln.13.title:0 "新君堡海商行会与土地门阀之争"
 oe_eln.13.desc:0 "极乐洲建国十五载后，切萨皮克湾内最尖锐的裂痕已不再来自大洋风浪，而来自元老院阶梯之下。手握造船厂与远洋货栈的新君堡海商行会要求削减关税、扩建自由港；而凭借旧都谱牒占有詹姆斯河上游肥田的流亡门阀（Dynatoi）则斥责商贾僭越礼制，坚持由土地贵族把持赋税与军役大权。"
 oe_eln.13.a:0 "支持切萨皮克海商行会扩权"
 oe_eln.13.a.tt:0 "宪政轴偏向元老海商（+25），提升市民满意度、海军传统并获二十年#Y 海商行会主政新港#!修正，但引发贵族不满。"
 oe_eln.13.b:0 "维护流亡贵族门阀的采邑法权"
 oe_eln.13.b.tt:0 "宪政轴偏向皇室门阀（-25），提升贵族满意度、稳定度并获二十年#Y 流亡门阀世袭采邑制#!修正，但引起海商怨言。"
 oe_eln.13.c:0 "以国库出面仲裁两院关税与田赋折中案"
 oe_eln.13.c.tt:0 "支付少量国库补贴调停双方，小幅安抚贵族与市民阶层，并获十五年#Y 两院关税与田赋折中案#!修正。"
 oe_eln.14.title:0 "波瓦坦—罗马双语城邦与联姻"
 oe_eln.14.desc:0 "《罗马盟邦法案》实施数年后，波托马克河与约克河沿岸的互市据点已发展为热闹的双语市镇。希腊语市政书记官与波瓦坦、南塞蒙德世袭酋长之女缔结联姻，市集上并立着刻有希腊字母与部族图腾的界碑。元老院面前摆着一份历史性议案：是否将这些盟邦彻底纳入帝国接受文化之列？"
 oe_eln.14.a:0 "颁授完全公民权，建立波瓦坦—罗马双语城邦"
 oe_eln.14.a.tt:0 "将#Y 波瓦坦人#!与#Y 南塞蒙德人#!纳入接受文化，组织一轮新大陆边疆移民潮，改善与现存切萨皮克部族关系，并获三十年#Y 波托马克双语自治城邦#!修正。"
 oe_eln.14.b:0 "维持联邦双轨自治长官制"
 oe_eln.14.b.tt:0 "将#Y 南塞蒙德人#!纳入接受文化，提升稳定度与文化影响力，并获二十五年#Y 联邦双轨长官制#!修正。"
 oe_eln.15.title:0 "阿巴拉契亚长城与易洛魁预警"
 oe_eln.15.desc:0 "铁血军屯向蓝岭山口步步推进，惊动了栖居在阿巴拉契亚山脊彼端的内陆易洛魁诸部。侦骑不断回报林间烽火与沿河巡逻的战独木舟，边疆总督紧急向新君士坦丁堡告急：必须在西翼山隘构筑永久星堡长城，或者趁全面山林游击爆发前以厚礼划界休兵。"
 oe_eln.15.a:0 "大兴土木，沿蓝岭山口构筑阿巴拉契亚星堡带"
 oe_eln.15.a.tt:0 "耗资筑堡并登记边防要塞里程碑，获二十五年#Y 蓝岭阿巴拉契亚星堡带#!修正并为边疆直辖地续期军屯要塞，但加剧与内陆易洛魁势力（IRO/STD/OSG）的边境摩擦。"
 oe_eln.15.b:0 "遣使赠礼，与内陆诸部签署阿巴拉契亚划界停战约"
 oe_eln.15.b.tt:0 "以适度赏赐与现存内陆诸部（IRO/STD/OSG）缔结十年停战并缓和关系，获十五年#Y 阿巴拉契亚划界停战协定#!修正。"
 oe_eln.16.title:0 "黄金烟叶与紫袍商队"
 oe_eln.16.desc:0 "波托马克河畔阿纳科斯蒂亚的肥沃冲积地出产色泽如金的优质烟叶，而帕蒙基河谷的玉米仓廪连年盈满。第一支悬挂双头鹰紫旗的跨省商队满载烟捆与谷袋抵达新君堡码头，引得国库财政官与自由海商争相呈递经营章程。"
 oe_eln.16.a:0 "设立帝国烟草与官粮专卖局，直充国库"
 oe_eln.16.a.tt:0 "即刻为国库带来丰厚进账，获二十年#Y 帝国黄金烟叶与官粮专卖局#!修正，但略微降低市民阶层满意度。"
 oe_eln.16.b:0 "特许紫袍商队与海商自由出口"
 oe_eln.16.b.tt:0 "提升市民阶层满意度，获二十五年#Y 紫袍海商与新大陆自由商队#!修正，并为己方持有的阿纳科斯蒂亚与帕蒙基赋予种植园商枢加成。"
 oe_eln.17.title:0 "哈德逊河口的新雅典"
 oe_eln.17.desc:0 "极乐洲的北翼舰队已将紫旗插上曼哈顿岛的天然深水良港。此地扼守哈德逊河口，背靠广袤北方皮草腹地，港湾之深阔足以停泊整支远洋主力舰队。元老院提议将此地正式命名为「新雅典」（Nea Athenai），并决定将其营建为学术商贸大都会，还是纯粹的北方海军要塞。"
 oe_eln.17.a:0 "命名为新雅典并晋升大城，营建北方自由港与学苑"
 oe_eln.17.a.tt:0 "将曼哈顿重命名为#Y 新雅典#!，若尚未达城市等级则晋升为城市，迁入一批市民工匠并赋予三十年#Y 新雅典哈德逊自由港#!加成，同时向现存门西人（MNS）致意通商。"
 oe_eln.17.b:0 "命名为新雅典，建成戒备森严的北方舰队总站"
 oe_eln.17.b.tt:0 "将曼哈顿重命名为#Y 新雅典#!，提升海军传统并为当地赋予二十五年#Y 哈德逊北方舰队要塞#!加成。"
 oe_eln.18.title:0 "新米斯特拉斯与外滩灯塔"
 oe_eln.18.desc:0 "切萨皮克湾以南，罗阿诺克海峡与外滩沙洲暗礁密布、飓风频仍，却也是通往加勒比海与南方暖流的必经咽喉。随着极乐洲哨兵控制这片滩涂，工程官提议将罗阿诺克重命名为「新米斯特拉斯」（Nea Mystras），沿沙洲修建青铜镜面导航灯塔，或将其改造成直扑南方航道的快速巡洋基地。"
 oe_eln.18.a:0 "命名为新米斯特拉斯，筑起外滩防风暴灯塔并引民南迁"
 oe_eln.18.a.tt:0 "将罗阿诺克重命名为#Y 新米斯特拉斯#!，赋予三十年#Y 新米斯特拉斯外滩灯塔#!加成，启动一轮边疆移民潮并向现存克罗阿坦部（CAA）表达善意。"
 oe_eln.18.b:0 "命名为新米斯特拉斯，开辟南翼巡洋与私掠母港"
 oe_eln.18.b.tt:0 "将罗阿诺克重命名为#Y 新米斯特拉斯#!，提升海军传统并为南翼据点赋予二十五年#Y 罗阿诺克南翼巡洋哨站#!加成。"
 oe_eln.19.title:0 "极乐洲新罗马的成年礼"
 oe_eln.19.desc:0 "从切萨皮克湾的三座简陋木栅起步，如今极乐洲已在北美东岸统辖逾十五座城镇与沃土：元老院法度森严，边疆盟约或长城各成体系，船坞龙骨林立，双头鹰紫旗迎着大西洋长风猎猎作响。流亡者的求生年代正式画上句号——一个足以令旧大陆列强为之震颤的新罗马已经成年，大西洋争霸与重返圣城的序幕即将拉开！"
 oe_eln.19.a:0 "宣告西海新罗马独立纪元：以文治武功垂范大西洋"
 oe_eln.19.a.tt:0 "点亮第二幕制度完成标志（解锁东征国债议案及后续第三、四幕大西洋争霸），大增威望、稳定度、文化传统与影响力，获三十年#Y 极乐洲新罗马成年礼#!修正并推动边疆移民。"
 oe_eln.19.b:0 "铭记东方圣火：以新大陆丰饶锻造东征先锋舰队"
 oe_eln.19.b.tt:0 "点亮第二幕制度完成标志（解锁东征国债议案及后续第三、四幕大西洋争霸），大增威望、海军与陆军传统，并获三十年#Y 圣火西海东望先锋#!修正。"
 oe_eln.20.title:0 "【审计】极乐洲立国与宪政/文化/原住民读数"
 oe_eln.20.desc:0 "#T 第二幕·极乐洲立国只读状态面板（Slot 73 oe_eln_）#!\n定居月数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_months_settled').GetValue|0]#! 个月  |  美洲直辖地数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_american_locs').GetValue|0]#!\n元老院宪政轴（-100皇权..+100共和）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_senate_axis').GetValue|0]#!\n原住民路线（0未定 / 1盟邦Foederati / 2长城Limes）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_native_path').GetValue|0]#!\n宗教路线（0未定 / 1正教 / 2罗马多神教 / 3宽容）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_faith_path').GetValue|0]#!\n极乐希腊融合完成（0/1）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_ethnogenesis_done').GetValue|0]#!  |  成年礼完成（0/1）：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_consolidation_done').GetValue|0]#!\n盟邦契约数：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_foederati_pacts').GetValue|0]#!  |  边疆堡垒批次：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_limes_forts').GetValue|0]#!  |  移民潮波次：#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_eln_migration_waves').GetValue|0]#!"
 oe_eln.20.a:0 "关闭只读面板"
 oe_eln.20.b:0 "刷新读数"
