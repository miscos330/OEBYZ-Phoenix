l_simp_chinese:
 oe_byzantine_intrigue: "拜占庭式的阴谋"
 oe_byzantine_intrigue_desc: "新君的冠冕尚未戴稳，豪族的书信便已在宫墙内外流转。\n\n处于#Y 摄政状态#!或君主统治未满#Y 5年#!，且未完成#Y 确保继承稳定#!，且存在影响力#Y 大于300#!的非政治盟友豪族时，每月有#R 25%#!概率爆发。\n结束要求：所有非盟友豪族影响力#Y 小于300#!，稳定度与正统性均#Y 大于30#!。灾难可以反复发生。\n灾难期间：宫廷支出效率#R −2%#!，维稳效率#R −20%#!。\n\n尚未肃清首都时，每月有#R 20%#!概率发生政变；存在影响力#Y 大于400#!的豪族（包括政治盟友）时，每月独立有#R 10%#!概率爆发贵族内战。"
 oe_bi_purge_capital_action: "#bold #Y 肃清首都豪族势力#!#!"
 oe_bi_purge_capital_action_desc: "清理豪族在首都的门客、密探与私兵。消耗#R 2权威#!、稳定度#R −7#!，所有非政治盟友豪族影响力#G −50#!。每次灾难只能执行一次；完成后，本次灾难不再发生政变。"
 oe_bi_bribe_supporters: "贿赂豪族支持者"
 oe_bi_bribe_supporters_desc: "选择一个非政治盟友豪族，消耗#R 2权威#!及#R 3个月内帑收入#!，目标影响力#G −25#!。须有足够内帑；全国冷却#Y 3个月#!。"
 OE_BI_CHOOSE_HOUSE: "选择非政治盟友豪族的家主"
 oe_byzantine_intrigue.1.t: "东罗马继承危机"
 oe_byzantine_intrigue.1.d: "新君的名字已被写进诏书，宫廷却还没有学会服从这个名字。权贵们借觐见试探御座，借婚约与宴席交换承诺；送往军营的信件，比送往官署的命令更为密集。\n\n有人声称要守护先帝的遗愿，有人指责朝廷被少数近臣把持。人人口称忠诚，却都在等待皇帝先露出软弱。继承的仪式已经完成，争夺帝国的斗争才刚开始。"
 oe_byzantine_intrigue.1.a: "冠冕从未如此沉重。"
 oe_byzantine_intrigue.2.t: "[SCOPE.sDynasty('oe_bi_support_family').GetName]家族的支持"
 oe_byzantine_intrigue.2.d: "当宫中传言最为纷乱之时，[SCOPE.sDynasty('oe_bi_support_family').GetName]家族公开向御座重申盟约。他们的门客传达皇帝的诏令，亲族出席朝会，往日含混的承诺终于化成了人人看得见的站队。\n\n这份支持尚不足以平息所有野心，却让观望者明白：皇帝并非独自面对整个宫廷。"
 oe_byzantine_intrigue.2.a: "帝国会记住今日的支持。"
 oe_byzantine_intrigue.3.t: "继承危机平息"
 oe_byzantine_intrigue.3.d: "私下的集会渐渐散去，军营不再等待第二道命令，朝臣也重新学会在同一份诏书下签名。那些曾将继承视作机会的豪族，终于承认继续对抗皇座的代价已经过高。\n\n宫廷仍有秘密，权贵仍有欲望；但至少此刻，帝国的命令再次出自同一个中心。"
 oe_byzantine_intrigue.3.a: "让诏令重新通行于帝国。"
 oe_byzantine_intrigue.4.t: "政变！"
 oe_byzantine_intrigue.4.d: "宫门在深夜被人从内部打开。豪族安插在首都的支持者买通了卫兵，截断了传令道路，并以皇帝的名义调开了最后一队可靠的守卫。\n\n刀刃指向了皇座、储君与摄政的居所。黎明时分，胜利者已经备好新的诏书；在仍有资格争夺冠冕的豪族之中，势力最强的一家将把自己的家主送上御座。其余家族则在这场清算中折损了大批门客与政治声势。"
 oe_byzantine_intrigue.4.a: "宫廷已经替帝国作出了选择。"
 oe_byzantine_intrigue.5.t: "内战！"
 oe_byzantine_intrigue.5.d: "秘密的盟约终于变成了公开的叛旗。贵族的庄园为军队提供粮秣，地方官署拒绝再向首都交出税册，曾经效忠皇帝的道路与城镇转眼成了叛军的据点。\n\n势力庞大的家族纷纷带着在帝国境内的亲属投向叛乱政府。如今他们所争的已不是宫廷中的席位，而是决定谁有资格号令罗马。"
 oe_byzantine_intrigue.5.a: "帝国再一次被自己的野心撕裂。"
 OE_BI_END_INFLUENCE_TT: "所有非政治盟友豪族影响力#G −100#!。"
 OE_BI_COUP_TT: "当前继承人、统治者与摄政者全部#R 去世#!。由影响力最高的合格非政治盟友豪族家主继位，并移除其家族豪族地位；家主本人是受害者的家族会被跳过。其余所有豪族影响力#G −300#!。"
 OE_BI_CIVIL_WAR_TT: "贵族内战立即爆发，叛军获得爆发前东罗马直属地点的#R 至少50%#!。所有影响力#Y 大于300#!的豪族（包括盟友）失去豪族地位，其原本居于东罗马境内的在世成员迁入叛乱国家。"
 OE_BI_REBEL_NAME: "贵族叛乱政府"
 oe_bi_capital_purged: "本次危机已肃清首都"
 oe_bi_bribe_cooldown: "贿赂豪族支持者冷却"
 oe_bi_coup_in_progress: "政变继位处理中"
 oe_bi_bribe_price: "贿赂豪族支持者的内帑花费"
 OE_BI_ALLY_AUTHORITY_GAIN: "获得#G 2权威#!（上限100）。"
