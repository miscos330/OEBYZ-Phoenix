l_simp_chinese:
 oe_theme_ordinary_supervisory_office: "普通军区督军所"
 oe_theme_ordinary_supervisory_office_desc: "驻于君士坦丁堡的军区督军所，负责与御座联络、整饬军籍并督察陆军训练。每个军区拥有自己的一级督军所，雇佣100名贵族，以纸张维持运作；所属军区类型改变后，不再匹配的督军所自动撤除。"
 oe_theme_naval_supervisory_office: "海军军区督军所"
 oe_theme_naval_supervisory_office_desc: "驻于君士坦丁堡的海军军区督军所，负责舰队军籍、海上军务与御座之间的往来。每个军区拥有自己的一级督军所，雇佣100名贵族，以纸张维持运作；所属军区类型改变后，不再匹配的督军所自动撤除。"
 oe_theme_frontier_supervisory_office: "边疆军区督军所"
 oe_theme_frontier_supervisory_office_desc: "驻于君士坦丁堡的边疆军区督军所，统筹边防文书与要塞维护。每个军区拥有自己的一级督军所，雇佣100名贵族，以纸张维持运作；所属军区类型改变后，不再匹配的督军所自动撤除。"
 oe_theme_administrative_supervisory_office: "行政军区督军所"
 oe_theme_administrative_supervisory_office_desc: "驻于君士坦丁堡的行政军区督军所，协调军区公文、道路与各地行政联系。每个军区拥有自己的一级督军所，雇佣100名贵族，以纸张维持运作；所属军区类型改变后，不再匹配的督军所自动撤除。"
 oe_pillars_settings.1.theme_supervisory_offices: "在君士坦丁堡添加军区督军所"
 OE_SETTINGS_THEME_SUPERVISORY_OFFICES_TT: "为东罗马治下的普通、海军、边疆及行政军区，在君士坦丁堡补建各自类型的#Y 军区督军所#!。每个军区各一所，基础建造时间3天；已有或正在建造的对应督军所不会重复添加。仅在点击时执行，无额外花费。"
