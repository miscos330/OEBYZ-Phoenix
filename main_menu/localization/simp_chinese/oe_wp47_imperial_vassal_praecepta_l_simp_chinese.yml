l_simp_chinese:
# Project Phoenix v36.0 WP47: 帝国批量附庸敕令、军区绝嗣回归与《军事教范》重制 (ZH)
 oe_wp47_mass_directive_cd:0 "帝国批量附庸敕令冷却"
 oe_wp47_directive_ready_tt:0 "近5年内尚未颁布过帝国批量附庸敕令。"
 oe_wp47_fleet_cd:0 "军区舰队动员冷却"
 oe_wp47_tagmata_cd:0 "中央禁军点验冷却"
 oe_wp47_roads_cd:0 "大道与名刹护持冷却"
 oe_wp47_fleet_not_active_tt:0 "军区舰队战备动员当前尚未生效。"
 oe_wp47_tagmata_not_active_tt:0 "帝国中央禁军总点验当前尚未生效。"
 oe_wp47_roads_not_active_tt:0 "帝国大道与名刹御赐护持当前尚未生效。"
 oe_wp47_act_mobilize_thematic_fleet:0 "动员帝国军区舰队"
 oe_wp47_act_mobilize_thematic_fleet_desc:0 "征召爱琴海海事军区与帝国船坞全力运转，加速桨帆战舰建造、补充水手储备并强化海军战力（持续5年）。"
 oe_wp47_act_mobilize_thematic_fleet_tt:0 "消耗75金币，立刻获得12个月水手与+5海军传统，并获得#P 军区舰队战备动员#!（+25%造船速度、+25%水手修正、+15%桨帆船战力、+10%海军士气，持续5年）。"
 oe_wp47_act_muster_tagmata:0 "点验帝国中央禁军（塔格马塔）"
 oe_wp47_act_muster_tagmata_desc:0 "集结职业铁甲重骑团与宫廷近卫军，在未来5年内显著提升重骑战力、全军训练度与行军速度。"
 oe_wp47_act_muster_tagmata_tt:0 "消耗90金币，立刻获得6个月人力与+5陆军传统，并获得#P 帝国中央禁军总点验#!（+15%重骑兵战力、+5%训练度、+8%陆军士气、+10%陆军移动速度，持续5年）。"
 oe_wp47_act_patronize_roads_monasteries:0 "护持帝国大道与名刹修院"
 oe_wp47_act_patronize_roads_monasteries_desc:0 "拨款修缮埃格纳提亚大道并御赐护持阿索斯圣山、斯图迪翁修院与迈泰奥拉圣所，全面提升控制力、繁荣度与教士阶层满意度（持续5年）。"
 oe_wp47_act_patronize_roads_monasteries_tt:0 "消耗100金币，获得+6威望、+4正统性、+8%教士满意度，若控制君士坦丁堡、塞萨洛尼基、阿索斯山与特里卡拉则提升其繁荣/控制力，并获得#P 帝国大道与名刹御赐护持#!（持续5年）。"
 oe_wp47_bias_imperial_appeasement:0 "帝国怀柔安抚诏书"
 oe_wp47_bias_loyal_strategos:0 "钦命忠贞军区将军"
 oe_wp47_bias_confirmed_succession:0 "御准地方世袭承继"
 oe_wp47_bias_escheat_seizure:0 "收归绝嗣军区直辖"
 oe_wp47_escheat.1.t:0 "军区绝嗣回归"
 oe_wp47_escheat.1.d:0 "急报传入大皇宫：属国[oe_wp47_escheat_subject.GetName]的统治者已逝，且未留下公认继承人。依古老罗马公法，凡由皇室授封的军区与普罗诺亚封邑，若其统领绝嗣，理应回归帝座处置。御前会议正静候圣裁：是将该地直接收归皇室直辖，钦命忠贞军区将军继任，还是收取丰厚进贡以御准地方贵族承袭？"
 oe_wp47_escheat.1.a:0 "收归皇室直辖领地"
 oe_wp47_escheat.1.a.tt:0 "通过外交收编将[oe_wp47_escheat_subject.GetName]并入帝国直辖行政，代价是些许稳定度、贵族满意度与其余属国轻微不安。"
 oe_wp47_escheat.1.b:0 "钦命忠贞军区将军代治"
 oe_wp47_escheat.1.b.tt:0 "保留[oe_wp47_escheat_subject.GetName]建制并派驻钦命忠贞将军，大幅降低其独立倾向并增强皇权威望。"
 oe_wp47_escheat.1.c:0 "收取贡金并御准地方贵族承袭"
 oe_wp47_escheat.1.c.tt:0 "征收120金币承袭确认贡金，安抚国内贵族并提升全体附庸与军区的效忠安心度。"
 oe_wp47_escheat.2.t:0 "钦命军区将军宣誓效忠"
 oe_wp47_escheat.2.d:0 "巡阅各地附庸与军区田籍、骑兵马厩及边塞石堡后，帝国诸军区将军联名派遣披甲信使入觐大皇宫。他们向御座呈上封蜡点验清册并庄严重申效忠誓词，同时恭谨恳请圣座明降定制谕旨：一旦边疆骤起兵火或敌军奇袭，御前文书殿的中央督理与军区统帅的临机专断之间究竟应如何清晰划定权责界限，以免军政彼此掣肘贻误战机。"
 oe_wp47_escheat.2.a:0 "将将军任免与军政严密收归御前文书殿"
 oe_wp47_escheat.2.b:0 "赐予边疆统兵临机专断之荣典"
 oe_wp47_escheat.2.c:0 "拔擢忠勇边将入京直隶御前参赞军机"
 oe_wp47_escheat.3.t:0 "帝国总管地方廉政稽核"
 oe_wp47_escheat.3.d:0 "自帝都国库派往各属国与军区的精干稽核官星夜返京，向御前呈上多册涂改重重、墨迹斑驳的复式账簿。卷宗铁证直指地方包税人与世家权贵勾连作弊，不仅私设免税关卡、层层截留商税，更虚报空额守军肆意侵吞军饷。若下令雷霆追赃虽能立充皇室府库并肃清积弊，但逼迫过甚亦恐令盘根错节的地方豪强心生怨怼与离心。"
 oe_wp47_escheat.3.a:0 "雷霆追缴隐匿赃款并严行皇室审计"
 oe_wp47_escheat.3.b:0 "与地方显贵妥善议和以保境安民"
 oe_wp47_escheat.3.c:0 "破格重用清廉总稽核官主持全境税制革新"
 oe_wp47_escheat.4.t:0 "军区显贵联合陈情"
 oe_wp47_escheat.4.d:0 "代表帝国诸附庸、普罗诺亚领主与边防军区的显贵代表团身着紫边礼服步入元老院，联袂向圣座恭谨陈情。众显贵言辞典雅婉转却暗含机锋，称连年征战兵役与严苛田赋清丈令地方庄园疲惫不堪、乡民流散，恳请皇帝颁赐正式书面特许诏书，酌减赋役负担并重申各省世家的古老旧俗与田产保障，以换取天下显贵持久的忠心拥戴。"
 oe_wp47_escheat.4.a:0 "严守帝国赋税总账，寸步不让"
 oe_wp47_escheat.4.b:0 "颁赐宽厚特许诏书以固其效忠之心"
 oe_wp47_escheat.4.c:0 "延揽最具声望的陈情显贵入朝参政以化离心"
 oe_wp47_escheat.5.t:0 "帝国大总账人口田赋普查"
 oe_wp47_escheat.5.d:0 "随着军区格局调整与新收领地归籍，御前文书殿奏请遣派勘丈使团分赴各省，重编全境《帝国大总账（布雷比翁）》。凡纳税户籍、皇室庄园、商埠关厘与世袭军户（斯特拉提奥泰）份地，皆依统一规制载入羊皮正册。此举虽须耗费公帑时日，一旦成册便可令帝国赋税与兵源调度精准有序、惠及一世。"
 oe_wp47_escheat.5.a:0 "全面编纂帝国大总账田赋户籍清册"
 oe_wp47_escheat.5.b:0 "优先清点世袭军户份地以速扩兵源"
 oe_wp47_escheat.5.c:0 "特任资深地籍官革新帝国财赋统计体系"
 oe_wp47_directive_imperial_taxation:0 "帝国敕令：总括财赋征调"
 oe_wp47_directive_imperial_taxation_desc:0 "向全体符合条件的附庸与军区颁布总括财赋敕令：提升附庸税收效率并增加宗主国附庸进贡收入（持续5年），代价是附庸独立倾向略微上升。自动替换既有帝国附庸敕令。"
 oe_wp47_directive_imperial_taxation_tt:0 "所有符合条件的附庸获得#P 帝国财赋征调#!（+12%税收效率、-8对宗主忠诚度、+5独立倾向），本国获得+12%附庸收入（持续5年）。"
 STATIC_MODIFIER_NAME_oe_wp47_dir_imperial_taxation:0 "帝国财赋征调"
 STATIC_MODIFIER_DESC_oe_wp47_dir_imperial_taxation:0 "帝国税务巡查官统一核查地方田赋与贡金，向宗主国库解缴更高比例财赋。"
 STATIC_MODIFIER_NAME_oe_wp47_overlord_imperial_taxation:0 "帝国财赋征调（宗主）"
 STATIC_MODIFIER_DESC_oe_wp47_overlord_imperial_taxation:0 "覆盖诸附庸与军区的统一财赋稽核为帝都国库带来更丰厚的进贡收入。"
 oe_wp47_directive_frontier_mobilization:0 "帝国敕令：全境边防总动员"
 oe_wp47_directive_frontier_mobilization_desc:0 "向全体符合条件的附庸与军区下达战时动员令：大幅提升人力、征召兵规模、征召速度与军队训练度（持续5年）。自动替换既有帝国附庸敕令。"
 oe_wp47_directive_frontier_mobilization_tt:0 "所有符合条件的附庸获得#P 边防总动员#!（+15%人力、+15%征召兵规模、+20%征召速度、+3%训练度、-4对宗主忠诚度，持续5年）。"
 STATIC_MODIFIER_NAME_oe_wp47_dir_frontier_mobilization:0 "边防总动员"
 STATIC_MODIFIER_DESC_oe_wp47_dir_frontier_mobilization:0 "各地属国与军区长官紧急点验军户、扩编征召兵并加紧操练以备帝国征伐。"
 oe_wp47_directive_faith_mission:0 "帝国敕令：正教宣化总令"
 oe_wp47_directive_faith_mission_desc:0 "向全体符合条件的附庸与军区派遣帝国宣教团：显著提升人口宗教转化速度、宣教建筑效能与教士阶层满意度（持续5年）。自动替换既有帝国附庸敕令。"
 oe_wp47_directive_faith_mission_tt:0 "所有符合条件的附庸获得#P 正教宣化总令#!（+25%人口宗教转化速度、+20%宣教建筑效能、+5%教士目标满意度，持续5年）。"
 STATIC_MODIFIER_NAME_oe_wp47_dir_faith_mission:0 "正教宣化总令"
 STATIC_MODIFIER_DESC_oe_wp47_dir_faith_mission:0 "帝国主教、宣教士与受封教区协力推行教化，加速属国境内信仰统一。"
 oe_wp47_directive_cultural_integration:0 "帝国敕令：文化融合与行政统辖"
 oe_wp47_directive_cultural_integration_desc:0 "统筹全体符合条件的附庸与军区推行帝国法制与礼乐文教：加速人口文化同化、月度控制力增长与行政辐射效率（持续5年）。自动替换既有帝国附庸敕令。"
 oe_wp47_directive_cultural_integration_tt:0 "所有符合条件的附庸获得#P 文化融合与行政统辖#!（+25%人口文化同化速度、+0.25%月度控制力、+10%控制力传播速度，持续5年）。"
 STATIC_MODIFIER_NAME_oe_wp47_dir_cultural_integration:0 "文化融合与行政统辖"
 STATIC_MODIFIER_DESC_oe_wp47_dir_cultural_integration:0 "地方官署与学塾推广帝国律令与礼俗，稳步加深属国行政控制与文化归附。"
 oe_wp47_directive_frontier_fortification:0 "帝国敕令：边塞坚壁筑城令"
 oe_wp47_directive_frontier_fortification_desc:0 "令全体符合条件的附庸与边疆军区修缮堡垒、扩充守军并坚壁清野：提升要塞防御、守军增速、守军规模与敌军损耗（持续5年）。自动替换既有帝国附庸敕令。"
 oe_wp47_directive_frontier_fortification_tt:0 "所有符合条件的附庸获得#P 边塞坚壁筑城#!（+20%要塞防御、+2%守军增长、+20%守军规模、+0.50敌军损耗，持续5年）。"
 STATIC_MODIFIER_NAME_oe_wp47_dir_frontier_fortification:0 "边塞坚壁筑城"
 STATIC_MODIFIER_DESC_oe_wp47_dir_frontier_fortification:0 "加厚城郭、修筑烽燧并充实仓廪，使诸属国与军区要塞成为难以逾越的防线。"
 oe_wp47_directive_imperial_appeasement:0 "帝国敕令：怀柔安抚总令"
 oe_wp47_directive_imperial_appeasement_desc:0 "拨付帝国金币并颁赐朝廷荣衔，全面安抚符合条件的附庸与军区：大幅降低独立倾向、提升忠诚度与好感度（持续5年）。自动替换既有帝国附庸敕令。"
 oe_wp47_directive_imperial_appeasement_tt:0 "消耗60金币与5威望。所有符合条件的附庸降低10点独立倾向，获得+25好感度与#P 帝国怀柔安抚#!（+12对宗主忠诚度、+5%税收效率）；本国获得+8附庸忠诚度与+1外交声誉（持续5年）。"
 STATIC_MODIFIER_NAME_oe_wp47_dir_imperial_appeasement:0 "帝国怀柔安抚"
 STATIC_MODIFIER_DESC_oe_wp47_dir_imperial_appeasement:0 "御赐俸禄、特许状与朝廷荣誉头衔显著增强了诸附庸与军区对帝座的向心力。"
 STATIC_MODIFIER_NAME_oe_wp47_overlord_imperial_appeasement:0 "帝国怀柔安抚（宗主）"
 STATIC_MODIFIER_DESC_oe_wp47_overlord_imperial_appeasement:0 "恩威并施的怀柔诏书稳固了帝国诸附庸与军区的效忠秩序。"
 oe_wp47_reform_tagmata_scholae:0 "帝国禁军与宫廷近卫团（塔格马塔）"
 oe_wp47_reform_tagmata_scholae_desc:0 "在宫廷近卫军统帅辖下常设由皇室直接供饷的中央常备野战团（塔格马塔），以严明军纪与皇权指挥体系统御帝国各军区。"
 oe_wp47_reform_klibanophoroi:0 "铁甲重骑兵团（克利巴诺福洛伊）"
 oe_wp47_reform_klibanophoroi_desc:0 "依尼基弗鲁斯·福卡斯《军事教范》整编钝楔形全装铁甲重骑兵，以鳞甲铁骑与轻骑掩护翼阵冲破强敌战线。"
 oe_wp47_reform_varangian_guard:0 "帝国瓦兰吉近卫军"
 oe_wp47_reform_varangian_guard_desc:0 "维系只效忠于皇帝本人的北方重斧精锐近卫军，既震慑宫廷政变、巩固皇权正统，又在野战与攻坚中充当无畏先锋。"
 oe_wp47_reform_thematic_navy:0 "基比拉奥特与帝国军区舰队制"
 oe_wp47_reform_thematic_navy_desc:0 "复兴爱琴海与南安纳托利亚海事军区并与中央皇室舰队联动，加速德罗蒙战舰建造并夺回东地中海制海权。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_reclaimed_theme:0 "收归皇领的军区直辖地"
 STATIC_MODIFIER_DESC_oe_wp47_mod_reclaimed_theme:0 "帝国财务书吏接管绝嗣军区直辖田产，充实中央皇室财源与直辖管控。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_loyal_strategos:0 "钦命忠贞军区将军"
 STATIC_MODIFIER_DESC_oe_wp47_mod_loyal_strategos:0 "由皇帝亲擢的忠贞军区将军执掌防务与政务，竭力维系对帝座的效忠。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_overlord_strategos_patronage:0 "帝座钦授军区任免权"
 STATIC_MODIFIER_DESC_oe_wp47_mod_overlord_strategos_patronage:0 "皇帝果断钦命军区统帅，显著增强了中枢皇权与诸属国秩序。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_aristocratic_charter:0 "御准地方贵族承袭特许"
 STATIC_MODIFIER_DESC_oe_wp47_mod_aristocratic_charter:0 "御准地方世家承袭军区与封邑，赢得贵族与全体属国的拥戴。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_clean_audit:0 "帝国总管清廉稽核"
 STATIC_MODIFIER_DESC_oe_wp47_mod_clean_audit:0 "帝国御史与总管整肃地方贪墨，恢复公正有序的赋税解缴。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_imperial_census:0 "帝国大总账人口田赋普查"
 STATIC_MODIFIER_DESC_oe_wp47_mod_imperial_census:0 "重修各省田籍与军户清册，使帝国赋税征收与兵员动员更为精准高效。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_mobilized_thematic_fleet:0 "军区舰队战备动员"
 STATIC_MODIFIER_DESC_oe_wp47_mod_mobilized_thematic_fleet:0 "爱琴海船坞与海事军区昼夜赶工，为帝国德罗蒙舰队补足战舰、水手与战力。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_mustered_tagmata:0 "帝国中央禁军总点验"
 STATIC_MODIFIER_DESC_oe_wp47_mod_mustered_tagmata:0 "中央铁甲重骑与宫廷近卫团在皇旗指引下整装待发，士气与机动力倍增。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_patronized_roads_monasteries:0 "帝国大道与名刹御赐护持"
 STATIC_MODIFIER_DESC_oe_wp47_mod_patronized_roads_monasteries:0 "皇室拨款修缮埃格纳提亚大道并资助阿索斯山、斯图迪翁与迈泰奥拉名刹，兼顾交通控制与教民归心。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_taktika_doctrine:0 "利奥六世《战术论》兵法"
 STATIC_MODIFIER_DESC_oe_wp47_mod_taktika_doctrine:0 "帝国诸将研习诸兵种协同、严谨扎营与反奇袭方略，指挥素养显著提升。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_praecepta_manual:0 "《军事教范》野战条令"
 STATIC_MODIFIER_DESC_oe_wp47_mod_praecepta_manual:0 "依福卡斯兵书操演铁甲重骑楔阵与长矛弓箭方阵协同，攻防俱备。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_greek_fire_foundry:0 "皇家希腊火虹吸铸造坊"
 STATIC_MODIFIER_DESC_oe_wp47_mod_greek_fire_foundry:0 "皇室密坊匠师精制青铜喷火虹吸管与液态火油，令敌舰闻风丧胆。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_varangian_oath:0 "瓦兰吉重斧誓约团"
 STATIC_MODIFIER_DESC_oe_wp47_mod_varangian_oath:0 "新募北欧与罗斯精锐于皇宫福音书前起誓效忠，令禁卫军战力与威仪更盛。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_via_egnatia_repaired:0 "重修埃格纳提亚帝国大道"
 STATIC_MODIFIER_DESC_oe_wp47_mod_via_egnatia_repaired:0 "重铺石板路与沿途驿站大幅加快军团调动与马其顿—色雷斯商贸往来。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_athos_chrysobull:0 "阿索斯圣山金玺诏书"
 STATIC_MODIFIER_DESC_oe_wp47_mod_athos_chrysobull:0 "皇帝颁赐金玺诏书护持阿索斯圣山各大修院，赢得正教世界敬仰与教士拥护。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_studion_scriptorium:0 "斯图迪翁修院抄经阁"
 STATIC_MODIFIER_DESC_oe_wp47_mod_studion_scriptorium:0 "名宿抄经师精校律法典籍、兵法手稿与教父文献，润泽帝国文教与行政。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_theme_cavalry_drill:0 "安纳托利亚军区骑兵大演武"
 STATIC_MODIFIER_DESC_oe_wp47_mod_theme_cavalry_drill:0 "高原季度合练使轻骑游击与重骑突击配合默契，军区野战机动大增。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_akritai_watchtowers:0 "阿克里泰边防望楼网"
 STATIC_MODIFIER_DESC_oe_wp47_mod_akritai_watchtowers:0 "边防戍卒依托险隘望楼昼夜巡守，迟滞敌军深入并重创掠境骑兵。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_dromon_arsenal:0 "基比拉奥特德罗蒙船坞"
 STATIC_MODIFIER_DESC_oe_wp47_mod_dromon_arsenal:0 "标准化造船木场与桨匠行会显著加快战舰下水与水手征募效率。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_imperial_logothete_postal:0 "帝国驿传总管疾邮网"
 STATIC_MODIFIER_DESC_oe_wp47_mod_imperial_logothete_postal:0 "驿传总管辖下的换马驿站将朝廷诏令与军情迅捷传往帝国四方。"
 STATIC_MODIFIER_NAME_oe_wp47_mod_meteora_sanctuary:0 "迈泰奥拉悬崖圣所"
 STATIC_MODIFIER_DESC_oe_wp47_mod_meteora_sanctuary:0 "皇室布施护持色萨利绝壁修道院，庇护学者、典籍与地方安宁。"
 oe_wp47_praecepta.1.t:0 "利奥六世《战术论》新编"
 oe_wp47_praecepta.1.d:0 "御前文书殿的资深书吏遍稽古籍与边报，终于校订出皇帝利奥六世《战术论》的全新定本。案前展开的羊皮卷详述了罗马古法扎营戒律、步骑弓协同行军与反奇袭伏击方略，并针对当今攻城器械与轻骑袭扰增补新注。君士坦丁堡的宿将与文官齐聚殿前，静候皇帝决断此部兵典究竟当如何颁行全军与各军区。"
 oe_wp47_praecepta.1.a:0 "向全军各统帅颁行《战术论》定本并设兵学讲席"
 oe_wp47_praecepta.1.b:0 "优先摘编边防固守与营垒条令下发各镇"
 oe_wp47_praecepta.1.c:0 "破格拔擢宿将入宫主持军官兵法研习"
 oe_wp47_praecepta.2.t:0 "尼基弗鲁斯·福卡斯《军事教范》"
 oe_wp47_praecepta.2.d:0 "刚从东疆凯旋的宿将联名进呈承袭尼基弗鲁斯二世·福卡斯遗风的《军事教范》修订彩绘本。卷中精绘十二列钝楔形全装铁甲重骑阵型，翼侧配以弓骑护卫，背后则以重步长矛与标枪手组成空心大阵互为犄角。全面照此教范整编野战军固然耗资不菲，但诸位百战老将皆言此阵足以击碎当世任何强敌。"
 oe_wp47_praecepta.2.a:0 "拨款依福卡斯钝楔重骑教范全面整训中央野战军"
 oe_wp47_praecepta.2.b:0 "节俭国库经费，仅向军官分发简编野战条令"
 oe_wp47_praecepta.2.c:0 "召东疆重骑名将入掌军务并改良甲胄战马"
 oe_wp47_praecepta.3.t:0 "皇家希腊火虹吸铸造坊"
 oe_wp47_praecepta.3.d:0 "在金角湾皇家军械库三重铁门深处，青铜铸造名匠与立下重誓的火油秘师终于制出加厚活塞式高压虹吸喷火器，可在风浪之中将烈焰精准喷射至敌舰甲板。希腊火配方历来为帝国最高机密，违者以叛国论处；然而欲大规模列装舰队，就必须扩建秘坊、征调顶尖工匠，并在博斯普鲁斯海峡开展实火试射。"
 oe_wp47_praecepta.3.a:0 "扩建皇室秘坊并为德罗蒙舰队普遍加装虹吸管"
 oe_wp47_praecepta.3.b:0 "严守配方秘密，仅限于皇城御库小规模备储"
 oe_wp47_praecepta.3.c:0 "厚赏总铸造师并命其兼督海峡沿岸火攻炮台"
 oe_wp47_praecepta.4.t:0 "瓦兰吉重斧近卫军誓词"
 oe_wp47_praecepta.4.d:0 "三艘远航长船停泊在金角湾码头，载来一批身披锁子甲、久经战阵的北欧、英格兰与罗斯重斧老兵。他们的首领肃立于青铜大门外，恳请依帝国古例于皇宫福音书前向皇帝本人立下私人效忠重誓——其利斧唯听圣座号令，绝不介入朝堂党争，唯求御赐皇城营舍、足额白银年饷与殿前护卫之荣衔。"
 oe_wp47_praecepta.4.a:0 "准其起誓编入帝国瓦兰吉近卫军并赐皇城营舍"
 oe_wp47_praecepta.4.b:0 "将其分派各军区担任重步兵与攻坚教官"
 oe_wp47_praecepta.4.c:0 "任命老练队长出任瓦兰吉统领（阿科鲁托斯）"
 oe_wp47_praecepta.5.t:0 "重修埃格纳提亚帝国大道"
 oe_wp47_praecepta.5.d:0 "自马其顿与色雷斯巡勘归来的工程官禀报，横贯君士坦丁堡、塞萨洛尼基直抵亚得里亚海岸的古罗马埃格纳提亚大道历经数百年风雨与战乱，多处玄武岩石板碎裂、桥拱淤塞。若由皇室调集石料与国库银两彻底重修官道与沿途驿堡，虽开销甚巨，却可令帝国大军调动与巴尔干商旅通行速度倍增。"
 oe_wp47_praecepta.5.a:0 "由国库拨款彻底重修埃格纳提亚石道与驿站"
 oe_wp47_praecepta.5.b:0 "特许沿途商帮征收路税以自行集资修缮"
 oe_wp47_praecepta.5.c:0 "重修大道并同步增筑军区驻军驿堡与烽燧"
 oe_wp47_praecepta.6.t:0 "阿索斯圣山金玺诏书"
 oe_wp47_praecepta.6.d:0 "阿索斯圣山首席长老与二十座大拉夫拉修院代表乘船渡过爱琴海抵达君士坦丁堡，捧呈历经沧桑与海寇劫火的旧朝金玺诏书。他们伏阶跪奏御前，恳请皇帝重颁新诏，护持圣山古老自治特权、沿海防卫石塔与马其顿教产。此举不仅关乎帝国境内的教士与乡民敬仰，更受塞尔维亚、保加利亚乃至特拉比松整个正教世界的密切瞩目。"
 oe_wp47_praecepta.6.a:0 "加盖金玺诏书并御赐布施护持阿索斯诸修院"
 oe_wp47_praecepta.6.b:0 "确认圣山宗教自治，但保留皇室田赋核查之权"
 oe_wp47_praecepta.6.c:0 "颁诏护山并延请圣山高僧入宫襄赞礼法文教"
 oe_wp47_praecepta.7.t:0 "斯图迪翁修院抄经阁振兴"
 oe_wp47_praecepta.7.d:0 "坐落于君士坦丁堡黄金门畔的圣约翰·斯图迪翁大修院内，深谙规整小写希腊书体的抄经名宿联名上书，愿扩建古老抄经阁兼作帝国御前典籍秘库。若得朝廷专项资助，修院羊皮工坊便能系统校抄查士丁尼法典、历代兵书与对外盟约，不仅令罗马法统珍贵文献免遭战乱散佚，更可使京畿文教与帝国官署文书气象焕然一新。"
 oe_wp47_praecepta.7.a:0 "由皇室专项资助斯图迪翁抄经阁与帝国档案馆"
 oe_wp47_praecepta.7.b:0 "令修院优先抄录地方教区礼仪经典以安教民"
 oe_wp47_praecepta.7.c:0 "征召首席抄经大师入职御前文书殿整饬档册"
 oe_wp47_praecepta.8.t:0 "帝国军区骑兵大演武"
 oe_wp47_praecepta.8.d:0 "秋风猎猎，旌旗翻卷，各行省军区骑兵指挥官（图尔马赫）率三千精骑齐聚比提尼亚与色雷斯校场举行季度大演武。号角声震彻苍茫原野，轻装侦察骑兵熟练操演佯退诱敌与两翼包抄，旋即引导披甲重骑列阵突击。若皇帝亲加赏赉并确立岁练定例，必能将此校场锤炼为帝国永续之机动骑战学堂，令四方强敌闻风丧胆。"
 oe_wp47_praecepta.8.a:0 "重赏优胜骑队并确立军区年度合练旧例"
 oe_wp47_praecepta.8.b:0 "适度演练即止，以免过度耗费地方草料农时"
 oe_wp47_praecepta.8.c:0 "破格提拔演武夺魁的骑兵将领入掌野战军"
 oe_wp47_praecepta.9.t:0 "边防阿克里泰望楼网"
 oe_wp47_praecepta.9.d:0 "世代耕战于险隘关口的阿克里泰边防戍卒遣代表日夜兼程进京，向御前献上详绘边疆山口、溪谷与暗道的风霜羊皮地图。他们痛陈多座旧石望楼年久倾颓，致使敌军掠骑屡屡趁隙穿插腹地村镇。若朝廷拨付石料工匠重修烽燧望楼、配发铁甲军械，或减免边村赋役以养乡兵，便能将漫长边疆险隘铸成拖垮强敌的钢铁长壁。"
 oe_wp47_praecepta.9.a:0 "拨款加固边关石砌望楼并配发精良军械"
 oe_wp47_praecepta.9.b:0 "减免边疆村社田赋，鼓励军户乡兵自筹守御"
 oe_wp47_praecepta.9.c:0 "敕封边防宿将为总巡边使，统合全线望楼戍守"
 oe_wp47_praecepta.10.t:0 "基比拉奥特德罗蒙船坞扩建"
 oe_wp47_praecepta.10.d:0 "来自爱琴海海事军区的造船总匠与桨帆大师齐聚帝国海军署，向御前呈上标准化双层桨德罗蒙战舰精雕木模。匠师建言，若在帝国诸皇家船坞统一龙骨构件、三角帆索具与干松木储备，不仅战损舰船数日即可修复返航，新舰下水速度更可较旧制倍增，使帝国得以重夺东地中海制海霸权，有力震慑拉丁商邦舰队与东方海盗。"
 oe_wp47_praecepta.10.a:0 "拨款扩建标准化德罗蒙船坞与皇家木料库"
 oe_wp47_praecepta.10.b:0 "将富余船台泊位租予沿海商帮以充国库"
 oe_wp47_praecepta.10.c:0 "任命资深爱琴海舰队统领总督造船与水师操演"
 oe_wp47_praecepta.11.t:0 "帝国驿传总管与疾邮网"
 oe_wp47_praecepta.11.d:0 "执掌帝国驿路、疾邮与对外情报的驿传总管（德罗莫斯总管）步入元老院，向御前会议呈递一份气魄宏大的全境整顿蓝图。他提议自色雷斯经菲利波波利斯直至安纳托利亚前线，每隔二十罗马里重设换马官驿与关防稽查所，使御前诏令、边关急报与外交密蜡函件昼夜疾驰，令万里之外的行省总督与附庸君侯皆如侍立天子阶前。"
 oe_wp47_praecepta.11.a:0 "拨款扩建全境帝国官驿与换马疾邮网络"
 oe_wp47_praecepta.11.b:0 "令驿传署集中精干人手专司周边诸国外交情报"
 oe_wp47_praecepta.11.c:0 "破格起用精明书记官革新帝国密邮与驿站稽核"
 oe_wp47_praecepta.12.t:0 "迈泰奥拉悬崖修院与色萨利名刹"
 oe_wp47_praecepta.12.d:0 "在色萨利沃野拔地而起的百丈砂岩巨柱之巅，迈泰奥拉苦修僧侣仅凭绳网与悬梯凿石建起凌空修道院。每逢兵燹动荡与外敌侵扰，这些绝壁圣所便成为庇护希腊珍本古卷、地方税契清册与避难乡民的天然坚堡。如今诸院院长联袂遣使入京，恳求皇室赐予专项香火与护持诏书，以宗教教化与隘口守望共安色萨利万里民心。"
 oe_wp47_praecepta.12.a:0 "御赐迈泰奥拉悬崖修院专项香火与免税特许"
 oe_wp47_praecepta.12.b:0 "在颁赐护持诏书的同时于山下要隘增设边防哨所"
 oe_wp47_praecepta.12.c:0 "依托修院兴建色萨利官民义仓以安抚乡里百姓"
 oe_wp47_praecepta.13.t:0 "帝国野战教范大校阅"
 oe_wp47_praecepta.13.d:0 "兵制与军区教范新令颁行八月之后，中央铁甲重骑、军区弓步方阵与阿克里泰边防精锐齐聚君士坦丁堡城外广阔校场接受御前大阅。号令一响，万面旌旗齐动、空心盾阵严密如铁、铁骑分合进退有度，观礼台上的列国使节无不神色凛然、低声惊叹：昔日尼基弗鲁斯·福卡斯麾下那支战无不胜的罗马雄师，已在圣座挥斥之下重现人间。"
 oe_wp47_praecepta.13.a:0 "御赐全军银赏并将新阵法刻石永著军规"
 oe_wp47_praecepta.13.b:0 "遣派教官分赴各附庸与军区推广合练操典"
 oe_wp47_praecepta.13.c:0 "皇帝亲率重骑压阵演武以振全军士气"
 oe_wp47_praecepta.14.t:0 "博斯普鲁斯海峡火攻与舰队演习"
 oe_wp47_praecepta.14.d:0 "晨光初照波澜不惊的马尔马拉海面，新近自标准化皇家船坞下水的德罗蒙战舰列成严整新月阵缓步驶过海墙。随着海军统领挥下赤色令旗，舰艏双联青铜虹吸管骤然喷薄出炽烈希腊火柱，顷刻间便将海面锚泊的靶船化作冲天烈焰与焦灰。沿岸观演的商贾与列国使节见状无不凛然，皆知博斯普鲁斯海峡制海权仍牢牢握在罗马手中。"
 oe_wp47_praecepta.14.a:0 "趁势加派舰队巡弋爱琴海与黑海商路"
 oe_wp47_praecepta.14.b:0 "开放部分民用泊位借海威招徕四方商舶"
 oe_wp47_praecepta.14.c:0 "于大皇宫隆重宴赏水师将校与造船名匠"
 oe_wp47_praecepta.15.t:0 "帝国大道与疾邮驿站总巡阅"
 oe_wp47_praecepta.15.d:0 "埃格纳提亚大道与巴尔干帝国官驿全面修缮后的首个满季已然收官，沿途簇新的大理石里程碑在晨光下熠熠生辉。满载谷物与商货的税粮车队安然驶抵塞萨洛尼基与君士坦丁堡，再无匪患梗阻，远疆军区的密蜡急报亦较往昔提早数日直达大皇宫。各省总督纷纷具疏上奏，称沿线商税日增而朝廷政令与兵马调动皆畅通无碍。"
 oe_wp47_praecepta.15.a:0 "将新增驿路商税悉数反哺沿途重镇民生"
 oe_wp47_praecepta.15.b:0 "将大道关厘盈余悉数收归帝都国库"
