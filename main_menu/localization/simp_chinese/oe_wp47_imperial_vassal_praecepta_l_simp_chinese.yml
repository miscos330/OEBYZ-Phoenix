 oe_wp47_praecepta.16.d:0 "自色萨利迈泰奥拉绝壁、阿索斯圣山二十座大修院至京畿斯图迪翁抄经阁与皇城瓦兰吉近卫营寨，皇室数载来的持续护持已结出丰硕果实。全新誊抄的鎏金罗马法典陈列于元老院，为皇帝祈福的庄严圣咏回荡于每一座正教教区，誓死效忠的铁甲禁军拱卫御前，向整个基督教世界清晰彰显新罗马历久弥新、巍然不倒的帝国威仪。"
