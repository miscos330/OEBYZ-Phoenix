 oe_as2_cab_stratiotai_resettlement_action_progress_tooltip: "退伍军户与移民正持续提升目标行省的迁徙吸引力、同化速度与人力恢复。"
 oe_as2_cab_stratiotai_select_province: "选择一座控制度达标的行省推行军户屯田："
