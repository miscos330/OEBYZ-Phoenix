l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_as2_track_assimilation_mod: "积极公民同化国策"
 STATIC_MODIFIER_DESC_oe_as2_track_assimilation_mod: "官办书院、双语官署与统一民法持续将行省臣民融入帝国主体文化，但需承担可观的宫廷行政开销与地方摩擦。"
 STATIC_MODIFIER_NAME_oe_as2_track_foederati_mod: "联邦多元共生国策"
 STATIC_MODIFIER_DESC_oe_as2_track_foederati_mod: "帝国宪章明文保障受接纳文化的自治与礼俗，以换取忠勇兵源、繁荣工商业与边疆安宁，相应放缓文化同化并让渡部分皇权。"
 STATIC_MODIFIER_NAME_oe_as2_doctrine_cooldown_mod: "文化国策整顿期"
 STATIC_MODIFIER_DESC_oe_as2_doctrine_cooldown_mod: "中枢官署与各省总督仍在适应最新颁行的文化治理国策。"
 STATIC_MODIFIER_NAME_oe_as2_chain_cooldown_mod: "帝国文化宪章推行期"
 STATIC_MODIFIER_DESC_oe_as2_chain_cooldown_mod: "各省官吏正依旨落实最新一道帝国文化整合诏令。"
 STATIC_MODIFIER_NAME_oe_as2_ms25_senatorial_nobles_mod: "行省显贵入列元老院"
 STATIC_MODIFIER_DESC_oe_as2_ms25_senatorial_nobles_mod: "获授元老院席位的行省乡绅将地方望族与帝国中枢紧绑一处，稳步助推认同扩散，亦分润部分宫廷权柄。"
 STATIC_MODIFIER_NAME_oe_as2_ms25_urban_burghers_mod: "行省市民行会参议制"
 STATIC_MODIFIER_DESC_oe_as2_ms25_urban_burghers_mod: "市政行会与市民议事厅在行省城镇扎下罗马行政根基，提升识字与产出，需由国库拨付市政补贴。"
 STATIC_MODIFIER_NAME_oe_as2_ms25_hellenic_curriculum_mod: "严格希腊—罗马学制"
 STATIC_MODIFIER_DESC_oe_as2_ms25_hellenic_curriculum_mod: "在行省强制推行帝国文法学堂与法学书院，显著加快文化融合步伐，却引发旧贵族阶层微词。"
 STATIC_MODIFIER_NAME_oe_as2_ms50_civic_franchise_mod: "新安东尼努斯敕令"
 STATIC_MODIFIER_DESC_oe_as2_ms50_civic_franchise_mod: "向忠诚行省自由民普授帝国公民权，以轻微税赋减让换取分离主义大减与双语法庭顺畅运作。"
 STATIC_MODIFIER_NAME_oe_as2_ms50_loyal_cities_mod: "忠诚城市免税特许"
 STATIC_MODIFIER_DESC_oe_as2_ms50_loyal_cities_mod: "阶段性免税特许赢得地方市民拥戴，带动双语行省城镇工商与文教兴旺。"
 STATIC_MODIFIER_NAME_oe_as2_ms50_military_colonists_mod: "退伍军士边省授田"
 STATIC_MODIFIER_DESC_oe_as2_ms50_military_colonists_mod: "沿帝国大道安置退伍军户屯田，巩固边省控制并带动民间习俗向罗马体统靠拢。"
 STATIC_MODIFIER_NAME_oe_as2_ms75_roman_integration_mod: "普世罗马认同大宪章"
 STATIC_MODIFIER_DESC_oe_as2_ms75_roman_integration_mod: "行省法度、文教与行政已融汇贯通，缔造出绵延不绝的新罗马行省秩序。"
 STATIC_MODIFIER_NAME_oe_as2_ms75_federative_romanitas_mod: "罗马联邦行省共荣体"
 STATIC_MODIFIER_DESC_oe_as2_ms75_federative_romanitas_mod: "各行省自治议会在罗马法统之下共尊皇权，以多元包容筑就长治久安的联邦格局。"
 STATIC_MODIFIER_NAME_oe_as2_ms75_frontier_dividend_mod: "行省重建红利"
 STATIC_MODIFIER_DESC_oe_as2_ms75_frontier_dividend_mod: "将整合结余经费转投大道、粮仓与边疆垦殖，推动新附行省生计繁荣。"
 STATIC_MODIFIER_NAME_oe_as2_romanization_extension_mod: "拨款续行罗马认同计划"
 STATIC_MODIFIER_DESC_oe_as2_romanization_extension_mod: "帝国专款持续滋养行省书院、官道与文化认同运动，维系边疆长期整合势头。"
 STATIC_MODIFIER_NAME_oe_as2_frontier_persia_synthesis_mod: "塞琉古—美索不达米亚边疆融合"
 STATIC_MODIFIER_DESC_oe_as2_frontier_persia_synthesis_mod: "两河与扎格罗斯沿线的希波双语官署将罗马民法与美索不达米亚、波斯古统融为一炉，商贸与治化并行不悖。"
 STATIC_MODIFIER_NAME_oe_as2_frontier_pontic_synthesis_mod: "高加索与黑海草原融合宪章"
 STATIC_MODIFIER_DESC_oe_as2_frontier_pontic_synthesis_mod: "黑海商港、高加索山地诸侯与草原戍军被纳入统一的帝国边防与法度体系。"
 STATIC_MODIFIER_NAME_oe_as2_consolidation_truce_mod: "帝国文化休整与抚绥期"
 STATIC_MODIFIER_DESC_oe_as2_consolidation_truce_mod: "暂缓强推文化整合，让行省百姓休养生息，缓和地方摩擦并充实国库。"
 STATIC_MODIFIER_NAME_oe_as2_frontier_homestead_loc_mod: "帝国边疆垦殖屯庄"
 STATIC_MODIFIER_DESC_oe_as2_frontier_homestead_loc_mod: "官府颁授田契、籽种与农具，使荒僻边地迅速化为安居乐业的忠顺村镇。"
 STATIC_MODIFIER_NAME_oe_as2_chi_gaituguiliu_mod: "改土归流直辖郡县"
 STATIC_MODIFIER_DESC_oe_as2_chi_gaituguiliu_mod: "废除世袭土司、改派朝廷流官设府置县，将赋役籍册与礼法教化直贯西南边陲。"
 STATIC_MODIFIER_NAME_oe_as2_chi_tusi_mod: "羁縻土司世袭敕书"
 STATIC_MODIFIER_DESC_oe_as2_chi_tusi_mod: "依俗册封边疆土司世袭其职，以低廉治理成本换取山地安靖与土兵效命。"
 STATIC_MODIFIER_NAME_oe_as2_chi_dual_tusi_mod: "流土并治边政折衷"
 STATIC_MODIFIER_DESC_oe_as2_chi_dual_tusi_mod: "于边郡推行流官督理与土官协办并行之制，循序渐进推行王化。"
 STATIC_MODIFIER_NAME_oe_as2_chi_keju_academies_mod: "科举解额与边省书院"
 STATIC_MODIFIER_DESC_oe_as2_chi_keju_academies_mod: "增设边省科举解额并广建官学书院，以文教功名吸纳四方士子归心朝廷。"
 STATIC_MODIFIER_NAME_oe_as2_chi_multilingual_classics_mod: "四夷馆与多语典籍译局"
 STATIC_MODIFIER_DESC_oe_as2_chi_multilingual_classics_mod: "刊印汉、蒙、满、藏与诸边语对照律典，促进多族群士绅共承天朝文脉。"
 STATIC_MODIFIER_NAME_oe_as2_chi_huguang_resettlement_mod: "湖广填四川移民实边诏"
 STATIC_MODIFIER_DESC_oe_as2_chi_huguang_resettlement_mod: "以豁免垦荒田赋与沿途官仓赈济之策，引导腹地富余农家迁徙实边、垦辟沃土。"
 STATIC_MODIFIER_NAME_oe_as2_chi_tuntian_mod: "边陲卫所屯田制"
 STATIC_MODIFIER_DESC_oe_as2_chi_tuntian_mod: "设卫所军户于边关要道且耕且守，既固国防又将中原农耕礼俗播于塞外。"
 STATIC_MODIFIER_NAME_oe_as2_chi_merchant_colonists_mod: "商帮会馆拓边特许"
 STATIC_MODIFIER_DESC_oe_as2_chi_merchant_colonists_mod: "允准盐茶商帮兴建边镇会馆与商路，以民力带动边地市集与人口汇聚。"
 STATIC_MODIFIER_NAME_oe_as2_tur_millet_mod: "帝国米勒特自治宪章"
 STATIC_MODIFIER_DESC_oe_as2_tur_millet_mod: "各宗教社群在苏丹庇护下保留民法与礼仪自治，以稳固税源与行省安宁取代强行同化。"
 STATIC_MODIFIER_NAME_oe_as2_tur_centralization_mod: "卡迪法庭集权整饬"
 STATIC_MODIFIER_DESC_oe_as2_tur_centralization_mod: "强化帝国卡迪司法巡察与中央文书体统，直接将苏丹王法贯通诸省城邑。"
 STATIC_MODIFIER_NAME_oe_as2_tur_kanun_mod: "帝国卡农法典折衷制"
 STATIC_MODIFIER_DESC_oe_as2_tur_kanun_mod: "以务实的帝国卡农成文法调和地方旧俗与中枢税政，兼顾稳定与控制。"
 STATIC_MODIFIER_NAME_oe_as2_tur_devshirme_mod: "恩德伦宫廷学院与德夫希尔梅制"
 STATIC_MODIFIER_DESC_oe_as2_tur_devshirme_mod: "精选行省俊彦入宫廷学院习文练武，锻造只效忠苏丹的精锐常备军与职业官僚骨干。"
 STATIC_MODIFIER_NAME_oe_as2_tur_timariot_mod: "行省蒂马尔与西帕希采邑"
 STATIC_MODIFIER_DESC_oe_as2_tur_timariot_mod: "广授行省蒂马尔军功采邑，借地方骑兵领主维系乡野秩序并充实骑军战力。"
 STATIC_MODIFIER_NAME_oe_as2_tur_volunteer_corps_mod: "募兵制帝国常备军团"
 STATIC_MODIFIER_DESC_oe_as2_tur_volunteer_corps_mod: "以高饷募兵替代强制征集，显著缓解行省怨怼、提振军心，但加重国库支出。"
 STATIC_MODIFIER_NAME_oe_as2_tur_kayser_synthesis_mod: "鲁姆苏丹多元融合盛世"
 STATIC_MODIFIER_DESC_oe_as2_tur_kayser_synthesis_mod: "融汇伊斯兰法统与罗马帝国治术，使崇高门庭成为横跨欧亚的多元文明交汇之都。"
 STATIC_MODIFIER_NAME_oe_as2_tur_gazi_assim_mod: "加齐核心教化与同化"
 STATIC_MODIFIER_DESC_oe_as2_tur_gazi_assim_mod: "依托宗教瓦克夫基金与城市兴建，持续强化帝国核心文化与信仰凝聚力。"
 STATIC_MODIFIER_NAME_oe_as2_tur_med_guilds_mod: "地中海商栈与行会特区"
 STATIC_MODIFIER_DESC_oe_as2_tur_med_guilds_mod: "受特许保护的港口商栈与手工业行会广纳百工，汇聚东地中海与巴尔干商贸财富。"
 STATIC_MODIFIER_NAME_oe_as2_rus_cossack_hosts_mod: "自治哥萨克边疆军团"
 STATIC_MODIFIER_DESC_oe_as2_rus_cossack_hosts_mod: "获授免税特权的哥萨克军团驻垦顿河与草原水岸，既捍卫南疆又为农垦拓荒开路。"
 STATIC_MODIFIER_NAME_oe_as2_rus_crown_garrisons_mod: "沙皇直属边防射击军"
 STATIC_MODIFIER_DESC_oe_as2_rus_crown_garrisons_mod: "由中枢直派总督与射击军驻守新拓水陆要冲，稳步夯实皇权与行政控制。"
 STATIC_MODIFIER_NAME_oe_as2_rus_abatis_settlers_mod: "鹿砦防线农垦定居"
 STATIC_MODIFIER_DESC_oe_as2_rus_abatis_settlers_mod: "绵延数百里的鹿砦防线护卫黑土垦荒村落，带动边疆人口繁衍与农产丰收。"
 STATIC_MODIFIER_NAME_oe_as2_rus_yasak_treaties_mod: "西伯利亚牙萨克毛皮协约"
 STATIC_MODIFIER_DESC_oe_as2_rus_yasak_treaties_mod: "以公允可控的毛皮贡赋协约换取乌拉尔与西伯利亚诸部归附，并充实帝国皮毛贸易。"
 STATIC_MODIFIER_NAME_oe_as2_rus_siberian_missions_mod: "西伯利亚河谷传教与木寨拓殖"
 STATIC_MODIFIER_DESC_oe_as2_rus_siberian_missions_mod: "沿河兴建修道院与木寨据点，稳步推进北亚水系定居与文教融合。"
 STATIC_MODIFIER_NAME_oe_as2_rus_stroganov_charter_mod: "斯特罗加诺夫拓殖特许状"
 STATIC_MODIFIER_DESC_oe_as2_rus_stroganov_charter_mod: "特许大商族于乌拉尔兴办盐场、铁冶与河运商队，以民间资本开发东方边疆。"
 STATIC_MODIFIER_NAME_oe_as2_rus_service_assim_mod: "服役贵族与全罗斯教化诏"
 STATIC_MODIFIER_DESC_oe_as2_rus_service_assim_mod: "以官秩与服役爵位将各省贵族纳入统一的俄语官署文书与帝国法度。"
 STATIC_MODIFIER_NAME_oe_as2_rus_coopted_elites_mod: "多元帝国贵族吸纳制"
 STATIC_MODIFIER_DESC_oe_as2_rus_coopted_elites_mod: "吸纳草原穆尔扎与边省领主进入帝国贵族体系，以封地礼遇换取长久效忠。"
 STATIC_MODIFIER_NAME_oe_as2_rus_heartland_reform_mod: "腹心律典与农政整顿"
 STATIC_MODIFIER_DESC_oe_as2_rus_heartland_reform_mod: "整饬腹心诸省司法与田亩清丈，夯实帝国核心财政与治理根基。"
 STATIC_MODIFIER_NAME_oe_as2_per_chancery_mod: "波斯化宫廷迪万与经学院网"
 STATIC_MODIFIER_DESC_oe_as2_per_chancery_mod: "典雅的波斯文官署文书、宫廷建筑与经学院体系将高雅文脉远播伊兰与印度次大陆。"
 STATIC_MODIFIER_NAME_oe_as2_per_multilingual_court_mod: "多语宫廷文苑与译经院"
 STATIC_MODIFIER_DESC_oe_as2_per_multilingual_court_mod: "赞助梵语、突厥语、阿拉伯语与波斯语典籍互译，以礼乐文教联络多族群菁英。"
 STATIC_MODIFIER_NAME_oe_as2_per_waqf_guilds_mod: "城市瓦克夫与文书行会资助"
 STATIC_MODIFIER_DESC_oe_as2_per_waqf_guilds_mod: "资助城市宗教公益基金与巴扎行会，兴盛百工书画并稳固城镇秩序。"
 STATIC_MODIFIER_NAME_oe_as2_per_sulh_mod: "苏勒胡·库勒普世宽容国策"
 STATIC_MODIFIER_DESC_oe_as2_per_sulh_mod: "奉行普世宽容、与万教万民共荣之策，令多宗教大帝国长治久安、生产兴旺，唯引来保守教士阶层非议。"
 STATIC_MODIFIER_NAME_oe_as2_per_orthoprax_mod: "正统教法护持与文化统一"
 STATIC_MODIFIER_DESC_oe_as2_per_orthoprax_mod: "依托官府扶植的法学家与宣教网络，强化正统教义权威与主体文化整合。"
 STATIC_MODIFIER_NAME_oe_as2_per_ibadat_mod: "伊巴达特哈纳跨派学议"
 STATIC_MODIFIER_DESC_oe_as2_per_ibadat_mod: "于御前定期召开诸派学者、律法师与天文家辩论盛会，启迪学术并缓和教派隔阂。"
 STATIC_MODIFIER_NAME_oe_as2_per_mansab_compact_mod: "奇兹尔巴什与柴明达尔地方契约"
 STATIC_MODIFIER_DESC_oe_as2_per_mansab_compact_mod: "将部落首领与地方领主纳入品级制帝国官爵体系，化割据隐患为忠勇精骑与安靖边省。"
 STATIC_MODIFIER_NAME_oe_as2_per_ghulam_admin_mod: "古拉姆直辖领与常薪官僚"
 STATIC_MODIFIER_DESC_oe_as2_per_ghulam_admin_mod: "以朝廷常薪文官与古拉姆亲信取代世袭包税领主，大幅提升税政控制与行政同化力。"
 STATIC_MODIFIER_NAME_oe_as2_per_caravanserai_mod: "皇家商队驿站与丝路行会网"
 STATIC_MODIFIER_DESC_oe_as2_per_caravanserai_mod: "沿丝路广筑石砌商队驿站并护持商帮，将伊斯法罕至德里诸城织为兴盛商贸网络。"
 AUTO_MODIFIER_NAME_oe_as2_auto_track_a_civic_corridor: "帝国公民同化走廊"
 AUTO_MODIFIER_DESC_oe_as2_auto_track_a_civic_corridor: "在积极公民同化国策下，贯通的官道、稳固的地方控制与书院官署共同加速行省文化整合。"
 AUTO_MODIFIER_NAME_oe_as2_auto_track_b_foederati_metropolis: "联邦多元共生都会"
 AUTO_MODIFIER_DESC_oe_as2_auto_track_b_foederati_metropolis: "受联邦多元宪章保护的受接纳文化城市工商业兴旺，为帝国贡献更充沛的产出、商力与兵源。"
 AUTO_MODIFIER_NAME_oe_as2_auto_foederati_rural_harmony: "联邦乡野自治和谐"
 AUTO_MODIFIER_DESC_oe_as2_auto_foederati_rural_harmony: "受接纳文化乡里保留固有礼俗与自治，有效消弭分离主义并稳固征召兵源，相应减缓文化同化。"
 AUTO_MODIFIER_NAME_oe_as2_auto_unrest_faith_resistance: "行省文化与信仰抵触"
 AUTO_MODIFIER_DESC_oe_as2_auto_unrest_faith_resistance: "当地满意度低迷或异教社群在控制力不足时抵制强推同化，显著拖慢文化融合步伐。"
 oe_as2_cab_stratiotai_resettlement: "军户屯田与边疆迁徙"
 oe_as2_cab_stratiotai_resettlement_desc: "有秩序地引导退伍军户与移民迁入控制稳固的边疆行省，以持续宫廷行政开支换取迁徙吸引力、本地同化速度、人口增长与人力恢复。"
 oe_as2_cab_stratiotai_resettlement_action: "于[SCOPE.sProvince('target').GetNameWithNoTooltip]推行军户屯田"
 oe_as2_cab_stratiotai_resettlement_active: "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行军户屯田"
