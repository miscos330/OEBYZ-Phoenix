 oe_as2_cab_minority_conciliation: "边省少数族群怀柔安抚"
 oe_as2_cab_minority_conciliation_desc: "派遣帝国使节与非主体文化行省订立怀柔协约，以放缓同化和少量行政费为代价，显著降低分离主义与动乱并提升当地产出。"
 oe_as2_cab_minority_conciliation_action: "怀柔安抚[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_as2_cab_minority_conciliation_active: "正在怀柔安抚[SCOPE.sProvince('target').GetNameWithHighlightOnly]"
