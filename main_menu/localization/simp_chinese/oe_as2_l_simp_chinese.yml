 oe_as2_boost_frontier_homesteads_tt: "至多3处低发展度自控边疆地块获得+15%繁荣度及持续15年的“帝国边疆垦殖屯庄”修正。"
 oe_as2_dec_cultural_doctrine.title: "确立帝国文化治理国策"
 oe_as2_dec_cultural_doctrine.desc: "明确帝国统御多元族群的大政方针：或是投入宫廷财力推行积极公民同化，或是颁布联邦多元共生宪章，将受接纳文化化为商贸、产出与兵源的坚实支柱。"
 oe_as2_dec_cultural_doctrine.a: "召集帝国文化国务会议"
 oe_as2_dec_extend_romanization.title: "拨款续行罗马化与东方边疆融合"
 oe_as2_dec_extend_romanization.desc: "动用国库资金与帝国威望，续行并强化罗马文化认同运动、推进三阶段整合里程碑，或向美索不达米亚、波斯、高加索与黑海草原展开边疆文化融合。"
 oe_as2_dec_extend_romanization.a: "审议帝国文化整合拨款方案"
 oe_as2_dec_china_integration.title: "颁行天朝教化与边疆治民大策"
 oe_as2_dec_china_integration.desc: "分阶段推进中原王朝的治民教化大策：统筹西南改土归流与羁縻土司、广开科举书院教化，并组织腹地移民垦荒实边。"
 oe_as2_dec_china_integration.a: "颁布下一阶段天朝教化诏书"
 oe_as2_dec_ottoman_integration.title: "颁行崇高门庭多元治民宪章"
 oe_as2_dec_ottoman_integration.desc: "依托米勒特自治宪章、德夫希尔梅精锐征募与鲁姆苏丹多元融合三步大策，锻造横跨欧亚的帝国治民平衡。"
 oe_as2_dec_ottoman_integration.a: "召开帝国迪万会议商议治民大计"
 oe_as2_dec_russia_integration.title: "颁行全罗斯边疆拓殖与教化宪章"
 oe_as2_dec_russia_integration.desc: "依次推进哥萨克边疆屯垦、西伯利亚牙萨克毛皮协约与服役贵族边省教化诏令，将草原与林海稳步织入帝国版图。"
 oe_as2_dec_russia_integration.a: "召集波雅尔议事会商议边疆拓殖"
 oe_as2_dec_persianate_integration.title: "颁行波斯化宫廷与普世宽容大策"
 oe_as2_dec_persianate_integration.desc: "通过波斯化宫廷文官圈、苏勒胡·库勒普世宽容与地方领主共生契约三段演进，令伊兰、河中与印度的多元族群共荣共治。"
 oe_as2_dec_persianate_integration.a: "召集王庭文官与硕学鸿儒共议"
 oe_as2.1.t: "帝国文化国策：公民同化或联邦共生"
 oe_as2.1.d: "随着帝国版图涵盖愈来愈多的语言、习俗与古城，朝堂之上就治民根本展开激辩。一派力主持续投入国库兴修官道、广建书院并统一民法，纵使宫廷开支攀升、地方略有摩擦，也要将各省臣民熔铸为同一帝国认同；另一派则主张确立“联邦多元共生”国策，以宪章明文保障受接纳文化，让各族工坊、商帮与兵源甘心效命朝廷，不必耗费巨资强行洗换文化。"
 oe_as2.1.a: "采行积极公民同化——拨款兴学并统一民法。"
 oe_as2.1.b: "采行联邦多元共生——护持并赋能受接纳文化。"
 oe_as2.1.c: "暂维持现状，静观各省民情。"
 oe_as2.2.t: "罗马化第一里程碑：地方士绅入籍元老院"
 oe_as2.2.d: "在推行罗马认同的诸行省中，第一阶段的文明整合已见成效。通晓双语的执政官、地方庄园主与城镇行会头人纷纷上书君士坦丁堡，请求在帝国礼制中获授正式名分。朝廷如何吸纳这批新兴行省菁英，将决定下一代罗马认同的走向。"
 oe_as2.2.a: "敕封行省乡绅望族入列元老院。"
 oe_as2.2.b: "扶持行省城镇市民与行会参议厅。"
 oe_as2.2.c: "强制推行严格的希腊—罗马文法与法学课业。"
 oe_as2.3.t: "罗马化第二里程碑：双语行省法典与帝国公民权"
 oe_as2.3.d: "行省的罗马文化认同已过半程。帝国巡回法庭如今以希腊语与地方语双语审案，各地市镇亦翘首期盼重享古罗马公民权之荣光。帝国文书院效法昔年《安东尼努斯敕令》，拟定三项方案以夯实行省向心力。"
 oe_as2.3.a: "颁布新《安东尼努斯敕令》，广授帝国公民权。"
 oe_as2.3.b: "向忠诚城市与官学颁授阶段性免税特许。"
 oe_as2.3.c: "沿行省官道向退伍军士授田屯垦。"
 oe_as2.4.t: "罗马化第三里程碑：新罗马行省大成"
 oe_as2.4.d: "历时数十载的伟大整合已臻大成。各行省的大教堂、会堂、大学与市政档案馆皆已贯通罗马的法度与文脉。四方使节齐聚帝都，准备为这一重获新生的罗马行省共同体刻下永久的宪章。"
 oe_as2.4.a: "钤印《普世罗马认同大宪章》，永固统一民法。"
 oe_as2.4.b: "确立多元共治的罗马联邦行省共荣体。"
 oe_as2.4.c: "将整合结余专款转投边疆大道与城镇重建。"
 oe_as2.5.t: "帝国文化整合续拨与东方边疆融合"
 oe_as2.5.d: "维系横跨大洲的文化向心力绝非一纸诏书可毕其功，仍须持续拨款供养学官、筑路工匠与双语法庭。文书院同时呈请：面向美索不达米亚与波斯古道（遥承塞琉古融合遗风），以及高加索山地与黑海草原，颁行因地制宜的边疆融合宪章。"
 oe_as2.5.a: "拨款续行十五年罗马化书院与官道专款。"
 oe_as2.5.b: "颁行塞琉古—美索不达米亚与波斯边疆融合宪章。"
 oe_as2.5.c: "颁行高加索与黑海草原边疆融合宪章。"
 oe_as2.5.e: "暂缓文化推进，转为休整抚绥与财政蓄力。"
 oe_as2.6.t: "改土归流与羁縻土司之争"
 oe_as2.6.d: "西南崇山峡谷之间，世袭土司历来持朝廷印信治其部众。中枢集权派奏请推行“改土归流”，改派流官设府置县、清丈田赋并广兴儒学；久历边事的老臣则忧心操之过急将激起山越叛乱，力主续行羁縻世袭之法以安边陲。"
 oe_as2.6.a: "力行改土归流，派驻朝廷流官直辖。"
 oe_as2.6.b: "重申羁縻土司世袭印信，依俗治边。"
 oe_as2.6.c: "推行流土并治，令流官与土官协理边政。"
 oe_as2.7.t: "科举教化与边省书院兴学"
 oe_as2.7.d: "礼部具奏，边省士绅屡屡恳请单列乡试解额并拨款修葺府县书院。将科举仕途向边疆敞开，足以使各地俊彦倾心朝廷文教；而扩充四夷馆与多语典籍译局，则能以更温和的礼乐之桥联络非汉族菁英。"
 oe_as2.7.a: "广建边省书院并增设科举专额。"
 oe_as2.7.b: "兴办多语典籍译局，并行汉边文教。"
 oe_as2.7.c: "维持腹地旧额，节用爱民。"
 oe_as2.8.t: "湖广填四川：移民垦荒实边"
 oe_as2.8.d: "腹地大江南北人烟稠密、地狭民稠，而历经兵燹的边疆盆地与河谷却沃野千里、荆棘丛生。地方督抚条陈大举移民实边之策：或由官府颁授田契、籽种并豁免多年田赋以招徕农家，或仿古设卫所屯田军户，借耕战一体永固边防。"
 oe_as2.8.a: "官府出资授田赈粮，大兴湖广填川式移民。"
 oe_as2.8.b: "于边郡广置卫所屯田军户。"
 oe_as2.8.c: "特许商帮会馆兴建边镇市集以聚流民。"
 oe_as2.9.t: "米勒特自治宪章与帝国集权"
 oe_as2.9.d: "在苏丹旗帜之下，希腊、斯拉夫、亚美尼亚、阿拉伯与犹太社群比邻而居，帝国迪万正权衡长治久安之道。明文确立宗教社群自治的“米勒特宪章”，能以温和礼遇换取稳固税源与行省宁谧；若强化卡迪法庭集权，则可更深地推进中枢控制与文化整合。"
 oe_as2.9.a: "颁行米勒特自治宪章，保障诸社群自治。"
 oe_as2.9.b: "强化帝国卡迪司法集权，直统诸省城邑。"
 oe_as2.9.c: "颁布帝国卡农法典，折衷王法与旧俗。"
 oe_as2.10.t: "德夫希尔梅精锐征募与卡皮库鲁制度"
 oe_as2.10.d: "大维齐尔们就常备精锐与宫廷文官的选拔制度展开争论。将德夫希尔梅征募与恩德伦宫廷学院定制化，能锻造一支纪律严明、唯命苏丹是从的卡皮库鲁精兵与干吏，但也难免触动地方贵族利益并增添行省怨气。"
 oe_as2.10.a: "定制恩德伦宫廷学院与德夫希尔梅精锐征募。"
 oe_as2.10.b: "广授行省蒂马尔采邑，倚重地方西帕希骑兵。"
 oe_as2.10.c: "改行常饷志愿募兵，以安行省民心。"
 oe_as2.11.t: "鲁姆苏丹：横跨欧亚的多元融合"
 oe_as2.11.d: "自布尔萨至多瑙河畔的诗人、建筑师与律法师云集宫廷，尊奉帕迪沙为伊斯兰法统与罗马帝国治术的双重继承者。崇高门庭究竟要高举“鲁姆苏丹”的多元融合大旗、转向加齐核心文化同化，还是依托地中海商栈行会厚植富强？"
 oe_as2.11.a: "昭告天下，开创鲁姆苏丹多元融合盛世。"
 oe_as2.11.b: "高举加齐正统大旗，深化核心文化同化。"
 oe_as2.11.c: "特许地中海商栈与百工行会，广纳商旅。"
 oe_as2.12.t: "哥萨克边疆屯垦与顿河防线"
 oe_as2.12.d: "森林带以南与以东，广袤的黑土草原水草丰美却屡遭游牧袭扰。活跃于江河渡口的自由骑手哥萨克愿以自治与免税为条件为朝廷镇守边疆；中枢将领则建言改派直属射击军驻防，或大修鹿砦木墙护卫农夫南下垦荒。"
 oe_as2.12.a: "册封自治哥萨克边疆军团，驻垦草原水岸。"
 oe_as2.12.b: "派驻沙皇直属射击军与总督堡垒。"
 oe_as2.12.c: "筑就鹿砦防线，大举安置农垦定居村落。"
 oe_as2.13.t: "西伯利亚牙萨克与乌拉尔拓殖"
 oe_as2.13.d: "越过乌拉尔山脉，纵横交错的大河通向盛产紫貂与林木的辽阔北亚，其间散居着众多西伯利亚部族。西伯利亚衙门请示朝廷：是以公允的牙萨克毛皮贡赋协约怀柔诸部，还是大举兴建木寨与传教定居点，抑或特许斯特罗加诺夫式大商族拓殖开发？"
 oe_as2.13.a: "订立公允的牙萨克毛皮协约，设寨通商。"
 oe_as2.13.b: "资助河谷传教据点与斯拉夫移民拓殖。"
 oe_as2.13.c: "颁授斯特罗加诺夫商族拓殖特许状。"
 oe_as2.14.t: "服役贵族与全罗斯边省教化诏"
 oe_as2.14.d: "当帝国版图从波罗的海延伸至东方大河流域，波雅尔议事会就如何统合新附贵族展开深议。以俄语官署服役与文化归化作为晋阶铁律，可强力凝聚全罗斯认同；若将草原穆尔扎与边省男爵直接吸纳进包容性的帝国贵族名录，则能换取万里边疆的稳固效忠。"
 oe_as2.14.a: "颁布统一的服役贵族与边省教化诏书。"
 oe_as2.14.b: "吸纳草原与边省领主进入帝国贵族体系。"
 oe_as2.14.c: "优先整顿腹心律典与农政税基。"
 oe_as2.15.t: "波斯化宫廷文官圈与文脉辐射"
 oe_as2.15.d: "从撒马尔罕、伊斯法罕到德里，典雅的波斯官署文书、诗篇与经院学术久已成为欧亚中南部的帝国通用文脉。维齐尔们条陈两策：或耗资广建波斯化宫廷迪万与经学院以辐射统一高雅文化，或兼收并蓄，赞助波斯、突厥与印度诸语典籍交相辉映。"
 oe_as2.15.a: "广建波斯化宫廷迪万与经学院网络。"
 oe_as2.15.b: "赞助波斯、突厥与印度多语典籍互译。"
 oe_as2.15.c: "资助城市瓦克夫基金与巴扎文书行会。"
 oe_as2.16.t: "苏勒胡·库勒：普世宽容或正统统一"
 oe_as2.16.d: "统御横跨伊朗高原与印度次大陆的亿万多信仰臣民，考验着每一位雄主的胸襟。开明硕学力倡“苏勒胡·库勒”——与万教万民普世宽容共生，虽会招致保守教士不满，却可换来四海安宁与百业兴旺；守正法学家则坚称唯有以国力护持正统教法，方能维系帝国长远统一。"
 oe_as2.16.a: "昭告天下，奉行苏勒胡·库勒普世宽容国策。"
 oe_as2.16.b: "以国力护持正统教法，推进信仰与文化统一。"
 oe_as2.16.c: "开设伊巴达特哈纳，定期召开诸派学术辩论。"
 oe_as2.17.t: "地方领主与边省共生契约"
 oe_as2.17.d: "在王廷与万里乡里之间，矗立着执掌地方兵赋的尚武首领与世袭领主——伊兰边陲的奇兹尔巴什埃米尔，以及印度诸省的柴明达尔与拉杰普特诸侯。将之纳入品级制帝国共生契约可获雄厚骑兵与稳固效忠；若改以常薪古拉姆直辖官僚取而代之，则能大幅收拢税源与中枢控制。"
 oe_as2.17.a: "缔结品级制地方领主与边省共生契约。"
 oe_as2.17.b: "以常薪古拉姆直辖官僚取代世袭包税领主。"
 oe_as2.17.c: "沿丝路广建皇家商队驿站并护持商帮行会。"
