l_simp_chinese:
 oe_nf_succession.title: "门第待续"
 oe_nf_succession.desc: "[SCOPE.sDynasty('oe_nf_succession_family').GetName]家的印信暂存于宫中。遍查帝国及附属诸国的家谱，尚无在世族人能够承接家主之位。族中旧仆却递上一份旁支谱牒，称一位久居远乡的亲族愿携妻儿返回首都。皇帝可以承认这支血脉，续其门庭；也可以就此封存家谱，撤去这一门第的豪族名籍。"
 oe_nf_succession.a: "寻访远亲，续此门庭。"
 oe_nf_succession.a.tt: "一位信奉#Y 东正教#!的远亲携配偶与儿子来到东罗马。远亲与儿子归属该家族，远亲继任家主；保留现有豪族影响力与势力范围。"
 oe_nf_succession.b: "这一门第，到此为止。"
 oe_nf_succession.b.tt: "撤销该家族的豪族地位，并解除其控制地点上的豪族修正。豪族上限不变，空出的名额可以另行拔擢。"
 oe_nf_succession.lapsed: "此事已有新的安排。"
