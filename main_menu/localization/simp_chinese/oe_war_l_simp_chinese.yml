oe_cb_byz_vs_bul: "击碎奥赫里德皇冠"
oe_cb_byz_vs_bul_desc: "奥赫里德皇冠在保加利亚国王西美昂一世（893年至927年在位）时期制作的，用以庆祝他在894年战胜拜占庭帝国。"

oe_cb_byz_vs_ser: "塞尔维亚远征"
oe_cb_byz_vs_ser_desc: "帝国曾长期统治塞尔维亚，收复这片土地是我们古老而神圣的义务"

oe_cb_byz_vs_mam: "进军埃及"
oe_cb_byz_vs_mam_desc: "我们要亲手扭转希拉克略的悲剧，我们要亲手终结穆罕默德对我们造成的无尽苦难"
 oe_cb_byz_vs_hun: "圣斯蒂芬王冠"
 oe_cb_byz_vs_hun_desc: "多瑙河以北的王冠不能成为罗马重建秩序的屏障。帝国将以武力迫使匈牙利承认罗马的权利。"

oe_cb_byz_vs_fra: "征服法兰克后人"
oe_cb_byz_vs_fra_desc: "法兰克王国曾经只是罗马治下一个普通的附庸，不过是趁着我们的衰弱分到了几分遗产，便坐在他们可笑的城堡里洋洋自得，显然必须提醒一下他们的宗主是谁"

