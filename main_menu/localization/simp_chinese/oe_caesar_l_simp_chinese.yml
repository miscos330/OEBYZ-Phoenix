l_simp_chinese:
 oe_byz_confer_caesar: "封为凯撒"
 oe_byz_confer_caesar_desc_specific: "以皇帝之名授予凯撒尊号。可授予本国人物及六类军区属国的统治者；须成年，且至少一项能力高于65。基础消耗#R 10#!帝国权威、#R 5#!正统性。市民额外消耗#R 10#!正统性，平民额外消耗#R 30#!；市民或平民的三项能力总和低于150时，再额外消耗#R 30#!正统性。凯撒获得#G +50#!皇位继承评分，并可获加冕为共治皇帝。"
 oe_byz_confer_caesar_concept: "#bold #color_yellow 宫廷授衔#!#!"
 oe_byz_confer_caesar_act_past: "已获授凯撒尊号。"
 STATIC_MODIFIER_NAME_oe_byz_caesar_modifier: "凯撒"
 STATIC_MODIFIER_DESC_oe_byz_caesar_modifier: "凯撒之名承载着帝国的荣光与皇帝的信任。持有此尊号者在东罗马皇位继承中获得#G +50#!评分。"
 OE_HEIR_SELECTION_CAESAR: "拥有凯撒头衔"
 OE_CAESAR_LEGITIMACY_REQUIRED: "至少拥有#Y 5#!正统性。"
 OE_CAESAR_AUTHORITY_REQUIRED: "帝国柱石至少拥有#Y 10#!权威。"
 OE_CAESAR_AUTHORITY_COST: "消耗#R 10#!帝国权威。"
 OE_CAESAR_NO_CANDIDATE: "@trigger_no!须为本国人物或六类军区属国的统治者，属于王冠、贵族、市民或平民阶层，成年且至少一项能力高于65，并且尚未获封凯撒。"
 OE_CAESAR_FULL_LEGITIMACY_REQUIRED: "拥有足够正统性支付基础花费及该人物的阶层、能力附加花费。"
