l_simp_chinese:
 oe_byz_parish_hospital: "堂区医院"
 oe_byz_parish_hospital_desc: "由堂区教士照料病患、储备药物并扶助产妇，使帝国的医护惠及城镇与乡村。东罗马结束凤凰涅槃灾难并完成中央集权改革后可建造。每个地点上限1级，雇佣200名教士；本地疫病抗性+10%，人口生育率+0.1%。维护消耗纤维作物、工具、纸张、书籍、药物、水银和玻璃。"
 oe_byz_promote_births: "促进人口生育"
 oe_byz_promote_births_desc: "由诸罗格塞特统筹育儿救济、助产与家庭扶助。选择一个省份，任职期间该省份内东罗马直接拥有的可征服地点获得人口生育率+0.1%。最多同时安排三个内阁成员执行，同一省份不可重复安排；效果随内阁效率缩放。"
 oe_byz_imperial_healthcare: "帝国医疗保障"
 oe_byz_imperial_healthcare_desc: "统筹医师、药材与堂区救护，使偏远聚落亦能得到照料。选择一个大区，任职期间该大区内东罗马直接拥有的可征服地点获得疫病抗性+5%、每月繁荣度增长+0.1%、移民吸引力+0.1。最多同时安排三个内阁成员执行，同一大区不可重复安排；全部效果随内阁效率缩放。"
 oe_byz_trade_directorate: "贸易总署"
 oe_byz_trade_directorate_desc: "由专署协调关栈、航路与货物文书，使帝国商贸往来更为顺畅。任职期间国家出口效率+1%、进口效率+1%；效果随内阁效率缩放。同时只能安排一名内阁成员执行。"
 OE_BYZ_WELFARE_MAX_THREE: "执行这项行动的内阁成员少于三名。"
 oe_byz_welfare_choose_province: "选择促进生育的省份"
 oe_byz_welfare_no_province: "没有可安排的省份：须有东罗马直接拥有的可征服地点，且未安排相同任务。"
