 oe_tib_myriarchy:0 "吐蕃十三万户"
 oe_tib_myriarchy_desc:0 "臣属于萨迦或帕木竹巴吐蕃的乌思藏、康区与阿里政教万户。与吐蕃同色同名，享有高原寺院粮秣补给加成，外交容量占用极低，在推行宗本集权改制前不可随意吞并。"
