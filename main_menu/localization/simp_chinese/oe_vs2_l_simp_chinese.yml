 oe_mal_farba:0 "西非法尔巴行省"
 oe_mal_farba_desc:0 "由曼萨委任法尔巴总督或属王治理的马里行省。与马里同色同名，享有西非黄金采掘与跨撒哈拉商贸加成，外交容量占用低廉，随曼萨威权高低动态响应尼阿尼征召，须待集权改制后方可吞并。"
 LEAD_oe_mal_farba:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_mal_farba:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_mal_farba_subject_opinion:0 "尼阿尼曼萨"
 oe_mal_farba_overlord_opinion:0 "法尔巴行省"
 oe_vs2_mal_join_off_tt:0 "马里曼萨威权至少为#Y 55#!"
 oe_vs2_mal_call_off_tt:0 "马里曼萨威权至少为#Y 25#!"
 oe_vs2_mal_join_def_tt:0 "马里曼萨威权至少为#Y 25#!"
 oe_khm_mandala:0 "高棉曼陀罗藩属"
 oe_khm_mandala_desc:0 "借石砌王道与圣殿网络环卫吴哥的边疆曼陀罗藩属，如坐镇呵叻高原的披迈王城。与高棉同色同名，低外交容量且擅长山地要冲守御，在吴哥重修巴莱水利并整合呵叻前不可随意吞并。"
 LEAD_oe_khm_mandala:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_khm_mandala:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_khm_mandala_subject_opinion:0 "吴哥转轮圣王"
 oe_khm_mandala_overlord_opinion:0 "高棉曼陀罗藩属"
 oe_vs2_khm_join_off_tt:0 "高棉曼陀罗威权至少为#Y 50#!"
 oe_vs2_khm_call_off_tt:0 "高棉曼陀罗威权至少为#Y 25#!"
 oe_vs2_khm_join_def_tt:0 "高棉曼陀罗威权至少为#Y 25#!"
 oe_vs2_dec_ilk_kurultai_centralize.title:0 "召开伊利汗忽里勒台·削藩收权"
 oe_vs2_dec_ilk_kurultai_centralize.desc:0 "当伊利汗廷正统威权达到#Y 70#!以上且稳据巴格达、大不里士或戈尔甘等中枢重镇时，召开大忽里勒台收缴诸诺颜军权，颁行永久集权大典，并将尚存的伊利汗诺颜附庸改制为可正常吞并的附庸。"
 oe_vs2_dec_ilk_kurultai_centralize.a:0 "召开忽里勒台，改制收藩"
 oe_vs2_dec_tib_dzong_centralize.title:0 "推行宗本集权制·统合十三万户"
 oe_vs2_dec_tib_dzong_centralize.desc:0 "当雪域万户凝聚度达到#Y 70#!以上且拉萨、萨迦或乃东尽在掌握时，以流官宗本取代世袭万户长特权，颁行高原大一统行政改制，并将尚存的吐蕃十三万户改制为可正常吞并的附庸。"
 oe_vs2_dec_tib_dzong_centralize.a:0 "废万户设宗本，统合雪域"
 oe_vs2_dec_mal_gold_audit.title:0 "召开曼萨金矿清丈与法尔巴考核"
 oe_vs2_dec_mal_gold_audit.desc:0 "自尼阿尼王廷派遣度支专使巡核班布克金矿与尼日尔商路税册，提升马里曼萨威权#G +12#!，安抚各法尔巴行省离心倾向，并向财力困顿的属邦拨发补贴，每#Y 5#!年可行一次。"
 oe_vs2_dec_mal_gold_audit.a:0 "遣使清丈金矿与法尔巴贡赋"
 oe_vs2_dec_mal_centralize_farbas.title:0 "收归法尔巴行省·曼萨大一统改制"
 oe_vs2_dec_mal_centralize_farbas.desc:0 "当马里曼萨威权达到#Y 75#!以上且稳控尼阿尼至廷巴克图或加奥的黄金商道主轴时，颁行大一统库鲁坎富加集权宪章，永久强化王室中枢并将尚存的西非法尔巴行省改制为可正常吞并的附庸。"
 oe_vs2_dec_mal_centralize_farbas.a:0 "颁行集权宪章，收归诸行省"
 oe_vs2_dec_khm_khorat_integration.title:0 "重修吴哥巴莱水利·整合呵叻曼陀罗"
 oe_vs2_dec_khm_khorat_integration.desc:0 "当高棉曼陀罗威权达到#Y 70#!以上且吴哥与披迈王道一线尽在掌握时，全面疏浚重修吴哥巴莱蓄水巨渠，稳固帝国农耕命脉，并将呵叻高原等高棉曼陀罗藩属改制为可正常吞并的附庸。"
 oe_vs2_dec_khm_khorat_integration.a:0 "疏浚巴莱巨渠，整合呵叻北疆"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ilk_legit_high:0 "伊利汗廷威望鼎盛"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ilk_legit_high:0 "波斯文官宰相与蒙古诸诺颜皆尊奉汗廷正统号令，两河与伊朗高原诸部按期纳贡、整军待命。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ilk_legit_low:0 "伊利汗廷正统动摇"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ilk_legit_low:0 "各方汗裔争锋不息，边陲埃米尔截留商税、对汗廷征召阳奉阴违，中枢号令渐呈弛缓之势。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ilk_centralized:0 "大一统伊利汗中枢集权"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ilk_centralized:0 "大忽里勒台既定乾坤，跋扈诺颜尽数受制于中枢底万清册与流官总督，帝国政令畅达东西。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_tib_cohesion_high:0 "雪域十三万户归心"
 STATIC_MODIFIER_DESC_oe_vs2_mod_tib_cohesion_high:0 "诸大寺法王与雪域万户长协力维系高原驿道与青稞军粮，乌思藏、康区与阿里上下一心。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_tib_cohesion_low:0 "雪域万户离心动荡"
 STATIC_MODIFIER_DESC_oe_vs2_mod_tib_cohesion_low:0 "世俗大族与各教派寺主龃龉频仍，十三万户各自为政，贡赋迟滞且高原征兵维艰。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_tib_dzong_centralized:0 "吐蕃宗本集权大制"
 STATIC_MODIFIER_DESC_oe_vs2_mod_tib_dzong_centralized:0 "遍布雪域要隘的宗本流官取代了割据万户，以统一法度、驿站与仓储重塑高原一统政局。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_auth_high:0 "尼阿尼曼萨黄金威权"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_auth_high:0 "自班布克金矿至尼日尔大河湾，各地法尔巴总督谨守库鲁坎富加旧宪，金砂商税源源入库。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_auth_low:0 "尼阿尼中枢威权低落"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_auth_low:0 "王廷内耗削弱尼阿尼声威，塞内加尔与下游加奥诸行省蠢蠢欲动，渐生尾大不掉之虞。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_gold_audit:0 "曼萨金矿与行省清丈"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_gold_audit:0 "王室官秤与商队清册有效遏制私金走漏，丰厚恩赏令忠诚的法尔巴行省愈发向心。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_centralized:0 "大一统马里黄金帝国"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_centralized:0 "曼萨彻底压服外藩离心之患，以尼阿尼与尼日尔商路为骨，铸就政令畅达的西非黄金大帝国。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_khm_mandala_high:0 "吴哥转轮圣王曼陀罗鼎盛"
 STATIC_MODIFIER_DESC_oe_vs2_mod_khm_mandala_high:0 "巴莱巨渠丰沛丰收，王道石桥直通呵叻高原，洞里萨湖至披迈一线诸藩皆仰吴哥威仪。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_khm_mandala_low:0 "高棉曼陀罗水利与外藩困顿"
 STATIC_MODIFIER_DESC_oe_vs2_mod_khm_mandala_low:0 "水渠淤积与湄南、澜沧强邻环伺令吴哥中枢捉襟见肘，北疆呵叻高原诸邦渐渐观望迟疑。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_khm_centralized:0 "重兴吴哥转轮帝国集权"
 STATIC_MODIFIER_DESC_oe_vs2_mod_khm_centralized:0 "吴哥巨渠重焕生机，披迈王道贯通南北，下湄公河平原与呵叻高原重新熔铸为坚不可摧的帝国。"
 STATIC_MODIFIER_NAME_oe_vs2_mod_loc_angkor_baray_restored:0 "重修吴哥巴莱大蓄水渠"
 STATIC_MODIFIER_DESC_oe_vs2_mod_loc_angkor_baray_restored:0 "重修的石砌水闸与溢洪堤坝令吴哥通王城周边岁获三熟，粮仓丰盈、百业再兴。"
 oe_vs2.1.title:0 "伊利汗双廷并立：巴格达与戈尔甘之争"
 oe_vs2.1.desc:0 "自不赛因汗无嗣崩逝以来，旭烈兀汗裔的法统在群雄逐鹿中一分为二。巴格达的札剌亦儿廷执掌西陲十九路诺颜附庸，戈尔甘的脱合帖木儿汗廷统领东土十部埃米尔；从安纳托利亚高原到呼罗珊商埠，诸藩正屏息观望究竟哪一座王廷能够重颁伊利汗圣旨、号令波斯与两河天下。"
 oe_vs2.1.a:0 "宣示伊利汗正统，号令大不里士与伊朗诸诺颜"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev1_a:0 "伊利汗正统圣旨"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev1_a:0 "高举伊利汗正统大旗凝聚了波斯文官与草原重骑，令诸诺颜不敢轻慢中枢威仪。"
 oe_vs2.1.b:0 "重申边疆税契恩赏，怀柔诸路诺颜附庸"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev1_b:0 "伊利汗诺颜税契盟约"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev1_b:0 "宽厚的行省包税特许稳住了观望的地方埃米尔，确保两河与伊朗商道安然畅通。"
 oe_vs2.2.title:0 "锡瓦斯之变：艾莱特纳部的安纳托利亚野心"
 oe_vs2.2.desc:0 "坐镇锡瓦斯与开塞利的回鹘大将艾莱特纳手握安纳托利亚精兵与商路财源，见巴格达汗廷深陷阿塞拜疆与土库曼诸部争锋，竟擅自以己名铸币并遣使联络开罗马穆鲁克。札剌亦儿苏丹究竟要顺水推舟承认其自立以收缩战线，还是挥师西进迫使安纳托利亚诺颜重申臣礼？"
 oe_vs2.2.a:0 "承认锡瓦斯自立，收缩防线稳固两河腹地"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev2_a:0 "两河腹地整肃固本"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev2_a:0 "舍弃鞭长莫及的安纳托利亚外藩后，巴格达得以集中财力与精兵深耕美索不达米亚核心。"
 oe_vs2.2.b:0 "整军西进锡瓦斯，强令艾莱特纳纳贡称臣"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev2_b:0 "安纳托利亚诺颜威服"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev2_b:0 "幼发拉底河以西的铁骑震慑令安纳托利亚诸诺颜屏息俯首，巴格达威名远播小亚细亚。"
 oe_vs2.3.title:0 "赫拉特卡尔提德与塔巴里斯坦诸藩之向背"
 oe_vs2.3.desc:0 "在伊朗东部，戈尔甘的脱合帖木儿汗廷正艰难周旋于赫拉特卡尔提德王朝、萨卜泽瓦尔萨尔巴达尔起义与里海南岸塔巴里斯坦诸侯之间。赫拉特君主穆伊兹丁·侯赛因暗中停止宣读汗廷呼图白，宣称呼罗珊已无需成吉思汗后裔庇护——戈尔甘汗廷是退守里海还是挥师东讨？"
 oe_vs2.3.a:0 "默许赫拉特自立，退保戈尔甘与马赞达兰"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev3_a:0 "里海南岸要塞固防"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev3_a:0 "依托厄尔布尔士山隘收缩布防，使戈尔甘与马赞达兰富庶农区免受呼罗珊混战波及。"
 oe_vs2.3.b:0 "整肃呼罗珊与里海诸藩，重申脱合帖木儿汗令"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev3_b:0 "呼罗珊诺颜铁血盟约"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev3_b:0 "迅猛的草原铁骑震慑了赫拉特与里海诸侯，迫使东伊朗诸埃米尔重归戈尔甘旗帜之下。"
 oe_vs2.4.title:0 "苏丹尼耶底万重整与伊朗一统之机"
 oe_vs2.4.desc:0 "在苏丹尼耶碧蓝穹顶与大不里士繁华巴扎之间，曾侍奉合赞汗与拉施特宰相的波斯文官世家呈上一份宏大的治国蓝图：若能重整全国银币、驿道与田赋清册，汗廷便能彻底跳出军阀混战的泥淖，以正统伊朗霸主之姿收拢天下人心。"
 oe_vs2.4.a:0 "重兴波斯大底万文官制，厘定全国田赋商税"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev4_a:0 "重兴伊朗大底万官署"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev4_a:0 "精干的波斯财政书吏统一了各省赋税账册，使汗廷中枢的施政效率与财政收入焕然一新。"
 oe_vs2.4.b:0 "检阅草原诸万户铁骑，以武功重铸伊利汗霸业"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev4_b:0 "旭烈兀万户征讨大纛"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev4_b:0 "整训一新的蒙古重骑万户自阿塞拜疆与两河铁流奔涌，誓以兵锋扫平伊朗群雄。"
 oe_vs2.5.title:0 "绛曲坚赞崛起与吐蕃十三万户之争"
 oe_vs2.5.desc:0 "雅鲁藏布江谷地风云激荡，萨迦本钦治下的吐蕃十三万户久陷领地争讼与内耗。乃东帕木竹巴万户长绛曲坚赞以铁腕清廉与果决兵略折服前后藏贵族与诸大寺院，令萨迦派百年政教格局面临前所未有的历史转折。"
 oe_vs2.5.a:0 "拥立绛曲坚赞，开启帕木竹巴雪域革新"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev5_a:0 "帕木竹巴大司徒崛起"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev5_a:0 "绛曲坚赞的果决革新为吐蕃军政注入新活力，雪域各部在乃东政令下日趋齐整。"
 oe_vs2.5.b:0 "联合诸大寺护持萨迦本钦旧制，以和息争"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev5_b:0 "萨迦法王本钦护持"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev5_b:0 "丰厚寺产赏赐稳固了萨迦政教体系的传统威望，令十三万户暂息干戈、重申誓约。"
 oe_vs2.6.title:0 "1354年乃东改制与大元宣政院印信"
 oe_vs2.6.desc:0 "至1354年，乌思藏军政实权已归乃东掌握，而远在东方的元廷正深陷红巾烽火。宣政院特使携“大司徒”金印越过雪山抵藏：吐蕃究竟要接领元廷封号、以朝贡名义换取茶马商利与外交回旋，还是趁势解除宣政院羁縻、宣告雪域完全自主？"
 oe_vs2.6.a:0 "受封大司徒印信，名义奉元而实操雪域大政"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev6_a:0 "大司徒金印特许"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev6_a:0 "大司徒金印既折服了雪域保守教派，又维系了川青茶马互市畅通无阻，可谓名实兼得。"
 oe_vs2.6.b:0 "辞还宣政院印信，宣告吐蕃彻底脱离羁縻自立"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev6_b:0 "吐蕃雪域独立中兴"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev6_b:0 "挣脱域外羁縻唤醒了吐蕃赞普时代的荣耀记忆，高原将士士气大振、守隘如铁。"
 oe_vs2.7.title:0 "废万户设宗本：雪域十三宗改制"
 oe_vs2.7.desc:0 "元初所置十三万户本为分而治之的权宜旧制，经百年流变已成世袭割据渊薮。乃东与拉萨的革新派力主效法古吐蕃成宪，在要冲广筑城堡宗署、改派流官宗本坐镇，将赋税、仓储与司法尽收中枢；而康区与阿里诸部则呼吁保留世袭自治。"
 oe_vs2.7.a:0 "兴建宗堡推行流官宗本制，逐步收拢万户之权"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev7_a:0 "雪域十三宗堡行政网"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev7_a:0 "巍峨宗堡扼守河谷隘口，既遏制了地方世族私斗，又使中枢赋税与常平青稞库日渐充盈。"
 oe_vs2.7.b:0 "保留康区与阿里世袭万户特许，换取边境长宁"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev7_b:0 "康藏阿里万户联治盟约"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev7_b:0 "尊重边地万户自治传统换取了康区、古格与阿里诸部竭诚输粮助战，高原后勤稳如磐石。"
 oe_vs2.8.title:0 "《吐蕃十六法典》与高原驿站重兴"
 oe_vs2.8.desc:0 "雪域法学家摒弃外来苛律，远溯松赞干布旧章编纂成《吐蕃十六法典》，详定命价调解、商队护卫、寺院免役与高原乌拉驿站章程。此法典一旦颁行，不仅将重塑藏地文化认同，更可令十三万户与诸大寺院同奉一法、长治久安。"
 oe_vs2.8.a:0 "颁行《十六法典》并重修高原驿站商道"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev8_a:0 "吐蕃十六法典与驿道"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev8_a:0 "统一的藏地成文法与严密驿道将偏远河谷紧紧相连，雪域各地商旅不绝、民风安宁。"
 oe_vs2.8.b:0 "委任诸大寺院主持法度仲裁，以佛法化导万民"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev8_b:0 "雪域大寺法政协和"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev8_b:0 "德高望重的大寺法座代为平息部族纷争，同时广兴经院藏书，令雪域教化昌明。"
 oe_vs2.9.title:0 "曼萨·苏莱曼盛世与尼阿尼黄金国库"
 oe_vs2.9.desc:0 "继曼萨·穆萨豪奢朝觐之后，沉稳干练的曼萨·苏莱曼重整尼阿尼国库与十三法尔巴行省度支。远道而来的伊本·白图泰惊叹于西非大草原的太平盛世：自特克鲁尔、沃洛夫至廷巴克图与加奥，商旅夜不闭户，金砂与岩盐贡赋按期入京。"
 oe_vs2.9.a:0 "清丈班布克金矿贡额，礼遇廷巴克图法学家"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev9_a:0 "曼萨·苏莱曼黄金盛世"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev9_a:0 "严明度支令尼阿尼金库日盈，十三法尔巴行省在商贸繁荣与公正司法中归心向化。"
 oe_vs2.9.b:0 "扩编尼日尔沿河法尔巴骑军，威慑撒哈拉北疆"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev9_b:0 "帝国法尔巴精锐骑军"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev9_b:0 "精良的曼丁哥铁骑巡弋于塞内加尔至尼日尔河湾之间，令沙漠劫匪与不臣藩镇望风披靡。"
 oe_vs2.10.title:0 "马里·贾塔二世继位动荡与王廷内耗"
 oe_vs2.10.desc:0 "1360年曼萨·苏莱曼驾崩后，其子卡萨与侄儿马里·贾塔二世爆发激烈的王位之争。宫廷党争、挥霍国帑与金块征敛激化了王廷财政危机，外围各法尔巴行省纷纷窥伺中枢虚实——尼阿尼究竟会滑入长期动荡，还是由干练大宰相力挽狂澜？"
 oe_vs2.10.a:0 "妥协分权以息党争，容忍行省暂留部分金税"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev10_a:0 "尼阿尼继位动荡余波"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev10_a:0 "王位纷争折损了曼萨威严，边远行省乘机截留税赋，帝国进入严峻的离心考验期。"
 oe_vs2.10.b:0 "倾库力挺大宰相度支议会，强硬稳固尼阿尼王纲"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev10_b:0 "大宰相摄政整纲"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev10_b:0 "大宰相以重金稳住禁军与商团，避免帝国中枢彻底失序，为重振曼萨权威赢得喘息之机。"
 oe_vs2.11.title:0 "东西外藩离心：加奥桑海与大西洋沃洛夫之变"
 oe_vs2.11.desc:0 "趁尼阿尼王廷内耗之际，扼守尼日尔东段的加奥桑海王族与雄踞大西洋沿岸的沃洛夫联盟同时停缴金税、整备兵马。两地皆距曼丁哥腹地千里之遥：倾全国之力双线远征耗资靡费，而一旦放任自立，西非大帝国的霸权版图便将彻底改写。"
 oe_vs2.11.a:0 "鞭长莫及，听任桑海与沃洛夫自立而固守上游"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev11_a:0 "尼日尔上游固本守成"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev11_a:0 "放手鞭长莫及的加奥与沃洛夫后，马里得以将兵力与财源集中于尼阿尼与班布克金矿核心。"
 oe_vs2.11.b:0 "遣尼日尔战船与精骑东西并进，强行弹压两藩"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev11_b:0 "曼萨铁腕震慑西非"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev11_b:0 "尼日尔舟师与曼丁哥精骑雷霆出击，迫使加奥与沃洛夫重归法尔巴序列，帝国威严不坠。"
 oe_vs2.12.title:0 "曼萨中兴与库鲁坎富加黄金新宪"
 oe_vs2.12.desc:0 "历经动荡考验之后，尼阿尼宿臣援引松迪亚塔大帝所立《库鲁坎富加宪章》，邀集旺加拉金商与忠诚法尔巴共订新盟。塔加扎盐队与撒哈拉驼帮重趋廷巴克图与尼阿尼，马里帝国迎来重振西非黄金霸权的中兴契机。"
 oe_vs2.12.a:0 "重申库鲁坎富加宪章，凝聚诸法尔巴共襄中兴"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev12_a:0 "重兴库鲁坎富加宪章"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev12_a:0 "重焕生机的帝国宪章令各地法尔巴与曼丁哥氏族重归团结，曼萨中枢号令再度畅通无阻。"
 oe_vs2.12.b:0 "汇集商队关税充实王家铸币厂与桑科雷学府"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev12_b:0 "尼阿尼—廷巴克图金本位盛世"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev12_b:0 "成色十足的马里金币与星光璀璨的桑科雷学风，使帝国再度成为萨赫勒世界无可匹敌的商贸明珠。"
 oe_vs2.13.title:0 "巴莱淤塞：吴哥水利工程的百年困顿"
 oe_vs2.13.desc:0 "数百年来，吴哥王朝的繁盛赖于浩大的巴莱蓄水池、石砌溢洪道与纵横百里的自流灌溉水网。如今季风失常与年久失修令东线主干渠淤泥积塞，稻作收成隐现颓势，连带动摇吴哥在呵叻高原曼陀罗藩属心中的转轮圣王威仪。"
 oe_vs2.13.a:0 "暂缓大规模清淤，节流国帑以应王廷急需"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev13_a:0 "吴哥巴莱水渠淤积"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev13_a:0 "失修的蓄水渠网削减了洞里萨湖周边双季稻产量，也令地方领主怀疑王廷治理之力。"
 oe_vs2.13.b:0 "征发工匠民夫大修西巴莱巨渠与石闸"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev13_b:0 "吴哥巴莱巨渠疏浚复兴"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev13_b:0 "焕然一新的巴莱水网引季风清流遍灌沃野，丰沛稻粮同时充实了吴哥王城与北疆守军。"
 oe_vs2.14.title:0 "1351年湄南河风暴：阿瑜陀耶崛起逼境"
 oe_vs2.14.desc:0 "扁担山脉以西，整合罗涡与素可泰遗产的湄南河暹罗新王朝阿瑜陀耶兵锋日盛，象兵与河舟频频试探马德望及西陲要隘。战鼓声震彻呵叻古道，吴哥王廷必须抉择：是倾力武装披迈—呵叻曼陀罗屏藩西翼，还是暂让商税以换取喘息？"
 oe_vs2.14.a:0 "重兵固守扁担山隘，驰援披迈—呵叻曼陀罗"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev14_a:0 "扁担山脉要隘固防"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev14_a:0 "重修的山地关隘与忠诚的呵叻曼陀罗援军层层阻截暹罗兵锋，确保吴哥核心安如泰山。"
 oe_vs2.14.b:0 "暂让西境通关商利，以缓和湄南河战云"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev14_b:0 "务实缓兵之约"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev14_b:0 "西境通商让步暂时平息了大规模兵燹，却也让王公贵族暗叹转轮圣王之威已大不如前。"
 oe_vs2.15.title:0 "澜沧南下与披迈—占巴塞北疆格局"
 oe_vs2.15.desc:0 "北方山岭间崛起的澜沧老挝诸部正沿湄公河顺流南逼沙湾拿吉与瓦普古刹。贯通吴哥与披迈的石砌王道沿线，高棉与库伊地方领主翘首等待圣谕：王廷究竟要授予披迈高度自治以铸就忠诚缓冲，还是派驻吴哥直辖重兵扼守北疆？"
 oe_vs2.15.a:0 "厚赐披迈曼陀罗自治特权，共护王道商旅"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev15_a:0 "吴哥—披迈王道协和"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev15_a:0 "王道驿馆与宽厚藩属特许令披迈—呵叻上下归心，成为抵御北方澜沧南下的可靠屏障。"
 oe_vs2.15.b:0 "派驻吴哥直辖卫戍于占巴塞与瓦普圣山"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev15_b:0 "上湄公河直辖卫戍线"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev15_b:0 "吴哥直辖卫戍牢牢锁死湄公河渡口，虽引来呵叻旧族微词，却极大强化了帝国北疆防线。"
 oe_vs2.16.title:0 "转轮圣王曼陀罗的黄昏与复兴抉择"
 oe_vs2.16.desc:0 "十四世纪行将转折，高棉帝国立于盛衰分水岭之上：究竟是凭借洞里萨湖沃土与呵叻北疆重兴吴哥水利军政、再续转轮圣王陆海大业，还是顺应南海商潮南向经营金边与洛韦河港，将古老农业帝国重塑为富甲中南半岛的商贸强权？"
 oe_vs2.16.a:0 "重兴吴哥水利与曼陀罗霸业，再耀转轮圣王威仪"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev16_a:0 "转轮圣王吴哥水利中兴"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev16_a:0 "丰盈粮仓与精锐象兵向中南半岛宣告：吴哥转轮圣王的辉煌时代并未落幕，而是再启新篇。"
 oe_vs2.16.b:0 "南向经营金边与下湄公河港，拥抱南海商贸大潮"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev16_b:0 "下湄公河—金边海上商港"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev16_b:0 "帆樯云集的金边河港广纳中华福船与南洋香料商舶，源源关税支撑起高棉全新的海陆繁荣。"
