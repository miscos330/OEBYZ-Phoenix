 oe_ren_b_italian_snub: "扣留讲学学者"
 oe_ren_b_florence_bridge: "佛罗伦萨人文融通"
 oe_ren_b_universal_letters: "希拉普世文教同盟"
 STATIC_MODIFIER_NAME_oe_ren_chrysoloras_embassy: "赫里索洛拉斯佛罗伦萨讲学"
 STATIC_MODIFIER_DESC_oe_ren_chrysoloras_embassy: "遣派赫里索洛拉斯赴意大利讲授希腊古典，显著拉近意希腊人文往来并加快思潮传播，却引发本土保守教士疑虑。"
 STATIC_MODIFIER_NAME_oe_ren_imperial_chancery_letters: "宫廷文书馆古典研习"
 STATIC_MODIFIER_DESC_oe_ren_imperial_chancery_letters: "留任赫里索洛拉斯于君士坦丁堡训导官僚，提升帝国科研与识字率，但放缓与西欧思潮的接轨节奏。"
 STATIC_MODIFIER_NAME_oe_ren_mystras_circle: "米斯特拉斯古典学圈"
 STATIC_MODIFIER_DESC_oe_ren_mystras_circle: "伯罗奔尼撒山城汇聚希腊哲学与抄本名士，推动当地识字与典籍产出，亦使地方守旧士绅躁动不安。"
 STATIC_MODIFIER_NAME_oe_ren_plethon_memoranda: "普勒托伯罗奔尼撒变法试行"
 STATIC_MODIFIER_DESC_oe_ren_plethon_memoranda: "效法普勒托备忘录试行本土公民兵与单一实物税制，提振人力、税效与科研，却招致贵族与教士阶层强烈抵制。"
 STATIC_MODIFIER_NAME_oe_ren_classical_patronage: "古典注疏皇家资助"
 STATIC_MODIFIER_DESC_oe_ren_classical_patronage: "择取米斯特拉斯学派的古典文献与修辞成果而搁置激进田制，扩大帝国文化影响，需承担额外资助耗费。"
 STATIC_MODIFIER_NAME_oe_ren_orthodox_jurisprudence: "正教律法恪守"
 STATIC_MODIFIER_DESC_oe_ren_orthodox_jurisprudence: "申明帝国仍以查士丁尼法典与圣父正统为本，稳固教士忠诚与国本安定，但压抑新思潮与学术探索。"
 STATIC_MODIFIER_NAME_oe_ren_acad_orthodox: "牧首督导帝国大学"
 STATIC_MODIFIER_DESC_oe_ren_acad_orthodox: "重开的君士坦丁堡帝国大学置于普世牧首与正教神学家督导之下，广布识字与教化，却对外来新思潮审慎设防。"
 STATIC_MODIFIER_NAME_oe_ren_acad_platonic: "帝国大学柏拉图讲席"
 STATIC_MODIFIER_DESC_oe_ren_acad_platonic: "于君士坦丁堡帝国大学特设柏拉图哲学与古典律法讲席，科研与文脉勃兴，但教界与保守官僚怨声四起。"
 STATIC_MODIFIER_NAME_oe_ren_acad_humanist: "帝国大学希拉双语讲席"
 STATIC_MODIFIER_DESC_oe_ren_acad_humanist: "延揽希腊与拉丁双语学者齐聚金角湾讲学，思潮传播与商贸大增，但招致正教纯粹派质疑朝廷偏袒拉丁。"
 STATIC_MODIFIER_NAME_oe_ren_scholarios_rigor: "斯科拉里奥斯正教经院学风"
 STATIC_MODIFIER_DESC_oe_ren_scholarios_rigor: "奉行根纳季奥斯·斯科拉里奥斯之亚里士多德逻辑与帕拉马斯正统，巩固教界向心，但疏远意大利诸邦与新思潮。"
 STATIC_MODIFIER_NAME_oe_ren_bessarion_bridge: "贝萨里翁希拉人文桥梁"
 STATIC_MODIFIER_DESC_oe_ren_bessarion_bridge: "以贝萨里翁为纽带贯通东西学术典籍与意大利诸城，思潮与外交俱进，却令本土正教士庶疑心变相合一。"
 STATIC_MODIFIER_NAME_oe_ren_plethon_florence: "佛罗伦萨柏拉图风潮"
 STATIC_MODIFIER_DESC_oe_ren_plethon_florence: "普勒托于意大利讲论柏拉图震动西方学林，令帝国文化威望远播，然其非基督教言辞令教廷与本土教士皆生戒心。"
 STATIC_MODIFIER_NAME_oe_ren_nomoi_burned: "《律法书》公开焚毁"
 STATIC_MODIFIER_DESC_oe_ren_nomoi_burned: "普勒托遗作被定为异端付之一炬，教士与正教百姓拍手称快，然自由思辨之风骤然受挫。"
 STATIC_MODIFIER_NAME_oe_ren_nomoi_sealed: "《律法书》秘藏皇宫书库"
 STATIC_MODIFIER_DESC_oe_ren_nomoi_sealed: "朝廷将《律法书》封存于御前书库仅供少数御用学者阅览，兼顾学术薪火与教界体面，仍难免招致教士微词。"
 STATIC_MODIFIER_NAME_oe_ren_nomoi_open: "《律法书》公行辩论"
 STATIC_MODIFIER_DESC_oe_ren_nomoi_open: "朝廷悍然护持普勒托遗著公行于世，哲学与识字爆发式跃升，却掀起正教世界空前的异端嫌疑与教潮震荡。"
 STATIC_MODIFIER_NAME_oe_ren_golden_horn_press: "金角湾希腊活字印局"
 STATIC_MODIFIER_DESC_oe_ren_golden_horn_press: "帝国首座官督商办的希腊与拉丁双语活字印刷工坊落成于金角湾，令典籍与新思潮奔涌，但亦催生市井传单喧嚣。"
 STATIC_MODIFIER_NAME_oe_ren_patristic_press: "圣父典籍官印局"
 STATIC_MODIFIER_DESC_oe_ren_patristic_press: "活字印刷专供礼仪书与教父文献刊行，壮大教化与正教出版，但限制世俗新学与西方思潮输入。"
 STATIC_MODIFIER_NAME_oe_ren_hellenic_press: "希腊古典数理印局"
 STATIC_MODIFIER_DESC_oe_ren_hellenic_press: "于米斯特拉斯与塞萨洛尼基刊刻欧几里得、柏拉图与古典政论，提振科研与藏书，却引起教界不满与财政开销。"
 STATIC_MODIFIER_NAME_oe_ren_scholars_returned: "群贤归京：拜占庭学林重聚"
 STATIC_MODIFIER_DESC_oe_ren_scholars_returned: "君士坦丁堡雄姿再振，阿吉罗普洛斯、拉斯卡里斯等大儒谢绝西聘留居帝都，学术与顾问人才济济，但厚俸开销颇重。"
 STATIC_MODIFIER_NAME_oe_ren_italian_exchange: "意希学者双向互访"
 STATIC_MODIFIER_DESC_oe_ren_italian_exchange: "帝国与威尼斯、佛罗伦萨订立学者互访与手稿互抄之约，海贸与思潮受惠，然部分本土精英仍倾向久居意大利。"
 STATIC_MODIFIER_NAME_oe_ren_scholar_diaspora: "希腊学者西迁失血"
 STATIC_MODIFIER_DESC_oe_ren_scholar_diaspora: "国势艰难之下，大批希腊大儒携珍本手稿渡海西赴意大利，帝国科研与思潮受挫，唯留守修院愈发抱团守正。"
 STATIC_MODIFIER_NAME_oe_ren_athos_renewal: "阿索斯圣山静修复兴"
 STATIC_MODIFIER_DESC_oe_ren_athos_renewal: "御赐阿索斯诸修院丰厚田产与抄经特权，正教灵修与帝国稳定大固，然商民与新学之士叹其流于守成。"
 STATIC_MODIFIER_NAME_oe_ren_manuscript_catalog: "帝国清点修院古卷"
 STATIC_MODIFIER_DESC_oe_ren_manuscript_catalog: "朝廷遣使清点并誊录圣山与各地修院珍藏希腊孤本，令识字、科研与思潮受益，却触动修院自治神经。"
 STATIC_MODIFIER_NAME_oe_ren_guarded_academy: "禁卫护院弹压学潮"
 STATIC_MODIFIER_DESC_oe_ren_guarded_academy: "以皇城禁卫镇压广场骚乱并强行护持学派讲席，科研得以延续，但教界怨恨与地下反抗暗流涌动。"
 STATIC_MODIFIER_NAME_oe_ren_compromised_curia: "折中诏书裁抑激论"
 STATIC_MODIFIER_DESC_oe_ren_compromised_curia: "朝廷向教士与旧贵族让步并查禁过激小册子，平息街头风波与动荡，代价是科研与思潮步伐明显放缓。"
 STATIC_MODIFIER_NAME_oe_ren_academy_patronage: "皇家赞助帝国大学"
 STATIC_MODIFIER_DESC_oe_ren_academy_patronage: "国库持续拨款扩建讲堂与抄书房，提升识字与科研效率，亦令常规税余与保守教士微受挤压。"
 STATIC_MODIFIER_NAME_oe_ren_summoned_scholars: "礼聘四方博学鸿儒"
 STATIC_MODIFIER_DESC_oe_ren_summoned_scholars: "特旨征召旅意与巴尔干博学之士赴京与米斯特拉斯供职，加快思潮吸收并降低延聘顾问开支，令本土教界颇感失势。"
 STATIC_MODIFIER_NAME_oe_ren_school_hesychast: "定鼎路线：静修派正统复兴"
 STATIC_MODIFIER_DESC_oe_ren_school_hesychast: "帕拉马斯与斯科拉里奥斯一脉主导帝国学林，稳固教士向心、正教容忍与政权正统，但放缓西方思潮吸收与科研进度。"
 STATIC_MODIFIER_NAME_oe_ren_school_neoplatonic: "定鼎路线：米斯特拉斯新柏拉图学派"
 STATIC_MODIFIER_DESC_oe_ren_school_neoplatonic: "普勒托一脉的古典希腊与柏拉图变法思潮成为帝国显学，科研、识字、文化与兵源显著跃升，却与教会及旧贵族激烈摩擦。"
 STATIC_MODIFIER_NAME_oe_ren_school_humanist: "定鼎路线：希拉人文融通学派"
 STATIC_MODIFIER_DESC_oe_ren_school_humanist: "赫里索洛拉斯与贝萨里翁一脉将帝都塑造成东西人文枢纽，思潮、外交与海贸飞速拓展，但正教保守派对拉丁化持续反弹。"
 STATIC_MODIFIER_NAME_oe_ren_culm_hesychast: "文明大成：东正教静修文艺复兴"
 STATIC_MODIFIER_DESC_oe_ren_culm_hesychast: "君士坦丁堡与阿索斯圣山铸就独树一帜的“罗马—正教文明综合”，教权与皇权珠联璧合、传教与国本稳如磐石，代价是与西欧世俗新潮始终保持距离。"
 STATIC_MODIFIER_NAME_oe_ren_culm_neoplatonic: "文明大成：新希腊柏拉图复兴"
 STATIC_MODIFIER_DESC_oe_ren_culm_neoplatonic: "自米斯特拉斯燃起的古典希腊理性之火席卷罗马帝国，哲学、数理、识字与公民兵制蔚为大观，然教界与旧阀的裂痕犹在制度深处隐隐作痛。"
 STATIC_MODIFIER_NAME_oe_ren_culm_humanist: "文明大成：希拉普世人文复兴"
 STATIC_MODIFIER_DESC_oe_ren_culm_humanist: "双语帝国大学与金角湾印局令博斯普鲁斯与佛罗伦萨并峙为文艺复兴双核，思潮、外交与商贸傲视地中海，唯本土正教原教旨派始终警惕西风浸染。"
 STATIC_MODIFIER_NAME_oe_ren_culm_compromise: "思潮折中：大辩论后的务实妥协"
 STATIC_MODIFIER_DESC_oe_ren_culm_compromise: "因思潮张力过高或国势掣肘，帝国未能将单一学派贯彻到底，只得以务实折中收场：既保住部分新学火种，亦留下温和而持久的制度阻力。"
 STATIC_MODIFIER_NAME_oe_ren_bosporus_seat: "博斯普鲁斯文艺复兴双核之座"
 STATIC_MODIFIER_DESC_oe_ren_bosporus_seat: "君士坦丁堡的帝国大学、修院抄经馆与金角湾活字印局合流成东地中海文教灯塔，思潮、识字、藏书与商力勃兴，繁华学界亦伴随市井喧嚣。"
