 oe_ren_philosophical_seminar: "米斯特拉斯—君士坦丁堡哲学会讲"
 oe_ren_philosophical_seminar_desc: "主持帝国学者与意大利使节的古典哲学与修辞会讲，提升科研速度、文化影响与外交声誉；代价：稳定成本效率下降。"
