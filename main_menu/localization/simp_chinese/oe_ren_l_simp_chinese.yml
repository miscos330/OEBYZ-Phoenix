 oe_ren_cl_un_made: "佛罗伦萨合一虽已宣诏，帝都教俗对拉丁派的疑虑反而更炽。"
 oe_ren_cl_un_void: "佛罗伦萨合一业已否决，反合一派士气正盛，贝萨里翁等人处境微妙。"
 oe_ren_cl_un_open: "东西教务尚未尘埃落定，神学与古典学问的辩论交织在一处。"
 oe_ren_cl_city_strong: "今日君士坦丁堡雄关犹在、府库尚充，足以凭厚禄与帝都学统挽留群贤。"
 oe_ren_cl_city_fragile: "帝都虽仍在帝国之手，然连年兵燹与财政拮据令众多学者望西而叹。"
 oe_ren_cl_city_lost: "君士坦丁堡既失，流亡宫廷再难留住散落爱琴海与意大利的希腊鸿儒。"
 oe_ren_dec_patronize_academy.title: "资助君士坦丁堡帝国大学"
 oe_ren_dec_patronize_academy.desc: "拨付国库#R 150#!金币扩建帝国大学讲席与抄书馆，提升帝国大学等级并推进君士坦丁堡文艺复兴思潮进度，同时带来#Y 10#!年资助修正（识字与科研提升，税效与教士满意度略降）。每#Y 5#!年可行一次。"
 oe_ren_dec_patronize_academy.a: "拨款兴学，光大帝都文脉"
 oe_ren_dec_summon_scholars.title: "征召希腊与拉丁博学之士"
 oe_ren_dec_summon_scholars.desc: "耗费#R 120#!金币与少量稳定度，延请散居意大利与伯罗奔尼撒的学者赴君士坦丁堡与米斯特拉斯讲学，加快三大核心希腊城市的文艺复兴思潮传播，思潮倾向将向人文与新柏拉图倾斜，思潮张力#R +6#!。"
 oe_ren_dec_summon_scholars.a: "颁诏礼聘四方鸿儒"
 oe_ren_dec_fund_greek_press.title: "敕建金角湾希腊活字印局"
 oe_ren_dec_fund_greek_press.desc: "自#Y 1455#!年起可耗费#R 200#!金币并在承受教士阶层不满的代价下，于君士坦丁堡敕建帝国首座希腊语活字印刷工坊，大幅推进文艺复兴思潮并解锁专属内阁行动“帝都抄书馆与活字印局”。"
 oe_ren_dec_fund_greek_press.a: "铸字开印，广布希腊典籍"
 oe_ren_imperial_scriptorium: "帝都抄书馆与希腊活字印局"
 oe_ren_imperial_scriptorium_desc: "统筹君士坦丁堡皇家抄书馆与金角湾活字印局，加速思潮传播、典籍产出与全国识字率；代价：教士阶层目标满意度下降。"
