 oe_ren.1.t: "赫里索洛拉斯西赴佛罗伦萨"
 oe_ren.1.d: "佛罗伦萨执政官萨卢塔蒂遣使致书君士坦丁堡，重金礼聘帝国名儒兼外交家曼努埃尔·赫里索洛拉斯西赴阿尔诺河畔讲授希腊语与古典修辞。此行既可换取意大利诸邦的政治同情与学术互鉴，亦可能开启希腊典籍西流之端；而留在帝都或遣往米斯特拉斯，则各有一番得失。"
 oe_ren.1.a: "准其西赴佛罗伦萨讲学，以文通好"
 oe_ren.1.a.tt: "希拉人文影响#G +12#!，静修影响#R -5#!，思潮张力#R +5#!；佛罗伦萨、威尼斯、热那亚与教宗国对帝国好感#G +15#!；获得#Y 15#!年“赫里索洛拉斯佛罗伦萨讲学”（思潮传播#G +10%#!、外交声誉#G +1#!；代价：教士满意度#R -4%#!、宗教影响下降）。"
 oe_ren.1.b: "厚禄留任于君士坦丁堡宫廷文书馆"
 oe_ren.1.b.tt: "花费#R 60#!金币；静修影响#G +8#!，新柏拉图#G +5#!，希拉人文#R -8#!，思潮张力#G -5#!；获得#Y 15#!年“宫廷文书馆古典研习”（科研#G +4%#!、月度识字率提升；代价：全球思潮传播#R -5%#!，佛罗伦萨好感#R -10#!）。"
 oe_ren.1.c: "遣赴米斯特拉斯，与伯罗奔尼撒学人切磋"
 oe_ren.1.c.tt: "花费#R 40#!金币；米斯特拉斯新柏拉图影响#G +12#!，静修影响#R -6#!，思潮张力#R +8#!；若直辖米斯特拉斯则获#Y 15#!年“米斯特拉斯古典学圈”（识字与典籍大增，动荡略升）。"
 oe_ren.2.t: "普勒托的米斯特拉斯变法备忘录"
 oe_ren.2.d: "执教米斯特拉斯的哲人格奥尔基·格弥斯托斯·普勒托上呈《伯罗奔尼撒改革备忘录》，痛陈雇佣兵与大庄园兼并乃帝国衰弱之根，建言以古典希腊公民兵取代外籍佣兵、清丈田土并改行单一实物税、由哲人议事会辅佐君主。此议令朝野震动：大贵族与教士阶层怒斥其动摇祖宗法度与教会免税特权。"
 oe_ren.2.a: "试行普勒托公民兵与单一税制变法"
 oe_ren.2.a.tt: "花费#R 80#!金币；新柏拉图影响#G +18#!，静修#R -10#!，思潮张力#R +16#!，牧首威望#R -5#!；教士与贵族满意度下降；获得#Y 15#!年“普勒托伯罗奔尼撒变法试行”（人力#G +8%#!、税效#G +6%#!、科研#G +5%#!；代价：贵族与教士满意度#R -6%#!、叛乱增长上升）。"
 oe_ren.2.b: "嘉其古典学养，然搁置激进田税之议"
 oe_ren.2.b.tt: "花费#R 30#!金币；希拉人文#G +8#!，新柏拉图#G +5#!，思潮张力#R +5#!；获得#Y 15#!年“古典注疏皇家资助”（月度识字率与文化影响提升；代价：税效#R -3%#!）。"
 oe_ren.2.c: "斥其变古乱法，重申帝国正教旧律"
 oe_ren.2.c.tt: "静修影响#G +15#!，新柏拉图#R -12#!，思潮张力#G -8#!，牧首威望#G +5#!；获得#Y 15#!年“正教律法恪守”（稳定成本效率#G +5%#!、教士满意度#G +6%#!；代价：科研#R -5%#!、思潮传播#R -6%#!）。"
 oe_ren.3.t: "君士坦丁堡帝国大学重开"
 oe_ren.3.d: "自狄奥多西二世敕建以来，君士坦丁堡帝国大学（Pandidakterion）历千载而不绝。如今帝都学人请旨重开讲堂，增设修辞、哲学、律法与神学讲席。然而究竟应由普世牧首督导学规、由柏拉图哲人掌坛，还是向意大利拉丁学者敞开讲席，朝堂争执不下。"
 oe_ren.3.a: "置于牧首督导之下，以正教神学为纲"
 oe_ren.3.a.tt: "花费#R 90#!金币；帝国大学等级#G +1#!，静修影响#G +12#!，思潮张力#G -5#!，牧首威望#G +4#!；获得#Y 20#!年“牧首督导帝国大学”（识字、教士满意度与传教提升；代价：思潮传播#R -5%#!）。"
 oe_ren.3.b: "特设柏拉图哲学与希腊古律讲席"
 oe_ren.3.b.tt: "花费#R 120#!金币；帝国大学等级#G +1#!，新柏拉图影响#G +14#!，思潮张力#R +12#!，牧首威望#R -4#!；获得#Y 20#!年“帝国大学柏拉图讲席”（科研#G +7%#!、识字与文化传统提升；代价：教士满意度#R -7%#!、稳定成本效率#R -4%#!）。"
 oe_ren.3.c: "延揽希拉双语名师，广通东西学术"
 oe_ren.3.c.tt: "花费#R 110#!金币；帝国大学等级#G +1#!，希拉人文影响#G +14#!，思潮张力#R +8#!，推进君士坦丁堡文艺复兴进度；获得#Y 20#!年“帝国大学希拉双语讲席”（思潮传播#G +15%#!、接纳费用#G -8%#!、商贸提升；代价：教士满意度#R -5%#!、月度正统下降）。"
 oe_ren.4.t: "佛罗伦萨公会议上的学者交锋"
 oe_ren.4.d: "围绕佛罗伦萨公会议的论战已远远超出神学本身，演变为帝国三大学术宗师的正面交锋：[ROOT.GetCountry.Custom('OeRenUnionContext')] 根纳季奥斯·斯科拉里奥斯高举亚里士多德逻辑与帕拉马斯静修正统；贝萨里翁主张贯通拉丁与希腊人文典籍；老迈的普勒托则在意大利名士环伺下纵论柏拉图，引得东西学林震动。"
 oe_ren.4.a: "嘉许斯科拉里奥斯：固守帕拉马斯正教经院学风"
 oe_ren.4.a.tt: "静修影响#G +16#!，新柏拉图#R -8#!，希拉人文#R -6#!，思潮张力#G -8#!，牧首威望#G +6#!；获得#Y 15#!年“斯科拉里奥斯正教经院学风”（正教容忍#G +1#!、教士满意度#G +6%#!；代价：思潮传播#R -8%#!、外交声誉#R -1#!）。"
 oe_ren.4.b: "支持贝萨里翁：架设东西典籍与意大利人文之桥"
 oe_ren.4.b.tt: "希拉人文#G +16#!，静修#R -8#!，思潮张力#R +10#!（若已行合一则#R +16#!）；意大利诸邦好感#G +20#!，推进核心城邦文艺复兴进度；获得#Y 15#!年“贝萨里翁希拉人文桥梁”（思潮传播#G +15%#!、外交声誉#G +1#!；代价：教士满意度#R -8%#!、正教容忍#R -0.5#!）。"
 oe_ren.4.c: "纵容普勒托在佛罗伦萨纵论柏拉图以扬希腊声威"
 oe_ren.4.c.tt: "新柏拉图#G +14#!，希拉人文#G +4#!，静修#R -6#!，思潮张力#R +10#!，牧首威望#R -4#!；获得威望与#Y 15#!年“佛罗伦萨柏拉图风潮”（文化影响#G +10%#!、科研#G +5%#!；代价：教士满意度#R -6%#!、宗教影响下降）。"
 oe_ren.5.t: "普勒托遗作《律法书》风波"
 oe_ren.5.d: "米斯特拉斯哲人普勒托辞世后，其生前秘而不宣的遗著《律法书》（Nomoi）手稿落入朝廷与教会之手。书中竟以古典希腊理性宇宙观与诸神秩序重构礼法，公然挑战基督教三位一体教义。斯科拉里奥斯与众主教联名上疏，恳请陛下下旨当众焚毁全书；而门徒与人文学者则奔走哀求，至少将此孤本留存于皇室书库。"
 oe_ren.5.a: "敕令斯科拉里奥斯公开焚毁《律法书》"
 oe_ren.5.a.tt: "静修影响#G +16#!，新柏拉图#R -18#!，思潮张力#G -12#!，牧首威望#G +8#!，稳定度提升；获得#Y 15#!年“《律法书》公开焚毁”（教士满意度#G +8%#!、稳定成本效率#G +6%#!；代价：科研#R -6%#!、文化传统#R -8%#!）。"
 oe_ren.5.b: "封存于御前书库，禁绝市井传抄"
 oe_ren.5.b.tt: "花费#R 40#!金币；希拉人文#G +10#!，新柏拉图#G +4#!，思潮张力#R +6#!，牧首威望#R -3#!；获得#Y 15#!年“《律法书》秘藏皇宫书库”（科研#G +4%#!、思潮传播#G +5%#!；代价：教士满意度#R -4%#!）。"
 oe_ren.5.c: "悍然护持哲思自由，准许学林公开辩难《律法书》"
 oe_ren.5.c.tt: "新柏拉图#G +22#!，静修#R -14#!，思潮张力#R +24#!，牧首威望#R -15#!，稳定度与教士满意度重挫；获得#Y 20#!年“《律法书》公行辩论”（科研#G +12%#!、月度识字与文化影响大增；代价：教士满意度#R -12%#!、正教容忍#R -1#!、叛乱增长大幅上升）。"
 oe_ren.6.t: "金角湾希腊活字印局"
 oe_ren.6.d: "金属活字印刷术正自莱茵与北意风行欧洲。威尼斯与米兰的出版商已着手筹铸希腊字母铅字，谋夺古典文献刊印之利。帝都书商与大学教授联名陈情：若由君士坦丁堡率先官办希腊活字印局，东方罗马便可牢牢掌握古典文脉的刊刻正宗。"
 oe_ren.6.a: "敕建金角湾希拉双语活字官印局"
 oe_ren.6.a.tt: "花费#R 160#!金币；帝国大学等级#G +1#!，希拉人文#G +15#!，思潮张力#R +8#!，推进三大希腊核心城邦文艺复兴进度；君士坦丁堡永久获得“金角湾希腊活字印局”（典籍产出#G +25%#!、思潮传播#G +20%#!、识字提升；代价：本地动荡略升），并解锁内阁行动“帝都抄书馆与希腊活字印局”。"
 oe_ren.6.b: "仅限刊印礼仪典籍与圣父著作"
 oe_ren.6.b.tt: "花费#R 90#!金币；静修影响#G +14#!，思潮张力#G -6#!，牧首威望#G +5#!；获得#Y 20#!年“圣父典籍官印局”（全国典籍#G +12%#!、传教与教士满意度提升；代价：思潮传播#R -6%#!、科研#R -4%#!），并解锁内阁行动。"
 oe_ren.6.c: "资助米斯特拉斯与塞萨洛尼基刊刻古典数理名著"
 oe_ren.6.c.tt: "花费#R 130#!金币；新柏拉图#G +14#!，思潮张力#R +10#!，牧首威望#R -4#!；获得#Y 20#!年“希腊古典数理印局”（典籍#G +15%#!、科研#G +6%#!、识字提升；代价：教士满意度#R -6%#!、税效#R -4%#!），并解锁内阁行动。"
 oe_ren.7.t: "希腊学者西迁，抑或群贤归京？"
 oe_ren.7.d: "十五世纪中叶，意大利诸邦豪门以重金搜求希腊学者与古籍手稿，约翰·阿吉罗普洛斯、君士坦丁·拉斯卡里斯等大儒皆收到了佛罗伦萨与米兰的聘书。[ROOT.GetCountry.Custom('OeRenCityStrength')] 帝国究竟能否留住这一代文脉栋梁，将直接决定文艺复兴的重心留在博斯普鲁斯还是彻底西移亚平宁。"
 oe_ren.7.a: "重金挽留并礼召流寓名儒归京（仅帝都稳固时可选）"
 oe_ren.7.a.tt: "花费#R 180#!金币；帝国大学等级#G +1#!，标记“群贤留京”，大幅推进三大核心城邦文艺复兴进度；获得#Y 25#!年“群贤归京：拜占庭学林重聚”（科研#G +8%#!、思潮传播#G +15%#!、延聘顾问费用#G -10%#!；代价：税效#R -5%#!、教士满意度#R -4%#!）。"
 oe_ren.7.b: "与威尼斯、佛罗伦萨订立学者双向互访之约"
 oe_ren.7.b.tt: "花费#R 60#!金币；希拉人文#G +10#!，意大利诸邦好感#G +15#!；获得#Y 15#!年“意希学者双向互访”（思潮传播#G +10%#!、商贸中心力#G +8%#!；代价：部分人才外流致文化传统#R -4%#!、科研#R -3%#!）。"
 oe_ren.7.c: "力有未逮，唯任希腊鸿儒携卷西迁"
 oe_ren.7.c.tt: "无需金币；静修影响#G +8#!，思潮张力#G -6#!；承受#Y 15#!年“希腊学者西迁失血”（科研#R -6%#!、思潮传播#R -8%#!；同时教士满意度#G +5%#!、正教容忍#G +0.5#!）。"
 oe_ren.8.t: "阿索斯圣山与静修灵修复兴"
 oe_ren.8.d: "当君士坦丁堡与米斯特拉斯的世俗学人高谈柏拉图与意大利修辞之际，阿索斯圣山二十座大修院的隐修士联名向皇室与牧首致书，呼吁以静修灵修与教父传统净化帝国文风。与此同时，皇家图书馆官员却提议趁机清点圣山藏书楼中尘封数百年的古典希腊孤本。"
 oe_ren.8.a: "厚赐阿索斯圣山，护持正教静修抄经传统"
 oe_ren.8.a.tt: "花费#R 100#!金币；静修影响#G +16#!，新柏拉图#R -10#!，思潮张力#G -10#!，牧首威望#G +8#!；获得#Y 20#!年“阿索斯圣山静修复兴”（正教容忍#G +1#!、稳定成本效率#G +6%#!、教士满意度#G +6%#!；代价：科研#R -5%#!、市民满意度#R -6%#!）。"
 oe_ren.8.b: "遣御使清点圣山古卷，誊录古典孤本入京"
 oe_ren.8.b.tt: "花费#R 60#!金币；新柏拉图与希拉人文各#G +8#!，静修#R -8#!，思潮张力#R +10#!，牧首威望#R -5#!；获得#Y 20#!年“帝国清点修院古卷”（识字、思潮传播#G +8%#!、科研#G +5%#!；代价：教士满意度#R -6%#!）。"
 oe_ren.9.t: "君士坦丁堡文明大辩论：三派定鼎"
 oe_ren.9.d: "历经数十年思想激荡，帝国朝堂、圣索菲亚讲坛与帝国大学已难再并行不悖。帕拉马斯—斯科拉里奥斯正统派、米斯特拉斯新柏拉图学派与贝萨里翁希拉人文派齐聚御前，请陛下为一朝文教与国体定下大计。\n\n#T 当前三派势力#!：静修正统#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hes_val')|0]%#!｜ 新柏拉图#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_neo_val')|0]%#!｜ 希拉人文#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hum_val')|0]%#!　思潮张力：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 100#!"
 oe_ren.9.a: "定鼎路线一：帕拉马斯—斯科拉里奥斯“静修派正统复兴”"
 oe_ren.9.a.tt: "锁定#Y 静修派正统复兴#!路线，进入第四阶并开启专属大成线：教士满意度#G +8%#!、正教容忍#G +1#!、稳定成本效率#G +8%#!、月度正统提升、牧首威望#G +8#!；代价：思潮传播#R -12%#!、科研#R -5%#!、思潮接纳成本#R +10%#!。"
 oe_ren.9.b: "定鼎路线二：普勒托“米斯特拉斯新柏拉图学派”"
 oe_ren.9.b.tt: "锁定#Y 米斯特拉斯新柏拉图学派#!路线，进入第四阶并开启专属大成线：科研#G +10%#!、月度识字提升、文化影响#G +12%#!、人力#G +6%#!；代价：思潮张力#R +15#!、牧首威望#R -10#!、教士满意度#R -10%#!、贵族满意度#R -6%#!、正教容忍#R -0.75#!与叛乱增长上升。"
 oe_ren.9.c: "定鼎路线三：贝萨里翁“希拉人文融通派”"
 oe_ren.9.c.tt: "锁定#Y 希拉人文融通派#!路线，进入第四阶并开启专属大成线：思潮传播#G +20%#!、接纳费用#G -12%#!、外交声誉#G +1.5#!、商贸中心力#G +10%#!；代价：思潮张力#R +8#!、教士满意度#R -8%#!、正教容忍#R -0.5#!、宗教影响与稳定成本效率下降。"
 oe_ren.10.t: "思潮反噬：圣索菲亚与广场骚乱"
 oe_ren.10.d: "长期激进的思潮争辩终于冲破书斋的围墙：激愤的修道士、抗税贵族仆从与反拉丁市民在君士坦丁广场与圣索菲亚门前聚众示威，焚烧新学小册子并要求严惩“背离罗马祖制”的御用学者。若不妥善处置，高企的思潮张力恐将令整场文艺复兴在终局验收时功亏一篑。"
 oe_ren.10.a: "调禁卫镇压广场骚乱，力保学派讲席"
 oe_ren.10.a.tt: "花费#R 120#!金币并损失稳定度；思潮张力#G -10#!，牧首威望#R -6#!；获得#Y 10#!年“禁卫护院弹压学潮”（科研#G +4%#!；代价：教士满意度#R -6%#!、叛乱增长上升）。"
 oe_ren.10.b: "颁布折中诏书裁抑激论，安抚教俗诸阶层"
 oe_ren.10.b.tt: "损失少量威望；思潮张力大幅回落#G -28#!，牧首威望#G +6#!；获得#Y 10#!年“折中诏书裁抑激论”（教士满意度#G +6%#!、稳定成本效率#G +4%#!；代价：科研#R -8%#!、思潮传播#R -10%#!）。"
 oe_ren.11.t: "文明大成：东正教静修文艺复兴"
 oe_ren.11.d: "大辩论定鼎十载以来，君士坦丁堡与阿索斯圣山共同铸就了一套自洽而深厚的正教经院与灵修体系。亚里士多德逻辑服务于教父神学，帝国律法与圣礼仪典相得益彰，令东地中海与巴尔干正教世界再度仰望新罗马为信仰与文明之灯塔。\n\n#T 当前验收条件#!：思潮张力#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 80#!（需低于#Y 80#!且稳定度不低于#Y 0#!方可达成完全大成）。"
 oe_ren.11.a: "昭告正教世界：东正教静修复兴大成！"
 oe_ren.11.a.tt: "永久获得“文明大成：东正教静修文艺复兴”（教士满意度#G +10%#!、正教容忍#G +1.5#!、稳定成本效率#G +10%#!、传教#G +10%#!、月度正统与宗教影响提升、识字提升；代价：思潮传播#R -10%#!、科研#R -4%#!、思潮接纳费用#R +8%#!），牧首威望#G +12#!。"
 oe_ren.11.b: "因张力或动荡所掣，以务实折中收束大辩论"
 oe_ren.11.b.tt: "永久获得“思潮折中：大辩论后的务实妥协”（温和识字、思潮传播与稳定收益，伴随轻微教士与税效代价），思潮张力#G -20#!。"
 oe_ren.12.t: "文明大成：新希腊柏拉图复兴"
 oe_ren.12.d: "从米斯特拉斯山城燃起的古典希腊理性之火，如今已在帝国学院与军政改制中结出硕果。本土公民兵传统、古典数理哲学与新希腊身份意识令东方罗马焕发出惊世骇俗的现代活力；尽管教界与旧大贵族仍在暗处切齿，一场前所未有的文明跃迁已不可逆转。\n\n#T 当前验收条件#!：思潮张力#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 80#!（需低于#Y 80#!且稳定度不低于#Y 0#!方可达成完全大成）。"
 oe_ren.12.a: "铸就新希腊柏拉图复兴大业！"
 oe_ren.12.a.tt: "永久获得“文明大成：新希腊柏拉图复兴”（科研#G +12%#!、月度识字#G +0.08#!、文化影响#G +15%#!、文化传统#G +12%#!、人力#G +8%#!、税效#G +6%#!；代价：教士满意度#R -10%#!、贵族满意度#R -6%#!、正教容忍#R -0.75#!、宗教影响下降）。"
 oe_ren.12.b: "因国内张力过烈，退而采取温和希腊人文折中"
 oe_ren.12.b.tt: "永久获得“思潮折中：大辩论后的务实妥协”（温和识字、思潮传播与稳定收益，伴随轻微教士与税效代价），思潮张力#G -20#!。"
 oe_ren.13.t: "文明大成：希拉普世人文复兴"
 oe_ren.13.d: "循着赫里索洛拉斯与贝萨里翁开辟的道路，君士坦丁堡的希拉双语大学、金角湾活字印局与意大利诸邦的学社已织就一张横跨地中海的普世文教网络。罗马与希腊不再割裂为东西两壁，而是在博斯普鲁斯海峡融汇成照耀欧陆的双核文艺复兴。\n\n#T 当前验收条件#!：思潮张力#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 80#!（需低于#Y 80#!且稳定度不低于#Y 0#!方可达成完全大成）。"
 oe_ren.13.a: "宣布希拉普世人文复兴大成，通好地中海学林！"
 oe_ren.13.a.tt: "永久获得“文明大成：希拉普世人文复兴”（思潮传播#G +25%#!、接纳费用#G -15%#!、外交声誉#G +2#!、商贸中心力#G +12%#!、识字提升、科研#G +6%#!；代价：教士满意度#R -8%#!、正教容忍#R -0.5#!、宗教影响与稳定成本效率下降），意大利诸邦好感#G +25#!。"
 oe_ren.13.b: "因教俗阻力难平，转为审慎务实的商学折中"
 oe_ren.13.b.tt: "永久获得“思潮折中：大辩论后的务实妥协”（温和识字、思潮传播与稳定收益，伴随轻微教士与税效代价），思潮张力#G -20#!。"
 oe_ren.14.t: "博斯普鲁斯的文艺复兴：思潮合流"
 oe_ren.14.d: "历经逾百年的思想激辩与制度磨砺，君士坦丁堡、塞萨洛尼基与米斯特拉斯终于汇成东地中海不可替代的文艺复兴枢纽。无论朝堂最终选择了静修正统、新柏拉图古典抑或希拉人文，新罗马皆以自身独特的文明笔触改写了近世世界的开篇。\n\n#T 凤凰涅槃联动状态#!：[ROOT.GetCountry.Custom('OeRenPhoenixSynergy')]"
 oe_ren.14.a: "敕颁《新帝国大学宪章》，广布文艺复兴思潮于三城"
 oe_ren.14.a.tt: "花费#R 150#!金币；大幅推进君士坦丁堡、塞萨洛尼基与米斯特拉斯的文艺复兴思潮进度（若已胜“凤凰涅槃”灾难则获额外思潮进度与威望）；君士坦丁堡永久获得“博斯普鲁斯文艺复兴双核之座”（思潮传播#G +20%#!、识字#G +0.06#!、典籍#G +15%#!、商力#G +10%#!；代价：本地动荡略升），本线圆满收束。"
 oe_ren.14.b: "以市民文教基金维系成果，减省国库耗费"
 oe_ren.14.b.tt: "花费#R 50#!金币；思潮张力#G -15#!，推进君士坦丁堡文艺复兴思潮进度并永久获得“博斯普鲁斯文艺复兴双核之座”，本线平稳收束。"
 oe_ren.90.t: "拜占庭文艺复兴三派思潮总览"
 oe_ren.90.d: "#T 进程状态#!：[ROOT.GetCountry.Custom('OeRenStatus')]　当前阶段：[ROOT.GetCountry.Custom('OeRenStageName')]\n#T 定鼎学派#!：[ROOT.GetCountry.Custom('OeRenSchoolName')]\n#T 帝国大学等级#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_academy_tier_val')|0]#! / #Y 3#!　#T 思潮张力#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 100#!（验收完全大成需 < #Y 80#!）\n\n#T 三派学术影响力#!：\n• 静修派正统复兴（帕拉马斯—斯科拉里奥斯）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hes_val')|0]%#!\n• 米斯特拉斯新柏拉图学派（普勒托）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_neo_val')|0]%#!\n• 希拉人文融通派（赫里索洛拉斯—贝萨里翁）：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hum_val')|0]%#!\n\n#T 关键历史节点#!：《律法书》状态：[ROOT.GetCountry.Custom('OeRenNomoiStatus')]　凤凰涅槃联动：[ROOT.GetCountry.Custom('OeRenPhoenixSynergy')]"
 oe_ren.90.a: "阅毕退朝"
