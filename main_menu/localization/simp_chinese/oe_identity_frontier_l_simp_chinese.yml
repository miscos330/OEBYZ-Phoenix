l_simp_chinese:
 oe_hungarian_romanization: "匈牙利罗马化"
 oe_hungarian_romanization_desc: "派奥涅斯认同运动开启后，可对成为罗马附属国超过十年的匈牙利自治领执行。花费50政治影响力，将该国国教改为东正教、主流文化改为派奥涅斯。"
 oe_hungarian_romanization_movement_tt: "已经开启派奥涅斯文化认同运动"
 oe_roman_march: "罗马边疆领"
 oe_roman_march_desc: "守卫帝国边疆的自治领，由地方领主持掌堡垒与军务，承担拱卫罗马疆域的职责。"
 OE_MOLDAVIAN_MARCH: "摩尔达维亚边疆领"
 OE_MOLDAVIAN_MARCH_ADJ: "摩尔达维亚"
 oe_found_moldavian_march.title: "成立摩尔达维亚边疆领"
 oe_found_moldavian_march.desc: "在喀尔巴阡山与德涅斯特河之间设立边疆领，将摩尔达维亚的城镇与堡垒交由忠于帝国的领主管理。新边疆领信奉东正教，以达契亚为主流文化，作为罗马边疆领附属于东罗马。"
 oe_found_moldavian_march.a: "令边疆的烽火守望罗马。"
 oe_moldavian_march_territory_tt: "东罗马直接拥有摩尔达维亚地区的全部可征服地点"
 oe_moldavian_march_founded: "已成立摩尔达维亚边疆领"
 OE_RW_ASSIM_GRIKO_TITLE: "开启格里科文化认同运动"
 OE_RW_ASSIM_GRIKO_ROW: "格里科文化"
 OE_RW_ASSIM_GRIKO_FLAVOR: "西西里的教堂仍回响着希腊圣歌，海峡两岸的港口也从未忘记与君士坦丁堡的往来。如今学校与法庭重新采用共同的语言，岛上的居民将在故乡传统中续接罗马的记忆。"
 OE_RW_ASSIM_GRIKO_CONDITION: "东罗马及其各级附属国拥有阿布鲁佐、阿普利亚、巴西利卡塔、坎帕尼亚和西西里地区合计至少80%的可征服地点；军事占领不算。"
 OE_RW_ASSIM_GRIKO_NOT_STARTED: "尚未成功开启；旧存档中未能正常建立的运动可重新开启一次"
 OE_RW_ASSIM_GRIKO_SOURCES: "转化文化：[ShowCultureName('sicilian')]。"
 OE_RW_ASSIM_GRIKO_TARGET: "逐步形成[ShowCultureName('griko_culture')]文化，仅在东罗马及其各级附属国拥有且有来源文化人口的地点传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_GRIKO_WAITING: "尚未开启"
 OE_RW_ASSIM_GRIKO_STARTED: "已开启：格里科"
 OE_RW_ASSIM_GRIKO_VALID_ORIGIN: "阿布鲁佐、阿普利亚、巴西利卡塔、坎帕尼亚和西西里地区至少有一处东罗马或其附属国拥有且仍有来源文化人口的地点"
 OE_RW_ASSIM_GRIKO_PROGRESS: "当前拥有：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_griko_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_griko_total')|0]；开启需至少[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_griko_required')|0]处。"
 oe_griko_identity_movement: "格里科文化认同运动"
 oe_griko_identity_movement_desc: "西西里的教堂仍回响着希腊圣歌，海峡两岸的港口也从未忘记与君士坦丁堡的往来。如今学校与法庭重新采用共同的语言，岛上的居民将在故乡传统中续接罗马的记忆。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_mesopotamian_culture: "美索不达米亚"
 OE_RW_ASSIM_MESOPOTAMIA_TITLE: "开启美索不达米亚文化认同运动"
 OE_RW_ASSIM_MESOPOTAMIA_ROW: "美索不达米亚文化"
 OE_RW_ASSIM_MESOPOTAMIA_FLAVOR: "两河间的水渠灌溉着古老的田亩，驿道将市集与学舍重新联结。帝国官吏带来的法度与当地世代积累的学问相遇，美索不达米亚的居民由此写下属于罗马世界的新篇章。"
 OE_RW_ASSIM_MESOPOTAMIA_CONDITION: "东罗马及其各级附属国拥有伊拉克阿拉伯地区合计至少80%的可征服地点；军事占领不算。"
 OE_RW_ASSIM_MESOPOTAMIA_NOT_STARTED: "尚未成功开启；旧存档中未能正常建立的运动可重新开启一次"
 OE_RW_ASSIM_MESOPOTAMIA_SOURCES: "转化文化：[ShowCultureName('iraqi_culture')]。"
 OE_RW_ASSIM_MESOPOTAMIA_TARGET: "逐步形成[ShowCultureName('oe_mesopotamian_culture')]文化，仅在东罗马及其各级附属国拥有且有来源文化人口的地点传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_MESOPOTAMIA_WAITING: "尚未开启"
 OE_RW_ASSIM_MESOPOTAMIA_STARTED: "已开启：美索不达米亚"
 OE_RW_ASSIM_MESOPOTAMIA_VALID_ORIGIN: "伊拉克阿拉伯地区至少有一处东罗马或其附属国拥有且仍有来源文化人口的地点"
 OE_RW_ASSIM_MESOPOTAMIA_PROGRESS: "当前拥有：[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_mesopotamia_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_mesopotamia_total')|0]；开启需至少[GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_mesopotamia_required')|0]处。"
 oe_mesopotamia_identity_movement: "美索不达米亚文化认同运动"
 oe_mesopotamia_identity_movement_desc: "两河间的水渠灌溉着古老的田亩，驿道将市集与学舍重新联结。帝国官吏带来的法度与当地世代积累的学问相遇，美索不达米亚的居民由此写下属于罗马世界的新篇章。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_kudoyr_culture: "库多伊尔"
 OE_RW_ASSIM_KUDOYR_TITLE: "开启库多伊尔文化认同运动"
 OE_RW_ASSIM_KUDOYR_ROW: "库多伊尔文化"
 OE_RW_ASSIM_KUDOYR_FLAVOR: "山间的堡垒与牧道见证过无数盟誓。如今山地首领将子弟送入帝国军伍，修院与城镇教习共同的文字；旧有氏族的记忆并未消散，而是在库多伊尔之名下汇入罗马。"
 OE_RW_ASSIM_KUDOYR_CONDITION: "东罗马及其各级附属国拥有库尔德斯坦地区合计至少80%的可征服地点；军事占领不算。"
