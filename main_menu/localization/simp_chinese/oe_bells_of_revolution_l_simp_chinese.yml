 oe_bells.12.t: "秘密印刷网"
 oe_bells.12.d: "巡察官查封了一间印坊，第二天，同样的小册子却出现在相隔数日路程的另一座城。再一次搜查之后，他们才发现，纸张、铅字、装订与运输各由不同的人经手。船夫只认识接货的书商，书商只收到没有署名的包裹，而负责印刷的人从不询问文章的作者。\n\n这张网络没有可以一网打尽的聚会，也没有一座可供卫队冲入的总部。它借用帝国修筑的道路，藏身于帝国日益繁盛的贸易，把首都的议论送到行省，把地方的怨愤送回首都。读者开始发现，自己以为孤独的遭遇，早已写在许多陌生人的纸页上。\n\n官员终于列出一份缉捕名单。可名单尚未呈到御前，关于这份名单的讽刺文章，已经印出来了。"
 oe_bells.12.a: "我们堵住一扇门，他们便打开十扇窗。"
 oe_bells.13.t: "大学的公开宣言"
 oe_bells.13.d: "宫廷收到的不是匿名传单，而是一份附有大学印章与学者署名的宣言。法学家援引罗马法，神学家申述统治者的责任，教授修辞的教师则为结论写下简洁而危险的一句话：国家不能只靠臣民的服从来证明自己的正当。\n\n宣言要求以成文法律约束皇权，让征收接受公开审议，让臣民有申诉而不受惩处的权利。它没有号召人们走上街头；然而，当帝国自己的学府宣布现行秩序需要重新审视，街头的人便获得了此前缺少的背书。\n\n拒绝宣言，就意味着公开斥责那些由皇帝资助、为帝国培养官吏的学者。接受它，则意味着承认王座之上或许还有一套必须服从的尺度。"
 oe_bells.13.a: "他们用我们授予的印章，质问授予印章的人。"
 oe_bells.14.t: "倒戈的宫廷史官"
 oe_bells.14.d: "那位史官曾为皇室写下最优美的赞词。他熟知每一道敕令的来历，知道每场凯旋如何被编入典册，也知道宫廷希望后世忘记哪些失败。如今，他带着多年积累的手稿离开了宫门，出版了一部完全不同的罗马史。\n\n书中仍称颂帝国的复兴，却将其归功于士兵、工匠、纳税者和被征服的各族人民。他说，王朝接受了他们的牺牲，却渐渐把共同的胜利当成了皇室的私产。最刺痛宫廷的，不是敌人的诋毁，而是他引述的那些盖着帝国印玺的原始文书。\n\n曾替紫衣织出光辉的人，正在一线一线地拆去它的神圣。"
 oe_bells.14.a: "如今，连我们的历史也站到了对面。"
 oe_bells.15.t: "军队中的共和社团"
 oe_bells.15.d: "军官的密信最初被当作几名年轻人的空谈。他们在驻营地传阅古代史，讨论公民军与共和国，把军队称为国家的盾牌，而非某个家族的剑。后来，同样的措辞出现在不同军团的私下聚会里，甚至被写进了未经批准的誓词。\n\n调查揭露了相互联系的社团，却无法辨明沉默者究竟忠于谁。老将要求部下重新宣誓，部下则追问，倘若宫廷的命令与罗马的利益相悖，他们应当服从哪一个？指挥官开始怀疑自己的副官，士兵也开始猜测身旁同袍的立场。\n\n帝国仍拥有旗帜鲜明的军队，却第一次不能确信，旗帜之下的人对同一句“效忠罗马”怀有同一个意思。"
 oe_bells.15.a: "最坚固的盾牌，正在从内部裂开。"
 oe_bells.16.t: "墙上的讽刺画"
 oe_bells.16.d: "天亮时，行人发现墙上多了一幅新画：一顶巨大的皇冠压弯了驮着税册的小驴，旁边的宫廷人物却在争论驴子为何不肯昂首。作者没有落款，笑话却不需要署名。\n\n巡逻队可以刮去墙上的颜料，但他们到来之前，已经有学徒把图样临摹下来。地方官要求追查作者，围观的人则等着看皇帝会怎样回答一头画出来的驴。"
 oe_bells.16.a: "追查作者。"
 oe_bells.16.b: "置之不理。"
 oe_bells.17.t: "学生的夜间辩论"
 oe_bells.17.d: "宿舍熄灯之后，一间临街的学舍仍透出烛光。年轻人围着借来的书册争论，时而引经据典，时而为一句大胆的判断鼓掌。他们谈论税赋、法律与共和国，仿佛只要把道理讲明白，帝国便会依照纸上的结论改变。\n\n巡夜人听见这些言辞，派人来问是否应当驱散。学监担心的是明日的课堂，官员担心的则是这些学生日后将走进的法庭、书院与官署。"
 oe_bells.17.a: "驱散集会。"
 oe_bells.17.b: "允许他们辩论。"
 oe_bells.18.t: "卫兵拒绝镇压"
 oe_bells.18.d: "命令已经下达，卫兵却没有向前。队列前站着工匠与他们的家人，手中只有请愿书。带队的士官放低了武器，告诉上级：他们愿意守卫街道，却不愿把这些人当成敌军。\n\n这一刻很短，却足以让整条街看见。惩处拒令者，可以证明军令仍有重量；饶恕他们，则会使更多人相信，帝国的武力未必始终站在王座一边。"
 oe_bells.18.a: "惩处抗命者。"
 oe_bells.18.b: "饶恕他们。"
 oe_bells.19.t: "布道台上的劝诫"
 oe_bells.19.d: "一位教士没有号召反抗。他在布道中谈到饥饿的人、无法伸冤的人，以及统治者倾听卑微者的责任。礼拜结束后，市民请他把这些话带到宫廷；而他也表示愿意出面，劝双方暂时放下愤怒。\n\n接受这次调停，意味着皇帝必须在众人面前作出让步。申斥讲道者固然能够维护宫廷的体面，却也可能把一场关于公道的争论，变成信众对王座的失望。"
 oe_bells.19.a: "接受教士调停。"
 oe_bells.19.b: "申斥讲道者。"
 oe_bells.20.t: "不忠诚的行会"
 oe_bells.20.d: "行会会馆的灯比往常亮得更晚。起初只是讨论税额与工价，后来桌上出现了政治小册子，账簿中也多了几笔去向含糊的捐款。密探报告，几位行会长者正在为反对宫廷的人提供聚会场所与钱款。\n\n查封会馆能够切断眼前的联系，却会让其他行会怀疑自己的特许与财产是否也会被一句“不忠”夺走。放任不问，则等于允许异议在商铺和工坊之间找到更加稳固的根基。"
 oe_bells.20.a: "查封会馆。"
 oe_bells.20.b: "暂且放任。"
