l_simp_chinese:
 oe_bells_of_revolution: "革命的钟声"
 oe_bells_of_revolution_desc: "凤凰重生的帝国从未如此辽阔，也从未如此紧绷。君士坦丁堡街巷中的议论越过海峡与边疆；有人听见新秩序的召唤，有人听见王座倾覆的前兆。"
 oe_bells_clamor: "革命呼声"
 oe_bells_overview: "帝国的秩序、王朝的威信与街头的思想共同推动革命呼声。连续的月度变化不写入记录；事件与行动引起的变化保留记录。\n\n#bold 局势结束#!：持续满20年、稳定度和正统性均高于75且呼声低于20；或满30年、稳定度和正统性均高于50且呼声低于50；满40年则结束。东罗马大革命爆发时，本局势立即结束。\n#bold 每月革命风险#!：呼声高于50／60／70／75／90时，爆发大革命的概率分别为1%／3%／5%／10%／50%，取满足的最高一档。"
 oe_bells_rebels: "革命煽动者"
 oe_bells_royalists: "王室支持者"
 oe_bells_no_members: "尚无国家加入"
 oe_bells_history_button: "变化记录"
 oe_bells_newest_first: "由新到旧"
 oe_bells_oldest_first: "由旧到新"
 oe_bells_prev_page: "上一页"
 oe_bells_next_page: "下一页"
 oe_bells_history_count: "共[GetDataModelSize(SituationView.GetActiveSituation.GetSituation.MakeScope.GetList('oe_bells_history'))]条，每页100条；日期按年月显示，同月按发生先后排列。"
 oe_bells_no_history: "尚无行动改变革命呼声。"
 oe_bells_log_result: "呼声：[SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariableFromVariableMap('oe_bells_log_after', MakeScopeValue(Scope.GetValue)).GetValue|2]"
 oe_bells_change_clamor_tt: "#bold 革命呼声#!　#R +$VALUE|2$#!\n#subtle_name 呼声始终处于0—100之间。#!"
 oe_bells_decrease_clamor_tt: "#bold 革命呼声#!　#G −$VALUE|2$#!\n#subtle_name 呼声始终处于0—100之间。#!"
 oe_bells_debug_record: "帝国设置：调试增加革命呼声"
 oe_bells_ended: "革命的钟声已落幕。"
 oe_bells_join_1_tt: "加入革命煽动者，退出其他阵营。"
 oe_bells_join_2_tt: "加入王室支持者，退出其他阵营。"
 oe_bells_join_0_tt: "保持中立，退出双方阵营。"
 oe_bells.1.t: "从大跑马场传来的声音"
 oe_bells.1.d: "曾经等待皇帝挥手的看台，如今挤满了要求被倾听的人。税吏的账册、远征的征召与宫廷的敕令，终于在君士坦丁堡汇成同一种愤怒。一名戴着桂冠的演说者登上昔日皇帝的露台，宣称罗马的荣耀不应只属于紫衣。\n\n消息随着商船与使节传至我们的宫廷。凤凰的羽翼遮蔽着半个世界；倘若它开始燃烧，没有谁能确信火星不会落在自己的屋顶。我们应当为街头的呼声添柴，为王座守住秩序，还是暂且让钟声从窗外掠过？"
 oe_bells.2.t: "重定我们的立场"
 oe_bells.2.d: "君士坦丁堡的钟声仍在回荡，但我们曾经作出选择时的局势已经改变。新的盟约、旧日的怨恨与宗主的态度都在牵动天平。现在应当公开表明我们将站在哪一边。"
 oe_bells.rebel.option: "让罗马的民众听见我们的支持。"
 oe_bells.royalist.option: "王座若倾，秩序亦将崩塌。"
 oe_bells.neutral.option: "我们暂不卷入这场风暴。"
 oe_bells_agitate: "在东罗马内部煽动革命"
 oe_bells_agitate_desc: "花费#Y 25政治影响力#!，革命呼声#Y +1#!；无地国家改为#Y +0.1#!。冷却#Y 4年#!。"
 oe_bells_suppress: "协助东罗马镇压革命"
 oe_bells_suppress_desc: "花费#Y 25政治影响力#!，革命呼声#Y −0.5#!；无地国家改为#Y −0.1#!。冷却#Y 4年#!。"
 oe_bells_fund: "资助东罗马革命者"
 oe_bells_fund_desc: "花费#Y 一个月总收入#!。列强排名前10名：呼声#Y +2#!；11—25名：#Y +0.5#!；26—50名：#Y +0.25#!；其后：#Y +0.1#!。冷却#Y 5年#!。"
 oe_bells_hunt: "协助围剿东罗马革命者"
 oe_bells_hunt_desc: "花费#Y 一个月总收入#!。列强排名前10名：呼声#Y −2#!；11—25名：#Y −0.5#!；26—50名：#Y −0.25#!；其后：#Y −0.1#!。冷却#Y 5年#!。"
 oe_bells_change_camp: "转换阵营"
 oe_bells_change_camp_desc: "花费#Y 10政治影响力#!，转向另一阵营或保持中立。冷却#Y 10年#!。"
 oe_bells_monthly_breakdown: "#bold 每月革命呼声#!　[SituationView.GetActiveSituation.GetSituation.MakeScope.ScriptValue('oe_bells_monthly_total')|-=2]\n自然消退　[SituationView.GetActiveSituation.GetSituation.MakeScope.ScriptValue('oe_bells_monthly_decay')|-=2]\n稳定度　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_stability_delta')|-=2]　　正统性　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_legitimacy_delta')|-=2]\n未被羁押的思想家　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_thinker_clamor')|-=2]　　国家修正　[GetCountry('BYZ').MakeScope.ScriptValue('oe_bells_country_modifier_delta')|-=2]"
 oe_bells.3.t: "紫衣之下，众声渐起"
 oe_bells.3.d: "凤凰归来时，人们曾相信，收复的每一座城都会使罗马更接近昔日的荣光。如今，凯旋门上的金字仍在闪耀，城里的面包却不会因疆界辽阔而变得便宜。行会的师傅抱怨特许与摊派，乡间的农人追问承诺过的公道；贵族失去旧权，平民却尚未等来他们以为会随之而来的新生活。\n\n同一套税册与法令越过山岭，带来了道路、法庭与更严密的征收，也将不同语言、乡俗和地方体面裁进首都规定的尺度。军区说君士坦丁堡只看见账上的数字，宫廷则说地方总把私利装扮成古老权利。每一方都能引经据典，每一方也都觉得自己未被倾听。\n\n起初，这些争论只在酒馆、学舍和教堂门廊里流传。现在，有人把它们印在纸上，贴上墙壁，并重新说起那个比皇座更古老的词——罗马人民。钟声照旧响过金角湾；只是越来越多的人，开始从中听出另一种召唤。"
 oe_bells.3.a: "帝国的钟声，为何听来如此陌生？"
 oe_bells.4.t: "危险的思想家"
 oe_bells.4.d: "[oe_bells_new_thinker.GetName]既无军队，也没有足以收买一座城的金库。他所拥有的，是一张书桌、几个不肯散去的学生，以及一种令人不安的本领：把人们习以为常的痛苦，写成他们再也无法视而不见的问题。\n\n他的文章引用罗马法，也引用圣贤；他不曾公开呼吁推翻皇帝，却不断追问，统治的正当性究竟来自紫衣本身，还是来自它必须履行的责任。宫廷里的读者说，这不过是学者的傲慢。可抄本正从书院流向作坊，从作坊流向军营。\n\n如今，贸然惩处他只会替他的论说写下最后一段证明。一个没有官职的人，已经获得了官职无法授予的听众。"
 oe_bells.4.a: "我们封不住所有人的耳朵。"
 oe_bells_thinker_alive_tt: "每名在世且未被羁押的#Y 危险的思想家#!使每月革命呼声#R +0.1#!、东罗马每月正统性#R −0.1#!。各人的影响可以叠加，死亡或被羁押后停止，释放后恢复。\n该人物受到保护，不能通过处刑、放逐、修道院或任职转移互动清除，也不能进入内阁或统率军队。"
 oe_bells.5.t: "背离的人民"
 oe_bells.5.d: "官员仍能征到税，传令官仍能宣读敕命，市集上的人却不再像从前那样抬头。对帝国的失望未必表现为怒吼；更多时候，它是一扇关上的门，一句突然中止的谈话，一群在御驾经过时没有欢呼的人。\n\n曾经替皇帝辩解的市民，如今只问为何所有牺牲总要由他们先付。王座仍居于众人之上，却正在从众人心中远去。"
 oe_bells.5.a: "沉默也会成为一种回答。"
 oe_bells.6.t: "叛逆的属国"
 oe_bells.6.d: "来自[oe_bells_rebellious_subject.GetName]的文书仍然冠以恭敬的称谓，字里行间却已换了语气。它拥有足以养兵的税源、足以自许的繁荣，也拥有越来越多关于自身地位的想法。每一道来自首都的要求，都被拿来重新衡量宗主与属国之间究竟谁更需要谁。\n\n使臣把这称作“维护旧有权利”。帝国的其他附属国正在旁观，并悄悄学习这种说法。"
 oe_bells.6.a: "裂隙已经越过国界。"
 oe_bells_dangerous_thinker: "危险的思想家"
 oe_bells_dangerous_thinker_desc: "此人的文字为帝国的异议赋予形状。他没有官职，却拥有官职无法授予的听众。"
 oe_bells_opening_record: "$oe_bells.3.t$"
 oe_bells_alienated_people: "背离的人民"
 oe_bells_alienated_people_desc: "民众的疏离正在侵蚀帝国的根基。此影响将在三十年内逐渐消退。"
 oe_bells_rebellious_subjects: "叛逆的属国"
 oe_bells_rebellious_subjects_desc: "强大属国的抗命正在动摇帝国秩序。每次危机的影响持续二十年并逐渐衰减，可以叠加。"
 oe_bells_revolutionary_subject: "煽动帝国革命"
 oe_bells_revolutionary_subject_desc: "该附属国加入革命煽动者，公开背离宗主的秩序。"
 oe_bells_revolutionary_hostility: "革命的敌意"
 MODIFIER_TYPE_NAME_oe_bells_monthly_clamor: "每月革命呼声"
 MODIFIER_TYPE_DESC_oe_bells_monthly_clamor: "国家修正对革命呼声的月度影响，随修正强度变化。"
 MODIFIER_TYPE_NAME_oe_bells_monthly_public_opinion: "每月民意"
 MODIFIER_TYPE_DESC_oe_bells_monthly_public_opinion: "对帝国柱石民意的月度影响，随修正强度变化。"
 oe_bells.7.t: "君士坦丁堡的咖啡馆"
 oe_bells.7.d: "起初，巡察官以为那不过是新近流行的饮食风尚：铜壶在炭火上轻响，苦涩的香气从临街的门帘后溢出。商人来这里议论船期，书记员来这里交换消息，失意的学者则用一杯咖啡换取半日听众。\n\n渐渐地，账单旁多了小册子，棋盘边多了争论。有人朗读古代共和国的史书，有人追问税赋为何不经纳税者同意。贵族的家世在这里抵不过一句有力的反驳，皇帝的敕令也可以被翻过来逐字审视。离席的人带走的不只是谈资，还有一份抄写整齐、准备递给邻人的文章。\n\n城中没有为这些聚会敲响过钟。然而，帝国最难缉拿的集会，已经在每一张小桌旁开始。"
 oe_bells.7.a: "一杯咖啡，竟也能盛下对王座的诘问。"
 oe_bells.8.t: "大跑马场的演讲"
 oe_bells.8.d: "大跑马场早已不再每日回响车轮与欢呼，皇帝专用露台的石栏却仍朝向整座广场。今日，站在那里的人没有紫袍，也没有仪仗。他戴着一顶朴素的桂冠，手边放着翻开的法典；商贩、工匠与学生沿着旧看台坐下，空阔的赛道留出了通行的道路。\n\n他起初谈的是面包、税册和法庭，随后才说到共和国。他问，倘若罗马人民能够奉献儿子、财产与鲜血，为何不能对自己的命运说一句话？风把声音带到对面，听不清的人由旁人低声转述。最后，那句“罗马属于谁”越过看台，终于不再需要演讲者回答。\n\n昔日皇帝俯视臣民的地方，如今有人要求王座向人民解释自身。消息传进宫中时，抄写员第一次不知该把广场上的人称为臣民，还是称为公民。"
 oe_bells.8.a: "那座露台，本应只传出皇帝的声音。"
 oe_bells.9.t: "梅塞大道游行"
 oe_bells.9.d: "清晨，梅塞大道上的店铺接连落下门板。没有军鼓，也没有领主的旗帜；走在前列的是捧着请愿书的行会长者，其后是学生、卸下工具的工匠，以及抱着孩子赶来的人。纸上的诉求各不相同：减轻摊派、公平审判、让地方得到倾听。但所有队伍都沿着同一条大道，向宫廷走来。\n\n卫队在街口排成数列。军官等候命令，市民则把请愿书举得更高。若让他们继续前进，宫廷的沉默可能被视为软弱；若用刀枪清空大道，臣民又将怎样记住那个拒绝听他们说话的皇帝？\n\n阳光渐渐越过廊柱。两个罗马隔着一排长矛，等待同一道命令。"
 oe_bells.9.a: "强力镇压。"
 oe_bells.9.b: "随他们去吧。"
 oe_bells.10.t: "聚集的抗议者"
 oe_bells.10.d: "[oe_bells_protest_target.GetName]的广场上，最初只有几名不肯离去的请愿者。如今，邻街的工匠与商贩也带着各自的委屈站到了他们身后。有人在喷泉边朗读从首都寄来的文章，有人把本地官员的征收账目钉在木板上，供识字的人念给众人听。\n\n城中的官吏请求指示。他们声称，只需一次果断的驱散，就能恢复街面的秩序；但被赶出广场的人，很可能会把这一天讲给更多人听。"
 oe_bells.10.a: "驱散他们。"
 oe_bells.10.b: "坐视不管。"
 oe_bells.11.t: "要求释放思想家"
 oe_bells.11.d: "[oe_bells_detained_target.GetName]已经无法在书桌旁写作，他的名字却开始出现在越来越多的请愿书上。支持者把他的空椅留在聚会中央，轮流朗读入狱前的文章，仿佛那道紧锁的门反倒使每一句话更加清晰。\n\n如今，请愿者要求宫廷释放他。他们宣称，一位真正自信的君主不该害怕一名学者的笔。大臣们则担忧，若为街头的呼喊打开牢门，今后还有多少敕令能够不受质问？"
 oe_bells.11.a: "答应抗议者的请求。"
 oe_bells.11.b: "我们要把他关到老死。"
 oe_bells.11.c: "请愿的对象已不在囚禁之中。"
 oe_bells_detained: "被羁押"
 oe_bells_detained_desc: "此人被拘禁，不能进入内阁或统率陆海军。羁押期间，其思想家身份不再对帝国的正统性与革命呼声产生月度影响；释放后恢复。"
 oe_bells_dangerous_salons: "危险思想沙龙"
 oe_bells_dangerous_salons_desc: "咖啡馆里传播的不只有见闻，还有对古老权威的质疑。此影响在五十年内逐渐衰减。"
 oe_bells_republican_calls: "共和呼声"
 oe_bells_republican_calls_desc: "大跑马场上的演说让共和国从史书走进了街头。此影响在五十年内逐渐衰减。"
 oe_bells_protest_crackdown: "镇压抗议者"
 oe_bells_protest_crackdown_desc: "卫队清空了梅塞大道，市民却记住了长矛后面的王座。此影响在十年内逐渐衰减。"
 oe_bells_protesters_dispersed: "抗议者被驱散"
 oe_bells_protesters_dispersed_desc: "巡逻队重新控制了广场与街道。此影响在五年内逐渐衰减。"
 oe_bells_protesters_gathered: "抗议者聚集"
 oe_bells_protesters_gathered_desc: "集会逐渐形成了官府之外的权威。此影响在五年内逐渐衰减。"
 oe_bells_confiscated_books: "没收禁书"
 oe_bells_confiscated_books_desc: "搜查与查禁压制了异议，也阻碍了文字与知识的传播。持续五年，期间不衰减。"
 oe_bells_capital_curfew: "首都宵禁"
 oe_bells_capital_curfew_desc: "日落之后，巡夜人封闭街口，聚会被迫散去。持续至主动取消。"
 oe_bells_tax_relief: "减税"
 oe_bells_tax_relief_desc: "减轻征收，让民众在切身生活中感受到宫廷的让步。持续五年，期间不衰减。"
 oe_bells_arrest_thinker: "抓捕危险的思想家"
 oe_bells_arrest_thinker_desc: "花费#Y 25政治影响力#!，选择一名危险的思想家予以羁押。其月度革命呼声与正统性影响立即停止，释放后恢复。冷却#Y 3个月#!。"
 oe_bells_confiscate_books: "在民间没收禁书"
 oe_bells_confiscate_books_desc: "花费#Y 25政治影响力#!，获得持续#Y 5年#!、不衰减的“没收禁书”：每月革命呼声#G −0.1#!、每月识字率#R −0.02%#!、市民与平民阶层满意度各#R −5%#!。现有修正结束后方可再次施行；行动冷却#Y 3年#!。"
 oe_bells_declare_curfew: "宣布首都宵禁"
