 OE_RW_PARIS: "巴黎"
 OE_RW_PARIS_OWNER: "巴黎当前拥有者"
 OE_HEG_FRANCE_ACTIONS_HINT: "筹划后可选择索取战争借口，或发动大规模入侵。普通入侵冷却三个月；大规模入侵中附庸占领的合格地点也移交东罗马。"
 OE_HEG_FRANCE_PLAN_REQUIRED: "已完成“筹划入侵法兰西”"
 OE_HEG_FRANCE_NO_ACTIVE_CAMPAIGN: "上一场大规模入侵法兰西涉及的目标国已全部结束与东罗马的本次战争"
 oe_heg_plan_france: "筹划入侵法兰西"
 oe_heg_plan_france_effect: "花费1000国库金币，将法兰西大区纳入罗马文明圈，并解锁后续行动。仅能完成一次。"
 oe_heg_plan_france_done: "已完成：筹划入侵法兰西"
 oe_heg_invade_france: "入侵法兰西"
 oe_heg_invade_france_effect: "花费100国库金币，选择在法兰西大区拥有地点、且不属于东罗马及其附庸集团的国家，取得以占领其首都为目标的十五年战争借口。不立即宣战，可重复执行，冷却三个月。"
 oe_heg_mass_invade_france: "大规模入侵法兰西"
 oe_heg_mass_invade_france_effect: "花费1000国库金币，向所有首都位于法兰西大区的外部国家宣战，排除东罗马及其各级附庸；已经交战的目标纳入本次行动。在本次登记的战争中，东罗马及其参战附庸军事占领这些目标国在上述范围内的非首都地点时，立即将所有权与控制权移交东罗马。当前首都、范围外土地及未被列为目标的参战国不适用。与相应目标结束本次战争后立即失效；本次征程全部结束后可再次执行。若未能进入任何合格战争，退还费用。\n\n$OE_HEG_MASS_INVASION_BONUS_TT$"
 OE_RW_BRITAIN: "不列颠"
 OE_RW_BRITAIN_OPEN: "查看不列颠行动"
 OE_RW_BRITAIN_ACTIONS: "不列颠行动"
 OE_RW_BRITAIN_HINT: "点击地图，在原地展开不列颠行动面板。"
 OE_RW_LONDON: "伦敦"
 OE_RW_LONDON_OWNER: "伦敦当前拥有者"
 OE_HEG_BRITAIN_ACTIONS_HINT: "筹划后可选择索取战争借口，或发动大规模入侵。普通入侵冷却三个月；大规模入侵中附庸占领的合格地点也移交东罗马。"
 OE_HEG_BRITAIN_PLAN_REQUIRED: "已完成“筹划入侵不列颠”"
 OE_HEG_BRITAIN_NO_ACTIVE_CAMPAIGN: "上一场大规模入侵不列颠涉及的目标国已全部结束与东罗马的本次战争"
 oe_heg_plan_britain: "筹划入侵不列颠"
 oe_heg_plan_britain_effect: "花费1000国库金币，将西南英格兰、伦敦周边、东盎格利亚、麦西亚、威尔士与诺森布里亚六个地区纳入罗马文明圈，并解锁后续行动。仅能完成一次。"
 oe_heg_plan_britain_done: "已完成：筹划入侵不列颠"
 oe_heg_invade_britain: "入侵不列颠"
 oe_heg_invade_britain_effect: "花费100国库金币，选择在西南英格兰、伦敦周边、东盎格利亚、麦西亚、威尔士与诺森布里亚六个地区拥有地点、且不属于东罗马及其附庸集团的国家，取得以占领其首都为目标的十五年战争借口。不立即宣战，可重复执行，冷却三个月。"
 oe_heg_mass_invade_britain: "大规模入侵不列颠"
 oe_heg_mass_invade_britain_effect: "花费1000国库金币，向所有首都位于西南英格兰、伦敦周边、东盎格利亚、麦西亚、威尔士与诺森布里亚六个地区的外部国家宣战，排除东罗马及其各级附庸；已经交战的目标纳入本次行动。在本次登记的战争中，东罗马及其参战附庸军事占领这些目标国在上述范围内的非首都地点时，立即将所有权与控制权移交东罗马。当前首都、范围外土地及未被列为目标的参战国不适用。与相应目标结束本次战争后立即失效；本次征程全部结束后可再次执行。若未能进入任何合格战争，退还费用。\n\n$OE_HEG_MASS_INVASION_BONUS_TT$"
 OE_RW_FRANCE_DESC: "高卢的古道穿过葡萄园与河谷，通向一座座换过旗帜的城镇。旧日行省的名字仍留在帝国的典籍里，如今御座将重新计算从阿尔卑斯山口到西海岸的路程。"
 oe_heg_plan_france_desc: "书记官翻出高卢的旧卷，将河流、山口与港湾逐一誊在新图上。要让诏令越过群山，先须备足驮马、粮秣与军饷；昔日的疆界，终将成为军团眼前的道路。"
 oe_heg_invade_france_desc: "使节将越过山口，把御座的要求送到仍据有高卢土地的君主面前。帝国不再满足于典籍上的旧名，而要在对方的都城听到答复。"
 oe_heg_mass_invade_france_desc: "从河谷到海岸，信使带着同一道诏令分路而行。此番征讨将直指在法兰西定都的诸国；军团攻下城镇之后，帝国的官吏便随军接收税册与城门，直至诸王接受战后的安排。"
 OE_RW_BRITAIN_DESC: "海峡彼岸，古老的石道仍穿过田野，军团留下的城墙在雨雾中若隐若现。从西南半岛到北方边地，那片曾受罗马治理的土地，再次出现在御前的地图上。"
 oe_heg_plan_britain_desc: "领航员报来海峡的风向与潮汐，军需官开始清点渡海所需的船只。西南英格兰、伦敦周边、东盎格利亚、麦西亚、威尔士与诺森布里亚，将构成此次重返不列颠的征程。"
 oe_heg_invade_britain_desc: "横渡海峡的使节带去一封盖有御玺的诏书。凡据有此次征程所及土地的君主，都将得知帝国的要求；军队的行程，则以他们的都城为终点。"
 oe_heg_mass_invade_britain_desc: "港内的战船依次升帆，运兵船与粮船紧随其后。帝国将向定都于此次征程范围内的诸国同时发出战书，让城镇在鹰旗抵达之处重入版籍，而诸王的都城留待战争作出裁决。"
