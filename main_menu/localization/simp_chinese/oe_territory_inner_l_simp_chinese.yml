 oe_ti_grant_roman_law: "授予罗马法统"
 oe_ti_grant_roman_law_desc: "请[oe_tu_senate|e]表决，把一个经征服或特许而来的行省并入帝国内地。\n条件：[oe_tu_status|e]为[oe_tu_march|e]、[oe_tu_exarchate|e]或[oe_tu_charter|e]，且不是内地出身；纳入帝国满#Y 15#!年；忠诚#Y 70#!以上；治所的主体文化属希腊文化组，或主体宗教为正教（以治所的主体文化、宗教近似代替“人口过半”）；近#Y 10#!年忠诚没有跌入叛意档，帝国此刻也没有军区叛乱。\n提交即消耗#R 5#![oe_tu_authority|e]，无论是否通过。通过：地位改为内地，记为内地出身，忠诚#G +10#!（计入忠诚目标#Y 5#!年），罗马再征服的希望#G +3#!。否决：忠诚#R −5#!（计入忠诚目标#Y 5#!年），#Y 5#!年内不能再提。\n\n$oe_tsn_pv_4$"
 oe_ti_grant_roman_law_select: "选择行省"
 oe_ti_grant_roman_law_none: "@trigger_no!没有符合条件的行省。条件见行动说明。"
 oe_ti_grant_roman_law_tt: "消耗#R 5#![oe_tu_authority|e]，把所选行省交给[oe_tu_senate|e]表决（授予罗马法统）。"
 oe_ti_grant_despotate: "分封宗室"
 oe_ti_grant_despotate_desc: "把一个内地行省（塞萨洛尼基除外）交给皇族的一位成年成员，作为专制公国。人选须住在帝国宫廷，不是皇帝或储君，不在内阁，也不担任宫廷官职。\n消耗#R 10#![oe_tu_authority|e]、#R 10#!威望。专制公国每月把收入的#G 5%#!上缴国库。专制公不在了，同族的成年人可以承袭，否则封邑归还帝国。皇位不稳时，专制公可能觊觎皇位。"
 oe_ti_grant_despotate_select: "选择行省"
 oe_ti_grant_despotate_none: "@trigger_no!没有可以分封的内地行省。"
 oe_ti_grant_despotate_select_char: "选择宗室成员"
 oe_ti_grant_despotate_none_char: "@trigger_no!宫廷里没有符合条件的皇族成年成员。"
 oe_ti_grant_despotate_tt: "消耗#R 10#![oe_tu_authority|e]、#R 10#!威望。所选行省改为宗室封邑，所选人物成为专制公。"
 oe_ti_recall_despot: "召回专制公"
 oe_ti_recall_despot_desc: "把一位专制公召回京城，封邑复为内地。消耗#R 5#![oe_tu_authority|e]。该行省忠诚#R −15#!（计入忠诚目标#Y 5#!年），并有#R 20%#!的可能起兵（忠诚低于#Y 40#!时为#R 40%#!）。"
 oe_ti_recall_despot_select: "选择专制公国"
 oe_ti_recall_despot_none: "@trigger_no!帝国没有专制公国。"
 oe_ti_recall_despot_tt: "消耗#R 5#![oe_tu_authority|e]。专制公回到宫廷，行省复为内地；忠诚#R −15#!，#R 20%#!的可能起兵（忠诚低于#Y 40#!时为#R 40%#!）。"
 oe_ti_settle_soldiers: "安置兵户"
 oe_ti_settle_soldiers_desc: "在一个陆军[oe_tu_course|e]的[oe_tu_march|e]或[oe_tu_exarchate|e]分地安置兵户。花费#R 3#![oe_tu_authority|e]、#R 150#!金币，在随后的选择里决定安置外族兵户还是本族农兵。效果持续#Y 20#!年，前#Y 5#!年地方动荡；同一行省#Y 30#!年内只能安置一次。"
 oe_ti_settle_soldiers_select: "选择行省"
 oe_ti_settle_soldiers_none: "@trigger_no!没有可以安置兵户的行省（须为陆军方针的边镇或总督区，#Y 30#!年内未安置过）。"
 oe_ti_settle_soldiers_tt: "打开安置兵户的选择。"
 oe_ti_pronoia_choice: "授地（普罗尼亚）"
 oe_ti_pronoia_choice_tt: "把行省的土地税收授给兵士以换取兵役。须帝国实行[oe_tu_pronoia|e]制度或其后续政策。\n行省与辖区按当前政策得到加成（普罗尼亚制度：人力#G +10%#!、征召兵规模#G +10%#!；科穆宁规范化：人力#G +15%#!、征召兵规模#G +15%#!；帕列奥列格世袭：人力#G +20%#!、征召兵规模#G +20%#!；改革普罗尼亚：人力#G +15%#!、征召兵规模#G +10%#!；辖区各地人力与征召兵规模同幅度）。\n将军出身豪族时：该家族影响力每年#Y +5#!。\n满#Y 20#!年授地变为世袭；收回世袭授地：忠诚#R −15#!（帕列奥列格世袭制下#R −20#!，改革普罗尼亚下#R −10#!），计入忠诚目标#Y 5#!年。"
 oe_ti.1.t: "前线暴露"
 oe_ti.1.d: "七到十世纪，帝国在东方边境的隘口设克莱苏拉，由一名长官独立统兵，专管守关。哪里成了前线，哪里的治理就要跟着改变。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的辖区已经与外国接壤。朝中有人主张把它改为边镇，交给督军按前线的办法治理。"
 oe_ti.1.a: "改设边镇"
 oe_ti.1.a.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]地位改为[oe_tu_march|e]（地位修正随之更换，长官改称督军）。\n记为“内地出身”：今后连续#Y 5#!年不与外国接壤，可恢复为内地。\n若[SCOPE.sCountry('oe_ti_ev_theme').GetName]现为民政方针：改为陆军方针（边镇不能走民政方针），#Y 5#!年内不能再调整方针。"
 oe_ti.1.b: "仍按内地治理"
 oe_ti.1.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]得到“前线防务不足”：行省士气#R −10%#!，补员速度#R −20%#!；辖区各地驻军规模#R −25%#!，防御#R −10%#!。\n持续到改为[oe_tu_march|e]，或辖区不再与外国接壤。\n#Y 5#!年内不再询问。"
 oe_ti.2.t: "边患已平"
 oe_ti.2.d: "十世纪，帝国收复安条克等东方城市，在新的边疆设督军区，统辖一线的小军区。边境推远以后，昨天的前线就成了今天的腹地。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]已经连续5年不与外国接壤。这里原本就是帝国的内地。"
 oe_ti.2.a: "恢复为内地"
 oe_ti.2.a.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]地位改为内地（地位修正随之更换）。"
 oe_ti.2.b: "仍按边镇治理"
 oe_ti.2.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]保持[oe_tu_march|e]地位。#Y 5#!年后若仍不与外国接壤，再次询问。"
 oe_ti.21.t: "罗马人的法统"
 oe_ti.21.d: "212年，卡拉卡拉皇帝颁布敕令，把罗马公民权授予帝国境内所有的自由人。据卡西乌斯·狄奥说，这名义上是荣誉，实际上是为了多收税，因为许多税只向公民征收。从那以后，罗马人就不再只是一座城市的人。\n\n如今，元老院通过了决议：[SCOPE.sCountry('oe_ti_ev_theme').GetName]的居民从此和都城的人一样，受罗马法治理。[SCOPE.sCountry('oe_ti_ev_theme').GetName]改为帝国内地。"
 oe_ti.21.a: "他们是罗马人了"
 oe_ti.21.a.tt: "（已生效）[SCOPE.sCountry('oe_ti_ev_theme').GetName]地位改为内地，并记为“内地出身”。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#G +10#!，并计入忠诚目标#Y 5#!年。\n罗马再征服的希望#G +3#!（局势进行时）。"
 oe_ti.30.t: "宗室封邑"
 oe_ti.30.d: "1349年，约翰六世·坎塔库泽努斯把摩里亚交给儿子曼努埃尔治理。曼努埃尔以专制公的身份坐镇米斯特拉斯，摩里亚几乎自成一国。1408年，曼努埃尔二世又把帖撒罗尼迦交给年仅八岁的儿子安德罗尼卡，由将军莱昂塔里斯辅佐。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]交给了皇族的[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]。"
 oe_ti.30.a: "愿[SCOPE.sCharacter('oe_ti_ev_ruler').GetSheHe]守好这片土地"
 oe_ti.30.a.tt: "（已生效）[SCOPE.sCountry('oe_ti_ev_theme').GetName]改为宗室封邑，[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]成为专制公。\n[oe_tu_authority|e]#R −10#!，威望#R −10#!。\n宗室封邑每月把收入的#Y 5%#!上缴国库。"
 oe_ti.31.t: "专制公出缺"
 oe_ti.31.d1: "1380年，摩里亚的专制公曼努埃尔·坎塔库泽努斯去世。1383年，帕列奥列格家的狄奥多尔来到米斯特拉斯，接管了这片封地。封地是皇帝给宗室的恩典，专制公不在了，它归谁，要由皇帝决定。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的专制公之位空了出来。[SCOPE.sCharacter('oe_ti_ev_heir').GetName]是同族中可以承袭的成年人。"
 oe_ti.31.d: "1380年，摩里亚的专制公曼努埃尔·坎塔库泽努斯去世。1383年，帕列奥列格家的狄奥多尔来到米斯特拉斯，接管了这片封地。封地是皇帝给宗室的恩典，专制公不在了，它归谁，要由皇帝决定。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的专制公之位空了出来，家族中已经没有可以承袭的成年人。"
 oe_ti.31.a: "由[SCOPE.sCharacter('oe_ti_ev_heir').GetName]承袭封邑"
 oe_ti.31.a.tt: "[SCOPE.sCharacter('oe_ti_ev_heir').GetName]成为[SCOPE.sCountry('oe_ti_ev_theme').GetName]的专制公，[SCOPE.sCountry('oe_ti_ev_theme').GetName]仍为宗室封邑。"
 oe_ti.31.b: "收回封邑"
 oe_ti.31.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]地位改为内地。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#R −10#!，并计入忠诚目标#Y 5#!年。"
 oe_ti.31.c: "封邑归还帝国"
 oe_ti.31.c.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]地位改为内地。"
 oe_ti.32.t: "觊觎皇位"
 oe_ti.32.d1: "1442年4月，专制公迪米特里奥斯·帕列奥列格与苏丹穆拉德二世做了交易，带着奥斯曼军队进攻君士坦丁堡，想从兄长约翰八世手里夺取皇位。进攻被击退，迪米特里奥斯被短暂囚禁。\n\n如今皇帝年幼，朝政由摄政主持。[SCOPE.sCountry('oe_ti_ev_theme').GetName]的[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]派人在京城四处联络。"
 oe_ti.32.d: "1442年4月，专制公迪米特里奥斯·帕列奥列格与苏丹穆拉德二世做了交易，带着奥斯曼军队进攻君士坦丁堡，想从兄长约翰八世手里夺取皇位。进攻被击退，迪米特里奥斯被短暂囚禁。\n\n如今皇位的继承悬而未决。[SCOPE.sCountry('oe_ti_ev_theme').GetName]的[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]派人在京城四处联络。"
 oe_ti.32.a: "厚加赏赐，请[SCOPE.sCharacter('oe_ti_ev_ruler').GetSheHe]安守封邑"
 oe_ti.32.a.tt: "#R −200#!金币\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#G +5#!，并计入忠诚目标#Y 5#!年。"
 oe_ti.32.b: "召回专制公"
 oe_ti.32.b.tt: "[oe_tu_authority|e]#R −5#!\n[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]被召回京城，[SCOPE.sCountry('oe_ti_ev_theme').GetName]地位改为内地。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#R −15#!，并计入忠诚目标#Y 5#!年。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：有#R 20%#!的可能起兵（忠诚低于#Y 40#!时为#R 40%#!）。"
 oe_ti.32.c: "静观其变"
 oe_ti.32.c.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#R −10#!，并计入忠诚目标#Y 5#!年。\n#R 25%#!的可能：[SCOPE.sCountry('oe_ti_ev_theme').GetName]下个月起兵。"
 oe_ti.40.t: "安置兵户"
 oe_ti.40.d: "1240年代初，蒙古人把库曼人赶出了草原。约翰三世·瓦塔泽斯把他们安置在色雷斯、马其顿和小亚细亚，分给土地，条件是为帝国当兵。库曼人从此成了帝国的轻骑兵和常备军。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的辖区有荒地可以分配。"
 oe_ti.40.a: "安置外族兵户"
 oe_ti.40.a.tt: "消耗#R 3#![oe_tu_authority|e]、#R 150#!金币。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：人力#G +15%#!，征兵速度#G +20%#!（#Y 20#!年）。\n辖区各地：人口增长#G +0.2%#!，人力#G +10%#!（#Y 20#!年）；动荡#R +0.5#!（前#Y 5#!年）。\n此后#Y 30#!年内不能再在[SCOPE.sCountry('oe_ti_ev_theme').GetName]安置兵户。"
 oe_ti.40.b: "迁入本族农兵"
 oe_ti.40.b.tt: "消耗#R 3#![oe_tu_authority|e]、#R 150#!金币。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：人力#G +10%#!，征兵速度#G +10%#!（#Y 20#!年）。\n辖区各地：同化速度#G +25%#!，人力#G +5%#!（#Y 20#!年）；动荡#R +0.25#!（前#Y 5#!年）。\n此后#Y 30#!年内不能再在[SCOPE.sCountry('oe_ti_ev_theme').GetName]安置兵户。"
 oe_ti.40.c: "暂不安置"
 oe_ti.40.c.tt: "不做改变。"
 oe_ti.50.t: "授地世袭"
 oe_ti.50.d: "普罗尼亚原本只是把一片土地的税收暂时授给某人，皇帝可以随时收回，也不能传给子孙。1261年收复君士坦丁堡以后，米海尔八世允许普罗尼亚由子孙继承，授地慢慢变成了家产。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的授地已经满20年，领受者请求把授地传给儿子。"
 oe_ti.50.a: "准其世袭"
 oe_ti.50.a.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]的授地成为世袭：今后收回授地，忠诚#R −15#!（帕列奥列格世袭制下#R −20#!，改革[oe_tu_pronoia|e]下#R −10#!），计入忠诚目标#Y 5#!年。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#G +5#!，并计入忠诚目标#Y 5#!年。\n将军出身豪族时：该家族影响力#Y +10#!。"
 oe_ti.50.b: "再缓十年"
 oe_ti.50.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#R −5#!，并计入忠诚目标#Y 5#!年。\n#Y 10#!年后再议（只能推迟一次）。"
 oe_ti.50.c: "趁现在收回授地"
 oe_ti.50.c.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]的财务改由将军兼管，不再授地；#Y 2#!年内不能再调整属官。\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]：忠诚#R −5#!，并计入忠诚目标#Y 5#!年。"
 oe_ti.30.d_pre: "安德洛尼卡二世的皇后伊琳娜（蒙费拉的约兰达）曾要求按西欧的习惯，把帝国分给她的几个儿子做封地。皇帝不肯，她便在1303年前后离开京城，移居帖撒罗尼迦。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]交给了皇族的[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]。"
 oe_ti.31.d1_pre: "专制公是仅次于皇帝的尊号，十二世纪以后多授给皇子和皇亲，本身并不世袭。封地是皇帝给宗室的恩典，专制公不在了，它归谁，要由皇帝决定。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的专制公之位空了出来。[SCOPE.sCharacter('oe_ti_ev_heir').GetName]是同族中可以承袭的成年人。"
 oe_ti.31.d_pre: "专制公是仅次于皇帝的尊号，十二世纪以后多授给皇子和皇亲，本身并不世袭。封地是皇帝给宗室的恩典，专制公不在了，它归谁，要由皇帝决定。\n\n如今，[SCOPE.sCountry('oe_ti_ev_theme').GetName]的专制公之位空了出来，家族中已经没有可以承袭的成年人。"
 oe_ti.32.d1_pre: "1321年起，年轻的安德洛尼卡三世同祖父安德洛尼卡二世争夺皇位，内战时打时停，拖了七年。1328年5月，他趁夜进入君士坦丁堡，逼祖父退位。\n\n如今皇帝年幼，朝政由摄政主持。[SCOPE.sCountry('oe_ti_ev_theme').GetName]的[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]派人在京城四处联络。"
 oe_ti.32.d_pre: "1321年起，年轻的安德洛尼卡三世同祖父安德洛尼卡二世争夺皇位，内战时打时停，拖了七年。1328年5月，他趁夜进入君士坦丁堡，逼祖父退位。\n\n如今皇位的继承悬而未决。[SCOPE.sCountry('oe_ti_ev_theme').GetName]的[SCOPE.sCharacter('oe_ti_ev_ruler').GetName]派人在京城四处联络。"
