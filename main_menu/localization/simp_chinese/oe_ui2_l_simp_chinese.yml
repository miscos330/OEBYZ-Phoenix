 oe_chr_ely.90.desc: "#T 第四奥德赛全链路只读编年账本（不改变任何游戏状态）#!\n· 西渡定居状态：[ROOT.GetCountry.Custom('OeUi2ElySettledLabel')]\n· 三教信仰路线：[ROOT.GetCountry.Custom('OeUi2ElyFaithPath')]\n· 美洲原住民方略：[ROOT.GetCountry.Custom('OeUi2ElyNativePath')]\n· 活跃帝国总督区：总计 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_exarchate_count')|0]#!（美洲 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_amer_exarch_count')|0]#! / 6｜故土 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_old_exarch_count')|0]#! / 4）\n· 重返圣城（Nostos）阶段：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_nostos_stage_val')|0]#! / 4（0 未启 / 1 跳板 / 2 入地中海 / 3 光复君堡 / 4 终局）\n· 已解锁史诗里程碑：#G [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_done_count')|0]#! / 16\n\n请选择下方分卷查看第一二幕（西渡与立国，8 节点）或第三四幕（总督、重逢与重返故土，8 节点）。"
 oe_chr_ely.90.a: "翻阅卷一：第一二幕 · 西渡与立国（8 节点）"
 oe_chr_ely.90.b: "翻阅卷二：第三四幕 · 总督与重返故土（8 节点）"
 oe_chr_ely.90.c: "合卷退出"
 oe_chr_ely.91.title: "极乐洲新罗马编年史 · 卷一"
 oe_chr_ely.91.desc: "#T 第一二幕 · 西渡与切萨皮克立国（8 节点 · 只读）#!\n1. 圣火启航与方舟筹备：[ROOT.GetCountry.Custom('OeUi2ElyNode1')]（方舟等级 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_ark_tier_val')|0]#! / 3）— 开启西渡启航并筹集古典典籍与圣火补给。\n2. 亚速尔航标：[ROOT.GetCountry.Custom('OeUi2ElyNode2')] — 西渡途中于亚速尔群岛立下航标（将在第四幕东征时提供快捷跳板）。\n3. 切萨皮克登陆定都：[ROOT.GetCountry.Custom('OeUi2ElyNode3')] — 跨越风暴洋登陆切萨皮克湾，奠定新君士坦丁堡基业。\n4. 极乐元老院召开：[ROOT.GetCountry.Custom('OeUi2ElyNode4')] — 定居两年后召开极乐元老院，确立帝制、共和或混合政体轴线。\n5. 极乐希腊族裔熔铸：[ROOT.GetCountry.Custom('OeUi2ElyNode5')] — 定居满二十五年后完成极乐希腊新民族熔铸。\n6. 三教定鼎与万神殿 / 西方牧首：[ROOT.GetCountry.Custom('OeUi2ElyNode6')]（当前：[ROOT.GetCountry.Custom('OeUi2ElyFaithPath')]）— 完成西方正教牧首区、大西洋万神殿或西马库斯宽容宪章。\n7. 喷火步兵与铜甲舰队军备：[ROOT.GetCountry.Custom('OeUi2ElyNode7')] — 整备极乐洲专属喷火步兵军团与铜甲战舰。\n8. 极乐丝绸与希腊火船坞工业：[ROOT.GetCountry.Custom('OeUi2ElyNode8')] — 解锁切萨皮克极乐丝绸御坊与新君堡希腊火船坞铸炮局。"
 oe_chr_ely.91.a: "返回极乐洲编年史总览"
 oe_chr_ely.91.b: "前往卷二：第三四幕"
 oe_chr_ely.91.c: "合卷退出"
 oe_chr_ely.92.title: "极乐洲新罗马编年史 · 卷二"
 oe_chr_ely.92.desc: "#T 第三四幕 · 总督体制、大重逢与重返故土（8 节点 · 只读）#!\n9. 北岸维京文兰接触：[ROOT.GetCountry.Custom('OeUi2ElyNode9')] — 1380 年后于纽芬兰北岸邂逅维京文兰，可缔结瓦兰吉血盟或收编北洋总督区。\n10. 尤卡坦斯巴达尼亚接触：[ROOT.GetCountry.Custom('OeUi2ElyNode10')] — 1440 年后于尤卡坦邂逅失散拉科尼亚军团，可结盟抗墨或敕封军事总督区。\n11. 美洲六大总督区分封进度：[ROOT.GetCountry.Custom('OeUi2ElyNode11')]（已敕封 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_amer_exarch_count')|0]#! / 6）— 在美洲六大区各持 3 处以上非首都直辖地即可一键分封总督区。\n12. 跨洋大重逢：[ROOT.GetCountry.Custom('OeUi2ElyNode12')] — 1490–1560 年间揭开大西洋与地中海迷雾，侦测君士坦丁堡实控者并开启东征序幕。\n13. 大瘟疫防疫与银船拦截：[ROOT.GetCountry.Custom('OeUi2ElyNode13')]（检疫：[ROOT.GetCountry.Custom('OeUi2ElyQuarantineLabel')]｜截获银船 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_ely_silver_intercepts_val')|0]#! 次）— 应对旧大陆大瘟疫并拦截大西洋银船。\n14. 赫斯珀里得斯东征跳板：[ROOT.GetCountry.Custom('OeUi2ElyNode14')] — 经大重逢或 Nostos 决议在亚速尔、马德拉、百慕大或直布罗陀建立前进海港。\n15. 光复君士坦丁堡与罗马：[ROOT.GetCountry.Custom('OeUi2ElyNode15')] — 铜甲舰队东渡直布罗陀，收复女王之城与永恒之城。\n16. 终局裁决与故土总督区：[ROOT.GetCountry.Custom('OeUi2ElyNode16')]（故土总督区 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_el2_old_exarch_count')|0]#! / 4）— 颁布新大陆纪元、重返圣城或真·双头大帝跨洋实体分封裁决。"
 oe_chr_ely.92.a: "返回极乐洲编年史总览"
 oe_chr_ely.92.b: "前往卷一：第一二幕"
 oe_chr_ely.92.c: "合卷退出"
