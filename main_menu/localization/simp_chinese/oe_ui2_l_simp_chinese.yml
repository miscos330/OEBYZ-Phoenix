 OE_UI2_SENATE_KPI_SEATS: "元老院总席位"
 OE_UI2_SENATE_KPI_SEATS_TT: "#T [oe_tu_senate|e]席位构成与表决机制#!\n• 席位来源：每个[oe_tu_charter|e] #Y 2#! 席，每个[oe_tu_exarchate|e]与宗室封邑各 #Y 1#! 席，名册上每个豪族 #Y 1#! 席，每位在任宫廷官员 #Y 1#! 席。\n• 四大近卫大区代表团上限：大区启用或行省原始席位超 #Y 12#! 时，每个近卫大区最多派出 #Y 4#! 席（行省合计至多 #Y 16#! 席，平衡中央 #Y 11#! 席）。\n• 机构区分：[oe_tu_senate|e]专司加征贡金、战时征召、[oe_tu_provincialise|e]与罗马法统四项立法表决；它与总揽内帑权威的#Y 帝国柱石#!以及国内议会#Y 东罗马御前咨议#!各司其职。\n• 悬停[oe_tu_senate|e]可阅完整计票与强行通过规则。"
