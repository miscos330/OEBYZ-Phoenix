 oe_chr_cel.90.title: "天朝四海编年史 · 总览"
 oe_chr_cel.90.desc: "#T 天朝事件链只读编年账本（不改变任何游戏状态）#!\n· 当前王朝动态轨道：[ROOT.GetCountry.Custom('OeUi2CelTrackName')]（轨号 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_track_value')|0]#!）\n· 宗藩体制实盘统计：藩王 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_fanwang_count_value')|0]#!｜宣慰司 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_xuanweisi_count_value')|0]#!｜大都护府 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_duhu_count_value')|0]#!\n· 四海疆域覆盖：旧制覆盖大区 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_zone_count_value')|0]#!｜天朝 3.0 敕设大都护府 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_active_zones')|0]#! / 10｜万国来朝周期 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_tribute_cycles')|0]#!\n· 削藩张力读数：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_revocation_heat_value')|0]#! / 5（达标将触发藩镇危机，可通过安抚或王朝决议降温）\n· 核心剧情节点总进度：#G [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel_done_count')|0]#! / 14\n\n请选择下方分卷查看宗藩王朝链（7 节点）或四海日不落链（7 节点）的逐项状态与触发指引。"
 oe_chr_cel.90.a: "翻阅卷一：宗藩与王朝链（7 节点）"
 oe_chr_cel.90.b: "翻阅卷二：四海日不落链（7 节点）"
 oe_chr_cel.90.c: "合卷退出"
 oe_chr_cel.91.title: "天朝四海编年史 · 卷一"
 oe_chr_cel.91.desc: "#T 宗藩与王朝轨核心节点（7 项 · 只读）#!\n1. 首封藩王与宗藩法度：[ROOT.GetCountry.Custom('OeUi2CelNode1')] — 执掌天命后在中华体系外交动作中册封首位藩王触发。\n2. 朝堂礼法大辩论：[ROOT.GetCountry.Custom('OeUi2CelNode2')]（路线：[ROOT.GetCountry.Custom('OeUi2CelDebateSide')]）— 登极十年后由年脉冲触发辩论及次年裁定。\n3. 元朝投下折钞 / 行省改制：[ROOT.GetCountry.Custom('OeUi2CelNode3')]（折钞 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_touxia_commuted_count_value')|0]#! / 改省 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_touxia_provincialized_count_value')|0]#!）— 对投下领主施行投下改制外交动作。\n4. 王朝专属典制决议：[ROOT.GetCountry.Custom('OeUi2CelNode4')] — 按当前王朝轨颁行大元忽里台、大明宗人府、大清盟旗或客帝承统决议。\n5. 削藩危机状态：[ROOT.GetCountry.Custom('OeUi2CelNode5')]（当前张力 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_revocation_heat_value')|0]#! / 5）— 维持藩镇稳固或平息削藩动荡。\n6. 召还亲王留京宿卫：[ROOT.GetCountry.Custom('OeUi2CelNode6')]（已召还 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_recalled_princes_count_value')|0]#! 位）— 通过人物互动召还藩王世子入京宿卫。\n7. 改土归流进度：[ROOT.GetCountry.Custom('OeUi2CelNode7')]（在途改流藩属 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel_gtgl_pending')|0]#! 个）— 颁行改土归流国策并对土司或宣慰司施行归流。"
 oe_chr_cel.91.a: "返回天朝编年史总览"
 oe_chr_cel.91.b: "前往卷二：四海日不落链"
 oe_chr_cel.91.c: "合卷退出"
 oe_chr_cel.92.title: "天朝四海编年史 · 卷二"
 oe_chr_cel.92.desc: "#T 四海日不落核心节点（7 项 · 只读）#!\n8. 南洋旧港与满剌加：[ROOT.GetCountry.Custom('OeUi2CelNode8')] — 本国或附庸控有旧港或满剌加枢纽（1400 年后触发南洋盛事）。\n9. 宝船巡洋古里与锡兰：[ROOT.GetCountry.Custom('OeUi2CelNode9')] — 推行下西洋宝船方略并打通印度洋古里与锡兰航路。\n10. 西域哈密与丝路通道：[ROOT.GetCountry.Custom('OeUi2CelNode10')] — 本国或附庸控有哈密、吐鲁番或喀什噶尔丝路要冲。\n11. 奴儿干永宁寺：[ROOT.GetCountry.Custom('OeUi2CelNode11')] — 本国或附庸控有奴儿干或宁古塔远东要津。\n12. 三方 / 六方大都护府里程碑：[ROOT.GetCountry.Custom('OeUi2CelNode12')]（已覆旧制大区 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_cel_zone_count_value')|0]#!）— 在多片大区建立大都护府解锁日不落伟业。\n13. 天朝 3.0 八方开府与万国来朝：[ROOT.GetCountry.Custom('OeUi2CelNode13')]（敕设都护府 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_active_zones')|0]#! / 10｜朝贡周期 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ui2_cel3_tribute_cycles')|0]#!）— 在海外大区持 4 处以上非首都直辖地即可一键开府，每 5 年迎万国来朝。\n14. 东西双凤 / 太平洋双日外交：[ROOT.GetCountry.Custom('OeUi2CelNode14')] — 与罗马帝国或极乐洲新罗马建立跨洋双日外交协定。"
