l_simp_chinese:
 oe_ru2_pomor_arctic_demand: "波莫尔白海北极航运需求"
 oe_ru2_hanseatic_wax_fur_demand: "彼得庭毛皮蜂蜡大宗交割"
 oe_ru2_dec_hanseatic_renegotiate: "重议汉萨彼得庭商馆条约"
 oe_ru2_dec_hanseatic_renegotiate.title: "重议汉萨彼得庭商馆条约"
 oe_ru2_dec_hanseatic_renegotiate_desc: "围绕诺夫哥罗德彼得庭商馆的毛皮与蜂蜡贸易权与吕贝克重开谈判：强制收回直贸垄断以拉升自主商力，或签署《伊万百人行会平权约》共拓波罗的海市场。冷却10年。"
 oe_ru2_dec_hanseatic_renegotiate.desc: "围绕诺夫哥罗德彼得庭商馆的毛皮与蜂蜡贸易权与吕贝克重开谈判：强制收回直贸垄断以拉升自主商力，或签署《伊万百人行会平权约》共拓波罗的海市场。冷却10年。"
 oe_ru2_dec_hanseatic_renegotiate.a: "强制收回毛皮与蜂蜡直贸垄断权"
 oe_ru2_dec_hanseatic_renegotiate.a.tt: "在诺夫哥罗德市场触发5年毛皮蜂蜡需求并获10年高额自主商力，但激怒吕贝克。"
 oe_ru2_dec_hanseatic_renegotiate.b: "签署《伊万百人行会平权约》"
 oe_ru2_dec_hanseatic_renegotiate.b.tt: "在诺夫哥罗德市场触发5年毛皮蜂蜡需求，提升贸易、市民满意与波罗的海邦交。"
 oe_ru2_dec_pomor_arctic_charter: "颁行波莫尔白海北极航运宪章"
 oe_ru2_dec_pomor_arctic_charter.title: "颁行波莫尔白海北极航运宪章"
 oe_ru2_dec_pomor_arctic_charter_desc: "依托霍尔莫戈雷与阿尔汉格尔斯克开辟白海—曼加泽亚北极毛皮与海象牙商路，在诺夫哥罗德市场拉动毛皮与造船物料需求并扶植波莫尔海商行会。冷却12年。"
 oe_ru2_dec_pomor_arctic_charter.desc: "依托霍尔莫戈雷与阿尔汉格尔斯克开辟白海—曼加泽亚北极毛皮与海象牙商路，在诺夫哥罗德市场拉动毛皮与造船物料需求并扶植波莫尔海商行会。冷却12年。"
 oe_ru2_dec_pomor_arctic_charter.a: "授予波莫尔北极航运特许状"
 oe_ru2_dec_pomor_arctic_charter.tt: "激活12年《波莫尔北极海商行会》、强化白海港埠，并在诺夫哥罗德市场触发5年北极毛皮与船料需求。"
 oe_ru2_dec_cossack_campaign: "诏令哥萨克边防军团出征"
 oe_ru2_dec_cossack_campaign.title: "诏令哥萨克边防军团出征"
 oe_ru2_dec_cossack_campaign_desc: "战时向已敕封的边防哥萨克军团拨发火药、铅弹与粮饷，令其作为前驱轻骑投入围城与敌后骚扰。冷却5年。"
 oe_ru2_dec_cossack_campaign.desc: "战时向已敕封的边防哥萨克军团拨发火药、铅弹与粮饷，令其作为前驱轻骑投入围城与敌后骚扰。冷却5年。"
 oe_ru2_dec_cossack_campaign.a: "拨发火药粮饷誓师出征"
 oe_ru2_dec_cossack_campaign.tt: "立即补充哥萨克人力，并在3年内获得陆军士气、围城能力与敌军损耗加成。"
 oe_ru2_dec_siberian_charter: "颁行西伯利亚毛皮与堡垒宪章"
 oe_ru2_dec_siberian_charter.title: "颁行西伯利亚毛皮与堡垒宪章"
 oe_ru2_dec_siberian_charter_desc: "在控制托博尔斯克或喀什里克后，颁行永久性西伯利亚毛皮实物税与木堡（奥斯特罗格）拓殖宪章，加速西伯利亚人口增长、毛皮产出与控制力延伸。"
 oe_ru2_dec_siberian_charter.desc: "在控制托博尔斯克或喀什里克后，颁行永久性西伯利亚毛皮实物税与木堡（奥斯特罗格）拓殖宪章，加速西伯利亚人口增长、毛皮产出与控制力延伸。"
 oe_ru2_dec_siberian_charter.a: "于托博尔斯克与喀什里克建堡颁宪"
 oe_ru2_dec_siberian_charter.tt: "永久赋予全国与托博尔斯克/喀什里克西伯利亚拓殖加成，并安插西伯利亚哥萨克军团。"
 oe_ru2_dec_oprich_throttle: "调整特辖区铁骑规制"
 oe_ru2_dec_oprich_throttle.title: "调整特辖区铁骑规制"
 oe_ru2_dec_oprich_throttle_desc: "主动切换特辖制的执行力度：在《严酷肃清档》《节制巡检档》与《缙绅和解泄压阀》三档间动态权衡集权、贵族压制与国家元气恢复。冷却3年。"
 oe_ru2_dec_oprich_throttle.desc: "主动切换特辖制的执行力度：在《严酷肃清档》《节制巡检档》与《缙绅和解泄压阀》三档间动态权衡集权、贵族压制与国家元气恢复。冷却3年。"
 oe_ru2_dec_oprich_throttle.a: "召议特辖铁骑三档规制"
 oe_ru2_dec_oprich_throttle.tt: "打开《御定特辖区铁骑规制》抉择界面，在三档特辖力度间即时切换。"
 oe_ru2.1.t: "彼得庭商馆与吕贝克垄断之争"
 oe_ru2.1.d: "沃尔霍夫河东岸的汉萨同盟彼得庭商馆严禁德意志商人与诺夫哥罗德小商直接赊销，借此牢牢压低毛皮与蜂蜡收购价。伊万百人行会的诺夫哥罗德富商齐聚维彻广场，要求共和国打破吕贝克垄断。"
 oe_ru2.1.a: "查封特权条款、强制收回毛皮蜂蜡直贸权"
 oe_ru2.1.a.tt: "暴涨自主商力与贸易收入十五年，但招致吕贝克外交敌意。"
 oe_ru2.1.b: "与汉萨重签《伊万百人行会平权约》"
 oe_ru2.1.b.tt: "兼顾波罗的海和平通商、市民满意与市场需求景气。"
 oe_ru2.1.c: "延请荷英新商团绕开波罗的海封锁"
 oe_ru2.1.c.tt: "大幅拓展贸易范围与识字交流十五年，冷落吕贝克旧盟。"
 oe_ru2.2.t: "波罗的海禁运与伊万百人行会反制"
 oe_ru2.2.d: "因商馆税率与度量衡争端，汉萨城市宣布暂停向诺夫哥罗德供应精呢与白银，企图迫使维彻就范。伊万百人行会领袖请愿封锁涅瓦河口实施反禁运，而温和派建议经由里加与多尔帕特另辟转口协约。"
 oe_ru2.2.a: "封锁涅瓦河口并武装护商反禁运"
 oe_ru2.2.a.tt: "以短期贸易阵痛换取高昂自主商力与海军传统。"
 oe_ru2.2.b: "与里加商帮缔结波罗的海转口妥协"
 oe_ru2.2.b.tt: "迅速恢复波罗的海货流与毛皮蜂蜡需求景气。"
 oe_ru2.3.t: "霍尔莫戈雷与白海波莫尔航路"
 oe_ru2.3.d: "北德维纳河口的波莫尔水手造出耐冰抗浪的科奇双层帆船，从霍尔莫戈雷与白海沿岸扬帆东进，将极地黑貂皮、鲸油与海象牙源源运回诺夫哥罗德大市。维彻议会正在讨论是全额扶持波莫尔行会造船，还是征收北疆行商重税。"
 oe_ru2.3.a: "资助霍尔莫戈雷船厂并立波莫尔海商行会"
 oe_ru2.3.a.tt: "赋能波莫尔白海港埠并在诺夫哥罗德拉动5年毛皮与造船物料需求。"
 oe_ru2.3.b: "设立白海公库征收北极商旅重关税"
 oe_ru2.3.b.tt: "立获现金税款并增强财政税收效率十五年。"
 oe_ru2.4.t: "曼加泽亚黄金毛皮与北极海象牙"
 oe_ru2.4.d: "波莫尔探险队沿冰海水道深入鄂毕湾与曼加泽亚，发现遍地珍稀黑貂皮与海象牙矿藏，西方商船愿以成箱白银在白海口岸抢购。诺夫哥罗德商界呼吁组建股份制极地贸易公司，共分北极黄金浪潮。"
 oe_ru2.4.a: "敕立曼加泽亚北极股份商社"
 oe_ru2.4.a.tt: "获二十年丰厚贸易与原料产出红利，并再次点燃诺夫哥罗德市场需求。"
 oe_ru2.4.b: "收归共和国国库专营北极毛皮税"
 oe_ru2.4.b.tt: "立即充盈国库并提升十五年税效与国家集权。"
 oe_ru2.5.t: "沃尔霍夫大桥维彻大钟风潮"
 oe_ru2.5.d: "维彻大钟在阴云下骤然鸣响！索菲亚区与商贸区的波萨德尼克、千人长寡头与平民工匠行会（所谓黑人市民）在沃尔霍夫木桥上剑拔弩张。若不尽快定分止争，大商业共和国将陷入内耗。"
 oe_ru2.5.a: "颁行《新维彻议事宪章》平权工匠行会"
 oe_ru2.5.a.tt: "稳固共和传统、全民识字与市民满意度十五年。"
 oe_ru2.5.b: "借大主教仲裁设立常设执政官团"
 oe_ru2.5.b.tt: "略损共和传统，换取十五年更强控制力与军费效率。"
 oe_ru2.6.t: "大维彻商业宪政定鼎"
 oe_ru2.6.d: "历经波罗的海商战、白海拓航与桥头宪争，诺夫哥罗德大维彻体系已臻成熟。面对莫斯科与立陶宛环伺的欧陆新局，全城各区代表齐集圣索菲亚教堂前，请立共和国百年根本大法。"
 oe_ru2.6.a: "立《大维彻自由商业联邦宪章》"
 oe_ru2.6.a.tt: "获三十年强劲共和传统、商力、贸易收入与识字加成。"
 oe_ru2.6.b: "建制《常设执政理事会国防大法》"
 oe_ru2.6.b.tt: "获三十年集权、税收、陆军士气与外交声望加成。"
 oe_ru2.7.t: "顿河哥萨克请战亚速海口"
 oe_ru2.7.d: "顿河下游哥萨克阿塔曼遣快骑北上呈表：愿率轻舟铁骑突袭亚速（塔纳）海口、扼断草原奴隶贩道，唯请朝廷赐予火药、铅锭与顿河屯堡特许状。若放手出击，必招克里米亚方面剧烈反扑。"
 oe_ru2.7.a: "赐火药粮饷并敕准顿河军团出击亚速"
 oe_ru2.7.a.tt: "安插顿河哥萨克军团、补充人力并获十五年顿河轻骑锐气。"
 oe_ru2.7.b: "严令顿河恪守边约以维黑海外交"
 oe_ru2.7.b.tt: "避免刺激克里米亚，稳步提升威望与国家稳定。"
 oe_ru2.8.t: "扎波罗热拉达与第聂伯河急流堡垒"
 oe_ru2.8.d: "第聂伯河急流之南的扎波罗热拉达（军议会）派出哥萨克使者，愿以坚固的塞契木堡为全罗斯抵挡克里米亚与波立劲旅，请求明文承认塞契自治权；朝中军务官则主张将其编入领饷在册哥萨克团。"
 oe_ru2.8.a: "颁诏承认扎波罗热塞契自治盟约"
 oe_ru2.8.a.tt: "安插扎波罗热哥萨克军团，大幅增强边防防御与人力十八年。"
 oe_ru2.8.b: "耗资编练朝廷直辖在册哥萨克精锐团"
 oe_ru2.8.b.tt: "安插扎波罗热军团并换取十八年军纪、补员与皇权增强。"
 oe_ru2.9.t: "雅伊克军团请领里海渔盐特许"
 oe_ru2.9.d: "驻守乌拉尔河（雅伊克河）畔的雅伊克哥萨克军团奏请免税承揽里海北岸渔场与盐湖开采，以自筹军饷防备诺盖与草原游牧部落越河侵掠。"
 oe_ru2.9.a: "赐予雅伊克军团里海渔盐免税特许"
 oe_ru2.9.a.tt: "安插雅伊克哥萨克军团，获十八年粮产、贸易与敌军损耗加成。"
 oe_ru2.9.b: "将里海盐湖收归国库直征官盐税"
 oe_ru2.9.b.tt: "直接充实国库并提升国家安定。"
 oe_ru2.10.t: "捷列克军团北高加索隘口戍守"
 oe_ru2.10.d: "捷列克河谷的哥萨克哨所呈报：只要朝廷拨付筑堡银两与火枪，便可将北高加索山地隘口连成坚固碉堡链，既挡住南来劫掠，又可打通通往格鲁吉亚正教兄弟邦的山地援道。"
 oe_ru2.10.a: "拨饷筑造北高加索捷列克碉堡防线"
 oe_ru2.10.a.tt: "安插捷列克哥萨克军团，提升陆军传统、要塞维护与外交声望十八年。"
 oe_ru2.10.b: "维持轻装游哨并将精壮编入主力补员"
 oe_ru2.10.b.tt: "免耗国库并直接补充一批后备人力。"
 oe_ru2.11.t: "库班军团黑海东岸屯垦与马市"
 oe_ru2.11.d: "库班草原与塔曼半岛一带的哥萨克骑兵提议在黑海东岸广建骑兵屯堡（斯塔尼察），并与切尔克斯山地部族订立良马互市协约，为全俄骑兵提供源源不断的战马补给。"
 oe_ru2.11.a: "敕建库班屯垦堡并签切尔克斯良马约"
 oe_ru2.11.a.tt: "安插库班哥萨克军团，获十八年补员加速、军费节省与士气加成。"
 oe_ru2.11.b: "将草原牧场收作官营军马场征收租银"
 oe_ru2.11.b.tt: "收取一笔牧场租银并略增陆军传统。"
 oe_ru2.12.t: "叶尔马克与西伯利亚军团越岭拓边"
 oe_ru2.12.d: "名将叶尔马克率领装备火绳枪的西伯利亚哥萨克远征队翻越乌拉尔山脉，直指鄂毕—额尔齐斯流域的喀什里克与托博尔斯克！远征军遣使请颁皇室火药补给与西伯利亚毛皮实物税（牙萨克）敕令。"
 oe_ru2.12.a: "敕授叶尔马克征东全权并颁牙萨克敕令"
 oe_ru2.12.a.tt: "安插西伯利亚哥萨克军团，获二十年围城、毛皮原料与远疆政令加成。"
 oe_ru2.12.b: "命其暂止乌拉尔东麓巩固补给线"
 oe_ru2.12.b.tt: "稳健提升稳定度并补充边防兵员。"
 oe_ru2.13.t: "御定特辖区铁骑规制"
 oe_ru2.13.d: "身披黑袍、鞍挂狗头扫帚徽记的特辖铁骑听候御前号令。彻底粉碎大贵族尾大不掉虽能令皇权登峰造极，却也会令乡邑凋敝、兵源枯竭；若适度收紧或开放缙绅和解泄压阀，则可在集权与生机间取得平衡。"
 oe_ru2.13.a: "档位一：严酷肃清档（极致集权，代价沉重）"
 oe_ru2.13.a.tt: "大幅拉升皇权与控制力、狠压贵族权势，但重创贵族满意、繁荣与人力，并可能引发贵族出逃危机。"
 oe_ru2.13.b: "档位二：节制巡检档（稳健集权，长持平衡）"
 oe_ru2.13.b.tt: "温和提升皇权与税效、适度制约贵族，副作用轻微适合长期维持。"
 oe_ru2.13.c: "档位三：缙绅和解泄压阀（还产复业，休养生息）"
 oe_ru2.13.c.tt: "迅速恢复全国繁荣、人力与贵族满意度，并为和平废除或改制特辖制铺平道路。"
 oe_ru2.14.t: "特辖严刑引发贵族出逃与乡邑荒芜"
 oe_ru2.14.d: "严酷肃清令诸多世袭领主连夜逃往立陶宛边界，遭抄没的田庄乏人耕作，数个州县的农夫亦纷纷流亡南方草原投奔哥萨克。枢密重臣冒死进谏：是乘势抄没全部逃亡贵族田产，还是即刻退回节制巡检档以保国本？"
 oe_ru2.14.a: "决不手软！尽抄叛逃贵族庄园充盈内帑"
 oe_ru2.14.a.tt: "没收大笔财货入库，但重挫安定与贵族满意并恶化对立陶宛关系。"
 oe_ru2.14.b: "见好就收，即刻降档转入《节制巡检档》"
 oe_ru2.14.b.tt: "立即解除严酷档损耗、切至节制巡检档并恢复国家安定。"
 oe_ru2.15.t: "莫洛季大捷与特辖改制和解"
 oe_ru2.15.d: "泄压休养已见成效，全俄贵族与地方军民在御敌大义下重新聚拢。正如莫洛季战役之后废止特辖分治、重合全俄兵马的历史转折，您如今可择定是和平废除特辖制并召开缙绅和解大会，还是将精干特辖旧部改组为近代化御林近卫军。"
 oe_ru2.15.a: "废除特辖制，召开全俄缙绅和解大会"
 oe_ru2.15.a.tt: "和平移除《特辖制》改革，换取高额稳定与二十五年繁荣人力复兴。"
 oe_ru2.15.b: "将特辖精锐改制为常备近代御林军"
 oe_ru2.15.b.tt: "移除《特辖制》改革，锻造二十五年高纪律与高皇权御林近卫军。"
 oe_ru2.15.c: "暂缓废制，继续维持和解泄压阀运行"
 oe_ru2.15.c.tt: "保留《特辖制》改革与当前泄压档修正以备后用。"
