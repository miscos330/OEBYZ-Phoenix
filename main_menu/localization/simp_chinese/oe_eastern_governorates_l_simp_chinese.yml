l_simp_chinese:
 oe_roman_province: "罗马行省"
 oe_roman_province_desc: "行省由御座任命的总督治理，军政文书与地方诉讼归于同一套法度。王朝仍有自己的宫廷与官署，向君士坦丁堡承担臣属之责。"
 oe_heg_reclaim_syria: "重掌叙利亚"
 oe_heg_return_holy_land: "重临圣地"
 oe_heg_egypt_campaign: "埃及战记"
 OE_HEG_SYRIA_COUNTRY: "叙利亚总督区"
 OE_HEG_SYRIA_ADJ: "叙利亚"
 OE_HEG_JERUSALEM_COUNTRY: "耶路撒冷总督区"
 OE_HEG_JERUSALEM_ADJ: "耶路撒冷"
 OE_HEG_EGYPT_COUNTRY: "埃及总督区"
 OE_HEG_EGYPT_ADJ: "埃及"
 OE_HEG_NO_PENDING_GOVERNOR: "上一座总督区的总督已经选定"
 OE_HEG_THREE_CANDIDATES: "东罗马国内至少有三位具备统治资格、不在内阁且不是现任君主的人物"
 OE_HEG_SYRIA_YEAR: "东罗马及其附庸连续军事占领阿勒颇或大马士革超过一年（366天）"
 OE_HEG_JERUSALEM_YEAR: "东罗马及其附庸连续军事占领耶路撒冷超过一年（366天）"
 OE_HEG_ALEXANDRIA_YEAR: "东罗马及其附庸连续军事占领亚历山大超过一年（366天）"
 OE_HEG_LEVANT_OWNERSHIP: "东罗马或其附庸拥有阿勒颇、大马士革和耶路撒冷"
 OE_HEG_ACTIONS_HINT: "总督区从军队实际占领的敌方土地中建立。收复既有领土、独立盟友的占领及尚未攻下的城池均不计入。"
 oe_eastern_governorates.1.t: "御座的任命"
 oe_eastern_governorates.1.d: "[oe_heg_new_country.GetName]的疆界已经划定，地方官署正等候新任总督前来接掌印信。送到御前的三份名册，各有可以托付政事的理由。谁应当离开都城，在新设的行省代表皇帝行使权柄？"
 oe_eastern_governorates.1.defer: "重拟名册，择日再议。"
 OE_HEG_RETRY_GOVERNOR: "原定三位人选均已无法赴任。三十天后重新检查名册，凑齐三位合资格人物后再次呈请任命。"
 oe_eastern_governorates.1.1: "任命[oe_heg_candidate_1.GetName]。（行政[oe_heg_candidate_1.GetAbility('adm')]／外交[oe_heg_candidate_1.GetAbility('dip')]／军事[oe_heg_candidate_1.GetAbility('mil')]）"
 oe_eastern_governorates.1.2: "任命[oe_heg_candidate_2.GetName]。（行政[oe_heg_candidate_2.GetAbility('adm')]／外交[oe_heg_candidate_2.GetAbility('dip')]／军事[oe_heg_candidate_2.GetAbility('mil')]）"
 oe_eastern_governorates.1.3: "任命[oe_heg_candidate_3.GetName]。（行政[oe_heg_candidate_3.GetAbility('adm')]／外交[oe_heg_candidate_3.GetAbility('dip')]／军事[oe_heg_candidate_3.GetAbility('mil')]）"
 OE_HEG_SYRIA_EFFECT: "立即将阿勒颇、多律刻、霍姆斯、拉塔基亚、泰德穆尔、代尔祖尔、沙姆七个省份内东罗马及其直属、间接附庸军事占领的敌方地点划入叙利亚总督区，成为东罗马的#Y 行省化附庸#!。国家采用君主制、罗马文化与东正教，并获得#Y 罗马行省#!改革（实施3天，叛乱度每月−1%，政府改革槽位＋1）。随后从国内符合条件、总能力最高的三位人物中选任总督。"
 oe_heg_reclaim_syria_desc: "从阿勒颇的城门到大马士革的庭院，军队已经为罗马打开了道路。让留驻的官员接过军队的印信，使一时的占领成为持久的治理。\n\n东罗马及其附庸连续军事占领阿勒颇或大马士革超过一年（366天）。\n\n立即将阿勒颇、多律刻、霍姆斯、拉塔基亚、泰德穆尔、代尔祖尔、沙姆七个省份内东罗马及其直属、间接附庸军事占领的敌方地点划入叙利亚总督区，成为东罗马的#Y 行省化附庸#!。国家采用君主制、罗马文化与东正教，并获得#Y 罗马行省#!改革（实施3天，叛乱度每月−1%，政府改革槽位＋1）。随后从国内符合条件、总能力最高的三位人物中选任总督。"
 OE_HEG_SYRIA_DONE: "#G 叙利亚总督区已建立#!"
 OE_HEG_JERUSALEM_EFFECT: "立即将菲拉斯廷、沙拉特、哈夫兰、黎巴嫩四个省份内东罗马及其直属、间接附庸军事占领的敌方地点划入耶路撒冷总督区，成为东罗马的#Y 行省化附庸#!。国家采用君主制、罗马文化与东正教，并获得#Y 罗马行省#!改革（实施3天，叛乱度每月−1%，政府改革槽位＋1）。随后从国内符合条件、总能力最高的三位人物中选任总督。"
 oe_heg_return_holy_land_desc: "圣城的钟声再次越过城墙。朝圣之路需要守护，沿海与内陆的官署也需要一道共同的命令。御座将在此设立新的总督区。\n\n东罗马及其附庸连续军事占领耶路撒冷超过一年（366天）。\n\n立即将菲拉斯廷、沙拉特、哈夫兰、黎巴嫩四个省份内东罗马及其直属、间接附庸军事占领的敌方地点划入耶路撒冷总督区，成为东罗马的#Y 行省化附庸#!。国家采用君主制、罗马文化与东正教，并获得#Y 罗马行省#!改革（实施3天，叛乱度每月−1%，政府改革槽位＋1）。随后从国内符合条件、总能力最高的三位人物中选任总督。"
 OE_HEG_JERUSALEM_DONE: "#G 耶路撒冷总督区已建立#!"
 OE_HEG_EGYPT_EFFECT: "立即将整个埃及大区内东罗马及其直属、间接附庸军事占领的敌方地点划入埃及总督区，成为东罗马的#Y 埃及领地#!。国家采用君主制、罗马文化与东正教，并获得#Y 罗马行省#!改革（实施3天，叛乱度每月−1%，政府改革槽位＋1）。随后从国内符合条件、总能力最高的三位人物中选任总督。"
 oe_heg_egypt_campaign_desc: "亚历山大的港口已经落入我军之手，通向河谷的道路逐渐展开。黎凡特的据点为远征提供了依托，如今应当把埃及的占领地交付一位总督。\n\n东罗马及其附庸连续军事占领亚历山大超过一年（366天）。并须拥有阿勒颇、大马士革和耶路撒冷。\n\n立即将整个埃及大区内东罗马及其直属、间接附庸军事占领的敌方地点划入埃及总督区，成为东罗马的#Y 埃及领地#!。国家采用君主制、罗马文化与东正教，并获得#Y 罗马行省#!改革（实施3天，叛乱度每月−1%，政府改革槽位＋1）。随后从国内符合条件、总能力最高的三位人物中选任总督。"
 OE_HEG_EGYPT_DONE: "#G 埃及总督区已建立#!"
 OE_HEG_SYRIA_PROGRESS: "连续占领：阿勒颇 [GuiScope.SetRoot(GetLocationByKey('aleppo').MakeScope).ScriptValue('oe_heg_hold_duration')|0]／366天；大马士革 [GuiScope.SetRoot(GetLocationByKey('damascus').MakeScope).ScriptValue('oe_heg_hold_duration')|0]／366天"
 OE_HEG_JERUSALEM_PROGRESS: "连续占领：耶路撒冷 [GuiScope.SetRoot(GetLocationByKey('jerusalem').MakeScope).ScriptValue('oe_heg_hold_duration')|0]／366天"
 OE_HEG_EGYPT_PROGRESS: "连续占领：亚历山大 [GuiScope.SetRoot(GetLocationByKey('alexandria').MakeScope).ScriptValue('oe_heg_hold_duration')|0]／366天"
 OE_HEG_GOVERNORATE_LOST: "总督区已不再接受御座的任命。"
