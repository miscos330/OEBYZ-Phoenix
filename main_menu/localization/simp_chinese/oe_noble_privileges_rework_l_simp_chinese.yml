l_simp_chinese:
 oe_noble_household_retinue: "世家扈从"
 oe_noble_household_retinue_desc: "显贵家门的声望，既系于先祖的功业，也系于门下披甲执锐的扈从。准许各家供养精于骑战的亲随，使其在平日护卫宅邸，在战时随皇帝的大旗出征。#Y 家族的荣誉#!将由他们的长矛捍卫，而罗马的军阵也将得到可靠的骑士。"
 oe_noble_imperial_marriages: "紫袍姻亲"
 oe_noble_imperial_marriages_desc: "紫袍的光辉并不止于宫墙。通过与皇室缔结婚姻，名门望族得以跻身皇帝的亲族之列，并在宫廷政务中获得优先的席位。以#Y 姻亲之谊#!联结显贵，使家族之间的往来成为传达旨意、协调政务的纽带。"
 oe_noble_court_dignities: "宫廷荣衔"
 oe_noble_court_dignities_desc: "在罗马的宫廷中，一袭礼服、一项荣衔、一次朝会中的席次，皆昭示着皇帝赐予的尊荣。让显贵以恪守仪典、装点宫廷为荣，使远来的宾客见证帝国的庄严。#Y 尊荣出于皇帝#!，而受荣者亦当增辉于罗马。"
 oe_noble_family_monasteries: "家族修院庇护权"
 oe_noble_family_monasteries_desc: "修院的长明灯照耀着圣像，也照耀着施主与先人的姓名。承认显贵对其资助修院的庇护，使各家得以修缮圣堂、供养修士，并为逝者安置长眠之所。#Y 家族的纪念与教会的祈祷#!由此相系，修院亦得以仰赖显贵的扶持。\n\n每月获得 #G 0.02#! 稳定度。"
 oe_noble_classical_patronage: "古典学馆赞助权"
 oe_noble_classical_patronage_desc: "罗马人的门第不应仅以田产与武备衡量。准许贵族以家族之名资助学馆，延请文人，抄录古籍，使修辞、诗文与绘艺各得其所。显贵将以#Y 学问与风雅#!装点家声，而帝国也不必独自承担供养这些才士的开支。"
 oe_noble_frontier_fortresses: "边堡守备权"
 oe_noble_frontier_fortresses_desc: "山隘与河渡间的城堡，是帝国疆土上沉默的守望者。将部分城堡的修缮、储备与日常守备交托当地显贵，以承认其地方地位换取持续的供给。#Y 守土既是荣誉，亦是义务#!；享有皇帝信任者，应使城垣不坠、烽火不息。"
