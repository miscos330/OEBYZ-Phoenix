l_simp_chinese: 
#=====================================
#bank
#=====================================

oe_byz_bank_org: "帝国银行监会"
oe_byz_bank_org_desc: "该组织负责管理在帝国境内开展业务的所有银行，并直接向皇帝负责"
oe_byz_bank_org_leader_tt_tit: "帝国银行监会的职责"
oe_byz_bank_org_leader_tt_desc: "帝国银行监会是[GetCountry('BYZ').GetName]对国内经济进行宏观调控的有力工具\n帝国银行监会不由帝国统治者直接运行，而是由银监会的总监代理，总监完全由皇帝的旨意决定，从帝国银行的行长中产生\n银监会总监人物属性提供以下#G 修正#!\n#bold #color_yellow 行政100#!#!：税收效率10％\n#bold #color_yellow 外交100#!#!：银行利率-2％\n#bold #color_yellow 军事100#!#!：贷款容量20％"

oe_byz_bank_org_leader_name: "监会总监"
oe_byz_bank_org_leader_name_MALE: "#color_yellow 监会责任银行#!"

oe_byz_bank_org_big_bank_pay: "监会向下辖银行收费"
oe_byz_bank_org_big_bank_pay_desc: "监会有权向下辖的所有银行收费"
oe_byz_bank_org_leader_pay: "监会向帝国缴费"
oe_byz_bank_org_leader_pay_desc: "帝国境内的所有银行都应向中央缴纳收入的一部分"

oe_bank_org_byz: "帝国中央"
oe_bank_org_byz_desc: "这个成员是东罗马帝国中央，对监会拥有绝对的权力"
oe_bank_org_big_bank: "监会总行"
oe_bank_org_big_bank_desc: "这个成员是皇帝钦定的帝国特许银行，负责监会业务的正常开展"


oe_byz_org_rebuy_money: "回笼货币"
oe_byz_org_rebuy_money_desc: "我们超发货币的行为已经造成了居高不下的通胀，让我们以政府名义进口一批基本物资，通过出售物资，来平抑物价，并将社会上泛滥的货币回笼国库，减少流通性"

oe_byz_org_build_saisa_bank: "创办塞萨洛尼基铸币特许银行"
oe_byz_org_build_saisa_bank_desc: "帝国最大的铸币厂之一就坐落在塞萨洛尼基，让我们以当地繁荣的铸币业务为保证，开办一家掌握铸币特权的国有银行"
oe_byz_org_build_saisa_bank_tt: "我们将在塞萨洛尼基创立一个新的银行建筑国家"
oe_byz_org_build_saisa_bank_over: "已创办塞萨洛尼基铸币银行"
TSBK: "塞萨洛尼基铸币"

oe_byz_org_build_genoa_bank: "接手热那亚圣乔治银行"
oe_byz_org_build_genoa_bank_desc: "热那亚拥有繁荣而成熟的金融业，让我们直接接管他们的原中央银行"
oe_byz_org_build_genoa_bank_over: "已创办热那亚圣乔治银行"
oe_byz_org_build_genoa_bank_tt: "我们将在热那亚创立一个新的银行建筑国家"
GEBK: "圣乔治"

oe_byz_org_build_ven_bank: "接手威尼斯公共银行"
oe_byz_org_build_ven_bank_desc: "在雪耻1204年的一箭之仇后，我们也并未忘记威尼斯曾是一个极度繁荣的商业国家，让我们在威尼斯的废墟上重建经济"
oe_byz_org_build_ven_bank_over: "已创办威尼斯公共银行"
oe_byz_org_build_ven_bank_tt: "我们将在威尼斯创立一个新的银行建筑国家"
VEBK: "威尼斯公共"

oe_byz_org_build_annatolia_bank: "创办安纳托利亚农业银行"
oe_byz_org_build_annatolia_bank_desc: "安纳托利亚自古以来就拥有巨大的农业潜力，在驱逐突厥人后，我们要将这里重新建设为流淌着奶与蜜之地。一个专注于投资安纳托利亚农业产业的银行将与小亚细亚互相成就"
oe_byz_org_build_annatolia_bank_over: "已创办安纳托利亚农业银行"
oe_byz_org_build_annatolia_bank_tt: "我们将在安卡拉创立一个新的银行建筑国家"
ATBK: "安纳托利亚农业"

oe_byz_org_build_diodro_bank: "创办黑海银行"
oe_byz_org_build_diodro_bank_desc: "克里米亚半岛被誉为黑海上的珍珠，牵涉着繁荣的黑海贸易，这座将总部建立在黑海对岸的银行将与黑海贸易深度绑定，并代我们同斯拉夫人和鞑靼人打交道"
oe_byz_org_build_diodro_bank_over: "已创办黑海银行"
oe_byz_org_build_diodro_bank_tt: "我们将在狄奥多罗创立一个新的银行建筑国家"
DOBK: "黑海"

oe_byz_org_build_ath_bank: "创办雅典报业银行"
oe_byz_org_build_ath_bank_desc: "印刷机的发明在我国吹起了变革之风，我国蓬勃发展的印刷，教育，新闻和学术行业催生了这座以投资文化行业为主的银行"
oe_byz_org_build_ath_bank_over: "已创办雅典报业银行"
oe_byz_org_build_ath_bank_tt: "我们将在雅典创立一个新的银行建筑国家"
YDBK: "雅典报业"

oe_byz_org_build_lifant_bank: "创办黎凡特商业银行"
oe_byz_org_build_lifant_bank_desc: "黎凡特地区自古就是商栗云集之地，国际商队贸易的长期性和高风险天然就需要银行开展保险业务，但当地的金融行业却因为伊斯兰教义的束缚停滞不前"
oe_byz_org_build_lifant_bank_over: "已创办黎凡特商业银行"
oe_byz_org_build_lifant_bank_tt: "我们将在黎巴嫩创立一个新的银行建筑国家"
LFBK: "黎凡特商业"

oe_byz_org_build_egypt_bank: "创办尼罗河银行"
oe_byz_org_build_egypt_bank_desc: "时隔一千年，我国终于再次回到了美丽富饶的埃及地区，让我们在亚历山大港口设立一座官方背景深厚的国有银行"
oe_byz_org_build_egypt_bank_over: "已创办尼罗河银行"
oe_byz_org_build_egypt_bank_tt: "我们将在亚历山大创立一个新的银行建筑国家"
EGBK: "尼罗河"

oe_byz_org_build_roman_bank: "创办罗马中央银行"
oe_byz_org_build_roman_bank_desc: "如果要问还有哪座城市的重要性在我们心中比得上君士坦丁堡，那一定就是罗马了。罗马的金融总部完全是按照最高级别创办的，在所有银行中拥有特殊的超然地位"
oe_byz_org_build_roman_bank_over: "已创办罗马中央银行"
oe_byz_org_build_roman_bank_tt: "我们将在罗马创立一个新的银行建筑国家"
ROBK: "罗马中央"

oe_byz_org_build_nor_afrac_bank: "创办迦太基银行"
oe_byz_org_build_nor_afrac_bank_desc: "和古典时期相比，现在的北非真是面目全非，但我们亲切的迦太基故地依然是一处贸易良地"
oe_byz_org_build_nor_afrac_bank_over: "已创办迦太基银行"
oe_byz_org_build_nor_afrac_bank_tt: "我们将在突尼斯创立一个新的银行建筑国家"
NFBK: "迦太基"

oe_byz_org_build_sisic_bank: "创办西西里矿业银行"
oe_byz_org_build_sisic_bank_desc: "西西里曾经是我们重要的农业行省，但如今同样以非凡的矿业潜力著称，当地的硫磺矿供给着我们重要的火药生产"
oe_byz_org_build_sisic_bank_over: "已创办西西里矿业银行"
oe_byz_org_build_sisic_bank_tt: "我们将在巴勒莫创立一个新的银行建筑国家"
SSBK: "西西里矿业"

oe_byz_org_tuozhan_bank: "鼓励开办分行"
oe_byz_org_tuozhan_bank_desc: "我们应当帮助下属银行开办分行，以获取更多利润"
oe_byz_org_tuozhan_bank_tt: "我们将花费300金币帮助选择的银行在特定地点开办分行"

oe_byz_org_money_king_face: "发行君主头像铸币"
oe_byz_org_money_king_face_desc: "在铸币上雕刻精美的君主头像，能随时提醒臣民们对君主的忠诚，并加强政府正统性"

oe_byz_org_build_ven_bank_action: "组织大宗贸易"
oe_byz_org_build_ven_bank_action_desc: "由官方直接组织的贸易将为我们带来额外收入"

oe_byz_org_build_genoa_bank_action_I: "发行五年期国债"
oe_byz_org_build_genoa_bank_action_I_desc: "我们从热那亚的银行业中受益良多，并计划发行更加正规的国债"

oe_byz_org_build_genoa_bank_action_II: "强制议息"
oe_byz_org_build_genoa_bank_action_II_desc: "我们的财务情况出现了一点点小问题，因此我们要求帝国特许银行抹除对我们的贷款利息，他们别无选择！"

oe_byz_org_build_genoa_bank_action_III: "强制债务重组"
oe_byz_org_build_genoa_bank_action_III_desc: "我们的财务情况不容乐观，显然帝国特许银行应当为帝国经济作出一些牺牲"


oe_byz_org_build_roman_bank_action_I: "发行十年期国债"
oe_byz_org_build_roman_bank_action_I_desc: "随着我国金融行业的逐渐成熟，在收复罗马后，投资者对我国的信心亦日益增强"

oe_byz_org_build_roman_bank_action_II: "购买债权"
oe_byz_org_build_roman_bank_action_II_desc: "债权亦是可被交易的资产，我国会物色并购入一些优质债权"
oe_byz_org_build_roman_bank_action_II_tt: "以本金价格收购目标债权"

#=====================================
#policy_org
#=====================================

oe_byz_policy_org: "帝国近卫大区政务院"
oe_byz_policy_org_desc: "承袭晚期罗马《百官志》四级行政法统的帝国中枢政务院，统筹东方、伊利里库姆、意大利与非洲、高卢四大近卫大区与十二古典管区的文武职守，分担光复后的帝国重负。"

oe_byz_policy_org_leader_tt_desc: "#bold 帝国近卫大区政务院（Sacrum Consistorium）#!\n已建制近卫大区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_prf_active_prefectures')|0]#! / 4　已设古典管区：#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_prf_active_dioceses')|0]#! / 12\n每月光复之重减免：#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_prf_strain_relief')|2]#!\n文治行省重税赋与减负，军管总督与罗马盟邦重边防与兵源；两者各有所得，亦各有代价。"
oe_byz_policy_org_leader_tt_tit: "近卫大区政务院"

oe_byz_plicy_org_leader_pay: "俸禄"
oe_byz_plicy_org_leader_pay_desc: "这是东罗马每月向官员支付的工资"

# PAUSED: oe_byz_plicy_org_ldec_corrupt_pay: "打击腐败"
# PAUSED: oe_byz_plicy_org_ldec_corrupt_pay_desc: "这是我们用于打击腐败的支出"

oe_byz_policy_org_real_power_country: "实权大区总督府"
oe_byz_policy_org_real_power_country_desc: "承担近卫大区或总督区实际军政事务并领取政务院俸禄的帝国实权辖区"

oe_byz_policy_org_real_empire_king: "奥古斯都御前枢密"
oe_byz_policy_org_real_empire_king_desc: "罗马皇帝总揽帝国近卫大区政务院的敕封、改制与文武制衡之权"

oe_byz_policy_org_low_power_country: "外圈罗马盟邦"
oe_byz_policy_org_low_power_country_desc: "在政务院登记入册的边疆盟邦与罗马友邦国王，负边防协守与岁贡之责"

oe_byz_policy_org_build_valuns_water: "修缮瓦伦斯水道桥"
oe_byz_policy_org_build_valuns_water_desc: "自拉丁帝国时期以来，瓦伦斯水道桥一直没有得到良好的维护与修缮，如果我们希望确保这一设施继续为我们服务，我们就必须修复它"
oe_byz_policy_org_build_valuns_water_text: "瓦伦斯水道桥一共可以进行四次重大修复，每次修复获得一级建筑等级"

oe_byz_policy_org_romenization_culture: "罗马化"
oe_byz_policy_org_romenization_culture_desc: "罗马化指罗马帝国对其统治地区的文化、语言、法律和社会结构等方面的影响与融合过程"
oe_byz_policy_org_romenization_culture_text: "在[target_area.GetName]对[target_culture.GetName]文化推行罗马化"

oe_byz_policy_org_build_underground_water: "修缮地下水宫"
oe_byz_policy_org_build_underground_water_desc: "瓦伦斯水道桥引入的淡水会先行储存于地下水宫中，然后再供全城人取用。"
oe_byz_policy_org_build_underground_water_text: "地下水宫一共可以进行四次重大修复，每次修复获得一级建筑等级"

oe_byz_policy_org_build_oe_byz_constantinople_university: "扩建君士坦丁大学"
oe_byz_policy_org_build_oe_byz_constantinople_university_desc: "君士坦丁大学是我国最久负盛名的至高学府，让我们好好扩建这所学校，以为我国培养更多人才"
oe_byz_policy_org_build_oe_byz_constantinople_university_text: "扩建君士坦丁大学将解锁让“少年”人物进入大学进修的人物互动"

oe_byz_policy_org_build_oe_byz_constantinople_rome_university: "扩建新罗马牧首大学"
oe_byz_policy_org_build_oe_byz_constantinople_rome_university_desc: "新罗马牧首大学是首都内最好的神学院之一，在普世牧首的提议下，我们决定对这所大学进行扩建"
oe_byz_policy_org_build_oe_byz_constantinople_rome_university_text: "为人物互动“送入大学进修”解锁更多选项"

oe_byz_policy_org_build_oe_byz_constantinople_great_arena: "修复大跑马场"
oe_byz_policy_org_build_oe_byz_constantinople_great_arena_desc: "君士坦丁堡的大跑马场是整个城市的活动中心，也是我国最骄傲的建筑之一，其中保存了诸多古老的艺术品，彰显着我国过去的辉煌"
oe_byz_policy_org_build_oe_byz_constantinople_great_arena_text: "我们将修复大跑马场，他将成为独特的市中心广场，而不是用来举办跑马比赛"

oe_byz_policy_org_build_oe_byz_constantinople_big_palace: "修复大皇宫"
oe_byz_policy_org_build_oe_byz_constantinople_big_palace_desc: "君士坦丁堡的大皇宫曾在1204年受到严重破坏，为了帝国的荣耀，我们必须修复这里"
oe_byz_policy_org_build_oe_byz_constantinople_big_palace_text: "修复大皇宫"

oe_byz_policy_org_build_oe_byz_constantinople_rebuild_port: "清理淤积港口"
oe_byz_policy_org_build_oe_byz_constantinople_rebuild_port_desc: "君士坦丁堡南侧的港口曾经千帆竞过，但如今却因为长期缺乏维护与严重淤积被废弃，让我们派遣劳工清理淤积，恢复港口的繁荣"
oe_byz_policy_org_build_oe_byz_constantinople_rebuild_port_text: "解锁普罗潘提斯港口"

oe_byz_policy_org_orthdox_win: "宣布东西方教会归一"
oe_byz_policy_org_orthdox_win_desc: "随着我国完全收复五大牧首区，东西方基督教会大分裂的历史将成为过去"
oe_byz_policy_org_orthdox_win_text: "开启文化认同运动#Y 东西教会合一#!"

#=====================================
#rus_church
#=====================================

rus_religion: "罗斯教会"
rus_religion_desc: "从基辅到莫斯科，罗斯地区的教会在法理上依然是君士坦丁普世牧首区下的一分子，被视为都主教区。自基辅罗斯受洗以来，罗斯人一直虔诚地信仰正教，是我国曾经强大的宗教影响力留下的辉煌遗产之一"

rus_religion_leader_tt_tit: "罗斯教会"
rus_religion_leader_tt_desc: "和罗斯教会重新建立联系对我们好处很多，罗斯教会每年需要向我们支付高额的主教任命费和宗教法庭诉讼费，为我们提供忠诚的外籍士兵，来自罗斯的贸易品如蜂蜡和木材也能获得贸易优惠。如果有必要，我们还能号召罗斯诸大公为我们而战。\n但尽管我国在文化和宗教上处于难以撼动的优势地位，我们仍需注意不应对这群离我们天高路远的罗斯诸公为所欲为，否则他们可能会像反叛蒙古人一样反抗我们"

rus_tithe: "罗斯教会信仰税"
rus_tithe_desc: "东正教并不像天主教那样直接征收什一税，而是通过主教任命费，宗教法庭诉讼费，主持宗教活动费用和开办神学院等方式获得信仰收入"

rus_religion_king: "普世牧首"
rus_religion_king_desc: "这个国家可以任命普世牧首，是牧首区的领导者"
rus_religion_mos_members: "都主教区"
rus_religion_mos_members_desc: "这个国家可以任命罗斯都主教，是罗斯地区教会的实际领导者"
rus_religion_normal_members: "教区"
rus_religion_normal_members_desc: "这个国家的教会属于普世牧首区的一个普通教区"

rus_religion_action_mongu_scare: "鞑靼枷锁下的罗斯教会"
rus_religion_action_mongu_scare_desc: "罗斯教会目前处于蒙古人屠刀的恐惧阴影下，大草原上游荡着可怖的游牧军队，在罗斯人解开鞑靼枷锁之前，我们与罗斯教会的联系微乎其微"

rus_religion_action_call_rus_for_war: "召唤罗斯人参战"
rus_religion_action_call_rus_for_war_desc: "我们可以发挥我们的宗教影响力，召唤罗斯人为我们而战"

rus_religion_action_own_all_fur_trade: "垄断黑海毛皮贸易"
rus_religion_action_own_all_fur_trade_desc: "东斯拉夫人控制着大量的毛皮产地，随着我国控制了黑海沿岸所有主要河流的出海口，我们可以利用我们的影响力，与罗斯诸国签订贸易条约，在黑海毛皮贸易中建立垄断地位"
rus_religion_action_own_all_fur_trade_tt: "东方贸易局势中所有的毛皮贸易现在由我们进行垄断"

rus_religion_action_hold_religion_active: "主持宗教会议"
rus_religion_action_hold_religion_active_desc: "我们应邀为罗斯教会举办宗教会议，会议一般会持续几天至数周，用于进行神学辩论，宣扬福音以及颁布教区的政策方针等等"
rus_religion_action_hold_religion_active_tt: "#Y 每个教区成员将获得+5正统性和+3稳定度#!"

rus_religion_action_student_form_rus: "文化霸权"
rus_religion_action_student_form_rus_desc: "东罗马独特的文化，艺术和文学在罗斯各国的上层社会中掀起了一股热潮，越来越多的罗斯上流阶层开始购买东罗马的艺术品，将后代送往君士坦丁波利斯的大学学习，前往圣索菲亚大教堂朝圣等等，为我国带来了大量收入"
rus_religion_action_student_form_rus_tt: "我们现在可以从罗斯诸国的市民阶层与贵族阶层获得信仰收入"

#=====================================
#empire_theme_org
#=====================================

oe_byz_empire_pillars: "帝国柱石"
 oe_byz_empire_pillars_desc: "#italic “帝国不止于一顶冠冕，亦在于支撑冠冕的诸柱。”#!\n\n君士坦丁堡的御座承续罗马的尊位，豪族、军区与附庸则握有使诏命成真的财力与兵力。#Y 帝国柱石#!将诸方召集于同一秩序之下：进奉与恩赏在此交汇，忠诚与野心亦在此较量。"

oe_byz_empire_theme_org_leader_tt_tit: "帝国双刃剑"
oe_byz_empire_theme_org_leader_tt_desc: "我们需要每月为帝国军队提供军饷，维护费高低会严重影响部队士气的高低\n东罗马政治是基于世袭正统与现实势力的平衡，野心勃勃的军区将军可能会酿成王朝倾覆"

oe_pillars_empire: "帝国"
 oe_pillars_empire_desc: "紫袍、冠冕与金玺归于君士坦丁堡。#Y 拜占庭皇帝及中央政府#!居帝国柱石之首，执掌诏命，裁定帝国诸务。"
oe_pillars_theme: "军区"
 oe_pillars_theme_desc: "军区将领以军政之权守土，以军饷与兵籍受制于御座。具有#Y 军区政府改革#!的成员列于此席，并承接中央的粮饷与兵源拨付。"

oe_byz_empire_theme_org_leader_pay_for_army: "军区军饷"
 oe_byz_empire_theme_org_leader_pay_for_army_desc: "#italic “领御座之饷，当为御座守土。”#!\n\n中央按拨付比例供养军区部队。饷银是否如期送达，将影响诸军的维护负担、士气与对御座的忠顺。\n领取份额仅按各领取国的陆军规模分配。"
oe_byz_empire_theme_org_leader_pay_for_soldier: "兵源"
 oe_byz_empire_theme_org_leader_pay_for_soldier_desc: "兵籍由文书登记，兵员从乡里征集。中央与军区的#Y 兵源拨付#!，决定何处的壮丁将被编入地方军伍。\n拨付基数按时代调整：传统时代×0.4、文艺复兴时代×0.6、地理大发现时代×0.8、宗教改革时代×1、专制主义时代×1.2、大革命时代×1.5。\n领取份额仅按各领取国的陆军规模分配。"

oe_byz_empire_org_action_abolish_theme: "裁撤军区"
 oe_byz_empire_org_action_abolish_theme_desc: "一方军政之权，本出于御座的授予。今当收回[target_country.GetName]的军区建制，使其权柄复归中央。\n\n#Y 裁撤之前，应审视该军区的领属与兵力。#!\n\n消耗#Y 5权威#!。不消耗民意或内帑金币。"

oe_byz_empire_org_action_abolish_army: "下令裁军"
 oe_byz_empire_org_action_abolish_army_desc: "军额若任意扩张，府库终将不堪其重。向[target_country.GetName]颁下裁军之令，削减地方拥兵，使饷册与帝国的财力相称。\n\n不消耗权威、民意或内帑金币。"

oe_byz_empire_org_action_abolish_ruler: "进京述职"
 oe_byz_empire_org_action_abolish_ruler_desc: "传诏军区将领入京，在御座前陈述任内政绩，听候裁处。现任将领卸任后迁回东罗马，由军区现行继承制度产生继任者。我们须先掌握其部属与往来的消息：#Y 间谍网须大于20#!。\n\n消耗#Y 1点权威#!；不消耗民意或内帑金币。"

oe_byz_empire_org_action_create_pronia_infastry: "普罗尼亚征召"
 oe_byz_empire_org_action_create_pronia_infastry_desc: "受普罗尼亚收益供养之人，当以军役偿还御座的恩典。征召当地兵员，使他们携械列队，为帝国出征。\n\n征召后，当地#Y 三年内不可再次召集征召兵#!。\n\n不消耗权威、民意或内帑金币。"

# PAUSED: oe_byz_roman_world_estate_tax: "中饱私囊"
# PAUSED:  oe_byz_roman_world_estate_tax_desc: "税银从乡里送往府库，须经过不止一双手。官僚以差费、惯例与人情之名截留部分收入；#Y 腐败越深，截留越重#!。"

#=====================================
#oe_byz_roman_world
#=====================================

oe_byz_roman_world: "罗马文明圈"
oe_byz_roman_world_desc: "以#Y 君士坦丁堡#!为中心，罗马的城镇、信仰与政治传统仍将周边诸国联系在一起。皇帝、贝伊、专制公与拉丁领主彼此争战，也沿用着同一片土地留下的道路、商路与制度。\n\n组织领袖始终为#Y 君士坦丁堡的拥有者#!。圈内成员相互侵略产生的侵略扩张#G −66%#!；外部国家侵略成员时，侵略扩张#R ＋25%#!。"
oe_byz_roman_world_byz: "罗马正统"
oe_byz_roman_world_byz_desc: "君士坦丁堡仍是罗马政治传统的中心。#Y 拥有君士坦丁堡的国家#!独占这一地位；城市易主，正统之席也随之转移。军事占领本身不会改变归属。"
oe_byz_roman_world_prince: "专制公"
oe_byz_roman_world_prince_desc: "罗马的宫廷称号与统治传统，在分立的希腊诸国中延续。凡#Y 主流文化属于希腊文化组#!的成员，均列于此类；无需成为罗马正统的附庸。"
oe_byz_roman_world_minor: "小国"
oe_byz_roman_world_minor_desc: "这个国家是最默默无闻的小国"

oe_byz_roman_world_grand_beylik: "突厥大贝伊国"
oe_byz_roman_world_grand_beylik_desc: "这是突厥国家中的强国"

oe_byz_roman_world_beylik: "突厥贝伊国"
oe_byz_roman_world_beylik_desc: "安纳托利亚的贝伊们依靠军队、城镇和边疆人群建立权势，各自谋求更广阔的领土。凡主流文化为#Y 土耳其文化或突厥蛮文化#!的成员，均列于此类。"
oe_byz_roman_world_regional_power: "区域强国"
oe_byz_roman_world_regional_power_desc: "这是文明圈中佼佼者，具有较强的区域影响力"

oe_byz_roman_world_subject: "附属国"
oe_byz_roman_world_subject_desc: "这是正统罗马的属国"

oe_byz_roman_world_latin_duchy: "拉丁公国"
oe_byz_roman_world_latin_duchy_desc: "十字军、海上贸易和远来的领主，在东方留下了拉丁人的领地。#Y 首都位于巴尔干或安纳托利亚#!，且主流文化属于#Y 法兰西、伊比利亚或意大利文化组#!的成员，均列于此类。"