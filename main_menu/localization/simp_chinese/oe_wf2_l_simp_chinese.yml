l_simp_chinese:
 STATIC_MODIFIER_NAME_oe_wf2_mod_strict_haijin:0 "嘉靖严厉海禁"
 STATIC_MODIFIER_DESC_oe_wf2_mod_strict_haijin:0 "朝廷严申寸板不得下海之禁，强化海防封锁与海岸守御并压制倭寇滋生，然东南远洋海贸效率大跌且沿海商民怨声载道。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_regulated_sea_trade:0 "通市弭盗·权开互市"
 STATIC_MODIFIER_DESC_oe_wf2_mod_regulated_sea_trade:0 "采纳通市弭盗之议，准许登记海商凭引互市以化盗为商，提振海贸与商帮活力，然边海直控稍缓并招致保守士绅非议。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_silver_exchange:0 "东洋白银官兑抽分"
 STATIC_MODIFIER_DESC_oe_wf2_mod_silver_exchange:0 "设官炉抽分稽核东洋流银，使户部银库与商税大增，然白银骤涌推升物价通胀并引发守旧乡绅不安。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_wang_zhi_amnesty:0 "胡宗宪招抚徽王汪直"
 STATIC_MODIFIER_DESC_oe_wf2_mod_wang_zhi_amnesty:0 "总督胡宗宪力排众议信守招抚之约，以汪直旧部羁縻外洋群盗、疏通海路，然遭言官弹劾致使朝廷威望与皇权威严受挫。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_yiwu_qi_army:0 "戚家军·义乌矿徒新兵"
 STATIC_MODIFIER_DESC_oe_wf2_mod_yiwu_qi_army:0 "戚继光弃腐朽卫所、招募浙东义乌质朴矿徒农夫成军，严明军法使纪律、士气与兵员恢复齐升，唯足额现银募饷开销颇重。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_yuanyang_tactics:0 "鸳鸯阵与《纪效新书》操典"
 STATIC_MODIFIER_DESC_oe_wf2_mod_yuanyang_tactics:0 "推广十二人协同作战的鸳鸯阵与《纪效新书》实操军法，以长短兵器相济克制倭寇狂突，士气、防御与陆军传统俱振，军费维护随之增加。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_longqing_open_ports:0 "隆庆开关·月港通洋新章"
 STATIC_MODIFIER_DESC_oe_wf2_mod_longqing_open_ports:0 "敕准漳州月港开海颁引、准贩东西二洋，从根源化私为官、广纳海外白银与税入，唯沿海戒备略缓且守旧勋绅仍有微词。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_wokou_pacified:0 "东南海疆靖平"
 STATIC_MODIFIER_DESC_oe_wf2_mod_wokou_pacified:0 "自浙东至闽广倭患肃清，海防水师常备巡弋、商埠百业复苏，海权存在、海贸效率与社会稳定稳步提升，唯水师常饷仍需维系。"
 STATIC_MODIFIER_NAME_oe_wf2_loc_shuangyu_smuggling:0 "双屿走私秘港"
 STATIC_MODIFIER_DESC_oe_wf2_loc_shuangyu_smuggling:0 "武装私商、海盗与番舶云集外洋港汊，虽暗中滋长商货流转，却严重侵蚀朝廷地方控制并招致倭患频发。"
 STATIC_MODIFIER_NAME_oe_wf2_loc_coastal_bastion:0 "东南海防石城卫堡"
 STATIC_MODIFIER_DESC_oe_wf2_loc_coastal_bastion:0 "花岗岩海防卫城、烽燧联防与常备炮台扼守要冲，大幅增强本地守御并震慑海盗登岸。"
 STATIC_MODIFIER_NAME_oe_wf2_loc_yuegang_customs:0 "月港督饷市舶司"
 STATIC_MODIFIER_DESC_oe_wf2_loc_yuegang_customs:0 "持引洋船依例验税出入东西二洋，商货云集、白银内流，令本港成为东南繁荣海贸枢纽。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_shushui_gongsha:0 "束水攻沙·蓄清刷黄"
 STATIC_MODIFIER_DESC_oe_wf2_mod_shushui_gongsha:0 "推行潘季驯缕堤遥堤与高家堰蓄清刷黄之策，以猛流束沙入海，保障黄淮农收、繁荣与中枢控制，唯岁修河工常年耗银颇多。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_canal_grain_security:0 "淮安漕运总督·南粮北调"
 STATIC_MODIFIER_DESC_oe_wf2_mod_canal_grain_security:0 "淮安漕运枢纽闸坝畅通、岁运百万石江南漕粮直抵通州，陆贸、粮产与天命威望并进，唯漕司岁费相应增加。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_paid_dike_labor:0 "雇役修河·折银代徭"
 STATIC_MODIFIER_DESC_oe_wf2_mod_paid_dike_labor:0 "改行官雇民夫修筑黄淮堤防以代严苛徭役，深得乡农拥护并提升河工效率，唯财政岁入净额略有收缩。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_river_neglect_crisis:0 "河政废弛·黄淮决口"
 STATIC_MODIFIER_DESC_oe_wf2_mod_river_neglect_crisis:0 "河工银两挪用废弛致堤坝失修决口，黄淮农田受淹、漕运梗阻，粮产、民心与天命威望齐遭重创。"
 STATIC_MODIFIER_NAME_oe_wf2_loc_yellow_river_flood:0 "黄河决口漫溢"
 STATIC_MODIFIER_DESC_oe_wf2_loc_yellow_river_flood:0 "浑浊黄水冲毁堤防漫灌州县，良田成泽、道路闸口中断，本地粮产与控制力骤降。"
 STATIC_MODIFIER_NAME_oe_wf2_loc_gaojia_dike_fortified:0 "高家堰石工固堤"
 STATIC_MODIFIER_DESC_oe_wf2_loc_gaojia_dike_fortified:0 "坚固石工堰坝与减水闸牢锁洪泽清流，保障江淮灌溉丰收与漕运通畅。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_fengshan_zenith:0 "泰山封禅·受命告天"
 STATIC_MODIFIER_DESC_oe_wf2_mod_fengshan_zenith:0 "天子登临岱岳告祭天地，四海咸服、正统与文教辐射大盛，唯大典仪仗与沿途赏赐耗银颇巨。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_salt_tea_treasury:0 "开中盐引与茶马互市"
 STATIC_MODIFIER_DESC_oe_wf2_mod_salt_tea_treasury:0 "盐商输粮换引与川陕茶马官市并举，国库税入与内陆商路俱丰，然官价专卖加重民间盐茶日用负担。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_osmanli_charter:0 "双罗马宽容宪章"
 STATIC_MODIFIER_DESC_oe_wf2_mod_osmanli_charter:0 "苏丹颁布双罗马宪章保障希腊正教与拉丁城邦法统，显著增进异教宽容、文化容量与外交声望，却引发保守教法阶层强烈抵触。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_osmanli_kanun_juris:0 "律法合纂·双语帝国枢密院"
 STATIC_MODIFIER_DESC_oe_wf2_mod_osmanli_kanun_juris:0 "将奥斯曼卡农法典与罗马民法大全合纂并推行双语枢密院治理，内阁、税政与立法俱进，唯宫廷运转开支与旧贵族怨望同升。"
 STATIC_MODIFIER_NAME_oe_wf2_mod_osmanli_rome_crown:0 "奥索马尼罗马皇冠（罗马凯撒）"
 STATIC_MODIFIER_DESC_oe_wf2_mod_osmanli_rome_crown:0 "以宽容共治之大统融汇君士坦丁堡与罗马双都，奥斯曼皇室加冕为贯通东西地中海之奥索马尼罗马凯撒，威望、正统、宽容与士气俱隆，然保守教士怨望与帝国仪典耗费甚巨。"
 oe_wf_dis_wokou_raids:0 "嘉靖东南倭患"
 oe_wf_dis_wokou_raids_desc:0 "武装私商、沿海游民与东洋浪人结伙盘踞双屿至漳泉外洋，屡犯浙直闽广富庶州县。唯有整编戚家军新旅、广筑沿海卫堡并妥善化解海禁与通市之争，方能彻底靖平东南海疆。"
 oe_wf2_cab_coastal_pacification:0 "东南海防靖倭"
 oe_wf2_cab_coastal_pacification_desc:0 "简派总督军门整饬州县烽燧、巡海哨船与海防卫所，显著提升本地控制与城防并大幅压制倭寇滋生，唯水师军费与沿海商民管控成本相应上升。"
 oe_wf2_cab_coastal_pacification_action:0 "执行：东南海防靖倭"
 oe_wf2_cab_coastal_pacification_active:0 "正在执行：东南海防靖倭"
