 oe_wf2_cab_river_hydraulics:0 "黄淮河工与漕运疏浚"
 oe_wf2_cab_river_hydraulics_desc:0 "派遣河道衙门与水利官匠修固黄淮堤防、疏浚运河闸坝以护南粮北运，提升本地粮产、繁荣与陆贸效率，然河工银两与乡农役担随之增加。"
 oe_wf2_cab_river_hydraulics_action:0 "执行：黄淮河工与漕运疏浚"
 oe_wf2_cab_river_hydraulics_active:0 "正在执行：黄淮河工与漕运疏浚"
 oe_wf2_cab_river_hydraulics_action_progress:0 "黄淮河工与漕运疏浚进度"
 oe_wf2_cab_river_hydraulics_action_progress_wordier:0 "黄淮河工与漕运疏浚正在推进"
 oe_wf2_cab_river_hydraulics_action_progress_long_wordier:0 "河工官匠正以石料加筑堤坝并清理大运河闸口淤泥。"
 oe_wf2_cab_river_hydraulics_action_progress_tooltip:0 "黄淮河工与漕运疏浚的当前进展"
 oe_wf2_cab_river_hydraulics_select_province:0 "选择兴修河工的省份"
