 oe_wf2_cab_coastal_pacification_action_progress_long_wordier:0 "海防官兵正清剿海汊贼巢、修缮卫城海塘并核验港埠船籍。"
 oe_wf2_cab_coastal_pacification_action_progress_tooltip:0 "东南海防靖倭的当前进展"
 oe_wf2_cab_coastal_pacification_select_province:0 "选择执行海防靖倭的省份"
