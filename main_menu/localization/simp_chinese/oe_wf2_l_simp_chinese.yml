 oe_wfm_bld_grand_canal_huaian:0 "淮安大运河漕运总督署"
 oe_wfm_bld_grand_canal_huaian_desc:0 "坐落江苏淮安（山阳）的漕运总督衙署与清口水运枢纽，扼守大运河横渡黄淮之咽喉，统筹江南岁漕北上并极大兴盛江淮粮产、商容与控驭。"
 oe_wf2_dec_appoint_river_commissioner.title:0 "简派河道总督·推行束水攻沙"
 oe_wf2_dec_appoint_river_commissioner.desc:0 "斥银 #Y 100#!（15年冷却）钦命河道总督师法潘季驯「束水攻沙、蓄清刷黄」之策，加筑高家堰、解除河政废弛危机，并在建成淮安大运河漕运总督署时获得额外漕运与天命联动增益。"
 oe_wf2_dec_appoint_river_commissioner.a:0 "敕命河道总督全面整修黄淮堤防"
 oe_wf2_dec_proclaim_osmanli_rome.title:0 "宣诏奥索马尼罗马合统"
 oe_wf2_dec_proclaim_osmanli_rome.desc:0 "同时执掌君士坦丁堡与罗马双都并维系希腊与正教宽容格局之际，可开启一条架空大统支线：以「罗马凯撒」之名融合奥斯曼卡农法制与古典罗马帝国秩序（玩家专属彩蛋支线，需耗费 200 金币）。"
 oe_wf2_dec_proclaim_osmanli_rome.a:0 "召集双罗马帝国枢密大会"
 oe_wf_ref_abolish_chancellor:0 "废除丞相·六部直统"
 oe_wf_ref_abolish_chancellor_desc:0 "仿效洪武罢撤中书省故事，六部尚书直接对天子奏事，大幅增强皇权、地方控制与立法效能，但令中枢票拟负担沉重并触怒勋贵。与「明制内阁天朝」「清制军机天朝」互斥。"
 oe_wf_ref_ming_celestial_court:0 "明制内阁天朝"
 oe_wf_ref_ming_celestial_court_desc:0 "定制内阁大学士票拟与六科给事中封驳相济之文官体统，显著提升内阁效能、税政、稳定与天命，唯略分皇权独断且军费效率稍逊。与「废除丞相」「清制军机天朝」互斥。"
 oe_wf_ref_qing_celestial_court:0 "清制军机天朝"
 oe_wf_ref_qing_celestial_court_desc:0 "设立军机处密折承旨并与八旗精锐武备相辅，兼顾军纪、皇权与内阁敏捷度，唯宫廷常费高企且对市民商帮管制严苛。与「废除丞相」「明制内阁天朝」互斥。"
 oe_wf_ref_imperial_examination:0 "科举取士正制"
 oe_wf_ref_imperial_examination_desc:0 "确立童试、乡试、会试与殿试三年大比定制，以文才政略拔擢寒门俊彦，提振科研、识字率与内阁效能，唯削弱世族勋贵优容并增加科场公费。"
 oe_wf_ref_fengshan_sacred_peak:0 "泰山封禅大典"
 oe_wf_ref_fengshan_sacred_peak_desc:0 "唯海内升平且坐拥曲阜泰山之天子方可行此千古大礼，极大增进天命威权、正统、文化辐射与外交声望，然大典仪仗与沿途供应令宫廷与乡农负担不轻。"
 oe_wf_ref_celestial_seal_mandate:0 "传国玉玺·受命于天"
 oe_wf_ref_celestial_seal_mandate_desc:0 "于帝都奉安受命于天之传国玉玺，令四方藩属愈发归心、外交容量与威望大增，唯维系天朝万方礼仪所耗宫廷经费及阶层制约随之提升。"
 oe_wf_priv_encourage_exam:0 "兴学劝科·书院优免"
 oe_wf_priv_encourage_exam_desc:0 "敕拨学田并优免儒学书院举子差役，深得士林教士阶层拥护并促进识字率与科研，唯扩大士绅势力且略减田赋税效与皇权。"
 oe_wf_priv_imperial_princes:0 "宗室藩封岁禄"
 oe_wf_priv_imperial_princes_desc:0 "优赐皇室宗藩岁禄与屏藩礼遇，稳固贵族忠诚、正统血脉与地方守备，然宗室繁衍岁禄渐巨，持续消耗宫廷财用并分薄皇权。"
 oe_wf_priv_military_exam:0 "设科武举选将"
 oe_wf_priv_military_exam_desc:0 "敕许勋武勋戚与兵部共主武举乡会试，广选弓马韬略之才以提振陆军传统与士气，唯武备开支攀升并招致清流文士阶层不满。"
 oe_wf_priv_tea_salt_monopoly:0 "茶盐官引专卖"
 oe_wf_priv_tea_salt_monopoly_desc:0 "委任大商帮承办官盐引票与边疆茶马专卖，有效增厚国库税入、陆贸活力与商贾满意度，然盐茶官价加重乡农负担并令市民阶层权势日隆。"
 oe_wf2_wokou.1.t:0 "双屿秘港·东南风起"
 oe_wf2_wokou.1.d:0 "定海外洋雾霭笼罩的双屿岛已沦为武装私商盘踞之秘港，闽浙船主、江南牙行、佛郎机商舶与日本浪人在此私贩生丝火药，完全脱离市舶司管辖。随着海盗劫掠蔓延至沿海州县，嘉靖东南倭患正式爆发。"
 oe_wf2_wokou.1.a:0 "严申海禁，派兵封锁双屿外洋"
 oe_wf2_wokou.1.b:0 "暂行权宜招安，试探沿海商帮虚实"
 oe_wf2_wokou.2.t:0 "朝堂海禁与通市之辩"
 oe_wf2_wokou.2.d:0 "午门朝议之上，阁臣与言官围绕倭患根源激烈交锋。守旧派力主严守洪武寸板不得下海之祖制；唐枢等务实士大夫则痛陈「寇与商同是人也，市通则寇转为商，市禁则商转为寇」，力主以开市疏导代替一味堵截。"
 oe_wf2_wokou.2.a:0 "恪守严厉海禁祖制，强化沿岸封锁"
 oe_wf2_wokou.2.b:0 "试行凭引通市，分化商帮与海盗"
 oe_wf2_wokou.3.t:0 "江南豪绅通倭弊案"
 oe_wf2_wokou.3.d:0 "官军缴获的走私账册揭开惊人黑幕：江南与浙闽多家豪绅大族暗中入股私船、在庄园庇护贼首并向海盗通风报信。若铁腕抄查豪门虽能充盈军饷、斩断内应，却必将激起世族与富商阶层的剧烈反扑。"
 oe_wf2_wokou.3.a:0 "铁腕查办通倭豪门，抄没私财充饷"
 oe_wf2_wokou.3.b:0 "以罚银认捐乡勇为条件，宽大羁縻地方大族"
 oe_wf2_wokou.4.t:0 "石见银山与东洋流银"
 oe_wf2_wokou.4.d:0 "日本石见银山等矿产大兴，海量白银涌向东海竞购江南生丝、瓷器与药材。由于官办勘合名额远不足以容纳商潮，每逢春汛武装私船便蜂拥而至。朝廷当设局抽分纳银入库，抑或见船即剿、彻底拦截东洋私银？"
 oe_wf2_wokou.4.a:0 "设官炉抽分稽核，导东洋白银入库"
 oe_wf2_wokou.4.b:0 "严令水师巡洋截击，焚毁一切私银走私船"
 oe_wf2_wokou.5.t:0 "胡宗宪遣使平户·计诱汪直"
 oe_wf2_wokou.5.d:0 "浙直总督胡宗宪密奏：东南群倭多奉徽州海商巨擘、号称「净海王」的汪直为尊，其巢穴远在九州平户。胡宗宪已遣使持节渡海宣谕，天子当密令设伏诱捕贼首，抑或真许招抚、借其旧部反制群盗？"
 oe_wf2_wokou.5.a:0 "密准胡宗宪设伏诱捕，擒贼先擒王"
 oe_wf2_wokou.5.b:0 "颁诏真许招抚，命汪直戴罪立功巡护海疆"
 oe_wf2_wokou.6.t:0 "杭州公审净海王"
 oe_wf2_wokou.6.d:0 "汪直果真率部泊舟定海投诚，冀望朝廷准行互市以安其众。然京师言官群起激愤，力请即刻明正典刑以儆效尤。斩杀汪直虽可彰显国法威严，却恐令其失控余部四散狂掠；若信守招安之约则可迅速息兵，朝廷清议却难免受损。"
 oe_wf2_wokou.6.a:0 "于杭州明正典刑，绝不姑息海寇巨魁"
 oe_wf2_wokou.6.b:0 "信守招抚之诺，将其余部编管巡洋"
 oe_wf2_wokou.7.t:0 "浙直烽烟·松江杭州告警"
 oe_wf2_wokou.7.d:0 "四散的倭寇悍匪顺港汊突入松江与杭州近郊，焚掠市镇并击溃腐朽失修的卫所官军。浙直督抚急奏朝廷：若不速拨军资修固城垣、急调机动援军，江南赋税重地恐遭毁灭性劫掠。"
 oe_wf2_wokou.7.a:0 "急拨官银加筑杭松城垣并编练乡勇"
 oe_wf2_wokou.7.b:0 "急调精锐机动营兵深入河网追剿贼众"
 oe_wf2_wokou.8.t:0 "戚继光募兵义乌·戚家军成军"
 oe_wf2_wokou.8.d:0 "名将戚继光深知世袭卫所官兵久疏战阵、闻倭即溃，遂奏请裁汰虚额、亲赴浙东义乌招募剽悍质朴的矿徒与山农编练新军。若足额发给现银粮饷并严行连坐军法，这支「戚家军」必成平倭铁拳。"
 oe_wf2_wokou.8.a:0 "足额拨发募兵现银，全力支持戚家军成军"
 oe_wf2_wokou.8.b:0 "仅局部补充地方民壮，节省军费开支"
 oe_wf2_wokou.9.t:0 "创制鸳鸯阵与《纪效新书》"
 oe_wf2_wokou.9.d:0 "在浙东校场上，戚继光针对江南河网田埂与倭寇长刀白刃战法，创制十二人攻守一体的「鸳鸯阵」：藤牌手护前，狼筅扫敌，长枪与镗钯紧随刺杀，令单兵悍勇的贼众无从近身。颁行《纪效新书》操典更可将此法推及全军。"
 oe_wf2_wokou.9.a:0 "颁行《纪效新书》，全军推广鸳鸯阵实操"
 oe_wf2_wokou.9.b:0 "转而优先强化沿海福船水师火炮演练"
 oe_wf2_wokou.10.t:0 "台州九战九捷大胜"
 oe_wf2_wokou.10.d:0 "数千倭寇大举扑犯浙江台州（临海）沿岸之际，戚继光亲率新成军的义乌戚家军于新河、花街、上峰岭等地连战连捷、九战九胜，以极微伤亡全歼来犯顽敌。捷报飞传京师，倭寇陆战不可战胜的神话就此彻底粉碎。"
 oe_wf2_wokou.10.a:0 "大赏台州大捷将士，并加筑临海海防卫堡"
 oe_wf2_wokou.10.b:0 "将缴获贼赃尽数入库，赈济浙东遭灾州县"
 oe_wf2_wokou.11.t:0 "援闽破贼·兴化平海大捷"
 oe_wf2_wokou.11.d:0 "浙东无立足之地的悍倭大举南窜福建，攻陷兴化府城并威逼福州与泉州。戚继光与谭纶率精兵越岭驰援，会同闽海水师发起水陆夹击，誓将盘踞闽海的贼巢一举扫平。"
 oe_wf2_wokou.11.a:0 "水陆并进扫荡闽海贼巢，克复兴化平海"
 oe_wf2_wokou.11.b:0 "依托福州与泉州坚城稳守待变"
 oe_wf2_wokou.12.t:0 "崇武石城与东南烽燧链"
 oe_wf2_wokou.12.d:0 "宿将建言：若无坚固常备海防，野战大捷之后仍恐贼船死灰复燃。沿晋江崇武、定海与临海广筑花岗岩卫城、串联烽燧报警网络并预置军粮，方能将整条东南海岸化作铜墙铁壁。"
 oe_wf2_wokou.12.a:0 "拨款修筑东南石城卫堡与烽燧联防网"
 oe_wf2_wokou.12.b:0 "以轻捷哨船巡防为主，省却巨额筑城工费"
 oe_wf2_wokou.13.t:0 "月港开海疏·隆庆通洋"
 oe_wf2_wokou.13.d:0 "趁连战连捷、群倭瓦解之势，福建巡抚涂泽民具疏上陈大计：请准开放漳州月港为官督民办通洋口岸，发给引票准许华商往贩东西二洋，唯严禁私贩违禁器物。如此以疏代堵，东南民力尽归正道，倭患自此无源可生。"
 oe_wf2_wokou.13.a:0 "批准月港开关疏，设督饷馆颁引通洋"
 oe_wf2_wokou.13.b:0 "驳回开海之议，坚持以铁腕水师永固海禁"
 oe_wf2_wokou.14.t:0 "海波不兴·嘉靖倭患终平"
 oe_wf2_wokou.14.d:0 "自舟山群岛至闽广江海口岸，连年烽烟终于消散。精锐新军、石砌卫堡与明晰海策携手终结了席卷东南十余载的倭患浩劫。港埠商栈重开、渔帆安然出海，史官欣然书曰：东南海波不兴，万民复业。"
 oe_wf2_wokou.14.a:0 "以隆庆通商新局巩固东南繁庶与天命"
 oe_wf2_wokou.14.b:0 "保持常备铁壁海防与水师巡弋，永绝后患"
 oe_wf2_yr.1.t:0 "贾鲁故道与黄水悬河"
 oe_wf2_yr.1.d:0 "自元末贾鲁大治黄河逾百年以来，滚滚黄土泥沙再度令开封与徐州河床高悬于城垣之上。河工堪舆官急禀：若不趁早系统加筑缕堤遥堤、严核岁修，来年伏汛必致河决冲毁大运河命脉。"
 oe_wf2_yr.1.a:0 "足额拨发河工银两，加固开封与淮安堤防"
 oe_wf2_yr.1.b:0 "暂行常规岁修补缺，节省户部银两"
 oe_wf2_yr.2.t:0 "黄水决口·开封徐州告急"
 oe_wf2_yr.2.d:0 "伏秋盛汛冲垮开封与徐州多处土堤，浊浪滔天倒灌黄淮平原，官仓受淹、漕船搁浅。若急调国库银粮抢堵决口尚可保住秋播；若听任地方自救、延误河工，则灾荒民变与天命折损势所难免。"
 oe_wf2_yr.2.a:0 "急拨国库银粮抢险堵口，全力赈济灾民"
 oe_wf2_yr.2.b:0 "暂缓动用国帑，令地方州县自行筹款修补"
 oe_wf2_yr.3.t:0 "淮安清口漕运梗阻"
 oe_wf2_yr.3.d:0 "在江南漕船渡黄北上的咽喉重地——江苏淮安（山阳）清口，日积月累的淤沙正迫使数千艘运粮漕船滞留水次，危及京师与九边军粮供应。兴建并充实淮安大运河漕运总督署与石闸枢纽，实乃维系国脉之当务之急。"
 oe_wf2_yr.3.a:0 "大兴淮安漕运总督署与清口石闸枢纽"
 oe_wf2_yr.3.b:0 "仅临时疏挖引河通航，暂不扩建常设衙署"
 oe_wf2_yr.4.t:0 "黄淮河工徭役之困"
 oe_wf2_yr.4.d:0 "连年征调民夫背负埽料、夯筑河堤，已令河南与江淮乡农疲惫不堪、怨声四起。革新河官建言改行「折银雇役」，以现银招募熟练河工与流民修堤，既可大幅缓解民怨，亦能提升工程质量。"
 oe_wf2_yr.4.a:0 "推行折银雇役，以官银招募熟练河工"
 oe_wf2_yr.4.b:0 "严申传统里甲徭役定额，节省朝廷现银"
 oe_wf2_yr.5.t:0 "治河方略大辩：分流抑或束水攻沙"
 oe_wf2_yr.5.d:0 "治河两大流派于朝堂展开激辩。旧派力主广开支河分流以泄洪峰；水利宗师潘季驯则力排众议，指出分流愈多则水缓沙停、河床愈淤，唯有筑紧缕堤遥堤「束水攻沙」，并借高家堰蓄洪泽清流「蓄清刷黄」，方能以水治沙、直驱入海。"
 oe_wf2_yr.5.a:0 "采纳潘季驯「束水攻沙、蓄清刷黄」奇策"
 oe_wf2_yr.5.b:0 "折衷行分流缓洪与雇役岁修之法"
 oe_wf2_yr.6.t:0 "潘季驯石筑高家堰·束水攻沙告成"
 oe_wf2_yr.6.d:0 "在河道总督亲临督造之下，连绵百里的高家堰石工大堤与黄淮缕遥双堤巍然合龙。洪泽湖清流奔涌冲出清口，与束紧的黄流汇合刷深河槽，积年淤沙一扫而空，江南漕船扬帆顺流直上。"
 oe_wf2_yr.6.a:0 "垂范高家堰与束水攻沙定制，永保黄淮安澜"
 oe_wf2_yr.6.b:0 "重点扩充淮安漕运船闸与沿河转运仓栈"
 oe_wf2_yr.7.t:0 "万艘漕粮安抵通州"
 oe_wf2_yr.7.d:0 "千帆竞发、旌旗蔽日，数千艘江南漕船安然跨越黄淮安抵通州水次。坚固的河堤稳锁伏汛，京通各仓粮米充盈、北方粮价平稳，朝野上下同庆河清海晏之祥瑞。"
 oe_wf2_yr.7.a:0 "充实京通官仓，诏告天下河清岁稔"
 oe_wf2_yr.7.b:0 "拨粮平粜并蠲免北直隶与江淮乡农赋役"
 oe_wf2_yr.8.t:0 "河决示警·中原灾荒"
 oe_wf2_yr.8.d:0 "连年河工废弛与闸坝失修终于酿成中原及苏北特大溃堤。流民涌聚州府、漕船搁浅泥滩，言官切谏：黄淮失治乃社稷大患，若不立时斥巨资拨乱反正，天命民心必将动摇。"
 oe_wf2_yr.8.a:0 "痛下决心斥巨资重组河道衙署、抢筑新堤"
 oe_wf2_yr.8.b:0 "仅发少量本地赈济，暂任灾情自行平复"
 oe_wf2_ref.1.t:0 "相权既革·中枢礼法重塑"
 oe_wf2_ref.1.d:0 "随着新颁天朝中枢政制全面推行，六部与天下督抚章奏尽归新秩运转。老成重臣请旨定夺：朝廷当以严明法度震慑勋贵宗室，抑或厚礼翰林儒臣以彰文治气象？"
 oe_wf2_ref.1.a:0 "严明中枢纲纪，以天威镇抚勋贵权臣"
 oe_wf2_ref.1.b:0 "优礼翰林清流与文官士林，共商国政"
 oe_wf2_ref.2.t:0 "登临岱岳·泰山封禅告天"
 oe_wf2_ref.2.d:0 "在仪仗幡旗与四方藩使扈从之下，天子銮驾登临曲阜之北的东岳泰山。玉牒金书告祭昊天上帝与后土神祇，昭告天下海宇升平、天命攸归。"
 oe_wf2_ref.2.a:0 "依古礼行全套泰山封禅大典，光耀天命"
 oe_wf2_ref.2.b:0 "行简约告天之礼，并将典费尽数蠲免齐鲁民赋"
 oe_wf2_ref.3.t:0 "传国玉玺·御宝正名"
 oe_wf2_ref.3.d:0 "在文武百官与诸藩使节注视之下，礼部隆重奉出镌有「受命于天，既寿永昌」古篆的传国玉玺。消息传遍海内外，四方藩属争相遣使请领新颁金印敕书。"
 oe_wf2_ref.3.a:0 "奉安玉玺于太和正殿，以正大统而威四夷"
 oe_wf2_ref.3.b:0 "颁赐玉玺御印敕书予天下州府与藩属，广布仁德"
 oe_wf2_ref.4.t:0 "盐引茶马与文武兴学"
 oe_wf2_ref.4.d:0 "朝廷新颁的阶层特许制度已于海内渐见成效：官引盐茶商帮源源不断输粮实边，地方书院文风蔚起，武举校场亦人才辈出。中枢将如何统筹这股兴盛之势？"
 oe_wf2_ref.4.a:0 "扩充开中盐引与茶马账册，大裕国库财源"
 oe_wf2_ref.4.b:0 "将盈余拨入书院讲学与武举将才培植"
 oe_wf2_osmanli.1.t:0 "双罗马之间的罗马凯撒"
 oe_wf2_osmanli.1.d:0 "自君士坦丁堡的宏伟穹顶至罗马七丘之上，奥斯曼皇室的旗帜已同时飘扬于东西两座千年帝都。希腊宿儒、拉丁法学家与鲁米利亚帕夏齐聚枢密院，提出一项惊世构想：与其将意大利仅作边疆行省管治，不如正式开启融汇奥斯曼法度与古典罗马普世正统的「奥索马尼罗马」合统大业。"
 oe_wf2_osmanli.1.a:0 "采纳宏图，正式开启奥索马尼罗马合统之路"
 oe_wf2_osmanli.1.b:0 "循旧例以边疆行省治之，暂不更张体制"
 oe_wf2_osmanli.2.t:0 "法纳尔、卡比托利欧与宽容宪章"
 oe_wf2_osmanli.2.d:0 "为永固爱琴海与第勒尼安海两岸民心，帝国法官拟具《双罗马宽容宪章》，并行保障君士坦丁堡普世牧首区与罗马城邦自治议会的法统地位。此举必令多元臣民归心，然保守教法学者对此深感震怒。"
 oe_wf2_osmanli.2.a:0 "御批颁行《双罗马宽容宪章》"
 oe_wf2_osmanli.2.b:0 "仅维持常规旧制，安抚保守教法阶层"
 oe_wf2_osmanli.3.t:0 "卡农法典与罗马民法：双语帝国枢密院"
 oe_wf2_osmanli.3.d:0 "精通奥斯曼土耳其语、希腊语与拉丁语的书记官将苏丹卡农敕令与查士丁尼《民法大全》并案对照。若合纂统一帝国税籍与海商法典并设双语枢密院统筹政令，崇高门庭对多瑙河、尼罗河与台伯河流域的治理将如臂使指。"
 oe_wf2_osmanli.3.a:0 "合纂帝国法典，设立双语帝国枢密院"
 oe_wf2_osmanli.3.b:0 "保留各地原有法庭分治，免致官僚动荡"
 oe_wf2_osmanli.4.t:0 "帝国瓦兰吉—新军近卫营"
 oe_wf2_osmanli.4.d:0 "驻守鲁米利亚与意大利的将领联名提议：将精锐御林步兵火器操典与地中海海军造船厂及巴尔干、安纳托利亚、意大利多族裔军官团融为一体，组建一支足以镇慑双都四海的帝国近卫军。"
 oe_wf2_osmanli.4.a:0 "斥资整编双都帝国近卫军与地中海船政"
 oe_wf2_osmanli.4.b:0 "优先充实边防兵源与府库储备"
 oe_wf2_osmanli.5.t:0 "四海使节共睹地中海新秩序"
 oe_wf2_osmanli.5.d:0 "无论基督教列国抑或伊斯兰诸邦，各国宫廷皆为这一横跨伊斯坦布尔与罗马、兼具双都古典文脉与雄厚军力的地中海新帝国所震撼。四方使节云集双都，竞相求缔商约与和盟。"
 oe_wf2_osmanli.5.a:0 "以地中海共主之威仪隆重接见四海使团"
 oe_wf2_osmanli.5.b:0 "趁势广征通商关税，充盈帝国金库"
 oe_wf2_osmanli.6.t:0 "奥索马尼罗马加冕大典"
 oe_wf2_osmanli.6.d:0 "在君士坦丁堡的鎏金穹顶与罗马的大理石廊柱之间，传令官以多语宣诏大统告成：横跨底格里斯河与台伯河的「奥索马尼罗马」已然屹立于世。虽守旧派犹有非议、盛典耗费不赀，然新月与帝鹰交辉的地中海罗马新纪元已蔚然开启。"
 oe_wf2_osmanli.6.a:0 "加冕奥索马尼罗马皇冠，永承双都凯撒正统"
 oe_wf2_osmanli.6.b:0 "以务实宽容宪章巩固双都繁庶，不慕虚名"
