 oe_s37_crown_coemperor: "加冕共治皇帝"
 oe_s37_crown_coemperor_desc: "#F 1325年，安德洛尼卡三世本人加冕为共治皇帝，可在位期间始终没有给儿子约翰加冕。1341年6月皇帝去世时，约翰仍未加冕。当年10月，约翰·坎塔库泽努斯在迪迪莫泰洪称帝，内战由此爆发；摄政一方到11月才为约翰五世加冕。#!\n现在就把皇储约翰加冕为共治皇帝，让继承不再悬而未决。[oe_tu_authority|e]#R −10#!，威望#R −15#!。\n约翰五世得到#bold #color_yellow 共治皇帝#!#!（终身）：每月威望#G +0.1#!，在东罗马继承法的人选评分中#G +200#!，并移入王室阶层。\n条件：皇帝在位（不在摄政期间），约翰在世、在帝国宫廷、还没有加冕，帝国没有别的共治皇帝，帝国权威至少为#Y 10#!。"
 oe_s37_crown_coemperor_card: "为皇储约翰加冕为共治皇帝，稳固继承。"
 oe_s37_crown_coemperor_tt: "[oe_tu_authority|e]#R −10#!，威望#R −15#!。\n约翰五世得到#bold #color_yellow 共治皇帝#!#!（终身）：每月威望#G +0.1#!，在东罗马继承法的人选评分中#G +200#!，并移入王室阶层。"
 oe_s37_crown_allow_ruler: "皇帝在位（不在摄政期间）"
 oe_s37_crown_allow_john: "约翰五世在世、在帝国宫廷、不是在位君主，也还没有加冕"
 oe_s37_crown_allow_none: "帝国眼下没有别的共治皇帝"
 oe_s37_crown_allow_auth: "帝国权威至少为#Y 10#!"
 oe_s37.1.t: "尼科米底亚陷落"
 oe_s37.1.d: "尼科米底亚被奥斯曼人围困了好几年。1337年，安德洛尼卡三世领兵去了阿尔巴尼亚，城里的粮食吃尽，守军向奥尔汗投降。居民获准离城，迁往君士坦丁堡。奥尔汗把城交给了长子苏莱曼。\n\n如今，尼科米底亚已经向奥尔汗开城。城里的希腊人带着能带走的东西，正渡海前往君士坦丁堡。帝国在亚洲的据点又少了一座。"
 oe_s37.1.a: "接纳难民"
 oe_s37.1.a.tt: "君士坦丁堡新增#Y 2#!千农民和#Y 1#!千市民，文化与宗教同帝国的主体（君士坦丁堡不在帝国手中时，改到首都）。\n那里得“尼科米底亚难民”（#Y 2#!年）：本地人口粮食消耗#R +10%#!。"
 oe_s37.1.b: "向奥尔汗纳币求和"
 oe_s37.1.b.tt: "按罗马世界面板中“遣使纳币”的规则，向奥斯曼派出使节，答复随即送回。\n岁币为我们#Y 3#!个月的总收入（现在约[GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]金币），签约时定下，当场付第一年，此后每年一月支付。\n奥斯曼不在与我们交战时，接受的可能为#Y 70%#!（对我们的好感低于#Y −50#!时为#Y 40%#!）；正在交战时，只有在战场上没占上风才会接受。\n接受后：双方停战#Y 5#!年，威望#R −15#!，[oe_tu_authority|e]#R −5#!，奥斯曼对我们的好感#G +25#!（#Y 5#!年）。被拒绝后#Y 12#!个月内不能再向奥斯曼求和。"
 oe_s37.1.c: "加强博斯普鲁斯防务"
 oe_s37.1.c.tt: "#R −50#!金币。\n博斯普鲁斯亚洲岸的于斯屈达尔和希利（帝国仍占有的）各得“博斯普鲁斯防务”（#Y 10#!年）：防御#G +25%#!，驻军增长#G +25%#!。两地都不在帝国手中时，改由君士坦丁堡得到。"
 oe_s37.2.t: "阿尔巴尼亚部落起事"
 oe_s37.2.d1: "1337年，培拉特附近托莫尔山一带和卡尼纳的阿尔巴尼亚部落起事，不顾皇帝几年前给过他们特权。他们夺下托莫尔的堡垒，斯克拉帕尔和克莱苏拉一带也落入他们手中。安德洛尼卡三世领兵平叛，军中多是突厥人，其中#Y 2#!,#Y 000#!人是艾登的乌穆尔派来的。约翰·坎塔库泽努斯写道，帝国的士兵不奴役同为基督徒的阿尔巴尼亚人，却拦不住突厥盟军掳人为奴；皇帝后来出钱赎回了一部分人。南边的穆扎卡家族也卷了进去：安德烈二世·穆扎卡此前领有帝国授予的专制公头衔，1335年起在阿尔巴尼亚南部反抗帝国，1336年底转投那不勒斯的安茹王室。\n\n如今，培拉特和阿夫洛尼亚一带的部落又起事了，山中的堡垒落入他们手中。帝国在那里的地点已得“部落起事”（本地叛乱度#R +25%#!，最大控制力#R −25%#!），平叛之前一直生效，最长#Y 24#!个月。管辖那里的边镇边患#R +25#!，平叛后消失。\n\n艾登的乌穆尔是帝国的盟友，可以请乌穆尔派兵。"
 oe_s37.2.d: "1337年，培拉特附近托莫尔山一带和卡尼纳的阿尔巴尼亚部落起事，不顾皇帝几年前给过他们特权。他们夺下托莫尔的堡垒，斯克拉帕尔和克莱苏拉一带也落入他们手中。安德洛尼卡三世领兵平叛，军中多是突厥人，其中#Y 2#!,#Y 000#!人是艾登的乌穆尔派来的。约翰·坎塔库泽努斯写道，帝国的士兵不奴役同为基督徒的阿尔巴尼亚人，却拦不住突厥盟军掳人为奴；皇帝后来出钱赎回了一部分人。南边的穆扎卡家族也卷了进去：安德烈二世·穆扎卡此前领有帝国授予的专制公头衔，1335年起在阿尔巴尼亚南部反抗帝国，1336年底转投那不勒斯的安茹王室。\n\n如今，培拉特和阿夫洛尼亚一带的部落又起事了，山中的堡垒落入他们手中。帝国在那里的地点已得“部落起事”（本地叛乱度#R +25%#!，最大控制力#R −25%#!），平叛之前一直生效，最长#Y 24#!个月。管辖那里的边镇边患#R +25#!，平叛后消失。\n\n帝国眼下与艾登没有盟约，请不来乌穆尔的兵。"
 oe_s37.2.a: "御驾亲征"
 oe_s37.2.a.tt: "#R −60#!金币，人力#R −3#!个月的增长。\n“部落起事”在#Y 6#!个月后结束。管辖这些地点的[oe_tu_march|e]因起事增加的边患#R +25#!也在#Y 6#!个月后消失。"
 oe_s37.2.b: "请乌穆尔出兵"
 oe_s37.2.b.tt: "#R −25#!金币（按盟约付给艾登的报酬）。\n“部落起事”在#Y 3#!个月后结束。管辖这些地点的[oe_tu_march|e]因起事增加的边患#R +25#!也在#Y 3#!个月后消失。\n突厥兵掳人为奴：这些地点得“被掳的村民”（#Y 5#!年）：本地人口增长#R −0.5%#!，本地叛乱度#R +10%#!。管辖这些地点的军区忠诚#R −5#!。\n以阿尔巴尼亚文化为主体的国家对我们的好感#R −25#!（#Y 10#!年）。"
 oe_s37.2.c: "招抚部落"
 oe_s37.2.c.tt: "#R −40#!金币（赏赐，并重申旧日的特权）。\n“部落起事”要到#Y 12#!个月后才结束。管辖这些地点的[oe_tu_march|e]因起事增加的边患#R +25#!也在#Y 12#!个月后消失。"
 oe_s37.2.muz: "重授穆扎卡专制公之号"
 oe_s37.2.muz.tt: "威望#R −10#!。\n“部落起事”在#Y 9#!个月后结束。管辖这些地点的[oe_tu_march|e]因起事增加的边患#R +25#!也在#Y 9#!个月后消失。\n穆扎卡对我们的好感#G +25#!（#Y 10#!年）。\n安茹的阿尔巴尼亚王国对我们的好感#R −15#!（#Y 10#!年）。"
 oe_s37.3.t: "伊庇鲁斯的机会"
 oe_s37.3.d1: "1335年，伊庇鲁斯的约翰二世·奥尔西尼猝死，可能是被妻子安娜毒死的。安娜为年幼的儿子尼基福罗斯二世摄政。此前帝国已经拿下了约阿尼纳。史载皇帝平定阿尔巴尼亚人之后，要求伊庇鲁斯完全归顺；安娜想谈条件，最后还是接受了，塞奥多尔·西纳德诺斯受命出任总督。\n\n如今，阿尔巴尼亚的战事已经平息。伊庇鲁斯仍是帝国的附庸，阿尔塔还不在皇帝手里。要把伊庇鲁斯收归直辖，可以发起远征“平定伊庇鲁斯”。"
 oe_s37.3.d: "1335年，伊庇鲁斯的约翰二世·奥尔西尼猝死，可能是被妻子安娜毒死的。安娜为年幼的儿子尼基福罗斯二世摄政。此前帝国已经拿下了约阿尼纳。史载皇帝平定阿尔巴尼亚人之后，要求伊庇鲁斯完全归顺；安娜想谈条件，最后还是接受了，塞奥多尔·西纳德诺斯受命出任总督。\n\n如今，伊庇鲁斯仍是帝国的附庸，阿尔塔还不在皇帝手里。要把伊庇鲁斯收归直辖，可以发起远征“平定伊庇鲁斯”。"
 oe_s37.3.a: "筹划西征"
 oe_s37.3.a.tt: "（只是提示，没有效果。）远征“平定伊庇鲁斯”在远征界面发起：1338年1月1日以后、不在战争中、至少有#Y 10#!点政治影响力，领队须出自王室或贵族阶层。这项远征只能发起一次。"
 oe_s37.5.t: "普遍法官受贿案"
 oe_s37.5.d: "1329年，安德洛尼卡三世把旧有的十二人法庭改组为四名“罗马人的普遍法官”（katholikoi kritai），规定其中至少一人是主教。首批四人是阿普罗斯主教约瑟夫、大执事格里高利·克莱达斯、格拉巴斯和尼古拉·马塔兰戈斯。其中三人后来被判受贿。\n\n如今，三名普遍法官受贿的案子已经查实，摆到了皇帝面前。各军区由京城委派的法官，也在看朝廷怎样处置。"
 oe_s37.5.a: "严惩不贷"
 oe_s37.5.a.tt: "合法性#G +10#!。\n贵族阶层满意度#R −10%#!。"
 oe_s37.5.b: "从轻发落"
 oe_s37.5.b.tt: "合法性#R −5#!。\n贵族阶层满意度#G +5%#!。\n我们得“法官从轻发落”（#Y 5#!年）：税收效率#R −2.5%#!。"
 oe_s37.6.t: "马蒂诺·扎卡里亚获释"
 oe_s37.6.d: "马蒂诺·扎卡里亚是热那亚人，曾是希俄斯的领主。1329年秋，安德洛尼卡三世收复希俄斯，马蒂诺兵败被俘，此后一直囚在君士坦丁堡。史载1337年，经教宗和法国国王腓力六世说情，皇帝放了马蒂诺。\n\n如今，教宗和法国国王的使节又来为马蒂诺说情。加拉塔的热那亚人也在等着消息。"
 oe_s37.6.a: "释放马蒂诺"
 oe_s37.6.a.tt: "教宗国对我们的好感#G +20#!（#Y 10#!年）。\n法兰西对我们的好感#G +20#!（#Y 10#!年）。"
 oe_s37.6.b: "继续关押"
 oe_s37.6.b.tt: "热那亚对我们的好感#R −20#!（#Y 10#!年）。\n“加拉塔的热那亚人”修正（若有）照旧保留。"
 oe_s37.9.t: "1337开局事件：选项生效"
