 oe_m2e.25.t:0 "赫斯珀里亚宪章"
 oe_m2e.25.d:0 "紫衣鹰旗北望文兰冰海、南扼墨西哥湾，赫斯珀里亚大陆已成极乐罗马囊中之物。在新君士坦丁堡大理石元老院内，诸省总督力主确立高度协同的《美洲总督联邦宪章》，皇权派倡议强化切萨皮克中央集权以备东归故土，海港船主与丝绸行会则呼吁打造以铜甲舰队与远洋商贸立国的海洋宪政。"
