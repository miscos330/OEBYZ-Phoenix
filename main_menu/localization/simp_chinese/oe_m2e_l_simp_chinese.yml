 oe_m2e.11.d:0 "随着王室财政总督巡察各省、宗教内乱尘埃落定，法兰西已立于称霸欧洲的门槛之上。宫廷法学家力倡以凡尔赛绝对王权彻底收束高等法院与大贵族私权，地方与市民代表呼吁确立常设三级会议宪制，财政重臣则主张全面推行柯尔贝尔式国家工场与重商关税。"
