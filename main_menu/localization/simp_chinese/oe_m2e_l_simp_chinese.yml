 oe_m2e.27.t:0 "丝路汗国灵魂抉择"
 oe_m2e.27.d:0 "阿力麻里、撒马尔罕与喀什噶尔重归一统，昔日险些撕裂察合台汗国的路线之争此刻在凯旋盛世中再度摆上御案。河中经师与商贾力主拥抱波斯—突厥定居都市融合，伊犁草原那颜坚定捍卫成吉思汗的游牧《大札撒》传统，诸绿洲阿米尔则倡议缔结兼顾草原与城邦的阿米尔联邦宪章。"
