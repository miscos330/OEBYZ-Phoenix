 oe_m2e.21.t:0 "大元维新大辩论"
 oe_m2e.21.d:0 "随着至正劫难平息、大都中书省纲纪重振，大明殿内爆发了关乎大元百年走向的朝议激辩。汉法维新派力主彻查江南田赋、广开科举文治，漠北宗王与怯薛勋贵坚持维护草原军事贵族国俗，诸路行省平章则倡议缔结兼顾海运漕粮与行省分治的大宪章。"
 oe_m2e.21.a:0 "力行江南税改与科举中书汉法维新。"
