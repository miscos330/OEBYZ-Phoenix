 oe_m2e.17.t:0 "多瑙河大妥协"
 oe_m2e.17.d:0 "维也纳、布拉格与多瑙河诸领既已归于同一权杖之下，哈布斯堡重臣直面多民族帝国的根本考题。霍夫堡法学家主张由维也纳枢密院全面收拢财税军政，波希米亚与匈牙利等级议会恳请缔结多语诸王领联邦宪章，军事边疆元帅们则力倡把帝国锻造成永备防卫堡垒。"
