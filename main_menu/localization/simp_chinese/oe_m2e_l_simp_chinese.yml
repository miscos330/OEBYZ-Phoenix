 STATIC_MODIFIER_NAME_oe_m2e_loc_mam_nile_shuna:0 "尼罗河官仓与卡里米货栈"
 STATIC_MODIFIER_DESC_oe_m2e_loc_mam_nile_shuna:0 "精良的尼罗河水利闸坝、常平义仓与香料大货栈令开罗与亚历山大成为中东最富庶的粮贸中心。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_rus_white_kremlin:0 "白石克里姆林与皇家铸炮院"
 STATIC_MODIFIER_DESC_oe_m2e_loc_rus_white_kremlin:0 "坚固的石砌堡垒、官营铸炮工坊与河运税署使莫斯科成为辐射全罗斯的强权心脏。"
