 oe_m2e.20.d:0 "端坐于珠翠流光的孔雀宝座之上，总揽德里、拉合尔与孟加拉的至高君主统御着令全球使节惊叹的棉纺工场、大理石奇观与火药劲旅。在礼炮与号角声中，帕迪沙亲手定下印度次大陆帝国的百年宏纲。"
