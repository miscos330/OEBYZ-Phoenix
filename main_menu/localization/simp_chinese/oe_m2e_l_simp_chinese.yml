 STATIC_MODIFIER_DESC_oe_m2e_chi_xingsheng_mod:0 "行省体制与江南海运市舶相得益彰，南北万里政令财货畅通无阻。"
 oe_m2e.22.t:0 "大元和平重生"
 oe_m2e.22.d:0 "大都司天台浑天仪昼夜运转，银锚宝钞通行自刺桐至撒马尔罕的万里商道，神机劲旅戍守天山南北与浩瀚东海。成功跨越历史劫难、缔造跨欧亚近代超级帝国的大元，将在此盛典定下垂范千秋的终极宏纲。"
 oe_m2e.22.a:0 "弘扬授时历算格致与银锚金融，引领东亚科技启蒙。"
 STATIC_MODIFIER_NAME_oe_m2e_chi_sci_mod:0 "授时格致与银锚盛世"
 STATIC_MODIFIER_DESC_oe_m2e_chi_sci_mod:0 "稳健宝钞金融与中西合璧科学令大元走在世界近代文明最前沿。"
 oe_m2e.22.b:0 "总揽陆海双丝路市舶，铸就欧亚商贸第一巨帝。"
 STATIC_MODIFIER_NAME_oe_m2e_chi_silk_mod:0 "海陆丝路双凤天命"
 STATIC_MODIFIER_DESC_oe_m2e_chi_silk_mod:0 "元青花远洋商队与西域丝路共同将旧大陆商脉尽汇大元。"
 oe_m2e.22.c:0 "以大汗兼天子双重至尊永镇草原与九州。"
