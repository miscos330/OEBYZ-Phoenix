 oe_m2e.13.d:0 "伦敦港万帆云集、威斯敏斯特围绕国债与宪政权责激辩不休，英格兰已行至近世立宪转折点。辉格派力主确立议会至上并创办英格兰银行以释放低息信用，大商团倡议以海军部与特许海外公司主导国策，王党贵族则主张维护王室特权与乡绅秩序。"
