 STATIC_MODIFIER_DESC_oe_m2e_mng_whip_mod:0 "务实税政兼顾开海通商与九边防务，令大明进退裕如。"
 oe_m2e.24.t:0 "日月重光·太平洋大明加冕"
 oe_m2e.24.d:0 "紫禁城金色琉璃瓦与南京、广州繁忙船坞遥相辉映，中兴大明已彻底走出周期律阴霾——自铸银元稳健、关宁重炮如林、御窑与实学冠绝环宇。天子于太和殿颁诏天下，确立大明照耀近世的终极宏纲。"
