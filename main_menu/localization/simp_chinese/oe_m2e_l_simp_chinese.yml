 STATIC_MODIFIER_DESC_oe_m2e_chi_dual_mod:0 "兼承草原大汗与中华天子法统，令内外藩省咸服于大都号令。"
 oe_m2e.23.t:0 "宝船大辩论"
 oe_m2e.23.d:0 "郑和九桅宝船满载南洋奇珍、满剌加使节与印度洋香料凯旋龙江港，奉天殿内随即爆发震动朝野的战略大辩论。海权派力主常设远洋舰队、经略南洋商站以执世界海贸牛耳，北防派疾呼应停航省费、倾举国之力筑牢长城卫所抵御草原铁骑，务实阁臣则倡议以税改强财政、海陆双线并进。"
 oe_m2e.23.a:0 "永续郑和下西洋伟业，铸就大明南洋远洋海权帝国。"
