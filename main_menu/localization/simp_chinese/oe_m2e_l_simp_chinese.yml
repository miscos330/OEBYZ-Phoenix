 oe_m2e.28.d:0 "撒马尔罕观象台群星璀璨，驼队日夜穿行于坎儿井润泽的费尔干纳与塔里木沃野，重甲火药骑军扼守自呼罗珊至阿尔泰的万里山口。在一统汗国的盛世忽里勒台上，大汗亲手颁定中亚永恒帝国的终极宏纲。"
