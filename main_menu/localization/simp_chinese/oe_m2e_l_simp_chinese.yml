 oe_m2e.16.d:0 "自塞维利亚与格拉纳达跨越大西洋直至安第斯银山与太平洋马尼拉，西班牙不仅缔造了人类史上首个真正的全球双洋帝国，更成功驾驭白银浪潮傲然步入近世。面对两洋公卿、主教与舰队统帅，王室庄严宣告「更远彼方」的终极国策。"
