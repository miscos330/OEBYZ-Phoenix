 oe_m2e.26.t:0 "真·双头大帝"
 oe_m2e.26.d:0 "自切萨皮克湾跨越亚速尔跳板遥望地中海霞光，极乐罗马的传奇大业已臻圆满。不再是孤悬荒野的流亡遗民，雄跨东西两洋的新罗马将在此加冕盛典亲手定下双头大帝的永恒使命。"
