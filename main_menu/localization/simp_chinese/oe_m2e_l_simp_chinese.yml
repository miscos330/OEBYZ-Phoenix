 oe_con.1.b:0 "固守本国城防与财政自主，不盲从他国约束。"
 oe_con.1.c:0 "趁和会开幕大开条约互市，招徕列强商帮。"
 oe_con.2.b:0 "号召州县义勇入伍并筹措民间护教军饷。"
 oe_con.3.b:0 "优抚边疆豪族并赐予世袭镇守特权以安新土。"
 oe_con.4.b:0 "将开海市舶关税反哺内地常平义仓与农桑水利。"
 oe_con.5.b:0 "命诸藩属协理粮草与先锋军务，减轻中原耗费。"
 oe_con.6.b:0 "赐予远藩大都护府宽松通商自治，以仁德怀远。"
 oe_con.7.b:0 "趁和会休兵裁减军费，全力兴修都邑民用工坊。"
 oe_con.8.b:0 "深沟高垒固守本国门户，静待霸主师老兵疲。"
 oe_con.9.b:0 "扩建本土自由港堆栈与货场，吸纳万国商船停泊。"
 oe_con.10.b:0 "严征海峡过境税并庇护本土近海商船行会。"
 oe_con.11.b:0 "简化检疫验关流程，确保港口货流与商税不受滞碍。"
 oe_con.90.b:0 "将协调会实时卷宗归档并抄送各国驻节使臣。"
 oe_levy.1.b:0 "由国库配发重甲与战马津贴，将农兵锤炼为精锐甲士。"
 oe_levy.1.c:0 "明诏保护军区屯田世袭田产，免受豪强兼并。"
 oe_levy.2.b:0 "为怯薛先锋配齐精钢马甲与青铜火铳，强化正面突击。"
 oe_levy.2.c:0 "重申忠诚万户的传统牧场份额与站赤免役特权。"
 oe_levy.3.b:0 "严督射击军操练齐射火器与近代步兵纪律。"
 oe_levy.3.c:0 "准许射击军家眷在平时免税经营手工作坊与市肆。"
 oe_levy.4.b:0 "向哥萨克营寨拨付野战轻炮、火药与正规教官。"
 oe_levy.4.c:0 "颁赐大河渔猎权与草原自由屯垦宪章，稳固边骑忠心。"
 oe_levy.5.b:0 "严格按册核验西帕希甲械并令其加配火枪随从。"
 oe_levy.5.c:0 "从宽核准随征立功西帕希子嗣世袭采邑，以励军心。"
 oe_levy.6.b:0 "将红头军重装冲锋骑兵同皇家火枪炮队协同整编。"
 oe_levy.6.c:0 "厚赐部族长老行省牧地与教团产业，维系铁血盟誓。"
 oe_levy.7.b:0 "聘请老练教官将贵族征召骑兵整编为严明战斗中队。"
 oe_levy.7.c:0 "战时重申波兰贵族州郡特权并拨付盐矿津贴以安众心。"
 oe_levy.8.b:0 "严行战马烙印点验与火绳枪兵定额，杜绝虚报冒领。"
 oe_levy.8.c:0 "向效忠朝廷的曼萨布达尔赏赐沃饶采邑与军粮津贴。"
 oe_levy.90.b:0 "清核兵籍名册并核查各地武库装备。"
 oe_sit2.1.b:0 "急召漠北宗王与怯薛铁骑拱卫大都，以武力震慑四方。"
 oe_sit2.1.c:0 "安抚江南士绅与行省商帮，宽减杂税以聚财源。"
 oe_sit2.2.b:0 "厚赏平乱名将并加固南北边镇常备防务。"
 oe_sit2.3.b:0 "借伏尔加商帮财力加固城防并延揽火炮工匠。"
 oe_sit2.4.b:0 "以铁腕《大札撒》军法重肃草原诸翼军纪。"
 oe_sit2.5.b:0 "礼聘意大利名匠与活字印工云集金角湾兴办工坊。"
 oe_sit2.6.b:0 "将人文几何与天文绝学投入远洋航海与火炮造船实学。"
 oe_sit2.7.b:0 "招募边疆轻骑哨探并招徕草原商队入市，合纵制敌。"
 oe_sit2.8.b:0 "将久经沙场的东欧边骑整编为常备精锐主力军团。"
 oe_sit2.22.b:0 "急固险隘要塞并遣使联络欧亚诸国共警帖木儿风暴。"
 oe_sit2.90.b:0 "整编旗舰局势与原版桥接纪要，呈送内阁备览。"
