 oe_m2e.14.t:0 "日不落帝国加冕"
 oe_m2e.14.d:0 "伦敦、爱丁堡与都柏林已归于一统，皇家海军风帆战列舰巡弋七海，皇家学会与机械织坊更率先点燃近代工业曙光。在威斯敏斯特盛世庆典上，不列颠帝国将亲手定下日不落世纪的至高宏纲。"
