 STATIC_MODIFIER_DESC_oe_m2e_loc_glh_sarai_emporium:0 "石砌商队旅舍、多语译馆与伏尔加河港将金帐都城塑造成沟通草原与黑海的定居大都会。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_fra_royal_atelier:0 "巴黎皇家工场与启蒙学府"
 STATIC_MODIFIER_DESC_oe_m2e_loc_fra_royal_atelier:0 "王室扶持的织造、玻璃与军工工场同科学院相得益彰，将法兰西岛推上欧陆工艺与思想之巅。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_eng_thames_clearing:0 "泰晤士清算所与皇家船坞"
 STATIC_MODIFIER_DESC_oe_m2e_loc_eng_thames_clearing:0 "呢绒堆栈、远洋船坞与金融票据清算汇聚泰晤士河口，将伦敦锻造成大西洋商业与海权的心脏。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_spa_casa_seville:0 "西印度通商院与银币检验署"
 STATIC_MODIFIER_DESC_oe_m2e_loc_spa_casa_seville:0 "金银验色署、皇家航海测绘馆与护航船队库房令伊比利亚门户成为双洋财富的集散总枢。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_hab_vienna_palace:0 "巴洛克维也纳与多瑙枢密院"
 STATIC_MODIFIER_DESC_oe_m2e_loc_hab_vienna_palace:0 "恢弘的巴洛克宫殿、棱堡防线与枢密院文书体系将阿尔卑斯与多瑙河诸王领紧密凝聚为一体。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_dlh_grand_trunk:0 "皇家大干道与御用织造坊"
 STATIC_MODIFIER_DESC_oe_m2e_loc_dlh_grand_trunk:0 "井泉完备的大干道驿站、皇家细棉工坊与红砂岩堡垒令亚穆纳—恒河腹地百业兴旺。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_chi_dadu_observatory:0 "大都司天监与银锚宝钞库"
 STATIC_MODIFIER_DESC_oe_m2e_loc_chi_dadu_observatory:0 "承袭郭守敬仪象绝学的司天台、白银平准库与海运粮仓令大都重现寰宇都会气象。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_mng_longjiang_yard:0 "龙江宝船厂与漕运瓷贸枢纽"
 STATIC_MODIFIER_DESC_oe_m2e_loc_mng_longjiang_yard:0 "巨型船坞、御窑转运码头与大运河闸口共同撑起大明贯通海陆的航运与工商业命脉。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_elr_new_const:0 "新君士坦丁堡紫衣卫城"
 STATIC_MODIFIER_DESC_oe_m2e_loc_elr_new_const:0 "铜甲造船坞、极乐丝绸御坊与大理石元老院耸立切萨皮克湾畔，见证新大陆罗马的煌煌重生。"
 STATIC_MODIFIER_NAME_oe_m2e_loc_chg_samarkand_karez:0 "撒马尔罕经学院与绿洲坎儿井网"
 STATIC_MODIFIER_DESC_oe_m2e_loc_chg_samarkand_karez:0 "引天山雪水的地下坎儿井、琉璃经学院与商队货栈将河中绿洲化作内亚商旅与学术的璀璨中心。"
 oe_m2e.1.t:0 "新罗马的十字路口"
 oe_m2e.1.d:0 "随着近卫大区重设于四十余城，中兴的君士坦丁堡迎来了决定帝国治理脊梁的深远辩论。诸军区将领力主全面复兴严明高效的军区督府官僚与屯田兵制，而金角湾豪商与元老院则恳请颁布《元老院海商宪章》，以自由航道与主权信用驱动帝国腾飞。"
 oe_m2e.1.a:0 "复兴军区督府与总督官僚体系。"
 STATIC_MODIFIER_NAME_oe_m2e_byz_theme_mod:0 "复兴军区督府制"
 STATIC_MODIFIER_DESC_oe_m2e_byz_theme_mod:0 "严明高效的军区总督与户籍书吏令帝国军纪与疆土控制力双双跃升。"
 oe_m2e.1.b:0 "颁行《帝国元老院海商宪章》。"
 STATIC_MODIFIER_NAME_oe_m2e_byz_senate_mod:0 "元老院海商宪章"
 STATIC_MODIFIER_DESC_oe_m2e_byz_senate_mod:0 "特许元老院商团与自由港清算所令金角湾海贸与金融信用冠绝地中海。"
 oe_m2e.1.c:0 "融汇军政商学，缔造普世帝国新制。"
 STATIC_MODIFIER_NAME_oe_m2e_byz_synth_mod:0 "普世帝国综合宪制"
 STATIC_MODIFIER_DESC_oe_m2e_byz_synth_mod:0 "紫室、元老院与诸军区相辅相成，保障帝国长久稳健与附庸归心。"
 oe_m2e.2.t:0 "永恒罗马的近代加冕大典"
 oe_m2e.2.d:0 "在圣索菲亚大教堂巍峨的金色穹顶之下，自台伯河至幼发拉底河的万邦使节齐齐向从未断绝的凯撒皇座致敬。历经五百年惊涛骇浪终以近代超级强权之姿重登世界之巅，永恒罗马将在此庄严颁布引领帝国迈向未来的不朽国宪。"
 oe_m2e.2.a:0 "宣告《罗马近代立宪帝国大法》。"
 STATIC_MODIFIER_NAME_oe_m2e_byz_const_mod:0 "罗马立宪帝国宪制"
 STATIC_MODIFIER_DESC_oe_m2e_byz_const_mod:0 "法治化的帝国宪政将古典罗马法精神同近代科学治理熔于一炉。"
 oe_m2e.2.b:0 "定鼎双海海权与环洋商贸帝国。"
 STATIC_MODIFIER_NAME_oe_m2e_byz_mare_mod:0 "罗马双海海权霸业"
 STATIC_MODIFIER_DESC_oe_m2e_byz_mare_mod:0 "紫帆战舰与金角湾金融网牢牢掌控地中海及远洋贸易命脉。"
 oe_m2e.2.c:0 "加冕统筹东西两界的普世独裁大帝。"
 STATIC_MODIFIER_NAME_oe_m2e_byz_auto_mod:0 "东西普世独裁大帝"
 STATIC_MODIFIER_DESC_oe_m2e_byz_auto_mod:0 "至高无上的皇权号令自意大利至黎凡特的常备军团与辽阔行省。"
 oe_m2e.3.t:0 "世界红苹果"
 oe_m2e.3.d:0 "奥斯曼新月旗帜在久经炮火洗礼的狄奥多西城墙上高高升起，苏丹以征服者与罗马法统继承者之尊踏入地中海第一大都会。大维齐尔、耶尼切里军官与希腊、亚美尼亚及犹太社群领袖肃立阶前，静候裁定新皇都百年格局的帝国诏书。"
 oe_m2e.3.a:0 "以「罗马凯撒」之尊确立中央集权大迪万。"
 STATIC_MODIFIER_NAME_oe_m2e_tur_kayser_mod:0 "罗马凯撒法统"
 STATIC_MODIFIER_DESC_oe_m2e_tur_kayser_mod:0 "将奥斯曼卡农法典与罗马皇权仪轨融为一体，令欧亚两翼加速归心。"
 oe_m2e.3.b:0 "重赏耶尼切里近卫与托普哈内炮兵军团。"
 STATIC_MODIFIER_NAME_oe_m2e_tur_janissary_mod:0 "托普哈内火药霸权"
 STATIC_MODIFIER_DESC_oe_m2e_tur_janissary_mod:0 "重金供养的近卫新军与巨型攻城铜炮令奥斯曼大军所向披靡。"
 oe_m2e.3.c:0 "颁行米勒特宽容法，广招天下商匠重兴帝都。"
 STATIC_MODIFIER_NAME_oe_m2e_tur_millet_mod:0 "万邦商匠米勒特大都会"
 STATIC_MODIFIER_DESC_oe_m2e_tur_millet_mod:0 "受庇护的多元社群与免税商埠迅速令海峡大都会百业勃兴。"
 oe_m2e.4.t:0 "三大洲崇高帝国的近世宏纲"
 oe_m2e.4.d:0 "自多瑙河雄关绵延至开罗与汉志双圣城，奥斯曼王朝已稳稳统御欧、亚、非三大洲膏腴山河。历经财政整肃与火器革新迈入绝对主义盛世，高门朝廷将在此颁定引领帝国永葆强盛的终极国策。"
 oe_m2e.4.a:0 "全面推行「新秩序」近代化强军文治改革。"
 STATIC_MODIFIER_NAME_oe_m2e_tur_nizam_mod:0 "新秩序近代强国"
 STATIC_MODIFIER_DESC_oe_m2e_tur_nizam_mod:0 "新式军操、近代财政署与工程学院令崇高帝国始终立于强权潮头。"
 oe_m2e.4.b:0 "弘扬双圣城哈里发法统，凝聚伊斯兰世界。"
 STATIC_MODIFIER_NAME_oe_m2e_tur_caliph_mod:0 "双圣城崇高哈里发"
 STATIC_MODIFIER_DESC_oe_m2e_tur_caliph_mod:0 "无与伦比的宗教威望令四方藩邦与行省在哈里发旗帜下紧紧凝聚。"
 oe_m2e.4.c:0 "经略地中海与红海双洋舰队商贸霸权。"
 STATIC_MODIFIER_NAME_oe_m2e_tur_sea_mod:0 "双海奥斯曼舰队霸权"
 STATIC_MODIFIER_DESC_oe_m2e_tur_sea_mod:0 "君堡与苏伊士船坞联手打造的无敌海军稳控东西两大海上命脉。"
 oe_m2e.5.t:0 "伊克塔变法"
 oe_m2e.5.d:0 "随着第五军团火枪新军在开罗城堡下整装待发、叙利亚与汉志尽归掌控，陈旧的伊克塔军事采邑制已成帝国桎梏。财政大臣主张全面收归中央迪万直发俸禄，叙利亚与边疆总督呼吁缔结有序的总督省联邦契约，亚历山大卡里米大商团则愿以特许香料金融网充实国库。"
 oe_m2e.5.a:0 "财权尽归开罗中央迪万，常备军饷直发。"
 STATIC_MODIFIER_NAME_oe_m2e_mam_diwan_mod:0 "开罗中央迪万直辖制"
 STATIC_MODIFIER_DESC_oe_m2e_mam_diwan_mod:0 "直发军饷的火枪常备军与严谨田赋审计彻底消除军阀割据隐患。"
 oe_m2e.5.b:0 "颁定《总督省与谢里夫邦联大宪章》。"
 STATIC_MODIFIER_NAME_oe_m2e_mam_niyabat_mod:0 "马穆鲁克总督省宪章"
 STATIC_MODIFIER_DESC_oe_m2e_mam_niyabat_mod:0 "大马士革、阿勒颇与汉志诸总督权责分明，高效镇抚辽阔疆域。"
 oe_m2e.5.c:0 "与卡里米大商团缔结特许香料银号同盟。"
 STATIC_MODIFIER_NAME_oe_m2e_mam_karimi_mod:0 "卡里米商团金融同盟"
 STATIC_MODIFIER_DESC_oe_m2e_mam_karimi_mod:0 "官商合力的香料银号网将卡利卡特至威尼斯的滚滚财源尽汇开罗。"
 oe_m2e.6.t:0 "双海之主"
 oe_m2e.6.d:0 "悬挂苏丹金旗的远洋巨舰穿过重浚一新的图拉真—苏伊士运河船闸，自地中海直抵红海、亚丁与印度洋。彻底粉碎欧洲好望角封锁并实现国家近代转型后，埃及将在盛大典礼上确立双海苏丹国的永恒宏纲。"
 oe_m2e.6.a:0 "定鼎苏伊士—亚丁双洋香料海权帝国。"
 STATIC_MODIFIER_NAME_oe_m2e_mam_ocean_mod:0 "苏伊士—亚丁双洋海权"
 STATIC_MODIFIER_DESC_oe_m2e_mam_ocean_mod:0 "独掌连接东西方最近海运大动脉，令开罗成为全球海贸的黄金闸口。"
 oe_m2e.6.b:0 "尊崇双圣城与伊斯兰学术护法大苏丹。"
 STATIC_MODIFIER_NAME_oe_m2e_mam_sanct_mod:0 "双圣城与爱资哈尔护法"
 STATIC_MODIFIER_DESC_oe_m2e_mam_sanct_mod:0 "爱资哈尔学术盛誉与双圣城监护权令开罗傲立伊斯兰文明之巅。"
 oe_m2e.6.c:0 "大兴尼罗河水利工场，打造中东富庶实业强国。"
 STATIC_MODIFIER_NAME_oe_m2e_mam_nile_mod:0 "尼罗河农工实业心脏"
 STATIC_MODIFIER_DESC_oe_m2e_mam_nile_mod:0 "兴盛的三角洲水利、精纺与军工制造令埃及人口繁盛、实业冠绝中东。"
 oe_m2e.7.t:0 "沙皇国之魂"
 oe_m2e.7.d:0 "随着新式常备军团在克里姆林宫白石墙下列阵受阅，莫斯科正面临俄罗斯历史上最深刻的宪制抉择。铁腕派力主推行特辖专制以彻底铲除大贵族世袭私权，地方与市民代表呼吁赋予全俄缙绅会议常设地位，改革派则倡议推行不问出身、唯功是举的《表官制》。"
 oe_m2e.7.a:0 "铁腕推行特辖专制，一切贵族尽归皇室役使。"
 STATIC_MODIFIER_NAME_oe_m2e_rus_oprich_mod:0 "沙皇役使专制体制"
 STATIC_MODIFIER_DESC_oe_m2e_rus_oprich_mod:0 "铁腕集权将领主采邑与辽阔边疆统统纳入皇室高效动员体系。"
 oe_m2e.7.b:0 "确立全俄缙绅会议宪章，与诸阶层共治天下。"
 STATIC_MODIFIER_NAME_oe_m2e_rus_sobor_mod:0 "全俄缙绅共治宪章"
 STATIC_MODIFIER_DESC_oe_m2e_rus_sobor_mod:0 "自诺夫哥罗德至喀山的各阶层代表踊跃纳赋，换取稳健长久的国内安定。"
 oe_m2e.7.c:0 "颁行《表官制》，以军政功绩选拔近代官僚精英。"
 STATIC_MODIFIER_NAME_oe_m2e_rus_ranks_mod:0 "帝国表官功绩制"
 STATIC_MODIFIER_DESC_oe_m2e_rus_ranks_mod:0 "十四等文武功绩晋升体系为沙俄源源锻造精干近代军政骨干。"
 oe_m2e.8.t:0 "全罗斯皇帝加冕大典"
 oe_m2e.8.d:0 "涅瓦河口军旗猎猎、西伯利亚商队万里不绝、阿斯特拉罕稳镇里海门户，全罗斯已傲然崛起为横跨欧亚的超级大帝国。面对齐聚克里姆林宫的王公、主教与各国使节，皇帝庄严宣告俄罗斯近代大帝国的永恒道路。"
 oe_m2e.8.a:0 "坚持面向欧洲的近代海陆与科学维新路线。"
 STATIC_MODIFIER_NAME_oe_m2e_rus_euro_mod:0 "面向欧洲的近代强国"
 STATIC_MODIFIER_DESC_oe_m2e_rus_euro_mod:0 "波罗的海良港、科学院与乌拉尔工矿携手推动俄罗斯跻身近代列强前列。"
 oe_m2e.8.b:0 "弘扬第三罗马正教皇权与钢铁常备雄师。"
 STATIC_MODIFIER_NAME_oe_m2e_rus_third_mod:0 "第三罗马正教帝国"
 STATIC_MODIFIER_DESC_oe_m2e_rus_third_mod:0 "炽热正教信仰与无穷兵源令俄罗斯陆军面对任何反俄同盟皆屹立不倒。"
 oe_m2e.8.c:0 "全面经略伏尔加至西伯利亚的欧亚大陆纵深。"
 STATIC_MODIFIER_NAME_oe_m2e_rus_sib_mod:0 "横贯欧亚的大陆巨人"
 STATIC_MODIFIER_DESC_oe_m2e_rus_sib_mod:0 "帝国驿道、河运与哥萨克拓荒网将万里欧亚纵深紧密凝聚于莫斯科掌中。"
 oe_m2e.9.t:0 "《新札撒》抉择"
 oe_m2e.9.d:0 "在重焕生机的新萨莱砖石大殿之下，大忽里勒台正围绕术赤兀鲁思如何在火炮与印刷时代续写霸业展开激辩。都市文官主张全面转向定居火药君主制，诸翼别克呼吁保留并规范兀鲁思联邦宪章，黑海与里海商帮则力倡打造沟通欧亚的草原商贸帝国。"
 oe_m2e.9.a:0 "以新萨莱为核，迈向定居化近代火药大汗国。"
 STATIC_MODIFIER_NAME_oe_m2e_glh_sedent_mod:0 "定居火药大汗国"
 STATIC_MODIFIER_DESC_oe_m2e_glh_sedent_mod:0 "坚城堡垒、青铜铸炮与田赋清册令草原铁骑兼具定居帝国的深厚财力。"
 oe_m2e.9.b:0 "颁行《诸翼兀鲁思与四大柱石联邦大宪章》。"
