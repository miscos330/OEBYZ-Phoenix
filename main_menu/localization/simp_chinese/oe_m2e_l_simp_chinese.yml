 oe_m2e.12.d:0 "自英吉利海峡至阿尔卑斯山麓，法兰西以冠绝欧陆的军事艺术、启蒙科学与统一法政令整个西方世界仰望。历经五百年淬炼登临欧陆之巅，巴黎将在盛典上颁布照耀近代世纪的法兰西永恒宏纲。"
