 OE_PILLARS_LAW_PURSE_REQUIRED: "内帑足以支付当前三个月的内帑收入。"
 OE_PILLARS_LAW_PURSE_PAYMENT: "消耗#R 三个月内帑收入#!。"
 OE_PILLARS_CORPUS_REFORM_REQUIRED: "已完成帝国改革“新编民法大全”。"
 OE_PILLARS_CORPUS_UNLOCK: "解锁国家“法典”法律中的原版法条“民法大全”，以及帝国法典法条“新编民法大全”。"
 oe_pillars_law_change_price: "更易帝国法度"
 oe_ir_corpus_desc: "帝国的法学家将历代敕令、判例与法学解释重新校订，使散见于旧卷的规则成为官吏与臣民皆可遵循的成文法。\n\n消耗#R 50#!帝国权威，解锁国家“法典”法律中的原版法条“民法大全”，以及帝国法度中的“新编民法大全”。不会自动切换法条。"
 oe_pillars_imperial_code_law_desc: "由皇帝颁行的成文法，约束官署的裁断，确定帝国征税与行政的依据。"
 oe_pillars_justinian_code_desc: "以查士丁尼的法学汇编为共同准绳，使地方官署的判决与征收有章可循。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_new_corpus_desc: "将古老法典与当代敕令编为一体，使宫廷与地方的法度彼此相通。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_citizenship_law_desc: "谁能以罗马公民自居，决定帝国如何接纳新土地及其居民。"
 oe_pillars_exclusive_citizenship_desc: "守护既有公民共同体的边界，以紧密的认同维系军伍，也使新来者更难融入。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_roman_citizenship_desc: "以罗马的法律、语言与公共义务联结帝国居民，使归附者逐渐成为共同家园的公民。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_universal_citizenship_desc: "帝国的庇护不应止于语言与出身；承担共同义务者，皆可分享公民的尊荣。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_land_tax_law_desc: "规定土地流转的优先次序，以及田赋无法足额缴纳时的责任归属。"
 oe_pillars_land_preemption_desc: "承认地方有势之家对待售田产的优先购买权，以其财力维系田地与赋税，也加重他们在乡里的分量。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_allelengyon_desc: "由富有田产者分担贫困农户拖欠的税额，使小农得以保全土地，而不因欠税沦为依附之人。\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
