# NEW 2026-11-22 v10.0 Worker 2 (Slot 78): Playable Venice & Genoa Maritime Republics (oe_plat_). Generated by gen_playable_latin_rep.py.
 oe_plat_player_only_tt:0 "当前国家由人类玩家执掌威尼斯或热那亚海洋共和国主线。"
 oe_plat_b_chioggia_vendetta:0 "基奥贾潟湖死斗宿怨"
 oe_plat_b_suez_timber_pact:0 "苏伊士秘密船材与香料暗盟"
 oe_plat_b_diu_portuguese_wrath:0 "第乌暗助红海舰队之怨"
 oe_plat_b_asientos_creditor:0 "皮亚琴察白银承销与主权信用纽带"
 oe_plat_ref_serenissima_stato_mar:0 "威尼斯至善海洋共和国（Stato da Màr）"
 oe_plat_ref_serenissima_stato_mar_desc:0 "以军械库标准化流水线船台、十人团情报网络与贯通亚得里亚海—克里特—塞浦路斯的海洋要塞群为骨架，大幅削减跨海行政损耗并赋予桨帆主力舰队压倒性威仪。"
 oe_plat_ref_casa_san_giorgio_bank:0 "热那亚圣乔治金融主权国（Casa di San Giorgio）"
 oe_plat_ref_casa_san_giorgio_bank_desc:0 "1407 年创立的股份制债权人银行接管关税、殖民商站与跨国银票清算业务，凭借皮亚琴察汇兑会与主权承销网络执掌欧洲金融命脉，赋予全欧亚最低国债利率与海量举债信用。"
 oe_plat_maritime_charter_law:0 "拉丁海洋共和国商贸宪章法"
 oe_plat_maritime_charter_law_desc:0 "确立威尼斯与热那亚在东地中海与西欧之间的立国方略：在武装商队护航制、皮亚琴察离岸白银承销与意大利本土陆海平衡之间定鼎国策。"
 oe_plat_pol_stato_mar_convoys:0 "海洋领地定期武装护航队（Mude）"
 oe_plat_pol_stato_mar_convoys_desc:0 "按季组织官督商办的重装桨帆护航船队往返亚历山大、克里特、黑海与佛兰德斯，以海权存在感与战舰威力保驾商路。"
 oe_plat_pol_piacenza_asientos:0 "皮亚琴察汇兑会与主权白银承销"
 oe_plat_pol_piacenza_asientos_desc:0 "依托离岸纯汇票清算网络调拨美洲白银与列强军饷，压低本国国债利息并成倍扩增国际信贷与商税收益。"
 oe_plat_pol_terraferma_balance:0 "本土陆疆（Terraferma）与腹地均衡"
 oe_plat_pol_terraferma_balance_desc:0 "深耕伦巴第与威尼托粮仓及亚平宁隘口要塞，摆脱单纯依赖海外粮食与雇佣兵的脆弱格局，铸就陆海兼备的稳固共和国。"
 oe_plat_arsenale_slipway:0 "军械库流水装配船台与圣乔治海贸总行"
 oe_plat_arsenale_slipway_desc:0 "融合威尼斯运河移动装配船台与热那亚圣乔治海外商贸清算署的尖端海港中枢。预制标准龙骨、缆索与舰炮，同步扩容本地海商容量、制海权投射与城建/造舰速率。"
 oe_plat_arsenale_slipway_maint:0 "军械库船台与圣乔治总行（港务维护）"
 oe_plat_venetian_galleass:0 "威尼斯重型桨帆炮舰（Galeazza）"
 oe_plat_venetian_galleass_desc:0 "军械库流水线倾力打造的海上浮动要塞：高大船舷与双层炮甲板环列重炮，兼具桨帆战舰无视风向的机动性与远洋重舰的恐怖侧舷齐射，曾在勒班陀海战以六舰撕碎整条敌军战线。"
 oe_plat_genoese_pavise_crossbow:0 "热那亚大盾精锐弩手与火枪卫队"
 oe_plat_genoese_pavise_crossbow_desc:0 "名震地中海与西欧战场的热那亚职业佣兵与市民卫队。依托高大坚固的帕维斯立盾（Pavise）从容装填重弩与火绳枪，在攻城战与陆海登陆战中具备极强抗打击韧性与破甲火力。"
 oe_plat_adv_galleass_line:0 "军械库流水线重型桨帆炮舰与大盾卫队"
 oe_plat_adv_galleass_line_desc:0 "将威尼斯军械库预制船材流水线与热那亚大盾职业射手步兵防务融为一体，解锁威尼斯重型桨帆炮舰（Galeazza）与热那亚大盾弩手火枪卫队，全面提升桨帆战力与造舰速率。"
 STATIC_MODIFIER_NAME_oe_plat_golden_horn_customs_mod:0 "金角湾免税商馆特权"
 STATIC_MODIFIER_DESC_oe_plat_golden_horn_customs_mod:0 "凭借对海峡航运的精准施压与商船运力，在博斯普鲁斯与爱琴海赢得极其优厚的免税转口特权。"
 STATIC_MODIFIER_NAME_oe_plat_chioggia_total_war_mod:0 "基奥贾决战动员令"
 STATIC_MODIFIER_DESC_oe_plat_chioggia_total_war_mod:0 "威尼斯沉船封锁潟湖、热那亚舰队死战不退——百年海权宿怨燃至顶点，水师战意与桨帆火力飙升。"
 STATIC_MODIFIER_NAME_oe_plat_peace_of_turin_mod:0 "《都灵和约》商路休养"
 STATIC_MODIFIER_DESC_oe_plat_peace_of_turin_mod:0 "经萨伏依调停暂息双城血战，重整商船编队与国库信用，令地中海贸易迅速回暖。"
 STATIC_MODIFIER_NAME_oe_plat_council_of_ten_mod:0 "十人团（Consiglio dei Dieci）密探政制"
 STATIC_MODIFIER_DESC_oe_plat_council_of_ten_mod:0 "威尼斯十人团以铁腕密查与迅速决断粉碎政变阴谋，令国家控制力与长治久安冠绝亚平宁。"
 STATIC_MODIFIER_NAME_oe_plat_great_council_balance_mod:0 "大议会古典共和均衡"
 STATIC_MODIFIER_DESC_oe_plat_great_council_balance_mod:0 "维护大议会多方制衡与自由商帮话语权，培育深厚共和传统与市民忠诚。"
 STATIC_MODIFIER_NAME_oe_plat_san_giorgio_charter_mod:0 "1407 圣乔治银行债权主权宪章"
 STATIC_MODIFIER_DESC_oe_plat_san_giorgio_charter_mod:0 "将国债与海外商站交由圣乔治银行统一证券化托管，彻底逆转破产危局并铸就欧陆最强金融引擎。"
 STATIC_MODIFIER_NAME_oe_plat_arsenale_assembly_mod:0 "威尼斯军械库运河流水线"
 STATIC_MODIFIER_DESC_oe_plat_arsenale_assembly_mod:0 "标准化预制构件沿运河逐站装配，全盛期可创「一日下水一艘武装战舰」的工业奇迹。"
 STATIC_MODIFIER_NAME_oe_plat_terraferma_expansion_mod:0 "本土陆疆（Stato di Terraferma）经略"
 STATIC_MODIFIER_DESC_oe_plat_terraferma_expansion_mod:0 "进军帕多瓦、维罗纳与伦巴第富庶平原，获取稳固粮源、山地要隘与陆上常备兵力。"
 STATIC_MODIFIER_NAME_oe_plat_gazaria_grain_mod:0 "加扎里亚（Gazaria）卡法黑海粮道"
 STATIC_MODIFIER_DESC_oe_plat_gazaria_grain_mod:0 "依托克里米亚卡法要塞与黑海谷物长约，将草原小麦与东方丝绸源源运回利古里亚与意大利市场。"
 STATIC_MODIFIER_NAME_oe_plat_kaffa_bastion_loc_mod:0 "卡法圣乔治海防石堡"
 STATIC_MODIFIER_DESC_oe_plat_kaffa_bastion_loc_mod:0 "圣乔治银行斥巨资加固的克里米亚双层石城与深水货栈，令卡法成为黑海北岸最坚固的拉丁桥头堡。"
 STATIC_MODIFIER_NAME_oe_plat_lazzaretto_mod:0 "圣玛丽亚双岛检疫港（Lazzaretto）"
 STATIC_MODIFIER_DESC_oe_plat_lazzaretto_mod:0 "首创四十日海港隔离检疫（Quarantena）与货舱熏蒸制度，既护海贸畅行无阻，又赋予全境长久抗疫繁荣底蕴。"
 STATIC_MODIFIER_NAME_oe_plat_lazzaretto_loc_mod:0 "威尼斯双岛检疫卫生署"
 STATIC_MODIFIER_DESC_oe_plat_lazzaretto_loc_mod:0 "世界最早的常设港口检疫隔离与海员疗养所，大幅提升母港繁荣与商品吞吐信誉。"
 STATIC_MODIFIER_NAME_oe_plat_levant_plantations_mod:0 "克里特—塞浦路斯蔗糖甜酒商网"
 STATIC_MODIFIER_DESC_oe_plat_levant_plantations_mod:0 "整合坎迪亚甜酒与塞浦路斯蔗糖、精棉种植园，令东地中海群岛成为共和国最富庶的现金奶牛。"
 STATIC_MODIFIER_NAME_oe_plat_levant_spice_lifeline_mod:0 "苏伊士—亚历山大香料命脉续存"
 STATIC_MODIFIER_DESC_oe_plat_levant_spice_lifeline_mod:0 "凭借秘密运往红海的达尔马提亚橡木与炮匠，马穆鲁克—威尼斯暗盟力抗好望角封锁，保住黎凡特胡椒与香料黄金商路！"
 STATIC_MODIFIER_NAME_oe_plat_century_of_genoese_mod:0 "「热那亚人的世纪」：皮亚琴察白银汇兑霸权"
 STATIC_MODIFIER_DESC_oe_plat_century_of_genoese_mod:0 "通过 1557 年西班牙王室承销包干契约（Asientos）与皮亚琴察离岸汇兑会，热那亚银团总控全欧美洲白银调拨与主权债清算！"
 STATIC_MODIFIER_NAME_oe_plat_lepanto_galleass_mod:0 "勒班陀重型桨帆炮舰舰队"
 STATIC_MODIFIER_DESC_oe_plat_lepanto_galleass_mod:0 "多炮重型桨帆巨舰列阵前锋，以毁灭性近海侧舷齐射与封锁火力主宰整片地中海战局。"
 STATIC_MODIFIER_NAME_oe_plat_candia_bastion_mod:0 "坎迪亚二十年不屈堡垒"
 STATIC_MODIFIER_DESC_oe_plat_candia_bastion_mod:0 "以惊人毅力固守爱琴海与东地中海每一座孤岛星堡，赢得全欧敬仰的海陆坚守意志。"
 STATIC_MODIFIER_NAME_oe_plat_atlantic_breakout_mod:0 "意大利商盟直布罗陀远洋破局"
 STATIC_MODIFIER_DESC_oe_plat_atlantic_breakout_mod:0 "冲破直布罗陀狭口，将拉丁海商的帆影与金融票号延伸至大西洋诸港与远洋航线！"
 STATIC_MODIFIER_NAME_oe_plat_open_libro_mod:0 "开放《黄金书》新市民宪政"
 STATIC_MODIFIER_DESC_oe_plat_open_libro_mod:0 "打破世袭贵族封闭门阀，吸纳本土富商与银行股东入主议会，为古老共和国注入近代改革生机。"
 STATIC_MODIFIER_NAME_oe_plat_enlightened_free_port_mod:0 "阿尔杜斯印刷、穆拉诺玻璃与启蒙自由港"
 STATIC_MODIFIER_DESC_oe_plat_enlightened_free_port_mod:0 "以世界领先的活字印刷、奢侈玻璃工艺与自由港关税政策引领地中海启蒙文化与高端制造。"
 STATIC_MODIFIER_NAME_oe_plat_maritime_federation_mod:0 "地中海近代海洋商业联邦宪法"
 STATIC_MODIFIER_DESC_oe_plat_maritime_federation_mod:0 "彻底粉碎坎波福尔米奥覆亡宿命！以近代联邦宪法、常备重炮海军与圣乔治主权信用巍然屹立于 19 世纪之巅。"
 STATIC_MODIFIER_NAME_oe_plat_creditor_leverage_mod:0 "主权债仲裁与海港抵押霸权"
 STATIC_MODIFIER_DESC_oe_plat_creditor_leverage_mod:0 "以国际银团联署制裁震慑违约宫廷，将抵押海关与商站特许牢牢收归己有。"
 oe_plat_dec_charter_san_giorgio.title:0 "扩权圣乔治银行与皮亚琴察汇兑会"
 oe_plat_dec_charter_san_giorgio.desc:0 "将共和国海关证券、殖民商站财税与跨国汇票清算交由圣乔治银行扩权经营，逐级拉升金融信用与船台等级（最高 4 级），大幅削减国债利率并扩大信贷额度。"
 oe_plat_dec_charter_san_giorgio.a:0 "颁授圣乔治银行新债券与汇兑特许"
 oe_plat_dec_charter_san_giorgio_tt:0 "军械库/金融等级 #G +1#!（上限 4 级），寡头金融轴 #Y +10#!，并获得 #Y 25 年#!「圣乔治银行债权主权宪章」。"
 oe_plat_dec_expand_arsenale_line.title:0 "扩建军械库运河移动装配船台"
 oe_plat_dec_expand_arsenale_line.desc:0 "按威尼斯军械库工业化标准增设预制龙骨仓库、索具坊与重炮铸炉，逐级提升军械库/金融等级（最高 4 级），令舰队建造速度与桨帆火炮战力冠绝地中海。"
 oe_plat_dec_expand_arsenale_line.a:0 "下令扩建军械库标准化装配船台"
 oe_plat_dec_expand_arsenale_line_tt:0 "军械库/金融等级 #G +1#!（上限 4 级），获得 #G +10#! 海军传统与 #Y 25 年#!「威尼斯军械库运河流水线」。"
 oe_plat_dec_open_libro_doro.title:0 "开放《黄金书》（Libro d'Oro）新市民宪政"
 oe_plat_dec_open_libro_doro.desc:0 "打破绵延数百年的封闭世袭贵族名册，允许陆疆富商、海外总督与圣乔治银行股东合法入籍大议会，为古老海洋共和国重注近代宪政与科研活力。"
 oe_plat_dec_open_libro_doro.a:0 "向新市民与商团股东敞开《黄金书》名册"
 oe_plat_dec_open_libro_doro_tt:0 "标记《黄金书》开放，寡头轴回落 #G -20#!，提升共和传统并获得 #Y 40 年#!「开放《黄金书》新市民宪政」。"
 oe_plat.1.t:0 "金角湾特权与海峡关税战"
 oe_plat.1.d:0 "君士坦丁堡金角湾两岸商帆密布：加拉塔热那亚堡垒与威尼斯商馆隔水相望，围绕博斯普鲁斯海峡关税与忒涅多斯岛归属明争暗斗。此刻东罗马皇室国库拮据，总督府与元老院争论着对策：是趁虚施压索取免税商馆特许，还是以银团借款换取长期海峡航运垄断？"
 oe_plat.1.a:0 "派遣重装桨帆舰队施压海峡，强索金角湾免税特许"
 oe_plat.1.a.tt:0 "获得 #Y 25 年#!「金角湾免税商馆特权」（商容、海贸与制海权提升）及 #G +10#! 海军传统。"
 oe_plat.1.b:0 "以商团低息借款示好君士坦丁堡，换取长期稳固商约"
 oe_plat.1.b.tt:0 "耗费 #R -80#! 金币，金融寡头轴 #Y +10#!，获得 #G +12#! 威望与双边善意。"
 oe_plat.2.t:0 "1378–1381 基奥贾决战与卡洛·泽诺"
 oe_plat.2.d:0 "威尼斯与热那亚绵延百年的海上霸权宿怨终于在亚得里亚海北端爆发终极死斗！热那亚舰队联合陆上盟友直插威尼斯潟湖南门基奥贾，而威尼斯人沉船封堵航道、死守孤岛，并急召名将卡洛·泽诺率海外舰队回援反围！此战成败将永久决定两座共和国未来百年的海洋命运。"
 oe_plat.2.a:0 "死战基奥贾！倾尽造船厂与水师底蕴誓夺海权霸主"
 oe_plat.2.a.tt:0 "获得 #Y 20 年#!「基奥贾决战动员令」（桨帆战力、海军士气与造舰速度大增）及 #G +15#! 海军传统。"
 oe_plat.2.b:0 "接受 1381《都灵和约》斡旋，保全商船主力休养生息"
 oe_plat.2.b.tt:0 "获得 #Y 20 年#!「《都灵和约》商路休养」（海贸效率、厌战消减与稳定成本优化）。"
 oe_plat.3.t:0 "十人团（Consiglio dei Dieci）与法列罗阴谋"
 oe_plat.3.d:0 "总督宫暗流涌动！密报揭露野心勃勃的马里诺·法列罗企图勾结水手工匠推翻贵族共和、自立为威尼斯独裁领主。高度机密的「十人团」（Consiglio dei Dieci）迅速扑灭了政变火星，此刻元老院面临深远抉择：是扩大十人团凌驾一切的国家安全密网，还是将权力交回大议会维持共和平衡？"
 oe_plat.3.a:0 "扩权十人团密探与国安法庭，杜绝一切派系政变"
 oe_plat.3.a.tt:0 "寡头安全轴上升 #Y +25#!，获得 #Y 35 年#!「十人团密探政制」（月度控制力、稳定成本与反叛压制）。"
 oe_plat.3.b:0 "约束秘密法庭，捍卫大议会古典共和分权传统"
 oe_plat.3.b.tt:0 "寡头轴回落 #G -15#!，获得共和传统与 #Y 30 年#!「大议会古典共和均衡」。"
 oe_plat.4.t:0 "1407 圣乔治银行（Casa di San Giorgio）成立"
 oe_plat.4.d:0 "连年海战令热那亚公债堆积如山、国库濒临停摆！城中富商与债权人提出了一项震古烁今的金融创举：将分散的公债合并为统一股份，成立「圣乔治银行」（Casa di San Giorgio），由银行接管国家关税、卡法与希俄斯海外商站收益并发行可流通票据——一座史无前例的「国中之国」级金融主权体正破土而出！"
 oe_plat.4.a:0 "敕立圣乔治银行，将公债与海外商站交由金融主权体托管！"
 oe_plat.4.a.tt:0 "启用「热那亚圣乔治金融主权国」改革，船台/金融等级 #G +1#!，获得 #Y 40 年#!「圣乔治银行债权主权宪章」！"
 oe_plat.4.b:0 "拒绝债权人接管主权，维持市民议会直管国库"
 oe_plat.4.b.tt:0 "寡头轴 #G -10#!，获得共和传统与 #Y 25 年#!「大议会古典共和均衡」。"
 oe_plat.5.t:0 "威尼斯军械库流水线与 Stato di Terraferma"
 oe_plat.5.d:0 "威尼斯军械库（Arsenale）内锤声如雷！数千名被称为「军械匠」（Arsenalotti）的世袭工匠沿运河建起了世界最早的移动装配流水线——船壳顺水前行，逐站安装桅杆、船桨、帆缆与火炮，一日便可下水一艘武装战舰！与此同时，米兰维斯孔蒂的扩张也迫使威尼斯思索是否大举进军意大利本土陆疆（Stato di Terraferma）。"
 oe_plat.5.a:0 "全面扩建军械库移动流水线，打造地中海第一海权机器！"
 oe_plat.5.a.tt:0 "启用「威尼斯至善海洋共和国」改革，军械库等级 #G +1#!，获得 #Y 40 年#!「威尼斯军械库运河流水线」！"
 oe_plat.5.b:0 "挥师经略帕多瓦与伦巴第本土陆疆（Stato di Terraferma）"
 oe_plat.5.b.tt:0 "获得 #Y 35 年#!「本土陆疆经略」（人力、粮食与陆军士气强化）及 #G +10#! 陆军传统。"
 oe_plat.6.t:0 "加扎里亚（Gazaria）的坚守：保卫卡法与黑海粮道"
 oe_plat.6.d:0 "远在克里米亚半岛的要塞港卡法（Kaffa）与塔纳，是热那亚「加扎里亚」（Gazaria）黑海殖民帝国的心脏，源源不断向意大利输送草原小麦与丝绸。如今海峡风云变幻、草原群雄并起，圣乔治银行必须决断：是倾力加固卡法石堡并签下黑海长期粮约，还是将资本转向西地中海毛纺与明矾贸易？"
 oe_plat.6.a:0 "倾力加固卡法要塞，缔结黑海—草原谷物长约（联通欧亚经济 2.0）"
 oe_plat.6.a.tt:0 "激活加扎里亚粮道全局标志，获得 #Y 35 年#!「加扎里亚卡法黑海粮道」并强化卡法要塞防御与商容！"
 oe_plat.6.b:0 "收缩黑海战线，将银团资本转向西地中海与伊比利亚商路"
 oe_plat.6.b.tt:0 "获得 #G +200#! 金币及 #Y 25 年#!「金角湾免税商馆特权」（海贸与商容增幅）。"
 oe_plat.7.t:0 "圣玛丽亚双岛检疫港（Lazzaretto Vecchio & Nuovo）"
 oe_plat.7.d:0 "黑死病的阴影仍在地中海商港间反复游荡。威尼斯公共卫生官首创了一套划时代的防疫体系：在潟湖外岛设立老检疫所（Lazzaretto Vecchio, 1423）收治染疫船员，再建新检疫所（Lazzaretto Nuovo, 1468）对所有抵港商船与货物实施四十日隔离熏蒸（Quarantena）！这一创举既守护人命，也奠定了近代港口检疫法典。"
 oe_plat.7.a:0 "斥资兴建双岛检疫隔离港，确立四十日海港防疫法典"
 oe_plat.7.a.tt:0 "耗费 #R -100#! 金币，激活检疫宪章标志，获得 #Y 40 年#!「圣玛丽亚双岛检疫港」与威尼斯母港繁荣增益！"
 oe_plat.7.b:0 "仅行简易抽检，避免延误香料商船靠岸周转"
 oe_plat.7.b.tt:0 "获得 #G +150#! 金币与短期商贸增益，但未建成双岛检疫体系。"
 oe_plat.8.t:0 "塞浦路斯与克里特：地中海蔗糖、甜酒与棉贸帝国"
 oe_plat.8.d:0 "东地中海两座明珠——克里特（Candia）与塞浦路斯（Nicosia / Famagusta）不仅扼守通往亚历山大与叙利亚的必经航道，更是全欧最珍贵的蔗糖、玛尔姆齐甜酒与精棉产地！参议院正商议如何开发这两座海洋帝国的前沿枢纽。"
 oe_plat.8.a:0 "深耕蔗糖、甜酒与精棉种植园，把岛屿铸成黄金商库"
 oe_plat.8.a.tt:0 "获得 #G +180#! 金币及 #Y 30 年#!「克里特—塞浦路斯蔗糖甜酒商网」（产效、海贸与繁荣提升）。"
 oe_plat.8.b:0 "将克里特与塞浦路斯全面要塞化为远航海军前哨基地"
 oe_plat.8.b.tt:0 "获得 #G +12#! 海军传统及 #Y 30 年#!「勒班陀重型桨帆炮舰舰队」战备增益。"
 oe_plat.9.t:0 "秘密运木苏伊士：马穆鲁克—威尼斯抗葡暗盟"
 oe_plat.9.d:0 "里斯本传来的消息震动里亚托交易所：葡萄牙人已绕过好望角闯入印度洋，以炮舰与通行证（Cartaz）截断红海胡椒商路，亚历山大港的香料货仓一夜空空！开罗的马穆鲁克苏丹派来密使求援——只要我们暗中经亚历山大与尼罗河向苏伊士运送达尔马提亚橡木、重炮与军械库船匠，红海舰队便能赴第乌迎战葡军！"
 oe_plat.9.a:0 "密运达尔马提亚橡木与船匠赴苏伊士！联手马穆鲁克抗葡！"
 oe_plat.9.a.tt:0 "耗费 #R -120#! 金币，激活威马抗葡暗盟标志（联动 Slot 76 马穆鲁克），获得 #Y 40 年#!「苏伊士—亚历山大香料命脉续存」！"
 oe_plat.9.b:0 "恪守基督教中立避免激怒葡萄牙，转而深耕欧陆高端工坊"
 oe_plat.9.b.tt:0 "避免与葡萄牙交恶，获得 #G +10#! 威望与 #Y 25 年#!「克里特—塞浦路斯蔗糖甜酒商网」转产红利。"
 oe_plat.10.t:0 "「热那亚人的世纪」：1557 Asientos 与皮亚琴察汇兑会"
 oe_plat.10.d:0 "1557 年伊比利亚王室主权债务重组震动全欧，德意志旧银团纷纷退场，而热那亚银行寡头却迎来了史家盛赞的「热那亚人的世纪」（El Siglo de los Genoveses）！通过包揽西班牙王室军费承销契约（Asientos）并在皮亚琴察（Piacenza）建立不交易一克实物、纯靠汇票对冲清算全欧白银的离岸金融大会，热那亚正成为执掌美洲白银潮的幕后心脏！"
 oe_plat.10.a:0 "包揽王室 Asientos 承销，开启皮亚琴察白银离岸汇兑会！"
 oe_plat.10.a.tt:0 "船台/金融等级 #G +1#!，激活皮亚琴察汇兑全局标志（联动欧亚经济 2.0），获得 #Y 45 年#!「热那亚人的世纪」！"
 oe_plat.10.b:0 "警惕单一君主违约风险，分散放贷意大利与德意志自由市"
 oe_plat.10.b.tt:0 "寡头轴 #G -5#!，获得 #G +150#! 金币及 #Y 30 年#!「圣乔治银行债权主权宪章」。"
 oe_plat.11.t:0 "勒班陀重型桨帆炮舰（Galeazza）的怒吼"
 oe_plat.11.d:0 "在海战火炮日趋猛烈的时代，船匠们将巨型商船的高大船体改造成双层重炮战舰——「重型桨帆炮舰」（Galeazza）。六艘巨舰只需迎风横亘在舰队最前线，全向齐射的数十门重型青铜炮便足以将冲锋的敌军桨帆阵撕成碎片！海军司令部恳请将之列为共和国主力旗舰。"
 oe_plat.11.a:0 "批量列装重型桨帆炮舰旗舰，以侧舷巨炮主宰地中海！"
 oe_plat.11.a.tt:0 "获得 #G +15#! 海军传统与 #Y 35 年#!「勒班陀重型桨帆炮舰舰队」（桨帆战力 #G +20%#!、海军士气与封锁效率）。"
 oe_plat.11.b:0 "优先量产高速轻型护航桨帆船，全面覆盖海上存在感"
 oe_plat.11.b.tt:0 "获得 #Y 35 年#!「威尼斯军械库运河流水线」（造舰速度、水手与制海威力）。"
 oe_plat.12.t:0 "坎迪亚二十年保卫战与大西洋破局"
 oe_plat.12.d:0 "十七世纪地中海霸权博弈步入白热化：东翼克里特与爱琴海岛屿面临陆海强权持久围攻，西翼大西洋与印度洋航线又正被北欧与伊比利亚列强瓜分！参议院陷入激烈争辩：是以坎迪亚二十年保卫战般的悲壮意志死守东地中海每一寸要塞，还是组建「意大利商业同盟」船队直出直布罗陀杀入大西洋？"
 oe_plat.12.a:0 "组建意大利商盟远洋船队，直出直布罗陀开拓大西洋！"
 oe_plat.12.a.tt:0 "获得 #Y 40 年#!「意大利商盟直布罗陀远洋破局」（海军与贸易航程 #G +30%#!、海贸与商容暴涨）！"
 oe_plat.12.b:0 "死守坎迪亚与爱琴海每一座星堡，寸海不让！"
 oe_plat.12.b.tt:0 "获得 #G +20#! 威望与 #Y 35 年#!「坎迪亚二十年不屈堡垒」（全球防御 #G +20%#!、要塞维护与海军士气）。"
 oe_plat.13.t:0 "《黄金书》（Libro d'Oro）开放改革"
 oe_plat.13.d:0 "自十四世纪封锁贵族名册以来，世袭登记在《黄金书》（Libro d'Oro）上的古老家族日益凋零僵化，而威尼托、利古里亚本土的新兴实业家与海外银行大股东却被挡在议会门外。开明派参议员疾呼：唯有敞开《黄金书》吸纳新市民精英，古老的商业共和国方能免于腐朽停滞！"
 oe_plat.13.a:0 "开放《黄金书》，接纳本土富商与银行股东入籍议会！"
 oe_plat.13.a.tt:0 "标记《黄金书》开放，寡头轴回落 #G -20#!，提升共和传统并获 #Y 40 年#!「开放《黄金书》新市民宪政」。"
 oe_plat.13.b:0 "恪守古老门阀血统，维护世袭贵族名册的尊荣"
 oe_plat.13.b.tt:0 "寡头轴上升 #Y +15#!，获得 #G +15#! 威望与贵族满意提升。"
 oe_plat.14.t:0 "威尼斯活字印刷、玻璃工艺与启蒙自由港"
 oe_plat.14.d:0 "当旧商路竞争日趋激烈，威尼斯与热那亚的工坊却在高端工艺与文化出版领域绽放耀眼光芒：阿尔杜斯希腊—拉丁活字书坊印行全欧半数经典典籍，穆拉诺岛水晶玻璃与利古里亚精纺丝绒千金难求！若再辅以启蒙自由港政策，共和国必将引领地中海近代文艺与工业之先。"
 oe_plat.14.a:0 "设立启蒙自由港并赞助活字印刷与穆拉诺玻璃行会"
 oe_plat.14.a.tt:0 "文化传统 #G +10#!，科研加速，获得 #Y 35 年#!「阿尔杜斯印刷、穆拉诺玻璃与启蒙自由港」。"
 oe_plat.14.b:0 "严控行会秘技外泄，以重商专卖税榨取奢侈品超额利税"
 oe_plat.14.b.tt:0 "获得 #G +220#! 金币及 #Y 30 年#!「克里特—塞浦路斯蔗糖甜酒商网」高端产效增益。"
 oe_plat.15.t:0 "粉碎坎波福尔米奥命运：海洋联邦宪法"
 oe_plat.15.d:0 "十八世纪末，欧陆革命烽烟与列强瓜分暗流正逼近千年海洋共和国的城门——历史上，威尼斯与热那亚皆因守旧无备而湮灭于 1797 年的强权交易。但在我们的执掌下，元老院与新市民议会毅然通过近代《地中海海洋商业联邦宪法》：以常备炮舰舰队、宪政代议制与无懈可击的主权信用，傲然迈入新世纪！"
 oe_plat.15.a:0 "颁行《地中海海洋商业联邦宪法》，彻底粉碎覆亡宿命！"
 oe_plat.15.a.tt:0 "获得永久传奇修正「地中海近代海洋商业联邦宪法」（共和传统、立法、桨帆战力、海贸、利率与纪律全面飞跃）！"
 oe_plat.15.b:0 "确立武装中立商业执政府，固守要塞与国际金融中立港"
 oe_plat.15.b.tt:0 "获得 #Y 40 年#!「坎迪亚二十年不屈堡垒」与「圣乔治银行债权主权宪章」双重护盾。"
 oe_plat.16.t:0 "主权债务违约与商站抵押仲裁"
 oe_plat.16.d:0 "欧洲某强权宫廷因连年征战突然宣布暂停偿付外债利息，令圣乔治银行与威尼斯商团承销的巨额主权债券岌岌可危！债权人大会紧急集会：是直接扣押该国在港抵押资产并发布追债宣战理由（CB）强索商站抵押，还是以债务展期换取长期海贸让渡与银团声誉？"
 oe_plat.16.a:0 "强行扣押抵押海关，对违约列强发布追索债务宣战理由！"
 oe_plat.16.a.tt:0 "获得 #G +200#! 金币、#Y 25 年#!「主权债仲裁与海港抵押霸权」，并对主要欧陆举债国赋予追债宣战理由（CB）！"
 oe_plat.16.b:0 "将违约主权债转为长期海港关税与白银专营让渡"
 oe_plat.16.b.tt:0 "获得 #Y 30 年#!「主权债仲裁与海港抵押霸权」与 #Y 25 年#!「金角湾免税商馆特权」。"
 oe_plat.90.t:0 "【审计读数】威热海洋共和国主角线状态面板（Slot 78）"
 oe_plat.90.d:0 "#T 当前国家#!：[ROOT.GetCountry.GetName]\n#T 核心状态轴#!：寡头金融轴（-100大议会..+100十人团/圣乔治）#Y [ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_oligarchy').GetValue|0]#!  海洋商站网完整度 #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_stato_mar').GetValue|0]#! / 4  军械库/圣乔治等级 #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_arsenal').GetValue|0]#! / 4\n#T 跨模块软桥接与里程碑#!：双岛检疫港=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_lazzaretto').GetValue|0]  威马第乌抗葡暗盟（W1联动）=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_mam_pact').GetValue|0]  1557 Asientos 承销=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_asientos').GetValue|0]  欧亚白银潮（W4读数）=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_silver_tide').GetValue|0]  《黄金书》开放=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_libro').GetValue|0]\n#T Slot 15（oe_itp）只读特权#!：君堡威尼斯档=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_itp_ven').GetValue|0]  君堡热那亚档=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_itp_gen').GetValue|0]  Slot 78 已发事件=[ROOT.GetCountry.MakeScope.GetVariable('oe_plat_rd_ev_cnt').GetValue|0]"
 oe_plat.90.a:0 "确认读数并关闭"
 oe_plat.90.a.tt:0 "关闭 Slot 78 审计面板，不改变任何游戏状态。"
