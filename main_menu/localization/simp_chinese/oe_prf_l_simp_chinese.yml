 oe_prf_convene_consistorium: "召开政务院枢密会"
 oe_prf_convene_consistorium_desc: "召集帝国近卫大区政务院各席，核查四大近卫大区与十二古典管区的文武建制与光复之重减免，并同步院内席位。"
 oe_prf_convene_consistorium_tt: "同步政务院席位与大区修正，并打开四大近卫大区与十二管区总览。"
 oe_prf_invest_diocese: "敕封古典管区副长官"
 oe_prf_invest_diocese_desc: "为已收复且尚未设官的古典管区任命近卫副长官（Vicarius），在文治行省与军管督军之间作出取舍。"
 oe_prf_invest_diocese_tt: "消耗#R 5#![oe_tu_authority|e]与#R 100#!金币，为下一处符合条件的古典管区决定文治或军管建制。"
 oe_prf_reform_prefecture: "改定近卫大区体制"
 oe_prf_reform_prefecture_desc: "重新审定一座已建制近卫大区的文武路线，在[oe_tu_senate|e]文治行省与皇帝军管总督／罗马盟邦之间切换（每#Y 5#!年一次）。"
 oe_prf_reform_prefecture_tt: "消耗#R 10#![oe_tu_authority|e]并付出稳定度代价，重开一座已建制近卫大区的体制抉择事件。"
 oe_prf_enroll_subjects: "编入总督府与罗马盟邦"
 oe_prf_enroll_subjects_desc: "将新设的帝国[oe_tu_exarchate|e]、高级军区以及外圈霸业附庸与罗马盟邦正式登记入近卫大区政务院。"
 oe_prf_enroll_subjects_tt: "所有符合条件的[oe_tu_exarchate|e]与外圈罗马盟邦将编入帝国近卫大区政务院并获得对应席位。"
 oe_prf_allow_chartered: "已颁布新《百官志》并开设帝国近卫大区政务院"
 oe_prf_allow_dio_avail: "存在尚未设官且帝国集团控制治所的古典管区"
 oe_prf_allow_pref_active: "至少已建制一座古典近卫大区"
 oe_prf_allow_auth_5: "帝国权威至少为#Y 5#!"
 oe_prf_allow_auth_10: "帝国权威至少为#Y 10#!"
 oe_prf.1.t: "新《百官志》：帝国近卫大区政务院"
 oe_prf.1.d: "收复的故土已逾三区，旧时单靠君士坦丁堡宫廷遥控各军区的章法开始吃紧。御前法学家翻出四世纪末的《百官志》旧档：戴克里先与君士坦丁曾将广袤帝国划为四大近卫大区——东方、伊利里库姆、意大利与非洲、高卢——下统十二管区，以文治元老院行省与军管总督分担重负。今日重开“帝国近卫大区政务院”，应当定下怎样的总纲？"
 oe_prf.1.a: "以元老院文治为先：重税赋与减负"
 oe_prf.1.a.tt: "开设帝国近卫大区政务院，解锁四大近卫大区与十二管区建制；政务院章程偏重文治减负"
 oe_prf.1.b: "以军管总督为先：重边防与兵源"
 oe_prf.1.b.tt: "开设帝国近卫大区政务院，解锁四大近卫大区与十二管区建制；政务院章程偏重边防与统帅权"
 oe_prf.1.c: "文武分权制衡：依各大区实情定夺"
 oe_prf.1.c.tt: "开设帝国近卫大区政务院，[oe_tu_authority|e]#G +5#!，由皇帝逐区裁定文治或军管"
 oe_prf.2.t: "东方近卫大区建制"
 oe_prf.2.d: "从博斯普鲁斯海峡到幼发拉底河与尼罗河谷，东方近卫大区囊括色雷斯、亚细亚、本都、东方与埃及五大古典管区，是帝国最富庶的粮仓与商税命脉，也是抵御东方强敌的前哨。此地该行文治行省之制，还是授军管总督全权？"
 oe_prf.2.a: "设元老院文治大区：兴商税、轻帝国重负"
 oe_prf.2.a.tt: "东方近卫大区采用文治制：税效#Y +6%#!、繁荣度与陆路贸易提升、光复之重每月#Y −0.25#!；代价：征召兵#Y −5%#!、驻军上限#R −8%#!"
 oe_prf.2.b: "设东方军管总督区：厚边防、扩兵源"
 oe_prf.2.b.tt: "东方近卫大区采用军管制：驻军上限#G +12%#!、人力#G +6%#!、陆军士气#G +4%#!、光复之重每月#R −0.12#!；代价：税效#Y −4%#!、宫廷开支效率#R −3%#!，且总督过强可能坐大"
 oe_prf.2.c: "暂不改制，留待政务院日后议定"
 oe_prf.2.c.tt: "暂不启用东方近卫大区建制（日后可在政务院或测试指令中重议）"
 oe_prf.3.t: "伊利里库姆近卫大区建制"
 oe_prf.3.d: "塞萨洛尼基北望多瑙河与喀尔巴阡盆地，马其顿、达契亚与潘诺尼亚三管区历来是帝国最硬的兵源与北疆屏障。若行文治，可加速巴尔干诸邦同化并稳固岁入；若设多瑙河边防大区，则能统筹罗马边区与匈牙利附庸，却难免军费沉重。"
 oe_prf.3.a: "设古典文治管区：加速同化、省治国之费"
 oe_prf.3.a.tt: "伊利里库姆采用文治制：同化速度#G +10%#!、税效#G +4%#!、稳定成本效率#G +5%#!、光复之重每月#R −0.25#!；代价：陆军征召规模#R −5%#!、陆军维护效率#R −4%#!"
 oe_prf.3.b: "设多瑙河边防大区：统筹边区与盟邦兵力"
 oe_prf.3.b.tt: "伊利里库姆采用边防军管制：陆军征召规模#G +8%#!、补给上限#G +10%#!、附庸忠诚#G +5%#!、光复之重每月#R −0.12#!；代价：税效#Y −3%#!、全国月度繁荣下降"
 oe_prf.3.c: "暂不设大区"
 oe_prf.3.c.tt: "暂不启用伊利里库姆近卫大区建制"
 oe_prf.4.t: "意大利与非洲近卫大区建制"
 oe_prf.4.d: "罗马、拉韦纳与迦太基重归紫袍治下，但西地中海离君士坦丁堡山海阻隔，是光复之后帝国重负最沉的源头。六世纪的查士丁尼与莫里斯曾在此设立拉韦纳与迦太基双总督区；而罗马元老世家则渴求以文治双京换取自治与宽容。"
 oe_prf.4.a: "立元老院双京行省：大幅缓解西部重负"
 oe_prf.4.a.tt: "意大利与非洲采用文治双京制：异端容忍#Y +1#!、发展度增速#Y +6%#!、外交声誉#G +1#!、光复之重每月#R −0.40#!；代价：月度正统性#R −0.04#!、最大控制度#R −3%#!"
 oe_prf.4.b: "立拉韦纳与迦太基双总督区：铁腕控海"
 oe_prf.4.b.tt: "意大利与非洲采用双总督军管制：最大控制度#G +4%#!、海军士气#G +6%#!、驻军上限#G +10%#!、光复之重每月#R −0.20#!；代价：异端容忍#Y −0.5#!、税效#Y −4%#!，且须防总督割据"
 oe_prf.4.c: "暂不设大区"
 oe_prf.4.c.tt: "暂不启用意大利与非洲近卫大区建制"
 oe_prf.5.t: "高卢近卫大区建制"
 oe_prf.5.d: "越过阿尔卑斯山与比利牛斯山，高卢、伊比利亚、不列颠与莱茵边疆远离地中海中心。强行全面设省同化，将耗费巨额宫廷行政与稳定代价；若效法晚期罗马的联邦盟邦（Foederati）旧制，借当地附庸与友邦国王代管外圈，则可保全兵源与忠诚，却要让出大批直辖税赋。"
 oe_prf.5.a: "推行西陆文治行省化：直辖同化、严控远疆"
 oe_prf.5.a.tt: "高卢近卫大区采用西陆文治制：同化速度#G +8%#!、税效#G +5%#!、月度控制度提升、光复之重每月#R −0.40#!；代价：宫廷开支效率#R −5%#!、稳定成本效率#R −6%#!"
 oe_prf.5.b: "推行联邦盟邦体系（Foederati）：借外藩分忧"
 oe_prf.5.b.tt: "高卢近卫大区采用联邦盟邦制：附庸忠诚#G +8%#!、附庸好感#G +15#!、征召恢复#G +10%#!、光复之重每月#R −0.30#!；代价：税效#Y −5%#!、月度威望#R −0.03#!"
 oe_prf.5.c: "暂不设大区"
 oe_prf.5.c.tt: "暂不启用高卢近卫大区建制"
 oe_prf.6.t: "敕封管区副长官：[ROOT.GetCountry.Custom('OePrfPendingDio')]"
 oe_prf.6.d: "帝国近卫大区政务院呈报：[ROOT.GetCountry.Custom('OePrfPendingDio')]已具备设官条件。按《百官志》旧制，大区之下设副长官（Vicarius）统摄诸省。陛下是派文官清吏驻节治所、兴商安民并分担帝国重负，还是委派督军（Dux）屯田整军、固守要冲？"
 oe_prf.6.a: "委任文治副长官（Vicarius Civilis）"
 oe_prf.6.a.tt: "将[ROOT.GetCountry.Custom('OePrfPendingDio')]定为文治管区：治所获得繁荣度、降动荡与商贸加成，光复之重每月额外#Y −0.05#!；代价：治所征召兵#Y −15%#!、驻军#Y −10%#!"
 oe_prf.6.b: "委任军管督军（Dux Militaris）"
 oe_prf.6.b.tt: "将[ROOT.GetCountry.Custom('OePrfPendingDio')]定为军管管区：治所获得征召兵#Y +15%#!、驻军#Y +15%#!与控制度增长，光复之重每月额外#Y −0.02#!；代价：治所繁荣度下降、动荡上升"
 oe_prf.6.c: "暂缓此管区设官"
 oe_prf.6.c.tt: "暂不委任该管区副长官（可随时通过政务院行动再行敕封）"
 oe_prf.7.t: "军管总督权势过盛"
 oe_prf.7.d: "重兵在握的军管大区总督屡屡截留地方赋税，私自任免管区副将，并在政务院中拉拢边疆将门。历史早已告诫君士坦丁堡：赋予大区军政合一之权虽能御敌于国门之外，却也让紫袍宝座面临新的觊觎者。"
 oe_prf.7.a: "敕削兵权：以政务院诏书裁抑总督"
 oe_prf.7.a.tt: "[oe_tu_authority|e]#R −5#!，获得#Y 10#!年“敕削总督兵权”（正统性与内阁效率提升，但驻军上限#R −8%#!、附庸忠诚#R −5%#!）"
 oe_prf.7.b: "厚赏优容：暂稳边疆军心"
 oe_prf.7.b.tt: "获得#Y 10#!年“优容军管总督”（附庸忠诚与驻军提升，但税效#Y −5%#!、月度正统性#R −0.03#!）"
 oe_prf.7.c: "改军归文：将一处军管大区转为元老院文治"
 oe_prf.7.c.tt: "将一座军管近卫大区改制为[oe_tu_senate|e]文治大区，彻底消除其军权膨胀隐患"
 oe_prf.8.t: "四区同轨：新《百官志》大成"
 oe_prf.8.d: "东方、伊利里库姆、意大利与非洲、高卢——四大古典近卫大区自五世纪以来首次同列于一份帝国《百官志》之下，十二管区文武相济，政务院敕令通行地中海与西陆。此刻，帝国须为这套万年体制刻下最终的宪章。"
 oe_prf.8.a: "编纂《新百官志法典》：以法统长久减负"
 oe_prf.8.a.tt: "永久获得“新《百官志》法典化”（内阁效率#G +6%#!、月度控制度提升、光复之重每月额外#R −0.15#!；代价：宫廷开支效率#R −4%#!）"
 oe_prf.8.b: "立《四区军令总纲》：以兵威震慑四极"
 oe_prf.8.b.tt: "永久获得“四区军令统合”（人力#G +6%#!、附庸忠诚#G +5%#!；代价：税效#Y −3%#!）"
 oe_prf.90.t: "帝国近卫大区政务院总览"
 oe_prf.90.d: "#T 政务院状态#!：[ROOT.GetCountry.Custom('OePrfConsistoriumState')]　解锁阶段：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_unlock_tier')|0]#! / #Y 3#!　政务院风尚：[ROOT.GetCountry.Custom('OePrfBalance')]\n#T 已建制大区#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_active_prefectures')|0]#! / #Y 4#!（文治 [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_civil_prefectures')|0]｜军管／盟邦 [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_mil_prefectures')|0]）\n#T 已设古典管区#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_active_dioceses')|0]#! / #Y 12#!（文治 [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_civil_dioceses')|0]｜军管 [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_mil_dioceses')|0]）\n#T 每月光复之重减免#!：#G [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_strain_relief')|2]#!（光复罗马后自动计入帝国疲惫结算）\n\n• 东方近卫大区（色雷斯／亚细亚／本都／东方／埃及）：[ROOT.GetCountry.Custom('OePrfMode1')]\n• 伊利里库姆近卫大区（马其顿／达契亚／潘诺尼亚）：[ROOT.GetCountry.Custom('OePrfMode2')]\n• 意大利与非洲近卫大区（意大利／非洲）：[ROOT.GetCountry.Custom('OePrfMode3')]\n• 高卢近卫大区（高卢与西班牙／不列颠与莱茵）：[ROOT.GetCountry.Custom('OePrfMode4')]"
 oe_prf.90.a: "阅毕退朝"
