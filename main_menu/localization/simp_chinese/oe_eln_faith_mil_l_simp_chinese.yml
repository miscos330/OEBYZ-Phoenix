l_simp_chinese:
# NEW 2026-11-21 v10.5 Worker 3: Nova Elysia Faith, Western Pantheon & Military (oe_eln_). Generated by gen_elysia_faith_military.py.
 oe_eln_sol_hesperius_god:0 "西海无敌太阳神"
 oe_eln_sol_hesperius_god.latin_language:0 "赫斯珀里亚无敌太阳神"
 oe_eln_sol_hesperius_god_desc:0 "[ShowGodNameWithNoTooltip('oe_eln_sol_hesperius_god')]乃落日西海之上的无敌太阳神，由渡越大西洋的极乐洲新罗马人立坛奉祀。昔日君士坦丁斑岩神柱之日辉随紫帆西渡，在切萨皮克湾与阿巴拉契亚群峰之间重燃古典行政秩序、开拓远志与学术照明。"
 oe_eln_sol_hesperius_god_omen:0 "炽烈的落日金辉倾泻在切萨皮克湾的红枫与新君士坦丁堡大理石柱廊之上，大西洋万神殿的铜鼎腾起香烟。[ShowGodName('oe_eln_sol_hesperius_god')]正垂照西海新罗马的疆域……"
 oe_eln_omen_sol_hesperius_western_horizon:0 "落日政令"
 oe_eln_omen_sol_hesperius_western_horizon_desc:0 "日落之神的光辉穿透河谷密林，令新君士坦丁堡颁出的政令通达西海每一座边疆城邦。"
 oe_eln_omen_sol_hesperius_new_world_frontier:0 "赫斯珀里亚拓疆"
 oe_eln_omen_sol_hesperius_new_world_frontier_desc:0 "追随太阳西沉的航迹，新罗马开拓船队与移民源源不断涌向切萨皮克以外的辽阔新土。"
 oe_eln_omen_sol_hesperius_atlantic_academy:0 "大西洋学园之光"
 oe_eln_omen_sol_hesperius_atlantic_academy_desc:0 "抢救西渡的古典卷帙在太阳神殿的书院中薪火相传，令新大陆格物研习与识字水平突飞猛进。"
 oe_eln_omen_sol_hesperius_golden_maize:0 "金穗丰年"
 oe_eln_omen_sol_hesperius_golden_maize_desc:0 "西海日光惠泽新大陆的玉米沃野与黑麦田畴，令仓廪充盈、生齿日繁。"
 oe_eln_omen_sol_hesperius_purple_zenith:0 "紫冕中天"
 oe_eln_omen_sol_hesperius_purple_zenith_desc:0 "纵然远隔重洋，无敌太阳神依然为紫袍帝室印证正统天命，令王权凌驾于诸阶层之上。"
 oe_eln_oceanus_neptune_god:0 "大西洋海神俄刻阿诺斯"
 oe_eln_oceanus_neptune_god.latin_language:0 "大洋海神尼普顿—俄刻阿诺斯"
 oe_eln_oceanus_neptune_god_desc:0 "[ShowGodNameWithNoTooltip('oe_eln_oceanus_neptune_god')]融合了环绕大地的远古大洋神俄刻阿诺斯与执掌三叉戟的罗马海神尼普顿。正是凭借他的庇佑，流亡舰队方能冲破马尾藻海飓风抵达极乐洲，亦将护佑铜甲大帆船横行大西洋。"
 oe_eln_oceanus_neptune_god_omen:0 "潮汐拍打西海金角港的青铜防波堤，海雾中隐约浮现三叉戟与海豚的纹影，整装待发的铜甲帆船齐声鸣号。[ShowGodName('oe_eln_oceanus_neptune_god')]正平息远洋波涛……"
 oe_eln_omen_oceanus_gulf_stream:0 "湾流顺风"
 oe_eln_omen_oceanus_gulf_stream_desc:0 "大洋海神指引湾流暖风与信风航道，极大延伸舰队跨洋航程并削减远海统辖阻隔。"
 oe_eln_omen_oceanus_trident_broadside:0 "三叉戟齐射"
 oe_eln_omen_oceanus_trident_broadside_desc:0 "铜甲主力战舰借海神威势破浪迎敌，重舰炮火与水兵战意震慑整片大西洋。"
 oe_eln_omen_oceanus_atlantic_emporium:0 "大西洋海贸总枢"
 oe_eln_omen_oceanus_atlantic_emporium_desc:0 "自切萨皮克湾至哈瓦那与亚速尔群岛的商帆云集，海商效率与市场话语权节节攀升。"
 oe_eln_omen_oceanus_corsair_escort:0 "海神护航与截击"
 oe_eln_omen_oceanus_corsair_escort_desc:0 "精通暗礁与海峡风向的极乐洲水师擅长封锁敌港并完整俘获大洋商船与战舰。"
 oe_eln_omen_oceanus_thalassic_accord:0 "海权盟约"
 oe_eln_omen_oceanus_thalassic_accord_desc:0 "敬畏海神信义的远洋使节往来诸邦，既扬帝国海威又令东西两岸诸国敬重极乐洲外交声望。"
 oe_eln_interpretatio_hesperia_aspect:0 "罗马化合祀诠释（赫斯珀里亚）"
 oe_eln_interpretatio_hesperia_aspect_desc:0 "承袭古罗马「罗马化诠释」的包容神学，将北美原住民尊奉的大灵与河林自然神祇纳入大西洋万神殿谱系，显著缓解跨教摩擦、拓展文化容纳力并促进农耕丰收与融合。"
 oe_eln_thalassocracy_neptune_aspect:0 "海神大西洋霸权礼"
 oe_eln_thalassocracy_neptune_aspect_desc:0 "以新君士坦丁堡与西海金角港为海神圣域，将远洋测绘、铜甲重舰修造与跨洋海贸纳入国家祭典秩序，铸就横跨大西洋的罗马海权霸业。"
 oe_eln_temple_atlantic_pantheon:0 "赫斯珀里亚大西洋万神殿"
 oe_eln_temple_atlantic_pantheon_desc:0 "矗立于极乐洲新罗马首府的穹顶柱廊大神殿，合祀奥林匹斯古典主神与西海无敌太阳神、大洋海神俄刻阿诺斯。即便远隔旧大陆，此殿仍为新大陆罗马多神教维系大祭司礼法、学术与文化权威。"
 oe_eln_temple_atlantic_pantheon_maint:0 "赫斯珀里亚大西洋万神殿（祭祀与修缮）"
 oe_eln_chalybopolis_arsenal:0 "卡吕波波利斯希腊火火器局"
 oe_eln_chalybopolis_arsenal_desc:0 "依托切萨皮克湾富铁矿脉与西渡炼金工匠兴建的皇家军械总厂，将古拜占庭液态希腊火引信与新大陆硝石火药、精铸枪管融为一体，源源不断装备希腊火火枪兵团并强化本地募兵与设防。"
 oe_eln_chalybopolis_arsenal_maint:0 "卡吕波波利斯希腊火火器局（军工维护）"
 oe_eln_chesapeake_breakwater:0 "切萨皮克金角防波堤与铜甲船坞"
 oe_eln_chesapeake_breakwater_desc:0 "仿照君士坦丁堡金角湾铁链港池修筑的人工石堤与铜包船底干船坞。不仅将切萨皮克湿地改造为深水军港，更以新大陆橡木与铜板批量建造远洋克拉克舰与铜甲大帆船。"
 oe_eln_chesapeake_breakwater_maint:0 "切萨皮克金角防波堤与铜甲船坞（船坞维护）"
 oe_eln_foederati_rangers:0 "赫斯珀里亚盟邦林地斥候"
 oe_eln_foederati_rangers_desc:0 "由希腊边防轻步兵与切萨皮克、波瓦坦罗马盟邦猎手合编的林地精锐斥候。精通密林潜行、就地补给与火绳枪伏击，极适合在北美东岸与阿巴拉契亚山地展开长程穿插。"
 oe_eln_pyrophoroi_musketeers:0 "希腊火火枪兵（Pyrophoroi）"
 oe_eln_pyrophoroi_musketeers_desc:0 "卡吕波波利斯火器局的得意杰作：将古传液态希腊火引信与新大陆硝石重型火绳枪、燃烧手雷结合，齐射之际烈焰如墙，能以骇人震慑力瞬间击溃敌军士气。"
 oe_eln_imperial_pyrophoroi:0 "近卫希腊火线列兵"
 oe_eln_imperial_pyrophoroi_desc:0 "极乐洲新罗马在绝对主义时代的常备近卫主力。身着紫金饰带制服、列装标准化燧发燃烧弹枪与刺刀，兼具罗马军团铁律与压倒性线列齐射火力，为重返旧大陆东征的先锋利刃。"
 oe_eln_hesperian_carrack:0 "极乐洲远洋克拉克舰"
 oe_eln_hesperian_carrack_desc:0 "吸取横渡马尾藻海飓风经验改良的高舷远洋克拉克重舰，采用北美硬橡木龙骨并加装舰首火炮，航速与抗浪船体远胜同期地中海旧式帆船。"
 oe_eln_copper_galleon:0 "切萨皮克铜甲大帆船（Chalkoplous）"
 oe_eln_copper_galleon_desc:0 "以新大陆优质白橡木为骨、全船水线包覆防虫抗蚀青铜薄板，并在舰首装配高压希腊火虹吸喷口的大西洋主力战舰。既能远航截击加勒比白银舰队，亦能强渡直布罗陀叩关地中海。"
 oe_eln_adv_foederati_rangers:0 "赫斯珀里亚盟邦林地斥候编成"
 oe_eln_adv_foederati_rangers_desc:0 "吸收切萨皮克与波瓦坦盟邦的林地侦察与伏击技艺，组建适应北美密林与沼泽的轻装火枪斥候兵团。"
 oe_eln_adv_hesperian_carrack:0 "西海远洋克拉克造船术"
 oe_eln_adv_hesperian_carrack_desc:0 "结合拜占庭海事绘图遗产与北美东岸优质林木，打造专为大西洋飓风航道优化的远洋克拉克主力舰。"
 oe_eln_adv_pyrophoroi:0 "卡吕波波利斯希腊火火枪制式"
 oe_eln_adv_pyrophoroi_desc:0 "将流亡抢救出的希腊火配方与火绳枪药室工艺合流，列装震撼新旧两大陆的希腊火火枪兵（Pyrophoroi）。"
 oe_eln_adv_copper_galleon:0 "切萨皮克铜甲包底大帆船"
 oe_eln_adv_copper_galleon_desc:0 "推广全船底青铜防蚀包板与舰首高压希腊火喷管工艺，全面解锁制霸大西洋的切萨皮克铜甲大帆船。"
 oe_eln_adv_imperial_pyrophoroi:0 "近卫希腊火线列操典"
 oe_eln_adv_imperial_pyrophoroi_desc:0 "将希腊火燃烧弹药纳入绝对主义时代标准化燧发枪线列操典，组建极乐洲新罗马最高战力的近卫希腊火线列兵。"
 STATIC_MODIFIER_NAME_oe_eln_mod_orthodox_foundation:0 "西海正教基石"
 STATIC_MODIFIER_DESC_oe_eln_mod_orthodox_foundation:0 "新君士坦丁堡延续千年东正圣统，在新大陆筑起坚实的信仰磐石与宣教热忱。"
 STATIC_MODIFIER_NAME_oe_eln_western_patriarchate_mod:0 "新君士坦丁堡西方大牧首区"
 STATIC_MODIFIER_DESC_oe_eln_western_patriarchate_mod:0 "在新大陆设立的西方普世宗主教座堂，维系大西洋沿岸正教修院网络、识字启蒙与帝国凝聚力。"
 STATIC_MODIFIER_NAME_oe_eln_missionary_frontier_loc_mod:0 "切萨皮克正教宣教修院"
 STATIC_MODIFIER_DESC_oe_eln_missionary_frontier_loc_mod:0 "沿切萨皮克湾兴建的宣教修道院与抄经学舍，促进本地归化、识字率与市镇繁荣。"
 STATIC_MODIFIER_NAME_oe_eln_pure_greek_liturgy_mod:0 "纯正希腊语大公圣礼"
 STATIC_MODIFIER_DESC_oe_eln_pure_greek_liturgy_mod:0 "严格恪守君士坦丁堡古典希腊语礼仪与圣像规范，以庄严传统巩固帝室正统与文化底蕴。"
 STATIC_MODIFIER_NAME_oe_eln_bilingual_liturgy_mod:0 "希阿双语大西洋圣礼"
 STATIC_MODIFIER_DESC_oe_eln_bilingual_liturgy_mod:0 "效法圣西里尔与美多德先例，将福音与赞美诗译入阿尔冈昆诸语，大幅加速新大陆多族皈依与融合。"
 STATIC_MODIFIER_NAME_oe_eln_mod_hesperian_revival:0 "赫斯珀里亚古典神学复兴"
 STATIC_MODIFIER_DESC_oe_eln_mod_hesperian_revival:0 "流亡西海的哲人与祭司重启罗马古教礼制，令占卜神谕与新大陆学术探索相得益彰。"
 STATIC_MODIFIER_NAME_oe_eln_mod_oceanus_consecration:0 "海神俄刻阿诺斯入座圣佑"
 STATIC_MODIFIER_DESC_oe_eln_mod_oceanus_consecration:0 "大洋海神正式入座极乐洲万神殿，保佑西海舰队远航破浪、重舰威震大西洋。"
 STATIC_MODIFIER_NAME_oe_eln_mod_sol_hesperius_radiance:0 "落日太阳神天辉"
 STATIC_MODIFIER_DESC_oe_eln_mod_sol_hesperius_radiance:0 "西海无敌太阳神入座行政神柱，以昭明法度统筹辽阔边疆、殖民开拓与学院格物。"
 STATIC_MODIFIER_NAME_oe_eln_atlantic_sanctuary_loc_mod:0 "大西洋万神殿圣域广场"
 STATIC_MODIFIER_DESC_oe_eln_atlantic_sanctuary_loc_mod:0 "环绕新大陆万神殿兴建的大理石祭坛与哲学回廊，提升首府文化传统、识字率与繁荣度。"
 STATIC_MODIFIER_NAME_oe_eln_mod_interpretatio_hesperia:0 "罗马化合祀大宪章"
 STATIC_MODIFIER_DESC_oe_eln_mod_interpretatio_hesperia:0 "将北美大灵与古典诸神视作同源万象，在极乐洲铸就跨族群、跨信仰的和平共荣格局。"
 STATIC_MODIFIER_NAME_oe_eln_mod_western_orthopraxy:0 "卡皮托利西海严正祭礼"
 STATIC_MODIFIER_DESC_oe_eln_mod_western_orthopraxy:0 "严格按罗马大祭司法典整肃新大陆礼仪与军誓，令神谕威力、转化效率与军团纪律倍增。"
 STATIC_MODIFIER_NAME_oe_eln_mod_symmachus_charter:0 "西马库斯大西洋宽容宪章"
 STATIC_MODIFIER_DESC_oe_eln_mod_symmachus_charter:0 "「通往伟大奥秘的道路绝非只有一条」——极乐洲向诸宗派敞开怀抱，吸引四方流亡者渡海来归。"
 STATIC_MODIFIER_NAME_oe_eln_mod_atlantic_sanctuary:0 "大西洋自由庇护港体系"
 STATIC_MODIFIER_DESC_oe_eln_mod_atlantic_sanctuary:0 "受西马库斯敕令庇护的极乐洲港口云集逃离旧大陆宗派迫害的学者、印书匠与海商，令科研与移民勃兴。"
 STATIC_MODIFIER_NAME_oe_eln_mod_civic_conscience:0 "良知税约与海商和平"
 STATIC_MODIFIER_DESC_oe_eln_mod_civic_conscience:0 "以统一罗马公法与良知税约调和多元教派，在保障宗教和平的同时充盈大西洋海贸税源。"
 STATIC_MODIFIER_NAME_oe_eln_mod_pyrophoroi_doctrine:0 "卡吕波波利斯希腊火火枪教范"
 STATIC_MODIFIER_DESC_oe_eln_mod_pyrophoroi_doctrine:0 "全面列装希腊火引信火绳枪与燃烧掷弹，大幅强化重步兵火力、士气与攻城能力，但特种军工耗费不菲。"
 STATIC_MODIFIER_NAME_oe_eln_mod_pyrophoroi_elite_guard:0 "秘传近卫希腊火团规"
 STATIC_MODIFIER_DESC_oe_eln_mod_pyrophoroi_elite_guard:0 "严守希腊火配制密仪并仅授予精选近卫团，兼顾铁律纪律、士气韧性与军工研习。"
 STATIC_MODIFIER_NAME_oe_eln_chalybopolis_foundry_loc_mod:0 "卡吕波波利斯皇家铸枪炉"
 STATIC_MODIFIER_DESC_oe_eln_chalybopolis_foundry_loc_mod:0 "昼夜不息冶铁铸管、提炼松脂希腊火的军工重镇，大幅提升本地兵源与产效。"
 STATIC_MODIFIER_NAME_oe_eln_mod_copper_admiralty:0 "切萨皮克铜甲主力海署"
 STATIC_MODIFIER_DESC_oe_eln_mod_copper_admiralty:0 "以铜甲包底大帆船为核心组建远洋重舰主力，大西洋海战火力、水师士气与远洋航程全面跃升。"
 STATIC_MODIFIER_NAME_oe_eln_mod_atlantic_convoy_doctrine:0 "大西洋武装商队护航制"
 STATIC_MODIFIER_DESC_oe_eln_mod_atlantic_convoy_doctrine:0 "以快航铜底舰护航跨洋商船，兼顾高速造舰、海贸收益与大西洋全域海上存在感。"
 STATIC_MODIFIER_NAME_oe_eln_copper_shipyard_loc_mod:0 "切萨皮克铜板大船厂"
 STATIC_MODIFIER_DESC_oe_eln_copper_shipyard_loc_mod:0 "专事橡木龙骨与青铜船底铆接的皇家造船基地，令造舰速率与水手储备大增。"
 STATIC_MODIFIER_NAME_oe_eln_pyrophoroi_fleet_readiness_mod:0 "极乐洲水陆实弹合演"
 STATIC_MODIFIER_DESC_oe_eln_pyrophoroi_fleet_readiness_mod:0 "希腊火火枪方阵与切萨皮克铜甲舰队协同实弹演武，全面淬炼陆海战备与士气。"
 oe_eln_human_only_tt:0 "仅限玩家操控的极乐洲新罗马执行"
 oe_eln_drills_cd_tt:0 "距离上次极乐洲水陆实弹合演已满 10 年"
 oe_eln_dec_choose_faith_path.title:0 "召开新大陆三道信仰大议"
 oe_eln_dec_choose_faith_path.desc:0 "在切萨皮克湾奠基立国之后，元老院与教士阶层围绕新罗马的灵魂方向展开激烈辩论：是坚守西方普世正教、拥抱大西洋罗马多神教万神殿，抑或颁布西马库斯大西洋宽容宪章？"
 oe_eln_dec_choose_faith_path.a:0 "主持极乐洲信仰定向大议"
 oe_eln_dec_choose_faith_path_tt:0 "立即触发极乐洲三大信仰道路抉择事件（西方普世正教 / 极乐洲罗马多神教 / 西马库斯大西洋宽容宪章）。"
 oe_eln_dec_western_pantheon.title:0 "主持赫斯珀里亚万神殿神座仪典"
 oe_eln_dec_western_pantheon.desc:0 "在严格维持罗马多神教六柱神位上限（2 行政 + 2 外交 + 2 军事）的前提下，调度新大陆专属神祇西海无敌太阳神与大西洋海神俄刻阿诺斯入座或退席，并可无损衔接旧世界卡皮托利乌姆六神柱。"
 oe_eln_dec_western_pantheon.a:0 "步入大西洋万神殿神座大厅"
 oe_eln_dec_western_pantheon_tt:0 "开启赫斯珀里亚万神殿神座调度界面，安全切换新大陆双神并保持总在位神祇恒不超过 6 位。"
 oe_eln_dec_join_atlantic_pontificate.title:0 "将大西洋圣坛接入罗马大祭司团"
 oe_eln_dec_join_atlantic_pontificate.desc:0 "确立新君士坦丁堡与大西洋万神殿在罗马大祭司团中的正式席位，统筹西海神谕历法与圣火仪典。"
 oe_eln_dec_join_atlantic_pontificate.a:0 "派遣大祭司使团并确立西海圣座"
 oe_eln_dec_join_atlantic_pontificate_tt:0 "创建或加入罗马大祭司团国际组织，并获得宗教影响力加成。"
 oe_eln_dec_pyrophoroi_drills.title:0 "举行卡吕波波利斯火枪与铜甲舰队合演"
 oe_eln_dec_pyrophoroi_drills.desc:0 "调集希腊火火枪兵团与切萨皮克铜甲主力舰队，在汉普顿锚地展开水陆协同实弹演武，检验新大陆罗马军工的实战威能。"
 oe_eln_dec_pyrophoroi_drills.a:0 "拨款启动大西洋水陆大演武"
 oe_eln_dec_pyrophoroi_drills_tt:0 "耗费国库组织水陆合演，在未来 8 年内大幅提升陆军纪律、士气与重舰战力，并增加陆海军传统。"
 oe_eln.3.title:0 "新大陆的祭坛：三大信仰道路"
 oe_eln.3.desc:0 "新君士坦丁堡的城墙已在切萨皮克湾畔巍然矗立，然而远隔重洋的流亡帝国仍须回答一个关乎千秋国祚的根本问题：在远离圣索菲亚穹顶的极乐洲，究竟何种信仰将成为新罗马的灵魂？随船西渡的大牧首遗老呼吁在此重立西方普世正教宗主教座；携带着米斯特拉斯与古典孤本的哲人们则主张拥抱赫斯珀里亚的罗马多神教万神殿，礼敬护佑船队渡海的海神与落日太阳神；亦有务实的元老援引古罗马西马库斯名言，主张向天下万教敞开大西洋宽容之门。"
 oe_eln.3.a:0 "西方普世正教：于新君士坦丁堡重立正教圣统"
 oe_eln.3.a.tt:0 "锁定【道路 A：西方普世正教】，保持或回归东正教并开启西方大牧首区与双语圣礼事件链。"
 oe_eln.3.b:0 "极乐洲罗马多神教：在西海重建大西洋万神殿"
 oe_eln.3.b.tt:0 "锁定【道路 B：极乐洲罗马多神教】，皈依罗马多神教、接入大祭司团（严格保持 6 神位不溢出），并开启海神俄刻阿诺斯、西海太阳神与罗马化合祀事件链。"
 oe_eln.3.c:0 "西马库斯大西洋宽容宪章：海纳百川的人文帝国"
 oe_eln.3.c.tt:0 "锁定【道路 C：西马库斯宽容帝国】，保留现行国教并颁布大西洋宽容宪章，开启欧洲流亡工匠与学者避难港事件链。"
 oe_eln.4.title:0 "新君士坦丁堡宗主教加冕"
 oe_eln.4.desc:0 "在由切萨皮克白橡木与海岸石材筑成的新圣索菲亚大教堂内，钟声首度回荡于美洲东岸的晨雾之上。来自流亡修院的众主教齐声颂唱「配得（Axios）」，正式加冕首位新君士坦丁堡暨全赫斯珀里亚大牧首。西方正教枢机由此扎根新大陆，不仅凝聚了希腊移民的信念，也准备将福音之火传向波托马克河谷与阿巴拉契亚边疆。"
 oe_eln.4.a:0 "立西方大牧首区为新大陆正教中枢"
 oe_eln.4.a.tt:0 "获得永久修正【新君士坦丁堡西方大牧首区】，全面提升本教容忍、传教速度、识字上限与稳定度效率。"
 oe_eln.4.b:0 "兼派边疆宣教修院深入切萨皮克腹地"
 oe_eln.4.b.tt:0 "建立西方大牧首区，同时在首府营建切萨皮克正教宣教修院并取悦教士阶层。"
 oe_eln.5.title:0 "大西洋东正圣像与双语圣礼"
 oe_eln.5.desc:0 "随着切萨皮克湾与周边原住民部族的往来日益频密，新君士坦丁堡宗主教会议迎来了一场关乎礼仪传统的辩论。保守派神学家坚持唯有纯正的古典希腊语圣礼方能防止罗马文明在异乡失根；而亲历边疆传教的修士们则举出圣西里尔创制斯拉夫文字的先例，主张将赞美诗与圣经译作阿尔冈昆诸语并绘入新大陆风物，以温柔之道引领万族归心。"
 oe_eln.5.a:0 "恪守纯正希腊语大公礼仪规范"
 oe_eln.5.a.tt:0 "获得永久修正【纯正希腊语大公圣礼】，提升合法性、稳定效率、本教容忍与文化传统。"
 oe_eln.5.b:0 "行圣西里尔遗风：颁行希阿双语大西洋圣礼"
 oe_eln.5.b.tt:0 "获得永久修正【希阿双语大西洋圣礼】，大幅提升传教与同化速率、异教容忍与文化容量，并容忍南塞蒙德文化。"
 oe_eln.6.title:0 "赫斯珀里亚万神殿：海神俄刻阿诺斯入座"
 oe_eln.6.desc:0 "极乐洲的大祭司与水师提督齐聚西海金角港畔，向奔涌不息的大西洋泼洒葡萄酒与橄榄油。众祭司宣称，护佑流亡方舟穿过马尾藻海风暴抵达切萨皮克湾的，正是统御外环大洋的古神俄刻阿诺斯与罗马海神尼普顿的化身。今日圣坛落成，大祭司团正式为【大西洋海神俄刻阿诺斯】立像入籍，并开启海神大西洋霸权教义。"
 oe_eln.6.a:0 "即刻恭请海神俄刻阿诺斯入座外交神柱"
 oe_eln.6.a.tt:0 "解锁并立即将【大西洋海神俄刻阿诺斯】安全置换入外交神柱（严格保持 6 位在位神祇），同时获得 20 年海权圣佑修正。"
 oe_eln.6.b:0 "先录名于西海神籍，待日后自神座仪典调度"
 oe_eln.6.b.tt:0 "解锁【大西洋海神俄刻阿诺斯】与【海神大西洋霸权礼】教义而不立即更换当前六神柱，并获海军传统与威望。"
 oe_eln.7.title:0 "日落之巅的无敌太阳神"
 oe_eln.7.desc:0 "每逢夏至傍晚，金红的落日余晖越过阿巴拉契亚山脊倾泻在切萨皮克湾水面，令极乐洲的罗马哲人不禁追忆起君士坦丁堡广场上的斑岩太阳神柱。元老院与大祭司团共同决议：在新君士坦丁堡营建宏伟的【赫斯珀里亚大西洋万神殿】，并尊奉【西海无敌太阳神】为西半球罗马行政、拓疆与格物之护主。"
 oe_eln.7.a:0 "恭请西海无敌太阳神入座行政神柱并奠基万神殿"
 oe_eln.7.a.tt:0 "解锁大西洋万神殿专属建筑，并将【西海无敌太阳神】安全置换入行政神柱（严格保持 6 位在位神祇），另获 20 年太阳神天辉修正。"
 oe_eln.7.b:0 "暂维现有行政神柱，专力兴建大西洋万神殿圣域"
 oe_eln.7.b.tt:0 "解锁【西海无敌太阳神】与大西洋万神殿建筑而不立即更换当前神座，并为首府赋予 25 年万神殿圣域广场修正。"
 oe_eln.8.title:0 "罗马化诠释：大灵与诸神同源"
 oe_eln.8.desc:0 "深入波瓦坦与切萨皮克部族聚落的极乐洲哲人带回了令人惊叹的记录：当地原住民敬畏天地主宰「大灵」与山川草木诸神，其自然神学竟与古罗马的「万物有灵」及「罗马化诠释」隐隐契合。大祭司团就此展开思辨：是效法古代帝国吸纳伊西斯与密特拉的先例，将新大陆神灵合祀入西海万神殿，还是坚守严正纯粹的卡皮托利古典祭仪？"
 oe_eln.8.a:0 "颁行罗马化合祀诠释，融汇大灵与奥林匹斯谱系"
 oe_eln.8.a.tt:0 "解锁【罗马化合祀诠释】教义，获得永久异教容忍、人口同化与粮食丰收修正，并容忍南塞蒙德文化。"
 oe_eln.8.b:0 "恪守卡皮托利严正祭礼，以铁律整肃西海神坛"
 oe_eln.8.b.tt:0 "解锁【罗马化合祀诠释】教义备用，同时颁行卡皮托利西海严正祭礼，永久增强神谕威力、转化速度与陆军纪律。"
 oe_eln.9.title:0 "新大陆西马库斯敕令"
 oe_eln.9.desc:0 "「我们仰望同一片星辰，共有同一座苍穹，通往如此伟大奥秘的道路绝非只有一条。」极乐洲元老院将西马库斯的传世名言镌刻于新君士坦丁堡港口的青铜铭牌之上。随着敕令传遍大西洋航道，逃离战火与宗派迫害的希腊工匠、学者、印书商与异乡海员纷纷扬帆西渡，渴望在切萨皮克湾的庇护下安身立命。"
 oe_eln.9.a:0 "辟自由庇护港，广纳渡海学者与工匠"
 oe_eln.9.a.tt:0 "获得永久修正【大西洋自由庇护港体系】，大幅提升宽容度、科研速度、识字上限与移民吸引力，并向首府引入一批真实市民与学者人口。"
 oe_eln.9.b:0 "立良知税约，以罗马公法统筹海贸与诸派"
 oe_eln.9.b.tt:0 "获得永久修正【良知税约与海商和平】与一笔充盈国库的特许金，并向首府引入海商市民人口。"
 oe_eln.10.title:0 "卡吕波波利斯火器局：希腊火与火绳枪合流"
 oe_eln.10.desc:0 "在盛产良铁的卡吕波波利斯铸铁炉旁，当年随流亡船队抢救出君士坦丁堡军械局的炼金匠师与枪匠迎来了划时代的突破：他们将古拜占庭秘传的液态希腊火引信化合物与新大陆提炼的精纯硝石黑火药结合，制成了自带剧烈燃烧冲击的火绳步枪与便携火罐。试射场上烈焰翻涌，连最沉稳的瓦兰吉老兵亦为之动容——【希腊火火枪兵（Pyrophoroi）】正式问世！"
 oe_eln.10.a:0 "重金扩建卡吕波波利斯火器局并全面列装"
 oe_eln.10.a.tt:0 "解锁专属建筑【卡吕波波利斯希腊火火器局】、专属科技与两代【希腊火火枪兵】兵种，并获得永久【卡吕波波利斯希腊火火枪教范】与本地铸枪炉加成。"
 oe_eln.10.b:0 "将配方列为皇家近卫密仪，精锐小规模成军"
 oe_eln.10.b.tt:0 "同样解锁火器局建筑与两代【希腊火火枪兵】兵种，并获得低维护的永久【秘传近卫希腊火团规】与科研进度。"
 oe_eln.11.title:0 "切萨皮克铜甲大帆船下水"
 oe_eln.11.desc:0 "在西海金角港震天的欢呼声中，极乐洲第一艘远洋主力重舰「紫焰号」缓缓滑入切萨皮克湾深水。造船总监摒弃了地中海旧式桨帆船结构，精选波瓦坦与马里兰高大白橡木筑成双层龙骨，在水线以下全数铆接防虫抗蚀的青铜薄板，更在船首炮台暗藏高压希腊火虹吸管。这艘名为【切萨皮克铜甲大帆船（Chalkoplous）】的海上巨兽，将彻底改写大西洋的制海天平。"
 oe_eln.11.a:0 "设立切萨皮克铜甲主力海署，锻造大洋决战舰队"
 oe_eln.11.a.tt:0 "解锁【切萨皮克铜甲大帆船】专属科技与重舰兵种，获得永久【切萨皮克铜甲主力海署】与造船基地加成。"
 oe_eln.11.b:0 "推行大西洋武装商队护航制，以快航商战制胜"
 oe_eln.11.b.tt:0 "解锁【切萨皮克铜甲大帆船】专属科技与重舰兵种，并获得永久【大西洋武装商队护航制】海贸与造船增速加成。"
 oe_eln_pantheon.1.title:0 "赫斯珀里亚万神殿：西海神座调度"
 oe_eln_pantheon.1.desc:0 "大西洋万神殿的六根大理石神柱庄严肃立：两座行政柱、两座外交柱、两座军事柱，严格秉承古典罗马六神柱定额，永不逾矩。大祭司团在此听候旨意，调度西海无敌太阳神与大西洋海神俄刻阿诺斯入座或退席，亦可洁净退席后转入卡皮托利乌姆六神柱总坛调遣旧大陆诸神。"
 oe_eln_pantheon.1.a:0 "【行政柱】恭请西海无敌太阳神入座"
 oe_eln_pantheon.1.a.tt:0 "先行请出一位当前行政神柱神祇，再将【西海无敌太阳神】安全安座（保证总在位神祇严格 <= 6）。"
 oe_eln_pantheon.1.b:0 "【行政柱】请西海无敌太阳神退席并复原古典主神"
 oe_eln_pantheon.1.b.tt:0 "撤回【西海无敌太阳神】并复原一位原版古典行政神祇，保持行政柱恰好 2 位神祇。"
 oe_eln_pantheon.1.c:0 "【外交柱】恭请大西洋海神俄刻阿诺斯入座"
 oe_eln_pantheon.1.c.tt:0 "先行请出一位当前外交神柱神祇，再将【大西洋海神俄刻阿诺斯】安全安座（保证总在位神祇严格 <= 6）。"
 oe_eln_pantheon.1.d:0 "【外交柱】请大西洋海神俄刻阿诺斯退席并复原古典主神"
 oe_eln_pantheon.1.d.tt:0 "撤回【大西洋海神俄刻阿诺斯】并复原一位原版古典外交神祇，保持外交柱恰好 2 位神祇。"
 oe_eln_pantheon.1.e:0 "【双神齐座】同时恭请西海太阳神与大西洋海神入座"
 oe_eln_pantheon.1.e.tt:0 "安全置换一位行政神与一位外交神，令西海双神并立大西洋万神殿（严格维持 2 ADM + 2 DIP + 2 MIL = 6 神）。"
 oe_eln_pantheon.1.f:0 "重置西海神座并转入卡皮托利乌姆六神柱总坛"
 oe_eln_pantheon.1.f.tt:0 "先将西海双神洁净退席复原，随后打开 v9.8 卡皮托利乌姆六神柱换神总坛以调度旧世界诸神。"
 oe_eln_pantheon.1.z:0 "维持现行六神柱仪典并结束会议"
 oe_eln_pantheon.1.z.tt:0 "不做任何神位变动，关闭赫斯珀里亚万神殿神座仪典。"
