 oe_col_close_post_card: "撤回帝国在黑海的一处商站。"
 game_concept_oe_tu_emporion: "商站"
 game_concept_oe_tu_emporion_desc: "#F 十三世纪末，史家帕奇梅雷斯抱怨：黑海的运粮生意早就交到了热那亚人手里。1348年，约翰六世降低关税、借钱造船，想让帝国在粮食和海运上不再仰赖加拉塔。#!\n\n帝国可以在黑海与黎凡特的九处港口设自己的商站：塔纳、卡法、特拉比松、锡诺普、瓦尔纳、基利亚、法马古斯塔、亚历山大、贝鲁特（行动“开设商站”，由事件“帝国的商船”开放，最迟1366年）。亚历山大在1365年遭劫之后约五年内不能设。\n#bold 请求与答复#!：我们提出请求，付#Y 2#![oe_tu_authority|e]和三个月的税收与贸易收入；那里的主人在#Y 2#!个月内答复。对方对我们好感越高越容易答应，同信正教的更容易；热那亚一方看热那亚在君士坦丁堡的特权等级，等级低时会要价。回绝或作罢退还一半金币。\n#bold 商馆#!：对方准许后，帝国被记进该地的准入名单，当地建起#bold #color_yellow 罗马商馆#!#!；名单上没有的国家建不了。商馆让帝国的商人在当地市场多一分力。\n#bold 点数与好处#!：商站记#Y 1#!点，兴旺之后筑墙设法官成为特许商区，记#Y 2#!点；停业的不算。合计#Y 1#!点：商人实力#G +3%#!、贸易收入#G +2%#!；#Y 2#!到#Y 3#!点：#G +5%#!、#G +4%#!；#Y 4#!点以上：#G +8%#!、#G +6%#!。\n#bold 粮港#!：塔纳、卡法、瓦尔纳、基利亚。粮港的商站合计满#Y 2#!点时，京城的粮道宽松一分。\n#bold 维持费#!：每年一月每点付#R 半个月#!的收入；付不起时最新开的一处关闭。别国港口里最多#Y 6#!处。\n#bold 停业#!：塔纳、卡法遇到禁运，卡法遇到战事，商站停业，事情过去后自动复业。\n#bold 失陷#!：那里的主人与帝国开战；港口落到敌视我们的新主人手里；塔纳被毁；加扎里亚灭亡。失陷的站址要过几年才能再设。\n港口归了帝国一方以后，商站照算，不再付维持费。港口归了帝国自己、又不归任何军区管辖时，那一带设为罗马殖民城：划给邻近的军区，或新设一个军区。"
