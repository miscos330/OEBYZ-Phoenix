 oe_col.1.t: "招什么人"
 oe_col.1.d1: "#F 747年，君士坦丁五世把大批保罗派从东方迁到色雷斯守边；970年，约翰一世又把一批保罗派安置在菲利波波利斯。1122年后，约翰二世把佩切涅格俘虏安置成屯田兵，又把塞尔维亚人迁到尼科米底亚一带。1240年代，约翰三世收留被蒙古人赶到西边的库曼人，以土地换取其兵役。#!\n\n[SCOPE.sCountry('oe_col_theme').GetName]辖下的[SCOPE.sLocation('oe_col_loc').GetName]人少地荒：[GetCountry('BYZ').Custom('OeColWhy')]地方官请示：从帝国别处迁人来，还是招外族兵户落户？"
 oe_col.1.d2: "#F 747年，君士坦丁五世把大批保罗派从东方迁到色雷斯守边；970年，约翰一世又把一批保罗派安置在菲利波波利斯。1122年后，约翰二世把佩切涅格俘虏安置成屯田兵，又把塞尔维亚人迁到尼科米底亚一带。1240年代，约翰三世收留被蒙古人赶到西边的库曼人，以土地换取其兵役。#!\n\n[SCOPE.sLocation('oe_col_loc').GetName]人少地荒：[GetCountry('BYZ').Custom('OeColWhy')]地方官请示：从帝国别处迁人来，还是招外族兵户落户？"
 oe_col.1.a: "从人口多的行省内徙"
 oe_col.1.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!金币（一个月的税收与贸易收入）\n从[SCOPE.sProvince('oe_col_src').GetName]迁出约#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_total').GetValue|1]#!千人，分#Y 24#!个月迁到[SCOPE.sLocation('oe_col_loc').GetName]：那边少了多少，这边就多多少\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_homesteads')]，持续#Y 10#!年\n占用一批迁移#Y 24#!个月；[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民\n迁完后#Y 1#!到#Y 2#!年内，有#R 40%#!的可能出现新旧户之争"
 oe_col.1.b: "招外族兵户（[GetCountry('BYZ').Custom('OeColGroup')]）"
 oe_col.1.b.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#!金币（三个月的税收与贸易收入）\n[SCOPE.sLocation('oe_col_loc').GetName]新添[GetCountry('BYZ').Custom('OeColGroup')]#G +1.3#!千人：农民#Y 1#!千，士兵#Y 0.3#!千；新户保留本族的语言和信仰（亚美尼亚人信一性论，其余信正教）\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_foreign_settlers')]，持续#Y 20#!年\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_newcomers')]，持续#Y 5#!年\n占用一批迁移#Y 12#!个月；[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民\n落户后#Y 1#!到#Y 2#!年内，有#R 60%#!的可能出现新旧户之争"
 oe_col.1.c: "作罢"
 oe_col.1.c.tt: "退还#G 1#![oe_tu_authority|e]\n随时可以另选地方招民（不计冷却）"
 oe_col.2.t: "新户与旧户"
 oe_col.2.d1: "[SCOPE.sLocation('oe_col_loc').GetName]的老住户和[GetCountry('BYZ').Custom('OeColDspWho')]为田地和水源争执不下：老户说那些地本是自家的，只是荒了几年；新户手里有官府发的地契。打了几场架以后，状子递到了[SCOPE.sCountry('oe_col_theme').GetName]的长官手里，又转呈京城。"
 oe_col.2.d2: "[SCOPE.sLocation('oe_col_loc').GetName]的老住户和[GetCountry('BYZ').Custom('OeColDspWho')]为田地和水源争执不下：老户说那些地本是自家的，只是荒了几年；新户手里有官府发的地契。打了几场架以后，状子递到了京城。"
 oe_col.2.a: "照新户的地契办"
 oe_col.2.a.tt: "[SCOPE.sLocation('oe_col_loc').GetName]的[ShowModifier('oe_col_newcomers')]延长#Y 3#!年（没有则加上#Y 3#!年）\n所属军区忠诚#R −3#!（不属军区时没有这一项）"
 oe_col.2.b: "照老户的习惯办"
 oe_col.2.b.tt: "[SCOPE.sLocation('oe_col_loc').GetName]去掉[ShowModifier('oe_col_homesteads')]、[ShowModifier('oe_col_foreign_settlers')]和[ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_settlers_curbed')]，持续#Y 10#!年\n所属军区忠诚#G +3#!（不属军区时没有这一项）"
 oe_col.2.c: "派法官勘界"
 oe_col.2.c.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!金币（一个月的税收与贸易收入）\n[SCOPE.sLocation('oe_col_loc').GetName]去掉[ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_surveyed')]，持续#Y 10#!年"
 oe_col.10.t: "尼科米底亚难民的去处"
 oe_col.10.d1: "#F 1337年，尼科米底亚粮尽投降，城中的居民获准迁往君士坦丁堡。#!\n\n尼科米底亚的难民在[SCOPE.sLocation('oe_col_city').GetName]住了一年，城里粮价一直在涨。有人提议把难民分到[SCOPE.sLocation('oe_col_loc').GetName]一带的荒地去，也有人想把青壮编进守军和船队。"
 oe_col.10.d2: "#F 1337年，尼科米底亚粮尽投降，城中的居民获准迁往君士坦丁堡。#!\n\n尼科米底亚的难民在[SCOPE.sLocation('oe_col_city').GetName]住了一年，城里粮价一直在涨。帝国眼下没有可以分给难民的荒地；有人想把青壮编进守军和船队，也有人请教会出面赈济。"
 oe_col.10.a: "分到荒地垦荒"
 oe_col.10.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!金币（一个月的税收与贸易收入）\n约#Y 1.8#!千人从[SCOPE.sLocation('oe_col_city').GetName]所在的行省迁到[SCOPE.sLocation('oe_col_loc').GetName]，分#Y 12#!个月走完\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_homesteads')]，持续#Y 10#!年\n[SCOPE.sLocation('oe_col_city').GetName]获得[ShowModifier('oe_col_refugees_moved')]，持续#Y 1#!年，抵消一部分难民的粮耗\n[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民；有空的迁移批次时占用一批#Y 12#!个月"
 oe_col.10.b: "编入京城的守军与水手"
 oe_col.10.b.tt: "获得[ShowModifier('oe_col_refugee_levy')]，持续#Y 5#!年"
 oe_col.10.c: "交给教会赈济"
 oe_col.10.c.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_half')|0]#!金币（半个月的税收与贸易收入）\n教士满意度#G +5%#!"
