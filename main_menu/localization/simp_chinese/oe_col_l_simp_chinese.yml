 oe_col_open_post: "开设商站"
 oe_col_open_post_desc: "请求在黑海或黎凡特的一处港口设立帝国的[oe_tu_emporion|e]。先由我们提出，再由那里的主人答复：准许、要价，或者回绝。\n花费#R 2#![oe_tu_authority|e]和#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_post')|0]#!金币（三个月的税收与贸易收入）；对方回绝或我们作罢时退还一半金币。每年一月付维持费：每点#R 半个月#!的税收与贸易收入。别国港口里最多#Y 6#!处。\n现状：商站合计#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_posts_n').GetValue|0]#!点，其中粮港#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_grain_posts').GetValue|0]#!点；今年的维持费约#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_upkeep')|0]#!金币。[GetCountry('BYZ').Custom('OeColVoucherNow')][GetCountry('BYZ').Custom('OeColGrainNow')]\n塔纳（粮港）：[GetCountry('BYZ').Custom('OeColSt_tana')]\n卡法（粮港）：[GetCountry('BYZ').Custom('OeColSt_kaffa')]\n特拉比松：[GetCountry('BYZ').Custom('OeColSt_trebizond')]\n锡诺普：[GetCountry('BYZ').Custom('OeColSt_sinop')]\n瓦尔纳（粮港）：[GetCountry('BYZ').Custom('OeColSt_varna')]\n基利亚（粮港）：[GetCountry('BYZ').Custom('OeColSt_chilia')]\n法马古斯塔：[GetCountry('BYZ').Custom('OeColSt_famagusta')]\n亚历山大：[GetCountry('BYZ').Custom('OeColSt_alexandria')]\n贝鲁特：[GetCountry('BYZ').Custom('OeColSt_beirut')]"
