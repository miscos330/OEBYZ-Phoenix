 OE_COL_WHY_RECLAIMED: "这里刚从敌人手里收复，原来的人家死的死、逃的逃，只剩#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_pop').GetValue|1]#!千人。"
