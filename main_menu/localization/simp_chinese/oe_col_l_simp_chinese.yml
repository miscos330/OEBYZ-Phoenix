 oe_col_resettle: "招民垦荒"
 oe_col_resettle_desc: "把人迁到收复或荒芜的旧罗马土地上垦荒：从帝国人口多的行省内徙，或招外族兵户落户。见[oe_tu_resettle|e]。\n花费#R 2#![oe_tu_authority|e]；随后的选择里再花金币：内徙#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!，外族兵户#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#!。所选行省里排第一的荒地成为目标：先收复的地方，再人口最少的。\n同时最多#Y 2#!批迁移；两次招民至少相隔#Y 24#!个月；同一地点#Y 20#!年内只招一次。\n现状：荒地#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_sparse_n')|0]#!处；在途的迁移#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_slots_used')|0]#!批。[GetCountry('BYZ').Custom('OeColG1Now')]；[GetCountry('BYZ').Custom('OeColG2Now')]；[GetCountry('BYZ').Custom('OeColG3Now')]。"
