 STATIC_MODIFIER_NAME_oe_col_surveyed: "勘定田界"
 STATIC_MODIFIER_DESC_oe_col_surveyed: "朝廷派来的法官重新丈量了田地，立了界石，登了地册。"
 STATIC_MODIFIER_NAME_oe_col_refugees_moved: "难民迁走"
 STATIC_MODIFIER_DESC_oe_col_refugees_moved: "一部分难民已经去了乡下垦荒，城里的粮食宽松了一些。"
 STATIC_MODIFIER_NAME_oe_col_refugee_levy: "难民从军"
 STATIC_MODIFIER_DESC_oe_col_refugee_levy: "失去家园的难民编进了京城的守军和船队。"
 STATIC_MODIFIER_NAME_oe_col_assimilating: "归化"
 STATIC_MODIFIER_DESC_oe_col_assimilating: "兵户的儿女在本地长大，说希腊话，进本地的教堂，和邻人通婚。"
 STATIC_MODIFIER_NAME_oe_col_hill_raids: "山民袭扰"
 STATIC_MODIFIER_DESC_oe_col_hill_raids: "被挡在山里的牧人下山抢牲口和粮食。"
 STATIC_MODIFIER_NAME_oe_col_albanian_service: "阿尔巴尼亚兵户"
 STATIC_MODIFIER_DESC_oe_col_albanian_service: "色萨利的阿尔巴尼亚部落以兵役换取牧地。"
 STATIC_MODIFIER_NAME_oe_col_stratiotai: "摩里亚的斯特拉迪奥特"
 STATIC_MODIFIER_DESC_oe_col_stratiotai: "在摩里亚落户的阿尔巴尼亚人以轻骑兵的身份服役。"
 STATIC_MODIFIER_NAME_oe_col_steppe_riders: "草原骑手"
 STATIC_MODIFIER_DESC_oe_col_steppe_riders: "从草原来的骑手在帝国军中效力。"
 STATIC_MODIFIER_NAME_oe_col_emporion_fort: "特许商区"
 STATIC_MODIFIER_DESC_oe_col_emporion_fort: "罗马商人的街区筑起了围墙，有帝国派来的法官断案。"
 STATIC_MODIFIER_NAME_oe_col_emporia_1: "海外商站（一）"
 STATIC_MODIFIER_DESC_oe_col_emporia_1: "帝国的商人在黑海与黎凡特的港口有自己的商馆，不必事事经热那亚人之手。"
 STATIC_MODIFIER_NAME_oe_col_emporia_2: "海外商站（二）"
 STATIC_MODIFIER_DESC_oe_col_emporia_2: "帝国的商人在黑海与黎凡特的港口有自己的商馆，不必事事经热那亚人之手。"
 STATIC_MODIFIER_NAME_oe_col_emporia_3: "海外商站（三）"
 STATIC_MODIFIER_DESC_oe_col_emporia_3: "帝国的商人在黑海与黎凡特的港口有自己的商馆，不必事事经热那亚人之手。"
 STATIC_MODIFIER_NAME_oe_col_colonia_seat: "殖民城"
 STATIC_MODIFIER_DESC_oe_col_colonia_seat: "帝国在新得的土地上设的殖民城：照罗马的样子立了官署，分了田地，招人来住。"
 STATIC_MODIFIER_NAME_oe_col_veterans: "老兵田"
 STATIC_MODIFIER_DESC_oe_col_veterans: "退伍的老兵在殖民城周围分到了田地，家里的儿子们照例要当兵。"
 oe_col.1.t: "招什么人"
 oe_col.1.d1: "#F 747年，君士坦丁五世把大批保罗派从东方迁到色雷斯守边；970年，约翰一世又把一批保罗派安置在菲利普波利斯。1122年后，约翰二世把佩切涅格俘虏安置成屯田兵，又把塞尔维亚人迁到尼科米底亚一带。1240年代，约翰三世收留被蒙古人赶到西边的库曼人，以土地换取其兵役。#!\n\n[SCOPE.sCountry('oe_col_theme').GetName]辖下的[SCOPE.sLocation('oe_col_loc').GetName]人少地荒：[GetCountry('BYZ').Custom('OeColWhy')]地方官请示：从帝国别处迁人来，还是招外族兵户落户？"
 oe_col.1.d2: "#F 747年，君士坦丁五世把大批保罗派从东方迁到色雷斯守边；970年，约翰一世又把一批保罗派安置在菲利普波利斯。1122年后，约翰二世把佩切涅格俘虏安置成屯田兵，又把塞尔维亚人迁到尼科米底亚一带。1240年代，约翰三世收留被蒙古人赶到西边的库曼人，以土地换取其兵役。#!\n\n[SCOPE.sLocation('oe_col_loc').GetName]人少地荒：[GetCountry('BYZ').Custom('OeColWhy')]地方官请示：从帝国别处迁人来，还是招外族兵户落户？"
 oe_col.1.a: "从人口多的行省内徙"
 oe_col.1.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!金币（[GetCountry('BYZ').Custom('OeColInWhy')]）\n从[SCOPE.sProvince('oe_col_src').GetName]迁出约#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_total').GetValue|1]#!千人，分#Y 24#!个月迁到[SCOPE.sLocation('oe_col_loc').GetName]：那边少了多少，这边就多多少\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_homesteads')]，持续#Y 10#!年\n占用一批迁移#Y 24#!个月；[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民\n迁完后#Y 1#!到#Y 2#!年内，有#R 40%#!的可能出现新旧户之争"
 oe_col.1.b: "招外族兵户（[GetCountry('BYZ').Custom('OeColGroup')]）"
 oe_col.1.b.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#!金币（[GetCountry('BYZ').Custom('OeColOutWhy')]）\n[SCOPE.sLocation('oe_col_loc').GetName]新添[GetCountry('BYZ').Custom('OeColGroup')]#G +1.3#!千人：农民#Y 1#!千，士兵#Y 0.3#!千；新户保留本族的语言和信仰（亚美尼亚人信一性论，其余信正教）\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_foreign_settlers')]，持续#Y 20#!年\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_newcomers')]，持续#Y 5#!年\n占用一批迁移#Y 12#!个月；[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民\n落户后#Y 1#!到#Y 2#!年内，有#R 60%#!的可能出现新旧户之争"
 oe_col.1.c: "作罢"
 oe_col.1.c.tt: "退还#G 1#![oe_tu_authority|e]\n随时可以另选地方招民（不计冷却）"
 oe_col.2.t: "新户与旧户"
 oe_col.2.d1: "[SCOPE.sLocation('oe_col_loc').GetName]的老住户和[GetCountry('BYZ').Custom('OeColDspWho')]为田地和水源争执不下：老户说那些地本是自家的，只是荒了几年；新户手里有官府发的地契。打了几场架以后，状子递到了[SCOPE.sCountry('oe_col_theme').GetName]的长官手里，又转呈京城。"
 oe_col.2.d2: "[SCOPE.sLocation('oe_col_loc').GetName]的老住户和[GetCountry('BYZ').Custom('OeColDspWho')]为田地和水源争执不下：老户说那些地本是自家的，只是荒了几年；新户手里有官府发的地契。打了几场架以后，状子递到了京城。"
 oe_col.2.a: "照新户的地契办"
 oe_col.2.a.tt: "[SCOPE.sLocation('oe_col_loc').GetName]的[ShowModifier('oe_col_newcomers')]延长#Y 3#!年（没有则加上#Y 3#!年）\n所属军区忠诚#R −3#!（不属军区时没有这一项）"
 oe_col.2.b: "照老户的习惯办"
 oe_col.2.b.tt: "[SCOPE.sLocation('oe_col_loc').GetName]去掉[ShowModifier('oe_col_homesteads')]、[ShowModifier('oe_col_foreign_settlers')]和[ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_settlers_curbed')]，持续#Y 10#!年\n所属军区忠诚#G +3#!（不属军区时没有这一项）"
 oe_col.2.c: "派法官勘界"
 oe_col.2.c.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!金币（[GetCountry('BYZ').Custom('OeColInWhy')]）\n[SCOPE.sLocation('oe_col_loc').GetName]去掉[ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_surveyed')]，持续#Y 10#!年"
 oe_col.3.t: "兵户的儿子们"
 oe_col.3.d1: "当年在[SCOPE.sLocation('oe_col_loc').GetName]落户的外族兵户，儿子们已经长大成人。说本族话的少了，娶本地妻子的多了。年轻人问：往后是照父辈的旧例当兵，还是像邻人一样种地纳税？[SCOPE.sCountry('oe_col_theme').GetName]的长官请朝廷拿个主意。"
 oe_col.3.d2: "当年在[SCOPE.sLocation('oe_col_loc').GetName]落户的外族兵户，儿子们已经长大成人。说本族话的少了，娶本地妻子的多了。年轻人问：往后是照父辈的旧例当兵，还是像邻人一样种地纳税？地方官请朝廷拿个主意。"
 oe_col.3.a: "编入军籍"
 oe_col.3.a.tt: "所属军区人力#G +1#!、忠诚#G +3#!（[SCOPE.sLocation('oe_col_loc').GetName]不属军区时，改为帝国人力#G +1#!）"
 oe_col.3.b: "让这些人归化"
 oe_col.3.b.tt: "[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_assimilating')]，持续#Y 20#!年"
 oe_col.3.c: "照旧"
 oe_col.3.c.tt: "没有变化"
 oe_col.10.t: "尼科米底亚难民的去处"
 oe_col.10.d1: "#F 1337年，尼科米底亚粮尽投降，城中的居民获准迁往君士坦丁堡。#!\n\n尼科米底亚的难民在[SCOPE.sLocation('oe_col_city').GetName]住了一年，城里粮价一直在涨。有人提议把难民分到[SCOPE.sLocation('oe_col_loc').GetName]一带的荒地去，也有人想把青壮编进守军和船队。"
 oe_col.10.d2: "#F 1337年，尼科米底亚粮尽投降，城中的居民获准迁往君士坦丁堡。#!\n\n尼科米底亚的难民在[SCOPE.sLocation('oe_col_city').GetName]住了一年，城里粮价一直在涨。帝国眼下没有可以分给难民的荒地；有人想把青壮编进守军和船队，也有人请教会出面赈济。"
 oe_col.10.a: "分到荒地垦荒"
 oe_col.10.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#!金币（[GetCountry('BYZ').Custom('OeColInWhy')]）\n约#Y 1.8#!千人从[SCOPE.sLocation('oe_col_city').GetName]所在的行省迁到[SCOPE.sLocation('oe_col_loc').GetName]，分#Y 12#!个月走完\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_homesteads')]，持续#Y 10#!年\n[SCOPE.sLocation('oe_col_city').GetName]获得[ShowModifier('oe_col_refugees_moved')]，持续#Y 1#!年，抵消一部分难民的粮耗\n[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民；有空的迁移批次时占用一批#Y 12#!个月"
 oe_col.10.b: "编入京城的守军与水手"
 oe_col.10.b.tt: "获得[ShowModifier('oe_col_refugee_levy')]，持续#Y 5#!年"
 oe_col.10.c: "交给教会赈济"
 oe_col.10.c.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_half')|0]#!金币（半个月的税收与贸易收入）\n教士满意度#G +5%#!"
 oe_col.11.t: "色萨利的阿尔巴尼亚牧人"
 oe_col.11.desc: "#F 据约翰六世·坎塔库泽努斯记载，约1332年，色萨利山中的阿尔巴尼亚部落布阿、马拉卡西奥伊和马扎拉基与皇帝立约：为帝国当兵、纳贡，换取到平原放牧的许可。#!\n\n色萨利山里的几位族长又派人来了：请求让部众和羊群下到[SCOPE.sLocation('oe_col_a1').GetName]和[SCOPE.sLocation('oe_col_a2').GetName]一带的平原，愿意照旧例当兵、纳贡。"
 oe_col.11.a: "准其下山放牧，编为兵户"
 oe_col.11.a.tt: "[SCOPE.sLocation('oe_col_a1').GetName]和[SCOPE.sLocation('oe_col_a2').GetName]各新添阿尔巴尼亚人#G +1.3#!千：农民#Y 1#!千，士兵#Y 0.3#!千；新户信正教，保留本族的语言\n两地各获得[ShowModifier('oe_col_foreign_settlers')]#Y 20#!年、[ShowModifier('oe_col_newcomers')]#Y 5#!年\n帝国获得[ShowModifier('oe_col_albanian_service')]，持续#Y 20#!年\n两地#Y 20#!年内不再招民；#Y 10#!年后，兵户的儿子们长大成人，可能再来请示"
 oe_col.11.b: "只收贡，不给地"
 oe_col.11.b.tt: "获得#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m2')|0]#!金币（两个月的税收与贸易收入）"
 oe_col.11.c: "拒之山外"
 oe_col.11.c.tt: "色萨利行省里帝国的每一处地点获得[ShowModifier('oe_col_hill_raids')]，持续#Y 5#!年"
 oe_col.12.t: "伯罗奔尼撒的阿尔巴尼亚人"
 oe_col.12.d1: "#F 1394至1395年，据载约有一万阿尔巴尼亚人来到科林斯地峡前，请求摩里亚的专制公准许定居。这些人先住进阿卡迪亚，后来又往南去；摩里亚的统治者用其充实荒地，也用其当兵。#!\n\n[SCOPE.sCountry('oe_col_theme').GetName]的长官[SCOPE.sCountry('oe_col_theme').GetGovernment.GetRuler.GetName]来信：又有大批阿尔巴尼亚人带着家眷和牲畜到了地峡，请求到[SCOPE.sLocation('oe_col_a1').GetName]一带定居。放不放这些人进来，请皇帝示下。"
 oe_col.12.d2: "#F 1394至1395年，据载约有一万阿尔巴尼亚人来到科林斯地峡前，请求摩里亚的专制公准许定居。这些人先住进阿卡迪亚，后来又往南去；摩里亚的统治者用其充实荒地，也用其当兵。#!\n\n摩里亚的长官来信：又有大批阿尔巴尼亚人带着家眷和牲畜到了地峡，请求到[SCOPE.sLocation('oe_col_a1').GetName]一带定居。放不放这些人进来，请皇帝示下。"
 oe_col.12.a: "准其入境，分地当兵"
 oe_col.12.a.tt: "阿卡迪亚行省里帝国的地点（至多#Y 3#!处，从人口最少的[SCOPE.sLocation('oe_col_a1').GetName]起）各新添阿尔巴尼亚人#G +1.3#!千：农民#Y 1#!千，士兵#Y 0.3#!千；新户信正教，保留本族的语言\n这些地点各获得[ShowModifier('oe_col_foreign_settlers')]#Y 20#!年、[ShowModifier('oe_col_newcomers')]#Y 5#!年\n帝国获得[ShowModifier('oe_col_stratiotai')]，持续#Y 20#!年\n米斯特拉所属军区忠诚#G +5#!（米斯特拉不属军区时没有这一项）\n这些地点#Y 20#!年内不再招民；#Y 10#!年后，兵户的儿子们长大成人，可能再来请示"
 oe_col.12.b: "只准一部分入境"
 oe_col.12.b.tt: "[SCOPE.sLocation('oe_col_a1').GetName]新添阿尔巴尼亚人#G +1.3#!千：农民#Y 1#!千，士兵#Y 0.3#!千；新户信正教，保留本族的语言\n[SCOPE.sLocation('oe_col_a1').GetName]获得[ShowModifier('oe_col_foreign_settlers')]#Y 20#!年、[ShowModifier('oe_col_newcomers')]#Y 5#!年\n帝国获得[ShowModifier('oe_col_stratiotai')]，持续#Y 20#!年\n米斯特拉所属军区忠诚#G +5#!（米斯特拉不属军区时没有这一项）\n[SCOPE.sLocation('oe_col_a1').GetName]#Y 20#!年内不再招民；#Y 10#!年后，兵户的儿子们长大成人，可能再来请示"
 oe_col.12.c: "拒于地峡之外"
 oe_col.12.c.tt: "威望#G +2#!"
 oe_col.14.t: "草原来的逃人"
 oe_col.14.desc: "#F 1240年代，被蒙古人赶到西边的库曼人带着家眷投奔帝国，换取土地和军饷；十四世纪初，阿兰人也带着家眷来投。#!\n\n草原上战乱不休，又有一批[GetCountry('BYZ').Custom('OeColSteppe')]骑手带着家眷渡过多瑙河，请求在帝国境内落户。地方官提议把这些人安置到[SCOPE.sLocation('oe_col_loc').GetName]。"
 oe_col.14.a: "收留并安置"
 oe_col.14.a.tt: "[SCOPE.sLocation('oe_col_loc').GetName]新添[GetCountry('BYZ').Custom('OeColSteppe')]人#G +1.3#!千：农民#Y 1#!千，士兵#Y 0.3#!千；新户信正教，保留本族的语言\n[SCOPE.sLocation('oe_col_loc').GetName]获得[ShowModifier('oe_col_foreign_settlers')]#Y 20#!年、[ShowModifier('oe_col_newcomers')]#Y 5#!年\n帝国获得[ShowModifier('oe_col_steppe_riders')]，持续#Y 10#!年\n金帐汗国对我们的好感#R −10#!，持续#Y 5#!年（金帐汗国已不存在时没有这一项）\n[SCOPE.sLocation('oe_col_loc').GetName]#Y 20#!年内不再招民；#Y 10#!年后，兵户的儿子们长大成人，可能再来请示"
 oe_col.14.b: "只雇这些人打仗"
 oe_col.14.b.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#!金币（一个月的税收与贸易收入）\n帝国获得[ShowModifier('oe_col_steppe_riders')]，持续#Y 5#!年"
 oe_col.14.c: "遣回草原"
 oe_col.14.c.tt: "金帐汗国对我们的好感#G +10#!，持续#Y 5#!年（金帐汗国已不存在时没有这一项）"
 oe_col.20.t: "帝国的商船"
 oe_col.20.d1: "#F 十三世纪末，史家帕奇梅雷斯抱怨：黑海的运粮生意早就交到了热那亚人手里。1348年，约翰六世降低关税、借钱造船，想让帝国在粮食和海运上不再仰赖加拉塔。#!\n\n京城的希腊商人联名上书：请准许在黑海各港设立商馆，由帝国颁给特许。塔纳、卡法、特拉比松、锡诺普、瓦尔纳、基利亚，都有人愿意去。"
 oe_col.20.d2: "#F 十三世纪末，史家帕奇梅雷斯抱怨：黑海的运粮生意早就交到了热那亚人手里。#!\n\n京城的希腊商人联名上书：请准许在黑海各港设立商馆，由帝国颁给特许。塔纳、卡法、特拉比松、锡诺普、瓦尔纳、基利亚，都有人愿意去。"
 oe_col.20.a: "准设商站，帝国出资"
 oe_col.20.a.tt: "开放行动“开设商站”（财政诏令）。见[oe_tu_emporion|e]\n花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#!金币（一个月的税收与贸易收入）\n#Y 24#!个月内开设的第一处商站不花金币（省下#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_post')|0]#!）"
 oe_col.20.b: "先准，但由商人自筹"
 oe_col.20.b.tt: "开放行动“开设商站”（财政诏令）。见[oe_tu_emporion|e]"
 oe_col.21.t: "商站的答复"
 oe_col.21.d1: "[SCOPE.sCountry('oe_col_host').GetName]答应了：准许罗马商人在[SCOPE.sLocation('oe_col_site').GetName]设立商馆，划出一处临水的货栈和码头。"
 oe_col.21.d2: "[SCOPE.sCountry('oe_col_host').GetName]的人说，[SCOPE.sLocation('oe_col_site').GetName]的码头是热那亚人的码头。罗马人要来可以，得先谈价钱：或者付一笔钱，或者在君士坦丁堡给热那亚人更多的方便。"
 oe_col.21.d3: "[SCOPE.sCountry('oe_col_host').GetName]回绝了：[SCOPE.sLocation('oe_col_site').GetName]不准罗马人设馆。"
 oe_col.21.a: "立约开张"
 oe_col.21.a.tt: "[SCOPE.sLocation('oe_col_site').GetName]开设商站（#G +1#!点）：建起#bold #color_yellow 罗马商馆#!#!，帝国的商人在那里的市场多一分力\n[SCOPE.sCountry('oe_col_host').GetName]对我们好感#G +10#!，持续#Y 10#!年\n卡法、塔纳不归热那亚一方时：热那亚对我们好感#R −10#!，持续#Y 5#!年\n每年一月付维持费：每点#R 半个月#!的税收与贸易收入"
 oe_col.21.b: "付对方要的钱"
 oe_col.21.b.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_price')|0]#!金币（两个月的税收与贸易收入），付给[SCOPE.sCountry('oe_col_host').GetName]\n[SCOPE.sLocation('oe_col_site').GetName]开设商站（#G +1#!点）：建起#bold #color_yellow 罗马商馆#!#!，帝国的商人在那里的市场多一分力\n[SCOPE.sCountry('oe_col_host').GetName]对我们好感#G +10#!，持续#Y 10#!年\n卡法、塔纳不归热那亚一方时：热那亚对我们好感#R −10#!，持续#Y 5#!年\n每年一月付维持费：每点#R 半个月#!的税收与贸易收入"
 oe_col.21.c: "以一级特权换对方点头"
 oe_col.21.c.tt: "热那亚在君士坦丁堡的[oe_tu_privilege|e]升一级\n[SCOPE.sLocation('oe_col_site').GetName]开设商站（#G +1#!点）：建起#bold #color_yellow 罗马商馆#!#!，帝国的商人在那里的市场多一分力\n[SCOPE.sCountry('oe_col_host').GetName]对我们好感#G +10#!，持续#Y 10#!年\n卡法、塔纳不归热那亚一方时：热那亚对我们好感#R −10#!，持续#Y 5#!年\n每年一月付维持费：每点#R 半个月#!的税收与贸易收入"
 oe_col.21.d: "作罢"
 oe_col.21.d.tt: "退还已付金币的一半（#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_req_refund')|0]#!）\n[SCOPE.sLocation('oe_col_site').GetName]#Y 60#!个月内不能再设"
 oe_col.21.e: "记下"
 oe_col.21.e.tt: "退还已付金币的一半（#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_req_refund')|0]#!）\n[SCOPE.sLocation('oe_col_site').GetName]#Y 60#!个月内不能再设"
 oe_col.22.t: "商站失陷"
 oe_col.22.d1: "[SCOPE.sCountry('oe_col_host').GetName]与帝国开战了。[SCOPE.sLocation('oe_col_site').GetName]的罗马商馆被查封，货栈里的货全数扣下：损失#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#!金币。"
 oe_col.22.d2: "塔纳毁于兵火，城里各国的商馆无一幸免，罗马商馆也在其中。"
 oe_col.22.d3: "国库付不出黑海商站的维持费。[SCOPE.sLocation('oe_col_site').GetName]的商馆是最晚开的一处，只好关门，商人各自回京。"
 oe_col.22.d4: "热那亚人的加扎里亚亡了。[SCOPE.sLocation('oe_col_site').GetName]的罗马商馆也到此为止。"
 oe_col.22.d5: "[SCOPE.sLocation('oe_col_site').GetName]换了主人。新主人不认罗马人的特许，商馆被收走了。"
 oe_col.22.a: "向对方索赔"
 oe_col.22.a.tt: "[SCOPE.sCountry('oe_col_host').GetName]对我们好感#R −10#!，持续#Y 5#!年\n#G 40%#!的可能：#Y 3#!个月后对方赔还#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#!金币（一个月的收入）"
 oe_col.22.b: "认了"
 oe_col.22.b.tt: "没有别的后果"
 oe_col.22.c: "转往别处"
 oe_col.22.c.tt: "#Y 24#!个月内开设的下一处商站不花金币"
 oe_col.23.t: "商站兴旺"
 oe_col.23.desc: "[SCOPE.sLocation('oe_col_site').GetName]的罗马商馆开了十多年，生意一年比一年好，希腊商人在那里已经住成了一条街。商人们请求筑一道围墙，由帝国派一位法官常驻；[SCOPE.sCountry('oe_col_host').GetName]的人对此不大乐意。也有人说，不如请牧首区在那里设一个堂区。"
 oe_col.23.a: "修筑商区围墙，设帝国法官"
 oe_col.23.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_fort')|0]#!金币（四个月的税收与贸易收入）\n[SCOPE.sLocation('oe_col_site').GetName]的商站升为特许商区（#G 2#!点），此后维持费也按#Y 2#!点付\n[SCOPE.sLocation('oe_col_site').GetName]获得[ShowModifier('oe_col_emporion_fort')]（升为2级期间一直有效）\n[SCOPE.sCountry('oe_col_host').GetName]属热那亚或威尼斯一方时：对我们好感#R −5#!，持续#Y 5#!年"
 oe_col.23.b: "保持现状"
 oe_col.23.b.tt: "[SCOPE.sCountry('oe_col_host').GetName]对我们好感#G +10#!，持续#Y 10#!年\n这处商站#Y 10#!年内不再有此一问"
 oe_col.23.c: "由牧首区在那里设堂区"
 oe_col.23.c.tt: "教士满意度#G +5%#!\n牧首区的威望#G +2#!（教会框架尚未建立时没有这一项）\n这处商站#Y 10#!年内不再有此一问"
 oe_col.24.t: "罗马人请求设馆"
 oe_col.24.desc: "君士坦丁堡的皇帝派人来：请求准许罗马商人在[SCOPE.sLocation('oe_col_site').GetName]设立商馆。来人说，商人们照章纳税，守本地的规矩，只求一处临水的货栈和码头。"
 oe_col.24.a: "准其设馆"
 oe_col.24.a.tt: "罗马人将在[SCOPE.sLocation('oe_col_site').GetName]开设商馆（一座归罗马人所有的外国建筑）\n我们对罗马人的好感提高#Y 10#!，持续#Y 10#!年"
 oe_col.24.b: "可以，但要一个价钱"
 oe_col.24.b.tt: "罗马人可以付一笔钱（归我们），可以拿君士坦丁堡的特权来换，也可以作罢"
 oe_col.24.c: "回绝"
 oe_col.24.c.tt: "罗马人不能在[SCOPE.sLocation('oe_col_site').GetName]设馆"
 oe_col.30.t: "新殖民城"
 oe_col.30.d1: "#F 共和与帝政之初，罗马人在新得的土地上设殖民城，安置公民和退伍的老兵，照罗马的样子立官署、分田地。据《奥古斯都功业录》，这位元首新设的殖民城里安置的老兵约有十二万人。#!\n\n[SCOPE.sLocation('oe_col_seat').GetName]成了帝国的殖民城。那一带原先不归任何军区管辖，朝廷在[SCOPE.sLocation('oe_col_seat').GetName]新设了[SCOPE.sCountry('oe_col_theme').GetName]，[GetCountry('BYZ').Custom('OeColC30Status')]。[GetCountry('BYZ').Custom('OeColC30Cmp')]地方官请示：先拿什么来充实这座新城？"
 oe_col.30.d2: "#F 共和与帝政之初，罗马人在新得的土地上设殖民城，安置公民和退伍的老兵，照罗马的样子立官署、分田地。据《奥古斯都功业录》，这位元首新设的殖民城里安置的老兵约有十二万人。#!\n\n[SCOPE.sLocation('oe_col_seat').GetName]成了帝国的殖民城，划归邻近的[SCOPE.sCountry('oe_col_theme').GetName]管辖。[GetCountry('BYZ').Custom('OeColC30Cmp')]地方官请示：先拿什么来充实这座新城？"
 oe_col.30.a: "安置老兵"
 oe_col.30.a.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#!金币（一个月的税收与贸易收入）\n[SCOPE.sLocation('oe_col_seat').GetName]获得[ShowModifier('oe_col_veterans')]，持续#Y 20#!年\n[SCOPE.sCountry('oe_col_theme').GetName]的忠诚#G +5#!"
 oe_col.30.b: "设为港城"
 oe_col.30.b.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#!金币（一个月的税收与贸易收入）\n[SCOPE.sCountry('oe_col_theme').GetName]改走海军方针（同“军区方针”里的“海军军区”一项）\n#Y 5#!年内不能再改方针"
 oe_col.30.c: "招民充实"
 oe_col.30.c.tt: "花费#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m2')|0]#!金币（两个月的税收与贸易收入）\n从[SCOPE.sProvince('oe_col_src').GetName]向[SCOPE.sLocation('oe_col_seat').GetName]内徙，为期#Y 24#!个月（同[oe_tu_resettle|e]的内徙，不计行动冷却）\n[SCOPE.sLocation('oe_col_seat').GetName]获得[ShowModifier('oe_col_homesteads')]，持续#Y 10#!年\n占用一批迁移#Y 24#!个月；[SCOPE.sLocation('oe_col_seat').GetName]#Y 20#!年内不再招民"
 oe_col.30.d: "暂且如此"
 oe_col.30.d.tt: "新城照常归军区管辖，不另花钱"
