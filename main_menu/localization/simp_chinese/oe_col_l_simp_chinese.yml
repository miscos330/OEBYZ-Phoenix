 game_concept_oe_tu_resettle: "招民垦荒"
 game_concept_oe_tu_resettle_desc: "#F 747年和970年，皇帝把整族的保罗派迁到色雷斯守边；十二世纪，约翰二世把佩切涅格俘虏和塞尔维亚人安置成屯田兵；1240年代，约翰三世用土地换来库曼人的兵役。#!\n\n帝国可以把人迁到收复或荒芜的旧罗马土地上（行动“招民垦荒”）。\n#bold 荒地#!：帝国直接拥有并控制的旧罗马土地（历史辖区、外圈的故省、待安置的收复地），而且人口不足#Y 6#!千、或遭劫掠还没恢复、或刚收复、或居民大多不是正教徒；君士坦丁堡本城除外，#Y 20#!年内招过民的地点也除外。\n#bold 内徙#!：从帝国人口最多的另一个行省迁人，分#Y 24#!个月走完，那边少多少、这边就多多少。花费一个月的税收与贸易收入。\n#bold 外族兵户#!：阿尔巴尼亚人、库曼人或阿兰人、亚美尼亚人，每次新添#Y 1.3#!千人，带来兵源和防御，头几年地方不安。花费三个月的收入。能招哪一族，看帝国拥有哪里的土地和草原的局势。\n同时最多#Y 2#!批迁移，两次招民至少相隔#Y 24#!个月。迁完一两年里，新来的人和老住户可能为田地起争执。\n史料里的迁徙动辄上万人，游戏里按比例缩小了。\n#bold 分工#!：“安置兵户”给陆军方针的[oe_tu_march|e]或[oe_tu_exarchate|e]一份兵源修正；“安置收复的故省”在收复故土时定下头五年的办法；招民垦荒则在地点上真的增减人口。"
