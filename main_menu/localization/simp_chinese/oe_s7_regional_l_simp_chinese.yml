 oe_s7.4.t: "巴尔拉姆出使阿维尼翁"
 oe_s7.4.d: "1339年，安德洛尼卡三世派卡拉布里亚出身的修士巴尔拉姆出使阿维尼翁，去见教宗本笃十二世。巴尔拉姆提出：先由西方出兵把突厥人赶出小亚细亚，再召开东西两边教会都参加的大公会议商议合一；巴尔拉姆也直言，两边百姓之间的积怨比教义上的分歧更难化解。教宗不同意先开会议、再谈合一，这次出使没有结果。\n\n如今，巴尔拉姆请命出使阿维尼翁。京城的教士对向罗马示好心怀疑虑；在帕拉马斯一派看来，巴尔拉姆本人就靠不住。"
 oe_s7.4.a: "派巴尔拉姆出使"
 oe_s7.4.a.tt: "金币#R −40#!。\n教宗国对我们的好感#G +15#!（#Y 10#!年）。\n教士阶层满意度#R −2.5%#!。"
 oe_s7.4.b: "暂不遣使"
 oe_s7.4.b.tt: "教士阶层满意度#G +2.5%#!。"
