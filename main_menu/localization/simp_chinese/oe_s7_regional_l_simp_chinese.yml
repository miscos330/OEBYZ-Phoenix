 oe_s7.2.t: "帕特雷的禁令"
 oe_s7.2.d1: "帕特雷大主教是亚该亚公国最大的教会封臣。1337年，大主教古列尔莫·弗兰吉帕尼去世，继任者罗杰还没从意大利赶到，亚该亚总督贝尔特朗·德·博就领兵围攻帕特雷，想把这座城收归公国。教宗本笃十二世宣布帕特雷是罗马教会的土地，对亚该亚公国下了禁令，贝尔特朗只得撤兵。此后帕特雷实际上独立于公国，大主教只为世俗封地向亲王效忠。\n\n如今，帕特雷已经脱离亚该亚，亚该亚的拉丁人在禁令下彼此争吵。在摩里亚的边境上，帝国可以选边站，也可以只是看着。"
 oe_s7.2.d: "帕特雷大主教是亚该亚公国最大的教会封臣。1337年，大主教古列尔莫·弗兰吉帕尼去世，继任者罗杰还没从意大利赶到，亚该亚总督贝尔特朗·德·博就领兵围攻帕特雷，想把这座城收归公国。教宗本笃十二世宣布帕特雷是罗马教会的土地，对亚该亚公国下了禁令，贝尔特朗只得撤兵。此后帕特雷实际上独立于公国，大主教只为世俗封地向亲王效忠。\n\n如今，帕特雷城下的争执还没有了结，亚该亚的拉丁人彼此争吵。在摩里亚的边境上，帝国可以选边站，也可以只是看着。"
