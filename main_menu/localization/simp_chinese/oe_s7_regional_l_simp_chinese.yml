 oe_s7.3.t: "卡特琳娜来到亚该亚"
 oe_s7.3.d1: "瓦卢瓦的卡特琳娜名义上是拉丁帝国的女皇，替儿子罗贝尔治理亚该亚。1338年，卡特琳娜带着全家和谋士尼科洛·阿恰约利渡海来到亚该亚，在那里住了约两年。伊庇鲁斯年幼的尼基福罗斯二世此前已被人带到卡特琳娜的宫廷，指望安茹家族帮忙复国；1338年末，伊庇鲁斯的叛党在卡特琳娜的鼓动下夺下阿尔塔，以尼基福罗斯的名义起事。\n\n如今，卡特琳娜已在亚该亚落脚，伊庇鲁斯的旧臣与拉丁人往来频繁。阿尔塔和约阿尼纳若无防备，叛党随时可能起事。"
 oe_s7.3.d: "瓦卢瓦的卡特琳娜名义上是拉丁帝国的女皇，替儿子罗贝尔治理亚该亚。1338年，卡特琳娜带着全家和谋士尼科洛·阿恰约利渡海来到亚该亚，在那里住了约两年。伊庇鲁斯年幼的尼基福罗斯二世此前已被人带到卡特琳娜的宫廷，指望安茹家族帮忙复国；1338年末，伊庇鲁斯的叛党在卡特琳娜的鼓动下夺下阿尔塔，以尼基福罗斯的名义起事。\n\n如今，卡特琳娜已在亚该亚落脚。伊庇鲁斯仍是帝国的附庸，可它的宫廷里已经有人想借安茹家族的力量摆脱帝国。"
 oe_s7.3.a: "增兵伊庇鲁斯"
 oe_s7.3.a.tt: "金币#R −60#!。\n帝国在阿尔塔和约阿尼纳的地点得“伊庇鲁斯驻防”（#Y 3#!年）：防御 #G +25%#!，本地叛乱度 #G −10%#!。\n伊庇鲁斯若仍是附庸：独立倾向#G −10#!。"
 oe_s7.3.b: "向亚该亚抗议"
 oe_s7.3.b.tt: "亚该亚对我们的好感#R −15#!（#Y 10#!年）。\n帝国在阿尔塔和约阿尼纳的地点得“安茹的煽动”（#Y 12#!个月）：本地叛乱度 #R +20%#!，最大控制力 #R −10%#!。\n伊庇鲁斯若仍是附庸：独立倾向#R +5#!。"
 oe_s7.3.c: "不加理会"
