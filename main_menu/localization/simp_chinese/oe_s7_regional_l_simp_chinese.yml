 oe_s7.1.t: "奇里乞亚的屈辱和约"
 oe_s7.1.d1: "1337年初，马穆鲁克苏丹调集埃及和叙利亚各地的军队攻入奇里乞亚，由阿勒颇总督统率，一路攻取要塞，围降港口阿亚斯。约在6月，亚美尼亚国王列翁四世被迫接受屈辱的和约：割让阿亚斯等要塞和土地，赔付巨款，并答应不再与西方往来。日后在1342年继承亚美尼亚王位的吕西尼昂的居伊，此时正在帝国任塞雷斯总督。\n\n如今，阿亚斯已归马穆鲁克所有。奇里乞亚的使节来到君士坦丁堡，希望帝国能接济一二。"
 oe_s7.1.d: "1337年初，马穆鲁克苏丹调集埃及和叙利亚各地的军队攻入奇里乞亚，由阿勒颇总督统率，一路攻取要塞，围降港口阿亚斯。约在6月，亚美尼亚国王列翁四世被迫接受屈辱的和约：割让阿亚斯等要塞和土地，赔付巨款，并答应不再与西方往来。日后在1342年继承亚美尼亚王位的吕西尼昂的居伊，此时正在帝国任塞雷斯总督。\n\n如今，马穆鲁克大军仍在奇里乞亚境内，阿亚斯还没有易手。奇里乞亚的使节来到君士坦丁堡求援。"
 oe_s7.1.a: "接济列翁国王"
