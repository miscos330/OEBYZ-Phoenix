# NEW 2026-11-22 v15.5 Stars of East Asia — Korea Sea/Land (oe_kr2_). Generated by gen_v155_east_se_asia.py; edit the generator, not this file.
 oe_kr2_geobukseon:0 "龟船装甲战舰"
 oe_kr2_geobukseon_desc:0 "朝鲜水师独创的铁刺龟甲战船，覆以防登临铁刺甲板与龙头火炮，兼备强悍船体防护与近距齐射威慑，专破敌方主力舰阵。"
 oe_kr2_hwacha:0 "神机箭火车型炮"
 oe_kr2_hwacha_desc:0 "可一次齐射上百支神机火箭的轻便轮式火箭炮车，在山地堡垒与要隘守御中能倾泻铺天盖地的密集火雨，重创敌军士气与阵型。"
 STATIC_MODIFIER_NAME_oe_kr2_wihwado_army_mod:0 "威化岛回军革新军纪"
 STATIC_MODIFIER_DESC_oe_kr2_wihwado_army_mod:0 "威化岛回军整肃禁旅与边防军制，令王师士气高昂、训练严明。"
 STATIC_MODIFIER_NAME_oe_kr2_kaesong_compromise_mod:0 "开京旧都安抚与礼法整饬"
 STATIC_MODIFIER_DESC_oe_kr2_kaesong_compromise_mod:0 "暂缓急进政争以稳固开京勋贵与地方税籍，保全半岛社会安定。"
 STATIC_MODIFIER_NAME_oe_kr2_joseon_founding_mod:0 "汉阳定鼎与经国大典根基"
 STATIC_MODIFIER_DESC_oe_kr2_joseon_founding_mod:0 "迁都汉阳并推行科田法清丈田亩，巩固六曹政制与中央财政统筹。"
 STATIC_MODIFIER_NAME_oe_kr2_kaesong_guilds_mod:0 "开京松商与南北货栈网"
 STATIC_MODIFIER_DESC_oe_kr2_kaesong_guilds_mod:0 "保留开京松商行会特许与汉江漕运通道，激发半岛商贸与手工业活力。"
 STATIC_MODIFIER_NAME_oe_kr2_sejong_science_mod:0 "集贤殿格致：浑天仪与测雨器"
 STATIC_MODIFIER_DESC_oe_kr2_sejong_science_mod:0 "蒋英实铸造测雨器、自击漏与简仪浑天仪，将朝鲜天文历法与工巧格致推向东亚巅峰。"
 STATIC_MODIFIER_NAME_oe_kr2_sejong_agronomy_mod:0 "农事直说与劝农水利"
 STATIC_MODIFIER_DESC_oe_kr2_sejong_agronomy_mod:0 "颁行因地制宜的《农事直说》并兴修堤堰水库，连年丰稔惠及八道百姓。"
 STATIC_MODIFIER_NAME_oe_kr2_hangul_literacy_mod:0 "训民正音颁行与铜活字普及"
 STATIC_MODIFIER_DESC_oe_kr2_hangul_literacy_mod:0 "易学易用的谚文与铜活字印书将律令、医方与农书传遍乡野，令民间识字率跃升。"
 STATIC_MODIFIER_NAME_oe_kr2_dual_script_mod:0 "汉谚并行典籍编纂"
 STATIC_MODIFIER_DESC_oe_kr2_dual_script_mod:0 "宫廷典籍与乡里告示汉谚并载，既稳士林文脉又通民情教化。"
 STATIC_MODIFIER_NAME_oe_kr2_singijeon_trials_mod:0 "文宗神机箭与火车型炮工坊"
 STATIC_MODIFIER_DESC_oe_kr2_singijeon_trials_mod:0 "标准化火箭推药与百发火车型炮架令朝鲜野战火力与守城齐射威震四邻。"
 STATIC_MODIFIER_NAME_oe_kr2_northern_forts_mod:0 "四郡六镇鸭绿图们边堡"
 STATIC_MODIFIER_DESC_oe_kr2_northern_forts_mod:0 "沿鸭绿江与图们江筑起连环边镇与烽燧台，构筑固若金汤的北方纵深防线。"
 STATIC_MODIFIER_NAME_oe_kr2_sarim_integrity_mod:0 "士林清议与台谏监察"
 STATIC_MODIFIER_DESC_oe_kr2_sarim_integrity_mod:0 "秉持清议的士林言官整肃贪墨、倡明廉政，提升朝廷清望与治国效能。"
 STATIC_MODIFIER_NAME_oe_kr2_hungu_centralization_mod:0 "勋旧议政府中枢集权"
 STATIC_MODIFIER_DESC_oe_kr2_hungu_centralization_mod:0 "资历深厚的勋旧大臣统领六曹军政，政令迅捷而官僚掌控力增强。"
 STATIC_MODIFIER_NAME_oe_kr2_hyangyak_mod:0 "赵光祖乡约自治与贤良科"
 STATIC_MODIFIER_DESC_oe_kr2_hyangyak_mod:0 "推行德业相劝、患难相恤的乡约并广揽贤才，地方民心归附而教化兴盛。"
 STATIC_MODIFIER_NAME_oe_kr2_court_truce_mod:0 "士祸缓和与朝堂妥协"
 STATIC_MODIFIER_DESC_oe_kr2_court_truce_mod:0 "以温和节度平息政争风暴，保全朝廷元气与大臣班底。"
 STATIC_MODIFIER_NAME_oe_kr2_border_vigilance_mod:0 "备边司整军与跨党备战"
 STATIC_MODIFIER_DESC_oe_kr2_border_vigilance_mod:0 "超脱党争之上的备边司统筹水陆军需、修缮海防镇堡，防患未然。"
 STATIC_MODIFIER_NAME_oe_kr2_factional_drive_mod:0 "朝纲一统与疾行决断"
 STATIC_MODIFIER_DESC_oe_kr2_factional_drive_mod:0 "单一执政派系集中六曹实权，虽引发在野议论却令军政决策雷厉风行。"
 STATIC_MODIFIER_NAME_oe_kr2_hansando_victory_mod:0 "闲山岛鹤翼阵与龟船水师"
 STATIC_MODIFIER_DESC_oe_kr2_hansando_victory_mod:0 "李舜臣率全罗水师以铁甲龟船突阵、板屋船张开鹤翼阵齐射，牢牢锁死南海制海权。"
 STATIC_MODIFIER_NAME_oe_kr2_southern_sea_lanes_mod:0 "三道水军统制营海运补给"
 STATIC_MODIFIER_DESC_oe_kr2_southern_sea_lanes_mod:0 "统筹全罗、庆尚、忠清三道水营粮饷与造船林场，确保持久海防不断绝。"
 STATIC_MODIFIER_NAME_oe_kr2_haengju_hwacha_mod:0 "幸州火车型炮与火器守城术"
 STATIC_MODIFIER_DESC_oe_kr2_haengju_hwacha_mod:0 "权栗在幸州山城以火车型炮与震天雷粉碎七轮强攻，确立山地炮阵协同防御典范。"
 STATIC_MODIFIER_NAME_oe_kr2_righteous_armies_mod:0 "八道义兵与护国僧军"
 STATIC_MODIFIER_DESC_oe_kr2_righteous_armies_mod:0 "乡绅义兵与西山大师僧军群起抗敌、袭扰粮道，令侵略者陷入人民战争汪洋。"
 STATIC_MODIFIER_NAME_oe_kr2_myeongnyang_mod:0 "鸣梁海峡铁锁水军奇迹"
 STATIC_MODIFIER_DESC_oe_kr2_myeongnyang_mod:0 "借鸣梁急流以十二战船击破百余敌舰，朝鲜水师以无畏战魂威震东亚海疆。"
 STATIC_MODIFIER_NAME_oe_kr2_allied_relief_mod:0 "东亚联军协同与水陆夹击"
 STATIC_MODIFIER_DESC_oe_kr2_allied_relief_mod:0 "贯通陆上援军与沿海战船的联络补给，借外交协防扭转战局。"
 STATIC_MODIFIER_NAME_oe_kr2_daedongbeop_mod:0 "大同法税制革新"
 STATIC_MODIFIER_DESC_oe_kr2_daedongbeop_mod:0 "废除繁苛土产进贡、按田亩折征统一米布，大幅减轻小农负担并充盈国库。"
 STATIC_MODIFIER_NAME_oe_kr2_gongin_markets_mod:0 "贡人官商与全国市廛兴盛"
 STATIC_MODIFIER_DESC_oe_kr2_gongin_markets_mod:0 "官府委托贡人采购百物，催生专业化手工业与活跃的全国米布货币市场。"
 STATIC_MODIFIER_NAME_oe_kr2_namhansan_defiance_mod:0 "南汉山城孤城抗守与鸟铳新军"
 STATIC_MODIFIER_DESC_oe_kr2_namhansan_defiance_mod:0 "依托南汉山城与江华险阻重整御营厅火器部队，锤炼朝鲜军民不屈斗志。"
 STATIC_MODIFIER_NAME_oe_kr2_pragmatic_peace_mod:0 "务实休养与疆土保全外交"
 STATIC_MODIFIER_DESC_oe_kr2_pragmatic_peace_mod:0 "在强邻环伺间以审慎外交换取和平喘息，迅速恢复八道户口与财力。"
 STATIC_MODIFIER_NAME_oe_kr2_hyojong_firearms_mod:0 "孝宗御营厅鸟铳精锐改革"
 STATIC_MODIFIER_DESC_oe_kr2_hyojong_firearms_mod:0 "扩编常备火绳枪手与野战火炮队，令朝鲜禁军步炮协同战力焕然一新。"
 STATIC_MODIFIER_NAME_oe_kr2_domestic_recovery_mod:0 "常平通宝与漕运民生复兴"
 STATIC_MODIFIER_DESC_oe_kr2_domestic_recovery_mod:0 "铸行常平通宝并整修三南漕运，令民间商市与州县义仓欣欣向荣。"
 STATIC_MODIFIER_NAME_oe_kr2_tangpyeong_mod:0 "英祖荡平无偏与均役新政"
 STATIC_MODIFIER_DESC_oe_kr2_tangpyeong_mod:0 "超越老少南北四色党争、唯才是举，并行均役法减半军布，开创中兴盛世。"
 STATIC_MODIFIER_NAME_oe_kr2_amhaengeosa_mod:0 "暗行御史巡察八道廉政"
 STATIC_MODIFIER_DESC_oe_kr2_amhaengeosa_mod:0 "佩带马牌的暗行御史微服巡行州县，肃清贪吏、强化中央对地方直辖控制。"
 STATIC_MODIFIER_NAME_oe_kr2_silhak_renaissance_mod:0 "奎章阁实学与利用厚生思潮"
 STATIC_MODIFIER_DESC_oe_kr2_silhak_renaissance_mod:0 "正祖设奎章阁汇聚丁若镛等实学巨擘，将机械举重器、测绘、医学与商业革新融入国政。"
 STATIC_MODIFIER_NAME_oe_kr2_hwaseong_fortress_mod:0 "水原华城近代星堡与商贸新城"
 STATIC_MODIFIER_DESC_oe_kr2_hwaseong_fortress_mod:0 "集东西筑城之大成、以滑轮举重器筑起砖石华城并广招商贾，化作京畿南翼重镇。"
 STATIC_MODIFIER_NAME_oe_kr2_turtle_dockyards_mod:0 "统制营龟船官厂"
 STATIC_MODIFIER_DESC_oe_kr2_turtle_dockyards_mod:0 "全罗与庆尚官营船坞批量打造铁甲龟船与板屋巨舰，全速扩充精锐海防舰队。"
 STATIC_MODIFIER_NAME_oe_kr2_hwacha_batteries_mod:0 "神机箭火车型炮常备营"
 STATIC_MODIFIER_DESC_oe_kr2_hwacha_batteries_mod:0 "军器寺批量铸造火箭筒与轻便车架，将火车型炮全面配属边防与野战精锐。"
 oe_kr2_dec_turtle_dockyards.title:0 "兴建统制营龟船官厂"
 oe_kr2_dec_turtle_dockyards.desc:0 "在全罗与庆尚沿海水营拨银兴建铁甲龟船专用船坞，正式解锁可招募的龟船装甲战舰（Geobukseon），大幅提升造船速度与桨帆主力战力。"
 oe_kr2_dec_turtle_dockyards.a:0 "即刻兴建龟船官厂"
 oe_kr2_dec_hwacha_batteries.title:0 "列装神机箭火车型炮队"
 oe_kr2_dec_hwacha_batteries.desc:0 "命军器寺大规模打造轮式神机箭火车型炮并配属各道守军，正式解锁可招募的神机箭火车型炮（Hwacha）部队，赋予全军25年炮兵火力与攻城增益。"
 oe_kr2_dec_hwacha_batteries.a:0 "全面列装火车型炮"
 oe_kr2_dec_tangpyeong.title:0 "推行荡平无偏新政"
 oe_kr2_dec_tangpyeong.desc:0 "超越朝堂朋党之见，均衡任用各方贤才并减缓民生税负，恢复国家稳定度、正统性与财政效率（持续30年）。"
 oe_kr2_dec_tangpyeong.a:0 "颁布荡平御敕"
 oe_kr2.1.title:0 "威化岛回军：李成桂的抉择"
 oe_kr2.1.desc:0 "鸭绿江畔霖雨连绵、粮道阻绝，右军都统使李成桂于义州威化岛陈兵上书，直言“以小逆大”与暑雨远征皆不可行，麾下精锐正待回师开京整顿朝纲。"
 oe_kr2.1.a:0 "拥护李成桂回师整顿军政"
 oe_kr2.1.b:0 "在开京宫廷折冲调停"
 oe_kr2.2.title:0 "朝鲜开国与汉阳新都肇建"
 oe_kr2.2.desc:0 "新朝既立，重臣郑道传主张迁都汉江北岸的汉阳（南京）以据八道之中枢，并借科田法清查豪强田籍、确立六曹文官制度；开京旧商则恳请保留松都繁华商栈。"
 oe_kr2.2.a:0 "营建汉阳新都并推行科田法"
 oe_kr2.2.b:0 "兼顾开京松商行会与汉江漕运"
 oe_kr2.3.title:0 "世宗集贤殿与浑天仪、测雨器"
 oe_kr2.3.desc:0 "景福宫集贤殿群英荟萃，巧匠蒋英实相继制成简仪浑天仪、水运自击漏与铜制测雨器，令朝鲜得以独立推算七政历法并精准观测全国雨量。"
 oe_kr2.3.a:0 "拨银兴建观象台与皇家历算署"
 oe_kr2.3.b:0 "将测雨器与《农事直说》推广至八道农田"
 oe_kr2.4.title:0 "《训民正音》颁行与铜活字印书"
 oe_kr2.4.desc:0 "二十八字母科学摹拟唇舌喉齿发声，愚民旬日可通而百姓不再苦于诉讼文盲。然而老臣崔万里上疏力陈废旧文之忧，朝廷须定夺谚文推行力度。"
 oe_kr2.4.a:0 "以铜活字广印谚文律令医书惠及万民"
 oe_kr2.4.b:0 "采取汉谚对照典籍循序渐进"
 oe_kr2.5.title:0 "文宗神机箭与火车型炮试射"
 oe_kr2.5.desc:0 "军器监改良双轮火车型炮，一车百孔齐发神机箭，呼啸之声裂石穿云。边将请求立即大规模列装火车型炮，或先增筑鸭绿、图们两江四郡六镇石堡。"
 oe_kr2.5.a:0 "批量列装神机箭火车型炮营"
 oe_kr2.5.b:0 "优先加筑四郡六镇北方连环边堡"
 oe_kr2.6.title:0 "戊午士祸：勋旧与士林初起冲突"
 oe_kr2.6.desc:0 "一部史草掀起朝堂惊涛！把持议政府高位的勋旧重臣与出身乡里书院、执掌三司清议的士林新锐针锋相对，稍有不慎便酿成流血士祸。"
 oe_kr2.6.a:0 "保护士林言官清议与三司监察"
 oe_kr2.6.b:0 "倚重勋旧元老收束朝廷纲纪"
 oe_kr2.7.title:0 "己卯士祸与赵光祖乡约新政"
 oe_kr2.7.desc:0 "青年儒臣赵光祖倡行贤良科、革除滥封功臣并推广农村互助《乡约》，锐意革新触动既得勋贵利益，宫墙内外谣言四起、风云突变。"
 oe_kr2.7.a:0 "保留乡约自治以固地方民心"
 oe_kr2.7.b:0 "以温和妥协止息士祸流血"
 oe_kr2.8.title:0 "东西分党与备边司军政之争"
 oe_kr2.8.desc:0 "围绕吏曹铨郎任命，士林分裂为东人、西人两大朋党，朝议日趋党同伐异。然海峡对岸烽烟将起、北疆女真亦日渐强盛，识者疾呼以备边司超然统兵备战。"
 oe_kr2.8.a:0 "强化超党派备边司巡查水陆要塞"
 oe_kr2.8.b:0 "委任主导派系集中六曹实权"
 oe_kr2.9.title:0 "闲山岛大捷：李舜臣与龟船鹤翼阵"
 oe_kr2.9.desc:0 "巨济岛外海浪涛翻涌！全罗左水使李舜臣诱敌入闲山岛开阔海域，先以覆铁刺甲板的龟船直捣敌舰中枢，再挥令板屋船张开鹤翼阵交叉炮击，一举粉碎敌军海上补给线！"
 oe_kr2.9.a:0 "敕封三道水军并全面扩建龟船精锐舰队"
 oe_kr2.9.b:0 "扩建三南造船林场与海防粮仓"
 oe_kr2.10.title:0 "幸州大捷：神机箭火车型炮破敌"
 oe_kr2.10.desc:0 "汉江北岸幸州山城土栅单薄，全罗巡察使权栗率军民与僧兵死守险坡。敌军七轮猛攻之际，城头数十架火车型炮齐发万支神机箭，火雨蔽空焚毁攻城梯阵，创下陆战奇迹！"
 oe_kr2.10.a:0 "将火车型炮与山地炮阵编为全国守城定式"
 oe_kr2.10.b:0 "嘉奖八道义兵与西山护国僧军"
 oe_kr2.11.title:0 "鸣梁奇迹：臣尚有战船十二艘"
 oe_kr2.11.desc:0 "水师骤遭重创后朝廷议撤水军并入陆师，复出挂帅的李舜臣疾书奏曰：“今臣战船，尚有十二！”于鸣梁海峡急流漩涡中以一当十，怒涛铁炮再破百余战船！"
 oe_kr2.11.a:0 "以鸣梁战魂铸就东亚无敌海防屏障"
 oe_kr2.11.b:0 "深化水陆联军协同巩固长远盟谊"
 oe_kr2.12.title:0 "战后重建与大同法税制革新"
 oe_kr2.12.desc:0 "大战过后田园荒芜，各地苛杂土贡压得自耕农喘息不得。领议政李元翼力推《大同法》，改按田亩面积统一征收米布，既抑豪强防纳之弊又兴商业市场。"
 oe_kr2.12.a:0 "于京畿及三南力行大同统一税法"
 oe_kr2.12.b:0 "扶植贡人特许商团活跃全国市廛"
 oe_kr2.13.title:0 "丙子胡乱：南汉山城冬夜围城"
