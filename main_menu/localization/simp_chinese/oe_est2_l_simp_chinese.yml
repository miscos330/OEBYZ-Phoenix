 oe_est2_priv_per_qizilbash_oymaq_hosts_desc:0 "确认土库曼与高原部落酋长的牧地封邑与部落私军编制，赋予极高的轻骑兵战力与陆军士气，但会拖累行省繁荣度并削弱中央控制。"
