 oe_est2_priv_per_caravanserai_silk_syndicate_desc:0 "依托王室加固驿馆体系向长途生丝与地毯商团颁授商路特许，提振商贸收益与手工业产出，但免税让利会引起保守教士阶层的非议。"
 oe_est2_priv_ind_mansabdar_jagir_contingents:0 "曼萨布达尔与扎吉尔骑兵额"
 oe_est2_priv_ind_mansabdar_jagir_contingents_desc:0 "向贵族将领授出扎吉尔采邑以换取常备私属重骑兵额与随军辎重，显著提升人力与补给上限，但会分散朝廷直属税源与王权。"
