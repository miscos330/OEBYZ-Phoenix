 # --- 16 Visible Events (oe_est2.1 .. oe_est2.16) ---
 oe_est2.1.title:0 "豪强私兵啸聚成军"
 oe_est2.1.desc:0 "趁着朝局承压与税赋吃紧，各地实权豪强擅自在家堡武装私属家丁并树起私旗。大批私兵骑队在王师营寨之外集结示威，逼迫朝廷在强征入役、重金妥协与下诏缴械之间做出抉择。"
 oe_est2.1.a:0 "强征豪强私军编入王师序列"
 oe_est2.1.b:0 "拨付赐金缔结家臣私军妥协契约"
 oe_est2.1.c:0 "颁下王诏强令解散未动员私兵"
 oe_est2.2.title:0 "守护大名家臣团武装对峙"
 oe_est2.2.desc:0 "诸国守护代与国人武士以禄米欠发、领地朱印未明为由，在关隘集结私属武士家臣团。是将这支家臣武装纳入幕府正军，还是重金安抚并收缴私兵，将直接决定中央对诸国的驾驭力。"
 oe_est2.2.a:0 "追认家臣团安堵状并补发禄米"
 oe_est2.2.b:0 "收缴越权私军并重申幕府军法"
 oe_est2.3.title:0 "波雅尔亲兵与哥萨克边军"
 oe_est2.3.desc:0 "在南方草原边疆与大河渡口，大波雅尔亲兵骑队与自治哥萨克军团自行编组了私属骑兵分队。他们要求朝廷先行兑现银饷与粮秣补给，方肯奉诏出征。"
 oe_est2.3.a:0 "拨付银饷与火药稳固边疆骑军"
 oe_est2.3.b:0 "强令边疆私军编入朝廷服役名册"
 oe_est2.4.title:0 "将领埃米尔与部落军阀逼宫"
 oe_est2.4.desc:0 "世袭卫戍埃米尔与部落骑兵首领全副武装齐聚王城之外，要求朝廷撤销派往行省采邑与牧地的清税御史。他们的私军骑队已在宫门外鞍马齐备，气氛剑拔弩张。"
 oe_est2.4.a:0 "赐予荣袍与采邑赏银安抚诸将"
 oe_est2.4.b:0 "勒令解散私兵并坚持清查行省账目"
 oe_est2.5.title:0 "杯酒释兵权宫廷大宴"
 oe_est2.5.desc:0 "灯火通明的宫廷大宴上，君主举杯与手握重兵的元勋宿将促膝长谈：愿以良田美宅、优厚俸禄与世代荣宠相赠，只求诸位解甲交出私军兵权，让全国武备归一于朝廷。"
 oe_est2.5.a:0 "厚赐养老田禄，和平解散全部私兵"
 oe_est2.5.b:0 "暂留宿将兵权以充边防常备后盾"
 oe_est2.6.title:0 "佩鲁齐、巴尔迪与阿奇亚约利银号"
 oe_est2.6.desc:0 "来自佛罗伦萨佩鲁齐、巴尔迪与阿奇亚约利三大银号的掌柜携盖印信贷账簿造访国库。他们愿以关税与羊毛厘金为担保提供优惠王室贷款，并恳请朝廷护持其驻外商馆与汇兑业务。"
 oe_est2.6.a:0 "签署优惠银号贷款契约并注资商馆"
 oe_est2.6.b:0 "审慎限权，仅准许常规汇兑结算"
 oe_est2.7.title:0 "美第奇家族与汇票清算网"
 oe_est2.7.desc:0 "以美第奇银号为代表的新一代大金融家族完善了复式记账与跨国汇票清算体系。若在海关与国库承认其清算票据，我方不仅能以远低于市价的利率融资，还能吸引巨额商贸活水注入市民阶层。"
 oe_est2.7.a:0 "特许美第奇汇票清算并开立低息额度"
 oe_est2.7.b:0 "鼓励本国铸币流通，暂不新增债务"
 oe_est2.8.title:0 "富格尔家族帝国信贷与银矿抵押"
 oe_est2.8.desc:0 "奥格斯堡的富格尔银号提出以白银与铜矿长期开采特许为抵押，为我方外交与军事雄心提供巨额信贷担保。其雄厚金库足以在帝国竞选与大战补给中一锤定音。"
 oe_est2.8.a:0 "以矿税收益抵押换取富格尔巨额授信"
 oe_est2.8.b:0 "坚守王室矿山专营权，拒绝抵押"
 oe_est2.9.title:0 "晋商票号与法纳尔汇兑银号"
 oe_est2.9.desc:0 "在横跨欧亚的大陆帝国间——从汇通天下税银的晋商票号，到串联君士坦丁堡、开罗与伊斯法罕的法纳尔与萨拉夫银号——民间汇兑网络已能比武装运银车队更迅捷安全地完成万里划拨。"
 oe_est2.9.a:0 "特许票号与大银号承接各省税银汇兑"
 oe_est2.9.b:0 "坚持官库直运实银并加征商号执照费"
 oe_est2.10.title:0 "主权违约危机与清算所恐慌"
 oe_est2.10.desc:0 "连年战费拖欠与汇票过度签发引发了大银号挤兑风潮。储户云集清算大厅要求兑付足色金银，债主联名上书警告：若朝廷贸然无序违约，半数商号与汇兑网络将随之崩塌。"
 oe_est2.10.a:0 "由阶层银团展期重组国债以稳市心"
 oe_est2.10.b:0 "强行宣布主权削债以缓解国库急难"
 oe_est2.11.title:0 "银号纾困还是查抄金库"
 oe_est2.11.desc:0 "因域外君主赖账违约，两家枢纽大银号濒临倒闭清算。御前会议分为两派：一派主张由国库充当最后贷款人出手纾困以护持金融信誉，另一派主张趁势查抄其残存金库以补军饷。"
 oe_est2.11.a:0 "国库注资纾困，稳固金融信用根基"
 oe_est2.11.b:0 "查抄银号金库，收缴现银充作军费"
 oe_est2.12.title:0 "汉萨商馆宪章与北海集散港"
 oe_est2.12.desc:0 "汉萨同盟各港商馆长老联名请愿，希望续签北海与波罗的海港口的加固货栈、船坞与冬春粮运契约。确认商馆宪章可大力兴盛海运商贸与护航后勤，而改由王室直征海峡船税则可立收关税现银。"
 oe_est2.12.a:0 "续签汉萨商馆集散宪章与护航粮站"
 oe_est2.12.b:0 "改由朝廷直征海峡关税与港务船钞"
 oe_est2.13.title:0 "海上商业同盟与银号护航队"
 oe_est2.13.desc:0 "海盗劫掠与冬春风暴频频阻断海外商馆间的金银与粮食航线。跨国银号与海上同盟提议共筹海运保险与护航基金，常备护航战船并为各处建筑商站提供抗荒补给缓冲。"
 oe_est2.13.a:0 "合资组建武装护航船队并充实商站储备"
 oe_est2.13.b:0 "开征战时护航保险税充实国库"
 oe_est2.14.title:0 "室町守护大名与领国粮秣调拨"
 oe_est2.14.desc:0 "众多室町名门武家仍依托分散于诸国的家督馆舍、关津与京都邸宅施政，尚未连成整片实土领国。打通乡间庄园与都市馆舍间的石高禄米运道，方能确保守护家族在严冬荒年安然存续。"
 oe_est2.14.a:0 "保障诸家石高禄米与馆舍粮站调拨"
 oe_est2.14.b:0 "将余粮集中归入京都幕府官仓统筹"
 oe_est2.15.title:0 "石高禄米与城下町粮仓体系"
 oe_est2.15.desc:0 "随着列岛战事规模日趋宏大，供养大军足轻与武士已非临时征发所能应付。堺港与大坂豪商提议发行流通米票以银换粮，而宿将则力主在城下町深挖广积战备常平仓。"
 oe_est2.15.a:0 "依托堺港与大坂米商推行石高米票汇兑"
 oe_est2.15.b:0 "广建城下町战备常平粮仓以固根本"
 oe_est2.16.title:0 "从馆舍家族到战国领国大名"
 oe_est2.16.desc:0 "昔日依托分散馆舍与官职维系的守护家族，如今已蜕变为拥有城下町、宿场驿道与严整兵粮体系的战国实土领国。面对新时代，我方须抉择是以家臣私兵扩充战力，还是以严密检地清丈确立一统财政。"
 oe_est2.16.a:0 "整编家臣私军旗本以备争霸大战"
 oe_est2.16.b:0 "推行全领检地清丈以固兵粮财赋"
