 oe_est2_dec_disarm_private_regiments.desc:0 "设宫廷大宴款待手握重兵的豪强、部落与边防统帅，以优厚赐金与荣衔换取其和平交出并解散所有未动员的阶层私兵。"
 oe_est2_dec_disarm_private_regiments.a:0 "举杯定约，解甲归朝"
 oe_est2_dec_disarm_private_regiments_tt:0 "解散贵族、部落与哥萨克阶层全部未动员私军，向相关阶层拨付退隐赐金，并获得持续25年的 #Y 杯酒释兵权和解新制#! 修正。"
