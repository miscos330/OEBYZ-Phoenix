 oe_est2_priv_jpn_shugo_retainer_bands:0 "守护大名家臣团私兵"
 oe_est2_priv_jpn_shugo_retainer_bands_desc:0 "承认各地守护大名与武家蓄养世袭家臣团私军，显著提升步兵战力、军纪与征召规模，但会导致幕府中央控制力与直辖王权外流。"
 oe_est2_priv_jpn_koku_rice_stipend_brokers:0 "藏屋敷米商汇兑"
 oe_est2_priv_jpn_koku_rice_stipend_brokers_desc:0 "委任堺港与大坂藏屋敷米商办理石高折银与粮仓调运，有效提升粮食储备上限与购粮效率并压低利率，但会引起负债武士阶层的不满。"
 oe_est2_priv_tur_timariot_sipahi_fiefs:0 "行省蒂玛尔西帕希采邑"
 oe_est2_priv_tur_timariot_sipahi_fiefs_desc:0 "确认行省西帕希骑兵享有蒂玛尔采邑税权与随从私兵编制，显著增强骑兵战力并降低陆军维护压力，但会分流国库直征现金税收。"
 oe_est2_priv_tur_phanariot_sarraf_credit:0 "萨拉夫与法纳尔包税银号"
 oe_est2_priv_tur_phanariot_sarraf_credit_desc:0 "授权帝国萨拉夫钱商与法纳尔豪商承办包税垫资与地中海汇兑信贷，扩大国债承载与外交声誉，但会带来温和通胀与基层农户怨言。"
 oe_est2_priv_rus_boyar_pomestye_druzhina:0 "波雅尔与封地骑兵征召"
 oe_est2_priv_rus_boyar_pomestye_druzhina_desc:0 "授权领主波雅尔与服役贵族依托农奴庄园蓄养亲兵骑队并随时应召，扩充人力池与轻骑兵实力，但会强化农奴制并拖慢思潮传播。"
 oe_est2_priv_rus_stroganov_frontier_charter:0 "斯特罗加诺夫边疆盐皮特许"
 oe_est2_priv_rus_stroganov_frontier_charter_desc:0 "向边疆巨商家族授予盐场、矿冶与毛皮商路特许经营权，加速原料产出与工程兴建，但会降低市民阶层可征税率上限与王权份额。"
 oe_est2_priv_weu_medici_fugger_bills:0 "汇票清算与大银号特许"
 oe_est2_priv_weu_medici_fugger_bills_desc:0 "承认跨国大银号合伙契约与集市汇票清算特权，大幅压低王室借贷与公债利率并扩张举债上限，但会助长财阀寡头对王权的掣肘。"
 oe_est2_priv_weu_reichsritter_private_banners:0 "帝国骑士与大领主私军团"
 oe_est2_priv_weu_reichsritter_private_banners_desc:0 "保障大领主与帝国自由骑士在私堡蓄养重甲骑兵分队的特权，显著增强重骑兵战力与陆军士气，但会削弱国家控制上限与税收效率。"
 oe_est2_priv_weu_hanseatic_kontor_staple:0 "汉萨商馆与海运集散特权"
 oe_est2_priv_weu_hanseatic_kontor_staple_desc:0 "向海上商业同盟授予自治商馆与转口集散特权，大幅提升制海存在感、造船速度与海运商力，但会略微削弱王室对自治港市的直接管辖。"
