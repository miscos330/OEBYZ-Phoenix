l_simp_chinese: 
#=====================================
#oe_flavor_byz
#=====================================

oe_flavor_byz.1.t: "迷梦飘散"
oe_flavor_byz.1.d: "《奥斯曼之梦》创作于奥斯曼一世建立公国后。史诗通过奥斯曼在艾德巴利家中经历的月轮入胸、巨树覆天、四河奔涌等梦境意象，预言了帝国疆域将覆盖高加索、阿特拉斯、托罗斯、巴尔干四座山脉及底格里斯河、幼发拉底河、多瑙河、尼罗河四条河流，教长艾德巴利将梦境解读为#R 征服世界的预兆#!。但在东罗马帝国的强势打击下，奥斯曼之梦已然飘散。"
oe_flavor_byz.1.a: "可笑的梦想"

oe_flavor_byz.2.t: "鸢尾花飘落"
oe_flavor_byz.2.d: "站在巴黎的城头，即使是以文化著称的罗马人也不由得惊叹法兰西人的创造力，他们在罗马人离开的一千年里继续辛勤耕耘这片土地，并创造出了许多伟大的城市和艺术品。让我们接过他们的工作，让这片古老而繁荣的土地继续辉煌"
oe_flavor_byz.2.a: "漫步于塞纳河畔"

oe_flavor_byz.3.t: "玫瑰王国"
oe_flavor_byz.3.d: "保加利亚盛产玫瑰，其起源可以追溯到公元前4世纪，当时的古希腊人将玫瑰视为神圣的花朵，保加利亚地区因其独特的气候和土壤条件，成为了种植玫瑰的理想之地。今年，玫瑰谷的鲜花依旧盛开，只是赏花人已换了模样"
oe_flavor_byz.3.a: "玫瑰献于征服者"

oe_flavor_byz.4.t: "群山的宝藏"
oe_flavor_byz.4.d: "在塞尔维亚，白银流向的变化是权威更迭后最先发生的，在一个普通的下午，一小队罗马骑兵闯进科索沃最大的银矿矿场，在寥寥数分钟的交涉后，这里的矿产便归巴西琉斯所有，并开始为塞萨洛尼基的铸币厂提供银矿"
oe_flavor_byz.4.a: "白银必须流动"

oe_flavor_byz.5.t: "夺还雅典"
oe_flavor_byz.5.d: "雅典公国的现任主人来自于一群背信弃义的佣兵团，他们受东罗马皇帝所托登上东方的土地，所作所为却尽是烧杀掳掠的苟且之事。当我们终于无法忍受后，他们选择在罗马的领土上四处肆虐，最后击败了当时的雅典公爵，窃据雅典。"
oe_flavor_byz.5.a: "让加泰罗尼亚人滚蛋"

oe_flavor_byz.6.t: "胜利之城"
oe_flavor_byz.6.d: "自20年代，帝国在亚细亚的领土因突厥人的大举迁徙而全面衰退之际，菲拉德尔斐亚便陷入了敌人的全面包围之中。在安纳托利亚的黑暗年代里，菲拉德尔斐亚就像一座灯塔于突厥人的汪洋大海中傲然挺立，始终保持着对帝国的忠诚。如今，随着帝国重新击退突厥人，我们终于可以在这座城市中欢庆胜利。"
oe_flavor_byz.6.a: "永不陷落！"

oe_flavor_byz.200.t: "东方贸易淡出历史舞台"
oe_flavor_byz.200.d: "随着欧洲人发现了绕过好望角，前往印度的航线，地中海香料贸易的垄断地位因此破产，在可以遇见的将来，香料贸易将逐渐淡出历史舞台"
oe_flavor_byz.200.a: "此起彼伏，自然兴替"

oe_flavor_byz.201.t: "拜占庭丝绸产业的兴盛"
oe_flavor_byz.201.d: "拜占庭丝绸使用高质量的桑蚕丝，织物细腻坚韧。其中以 “皇家紫” 最为著名：从地中海骨螺提取的紫色染料极其昂贵，象征皇权与神圣，法令规定仅皇室成员可使用紫色丝绸。曾经的拜占庭丝绸常作为外交礼物赠予外国君主或教会，用以巩固联盟。查理曼大帝加冕就曾收到拜占庭紫色丝绸。在地中海的转运贸易中，名贵的拜占庭丝绸也一度成为重要商品。帝国繁荣的丝绸产业随着十字军攻陷1204年之劫而直转急下，如今随着小亚细亚的光复，我们终于有机会着手恢复丝绸产业的荣光"
oe_flavor_byz.201.a: "发扬我们的优势产业"
oe_flavor_byz.201.tt: "我们将在君士坦丁波利斯获得一个永久的地点修正"

oe_flavor_byz.202.t: "修缮圣索菲亚大教堂"
oe_flavor_byz.202.d: "圣索菲亚大教堂，我们最骄傲的旷世杰作，如今已经年久失修，君士坦丁堡牧首向我们提出了一个建议，请求主持一个浩大的修缮工程，以便让圣索菲亚大教堂回到全盛姿态。"
oe_flavor_byz.202.a: "大教堂代表着永恒帝国"
oe_flavor_byz.202.b: "永恒帝国代表着大教堂"

oe_flavor_byz.301.t: "拜占庭新年"
oe_flavor_byz.301.d: "拜占庭新年沿袭自古罗马的「财政年度」开端，这一制度由君士坦丁大帝确立，用于征税和行政纪年。9月1日标志着一年的行政与农业周期的开始。随着东罗马帝国的基督化，这一日期被赋予宗教意义。公元462年起，9月1日被正式定为教会礼仪年的起点，象征“上帝创造的完美秩序”，根据拜占庭传统，9月1日被视作世界创造之日。直至18世纪，东正教地区仍沿用此历法计算年份。"
oe_flavor_byz.301.a: "普天同庆"
oe_flavor_byz.301.b: "别来打扰我"
oe_flavor_byz.301_b_tt: "不会再收到新年事件，但是效果依旧会触发"

oe_flavor_byz.400.t: "西西里陷入混乱"
oe_flavor_byz.400.d: "费德里科三世是一位强势且统治长久的君主，他的去世留下了一个巨大的权力真空。他的继承人彼得罗二世体弱多病，缺乏其父的威望和能力，无法有效驾驭国内强大的贵族势力。王国大权迅速落入几个大家族（奇亚拉蒙特家族、文蒂米利亚家族、佩拉约家族等）组成的寡头集团手中。"
oe_flavor_byz.400.a: "让我们看看雅典的佣兵们还有什么戏唱"

oe_flavor_byz.401.t: "那不勒斯继承危机"
oe_flavor_byz.401.d: "“智者”罗伯特一世没有留下众望所归的继承人，[GetCountry('NAP').GetGovernment.GetRuler.GetName]饱受争议的继承权引发了无数安茹亲族的争抢，毫无疑问，那不勒斯即将深陷继承战争泥潭，无暇东顾。"
oe_flavor_byz.401.a: "通知摩里亚亲王"

oe_flavor_byz.402.t: "进军阿提卡"
oe_flavor_byz.402.d: "雅典是希腊文明的智慧中心，我们绝不会放过任何一个夺回她的机会。随着西西里王国因继承人危机陷入混乱，雅典公国的加泰罗尼亚佣兵们失去了他们的庇护人，我们清理这群杂碎的机会来临了。"
oe_flavor_byz.402.a: "恩怨清账"
oe_flavor_byz.402.b: "杜尚和威尼斯是我们的心腹大患，我们不能冒险"

oe_flavor_byz.403.t: "普世牧首去世"
oe_flavor_byz.403.d: "我们的普世牧首[target.GetName]去世了，在举行了隆重的葬礼后，巴西琉斯应当选择新的普世牧首继续主持君士坦丁普世牧首区"
oe_flavor_byz.403.a: "选择来自君士坦丁堡教会的德高望重的修士"
oe_flavor_byz.403.b: "选择来自内阁的[target_character.GetName]"
oe_flavor_byz.403.c: "选择来自阿索斯山的虔诚修士"

oe_flavor_byz.500.t: "皇帝病重！"
oe_flavor_byz.500.d: "一场突如其来的中风击倒了我们的皇帝[GetCountry('BYZ').GetGovernment.GetRuler.GetName]，他现在卧病在床，几乎神志不清。御医与神职人员整天守在皇帝身边，宫廷与教堂的达官显贵们整日为皇帝的健康祈祷。但皇帝的情况似乎未见好转，我们只能将希望寄托于上帝"
oe_flavor_byz.500.a: "整个帝国屏息凝神"

oe_flavor_byz.501.t: "遗嘱"
oe_flavor_byz.501.d: "皇帝已经卧床不起了整整两周，这天下午，皇帝的精神忽然为之一振，原先梦呓般的呢喃变成了清晰的命令，侍卫们立刻召集[GetCountry('BBY').GetGovernment.GetRuler.GetName]和[GetCountry('BAP').GetGovernment.GetRuler.GetName]等帝国的显要人物依次进入皇帝的房间。面对多年的老朋友，皇帝清晰无误地表达了自己的决定："
oe_flavor_byz.501.a: "皇帝承诺[GetCountry('BBY').GetGovernment.GetRuler.GetName]为帝国摄政"
oe_flavor_byz.501.b: "皇帝要求[GetCountry('BBY').GetGovernment.GetRuler.GetName]服从中央"

oe_flavor_byz.502.t: "临终时刻"
oe_flavor_byz.502.d: "公元1341年6月15日，拜占庭皇帝[GetCharacter('byz_andronikos_iii_palaiologos').GetName]在君士坦丁堡的皇宫中安然去世，他的离世标志着帝国秩序稍有恢复的安德洛尼卡三世时期的结束，一个新的时代开始了。所有人将目光移向君士坦丁堡，约翰五世年仅九岁，争夺摄政权力将是帝国接下来的焦点,一个由安娜皇太后，普世牧首约翰十四世·卡莱卡斯与海军大元帅阿波罗考寇斯组成的摄政集团已经成立，目的是阻止身份显赫的[GetCountry('BBY').GetGovernment.GetRuler.GetName]成为摄政王"
oe_flavor_byz.502.a: "来不及为逝者而哀悼......"

oe_flavor_byz.503.t: "摄政集团退缩"
oe_flavor_byz.503.d: "尽管对坎塔库泽诺斯心存厌恶，但摄政集团已经无人可用，他们最终作出了明智的妥协，在达成协议后，坎塔库泽诺斯被承认为约翰五世的监护人以及帝国的摄政王，首都街头巷尾的阴影里已经流传起这是否是又一个新的拜占庭王朝的开端"
oe_flavor_byz.503.a: "我，坎塔库泽诺斯，在此宣誓......"

oe_flavor_byz.504.t: "坎塔库泽诺斯交出军权"
 oe_flavor_byz.504.d: "摄政集团巩固了首都的统治，要求坎塔库泽诺斯退出帝国中央军的指挥。为了避免内战，他接受了这一安排，但其家族庄园、家兵与豪族身份得以保留。帝国的妥协结束了眼前的争端，并未抹去坎塔库泽诺斯家族。"
oe_flavor_byz.504.a: "正统永继"

oe_flavor_byz.505.t: "两约翰内战"
oe_flavor_byz.505.d: "坎塔库泽诺斯在色雷斯处理军务期间，摄政集团清洗了首都的坎氏派系，双方的不信任因此达到高峰，任何谈判均以破裂告终。9月，摄政集团正式宣布坎塔库泽诺斯为#bold #R 国家公敌#!#!，坎塔库泽诺斯别无选择，唯有发动内战作为回应。10月21日，他在色雷斯的迪迪莫蒂洪被自己的军队拥立为皇帝，即约翰六世"
oe_flavor_byz.505.a: "兵强马壮者为巴西琉斯"

oe_flavor_byz.506.t: "一个终结巴列奥略王朝的机会？"
oe_flavor_byz.506.d: "随着坎塔库泽诺斯登上共治皇帝的大位，开始掌握帝国的最高权力，一个终结巴列奥略王朝的可能性已经出现了，而这全取决于坎塔库泽诺斯的想法"
oe_flavor_byz.506.a: "我们不寻求颠覆巴列奥略王朝"
oe_flavor_byz.506.b: "王朝更替自有定数"

oe_flavor_byz.600.t: "坎塔库泽诺斯去世"
oe_flavor_byz.600.d: "坎塔库泽诺斯担任过安德洛尼卡三世的首相，负责制定内外政策，主持帝国海军的造船计划，也曾率军与塞尔维亚人和伊庇鲁斯人作战，取得大小战果无数，他还是一位精力充沛的文学作家，撰写了许多作品流传于后世。人们对坎塔库泽诺斯之死的反应是复杂的，有人视他为能够挽救帝国的英雄，也有人视他为争权夺利的卑鄙小人，但无论如何，我们应当以一个权贵应有的体面去隆重安葬他。"
oe_flavor_byz.600.a: "往事随风"

oe_flavor_byz.700.t: "征服埃及"
oe_flavor_byz.700.d: "在我们给予马穆鲁克以沉重打击，并席卷埃及以后，马穆鲁克政权彻底崩溃了，并不得不将它们的核心区域，黎凡特和埃及拱手相让。埃及曾是罗马收入最高的行省之一，如今她依然是一片富饶之地，可以为我们提供巨额的财富——假如那些穆斯林没有意见的话"
oe_flavor_byz.700.a: "纳入帝国的行政体系，由总督治理"
oe_flavor_byz.700.b: "我们找到了托勒密的后人！"
oe_flavor_byz.700_b_tt: "此为未施工的彩蛋路线，敬请期待"

oe_flavor_byz.701.t: "属国已转化为行省化附庸"
oe_flavor_byz.701.d: "历经多年锲而不舍的敕令整顿、官吏互派与财税稽核，这座属国昔日盘根错节的自治特权已被层层削弱。如今其司法、征兵与税赋账册皆已纳入帝国中枢规制，不再只是松散羁縻的藩邦，而是正式转化为受陛下严密节制的行省化附庸。"
oe_flavor_byz.701.a: "很好"

oe_flavor_byz.800.t: "难度调节"
oe_flavor_byz.800.d: "调节安纳托利亚突厥人政权的强度"
oe_flavor_byz.800.a: "蛮夷又有何过人之处"
oe_flavor_byz.800.b: "放马过来"
oe_flavor_byz.800.c: "艰难苦战"

oe_flavor_byz.900.t: "佩列斯拉夫尔会议"
oe_flavor_byz.900.d: "[GetCountry('MOS').GetGovernment.GetRuler.GetName]在佩列斯拉夫尔召开王公会议，商讨反抗蒙古人，打破鞑靼枷锁的独立大业。我们的特使受邀参加了这一会议，会议上，弗拉基米尔大公希望东罗马能够和罗斯人协同作战，对此，特使的回复是："
oe_flavor_byz.900.a: "罗马是所有正教徒的守护者！"
oe_flavor_byz.900.b: "罗斯人的命运与我们无关"

oe_flavor_byz_900_tt: "我们和罗斯人将于一个月后同金帐汗国开战（请确保执行战争条约：顿河会师，以开启罗斯教会后续内容。）"
oe_flavor_byz.901.t: "蒙古人集结军队"
oe_flavor_byz.901.d: "莫斯科大公国在佩列斯拉夫尔会议后正式扣留了蒙古人派来征收额外贡赋的使臣，这一在蒙古人眼中大逆不道的行径立刻引起了战争。现在金帐汗国已经开始召集忠于自己的各个游牧部族，全面冲突已无法避免"
oe_flavor_byz.901.a: "打碎枷锁"

oe_flavor_byz.902.t: "[GetCharacter('mos_ivan_i_danilovich_kalita_rurikovich').GetName]去世"
oe_flavor_byz.902.d: "被称为“钱袋子”的[GetCharacter('mos_ivan_i_danilovich_kalita_rurikovich').GetName]去世。在他统治生涯中，莫斯科先是利用蒙古人的力量镇压了特维尔公国的反蒙起义，赢得了大汗的信任。之后再利用代收全俄贡赋的特权，进行了残酷的财富积累，并用这些钱大量购买周边公国的村落和土地，一跃成为了全体东北罗斯人的领袖。"
oe_flavor_byz.902.a: "有意思，让我们向莫斯科派几位常驻外交大使"
oe_flavor_byz.902.b: "无聊的琐事"

#奥斯曼事件组
oe_flavor_byz.1000.t: "奥斯曼家族的命运"
 oe_flavor_byz.1000.d: "奥斯曼贝伊的旗帜终于降下。昔日的统治者与族人失去了赖以立足的国家，如今已被带到帝国境内，等候皇帝裁决。有人主张将这支家族留在君士坦丁堡，以礼相待而严加看管，借他们安抚故地；也有人认为，唯有驱逐，才能让这段旧怨真正结束。"
oe_flavor_byz.1000.a: "以礼相待，但是必须迁往君士坦丁堡严格监视起来"
oe_flavor_byz.1000.b: "将他们驱逐出境"
 oe_flavor_byz.1000.a.tt: "奥斯曼家族迁入东罗马，在君士坦丁堡受监护居住。#Y 三年后#!将发生“奥斯曼家族的皈依”事件。"

oe_flavor_byz.10000.t: "我的天"
oe_flavor_byz.10000.d: "你是怎么"
oe_flavor_byz.10000.a: "找到这里的？"

#=====================================
#phoenix_nirvana
#=====================================

phoenix_nirvana.1.title: "安德洛尼卡三世时期"
phoenix_nirvana.1.desc: "安德洛尼卡三世统治时期是拜占庭彻底滑向深渊前的最后余晖，在[ROOT.GetCountry.GetGovernment.GetRuler.GetName]的统治下，帝国正规军得到一定重建，重组了帝国海军并夺回了如希俄斯岛等一些海上领土。他在推翻自己祖父的统治后，着力于恢复帝国秩序，并推行了一些行政改革和经济措施。但帝国领土的持续丢失，突厥人与塞尔维亚人的崛起，帝国财政的枯竭与内战的阴影始终如同达摩克里斯之剑般高悬于帝国头顶。"
phoenix_nirvana.1.a: "愿上帝保佑罗马"

rome_reconquista.2.t: "复兴狂热减1"

phoenix_nirvana.100.title: "进军安纳托利亚"
phoenix_nirvana.100.desc: "[ShowRegionName('anatolia_region')]是东方希腊化的核心地区，帝国最坚强的支柱，这里曾是我们最重要的兵源地，并为帝国提供了源源不绝的粮食，畜牧，矿产，我们绝不能将这里拱手让给突厥人，我们必须夺回这块决定帝国生死存亡的基石"
phoenix_nirvana.100.a: "以上帝之名！"

phoenix_nirvana.101.title: "奋战巴尔干"
phoenix_nirvana.101.desc: "[ShowRegionName('balkan_region')]是帝国统治时间最长的地区之一，这里曾被认为是稳固后方，现在却充满了富有野心的东正教王国和信仰异端的拉丁公国，我们的军队将会狠狠痛击他们，以免他们忘记了是谁统治了这里长达一千年。"
phoenix_nirvana.101.a: "集结军队！"

phoenix_nirvana.102.title: "征服塞尔维亚"
phoenix_nirvana.102.desc: "塞尔维亚长期以来都被视为一个简单的边疆麻烦制造者，但如果我们完全对其放任不管，或许她会在明智的君主带领下成长为一个强权，让我们对塞尔维亚发起一次军事远征，提醒一下谁是他们土地古老的主人"
phoenix_nirvana.102.a: "饮马多瑙河"

phoenix_nirvana.103.title: "征服保加利亚"
phoenix_nirvana.103.desc: "自5世纪以来，斯拉夫人不断地入侵多瑙河南岸的我国土地，并多次独立建国。为了保证北方的安全，我国必须收复保加利亚，尽管保加利亚人仍保留了他们祖先彪悍的作战风格，但帝国在历史上依然多次成功征服保加利亚，这次也不会意外"
phoenix_nirvana.103.a: "我们是巴西尔二世的后人"

phoenix_nirvana.200.title: "进军阿尔塔"
phoenix_nirvana.200.desc: "1330年代，伊庇鲁斯统治者约翰·奥尔西尼（John.Orsini）去世后，其子尼基弗鲁斯二世奥尔西尼年幼，国内爆发贵族内讧。拜占庭趁机通过支持亲拜占庭派贵族，削弱伊庇鲁斯统治者的权威。1337至1338年，安德洛尼卡三世亲自率军进入伊庇鲁斯，围攻其首府阿尔塔。由于伊庇鲁斯内部混乱且缺乏外援，抵抗迅速崩溃。1338年初：阿尔塔投降，拜占庭军队占领伊庇鲁斯全境，伊庇鲁斯专制国正式并入拜占庭帝国，成为帝国的一个行省。"
phoenix_nirvana.200.a: "废黜尼基弗鲁斯二世，任命总督"

phoenix_nirvana.300.title: "地方官员的任免" 
phoenix_nirvana.300.desc: "理论上，#bold #color_yellow 拜占庭皇室#!#!完全保留了任免地方官员的权力，但随着中央控制力的不断衰弱，地方官员的任免已经实际上成为了当地总督和行政高官的权力，他们可以自由决定官员的任免，中央只能起到事后追认的作用。现在让我们重申我们#bold 古老且神圣的权利#!，所有#bold #P 总督#!#!必须从我们提供的名单里选择官员的任命，并且不能随意开除官员。"
phoenix_nirvana.300.a: "人选必须由君士坦丁堡提供！"
phoenix_nirvana.300.b: "还是继续让总督从当地选人吧"

phoenix_nirvana.301.t: "清查豪强的不法行径"
phoenix_nirvana.301.d: "尽管普罗尼亚制度规定了豪强对领地农民的人身控制权，但这并不代表他们可以将帝国法律视若无物，对属下的农民为所欲为，或是蔑视中央权威。我们将派出特别临时法官前往各地，聆听农民诉求，审查冤案，并打击一批行事最出格的地方豪强以杀鸡儆猴。"
phoenix_nirvana.301.a: "严格执法！"
phoenix_nirvana.301.b: "帝国需要依靠这些地方豪族，还是走个过场吧"

phoenix_nirvana.302.t: "厘清赋税"
phoenix_nirvana.302.d: "没人喜欢交税，尤其是那些手里有钱的乡下地主和各级官员们，他们好像把自己的全部智慧都投入到了避税活动中，隐瞒田亩，贪墨税收对他们而言已经是家常便饭。皇帝已经下令成立一个调查委员会，负责层层核查帝国层层税收的瞒报现象，我们预计会严厉打击一些大奸大恶之徒，以震慑所有小偷小摸之人。"
phoenix_nirvana.302.a: "法律无情，我们铁面无私"
phoenix_nirvana.302.b: "不能受制于法条，我们会放过对我们忠诚的势力"

phoenix_nirvana.303.t: "朝令夕改"
phoenix_nirvana.303.d: "我们对于破坏我们权威的地方豪族和阳奉阴违的各级官僚作出了太多#R 让步#!，导致我们对恢复地方控制的全部努力都化为了形式。在可预见的将来，帝国的地方形势将继续如#R 一潭死水#!继续堕落，直到新的征服者到来。"
phoenix_nirvana.303.a: "就这样吧"

phoenix_nirvana.304.t: "乡村恢复控制"
phoenix_nirvana.304.d: "在贯穿13世纪的军事失败和内部分裂的深渊前，帝国在乡村的控制力曾一度跌落谷底，我们富饶的乡村变成了地方豪族无法无天的世界以及#R 密谋叛乱者#!的温床。在[ROOT.GetCountry.GetGovernment.GetRulerTitle]的英明领导下，我们已经遏制住了这种衰败的势头，并一定程度上改善了形势"
phoenix_nirvana.304.a: "我们将继续前进"

phoenix_nirvana.305.t: "中央权威归来"
phoenix_nirvana.305.d: "在贯穿13世纪的军事失败和内部分裂的深渊前，帝国在乡村的控制力曾一度跌落谷底，我们富饶的乡村变成了地方豪族无法无天的世界以及#R 密谋叛乱者#!的温床。在我们一系列有力的中央集权措施打击下，这种现象终于得到了收敛，[ROOT.GetCountry.GetGovernment.GetRuler.GetName]已经宣布，帝国在农村的局势恶化已经得到了扭转，并将不断好转。"
phoenix_nirvana.305.a: "扭转乾坤"

phoenix_nirvana.400.t: "普罗尼亚的未来"
phoenix_nirvana.400.d: "运转失能的普罗尼亚制度是我国的一大顽疾，随着帝国的核心区域重归于安全，我们必须对这一混乱的制度进行必要的改革。我们可以选择继续加强普罗尼亚的采邑化特征，并在不过度损害中央集权的情况下形成有益自治，由监管得当的军事份地供养的军事贵族们将成为我们军队的中坚力量。或者，我们可以让普罗尼亚头衔化，普罗尼亚制度将脱离它原本的含义，变成一整套地方行政制度的代名词，我们将系统性地控制地方的关键权力，并推进中央集权"
phoenix_nirvana.400.a: "普罗尼亚制度已经证明了它行之有效"
phoenix_nirvana.400.b: "唯有中央集权的国家机器才能拯救罗马"
phoenix_nirvana_400_tt: "解锁法律：#bold #G 拜占庭官僚#!#!"

phoenix_nirvana.506.t: "投资军备"
phoenix_nirvana.506.d: "雇佣军从来不是一股可靠的力量，他们不仅常常劫掠经过的任何领土，甚至还会背叛我们，占城为王。因此我们必须要投入资金重建一支可靠而强大的陆军"
phoenix_nirvana.506.a: "征召更多贵族军官"
phoenix_nirvana.506.b: "命令官僚采购装备"
phoenix_nirvana.506.c: "提升军饷"
phoenix_nirvana_506_a_tt: "增加1点阶级对立，增加2点武勋势力"
phoenix_nirvana_506_b_tt: "增加1点阶级对立，增加2点官僚势力"
phoenix_nirvana_506_c_tt: "减少1点阶级对立"

phoenix_nirvana.507.t: "重建军队"
phoenix_nirvana.507.d: "罗马人曾经拥有一支世界上最强大的陆军之一，从诡计多端的汉尼拔到野蛮残暴的阿提拉，多少宣称自己战无不胜的入侵者倒在了罗马人及其盟军的韧性下。尽管我们经历了可怕的衰落，但是我们在坚持不懈的战斗中，再次逐渐跟上了战神阿瑞斯的脚步，我们将在命运女神的垂青下夺回失去的土地，重建罗马人的家园"
phoenix_nirvana.507.a: "高举鹰旗"
phoenix_nirvana_507_tt: "我们将移除[ShowGovernmentReformName('oe_byz_lose_army')]，并添加[ShowGovernmentReformName('oe_byz_rebuild_army')]"

phoenix_nirvana.600.t: "重掌土地"
phoenix_nirvana.600.d.a: "自治的农民公社与拥有土地的自耕农构成了东罗马帝国统治的根基，他们受到帝国法律与行政制度的直接保护，以确保土地不会被地主豪强明目张胆地夺走。得到土地的农民们热烈拥护巴西琉斯的统治并构成了我国的优质兵源"
phoenix_nirvana.600.d.b: "来自大地主阶层的军事贵族是我国巴西琉斯完全无法忽视的存在，税收，军队和土地都是他们的囊中之物。我们确信巴西琉斯作为地主阶级的利益代表会与军事贵族们合作愉快，他们受过的良好教育与丰富的军事素养将成为帝国手中的利剑"
phoenix_nirvana.600.a: "皇权独尊"

phoenix_nirvana.1000.t: "塞尔维亚劫掠我国边境"
phoenix_nirvana.1000.d: "在斯特凡·杜尚的默许下，塞尔维亚边境的军事领主们劫掠了两国的交界地带的[target_location.GetName]，由于我国在[target_location.GetName]缺乏足够数量的卫兵巡逻，敌人心满意足地将我们的村庄劫掠一番，并烧成灰烬"
phoenix_nirvana.1000.a: "我们应当在当地修建[ShowBuildingTypeName('castle')]以阻止塞尔维亚人的劫掠"

phoenix_nirvana.1001.t: "杜尚挑起边境争端"
phoenix_nirvana.1001.d: "斯特凡·杜尚是一个野心勃勃的危险人物，眼光总是盯着我国富饶的土地不放。杜尚在[target_location.GetName]又挑起了一场新的边境冲突，一场小规模冲突给我们的当地军队造成了一定伤亡。"
phoenix_nirvana.1001.a: "该死"

#=====================================
#john_war
#=====================================

john_war.1.t: "拜占庭式的宫廷阴谋"
john_war.1.d: "安德洛尼卡三世与坎塔库泽诺斯亲密无间的友谊为他赢得了皇位与军事贵族的支持，但是为了有效统治帝国，他又必须依靠君士坦丁波利斯的职业官僚，普世牧首区的牧首，各行各业的商业行会来保证帝国的财源与运转。于是，拜占庭宫廷正隐约处于这样一种对立的危险中，一边是权势滔天，被安德洛尼卡三世完全信任的权臣坎塔库泽斯，他由在军事力量上占主导地位的军事贵族们支持，一边是安德洛尼卡三世的长子，约翰五世，众望所归的正统帝国继承人，他预计能得到大部分不满坎塔库泽诺斯的帝国正统机构与阶层的支持。当然，皇帝本人对这种危险不屑一顾，一方面是他完全信任自己的朋友不会做出谋害继承人的举动，另一方面，他正值#R 壮年#!，又有什么可担忧的呢。"
john_war.1.a: "至少目前所有人都忠于[GetCountry('BYZ').GetGovernment.GetRuler.GetName]"

john_war.2.t: "巴拉姆公开抨击静修主义"
john_war.2.d: "在一次教会活动中，[GetCharacter('byz_barlaam_of_seminara').GetName]在布道环节公开指责静修派修士的实践是“巫术”，并认为他们声称看到的“神光”只能是受造的符号，而非神本身的能量。他认为人无法直接参与或体验神的本质。"
john_war.2.a: "说得对！"
john_war.2.b: "迷途的羔羊..."

john_war.3.t: "静修派反击巴拉姆"
john_war.3.d: "面对巴拉姆及其支持者理性派的质疑，静修派的领袖人物[GetCharacter('byz_gregory_palamas').GetName]运用“本质-能量”区分来辩护：神的本质是绝对不可知、不可参与的；但神的能量（如恩典、荣耀、光）是非受造的、真实的神本身向世界的流露，人可以与之结合。这关乎人能否真正“神化”以及神与世界沟通的方式。"
john_war.3.a: "说得对！"
john_war.3.b: "迷途的羔羊..."

john_war.4.t: "市民同情静修派"
john_war.4.d: "由于朴素的民族主义情绪与基层教士布道的影响，我们的市民阶层对静修派充满了同情，常常在多个场合表达对静修派的支持，甚至骚扰反对静修派的教士"
john_war.4.a: "我们支持他们"
john_war.4.b: "我们是上帝的牧羊人"

john_war.5.t: "理性派声援巴拉姆"
john_war.5.d: "君士坦丁波利斯知识界和教会高层中，许多受过古典哲学训练的神职人员（后来被称为“理性派”）都表示同情巴拉姆，如格列高利·阿金迪诺斯（宫廷修辞学教师）和尼基弗鲁斯·格里戈拉斯（著名学者），他们运用自己的影响力有力支持了巴拉姆的观点"
john_war.5.a: "这些人真是国之栋梁"
john_war.5.b: "这些人真是无法无天"

john_war.6.t: "静修派争论"
john_war.6.d: "静修主义是一种源于早期基督教的神秘主义修行方式，尤其在阿索斯山修士中盛行。其核心是通过重复“耶稣祷文”、控制呼吸等方式，使心灵达到纯净状态，最终见证“非受造之光”。这引起了来自卡拉布利亚的希腊裔修士，深受西方经院哲学影响的[GetCharacter('byz_barlaam_of_seminara').GetName]的反对，他撰写了一系列论著，抨击静修派的方法和神学，尤其嘲讽他们关于“非受造之光”的教义，导致在教士中引起了一场旷日持久的大辩论"
john_war.6.a: "何故喋喋不休..."

john_war.7.t: "《为静修圣徒辩》"
john_war.7.d: "为回应理性派的质疑，帕拉马斯迅速撰写《为静修圣徒辩》等作品进行反击。他系统阐述了“本质-能量”区分的神学，并将其建立在教父传统（特别是大巴西流、格里高利·纳齐安等卡帕多西亚教父）的基础上。"
john_war.7.a: "有道理..."

john_war.8.t: "1341年君士坦丁堡宗教会议"
john_war.8.d: "会议于1341年6月在圣索菲亚大教堂召开，由[ROOT.GetCountry.GetGovernment.GetRuler.GetName]与普世牧首主持。会议审查了双方的神学主张，并在辩论中开始。坎塔库泽诺斯本人同情静修派，而普世牧首卡莱卡斯则不经意间表达了支持巴拉姆的想法"
john_war.8.a: "皇帝采纳了坎塔库泽诺斯的意见"
john_war.8.b: "皇帝听取了卡莱卡斯的想法"
john_war_8_b_tt: "静修派领袖帕拉马斯将被迫退隐"

#=====================================
#empire_debt
#=====================================

empire_debt.1.t: "被边缘化的商业"
empire_debt.1.d: "东罗马帝国曾经是东西方贸易间最重要的桥梁国家，但随着我们陷入数个世纪的混乱与衰落，意大利的城邦商业国家，尤其是[GetCountry('GEN').GetName]和[GetCountry('VEN').GetName]已经后来居上，成为了东地中海贸易的两大巨头。而东罗马帝国则在一连串的内战与失败后，沦落为了只能收取些过路费的小角色，空看着东方贸易的巨额利润从黑海和黎凡特上滚滚流过。尤其是在[GetCharacter('byz_andronikos_ii_palaiologos').GetName]解散帝国海军后，我们与拉丁人在海面上的差距从未如此悬殊"
empire_debt.1.a: "我们该如何从衰退中恢复？"

empire_debt.100.t: "货币贬值"
empire_debt.100.d: "拜占庭货币曾经是风靡整个东地中海的硬通货，以稳定和高含金量而著称。显然，我们历史上良好的货币信用正在被我们无情地践踏，我们必须进一步降低铸币的含金量，以满足政府开支的需要"
empire_debt.100.a: "必要之恶"
empire_debt.100.tt: "#R 阶层特权海佩伦将贬值#!"

empire_debt.101.t: "回购货币"
empire_debt.101.d: "这注定是一项花销不菲的活动，但为了我国经济的长远利益，我们必须重新提高铸币的含金量并回购和重铸民众手中的劣币，以恢复我国神圣的名誉并保证我国对货币政策的掌控"
empire_debt.101.a: "以皇帝之名"
empire_debt.101.tt: "#G 阶层特权海佩伦将升值#!"

#=====================================
#rome_reconquista
#=====================================

rome_reconquista.1.t: "罗马再征服"
rome_reconquista.1.d: "东方的罗马国家始终将光复帝国版图视为自己的最高理想，随着东罗马内外为之一靖，她注定要踏上无数#bold #color_yellow 罗马先帝#!#!都走过的道路。在再征服的过程中，我们应该时刻关注$oe_byz_rr_rome_hope_var$，这代表了罗马从统治者到黎民对光复帝国版图这一叙事的认可程度，一旦$oe_byz_rr_rome_hope_var$归零，则罗马再征服局势将提前结束"
rome_reconquista.1.a: "鹰旗高扬！"

rome_reconquista.3.t: "再征服之梦破碎"
rome_reconquista.3.d: "经年累月的劳师远征已经耗尽了我们的耐心，整个东罗马，下到黎民百姓，上到紫室庙堂，已经不再对光复整个帝国版图抱有希望，转而开始专注开发余下的领土"
rome_reconquista.3.a: "折戟沉沙铁未销..."

rome_reconquista.4.t: "宣传光复罗马叙事"
rome_reconquista.4.d: "为了让民众心甘情愿地追随我们踏上复兴罗马的征途，我们必须通过宣传不断强化复兴罗马这一叙事，以让人们认同我们的理念"
rome_reconquista.4.a: "要求牧首区教育信众"
rome_reconquista.4.b: "要求官僚机构教育臣民"
rome_reconquista.4.c: "不过是浪费资源"

rome_reconquista.5.t: "罗马皇位的共和属性"
rome_reconquista.5.d: "东罗马帝国的政治中保留了大量来自罗马时代的共和属性，巴西琉斯，其职位理论上仍被视为“第一公民”。尽管拥有无上的权力，但巴西琉斯仍旧受到这种共和理念的挑战，如果皇帝犯下错误或不受支持，其被推翻是完全可以被接受的。"
rome_reconquista.5.a: "我们应强调罗马国家的传统"
rome_reconquista.5.b: "我们应强调对皇帝个人的忠诚"

rome_reconquista.6.t: "和平主义修士"
rome_reconquista.6.d: "不是所有人都支持我们对高卢，伊比利亚，甚至不列颠无止境地发动复兴战争，来自阿索斯山修道院的修士中，一位言论以和平主义和孤立主义特征而著称的修士已经在我国引起了一场社会运动，街头巷尾的人们都开始谈论和质疑光复古代罗马帝国的版图是否有必要"
rome_reconquista.6.a: "他是恶魔在人间的化身"
rome_reconquista.6.b: "将其驱逐至俄罗斯牧首区"
rome_reconquista.6.c: "有意思..."

rome_reconquista.7.t: "对异见者的压制"
rome_reconquista.7.d: "在我国的学术界与精英阶层中，对复兴罗马国策的批评之声屡见不鲜，甚至屡次上书要求巴西琉斯将资源用于造福本土而不是对外征战。鉴于类似言论已经甚嚣尘上，我们有必要采取一些行动"
rome_reconquista.7.a: "复兴罗马的正确性不容置疑"
rome_reconquista.7.b: "由他们说去吧"

rome_reconquista.200.t: "收复帝国故土"
rome_reconquista.200.d: "距离上一次东罗马大规模对意大利用兵几乎已经是巴西尔二世时期，之后随着帝国由盛转衰，从北方而来的诺曼冒险者卑鄙地从帝国掳走了南意大利。在帝国离开意大利的岁月里，拉丁异端窃据罗马，装模做样地指挥着西方的基督世界，更北方的意大利城邦们更是逐渐遗忘罗马统治的时代，只留下高大的水道桥标志着帝国曾经来过。"
rome_reconquista.200.a: "进军意大利"

rome_reconquista.201.t: "收复帝国故土"
rome_reconquista.201.d: "自第二次布匿战争以后，伊比利亚就被纳入了帝国治下。罗马人是伊比利亚最初的建设者，这里也是最早开始罗马化进程的行省之一。哪怕在经历了西哥特人，柏柏尔人，安达卢西亚人等一代代入侵者的统治后，半岛已然沧海桑田，不再是古典时代我们所熟知的模样，命运仍旧指引着我们回到这片光荣的土地，完成罗马归来的神圣使命"
rome_reconquista.201.a: "进军伊比利亚"

rome_reconquista.202.t: "收复帝国故土"
rome_reconquista.202.d: "自迦太基城在大火中沦陷，其周围被洒满盐分后，北非就再也没什么值得认真一战的对手，只剩下无尽的沙漠游牧民族与无耻的海盗。让我们消灭这群柏柏尔人与阿拉伯人的后代，终结我们之间的恩怨"
rome_reconquista.202.a: "进军阿非利加"

rome_reconquista.203.t: "收复帝国故土"
rome_reconquista.203.d: "这些岛民的舰队或许有两下子，但面对凯撒与克劳狄乌斯的后人，他们毫无胜算。我们会一个个拔除由诺曼，撒克逊或凯尔特贵族修建的石头城堡，重新建立一个罗马的不列颠行省"
rome_reconquista.203.a: "进军不列颠"

rome_reconquista.204.t: "收复帝国故土"
rome_reconquista.204.d: "这片土地曾经是罗马帝国治下的一部分，我们有神圣的义务收复这里。"
rome_reconquista.204.a: "收复失地"

rome_reconquista.205.t: "挑战基督之盾"
rome_reconquista.205.d: "自9世纪马扎尔人来到匈牙利，在其皈依拉丁异端后，匈牙利便成为了拉丁异端在东方最坚定的屏障，阻拦了包括斯拉夫人，蒙古人和我国在内的东方强权对西方世界的入侵。若想在进军西方世界时保证后方安全，匈牙利是我们必须征服的对象"
rome_reconquista.205.a: "中原北望气如山"

rome_reconquista.206.t: "燃烧鸢尾花"
rome_reconquista.206.d: "法兰克王国曾经只是罗马治下一个普通的附庸，不过是趁着我们的衰弱分到了几分遗产，便坐在他们可笑的城堡里洋洋自得，显然必须提醒一下他们的宗主是谁"
rome_reconquista.206.a: "相看白刃血纷纷，死节从来岂顾勋"

rome_reconquista.207.t: "埃及奴隶"
rome_reconquista.207.d: "“马穆鲁克”在阿拉伯语中一词愿意为“奴隶”，象征着他们的出身不过来自一群最卑微下贱的军事奴隶，他们因其卑鄙行径而夺取了埃及政权，窃据大宝，恣意妄为。让我们用火炮轰塌阿勒颇和大马士革的城墙，以惩罚他们犯上作乱之僭越"
rome_reconquista.207.a: "黑云压城城欲摧，甲光向日金鳞开"

rome_reconquista.300.t: "光复罗马"
rome_reconquista.300.d: "#Y 罗马，永恒之城，我们永远魂牵梦绕的城市。在将近一千年的漫长岁月里，我们就像忒修斯之船一样不断更换着罗马的组件，以在这个残酷的世界与无数强敌的挑战中生存下来，再次回到罗马城，我们的一切已经面目全非，但在图拉真铜柱下，即使是最坚强的老兵也忍不住流下了眼泪#!"
rome_reconquista.300.a: "帝国之伊始，重归吾手。"

rome_reconquista.301.t: "光复[target_location.GetName]"
rome_reconquista.301.d: "时间或许已经长到让当地居民完全忘记了帝国曾经在这里存在过的记忆，但我们却从未忘记。我们将重新掌握现在，并因此掌握了过去，与未来。"
rome_reconquista.301.a: "罗马归来"

rome_reconquista.310.t: "[target_location.GetName]庆祝"
rome_reconquista.310.d: "君士坦丁堡是我国统治时间最长的地点之一，让我们好好在君士坦丁堡庆祝一番"
rome_reconquista.310.a: "一日欢庆"

rome_reconquista.1000.t: "世界光复"
rome_reconquista.1000.d: "英格兰绿葱葱的原野上，牧羊人正赶着羊群往回走，他的生活似乎并没有因为罗马人的到来而变得与一千年前罗马人离去时有所不同，周围唯一能述说这段漫长时光的，只有丘陵上一道断断续续的残破石墙，以及不再叫埃利乌斯桥的地名。这里的人们可能需要再过上十到二十年，才能接受他们新的罗马身份。而可能要经过上百年，他们才会惊讶于一个伟大的故事，那是一个百折不饶的民族，她曾经战胜过汉尼拔，也因穆罕默德而折戟；她曾取尽世上一切之财富，亦堕入存亡之旦夕；她曾经丢失了永恒之城，甚至失去过世界渴望之城，但这个民族始终以惊人的韧性适应着瞬息万变的世界。时光能够隆起高山，降下深海，令不可一世的帝国覆灭，使卑微的无名者崛起，但它却没有征服这个民族的梦想，没有磨平这个民族的野心。当帝国的全部土地终于再次统一在一面旗帜下，我们终于可以告慰#color_yellow 罗马诸帝#!的在天之灵。"
rome_reconquista.1000.a: "从一城到世界"
rome_reconquista_1000_a_tt: "#Y 感谢您游玩本mod“凤凰计划”#!"

#=====================================
#D008_oe_fate_of_the_phoenix
#=====================================

oe_fate_of_the_phoenix.21.t: "风暴前夜"
oe_fate_of_the_phoenix.21.d: "#bold 随着帝国陷入停滞与虚弱，越来越多的帝国之敌开始蠢蠢欲动，步步紧逼，从巴尔干到亚细亚，从陆地边境到滨海小岛，他们会抓住一切机会从帝国所剩无几的财富中撕咬下自己的那份战利品，我们必须时刻做好准备，以免使罗马彻底陷入#R 万劫不复#!。#!"
oe_fate_of_the_phoenix.21.a: "收刀入鞘吧！凡动刀的，必死在刀下。"
oe_fate_of_the_phoenix.21.tt: "帝国之敌会持续袭扰我们的边境。我们可以通过授予阶层特权#Y 自治民兵#!来提高击退敌军袭扰的概率。与敌国交好、处于停战期或彻底消灭他们，均可阻止敌军袭扰。"

oe_fate_of_the_phoenix.22.t: "强大的权贵"
oe_fate_of_the_phoenix.22.d: "#bold 东罗马帝国的门阀政治和权贵腐化已经达到了无以复加的地步，皇帝或许不吝于与军事精英们分享权力与财富，但帝国中最强大的豪族势力已经膨胀到可以肆意发动内战，推倒皇权的地步，如果我们不能让他们有所收敛，帝国可能不久就将回到互相倾轧的内战中#!"
oe_fate_of_the_phoenix.22.a: "必须保证皇权的稳定与至尊"
oe_fate_of_the_phoenix.22.tt: "我们可以选择与贵族合作或者限制贵族的权力，贵族不满会在短期内削弱我们的正统性和军事能力，农民不满会打击我们的稳定性和经济能力"

oe_fate_of_the_phoenix.23.t: "商贾难行"
oe_fate_of_the_phoenix.23.d: "#bold 阻止地方财富流向君士坦丁堡不止有恼人的腐败权贵，还有流散在树林与山峦间的强盗群氓，他们主要来自于破产农民、流散士兵和边境游牧民。由于局势持续地动荡不安，这些人变得越来越多，他们抢劫道路上的商人，旅客甚至官员，给我们造成了很大麻烦。#!"
oe_fate_of_the_phoenix.23.a: "连绵不绝的战争留下的创口"
oe_fate_of_the_phoenix.23.tt: "强盗会严重影响农村地区的产出与控制力，我们需要派遣士兵下乡来平定局势"
 oe_fate_of_the_phoenix.200.t: "突厥加齐袭击边境"
 oe_fate_of_the_phoenix.200.d: "边境送来急报：来自[oe_raid_attacker.GetName]的加齐越过界线，在[target_location.GetName]附近夺走牲畜与粮食。村民躲进了围墙后面，守军却不足以同时看住田野和道路。若要恢复往来，朝廷需要拨出人手，在受袭的乡间维持巡逻。"
 oe_fate_of_the_phoenix.200.a: "暂且忍受这些损失。"
 oe_fate_of_the_phoenix.200.b: "派兵巡逻。"
 oe_fate_of_the_phoenix.200.c: "当地守军击退了袭击者！"
 oe_fate_of_the_phoenix.201.t: "塞尔维亚人侵犯边境"
 oe_fate_of_the_phoenix.201.d: "一支塞尔维亚武装越过边境，袭扰了[target_location.GetName]周围的乡村。逃来的农户请求官署保护尚未收割的田地，地方守军则请求增派巡逻人手。边界上的争执，已经成了帝国必须承担的一笔实际开支。"
 oe_fate_of_the_phoenix.201.a: "暂且忍受这些损失。"
 oe_fate_of_the_phoenix.201.b: "派兵巡逻。"
 oe_fate_of_the_phoenix.201.c: "当地守军击退了袭击者！"
 oe_fate_of_the_phoenix.203.t: "海盗劫掠海岸"
 oe_fate_of_the_phoenix.203.d: "海岸哨所报告，来历不明的船只在[target_location.GetName]附近登陆，劫走了货物和渔民的积蓄。船帆很快消失在海面上，沿岸道路却仍不安全。派出守军巡查港湾与村落，可以使这里早些恢复日常往来。"
 oe_fate_of_the_phoenix.203.a: "暂且忍受这些损失。"
 oe_fate_of_the_phoenix.203.b: "派兵巡逻。"
 oe_fate_of_the_phoenix.203.c: "当地守军击退了袭击者！"
 oe_fate_of_the_phoenix.204.t: "土匪泛滥"
 oe_fate_of_the_phoenix.204.d: "途经[target_location.GetName]的商旅接连遭到抢掠，农户也不再敢独自赶车上路。地方官请求派兵巡查道路，把匪徒赶出村庄附近的林地；若暂时放任，损失便只能由官署与乡民逐渐收拾。"
 oe_fate_of_the_phoenix.204.a: "暂且忍受这些损失。"
 oe_fate_of_the_phoenix.204.b: "派兵巡逻。"
 oe_fate_of_the_phoenix.204.c: "当地守军剿灭了匪徒！"

#=====================================
#mission
#=====================================

oe_byz_mission.1.t: "南部诸国"
oe_byz_mission.1.d: "希腊南部林林总总地分布着诸多拉丁公国，它们是拉丁人屡次背叛罗马人留下的成果，来自于不忠于帝国的佣兵团和拉丁帝国的遗产。拉丁人的战斗力不可小觑，但是他们在体量上完全不是我们的对手，阻止我们踏平南方的，是来自域外的西方大国，那不勒斯和西西里为这些拉丁公国提供了独立保障，如果发生战争，威尼斯和热那亚也会为他们提供支援"
oe_byz_mission.1.historical_info: "一些大国保障了南部诸国的独立，但这并不意味着他们会直接卷入和东罗马的全面战争，如果我们进攻雅典，[GetCountry('NAP').GetName],[GetCountry('SIC').GetName],[GetCountry('VEN').GetName]和[GetCountry('GEN').GetName]会组建一支远征军支援"
oe_byz_mission.1.a: "我们不应当鲁莽行事"

oe_byz_mission.2.t: "罗马会议"
oe_byz_mission.2.d.1: "一支由巴西琉斯亲自授权的外交使团抵达罗马，鉴于我们与教宗的关系还算不错，教宗同意召开一次会议，以避免东西方之间的冲突。会谈一开幕就陷入了僵局，那不勒斯和西西里人趾高气扬，耀武扬威，丝毫没有让步的意思；威尼斯人和热那亚人只想着扩大他们的经济特权，从帝国捞取更多利益，他们要价太高，以至于使团无法做出任何保证。最终，会谈在不愉快的气氛中落幕，没有达成任何正式协定"
oe_byz_mission.2.d.2: "一支由巴西琉斯亲自授权的外交使团抵达罗马，鉴于我们与教宗的关系还算不错，教宗同意召开一次会议，以避免东西方之间的冲突。会谈开幕的气氛略显僵硬，但很快谈判就找到了共识并开始持续推进。那不勒斯和西西里深陷继承危机之苦，无力与帝国陷入大规模战争，威尼斯和热那亚则专注于经济利益，最终，一些国家被说服并放弃了对南部诸国的独立保障"
oe_byz_mission.2.d.3: "一支由巴西琉斯亲自授权的外交使团抵达罗马，鉴于我们与教宗的关系还算不错，教宗同意召开一次会议，以避免东西方之间的冲突。会谈开幕的气氛非常友好，各国代表均尊重帝国的主权，谈判推进地十分迅速。会议在一片融洽的氛围中结束，雅典公国彻底陷入孤立无援的境地，希腊南部的政治格局即将发生变动"
oe_byz_mission.2.historical_info: "#Y 对我们好感度高于0的西方大国会出席罗马会议，并可能在教宗的斡旋下退出此事。与我们关系高于50的西方大国必然会退出#!"
oe_byz_mission.2.a: "没有任何国家同意停止与帝国的敌对"
oe_byz_mission.2.a.tt: "会谈毫无进展，许多国家甚至不屑于出席"
oe_byz_mission.2.b: "重要的外交成果"
oe_byz_mission.2.b.tt.1: "[GetCountry('NAP').GetName]已停止对南部诸国的独立保障"
oe_byz_mission.2.b.tt.2: "[GetCountry('SIC').GetName]已停止对南部诸国的独立保障"
oe_byz_mission.2.b.tt.3: "[GetCountry('GEN').GetName]已停止对南部诸国的独立保障"
oe_byz_mission.2.b.tt.4: "[GetCountry('VEN').GetName]已停止对南部诸国的独立保障"
oe_byz_mission.2.c: "载入史册的外交胜利！"
oe_byz_mission.2.c.tt: "所有国家均退出了对南部诸国的独立保障"

oe_byz_mission.3.t: "湛定伊庇鲁斯"
oe_byz_mission.3.d: "伊庇鲁斯大部分地区都放弃了抵抗，开始向驻扎在伊庇鲁斯的帝国军队及巴西琉斯宣布效忠，[GetCountry('BYZ').GetGovernment.GetRuler.GetName]拒绝了[GetCountry('EPI').GetGovernment.GetRuler.GetName]的将伊庇鲁斯继续作为附庸的建议，转而直接派东罗马官员接管各城镇，并在当地驻扎军队，将伊庇鲁斯彻底并入为一个帝国行省"
oe_byz_mission.3.historical_info: "1330年代，伊庇鲁斯统治者约翰·奥尔西尼（John.Orsini）去世后，其子尼基弗鲁斯二世奥尔西尼年幼，国内爆发贵族内讧。拜占庭趁机通过支持亲拜占庭派贵族，削弱伊庇鲁斯统治者的权威。1337至1338年，安德洛尼卡三世亲自率军进入伊庇鲁斯，围攻其首府阿尔塔。由于伊庇鲁斯内部混乱且缺乏外援，抵抗迅速崩溃。1338年初：阿尔塔投降，拜占庭军队占领伊庇鲁斯全境，伊庇鲁斯专制国正式并入拜占庭帝国，成为帝国的一个行省。"
oe_byz_mission.3.a: "征服伊庇鲁斯"
oe_byz_mission.3.b: "控制伊庇鲁斯"
oe_byz_mission.3.c: "整合伊庇鲁斯"

oe_byz_mission.4.t: "[GetCountry('EPI').GetGovernment.GetRuler.GetName]的命运"
oe_byz_mission.4.d: "伊庇鲁斯国内政局动荡，混乱不堪，士卒普遍缺乏抵抗意志，因此进军其首都阿尔塔的过程十分顺利。伊庇鲁斯的统治者，[GetCountry('EPI').GetGovernment.GetRuler.GetName]被我们俘获，现在我们可以决定他们及其家族的命运"
oe_byz_mission.4.a: "他们爱去哪去哪"
oe_byz_mission.4.b: "将他及其宗族接到君士坦丁堡保护起来"

oe_byz_mission.5.t: "伊庇鲁斯贵族的命运"
oe_byz_mission.5.d: "伊庇鲁斯的首都被占领，王室被擒获，在其统治者倒台后，伊庇鲁斯的贵族代表请求觐见皇帝，希望能在帝国在伊庇鲁斯建立的新秩序中分得一席之地。"
oe_byz_mission.5.a: "他们和其他人没什么两样"
oe_byz_mission.5.b: "也许我们应该拉拢这些精英"

oe_byz_mission.6.t: "帕特农神庙"
oe_byz_mission.6.d: "雅典卫城里最引人注目的就是缺乏修缮的帕特农神庙，已经有一些来自意大利的艺术家愿意竭尽全力帮我们修复这座古代神庙，他们将雕刻数座古希腊神祗的雕像陈列在神庙中，尽量复原其曾经的辉煌。教会对此表示了反对，普世牧首已经向巴西琉斯正式提出了抗议，认为神庙中应当陈列十字架和基督教马赛克"
oe_byz_mission.6.a: "我们还是尊重古希腊文化吧"
oe_byz_mission.6.b: "上帝的意志不容忽视"






































# Legacy EN/ZH parity additions
 oe_byz_system.4.a: "恢复秩序！"
 oe_byz_system.4.d: "东罗马官僚体制是东罗马帝国内部一套森严的等级制度。它脱胎于罗马帝国，并在东罗马时期经历了长足的发展与完善。这套官阶体系旨在统筹与掌控帝国的行政、军事与司法事务，以维系帝国的稳固与治理。东罗马官阶体制的核心在于向不同品级的官员授予明确的权责：这些官职由皇帝任命，并按官员的门第与才干分定品秩。这套等级森严的制度广泛施行于东罗马帝国的政署与军队之中。"
 oe_byz_system.4.t: "重建东罗马官僚体系"
 oe_flavor_byz.1.b: "我们此刻无力开罪教会"
 oe_flavor_byz.1.tt: "解锁牧首地位法律：东正教会"
 oe_flavor_byz.2.b: "独立于皇权的教会权力"
 oe_flavor_byz.2.tt: "解锁牧首地位法律：皇权与教权"
 oe_flavor_byz.3.b: "我们不能对抗教会的中流砥柱"
 oe_flavor_byz.3.tt: "解锁牧首地位法律：开明教会"
 oe_flavor_byz.5.b: "行之有效便已足够"
 oe_flavor_byz.5.tt: "解锁法律：普罗尼亚制度"
 oe_flavor_byz.6.b: "现行制度已然足够完善"
 oe_flavor_byz.6.tt: "解锁法律：改良普罗尼亚制度"
 oe_flavor_byz.7.a: "招募常备兵员"
 oe_flavor_byz.7.d: "收复小亚细亚这片重要兵源地之后，我们将逐步减少对外籍雇佣兵的依赖，重整中央常备军以保障帝国存续。"
 oe_flavor_byz.7.t: "重建中央常备军"
