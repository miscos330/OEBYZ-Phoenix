 oe_thh_cab_amber_monopoly:0 "波罗的海琥珀与谷物专营署"
 oe_thh_cab_amber_monopoly_desc:0 "授权骑士团大商官（Grossschaffer）统筹桑比亚琥珀皇室专卖与维斯瓦河谷物出口，全面提升贸易收入、税收效率与海贸效率，但会对私营港商满意度造成轻微挤压。"
 oe_thh_cab_amber_monopoly_action:0 "推行波罗的海琥珀与谷物专营署"
 oe_thh_cab_amber_monopoly_active:0 "正在推行：波罗的海琥珀与谷物专营署"
 oe_thh_cab_amber_monopoly_action_progress:0 "生效中"
 oe_thh_cab_amber_monopoly_action_progress_wordier:0 "波罗的海琥珀与谷物专营署（生效中）"
 oe_thh_cab_amber_monopoly_action_progress_tooltip:0 "授权骑士团大商官（Grossschaffer）统筹桑比亚琥珀皇室专卖与维斯瓦河谷物出口，全面提升贸易收入、税收效率与海贸效率，但会对私营港商满意度造成轻微挤压。"
 oe_thh_adv_age1_ritterbruder:0 "条顿骑士兄弟会重骑操典"
 oe_thh_adv_age1_ritterbruder_desc:0 "系统整饬条顿骑士兄弟会（Ritterbruder）在波罗的海平原的楔形冲锋与修道铁律，解锁第一时代条顿骑士兄弟重骑兵。"
 oe_thh_ritterbruder:0 "条顿骑士兄弟重骑兵"
 oe_thh_ritterbruder_desc:0 "第一时代身披白袍黑十字的重装条顿骑士兄弟，以严酷修道纪律与毁灭性长枪冲锋震慑波罗的海战局。"
 oe_thh_adv_age2_ordens_knechte:0 "玛丽堡骑士团精锐重步编练"
 oe_thh_adv_age2_ordens_knechte_desc:0 "将受薪职业重步兵与红砖堡垒守御阵型编入玛丽堡常备军体系，解锁文艺复兴时代玛丽堡骑士团重装步兵。"
 oe_thh_ordens_knechte:0 "玛丽堡骑士团重装步兵"
 oe_thh_ordens_knechte_desc:0 "文艺复兴时代于玛丽堡高墙下练就的骑士团重装步兵，擅以长戟重甲稳固战线并扼守红砖要塞。"
 oe_thh_adv_age3_black_cross_reiters:0 "黑十字手铳重骑战术"
 oe_thh_adv_age3_black_cross_reiters_desc:0 "为德意志与普鲁士骑士团骑兵换装转轮手铳与黑漆胸甲，融合火器齐射与白刃突击，解锁大航海时代黑十字重骑兵。"
 oe_thh_black_cross_reiters:0 "黑十字手铳重骑兵"
 oe_thh_black_cross_reiters_desc:0 "大航海时代由普鲁士与帝国诸辖区征募的黑甲手铳骑兵，兼具火器齐射与重骑冲锋之威。"
 oe_thh_adv_age4_baltic_grenadiers:0 "波罗的海要塞掷弹攻城操典"
 oe_thh_adv_age4_baltic_grenadiers_desc:0 "组建专精棱堡攻防与手榴弹突击的精锐重步兵连队，在维斯瓦与波罗的海要塞战中无往不利，解锁宗教改革时代波罗的海要塞掷弹兵。"
 oe_thh_baltic_grenadiers:0 "波罗的海要塞掷弹兵"
 oe_thh_baltic_grenadiers_desc:0 "宗教改革时代精于棱堡突袭与要塞死守的条顿掷弹精兵，火力与破城意志俱佳。"
 oe_thh_adv_age5_prussian_cuirassiers:0 "普鲁士骑士团胸甲骑兵制"
 oe_thh_adv_age5_prussian_cuirassiers_desc:0 "将骑士团铁律与绝对主义时代全速突击骑兵战术融为一体，解锁绝对主义时代普鲁士骑士团胸甲骑兵。"
 oe_thh_prussian_order_cuirassiers:0 "普鲁士骑士团胸甲骑兵"
 oe_thh_prussian_order_cuirassiers_desc:0 "绝对主义时代身着精钢胸甲与黑白罩袍的普鲁士骑士团重骑兵，以密集群阵全速冲锋摧毁敌军步阵。"
 oe_thh_adv_age6_imperial_guard:0 "帝国铁十字近卫步兵操典"
 oe_thh_adv_age6_imperial_guard_desc:0 "集五百年条顿与普鲁士军政操典之大成，以高射速线列火力与铁十字荣誉铸就革命时代帝国铁十字近卫步兵。"
 oe_thh_imperial_cross_guard:0 "帝国铁十字近卫步兵"
 oe_thh_imperial_cross_guard_desc:0 "革命时代巅峰近卫重步兵，融汇条顿骑士传统与近代普鲁士齐射军纪，铁十字旗下所向披靡。"
