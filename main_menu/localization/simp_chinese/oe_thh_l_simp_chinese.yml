# NEW 2026-11-23 v22.0 Module 2 Teutonic HRE Statecraft & Bailiwicks (oe_thh_, gen_v220_teu_hre_statecraft.py) — simp_chinese localization (250 keys). Edit gen_v220_teu_hre_statecraft.py, not this file.
 OTB1:0 "波希米亚大辖区"
 OTB1_ADJ:0 "波希米亚辖区"
 oe_thh_name_leo_von_dischingen:0 "莱奥·冯·迪申根"
 oe_thh_ballei_seat_1:0 "布拉格波希米亚大辖区驻节署"
 oe_thh_ballei_seat_1_desc:0 "条顿骑士团驻布拉格的波希米亚大辖区建筑型治所与骑士招募署，统筹波希米亚—摩拉维亚田产什一税并护送帝国十字军北上普鲁士，不分割波希米亚王冠领土。"
 OTB2:0 "奥地利大辖区"
 OTB2_ADJ:0 "奥地利辖区"
 oe_thh_name_ortolf_von_weisseneck:0 "奥托尔夫·冯·魏森埃克"
 oe_thh_ballei_seat_2:0 "维也纳奥地利大辖区总团署"
 oe_thh_ballei_seat_2_desc:0 "条顿骑士团设于维也纳圣伊丽莎白修院旁的奥地利大辖区建筑型治所，连结哈布斯堡多瑙河重镇与普鲁士前线军饷，同时保持奥地利公爵对维也纳的完整领有权。"
 OTB3:0 "勃兰登堡大辖区"
 OTB3_ADJ:0 "勃兰登堡辖区"
 oe_thh_name_dietrich_von_witzleben:0 "迪特里希·冯·维茨莱本"
 oe_thh_ballei_seat_3:0 "柏林勃兰登堡大辖区骑士署"
 oe_thh_ballei_seat_3_desc:0 "条顿骑士团设于勃兰登堡边区重镇柏林的建筑型大辖区驻军署，负责接引北德骑士团援军与易北—奥得河军需通道，领土仍完全归勃兰登堡选侯直辖。"
 OTB4:0 "法兰克尼亚—梅尔根特海姆总辖区"
 OTB4_ADJ:0 "梅尔根特海姆总辖"
 oe_thh_name_wolfram_von_nellenburg:0 "沃尔夫拉姆·冯·内伦堡"
 oe_thh_ballei_seat_4:0 "梅尔根特海姆德意志总团长官署"
 oe_thh_ballei_seat_4_desc:0 "德意志总团长（Deutschmeister）驻节于法兰克尼亚梅尔根特海姆的最高帝国辖区总署，统摄骑士团在神圣罗马帝国境内的全部庄园、法律特权与骑士征募网络。"
 OTB5:0 "莱茵兰—科隆大辖区"
 OTB5_ADJ:0 "莱茵兰辖区"
 oe_thh_name_heinrich_von_lonnig:0 "海因里希·冯·洛尼希"
 oe_thh_ballei_seat_5:0 "科隆莱茵兰大辖区直隶署"
 oe_thh_ballei_seat_5_desc:0 "直隶大团长的科布伦茨—莱茵兰大辖区设于科隆的建筑型驻节署，依托莱茵河商道、葡萄酒庄园与选侯主教宫廷为玛丽堡输送财赋与精锐贵族子弟。"
 oe_teu_ballei:0 "条顿骑士团帝国大辖区"
 oe_teu_ballei_desc:0 "条顿骑士团在神圣罗马帝国境内设立的建筑型大辖区（Ballei）。大辖区在驻节城市管理骑士团庄园、医院济贫院与骑士招募网络，不分割驻在国诸侯一寸土地；忠顺时可响应大团长征召协同作战。"
 LEAD_oe_teu_ballei:0 "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_teu_ballei:0 "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_teu_ballei_call_tt:0 "大辖区处于恭顺档位时，可应条顿大团长征调参与进攻战争。"
 oe_teu_ballei_defend_tt:0 "大辖区处于如常或恭顺档位时，将自动出兵协防条顿骑士团。"
 oe_thh_ballei_reform:0 "帝国大辖区长官体制"
 oe_thh_ballei_reform_desc:0 "神圣罗马帝国境内条顿骑士团大辖区长官（Landkomtur）的建筑型军政驻节体制，依托海外驻节署维系骑士招募、医院产业与重骑常备军。"
 STATIC_MODIFIER_NAME_oe_thh_seat_loyal_mod:0 "骑士团大辖区·忠顺协理"
 STATIC_MODIFIER_DESC_oe_thh_seat_loyal_mod:0 "驻节本城的条顿骑士团大辖区与玛丽堡中枢步调一致，修缮医院济贫设施并助益地方商序与守备。"
 STATIC_MODIFIER_NAME_oe_thh_seat_restive_mod:0 "骑士团大辖区·税讼摩擦"
 STATIC_MODIFIER_DESC_oe_thh_seat_restive_mod:0 "辖区地方长官与普鲁士总部在什一税与特权归属上龃龉不断，令治所周边秩序略有松弛。"
 STATIC_MODIFIER_NAME_oe_thh_ballei_compliant_mod:0 "条顿大辖区·奉命勤王"
 STATIC_MODIFIER_DESC_oe_thh_ballei_compliant_mod:0 "该大辖区谨遵大团长敕令，源源不断为东方十字军输送骑士新兵与军饷。"
 STATIC_MODIFIER_NAME_oe_thh_ballei_restive_mod:0 "条顿大辖区·本位观望"
 STATIC_MODIFIER_DESC_oe_thh_ballei_restive_mod:0 "地方长官偏重帝国本土产业而对玛丽堡军务响应迟缓，忠诚有所动摇。"
 STATIC_MODIFIER_NAME_oe_thh_mod_imperial_crusade_grant:0 "帝国十字军御赐军饷"
 STATIC_MODIFIER_DESC_oe_thh_mod_imperial_crusade_grant:0 "神圣罗马帝国皇帝颁诏批准的十字军军饷与德意志客籍骑士团源源涌入玛丽堡，振奋东方战线士气与重骑兵力，代价是更高的战备开销。"
 STATIC_MODIFIER_NAME_oe_thh_mod_emperor_crusade_patron:0 "东方十字军帝国护持者"
 STATIC_MODIFIER_DESC_oe_thh_mod_emperor_crusade_patron:0 "神圣罗马帝国皇帝慨然资助条顿骑士团讨伐东方异教与劲敌，在全基督教世界赢得崇高威望与外交尊荣。"
 STATIC_MODIFIER_NAME_oe_thh_mod_reichsschild_prince:0 "帝国东方之盾（帝国诸侯）"
 STATIC_MODIFIER_DESC_oe_thh_mod_reichsschild_prince:0 "条顿骑士团大团长正式以帝国诸侯（Reichsfurst）之尊融入神圣罗马帝国法统，执掌帝国东方屏障，奠定日后问鼎选侯与普鲁士—德意志帝国领导权之基石，唯须遵循帝国宪制略让独断王权。"
 STATIC_MODIFIER_NAME_oe_thh_mod_rimini_gross_ordensstaat:0 "里米尼独立诏书·神圣东方骑士帝国"
 STATIC_MODIFIER_DESC_oe_thh_mod_rimini_gross_ordensstaat:0 "大团长援引1226年《里米尼金玺诏书》宣告建立与神圣罗马皇帝平起平坐的独立主权东方骑士国，以严明军纪与强硬扩张立威，代价是招致外交孤立与沉重常备军费。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_ostsiedlung:0 "东向拓垦授田宪章"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_ostsiedlung:0 "大议会颁布《库尔姆法》拓垦宪章，广招德意志农工迁入普鲁士与波罗的海河谷，稳步推动人口繁衍、粮食丰收与地方发展。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_fortress_tithe:0 "波罗的海红砖要塞什一税"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_fortress_tithe:0 "大议会核准征收红砖城堡专项什一税，加固玛丽堡至梅梅尔的骑士城堡防线并严密地方控御。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_preussenreisen:0 "普鲁士远征常备军役"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_preussenreisen:0 "大议会统筹德意志诸辖区与本土骑士共赴冬季圣战远征，强化兵团补员速度、军功传统与人力储备，代价是更高的常备军费。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_amber_compact:0 "汉萨琥珀专卖协约"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_amber_compact:0 "大议会与汉萨商港厘定波罗的海琥珀与谷物出口专卖规程，令海贸利润与商人竞争力稳步攀升。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_hochmeister_charter:0 "大团长骑士团国章程"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_hochmeister_charter:0 "大议会确认大团长统辖普鲁士行省官僚与团国度支的最高章程，强化王室中枢权力、税效与内阁效率，略微约束世袭骑士贵族的自治特权。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_chapter_tithe:0 "骑士团礼拜堂免税特许"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_chapter_tithe:0 "确认各辖区礼拜堂与修院教产豁免以换取大议会教士赞成票，增进宗教威望并稳固教士向心力。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_baltic_mission:0 "波罗的海边疆主教宣教团"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_baltic_mission:0 "拨款扶持桑比亚与库尔兰传教主教团，加速对异教边民的宣教教化并凝聚正统信仰认同。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_ritter_stipend:0 "骑士兄弟战马禄米"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_ritter_stipend:0 "向服役重装骑士发放战马与甲胄补贴以换取贵族代表支持，提升重骑战力与贵族满意度。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_ordensburg_fief:0 "边疆红砖城堡镇守委任"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_ordensburg_fief:0 "向世家骑士授予边疆要塞镇守特许以赢取议案支持，增强要塞防卫而略让中枢集权。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_kulm_towns:0 "库尔姆法市镇自治重申"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_kulm_towns:0 "重申但泽、托伦与柯尼斯堡等库尔姆法市镇自治权，提振市民拥护与商贸营收。"
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_freihufe_grant:0 "自由农庄永业田契"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_freihufe_grant:0 "向普鲁士与德意志垦荒农户确认免役永业田契，换取大议会乡民支持并保障官仓丰稔。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_diet_subsidy:0 "帝国议会十字军拨款"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_diet_subsidy:0 "帝国议会诸侯联合拨付的军资与志愿骑士源源抵达东方前线，显著壮大骑士团兵源与士气。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_princes_favor:0 "琥珀赠礼·诸侯倾心"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_princes_favor:0 "精雕波罗的海琥珀圣物与礼器赢得德意志诸侯欢心，令骑士团外交声誉与诸大辖区忠诚齐升。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ostsiedlung_open:0 "大开边门·东向移民浪潮"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ostsiedlung_open:0 "骑士团免除新迁德意志工匠与农夫五年赋税，来自莱茵兰与法兰克尼亚的移民稳步迁入普鲁士城镇与河谷并加速阶层晋升。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ostsiedlung_vetted:0 "严审教义·有序垦殖"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ostsiedlung_vetted:0 "教区神甫与行会严格甄别东迁流民的信仰与手艺，虽人口增速较缓却令社会安靖、虔敬倍增。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ostsiedlung_frontier:0 "武装屯田·城堡边民"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ostsiedlung_frontier:0 "将避祸东来的德意志壮丁编入边疆骑士城堡周边屯田，既充实兵源又固守边境险隘。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_mergentheim_autonomy:0 "梅尔根特海姆自治委任"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_mergentheim_autonomy:0 "玛丽堡重申沃尔夫拉姆·冯·内伦堡在梅尔根特海姆的自治职权，换来德意志诸辖区源源不断的精锐兵源与忠诚。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_rhine_franconia_route:0 "美因—莱茵骑士商贸走廊"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_rhine_franconia_route:0 "梅尔根特海姆与科隆大辖区联手打通德意志内河粮酒与琥珀转运商路，令商税与辖区协作双丰收。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ehrentisch_knights:0 "玛丽堡荣誉宴席（Ehrentisch）"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ehrentisch_knights:0 "大团长在玛丽堡大食堂设宴款待途经布拉格与柏林北上的欧陆名门骑士，外交声誉、威望与军功传统响彻四海。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_rimini_imperial:0 "里米尼诏书·帝国护藩诠解"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_rimini_imperial:0 "法学家着重阐发1226年诏书中大团长作为神圣罗马帝国诸侯的尊贵身份，令德意志宫廷与诸辖区倍感亲近。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_rimini_sovereign:0 "里米尼诏书·独立主权诠解"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_rimini_sovereign:0 "玛丽堡史官强调普鲁士乃骑士团凭血战开辟的独立圣土，仅直隶教宗与上帝，激扬军威与中枢威权。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ballei_rebate:0 "五大辖区什一税宽免"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ballei_rebate:0 "玛丽堡司库给予五大帝国辖区五年什一税减免，虽略减眼前税额却换回空前的向心力与骑士征募。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_brick_castle_fund:0 "红砖要塞筑城专款"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_brick_castle_fund:0 "将奥地利与莱茵兰辖区的盈余精准投入维斯瓦河与涅曼河沿线红砖城堡，筑起坚固的波罗的海盾墙。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_generalkapitel_harmony:0 "玛丽堡大议会宪政和睦"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_generalkapitel_harmony:0 "大司铎、诸辖区长官与普鲁士市镇代表在玛丽堡达成宪政共识，大议会议事顺畅而各阶层和睦共济。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_hochmeister_authority:0 "大团长军政乾纲独断"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_hochmeister_authority:0 "大团长在大议会上确立战时军令与财政统揽大权，令骑士团士气昂扬、令行禁止，但也令普鲁士市民阶层心生戒惧。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_imperial_hospices:0 "维也纳—科隆骑士济贫院"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_imperial_hospices:0 "回归条顿骑士团“圣玛丽亚医院骑士”初心，扩建奥地利与莱茵兰济贫医馆，抗疫声望播于四方。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_amber_depots:0 "帝国驿道琥珀商栈网"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_amber_depots:0 "将维也纳与科隆辖区驿站扩充为波罗的海琥珀与精盐直营栈房，财源滚滚而市民欣悦。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_elector_ambition:0 "帝国选侯志业与日耳曼共主梦"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_elector_ambition:0 "以帝国东方之盾身份纵横莱茵与多瑙宫廷，向神圣罗马帝国选侯席位乃至普鲁士—德意志帝国统帅权稳步迈进。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_eastern_bulwark:0 "帝国东方铁壁防线"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_eastern_bulwark:0 "将帝国诸侯的军政授权倾注于波罗的海要塞与常备戍军，使东方边疆固若金汤。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_eastward_crusade:0 "神圣东方骑士帝国东征令"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_eastward_crusade:0 "在黑十字与帝国黑鹰圣旗下颁布东征总动员令，骑士团将士破城摧坚、锐不可当。"
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_sovereign_code:0 "波罗的海骑士帝国主权法典"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_sovereign_code:0 "将《库尔姆法》与《里米尼金玺诏书》熔铸为统一的独立帝国大法典，令财政、行政与中枢威权焕然一新。"
 oe_thh_crusade_foe_tt:0 "当前正与异教、东正教、伊斯兰或草原游牧国家交战"
 oe_thh_crusade_grant_cd_tt:0 "近十年内未曾向神圣罗马帝国皇帝申请十字军御赐军饷"
 oe_thh_not_rimini_path_tt:0 "尚未选择《里米尼独立诏书·神圣东方骑士帝国》路线"
 oe_thh_not_reichsschild_path_tt:0 "尚未选择《帝国东方之盾（Reichsschild）》路线"
 oe_thh_dec_imperial_crusade_grant.title:0 "奏请帝国皇帝颁赐十字军军饷"
 oe_thh_dec_imperial_crusade_grant.desc:0 "趁条顿骑士团正与东方异教、东正教、伊斯兰或草原强敌血战之际，自玛丽堡遣使奏请神圣罗马帝国皇帝颁赐十字军军饷。皇帝将由此赢得威望、宗教声誉与外交尊荣，骑士团则获得德意志客籍骑士军费、充沛兵源与为期#Y 5#!年的战力加持。"
 oe_thh_dec_imperial_crusade_grant.a:0 "遣使入觐神圣罗马皇廷"
 oe_thh_dec_imperial_crusade_grant_tt:0 "获得十字军客籍军饷、#G +0.75#!年人力、#Y 5 年#!《帝国十字军御赐军饷》并提升诸大辖区忠诚；神圣罗马皇帝同步获得威望与《东方十字军帝国护持者》加成。"
 oe_thh_dec_reichsschild_path.title:0 "路线一：《帝国东方之盾（Reichsschild）》"
 oe_thh_dec_reichsschild_path.desc:0 "确立条顿骑士团大团长作为神圣罗马帝国诸侯（Reichsfurst）与「帝国东方之盾」的法统定位：正式融入神圣罗马帝国体系、全面巩固五大德意志大辖区忠诚、大幅拓展帝国外交与选侯志业，为日后平稳迈向普鲁士—德意志帝国领导权铺平道路。与《里米尼独立诏书》路线互斥。"
 oe_thh_dec_reichsschild_path.a:0 "受封帝国诸侯，誓作东方之盾"
 oe_thh_dec_reichsschild_path_tt:0 "加入#Y 神圣罗马帝国#!，获得永久修正《帝国东方之盾（帝国诸侯）》，五大辖区忠诚#G +15#!，增进皇帝威望并触发受封大典事件。"
 oe_thh_dec_rimini_independence.title:0 "路线二：《里米尼独立诏书·神圣东方骑士帝国》"
 oe_thh_dec_rimini_independence.desc:0 "援引腓特烈二世于1226年颁赐的《里米尼金玺诏书》，断然宣告建立与神圣罗马皇帝平起平坐的独立主权东方骑士帝国（Gross-Ordensstaat）！脱离帝国法权掣肘、晋升王国级以上尊号，以铁血军纪与强悍征伐锋芒全力东进。与《帝国东方之盾》路线互斥。"
 oe_thh_dec_rimini_independence.a:0 "奉《里米尼金玺诏书》，建独立东方骑士帝国"
 oe_thh_dec_rimini_independence_tt:0 "宣告脱离神圣罗马帝国法权辖制，将国家等级至少提升至#Y 王国#!，获得永久修正《里米尼独立诏书·神圣东方骑士帝国》并触发加冕宣告事件。"
 oe_thh_dec_convene_generalkapitel.title:0 "诏开条顿骑士团大议会"
 oe_thh_dec_convene_generalkapitel.desc:0 "召集大司铎、大元帅、帝国诸大辖区长官与《库尔姆法》自治市镇代表齐聚玛丽堡大食堂，正式确立「条顿骑士团大议会（Generalkapitel）」为常设议政制度，以铁血军纪与多阶层协力共治东方圣土。"
 oe_thh_dec_convene_generalkapitel.a:0 "于玛丽堡大食堂启开大议会"
 oe_thh_generalkapitel_refresh_tt:0 "确立#Y 条顿骑士团大议会（Generalkapitel）#!议会制度。若在暂停状态下切换议会类型，各阶层的议案列表将在下一个月初自动刷新。"
 oe_thh.1.t:0 "帝国议会的东方十字军拨款"
 oe_thh.1.d:0 "在神圣罗马帝国诸侯与选侯云集的帝国议会上，来自玛丽堡的使节慷慨陈词，历数条顿骑士团在波罗的海雪原上捍卫基督教边疆的苦战。心怀圣战热忱的帝国重臣提议通过正式十字军拨款，另有使臣建议以精雕桑比亚琥珀圣物厚赠诸侯以广结善缘。"
 oe_thh.1.a:0 "奏请帝国皇帝与议会立即拨付十字军军饷与兵源"
 oe_thh.1.b:0 "向德意志诸侯与五大辖区颁赐琥珀珍礼以固邦交"
 oe_thh.1.c:0 "婉拒帝国恩赈，彰显玛丽堡自立自强之威仪"
 oe_thh.2.t:0 "帝国乱世与黑死病后的德意志东向移民潮"
 oe_thh.2.d:0 "肆虐德意志西部的瘟疫、诸侯私战与灾荒，正驱使大批法兰克尼亚织工、莱茵兰葡萄农与萨克森自耕农扶老携幼东迁，投奔秩序井然的条顿骑士团领地。大医院长力主依《库尔姆法》大开边门广纳移民，保守派司铎则呼吁严审教义与行会出身以防流弊。"
 oe_thh.2.a:0 "依《库尔姆法》大开边门，广纳德意志移民与熟练工匠"
 oe_thh.2.b:0 "严审来者天主教信仰与行会资历，稳妥有序安置"
 oe_thh.2.c:0 "将东迁壮丁编入边疆红砖骑士城堡周边实行武装屯田"
 oe_thh.3.t:0 "梅尔根特海姆德意志总团长密奏"
 oe_thh.3.d:0 "坐镇法兰克尼亚梅尔根特海姆的德意志总团长沃尔夫拉姆·冯·内伦堡发回密奏：在帝国境内各大辖区悉心经营下，大批骑士新血与田庄租银业已齐备；但他也恳切建言，唯有尊重梅尔根特海姆与莱茵兰辖区的自治传统，方能令帝国腹地财源与兵源绵延不绝。"
 oe_thh.3.a:0 "重申梅尔根特海姆自治特权，换取德意志辖区忠诚与兵源"
 oe_thh.3.b:0 "收紧玛丽堡对法兰克尼亚金库的直接稽核，立即征调银钱"
 oe_thh.3.c:0 "串联梅尔根特海姆与科隆大辖区，打通美因—莱茵商道"
 oe_thh.4.t:0 "波希米亚—勃兰登堡骑士北上通道"
 oe_thh.4.d:0 "在布拉格波希米亚大辖区与柏林勃兰登堡大辖区护送下，大批来自波希米亚、萨克森与勃兰登堡的贵族骑士携精良甲胄与战马渡过维斯瓦河，前来参与今岁普鲁士圣战远征。在玛丽堡举办驰名欧陆的「荣誉宴席（Ehrentisch）」可极大振奋重骑军威，而务实司库则提议趁机收取过境军资。"
 oe_thh.4.a:0 "于玛丽堡大食堂隆重举办荣誉宴席，激扬骑士锐气"
 oe_thh.4.b:0 "核收远征过境军资并就地补充常备兵源"
 oe_thh.4.c:0 "致书嘉谢布拉格与柏林宫廷，深化与波希米亚、勃兰登堡邦交"
 oe_thh.5.t:0 "重审1226年《里米尼金玺诏书》"
 oe_thh.5.d:0 "玛丽堡文书房内，来自帝国宫廷的法学家与骑士团教会法学者共同展阅腓特烈二世于1226年颁赐的《里米尼金玺诏书》原件。这份决定骑士团国运的古老宪章，究竟是将大团长界定为效忠神圣罗马帝国的东方诸侯，还是赋予普鲁士与皇帝平起平坐的独立主权？一场关乎国运路线的思想激辩就此展开。"
 oe_thh.5.a:0 "着重阐发大团长作为神圣罗马帝国诸侯的尊崇法统"
 oe_thh.5.b:0 "高扬《里米尼金玺诏书》独立主权真义，誓作自主圣战帝国"
 oe_thh.5.c:0 "保持文书解释的巧妙弹性，换取眼前稳定与商税盈余"
 oe_thh.6.t:0 "帝国五大辖区什一税总稽核"
 oe_thh.6.d:0 "每隔五载，玛丽堡大司库便派巡察使清点波希米亚、奥地利、勃兰登堡、梅尔根特海姆与莱茵兰五大帝国辖区的田庄与什一税账册。今岁各地葡萄园与农庄丰收，各辖区府库充盈；大团长须决断究竟宽免税赋以收军心、尽数追缴充实国库，还是定向投入波罗的海红砖堡垒建设。"
 oe_thh.6.a:0 "宽免五大辖区五年部分什一税，换取空前忠诚与兵源"
 oe_thh.6.b:0 "将诸辖区盈余什一税全数解送玛丽堡国库"
 oe_thh.6.c:0 "定向将奥地利与莱茵兰盈余投入波罗的海红砖城堡防线"
 oe_thh.7.t:0 "玛丽堡条顿大议会盛大召开"
 oe_thh.7.d:0 "在玛丽堡大食堂巍峨的红砖肋拱穹顶下，大团长亲自主持盛大条顿大议会，五大重臣、帝国诸大辖区使节、教区法政牧师与库尔姆、但泽市镇代表济济一堂。本次大会确立的议事纲纪，将决定骑士团国是以多阶层宪政和睦施政，还是以大团长战时铁腕统御全局。"
 oe_thh.7.a:0 "确立骑士、教士与市镇平衡共议的大议会宪章"
 oe_thh.7.b:0 "在大议会上重申大团长战时军政乾纲独断之威权"
 oe_thh.8.t:0 "奥地利与莱茵兰帝国驿道济贫院"
 oe_thh.8.d:0 "驻节维也纳与科隆的两位大辖区长官联名奏报：多瑙河与莱茵河沿岸朝圣者与商船络绎不绝，两城皆乐见条顿骑士团扩建享誉帝国的圣玛丽亚医院济贫院；然精明商官亦进言，若将临水产业改造为波罗的海琥珀与谷物直营商栈，收益更为可观。"
 oe_thh.8.a:0 "秉承圣玛丽亚医院骑士初心，扩建维也纳与科隆济贫医馆"
 oe_thh.8.b:0 "将临水庄园扩充为帝国驿道琥珀直营商栈，广开财源"
 oe_thh.9.t:0 "帝国东方之盾受封大典"
 oe_thh.9.d:0 "号角响彻帝国议事大厅，条顿骑士团大团长正式获颁帝国诸侯（Reichsfurst）与「帝国东方之盾（Reichsschild）」御敕金印！五大德意志大辖区欢声雷动，玛丽堡使节跻身德意志诸侯前列。骑士团今可决断，究竟全力经营选侯与帝国领导志业，还是将帝国授权倾注于铸就东方边防铁壁。"
 oe_thh.9.a:0 "纵横帝国宫廷，稳步迈向选侯席位与德意志帝国领导权"
 oe_thh.9.b:0 "将帝国诸侯授权尽数倾注于波罗的海要塞与东方防线"
 oe_thh.10.t:0 "《里米尼独立诏书》与神圣东方骑士帝国加冕"
 oe_thh.10.d:0 "玛丽堡高堡之巅黑十字与金鹰战旗猎猎招展，大团长恭读1226年《里米尼金玺诏书》，向天下宣告独立主权的「神圣东方骑士帝国（Gross-Ordensstaat）」巍然屹立！不受任何世俗帝国掣肘、与东西方诸帝平起平坐的骑士团国，正面临建国后的首个宏大抉择。"
 oe_thh.10.a:0 "高举大十字军战旗，发动势不可挡的全面东进征伐"
 oe_thh.10.b:0 "颁行统一《波罗的海骑士帝国主权法典》，固本培元"
 oe_teu_generalkapitel:0 "条顿骑士团大议会（Generalkapitel）"
 oe_teu_generalkapitel_desc:0 "在玛丽堡大食堂召开的条顿骑士团最高议政机构，汇集大团长、五大重臣、神圣罗马帝国诸大辖区长官与普鲁士自治市镇代表共议军国大政，稳步强化军纪与要塞防御，同时赋予教士与骑士贵族更大议程分量。"
 oe_thh_pi_ostsiedlung_charter:0 "《东向拓垦授田宪章》"
 oe_thh_pi_ostsiedlung_charter_desc:0 "经条顿大议会核准颁行《库尔姆法》东向拓垦授田宪章，招徕德意志农夫与垦殖领头人开垦普鲁士及波罗的海河谷，提升人口增长、粮食供应与地方发展度，略微触动传统贵族特权。"
 oe_thh_pi_baltic_fortress_tithe:0 "《波罗的海红砖要塞什一税》"
 oe_thh_pi_baltic_fortress_tithe_desc:0 "经大议会批准将辖区教产什一税专项投入红砖骑士城堡与边疆烽火台修筑，大幅提升全国要塞防卫、堡垒维护效率与行省控制力，但会令乡民税负略增。"
 oe_thh_pi_preussenreisen_levy:0 "《普鲁士远征军役法》"
 oe_thh_pi_preussenreisen_levy_desc:0 "由大议会向神圣罗马帝国诸辖区与普鲁士领地颁发冬季远征军役令，强化兵团补员速度、军功传统与人力储备，唯需承担更高军费维护。"
 oe_thh_pi_hanseatic_amber_compact:0 "《汉萨琥珀专卖协约》"
 oe_thh_pi_hanseatic_amber_compact_desc:0 "经大议会与但泽、柯尼斯堡等汉萨商埠议定桑比亚琥珀专卖与谷物海运协约，显著提振贸易收入、海贸效率与商人势力，略令保守修道教士不满。"
 oe_thh_pi_hochmeister_ordensstaat_charter:0 "《大团长骑士团国章程》"
 oe_thh_pi_hochmeister_ordensstaat_charter_desc:0 "由大议会核准颁行《大团长骑士团国章程》，统合玛丽堡中枢、普鲁士诸指挥区与帝国大辖区行政法度，全面强化中枢权威、正税效率与内阁施政效能，略微触动贵族领主既得权益。"
 oe_thh_pa_clergy_chapter_tithe:0 "确认辖区礼拜堂教产免税"
 oe_thh_pa_clergy_chapter_tithe_desc:0 "骑士团司铎代表请求大团长保护各地礼拜堂与医院教产免受战时特税侵占，以换取大议会教士赞成票。"
 oe_thh_pa_clergy_baltic_mission:0 "资助波罗的海边疆宣教团"
 oe_thh_pa_clergy_baltic_mission_desc:0 "桑比亚与库尔姆主教请求国库拨付小额经费派遣边疆传教修会，换取教士阶层全力支持议案。"
 oe_thh_pa_nobles_ritter_stipend:0 "保障骑士兄弟战马禄米"
 oe_thh_pa_nobles_ritter_stipend_desc:0 "骑士贵族代表要求确认重装战马与甲胄补贴并略减贵族税限，以换取大议会中的关键赞成票。"
 oe_thh_pa_nobles_ordensburg_fief:0 "委任边疆红砖城堡镇守"
 oe_thh_pa_nobles_ordensburg_fief_desc:0 "各地骑士团长请求正式授予边疆红砖城堡镇守委任状，换取贵族阶层在大议会上鼎力相助。"
 oe_thh_pa_burghers_kulm_towns:0 "重申《库尔姆法》市镇特许"
 oe_thh_pa_burghers_kulm_towns_desc:0 "托伦、埃尔宾与柯尼斯堡市镇议会承诺在大议会投赞成票，条件是骑士团重申其《库尔姆法》商市自治特权。"
 oe_thh_pa_peasants_freihufe_grant:0 "确认自耕农永业田契"
 oe_thh_pa_peasants_freihufe_grant_desc:0 "自由村长代表恳请大议会确认垦荒农户的永业田契并略降田赋上限，换取农民阶层坚定拥护。"
 oe_thh_cab_kulm_settlement:0 "《库尔姆法》东向拓垦宪章"
 oe_thh_cab_kulm_settlement_desc:0 "委派骑士团拓垦领头人与《库尔姆法》书记官赴目标行省招徕德意志农工定居，显著加速文化同化、发展度成长与人口繁衍，同时给予小幅免税优惠以安抚垦民。"
 oe_thh_cab_kulm_settlement_action:0 "推行《库尔姆法》东向拓垦宪章：[SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_thh_cab_kulm_settlement_active:0 "正在[SCOPE.sProvince('target').GetNameWithHighlightOnly]推行《库尔姆法》东向拓垦宪章"
 oe_thh_cab_kulm_settlement_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_thh_cab_kulm_settlement_action_progress_wordier:0 "《库尔姆法》东向拓垦宪章（[SCOPE.sProvince('target').GetNameWithNoTooltip]）：[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_thh_cab_kulm_settlement_action_progress_tooltip:0 "委派骑士团拓垦领头人与《库尔姆法》书记官赴目标行省招徕德意志农工定居，显著加速文化同化、发展度成长与人口繁衍，同时给予小幅免税优惠以安抚垦民。"
 oe_thh_cab_kulm_settlement_select_province:0 "选择推行《库尔姆法》东向拓垦宪章的目标行省"
 oe_thh_cab_kulm_settlement_no_provinces:0 "@trigger_no!当前没有可推行《库尔姆法》东向拓垦宪章的行省。"
 oe_thh_cab_ordensburg_frontier:0 "红砖骑士城堡边防戍卫"
