l_simp_chinese:
 oe_guarantee_cilicia: "保障奇里乞亚"
 oe_guarantee_cilicia_desc: "奇里乞亚的城堡守望着托罗斯山口，海港联结着塞浦路斯与叙利亚的商路。帝国将向诸国宣告：侵犯亚美尼亚王国的独立，也将招致罗马的干预。\n\n仅传统时代可见，一次性行动。奇里乞亚须存在且独立；东罗马须与其直接接壤，或直接拥有塞浦路斯全省，或拥有超过30艘舰船。花费200金币，由东罗马保障奇里乞亚独立。"
 oe_cilicia_protectorate: "奇里乞亚保护国"
 oe_cilicia_protectorate_desc: "帝国的保障已使奇里乞亚免于孤立。随着罗马疆界重临托罗斯山麓，我们可以将这份承诺化为盟约，使当地君主在帝国庇护下保有其统治。\n\n完成“保障奇里乞亚”后解锁。奇里乞亚须存在且独立，东罗马须与其直接接壤且税基至少200。花费200金币，使奇里乞亚成为东罗马的罗马同盟。"
 oe_tribes_romanization: "罗马化"
 oe_tribes_romanization_desc: "帝国承认部族首领的地位，并以户籍、田契与共同的军役将其纳入罗马秩序。昔日逐水草而居的族人可以定居耕种，保有故乡的记忆，也成为帝国法度下的农户。\n\n蛮族忠诚均衡值+10%，阶层影响力+33%，每月繁荣度+0.05%，部落民转变为农民+20%，每月向罗马认同移动0.1。"
