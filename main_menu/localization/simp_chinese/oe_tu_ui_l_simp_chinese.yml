 game_concept_oe_tu_status: "地位"
 game_concept_oe_tu_status_desc: "帝国历史上的行省并不都一样：10世纪收复东方后，边地设督军区（doukaton）；拉文纳和迦太基设过总督区（exarchate）；1349年起，莫雷亚成为皇子的封邑。\n\n本模组的每个行省有五种地位之一：内地、边镇、总督区、特许城邦、宗室封邑。地位改变行省的五条事务线、忠诚目标（边镇 -10，总督区 -10，特许城邦 -5，宗室封邑 +5）、位阶名和长官头衔。总督区每月上缴月收入的10%，宗室封邑5%；特许城邦缴纳税基的15%，不出兵。\n\n帝国柱石的军区页在每个行省名下显示地位，悬停可见具体加减；地图模式“行省地位与附庸”按地位着色。"
 game_concept_oe_tu_course: "方针"
 game_concept_oe_tu_course_desc: "军区原是军事辖区，由将军兼管军政；到巴列奥略时代，大军区早已分解，地方由凯法勒治理较小的卡特潘区。\n\n方针是行省的治理方向。陆军：军务 +15；海军：军务 +10、财政 +5，治所须临海；民政：民政 +10、司法 +5、财政 +5、忠诚目标 +5。陆军和海军行省随帝国参战，民政行省不参战。改方针花费5帝国权威，5年内不能再改；边镇不能改为民政，拉丁总督区与特许城邦不能改。\n\n军区页在地位之后显示方针，悬停可见具体加减；行省卡上的“方针”按钮用来改。"
 game_concept_oe_tu_fiscal: "财制"
 game_concept_oe_tu_fiscal_desc: "财制决定由谁征收行省的赋税，在行省卡的“属官”中设定，改动后2年内不能再改属官。\n\n将军兼管：财政 +5，不花国库的钱。中央委派财务官：财政 +15、忠诚目标 +5，国库每月按辖地每处付0.2金币。包税：司法 -10、财政 +10、忠诚目标 -5，行省每月按辖地每处多得0.5金币，辖地发展变慢。授地（[oe_tu_pronoia|e]）：军务 +10、忠诚目标 +5，财政比将军兼管少5。\n\n军区页每张行省卡第二行的“财制”显示当前财制，悬停可见具体加减。"
 game_concept_oe_tu_senate: "元老院"
 game_concept_oe_tu_senate_desc: "拜占庭的元老院一直存续到巴列奥略时代，但那时它只是京城最高显贵的集会，并不由各省派代表。本模组给特许城邦、总督区和宗室封邑设席位，是仿照罗马自治市议会和意大利城市公社议会的设计。\n\n元老院就四项议题表决：加征贡金、战时征召、设省、授予罗马法统。特许城邦有2席，总督区和宗室封邑各1席，名册上的每个豪族1席，每位在任宫廷官员1席；得分达到50的席位投赞成，赞成多于反对即通过。未通过时皇帝可以强行通过：花费5帝国权威，投反对票的行省忠诚 -10（5年内计入忠诚目标），投反对票的豪族影响力 -25。\n\n表决以“元老院表决”事件出现。帝国柱石里的“提请加征贡金”由皇帝发起；设省、授予罗马法统和征伐开始时的战时征召也会提交表决。"
 game_concept_oe_tu_kephale: "总凯法勒"
 game_concept_oe_tu_kephale_desc: "14世纪，帝国在若干卡特潘区之上设总凯法勒（katholike kephale）统辖一方，任职者多是皇帝的亲属或大族子弟；到世纪末，这一职位随宗室专制公国的兴起而消失。\n\n帝国分八个大区。至少有2个行省、尚无总凯法勒的大区可以任命一位，花费3帝国权威；在任期间，大区每个行省忠诚目标 +5，五条事务线各 +5。家族影响力达到500，或统辖4个以上行省且有一项能力达到70的总凯法勒会坐大，可能抗命（抗命期间忠诚目标改为 -5）或请求以大区为封地；罢免坐大者，大区行省忠诚 -5，其家族影响力 -50。\n\n在帝国柱石的“任命总凯法勒”中任命，在“罢免总凯法勒”中罢免。"
 game_concept_oe_tu_family: "君王大家庭"
 game_concept_oe_tu_family_desc: "在君士坦丁堡的宫廷礼仪里，皇帝是“君王大家庭”的父亲，其他君主按亲疏被称作他的子、兄弟或友。\n\n帝国的附庸和罗马文明圈成员都有位次。子：信奉正教或米亚菲派的附庸，以及罗马文明圈中的王子与正教王国；兄弟：神圣罗马帝国与波斯帝国两种附庸；友：其余。子对帝国好感 +25，帝国对其 +10，该国每月威望 +0.02；兄弟依次 +15、+10、+0.05；友依次 +10、+5、+0.01。位次每6个月更新一次。\n\n帝国柱石的附庸页在“位次”一栏显示；位次决定能受封哪些[oe_tu_dignity|e]。"
 game_concept_oe_tu_dignity: "尊号"
 game_concept_oe_tu_dignity_desc: "皇帝常把宫廷尊号授给外国君主：1163年，曼努埃尔一世首创专制公之号，授予匈牙利王子贝拉。\n\n皇帝可把四种尊号授给[oe_tu_family|e]中的在位成年君主：专制公（只授“子”，同时至多2人）、塞巴斯托克拉托（只授“子”，同时至多2人）、凯撒（任何位次，同时至多1人）、首席尊者（任何位次，同时至多3人）。代价依次为威望 -20、-15、-15、-10，帝国权威 -8、-6、-10、-4。受封国家对帝国好感依次 +40、+30、+30、+25，每年回落2，君主在位期间另加 +10；若是帝国附庸，对宗主忠诚依次 +15、+12、+12、+8。同一国家5年内只能受封一次；尊号随君主终身，不传给继任者。\n\n在罗马文明圈面板的“授予尊号”中授予；帝国柱石的附庸页也显示尊号。"
 game_concept_oe_tu_provincialise: "设省"
 game_concept_oe_tu_provincialise_desc: "罗马常把附庸王国改为行省：公元17年，卡帕多西亚末代国王死后，提比略把它设为行省；1018年，巴西尔二世在保加利亚故地设保加利亚军区。\n\n行省化附庸满120个月（每次拒绝应召推迟5年）、对帝国好感不低于70或统治者由皇帝扶立、主体文化属罗马文化组或信奉正教，就可以提请设省，花费10帝国权威，由[oe_tu_senate|e]表决。通过后附庸并入帝国，故地设1个行省，满12个地点设2个，满30个设3个；与帝国阵营以外的国家接壤的为边镇，否则为总督区。否决后5年内不能再提，附庸对帝国好感 -20。皇室领地·埃及不需要这些条件。\n\n在帝国柱石的敕令“设省”中发起；附庸页显示各附庸离设省还有多远。"
 game_concept_oe_tu_pronoia: "普罗尼亚"
 game_concept_oe_tu_pronoia_desc: "普罗尼亚是以一片土地的收入代替俸禄的授予，原本可以收回；曼努埃尔一世把它推广到军官，1261年以后，米海尔八世让它可以世袭。\n\n帝国推行原版的普罗尼亚制度（或其后的科穆宁规范化、帕列奥列格世袭、改革普罗尼亚）以后，行省卡的“属官”里会出现授地：军务 +10、忠诚目标 +5，财政比将军兼管少5；行省和辖地的人力与征召兵依所行法律 +10% 至 +20%；出身豪族的将军，其家族影响力每年 +5。授地满20年可转为世袭；收回世袭授地，忠诚 -15（帕列奥列格世袭下 -20，改革普罗尼亚下 -10）。\n\n军区页的“财制”显示“普罗尼亚”，悬停可见具体加减。"
 game_concept_oe_tu_dignities: "尊号"
