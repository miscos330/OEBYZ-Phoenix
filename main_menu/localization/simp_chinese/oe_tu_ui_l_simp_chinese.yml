 # NEW 2026-11-18 third round N1 (generated by gen_round3_ui.py)
 mapmode_oe_tu_status_name: "行省地位与附庸"
 MAPMODE_OE_TU_STATUS: "#T $mapmode_oe_tu_status_name$#!\n帝国直辖的地点按所属行省的[oe_tu_status|e]着色：内地紫，[oe_tu_march|e]橙红，[oe_tu_exarchate|e]琥珀，[oe_tu_charter|e]青，宗室封邑玫红；尚未设行省的直辖地为石色，行省治所带浅色条纹。\n帝国附庸国的领土按附庸类型着色：罗马同盟蓝，行省化附庸天蓝，罗马边疆领橄榄，区域王国绿，皇室领地·埃及棕，其他附庸灰蓝。\n其余地方为暗灰。"
 LEGEND_KEY_OE_TU_S1: "行省：内地"
 LEGEND_KEY_OE_TU_S2: "行省：边镇"
 LEGEND_KEY_OE_TU_S3: "行省：总督区"
 LEGEND_KEY_OE_TU_S4: "行省：特许城邦"
 LEGEND_KEY_OE_TU_S5: "行省：宗室封邑"
 LEGEND_KEY_OE_TU_SEAT: "行省治所（条纹）"
 LEGEND_KEY_OE_TU_BYZ: "帝国直辖，未设行省"
 LEGEND_KEY_OE_TU_V_ALLY: "附庸：罗马同盟"
 LEGEND_KEY_OE_TU_V_PROV: "附庸：行省化附庸"
 LEGEND_KEY_OE_TU_V_MARCH: "附庸：罗马边疆领"
 LEGEND_KEY_OE_TU_V_KINGDOM: "附庸：区域王国"
 LEGEND_KEY_OE_TU_V_EGYPT: "附庸：皇室领地·埃及"
 LEGEND_KEY_OE_TU_V_OTHER: "附庸：其他类型"
 LEGEND_KEY_OE_TU_NONE: "其他国家与无主地"
 game_concept_oe_tu_status: "地位"
 game_concept_oe_tu_status_desc: "帝国历史上的行省并不都一样：10世纪收复东方后，边地设督军区（doukaton）；拉文纳和迦太基设过[oe_tu_exarchate|e]（exarchate）；1349年起，莫雷亚成为皇子的封邑。\n\n本模组的每个行省有五种地位之一：内地、[oe_tu_march|e]、总督区、[oe_tu_charter|e]、宗室封邑。地位改变行省的五条事务线、忠诚目标（边镇#R −10#!，总督区#R −10#!，特许城邦#R −5#!，宗室封邑#G +5#!）、位阶名和长官头衔。总督区每月上缴月收入的#Y 10%#!，宗室封邑#Y 5%#!；特许城邦缴纳税基的#Y 15%#!，不出兵。\n\n帝国柱石的军区页在每个行省名下显示地位，悬停可见具体加减；地图模式“行省地位与附庸”按地位着色。"
 game_concept_oe_tu_course: "方针"
 game_concept_oe_tu_course_desc: "军区原是军事辖区，由将军兼管军政；到巴列奥略时代，大军区早已分解，地方由凯法勒治理较小的卡特潘区。\n\n方针是行省的治理方向。陆军：军务#G +15#!；海军：军务#G +10#!、财政#G +5#!，治所须临海；民政：民政#G +10#!、司法#G +5#!、财政#G +5#!、忠诚目标#G +5#!。陆军和海军行省随帝国参战，民政行省不参战。改方针花费#R 5#![oe_tu_authority|e]，#Y 5#!年内不能再改；[oe_tu_march|e]不能改为民政，拉丁[oe_tu_exarchate|e]与[oe_tu_charter|e]不能改。\n\n军区页在地位之后显示方针，悬停可见具体加减；行省卡上的“方针”按钮用来改。"
 game_concept_oe_tu_fiscal: "财制"
 game_concept_oe_tu_fiscal_desc: "财制决定由谁征收行省的赋税，在行省卡的“属官”中设定，改动后#Y 2#!年内不能再改属官。\n\n将军兼管：财政#G +5#!，不花国库的钱。中央委派财务官：财政#G +15#!、忠诚目标#G +5#!，国库每月按辖地每处付#Y 0.2#!金币。包税：司法#R −10#!、财政#G +10#!、忠诚目标#R −5#!，行省每月按辖地每处多得#Y 0.5#!金币，辖地发展变慢。授地（[oe_tu_pronoia|e]）：军务#G +10#!、忠诚目标#G +5#!，财政比将军兼管少#Y 5#!。\n\n军区页每张行省卡第二行的“财制”显示当前财制，悬停可见具体加减。"
 game_concept_oe_tu_senate: "元老院"
 game_concept_oe_tu_senate_desc: "#F 拜占庭的元老院一直存续到巴列奥略时代，但那时它只是京城最高显贵的集会，并不由各省派代表。#!本模组给[oe_tu_charter|e]、[oe_tu_exarchate|e]和宗室封邑设席位，是仿照罗马自治市议会和意大利城市公社议会的设计。\n\n元老院就四项议题表决：加征贡金、战时征召、[oe_tu_provincialise|e]、授予罗马法统。\n\n席位：特许城邦#Y 2#!席，总督区和宗室封邑各#Y 1#!席，名册上的每个豪族#Y 1#!席，每位在任宫廷官员#Y 1#!席。\n计票：行省按忠诚和地位计分（特许城邦反对加征），豪族按影响力和是否为皇帝的政治盟友计分，官员按对皇帝的忠诚和所属阶层的满意度计分；得分达到#Y 50#!的席位投赞成，赞成多于反对即通过。\n强行通过：未通过时，皇帝可以花费#R 5#![oe_tu_authority|e]强行通过；投反对票的行省忠诚#R −10#!（#Y 5#!年内计入忠诚目标），投反对票的豪族影响力#Y −25#!。\n预览：提请或提交之前，四项议题的说明里都会按此刻的情形估出赞成和反对的席位，并列出各派的反对票；实际以表决时的计票为准。\n\n表决以“元老院表决”事件出现。帝国柱石里的“提请加征贡金”由皇帝发起；设省、授予罗马法统和征伐开始时的战时征召也会提交表决。"
 game_concept_oe_tu_kephale: "总凯法勒"
 game_concept_oe_tu_kephale_desc: "14世纪，帝国在若干卡特潘区之上设总凯法勒（katholike kephale）统辖一方，任职者多是皇帝的亲属或大族子弟；到世纪末，这一职位随宗室专制公国的兴起而消失。\n\n帝国分八个大区。至少有#Y 2#!个行省、尚无总凯法勒的大区可以任命一位，花费#R 3#![oe_tu_authority|e]；在任期间，大区每个行省忠诚目标#G +5#!，五条事务线各#G +5#!。家族影响力达到#Y 500#!，或统辖#Y 4#!个以上行省且有一项能力达到#Y 70#!的总凯法勒会坐大，可能抗命（抗命期间忠诚目标改为#R −5#!）或请求以大区为封地；罢免坐大者，大区行省忠诚#R −5#!，其家族影响力#Y −50#!。\n\n在帝国柱石的“任命总凯法勒”中任命，在“罢免总凯法勒”中罢免。"
 game_concept_oe_tu_family: "君王大家庭"
 game_concept_oe_tu_family_desc: "在君士坦丁堡的宫廷礼仪里，皇帝是“君王大家庭”的父亲，其他君主按亲疏被称作他的子、兄弟或友。\n\n帝国的附庸和罗马文明圈成员都有位次。子：信奉正教或米亚菲派的附庸，以及罗马文明圈中的王子与正教王国；兄弟：神圣罗马帝国与波斯帝国两种附庸；友：其余。子对帝国好感#G +25#!，帝国对其#G +10#!，该国每月威望#G +0.02#!；兄弟依次#Y +15#!、#Y +10#!、#Y +0.05#!；友依次#Y +10#!、#Y +5#!、#Y +0.01#!。位次每#Y 6#!个月更新一次。\n\n帝国柱石的附庸页在“位次”一栏显示；位次决定能受封哪些[oe_tu_dignity|e]。"
 game_concept_oe_tu_dignity: "尊号"
 game_concept_oe_tu_dignity_desc: "皇帝常把宫廷尊号授给外国君主：1163年，曼努埃尔一世首创专制公之号，授予匈牙利王子贝拉。\n\n皇帝可把四种尊号授给[oe_tu_family|e]中的在位成年君主：专制公（只授“子”，同时至多#Y 2#!人）、塞巴斯托克拉托（只授“子”，同时至多#Y 2#!人）、凯撒（任何位次，同时至多#Y 1#!人）、首席尊者（任何位次，同时至多#Y 3#!人）。代价依次为威望#R −20#!、#R −15#!、#R −15#!、#R −10#!，[oe_tu_authority|e]#R −8#!、#R −6#!、#R −10#!、#R −4#!。受封国家对帝国好感依次#G +40#!、#G +30#!、#G +30#!、#G +25#!，每年回落#Y 2#!，君主在位期间另加#G +10#!；若是帝国附庸，对宗主忠诚依次#G +15#!、#G +12#!、#G +12#!、#G +8#!。同一国家#Y 5#!年内只能受封一次；尊号随君主终身，不传给继任者。个别事件里可以破例：约阿尼纳的拉丁领主可以破例受封专制公；专制公身故或退位后，继任者可以遣使请求续授。\n\n在罗马文明圈面板的“授予尊号”中授予；帝国柱石的附庸页也显示尊号。"
 game_concept_oe_tu_provincialise: "设省"
 game_concept_oe_tu_provincialise_desc: "罗马常把附庸王国改为行省：公元#Y 17#!年，卡帕多西亚末代国王死后，提比略把它设为行省；1018年，巴西尔二世在保加利亚故地设保加利亚军区。\n\n行省化附庸满#Y 120#!个月（每次拒绝应召推迟#Y 5#!年）、对帝国好感不低于#Y 70#!或统治者由皇帝扶立、主体文化属罗马文化组或信奉正教，就可以提请设省，花费#R 10#![oe_tu_authority|e]，由[oe_tu_senate|e]表决。通过后附庸并入帝国，故地设#Y 1#!个行省，满#Y 12#!个地点设#Y 2#!个，满#Y 30#!个设#Y 3#!个；与帝国阵营以外的国家接壤的为[oe_tu_march|e]，否则为[oe_tu_exarchate|e]。否决后#Y 5#!年内不能再提，附庸对帝国好感#R −20#!。皇室领地·埃及不需要这些条件。\n\n在帝国柱石的敕令“设省”中发起；附庸页显示各附庸离设省还有多远。"
 game_concept_oe_tu_pronoia: "普罗尼亚"
 game_concept_oe_tu_pronoia_desc: "普罗尼亚是以一片土地的收入代替俸禄的授予，原本可以收回；曼努埃尔一世把它推广到军官，1261年以后，米海尔八世让它可以世袭。\n\n帝国推行原版的普罗尼亚制度（或其后的科穆宁规范化、巴列奥略世袭、改革普罗尼亚）以后，行省卡的“属官”里会出现授地：军务#G +10#!、忠诚目标#G +5#!，财政比将军兼管少#Y 5#!；行省和辖地的人力与征召兵依所行法律#Y +10%#!至#Y +20%#!；出身豪族的将军，其家族影响力每年#Y +5#!。授地满#Y 20#!年可转为世袭；收回世袭授地，忠诚#R −15#!（巴列奥略世袭下#R −20#!，改革普罗尼亚下#R −10#!）。\n\n军区页的“财制”显示“普罗尼亚”，悬停可见具体加减。"
 game_concept_oe_tu_authority: "帝国权威"
 game_concept_oe_tu_authority_desc: "帝国柱石的核心读数，在#Y 0#!到#Y 100#!之间，1337年开局为#Y 25#!，每月自然回落#Y 0.2#!。\n\n本模组的大多数行动都要花帝国权威，例如设立军区、改方针、任命[oe_tu_kephale|e]、宣布征伐和[oe_tu_provincialise|e]。\n\n在帝国柱石的“帝国财政”页给维系权威拨款，可以用[oe_tu_purse|e]换帝国权威：拿出内帑的全部月收入，每月最多#G +0.5#!。帝国柱石的概览显示当前数值。"
 game_concept_oe_tu_purse: "内帑"
 game_concept_oe_tu_purse_desc: "皇帝的私库，与国库分开记账。宫廷贵胄占有贵族阶层收入的#Y 15%#!，教会高层占有教士阶层收入的#Y 5%#!，这两项每月计入内帑。\n\n内帑用于维系[oe_tu_authority|e]和各种恩赏，例如“面包与马戏”“奖励忠诚官僚”。国库的钱可以用“财政令”里的“存入内帑”转进来，每次花费#R 1#!正统性。\n\n帝国柱石的“帝国财政”页显示内帑的收支。"
 game_concept_oe_tu_march: "边镇"
 game_concept_oe_tu_march_desc: "与帝国阵营以外的国家接壤的行省，是五种[oe_tu_status|e]之一。忠诚目标#R −10#!，陆军士气和补员速度各#G +10%#!，不缴贡金。\n\n辖区开始与外国接壤时，会有事件询问是否改设边镇；原本是内地的边镇连续数年不再与外国接壤，可以改回内地。边镇不能选民政方针，会受边患事件影响。\n\n军区页在每个行省名下显示地位。"
 game_concept_oe_tu_exarchate: "总督区"
 game_concept_oe_tu_exarchate_desc: "远地或新设的行省，是五种[oe_tu_status|e]之一。忠诚目标#R −10#!，陆军士气#G +5%#!，每月上缴月收入的#Y 10%#!作为贡金，在[oe_tu_senate|e]有#Y 1#!席。\n\n[oe_tu_provincialise|e]后不与外国接壤的行省多为总督区；拉丁总督区不能改方针。\n\n军区页在每个行省名下显示地位。"
 game_concept_oe_tu_charter: "特许城邦"
 game_concept_oe_tu_charter_desc: "享有特许状的城市，是五种[oe_tu_status|e]之一，主要在意大利。忠诚目标#R −5#!，缴纳税基的#Y 15%#!，不出兵，在[oe_tu_senate|e]有#Y 2#!席，反对加征贡金。\n\n特许城邦不能改方针，也拒绝清丈。\n\n军区页在每个行省名下显示地位。"
 game_concept_oe_tu_church_parties: "教会三派"
 game_concept_oe_tu_church_parties_desc: "#F 1341年起，拜占庭教会为静修之争分裂：帕拉马斯一派认为修士在静默的祈祷中能见到神的非受造之光；巴尔拉姆、阿金迪诺斯、格雷戈拉斯和基多内斯兄弟等人反对。反对的人里，不少后来又主张与罗马教会合一。#!\n\n本模组把教会分成三派，份额合计#Y 100#!：静修派（阿索斯山的修士和帕拉马斯的门人）、理性派（宫廷和学堂里的学者）、亲合一派（主张与罗马合一，换取西方的援助）。史实上后两派的人多有重叠，这里为了好读分开。\n\n份额最大、至少#Y 40#!、领先第二名#Y 5#!以上的一派当道，帝国获得相应的修正；别的派要领先#Y 8#!才能取而代之。每年一月三派漂移：现任牧首所属的一派#Y +2#!；帝国拥有阿索斯山时静修派上升，失去它时下降；向西方求援、皇帝向教皇低头的丑闻、拉丁化或希腊化的风气、臣属于苏丹，都会推动某一派；超过#Y 60#!的一派会自然回落。\n\n牧首去世后的“普世牧首选择”：选阿索斯山的修士，新牧首属静修派；选内阁里的教士，属理性派（与罗马谈判合一期间属亲合一派）；选君士坦丁堡的修士，属当道的一派（均势时属静修派）。会议或换帝造成的出缺，由圣主教会议报上人选；选了不当道一派的人，要花费[oe_tu_authority|e]，会众也会不服。\n\n修院地产分四等：豁免（金玺诏书免去修院的赋税）、常例、半数作[oe_tu_pronoia|e]（一半田庄分给士兵）、入官，各有修正。帝国拥有阿索斯山，且修院地产是豁免或常例时，静修派每年#Y +2#!；全部入官时每年#Y −3#!。1371年前后起，有几个事件会改变它。\n\n帝国柱石里的“主持圣主教会议”显示三派份额，也能召开会议推动一派。"
 game_concept_oe_tu_patriarchate: "牧首区威望"
 game_concept_oe_tu_patriarchate_desc: "#F 14世纪的帝国日渐衰弱，君士坦丁堡的普世牧首却仍为罗斯、立陶宛、瓦拉几亚、摩尔达维亚等地祝圣都主教。这份声望，是帝国在正教世界最后的影响之一。#!\n\n牧首区威望在#Y 0#!到#Y 100#!之间，起点#Y 50#!，每年一月向目标值移动#Y 2#!。目标值为#Y 30#!；每个归属或自主的教区#G +5#!；静修派份额达到#Y 45#!时#G +10#!（修士的往来遍及巴尔干和罗斯）；实行“普世牧首”方针时#G +5#!；合一已宣布，或有皇帝向教皇低头的丑闻时#R −10#!；每个脱离的教区#R −5#!。会议、与塞尔维亚和保加利亚教会的和解、罗斯宗教会议的成功，也会直接加减。\n\n威望达到#Y 70#!时，帝国获得“万国的牧首”；低于#Y 40#!时，获得“牧首的话没人听”。\n\n登记的教区有六处：罗斯、立陶宛、瓦拉几亚、摩尔达维亚、塞尔维亚、特尔诺沃，每处的状态是未设、归属、争议、自主或脱离之一。塞尔维亚和特尔诺沃两处每年一月按两国教会的实际情况更新。\n\n帝国柱石里的“主持圣主教会议”显示威望和各教区的状态。"
 game_concept_oe_tu_dignities: "尊号"
 oe_tu_tt_status_1: "[oe_tu_status|e]：#Y 内地#!\n帝国腹地，长官由皇帝任免。\n事务线：军务#Y +0#!，民政#Y +0#!，司法#Y +0#!，财政#Y +0#!，营建#Y +0#!\n忠诚目标#Y +0#!\n地位修正：对宗主忠诚#G +5#!"
 oe_tu_tt_status_2: "[oe_tu_status|e]：#Y [oe_tu_march|e]#!\n与外国接壤的行省。原为内地的，接壤解除满#Y 5#!年后恢复内地；其余须授予罗马法统。\n事务线：军务#G +5#!，民政#R −5#!，司法#Y +0#!，财政#R −5#!，营建#G +5#!\n忠诚目标#R −10#!\n地位修正：陆军士气#G +10%#!，补员速度#G +10%#!，对宗主忠诚#R −5#!"
 oe_tu_tt_status_3: "[oe_tu_status|e]：#Y [oe_tu_exarchate|e]#!\n远方之地；授予罗马法统后可成为内地。在[oe_tu_senate|e]有#Y 1#!席。\n事务线：军务#Y +0#!，民政#R −5#!，司法#R −5#!，财政#Y +0#!，营建#Y +0#!\n忠诚目标#R −10#!\n地位修正：陆军士气#G +5%#!，对宗主忠诚#R −5#!\n贡金：每月上缴月收入的#Y 10%#!；元老院加征时再多缴。"
 oe_tu_tt_status_4: "[oe_tu_status|e]：#Y [oe_tu_charter|e]#!\n本地议会自治；授予罗马法统后可成为内地。\n事务线：军务#R −10#!，民政#Y +0#!，司法#Y +0#!，财政#G +10#!，营建#Y +0#!\n忠诚目标#R −5#!\n地位修正：对宗主忠诚#R −5#!\n贡金：缴纳税基的#Y 15%#!；不出兵；在[oe_tu_senate|e]有#Y 2#!席。"
 oe_tu_tt_status_5: "[oe_tu_status|e]：#Y 宗室封邑#!\n宗室封邑是帝国内圈的专制公国，由皇室成员治理；统治者称专制公，视同持有专制公[oe_tu_dignity|e]，但不占授给外国君主的尊号名额。在[oe_tu_senate|e]有#Y 1#!席。附庸页里名字带“专制公国”的伊庇鲁斯、约阿尼纳等是有地的盟国，不是宗室封邑。\n事务线：军务#Y +0#!，民政#G +5#!，司法#Y +0#!，财政#Y +0#!，营建#Y +0#!\n忠诚目标#G +5#!\n地位修正：对宗主忠诚#G +10#!，陆军士气#G +5%#!\n贡金：每月上缴月收入的#Y 5%#!；元老院加征时再多缴。"
 oe_tu_tt_status_none: "[oe_tu_status|e]：尚未确定，下个月按行省类型设定。"
 oe_tu_tt_course_latin: "[oe_tu_course|e]：#Y 陆军#!\n事务线：军务#G +15#!，民政#Y +0#!，司法#Y +0#!，财政#Y +0#!，营建#Y +0#!\n忠诚目标#Y +0#!\n随帝国参战。\n拉丁[oe_tu_exarchate|e]不能改方针。"
 oe_tu_tt_course_army: "[oe_tu_course|e]：#Y 陆军#!\n事务线：军务#G +15#!，民政#Y +0#!，司法#Y +0#!，财政#Y +0#!，营建#Y +0#!\n忠诚目标#Y +0#!\n随帝国参战。\n改方针花费#R 5#![oe_tu_authority|e]，#Y 5#!年内不能再改。"
 oe_tu_tt_course_navy: "[oe_tu_course|e]：#Y 海军#!\n事务线：军务#G +10#!，民政#Y +0#!，司法#Y +0#!，财政#G +5#!，营建#Y +0#!\n忠诚目标#Y +0#!\n随帝国参战；治所须临海。\n改方针花费#R 5#![oe_tu_authority|e]，#Y 5#!年内不能再改。"
 oe_tu_tt_course_civil: "[oe_tu_course|e]：#Y 民政#!\n事务线：军务#Y +0#!，民政#G +10#!，司法#G +5#!，财政#G +5#!，营建#Y +0#!\n忠诚目标#G +5#!\n不随帝国参战；[oe_tu_march|e]不能用此方针。\n改方针花费#R 5#![oe_tu_authority|e]，#Y 5#!年内不能再改。"
 oe_tu_tt_course_charter: "[oe_tu_course|e]：#Y 自治#!\n事务线：军务#Y +0#!，民政#G +10#!，司法#Y +0#!，财政#G +5#!，营建#Y +0#!\n忠诚目标#Y +0#!\n不出兵；不能改方针。"
 oe_tu_tt_course_none: "[oe_tu_course|e]：这个行省的类型没有方针加成。"
 oe_tu_tt_fiscal_1: "[oe_tu_fiscal|e]：#Y 中央委派#!\n事务线：军务#Y +0#!，民政#Y +0#!，司法#Y +0#!，财政#G +15#!，营建#Y +0#!\n忠诚目标#G +5#!\n国库每月按辖地每处付#Y 0.2#!金币俸禄。"
 oe_tu_tt_fiscal_2: "[oe_tu_fiscal|e]：#Y 包税#!\n事务线：军务#Y +0#!，民政#Y +0#!，司法#R −10#!，财政#G +10#!，营建#Y +0#!\n忠诚目标#R −5#!\n行省每月按辖地每处多得#Y 0.5#!金币；辖地每月发展#R −0.005#!。"
 oe_tu_tt_fiscal_3: "[oe_tu_fiscal|e]：#Y [oe_tu_pronoia|e]#!\n事务线：军务#G +10#!，民政#Y +0#!，司法#Y +0#!，财政#Y +0#!，营建#Y +0#!\n忠诚目标#G +5#!\n财政比将军兼管少#Y 5#!。行省和辖地的人力与征召兵依所行的普罗尼亚法律#Y +10%#!至#Y +20%#!；满#Y 20#!年可转为世袭。"
 oe_tu_tt_fiscal_0: "[oe_tu_fiscal|e]：#Y 将军兼管#!\n事务线：军务#Y +0#!，民政#Y +0#!，司法#Y +0#!，财政#G +5#!，营建#Y +0#!\n忠诚目标#Y +0#!\n将军自己征收，不花国库的钱，但将军独揽一方。"
