 oe_tu_tt_status_4: "[oe_tu_status|e]：#Y 特许城邦#!\n本地议会自治；授予罗马法统后可成为内地。\n事务线：军务 #R -10#!，民政 +0，司法 +0，财政 #G +10#!，营建 +0\n忠诚目标 #R -5#!\n地位修正：对宗主忠诚 -5\n贡金：缴纳税基的15%；不出兵；在元老院有2席。"
