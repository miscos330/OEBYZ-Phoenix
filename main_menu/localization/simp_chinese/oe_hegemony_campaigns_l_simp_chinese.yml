l_simp_chinese:
 oe_heg_plan_egypt: "筹划入侵埃及"
 oe_heg_plan_egypt_desc: "自粮船不再循旧日航路驶入金角湾，帝国便失去了南方的粮仓。召集舵手、备齐军需，令书记官重绘从叙利亚到尼罗河的行省图册；鹰旗重返东方的征程，将从亚历山大的海岸开始。"
 oe_heg_plan_egypt_effect: "从国库支出1000金币，获得针对亚历山大当前拥有者、以亚历山大所在省份为目标的征服战争借口。将黎凡特地区与埃及大区纳入罗马文明圈，并解锁三项东方总督区行动。此筹划只能完成一次。"
 oe_heg_plan_africa: "筹划入侵北非"
 oe_heg_plan_africa_desc: "亚历山大的港湾已经为我们打开西行的航道。旧日阿非利加的城墙虽已易主，商人却仍记得沿岸每一处锚地与泉眼。付清船资，备好粮秣，让宫廷重新将这片海岸写入帝国的疆域。"
 oe_heg_plan_africa_effect: "从国库支出1000金币，将马格里布大区的陆上通行地点纳入罗马文明圈，解锁北非远征。此筹划只能完成一次。"
 oe_heg_africa_expedition: "北非远征"
 oe_heg_africa_expedition_desc: "远征的诏书交付将军，君士坦丁堡只等海上传来的战报。在一处沿海乡野建立营垒，将士们要凭自己的刀剑取得立足之地，也必须守住每一寸新得的土地。"
 oe_heg_africa_expedition_effect: "在选中的沿海农村地点建立北非远征军，授予远征军改革，并配置六组当前时代步兵、六艘运输船、3000金币及营垒。所有仍在马格里布持有土地的外部国家对其宣战，东罗马及其各级附庸除外。远征军在马格里布占领即征服；敌人占领远征军领地也立即取得所有权。和平后自动撤销改革并转为罗马同盟。此远征只能发起一次。"
 oe_heg_support_expedition: "支援军事远征"
 oe_heg_support_expedition_desc: "远方的军旗尚未偃息，帝国便须续拨钱粮与兵员。军区步兵与铁甲圣骑兵将偕轻骑、轻步远赴军前，补足远征的行列。"
 oe_heg_support_expedition_effect: "向所选、仍拥有远征军改革的附庸首都派出四组当前时代军区步兵、四支当前时代拜占庭铁甲圣骑兵、四支当前时代普通轻骑兵及四组当前时代普通轻步兵。费用沿用旧远征支援标准：两个月收入及0.5人力；每月可执行一次。"
 oe_heg_end_expedition: "结束军事远征"
 oe_heg_end_expedition_desc: "使节携带封缄的诏书渡海而来：刀剑所得，如今须以法令与税册守护。命令远征将领停战，让临时的营帐让位于长久的治理。"
 oe_heg_end_expedition_effect: "不收取费用，立即结束所选远征军参与的全部战争。撤销远征军改革，并将其附庸类型改为罗马同盟。已直接征服的地点保留；此行动可重复执行。"
 oe_pillars_integrate_roman_alliance: "整合罗马同盟"
 oe_pillars_integrate_roman_alliance_desc: "十余年的盟誓与朝贡，使昔日藩邦的命运与帝国紧密相连。是时候将口头的忠诚写入行省的法令，让地方的军政权柄接受皇帝更直接的节制。"
 oe_pillars_integrate_roman_alliance_effect: "消耗5权威，将所选已臣属于东罗马超过十年、且对帝国好感不低于50的罗马同盟改为行省化附庸。"
 oe_heg_expedition: "远征军"
 oe_heg_expedition_desc: "奉帝国诏令出海的独立兵团，自行承担远征战争。其财赋与附庸数值参照罗马同盟，东罗马不会因其远征自动参战；和平后转为罗马同盟。"
 oe_heg_expedition_reform: "远征军"
 oe_heg_expedition_reform_desc: "军令暂代民政，营垒即为治所。改革实施需三天，围城效率提高33%，陆军士气提高20%，训练度提高5%，禁止自行议和。远征军在马格里布占领即征服，敌人夺取其领地时也立即据为己有；和平后撤销本改革。\n\n每月叛乱增长 #G −5%#!。"
 OE_HEG_AFRICA_EXPEDITION_COUNTRY: "北非远征军"
 OE_HEG_AFRICA_EXPEDITION_ADJ: "北非远征军"
 OE_HEG_EGYPT_PLAN_REQUIRED: "已完成“筹划入侵埃及”"
 OE_HEG_AFRICA_PLAN_REQUIRED: "已完成“筹划入侵北非”"
 OE_HEG_AFRICA_ALEXANDRIA: "东罗马或其附庸拥有亚历山大"
 OE_HEG_AUTHORITY_5: "拥有至少5权威"
 OE_HEG_CHOOSE_AFRICA_TARGET: "选择首都位于马格里布的国家"
 OE_HEG_CHOOSE_FOOTHOLD: "选择一处马格里布沿海农村作为登陆营地"
 OE_HEG_CHOOSE_EXPEDITION: "选择仍拥有远征军改革的帝国附庸"
 OE_HEG_NO_TARGETS: "@trigger_no!目前没有符合条件的国家"
 OE_HEG_EGYPT_PLAN_DONE: "已完成：筹划入侵埃及"
 OE_HEG_AFRICA_PLAN_DONE: "已完成：筹划入侵北非"
 OE_HEG_AFRICA_EXPEDITION_DONE: "已完成：北非远征"
 OE_HEG_AFRICA_ACTIONS_HINT: "所有北非行动均要求东罗马或其附庸拥有亚历山大。筹划与北非远征各限一次；支援、结束远征及入侵北非可重复执行。"
 OE_RW_AFRICA: "北非"
 OE_RW_AFRICA_DESC: "越过亚历山大的灯塔，便是阿非利加的旧日海岸。让航图指引舰队，再让胜利决定疆界。"
 OE_RW_AFRICA_OPEN: "查看北非行动"
 OE_RW_AFRICA_ACTIONS: "北非行动"
 OE_RW_AFRICA_HINT: "点击地图，在原地展开北非行动面板。"
 OE_RW_TUNIS: "突尼斯"
 OE_RW_TUNIS_OWNER: "突尼斯当前拥有者"
 oe_heg_expedition_supply_reform: "远征军供给制"
 oe_heg_expedition_supply_reform_desc: "远征军辎重与军饷由专署统筹，营垒所需不因远离帝都而断绝。仅远征军附庸可用，实施需三天：陆军维护效率提高1000%，每月获得25金币，单位食物消耗降低20%，最大厌战度降低15点。脱离远征军附庸身份后撤销。"
