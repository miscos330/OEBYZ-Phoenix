l_simp_chinese:
# NEW 2026-11-21 v9.8 Worker 1: Capitoline Hexapantheon 10 Gods & 50 Omens (oe_romp_). Generated by gen_romp_pantheon.py.
 oe_romp_cl_faith_roman:0 "罗马多神教"
 oe_romp_cl_faith_grecoroman:0 "希罗古典多神教"
 god_emperors:0 "神皇"
 heroes:0 "英雄"
 divine_emperors:0 "神圣帝皇"
 oe_romp_sol_invictus_god:0 "无敌太阳·赫利俄斯"
 oe_romp_sol_invictus_god.latin_language:0 "无敌太阳神"
 oe_romp_sol_invictus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_sol_invictus_god')]乃永恒天穹之主与罗马帝冠的护佑者。自奥勒良敕建太阳神殿、君士坦丁竖立斑岩巨柱，至尤利安作《太阳王颂》，光耀天宇的神威始终维系着普世法度与皇权正统。"
 oe_romp_sol_invictus_god_omen:0 "黎明穿透穹顶的云层，万道金辉倾泻在斑岩神柱与元老院阶梯之上。祭司举起金爵仰望长空，[ShowGodName('oe_romp_sol_invictus_god')]的炽烈光轮正垂照尘世……"
 oe_romp_omen_sol_eternal_dawn:0 "永恒旭日"
 oe_romp_omen_sol_eternal_dawn_desc:0 "太阳的晨辉照遍行省边陲，令郡县政令畅通无阻，帝国法度如光影随形。"
 oe_romp_omen_sol_celestial_sovereignty:0 "天穹统御"
 oe_romp_omen_sol_celestial_sovereignty_desc:0 "正如白日统御群星，紫衣皇权在太阳神的见证下凌驾诸阶层之上，政出一门。"
 oe_romp_omen_sol_radiant_law:0 "光耀法度"
 oe_romp_omen_sol_radiant_law_desc:0 "理智之光与天体秩序交相辉映，驱散蒙昧，令学园与官署的格物致知日新月异。"
 oe_romp_omen_sol_aurelian_crown:0 "奥勒良之冠"
 oe_romp_omen_sol_aurelian_crown_desc:0 "十二道金芒环绕帝冕，重现世界恢复者奥勒良的光辉，令四海藩邦无不敬仰。"
 oe_romp_omen_sol_solar_edict:0 "太阳赦令"
 oe_romp_omen_sol_solar_edict_desc:0 "在至日大祭颁布的赦令平息了城邦间的猜忌与纷争，令天下秩序迅速归于稳固。"
 oe_romp_juno_god:0 "天后赫拉"
 oe_romp_juno_god.latin_language:0 "天后朱诺·雷吉娜"
 oe_romp_juno_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_juno_god')]位列卡皮托利乌姆三主神，司掌王权正统、城邦盟约、币制监造与万民繁衍。她以孔雀羽冠俯瞰罗马，护佑元老与公民之家室长存。"
 oe_romp_juno_god_omen:0 "卡皮托利乌姆山巅的圣鹅齐声长鸣，金库铸币坊中传来清越的金属回响。孔雀翎影拂过神坛，[ShowGodName('oe_romp_juno_god')]已降下她庄严的庇佑……"
 oe_romp_omen_juno_moneta:0 "朱诺造币"
 oe_romp_omen_juno_moneta_desc:0 "圣丘之上的造币女神警醒司库、严校成色，令帝国金币成色如一而物价安稳。"
 oe_romp_omen_juno_regina:0 "天庭王后"
 oe_romp_omen_juno_regina_desc:0 "天后的威仪印证了紫袍帝室的天命传承，令宗室与臣民齐心尊奉正统。"
 oe_romp_omen_juno_sospita:0 "城邦庇佑"
 oe_romp_omen_juno_sospita_desc:0 "披覆山羊皮盾的救护女神庇佑四民各安其业，令帝国上下百业和睦、怨怼渐消。"
 oe_romp_omen_juno_lucina:0 "生息繁衍"
 oe_romp_omen_juno_lucina_desc:0 "司掌降生之光的女神眷顾万千家室，令城郭乡野人丁兴旺、生机勃发。"
 oe_romp_omen_juno_sacred_union:0 "神圣婚约"
 oe_romp_omen_juno_sacred_union_desc:0 "天后护持的誓约与联姻令邻邦信赖帝国的信义，外交使节所至皆获礼敬。"
 oe_romp_vesta_god:0 "灶神赫斯提亚"
 oe_romp_vesta_god.latin_language:0 "圣火圣母维斯塔"
 oe_romp_vesta_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_vesta_god')]乃罗马永恒圣火与国家灶台的守护女神。只要圆殿中的圣火由贞女们日夜守望不熄，罗马城邦的社稷、粮仓与民心便永不倾颓。"
 oe_romp_vesta_god_omen:0 "圆殿圣坛上的火苗无风自炽，化作一道清澄宁静的暖光，漫过广场的石柱与万户炊烟。[ShowGodName('oe_romp_vesta_god')]正静默守护着帝国的国本……"
 oe_romp_omen_vesta_eternal_flame:0 "永恒圣火"
 oe_romp_omen_vesta_eternal_flame_desc:0 "不熄的圣火象征国祚绵延，令朝野上下同舟共济，国家稳固之力源源不绝。"
 oe_romp_omen_vesta_hearth_peace:0 "万家安宁"
 oe_romp_omen_vesta_hearth_peace_desc:0 "圣火的暖意遍及乡邑市集，令战后创伤迅速愈合，万千城邦重归殷实繁华。"
 oe_romp_omen_vesta_full_granaries:0 "粮仓不竭"
 oe_romp_omen_vesta_full_granaries_desc:0 "祭司向圣火献上头茬麦饼与盐粒，田畴丰稔，公私仓廪皆满溢不竭。"
 oe_romp_omen_vesta_pure_precinct:0 "贞女净域"
 oe_romp_omen_vesta_pure_precinct_desc:0 "维斯塔贞女以清泉涤净坛宇与街巷，洁净之风遍及州郡，令疫疠难以滋蔓。"
 oe_romp_omen_vesta_enduring_realm:0 "国祚绵长"
 oe_romp_omen_vesta_enduring_realm_desc:0 "圣火长明之际，民心归向社稷，奸宄与叛乱之火在萌芽之时便自行熄灭。"
 oe_romp_asclepius_god:0 "医神阿斯克勒庇俄斯"
 oe_romp_asclepius_god.latin_language:0 "医神阿斯克勒庇俄斯—许癸厄亚"
 oe_romp_asclepius_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_asclepius_god')]手持盘蛇圣杖，与健康女神许癸厄亚共护埃皮达鲁斯、帕加马与台伯河岛的圣疗院。在黑死病与乱世阴霾笼罩的年代，医神之道救民于水火。"
 oe_romp_asclepius_god_omen:0 "清冽的药草芬芳萦绕在圣泉廊柱之间，温顺的圣蛇悄然游过石阶，病榻上的呻吟渐趋平息。[ShowGodName('oe_romp_asclepius_god')]的疗愈之手已覆临城邦……"
 oe_romp_omen_asclepius_serpent_staff:0 "蛇杖愈世"
 oe_romp_omen_asclepius_serpent_staff_desc:0 "圣蛇之杖的庇佑与帝国医师的诊治并施，大幅增强全境州郡抵御时疫之力。"
 oe_romp_omen_asclepius_plague_aegis:0 "黑死御盾"
 oe_romp_omen_asclepius_plague_aegis_desc:0 "仿照台伯河岛与帕加马圣疗院设立隔离净舍与清泉沐浴，筑起抵御黑死病的坚固屏障。"
 oe_romp_omen_asclepius_longevity:0 "长寿祝福"
 oe_romp_omen_asclepius_longevity_desc:0 "养生之术与清净饮食广传宫廷与民间，令君臣贤才与黎庶皆享遐龄。"
 oe_romp_omen_asclepius_sacred_spring:0 "圣泉疗养"
 oe_romp_omen_asclepius_sacred_spring_desc:0 "埃皮达鲁斯的灵泉与妇幼救护令产育平安、夭折锐减，帝国人口欣欣向荣。"
 oe_romp_omen_asclepius_hygieia_code:0 "卫生法典"
 oe_romp_omen_asclepius_hygieia_code_desc:0 "修缮水道、疏通沟渠并颁行疫病救济法度，大幅减轻瘟疫给国库与民力带来的损耗。"
 oe_romp_janus_god:0 "双面门神雅努斯"
 oe_romp_janus_god.latin_language:0 "双面门神雅努斯"
 oe_romp_janus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_janus_god')]乃罗马最古老的始元之神，双面回望过往、远瞻未来，掌管一切门户、条约、岁首与战和开关。和平降临时，雅努斯神殿的青铜大门隆重闭合；征战再起时，铜门大开以迎军团出征。"
 oe_romp_janus_god_omen:0 "晨雾中青铜门扉微微震颤，钥匙扣响清脆回荡在广场四周。过去与未来在门槛交汇，[ShowGodName('oe_romp_janus_god')]正为帝国开启新的时局……"
 oe_romp_omen_janus_closed_gates:0 "闭门和平"
 oe_romp_omen_janus_closed_gates_desc:0 "雅努斯铜门紧闭，四海偃武修文；国家处于和平之时，此神谕之繁荣与外交节省效能更将翻倍。"
 oe_romp_omen_janus_open_gates:0 "开门出征"
 oe_romp_omen_janus_open_gates_desc:0 "战时青铜大门洞开，元老与公民怀抱古罗马坚忍之志，纵历经久战亦不倦怠。"
 oe_romp_omen_janus_crossroads_trade:0 "通衢商门"
 oe_romp_omen_janus_crossroads_trade_desc:0 "雅努斯庇佑每一座城门、津渡与拱廊市集，令海陆商旅络绎不绝、关税丰盈。"
 oe_romp_omen_janus_new_year_augury:0 "新岁吉兆"
 oe_romp_omen_janus_new_year_augury_desc:0 "岁首卡伦德日献上的吉言与新法，令新附州郡加速融入罗马公民礼俗。"
 oe_romp_omen_janus_twofold_foresight:0 "双面先见"
 oe_romp_omen_janus_twofold_foresight_desc:0 "双面神明洞悉明暗两途，任何潜入宫廷与边关的细作密谋皆无所遁形。"
 oe_romp_apollo_god:0 "光明与艺术之神阿波罗"
 oe_romp_apollo_god.latin_language:0 "福玻斯·阿波罗"
 oe_romp_apollo_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_apollo_god')]乃预言、音乐、诗艺、理性与涤灾之神，坐镇德尔斐圣殿、提洛圣岛与帕拉蒂尼山神庙。自奥古斯都奉其为阿克提乌姆凯旋护主以来，阿波罗的金竖琴与月桂冠始终引领着古典文明的雅乐与哲思。"
 oe_romp_apollo_god_omen:0 "微风拂过月桂树梢，似有清越的金竖琴声自帕尔纳索斯山谷隐隐传来。圣泉水汽升腾之际，[ShowGodName('oe_romp_apollo_god')]的光明启示正降临凡间……"
 oe_romp_omen_apollo_muses_chorus:0 "缪斯合唱"
 oe_romp_omen_apollo_muses_chorus_desc:0 "阿波罗率领九位缪斯巡游帝都学园，令诗家、画师与哲人辈出，艺林群星璀璨。"
 oe_romp_omen_apollo_delphic_oracle:0 "德尔斐神谕"
 oe_romp_omen_apollo_delphic_oracle_desc:0 "帕尔纳索斯山巅的箴言启发学者穷究天人之际，大幅加快帝国典籍研习与科技革新。"
 oe_romp_omen_apollo_radiant_enlightenment:0 "光明启蒙"
 oe_romp_omen_apollo_radiant_enlightenment_desc:0 "光明之神的雅训鼓励城邦广设文法与修辞学院，全面抬升治下万民的识字上限。"
 oe_romp_omen_apollo_golden_lyre:0 "竖琴雅乐"
 oe_romp_omen_apollo_golden_lyre_desc:0 "皮提亚诗乐盛会与剧场颂歌交响，令帝国文化传统历久弥新、声播四海。"
 oe_romp_omen_apollo_purifying_arrows:0 "远矢涤灾"
 oe_romp_omen_apollo_purifying_arrows_desc:0 "远射之神既能降灾亦能涤疫，其银箭所指之处瘴疠消散、州郡安康。"
 oe_romp_isis_serapis_god:0 "伊西斯—塞拉皮斯"
 oe_romp_isis_serapis_god.latin_language:0 "航星圣母伊西斯—塞拉皮斯"
 oe_romp_isis_serapis_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_isis_serapis_god')]乃「罗马诠释」跨地中海合祀之典范：托勒密与罗马诸帝在亚历山大港将埃及丰饶航星女神伊西斯与塞拉皮斯大神融汇于古典万神殿，护佑尼罗河粮船、法罗斯灯塔与万邦共存之道。"
 oe_romp_isis_serapis_god_omen:0 "法罗斯灯塔的火光倒映在平静如镜的海面上，摇铃清音与莲香随海风飘过港湾。[ShowGodName('oe_romp_isis_serapis_god')]正为远航的商帆与尼罗河岸洒下星辉……"
 oe_romp_omen_isis_nile_flood:0 "尼罗河丰水"
 oe_romp_omen_isis_nile_flood_desc:0 "女神泪落天狼星升起之时，大河沃野丰收如潮，帝国粮船源源不断驶向君堡与罗马。"
 oe_romp_omen_isis_pelagia_star:0 "法罗斯航星"
 oe_romp_omen_isis_pelagia_star_desc:0 "护海圣母展开风帆指引夜航，令帝国舰队与海商在波涛之间畅行无阻、利市倍增。"
 oe_romp_omen_isis_myrionymos:0 "万名女神"
 oe_romp_omen_isis_myrionymos_desc:0 "万邦百姓皆以各自语言呼唤同一位慈悲圣母，令不同信仰的臣民在帝国羽翼下安居乐业。"
 oe_romp_omen_isis_serapeum_scrolls:0 "塞拉皮斯秘藏"
 oe_romp_omen_isis_serapeum_scrolls_desc:0 "亚历山大港塞拉皮斯神庙的书卷传抄四方，润物无声地提升全境城邦的月度识字率。"
 oe_romp_omen_isis_mediterranean_league:0 "地中海商盟"
 oe_romp_omen_isis_mediterranean_league_desc:0 "从亚历山大港到奥斯提亚与金角湾的航星公会结成紧密商网，大幅增强帝国商人在各市集的话语权。"
 oe_romp_quirinus_mars_god:0 "复仇战神与罗慕路斯"
 oe_romp_quirinus_mars_god.latin_language:0 "复仇战神·奎里努斯"
 oe_romp_quirinus_mars_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_quirinus_mars_god')]合奥古斯都所建复仇战神（Mars Ultor）与罗马开国神君奎里努斯（罗慕路斯）为一脉，迥异于暴虐嗜血的战场狂怒，专司罗马军团之铁律、鹰旗荣光、边墙防务与公民军威。"
 oe_romp_quirinus_mars_god_omen:0 "军团营垒中的青铜圣盾无风自鸣，鹰旗金翅在暮色下映出冷冽寒芒。全军将士齐声诵念罗马军誓，[ShowGodName('oe_romp_quirinus_mars_god')]正检阅着他的铁血步卒……"
 oe_romp_omen_quirinus_iron_legions:0 "铁血军团"
 oe_romp_omen_quirinus_iron_legions_desc:0 "方盾如墙、短剑如林，罗马重装步兵在奎里努斯神威下宛如不可动摇的移动城垣。"
 oe_romp_omen_quirinus_aquila_discipline:0 "鹰旗律令"
 oe_romp_omen_quirinus_aquila_discipline_desc:0 "军令如山、进退合度，严苛的罗马军法化作临阵不乱的钢铁纪律。"
 oe_romp_omen_quirinus_siegecraft:0 "攻城破壁"
 oe_romp_omen_quirinus_siegecraft_desc:0 "罗马军团工兵架起弩炮、土坡与撞城锤，再坚固的敌垒在复仇战神面前亦将瓦解。"
 oe_romp_omen_quirinus_limes_ramparts:0 "边墙永固"
 oe_romp_omen_quirinus_limes_ramparts_desc:0 "自多瑙河至幼发拉底河的界墙堡垒井然有序，驻军自给有方，大幅节省要塞维护开支。"
 oe_romp_omen_quirinus_triumphal_oath:0 "凯旋誓愿"
 oe_romp_omen_quirinus_triumphal_oath_desc:0 "出征前在复仇战神庙前立下的凯旋誓愿点燃全军斗志，誓将敌酋旗帜献于圣坛。"
 oe_romp_mithras_god:0 "光明神密特拉"
 oe_romp_mithras_god.latin_language:0 "无敌密特拉"
 oe_romp_mithras_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_mithras_god')]源于安纳托利亚与伊朗高原的契约光明之神，经「罗马诠释」成为横贯罗马全军边防要塞的秘仪战友神祇。在地下密特拉石窟中结下铁血誓约的百夫长与铁甲骑兵，视无敌密特拉为忠勇、远征与不屈之魂。"
 oe_romp_mithras_god_omen:0 "地下石窟的火炬骤然明亮，浮雕上屠牛迎光的神像泛起赤金辉泽。铁甲骑兵抚剑齐呼秘仪誓词，[ShowGodName('oe_romp_mithras_god')]已将百战之勇注入军阵……"
 oe_romp_omen_mithras_cataphracts:0 "圣铁甲骑兵"
 oe_romp_omen_mithras_cataphracts_desc:0 "融合安纳托利亚与波斯精骑之术的帝国圣铁甲骑兵如烈日雷霆般冲溃敌阵。"
 oe_romp_omen_mithras_mithraeum_oath:0 "地窟誓约"
 oe_romp_omen_mithras_mithraeum_oath_desc:0 "在密特拉石窟结下生死契约的战友互为盾墙，临危不惧，全军士气昂扬如虹。"
 oe_romp_omen_mithras_veteran_ranks:0 "百战老兵"
 oe_romp_omen_mithras_veteran_ranks_desc:0 "七阶秘仪试炼将新兵淬炼为久经沙场的百夫长与军团宿将，帝国陆军传统日臻深厚。"
 oe_romp_omen_mithras_solar_campaign:0 "光明远征"
 oe_romp_omen_mithras_solar_campaign_desc:0 "无敌密特拉的光契佑护跨越荒漠与高原的补给纵队，令帝国大军得以万里奔袭。"
 oe_romp_omen_mithras_tauroctony_vigor:0 "公牛祭力"
 oe_romp_omen_mithras_tauroctony_vigor_desc:0 "密特拉屠牛创生之秘力化作源源不绝的兵源生机，令残损军团迅速整补重返前线。"
 oe_romp_cybele_god:0 "众神之母库柏勒"
 oe_romp_cybele_god.latin_language:0 "大母神库柏勒"
 oe_romp_cybele_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_cybele_god')]头戴城垛金冠、乘双狮战车，原祀于弗里吉亚佩西努斯圣山。第二次布匿战争危亡之际，罗马元老院遵西比尔神谕迎请其黑石入驻帕拉蒂尼山，尊为「大母神（Magna Mater）」，永护帝国山河城郭固若金汤。"
 oe_romp_cybele_god_omen:0 "浑厚的青铜手鼓与长笛回荡在城垣塔楼之间，双狮石雕在晨曦中宛若昂首长啸。[ShowGodName('oe_romp_cybele_god')]的城垛金冠正笼罩着帝国的关隘与沃土……"
 oe_romp_omen_cybele_mural_crown:0 "塔冠城防"
 oe_romp_omen_cybele_mural_crown_desc:0 "头戴城墙王冠的大母神庇佑每一座棱堡与石墙，令围城敌军寸步难进。"
 oe_romp_omen_cybele_lion_garrison:0 "石狮守备"
 oe_romp_omen_cybele_lion_garrison_desc:0 "守望城门的圣狮赋予城防军充沛兵员，纵遭大军合围亦能死守待援。"
 oe_romp_omen_cybele_sacred_mountain:0 "神山庇佑"
 oe_romp_omen_cybele_sacred_mountain_desc:0 "弗里吉亚圣山的山岚与险隘令入侵之敌疫病饥疲、损耗惨重。"
 oe_romp_omen_cybele_fertile_earth:0 "丰土育民"
 oe_romp_omen_cybele_fertile_earth_desc:0 "大地之母令高原河谷五谷丰登、牧草繁茂，稳固帝国长期征战的粮秣根本。"
 oe_romp_omen_cybele_bronze_drums:0 "铜鼓励军"
 oe_romp_omen_cybele_bronze_drums_desc:0 "震天动地的祭祀铜鼓唤醒将士血脉中的无畏豪情，令休整中的部队士气飞速回升。"
