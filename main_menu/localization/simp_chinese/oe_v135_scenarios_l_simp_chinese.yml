 oe_scn.16.t: "《凤凰计划》十二主角典藏名录 · 第四页 / 共四页 · 东瀛幕府、高原圣约与新世界抗衡"
 oe_scn.16.d: "#T 【10】室町日本 · 四大神道派系与战国新风（JAP · 首都：京都）#!\n#W 风格：#!宗派博弈与武家革制　｜　#W 难度：#!资深领航\n#W 室町日本#!据守古都#W 京都#!，在南北朝风潮、幕府权衡与东亚海贸间孕育出独步东瀛的武家与神道文明。在《凤凰计划》中，你将体验全量原生接入的#T 四大神道思想派系#!（吉田、度会、垂加、两部）与#T 幕府大老摄政#!；在战场祭出#T 铁炮三段击齐射#!，于堺港（和泉）授发#T 会合众自治市宪章#!，并迎请雪舟与狩野永德绘制金碧障壁传世长卷！\n\n#T 【11】所罗门埃塞俄比亚 · 高原圣约与红海雄狮（ETH · 首都：安科贝尔）#!\n#W 风格：#!经教复兴与跨海联纵　｜　#W 难度：#!资深领航\n#W 所罗门埃塞俄比亚#!雄踞阿比西尼亚高原，在阿姆达·塞永大帝治下势震红海，是《凤凰计划》#T 非洲三轴#!头号主角。你将亲历扎拉·雅各布宗教改革与#T 东方正统经教2.0#!，体验#T 牧首与元老联合监国#!摄政；更可与君士坦丁堡和里斯本开启#T 祭司王约翰跨海同盟#!，直取亚丁与基尔瓦贯通红海—印度洋！\n\n#T 【12】特诺奇蒂特兰 · 湖心金字塔与新世界抗衡（TNC · 首都：特诺奇蒂特兰）#!\n#W 风格：#!中美洲统一与跨洋抗衡　｜　#W 难度：#!进阶挑战\n#W 特诺奇蒂特兰#!初建于特斯科科湖心岛屿，在祭司王特诺奇引领下即将崛起为震撼新世界的墨西加帝国！在《凤凰计划》中，你将领衔#T 美洲本土史诗#!，修建#T 奇南帕浮田农艺综合体#!并授发#T 奇南帕浮田宪章#!；零DLC激活#T 特奥蒂瓦坎太阳金字塔#!与#T 乔卢拉圣城#!奇观改革，率新世界联盟正面抗衡欧陆殖民者与极乐洲新罗马！"
