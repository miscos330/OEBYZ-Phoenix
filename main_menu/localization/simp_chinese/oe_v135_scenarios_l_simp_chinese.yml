# NEW 2026-11-22 v13.5 Worker 4: 12 Curated 1337 Scenarios & Roster (oe_scn_). Generated by gen_v135_scenarios.py; edit the generator, not this file.
 oe_scenario_01_byz: "拜占庭帝国 · 君士坦丁堡的凤凰"
 oe_scenario_01_byz_desc: "#W 拜占庭帝国#!在1337年虽已褪去昔日盛世余晖，仍踞守欧亚咽喉#W 君士坦丁堡#!与千年罗马法统。在《凤凰计划》中，你将亲历#T 凤凰涅槃#!与#T 军区2.0#!重塑，执掌#T 希腊火虹吸#!、#T 罗马法典编纂宗师#!与#T 罗马多神复兴#!分线；既可跨海远航开辟#T 第四奥德赛·极乐洲新罗马#!，亦可重开东西两帝博弈与万国协调会，在逆境中书写第二罗马的永生史诗。"
 oe_scenario_02_chi: "大元天朝 · 万邦来朝之极"
 oe_scenario_02_chi_desc: "#W 大元天朝#!以#W 大都#!为中枢，北控漠北草原，南揽江南漕运与海上丝路。在《凤凰计划》中，你将执掌#T 天朝日不落#!四轨分封羁縻体系，在至正中兴、明清鼎革与改土归流间运筹帷幄；更有#T 景德镇浮梁御窑#!、#T 江南丝织市镇#!、#T 市舶司番坊#!、#T 经世文宗#!与#T 天朝册封朝贡和约#!等你亲自铺展天下秩序。"
 oe_scenario_03_mos: "莫斯科大公国 · 第三罗马的曙光"
 oe_scenario_03_mos_desc: "#W 莫斯科大公国#!正蓄势于罗斯林原之上，准备挣脱金帐汗国的鞑靼枷锁并统一全罗斯。在《凤凰计划》中，你将依托#T 波雅尔杜马摄政#!、#T 诺夫哥罗德毛皮商宪章#!与#T 战车大营宿营#!战术步步崛起；迎请希腊人塞奥法内斯绘制圣像壁画，南下黑海缔结#T 库楚克-凯纳吉海峡通航#!，东拓西伯利亚共议#T 尼布楚划界协定#!，铸就北方第三罗马！"
 oe_scenario_04_glh: "术赤金帐汗国 · 草原五翼霸主"
 oe_scenario_04_glh_desc: "#W 术赤金帐汗国#!在月即别汗治下正处鼎盛，自#W 新萨莱#!俯瞰伏尔加河、克里米亚与钦察大草原。在《凤凰计划》中，你将直面#T 术赤汗廷大乱#!试炼，平衡#T 术赤五翼封汗#!与#T 库里台摄政#!，策动#T 八旗/草原铁骑突贯#!；贯通卡法、阿斯特拉罕与撒马尔罕丝路驿市，重演横跨欧亚草原的苍狼雄图。"
 oe_scenario_05_mam: "马穆鲁克埃及 · 红海与圣地守护者"
 oe_scenario_05_mam_desc: "#W 马穆鲁克埃及#!执掌尼罗河沃土、#W 开罗#!大城与两圣地护教大义，扼守地中海与印度洋之间最富庶的香料咽喉。在《凤凰计划》中，你将操演#T 骑士道长矛操演（Furusiyya）#!，守护#T 吉萨金字塔#!、#T 耶路撒冷#!与#T 麦加克尔白#!奇观圣地；经略红海—亚丁商道并反制大航海海洋垄断，以#T 废除卡塔兹和约#!捍卫印洋自由商路！"
 oe_scenario_06_pol: "波兰王国 · 雅盖隆联邦与欧陆均势"
 oe_scenario_06_pol_desc: "#W 波兰王国#!在卡齐米日大帝治下自#W 克拉科夫#!励精图治，北望波罗的海，东联立陶宛大公国。在《凤凰计划》中，你将缔造#T 波兰-立陶宛大联邦#!，体验波兰专属#T 首席大主教摄政（Interrex）#!与#T 战车大营#!军阵；授发#T 格但斯克汉萨自由港宪章#!，更可以#T 华沙宗教宽容#!与#T 威斯特伐利亚主权和约#!领航中东欧均势秩序！"
 oe_scenario_07_ven: "威尼斯共和国 · 泻湖之王与穆拉诺匠心"
 oe_scenario_07_ven_desc: "#W 威尼斯共和国#!凭百余座泻湖岛屿与纵横黎凡特的桨帆商队称雄地中海。在《凤凰计划》中，你将独享抢占原版选举机制的#T 十人委员会紧急摄政#!、#T 巨型桨帆侧舷齐射（Galeazza）#!与#T 威尼斯德意志商馆宪章#!；礼聘#T 穆拉诺光学与制钟巨匠#!打造《圣马可天文钟机图》，并以#T 《海洋自由论》开海#!与#T 吊销私掠和约#!称霸地中海贸易网络！"
 oe_scenario_08_jal: "札剌亦儿波斯 · 巴格达与伊儿汗正统"
 oe_scenario_08_jal_desc: "#W 札剌亦儿王朝#!在伊儿汗国瓦解之际稳控#W 巴格达#!与两河平原，是《凤凰计划》#T 波斯战区一号主角#!。你将亲历伊朗高原群雄逐鹿，以#T 阿塔贝格军事摄政#!驾驭骑兵宗室，守护#T 萨迈拉大清真寺#!奇观，授发#T 大巴扎御准商馆宪章#!；更可迎请#T 波斯细密画宗师#!贝赫扎德与礼萨·阿巴西，令波斯文艺复兴照耀两河与霍尔木兹！"
 oe_scenario_09_vij: "毗奢耶那伽罗 · 德干胜利之城"
 oe_scenario_09_vij_desc: "#W 毗奢耶那伽罗#!甫立于通加巴德拉河畔，正肩负统一南印德干、沟通马拉巴尔香料海岸的历史使命。在《凤凰计划》中，你将征战#T 印度战区#!，守护#T 斯里兰甘大神庙#!与#T 桑奇大塔#!奇观圣地，礼聘#T 印波画院博物巨匠#!；在科泽科德（卡利卡特）与果阿授发#T 季风香料自由港宪章#!，并以#T 废除卡塔兹和约#!反制印洋殖民垄断！"
 oe_scenario_10_jap: "室町日本 · 四大神道派系与战国新风"
 oe_scenario_10_jap_desc: "#W 室町日本#!据守古都#W 京都#!，在南北朝风潮、幕府权衡与东亚海贸间孕育出独步东瀛的武家与神道文明。在《凤凰计划》中，你将体验全量原生接入的#T 四大神道思想派系#!（吉田、度会、垂加、两部）与#T 幕府大老摄政#!；在战场祭出#T 铁炮三段击齐射#!，于堺港（和泉）授发#T 会合众自治市宪章#!，并迎请雪舟与狩野永德绘制金碧障壁传世长卷！"
 oe_scenario_11_eth: "所罗门埃塞俄比亚 · 高原圣约与红海雄狮"
 oe_scenario_11_eth_desc: "#W 所罗门埃塞俄比亚#!雄踞阿比西尼亚高原，在阿姆达·塞永大帝治下势震红海，是《凤凰计划》#T 非洲三轴#!头号主角。你将亲历扎拉·雅各布宗教改革与#T 东方正统经教2.0#!，体验#T 牧首与元老联合监国#!摄政；更可与君士坦丁堡和里斯本开启#T 祭司王约翰跨海同盟#!，直取亚丁与基尔瓦贯通红海—印度洋！"
 oe_scenario_12_tnc: "特诺奇蒂特兰 · 湖心金字塔与新世界抗衡"
 oe_scenario_12_tnc_desc: "#W 特诺奇蒂特兰#!初建于特斯科科湖心岛屿，在祭司王特诺奇引领下即将崛起为震撼新世界的墨西加帝国！在《凤凰计划》中，你将领衔#T 美洲本土史诗#!，修建#T 奇南帕浮田农艺综合体#!并授发#T 奇南帕浮田宪章#!；零DLC激活#T 特奥蒂瓦坎太阳金字塔#!与#T 乔卢拉圣城#!奇观改革，率新世界联盟正面抗衡欧陆殖民者与极乐洲新罗马！"
