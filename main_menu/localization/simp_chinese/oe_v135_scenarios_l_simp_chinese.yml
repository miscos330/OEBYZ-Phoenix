 oe_scn.14.t: "《凤凰计划》十二主角典藏名录 · 第二页 / 共四页 · 草原、红海与波罗的海十字路口"
 oe_scn.14.d: "#T 【04】术赤金帐汗国 · 草原五翼霸主（GLH · 首都：新萨莱）#!\n#W 风格：#!骑兵铁蹄与草原共治　｜　#W 难度：#!资深领航\n#W 术赤金帐汗国#!在月即别汗治下正处鼎盛，自#W 新萨莱#!俯瞰伏尔加河、克里米亚与钦察大草原。在《凤凰计划》中，你将直面#T 术赤汗廷大乱#!试炼，平衡#T 术赤五翼封汗#!与#T 库里台摄政#!，策动#T 八旗/草原铁骑突贯#!；贯通卡法、阿斯特拉罕与撒马尔罕丝路驿市，重演横跨欧亚草原的苍狼雄图。\n\n#T 【05】马穆鲁克埃及 · 红海与圣地守护者（MAM · 首都：开罗）#!\n#W 风格：#!精锐骑兵与香料海权　｜　#W 难度：#!入门首选\n#W 马穆鲁克埃及#!执掌尼罗河沃土、#W 开罗#!大城与两圣地护教大义，扼守地中海与印度洋之间最富庶的香料咽喉。在《凤凰计划》中，你将操演#T 骑士道长矛操演（Furusiyya）#!，守护#T 吉萨金字塔#!、#T 耶路撒冷#!与#T 麦加克尔白#!奇观圣地；经略红海—亚丁商道并反制大航海海洋垄断，以#T 废除卡塔兹和约#!捍卫印洋自由商路！\n\n#T 【06】波兰王国 · 雅盖隆联邦与欧陆均势（POL · 首都：克拉科夫）#!\n#W 风格：#!联姻外交与宗教宽容　｜　#W 难度：#!入门首选\n#W 波兰王国#!在卡齐米日大帝治下自#W 克拉科夫#!励精图治，北望波罗的海，东联立陶宛大公国。在《凤凰计划》中，你将缔造#T 波兰-立陶宛大联邦#!，体验波兰专属#T 首席大主教摄政（Interrex）#!与#T 战车大营#!军阵；授发#T 格但斯克汉萨自由港宪章#!，更可以#T 华沙宗教宽容#!与#T 威斯特伐利亚主权和约#!领航中东欧均势秩序！"
