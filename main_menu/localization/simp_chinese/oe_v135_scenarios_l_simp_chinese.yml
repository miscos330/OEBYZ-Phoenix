 oe_scn_view_12_roster.title: "翻阅《凤凰计划》十二主角典藏名录"
 oe_scn_view_12_roster.desc: "展开《凤凰计划》1337年十二位精选主角全景典籍，随时查阅拜占庭、大元、莫斯科、金帐、马穆鲁克、波兰、威尼斯、札剌亦儿波斯、毗奢耶那伽罗、室町日本、所罗门埃塞俄比亚与特诺奇蒂特兰的风格星级与全线专属玩法路线图（纯信息导览，零消耗、随时可阅）。"
 oe_scn_view_12_roster.a: "展开《十二主角典藏名录》（四页全景交互典籍）"
 oe_scn_view_12_roster_tt: "打开#T 《凤凰计划》十二主角典藏名录#!（共 4 页，可自由翻阅 12 国开局特色与专属路线，不消耗任何资源）。"
 oe_scn_briefing_ack_tt: "收起本国开局导览（随时可通过内政决议#W 《翻阅〈凤凰计划〉十二主角典藏名录》#!再次查阅全部 12 国路线图）。"
 oe_scn_open_roster_tt: "立即展开四页交互式#T 《凤凰计划》十二主角典藏名录#!，一览欧、亚、非、美 12 国特色玩法。"
 oe_scn.1.t: "开局精选导览 · 拜占庭帝国（君士坦丁堡）"
 oe_scn.1.d: "#T 【精选主角 No.01｜拜占庭帝国（BYZ）· 首都：君士坦丁堡】#!\n#W 推荐风格：#!内政与帝国治术　｜　#W 推荐难度：#!进阶挑战\n\n公元1337年，帕里奥洛格王朝面对奥斯曼铁骑、塞尔维亚强邻与威尼斯商权的四面合围，却仍手握君士坦丁堡三重城墙、查士丁尼法统与爱琴海航道。君士坦丁·哈梅诺普洛斯行将在塞萨洛尼基编成《六书》，马其顿画派亦在阿索斯山留下不朽湿壁画。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 帝国中兴与制度精雕：#!平定1341/1352内战、推行军区2.0与近卫大区政务院、掌控帝国熵增迈向盛世永安。\n· #W 传世大师与军事海权：#!招募罗马法典编纂宗师、启动德罗蒙战舰希腊火虹吸突袭、依托黑海-爱琴海转运港宪章重振商贸。\n· #W 史诗分线与世界棋局：#!抉择东正普世牧首或罗马多神复兴，远渡大西洋建立极乐洲新罗马，并于近代缔结威斯特伐利亚与列强均势和约。"
 oe_scn.1.a: "承接双头鹰圣旨，开启拜占庭中兴征程"
 oe_scn.1.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.2.t: "开局精选导览 · 大元天朝（大都）"
 oe_scn.2.d: "#T 【精选主角 No.02｜大元天朝（CHI）· 首都：大都】#!\n#W 推荐风格：#!内政与天朝秩序　｜　#W 推荐难度：#!资深领航\n\n公元1337年，元顺帝妥懽帖睦尔坐镇大都，海内虽暗涌宝钞通胀与黄河水患，然东起泉州刺桐港、西通河中驿道、北抵和林的万里帝国仍居天下之冠。无论是稳住至正中兴与东宫朝局，还是顺应历史迈向明清海陆盛世，中华礼法与百工技艺皆将重塑东亚与印洋。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 天朝日不落与四轨治术：#!协调投下藩王、宣慰司羁縻、改土归流与四海都护，兼顾太后垂帘听政或库里台/顾命摄政体制。\n· #W 御窑名作与名城宪章：#!在浮梁（景德镇）、苏州、应天与泉州授予御窑、丝织市镇与市舶司宪章，礼聘御窑督陶官与经世文宗，守护曲阜孔庙与乐山大佛奇观。\n· #W 陆海外交与历史和约：#!以八旗铁骑或神机营威服四方，于和谈中施行天朝册封朝贡、尼布楚划界与丝路商队豁免协定。"
 oe_scn.2.a: "奉天承运，展开大元天朝经略天下之策"
 oe_scn.2.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.3.t: "开局精选导览 · 莫斯科大公国（莫斯科）"
 oe_scn.3.d: "#T 【精选主角 No.03｜莫斯科大公国（MOS）· 首都：莫斯科】#!\n#W 推荐风格：#!军事扩张与欧亚整合　｜　#W 推荐难度：#!入门首选\n\n公元1337年，伊凡一世“钱袋公”凭借稳健的财税与教会支持，使莫斯科成为罗斯诸公中势头最盛的崛起力量。向北可揽诺夫哥罗德毛皮商网，向南将迎战术赤金帐汗国并迈向黑海，向东则是一望无际的欧亚大陆腹地。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 挣脱枷锁与第三罗马：#!终结鞑靼枷锁、集结罗斯诸公、在波雅尔杜马与东正牧首法统间确立沙皇皇权。\n· #W 战车大营与近代军改：#!在草原决战启用战车大营宿营，历经射击军与新式团改革，授予莫斯科/诺夫哥罗德北方毛皮商宪章。\n· #W 跨欧亚外交和约：#!迎请塞奥法内斯创作传世变容圣像，并以库楚克-凯纳吉海峡通航、尼布楚划界与永久和平条款奠定欧亚强权地位。"
 oe_scn.3.a: "集结罗斯诸公，向第三罗马进发"
 oe_scn.3.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.4.t: "开局精选导览 · 术赤金帐汗国（新萨莱）"
 oe_scn.4.d: "#T 【精选主角 No.04｜术赤金帐汗国（GLH）· 首都：新萨莱】#!\n#W 推荐风格：#!骑兵铁蹄与草原共治　｜　#W 推荐难度：#!资深领航\n\n公元1337年，术赤兀鲁思坐拥伏尔加下游大城新萨莱，西控罗斯诸公朝贡，南接黑海热那亚卡法港，东连河中与大元驿道。然而辉煌之下，汗位继承与宗王裂土的暗流正在积聚，唯有铁腕与远见方能维系草原帝国的统一。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 汗廷大乱与五翼凝聚：#!应对金帐动荡局势，统筹五翼封汗与汗廷凝聚度，借库里台摄政稳定宗王秩序。\n· #W 铁骑突贯与丝路名城：#!率骑兵编队发动突贯冲阵，在撒马尔罕、喀什、阿斯特拉罕与卡法授发丝路驿市与转运港宪章。\n· #W 跨欧亚和约外交：#!在欧亚决战中强签丝路商队豁免、白银岁币赔款与拆解列强霸权条款，令钦察草原永为天下枢纽。"
 oe_scn.4.a: "扬起九尾白纛，统御钦察大草原"
 oe_scn.4.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.5.t: "开局精选导览 · 马穆鲁克埃及（开罗）"
 oe_scn.5.d: "#T 【精选主角 No.05｜马穆鲁克埃及（MAM）· 首都：开罗】#!\n#W 推荐风格：#!精锐骑兵与香料海权　｜　#W 推荐难度：#!入门首选\n\n公元1337年，巴赫里王朝苏丹纳西尔·穆罕默德将开罗建为伊斯兰世界最繁华的都城。东通印度洋胡椒航路，西接威尼斯与热那亚商船，北面则是群雄竞逐的安纳托利亚与叙利亚走廊。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 骑士道军威与红海前传：#!通过马穆鲁克骑士道长矛操演锻造无敌重骑，在红海与阿拉伯海直面海权角逐与迪乌海战格局。\n· #W 三大奇观与咽喉名城：#!零DLC激活吉萨大金字塔、麦加克尔白与耶路撒冷圣地守护诏令，并在亚历山大与亚丁授发转运港及海峡香料港宪章。\n· #W 反垄断海洋和约：#!凭海军与财力迫使西方列强签署废除卡塔兹垄断、海峡自由通航与吊销私掠特许状和约。"
 oe_scn.5.a: "执掌苏丹军旗，守护尼罗河与红海商道"
 oe_scn.5.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.6.t: "开局精选导览 · 波兰王国（克拉科夫）"
 oe_scn.6.d: "#T 【精选主角 No.06｜波兰王国（POL）· 首都：克拉科夫】#!\n#W 推荐风格：#!联姻外交与宗教宽容　｜　#W 推荐难度：#!入门首选\n\n公元1337年，皮亚斯特王朝末代雄主卡齐米日三世正以法典、石城与商路重塑波兰。西有神圣罗马帝国与条顿骑士团，东有立陶宛与罗斯沃野，南有匈牙利与巴尔干门户。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 联邦崛起与大主教监国：#!推进波兰-立陶宛联合与贵族共和宪政，在空位摄政期触发波兰专属首席大主教（Interrex）摄政体制。\n· #W 战车军阵与波罗的海商港：#!野战部署战车大营宿营阵，夺取并授予格但斯克汉萨自由港与货栈宪章，执掌波罗的海粮木贸易。\n· #W 宽容外交与欧陆和约：#!在中东欧博弈中施行强制宗教宽容敕令、永久和平盟约、威斯特伐利亚主权与边疆非军事化协定。"
 oe_scn.6.a: "高举白鹰王徽，开创波兰联邦盛世"
 oe_scn.6.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.7.t: "开局精选导览 · 威尼斯共和国（威尼斯）"
 oe_scn.7.d: "#T 【精选主角 No.07｜威尼斯共和国（VEN）· 首都：威尼斯】#!\n#W 推荐风格：#!商业海权与共和外交　｜　#W 推荐难度：#!资深领航\n\n公元1337年，圣马可飞狮的旗帜飘扬在亚得里亚海、克里特与爱琴海航线上。热那亚宿敌虎视眈眈，奥斯曼与拜占庭在东方风云变幻，而穆拉诺岛的玻璃炉火正孕育文艺复兴的光学奇迹。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 共和铁律与十人委员会：#!在总督更迭危机中触发专属十人委员会紧急摄政，稳守共和传统与商民阶层根基。\n· #W 穆拉诺匠艺与德意志商馆：#!招募穆拉诺光学与制钟巨匠及大航海舆图总师，缔造圣马可天文钟名作，在威尼斯授发德意志商馆（Fondaco）宪章。\n· #W 巨舰侧舷与海权和约：#!以巨型桨帆战舰（Galeazza）侧舷齐射压制地中海舰队，迫签海洋自由论开海、特许商馆口岸与归还掠夺传世名作条款。"
 oe_scn.7.a: "升起圣马可飞狮旗，统御亚得里亚海航道"
 oe_scn.7.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.8.t: "开局精选导览 · 札剌亦儿波斯（巴格达）"
 oe_scn.8.d: "#T 【精选主角 No.08｜札剌亦儿波斯（JAL）· 首都：巴格达】#!\n#W 推荐风格：#!中东争霸与波斯文脉　｜　#W 推荐难度：#!资深领航\n\n公元1337年，大哈桑以巴格达与两河流域为根基建立札剌亦儿王朝，西邻马穆鲁克与安纳托利亚，东接波斯诸侯大不里士与赫拉特，南临波斯湾霍尔木兹门户。在帖木儿尚未出世之际，正是由你问鼎伊儿汗遗产、再造波斯大帝国的黄金窗口！\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 波斯战区与阿塔贝格摄政：#!争雄大不里士、伊斯法罕与赫拉特，体验伊朗专属阿塔贝格军事监护摄政与骑士道长矛操演。\n· #W 波斯细密画与名城奇观：#!招募波斯细密画宗师缔造贝赫扎德《布斯坦》与阿巴西诗卷，零DLC激活萨迈拉奇观，并在大不里士/伊斯法罕/霍尔木兹授予大巴扎与海峡商港宪章。\n· #W 欧亚商路和约：#!借丝路商队豁免、典籍引渡与名作强制归还条款，令巴格达与伊朗重归欧亚文明中心。"
 oe_scn.8.a: "执剑出征巴格达，重铸波斯-两河荣光"
 oe_scn.8.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.9.t: "开局精选导览 · 毗奢耶那伽罗（毗奢耶那伽罗）"
 oe_scn.9.d: "#T 【精选主角 No.09｜毗奢耶那伽罗（VIJ）· 首都：毗奢耶那伽罗】#!\n#W 推荐风格：#!德干统一与季风海贸　｜　#W 推荐难度：#!入门首选\n\n公元1337年，桑伽马兄弟刚刚筑起“胜利之城”毗奢耶那伽罗。南面是富庶的泰米尔圣城与锡兰海峡，西面是直通阿拉伯海与红海的卡利卡特胡椒商港，北面则是群雄竞逐的德里与德干高原。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 德干统合与印度战区：#!收复南印诸邦、稳固通加巴德拉都城，并北上角逐全印霸权与海上丝路中枢地位。\n· #W 圣地奇观与博物名作：#!零DLC激活斯里兰甘大神庙、桑奇大塔与菩提伽耶圣地联动，招募印波画院博物巨匠创作传世珍禽图谱。\n· #W 季风自由港与反垄断和约：#!在科泽科德（卡利卡特）、果阿与马六甲授予季风商港宪章，签下废除卡塔兹垄断与海洋自由论和约主导印度洋。"
 oe_scn.9.a: "守护胜利之城，启航印度洋季风盛世"
 oe_scn.9.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.10.t: "开局精选导览 · 室町日本（京都）"
 oe_scn.10.d: "#T 【精选主角 No.10｜室町日本（JAP）· 首都：京都】#!\n#W 推荐风格：#!宗派博弈与武家革制　｜　#W 推荐难度：#!资深领航\n\n公元1337年，京都正处于南北朝动荡与室町幕府草创的历史转折点。列岛之内武家、公家与大寺林立，海峡之外则连结大元/明清与朝鲜的勘合海贸航道。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 四大神道派系与幕府大老：#!通过原生神道面板运筹吉田、度会、垂加与两部四大神道派系共10项弘法动作，空位期触发幕府大老（Tairo）摄政。\n· #W 铁炮三段击与堺港自治：#!步入火器纪元启用铁炮三段击齐射，在和泉（堺港）、博多与长崎授发会合众自治市宪章，并零DLC守护比睿山延历寺圣地。\n· #W 水墨障壁与东亚海权：#!礼聘东瀛水墨与障屏宗师见证雪舟《四季山水长卷》与狩野永德《唐狮子图》，以海外通商口岸与海洋自由和约经略东亚海。"
 oe_scn.10.a: "统合京都朝野，开启东瀛神道与武家盛世"
 oe_scn.10.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.11.t: "开局精选导览 · 所罗门埃塞俄比亚（安科贝尔）"
 oe_scn.11.d: "#T 【精选主角 No.11｜所罗门埃塞俄比亚（ETH）· 首都：安科贝尔】#!\n#W 推荐风格：#!经教复兴与跨海联纵　｜　#W 推荐难度：#!资深领航\n\n公元1337年，所罗门王朝凭天险高原与炽热的正统信仰傲立东非之角。东面直扼红海门户与亚丁湾，北面遥望埃及与耶路撒冷，南面则延伸至斯瓦希里黄金珊瑚海岸。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 非洲三轴与经教改革：#!推进扎拉·雅各布大公会议与埃沃斯塔提乌斯教派，在空位摄政期启用牧首与元老联合监国。\n· #W 红海抗衡与祭司王跨海同盟：#!打破红海封锁、触发阿克苏姆—君堡—里斯本三方使节合奏，在亚丁与基尔瓦授发海峡与黄金海市宪章。\n· #W 圣地共鸣与万邦启明：#!零DLC联动耶路撒冷与吉萨奇观，并以强制宗教宽容、废除卡塔兹与典籍抄本和约屹立四大洲文明之林。"
 oe_scn.11.a: "奉所罗门圣约，令犹大雄狮啸动红海"
 oe_scn.11.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.12.t: "开局精选导览 · 特诺奇蒂特兰（特诺奇蒂特兰）"
 oe_scn.12.d: "#T 【精选主角 No.12｜特诺奇蒂特兰（TNC）· 首都：特诺奇蒂特兰】#!\n#W 推荐风格：#!中美洲统一与跨洋抗衡　｜　#W 推荐难度：#!进阶挑战\n\n公元1337年，湖心芦苇之城特诺奇蒂特兰刚刚奠基十余载。凭精巧的奇南帕浮田、石筑堤道与无畏的豹鹰武士，墨西加人将在墨西哥谷地缔造令旧世界惊叹的伟岸都城。\n\n#T 《凤凰计划》本国标志体验路线：#!\n· #W 谷地统一与奇南帕浮田：#!结成三城同盟、兴建奇南帕农艺综合体，并在特诺奇蒂特兰授发奇南帕浮田宪章打造高繁荣湖心大都。\n· #W 零DLC双奇观与本土革新：#!收复并激活特奥蒂瓦坎太阳金字塔与乔卢拉大金字塔圣城守护诏令，完成中美洲宗教、冶金与制度自强。\n· #W 跨洋博弈与万邦启明：#!与印加和易洛魁呼应，正面抗衡欧陆殖民舰队与极乐洲新罗马，以拆解列强霸权与归还名作和约捍卫美洲主权！"
 oe_scn.12.a: "遵鹰蛇神谕，于湖心铸就墨西加帝国"
 oe_scn.12.b: "顺便翻阅《凤凰计划》十二主角典藏名录（第 1 / 4 页）"
 oe_scn.13.t: "《凤凰计划》十二主角典藏名录 · 第一页 / 共四页 · 欧亚三大皇朝支柱"
 oe_scn.13.d: "#T 【01】拜占庭帝国 · 君士坦丁堡的凤凰（BYZ · 首都：君士坦丁堡）#!\n#W 风格：#!内政与帝国治术　｜　#W 难度：#!进阶挑战\n#W 拜占庭帝国#!在1337年虽已褪去昔日盛世余晖，仍踞守欧亚咽喉#W 君士坦丁堡#!与千年罗马法统。在《凤凰计划》中，你将亲历#T 凤凰涅槃#!与#T 军区2.0#!重塑，执掌#T 希腊火虹吸#!、#T 罗马法典编纂宗师#!与#T 罗马多神复兴#!分线；既可跨海远航开辟#T 第四奥德赛·极乐洲新罗马#!，亦可重开东西两帝博弈与万国协调会，在逆境中书写第二罗马的永生史诗。\n\n#T 【02】大元天朝 · 万邦来朝之极（CHI · 首都：大都）#!\n#W 风格：#!内政与天朝秩序　｜　#W 难度：#!资深领航\n#W 大元天朝#!以#W 大都#!为中枢，北控漠北草原，南揽江南漕运与海上丝路。在《凤凰计划》中，你将执掌#T 天朝日不落#!四轨分封羁縻体系，在至正中兴、明清鼎革与改土归流间运筹帷幄；更有#T 景德镇浮梁御窑#!、#T 江南丝织市镇#!、#T 市舶司番坊#!、#T 经世文宗#!与#T 天朝册封朝贡和约#!等你亲自铺展天下秩序。\n\n#T 【03】莫斯科大公国 · 第三罗马的曙光（MOS · 首都：莫斯科）#!\n#W 风格：#!军事扩张与欧亚整合　｜　#W 难度：#!入门首选\n#W 莫斯科大公国#!正蓄势于罗斯林原之上，准备挣脱金帐汗国的鞑靼枷锁并统一全罗斯。在《凤凰计划》中，你将依托#T 波雅尔杜马摄政#!、#T 诺夫哥罗德毛皮商宪章#!与#T 战车大营宿营#!战术步步崛起；迎请希腊人塞奥法内斯绘制圣像壁画，南下黑海缔结#T 库楚克-凯纳吉海峡通航#!，东拓西伯利亚共议#T 尼布楚划界协定#!，铸就北方第三罗马！"
