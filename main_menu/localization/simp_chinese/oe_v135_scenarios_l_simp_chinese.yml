 oe_scn.15.t: "《凤凰计划》十二主角典藏名录 · 第三页 / 共四页 · 海商共和、波斯复兴与德干王朝"
 oe_scn.15.d: "#T 【07】威尼斯共和国 · 泻湖之王与穆拉诺匠心（VEN · 首都：威尼斯）#!\n#W 风格：#!商业海权与共和外交　｜　#W 难度：#!资深领航\n#W 威尼斯共和国#!凭百余座泻湖岛屿与纵横黎凡特的桨帆商队称雄地中海。在《凤凰计划》中，你将独享抢占原版选举机制的#T 十人委员会紧急摄政#!、#T 巨型桨帆侧舷齐射（Galeazza）#!与#T 威尼斯德意志商馆宪章#!；礼聘#T 穆拉诺光学与制钟巨匠#!打造《圣马可天文钟机图》，并以#T 《海洋自由论》开海#!与#T 吊销私掠和约#!称霸地中海贸易网络！\n\n#T 【08】札剌亦儿波斯 · 巴格达与伊儿汗正统（JAL · 首都：巴格达）#!\n#W 风格：#!中东争霸与波斯文脉　｜　#W 难度：#!资深领航\n#W 札剌亦儿王朝#!在伊儿汗国瓦解之际稳控#W 巴格达#!与两河平原，是《凤凰计划》#T 波斯战区一号主角#!。你将亲历伊朗高原群雄逐鹿，以#T 阿塔贝格军事摄政#!驾驭骑兵宗室，守护#T 萨迈拉大清真寺#!奇观，授发#T 大巴扎御准商馆宪章#!；更可迎请#T 波斯细密画宗师#!贝赫扎德与礼萨·阿巴西，令波斯文艺复兴照耀两河与霍尔木兹！\n\n#T 【09】毗奢耶那伽罗 · 德干胜利之城（VIJ · 首都：毗奢耶那伽罗）#!\n#W 风格：#!德干统一与季风海贸　｜　#W 难度：#!入门首选\n#W 毗奢耶那伽罗#!甫立于通加巴德拉河畔，正肩负统一南印德干、沟通马拉巴尔香料海岸的历史使命。在《凤凰计划》中，你将征战#T 印度战区#!，守护#T 斯里兰甘大神庙#!与#T 桑奇大塔#!奇观圣地，礼聘#T 印波画院博物巨匠#!；在科泽科德（卡利卡特）与果阿授发#T 季风香料自由港宪章#!，并以#T 废除卡塔兹和约#!反制印洋殖民垄断！"
