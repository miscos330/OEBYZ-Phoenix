l_simp_chinese:
 oe_rom3_b_twin_eagles: "双鹰共治正教盟约"
 oe_rom3_b_eagle_rivalry: "第二与第三罗马帝统之争"
 oe_rom3_b_conciliar_truce: "双座公会议和解"
 STATIC_MODIFIER_NAME_oe_rom3_twin_lights_proposal: "正教双灯并耀之倡"
 STATIC_MODIFIER_DESC_oe_rom3_twin_lights_proposal: "在君士坦丁堡犹存之际倡议南北正教姊妹共融，赢得普世教会敬重。"
 STATIC_MODIFIER_NAME_oe_rom3_northern_primacy_claim: "北方纯正正教之辩"
 STATIC_MODIFIER_DESC_oe_rom3_northern_primacy_claim: "质疑地中海朝廷对拉丁西方的妥协，以北方罗斯为未受玷污的正教堡垒，威望高涨却引发教会紧张。"
 STATIC_MODIFIER_NAME_oe_rom3_twin_eagles_concordat: "双鹰共治宪章（第二与第三罗马姊妹约）"
 STATIC_MODIFIER_DESC_oe_rom3_twin_eagles_concordat: "君士坦丁堡与全罗斯共签正教共融宪章，承认北方牧首列席五牧首序次，商路与外交休戚与共。"
 STATIC_MODIFIER_NAME_oe_rom3_greek_typographers: "希腊印书匠与北方献金"
 STATIC_MODIFIER_DESC_oe_rom3_greek_typographers: "希腊学者北上校勘礼仪典籍，北方白银南下资助圣山修道院与圣索菲亚，南北文教同兴。"
 STATIC_MODIFIER_NAME_oe_rom3_new_rome_primacy: "新罗马唯一帝统与普世牧首威严"
 STATIC_MODIFIER_DESC_oe_rom3_new_rome_primacy: "博斯普鲁斯的千年帝都断然重申唯一罗马正统与普世牧首首位权，号令正教诸邦。"
 STATIC_MODIFIER_NAME_oe_rom3_eagle_rivalry_duel: "双鹰争锋：帝统与牧首之竞"
 STATIC_MODIFIER_DESC_oe_rom3_eagle_rivalry_duel: "南北两座正教帝国围绕帝号与教会正统展开激烈竞逐，激发国内尚武与正统热忱却令教士阶层撕裂。"
 STATIC_MODIFIER_NAME_oe_rom3_exclusive_orthodoxy: "唯我正统：孤高帝座"
 STATIC_MODIFIER_DESC_oe_rom3_exclusive_orthodoxy: "彻底坚持本朝为世间唯一无瑕正教帝国，传教与国家凝聚力大增，外交却趋于孤傲。"
 STATIC_MODIFIER_NAME_oe_rom3_conciliar_settlement: "双座公会议妥协"
 STATIC_MODIFIER_DESC_oe_rom3_conciliar_settlement: "南北主教团搁置帝号争执、恢复圣礼互认，虽各退一步却重获内外安宁。"
 STATIC_MODIFIER_NAME_oe_rom3_third_rome_mantle: "帝冠北移：第三罗马天命与重责"
 STATIC_MODIFIER_DESC_oe_rom3_third_rome_mantle: "两座罗马既已倾覆，第三座屹立北方，第四座永不复生。背负普世正教护法重任，帝威赫赫而担负沉重。"
 STATIC_MODIFIER_NAME_oe_rom3_humble_guardianship: "谦卑护教：正教北方灯塔"
 STATIC_MODIFIER_DESC_oe_rom3_humble_guardianship: "不以骄矜帝号自居，而以虔诚律己、广兴修院与典籍守护劫后正教火种。"
 STATIC_MODIFIER_NAME_oe_rom3_all_rus_patriarchate: "全罗斯牧首区敕立（1589）"
 STATIC_MODIFIER_DESC_oe_rom3_all_rus_patriarchate: "罗斯教会正式升格为全罗斯自主牧首区，名列东正教普世牧首序次，圆成百年正教大业。"
 STATIC_MODIFIER_NAME_oe_rom3_detachment_focus: "专务地中海复兴"
 STATIC_MODIFIER_DESC_oe_rom3_detachment_focus: "无暇与遥远北方争论神学虚名，集中朝廷精力经营地中海本土与军政重建。"
 oe_rom3_dec_twin_eagles_embassy.title: "遣使双鹰共治使团"
 oe_rom3_dec_twin_eagles_embassy.desc: "在第二罗马与第三罗马缔结双鹰共治宪章后，定期互派礼仪与商贸使团巩固南北正教姊妹同盟。"
 oe_rom3_dec_twin_eagles_embassy.a: "厚礼通使，永固双鹰姊妹之谊"
 oe_rom3_dec_claim_third_rome.title: "正式宣示“第三罗马”法统"
 oe_rom3_dec_claim_third_rome.desc: "君士坦丁堡既已失守，挣脱草原枷锁的正教罗斯大国可向天下正式宣示帝冠北移与第三罗马护教天命。"
 oe_rom3_dec_claim_third_rome.a: "两座罗马已倒，第三座屹立！"
 oe_rom3_dec_affirm_ecumenical_primacy.title: "重申新罗马唯一普世法统"
 oe_rom3_dec_affirm_ecumenical_primacy.desc: "趁君士坦丁堡犹在帝国之手，在圣索菲亚大教堂昭告天下重申新罗马的唯一帝统与普世牧首首位权。"
 oe_rom3_dec_affirm_ecumenical_primacy.a: "新罗马永存，帝统不可分割"
 oe_rom3.1.t: "菲洛费致书·正教双灯并耀"
 oe_rom3.1.d: "普斯科夫叶利阿扎尔修道院的长老菲洛费上书朝廷。与旧罗马西沉不同，博斯普鲁斯海峡上的第二罗马依然屹立未倒；长老遂在书信中改以“双灯并耀”为喻——君士坦丁堡守望南洋，而挣脱草原枷锁的罗斯诸地则在北方为普世正教撑起第二根巨柱。\n\n面对活生生的新罗马，我朝当倡议“双鹰共治”姊妹盟约，还是质疑南方的拉丁妥协、高举北方唯一纯正正教大旗？"
 oe_rom3.1.a: "遣使君堡倡议“双鹰共治”，求认全罗斯牧首与母教会共融"
 oe_rom3.1.a.tt: "开启路线一（#bold #color_yellow 双鹰共治#!#!），宗教影响力#G +15#!，获得[ShowModifier('oe_rom3_twin_lights_proposal')]，持续#Y 25年#!。"
 oe_rom3.1.b: "宣示北方唯我纯正正教，质疑君堡普世独尊地位"
 oe_rom3.1.b.tt: "开启路线二（#bold #color_yellow 帝统与牧首之争#!#!），威望#G +15#!，获得[ShowModifier('oe_rom3_northern_primacy_claim')]，持续#Y 25年#!。"
 oe_rom3.2.t: "菲洛费致书·第三罗马屹立"
 oe_rom3.2.d: "普斯科夫长老菲洛费向君主呈上震动百世的书信：“第一座罗马因异端倾覆，第二座君士坦丁堡亦陷于异教之手；如今世间一切正教王国悉归于陛下治下——两座罗马既已倒下，第三座正屹立不摇，而第四座永不复生！”\n\n君士坦丁堡的灯火已在南国熄灭，罗斯是否要正式承接“第三罗马”的赫赫帝命与沉重护法之责？"
 oe_rom3.2.a: "承接“第三罗马”天命！帝冠北移，誓护普世正教"
 oe_rom3.2.a.tt: "开启路线三（#bold #color_yellow 帝冠北移#!#!），威望#G +20#!，正统性#G +10#!，获得[ShowModifier('oe_rom3_third_rome_mantle')]，持续#Y 30年#!。"
 oe_rom3.2.b: "以谦卑护教自勉，广兴修院典籍而不贪虚骄帝号"
 oe_rom3.2.b.tt: "开启路线三（#bold #color_yellow 谦卑护教#!#!），稳定度#G +8#!，获得[ShowModifier('oe_rom3_humble_guardianship')]，持续#Y 30年#!。"
 oe_rom3.3.t: "北方传来“第三罗马”之声"
 oe_rom3.3.d: "来自黑海北岸的使臣与行商带回惊人传闻：挣脱鞑靼枷锁的北方罗斯大国正在传诵普斯科夫修道士菲洛费的书简，甚至有廷臣私下将北方都城比作“第三罗马”，议论自主牧首与双头鹰帝统。\n\n圣索菲亚穹顶之下，皇帝与普世牧首须定夺应对之策：是以“双鹰共治”礼遇北方强邻，还是严辞驳斥其僭越帝统？"
 oe_rom3.3.a: "伸出“双鹰共治”之手：承认北方牧首姊妹地位，共结正教大盟"
 oe_rom3.3.a.tt: "推动路线一（#bold #color_yellow 双鹰共治#!#!），宗教影响力#G +15#!，大幅改善双边关系，获得[ShowModifier('oe_rom3_twin_lights_proposal')]，持续#Y 25年#!。"
 oe_rom3.3.b: "严辞斥责北方僭号！世间唯有新罗马永掌帝统与普世牧首首位"
 oe_rom3.3.b.tt: "推动路线二（#bold #color_yellow 帝统与牧首之争#!#!），威望#G +15#!，双边关系恶化，获得[ShowModifier('oe_rom3_new_rome_primacy')]，持续#Y 25年#!。"
 oe_rom3.3.c: "冷淡置之，专务地中海本土与军政复兴"
 oe_rom3.3.c.tt: "稳定度#G +5#!，获得[ShowModifier('oe_rom3_detachment_focus')]，持续#Y 20年#!。"
 oe_rom3.4.t: "双鹰共治公会议"
 oe_rom3.4.d: "来自博斯普鲁斯海峡与北方大河的都主教、使节与学士齐聚一堂。双方在圣像前郑重签署《双鹰共治宪章》：君士坦丁堡普世牧首正式祝圣全罗斯牧首列席东正教五牧首神圣序次，北方君主则承认新罗马为正教长兄，南北互开商港与外交盟誓。\n\n原本可能撕裂东正教世界的双雄之争，就此化为横跨欧亚的“双鹰姊妹同盟”！"
 oe_rom3.4.a: "双鹰共誓！正式批准《第二与第三罗马姊妹共治宪章》"
 oe_rom3.4.a.tt: "双边同步获得[ShowModifier('oe_rom3_twin_eagles_concordat')]，持续#Y 30年#!，大幅提升双边好感，威望#G +15#!，宗教影响力#G +20#!。"
 oe_rom3.4.b: "仅签署务实礼仪互认约，保留各自外交回旋余地"
 oe_rom3.4.b.tt: "双边获得[ShowModifier('oe_rom3_conciliar_settlement')]，持续#Y 25年#!，稳定度#G +6#!。"
 oe_rom3.5.t: "希腊印书匠与北方献金"
 oe_rom3.5.d: "借双鹰共治带来的南北畅通，博学的阿索斯山希腊修士与印书匠（宛如马克西姆·格雷克）携带善本经卷北上校勘斯拉夫礼仪书；与此同时，一箱箱来自北方的紫貂皮与白银沿着黑海航路运抵君士坦丁堡，重修圣索菲亚与圣山修院。\n\n这是两个正教世界文化互哺的黄金时代。"
 oe_rom3.5.a: "拨款资助南北典籍校勘与圣山修院，共兴正教文教"
 oe_rom3.5.a.tt: "花费#R 60金币#!，威望#G +10#!，双边同步获得[ShowModifier('oe_rom3_greek_typographers')]，持续#Y 25年#!。"
 oe_rom3.5.b: "以虔诚祈祷与修院往来维系情谊，节省国库开支"
 oe_rom3.5.b.tt: "宗教影响力#G +15#!，获得[ShowModifier('oe_rom3_humble_guardianship')]，持续#Y 20年#!。"
 oe_rom3.6.t: "双鹰争锋：帝统与牧首正统之辩"
 oe_rom3.6.d: "南北双方的礼仪与外交摩擦终于公开爆发！北方辩士严厉抨击南方朝廷在佛罗伦萨合一时代的软弱，自诩唯有未曾向拉丁低头的北方方配称正教真主；君士坦丁堡的法学家与主教则反唇相讥，称擅用凯撒帝号与私设牧首违背千年教规。\n\n双鹰反目令教士阶层震荡不已：我们是加码宣示唯一正统，还是遣使召开调停会议降温？"
 oe_rom3.6.a: "寸步不让！倾举国威仪捍卫本朝唯一帝统与教会正统"
 oe_rom3.6.a.tt: "威望#G +18#!，正统性#G +12#!，双边关系恶化，双边获得[ShowModifier('oe_rom3_eagle_rivalry_duel')]，持续#Y 25年#!（含教士满意度微降）。"
 oe_rom3.6.b: "遣使呼吁南北主教团克制辩论，避免正教世界彻底分裂"
 oe_rom3.6.b.tt: "稳定度#G +5#!，双边获得[ShowModifier('oe_rom3_conciliar_settlement')]，持续#Y 20年#!。"
 oe_rom3.7.t: "双座正统决断"
 oe_rom3.7.d: "数十年的“第二罗马与第三罗马”笔墨官司与外交暗战走到终点。欧亚大陆风起云涌，北方帝国与地中海罗马各自面对更严峻的外患。\n\n如今必须为这场世纪正统之争盖棺定论：是以孤高不妥协的唯我正统收官，还是在晚来公会议中握手言和？"
 oe_rom3.7.a: "唯我正统！彻底确立本朝不容置疑的孤高正教威权"
 oe_rom3.7.a.tt: "完成第二/第三罗马主线，威望#G +20#!，获得[ShowModifier('oe_rom3_exclusive_orthodoxy')]，持续#Y 30年#!。"
 oe_rom3.7.b: "召开晚来公会议握手言和，以务实和解结束百年争端"
 oe_rom3.7.b.tt: "完成第二/第三罗马主线，稳定度#G +10#!，双边改善关系并获得[ShowModifier('oe_rom3_conciliar_settlement')]，持续#Y 30年#!。"
 oe_rom3.8.t: "帝冠北移：新凯撒的使命"
 oe_rom3.8.d: "君士坦丁堡的钟声既已沉寂，巴尔干、安纳托利亚与黎凡特的无数正教徒无不北望祷告。莫诺马赫王冠、双头鹰旗帜与法典仪式汇于一身，朝廷正式将“帝冠北移”写入国书与加冕礼文。\n\n然而承继罗马法统绝非虚名——它意味着无上威望与外交雄心，也意味着背负沉重的帝国责任与内政考验。"
 oe_rom3.8.a: "昭告天下“帝冠北移”！承接第三罗马雄心与护教重任"
 oe_rom3.8.a.tt: "威望#G +25#!，正统性#G +15#!，获得[ShowModifier('oe_rom3_third_rome_mantle')]，持续#Y 35年#!。"
 oe_rom3.8.b: "慎守国本、务实护教，避免被沉重帝国虚名拖累内政"
 oe_rom3.8.b.tt: "稳定度#G +10#!，宗教影响力#G +20#!，获得[ShowModifier('oe_rom3_humble_guardianship')]，持续#Y 30年#!。"
 oe_rom3.9.t: "全罗斯牧首区敕立：五牧首新序"
 oe_rom3.9.d: "漫长的教会自主之路终于迎来历史性巅峰！仿1589年耶利米二世牧首祝圣约伯为全罗斯首任牧首之壮举，罗斯大都主教座正式升格为合法的“全罗斯牧首区”，名列东正教普世教会最高尊位。\n\n无论君士坦丁堡此刻是并肩共荣的姊妹新罗马，还是长存于记忆中的故都，全罗斯正教帝国的柱石已然铸成！"
 oe_rom3.9.a: "敕立全罗斯牧首区！铸就正教世界不朽新柱石"
 oe_rom3.9.a.tt: "完成第二/第三罗马主线，威望#G +20#!，宗教影响力#G +30#!，获得[ShowModifier('oe_rom3_all_rus_patriarchate')]，持续#Y 40年#!。"
 oe_rom3.9.b: "以温和公会议共治收束教会改制，兼顾诸教区平衡"
 oe_rom3.9.b.tt: "完成第二/第三罗马主线，稳定度#G +10#!，获得[ShowModifier('oe_rom3_conciliar_settlement')]，持续#Y 30年#!。"
 oe_rom3.20.t: "第二与第三罗马：选项生效"
 oe_rom3.90.t: "第二与第三罗马国运总览"
 oe_rom3.90.d: "#T 第二与第三罗马状态#!\n君堡状态(1存/2亡/3陷) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_city')|0]  路线(1双鹰/2争锋/3北移) [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_path')|0]  菲洛费书简 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_epi')|0]  新罗马回音 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_byzr')|0]\n#T 里程碑#!\n双鹰宪章 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_conc')|0]  双鹰争锋 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_riv')|0]  全罗斯牧首 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_pat')|0]  主线完成 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_done')|0]\n#T 调度#!\n月 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_m')|0]  结束代码 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_end')|0]  已发数 [ROOT.GetCountry.MakeScope.ScriptValue('oe_rom3_rd_cnt')|0]\n（结束代码：0运行中、1主线完成、3超1605年、8暂无崛起罗斯）"
 oe_rom3.90.a: "关闭"
 oe_rom3.90.b: "刷新"
