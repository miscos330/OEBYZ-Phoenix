l_simp_chinese:
# NEW 2026-11-23 v18.0 Module 18.0-D: Dynasty Prestige, Court Education, Regencies, Chivalric Orders, Religious Schools & Cultural Synthesis (oe_dyn2_). Generated by gen_v180_dynasty_culture.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_dyn2_mod_dyn_sovereign_house: "至尊皇族威望"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_dyn_sovereign_house: "此脉皇族的百年正统与显赫门望回响于诸邦朝堂与帝国典礼之间。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_dyn_cadet_network: "宗室旁支藩屏网"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_dyn_cadet_network: "分封诸王与旁支宗室彼此呼应，在多国宫廷间织就稳固的联姻与礼仪藩屏。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_char_polymath_heir: "博学储君"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_char_polymath_heir: "自幼研习经史修辞与帝国法度，这位储君在枢密议事中令老臣刮目相看。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_char_martial_heir: "历战边疆储君"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_char_martial_heir: "亲赴边镇随宿将习武巡防，这位储君兼具皇室威仪与沙场决断。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_great_house_prestige: "名门皇族庇荫"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_great_house_prestige: "膺受欧亚名门皇族正统，令朝廷威望、外使礼遇与文化感召力皆获长足增益。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_imperial_lineage: "跨国宗室威望盟约"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_imperial_lineage: "一纸宗室盟约将分治诸邦的同姓王室纳入统一的礼仪序位与外交协定。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_cadet_patronage: "宗室旁支藩屏"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_cadet_patronage: "赐予旁支宗亲体面俸禄与荣誉爵号，使边省豪族与王室血脉紧密相连。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_house_statute: "成文皇室宗法"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_house_statute: "明文宗法厘清嫡庶序位、食邑定额与继承次序，有效遏制宗室倾轧。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_appanage_accord: "藩王食邑和解约"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_appanage_accord: "朝廷与诸藩立约确认世袭食邑与礼遇，换取宗室子弟拱卫王室、共御外侮。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_academy_triumph: "御前书院教化之功"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_academy_triumph: "储君在御前策问中对答如流，彰显宫廷经筵之盛，四方名儒纷纷来投。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_frontier_tutelage: "皇储巡边讲武"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_frontier_tutelage: "储君亲赴边镇视察关隘并与禁军同操，令三军将士士气大振。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_co_emperor_statute: "共治皇帝典章"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_co_emperor_statute: "在老君健在时册立共治皇帝同预机务，令大统承继平稳如砥。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_secret_edict_statute: "正大光明建储典制"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_secret_edict_statute: "将密诏封存于正大光明匾后，既择贤而立，又彻底杜绝储位党争。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_ancestral_continuity: "恪守祖宗成法"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_ancestral_continuity: "重申祖宗成法与传统礼制，令守旧勋贵与地方官绅倍感安心。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_curtain_regency_legacy: "垂帘听政遗规"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_curtain_regency_legacy: "太后珠帘之后裁决大政，内廷玉玺与外朝枢臣配合严密，幼主临朝而海内晏然。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_balanced_regency_audit: "内阁辅政清查制"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_balanced_regency_audit: "推行阁臣副署与岁计核查之制，有效制衡摄政期间的内廷专断。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_co_emperor_legacy: "资深共治帝托孤之风"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_co_emperor_legacy: "资深共治帝受命托孤、坐镇中枢，使强敌不敢窥伺幼主之邦。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_senatorial_guarantee: "元老院监国契约"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_senatorial_guarantee: "元老院与枢密法曹联署监国契约，将贵族与文官集团牢牢系于宪制正统。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_privy_regency_legacy: "枢密辅政宪章"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_privy_regency_legacy: "由宿望重臣合议辅政，确保政权交替之际赋税不紊、政令直达郡县。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_caretaker_restraint: "守成摄政节制令"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_caretaker_restraint: "约束摄政大臣恪守守成之责，待幼主亲政前不轻兴大役、不妄改旧章。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_phoenix_chapter: "双头凤凰大勋章圣殿"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_phoenix_chapter: "受封双头凤凰勋章的骑士誓守东西双翼，将骑士尚武之风与帝国正统融为一体。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_order_treasury_reserve: "城防专款储备"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_order_treasury_reserve: "将勋团典礼经费转拨边塞城防，令沿边要塞固若金汤。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_dragon_guard_chapter: "御林飞龙卫禁军勋坛"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_dragon_guard_chapter: "精锐禁卫获颁金龙虎符，内护紫禁皇权，外作王师先登。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_civil_laureates: "文臣翰林优恤"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_civil_laureates: "将勋赏转授翰林书院与修史机构，进一步厚植帝国文治根基。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_crescent_banner_chapter: "新月旌旗勋团誓约"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_crescent_banner_chapter: "获授新月旌旗勋衔的精骑与边疆勇士誓为王师先锋，所向披靡。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_frontier_waqf: "边疆瓦克夫与经学院网"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_frontier_waqf: "以慈善宗教基金兴办沿边经学院、驿馆与济贫所，教化与民心并兴。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_philosophical_academy: "经学与哲理新派御赐学宫"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_philosophical_academy: "朝廷资助法理、辩学与哲理名派立馆授徒，掀起席卷邦国的思辨复兴。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_translation_house: "万邦译经院"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_translation_house: "广召诸教译师互译历算、律典与哲思名著，令新知与制度跨界流通。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_court_lingua_franca: "万国雅言霸权"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_court_lingua_franca: "列国宫廷与使节皆以我朝雅言草拟国书、条约与学术典籍，声教远被四海。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_chancery_vernacular: "官府白话与方言译印"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_chancery_vernacular: "将诏令与律例译印为各地方言颁行乡里，显著提升识字率与地方顺服度。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_grecolatin_synthesis: "希腊-拉丁人文合流"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_grecolatin_synthesis: "东方希腊修辞传统与西方拉丁法学在此交汇融合，缔造灿烂的地中海帝国文明。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_mediterranean_pluralism: "地中海多语礼乐共存"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_mediterranean_pluralism: "尊重希腊、拉丁与各地城邦的固有语俗与宪章，令地中海商港群落共荣共生。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_eurasian_bilingual_chancery: "双语枢密与文治融合"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_eurasian_bilingual_chancery: "推行满汉双璧或突厥-波斯双语文书之制，将尚武统御与古典文治熔为一炉。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_steppe_sedentary_harmony: "胡汉分治与礼俗并存"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_steppe_sedentary_harmony: "因俗而治、并行不悖，既维系骑射旧制之锐气，又安抚农耕州县之民生。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_house_compact_court: "宗人府与纹章谱牒院"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_house_compact_court: "设立常设宗谱纹章机构，统理皇室联姻、仪制爵录与宗亲盟书。"
 STATIC_MODIFIER_NAME_oe_dyn2_mod_court_academy_charter: "御前雅言与译馆书院"
 STATIC_MODIFIER_DESC_oe_dyn2_mod_court_academy_charter: "汇聚音韵巨擘、外交通事与辞书编修官，统一度量雅言并广布文教声威。"
 oe_dyn2_edu_porphyro_rhetoric: "紫室修辞与兵略教养"
 oe_dyn2_edu_porphyro_rhetoric_desc: "融合阿提卡外交修辞与拜占庭经典兵法的皇储精英课程，专育紫室英主。"
 oe_dyn2_edu_neoclassical_crown_academy: "东宫经筵与格物书院"
 oe_dyn2_edu_neoclassical_crown_academy_desc: "汇聚理学大儒、史官与实政名臣于东宫日讲，令皇储兼通礼乐、赋政与驭臣之道。"
 oe_dyn2_edu_turkopersian_adab: "突厥-波斯王镜礼典教养"
 oe_dyn2_edu_turkopersian_adab_desc: "融汇波斯《王镜》治道与草原骑射统帅之术，令储君兼备诗文礼典、中枢律法与沙场雄略。"
 oe_dyn2_imperial_co_emperor: "共治皇帝册立制"
 oe_dyn2_imperial_co_emperor_desc: "效法罗马与拜占庭共治传统，由在位君主提前册立贤能宗亲同登大宝、共理朝纲，使皇权交接平稳无隙。"
 oe_dyn2_secret_edict_box: "秘密建储制"
 oe_dyn2_secret_edict_box_desc: "君主密书最贤皇子之名封入正大光明匾后金匣，以治国才干为先而绝朝堂朋党窥伺储位之祸。"
 oe_dyn2_reg_empress_curtain: "皇太后垂帘听政"
 oe_dyn2_reg_empress_curtain_desc: "皇太后于珠帘之后伴幼主临朝，以正统母仪稳固皇权、统摄内廷与外朝大臣。"
 oe_dyn2_reg_byz_co_emperor: "拜占庭资深共治帝摄政"
 oe_dyn2_reg_byz_co_emperor_desc: "由资深皇室重臣或共治帝执掌中枢与军旅，守护幼主紫袍大统免受外敌与权臣倾覆。"
 oe_dyn2_reg_imperial_privy_council: "帝国枢密辅政院"
 oe_dyn2_reg_imperial_privy_council_desc: "由首席大臣、度支官与元帅依辅政宪章合议国政，确保幼主亲政前帝国机器运转如常。"
 oe_dyn2_order_double_phoenix: "双头凤凰大勋章骑士团"
 oe_dyn2_order_double_phoenix_desc: "佩饰赤金双头凤凰徽章的帝国至高勋团，专以嘉奖护持帝国复兴大业的统帅与重臣。"
 oe_dyn2_order_imperial_dragon_guard: "御林飞龙卫勋团"
 oe_dyn2_order_imperial_dragon_guard_desc: "获赐金龙符节的御前精锐勋团，聚拢忠贞勋贵与禁军宿将拱卫天子威仪。"
 oe_dyn2_order_crescent_banner: "新月旌旗护教勋团"
 oe_dyn2_order_crescent_banner_desc: "誓师于御赐绣金新月军旗下的边疆宿将与重骑精英勋团，以勇毅忠诚著称四方。"
 oe_dyn2_school_rumi_adab_hikma: "罗姆哲理与礼典学派"
 oe_dyn2_school_rumi_adab_hikma_desc: "贯通安纳托利亚与伊朗高原的跨地域学派，融汇法理、照明哲思与宫廷雅典，兼重宽容与文教。"
 oe_dyn2_school_navya_nyaya_logic: "新正理派辩学与治道学派"
 oe_dyn2_school_navya_nyaya_logic_desc: "以严密逻辑与精准辞辩闻名的南亚新正理派传统，极大提升了法曹裁断、经学考证与中枢理政水平。"
 oe_dyn2_school_qairawan_fiqh_academy: "凯鲁万史鉴法理学派"
 oe_dyn2_school_qairawan_fiqh_academy_desc: "结合马格里布法学与实证历史哲思，为地中海与商道诸朝廷培养兼具远见与律学功底的法曹与使臣。"
 oe_dyn2_dec_dynastic_house_compact.title: "颁布皇室宗谱威望盟约"
 oe_dyn2_dec_dynastic_house_compact.desc: "召集宗室元老、纹章官与联姻使节颁行皇室盟约，令我朝宗脉的礼仪威望远播诸邦宫廷。"
 oe_dyn2_dec_dynastic_house_compact.a: "用印颁行宗室盟约"
 oe_dyn2_dec_dynastic_house_compact_tt: "提升皇族在各国宫廷间的跨国威望，并设立宗人府与纹章谱牒院持续12年。"
 oe_dyn2_dec_court_language_academy.title: "敕建御前雅言与译馆书院"
 oe_dyn2_dec_court_language_academy.desc: "敕建常设御前雅言书院与万邦译馆，汇聚音韵名家与外交通事，使我朝官话成为诸邦仰慕的礼乐雅言。"
 oe_dyn2_dec_court_language_academy.a: "拨款敕建雅言书院"
 oe_dyn2_dec_court_language_academy_tt: "显著提升文化影响力与文化传统，并建立御前雅言与译馆书院持续12年。"
 oe_dyn2.1.title: "皇室荣光：跨国宗室威望同盟"
 oe_dyn2.1.desc: "从金碧辉煌的御殿到遥远边陲的藩镇，史家皆已将我朝皇族列为当世最显赫的帝王门阀。列国使臣竞相求亲通好，诸脉宗亲亦仰望宗主宝座以求封赏与仪范。"
 oe_dyn2.1.a: "颁行跨国宗室威望盟约"
 oe_dyn2.1.b: "分封旁支宗室以固藩屏"
 oe_dyn2.2.title: "旁支宗室之争与家法裁定"
 oe_dyn2.2.desc: "随着皇族子嗣日众、遍布州府食邑与中枢官署，若干志大心雄的旁支亲王开始争竞礼仪序位与岁禄封权。若不及时裁断，恐酿成宗室离德之患。"
 oe_dyn2.2.a: "立成文宗法以明嫡庶尊卑"
 oe_dyn2.2.b: "赐藩王食邑契约以求和睦"
 oe_dyn2.3.title: "储君大成：御前策问与兵略演试"
 oe_dyn2.3.desc: "在满朝勋贵、经筵大师与宿将元老面前，储君于御前策问与兵棋演试中挥洒自如、见识超群。朝野上下交口称赞，咸谓来日新君气象必将更胜今朝。"
 oe_dyn2.3.a: "专授储君治道修辞与枢务"
 oe_dyn2.3.b: "遣储君巡历边镇以习戎机"
 oe_dyn2.4.title: "国本立制：共治册立与秘密建储"
 oe_dyn2.4.desc: "古往今来，多少强盛帝国毁于储位之争。枢密法曹今呈上两套历经史鉴的立储大法：一则效法共治皇帝旧典、生前明立副君同预大政；一则仿行秘密建储之制、密书贤嗣封于金匣。"
 oe_dyn2.4.a: "改行共治皇帝册立制"
 oe_dyn2.4.b: "改行秘密建储金匣制"
 oe_dyn2.4.c: "恪守祖宗固有继承成法"
 oe_dyn2.5.title: "垂帘听政：太后摄政诏令"
 oe_dyn2.5.desc: "面对内廷外朝的微妙均势，皇太后与内廷重臣议定一套完备的垂帘听政仪轨，以确保一旦幼主继统，中枢仍能令行禁止、稳驭四方。"
 oe_dyn2.5.a: "颁定皇太后垂帘听政仪轨"
 oe_dyn2.5.b: "令内阁重臣副署稽核摄政诏令"
 oe_dyn2.6.title: "紫袍临危：资深共治帝摄政"
 oe_dyn2.6.desc: "前鉴犹在，幼主摄政往往招致内战与强邻环伺。宫廷宿老建言确立资深共治帝摄政常制，使历练沉稳的皇室柱石随时可受命托孤、捍卫紫袍正统。"
 oe_dyn2.6.a: "确立资深共治帝摄政宪章"
 oe_dyn2.6.b: "由元老院共署监国契约"
 oe_dyn2.7.title: "枢密辅政：帝国摄政重臣议事"
 oe_dyn2.7.desc: "帝国首席大臣、度支官与元帅联名拟就《枢密辅政院宪章》，誓言在王权交替的敏感时期以合议之制维系赋税清明、疆土无虞。"
 oe_dyn2.7.a: "御批帝国枢密辅政宪章"
 oe_dyn2.7.b: "限定未来摄政仅行守成常规政务"
 oe_dyn2.8.title: "双头凤凰大勋章授勋大典"
 oe_dyn2.8.desc: "在紫金帷幔低垂的圣殿廊下，纹章官手捧缀满宝石的颈链与赤金勋章，恳请御准创立「双头凤凰大勋章骑士团」，以旌表文武功臣、复兴帝国威仪。"
 oe_dyn2.8.a: "御准创立双头凤凰大勋章骑士团"
 oe_dyn2.8.b: "将勋团经费转拨边塞要塞修筑"
 oe_dyn2.9.title: "御林飞龙卫勋团立坛"
 oe_dyn2.9.desc: "禁卫宿将与忠贞边帅联名上疏，恳请朝廷立坛组建「御林飞龙卫勋团」，以金龙虎符嘉奖卫戍皇城与屡立战功之将校。"
 oe_dyn2.9.a: "颁赐金龙符节立御林飞龙卫"
 oe_dyn2.9.b: "移资优恤翰林书院文治英才"
 oe_dyn2.10.title: "新月旌旗护教勋团誓师"
 oe_dyn2.10.desc: "身经百战的重骑统领与边疆勇士齐聚御帐之前，愿在绣金新月旌旗下结盟立誓，创立「新月旌旗护教勋团」，为王朝开疆卫道。"
 oe_dyn2.10.a: "授旗立誓建新月旌旗勋团"
 oe_dyn2.10.b: "拨款兴办边疆经学院与慈善瓦克夫"
 oe_dyn2.11.title: "圣学辩难：经学与哲理新派兴起"
 oe_dyn2.11.desc: "四方名儒、法学巨擘与辩学哲人云集京畿学宫，围绕律法、格致与治道展开激辩。若朝廷采纳新锐学派为官学正宗，必将重塑世代文风。"
 oe_dyn2.11.a: "御赐学宫并奉行新锐哲理学派"
 oe_dyn2.11.b: "兼收并蓄设立万邦译经院"
 oe_dyn2.12.title: "宫廷雅言霸权：万国使节共奉之语"
 oe_dyn2.12.desc: "列国诗客、史家与使节皆以我朝宫廷雅言为外交与高雅文学的典范。御前音韵官请旨：究应编纂钦定雅言大典以壮声威，抑或广印地方白话译本以通下情？"
 oe_dyn2.12.a: "钦定万国雅言辞典与国书范式"
 oe_dyn2.12.b: "广印官府白话译本以惠州县"
 oe_dyn2.13.title: "希腊-拉丁文明合流与地中海雅言"
 oe_dyn2.13.desc: "历经数代地中海统御、海上商贸与人文交流，希腊修辞之美与拉丁法学之严已在我朝学府与枢密院深度交融。如今可顺势铸就古典文明合流，亦可保留各城邦多语共荣格局。"
 oe_dyn2.13.a: "推行希腊-拉丁古典文明与雅言合流"
 oe_dyn2.13.b: "维系地中海多语城邦礼俗共荣"
 oe_dyn2.14.title: "满汉同源与突厥-波斯帝国文治融合"
 oe_dyn2.14.desc: "兼统尚武旧邦与文教腹地数十年后，一种独具气度的双语帝国文明已在朝野成型。无论是满汉合璧的典章文书，抑或突厥-波斯交辉的宫廷礼乐，如今皆可定为定制。"
 oe_dyn2.14.a: "定立双语枢密与帝国文治融合之制"
 oe_dyn2.14.b: "因俗而治并行骑射与农耕双轨礼法"
