l_simp_chinese:
 oe_far_factoria: "罗马远洋商馆"
 oe_far_factoria_desc: "罗马帝国在印度洋或大西洋条约港设立的远洋货栈与商馆，须经港主特许并维持良好关系方能立足，交战或撤约即自行解体。"
 oe_far_factoria_upkeep: "远洋商馆簿记与港务"
 oe_far_exarch_seat: "海外总督署衙门"
 oe_far_exarch_seat_desc: "帝国在远洋要港或本国中转重镇设立的海外总督行署，统摄跨洋船期、关政与军政，有效分担本土行政劳损，但也滋长地方豪强与远程离心力。"
 oe_far_exarch_seat_upkeep: "海外总督署官俸与文书"
 OE_FAR_HESPERIA_NAME: "赫斯佩里亚总督区"
 OE_FAR_HESPERIA_ADJ: "赫斯佩里亚"
 OE_FAR_TAPROBANE_NAME: "塔普罗巴纳海外商督署"
 OE_FAR_TAPROBANE_ADJ: "塔普罗巴纳商督"
 oe_far_trade_tribute: "$oe_far_exarchate_trade$上缴象征岁贡"
 oe_far_exarchate_trade: "海外商督署"
 oe_far_exarchate_trade_desc: "罗马帝国在印度洋条约港特许设立的建筑型海外商督署，统一经营各外港远洋商馆，不参与常规战争亦不加入原版独立运动。按年依实际商站与商馆规模向帝国国库结算脚本分红（同时维持象征性月贡），并可由皇帝诏令收回商馆后安全吞并。"
 LEAD_oe_far_exarchate_trade: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_far_exarchate_trade: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_far_exarchate_trade_subject_opinion: "罗马皇帝宗主"
 oe_far_exarchate_trade_overlord_opinion: "帝国海外商督署"
 oe_far_exarchate: "海外总督区"
 oe_far_exarchate_desc: "罗马帝国在新大陆或远洋实土敕封的领土型海外总督区，行总督君主制、与帝国共享探索与商力，按殖民附庸制缴纳贡赋并分担帝国跨洋行政劳损。不可通过常规外交随意吞并，须由整饬总督署诏令收回直辖。"
 LEAD_oe_far_exarchate: "$LIST$是[SUBJECT_TYPE.GetName]"
 AM_oe_far_exarchate: "$LIST$的[SUBJECT_TYPE.GetName]。"
 oe_far_exarchate_subject_opinion: "罗马皇帝宗主"
 oe_far_exarchate_overlord_opinion: "帝国海外总督区"
 oe_far_b_port_charter: "条约港商馆特许约"
 oe_far_b_port_pressure: "强索远洋港口商栈"
 oe_far_b_mamluk_demo: "亚历山大海域舰队示威"
 oe_far_b_tordesillas_defied: "拒认托尔德西里亚斯教皇分界"
 oe_far_b_tordesillas_pact: "大西洋航道默契协约"
 oe_far_b_privateer_raid: "纵容远洋总督武装私掠"
 oe_far_b_enclave_lease: "条约小港二十五年租借约"
 oe_far_b_zaytun_rendezvous: "马六甲—刺桐双凤海丝通商约"
 STATIC_MODIFIER_NAME_oe_far_east_tier_1: "东洋香料账·初通（一港）"
 STATIC_MODIFIER_DESC_oe_far_east_tier_1: "红海或印度洋初立一处商站，带来稳定的胡椒与丁香税入，同时加重远洋舰队与海港要塞维护负担。"
 STATIC_MODIFIER_NAME_oe_far_east_tier_2: "东洋香料账·连驿（二至四港）"
 STATIC_MODIFIER_DESC_oe_far_east_tier_2: "季风商站连缀红海、波斯湾与马拉巴尔，海贸收入与商队容量倍增，但护航战舰与远戍城堡开支日趋沉重。"
 STATIC_MODIFIER_NAME_oe_far_east_tier_3: "东洋香料账·通洋（五港以上）"
 STATIC_MODIFIER_DESC_oe_far_east_tier_3: "自苏伊士贯通塔普罗巴纳直抵马六甲的远洋商网称雄印度洋，巨额海利伴随高昂舰队维持费与通货膨胀压力。"
 STATIC_MODIFIER_NAME_oe_far_west_tier_1: "西海航运账·初越海柱（一点）"
 STATIC_MODIFIER_DESC_oe_far_west_tier_1: "越过直布罗陀并在大西洋建立首处跳板，延伸帝国殖民航程，同时推高远洋船队与堡垒维系成本。"
 STATIC_MODIFIER_NAME_oe_far_west_tier_2: "西海航运账·福岛中继（二至三点）"
 STATIC_MODIFIER_DESC_oe_far_west_tier_2: "马卡罗尼西亚诸岛与西海据点形成返航补给链，显著强化殖民航程与海贸吞吐，但也拉高护航与戍守开销。"
 STATIC_MODIFIER_NAME_oe_far_west_tier_3: "西海航运账·双洲巨舶（四点以上）"
 STATIC_MODIFIER_DESC_oe_far_west_tier_3: "跨越赫拉克勒斯之柱直连新大陆诸港的宏大航线带来丰厚海税与船队威望，却引发重额军费与白银通胀隐患。"
 STATIC_MODIFIER_NAME_oe_far_auto_withhold: "海外总督截留关利"
 STATIC_MODIFIER_DESC_oe_far_auto_withhold: "海外自主度失控突破警戒线，远洋商站与总督署借口护航军费自行截留关税，严重侵蚀中央海贸与王室权威。"
 STATIC_MODIFIER_NAME_oe_far_audit_cool: "海外分账清查整肃"
 STATIC_MODIFIER_DESC_oe_far_audit_cool: "御史与户部稽核官巡查各港账簿并勒令清退私账，重振王室权威，却令短期商贸流转与市民情绪降温。"
 STATIC_MODIFIER_NAME_oe_far_recall_turmoil: "撤裁海外总督署动荡"
 STATIC_MODIFIER_DESC_oe_far_recall_turmoil: "强行撤销远洋总督敕令并收归直辖引发商船停摆与地方抵制，帝国海贸与税效在十年整顿期内显著承压。"
 STATIC_MODIFIER_NAME_oe_far_red_escort: "红海皇家护航舰队"
 STATIC_MODIFIER_DESC_oe_far_red_escort: "常驻苏伊士与亚丁的皇家护航船队紧锁香料航道并压制劫掠，但常年维持远海战舰开销颇巨。"
 STATIC_MODIFIER_NAME_oe_far_mamluk_tolls: "红海重税协定"
 STATIC_MODIFIER_DESC_oe_far_mamluk_tolls: "向埃及苏丹让渡更高过境关税以保商站存续，维系了外交缓和，但东洋海贸利润大幅缩水。"
 STATIC_MODIFIER_NAME_oe_far_persian_detour: "波斯湾替补香料通道"
 STATIC_MODIFIER_DESC_oe_far_persian_detour: "转由霍尔木兹与马斯喀特接驳印度洋货流以绕开红海专卖，拓展商队吞吐却拉长补给与护航支出。"
 STATIC_MODIFIER_NAME_oe_far_socotra_mission: "索科特拉东方基督徒补给站"
 STATIC_MODIFIER_DESC_oe_far_socotra_mission: "资助哈迪布港古老的东方基督徒教区与船坞，赢得教士拥戴与远洋声誉，但须持续拨付国库岁银。"
 STATIC_MODIFIER_NAME_oe_far_taprobane_charter: "塔普罗巴纳总督敕令"
 STATIC_MODIFIER_DESC_oe_far_taprobane_charter: "授权东方海外总督署统筹马拉巴尔与锡兰商政，提振印度洋贸易与海上存在，却略微稀释王室直辖权与外交容量。"
 STATIC_MODIFIER_NAME_oe_far_direct_warehouses: "皇室直辖印度洋商栈"
 STATIC_MODIFIER_DESC_oe_far_direct_warehouses: "拒绝分权设督而由京师直派税吏管领各港，杜绝海外割据隐患，却令跨洋行政维稳与要塞开支倍增。"
 STATIC_MODIFIER_NAME_oe_far_twin_phoenix_sea: "东西海丝双凤枢纽"
 STATIC_MODIFIER_DESC_oe_far_twin_phoenix_sea: "马六甲与泉州刺桐港缔结跨洋通商大约，香料与瓷丝双向奔流，海利极盛，亦加剧护航军费与货币通胀。"
 STATIC_MODIFIER_NAME_oe_far_malacca_customs: "马六甲单边海峡关税"
 STATIC_MODIFIER_DESC_oe_far_malacca_customs: "独自凭战舰与关闸征收马六甲过境重税，提升国库税效与海上威慑，但招致南洋与远东列国疏离。"
 STATIC_MODIFIER_NAME_oe_far_atlantic_expedition: "大西洋皇家探索舰队"
 STATIC_MODIFIER_DESC_oe_far_atlantic_expedition: "专款打造适航远洋帆船并招募领航师冲出直布罗陀，大幅加快探索与殖民航程，令海军维系开支飙升。"
 STATIC_MODIFIER_NAME_oe_far_iberian_passage: "伊比利亚商站借道协约"
 STATIC_MODIFIER_DESC_oe_far_iberian_passage: "借用里斯本与加的斯港务补给缓步试水西海，耗费低廉且外交融洽，但须让渡部分海贸利差且进度偏慢。"
 STATIC_MODIFIER_NAME_oe_far_island_shipyards: "马卡罗尼西亚船坞与蔗糖庄园"
 STATIC_MODIFIER_DESC_oe_far_island_shipyards: "在大西洋诸岛兴建远洋船坞与蔗糖垦区，显著加速造舰与殖民延展，却引发农夫征发不满与前期税入承压。"
 STATIC_MODIFIER_NAME_oe_far_mare_liberum: "罗马法公海自由宣言"
 STATIC_MODIFIER_DESC_oe_far_mare_liberum: "援引《查士丁尼法典》公开拒认教皇子午线，激励全帝国航海拓殖与远洋商运，却令天主教海权列强敌视。"
 STATIC_MODIFIER_NAME_oe_far_atlantic_truce: "大西洋航道密约"
 STATIC_MODIFIER_DESC_oe_far_atlantic_truce: "以重金与航线默契换取伊比利亚十年太平，外交声誉与国政稳定受益，却令海军士气与帝国威望受损。"
 STATIC_MODIFIER_NAME_oe_far_hesperia_exarch: "赫斯佩里亚总督区敕令"
 STATIC_MODIFIER_DESC_oe_far_hesperia_exarch: "正式敕封新大陆殖民领为赫斯佩里亚总督区，理顺跨洋关税、拓殖迁徙与附属忠诚，同时让渡部分王室直辖权。"
 STATIC_MODIFIER_NAME_oe_far_crown_west_provinces: "皇室直辖西海诸郡"
 STATIC_MODIFIER_DESC_oe_far_crown_west_provinces: "将新大陆据点全数纳入君士坦丁堡直辖税籍，短期税入丰厚，却因万里遥制导致全国控制度与维稳效率急坠。"
 STATIC_MODIFIER_NAME_oe_far_new_world_crops: "旧疆引种新大陆作物"
 STATIC_MODIFIER_DESC_oe_far_new_world_crops: "在小亚细亚与色雷斯推广玉米、马铃薯与烟草轮作，长期抬升人口容量与繁荣，短期农税改制略承折损。"
 STATIC_MODIFIER_NAME_oe_far_silver_arbitrage: "双洋白银香料大套利"
 STATIC_MODIFIER_DESC_oe_far_silver_arbitrage: "以新大陆白银经君士坦丁堡直购东洋香料与丝瓷，商贸利差惊人，却迅速推升币值通胀并招致列国嫉恨。"
 STATIC_MODIFIER_NAME_oe_far_bullion_discipline: "白银严控与稳币法令"
 STATIC_MODIFIER_DESC_oe_far_bullion_discipline: "对跨境银流实施严格铸币管制以捍卫拜占庭金币成色，有效遏制通胀并稳固朝政，代价是放缓海贸扩张。"
 STATIC_MODIFIER_NAME_oe_far_antoniniana_edict: "新安东尼努斯海外公民敕令"
 STATIC_MODIFIER_DESC_oe_far_antoniniana_edict: "仿公元212年旧制颁授海外行省自由民罗马公民权与元老院席位，大幅安抚远洋附属，却引发本土贵族强烈不满与税效折损。"
 STATIC_MODIFIER_NAME_oe_far_caesar_federation: "自治海外凯撒联邦共主约"
 STATIC_MODIFIER_DESC_oe_far_caesar_federation: "册立自治海外凯撒分理西海与东洋庶政，保住海贸垄断与长治久安，却令跨洋关税分成减半并弱化王室集权。"
 STATIC_MODIFIER_NAME_oe_far_iron_expedition: "远征舰队中央集权铁腕"
 STATIC_MODIFIER_DESC_oe_far_iron_expedition: "派遣重兵舰队强压海外自治浪潮以保住全额关赋，海战威仪与关税齐升，但海陆军费暴涨且四方动乱滋生。"
 STATIC_MODIFIER_NAME_oe_far_port_lease_hub: "罗马条约小港飞地"
 STATIC_MODIFIER_DESC_oe_far_port_lease_hub: "依二十五年租借约由帝国管领的远洋条约小港，商贸中心势力与海上存在倍增，主权交接亦伴随持续地方摩擦。"
 oe_far_dec_envoy_east.title: "通使东洋商港（红海—印度洋）"
 oe_far_dec_envoy_east.desc: "遣使前往东航十二港中尚未设站的商埠洽谈商馆特许，或凭帝国海权施压立馆；若商馆已满十年且对方非交战亦无停战，还可遣使试探二十五年条约小港租约（人类港主必自主抉择）。图拉真运河贯通时花销减免25%。"
 oe_far_dec_envoy_east.a: "以礼通商：出资1.5月收入洽设条约港商馆"
 oe_far_dec_envoy_east.b: "海权施压：半价索馆（好感−25，需力量投射≥30）"
 oe_far_dec_envoy_east.c: "试探租港：向满十年的商馆港主递交小港租借约"
 oe_far_dec_envoy_west.title: "经略西海跳板（大西洋诸岛）"
 oe_far_dec_envoy_west.desc: "遣使前往直布罗陀与马卡罗尼西亚八处西航跳板商港洽设商馆或资助跨洋补给；若某跳板商馆已满十年，亦可试探租借小港（人类港主必自主抉择）。须已开启西航并具备殖民能力。"
 oe_far_dec_envoy_west.a: "洽设西海跳板商馆（1.5月收入）"
 oe_far_dec_envoy_west.b: "资助跨洋特许远征（1月收入，提升航程与海军传统）"
 oe_far_dec_envoy_west.c: "试探租借满十年的西海跳板小港"
 oe_far_dec_audit_exarchs.title: "稽核海外总督与商社分账"
 oe_far_dec_audit_exarchs.desc: "派御史与户部核查官巡审东洋与西海商站账目，强压海外自主度（−15）并同步约束罗马商社自主度（−8），代价是消耗威望与国库并令海贸短期降温3年。"
 oe_far_dec_audit_exarchs.a: "派遣稽核御史清查海外分账"
 oe_far_dec_recall_exarch.title: "整饬并收归海外总督署"
 oe_far_dec_recall_exarch.desc: "撤销已颁授的海外商督署与海外总督区敕令，先将东航外港远洋商馆全数收归帝国名下，再安全吞并各海外商督/总督附属并撤除总督署衙门（绝不残留空壳附属）。可清除高自治割据之患，但将引发十年海外整顿动荡并显著加重帝国行政劳损（+6）。"
 oe_far_dec_recall_exarch.a: "下诏撤裁海外总督署、收归直辖"
 oe_far.1.t: "远海特许：跨越旧海疆"
 oe_far.1.d: "君士坦丁堡的罗马商社已在地中海与黑海站稳脚跟，而自红海商道与赫拉克勒斯之柱以外传来的香料、瓷丝与新海图正令元老院与船主群情激昂。御前会议必须决断：帝国究竟专攻东洋香料走廊、双洋并举，抑或暂且固守内海。"
 oe_far.1.a: "专攻东航：颁布红海—印度洋十二港特许状"
 oe_far.1.a.tt: "开启东航12港走廊与通使行动；消耗#R 1#!个月收入，帝国行政劳损#R +2#!。"
 oe_far.1.b: "兼顾东西两洋：同时筹备东洋香料与西海远航"
 oe_far.1.b.tt: "同时开启东航与西航窗口；耗资加倍（消耗#R 2.5#!个月收入），帝国行政劳损#R +5#!。"
 oe_far.1.c: "固守地中海旧疆，十年后再议远海大计"
 oe_far.1.c.tt: "暂缓远海特许10年，获得#G +3#!稳定度。"
 oe_far.2.t: "苏伊士与亚丁之钥"
 oe_far.2.d: "随着苏伊士古运河勘测推进与红海首座商馆落成，经吉达、马萨瓦出亚丁湾的胡椒航道首次向罗马帆船敞开。然曼德海峡风急盗炽，朝廷须在皇家护航与委托商社包办之间做出权衡。"
 oe_far.2.a: "设红海皇家护航舰队，接续图拉真运河航运"
 oe_far.2.a.tt: "消耗#R 1#!个月收入，获#G +5#!海军传统与[ShowModifier('oe_far_red_escort')]（#Y 25#!年，海军维护负担加重）；若图拉真运河已贯通则额外获威望并直开亚丁商站。"
 oe_far.2.b: "委托罗马商社包办红海护航与转运"
 oe_far.2.b.tt: "免去前期军费，获[ShowModifier('oe_far_persian_detour')]（#Y 15#!年），但罗马商社自主度#R +12#!、海外自主度#R +8#!。"
 oe_far.3.t: "马穆鲁克香料专卖风波"
 oe_far.3.d: "开罗苏丹厅突然大幅抬高苏伊士与亚丁过境胡椒官税并强行官卖，罗马商船在红海屡遭扣检。商贾急奏朝廷：究竟委曲重订税约、绕道霍尔木兹—马斯喀特波斯湾支线，还是遣主力舰队往亚历山大外海示威？"
 oe_far.3.a: "重订红海税率，以让利换取商站安稳"
 oe_far.3.a.tt: "获得[ShowModifier('oe_far_mamluk_tolls')]（#Y 10#!年，海贸收入折损但外交回暖），改善埃及方好感。"
 oe_far.3.b: "绕道波斯湾：抢先在霍尔木兹与马斯喀特立站"
 oe_far.3.b.tt: "消耗#R 1.5#!个月收入，获[ShowModifier('oe_far_persian_detour')]（#Y 20#!年）并优先开设霍尔木兹与马斯喀特商站。"
 oe_far.3.c: "遣主力舰队赴亚历山大外海耀武示威"
 oe_far.3.c.tt: "需舰队规模至少25艘；获得#G +10#!威望与#G +5#!海军传统，埃及方好感#R −40#!。"
 oe_far.4.t: "索科特拉与马拉巴尔初航"
 oe_far.4.d: "趁西南季风，帝国首支远洋帆船队经哈迪布港拜访索科特拉古老的东方基督徒社群，随后横渡阿拉伯海抵达胡椒之都古里与果阿。印度西岸诸邦对自称“鲁姆罗马皇帝”的使节既惊且奇。"
 oe_far.4.a: "缔结古里商约，正式打通印度西岸四港商路"
 oe_far.4.a.tt: "消耗#R 1#!个月收入，开设古里商站并获得#G +5#!海军传统。"
 oe_far.4.b: "资助索科特拉东方基督徒船坞与中继补给站"
 oe_far.4.b.tt: "消耗#R 1#!个月收入，开设哈迪布补给商站并获[ShowModifier('oe_far_socotra_mission')]（#Y 25#!年，教士满意与外交声誉提升、国内税效微降）。"
 oe_far.5.t: "塔普罗巴纳总督敕封"
 oe_far.5.d: "古希腊地理学家称锡兰为“塔普罗巴纳”，如今帝国船队已在坎贝、果阿、古里与科特连成网络。万里季风使君士坦丁堡难以逐船遥控，元老院热议是否正式敕封“塔普罗巴纳—马拉巴尔海外总督署”以分担劳损。"
 oe_far.5.a: "敕封塔普罗巴纳—马拉巴尔海外总督署"
 oe_far.5.a.tt: "在印度洋条约港正式设立建筑型海外商督署附属国（塔普罗巴纳海外商督署），接管东航外港远洋商馆，并按年依实际商站与商馆规模以脚本向国库结算分红（绝不抽空附属国库）；东航年度劳损减半，获得[ShowModifier('oe_far_taprobane_charter')]（#Y 40#!年），海外自主度起点升至#Y 25#!、行政劳损#R +4#!。"
 oe_far.5.b: "维持皇室直辖商栈，严防海外总督尾大不掉"
 oe_far.5.b.tt: "不设总督而获[ShowModifier('oe_far_direct_warehouses')]（#Y 30#!年），避免自治分权但行政劳损骤增#R +7#!。"
 oe_far.6.t: "马六甲与刺桐海丝会师"
 oe_far.6.d: "帝国桅樯终于驶入扼守南洋咽喉的马六甲海峡。东望南海，大元泉州刺桐港与广州的市舶巨舰正乘季风往来穿梭——自古丝绸之路以来，东西两大帝国首次在浩瀚大洋上直接握手。"
 oe_far.6.a: "遣使刺桐港缔结“东西海丝双凤通商约”"
 oe_far.6.a.tt: "缔结双凤海丝通商约，获[ShowModifier('oe_far_twin_phoenix_sea')]（#Y 20#!年，高海利伴通胀与护航费）、威望#G +12#!，并将丝路海路分推升#G +25#!；若大元存续则双方互得修正与好感。"
 oe_far.6.b: "独立经营马六甲海峡单边关税"
 oe_far.6.b.tt: "获[ShowModifier('oe_far_malacca_customs')]（#Y 20#!年）与#G +5#!海军传统，但外交声誉受挫并与远东强权生隙。"
 oe_far.7.t: "赫拉克勒斯之柱以外"
 oe_far.7.d: "帝国复兴之势已越过地中海西端。站在休达与直布罗陀的峭壁之上，远洋水手眺望烟波浩渺的大西洋，奏请皇帝效法古代航海家越过赫拉克勒斯之柱，开辟通往西方福岛与未知大陆的新航路。"
 oe_far.7.a: "筹建大西洋皇家探索舰队，正式启动西航走廊"
 oe_far.7.a.tt: "开启西航8港与大西洋行动；消耗#R 2#!个月收入，获#G +8#!海军传统与[ShowModifier('oe_far_atlantic_expedition')]（#Y 25#!年，海军维护负担上升）。"
 oe_far.7.b: "借道伊比利亚商站稳步试水大西洋"
 oe_far.7.b.tt: "开启西航走廊；消耗#R 1#!个月收入，获[ShowModifier('oe_far_iberian_passage')]（#Y 20#!年，进展较缓而外交融洽）。"
 oe_far.8.t: "福岛之驿：马卡罗尼西亚跳板"
 oe_far.8.d: "帝国探索船队已抵托勒密地理志所载的“福岛”海域——丰沙尔、蓬塔德尔加达、特内里费与圣地亚哥扼守北大西洋信风与返航西风。欲远征西海彼岸，必先在此筑牢补给船坞与中继驿站。"
 oe_far.8.a: "设为帝国远洋船坞与蔗糖庄园"
 oe_far.8.a.tt: "消耗#R 1#!个月收入，开设马德拉丰沙尔补给站并获[ShowModifier('oe_far_island_shipyards')]（#Y 25#!年，造舰与航程大增而农夫与税效承压）。"
 oe_far.8.b: "交由罗马商社承建大西洋中继站"
 oe_far.8.b.tt: "免国库大笔支出并开设加那利特内里费站，但罗马商社自主度#R +10#!、海外自主度#R +8#!。"
 oe_far.9.t: "拒认托尔德西里亚斯分界"
 oe_far.9.d: "罗马教皇竟以一纸子午线将大西洋彼岸的广袤世界瓜分给伊比利亚天主教诸王！君士坦丁堡法学家援引《查士丁尼法典》“海洋乃万民共有”之古训，怒斥拉丁教廷越权僭越；然外交官亦提醒须防西海强敌围堵。"
 oe_far.9.a: "援引《查士丁尼法典》宣告公海自由"
 oe_far.9.a.tt: "获#G +10#!威望与[ShowModifier('oe_far_mare_liberum')]（#Y 30#!年，殖民与贸易大增），但天主教伊比利亚诸强好感#R −45#!。"
 oe_far.9.b: "遣使密约划定大西洋航道默契"
 oe_far.9.b.tt: "消耗#R 1.5#!个月收入与#R −5#!威望，获[ShowModifier('oe_far_atlantic_truce')]（#Y 10#!年，外交声誉提升而海军士气略降）并缓和伊比利亚关系。"
 oe_far.10.t: "赫斯佩里亚与新罗马敕封"
 oe_far.10.d: "紫旗与双头鹰终于飘扬在大西洋彼岸的新世界海岸！元老院援引古希腊对极西之地“赫斯佩里亚”的称谓，请旨定夺新大陆领土的建制：是正式敕封海外总督区以减缓本土劳损，抑或由皇室直接编户收税？"
 oe_far.10.a: "敕封赫斯佩里亚海外总督区，兼容新大陆殖民建制"
 oe_far.10.a.tt: "正式敕封赫斯佩里亚海外总督区（将美洲殖民附属晋升为专属海外总督区，或自新大陆直辖地析置领土型总督区，并设总督署衙门），西航年度劳损减半，获[ShowModifier('oe_far_hesperia_exarch')]（#Y 40#!年）。"
 oe_far.10.b: "皇室直辖西海诸郡，全额收归中央税籍"
 oe_far.10.b.tt: "获[ShowModifier('oe_far_crown_west_provinces')]（#Y 30#!年，税效上升但全国控制度与维稳承压），帝国行政劳损#R +8#!。"
 oe_far.11.t: "哥伦布大交换：双洋物产与白银"
 oe_far.11.d: "随着新旧世界大交换席卷五洲，玉米、马铃薯与海量美洲白银源源涌入帝国港口。户部与商社提出三条迥异方略：推广高产作物滋养小亚细亚与色雷斯、以美洲白银直购东洋香料套利，或严控银流捍卫币值。"
 oe_far.11.a: "在小亚细亚与色雷斯旧疆推广新大陆作物"
 oe_far.11.a.tt: "获[ShowModifier('oe_far_new_world_crops')]（#Y 30#!年，人口容量与繁荣提升、短期税效微降），行政劳损#R +4#!。"
 oe_far.11.b: "连通美洲白银与东洋香料，行双洋大套利"
 oe_far.11.b.tt: "需已开启东航走廊；获[ShowModifier('oe_far_silver_arbitrage')]（#Y 25#!年，极高贸易收益伴随持续通胀），立即增加#R 2%#!通胀。"
 oe_far.11.c: "严控白银流入，捍卫帝国金币成色"
 oe_far.11.c.tt: "获[ShowModifier('oe_far_bullion_discipline')]（#Y 20#!年，压低通胀并稳固朝政，略缓贸易增速），立即压降#G 1.5%#!通胀。"
 oe_far.12.t: "新安东尼努斯敕令：海外自治风暴"
 oe_far.12.d: "启蒙思潮与革命风暴席卷大洋两岸，海外总督区与条约港市民群起请愿，抗议“纳税而无元老院席位”，独立呼声甚嚣尘上。法学家呈上公元212年卡拉卡拉《安东尼努斯敕令》古卷——帝国终须抉择海外终局。"
 oe_far.12.a: "颁布《新安东尼努斯敕令》，授海外公民权与元老席位"
 oe_far.12.a.tt: "完成远洋总督主线；海外自主度#G −35#!，获[ShowModifier('oe_far_antoniniana_edict')]（#Y 15#!年，附属忠诚大涨但本土贵族不满与税效受损），行政劳损#R +8#!。"
 oe_far.12.b: "改制自治海外凯撒联邦，以关税换和平垄断"
 oe_far.12.b.tt: "完成远洋总督主线；海外自主度#G −20#!，获[ShowModifier('oe_far_caesar_federation')]（#Y 25#!年，海税减半换长治久安与海贸稳定）。"
 oe_far.12.c: "派远征舰队铁腕镇压，捍卫中央全额关赋"
 oe_far.12.c.tt: "完成远洋总督主线；保住高额关税但海外自主度#R +15#!，获[ShowModifier('oe_far_iron_expedition')]（#Y 20#!年，海陆军费暴涨且叛乱滋生）。"
 oe_far.13.t: "季风海盗、私掠与租港危机"
 oe_far.13.d: "随着海外商站连片扩张、自主度持续攀升，阿拉伯海与大西洋航道海盗猖獗，海外商督擅自私扣外船亦频频惹祸。朝廷必须在耗资增派皇家护航、纵容商社私掠与收缩边远亏损站之间抉择。"
 oe_far.13.a: "拨款增派皇家护航舰队清剿海盗、肃正纪纲"
 oe_far.13.a.tt: "消耗#R 1.5#!个月收入，海外自主度#G −8#!，获得#G +4#!海军传统（10年冷却）。"
 oe_far.13.b: "准许海外总督与商社自行武装私掠以战养战"
 oe_far.13.b.tt: "免去国库拨银，但海外自主度#R +14#!且邻近港主好感#R −25#!（10年冷却）。"
 oe_far.13.c: "断臂收缩一处边远亏损商站，减轻帝国负担"
 oe_far.13.c.tt: "撤除1处远洋商站，帝国行政劳损#G −5#!（10年冷却）。"
 oe_far.14.t: "罗马使节求租条约小港"
 oe_far.14.d: "来自罗马帝国的远洋特使携重金抵京，称其在本国港口经营商馆已逾十载，愿以重金与十五年互不侵犯停战协约换取该单处小港的二十五年租借权。朝廷可签租借约换取巨资、仅续签商馆特许以保全领土，或严辞拒绝。"
 oe_far.14.a: "签署二十五年条约小港租借约（割让该单港换重金与15年停战）"
 oe_far.14.a.tt: "将该单处条约小港移交罗马帝国并挂[ShowModifier('oe_far_port_lease_hub')]，换取丰厚租借金与#Y 15#!年双向停战（大国永不签让）。"
 oe_far.14.b: "保全寸土，仅续签商馆特许并收取小额年租"
 oe_far.14.b.tt: "保留领土主权，允许罗马商馆继续运作并收取小额租金。"
 oe_far.14.c: "严辞拒绝割租，该港十五年内不再受请"
 oe_far.14.c.tt: "拒绝租港并施加#Y 15#!年谈判冷却。"
 oe_far.20.t: "远洋总督线：敕令生效"
 oe_far.90.t: "【测试】远洋总督线（plan_a_script_div）：状态读数"
