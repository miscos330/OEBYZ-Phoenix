# NEW 2026-11-22 v14.0 Worker 1: Cross-Wave Observer Telemetry 2.0 & 1836 Capstone Honors (oe_bal2_, O(1) fixed-tag, CMDLOG=0, 0 slots, 0 rules, 0 vanilla overrides). Generated by gen_v140_bal2_telemetry.py; edit the generator, not this file.
 oe_bal2_status_on:0 "#G 已开启（Rule 16 / 热切覆写）#!"
 oe_bal2_status_off:0 "#Y 默认休眠（零开销 O(1)）#!"
 oe_bal2_cap_bicephalum:0 "#color_yellow 双头大帝跨洋共治冠冕（Imperium Bicephalum）#!"
 oe_bal2_cap_eight_duhu:0 "#color_yellow 天朝日不落·八方大都护冠冕#!"
 oe_bal2_cap_republic:0 "#color_yellow 九十八槽圆成·万邦大共和国冠冕#!"
 oe_bal2_cap_standard:0 "#G 五百年全线史诗圆满冠冕#!"
 STATIC_MODIFIER_NAME_oe_bal2_crown_bicephalum_mod:0 "终极冠冕：双头大帝跨洋共治"
 STATIC_MODIFIER_DESC_oe_bal2_crown_bicephalum_mod:0 "新旧罗马跨越万里大洋重逢共治，以双首都总督府体系铸就横贯东西两半球的不朽紫微冠冕。"
 STATIC_MODIFIER_NAME_oe_bal2_crown_eight_duhu_mod:0 "终极冠冕：天朝日不落·八方大都护"
 STATIC_MODIFIER_DESC_oe_bal2_crown_eight_duhu_mod:0 "八方大都护府镇抚五洲四海，万国贡船云集京师，成就天朝盛世不落之终极荣光。"
 STATIC_MODIFIER_NAME_oe_bal2_crown_republic_all_nations_mod:0 "终极冠冕：九十八槽圆成·万邦大共和国"
 STATIC_MODIFIER_DESC_oe_bal2_crown_republic_all_nations_mod:0 "五大洲启蒙学脉、科学印书与万国协调合奏圆成，九十八槽伟业归一，开启世界文明大同新纪元。"
 oe_bal2.1.title:0 "一八三六全线终极冠冕大典：[ROOT.GetCountry.Custom('OeBal2CapstoneTitle')]"
 oe_bal2.1.desc_header:0 "#T 五百年跨波次史诗封卷荣光（1337–1836）#!\n#T 授予终极冠冕#!：[ROOT.GetCountry.Custom('OeBal2CapstoneTitle')]\n#T 典藏里程碑#!：#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / #Y 22#!  ｜  #T 巅峰徽印#!：[ROOT.GetCountry.Custom('OeChrColApexSeal')]\n\n"
 oe_bal2.1.desc_bicephalum:0 "自极乐西渡开辟新土，至大西洋重逢光复旧京，帝国终于在一八三六年将双头鹰之翼覆蔽新旧两洲！双首都元老院与跨洋总督府体系合璧共治，史官谨以《双头大帝跨洋共治冠冕》铭刻此旷世伟业。"
 oe_bal2.1.desc_eight_duhu:0 "八方大都护府星罗棋布于欧亚非美五洲四海，万国来朝之宝船穿梭不绝，天朝以德威并济维系跨洲朝贡礼序！史馆谨奉《天朝日不落·八方大都护冠冕》，以昭日月所照皆入华章。"
 oe_bal2.1.desc_republic:0 "启蒙印书局、非洲三轴、美洲三帝国与万国协调会在此交汇合鸣，九十八槽历史脉络悉数圆成，万邦大共和国之理想照耀近世黎明！谨颁《万邦大共和国冠冕》，永志全人类文明合奏之盛举。"
 oe_bal2.1.desc_standard:0 "五百年间帝国历经黑死病、大航海、小冰期、工业转型与终局博弈而薪火长明。无论商路、驿道、名作抑或制度革故鼎新，皆已汇聚为不朽史诗，静候后世瞻仰。"
 oe_bal2.1.a:0 "恭受终极冠冕，永载五百年史册"
 oe_bal2.1.b:0 "受冕并展阅 22 项典藏帝国编年史"
 oe_bal2.90.title:0 "【诊断】v14.0 全线跨波次遥测与平衡只读控制台（oe_bal2_）"
 oe_bal2.90.desc:0 "#T 观察者遥测总控（Rule 16）#!：[ROOT.GetCountry.Custom('OeBal2RuleStatusLabel')]（激活=#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal_rd_mode')|0]#! · 扩展帧=#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_rd_snap_count')|0]#! · 最近年份=#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_rd_last_y')|0]#!）\n#T v12.0 万国协调会#!：通过决议 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_con_res')|0]#!  ｜  维也纳协定 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_con_vna')|0]#!\n#T v12.2 驿道与殖民3.0#!：本国驿道 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_c_roads')|0]#! 段  ｜  主要列强累计 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_roads')|0]#! 段  ｜  殖民联邦 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_col3_fed')|0]#!\n#T v13.0 科学/非洲/美洲/98槽#!：印书局 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_sci_prs')|0]#!  ｜  非洲轴 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_afr_lit')|0]#!/4  ｜  美洲轴 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_amr_lit')|0]#!/3  ｜  万邦共和国 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_syn_rep')|0]#!（合奏全局 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_syn_cnt')|0]#! / 本国 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_rd_self_syn')|0]#!）\n#T v13.5 传世名作#!：全球完成 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_mst_world_count')|0]#!/12  ｜  本国典藏标识 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_rd_self_mst')|0]#!\n#T v13.6 新罗马2.0 / 天朝3.0#!：新罗马总督区 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_el2_ex')|0]#! · 双头大帝 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_el2_bic')|0]#!  ｜  天朝大都护区 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_cel3_zn')|0]#! · 贡船周期 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_glob_cel3_tr')|0]#!\n#T v14.0 典藏封卷#!：里程碑 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / #Y 22#!  ｜  终极冠冕已颁 #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_bal2_rd_capstone_done')|0]#!  ｜  徽印：[ROOT.GetCountry.Custom('OeChrColApexSeal')]"
 oe_bal2.90.a:0 "关闭跨波次遥测诊断台"
 oe_bal2.90.b:0 "经隐藏事件 oe_bal2.99 立即输出一帧扩展快照（CMDLOG=0）"
 oe_bal2.90.c:0 "打开 22 项典藏帝国编年史（oe_chr.1）"
