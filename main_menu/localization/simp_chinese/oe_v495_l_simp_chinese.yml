 STATIC_MODIFIER_NAME_oe_v495_fl_mod_secret_portolans: "秘传海图与暗礁航志"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_secret_portolans: "秘藏航海图谱揭示隐蔽良港与季风航道，使我方商船与水师如鱼得水，唯须维持更多巡海护航开销。"
 oe_v495_fl_mod_astronomical_patronage: "观象台与皇家学院资助"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_astronomical_patronage: "观象台与皇家学院资助"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_astronomical_patronage: "天文学家、冶金学者与译经通人协同编纂历法与典籍，推进学术革新，亦须国库持续拨款供养。"
 oe_v495_fl_mod_grand_fleet_review: "海峡大阅水师盛典"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_grand_fleet_review: "海峡大阅水师盛典"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_grand_fleet_review: "旌旗蔽海、火炮齐鸣的大阅水师令水兵与船匠倍感振奋，造船效率与海战意志同步提升，舰队维持费随之略涨。"
 oe_v495_fl_mod_frontier_champions: "边关双雄与坚城之志"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_frontier_champions: "边关双雄与坚城之志"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_frontier_champions: "边塞演武与精锐比试大幅振奋守军荣誉与军纪，令边防坚如磐石，然要塞日常维护耗费亦有所加重。"
 oe_v495_fl_mod_grand_tour_envoys: "诸邦游学与邦交佳话"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_grand_tour_envoys: "诸邦游学与邦交佳话"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_grand_tour_envoys: "亲善出访与互赠珍礼令邻邦朝野对我邦好感倍增，外交斡旋事半功倍，唯随行幕僚分身乏术而略减内阁人手。"
 oe_v495_fl_mod_cipher_bureau: "密电破译与黑室机要局"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_cipher_bureau: "密电破译与黑室机要局"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_cipher_bureau: "精通密码的机要吏员抢先破译外邦密信，大幅提升情报网络与政务洞察力，却也在诸国使节间招致些许戒心。"
 oe_v495_fl_mod_civic_engineering: "长桥水利与御苑百草工程"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_civic_engineering: "长桥水利与御苑百草工程"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_civic_engineering: "飞架大江的石拱长桥与引种奇花药草的百草园极大惠及民生与商旅，唯须官府定期拨款修缮养护。"

 # --- Everyday Dynasty, Festival & Grand Tour Flavor Events (24 x 3 Options) ---
 oe_v495_fl.1.title: "远海奇珍异兽进贡御苑"
 oe_v495_fl.1.desc: "一艘远航大船驶抵我邦要港，船舱满载异域番邦献上的稀世奇珍：步态优雅的麒麟长颈鹿、洁白如雪的双孔雀，以及能以宫廷雅韵向宾客致意的彩羽鹦鹉。沿途百姓万人空巷争相一睹，朝臣则就是否扩建常设御苑珍兽阁、借机大开官民同乐市集，抑或分赠半数珍禽予外邦使节以广结善缘展开热议。"
 oe_v495_fl.1.a: "兴建常设御苑珍兽阁，供朝野与各国使节共赏"
 oe_v495_fl.1.b: "敞开御苑大门与民同乐，顺势举办七日百货市集"
 oe_v495_fl.1.c: "将多余异域珍玩礼售予富商行会，充实国库盈余"
 oe_v495_fl.2.title: "月下御苑诗词雅集盛会"
 oe_v495_fl.2.desc: "秋夜华灯初上，宫苑荷塘畔汇聚天下名士与丝竹国手，一场通宵达旦的诗词斗韵雅集正酣。文人墨客、世家子弟与远来旅人纷纷以绢扇设彩竞猜魁首，礼官特来请示朝廷应如何嘉奖今夜夺魁的绝代才子。"
 oe_v495_fl.2.a: "敕设御苑词馆并刊印今夜佳作，流芳海内"
 oe_v495_fl.2.b: "邀各阶层名宿同席联句，化干戈于丝竹清韵之间"
 oe_v495_fl.2.c: "令乐师谱写赞颂商旅百工的新曲，传唱坊间市井"
 oe_v495_fl.3.title: "敌国宿将弃暗投明"
 oe_v495_fl.3.desc: "邻邦朝堂突发派系倾轧，一位久经沙场的宿将高举休战白旗策马跨过边境前来投效，行囊中更携带着装满行军图谱、攻城草图与粮道清册的皮匣。我军将校无不佩服其用兵老辣，然谨慎的近臣亦提醒朝廷，降将来投往往暗藏隐忧。"
 oe_v495_fl.3.a: "委任其重修军中操典，汲取异邦阵法所长"
 oe_v495_fl.3.b: "命其隐入机要局专司研判邻邦军情与密电"
 oe_v495_fl.3.c: "赐以闲散爵禄安度晚年，以免徒增边境猜忌"
 oe_v495_fl.4.title: "国戚大婚仪仗与全城狂欢"
 oe_v495_fl.4.desc: "号角齐鸣于焕然一新的御道之上，一桩备受瞩目的联姻喜事令两大显赫家族喜结连理。沿街楼阁垂满花环彩绸，百业行会赶制出描摹先贤事迹的鎏金彩车，户部司官正候旨定夺此番大典究系极尽排场还是节俭亲民。"
 oe_v495_fl.4.a: "御赐百车彩仗与街头酒泉，大赦市税举国同欢三日"
 oe_v495_fl.4.b: "广邀四邻使节共赴喜宴，借良缘增进邦交互信"
 oe_v495_fl.4.c: "仪轨从简而庄重，照例收纳各商帮敬献的贺仪"
 oe_v495_fl.5.title: "百城万商博览盛会"
 oe_v495_fl.5.desc: "来自数十座名城的巧匠、琉璃工、丝绸染师与黄铜仪具大师齐聚都城广场，筹办史无前例的万商博览盛会。木构展馆旌旗猎猎，汇集四方州郡与海外商埠的精工绝艺，正是向天下展现我邦百业气象的绝佳契机。"
 oe_v495_fl.5.a: "颁授皇家博览特许状并兴建常设陈列展馆"
 oe_v495_fl.5.b: "特设皇家巧艺大奖，重金表彰最精妙的器械与格致发明"
 oe_v495_fl.5.c: "趁万商云集之际征收展位商税，丰盈国库现银"
 oe_v495_fl.6.title: "游方制图师的秘传海图"
 oe_v495_fl.6.desc: "一位满面海风沧桑的游方航海家叩响水师衙门大门，怀中捧着一卷以朱砂与青金石绘就的羊皮秘图。图册边注详录了官修海图从未记载的暗礁浅滩、季风流向与避风淡水湾，而城外客栈里已有别国商探竞相出价求购。"
 oe_v495_fl.6.a: "重金购下全套秘图，秘密抄录配发我方商队与水师"
 oe_v495_fl.6.b: "礼聘其入皇家学院讲授舆地海图之学，惠及后世"
 oe_v495_fl.6.c: "雕版印行海图普及本公开发售，既扬名声又收版税"
 oe_v495_fl.7.title: "皇家观象台日食天象奇观"
 oe_v495_fl.7.desc: "正午时分，烈日果真如钦天监主官数周前推算的分毫不差化作一轮银焰日环。全城集市鸦雀无声，飞鸟敛翅归巢。街巷间既有术士借天象议论休咎，更有大批学者欢呼历算格致大获全胜。"
 oe_v495_fl.7.a: "大张旗鼓嘉奖观象台诸公，拨款铸造新式黄铜浑天仪"
 oe_v495_fl.7.b: "颁诏天下称天象昭瑞，借势安抚民心、稳固国本"
 oe_v495_fl.7.c: "铸造日环纪念银章分赠诸邦与富绅，名利双收"
 oe_v495_fl.8.title: "王都海峡大阅水师盛典"
 oe_v495_fl.8.desc: "春风和畅，百艘修葺一新的战舰满帆待发，水师提督奏请在近海海峡举办盛大阅舰庆典。朱红鎏金的旗舰严阵以待，准备在欢呼的百姓与暗中窥视的外国使节面前演练夺船接舷与齐射礼炮。"
 oe_v495_fl.8.a: "隆重举行全军大阅水师，并向船厂颁赐优胜锦旗"
 oe_v495_fl.8.b: "改阅舰为军商联合护航演练，打通远洋贸易航道"
 oe_v495_fl.8.c: "照常巡海值守，省下火药与庆典银钱以备不时之需"
 oe_v495_fl.9.title: "宫廷炼金师与皇家学院之辩"
 oe_v495_fl.9.desc: "一位衣着华丽的异域炼金师夸口能炼制延年神药并点铅成金，当众向皇家学院院长下战书，约于宫廷广场开炉试金。半数勋贵屏息以待奇迹降临，而笃信实证的冶金学者们则怒气冲冲地校准着天平与坩埚。"
 oe_v495_fl.9.a: "力挺实证学院，将熔炉技艺转用于精炼铜铁冶金"
 oe_v495_fl.9.b: "暗中资助炼金师钻研彩釉玻璃与稀世颜料配方"
 oe_v495_fl.9.c: "含笑拆穿障眼戏法，顺势向轻信豪绅略收罚金"
 oe_v495_fl.10.title: "皇家书库尘封古籍秘藏重现"
 oe_v495_fl.10.desc: "石匠在修缮旧官署潮湿的地下拱柱时，意外掘出一只封存百年的香柏木箱，内藏保存完好的泥金古卷。古文字学者连夜辨识，已从中发现失传已久的水利营建、邦交仪典与古代攻守器械珍贵孤本。"
 oe_v495_fl.10.a: "组织学士译注古卷技艺，推广至各地工坊与学堂"
 oe_v495_fl.10.b: "将泥金善本陈列于御藏宝阁，彰显王朝文脉源远流长"
 oe_v495_fl.10.c: "摹写精装副本赠予四邻君主，博取崇文美誉"
 oe_v495_fl.11.title: "远邦使节献锦缎青花重礼"
 oe_v495_fl.11.desc: "一支仪仗煊赫的远邦使团步入都城正门，呈上漆箱盛装的莹润青花瓷、绯红织锦绸缎与玉玺国书。使节们正恭候我朝回赠国礼并商议互市章程，以赶在秋风改向之前启程返国。"
 oe_v495_fl.11.a: "厚赐回礼并辟设常驻使馆区，共续万世邦交"
 oe_v495_fl.11.b: "召见本土瓷工与织匠细察釉色织机，借鉴精进工艺"
 oe_v495_fl.11.c: "受礼并优诏嘉勉，将锦缎珍瓷纳入内府库藏"
 oe_v495_fl.12.title: "边关要塞双雄演武决斗"
 oe_v495_fl.12.desc: "在静谧的边陲关隘前，我方前哨要塞守将与对岸闻名遐迩的敌阵名将约定在中立司仪见证下举行骑枪、刀术与弓铳演武比试。双方士卒齐聚城头呐喊助威，皆欲看哪家旌旗夺得白银桂冠。"
 oe_v495_fl.12.a: "赐以百炼良兵并厚赏守军，扬我边塞军威"
 oe_v495_fl.12.b: "赛后设宴款待两岸将校，以武会友缓和边衅"
 oe_v495_fl.12.c: "趁演武欢呼之机暗中测绘对岸要塞工事死角"
 oe_v495_fl.13.title: "宗室俊彦微服游学诸邦"
 oe_v495_fl.13.desc: "一位意气风发的宗室俊彦上书恳请化名商旅微服出游，遍访邻邦名校、造船大坞与宫廷剧院。老成硕儒称此行必能大开眼界、磨砺治国才略，而忠心护卫却忧心酒肆是非有失体统。"
 oe_v495_fl.13.a: "准其成行并密函诸邦宫廷照拂，广交天下英才"
 oe_v495_fl.13.b: "嘱其重点考察异邦船坞、铸造局与实业新法"
 oe_v495_fl.13.c: "留其于都城历练户部理财与实务政务，戒奢从实"
 oe_v495_fl.14.title: "两大豪门戏院争锋奇闻"
 oe_v495_fl.14.desc: "京师两大名门望族将冬日演剧季化作一场豪掷千金的斗富斗智：双方各自重金礼聘名编剧与机关匠人，在戏台上比拼飞天云车、雷鸣机括与含沙射影的讽刺喜剧。全城百姓争购戏票，坐看两家下一回合如何出招。"
 oe_v495_fl.14.a: "御旨同时嘉奖两家剧班，化私斗为皇家戏曲盛典"
 oe_v495_fl.14.b: "顺势征收红火戏院票税，专款修缮京师街巷道路"
 oe_v495_fl.14.c: "召见两家族长居中调停，以礼法消弭朝堂口角"
 oe_v495_fl.15.title: "巧匠献上机械报时偶"
 oe_v495_fl.15.desc: "一位鬼斧神工的钟表大师在正殿献上令人惊叹的黄铜珐琅自鸣偶：每逢整点，微型珐琅仪仗便吹响银号，金羽翠鸟更会婉转昂首发出清越乐鸣。在场外邦使节无不啧啧称奇，几乎疑心底座内藏有真人机关。"
 oe_v495_fl.15.a: "将自鸣奇偶安置于大殿礼宾厅，令四方使节折服"
 oe_v495_fl.15.b: "资助大师开办精密钟表工坊，造福航海计时与百工"
 oe_v495_fl.15.c: "将此奇巧绝艺转赠友好邻邦，换取深厚外交情谊"
 oe_v495_fl.16.title: "秋狝大猎与御前射礼"
 oe_v495_fl.16.desc: "深秋红叶满山，皇家围场旌旗招展，骑兵勋贵、边关斥候与各州神射手齐聚一堂，共赴传统秋狝大猎与金壶射礼。破晓猎号吹响，既可联络将校情谊，亦能检阅军中骑射武备。"
 oe_v495_fl.16.a: "以围猎为契机开展全军骑射合练，重赏神射魁首"
 oe_v495_fl.16.b: "将秋狝所获猎物广施周遭乡里，彰显仁德亲民"
 oe_v495_fl.16.c: "邀各地豪强于篝火夜宴共商田界旧案，稳固政局"
 oe_v495_fl.17.title: "香料商帮五海珍馐盛宴"
 oe_v495_fl.17.desc: "殷实的远洋商帮大设珍馐盛宴，席间丁香、藏红花、肉桂与异域咖啡香气四溢。酒过三巡，会首们趁兴呈上两份请愿：或放宽海运护航特许以拓财路，或由官府加派兵勇守护商馆堆栈。"
 oe_v495_fl.17.a: "批准设立联合海贸商团并扩建港埠官仓"
 oe_v495_fl.17.b: "扶持本土手工业行会承接商帮大宗外销订单"
 oe_v495_fl.17.c: "照旧延续特许并收纳商帮敬献的谢恩饷银"
 oe_v495_fl.18.title: "大图书馆多语译经学社"
 oe_v495_fl.18.desc: "精通多国语言的抄写员、流亡鸿儒与商旅通事在都城大图书馆自发组成译书学社，将海外几何、医术与农政要典悉数译为本邦文字。学社同仁别无他求，唯愿朝廷拨给纸墨与静室以广传斯文。"
 oe_v495_fl.18.a: "敕封译书学社为官办译馆，常年拨给纸墨俸禄"
 oe_v495_fl.18.b: "遴选最敏锐的通事充实礼部与外交机要幕僚"
 oe_v495_fl.18.c: "命其专译农桑水利实用手册，分发各州县推广"
 oe_v495_fl.19.title: "冬至花灯焰火嘉年华"
 oe_v495_fl.19.desc: "冬至长夜，万盏油纸花灯顺着都城大河蜿蜒流淌，火药巧匠则在凛冽夜空中燃放出金菊翠莲般的绚烂烟花。商贾、士卒与太学生们在石桥上载歌载舞，翘首期盼朝廷颁布冬至恩诏。"
 oe_v495_fl.19.a: "官府资助河灯盛会并广施冬衣暖粥，与民同乐"
 oe_v495_fl.19.b: "延揽烟花巧匠入兵仗局，研习军用信号火箭与火器"
 oe_v495_fl.19.c: "放开宵禁设立冬至夜市，坐收坊市兴隆之利"
 oe_v495_fl.20.title: "大匠献策兴建跨江长桥"
 oe_v495_fl.20.desc: "一位目光长远的大匠在议事堂展开炭笔蓝图，拟在商旅最繁忙的大江津渡兴建一座多孔石拱长桥，桥身兼备税亭、分水金刚墙与双轨车行道。虽有渡船行会略显不满，但往来车马商旅无不拍手称快。"
 oe_v495_fl.20.a: "敕拨官帑开工筑造石拱长桥，惠及千秋商旅"
 oe_v495_fl.20.b: "将桥头堡按要塞规格加固，平战结合稳守津要"
 oe_v495_fl.20.c: "许商帮集资建桥并分享十年过桥税利，官民双赢"
 oe_v495_fl.21.title: "一代良史求入史馆修史"
 oe_v495_fl.21.desc: "一位笔法生动、著作风行宫闱与茶肆的当代良史抵达京师，恳请准予翻阅皇室秘档，编纂一部气势恢宏的本朝通史。史家执笔待命，正探问朝廷究系容其直书古今，还是另有所嘱。"
 oe_v495_fl.21.a: "敞开秘档任其秉笔直书，以博大胸怀赢得千古清誉"
 oe_v495_fl.21.b: "敕命其领衔官修国史盛典，弘扬正统威仪"
 oe_v495_fl.21.c: "命其专心整理历代战例与盟约得失，供兵部参详"
 oe_v495_fl.22.title: "近海浅滩打捞沉没宝船"
 oe_v495_fl.22.desc: "春潮大落之后，近海暗礁间赫然露出一条失事多年的沉没宝船龙骨。胆大过人的沿海采珠人潜入海底，打捞出满载银锭、黄铜海图规与完好青铜佛郎机炮的铁箍宝箱。水师书吏与渔民正静候朝廷裁定打捞归属。"
 oe_v495_fl.22.a: "依律与渔民平分所获银锭，余数尽归国库充饷"
 oe_v495_fl.22.b: "将打捞所得航海仪具与青铜火炮全数拨交水师整备"
 oe_v495_fl.22.c: "按舱单清册将部分商货归还原主，赢得五海商邦敬重"
 oe_v495_fl.23.title: "截获邻邦宫廷密电暗号"
 oe_v495_fl.23.desc: "机警的驿丞截住一名神色慌张的信使，从其夹衣中搜出以繁复数字密码书写的丝绸密信。机要吏员彻夜推演竟成功破译密钥，邻邦边防虚实、商战谋划与宫廷内幕一览无遗。手握这张意外王牌，朝廷当如何运筹？"
 oe_v495_fl.23.a: "秘而不宣并设立常设黑室破译局，长久洞察外情"
 oe_v495_fl.23.b: "封缄原样礼还邻邦使馆，以君子之风折服四邻"
 oe_v495_fl.23.c: "暗中借密信商情抢先布局市集，为国库赚取厚利"
 oe_v495_fl.24.title: "御苑百草园引种异域奇花"
 oe_v495_fl.24.desc: "远航商船与采药隐士联袂献上满载异域奇卉的陶盆：条纹郁金香、清香茶苗、耐寒柑橘接穗与罕见退热药树幼株。太医院医官与司农官一致奏请朝廷扩建玻璃温室与试种果园，广育奇花良药。"
 oe_v495_fl.24.a: "兴建御苑温室并将良种药草推广至各州府"
 oe_v495_fl.24.b: "令太医院绘录《异域百草图谱》颁行学界，精进医道"
 oe_v495_fl.24.c: "将珍稀花卉与香料苗圃特许予花商经营，坐收厚税"
