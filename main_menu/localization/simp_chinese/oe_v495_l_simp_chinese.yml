 STATIC_MODIFIER_NAME_oe_v495_fl_mod_defector_tactics: "降将新编操典兵法"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_defector_tactics: "汲取敌国名将战阵精华改订操典，显著提升军中操练水准与士气，唯须增拨演武粮饷。"
 oe_v495_fl_mod_royal_jubilee: "全城嘉年华与大典余韵"
