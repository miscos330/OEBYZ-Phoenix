 STATIC_MODIFIER_DESC_oe_v495_fl_mod_royal_jubilee: "花灯巡游、御赐酒宴与全城同欢令朝野上下和睦融洽、市井繁盛，唯因颁诏减免部分市税而稍减国库岁入。"
 oe_v495_fl_mod_world_exposition: "百城万商博览会特许状"
 STATIC_MODIFIER_NAME_oe_v495_fl_mod_world_exposition: "百城万商博览会特许状"
 STATIC_MODIFIER_DESC_oe_v495_fl_mod_world_exposition: "各地工匠与商帮齐聚博览盛会，展示精密钟表、丝绸与瓷器，带动百业兴旺，亦增加城坊修缮开支。"
