 oe_nb.1.t: "塞雷斯总督的王冠"
 oe_nb.1.desc1: "#F 1341年8月，亚美尼亚国王列翁四世被本国贵族杀害：国王亲近西方、主张两教合一，早已招致不满。贵族们先请吕西尼昂家的约翰继位，约翰却劝兄长居伊接受王冠。居伊出身塞浦路斯王族，信奉天主教，自1328年起在帝国任塞雷斯总督；几经犹豫，居伊在1342年加冕为奇里乞亚的亚美尼亚国王，称君士坦丁二世。#!\n\n如今，列翁四世的死讯已经传到君士坦丁堡，奇里乞亚的使节随后赶到，要迎塞雷斯总督[SCOPE.sCharacter('oe_nb_guy').GetName]东去继承王位。使节们特意提起：奇里乞亚没有忘记帝国在1337年的接济。"
 oe_nb.1.desc2: "#F 1341年8月，亚美尼亚国王列翁四世被本国贵族杀害：国王亲近西方、主张两教合一，早已招致不满。贵族们先请吕西尼昂家的约翰继位，约翰却劝兄长居伊接受王冠。居伊出身塞浦路斯王族，信奉天主教，自1328年起在帝国任塞雷斯总督；几经犹豫，居伊在1342年加冕为奇里乞亚的亚美尼亚国王，称君士坦丁二世。#!\n\n如今，列翁四世的死讯已经传到君士坦丁堡，奇里乞亚的使节随后赶到，要迎塞雷斯总督[SCOPE.sCharacter('oe_nb_guy').GetName]东去继承王位。"
 oe_nb.1.desc3: "#F 1341年8月，亚美尼亚国王列翁四世被本国贵族杀害：国王亲近西方、主张两教合一，早已招致不满。贵族们先请吕西尼昂家的约翰继位，约翰却劝兄长居伊接受王冠。居伊出身塞浦路斯王族，信奉天主教，自1328年起在帝国任塞雷斯总督；几经犹豫，居伊在1342年加冕为奇里乞亚的亚美尼亚国王，称君士坦丁二世。#!\n\n如今，奇里乞亚的使节来到君士坦丁堡，要迎塞雷斯总督[SCOPE.sCharacter('oe_nb_guy').GetName]东去继承王位。使节们特意提起：奇里乞亚没有忘记帝国在1337年的接济。"
 oe_nb.1.desc: "#F 1341年8月，亚美尼亚国王列翁四世被本国贵族杀害：国王亲近西方、主张两教合一，早已招致不满。贵族们先请吕西尼昂家的约翰继位，约翰却劝兄长居伊接受王冠。居伊出身塞浦路斯王族，信奉天主教，自1328年起在帝国任塞雷斯总督；几经犹豫，居伊在1342年加冕为奇里乞亚的亚美尼亚国王，称君士坦丁二世。#!\n\n如今，奇里乞亚的使节来到君士坦丁堡，要迎塞雷斯总督[SCOPE.sCharacter('oe_nb_guy').GetName]东去继承王位。"
 oe_nb.1.a: "送总督东去为王"
 oe_nb.1.a.tt: "[SCOPE.sCharacter('oe_nb_guy').GetName]前往奇里乞亚，登上王位\n奇里乞亚对我们的好感#G +40#!"
 oe_nb.1.b: "留总督在帝国"
 oe_nb.1.b.tt: "[SCOPE.sCharacter('oe_nb_guy').GetName]留在帝国，奇里乞亚另立新君\n奇里乞亚对我们的好感#R −10#!"
 oe_nb.2.t: "保加利亚的新娘"
 oe_nb.2.desc1: "#F 1355年前后，帝国与保加利亚订立新约：沙皇伊凡·亚历山大之女基拉察许配给约翰五世的长子安德洛尼卡，两人当时都只有七八岁。格雷戈拉斯把这桩婚事记在1355至1357年间。#!\n\n如今，特尔诺沃的使节带来沙皇的提议：把公主[SCOPE.sCharacter('oe_nb_bride').GetName]许配给[SCOPE.sCharacter('oe_nb_groom').GetName]，两家从此结为姻亲。安德洛尼卡三世之女玛丽亚嫁在保加利亚，也从特尔诺沃来信撮合。"
 oe_nb.2.desc2: "#F 1355年前后，帝国与保加利亚订立新约：沙皇伊凡·亚历山大之女基拉察许配给约翰五世的长子安德洛尼卡，两人当时都只有七八岁。格雷戈拉斯把这桩婚事记在1355至1357年间。#!\n\n如今，特尔诺沃的使节带来沙皇的提议：把公主[SCOPE.sCharacter('oe_nb_bride').GetName]许配给[SCOPE.sCharacter('oe_nb_groom').GetName]，两家从此结为姻亲。"
 oe_nb.2.desc3: "#F 1355年前后，帝国与保加利亚订立新约：沙皇伊凡·亚历山大之女基拉察许配给约翰五世的长子安德洛尼卡，两人当时都只有七八岁。格雷戈拉斯把这桩婚事记在1355至1357年间。#!\n\n如今，特尔诺沃的使节带来沙皇的提议：两家联姻，结为姻亲。可宫中眼下没有合适的人选。安德洛尼卡三世之女玛丽亚嫁在保加利亚，也从特尔诺沃来信撮合。"
 oe_nb.2.desc: "#F 1355年前后，帝国与保加利亚订立新约：沙皇伊凡·亚历山大之女基拉察许配给约翰五世的长子安德洛尼卡，两人当时都只有七八岁。格雷戈拉斯把这桩婚事记在1355至1357年间。#!\n\n如今，特尔诺沃的使节带来沙皇的提议：两家联姻，结为姻亲。可宫中眼下没有合适的人选。"
 oe_nb.2.a: "订下婚约"
 oe_nb.2.a.tt: "[SCOPE.sCharacter('oe_nb_bride').GetName]来到君士坦丁堡，与[SCOPE.sCharacter('oe_nb_groom').GetName]订婚；两人都满#Y 14#!岁时成婚\n保加利亚对我们的好感#G +40#!\n与保加利亚停战#Y 10#!年"
 oe_nb.2.b: "另择佳偶"
 oe_nb.2.b.tt: "保加利亚对我们的好感#R −20#!"
 oe_nb.3.t: "维丁的沙皇"
 oe_nb.3.desc1: "#F 1356年，伊凡·亚历山大的次子伊凡·斯拉齐米尔在维丁自称“保加利亚人和希腊人的皇帝”，与父亲分治。沙皇此前已立后妻所生的希什曼为继承人。#!\n\n如今，#bold #color_yellow 维丁#!#!已成一国。[SCOPE.sCharacter('oe_nb_sra').GetName]在那里以沙皇自居，仍向特尔诺沃称臣，给帝国的书信里却自称“希腊人的皇帝”。朝廷要决定怎样回信。"
 oe_nb.3.desc: "#F 1356年，伊凡·亚历山大的次子伊凡·斯拉齐米尔在维丁自称“保加利亚人和希腊人的皇帝”，与父亲分治。沙皇此前已立后妻所生的希什曼为继承人。#!\n\n如今，#bold #color_yellow 维丁#!#!与特尔诺沃各行其是，两边都派了使节来君士坦丁堡。朝廷要决定承认哪一边。"
 oe_nb.3.a: "承认维丁的沙皇"
 oe_nb.3.a.tt: "维丁对我们的好感#G +30#!\n保加利亚对我们的好感#R −20#!"
 oe_nb.3.b: "只认特尔诺沃"
 oe_nb.3.b.tt: "保加利亚对我们的好感#G +20#!\n维丁（如果存在）对我们的好感#R −20#!"
 oe_nb.3.c: "“希腊人的皇帝”？"
 oe_nb.3.c.tt: "维丁对我们的好感#R −30#!"
 oe_nb.4.t: "山那边的公国"
 oe_nb.4.desc1: "#F 1340年代末，匈牙利国王派德拉戈什在喀尔巴阡山以东设立边区，防备鞑靼人。1360年代初，马拉穆列什的贵族博格丹不服匈牙利，越山而来，逐走德拉戈什的后人，摩尔达维亚从此脱离匈牙利自立。各家记载的年份不一。#!\n\n如今，摩尔达维亚在[SCOPE.sCharacter('oe_nb_molr').GetName]治下自立，派人南下打听帝国的态度。帝国已据有瓦拉几亚，可以用“摩尔达维亚总督府”整合这片河谷。"
 oe_nb.4.desc2: "#F 1340年代末，匈牙利国王派德拉戈什在喀尔巴阡山以东设立边区，防备鞑靼人。1360年代初，马拉穆列什的贵族博格丹不服匈牙利，越山而来，逐走德拉戈什的后人，摩尔达维亚从此脱离匈牙利自立。各家记载的年份不一。#!\n\n如今，摩尔达维亚在[SCOPE.sCharacter('oe_nb_molr').GetName]治下自立，派人南下打听帝国的态度。"
 oe_nb.4.desc3: "#F 1340年代末，匈牙利国王派德拉戈什在喀尔巴阡山以东设立边区，防备鞑靼人。1360年代初，马拉穆列什的贵族博格丹不服匈牙利，越山而来，逐走德拉戈什的后人，摩尔达维亚从此脱离匈牙利自立。各家记载的年份不一。#!\n\n如今，摩尔达维亚的使节南下打听帝国的态度。帝国已据有瓦拉几亚，可以用“摩尔达维亚总督府”整合这片河谷。"
 oe_nb.4.desc: "#F 1340年代末，匈牙利国王派德拉戈什在喀尔巴阡山以东设立边区，防备鞑靼人。1360年代初，马拉穆列什的贵族博格丹不服匈牙利，越山而来，逐走德拉戈什的后人，摩尔达维亚从此脱离匈牙利自立。各家记载的年份不一。#!\n\n如今，摩尔达维亚的使节南下打听帝国的态度。"
 oe_nb.4.a: "遣使致贺，送去圣像和经书"
 oe_nb.4.a.tt: "摩尔达维亚对我们的好感#G +30#!\n帝国与摩尔达维亚建立往来"
 oe_nb.4.b: "先看匈牙利的脸色"
 oe_nb.4.b.tt: "匈牙利对我们的好感#G +10#!"
 oe_nb.5.t: "黑海港口之争"
 oe_nb.5.desc1: "#F 1364年，帝国与保加利亚为安基阿洛斯和梅森布里亚两座港口再起战端，这一次保加利亚守住了港口。#!\n\n如今，#bold #color_yellow 安基阿洛斯#!#!仍在保加利亚手里，离帝国的海岸只有一程水路。城里的希腊商人暗中来信，说守军松懈。可两家的婚约还在。"
 oe_nb.5.desc: "#F 1364年，帝国与保加利亚为安基阿洛斯和梅森布里亚两座港口再起战端，这一次保加利亚守住了港口。#!\n\n如今，#bold #color_yellow 安基阿洛斯#!#!仍在保加利亚手里，离帝国的海岸只有一程水路。城里的希腊商人暗中来信，说守军松懈。"
 oe_nb.5.a: "从海上突袭安基阿洛斯"
 oe_nb.5.a.tt: "成功率#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_raid_chance')|0]%#!（基础#Y 30%#!；帝国舰船不少于#Y 20#!艘加#G +15%#!；保加利亚正与奥斯曼交战加#G +10%#!）\n成功：安基阿洛斯归帝国（保加利亚由玩家控制时，改为获得对其的宣战理由，持续#Y 10#!年）\n失败：威望#R −5#!\n无论成败：保加利亚对我们的好感#R −30#!；与保加利亚停战#Y 5#!年"
 oe_nb.5.b: "留下宣战的理由"
 oe_nb.5.b.tt: "获得对保加利亚的宣战理由（征服安基阿洛斯一带），持续#Y 10#!年\n保加利亚对我们的好感#R −10#!"
 oe_nb.5.c: "维持和约"
 oe_nb.5.c.tt: "保加利亚对我们的好感#G +10#!"
 oe_nb.6.t: "维丁的方济各会士"
 oe_nb.6.desc1: "#F 1365年5月，匈牙利国王路易一世出兵维丁，6月2日破城，伊凡·斯拉齐米尔一家被押往克罗地亚，囚禁约四年。方济各会士随军而来，强迫当地人改宗天主教，多数没有成功。1369年秋，斯拉齐米尔以匈牙利附庸的身份回到维丁。#!\n\n如今，#bold #color_yellow 维丁#!#!已是匈牙利的附庸，城里的正教神父被赶出了教堂。牧首请皇帝表态。"
 oe_nb.6.desc: "#F 1365年5月，匈牙利国王路易一世出兵维丁，6月2日破城，伊凡·斯拉齐米尔一家被押往克罗地亚，囚禁约四年。方济各会士随军而来，强迫当地人改宗天主教，多数没有成功。1369年秋，斯拉齐米尔以匈牙利附庸的身份回到维丁。#!\n\n如今，#bold #color_yellow 维丁#!#!的正教徒向君士坦丁堡求助：匈牙利的方济各会士正在城里强迫改宗。牧首请皇帝表态。"
 oe_nb.6.a: "请牧首致书抗议"
 oe_nb.6.a.tt: "匈牙利对我们的好感#R −20#!"
 oe_nb.6.b: "皇帝正需要匈牙利"
 oe_nb.6.b.tt: "匈牙利对我们的好感#G +20#!"
 oe_nb.7.t: "绿伯爵转向保加利亚"
 oe_nb.7.desc1: "#F 1366年，约翰五世从匈牙利回国，保加利亚不肯放行，皇帝被困在维丁一带。刚为帝国夺回加里波利的萨伏伊伯爵阿梅迪奥六世（人称“绿伯爵”）随即挥师北上：10月取梅森布里亚，接着取安基阿洛斯，攻瓦尔纳不下。年底保加利亚放皇帝过境，皇帝答应付给伯爵一万五千弗罗林的远征费，换下这几座城。#!\n\n如今，绿伯爵的人马守着#bold #color_yellow 安基阿洛斯#!#!一带，等着帝国付账。（地图上没有梅森布里亚，以布尔加斯一带代表。）保加利亚的公主正在宫中，两家的婚约犹在。"
 oe_nb.7.desc2: "#F 1366年，绿伯爵在海峡得手之后挥师北上：刚为帝国夺回加里波利的萨伏伊伯爵阿梅迪奥六世，10月取梅森布里亚，接着取安基阿洛斯，攻瓦尔纳不下。伯爵要帝国付一万五千弗罗林的远征费，换下这几座城。#!\n\n如今，绿伯爵的人马守着#bold #color_yellow 安基阿洛斯#!#!一带，等着帝国付账。（地图上没有梅森布里亚，以布尔加斯一带代表。）保加利亚的公主正在宫中，两家的婚约犹在。"
 oe_nb.7.desc3: "#F 1366年，约翰五世从匈牙利回国，保加利亚不肯放行，皇帝被困在维丁一带。刚为帝国夺回加里波利的萨伏伊伯爵阿梅迪奥六世（人称“绿伯爵”）随即挥师北上：10月取梅森布里亚，接着取安基阿洛斯，攻瓦尔纳不下。年底保加利亚放皇帝过境，皇帝答应付给伯爵一万五千弗罗林的远征费，换下这几座城。#!\n\n如今，绿伯爵的人马守着#bold #color_yellow 安基阿洛斯#!#!一带，等着帝国付账。（地图上没有梅森布里亚，以布尔加斯一带代表。）"
 oe_nb.7.desc: "#F 1366年，绿伯爵在海峡得手之后挥师北上：刚为帝国夺回加里波利的萨伏伊伯爵阿梅迪奥六世，10月取梅森布里亚，接着取安基阿洛斯，攻瓦尔纳不下。伯爵要帝国付一万五千弗罗林的远征费，换下这几座城。#!\n\n如今，绿伯爵的人马守着#bold #color_yellow 安基阿洛斯#!#!一带，等着帝国付账。（地图上没有梅森布里亚，以布尔加斯一带代表。）"
 oe_nb.7.a: "收下城镇，替伯爵付账"
 oe_nb.7.a.tt: "保加利亚手中的安基阿洛斯和布尔加斯归帝国（保加利亚由玩家控制时，改为获得对其的宣战理由，持续#Y 10#!年）\n保加利亚对我们的好感#R −30#!\n与保加利亚停战#Y 5#!年"
 oe_nb.7.b: "以城换和"
 oe_nb.7.b.tt: "城镇留给保加利亚\n保加利亚对我们的好感#G +30#!"
 oe_nb.8.t: "苏丹的另一个附庸"
 oe_nb.8.desc1: "#F 1373年前后，沙皇伊凡·希什曼向穆拉德一世称臣，妹妹基拉·塔玛拉入了苏丹的后宫。塔玛拉入宫的年份各家说法不一。#!\n\n如今，保加利亚也成了奥斯曼的纳贡国。帝国与特尔诺沃同在苏丹的阴影下，宫中有人主张两边互通声气。"
 oe_nb.8.desc: "#F 1373年前后，沙皇伊凡·希什曼向穆拉德一世称臣，妹妹基拉·塔玛拉入了苏丹的后宫。塔玛拉入宫的年份各家说法不一。#!\n\n如今，保加利亚在奥斯曼的压力下摇摇欲坠。宫中有人主张与特尔诺沃互通声气。"
 oe_nb.8.a: "与特尔诺沃互通声气"
 oe_nb.8.a.tt: "保加利亚对我们的好感#G +25#!\n#Y 15#!年内特尔诺沃若陷落，收留逃来的书吏只需一半花费"
 oe_nb.8.b: "托沙皇之妹在苏丹面前说情"
 oe_nb.8.b.tt: "苏丹的耐心#G +10#!（臣属苏丹）\n这只是一次试探，苏丹未必领情"
 oe_nb.8.c: "各扫门前雪"
 oe_nb.9.t: "西斯的最后一年"
 oe_nb.9.desc1: "#F 1374年9月，列翁五世在西斯加冕。次年4月13日，马穆鲁克大军攻破西斯，国王退守加班要塞，不久被俘，押往埃及。奇里乞亚的亚美尼亚王国就此灭亡；国王在埃及被关了约七年，后来由卡斯蒂利亚国王出钱赎回。#!\n\n如今，马穆鲁克大军压向#bold #color_yellow 西斯#!#!。帝国是奇里乞亚的担保国，奇里乞亚的使节跪在皇帝面前，请帝国兑现承诺。帝国在1337年接济过奇里乞亚，亚美尼亚人没有忘记。"
 oe_nb.9.desc2: "#F 1374年9月，列翁五世在西斯加冕。次年4月13日，马穆鲁克大军攻破西斯，国王退守加班要塞，不久被俘，押往埃及。奇里乞亚的亚美尼亚王国就此灭亡；国王在埃及被关了约七年，后来由卡斯蒂利亚国王出钱赎回。#!\n\n如今，马穆鲁克大军压向#bold #color_yellow 西斯#!#!。帝国是奇里乞亚的担保国，奇里乞亚的使节跪在皇帝面前，请帝国兑现承诺。"
 oe_nb.9.desc3: "#F 1374年9月，列翁五世在西斯加冕。次年4月13日，马穆鲁克大军攻破西斯，国王退守加班要塞，不久被俘，押往埃及。奇里乞亚的亚美尼亚王国就此灭亡；国王在埃及被关了约七年，后来由卡斯蒂利亚国王出钱赎回。#!\n\n如今，#bold #color_yellow 西斯#!#!已经陷落，奇里乞亚并入了马穆鲁克的版图。逃难的亚美尼亚人沿海路西来，有的已经到了帝国的港口。帝国在1337年接济过奇里乞亚，亚美尼亚人没有忘记。"
 oe_nb.9.desc4: "#F 1374年9月，列翁五世在西斯加冕。次年4月13日，马穆鲁克大军攻破西斯，国王退守加班要塞，不久被俘，押往埃及。奇里乞亚的亚美尼亚王国就此灭亡；国王在埃及被关了约七年，后来由卡斯蒂利亚国王出钱赎回。#!\n\n如今，#bold #color_yellow 西斯#!#!已经陷落，奇里乞亚并入了马穆鲁克的版图。逃难的亚美尼亚人沿海路西来，有的已经到了帝国的港口。"
 oe_nb.9.desc5: "#F 1374年9月，列翁五世在西斯加冕。次年4月13日，马穆鲁克大军攻破西斯，国王退守加班要塞，不久被俘，押往埃及。奇里乞亚的亚美尼亚王国就此灭亡；国王在埃及被关了约七年，后来由卡斯蒂利亚国王出钱赎回。#!\n\n如今，马穆鲁克大军压向#bold #color_yellow 西斯#!#!，奇里乞亚危在旦夕。亚美尼亚商人已经开始带着家产西逃。帝国在1337年接济过奇里乞亚，亚美尼亚人没有忘记。"
 oe_nb.9.desc: "#F 1374年9月，列翁五世在西斯加冕。次年4月13日，马穆鲁克大军攻破西斯，国王退守加班要塞，不久被俘，押往埃及。奇里乞亚的亚美尼亚王国就此灭亡；国王在埃及被关了约七年，后来由卡斯蒂利亚国王出钱赎回。#!\n\n如今，马穆鲁克大军压向#bold #color_yellow 西斯#!#!，奇里乞亚危在旦夕。亚美尼亚商人已经开始带着家产西逃。"
 oe_nb.9.a: "践行担保"
 oe_nb.9.a.tt: "奇里乞亚获得[ShowModifier('oe_nb_cil_roman_aid')]，持续#Y 10#!年\n帝国获得[ShowModifier('oe_nb_cil_burden')]，持续#Y 10#!年\n马穆鲁克对我们的好感#R −50#!\n奇里乞亚对我们的好感#G +40#!\n奇里乞亚得以保全"
 oe_nb.9.b: "遣使开罗求情"
 oe_nb.9.b.tt: "#G 40%#!的可能苏丹退兵，奇里乞亚得以保全\n否则（#R 60%#!）西斯陷落，奇里乞亚并入马穆鲁克"
 oe_nb.9.c: "撤回担保"
 oe_nb.9.c.tt: "撤回对奇里乞亚的担保；西斯陷落，奇里乞亚并入马穆鲁克\n奇里乞亚对我们的好感#R −50#!"
 oe_nb.9.d: "接纳亚美尼亚商人"
 oe_nb.9.d.tt: "帝国获得[ShowModifier('oe_nb_armenian_merchants')]，持续#Y 10#!年"
 oe_nb.9.e: "为国王筹赎金"
 oe_nb.9.e.tt: "帝国愿为被俘的国王出一份赎金"
 oe_nb.9.f: "不问东方之事"
 oe_nb.10.t: "特尔诺沃陷落"
 oe_nb.10.desc1: "#F 1393年7月17日，奥斯曼军队围城三个月后攻下保加利亚的都城特尔诺沃，牧首叶夫蒂米被流放。沙皇伊凡·希什曼守在尼科波尔，保加利亚只剩残局。#!\n\n如今，#bold #color_yellow 特尔诺沃#!#!落入了奥斯曼之手。书吏、修士和抄经人带着书卷南逃，有的已经到了帝国边境。维丁还在，但谁都知道撑不了多久。攻下特尔诺沃的苏丹，正是向帝国收贡的那一位。"
 oe_nb.10.desc2: "#F 1393年7月17日，奥斯曼军队围城三个月后攻下保加利亚的都城特尔诺沃，牧首叶夫蒂米被流放。沙皇伊凡·希什曼守在尼科波尔，保加利亚只剩残局。#!\n\n如今，#bold #color_yellow 特尔诺沃#!#!落入了奥斯曼之手。书吏、修士和抄经人带着书卷南逃，有的已经到了帝国边境。攻下特尔诺沃的苏丹，正是向帝国收贡的那一位。"
 oe_nb.10.desc3: "#F 1393年7月17日，奥斯曼军队围城三个月后攻下保加利亚的都城特尔诺沃，牧首叶夫蒂米被流放。沙皇伊凡·希什曼守在尼科波尔，保加利亚只剩残局。#!\n\n如今，#bold #color_yellow 特尔诺沃#!#!落入了奥斯曼之手。书吏、修士和抄经人带着书卷南逃，有的已经到了帝国边境。维丁还在，但谁都知道撑不了多久。"
 oe_nb.10.desc: "#F 1393年7月17日，奥斯曼军队围城三个月后攻下保加利亚的都城特尔诺沃，牧首叶夫蒂米被流放。沙皇伊凡·希什曼守在尼科波尔，保加利亚只剩残局。#!\n\n如今，#bold #color_yellow 特尔诺沃#!#!落入了奥斯曼之手。书吏、修士和抄经人带着书卷南逃，有的已经到了帝国边境。"
 oe_nb.10.a: "收留逃来的书吏和修士"
 oe_nb.10.a.tt: "帝国获得[ShowModifier('oe_nb_tarnovo_scribes')]，持续#Y 20#!年\n与特尔诺沃早有往来，花费减半"
 oe_nb.10.b: "收留逃来的书吏和修士"
 oe_nb.10.b.tt: "帝国获得[ShowModifier('oe_nb_tarnovo_scribes')]，持续#Y 20#!年"
 oe_nb.10.c: "闭门不纳"
 oe_nb.10.c.tt: "苏丹的耐心#G +5#!（臣属苏丹）"
 oe_nb.10.d: "闭门不纳"
 oe_nb.10.d.tt: "奥斯曼对我们的好感#G +10#!"
 oe_nb.10.e: "向西方求援"
 oe_nb.10.e.tt: "匈牙利对我们的好感#G +15#!\n西方会记得帝国的呼吁"
 oe_nb.11.t: "维丁的城门"
 oe_nb.11.desc1: "#F 1396年9月，西方的十字军在尼科波利斯大败。同年年底或次年初，奥斯曼人拿下维丁，伊凡·斯拉齐米尔被押往布尔萨，死在那里。第二保加利亚王国就此终结。#!\n\n如今，尼科波利斯的败讯刚刚传来，#bold #color_yellow 维丁#!#!的城门就向奥斯曼人敞开了。最后一批保加利亚贵族逃到了帝国。"
 oe_nb.11.desc2: "#F 1396年9月，西方的十字军在尼科波利斯大败。同年年底或次年初，奥斯曼人拿下维丁，伊凡·斯拉齐米尔被押往布尔萨，死在那里。第二保加利亚王国就此终结。#!\n\n如今，十字军虽在尼科波利斯得胜，#bold #color_yellow 维丁#!#!还是落入了奥斯曼人之手。最后一批保加利亚贵族逃到了帝国。"
 oe_nb.11.desc: "#F 1396年9月，西方的十字军在尼科波利斯大败。同年年底或次年初，奥斯曼人拿下维丁，伊凡·斯拉齐米尔被押往布尔萨，死在那里。第二保加利亚王国就此终结。#!\n\n如今，#bold #color_yellow 维丁#!#!的城门向奥斯曼人敞开了，保加利亚最后的据点也已失去。最后一批保加利亚贵族逃到了帝国。"
 oe_nb.11.a: "为流亡者留一处宅邸"
 oe_nb.11.a.tt: "帝国获得[ShowModifier('oe_nb_bul_exiles')]，持续#Y 10#!年"
 oe_nb.11.b: "默哀，不再过问"
 oe_nb.91.t: "消息传回"
 oe_nb.91.desc1: "突袭得手：帝国的船队趁夜靠岸，#bold #color_yellow 安基阿洛斯#!#!已经插上了帝国的旗帜。"
 oe_nb.91.desc2: "突袭得手，却守不住城：保加利亚人重新集结，朝中记下了这笔账，日后再讨（宣战理由，持续#Y 10#!年）。"
 oe_nb.91.desc3: "突袭失败：守军早有防备，船队无功而返。"
 oe_nb.91.desc4: "开罗的苏丹收下了礼物，答应暂缓进兵。奇里乞亚保住了。"
 oe_nb.91.desc5: "开罗没有回心转意：#bold #color_yellow 西斯#!#!陷落，奇里乞亚并入了马穆鲁克的版图。"
 oe_nb.91.desc6: "开罗没有回心转意，马穆鲁克大军仍在奇里乞亚境内。"
 oe_nb.91.desc: "消息已经传回。"
 oe_nb.91.a: "知道了"
 oe_nb.90.t: "保加利亚、摩尔达维亚与奇里乞亚：选项生效"
