 STATIC_MODIFIER_DESC_oe_cne_mod_hre_aulic_charter:0 "帝国枢密法官统筹诸邦法度与特许契约，显著提升帝国权威、外交清望与赋税秩序。"
 STATIC_MODIFIER_NAME_oe_cne_mod_catholic_trent_synod:0 "特伦托教律革新"
 STATIC_MODIFIER_DESC_oe_cne_mod_catholic_trent_synod:0 "整顿后的教区神学院与严明教纪稳固公教正统信仰，提升教士阶层忠诚与社会安定。"
 STATIC_MODIFIER_NAME_oe_cne_mod_catholic_holy_league:0 "教廷神圣同盟军饷"
 STATIC_MODIFIER_DESC_oe_cne_mod_catholic_holy_league:0 "教会专款军饷与圣战祝福鼓舞公教陆海联军士气，锤炼铁血军纪。"
 STATIC_MODIFIER_NAME_oe_cne_mod_ortho_pentarchy:0 "五牧首普世协和"
 STATIC_MODIFIER_DESC_oe_cne_mod_ortho_pentarchy:0 "自治牧首区内共同遵循的教法协理显著提升正教正统性、文化辐射力与盟邦互信。"
 STATIC_MODIFIER_NAME_oe_cne_mod_ortho_hesychast:0 "圣公会静修院赐福"
 STATIC_MODIFIER_DESC_oe_cne_mod_ortho_hesychast:0 "静修派修院抄经讲学与济世善堂广泽乡里，涵养识字率、地方繁荣与社会祥和。"
 STATIC_MODIFIER_NAME_oe_cne_mod_tatar_yarlyk:0 "大汗诰命银贡体系"
 STATIC_MODIFIER_DESC_oe_cne_mod_tatar_yarlyk:0 "金字诰命与草原督税骑队维系严密贡赋秩序，令国库充盈、属邦恭顺而轻骑犀利。"
 STATIC_MODIFIER_NAME_oe_cne_mod_tatar_stand_ugra:0 "乌格拉河抗贡铁壁"
 STATIC_MODIFIER_DESC_oe_cne_mod_tatar_stand_ugra:0 "严密扼守冰河渡口的火炮与步兵阵线鼓舞全军斗志，誓将草原枷锁彻底击碎。"
 STATIC_MODIFIER_NAME_oe_cne_mod_marienburg_crusade:0 "马尔堡总团十字军体制"
 STATIC_MODIFIER_DESC_oe_cne_mod_marienburg_crusade:0 "星罗棋布的红砖骑士团堡垒与远道而来的西欧武士为条顿骑士团铸就铜墙铁壁般的波罗的海边防。"
 STATIC_MODIFIER_NAME_oe_cne_mod_baltic_amber_monopoly:0 "条顿琥珀与谷物专营"
 STATIC_MODIFIER_DESC_oe_cne_mod_baltic_amber_monopoly:0 "骑士团官营粮仓与琥珀专卖源源不断地充实总团国库，带动波罗的海沿岸港市繁荣。"
 STATIC_MODIFIER_NAME_oe_cne_mod_grunwald_resilience:0 "马尔堡死守铁纪"
 STATIC_MODIFIER_DESC_oe_cne_mod_grunwald_resilience:0 "顽强死守红砖主城的守备军与精锐雇佣火器弩手挽救了骑士团国免于覆灭。"
 STATIC_MODIFIER_NAME_oe_cne_mod_thorn_recovery:0 "托伦战后财政重整"
 STATIC_MODIFIER_DESC_oe_cne_mod_thorn_recovery:0 "务实的赔款协定与城市特别税稳住了骑士团财政信用，保全普鲁士核心疆域。"
 STATIC_MODIFIER_NAME_oe_cne_mod_ordensstaat_iron_hand:0 "大团长铁腕集权"
 STATIC_MODIFIER_DESC_oe_cne_mod_ordensstaat_iron_hand:0 "铁腕围城强行压制自治港市的反抗，重申总团对普鲁士全境的军政主导权。"
 STATIC_MODIFIER_NAME_oe_cne_mod_prussian_estates_pact:0 "普鲁士城市等级协约"
 STATIC_MODIFIER_DESC_oe_cne_mod_prussian_estates_pact:0 "承认港市自治与等级议会知情权，化解叛乱危机并重燃维斯瓦河贸易活力。"
 STATIC_MODIFIER_NAME_oe_cne_mod_secular_duchy_prussia:0 "普鲁士世俗公国体制"
 STATIC_MODIFIER_DESC_oe_cne_mod_secular_duchy_prussia:0 "教产世俗化后转化为近代枢密财政、公立学府与效忠公爵的世袭文官体系。"
 STATIC_MODIFIER_NAME_oe_cne_mod_reformed_teutonic_order:0 "坚贞条顿修会纪律"
 STATIC_MODIFIER_DESC_oe_cne_mod_reformed_teutonic_order:0 "重申修会清规并整肃各地分团纪纲，使黑十字骑士团的宗教虔诚与军纪历久弥新。"
 STATIC_MODIFIER_NAME_oe_cne_mod_brandenburg_prussia_union:0 "勃兰登堡-普鲁士枢密同盟"
 STATIC_MODIFIER_DESC_oe_cne_mod_brandenburg_prussia_union:0 "柏林与柯尼斯堡纳入同一枢密院运筹之中，奠定北德意志强国崛起的制度基石。"
 STATIC_MODIFIER_NAME_oe_cne_mod_elbe_baltic_corridor:0 "易北-波罗的海商路走廊"
 STATIC_MODIFIER_DESC_oe_cne_mod_elbe_baltic_corridor:0 "关税协调与河运开凿使柏林至柯尼斯堡的手工工坊与海陆转口贸易蒸蒸日上。"
 STATIC_MODIFIER_NAME_oe_cne_mod_great_elector_army:0 "大选侯常备军体制"
