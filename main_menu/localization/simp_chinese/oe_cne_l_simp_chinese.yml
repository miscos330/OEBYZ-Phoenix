 STATIC_MODIFIER_DESC_oe_cne_mod_belgrade_noon_bell:0 "贝尔格莱德大捷为匈牙利赢得七十载和平屏障，令王国以基督教世界之盾名震天下。"
 STATIC_MODIFIER_NAME_oe_cne_mod_hunyadi_long_campaign:0 "匈雅提多瑙河机动战法"
 STATIC_MODIFIER_DESC_oe_cne_mod_hunyadi_long_campaign:0 "机敏的匈牙利轻骑与坚固战车营垒珠联璧合，赋予匈军纵横巴尔干的远程机动战力。"
 STATIC_MODIFIER_NAME_oe_cne_mod_corvinus_black_army:0 "马加什大王常备黑军"
 STATIC_MODIFIER_DESC_oe_cne_mod_corvinus_black_army:0 "由王室重金常年供养的职业重骑、火绳枪手与战车炮兵，令维也纳至巴尔干诸邻闻风丧胆。"
 STATIC_MODIFIER_NAME_oe_cne_mod_bibliotheca_corviniana:0 "布达科尔温文艺复兴图书馆"
 STATIC_MODIFIER_DESC_oe_cne_mod_bibliotheca_corviniana:0 "意大利名匠、天文学家与数千卷金饰手抄典籍齐聚布达，使匈牙利成为阿尔卑斯以北最璀璨的文艺复兴王廷。"
 STATIC_MODIFIER_NAME_oe_cne_mod_hungarian_rural_conciliation:0 "多瑙河乡野抚绥新令"
 STATIC_MODIFIER_DESC_oe_cne_mod_hungarian_rural_conciliation:0 "摒弃酷烈永久农奴法典、保障耕者生计，保住王国丰饶粮仓与危急时刻的民心兵源。"
 STATIC_MODIFIER_NAME_oe_cne_mod_tripartitum_nobility:0 "三部法典贵族宪制"
 STATIC_MODIFIER_DESC_oe_cne_mod_tripartitum_nobility:0 "编纂匈牙利习惯贵族法典安抚各大领主并维系各郡骠骑征召，以严酷秩序压平骚乱。"
 STATIC_MODIFIER_NAME_oe_cne_mod_mohacs_tactical_reform:0 "莫哈奇警醒与近代军改"
 STATIC_MODIFIER_DESC_oe_cne_mod_mohacs_tactical_reform:0 "痛定思痛抛弃盲目封建骑士冲锋，转建严整火枪方阵与野战炮群，挽狂澜于既倒。"
 STATIC_MODIFIER_NAME_oe_cne_mod_saint_stephen_shield:0 "圣斯蒂芬王冠紧急联防"
 STATIC_MODIFIER_DESC_oe_cne_mod_saint_stephen_shield:0 "紧急外交求援与全国总动员将援兵与粮秣源源送往布达、埃斯泰尔戈姆与波若尼。"
 STATIC_MODIFIER_NAME_oe_cne_mod_rakoczi_kuruc_hussars:0 "库鲁茨骠骑自由战旗"
 STATIC_MODIFIER_DESC_oe_cne_mod_rakoczi_kuruc_hussars:0 "来去如风的匈牙利库鲁茨骠骑令欧陆各国竞相效仿，成为近代轻骑兵战术典范。"
 STATIC_MODIFIER_NAME_oe_cne_mod_hungarian_diet_revival:0 "匈牙利国会宪政复兴"
 STATIC_MODIFIER_DESC_oe_cne_mod_hungarian_diet_revival:0 "郡县自治、宗教宽容与马扎尔文学复兴相辅相成，开启匈牙利长治久安的重建时代。"
 STATIC_MODIFIER_NAME_oe_cne_mod_return_to_rome:0 "罗马圣座光复归位"
 STATIC_MODIFIER_DESC_oe_cne_mod_return_to_rome:0 "罗马重归拉丁基督教世界无可争议的精神中枢，各国使节与朝圣者络绎不绝。"
 STATIC_MODIFIER_NAME_oe_cne_mod_curial_patrimony:0 "圣彼得教产财政重整"
 STATIC_MODIFIER_DESC_oe_cne_mod_curial_patrimony:0 "廉洁的宗座司库重修古罗马水道、桥梁与拉齐奥城塞，令教廷领地百废俱兴。"
 STATIC_MODIFIER_NAME_oe_cne_mod_platonic_academy:0 "佛罗伦萨柏拉图文艺复兴"
 STATIC_MODIFIER_DESC_oe_cne_mod_platonic_academy:0 "古典希腊典籍、透视绘画与人文学院大放异彩，令意大利文化软实力冠绝全欧。"
 STATIC_MODIFIER_NAME_oe_cne_mod_medici_banking:0 "美第奇跨欧银行网"
 STATIC_MODIFIER_DESC_oe_cne_mod_medici_banking:0 "遍布布鲁日、里昂、威尼斯与罗马的分行网络将全欧资本源源引入意大利商埠与国库。"
 STATIC_MODIFIER_NAME_oe_cne_mod_peace_of_lodi:0 "洛迪和约常驻外交均势"
 STATIC_MODIFIER_DESC_oe_cne_mod_peace_of_lodi:0 "长达四十载的外交均势令意大利诸邦免受外敌侵扰，缔造空前的城市繁华。"
 STATIC_MODIFIER_NAME_oe_cne_mod_condottieri_trace_italienne:0 "精锐雇佣军与意大利棱堡"
 STATIC_MODIFIER_DESC_oe_cne_mod_condottieri_trace_italienne:0 "严格履约的精锐雇佣军长与棱角分明的意大利式星形要塞，令城邦从容应对火炮时代。"
 STATIC_MODIFIER_NAME_oe_cne_mod_warrior_pope_swiss_guard:0 "战神教宗与瑞士近卫军"
 STATIC_MODIFIER_DESC_oe_cne_mod_warrior_pope_swiss_guard:0 "忠勇无双的瑞士长戟近卫队与铁腕同盟外交，使罗马成为亚平宁半岛不可轻侮的军事力量。"
 STATIC_MODIFIER_NAME_oe_cne_mod_julian_vatican_arts:0 "盛期文艺复兴梵蒂冈艺苑"
 STATIC_MODIFIER_DESC_oe_cne_mod_julian_vatican_arts:0 "湿壁画与大理石杰作辉映梵蒂冈宫殿，将文艺复兴罗马推上人类艺术绝巅。"
 STATIC_MODIFIER_NAME_oe_cne_mod_council_of_trent:0 "特伦托大公会议革新法令"
 STATIC_MODIFIER_DESC_oe_cne_mod_council_of_trent:0 "整顿一新的教区神职、严谨修会与海外传教使团令公教会在欧亚与新大陆重焕生机。"
 STATIC_MODIFIER_NAME_oe_cne_mod_st_peters_basilica:0 "圣彼得大教堂穹顶壮丽"
 STATIC_MODIFIER_DESC_oe_cne_mod_st_peters_basilica:0 "巍峨壮观的梵蒂冈大穹顶矗立于罗马天际，成为建筑奇观与教廷崇高威望的永恒丰碑。"
 STATIC_MODIFIER_NAME_oe_cne_mod_alpine_gatekeepers:0 "萨伏伊阿尔卑斯铁关"
 STATIC_MODIFIER_DESC_oe_cne_mod_alpine_gatekeepers:0 "连环山地堡垒与精训皮埃蒙特乡勇令任何企图翻越西阿尔卑斯山的强敌寸步难行。"
 STATIC_MODIFIER_NAME_oe_cne_mod_savoyard_diplomacy:0 "萨伏伊山地均势外交"
 STATIC_MODIFIER_DESC_oe_cne_mod_savoyard_diplomacy:0 "萨伏伊外交家游刃于巴黎与维也纳之间，借关隘咽喉之利巧取盟约厚利与尊荣封号。"
 STATIC_MODIFIER_NAME_oe_cne_mod_piedmont_modern_army:0 "皮埃蒙特近代化王家陆军"
 STATIC_MODIFIER_DESC_oe_cne_mod_piedmont_modern_army:0 "严谨的炮术学院与纪律严明的蓝衣步兵团，为意大利王家陆军赢得欧陆列强敬畏。"
 STATIC_MODIFIER_NAME_oe_cne_mod_italian_cadastre_ports:0 "意大利开明清丈与海港新政"
 STATIC_MODIFIER_DESC_oe_cne_mod_italian_cadastre_ports:0 "公平清丈田赋与振兴第勒尼安海商港双管齐下，大幅充实王国税入与海运活力。"
 STATIC_MODIFIER_NAME_oe_cne_mod_risorgimento_dawn:0 "意大利复兴运动烈焰"
 STATIC_MODIFIER_DESC_oe_cne_mod_risorgimento_dawn:0 "爱国志愿军、立宪蓝图与澎湃的民族文艺汇成洪流，引领亚平宁半岛奔向独立统一。"
 STATIC_MODIFIER_NAME_oe_cne_mod_italian_customs_league:0 "意大利关税同盟与邦联协约"
 STATIC_MODIFIER_DESC_oe_cne_mod_italian_customs_league:0 "撤除城邦关卡、统一货币与商法，以和平繁荣的关税同盟逐步弥合半岛千年割据。"
 oe_cne.1.title:0 "马尔堡骑士团要塞与北方十字军"
 oe_cne.1.desc:0 "诺加特河畔的红砖雄城马尔堡巍然矗立，来自西欧各地的十字军骑士云集普鲁士，准备沿波罗的海边疆展开冬季远征。"
 oe_cne.1.a:0 "扩建马尔堡总团要塞并广邀骑士远征"
 oe_cne.1.b:0 "特许琥珀行会与维斯瓦河贸易港口"
 oe_cne.2.title:0 "格伦瓦尔德之战的余波"
 oe_cne.2.desc:0 "折断的骑枪与染血的白底黑十字披风自格伦瓦尔德战场退回，波兰-立陶宛联军逼近马尔堡，沉重赔款压向骑士团。"
 oe_cne.2.a:0 "死守马尔堡并整训常备雇佣弩兵"
 oe_cne.2.b:0 "缔结托伦和约并重整战后财政"
 oe_cne.3.title:0 "普鲁士邦联危机"
 oe_cne.3.desc:0 "但泽与托伦的富商联合乡绅骑士结成普鲁士邦联，抗议骑士团沉重战税并试图向维斯瓦河彼岸寻求庇护。"
 oe_cne.3.a:0 "以铁腕军令镇压普鲁士邦联"
 oe_cne.3.b:0 "颁授城市特许状并允许等级参议"
 oe_cne.4.title:0 "条顿骑士团世俗化改制（1525）"
 oe_cne.4.desc:0 "宗教改革思潮席卷柯尼斯堡，古老军事修会体制日益难以为继，枢密臣僚激辩是否将骑士团国改制为世袭普鲁士公国。"
 oe_cne.4.a:0 "推行世俗公国改制并创立官僚新政"
 oe_cne.4.b:0 "坚守军事修会誓约并整饬骑士纪律"
 oe_cne.5.title:0 "勃兰登堡-普鲁士共主联邦"
 oe_cne.5.desc:0 "霍亨索伦家族的继承权将易北河畔的勃兰登堡选侯国与波罗的海畔的普鲁士公国连为一体，铸成横跨北德意志的双核心强邦。"
 oe_cne.5.a:0 "以统一枢密院统筹勃兰登堡与普鲁士政务"
 oe_cne.5.b:0 "贯通波罗的海木材与易北河商贸走廊"
 oe_cne.6.title:0 "大选侯腓特烈·威廉的常备军改革"
 oe_cne.6.desc:0 "历经外军肆意践踏选侯国之痛，大选侯腓特烈·威廉决意依托消费税与总军需署打造一支完全听命于王权的永久常备军。"
 oe_cne.6.a:0 "设立总军需署并扩建常备野战军团"
 oe_cne.6.b:0 "颁布波茨坦敕令延揽工匠与军官"
 oe_cne.7.title:0 "柯尼斯堡加冕称王（1701）"
 oe_cne.7.desc:0 "1701年隆冬，选侯腓特烈在柯尼斯堡城堡亲手将王冠戴在头顶，于帝国疆界之外昭告普鲁士王国的诞生。"
 oe_cne.7.a:0 "昭告普鲁士王国并创立黑鹰勋章"
 oe_cne.7.b:0 "创办普鲁士皇家科学院以彰王化"
 oe_cne.8.title:0 "士兵王征兵制与波茨坦掷弹兵"
 oe_cne.8.desc:0 "士兵王腓特烈·威廉一世力行节俭、充实军库，将全国划为团级征兵区，并亲自操练闻风丧胆的波茨坦巨人掷弹兵团。"
 oe_cne.8.a:0 "推行征兵区制并整编波茨坦巨人掷弹兵"
 oe_cne.8.b:0 "强化总务署财政审核与王室领地收益"
 oe_cne.9.title:0 "腓特烈大帝"
 oe_cne.9.desc:0 "腓特烈大帝以斜行阵奇袭奥得河畔西里西亚，又在无忧宫与欧陆启蒙哲人唱和论道，以剑与笔将普鲁士推上欧陆一流列强之巅。"
 oe_cne.9.a:0 "精研斜行战术与轻快骑炮兵协同"
 oe_cne.9.b:0 "倡兴无忧宫启蒙学术与普鲁士法典编纂"
 oe_cne.10.title:0 "容克体制与施泰因-哈登贝格"
 oe_cne.10.desc:0 "大革命时代的国民战争浪潮撼动旧式雇佣军制，柏林面临历史抉择：推行解放农奴与总参谋部革新，抑或强化传统容克军官团纪律。"
 oe_cne.10.a:0 "推行施泰因-哈登贝格改革与总参谋部制"
 oe_cne.10.b:0 "巩固世袭容克军官团与铁血勋贵秩序"
 oe_cne.11.title:0 "查理四世《金玺诏书》与布拉格"
 oe_cne.11.desc:0 "查理四世于布拉格城堡颁布《金玺诏书》确立波希米亚首席世俗选侯尊位，并兴办中欧第一所大学，将布拉格铸就为金色之城。"
 oe_cne.11.a:0 "彰扬《金玺诏书》与首席选侯法统"
 oe_cne.11.b:0 "扩建查理大学并资助石桥营造行会"
 oe_cne.12.title:0 "扬·胡斯与伯利恒礼拜堂"
 oe_cne.12.desc:0 "数千布拉格市民涌入伯利恒礼拜堂聆听扬·胡斯以捷克语布道抨击教会积弊，改革呼声激荡波希米亚全境。"
 oe_cne.12.a:0 "庇护捷克语布道与大学教义革新"
 oe_cne.12.b:0 "调停大主教与大学改革派学者之争"
 oe_cne.13.title:0 "首次布拉格掷窗事件与胡斯战车阵"
 oe_cne.13.desc:0 "愤怒的市民将市政官员掷出布拉格新市政厅窗外后，数路帝国十字军压境而来；独眼统帅扬·杰式卡却以铁链战车与手铳铸就令重骑胆寒的移动堡垒。"
 oe_cne.13.a:0 "全面列装杰式卡胡斯战车阵与手铳火力"
 oe_cne.13.b:0 "凝聚温和圣杯派贵族与城市自卫民团"
 oe_cne.14.title:0 "《巴塞尔协定》"
 oe_cne.14.desc:0 "历经连年十字军战火后，波希米亚等级代表与巴塞尔公会议终签《巴塞尔协定》，正式承认圣杯派领受双形圣餐的合法权利。"
 oe_cne.14.a:0 "批准《巴塞尔协定》并重开帝国商路"
 oe_cne.14.b:0 "维持山口常备戒备以防教廷反悔"
 oe_cne.15.title:0 "胡斯派国王波杰布拉德的乔治"
 oe_cne.15.desc:0 "由波希米亚议会推举即位的本土国王波杰布拉德的乔治力图弥合天主教与胡斯派分歧，更首倡欧洲基督教诸侯和平联盟宏图。"
 oe_cne.15.a:0 "倡议欧洲基督教诸侯和平同盟"
 oe_cne.15.b:0 "整饬王室直领并充实本土常备劲旅"
 oe_cne.16.title:0 "库特纳霍拉银矿与约阿希姆银元"
 oe_cne.16.desc:0 "库特纳霍拉与矿山山脉的深井排水工程采出丰沛银脉，成色精纯的布拉格格罗申与约阿希姆塔勒银元源源流向欧洲各大钱庄。"
 oe_cne.16.a:0 "统一铸造王室标准塔勒银币"
 oe_cne.16.b:0 "以银矿厚利扶持波希米亚水晶与冶金"
 oe_cne.17.title:0 "二次掷窗事件与三十年战争导火索"
 oe_cne.17.desc:0 "布拉格城堡内，新教等级代表就《宗教宽容诏书》与帝国摄政激烈冲突，二次掷窗之举瞬间点燃席卷德意志的三十年战争烽火。"
 oe_cne.17.a:0 "总动员波希米亚等级军并缔结新教联邦"
 oe_cne.17.b:0 "联络帝国诸选侯斡旋和谈以保民生"
 oe_cne.18.title:0 "波希米亚等级复兴与工业曙光"
 oe_cne.18.desc:0 "十八世纪的纺织工场、瓷窑冶铁与捷克学术复兴令波希米亚等级焕发新生，古老宪政传统与近代实业精神交相辉映。"
 oe_cne.18.a:0 "大力扶持波希米亚近代工场与商贸行会"
 oe_cne.18.b:0 "振兴波希米亚议会传统与捷克语文学院"
 oe_cne.19.title:0 "《大特权宪章》与奥地利大公尊号"
 oe_cne.19.desc:0 "鲁道夫四世在维也纳亮出雄心勃勃的《大特权宪章》，自号足以比肩选侯的奥地利大公，并创办维也纳大学与布拉格分庭抗礼。"
 oe_cne.19.a:0 "宣示奥地利大公尊号与世袭不可分法度"
 oe_cne.19.b:0 "资助维也纳大学与圣斯蒂芬大教堂营造"
 oe_cne.20.title:0 "马克西米利安一世"
 oe_cne.20.desc:0 "当诸国君主在连绵血战中耗尽国力之际，马克西米利安一世借勃艮第、西班牙与波匈王室联姻编织王朝巨网，以柔克刚缔造日不落霸业。"
 oe_cne.20.a:0 "广结欧陆王室联姻与王朝继承同盟"
 oe_cne.20.b:0 "整编马克西米利安帝国雇佣长矛兵团"
 oe_cne.21.title:0 "第一次维也纳之围（1529）"
 oe_cne.21.desc:0 "深秋骤雨倾泻多瑙河平原，奥斯曼大军兵临维也纳城下；尼克拉斯·萨尔姆伯爵率领德意志长矛兵、西班牙火枪手与维也纳市民在克恩顿门死战坚守。"
 oe_cne.21.a:0 "血守城垣缺口并改筑近代星形棱堡"
 oe_cne.21.b:0 "征集帝国军区抗土军税与诸侯援军"
 oe_cne.22.title:0 "反宗教改革与维也纳军事院"
 oe_cne.22.desc:0 "为统筹多瑙河持久战事并重振世袭领地的公教信仰统一，维也纳设立常设宫廷军事委员会（Hofkriegsrat），同时广建耶稣会学院。"
 oe_cne.22.a:0 "确立宫廷军事委员会统管军需与边防"
 oe_cne.22.b:0 "赞助耶稣会学院与巴洛克公教文教复兴"
 oe_cne.23.title:0 "多瑙河畔帝国军事边区"
 oe_cne.23.desc:0 "自亚得里亚海峭壁绵延至多瑙河沼泽，维也纳在帝国南疆划设直属军事边区，赐予自由边防兵农免除农奴义务以换取世代戍边。"
 oe_cne.23.a:0 "颁授自由边防兵农（Grenzer）屯戍特许"
 oe_cne.23.b:0 "修筑边境烽火台链与多瑙河检疫站"
 oe_cne.24.title:0 "欧根亲王与匈牙利大反攻"
 oe_cne.24.desc:0 "萨伏伊的欧根亲王挥师横渡蒂萨河大破森塔，继而攻克贝尔格莱德，率领哈布斯堡胸甲骑兵与掷弹兵横扫多瑙河盆地。"
 oe_cne.24.a:0 "委任欧根亲王统率胸甲骑兵与攻城主力"
 oe_cne.24.b:0 "颁布多瑙河平原垦殖与城市重建敕令"
 oe_cne.25.title:0 "《国事诏书》与特蕾莎新政"
 oe_cne.25.desc:0 "面对列强撕毁《国事诏书》的险局，玛丽亚·特蕾莎毅然赴匈牙利议会感召效忠，创办特蕾莎军事学院并对世袭领地推行全面税制与文官改革。"
 oe_cne.25.a:0 "推行豪格维茨财税改革与特蕾莎军校"
 oe_cne.25.b:0 "尊崇各省等级特权并促成外交革命结盟"
 oe_cne.26.title:0 "约瑟夫二世与开明专制风暴"
 oe_cne.26.desc:0 "锐意革新的约瑟夫二世颁布《宗教宽容敕令》、废除农奴人身依附并推行择才任官，令启蒙之士振奋却也震动保守贵族。"
 oe_cne.26.a:0 "雷厉风行推行约瑟夫主义开明敕令"
 oe_cne.26.b:0 "循序渐进推进改革并安抚各邦等级"
 oe_cne.27.title:0 "卡尔马联盟与厄勒海峡通行税"
 oe_cne.27.desc:0 "丹麦、挪威与瑞典代表齐聚卡尔马城堡共商北欧联合王冠，同时赫尔辛厄炮台严控厄勒海峡水道，向往来波罗的海的商船征收丰厚通行税。"
 oe_cne.27.a:0 "严征厄勒海峡通行税并扩建北欧王家舰队"
 oe_cne.27.b:0 "协调丹挪瑞三国枢密院共治协约"
 oe_cne.28.title:0 "斯德哥尔摩惨案与瓦萨独立"
 oe_cne.28.desc:0 "斯德哥尔摩大广场的血腥清洗震动北欧，达拉纳冰雪之中，古斯塔夫·瓦萨高举自由旗帜号召矿工与自耕农起兵光复独立王国。"
 oe_cne.28.a:0 "凝聚自由农兵确立独立世袭王权"
 oe_cne.28.b:0 "借吕贝克商行信贷稳固海贸与财源"
 oe_cne.29.title:0 "古斯塔夫·阿道夫"
 oe_cne.29.desc:0 "北方雄狮古斯塔夫·阿道夫率蓝黄近卫旅登陆波美拉尼亚，以轻便团属野战炮、齐射火枪手与突击骑兵的步炮骑协同掀起欧洲近代军事革命。"
 oe_cne.29.a:0 "全面推行排枪齐射与轻便团属火炮协同"
 oe_cne.29.b:0 "委任奥克森谢纳改革中央合议院政务"
 oe_cne.30.title:0 "瑞典波罗的海霸权"
 oe_cne.30.desc:0 "从什切青、维斯马到里加与纳尔瓦的波罗的海大河口尽飘蓝底黄十字王旗，斯德哥尔摩一举成就波罗的海内湖霸业。"
 oe_cne.30.a:0 "扼守波罗的海河口关税并扩建皇家船坞"
 oe_cne.30.b:0 "推行王田收回令与永久军垦分摊制（Indelningsverket）"
 oe_cne.31.title:0 "丹麦绝对王权《王法典》"
 oe_cne.31.desc:0 "历经哥本哈根保卫战后，在市民与教士阶层支持下，腓特烈三世颁行欧洲最具法理完备性的绝对王权成文法——《王法典》（Kongeloven）。"
 oe_cne.31.a:0 "颁行《王法典》并设立直属海军与财政署"
 oe_cne.31.b:0 "扩建哥本哈根与卑尔根皇家远洋贸易公司"
 oe_cne.32.title:0 "大北方战争"
 oe_cne.32.desc:0 "世纪之交波罗的海群雄联手发难，瑞典以刺刀白刃突击闻名的卡洛林军团与丹麦北海舰队卷入决定北欧百年命运的大北方战争。"
 oe_cne.32.a:0 "发扬卡洛林近卫军白刃冲锋与铁血攻势"
 oe_cne.32.b:0 "整备群岛近海舰队并固守北欧本土要冲"
 oe_cne.33.title:0 "瑞典自由时代议会"
 oe_cne.33.desc:0 "穷兵黩武的绝对王权落幕后，斯德哥尔摩四等级国会掌握国政，“礼帽派”与“睡帽派”围绕重商实业、出版自由与科学振兴展开激烈辩论。"
 oe_cne.33.a:0 "支持礼帽派：振兴铁矿、东印度贸易与科学院"
 oe_cne.33.b:0 "支持睡帽派：力行财政节流与出版自由法"
 oe_cne.34.title:0 "北欧启蒙运动与武装中立同盟"
 oe_cne.34.desc:0 "当海洋列强在大西洋鏖战不休之际，北欧诸邦力推农奴解放、农业改良与启蒙学术，并组建武装中立护航舰队捍卫中立海商航线。"
 oe_cne.34.a:0 "派遣武装中立护航舰队捍卫远洋商权"
 oe_cne.34.b:0 "颁行农民解放令与北欧皇家启蒙学院"
 oe_cne.35.title:0 "拉约什大帝与安茹黄金时代"
 oe_cne.35.desc:0 "在安茹百合与阿尔帕德条纹王旗下，拉约什大帝坐拥欧洲最富饶的喀尔巴阡金矿，创办佩奇大学并将王权威望远播亚得里亚海与波兰。"
 oe_cne.35.a:0 "广铸纯金福林并扩建喀尔巴阡金银矿场"
 oe_cne.35.b:0 "颁布世袭封地法并整编大领主旗军"
 oe_cne.36.title:0 "匈雅提长征与贝尔格莱德大捷"
 oe_cne.36.desc:0 "当奥斯曼巨炮轰塌贝尔格莱德外城之际，摄政匈雅提·亚诺什亲率铁甲河船冲破多瑙河封锁并发动雷霆反击，全基督教世界自此正午鸣钟铭记大捷。"
 oe_cne.36.a:0 "死守多瑙河要塞链并扩编内河战船队"
 oe_cne.36.b:0 "融合边防轻骑兵与胡斯战车战术"
 oe_cne.37.title:0 "马加什·科尔温"
 oe_cne.37.desc:0 "马加什大王以均平户税供养中欧首支常备职业劲旅“黑军”，更将布达王宫化为藏书冠绝阿尔卑斯以北的科尔温文艺复兴图书馆。"
 oe_cne.37.a:0 "扩编常备精锐黑军（Fekete Sereg）"
 oe_cne.37.b:0 "广建科尔温图书馆并延揽意大利人文大师"
 oe_cne.38.title:0 "多饶·捷尔吉农民十字军起义"
 oe_cne.38.desc:0 "原为响应十字军诏令集结于佩斯平原的数万贫苦农奴，在塞凯伊军官多饶·捷尔吉率领下调转镰刀与火枪，猛烈冲击骄横的大领主庄园。"
 oe_cne.38.a:0 "裁抑大领主苛政并扩大自由王家城镇权"
 oe_cne.38.b:0 "颁行《三部法典》巩固贵族骑兵主导秩序"
 oe_cne.39.title:0 "莫哈奇战役生死危机（1526）"
 oe_cne.39.desc:0 "莫哈奇泥泞平原之上，寡不敌众的匈牙利骑士军团直面奥斯曼耶尼切里火枪阵与铁链炮群，圣斯蒂芬王冠的存亡系于此战。"
 oe_cne.39.a:0 "严令待援固守高地并整顿近代火器阵线"
 oe_cne.39.b:0 "急召全欧基督教援军并加固边境城堡链"
 oe_cne.40.title:0 "拉科齐独立风云与匈牙利议会复兴"
 oe_cne.40.desc:0 "在绣有“为了祖国与自由”的战旗下，拉科齐·费伦茨二世联合库鲁茨轻骑、边疆诸郡与匈牙利议会，高扬宪政自由与民族复兴旗帜。"
 oe_cne.40.a:0 "挥师库鲁茨骠骑高呼“为了祖国与自由”"
 oe_cne.40.b:0 "重申匈牙利议会宪权并缔结国内和解"
 oe_cne.41.title:0 "重返罗马与弥合西方大分裂"
 oe_cne.41.desc:0 "阔别台伯河七十载后，教廷舰船终泊奥斯蒂亚，教宗凯旋重返永恒之城罗马；唯有彻底弥合东西对立教宗之裂痕，方能重振罗马圣座普世威望。"
 oe_cne.41.a:0 "重振罗马圣座并召开大公会议弥合分裂"
 oe_cne.41.b:0 "整顿教廷年税并修缮罗马圣彼得领地"
 oe_cne.42.title:0 "美第奇银行与佛罗伦萨柏拉图学园"
 oe_cne.42.desc:0 "以佛罗伦萨金弗罗林计价的汇票通行伦敦至罗马，美第奇家族更延揽拜占庭流亡学者、画师与哲人创办柏拉图学园，点燃意大利文艺复兴璀璨火炬。"
 oe_cne.42.a:0 "重金赞助柏拉图学园与文艺复兴名家"
 oe_cne.42.b:0 "扩张美第奇跨欧金融汇兑与金弗罗林信贷"
 oe_cne.43.title:0 "《洛迪和约》与意大利均势"
 oe_cne.43.desc:0 "厌倦连年雇佣兵混战后，米兰、威尼斯、佛罗伦萨、那不勒斯与教皇国共签《洛迪和约》，首创常驻大使馆与近代欧洲均势外交体制。"
 oe_cne.43.a:0 "首创常驻使馆制度并维系意大利同盟均势"
 oe_cne.43.b:0 "整顿雇佣兵契约并升级意大利城邦要塞炮兵"
 oe_cne.44.title:0 "博尔吉亚权谋与战神教宗"
 oe_cne.44.desc:0 "面对法西强军纵横亚平宁半岛，教廷毅然收复罗马涅、组建宗座瑞士近卫队，尤利乌斯二世更亲披战甲督战米兰多拉，誓保教廷与意大利独立。"
 oe_cne.44.a:0 "组建宗座瑞士近卫队并统率神圣同盟护教"
 oe_cne.44.b:0 "委任米开朗基罗与拉斐尔装点西斯廷与梵蒂冈"
 oe_cne.45.title:0 "圣彼得大教堂与特伦托大公会议"
 oe_cne.45.desc:0 "在米开朗基罗高耸穹顶笼罩下的圣彼得大教堂与庄严的特伦托会场中，天主教会以明晰教义、神学院革新、全球传教与恢宏建筑回应宗教改革风暴。"
 oe_cne.45.a:0 "颁行特伦托改革决议并派遣海外传教团"
 oe_cne.45.b:0 "竣工圣彼得大教堂穹顶并营建巴洛克罗马城"
 oe_cne.46.title:0 "萨伏伊阿尔卑斯关隘守卫者"
 oe_cne.46.desc:0 "埃马努埃莱·菲利贝托公爵迁都阿尔卑斯南麓都灵，遍筑山口棱堡与都灵星形要塞，将萨伏伊-皮埃蒙特锻造为扼守法意咽喉的铁闸。"
 oe_cne.46.a:0 "筑牢阿尔卑斯隘口堡垒链与都灵星形要塞"
 oe_cne.46.b:0 "善用阿尔卑斯通道关税与法奥均势外交"
 oe_cne.47.title:0 "皮埃蒙特近代化与意王室崛起"
 oe_cne.47.desc:0 "西班牙王位继承战争落幕后，跻身王国之列的皮埃蒙特与那不勒斯效法欧陆前沿体制，全面革新常备步炮军团、炮兵学院与精密土地税籍。"
 oe_cne.47.a:0 "创办皇家炮兵学院并整训皮埃蒙特掷弹兵"
 oe_cne.47.b:0 "推行精密土地清丈与地中海自由港改革"
 oe_cne.48.title:0 "意大利复兴运动的曙光"
 oe_cne.48.desc:0 "从米兰、都灵、佛罗伦萨到罗马与那不勒斯，报刊沙龙、歌剧院与国民自卫军激荡起同一个炽热理想——终结千年分裂，缔造独立统一的意大利民族国家。"
 oe_cne.48.a:0 "高举宪政统一旗帜并整编国民志愿军团"
 oe_cne.48.b:0 "缔结意大利关税同盟与邦联外交协约"
