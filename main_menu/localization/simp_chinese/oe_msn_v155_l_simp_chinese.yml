 oe_msn_mlc_05_johor_temasek_gate:0 "淡马锡南门：贯通马六甲与新加坡海峡"
 oe_msn_mlc_05_johor_temasek_gate_desc:0 "兼稳马六甲王港与柔佛南端咽喉淡马锡，将新加坡海峡门户与半岛南岸融为不可分割的海权[core|e]。轻捷战艇穿梭岛链既淬炼[navy_tradition|e]并维系严密[maritime_presence|e]，也带动双港同步实现[development|e]。"
 oe_msn_mlc_05_johor_temasek_gate_req_tt:0 "直接或通过非主权属国同时控制马六甲与淡马锡。"
 oe_msn_mlc_06_kedah_pahang_peninsula:0 "马来半岛一统：吉打锡矿与彭亨金沙"
 oe_msn_mlc_06_kedah_pahang_peninsula_desc:0 "北控吉打富锡谷地、东纳彭亨淘金河域，使海港王国首次拥有纵深丰厚的马来半岛腹地[core|e]。官营锡锭与砂金出口源源充实[gold|e]，既深化内陆[control|e]，亦以崇高[prestige|e]折冲暹罗南窥。"
 oe_msn_mlc_06_kedah_pahang_peninsula_req_tt:0 "直接或通过非主权属国同时控制吉打与彭亨。"
 oe_msn_mlc_07_sumatra_twin_shores:0 "海峡双岸：兼控北苏门答腊与南岸胡椒港"
 oe_msn_mlc_07_sumatra_twin_shores_desc:0 "兼掌马六甲海峡两岸，自亚齐胡椒港至锡亚克与巨港尽入势力范围，令黄金水道成为内海般的[maritime_presence|e]禁脔。苏门答腊诸邦归入[subjects|e]与联姻网络，既整合两岸[trade|e]，更广聚骁勇海峡[sailors|e]。"
 oe_msn_mlc_07_sumatra_twin_shores_req_tt:0 "直接或通过属国控制巴赛或亚齐之一及巨港或锡亚克之一，并拥有至少 6 座海港。"
 oe_msn_mlc_08_straits_fortress_fleet:0 "海峡铁锁舰队：拒欧洲炮舰于门外"
 oe_msn_mlc_08_straits_fortress_fleet_desc:0 "在海防[fort|e]棱堡与快舰舟师遍布重型青铜勒拉火炮，令1511年孤港失守的悲剧永不重演。近代化海峡[navy|e]凭铁血[navy_tradition|e]拒欧洲炮舰于海峡之外，长保两洋门户主权与[stability|e]。"
 oe_msn_mlc_08_straits_fortress_fleet_req_tt:0 "宗教改革时代或之后，拥有海港、控制至少 20 个地块、海军传统至少 22，并拥有造船厂或棱堡。"
 oe_msn_mlc_09_zheng_he_depot:0 "郑和官厂：东亚宝船外交枢纽"
 oe_msn_mlc_09_zheng_he_depot_desc:0 "在港畔营建郑和宝船官厂与补给仓城，以卓越[diplomacy|e]将马六甲与东亚巨舰航线紧密相连，极增[diplomatic_reputation|e]。礼遇远洋使团既能借势威慑强邻，又吸引丝瓷源源涌入[trade|e]，令海峡[prestige|e]名闻四海。"
 oe_msn_mlc_09_zheng_he_depot_req_tt:0 "文艺复兴时代或之后，持有至少 200 金币，并拥有船坞或市场。"
 oe_msn_mlc_10_indian_ocean_spice_mart:0 "印度洋香料与棉布总市"
 oe_msn_mlc_10_indian_ocean_spice_mart_desc:0 "谚云掌控马六甲即扼威尼斯之咽喉，孟加拉细布、摩鹿加丁香与中华丝绸尽汇于海峡总[market|e]。川流不息的跨洋转口[trade|e]带来如海[gold|e]，令整座苏丹国焕发出万国辐辏的[prosperity|e]。"
 oe_msn_mlc_10_indian_ocean_spice_mart_req_tt:0 "拥有海港、持有至少 350 金币、月度贸易与税收收入至少 22，并拥有行会大厅或码头。"
 oe_msn_mlc_11_golden_malay_letters:0 "《马来纪年》与群岛雅言盛世"
 oe_msn_mlc_11_golden_malay_letters_desc:0 "编纂《马来纪年》与汉都亚传奇史诗，使典雅马来语成为自亚齐至特尔纳特的通用外交商语，尽显[cultural_tradition|e]巅峰。兴盛的港市[literacy|e]与宏丽官署[buildings|e]，共同装点出文采风流的海峡黄金[capital|e]。"
 oe_msn_mlc_11_golden_malay_letters_req_tt:0 "宗教改革时代或之后，稳定度至少 15、首都发展度至少 28，并拥有海关或艺术研究院。"
 oe_msn_mlc_12_lord_of_the_two_seas:0 "两洋海峡永恒共主：黄金海权天命"
 oe_msn_mlc_12_lord_of_the_two_seas_desc:0 "作为串联印度洋与南海的自由枢纽，马六甲苏丹国打破殖民魔咒，傲然跃升为两洋瞩目的海洋[great_power|e]。无双[maritime_presence|e]、近代商贸[institutions|e]与煊赫[prestige|e]，共同加冕两洋海峡永恒共主。"
 oe_msn_mlc_12_lord_of_the_two_seas_req_tt:0 "专制主义时代或之后，直接或通过属国控制马六甲以及巴赛或淡马锡之一，稳定度至少 18，且为列强或月度贸易与税收收入至少 75。"
