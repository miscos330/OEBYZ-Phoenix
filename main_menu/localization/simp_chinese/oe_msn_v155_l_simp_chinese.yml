 oe_msn_mlc_destiny_BUTTON_DETAILS:0 "专为马六甲（MLC）与巴赛（PSA）打造的十二项三柱天命任务树：奠基季风商港、颁行《马六甲海法》与四方港务官体制、兼控马来半岛与苏门答腊双岸并铸造海峡护航舰队，东连郑和宝船官厂、西汇印度洋香料市场，登临两洋海峡永恒共主！"
