 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m1:0 "升龙北关火器防线"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m1:0 "谅山关隘与交趾火铳军团互为犄角，令任何南下大军寸步难行。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m2:0 "千里南进：红河至湄公海陆通衢"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m2:0 "从升龙、顺化、平定直抵西贡湄公河三角洲，丰饶稻米与海港将大越推向中南半岛霸主。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m3:0 "洪德礼法与云屯丝绸海市"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m3:0 "严明洪德律法、国子监科举与云屯海港商市相得益彰，成就富强文明的大越盛世。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m4:0 "南天永恒大越帝国天命"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m4:0 "北屏群山、南襟湄公、东控南海航道，大越以钢铁军纪与礼乐文治傲立东方。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m1:0 "萨迪纳法制与皇家白象精锐"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m1:0 "文武分治的萨迪纳制度与披甲皇家战象相辅相成，铸就暹罗王师赫赫军威。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m2:0 "湄南至两海：中南半岛朝贡霸主"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m2:0 "北服兰纳、东震吴哥、西通安达曼海港，大城王朝稳执中南半岛外交与商航牛耳。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m3:0 "宋加洛青瓷与万国商馆盛景"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m3:0 "素可泰瓷窑、皇家官船与万国使馆汇聚东西珍货，令大城金顶佛寺享誉四海。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m4:0 "暹罗转轮圣王永恒天命"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m4:0 "贯通湄南沃野与东西两洋商路，礼佛修文与近代火器并举的暹罗帝国万世长青。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m1:0 "帕拉帕誓言：千岛戎克海权"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m1:0 "戎克巨舰破浪巡航与神圣曼陀罗朝贡网将千岛诸邦紧密系于特罗乌兰王座之下。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m2:0 "爪哇—马六甲—香料群岛海疆"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m2:0 "西扼三佛齐与马六甲咽喉，东揽马鲁古丁香肉豆蔻宝库，满者伯夷称雄整个努山塔拉。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m3:0 "《爪哇史颂》与锦石—厨闽富港"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m3:0 "兴盛的锦石、厨闽商港与灿烂爪哇史诗典籍共同托起群岛经济与文化黄金时代。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m4:0 "努山塔拉千岛永恒共主"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m4:0 "万岛来朝、香料万里通航、戎克舰队纵横两洋，满者伯夷成就永恒海洋帝国伟业。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m1:0 "《马六甲海法》与四方港务官典范"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m1:0 "公正严明的海商法典、多语港务官与伊斯兰法学书院令马六甲成为东方商业信用标杆。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m2:0 "双岸铁锁：海峡护航巨舰网"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m2:0 "兼控马来半岛与苏门答腊两岸良港，护航舰队令任何海盗与霸权垄断舰队望而却步。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m3:0 "郑和官厂至印度洋香料总汇"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m3:0 "东接中华丝瓷宝船、西连印度与阿拉伯商帮，马来语文明与香料关税并驾齐驱。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m4:0 "两洋海峡永恒共主天命"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m4:0 "控扼印度洋与南中国海咽喉，凭公正海法、无敌水师与万国通商稳居亚洲海上明珠之巅。"
