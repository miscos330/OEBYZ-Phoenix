 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m1:0 "升龙北关火器防线"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m1:0 "谅山关隘与交趾火铳军团互为犄角，令任何南下大军寸步难行。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m2:0 "千里南进：红河至湄公海陆通衢"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m2:0 "从升龙、顺化、平定直抵西贡湄公河三角洲，丰饶稻米与海港将大越推向中南半岛霸主。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m3:0 "洪德礼法与云屯丝绸海市"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m3:0 "严明洪德律法、国子监科举与云屯海港商市相得益彰，成就富强文明的大越盛世。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m4:0 "南天永恒大越帝国天命"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m4:0 "北屏群山、南襟湄公、东控南海航道，大越以钢铁军纪与礼乐文治傲立东方。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m1:0 "萨迪纳法制与皇家白象精锐"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m1:0 "文武分治的萨迪纳制度与披甲皇家战象相辅相成，铸就暹罗王师赫赫军威。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m2:0 "湄南至两海：中南半岛朝贡霸主"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m2:0 "北服兰纳、东震吴哥、西通安达曼海港，大城王朝稳执中南半岛外交与商航牛耳。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m3:0 "宋加洛青瓷与万国商馆盛景"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m3:0 "素可泰瓷窑、皇家官船与万国使馆汇聚东西珍货，令大城金顶佛寺享誉四海。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m4:0 "暹罗转轮圣王永恒天命"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m4:0 "贯通湄南沃野与东西两洋商路，礼佛修文与近代火器并举的暹罗帝国万世长青。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m1:0 "帕拉帕誓言：千岛戎克海权"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m1:0 "戎克巨舰破浪巡航与神圣曼陀罗朝贡网将千岛诸邦紧密系于特罗乌兰王座之下。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m2:0 "爪哇—马六甲—香料群岛海疆"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m2:0 "西扼三佛齐与马六甲咽喉，东揽马鲁古丁香肉豆蔻宝库，满者伯夷称雄整个努山塔拉。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m3:0 "《爪哇史颂》与锦石—厨闽富港"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m3:0 "兴盛的锦石、厨闽商港与灿烂爪哇史诗典籍共同托起群岛经济与文化黄金时代。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m4:0 "努山塔拉千岛永恒共主"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m4:0 "万岛来朝、香料万里通航、戎克舰队纵横两洋，满者伯夷成就永恒海洋帝国伟业。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m1:0 "《马六甲海法》与四方港务官典范"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m1:0 "公正严明的海商法典、多语港务官与伊斯兰法学书院令马六甲成为东方商业信用标杆。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m2:0 "双岸铁锁：海峡护航巨舰网"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m2:0 "兼控马来半岛与苏门答腊两岸良港，护航舰队令任何海盗与霸权垄断舰队望而却步。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m3:0 "郑和官厂至印度洋香料总汇"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m3:0 "东接中华丝瓷宝船、西连印度与阿拉伯商帮，马来语文明与香料关税并驾齐驱。"
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m4:0 "两洋海峡永恒共主天命"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m4:0 "控扼印度洋与南中国海咽喉，凭公正海法、无敌水师与万国通商稳居亚洲海上明珠之巅。"
 oe_msn_dai_destiny:0 "#bold #color_yellow 南天大越：红河至湄公天命#!#!"
 oe_msn_dai_destiny_DESCRIPTION:0 "从蓝山抗敌、洪德盛世到千里南进统一越南"
 oe_msn_dai_destiny_CRITERIA_DESCRIPTION:0 "稳固升龙与清化根基、铸造交趾火器并完成南进经略直抵湄公三角洲"
 oe_msn_dai_destiny_BUTTON_TOOLTIP:0 "开启大越天命任务树"
 oe_msn_dai_destiny_BUTTON_DETAILS:0 "专为大越打造的十二项三柱天命任务树：修筑红河大堤与蓝山铁军、打造交趾火铳守御谅山北关、沿顺化与毗阇耶推进南进运动直至西贡湄公三角洲，并以《洪德律》、云屯丝港与升龙科举成就南天永恒强国。"
 oe_msn_dai_01_red_river_dykes:0 "红河大堤：升龙与云屯定鼎"
 oe_msn_dai_01_red_river_dykes_desc:0 "加固红河三角洲绵延千里的土石长堤，护佑[capital|e]升龙周遭双季稻田旱涝保收，并借纵横河运直连云屯海门。精修水利渠闸与官仓[buildings|e]持续滋养乡野[prosperity|e]，为大越新基筑牢稳固持久的[stability|e]。"
 oe_msn_dai_01_red_river_dykes_req_tt:0 "拥有升龙与云屯，稳定度至少 5，并拥有粮仓或引水渠系统。"
 oe_msn_dai_02_lam_son_banner:0 "蓝山旌旗：清化与乂安根基"
 oe_msn_dai_02_lam_son_banner_desc:0 "清化蓝山至乂安重峦叠嶂乃大越起兵光复、屡克强敌的忠勇根基，源源不断提供骁勇[manpower|e]与不屈[army_tradition|e]。依山筑牢军镇[fort|e]与兵器作坊，使大越[army|e]在面临北疆危局时始终保有进退自如的战略纵深。"
 oe_msn_dai_02_lam_son_banner_req_tt:0 "直接或通过属国控制清化与乂安，并拥有城堡或兵器行会。"
 oe_msn_dai_03_giao_chi_firearms:0 "交趾火铳：精锐火器军工"
 oe_msn_dai_03_giao_chi_firearms_desc:0 "驰名东亚的交趾火铳射速迅捷、管身精良，配合战船红铜火炮使升龙军工跃居火器[advances|e]前沿。以官局精锐火器全面换装常备[regulars|e]，大幅跃升[army_tradition|e]并令大越[prestige|e]威震中南半岛。"
 oe_msn_dai_03_giao_chi_firearms_req_tt:0 "文艺复兴时代或之后，拥有升龙，持有至少 220 金币与 15 陆军传统，拥有铸炮厂或军械库，并接纳职业军队思潮或解锁对应进阶。"
 oe_msn_dai_04_northern_pass_shield:0 "谅山北关：固若金汤山岭防线"
 oe_msn_dai_04_northern_pass_shield_desc:0 "在谅山与支棱关险峻的喀斯特峡谷间层叠修筑[fort|e]石壁与伏兵营垒，铸就阻挡北骑南下的铁壁雄关。稳固北疆关隘[control|e]既可常保国境[stability|e]，更令北方大朝乐于以平等[diplomacy|e]相待。"
 oe_msn_dai_04_northern_pass_shield_req_tt:0 "地理大发现时代或之后，直接或通过属国控制谅山，稳定度至少 15、陆军传统至少 22，并拥有练兵场或城堡。"
 oe_msn_dai_05_hue_coastal_march:0 "顺化南屯：跨越海云关"
 oe_msn_dai_05_hue_coastal_march_desc:0 "越过云雾缭绕的海云关、定居香江畔的顺化要冲，便为大越开辟了中越沿海[core|e]与南进前哨。广施军屯招民垦殖既催动顺化[development|e]并延伸朝廷[control|e]，亦使王朝[prestige|e]直指占城。"
 oe_msn_dai_05_hue_coastal_march_req_tt:0 "直接或通过非主权属国控制顺化（阿摩罗波罗）。"
 oe_msn_dai_06_vijaya_nam_tien:0 "顺天南进：定鼎毗阇耶故都"
 oe_msn_dai_06_vijaya_nam_tien_desc:0 "克复红砖古塔林立的占城故都毗阇耶，一圆黎圣宗南进宏图，令中越沿海谷地尽归大越[core|e]。跨海越岭的远征既锤炼三军[army_tradition|e]，更为帝国打开丰饶的中部[trade|e]港湾与[prosperity|e]。"
 oe_msn_dai_06_vijaya_nam_tien_req_tt:0 "直接或通过非主权属国控制毗阇耶。"
 oe_msn_dai_07_panduranga_frontier:0 "宾童龙海疆与中越船厂"
 oe_msn_dai_07_panduranga_frontier_desc:0 "南抵宾童龙碧波港湾，沿海密林良港化作大越造船基地，广募熟谙风涛的[sailors|e]并厚植[navy_tradition|e]。铁炮战船昼夜巡弋岬角航线，壮大帝国[navy|e]并确立无可撼动的东海[maritime_presence|e]。"
 oe_msn_dai_07_panduranga_frontier_req_tt:0 "直接或通过属国控制宾童龙，控制至少 45 个地块，并拥有至少 5 座海港。"
 oe_msn_dai_08_mekong_delta_pearl:0 "湄公明珠：嘉定与西贡水乡"
 oe_msn_dai_08_mekong_delta_pearl_desc:0 "将柴棍古埠营建为嘉定重镇，便把沃野千里的湄公河三角洲化作帝国南方的粮仓与商贸[core|e]。纵横交错的运河网加速城邑[development|e]，令稻米货殖源源涌入[market|e]并催生南国[prosperity|e]。"
 oe_msn_dai_08_mekong_delta_pearl_req_tt:0 "宗教改革时代或之后，直接或通过属国控制嘉定（西贡），并拥有造船厂或海关。"
 oe_msn_dai_09_hong_duc_code:0 "《洪德律》：文献之邦法制典范"
 oe_msn_dai_09_hong_duc_code_desc:0 "颁行《洪德律》明定田产法权、保障女子承继并严惩贪墨，令文献之邦的王道[legitimacy|e]垂范南天。法制清明使[cabinet|e]行政高效有序，不仅厚植[cultural_tradition|e]，更令汉字与喃字[literacy|e]日趋普及。"
 oe_msn_dai_09_hong_duc_code_req_tt:0 "文艺复兴时代或之后，拥有升龙，拥有大学或图书馆，且贵族阶层满意度至少 50%（若有）。"
 oe_msn_dai_10_van_don_silk_port:0 "云屯海市：生丝陶瓷通四海"
 oe_msn_dai_10_van_don_silk_port_desc:0 "朱豆窑青花瓷与红河生丝自云屯、铺宪良港远销四海，使大越特产在东亚与南洋[trade|e]中炙手可热。广迎唐船、朱印船与马来商舶汇聚[market|e]，既令国库广纳[gold|e]，也反哺本土窑坊[buildings|e]。"
 oe_msn_dai_10_van_don_silk_port_req_tt:0 "拥有云屯与升龙，持有至少 300 金币，月度贸易与税收收入至少 22，并拥有瓷器行会或码头。"
 oe_msn_dai_11_nha_nhac_civil_exam:0 "文庙进士与大越雅乐盛典"
 oe_msn_dai_11_nha_nhac_civil_exam_desc:0 "文庙进士题名龟碑林立，朝堂奏响庄重典雅的大越雅乐，为[capital|e]升龙注入隽永[cultural_tradition|e]。科举取士既令寒门英才归心而强化[crown_power|e]，亦使士林文官阶层的[estate_satisfaction|e]倍增。"
 oe_msn_dai_11_nha_nhac_civil_exam_req_tt:0 "宗教改革时代或之后，拥有升龙，稳定度至少 15、首都发展度至少 30，且教士阶层满意度至少 50%（若有）。"
 oe_msn_dai_12_eternal_dai_viet:0 "南天永恒大越：山河一统天命"
 oe_msn_dai_12_eternal_dai_viet_desc:0 "北起红河重峦与谅山雄关、南抵湄公河肥沃入海口，山河一统的大越终以南天共主之姿屹立为雄视四方的[great_power|e]。凭近代[institutions|e]、充沛[development|e]与卓著国威[prestige|e]，锦绣南国从此巍然永存。"
 oe_msn_dai_12_eternal_dai_viet_req_tt:0 "专制主义时代或之后，直接或通过属国控制升龙、毗阇耶与嘉定，稳定度至少 18，且为列强或月度贸易与税收收入至少 75。"
 oe_msn_ayu_destiny:0 "#bold #color_yellow 湄南金顶：大城与素可泰天命#!#!"
 oe_msn_ayu_destiny_DESCRIPTION:0 "从湄南稻仓、白象战阵到中南半岛转轮圣王"
 oe_msn_ayu_destiny_CRITERIA_DESCRIPTION:0 "统一阿瑜陀耶与素可泰、推行萨迪纳新政、经略兰纳吴哥并繁荣万国商馆"
 oe_msn_ayu_destiny_BUTTON_TOOLTIP:0 "开启大城—素可泰天命"
 oe_msn_ayu_destiny_BUTTON_DETAILS:0 "专为大城（AYU）与素可泰（SUK）打造的十二项三柱天命任务树：统筹湄南河浮稻粮仓、《萨迪纳》文武官制与皇家白象精锐，北合兰纳、东控吴哥、西通安达曼与暹罗湾商港，并以宋加洛青瓷与万国商馆登临暹罗转轮圣王宝座。"
 oe_msn_ayu_01_chao_phraya_crown:0 "湄南沃野：浮稻丰仓定王基"
 oe_msn_ayu_01_chao_phraya_crown_desc:0 "三河环抱的阿瑜陀耶岛城依托湄南河汛期广种耐涝浮稻，丰盈官仓令王城[capital|e]尽享富足[prosperity|e]。驯服冲积沃野既为新邦奠定长久[stability|e]，也推动河谷城邑实现蓬勃[development|e]。"
 oe_msn_ayu_01_chao_phraya_crown_req_tt:0 "直接或通过属国控制阿瑜陀耶或素可泰之一，稳定度至少 5，并拥有粮仓或市场。"
 oe_msn_ayu_02_sakdina_ministries:0 "《萨迪纳》文武分职法典"
 oe_msn_ayu_02_sakdina_ministries_desc:0 "波隆摩·戴莱洛迦纳王颁布《萨迪纳》法典厘定尊卑品阶，并于[cabinet|e]中将文官内阁与兵部军政分立。严明秩次既大幅增强王室[crown_power|e]与天命[legitimacy|e]，亦使各地王公[estates|e]各安其分。"
 oe_msn_ayu_02_sakdina_ministries_req_tt:0 "直接或通过属国控制阿瑜陀耶或华富里之一，稳定度至少 10，且贵族阶层满意度至少 50%（若有）。"
 oe_msn_ayu_03_royal_white_elephants:0 "圣白象护国与皇家战象营"
 oe_msn_ayu_03_royal_white_elephants_desc:0 "祥瑞圣白象不仅象征君王福泽与无上[prestige|e]，更率领披甲战象营背负旋炮冲锋陷阵，成为帝国[army|e]中坚。将丛林象兵奇阵与火器[advances|e]融会贯通，使大城三军铸就威震邻邦的[army_tradition|e]。"
 oe_msn_ayu_03_royal_white_elephants_req_tt:0 "文艺复兴时代或之后，持有至少 220 金币与 15 陆军传统，拥有军械库或铸炮厂，且接纳职业军队思潮或解锁对应进阶。"
 oe_msn_ayu_04_phrai_luang_corps:0 "王民征召与常备炮兵新军"
 oe_msn_ayu_04_phrai_luang_corps_desc:0 "整编直属王室的王民为常备新军[regulars|e]，并延聘西洋炮匠统训重炮，彻底取代散漫的临时征召兵。沿河道筑起新式砖石[fort|e]棱堡，既保战时[manpower|e]充裕，亦令王畿与外府[control|e]严密无虞。"
 oe_msn_ayu_04_phrai_luang_corps_req_tt:0 "宗教改革时代或之后，稳定度至少 15、陆军传统至少 25，并拥有兵营或棱堡。"
 oe_msn_ayu_05_unite_sukhothai_lavo:0 "南北泰族合一：大城与素可泰共主"
 oe_msn_ayu_05_unite_sukhothai_lavo_desc:0 "将古都素可泰与海港大城合为一体，南北泰族终沿湄南河流域融汇为牢不可破的王国[core|e]。兼承素可泰文字法统与法王声威，既倍增王室[legitimacy|e]与[cultural_tradition|e]，又拉动河谷[development|e]。"
 oe_msn_ayu_05_unite_sukhothai_lavo_req_tt:0 "直接或通过非主权属国同时控制阿瑜陀耶与素可泰。"
 oe_msn_ayu_06_lanna_northern_gate:0 "清迈北门：经略兰纳山谷"
