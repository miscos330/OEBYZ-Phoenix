 oe_sre_proclaim_five_theater_triumph.title: "宣告五方远征帝国凯旋"
 oe_sre_proclaim_five_theater_triumph.desc: "西班牙、高卢、不列颠、日耳曼多瑙防线与波斯泰西封五方古疆皆已重归罗马鹰旗之下。诏集元老院、诸军统帅与万民举行旷古未有之五方凯旋大典。"
 oe_sre_proclaim_five_theater_triumph.a: "御驾经梅塞大道举行万世凯旋大典"
 oe_sre_seal_thessaloniki_reconciliation.title: "敕封塞萨洛尼基巴列奥略和解宪章"
 oe_sre_seal_thessaloniki_reconciliation.desc: "颁布永世帝国金玺诏书，正式确认君士坦丁堡与塞萨洛尼基之和解宪章，保障圣德米特里之城的市政礼遇，彻底终结巴列奥略王朝绵延数十载的骨肉内耗。"
 oe_sre_seal_thessaloniki_reconciliation.a: "以紫墨御笔敕封双城和解永世宪章"
 STATIC_MODIFIER_NAME_oe_sre_five_theater_triumph_mod: "五方远征帝国凯旋"
 STATIC_MODIFIER_DESC_oe_sre_five_theater_triumph_mod: "自赫拉克勒斯之柱与哈德良长城，直至莱茵、多瑙河防线与泰西封拱门，罗马鹰旗已在五方大远征中尽数凯旋。"
 STATIC_MODIFIER_NAME_oe_sre_thessaloniki_reconciliation_mod: "塞萨洛尼基巴列奥略和解宪章"
 STATIC_MODIFIER_DESC_oe_sre_thessaloniki_reconciliation_mod: "君士坦丁堡大皇宫与塞萨洛尼基城邦元老共署和解金玺诏书，彻底弥合巴列奥略长幼两支裂痕，令马其顿重镇永归帝室一心。"
 STATIC_MODIFIER_NAME_oe_sre_spania_beachhead_mod: "重设西班牙总督区前沿"
 STATIC_MODIFIER_DESC_oe_sre_spania_beachhead_mod: "登陆新迦太基后，帝国水师泊地与沿岸要塞群在西班牙东南海岸稳固立足，为收复伊比利亚全境奠定桥头堡。"
 STATIC_MODIFIER_NAME_oe_sre_spania_arsenals_mod: "伊比利亚帝国船坞盟约"
 STATIC_MODIFIER_DESC_oe_sre_spania_arsenals_mod: "收编地中海西岸港埠与造船匠行，为帝国打造补给迅捷的西海舰队船坞与护航商路。"
 STATIC_MODIFIER_NAME_oe_sre_toledo_legal_synthesis_mod: "托莱多哥特罗马法典合编"
 STATIC_MODIFIER_DESC_oe_sre_toledo_legal_synthesis_mod: "托莱多法学家将古西哥特《审判者法典》与拜占庭《巴西利卡法典》融会贯通，使伊比利亚各阶层心悦诚服归入罗马法统。"
 STATIC_MODIFIER_NAME_oe_sre_toledo_praetorian_edict_mod: "托莱多近卫长官直辖敕令"
 STATIC_MODIFIER_DESC_oe_sre_toledo_praetorian_edict_mod: "君士坦丁堡御派大法官直接执掌托莱多税政与司法，在伊比利亚高原推行整齐划一的帝国直辖税制。"
 STATIC_MODIFIER_NAME_oe_sre_pillars_of_hercules_mod: "赫拉克勒斯之柱守望者"
 STATIC_MODIFIER_DESC_oe_sre_pillars_of_hercules_mod: "扼守直布罗陀海峡南北两岸的双子要塞重锁罗马内海西门，凡出入大西洋之商舰战船皆须向帝国关津纳贡通检。"
 STATIC_MODIFIER_NAME_oe_sre_hercules_oceanic_charter_mod: "大西洋门户远洋宪章"
 STATIC_MODIFIER_DESC_oe_sre_hercules_oceanic_charter_mod: "双首鹰旗高悬赫拉克勒斯之柱后，帝国航海师贯通塞维利亚、里斯本与金角湾的跨洋航线，开启罗马大西洋商潮。"
 STATIC_MODIFIER_NAME_oe_sre_narbonensis_crossing_mod: "纳博讷高卢与多米提亚驿道重光"
 STATIC_MODIFIER_DESC_oe_sre_narbonensis_crossing_mod: "架桥渡过罗讷河并修葺古罗马多米提亚大道，令帝国大军得以自意大利长驱直入高卢腹地而补给无阻。"
 STATIC_MODIFIER_NAME_oe_sre_rhone_communes_mod: "罗讷河谷自治市镇特许状"
 STATIC_MODIFIER_DESC_oe_sre_rhone_communes_mod: "确认马赛、阿尔勒与里昂的商业自治特权，以繁盛的市民税源与商行拥护稳固南高卢统治。"
 STATIC_MODIFIER_NAME_oe_sre_lutetia_prefecture_mod: "卢泰西亚帝国近卫大区幕府"
 STATIC_MODIFIER_DESC_oe_sre_lutetia_prefecture_mod: "于卢泰西亚重建高卢近卫大区总署，以严密高效的罗马税籍与司法体系总领塞纳河与卢瓦尔河流域。"
 STATIC_MODIFIER_NAME_oe_sre_seine_imperial_schools_mod: "卢泰西亚帝国法学与艺文学院"
 STATIC_MODIFIER_DESC_oe_sre_seine_imperial_schools_mod: "汇集巴黎大学硕儒与君士坦丁堡修辞法学名师，令卢泰西亚跃升为希腊罗马古典学术在西欧的最高殿堂。"
 STATIC_MODIFIER_NAME_oe_sre_gallic_senators_mod: "高卢元老入主帝国政务院"
 STATIC_MODIFIER_DESC_oe_sre_gallic_senators_mod: "仿效古帝克劳狄乌斯故事，延揽高卢名门世族入席帝国近卫大区政务院，使西欧贵族与罗马皇权休戚与共。"
 STATIC_MODIFIER_NAME_oe_sre_gallic_tagmata_mod: "高卢罗马重甲骑兵近卫军"
 STATIC_MODIFIER_DESC_oe_sre_gallic_tagmata_mod: "将高卢重装骑士传统与拜占庭圣骑兵阵法熔于一炉，编成威震西陲的帝国铁甲骑兵军团。"
 STATIC_MODIFIER_NAME_oe_sre_channel_bridgehead_mod: "不列颠帝国舰队重建"
 STATIC_MODIFIER_DESC_oe_sre_channel_bridgehead_mod: "重整横跨多佛海峡至泰晤士河口的不列颠帝国舰队，牢牢掌握海峡制海权与跨海增援动脉。"
 STATIC_MODIFIER_NAME_oe_sre_londinium_staple_mod: "伦迪尼乌姆帝国羊毛商埠"
 STATIC_MODIFIER_DESC_oe_sre_londinium_staple_mod: "特许伦迪尼乌姆羊毛商栈与织呢行会，将北海商贸与纺织关税源源不断引入帝国国库。"
 STATIC_MODIFIER_NAME_oe_sre_hadrians_limes_mod: "重筑哈德良边墙防线"
 STATIC_MODIFIER_DESC_oe_sre_hadrians_limes_mod: "自索尔韦湾至泰恩河口重修石筑里程堡、烽燧与驻军要塞，令帝国极北边墙固若金汤。"
 STATIC_MODIFIER_NAME_oe_sre_northern_limitanei_mod: "不列颠北境屯戍守备军"
 STATIC_MODIFIER_DESC_oe_sre_northern_limitanei_mod: "沿约克与北方边郡授田屯兵，编练久经沙场的常备重步兵守备军拱卫不列颠行省。"
 STATIC_MODIFIER_NAME_oe_sre_britannia_restored_mod: "不列颠四行省管区光复"
 STATIC_MODIFIER_DESC_oe_sre_britannia_restored_mod: "伦迪尼乌姆、约克与北疆要冲尽复旧观，帝国正式重建古典晚期不列颠四行省管区建制，皇威远及北海之滨。"
 STATIC_MODIFIER_NAME_oe_sre_insular_admiralty_mod: "不列颠群岛帝国海务署"
 STATIC_MODIFIER_DESC_oe_sre_insular_admiralty_mod: "依托不列颠优质橡木林与良港深湾兴建帝国海军船坞，将罗马海上霸权投射至北海与北大西洋。"
 STATIC_MODIFIER_NAME_oe_sre_agri_decumates_mod: "什一地莱茵多瑙堡垒链"
 STATIC_MODIFIER_DESC_oe_sre_agri_decumates_mod: "贯通维也纳、雷根斯堡与美因茨要塞群，构筑衔接莱茵河与多瑙河上游的近代化炮垒防线。"
 STATIC_MODIFIER_NAME_oe_sre_rhine_danube_corridor_mod: "莱茵多瑙帝国河运走廊"
 STATIC_MODIFIER_DESC_oe_sre_rhine_danube_corridor_mod: "统一两河关津与帝国官营驳船队，将中欧矿产与工坊产品直通黑海与地中海庞大市场。"
 STATIC_MODIFIER_NAME_oe_sre_foederati_legions_mod: "帝国日耳曼同盟精锐兵团"
 STATIC_MODIFIER_DESC_oe_sre_foederati_legions_mod: "由罗马军官统辖并按月颁饷，将莱茵与多瑙河诸部劲旅整编为军纪严明、效忠紫袍的常备同盟兵团。"
 STATIC_MODIFIER_NAME_oe_sre_germanic_concordats_mod: "日耳曼自由市与诸侯协约"
 STATIC_MODIFIER_DESC_oe_sre_germanic_concordats_mod: "承认莱茵与多瑙流域自由市与邦君既得特许，极大缓和扩张阻力并令中欧诸侯甘为帝国屏藩。"
 STATIC_MODIFIER_NAME_oe_sre_pax_beyond_limes_mod: "越过边墙的罗马和平"
 STATIC_MODIFIER_DESC_oe_sre_pax_beyond_limes_mod: "帝国军用驿道、石桥与边哨跨越古典莱茵多瑙界河，终于圆成奥古斯都未竟的北疆长治蓝图。"
 STATIC_MODIFIER_NAME_oe_sre_trans_rhenish_vicariate_mod: "跨莱茵帝国管区建制"
 STATIC_MODIFIER_DESC_oe_sre_trans_rhenish_vicariate_mod: "在莱茵河以东推行由宣誓归附的地方领主协治的管区体制，保障日耳曼诸省贡赋充盈而边疆晏然。"
 STATIC_MODIFIER_NAME_oe_sre_ctesiphon_triumph_mod: "泰西封巨拱下之凯旋"
 STATIC_MODIFIER_DESC_oe_sre_ctesiphon_triumph_mod: "当帝国重甲圣骑兵高举拉巴鲁姆军旗列阵穿过底格里斯河畔的泰西封巨拱，图拉真与希拉克略的荣光再度照耀东方。"
 STATIC_MODIFIER_NAME_oe_sre_tigris_granaries_mod: "两河灌渠与美索不达米亚粮仓复兴"
 STATIC_MODIFIER_DESC_oe_sre_tigris_granaries_mod: "帝国水利匠师疏浚两河古渠并重建官仓，令美索不达米亚新月沃土的丰饶物产重现盛世气象。"
 STATIC_MODIFIER_NAME_oe_sre_carrhae_avenged_mod: "卡莱鹰旗雪耻与希拉克略荣光"
 STATIC_MODIFIER_DESC_oe_sre_carrhae_avenged_mod: "铭记罗马军团横扫两河与伊朗高原、彻底洗雪卡莱古耻并继踵希拉克略东征的伟业，全军士气与军纪臻于巅峰。"
 STATIC_MODIFIER_NAME_oe_sre_persian_satrapy_mod: "希波帝国共治方略"
 STATIC_MODIFIER_DESC_oe_sre_persian_satrapy_mod: "融合罗马行省法制与波斯文书官僚传统，以务实宽容政策迅疾安定自大不里士至伊斯法罕的高原名城。"
 STATIC_MODIFIER_NAME_oe_sre_silk_road_gateways_mod: "帝国丝绸之路东西总关"
 STATIC_MODIFIER_DESC_oe_sre_silk_road_gateways_mod: "兼扼波斯湾巴士拉港与大不里士、伊斯法罕陆路商栈，欧亚丝绸香料关税如百川归海直注君士坦丁堡。"
 STATIC_MODIFIER_NAME_oe_sre_eastern_gates_mod: "扎格罗斯与呼罗珊铁关防线"
 STATIC_MODIFIER_DESC_oe_sre_eastern_gates_mod: "沿扎格罗斯隘口与呼罗珊商道险要构筑山岳要塞群，为帝国东疆铸就坚不可摧的钢铁屏藩。"
 STATIC_MODIFIER_NAME_oe_sre_thessaloniki_charter_mod: "塞萨洛尼基和解金玺诏书"
 STATIC_MODIFIER_DESC_oe_sre_thessaloniki_charter_mod: "降旨确认塞萨洛尼基作为共治皇帝尊崇驻跸之地的特权，彻底化解巴列奥略两支宿怨，赢得马其顿军民赤诚拥戴。"
 STATIC_MODIFIER_NAME_oe_sre_macedonian_crown_pact_mod: "马其顿皇权直辖盟约"
 STATIC_MODIFIER_DESC_oe_sre_macedonian_crown_pact_mod: "将塞萨洛尼基世家派系直接纳入君士坦丁堡中枢文书体系，削平门户党争并强化色雷斯与马其顿财政统一。"
 STATIC_MODIFIER_NAME_oe_sre_st_demetrius_jurists_mod: "圣德米特里御书楼与法学学派"
 STATIC_MODIFIER_DESC_oe_sre_st_demetrius_jurists_mod: "继承阿尔梅诺普洛斯《六书》遗绪的塞萨洛尼基法学家与修院抄经士获颁御赐年俸，令罗马民法与古典学统薪火长明。"
 STATIC_MODIFIER_NAME_oe_sre_thermaic_guilds_mod: "塞尔迈湾双港商行同盟"
 STATIC_MODIFIER_DESC_oe_sre_thermaic_guilds_mod: "塞萨洛尼基与金角湾实行双港关税互认，令爱琴海商船络绎不绝，为帝国中兴注入源源不断的商贸活水。"
 STATIC_MODIFIER_NAME_oe_sre_two_thrones_united_mod: "双座归一·巴列奥略永世同心"
 STATIC_MODIFIER_DESC_oe_sre_two_thrones_united_mod: "塞萨洛尼基巴列奥略长支共治朝廷在和睦与尊荣中归于永恒，未留兵燹内乱，唯留君士坦丁堡与塞萨洛尼基双城一体、皇统永固之千古美谈。"
 STATIC_MODIFIER_NAME_oe_sre_dual_capital_legacy_mod: "双京法礼文教永续盟约"
 STATIC_MODIFIER_DESC_oe_sre_dual_capital_legacy_mod: "以永世法学、书院与市政基金铭记约翰七世的克己和解，令君士坦丁堡与塞萨洛尼基化作撑持罗马文明长盛不衰的双柱。"
 oe_sre.1.title: "登陆新迦太基"
 oe_sre.1.desc: "距查士丁尼麾下名将利贝里乌斯在西班牙海岸插上拉巴鲁姆军旗已逾八百载，罗马德罗蒙战舰与运兵船队再度在新迦太基岬角下锚登陆。沿岸海港纷纷开启水门，轻骑斥候沿橄榄谷地深入内陆，向伊比利亚宣告罗马大军重临西海。"
 oe_sre.1.a: "重建西班牙海防总督区与沿岸堡垒"
 oe_sre.1.b: "特许伊比利亚港埠船坞并扩编西海护航队"
 oe_sre.2.title: "托莱多哥特罗马法典合编"
 oe_sre.2.desc: "在峭壁环绕的托莱多古城内，王室档案库依然珍藏着源自狄奥多西法典的西哥特《审判者法典》拉丁古卷。伊比利亚法学家与君士坦丁堡御派律法官齐聚回廊，商议究竟以合编的新罗马伊比利亚法典治国，还是由近卫大区直颁敕令。"
 oe_sre.2.a: "将《审判者法典》与《巴西利卡法典》合编并行"
 oe_sre.2.b: "在伊比利亚高原直行君士坦丁堡近卫大区法度"
 oe_sre.3.title: "赫拉克勒斯之柱光复"
 oe_sre.3.desc: "在卡尔佩巨岩隔着蔚蓝激流遥望阿非利加海岸之处，帝国号角迎着落日长鸣。自古典末叶以来，赫拉克勒斯双柱首次再度归入罗马鹰旗拱卫之下：从金角湾至外洋门户，罗马内海浑然一体，而辽阔的大西洋正于前方徐徐展开。"
 oe_sre.3.a: "重筑海峡双岸要塞并设帝国大西洋关津"
 oe_sre.3.b: "颁行西海远洋舰队与跨洋商路宪章"
 oe_sre.4.title: "渡过罗讷河：重返纳博讷高卢"
 oe_sre.4.desc: "在阿尔勒与尼姆依然镌刻着凯撒拉丁铭文的古斗兽场下，帝国鹰旗纵队踏过罗讷河石桥。自马赛至纳博讷的市政官吏捧献银钥迎师，惊叹新罗马军团竟沿古老的多米提亚大道再度西进高卢。"
 oe_sre.4.a: "修葺多米提亚军道并设纳博讷常备驻军"
 oe_sre.4.b: "确认罗讷河谷诸自治市镇商贸特权"
 oe_sre.5.title: "卢泰西亚帝国近卫大区幕府"
 oe_sre.5.desc: "在昔日尤利安大帝被军团高举盾牌拥立的塞纳河岛上，帝国紫旗再度垂挂于卢泰西亚古殿之外。帝国政务院书吏逐一核查法兰西税籍与大学宪章，筹备重建贯通地中海与北海的高卢近卫大区总署。"
 oe_sre.5.a: "于卢泰西亚正式开府设高卢近卫大区长官"
 oe_sre.5.b: "特许塞纳河帝国法学与古典艺文学院"
 oe_sre.6.title: "高卢元老入席帝国政务院"
 oe_sre.6.desc: "来自阿基坦、勃艮第与法兰西岛的豪门使团庄严步入御前，援引古帝克劳狄乌斯准许高卢显贵入主罗马元老院的青铜铭辞。收纳高卢世家，既可令西欧勋贵入席帝国政务院共襄大政，亦可将高卢骑士劲旅编为帝国精锐铁骑。"
 oe_sre.6.a: "特许高卢勋贵世家入席帝国近卫大区政务院"
 oe_sre.6.b: "整编高卢罗马重甲圣骑兵近卫军团"
 oe_sre.7.title: "横渡海峡：重临伦迪尼乌姆"
 oe_sre.7.desc: "穿过迷茫的海峡海雾，帝国桨帆战舰与大型卡拉克战船在多佛白崖下抢滩登陆，继而溯泰晤士河直抵伦迪尼乌姆码头。在河畔残存的古罗马城墙基址旁，帝国宣谕官高声宣诏，宣告不列颠脱离罗马世界千年的漫长岁月就此终结。"
 oe_sre.7.a: "在泰晤士河口重建不列颠帝国常备舰队"
 oe_sre.7.b: "特许伦迪尼乌姆商行与帝国羊毛贸易埠"
 oe_sre.8.title: "重筑哈德良边墙防线"
 oe_sre.8.desc: "越过约克古城向北，帝国工兵在索尔韦湾与泰恩河之间的荒原丘陵上重新踏勘哈德良边墙的青苔巨石基址。筑城师与边帅提议：或沿古线重修石筑里程堡与烽火台链，或在北境山原授田屯兵编练世袭守备军。"
 oe_sre.8.a: "沿古址重筑哈德良石墙与里程堡链"
 oe_sre.8.b: "授田编练不列颠北境屯戍守备兵团"
 oe_sre.9.title: "不列颠帝国行省光复"
 oe_sre.9.desc: "在当年君士坦丁大帝首获奥古斯都尊号的约克古会堂内，帝国特使高悬紫旗，正式宣告不列颠四行省管区光复。自康沃尔锡矿至北境边墙，这片海外大岛再度铸造铭刻皇帝圣像的帝国金币。"
 oe_sre.9.a: "正式颁行不列颠四行省帝国管区宪制"
 oe_sre.9.b: "建置不列颠群岛帝国海务署与北海船厂"
 oe_sre.10.title: "莱茵多瑙什一地边墙重铸"
 oe_sre.10.desc: "自多瑙河畔维也纳、雷根斯堡直至黑林山麓与莱茵河大拐弯，帝国先头部队已收复纵贯中欧的战略枢纽——古罗马什一地边区。统帅们正沿两大名川筹划星堡炮垒链，而商贾则翘首期盼贯通北海与黑海的帝国河运通衢。"
 oe_sre.10.a: "沿什一地与多瑙河上游兴建帝国要塞链"
 oe_sre.10.b: "开通莱茵多瑙帝国官营河运商贸走廊"
 oe_sre.11.title: "日耳曼帝国同盟军整合"
 oe_sre.11.desc: "在科隆、美因茨与纽伦堡的大教堂与行会大厅间，久经战阵的日耳曼雇佣兵、自由市参议与骑士们正权衡在复兴罗马紫袍下的归宿。帝国枢密院主张复兴古典同盟军盟约，将中欧劲卒与自治名城悉数纳入效忠帝国的秩序之中。"
 oe_sre.11.a: "将日耳曼劲旅整编为帝国常备同盟兵团"
 oe_sre.11.b: "与日耳曼自由市及诸侯缔结帝国屏藩协约"
 oe_sre.12.title: "越过边墙的罗马和平"
 oe_sre.12.desc: "在昔日瓦鲁斯军团折戟沉沙的幽暗密林之处，如今已竖起镌刻罗马里数的帝国石道碑碣。自阿尔卑斯山口直至北方大川，钟声齐鸣，宣告着比奥古斯都与马可奥勒留时代更为辽远的罗马和平已覆盖中欧腹地。"
 oe_sre.12.a: "修筑通往易北河的帝国军道与边哨体系"
 oe_sre.12.b: "设立由归附诸侯协治的跨莱茵帝国管区"
 oe_sre.13.title: "横渡底格里斯河：兵临泰西封"
 oe_sre.13.desc: "暮色四合之际，在底格里斯河畔巍峨矗立的泰西封巨拱之下，身披札甲的罗马圣骑兵高擎金色拉巴鲁姆军旗与赤红龙形风幡，踏过椰枣林荫列阵入城。昔日图拉真、塞维鲁与希拉克略皆曾扬威于此，如今双首鹰旗再度君临两河平原。"
 oe_sre.13.a: "于泰西封巨拱下举行东征大军阅兵凯旋礼"
 oe_sre.13.b: "疏浚两河古灌渠并重建美索不达米亚官仓"
 oe_sre.14.title: "雪耻卡莱与希拉克略之荣光"
 oe_sre.14.desc: "自大不里士古城至伊朗高原崇山隘口，帝国诸军一路凯歌高奏，为延续千余年的罗波争雄写下终章。军帐祈祷礼中，随军教士追念希拉克略大帝东征夺回圣十字架的壮举，诸将则高举鹰旗告慰卡莱古战场上的先烈英灵。"
 oe_sre.14.a: "铭刻卡莱雪耻碑并颁行全军尚武嘉奖"
 oe_sre.14.b: "融合罗马法制与波斯文书体制安抚高原诸城"
 oe_sre.15.title: "帝国丝绸之路东西总关"
 oe_sre.15.desc: "随着帝国税关旗帜高悬伊朗高原商栈与通往波斯湾的河口良港，满载东方丝绸、撒马尔罕纸张与印度香料的万里商队自伊斯法罕与巴士拉畅通无阻地直抵金角湾。昔日烽火连天的东疆，已化作冠绝天下的帝国财富动脉。"
 oe_sre.15.a: "统筹波斯湾海港与陆路丝绸驿站税关"
 oe_sre.15.b: "沿扎格罗斯与呼罗珊要冲构筑帝国东疆铁关"
 oe_sre.16.title: "塞萨洛尼基市政和解宪章"
 oe_sre.16.desc: "历经整整一代巴列奥略皇室骨肉相残的风雨后，帝国第二名城、圣德米特里所庇佑的塞萨洛尼基再度与君士坦丁堡并肩屹立于紫鹰旗帜之下。以约翰七世一系为首的长支宫廷与塞萨洛尼基元老联名呈献和解宪章：恳请御赐共治重镇礼遇，以换取马其顿永世忠顺、永绝内争。"
 oe_sre.16.a: "颁赐《塞萨洛尼基和解金玺诏书》确认共治尊荣"
 oe_sre.16.b: "将马其顿世家直接纳入君士坦丁堡大皇宫直辖"
 oe_sre.17.title: "共治皇帝御书楼与圣德米特里法学家"
 oe_sre.17.desc: "随着博斯普鲁斯海峡与塞尔迈湾之间重归和平，塞萨洛尼基共治朝廷迅速焕发出罗马法学与市政复兴的璀璨光彩。康斯坦丁·阿尔梅诺普洛斯的弟子们在圣德米特里大教堂旁续修《六书》法典，而港畔商行亦上书恳请缔结双港海贸协定，共振爱琴海繁华。"
 oe_sre.17.a: "拨款资助圣德米特里御书楼与罗马法学学派"
 oe_sre.17.b: "特许塞尔迈湾商行同盟与双港关税互认"
 oe_sre.18.title: "双座归一：巴列奥略永世遗泽"
 oe_sre.18.desc: "黎明微曦洒落君士坦丁堡三重狄奥多西城墙，亦同时照亮塞萨洛尼基的海滨箭楼，两座名城的大教堂钟声齐鸣。昔日几欲撕裂帝国的巴列奥略长支在忠义与和睦中归于荣光史册，留下双座归一、手足同心的不朽皇统，共迎帝国未来一切风云试炼。"
 oe_sre.18.a: "立碑铭刻双座归一之巴列奥略永世皇统盟约"
 oe_sre.18.b: "设立双京法礼文教永续基金以彰千古和解"
