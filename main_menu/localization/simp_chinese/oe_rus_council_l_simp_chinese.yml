 oe_rsc_debate_status: "议题提出时的分歧值：[SCOPE.GetValue('oe_rsc_display_disagreement')|0]/3。"
 oe_rus_council.1.1: "在[SCOPE.sLocation('oe_rsc_choice_1').GetName]召开会议。"
 oe_rus_council.1.2: "在[SCOPE.sLocation('oe_rsc_choice_2').GetName]召开会议。"
 oe_rus_council.1.3: "在[SCOPE.sLocation('oe_rsc_choice_3').GetName]召开会议。"
 oe_rus_council.1.cancel: "取消本次行程。"
 oe_rus_council.1.t: "择定全罗斯宗教会议会址"
 oe_rus_council.1.d: "信使将会议的邀请带向北方。主教与修院院长盼望帝国派来的教士能够平息纷争，而各城的王公也希望这场会议能为自己的领地增添声望。先选定会址，再决定沿途拜访的教区。"
 oe_rus_council.2.direct: "结束沿途访问，前往会议召开地。"
 oe_rus_council.2.1: "拜访[SCOPE.sCountry('oe_rsc_stop_1').GetName]的首都。"
 oe_rus_council.2.2: "拜访[SCOPE.sCountry('oe_rsc_stop_2').GetName]的首都。"
 oe_rus_council.2.3: "拜访[SCOPE.sCountry('oe_rsc_stop_3').GetName]的首都。"
 oe_rus_council.2.other: "查看其他可以拜访的国家。"
 oe_rus_council.2.t: "北行使团的行程"
 oe_rus_council.2.d: "使团可以径赴会议，也可以先拜访罗斯诸邦的首都。每处驻留六十天，聆听教士的陈情、检阅教区文书，再将当地教会的馈赠送回帝国。最多访问三个不同国家。"
 oe_rus_council.3.a: "收下教会的馈赠，继续行程。"
 oe_rus_council.3.t: "六十日的教区访问"
 oe_rus_council.3.d: "使团驻留已满六十日。主教们呈上账册与陈情，当地教士也备妥了馈赠，其价值相当于本国教士阶层三个月的收入。经过共同礼拜与商议，帝国与北方教会的联系又紧密了一分。"
 oe_rus_council.4.a: "愿我们的言语归于合一。"
 oe_rus_council.4.t: "全罗斯宗教会议开幕"
 oe_rus_council.4.d: "钟声穿过城中的屋顶。主教、修院长老与远道而来的使者在圣像前就座，帝国的教士宣读了开会的祷词。两百日的商议就此开始；礼仪、教产与世俗权柄的问题，都将在这里得到回答。"
 oe_rus_council.11.a: "让双方公开陈述，由使团居中裁量。"
 oe_rus_council.11.b: "资助译经抄写，逐条核对原文。"
 oe_rus_council.11.t: "神学争论"
 oe_rus_council.11.d: "一句关于神恩的措辞，使两派学者争论不休。有人执意援引古老译本，另一方则要求采用希腊原文。使团必须让双方听见彼此的意思，而不只是声调。\n\n$oe_rsc_debate_status$"
 oe_rus_council.12.a: "依据现有文书作出裁定。"
 oe_rus_council.12.b: "支付丈量与抄契费用，重新划定边界。"
 oe_rus_council.12.t: "教区争端"
 oe_rus_council.12.d: "两位主教都将河畔村庄列入自己的教区。旧敕书的边界含糊不清，而村民已经交了两次教会供奉。划界不仅关乎名分，也关乎收入。\n\n$oe_rsc_debate_status$"
 oe_rus_council.13.a: "要求他们公开重申信经。"
 oe_rus_council.13.b: "派遣教师耐心讲解，再举行共同礼拜。"
 oe_rus_council.13.t: "异端倾向"
 oe_rus_council.13.d: "几名乡村教士被指控传播未经认可的教说。他们坚称自己只是沿用祖辈的祷词。严厉的处置或许会平息指控，也可能把整个教区推向猜疑。\n\n$oe_rsc_debate_status$"
 oe_rus_council.14.a: "私下劝说使者退让。"
 oe_rus_council.14.b: "以帝国名义作保，订立双方认可的章程。"
 oe_rus_council.14.t: "世俗统治者干涉教会"
 oe_rus_council.14.d: "王公的使者要求确认一位亲信的主教任命，并提醒会议，城中的秩序全靠他的卫队维持。教士们望向帝国使团，等待一句既能维护教规又不激怒东道主的话。\n\n$oe_rsc_debate_status$"
 oe_rus_council.15.a: "劝各教区自行募集救济。"
 oe_rus_council.15.b: "由帝国出资开设施粥处。"
 oe_rus_council.15.t: "赈济穷人"
 oe_rus_council.15.d: "前来请愿的穷人挤在院门外，教士们却仍在为礼席和仪仗的费用争执。有人提议削减宴席，把面包送给饥饿者；也有人担心这会使会议失去体面。\n\n$oe_rsc_debate_status$"
 oe_rus_council.16.a: "听取在场见证，然后举行表决。"
 oe_rus_council.16.b: "资助调查与传记编纂，慎重审查证言。"
 oe_rus_council.16.t: "为著名教徒封圣"
 oe_rus_council.16.d: "一位已故修士的声望遍及北方，朝圣者传述着他生前的慈行与身后的奇迹。拥护者盼望立即封圣，谨慎的主教却要求审查见证，免得虔敬沦为地方争荣的工具。\n\n$oe_rsc_debate_status$"
 oe_rus_council.17.a: "为志愿者写下荐书。"
 oe_rus_council.17.b: "支付旅费，并与修院约定学成归期。"
 oe_rus_council.17.t: "引荐教士前往阿索斯山修行"
 oe_rus_council.17.d: "几位年轻教士请求前往阿索斯山修习。他们的主教既为之欣喜，又担忧教区失去得力助手。帝国使者可以只写一封荐书，也可以安排旅费与接待，让这次远行有更稳妥的归期。\n\n$oe_rsc_debate_status$"
 oe_rus_council.21.a: "封存会议文书，让使团归来。"
 oe_rus_council.21.t: "宗教会议争吵不休"
 oe_rus_council.21.d: "会期已满，代表们仍各持己见。未能解决的纷争使帝国使团的权威受到质疑，最终的文书只留下了彼此矛盾的声明。"
 oe_rus_council.22.a: "封存会议文书，让使团归来。"
 oe_rus_council.22.t: "宗教会议圆满成功"
 oe_rus_council.22.d: "两百日的辩论终于汇成共同的决议。主教们在圣像前相互拥抱，帝国使团的签押与罗斯教会的印章并列在同一份文书上。分歧未曾使他们离心，反使共同的信仰更加清晰。"
 oe_rus_council.23.a: "封存会议文书，让使团归来。"
 oe_rus_council.23.t: "宗教会议落幕"
 oe_rus_council.23.d: "最后一次祷告之后，代表们陆续辞行。有些争议留待来日，但共同礼拜与相互倾听仍有价值。使团带回了签署的议决，也带回了对北方教会更深的了解。"
 oe_rus_council.99.t: "使团行程中止"
 oe_rus_council.99.d: "使团已经无法继续这次会议行程。尚未结算的访问与议事不再产生效果；五年的筹备间隔仍从本次出发日期计算。"
 oe_rus_council.99.a: "让随行人员平安归来。"
