 oe_all_rus_council: "全罗斯宗教会议"
 oe_all_rus_council_desc: "派遣一位国内教士，召集罗斯诸教区的代表。在三个随机的合格会址中择一，沿途最多访问三国首都。每站停留60天；会议历时200天，在第60、120、180天各讨论一个议题。分歧值决定会议的最终结果。冷却五年，无额外出发费用。"
