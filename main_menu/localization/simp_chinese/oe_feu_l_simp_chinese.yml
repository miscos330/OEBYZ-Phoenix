 oe_feu_io_ilkhan_imperial_seal:0 "奉请伊利汗国玉玺诏书"
 oe_feu_io_ilkhan_imperial_seal_desc:0 "颁布钤盖伊利汗国朱印玉玺的汗廷敕诏，宣示对波斯文官衙署与诸藩异密的正统宗主权，安抚附庸离心。"
 oe_feu_io_ilkhan_imperial_seal_cd:0 "伊利汗国玉玺诏书冷却"
 oe_feu_io_ilkhan_tuyul_banner:0 "征调突厥蒙古封邑军旗"
 oe_feu_io_ilkhan_tuyul_banner_desc:0 "依伊利汗国各省封邑采地军额征调突厥蒙古骑兵，强化轻骑突击威力并加快兵员整补。"
 oe_feu_io_ilkhan_tuyul_banner_cd:0 "突厥蒙古封邑军旗冷却"
 oe_feu_io_swiss_alpine_pikes:0 "颁授阿尔卑斯长矛各州特许状"
 oe_feu_io_swiss_alpine_pikes_desc:0 "在瑞士联邦各州推行统一长矛方阵操典与山谷烽火协防，提升重步纪律并为同盟各州赋予山岳协防加成。"
 oe_feu_io_swiss_alpine_pikes_cd:0 "阿尔卑斯长矛各州特许状冷却"
 oe_feu_io_swiss_perpetual_neutrality:0 "宣示永久中立同盟约"
 oe_feu_io_swiss_perpetual_neutrality_desc:0 "宣示联邦各州武装永久中立、超然于列强王朝纷争之外，以更低维护巩固高山要塞并凭特许雇佣兵团获利。"
 oe_feu_io_swiss_perpetual_neutrality_cd:0 "永久中立同盟约冷却"
 oe_feu_io_guelph_papal_subsidy:0 "教皇派联盟金库补贴"
 oe_feu_io_guelph_papal_subsidy_desc:0 "动用教廷汇兑与教皇派商业银团资金，提振自治城邦贸易收入、安抚市民行会并降低雇佣军开销。"
 oe_feu_io_guelph_papal_subsidy_cd:0 "教皇派联盟金库补贴冷却"
 oe_feu_io_ghibelline_imperial_vicar:0 "皇帝派帝国代牧敕令"
 oe_feu_io_ghibelline_imperial_vicar_desc:0 "借皇帝派同盟奉请帝国代牧敕书，强化君主集权、提升外交声望并鼓舞野战军心。"
 oe_feu_io_ghibelline_imperial_vicar_cd:0 "皇帝派帝国代牧敕令冷却"
 oe_feu_io_ireland_pale_parliament:0 "佩尔特许议会宪章"
 oe_feu_io_ireland_pale_parliament_desc:0 "召集佩尔境内盎格鲁-诺曼贵族与市民召开特许议会，厘定税赋补助、延伸边区王权控制并稳固藩属忠诚。"
 oe_feu_io_ireland_pale_parliament_cd:0 "佩尔特许议会宪章冷却"
 oe_feu_io_ireland_tara_muster:0 "塔拉盖尔至高王会盟征召"
 oe_feu_io_ireland_tara_muster_desc:0 "于塔拉圣丘吹响会盟号角，在至高王古旗之下集结爱尔兰诸省乡勇与盖尔重斧武士共卫故土。"
 oe_feu_io_ireland_tara_muster_cd:0 "塔拉至高王会盟征召冷却"
 oe_feu_io_sikh_khalsa_sangha:0 "卡尔萨尚武圣团结盟"
 oe_feu_io_sikh_khalsa_sangha_desc:0 "在锡克教圣团中祝圣并整编严明尚武的卡尔萨精锐，全面提升军队纪律、士气与后备兵源。"
 oe_feu_io_sikh_khalsa_sangha_cd:0 "卡尔萨尚武圣团冷却"
 oe_feu_io_hindu_bhakti_endowment:0 "虔信派神庙田产捐献"
 oe_feu_io_hindu_bhakti_endowment_desc:0 "向所属印度教宗派的大庙、经院与虔信派道场赐予田产香火，促进民间识字与教界和睦，并惠及同宗诸邦。"
 oe_feu_io_hindu_bhakti_endowment_cd:0 "虔信派神庙田产捐献冷却"
 oe_feu_dec_france_royal_domain.title:0 "路易十一王领大收拢"
 oe_feu_dec_france_royal_domain.desc:0 "法兰西开局坐拥三十八个亲王采邑与封建附庸。派遣王室司法官、核勘采邑归宗特许状并召令诸侯赴巴黎行效忠大礼，以消弭藩邦离心、提升外交吞并效率与王室权威；若于战时推行，还将同步激发全境战时王旗效忠盟誓。"
 oe_feu_dec_france_royal_domain.a:0 "颁行王领收拢敕令"
 oe_feu_dec_france_royal_domain_tt:0 "降低法兰西所有亲王采邑与附庸的独立倾向并赐予效忠誓约，获得持续20年的#Y 路易十一王领收拢新政#!（若正处战时，额外获得持续10年的#Y 战时王旗效忠盟誓#!）。"
 oe_feu_dec_bohemia_silesian_diet.title:0 "西里西亚与摩拉维亚等级盟约"
 oe_feu_dec_bohemia_silesian_diet.desc:0 "于布拉格召开王国等级大会，统筹波希米亚麾下二十个西里西亚、摩拉维亚与卢萨蒂亚公国宪章，理顺藩邦管辖、提升附庸忠诚并增进王室税收效率。"
 oe_feu_dec_bohemia_silesian_diet.a:0 "批准王冠领地等级盟约"
 oe_feu_dec_bohemia_silesian_diet_tt:0 "降低波希米亚所有附庸的独立倾向并赋予王冠领地协定，获得持续20年的#Y 西里西亚与摩拉维亚等级盟约#!。"
 oe_feu_dec_yunnan_pacification_office.title:0 "设立云南宣慰司土司安抚使署"
 oe_feu_dec_yunnan_pacification_office.desc:0 "统辖云南六十七家世袭土司极易令常规外交容量捉襟见肘。设立正式宣慰司安抚使署，颁行勘合铜印与边寨屯田粮储，大幅缓解羁縻行政重负、提升土司忠诚并保障西南卫所军粮。"
 oe_feu_dec_yunnan_pacification_office.a:0 "开置云南宣慰使司"
 oe_feu_dec_yunnan_pacification_office_tt:0 "降低所有附庸与土司独立倾向、缓解多土司外交与行政重负，获得持续20年的#Y 云南土司宣慰司安抚体制#!。"
 oe_feu_dec_mandala_tribute_circuit.title:0 "敕建曼荼罗圣坛朝贡巡礼制"
 oe_feu_dec_mandala_tribute_circuit.desc:0 "以王都为东南亚曼荼罗格局的礼仪与商贸中枢，厘定金银花岁贡仪制与季风海路护航契约，全面提升朝贡收益、藩邦忠诚与海上贸易效率。"
 oe_feu_dec_mandala_tribute_circuit.a:0 "颁行曼荼罗朝贡巡礼制"
 oe_feu_dec_mandala_tribute_circuit_tt:0 "安抚诸朝贡藩邦并赐予金银花庇护约，获得持续20年的#Y 曼荼罗圣坛朝贡巡礼制#!。"
 oe_feu_dec_sahara_pomor_frontier.title:0 "跨撒哈拉金盐与波莫尔毛皮特许状"
 oe_feu_dec_sahara_pomor_frontier.desc:0 "向扼守撒哈拉金盐绿洲驿道或北方波莫尔毛皮水路的边疆藩属颁授商贸特许状，以宗主护航换取稳定的商路税收与贡赋物流。"
 oe_feu_dec_sahara_pomor_frontier.a:0 "颁授边疆商路藩属特许状"
 oe_feu_dec_sahara_pomor_frontier_tt:0 "安抚边疆附庸与贡邦并赐予商队护航约，获得持续20年的#Y 金盐商路与波莫尔毛皮藩属特许状#!。"
 oe_feu.1.title:0 "百合花下的三十八采邑"
 oe_feu.1.desc:0 "来自勃艮第、波旁、奥尔良、布列塔尼、阿马尼亚克及数十处采邑封邦的使节云集巴黎西岱宫。诸侯无不严守祖传特许状，而外敌正伺机窥伺法兰西边疆。王室当以隆重朝觐与岁俸羁縻诸亲王，还是遣派王室司法官直接伸张王法？"
 oe_feu.1.a:0 "召开巴黎诸侯效忠大朝觐"
 oe_feu.1.b:0 "向各采邑派驻王室上诉司法官"
 oe_feu.2.title:0 "王室敕令常备军制"
 oe_feu.2.desc:0 "连年征战证明，仰赖诸侯私兵征召往往在关键时刻因封建领主离心而功亏一篑。王室大臣呈上划时代敕令草案：以常设人头税供养直属王室的敕令常备骑兵连，彻底摆脱大贵族对军权的挟制。"
 oe_feu.2.a:0 "组建王室敕令常备骑兵连"
 oe_feu.2.b:0 "确立常设王室人头税制"
 oe_feu.3.title:0 "“全能蜘蛛”与公益同盟之争"
 oe_feu.3.desc:0 "面对日益收紧的王权集权，实力最雄厚的亲王领主暗中酝酿“公益同盟”，妄图保住封建割据特权。枢密院献上两策：或效“全能蜘蛛”之谋，以密约、岁俸与继承条款分化瓦解；或直推王室青铜攻城炮队兵临叛藩城下。"
 oe_feu.3.a:0 "以纵横密约与归宗条款瓦解同盟"
 oe_feu.3.b:0 "以王室重炮慑服桀骜诸藩"
 oe_feu.4.title:0 "穆兰敕令：王领永不分割"
 oe_feu.4.desc:0 "历代显赫一时的中世纪亲王采邑经联姻、外交与征讨相继归宗。大法官与法学家呈上《穆兰敕令》，以王国根本大法宣示一切收拢公国永属不可分割之王领，再无裂土分封之患。"
 oe_feu.4.a:0 "颁布王领永不可分割根本法"
 oe_feu.4.b:0 "令各地高等法院统编省域法典"
 oe_feu.5.title:0 "西里西亚与摩拉维亚诸公国大议会"
 oe_feu.5.desc:0 "来自弗罗茨瓦夫、奥波莱、切申与莱格尼察的二十位西里西亚皮雅斯特公爵与摩拉维亚藩侯齐聚布拉格，确认归附圣瓦茨拉夫王冠。审慎的制度整合可将这片星罗棋布的藩邦化作中欧最富庶的王冠领地。"
 oe_feu.5.a:0 "令西里西亚诸公国行王冠效忠礼"
 oe_feu.5.b:0 "扩建布拉格黄金枢密院统理典章"
 oe_feu.6.title:0 "波希米亚等级妥协和约"
 oe_feu.6.desc:0 "宗教热忱与地方等级自治令布拉格市民与天主教西里西亚诸公国之间裂痕加深。王国当力促各派妥协和约以稳藩邦大局，还是以铁链战车堡垒严密布防全国要冲？"
 oe_feu.6.a:0 "签署波希米亚等级教派和约"
 oe_feu.6.b:0 "整编战车堡垒野战步军阵法"
 oe_feu.7.title:0 "滇云六十七土司勘合录"
 oe_feu.7.desc:0 "自大理、丽江的高山峡谷远至车里、麓川的澜沧江畔，六十七家世袭土司将户口贡册呈递云南宣慰使署。厘定勘合铜印与岁贡章程既可免除外交超载之弊，又保西南群山屏障无虞。"
 oe_feu.7.a:0 "颁授宣慰司勘合铜印与岁贡定额"
 oe_feu.7.b:0 "广设西南茶马古道驿传官市"
 oe_feu.8.title:0 "改土归流：卫所屯田与府县新政"
 oe_feu.8.desc:0 "西南边疆累世承平，滇道驿路贯通群山。封疆大吏奏请于要冲广设卫所屯田义仓以赡边卒，并趁土司绝嗣或失职之际循序推行改土归流、设府置县。"
 oe_feu.8.a:0 "大兴西南卫所屯田与边防义仓"
 oe_feu.8.b:0 "循序推进西南改土归流设府置县"
 oe_feu.9.title:0 "金银花贡树：曼荼罗朝贡巡礼"
 oe_feu.9.desc:0 "季风更迭之际，满载精工雕琢金银花贡树的礼舟顺流抵达王都。在东南亚曼荼罗格局之中，宗主威仪并非仰仗僵硬疆界，而是凭圣都光辉、厚往薄来与神圣庇护感召四方诸藩。"
 oe_feu.9.a:0 "大开圣都仪仗受纳金银花贡礼"
 oe_feu.9.b:0 "遣王室巡使与高僧出使安抚诸邦"
 oe_feu.10.title:0 "南洋与湄公海道宗主权"
 oe_feu.10.desc:0 "胡椒、丁香、锡锭与瓷器源源流经串连诸朝贡港埠的海峡与河口。沿海藩邦愿出动疾风战船联巡护航，以换取王室大港统一公允的转口税则与清剿海寇之庇护。"
 oe_feu.10.a:0 "编组沿海藩邦战船联巡护航队"
 oe_feu.10.b:0 "厘定南洋香料转口港统一关税"
 oe_feu.11.title:0 "班布克黄金，塔加扎岩盐"
 oe_feu.11.desc:0 "绵延数里的驼队踏出大漠沙海，满载塔加扎岩盐南下换取班布克与布雷的金砂。沿途绿洲异密与沙漠藩邦正静候王室颁授特许状，以保障水井安全、公正商约与骑兵护卫。"
 oe_feu.11.a:0 "派遣大漠轻骑护卫金盐商队"
 oe_feu.11.b:0 "扶持桑科雷与绿洲商法学士网"
 oe_feu.12.title:0 "乌什库伊尼克与波莫尔紫貂边疆"
 oe_feu.12.desc:0 "越过奥涅加湖，顺北德维纳河直抵白海与彼尔姆林海，诺夫哥罗德北方纳贡部众在严冬送来成捆紫貂、银狐与海象牙。市民大会正在激辩：是严定年度毛皮贡册广销汉萨，还是扩充浅底河船队掌控北方拖船驿道？"
 oe_feu.12.a:0 "扩编波莫尔与彼尔姆紫貂贡册"
 oe_feu.12.b:0 "特许乌什库伊尼克北方河道船队"
 oe_feu.13.title:0 "裂土余辉：伊利汗国玉玺之争"
 oe_feu.13.desc:0 "昔日统一的伊利大汗虽已长眠苏丹尼耶，旭烈兀汗国的朱红玉玺在巴格达至呼罗珊之间依然威光未泯。波斯宰相与诸部异密齐聚商议：是重振大汗诏书与文官正统，还是广征突厥蒙古封邑铁骑以武定乾坤？"
 oe_feu.13.a:0 "颁布重光伊利汗国正统敕诏"
 oe_feu.13.b:0 "大征波斯蒙古封邑骑兵团"
 oe_feu.14.title:0 "阿尔卑斯山口同盟誓约"
 oe_feu.14.desc:0 "融雪激流奔涌过圣哥达山口石桥，森林州与城市州代表齐声重申永久同盟誓约。环伺于强邻王朝之间，瑞士联邦必须在高岭险隘铸就铜墙铁壁般的长矛防线，抑或令联邦议会化作贯通南北欧的信义商道枢纽。"
 oe_feu.14.a:0 "筑牢圣哥达山口长矛要塞防线"
 oe_feu.14.b:0 "兴盛联邦议会与跨山商道协约"
 oe_feu.15.title:0 "圣钥旌旗：教皇派城市同盟"
 oe_feu.15.desc:0 "在圣彼得双钥旗帜之下，教皇派自治城市与银团代表齐聚共商抵御帝国干政之策。行会执政官主张广引教廷弗罗林扩充商业信贷，民兵统领则力主重整市政圣车旗帜、厉兵秣马守卫城邦自由。"
 oe_feu.15.a:0 "广引教皇派商团与教廷汇兑金流"
 oe_feu.15.b:0 "环聚市政圣车整编行会市民民兵"
 oe_feu.16.title:0 "帝国双鹰：皇帝派同盟宪章"
 oe_feu.16.desc:0 "在帝国黑鹰旌旗下，皇帝派诸领主与伦巴第城市代表会盟以张帝国法统、抗衡教皇派掣肘。我邦当借帝国代牧特许状巩固君权治理，还是筹集同盟银饷招募精锐雇佣骑兵？"
 oe_feu.16.a:0 "颁行皇帝派帝国代牧治理宪章"
 oe_feu.16.b:0 "重金契约皇帝派精锐雇佣军团"
 oe_feu.17.title:0 "都柏林佩尔议会法典"
 oe_feu.17.desc:0 "自都柏林城堡远至基尔代尔与奥蒙德边区，盎格鲁-诺曼贵族齐聚爱尔兰领地议会共议国是。法务官员拟就整顿税政与藩属法度的佩尔法典，边区守备官则恳请增修壕垒与石砌碉楼以固边防。"
 oe_feu.17.a:0 "颁行都柏林佩尔议会法典"
 oe_feu.17.b:0 "修筑佩尔边壕与石砌碉楼防线"
 oe_feu.18.title:0 "塔拉圣丘：命运之石会盟"
