 oe_levy.1.title: "军区农兵重整"
 oe_levy.1.desc: "各军区将军奉诏展开全面点验，将世代承袭兵户田产的农兵逐户核查、按田亩肥瘠重新编入兵籍名册。披挂锁子甲与鳞甲的军区战士携自备战马与兵刃齐集校场，这套寓兵于农、耕战一体的古老基石正在御前重焕生机。"
 oe_levy.1.a: "耕战一体"
 oe_levy.2.title: "怯薛出征"
 oe_levy.2.desc: "大汗令箭驰传各部，直属斡耳朵的怯薛亲卫与镇守边陲的先锋万户闻令云集校场。战马嘶鸣震天，玄黑与金纹苏鲁锭旌旗遮蔽旷野，弯刀弓矢寒光闪耀，久经草原与中原血战的精锐铁骑已整装待发，静候御驾一纸出征号令。"
 oe_levy.2.a: "万骑待发"
 oe_levy.3.title: "射击军建制"
 oe_levy.3.desc: "朝廷打破旧有贵族征召陈规，正式从各地自由市民与工匠子弟中遴选精壮，组建世代承袭的常备火枪军团。军械库向每位新兵配发火绳枪、火药袋与标志性的长柄月斧，令其平时戍卫城垣、战时列阵齐射，成为护卫沙皇的铁血劲旅。"
 oe_levy.3.a: "编为常备"
 oe_levy.4.title: "哥萨克誓盟"
 oe_levy.4.desc: "纵横大河渡口与荒凉野原的哥萨克自由骑手派出长老与酋长来到朝廷誓盟。这群桀骜不驯、马术精湛的边疆战士愿在战时为君主充当斥候先锋、抵御草原铁骑南侵，唯独坚持朝廷必须承认他们在营寨与边地的自治自由与古老特权。"
 oe_levy.4.a: "许其自由"
 oe_levy.5.title: "点验西帕希"
 oe_levy.5.desc: "战鼓催征之际，领受各地提马尔封邑的西帕希重装骑兵依照户册核定的采邑税额，自带披甲随从、备用战马与弓枪粮草齐集省城校场接受点验。监军书记官逐一核对人马名录与甲械成色，确保每一份皇恩采邑皆化作疆场铁骑。"
 oe_levy.5.a: "照册点验"
 oe_levy.6.title: "红头军誓师"
 oe_levy.6.desc: "头戴标志性十二褶红帽的各部族骑兵从安纳托利亚与伊朗高原蜂拥而至，在教团圣旗与战鼓声中挥舞长矛弯刀、高声立下生死誓言。这些狂热效忠的红头军精骑兼具游牧铁骑的悍勇与宗教热忱，正磨砺刀锋渴望为教主与王国建功立业。"
 oe_levy.6.a: "为教团而战"
 oe_levy.7.title: "贵族总动员"
 oe_levy.7.desc: "国王签发的战时总动员诏书经快马传遍全国各个州郡，号召全体世袭贵族披挂甲胄、跨上战马、率领家臣按期赴指定营地集结。昔日纵横东欧原野的骑士与领主们纷纷擦亮羽翼重甲与长枪，准备以贵族阶层的血脉与荣光捍卫王国疆土。"
 oe_levy.7.a: "人人披甲"
 oe_levy.8.title: "册封曼萨布"
 oe_levy.8.desc: "朝廷正式向各地文武贵胄颁下曼萨布官阶敕书，依据功勋与品级精确核定每人的俸禄标准以及必须常年供养的精锐骑兵定额。获封者须备齐良马、甲胄与随从以备随时调遣，将纷繁复杂的豪族私兵尽数纳入帝国统一严明的军事体系。"
 oe_levy.8.a: "按阶定额"
