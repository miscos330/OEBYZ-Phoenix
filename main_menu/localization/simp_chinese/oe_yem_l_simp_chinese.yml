 oe_yem_dec_treasure_expedition.title: "钦差西洋宝船舰队出海"
 oe_yem_dec_treasure_expedition.desc: "敕命刺桐与广州宝船厂整备大舶，巡航满剌加、古里、忽鲁谟斯与亚丁，宣扬大元天命并开拓海贸，然重舰出征岁费与税效承压甚巨。"
 oe_yem_dec_treasure_expedition.a: "拨帑启碇，巡航西洋"
 oe_yem_dec_jesuit_observatory.title: "大都扩建中西合璧钦天监与神机炮局"
 oe_yem_dec_jesuit_observatory.desc: "于大都旧回回司天台侧扩建中西合璧钦天监，并设大都神机铸炮局研习火器星历，加速科学革命与火炮思潮，惟佛道儒回旧学颇有抵触。"
 oe_yem_dec_jesuit_observatory.a: "敕建新监与神机炮局"
 oe_yem_dec_jiangnan_manufactories.title: "敕设江南织造与煤铁官督工场"
 oe_yem_dec_jiangnan_manufactories.desc: "于杭州与江宁兴建官督民办丝瓷煤铁工场，引入水利机具推动手工工场思潮与城市繁荣，惟征地募工引致乡民些许躁动。"
 oe_yem_dec_jiangnan_manufactories.a: "拨帑开局，兴办江南工场"
 oe_yem_dec_kyakhta_tea_caravan.title: "发遣恰克图茶马皮毛官商队"
 oe_yem_dec_kyakhta_tea_caravan.desc: "恰克图北疆榷场既开，朝廷可定期组织官商携江南茶叶丝绸北赴恰克图易取毛皮白银，增进陆贸、通好北邻并回流宝钞信用。"
 oe_yem_dec_kyakhta_tea_caravan.a: "整装北赴恰克图互市"
 oe_yem.1.t: "敕造大元西洋宝船"
 oe_yem.1.desc_ready: "#F 元世祖忽必烈以来，大元水师与刺桐、广州蕃舶便纵横南洋与印度洋。历十四世纪平乱中兴之后，大都既稳中原海口，昔年西洋通海之志遂在大发现时代重燃。#!\n\n晋江刺桐与广州市舶船厂早已备齐巨木与水手，昔日市舶重兴积累的远洋海图亦陈于御案。中书省请示：是斥巨资敕造官办西洋宝船舰队宣威四海，还是官督商办联结蕃汉船帮，抑或罢止远洋专力护漕？"
 oe_yem.1.desc_ban: "#F 元世祖忽必烈以来，大元水师与刺桐、广州蕃舶便纵横南洋与印度洋。历十四世纪平乱中兴之后，大都既稳中原海口，昔年西洋通海之志遂在大发现时代重燃。#!\n\n虽则先朝曾行严苛海禁，然如今晋江、广州与香山外洋风帆云集，欧亚海路巨利近在咫尺。若欲重启西洋宝船大役，须先颁开海复舶诏并付出更高的财政与稳政代价。大汗意下如何？"
 oe_yem.1.desc_gen: "#F 元世祖忽必烈以来，大元水师与刺桐、广州蕃舶便纵横南洋与印度洋。历十四世纪平乱中兴之后，大都既稳中原海口，昔年西洋通海之志遂在大发现时代重燃。#!\n\n晋江刺桐、广州与香山海口百货辐辏，南洋与印度洋航道正向大元敞开。朝廷面临三条海权大策：官办巨型宝船宣威西洋、官督商办远洋船帮、抑或专力近海护漕以省国用。"
 oe_yem.1.a: "敕造官办七下西洋宝船舰队，宣威南洋与印度洋"
 oe_yem.1.a.tt: "解锁西洋宝船远航决议；获得[ShowModifier('oe_yem_treasure_fleet_mod')]（#Y 180#!个月：天命、探索与外交大增，重舰维护费#R +25%#!且税收效率#R −6%#!）；晋江与广州获大港修正；若宝钞信用不足#Y 40#!将触发筹饷透支。"
 oe_yem.1.b: "官督商办市舶远洋船帮，联结刺桐与广州蕃商"
 oe_yem.1.b.tt: "解锁西洋宝船远航决议；获得[ShowModifier('oe_yem_merchant_syndicate_mod')]（#Y 180#!个月：海贸收入#G +12%#!与商力#G +15%#!，月控制度下降且贵族满意#R −8%#!）。"
 oe_yem.1.c: "罢止远洋大舶，专力近海护漕与中原田赋"
 oe_yem.1.c.tt: "获得[ShowModifier('oe_yem_coastal_guard_mod')]（#Y 180#!个月：税收与稳定成本改善，海贸效率#R −8%#!且殖民航程#R −15%#!）；不解锁宝船远航决议。"
 oe_yem.2.t: "刺桐至忽鲁谟斯：西洋诸国朝贡"
 oe_yem.2.desc_srk: "#F 自晋江刺桐扬帆南下，经满剌加海峡抵印度古里，再西航波斯湾忽鲁谟斯与红海口亚丁，正是蒙元以来贯通东西两洋的黄金航路。#!\n\n捷报自西洋驰返大都：大元宝船抵亚丁与红海口时，竟与来自亚历山大与君士坦丁堡的紫衣罗马商舶重逢！双凤海道自此相接，西洋诸邦使节亦纷随宝船北上刺桐与琼州朝贡。"
 oe_yem.2.desc_gen: "#F 自晋江刺桐扬帆南下，经满剌加海峡抵印度古里，再西航波斯湾忽鲁谟斯与红海口亚丁，正是蒙元以来贯通东西两洋的黄金航路。#!\n\n大元远洋船队已贯通满剌加、古里与忽鲁谟斯航道，西洋诸番遣使携香料宝石抵晋江与广州请通朝贡。朝廷是厚赏诸番、广设宣慰商馆，还是严定市舶抽分以贸养舰？"
 oe_yem.2.a: "厚赏诸番使节，于满剌加至亚丁广布大元宣慰商网"
 oe_yem.2.a.tt: "获得[ShowModifier('oe_yem_indian_ocean_hegemony')]（#Y 144#!个月：海贸、外交与威望大增，重舰维护费#R +25%#!且税效#R −4%#!）；琼州获大港修正；若新罗马存续则双方好感#G +30#!。"
 oe_yem.2.b: "严定西洋勘合市舶抽分，务求以贸养舰"
 oe_yem.2.b.tt: "获得[ShowModifier('oe_yem_customs_balance_mod')]（#Y 144#!个月：贸易收入#G +8%#!与海上存在提升，月威望与贵族满意略降）。"
 oe_yem.3.t: "吕宋帆船与白银洪流"
 oe_yem.3.desc_x: "#F 十六世纪下半叶，美洲波托西银矿与日本石见白银经吕宋马尼拉帆船与漳州龙溪月港源源涌入中原，全球贸易浪潮正猛烈冲击大元延续二百余年的纸钞体制。#!\n\n如今，东南市井商旅争相以番银计价，旧交钞兑价起伏不定。户部与中书省激烈争辩：是以实银为储备创设近代式「大都银库准备宝钞」，还是顺势改行「一条鞭法」银本位折色征税，抑或严禁番银固守旧钞？"
 oe_yem.3.a: "创设「大都银库准备宝钞」，以实银背书交钞兑付"
 oe_yem.3.a.tt: "获得[ShowModifier('oe_yem_silver_reserve_chao')]（#Y 180#!个月：商贸#G +10%#!、商力提升且通胀受抑，内阁效率#R −6%#!且税效#R −3%#!）；宝钞信用#G +15#!；推动大都与晋江全球贸易思潮（信用或稳定不足时仍潜藏挤兑风险）。"
 oe_yem.3.b: "推行「一条鞭法」，将赋役折银纳入银本位税制"
 oe_yem.3.b.tt: "获得[ShowModifier('oe_yem_single_whip_mod')]（#Y 180#!个月：税收效率#G +10%#!与月控制度大增，转型期繁荣略降且贵族满意#R −10%#!）；逐步退出高利印钞依赖（宝钞信用#R −15#!）。"
 oe_yem.3.c: "严禁民间私用番银，固守至元旧钞成法"
 oe_yem.3.c.tt: "获得[ShowModifier('oe_yem_old_chao_stubborn')]（#Y 120#!个月：守旧稳定与教士满意略升，通胀加剧、贸易#R −8%#!且思潮滞缓）；大幅推高宝钞挤兑风险。"
 oe_yem.4.t: "宝钞挤兑风潮与银荒大考"
 oe_yem.4.desc_run: "#F 近代信用货币与跨境白银流向向来休戚与共：一旦军费吃紧、信用动摇或吕宋海运骤减，大都银库与江南钱庄便将直面惨烈的兑付大考。#!\n\n危机爆发！因宝钞信用不足或市井谣传银库空虚，大都与杭州钱庄门前挤满持钞挤兑的豪商与百姓，交钞市价一日三跌。朝廷是立即倾尽国库实银足额兑付并铁腕核库，还是被迫限兑折偿、承受钞法重创？"
 oe_yem.4.desc_shock: "#F 近代信用货币与跨境白银流向向来休戚与共：一旦军费吃紧、信用动摇或吕宋海运骤减，大都银库与江南钱庄便将直面惨烈的兑付大考。#!\n\n吕宋与东海白银航船因海盗与欧陆战事骤然减半，江南与北方乡县顿现银荒，商民兑现吃紧、市面通缩抬头。朝廷须决断是拨款平准银价稳住商市，还是任由限兑折偿自渡寒冬？"
 oe_yem.4.a: "倾国库实银足额兑付，严查贪渎并重申准备金律"
 oe_yem.4.a.tt: "平息挤兑！获得[ShowModifier('oe_yem_chao_vindicated_mod')]（#Y 120#!个月：贸易#G +6%#!与通胀受抑，内阁效率#R −5%#!）；宝钞信用恢复#G +12#!。"
 oe_yem.4.b: "下诏限兑折偿、发债拖延以保国库现金"
 oe_yem.4.b.tt: "触发真实钞法降级态[ShowModifier('oe_yem_chao_run_scar')]（#Y 120#!个月：通胀加剧、贸易#R −10%#!、税效#R −5%#!且市民满意#R −12%#!）；移除银库准备宝钞并损失宝钞信用#R −20#!。"
 oe_yem.5.t: "香山泊船：泰西海商与佛郎机大铳"
 oe_yem.5.desc_x: "#F 自欧洲航海家绕过好望角东来，佛郎机与红毛番大船陆续泊于广东香山澳与闽海刺桐外洋，携白银、呢绒与新型后膛佛郎机大铳叩关求市。#!\n\n两广与福建行省急奏大都：泰西商舶与传教士皆集于香山港外，愿纳重税以换泊船互市之权，并献红夷火炮图样。朝廷将准辟香山特许商埠、仅采火器严限泊船，还是严闭海口斥逐番舶？"
 oe_yem.5.a: "准辟香山特许商埠，兼通刺桐互市并广采火炮海图"
 oe_yem.5.a.tt: "获得[ShowModifier('oe_yem_western_ports_mod')]（#Y 144#!个月：贸易#G +8%#!与思潮传播提升，教士满意#R −8%#!且传教变慢）；香山获[ShowModifier('oe_yem_xiangshan_charter')]（高商力与思潮，控驭上限#R −15%#!）；加速火炮思潮并改善西欧海权好感。"
 oe_yem.5.b: "严限番舶止于外港，惟准官府采买仿造佛郎机火炮"
 oe_yem.5.b.tt: "获得[ShowModifier('oe_yem_selective_arsenal_mod')]（#Y 144#!个月：陆军纪律#G +2.5%#!与城防提升，贸易#R −4%#!且外交声望略降）；推动广州火炮思潮。"
 oe_yem.5.c: "严闭海口、斥逐番舶，独守大统不与泰西通商"
 oe_yem.5.c.tt: "获得[ShowModifier('oe_yem_closed_ports_mod')]（#Y 144#!个月：正教容忍、稳定与天命提升，科研#R −8%#!且思潮传播#R −15%#!）；西欧海权恶感加深。"
 oe_yem.6.t: "钦天监大辩论"
 oe_yem.6.desc_srk: "#F 元代大都本就有郭守敬授时历与札马鲁丁回回司天台兼收并蓄的传统。及至绝对主义与科学革命时代，泰西天算师经香山与丝路入京，携望远镜、几何原本与西洋铸炮术叩问钦天监。#!\n\n更有来自君士坦丁堡与丝路旧网的希腊与拉丁学者助阵，大都学界围绕改历与新式炮兵展开大辩论。若将西洋铸炮与本朝旧制合流，便可于大都敕建近代化神机铸炮总局；然佛道儒回守旧大臣皆力谏不可轻变祖宗历法！"
 oe_yem.6.desc_gen: "#F 元代大都本就有郭守敬授时历与札马鲁丁回回司天台兼收并蓄的传统。及至绝对主义与科学革命时代，泰西天算师经香山与丝路入京，携望远镜、几何原本与西洋铸炮术叩问钦天监。#!\n\n钦天监内争辩白热化：泰西天算师当庭测验日食分秒不差，并请为大元铸造红夷重炮、扩建大都神机铸炮总局；然守旧大臣痛斥西学动摇礼法教化。大汗将如何裁断西学东渐之局？"
 oe_yem.6.a: "延聘泰西天算师入钦天监，敕建大都神机铸炮总局"
 oe_yem.6.a.tt: "确立神机炮局旗标（供后续军事演进衔接）；获得[ShowModifier('oe_yem_jesuit_observatory_mod')]（#Y 180#!个月：科研#G +10%#!、纪律#G +3%#!与识字提升，教士满意#R −10%#!、传教变慢且陆军维护变贵）；大都获钦天监修正并大幅推进科学革命与火炮思潮。"
 oe_yem.6.b: "仅采星历与铸炮器术建神机局，严禁传教与内地行商"
 oe_yem.6.b.tt: "确立神机炮局旗标；获得[ShowModifier('oe_yem_practical_learning_mod')]（#Y 180#!个月：科研#G +5%#!与纪律#G +3%#!，贸易#R −4%#!且外交声望略降）；推进大都火炮与科学革命思潮。"
 oe_yem.6.c: "斥退泰西番僧，独尊授时历与回回司天旧学"
 oe_yem.6.c.tt: "获得[ShowModifier('oe_yem_orthodox_astronomy_mod')]（#Y 180#!个月：正教容忍、稳定与天命提升，科研#R −10%#!且思潮传播#R −15%#!）；不设立神机炮局。"
 oe_yem.7.t: "小冰期大寒潮"
 oe_yem.7.desc_canal: "#F 十七世纪中叶，小冰期严寒席卷北半球：大运河冰封、辽东霜灾、漠北白灾暴雪接踵而至，史实中正是这场大寒潮与财政崩溃摧毁了东亚旧秩序。#!\n\n如今严寒肆虐，幸赖本朝大运河漕运与海运旧基尚固，江南余粮尚可星夜北调大都、辽东与漠北。户部奏称开仓赈济虽耗国库巨款，却可保天命民心；亦有强臣主议加征辽饷与马税以充军备。"
 oe_yem.7.desc_gen: "#F 十七世纪中叶，小冰期严寒席卷北半球：大运河冰封、辽东霜灾、漠北白灾暴雪接踵而至，史实中正是这场大寒潮与财政崩溃摧毁了东亚旧秩序。#!\n\n大寒潮突袭中原与漠北，辽阳与京畿冻馁频传、草场牲畜冻毙过半。中书省急请大汗裁决：是破格拨帑疏浚运河漕运、开常平仓赈济辽东漠北，还是加征辽饷与草原马税以先保财政军库？"
 oe_yem.7.a: "疏浚大运河漕运、开常平仓急赈辽东与漠北"
 oe_yem.7.a.tt: "获得[ShowModifier('oe_yem_lia_relief_mod')]（#Y 120#!个月：天命、农民满意与稳定效率提升，税收效率#R −8%#!且内阁效率#R −5%#!）；若有海运漕粮体系则粮储#G +15#!。"
 oe_yem.7.b: "加征辽饷与草原马税，优先保军费与国库充盈"
 oe_yem.7.b.tt: "立刻获得#G +2#!个月收入应急，但陷入真实灾荒危机[ShowModifier('oe_yem_lia_crisis_mod')]（#Y 120#!个月：繁荣暴跌、农民满意#R −15%#!、藩属忠诚#R −12#!且天命流失）；大都与辽阳留灾荒减益。"
 oe_yem.8.t: "漠北新宪与恰克图北疆划界通商"
 oe_yem.8.desc_rus: "#F 历经三百余年统治，中兴大元仍须回答帝国最深层的体制命题：如何将漠北草原宗王领地与中原行省熔铸为近代统一国家，并直面自西伯利亚东抵贝加尔湖与恰克图的北方新邻。#!\n\n急报自贝加尔湖南岸传来：昔年钦察汗国旧属罗斯人已越过西伯利亚抵达伊尔库茨克与恰克图外缘，遣使请与大元大汗平礼划界、开设茶马皮毛陆路互市！大都须同步定下草原宪制与恰克图边约。"
 oe_yem.8.desc_gen: "#F 历经三百余年统治，中兴大元仍须回答帝国最深层的体制命题：如何将漠北草原宗王领地与中原行省熔铸为近代统一国家，并直面自西伯利亚东抵贝加尔湖与恰克图的北方新邻。#!\n\n小冰期渐歇，漠北诸部宗王与中原行省督抚齐聚大都共议新宪，恰克图北道商旅亦日渐繁密。朝廷是改藩入省、统一理藩院并开恰克图互市，还是颁行蒙汉共治大宪章，抑或严闭漠北卡伦？"
 oe_yem.8.a: "改藩入省、统一理藩院，并立恰克图陆路划界通商约"
 oe_yem.8.a.tt: "开放恰克图互市接口与茶马官商决议；获得[ShowModifier('oe_yem_lifanyuan_central_mod')]（#Y 180#!个月：月控制度、税效与陆贸大涨，藩属忠诚#R −15#!且贵族满意#R −8%#!）；恰克图设榷场，与俄罗斯好感#G +35#!。"
 oe_yem.8.b: "颁行「蒙汉共治大宪章」，保留盟旗并设恰克图茶马互市"
 oe_yem.8.b.tt: "开放恰克图互市接口与茶马官商决议；获得[ShowModifier('oe_yem_plural_charter_mod')]（#Y 180#!个月：藩属忠诚#G +15#!、人力#G +10%#!与陆贸提升，内阁效率#R −6%#!且月控制略降）；与俄罗斯好感#G +35#!。"
 oe_yem.8.c: "严闭漠北卡伦哨所，拒开北疆互市而专务守边"
 oe_yem.8.c.tt: "获得[ShowModifier('oe_yem_northern_karun_mod')]（#Y 180#!个月：城防#G +10%#!与稳定提升，陆贸#R −10%#!且外交略降）；不开放恰克图互市，与俄罗斯好感#R −25#!。"
 oe_yem.9.t: "江南机坊与大都火器工场"
 oe_yem.9.desc_x: "#F 十七世纪末至十八世纪初，手工工场浪潮席卷欧亚。在杭州、江宁、上海的丝绸棉布机坊与大都煤铁铸炮局中，雇工分工与水利机械已显露出早期工业化的曙光。#!\n\n江南富商与工部官匠联名上书大都，请准扩大官督民办煤铁、丝瓷工场与大都火器总局，以迎手工工场思潮；然守旧官僚则主张由官营织造与军器局专卖统辖，严防豪商失控。"
 oe_yem.9.a: "推行官督民办江南煤铁丝瓷工场，扩建大都火器总局"
 oe_yem.9.a.tt: "确立神机炮局旗标；获得[ShowModifier('oe_yem_jiangnan_manufactory_mod')]（#Y 180#!个月：税收#G +8%#!、发展度与思潮传播大增，农民满意#R −8%#!且通胀略升）；杭州、江宁、上海获工场修正并大幅推进手工工场思潮。"
 oe_yem.9.b: "坚持官营织造与军器专卖，严控江南行会雇工"
 oe_yem.9.b.tt: "获得[ShowModifier('oe_yem_state_monopoly_mod')]（#Y 180#!个月：月控制度与陆军纪律提升，市民满意#R −10%#!且思潮传播#R −8%#!）。"
 oe_yem.10.t: "四海永宁：大元近世中兴定局"
 oe_yem.10.desc_x: "#F 自一四五零年西洋宝船启碇，历经美洲白银洪流、香山互市、钦天监西学辩论、小冰期大寒潮与恰克图北疆划界，中兴大元已跨越三百年近世风云而巍然屹立于欧亚东方。#!\n\n如今乾坤既定、四海永宁，中书省恭请大汗为即将步入革命与工业时代的大元确立终局国策：是以开放海陆实学铸就「大元近世海陆新纪」，还是以固本安边成就「守成天朝万里藩篱」？"
 oe_yem.10.a: "昭告「大元近世海陆新纪」，兼收西洋海贸、实学与工场"
 oe_yem.10.a.tt: "获得常驻修正[ShowModifier('oe_yem_modern_yuan_mod')]（元亡前有效：贸易#G +10%#!、科研#G +8%#!、思潮#G +10%#!与天命齐涨，代价为内阁效率#R −5%#!、教士满意#R −6%#!与重舰维护#R +15%#!）。本线完结。"
 oe_yem.10.b: "立「守成天朝万里藩篱」，固守中原控驭与边疆安定"
 oe_yem.10.b.tt: "获得常驻修正[ShowModifier('oe_yem_celestial_bastion_mod')]（元亡前有效：控制度、城防、稳定与天命大增，科研#R −6%#!且海贸#R −8%#!）。本线完结。"
 oe_yem.20.t: "大元近世线：选项生效"
 oe_yem.90.t: "中兴大元近世国运总览"
