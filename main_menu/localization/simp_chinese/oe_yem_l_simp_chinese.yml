 oe_yem_b_aden_reunion: "亚丁双凤重逢"
 oe_yem_b_west_trade: "香山互市通商"
 oe_yem_b_west_closed: "严闭海口斥番"
 oe_yem_b_kyakhta_accord: "恰克图划界互市约"
 oe_yem_b_kyakhta_tension: "漠北闭市卡伦对峙"
 STATIC_MODIFIER_NAME_oe_yem_treasure_fleet_mod: "大元西洋宝船舰队"
 STATIC_MODIFIER_DESC_oe_yem_treasure_fleet_mod: "大元敕造巨型宝船巡航南洋与印度洋，天命威仪与远洋探索大振，然重舰岁费高昂且厚往薄来拖累国库税效。"
 STATIC_MODIFIER_NAME_oe_yem_fleet_strain_mod: "宝船筹饷透支"
 STATIC_MODIFIER_DESC_oe_yem_fleet_strain_mod: "宝钞信用未稳之际强兴西洋大役，造船采买推升通胀并加大朝廷稳政负担。"
 STATIC_MODIFIER_NAME_oe_yem_merchant_syndicate_mod: "官督商办远洋船帮"
 STATIC_MODIFIER_DESC_oe_yem_merchant_syndicate_mod: "刺桐与广州蕃汉大商领勘合下西洋，海贸税入与商力暴涨，然海疆豪商坐大、中枢控驭与宗室贵族俱感失衡。"
 STATIC_MODIFIER_NAME_oe_yem_coastal_guard_mod: "近海护漕守成"
 STATIC_MODIFIER_DESC_oe_yem_coastal_guard_mod: "朝廷罢止远洋大舶而专力护漕征赋，内治稳固、田赋效率略增，然远洋航程与海贸活力明显收缩。"
 STATIC_MODIFIER_NAME_oe_yem_indian_ocean_hegemony: "西洋诸番宣慰网"
 STATIC_MODIFIER_DESC_oe_yem_indian_ocean_hegemony: "满剌加、古里、忽鲁谟斯与亚丁商舶云集大元海道，威望与海贸俱盛，然远洋护航重舰与赏赐费用沉重。"
 STATIC_MODIFIER_NAME_oe_yem_customs_balance_mod: "西洋勘合以贸养舰"
 STATIC_MODIFIER_DESC_oe_yem_customs_balance_mod: "以市舶抽分平衡远洋船费，海贸与海上存在稳步增长，然减省赏赐令朝贡威仪与勋贵颇有微词。"
 STATIC_MODIFIER_NAME_oe_yem_voyage_active_mod: "钦差西洋宝船出海"
 STATIC_MODIFIER_DESC_oe_yem_voyage_active_mod: "新一批钦差宝船自刺桐与广州启碇远航西洋，天命与海贸声势大振，然重舰出征军费与税效承压。"
 STATIC_MODIFIER_NAME_oe_yem_silver_reserve_chao: "大都银库准备宝钞"
 STATIC_MODIFIER_DESC_oe_yem_silver_reserve_chao: "以美洲与东亚涌入之实银作准备金背书交钞，商贸畅达且通胀受抑，然严核银库与稽查伪钞耗费大量内阁行政精力。"
 STATIC_MODIFIER_NAME_oe_yem_single_whip_mod: "大元一条鞭银法"
 STATIC_MODIFIER_DESC_oe_yem_single_whip_mod: "赋役折银合并征收，财政税效与地方控制显著跃升，然豪强世家失利且农商在银贵谷贱中承受转型阵痛。"
 STATIC_MODIFIER_NAME_oe_yem_old_chao_stubborn: "旧交钞禁银成法"
 STATIC_MODIFIER_DESC_oe_yem_old_chao_stubborn: "强令民间禁使番银、独行旧制交钞，守旧派称善而黑市横行、通胀抬头并滞缓全球贸易思潮传入。"
 STATIC_MODIFIER_NAME_oe_yem_chao_vindicated_mod: "银库足额兑付定心"
 STATIC_MODIFIER_DESC_oe_yem_chao_vindicated_mod: "朝廷开库足额兑银平息挤兑风潮，商界信心回稳、通胀受控，然严苛核账仍牵制内阁效率。"
 STATIC_MODIFIER_NAME_oe_yem_chao_run_scar: "宝钞挤兑折偿余创"
 STATIC_MODIFIER_DESC_oe_yem_chao_run_scar: "钞库限兑折偿令商民信心大溃，物价飞涨、商税锐减且市民阶层怨声载道。"
 STATIC_MODIFIER_NAME_oe_yem_western_ports_mod: "香山刺桐泰西互市"
 STATIC_MODIFIER_DESC_oe_yem_western_ports_mod: "准许欧陆商舶于香山与刺桐通商，海贸与思潮传播提速，然外来教士与番商冲击引起教界反弹与同化趋缓。"
 STATIC_MODIFIER_NAME_oe_yem_selective_arsenal_mod: "官采佛郎机火器制"
 STATIC_MODIFIER_DESC_oe_yem_selective_arsenal_mod: "严限番商外港泊船而专由官府采买铸造佛郎机大炮，陆军纪律与城防上升，然商贸受限且西欧外交疏冷。"
 STATIC_MODIFIER_NAME_oe_yem_closed_ports_mod: "严闭海口防番令"
 STATIC_MODIFIER_DESC_oe_yem_closed_ports_mod: "斥逐泰西商舶、恪守旧制，正教容忍、稳定与天命受保守派拥护，然科研与新思潮传入严重滞后。"
 STATIC_MODIFIER_NAME_oe_yem_jesuit_observatory_mod: "中西合璧钦天监与神机炮局"
 STATIC_MODIFIER_DESC_oe_yem_jesuit_observatory_mod: "大都钦天监合参泰西天算与回回授时历法，并设神机铸炮总局，科研、识字与军纪大进，然佛道儒回旧学反弹且养军成本提高。"
 STATIC_MODIFIER_NAME_oe_yem_practical_learning_mod: "师器守统：实学铸炮局"
 STATIC_MODIFIER_DESC_oe_yem_practical_learning_mod: "专取泰西星历与铸炮之术而严禁内地传教，科研与军队纪律稳升，然对外商贸与交涉趋于封闭。"
 STATIC_MODIFIER_NAME_oe_yem_orthodox_astronomy_mod: "独尊授时回回旧学"
 STATIC_MODIFIER_DESC_oe_yem_orthodox_astronomy_mod: "罢斥泰西天算师而独尊元代授时与回回历法传统，教界与礼法安稳，然帝国与科学革命渐行渐远。"
 STATIC_MODIFIER_NAME_oe_yem_lia_relief_mod: "小冰期漕运平粜赈灾"
 STATIC_MODIFIER_DESC_oe_yem_lia_relief_mod: "动用漕粮常平仓驰援辽东与漠北灾区，保住天命民心与稳定，然免赋赈济令税收与内阁财政吃紧。"
 STATIC_MODIFIER_NAME_oe_yem_lia_crisis_mod: "寒潮辽饷与流民危机"
 STATIC_MODIFIER_DESC_oe_yem_lia_crisis_mod: "大寒潮中加征辽饷与草原马税虽暂补军库，却令民生凋敝、百姓怨沸、藩属离心且天命受损。"
 STATIC_MODIFIER_NAME_oe_yem_lifanyuan_central_mod: "理藩改省与恰克图陆贸"
 STATIC_MODIFIER_DESC_oe_yem_lifanyuan_central_mod: "改草原宗王旧藩为统一理藩院辖治，并与北邻在恰克图划界互市，控制力、税效与陆贸俱进，然旧藩与贵族大为不满。"
 STATIC_MODIFIER_NAME_oe_yem_plural_charter_mod: "蒙汉共治宪章与茶马互市"
 STATIC_MODIFIER_DESC_oe_yem_plural_charter_mod: "确立草原盟旗与中原行省并治大宪章，并于恰克图开茶马皮毛互市，藩属效忠、兵源与陆贸齐涨，然中枢行政与直接控驭有所折损。"
 STATIC_MODIFIER_NAME_oe_yem_northern_karun_mod: "漠北卡伦严防闭市"
 STATIC_MODIFIER_DESC_oe_yem_northern_karun_mod: "沿漠北增设卡伦哨所拒开恰克图互市，边防与安定稳固，然欧亚北路陆贸与外交受抑。"
 STATIC_MODIFIER_NAME_oe_yem_kyakhta_trade_mod: "恰克图茶马皮毛官商"
 STATIC_MODIFIER_DESC_oe_yem_kyakhta_trade_mod: "定期发遣官商携茶丝北赴恰克图易取毛皮与白银，陆贸与邦交畅旺，然边疆互市繁密略损直接控驭。"
 STATIC_MODIFIER_NAME_oe_yem_jiangnan_manufactory_mod: "江南官督民办工场"
 STATIC_MODIFIER_DESC_oe_yem_jiangnan_manufactory_mod: "杭州、江宁、上海丝瓷煤铁工场与大都火器总局齐兴，税效、发展度与工场思潮大涨，然兼并农田与资本膨胀带来通胀与农夫不满。"
 STATIC_MODIFIER_NAME_oe_yem_state_monopoly_mod: "官营织造与军器专卖"
 STATIC_MODIFIER_DESC_oe_yem_state_monopoly_mod: "朝廷严控江南织造局与大都军器专卖，地方控制力与军队纪律上升，然行会市民受压且民间思潮演进趋缓。"
 STATIC_MODIFIER_NAME_oe_yem_modern_yuan_mod: "大元近世海陆新纪"
 STATIC_MODIFIER_DESC_oe_yem_modern_yuan_mod: "中兴大元融汇西洋海权、准备金钞法、钦天监实学与江南工场，跻身近世欧亚头等强权，惟庞大官僚、旧学张力与远洋舰队仍需持续供养。"
 STATIC_MODIFIER_NAME_oe_yem_celestial_bastion_mod: "守成天朝万里藩篱"
 STATIC_MODIFIER_DESC_oe_yem_celestial_bastion_mod: "大元以稳固天命、万里边防与中原控驭为根本，帝国安如磐石，然对外海贸与新学革新步履较为审慎。"
 STATIC_MODIFIER_NAME_oe_yem_maritime_entrepot: "大元西洋宝船大港"
 STATIC_MODIFIER_DESC_oe_yem_maritime_entrepot: "宝船厂与远洋市舶云集此港，商力与海上存在大增，然流民蕃商杂处令地方躁动略升。"
 STATIC_MODIFIER_NAME_oe_yem_xiangshan_charter: "香山泰西特许商埠"
 STATIC_MODIFIER_DESC_oe_yem_xiangshan_charter: "朝廷准许欧陆商舶于香山停泊互市，商力与新思潮传播飞速增长，然口岸高自治削弱直接控驭并引发摩檫。"
 STATIC_MODIFIER_NAME_oe_yem_dadu_observatory_loc: "大都钦天监与神机炮局"
 STATIC_MODIFIER_DESC_oe_yem_dadu_observatory_loc: "中西合璧钦天监与神机铸炮局落成于大都，京师思潮与城市发展加速，然新旧学派对峙带来轻微骚动。"
 STATIC_MODIFIER_NAME_oe_yem_lia_famine_loc: "小冰期严寒灾荒"
 STATIC_MODIFIER_DESC_oe_yem_lia_famine_loc: "连年严冬与加派辽饷重创地方民生，繁荣下跌且骚动频生。"
 STATIC_MODIFIER_NAME_oe_yem_kyakhta_mart: "恰克图蒙俄互市榷场"
 STATIC_MODIFIER_DESC_oe_yem_kyakhta_mart: "恰克图成为大元与沙俄茶丝皮毛陆路贸易总汇，商力与枢纽权重跃升，然胡汉罗刹杂处略有边务摩擦。"
 STATIC_MODIFIER_NAME_oe_yem_proto_industry_loc: "江南煤铁丝瓷工场"
 STATIC_MODIFIER_DESC_oe_yem_proto_industry_loc: "官督民办织造、瓷窑与煤铁工场林立，城市发展度与商力齐升，然雇工聚集带来轻微治安压力。"
 OE_YEM_FLEET_1: "官办西洋宝船"
 OE_YEM_FLEET_2: "官督远洋船帮"
