l_simp_chinese:
 oe_ivr_interregnum: "奥斯曼空位期"
 oe_ivr_interregnum_desc: "奥斯曼王族各据一方，争夺苏丹之位。帝国可以押其中一位：押中的人登上王座，帝国就能收回失去的城市；押错了，新苏丹会来清算。\n\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n[GetCountry('BYZ').Custom('OeBetSt3')]\n帝国：[GetCountry('BYZ').Custom('OeBetBack')]，押注深度#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_stake').GetValue|0]#! / #Y 3#!　已过#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月\n\n每月，各位王子的势随战局起落；据有王座的一位#Y +1#!；帝国所押的一位 +（#Y 1#! + 押注深度）。势达到#Y 90#!、只剩一位王子，或满#Y 12#!年时决出胜负。"
 STATIC_MODIFIER_NAME_oe_ivr_straits_pact: "海峡之约"
 oe_ivr_treaty_op: "加里波利条约的伙伴"
 oe_ivr_obedient_son: "顺从的儿子"
 oe_ivr_spurned: "押错了人"
 oe_ivr.1.t: "安卡拉的消息"
 oe_ivr.1.desc_nobet: "#F 史实上，1402年7月，帖木儿在安卡拉击溃奥斯曼大军，苏丹巴耶济德被俘，几个儿子随即各据一方，奥斯曼人陷入十一年的内战。#!\n\n如今，奥斯曼人的王座出了变故，可奥斯曼王族里没有第二位成年王子能与之争位。帝国只能远远看着。"
 oe_ivr.1.desc_captured: "#F 史实上，1402年7月，帖木儿在安卡拉击溃奥斯曼大军，苏丹巴耶济德被俘，几个儿子随即各据一方，奥斯曼人陷入十一年的内战。#!\n\n如今，苏丹 [GetCountry('BYZ').MakeScope.GetVariable('oe_ivr_sultan').GetCharacter.GetName] 落入敌手，诸王子各据一方：\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]据有王座；\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]与[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]争位。\n帝国可以押一位王子，用金钱、船只和士兵换回失去的城市；也可以袖手旁观，等胜负分明再说。"
 oe_ivr.1.desc_war: "#F 史实上，1402年7月，帖木儿在安卡拉击溃奥斯曼大军，苏丹巴耶济德被俘，几个儿子随即各据一方，奥斯曼人陷入十一年的内战。#!\n\n如今，奥斯曼人陷入了内战，王族中人各拥兵马：\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]据有王座；\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]与[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]争位。\n帝国可以押一位王子，用金钱、船只和士兵换回失去的城市；也可以袖手旁观，等胜负分明再说。"
 oe_ivr.1.a: "准备介入"
 oe_ivr.1.a.tt: "局势#bold #color_yellow 奥斯曼空位期#!#!开始：帝国可以押一位王子；押中的人坐稳苏丹之位，就会把城市还给帝国\n约#Y 2#!个月后，据有王座的王子会派来使节"
 oe_ivr.1.b: "先看看再说"
 oe_ivr.1.b.tt: "局势#bold #color_yellow 奥斯曼空位期#!#!开始，帝国暂不表态\n约#Y 5#!个月后，据有王座的王子仍会派来使节"
 oe_ivr.1.c: "静观其变"
 oe_ivr.1.c.tt: "奥斯曼王族里没有能与之争位的人，这场变故与帝国无关"
 oe_ivr.2.t: "鲁米利亚王子的条件"
 oe_ivr.2.desc: "#F 史实上，1403年初，据有埃迪尔内的苏莱曼与帝国签下加里波利条约：归还塞萨洛尼基和沿海诸城，免除帝国的贡赋。#!\n\n如今，据有王座的 [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName] 派来使节，开出同样的条件：只要帝国站在其一边，塞萨洛尼基与哈尔基季基，以及从锡林布里亚到黑海岸边的诸城，凡在奥斯曼人手里的，都还给帝国；帝国从此不必再向苏丹纳贡。"
 oe_ivr.2.a: "接受条件"
 oe_ivr.2.a.tt: "押 [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]，签订加里波利条约"
 oe_ivr.2.b: "再要一座港口"
 oe_ivr.2.b.tt: "#G 40%#!的可能对方连瓦尔纳一起让出：押此人并签约\n#R 60%#!的可能使节拂袖而去，不签约，此人的势#Y −5#!"
 oe_ivr.2.c: "拒绝，继续观望"
 oe_ivr.2.c.tt: "暂不押任何人"
 oe_ivr.3.t: "加里波利条约"
 oe_ivr.3.desc: "#F 史实上，条约由在京城摄政的皇子签署，皇帝回到京城后亲自确认。奥斯曼的船只未经皇帝许可不得驶出达达尼尔海峡，苏丹的几个年幼的弟妹被送到君士坦丁堡作人质。#!\n\n如今，条约已经拟好，只等帝国的使节签字。"
 oe_ivr.3.a: "签约"
 oe_ivr.3.a.tt: "奥斯曼人手里的下列地方归还帝国：塞萨洛尼基与哈尔基季基#Y 5#!处；锡林布里亚、乔尔卢、雷德斯托、梅迪亚、阿加索波利斯、索佐波尔、安基阿洛斯、布尔加斯；若对方答应了，还有瓦尔纳\n#G 不再向苏丹纳贡#!：取消对奥斯曼的岁币协议\n与奥斯曼停战#Y 10#!年\n奥斯曼获得 [ShowModifier('oe_ivr_straits_pact')]，持续#Y 10#!年\n威尼斯和热那亚对帝国好感#G +10#!\n被俘苏丹的一名幼子作为人质来到君士坦丁堡（如果有）"
 oe_ivr.4.t: "布尔萨与阿马西亚"
 oe_ivr.4.desc: "#F 史实上，安卡拉之后，伊萨据布尔萨，穆罕默德据阿马西亚，兄弟在安纳托利亚兵戎相见。#!\n\n如今，王子们在安纳托利亚争夺城市与人心，形势又变了。现在是第#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!个月：\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n[GetCountry('BYZ').Custom('OeBetSt3')]\n帝国：[GetCountry('BYZ').Custom('OeBetBack')]。"
 oe_ivr.4.a: "资助我们押的王子"
 oe_ivr.4.a.tt: "花费#R 2#!个月的贸易与税收收入\n押注深度#G +1#!（最多#Y 3#!），所押王子的势#G +10#!"
 oe_ivr.4.b: "押眼下占上风的一位"
 oe_ivr.4.b.tt: "押眼下势最强的王子：[GetCountry('BYZ').Custom('OeBetLeader')]"
 oe_ivr.4.c: "不介入"
 oe_ivr.4.c.tt: "不花钱，局势照常发展"
 oe_ivr.5.t: "被释放的王子"
 oe_ivr.5.desc: "#F 史实上，随父被俘的穆萨获释后渡海进入鲁米利亚，1411年击败了苏莱曼。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c3').GetCharacter.GetName] 带着一支军队进入鲁米利亚，声势大振，势#Y +25#!。"
 oe_ivr.5.a: "继续支持原来押的王子"
 oe_ivr.5.a.tt: "花费#R 2#!个月的贸易与税收收入\n押注深度#G +1#!（最多#Y 3#!），所押王子的势#G +10#!"
 oe_ivr.5.b: "改押来人"
 oe_ivr.5.b.tt: "改押 [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c3').GetCharacter.GetName]，押注深度归零"
 oe_ivr.5.c: "观望"
 oe_ivr.5.c.tt: "局势照常发展"
 oe_ivr.6.t: "兵临城下"
 oe_ivr.6.desc: "#F 史实上，1411年，穆萨为报复帝国支持苏莱曼，围攻君士坦丁堡，又袭扰塞萨洛尼基和锡林布里亚，但没能破城。#!\n\n如今，势最强的 [GetCountry('BYZ').Custom('OeBetLeader')] 恨帝国押了对手，大军开到了君士坦丁堡城下。"
 oe_ivr.6.a: "坚守城墙"
 oe_ivr.6.a.tt: "围城不克，围城者的势#G −10#!"
 oe_ivr.6.b: "献金求和"
 oe_ivr.6.b.tt: "花费#R 3#!个月的贸易与税收收入\n围城者撤走"
 oe_ivr.6.c: "改押另一位王子"
 oe_ivr.6.c.tt: "改押既不是围城者、也不是原先所押的那位王子，押注深度归零，那位王子的势#G +10#!；围城者撤走"
 oe_ivr.7.t: "渡海的船队"
 oe_ivr.7.desc: "#F 史实上，帝国的船把穆罕默德的军队渡过海峡，帝国的士兵也随之出征。1413年7月，穆罕默德在恰穆尔卢击败穆萨。#!\n\n如今，我们押的王子请帝国的舰队把军队渡过海峡。"
 oe_ivr.7.a: "借船"
 oe_ivr.7.a.tt: "所押王子的势#G +20#!"
 oe_ivr.7.b: "借船，也出兵"
 oe_ivr.7.b.tt: "所押王子的势#G +30#!"
 oe_ivr.7.c: "不借"
 oe_ivr.7.c.tt: "局势照常发展"
 oe_ivr.8.t: "恰穆尔卢"
 oe_ivr.8.desc_none: "#F 史实上，1413年7月，穆罕默德在塞尔维亚、匈牙利和帝国的帮助下于恰穆尔卢击败穆萨，奥斯曼人重归一统。#!\n\n如今，争位的王子都已死去或身陷囹圄，奥斯曼的王位另有其主。帝国的押注落空，也不欠谁什么。"
 oe_ivr.8.desc_won: "#F 史实上，1413年7月，穆罕默德在塞尔维亚、匈牙利和帝国的帮助下于恰穆尔卢击败穆萨，奥斯曼人重归一统。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] 赢得了王位。帝国押对了人。"
 oe_ivr.8.desc_lost: "#F 史实上，1413年7月，穆罕默德在塞尔维亚、匈牙利和帝国的帮助下于恰穆尔卢击败穆萨，奥斯曼人重归一统。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] 赢得了王位。帝国押错了人，新苏丹不会忘记。"
 oe_ivr.8.desc_aloof: "#F 史实上，1413年7月，穆罕默德在塞尔维亚、匈牙利和帝国的帮助下于恰穆尔卢击败穆萨，奥斯曼人重归一统。#!\n\n如今，[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] 赢得了王位。帝国始终袖手旁观，新苏丹对帝国既无恩，也无怨。"
 oe_ivr.8.a: "奥斯曼人又有了一位苏丹"
 oe_ivr.8.a.tt: "押中的：新苏丹会来重申约定\n押错的：新苏丹会来清算\n观望的：此事就此了结"
 oe_ivr.9.t: "顺从的儿子"
 oe_ivr.9.desc: "#F 史实上，穆罕默德一世重申了加里波利条约，自称皇帝“顺从的儿子”，直到1421年去世都遵守条约。#!\n\n如今，新苏丹 [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] 派来使节，感谢帝国的支持，重申与帝国的约定。"
 oe_ivr.9.a: "重申和约"
 oe_ivr.9.a.tt: "若还没有签过加里波利条约，现在签订（见条约的各项条款）\n与奥斯曼停战#Y 20#!年\n奥斯曼对帝国好感#G +50#!，持续#Y 8#!年"
 oe_ivr.10.t: "新苏丹的清算"
 oe_ivr.10.desc: "#F 史实上，押错了人的一方，往往要为此付出代价。#!\n\n如今，新苏丹 [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] 记得帝国押了对手，派来使节索要赔偿。"
 oe_ivr.10.a: "赔款保地"
 oe_ivr.10.a.tt: "按岁币协议重新向苏丹纳贡：先付一笔岁币，以后每年一月续付；另有#R 威望 −15#!和#R [oe_tu_authority|e] −5#!\n条约得到的城市保住"
 oe_ivr.10.b: "退还部分土地"
 oe_ivr.10.b.tt: "条约得到的城市约有#R 一半#!交还奥斯曼"
 oe_ivr.10.c: "拒绝"
 oe_ivr.10.c.tt: "奥斯曼对帝国好感#R −50#!，持续#Y 10#!年\n#R 与奥斯曼的停战取消#!"
