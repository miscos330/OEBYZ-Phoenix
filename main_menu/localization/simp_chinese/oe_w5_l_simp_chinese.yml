l_simp_chinese:
# NEW 2026-11-22 v16.0 Module 16.0-B: Western Europe 5 Protagonist Pack (oe_w5_, 0 mainline slots, 0 rules, 0 vanilla/D009 overrides). Generated by gen_v160_west_europe.py; edit the generator, not this file.
 oe_w5_gendarmes: "法兰西王室敕令重骑兵"
 oe_w5_gendarmes_desc: "隶属法兰西常备敕令骑兵连的王室重甲骑兵，身披全身板甲，专擅在欧陆平原以雷霆冲锋击溃敌军步阵。"
 oe_w5_tercio: "西班牙帝国大方阵步兵"
 oe_w5_tercio_desc: "长枪方阵与火绳枪手精密协同的西班牙帝国王牌步兵，兼具钢铁防线与连绵火网，纵横欧陆百余载。"
 oe_w5_redcoats: "不列颠龙虾兵线列步兵"
 oe_w5_redcoats_desc: "身着猩红军服的大不列颠正规线列步兵，以严苛操练闻名的三段轮射火力与铁壁刺刀阵威震全球战场。"
 oe_w5_caravel: "葡萄牙远洋探索卡拉维尔帆船"
 oe_w5_caravel_desc: "源自萨格里什航海传统的轻捷三角帆探险快船，擅于逆风抢航、测绘未知海岸并护卫远洋香料航线。"
 oe_w5_fluyt: "尼德兰弗莱特武装商运船"
 oe_w5_fluyt_desc: "赞河风车船厂量产的大载重少水手尼德兰武装商船，兼具低廉运维与护航火力，称雄波罗的海与东西印度洋。"
 oe_w5_man_o_war: "西欧一级风帆主力战舰"
 oe_w5_man_o_war_desc: "西欧大西洋诸强倾举国船坞之力建造的多层甲板一级战列舰，以毁天灭地的重炮舷侧齐射决定大洋霸权。"
 oe_w5_dec_fra_versailles_intendants.title: "敕设凡尔赛皇家总督体系"
 oe_w5_dec_fra_versailles_intendants.desc: "向法兰西各财政区派遣直属王廷的皇家总督，并将凡尔赛宫铸就为至高王权之殿堂。消耗250金币。"
 oe_w5_dec_fra_versailles_intendants.a: "颁行皇家总督委任状"
 oe_w5_dec_eng_bank_of_england.title: "特许设立英格兰银行"
 oe_w5_dec_eng_bank_of_england.desc: "在伦敦特许设立议会担保的英格兰银行，发行稳健信用券、压低国债利率并为皇家海军筹措巨资。消耗250金币。"
 oe_w5_dec_eng_bank_of_england.a: "签署英格兰银行特许状"
 oe_w5_dec_spa_casa_contratacion.title: "整饬通商院与珍宝护航船队"
 oe_w5_dec_spa_casa_contratacion.desc: "在塞维利亚、加的斯或巴塞罗那革新海贸账册、护航船队时刻与领航学堂，保障伊比利亚跨洋财路。消耗220金币。"
 oe_w5_dec_spa_casa_contratacion.a: "颁布远洋护航敕令"
 oe_w5_dec_por_estado_india_armadas.title: "编成葡属印度洋常年舰队"
 oe_w5_dec_por_estado_india_armadas.desc: "以里斯本为母港编设常年顺季风出航的王室远征舰队，护卫印度洋诸商馆、推行海路通行证并护航香料大船。消耗220金币。"
 oe_w5_dec_por_estado_india_armadas.a: "启航印度洋季风舰队"
 oe_w5_dec_ned_amsterdam_bourse_voc.title: "特许设立阿姆斯特丹交易所与东印度公司"
 oe_w5_dec_ned_amsterdam_bourse_voc.desc: "将荷兰与泽兰诸城商团合并为永续股份制联合东印度公司，并与阿姆斯特丹证券商品交易所相辅相成。消耗220金币。"
 oe_w5_dec_ned_amsterdam_bourse_voc.a: "开市交易所并颁授东印度特许状"
 oe_msn_ned_destiny: "#bold #color_yellow 尼德兰：七海商冠天命#!#!"
 oe_msn_ned_destiny_DESCRIPTION: "从荷兰圩田水道与乌得勒支同盟到东印度公司纵横七海"
 oe_msn_ned_destiny_CRITERIA_DESCRIPTION: "稳固荷兰河口诸港、缔造七省同盟、执掌斯海尔德河与东印度香料商道，加冕尼德兰黄金世纪。"
 oe_msn_ned_destiny_BUTTON_TOOLTIP: "开启尼德兰天命线"
 oe_msn_ned_destiny_BUTTON_DETAILS: "专为荷兰与尼德兰打造的十二任务三支柱天命链：以水线棱堡与联合海军部统合七省防务，凭弗莱特船队与东印度公司贯通安特卫普至香料群岛，并以阿姆斯特丹银库、莱顿学术与良知宽容加冕黄金世纪。"
 oe_msn_ned_01_holland_waterways: "圩田水道：稳固荷兰三港"
 oe_msn_ned_01_holland_waterways_desc: "疏浚潮汐低地并修筑闸门运河，将阿姆斯特丹、海牙与鹿特丹连为低地最富庶的核心腹地。"
 oe_msn_ned_01_holland_waterways_req_tt: "拥有阿姆斯特丹、海牙与鹿特丹，且稳定度不低于 5。"
 oe_msn_ned_02_seven_provinces_union: "乌得勒支与泽兰同盟"
 oe_msn_ned_02_seven_provinces_union_desc: "将乌得勒支枢纽与泽兰米德尔堡军港纳入联邦版图，奠定北方诸省休戚与共的共和同盟。"
 oe_msn_ned_02_seven_provinces_union_req_tt: "拥有乌得勒支与米德尔堡。"
 oe_msn_ned_03_waterline_bastions: "水线防务与陆疆棱堡"
 oe_msn_ned_03_waterline_bastions_desc: "在莱茵河畔阿纳姆与北方重镇格罗宁根构筑星形土石棱堡与泄洪工事，屏障共和国陆疆。"
 oe_msn_ned_03_waterline_bastions_req_tt: "拥有阿纳姆与格罗宁根，国库金币不低于 220，且处于大航海时代或更晚。"
 oe_msn_ned_04_admiralty_broadside: "联合海军部与战列齐射"
 oe_msn_ned_04_admiralty_broadside_desc: "统合各省海军学院并编组制式重炮战列舰队，在北海与海峡直面任何欧陆强敌。"
 oe_msn_ned_04_admiralty_broadside_req_tt: "拥有阿姆斯特丹，稳定度不低于 15，且处于宗教改革时代或更晚。"
 oe_msn_ned_05_herring_fluyt_ports: "北海渔船与霍伦造船厂"
 oe_msn_ned_05_herring_fluyt_ports_desc: "扩建霍伦与多德雷赫特船台，大批量建造北海腌鲱鱼船与廉价高载重弗莱特商船。"
 oe_msn_ned_05_herring_fluyt_ports_req_tt: "拥有霍伦与多德雷赫特。"
 oe_msn_ned_06_scheldt_brabant_nexus: "执掌斯海尔德河与布拉班特"
 oe_msn_ned_06_scheldt_brabant_nexus_desc: "掌控安特卫普与布雷达，将莱茵河、默兹河与斯海尔德河三大入海商道尽收囊中。"
 oe_msn_ned_06_scheldt_brabant_nexus_req_tt: "拥有安特卫普与布雷达。"
 oe_msn_ned_07_cape_spice_waypoints: "远洋补给站与南非航道"
 oe_msn_ned_07_cape_spice_waypoints_desc: "依托日益壮大的低地港群与老练领航员，将尼德兰商船队推向好望角以东的广阔大洋。"
 oe_msn_ned_07_cape_spice_waypoints_req_tt: "拥有海港、领土不少于 18 个地点，且处于大航海时代或更晚。"
 oe_msn_ned_08_voc_batavia_monopoly: "东印度公司香料海权"
 oe_msn_ned_08_voc_batavia_monopoly_desc: "在桌湾、马六甲或巽他格拉巴（巴达维亚）建立远洋据点，或坐拥至少30座领地称雄全球海贸。"
 oe_msn_ned_08_voc_batavia_monopoly_req_tt: "拥有阿姆斯特丹与至少 400 金币，处于宗教改革时代或更晚，且拥有巽他格拉巴、马六甲、桌湾之一或领土不少于 30 处。"
 oe_msn_ned_09_amsterdam_wisselbank: "阿姆斯特丹汇兑银行"
 oe_msn_ned_09_amsterdam_wisselbank_desc: "在阿姆斯特丹市政厅地库设立汇兑银行，将各地杂乱金银铸就为全欧最受信赖的清算通货。"
 oe_msn_ned_09_amsterdam_wisselbank_req_tt: "拥有阿姆斯特丹、金币不少于 260，且处于大航海时代或更晚。"
 oe_msn_ned_10_leiden_golden_age: "莱顿学府与画坛盛世"
 oe_msn_ned_10_leiden_golden_age_desc: "资助莱顿大学并赞助画坛巨匠、光学镜片工匠与制图师，令荷兰艺术与格致之学名扬四海。"
 oe_msn_ned_10_leiden_golden_age_req_tt: "拥有莱顿与阿姆斯特丹，且处于宗教改革时代或更晚。"
 oe_msn_ned_11_edict_of_conscience: "良知自由与学术庇护"
 oe_msn_ned_11_edict_of_conscience_desc: "广纳全欧流亡印刷商、哲人与织造巧匠，将宽容精神转化为绵延不绝的科技与工商动力。"
 oe_msn_ned_11_edict_of_conscience_req_tt: "拥有阿姆斯特丹，稳定度不低于 15，且处于宗教改革时代或更晚。"
 oe_msn_ned_12_dutch_golden_century: "加冕尼德兰黄金世纪"
 oe_msn_ned_12_dutch_golden_century_desc: "凭无敌舰队、东印度环球商路与冠绝欧陆的金融学术，正式加冕璀璨夺目的尼德兰黄金世纪。"
 oe_msn_ned_12_dutch_golden_century_req_tt: "拥有阿姆斯特丹、海牙与乌得勒支，稳定度不低于 18，且处于绝对主义时代或更晚。"
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m1: "七省联合海军部"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m1: "五大省区海军部协同运转，水线防务与重炮战列舰队牢牢扼守低地诸河口要冲。"
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m2: "东印度公司香料霸权"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m2: "武装东印度商船将阿姆斯特丹、好望角、马六甲与巴达维亚连为全球最富庶的远洋香料网。"
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m3: "良知避风港与印刷重镇"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m3: "流亡学者、印刷匠师与新教工匠云集荷兰诸城，使尼德兰成为欧陆思想与科学最自由的熔炉。"
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m4: "尼德兰黄金世纪"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m4: "从圩田运河、阿姆斯特丹银库到环球商道，共和国以金融、艺术与制海权傲视欧陆群雄。"
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_versailles_intendants: "凡尔赛皇家总督体系"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_versailles_intendants: "由王室直派的各省总督绕过地方高等法院督办税赋与军需，将凡尔赛王权贯彻至法兰西全境。"
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_bank_of_england: "英格兰银行皇家特许"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_bank_of_england: "议会担保的国家信用与流通银行券以极低利率融通巨资，为欧陆盟约与皇家海军船坞提供不竭财源。"
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_casa_contratacion: "塞维利亚通商院新制"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_casa_contratacion: "统一航海图册、护航船队时刻表与严密关税账簿将跨大西洋白银船队牢牢系于伊比利亚本土。"
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_estado_india: "葡属印度洋无敌舰队"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_estado_india: "顺应季风的常年远征舰队巡弋于里斯本、霍尔木兹、果阿与马六甲之间，掌控印度洋海路通行权。"
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_amsterdam_voc: "阿姆斯特丹交易所与东印度特许"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_amsterdam_voc: "股份证券交易与永续公司资本释放出惊人财力，推动尼德兰商船纵横波罗的海至班达群岛。"
 STATIC_MODIFIER_NAME_oe_w5_mod_compagnies_ordonnance: "王室常备敕令骑兵连"
 STATIC_MODIFIER_DESC_oe_w5_mod_compagnies_ordonnance: "常年领饷的披甲重骑兵直接效忠瓦卢瓦王室，一举奠定近代欧陆首支国家常备军之基石。"
 STATIC_MODIFIER_NAME_oe_w5_mod_maid_of_orleans: "奥尔良圣旗激励"
 STATIC_MODIFIER_DESC_oe_w5_mod_maid_of_orleans: "奥尔良解围点燃了法兰西军民对百合王旗的赤诚信念，卢瓦尔河与香槟诸城士气为之一振。"
 STATIC_MODIFIER_NAME_oe_w5_mod_spider_king_web: "蜘蛛王之密网集权"
 STATIC_MODIFIER_DESC_oe_w5_mod_spider_king_web: "王室驿站网、密探耳目与市民出身的能臣联手瓦解诸侯同盟，不战而收拢大权于王廷。"
 STATIC_MODIFIER_NAME_oe_w5_mod_fontainebleau_arts: "枫丹白露文艺复兴"
 STATIC_MODIFIER_DESC_oe_w5_mod_fontainebleau_arts: "意籍大师、王家印书局与城堡巨匠齐聚枫丹白露，将法兰西宫廷铸就为阿尔卑斯山以北的人文殿堂。"
 STATIC_MODIFIER_NAME_oe_w5_mod_wars_of_religion: "宗教同盟戒严体制"
 STATIC_MODIFIER_DESC_oe_w5_mod_wars_of_religion: "各地设防城镇与教派民兵全面戒备，虽令国内教争紧绷，却也锻造出坚韧的城防体系。"
 STATIC_MODIFIER_NAME_oe_w5_mod_edict_of_nantes: "南特敕令宽容和解"
 STATIC_MODIFIER_DESC_oe_w5_mod_edict_of_nantes: "敕令明文保障新教徒公民权与避难城邑，让饱受内战摧残的法兰西各省得以休养生息。"
 STATIC_MODIFIER_NAME_oe_w5_mod_richelieu_raison: "国家理性铁腕政务"
 STATIC_MODIFIER_DESC_oe_w5_mod_richelieu_raison: "攻克叛乱海港要塞并以国家利益凌驾教派之争，使法兰西跃居欧陆外交与强权之巅。"
 STATIC_MODIFIER_NAME_oe_w5_mod_fronde_pacification: "投石党后王权定鼎"
 STATIC_MODIFIER_DESC_oe_w5_mod_fronde_pacification: "历经贵族内乱疲敝之后，地方大领主被迫俯首王法，年轻君主亦立誓绝不再令王权受制于人。"
 STATIC_MODIFIER_NAME_oe_w5_mod_sun_king_versailles: "太阳王凡尔赛威仪"
 STATIC_MODIFIER_DESC_oe_w5_mod_sun_king_versailles: "镜厅之中繁复庄严的朝仪将显赫公爵牢牢系于宫廷，法兰西礼乐与法语风尚由此风靡全欧。"
 STATIC_MODIFIER_NAME_oe_w5_mod_colbert_mercantilism: "柯尔贝尔重商工场"
 STATIC_MODIFIER_DESC_oe_w5_mod_colbert_mercantilism: "皇家玻璃坊、织锦工场、关税壁垒与造船林场相辅相成，将本土工艺源源不断地化为国库金银。"
 STATIC_MODIFIER_NAME_oe_w5_mod_fontainebleau_edict: "王室一统教化令"
 STATIC_MODIFIER_DESC_oe_w5_mod_fontainebleau_edict: "全境统一教会法度与教区名册，虽伴随工匠外流之损，却极大强化了王国宗教与礼制的一致性。"
 STATIC_MODIFIER_NAME_oe_w5_mod_mississippi_system: "纸币信用大试验"
 STATIC_MODIFIER_DESC_oe_w5_mod_mississippi_system: "将王室国债转为股份纸币的大胆方案令巴黎市面一时银根充沛，却也将国家信用推上风口浪尖。"
 STATIC_MODIFIER_NAME_oe_w5_mod_fiscal_retrenchment: "战后财税整顿与炮兵革新"
 STATIC_MODIFIER_DESC_oe_w5_mod_fiscal_retrenchment: "历经七年大战财库吃紧之后，军中推行轻量化制式野战炮，财政官亦着力清查包税特权。"
 STATIC_MODIFIER_NAME_oe_w5_mod_turgot_physiocracy: "重农学派与杜尔哥新政"
 STATIC_MODIFIER_DESC_oe_w5_mod_turgot_physiocracy: "放开国内粮食自由流通并以公平地税取代农民无偿徭役，为法兰西乡野注入久违生机。"
 STATIC_MODIFIER_NAME_oe_w5_mod_estates_general_dawn: "三级会议与公民觉醒"
 STATIC_MODIFIER_DESC_oe_w5_mod_estates_general_dawn: "陈情书、政论小册子与国民自卫军在城乡遍地开花，磅礴的近代民族与公民热潮席卷全国。"
 STATIC_MODIFIER_NAME_oe_w5_mod_yeoman_longbows: "自耕农长弓法令"
 STATIC_MODIFIER_DESC_oe_w5_mod_yeoman_longbows: "各教区逢周日必习箭艺的王室法令锻造出纪律严明的自耕农长弓手，万箭齐发足以摧毁重甲骑阵。"
 STATIC_MODIFIER_NAME_oe_w5_mod_roses_factionalism: "玫瑰战争私兵动员"
 STATIC_MODIFIER_DESC_oe_w5_mod_roses_factionalism: "约克与兰开斯特两大支系遍招私兵家臣，虽令贵胄内耗不断，却也磨砺出久经沙场的英格兰战将。"
 STATIC_MODIFIER_NAME_oe_w5_mod_tudor_star_chamber: "都铎星室法庭定鼎"
 STATIC_MODIFIER_DESC_oe_w5_mod_tudor_star_chamber: "雷厉风行的王室星室法庭严禁诸侯蓄养私兵并清丈王产，开启英格兰休养生息与财政丰盈之局。"
 STATIC_MODIFIER_NAME_oe_w5_mod_act_of_supremacy: "至尊法案与王室收归教产"
 STATIC_MODIFIER_DESC_oe_w5_mod_act_of_supremacy: "确立君主对英格兰教会之最高管辖权，将旧修道院田产转化为王家船坞经费与忠君乡绅阶层。"
 STATIC_MODIFIER_NAME_oe_w5_mod_elizabethan_armada: "伊丽莎白海犬与海峡大捷"
 STATIC_MODIFIER_DESC_oe_w5_mod_elizabethan_armada: "灵巧的低舷盖伦战舰与悍勇的私掠船长齐心御敌，将英吉利海峡铸成拱卫岛国的铁壁天堑。"
 STATIC_MODIFIER_NAME_oe_w5_mod_east_india_charter: "东印度公司远东商馆"
 STATIC_MODIFIER_DESC_oe_w5_mod_east_india_charter: "武装商团自苏拉特至马德拉斯广设设防商馆，将棉布、硝石与茶叶源源不断地运回泰晤士河畔。"
 STATIC_MODIFIER_NAME_oe_w5_mod_petition_of_right: "权利请愿与议会宪政"
 STATIC_MODIFIER_DESC_oe_w5_mod_petition_of_right: "议会坚持征税必经同意与人身保护法原则，为近代立宪政治与法治财政奠定深厚根基。"
 STATIC_MODIFIER_NAME_oe_w5_mod_navigation_new_model: "新模范军与航海条例"
 STATIC_MODIFIER_DESC_oe_w5_mod_navigation_new_model: "唯才是举的新模范军与限定殖民地货运须由本国船只承运的航海条例，共同铸就海陆强权。"
 STATIC_MODIFIER_NAME_oe_w5_mod_bill_of_rights: "权利法案立宪秩序"
 STATIC_MODIFIER_DESC_oe_w5_mod_bill_of_rights: "不流血的光荣革命使王权与议会达成宪政契约，赢得空前金融信任与稳固的欧陆同盟地位。"
 STATIC_MODIFIER_NAME_oe_w5_mod_threadneedle_credit: "金融革命国家公债"
 STATIC_MODIFIER_DESC_oe_w5_mod_threadneedle_credit: "永续国债与透明国库审计使不列颠得以在长期争霸中游刃有余地筹措巨款而免于财政崩盘。"
 STATIC_MODIFIER_NAME_oe_w5_mod_act_of_union_1707: "大不列颠联合王国"
 STATIC_MODIFIER_DESC_oe_w5_mod_act_of_union_1707: "统一议会、共同关税区与大西洋市场将英格兰资本与苏格兰精兵及启蒙学者融为一体。"
 STATIC_MODIFIER_NAME_oe_w5_mod_walpole_treasury: "沃波尔偿债基金与稳健内阁"
 STATIC_MODIFIER_DESC_oe_w5_mod_walpole_treasury: "南海泡沫破灭后，首席财政大臣以偿债基金重建市场信誉，以稳健和平外交护航商业繁荣。"
 STATIC_MODIFIER_NAME_oe_w5_mod_annus_mirabilis: "奇迹之年全球制霸"
 STATIC_MODIFIER_DESC_oe_w5_mod_annus_mirabilis: "大西洋、西非与孟加拉捷报频传，皇家海军借连番大捷奠定纵横四海的霸主地位。"
 STATIC_MODIFIER_NAME_oe_w5_mod_canal_textile_boom: "运河煤炭与纺织工业热潮"
 STATIC_MODIFIER_DESC_oe_w5_mod_canal_textile_boom: "纵横交错的内陆运河将廉价煤炭送往炼铁炉与水力纺织厂，率先点燃震撼世界的工业革命。"
 STATIC_MODIFIER_NAME_oe_w5_mod_pax_britannica_dawn: "不列颠治世与废奴巡航"
 STATIC_MODIFIER_DESC_oe_w5_mod_pax_britannica_dawn: "远洋战舰常年巡弋大西洋与印度洋咽喉水道，以废奴巡航道义与全球海权开启不列颠治世。"
 STATIC_MODIFIER_NAME_oe_w5_mod_mesta_hermandad: "美斯塔牧羊公会与圣兄弟会"
 STATIC_MODIFIER_DESC_oe_w5_mod_mesta_hermandad: "美利奴羊毛畅销弗兰德斯换取巨额白银，城镇圣兄弟会则肃清官道匪患、护卫王畿治安。"
 STATIC_MODIFIER_NAME_oe_w5_mod_granada_capitulation: "收复失地终章荣耀"
 STATIC_MODIFIER_DESC_oe_w5_mod_granada_capitulation: "格拉纳达城头的旗帜为数百年收复失地画上句号，久经战阵的卡斯蒂利亚劲旅由此剑指意西与新世界。"
 STATIC_MODIFIER_NAME_oe_w5_mod_iberian_dynastic_concord: "伊比利亚双王共治协约"
 STATIC_MODIFIER_DESC_oe_w5_mod_iberian_dynastic_concord: "联姻协约与共治枢密院兼顾各地传统特权，令卡斯蒂利亚劲旅与阿拉贡地中海舰队协同发力。"
 STATIC_MODIFIER_NAME_oe_w5_mod_seville_contratacion: "塞维利亚领航学堂与贸易署"
 STATIC_MODIFIER_DESC_oe_w5_mod_seville_contratacion: "瓜达尔基维尔河畔的皇家宇宙学家校核海图、培训领航员，统筹一切驶往新世界的远洋船队。"
 STATIC_MODIFIER_NAME_oe_w5_mod_school_of_salamanca: "萨拉曼卡学派经济法理"
 STATIC_MODIFIER_DESC_oe_w5_mod_school_of_salamanca: "萨拉曼卡法学家与神学家开创近代国际法与货币数量学说，以深邃学理疏导白银洪流冲击。"
 STATIC_MODIFIER_NAME_oe_w5_mod_potosi_silver_fleets: "波托西皇家五一银船"
 STATIC_MODIFIER_DESC_oe_w5_mod_potosi_silver_fleets: "每年两度自韦拉克鲁斯与卡塔赫纳起航的白银船队将海量银元输入欧陆，支撑遍及诸战场的帝国军费。"
 STATIC_MODIFIER_NAME_oe_w5_mod_imperial_tercios: "帝国大方阵军制改革"
 STATIC_MODIFIER_DESC_oe_w5_mod_imperial_tercios: "长枪林立、火绳枪手环护两翼的西班牙大方阵纵横意大利与低地战场，百余年间鲜有敌手。"
 STATIC_MODIFIER_NAME_oe_w5_mod_lepanto_triumph: "勒班陀神圣同盟大捷"
 STATIC_MODIFIER_DESC_oe_w5_mod_lepanto_triumph: "重炮大桨帆船与登舰大方阵步兵联手挫败劲敌，稳固西地中海至西西里沿岸的航道安全。"
 STATIC_MODIFIER_NAME_oe_w5_mod_armada_rebuild: "大西洋护航盖伦舰重整"
 STATIC_MODIFIER_DESC_oe_w5_mod_armada_rebuild: "汲取北海风暴惨痛教训后，坎塔布里亚与安达卢西亚船厂改建更迅捷稳固的远洋护航盖伦战舰。"
 STATIC_MODIFIER_NAME_oe_w5_mod_castilian_arbitristas: "卡斯蒂利亚经世派财改"
 STATIC_MODIFIER_DESC_oe_w5_mod_castilian_arbitristas: "经世改革派力谏王廷节制铸币贬值、扶持本土织造并招徕流民重垦卡斯蒂利亚高原荒村。"
 STATIC_MODIFIER_NAME_oe_w5_mod_union_of_arms: "奥利瓦雷斯兵役同盟"
 STATIC_MODIFIER_DESC_oe_w5_mod_union_of_arms: "令诸王国按额共担常备兵役虽显著充实帝国战力，却也令加泰罗尼亚与地方议会暗生不满。"
 STATIC_MODIFIER_NAME_oe_w5_mod_westphalia_retrench: "威斯特伐利亚休兵保本"
 STATIC_MODIFIER_DESC_oe_w5_mod_westphalia_retrench: "承认荷兰独立终结长达八十载的财政失血，使马德里得以收束兵力稳固意大利与美洲基业。"
 STATIC_MODIFIER_NAME_oe_w5_mod_nueva_planta_decrees: "波旁新基本法集权"
 STATIC_MODIFIER_DESC_oe_w5_mod_nueva_planta_decrees: "统一中央部院、直派总督与标准化省税体制将伊比利亚诸王国铸为一个高效率的近代主权国家。"
 STATIC_MODIFIER_NAME_oe_w5_mod_charles_iii_reforms: "卡洛斯三世启蒙新政"
 STATIC_MODIFIER_DESC_oe_w5_mod_charles_iii_reforms: "向伊比利亚十三座港口开放美洲自由贸易、兴办经济学会并修筑御道，令跨洋帝国焕发中兴气象。"
 STATIC_MODIFIER_NAME_oe_w5_mod_avis_aljubarrota: "阿勒祖巴洛特方阵立国"
 STATIC_MODIFIER_DESC_oe_w5_mod_avis_aljubarrota: "阿勒祖巴洛特一战奠定阿维斯王朝正统，稳固葡萄牙独立国本并开启面朝大西洋的百年国策。"
 STATIC_MODIFIER_NAME_oe_w5_mod_sagres_navigation: "萨格里什航海图与卡拉维尔"
 STATIC_MODIFIER_DESC_oe_w5_mod_sagres_navigation: "三角帆卡拉维尔船、星盘与季风航海日志相配合，率先叩开西非海岸与大西洋诸岛的大门。"
 STATIC_MODIFIER_NAME_oe_w5_mod_cape_india_route: "好望角印度直航之路"
 STATIC_MODIFIER_DESC_oe_w5_mod_cape_india_route: "绕过好望角直抵马拉巴尔海岸，一举绕开黎凡特中转商道，令印度胡椒直抵特茹河口。"
 STATIC_MODIFIER_NAME_oe_w5_mod_tordesillas_meridian: "托尔德西里亚斯子午线"
 STATIC_MODIFIER_DESC_oe_w5_mod_tordesillas_meridian: "教廷斡旋划定的大洋分界线稳固葡萄牙在非洲航线、印度洋与巴西海岸的法理先机。"
 STATIC_MODIFIER_NAME_oe_w5_mod_albuquerque_forts: "阿尔布克尔克海峡链条"
 STATIC_MODIFIER_DESC_oe_w5_mod_albuquerque_forts: "霍尔木兹、果阿与马六甲三座石砌海防要塞连点成链，使大西洋小国执掌印度洋航路牛耳。"
 STATIC_MODIFIER_NAME_oe_w5_mod_casa_da_india: "里斯本印度之家香料专卖"
 STATIC_MODIFIER_DESC_oe_w5_mod_casa_da_india: "丁香、肉桂与肉豆蔻悉数经里斯本印度之家统购统销，为王室克拉克大船与盛世营造提供巨资。"
 STATIC_MODIFIER_NAME_oe_w5_mod_sebastian_regency: "阿卡塞尔危机后摄政维稳"
 STATIC_MODIFIER_DESC_oe_w5_mod_sebastian_regency: "远征受挫后，老成持重的摄政枢密院整顿海防要塞，竭力保全王国法度与海外商馆。"
 STATIC_MODIFIER_NAME_oe_w5_mod_tomar_charter: "托马尔议会自治宪章"
 STATIC_MODIFIER_DESC_oe_w5_mod_tomar_charter: "坚守葡萄牙官职、货币与海外总督唯本国人任用之约，在共主时期完整守护民族本色与巴西糖运。"
 STATIC_MODIFIER_NAME_oe_w5_mod_braganza_restoration: "布拉干萨光复独立"
 STATIC_MODIFIER_DESC_oe_w5_mod_braganza_restoration: "十二月清晨一举光复里斯本王宫，迎回布拉干萨本国王室并沿陆疆广修棱堡捍卫主权。"
 STATIC_MODIFIER_NAME_oe_w5_mod_methuen_commerce: "梅休因条约与波特酒贸"
 STATIC_MODIFIER_DESC_oe_w5_mod_methuen_commerce: "杜罗河谷波特酒获准优先畅销伦敦，英葡海盟亦为葡萄牙大西洋与巴西黄金航线保驾护航。"
 STATIC_MODIFIER_NAME_oe_w5_mod_lisbon_relief: "里斯本大震灾后救急"
 STATIC_MODIFIER_DESC_oe_w5_mod_lisbon_relief: "大震与海啸之后，王军严守秩序、抢通码头并调拨木料粮秣，迅速稳住特茹河畔民心。"
 STATIC_MODIFIER_NAME_oe_w5_mod_pombaline_rebuild: "庞巴尔新城与近代化革新"
 STATIC_MODIFIER_DESC_oe_w5_mod_pombaline_rebuild: "抗震木构框架、齐整宽阔的下城街区与科英布拉近代科学学制，让葡萄牙在废墟之上涅槃重生。"
 STATIC_MODIFIER_NAME_oe_w5_mod_holland_herring_fleet: "荷兰北海鲱鱼大船队"
 STATIC_MODIFIER_DESC_oe_w5_mod_holland_herring_fleet: "海上腌制工艺使北海鲱鱼捕捞跃居荷兰立国母业，世代孕育出骁勇水手与精湛造船匠师。"
 STATIC_MODIFIER_NAME_oe_w5_mod_great_privilege: "大特许状与三级会议自治"
 STATIC_MODIFIER_DESC_oe_w5_mod_great_privilege: "各省议会与市政执政坚守自主集会与征税同意权，为低地诸城的市民自由筑起法理屏障。"
 STATIC_MODIFIER_NAME_oe_w5_mod_eighty_years_resolve: "八十年抗争孤勇"
 STATIC_MODIFIER_DESC_oe_w5_mod_eighty_years_resolve: "围城之下的市民宁肯掘堤放水也不屈服于高压，烈火中锻造出百折不挠的尼德兰独立意志。"
 STATIC_MODIFIER_NAME_oe_w5_mod_sea_beggars_brill: "海上乞丐奇袭布里勒"
 STATIC_MODIFIER_DESC_oe_w5_mod_sea_beggars_brill: "浅吃水私掠舰队奇袭泽兰与荷兰河口要港，切断敌军补给驳船，点燃全境光复星火。"
 STATIC_MODIFIER_NAME_oe_w5_mod_union_of_utrecht: "乌得勒支同盟建国宪约"
 STATIC_MODIFIER_DESC_oe_w5_mod_union_of_utrecht: "北方七省立誓共御外侮并保障信仰自由，联邦制海上商业共和国由此巍然立世。"
 STATIC_MODIFIER_NAME_oe_w5_mod_voc_global_charter: "联合东印度公司远洋特许"
 STATIC_MODIFIER_DESC_oe_w5_mod_voc_global_charter: "获授好望角以东宣战、铸币与筑城全权的东印度公司高悬橙色旗帜，席卷亚洲香料海路。"
 STATIC_MODIFIER_NAME_oe_w5_mod_amsterdam_wisselbank: "阿姆斯特丹汇兑银行清算"
 STATIC_MODIFIER_DESC_oe_w5_mod_amsterdam_wisselbank: "足值银行盾与高效账面划拨吸引全欧白银与汇票云集水坝广场金库，确立世界金融中心地位。"
 STATIC_MODIFIER_NAME_oe_w5_mod_fluyt_supremacy: "赞河风车锯木与弗莱特船海"
 STATIC_MODIFIER_DESC_oe_w5_mod_fluyt_supremacy: "风车锯木厂以半价批量建造梨形弗莱特货船，以极少水手垄断波罗的海谷物与大西洋木材海运。"
 STATIC_MODIFIER_NAME_oe_w5_mod_synod_of_dort: "多德雷赫特宗教会议与官译圣经"
 STATIC_MODIFIER_DESC_oe_w5_mod_synod_of_dort: "国会官译本圣经统一了尼德兰各省标准语，也为共和国境内激烈的神学与政派之争划下秩序界限。"
 STATIC_MODIFIER_NAME_oe_w5_mod_tulip_regulation: "哈勒姆郁金香契约善后"
 STATIC_MODIFIER_DESC_oe_w5_mod_tulip_regulation: "务实冷静的市政法庭将疯狂郁金香期货折算为温和解约费，迅速隔离投机泡沫、护住实体商贸。"
 STATIC_MODIFIER_NAME_oe_w5_mod_peace_of_munster: "明斯特和约独立加冕"
 STATIC_MODIFIER_DESC_oe_w5_mod_peace_of_munster: "正式国际承认终结八十年独立战争，将斯海尔德河商道优势与海上共和尊严写入欧陆公法。"
 STATIC_MODIFIER_NAME_oe_w5_mod_de_ruyter_admiralty: "德鲁伊特海上战列兵法"
 STATIC_MODIFIER_DESC_oe_w5_mod_de_ruyter_admiralty: "旗语指挥、精准齐射与奇袭梅德韦河口的壮举，令荷兰海军将星闪耀北海与英吉利海峡。"
 STATIC_MODIFIER_NAME_oe_w5_mod_rampjaar_waterline: "1672灾年水线绝地反击"
 STATIC_MODIFIER_DESC_oe_w5_mod_rampjaar_waterline: "决堤蓄水将荷兰化作易守难攻的水上堡垒，重振的执政统帅更团结全欧盟友挡住强敌合围。"
 STATIC_MODIFIER_NAME_oe_w5_mod_batavian_patriots: "爱国者民团与巴达维亚革新"
 STATIC_MODIFIER_DESC_oe_w5_mod_batavian_patriots: "启蒙市民社团、爱国者民兵与近代成文宪法构想相互激荡，引领低地诸邦迈入大革命新时代。"
 oe_w5.1.title: "王室常备敕令骑兵连"
 oe_w5.1.desc: "漫长战火中散兵游勇的劫掠令王廷痛定思痛，单靠封建征召已难以捍卫法兰西江山。若以常年王室人头税供养领饷常备的披甲敕令骑兵连，法兰西将率先缔造近代欧陆第一支常备军，但各地大贵族却忧心此举削弱其传统兵权。"
 oe_w5.1.a: "敕立王室常年领饷的重甲敕令骑兵连"
 oe_w5.1.b: "保留封建采邑征召并以俸禄笼络贵族"
 oe_w5.2.title: "奥尔良少女与卢瓦尔反攻"
 oe_w5.2.desc: "一名来自洛林边地的农家少女高擎金百合白旗赶赴卢瓦尔河谷，令濒临绝境的守军士气大振。她无畏冲锋打破奥尔良合围，激励全法兰西将士与百姓重燃光复王土的炽热信念。"
 oe_w5.2.a: "高举奥尔良圣旗趁势发起全面反攻"
 oe_w5.2.b: "借声势稳固城防并展开停战斡旋"
 oe_w5.3.title: "蜘蛛王路易十一与公益同盟"
 oe_w5.3.desc: "眼见王室步步收拢采邑与边疆伯爵领，诸大公联合结成公益同盟公然掣肘王权。精于权谋的王室大臣力谏不必与诸侯意气决战，而应借王室驿站、市民盟约与暗中分化的厚赂密网，从内部逐一瓦解叛盟。"
 oe_w5.3.a: "织就密网驿站并重用市民大臣分化诸侯"
 oe_w5.3.b: "酌授地方特许状暂安诸大公之心"
 oe_w5.4.title: "弗朗索瓦一世与枫丹白露文艺复兴"
 oe_w5.4.desc: "历尽意大利远征的瓦卢瓦宫廷醉心于人文藏书与古典建筑，广邀意籍画师、雕匠与饱学之士汇聚枫丹白露。资助皇家学院并敕定法语为官方文书正音将令法兰西文华辉耀欧陆，唯须自紧绷国库中拨出重金。"
 oe_w5.4.a: "重金赞助枫丹白露学派与法兰西学院"
 oe_w5.4.b: "压缩宫廷艺文开支转投边防铸炮工坊"
 oe_w5.5.title: "法兰西宗教战争与圣巴托罗缪钟声"
 oe_w5.5.desc: "天主教同盟与胡格诺贵族的教派宿怨已将法兰西诸城化为剑拔弩张的兵营。巴黎婚典喜乐骤变为午夜警钟与街垒火光，王廷须在依托教派戒严铁腕弹压与扶持政治派力图弭兵之间作出抉择。"
 oe_w5.5.a: "强化城防戒严并以教派同盟稳固秩序"
 oe_w5.5.b: "授权温和政治派赴各省斡旋停火"
 oe_w5.6.title: "南特敕令：息兵宽容"
 oe_w5.6.desc: "历经三十载惨烈教争，满目疮痍的各省无不渴望息兵复业。在南特颁行王室宽容敕令、保障少数教派的公民权与礼拜场所，虽会招致保守派非议，却能令破碎王国迅速愈合并迎来商农复苏。"
 oe_w5.6.a: "颁行南特敕令以宽容法治重塑国内和平"
 oe_w5.6.b: "仅颁临时停战特赦而维持严格教廷裁决"
 oe_w5.7.title: "黎塞留红衣主教与拉罗谢尔围城"
 oe_w5.7.desc: "决心绝不容许国中之国并存的首相黎塞留亲督巨型石堤封锁叛港拉罗谢尔，并在欧陆纵横捭阖。拆毁地方割据堡垒虽须耗费浩大军资，却将令法兰西全境彻底归于国家理性的铁腕统摄。"
 oe_w5.7.a: "贯彻国家理性，收缴叛城要塞统归王室"
 oe_w5.7.b: "许以市政宽赦并改征大西洋海港商税"
 oe_w5.8.title: "投石党之乱：高等法院与亲王反扑"
 oe_w5.8.desc: "繁重战税与皇家总督扩权先后激怒巴黎高等法院法官与显赫亲王，塞纳河畔筑起街垒、内乱骤起。摄政王廷在幼主亲政前迎来关乎王权存亡的严峻大考。"
 oe_w5.8.a: "铁腕平定投石党并确立王廷至高司法权"
 oe_w5.8.b: "确认高等法院谏议旧权以迅速平息动乱"
 oe_w5.9.title: "太阳王与凡尔赛宫盛典"
 oe_w5.9.desc: "巴黎西南的旧日猎宫已化作镜厅璀璨、园林森严的宏伟凡尔赛宫殿。将各地傲慢大贵族引入宫廷日夜侍奉朝仪，既可永绝封君叛乱之患，更能令法兰西礼乐威仪辐射整个欧陆。"
 oe_w5.9.a: "以凡尔赛宫为太阳王绝对王权与礼乐之巅"
 oe_w5.9.b: "留驻巴黎旧宫并将营造巨款改筑沃邦边塞"
 oe_w5.10.title: "柯尔贝尔重商主义与皇家工场"
 oe_w5.10.desc: "财政总监柯尔贝尔力陈欧陆金银总量有限，唯靠扶持本土手工工场、筑起保护关税并打造远洋海军方能聚敛国富。在布雷斯特与土伦广建船坞并兴办皇家织锦与镜坊，有望令国库财源滚滚。"
 oe_w5.10.a: "推行柯尔贝尔皇家工场、保护关税与海军船坞"
 oe_w5.10.b: "放宽关税壁垒鼓励大西洋与黎凡特自由商号"
 oe_w5.11.title: "废除南特敕令之争"
 oe_w5.11.desc: "宫廷保守教士力劝君主颁行枫丹白露敕令废止南特宽容条款，以实现一王一法一教之大一统；然而重商大臣却忧心忡忡地警告，驱逐数以万计精明能干的胡格诺织工、钟表匠与海军军官，无异于资敌荷兰与不列颠。"
 oe_w5.11.a: "颁行统一信仰敕令以固王权教统"
 oe_w5.11.b: "坚持宽容旧约留住工匠与海军英才"
 oe_w5.12.title: "密西西比泡沫警钟与纸币狂潮"
 oe_w5.12.desc: "苏格兰理财家约翰·劳声称只要将王家银行与路易斯安那殖民公司合并发行纸币，便可一举化解法国沉重国债。巴黎甘康普瓦街上投机客摩肩接踵，冷静的审计官却警示毫无金银锚定的纸币正酝酿惊天崩盘。"
 oe_w5.12.a: "力推纸币债转股试验以图一举盘活国库"
 oe_w5.12.b: "及时收紧纸币发行并严格审计殖民地账目"
 oe_w5.13.title: "七年战争财政危局与炮兵革新"
 oe_w5.13.desc: "德意志陆战与北美、印度海战双线失利令法国国库濒临枯竭，债主盈门催款。危急之际，炮兵总监格里博瓦尔献上轻量化、可互换部件的新式野战炮蓝图，誓要以军事革新雪耻图强。"
 oe_w5.13.a: "厉行格里博瓦尔炮兵革新并严查包税商"
 oe_w5.13.b: "向巴黎金融家举借应急军债暂渡难关"
 oe_w5.14.title: "重农学派与杜尔哥六项敕令"
 oe_w5.14.desc: "深受重农学派与巴黎启蒙沙龙熏陶的新任财政总监杜尔哥颁布六项大刀阔斧的敕令：破除行会垄断、放开国内粮贸，并以普遍地税取代农民无偿筑路徭役。既得利益贵族与高等法院随即群起攻之。"
 oe_w5.14.a: "力排众议贯彻杜尔哥重农新政与税制革新"
 oe_w5.14.b: "搁置激进敕令以维护贵族与高等法院体面"
 oe_w5.15.title: "三级会议召开与大革命黎明"
 oe_w5.15.desc: "在国债压顶与严冬荒年夹击之下，法国王室近两百年来首度重开三级会议。来自全国城乡的数千份陈情书汇聚巴黎，齐声呼唤成文宪法、平等纳税与近代公民权——足以重塑法兰西与整个欧洲的历史黎明已然降临。"
 oe_w5.15.a: "顺应立宪潮流并唤醒近代国民军魂"
 oe_w5.15.b: "坚守王室特权并与贵族温和派缔结保守宪章"
 oe_w5.16.title: "自耕农长弓法令与劳工法"
 oe_w5.16.desc: "黑死病造成乡野劳力剧减而跨海远征捷报频传之际，威斯敏斯特议会一面审议劳工工资法，一面重申各教区周日必习紫杉长弓之王令。纪律严明的自耕农长弓手正是英格兰震慑欧陆骑士团的利刃。"
 oe_w5.16.a: "严行教区长弓操练令，锻造精锐自耕农弓队"
 oe_w5.16.b: "严格执行劳工限薪令以维护领主庄园收益"
 oe_w5.17.title: "玫瑰战争：红白蔷薇内讧"
 oe_w5.17.desc: "约克与兰开斯特两大王室支系的权争演变为席卷英格兰诸郡的血腥内战，领主家臣各举红白玫瑰旗号厮杀不休。连年内讧虽伤及国本，却也让英格兰将士在烈火中百炼成钢。"
 oe_w5.17.a: "集结忠君私兵铁血荡平敌对派系"
 oe_w5.17.b: "借助伦敦商团贷款赎买议会停火协定"
 oe_w5.18.title: "博斯沃思定鼎与都铎星室法庭"
 oe_w5.18.desc: "红白玫瑰联姻合流终结了持续一代人的内战梦魇。新朝强化王室星室法庭以取缔诸侯私兵、整顿内库岁入并重用地方治安官，为英格兰开启稳固繁荣的都铎盛世。"
 oe_w5.18.a: "强化星室法庭司法权威并解散诸侯私兵"
 oe_w5.18.b: "大赦旧贵并颁授毛纺商团特许状共庆和平"
 oe_w5.19.title: "至尊法案与英格兰宗教改革"
 oe_w5.19.desc: "议会通过至尊法案宣布君主为英格兰教会最高领袖，断绝向罗马教廷缴纳年贡与司法上诉。查收并出售庞大修道院田产可为海防炮台与王家舰队筹集巨资，却也难免触怒守旧教区民众。"
 oe_w5.19.a: "颁行至尊法案并将旧教产转化为王室海防财源"
 oe_w5.19.b: "保留温和教会自治以维系乡野教区安宁"
 oe_w5.20.title: "伊丽莎白海犬与无敌舰队大捷"
 oe_w5.20.desc: "自普利茅斯至多佛尔的海岸烽火次第燃起，遮天蔽日的敌国大舰队驶入英吉利海峡。英格兰低舷快船、远程长管火炮与格拉沃利讷午夜火攻联手击溃劲敌，自此开启岛国逐鹿大洋的辉煌纪元。"
 oe_w5.20.a: "嘉奖海犬船长并大造新式低舷远程炮舰"
 oe_w5.20.b: "趁胜扩建海防船坞并嘉惠伦敦市民行会"
 oe_w5.21.title: "1600年英属东印度公司特许状"
 oe_w5.21.desc: "世纪末日之际，伦敦巨商联名奏请王室颁授好望角以东远洋贸易专营特许状。以武装股份船队直航印度、波斯与南洋，必将打破伊比利亚与尼德兰的东方商路垄断。"
 oe_w5.21.a: "颁授东印度公司皇家特许状并支援海外商馆"
 oe_w5.21.b: "向各港商团开放自由远航而不授独家专营"
 oe_w5.22.title: "权利请愿书与英格兰内战风云"
 oe_w5.22.desc: "强征王室公债、民宅驻兵与船税纷争令王权与威斯敏斯特议会彻底决裂。下议院呈递权利请愿书，骑士党与圆颅党剑拔弩张，王国正站在宪政与内战的历史十字路口。"
 oe_w5.22.a: "签署权利请愿书，确立议会同意征税之宪制"
 oe_w5.22.b: "举起王室战旗捍卫古老君权与骑士忠义"
 oe_w5.23.title: "克伦威尔新模范军与航海条例"
 oe_w5.23.desc: "在内战烽火中锤炼而成、唯才是举的新模范军威震英伦，议会更趁势颁布严厉的航海条例，规定殖民地货物必须由本国船只承运。此举直击荷兰海运命脉，也铸就英伦崭新海陆体制。"
 oe_w5.23.a: "保留职业新模范军并严行大西洋航海条例"
 oe_w5.23.b: "及早裁撤常备军团以减轻各郡重税负担"
 oe_w5.24.title: "1689年光荣革命与权利法案"
 oe_w5.24.desc: "未曾重演流血内战，英格兰议会便顺利颁行权利法案，明文确立自由选举、议会节制常备军与税权以及法治保障。欧陆诸强惊异地发现，君主立宪政体在筹措军费与结盟抗衡方面竟远胜绝对王权。"
 oe_w5.24.a: "将权利法案铸为君主立宪永固基石"
 oe_w5.24.b: "为欧陆大战保留更宽泛的王室外交决断权"
 oe_w5.25.title: "1694年英格兰银行创立"
 oe_w5.25.desc: "海峡大战正酣之际，伦敦认购者短短十二日便筹足百万英镑巨款，在针线街正式创立英格兰银行。依托议会税收背书的永续公债体系，开启了令欧陆对手望尘莫及的近代金融革命。"
 oe_w5.25.a: "确立议会背书的国家公债与银行券制度"
 oe_w5.25.b: "严控银行信用扩张，坚持足额金银准备"
 oe_w5.26.title: "1707年大不列颠联合法案"
 oe_w5.26.desc: "威斯敏斯特与爱丁堡代表共同拟定联合条约，将英格兰金融与海外殖民市场同苏格兰精兵、港口与启蒙学府融于同一议会与米字旗下。大不列颠联合王国自此昂然跻身头号海洋超级强国。"
 oe_w5.26.a: "批准联合法案，全面贯通大不列颠统一市场"
 oe_w5.26.b: "颁授丰厚关税回扣以安抚北方诸郡民心"
 oe_w5.27.title: "南海泡沫与沃波尔首任首相内阁"
 oe_w5.27.desc: "南海公司股价狂飙突坠，交易巷哀鸿遍野、朝野震动。罗伯特·沃波尔临危受命，以严明偿债基金与稳健财政挽狂澜于既倒，由此开创不列颠近代责任内阁与首相制度先河。"
 oe_w5.27.a: "委任沃波尔内阁整顿偿债基金并力主休养生息"
 oe_w5.27.b: "动用国库储备紧急纾困受损伦敦商号"
 oe_w5.28.title: "1759奇迹之年：七年战争全球大捷"
 oe_w5.28.desc: "一年之内魁北克、基伯龙湾、明登与孟加拉捷报接踵而至，大不列颠全境教堂钟声齐鸣。以金援欧陆盟友牵制强敌、以皇家海军横扫两半球，不列颠一举奠定日不落海上霸权。"
 oe_w5.28.a: "乘胜巩固自圣劳伦斯河至孟加拉的全球制海权"
 oe_w5.28.b: "趁胜整理殖民地政制并提前偿还战时国债"
 oe_w5.29.title: "运河时代与棉纺工业革命热潮"
 oe_w5.29.desc: "新凿的布里奇沃特运河网将廉价兰开夏煤炭运往焦炭炼铁炉、珍妮纺纱机与瓦特改良蒸汽机工场。大不列颠的近代工业产能正以史无前例的速度甩开全球群雄。"
 oe_w5.29.a: "大力扶持运河公司、炼铁工场与发明专利法"
 oe_w5.29.b: "对新兴工场征课重税以救济失地乡野织工"
 oe_w5.30.title: "废奴法案之争与不列颠治世黎明"
 oe_w5.30.desc: "历经威尔伯福斯与各地废奴社团数十载奔走请愿，议会正式表决取缔跨大西洋奴隶贸易，并拟遣皇家海军巡航拦截贩奴船，将不列颠全球海权与近代人道法理融为一体。"
 oe_w5.30.a: "通过废奴法案并派遣皇家海军巡弋大西洋"
 oe_w5.30.b: "采行渐进补偿方案以缓和西印度种植园主震荡"
 oe_w5.31.title: "卡斯蒂利亚美斯塔公会与圣兄弟会"
 oe_w5.31.desc: "数以百万计的美利奴羊群沿御道穿行卡斯蒂利亚高原，产出令弗兰德斯与意大利织坊趋之若鹜的上等羊毛。若将美斯塔牧羊特权与城镇圣兄弟会护路治安结合，必将令商税丰沛、道不拾遗。"
 oe_w5.31.a: "护卫美斯塔牧道并敕授圣兄弟会肃清官道"
 oe_w5.31.b: "偏护乡野耕地农庄而节制游牧羊群越界"
 oe_w5.32.title: "格拉纳达终章：收复失地功成"
 oe_w5.32.desc: "随着王家重炮攻克群山要塞、阿尔罕布拉宫城钥献呈御前，绵延数个世纪的伊比利亚收复失地终告功成。百战劲旅、法学家与远洋舵手随即越过赫拉克勒斯之柱，放眼地中海与未知西海。"
 oe_w5.32.a: "庆贺格拉纳达功成并犒赏百战征西将士"
 oe_w5.32.b: "恪守宽厚降约以留住安达卢西亚农商巧匠"
 oe_w5.33.title: "伊比利亚双王共治协约"
 oe_w5.33.desc: "无论借双王联姻抑或共治枢密院，卡斯蒂利亚的陆军财力与阿拉贡的地中海船队皆展现出惊人互补。缔结兼顾各王国古老特许法的伊比利亚协约，可令伊比利亚诸邦在欧陆纵横捭阖时倍增分量。"
 oe_w5.33.a: "统筹双王枢密院并尊重各地传统特许法"
 oe_w5.33.b: "强推统一行政与税制以加速半岛集权"
 oe_w5.34.title: "塞维利亚西印度通商院"
 oe_w5.34.desc: "为统筹日益勃兴的跨大西洋航贸，王室在瓜达尔基维尔河畔创设西印度通商院。首席领航官执掌机密皇家总海图、考核远洋舵手并逐一稽核驶往新世界的每艘货船。"
 oe_w5.34.a: "厚资兴建塞维利亚领航学堂与皇家贸易署"
 oe_w5.34.b: "准许地中海与坎塔布里亚诸港共分远洋商利"
 oe_w5.35.title: "萨拉曼卡学派与近代经济法理"
 oe_w5.35.desc: "萨拉曼卡大学讲堂之上，维多利亚与阿斯皮尔库埃塔等硕儒开创近代国际公法、探讨土著权益，并率先洞悉美洲白银暴涨推高全欧物价的货币数量规律。尊崇该学派将为帝国提供最深邃的法政与理财智慧。"
 oe_w5.35.a: "尊崇萨拉曼卡学派并采纳稳健货币理财建言"
 oe_w5.35.b: "将大学讲学限于传统神学而免涉宫廷理财"
 oe_w5.36.title: "波托西与萨卡特卡斯白银船队"
 oe_w5.36.desc: "秘鲁波托西与新西班牙萨卡特卡斯的银矿借助汞齐提炼法产出滚滚白银。每年两度跨洋而来的武装银船令王室金库充盈无比，但商界亦忧心过量白银将推升国内物价通胀。"
 oe_w5.36.a: "扩大皇家五一银船编队以充实帝国军资"
 oe_w5.36.b: "将多余白银转投本土织坊并清偿外债以抑通胀"
 oe_w5.37.title: "西班牙帝国大方阵军制改革"
 oe_w5.37.desc: "总结意大利战争经验的宿将将长矛林立的巨型方阵与两翼轮番齐射的火绳枪手编成三千人常备兵团。这支号称帝国大方阵的钢铁劲旅迅速令全欧劲敌闻风丧胆。"
 oe_w5.37.a: "全军推行帝国大方阵常备军制与火枪操典"
 oe_w5.37.b: "优先扩编轻捷边防骑兵与海岸守备民团"
 oe_w5.38.title: "勒班陀神圣同盟海战大捷"
 oe_w5.38.desc: "帕特雷湾海面硝烟蔽日，西班牙与威尼斯神圣同盟战舰同地中海强敌展开世纪决战。威尼斯重炮大桨帆船撕开阵型、西班牙大方阵健儿奋勇跳帮，大捷捷报令马德里至那不勒斯教堂钟声震天。"
 oe_w5.38.a: "乘胜巩固地中海舰队霸权并厚赏勒班陀功臣"
 oe_w5.38.b: "见好就收，将海军重资转向大西洋远洋护航舰"
 oe_w5.39.title: "无敌舰队北海风暴之劫"
 oe_w5.39.desc: "弗兰德斯外海火船突袭与猛烈北大西洋飓风重创远征大舰队，无数巨舰折戟苏格兰与爱尔兰礁石。然而比斯开与哈瓦那船厂并未气馁，誓以惨痛教训打造更迅捷稳固的新一代护航盖伦舰。"
 oe_w5.39.a: "痛定思痛，在比斯开船厂重造低舷护航新舰队"
 oe_w5.39.b: "节缩造舰开支，转为加固加勒比海防要塞"
 oe_w5.40.title: "经世派疾呼与卡斯蒂利亚人口危机"
 oe_w5.40.desc: "瘟疫、海外移民、沉重消费税与驱逐勤勉农工令瓦伦西亚与卡斯蒂利亚大片沃野荒芜。忧国忧民的经世改革派纷纷上书马德里，痛陈唯有整顿币制、减税护农、扶持本土手工业方能挽回颓势。"
 oe_w5.40.a: "采纳经世派建言，整顿币制并扶持本土工农"
 oe_w5.40.b: "坚持严苛正统教令并加铸铜币应急充库"
 oe_w5.41.title: "奥利瓦雷斯兵役同盟与地方反弹"
 oe_w5.41.desc: "卡斯蒂利亚独力扛起帝国百年军费已筋疲力尽。首席大臣奥利瓦雷斯倡议推行兵役同盟，令阿拉贡、加泰罗尼亚、那不勒斯与诸邦按额共摊常备兵源，然而各地议会视之为践踏古老特权的强权之举。"
 oe_w5.41.a: "强推兵役同盟统筹各邦常备军额"
 oe_w5.41.b: "尊重各省议会特权改行协商认捐军费"
 oe_w5.42.title: "威斯特伐利亚和约与帝国收缩"
 oe_w5.42.desc: "历经弗兰德斯、德意志与比利牛斯漫长苦战，明斯特和会为西班牙带来体面停战之机。务实收缩战线、止住北方无底洞般的军费流失，方能令帝国休养生息并稳守跨洋命脉。"
 oe_w5.42.a: "签署明斯特和约，休兵养民并重整大西洋防务"
 oe_w5.42.b: "拒绝妥协收缩，誓死维系北方百年旧疆荣光"
 oe_w5.43.title: "王位继承战争与波旁新基本法"
 oe_w5.43.desc: "席卷全欧的西班牙王位继承战争尘埃落定，入主马德里的新王朝颁布新基本法敕令，一举扫除中世纪林立的省界关税与割裂司法，将西班牙锻造为高效的近代中央集权王国。"
 oe_w5.43.a: "颁行新基本法，实现全国政令与财税大一统"
 oe_w5.43.b: "保留温和地方自治契约以加快战后伤口愈合"
 oe_w5.44.title: "卡洛斯三世启蒙新政与自由贸易令"
 oe_w5.44.desc: "启蒙派大臣在马德里厉行革新：兴办爱国经济学会、扩建费罗尔与卡塔赫纳近代海军船坞，并废止陈旧单港垄断，向全国十三座港口开放美洲自由通商，迎来波旁中兴黄金时代。"
 oe_w5.44.a: "颁行跨洋自由通商令并全面推行启蒙新政"
 oe_w5.44.b: "维持加的斯商团旧特权以保稳定关税进项"
 oe_w5.45.title: "阿勒祖巴洛特大捷与阿维斯立国"
 oe_w5.45.desc: "在里斯本以北山脊之上，兵力悬殊的葡萄牙步卒与盟军弓手凭借壕沟拒马结成钢铁方阵，以少胜多击溃强敌大军。此战确立阿维斯王朝正统，永固葡萄牙向海图强的独立国祚。"
 oe_w5.45.a: "拥立阿维斯王朝并广固王国海陆独立根基"
 oe_w5.45.b: "颁授贸易特许状厚赏倾资保国的里斯本市民"
 oe_w5.46.title: "航海家恩里克王子与萨格里什海校"
 oe_w5.46.desc: "阿尔加维海风呼啸的岬角之上，王室天文学家、制图师与无畏船长潜心改良三角帆卡拉维尔快船与星盘海图。越过博哈多尔角，马德拉蔗糖、西非砂金与南方未知大洋正徐徐展开。"
 oe_w5.46.a: "重金资助萨格里什航海事业与卡拉维尔远航"
 oe_w5.46.b: "优先增兵北非休达与摩洛哥沿海据点"
 oe_w5.47.title: "好望角惊涛与达伽马印度直航"
 oe_w5.47.desc: "迪亚士率先绕过风暴角，达伽马随即扬帆抵达卡利卡特胡椒商埠。贯通里斯本直抵印度马拉巴尔的远洋大道，一举绕开地中海层层税卡，将东方香料巨利直接捧入葡萄牙怀中。"
 oe_w5.47.a: "自特茹河口正式启航常年印度远洋商船队"
 oe_w5.47.b: "向里斯本与安特卫普银行家出让航运特许速收现银"
 oe_w5.48.title: "托尔德西里亚斯条约：子午线分海"
 oe_w5.48.desc: "老练的葡萄牙外交官力争将教宗划定的大洋分界线向西推移三百七十里格，不仅稳守非洲与印度洋航权，更将富饶的巴西海岸收入囊中，堪称文艺复兴外交神来之笔。"
 oe_w5.48.a: "签署托尔德西里亚斯条约并速遣船队经略巴西"
 oe_w5.48.b: "借条约善意全面拓展欧陆诸国免税商约"
 oe_w5.49.title: "阿尔布克尔克：果阿与马六甲海权链"
 oe_w5.49.desc: "印度总督阿尔布克尔克提出惊世大战略：无需深陷亚洲广袤内陆，只需扼守霍尔木兹、果阿与马六甲三大咽喉海港，便可以坚固石堡、航海通行证与重炮舰队号令整个印度洋。"
 oe_w5.49.a: "筑就果阿、霍尔木兹与马六甲三大咽喉海防要塞"
 oe_w5.49.b: "以和平商馆互市替代耗资巨大的跨洋攻城战"
 oe_w5.50.title: "里斯本印度之家与香料专卖盛世"
 oe_w5.50.desc: "满载胡椒、肉桂、肉豆蔻与明朝青花瓷的巨型克拉克商船云集里斯本宫殿广场。王室经由印度之家统管香料拍卖，滚滚财源铸就曼努埃尔盛世，令里斯本跃居大西洋第一巨港。"
 oe_w5.50.a: "强化里斯本印度之家王室香料专卖制度"
 oe_w5.50.b: "向本国与低地商团开放里斯本码头自由竞拍"
 oe_w5.51.title: "塞巴斯蒂昂王与阿卡塞尔危局"
 oe_w5.51.desc: "鲁莽的北非十字军远征在阿卡塞尔惨败，葡萄牙大批勋贵骑士折戟沙场，里斯本骤陷王位继承与财政双重危机。沉稳老练的摄政大臣必须迅速稳住军心与海防要地。"
 oe_w5.51.a: "组建摄政枢密院整顿防务并赎回被俘将领"
 oe_w5.51.b: "紧缩陆疆开支，倾力保住印度洋与巴西船队"
 oe_w5.52.title: "托马尔议会与伊比利亚共主自治之争"
 oe_w5.52.desc: "面对来自马德里的伊比利亚共主压力，葡萄牙三级会议齐聚托马尔，力争铁律宪章：凡葡萄牙官职、币制、舰队及巴西与亚洲属地皆须由葡人自主掌管，绝不容外臣染指。"
 oe_w5.52.a: "坚守托马尔自治宪章，力保本国官僚与商队独立"
 oe_w5.52.b: "与伊比利亚邻邦联合护航以共御北方私掠海盗"
 oe_w5.53.title: "1640年光复大起义与布拉干萨王朝"
 oe_w5.53.desc: "十二月朔日清晨，四十位爱国志士奇袭里斯本王宫，高举布拉干萨王旗宣告葡萄牙光复独立！筑城匠师火速加固埃尔瓦斯边塞，巴西糖运舰队亦齐心归附新朝。"
 oe_w5.53.a: "拥戴布拉干萨新朝并筑牢陆疆棱堡捍卫独立"
 oe_w5.53.b: "火速派遣特使缔结大西洋海权盟约拱卫海路"
 oe_w5.54.title: "1703年梅休因波特酒与呢绒商约"
 oe_w5.54.desc: "英格兰特使递上梅休因商约：英产毛呢免税输入葡萄牙，杜罗河谷波特酒则享伦敦优惠低税，皇家海军更为巴西运金船队护航。杜罗酒庄由此盆满钵满，唯本土纺织坊备感冲击。"
 oe_w5.54.a: "签署梅休因条约，大兴杜罗酒贸并获海权护航"
 oe_w5.54.b: "维持适度保护关税以扶持本土毛纺工场自立"
 oe_w5.55.title: "1755年万圣节里斯本大地震"
 oe_w5.55.desc: "万圣节清晨，剧烈强震、特茹河滔天海啸与连天大火将里斯本下城、王宫与珍贵档案化为一片焦土。全欧哲人为之震动，首席国务大臣庞巴尔却冷静下令：安葬死者，救治生者，绝不屈服于天灾！"
 oe_w5.55.a: "雷厉风行调兵救灾、平抑粮价并抢通港口"
 oe_w5.55.b: "紧急征调巴西殖民地特别税款填补震灾亏空"
 oe_w5.56.title: "庞巴尔侯爵与启蒙新城重建"
 oe_w5.56.desc: "在废墟之上，庞巴尔侯爵率先推行全欧首创的抗震木构框架与宽阔整齐的新古典下城街道，并设立特许商贸公司、革新科英布拉大学自然学科、大力削弱守旧贵族特权，铸就启蒙时代奇迹。"
 oe_w5.56.a: "全力推行庞巴尔抗震新城与科英布拉科学革新"
 oe_w5.56.b: "放缓激进集权步伐以缓和保守勋贵抵触"
 oe_w5.57.title: "鱼钩与鳕鱼之争及荷兰北海渔队"
 oe_w5.57.desc: "尽管乡野贵族鱼钩派与新兴城市鳕鱼派围绕伯爵权柄纷争不断，荷兰渔民却已在北海巨型渔船上率先掌握海上剖腌鲱鱼绝技。这项被称为立国母业的大渔业悄然筑起未来海洋霸权的基石。"
 oe_w5.57.a: "扶持鳕鱼市民城镇并大力扩编北海腌鲱鱼船队"
 oe_w5.57.b: "偏护鱼钩派乡野骑士以迅速平息伯国派系纷争"
 oe_w5.58.title: "勃艮第三级会议与大特许状"
 oe_w5.58.desc: "趁低地宫廷政局动荡之机，荷兰、泽兰与低地各省议会力争颁行大特许状：凡未经三级会议同意，君主不得擅征新税或轻启战端，且地方司法一律使用本国语审理，令低地市民宪政传统深入人心。"
 oe_w5.58.a: "捍卫大特许状，确立各省议会税权与自治法统"
 oe_w5.58.b: "适度配合公爵统一政令以换取低地商贸特惠"
 oe_w5.59.title: "破坏圣像风暴与八十年独立战争"
 oe_w5.59.desc: "苛捐杂税、宗教裁判与粮价飙升点燃席卷低地的破坏圣像风暴。面对南下弹压城镇自由的强悍大军，荷兰市民与治水匠师立誓宁肯掘开海堤放水御敌，也绝不交出城市特许状与信仰自由。"
 oe_w5.59.a: "决堤放水并武装市民民团誓死捍卫自由"
 oe_w5.59.b: "审慎斡旋缓兵之计以保全港口货栈免遭战火"
 oe_w5.60.title: "海上乞丐奇袭布里勒要港"
 oe_w5.60.desc: "四月朔日，被风暴逼出海峡的海上乞丐私掠舰队出奇不意攻占默兹河口重镇布里勒。数周之内，弗利辛恩、恩克赫伊森及荷兰、泽兰诸城纷纷倒戈响应，独立烽火顷刻燎原。"
 oe_w5.60.a: "正式收编海上乞丐为共和国新生海军核心"
 oe_w5.60.b: "将缴获敌船战利品悉数转投海堤守军粮饷"
 oe_w5.61.title: "乌得勒支同盟与尼德兰共和国诞生"
 oe_w5.61.desc: "北方七省代表庄严签署乌得勒支同盟宪约，誓言对外战和一体、对内严禁因个人信仰迫害居民。一座以市民议会、法治宽容与海洋贸易立国的崭新共和国自此昂首屹立于欧陆。"
 oe_w5.61.a: "正式缔造七省联合共和国与信仰宽容宪约"
 oe_w5.61.b: "战时将更高军政决断权集中于执政统帅麾下"
 oe_w5.62.title: "1602年联合东印度公司盛大启航"
 oe_w5.62.desc: "为终结各城船团在南洋自相竞价的内耗，国会合并六大商会将联合东印度公司铸为人类史上首家永续公开募股巨无霸，授其好望角以东筑堡、铸币、缔约与宣战之全权。"
 oe_w5.62.a: "全力支持联合东印度公司舰队进军亚洲香料群岛"
 oe_w5.62.b: "预留更多原始官股分红直接充实共和国国库"
 oe_w5.63.title: "阿姆斯特丹汇兑银行与证券交易所"
 oe_w5.63.desc: "面对涌入港口数以百计成色杂乱的各国硬币，阿姆斯特丹创办市政汇兑银行并落成宏伟证券交易所。足值银行盾与高效账面结算令阿姆斯特丹一举加冕全球金融之都。"
 oe_w5.63.a: "设立汇兑银行金库并开放公开证券交易大厅"
 oe_w5.63.b: "严禁期货证券投机，将交易所限于大宗现货清算"
 oe_w5.64.title: "赞河船厂与弗莱特商船霸权"
 oe_w5.64.desc: "阿姆斯特丹以北赞河两岸，成排风车锯木厂正以惊人效率将波罗的海松木组装成标准化梨形弗莱特货船。凭借减半的水手定额与低廉造价，荷兰商船队迅速垄断从但泽至里斯本的欧洲海运。"
 oe_w5.64.a: "扩建赞河风车船厂大造弗莱特远洋商队"
 oe_w5.64.b: "为商船加装重炮甲板以严防海盗与敌国私掠"
 oe_w5.65.title: "多德雷赫特宗教会议与国译圣经"
 oe_w5.65.desc: "围绕预定论与省权归属的激烈神学争端令荷兰市政执政与正统教会、执政军队剑拔弩张。在多德雷赫特召开国际宗教会议既裁定教义秩序，更催生统一尼德兰标准语的国会官译圣经。"
 oe_w5.65.a: "核准多德雷赫特决议并资助国会官译圣经"
 oe_w5.65.b: "护持抗辩派良知宽容以安抚荷兰商业都会"
 oe_w5.66.title: "1637年哈勒姆郁金香狂热与泡沫"
 oe_w5.66.desc: "哈勒姆与阿尔克马尔酒馆中，一株罕见的奥古斯都条纹郁金香球茎期货竟炒至堪比阿姆斯特丹运河豪宅的天价。1637年二月买盘骤然蒸发，大批亏空的投机客涌向市政厅要求裁决。"
 oe_w5.66.a: "由市政法庭将失控期货折算为温和解约费稳住商界"
 oe_w5.66.b: "严厉判令全额履约以儆效尤、震慑投机歪风"
 oe_w5.67.title: "1648年明斯特和约：独立加冕"
 oe_w5.67.desc: "历经八十年浴血奋战，明斯特和约正式承认尼德兰共和国完全主权独立，确认其在亚洲与美洲的既得据点，并维持斯海尔德河封锁以确保阿姆斯特丹无与伦比的转口贸易霸权。"
 oe_w5.67.a: "盛大庆贺独立加冕并锁死斯海尔德河商业优势"
 oe_w5.67.b: "将和平红利悉数投入北荷兰大型围海造田工程"
 oe_w5.68.title: "英荷海战风云与海神德鲁伊特"
 oe_w5.68.desc: "两大海洋商业帝国在北海狭路相逢，炮火震天。在特龙普与海神德鲁伊特率领下，纪律严明的荷兰舰队炉火纯青地运用战列线战术，甚至奇袭敌军腹地河口锚地，威震四海。"
 oe_w5.68.a: "倾力建造重型战列舰交由德鲁伊特统领争雄北海"
 oe_w5.68.b: "侧重轻捷护航舰以力保波罗的海粮道畅通无阻"
 oe_w5.69.title: "1672灾难之年与荷兰水线反击"
 oe_w5.69.desc: "陆上强敌大军压境、海上劲敌舰队封锁，1672年成为尼德兰生死存亡的灾难之年。危急关头，毅然开启旧荷兰防洪水道将阿姆斯特丹化为孤岛天堑，生生阻断强敌铁蹄并赢得绝地反击良机！"
 oe_w5.69.a: "果断开启荷兰防洪水线，举国动员绝地反击"
 oe_w5.69.b: "动用阿姆斯特丹银库巨资组建欧陆反霸同盟"
 oe_w5.70.title: "爱国者运动与巴达维亚立宪黎明"
 oe_w5.70.desc: "受大西洋革命与启蒙报刊感召，由市民组成的爱国者志愿民团向僵化寡头政治与世袭官爵发起挑战，呼吁缔造各省平等代表、保障近代公民权利的统一巴达维亚共和国。"
 oe_w5.70.a: "顺应爱国者立宪呼声，建立近代统一共和新制"
 oe_w5.70.b: "坚守古老七省联邦传统与奥兰治执政体制"
