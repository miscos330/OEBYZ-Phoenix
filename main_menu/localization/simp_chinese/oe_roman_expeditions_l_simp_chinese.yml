l_simp_chinese:
 oe_exp_survey.1.t:0 "丈量尼罗河的馈赠"
 oe_exp_survey.1.d:0 "田界随着洪水移动，旧册却仍记着祖辈时代的田亩。总计官署已备好测绳、界桩与纸册，命丈量队从开罗出发，逐段核验河谷的耕地、灌渠和赋役。村社长老将与官吏一道作证：帝国需要一部能用于治理的田籍，而非另一卷束之高阁的文书。"
 oe_exp_survey.1.a:0 "让测绳与账册一同上路。"
 oe_exp_survey.2.t:0 "两份田契"
 oe_exp_survey.2.d:0 "比勒拜斯的两户人家各自拿出一份盖有旧印的田契，都声称同一片田地属于自己。村中老人记得河道改流，却说不清旧界桩埋在何处。丈量官建议延请熟悉地方文书的抄写员，或留下一队人逐一听取证言。"
 oe_exp_survey.2.a:0 "聘请熟悉旧契的抄写员。"
 oe_exp_survey.2.a.tt:0 "账册完整度 +15；本站停留60天。"
 oe_exp_survey.2.b:0 "逐户核对，不催促证人。"
 oe_exp_survey.2.b.tt:0 "账册完整度 +5；本站停留90天。"
 oe_exp_survey.3.t:0 "被洪水洗去的界桩"
 oe_exp_survey.3.d:0 "艾斯尤特近郊的一段堤岸刚刚退水。田亩尚在，刻有名字的界桩却已陷入淤泥，数页誊本也被浸湿。雇来的船工可以帮助找回界桩；若节省这笔支出，队伍便需依据邻田重新测算。损失尚小，谨慎处置足以弥补。"
 oe_exp_survey.3.a:0 "雇船工找回界桩。"
 oe_exp_survey.3.a.tt:0 "账册完整度 +10；本站停留60天。"
 oe_exp_survey.3.b:0 "按邻田重算，容许少量缺页。"
 oe_exp_survey.3.b.tt:0 "账册完整度 -5；本站停留90天。"
 oe_exp_survey.4.t:0 "村社与庄园的账册"
 oe_exp_survey.4.d:0 "库斯附近的庄园管事把一条公共灌渠记作私人财产，村社则坚持渠水自古由数村共用。争执并未演变为冲突，只是双方都不愿在新册上落印。领队可以援引此前查得的文书裁定，也可以召集各村代表慢慢厘清分水办法。"
 oe_exp_survey.4.a:0 "依照核实的旧章裁定。"
 oe_exp_survey.4.a.tt:0 "账册完整度 +10；本站停留60天。"
 oe_exp_survey.4.b:0 "召集各村，重新约定分水。"
 oe_exp_survey.4.b.tt:0 "账册完整度 +5；本站停留90天。"
 oe_exp_survey.5.t:0 "封存新田籍"
 oe_exp_survey.5.d:0 "丈量队抵达锡尼，河谷各段的文书已汇在同一张长案上。领队要求将遗漏的水渠、重复的户名和模糊的田界一并核清，再把整套册籍送回开罗。多留些时日总好过将错漏写进帝国的永久档案。"
 oe_exp_survey.5.a:0 "核清最后一页，再启程返还。"
 oe_exp_survey.5.a.tt:0 "账册完整度补至100；完整度不足80时停留120天，否则停留60天。"
 oe_exp_survey.6.t:0 "田籍归于帝国"
 oe_exp_survey.6.d:0 "新田籍已送抵开罗。赋役官终于能够按同一套界址调配渠水、核算耕地，让旧日的争执不再年年拖延春耕。这份成果没有凭空添出一亩土地，却让尼罗河的馈赠得到更有条理的经营。所有符合条件的埃及农业地点已获得一层“埃及粮食增产”。"
 oe_exp_survey.6.a:0 "将新册分送各地官署。"
 oe_exp_survey.7.t:0 "未竟的丈量"
 oe_exp_survey.7.d:0 "丈量队未能完成这一轮工作。已抄成的文书由地方官署收存，余下的田界只好留待下一次核查。朝廷决定先整顿人员，再重新派出队伍；此次不另行追责。"
 oe_exp_survey.7.a:0 "保存文书，两年后再议。"
 oe_exp_nile.1.t:0 "顺流而下"
 oe_exp_nile.1.d:0 "来自三角洲的旧抄本记述了被河泥吞没的礼拜堂、迁徙的修士，以及一口曾由异乡人护送的古柜。朝廷拨给一支小队船只、口粮与护卫，准其从开罗出发核查这些传闻。领队受命带回能经得起检验的证据，而非迎合宫廷的故事。"
 oe_exp_nile.1.a:0 "循着旧文书前行。"
 oe_exp_nile.2.t:0 "抄本的另一半"
 oe_exp_nile.2.d:0 "比勒拜斯的一位书商认出了抄本上的记号。他愿出售几页与之相合的残卷，但修士提醒领队，其中有些注释很可能是近人添写。可以付费取得残卷再作比勘，也可以留在教堂档案室，耐心寻找更可靠的旁证。"
 oe_exp_nile.2.a:0 "购入残卷，逐字比勘。"
 oe_exp_nile.2.a.tt:0 "线索可信度 +20；停留45天。"
 oe_exp_nile.2.b:0 "向档案室借阅旧卷。"
 oe_exp_nile.2.b.tt:0 "线索可信度 +10；停留90天。"
 oe_exp_nile.3.t:0 "芦苇间的旧河道"
 oe_exp_nile.3.d:0 "达米埃塔的渔人说，旧图上的河道如今已被芦苇和淤沙掩住。一名熟悉水势的船夫愿意领路，并帮队伍补充口粮。沿堤岸绕行也能抵达目的地，只是要多走一段路。"
 oe_exp_nile.3.a:0 "请船夫引路并补充口粮。"
 oe_exp_nile.3.a.tt:0 "补给 +15；停留30天。"
 oe_exp_nile.3.b:0 "沿堤岸绕行。"
 oe_exp_nile.3.b.tt:0 "补给 -10；停留75天。"
 oe_exp_nile.4.t:0 "泥沙之下的礼拜堂"
 oe_exp_nile.4.d:0 "队伍在法库斯附近找到半埋的石门。门内没有金碧辉煌的宝库，只有潮湿的壁龛、残破的木箱和数块刻着名字的石片。雇来石匠稳固拱顶可以更仔细地清理；凭现有人手也能继续，只需让疲惫的护卫轮流休息。"
 oe_exp_nile.4.a:0 "雇石匠支护，仔细清理。"
 oe_exp_nile.4.a.tt:0 "线索可信度 +30；停留90天。"
 oe_exp_nile.4.b:0 "轮换护卫，继续查找。"
 oe_exp_nile.4.b.tt:0 "线索可信度 +20，远征护卫 -3；停留90天。"
 oe_exp_nile.5.t:0 "封存的古柜"
 oe_exp_nile.5.d:0 "拉希德的修士将队伍带到一处偏僻库室。旧账记载，一批从内陆转来的器物曾寄存在这里；其中一口包覆残金的古柜，与抄本中的描述颇为相似。领队可以留下核验封记、年代与传承，也可以只抄录所见，将无法证明的传闻留在当地。"
 oe_exp_nile.5.a:0 "核验封记，将可信之物护送回去。"
 oe_exp_nile.5.a.tt:0 "按线索可信度，有5%／15%／25%的机会找到约柜；安全返程后才获得圣物与“发现约柜”修正。停留90天，补给不足25时需150天。"
 oe_exp_nile.5.b:0 "只带回抄录与见闻。"
 oe_exp_nile.5.b.tt:0 "此次不寻找约柜；停留30天后返程。"
 oe_exp_nile.6.t:0 "发现约柜"
 oe_exp_nile.6.d:0 "远征队安全归来，带回一口古老的镀金木柜与一整套相互印证的文书。经过长久审阅，教会愿为其身份作证，朝廷遂以最庄重的仪式迎接这件圣物。约柜已安置于首都；消息传入各地教堂，人们在纷乱的世道中重新寻得了一份共同的确信。"
 oe_exp_nile.6.a:0 "愿这份信念护佑罗马。"
 oe_exp_nile.6.a.tt:0 "获得唯一圣物“约柜”；永久获得“发现约柜”：正统信仰容忍度 +1。威望 +3。"
 oe_exp_nile.7.t:0 "三角洲的见闻"
 oe_exp_nile.7.d:0 "归来的队伍带回旧卷的抄本、河道记录与若干器物素描，却没有找到足以认定为约柜的圣物。宫廷学者仍认真接收了这些材料。谨慎的求证自有其价值，下一支远征也将知道该从哪里继续寻找。"
 oe_exp_nile.7.a:0 "将这些见闻保存下来。"
 oe_exp_nile.7.a.tt:0 "威望 +1。"
 oe_exp_nile.8.t:0 "中止的寻访"
 oe_exp_nile.8.d:0 "这次寻访未能走完既定行程。沿途收集的零散消息已送回官署，未获证实的发现则暂不宣扬。朝廷没有追加惩处，只命后来者记住此次旅程的教训。"
 oe_exp_nile.8.a:0 "等待下一次合适的时机。"
 oe_exp_sahara.1.t:0 "沙海彼岸"
 oe_exp_sahara.1.d:0 "商队在的黎波里装好水囊与货包。向导指着远处的沙地，说道路并非画在纸上，而是记在水井、星辰与几代商人的口述中。帝国派来的商人将随队南下，以货物和信用换取黄金，再循绿洲之路返回海岸。"
 oe_exp_sahara.1.a:0 "让向导走在队伍前面。"
 oe_exp_sahara.2.t:0 "盖达米斯的水井"
 oe_exp_sahara.2.d:0 "盖达米斯的井主欢迎远来的商队，但最方便的取水处也最为繁忙。支付一笔小费便能尽快装满水囊；若依照当地次序等待，商人们也能趁机修补驮具、交换道路消息。"
 oe_exp_sahara.2.a:0 "支付取水与装运费用。"
 oe_exp_sahara.2.a.tt:0 "饮水 +25；停留30天。"
 oe_exp_sahara.2.b:0 "按当地次序等候。"
 oe_exp_sahara.2.b.tt:0 "饮水 +10；停留75天。"
 oe_exp_sahara.3.t:0 "加特的向导"
 oe_exp_sahara.3.d:0 "前方几处小水井今年出水不丰。加特的向导愿为商队带路，避开最难走的一段沙地。领队也可以依据已有路标谨慎前行，只是队伍需要更严密地安排护卫和饮水。"
 oe_exp_sahara.3.a:0 "雇请当地向导。"
 oe_exp_sahara.3.a.tt:0 "远征护卫 +5，最多40；停留30天。"
 oe_exp_sahara.3.b:0 "由领队安排谨慎行军。"
 oe_exp_sahara.3.b.tt:0 "军事能力至少50：停留30天；否则护卫 -3、饮水 -5，停留75天。"
 oe_exp_sahara.4.t:0 "阿加德兹的担保人"
 oe_exp_sahara.4.d:0 "阿加德兹的经纪人愿为远来的商队介绍南方买主。若支付担保费用，双方即可预先约定较好的价格；善于交涉的领队也可以凭货物清单和沿途积累的信用争取同样的待遇。谈不拢并不意味着交易失败，只会少赚一些。"
 oe_exp_sahara.4.a:0 "支付一笔担保费用。"
 oe_exp_sahara.4.a.tt:0 "取得优惠交易凭据；停留30天。"
 oe_exp_sahara.4.b:0 "凭信用与口才争取。"
 oe_exp_sahara.4.b.tt:0 "领队外交能力至少50时取得优惠交易凭据；停留60天。"
 oe_exp_sahara.5.t:0 "廷巴克图的秤盘"
 oe_exp_sahara.5.d:0 "商人们终于在廷巴克图展开货包。黄金在小小的秤盘上被反复称量，账房用双方认可的记号记下每笔交换。队伍的饮水和护卫若仍充足，就能载回更多货物；谨慎的领队也可以收下较轻的一批，尽快踏上归途。"
 oe_exp_sahara.5.a:0 "依照队伍状况装运黄金。"
 oe_exp_sahara.5.a.tt:0 "装载20单位黄金；饮水至少50且护卫至少30时为40单位，另有优惠凭据则为60单位。安全返程后交付君士坦丁波利斯市场。停留60天。"
 oe_exp_sahara.5.b:0 "轻装返回，保全队伍。"
 oe_exp_sahara.5.b.tt:0 "装载20单位黄金，饮水 +20；停留30天。"
 oe_exp_sahara.6.t:0 "归途上的散落货包"
 oe_exp_sahara.6.d:0 "一阵短促的沙暴惊动了驮兽，几只货包散落在加特以南。大队人马已经安全抵达避风处，只需决定是否雇人回去搜寻。若不耽搁，少量遗失的黄金便算作这条商路的代价。"
 oe_exp_sahara.6.a:0 "雇人寻回散落的货包。"
 oe_exp_sahara.6.a.tt:0 "保全全部黄金货物；停留45天。"
 oe_exp_sahara.6.b:0 "人已平安，不必为小损失折返。"
 oe_exp_sahara.6.b.tt:0 "黄金货物 -5；停留30天。"
 oe_exp_sahara.7.t:0 "黄金越过沙海"
 oe_exp_sahara.7.d:0 "商队的铃声再次响在的黎波里的城门外。沿途购得的黄金已经核验封装，转送君士坦丁波利斯市场：本次交付[ROOT.GetCountry.MakeScope.GetVariable('oe_exp_last_sahara_gold').GetValue|0]单位。比金属更难得的，还有一份记清水井、路程与交易规矩的行记。"
 oe_exp_sahara.7.a:0 "收存货单，善待归来的商旅。"
 oe_exp_sahara.7.a.tt:0 "黄金商品已加入君士坦丁波利斯市场；威望 +1。"
 oe_exp_sahara.8.t:0 "未能抵达的商队"
 oe_exp_sahara.8.d:0 "商队未能完成既定往返，预期的黄金也没有运抵海岸。朝廷没有追加罚款或追究地方官员，只将这次经历记入商路档案，留待下一次筹备时参考。"
 oe_exp_sahara.8.a:0 "记下教训，暂缓重启商路。"
 oe_egypt_land_survey:0 "埃及土地丈量"
 oe_egypt_land_survey_desc:0 "派遣官员核验尼罗河谷田籍。需要完全直接拥有埃及，并已完成“在埃及规划粮食增产”。出发花费1500金币及原版远征费用25政治影响力；成功后不可重复，失败后两年可重试。"
 oe_egypt_land_survey_outcome_overview:0 "成功返程：所有符合条件的埃及农业地点获得一层“埃及粮食增产”。途中额外支出较小，也可用时间代替金币。"
 oe_lower_nile_exploration:0 "探索尼罗河下游"
 oe_lower_nile_exploration_desc:0 "从开罗出发，循三角洲的旧抄本寻找失落圣物。传统、文艺复兴和地理大发现时代可启动；此后已出发的队伍仍可完成。花费500金币及25政治影响力，每五年可启动一次，约柜被找到后不再开放。"
 oe_lower_nile_exploration_outcome_overview:0 "线索影响找到约柜的机会。安全带回约柜后，获得唯一圣物与永久国家修正“发现约柜”：正统信仰容忍度 +1。"
 oe_cross_the_sahara:0 "越过撒哈拉"
 oe_cross_the_sahara_desc:0 "从的黎波里派出商队，经绿洲前往廷巴克图交易黄金。需要直接拥有的黎波里。传统、文艺复兴和地理大发现时代可启动，之后已出发的队伍仍可完成。花费300金币及25政治影响力，每十年可启动一次。"
 oe_cross_the_sahara_outcome_overview:0 "根据队伍状态与交易结果装载20至60单位黄金，途中可能损失少量货物；成功返程后加入君士坦丁波利斯市场。"
 oe_exp_survey_progress:0 "已丈量的地区"
 oe_exp_survey_progress_desc:0 "已完成现场核查的代表地区，共五处。"
 oe_exp_ledger:0 "账册完整度"
 oe_exp_ledger_desc:0 "田界、水渠与户籍记录的完整程度；不足会延长最终复核。"
 oe_exp_provisions:0 "远征补给"
 oe_exp_provisions_desc:0 "队伍携带的补给；行进中每月减少1。"
 oe_exp_clues:0 "线索可信度"
 oe_exp_clues_desc:0 "低于60时找到约柜概率为5%；达到60时为15%，达到80时为25%。"
 oe_exp_guards:0 "远征护卫"
 oe_exp_guards_desc:0 "随队护卫的有效人数；不扣除国家人力或部队。"
 oe_exp_water:0 "商队饮水"
 oe_exp_water_desc:0 "商队储备的饮水；行进中每月减少1。"
 oe_exp_gold_cargo:0 "黄金货物"
 oe_exp_gold_cargo_desc:0 "仍随商队携带的黄金商品，安全返程后才进入君士坦丁波利斯市场。"
 oe_exp_elapsed:0 "远征历时"
 oe_exp_elapsed_desc:0 "不计等待玩家选择的月份。"
 oe_exp_early_ages_tt:0 "当前为传统、文艺复兴或地理大发现时代。"
 oe_exp_survey_reward_tt:0 "所有符合条件的直属埃及农业地点获得一层“埃及粮食增产”。"
 oe_exp_survey_retry:0 "重新筹备埃及丈量"
 oe_lower_nile_exploration_cooldown:0 "尼罗河寻访筹备"
 oe_cross_the_sahara_cooldown:0 "撒哈拉商队筹备"
 STATIC_MODIFIER_NAME_oe_discovery_of_the_ark:0 "发现约柜"
 STATIC_MODIFIER_DESC_oe_discovery_of_the_ark:0 "自尼罗河寻访中迎回的圣物，让帝国的正统信仰得到共同的寄托。"
 oe_ark_of_the_covenant:0 "约柜"
 oe_ark_of_the_covenant_desc:0 "由尼罗河远征队带回、经教会审验后奉为约柜的古老圣物。"

 oe_pacify_epirus: "平定伊庇鲁斯"
 oe_pacify_epirus_desc: "率领帝国使团与军队，经过塞萨洛尼基，依次迫使罗戈伊、阿尔塔与托莫卡斯特隆的守军屈服，将伊庇鲁斯收归皇帝直辖。\n\n只能发起一次，出发后即不再显示，失败也不能重试。启动花费10政治影响力。领队须为本国成年王冠或贵族阶层人物。\n\n地图路线：塞萨洛尼基—普雷韦扎（罗戈伊）—阿尔塔—帕尔加（托莫卡斯特隆）。"
 oe_pacify_epirus_outcome_overview: "成功后吞并伊庇鲁斯，阿尔塔获得30年“伊庇鲁斯行政中心”（本地邻近度+33）。安德洛尼卡三世亲自领队时，尼基弗鲁斯必定投降；成功结束时安三健康值-1。"
 oe_pacify_epirus_waypoint_thessaloniki: "远征抵达塞萨洛尼基，准备处理伊庇鲁斯的继承争端。"
 oe_pacify_epirus_waypoint_preveza: "远征进入普雷韦扎一带，兵临罗戈伊城堡。"
 oe_pacify_epirus_waypoint_arta: "远征抵达阿尔塔，伊庇鲁斯的旧都仍未开门。"
 oe_pacify_epirus_waypoint_parga: "远征转向帕尔加一带的海岸，围困托莫卡斯特隆。"
 oe_exp_epirus.1.t: "伊庇鲁斯继承危机"
 oe_exp_epirus.1.d: "约翰二世·奥尔西尼死后，伊庇鲁斯的权柄落到摄政安娜·巴列奥略手中，而年幼的尼基弗鲁斯二世继承了一个被派系与野心撕裂的名号。安娜并非与皇室毫无关系的地方贵妇：她同样出自巴列奥略家族，是米海尔八世的曾孙女，与安德洛尼卡三世同出帝室。\n\n然而，血缘并没有令西部的城堡自行敞开大门。地方豪族依恋旧有权势，奥尔西尼家的追随者将目光投向海峡彼岸，而帝国派来的官员也未能令所有人信服。如今，使者在塞萨洛尼基向远征领队呈上各方书信。阿尔塔的继承争端，必须由皇帝的权威作出裁决。"
 oe_exp_epirus.1.a: "以皇帝之名，恢复西部的秩序。"
 oe_exp_epirus.2.t: "围困罗戈伊"
 oe_exp_epirus.2.d: "罗戈伊的城墙立在卢罗斯河平原之上，守军隔着垛口注视着帝国的旗帜。城内有人坚信援军终会到来，也有人已在盘算，继续抵抗究竟能保住多少家产与性命。\n\n一位中间人带来消息：只要付出相当于伊庇鲁斯一年收入的代价，守军愿意放下武器。若不愿以金钱换取城门，我们便只能留下军队，等待两个月的围困发挥作用。"
 oe_exp_epirus.2.a: "通过谈判迫使守军放弃抵抗。"
 oe_exp_epirus.2.b: "开始围城。"
 oe_exp_epirus.2.c: "放弃围城，撤回远征。"
 oe_exp_epirus.3.t: "围困阿尔塔"
 oe_exp_epirus.3.d: "放弃围城，撤回远征。"
 oe_exp_epirus.3.a: "重金贿赂守军。"
 oe_exp_epirus.3.b: "围困阿尔塔。"
 oe_exp_epirus.3.c: "武力攻城。"
 oe_exp_epirus.4.t: "阿尔塔请求谈判"
 oe_exp_epirus.4.d: "一百八十日过去，城墙上的旗帜依旧飘扬，城内的抵抗却已失去底气。阿尔塔的代表终于走出城门，请求保全居民与家产，并愿意缴纳赔款，承认皇帝的裁决。\n\n宽大的处置能够让这座旧都尽快恢复安宁；严厉的惩罚则会让每一座仍在犹豫的城堡明白，违抗帝国绝非没有代价。"
 oe_exp_epirus.4.a: "宽大处置。"
 oe_exp_epirus.4.b: "严厉惩戒。"
 oe_exp_epirus.5.t: "围困托莫卡斯特隆"
 oe_exp_epirus.5.d: "放弃围城，撤回远征。"
 oe_exp_epirus.5.a: "重金贿赂守军。"
 oe_exp_epirus.5.b: "围困托莫卡斯特隆。"
 oe_exp_epirus.5.c: "武力攻城。"
 oe_exp_epirus.7.t: "尼基弗鲁斯二世逃亡那不勒斯"
 oe_exp_epirus.7.d: "当帝国的旗帜终于升上城墙，搜查者发现尼基弗鲁斯的住处已经空无一人。一艘小船借夜色驶离海岸，将这位奥尔西尼家的继承者送往那不勒斯。我们夺得了堡垒，却未能让他亲口承认皇帝的权威。\n\n这场远征仍将以伊庇鲁斯归于直辖而告终。阿尔塔将成为西部行政的中心，但海峡彼岸又多了一个怀抱旧日名号的流亡者。"
 oe_exp_epirus.7.a: "城堡已经归顺，完成伊庇鲁斯的整合。"
 oe_exp_epirus.8.t: "尼基弗鲁斯二世投降"
 oe_exp_epirus.8.d: "托莫卡斯特隆的城门终于打开。尼基弗鲁斯走出堡垒，接受皇帝的裁决；守军交出武器，随从将账册、印信与财物一并呈上。关于伊庇鲁斯继承权的争论，至此不再由城墙与外援决定。\n\n尼基弗鲁斯将被送往塞萨洛尼基，置于帝国的看护之下。阿尔塔则将迎来新的官员与档案，成为伊庇鲁斯行政的中心。漫长的西部争端终于有了一个属于罗马的结局。"
 oe_exp_epirus.8.a: "接纳他的归顺，恢复帝国直辖。"
 oe_exp_epirus.9.t: "伊庇鲁斯远征告终"
 oe_exp_epirus.9.d: "远征未能完成平定伊庇鲁斯的使命。无论是主动撤退、领队的离世，还是局势的变迁，都已使原先的计划无法继续。使者收起文书，营地熄灭最后一堆火，而西部的问题仍须由别的办法解决。\n\n这次远征的机会已经用尽。伊庇鲁斯不会因此被吞并，阿尔塔也不会获得行政中心修正。"
 oe_exp_epirus.9.a: "撤回尚存的人员。"
 oe_exp_epirus.inactive: "远征已经终止。"
 oe_epi_wait_60_tt: "远征在此停留#Y 60日#!，之后继续前往阿尔塔。"
 oe_epi_wait_180_tt: "远征留在阿尔塔#Y 180日#!，届时触发“阿尔塔请求谈判”。"
 oe_epi_wait_365_tt: "远征留在托莫卡斯特隆#Y 365日#!，之后决定尼基弗鲁斯的去向。"
 oe_epi_destroy_army_tt: "将销毁下列一整支实际兵力超过#Y 1000人#!、不含征召兵或雇佣兵的正规军。"
 oe_epi_completion_tt: "远征成功结束，东罗马吞并伊庇鲁斯。阿尔塔获得#Y 30年#!“伊庇鲁斯行政中心”，本地邻近度#G +33#!。若安德洛尼卡三世亲自领队，他的健康值#R -1#!。"
 oe_epirus_administrative_center: "伊庇鲁斯行政中心"
 oe_epirus_administrative_center_desc: "新设的官署、档案与交通联络，让阿尔塔成为帝国管理伊庇鲁斯的支点。"
 STATIC_MODIFIER_NAME_oe_epirus_administrative_center: "伊庇鲁斯行政中心"
 STATIC_MODIFIER_DESC_oe_epirus_administrative_center: "阿尔塔承担伊庇鲁斯的行政职能，加强帝国在西部的统治联系。"
