l_simp_chinese:
 oe_cb_confront_timur: "迎战帖木儿"
 oe_cb_confront_timur_desc: "仅在历史人物帖木儿仍然在世时，东罗马可对帖木儿国家制造并使用此战争借口。侵略扩张与征服花费减少50%，解锁100分战争条约“终结中亚之灾”。"
 oe_cb_caucasus_vassal: "高加索附庸"
 oe_cb_caucasus_vassal_desc: "东罗马可对格鲁吉亚或亚美尼亚制造此战争借口。侵略扩张与征服花费减少50%，解锁50分的“高加索附庸”条约；对格鲁吉亚开战时，还可选择50分的“统治高加索”，取得其与附属国在高加索大区的全部地点，不带核心。"
 oe_confront_timur: "迎战帖木儿"
 oe_caucasus_vassal: "高加索附庸"
 pe_oe_end_timur: "终结中亚之灾"
 pe_oe_end_timur_desc: "仅在帖木儿在世时可用。将帖木儿在波斯、高加索与新月沃土的所有地点转交东罗马，作为没有东罗马核心的征服领土。"
 OE_END_TIMUR_EFFECT: "帖木儿在波斯、高加索与新月沃土大区的所有地点转交东罗马；这些地点不获得东罗马核心，并处于征服整合阶段。"
 pe_oe_caucasus_vassal: "高加索附庸"
 pe_oe_caucasus_vassal_desc: "战争目标国成为东罗马的罗马同盟。"
 OE_RW_PERSIA: "波斯"
 OE_RW_PERSIA_DESC: "越过幼发拉底河，古老王道通向伊朗高原。罗马的鹰旗与波斯的圣火，将在群山、丝路与王城之间缔结新的秩序。"
 OE_RW_PERSIA_OPEN: "点击地图展开波斯行动"
 OE_RW_PERSIA_ACTIONS: "波斯行动"
 OE_RW_PERSIA_HINT: "点击地图查看行动；点击关闭收起行动面板。"
 OE_HEG_PERSIA_ACTIONS_HINT: "将高加索与新月沃土纳入罗马文明圈，越过扎格罗斯山，扶立信奉祆教的波斯帝国。"
 OE_RW_ISFAHAN: "伊斯法罕"
 OE_RW_ISFAHAN_OWNER: "伊斯法罕的拥有者"
 OE_HEG_PERSIA_LEVANT_REQUIRED: "东罗马及其各级附属国拥有黎凡特地区全部可征服地点；军事占领不算"
 OE_HEG_PERSIA_LAND_REQUIRED: "东罗马或其各级附属国在波斯大区至少拥有一处可征服地点"
 oe_heg_plan_persia: "波斯方略"
 oe_heg_plan_persia_desc: "要求东罗马及其附属国完全拥有黎凡特的全部可征服地点。花费1000金币，将高加索与新月沃土大区纳入罗马文明圈。"
 oe_heg_plan_persia_effect: "花费#R 1000#!金币，将高加索与新月沃土大区纳入罗马文明圈。"
 oe_heg_persia_plan_done: "已完成：波斯方略"
 oe_heg_invade_persia: "入侵波斯"
 oe_heg_invade_persia_desc: "花费200金币、20政治影响力和3稳定度，选择一个首都位于新月沃土、波斯或高加索的外国，获得夺取其首都的宣战理由。"
 oe_heg_invade_persia_effect: "花费#R 200#!金币、#R 20#!政治影响力、#R 3#!稳定度，获得针对所选国家的“帝国远征”宣战理由，有效期15年。"
 oe_heg_restore_persia: "复兴波斯帝国"
 oe_heg_restore_persia_desc: "将波斯大区内东罗马及其各级附属国拥有的所有地点交予复兴的波斯帝国。新国家为帝国等级，信奉祆教，以波斯文化为主流文化，以专属的波斯帝国附庸类型接受帝国庇护。"
 oe_heg_restore_persia_effect: "在符合条件的波斯领土上成立波斯帝国，实施“波斯复兴”政府改革，并开启波斯圣火复兴运动，令波斯大区的逊尼派、什叶派人口逐渐转信祆教；运动30年后结束。"
 oe_heg_persia_restored: "已完成：复兴波斯帝国"
 OE_RESTORED_PERSIAN_EMPIRE: "波斯帝国"
 OE_RESTORED_PERSIAN_EMPIRE_ADJ: "波斯"
 oe_restored_persian_empire: "复兴的波斯帝国"
 oe_persian_restoration: "波斯复兴"
 oe_persian_restoration_desc: "在罗马庇护下，波斯王廷重整驿路、商埠与地方贵族的职责。圣火照耀着新的王冠，古老的丝绸之路再度连通诸城。"
 oe_persian_religious_revival: "波斯圣火复兴运动"
 oe_persian_religious_revival_desc: "随着波斯王廷重建，祭司重新点燃圣火，修复祠宇与经院。波斯大区的逊尼派、什叶派人口将逐渐转信祆教；运动不向其他大区传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 oe_cb_confront_timur_PROV: "迎战帖木儿"
 oe_cb_caucasus_vassal_PROV: "高加索附庸"
 pe_oe_end_timur_entry: "终结中亚之灾"
 pe_oe_end_timur_entry_short: "终结中亚之灾"
 pe_oe_caucasus_vassal_entry: "高加索附庸"
 pe_oe_caucasus_vassal_entry_short: "高加索附庸"
 oe_confront_timur_desc: "仅在历史人物帖木儿仍然在世时，东罗马可对帖木儿国家制造并使用此战争借口。侵略扩张与征服花费减少50%，解锁100分战争条约“终结中亚之灾”。"
 oe_caucasus_vassal_desc: "东罗马可对格鲁吉亚或亚美尼亚制造此战争借口。侵略扩张与征服花费减少50%，解锁50分的“高加索附庸”条约；对格鲁吉亚开战时，还可选择50分的“统治高加索”，取得其与附属国在高加索大区的全部地点，不带核心。"
 pe_oe_rule_caucasus: "统治高加索"
 pe_oe_rule_caucasus_desc: "以“高加索附庸”向格鲁吉亚开战后可用，花费50战争分数。格鲁吉亚及其各级附属国在高加索大区的全部地点转交东罗马，不带东罗马核心。"
 pe_oe_rule_caucasus_entry: "统治高加索"
 pe_oe_rule_caucasus_entry_short: "统治高加索"
 OE_RULE_CAUCASUS_EFFECT: "格鲁吉亚及其各级附属国在#Y 高加索大区#!的全部地点转交东罗马；这些地点不带东罗马核心，并处于征服整合阶段。其他大区的领土不受影响。"
 oe_persian_empire: "波斯帝国"
 oe_persian_empire_desc: "在罗马庇护下重建的波斯帝国。王廷守卫高原要塞与东西商路，以独立的礼制与圣火维系诸省，并随宗主国出征。"
 oe_silk_road_trade: "掌控丝绸之路贸易"
 oe_silk_road_trade_desc: "此政府改革已停用。"
 oe_islamic_conversion_reform: "伊教皈依"
 oe_islamic_conversion_reform_desc: "从马格里布的海岸到波斯的高原，新的教区、经院与慈善机构逐渐建立。帝国以长期牧养与共同礼拜，使新近归附的臣民融入正教信仰。"
 oe_islamic_conversion_policy: "伊教皈依"
 oe_islamic_conversion_policy_desc: "圣城归入帝国秩序后，朝圣道路与地方信众得到新的安排。尊重臣民的文化习俗，以堂区、经院和慈善事业引导皈依。"
 oe_religious_victory_geography: "马格里布、埃及、阿拉伯半岛、新月沃土、波斯与安纳托利亚"
 oe_declare_victory_over_islam: "宣告对伊斯兰教的胜利"
 oe_declare_victory_over_islam_desc: "从北非海岸到伊朗高原，帝国及其属邦已掌握昔日诸苏丹争雄的土地。圣城与商都次第归附，皇帝遂召集教士与使臣，宣告新的信仰秩序，并为各地的皈依与牧养作出长久安排。\n\n须完成“传播正教”，拥有六个大区合计至少80%的可征服地点及九座指定城市；附属国领土计入。仅可执行一次，无额外费用。"
 oe_declare_victory_over_islam.title: "宣告对伊斯兰教的胜利"
 oe_declare_victory_over_islam.desc: "从北非海岸到伊朗高原，帝国及其属邦已掌握昔日诸苏丹争雄的土地。圣城与商都次第归附，皇帝遂召集教士与使臣，宣告新的信仰秩序，并为各地的皈依与牧养作出长久安排。\n\n须完成“传播正教”，拥有六个大区合计至少80%的可征服地点及九座指定城市；附属国领土计入。仅可执行一次，无额外费用。"
 oe_declare_victory_over_islam.a: "让正教的钟声传遍诸省。"
 oe_victory_over_islam_done: "已宣告对伊斯兰教的胜利"
 OE_RELIGIOUS_VICTORY_FAITH_REQUIRED: "已完成帝国改革“传播正教”"
 OE_RELIGIOUS_VICTORY_CITIES_REQUIRED: "东罗马及其各级附属国拥有麦加、麦地那、突尼斯、开罗、耶路撒冷、亚历山大、安条克、巴格达和安卡拉"
 OE_RELIGIOUS_VICTORY_TERRITORY_REQUIRED: "东罗马及其各级附属国拥有马格里布、埃及、阿拉伯半岛、新月沃土、波斯、安纳托利亚六个大区合计至少80%的可征服地点；按所有权计算，不按军事占领计算"
 OE_RELIGIOUS_VICTORY_EFFECT: "开启#Y 伊教皈依运动#!，将东罗马及其各级附属国境内的逊尼派、什叶派人口逐渐转为东正教，运动在#Y 30年#!后统一销毁。\n解锁政府改革#Y 伊教皈依#!及麦加朝圣法下的#Y 伊教皈依#!法条，供自行采用。"
 oe_islamic_conversion_movement: "伊教皈依运动"
 oe_islamic_conversion_movement_desc: "新设教区与经院沿着帝国道路展开牧养，逊尼派与什叶派人口逐渐皈依东正教。仅在东罗马及其各级附属国境内、有来源宗教人口的地点传播。\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
