 vote_in_oe_con_res_anti_hegemon_containment: "表决《反霸权均势围堵公约》"
 vote_in_oe_con_res_anti_hegemon_containment_desc: "就《反霸权均势围堵公约》投下赞成或反对票：针对单极多维霸主发起多边围堵表决：通过后所有非同盟、非附庸、非休战成员安全获得十年《反霸权均势围堵》宣战理由与联防加成。"
 oe_con_res_mare_liberum_clausum: "《全球海峡航行公约》"
 oe_con_res_mare_liberum_clausum_desc: "围绕格劳秀斯《海洋自由论》与塞尔登《海洋封闭论》展开全球公决：赞成确立十五年公海自由航行与自由海峡港；反对确立十五年封闭海峡护航私掠体制。"
 oe_con_res_mare_liberum_clausum_specific: "提议《全球海峡航行公约》"
 oe_con_res_mare_liberum_clausum_specific_desc: "在组织议事席上正式发起关于《全球海峡航行公约》的多边表决：围绕格劳秀斯《海洋自由论》与塞尔登《海洋封闭论》展开全球公决：赞成确立十五年公海自由航行与自由海峡港；反对确立十五年封闭海峡护航私掠体制。"
 vote_in_oe_con_res_mare_liberum_clausum: "表决《全球海峡航行公约》"
 vote_in_oe_con_res_mare_liberum_clausum_desc: "就《全球海峡航行公约》投下赞成或反对票：围绕格劳秀斯《海洋自由论》与塞尔登《海洋封闭论》展开全球公决：赞成确立十五年公海自由航行与自由海峡港；反对确立十五年封闭海峡护航私掠体制。"
 oe_con_res_international_sanitary_accord: "《国际海港检疫卫生协定》"
 oe_con_res_international_sanitary_accord_desc: "效法巴黎国际卫生会议缔结十五年跨国海港检疫协定：全体成员大幅提升黎凡特鼠疫与营地斑疹伤寒抗性、降低疫病损耗并缓和封港海贸惩罚。"
 oe_con_res_international_sanitary_accord_specific: "提议《国际海港检疫卫生协定》"
 oe_con_res_international_sanitary_accord_specific_desc: "在组织议事席上正式发起关于《国际海港检疫卫生协定》的多边表决：效法巴黎国际卫生会议缔结十五年跨国海港检疫协定：全体成员大幅提升黎凡特鼠疫与营地斑疹伤寒抗性、降低疫病损耗并缓和封港海贸惩罚。"
 vote_in_oe_con_res_international_sanitary_accord: "表决《国际海港检疫卫生协定》"
 vote_in_oe_con_res_international_sanitary_accord_desc: "就《国际海港检疫卫生协定》投下赞成或反对票：效法巴黎国际卫生会议缔结十五年跨国海港检疫协定：全体成员大幅提升黎凡特鼠疫与营地斑疹伤寒抗性、降低疫病损耗并缓和封港海贸惩罚。"
 oe_con.1.t: "欧亚世界协调会创立"
 oe_con.1.d: "面对跨洲海商扩张与单极霸权竞争，欧亚诸大强国遣使齐聚一堂，仿威斯特伐利亚与维也纳多边和会之制缔结《欧亚世界协调会》宪章。列强按国力轮值主席、确立五强常任协调席，并设立条约中立缓冲法域与多边表决议程，以均势外交与公海公法维系欧亚新秩序。"
 oe_con.1.a: "以多边均势维系欧亚和平。"
 oe_con.2.t: "《普世护教联军动员》通过"
 oe_con.2.d: "罗马世界诸邦在帝国大会上高票通过《普世护教联军动员》。从爱琴海堡垒至多瑙河边城，各成员国齐心整饬城防、征召兵源并统合军需，以共御域外劲敌之侵逼。"
 oe_con.2.a: "同仇敌忾，固守罗马世界。"
 oe_con.3.t: "边疆重镇纳入罗马外延法域"
 oe_con.3.d: "经罗马世界多边表决敕准，一座紧邻帝国界疆的战略要地已正式纳入罗马世界外延法域。帝国派员颁赐边疆驻防与控制度特许诏书，令其成为拱卫罗马腹地的坚固前哨。"
 oe_con.3.a: "边疆既入法域，皇纲益固。"
 oe_con.4.t: "《东亚展界开海诏令》颁行"
 oe_con.4.d: "中华天朝朝贡大会通过《东亚展界开海诏令》，撤销海禁约束、重开东南与南洋通商海道。沿海船厂昼夜兴作，商船云集诸港，丝茶瓷货与海外新知随季风奔流不息。"
 oe_con.4.a: "风帆四起，海宇通商。"
 oe_con.5.t: "《天朝靖边讨伐令》颁布"
 oe_con.5.d: "中华天朝多边朝议议决通过《天朝靖边讨伐令》。天子奉众议授予讨伐域外敌国之师出有名凭据，朝贡诸邦转输军粮、整备旌旗，静候王师靖平边患。"
 oe_con.5.a: "师出有名，以靖四夷。"
 oe_con.6.t: "《四海大都护府敕建令》颁行"
 oe_con.6.d: "天朝朝议通过《四海大都护府敕建令》，明定远藩羁縻、海运驿传与岁贡优抚章程。天子外交统御力与藩邦忠诚同步大增，远在西域、黑水与南洋的大都护府与宣慰司咸受敕命加持。"
 oe_con.6.a: "四海咸宁，远藩归心。"
 oe_con.7.t: "《万国和会》闭幕宣言"
 oe_con.7.d: "历时半载的万国和会落下帷幕，欧亚协调会诸国共同签署主权与均势总协定。各国战创得以休养、外交恶名加速消弭，独立中小邦国要地获颁条约中立缓冲保障，欧亚大陆迎来难得的均势喘息。"
 oe_con.7.a: "以条约礼法代兵戈。"
 oe_con.8.t: "《反霸权均势围堵公约》生效"
 oe_con.8.d: "鉴于单极霸主势焰熏天、危及欧亚诸国主权存续，欧亚世界协调会以多数票通过《反霸权均势围堵公约》。全体非同盟成员国获颁正式均势围堵宣战理由与联防加成，反霸同盟蓄势待发。"
 oe_con.8.a: "合纵抑霸，维系天平。"
 oe_con.9.t: "海峡公约·海洋自由胜出"
 oe_con.9.d: "围绕公海法权的世纪大辩论在协调会表决中尘埃落定：格劳秀斯《海洋自由论》赢得多数赞同。公海宣告为万国共有之通途，远洋航程与海贸效率齐升，霍尔木兹、马六甲、君士坦丁堡与直布罗陀等成员海峡港正式载入自由通航名录。"
 oe_con.9.a: "公海属万民共有，商帆无阻。"
 oe_con.10.t: "海峡公约·海洋封闭胜出"
 oe_con.10.d: "经过激烈外交角力，约翰·塞尔登《海洋封闭论》在协调会表决中占得上风。各沿海强权获准在近海与咽喉海峡强化主权护航、征收关税并授发私掠特许，自由公海贸易则被迫收缩。"
 oe_con.10.a: "海峡主权岂容他国染指。"
 oe_con.11.t: "《国际海港检疫卫生协定》缔结"
 oe_con.11.d: "面对跨海蔓延的黎凡特鼠疫与营地斑疹伤寒，欧亚世界协调会效法巴黎国际卫生会议缔结《国际海港检疫卫生协定》。统一海港检疫旗号、双岛泊位查验与跨国疫情通报制度落地，既大幅减轻疫疠伤亡，又缓和了严厉封港对海运贸易的窒息。"
 oe_con.11.a: "跨国协防，共御疫疠。"
 oe_con.90.t: "万国协调会与十二决议台账"
 oe_con.90.d: "万国协调会与 12 项原生 IO 多边投票决议（Slot 94 oe_con_）实时读数：\n· 第 18 条规则门禁态（0 启用 / 1 关闭）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_rule_state')|0]｜协调会存在（0/1）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_concert_exists')|0]\n· 协调会总成员：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_concert_members')|0]｜五强常任席：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_pentarchy_count')|0] / 5｜中立缓冲邦：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_buffer_members')|0]｜缓冲法域地格：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_buffer_locs')|0]\n· 本国协调会身份（0 非成员 / 1 普通 / 2 五强 / 3 缓冲）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_self_concert')|0]\n· 挂接 IO 规模 — 罗马世界成员：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_roman_members')|0]｜中华天朝成员：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_mk_members')|0]\n· 活跃表决总数（三 IO 合计）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_active_res')|0]｜历史累计通过决议数：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_passed_count')|0]\n· 生效条约标志 — 维也纳和会（0/1）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_vienna_accord')|0]｜海洋公约（0 无 / 1 自由 / 2 封闭）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_maritime_regime')|0]｜卫生检疫（0/1）：[ROOT.GetCountry.MakeScope.ScriptValue('oe_con_val_sanitary_active')|0]"
