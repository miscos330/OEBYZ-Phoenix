 STATIC_MODIFIER_NAME_oe_con_duhu_charter_subsidy_mod: "四海大都护府敕建令"
 STATIC_MODIFIER_DESC_oe_con_duhu_charter_subsidy_mod: "天朝颁行四海大都护府统御章程，扩充外交容量、安抚远藩忠诚并畅通驿传海运。"
