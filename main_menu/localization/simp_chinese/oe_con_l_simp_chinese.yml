 STATIC_MODIFIER_NAME_oe_con_concert_sovereignty_mod: "维也纳与君堡主权公约"
 STATIC_MODIFIER_DESC_oe_con_concert_sovereignty_mod: "万国和会确立主权尊重与多边均势秩序，平复战创并加快国际恶名消解。"
 STATIC_MODIFIER_NAME_oe_con_anti_hegemon_league_mod: "反霸权均势围堵公约"
 STATIC_MODIFIER_DESC_oe_con_anti_hegemon_league_mod: "欧亚世界协调会成员缔结反霸联防，陆海士气共振以抵御单极帝国扩张。"
 STATIC_MODIFIER_NAME_oe_con_mare_liberum_mod: "海洋自由公约（Mare Liberum）"
 STATIC_MODIFIER_DESC_oe_con_mare_liberum_mod: "依格劳秀斯《海洋自由论》确立公海共有与自由通航原则，远洋航程与海贸大幅提振。"
 STATIC_MODIFIER_NAME_oe_con_mare_clausum_mod: "海洋封闭公约（Mare Clausum）"
 STATIC_MODIFIER_DESC_oe_con_mare_clausum_mod: "依塞尔登《海洋封闭论》承认沿海列强对近海与海峡之主权关税、护航与私掠控制，公海自由贸易相应收紧。"
 STATIC_MODIFIER_NAME_oe_con_sanitary_accord_mod: "国际海港检疫卫生协定"
 STATIC_MODIFIER_DESC_oe_con_sanitary_accord_mod: "仿巴黎国际卫生会议缔结跨国检疫通报与标准泊位检视协定，大幅压低黎凡特鼠疫与营地斑疹伤寒损耗，并缓解严厉封港对海贸之冲击。"
