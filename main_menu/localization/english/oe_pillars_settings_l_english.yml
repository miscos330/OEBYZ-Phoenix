l_english:
 oe_pillars_settings: "Settings"
 oe_pillars_settings_desc: "Open the imperial debug settings."
 oe_pillars_settings.1.t: "Imperial Settings"
 oe_pillars_settings.1.debug: "Debug"
 OE_SETTINGS_OPEN_DEBUG_TT: "Open the imperial debug menu."
 oe_pillars_debug.1.t: "Imperial Debug Menu"
 oe_pillars_debug.1.d: "Manually test game mechanics here.\n\nIncrease Revolutionary Clamor is available while Bells of Revolution is active. Each click adds 10 clamor, records the change, and reopens this menu. Clamor remains capped at 100.\n\nReturn closes this event without applying any effects."
 oe_pillars_debug.1.return: "Return"
 oe_pillars_debug.1.clamor: "Increase Revolutionary Clamor (+10)"
 oe_pillars_settings.1.d: "These settings control optional systems in this campaign. Restore bureaucracy, toggle food support, clear movements worldwide, restrict assimilation by Mongolian-culture countries, or adjust the attraction of market centers."
 oe_pillars_settings.1.a: "Restore the disabled bureaucracy system"
 OE_SETTINGS_RESTORE_BUREAUCRACY_TT: "Enable #Y Bureaucracy#! for Byzantium: restore establishment, removal, effects, expenses and related cabinet actions, and show the maintenance slider under #Y Imperial Finances#!. Individual bureaucracies retain their vanilla requirements. Selecting this again neither creates duplicate bureaucracies nor stacks effects."
 oe_settings_bureaucracy_restored: "Bureaucracy System Restored"
 oe_settings_bureaucracy_permission: "Bureaucracy System Enabled"
 oe_pillars_settings.1.food_on: "Enable the food modifier"
 oe_pillars_settings.1.food_off: "Disable the food modifier"
 oe_settings_food_support: "Food Support"
 STATIC_MODIFIER_NAME_oe_settings_food_support: "Food Support"
 STATIC_MODIFIER_DESC_oe_settings_food_support: "Food production is increased by 33% and noble food consumption reduced by 20%. Toggle this off in Imperial Pillars administrative settings."
 oe_pillars_settings.1.open_ark: "Open the Ark"
 OE_SETTINGS_OPEN_ARK_TT: "Do you really want to open it?"
 oe_obtained_holy_grail: "The Holy Grail Obtained"
 oe_obtained_holy_grail_desc: "The Grail grants its bearer a lifespan far beyond mortal years."
 STATIC_MODIFIER_NAME_oe_obtained_holy_grail: "The Holy Grail Obtained"
 STATIC_MODIFIER_DESC_oe_obtained_holy_grail: "The Grail grants its bearer a lifespan far beyond mortal years."
 oe_ark_opened: "The Ark Has Been Opened"
 oe_pillars_settings.1.clear_movements: "Clear All Movements Worldwide"
 OE_SETTINGS_CLEAR_MOVEMENTS_TT: "Immediately end #Y all existing cultural and religious movements worldwide#!, including vanilla movements, mod movements and duplicate outbreaks. Completed cultural assimilation and religious conversion are retained. Used movement-start opportunities are not reset. Cleanup runs only when selected, costs nothing and can be repeated."
 oe_pillars_settings.1.limit_mongols: "Restrict Mongolian Assimilation"
 OE_SETTINGS_LIMIT_MONGOLS_TT: "All existing countries worldwide whose primary culture is #Y Mongolian#! permanently receive #Y Restricted Mongolian Assimilation#!: population assimilation speed #R -300%#!. Applied only on selection. Repeat to cover new Mongolian-culture countries; the modifier does not stack."
 oe_settings_limit_mongols: "Restricted Mongolian Assimilation"
 oe_settings_limit_mongols_desc: "Cultural assimilation by this Mongolian-culture state is restricted."
 STATIC_MODIFIER_NAME_oe_settings_limit_mongols: "Restricted Mongolian Assimilation"
 STATIC_MODIFIER_DESC_oe_settings_limit_mongols: "Cultural assimilation by this Mongolian-culture state is restricted."
 oe_pillars_settings.1.market_reduce: "Reduce Market Attraction (stackable)"
 oe_pillars_settings.1.market_clear: "Clear Market Attraction Reductions"
 OE_SETTINGS_MARKET_REDUCE_TT: "Choose any market center to permanently reduce its Market Attraction by 10%. Repeating this on the same location stacks the reduction. The clear option removes the entire accumulated modifier."
 OE_SETTINGS_MARKET_CLEAR_TT: "Choose a location with Reduced Market Attraction to remove the entire accumulated modifier. Other modifiers are retained. Former market centers remain eligible for cleanup."
 oe_settings_market_reduce: "Reduce Market Attraction"
 oe_settings_market_reduce_desc: "Choose any market center to permanently reduce its Market Attraction by 10%. Repeating this on the same location stacks the reduction. The clear option removes the entire accumulated modifier."
 oe_settings_market_clear: "Clear Market Attraction Reductions"
 oe_settings_market_clear_desc: "Choose a location with Reduced Market Attraction to remove the entire accumulated modifier. Other modifiers are retained. Former market centers remain eligible for cleanup."
 oe_settings_market_reduce_select: "Choose a market center"
 oe_settings_market_reduce_none: "@trigger_no! No market center is available."
 oe_settings_market_clear_select: "Choose a location to clear"
 oe_settings_market_clear_none: "@trigger_no! No location has Reduced Market Attraction."
 oe_settings_market_attraction_reduction: "Reduced Market Attraction"
 STATIC_MODIFIER_NAME_oe_settings_market_attraction_reduction: "Reduced Market Attraction"
 STATIC_MODIFIER_DESC_oe_settings_market_attraction_reduction: "A permanent reduction applied through Imperial Settings, stacking by -10% per use. Clear all stacks through Settings."
