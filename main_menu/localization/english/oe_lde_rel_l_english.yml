l_english:
 oe_lde_rel_miaphysite_desc: "Under the Solomonic emperors Amda Seyon I and Zara Yaqob, highland Ethiopia reached a medieval golden age, reforming monastic discipline and liturgical texts while dispatching envoys to the Council of Florence and Mediterranean courts. Across the Nile and the Red Sea, Ethiopia's church maintained ecclesiastical links with the Coptic see of Alexandria and with Constantinople, bridging the Horn of Africa and the eastern Mediterranean."
 oe_lde_rel_nestorianism_desc: "Under the Great Yuan, the Church of the East—known in China as the Yelikewen—briefly revived along both land and sea Silk Roads: the Önggüd princes of Zhao guarded the northern Yin Mountains as hereditary Christians, the great maritime port of Quanzhou (Zaytun) left Syriac and Uyghur Christian tombstones, and far out at the mouth of the Red Sea the island of Socotra preserved an East Syriac community linking the Indian Ocean to the wider East."
 oe_lde_rel_orthodox_desc: "Even under fourteenth- and fifteenth-century crisis, Orthodox intellectual life saw a vibrant revival: Hesychast orthodoxy championed by Gregory Palamas and Gennadios II (George Scholarios), the Neoplatonic circle of Gemistus Plethon at Mystras, and the Graeco-Latin humanist bridge built by scholars such as Cardinal Bessarion. In the north, after rejecting the Union of Florence, the Russian Church elected its own metropolitan in Moscow in 1448 and was raised to the Moscow Patriarchate with Constantinople's recognition in 1589."
 oe_lde_rel_safavid_school_desc: "Between the death of Safi al-Din in 1334 and Ismail I's coronation in 1501, the Ardabil order underwent a dramatic transformation from a quietist Sunni Sufi brotherhood into a militant Twelver Shia dynasty. Its Turkoman Qizilbash followers revered the shah as both temporal sovereign and spiritual master, turning sectarian devotion into a formidable military force across Iran and the Caucasus."
 oe_lde_rel_shia_desc: "The decisive engine of Iran's shift to Shiism was the Safavid order of Ardabil in Azerbaijan: originally a Sunni Sufi order of the Shafi'i school, it turned under Shaykhs Junayd and Haydar in the fifteenth century into a militant Twelver Shia movement backed by red-capped Turkoman tribesmen known as the Qizilbash. When Ismail I rode that coalition into Tabriz in 1501, he permanently reshaped the confessional map of the Near East."
