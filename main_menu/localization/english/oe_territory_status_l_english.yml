l_english:
 STATIC_MODIFIER_NAME_oe_ts_status_core: "Status: Heartland"
 STATIC_MODIFIER_DESC_oe_ts_status_core: "A province of the imperial heartland; the emperor appoints and dismisses its governor."
 STATIC_MODIFIER_NAME_oe_ts_status_frontier: "Status: March"
 STATIC_MODIFIER_DESC_oe_ts_status_frontier: "A march on the border: its doux commands more troops and is harder to rein in."
 STATIC_MODIFIER_NAME_oe_ts_status_exarch: "Status: Exarchate"
 STATIC_MODIFIER_DESC_oe_ts_status_exarch: "Reconquered land far from the capital; the exarch holds civil and military power and sends a tenth of the monthly income to the treasury."
 STATIC_MODIFIER_NAME_oe_ts_status_charter: "Status: Chartered City"
 STATIC_MODIFIER_DESC_oe_ts_status_charter: "A self-governing chartered city; it pays #R 15#! % of its tax base in tribute and sends no troops."
 STATIC_MODIFIER_NAME_oe_ts_status_despot: "Status: Despotate"
 STATIC_MODIFIER_DESC_oe_ts_status_despot: "A despotate held by a member of the imperial house; it sends a twentieth of the monthly income to the treasury."
