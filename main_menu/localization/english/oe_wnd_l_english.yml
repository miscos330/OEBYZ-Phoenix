l_english:
 ARTIST_TYPE_NAME_oe_imperial_mosaicist: "Imperial Mosaicist"
 ARTIST_TYPE_DESC_oe_imperial_mosaicist: "A court master of gilded glass tesserae and monumental vault mosaics, adorning cathedrals and palaces while elevating cultural tradition and religious influence."
 ARTIST_TYPE_NAME_oe_court_astronomer: "Imperial Court Astronomer"
 ARTIST_TYPE_DESC_oe_court_astronomer: "A royal mathematician and celestial observer overseeing star tables, calendar reform, and meridian surveys across Eurasia's observatories and universities, accelerating research and institution growth."
 oe_wnd_imperial_wonder: "Eurasian Monumental Wonder"
 oe_wnd_imperial_wonder_desc: "An immovable architectural marvel raised in a great Eurasian metropolis, nurturing local literacy, institution spread, and imperial cultural tradition across generations."
 oe_wnd_grand_codex: "Grand Imperial Codex"
 oe_wnd_grand_codex_desc: "A monumental scholarly compendium of astronomy, jurisprudence, or maritime cartography bound for royal archives, enriching literacy and research wherever it is housed."
 oe_wnd_hagia_sophia_dome: "Great Dome Restoration of Hagia Sophia"
 oe_wnd_hagia_sophia_dome_desc: "Structural buttressing and fresh gold-leaf mosaic work preserve the soaring dome of Hagia Sophia above the Bosporus, elevating ecclesiastical learning and imperial prestige across the realm."
 oe_wnd_hagia_sophia_dome_maint: "Great Dome Restoration of Hagia Sophia (Upkeep)"
 oe_wnd_art_hagia_sophia_dome: "Golden Dome Mosaics of Hagia Sophia"
 oe_wnd_art_hagia_sophia_dome_desc: "Set with countless tesserae of gilded glass beneath the ring of forty dome windows, the restored Pantokrator and seraphim mosaics stand as the crowning architectural jewel of the Bosporus."
 AUTO_MODIFIER_NAME_oe_wnd_wb_hagia_sophia_dome: "Great Dome Restoration of Hagia Sophia"
 AUTO_MODIFIER_DESC_oe_wnd_wb_hagia_sophia_dome: "Structural buttressing and fresh gold-leaf mosaic work preserve the soaring dome of Hagia Sophia above the Bosporus, elevating ecclesiastical learning and imperial prestige across the realm."
 oe_wnd_theodosian_bastion_ring: "Theodosian Bastion Ring"
 oe_wnd_theodosian_bastion_ring_desc: "Low angled artillery bastions, earth-backed counterscarps, and fortified gun casemates reinforce the ancient landward walls of Constantinople against heavy siege ordnance."
 oe_wnd_theodosian_bastion_ring_maint: "Theodosian Bastion Ring (Upkeep)"
 oe_wnd_art_theodosian_walls_chronicle: "Chronicle and Bastion Reliefs of the Theodosian Ring"
 oe_wnd_art_theodosian_walls_chronicle_desc: "Carved along the inner gallery of the Golden Gate, these geometric fortification plates and masonry inscriptions record the transformation of classical curtain walls into a gunpowder-age fortress."
 AUTO_MODIFIER_NAME_oe_wnd_wb_theodosian_bastion_ring: "Theodosian Bastion Ring"
 AUTO_MODIFIER_DESC_oe_wnd_wb_theodosian_bastion_ring: "Low angled artillery bastions, earth-backed counterscarps, and fortified gun casemates reinforce the ancient landward walls of Constantinople against heavy siege ordnance."
 oe_wnd_dadu_observatory_archive: "Dadu Imperial Observatory and Grand Archive"
 oe_wnd_dadu_observatory_archive_desc: "Crowned with bronze armillary instruments and vast timber book halls, the Dadu Observatory and Grand Archive unite East Asian calendrical astronomy with West Asian mathematical tables."
 oe_wnd_dadu_observatory_archive_maint: "Dadu Imperial Observatory and Grand Archive (Upkeep)"
 oe_wnd_art_zhizheng_grand_canon: "Grand Imperial Canon of Dadu Astronomy and Classics"
 oe_wnd_art_zhizheng_grand_canon_desc: "Compiled by hundreds of court scholars and astronomers, this monumental multi-volume canon preserves classical jurisprudence, hydraulic treatises, and precision star tables in lacquer-bound folios."
 AUTO_MODIFIER_NAME_oe_wnd_wb_dadu_observatory_archive: "Dadu Imperial Observatory and Grand Archive"
 AUTO_MODIFIER_DESC_oe_wnd_wb_dadu_observatory_archive: "Crowned with bronze armillary instruments and vast timber book halls, the Dadu Observatory and Grand Archive unite East Asian calendrical astronomy with West Asian mathematical tables."
 oe_wnd_kremlin_white_stone: "White-Stone and Red-Brick Kremlin Expansion"
 oe_wnd_kremlin_white_stone_desc: "Quarried white limestone foundations crowned with kiln-fired red-brick ramparts and swallowtail battlements elevate Moscow's citadel into the unshakable seat of Rus sovereignty."
 oe_wnd_kremlin_white_stone_maint: "White-Stone and Red-Brick Kremlin Expansion (Upkeep)"
 oe_wnd_art_white_stone_kremlin: "White-Stone Kremlin Citadel Ensemble"
 oe_wnd_art_white_stone_kremlin_desc: "Rising above the bend of the Moskva River, the ensemble of limestone walls, red-brick gate towers, and gilded cathedral cupolas endures as the monumental symbol of northern sovereignty."
 AUTO_MODIFIER_NAME_oe_wnd_wb_kremlin_white_stone: "White-Stone and Red-Brick Kremlin Expansion"
 AUTO_MODIFIER_DESC_oe_wnd_wb_kremlin_white_stone: "Quarried white limestone foundations crowned with kiln-fired red-brick ramparts and swallowtail battlements elevate Moscow's citadel into the unshakable seat of Rus sovereignty."
 oe_wnd_samarkand_registan: "Samarkand Registan Madrasa and Observatory"
 oe_wnd_samarkand_registan_desc: "Azure tilework portals frame the grand madrasa courtyard while a subterranean marble sextant measures the heavens above Samarkand, drawing scholars from across Eurasia."
 oe_wnd_samarkand_registan_maint: "Samarkand Registan Madrasa and Observatory (Upkeep)"
 oe_wnd_art_zij_i_sultani: "Zij-i-Sultani Star Catalogue"
 oe_wnd_art_zij_i_sultani_desc: "Compiled from direct observations on Samarkand's colossal marble sextant, this masterwork catalogues over a thousand fixed stars and sine tables of unmatched precision."
 AUTO_MODIFIER_NAME_oe_wnd_wb_samarkand_registan: "Samarkand Registan Madrasa and Observatory"
 AUTO_MODIFIER_DESC_oe_wnd_wb_samarkand_registan: "Azure tilework portals frame the grand madrasa courtyard while a subterranean marble sextant measures the heavens above Samarkand, drawing scholars from across Eurasia."
 oe_wnd_new_alexandria_library: "New Library of Alexandria"
 oe_wnd_new_alexandria_library_desc: "Raised in colonnaded marble along the harbor of Alexandria, this great library gathers, copies, and translates Greek, Arabic, Latin, and Coptic manuscripts for a new age of inquiry."
 oe_wnd_new_alexandria_library_maint: "New Library of Alexandria (Upkeep)"
 oe_wnd_art_new_alexandria_scrolls: "Polyglot Compendium of New Alexandria"
 oe_wnd_art_new_alexandria_scrolls_desc: "A celebrated polyglot collection of geometry, medicine, maritime cartography, and classical philosophy restored and cross-indexed within the New Library's vaulted scriptoria."
 AUTO_MODIFIER_NAME_oe_wnd_wb_new_alexandria_library: "New Library of Alexandria"
 AUTO_MODIFIER_DESC_oe_wnd_wb_new_alexandria_library: "Raised in colonnaded marble along the harbor of Alexandria, this great library gathers, copies, and translates Greek, Arabic, Latin, and Coptic manuscripts for a new age of inquiry."
 oe_wnd_azhar_grand_college: "Al-Azhar Grand College Expansion"
 oe_wnd_azhar_grand_college_desc: "New residential riwaqs, jurisprudence halls, and manuscript vaults expand Cairo's famed scholastic complex, operating harmoniously beside the historic Al-Azhar madrasa."
 oe_wnd_azhar_grand_college_maint: "Al-Azhar Grand College Expansion (Upkeep)"
 oe_wnd_art_azhar_encyclopedia: "Great Encyclopedia of Al-Azhar"
 oe_wnd_art_azhar_encyclopedia_desc: "Compiled in Cairo's expanded lecture courts, this authoritative compendium of jurisprudence, rhetoric, history, and astronomy circulates from the Maghreb to the Red Sea."
 AUTO_MODIFIER_NAME_oe_wnd_wb_azhar_grand_college: "Al-Azhar Grand College Expansion"
 AUTO_MODIFIER_DESC_oe_wnd_wb_azhar_grand_college: "New residential riwaqs, jurisprudence halls, and manuscript vaults expand Cairo's famed scholastic complex, operating harmoniously beside the historic Al-Azhar madrasa."
 oe_wnd_san_giorgio_bank: "Casa di San Giorgio Head Bank"
 oe_wnd_san_giorgio_bank_desc: "Consolidating public debt management, bill-of-exchange clearing, and maritime credit under double-entry bookkeeping, the Casa di San Giorgio anchors Mediterranean finance."
 oe_wnd_san_giorgio_bank_maint: "Casa di San Giorgio Head Bank (Upkeep)"
 oe_wnd_art_san_giorgio_ledger: "Grand Ledger and Maritime Credit Code of San Giorgio"
 oe_wnd_art_san_giorgio_ledger_desc: "Bound in vellum within the vaults of Genoa, this foundational master ledger and commercial code codifies double-entry clearing, sovereign bonds, and maritime bills of exchange."
 AUTO_MODIFIER_NAME_oe_wnd_wb_san_giorgio_bank: "Casa di San Giorgio Head Bank"
 AUTO_MODIFIER_DESC_oe_wnd_wb_san_giorgio_bank: "Consolidating public debt management, bill-of-exchange clearing, and maritime credit under double-entry bookkeeping, the Casa di San Giorgio anchors Mediterranean finance."
 oe_wnd_hangzhou_canal_hub: "Hangzhou Grand Canal Hub and Maritime Mart"
 oe_wnd_hangzhou_canal_hub_desc: "Multi-stage pound locks, vast grain granaries, and foreign merchant depots unite the southern terminus of the Grand Canal with coastal sea lanes at Hangzhou."
 oe_wnd_hangzhou_canal_hub_maint: "Hangzhou Grand Canal Hub and Maritime Mart (Upkeep)"
 oe_wnd_art_hangzhou_scroll: "Grand Scroll of the Hangzhou Canal and Ten Thousand Sails"
 oe_wnd_art_hangzhou_scroll_desc: "Painted on fine Jiangnan silk, this sweeping panoramic scroll depicts canal locks, arched stone bridges, silk warehouses, and fleets of grain barges converging on Hangzhou."
 AUTO_MODIFIER_NAME_oe_wnd_wb_hangzhou_canal_hub: "Hangzhou Grand Canal Hub and Maritime Mart"
 AUTO_MODIFIER_DESC_oe_wnd_wb_hangzhou_canal_hub: "Multi-stage pound locks, vast grain granaries, and foreign merchant depots unite the southern terminus of the Grand Canal with coastal sea lanes at Hangzhou."
 oe_wnd_baghdad_house_of_wisdom: "Baghdad New House of Wisdom"
 oe_wnd_baghdad_house_of_wisdom_desc: "Reborn along the Tigris, the New Bayt al-Hikma restores Baghdad's famed translation and scientific academy, bridging Persian, Arabic, Syriac, Greek, and Indian learning."
 oe_wnd_baghdad_house_of_wisdom_maint: "Baghdad New House of Wisdom (Upkeep)"
 oe_wnd_art_new_bayt_al_hikma: "New Bayt al-Hikma Scientific Corpus"
 oe_wnd_art_new_bayt_al_hikma_desc: "Assembled by Baghdad's revived translation college, this luminous corpus brings together algebra, optics, pharmacology, and astrolabe engineering in finely illuminated folios."
 AUTO_MODIFIER_NAME_oe_wnd_wb_baghdad_house_of_wisdom: "Baghdad New House of Wisdom"
 AUTO_MODIFIER_DESC_oe_wnd_wb_baghdad_house_of_wisdom: "Reborn along the Tigris, the New Bayt al-Hikma restores Baghdad's famed translation and scientific academy, bridging Persian, Arabic, Syriac, Greek, and Indian learning."
 oe_wnd_delhi_imperial_observatory: "Delhi Imperial Observatory and Grand Library"
 oe_wnd_delhi_imperial_observatory_desc: "Monumental red-sandstone masonry dials and vaulted book halls fuse Persian and Sanskrit astronomical traditions in Delhi, sharpening both scholarship and imperial fiscal surveying."
 oe_wnd_delhi_imperial_observatory_maint: "Delhi Imperial Observatory and Grand Library (Upkeep)"
 oe_wnd_art_delhi_astronomical_tables: "Imperial Astronomical Tables of Delhi"
 oe_wnd_art_delhi_astronomical_tables_desc: "Cross-calibrated in both Persian and Sanskrit, these richly gilded tables reconcile planetary tables, monsoon calendars, and meridian surveys across Hindustan."
 AUTO_MODIFIER_NAME_oe_wnd_wb_delhi_imperial_observatory: "Delhi Imperial Observatory and Grand Library"
 AUTO_MODIFIER_DESC_oe_wnd_wb_delhi_imperial_observatory: "Monumental red-sandstone masonry dials and vaulted book halls fuse Persian and Sanskrit astronomical traditions in Delhi, sharpening both scholarship and imperial fiscal surveying."
 oe_wnd_quanzhou_maritime_beacon: "Quanzhou Zaytun Maritime Beacon and Foreign Quarter"
 oe_wnd_quanzhou_maritime_beacon_desc: "A towering granite beacon guides ocean-going junks and dhows into Zaytun harbor, while renovated foreign merchant quarters and cartography offices anchor the Maritime Silk Routes."
 oe_wnd_quanzhou_maritime_beacon_maint: "Quanzhou Zaytun Maritime Beacon and Foreign Quarter (Upkeep)"
 oe_wnd_art_citong_rutters: "Zaytun Maritime Rutters and Compass Atlas"
 oe_wnd_art_citong_rutters_desc: "Compiled from seasoned Fujianese pilots and Arab navigators at Zaytun, this waterproofed compass atlas charts monsoon winds, star altitudes, reefs, and trading ports from China to the Red Sea."
 AUTO_MODIFIER_NAME_oe_wnd_wb_quanzhou_maritime_beacon: "Quanzhou Zaytun Maritime Beacon and Foreign Quarter"
 AUTO_MODIFIER_DESC_oe_wnd_wb_quanzhou_maritime_beacon: "A towering granite beacon guides ocean-going junks and dhows into Zaytun harbor, while renovated foreign merchant quarters and cartography offices anchor the Maritime Silk Routes."
 oe_wnd_imperial_holy_seat: "Imperial Sacred Seat"
 oe_wnd_imperial_holy_seat_desc: "A supreme sacred seat combining pilgrimage prestige and imperial patronage, nurturing local clerical literacy and prosperity while reinforcing the controller's religious influence and stability."
 oe_wnd_holy_potala_lhasa: "Potala and Jokhang of Lhasa"
 oe_wnd_holy_potala_lhasa_desc: "Crowning the Tibetan plateau, the Jokhang and Red Hill sanctuary of Lhasa stand as a supreme sacred seat revered across Tibetan Buddhism, Mahayana, and Sanjiao courts."
 oe_wnd_holy_moscow_dormition: "Dormition Cathedral of Moscow"
 oe_wnd_holy_moscow_dormition_desc: "The principal cathedral of Moscow's citadel where Rus metropolitans and sovereigns receive consecration, anchoring the Orthodox faith across the northern lands."
 oe_wnd_holy_samarkand_shahi_zinda: "Shah-i-Zinda Necropolis of Samarkand"
 oe_wnd_holy_samarkand_shahi_zinda_desc: "An avenue of turquoise-tiled mausolea ascending the ancient hill of Afrasiyab in Samarkand, revered across Transoxiana as a major Islamic pilgrimage sanctuary."
 AUTO_MODIFIER_NAME_oe_wnd_pentarchy_partial: "Pentarchy Partially Restored (3/5)"
 AUTO_MODIFIER_DESC_oe_wnd_pentarchy_partial: "Controlling at least three of the five ancient patriarchal sees strengthens Orthodox religious authority, icon devotion, and missionary reach."
 AUTO_MODIFIER_NAME_oe_wnd_pentarchy_full: "Pentarchy Fully Restored (5/5)"
 AUTO_MODIFIER_DESC_oe_wnd_pentarchy_full: "All five ancient patriarchal sees stand united under Orthodox rule, restoring the full prestige, devotional fervor, and legitimacy of the undivided Pentarchy."
 AUTO_MODIFIER_NAME_oe_wnd_mount_athos_guardian: "Guardian of Mount Athos"
 AUTO_MODIFIER_DESC_oe_wnd_mount_athos_guardian: "Protecting the monastic commonwealth of Mount Athos enriches clerical scholarship and steadies the realm's spiritual foundations."
 AUTO_MODIFIER_NAME_oe_wnd_two_holy_mosques_custodian: "Custodian of the Two Holy Mosques"
 AUTO_MODIFIER_DESC_oe_wnd_two_holy_mosques_custodian: "Sovereign guardianship over both Mecca and Medina confers supreme prestige, religious authority, and diplomatic reach across the Islamic world."
 AUTO_MODIFIER_NAME_oe_wnd_snowland_dharma_patron: "Patron of the Snowland Dharma (Lhasa)"
 AUTO_MODIFIER_DESC_oe_wnd_snowland_dharma_patron: "Direct stewardship or loyal tributary patronage over Lhasa harmonizes multi-faith frontiers and strengthens the loyalty of imperial subjects."
 oe_order_constantinian_st_george: "Constantinian Order of St. George"
 oe_order_constantinian_st_george_desc: "Invoking the Labarum of Constantine the Great and the patronage of St. George, this imperial chivalric order honors commanders and loyal magnates who uphold the Roman restoration."
 oe_order_varangian_brotherhood: "Varangian Brotherhood"
 oe_order_varangian_brotherhood_desc: "Inheriting the axe-bearing oath of the imperial Varangian Guard and Rus-Nordic martial fellowship, this brotherhood binds veteran commanders and royal guardsmen under iron discipline."
 oe_order_holy_sepulchre_guard: "Guard of the Holy Sepulchre"
 oe_order_holy_sepulchre_guard_desc: "Chartered upon the recovery of Jerusalem, this pious order of chivalry unites nobles, clergy, and commanders in solemn custody of the Holy Sepulchre and its pilgrimage roads."
 oe_order_danube_dragon: "Imperial Order of the Danubian Dragon"
 oe_order_danube_dragon_desc: "Anchored on the river fortresses of Belgrade and Buda, this reorganized Danubian order unites frontier lords and imperial officers in the defense of the Balkan-Carpathian marches."
 oe_orthodox_hesychast_order_type: "Athonite Hesychast Order"
 oe_orthodox_hesychast_order_type_desc: "An Orthodox contemplative and scribal monastic brotherhood rooted on Mount Athos and spreading to Constantinople, Kyiv, and Moscow, cultivating literacy, icon devotion, and civic calm."
 oe_orthodox_sepulchre_military_order_type: "Orthodox Sepulchre Military Order"
 oe_orthodox_sepulchre_military_order_type_desc: "An armed Orthodox monastic order chartered upon the recovery of Jerusalem or Antioch, garrisoning frontier strongholds and fielding consecrated regiments in defense of the eastern marches."
 oe_hesychast_contemplation_calling: "Hesychast Contemplation"
 oe_hesychast_contemplation_calling_desc: "Dedicated to Hesychast prayer and liturgical stillness, calming local unrest while elevating clerical literacy and icon power across the realm."
 oe_hesychast_chronicle_calling: "Monastic Chronicle & Scriptorium"
 oe_hesychast_chronicle_calling_desc: "Devoted to monastery scriptoria preserving classical manuscripts and chronicles, accelerating literacy and institution diffusion."
 oe_sepulchre_wardens_calling: "Sepulchre Wardens"
 oe_sepulchre_wardens_calling_desc: "Chartered to hold Jerusalem, Antioch, and the eastern frontier fortresses, strengthening local defenses while reinforcing national discipline and religious influence."
 oe_wnd.1.t: "The Great Dome of Hagia Sophia Shines Anew"
 oe_wnd.1.d: "After years of timber scaffolding and painstaking masonry, the restored dome of Hagia Sophia stands unveiled over Constantinople. Dawn pours through forty arched windows across gleaming gold-leaf mosaics, drawing pilgrims, scholars, and envoys in awed silence."
 oe_wnd.1.a: "Proclaim the Restoration Across Christendom"
 oe_wnd.1.a.tt: "Gain Prestige and Religious Influence in celebration of the dome's completion."
 oe_wnd.1.b: "Reward the Mosaicists and Master Masons"
 oe_wnd.1.b.tt: "Gain Stability and Prestige while honoring the imperial workshops."
 oe_wnd.2.t: "The Theodosian Bastion Ring Stands Complete"
 oe_wnd.2.d: "From the Golden Gate on the Marmara shore to the heights of Blachernae, newly cut polygonal bastions and vaulted gun batteries now shield the historic triple walls. Trial shot glances harmlessly off the sloped revetments as garrison officers inspect the completed ring."
 oe_wnd.2.a: "Review the Garrison and Publish Fortification Standards"
 oe_wnd.2.a.tt: "Gain Army Tradition and Prestige from the fortress triumph."
 oe_wnd.2.b: "Stockpile Arsenal Reserves Along the Ramparts"
 oe_wnd.2.b.tt: "Gain Stability and Army Tradition as city defenses are provisioned."
 oe_wnd.3.t: "Dadu Observatory and Grand Canon Completed"
 oe_wnd.3.d: "Atop the eastern terrace of Dadu, newly cast bronze armillary spheres stand aligned with the pole star. Below in the cedar-lined archive halls, scholars present the completed Grand Canon uniting classical learning, statecraft, and astronomical calculation."
 oe_wnd.3.a: "Distribute Copies to Provincial Academies"
 oe_wnd.3.a.tt: "Advance Research Progress and gain Prestige."
 oe_wnd.3.b: "Enshrine the Master Folio and Honor the Scholars"
 oe_wnd.3.b.tt: "Gain Stability and Prestige in honor of court scholarship."
 oe_wnd.4.t: "The White-Stone Kremlin Rises Over Moscow"
 oe_wnd.4.d: "No longer a timber stockade vulnerable to flame and raid, Moscow's hilltop citadel now gleams with dressed limestone courses and towering brick barbicans. Cathedral bells peal over the new fortress square as envoys and princes behold the seat of power."
 oe_wnd.4.a: "Proclaim Sovereign Majesty from the New Citadel"
 oe_wnd.4.a.tt: "Gain Legitimacy and Prestige for the crown."
 oe_wnd.4.b: "Honor the Stonemasons and Citadel Garrison"
 oe_wnd.4.b.tt: "Gain Army Tradition and Stability."
 oe_wnd.5.t: "Samarkand Registan and Observatory Unveiled"
 oe_wnd.5.d: "Cobalt and turquoise glazed tiles catch the sunlit sky of Transoxiana as the grand madrasa of the Registan opens its lecture halls. Nearby, astronomers bind the completed Zij-i-Sultani star catalogue, whose fame spreads rapidly along the caravan roads."
 oe_wnd.5.a: "Invite Scholars and Poets Across the Silk Roads"
 oe_wnd.5.a.tt: "Advance Research Progress and gain Prestige."
 oe_wnd.5.b: "Endow Fellowships and Public Foundations"
 oe_wnd.5.b.tt: "Gain Stability and Prestige."
 oe_wnd.6.t: "The New Library of Alexandria Opens Its Scrolls"
 oe_wnd.6.d: "Sea breezes sweep through marble colonnades overlooking Alexandria's harbor as tens of thousands of volumes take their place upon cedar shelves. Greek philosophy, Arabic medicine, and Latin jurisprudence are translated side by side once more."
 oe_wnd.6.a: "Charter Permanent Translation Chambers"
 oe_wnd.6.a.tt: "Advance Research Progress and gain Prestige."
 oe_wnd.6.b: "Open the Reading Galleries to Visiting Scholars"
 oe_wnd.6.b.tt: "Gain Stability and Prestige."
 oe_wnd.7.t: "Al-Azhar Grand College Expansion Dedicated"
 oe_wnd.7.d: "Newly built arcaded courtyards and carved stone towers rise beside Cairo's ancient halls of learning, welcoming students from North Africa, the Levant, and the Red Sea. The senior jurists present their newly bound Great Encyclopedia to the court."
 oe_wnd.7.a: "Grant Royal Endowments to the Faculties"
 oe_wnd.7.a.tt: "Gain Religious Influence and Prestige."
 oe_wnd.7.b: "Circulate the Legal Commentaries Across the Realm"
 oe_wnd.7.b.tt: "Gain Stability and advance Research Progress."
 oe_wnd.8.t: "The Casa di San Giorgio Opens Its Vaults"
 oe_wnd.8.d: "Within the waterfront palace of Genoa, brass scales and leather-bound double-entry ledgers stand ready for business. Merchant houses from Flanders to the Black Sea open clearing accounts, immediately lowering the cost of sovereign credit."
 oe_wnd.8.a: "Issue Sovereign Clearing Notes to Boost the Treasury"
 oe_wnd.8.a.tt: "Gain Gold and Prestige from the inaugural bond subscription."
 oe_wnd.8.b: "Enact Strict Auditing Charters for Long-Term Stability"
 oe_wnd.8.b.tt: "Gain Stability and Prestige."
 oe_wnd.9.t: "Hangzhou Grand Canal Hub Opens to Traffic"
 oe_wnd.9.d: "As the final stone pound lock opens, endless lines of barges laden with Jiangnan rice, raw silk, and celadon porcelain glide northward while coastal merchant halls buzz with foreign trade. Court painters commemorate the spectacle in an exquisite silk scroll."
 oe_wnd.9.a: "Collect Inaugural Canal and Customs Revenues"
 oe_wnd.9.a.tt: "Gain Gold and Prestige from surging commerce."
 oe_wnd.9.b: "Remit First-Year Canal Tolls to Spur Prosperity"
 oe_wnd.9.b.tt: "Gain Stability and Prestige."
 oe_wnd.10.t: "The New House of Wisdom Rises in Baghdad"
 oe_wnd.10.d: "Along the quiet banks of the Tigris where ashes once lay, lecture courts and translation scriptoria ring with lively debate once more. Presenting their newly bound Scientific Corpus, the scholars of Baghdad proclaim a renewed golden age of learning."
 oe_wnd.10.a: "Patronize Physicians and Mathematicians of Every Tongue"
 oe_wnd.10.a.tt: "Advance Research Progress and gain Prestige."
 oe_wnd.10.b: "Celebrate the Civic Rebirth of the City of Peace"
 oe_wnd.10.b.tt: "Gain Stability and Prestige."
 oe_wnd.11.t: "Delhi Imperial Observatory and Library Completed"
 oe_wnd.11.d: "Bands of red sandstone and white marble rise beside the Yamuna as monumental sundials and sighting arcs are calibrated to perfection. Working side by side, Persian and Sanskrit astronomers present their harmonized tables to the throne."
 oe_wnd.11.a: "Apply the New Surveys to Imperial Revenue Assessment"
 oe_wnd.11.a.tt: "Gain Gold and advance Research Progress."
 oe_wnd.11.b: "Reward the Astronomers and Expand the Library"
 oe_wnd.11.b.tt: "Gain Prestige and Stability."
 oe_wnd.12.t: "The Great Maritime Beacon of Zaytun Is Lit"
 oe_wnd.12.d: "As dusk settles over Quanzhou Bay, the beacon fire atop the new granite tower pierces the sea mist. Ocean junks and Arabian dhows glide safely toward the illuminated foreign quarters as master pilots present the completed Zaytun Compass Atlas."
 oe_wnd.12.a: "Distribute the Compass Atlas to Merchant Fleets"
 oe_wnd.12.a.tt: "Gain Gold and Prestige from maritime commerce."
 oe_wnd.12.b: "Guarantee Fair Charters for Foreign Merchants"
 oe_wnd.12.b.tt: "Gain Stability and advance Research Progress."
 oe_wnd.20.t: "Founding of the Constantinian Order of St. George"
 oe_wnd.20.d: "As imperial banners once again command the Aegean and Anatolian heartlands, senior generals and senators petition the throne to institute a permanent chivalric order under the Labarum of Constantine and the emblem of St. George."
 oe_wnd.20.a: "Charter the Order and Invest the Sovereign"
 oe_wnd.20.a.tt: "Activate the Constantinian Order of St. George as our active chivalric order and invest eligible nobles and generals."
 oe_wnd.20.b: "Grant Ceremonial Honors While Retaining Our Current Order"
 oe_wnd.20.b.tt: "Keep our current active chivalric order unchanged while rewarding the army."
 oe_wnd.21.t: "Reconstitution of the Varangian Brotherhood"
 oe_wnd.21.d: "Veteran warriors forged in the martial traditions linking the Bosporus and the northern riverways swear fealty before the throne, seeking charter as a permanent brotherhood of arms modeled upon the legendary Varangian Guard."
 oe_wnd.21.a: "Establish the Varangian Brotherhood as Our Active Order"
 oe_wnd.21.a.tt: "Activate the Varangian Brotherhood as our active chivalric order, strengthening discipline and commanders."
 oe_wnd.21.b: "Reward the Guard Without Changing Our Active Order"
 oe_wnd.21.b.tt: "Keep our current chivalric order while granting military honors."
 oe_wnd.22.t: "Jerusalem Recovered: The Guard of the Holy Sepulchre"
 oe_wnd.22.d: "Bells sound once more from the Church of the Holy Sepulchre as pilgrims return to the gates of Jerusalem. Prelates and commanders propose chartering a dedicated chivalric Guard of the Holy Sepulchre to defend the city forever."
 oe_wnd.22.a: "Consecrate the Guard of the Holy Sepulchre"
 oe_wnd.22.a.tt: "Activate the Guard of the Holy Sepulchre as our active chivalric order."
 oe_wnd.22.b: "Endow the Basilica While Retaining Our Current Order"
 oe_wnd.22.b.tt: "Keep our current chivalric order while endowing Jerusalem's shrines."
 oe_wnd.23.t: "Bastions of the Danube: Imperial Order of the Dragon"
 oe_wnd.23.d: "Commanding the river crossings at Belgrade and Buda, the fortress line of the Danube stands as the shield of the Balkans and Carpathia. Frontier lords propose reconstituting an Imperial Order of the Danubian Dragon to fortify the marches."
 oe_wnd.23.a: "Bestow the Dragon Collar and Activate the Order"
 oe_wnd.23.a.tt: "Activate the Imperial Order of the Danubian Dragon as our active chivalric order."
 oe_wnd.23.b: "Reward the Frontier Garrisons Without Changing Orders"
 oe_wnd.23.b.tt: "Keep our current chivalric order while strengthening Danubian troops."
 oe_wnd.30.t: "Chartering the Athonite Hesychast Order"
 oe_wnd.30.d: "Hegumens of Mount Athos and senior metropolitans petition the throne to charter a formal Orthodox monastic brotherhood, sending contemplatives and copyists across the dioceses. Which primary calling shall we confer upon the new order?"
 oe_wnd.30.a: "Charter Under the Hesychast Contemplation Calling"
 oe_wnd.30.a.tt: "Found the Athonite Hesychast Order at Mount Athos (or an eligible non-capital holding) under the Contemplation calling."
 oe_wnd.30.b: "Charter Under the Monastic Chronicle Calling"
 oe_wnd.30.b.tt: "Found the Athonite Hesychast Order at Mount Athos (or an eligible non-capital holding) under the Chronicle calling."
 oe_wnd.30.c: "Grant Patronage Without Establishing a Formal Order"
 oe_wnd.30.c.tt: "Defer formal chartering while gaining Stability and Religious Influence."
 oe_wnd.31.t: "Consecrating the Orthodox Sepulchre Military Order"
 oe_wnd.31.d: "With Jerusalem or Antioch restored beneath Orthodox banners, frontier commanders and patriarchal legates propose founding a permanent armed monastic order to garrison the holy marches and muster consecrated troops in wartime."
 oe_wnd.31.a: "Charter the Orthodox Sepulchre Military Order"
 oe_wnd.31.a.tt: "Found the Orthodox Sepulchre Military Order at Jerusalem or Antioch (or an eligible non-capital holding), unlocking military order holdings across the eastern marches."
 oe_wnd.31.b: "Keep Frontier Defense Solely Under Imperial Armies"
 oe_wnd.31.b.tt: "Decline the armed monastic charter and bolster regular Army Tradition."
