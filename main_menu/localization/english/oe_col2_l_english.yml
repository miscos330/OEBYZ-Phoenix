 oe_col2_native.2.desc: "As Roman standards rise along the wooded inlets of [SCOPE.sLocation('oe_col2_colony_hub').GetName], envoys of the eastern coastal confederacies arrive bearing wampum belts. Veteran senators counsel reviving the ancient law of the Foederati—binding these proud nations as honored allies to guard our nascent western realm."
