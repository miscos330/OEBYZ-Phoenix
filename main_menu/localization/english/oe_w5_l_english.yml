# NEW 2026-11-22 v16.0 Module 16.0-B: Western Europe 5 Protagonist Pack (oe_w5_, 0 mainline slots, 0 rules, 0 vanilla/D009 overrides). Generated by gen_v160_west_europe.py; edit the generator, not this file.
 oe_w5_gendarmes: "French Royal Gendarmes"
 oe_w5_gendarmes_desc: "Salaried heavy cavalry of the Compagnies d'Ordonnance, clad in articulated plate and trained to shatter infantry squares on open European plains."
 oe_w5_tercio: "Spanish Imperial Tercio"
 oe_w5_tercio_desc: "Mixed pike-and-shot heavy infantry brigades combining bristling pike bastions with rolling arquebus and musket volleys across every theater of Europe."
 oe_w5_redcoats: "British Line Redcoats"
 oe_w5_redcoats_desc: "Steadfast scarlet-coated regular foot drilled to deliver rapid three-rank platoon volleys and stand unbroken under artillery and cavalry assault."
 oe_w5_caravel: "Portuguese Exploration Caravel"
 oe_w5_caravel_desc: "Swift lateen-rigged light vessel pioneered at Sagres to tack against headwinds, chart uncharted coasts, and patrol oceanic spice approaches."
 oe_w5_fluyt: "Dutch Fluyt Merchant Warship"
 oe_w5_fluyt_desc: "High-capacity, lean-crewed Dutch merchant carrier fitted with defensive broadsides, built in Zaanstreek yards to dominate Baltic and colonial freight."
 oe_w5_man_o_war: "Western First-Rate Man-o'-War"
 oe_w5_man_o_war_desc: "Towering multi-decked warship of the great Atlantic admiralties, mounting heavy iron broadsides built to break rival battle lines on the high seas."
 oe_w5_dec_fra_versailles_intendants.title: "Commission the Versailles Intendants"
 oe_w5_dec_fra_versailles_intendants.desc: "Dispatch crown-appointed intendants across every generalite while transforming Versailles into the magnificent seat of French royal authority. Costs 250 gold."
 oe_w5_dec_fra_versailles_intendants.a: "Enact the Intendant Commissions"
 oe_w5_dec_eng_bank_of_england.title: "Charter the Bank of England"
 oe_w5_dec_eng_bank_of_england.desc: "Incorporate a parliament-backed national bank in London to issue reliable credit notes, lower sovereign borrowing rates, and finance naval supremacy. Costs 250 gold."
 oe_w5_dec_eng_bank_of_england.a: "Seal the Threadneedle Charter"
 oe_w5_dec_spa_casa_contratacion.title: "Reform the Casa de Contratacion Fleets"
 oe_w5_dec_spa_casa_contratacion.desc: "Modernize maritime customs registries, convoy escort schedules, and pilot academies in Seville, Cadiz, or Barcelona to guard Iberian ocean trade. Costs 220 gold."
 oe_w5_dec_spa_casa_contratacion.a: "Issue the Convoy Ordinances"
 oe_w5_dec_por_estado_india_armadas.title: "Organize the Estado da India Armadas"
 oe_w5_dec_por_estado_india_armadas.desc: "Establish permanent royal monsoon squadrons rotating out of Lisbon to guard Indian Ocean factories, enforce maritime passes, and protect spice carracks. Costs 220 gold."
 oe_w5_dec_por_estado_india_armadas.a: "Launch the Monsoon Armadas"
 oe_w5_dec_ned_amsterdam_bourse_voc.title: "Charter the Amsterdam Bourse & VOC"
 oe_w5_dec_ned_amsterdam_bourse_voc.desc: "Unite rival Holland and Zeeland chambers under one permanent joint-stock VOC charter paired with Amsterdam's public commodity and share exchange. Costs 220 gold."
 oe_w5_dec_ned_amsterdam_bourse_voc.a: "Open the Bourse & Seal the VOC Charter"
 oe_msn_ned_destiny: "#bold #color_yellow Netherlands: Destiny of the Seven Seas#!#!"
 oe_msn_ned_destiny_DESCRIPTION: "From Holland's Polder Waterways and the Union of Utrecht to VOC Global Dominance"
 oe_msn_ned_destiny_CRITERIA_DESCRIPTION: "Anchor Holland's ports, forge the Seven Provinces Union, command the Scheldt and VOC spice lanes, and crown the Dutch Golden Century."
 oe_msn_ned_destiny_BUTTON_TOOLTIP: "Embark on the Netherlands Destiny"
 oe_msn_ned_destiny_BUTTON_DETAILS: "A twelve-task three-pillar destiny for Holland and the Netherlands: unite the Seven Provinces behind waterline bastions and admiralty squadrons, project Fluyt and VOC trade from Antwerp to the Spice Islands, and crown Amsterdam's Wisselbank, Leiden scholarship, and religious tolerance in the Dutch Golden Century."
 oe_msn_ned_01_holland_waterways: "Polder Waterways: Anchor Holland"
 oe_msn_ned_01_holland_waterways_desc: "Drain tidal marshes and link Amsterdam, The Hague, and Rotterdam with fortified sluice canals to anchor the heartland of the Low Countries."
 oe_msn_ned_01_holland_waterways_req_tt: "Own Amsterdam, The Hague, and Rotterdam with at least 5 Stability."
 oe_msn_ned_02_seven_provinces_union: "Union of the River Provinces"
 oe_msn_ned_02_seven_provinces_union_desc: "Bring Utrecht's cathedral crossroads and Middelburg's Zeeland docks into one federated union of Dutch estates."
 oe_msn_ned_02_seven_provinces_union_req_tt: "Own Utrecht and Middelburg."
 oe_msn_ned_03_waterline_bastions: "Waterline & Barrier Fortresses"
 oe_msn_ned_03_waterline_bastions_desc: "Fortify Arnhem on the Rhine and Groningen in the north with star-shaped earthen bastions and floodgate redoubts."
 oe_msn_ned_03_waterline_bastions_req_tt: "Own Arnhem and Groningen, hold at least 220 Gold, and be in the Age of Discovery or later."
 oe_msn_ned_04_admiralty_broadside: "Admiralties of the Broadside Line"
 oe_msn_ned_04_admiralty_broadside_desc: "Unite provincial admiralty colleges behind standardized line-of-battle warships to contest the North Sea against any rival crown."
 oe_msn_ned_04_admiralty_broadside_req_tt: "Own Amsterdam, have at least 15 Stability, and be in the Age of Reformation or later."
 oe_msn_ned_05_herring_fluyt_ports: "Herring Busses & Zaan Shipyards"
 oe_msn_ned_05_herring_fluyt_ports_desc: "Expand the bustling slipways of Hoorn and Dordrecht to turn out swift herring busses and cheap bulk-carrying fluyts."
 oe_msn_ned_05_herring_fluyt_ports_req_tt: "Own Hoorn and Dordrecht."
 oe_msn_ned_06_scheldt_brabant_nexus: "Command the Scheldt & Brabant"
 oe_msn_ned_06_scheldt_brabant_nexus_desc: "Secure Antwerp and Breda to unify the estuaries of the Rhine, Meuse, and Scheldt under one unmatched commercial entrepot."
 oe_msn_ned_06_scheldt_brabant_nexus_req_tt: "Own Antwerp and Breda."
 oe_msn_ned_07_cape_spice_waypoints: "Oceanic Waypoints Beyond the Cape"
 oe_msn_ned_07_cape_spice_waypoints_desc: "Marshal expanded Low Countries harbors and veteran navigators to project Dutch merchant convoys past the Cape into eastern oceans."
 oe_msn_ned_07_cape_spice_waypoints_req_tt: "Have coastal ports, control at least 18 Locations, and be in the Age of Discovery or later."
 oe_msn_ned_08_voc_batavia_monopoly: "VOC Spice & Maritime Monopoly"
 oe_msn_ned_08_voc_batavia_monopoly_desc: "Anchor overseas spice entrepots at Table Bay, Malacca, or Sunda Kelapa—or command a dominant thirty-location trading realm from Amsterdam."
 oe_msn_ned_08_voc_batavia_monopoly_req_tt: "Own Amsterdam, hold 400 Gold, be in the Age of Reformation or later, and own Sunda Kelapa, Malacca, Table Bay, or at least 30 Locations."
 oe_msn_ned_09_amsterdam_wisselbank: "The Amsterdam Wisselbank"
 oe_msn_ned_09_amsterdam_wisselbank_desc: "Found the municipal exchange bank beneath Amsterdam's town hall, turning bullion deposits into the most trusted currency in Europe."
 oe_msn_ned_09_amsterdam_wisselbank_req_tt: "Own Amsterdam, hold at least 260 Gold, and be in the Age of Discovery or later."
 oe_msn_ned_10_leiden_golden_age: "Leiden University & Golden Age Masters"
 oe_msn_ned_10_leiden_golden_age_desc: "Endow Leiden's academy and patronize master painters, lens-grinders, and cartographers whose works illuminate civic halls across Holland."
 oe_msn_ned_10_leiden_golden_age_req_tt: "Own Leiden and Amsterdam, and be in the Age of Reformation or later."
 oe_msn_ned_11_edict_of_conscience: "Haven of Free Conscience"
 oe_msn_ned_11_edict_of_conscience_desc: "Welcome persecuted printers, philosophers, and skilled weavers into Dutch cities, turning civic tolerance into an engine of innovation."
 oe_msn_ned_11_edict_of_conscience_req_tt: "Own Amsterdam, have at least 15 Stability, and be in the Age of Reformation or later."
 oe_msn_ned_12_dutch_golden_century: "Crown of the Dutch Golden Century"
 oe_msn_ned_12_dutch_golden_century_desc: "With invincible admiralties, global VOC commerce, and unmatched finance and letters, proclaim the zenith of the Dutch Golden Century."
 oe_msn_ned_12_dutch_golden_century_req_tt: "Own Amsterdam, The Hague, and Utrecht, have at least 18 Stability, and be in the Age of Absolutism or later."
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m1: "Admiralty of the Seven Provinces"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m1: "Five provincial admiralties coordinate floodgate waterlines and heavy broadside squadrons guarding every estuary of the Low Countries."
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m2: "VOC Spice Archipelago Monopoly"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m2: "Armed East Indiamen link Amsterdam, Table Bay, Malacca, and Batavia into the richest oceanic spice network on earth."
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m3: "Haven of Conscience & Printing"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m3: "Exiled scholars, master printers, and Huguenot artisans turn Dutch towns into Europe's freest crucible of science and letters."
 STATIC_MODIFIER_NAME_oe_w5_msn_ned_m4: "The Dutch Golden Century"
 STATIC_MODIFIER_DESC_oe_w5_msn_ned_m4: "From polder canals and Wisselbank bullion vaults to global sea lanes, the Republic stands unrivaled in finance, art, and maritime mastery."
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_versailles_intendants: "Intendants of Versailles"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_versailles_intendants: "Crown-appointed intendants bypass provincial parlements to collect royal revenue, audit garrisons, and project Versailles splendor."
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_bank_of_england: "Charter of the Bank of England"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_bank_of_england: "Parliament-backed public credit and liquid banknotes fund continental alliances and worldwide Royal Navy dockyards at unrivaled rates."
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_casa_contratacion: "Reformed Casa de Contratacion"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_casa_contratacion: "Standardized nautical charts, guarded convoy schedules, and audited customs ledgers bind Atlantic treasure fleets to Iberia."
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_estado_india: "Armadas of the Estado da India"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_estado_india: "Annual monsoon armadas rotate between Lisbon, Hormuz, Goa, and Malacca, enforcing maritime passes across the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_w5_mod_dec_amsterdam_voc: "Amsterdam Bourse & VOC Charter"
 STATIC_MODIFIER_DESC_oe_w5_mod_dec_amsterdam_voc: "Joint-stock equity trading and permanent corporate capital unleash Dutch merchantmen across every sea from the Baltic to Banda."
 STATIC_MODIFIER_NAME_oe_w5_mod_compagnies_ordonnance: "Compagnies d'Ordonnance"
 STATIC_MODIFIER_DESC_oe_w5_mod_compagnies_ordonnance: "Permanent salaried companies of armored gendarmes answer directly to the Valois crown, ending reliance on unruly feudal levies."
 STATIC_MODIFIER_NAME_oe_w5_mod_maid_of_orleans: "Banner of Orleans"
 STATIC_MODIFIER_DESC_oe_w5_mod_maid_of_orleans: "The relief of Orleans ignites popular devotion to the lily standard, rallying battered garrisons across the Loire and Champagne."
 STATIC_MODIFIER_NAME_oe_w5_mod_spider_king_web: "Web of the Spider King"
 STATIC_MODIFIER_DESC_oe_w5_mod_spider_king_web: "Royal postal relays, paid informants, and shrewd bourgeois ministers outmaneuver princely leagues without risking ruinous pitched battles."
 STATIC_MODIFIER_NAME_oe_w5_mod_fontainebleau_arts: "School of Fontainebleau"
 STATIC_MODIFIER_DESC_oe_w5_mod_fontainebleau_arts: "Italian masters, royal printers, and chateau architects transform the French court into the northern beacon of Renaissance humanism."
 STATIC_MODIFIER_NAME_oe_w5_mod_wars_of_religion: "Zeal of the Confessional Leagues"
 STATIC_MODIFIER_DESC_oe_w5_mod_wars_of_religion: "Fortified towns and confession-bound militias brace for sectarian strife across the realm, hardening urban defenses amid bitter tension."
 STATIC_MODIFIER_NAME_oe_w5_mod_edict_of_nantes: "Edict of Nantes Settlement"
 STATIC_MODIFIER_DESC_oe_w5_mod_edict_of_nantes: "Guaranteed civic rights and fortified places of refuge allow Protestant and Catholic subjects alike to rebuild war-scarred provinces."
 STATIC_MODIFIER_NAME_oe_w5_mod_richelieu_raison: "Raison d'Etat Administration"
 STATIC_MODIFIER_DESC_oe_w5_mod_richelieu_raison: "Breaking rebellious coastal citadels and subordinating confessional loyalty to state survival forge France into Europe's supreme arbiter."
 STATIC_MODIFIER_NAME_oe_w5_mod_fronde_pacification: "Post-Fronde Royal Ascendancy"
 STATIC_MODIFIER_DESC_oe_w5_mod_fronde_pacification: "Exhausted by aristocratic civil war, provincial magnates submit to royal tribunals while the young king vows never again to flee Paris."
 STATIC_MODIFIER_NAME_oe_w5_mod_sun_king_versailles: "Splendor of the Sun King"
 STATIC_MODIFIER_DESC_oe_w5_mod_sun_king_versailles: "Court ceremonial in the Hall of Mirrors binds the highest dukes to gilded attendance while French etiquette sets the standard for every throne."
 STATIC_MODIFIER_NAME_oe_w5_mod_colbert_mercantilism: "Colbert's Royal Manufactories"
 STATIC_MODIFIER_DESC_oe_w5_mod_colbert_mercantilism: "State-chartered glassworks, tapestries, tariffs, and naval timber reserves convert domestic craftsmanship into sovereign bullion."
 STATIC_MODIFIER_NAME_oe_w5_mod_fontainebleau_edict: "Uniform Faith of the Crown"
 STATIC_MODIFIER_DESC_oe_w5_mod_fontainebleau_edict: "Unifying ecclesiastical courts and parish registers across the kingdom deepens religious homogeneity at the expense of emigrating artisans."
 STATIC_MODIFIER_NAME_oe_w5_mod_mississippi_system: "Paper Credit Experiment"
 STATIC_MODIFIER_DESC_oe_w5_mod_mississippi_system: "Ambitious joint-stock conversion of royal debt temporarily floods Parisian markets with liquidity while testing investors' nerves."
 STATIC_MODIFIER_NAME_oe_w5_mod_fiscal_retrenchment: "Gribeauval & Treasury Audit"
 STATIC_MODIFIER_DESC_oe_w5_mod_fiscal_retrenchment: "Stung by global war debts, royal officers standardize lightweight field guns while comptrollers scrutinize every exempt tax farm."
 STATIC_MODIFIER_NAME_oe_w5_mod_turgot_physiocracy: "Physiocratic Grain & Guild Reform"
 STATIC_MODIFIER_DESC_oe_w5_mod_turgot_physiocracy: "Freeing internal grain shipments and replacing forced peasant road labor with equitable land assessments invigorate the French countryside."
 STATIC_MODIFIER_NAME_oe_w5_mod_estates_general_dawn: "Awakening of the Citizens"
 STATIC_MODIFIER_DESC_oe_w5_mod_estates_general_dawn: "Pamphlets, cahiers of grievances, and civic national guards awaken an unstoppable surge of popular energy across town and countryside."
 STATIC_MODIFIER_NAME_oe_w5_mod_yeoman_longbows: "Yeoman Longbow Ordinances"
 STATIC_MODIFIER_DESC_oe_w5_mod_yeoman_longbows: "Mandatory Sunday archery practice at parish butts breeds disciplined shire bowmen capable of shattering armored chivalry at range."
 STATIC_MODIFIER_NAME_oe_w5_mod_roses_factionalism: "Livery & Maintenance Retinues"
 STATIC_MODIFIER_DESC_oe_w5_mod_roses_factionalism: "Rival dynastic houses arm liveried retainers across York and Lancaster, keeping English captains battle-hardened through bitter faction strife."
 STATIC_MODIFIER_NAME_oe_w5_mod_tudor_star_chamber: "Tudor Court of Star Chamber"
 STATIC_MODIFIER_DESC_oe_w5_mod_tudor_star_chamber: "Swift royal justice suppresses private baronial armies and audits crown estates, ushering in an era of domestic peace and solvent rule."
 STATIC_MODIFIER_NAME_oe_w5_mod_act_of_supremacy: "Royal Supremacy & Crown Lands"
 STATIC_MODIFIER_DESC_oe_w5_mod_act_of_supremacy: "Asserting sovereign jurisdiction over the English Church channels former monastic estates into royal dockyards and loyal gentry hands."
 STATIC_MODIFIER_NAME_oe_w5_mod_elizabethan_armada: "Sea Dogs & Channel Mastery"
 STATIC_MODIFIER_DESC_oe_w5_mod_elizabethan_armada: "Nimble race-built galleons and seasoned privateer captains turn the narrow seas into an impregnable moat around the island realm."
 STATIC_MODIFIER_NAME_oe_w5_mod_east_india_charter: "East India Company Factories"
 STATIC_MODIFIER_DESC_oe_w5_mod_east_india_charter: "Armed merchant syndicates raise fortified trading factories from Surat to Madras, funneling calico, saltpeter, and tea back to London."
 STATIC_MODIFIER_NAME_oe_w5_mod_petition_of_right: "Constitutional Petition Debate"
 STATIC_MODIFIER_DESC_oe_w5_mod_petition_of_right: "Parliamentary insistence on consent for taxation and lawful habeas corpus lays the legal bedrock for accountable governance."
 STATIC_MODIFIER_NAME_oe_w5_mod_navigation_new_model: "New Model Discipline & Navigation Acts"
 STATIC_MODIFIER_DESC_oe_w5_mod_navigation_new_model: "Merit-promoted regiments and statutes reserving colonial cargoes for English hulls forge a formidable military-maritime state."
 STATIC_MODIFIER_NAME_oe_w5_mod_bill_of_rights: "Bill of Rights Constitutionalism"
 STATIC_MODIFIER_DESC_oe_w5_mod_bill_of_rights: "A bloodless constitutional settlement aligns Crown and Parliament, unlocking unprecedented investor confidence and stable coalition diplomacy."
 STATIC_MODIFIER_NAME_oe_w5_mod_threadneedle_credit: "Financial Revolution Credit"
 STATIC_MODIFIER_DESC_oe_w5_mod_threadneedle_credit: "Perpetual funded annuities and transparent Treasury accounts let Britain outspend larger continental rivals without fiscal collapse."
 STATIC_MODIFIER_NAME_oe_w5_mod_act_of_union_1707: "United Kingdom of Great Britain"
 STATIC_MODIFIER_DESC_oe_w5_mod_act_of_union_1707: "A unified Parliament, common customs barrier, and shared imperial market fuse English finance with Scottish regiments and Enlightenment minds."
 STATIC_MODIFIER_NAME_oe_w5_mod_walpole_treasury: "Walpole's Sinking Fund"
 STATIC_MODIFIER_DESC_oe_w5_mod_walpole_treasury: "Restoring confidence after speculative mania, the First Lord of the Treasury curbs reckless bubbles and stewards steady commercial growth."
 STATIC_MODIFIER_NAME_oe_w5_mod_annus_mirabilis: "Year of Miracles Global Supremacy"
 STATIC_MODIFIER_DESC_oe_w5_mod_annus_mirabilis: "Simultaneous victories across the Atlantic, West Africa, and Bengal elevate the Royal Navy to undisputed arbiter of oceanic trade."
 STATIC_MODIFIER_NAME_oe_w5_mod_canal_textile_boom: "Canals, Coal & Spinning Mills"
 STATIC_MODIFIER_DESC_oe_w5_mod_canal_textile_boom: "Inland barge canals haul cheap coal to ironmasters and mechanized cotton mills, igniting the workshop of the world."
 STATIC_MODIFIER_NAME_oe_w5_mod_pax_britannica_dawn: "Dawn of Pax Britannica"
 STATIC_MODIFIER_DESC_oe_w5_mod_pax_britannica_dawn: "Blue-water squadrons patrol Atlantic and Indian Ocean choke points, pairing humanitarian abolition patrols with global commercial hegemony."
 STATIC_MODIFIER_NAME_oe_w5_mod_mesta_hermandad: "Mesta Wool & Santa Hermandad"
 STATIC_MODIFIER_DESC_oe_w5_mod_mesta_hermandad: "Merino wool flocks earn prized Flemish bullion while sworn town brotherhoods clear royal highways of bandits and rogue magnates."
 STATIC_MODIFIER_NAME_oe_w5_mod_granada_capitulation: "Triumph of the Reconquista"
 STATIC_MODIFIER_DESC_oe_w5_mod_granada_capitulation: "The fall of the last Nasrid citadel crowns centuries of crusading endeavor, unleashing veteran captains toward Italy and the western ocean."
 STATIC_MODIFIER_NAME_oe_w5_mod_iberian_dynastic_concord: "Iberian Dynastic Concord"
 STATIC_MODIFIER_DESC_oe_w5_mod_iberian_dynastic_concord: "Shared chancelleries and dynastic marriage treaties harmonize Castilian manpower with Aragonese Mediterranean fleets without erasing fueros."
 STATIC_MODIFIER_NAME_oe_w5_mod_seville_contratacion: "Seville Pilots & Nautical Registry"
 STATIC_MODIFIER_DESC_oe_w5_mod_seville_contratacion: "Royal cosmographers on the Guadalquivir train master navigators and license every caravel and galleon bound for the Indies."
 STATIC_MODIFIER_NAME_oe_w5_mod_school_of_salamanca: "School of Salamanca Jurisprudence"
 STATIC_MODIFIER_DESC_oe_w5_mod_school_of_salamanca: "Jurists and theologians formulate international law and the quantity theory of money, tempering bullion shocks with scholarly rigor."
 STATIC_MODIFIER_NAME_oe_w5_mod_potosi_silver_fleets: "Quinto Real Silver Flotas"
 STATIC_MODIFIER_DESC_oe_w5_mod_potosi_silver_fleets: "Biannual treasure convoys from Veracruz and Cartagena pour silver reales into European banks, funding tercios from Naples to Antwerp."
 STATIC_MODIFIER_NAME_oe_w5_mod_imperial_tercios: "Ordinance of the Imperial Tercios"
 STATIC_MODIFIER_DESC_oe_w5_mod_imperial_tercios: "Interlocking pike squares bristling with arquebus sleeves prove virtually unbreakable across the battlefields of Italy and the Low Countries."
 STATIC_MODIFIER_NAME_oe_w5_mod_lepanto_triumph: "Victors of Lepanto"
 STATIC_MODIFIER_DESC_oe_w5_mod_lepanto_triumph: "Heavy cannon galleasses and boarding tercios shatter rival Mediterranean mastery, securing Iberian shipping lanes from Sicily to Valencia."
 STATIC_MODIFIER_NAME_oe_w5_mod_armada_rebuild: "Atlantic Galleon Reconstruction"
 STATIC_MODIFIER_DESC_oe_w5_mod_armada_rebuild: "Bitter lessons from northern gales spur Cantabrian and Andalusian yards to build sleeker, lower-slung escort galleons for the Indies run."
 STATIC_MODIFIER_NAME_oe_w5_mod_castilian_arbitristas: "Arbitrista Fiscal Remedies"
 STATIC_MODIFIER_DESC_oe_w5_mod_castilian_arbitristas: "Reformist pamphleteers urge crown treasurers to curb copper debasement, protect domestic looms, and repopulate deserted plateau villages."
 STATIC_MODIFIER_NAME_oe_w5_mod_union_of_arms: "Olivares Union of Arms"
 STATIC_MODIFIER_DESC_oe_w5_mod_union_of_arms: "Pooling military quotas across every constituent kingdom swells imperial reserves while testing the delicate patience of provincial estates."
 STATIC_MODIFIER_NAME_oe_w5_mod_westphalia_retrench: "Westphalian Diplomatic Retrenchment"
 STATIC_MODIFIER_DESC_oe_w5_mod_westphalia_retrench: "Recognizing Dutch sovereignty ends an eighty-year fiscal hemorrhage, letting Madrid refocus its garrisons on Italy and the Americas."
 STATIC_MODIFIER_NAME_oe_w5_mod_nueva_planta_decrees: "Bourbon Nueva Planta Decrees"
 STATIC_MODIFIER_DESC_oe_w5_mod_nueva_planta_decrees: "Unified ministries, royal captain-generals, and standardized provincial taxation knit the disparate Iberian realms into one modern crown."
 STATIC_MODIFIER_NAME_oe_w5_mod_charles_iii_reforms: "Enlightened Free Trade Ordinances"
 STATIC_MODIFIER_DESC_oe_w5_mod_charles_iii_reforms: "Opening colonial trade to thirteen Iberian ports, sponsoring economic societies, and paving royal roads revitalize Spain's transatlantic empire."
 STATIC_MODIFIER_NAME_oe_w5_mod_avis_aljubarrota: "Square of Aljubarrota"
 STATIC_MODIFIER_DESC_oe_w5_mod_avis_aljubarrota: "Dismounted knights and English archers secure the House of Avis on the battlefield, cementing Portuguese sovereignty and maritime resolve."
 STATIC_MODIFIER_NAME_oe_w5_mod_sagres_navigation: "Sagres Caravel Charts"
 STATIC_MODIFIER_DESC_oe_w5_mod_sagres_navigation: "Lateen-rigged caravels, astrolabes, and wind-gyre notebooks unlock the African coast and the island archipelagos of the Atlantic."
 STATIC_MODIFIER_NAME_oe_w5_mod_cape_india_route: "Carreira da India Sea Route"
 STATIC_MODIFIER_DESC_oe_w5_mod_cape_india_route: "Rounding the Cape of Good Hope bypasses Levantine middlemen altogether, bringing Malabar pepper directly to the docks of the Tagus."
 STATIC_MODIFIER_NAME_oe_w5_mod_tordesillas_meridian: "Meridian of Tordesillas"
 STATIC_MODIFIER_DESC_oe_w5_mod_tordesillas_meridian: "Papal-brokered hemispheric partition safeguards Portuguese title to the African sea lane, the Indian Ocean, and the Brazilian coast."
 STATIC_MODIFIER_NAME_oe_w5_mod_albuquerque_forts: "Chokepoints of Albuquerque"
 STATIC_MODIFIER_DESC_oe_w5_mod_albuquerque_forts: "Fortified stone citadels at Hormuz, Goa, and Malacca turn a small Atlantic kingdom into the armed toll-keeper of Asian seas."
 STATIC_MODIFIER_NAME_oe_w5_mod_casa_da_india: "Royal Spice Ledger of Casa da India"
 STATIC_MODIFIER_DESC_oe_w5_mod_casa_da_india: "Every bale of clove, cinnamon, and nutmeg passes through Lisbon's royal clearinghouse, funding renaissance monasteries and carrack fleets."
 STATIC_MODIFIER_NAME_oe_w5_mod_sebastian_regency: "Vigil of the Regency Council"
 STATIC_MODIFIER_DESC_oe_w5_mod_sebastian_regency: "After disaster across the strait, surviving magistrates rally coastal garrisons and guard Portuguese charters against foreign encroachment."
 STATIC_MODIFIER_NAME_oe_w5_mod_tomar_charter: "Statutes of the Cortes of Tomar"
 STATIC_MODIFIER_DESC_oe_w5_mod_tomar_charter: "Insisting on Portuguese-only offices, coinage, and overseas governors preserves national identity and Brazilian sugar fleets intact."
 STATIC_MODIFIER_NAME_oe_w5_mod_braganza_restoration: "Acclamation of the House of Braganza"
 STATIC_MODIFIER_DESC_oe_w5_mod_braganza_restoration: "Conspirators seize Lisbon's palace in a single December morning, restoring native kingship and rebuilding border star-fortresses."
 STATIC_MODIFIER_NAME_oe_w5_mod_methuen_commerce: "Douro Vineyards & Atlantic Pact"
 STATIC_MODIFIER_DESC_oe_w5_mod_methuen_commerce: "Preferred access for Douro port wine in London and Royal Navy escort protection anchor Portuguese Atlantic prosperity."
 STATIC_MODIFIER_NAME_oe_w5_mod_lisbon_relief: "Emergency Relief of the Tagus"
 STATIC_MODIFIER_DESC_oe_w5_mod_lisbon_relief: "Disciplined patrols prevent looting, clear harbor rubble, and ship emergency timber and grain to shelter survivors along the river."
 STATIC_MODIFIER_NAME_oe_w5_mod_pombaline_rebuild: "Pombaline Grid & Modern Academy"
 STATIC_MODIFIER_DESC_oe_w5_mod_pombaline_rebuild: "Earthquake-resistant timber cages, rational Baixa avenues, and reformed Coimbra science curricula remake Portugal for the Enlightenment."
 STATIC_MODIFIER_NAME_oe_w5_mod_holland_herring_fleet: "Great Fishery Herring Busses"
 STATIC_MODIFIER_DESC_oe_w5_mod_holland_herring_fleet: "Salt-curing catches at sea turns North Sea herring fleets into Holland's mother-trade, nurturing generations of hardy skippers and shipwrights."
 STATIC_MODIFIER_NAME_oe_w5_mod_great_privilege: "Charters of the Great Privilege"
 STATIC_MODIFIER_DESC_oe_w5_mod_great_privilege: "Town magistrates and provincial estates assert their right to convene freely and consent to taxes, defending Low Countries civic liberties."
 STATIC_MODIFIER_NAME_oe_w5_mod_eighty_years_resolve: "Defiance of the Low Countries"
 STATIC_MODIFIER_DESC_oe_w5_mod_eighty_years_resolve: "Besieged towns flood their own polders rather than yield conscience and civic charter, forging unbreakable Dutch civic solidarity."
 STATIC_MODIFIER_NAME_oe_w5_mod_sea_beggars_brill: "Watergeuzen Coastal Raiders"
 STATIC_MODIFIER_DESC_oe_w5_mod_sea_beggars_brill: "Shallow-draft privateer flotillas seize fortified river ports and choke enemy supply barges across Zeeland and Holland."
 STATIC_MODIFIER_NAME_oe_w5_mod_union_of_utrecht: "Covenant of the Union of Utrecht"
 STATIC_MODIFIER_DESC_oe_w5_mod_union_of_utrecht: "Seven northern provinces pledge mutual defense and freedom of private conscience, birthing a federated mercantile republic."
 STATIC_MODIFIER_NAME_oe_w5_mod_voc_global_charter: "Charter of the United East India Company"
 STATIC_MODIFIER_DESC_oe_w5_mod_voc_global_charter: "Empowered to wage war, mint coins, and build forts east of the Cape, the VOC sweeps Asian spice waters under orange banners."
 STATIC_MODIFIER_NAME_oe_w5_mod_amsterdam_wisselbank: "Wisselbank Bullion Clearinghouse"
 STATIC_MODIFIER_DESC_oe_w5_mod_amsterdam_wisselbank: "Guaranteed bank florins and instant ledger transfers draw European silver and merchant bills to the Dam Square vaults."
 STATIC_MODIFIER_NAME_oe_w5_mod_fluyt_supremacy: "Zaanstreek Sawmills & Fluyt Fleets"
 STATIC_MODIFIER_DESC_oe_w5_mod_fluyt_supremacy: "Wind-powered sawmills assemble pear-shaped fluyts at half rival cost, carrying Baltic grain and Atlantic timber with lean crews."
 STATIC_MODIFIER_NAME_oe_w5_mod_synod_of_dort: "States Translation & Reformed Concord"
 STATIC_MODIFIER_DESC_oe_w5_mod_synod_of_dort: "The States Bible standardizes the Dutch vernacular across every province while settling heated theological disputes inside the Republic."
 STATIC_MODIFIER_NAME_oe_w5_mod_tulip_regulation: "Haarlem Contract Arbitration"
 STATIC_MODIFIER_DESC_oe_w5_mod_tulip_regulation: "Cool-headed municipal judges convert ruinous bulb futures into modest settlement fees, shielding real commerce from speculative contagion."
 STATIC_MODIFIER_NAME_oe_w5_mod_peace_of_munster: "Sovereign Recognition at Munster"
 STATIC_MODIFIER_DESC_oe_w5_mod_peace_of_munster: "Full international recognition closes the Eighty Years' War and locks Scheldt shipping advantages firmly in Dutch hands."
 STATIC_MODIFIER_NAME_oe_w5_mod_de_ruyter_admiralty: "Line-of-Battle Tactics of De Ruyter"
 STATIC_MODIFIER_DESC_oe_w5_mod_de_ruyter_admiralty: "Signal flags, disciplined gunnery drills, and daring estuary raids carry Dutch admirals to legendary renown across the North Sea."
 STATIC_MODIFIER_NAME_oe_w5_mod_rampjaar_waterline: "Hollandic Waterline Defense"
 STATIC_MODIFIER_DESC_oe_w5_mod_rampjaar_waterline: "Inundating low meadows turns Holland into a fortified island while revived stadtholder leadership rallies Europe against continental hegemony."
 STATIC_MODIFIER_NAME_oe_w5_mod_batavian_patriots: "Patriot Civic Militias & Constitutional Dawn"
 STATIC_MODIFIER_DESC_oe_w5_mod_batavian_patriots: "Enlightened burgher clubs, exercise companies, and modern constitutional codification propel the Low Countries into the revolutionary age."
 oe_w5.1.title: "The Compagnies d'Ordonnance"
 oe_w5.1.desc: "Decades of devastation by unpaid mercenary bands have convinced royal counselors that France can no longer trust feudal summonses alone. Creating permanent salaried companies of armored gendarmes financed by a standing royal taille would forge Europe's first modern standing army, though proud provincial lords fear the erosion of their ancient military privileges."
 oe_w5.1.a: "Establish permanent royal gendarmes under crown pay"
 oe_w5.1.b: "Preserve feudal ban-and-arriere-ban levies with noble stipends"
 oe_w5.2.title: "The Maid of Orleans & Recovery of the Loire"
 oe_w5.2.desc: "From the eastern marches of Lorraine comes a peasant visionary bearing a white banner embroidered with golden lilies, rallying exhausted garrisons along the Loire valley. Her fearless charge breaks the siege lines around Orleans and electrifies common folk and captains alike across the embattled kingdom."
 oe_w5.2.a: "Raise the sacred banner of Orleans and press the offensive"
 oe_w5.2.b: "Channel the surge of devotion into steady diplomacy and garrison pay"
 oe_w5.3.title: "The Spider King & the League of the Public Weal"
 oe_w5.3.desc: "Alarmed by the crown's relentless absorption of appanages and border counties, great feudal dukes band together in a League of the Public Weal. Rather than stake the monarchy on chivalric bravado, shrewd royal ministers propose spinning a tireless web of postal relays, merchant alliances, and secret pensions to splinter the princely coalition from within."
 oe_w5.3.a: "Spin the Spider King's web of royal relays and bourgeois ministers"
 oe_w5.3.b: "Grant selective charters to appease the provincial dukes"
 oe_w5.4.title: "Fontainebleau & the French Renaissance"
 oe_w5.4.desc: "Returning from Italian campaigns dazzled by marble galleries and humanist libraries, the Valois court invites renowned painters, sculptors, and classical scholars to Fontainebleau. Funding royal colleges and the French vernacular in official decrees will elevate Parisian letters to continental eminence, though the royal treasury is already strained by war."
 oe_w5.4.a: "Patronize the School of Fontainebleau and the Royal College"
 oe_w5.4.b: "Redirect patronage budgets into frontier cannon foundries"
 oe_w5.5.title: "Wars of Religion & the Bell of St. Bartholomew"
 oe_w5.5.desc: "Bitter confessional rivalry between Catholic magnates and Huguenot nobles has turned provincial towns into armed camps. As wedding bells in Paris give way to midnight tocsins and barricaded streets, the crown faces an agonizing choice between hardening confessional defense leagues or empowering royal politiques to seek civic peace."
 oe_w5.5.a: "Fortify royal towns and enforce confessional security"
 oe_w5.5.b: "Empower the Politiques to broker local truces across provinces"
 oe_w5.6.title: "The Edict of Nantes"
 oe_w5.6.desc: "After three decades of ruinous civil war, weary provinces yearn for plowshares and open roads. Promulgating a royal edict at Nantes granting civil equality, royal courts, and worship rights to religious minorities can knit France back together and unleash a remarkable economic recovery."
 oe_w5.6.a: "Seal the Edict of Nantes and bind the realm in civic peace"
 oe_w5.6.b: "Issue narrow temporary truces while keeping strict ecclesiastical courts"
 oe_w5.7.title: "Cardinal Richelieu & the Siege of La Rochelle"
 oe_w5.7.desc: "Determined to brook no state within a state, the king's chief minister directs a colossal stone seawall across the harbor mouth of defiant La Rochelle while forging pragmatic alliances abroad. Razing autonomous fortresses will place every French province squarely beneath royal reason of state."
 oe_w5.7.a: "Enforce Raison d'Etat and dismantle independent citadels"
 oe_w5.7.b: "Accept municipal submission in exchange for maritime trade dues"
 oe_w5.8.title: "The Fronde: Revolt of Parlements and Princes"
 oe_w5.8.desc: "War taxes and encroaching royal intendants provoke first the magistrates of the Parlement of Paris and then great princes of the blood into open insurrection. Barricades rise along the Seine as the regency faces the supreme test of royal sovereignty before the young monarch comes of age."
 oe_w5.8.a: "Break the Frondeur coalition and assert supreme royal courts"
 oe_w5.8.b: "Confirm traditional Parlement remonstrance rights to restore calm"
 oe_w5.9.title: "The Sun King & the Palace of Versailles"
 oe_w5.9.desc: "From a modest hunting lodge southwest of Paris rises a breathtaking gilded palace surrounded by geometric gardens and mirrored galleries. Drawing the realm's proudest noble houses into splendid attendance at Versailles neutralizes provincial rebellion and broadcasts French cultural preeminence across Europe."
 oe_w5.9.a: "Make Versailles the radiant center of European absolutism"
 oe_w5.9.b: "Keep the court in Paris and spend the sums on Vauban border forts"
 oe_w5.10.title: "Colbert & the Mercantilist State"
 oe_w5.10.desc: "Controller-General Jean-Baptiste Colbert argues that European wealth is a finite pool of silver won only through superior domestic industry, protective tariffs, and a blue-water royal fleet. Founding royal tapestries, mirrors, and dockyards at Brest and Toulon promises surging state revenue."
 oe_w5.10.a: "Charter Colbert's royal manufactories, tariffs, and naval arsenals"
 oe_w5.10.b: "Lower customs barriers to stimulate Atlantic and Levantine merchant houses"
 oe_w5.11.title: "The Revocation of Nantes Debate"
 oe_w5.11.desc: "Zealous court prelates urge the monarch to crown royal absolutism with the motto 'One King, One Law, One Faith' by revoking the Edict of Nantes at Fontainebleau. Yet commercial ministers warn that driving out tens of thousands of skilled Huguenot weavers, clockmakers, and naval officers would enrich rival Holland, Britain, and Prussia."
 oe_w5.11.a: "Promulgate uniform faith across the kingdom"
 oe_w5.11.b: "Uphold civic toleration to retain France's skilled artisans and officers"
 oe_w5.12.title: "The Mississippi Scheme & Rue Quincampoix Frenzy"
 oe_w5.12.desc: "Scottish financier John Law promises to liquidate France's crushing war debts overnight by merging the royal bank with a monopoly company over Louisiana. Speculators throng Rue Quincampoix bidding share prices into the clouds while sober auditors warn that unbacked paper notes threaten a catastrophic crash."
 oe_w5.12.a: "Back Law's paper credit experiment and absorb the debt shock"
 oe_w5.12.b: "Cap banknote issuance early and audit colonial accounts before collapse"
 oe_w5.13.title: "Seven Years' War Fiscal Reckoning"
 oe_w5.13.desc: "Simultaneous land campaigns in Germany and naval defeats across Canada and India have pushed the French treasury to the brink. Even as creditors clamor for repayment, artillery inspector Jean-Baptiste de Gribeauval presents standardized lightweight field cannons capable of transforming French battlefields."
 oe_w5.13.a: "Fund Gribeauval's artillery reform and audit the tax farms"
 oe_w5.13.b: "Borrow emergency war loans from Parisian financiers to hold the line"
 oe_w5.14.title: "The Physiocrats & Turgot's Six Edicts"
 oe_w5.14.desc: "Inspired by Francois Quesnay and Enlightenment salons, newly appointed finance minister Anne Robert Jacques Turgot unveils six bold edicts abolishing guild monopolies, freeing internal grain trade, and replacing peasant road corvee with a universal land tax. Privileged noble courts rally furiously to block his pen."
 oe_w5.14.a: "Stand behind Turgot's Physiocratic edicts against court opposition"
 oe_w5.14.b: "Dismiss the radical edicts to preserve traditional noble harmony"
 oe_w5.15.title: "Convocation of the Estates-General"
 oe_w5.15.desc: "Facing insolvent budgets and bitter winter harvests, the crown summons the Estates-General for the first time in nearly two centuries. Thousands of provincial cahiers arrive in Paris demanding constitutional charters, equal taxation, and national citizenship—an electric hour that will remake France and all of Europe."
 oe_w5.15.a: "Embrace constitutional reform and national citizen armies"
 oe_w5.15.b: "Defend royal prerogative and negotiate a cautious aristocratic charter"
 oe_w5.16.title: "Yeoman Longbowmen & the Statute of Laborers"
 oe_w5.16.desc: "In the wake of plague depopulation and victorious campaigns across the Channel, Westminster debates both rural wage statutes and royal decrees mandating yew-bow archery practice in every English parish. Disciplined shire yeomen armed with six-foot longbows remain the realm's deadliest shield."
 oe_w5.16.a: "Enforce parish archery ordinances and drill shire yeoman companies"
 oe_w5.16.b: "Tighten the Statute of Laborers to protect manorial estates"
 oe_w5.17.title: "The Wars of the Roses"
 oe_w5.17.desc: "Factional feuds between royal cousins of York and Lancaster erupt into armed clashes from St. Albans to Towton as noble houses muster liveried retainers across the shires. Though the dynastic struggle scars the countryside, ruthless battlefield experience hardens English commanders."
 oe_w5.17.a: "Marshal royal retainers to crush rival magnates in the field"
 oe_w5.17.b: "Purchase a parliamentary truce through merchant loans in London"
 oe_w5.18.title: "Bosworth Field & the Tudor Settlement"
 oe_w5.18.desc: "The union of the red and white roses closes a generation of civil strife. Empowering the royal Court of Star Chamber to ban private baronial armies, collect chamber revenues directly, and bind justices of the peace to Westminster promises durable Tudor peace."
 oe_w5.18.a: "Empower the Star Chamber and disarm noble private retinues"
 oe_w5.18.b: "Celebrate reconciliation with generous noble pardons and cloth charters"
 oe_w5.19.title: "The Act of Supremacy & English Reformation"
 oe_w5.19.desc: "Parliamentary statutes declare the monarch supreme head of the Church of England, severing fiscal and judicial appeals to Rome. Dissolving wealthy monastic lands can fund coastal artillery forts and a permanent royal navy, though traditional parishes recoil from sudden change."
 oe_w5.19.a: "Enact Royal Supremacy and channel monastic wealth into the Crown"
 oe_w5.19.b: "Preserve autonomous ecclesiastical courts and seek moderate reform"
 oe_w5.20.title: "Elizabethan Sea Dogs & the Channel Armada"
 oe_w5.20.desc: "Signal beacons blaze along the southern cliffs from Plymouth to Dover as a towering invasion fleet enters the English Channel. Faster race-built galleons, long-range culverins, and midnight fireships off Gravelines scatter the rival armada into northern gales, inaugurating England's oceanic destiny."
 oe_w5.20.a: "Unleash the Sea Dogs and expand the race-built Royal Navy"
 oe_w5.20.b: "Spend the victory windfall fortifying coastal dockyards and London guilds"
 oe_w5.21.title: "Charter of the East India Company (1600)"
 oe_w5.21.desc: "On the final day of the century, London merchants petition the Crown for a royal monopoly over trade east of the Cape of Good Hope. Armed joint-stock voyages promise direct access to Indian textiles, Persian silk, and Indonesian spices—breaking Iberian and Dutch chokeholds alike."
 oe_w5.21.a: "Grant the royal East India charter and back overseas factories"
 oe_w5.21.b: "Keep Asian ventures open to competing provincial merchant syndicates"
 oe_w5.22.title: "Petition of Right & the Gathering Civil War"
 oe_w5.22.desc: "Forced loans, billeting of troops, and ship-money levies bring Westminster into head-on collision with royal prerogative. As the Commons presents the Petition of Right and rival pamphlets inflame Cavaliers and Roundheads alike, the kingdom must define where sovereign law truly rests."
 oe_w5.22.a: "Accept the Petition of Right and govern through parliamentary consent"
 oe_w5.22.b: "Raise royal standards to defend traditional crown prerogative"
 oe_w5.23.title: "The New Model Army & Navigation Acts"
 oe_w5.23.desc: "Forged in the crucible of civil war, a professional national army promoted by merit rather than birth now guards the British Isles while Westminster passes sweeping Navigation Acts requiring colonial goods to travel in English hulls. Dutch rivals bristle at the maritime challenge."
 oe_w5.23.a: "Maintain professional New Model regiments and strict Navigation Acts"
 oe_w5.23.b: "Demobilize standing regiments early to ease county tax burdens"
 oe_w5.24.title: "The Glorious Revolution & Bill of Rights (1689)"
 oe_w5.24.desc: "Without plunging England back into civil slaughter, parliamentary leaders enact the Bill of Rights—guaranteeing free elections, parliamentary oversight of armies and taxes, and lawful liberty. European statesmen watch in astonishment as constitutional monarchy proves far stronger in war and credit than absolutism."
 oe_w5.24.a: "Enshrine the Bill of Rights as the bedrock of constitutional monarchy"
 oe_w5.24.b: "Retain broader executive discretion for wartime foreign alliances"
 oe_w5.25.title: "Founding of the Bank of England (1694)"
 oe_w5.25.desc: "With naval war raging across the Channel, subscribers raise over a million pounds in twelve days to incorporate the Governor and Company of the Bank of England on Threadneedle Street. Backed by parliamentary taxation, this financial revolution unlocks cheap perpetual credit for generations."
 oe_w5.25.a: "Establish the funded National Debt and Threadneedle banknotes"
 oe_w5.25.b: "Restrict bank privileges to conservative bullion reserves"
 oe_w5.26.title: "The Act of Union (1707)"
 oe_w5.26.desc: "Commissioners from Westminster and Edinburgh draft a historic Treaty of Union merging English capital and colonial access with Scottish military valor, ports, and universities under one Parliament and Union Jack. United Great Britain emerges as a premier oceanic superpower."
 oe_w5.26.a: "Ratify the Treaty of Union and open imperial trade across Britain"
 oe_w5.26.b: "Grant generous transitional customs rebates to win northern hearts"
 oe_w5.27.title: "The South Sea Bubble & Walpole's Ministry"
 oe_w5.27.desc: "Euphoric speculation in South Sea Company shares collapses into panic on Exchange Alley, ruining peers and widows alike. Stepping into the storm, Robert Walpole restores Treasury solvency with a disciplined sinking fund and emerges as Britain's first de facto Prime Minister."
 oe_w5.27.a: "Entrust Walpole's cabinet with the Sinking Fund and peace policy"
 oe_w5.27.b: "Bail out distressed London merchant houses from royal reserves"
 oe_w5.28.title: "Annus Mirabilis: Seven Years' War Triumph"
 oe_w5.28.desc: "Church bells ring out across Britain as dispatches celebrate victory at Quebec, Quiberon Bay, Minden, and Bengal in a single dazzling year. By subsidizing continental allies while unleashing the Royal Navy globally, Britain commands the sea lanes of both hemispheres."
 oe_w5.28.a: "Press global maritime supremacy from the St. Lawrence to Bengal"
 oe_w5.28.b: "Consolidate colonial administration and retire wartime debts early"
 oe_w5.29.title: "Canals, Steam & the Textile Industrial Boom"
 oe_w5.29.desc: "Barges glide along newly cut Bridgewater canals hauling cheap Lancashire coal to coke-fired ironworks, spinning jennies, and James Watt's improved steam engines. Britain's industrial output is leaping ahead of every rival realm on earth."
 oe_w5.29.a: "Back private canal trusts, ironmasters, and patent protection"
 oe_w5.29.b: "Tax industrial profits heavily to fund rural parish relief"
 oe_w5.30.title: "The Abolition Debate & Dawn of Pax Britannica"
 oe_w5.30.desc: "After decades of tireless petitions led by William Wilberforce and civic abolition committees, Parliament votes on outlawing the oceanic slave trade and dispatching Royal Navy squadrons to enforce the ban across Atlantic waves, framing British maritime hegemony as a moral order."
 oe_w5.30.a: "Pass the Abolition Act and launch Atlantic enforcement patrols"
 oe_w5.30.b: "Phase out plantation monopolies gradually to shield West Indian planters"
 oe_w5.31.title: "The Mesta Wool Guild & Santa Hermandad"
 oe_w5.31.desc: "Millions of prized merino sheep migrate seasonally along royal drovers' roads across the Meseta, yielding fine wool coveted in Flanders and Italy. Pairing Mesta privileges with sworn town brotherhoods policing the highways promises lucrative export customs and orderly countryside."
 oe_w5.31.a: "Protect Mesta wool highways and commission the Santa Hermandad"
 oe_w5.31.b: "Favor arable village commons over migratory flocks"
 oe_w5.32.title: "Finale of the Reconquista at Granada"
 oe_w5.32.desc: "With royal artillery hammering mountain fortresses and the Alhambra's keys surrendered at last, the long Iberian Reconquista reaches its historic climax. Veteran soldiers, jurists, and navigators now look beyond the Pillars of Hercules toward both the Mediterranean and the western ocean."
 oe_w5.32.a: "Proclaim the triumph of Granada and reward veteran captains"
 oe_w5.32.b: "Honor generous capitulation charters to preserve Andalusian crafts"
 oe_w5.33.title: "Iberian Dynastic Concord"
 oe_w5.33.desc: "Whether bound by royal marriage or parallel chancelleries, the crowns of Castile and Aragon discover immense strategic synergy: Castilian silver and infantry fused with Aragonese Mediterranean sea power. Structuring a balanced dynastic concord respects regional charters while amplifying collective diplomatic weight."
 oe_w5.33.a: "Harmonize royal councils while honoring provincial fueros"
 oe_w5.33.b: "Press rapid Castilian administrative uniformity across the peninsula"
 oe_w5.34.title: "The Casa de Contratacion in Seville"
 oe_w5.34.desc: "To regulate the booming Atlantic trade, royal jurists establish the Casa de Contratacion along the Guadalquivir. Its Master Pilot maintains the secret Padron Real master chart, trains ocean navigators, and inspects every merchant cargo clearing for the Indies."
 oe_w5.34.a: "Endow the Seville Pilot Academy and Royal Nautical Registry"
 oe_w5.34.b: "License regional Mediterranean and Cantabrian ports alongside Seville"
 oe_w5.35.title: "The School of Salamanca & Economic Thought"
 oe_w5.35.desc: "At the University of Salamanca, Francisco de Vitoria and Martin de Azpilcueta lecture on the law of nations, indigenous rights, and the startling insight that floods of silver bullion raise prices across Europe. Supporting their academy equips the monarchy with Europe's sharpest legal and monetary minds."
 oe_w5.35.a: "Patronize the School of Salamanca and adopt sound monetary counsel"
 oe_w5.35.b: "Limit university debate to orthodox theology alone"
 oe_w5.36.title: "Silver Fleets of Potosi & Zacatecas"
 oe_w5.36.desc: "Rich mountain veins in Peru and New Spain disgorge torrential streams of silver refined by mercury amalgamation. Armed royal flotas sail twice yearly across the Atlantic, flooding royal coffers with hard bullion even as merchants warn of mounting price inflation."
 oe_w5.36.a: "Expand the Royal Fifth convoy system to fund imperial hegemony"
 oe_w5.36.b: "Divert bullion surpluses into domestic textile mills and debt retirement"
 oe_w5.37.title: "Ordinance of the Imperial Tercios"
 oe_w5.37.desc: "Drawing lessons from the Italian Wars, veteran commanders fuse dense squares of eighteen-foot pikemen with flanking sleeves of arquebusiers and musketeers into permanent three-thousand-man regiments. Known as Tercios, these iron formations become the terror of European battlefields."
 oe_w5.37.a: "Adopt the Tercio ordinance across all royal infantry regiments"
 oe_w5.37.b: "Invest in lighter frontier cavalry and coastal garrison militias"
 oe_w5.38.title: "Triumph of the Holy League at Lepanto"
 oe_w5.38.desc: "In the Gulf of Patras, Christian galleys and Venetian heavy cannon galleasses clash with rival Mediterranean armadas in the grandest oar-driven sea battle of the age. Veteran Spanish tercios storming enemy decks turn the tide, filling cathedrals from Madrid to Naples with thanksgiving."
 oe_w5.38.a: "Press Mediterranean galley mastery and honor the victors of Lepanto"
 oe_w5.38.b: "Shift naval funds toward high-seas Atlantic escort galleons"
 oe_w5.39.title: "Tempest over the Invincible Armada"
 oe_w5.39.desc: "Fireships off Flanders and howling North Atlantic gales shatter the grand enterprise against northern seas, strewing proud galleons along rocky Scottish and Irish coasts. Undaunted shipwrights in Biscay and Havana pledge to forge faster, lower-built escort warships from the lessons of disaster."
 oe_w5.39.a: "Rebuild the Atlantic escort navy with sleeker Basque galleons"
 oe_w5.39.b: "Conserve treasury reserves and rely on fortified Caribbean harbors"
 oe_w5.40.title: "Arbitristas & the Castilian Depopulation Crisis"
 oe_w5.40.desc: "Plague waves, overseas emigration, heavy alcabala sales taxes, and abrupt expulsions of industrious rural farmers leave entire valleys in Valencia and Castile fallow. Reformist writers known as arbitristas flood Madrid with urgent proposals to revive domestic workshops and sound coinage."
 oe_w5.40.a: "Heed the arbitristas: stabilize coinage and revive Castilian workshops"
 oe_w5.40.b: "Maintain rigid orthodoxy and levy emergency vellon copper issues"
 oe_w5.41.title: "Olivares & the Union of Arms"
 oe_w5.41.desc: "Exhausted Castile has shouldered the imperial war budget almost alone for a century. Count-Duke Olivares proposes a sweeping Union of Arms obligating Aragon, Catalonia, Portugal, Naples, and Milan to fund a shared standing reserve—yet proud provincial cortes fiercely resist centralized quotas."
 oe_w5.41.a: "Enforce the Union of Arms to mobilize imperial manpower reserves"
 oe_w5.41.b: "Negotiate voluntary subsidies through provincial cortes instead"
 oe_w5.42.title: "Peace of Westphalia & Imperial Retrenchment"
 oe_w5.42.desc: "After decades of unbroken warfare across Flanders, Germany, and the Pyrenees, plenipotentiaries in Munster offer honorable peace ending the endless northern quagmire. Accepting realistic boundaries frees Spain to heal its fiscal wounds and defend its Atlantic empire."
 oe_w5.42.a: "Sign the Munster peace and pivot to diplomatic retrenchment"
 oe_w5.42.b: "Reject compromise and cling to ancestral northern claims"
 oe_w5.43.title: "War of Succession & the Nueva Planta Decrees"
 oe_w5.43.desc: "A titanic European war over the Spanish throne concludes with a modernized dynasty installed in Madrid. Issuing the Nueva Planta decrees sweeps away overlapping medieval customs barriers and disparate regional courts, forging a single centralized Iberian administration."
 oe_w5.43.a: "Promulgate the Nueva Planta administrative and fiscal union"
 oe_w5.43.b: "Retain negotiated provincial charters to foster rapid postwar unity"
 oe_w5.44.title: "Charles III & the Enlightened Bourbon Reforms"
 oe_w5.44.desc: "Enlightened ministers sweep through Madrid paving boulevards, sponsoring Economic Societies of Friends of the Country, upgrading shipyards at Ferrol and Cartagena, and dismantling Seville's archaic trade monopoly so thirteen Spanish ports can trade freely with the Americas."
 oe_w5.44.a: "Enact the Free Trade Ordinances and Enlightened Bourbon modernization"
 oe_w5.44.b: "Protect established Cadiz merchant guild privileges for guaranteed customs"
 oe_w5.45.title: "Aljubarrota & the House of Avis"
 oe_w5.45.desc: "Outnumbered on a ridge north of Lisbon, Portuguese foot soldiers and allied longbowmen dig trenches and caltrops behind a bristling defensive square, shattering an invading royal host. The triumph secures the House of Avis and seals Portugal's enduring maritime independence."
 oe_w5.45.a: "Proclaim the House of Avis and fortify the realm's independence"
 oe_w5.45.b: "Reward Lisbon burghers who bankrolled the defense with trade charters"
 oe_w5.46.title: "Prince Henry the Navigator & Sagres Caravels"
 oe_w5.46.desc: "On the windswept cliffs of the Algarve, royal cosmographers, Jewish cartographers, and daring captains refine the lateen-rigged caravel and quadrant tables. Pushing past Cape Bojador opens Madeira's sugar islands, West African gold dust, and the road to the unknown southern ocean."
 oe_w5.46.a: "Fund the Sagres navigational enterprise and Atlantic caravel expeditions"
 oe_w5.46.b: "Focus immediate resources on Moroccan coastal fortresses instead"
 oe_w5.47.title: "Cape of Good Hope & the Sea Route to India"
 oe_w5.47.desc: "First Bartolomeu Dias rounds the Stormy Cape, and soon Vasco da Gama anchors off Calicut's pepper warehouses. By forging an unbroken oceanic highway from Lisbon to Malabar, Portugal bypasses every Mediterranean tollbooth and grasps the wealth of Asia."
 oe_w5.47.a: "Launch the annual Carreira da India fleets from the Tagus"
 oe_w5.47.b: "Lease eastern voyage licenses to Lisbon and Antwerp bankers for quick coin"
 oe_w5.48.title: "The Treaty of Tordesillas"
 oe_w5.48.desc: "Shrewd Portuguese diplomats insist on shifting the papal demarcation meridian westward into the Atlantic. Securing legal title not only to Africa and the Indian Ocean but also to the rich forested coasts of Brazil crowns a masterstroke of Renaissance diplomacy."
 oe_w5.48.a: "Ratify the Tordesillas Meridian and chart the Brazilian coast"
 oe_w5.48.b: "Use diplomatic goodwill to deepen trade accords across Europe"
 oe_w5.49.title: "Afonso de Albuquerque & the Estado da India"
 oe_w5.49.desc: "Viceroy Afonso de Albuquerque unveils a breathtaking grand strategy: rather than conquer sprawling Asian hinterlands, seize three naval chokepoints—Hormuz, Goa, and Malacca—and rule the Indian Ocean through stone forts, royal cartaz passes, and gun-bristling fleets."
 oe_w5.49.a: "Build Albuquerque's fortress chain across Goa, Hormuz, and Malacca"
 oe_w5.49.b: "Favor peaceful merchant factories over costly overseas sieges"
 oe_w5.50.title: "Spice Monopoly & the Casa da India"
 oe_w5.50.desc: "Golden-sailed carracks unload mountains of pepper, cinnamon, nutmeg, and Ming porcelain directly onto Lisbon's Terreiro do Paco. Centralizing spice auctions in the royal Casa da India fills Manueline coffers and turns Lisbon into the richest warehouse of Atlantic Europe."
 oe_w5.50.a: "Enforce the royal Casa da India spice monopoly in Lisbon"
 oe_w5.50.b: "Open Lisbon's docks to private Portuguese and Flemish syndicates"
 oe_w5.51.title: "The Crisis of Alcacer Quibir"
 oe_w5.51.desc: "A rash crusading expedition across the Moroccan plains ends in catastrophe, claiming the flower of Portuguese chivalry and plunging Lisbon into an acute succession and financial emergency. Cool-headed magistrates must rally coastal garrisons and steady the realm."
 oe_w5.51.a: "Rally the Regency Council to fortify borders and ransom noble captives"
 oe_w5.51.b: "Husband royal bullion strictly for the Indian and Brazilian fleets"
 oe_w5.52.title: "The Cortes of Tomar & Autonomy Struggle"
 oe_w5.52.desc: "Facing dynastic union pressures from Madrid, the Portuguese Estates convene at Tomar to demand ironclad constitutional guarantees: Portuguese offices for Portuguese subjects, native coinage, separate fleets, and untouched sovereignty over Brazil and Asia."
 oe_w5.52.a: "Insist on the Tomar statutes protecting Portuguese offices and fleets"
 oe_w5.52.b: "Coordinate joint Atlantic convoys with Iberian partners for mutual defense"
 oe_w5.53.title: "The Restoration of 1640 & House of Braganza"
 oe_w5.53.desc: "On the first morning of December, forty Portuguese conspirators storm the Lisbon palace, raise the banner of the House of Braganza, and proclaim restored national sovereignty. Fortress engineers rush to encircle Elvas and Almeida while Brazil's sugar fleets rally behind the new crown."
 oe_w5.53.a: "Acclaim the House of Braganza and fortify the frontier bastions"
 oe_w5.53.b: "Dispatch urgent envoys to secure northern maritime alliances"
 oe_w5.54.title: "The Methuen Port Wine Treaty"
 oe_w5.54.desc: "English envoys propose an historic commercial accord: English woolens enter Portugal duty-free while Douro valley port wine receives preferential tariffs in London, backed by Royal Navy escorts for Brazilian gold convoys. Domestic weavers grumble even as vineyard estates boom."
 oe_w5.54.a: "Sign the Methuen Treaty to boom Douro wine exports and Atlantic security"
 oe_w5.54.b: "Protect native Portuguese woolen manufactories with balanced tariffs"
 oe_w5.55.title: "All Saints' Day: The Great Lisbon Earthquake"
 oe_w5.55.desc: "On All Saints' morning, violent tremors, a towering Tagus tsunami, and raging fires reduce Lisbon's lower city, royal palace, and packed archives to smoldering ash. Europe's philosophers debate Providence while Secretary Sebastiao Jose de Carvalho declares simply: bury the dead, heal the living."
 oe_w5.55.a: "Mobilize emergency relief, price controls, and harbor clearance"
 oe_w5.55.b: "Levy emergency colonial contributions from Brazil to cover damages"
 oe_w5.56.title: "Marquis of Pombal & Enlightened Reconstruction"
 oe_w5.56.desc: "Rising from Lisbon's ashes, the Marquis of Pombal engineers Europe's first earthquake-resistant wooden cage frames across rational neoclassical avenues, creates chartered commercial companies, reforms the University of Coimbra for natural science, and curbs archaic estate privileges."
 oe_w5.56.a: "Back Pombal's rational urban grid and scientific university reforms"
 oe_w5.56.b: "Slow the sweeping centralizing edicts to reconcile conservative estates"
 oe_w5.57.title: "Hook and Cod Feuds & the Holland Herring Fleet"
 oe_w5.57.desc: "Even as rural nobles of the Hook faction spar with rising Cod towns over comital patronage, Dutch skippers perfect gibbing and barrel-salting herring aboard sturdy busses right on the North Sea. This 'Great Fishery' lays the maritime bedrock of Holland's future prosperity."
 oe_w5.57.a: "Back the Cod merchant towns and expand the North Sea herring busses"
 oe_w5.57.b: "Broker a feudal truce favoring Hook rural lords for domestic quiet"
 oe_w5.58.title: "Burgundian Estates & the Great Privilege"
 oe_w5.58.desc: "Following princely turmoil in the Low Countries, delegates from Holland, Zeeland, Flanders, and Brabant extract the Great Privilege—affirming that no taxes may be levied and no wars declared without consent of the provincial Estates, and affirming Dutch vernacular justice in local courts."
 oe_w5.58.a: "Enshrine the Great Privilege and strengthen provincial Estates"
 oe_w5.58.b: "Accept closer ducal centralization in return for customs privileges"
 oe_w5.59.title: "Iconoclastic Fury & the Eighty Years' War"
 oe_w5.59.desc: "Harsh taxation, religious inquisitions, and surging grain prices ignite the Beeldenstorm across Flanders and Holland. As iron-fisted armies march north to crush town liberties, burghers and water-engineers prepare to break the dikes themselves rather than kneel."
 oe_w5.59.a: "Defy tyranny behind flooded polders and sworn urban militias"
 oe_w5.59.b: "Seek a cautious pacification to spare merchant warehouses from siege"
 oe_w5.60.title: "The Sea Beggars Capture Brill"
 oe_w5.60.desc: "Driven from English ports by stormy winds, ragged flotillas of Watergeuzen privateers descend unexpectedly on the fortified Maas town of Brill on April Fool's Day. Within weeks, Flushing, Enkhuizen, and town after town across Holland and Zeeland fling open their gates to liberty."
 oe_w5.60.a: "Commission the Watergeuzen raiders as the nucleus of a national navy"
 oe_w5.60.b: "Use seized enemy prize cargoes to fund fortified dike garrisons"
 oe_w5.61.title: "The Union of Utrecht & Birth of the Republic"
 oe_w5.61.desc: "Representatives of the northern provinces sign the solemn Union of Utrecht, pledging to act as one body in war and foreign affairs while guaranteeing that no resident shall ever be persecuted for private conscience. A bold mercantile republic enters the stage of history."
 oe_w5.61.a: "Proclaim the federated Republic of the Seven United Provinces"
 oe_w5.61.b: "Concentrate wartime command firmly under the Stadtholder's banner"
 oe_w5.62.title: "Charter of the VOC (1602)"
 oe_w5.62.desc: "To end ruinous price wars between rival Dutch spice expeditions, the States General merges six regional chambers into the Vereenigde Oostindische Compagnie—the world's first permanently capitalized public corporation, armed with warships, fortresses, and treaty powers east of the Cape."
 oe_w5.62.a: "Launch the VOC armada to seize the Asian spice archipelago"
 oe_w5.62.b: "Reserve a larger share of initial VOC subscriptions for the state treasury"
 oe_w5.63.title: "The Amsterdam Wisselbank & Stock Exchange"
 oe_w5.63.desc: "Overwhelmed by hundreds of clipped foreign coins circulating through Europe's busiest harbor, Amsterdam opens the municipal Wisselbank alongside Hendrick de Keyser's stone Stock Exchange. Instant ledger transfers and guaranteed silver florins crown Amsterdam financial capital of the world."
 oe_w5.63.a: "Charter the Wisselbank clearinghouse and public share Bourse"
 oe_w5.63.b: "Restrict exchange trading to spot commodities to curb financial speculation"
 oe_w5.64.title: "Supremacy of the Dutch Fluyt Fleet"
 oe_w5.64.desc: "Along the Zaan river north of Amsterdam, rows of wind-powered sawmills slice Baltic pine into standardized pear-shaped fluyts faster than any shipyard on earth. Requiring half the crew of rival vessels, Dutch fluyts undercut every competitor from Danzig to Lisbon."
 oe_w5.64.a: "Expand the Zaanstreek wind-sawmills and mass-produce Fluyt convoys"
 oe_w5.64.b: "Fit heavier gun decks onto merchantmen to deter privateers"
 oe_w5.65.title: "The Synod of Dort: Arminians vs Gomarists"
 oe_w5.65.desc: "Fierce theological debates over predestination and provincial sovereignty split Holland's civic regents from orthodox congregations and the Stadtholder's army. Convening an international synod at Dordrecht settles church doctrine and commissions the landmark States Bible in unified Dutch."
 oe_w5.65.a: "Endorse the Synod decrees and commission the States Bible translation"
 oe_w5.65.b: "Shield Remonstrant civic toleration across Holland's mercantile cities"
 oe_w5.66.title: "Tulip Mania in the Haarlem Taverns (1637)"
 oe_w5.66.desc: "In crowded Haarlem and Alkmaar taverns, rare flame-striped Semper Augustus tulip bulbs trade on paper futures for the price of an Amsterdam canal mansion. When winter buyers suddenly vanish in February 1637, furious traders besiege magistrates demanding either enforcement or relief."
 oe_w5.66.a: "Have municipal courts convert wild futures into modest exit fees"
 oe_w5.66.b: "Enforce full tavern contracts strictly to deter reckless gambling"
 oe_w5.67.title: "Peace of Munster: Sovereign Independence"
 oe_w5.67.desc: "After eighty heroic years of struggle, diplomats sign the Peace of Munster recognizing the Dutch Republic as a fully sovereign power, confirming its overseas conquests in Asia and the Americas, and keeping the Scheldt closed to preserve Amsterdam's golden trade supremacy."
 oe_w5.67.a: "Celebrate sovereign recognition and secure Scheldt commercial primacy"
 oe_w5.67.b: "Channel peace dividends into reclaiming vast North Holland polders"
 oe_w5.68.title: "Anglo-Dutch Naval Wars & Admiral De Ruyter"
 oe_w5.68.desc: "Clashing maritime empires turn the North Sea into a thunderous proving ground of broadside warfare. Under Maarten Tromp and Michiel de Ruyter, disciplined Dutch fleets master line-of-battle gunnery, culminating in daring raids straight into rival river anchorages."
 oe_w5.68.a: "Build heavy admiralty ships of the line for De Ruyter's squadrons"
 oe_w5.68.b: "Prioritize nimble convoy escorts to keep Baltic grain flowing"
 oe_w5.69.title: "Rampjaar: The Disaster Year of 1672"
 oe_w5.69.desc: "Struck simultaneously by invading continental armies from the east and rival war fleets from the sea, the Republic faces mortal peril—'the people desperate, the government at its wits' end.' Yet opening the Old Hollandic Waterline halts the invaders cold before Amsterdam's gates."
 oe_w5.69.a: "Open the Hollandic Waterline and rally behind national defense"
 oe_w5.69.b: "Deploy emergency Amsterdam bullion to hire continental coalition allies"
 oe_w5.70.title: "The Patriot Movement & Batavian Dawn"
 oe_w5.70.desc: "Inspired by Atlantic revolutions and Enlightenment print culture, armed burgher Free Corps known as Patriots challenge stagnant oligarchies and hereditary offices alike, calling for a unified modern republic with equal provincial representation and codified civic rights."
 oe_w5.70.a: "Embrace Patriot constitutional reform and unified national institutions"
 oe_w5.70.b: "Preserve the ancient Seven Provinces confederacy and Orange stadtholderate"
