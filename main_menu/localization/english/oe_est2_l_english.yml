# Generated by gen_v180_living_estates_banks.py (2026-11-23) — OEBYZ v18.0 Module 18.0-B (oe_est2_)
 # --- 16 Non-BYZ Civilization Estate Privileges ---
 oe_est2_priv_yuan_ortogh_merchants:0 "Ortogh Silver Syndicates"
 oe_est2_priv_yuan_ortogh_merchants_desc:0 "Charters trans-Eurasian Ortogh merchant-bankers with imperial silver capital to finance overland caravans and maritime trade, lowering credit costs while shifting fiscal leverage away from the throne."
 oe_est2_priv_ming_jinshi_gentry_exemptions:0 "Jinshi Gentry Corvee Exemptions"
 oe_est2_priv_ming_jinshi_gentry_exemptions_desc:0 "Grants examination-degree gentry hereditary tax and corvee exemptions in return for local scholarship and administrative service, strengthening the cabinet while shifting rural burdens onto commoners."
 oe_est2_priv_qing_eight_banner_estates:0 "Banner Princes' Private Estates"
 oe_est2_priv_qing_eight_banner_estates_desc:0 "Permits banner princes to maintain private armored cavalry retainers funded by enclosed banner estates, forging elite shock troops at the expense of rural crown control and peasant contentment."
 oe_est2_priv_jpn_shugo_retainer_bands:0 "Shugo Retainer Banners"
 oe_est2_priv_jpn_shugo_retainer_bands_desc:0 "Sanctions provincial Shugo lords and samurai clans to maintain hereditary retainer bands under clan banners, sharpening infantry discipline and mobilization while pulling authority away from the central court."
 oe_est2_priv_jpn_koku_rice_stipend_brokers:0 "Kurayashiki Rice Stipend Brokers"
 oe_est2_priv_jpn_koku_rice_stipend_brokers_desc:0 "Entrusts Sakai and Osaka warehouse brokers to convert koku rice stipends into silver bills and grain reserves, insulating clans against winter famine while irritating indebted samurai houses."
 oe_est2_priv_tur_timariot_sipahi_fiefs:0 "Provincial Timariot Sipahi Tenure"
 oe_est2_priv_tur_timariot_sipahi_fiefs_desc:0 "Confirms provincial sipahi cavalry holders in hereditary timar revenue assignments with private armed cebelu retinues, slashing army upkeep and empowering horsemen while diverting rural cash taxes."
 oe_est2_priv_tur_phanariot_sarraf_credit:0 "Sarraf & Phanariot Credit Syndicates"
 oe_est2_priv_tur_phanariot_sarraf_credit_desc:0 "Grants imperial sarraf financiers and Phanariot merchant houses tax-farming advances and Levant credit syndicates, deepening state borrowing capacity at the risk of gentle inflation and peasant resentment."
 oe_est2_priv_rus_boyar_pomestye_druzhina:0 "Boyar & Pomestye Cavalry Muster"
 oe_est2_priv_rus_boyar_pomestye_druzhina_desc:0 "Empowers landed boyars and service gentry to muster armed household druzhinas bound to serf estates, expanding steppe-frontier manpower and cavalry at the cost of institutional modernization."
 oe_est2_priv_rus_stroganov_frontier_charter:0 "Stroganov Salt & Fur Charter"
 oe_est2_priv_rus_stroganov_frontier_charter_desc:0 "Awards frontier merchant magnates broad concessions over salt pans, ironworks, and fur corridors, accelerating extraction and construction while limiting direct crown taxation of merchant fortunes."
 oe_est2_priv_weu_medici_fugger_bills:0 "Bills of Exchange & Banking Houses"
 oe_est2_priv_weu_medici_fugger_bills_desc:0 "Recognizes international merchant-banking partnerships and fair-clearing bills of exchange across royal courts, sharply cutting sovereign interest rates while elevating plutocratic banking influence."
 oe_est2_priv_weu_reichsritter_private_banners:0 "Magnate & Imperial Knight Retinues"
 oe_est2_priv_weu_reichsritter_private_banners_desc:0 "Guarantees great territorial magnates and free knights the right to maintain armored lances in private fortresses, delivering formidable heavy cavalry at the price of decentralized fiscal authority."
 oe_est2_priv_weu_hanseatic_kontor_staple:0 "Kontor Enclaves & Maritime Staple"
 oe_est2_priv_weu_hanseatic_kontor_staple_desc:0 "Grants chartered maritime leagues autonomous port kontors and staple warehouses, boosting naval presence, shipbuilding, and maritime trade while loosening royal oversight over autonomous port cities."
 oe_est2_priv_per_qizilbash_oymaq_hosts:0 "Oymaq & Qizilbash Tribal Hosts"
 oe_est2_priv_per_qizilbash_oymaq_hosts_desc:0 "Confirms Turkmen and highland oymaq chieftains in autonomous grazing provinces with private mounted hosts, producing ferocious cavalry morale while straining provincial prosperity and central control."
 oe_est2_priv_per_caravanserai_silk_syndicate:0 "Royal Caravanserai & Silk Brokers"
 oe_est2_priv_per_caravanserai_silk_syndicate_desc:0 "Charters long-distance silk and carpet syndicates across fortified royal caravanserais, lifting trade and workshop output while conceding tax exemptions that provoke conservative clerical critics."
 oe_est2_priv_ind_mansabdar_jagir_contingents:0 "Mansabdar & Jagirdar Cavalry Quotas"
 oe_est2_priv_ind_mansabdar_jagir_contingents_desc:0 "Assigns revenue jagirs to noble commanders obligated to maintain private armored cavalry contingents and campaign trains, swelling manpower and supply capacity while fragmenting crown revenue."
 oe_est2_priv_ind_jagat_seth_hundi_bankers:0 "Jagat Seth & Hundi Bill-Brokers"
 oe_est2_priv_ind_jagat_seth_hundi_bankers_desc:0 "Partners with great Indian banking houses issuing hundi remittance bills across river ports and provincial treasuries, lowering borrowing rates and smoothing tax remittances while curbing aristocratic dominance."
 # --- 3 Decisions ---
 oe_est2_dec_charter_banking_house.title:0 "Charter Sovereign Banking House"
 oe_est2_dec_charter_banking_house.desc:0 "Pool merchant-banker deposits under royal charter to issue low-interest estate loans, recapitalize banking estates, and stabilize bills of exchange across our markets."
 oe_est2_dec_charter_banking_house.a:0 "Seal the Banking Charter"
 oe_est2_dec_charter_banking_house_tt:0 "Takes a specialized 60-month 3.5% estate loan, injects 40 gold into banking estates (plus 30 gold to Burghers), and grants #Y Royal Chartered Banking House#! for 20 years."
 oe_est2_dec_disarm_private_regiments.title:0 "Cup of Wine Disarmament"
 oe_est2_dec_disarm_private_regiments.desc:0 "Summon great noble, tribal, and frontier commanders to a grand court banquet. Offer generous estates and pensions in exchange for peacefully dissolving all unraised estate private regiments."
 oe_est2_dec_disarm_private_regiments.a:0 "Raise the Cup of Peace"
 oe_est2_dec_disarm_private_regiments_tt:0 "Dissolves all unraised private regiments held by Nobles, Tribes, and Cossacks, transfers retirement stipends to their estates, and grants #Y Cup of Wine Disarmament Settlement#! for 25 years."
 oe_est2_dec_building_league_subsidy.title:0 "Subsidize League & Banking Logistics"
 oe_est2_dec_building_league_subsidy.desc:0 "Underwrite winter grain stocks and comptoir upkeep for banking houses, maritime leagues, and building-based clan networks so vital trade and credit arteries never collapse in hard years."
 oe_est2_dec_building_league_subsidy.a:0 "Dispatch Logistics Subsidies"
 oe_est2_dec_building_league_subsidy_tt:0 "Distributes 40 gold to banking estates, grants #Y League & Banking Logistics Subsidy#! for 15 years, and reinforces building-country anti-starvation logistics."
 # --- Static Modifiers ---
 STATIC_MODIFIER_NAME_oe_est2_mod_building_logistics_shield:0 "Chartered Clearing-House Logistics"
 STATIC_MODIFIER_DESC_oe_est2_mod_building_logistics_shield:0 "Dedicated warehouse credit lines and winter victualling contracts shield banking houses and maritime leagues from building upkeep and food starvation."
 STATIC_MODIFIER_NAME_oe_est2_mod_shugo_rice_stipend:0 "Shugo-Daimyo Koku Rice Logistics"
 STATIC_MODIFIER_DESC_oe_est2_mod_shugo_rice_stipend:0 "Granary relays and Bakufu rice stipends keep building-based Japanese clans supplied through harsh winters without collapsing."
 STATIC_MODIFIER_NAME_oe_est2_mod_sengoku_koku_transition:0 "Sengoku Territorial Logistics Transition"
 STATIC_MODIFIER_DESC_oe_est2_mod_sengoku_koku_transition:0 "Structured koku granaries and castle-town supply roads ease the transition from clan hall networks into territorial daimyo domains."
 STATIC_MODIFIER_NAME_oe_est2_mod_cup_of_wine_peace:0 "Cup of Wine Disarmament Settlement"
 STATIC_MODIFIER_DESC_oe_est2_mod_cup_of_wine_peace:0 "Generous pensions and ceremonial honors persuade great commanders to dissolve private regiments in favor of a unified royal army."
 STATIC_MODIFIER_NAME_oe_est2_mod_magnate_banners_pressed:0 "Pressed Estate Private Banners"
 STATIC_MODIFIER_DESC_oe_est2_mod_magnate_banners_pressed:0 "Noble and tribal private regiments have been pressed directly into royal service, bolstering immediate field strength at the cost of strained aristocratic loyalty."
 STATIC_MODIFIER_NAME_oe_est2_mod_warlord_charter_truce:0 "Feudal Retainer Charter Truce"
 STATIC_MODIFIER_DESC_oe_est2_mod_warlord_charter_truce:0 "Confirmed stipends and local immunities calm restive military magnates, preserving battlefield loyalty while trimming direct treasury collections."
 STATIC_MODIFIER_NAME_oe_est2_mod_cossack_frontier_pay:0 "Steppe Frontier Host Stipends"
 STATIC_MODIFIER_DESC_oe_est2_mod_cossack_frontier_pay:0 "Regular powder, grain, and silver allotments anchor frontier hosts along the wild steppe marches."
 STATIC_MODIFIER_NAME_oe_est2_mod_medici_exchange_network:0 "Medici Clearing-Bill Network"
 STATIC_MODIFIER_DESC_oe_est2_mod_medici_exchange_network:0 "Double-entry ledgers and branch clearing houses across European fairs lower sovereign borrowing costs and accelerate commercial liquidity."
 STATIC_MODIFIER_NAME_oe_est2_mod_fugger_silver_credit:0 "Fugger Silver-Backed Credit"
 STATIC_MODIFIER_DESC_oe_est2_mod_fugger_silver_credit:0 "Tyrolean and Carpathian copper-silver concessions underwrite massive imperial war credit lines while granting banking houses sway over crown revenues."
 STATIC_MODIFIER_NAME_oe_est2_mod_piaohao_phanar_drafts:0 "Inter-Provincial Draft Banking Network"
 STATIC_MODIFIER_DESC_oe_est2_mod_piaohao_phanar_drafts:0 "Trusted remittance drafts move silver across vast overland empires without bullion convoys, boosting both merchant reach and provincial tax transfers."
 STATIC_MODIFIER_NAME_oe_est2_mod_debt_restructuring:0 "Orderly Estate Debt Restructuring"
 STATIC_MODIFIER_DESC_oe_est2_mod_debt_restructuring:0 "Sovereign arrears are consolidated into long-term estate syndicate bonds, averting clearing-house panic at the price of temporary tax concessions."
 STATIC_MODIFIER_NAME_oe_est2_mod_sovereign_haircut:0 "Sovereign Debt Haircut Fallout"
 STATIC_MODIFIER_DESC_oe_est2_mod_sovereign_haircut:0 "Arbitrary debt repudiation relieves immediate cash pressure but freezes merchant credit lines and drives up future borrowing rates."
 STATIC_MODIFIER_NAME_oe_est2_mod_banking_bailout_trust:0 "Lender-of-Last-Resort Confidence"
 STATIC_MODIFIER_DESC_oe_est2_mod_banking_bailout_trust:0 "Prompt treasury backing rescues solvent clearing houses during liquidity panics, cementing durable financial trust across merchant estates."
 STATIC_MODIFIER_NAME_oe_est2_mod_vault_seizure_chill:0 "Seized Banking Vaults Chill"
 STATIC_MODIFIER_DESC_oe_est2_mod_vault_seizure_chill:0 "Confiscating merchant-banker bullion fills the war chest overnight, yet drives credit houses underground and chills port commerce."
 STATIC_MODIFIER_NAME_oe_est2_mod_hanseatic_kontor_charter:0 "Hanseatic Kontor Maritime Charter"
 STATIC_MODIFIER_DESC_oe_est2_mod_hanseatic_kontor_charter:0 "Protected staple depots from Bruges to Novgorod unify northern convoy logistics and boost maritime merchant profits."
 STATIC_MODIFIER_NAME_oe_est2_mod_sound_toll_customs:0 "Royal Sound & Port Customs"
 STATIC_MODIFIER_DESC_oe_est2_mod_sound_toll_customs:0 "Direct crown tolls over narrow straits swell customs receipts and patrol squadrons, though foreign leagues chafe at the tariffs."
 STATIC_MODIFIER_NAME_oe_est2_mod_league_maritime_logistics:0 "Maritime League Convoy Logistics"
 STATIC_MODIFIER_DESC_oe_est2_mod_league_maritime_logistics:0 "Joint merchant-banker convoy funds lower fleet upkeep, sustain overseas comptoirs, and expand seasoned sailor pools."
 STATIC_MODIFIER_NAME_oe_est2_mod_bakufu_rice_granary:0 "Bakufu Central Rice Granaries"
 STATIC_MODIFIER_DESC_oe_est2_mod_bakufu_rice_granary:0 "Centralized tax-rice storehouses in Kyoto and port hubs stabilize food prices and dampen regional famine shocks."
 STATIC_MODIFIER_NAME_oe_est2_mod_koku_rice_exchange:0 "Koku Rice-Bill Exchange"
 STATIC_MODIFIER_DESC_oe_est2_mod_koku_rice_exchange:0 "Standardized warehouse rice certificates let daimyo and merchants settle army provisions across provinces on credit."
 STATIC_MODIFIER_NAME_oe_est2_mod_castle_town_granaries:0 "Castle-Town Provision Depots"
 STATIC_MODIFIER_DESC_oe_est2_mod_castle_town_granaries:0 "Fortified castle-town granaries anchor provincial administration and sustain large garrisons through protracted sieges."
 STATIC_MODIFIER_NAME_oe_est2_mod_kenchi_land_survey:0 "Cadastral Koku Land Survey"
 STATIC_MODIFIER_DESC_oe_est2_mod_kenchi_land_survey:0 "Uniform village-by-village cadastral assessments eliminate hidden feudal fiefs and anchor direct grain taxation."
 STATIC_MODIFIER_NAME_oe_est2_mod_dec_chartered_bank:0 "Royal Chartered Banking House"
 STATIC_MODIFIER_DESC_oe_est2_mod_dec_chartered_bank:0 "A crown-backed merchant banking charter pools estate deposits to lower sovereign borrowing rates and stabilize commercial bills."
 STATIC_MODIFIER_NAME_oe_est2_mod_dec_league_subsidy:0 "League & Banking Logistics Subsidy"
 STATIC_MODIFIER_DESC_oe_est2_mod_dec_league_subsidy:0 "Coordinated grain and upkeep subsidies keep commercial comptoirs, banking halls, and clan depots operating through winter and war."
 # --- 16 Visible Events (oe_est2.1 .. oe_est2.16) ---
 oe_est2.1.title:0 "Magnate Private Banners Mustered"
 oe_est2.1.desc:0 "Emboldened by court strain and fiscal demands, great landed magnates have armed their household retainers under private heraldic standards. Their riders muster outside our royal garrisons, daring the crown to press them into service, buy their truce, or disarm them by decree."
 oe_est2.1.a:0 "Press their private banners into royal service"
 oe_est2.1.b:0 "Buy a retainer truce with estate grants"
 oe_est2.1.c:0 "Issue a royal writ dissolving their unraised retinues"
 oe_est2.2.title:0 "Shugo & Samurai Retainer Standoff"
 oe_est2.2.desc:0 "Provincial shugo deputies and kokujin gentry have assembled private samurai bands in the mountain passes, citing unpaid rice stipends and contested land warrants. Whether we absorb their banners into the Shogunate host or disarm the rival retainers will shape our authority across the provinces."
 oe_est2.2.a:0 "Confirm samurai retainer charters and stipend rice"
 oe_est2.2.b:0 "Disarm rogue banners and enforce Bakufu discipline"
 oe_est2.3.title:0 "Boyar Druzhina & Cossack Frontier Host"
 oe_est2.3.desc:0 "Along the southern steppe marches, boyar household cavalry and autonomous Cossack hosts have mustered private squadrons to guard the river crossings. They demand silver stipends and grain convoys before riding under the sovereign banner."
 oe_est2.3.a:0 "Pay frontier stipends in silver and powder"
 oe_est2.3.b:0 "Press the frontier host into the sovereign service roll"
 oe_est2.4.title:0 "Emirs & Tribal Warlord Demarche"
 oe_est2.4.desc:0 "Hereditary garrison emirs and tribal horsemen have encircled the royal citadel in full harness, insisting that provincial iqta and tiyul assignments remain untouched by central tax auditors. Their private regiments stand saddled at the palace gates."
 oe_est2.4.a:0 "Placate the emirs with ceremonial robes and stipends"
 oe_est2.4.b:0 "Disband their private regiments and audit the provinces"
 oe_est2.5.title:0 "The Cup of Wine Disarmament Banquet"
 oe_est2.5.desc:0 "Over cups of vintage wine in the candlelit banquet hall, our sovereign spoke candidly to the realm's great marshals and clan heads: lifelong wealth, grand estates, and untroubled honor await those who lay down private commands and leave the sword solely to the throne."
 oe_est2.5.a:0 "Grant lavish pensions and dissolve all private regiments"
 oe_est2.5.b:0 "Keep the marshals armed as a permanent frontier reserve"
 oe_est2.6.title:0 "Houses of Peruzzi, Bardi & Acciaioli"
 oe_est2.6.desc:0 "Factors from the great Florentine banking partnerships—Peruzzi, Bardi, and Acciaioli—have arrived at our treasury with sealed credit ledgers. Offering preferential sovereign credit secured by customs and wool duties, they seek our protection for their urban comptoirs."
 oe_est2.6.a:0 "Open a preferential Florentine estate credit line"
 oe_est2.6.b:0 "Limit their branch privileges and protect our coin"
 oe_est2.7.title:0 "The Medici Bills of Exchange"
 oe_est2.7.desc:0 "A new generation of merchant-bankers led by the Medici network has perfected double-entry accounting and cross-border bills of exchange. By recognizing their clearing drafts at our customs houses, we can borrow below market rates and draw foreign liquidity into our burgher estates."
 oe_est2.7.a:0 "Charter Medici clearing drafts and draw low-interest credit"
 oe_est2.7.b:0 "Encourage domestic minting without taking new debt"
 oe_est2.8.title:0 "The Fugger Imperial Credit & Silver Mines"
 oe_est2.8.desc:0 "Augsburg financiers of the House of Fugger offer to underwrite our diplomatic and military ambitions against long-term leases on silver and copper mining output. Their war chests can tip imperial elections and supply armies far beyond our ordinary tax base."
 oe_est2.8.a:0 "Pledge mine royalties for Fugger imperial credit"
 oe_est2.8.b:0 "Retain full crown monopoly over metal mines"
 oe_est2.9.title:0 "Shanxi Piaohao & Phanariot Banking Syndicates"
 oe_est2.9.desc:0 "Across the great overland empires—from Shanxi piaohao draft banks moving provincial tax silver to Phanariot and sarraf clearing houses linking Constantinople, Cairo, and Isfahan—private merchant-bankers now settle distant transfers faster and safer than armed bullion caravans."
 oe_est2.9.a:0 "Authorize private draft banks to remit provincial taxes"
 oe_est2.9.b:0 "Keep tax silver inside imperial treasury convoys"
 oe_est2.10.title:0 "Sovereign Debt Default & Clearing-House Panic"
 oe_est2.10.desc:0 "A wave of war arrears and overextended bills has shaken the great merchant-banking houses. Depositors crowd the clearing halls demanding hard coin, and royal creditors warn that an uncoordinated default will topple half the realm's commercial houses."
 oe_est2.10.a:0 "Refinance arrears through an estate banking syndicate"
 oe_est2.10.b:0 "Force a sovereign haircut on private creditors"
 oe_est2.11.title:0 "Banking Bailout or Vault Seizure"
 oe_est2.11.desc:0 "Two premier clearing houses stand on the brink of insolvency after a foreign sovereign repudiated their wartime bills. Our council is split between acting as lender of last resort to preserve long-term financial trust, or seizing their remaining bullion vaults to refill the treasury."
 oe_est2.11.a:0 "Bail out the clearing houses as lender of last resort"
 oe_est2.11.b:0 "Seize their bullion vaults for the royal war chest"
 oe_est2.12.title:0 "Hanseatic Kontor & Maritime Staple Charter"
 oe_est2.12.desc:0 "Aldermen of the Hanseatic Kontors petition to renew their fortified staple warehouses, timber docks, and winter grain contracts across northern harbors. Confirming their charter strengthens maritime commerce and convoy logistics, while taxing the straits directly yields immediate customs coin."
 oe_est2.12.a:0 "Confirm the Kontor staple charter and convoy depots"
 oe_est2.12.b:0 "Enforce royal Sound and harbor customs tolls"
 oe_est2.13.title:0 "Maritime Merchant League & Banking Convoy"
 oe_est2.13.desc:0 "Corsairs and winter storms have disrupted bullion and grain shipments between overseas comptoirs. Merchant-bankers and maritime leagues propose pooling an insured convoy fund to maintain armed escort galleys and buffer building-based depots against seasonal supply shocks."
 oe_est2.13.a:0 "Co-fund armed convoy galleys and depot reserves"
 oe_est2.13.b:0 "Levy emergency convoy insurance duties"
 oe_est2.14.title:0 "Shugo-Daimyo Building-Clan Logistics"
 oe_est2.14.desc:0 "Many great samurai houses still govern through dispersed clan halls, toll gates, and Kyoto mansions rather than contiguous fiefs. Establishing reliable rice-stipend corridors between rural estates and urban clan quarters ensures these shugo networks weather winter shortages intact."
 oe_est2.14.a:0 "Guarantee clan rice stipends and estate supply depots"
 oe_est2.14.b:0 "Centralize surplus tax rice in Bakufu granaries"
 oe_est2.15.title:0 "Koku Rice Stipends & Castle-Town Granaries"
 oe_est2.15.desc:0 "As warfare grows in scale across the archipelago, feeding campaigning ashigaru and samurai requires more than ad-hoc foraging. Merchants of Sakai and Osaka offer to monetize koku grain bills, while veteran generals urge stocking fortified castle-town granaries."
 oe_est2.15.a:0 "Monetize koku stipends through Sakai & Osaka rice brokers"
 oe_est2.15.b:0 "Build fortified castle-town grain storehouses"
 oe_est2.16.title:0 "From Building-Clan to Territorial Daimyo"
 oe_est2.16.desc:0 "The old shugo networks of dispersed halls and court offices have matured into consolidated Sengoku domains with castle towns, road relays, and disciplined supply trains. Now we must decide whether to bind samurai retainers through private banners or unify the realm under strict cadastral kenchi surveys."
 oe_est2.16.a:0 "Muster hereditary retainer banners for the coming campaigns"
 oe_est2.16.b:0 "Conduct a domain-wide kenchi cadastral land survey"
