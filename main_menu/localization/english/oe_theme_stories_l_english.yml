l_english:
 STATIC_MODIFIER_NAME_oe_ts_scorched_earth: "Scorched Earth"
 STATIC_MODIFIER_NAME_oe_ts_new_settlers: "New Settlers"
 STATIC_MODIFIER_NAME_oe_ts_taxfarm_unrest: "Tax-farm Grievances"
 STATIC_MODIFIER_NAME_oe_ts_sea_fire: "The Sea Fire Rekindled"
 oe_ts_refused_port: "Refused our harbour request"
 oe_theme_story.1.t: "A New Strategos"
 oe_theme_story.1.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] has just taken up command of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]. By old custom a new strategos receives the seals and regalia of office from the capital, and the province weighs the newcomer's standing at court by their splendour."
 oe_theme_story.1.a: "Grant seals and regalia"
 oe_theme_story.1.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.1.b: "Send an imperial overseer along"
 oe_theme_story.1.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.1.c: "The usual"
 oe_theme_story.2.t: "A Proposal of Marriage"
 oe_theme_story.2.d: "A great family of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] has proposed a marriage to [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName]. The match would root the strategos deeper in the province, and put the family's hand inside his camp."
 oe_theme_story.2.a: "Allow the match"
 oe_theme_story.2.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years\n[oe_tu_authority|e] #R −2#!"
 oe_theme_story.2.b: "Offer a bride of imperial blood"
 oe_theme_story.2.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +15#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.2.c: "Forbid it"
 oe_theme_story.2.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.3.t: "Father to Son"
 oe_theme_story.3.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] is growing old and asks that his son succeed him in [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]. A theme that becomes a family inheritance may not answer to the next emperor."
 oe_theme_story.3.a: "Promise it, in words only"
 oe_theme_story.3.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +15#!, also added to its loyalty target for #Y 5#! years\n[oe_tu_authority|e] #R −3#!"
 oe_theme_story.3.b: "Summon the son to court"
 oe_theme_story.3.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years\n[oe_tu_authority|e] #G +2#!"
 oe_theme_story.3.c: "Decline gently"
 oe_theme_story.3.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.4.t: "An Old Soldier's Request"
 oe_theme_story.4.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] asks leave to lay down the command. [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] has served long in [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName], and the veterans follow no other banner."
 oe_theme_story.4.a: "Let the strategos retire with honour"
 oe_theme_story.4.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] steps down and a new strategos takes over\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.4.b: "Ask the strategos to stay"
 oe_theme_story.4.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +10#! (#Y 5#! years)"
 oe_theme_story.5.t: "A Famous General"
 oe_theme_story.5.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] has won victory after victory in [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName], and the markets sing the name. People have begun to compare the general with the emperor, and not to the emperor's advantage."
 oe_theme_story.5.a: "Grant a triumph"
 oe_theme_story.5.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.5.b: "Confer a high title"
 oe_theme_story.5.b.tt: "[oe_tu_authority|e] #R −5#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +20#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.5.c: "Keep it quiet"
 oe_theme_story.5.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.6.t: "An Intercepted Letter"
 oe_theme_story.6.d: "Palace agents have intercepted a letter from [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] to outsiders. Its wording is vague, but enough to raise suspicion."
 oe_theme_story.6.a: "Confront the strategos"
 oe_theme_story.6.a.tt: "#Y 60%#!: the strategos confesses, [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#! (also in its target for #Y 5#! years)\n#Y 40%#!: the strategos takes fright, [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, and a #R 20%#! chance of a rising next month\nWith the People's Favour in effect, the first outcome is about #Y 64%#! likely."
 oe_theme_story.6.b: "Keep a quiet watch"
 oe_theme_story.6.b.tt: "[oe_tu_authority|e] #R −2#!\nThe next time [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]'s loyalty falls below #Y 30#!, a warning comes at once"
 oe_theme_story.6.c: "Replace the strategos at once"
 oe_theme_story.6.c.tt: "#Y 70%#!: [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] steps down and a new strategos takes over\n#R 30%#!: [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] refuses to give up command and rises next month\nWith the People's Favour in effect, the first outcome is about #Y 74%#! likely."
 oe_theme_story.7.t: "Raiders on the Border"
 oe_theme_story.7.d: "Raiders from beyond the border have plundered villages in [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]. The frontier folk wait to see what the strategos will do."
 oe_theme_story.7.a: "Pursue them"
 oe_theme_story.7.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.7.b: "Strengthen the forts"
 oe_theme_story.7.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] starts building a fortress at once, paid from its treasury; if it already has a work under way, its treasury pays #R 80#! instead"
 oe_theme_story.7.c: "Abandon the open country"
 oe_theme_story.7.c.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] gains [ShowModifier('oe_ts_scorched_earth')] (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.8.t: "A Hero of the Border"
 oe_theme_story.8.d: "An akritas of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] has become famous for fighting ten men at once. People say Digenis has come again."
 oe_theme_story.8.a: "Grant him soldier-land"
 oe_theme_story.8.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.8.b: "Call him to the palace guard"
 oe_theme_story.8.c: "Let the poets sing of him"
 oe_theme_story.9.t: "Refugees at the Border"
 oe_theme_story.9.d: "Families fleeing the war beyond the border have crossed into [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName], asking for land to till."
 oe_theme_story.9.a: "Settle them"
 oe_theme_story.9.a.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] gains [ShowModifier('oe_ts_new_settlers')] (#Y 10#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.9.b: "Enrol them as soldiers"
 oe_theme_story.9.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.9.c: "Turn them away"
 oe_theme_story.10.t: "Crumbling Forts"
 oe_theme_story.10.d: "The border castles of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] have fallen into disrepair; a horse could pass through the cracks in their walls."
 oe_theme_story.10.a: "Pay from the capital"
 oe_theme_story.10.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] works efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.10.b: "Let the theme pay"
 oe_theme_story.10.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] treasury #R −100#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.10.c: "Leave them"
 oe_theme_story.10.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.11.t: "A Turncoat Commander"
 oe_theme_story.11.d: "An enemy commander has come over to [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] with his retinue, offering his sword to the empire. The veterans of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] do not care to share a camp with yesterday's foe."
 oe_theme_story.11.a: "Take him into the army"
 oe_theme_story.11.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.11.b: "Send him to the capital"
 oe_theme_story.11.c: "Refuse him"
 oe_theme_story.12.t: "Smuggling on the Frontier"
 oe_theme_story.12.d: "In the border markets of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName], grain, iron and horses are slipping across the frontier, and some of the strategos' own men handle the trade."
 oe_theme_story.12.a: "Tax it heavily"
 oe_theme_story.12.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.12.b: "Stamp it out"
 oe_theme_story.12.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.12.c: "Look the other way"
 oe_theme_story.12.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] treasury #G +80#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.13.t: "The Powerful Buy Up the Land"
 oe_theme_story.13.d: "The magnates of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] have swallowed many soldiers' holdings through loans and forced sales. A soldier without land can no longer furnish his own horse and arms."
 oe_theme_story.13.a: "Reissue the laws of Basil II"
 oe_theme_story.13.a.tt: "[oe_tu_authority|e] #G +2#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.13.b: "Let it be"
 oe_theme_story.13.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] treasury #G +100#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #R −10#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.13.c: "Fine them and move on"
 oe_theme_story.14.t: "The Tax Farmers' Greed"
 oe_theme_story.14.d: "The tax farmers of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] squeeze ever harder, and peasants gather at the church doors to complain."
 oe_theme_story.14.a: "End the tax farm"
 oe_theme_story.14.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] gets a finance officer from the capital (paid monthly from the treasury)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.14.b: "Back the tax farmers"
 oe_theme_story.14.b.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] gains [ShowModifier('oe_ts_taxfarm_unrest')] (#Y 5#! years)"
 oe_theme_story.14.c: "Audit the books"
 oe_theme_story.14.c.tt: "[oe_tu_authority|e] #R −2#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.15.t: "A Corrupt Judge"
 oe_theme_story.15.d: "The judge the court sent to [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] stands accused of taking bribes; the complaint has reached the capital."
 oe_theme_story.15.a: "Make an example of him"
 oe_theme_story.15.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.15.b: "Fine him"
 oe_theme_story.15.c: "Cover it up"
 oe_theme_story.15.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #R −15#! (#Y 5#! years)"
 oe_theme_story.16.t: "Monastic Estates"
 oe_theme_story.16.d: "The monasteries of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] produce old chrysobulls and ask that their wide estates be confirmed free of tax."
 oe_theme_story.16.a: "Confirm their rights"
 oe_theme_story.16.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.16.b: "Take back half"
 oe_theme_story.16.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.16.c: "Refer it to the Patriarch"
 oe_theme_story.16.c.tt: "[oe_tu_authority|e] #R −1#!"
 oe_theme_story.17.t: "The Patron Saint's Feast"
 oe_theme_story.17.d: "The feast of the patron saint of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] has come, and the whole town waits to see who will pay for the celebrations."
 oe_theme_story.17.a: "The emperor pays"
 oe_theme_story.17.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] civil administration efficiency #G +10#! (#Y 5#! years)"
 oe_theme_story.17.b: "The strategos presides"
 oe_theme_story.17.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.18.t: "Sickness and Dearth"
 oe_theme_story.18.d: "Sickness and a failed harvest have struck [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] together; the granaries will not last until next year."
 oe_theme_story.18.a: "Relief from the capital"
 oe_theme_story.18.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +15#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.18.b: "The theme fends for itself"
 oe_theme_story.18.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] treasury #R −100#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.18.c: "Remit the taxes"
 oe_theme_story.18.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #R −15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.19.t: "A Boundary Dispute"
 oe_theme_story.19.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] and [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] are quarrelling over a few villages on their boundary, and their soldiers have already come to blows."
 oe_theme_story.19.a: "Award them to [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]"
 oe_theme_story.19.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.19.b: "Award them to [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName]"
 oe_theme_story.19.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.19.c: "Split the difference"
 oe_theme_story.19.c.tt: "[oe_tu_authority|e] #R −3#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +3#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] loyalty #G +3#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.20.t: "An Old Feud"
 oe_theme_story.20.d: "The old feud between [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] and [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetGovernment.GetRuler.GetName] has flared again; each denounces the other in his reports to the emperor."
 oe_theme_story.20.a: "Mediate"
 oe_theme_story.20.a.tt: "[oe_tu_authority|e] #R −3#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.20.b: "Divide and rule"
 oe_theme_story.20.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years\nFor #Y 10#! years neither [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] nor [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] will join another theme's rising"
 oe_theme_story.20.c: "Let them fight it out"
 oe_theme_story.20.c.tt: "One of them at random: loyalty #R −10#! (also in its target for #Y 5#! years)"
 oe_theme_story.21.t: "Standing Together"
 oe_theme_story.21.d: "The enemy is besieging a town of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName]. [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] has sent riders begging for help: the nearest troops are those of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName], though the capital could also send relief."
 oe_theme_story.21.a: "Order [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] to march"
 oe_theme_story.21.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme2').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.21.b: "Relief from the capital"
 oe_theme_story.21.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.22.t: "The Great Review"
 oe_theme_story.22.d: "Summoned from every frontier, the strategoi of the empire's themes have assembled in Constantinople with their banners and honour guards to parade before the Emperor at the Hippodrome. Such a grand review can cement provincial loyalty and dazzle foreign envoys alike—whether to spare no expense or keep the pageant modest rests on the sovereign's word."
 oe_theme_story.22.a: "A grand review"
 oe_theme_story.22.a.tt: "Every theme: loyalty #G +5#!, also in its target for #Y 5#! years"
 oe_theme_story.22.b: "Keep it modest"
 oe_theme_story.22.b.tt: "Every theme: loyalty #G +2#!, also in its target for #Y 5#! years"
 oe_theme_story.23.t: "Pirates in the Aegean"
 oe_theme_story.23.d: "The light craft of the Turkish emirs have appeared again off [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName], seizing merchantmen and carrying off villagers from the coast. Men like Umur of Aydın never lack imitators."
 oe_theme_story.23.a: "Sweep the seas"
 oe_theme_story.23.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.23.b: "Pay the ransoms"
 oe_theme_story.23.c: "Sail in convoy"
 oe_theme_story.23.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.24.t: "Italian Merchants Ask for a Harbour"
 oe_theme_story.24.d: "Merchants of Genoa and Venice have come to [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] asking to lease a quay and warehouses in the harbour, and for relief from the customs."
 oe_theme_story.24.a: "Grant a charter"
 oe_theme_story.24.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.24.b: "A short lease only"
 oe_theme_story.24.c: "Refuse"
 oe_theme_story.24.c.tt: "Genoa and Venice think less of us (fades over the years)"
 oe_theme_story.25.t: "Fragments on the Sea Fire"
 oe_theme_story.25.d: "Craftsmen of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] have found a few torn pages in an old arsenal, recording the making of the 'sea fire' and its siphons. The writing has faded."
 oe_theme_story.25.a: "Fund the reconstruction"
 oe_theme_story.25.a.tt: "Byzantium gains [ShowModifier('oe_ts_sea_fire')] for #Y 20#! years (naval morale #G +10%#!)"
 oe_theme_story.25.b: "Lock them away in the palace"
 oe_theme_story.26.t: "The Latin Lords"
 oe_theme_story.26.d: "The Latin lords of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] have petitioned together to keep their hereditary fiefs and courts."
 oe_theme_story.26.a: "Keep their feudal rights"
 oe_theme_story.26.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +15#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] civil administration efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.26.b: "Bring in Roman law"
 oe_theme_story.26.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] civil administration efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.27.t: "Two Bishops"
 oe_theme_story.27.d: "The cathedral of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] has both a Latin and a Greek bishop, and their flocks have come to blows in the streets."
 oe_theme_story.27.a: "Support the Orthodox bishop"
 oe_theme_story.27.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.27.b: "Let both stand"
 oe_theme_story.27.b.tt: "[oe_tu_authority|e] #R −2#!"
 oe_theme_story.28.t: "The City Council"
 oe_theme_story.28.d: "The city council of [GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] asks to run its own markets and walls, paying the empire a fixed tribute."
 oe_theme_story.28.a: "Recognise the council"
 oe_theme_story.28.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +5#!, also added to its loyalty target for #Y 5#! years\n[oe_tu_authority|e] #R −2#!"
 oe_theme_story.28.b: "Dissolve the council"
 oe_theme_story.28.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years\n[oe_tu_authority|e] #G +2#!"
 oe_theme_story.29.t: "The Feast of Saint Demetrios"
 oe_theme_story.29.d: "At the October feast of Saint Demetrios, Thessaloniki is thronged with merchants and pilgrims. The city's magnates and the sailors' guild of the harbour quarrel over who pays for it; the sailors say all the city's money ends up in the magnates' purses."
 oe_theme_story.29.a: "Side with the magnates"
 oe_theme_story.29.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] justice efficiency #R −10#! (#Y 5#! years)\nThe sailors and common folk will remember this"
 oe_theme_story.29.b: "Satisfy the guild"
 oe_theme_story.29.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] civil administration efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years\nThe magnates will remember this"
 oe_theme_story.29.c: "Take no side"
 oe_theme_story.30.t: "The Court at Mistra"
 oe_theme_story.30.d: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetGovernment.GetRuler.GetName] has gathered scholars and craftsmen at his court in Mistra, and people have begun to call it 'little Constantinople'. The strategos asks the emperor for the title of despot."
 oe_theme_story.30.a: "Grant the title of despot"
 oe_theme_story.30.a.tt: "[oe_tu_authority|e] #R −5#!\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +20#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.30.b: "Endow the scholars"
 oe_theme_story.30.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] civil administration efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.30.c: "Leave things as they are"
 oe_theme_story.30.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.31.t: "The House of Gabras"
 oe_theme_story.31.d: "The highlanders of Chaldia follow no one but the house of Gabras, whose duke once ruled here as his own master two centuries ago. His descendants now ask to lead the frontier troops by the old custom."
 oe_theme_story.31.a: "Let them lead by the old custom"
 oe_theme_story.31.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +15#!, also added to its loyalty target for #Y 5#! years\n[oe_tu_authority|e] #R −2#!"
 oe_theme_story.31.b: "Call the frontier troops to the capital"
 oe_theme_story.31.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.32.t: "The Estates of Crete"
 oe_theme_story.32.d: "Following the recovery of Crete, simmering agrarian grievances have broken into the open. The rich olive groves and feudal estates carved out for Latin settlers during Venetian rule remain in foreign landlords' hands, while native Greek peasants petition the throne in growing anger to break up the manors and return the soil to those who work it."
 oe_theme_story.32.a: "Keep the estates"
 oe_theme_story.32.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.32.b: "Give the land to the peasants"
 oe_theme_story.32.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #R −10#! (#Y 5#! years)"
 oe_theme_story.33.t: "The Goths of Mangup"
 oe_theme_story.33.d: "In the hill city of Mangup there still live Goths who speak a Germanic tongue. Their prince, who calls himself lord of Theodoro, will swear to the emperor if he may keep his harbours and vineyards."
 oe_theme_story.33.a: "Recognise the Gothic prince"
 oe_theme_story.33.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #G +10#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.33.b: "Open the harbours to trade"
 oe_theme_story.33.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] finance efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.34.t: "Before the Walls of Nicaea"
 oe_theme_story.34.d: "The Ottoman tents are pitched outside Nicaea once more. The old walls saw the first Ecumenical Council and the crusaders; now they need defenders."
 oe_theme_story.34.a: "Repair the walls"
 oe_theme_story.34.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] works efficiency #G +15#! (#Y 5#! years)"
 oe_theme_story.34.b: "Trade with the Ottomans"
 oe_theme_story.34.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] loyalty #R −5#!, also added to its loyalty target for #Y 5#! years"
 oe_theme_story.34.c: "Drive them off"
 oe_theme_story.34.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ts_theme').GetCountry.GetName] military efficiency #G +15#! (#Y 5#! years)"
