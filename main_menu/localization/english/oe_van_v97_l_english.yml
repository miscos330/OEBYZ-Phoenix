 oe_van_v97.2.b:0 "Consolidate realm-wide goodwill for stability and prestige"
 oe_van_v97.3.t:0 "Allied War Council: Subject Directives"
 oe_van_v97.3.d:0 "Your wartime directive has reached the camps of all loyal co-belligerent subjects. The marshal asks whether to fund a temporary Imperial Allied War Staff to keep subject loyalty high and sharpen combined siege coordination."
 oe_van_v97.3.a:0 "Fund the Allied War Staff (2 years: +8 Subject Loyalty, +6% Siege)"
 oe_van_v97.3.b:0 "Rely on regular logistics and conserve the treasury"
