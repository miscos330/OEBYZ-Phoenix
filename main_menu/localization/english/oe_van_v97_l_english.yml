 oe_van_v97.2.t:0 "Peaceful Charter Transition"
 oe_van_v97.2.d:0 "Rather than triggering civil upheaval through blunt revocation, the crown has smoothly converted a medieval estate privilege into an early-modern charter by negotiated settlement. Estates and councillors await direction on how to channel this reform momentum:"
