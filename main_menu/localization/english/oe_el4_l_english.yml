l_english:
# NEW 2026-11-23 v21.0 Fourth Rome (ELR / Nova Elysia) Deepening (oe_el4_). Generated by gen_v210_fourth_rome.py.
 oe_elysian_senate:0 "Elysian Imperial Senate"
 oe_elysian_senate_desc:0 "The constitutional senate of Nova Elysia at Nea Konstantinoupolis, uniting exiled patricians, clergy, maritime burghers, and frontier freeholders with full authority to convene rural sessions across New World settlements."
 oe_el4_parl_chesapeake_estates:0 "Chesapeake Manor Charters Act"
 oe_el4_parl_chesapeake_estates_desc:0 "Confirm surveyed river-valley estates for exiled Roman patricians across the Chesapeake, strengthening aristocratic loyalty, provincial control, and tax receipts."
 oe_el4_parl_appalachian_themes:0 "Appalachian Border Theme Act"
 oe_el4_parl_appalachian_themes_desc:0 "Organize hereditary western military themes guarding the Blue Ridge passes, bolstering fortress defense, provincial manpower, and garrison upkeep efficiency."
 oe_el4_parl_western_silk_guild:0 "Western Sea Silk Guild Charter"
 oe_el4_parl_western_silk_guild_desc:0 "Grant imperial guild marks and reeling patents to Chesapeake mulberry merchants, lifting maritime silk revenues and merchant competitiveness."
 oe_el4_parl_atlantic_marine_insurance:0 "Atlantic Maritime Insurance Act"
 oe_el4_parl_atlantic_marine_insurance_desc:0 "Establish a Senate-backed marine underwriting pool to insure Elysian convoys against Atlantic gales and corsairs, boosting sea trade and merchant capacity."
 oe_el4_parl_new_rome_patriarchate_code:0 "New Rome Ecclesiastical Code"
 oe_el4_parl_new_rome_patriarchate_code_desc:0 "Standardize parish endowments, cathedral courts, and frontier missions across Nova Elysia, strengthening religious influence, conversion speed, and clerical harmony."
 oe_el4_parl_asclepius_hospice_act:0 "Asclepius Quarantine & Hospice Act"
 oe_el4_parl_asclepius_hospice_act_desc:0 "Co-fund harbor lazarettos and clerical infirmaries across the Chesapeake to curb New World endemic fevers and sustain healthy demographic growth."
 oe_el4_parl_freeholder_homestead_act:0 "New World Freeholder Homestead Act"
 oe_el4_parl_freeholder_homestead_act_desc:0 "Issue protected freehold deeds to pioneering families along the Potomac and James rivers, lifting peasant loyalty, westward migration, and grain harvests."
 oe_el4_parl_maize_wheat_agronomy:0 "Maize-Wheat Mixed Agronomy Ordinance"
 oe_el4_parl_maize_wheat_agronomy_desc:0 "Distribute mixed seed manuals combining Mediterranean wheat with Algonquian maize and legumes, multiplying Chesapeake food surpluses and rural prosperity."
 oe_el4_pa_nobles_senatorial_stipend:0 "Grant Senatorial Frontier Stipends"
 oe_el4_pa_nobles_senatorial_stipend_simple:0 "Senatorial Frontier Stipends"
 oe_el4_pa_nobles_senatorial_stipend_desc:0 "Patrician senators ask for five-year frontier manor stipends in return for decisive aristocratic support in the Elysian Senate."
 oe_el4_pa_burghers_harbor_tariff_rebate:0 "Approve Chesapeake Harbor Tariff Rebate"
 oe_el4_pa_burghers_harbor_tariff_rebate_simple:0 "Harbor Tariff Rebate"
 oe_el4_pa_burghers_harbor_tariff_rebate_desc:0 "Maritime guilds pledge enthusiastic backing in the Senate if harbor customs caps are eased for five years."
 oe_el4_pa_burghers_shipyard_charter:0 "Issue Guild Slipway Timber Charter"
 oe_el4_pa_burghers_shipyard_charter_simple:0 "Shipyard Timber Charter"
 oe_el4_pa_burghers_shipyard_charter_desc:0 "Chesapeake shipwrights seek reserved oak timber concessions to expand slipways in exchange for urban votes."
 oe_el4_pa_clergy_monastic_glebe:0 "Confirm New World Monastic Glebes"
 oe_el4_pa_clergy_monastic_glebe_simple:0 "Monastic Glebe Protection"
 oe_el4_pa_clergy_monastic_glebe_desc:0 "Clerical deputies offer solid backing in the Elysian Senate if frontier monastic glebes remain exempt from extraordinary taxes for five years."
 oe_el4_pa_clergy_hospice_tithe:0 "Endow Asclepius Hospice & Scriptorium"
 oe_el4_pa_clergy_hospice_tithe_simple:0 "Hospice & Scriptorium Grant"
 oe_el4_pa_clergy_hospice_tithe_desc:0 "Bishops and physicians request a modest treasury tithe for harbor hospices and scriptoria in exchange for clergy support."
 oe_el4_pa_peasants_frontier_tax_holiday:0 "Declare Frontier Clearing Tax Holiday"
 oe_el4_pa_peasants_frontier_tax_holiday_simple:0 "Frontier Tax Holiday"
 oe_el4_pa_peasants_frontier_tax_holiday_desc:0 "Freeholder representatives demand a five-year homestead tax holiday on newly cleared Chesapeake farmlands in return for peasant backing."
 oe_el4_pm_chesapeake_oak_shipwrights:0 "Chesapeake Oak & Pine Shipwrights"
 oe_el4_pm_chesapeake_oak_shipwrights_desc:0 "Turns abundant Virginia oak, pitch tar, and hemp cordage into seaworthy hulls and naval rigging for early Elysian commerce."
 oe_el4_pm_copper_sheathed_rigging:0 "Copper-Sheathed Hull Fitting"
 oe_el4_pm_copper_sheathed_rigging_desc:0 "Reinforces Chesapeake planking with hammered copper sheets and iron fastenings to resist tropical shipworms across Atlantic routes."
 oe_el4_pm_appalachian_iron_steel:0 "Appalachian Blast-Furnace Steel"
 oe_el4_pm_appalachian_iron_steel_desc:0 "Smelts Appalachian bog iron and coal into high-grade structural steel for frontier cannon, ship anchors, and engineering works."
 oe_el4_pm_chesapeake_refined_steel:0 "Chesapeake Crucible Refined Steel"
 oe_el4_pm_chesapeake_refined_steel_desc:0 "Combines New World iron, copper alloys, and coal in sealed Roman-style crucibles to forge strategic refined steel for heavy ordnance and steam machinery."
 oe_el4_chesapeake_shipwright_guild:0 "Chesapeake Shipwrights' Guild"
 oe_el4_chesapeake_shipwright_guild_desc:0 "An early-to-midgame coastal guild yard of Nova Elysia uniting Byzantine naval architects with Virginia timberwrights to anchor trade center strength and maritime income."
 oe_el4_appalachian_foundry:0 "Appalachian Imperial Iron & Steel Foundry"
 oe_el4_appalachian_foundry_desc:0 "An Age of Discovery metallurgical complex unlocked by Blast Furnace technology, integrating New World iron and copper mines into Nova Elysia's strategic refined-steel industrial loop."
 oe_el4_adv_chesapeake_akritai:0 "Chesapeake Akritai Frontier Doctrine"
 oe_el4_adv_chesapeake_akritai_desc:0 "Adapts Byzantine border akritai companies to Virginia timber stockades and coastal garrisons, unlocking Chesapeake Akritai infantry."
 oe_el4_adv_elysian_dromon:0 "Elysian Patrol Dromon Design"
 oe_el4_adv_elysian_dromon_desc:0 "Rebuilds classic Roman oared dromons with shallow Chesapeake drafts and bow fire-pots for coastal supremacy, unlocking Elysian Patrol Dromons."
 oe_el4_adv_algonquin_peltasts:0 "Algonquin-Hellenic Peltast Corps"
 oe_el4_adv_algonquin_peltasts_desc:0 "Blends Hellenistic peltast skirmish drills with Algonquian woodland archery and ambush craft, unlocking Algonquin Peltasts."
 oe_el4_adv_atlantic_ironclad:0 "Atlantic Greek-Fire Steam Ironclad"
 oe_el4_adv_atlantic_ironclad_desc:0 "Pairs Chesapeake refined-steel armor plating and revolutionary steam boilers with pressurized incendiary projectors, unlocking Atlantic Steam Ironclads."
 oe_el4_chesapeake_akritai:0 "Chesapeake Akritai"
 oe_el4_chesapeake_akritai_desc:0 "Sturdy Age of Traditions heavy frontier infantry who guard Nova Elysia's nascent stockades, river crossings, and colonial towns."
 oe_el4_elysian_dromon:0 "Elysian Patrol Dromon"
 oe_el4_elysian_dromon_desc:0 "Swift Age of Traditions Roman patrol galleys adapted for the Chesapeake Bay, Outer Banks shoals, and Caribbean coastal sweeps."
 oe_el4_algonquin_peltasts:0 "Algonquin Foederati Peltasts"
 oe_el4_algonquin_peltasts_desc:0 "Agile Renaissance skirmishers combining Roman discipline with woodland scouting, excelling in North American forests and wetlands."
 oe_el4_atlantic_ironclad:0 "Atlantic Greek-Fire Ironclad"
 oe_el4_atlantic_ironclad_desc:0 "Pinnacle Age of Revolutions armored steam capital ship forged in Chesapeake yards, projecting unbroken Fourth Roman mastery over every ocean."
 oe_el4_human_only_tt:0 "Controlled by a human player"
 oe_el4_dec_restore_senate.title:0 "Restore the Elysian Senate & Purge Tribal Remnants"
 oe_el4_dec_restore_senate.desc:0 "Emergency constitutional restoration for Nova Elysia: formally convenes the Elysian Imperial Senate at our capital, strips every inherited native tribal reform or privilege, restores balanced four-estate satisfaction, and activates the appropriate tier of our 75-year founding economic curve."
 oe_el4_dec_restore_senate.a:0 "Convene the Senate and purge all tribal residue."
 oe_el4_dec_restore_senate_tt:0 "Binds #Y Elysian Imperial Senate#! to our capital, purges inherited tribal reforms/privileges, restores estate harmony, and activates the matching founding economy stage."
 oe_el4_dec_foederati_border_charter.title:0 "Proclaim the Foederati Border Charter"
 oe_el4_dec_foederati_border_charter.desc:0 "Grant recognized Roman Foederati border status to indigenous woodland clans within Nova Elysia, curtailing independent tribal estate leverage while turning frontier discontent into loyal scouts, manpower, and fur revenue."
 oe_el4_dec_foederati_border_charter.a:0 "Seal the Foederati Border Charter."
 oe_el4_dec_foederati_border_charter_tt:0 "Replaces any rival assimilation edict with #Y Foederati Border Charter#! for #Y 25 years#! and immediately lifts tribal satisfaction."
 oe_el4_dec_civic_assimilation_act.title:0 "Enact the Elysian Civic Assimilation Charter"
 oe_el4_dec_civic_assimilation_act.desc:0 "Enroll frontier villages into municipal tax rolls and bilingual civic schools, dissolving separate tribal corporate power while accelerating cultural assimilation and empowering freeholders and burghers."
 oe_el4_dec_civic_assimilation_act.a:0 "Enroll the frontier into Roman civic life."
 oe_el4_dec_civic_assimilation_act_tt:0 "Applies #Y Elysian Civic Assimilation Charter#! for #Y 25 years#!, sharply curbing tribal power while boosting assimilation and freeholder/burgher strength."
 oe_el4_dec_chesapeake_free_port.title:0 "Charter the Chesapeake Imperial Free Port"
 oe_el4_dec_chesapeake_free_port.desc:0 "Endow our Chesapeake capital with duty-free entrepot warehouses, stone breakwaters, and imperial admiralty trade courts to break early New World market isolation and expand trade attraction."
 oe_el4_dec_chesapeake_free_port.a:0 "Proclaim the Chesapeake Free Port."
 oe_el4_dec_chesapeake_free_port_tt:0 "Applies #Y Chesapeake Imperial Free Port#! to our capital and #Y West Sea Free Port Charter#! nationally for #Y 25 years#!, raising capital development and prosperity."
 oe_el4_free_port_cd_tt:0 "Not used within the last 15 years"
 oe_el4_dec_exarchate_council.title:0 "Convene the Pan-Atlantic Exarchate Council"
 oe_el4_dec_exarchate_council.desc:0 "Summon the imperial Exarchs of Nova Elysia to Nea Konstantinoupolis to harmonize colonial defense, reduce liberty desire, collect naval tribute, and coordinate with allied Vinland or Spartania."
 oe_el4_dec_exarchate_council.a:0 "Open the Pan-Atlantic Exarchate Council."
 oe_el4_dec_exarchate_council_tt:0 "Lowers liberty desire across all #Y Imperial Exarchates#!, grants #Y Pan-Atlantic Exarchate Council#! for #Y 15 years#!, collects naval tribute, and grants a bonus pact if Vinland or Spartania survives."
 oe_el4_exarchate_cd_tt:0 "Exarchate Council is not on 15-year cooldown"
 oe_el4_dec_atlantic_synod.title:0 "Convoke the Atlantic Orthodox Synod"
 oe_el4_dec_atlantic_synod.desc:0 "Assemble the metropolitans and abbots of Western Orthodoxy beneath Nea Hagia Sophia to harmonize frontier liturgy, fund missions, and fortify spiritual unity."
 oe_el4_dec_atlantic_synod.a:0 "Convene the Western Orthodox bishops."
 oe_el4_dec_atlantic_synod_tt:0 "Grants #Y Decrees of the Atlantic Orthodox Synod#! for #Y 15 years#! and boosts clergy satisfaction."
 oe_el4_dec_neoplatonic_academy.title:0 "Charter the Hesperian Neoplatonic Academy"
 oe_el4_dec_neoplatonic_academy.desc:0 "Endow a grand classical academy of philosophy, astronomy, and Roman jurisprudence under the Western Pantheon, accelerating research, literacy, and institution growth across Nova Elysia."
 oe_el4_dec_neoplatonic_academy.a:0 "Light the lamps of the Western Academy."
 oe_el4_dec_neoplatonic_academy_tt:0 "Grants #Y Hesperian Neoplatonic Academy#! for #Y 20 years#! and raises capital development."
 oe_el4_dec_chesapeake_sanctuary_edicts.title:0 "Issue Chesapeake Artisan Sanctuary Edicts"
 oe_el4_dec_chesapeake_sanctuary_edicts.desc:0 "Under the Chesapeake Union Church, proclaim open religious asylum for skilled European artisans and dissenting scholars, welcoming fresh burgher settlers directly into our capital."
 oe_el4_dec_chesapeake_sanctuary_edicts.a:0 "Open our harbors to exiled artisans and scholars."
 oe_el4_dec_chesapeake_sanctuary_edicts_tt:0 "Grants #Y Chesapeake Artisan Sanctuary Edicts#! for #Y 20 years#!, settles skilled burghers in our capital, and boosts capital development."
 oe_el4_rel_dec_cd_tt:0 "Religious path charter is not on 15-year cooldown"
 oe_el4.1.title:0 "Scouts Beyond the Blue Ridge"
 oe_el4.1.desc:0 "Elysian border scouts returning from the forested Blue Ridge report navigable mountain gaps opening onto fertile western river valleys inhabited by inland woodland nations. The Senate debates whether to crown the passes with stone watchtowers or open a peaceful pack-horse trade trail."
 oe_el4.1.a:0 "Erect stone watchtowers across the Blue Ridge passes"
 oe_el4.1.a.tt:0 "Fortifies our mountain frontier for #Y 25 years#! and builds army tradition."
 oe_el4.1.b:0 "Charter a peaceful woodland trade trail to the interior"
 oe_el4.1.b.tt:0 "Boosts trade, raw materials, and tribal goodwill for #Y 25 years#! while charting the Ohio and Kentucky interior."
 oe_el4.2.title:0 "Chesapeake Fevers & the Asclepius Quarantine Harbor"
 oe_el4.2.desc:0 "Humid Chesapeake summers bring unfamiliar marsh fevers and flux that threaten our young settlements. Imperial physicians trained in the hospitals of Constantinople urge building a permanent Asclepius quarantine harbor, while frugal senators propose blending local Algonquian herbal remedies with existing infirmaries."
 oe_el4.2.a:0 "Establish the Asclepius Quarantine Harbor & Medical Code"
 oe_el4.2.a.tt:0 "Grants #Y +30% Disease Resistance#! and population growth for #Y 35 years#!, and prepares Nova Elysia against future Old World epidemics."
 oe_el4.2.b:0 "Compile a Greco-Algonquian herbal pharmacopoeia"
 oe_el4.2.b.tt:0 "Provides frugal epidemic resistance and peasant goodwill for #Y 25 years#!."
 oe_el4.3.title:0 "Constitutional Debate of the First Native-Born Generation"
 oe_el4.3.desc:0 "Three decades after landfall, young nobles, sea captains, and farmers born on Chesapeake soil fill the galleries of the Elysian Senate. Unlike their exile elders, they see Nova Elysia not as a temporary camp but as a permanent Roman commonwealth demanding a clear constitutional balance."
 oe_el4.3.a:0 "Codify a balanced Second-Generation Constitutional Compact"
 oe_el4.3.a.tt:0 "Boosts parliamentary support, legislative efficiency, and estate satisfaction for #Y 25 years#!."
 oe_el4.3.b:0 "Affirm the Basileus's executive primacy"
 oe_el4.3.b.tt:0 "Raises legitimacy, crown alignment, and noble respect."
 oe_el4.3.c:0 "Expand the Chesapeake Freeholders' Charter"
 oe_el4.3.c.tt:0 "Lifts peasant and burgher satisfaction and shifts society toward free subjects."
 oe_el4.4.title:0 "Mulberry Silk & Golden Leaf on the Chesapeake"
 oe_el4.4.desc:0 "Silkworm eggs smuggled out of the Morea aboard the Ark have finally acclimatized to Virginia mulberries, even as Chesapeake river estates reap bumper crops of indigenous tobacco and maize. Guildmasters urge concentrating capital behind imperial silk ergasteria, while planters press for open cash-crop exports."
 oe_el4.4.a:0 "Sponsor imperial Chesapeake mulberry silk ergasteria"
 oe_el4.4.a.tt:0 "Grants #Y Chesapeake Mulberry Silk Monopoly#! for #Y 25 years#! and boosts capital development."
 oe_el4.4.b:0 "Expand riverfront tobacco and maize export estates"
 oe_el4.4.b.tt:0 "Grants #Y Chesapeake Golden Leaf & Maize Boom#! for #Y 25 years#! and enriches the treasury."
 oe_el4.5.title:0 "Envoys of the Great Lakes & Longhouse"
 oe_el4.5.desc:0 "Traders canoeing north from the Susquehanna bring belts of wampum and prime beaver pelts from the Great Lakes and Haudenosaunee longhouses. Reaching a durable fur league could anchor our northern frontier for generations, though frontier commanders warn against letting armed confederacies grow unchecked."
 oe_el4.5.a:0 "Seal the Great Lakes Fur & Longhouse League"
 oe_el4.5.a.tt:0 "Grants #Y Great Lakes Fur & Longhouse League#! for #Y 25 years#! and improves Haudenosaunee goodwill."
 oe_el4.5.b:0 "Fortify the northern river marches instead"
 oe_el4.5.b.tt:0 "Strengthens northern defense and army tradition."
 oe_el4.6.title:0 "Expedition to the Great Western River"
 oe_el4.6.desc:0 "Guided by woodland interpreters, Roman cartographers have crossed the western watersheds to behold an immense river rolling southward toward an unseen gulf. The Senate marvels at a continental artery broader than the Danube itself."
 oe_el4.6.a:0 "Charter riverine trade depots along the Mississippi"
 oe_el4.6.a.tt:0 "Charts the Mississippi and Tennessee basins and grants #Y Great Western River Trade Depots#! for #Y 25 years#!."
 oe_el4.6.b:0 "Claim the watershed in the Basileus's name for prestige and maps"
 oe_el4.6.b.tt:0 "Charts the interior valleys and grants prestige and cultural influence."
 oe_el4.7.title:0 "The Florida Straits & Southern Warm Current"
 oe_el4.7.desc:0 "Elysian caravels following the warm Atlantic current southward have rounded a sun-drenched peninsula into turquoise island seas teeming with reefs and sheltered coves. Controlling these straits will command every future sea lane between the Americas and the Old World."
 oe_el4.7.a:0 "Establish a permanent Florida Straits naval watch"
 oe_el4.7.a.tt:0 "Charts Florida and grants #Y Florida Straits & Caribbean Watch#! for #Y 25 years#! plus navy tradition."
 oe_el4.7.b:0 "Dispatch light cruisers to clear southern raiders"
 oe_el4.7.b.tt:0 "Charts Florida, boosts sailors, and grants gold from seized contraband."
 oe_el4.8.title:0 "Stone Pyramids of the Western Sun"
 oe_el4.8.desc:0 "Beyond the warm southern gulf our navigators have encountered towering stepped pyramids, bustling canoe ports, and artisans working gold, silver, and razor-sharp obsidian. Envoys from these Mesoamerican realms marvel at Roman steel and purple silk."
 oe_el4.8.a:0 "Open imperial silver and obsidian trade embassies"
 oe_el4.8.a.tt:0 "Grants #Y Mesoamerican Silver & Obsidian Envoy Pact#! for #Y 25 years#! and treasury bullion."
 oe_el4.8.b:0 "Send military engineers to survey coastal fortresses"
 oe_el4.8.b.tt:0 "Boosts army and navy tradition and prepares future southern expeditions."
 oe_el4.9.title:0 "Dark Tidings Across the Ocean: The Year 1453"
 oe_el4.9.desc:0 "A battered merchant carrack blown westward from the Azores bears staggering parchment letters from the Mediterranean: great siege bombards have thundered against the Theodosian Walls of Old Constantinople, and waves of Greek scholars and refugees look westward in desperation."
 oe_el4.9.a:0 "Open our harbors to refugee scholars and architects"
 oe_el4.9.a.tt:0 "Grants #Y Exiled Scholars of 1453#! for #Y 30 years#!, settles burghers in our capital, and boosts development."
 oe_el4.9.b:0 "Swear the Oath of Nostos beneath the Twin-Headed Eagle"
 oe_el4.9.b.tt:0 "Grants #Y Oath of the Western Nostos#! for #Y 30 years#! and lifts prestige and legitimacy."
 oe_el4.10.title:0 "Sails of the Far North: Kinship with Vinland"
 oe_el4.10.desc:0 "Following cold cod-fishing banks northward past fog-shrouded capes, Elysian skippers have met bearded Norse-descended mariners who still remember the axe-bearing Varangian Guard of Old Byzantium. Their seamanship in ice-strewn waters could fortify our northern wing."
 oe_el4.10.a:0 "Renew the ancient Varangian-Vinland brotherhood"
 oe_el4.10.a.tt:0 "Grants #Y North Atlantic Varangian Brotherhood#! for #Y 25 years#! and adds sailors."
 oe_el4.10.b:0 "Trade Mediterranean bronze and cloth for northern cod and timber"
 oe_el4.10.b.tt:0 "Enriches the treasury and improves burgher satisfaction."
 oe_el4.11.title:0 "Copper Keels for the Coming Atlantic Storm"
 oe_el4.11.desc:0 "Cartographers and sea captains warn that Old World caravels from Iberia and Western Europe are probing ever deeper into the open ocean. Before European fleets sight our shores, the Elysian Admiralty proposes a grand refit of Chesapeake drydocks and copper-sheathed warships."
 oe_el4.11.a:0 "Launch the Copper-Hull Atlantic Admiralty program"
 oe_el4.11.a.tt:0 "Grants #Y Copper-Hull Atlantic Admiralty#! for #Y 25 years#! and boosts naval tradition."
 oe_el4.11.b:0 "Fortify coastal bastions and reserve treasury bullion"
 oe_el4.11.b.tt:0 "Grants defensive fortifications and boosts stability."
 oe_el4.12.title:0 "The Manifesto of the Four Romes"
 oe_el4.12.desc:0 "As oceanic sealanes reconnect the hemispheres, envoys bring word of rival imperial claimants across Eurasia—the Ottoman Sultanate on the Bosporus, the Muscovite Tsardom proclaiming a Third Rome in the north, and the Holy Roman Empire in Central Europe. In the full majesty of the Elysian Senate, the Fourth Rome must declare its grand destiny to the world."
 oe_el4.12.a:0 "Proclaim exclusive Fourth Roman legitimacy — prepare the Nostos!"
 oe_el4.12.a.tt:0 "Grants #Y Manifesto of the Sole Fourth Rome#! for #Y 30 years#!, rivals Old World imperial claimants, and primes the Nostos return line."
 oe_el4.12.b:0 "Proclaim the Concord of the Twin Eagles — Imperium Bicephalum!"
 oe_el4.12.b.tt:0 "Grants #Y Concord of the Twin Eagles#! for #Y 30 years#!, builds diplomatic stature, and bridges into Imperium Bicephalum."
 oe_el4.12.c:0 "Proclaim Eternal Elysia — Sovereign Imperium of the Western World!"
 oe_el4.12.c.tt:0 "Grants #Y Sovereign Majesty of Eternal Elysia#! for #Y 30 years#!, elevating internal prosperity, scholarship, and estate harmony."
 oe_el4.13.title:0 "Cathedrals of the Western Patriarchate"
 oe_el4.13.desc:0 "Across the Chesapeake and Potomac valleys, new stone churches rise alongside indigenous villages. Western Orthodox bishops debate whether to translate liturgical hymns into Algonquian tongues to hasten conversion or preserve strict Byzantine Greek chant across all dioceses."
 oe_el4.13.a:0 "Authorize vernacular frontier liturgy in the tradition of Cyril and Methodius"
 oe_el4.13.a.tt:0 "Grants #Y Decrees of the Atlantic Orthodox Synod#! for #Y 25 years#! and improves native conversion and harmony."
 oe_el4.13.b:0 "Uphold unbroken Constantinopolitan Greek chant"
 oe_el4.13.b.tt:0 "Elevates clergy satisfaction, legitimacy, and Hellenic cultural tradition."
 oe_el4.14.title:0 "Three Sees Across Two Oceans"
 oe_el4.14.desc:0 "With transoceanic contact restored, senior hierarchs from Eastern Europe and the Mediterranean send solemn letters asking where the throne of Nea Konstantinoupolis stands within the Orthodox Pentarchy: in sisterly communion with Old Byzantium and Moscow, or as a fully independent Atlantic Patriarchate?"
 oe_el4.14.a:0 "Proclaim the independent Atlantic Patriarchate of Nea Konstantinoupolis"
 oe_el4.14.a.tt:0 "Grants #Y Independent Atlantic Patriarchate#! for #Y 30 years#! and lifts prestige and legitimacy."
 oe_el4.14.b:0 "Seal the Communion of the Three Roman Sees"
 oe_el4.14.b.tt:0 "Grants #Y Communion of the Three Roman Sees#! for #Y 30 years#! and strengthens relations with Orthodox powers."
 oe_el4.15.title:0 "The Hesperian Neoplatonic Academy"
 oe_el4.15.desc:0 "Scholars of the revived Western Pantheon propose erecting a grand colonnaded Academy beside the temples of Nea Konstantinoupolis, uniting Platonic philosophy, natural science, and Roman civic jurisprudence."
 oe_el4.15.a:0 "Endow the Hesperian Neoplatonic Academy with imperial grants"
 oe_el4.15.a.tt:0 "Grants #Y Hesperian Neoplatonic Academy#! for #Y 30 years#! and raises capital development."
 oe_el4.15.b:0 "Sponsor traveling philosophical symposia across our provinces"
 oe_el4.15.b.tt:0 "Boosts cultural tradition, stability, and estate satisfaction without heavy outlay."
 oe_el4.16.title:0 "Meridian Towers of Sol Hesperius"
 oe_el4.16.desc:0 "Astronomers dedicated to Sol Hesperius have mapped the western constellations and built bronze astrolabes capable of measuring latitude with startling precision across open Atlantic swells."
 oe_el4.16.a:0 "Construct the Observatories of Sol Hesperius along the coast"
 oe_el4.16.a.tt:0 "Grants #Y Observatories of Sol Hesperius#! for #Y 30 years#! and boosts naval tradition."
 oe_el4.16.b:0 "Publish the star charts freely to maritime merchants"
 oe_el4.16.b.tt:0 "Boosts burgher satisfaction, prestige, and treasury returns."
 oe_el4.17.title:0 "The Chesapeake Ecumenical Concordat"
 oe_el4.17.desc:0 "Under the Symmachus banner of civic tolerance, Orthodox priests, classical philosophers, and indigenous elders convene in Nea Konstantinoupolis to establish shared hospitals, orphanages, and municipal schools open to every subject of the Basileus."
 oe_el4.17.a:0 "Ratify the Chesapeake Ecumenical Concordat"
 oe_el4.17.a.tt:0 "Grants #Y Chesapeake Ecumenical Concordat#! for #Y 30 years#! and lifts stability."
 oe_el4.17.b:0 "Endow merchant-led civic guild schools"
 oe_el4.17.b.tt:0 "Raises burgher satisfaction and capital development."
 oe_el4.18.title:0 "Haven Beyond the Storm: Exiled Artisans of Europe"
 oe_el4.18.desc:0 "As fierce religious wars erupt across Europe, shiploads of master weavers, gunsmiths, printers, and scholars seek sanctuary beneath Nova Elysia's Union Church. Welcoming them promises a historic surge in urban population, development, and literacy."
 oe_el4.18.a:0 "Grant land, citizenship, and workshop stipends to the refugees"
 oe_el4.18.a.tt:0 "Grants #Y Chesapeake Artisan Sanctuary Edicts#! for #Y 30 years#!, settles burghers and peasants in our capital, and raises development."
 oe_el4.18.b:0 "Levy modest harbor entry dues while granting residence"
 oe_el4.18.b.tt:0 "Adds treasury revenue and a smaller wave of burgher settlers."
 oe_el4.19.title:0 "Council of the Woodland Sachems"
 oe_el4.19.desc:0 "As Roman farms spread across Chesapeake riverbanks, native tribal clans still dwelling inside our borders protest conflicting hunting rights and tributary dues. Left unresolved, tribal resentment festers; addressed boldly, they can become either sworn Foederati auxiliaries or assimilated Roman citizens."
 oe_el4.19.a:0 "Seal the Foederati Border Charter with the Sachems"
 oe_el4.19.a.tt:0 "Applies #Y Foederati Border Charter#! for #Y 25 years#!, lowering tribal power while restoring tribal satisfaction, manpower, and fur output."
 oe_el4.19.b:0 "Enact the Civic Assimilation Charter across frontier counties"
 oe_el4.19.b.tt:0 "Applies #Y Elysian Civic Assimilation Charter#! for #Y 25 years#!, sharply reducing tribal estate power while accelerating assimilation."
 oe_el4.19.c:0 "Negotiate a pragmatic Woodland & Senate Accord"
 oe_el4.19.c.tt:0 "Applies #Y Woodland Sachem & Senate Accord#! for #Y 20 years#!, soothing all estates."
 oe_el4.20.title:0 "The Next Generation of Frontier Citizens"
 oe_el4.20.desc:0 "A generation after our first woodland treaties, mixed Greco-Algonquian towns along the Potomac petition the Elysian Senate for permanent legal status. Their spokesmen speak both Attic-inflected Greek and native river dialects fluently."
 oe_el4.20.a:0 "Extend full Roman civic assimilation and municipal charters"
 oe_el4.20.a.tt:0 "Renews #Y Elysian Civic Assimilation Charter#! for #Y 25 years#!, boosts capital development, and lifts peasant and burgher satisfaction."
 oe_el4.20.b:0 "Charter Autonomous Frontier Cantons under imperial judges"
 oe_el4.20.b.tt:0 "Grants #Y Autonomous Frontier Cantons#! for #Y 25 years#!, expanding accepted-culture capacity and frontier manpower."
 STATIC_MODIFIER_NAME_oe_el4_founded_t2_mod:0 "Chesapeake Consolidation Era (Stage II)"
 STATIC_MODIFIER_DESC_oe_el4_founded_t2_mod:0 "Nova Elysia transitions smoothly from emergency Ark subsidies into a rooted Chesapeake commonwealth with steady treasury aid, court relief, quarantine resilience, and rapid demographic recovery."
 STATIC_MODIFIER_NAME_oe_el4_founded_t3_mod:0 "New Roman Self-Reliance Era (Stage III)"
 STATIC_MODIFIER_DESC_oe_el4_founded_t3_mod:0 "In the third quarter-century since landfall, tapered imperial subsidies ease the final step toward a fully self-sustaining Atlantic economy powered by Chesapeake markets and shipyards."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_chesapeake_estates:0 "Chesapeake Manor Charters"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_chesapeake_estates:0 "Surveyed riverfront manors granted by the Elysian Senate anchor patrician loyalty, rural administration, and steady agricultural tax receipts."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_appalachian_themes:0 "Appalachian Border Theme Statute"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_appalachian_themes:0 "Hereditary mountain border themes guard the Blue Ridge passes, lifting fortress resilience, provincial manpower, and martial discipline."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_western_silk_guild:0 "Western Sea Silk Guild Charter"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_western_silk_guild:0 "Standardized Chesapeake mulberry guilds and imperial brocade marks lift overseas commercial value and burgher enterprise."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_marine_insurance:0 "Atlantic Maritime Insurance Syndicate"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_marine_insurance:0 "Senate-underwritten hull insurance lowers transatlantic shipping losses, expanding sea-trade efficiency, merchant reach, and naval presence."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_patriarchate_code:0 "New Rome Ecclesiastical Code"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_patriarchate_code:0 "Codified diocesan courts, parish registers, and liturgical endowments deepen spiritual cohesion and accelerate provincial conversion."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_asclepius_hospice:0 "Asclepius Quarantine & Hospice Network"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_asclepius_hospice:0 "Church-and-Senate lazarettos along every Chesapeake bay curb endemic New World fevers and safeguard sustained demographic recovery."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_freeholder_homestead:0 "New World Freeholder Homestead Charter"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_freeholder_homestead:0 "Guaranteed family freeholds on cleared riverlands draw settlers westward while boosting grain yields and rural contentment."
 STATIC_MODIFIER_NAME_oe_el4_mod_pi_maize_wheat_agronomy:0 "Maize-Wheat Mixed Agronomy Ordinance"
 STATIC_MODIFIER_DESC_oe_el4_mod_pi_maize_wheat_agronomy:0 "Rotating Mediterranean winter wheat with Algonquian maize and beans multiplies Chesapeake harvests and eases rural tax strain."
 STATIC_MODIFIER_NAME_oe_el4_mod_pa_senatorial_stipend:0 "Senatorial Frontier Stipends"
 STATIC_MODIFIER_DESC_oe_el4_mod_pa_senatorial_stipend:0 "Modest patrician land stipends secure noble votes in the Elysian Senate while reinforcing frontier fortress loyalty."
 STATIC_MODIFIER_NAME_oe_el4_mod_pa_harbor_tariff_rebate:0 "Chesapeake Harbor Tariff Rebate"
 STATIC_MODIFIER_DESC_oe_el4_mod_pa_harbor_tariff_rebate:0 "Five-year wharfage rebates rally maritime burghers behind senatorial bills and expand Chesapeake commercial power."
 STATIC_MODIFIER_NAME_oe_el4_mod_pa_shipyard_charter:0 "Guild Slipway Timber Charter"
 STATIC_MODIFIER_DESC_oe_el4_mod_pa_shipyard_charter:0 "Dedicated oak-felling concessions speed burgher shipbuilding and win urban deputies at a slight treasury cost."
 STATIC_MODIFIER_NAME_oe_el4_mod_pa_monastic_glebe:0 "Protected New World Monastic Glebes"
 STATIC_MODIFIER_DESC_oe_el4_mod_pa_monastic_glebe:0 "Confirming tax-exempt monastic glebes wins clerical backing in the Senate and nurtures parish literacy."
 STATIC_MODIFIER_NAME_oe_el4_mod_pa_hospice_tithe:0 "Hospice & Scriptorium Charitable Tithe"
 STATIC_MODIFIER_DESC_oe_el4_mod_pa_hospice_tithe:0 "Channeling modest crown revenue into clerical hospices strengthens epidemic resilience and secures clergy votes."
 STATIC_MODIFIER_NAME_oe_el4_mod_pa_frontier_tax_holiday:0 "Frontier Clearing Tax Holiday"
 STATIC_MODIFIER_DESC_oe_el4_mod_pa_frontier_tax_holiday:0 "Granting five-year homestead tax holidays secures peasant deputies' votes and keeps frontier harvests abundant."
 STATIC_MODIFIER_NAME_oe_el4_mod_foederati_border_charter:0 "Foederati Border Charter"
 STATIC_MODIFIER_DESC_oe_el4_mod_foederati_border_charter:0 "Recognized woodland Foederati treaties curtail independent tribal power while transforming frontier clans into loyal scouts, trappers, and auxiliary levies."
 STATIC_MODIFIER_NAME_oe_el4_mod_civic_assimilation_act:0 "Elysian Civic Assimilation Charter"
 STATIC_MODIFIER_DESC_oe_el4_mod_civic_assimilation_act:0 "Systematic municipal enrolment dissolves tribal corporate autonomy, accelerating cultural assimilation and transferring civic weight to freeholders and burghers."
 STATIC_MODIFIER_NAME_oe_el4_mod_sachem_compromise:0 "Woodland Sachem & Senate Accord"
 STATIC_MODIFIER_DESC_oe_el4_mod_sachem_compromise:0 "A pragmatic frontier compact balances indigenous hunting trails with Roman survey markers, easing friction across the Chesapeake hinterland."
 STATIC_MODIFIER_NAME_oe_el4_mod_bilingual_frontier_canton:0 "Autonomous Frontier Cantons"
 STATIC_MODIFIER_DESC_oe_el4_mod_bilingual_frontier_canton:0 "Chartered border cantons let federated indigenous towns manage local pasture and fur levies under imperial appellate judges."
 STATIC_MODIFIER_NAME_oe_el4_loc_chesapeake_free_port_mod:0 "Chesapeake Imperial Free Port"
 STATIC_MODIFIER_DESC_oe_el4_loc_chesapeake_free_port_mod:0 "Duty-free entrepot warehouses, stone quays, and imperial customs courts transform the Chesapeake hub into a magnetic Atlantic trade center."
 STATIC_MODIFIER_NAME_oe_el4_mod_chesapeake_free_port_country:0 "West Sea Free Port Charter"
 STATIC_MODIFIER_DESC_oe_el4_mod_chesapeake_free_port_country:0 "Imperial free-port exemptions break early commercial isolation, drawing coastal cargoes and skilled merchants into Chesapeake ledgers."
 STATIC_MODIFIER_NAME_oe_el4_mod_asclepius_quarantine:0 "Asclepius Quarantine Code"
 STATIC_MODIFIER_DESC_oe_el4_mod_asclepius_quarantine:0 "Mandatory forty-day anchorage inspection and Hippocratic infirmaries slash New World fever mortality and prepare Nova Elysia for Old World plagues."
 STATIC_MODIFIER_NAME_oe_el4_mod_herbal_remedies:0 "Algonquian & Greek Herbal Pharmacopoeia"
 STATIC_MODIFIER_DESC_oe_el4_mod_herbal_remedies:0 "Combining indigenous forest botanicals with Byzantine medical manuscripts offers a frugal defense against Chesapeake seasonal fevers."
 STATIC_MODIFIER_NAME_oe_el4_culture_s1_mod:0 "Elysian Ethnogenesis I: Exiled Remnant"
 STATIC_MODIFIER_DESC_oe_el4_culture_s1_mod:0 "The founding generation guards Constantinopolitan law, script, and memory like sacred embers on an unfamiliar western shore."
 STATIC_MODIFIER_NAME_oe_el4_culture_s2_mod:0 "Elysian Ethnogenesis II: Chesapeake New Folk"
 STATIC_MODIFIER_DESC_oe_el4_culture_s2_mod:0 "Native-born Elysian Greeks fuse Byzantine seamanship with Chesapeake agronomy and northern Atlantic craft, forging a confident New World people."
 STATIC_MODIFIER_NAME_oe_el4_culture_s3_mod:0 "Elysian Ethnogenesis III: Fourth Roman Nation"
 STATIC_MODIFIER_DESC_oe_el4_culture_s3_mod:0 "No longer exiles pining for a distant strait, the Fourth Roman Nation stands as a transoceanic civilization radiating institutions, letters, and civic inclusion."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_atlantic_synod:0 "Decrees of the Atlantic Orthodox Synod"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_atlantic_synod:0 "Western bishops convene beneath the dome of Nea Hagia Sophia, uniting Orthodox dioceses across the Americas in mission and charity."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_autocephalous_see:0 "Independent Atlantic Patriarchate"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_autocephalous_see:0 "Proclaiming full canonical autocephaly for Nea Konstantinoupolis elevates Western Roman spiritual sovereignty across the ocean."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_three_sees_communion:0 "Communion of the Three Roman Sees"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_three_sees_communion:0 "Full liturgical communion linking Nea Konstantinoupolis, Old Byzantium, and the northern Sees bolsters diplomatic trust across Christendom."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_neoplatonic_academy:0 "Hesperian Neoplatonic Academy"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_neoplatonic_academy:0 "Philosophers, astronomers, and jurists of the Western Pantheon revive the Athenian Academy on Chesapeake shores, driving rapid scientific discovery."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_sol_observatory:0 "Observatories of Sol Hesperius"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_sol_observatory:0 "Precision astrolabes and solar meridian towers built by Hellenic priests sharpen oceanic navigation and academic prestige."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_chesapeake_sanctuary:0 "Chesapeake Artisan Sanctuary Edicts"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_chesapeake_sanctuary:0 "Guaranteed freedom of worship turns Nova Elysia into a magnet for persecuted European weavers, printers, watchmakers, and scholars."
 STATIC_MODIFIER_NAME_oe_el4_mod_rel_union_concordat:0 "Chesapeake Ecumenical Concordat"
 STATIC_MODIFIER_DESC_oe_el4_mod_rel_union_concordat:0 "Joint parishes and shared civic charities defuse sectarian rivalry across the western frontier, elevating estate harmony and prosperity."
 STATIC_MODIFIER_NAME_oe_el4_mod_exarchate_council:0 "Pan-Atlantic Exarchate Council"
 STATIC_MODIFIER_DESC_oe_el4_mod_exarchate_council:0 "Coordinated imperial exarchs pool colonial warships, customs dues, and coastal garrisons beneath the Twin-Headed Eagle."
 STATIC_MODIFIER_NAME_oe_el4_mod_vinland_spartania_pact:0 "Vinland & Spartania Maritime League"
 STATIC_MODIFIER_DESC_oe_el4_mod_vinland_spartania_pact:0 "Allied Norse-Varangian longships from Vinland and Spartan hoplite marines from the south reinforce Nova Elysia's continental supremacy."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_appalachian_pass:0 "Blue Ridge Watchtowers"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_appalachian_pass:0 "Fortified mountain stone towers command the western Appalachian passes against interior raids."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_woodland_trail:0 "Appalachian Woodland Trade Trail"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_woodland_trail:0 "Peaceful pack trails linking Chesapeake valleys with interior peltry villages enrich merchants and calm border tribes."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_senate_charter:0 "Second-Generation Constitutional Compact"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_senate_charter:0 "The first American-born generation codifies balanced legislative authority between Basileus, Senate, and freeholders."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_silk_ergasteria:0 "Chesapeake Mulberry Silk Monopoly"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_silk_ergasteria:0 "Imperial mulberry plantations and reeling houses pioneer New World silk weaving for high-margin Atlantic trade."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_tobacco_maize_boom:0 "Chesapeake Golden Leaf & Maize Boom"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_tobacco_maize_boom:0 "Thriving riverfront plantations export fragrant tobacco and surplus maize across the entire western coast."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_fur_league:0 "Great Lakes Fur & Longhouse League"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_fur_league:0 "Formal trading treaties with Great Lakes and Haudenosaunee confederacies channel northern beaver pelts into Elysian markets."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_mississippi_depots:0 "Great Western River Trade Depots"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_mississippi_depots:0 "Charting the Mississippi basin opens vast inland river arteries and accelerates continental colonization."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_florida_outpost:0 "Florida Straits & Caribbean Watch"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_florida_outpost:0 "Forward naval stations along the Gulf Stream sweep corsairs from the southern straits and guard Caribbean sealanes."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_mesoamerican_trade:0 "Mesoamerican Silver & Obsidian Envoy Pact"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_mesoamerican_trade:0 "First diplomatic contact with Mesoamerican empires inaugurates lucrative exchanges of Mediterranean ironcraft for western bullion."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_1453_scholars:0 "Exiled Scholars of 1453"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_1453_scholars:0 "Refugee jurists, librarians, and architects fleeing the fall of Old Constantinople ignite a Western Roman Renaissance."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_1453_nostos_vow:0 "Oath of the Western Nostos"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_1453_nostos_vow:0 "Solemn oaths sworn across Nea Konstantinoupolis steel the army and navy for the eventual liberation of the Queen of Cities."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_varangian_vinland:0 "North Atlantic Varangian Brotherhood"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_varangian_vinland:0 "Renewing ancient Varangian oaths with Norse-descended Vinland mariners strengthens imperial guard discipline and cold-water navigation."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_copper_admiralty:0 "Copper-Hull Atlantic Admiralty"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_copper_admiralty:0 "Expanded Chesapeake drydocks and standardized copper sheathing ready the Fourth Roman battle fleet to meet Old World powers."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_four_romes_sole:0 "Manifesto of the Sole Fourth Rome"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_four_romes_sole:0 "Challenging Istanbul, Moscow, and Vienna alike, Nea Konstantinoupolis proclaims itself the sole unbroken heir of Augustus and Constantine."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_four_romes_bicephalum:0 "Concord of the Twin Eagles"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_four_romes_bicephalum:0 "Envisioning an Imperium Bicephalum spanning both shores of the Atlantic, Elysian diplomacy pairs imperial dignity with transoceanic reach."
 STATIC_MODIFIER_NAME_oe_el4_mod_ev_four_romes_eternal:0 "Sovereign Majesty of Eternal Elysia"
 STATIC_MODIFIER_DESC_oe_el4_mod_ev_four_romes_eternal:0 "Leaving Old World dynastic feuds behind, Nova Elysia proclaims an eternal Western Roman civilization anchored forever in the Americas."
