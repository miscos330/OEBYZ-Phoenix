l_english:
 oe_nf_form_alliance: "Form a Political Alliance"
 oe_nf_form_alliance_desc: "Also available during a regency. With no current political ally and no active disaster, choose a noble house and spend #R 5 Legitimacy#! to form an alliance. The house gains #R +1 monthly Influence#! and access to special interactions, and is recorded as a supporter for future crises. The alliance ends when the ruler dies or the house loses its noble status."
 oe_nf_pressure: "Pressure a Noble House"
 oe_nf_pressure_desc: "Choose a noble house. Spend #R 2 Authority#! to reduce its Influence by #G 25#!. Nationwide cooldown: #Y 3 months#!."
 oe_nf_honors: "Grant Court Honors"
 oe_nf_honors_desc: "Bestow honors on a house with #Y more than 100 Influence#!. Spend #R three months of Privy Purse income#! to reduce its Influence by #G 25#!. Requires sufficient Privy Purse funds. Nationwide cooldown: #Y 3 months#!."
 oe_nf_ally_support: "Support from a Political Ally"
 oe_nf_ally_support_desc: "Available only for the political ally. Gain #G 5 Authority#! and grant the ruler #G +3#! Administrative, Diplomatic and Military ability. Nationwide cooldown: #Y 60 months#!; the ruler's death does not reset the cooldown."
 oe_nf_ally_pressure: "Help Curb a Rival House"
 oe_nf_ally_pressure_desc: "Available only for the political ally. Choose another, non-allied house with #Y more than 100 Influence#!. Spend #R 1 Authority#! to reduce the target's Influence by #G 25#!. Under the general interaction rule, the political ally gains #R 2 Influence#!. Nationwide cooldown: #Y 24 months#!."
 OE_NF_ALLIANCE_CHOOSE_HEAD: "Choose the Target House Head"
 OE_NF_POLITICAL_ALLY_BADGE: "#bold #Y Political Ally#!#!"
