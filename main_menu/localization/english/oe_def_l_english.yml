 oe_def.1.title:0 "Imperial Banner & Heraldry Reform"
 oe_def.1.desc:0 "Court heralds and master weavers have drafted a unified Armorial Statute linking state banners directly to constitutional rank, dynastic continuity, and sovereign triumph. From crowned double-headed eagles and crimson Florentine lilies to ancestral steppe tamghas, every great shift of statecraft now raises a living standard worthy of its age."
 oe_def.1.a:0 "Codify the Grand Imperial College of Heralds"
 oe_def.1.b:0 "Standardize Civic & Regimental Battle Ensigns"
 oe_def.2.title:0 "Celestial Dragon & Flame Standard"
 oe_def.2.desc:0 "Within the Celestial Court, imperial protocol officers have woven ceremonial silk banners uniting the flaming crescent-moon standard of the steppe khans with the dragon-and-pearl pennant of Middle Kingdom sovereignty. Tributary envoys from Karakorum to the southern seas now behold unmistakable symbols of Heaven's Mandate."
 oe_def.2.a:0 "Unfurl the Flaming Imperial Mandate Standard"
 oe_def.2.b:0 "Charter the Dragon-Pearl Tribute Protocol"
 oe_def.3.title:0 "Golden Age of the 55 Destinies"
 oe_def.3.desc:0 "From the Golden Horn and the Arno to the Himalayan passes, the steppe kurultais, and the Atlantic horizon, fifty-five great sovereign destinies now vie to shape the course of centuries. Chroniclers record that this generation stands at a hinge of world history where bold statecraft outlasts brass and marble."
 oe_def.3.a:0 "Proclaim an Era of Grand Imperial Ambition"
 oe_def.3.b:0 "Consolidate Domestic Prosperity & Resilience"
 oe_def.4.title:0 "Grand Chancery Archive Reorganization"
 oe_def.4.desc:0 "Senior archivists have reorganized the sovereign chancery into six crisp ordinance bureaus: Imperial Governance, Celestial and Steppe Courts, Maritime Frontiers, Grand Canals and Industry, Military Reforms, and Imperial Chronicles. Royal decrees that once languished in tangled scrolls now move from seal to province in days."
 oe_def.4.a:0 "Institutionalize the Six-Bureau Chancery Index"
 oe_def.4.b:0 "Dispatch Traveling Auditors & Relay Couriers"
 oe_def.5.title:0 "Diplomatic Protocol & Realm Descriptions"
 oe_def.5.desc:0 "Royal geographers and senior ambassadors have published the Compendium of Sovereign Realms, profiling twenty-four distinct political traditions across Eurasia, Africa, and the oceans. Armed with accurate statecraft dossiers and ceremonial precedence, our envoys negotiate from clear strategic insight."
 oe_def.5.a:0 "Publish the Compendium of Sovereign Protocols"
 oe_def.5.b:0 "Open Cosmopolitan Commercial Embassies"
 oe_def.6.title:0 "Crown of the Third Era"
 oe_def.6.desc:0 "As medieval frontiers yield to oceanic navigation, bronze siege guns, printing presses, and modern diplomacy, our sovereign convenes the estates to assume the Crown of the Third Era. Ancient lineage now steps boldly into an age of global empires and scientific discovery."
 oe_def.6.a:0 "Forge the Crown of Scholarship & Discovery"
 oe_def.6.b:0 "Steel the Realm for Global Great-Power Rivalry"
