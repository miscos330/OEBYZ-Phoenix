 oe_wp35_eic_situation_crown_rule: "Crown Rule"
 oe_wp35_eic_situation_crown_rule_desc: "Echoing the great constitutional transfer of 1858, the British Crown formally assumes supreme administrative and judicial responsibility over India from the East India Company. From Bengal to the western ports, every territory held by the Crown and British India now enters a unified imperial civil order."
 oe_wp35_eic_situation_crown_rule_tt: "[ShowMissionTaskName('oe_wp35_bri_masters_of_india')] is complete"
 oe_wp35_bri_crown_rule_mission_tt: "[ShowSituationName('oe_wp35_eic_situation')] ends in #Y Crown Rule#!: every South Asian [location|e] held by us and our [subjects|e], now and later, gains #G +0.5%#! monthly [control|e] and #G +5%#! maximum [control|e]."
 STATIC_MODIFIER_NAME_oe_wp35_bri_crown_rule_location_modifier: "Crown Rule"
 STATIC_MODIFIER_DESC_oe_wp35_bri_crown_rule_location_modifier: "Governed directly under the authority of the Crown."
 oe_wp35_bri_ally_not_fighting_our_subjects_tt: "Not at war with any of our [subjects|e]"
 OE_WP35_BRI_SHARE_CROWN_PART: "#R [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_crown_share').GetValue|0%]#!"
 OE_WP35_BRI_SHARE_COMPANY_PART: "/ #O [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_company_share').GetValue|0%]#!"
 OE_WP35_BRI_SHARE_CONTESTED_PART: "/ #G [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_contested_share').GetValue|0%]#!"
 OE_WP35_BRI_PIE_CROWN_TT: "#T Crown#!\n#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_crown_share').GetValue|0%]#! of South Asia's owned [location|e]s are held by the Crown and its subjects."
 OE_WP35_BRI_PIE_COMPANY_TT: "#T British India#!\n#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_company_share').GetValue|0%]#! of South Asia's owned [location|e]s are held by British India and its subjects."
 OE_WP35_BRI_PIE_CONTESTED_TT: "#T Contested India#!\n#Y [SituationView.GetActiveSituation.GetSituation.MakeScope.GetVariable('oe_wp35_bri_contested_share').GetValue|0%]#! of South Asia's owned [location|e]s are still in Indian or rival hands."
 oe_wp35_eic_situation_desc_expanding_direct: "#T Expanding#!\nThe Company has a foothold in India, and Indian rulers can be persuaded, with gold, to grant it more. Factories, leases and the zamindari of whole districts can all be bought, and the Crown, ruling its Indian holdings directly, keeps all it buys."
 oe_wp35_eic_situation_desc_securing_direct: "#T Securing#!\nBengal is ours, and the Company is no longer just a trader. The Crown may claim the Diwani of Bengal and collect its revenue, bind weakened Indian states by Subsidiary Alliances, and pacify unruly provinces.\n\nGrants and purchases remain open. Mastery of India will bring the Company under the rule of the Crown."
 cb_oe_wp35_bri_letters_patent: "Letters Patent"
 cb_oe_wp35_bri_letters_patent_PROV: "Letters Patent for [PROVINCE.GetName]"
 cb_oe_wp35_bri_letters_patent_desc: "By letters patent under the Great Seal, the Crown has granted itself the right to conquer, occupy and possess these lands. The grant stands until they are taken."
 BRJ: "British India"
 BRJ_ADJ: "British Indian"
 oe_wp35_bri_india_name: "British India"
 oe_wp35_bri_india_name_ADJ: "British Indian"
 oe_wp35_bri_east_india_company_name: "East India Company"
 oe_wp35_bri_east_india_company_name_ADJ: "Company"
 oe_wp35_bri.1.c: "Appoint a Royal Governor-General to preside over direct administration"
 oe_wp35_bri.3.title: "Charter Review at Westminster & Calcutta"
 oe_wp35_bri.3.desc: "Nine months after our landmark settlement of Indian governance, shipping manifests and revenue accounts from Madras, Bombay, and Calcutta reach the desks of Parliament in Westminster. Merchants hail swelling tea, silk, and saltpeter customs, while senior ministers urge formalizing the Indian Civil Service to prevent corruption and anchor British prestige across the Indian Ocean."
 oe_wp35_bri.3.a: "Channel Indian customs dividends into London's docks and treasury"
 oe_wp35_bri.3.b: "Codify uniform imperial courts and administrative charters"
 oe_wp35_bri.3.c: "Elevate a veteran Company commissioner to the Privy Council"
 oe_wp35_eic.1.b: "Confirm the constitutional settlement before Parliament"
 oe_wp35_eic.1.c: "Commission a senior eastern trade commissioner for London"
 hint_oe_wp35_eic_situation: "[GetSituationByKey('oe_wp35_eic_situation').GetNameWithNoTooltip]"
 hint_oe_wp35_eic_situation_hint_text: "#T Phase I — Expanding#!\n@hint! Complete Discover India and East Indies Company to unlock the Grant of Madras, Bombay Lease, Purchase of Calcutta, and repeatable coastal Factory Grants. Once you charter the Company, unlock Landholding Rights to buy poorly controlled Indian provinces bordering your direct holdings.\n\n#T Phase II — Securing#!\n@hint! Completing Conquer Bengal shifts the situation into Securing: claim the one-time Diwani of Bengal for lasting provincial revenue, bind weakened Indian states via Subsidiary Alliances, and Pacify low-control districts.\n\n#T Resolution — Crown Rule#!\n@hint! Complete Masters of India to conclude the situation in Crown Rule, granting permanent control bonuses across all South Asian holdings held by the Crown and its subjects."
 hint_oe_wp35_eic_situation_adm: "\"Use Landholding Rights on low-control frontier provinces before committing to costly inland wars.\""
 hint_oe_wp35_eic_situation_dip: "\"Cultivate relations with Indian princes and Portugal so Madras, Bombay, and Calcutta pass peacefully into British hands.\""
 hint_oe_wp35_eic_situation_mil: "\"Secure Bengal swiftly to unlock the Diwani and Subsidiary Alliances, then pacify unrest behind your advancing armies.\""
