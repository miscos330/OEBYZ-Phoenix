 OE_WP35_BRI_ROW_MADRAS_TT: "#T The Grant of Madras#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_discover_india')]. Ask the holder of [ShowLocationName('madras')] for a foothold on the Coromandel coast. Once only; the Crown only."
 OE_WP35_BRI_ROW_BOMBAY: "[ShowCountryInteractionName('oe_wp35_bri_bombay_lease')]"
 OE_WP35_BRI_ROW_BOMBAY_TT: "#T The Bombay Lease#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_east_indies_company')]. Ask Portugal for [ShowLocationName('bombay')] while they hold it. Once only; the Crown only."
 OE_WP35_BRI_ROW_CALCUTTA: "[ShowCountryInteractionName('oe_wp35_bri_purchase_of_calcutta')]"
 OE_WP35_BRI_ROW_CALCUTTA_TT: "#T The Purchase of Calcutta#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_east_indies_company')]. Buy [ShowLocationName('satgaon')] on the Hooghly, or another stretch of the Bengal coast. Once only; the Crown only."
 OE_WP35_BRI_ROW_FACTORY: "[ShowCountryInteractionName('oe_wp35_bri_factory_grant')]"
 OE_WP35_BRI_ROW_FACTORY_TT: "#T Factory Grant#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_east_indies_company')]. Buy one coastal [location|e] from an Indian ruler. The Crown every 3 years, British India every 5."
 OE_WP35_BRI_ROW_LANDHOLDING: "[ShowCountryInteractionName('oe_wp35_bri_landholding_rights')]"
 OE_WP35_BRI_ROW_LANDHOLDING_TT: "#T Landholding Rights#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_trade_company_charter')]. Buy a poorly controlled [province|e] next to land you hold directly. The Crown every 10 years, British India every 15."
 OE_WP35_BRI_ROW_DIWANI: "[ShowGenericActionName('oe_wp35_bri_claim_diwani')]"
 OE_WP35_BRI_ROW_DIWANI_TT: "#T The Diwani of Bengal#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_conquer_bengal')]. The first of the Crown or British India to claim it collects the revenue of its Bengal holdings. Once per game."
 OE_WP35_BRI_ROW_SUBSIDIARY: "[ShowCountryInteractionName('oe_wp35_bri_subsidiary_alliance')]"
 OE_WP35_BRI_ROW_SUBSIDIARY_TT: "#T Subsidiary Alliance#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_conquer_bengal')]. Bind a weakened Indian state as a [subject|e]. Every 10 years; the Crown only (British India cannot hold subjects of its own)."
 OE_WP35_BRI_ROW_PACIFY: "[ShowGenericActionName('oe_wp35_bri_pacify_provinces')]"
 OE_WP35_BRI_ROW_PACIFY_TT: "#T Pacify the Provinces#!\nUnlocked by [ShowMissionTaskName('oe_wp35_bri_conquer_bengal')]. Raise [control|e] and calm [unrest|e] in your own poorly controlled Indian [location|e]s. Every 5 years."
 OE_WP35_BRI_ROW_CROWN_RULE: "Crown Rule"
 OE_WP35_BRI_ROW_CROWN_RULE_TT: "#T Crown Rule#!\nCompleting [ShowMissionTaskName('oe_wp35_bri_masters_of_india')] ends the situation: the Crown takes over the Company's role, and every Indian [location|e] held by the Crown and its subjects gains a lasting [control|e] bonus."
 OE_WP35_BRI_PANEL_RULES: "How the Contest Works"
 OE_WP35_BRI_PANEL_RULES_TEXT: "• Each buyer pays from its own [treasury|e] and keeps what it buys. The seller is paid.\n• Indian rulers may refuse. AI rulers almost always agree, unless they are rivals of the buyer. No ruler ever sells their [capital|e] or land they do not [control|e].\n• If British India exists, its land counts towards the Crown's missions, but Landholding Rights only reach provinces next to land the buyer holds #Y directly#!. A British India that holds the coast can shut the Crown out of the interior, and the reverse.\n• The Crown can still hand land to British India with $give_location_to_subject$, or take it back with $seize_location_from_subject$."
 oe_wp35_bri_unlock_securing_tt: "[ShowSituationName('oe_wp35_eic_situation')] enters its #Y Securing#! phase: unlocks [ShowGenericActionName('oe_wp35_bri_claim_diwani')], [ShowCountryInteractionName('oe_wp35_bri_subsidiary_alliance')] and [ShowGenericActionName('oe_wp35_bri_pacify_provinces')]. Grants and purchases stay open."
 oe_wp35_bri_claim_diwani: "Claim the Diwani of Bengal"
 oe_wp35_bri_claim_diwani_desc: "In 1765 the Mughal emperor granted the Company the Diwani of Bengal, Bihar and Orissa: the right to collect their revenue. Whoever claims it first, the Crown or British India, will draw the wealth of Bengal for as long as they hold it. It can only be claimed once."
 oe_wp35_bri_diwani_threshold_tt: "Our side holds at least #Y 30#! [location|e]s in [ShowRegionName('bengal_region')]"
 oe_wp35_bri_claim_diwani_effect_tt: "Every [location|e] in [ShowRegionName('bengal_region')] held by us or our [subjects|e] gains #Y Diwani of Bengal#!: #G +10%#! production efficiency and #G +0.5%#! monthly [control|e]. Land we gain there later is covered too.\nNo one else can claim the Diwani afterwards."
 STATIC_MODIFIER_NAME_oe_wp35_bri_diwani_location_modifier: "Diwani of Bengal"
 STATIC_MODIFIER_DESC_oe_wp35_bri_diwani_location_modifier: "The revenue of this land is collected under the Diwani of Bengal."
 oe_wp35_bri_pacify_provinces: "Pacify the Provinces"
 oe_wp35_bri_pacify_provinces_desc: "Send troops and collectors into the districts where our writ barely runs, buying off some and overawing the rest."
 OE_WP35_BRI_PRICE_PACIFY: "Pacify the Provinces: 3 months of [income|e]"
 oe_wp35_bri_pacify_needs_unrest_tt: "We hold a South Asian [location|e] with less than #Y 50%#! [control|e]"
 oe_wp35_bri_pacify_effect_tt: "Every South Asian [location|e] we hold directly with less than #Y 50%#! [control|e] is #Y Pacified#! for #Y 10 years#!: #G −20%#! [unrest|e] and #G +1%#! monthly [control|e]."
 oe_wp35_bri_pacify_cooldown_tt: "We can pacify the provinces again in #Y 5 years#!."
 STATIC_MODIFIER_NAME_oe_wp35_bri_pacified_location_modifier: "Pacified"
 STATIC_MODIFIER_DESC_oe_wp35_bri_pacified_location_modifier: "Troops and collectors have brought this district to heel, for now."
 oe_wp35_bri_subsidiary_alliance: "Subsidiary Alliance"
 oe_wp35_bri_subsidiary_alliance_act: "Offer a Subsidiary Alliance to [SCOPE.sCountry('recipient').GetName]"
 oe_wp35_bri_subsidiary_alliance_desc: "Offer a weakened Indian state the Company's protection: our troops will guard it, and it will follow our lead. Hyderabad, Awadh, Mysore, Travancore and Baroda all entered such alliances in the decades after 1798."
 oe_wp35_bri_subsidiary_alliance_effect_text: "[SCOPE.sCountry('actor').GetName] offer a Subsidiary Alliance to [SCOPE.sCountry('recipient').GetName]"
 oe_wp35_bri_subsidiary_alliance_effect_text_past: "[SCOPE.sCountry('recipient').GetName] entered a Subsidiary Alliance with [SCOPE.sCountry('actor').GetName]"
 oe_wp35_bri_subsidiary_alliance_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] refuse to give up their independence."
 oe_wp35_bri_subsidiary_alliance_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] refused to give up their independence."
