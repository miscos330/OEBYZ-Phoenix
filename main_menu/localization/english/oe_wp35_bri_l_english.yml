 oe_wp35_eic_situation: "The Company in India"
 oe_wp35_eic_situation_desc: "$oe_wp35_eic_situation_desc_expanding$"
 oe_wp35_eic_situation_desc_expanding: "#T Expanding#!\nThe Company has a foothold in India, and Indian rulers can be persuaded, with gold, to grant it more. Factories, leases and the zamindari of whole districts can all be bought, by the Crown and by British India alike, and each side keeps what it buys.\n\nBritish India counts for the Crown's ambitions, but it is also a rival: land it holds on the coast can block the Crown's own expansion inland."
 oe_wp35_eic_situation_desc_securing: "#T Securing#!\nBengal is ours, and the Company is no longer just a trader. Whoever claims the Diwani of Bengal first will collect its revenue; weakened Indian states can be bound by Subsidiary Alliances, and unruly provinces pacified.\n\nGrants and purchases remain open. Mastery of India will bring the Company under the rule of the Crown."
 oe_wp35_bri_situation_starts_tt: "#T The Company in India#! begins: the Crown, and British India if it is founded, expand through grants, purchases and, in time, subsidiary alliances."
 oe_wp35_eic_situation_withdrawn: "The Company Withdraws"
 oe_wp35_eic_situation_withdrawn_desc: "As the last East Indiaman lowers her topsails and clears the Indian coast, the Crown and its subjects hold no remaining foothold across South Asia. Generations of commercial charters, coastal leases, and diplomatic gambits draw to a quiet close, leaving only weathered ledgers in London to record the Company's bold eastern venture."
 oe_wp35_eic.1.a: "The contest for India is over."
 oe_wp35_eic_situation_withdrawn_tt: "Neither the Crown nor any of its subjects hold land in South Asia"
