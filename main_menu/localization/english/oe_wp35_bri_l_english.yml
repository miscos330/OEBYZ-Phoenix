 OE_WP35_BRI_COMPANY_GOLD: "Company gold on offer"
 oe_wp35_bri_gold_price: "Company Purchase"
 MODIFIER_TYPE_NAME_oe_wp35_bri_gold_price_cost_modifier: "Company Purchase Cost"
 MODIFIER_TYPE_DESC_oe_wp35_bri_gold_price_cost_modifier: "Changes the cost of Company grants and purchases in India."
 oe_wp35_bri_factory_grant: "Factory Grant"
 oe_wp35_bri_factory_grant_act: "Request a Factory Grant from [SCOPE.sCountry('recipient').GetName]"
 oe_wp35_bri_factory_grant_desc: "Ask an Indian ruler to grant us a stretch of coast for a factory, a fortified trading post, in exchange for gold. Factories at Surat, Masulipatam and Hooghly were how the Company first put down roots in India."
