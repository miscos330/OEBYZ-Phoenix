l_english:
 # Project Phoenix v31.0 WP35: British Empire 53-Task Tree & East India Company Situation.
 oe_wp35_bri_missions: "Rise of the British Empire"
 oe_wp35_bri_missions_DESCRIPTION: "From the Hundred Years' War to an empire on which the sun never sets: tame the barons and Parliament, unite the Isles, rule the waves, and carry the flag to the Americas, the Cape and India."
 oe_wp35_bri_missions_CRITERIA_DESCRIPTION: "England has become Great Britain, mistress of the seas and heart of an empire that spans the world."
 oe_wp35_bri_missions_BUTTON_TOOLTIP: "Lead England through the Reformation and the struggle between Crown and Parliament, unite the British Isles, and build a global empire of colonies, trade and the East India Company."
 oe_wp35_bri_missions_BUTTON_DETAILS: "$oe_wp35_bri_missions_BUTTON_TOOLTIP$"
 oe_wp35_bri_raise_an_army: "Raise an Army"
 oe_wp35_bri_raise_an_army_desc: "Traditionally, the Parliament opposes any attempt of a standing army for the royal house. Instead, our government relies on the effort of militia, mercenaries and the levies of the Nobility. As the Hundred Years' War is going through its last phases and the Scots are posing a threat to our security, it is only natural that we must raise an army one way or another."
 oe_wp35_bri_raise_an_army_CRITERIA_DESCRIPTION: "Have 50% of the expected army size in the field, or raised levies led by a general."
 oe_wp35_bri_subjugate_scotland: "Subjugate Scotland"
 oe_wp35_bri_subjugate_scotland_desc: "Edward I, Scottorum Malleus, saw the wisdom of securing our kingdom by subjugating the Scots. We must do the same. Should a royal marriage be spurned, the Rough Wooing may yet hand us the pretext to press our claim by force."
 oe_wp35_bri_subjugate_scotland_CRITERIA_DESCRIPTION: "Own (directly or via non-tributary subjects) Perth, Inverness, and at least 80% of the Scottish Lowlands."
 oe_wp35_bri_conquer_ireland: "Conquer Ireland"
 oe_wp35_bri_conquer_ireland_desc: "Historically known as 'His Majesty's Irish Enemies', the Gaelic populace of Ireland have long been outside English rule. It is time they were brought to heel."
 oe_wp35_bri_conquer_ireland_CRITERIA_DESCRIPTION: "Own (directly or via non-tributary subjects) Dublin and at least 60 locations in Ireland."
 oe_wp35_bri_unify_the_isles: "Unify the Isles"
 oe_wp35_bri_unify_the_isles_desc: "The British Isles are home to the two kingdoms of England and Scotland as well as the many petty realms of Ireland. It is up to us to unify the isles under the English rule."
 oe_wp35_bri_unify_the_isles_CRITERIA_DESCRIPTION: "Hold (you or your subjects) at least 160 locations in Great Britain and 40 in Ireland, with high stability and legitimacy."
 oe_wp35_bri_acts_of_union: "The Acts of Union"
 oe_wp35_bri_acts_of_union_desc: "The legislation of the many kingdoms of the Isles is separated and convoluted. Although each of these states share the same monarch, their laws and parliaments are not unified under a single constitution. We cannot let this continue."
 oe_wp35_bri_acts_of_union_CRITERIA_DESCRIPTION: "Be (or have become) Great Britain, own 80% of the Great Britain region directly, and maintain control over your home region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_raise_army_modifier: "Army Expansion"
 STATIC_MODIFIER_DESC_oe_wp35_bri_raise_army_modifier: "Expanded levies and drilled officers bolster manpower and morale."
 STATIC_MODIFIER_NAME_oe_wp35_bri_subjugate_scotland_modifier: "Northern Campaign Experience"
 STATIC_MODIFIER_DESC_oe_wp35_bri_subjugate_scotland_modifier: "Logistics from the Scottish wars trim upkeep and preserve tradition."
 STATIC_MODIFIER_NAME_oe_wp35_bri_unify_isles_modifier: "Unified Isles Administration"
 STATIC_MODIFIER_DESC_oe_wp35_bri_unify_isles_modifier: "Prestige and diplomatic weight grow as Britain is brought under one crown."
 STATIC_MODIFIER_NAME_oe_wp35_bri_acts_of_union_modifier: "Acts of Union"
 STATIC_MODIFIER_DESC_oe_wp35_bri_acts_of_union_modifier: "A unified British state enjoys lasting prosperity, calm, and influence."
 STATIC_MODIFIER_NAME_oe_wp35_bri_irish_choler_modifier: "The Irish Choler"
 STATIC_MODIFIER_DESC_oe_wp35_bri_irish_choler_modifier: "English settlers and Irish hands alike are put to work on the newly conquered lands."
 STATIC_MODIFIER_NAME_oe_wp35_bri_british_rule_modifier: "British Rule"
 STATIC_MODIFIER_DESC_oe_wp35_bri_british_rule_modifier: "The laws of the united kingdoms reach every shire, and local magnates answer to the crown."
 STATIC_MODIFIER_NAME_oe_wp35_bri_india_established_modifier: "British India Established"
 STATIC_MODIFIER_DESC_oe_wp35_bri_india_established_modifier: "Our colonial administration in India provides us with vast resources and manpower."
 STATIC_MODIFIER_NAME_oe_wp35_bri_direct_rule_india_modifier: "Direct Rule of India"
 STATIC_MODIFIER_DESC_oe_wp35_bri_direct_rule_india_modifier: "We shall govern India directly without colonial intermediaries."
 oe_wp35_bri_recently_humiliated_rival_tt: "Recently humiliated a rival"
 oe_wp35_bri_channel_london_70_tt: "We hold at least 70% of the merchant power in the London market"
 oe_wp35_bri_channel_london_50_tt: "We hold at least 50% of the merchant power in the London market"
 oe_wp35_bri_channel_bruges_25_tt: "We hold at least 25% of the merchant power in the market that trades Bruges"
 oe_wp35_bri_channel_bruges_15_tt: "We hold at least 15% of the merchant power in the market that trades Bruges"
 oe_wp35_bri_channel_london_75_tt: "We hold at least 75% of the merchant power in the London market"
 oe_wp35_bri_channel_london_55_tt: "We hold at least 55% of the merchant power in the London market"
 oe_wp35_bri_channel_bruges_50_tt: "We hold at least 50% of the merchant power in the market that trades Bruges"
 oe_wp35_bri_channel_bruges_35_tt: "We hold at least 35% of the merchant power in the market that trades Bruges"
 oe_wp35_bri_lowlands_economic_hegemon_tt: "We are the Economic Hegemon, and the Age of Reformation has begun"
 oe_wp35_bri_early_industry_manufactories_4_tt: "At least 4 levels of manufactories (cloth manufactory, textile mill, iron foundry or iron mill)"
 oe_wp35_bri_early_industry_manufactories_1_tt: "At least 1 level of manufactories (cloth manufactory, textile mill, iron foundry or iron mill)"
 oe_wp35_bri_no_country_rivals_tt: "No country rivals us"
 oe_wp35_bri_owns_45_low_countries_tt: "We own at least 45 locations in the Low Countries"
 subject_oe_wp35_bri_owns_45_low_countries_tt: "A non-tributary subject owns at least 45 locations in the Low Countries"
 ally_oe_wp35_bri_owns_45_low_countries_tt: "Any ally with its capital in the Low Countries region and with 'Low Franconian', 'Frisian' or 'Walloon' primary culture owns at least 45 locations in the Low Countries"
 oe_wp35_bri_war_of_the_roses_disaster_tt: "The War of the Roses disaster has ended"
 oe_wp35_bri_war_of_roses_info_tt: "Has completed the War of the Roses disaster\n(Can start between 1400 and 1499 for England or Great Britain while the Houses of York and Lancaster both survive, under a Plantagenet or Lancaster ruler who is childless or infertile, or when legitimacy is below 70 and stability below 35)"
 oe_wp35_bri_mediterranean_authority_cb_tt: "Gain Letters Patent on the Baleares, the Aegean islands, eastern Sicily, Corfu and Cephalonia."
 oe_wp35_bri_letters_patent_renewal_tt: "Letters Patent are permanent claims. They are renewed every year and after every war, against whoever holds the land, until it is ours."
 oe_wp35_bri_welcome_to_america_tt: "Get the ability to hire conquistadors or boost colonial growth."
 oe_wp35_bri_three_kingdoms_wars_info_tt: "The Three Kingdoms War situation has concluded."
 oe_wp35_bri_ecw_tension_tt: "Tensions between Crown and Parliament deepen, making the English Civil War more likely."
 oe_wp35_bri_trade_company_charter_tt: "The Crown grants a royal charter: a Trade Company Headquarters is raised in our South Asian holdings, founding the East India Company as a chartered trade company."
 oe_wp35_bri_trade_company_charter_direct_tt: "With India held under direct rule, there is no separate holding in which to charter a company — the Crown shall administer the trade itself."
 oe_wp35_bri_trade_company_charter_can_build_tt: "We are able to construct a Trade Company Headquarters in South Asia!"
 oe_wp35_bri_india_west_cb_tt: "British India gains Letters Patent on the Western India and Deccan regions."
 oe_wp35_bri_britain_india_west_cb_tt: "Great Britain gains Letters Patent on the Western India and Deccan regions."
 oe_wp35_bri_own_location_in_west_india_tt: "We or our non-tributary subjects own the location\n• Location is in Saurashtra, Konkan, or Malabar."
 oe_wp35_bri_own_location_in_inland_india_tt: "We or our non-tributary subjects own the location\n• Location is in the Inland India region."
 oe_wp35_bri_india_hindustan_cb_tt: "British India gains Letters Patent on the Hindustan region."
 oe_wp35_bri_britain_hindustan_cb_tt: "Great Britain gains Letters Patent on the Hindustan region."
 oe_wp35_bri_own_location_in_bengal_tt: "We or our non-tributary subjects own the location\n• Location is in the Bengal region."
 oe_wp35_bri_india_bengal_cb_tt: "British India gains Letters Patent on the Bengal region."
 oe_wp35_bri_britain_bengal_cb_tt: "Great Britain gains Letters Patent on the Bengal region."
 oe_wp35_bri_own_location_in_india_tt: "We or our non-tributary subjects own the location\n• Location is in India."
 oe_wp35_bri_house_divided: "A House Divided"
 oe_wp35_bri_house_divided_desc: "Keep Lords and Commons aligned behind the crown by satisfying the estates."
 oe_wp35_bri_house_divided_CRITERIA_DESCRIPTION: "High estate satisfaction and a legitimate, stable crown with active estate privileges."
 oe_wp35_bri_monopolize_channel: "Monopolize the Channel"
 oe_wp35_bri_monopolize_channel_desc: "Channel trade must be steered through English hands and ports, supported by harbors and escorts."
 oe_wp35_bri_monopolize_channel_CRITERIA_DESCRIPTION: "Hold most of the merchant power in London and a strong share in the market that trades Bruges, with ample ports and ships. If Bruges trades through London, London alone counts."
 oe_wp35_bri_early_industry: "Early Industry"
 oe_wp35_bri_early_industry_desc: "Bring the new manufactories to Derby, Chester, Newcastle and Cardiff, and set Britain on the road to industry."
 oe_wp35_bri_early_industry_CRITERIA_DESCRIPTION: "Robust economy, rising development, and several furniture guilds operating."
 oe_wp35_bri_centers_world_trade: "Centers of World Trade"
 oe_wp35_bri_centers_world_trade_desc: "Raise our commercial hubs into the world’s preferred markets, backed by state capacity."
 oe_wp35_bri_centers_world_trade_CRITERIA_DESCRIPTION: "Dominate the merchant power of London and of the market that trades Bruges, with solid control of the home region. If Bruges trades through London, London alone counts."
 oe_wp35_bri_renaissance: "English Renaissance"
 oe_wp35_bri_renaissance_desc: "Patronize learning and prestige so our capital embodies the ideals of the Renaissance."
 oe_wp35_bri_renaissance_CRITERIA_DESCRIPTION: "Prestigious, stable capital with a university and heavy urban investment."
 oe_wp35_bri_renovate_oxbridge: "Renovate Oxbridge"
 oe_wp35_bri_renovate_oxbridge_desc: "Renovate the great colleges to keep Oxford and Cambridge at the cutting edge of learning."
 oe_wp35_bri_renovate_oxbridge_CRITERIA_DESCRIPTION: "Own and upgrade Oxford and Cambridge with universities and solid development."
 oe_wp35_bri_expand_royal_navy: "Expand the Royal Navy"
 oe_wp35_bri_expand_royal_navy_desc: "Fund docks and wharves to field a modern fleet capable of protecting Channel commerce."
 oe_wp35_bri_expand_royal_navy_CRITERIA_DESCRIPTION: "Large navy, many ports, and upgraded naval infrastructure."
 oe_wp35_bri_royal_marines: "The Royal Marines"
 oe_wp35_bri_royal_marines_desc: "Forge elite marines to spearhead coastal campaigns and safeguard overseas holdings."
 oe_wp35_bri_royal_marines_CRITERIA_DESCRIPTION: "High naval tradition and disciplined home-region control."
 oe_wp35_bri_found_standing_army: "Found a Standing Army"
 oe_wp35_bri_found_standing_army_desc: "Move beyond feudal levies and create a drilled standing army under the crown."
 oe_wp35_bri_found_standing_army_CRITERIA_DESCRIPTION: "Field a regular army at 35% of the expected army size, with crown legitimacy and firm control at home."
 oe_wp35_bri_redcoats: "The Redcoats"
 oe_wp35_bri_redcoats_desc: "Standardize drill and kit to field the professional Redcoats famed across Europe."
 oe_wp35_bri_redcoats_CRITERIA_DESCRIPTION: "A regular army at 60% of the expected army size, strong prestige, and high control over the home region."
 oe_wp35_bri_empire: "The British Empire"
 oe_wp35_bri_empire_desc: "Unite prosperity, learning, trade, and arms into a globe-spanning imperial project."
 oe_wp35_bri_empire_CRITERIA_DESCRIPTION: "Massive development, income, legitimacy, and control to cap internal reforms."
 STATIC_MODIFIER_NAME_oe_wp35_bri_empire_modifier: "Imperial Ascension"
 STATIC_MODIFIER_DESC_oe_wp35_bri_empire_modifier: "Imperial authority tightens: legitimacy and religious influence rise monthly as crown control deepens across the realm."
 STATIC_MODIFIER_NAME_oe_wp35_bri_royal_marines_modifier: "Royal Marines"
 STATIC_MODIFIER_DESC_oe_wp35_bri_royal_marines_modifier: "Elite marine formations strike from the sea with higher morale and harder-hitting naval engagements."
 STATIC_MODIFIER_NAME_oe_wp35_bri_redcoats_modifier: "The Redcoats"
 STATIC_MODIFIER_DESC_oe_wp35_bri_redcoats_modifier: "Standardized drill and kit make our infantry deadlier on every field they march onto."
 STATIC_MODIFIER_NAME_oe_wp35_bri_manpower_surge_modifier: "Wartime Recruitment"
 STATIC_MODIFIER_DESC_oe_wp35_bri_manpower_surge_modifier: "A surge of fresh recruits swells the ranks - larger manpower reserves and faster reinforcement for a time."
 STATIC_MODIFIER_NAME_oe_wp35_bri_sailor_surge_modifier: "Naval Recruitment Drive"
 STATIC_MODIFIER_DESC_oe_wp35_bri_sailor_surge_modifier: "Press gangs and bounties fill the lower decks - expanded sailor reserves for a time."
 STATIC_MODIFIER_NAME_oe_wp35_bri_monopolize_channel_modifier: "Channel Dominance"
 STATIC_MODIFIER_DESC_oe_wp35_bri_monopolize_channel_modifier: "English control of Channel trade accelerates shipbuilding throughout the realm."
 STATIC_MODIFIER_NAME_oe_wp35_bri_world_trade_center_modifier: "Centre of World Trade"
 STATIC_MODIFIER_DESC_oe_wp35_bri_world_trade_center_modifier: "The goods of every continent change hands on the London exchange."
 STATIC_MODIFIER_NAME_oe_wp35_bri_watt_steam_engine_modifier: "Watt Steam Engine"
 STATIC_MODIFIER_DESC_oe_wp35_bri_watt_steam_engine_modifier: "Steam drives the pumps and looms of the new manufactories."
 STATIC_MODIFIER_NAME_oe_wp35_bri_most_esteemed_university_modifier: "Most Esteemed University"
 STATIC_MODIFIER_DESC_oe_wp35_bri_most_esteemed_university_modifier: "Scholars from across Christendom come to study in the renovated colleges."
 STATIC_MODIFIER_NAME_oe_wp35_bri_man_of_war_modifier: "The Man-of-War"
 STATIC_MODIFIER_DESC_oe_wp35_bri_man_of_war_modifier: "New dockyards turn out great ships of the line faster and keep them at sea for less."
 STATIC_MODIFIER_NAME_oe_wp35_bri_recovering_prestige_modifier: "Recovering Prestige"
 STATIC_MODIFIER_DESC_oe_wp35_bri_recovering_prestige_modifier: "Though France endures, our campaign has demonstrated English resolve and martial prowess to all of Europe."
 oe_wp35_bri_hundred_years_war: "The Hundred Years' War"
 oe_wp35_bri_hundred_years_war_desc: "The Treaty of Tours has brought an uneasy period of truce between England and France. Both sides are aware that this is unlikely to last, and we must decide whether to honor their treaty and bide our time, or prepare for war. The fate of England depends on this very action."
 oe_wp35_bri_hundred_years_war_CRITERIA_DESCRIPTION: "The Hundred Years' War situation is active."
 oe_wp35_bri_end_the_french_conflict: "End the French Conflict"
 oe_wp35_bri_end_the_french_conflict_desc: "Be it through victory over the French and claiming their throne, or by abandoning continental Europe and taking a bigger a focus on the navy: our conflict with France and the continent must find an end one way or another."
 oe_wp35_bri_end_the_french_conflict_CRITERIA_DESCRIPTION: "The Hundred Years' War situation has ended."
 oe_wp35_bri_develop_british_identity: "Develop British Identity"
 oe_wp35_bri_develop_british_identity_desc: "The British Isles are home to many different cultures and languages. The Scottish and the Highlanders in the North, the Irish of the emerald island and the Welsh and English in the South. Naturally, such collection of different cultures will lead to problems if left untended. We shall forge a British Identity in order to establish a British hegemony over the isles."
 oe_wp35_bri_develop_british_identity_CRITERIA_DESCRIPTION: "Control the British Isles and accept or tolerate Scottish and Irish cultures."
 STATIC_MODIFIER_NAME_oe_wp35_bri_unified_british_identity_modifier: "Unified British Identity"
 STATIC_MODIFIER_DESC_oe_wp35_bri_unified_british_identity_modifier: "A shared British identity strengthens unity across the Isles, easing cultural tensions and reinforcing loyalty to the crown."
 oe_wp35_bri_english_superiority: "English Superiority"
 oe_wp35_bri_english_superiority_desc: "Our rivals are many and powerful, but also arrogant. They assume they can compete with us on the sea, contest our claim in foreign lands and pose a threat to us. We must show them how fatally wrong they are."
 oe_wp35_bri_english_superiority_CRITERIA_DESCRIPTION: "Show superiority by humiliating a rival or having no rivals."
 STATIC_MODIFIER_NAME_oe_wp35_bri_english_superiority_modifier: "English Superiority"
 STATIC_MODIFIER_DESC_oe_wp35_bri_english_superiority_modifier: "Our recent triumphs over our rivals have bolstered our national pride and power projection."
 oe_wp35_bri_the_royal_court: "The Royal Court"
 oe_wp35_bri_the_royal_court_desc: "A monarch is nothing without their advisors. No matter how our future will look like, competent consultants are always required."
 oe_wp35_bri_the_royal_court_CRITERIA_DESCRIPTION: "Have high legitimacy, a highly skilled ruler, and a capable cabinet led by a head of cabinet."
 STATIC_MODIFIER_NAME_oe_wp35_bri_the_royal_court_modifier: "The Royal Court"
 STATIC_MODIFIER_DESC_oe_wp35_bri_the_royal_court_modifier: "A well-advised monarch strengthens the realm through wise counsel and effective governance."
 oe_wp35_bri_mainland_alliances: "Mainland Alliances"
 oe_wp35_bri_mainland_alliances_desc: "Although our priorities lie beyond the sea, we should not forget the threat our home continent could pose to us if left unattended. We should establish alliances with the enemies of our enemies. Our oldest friend, Portugal, may yet renew the Treaty of Windsor — and with it, perhaps, a dowry as rich as Bombay."
 oe_wp35_bri_mainland_alliances_CRITERIA_DESCRIPTION: "Be a hegemon, or be allied to two strong countries on your continent (200+ development, or Portugal) that hold you in high regard."
 oe_wp35_bri_influence_the_lowlands: "Influence the Lowlands"
 oe_wp35_bri_influence_the_lowlands_desc: "The Dutch and the Flemish of the Lowlands are in many ways similar to us: they seek wealth from profitable trade, maintain an impressive naval force and are opposed to French and Spanish dominance. Influencing the Lowlands in our favor might bring us an invaluable ally or subject in this region."
 oe_wp35_bri_influence_the_lowlands_CRITERIA_DESCRIPTION: "Hold 45 locations in the Low Countries yourself, through a subject or through a Low Countries ally, or be the Economic Hegemon once the Age of Reformation has begun."
 STATIC_MODIFIER_NAME_oe_wp35_bri_lowlands_trade_partners_modifier: "Lowlands Trade Partners"
 STATIC_MODIFIER_DESC_oe_wp35_bri_lowlands_trade_partners_modifier: "Our commercial ties with the Low Countries strengthen our trade position and naval capacity."
 STATIC_MODIFIER_NAME_oe_wp35_bri_integrated_lowlands_modifier: "Integrated Lowlands"
 STATIC_MODIFIER_DESC_oe_wp35_bri_integrated_lowlands_modifier: "We have built strong ties with the cultures of the low-lands."
 oe_wp35_bri_opinion_lowlands_trade_partners: "Lowlands Trade Partnership"
 oe_wp35_bri_grateful_to_britain: "Grateful to Britain"
 oe_wp35_bri_papal_support: "Papal Support"
 oe_wp35_bri_trust_grateful_to_britain: "Grateful to Britain"
 oe_wp35_bri_trust_mainland_alliance: "Mainland Alliance"
 oe_wp35_bri_the_european_trade: "The European Trade"
 oe_wp35_bri_the_european_trade_desc: "Although many goods from the New World flow into our channel, it is by far not the only trade hub in Europe with considerable profit to make. Expanding our presence in Europe will ensure our dominance over the European commerce."
 oe_wp35_bri_the_european_trade_CRITERIA_DESCRIPTION: "Have strong trade presence in the European markets."
 STATIC_MODIFIER_NAME_oe_wp35_bri_european_trade_modifier: "European Trade"
 STATIC_MODIFIER_DESC_oe_wp35_bri_european_trade_modifier: "Our extensive trade networks across Europe boost our income and economic influence."
 oe_wp35_bri_issue_the_royal_warrant: "Issue the Royal Warrant"
 oe_wp35_bri_issue_the_royal_warrant_desc: "The royal warrants of appointment is an issue granted to merchants of magnificent goods for the royal court and the royal personages. We should choose our trade partners wisely and grant them these warrants in exchange for a favorable trade."
 oe_wp35_bri_issue_the_royal_warrant_CRITERIA_DESCRIPTION: "Support the burghers and merchants by issuing royal warrants."
 STATIC_MODIFIER_NAME_oe_wp35_bri_royal_warrant_modifier: "Royal Warrant"
 STATIC_MODIFIER_DESC_oe_wp35_bri_royal_warrant_modifier: "Issuing royal warrants strengthens our trade partnerships and boosts the influence of our burghers."
 oe_wp35_bri_abolish_villeinage: "Abolish Villeinage"
 oe_wp35_bri_abolish_villeinage_desc: "The villein labor service has proven its worth in the past. However, it is outdated. No longer adequate for a country of our prestige, it is time to replace this system by promoting copyhold tenure."
 oe_wp35_bri_abolish_villeinage_CRITERIA_DESCRIPTION: "Give the peasants more freedom without angering the nobility."
 STATIC_MODIFIER_NAME_oe_wp35_bri_villeinage_ended_modifier: "Villeinage Ended"
 STATIC_MODIFIER_DESC_oe_wp35_bri_villeinage_ended_modifier: "Ending villeinage has improved our prosperity and development."
 oe_wp35_bri_found_the_royal_navy: "Found the Royal Navy"
 oe_wp35_bri_found_the_royal_navy_desc: "Our current navy is nothing but the levy contribution of our burghers. Mobilization of our the fleet is slow and expensive. We must create a standing navy which defends our island from foreign invaders and secures the future of the country."
 oe_wp35_bri_found_the_royal_navy_CRITERIA_DESCRIPTION: "Create a standing navy."
 STATIC_MODIFIER_NAME_oe_wp35_bri_exploration_spirit_modifier: "Exploration Spirit"
 STATIC_MODIFIER_DESC_oe_wp35_bri_exploration_spirit_modifier: "Our spirit of exploration has expanded our horizons and boosted our naval capabilities."
 oe_wp35_bri_war_of_the_roses: "War of the Roses"
 oe_wp35_bri_war_of_the_roses_desc: "This is a conflict that many have long seen coming. Our people must be safely shepherded through this period of uncertainty one way or another."
 oe_wp35_bri_war_of_the_roses_CRITERIA_DESCRIPTION: "Successfully emerge from the War of the Roses disaster."
 STATIC_MODIFIER_NAME_oe_wp35_bri_a_house_united_modifier: "A House United"
 STATIC_MODIFIER_DESC_oe_wp35_bri_a_house_united_modifier: "With the end of the War of the Roses, the nobility is more united than ever, reducing antagonism among estates."
 STATIC_MODIFIER_NAME_oe_wp35_bri_dynastic_security_modifier: "Dynastic Security"
 STATIC_MODIFIER_DESC_oe_wp35_bri_dynastic_security_modifier: "The royal house's strengthened lineage improves character fertility and life expectancy."
 STATIC_MODIFIER_NAME_oe_wp35_bri_dynastic_power_modifier: "Dynastic Power"
 STATIC_MODIFIER_DESC_oe_wp35_bri_dynastic_power_modifier: "A secure dynasty enhances legitimacy and reduces estate antagonism."
 oe_wp35_bri_handle_the_reformation: "Handle the Reformation"
 oe_wp35_bri_handle_the_reformation_desc: "Religious anarchy has gripped Europe. Where once the Pope used to be the guidance there is now only chaos. We must take control of the situation, and decide where we stand on the matter of the Divine. Should we still cling to Rome as Lutheran ideas spread, the King's Great Matter may force an Act of Supremacy upon us — and with it, a Church of England."
 oe_wp35_bri_handle_the_reformation_CRITERIA_DESCRIPTION: "Take part in the religious reformation or counter it."
 oe_wp35_bri_act_of_supremacy_hint_tt: "The King's Great Matter comes to a head: the Act of Supremacy will be proposed — founding the Anglican Church — if our ruler is a married man over the age of 25 with no living son, while the Pope remains Catholic.\n(The Act may also arise on its own between 1500 and 1600 while these conditions hold.)"
 STATIC_MODIFIER_NAME_oe_wp35_bri_a_new_religious_destiny_modifier: "A New Religious Destiny"
 STATIC_MODIFIER_DESC_oe_wp35_bri_a_new_religious_destiny_modifier: "Embracing a new religious path invigorates the nation, enhancing religious unity and reducing unrest."
 STATIC_MODIFIER_NAME_oe_wp35_bri_absent_from_the_reformation_modifier: "Absent from the Reformation"
 STATIC_MODIFIER_DESC_oe_wp35_bri_absent_from_the_reformation_modifier: "Remaining absent from the religious reformation increases tolerance and stability."
 STATIC_MODIFIER_NAME_oe_wp35_bri_loyalty_to_the_pope_modifier: "Loyalty to the Pope"
 STATIC_MODIFIER_DESC_oe_wp35_bri_loyalty_to_the_pope_modifier: "Remaining loyal to the Pope increases religious influence and improves relations with the Catholic Church."
 STATIC_MODIFIER_NAME_oe_wp35_bri_one_state_one_church_modifier: "One State, One Church"
 STATIC_MODIFIER_DESC_oe_wp35_bri_one_state_one_church_modifier: "Establishing a state church enhances religious unity and reduces unrest."
 STATIC_MODIFIER_NAME_oe_wp35_bri_head_of_anglican_church_modifier: "Head of the Anglican Church"
 STATIC_MODIFIER_DESC_oe_wp35_bri_head_of_anglican_church_modifier: "Becoming the head of the Anglican Church increases religious influence and national prestige."
 oe_wp35_bri_piety_of_the_state: "Piety of the State"
 oe_wp35_bri_piety_of_the_state_desc: "We are a land blessed by the Lord himself. But the clerical institutions have a wildly different idea how the religious matters are handled. We must secure the piety of the state and assume control over the church."
 oe_wp35_bri_piety_of_the_state_CRITERIA_DESCRIPTION: "Balance religious authority and state power through government reforms and infrastructure."
 STATIC_MODIFIER_NAME_oe_wp35_bri_anglican_reform_progress_modifier: "Anglican Reform Progress"
 STATIC_MODIFIER_DESC_oe_wp35_bri_anglican_reform_progress_modifier: "Progress in Anglican reforms opens new paths for government restructuring and religious policy."
 STATIC_MODIFIER_NAME_oe_wp35_bri_religious_stability_modifier: "Religious Stability"
 STATIC_MODIFIER_DESC_oe_wp35_bri_religious_stability_modifier: "A balanced approach to religious matters maintains stability and reduces tensions across denominations."
 STATIC_MODIFIER_NAME_oe_wp35_bri_anglican_state_church_modifier: "Anglican State Church"
 STATIC_MODIFIER_DESC_oe_wp35_bri_anglican_state_church_modifier: "Establishing an Anglican state church consolidates religious authority under the crown and diminishes clerical independence."
 STATIC_MODIFIER_NAME_oe_wp35_bri_clergy_land_confiscation_modifier: "Clerical Land Confiscation"
 STATIC_MODIFIER_DESC_oe_wp35_bri_clergy_land_confiscation_modifier: "Confiscating church lands strengthens state finances but strains relations with the clergy."
 STATIC_MODIFIER_NAME_oe_wp35_bri_conciliarism_of_churches_modifier: "Conciliarism of Churches"
 STATIC_MODIFIER_DESC_oe_wp35_bri_conciliarism_of_churches_modifier: "Adopting conciliarism balances church and state power, promoting cooperation while maintaining traditional structures."
 STATIC_MODIFIER_NAME_oe_wp35_bri_clergy_approval_anglican_settlement_modifier: "Clergy Approval of Anglican Settlement"
 STATIC_MODIFIER_DESC_oe_wp35_bri_clergy_approval_anglican_settlement_modifier: "The clergy's approval of our religious settlement strengthens their support for the crown and improves estate satisfaction."
 oe_wp35_bri_strengthen_the_crown: "Strengthen the Crown"
 oe_wp35_bri_strengthen_the_crown_desc: "The authority of the crown has always been a subject of contention. While the ruler sees his reign as absolute and of divine nature, the Parliament tries to limit the ruler's power. As the idea of Absolutism grows in the courts of Europe so does it in ours. We must follow the trend and strengthen the government."
 oe_wp35_bri_strengthen_the_crown_CRITERIA_DESCRIPTION: "Balance crown legitimacy and estate power through reforms and privileges."
 STATIC_MODIFIER_NAME_oe_wp35_bri_strong_crown_modifier: "Strong Crown"
 STATIC_MODIFIER_DESC_oe_wp35_bri_strong_crown_modifier: "A strengthened crown increases legitimacy and reduces estate influence."
 oe_wp35_bri_acts_of_the_parliament: "Acts of the Parliament"
 oe_wp35_bri_acts_of_the_parliament_desc: "The Parliament is a tool of the state. As powerful as any tool can be, the potential of the Parliament can only be utilized properly if it is guided wisely."
 oe_wp35_bri_acts_of_the_parliament_CRITERIA_DESCRIPTION: "Pass parliamentary acts that balance estate power and crown authority."
 STATIC_MODIFIER_NAME_oe_wp35_bri_strong_burghers_modifier: "Strong Burghers"
 STATIC_MODIFIER_DESC_oe_wp35_bri_strong_burghers_modifier: "A prosperous burgher class boosts trade income and urban development."
 STATIC_MODIFIER_NAME_oe_wp35_bri_the_two_houses_modifier: "The Two Houses"
 STATIC_MODIFIER_DESC_oe_wp35_bri_the_two_houses_modifier: "Lords and Commons sit in accord, and the business of Parliament moves swiftly."
 oe_wp35_bri_the_three_kingdoms_wars: "The Three Kingdoms Wars"
 oe_wp35_bri_the_three_kingdoms_wars_desc: "The rule of the throne and the power of the Parliament are in stark contrast. Conflict between the Royalists and the Parliamentarians is inevitable."
 oe_wp35_bri_the_three_kingdoms_wars_CRITERIA_DESCRIPTION: "Successfully emerge from the Three Kingdoms Wars disaster."
 STATIC_MODIFIER_NAME_oe_wp35_bri_weathered_absolutism_modifier: "Weathered Absolutism"
 STATIC_MODIFIER_DESC_oe_wp35_bri_weathered_absolutism_modifier: "Having weathered the storms of civil war, the crown's authority is more resilient, enhancing legitimacy and governance."
 STATIC_MODIFIER_NAME_oe_wp35_bri_restored_order_modifier: "Restored Order"
 STATIC_MODIFIER_DESC_oe_wp35_bri_restored_order_modifier: "Restoring order after civil strife improves stability and estate relations."
 oe_wp35_bri_rule_britannia: "Rule Britannia!"
 oe_wp35_bri_rule_britannia_desc: "The navy is our strength; the sea is our home. It is our destiny to rule the world from our isles and dominate it with our naval superiority!"
 oe_wp35_bri_rule_britannia_CRITERIA_DESCRIPTION: "Maintain naval dominance and rule the world."
 STATIC_MODIFIER_NAME_oe_wp35_bri_naval_dominance_modifier: "Naval Dominance"
 STATIC_MODIFIER_DESC_oe_wp35_bri_naval_dominance_modifier: "Maintaining naval dominance strengthens our control over the seas and enhances our maritime power."
 STATIC_MODIFIER_NAME_oe_wp35_bri_mediterranean_trade_center_modifier: "Mediterranean Centre of Trade"
 STATIC_MODIFIER_DESC_oe_wp35_bri_mediterranean_trade_center_modifier: "Under the British flag this island port gathers the trade of the Middle Sea."
 oe_wp35_bri_mediterranean_authority: "Mediterranean Authority"
 oe_wp35_bri_mediterranean_authority_desc: "While initially we viewed our Mediterranean assets as a strategic tool in the wars against our neighbors, it has become apparent that we can exert power over the flow of trade in the region. We should aim to increase this."
 oe_wp35_bri_mediterranean_authority_CRITERIA_DESCRIPTION: "Have strong trade presence in the Mediterranean region."
 oe_wp35_bri_discover_the_americas: "Discover the Americas"
 oe_wp35_bri_discover_the_americas_desc: "Hushed whispers tell of mysterious lands to the far West, ripe for growth, and filled with unimaginable wonders. If this is true, they must be ours."
 oe_wp35_bri_discover_the_americas_CRITERIA_DESCRIPTION: "Explore the Americas region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_unknown_frontier_modifier: "Unknown Frontier"
 STATIC_MODIFIER_DESC_oe_wp35_bri_unknown_frontier_modifier: "Exploration of the unknown fuels national ambition and maritime expertise."
 oe_wp35_bri_colonize_canada: "Colonize Canada"
 oe_wp35_bri_colonize_canada_desc: "Colder and harsher than the southerly lands, the territory of Canada is, nevertheless, ripe for exploitation. Exotic furs, wood and minerals are abundant in the snowy mountains. A chartered Hudson's Bay Company could see our trading posts spread across the northern wilds."
 oe_wp35_bri_colonize_canada_CRITERIA_DESCRIPTION: "Colonize the Canada region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_established_shipping_lanes_modifier: "Established Shipping Lanes"
 STATIC_MODIFIER_DESC_oe_wp35_bri_established_shipping_lanes_modifier: "Established shipping lanes to our colonies enhance trade income and naval logistics."
 oe_wp35_bri_settle_in_america: "Settle in America"
 oe_wp35_bri_settle_in_america_desc: "The lands of America seem suitable for many things. In the north we have heard talk of furs and shipbuilding materials. In the South the land looks suitable for growing many crops. We must establish bases there so we can profit. Dissenters fleeing persecution at home may yet cross the ocean in a Great Migration to settle our shores."
 oe_wp35_bri_settle_in_america_CRITERIA_DESCRIPTION: "Settle in North America."
 STATIC_MODIFIER_NAME_oe_wp35_bri_welcome_to_america_modifier: "Welcome to America"
 STATIC_MODIFIER_DESC_oe_wp35_bri_welcome_to_america_modifier: "Establishing settlements in America boosts national prestige and economic opportunities."
 oe_wp35_bri_colonize_the_caribbean: "Colonize the Caribbean"
 oe_wp35_bri_colonize_the_caribbean_desc: "The islands of the Caribbean offer lucrative opportunities for certain types of gentleman with the will to acquire them, and the labor to exploit them. We have exactly those types of gentlemen."
 oe_wp35_bri_colonize_the_caribbean_CRITERIA_DESCRIPTION: "Settle in the Caribbean region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_a_useful_workforce_modifier: "A Useful Workforce"
 STATIC_MODIFIER_DESC_oe_wp35_bri_a_useful_workforce_modifier: "By assimilating the natives, we can provide the colonies with a steady workforce that enhances production efficiency and resource extraction."
 oe_wp35_bri_dominate_the_new_world: "Dominate the New World"
 oe_wp35_bri_dominate_the_new_world_desc: "This strange New World is our claim. All of its resources and land belong to the crown. We shall ensure our dominance over the New World and expel those who dare to contest us."
 oe_wp35_bri_dominate_the_new_world_CRITERIA_DESCRIPTION: "Control the New World region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_new_world_domination_modifier: "New World Domination"
 STATIC_MODIFIER_DESC_oe_wp35_bri_new_world_domination_modifier: "Dominating the New World increases our trade power and efficiency, securing our economic supremacy."
 STATIC_MODIFIER_NAME_oe_wp35_bri_colonial_investment_modifier: "Colonial Investment"
 STATIC_MODIFIER_DESC_oe_wp35_bri_colonial_investment_modifier: "Investing in our colonies boosts production efficiency and trade, strengthening our economic foundation."
 oe_wp35_bri_sail_around_africa: "Sail Around Africa"
 oe_wp35_bri_sail_around_africa_desc: "What wonders will await us beyond the Cape of Good Hope?"
 oe_wp35_bri_sail_around_africa_CRITERIA_DESCRIPTION: "Explore the African coast around the Cape of Good Hope."
 oe_wp35_bri_seize_the_cape: "Seize the Cape"
 oe_wp35_bri_seize_the_cape_desc: "The Cape of Good Hope is a crucial waypoint on the route to the East Indies. Without a doubt, who controls the Cape also controls the Asian ambitions of the other great powers. The Cape must be ours!"
 oe_wp35_bri_seize_the_cape_CRITERIA_DESCRIPTION: "Control the Cape of Good Hope province."
 STATIC_MODIFIER_NAME_oe_wp35_bri_the_cape_of_good_hope_modifier: "The Cape of Good Hope"
 STATIC_MODIFIER_DESC_oe_wp35_bri_the_cape_of_good_hope_modifier: "Controlling the Cape of Good Hope enhances our naval capabilities and trade routes, securing our dominance in the region."
 oe_wp35_bri_chart_the_southern_isles: "Chart the Southern Seas"
 oe_wp35_bri_chart_the_southern_isles_desc: "Daring men, with true British grit, are seeking government support to chart the vast empty expanses of the southern oceans. Rumors tell of land there for the taking; we should make haste to establish a thriving colony, before others seize the opportunity."
 oe_wp35_bri_chart_the_southern_isles_CRITERIA_DESCRIPTION: "Explore the Southern Isles region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_terra_australis_modifier: "Terra Australis"
 STATIC_MODIFIER_DESC_oe_wp35_bri_terra_australis_modifier: "Controlling the Australia region enhances our naval capabilities and trade routes, securing our dominance in the region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_spice_act_modifier: "The Spice Act"
 STATIC_MODIFIER_DESC_oe_wp35_bri_spice_act_modifier: "Cloves, nutmeg and pepper from the Spice Islands now sail under British licence."
 oe_wp35_bri_colonize_spice_islands: "Colonize the Spice Islands"
 oe_wp35_bri_colonize_spice_islands_desc: "The farthest reaches of the world produce wondrous spices, woven garments and exotic women. We should establish a presence here, for the benefit of our society."
 oe_wp35_bri_colonize_spice_islands_CRITERIA_DESCRIPTION: "Settle in the Spice Islands region."
 oe_wp35_bri_settle_australia: "Settle Australia"
 oe_wp35_bri_settle_australia_desc: "Our explorations have revealed the existence of an island of unimaginable size. Although it is not the southern continent we hoped to find, it is still land which should become our claim. In time, the First Fleet shall carry settlers — and convicts — to these distant shores."
 oe_wp35_bri_settle_australia_CRITERIA_DESCRIPTION: "Settle in the Australia region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_penal_colony_modifier: "Penal Colony"
 STATIC_MODIFIER_DESC_oe_wp35_bri_penal_colony_modifier: "Establishing penal colonies in Australia provides a steady labor force and boosts colonial development while keeping rebellious sentiment in check."
 oe_wp35_bri_discover_india: "Discover India"
 oe_wp35_bri_discover_india_desc: "Trade with India has been continuing since time immemorial, but with the long routes, others are profiting from this. We must outfit an expedition and find a sea route to India. Once our ships reach the Coromandel coast, a local ruler may be persuaded to grant us land for a factory, as the Nayak of Madras did in 1639."
 oe_wp35_bri_discover_india_CRITERIA_DESCRIPTION: "Discover a sea route to India."
 oe_wp35_bri_east_indies_company: "East Indies Company"
 oe_wp35_bri_east_indies_company_desc: "Many exotic goods have their origin in the Indian subcontinent. The European powers have been benefiting from the trade with India for many years by now. It is time for us to get on equal footing with them and establish our own trade company in India.\n\nWe need a coastal foothold of our own. [ShowCountryInteractionName('oe_wp35_bri_grant_of_madras')] is the peaceful route to a first factory; the sword is the other."
 oe_wp35_bri_east_indies_company_CRITERIA_DESCRIPTION: "Establish a trade company in India."
 oe_wp35_bri_trade_company_charter: "Prepare for Company Charter"
 oe_wp35_bri_trade_company_charter_desc: "The time has come to grant a royal charter to a trading company to manage our commercial interests in India. Completing this charter establishes the East India Company — a chartered trade company headquartered in our South Asian holdings — and, in time, the famed Company event of the Indies. A chartered company may also buy from Indian rulers the rights to collect the land revenue of whole provinces next to its own."
 oe_wp35_bri_trade_company_charter_CRITERIA_DESCRIPTION: "Hold (you or your non-tributary subjects) coastal land in South Asia and be able to construct a Trade Company Headquarters."
 oe_wp35_bri.1.title: "The Establishment of British India"
 oe_wp35_bri.1.desc: "Our holdings across the Indian subcontinent have far outgrown scattered coastal factories: from Bombay and the Coromandel shore to the teeming delta of Bengal, the British flag flies over populous cities and lucrative customs houses. Westminster, the Company directors, and royal officers now debate how South Asia shall be governed—as a chartered British India dominion, under direct Crown administration, or through a plenipotentiary Governor-General balancing imperial trade and command."
 oe_wp35_bri.1.a: "Proclaim British India"
 oe_wp35_bri.1.b: "We shall govern India directly"
 oe_wp35_bri.1.tt: "British India will be established as a colonial subject governing our South Asian territories"
 oe_wp35_bri.1.historical_info: "The British Raj, or British India, was the period of direct British rule over the Indian subcontinent from 1858 to 1947. It was established after the British Crown assumed direct control from the East India Company following the Indian Rebellion of 1857."
 oe_wp35_bri_seize_ceylon: "Seize Ceylon"
 oe_wp35_bri_seize_ceylon_desc: "Ceylon is an island near India which is of great use in securing the trade in the Indian Ocean. Our rivals are aware of the profitable trade with India and the spice isles, and seek Ceylon's occupation of their own. We must not allow this to happen"
 oe_wp35_bri_seize_ceylon_CRITERIA_DESCRIPTION: "Control the Ceylon province."
 STATIC_MODIFIER_NAME_oe_wp35_bri_coromandel_presence_modifier: "Coromandel Presence"
 STATIC_MODIFIER_DESC_oe_wp35_bri_coromandel_presence_modifier: "Establishing a strong presence on the Coromandel Coast enhances our trade efficiency and influence in the region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_indian_coastal_control_modifier: "Indian Coastal Control"
 STATIC_MODIFIER_DESC_oe_wp35_bri_indian_coastal_control_modifier: "From Surat to Calicut, the trade of the western coast passes through our factories."
 STATIC_MODIFIER_NAME_oe_wp35_bri_strategic_port_modifier: "Strategic Port"
 STATIC_MODIFIER_DESC_oe_wp35_bri_strategic_port_modifier: "Controlling a strategic port boosts local production efficiency and strengthens our naval capabilities."
 oe_wp35_bri_take_west_indian_coast: "Take West Indian Coast"
 oe_wp35_bri_take_west_indian_coast_desc: "Undeniably, control over the seafront along the West Indian Coast would give us greater control over India as a whole. Take this land in the name of Britain."
 oe_wp35_bri_take_west_indian_coast_CRITERIA_DESCRIPTION: "Control the West Indian Coast region."
 oe_wp35_bri_push_into_inland_india: "Push into Inland India"
 oe_wp35_bri_push_into_inland_india_desc: "The inland territories of India are renowned for their lucrative mines and rare jewels. Needless to say, the native inhabitants of the region would be much better off under our administration."
 oe_wp35_bri_push_into_inland_india_CRITERIA_DESCRIPTION: "Control the Inland India region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_trade_company_influence_modifier: "Trade Company Influence"
 STATIC_MODIFIER_DESC_oe_wp35_bri_trade_company_influence_modifier: "Our trade company's influence in India boosts trade efficiency and economic growth."
 oe_wp35_bri_conquer_bengal: "Conquer Bengal"
 oe_wp35_bri_conquer_bengal_desc: "The East Indian Trading Company has been operating in this region for some time. By their request, and with their guidance, it is time to solidify our hold on the fertile Bengal Delta."
 oe_wp35_bri_conquer_bengal_CRITERIA_DESCRIPTION: "Control the Bengal region."
 STATIC_MODIFIER_NAME_oe_wp35_bri_growing_east_indian_trade_modifier: "Growing East-Indian Trade"
 STATIC_MODIFIER_DESC_oe_wp35_bri_growing_east_indian_trade_modifier: "Our expanding trade in East India increases our trade income and economic influence."
 oe_wp35_bri_masters_of_india: "Masters of India"
 oe_wp35_bri_masters_of_india_desc: "The Indian subcontinent bows before our might. Let us harvest the spoils of India for our glory! The age of the Company is over: India will be governed under the rule of the Crown itself."
 oe_wp35_bri_masters_of_india_CRITERIA_DESCRIPTION: "Control the entire Indian subcontinent."
 STATIC_MODIFIER_NAME_oe_wp35_bri_masters_of_india_modifier: "Masters of India"
 STATIC_MODIFIER_DESC_oe_wp35_bri_masters_of_india_modifier: "Controlling the Indian subcontinent greatly enhances our trade power and resource extraction capabilities."
 oe_wp35_bri_unlock_madras_tt: "[ShowSituationName('oe_wp35_eic_situation')]: unlocks [ShowCountryInteractionName('oe_wp35_bri_grant_of_madras')], a peaceful foothold on the Coromandel coast."
 oe_wp35_bri_unlock_company_tt: "[ShowSituationName('oe_wp35_eic_situation')]: unlocks [ShowCountryInteractionName('oe_wp35_bri_bombay_lease')], [ShowCountryInteractionName('oe_wp35_bri_purchase_of_calcutta')] and [ShowCountryInteractionName('oe_wp35_bri_factory_grant')]."
 oe_wp35_bri_choose_seller: "Choose an Indian State"
 oe_wp35_bri_no_sellers: "@trigger_no! No Indian state is able to grant us land right now. We can only deal with states whose [capital|e] we have discovered."
 oe_wp35_bri_choose_coastal_location: "Choose a Coastal Location"
 oe_wp35_bri_no_coastal_locations: "@trigger_no! They hold no coastal land they could grant. A ruler never grants away their [capital|e]."
 oe_wp35_bri_seller_has_coastal_land_tt: "Holds coastal land away from their [capital|e]"
 oe_wp35_bri_location_granted_tt: "#Y [SCOPE.sLocation('target').GetName]#! is granted to [SCOPE.sCountry('actor').GetName], who gain a [core|e] there."
 oe_wp35_bri_select_location_tt: "Choose a [location|e] to see the full terms."
