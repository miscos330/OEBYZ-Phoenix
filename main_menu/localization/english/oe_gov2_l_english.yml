 # NEW 2026-11-23 v21.0 Module F: 6 Civilization Parliaments, 12 Issues, 24 Agendas & 10 Cabinet Actions (oe_gov2_). Generated by gen_v210_parliaments_cabinet.py.
 oe_gov2_estates_general:0 "French Estates-General"
 oe_gov2_estates_general_desc:0 "Convenes the Clergy, Nobility, and Third Estate under royal writ to deliberate extraordinary taxation and cahiers of grievances, boosting fiscal reach and political influence while giving the upper orders stronger sway over proceedings."
 oe_gov2_dec_adopt_estates_general.title:0 "Convene the Estates-General of the Realm"
 oe_gov2_dec_adopt_estates_general.desc:0 "Summon deputies of the Clergy, Nobility, and chartered towns to formalize the French Estates-General as our standing parliamentary institution, enhancing fiscal authority and political influence in exchange for estate voice."
 oe_gov2_dec_adopt_estates_general.a:0 "Summon the Three Estates before the Throne"
 oe_gov2_sejm:0 "Polish-Lithuanian Sejm"
 oe_gov2_sejm_desc:0 "The bicameral diet of the szlachta nobility and senate prelates guards Golden Liberty and martial cavalry traditions, raising estate harmony and heavy cavalry prowess at the price of reduced crown leverage and stricter consensus thresholds."
 oe_gov2_dec_adopt_sejm.title:0 "Institutionalize the General Sejm"
 oe_gov2_dec_adopt_sejm.desc:0 "Confirm the constitutional charters of the Senate and Chamber of Envoys to establish the Polish-Lithuanian Sejm, rallying noble cavalry and estate concord under the realm's federated liberties."
 oe_gov2_dec_adopt_sejm.a:0 "Confirm the Pacta Conventa of the Sejm"
 oe_gov2_cortes:0 "Iberian Cortes"
 oe_gov2_cortes_desc:0 "Rooted in chartered municipal fueros and maritime towns, the Cortes aligns burgher procurators, clergy, and nobles to streamline parliamentary consent and ocean commerce while gently curbing landed noble privilege."
 oe_gov2_dec_adopt_cortes.title:0 "Charter the Royal Cortes"
 oe_gov2_dec_adopt_cortes.desc:0 "Swear to uphold municipal fueros before the procurators of our cities, prelates, and hidalgos, establishing the Iberian Cortes to streamline parliamentary support and fortify maritime trade."
 oe_gov2_dec_adopt_cortes.a:0 "Swear the Fueros before the Cortes"
 oe_gov2_diwan_i_khas:0 "Indian Diwan-i-Khas"
 oe_gov2_diwan_i_khas_desc:0 "The Hall of Private Audience unites mansabdar nobles, jurists, and guild bankers in structured administrative counsel, sharpening legislative and cabinet efficiency as well as interfaith tolerance at the cost of elevated court upkeep."
 oe_gov2_dec_adopt_diwan_i_khas.title:0 "Open the Imperial Diwan-i-Khas"
 oe_gov2_dec_adopt_diwan_i_khas.desc:0 "Establish the Hall of Private Audience as the supreme deliberative council of our Indian realm, harmonizing noble commanders, jurists, and merchant financiers into an agile and tolerant administrative assembly."
 oe_gov2_dec_adopt_diwan_i_khas.a:0 "Convene the Audience of the Diwan-i-Khas"
 oe_gov2_shah_divan:0 "Persian Royal Divan"
 oe_gov2_shah_divan_desc:0 "Blending Persianate chancery statecraft with grand viziers, religious scholars, and bazaar merchants, the Royal Divan elevates diplomatic standing, cultural tradition, and caravan trade revenue while demanding tactful stability management."
 oe_gov2_dec_adopt_shah_divan.title:0 "Establish the Royal Divan of the Shah"
 oe_gov2_dec_adopt_shah_divan.desc:0 "Organize our viziers, provincial amirs, jurists, and silk-road bazaar guildmasters into the Persian Royal Divan, elevating our courtly prestige, cultural tradition, and trans-Iranian trade."
 oe_gov2_dec_adopt_shah_divan.a:0 "Install the Grand Vizier's Divan"
 oe_gov2_shogun_hyojoshu:0 "Shogunate Hyojoshu Council"
 oe_gov2_shogun_hyojoshu_desc:0 "The high council of samurai elders, temple magistrates, and Sakai-style port merchants can convene rural assemblies across domains, tightening provincial control and martial discipline while straining diplomatic upkeep."
