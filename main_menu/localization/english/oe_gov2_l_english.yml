 oe_gov2_dec_adopt_shogun_hyojoshu.desc:0 "Appoint senior warrior elders, temple commissioners, and chartered merchant deputies to the Hyojoshu Council, enabling rural assemblies and strengthening provincial control and samurai discipline across our domains."
 oe_gov2_dec_adopt_shogun_hyojoshu.a:0 "Open the Hyojoshu Deliberation Hall"
