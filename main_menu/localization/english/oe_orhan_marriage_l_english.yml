l_english:
 oe_flavor_byz.1003.t: "Osmaris: John the Pious"
 oe_flavor_byz.1003.d: "(Original name: Orhan)\n\nWhen he first came to Constantinople, he was still a bey bereft of his country. On the day of his baptism, he laid aside the splendid robes of his former station and bowed before an icon as the priest invoked the Father, the Son, and the Holy Spirit. With the water upon his brow, he received a new Christian name: John. His family, too, came to be entered in Roman records as Osmaris.\n\nJohn became a familiar guest at the tables of the Palaiologoi and maintained warm private ties with the Kantakouzenos family. Memories of old campaigns became subjects for quiet conversation; shared worship and charitable work gave these friendships a footing beyond temporary alliances.\n\nBeyond the court, he paid for church repairs, stocked kitchens for the poor, and helped restore roads and water channels. Some dismissed these gifts as attempts to win imperial favor. Yet John continued to attend worship and distribute alms even when no dignitary was watching. Gradually, people in the streets began to call him the Pious.\n\nNow he returns to the Emperor with an ornamented icon, an inventory of marriage gifts for the privy purse, and a pledge of loyalty in his own hand. He asks leave to marry [SCOPE.sCharacter('oe_orhan_bride').GetName], making their union a public sign of the Osmaris family's place in Roman society. Should a former marriage remain in force, he offers to end it under imperial and ecclesiastical authority before entering this new union."
 oe_flavor_byz.1003.a: "Let this marriage heal the wounds of old wars."
 oe_flavor_byz.1003.a.tt: "[SCOPE.sCharacter('oe_orhan_groom').GetName] ends any existing marriage and marries [SCOPE.sCharacter('oe_orhan_bride').GetName].\nAuthority: #G +5#!.\nThe privy purse receives #G six months of income#!, totaling #G [SCOPE.GetValue('oe_orhan_dowry')|2]#! gold.\nThe House of Osmaris becomes a noble house. Its first grant increases noble-house capacity by #G 1#!. Existing membership is not duplicated and existing Influence is retained."
 oe_flavor_byz.1003.b: "Faith may be welcomed; imperial kinship is another matter."
 oe_flavor_byz.1003.b.tt: "Prestige: #G +5#!. John retains any existing marriage."
 oe_flavor_byz.1003.lapsed: "Circumstances have changed. Set the marriage aside."
 oe_flavor_byz.1003.lapsed.tt: "John or the chosen bride no longer qualifies. No former marriage is ended and no marriage rewards are granted."
 oe_orhan_resolved: "John the Pious's marriage petition has been resolved"
 oe_osman_house_capacity_granted: "The House of Osmaris has received its additional noble-house place"
 oe_flavor_byz.1003.historical_info: "Orhan, the second Ottoman ruler, reigned from 1324 to 1362. He captured Bursa and Nicaea, consolidated Ottoman power in Bithynia, and extended his influence through Byzantine civil wars and marriage alliances. He married Theodora, daughter of John VI Kantakouzenos. The historical Orhan did not convert to Orthodoxy; his baptism and Christian name belong to this mod's alternate history."
