l_english:
 oe_rus_authorize_boyars: "Empower the Local Boyars"
 oe_rus_authorize_boyars_desc: "Spend 10 Political Influence in an owned province in Russia, Ruthenia or the Steppes with unintegrated locations and no Boyar Privileges. All its locations gain 50 percentage points of Integration progress and Boyar Privileges for 50 years. One-year cooldown."
 oe_rus_authorize_boyars_cooldown: "Empower the Local Boyars"
 oe_rus_boyar_province: "Owned Province Eligible for Boyar Privileges"
 STATIC_MODIFIER_NAME_oe_rus_boyar_privileges: "Boyar Privileges"
 STATIC_MODIFIER_DESC_oe_rus_boyar_privileges: "The local nobility acknowledges central authority in return for hereditary estates and greater power over the peasantry."
 oe_russian_ambition: "Russian Ambition"
 oe_russian_ambition_desc: "The divided Rus principalities have united beneath one banner. Russia now looks toward the steppe, the Urals and Siberia in search of land, wealth and security. This situation ends when Russia ceases to exist."
 oe_ra_outcome_fall: "The End of Russian Ambition"
 oe_ra_outcome_fall_desc: "Russia no longer exists, bringing its advance into the steppe and Siberia to an end."
 oe_russian_ambition.1.t: "The Rise of Russia"
 oe_russian_ambition.1.d: "The once divided towns and principalities of the Rus are now bound together in the name of Russia. Rival courts give way to a common realm and treasury. Forest towns, river traders and farms scattered across the plains are gathering strength for a new state.\n\nTo the east, vast territories stretch beyond the steppe and the Urals. To the west, neighboring rulers reconsider the weight of this united power. Russia’s course is not yet determined, but it now possesses the means to turn ambition into reality."
 oe_russian_ambition.1.a: "The northern order is changing."
 oe_ra_expand_steppe: "Expand into the Steppe"
 oe_ra_expand_steppe_desc: "Spend 25 Political Influence and three months of our income to gain a conquest Casus Belli on a bordering province in the Steppes or Khorasan. Borders through our subjects count. Allies, subjects and union partners are excluded. Six-month cooldown."
 oe_ra_expand_steppe_cooldown: "Expand into the Steppe"
 oe_ra_expand_siberia: "Expand into Siberia"
 oe_ra_expand_siberia_desc: "Spend 10 Political Influence to gain a conquest Casus Belli on a bordering province in the Urals, Western Siberia or Eastern Siberia. It must contain a settled location owned by the target; wholly uncolonized lands are excluded. Allies, subjects and union partners are excluded. One-year cooldown."
 oe_ra_country_statistics: "#bold #Y The Strength of Russia#!#!\n\n#W Tax Base#!    #Y [Country.GetTotalTaxBase|2]#!\n#W Population#!    #Y [Country.GetTotalPopulation]#!\n#W Fielded Army#!    #Y [Country.GetArmySize]#!\n#W Owned Locations#!    #Y [Country.GetOwnedLocationCount|0]#!"
 oe_ra_expansion_explanation: "#bold Routes of Expansion#!\n#Y The Steppe and Khorasan#!: advance along the southern frontier.\n#Y The Urals and Siberia#!: press into the forests and great river valleys.\n\nOnly Russia can use this situation’s expansion actions."
 oe_ra_observer: "Can See Russian Ambition"
 oe_ra_actor: "Russia in the Russian Ambition Situation"
 oe_ra_foreign_frontier: "Nonfriendly Province Bordering Russia or Its Subjects"
 oe_ra_steppe_province: "Eligible Steppe Province"
 oe_ra_siberian_province: "Eligible Siberian Province"
 oe_ra_steppe_cost: "Three Months of Income"
 oe_ra_annual_income: "One Year of Income"
 oe_ra_started: "Russian Ambition Has Begun"
 oe_ra_expand_siberia_cooldown: "Expand into Siberia"
