l_english:
 oe_ir_banking: "Regulate Banking"
 oe_ir_banking_desc: "Bring lending and exchange under a common charter, giving imperial commerce a dependable foundation of credit.\n\nRequires #Y Centralization#! and the #Y Banking#! institution. Costs #R 50 Authority#! and unlocks the fiscal edict #Y Authorize More Banks#!. Permanently grants #G +2#! maximum bonds and #G −1%#! loan interest. This reform can only be completed once."
 oe_ir_banking_done: "Banking Regulation Completed"
 OE_BANKING_UNLOCK_FOUNDING: "Unlocks the fiscal edict #G Authorize More Banks#!."
 oe_pillars_found_chartered_bank: "Authorize More Banks"
 oe_pillars_found_chartered_bank_desc: "Choose a headquarters to establish its designated chartered bank, following the original Bank Supervisory Council requirements for territory, institutions and advances. Required locations must be owned directly by Byzantium.\n\nEach bank retains its original headquarters, branches and #G 3,000 ducats#! in starting funds. Each may be founded only once. There is no additional cost or cooldown.\n\n#Y Headquarters and banks#!: Thessaloniki—Mint Bank; Genoa—Bank of Saint George; Venice—Public Bank; Ankara—Anatolian Agricultural Bank; Theodoro—Black Sea Bank; Athens—Press Bank; Beirut—Levantine Commercial Bank; Alexandria—Nile Bank; Rome—Central Bank; Tunis—Carthaginian Bank; Palermo—Sicilian Mining Bank."
 OE_BANKING_CHOOSE_SEAT: "Choose the Chartered Bank Headquarters"
 OE_BANKING_NO_SEAT: "@trigger_no! No unfounded chartered bank meets the requirements."
 oe_ir_banking_modifier: "Regulated Banking"
