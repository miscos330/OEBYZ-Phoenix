l_english:
 oe_phoenix_enable_auto_bandit: "Enable Automatic Bandit Suppression"
 oe_phoenix_enable_auto_bandit_desc: "Assign standing patrols to the roads and mountain passes.\n\nRequires #Y more than 1,000#! manpower and #Y positive#! monthly manpower gain. While enabled: #R −0.1#! stability and #R −50 people#! of manpower each month. Every four months, randomly removes one bandit stronghold in a location directly owned by Byzantium. Automatically stops when the monthly check finds no strongholds, or when the Fate of the Phoenix disaster ends. Enabling it again restarts the four-month interval."
 oe_phoenix_disable_auto_bandit: "Disable Automatic Bandit Suppression"
 oe_phoenix_disable_auto_bandit_desc: "Recall the patrols, immediately remove the suppression modifier, stop its monthly costs and clear the current interval."
 OE_AUTO_BANDIT_MANPOWER_REQUIRED: "Current manpower exceeds #Y 1,000 people#!"
 OE_AUTO_BANDIT_MONTHLY_REQUIRED: "Monthly manpower gain is greater than #Y 0#!"
 oe_phoenix_auto_bandit_months: "Months of automatic bandit suppression"
 STATIC_MODIFIER_NAME_oe_phoenix_auto_bandit_modifier: "Standing Suppression Patrols"
 STATIC_MODIFIER_DESC_oe_phoenix_auto_bandit_modifier: "Costs 0.1 stability and 50 manpower each month. Removes one domestic bandit stronghold every four months; withdrawn when disabled or no strongholds remain."
 MODIFIER_TYPE_NAME_oe_phoenix_auto_bandit_monthly_stability: "Monthly Stability from Bandit Suppression"
 MODIFIER_TYPE_DESC_oe_phoenix_auto_bandit_monthly_stability: "The flat stability change applied at each monthly disaster check while suppression is active."
 MODIFIER_TYPE_NAME_oe_phoenix_auto_bandit_monthly_manpower: "Monthly Bandit Suppression Manpower (People)"
 MODIFIER_TYPE_DESC_oe_phoenix_auto_bandit_monthly_manpower: "Monthly manpower change from suppression, displayed in individual people."
