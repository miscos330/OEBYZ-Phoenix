# NEW 2026-11-22 v16.0 Module 16.0-A: Ottoman Empire Playable Epic (oe_ptur_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v160_ottomans.py; edit the generator, not this file.
 oe_ptur_janissary_musketeers: "Janissary Kapikulu Musketeers"
 oe_ptur_janissary_musketeers_desc: "Salaried household musketeers of the Janissary Ocak, drilled from youth in coordinated matchlock volleys and steadfast bayonet defense at the center of the Ottoman battle line."
 oe_ptur_sipahi_cavalry: "Timariot Sipahi Heavy Cavalry"
 oe_ptur_sipahi_cavalry_desc: "Armored provincial horsemen sustained by imperial Timar land grants across Rumelia and Anatolia, swift to flank opposing formations and crush broken infantry."
 oe_ptur_tophane_bombard: "Tophane Great Bombard Artillery"
 oe_ptur_tophane_bombard_desc: "Colossal bronze siege cannon cast in the imperial foundries of Tophane, famed for hurling massive stone shot capable of reducing the stoutest medieval walls to rubble."
 oe_ptur_kapudan_galley: "Kapudan Imperial War Galley"
 oe_ptur_kapudan_galley_desc: "Sleek oared war galleys fitted with heavy bronze bow cannon from the Golden Horn Tersane, built to dominate Mediterranean narrows, islands, and coastal approaches."
 oe_ptur_devshirme_household: "Devshirme Imperial Household"
 oe_ptur_devshirme_household_desc: "Recruits talented youths into the Enderun palace academy and Kapikulu standing corps, forging a fiercely loyal corps of viziers and Janissaries free from regional aristocratic ties."
 oe_ptur_nizam_i_cedid: "Nizam-i Cedid New Order"
 oe_ptur_nizam_i_cedid_desc: "Rebuilds the Sublime Porte around an independent modern revenue treasury, European-drilled flintlock regiments, scientific artillery colleges, and centralized ministries."
 oe_ptur_imperial_jurisprudence_law: "Imperial Jurisprudence Law"
 oe_ptur_imperial_jurisprudence_law_desc: "Defines the constitutional balance between secular sultanic Kanun edicts and classical Hanafi Sharia courts across the Ottoman realms."
 oe_ptur_pol_kanun_secular_code: "Kanun Secular Code"
 oe_ptur_pol_kanun_secular_code_desc: "Asserts the primacy of codified sultanic Kanun ordinances over fiscal, land, and administrative affairs, widening provincial control and multi-confessional tolerance."
 oe_ptur_pol_sharia_jurisprudence: "Sharia Jurisprudence"
 oe_ptur_pol_sharia_jurisprudence_desc: "Anchors imperial governance in traditional Hanafi qadi courts and ulema scholarship, strengthening dynastic legitimacy and clerical devotion."
 oe_ptur_pol_ebussuud_harmony: "Synthesized Ebussuud Harmony"
 oe_ptur_pol_ebussuud_harmony_desc: "Follows Grand Mufti Ebussuud's celebrated legal synthesis, harmonizing imperial Kanun decrees with Sharia principles for balanced, durable rule."
 oe_ptur_janissary_discipline_law: "Janissary Discipline Law"
 oe_ptur_janissary_discipline_law_desc: "Regulates the status, barracks celibacy, guild ties, and eventual modernization of the Kapikulu Janissary regiments."
 oe_ptur_pol_strict_barracks_celibacy: "Strict Barracks Celibacy"
 oe_ptur_pol_strict_barracks_celibacy_desc: "Enforces the original statutes requiring Janissaries to live unmarried inside their orta barracks, preserving elite combat discipline at steeper pay cost."
 oe_ptur_pol_guild_enrolled_janissaries: "Guild-Enrolled Janissaries"
 oe_ptur_pol_guild_enrolled_janissaries_desc: "Permits Janissaries to marry and practice urban trades alongside craft guilds, expanding recruitment pools and city harmony at the expense of martial rigor."
 oe_ptur_pol_new_model_standing_army: "New Model Standing Army"
 oe_ptur_pol_new_model_standing_army_desc: "Replaces archaic barracks privileges with a unified, salaried national army trained in modern linear musketry, field artillery, and staff logistics."
 oe_ptur_dec_convene_divan.title: "Convene the Imperial Divan & Kanunname"
 oe_ptur_dec_convene_divan.desc: "Summon the Grand Vizier, Kazaskers, Nishanci, and Defterdars beneath the Kubbealti dome to promulgate the codified Kanunname of the House of Osman and establish the Ottoman Imperial Divan."
 oe_ptur_dec_convene_divan.a: "Promulgate the Kanunname Before the Imperial Divan"
 oe_ptur_dec_curb_janissaries.title: "Curb Janissary Privileges"
 oe_ptur_dec_curb_janissaries.desc: "Dispatch imperial inspectors to audit the Janissary orta pay-rolls, revoke traded esame certificates, and reimpose strict barracks discipline over the Kapikulu regiments."
 oe_ptur_dec_curb_janissaries.a: "Audit the Orta Rolls and Enforce Barracks Discipline"
 oe_ptur_dec_nizam_i_cedid.title: "Enact Nizam-i Cedid Military Reform"
 oe_ptur_dec_nizam_i_cedid.desc: "Establish the Irad-i Cedid independent revenue office, build modern flintlock barracks and rapid-fire artillery schools, and adopt the Nizam-i Cedid New Order across the Sublime Porte."
 oe_ptur_dec_nizam_i_cedid.a: "Proclaim the Nizam-i Cedid New Order"
 STATIC_MODIFIER_NAME_oe_ptur_mod_divan_kanunname: "Imperial Divan & Kanunname Charter"
 STATIC_MODIFIER_DESC_oe_ptur_mod_divan_kanunname: "Under the gilded dome of the Divan-i Humayun, viziers and judges administer codified imperial edicts reaching every Rumelian and Anatolian sanjak."
 STATIC_MODIFIER_NAME_oe_ptur_mod_janissary_audit: "Imperial Janissary Pay-Roll Audit"
 STATIC_MODIFIER_DESC_oe_ptur_mod_janissary_audit: "Ghost stipends and illicit merchant pay-tickets are purged from the Janissary rolls, restoring barracks obedience and treasury solvency."
 STATIC_MODIFIER_NAME_oe_ptur_mod_nizam_new_order: "Nizam-i Cedid New Order Army"
 STATIC_MODIFIER_DESC_oe_ptur_mod_nizam_new_order: "Financed by the New Revenue Treasury, flintlock infantry battalions and rapid-firing field artillery drill in European linear formations."
 STATIC_MODIFIER_NAME_oe_ptur_mod_bursa_akce_mint: "Orhan's Bursa Silver Akce Mint"
 STATIC_MODIFIER_DESC_oe_ptur_mod_bursa_akce_mint: "Fine silver akce coins struck in Bursa proclaim Ottoman sovereignty across Anatolian bazaars and caravan highways."
 STATIC_MODIFIER_NAME_oe_ptur_mod_ghazi_plane_dream: "Ghazi Dream of the Great Plane Tree"
 STATIC_MODIFIER_DESC_oe_ptur_mod_ghazi_plane_dream: "Inspired by Osman's vision of a vast plane tree shading the Balkan, Anatolian, and Euphrates valleys, frontier horsemen rally to the crescent banner."
 STATIC_MODIFIER_NAME_oe_ptur_mod_rumelian_bridgehead: "Gallipoli Rumelian Bridgehead"
 STATIC_MODIFIER_DESC_oe_ptur_mod_rumelian_bridgehead: "Securing the Dardanelles crossing opens Thrace and the Via Egnatia to swift Ottoman columns and Anatolian settlers."
 STATIC_MODIFIER_NAME_oe_ptur_mod_anatolian_consolidation: "Bithynian Heartlands Consolidation"
 STATIC_MODIFIER_DESC_oe_ptur_mod_anatolian_consolidation: "Rebuilt mosques, caravanserais, and fortified mountain passes bind Bursa, Iznik, and Sogut into an unshakable dynastic core."
 STATIC_MODIFIER_NAME_oe_ptur_mod_devshirme_ocak: "Kapikulu Janissary Ocak"
 STATIC_MODIFIER_DESC_oe_ptur_mod_devshirme_ocak: "Salaried foot guards loyal solely to the Padishah anchor the center of every battle line and counterbalance provincial aristocrats."
 STATIC_MODIFIER_NAME_oe_ptur_mod_ghazi_yaya_levy: "Turkoman Yaya & Musellem Hosts"
 STATIC_MODIFIER_DESC_oe_ptur_mod_ghazi_yaya_levy: "Tax-exempt Anatolian freeholders and marcher lords muster swiftly for seasonal frontier campaigns under ancestral ghazi banners."
 STATIC_MODIFIER_NAME_oe_ptur_mod_timar_defter: "Imperial Timar Defter Cadastre"
 STATIC_MODIFIER_DESC_oe_ptur_mod_timar_defter: "Detailed imperial defter registers assign provincial tax parcels to Sipahi horsemen, fielding tens of thousands of cavalry without draining coin."
 STATIC_MODIFIER_NAME_oe_ptur_mod_balkan_vassal_pacts: "Danubian Vassal Compacts"
 STATIC_MODIFIER_DESC_oe_ptur_mod_balkan_vassal_pacts: "Sworn tributary princes along the Morava and Danube furnish annual gold and auxiliary horsemen while keeping local estates quiet."
 STATIC_MODIFIER_NAME_oe_ptur_mod_yildirim_blitz: "Yildirim Thunderbolt Campaigns"
 STATIC_MODIFIER_DESC_oe_ptur_mod_yildirim_blitz: "Forced marches ferry the imperial army between the Danube and Euphrates in a single season, astonishing both Balkan kings and Anatolian beys."
 STATIC_MODIFIER_NAME_oe_ptur_mod_interregnum_restoration: "Mehmed I's Imperial Restoration"
 STATIC_MODIFIER_DESC_oe_ptur_mod_interregnum_restoration: "Binding Rumelia and Anatolia back beneath one throne heals the wounds of civil strife and rekindles Ottoman administrative continuity."
 STATIC_MODIFIER_NAME_oe_ptur_mod_fatih_kanunname: "Fatih's Topkapi Kanunname"
 STATIC_MODIFIER_DESC_oe_ptur_mod_fatih_kanunname: "From the courtyards of Topkapi Palace and the bronze furnaces of Tophane, Mehmed the Conqueror codifies sovereign autocracy and siege supremacy."
 STATIC_MODIFIER_NAME_oe_ptur_mod_sanjak_princes: "Anatolian Sanjak Princely Houses"
 STATIC_MODIFIER_DESC_oe_ptur_mod_sanjak_princes: "Imperial princes governing Amasya, Manisa, and Konya cultivate scholars, poets, and loyal provincial garrisons."
 STATIC_MODIFIER_NAME_oe_ptur_mod_divan_kubbealti: "Kubbealti Imperial Divan Dome"
 STATIC_MODIFIER_DESC_oe_ptur_mod_divan_kubbealti: "Beneath the Sultan's latticed gallery, the Grand Vizier, Kazaskers, and Defterdars deliberate petitions and imperial policy with clockwork precision."
 STATIC_MODIFIER_NAME_oe_ptur_mod_black_sea_lake: "Ottoman Black Sea Mare Clausum"
 STATIC_MODIFIER_DESC_oe_ptur_mod_black_sea_lake: "With Kaffa, Sinop, and Trebizond secured alongside Crimean horsemen, grain, timber, and wax flow unhindered down the Bosporus to the capital."
 STATIC_MODIFIER_NAME_oe_ptur_mod_sephardic_millet: "Sephardic Craftsmen & Millet Charter"
 STATIC_MODIFIER_DESC_oe_ptur_mod_sephardic_millet: "Exiled Iberian physicians, weavers, metallurgists, and printers enrich Constantinople and Thessaloniki under chartered millet protection."
 STATIC_MODIFIER_NAME_oe_ptur_mod_chaldiran_wagenburg: "Chaldiran Tabur Gunpowder Doctrine"
 STATIC_MODIFIER_DESC_oe_ptur_mod_chaldiran_wagenburg: "Chained supply wagons, overlapping Janissary matchlock volleys, and field cannon shatter even the fiercest shock cavalry charges."
 STATIC_MODIFIER_NAME_oe_ptur_mod_caliphate_mantle: "Custodian of the Two Holy Sanctuaries"
 STATIC_MODIFIER_DESC_oe_ptur_mod_caliphate_mantle: "Protecting the pilgrimage caravans to Mecca and Medina while housing the Sacred Mantle at Topkapi elevates the House of Osman across the Islamic world."
 STATIC_MODIFIER_NAME_oe_ptur_mod_danube_mohacs: "Victor of Belgrade and Mohacs"
 STATIC_MODIFIER_DESC_oe_ptur_mod_danube_mohacs: "The shattering of the Danubian fortress belt carries the horsetail standards of the Sultan across the Great Hungarian Plain."
 STATIC_MODIFIER_NAME_oe_ptur_mod_ebussuud_synthesis: "Ebussuud's Kanun-Sharia Synthesis"
 STATIC_MODIFIER_DESC_oe_ptur_mod_ebussuud_synthesis: "Grand Mufti Ebussuud harmonizes secular sultanic Kanun edicts with Hanafi jurisprudence, giving land tenure and taxation unimpeachable legitimacy."
 STATIC_MODIFIER_NAME_oe_ptur_mod_preveza_kapudan: "Barbarossa's Preveza Sea Mastery"
 STATIC_MODIFIER_DESC_oe_ptur_mod_preveza_kapudan: "Imperial war galleys sailing from the Golden Horn and Algiers turn the Mediterranean from Cyprus to the Maghreb into an Ottoman highway."
 STATIC_MODIFIER_NAME_oe_ptur_mod_sinan_architect: "Mimar Sinan's Imperial Works"
 STATIC_MODIFIER_DESC_oe_ptur_mod_sinan_architect: "Soaring stone domes, aqueducts, bridges, and charitable complexes designed by Chief Architect Sinan crown the skyline of the empire."
 STATIC_MODIFIER_NAME_oe_ptur_mod_amasya_frontier: "Treaty of Amasya & Tigris Trade"
 STATIC_MODIFIER_DESC_oe_ptur_mod_amasya_frontier: "A recognized Mesopotamian border opens silk caravans between Tabriz, Baghdad, and Aleppo while conserving garrisons along the Zagros passes."
 STATIC_MODIFIER_NAME_oe_ptur_mod_tersane_rebuild: "Sokollu's Winter Tersane Surge"
 STATIC_MODIFIER_DESC_oe_ptur_mod_tersane_rebuild: "Every slipway from the Golden Horn to Sinop rings with adzes and anchor forges through the winter, launching an entire fresh armada by spring."
 STATIC_MODIFIER_NAME_oe_ptur_mod_valide_diplomacy: "Valide Sultanate Palace Diplomacy"
 STATIC_MODIFIER_DESC_oe_ptur_mod_valide_diplomacy: "Astute Valide Sultans correspond directly with European courts and Venetian doges, steadying regencies and preserving dynastic continuity."
 STATIC_MODIFIER_NAME_oe_ptur_mod_celali_fiscal_reform: "Silver Recoinage & Fiscal Cadastre"
 STATIC_MODIFIER_DESC_oe_ptur_mod_celali_fiscal_reform: "Recalling clipped silver akce and auditing provincial avariz assessments stabilize market prices and calm Anatolian rural unrest."
 STATIC_MODIFIER_NAME_oe_ptur_mod_iltizam_tax_farms: "Provincial Iltizam Tax-Farming"
 STATIC_MODIFIER_DESC_oe_ptur_mod_iltizam_tax_farms: "Auctioning tax-farming leases delivers immediate silver to pay musketeers, though distant provincial notables grow entrenched."
 STATIC_MODIFIER_NAME_oe_ptur_mod_janissary_guild_decay: "Janissary Esame Guild Drift"
 STATIC_MODIFIER_DESC_oe_ptur_mod_janissary_guild_decay: "Allowing married Janissaries to run bazaar workshops swells urban ranks and guild ties while eroding strict barracks drill."
 STATIC_MODIFIER_NAME_oe_ptur_mod_osman_ii_courage: "Osman II's Anatolian Guard Mandate"
 STATIC_MODIFIER_DESC_oe_ptur_mod_osman_ii_courage: "Recruiting fresh Anatolian and Syrian cavalry directly under the young Sultan challenges entrenched capital factions at daring political cost."
 STATIC_MODIFIER_NAME_oe_ptur_mod_murad_iv_discipline: "Murad IV's Iron Edict"
 STATIC_MODIFIER_DESC_oe_ptur_mod_murad_iv_discipline: "Swift imperial justice against corrupt officials and mutinous agitators restores fear of the Padishah from Istanbul to Baghdad."
 STATIC_MODIFIER_NAME_oe_ptur_mod_koprulu_revival: "Koprulu Grand Vizierate Revival"
 STATIC_MODIFIER_DESC_oe_ptur_mod_koprulu_revival: "Empowered with full executive seal, the Koprulu viziers balance the treasury, break enemy blockades, and renew Ottoman offensive reach."
 STATIC_MODIFIER_NAME_oe_ptur_mod_vienna_resilience: "Danubian Bastion Resilience"
 STATIC_MODIFIER_DESC_oe_ptur_mod_vienna_resilience: "Rebuilt star forts along Belgrade, Vidin, and the Sava River blunt coalition counterattacks and anchor the empire's European frontier."
 STATIC_MODIFIER_NAME_oe_ptur_mod_karlowitz_chancery: "Reis ul-Kuttab Diplomatic Chancery"
 STATIC_MODIFIER_DESC_oe_ptur_mod_karlowitz_chancery: "Elevated into a true foreign ministry, skilled Ottoman chancery scribes master European balance-of-power treaties and permanent diplomacy."
 STATIC_MODIFIER_NAME_oe_ptur_mod_muteferrika_press: "Tulip Era & Muteferrika Imperial Press"
 STATIC_MODIFIER_DESC_oe_ptur_mod_muteferrika_press: "Movable Ottoman Turkish type prints atlases, histories, and treatises on magnetism and military tactics, spreading enlightenment across Istanbul."
 STATIC_MODIFIER_NAME_oe_ptur_mod_patrona_suppression: "Safeguarded Enlightenment Presses"
 STATIC_MODIFIER_DESC_oe_ptur_mod_patrona_suppression: "Firm suppression of street riots preserves the imperial press, paper mills, and artillery academies from reactionary destruction."
 STATIC_MODIFIER_NAME_oe_ptur_mod_muhendishane_school: "Imperial Naval & Artillery Academy"
 STATIC_MODIFIER_DESC_oe_ptur_mod_muhendishane_school: "The Muhendishane-i Bahri-i Humayun trains young officers in geometry, naval architecture, copper-sheathed ships of the line, and quick-fire cannon."
 STATIC_MODIFIER_NAME_oe_ptur_mod_selim_nizam_corps: "Selim III's Irad-i Cedid Corps"
 STATIC_MODIFIER_DESC_oe_ptur_mod_selim_nizam_corps: "Uniformed regiments quartered at Levend and Selimiye prove the superiority of modern bayonet drill on every field they enter."
 STATIC_MODIFIER_NAME_oe_ptur_mod_auspicious_incident: "Vaka-i Hayriye: The Auspicious Incident"
 STATIC_MODIFIER_DESC_oe_ptur_mod_auspicious_incident: "With the mutinous Janissary barracks swept away, the Victorious Soldiers of Muhammad march as a unified, obedient modern national army."
 STATIC_MODIFIER_NAME_oe_ptur_mod_tanzimat_dawn: "Dawn of the Tanzimat Charter"
 STATIC_MODIFIER_DESC_oe_ptur_mod_tanzimat_dawn: "Modern ministries, rationalized taxation, and guaranteed legal order carry a rejuvenated Sublime Porte with pride into the industrial age."
 oe_ptur.1.title: "Osman's Dream & Orhan's Bursa Mint"
 oe_ptur.1.desc: "In the green foothills of Mount Uludag, chroniclers still retell the vision of Osman Ghazi: a crescent rising into a mighty plane tree whose boughs shelter the valleys of the Danube, Nile, and Tigris. Now in newly won Bursa, silver dies stand ready to strike the first Ottoman akce coins bearing the house's own sovereign stamp."
 oe_ptur.1.a: "Strike the Bursa Silver Akce and Build Caravanserais"
 oe_ptur.1.b: "Proclaim the Ghazi Destiny to Every Frontier Rider"
 oe_ptur.2.title: "The Gallipoli Crossing into Rumelia"
 oe_ptur.2.desc: "When March tremors cracked the stone walls along the Thracian shore, Suleyman Pasha ferried Ottoman rafts across the narrows of the Dardanelles and planted the horsetail standards on European soil. With the Byzantine Empire fractured by civil wars and Balkan princes watching nervously, the Sublime Porte stands astride two continents."
 oe_ptur.2.a: "Fortify Gallipoli and Settle Rumelian Marcher Colonies"
 oe_ptur.2.b: "Consolidate Bithynia Before Pushing Deep into Thrace"
 oe_ptur.3.title: "Murad I, the Devshirme & Kapikulu Janissaries"
 oe_ptur.3.desc: "As the realm expands beyond a single frontier beylik, tribal raiders alone cannot garrison walled Balkan cities or obey a single imperial purse. Grand Vizier Candarli Kara Halil urges the Sultan to organize the Penchik and Devshirme levy—training loyal household youths into the Yeniceri, the salaried New Corps answerable solely to the Padishah."
 oe_ptur.3.a: "Establish the Devshirme Household and Janissary Ocak"
 oe_ptur.3.b: "Rely on Turkoman Yaya Infantry and Frontier Beys"
 oe_ptur.4.title: "Field of Blackbirds & the Timar Land Registry"
 oe_ptur.4.desc: "From the passes of Macedonia to the Field of Blackbirds near Pristina, Serbian and Bulgarian lords contest every river ford. Victory alone will not hold Rumelia unless the imperial chancery surveys every conquered village into registered Timar cavalry fiefs that support armored Sipahi horsemen at zero cost to the treasury."
 oe_ptur.4.a: "Compile the Rumelian Timar Defters for Sipahi Cavalry"
 oe_ptur.4.b: "Confirm Local Christian Princes as Tributary Vassals"
 oe_ptur.5.title: "Bayezid I Yildirim: The Thunderbolt Across Two Shores"
 oe_ptur.5.desc: "Known across Christendom and Islam alike as Yildirim—the Thunderbolt—the Sultan crosses the straits with breathless speed, subjugating rival Anatolian emirates in spring and smashing crusading knights along the Danube by autumn. Yet rapid centralization breeds bitter resentment among proud Turkoman lords."
 oe_ptur.5.a: "Press the Thunderbolt Offensive on Both Fronts"
 oe_ptur.5.b: "Pace the Conquests and Conciliate Anatolian Emirs"
 oe_ptur.6.title: "Post-Ankara Interregnum & Mehmed I's Restoration"
 oe_ptur.6.desc: "The tempest of eastern steppe armies on the plain of Ankara leaves rival Ottoman princes contesting Edirne, Bursa, and Amasya while opportunistic neighbors eye the straits. Only patient statesmanship, loyal Rumelian Sipahis, and unbreakable administrative institutions can stitch the shattered sultanate back together."
 oe_ptur.6.a: "Rally the Imperial Core and Restore Undivided Rule"
 oe_ptur.6.b: "Grant Generous Donatives to Secure Janissary Loyalty"
 oe_ptur.7.title: "Mehmed II Fatih, Topkapi Palace & the Law of Fratricide"
 oe_ptur.7.desc: "From the booming bronze foundry of Tophane to the marbled courtyards of Topkapi overlooking the Golden Horn, the Conqueror reshapes a frontier sultanate into a universal Roman-Islamic empire. His new Kanunname codifies palace ceremony, grand artillery warfare, and the stark Law of Fratricide meant to prevent another bloody interregnum."
 oe_ptur.7.a: "Promulgate Fatih's Kanunname and Crown Autocracy"
 oe_ptur.7.b: "Preserve Princely Sanjak Governorates in Anatolia"
 oe_ptur.8.title: "The Imperial Divan Council Under the Dome"
 oe_ptur.8.desc: "Four days each week beneath the Kubbealti dome, the Grand Vizier convenes the military judges of Rumelia and Anatolia, the treasury defterdars, and the chancellor bearing the imperial tughra. Above them, a gilded latticed window reminds every minister that the Padishah may be listening at any moment."
 oe_ptur.8.a: "Institutionalize the Ottoman Imperial Divan Council"
 oe_ptur.8.b: "Keep Deliberations Strictly Inside the Inner Palace"
 oe_ptur.9.title: "The Black Sea Lock: Kaffa, Trebizond & Crimea"
 oe_ptur.9.desc: "For generations Genoese fortresses along the Crimean shore and Pontic Greek ports taxed every grain hull sailing south toward the Bosporus. By seizing the Black Sea ports and bringing the Crimean Giray khans into loyal alliance, the Porte transforms the entire Euxine Sea into the granary of the capital."
 oe_ptur.9.a: "Seal the Bosporus and Charter Black Sea Grain Convoys"
 oe_ptur.9.b: "Grant Genoese and Crimean Merchants Customs Privileges"
 oe_ptur.10.title: "Sephardic Exiles & the Cosmopolitan Millet Charter"
 oe_ptur.10.desc: "As decrees of expulsion sweep across Iberia, tens of thousands of Sephardic merchants, wool weavers, gunsmiths, and physicians seek refuge across the Mediterranean. Imperial ships stand ready to welcome them into Constantinople, Thessaloniki, and Smyrna under the ordered protection of the Ottoman millet framework."
 oe_ptur.10.a: "Send Imperial Ships to Welcome the Sephardic Exiles"
 oe_ptur.10.b: "Collect Entry Customs Without Expanding Millet Exemptions"
 oe_ptur.11.title: "Selim I Yavuz & the Gunpowder Clash of Chaldiran"
 oe_ptur.11.desc: "Across the high passes of eastern Anatolia, crimson-capped Qizilbash horsemen loyal to the rising Safavid realm challenge Ottoman supremacy and stir heterodox tribes from Erzurum to Konya. Selim the Grim answers with chained artillery wagons, disciplined Janissary arquebus volleys, and an iron march eastward."
 oe_ptur.11.a: "Deploy the Tabur Wagenburg and Field Artillery Doctrine"
 oe_ptur.11.b: "Fortify the Eastern Passes and Secure Kurdish Beys"
 oe_ptur.12.title: "Gates of Cairo & the Sacred Mantle of the Caliphate"
 oe_ptur.12.desc: "Southward across the Syrian plains and the Sinai sands lies the venerable Mamluk Sultanate, guardian of Damascus, Cairo, and the pilgrimage roads to Mecca and Medina. Bringing the Nile and the Two Holy Sanctuaries under Ottoman protection doubles imperial revenue and crowns the Sultan with supreme prestige across the Muslim world."
 oe_ptur.12.a: "Assume Custody of the Two Holy Sanctuaries & Sacred Relics"
 oe_ptur.12.b: "Focus Directly on Red Sea Customs and Levantine Trade"
 oe_ptur.13.title: "Suleiman on the Danube: Belgrade & the Field of Mohacs"
 oe_ptur.13.desc: "Beneath golden banners bearing the tughra of Suleiman, the Grand Army bridges the Sava and storms the river gates of Central Europe. Across the marshy plains of Mohacs, armored European chivalry charges straight into chained Ottoman batteries and disciplined rows of Janissary musketeers."
 oe_ptur.13.a: "Press the Danubian Campaign Toward Buda and the Plains"
 oe_ptur.13.b: "Secure Belgrade and Consolidate the Balkan Hinterland"
 oe_ptur.14.title: "Suleiman al-Kanuni & Ebussuud's Legal Synthesis"
 oe_ptur.14.desc: "To his own subjects the Magnificent Padishah is remembered above all as al-Kanuni—the Lawgiver. With the brilliant jurist Ebussuud Efendi at his side, the Sublime Porte reconciles imperial criminal, agrarian, and fiscal Kanun ordinances with classical Hanafi Sharia so no qadi court stands at odds with the throne."
 oe_ptur.14.a: "Enact Ebussuud's Synthesized Kanun-Sharia Harmony"
 oe_ptur.14.b: "Elevate Secular Imperial Kanun Above Clerical Courts"
 oe_ptur.14.c: "Affirm Traditional Hanafi Sharia Primacy"
 oe_ptur.15.title: "Hayreddin Barbarossa & Mastery of the Sea at Preveza"
 oe_ptur.15.desc: "Summoned from Algiers to command the Imperial Arsenal on the Golden Horn, Hayreddin Barbarossa rebuilds the Ottoman galley fleet to match the combined armadas of Venice, Genoa, and Spain. Off the Ionian headlands of Preveza, his agile crimson-sailed war galleys outmaneuver towering western carracks to claim mastery of the Mediterranean."
 oe_ptur.15.a: "Appoint Barbarossa Kapudan Pasha and Rule the Inland Sea"
 oe_ptur.15.b: "Keep the Navy Focused on Coastal Patrols and Convoys"
 oe_ptur.16.title: "Mimar Sinan, Chief Architect of the Sublime Porte"
 oe_ptur.16.desc: "A former Janissary bridge-builder turned Chief Royal Architect, Mimar Sinan surveys the hills of Constantinople and Edirne with compass and plumb-line. From the cascading domes of the Suleymaniye Mosque to stone bridges, hospitals, and water conduits across the Balkans and Levant, his genius gives the Golden Age an immortal silhouette."
 oe_ptur.16.a: "Patronize Sinan's Imperial Mosques, Bridges & Waqfs"
 oe_ptur.16.b: "Direct Sinan's Engineers Primarily to Frontier Fortresses"
 oe_ptur.17.title: "Mesopotamian Frontier & the Peace of Amasya"
 oe_ptur.17.desc: "Decades of grueling mountain campaigns across eastern Anatolia, Armenia, and Iraq have secured Baghdad and the outlets of the Tigris and Euphrates, yet stretched imperial supply trains to the limit. Envoys from Iran arrive at Amasya proposing a formal frontier treaty that secures Mesopotamia and reopens the silk caravans."
 oe_ptur.17.a: "Ratify the Peace of Amasya and Reopen Silk Trade"
 oe_ptur.17.b: "Keep the Eastern Armies Mobilized for Total Mastery"
 oe_ptur.18.title: "Shock of Lepanto & Sokollu's Winter Arsenal Rebuild"
 oe_ptur.18.desc: "Disaster strikes at sea: a combined Christian Holy League armada shatters dozens of Ottoman war galleys in the Gulf of Patras. Yet when foreign envoys gloat in Istanbul, Grand Vizier Sokollu Mehmed Pasha replies coldly: by taking Cyprus we severed your arm, while at Lepanto you have only shaved our beard—and a shaved beard grows back thicker."
 oe_ptur.18.a: "Mobilize Every Shipyard to Launch 200 Galleys by Spring"
 oe_ptur.18.b: "Conserve Silver and Rebuild the Fleet Gradually"
 oe_ptur.19.title: "The Sultanate of Women & Harem Diplomacy"
 oe_ptur.19.desc: "As the old custom of sending princes to distant provincial sanjaks fades, the Inner Palace becomes the nerve center of imperial patronage. Formidable Valide Sultans such as Nurbanu, Safiye, and Kosem exchange private letters with Venice, France, and England, steadying the throne during young reigns—though conservative viziers grumble at harem influence."
 oe_ptur.19.a: "Harness Valide Palace Diplomacy and Patronage Networks"
 oe_ptur.19.b: "Reassert the Formal Authority of the Grand Vizier's Divan"
 oe_ptur.20.title: "Silver Flood, Celali Bandits & Timar Strain"
 oe_ptur.20.desc: "Torrents of New World silver pouring across the Mediterranean erode the purchasing power of the Ottoman akce just as long wars require ever more salaried musketeers. Impoverished Sipahis abandon their devalued Timar fiefs while unemployed mercenary sekban bands roam the Anatolian plateau in the dreaded Celali uprisings."
 oe_ptur.20.a: "Carry Out Painful Silver Recoinage and Audit Taxes"
 oe_ptur.20.b: "Auction Provincial Iltizam Tax-Farms for Urgent Silver"
 oe_ptur.21.title: "Janissary Marriage, Guild Enrollment & Barracks Decay"
 oe_ptur.21.desc: "The ancient statutes forbidding Janissaries to marry, inherit rank, or practice civilian trades have quietly crumbled. Thousands of men now buy and sell Janissary pay-tickets in Istanbul's coffeehouses and artisan guilds, swelling the corps into an armed political lobby that guards its privileges fiercely."
 oe_ptur.21.a: "Enforce Strict Barracks Celibacy and Purge Ghost Rolls"
 oe_ptur.21.b: "Accept Guild-Enrolled Janissaries to Keep Capital Peace"
 oe_ptur.22.title: "The Tragedy of Young Osman II"
 oe_ptur.22.desc: "Bitterly disillusioned by Janissary lethargy during the Polish campaign at Hotin, the young Sultan Osman II whispers of crossing to Anatolia to raise a fresh, obedient royal army—and perhaps even moving the capital away from rebellious Istanbul. The Janissary cauldrons are already being overturned in the barracks courtyard."
 oe_ptur.22.a: "Press Ahead with the Anatolian Guard Mandate"
 oe_ptur.22.b: "Compromise with the Orta Agas to Avert Regicide"
 oe_ptur.23.title: "Murad IV's Iron Discipline & Baghdad Campaign"
 oe_ptur.23.desc: "Emerging from a perilous childhood regency, Sultan Murad IV rides out in person to crush mutinous cliques, shutter seditious taverns and coffeehouses, and audit corrupt provincial pashas. With fear and order restored across the realm, he leads the refreshed imperial host eastward to reclaim Baghdad."
 oe_ptur.23.a: "Enforce Murad's Iron Edict and March on Baghdad"
 oe_ptur.23.b: "Temper the Purge to Preserve Merchant Prosperity"
 oe_ptur.24.title: "The Koprulu Grand Vizierate Revival"
 oe_ptur.24.desc: "With Venetian warships blockading the Dardanelles and palace factions paralyzing the Divan, the elderly Albanian statesman Koprulu Mehmed Pasha accepts the Grand Vizier's seal on one stark condition: absolute executive authority without palace interference. Under Mehmed and his son Fazil Ahmed, the Sublime Porte awakens like a roused lion."
 oe_ptur.24.a: "Grant the Koprulu Viziers Full Executive Authority"
 oe_ptur.24.b: "Keep Traditional Palace Checks on the Grand Vizier"
 oe_ptur.25.title: "Great Turkish War: Siege of Vienna & Holy League"
 oe_ptur.25.desc: "Kara Mustafa Pasha pitches his crimson pavilion before the bastions of Vienna—the Golden Apple of the West. Yet when Polish winged hussars and imperial German columns crash down from the Kahlenberg heights, a vast European Holy League unites against the Porte across Hungary, Dalmatia, and the Aegean."
 oe_ptur.25.a: "Hold the Danubian Fortresses and Rally Reserve Levies"
 oe_ptur.25.b: "Risk Everything in a Desperate Counteroffensive"
 oe_ptur.26.title: "The Treaty of Karlowitz Diplomatic Shock"
 oe_ptur.26.desc: "Inside a specially built wooden conference pavilion with four separate doors so no envoy enters last, Ottoman scribes sign the Empire's first negotiated European peace as an equal among rival powers. The shock of Karlowitz convinces far-sighted statesmen that the pen of the Reis ul-Kuttab must now guard what the scimitar alone cannot."
 oe_ptur.26.a: "Elevate the Reis ul-Kuttab into a Permanent Foreign Ministry"
 oe_ptur.26.b: "Reject Diplomatic Realism and Prepare Immediate Revanche"
 oe_ptur.27.title: "The Tulip Era & Ibrahim Muteferrika's Printing Press"
 oe_ptur.27.desc: "A decade of peace ushers in the luminous Lale Devri—the Tulip Era—as garden pavilions bloom along the Sweet Waters of Europe and envoys return from Paris with astronomical charts and engineering manuals. With a historic fatwa clearing non-religious works, Ibrahim Muteferrika opens the first Ottoman Turkish movable-type printing press."
 oe_ptur.27.a: "Charter Muteferrika's Printing Press & Translation Bureau"
 oe_ptur.27.b: "Protect Traditional Calligraphers and Limit the Press"
 oe_ptur.28.title: "The Patrona Halil Uprising"
 oe_ptur.28.desc: "War setbacks in the east, heavy urban taxes, and resentment over gilded Tulip Era pavilions ignite fury in the bazaars of Istanbul. Led by bathhouse attendant and former marine Patrona Halil, mutinous Janissaries and artisans swarm the Hippodrome demanding the downfall of reformist ministers and the demolition of Saadabad."
 oe_ptur.28.a: "Suppress the Rebels Firmly and Save the Printing Press"
 oe_ptur.28.b: "Sacrifice the Court Pavilions to Pacify the Streets"
 oe_ptur.29.title: "Russo-Turkish Wars & Treaty of Kuchuk Kaynarca"
 oe_ptur.29.desc: "Northern fleets sailing all the way from the Baltic burn Ottoman anchorages in the Aegean while Russian bayonets press down toward the Dniester and Crimea. The bitter lesson of Kuchuk Kaynarca leaves no doubt: without modern geometry, rapid-fire brass cannon, and copper-hulled ships of the line, the Black Sea itself is lost."
 oe_ptur.29.a: "Found the Muhendishane Imperial Naval & Artillery Academy"
 oe_ptur.29.b: "Double Traditional Fort Garrisons Across the Black Sea"
 oe_ptur.30.title: "Selim III & the Nizam-i Cedid New Order Army"
 oe_ptur.30.desc: "Ascending the throne as revolution convulses Europe, the enlightened Sultan Selim III convenes a consultative assembly of twenty-two statesmen and unveils the Nizam-i Cedid—the New Order. Backed by an independent treasury, uniformed regiments drilling in modern bayonet and volley fire rise outside the shadow of the old Janissary barracks."
 oe_ptur.30.a: "Launch the Nizam-i Cedid Corps & Independent Treasury"
 oe_ptur.30.b: "Restrict Modernization Strictly to Artillery & Engineers"
 oe_ptur.31.title: "Mahmud II & the Auspicious Incident (Vaka-i Hayriye)"
 oe_ptur.31.desc: "Having watched his cousin Selim III toppled by reactionaries, Mahmud II prepares with cold patience: winning over the artillery corps of Tophane, the ulema, and the guild elders. When the Janissaries overturn their soup cauldrons one final time in June, the Sultan unfurls the Sacred Banner of the Prophet and commands the heavy guns to open fire on Etmeydani barracks."
 oe_ptur.31.a: "Abolish the Janissary Corps Forever (Vaka-i Hayriye)"
 oe_ptur.31.b: "Retain a Ceremonial Janissary Household Guard"
 oe_ptur.32.title: "Dawn of the Tanzimat & the Reordered Porte"
 oe_ptur.32.desc: "Five centuries after Osman's horsemen first watered their mounts below Bursa, the House of Osman stands reborn. With specialized ministries replacing archaic offices, a disciplined modern standing army, secular academies, and an imperial edict promising security of life, honor, and property to every subject, the Sublime Porte greets the dawn of the Tanzimat."
 oe_ptur.32.a: "Proclaim the Tanzimat Reordering of the Sublime Porte"
 oe_ptur.32.b: "Balance Imperial Modernization with Ancestral Traditions"
