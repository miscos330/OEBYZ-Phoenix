l_english:
 OE_RW_ASSIM_TITLE: "Cultural Assimilation"
 OE_RW_ASSIM_FLAVOR: "Walls can mark a border, but shared laws and habits take generations to grow. Through schools, markets and service together, peoples from distant lands gradually come to recognize a common Roman home."
 OE_RW_ASSIM_TURKISH: "[ShowCultureName('turkish_culture')] Culture"
 OE_RW_ASSIM_TURKISH_DESC: "Turkic communities have put down roots in Anatolia. As imperial order returns, shared laws, language and daily exchange will gradually bring Turkish and Turkoman populations into a [ShowCultureName('oe_tur_greek_culture')] cultural identity."
 OE_RW_ASSIM_OWNERSHIP: "Anatolian ownership: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_anatolia_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_anatolia_total')|0] conquerable locations"
 OE_RW_ASSIM_WAITING: "Not yet started. Byzantium may begin when it and its subjects own at least 65% of conquerable locations in Anatolia."
 OE_RW_ASSIM_STARTED: "Started: Turkic Romanization"
 OE_RW_ASSIM_START_TURKISH: "Begin Turkic Romanization"
 OE_RW_ASSIM_START_TURKISH_DESC: "Byzantium must own at least 65% of conquerable Anatolian locations together with all levels of its subjects. Military occupation alone does not count. Immediately starts the Turkic Romanization identity movement, at no additional cost. Lasts 30 years per wave and may be renewed after a 10-year cooldown or via Extend Romanization."
 OE_RW_ASSIM_NOT_STARTED: "Turkic Romanization has not already started"
 OE_RW_ASSIM_ANATOLIA_REQUIRED: "Byzantium and all levels of its subjects own at least 65% of conquerable locations in Anatolia"
