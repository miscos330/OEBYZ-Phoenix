 oe_pmng_b_nanyang_charter:0 "Nanyang Treasure Fleet Charter"
 STATIC_MODIFIER_NAME_oe_pmng_mod_weisuo_lijia:0 "Hongwu Weisuo & Lijia Registers"
 STATIC_MODIFIER_DESC_oe_pmng_mod_weisuo_lijia:0 "Hereditary military colonies sustain armies on frontier farms while Yellow and Fish-Scale Registers anchor land taxation, at the cost of tighter merchant restraints."
 STATIC_MODIFIER_NAME_oe_pmng_mod_jiangnan_compromise:0 "Jiangnan Gentry & Merchant Compact"
 STATIC_MODIFIER_DESC_oe_pmng_mod_jiangnan_compromise:0 "Moderate fiscal concessions invigorate Jiangnan merchants and guild workshops while relying less heavily on strict military-colony conscription."
 STATIC_MODIFIER_NAME_oe_pmng_mod_imperial_kilns:0 "Imperial Kilns of Jingdezhen"
 STATIC_MODIFIER_DESC_oe_pmng_mod_imperial_kilns:0 "Binary kaolin-petuntse porcelain formulas and strict imperial quality control secure Ming preeminence in luxury ceramic exports across Eurasia."
 STATIC_MODIFIER_NAME_oe_pmng_mod_private_kiln_boom:0 "Private Export Kiln Boom"
 STATIC_MODIFIER_DESC_oe_pmng_mod_private_kiln_boom:0 "Licensed private kilns across Jiangxi and the southeast coast surge to meet overseas porcelain demand, expanding commercial capacity."
 STATIC_MODIFIER_NAME_oe_pmng_mod_emperor_guards_gate:0 "Emperor Guards the Gate & Grand Canal"
 STATIC_MODIFIER_DESC_oe_pmng_mod_emperor_guards_gate:0 "Moving the throne to Dadu and dredging the Huitong Grand Canal secures the northern passes and channels southern grain north at heavy fiscal upkeep."
 STATIC_MODIFIER_NAME_oe_pmng_mod_nanjing_southern_court:0 "Southern Capital at Yingtian"
 STATIC_MODIFIER_DESC_oe_pmng_mod_nanjing_southern_court:0 "Anchoring the court at Shangyuan harnesses Jiangnan wealth and Longjiang shipyards, favoring maritime reach over northern frontier proximity."
 STATIC_MODIFIER_NAME_oe_pmng_mod_treasure_voyages:0 "Zheng He's Imperial Treasure Fleets"
 STATIC_MODIFIER_DESC_oe_pmng_mod_treasure_voyages:0 "Colossal Longjiang treasure ships sail to Malacca, Kozhikode, and Hormuz, claiming the Maritime Silk mantle at substantial naval treasury expense."
 STATIC_MODIFIER_NAME_oe_pmng_mod_northern_retrenchment:0 "Voyages Halted for Northern Defense"
 STATIC_MODIFIER_DESC_oe_pmng_mod_northern_retrenchment:0 "Decommissioning costly treasure fleets redirects silver and timber into northern walls and garrisons, bolstering defense while shrinking oceanic reach."
 STATIC_MODIFIER_NAME_oe_pmng_mod_ming_rome_phoenix:0 "Ming-Roman Twin Phoenix Concord"
 STATIC_MODIFIER_DESC_oe_pmng_mod_ming_rome_phoenix:0 "Direct diplomatic and commercial ties between the Ming court and New Rome enrich silk, porcelain, and scholarly exchange across Eurasia."
 STATIC_MODIFIER_NAME_oe_pmng_mod_celestial_tribute_dignity:0 "Dignity of the Celestial Tributary Order"
 STATIC_MODIFIER_DESC_oe_pmng_mod_celestial_tribute_dignity:0 "Receiving distant western envoys within classical tributary protocol elevates dynastic legitimacy and celestial authority."
 STATIC_MODIFIER_NAME_oe_pmng_mod_nine_garrisons:0 "Reformed Nine Frontier Garrisons"
 STATIC_MODIFIER_DESC_oe_pmng_mod_nine_garrisons:0 "Lessons from Tumu reshape the Nine Frontier Garrisons along the Great Wall, raising army tradition and border fortifications."
 STATIC_MODIFIER_NAME_oe_pmng_mod_eunuch_directorate:0 "Directorate of Ceremonial Centralization"
 STATIC_MODIFIER_DESC_oe_pmng_mod_eunuch_directorate:0 "Imperial palace agencies tighten oversight of officials and border commanders, lifting crown authority while alienating court elites."
 STATIC_MODIFIER_NAME_oe_pmng_mod_qi_yuanyang_drill:0 "Qi Jiguang's Yuanyang Zhen & Folangji Drill"
 STATIC_MODIFIER_DESC_oe_pmng_mod_qi_yuanyang_drill:0 "Qi Jiguang's eleven-man combined-arms Mandarin Duck squads paired with breech-loading Folangji swivel cannon transform Ming infantry discipline and lethality."
 STATIC_MODIFIER_NAME_oe_pmng_mod_coastal_patrol_fleet:0 "Southeast Coastal Patrol Squadrons"
 STATIC_MODIFIER_DESC_oe_pmng_mod_coastal_patrol_fleet:0 "Fast patrol squadrons and coastal fortresses clear pirate raids along Zhejiang and Fujian, lifting naval tradition and maritime presence."
 STATIC_MODIFIER_NAME_oe_pmng_mod_longqing_opening:0 "1567 Longqing Maritime Opening"
 STATIC_MODIFIER_DESC_oe_pmng_mod_longqing_opening:0 "Licensing private ocean trade out of Moon Harbor connects Fujian merchants directly to Manila silver galleons and Iwami bullion flows."
 STATIC_MODIFIER_NAME_oe_pmng_mod_customs_quota_trade:0 "Regulated Maritime Customs Quotas"
 STATIC_MODIFIER_DESC_oe_pmng_mod_customs_quota_trade:0 "Strict imperial customs quotas regulate silver inflows, ensuring dependable revenue while dampening monetary inflation."
 STATIC_MODIFIER_NAME_oe_pmng_mod_single_whip_law:0 "1581 Single Whip Law & Kaocheng Audits"
 STATIC_MODIFIER_DESC_oe_pmng_mod_single_whip_law:0 "Consolidating land taxes and corvee into silver assessments backed by Kaocheng bureaucratic audits dramatically boosts treasury income and cabinet efficiency."
 STATIC_MODIFIER_NAME_oe_pmng_mod_wanli_expeditions:0 "Wanli's Three Great Campaigns"
 STATIC_MODIFIER_DESC_oe_pmng_mod_wanli_expeditions:0 "Expeditionary campaigns defend Joseon and pacify distant marches, upholding Ming regional prestige at heavy fiscal and war-exhaustion cost."
 STATIC_MODIFIER_NAME_oe_pmng_mod_practical_learning:0 "Practical Learning: Nongzheng & Tiangong Kaiwu"
 STATIC_MODIFIER_DESC_oe_pmng_mod_practical_learning:0 "Xu Guangqi's agronomy and ordnance studies alongside Song Yingxing's industrial encyclopedia accelerate Ming research, institution spread, and artillery metallurgy."
 STATIC_MODIFIER_NAME_oe_pmng_mod_agricultural_hydraulics:0 "Imperial Agricultural Hydraulics"
 STATIC_MODIFIER_DESC_oe_pmng_mod_agricultural_hydraulics:0 "Provincial dike engineering and printed agronomy manuals stabilize harvests and rural prosperity across the realm."
 STATIC_MODIFIER_NAME_oe_pmng_mod_guanning_bastion:0 "Guanning-Jinzhou Hongyi Bastion Line"
 STATIC_MODIFIER_DESC_oe_pmng_mod_guanning_bastion:0 "Heavy Portuguese-pattern Hongyi cannon mounted along the Ningyuan, Jinzhou, and Shanhaiguan bastions anchor an iron shield across the Liaoxi corridor."
 STATIC_MODIFIER_NAME_oe_pmng_loc_ningyuan_fortress:0 "Ningyuan Hongyi Cannon Bastion"
 STATIC_MODIFIER_DESC_oe_pmng_loc_ningyuan_fortress:0 "Fortified ramparts bristling with heavy Hongyi ordnance blunt assaults along the Liaoxi pass and strengthen garrison control."
 STATIC_MODIFIER_NAME_oe_pmng_mod_1644_salvation:0 "Granary Relief & Open-Sea Silver Coinage"
 STATIC_MODIFIER_DESC_oe_pmng_mod_1644_salvation:0 "Opening imperial granaries and minting sovereign silver dollars through maritime trade breaks the deflation spiral and quells late-Ming peasant upheaval."
 STATIC_MODIFIER_NAME_oe_pmng_mod_sanxiang_surtax:0 "Emergency Sanxiang Military Surtaxes"
 STATIC_MODIFIER_DESC_oe_pmng_mod_sanxiang_surtax:0 "Emergency wartime surtaxes squeeze silver and recruits from exhausted counties, sparking widespread agrarian unrest."
 STATIC_MODIFIER_NAME_oe_pmng_mod_pacific_nanyang:0 "Pacific Ming Fleets & Nanyang Protectorates"
 STATIC_MODIFIER_DESC_oe_pmng_mod_pacific_nanyang:0 "A resurgent Ming projects oceanic power across Nanyang entrepots and Pacific silver routes, commanding East Asian sea commerce."
 STATIC_MODIFIER_NAME_oe_pmng_mod_domestic_grand_market:0 "Jiangnan-Grand Canal Domestic Market"
 STATIC_MODIFIER_DESC_oe_pmng_mod_domestic_grand_market:0 "Deepening the unified canal and Yangtze commercial network lifts domestic production, tax yield, and civic prosperity to unmatched heights."
 STATIC_MODIFIER_NAME_oe_pmng_mod_constitutional_secretariat:0 "Academy of Natural Philosophy & Constitutional Cabinet"
 STATIC_MODIFIER_DESC_oe_pmng_mod_constitutional_secretariat:0 "Evolving the Grand Secretariat into an accountable constitutional cabinet paired with modern science and artillery fleets secures Ming greatness into the modern age."
 STATIC_MODIFIER_NAME_oe_pmng_mod_enlightened_ming_autocracy:0 "Enlightened Imperial Order of Great Ming"
 STATIC_MODIFIER_DESC_oe_pmng_mod_enlightened_ming_autocracy:0 "Disciplined cabinet audits and modernized imperial regiments reinforce enlightened monarchical authority across the Middle Kingdom."
 STATIC_MODIFIER_NAME_oe_pmng_mod_southern_ming_rally:0 "Southern Ming Resilience"
 STATIC_MODIFIER_DESC_oe_pmng_mod_southern_ming_rally:0 "Though the northern capital has fallen, Jiangnan and the maritime south rally stubbornly behind the Ming banner to wage a protracted counteroffensive."
 oe_pmng_ref_grand_secretariat_reform:0 "Kaocheng Grand Secretariat & Practical Learning"
 oe_pmng_ref_grand_secretariat_reform_desc:0 "Institutionalizes Zhang Juzheng's Kaocheng administrative audits alongside state patronage of practical agronomy, astronomy, and metallurgy."
 oe_pmng_ref_maritime_celestial_empire:0 "Maritime Celestial Treasure Empire"
 oe_pmng_ref_maritime_celestial_empire_desc:0 "Carries forward Zheng He's treasure fleets and the Longqing maritime opening, projecting heavy warships and sea commerce across the Indian and Pacific Oceans."
 oe_pmng_haijin_policy_law:0 "Ming Maritime & Haijin Policy"
 oe_pmng_haijin_policy_law_desc:0 "Determines the Ming Empire's maritime strategy between strict coastal Haijin closure, licensed Longqing merchant trade, and state-backed imperial treasure fleets."
 oe_pmng_pol_strict_haijin:0 "Strict Haijin Frontier Closure"
 oe_pmng_pol_strict_haijin_desc:0 "Prohibits private overseas sailing, focusing imperial resources on northern frontier defense, domestic stability, and agrarian taxation."
 oe_pmng_pol_longqing_open_ports:0 "Longqing Open Ports Charter"
 oe_pmng_pol_longqing_open_ports_desc:0 "Licenses southeastern merchants to sail to Nanyang and Manila, exchanging silk and porcelain for plentiful maritime silver revenues."
 oe_pmng_pol_imperial_treasure_fleets:0 "Imperial Treasure Fleet Mandate"
 oe_pmng_pol_imperial_treasure_fleets_desc:0 "Maintains state-built treasure armadas and heavy escorts sailing from Longjiang to Malacca and the Indian Ocean to command the Maritime Silk Road."
 oe_pmng_jingdezhen_kiln:0 "Jingdezhen Imperial Kilns & Longjiang Yard"
 oe_pmng_jingdezhen_kiln_desc:0 "Founded in 1369 under Hongwu, uniting Jingdezhen's binary-formula porcelain kilns with Jiangnan and coastal maritime workshops to lift local output, merchant capacity, and prosperity."
 oe_pmng_jingdezhen_kiln_maint:0 "Imperial Kiln & Shipyard Materials"
 oe_pmng_yuanyang_musketeers:0 "Qi Jiguang Yuanyang Musketeers"
 oe_pmng_yuanyang_musketeers_desc:0 "Qi Jiguang's disciplined eleven-man Mandarin Duck squads combining rattan shields, bamboo lances, tridents, and matchlocks for formidable resilience in broken terrain and volley combat."
 oe_pmng_shenjiying_artillery:0 "Shenjiying Folangji & Hongyi Artillery"
 oe_pmng_shenjiying_artillery_desc:0 "Elite Ming Shenjiying artillery combining rapid breech-loading Folangji swivel guns with heavy Hongyi siege cannon forged in the crucible of Ningyuan."
 oe_pmng_adv_yuanyang_folangji:0 "Yuanyang Formation & Folangji Ordnance"
 oe_pmng_adv_yuanyang_folangji_desc:0 "Codifies Qi Jiguang's combined-arms infantry manuals together with Folangji and Hongyi ordnance casting, unlocking Yuanyang Musketeers and Shenjiying Artillery."
 oe_pmng_dec_sponsor_treasure_voyages.title:0 "Sponsor Imperial Treasure Voyages"
 oe_pmng_dec_sponsor_treasure_voyages.desc:0 "Commit treasury silver to relaunch Longjiang treasure fleets toward Malacca, Kozhikode, and Hormuz, claiming the Maritime Silk mantle and shifting the realm toward open seas."
 oe_pmng_dec_sponsor_treasure_voyages.a:0 "Set Sail for the Western Oceans"
 oe_pmng_dec_sponsor_treasure_voyages_tt:0 "Claims the Maritime Silk mantle (oe_pmng_took_maritime_mantle = 1), shifts the Haijin axis toward open seas, and grants a 25-year Treasure Fleet bonus."
 oe_pmng_dec_enact_single_whip.title:0 "Enact the Single Whip Law & Kaocheng Audit"
 oe_pmng_dec_enact_single_whip.desc:0 "Survey imperial land registers, consolidate corvee and land taxes into unified silver assessments, and institute Kaocheng audits to strengthen fiscal health."
 oe_pmng_dec_enact_single_whip.a:0 "Promulgate the Single Whip Nationwide"
 oe_pmng_dec_enact_single_whip_tt:0 "Substantially raises Single Whip fiscal health and grants a 35-year administrative bonus, with temporary noble estate pushback."
 oe_pmng_dec_fortify_guanning_line.title:0 "Fortify the Guanning-Jinzhou Hongyi Line"
 oe_pmng_dec_fortify_guanning_line.desc:0 "Fund European-style bastions and heavy Hongyi cannon along Ningyuan, Jinzhou, and Shanhaiguan, raising the Guanning defense tier and stiffening resistance during the Shanhaiguan Pass struggle."
 oe_pmng_dec_fortify_guanning_line.a:0 "Cast Hongyi Cannon and Hold the Pass"
 oe_pmng_dec_fortify_guanning_line_tt:0 "Raises the Guanning defense tier by +1 (max 4), fortifies Ningyuan and Funing if held, and pushes back breach pressure if the Shanhaiguan Pass situation is active."
 oe_pmng.1.title:0 "Sun and Moon Restored: Hongwu's Weisuo and Lijia Registers"
 oe_pmng.1.desc:0 "Having raised the banner of Ming at Yingtian (Shangyuan), the new court must rebuild armies and revenue from the ashes of upheaval. Founding generals urge hereditary Weisuo military colonies alongside Yellow and Fish-Scale Lijia tax registers, while Jiangnan gentry argue for lighter commercial restraints to revive urban wealth."
 oe_pmng.1.a:0 "Establish Weisuo Colonies and Lijia Registers"
 oe_pmng.1.b:0 "Ease Jiangnan Commercial Restraints"
 oe_pmng.2.title:0 "1369: The Imperial Kilns of Jingdezhen"
 oe_pmng.2.desc:0 "In the second year of Hongwu, royal kilns rise at Fuliang's Jingdezhen, mastering the binary kaolin-petuntse porcelain body under ruthless quality inspection where every flawed vessel is shattered and buried. Shall the crown champion strict imperial kilns or license export workshops across Jiangnan and Fujian?"
 oe_pmng.2.a:0 "Charter the Strict Imperial Porcelain Bureau"
 oe_pmng.2.b:0 "License Private Export Kilns Alongside Imperial Works"
 oe_pmng.3.title:0 "The Emperor Guards the Gate: Dadu and the Grand Canal"
 oe_pmng.3.desc:0 "With steppe horsemen still prowling beyond the passes, ministers debate the empire's seat. Advocates of moving north to Dadu urge dredging the Huitong Grand Canal so the emperor himself guards the northern gate; defenders of Shangyuan argue that Jiangnan's wealth and Longjiang shipyards anchor a maritime future."
 oe_pmng.3.a:0 "Move the Capital to Dadu and Dredge the Grand Canal"
 oe_pmng.3.b:0 "Remain at Shangyuan and Build on Jiangnan's Wealth"
 oe_pmng.4.title:0 "Admiral Zheng He's Seven Voyages to the Western Oceans"
 oe_pmng.4.desc:0 "Towering masts crowd the Longjiang shipyards as Admiral Zheng He's treasure armadas sail to Malacca, Kozhikode, Hormuz, and the East African shore. Court censors warn of soaring naval expenses while northern defenses demand silver. Shall Ming sustain the voyages and claim the Maritime Silk mantle, or mothball the fleet?"
 oe_pmng.4.a:0 "Sustain the Treasure Fleets and Claim the Maritime Mantle"
 oe_pmng.4.b:0 "Decommission the Treasure Ships to Reinforce the North"
 oe_pmng.5.title:0 "Ming and New Rome: Eastern Roman Envoys on the Silk Road"
 oe_pmng.5.desc:0 "Envoys from the Bosporus arrive bearing purple-sealed letters and astronomical codices from New Rome. Whether linked by overland caravan tracks or the sea lanes charted by Ming treasure fleets, the empires at Eurasia's opposite poles stand poised to renew a transcontinental Silk Road partnership."
 oe_pmng.5.a:0 "Seal the Ming-Roman Silk Road Accord"
 oe_pmng.5.b:0 "Receive the Envoys Within Celestial Tributary Protocol"
 oe_pmng.6.title:0 "Alarm of Tumu and the Nine Frontier Garrisons"
 oe_pmng.6.desc:0 "Renewed steppe raids expose cracks in the northern garrisons even as rivalry deepens between the Grand Secretariat and palace eunuchs. The shock demands an immediate overhaul of the Nine Frontier Garrisons along the Great Wall—or ruthless centralization through palace agencies."
 oe_pmng.6.a:0 "Rebuild the Nine Garrisons and Empower Frontier Commanders"
 oe_pmng.6.b:0 "Centralize Oversight Under the Directorate of Ceremonial"
 oe_pmng.7.title:0 "Qi Jiguang's Yuanyang Formation and Folangji Swivel Cannon"
 oe_pmng.7.desc:0 "Pirate raids ravage Zhejiang and Fujian while decaying garrison units falter. General Qi Jiguang drills disciplined recruits into eleven-man Mandarin Duck squads combining polearms and matchlocks, paired with rapid-firing breech-loading Folangji swivel guns."
 oe_pmng.7.a:0 "Adopt Qi Jiguang's Yuanyang Drill and Folangji Cannon"
 oe_pmng.7.b:0 "Expand Southeast Coastal Patrol Squadrons"
 oe_pmng.8.title:0 "1567 Longqing Opening and the Manila Silver Galleons"
 oe_pmng.8.desc:0 "Opening Fujian's Moon Harbor legalizes private merchant fleets just as Manila galleons laden with American silver and bullion from Japan's Iwami mines converge on Chinese ports. Raw silk and porcelain now draw an unprecedented ocean of silver into the Ming economy."
 oe_pmng.8.a:0 "Proclaim the Longqing Maritime Opening"
 oe_pmng.8.b:0 "Regulate Silver Inflows Under Strict Customs Quotas"
 oe_pmng.9.title:0 "1581: Zhang Juzheng's Kaocheng Audit and the Single Whip Law"
 oe_pmng.9.desc:0 "Grand Secretary Zhang Juzheng completes a nationwide land survey and enforces the Single Whip Law, folding myriad corvee and grain levies into unified silver payments monitored by Kaocheng audits. Treasury reserves swell and markets flourish, binding Ming finances tightly to global silver liquidity."
 oe_pmng.9.a:0 "Enforce Single Whip and Kaocheng Nationwide"
 oe_pmng.9.b:0 "Phase In Silver Commutation Gradually in Jiangnan"
 oe_pmng.10.title:0 "Wanli's Three Great Campaigns and Strategic Strain"
 oe_pmng.10.desc:0 "Crises erupt on three fronts—Joseon calls for aid against invasion while rebellions flare in Ningxia and Bozhou. Full imperial intervention preserves East Asian suzerainty at severe cost to the silver treasury; strategic restraint conserves bullion for northern defense."
 oe_pmng.10.a:0 "Commit Imperial Armies Across All Three Fronts"
 oe_pmng.10.b:0 "Guard the Frontier Passes and Preserve the Silver Treasury"
 oe_pmng.11.title:0 "Nongzheng Quanshu & Tiangong Kaiwu: Late Ming Practical Learning"
 oe_pmng.11.desc:0 "Minister Xu Guangqi translates Euclid, reforms the imperial calendar, compiles the Nongzheng Quanshu on agronomy, and champions European-style heavy artillery; meanwhile Song Yingxing publishes the 1637 industrial treatise Tiangong Kaiwu. Ming stands on the threshold of an empirical scientific awakening."
 oe_pmng.11.a:0 "Patronize the Practical Learning Academy and Ordnance Foundries"
 oe_pmng.11.b:0 "Spread Agricultural Hydraulics Across the Provinces"
 oe_pmng.12.title:0 "1626 Victory at Ningyuan: Yuan Chonghuan and the Hongyi Line"
 oe_pmng.12.desc:0 "Holding the lone fortress of Ningyuan with eleven newly cast Hongyi heavy cannon, commander Yuan Chonghuan shatters the Banner siege engines and turns back the Liaodong offensive. Leveraging this triumph, Ming can forge an interlocking bastion chain across Ningyuan, Jinzhou, and Shanhaiguan (Funing)."
 oe_pmng.12.a:0 "Construct the Guanning-Jinzhou Hongyi Bastion Line"
 oe_pmng.12.b:0 "Commit Mobile Guanning Cavalry to Field Counterattacks"
 oe_pmng.13.title:0 "The 1644 Crucible: Little Ice Age, Silver Drought and Salvation"
 oe_pmng.13.desc:0 "Little Ice Age freezes devastate northern harvests just as overseas bullion inflows falter, choking the Single Whip silver economy in severe deflation while rebels and border wars close in. Only decisive granary relief and open-sea monetary reform can avert the 1644 abyss—otherwise harsh Sanxiang military surtaxes beckon."
 oe_pmng.13.a:0 "Open Imperial Granaries and Mint Sovereign Maritime Silver"
 oe_pmng.13.b:0 "Levy Emergency Sanxiang Wartime Surtaxes"
 oe_pmng.14.title:0 "Resurgent Ming: Pacific Treasure Fleets and Nanyang Protectorates"
 oe_pmng.14.desc:0 "Having weathered the seventeenth-century crisis, a revitalized Ming commands thriving shipyards and merchant guilds from Malacca to Manila. The throne may charter Nanyang and Pacific maritime protectorates to rival European chartered companies, or deepen the unrivaled Jiangnan-Grand Canal internal market."
 oe_pmng.14.a:0 "Charter Nanyang Protectorates and Pacific Treasure Lanes"
 oe_pmng.14.b:0 "Consolidate the Jiangnan-Grand Canal Domestic Market"
 oe_pmng.15.title:0 "Imperial Academy of Natural Philosophy and the Constitutional Cabinet"
 oe_pmng.15.desc:0 "As eighteenth-century science and global competition accelerate, Great Ming stands at its institutional zenith. Will the court elevate the Grand Secretariat into an accountable constitutional cabinet paired with modern science and battle fleets, or perfect an enlightened imperial autocracy?"
 oe_pmng.15.a:0 "Establish the Academy of Natural Philosophy and Constitutional Cabinet"
 oe_pmng.15.b:0 "Perfect Enlightened Imperial Order of the Great Ming"
 oe_pmng.16.title:0 "Southern Ming Resilience: Rallying South of the Yangtze"
 oe_pmng.16.desc:0 "Though Dadu has fallen, the rich provinces of Jiangnan, Fujian, and Guangdong still uphold the Ming calendar. Loyal generals, scholars, and coastal captains rally to defend the Yangtze and maritime south against total collapse."
 oe_pmng.16.a:0 "Hold the Yangtze Line and Prepare a Northern Counteroffensive"
 oe_pmng.16.b:0 "Lean on Fujian-Canton Fleets and Nanyang Trade"
