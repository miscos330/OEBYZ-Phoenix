 STATIC_MODIFIER_NAME_oe_pglh_qarachi_privileges_mod: "Qarachi Begs Conciliation"
 STATIC_MODIFIER_DESC_oe_pglh_qarachi_privileges_mod: "The four hereditary Qarachi clans (Shirin, Barin, Arghin, Qipchaq) share state council, bolstering steppe cavalry and tribal loyalty while checking central taxation."
 STATIC_MODIFIER_NAME_oe_pglh_darugha_central_mod: "Darugha Direct Revenue Network"
 STATIC_MODIFIER_DESC_oe_pglh_darugha_central_mod: "Imperial Darugha commissioners directly audit tribute and river tolls, raising crown authority and tax revenue at the cost of nomadic noble resentment."
 STATIC_MODIFIER_NAME_oe_pglh_yarliq_iron_yoke_mod: "Iron Enforcement of the Yarliq"
 STATIC_MODIFIER_DESC_oe_pglh_yarliq_iron_yoke_mod: "Swift steppe campaigns reassert the Khan's Yarliq writ over tributary principalities, sharpening army morale and siege fury."
 STATIC_MODIFIER_NAME_oe_pglh_yarliq_silver_tariff_mod: "Rus' Silver Tariff Accord"
 STATIC_MODIFIER_DESC_oe_pglh_yarliq_silver_tariff_mod: "Structured riverine customs and silver treaties replace punitive raids with steady treasury revenue and calmer frontier diplomacy."
 STATIC_MODIFIER_NAME_oe_pglh_steppe_duel_mod: "Mobilization of Kondurcha and Terek"
 STATIC_MODIFIER_DESC_oe_pglh_steppe_duel_mod: "Mobilizing for the supreme contest between Jochid and Timurid hosts pushes steppe cavalry readiness and manpower to their peak."
 STATIC_MODIFIER_NAME_oe_pglh_steppe_partition_mod: "Khwarazm-Azerbaijan Frontier Compact"
 STATIC_MODIFIER_DESC_oe_pglh_steppe_partition_mod: "A negotiated demarcation across Khwarazm and Azerbaijan spares both khanates ruinous attrition while keeping caravan lanes open."
 STATIC_MODIFIER_NAME_oe_pglh_sarai_reborn_loc_mod: "Sarai Caravan Reconstruction"
 STATIC_MODIFIER_DESC_oe_pglh_sarai_reborn_loc_mod: "Tax remissions and imperial brickworks restore caravanserais, canals, and bazaars along the lower Volga."
 STATIC_MODIFIER_NAME_oe_pglh_ulugh_observatory_mod: "Ulugh Beg Observatory Patronage"
 STATIC_MODIFIER_DESC_oe_pglh_ulugh_observatory_mod: "Astronomers and mathematicians gathered at Samarkand turn Transoxiana into a beacon of Eurasian scholarship and literacy."
 STATIC_MODIFIER_NAME_oe_pglh_suyurghal_audit_mod: "Suyurghal Grant Audit"
 STATIC_MODIFIER_DESC_oe_pglh_suyurghal_audit_mod: "Auditing hereditary tax-exempt Suyurghal fiefs reclaims fiscal authority and hardens standing imperial discipline."
 STATIC_MODIFIER_NAME_oe_pglh_sedentary_settlements_mod: "Qipchaq Relay & Agrarian Settlements"
 STATIC_MODIFIER_DESC_oe_pglh_sedentary_settlements_mod: "Fortified relays, riverine granaries, and farming settlements anchor sedentary transformation across the Qipchaq plain."
 STATIC_MODIFIER_NAME_oe_pglh_nomad_mobility_mod: "Unbroken Steppe Mobility"
 STATIC_MODIFIER_DESC_oe_pglh_nomad_mobility_mod: "Preserving ancestral horse-archer mobility keeps the khanate's columns swift and devastating on open ground."
 STATIC_MODIFIER_NAME_oe_pglh_fur_silk_customs_mod: "Black-Caspian Fur & Silk Tariff"
 STATIC_MODIFIER_DESC_oe_pglh_fur_silk_customs_mod: "Linking northern furs with Transoxianan silk across Astrakhan and Tana turns the Pontic-Caspian corridor into a commercial engine."
 STATIC_MODIFIER_NAME_oe_pglh_new_yassa_charter_mod: "Charter of the New Sedentary Yassa"
 STATIC_MODIFIER_DESC_oe_pglh_new_yassa_charter_mod: "Synthesizes Chinggisid Yassa law with a settled gunpowder monarchy, unlocking full bureaucratic administration and artillery corps."
 STATIC_MODIFIER_NAME_oe_pglh_tabur_readiness_mod: "Steppe Tabur & Zamburak Doctrine"
 STATIC_MODIFIER_DESC_oe_pglh_tabur_readiness_mod: "Chained wagon-forts sheltering matchlockmen and camel-mounted swivel artillery fuse steppe mobility with lethal gunpowder firepower."
 STATIC_MODIFIER_NAME_oe_pglh_volga_canal_works_mod: "Perevolok Canal Excavation"
 STATIC_MODIFIER_DESC_oe_pglh_volga_canal_works_mod: "Tens of thousands of engineers and pioneers cut locks across the narrow Perevolok portage between the Volga and Don."
 STATIC_MODIFIER_NAME_oe_pglh_volga_don_canal_complete: "Volga-Don Canal Opened"
 STATIC_MODIFIER_DESC_oe_pglh_volga_don_canal_complete: "A monumental canal links the Volga and Don, uniting Caspian and Black Sea commerce and naval projection across the Eurasian heartland."
 STATIC_MODIFIER_NAME_oe_pglh_volga_canal_port_loc_mod: "Volga-Don Canal Gateway"
 STATIC_MODIFIER_DESC_oe_pglh_volga_canal_port_loc_mod: "Locks linking the Caspian and Black Sea bring constant riverine tonnage, shipwrights, and merchant houses to this port."
 STATIC_MODIFIER_NAME_oe_pglh_sarai_gunsmiths_mod: "Sarai-Samarkand Royal Cannon Guilds"
 STATIC_MODIFIER_DESC_oe_pglh_sarai_gunsmiths_mod: "Master founders recruited from Anatolia, Persia, and Italy lower artillery upkeep and accelerate siege breaches across the steppe."
 STATIC_MODIFIER_NAME_oe_pglh_iron_curtain_mod: "Steppe Tri-Frontier Garrison Belt"
 STATIC_MODIFIER_DESC_oe_pglh_iron_curtain_mod: "Fortified artillery garrisons along the Volga, Dnieper, and Caucasus brace the khanate against rival empires on every compass point."
 STATIC_MODIFIER_NAME_oe_pglh_polyglot_academy_mod: "Khanate Polyglot Academy & War College"
 STATIC_MODIFIER_DESC_oe_pglh_polyglot_academy_mod: "Turkic, Persian, and Slavic translation halls paired with modern artillery schools speed institutional adoption and scholarly literacy."
 STATIC_MODIFIER_NAME_oe_pglh_ural_industry_mod: "Ural Mines & Steppe Manufactories"
 STATIC_MODIFIER_DESC_oe_pglh_ural_industry_mod: "Exploiting Ural iron and copper alongside riverine manufactories propels the steppe realm into early modern industry."
 STATIC_MODIFIER_NAME_oe_pglh_constitutional_yassa_mod: "Eurasian Constitutional Yassa"
 STATIC_MODIFIER_DESC_oe_pglh_constitutional_yassa_mod: "Merges steppe council traditions with a written charter of estates and multi-ethnic representation for the modern age."
 STATIC_MODIFIER_NAME_oe_pglh_absolute_gunpowder_mod: "Absolute Gunpowder Khaganate"
 STATIC_MODIFIER_DESC_oe_pglh_absolute_gunpowder_mod: "Supreme autocratic authority over standing artillery, imperial relays, and crown finance projects iron discipline across inner Eurasia."
 STATIC_MODIFIER_NAME_oe_pglh_twin_phoenix_hub_mod: "Twin Phoenixes Steppe Transit Boom"
 STATIC_MODIFIER_DESC_oe_pglh_twin_phoenix_hub_mod: "Peaceful commerce between the Roman Empire and the Middle Kingdom floods the steppe caravan routes with transit customs and bullion."
 oe_pglh_b_yarliq_tribute: "Rus' Silver Tariff Goodwill"
 oe_pglh_b_yarliq_wrath: "Khan's Yarliq Punitive Campaign"
 oe_pglh_b_steppe_accord: "Khwarazm-Azerbaijan Frontier Accord"
 oe_pglh_b_steppe_rivalry: "Kondurcha-Terek Steppe Rivalry"
 oe_pglh_b_silk_twin_phoenix: "Twin Phoenixes Steppe Transit Friendship"
 oe_pglh_b_iron_curtain: "Steppe Tri-Frontier Standoff"
 oe_pglh_ref_gunpowder_khanate: "Steppe Gunpowder Khanate"
 oe_pglh_ref_gunpowder_khanate_desc: "Fuses ancestral steppe light-cavalry mobility with modern field artillery and imperial relay administration under the New Yassa Charter."
 oe_pglh_ref_timurid_renaissance_court: "Transoxianan Starlight Court"
 oe_pglh_ref_timurid_renaissance_court_desc: "Channels the Timurid Renaissance of Samarkand and Herat through royal observatories, Turko-Persian scholarship, and artisanal patronage."
 oe_pglh_yassa_governance_law: "Yassa Governance Charter"
 oe_pglh_yassa_governance_law_desc: "Defines the constitutional balance of the steppe court between Qarachi clan councils, direct Darugha cadastres, and Suyurghal patronage."
 oe_pglh_pol_qarachi_council: "Qarachi Begs Council"
 oe_pglh_pol_qarachi_council_desc: "Empowers the hereditary Qarachi Begs in imperial council, securing fierce steppe light cavalry and tribal loyalty."
 oe_pglh_pol_darugha_cadastre: "Darugha Direct Cadastre"
 oe_pglh_pol_darugha_cadastre_desc: "Dispatches imperial Darugha commissioners to audit town tolls and sedentary estates, steadily centralizing crown power."
 oe_pglh_pol_suyurghal_patronage: "Suyurghal Scholarly Patronage"
 oe_pglh_pol_suyurghal_patronage_desc: "Directs hereditary Suyurghal endowments toward astronomers, jurists, and master artisans across Samarkand and the Volga."
 oe_pglh_sarai_gun_foundry: "Sarai-Samarkand Royal Gun Foundry"
 oe_pglh_sarai_gun_foundry_desc: "An imperial Eurasian ordnance complex uniting Turkic, Persian, and Anatolian founders to cast Tabur firearms and swivel cannon while lifting local control and merchant capacity."
 oe_pglh_sarai_gun_foundry_maint: "Royal Gun Foundry (Ordnance Upkeep)"
 oe_pglh_tabur_musketeers: "Steppe Tabur Musketeers"
 oe_pglh_tabur_musketeers_desc: "Infantry fighting from chained, iron-shod wagon forts (Tabur), unleashing volley fire that breaks enemy cavalry charges across open steppe and flatland."
 oe_pglh_zamburak_horse_artillery: "Zamburak & Steppe Horse Artillery"
 oe_pglh_zamburak_horse_artillery_desc: "Light bronze swivel guns mounted on camel saddles and fast carriages, bringing mobile artillery fire straight into the tempo of steppe cavalry raids."
 oe_pglh_adv_steppe_tabur: "Steppe Tabur & Zamburak Doctrine"
 oe_pglh_adv_steppe_tabur_desc: "Combines chained wagon-fort defenses with matchlock volleys and camel-borne swivel cannon, unlocking Steppe Tabur Musketeers and Zamburak Horse Artillery."
 oe_pglh_dec_charter_sedentary_steppe.title: "Proclaim the New Yassa Sedentary Charter"
 oe_pglh_dec_charter_sedentary_steppe.desc: "Once riverine towns, relay farms, and tax rolls mature, the Khan may summon a Great Kurultai to transition the nomadic army-horde into a settled gunpowder monarchy without forsaking steppe horsemanship."
 oe_pglh_dec_charter_sedentary_steppe.a: "Establish the Sedentary Gunpowder Khanate"
 oe_pglh_dec_dig_volga_don_canal.title: "Excavate the Perevolok Volga-Don Canal"
 oe_pglh_dec_dig_volga_don_canal.desc: "Cut canal locks in three engineering stages across the narrow Perevolok portage between the Volga and Don. Completion links Black Sea and Caspian shipping across the steppe heartland."
 oe_pglh_dec_dig_volga_don_canal.a: "Fund the Next Stage of the Volga-Don Canal"
 oe_pglh_dec_assemble_tabur_corps.title: "Assemble the Steppe Tabur Gunpowder Corps"
 oe_pglh_dec_assemble_tabur_corps.desc: "Integrates chained iron-shod wagon forts, matchlock volleys, and camel-borne swivel artillery (up to tier 4) into a formidable early modern steppe corps."
 oe_pglh_dec_assemble_tabur_corps.a: "Expand the Tabur Wagon-Fort Corps"
 oe_pglh.1.t: "Legacy of Uzbeg Khan and the Qarachi Council"
 oe_pglh.1.d: "The splendor left by Uzbeg Khan still gleams across Sarai, yet true power hangs between the Chinggisid throne and the four hereditary Qarachi clans—Shirin, Barin, Arghin, and Qipchaq. Their begs have gathered before the imperial pavilion, demanding to know whether the Khan will rule through their ancestral council or dispatch direct Darugha commissioners over towns and tolls."
 oe_pglh.1.a: "Honor the Four Qarachi Clans and the Steppe Compact"
 oe_pglh.1.b: "Dispatch Darugha Commissioners to Centralize Revenue"
 oe_pglh.2.t: "Aftermath of Kulikovo and the Yarliq Tribute Writ"
 oe_pglh.2.d: "Emboldened by steppe factionalism, the Rus' princes of the northern forests are withholding tribute and questioning the authority of Sarai's Yarliq charters. Hawkish commanders urge a lightning punitive raid to reimpose the yoke by fire and sword, while treasury scribes propose replacing irregular raids with codified silver river tariffs."
 oe_pglh.2.a: "Ride North and Enforce the Yarliq by Steel"
 oe_pglh.2.b: "Codify Silver River Tariffs for Steady Rus' Customs"
 oe_pglh.3.t: "Kondurcha and Terek: Reckoning of the Steppe Titans"
 oe_pglh.3.d: "From the customs gates of Azerbaijan to the oases of Khwarazm, the Chinggisid court of the Qipchaq steppe and the rising host of Timur in Samarkand stand on a collision course. Chroniclers of the Zafarnama foresee an earth-shaking clash by the Kondurcha and Terek rivers—unless envoys carve a cold partition before the plains burn."
 oe_pglh.3.a: "Draw Sabers at the Kondurcha—Only One Lord of the Steppe!"
 oe_pglh.3.b: "Demarcate Azerbaijan and Khwarazm to Preserve the Caravan Lanes"
 oe_pglh.4.t: "Ashes and Rebirth of Sarai al-Jadid"
 oe_pglh.4.d: "Years of steppe warfare have scarred the kilns, aqueducts, and caravanserais of Sarai al-Jadid along the lower Volga. Yet merchants from Khwarazm and the Black Sea still await an imperial reconstruction edict: three years of tax remission and brick ramparts could restore the city's former bustle and propel the realm toward settled prosperity."
 oe_pglh.4.a: "Issue the Caravan Reconstruction Edict for Sarai"
 oe_pglh.4.b: "Rebuild Only the Winter Camp Arsenals and Save Silver"
 oe_pglh.5.t: "Stars of Samarkand: Ulugh Beg's Observatory and Suyurghal Grants"
 oe_pglh.5.d: "Turquoise domes gleam above Samarkand as Ulugh Beg and the masters of Transoxiana prepare a monumental marble sextant observatory to crown the Timurid Renaissance. Yet hereditary tax-exempt Suyurghal fiefs steadily erode central military revenue. How shall the court balance starlight scholarship with iron fiscal order?"
 oe_pglh.5.a: "Patronize Ulugh Beg's Observatory and the Timurid Renaissance"
 oe_pglh.5.b: "Audit Tax-Exempt Suyurghal Grants to Strengthen Crown Discipline"
 oe_pglh.6.t: "The Great Debate on Steppe Sedentarization"
 oe_pglh.6.d: "As brick towns and river fortresses multiply across the Volga and Don, traditionalist elders warn before the imperial tent that abandoning felt yurts for stone walls betrays ancestral martial virtue. Younger governors and merchants counter that without granaries, foundries, and settled tax rolls, no steppe horde can survive the coming age of firearms."
 oe_pglh.6.a: "Build Fortified Relays and Agrarian Settlements"
 oe_pglh.6.b: "Preserve Pure Nomadic Mobility and Placate the Clans"
 oe_pglh.7.t: "Black Sea-Caspian Fur and Silk Customs Ledger"
 oe_pglh.7.d: "With Astrakhan's Caspian salt barges and the Black Sea wharves of Tana and Kaffa under one banner, northern sable pelts, Khwarazmian raw silk, and Crimean grain converge along a unified corridor. Treasury clerks present a consolidated customs ledger spanning both seas."
 oe_pglh.7.a: "Charter the Dual-Sea Customs Bureau"
 oe_pglh.7.b: "Levy Heavy Transit Silver to Reward Frontier Garrisons"
 oe_pglh.8.t: "Proclamation of the New Yassa Sedentary Charter"
 oe_pglh.8.d: "After generations of steady town-building and fiscal reform, steppe wings, riverine burghers, and ordnance masters assemble before the Khan's brick palace. By proclaiming the New Yassa Sedentary Charter, the army-based horde transforms into a landed gunpowder monarchy—preserving Chinggisid cavalry heritage while unlocking modern bureaucracy and artillery."
 oe_pglh.8.a: "Enact the New Yassa and Forge the Gunpowder Khanate!"
 oe_pglh.8.b: "Delay Full Transition and Retain Nomadic Horde Customs"
 oe_pglh.9.t: "Steppe Wagon-Forts (Tabur) and Zamburak Swivel Guns"
 oe_pglh.9.d: "Confronting European armored horse and pike-and-shot squares, the Khan's generals fuse eastern wagon-forts (Tabur / Gulyay-gorod) with matchlock platoons and camel-mounted Zamburak swivel cannon—turning open-steppe columns into mobile iron fortresses within minutes."
 oe_pglh.9.a: "Adopt Tabur Wagon-Forts and Zamburak Swivel Artillery"
 oe_pglh.9.b: "Trial the Wagon-Fort Doctrine in Guard Detachments First"
 oe_pglh.10.t: "Grand Design of Perevolok: The Volga-Don Canal"
 oe_pglh.10.d: "In 1569, Grand Vizier Sokollu Mehmed Pasha dreamed of cutting a canal across the narrow Perevolok portage between the Volga and Don, only to fail for lack of local logistics. Holding both Astrakhan and Tana, the Khan now stands poised to succeed where others faltered—uniting the Caspian and Black Sea shipping lanes forever."
 oe_pglh.10.a: "Push the Volga-Don Canal to Triumphant Completion!"
 oe_pglh.10.b: "Build a Timber Portage Slipway and Advance Gradually"
 oe_pglh.11.t: "Inauguration of the Royal Steppe Gun Foundry"
 oe_pglh.11.d: "Master bronze founders from Anatolia, Tabriz, and Lombardy have lit the great furnaces of the Khan's ordnance yard. As the first field cannon and rifled barrels roar across the proving grounds, the realm proves that a steppe empire can forge siege metal equal to any settled monarchy."
 oe_pglh.11.a: "Grant a Royal Charter to the Steppe Cannon Guilds"
 oe_pglh.11.b: "Lease Auxiliary Furnaces to Burghers for Revenue"
 oe_pglh.12.t: "Three-Front Iron Ring: Moscow, Poland-Lithuania, and Persia"
 oe_pglh.12.d: "Russian artillery columns to the north, Polish-Lithuanian cavalry to the west, and Anatolian-Persian gunpowder empires to the south are closing around the steppe frontier. Dispatch riders warn that only a fortified garrison belt and nimble counter-diplomacy can prevent encirclement."
 oe_pglh.12.a: "Fortify the Tri-Frontier Artillery Garrison Belt"
 oe_pglh.12.b: "Dispatch Envoys to Break the Ring via Trade Diplomacy"
 oe_pglh.13.t: "The Eurasian Khan's Enlightenment Academy"
 oe_pglh.13.d: "Eighteenth-century Enlightenment letters are reaching the steppe capitals from the Black Sea and Persia. Court scholars propose founding a trilingual Turkic-Persian-Slavic academy and modern ballistics college, marrying Transoxianan mathematical heritage with modern engineering."
 oe_pglh.13.a: "Found the Polyglot Academy and Modern War College"
 oe_pglh.13.b: "Focus Strictly on Practical Ordnance and Cartography"
 oe_pglh.14.t: "Steppe Manufactories and the Ural Mineral Belt"
 oe_pglh.14.d: "Surveyors along the Ural foothills have mapped rich seams of iron and copper, while leather, wool, and saltpeter manufactories expand along the lower Volga. Backed by trans-Eurasian trade routes, the Khanate can forge an industrial heartland rivaling Western Europe."
 oe_pglh.14.a: "Charter State-Backed Ural Mines and River Manufactories"
 oe_pglh.14.b: "Lease Mineral Concessions for Immediate Bullion Revenue"
 oe_pglh.15.t: "Constitutional Crossroads: Dual Yassa Charter or Absolute Khaganate"
 oe_pglh.15.d: "Entering the late eighteenth century, the steppe empire faces its defining constitutional choice for the modern world. Reformers urge elevating the ancient Kurultai into a written Eurasian Constitutional Yassa uniting Turkic, Persian, and Slavic estates; absolutists call for an iron-disciplined Gunpowder Khaganate commanded solely by the throne."
 oe_pglh.15.a: "Enact the Eurasian Constitutional Yassa"
 oe_pglh.15.b: "Proclaim the Absolute Gunpowder Khaganate"
 oe_pglh.16.t: "Steppe Crossroads of the Silk Road Twin Phoenixes"
 oe_pglh.16.d: "With the Roman Empire on the Bosporus and the Middle Kingdom in the East both standing tall in peace, the overland Silk Road through Sarai, Astrakhan, and Samarkand bursts back into golden life. Caravans bearing silk, porcelain, glassware, and silver gladly pay rich transit customs to the Khan holding the Eurasian heartland."
 oe_pglh.16.a: "Issue Golden Paizas to East-West Caravans for Transit Prosperity"
 oe_pglh.16.b: "Levy Heavy Emergency Tolls on Transit Bullion"
 oe_pglh.90.t: "Audit Readout: Playable Golden Horde & Timurids Status"
