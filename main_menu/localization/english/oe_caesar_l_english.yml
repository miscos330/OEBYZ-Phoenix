l_english:
 oe_byz_confer_caesar: "Confer the Title of Caesar"
 oe_byz_confer_caesar_desc_specific: "Bestow the dignity of Caesar on a domestic character or the ruler of any of the six theme types. Requires adulthood and at least one ability above 65. Base cost: #R 10#! Imperial Authority and #R 5#! Legitimacy. Burghers cost #R 10#! additional Legitimacy; Commoners cost #R 30#! additional Legitimacy. Either estate costs a further #R 30#! if total abilities are below 150. A Caesar gains #G +50#! imperial succession score and may be crowned Co-Emperor."
 oe_byz_confer_caesar_concept: "#bold #color_yellow Court Honor#!#!"
 oe_byz_confer_caesar_act_past: "Has been granted the dignity of Caesar."
 STATIC_MODIFIER_NAME_oe_byz_caesar_modifier: "Caesar"
 STATIC_MODIFIER_DESC_oe_byz_caesar_modifier: "The dignity of Caesar bears the glory of the Empire and the trust of its Emperor. Its holder receives #G +50#! points in the East Roman imperial succession."
 OE_HEIR_SELECTION_CAESAR: "Holds the Title of Caesar"
 OE_CAESAR_LEGITIMACY_REQUIRED: "Requires at least #Y 5#! Legitimacy."
 OE_CAESAR_AUTHORITY_REQUIRED: "The Imperial Pillars must have at least #Y 10#! Authority."
 OE_CAESAR_AUTHORITY_COST: "Spend #R 10#! Imperial Authority."
 OE_CAESAR_NO_CANDIDATE: "@trigger_no! Requires a domestic character or a ruler of one of the six theme types, from the Crown, Nobility, Burghers or Commoners estate, who is an adult with an ability above 65 and is not already a Caesar."
 OE_CAESAR_FULL_LEGITIMACY_REQUIRED: "Enough Legitimacy to pay the base cost and this recipient’s estate and ability surcharges."
