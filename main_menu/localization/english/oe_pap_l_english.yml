l_english:
 # NEW 2026-11-23 v23.0 Module B1: Papal Kingdom of God & Imperium Sancti Petri (oe_pap_) — English Localization (270 keys) (oe_pap_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v230_papal_kingdom_god.py; edit the generator, not this file.
 oe_pap_legation:0 "Cardinal Legation"
 oe_pap_legation_desc:0 "A specialized landed ecclesiastical realm chartered by the Papal States and governed by a loyal Cardinal-Legate. Sharing St. Peter's map color while retaining its regional identity, a Cardinal Legation answers every overlord war call, accelerates Catholic conversion, and pays modest vassal tithes."
 LEAD_oe_pap_legation:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_pap_legation:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_pap_legation_subject_opinion:0 "Papal Overlordship"
 oe_pap_legation_overlord_opinion:0 "Papal Cardinal Legation"
 oe_msn_pap_kingdom_god:0 "#bold #color_yellow Regnum Dei & Imperium Sancti Petri#!#!"
 oe_msn_pap_kingdom_god_DESCRIPTION:0 "Resolve the Avignon Captivity, unify Italy into the Kingdom of God on Earth, reclaim all five Pentarchy Sees to proclaim Imperium Sancti Petri, and heal the Great Schism."
 oe_msn_pap_kingdom_god_CRITERIA_DESCRIPTION:0 "Play as the Papal States holding Rome or Avignon to chart St. Peter's four-branch imperial and ecumenical destiny."
 oe_msn_pap_kingdom_god_BUTTON_TOOLTIP:0 "Embark on the Regnum Dei & Imperium Sancti Petri Flagship Tree"
 oe_msn_pap_kingdom_god_BUTTON_DETAILS:0 "A sixteen-task four-branch flagship tree for the Papal States: resolve Avignon and Albornoz's reconquest; unify Italy into Regnum Dei and charter Cardinal Legations; liberate Jerusalem, Antioch, Alexandria, and Constantinople to proclaim Imperium Sancti Petri; and champion the High Renaissance, Counter-Reformation, and Ecumenical Union."
 oe_pap_legation_reform:0 "Cardinal Legation Charter"
 oe_pap_legation_reform_desc:0 "Invests a Papal Cardinal-Legate with civil magistracy, fortress wardenship, and diocesan courts to pacify conquered territories in St. Peter's name."
 oe_pap_regnum_dei_reform:0 "Regnum Dei: Kingdom of God on Earth"
 oe_pap_regnum_dei_reform_desc:0 "Proclaimed upon uniting the Italian peninsula under the Keys of St. Peter, crowning the Holy See as a sovereign empire while keeping papal elections, cardinals, and leadership of the Catholic Church intact."
 oe_pap_sanctum_imperium_reform:0 "Imperium Sancti Petri: Holy Papal Rome"
 oe_pap_sanctum_imperium_reform_desc:0 "Holding the Five Patriarchal Sees—Rome, Constantinople, Jerusalem, Alexandria, and Antioch—the Supreme Pontiff unites spiritual primacy and Roman imperial sovereignty as Pontifex Maximus et Augustus."
 oe_pap_gallic_curia_reform:0 "Avignon Sovereign Curia"
 oe_pap_gallic_curia_reform_desc:0 "By anchoring the Apostolic Palace permanently upon the Rhone instead of retreating across the Alps, the Curia transforms Avignon into a polished bureaucratic and diplomatic capital projecting Franco-Papal ascendancy across Western Europe."
 oe_pap_law_donation_constantine:0 "Interpretation of the Donation of Constantine"
 oe_pap_law_donation_constantine_desc:0 "Defines the constitutional scope of papal sovereignty claimed from Emperor Constantine's ancient grant—whether asserting direct temporal dominion, universal spiritual primacy, or a balanced concordat with Christian crowns."
 oe_pap_pol_temporal_supremacy:0 "Temporal Supremacy"
 oe_pap_pol_temporal_supremacy_desc:0 "Interprets the Donation as full imperial jurisdiction over the West, tightening crown control and war-score leverage at the cost of wary foreign courts."
 oe_pap_pol_spiritual_primacy:0 "Spiritual Primacy"
 oe_pap_pol_spiritual_primacy_desc:0 "Elevates the moral supremacy of St. Peter's Chair above earthly crowns, accelerating religious influence, devotion, conversion, and diplomatic standing."
 oe_pap_pol_imperial_concordat:0 "Imperial Concordat"
 oe_pap_pol_imperial_concordat_desc:0 "Harmonizes papal legates with secular emperors and kings through negotiated concordats, expanding diplomatic capacity, vassal loyalty, and realm stability."
 oe_pap_law_curia_patronage:0 "Curial Humanism & Inquisition Law"
 oe_pap_law_curia_patronage_desc:0 "Directs the ideological and cultural mission of the Roman Curia across Renaissance academies, doctrinal tribunals, and mendicant preaching orders."
 oe_pap_pol_renaissance_humanism:0 "Renaissance Humanist Patronage"
 oe_pap_pol_renaissance_humanism_desc:0 "Opens Vatican libraries and papal commissions to humanist scholars, architects, and painters, boosting research speed, artistic talent, and cultural brilliance."
 oe_pap_pol_roman_inquisition:0 "Roman Inquisition"
 oe_pap_pol_roman_inquisition_desc:0 "Empowers the Holy Office to root out heresy and sedition, sharply raising conversion speed, counter-espionage, and resistance to Protestant movements."
 oe_pap_pol_mendicant_missions:0 "Mendicant Missions"
 oe_pap_pol_mendicant_missions_desc:0 "Deploys Franciscan, Dominican, and Augustinian friars among townsfolk and peasants, fostering gentle conversion, cultural integration, and popular contentment."
 oe_pap_law_swiss_crusade:0 "Swiss Guard & Crusade Tithe Law"
 oe_pap_law_swiss_crusade_desc:0 "Governs how the Holy See finances and recruits the sword defending the Patrimony of St. Peter—from elite Alpine halberdiers to pan-Catholic crusade tithes and Italian condottieri."
 oe_pap_pol_swiss_guard_corps:0 "Papal Swiss Guard Corps"
 oe_pap_pol_swiss_guard_corps_desc:0 "Maintains sworn Alpine pike and halberd formations around the Pontiff, hardening battlefield discipline, heavy infantry combat power, and fortress defense."
 oe_pap_pol_european_crusade_tithe:0 "Pan-European Crusade Tithe"
 oe_pap_pol_european_crusade_tithe_desc:0 "Collects dedicated crusade tenths across Catholic dioceses to fill the Apostolic Chamber with steady gold, volunteers, and fervent campaign morale."
 oe_pap_pol_condottieri_legions:0 "Condottieri Papal Legions"
 oe_pap_pol_condottieri_legions_desc:0 "Retains seasoned Italian captains of fortune on standing papal contracts, cutting mercenary upkeep while boosting siegecraft, morale, and martial tradition."
 oe_pap_law_cardinal_college:0 "College of Cardinals & Diocesan Charter"
 oe_pap_law_cardinal_college_desc:0 "Establishes the composition and governance of the Sacred College of Cardinals—balancing tight Italian curial administration against universal Catholic representation or conciliar fellowship."
 oe_pap_pol_italian_curia:0 "Italian Curial Consolidation"
 oe_pap_pol_italian_curia_desc:0 "Anchors key curial offices in Roman and Italian prelates devoted to the Patrimony, lifting monthly control, cabinet efficiency, taxation, and crown power."
 oe_pap_pol_universal_college:0 "Universal Catholic College"
 oe_pap_pol_universal_college_desc:0 "Distributes red hats evenly among French, German, Iberian, Polish, and Italian kingdoms, elevating papal diplomacy, religious influence, and legation loyalty."
 oe_pap_pol_ecumenical_synod:0 "Ecumenical Conciliar Synod"
 oe_pap_pol_ecumenical_synod_desc:0 "Convenes regular general synods welcoming bishops and eastern delegates, improving legislative efficiency, Christian tolerance, stability, and enduring prestige."
 oe_pap_op_legation_chartered:0 "Chartered as Papal Cardinal Legation"
 oe_pap_op_gallic_concordat:0 "Franco-Papal Concordat of Avignon"
 oe_pap_op_hre_advocate:0 "Confirmed Secular Advocate of the Church"
 oe_pap_op_hre_usurped:0 "Papal Absorption of Roman Imperial Title"
 oe_pap_op_ecumenical_bridge:0 "Ecumenical Council of Twin Sees"
 oe_pap_op_ecumenical_union:0 "Healed the 1054 Great Schism"
 oe_pap_op_latin_primacy_demand:0 "Papal Demand for Unconditional Primacy"
 oe_pap_dec_return_to_rome.title:0 "Return to Rome or Anchor the Avignon Curia"
 oe_pap_dec_return_to_rome.desc:0 "Decide the permanent throne of St. Peter's Successor: march triumphantly from Avignon back to #Y Rome#! to restore the Eternal City, or reject the return and consecrate the #Y Avignon Sovereign Curia#! as a Western European diplomatic power."
 oe_pap_dec_return_to_rome.a:0 "Return the Apostolic Throne from Avignon to Rome"
 oe_pap_dec_return_to_rome.b:0 "Remain in Avignon and Charter the Gallic Curia"
 oe_pap_dec_proclaim_kingdom_of_god.title:0 "Proclaim the Kingdom of God on Earth (Regnum Dei)"
 oe_pap_dec_proclaim_kingdom_of_god.desc:0 "Having unified Italy's great pillars—#Y Rome, Milan, Florence, and Naples#!—proclaim the #Y Kingdom of God on Earth#!. Elevates the Papal States to #Y Empire#! rank, unlocks the sovereign #Y Regnum Dei#! reform alongside the Papacy, grants a permanent modifier, and preserves Catholic Church leadership."
 oe_pap_dec_proclaim_kingdom_of_god_req_tt:0 "Own or have non-sovereign subjects own #Y Rome, Milan, Florence, and Naples#!."
 oe_pap_dec_proclaim_kingdom_of_god.a:0 "Crown the Kingdom of God on Earth!"
 oe_pap_dec_proclaim_papal_rome.title:0 "Proclaim Imperium Sancti Petri (Holy Papal Rome)"
 oe_pap_dec_proclaim_papal_rome.desc:0 "Holding all five ancient Patriarchal Sees—#Y Rome, Constantinople, Jerusalem, Alexandria, and Antioch#!—proclaim the Papal Restoration of Rome as #Y Pontifex Maximus et Augustus#!. Elevates the Holy See to #Y Empire#! rank, unlocks the #Y Imperium Sancti Petri#! reform, and bypasses vanilla Papal nation-formation locks without breaking the Papacy."
 oe_pap_dec_proclaim_papal_rome_req_tt:0 "Own or have non-sovereign subjects own all five Pentarchy Sees: #Y Rome, Constantinople, Jerusalem, Alexandria, and Antioch#!."
 oe_pap_dec_proclaim_papal_rome.a:0 "Proclaim Imperium Sancti Petri — Pontifex Maximus et Augustus!"
 oe_pap_dec_charter_legation.title:0 "Charter a Papal Cardinal Legation"
 oe_pap_dec_charter_legation.desc:0 "Enfeoff conquered non-core border territories into a loyal #Y Cardinal Legation#! subject governed under the Cardinal Legation Charter. Never cedes our capital, #Y Rome#!, #Y Avignon#!, Lazio, or Papal core provinces."
 oe_pap_dec_charter_legation_req_tt:0 "Own at least #Y 3#! non-core, non-capital locations outside Lazio, Rome, and Avignon."
 oe_pap_dec_charter_legation.a:0 "Invest the Cardinal-Legate and Seal the Charter"
 oe_pap_dec_call_universal_crusade.title:0 "Call the Universal Crusade Tithe & Host"
 oe_pap_dec_call_universal_crusade.desc:0 "Issue a solemn papal bull summoning crusade tenths and armed pilgrims from every diocese of Catholic Christendom. Repeatable every #Y 10 years#!, granting #G +180#! gold, #G +5#! manpower, #G +6#! army tradition, and a #Y 5#!-year crusade war buff."
 oe_pap_dec_call_universal_crusade.a:0 "Proclaim the Universal Crusade Bull Across Christendom"
 oe_pap_dec_ecumenical_council.title:0 "Convene the Ecumenical Council with Constantinople"
 oe_pap_dec_ecumenical_council.desc:0 "Invite the Eastern Roman Emperor and the Ecumenical Patriarch to a grand council aimed at healing the #Y 1054 Great Schism#!—whether through an equal Twin-See Christian union or firm assertion of Roman Primacy."
 oe_pap_dec_ecumenical_council.a:0 "Dispatch Papal Legates to Convene the Council"
 oe_msn_pap_a1_avignon_court:0 "Resolve the Avignon Court"
 oe_msn_pap_a1_avignon_court_desc:0 "Seated beside the Rhone while Italy fractures into rival signorie, the Curia must set its grand course—prepare the long road back to St. Peter's tomb, or forge Avignon into a sovereign western seat of [prestige|e] and [devotion|e]."
 oe_msn_pap_a1_avignon_court_req_tt:0 "Resolve the 1337 Avignon Captivity choice, move the capital to Rome, or hold Avignon with at least 8 Stability."
 oe_msn_pap_a2_albornoz_romagna:0 "Albornoz Reconquest of Romagna"
 oe_msn_pap_a2_albornoz_romagna_desc:0 "Following Cardinal Gil de Albornoz's iron campaigns and the Constitutiones Aegidianae, restoring papal banners over Ravenna and Bologna secures the Adriatic flank and revives lawful [control|e] across Romagna."
 oe_msn_pap_a2_albornoz_romagna_req_tt:0 "Own or have non-sovereign subjects own both Ravenna and Bologna."
 oe_msn_pap_a3_subdue_rienzo_rome:0 "Subdue Cola di Rienzo & Secure Rome"
 oe_msn_pap_a3_subdue_rienzo_rome_desc:0 "From the Capitoline Hill, demagogues and feuding barons alike challenge St. Peter's peace. Settling the Roman commune restores lawful civic [stability|e] and prepares the Eternal City's rebirth."
 oe_msn_pap_a3_subdue_rienzo_rome_req_tt:0 "Directly own Rome with at least 10 Stability, and resolve Cola di Rienzo's uprising (or hold Rome as capital / adopt the Avignon Curia)."
 oe_msn_pap_a4_end_western_schism:0 "End the Western Schism"
 oe_msn_pap_a4_end_western_schism_desc:0 "With rival claimants silenced and Christendom's obedience gathered beneath one undisputed tiara, the Apostolic See emerges unified in supreme [devotion|e] and diplomatic authority."
 oe_msn_pap_a4_end_western_schism_req_tt:0 "Reach the Age of Renaissance, ensure the Western Schism is not active, maintain 12 Stability and 75 Devotion, and hold Rome as capital (or rule through the Avignon Sovereign Curia)."
 oe_msn_pap_b1_pacify_central_italy:0 "Pacify Central Italy"
 oe_msn_pap_b1_pacify_central_italy_desc:0 "Linking Lazio across the Apennines through Umbria and the March of Ancona gives the Papal States a secure belt from the Tyrrhenian to the Adriatic, multiplying provincial [tax|e] and [control|e]."
 oe_msn_pap_b1_pacify_central_italy_req_tt:0 "Own or have non-sovereign subjects own Rome, Perugia, and Ancona."
 oe_msn_pap_b2_unify_italian_peninsula:0 "Unify the Italian Peninsula"
 oe_msn_pap_b2_unify_italian_peninsula_desc:0 "From the Lombard plain and the domes of Tuscany to the bay of Naples, Italy's warring princes bow before St. Peter's banner, gathering the peninsula's unmatched [trade|e] and [manpower|e] beneath one shepherd."
 oe_msn_pap_b2_unify_italian_peninsula_req_tt:0 "Own or have non-sovereign subjects own Rome, Milan, Florence, and Naples."
 oe_msn_pap_b3_proclaim_kingdom_of_god:0 "Proclaim the Kingdom of God on Earth"
 oe_msn_pap_b3_proclaim_kingdom_of_god_desc:0 "No longer a fragile principality hemmed in by foreign invaders, the unified Italian realm stands consecrated as Regnum Dei—an imperial bastion of [crown_power|e] and holy law."
 oe_msn_pap_b3_proclaim_kingdom_of_god_req_tt:0 "Enact the Proclaim the Kingdom of God on Earth decision or adopt the Regnum Dei reform."
 oe_msn_pap_b4_charter_cardinal_legations:0 "Charter the Cardinal Legations"
 oe_msn_pap_b4_charter_cardinal_legations_desc:0 "Delegating outer realms to loyal Cardinal-Legates turns sprawling conquests into an orderly hierarchy of obedient ecclesiastical [subjects|e] bound to Rome's [control|e]."
 oe_msn_pap_b4_charter_cardinal_legations_req_tt:0 "Maintain 15 Stability and either have at least one active Cardinal Legation subject or control 60+ locations (including subjects)."
 oe_msn_pap_c1_liberate_jerusalem_antioch:0 "Liberate Jerusalem & Antioch"
 oe_msn_pap_c1_liberate_jerusalem_antioch_desc:0 "Carrying the Crossed Keys across the Levant fulfills three centuries of crusade vows, restoring St. Peter's first see at Antioch and the Holy Sepulchre in Jerusalem to Christian [devotion|e] and [army|e] glory."
 oe_msn_pap_c1_liberate_jerusalem_antioch_req_tt:0 "Own or have non-sovereign subjects own both Jerusalem and Antioch."
 oe_msn_pap_c2_secure_alexandria:0 "Secure the See of Alexandria"
 oe_msn_pap_c2_secure_alexandria_desc:0 "Raising the papal standard above St. Mark's ancient port unlocks the Nile delta's riches and seals the southern Mediterranean [market|e] for the Holy See's fleets."
 oe_msn_pap_c2_secure_alexandria_req_tt:0 "Own or have non-sovereign subjects own Alexandria."
 oe_msn_pap_c3_crown_constantinople:0 "Crown at Constantinople"
 oe_msn_pap_c3_crown_constantinople_desc:0 "When the Supreme Pontiff celebrates Mass beneath the dome of Hagia Sophia, Old Rome and New Rome stand reunited for the first time since antiquity, lifting papal [prestige|e] to imperial heights."
 oe_msn_pap_c3_crown_constantinople_req_tt:0 "Own or have non-sovereign subjects own Constantinople."
 oe_msn_pap_c4_holy_papal_rome:0 "Imperium Sancti Petri: Pontifex Maximus et Augustus"
 oe_msn_pap_c4_holy_papal_rome_desc:0 "Commanding all five Pentarchy Sees across Europe, Asia, and Africa, the Vicar of Christ dons the Roman purple alongside the Triple Tiara, wielding undivided spiritual and imperial [crown_power|e]."
 oe_msn_pap_c4_holy_papal_rome_req_tt:0 "Enact the Proclaim Imperium Sancti Petri decision or adopt the Imperium Sancti Petri reform."
 oe_msn_pap_d1_high_renaissance_patron:0 "Patron of the High Renaissance"
 oe_msn_pap_d1_high_renaissance_patron_desc:0 "Gathering architects, sculptors, and classical philologists beneath the papal portico turns Rome into Christendom's beacon of learning, [development|e], and enduring [prestige|e]."
 oe_msn_pap_d1_high_renaissance_patron_req_tt:0 "Reach the Age of Renaissance, embrace the Renaissance institution, and own a Cathedral, University, Library, or Art School."
 oe_msn_pap_d2_counter_reformation_bulwark:0 "Counter-Reformation Bulwark"
 oe_msn_pap_d2_counter_reformation_bulwark_desc:0 "Through reformed seminaries, catechisms, and disciplined orders, the Tridentine Church turns the tide against schismatic storms, fortifying internal [stability|e] and missionary zeal."
 oe_msn_pap_d2_counter_reformation_bulwark_req_tt:0 "Reach the Age of Reformation with 12 Stability, and embrace Confessionalism, reach 85 Devotion, or resolve the Tridentine Bastion event."
 oe_msn_pap_d3_heal_1054_schism:0 "Heal the 1054 Great Schism"
 oe_msn_pap_d3_heal_1054_schism_desc:0 "Whether through fraternal dialogue with Byzantium at an Ecumenical Council or by gathering Constantinople directly under St. Peter's wing, the four-century wound dividing East and West finally closes."
 oe_msn_pap_d3_heal_1054_schism_req_tt:0 "Convene the Ecumenical Council with Byzantium (or complete Ecumenical Union), control Constantinople, or see Byzantium no longer exist."
 oe_msn_pap_d4_eternal_universal_see:0 "Eternal Universal See"
 oe_msn_pap_d4_eternal_universal_see_desc:0 "Urbi et Orbi—to the City and to the World. With schisms healed, Italy united, Cardinal Legations flourishing, and the Pentarchy restored under imperial purple, St. Peter's Eternal See shines across every age."
 oe_msn_pap_d4_eternal_universal_see_req_tt:0 "Maintain 18 Stability, hold Empire rank, control Rome, and uphold either the Regnum Dei or Imperium Sancti Petri reform."
 oe_pap.1.title:0 "1337 Avignon Captivity: The Crossroads of St. Peter"
 oe_pap.1.desc:0 "High above the rushing Rhone, the fortified stone towers of the Palais des Papes rise over Avignon while Rome lies prey to feuding Colonna and Orsini barons. French cardinals urge Pope Benedict XII to make Avignon the permanent bureaucratic citadel of Western Christendom, yet Italian legates plead for a bold reconquest of Romagna and an eventual triumphal return to St. Peter's tomb."
 oe_pap.1.a:0 "Prepare Cardinal Albornoz's Campaign and the Return to Rome"
 oe_pap.1.b:0 "Stay in Avignon and Forge the Sovereign Gallic Curia"
 oe_pap.2.title:0 "Cardinal Gil de Albornoz & the Constitutiones Aegidianae"
 oe_pap.2.desc:0 "A seasoned Castilian warrior-prelate, Cardinal Gil Alvarez Carrillo de Albornoz, stands before the Papal Consistory with a battle plan to subdue rebellious vicars across Romagna, Marche, and Umbria alongside a comprehensive legal code—the Constitutiones Aegidianae—to govern the restored Papal States for centuries."
 oe_pap.2.a:0 "Launch Albornoz's Iron Reconquest of Romagna"
 oe_pap.2.b:0 "Promulgate the Aegidian Legal Code and Conciliate the Communes"
 oe_pap.3.title:0 "1347 Uprising of Cola di Rienzo in Rome"
 oe_pap.3.desc:0 "Clad in white silk upon the Capitoline steps, the notary Cola di Rienzo has rallied the Roman citizenry as 'Tribune of Liberty, Peace, and Justice,' chasing feudal barons from the city while claiming to revive the ancient Roman Republic under papal blessing. Shall our legates crush this perilous demagogue at once, or co-opt the Roman commune through a balanced civic charter?"
 oe_pap.3.a:0 "Crush the Self-Styled Tribune and Restore Papal Curators"
 oe_pap.3.b:0 "Grant a Civic Charter to the Roman Commune"
 oe_pap.4.title:0 "Triumphal Return to the Eternal City"
 oe_pap.4.desc:0 "Church bells peal from the Tiber to the Aventine as the Papal procession enters Rome through the Porta San Paolo. After decades along the Rhone, St. Peter's Successor once more blesses the city from the Lateran and Vatican hills. How shall we seal this historic homecoming?"
 oe_pap.4.a:0 "Consecrate the Vatican and Lateran as Christendom's Eternal Capital"
 oe_pap.4.b:0 "Keep Avignon's Legates as a Twin Diplomatic Bridge to Western Europe"
 oe_pap.5.title:0 "The Gallic Papacy: Sovereign Curia of Avignon"
 oe_pap.5.desc:0 "From the marble galleries of the Palais des Papes, our chancery now coordinates cardinals, bankers, and royal envoys from Paris to Aragon. By choosing Avignon over the ruins of Rome, the Holy See can either bind the French Crown into an enduring Franco-Papal Concordat or assert an independent Rhone-Provence hegemony over Western Europe."
 oe_pap.5.a:0 "Seal the Franco-Papal Concordat of Avignon"
 oe_pap.5.b:0 "Proclaim Sovereign Rhone-Provence Hegemony"
 oe_pap.6.title:0 "Proclamation of Regnum Dei: Kingdom of God on Earth"
 oe_pap.6.desc:0 "From the Alpine passes above Milan to the sunlit harbors of Naples, every bell tower in Italy rings in unison as the Supreme Pontiff proclaims the Kingdom of God on Earth. Wearing the imperial mantle without surrendering St. Peter's Keys, how shall we shape our newly consecrated Italian Empire?"
 oe_pap.6.a:0 "Consecrate Italy as the Militant Citadel of the Faith"
 oe_pap.6.b:0 "Charter the Prosperous Diocesan League of Unified Italy"
 oe_pap.7.title:0 "Investiture of a Cardinal Legation"
 oe_pap.7.desc:0 "Kneeling before the papal throne, our newly appointed Cardinal-Legate receives the scarlet biretta, silver crozier, and sealed parchment entrusting conquered borderlands to his loyal administration. Shall our Cardinal Legations prioritize fortified frontier garrisons or pastoral missions and civic commerce?"
 oe_pap.7.a:0 "Mandate Fortified Frontier Garrisons Across All Legations"
 oe_pap.7.b:0 "Mandate Pastoral Conversion and Civic Administration"
 oe_pap.8.title:0 "Imperium Sancti Petri: Pontifex Maximus et Augustus"
 oe_pap.8.desc:0 "Rome, Constantinople, Jerusalem, Alexandria, and Antioch all lie beneath the Crossed Keys. As the Supreme Pontiff proclaims the restored Holy Roman Empire of St. Peter, envoys from the German princes ask what place remains for the secular Holy Roman Emperor: shall we subordinate him as honored Advocatus Ecclesiae, or proclaim direct papal absorption of the Roman Imperial Crown?"
 oe_pap.8.a:0 "Subordinate the Emperor as Secular Advocate (Advocatus Ecclesiae)"
 oe_pap.8.b:0 "Direct Imperial Absorption — Pontifex Maximus et Augustus!"
 oe_pap.9.title:0 "Ecumenical Council of Rome & Constantinople"
 oe_pap.9.desc:0 "Latin cardinals and Greek metropolitans gather beneath frescoed vaults to confront the 1054 Great Schism. Before our sealed decrees reach the Golden Horn, the Supreme Pontiff must choose our opening mandate: extend an equal Twin-See Christian Union honoring Eastern liturgy, or demand unconditional submission to Latin Papal Primacy."
 oe_pap.9.a:0 "Propose an Equal Twin-See Christian Union with Constantinople"
 oe_pap.9.b:0 "Demand Unconditional Latin Papal Primacy over the East"
 oe_pap.10.title:0 "Papal Envoys at Hagia Sophia: Answer to the Ecumenical Council"
 oe_pap.10.desc:0 "Crimson-robed papal legates have laid the decrees of Rome's Ecumenical Council before the imperial throne in Constantinople. Bishops and senators alike debate the fate of Christendom: shall we ratify the Twin-See Christian Union to heal the 1054 Schism and unite East and West, or reject Roman terms in defense of ancestral Eastern autocephaly?"
 oe_pap.10.a:0 "Ratify the Twin-See Christian Union and Heal the 1054 Schism"
 oe_pap.10.b:0 "Reject Roman Terms and Uphold Eastern Autocephaly"
 oe_pap.11.title:0 "Rebuilding St. Peter's Basilica"
 oe_pap.11.desc:0 "The thousand-year-old timbers of Constantine's Old St. Peter's Basilica lean precariously above the Apostle's tomb. Master architects inspired by classical Rome propose raising the grandest marble dome in human history—a monument to dazzle pilgrims from every continent—while austere reformers prefer restoring the ancient nave and endowing Roman hospitals and charities."
 oe_pap.11.a:0 "Commission the Grand Renaissance Dome of St. Peter's"
 oe_pap.11.b:0 "Restore the Constantinian Nave and Endow Roman Charities"
 oe_pap.12.title:0 "Founding of the Pontifical Swiss Guard"
 oe_pap.12.desc:0 "Marching through the Porta del Popolo in gleaming breastplates with gleaming halberds shouldered, companies of Catholic Swiss infantry have arrived to swear eternal fidelity to the Supreme Pontiff. Shall we charter them permanently as our elite Pontifical Swiss Guard, or invest instead in a broader corps of native Italian guardsmen?"
 oe_pap.12.a:0 "Charter the Permanent Pontifical Swiss Guard"
 oe_pap.12.b:0 "Expand the Native Italian Papal Guard Corps"
 oe_pap.13.title:0 "Counter-Reformation: The Tridentine Bastion"
 oe_pap.13.desc:0 "Printing presses north of the Alps pour out rival creeds that shake kingdoms and bishoprics alike. Gathering theologians and reforming bishops, the Holy See launches a sweeping Catholic renewal: shall we anchor the Counter-Reformation in strict Tridentine seminaries and doctrinal orthodoxy, or send Jesuit scholars and papal nuncios to win back waverers across Europe and beyond?"
 oe_pap.13.a:0 "Enforce Strict Tridentine Seminaries and Orthodoxy"
 oe_pap.13.b:0 "Dispatch Jesuit Scholars and Diplomatic Nuncios"
 oe_pap.14.title:0 "Pan-Catholic Crusade Tribute"
 oe_pap.14.desc:0 "Answering our Universal Crusade Bull, wagonloads of silver florins and bands of cross-bearing volunteers stream into papal ports from Spain, France, Germany, Poland, and Hungary. The Apostolic Treasurer asks how to deploy this surge of Christian devotion."
 oe_pap.14.a:0 "Pour the Crusade Tribute into Field Armies and Siege Trains"
 oe_pap.14.b:0 "Fortify Catholic Diplomacy and Mediterranean Supply Lines"
 STATIC_MODIFIER_NAME_oe_pap_mod_law_transition:0 "Apostolic Constitution Promulgation"
 STATIC_MODIFIER_DESC_oe_pap_mod_law_transition:0 "Curial legates and diocesan bishops are implementing the new Papal statute across St. Peter's realms."
 STATIC_MODIFIER_NAME_oe_pap_mod_regnum_dei_permanent:0 "Crown of Regnum Dei"
 STATIC_MODIFIER_DESC_oe_pap_mod_regnum_dei_permanent:0 "Unifying Italy beneath the Crossed Keys consecrates the peninsula as the Kingdom of God on Earth, anchoring imperial authority, control, and fiscal vitality."
 STATIC_MODIFIER_NAME_oe_pap_mod_sanctum_imperium_permanent:0 "Pontifex Maximus et Augustus"
 STATIC_MODIFIER_DESC_oe_pap_mod_sanctum_imperium_permanent:0 "Holding all five Pentarchy Sees unites the apostolic tiara with the imperial purple of Rome, granting unmatched martial discipline, morale, and ecumenical authority."
 STATIC_MODIFIER_NAME_oe_pap_mod_legation_charter:0 "Chartered Papal Cardinal Legation"
 STATIC_MODIFIER_DESC_oe_pap_mod_legation_charter:0 "Newly established diocesan courts, papal garrisons, and tax registers stabilize this Cardinal Legation under Rome's wing."
 STATIC_MODIFIER_NAME_oe_pap_mod_legation_militant:0 "Militant Cardinal Legation"
 STATIC_MODIFIER_DESC_oe_pap_mod_legation_militant:0 "Armed by Papal mandate to hold frontier passes and reinforce the Holy See's field armies."
 STATIC_MODIFIER_NAME_oe_pap_mod_legation_pastoral:0 "Pastoral Cardinal Legation"
 STATIC_MODIFIER_DESC_oe_pap_mod_legation_pastoral:0 "Focused on Catholic conversion, civic rebuilding, and diocesan prosperity under Rome's oversight."
 STATIC_MODIFIER_NAME_oe_pap_mod_universal_crusade:0 "Universal Crusade Mobilization"
 STATIC_MODIFIER_DESC_oe_pap_mod_universal_crusade:0 "Armed pilgrims and crusade tenths from across Catholic Europe surge beneath the Crossed Keys."
 STATIC_MODIFIER_NAME_oe_pap_mod_return_preparations:0 "Preparations for the Return to Rome"
 STATIC_MODIFIER_DESC_oe_pap_mod_return_preparations:0 "Papal envoys and war treasurers methodically prepare the reconquest of central Italy and the return to St. Peter's tomb."
 STATIC_MODIFIER_NAME_oe_pap_mod_albornoz_campaign:0 "Albornoz Reconquest of Romagna"
 STATIC_MODIFIER_DESC_oe_pap_mod_albornoz_campaign:0 "Under Cardinal Gil de Albornoz's decisive leadership, Papal columns shatter rebellious vicars and seize brick fortresses across Romagna."
 STATIC_MODIFIER_NAME_oe_pap_mod_aegidian_code:0 "Constitutiones Aegidianae"
 STATIC_MODIFIER_DESC_oe_pap_mod_aegidian_code:0 "Cardinal Albornoz's celebrated legal code harmonizes papal rectors with municipal charters across central Italy."
 STATIC_MODIFIER_NAME_oe_pap_mod_roman_curators:0 "Restored Papal Curators of Rome"
 STATIC_MODIFIER_DESC_oe_pap_mod_roman_curators:0 "Decisive suppression of Capitoline factionalism reinforces direct papal control and military order over Lazio."
 STATIC_MODIFIER_NAME_oe_pap_mod_roman_commune:0 "Chartered Roman Civic Commune"
 STATIC_MODIFIER_DESC_oe_pap_mod_roman_commune:0 "Reconciling the Roman burghers through lawful municipal charters channels civic pride into prosperity and steady taxation."
 STATIC_MODIFIER_NAME_oe_pap_mod_eternal_city_restored:0 "Eternal City Restored"
 STATIC_MODIFIER_DESC_oe_pap_mod_eternal_city_restored:0 "With the Supreme Pontiff enthroned once more beside the Tiber, pilgrims, scholars, and tribute pour into Rome."
 STATIC_MODIFIER_NAME_oe_pap_mod_avignon_bridge:0 "Avignon-Rome Diplomatic Bridge"
 STATIC_MODIFIER_DESC_oe_pap_mod_avignon_bridge:0 "Retaining an active legatine court in Avignon preserves papal influence across France, Burgundy, and the western kingdoms."
 STATIC_MODIFIER_NAME_oe_pap_mod_gallic_concordat:0 "Franco-Papal Concordat of Avignon"
 STATIC_MODIFIER_DESC_oe_pap_mod_gallic_concordat:0 "Close partnership between the French Crown and the Avignon Curia multiplies diplomatic clout, trade wealth, and scholarly prestige."
 STATIC_MODIFIER_NAME_oe_pap_mod_rhone_curia:0 "Sovereign Rhone Curia"
 STATIC_MODIFIER_DESC_oe_pap_mod_rhone_curia:0 "Turning Avignon into an independent western fortress-capital strengthens papal discipline, fortification, and central control."
 STATIC_MODIFIER_NAME_oe_pap_mod_regnum_dei_zeal:0 "Militant Zeal of Regnum Dei"
 STATIC_MODIFIER_DESC_oe_pap_mod_regnum_dei_zeal:0 "Unified beneath St. Peter's banner, Italy's legions march with unbreakable discipline and crusade fervor."
 STATIC_MODIFIER_NAME_oe_pap_mod_italian_dioceses:0 "Italian Diocesan Commercial League"
 STATIC_MODIFIER_DESC_oe_pap_mod_italian_dioceses:0 "Harmonized customs across Milan, Florence, Rome, and Naples propel the Kingdom of God to unmatched commercial wealth."
 STATIC_MODIFIER_NAME_oe_pap_mod_advocatus_ecclesiae:0 "Advocatus Ecclesiae Concordat"
 STATIC_MODIFIER_DESC_oe_pap_mod_advocatus_ecclesiae:0 "Subordinating the secular imperial crown as sworn defender of the Roman Church elevates papal diplomacy and subject harmony across Europe."
 STATIC_MODIFIER_NAME_oe_pap_mod_pontifex_augustus:0 "Undivided Augustan Sovereignty"
 STATIC_MODIFIER_DESC_oe_pap_mod_pontifex_augustus:0 "Absorbing the secular Roman imperial mantle directly into St. Peter's Throne sharpens imperial warfare and centralized command."
 STATIC_MODIFIER_NAME_oe_pap_mod_ecumenical_union:0 "Ecumenical Union of Rome & Constantinople"
 STATIC_MODIFIER_DESC_oe_pap_mod_ecumenical_union:0 "Healing the 1054 Great Schism unites Latin and Greek Christendom in shared theology, diplomacy, and mutual defense."
 STATIC_MODIFIER_NAME_oe_pap_mod_eastern_defiance:0 "Autocephalous Eastern Resolve"
 STATIC_MODIFIER_DESC_oe_pap_mod_eastern_defiance:0 "Rejecting Latin primacy hardens Constantinople's resolve behind ancestral Orthodox liturgy and fortress walls."
 STATIC_MODIFIER_NAME_oe_pap_mod_crusade_resolve:0 "Uncompromising Roman Primacy"
 STATIC_MODIFIER_DESC_oe_pap_mod_crusade_resolve:0 "Rebuffed in Constantinople, the Roman Curia steels its armies and preachers to enforce papal authority by sword and mission."
 STATIC_MODIFIER_NAME_oe_pap_mod_st_peters_basilica_loc:0 "Grand Basilica of St. Peter"
 STATIC_MODIFIER_DESC_oe_pap_mod_st_peters_basilica_loc:0 "The soaring Renaissance dome above St. Peter's tomb crowns Rome as the architectural wonder of Christendom."
 STATIC_MODIFIER_NAME_oe_pap_mod_roman_charities:0 "Papal Hospitals & Roman Charities"
 STATIC_MODIFIER_DESC_oe_pap_mod_roman_charities:0 "Generous ecclesiastical endowments care for pilgrims and Roman citizens alike, strengthening population growth and social harmony."
 STATIC_MODIFIER_NAME_oe_pap_mod_swiss_guard:0 "Pontifical Swiss Guard"
 STATIC_MODIFIER_DESC_oe_pap_mod_swiss_guard:0 "Disciplined Alpine halberdiers and pikemen serve as the unshakable steel core of the Papal armies."
 STATIC_MODIFIER_NAME_oe_pap_mod_italian_guard:0 "Italian Papal Guard & Condottieri"
 STATIC_MODIFIER_DESC_oe_pap_mod_italian_guard:0 "Well-paid Italian captains and native civic regiments provide agile, cost-effective defense across the peninsula."
 STATIC_MODIFIER_NAME_oe_pap_mod_tridentine_bastion:0 "Tridentine Counter-Reformation Bastion"
 STATIC_MODIFIER_DESC_oe_pap_mod_tridentine_bastion:0 "Standardized seminaries, catechisms, and episcopal discipline fortify Catholic lands against Protestant heresy."
 STATIC_MODIFIER_NAME_oe_pap_mod_jesuit_missions:0 "Jesuit Scholars & Nuncio Network"
 STATIC_MODIFIER_DESC_oe_pap_mod_jesuit_missions:0 "Learned Jesuit colleges and agile papal nuncios advance Catholic scholarship, research, and diplomatic reach."
 STATIC_MODIFIER_NAME_oe_pap_mod_crusade_warchest:0 "Pan-Catholic Crusade War Chest"
 STATIC_MODIFIER_DESC_oe_pap_mod_crusade_warchest:0 "Fresh silver florins and volunteer banners supercharge Papal field armies and siege operations."
 STATIC_MODIFIER_NAME_oe_pap_mod_crusade_diplomacy:0 "Mediterranean Crusade Supply League"
 STATIC_MODIFIER_DESC_oe_pap_mod_crusade_diplomacy:0 "Coordinated Catholic ports and papal diplomacy sustain long-range expeditions and maritime wealth."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_albornoz:0 "Legacy of Cardinal Albornoz"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_albornoz:0 "Restored Romagnol fortresses and loyal vicars anchor Papal rule from Ravenna to Bologna."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_schism_healed:0 "Western Schism Ended"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_schism_healed:0 "One undivided Pontiff commands the reverence of every Catholic court across Europe."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_italian_unity:0 "Italian Peninsula United"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_italian_unity:0 "Ending centuries of Italian strife unleashes the peninsula's united tax, trade, and manpower potential."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_regnum_dei:0 "Triumph of Regnum Dei"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_regnum_dei:0 "The consecrated Kingdom of God shines over Italy with unshakable stability and apostolic prestige."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_legation_network:0 "Network of Cardinal Legations"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_legation_network:0 "Loyal Cardinal-Legates govern outer realms in seamless harmony with the Roman Curia."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_outremer_see:0 "Holy Sees of Outremer Restored"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_outremer_see:0 "Liberating Jerusalem and Antioch kindles crusader morale and missionary fervor across Christendom."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_alexandria_see:0 "See of St. Mark Reclaimed"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_alexandria_see:0 "Alexandria's granaries and spice quays enrich the Papal treasury and Mediterranean fleets."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_sanctum_imperium:0 "Glory of Imperium Sancti Petri"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_sanctum_imperium:0 "From the Tiber to the Bosphorus and Nile, the Holy Roman Empire of St. Peter commands the Mediterranean world."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_renaissance_see:0 "Patronage of the High Renaissance"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_renaissance_see:0 "Papal academies and ateliers lead Europe in art, architecture, and humanist scholarship."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_tridentine_bulwark:0 "Bulwark of the Tridentine Faith"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_tridentine_bulwark:0 "Disciplined Catholic renewal secures doctrinal unity and steadfast religious loyalty."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_ecumenical_crown:0 "Crown of Ecumenical Reconciliation"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_ecumenical_crown:0 "Reuniting Eastern and Western Christendom crowns the Papacy with supreme moral prestige."
 STATIC_MODIFIER_NAME_oe_pap_mod_msn_eternal_see:0 "Urbi et Orbi: Eternal Universal See"
 STATIC_MODIFIER_DESC_oe_pap_mod_msn_eternal_see:0 "Supreme spiritual fatherhood and restored Roman empire unite in a golden age stretching from Rome to the ends of the earth."
