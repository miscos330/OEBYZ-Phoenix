 STATIC_MODIFIER_NAME_oe_inst_reg2_dieci_legacy_mod: "Legacy of the Council of Ten"
 STATIC_MODIFIER_DESC_oe_inst_reg2_dieci_legacy_mod: "Having steered the lagoon safely through crisis, the Council of Ten restores ordinary rule with sharpened administration."
 STATIC_MODIFIER_NAME_oe_inst_reg2_curtain_legacy_mod: "Orderly Withdrawal of the Curtain"
 STATIC_MODIFIER_DESC_oe_inst_reg2_curtain_legacy_mod: "The Empress Dowager withdraws behind the curtain in smooth ceremony, handing a loyal realm and secure mandate to the sovereign."
 STATIC_MODIFIER_NAME_oe_inst_reg2_guming_legacy_mod: "Legacy of the Regents' Statutes"
 STATIC_MODIFIER_DESC_oe_inst_reg2_guming_legacy_mod: "Administrative statutes drafted by the imperial regents endure after the minority, streamlining legislation and cabinet business."
 STATIC_MODIFIER_NAME_oe_inst_reg2_tairo_legacy_mod: "Legacy of the Tairo Regency"
 STATIC_MODIFIER_DESC_oe_inst_reg2_tairo_legacy_mod: "Even after the Tairo steps aside, the bakufu retains heightened samurai honor and disciplined daimyo allegiance."
 STATIC_MODIFIER_NAME_oe_inst_reg2_valide_legacy_mod: "Legacy of the Valide Sultan's Statecraft"
 STATIC_MODIFIER_DESC_oe_inst_reg2_valide_legacy_mod: "The diplomatic channels and administrative order built by the Valide Sultan continue serving the mature Sultan."
 STATIC_MODIFIER_NAME_oe_inst_reg2_interrex_legacy_mod: "Legacy of the Primate Interrex"
 STATIC_MODIFIER_DESC_oe_inst_reg2_interrex_legacy_mod: "Following the royal coronation officiated by the Interrex, the kingdom enjoys sustained ecclesiastical favor and diplomatic standing."
 STATIC_MODIFIER_NAME_oe_inst_reg2_atabeg_legacy_mod: "Legacy of the Atabeg's Cavalry"
 STATIC_MODIFIER_DESC_oe_inst_reg2_atabeg_legacy_mod: "Heavy cavalry drills and martial discipline instilled under the Atabeg regent continue inspiring the royal army."
 STATIC_MODIFIER_NAME_oe_inst_reg2_synkletos_legacy_mod: "Legacy of the Patriarchal Synkletos"
 STATIC_MODIFIER_DESC_oe_inst_reg2_synkletos_legacy_mod: "Unity forged under the joint stewardship of Patriarch and elders leaves lasting ecclesiastical prestige and border resilience."
 STATIC_MODIFIER_NAME_oe_inst_shinto_yoshida_shrine_charter_mod: "Yoshida Saijosho Shrine Charter"
 STATIC_MODIFIER_DESC_oe_inst_shinto_yoshida_shrine_charter_mod: "Reaffirms Yuiitsu ritual charters at Mount Yoshida's Saijosho sanctuary, bolstering priestly coherence and purity."
 STATIC_MODIFIER_NAME_oe_inst_shinto_ryobu_mandala_accord_mod: "Dual-Mandala Temple-Shrine Accord"
 STATIC_MODIFIER_DESC_oe_inst_shinto_ryobu_mandala_accord_mod: "Monastic houses and Shinto shrines seal a dual-mandala accord, enriching syncretic arts and sectarian harmony."
 oe_inst.1.t: "The Council of Ten Assumes Emergency Stewardship"
 oe_inst.1.d: "With the ducal throne suddenly vacant and rumors racing along the Grand Canal, the Great Council empowers the Council of Ten to secure state archives, guard the Arsenal, and preserve republican law until a lawful election concludes."
 oe_inst.1.a: "Empower the Ten to Audit Chancellery & Arsenals"
 oe_inst.1.a.tt: "Fortifies republican tradition and extends the Council of Ten's administrative discipline."
 oe_inst.1.b: "Reassure the Patrician Merchants & Guilds"
 oe_inst.1.b.tt: "Lifts burgher estate satisfaction and steadies civic stability."
 oe_inst.2.t: "The Empress Dowager Presides Behind the Curtain"
 oe_inst.2.d: "As the young sovereign ascends the throne, a silken screen is drawn before the dais. Preserving ancestral propriety, the Empress Dowager receives grand councilors and tributary envoys to steady the court until the ruler comes of age."
 oe_inst.2.a: "Anchor Dynastic Legitimacy Through Court Propriety"
 oe_inst.2.a.tt: "Raises legitimacy and establishes orderly court authority."
 oe_inst.2.b: "Share Counsel With Senior Ministers & Nobles"
 oe_inst.2.b.tt: "Improves noble satisfaction and reinforces domestic stability."
 oe_inst.3.t: "Testament of the Throne: Council of Imperial Regents"
 oe_inst.3.d: "With no dowager consort to preside over the minority, the late monarch's testament summons veteran ministers into a collective regency council. Together they seal administrative ordinances to keep treasury, law, and frontiers intact."
 oe_inst.3.a: "Codify Collective Regency Statutes"
 oe_inst.3.a.tt: "Enacts formal regency statutes boosting legislative and cabinet efficiency."
 oe_inst.3.b: "Grant Ceremonial Honors to Court Nobles"
 oe_inst.3.b.tt: "Reassures noble houses while sustaining prestige and legitimacy."
 oe_inst.4.t: "Appointment of the Shogunal Tairo Regent"
 oe_inst.4.d: "With the young shogun still in minority and provincial lords watching closely, the bakufu council elevates a seasoned hereditary elder as Tairo to command the citadel, oversee daimyo oaths, and uphold martial order."
 oe_inst.4.a: "Enforce Buke Shohatto Discipline Across Domains"
 oe_inst.4.a.tt: "Raises prestige and reinforces vassal allegiance under Tairo stewardship."
 oe_inst.4.b: "Consult Hereditary Retainers in Grand Council"
 oe_inst.4.b.tt: "Increases noble satisfaction and steadies domestic order."
 oe_inst.5.t: "The Valide Sultan Guides the Imperial Divan"
 oe_inst.5.d: "With fratricidal succession abolished, the Valide Sultan steps into formal stewardship alongside the Grand Vizier and Divan, balancing foreign embassies and provincial fiscal registers until the young Sultan assumes full command."
 oe_inst.5.a: "Direct Imperial Embassies & Divan Registers"
 oe_inst.5.a.tt: "Raises legitimacy and boosts diplomatic standing and cabinet order."
 oe_inst.5.b: "Endow Imperial Waqf Charities for Ulema & Subjects"
 oe_inst.5.b.tt: "Improves clerical satisfaction and reinforces stability."
 oe_inst.6.t: "The Archbishop Primate Assumes Office as Interrex"
 oe_inst.6.d: "In accordance with constitutional custom, the Archbishop Primate assumes the mantle of Interrex, wielding the royal seal to convene the Diet, receive foreign ambassadors, and safeguard concord between church and nobility."
 oe_inst.6.a: "Leverage the Primate's Standing Abroad & in Rome"
 oe_inst.6.a.tt: "Grants religious influence and reinforces diplomatic prestige."
 oe_inst.6.b: "Reaffirm Ecclesiastical & Diet Liberties"
 oe_inst.6.b.tt: "Boosts clergy satisfaction and domestic stability."
 oe_inst.7.t: "An Atabeg Warlord Takes Guardianship of the Throne"
 oe_inst.7.d: "Amid restless frontiers across Iran and Mesopotamia, a veteran Atabeg commander assumes guardianship of the young prince, drilling heavy horsemen and projecting iron deterrence while the sovereign matures."
 oe_inst.7.a: "Muster Royal Heavy Cavalry Under the Atabeg"
 oe_inst.7.a.tt: "Adds army tradition and reinforces heavy cavalry readiness."
 oe_inst.7.b: "Feast Provincial Emirs to Secure Loyalty"
 oe_inst.7.b.tt: "Lifts noble satisfaction and steadies the realm."
 oe_inst.8.t: "Patriarch and Synkletos Convene a Joint Regency"
 oe_inst.8.d: "As cathedral bells summon the realm's elders, the Patriarch and aristocratic council swear a joint oath of stewardship before the icons, binding ecclesiastical authority and civic defense around the young heir."
 oe_inst.8.a: "Rally Faith & Fortresses Behind the Joint Regency"
 oe_inst.8.a.tt: "Grants religious influence and bolsters ecclesiastical prestige and defense."
 oe_inst.8.b: "Reconcile Monasteries & Landed Lords"
 oe_inst.8.b.tt: "Improves clergy satisfaction and domestic stability."
 oe_inst.9.t: "Proclamation of Yuiitsu Shinto at Mount Yoshida"
 oe_inst.9.d: "Within the octagonal Taigengu sanctuary atop Mount Yoshida, Yuiitsu scholars proclaim the primacy of native kami over continental teachings. Shrines across the provinces look to the new liturgical standard with renewed resolve."
 oe_inst.9.a: "Confirm the Saijosho Shrine Charter"
 oe_inst.9.a.tt: "Adds spiritual purity and grants the five-year Yoshida Saijosho Shrine Charter."
 oe_inst.9.b: "Celebrate the Doctrine With Court Pageantry"
 oe_inst.9.b.tt: "Grants prestige and boosts clergy estate satisfaction."
 oe_inst.10.t: "Grand Convocation of Dual-Mandala Syncretism"
 oe_inst.10.d: "Beneath twin banners of the Diamond and Womb Mandalas, Shingon abbots and shrine priests chant in unison. Reaffirming Honji Suijaku harmony quiets sectarian friction and draws temples and shrines into shared patronage."
 oe_inst.10.a: "Seal the Dual-Mandala Temple-Shrine Accord"
 oe_inst.10.a.tt: "Adds stability and grants the five-year Dual-Mandala Temple-Shrine Accord."
 oe_inst.10.b: "Honor Temple Abbots & Shrine Custodians"
 oe_inst.10.b.tt: "Increases clergy satisfaction and grants prestige."
