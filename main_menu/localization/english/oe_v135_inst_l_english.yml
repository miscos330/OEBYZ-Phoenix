# NEW 2026-11-22 v13.5 Worker 3: Unit Abilities, Eurasian Town Rights, Regencies & Shinto Factions. Generated by gen_v135_institutions.py; edit the generator, not this file.
 oe_ua_greek_fire_siphon: "Greek Fire Siphon Assault"
 oe_ua_greek_fire_siphon_desc: "Arms the fleet's dromon galleys with pressurized bronze siphons and naphtha incendiary pots, trading heavy fuel upkeep for devastating littoral firepower and blockade reach."
 oe_ua_wagenburg_tabor: "Wagenburg Tabor Encampment"
 oe_ua_wagenburg_tabor_desc: "Chains armored supply wagons into an interlocking mobile fort in the Bohemian Wagenburg and Cossack Tabor tradition, sacrificing march speed for stern discipline, rapid morale recovery, and lower camp attrition."
 oe_ua_geobukseon_ram: "Geobukseon Ironclad Ramming"
 oe_ua_geobukseon_ram_desc: "Deploys spiked turtle-ship vanguard squadrons alongside panokseon warships, accepting heavier draft and upkeep for formidable coastal shock power and opening salvo initiative."
 oe_ua_eight_banner_charge: "Banner Heavy Cavalry Charge"
 oe_ua_eight_banner_charge_desc: "Drives armored bannermen straight through the enemy center while light horsemen sweep the flanks, trading heightened forage attrition and upkeep for crushing cavalry impact and combat tempo."
 oe_ua_sandan_uchi_volley: "Sandan-uchi Rotating Volley"
 oe_ua_sandan_uchi_volley_desc: "Organizes matchlock ashigaru into three rotating firing ranks behind wooden palisades, consuming heavy powder reserves and slowing marches to sustain relentless volley fire and steady discipline."
 oe_ua_furusiyya_lance_drill: "Furusiyya Lance & Horsemanship Drill"
 oe_ua_furusiyya_lance_drill_desc: "Drills troops on the hippodrome in classical Furusiyya lancework, mounted archery, and tactical maneuvers; full upkeep and lowered drill morale are offset by rapid experience gain and cavalry initiative."
 oe_ua_lagimci_sapper_assault: "Lagimci Sapper Siegeworks"
 oe_ua_lagimci_sapper_assault_desc: "Commits dedicated mining sappers to tunnel beneath enemy ramparts alongside heavy siege batteries, accepting steeper siege attrition and upkeep for accelerated breaches and assault power."
 oe_ua_galeazza_broadside: "Galeazza Heavy Broadside Line"
 oe_ua_galeazza_broadside_desc: "Positions towering Venetian-style armed galleasses ahead of the battle line as floating artillery bastions, trading fleet speed and upkeep for punishing heavy-ship and galley broadsides."
 oe_tr_samarkand_caravanserai: "Transoxiana Silk Caravanserai Charter"
 oe_tr_samarkand_caravanserai_desc: "Grants imperial caravanserai privileges to Samarkand or Bukhara, shielding transcontinental silk caravans from duplicate transit tolls and anchoring Transoxian trade."
 oe_tr_kashgar_oasis_entrepot: "Tarim Oasis Entrepot Charter"
 oe_tr_kashgar_oasis_entrepot_desc: "Confers protected entrepot and karez water-right privileges upon Kashgar and the Tarim or Hexi oasis towns, drawing caravan merchants and sustaining overland trade volume."
 oe_tr_persian_grand_bazaar: "Royal Persian Grand Bazaar Charter"
 oe_tr_persian_grand_bazaar_desc: "Establishes a royal vaulted bazaar and guild directorate in Tabriz, Isfahan, or Herat, concentrating fine textile and dye workshops under chartered burgher governance."
 oe_tr_novgorod_fur_guild: "Northern Fur & Wax Guild Charter"
 oe_tr_novgorod_fur_guild_desc: "Follows the Ivan Hundred merchant guild tradition across Novgorod, Moscow, or Astrakhan, chartering riverine fur and beeswax staples that accelerate urban development."
 oe_tr_jiangnan_silk_shizhen: "Jiangnan Silk Shizhen Charter"
 oe_tr_jiangnan_silk_shizhen_desc: "Charters the specialized silk-weaving market towns of Suzhou (Wuxian), Hangzhou, or Nanjing (Shangyuan), safeguarding guild looms and elevating Jiangnan silk and fine cloth production."
 oe_tr_fuliang_imperial_kiln: "Fuliang Imperial Kiln Charter"
 oe_tr_fuliang_imperial_kiln_desc: "Institutes the official kiln-and-private-firing charter at Fuliang (Jingdezhen), uniting master potters and kaolin clay supply to make the porcelain capital unmatched in output and renown."
 oe_tr_shibosi_maritime_ward: "Shibosi Maritime Customs Ward Charter"
 oe_tr_shibosi_maritime_ward_desc: "Establishes a regulated Shibosi maritime customs office and foreign merchants' quarter in Quanzhou (Jinjiang), Guangzhou, Fuzhou (Minxian), Ningbo (Yinxian), or Xiangshan, expanding port capacity and tea trade."
 oe_tr_sakai_egoshu_council: "Sakai Egoshu Free Port Charter"
 oe_tr_sakai_egoshu_council_desc: "Recognizes the moated merchant council (Egoshu) of Sakai (Izumi), Hakata, or Nagasaki (Nishisonogi), granting civic autonomy in return for prolific firearms smithies, deep harbor capacity, and sturdy defenses."
 oe_tr_venetian_fondaco: "Venetian Fondaco & Murano Charter"
 oe_tr_venetian_fondaco_desc: "Codifies the Fondaco dei Tedeschi exchange and Murano glassmaker statutes in Venice, channeling trans-Alpine bullion into Levantine shipping and fine crystal output."
 oe_tr_hanseatic_staple_kontor: "Hanseatic Staple & Kontor Charter"
 oe_tr_hanseatic_staple_kontor_desc: "Affirms Hanseatic staple law and kontor warehousing privileges in Lubeck or Gdansk, boosting Baltic naval supplies, market stalls, and burgher commercial influence."
 oe_tr_lowlands_bourse_charter: "Lowlands Bourse & Cartography Charter"
 oe_tr_lowlands_bourse_charter_desc: "Grants open-exchange and printing-house charters to Amsterdam or Antwerp, turning the Lowlands entrepot into a magnet for capital, cartographic publishing, and rapid institutional growth."
 oe_tr_pontic_aegean_entrepot: "Pontic-Aegean Entrepot Charter"
 oe_tr_pontic_aegean_entrepot_desc: "Establishes harmonized transit-port privileges at Kaffa, Thessaloniki, or Alexandria, linking Black Sea grain, Aegean shipping, and Alexandrian spice brokerage."
 oe_tr_calicut_monsoon_emporium: "Malabar Monsoon Spice Emporium Charter"
 oe_tr_calicut_monsoon_emporium_desc: "Guarantees open monsoon-season trade to Arab, Gujarati, Malay, and European merchants in Calicut (Kozhikode) or Goa, expanding Malabar pepper harvests and harbor brokerage."
 oe_tr_malacca_shahbandar_port: "Malacca Shahbandar Entrepot Charter"
 oe_tr_malacca_shahbandar_port_desc: "Appoints four communal port-captains (Shahbandars) under the Maritime Laws of Malacca, orchestrating cross-monsoon spice warehousing and straits maritime dominance."
 oe_tr_hormuz_aden_strait_port: "Hormuz-Aden Strait Emporium Charter"
 oe_tr_hormuz_aden_strait_port_desc: "Combines customs-house bonding with fortified island-strait anchorages in Hormuz or Aden, elevating Gulf pearl-and-jewelry crafts alongside Red Sea maritime control."
 oe_tr_swahili_aztec_lake_charter: "Kilwa Gold Market & Chinampa Causeway Charter"
 oe_tr_swahili_aztec_lake_charter_desc: "Charters the coral-stone gold markets of Kilwa Kisiwani or the chinampa causeway markets of Tenochtitlan, pairing heightened civic control with sustained urban prosperity and development."
 oe_reg2_venetian_dieci_regency: "Council of Ten Emergency Regency"
 oe_reg2_venetian_dieci_regency_desc: "When the Doge's seat falls vacant or crisis strikes, the Venetian Council of Ten assumes emergency stewardship, safeguarding republican institutions, civic order, and lagoon defenses."
 oe_reg2_curtain_dowager_regency: "Empress Dowager Behind the Curtain"
 oe_reg2_curtain_dowager_regency_desc: "During a sovereign's minority, the Empress Dowager presides behind the ceremonial curtain, anchoring dynastic legitimacy, cabinet order, and vassal allegiance until the ruler's majority."
 oe_reg2_guming_council_regency: "Council of Imperial Regents"
 oe_reg2_guming_council_regency_desc: "Entrusted by the late monarch's testament, a council of senior imperial regents governs collectively through edict and deliberation, preserving administrative momentum despite muted royal authority."
 oe_reg2_shogun_tairo_regency: "Shogunal Tairo Regency"
 oe_reg2_shogun_tairo_regency_desc: "When the Shogunate faces a minority, a senior hereditary Tairo presides over the bakufu council, upholding martial honor, fortress readiness, and daimyo obedience."
 oe_reg2_ottoman_valide_regency: "Valide Sultan Regency"
 oe_reg2_ottoman_valide_regency_desc: "With fratricidal succession set aside, the Valide Sultan governs alongside the Imperial Divan, pairing deft diplomacy with steady palace stewardship during the Sultan's minority."
 oe_reg2_polish_interrex_regency: "Primate Interrex Regency"
 oe_reg2_polish_interrex_regency_desc: "During an interregnum or royal minority, the Archbishop Primate steps forward as Interrex, moderating the Diet, upholding Catholic clerical concord, and representing the realm abroad."
 oe_reg2_persian_atabeg_regency: "Atabeg Military Regency"
 oe_reg2_persian_atabeg_regency_desc: "A seasoned Atabeg guardian assumes military tutelage and regency over the young prince, sharpening heavy cavalry traditions at the cost of emboldened noble commanders."
 oe_reg2_balkan_patriarch_synkletos_regency: "Patriarchal & Synkletos Regency"
 oe_reg2_balkan_patriarch_synkletos_regency_desc: "The Patriarch and council of elders govern jointly during the minority, drawing upon ecclesiastical authority and civic law to steady administration and fortify the realm."
 oe_shinto_yoshida: "Yoshida Shinto (Yuiitsu Shinto)"
 oe_shinto_yoshida_desc: "Founded by Yoshida Kanetomo in Kyoto, Yuiitsu Shinto inverts syncretism by proclaiming kami as root, Confucianism as branch, and Buddhism as fruit, consolidating shrine licensing under Yoshida authority."
 oe_shinto_watarai: "Watarai Shinto (Ise Outer Shrine)"
 oe_shinto_watarai_desc: "Preserved by the Watarai priestly lineage of the Ise Outer Shrine, this school teaches inner purity and uprightness from the Five Books of Shinto alongside Toyouke-Omikami's agrarian blessings."
 oe_shinto_suika: "Suika Shinto (Neo-Confucian Shinto)"
 oe_shinto_suika_desc: "Synthesized by Yamazaki Ansai from Neo-Confucian metaphysics and Shinto reverence, Suika Shinto cultivates samurai ethical discipline, sovereign loyalty, and scholarly domain academies."
 oe_shinto_ryobu: "Ryobu Shinto (Dual-Mandala Syncretism)"
 oe_shinto_ryobu_desc: "Interprets the Ise shrines through Shingon Buddhism's Diamond and Womb Mandalas under the Honji Suijaku doctrine, harmonizing kami worship with major monastic temples and their trade networks."
 oe_act_yoshida_shrine_license: "Issue Yoshida Shrine Rank Licenses"
 oe_act_yoshida_shrine_license_desc: "Authorizes Yoshida shrine-rank patents and priestly vestments across the provinces, aligning ritual hierarchy with imperial cabinet efficiency and dynastic legitimacy."
 oe_act_yoshida_root_doctrine: "Proclaim Kami-as-Root Doctrine"
 oe_act_yoshida_root_doctrine_desc: "Elevates Yoshida Yuiitsu theology declaring kami as the root of all teachings (mutually exclusive with Ryobu Honji Suijaku), deepening spiritual purity and cultural tradition."
 oe_act_yoshida_court_ritual: "Preside Over Imperial Daijosai Rites"
 oe_act_yoshida_court_ritual_desc: "Commissions Yoshida ritualists to conduct solemn Daijosai and pacification rites, immediately elevating prestige and purity while sustaining court honor for years to come."
 oe_act_watarai_inner_purity: "Uphold Five Books Inner Purity"
 oe_act_watarai_inner_purity_desc: "Promotes the Watarai ethos of inner purity and uprightness from the Five Books of Shinto, steadily cultivating spiritual purity and civic stability across the realm."
 oe_act_watarai_harvest_blessing: "Ise Toyouke Harvest & Works Blessing"
 oe_act_watarai_harvest_blessing_desc: "Celebrates Toyouke-Omikami at the Ise Outer Shrine with realm-wide harvest talismans, lifting peasant satisfaction and streamlining public building works."
 oe_act_suika_samurai_ethics: "Suika Samurai Ethics Lectures"
 oe_act_suika_samurai_ethics_desc: "Dispatches Suika scholars to lecture samurai garrisons on reverence and righteous duty, reinforcing battlefield discipline, martial honor, and monthly literacy growth."
 oe_act_suika_imperial_loyalty: "Declare Great Duty of Sovereign Loyalty"
 oe_act_suika_imperial_loyalty_desc: "Proclaims the Suika doctrine of unwavering fidelity to rightful sovereignty, fortifying royal legitimacy and cementing subject loyalty across vassal domains."
 oe_act_suika_academy_grant: "Endow Suika Domain Academies"
 oe_act_suika_academy_grant_desc: "Endows domain academies teaching classical scholarship alongside Shinto scripture, accelerating research progress and raising the national literacy ceiling."
 oe_act_ryobu_honji_suijaku: "Affirm Honji Suijaku Syncretism"
 oe_act_ryobu_honji_suijaku_desc: "Affirms Ryobu Shinto's Honji Suijaku unity of Buddhas and kami (mutually exclusive with Yoshida root doctrine), expanding tolerance of kindred faiths and clergy satisfaction."
 oe_act_ryobu_monastic_patronage: "Patronize Dual-Mandala Monasteries"
 oe_act_ryobu_monastic_patronage_desc: "Grants stipends and market charters to Shingon dual-mandala monasteries and their temple-town fairs, invigorating trade center power while easing war exhaustion."
 oe_price_shinto_low: "Modest Shinto Ritual Offering"
 oe_price_shinto_medium: "Standard Shinto Shrine Offering"
 oe_price_shinto_high: "Grand Shinto Ritual Offering"
 oe_price_shinto_doctrine: "Shinto Doctrinal Proclamation Offering"
