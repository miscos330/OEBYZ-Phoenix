 oe_glh_ulus: "Ulus of Jochi"
 oe_glh_ulus_desc: "A steppe wing or tumen under the Golden Horde. While Sarai stands strong, it shares the khan's map color and name, pays tribute, and cannot be casually annexed. When cohesion stays high it rides to the khan's wars; when turmoil strikes it grows defiant and may break away into an independent khanate."
