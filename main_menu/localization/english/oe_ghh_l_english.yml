 oe_ghh_ulus_join_def_tt: "Golden Horde Ulus Cohesion is at least #Y 30#!"
 STATIC_MODIFIER_NAME_oe_ghh_ulus_loyal: "Majesty of Sarai"
 STATIC_MODIFIER_DESC_oe_ghh_ulus_loyal: "The authority of Sarai stands firm, and the begs and princes of the wings keep the covenant of the kurultai."
 STATIC_MODIFIER_NAME_oe_ghh_ulus_restless: "Restless Ulus"
 STATIC_MODIFIER_DESC_oe_ghh_ulus_restless: "Sarai's prestige has waned; local emirs withhold tribute and grow slow to answer the khan's summons."
 STATIC_MODIFIER_NAME_oe_ghh_ulus_defiant: "Defiant Ulus"
 STATIC_MODIFIER_DESC_oe_ghh_ulus_defiant: "The wing raises its own host and treats Sarai as a hollow name, waiting only for the moment to proclaim independence."
 STATIC_MODIFIER_NAME_oe_ghh_glh_troubles: "The Great Troubles"
 STATIC_MODIFIER_DESC_oe_ghh_glh_troubles: "Succession strife and overmighty emirs shake the throne of Sarai, draining tribute and loosening control over the wings."
 STATIC_MODIFIER_NAME_oe_ghh_glh_shattered: "Ashes of Sarai"
 STATIC_MODIFIER_DESC_oe_ghh_glh_shattered: "With the lower Volga and Sarai shattered, the unified authority of the Ulus of Jochi can no longer hold the steppe together."
 STATIC_MODIFIER_NAME_oe_ghh_yassa_reform: "Yassa-Sharia Centralization"
 STATIC_MODIFIER_DESC_oe_ghh_yassa_reform: "Sarai has codified tribute and military service under Yassa and Sharia alike, checking the power of rival begs."
 STATIC_MODIFIER_NAME_oe_ghh_jochid_revival: "The Jochid Revival"
 STATIC_MODIFIER_DESC_oe_ghh_jochid_revival: "Having broken the separatist begs and rebuilt Sarai's authority, the khan rules a reunited Ulus of Jochi from the Crimea to Siberia."
 oe_ghh_b_ulus_breakaway: "Broke away from the throne of Sarai"
 oe_ghh_b_ulus_raid: "Border raids between the wings"
 oe_ghh_b_ulus_appeased: "Appeased by Sarai's gifts"
 oe_ghh_b_ulus_purged: "Purged rival begs of the wings"
 oe_ghh_dec_kurultai_gifts.title: "Summon a Kurultai of the Five Wings"
 oe_ghh_dec_kurultai_gifts.desc: "Gather the begs of the Jochid wings at Sarai with rich gifts to renew the old covenant, raising Ulus Cohesion by #G +12#! once every #Y 5#! years."
 oe_ghh_dec_kurultai_gifts.a: "Reward the wings in Sarai's name"
 oe_ghh_dec_yassa_reform.title: "Enact the Yassa-Sharia Centralization Code"
 oe_ghh_dec_yassa_reform.desc: "Codify tribute and levy duties across the steppe under both Yassa and Sharia, restoring the cohesion ceiling to #Y 100#! and advancing Stage 1 of the Jochid Revival."
 oe_ghh_dec_yassa_reform.a: "Proclaim the code across the steppe"
 oe_ghh_dec_purge_begs.title: "Purge Rival Begs and Subordinate the Wings"
 oe_ghh_dec_purge_begs.desc: "Strike down overmighty emirs while Sarai's authority stands high, converting all remaining Jochid Ulus wings into standard annexable vassals."
 oe_ghh_dec_purge_begs.a: "Bring the begs to heel"
 oe_ghh_dec_jochid_revival.title: "Restore the Ulus of Jochi"
 oe_ghh_dec_jochid_revival.desc: "With Sarai and Astrakhan secure and the separatist begs broken, seal the restoration of the Ulus of Jochi and lock out fragmentation for good."
 oe_ghh_dec_jochid_revival.a: "Proclaim the Jochid Revival"
 oe_ghh.1.t: "The Five Wings of Jochi"
 oe_ghh.1.d: "#F In 1337, under Özbeg Khan, the Ulus of Jochi stands at its zenith. Sarai holds the lower Volga, the Don, and the steppe heartland directly, shielded on its flanks by five great wings: the Left Wing of Orda, the Ulus of Shiban, Khwarazm, Bulgar-Kazan, and the Crimean Tumen.#!\n\nWhile Sarai's cohesion remains strong (currently #Y 85#!), the five wings ride to war under one banner. Guard against succession crises and external blows, or enact the centralization decisions to bring the begs to heel and restore a unified Jochid empire."
 oe_ghh.1.a: "Sarai's word shall bind all five wings"
 oe_ghh.1.a.tt: "Prestige #G +5#!; begin managing the Ulus of Jochi"
 oe_ghh.2.t: "Plague on the Steppe"
 oe_ghh.2.d: "#F Pestilence sweeps along the steppe caravan roads to the Volga and the Black Sea shore, emptying markets and grazing camps alike.#!\n\nTribute and trade revenues are faltering. Will Sarai spend from the treasury to steady the caravan stations, or endure the storm as best it can?"
 oe_ghh.2.a: "Open the treasury to relieve camps and caravanserais"
 oe_ghh.2.a.tt: "Costs #R 80#! gold; Ulus Cohesion #R −8#!"
 oe_ghh.2.b: "Guard the treasury and leave each wing to endure"
 oe_ghh.2.b.tt: "Ulus Cohesion #R −18#!; Stability #R −2.5#!"
 oe_ghh.3.t: "The Great Troubles"
 oe_ghh.3.d: "#F The line of Batu falters, and powerful emirs gather armies of their own across the steppe. Pretenders multiply while the outer wings grow deaf to Sarai's summons.#!\n\nThe Golden Horde enters Phase 2: The Great Troubles. Wing loyalty drops sharply and wings will no longer join offensive wars automatically unless cohesion is rebuilt."
 oe_ghh.3.a: "Shower the begs with gifts to hold the realm together"
 oe_ghh.3.a.tt: "Costs #R 120#! gold; Ulus Cohesion #G +10#!; all Ulus wings gain #G +25#! opinion"
 oe_ghh.3.b: "Enforce the Yassa with an iron hand"
 oe_ghh.3.b.tt: "Stability #R −7#!; Horde Unity #G +10#!; Ulus Cohesion #G +5#!"
 oe_ghh.3.c: "Pull back to the lower Volga and weather the storm"
 oe_ghh.3.c.tt: "Gain [ShowModifier('oe_ghh_glh_troubles')]; the outer wings drift apart"
 oe_ghh.4.t: "The Sufi Rising in Khwarazm"
 oe_ghh.4.d: "#F While Sarai is gripped by turmoil, the Qongirat Sufi lords of Urgench halt their tribute and proclaim themselves independent masters of Khwarazm.#!\n\nUrgench lies far across the desert. Crushing the rising will strain Sarai heavily, yet letting it go severs the wealthy oasis from the Horde."
 oe_ghh.4.a: "Send riders south to force Urgench back into line"
 oe_ghh.4.a.tt: "Costs #R 150#! gold and #R −7#! Stability; Khwarazm remains an Ulus subject and Ulus Cohesion #G +5#!"
 oe_ghh.4.b: "Our hands are full; let Khwarazm go its own way"
 oe_ghh.4.b.tt: "Khwarazm (KHW) breaks free as an independent state; Ulus Cohesion #R −5#!"
 oe_ghh.5.t: "Timur's Storm and the Sack of Sarai"
 oe_ghh.5.d: "#F War has broken the lower Volga trade and left Sarai reeling. The prestige of the Golden Horde lies in ashes while emirs and princes prepare to carve out khanates of their own.#!\n\nThe Golden Horde enters Phase 3: Great Fragmentation. The Ulus Cohesion cap falls to #Y 55#!; unless Sarai rallies and enacts centralization reforms, Nogai, the White Horde, Sibir, Crimea, Kazan, and Astrakhan will break away one by one."
 oe_ghh.5.a: "Rally the remnants and defend Sarai's legacy"
 oe_ghh.5.a.tt: "Gain [ShowModifier('oe_ghh_glh_shattered')]; cohesion ceiling drops to #Y 55#! (can still be lifted via centralization decisions)"
 oe_ghh.6.t: "Edigu and the Rise of the Nogai Horde"
 oe_ghh.6.d: "#F Along the Ural River and Sarayjuk, the Manghit clans rally under the great emir Edigu, forging the Nogai Horde beyond Sarai's direct reach.#!\n\nThe eastern steppe pasturelands are slipping away. Will the khan spend dearly to crush the Manghit rising, or let the Nogai Horde split away?"
 oe_ghh.6.a: "March on Sarayjuk and crush the Manghit rising"
 oe_ghh.6.a.tt: "Costs #R 200#! gold, #R −7#! Stability, and #R −10#! Horde Unity; prevents Nogai from breaking away"
 oe_ghh.6.b: "We cannot hold the Ural steppe; Nogai breaks free"
 oe_ghh.6.b.tt: "Releases an independent Nogai Horde (NOG) around Sarayjuk"
 oe_ghh.7.t: "An Ulus Breaks Free"
 oe_ghh.7.d: "#F With Sarai's authority crumbling, another Jochid wing has cast off the khan's banner, proclaimed its own khanate, and ceased all tribute to the Volga.#!\n\nThe wing has left the Ulus of Jochi as an independent khanate with its own colors. Only steel or decisive centralization can halt further disintegration."
 oe_ghh.7.a: "One day the lands of Jochi shall be reclaimed"
 oe_ghh.7.a.tt: "Prestige #R −10#!; the wing now stands independent"
 oe_ghh.8.t: "The Khanate of Astrakhan Breaks Away"
 oe_ghh.8.d: "#F Princes and merchants at the Volga delta port of Astrakhan move to sever the lower estuary from the weakened Great Horde.#!\n\nNew Sarai remains under our banner, yet Astrakhan is breaking loose. Can the khan still hold the Volga mouth by force?"
 oe_ghh.8.a: "Commit everything to hold the Volga delta"
 oe_ghh.8.a.tt: "Costs #R 200#! gold and #R −7#! Stability; keeps Astrakhan under direct rule"
 oe_ghh.8.b: "The tide cannot be turned; Astrakhan splits away"
 oe_ghh.8.b.tt: "Releases an independent Khanate of Astrakhan (ATR) in Astrakhan while New Sarai remains with the Golden Horde"
 oe_ghh.9.t: "The Begs Brought to Heel"
 oe_ghh.9.d: "#F Sarai's guard has struck down the separatist emirs. All remaining Jochid wings have been reorganized as standard vassals open to full integration.#!\n\nWith the initiative firmly in Sarai's hands, will the khan conciliate the reorganized wings or proclaim supreme authority across the steppe?"
 oe_ghh.9.a: "Confirm loyal begs in honor and bind them with favor"
 oe_ghh.9.a.tt: "Ulus Cohesion #G +10#!; all subjects gain #G +25#! opinion"
 oe_ghh.9.b: "Proclaim Sarai's absolute supremacy and prepare integration"
 oe_ghh.9.b.tt: "Prestige #G +10#!; Horde Unity #G +10#!; Ulus Cohesion #G +5#!"
 oe_ghh.10.t: "The Jochid Revival"
 oe_ghh.10.d: "#F The shadow of the Great Troubles has lifted. Sarai and Astrakhan shine once more as in the golden age of Özbeg Khan, and the steppe answers one sovereign throne.#!\n\nThe Golden Horde permanently gains [ShowModifier('oe_ghh_jochid_revival')], Ulus Cohesion is locked at its peak, and all fragmentation events are permanently closed."
 oe_ghh.10.a: "The Golden Banner shall reign across the steppe"
 oe_ghh.10.a.tt: "Permanently gains [ShowModifier('oe_ghh_jochid_revival')]; Horde Unity #G +25#!"
