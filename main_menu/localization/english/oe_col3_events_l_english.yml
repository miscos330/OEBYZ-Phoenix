l_english:
 oe_col3.1.t: "Chartered Factory Annual Dividend"
 oe_col3.1.d: "As seasonal merchantmen return home laden with spices, silk, porcelain, and bullion, the annual ledger of our overseas chartered factories records a handsome surplus. Beneath the colonnaded wharves stacked high with exotic cargo, the board of directors awaits royal instruction: remit the windfall straight into the state treasury, or retain capital overseas to expand docks and pioneer convoys?"
 oe_col3.1.a: "Draw the annual dividend into the treasury and commend the company"
 oe_col3.1.b: "Reinvest profits in overseas factories and fund pioneer supply convoys"
 oe_col3.2.t: "Spice and Silver Galleon Convoy"
 oe_col3.2.d: "Treasure galleons brimming with tropical spices, sugar, and silver stand ready at our overseas staging anchorage, yet narrow straits along the homeward lane teem with raiders and rival warships. The admiralty urges dispatching heavy escort ships of the line in protective battle order, while merchant syndics propose self-escorted sailings to spare naval outlays."
 oe_col3.2.a: "Dispatch ships of the line to escort the silver convoy safely home"
 oe_col3.2.b: "Leave convoys to merchant self-defense and share gains with the burghers"
 oe_col3.3.t: "Defying the Portuguese Cartaz"
 oe_col3.3.d: "Lisbon's crown enforces its stringent Cartaz pass regime across the Indian Ocean straits, seizing any merchant vessel sailing without paid tolls and royal safe-conducts. Our chartered directors and shipowners petition the throne: shall our armed escorts smash through the blockade along the Arabian Sea and Malabar coast, or pay the transit levy to keep commerce flowing?"
 oe_col3.3.a: "Break the blockade with armed convoys and defy the monopoly"
 oe_col3.3.b: "Pay the transit fees for now to keep merchant lanes undisturbed"
 oe_col3.4.t: "Scourge of the Ocean Privateers"
 oe_col3.4.d: "A surge of letters of marque has loosed swarms of fast privateers onto the oceanic trunk routes, ambushing our merchantmen outside colonial staging ports and driving maritime insurance rates skyward. Unless light escort squadrons sweep these raiding nests, our chartered overseas shipping faces paralysis."
 oe_col3.4.a: "Launch joint escort patrols to hunt down the privateer raiders"
 oe_col3.4.b: "Raise maritime insurance surcharges and shift losses onto the guilds"
 oe_col3.5.t: "Overseas Tariffs and Representation"
 oe_col3.5.d: "As the eighteenth century unfolds, maintaining transoceanic fleets and frontier garrisons strains the metropolitan exchequer. Treasury ministers propose unified stamp duties and port tariffs across our flourishing overseas provinces and colonial subjects, sparking uproar among colonial assemblies who insist upon representation before extraordinary taxation."
 oe_col3.5.a: "Enforce the overseas stamp taxes and tariffs without concession"
 oe_col3.5.b: "Defer punitive duties and pledge measured consultation overseas"
 oe_col3.6.t: "Harbor Tea Protest and Boycott"
 oe_col3.6.d: "Under flickering torches and moonlit sea mist, unrest erupts along a major colonial quay: furious burghers and sailors board moored merchantmen to heave sealed chests of taxed tea and spices into the harbor, followed by a sweeping merchant boycott of metropolitan goods. Urgent dispatches from the Customs House flood the capital."
 oe_col3.6.a: "Seal the harbor, enforce martial customs, and arrest the ringleaders"
 oe_col3.6.b: "Repeal the punitive tariffs and settle port grievances to restore trade"
 oe_col3.7.t: "Petition for Imperial Seats"
 oe_col3.7.d: "Moderate delegates from our provinces across the Americas, the Indian Ocean, and the Nanyang islands present a joint Petition for Imperial Seats. Pledging enduring loyalty to the crown, they ask to bridge metropole and colonies by granting overseas territories formal seats in the imperial parliament to deliberate on tariffs, naval defense, and law."
 oe_col3.7.a: "Open Imperial Federation talks to grant overseas parliamentary seats"
 oe_col3.7.a.tt: "You may subsequently enact the Grant Imperial Parliament Representation decision to enter the Imperial Federation path."
 oe_col3.7.b: "Reject the petition outright and reaffirm strict metropolitan rule"
 oe_col3.8.t: "Charter of the Imperial Federation"
 oe_col3.8.d: "Beneath sunbeams pouring through the neoclassical dome of the grand rotunda, crimson-robed metropolitan senators and overseas delegates from across the seas gather around the council table to seal the gold-stamped Charter of the Imperial Federation. Metropole and overseas realms unite as a single transoceanic commonwealth, rallying treasury reserves and prestige alike when global endgame wars or the Eurasian Concert test the empire."
 oe_col3.8.a: "Seal the Charter of the Imperial Federation across every sea"
 oe_col3.9.t: "Viceroy Martial Law and Garrisons"
 oe_col3.9.d: "As tax defiance and harbor boycotts intensify, colonial militias drill in town squares while crowds gather before viceregal palaces. Hardline commanders request troop reinforcements and port martial law, whereas moderate counselors warn that bayonets may silence streets briefly only to drive moderates into open rupture."
 oe_col3.9.a: "Reinforce harbor garrisons and enforce viceregal martial law"
 oe_col3.9.b: "Replace hardline officers with a conciliatory civil viceroy"
 oe_col3.10.t: "Continental and Overseas Congress"
 oe_col3.10.d: "Without metropolitan sanction, elected deputies from multiple overseas provinces and colonial subjects have convened a Continental and Overseas Congress. Their manifesto indicts punitive tariffs and martial decrees while demanding full internal self-rule and customs autonomy as restive crowds swell along the docks."
 oe_col3.10.a: "Denounce the Congress as unlawful sedition and refuse all terms"
 oe_col3.10.b: "Offer an urgent Colonial Autonomy compromise and lift harsh tariffs"
 oe_col3.10.b.tt: "You may subsequently enact the Enact Colonial Autonomy Charter decision for a peaceful commonwealth settlement."
 oe_col3.11.t: "Declaration of Overseas Independence"
 oe_col3.11.d: "At daybreak on the stone steps of a colonial town hall, delegates raise a freshly unrolled Declaration of Overseas Independence before cheering townsfolk while ships in the bay hoist bold new banners opposite lines of scarlet-coated royal garrisons. Years of heavy-handed crackdown have ignited an empire-wide independence wave: stand firm against crisis, or painfully concede broad autonomy to avert civil war?"
 oe_col3.11.a: "Reject secession and brace the empire for a transoceanic storm"
 oe_col3.11.b: "Painfully recognize broad colonial autonomy to extinguish the crisis"
 oe_col3.12.t: "Commonwealth and Trade Reconciliation"
 oe_col3.12.d: "After decades of maritime rivalry and constitutional debate, the metropolitan court and overseas dominions conclude the Transoceanic Commonwealth and Trade Reconciliation Treaty. Old tariff boycotts and martial grievances are laid to rest, replaced by preferential shipping lanes, shared commercial law, and enduring peace across every ocean."
 oe_col3.12.a: "Ratify the Commercial Commonwealth Pact and open a new era of trade"
 oe_col3.90.t: "Colonization 3.0: Live Read-Only Audit Ledger"
