l_english:
 oe_hetaireia_barracks: "Hetaireia Barracks"
 oe_hetaireia_barracks_desc: "An imperial standard and a holy icon hang above the gate. The soldiers recognize one another by shared faith and an oath of service, whatever their native tongue.\n\nOnly Byzantium may build these barracks, in Orthodox locations. The maximum level is initially #Y 1#!, rising to #Y 2#! after #Y Expand the Hetaireia#!. Each level employs #Y 1,000 soldiers#! and provides #G +10#! local manpower at full operation.\n\nEach completed level provides separate slots for #G 1#! Hetaireia heavy infantry regiment and #G 1#! Ethnikoi light infantry regiment. A Rum-culture level also provides #G 1#! slot shared by Turcopoles and Rum Cataphracts; a Moesian or Triballian level provides #G 1#! Orthodox Defender cavalry slot."
 oe_hetaireia_tax_exemption: "Tax Exemption"
 oe_hetaireia_tax_exemption_desc: "An imperial charter exempts the Hetaireia from taxation in recognition of their service. Their earnings support their families and equipment instead of filling the tax collector’s ledger.\n\nHetaireia satisfaction equilibrium: #G +20%#!. Estate power: #Y +33%#!. Maximum tax: #R −100%#!."
 OE_TURCOPOLES_BARRACKS_LIMIT: "Hetaireia barracks in Rum-culture locations"
 OE_TURCOPOLES_SHARED_LIMIT_TT: "The combined number of existing Turcopole and Rum Cataphract regiments across all ages is below the capacity provided by the barracks."
 oe_turcopoles_1: "Turcopole Horse Archers"
 oe_turcopoles_1_desc: "From the pastures of Anatolia to the roads of Thrace, Rum horsemen bring their skill with bow and saddle into imperial service. Lightly armored, they watch the flanks for the moment an enemy formation falters.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +10%#! strength damage, #G +1#! combat speed and #G +1#! movement speed."
 oe_turcopoles_2: "Turcopole Mounted Bowmen"
 oe_turcopoles_2_desc: "Training in the barracks gives the old mounted archery traditions a common set of commands. The Turcopoles harass the enemy with successive volleys before riding beyond pursuit.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +10%#! strength damage, #G +1#! combat speed and #G +1#! movement speed."
 oe_turcopoles_3: "Turcopole Light Lancers"
 oe_turcopoles_3_desc: "Against increasingly ordered infantry formations, the horsemen add light lances to their equipment. Reconnaissance and harassment remain their first duties; a charge follows only when a flank gives way.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +10%#! strength damage, #G +1#! combat speed and #G +1#! movement speed."
 oe_turcopoles_4: "Turcopole Mounted Arquebusiers"
 oe_turcopoles_4_desc: "The smoke of arquebuses begins to replace the sound of bowstrings. The Turcopoles learn to carry firearms on campaign and fight dismounted while retaining the mobility of light cavalry.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +10%#! strength damage, #G +1#! combat speed and #G +1#! movement speed."
 oe_turcopoles_5: "Turcopole Carabiniers"
 oe_turcopoles_5_desc: "Standard carbines, sabres and saddles bring greater cohesion to these squadrons. They screen the army, raid supply lines and turn a retreat into a rout.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +10%#! strength damage, #G +1#! combat speed and #G +1#! movement speed."
 oe_turcopoles_6: "Turcopole Chasseurs"
 oe_turcopoles_6_desc: "The ancient name of the Turcopoles is now borne by disciplined chasseurs. Their dispersed formations conceal the movements of the army and exploit breaches in the enemy line.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +10%#! strength damage, #G +1#! combat speed and #G +1#! movement speed."
