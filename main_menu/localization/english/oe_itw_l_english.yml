l_english:
 oe_itw_b_exarchate_threat: "Alarmed by Eastern Roman Exarchate Ambitions"
 oe_itw_b_italian_protector: "Byzantine Champion of Italian Liberties"
 oe_itw_b_adriatic_accord: "Pragmatic Adriatic Accord"
 oe_itw_b_cambrai_hostile: "Byzantine Pressure During the League of Cambrai"
 oe_itw_b_rome_shield: "Imperial Protection of Rome"
 oe_itw_b_bologna_protest: "Eastern Imperial Protest at Bologna"
 oe_itw_b_peninsular_balance: "Guarantor of the Italian Balance"
 oe_itw_b_trade_neutrality: "Byzantine Commercial Neutrality"
 STATIC_MODIFIER_NAME_oe_itw_exarchate_ambition: "Ambition of the Ancient Exarchate"
 STATIC_MODIFIER_DESC_oe_itw_exarchate_ambition: "Asserting Justinian's Exarchate claims steels imperial arms and prestige at the price of diplomatic suspicion and heavier upkeep."
 STATIC_MODIFIER_NAME_oe_itw_italian_liberties: "Defender of Italian Liberties"
 STATIC_MODIFIER_DESC_oe_itw_italian_liberties: "Championing Italian city-states against ultramontane powers boosts diplomacy and naval spirit while draining tax coffers."
 STATIC_MODIFIER_NAME_oe_itw_adriatic_neutrality: "Opportunistic Adriatic Neutrality"
 STATIC_MODIFIER_DESC_oe_itw_adriatic_neutrality: "Remaining neutral while Latin monarchs bleed swells merchant capacity and domestic calm at the cost of prestige."
 STATIC_MODIFIER_NAME_oe_itw_magna_graecia_push: "Magna Graecia Naval Push"
 STATIC_MODIFIER_DESC_oe_itw_magna_graecia_push: "Projecting naval and siege power along Apulia and Naples sharpens operations while driving up fleet maintenance."
 STATIC_MODIFIER_NAME_oe_itw_south_italy_ports: "Neapolitan & Sicilian Port Charters"
 STATIC_MODIFIER_DESC_oe_itw_south_italy_ports: "Escort treaties open southern Italian and Sicilian ports to Roman merchants, though domestic traditionalists question the concession."
 STATIC_MODIFIER_NAME_oe_itw_exile_talent: "Greco-Italian Talent of the South"
 STATIC_MODIFIER_DESC_oe_itw_exile_talent: "Sheltering displaced Greco-Italian scholars and mariners advances learning and culture while irritating entrenched magnates."
 STATIC_MODIFIER_NAME_oe_itw_ravenna_banner: "Banner of the Exarchate of Ravenna"
 STATIC_MODIFIER_DESC_oe_itw_ravenna_banner: "Pressing the Ravenna claim against Venice sharpens galley warfare and imperial prestige while disrupting Adriatic trade."
 STATIC_MODIFIER_NAME_oe_itw_venetian_detente: "Venetian Adriatic Detente"
 STATIC_MODIFIER_DESC_oe_itw_venetian_detente: "A pragmatic partition of maritime spheres with Venice accelerates trade and shipbuilding at the cost of imperial pride."
 STATIC_MODIFIER_NAME_oe_itw_genoese_counterweight: "Genoese Commercial Counterweight"
 STATIC_MODIFIER_DESC_oe_itw_genoese_counterweight: "Backing Genoese and smaller Adriatic merchants against Venice lifts trade revenue while adding administrative friction."
 STATIC_MODIFIER_NAME_oe_itw_cambrai_reckoning: "Cambrai Reckoning Against Venice"
 STATIC_MODIFIER_DESC_oe_itw_cambrai_reckoning: "Pressing Venice during the League of Cambrai boosts prestige and siege drive while unsettling domestic merchants."
 STATIC_MODIFIER_NAME_oe_itw_venetian_protectorate: "Protector of Besieged Venice"
 STATIC_MODIFIER_DESC_oe_itw_venetian_protectorate: "Selling imperial protection to cornered Venice yields lucrative commerce while lowering standing with other European courts."
 STATIC_MODIFIER_NAME_oe_itw_aloof_prudence: "Aloof Prudence Amid Shifting Leagues"
 STATIC_MODIFIER_DESC_oe_itw_aloof_prudence: "Refusing to chase fickle Italian coalitions strengthens cabinet work and stability while dimming western prestige."
 STATIC_MODIFIER_NAME_oe_itw_imperial_protector_rome: "Imperial Protector of Rome"
 STATIC_MODIFIER_DESC_oe_itw_imperial_protector_rome: "Shielding Rome from mercenary sack earns immense European prestige and diplomacy, provoking Orthodox clerical backlash at home."
 STATIC_MODIFIER_NAME_oe_itw_orthodox_vindication: "Vindication of Eastern Orthodoxy"
 STATIC_MODIFIER_DESC_oe_itw_orthodox_vindication: "Citing Rome's calamity as proof of Western hubris rallies Orthodox clergy and faith while chilling Catholic diplomacy."
 STATIC_MODIFIER_NAME_oe_itw_roman_archives: "Rescued Roman & Italian Archives"
 STATIC_MODIFIER_DESC_oe_itw_roman_archives: "Rescuing rare manuscripts and scholars amid Italian turmoil enriches research and culture while drawing conservative criticism."
 STATIC_MODIFIER_NAME_oe_itw_pike_and_shot: "Pike-and-Shot Tercios & Field Artillery"
 STATIC_MODIFIER_DESC_oe_itw_pike_and_shot: "Adopting pike-and-shot formations and mobile bronze artillery boosts discipline and siegecraft at steep upkeep cost."
 STATIC_MODIFIER_NAME_oe_itw_stratioti_condottieri: "Stratioti & Condottieri Synthesis"
 STATIC_MODIFIER_DESC_oe_itw_stratioti_condottieri: "Blending Greek Stratioti light horse with Italian condottieri contracts accelerates campaigns while straining domestic stability."
 STATIC_MODIFIER_NAME_oe_itw_native_drill: "Native Imperial Drill Preserved"
 STATIC_MODIFIER_DESC_oe_itw_native_drill: "Keeping native imperial muster traditions preserves manpower and low upkeep while trailing in modern siegecraft."
 STATIC_MODIFIER_NAME_oe_itw_bologna_arbitration: "Eastern Imperial Arbitration at Bologna"
 STATIC_MODIFIER_DESC_oe_itw_bologna_arbitration: "Challenging the Bologna coronation raises imperial prestige and diplomatic reach while straining domestic administration."
 STATIC_MODIFIER_NAME_oe_itw_bologna_balance: "Bologna Accord of Mutual Recognition"
 STATIC_MODIFIER_DESC_oe_itw_bologna_balance: "Brokering mutual recognition and Milanese-Florentine autonomy aids diplomacy and trade at a modest cost to imperial prestige."
 STATIC_MODIFIER_NAME_oe_itw_bologna_charters: "Bologna Commercial Capitulations"
 STATIC_MODIFIER_DESC_oe_itw_bologna_charters: "Securing commercial charters across Italy during the Bologna peace swells trade revenue while softening martial fervor."
 STATIC_MODIFIER_NAME_oe_itw_end_exarchate: "Restored Exarchate of Italy"
 STATIC_MODIFIER_DESC_oe_itw_end_exarchate: "Restoring an Eastern Roman Exarchate in Italy crowns imperial majesty and martial spirit alongside heavy upkeep and foreign hostility."
 STATIC_MODIFIER_NAME_oe_itw_end_balance: "Charter of the Italian Balance"
 STATIC_MODIFIER_DESC_oe_itw_end_balance: "Standing as recognized guarantor of the Italian balance enriches diplomacy and commerce while tempering military aggression."
 STATIC_MODIFIER_NAME_oe_itw_end_withdrawal: "Strategic Withdrawal to the East"
 STATIC_MODIFIER_DESC_oe_itw_end_withdrawal: "Withdrawing from Italian entanglements strengthens domestic cabinet governance and taxation at the price of western prestige."
 STATIC_MODIFIER_NAME_oe_itw_stratioti_levy: "Imperial Stratioti Corps"
 STATIC_MODIFIER_DESC_oe_itw_stratioti_levy: "Greek light cavalry raised on Italian campaign contracts excel at swift raids while adding army upkeep."
 STATIC_MODIFIER_NAME_oe_itw_italian_envoy: "Permanent Italian Embassies"
 STATIC_MODIFIER_DESC_oe_itw_italian_envoy: "Resident embassies across Italian courts smooth diplomacy and trade while drawing traditionalist grumbling at home."
 STATIC_MODIFIER_NAME_oe_itw_exarchate_seat: "Seat of the Reconstituted Exarchate"
 STATIC_MODIFIER_DESC_oe_itw_exarchate_seat: "Re-establishing a formal Exarchate seat on Italian soil projects prestige and defense while taxing administrative stability."
 oe_itw_dec_stratioti_contract.title: "Muster an Imperial Stratioti Corps"
 oe_itw_dec_stratioti_contract.desc: "Contract seasoned Greek Stratioti light horsemen during the Italian Wars, improving light cavalry power and movement speed at added army upkeep."
 oe_itw_dec_stratioti_contract.a: "Issue the Stratioti Campaign Contracts"
 oe_itw_dec_italian_embassy.title: "Dispatch a Byzantine Embassy to Italy"
 oe_itw_dec_italian_embassy.desc: "Send resident envoys to Venice, Florence, Milan, Genoa, and Naples to cultivate goodwill and commercial links amidst the Italian Wars."
 oe_itw_dec_italian_embassy.a: "Send Envoys Across the Italian Courts"
 oe_itw_dec_proclaim_exarchate.title: "Reconstitute the Exarchate of Ravenna"
 oe_itw_dec_proclaim_exarchate.desc: "With Eastern Roman banners planted in Ravenna, Naples, Palermo, or Rome, formally re-establish the Exarchate of Ravenna to anchor imperial rule in Italy."
 oe_itw_dec_proclaim_exarchate.a: "Re-establish the Exarchate Seat"
 oe_itw.1.t: "Descent of the Ultramontanes"
 oe_itw.1.d: "Around 1494, French armies bearing mobile bronze artillery cross the Alps into Italy, igniting decades of war with Aragon, the Habsburgs, and the Italian states over Naples and northern hegemony. In history, Charles VIII even purchased a claim to the Byzantine crown to cloak his descent into the peninsula.\n\nYet here, Eastern Rome still stands upon the Bosporus! As ultramontane powers tear across ancient Roman soil, what stance shall the empire take?"
 oe_itw.1.a: "Assert Ancient Exarchate Claims and Intervene as a Third Power"
 oe_itw.1.a.tt: "Adopt the #bold #color_yellow Exarchate Claims#!#! stance, Gold #R −100#!, Stability #R −5#!; gain [ShowModifier('oe_itw_exarchate_ambition')] for #Y 20 years#!; lowers opinion with France, Aragon, and the Papacy."
 oe_itw.1.b: "Champion Italian Liberties Against Ultramontane Ambition"
 oe_itw.1.b.tt: "Adopt the #bold #color_yellow Italian Liberties#!#! stance, Gold #R −80#!; gain [ShowModifier('oe_itw_italian_liberties')] for #Y 20 years#!; improves opinion with Florence, Milan, and Naples while angering France."
 oe_itw.1.c: "Maintain Opportunistic Trade Neutrality"
 oe_itw.1.c.tt: "Adopt #bold #color_yellow Trade Neutrality#!#!, Prestige #R −8#!; gain [ShowModifier('oe_itw_adriatic_neutrality')] for #Y 20 years#!; improves opinion with Venice and Genoa."
 oe_itw.2.t: "Question of Magna Graecia & Naples"
 oe_itw.2.d: "War engulfs southern Italy—Naples and Palermo in Sicily, ancient heartlands of Magna Graecia and once the imperial Theme of Longobardia. As France and Aragon clash over the Neapolitan crown, the Adriatic ports of Apulia tremble.\n\nWith imperial squadrons just across the Ionian Sea, shall we project power into Magna Graecia, trade naval escorts for port charters in Naples and Palermo, or shelter fleeing Greco-Italian talent?"
 oe_itw.2.a: "Project Imperial Power Along Apulia and Naples"
 oe_itw.2.a.tt: "Gold #R −90#!, increases Italian influence; gain [ShowModifier('oe_itw_magna_graecia_push')] for #Y 15 years#!; lowers opinion with Naples, Aragon, and France."
 oe_itw.2.b: "Guarantee Neapolitan & Sicilian Sea Lanes for Port Rights"
 oe_itw.2.b.tt: "Gold #R −60#!; gain [ShowModifier('oe_itw_south_italy_ports')] for #Y 15 years#!; improves opinion with Naples and Sicily."
 oe_itw.2.c: "Shelter Greco-Italian Scholars and Mariners from the War"
 oe_itw.2.c.tt: "Stability #R −4#!; gain [ShowModifier('oe_itw_exile_talent')] for #Y 15 years#!."
 oe_itw.3.t: "The Exarchate of Ravenna & Venetian Rivalry"
 oe_itw.3.d: "On the western Adriatic shore stands Ravenna, seat of Justinian's Exarchate where the mosaics of San Vitale still gleam with imperial purple. As the Papal States and Venice fight bitterly over Romagna and Ravenna, Eastern Rome's ancient maritime rival faces mounting strain.\n\nShall we press the Ravenna banner against Venice, strike a pragmatic Adriatic accord, or back Genoa against the Venetian monopoly?"
 oe_itw.3.a: "Raise the Ravenna Banner Against Venetian Dominance"
 oe_itw.3.a.tt: "Gold #R −80#!, increases Italian influence; gain [ShowModifier('oe_itw_ravenna_banner')] for #Y 15 years#!; sharply angers Venice while pleasing the Papacy."
 oe_itw.3.b: "Strike a Pragmatic Adriatic Accord with Venice"
 oe_itw.3.b.tt: "Prestige #R −12#!; gain [ShowModifier('oe_itw_venetian_detente')] for #Y 15 years#!; improves Venetian opinion while cooling Papal ties."
 oe_itw.3.c: "Back Genoese & Adriatic Rivals Against Venice"
 oe_itw.3.c.tt: "Gold #R −70#!; gain [ShowModifier('oe_itw_genoese_counterweight')] for #Y 15 years#!; improves Genoese opinion while angering Venice."
 oe_itw.4.t: "League of Cambrai & Shifting Coalitions"
 oe_itw.4.d: "In 1508 the Papacy, France, the Habsburgs, and Aragon forge the League of Cambrai to partition Venice—only to flip within three years into a Holy League against French dominance. In Renaissance Italy, allies and foes trade places with every season.\n\nWith Venice—architect of 1204—backed against the wall, shall we join the pressure of Cambrai, sell imperial protection to Venice at a steep price, or stay aloof?"
 oe_itw.4.a: "Join the Anti-Venetian Pressure of Cambrai"
 oe_itw.4.a.tt: "Gold #R −90#!, increases Italian influence; gain [ShowModifier('oe_itw_cambrai_reckoning')] for #Y 15 years#!; severely angers Venice while pleasing Rome, France, and the Habsburgs."
 oe_itw.4.b: "Sell Imperial Protection to Besieged Venice"
 oe_itw.4.b.tt: "Gold #G +120#!, Prestige #R −8#!; gain [ShowModifier('oe_itw_venetian_protectorate')] for #Y 15 years#!; delights Venice while displeasing France and the Habsburgs."
 oe_itw.4.c: "Stay Aloof from Shifting Latin Coalitions"
 oe_itw.4.c.tt: "Prestige #R −5#!; gain [ShowModifier('oe_itw_aloof_prudence')] for #Y 15 years#!."
 oe_itw.5.t: "The Papacy & the Two Romes in Italy"
 oe_itw.5.d: "Unpaid mercenary armies descend upon Rome itself—the shock of the 1527 Sack of Rome stuns all Christendom as the Papal court trembles behind besieged walls, while Second Rome on the Bosporus stands unbroken.\n\nShall Eastern Rome dispatch envoys and ships to shield Rome despite clerical protest at home, denounce the calamity as Western hubris, or rescue priceless classical manuscripts from the flames?"
 oe_itw.5.a: "Offer Imperial Protection to Rome and the Papacy"
 oe_itw.5.a.tt: "Gold #R −110#!; gain [ShowModifier('oe_itw_imperial_protector_rome')] for #Y 20 years#!; delights the Papacy while angering the Habsburgs and straining Orthodox clergy at home."
 oe_itw.5.b: "Denounce the Sack of Rome as Western Hubris"
 oe_itw.5.b.tt: "Prestige #G +10#!, Religious Influence #G +15#!; gain [ShowModifier('oe_itw_orthodox_vindication')] for #Y 20 years#!; cools relations with Rome and the Habsburgs."
 oe_itw.5.c: "Rescue Classical Manuscripts and Scholars from the Turmoil"
 oe_itw.5.c.tt: "Gold #R −75#!; gain [ShowModifier('oe_itw_roman_archives')] for #Y 20 years#!."
 oe_itw.6.t: "Condottieri, Pike-and-Shot & Greek Stratioti"
 oe_itw.6.d: "The Italian Wars are the crucible of Europe's military revolution: pike squares, Spanish tercios, mobile French bronze guns, Italian condottieri, and Greek Stratioti light cavalry are rewriting the art of war.\n\nImperial observers in Italy submit urgent military reports. How shall the empire adapt its doctrine and bear its costs?"
 oe_itw.6.a: "Adopt Pike-and-Shot Tercios and Field Artillery"
 oe_itw.6.a.tt: "Gold #R −120#!, lowers noble satisfaction; gain [ShowModifier('oe_itw_pike_and_shot')] for #Y 25 years#! (heavy army upkeep)."
 oe_itw.6.b: "Blend Greek Stratioti Cavalry with Condottieri Tactics"
 oe_itw.6.b.tt: "Gold #R −80#!, Stability #R −4#!; gain [ShowModifier('oe_itw_stratioti_condottieri')] for #Y 25 years#!."
 oe_itw.6.c: "Preserve Native Imperial Drill with Selective Reform"
 oe_itw.6.c.tt: "Gold #R −40#!; gain [ShowModifier('oe_itw_native_drill')] for #Y 25 years#! (lower siegecraft, leaner upkeep)."
 oe_itw.7.t: "Treaty of Bologna & Imperial Arbitration"
 oe_itw.7.d: "Decades of bloodshed over Milan and Florence leave the peninsula exhausted. Envoys gather at Bologna for peace and an imperial coronation—in history, the 1530 Treaty of Bologna sealed Habsburg mastery over Italy.\n\nYet Eastern Rome sits at the table! Facing the fate of Milan, Florence, and the perennial Problem of Two Emperors, what position shall our envoys press at Bologna?"
 oe_itw.7.a: "Contest the Western Coronation and Demand Imperial Arbitration"
 oe_itw.7.a.tt: "Gold #R −100#!, Prestige #G +15#!, raises Italian influence; gain [ShowModifier('oe_itw_bologna_arbitration')] for #Y 20 years#!; angers Habsburgs and Rome while pleasing Milan and Florence."
 oe_itw.7.b: "Broker Mutual Imperial Recognition Guaranteeing Milan & Florence"
 oe_itw.7.b.tt: "Prestige #R −10#!; gain [ShowModifier('oe_itw_bologna_balance')] for #Y 20 years#!; improves opinion with Milan, Florence, Rome, and the Habsburgs."
 oe_itw.7.c: "Secure Permanent Commercial Capitulations at Bologna"
 oe_itw.7.c.tt: "Gold #G +100#!, Prestige #R −8#!; gain [ShowModifier('oe_itw_bologna_charters')] for #Y 20 years#!; improves opinion with Milan and Florence."
 oe_itw.8.t: "Fate of the Italian Peninsula"
 oe_itw.8.d: "After half a century of steel, shifting leagues, and siege, the Italian Wars draw to a close. The three-way contest of Valois France, the Habsburgs, and Eastern Rome has reshaped the destinies of Ravenna, Naples, Milan, and Rome alike.\n\nNow the empire must set its lasting settlement for the peninsula: proclaim a Restored Exarchate, anchor an Italian Balance of Power, or withdraw strategically to the East?"
 oe_itw.8.a: "Proclaim the Restored Exarchate of Italy"
 oe_itw.8.a.tt: "Outcome 1 (#bold #color_yellow Restored Exarchate#!#!): Gold #R −150#!, Stability #R −8#!, Prestige #G +25#!; gain [ShowModifier('oe_itw_end_exarchate')] for #Y 35 years#!; angers major Western powers."
 oe_itw.8.b: "Guarantee the Italian Balance of Power"
 oe_itw.8.b.tt: "Outcome 2 (#bold #color_yellow Italian Balance#!#!): Gold #R −80#!, Prestige #G +15#!; gain [ShowModifier('oe_itw_end_balance')] for #Y 35 years#!; improves opinion with Italian states and Rome."
 oe_itw.8.c: "Execute a Strategic Withdrawal to the East"
 oe_itw.8.c.tt: "Outcome 3 (#bold #color_yellow Withdrawal to the East#!#!): Prestige #R −15#!, Stability #G +8#!; gain [ShowModifier('oe_itw_end_withdrawal')] for #Y 35 years#!."
 oe_itw.20.t: "Italian Wars Intervention: Choice Takes Effect"
 oe_itw.90.t: "[TEST] Italian Wars Byzantine Intervention: Readings"
 oe_itw.90.d: "#T Italian Wars Intervention State#!\nVanilla Situation [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_sit')|0]  Italy Foothold [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_foot')|0]  Stance(1/2/3) [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_stance')|0]  Influence [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_inf')|0]\n#T Outcome & Progress#!\nOutcome(1/2/3) [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_out')|0]  Done [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_done')|0]\n#T Scheduler (Slot 55)#!\nmonth [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_m')|0]  end [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_end')|0]  sent [ROOT.GetCountry.MakeScope.ScriptValue('oe_itw_rd_cnt')|0]\n(end: 0 running, 1 done, 3 past 1570, 8 no eligible Eastern Roman host)"
 oe_itw.90.a: "Close"
 oe_itw.90.b: "Refresh"
