 OE_NF_INFLUENCE_TT_1: "#bold #Y House Influence#!#!\nCurrent: #G [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('oe_nf_influence_1').GetValue|2]#! / 1000\nLast calculated monthly change: [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('oe_nf_monthly_1').GetValue|2]\n\nMonthly: base −2; political ally +1; an additional −1 after Revoke Noble Privileges; an additional +2 before Reorganize the Offices; each member in the Eastern Roman cabinet +1; each valid court office +1.5; each member commanding an Eastern Roman army or fleet +0.25. Each theme governor +1; each member ruling at least one landed country +1; each controlled location +0.1. Osmaris additionally gains +0.2 per completed Ottoman Company level while Byzantium owns Constantinople.\nA member winning a battle for Eastern Rome: +10. Death of the house head: −50. Each member marrying: +5. Influence is bounded between 0 and 1000."
