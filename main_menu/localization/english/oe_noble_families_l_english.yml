l_english:
 oe_nf_promote_house: "Elevate a House"
 oe_nf_promote_house_desc: "An imperial decree can raise a family of long-standing repute into the highest circles of the court. Recognize its service and its descendants, and grant another house a place beneath the throne.\n\nWhile a house slot is available, spend #Y 1 Authority#! to elevate a family with at least #G 6 living members#! residing in Eastern Rome. The family must not already be a noble house. Its starting Influence is #G 0#!.\n\n$OE_NF_SOVEREIGN_DYNASTY_RULE$"
 OE_NF_ROOM: "The number of noble houses is below the house limit."
 OE_NF_CANDIDATE: "An unrecognized dynasty has at least six living members residing in Eastern Rome."
 OE_NF_AUTHORITY: "The Pillars of the Empire have at least #Y 1 Authority#!."
 OE_NF_SELECT: "Select a representative of the house to elevate"
 OE_NF_NONE: "@trigger_no! No eligible family: at least six living members must reside in Eastern Rome, and the family must not already be a noble house."
 OE_NF_CAPACITY: "Houses #G [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_nf_house_count')|0]#! / #Y [InternationalOrganizationsView.GetInternationalOrganization.MakeScope.GetVariable('oe_nf_house_limit').GetValue|0]#!"
 OE_NF_CAPACITY_TT: "The initial house limit is 3. Extinct dynasties leave the register and free a slot. New houses enter through Elevate a House."
 OE_NF_INFLUENCE: "Infl."
 OE_NF_INTERACT: "Actions"
 OE_NF_INTERACT_TT: "Expand this house's interactions."
 OE_NF_NO_INTERACTIONS: "No house interactions are available yet."
 OE_NF_EMPTY: "No noble houses are currently registered."
 OE_NF_PROMOTE_HINT: "Requires a free house slot and six living family members residing in Eastern Rome. Costs #Y 1 Authority#!."
