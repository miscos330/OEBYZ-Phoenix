l_english:
 oe_ra_attack_tributary: "Attack a Tributary"
 oe_ra_attack_tributary_desc: "Spend one month of our income and choose one of our direct tributaries with whom we have no truce. Immediately declare war using the Imperial Expedition Casus Belli, with 50% less war score cost for taking land, subjugation and releasing countries, and 50% less Aggressive Expansion."
 oe_ra_choose_tributary: "Choose a Tributary to Attack"
 oe_ra_no_tributaries: "@trigger_no! There are no eligible direct tributaries. We must not already be at war with the target or have a truce with it."
 oe_ra_tributary_war_target: "Direct Tributary Eligible for an Expedition"
 oe_ra_tributary_war_cost: "One Month of Income"
 oe_ra_imperial_tributary_war: "$oe_heg_capital_invasion$"
 oe_ra_imperial_tributary_war_desc: "Tributary oaths no longer suffice to uphold imperial order. Subdue the tributary by force and bring its lands under Russian authority. War score cost for taking land, subjugation and releasing countries is reduced by 50%, and Aggressive Expansion by 50%."
 war_goal_oe_ra_take_tributary_capital: "$generic_war_goal_take_capital$"
 war_goal_oe_ra_take_tributary_capital_desc: "$generic_war_goal_take_capital_desc$"
 oe_ra_establish_oprichnina: "Establish the Oprichnina Guard"
 oe_ra_establish_oprichnina_desc: "Spend 50 Political Influence to immediately enact the Oprichnina Guard government reform: +1 Government Reform Slot, +50% Diplomatic Annexation Speed and +1 Base Diplomatic Annexation Speed, +20% Crown Power, −33% Nobility Power and +10% Proximity Efficiency."
 oe_ra_oprichnina: "Oprichnina Guard"
 oe_ra_oprichnina_desc: "Bind the sovereign’s personal domains to a loyal military force, curtail the authority of provincial nobles and carry the Crown’s commands and administration throughout the realm."
 oe_ra_oprichnina_unlocked: "The Oprichnina Guard Has Been Established"
