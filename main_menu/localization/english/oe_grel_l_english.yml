 oe_grel_nest_three_sees_tt:0 "At least one of Baghdad, Samarkand, or Kochi is governed by a realm and our country is at peace."
 oe_grel_mia_chalcedonian_dialogue:0 "Convene New Chalcedon Theological Dialogue"
 oe_grel_mia_chalcedonian_dialogue_desc:0 "Invites Oriental Orthodox and Eastern Orthodox theologians to pursue liturgical reconciliation and strategic fellowship."
 oe_grel_mia_nile_pilgrimage_charter:0 "Charter Red Sea & Alexandrian Pilgrimage"
 oe_grel_mia_nile_pilgrimage_charter_desc:0 "Dispatches envoys to protect Coptic and Ethiopian pilgrims between Cairo, Aksum, and the Red Sea ports."
 oe_grel_mia_armenian_monastic_patronage:0 "Patronize Armenian & Cilician Monastic Scriptoria"
 oe_grel_mia_armenian_monastic_patronage_desc:0 "Endows the scriptoria of Etchmiadzin, Ani, and Sis to deepen cultural tradition, literacy, and highland resilience."
 oe_grel_isl_invite_ulama_scholar:0 "Summon Great Ulama Scholar to Court"
 oe_grel_isl_invite_ulama_scholar_desc:0 "Invites a distinguished jurist or Sufi scholar from Cairo, Baghdad, or Samarkand to serve as a court Islamic scholar."
 oe_grel_isl_escort_hajj_caravan:0 "Sponsor Hajj Caravan Escort"
 oe_grel_isl_escort_hajj_caravan_desc:0 "Funds armed escorts and water stations for the annual Hajj caravans to Mecca, boosting prestige, legitimacy, and export commerce."
 oe_grel_isl_sufi_mediation:0 "Invite Sufi Elders to Mediate Disputes"
 oe_grel_isl_sufi_mediation_desc:0 "Calls upon respected Sufi masters to calm sectarian tensions across diverse provinces, raising stability and toleration."
 oe_grel_steppe_kurultai_faith_debate:0 "Convene Kurultai Debate of the Faiths"
 oe_grel_steppe_kurultai_faith_debate_desc:0 "Convenes Islamic jurists, Buddhist lamas, Nestorian scribes, and shamans at the khan's court to adopt a tailored syncretic boon without sudden conversion upheaval."
 oe_grel_hindu_invoke_royal_avatar:0 "Consecrate Royal Temple Avatar"
 oe_grel_hindu_invoke_royal_avatar_desc:0 "Performs a grand temple consecration allowing a Hindu realm with an open avatar slot to invoke a royal regional avatar of Vishnu, Shiva, or Durga."
 oe_grel_shinto_grand_shrine_offering:0 "Grand Shrine Imperial Offering"
 oe_grel_shinto_grand_shrine_offering_desc:0 "Dispatches court envoys with sacred offerings to the Grand Shrines, raising purity, martial honor, and defensive resolve."
 oe_grel_thera_sangha_merit_council:0 "Convene Theravada Sangha Merit Council"
 oe_grel_thera_sangha_merit_council_desc:0 "Gathers elder monks to recite and purify the Pali canon, elevating karma, royal legitimacy, and provincial stability."
 oe_grel.1.t:0 "Chongfusi Convocation of Medicine & Astronomy"
 oe_grel.1.desc:0 "Church of the East scholars from Nisibis, Samarkand, and Zaytun have assembled at court bearing Syriac medical treatises, astronomical tables, and caravan ledgers. The bishops await our decree on the convocation's primary focus."
 oe_grel.1.a:0 "Establish Imperial Medicine & Astronomy Lectures"
 oe_grel.1.b:0 "Dispatch Syriac Bishops Along Silk Road Caravanserais"
 oe_grel.2.t:0 "An Ancient Silk Road Church Seeks Imperial Protection"
 oe_grel.2.desc:0 "Envoys of the Church of the East, whose metropolitan sees once spanned Baghdad, Samarkand, and Khanbaliq, petition our court. Skilled in Syriac, Persian, medicine, and astronomy, they offer Silk Road intelligence and commercial ties in exchange for imperial protection."
 oe_grel.2.a:0 "Grant Imperial Protection to Their Scholars & Envoys"
 oe_grel.2.b:0 "Allow Them to Pay Ordinary Dues Without Privilege"
 oe_grel.3.t:0 "The New Chalcedon Theological Dialogue"
 oe_grel.3.desc:0 "Prelates of the Eastern Orthodox and Oriental Orthodox churches have gathered to re-examine a millennium of Christological division. Whether we embrace liturgical fellowship or guard strict doctrinal boundaries will reshape the Christian East."
 oe_grel.3.a:0 "Sign the Accord of Liturgical Respect"
 oe_grel.3.b:0 "Uphold Traditional Doctrine While Keeping Amity"
 oe_grel.4.t:0 "Covenant of the Nile & Red Sea Pilgrims"
 oe_grel.4.desc:0 "Pilgrims from Aksum, Lalibela, and the Nile Valley seek royal protection for the ancient routes linking the See of Saint Mark in Alexandria with Jerusalem and the Red Sea ports."
 oe_grel.4.a:0 "Charter Protected Red Sea & Alexandrian Pilgrimage Routes"
 oe_grel.4.b:0 "Focus Patronage on Monastic Scriptoria & Defenses"
 oe_grel.5.t:0 "Summoning a Great Scholar of the Ummah"
 oe_grel.5.desc:0 "Answering our royal summons, three renowned Islamic scholars have arrived at court: a master of Hanafi statecraft, a Shafi'i jurist famed across maritime ports, and a revered Naqshbandi Sufi elder."
 oe_grel.5.a:0 "Appoint the Hanafi Imperial Jurist"
 oe_grel.5.b:0 "Appoint the Shafi'i Maritime & Madrasa Scholar"
 oe_grel.5.c:0 "Appoint the Naqshbandi Sufi Master"
 oe_grel.6.t:0 "Wittenberg Letters & Eastern Scholarly Missions"
 oe_grel.6.desc:0 "The upheavals of the Reformation and the Council of Trent have reached eastern courts: Lutheran theologians send Greek letters seeking ancient patristic accord, while Jesuit mathematicians arrive bearing new astronomical instruments."
 oe_grel.6.a:0 "Engage in Open Patristic & Scholarly Dialogue"
 oe_grel.6.b:0 "Admit Jesuit Astronomers to Court Academies"
 oe_grel.6.c:0 "Decline Foreign Controversies & Guard Native Orthodoxy"
 oe_grel.7.t:0 "The Kurultai Debate of the Faiths"
 oe_grel.7.desc:0 "Following the ancient steppe custom of the court disputation, Islamic jurists, Tibetan lamas, Nestorian scribes, and shamans stand before the golden pavilion. The Khan may draw upon one tradition's governance strengths without uprooting ancestral faith."
 oe_grel.7.a:0 "Enlist Transoxianan Jurists for Trade & Tax Law"
 oe_grel.7.b:0 "Sponsor a Vajrayana Court Consecration"
 oe_grel.7.c:0 "Empower the Nestorian & Uyghur Chancellery"
 oe_grel.7.d:0 "Uphold Pure Devotion to Eternal Heaven"
 oe_grel.8.t:0 "Royal Consecration of a Regional Avatar"
 oe_grel.8.desc:0 "Temple priests have prepared the sacred fire and bronze icons for royal consecration. Choose which regional manifestation of the divine shall watch over our realm's seas, fortresses, and academies."
 oe_grel.8.a:0 "Consecrate Jalashayi Vishnu of the Southern Seas"
 oe_grel.8.b:0 "Consecrate Chakradhara Guardian of the Deccan"
 oe_grel.8.c:0 "Consecrate Shiva Nataraja of the Cosmic Dance"
 oe_grel.8.d:0 "Consecrate Durga the Victorious Sovereign"
 oe_grel.8.e:0 "Offer Royal Temple Devotion"
 oe_grel.9.t:0 "Return of the Old Gods: Pagan Altars in Constantinople"
 oe_grel.9.desc:0 "Astonishing dispatches shake all of Christendom: the Roman throne at Constantinople has rekindled the ancient pagan altars of Jupiter and Athena! Bishops and humanist scholars fiercely divide between proclaiming a sacred vigil and opening a Neoplatonic philosophical rebuttal."
 oe_grel.9.a:0 "Sound the Sacred Alarm Against Pagan Rome"
 oe_grel.9.b:0 "Dispatch Humanist Scholars for Philosophical Debate"
 oe_grel.10.t:0 "Caesar's Apostasy: A Fatwa Across the Ummah"
 oe_grel.10.desc:0 "Word races across the Muslim world that Caesar has forsaken the Gospel to restore the old Greco-Roman pantheon. In Cairo, Damascus, and Samarkand, the Ulama debate whether to proclaim a defensive fatwa or answer Rome through Aristotelian philosophical disputation."
 oe_grel.10.a:0 "Proclaim a Solemn Fatwa in Defense of the Book"
 oe_grel.10.b:0 "Open Aristotelian & Sufi Philosophical Dialogue"
 oe_grel.11.t:0 "Interpretatio Romana: Resonance Across Eurasia"
 oe_grel.11.desc:0 "Envoys and merchants from Constantinople bring intriguing news to eastern courts: the Roman Empire has restored its ancient pantheon and civic sacrifices, invoking classical Interpretatio Romana to recognize eastern deities, Eternal Heaven, and courtly rites as kindred expressions of cosmic order."
 oe_grel.11.a:0 "Welcome Roman Envoys in Ritual & Commercial Amity"
 oe_grel.11.b:0 "Observe Calmly and Guard Native Rites"
