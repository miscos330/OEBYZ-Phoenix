 STATIC_MODIFIER_DESC_oe_ind_v99_avatar_temple_synergy: "The temple of the chosen avatar flourishes, and its estates and the sea trade feed one another."
 STATIC_MODIFIER_NAME_oe_ind_grand_trunk_mod: "The Trunk Road Restored"
