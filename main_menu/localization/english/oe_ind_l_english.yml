# NEW 2026-11-22 v11.5 Worker 2 (oe_ind_). Generated by gen_v115_india.py; edit the generator, not this file.
 oe_ind_bhakti_devotion_school: "The Bhakti Devotion"
 oe_ind_bhakti_devotion_school_desc: "Wandering poet-saints sing of the divine in the common tongues and teach that devotion saves anyone, whatever their birth."
 oe_ind_srirangam_vaishnava_school: "The Srirangam Vaishnava College"
 oe_ind_srirangam_vaishnava_school_desc: "The Vaishnava college centred on the great temple of Srirangam, whose lands, granaries and rites are kept in exact order and prop up the kings of the south."
 oe_ind_sulh_i_kul_school: "Peace with All"
 oe_ind_sulh_i_kul_school_desc: "The ruler gathers the learned of every faith to debate under one roof and declares the same peace towards all beliefs. Only the countries of the subcontinent may adopt it."
 oe_ind_ibadat_khana_grand_bazaar: "Hall of Debate and Grand Bazaar"
 oe_ind_ibadat_khana_grand_bazaar_desc: "A hall where the learned of every faith debate, joined to the chief caravanserai of the trunk road. It can be built only in Delhi, Agra, Vijayanagar, Surat, Gaur, Sonargaon, Golconda, Lahore and Kozhikode, one in each; in the capital it also helps the whole country. Requires the Silver Rupee and Trunk Road advance."
 oe_ind_ibadat_khana_grand_bazaar_maint: "Upkeep"
 oe_ind_imperial_service_law: "Military Assignments"
 oe_ind_imperial_service_law_desc: "How the commanders keep their men: by military fiefs held for generations, or by assignments that go with a rank and can be taken back."
 oe_ind_pol_nayankara_amaram: "Nayaka Military Fiefs"
 oe_ind_pol_nayankara_amaram_desc: "Land is granted to the commanders, who must keep a fixed number of foot, horse and elephants and pay tribute to the crown."
 oe_ind_pol_mansabdari_zat_sawar: "Mansabdari Ranks"
 oe_ind_pol_mansabdari_zat_sawar_desc: "Every officer holds two ranks: one fixes his pay, the other the number of horsemen he must keep. Assignments are not inherited and are changed regularly."
 oe_ind_monsoon_maritime_law: "The Monsoon Ports"
 oe_ind_monsoon_maritime_law_desc: "The monsoon brings the ships of every nation to our ports. Shall we throw them open, or sail armed?"
 oe_ind_pol_open_monsoon_ports: "Free Ports for All Nations"
 oe_ind_pol_open_monsoon_ports_desc: "Whoever comes may trade, so long as he pays the customs."
 oe_ind_pol_armed_anti_cartaz: "Armed Convoys"
 oe_ind_pol_armed_anti_cartaz_desc: "Merchantmen sail in company under the guns of warships and buy passes from no foreigner."
 oe_ind_vijayanagara_nayankara_reform: "The Nayaka Order"
 oe_ind_vijayanagara_nayankara_reform_desc: "Crown, temples and nayaka commanders hold one another up: the commanders keep troops and pay tribute, the temples manage the land, and the crown directs them all."
 oe_ind_grand_trunk_bureaucracy_reform: "Trunk Road and Silver Rupee"
 oe_ind_grand_trunk_bureaucracy_reform_desc: "Build the trunk road across the north with posts and inns along it, strike one silver rupee of full weight, and tax the land by measured survey."
 oe_ind_priv_rajput_jagir_alliance: "The Rajput Alliance"
 oe_ind_priv_rajput_jagir_alliance_desc: "Marry into the Rajput houses, leave them their ancestral lands and give them high rank, in return for their cavalry."
 oe_ind_priv_gujarati_maritime_guilds: "The Sea Merchants' Guilds"
 oe_ind_priv_gujarati_maritime_guilds_desc: "Confirm the self-rule and customs of the merchant guilds of the western ports, whose ships ply between the Red Sea and the Spice Islands."
 oe_ind_adv_warhorse_monsoon_network: "Warhorses for Pepper"
 oe_ind_adv_warhorse_monsoon_network_desc: "The south cannot breed good horses. Pepper and gems buy them by the shipload from the Gulf."
 oe_ind_adv_tulughma_field_artillery: "Wagon Guns and the Flanking Wings"
 oe_ind_adv_tulughma_field_artillery_desc: "Hold the centre with chained gun wagons while the horsemen sweep round both flanks."
 oe_ind_adv_rupee_grand_trunk: "Silver Rupee and Trunk Road"
 oe_ind_adv_rupee_grand_trunk_desc: "One silver coin and one open road. Unlocks the Hall of Debate and Grand Bazaar."
 oe_ind_adv_deccan_rocket_batteries: "Iron-Cased Rockets"
 oe_ind_adv_deccan_rocket_batteries_desc: "Rockets cased in iron fly much farther, and fired in volleys they terrify an enemy."
 oe_ind_player_only_tt: "Only a player-controlled country can use this"
 oe_ind_dec_delhi_grand_trunk_salvage.title: "Restore the Trunk Road and the Coinage"
 oe_ind_dec_delhi_grand_trunk_salvage.desc: "Repair the roads from Delhi to the provinces and strike good silver again, to steady a shaken sultanate. Requires Delhi; costs 200 gold, gives +1 stability, and lasts 20 years."
 oe_ind_dec_delhi_grand_trunk_salvage.a: "Set it in order"
 oe_ind_dec_vij_warhorse_charter.title: "Charter the Horse Trade"
 oe_ind_dec_vij_warhorse_charter.desc: "License the sea merchants to bring warhorses from the Gulf in return for pepper and gems. Requires a Hindu country with a port; costs 150 gold and lasts 15 years. With an avatar chosen, the temples and the sea trade give a further bonus."
 oe_ind_dec_vij_warhorse_charter.a: "Grant the charter"
 oe_ind_dec_diu_anti_cartaz_league.title: "Form the League against the Passes"
 oe_ind_dec_diu_anti_cartaz_league.desc: "Join the coastal states and our allies of the Red Sea in refusing the pass system that foreigners impose on the Indian Ocean. Requires a port, and either that the pass system is in force or that the year 1500 has come; costs 200 gold and lasts 20 years."
 oe_ind_dec_diu_anti_cartaz_league.a: "Form the league"
 oe_ind_dec_mughal_ibadat_khana.title: "Open the Hall of Debate"
 oe_ind_dec_mughal_ibadat_khana.desc: "Summon the learned of every faith to debate at court. Requires a Muslim country, and either the year 1550 or the Silver Rupee and Trunk Road advance; costs 200 gold and lasts 20 years. With a Mansabdari levy advance, the cavalry gains as well."
 oe_ind_dec_mughal_ibadat_khana.a: "Issue the summons"
 oe_ind_dec_bengal_calico_silver_sink.title: "Promote the Cotton Export"
 oe_ind_dec_bengal_calico_silver_sink.desc: "Foster the cotton weaving of Bengal and Gujarat and set off a fashion for printed cottons in the capital's market. Requires Gaur, Sonargaon, Surat or Khambat; costs 200 gold and lasts 20 years."
 oe_ind_dec_bengal_calico_silver_sink.a: "Promote it"
 oe_ind.1.title: "Delhi at the Crossroads"
 oe_ind.1.desc: "The sultanate is too wide, and one distant governor after another makes himself independent. The court has strength enough for one course only."
 oe_ind.1.a: "March and bring them to heel"
 oe_ind.1.b: "Draw in and hold the heartland"
 oe_ind.2.title: "The Assembly of the Nayakas"
 oe_ind.2.desc: "The nayaka commanders have come to the capital with their tribute, elephants and horsemen, to do homage to the king at the festival of the nine nights."
 oe_ind.2.a: "Reward them generously"
 oe_ind.2.b: "Check their numbers"
 oe_ind.3.title: "Horses for Pepper"
 oe_ind.3.desc: "The sea merchants report that the horse dealers of the Gulf will bring warhorses every year, if they alone may buy our pepper."
 oe_ind.3.a: "Agree"
 oe_ind.3.b: "Buy the horses, but sell pepper to the best bidder"
 oe_ind.4.title: "The Minister of Bidar"
 oe_ind.4.desc: "The newcomers from Persia and the old Deccani nobles are at daggers drawn. The chief minister proposes to halve the provinces, cut the governors' troops and give places to both parties."
 oe_ind.4.a: "Back the minister's reforms"
 oe_ind.4.b: "The Deccanis must not be offended"
 oe_ind.5.title: "The Land between the Rivers"
 oe_ind.5.desc: "The land about Raichur is rich and strongly fortified, and the two great powers of north and south have fought over it for a hundred years. The frontier commanders report the other side is mustering again."
 oe_ind.5.a: "Strike first"
 oe_ind.5.b: "Strengthen the forts"
 oe_ind.6.title: "Strange Sails off the Coast"
 oe_ind.6.desc: "Great ships from the west have come into our seas. They announce that from now on any merchantman without one of their passes will be seized or sunk."
 oe_ind.6.a: "We will buy no passes"
 oe_ind.6.b: "Buy the passes for now and keep the trade"
 oe_ind.7.title: "The Battle at Sea"
 oe_ind.7.desc: "The league's fleet has gathered: the galleys of the coastal states and the warships sent by our allies of the Red Sea. The enemy's great ships are tall and heavily gunned. Where shall we fight?"
 oe_ind.7.a: "Draw them into the shallows and board"
 oe_ind.7.b: "Hold the harbour under the shore batteries"
 oe_ind.8.title: "Guns Change the Field"
 oe_ind.8.desc: "In a great battle in the north one side held its centre with chained gun wagons while its horsemen swept round the flanks, and beat a far larger army. Every commander is talking about it."
 oe_ind.8.a: "Train our army the same way"
 oe_ind.8.b: "Our elephants are still our strength"
 oe_ind.9.title: "The Ranks Enrolled"
 oe_ind.9.desc: "Under the new order every officer's rank, pay and quota of horsemen is written down. Some have been drawing pay for men they do not keep."
 oe_ind.9.a: "Brand the horses and muster the men"
 oe_ind.9.b: "There is no need to be harsh"
 oe_ind.10.title: "The Hall of Debate"
 oe_ind.10.desc: "The learned of every faith fill the hall and argue before the ruler through the night, at times almost coming to blows. Having heard them all, the ruler must decide."
 oe_ind.10.a: "The same peace towards every faith"
 oe_ind.10.b: "It was worth hearing, but the old ways stand"
 oe_ind.11.title: "Fine Cotton and Silver"
 oe_ind.11.desc: "Ships of every nation crowd the ports to buy muslins and printed cottons, paying in chests of silver. There are not weavers enough."
 oe_ind.11.a: "Set up more weaving shops"
 oe_ind.11.b: "Raise the customs"
 oe_ind.12.title: "The Great Festival at Srirangam"
 oe_ind.12.desc: "The great temple of Vishnu at Srirangam is holding its festival, and pilgrims come down the river from every quarter. The priests ask the king to attend and to endow the temple."
 oe_ind.12.a: "Attend, endow the temple and follow its college"
 oe_ind.12.b: "Send an envoy with our respects"
 oe_ind.12.c: "Invite the wandering poet-saints to court and follow the Bhakti devotion"
 oe_ind.13.title: "The Old Stupa and the Sacred Tree"
 oe_ind.13.desc: "There are stupas and holy places in our land a thousand years old, now knee-deep in weeds and remembered only by pilgrims from afar. Shall we restore them?"
 oe_ind.13.a: "Restore them and welcome the pilgrims"
 oe_ind.13.b: "Leave them be"
 oe_ind.14.title: "Rockets and Companies"
 oe_ind.14.desc: "The foreign companies' trading posts along the coast look more like fortresses every year. Our rocket corps is trained, and the commanders say it is time to show them who is master here."
 oe_ind.14.a: "Make ready for war"
 oe_ind.14.b: "Negotiate first and forbid further fortifying"
 oe_ind.90.title: "[Readout] The Indian Ocean and the Subcontinent"
 oe_ind.90.desc: "v11.5 Indian Ocean and Subcontinent readout (1 = yes, 0 = no):\n· This country is a protagonist #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_protagonist')|0]#!, Slot 91 has run #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_pulses')|0]#! times\n· The league against the passes exists #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_league')|0]#!, the pass system is in force #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_cartaz')|0]#!, the mission to Asia has set out #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_jesuit')|0]#!\n· Has a Mansabdari levy advance #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_mansab')|0]#!, a Hindu country with an avatar #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_avatar')|0]#!, promotes the Indian Ocean cotton and spice industry #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ind_v_industry')|0]#!"
 oe_ind.90.a: "Close"
