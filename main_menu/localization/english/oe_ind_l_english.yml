 STATIC_MODIFIER_NAME_oe_ind_warhorse_charter_mod: "The Horse Charter"
 STATIC_MODIFIER_DESC_oe_ind_warhorse_charter_mod: "Warhorses arrive by sea every year."
 STATIC_MODIFIER_NAME_oe_ind_nayaka_assembly_mod: "The Assembly of the Nayakas"
 STATIC_MODIFIER_DESC_oe_ind_nayaka_assembly_mod: "The commanders have gathered at the capital and renewed their oaths."
 STATIC_MODIFIER_NAME_oe_ind_diu_league_mod: "League against the Passes"
 STATIC_MODIFIER_DESC_oe_ind_diu_league_mod: "The coastal states have joined their fleets and refuse to buy passes from foreigners."
 STATIC_MODIFIER_NAME_oe_ind_sulh_i_kul_mod: "The Hall of Debate"
 STATIC_MODIFIER_DESC_oe_ind_sulh_i_kul_mod: "The learned of every faith debate before the ruler."
 STATIC_MODIFIER_NAME_oe_ind_mansabdar_muster_mod: "The Ranks Mustered"
 STATIC_MODIFIER_DESC_oe_ind_mansabdar_muster_mod: "Horsemen and mounts are mustered rank by rank, branded and enrolled."
 STATIC_MODIFIER_NAME_oe_ind_calico_silver_mod: "Cotton for Silver"
 STATIC_MODIFIER_DESC_oe_ind_calico_silver_mod: "Silver from far away pours in and shiploads of fine cotton go out."
 STATIC_MODIFIER_NAME_oe_ind_cotton_spice_synergy_mod: "Cotton and Spice"
 STATIC_MODIFIER_DESC_oe_ind_cotton_spice_synergy_mod: "The gain from fostering the cotton and spice industry of the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_ind_rocket_corps_mod: "The Rocket Corps"
 STATIC_MODIFIER_DESC_oe_ind_rocket_corps_mod: "A corps of rocketeers marches with the army."
