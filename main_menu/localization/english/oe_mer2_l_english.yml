 oe_mer2_target_arrears_plus_10_tt:0 "Increases recipient country's Mercenary Arrears Risk by #R +10#!."
 oe_mer2_cab_state_cannon_foundry:0 "State Cannon Foundry & Bore Standardization"
 oe_mer2_cab_state_cannon_foundry_desc:0 "Direct a cabinet minister to standardize bronze cannon casting and bore calibers across crown foundries, cutting artillery cost and raising artillery power and siege bonus against forts at a modest fiscal cost while stimulating capital ordnance demand."
 oe_mer2_cab_state_cannon_foundry_action:0 "$oe_mer2_cab_state_cannon_foundry$"
