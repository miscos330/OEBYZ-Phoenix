 oe_mer2_quartermaster_supply_demand:0 "Quartermaster Magazine Rations & Transport"
 oe_mer2_quartermaster_supply_demand_desc:0 "Quartermaster officers stock frontier magazines with grain, salt, leather harnesses, draft horses, and standard weaponry."
 oe_mer2_standing_army_ordnance_demand:0 "Standing Army Firearms & Artillery Refit"
 oe_mer2_standing_army_ordnance_demand_desc:0 "Newly chartered standing regiments commission standardized firearms, steel blades, saltpeter powder, and field cannons."
 STATIC_MODIFIER_NAME_oe_mer2_charter_condottieri:0 "Italian Condottieri Charter"
 STATIC_MODIFIER_DESC_oe_mer2_charter_condottieri:0 "We have sealed a charter with Italian condottieri captains, securing seasoned mercenary companies and siege engineers on fixed terms."
 STATIC_MODIFIER_NAME_oe_mer2_charter_swiss:0 "Swiss Reislaufer Pike Charter"
 STATIC_MODIFIER_DESC_oe_mer2_charter_swiss:0 "Disciplined Swiss pike squares hired from the Alpine cantons stiffen our battle line with formidable morale and shock power."
 STATIC_MODIFIER_NAME_oe_mer2_charter_landsknechte:0 "German Landsknechte Charter"
 STATIC_MODIFIER_DESC_oe_mer2_charter_landsknechte:0 "Regiments of German Landsknechte pikemen and arquebusiers answer our recruiting drums, expanding available mercenary manpower at reduced premiums."
 STATIC_MODIFIER_NAME_oe_mer2_charter_stradioti:0 "Stradioti & Eastern Free Horse Charter"
 STATIC_MODIFIER_DESC_oe_mer2_charter_stradioti:0 "Swift Stradioti and eastern free horsemen extend our mercenary recruiting reach and sustain far-flung campaign logistics."
 STATIC_MODIFIER_NAME_oe_mer2_charter_kriegsunternehmer:0 "Military Entrepreneur Contract"
 STATIC_MODIFIER_DESC_oe_mer2_charter_kriegsunternehmer:0 "A grand military contractor raises regiments, commissions captains, and fronts campaign credit—delivering rapid mass at the hazard of future arrears."
 STATIC_MODIFIER_NAME_oe_mer2_mercenary_desertion:0 "Subverted Mercenaries & Desertion"
 STATIC_MODIFIER_DESC_oe_mer2_mercenary_desertion:0 "Hostile agents have spread gold through our mercenary camps, undermining morale, inflating pay demands, and tempting companies to switch sides."
 STATIC_MODIFIER_NAME_oe_mer2_foreign_merc_subsidy:0 "Foreign Free Company Subsidy"
 STATIC_MODIFIER_DESC_oe_mer2_foreign_merc_subsidy:0 "Covert foreign war chests replenish our campaign treasury, helping sustain hired free companies along the front."
 STATIC_MODIFIER_NAME_oe_mer2_proxy_sponsor_influence:0 "Patron of Foreign Free Companies"
 STATIC_MODIFIER_DESC_oe_mer2_proxy_sponsor_influence:0 "By financing free companies in distant wars without risking our own levies, we project quiet diplomatic weight and prestige across rival courts."
 STATIC_MODIFIER_NAME_oe_mer2_humiliated_by_mercs:0 "Humiliated by Mercenary Ransom"
 STATIC_MODIFIER_DESC_oe_mer2_humiliated_by_mercs:0 "Forced to pay a humiliating city ransom to mutinous free companies, the crown suffers tarnished prestige and diminished authority."
 STATIC_MODIFIER_NAME_oe_mer2_sacked_city_loc:0 "Ravaged by Mutinous Free Companies"
 STATIC_MODIFIER_DESC_oe_mer2_sacked_city_loc:0 "Unpaid mercenaries looted the suburbs and damaged local defenses, leaving deep civic scars and unrest."
 STATIC_MODIFIER_NAME_oe_mer2_captain_fief_exemption:0 "Mercenary Captain Tax Immunities"
 STATIC_MODIFIER_DESC_oe_mer2_captain_fief_exemption:0 "Conceding tax-exempt fiefs to mutinous mercenary captains drains fiscal efficiency and alienates established landed nobles."
 STATIC_MODIFIER_NAME_oe_mer2_warlord_autonomy:0 "Autonomous Warlord Quartering"
 STATIC_MODIFIER_DESC_oe_mer2_warlord_autonomy:0 "Allowing military contractors to levy contributions directly from provinces relieves immediate upkeep while eroding crown control."
 STATIC_MODIFIER_NAME_oe_mer2_loyal_guard_counterattack:0 "Loyal Household Guard Counterstroke"
 STATIC_MODIFIER_DESC_oe_mer2_loyal_guard_counterattack:0 "Loyal household troops storm mutineer camps with ruthless speed, steadying military discipline and slowing rebel escalation."
 STATIC_MODIFIER_NAME_oe_mer2_emergency_double_pay:0 "Emergency Double Pay Retainer"
 STATIC_MODIFIER_DESC_oe_mer2_emergency_double_pay:0 "Paying an emergency double retainer defeated enemy subversion and steadied front-line morale at steep mercenary upkeep."
 STATIC_MODIFIER_NAME_oe_mer2_mutiny_suppressed:0 "Mutiny Suppressed & Martial Order Restored"
 STATIC_MODIFIER_DESC_oe_mer2_mutiny_suppressed:0 "Emerging from the ordeal of free company mutiny, the crown enforces stricter martial ordinances and hard-won command authority."
 STATIC_MODIFIER_NAME_oe_mer2_veteran_settlement_loc:0 "Demobilized Veteran Frontier Settlement"
 STATIC_MODIFIER_DESC_oe_mer2_veteran_settlement_loc:0 "Honorably discharged veterans settled on borderlands convert restless swords into prosperous, well-defended frontier homesteads."
 STATIC_MODIFIER_NAME_oe_mer2_royal_cannon_foundry:0 "Royal State Cannon Foundry"
 STATIC_MODIFIER_DESC_oe_mer2_royal_cannon_foundry:0 "A permanent crown-run ordnance foundry standardizing bronze casting, powder charges, and caliber cuts artillery costs and sharpens siege firepower."
 STATIC_MODIFIER_NAME_oe_mer2_standing_army_reformed:0 "Reformed Standing Army Charter"
 STATIC_MODIFIER_DESC_oe_mer2_standing_army_reformed:0 "Having abolished private condottieri contracting in favor of state-salaried regiments and quartermaster magazines, our realm enjoys disciplined standing forces and lasting immunity from free company mutinies."
 STATIC_MODIFIER_NAME_oe_mer2_artillery_cadre_bonus:0 "Royal Artillery Proving Cadre"
 STATIC_MODIFIER_DESC_oe_mer2_artillery_cadre_bonus:0 "Dedicated gunnery instructors and proving-ground trials sharpen artillery batteries against fortified ramparts."
 STATIC_MODIFIER_NAME_oe_mer2_officer_corps_charter:0 "Professional Officer Corps Ordinance"
 STATIC_MODIFIER_DESC_oe_mer2_officer_corps_charter:0 "Merit-based commissions and permanent military academies replace private captains, cultivating enduring army tradition and leaner upkeep."
 oe_mer2_free_company_mutiny:0 "Free Company Mutiny"
 oe_mer2_free_company_mutiny_desc:0 "Years of relying on hired companies without paying off their arrears have ignited a perilous mutiny. Unpaid free companies refuse to disband, extorting city ransoms and tax-exempt fiefs under threat of sack and pillage. Only restoring solvency and stability while disbanding mercenaries—or enacting a permanent standing army reform—can end the crisis."
 oe_mer2_rd_free_company_ransom:0 "Free Company Ransom & Indemnity"
 oe_mer2_rd_free_company_ransom_desc:0 "Mutinous free companies demand a hefty city ransom and full indemnity from the crown, tarnishing royal prestige and authority for a decade."
 oe_mer2_free_company_mutineers:0 "Mutinous Free Company"
