 oe_mer2_charter_condottieri_contract_desc:0 "Pay a signing fee to a non-hostile patron to charter a 5-year regional mercenary company (Italian Condottieri, Swiss Reislaufer, German Landsknechte, Eastern Stradioti, or Military Entrepreneurs). Each contract raises mercenary arrears risk by #R +20#!, risking a post-war Free Company Mutiny."
