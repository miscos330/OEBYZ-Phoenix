 oe_mer2_arrears_risk_plus_20_tt:0 "Raises our Mercenary Arrears Risk by #R +20#! (capped at 100; reaching #Y 40#! during fiscal distress can trigger the Free Company Mutiny disaster)."
 oe_mer2_poach_enemy_mercenaries:0 "Subvert Enemy Mercenaries"
 oe_mer2_poach_enemy_mercenaries_desc:0 "Spend #Y 30#! spy network and treasury gold during wartime to bribe hostile mercenary camps, inflicting 2 years of Subverted Mercenaries & Desertion, adding #R +18#! arrears risk, and forcing the enemy to pay double retainers or suffer desertion."
 oe_mer2_poach_enemy_mercenaries_act:0 "Bribe and subvert mercenaries fighting for [SCOPE.sCountry('recipient').GetName]"
