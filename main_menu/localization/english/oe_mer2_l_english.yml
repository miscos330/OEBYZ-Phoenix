 oe_mer2_cab_state_cannon_foundry_action_progress_tooltip:0 "Standardizes state bronze artillery casting and calibers, cutting artillery build costs while improving artillery combat power and fort siege bonus at a slight tax efficiency cost."
 oe_mer2_cab_quartermaster_magazines:0 "Quartermaster & Supply Magazines"
 oe_mer2_cab_quartermaster_magazines_desc:0 "Establish standing army magazines and quartermaster depots in a controlled province, extending national army logistics distance, lowering upkeep, and expanding local supply limits and food capacity at the price of mild peasant requisition pressure."
 oe_mer2_cab_quartermaster_magazines_active:0 "Operating Quartermaster Magazines in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
