 oe_mer2_demobilize_cd_tt:0 "At least #Y 5#! years have elapsed since the last honorable demobilization."
 oe_mer2_mil_50_tt:0 "Ruler, regent, or at least one cabinet minister has #Y 50#! or higher Military skill."
 oe_mer2_no_mutiny_or_low_risk_tt:0 "Not currently suffering Free Company Mutiny, or Mercenary Arrears Risk has been reduced to #Y 20#! or below."
 oe_mer2_dec_demobilize_free_companies.title:0 "Demobilize & Settle Free Companies"
 oe_mer2_dec_demobilize_free_companies.desc:0 "Rather than letting unpaid mercenaries turn into brigands after campaign's end, disburse an honorable discharge bounty and grant frontier homesteads so battle-hardened veterans settle peacefully along the marches."
 oe_mer2_dec_demobilize_free_companies.a:0 "Issue the Demobilization & Frontier Settlement Edict"
 oe_mer2_dec_demobilize_free_companies.a.tt:0 "Pays a bounded discharge stipend, cuts Mercenary Arrears Risk by #G -35#!, grants 5 years of Demobilized Veteran Frontier Settlement to a border location (5-year cooldown), and triggers a follow-up settlement event."
 oe_mer2_dec_artillery_standardization.title:0 "Establish Royal State Cannon Foundry"
 oe_mer2_dec_artillery_standardization.desc:0 "Private workshops cast mismatched barrels with erratic charges unfit for modern sieges. Consolidating master founders, bronze stocks, and saltpeter under a permanent crown foundry ushers our realm into the age of standardized gunpowder logistics."
 oe_mer2_dec_artillery_standardization.a:0 "Charter the Royal State Cannon Foundry"
 oe_mer2_dec_artillery_standardization.a.tt:0 "Invests crown funds to gain the permanent Royal State Cannon Foundry modifier (-10% artillery build cost, -10% artillery upkeep, +8% siege ability), injects 4 years of capital ordnance demand, and fires the commissioning event."
 oe_mer2_dec_abolish_condottieri_system.title:0 "Abolish Condottieri & Charter Standing Army"
 oe_mer2_dec_abolish_condottieri_system.desc:0 "Private condottieri contracts win frantic seasons yet hold the treasury hostage when peace returns. With gunpowder ordnance and quartermaster depots matured, the hour has come to abolish private contracting and charter a salaried professional standing army."
 oe_mer2_dec_abolish_condottieri_system.a:0 "Proclaim the Standing Army Charter"
 oe_mer2_dec_abolish_condottieri_system.a.tt:0 "Abolishes active regional condottieri charters, resets arrears risk to zero, grants the permanent Reformed Standing Army Charter (+3% discipline, +15% logistics distance, +10% manpower, +25% mercenary hire premium) with permanent immunity to Free Company Mutiny, and triggers the reform event."
 oe_mer2.1.title:0 "Outbreak of the Free Company Mutiny"
 oe_mer2.1.desc:0 "With the treasury strained and months of campaign pay overdue, fury erupts across our mercenary camps. Echoing the dark chronicles of Thrace and Rome, free company captains tear up their articles of service and refuse to disarm—declaring that if the crown will not settle its arrears, their men will collect their wages directly from the realm's cities."
 oe_mer2.1.a:0 "Disburse Emergency Pay to Calm the Camps"
 oe_mer2.1.a.tt:0 "Disburses an emergency pay chest, reducing Mercenary Arrears Risk by #G -15#! and steadying domestic stability."
 oe_mer2.1.b:0 "Refuse Extortion and Place Loyal Troops on Alert"
 oe_mer2.1.b.tt:0 "Endures a drop in stability in exchange for army tradition and a modest #G -5#! reduction in arrears risk."
 oe_mer2.2.title:0 "Free Companies at the Gates: City Ransom"
 oe_mer2.2.desc:0 "A rogue free company has surrounded the outer walls of [SCOPE.sLocation('oe_mer2_target_loc').GetName] under torchlight. Their captains deliver an ultimatum: pay the full ransom stipulated in the Free Company Ransom Charter before dawn, or watch them unleash three days of sack and fire upon the city."
 oe_mer2.2.a:0 "Pay the Mutineer Ransom Charter to Spare the City"
 oe_mer2.2.a.tt:0 "Enforces the Free Company Ransom & Indemnity demand immediately: pays a heavy city ransom and incurs 10 years of Humiliated by Mercenary Ransom, while dispersing this mutiny and cutting arrears risk by #G -30#!."
 oe_mer2.2.b:0 "Defy the Ultimatum and Fight the Mutineers"
 oe_mer2.2.b.tt:0 "[SCOPE.sLocation('oe_mer2_target_loc').GetName] suffers 5 years of Ravaged by Mutinous Free Companies and mutineer rebels rally with increased progress, while our loyal forces gain army tradition."
 oe_mer2.3.title:0 "Mercenary Captain Demands Fiefs & Tax Immunities"
 oe_mer2.3.desc:0 "A mercenary captain quartered near [SCOPE.sLocation('oe_mer2_target_loc').GetName] has detained crown tax collectors and demands hereditary tax-exempt fiefs in lieu of overdue wages. Traditional nobles bristle at this upstart extortion while local burghers await the crown's decree."
 oe_mer2.3.a:0 "Grant Temporary Tax-Exempt Fiefs to Pacify the Band"
 oe_mer2.3.a.tt:0 "Disperses the mutineer faction and cuts arrears risk by #G -20#!, but inflicts 8 years of Mercenary Captain Tax Immunities and angers the nobility."
 oe_mer2.3.b:0 "Refuse Land Grants and Pay Off the Ransom Charter"
 oe_mer2.3.b.tt:0 "Executes the Free Company Ransom & Indemnity concession with crown gold, preserving feudal tenure while cutting arrears risk by #G -30#!."
 oe_mer2.3.c:0 "Denounce Them as Traitors and Take Up Arms"
 oe_mer2.3.c.tt:0 "Upholds royal prestige, but the Mutinous Free Company rallies disaffected pops in [SCOPE.sLocation('oe_mer2_target_loc').GetName] and advances rebel progress."
 oe_mer2.4.title:0 "Shadow of Wallenstein: Warlord Autonomy"
 oe_mer2.4.desc:0 "A powerful military contractor submits an ominous proposal: since the royal treasury is stretched thin, he offers to finance his regiments directly by levying province-wide war contributions—provided the crown ceases to interfere with his officer appointments. Ministers recoil at the prospect of a state within the state."
 oe_mer2.4.a:0 "Permit Autonomous Warlord Quartering for Now"
 oe_mer2.4.a.tt:0 "Relieves immediate treasury cash flow and cuts arrears risk by #G -15#!, but imposes 6 years of Autonomous Warlord Quartering that erodes control and crown power."
 oe_mer2.4.b:0 "Dispatch Loyal Agents to Strip His Command"
 oe_mer2.4.b.tt:0 "Causes short-term stability shock while cutting arrears risk by #G -25#!, lifting army tradition, and crushing warlord ambitions."
 oe_mer2.5.title:0 "Loyal Household Guard Counterstroke"
 oe_mer2.5.desc:0 "Quarrels over plunder have fractured the mutineers' camp, leaving their main bivouac poorly guarded. The commander of our loyal household guard volunteers to launch a swift night strike against the ringleaders and break the mutiny's spine."
 oe_mer2.5.a:0 "Unleash the Household Guard Against the Mutineer Camp"
 oe_mer2.5.a.tt:0 "Grants 3 years of Loyal Household Guard Counterstroke, cuts arrears risk by #G -20#!, and restores stability."
 oe_mer2.5.b:0 "Execute Ringleaders and Enlist Repentant Veterans"
 oe_mer2.5.b.tt:0 "Pays a modest enlistment stipend, lowers arrears risk by #G -25#!, and boosts army tradition."
 oe_mer2.6.title:0 "Enemy Gold Subverts Our Hired Mercenaries"
 oe_mer2.6.desc:0 "Urgent dispatches arrive from the front: enemy agents have infiltrated our mercenary lines with chests of gold, promising double pay to any company that lays down arms or changes sides. Several squadrons have already deserted, and the remaining captains clamor for an immediate matching bounty."
 oe_mer2.6.a:0 "Endure the Desertions and Hold the Line with Native Troops"
 oe_mer2.6.a.tt:0 "Preserves treasury funds and adds modest army tradition while enduring the 2-year Subverted Mercenaries & Desertion penalty."
 oe_mer2.6.b:0 "Disburse Emergency Double Pay to Retain Their Loyalty"
 oe_mer2.6.b.tt:0 "Spends substantial gold to clear Subverted Mercenaries & Desertion and cut arrears risk by #G -12#!, replacing it with 2 years of Emergency Double Pay Retainer."
 oe_mer2.7.title:0 "End of the Free Company Mutiny"
 oe_mer2.7.desc:0 "As the last unpaid free company surrenders its standards or disperses under royal escort, the nightmare of mercenary mutiny finally subsides. Scarred highways and drained coffers leave an unmistakable lesson: lasting security requires state-run artillery foundries and a disciplined standing army."
 oe_mer2.7.a:0 "Promulgate New Articles of War"
 oe_mer2.7.a.tt:0 "Grants 10 years of Mutiny Suppressed & Martial Order Restored alongside stability and prestige."
 oe_mer2.7.b:0 "Channel Reform Momentum into Quartermaster Logistics"
 oe_mer2.7.b.tt:0 "Grants 10 years of Mutiny Suppressed & Martial Order Restored, adds army tradition, and injects 3 years of quartermaster demand into the capital market."
 oe_mer2.8.title:0 "Honorable Demobilization & Frontier Settlement"
 oe_mer2.8.desc:0 "Under the watchful eyes of royal muster clerks, veteran mercenaries receive their discharge silver and borderland deeds, grounding pikes cleanly before setting out with their families. Once-feared free companies now anchor our frontier marches in peace."
 oe_mer2.8.a:0 "Confirm Their Homestead Charters and Reassure the Commons"
 oe_mer2.8.a.tt:0 "Grants modest stability, prestige, and peasant estate satisfaction."
 oe_mer2.8.b:0 "Recruit Distinguished Veterans as Drill Instructors"
 oe_mer2.8.b.tt:0 "Grants army tradition and lowers Mercenary Arrears Risk by an additional #G -5#!."
 oe_mer2.9.title:0 "Commissioning of the Royal State Cannon Foundry"
 oe_mer2.9.desc:0 "Furnace light bathes the vaulted halls of the new Royal State Cannon Foundry as the first batch of bore-standardized bronze siege pieces roars across the proving ground, shattering test masonry at a hundred paces. Ordnance casting and powder logistics now belong squarely to the crown."
 oe_mer2.9.a:0 "Establish the Royal Artillery Proving Cadre"
 oe_mer2.9.a.tt:0 "Grants 10 years of Royal Artillery Proving Cadre (+6% artillery power, +1 artillery bonus vs forts) alongside army tradition and prestige."
 oe_mer2.9.b:0 "Grant Domestic Guild Contracts for Bronze & Saltpeter"
 oe_mer2.9.b.tt:0 "Injects 3 additional years of cannon foundry raw-material demand into the capital market, raises stability, and pleases the burgher estate."
 oe_mer2.10.title:0 "Charter of the Professional Standing Army"
 oe_mer2.10.desc:0 "To the roll of drums and peal of bells, the Charter of the Standing Army is proclaimed throughout the realm. Private condottieri contracting is abolished forever; henceforth regiments serve directly under crown colors, fed by royal magazines and led by commissioned officers. The turbulent age of mutinous free companies has ended."
 oe_mer2.10.a:0 "Enact the Professional Officer Corps Ordinance"
 oe_mer2.10.a.tt:0 "Grants 15 years of Professional Officer Corps Ordinance (+0.15 monthly army tradition, +5% army maintenance efficiency) plus prestige, army tradition, and stability."
 oe_mer2.10.b:0 "Anchor the Reform with National Quartermaster Contracts"
 oe_mer2.10.b.tt:0 "Injects 4 years of quartermaster supply demand into the capital market, raises stability, and reassures both nobles and burghers."
