 oe_mer2_subsidize_free_company:0 "Subsidize Foreign Free Company"
 oe_mer2_subsidize_free_company_desc:0 "Secretly transfer war funds to a country fighting a third party: the recipient gains 3 years of Foreign Free Company Subsidy and warmer opinion while we gain Patron diplomatic reputation—leaving the recipient with #R +10#! post-war arrears risk."
 oe_mer2_subsidize_free_company_act:0 "Subsidize wartime free companies for [SCOPE.sCountry('recipient').GetName]"
 oe_mer2_subsidize_free_company_effect_text:0 "[SCOPE.sCountry('actor').GetName] secretly subsidizes free companies for [SCOPE.sCountry('recipient').GetName]."
