 oe_mer2_cab_quartermaster_magazines_action_progress_long_wordier:0 "Standing Army Quartermaster Magazines Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_mer2_cab_quartermaster_magazines_action_progress_tooltip:0 "Maintains forward grain and ordnance magazines to expand national army logistics reach, reduce maintenance, and raise provincial supply limit and food capacity."
 oe_mer2_quartermaster_select_province:0 "Select Province for Quartermaster Magazines"
 oe_mer2_quartermaster_no_provinces:0 "@trigger_no! No owned and controlled province is available for Quartermaster Magazines."
