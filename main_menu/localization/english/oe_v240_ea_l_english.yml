# NEW 2026-11-24 v24.0 Phase 2D-2E Early-1337 Historical Opening Depth Pack (oe_v240_ea_, gen_v240_1337_asia_afr_amer_depth.py) — english localization (227 keys). Edit gen_v240_1337_asia_afr_amer_depth.py, not this file.
 STATIC_MODIFIER_NAME_oe_v240_ea_srb_sabzevar_march:0 "Sarbadar March on Sabzevar"
 STATIC_MODIFIER_DESC_oe_v240_ea_srb_sabzevar_march:0 "Vowing to hang rather than bow to Mongol tax extortion, the Bashtin insurgents surge toward Sabzevar with fierce siege resolve."
 STATIC_MODIFIER_NAME_oe_v240_ea_srb_dervish_commune:0 "Bashtin Dervish Commonwealth"
 STATIC_MODIFIER_DESC_oe_v240_ea_srb_dervish_commune:0 "Guided by Shaykh Khalifa's dervish circles, artisans and villagers fortify Bashtin in tightly knit communal solidarity."
 STATIC_MODIFIER_NAME_oe_v240_ea_inj_fars_campaign:0 "Inju Campaign for Fars & Yazd"
 STATIC_MODIFIER_DESC_oe_v240_ea_inj_fars_campaign:0 "Shiraz mobilizes Persian horse and siege trains to contest Yazd and Kerman against the rising Muzaffarids."
 STATIC_MODIFIER_NAME_oe_v240_ea_inj_shiraz_court:0 "Court of Shiraz Poets & Merchants"
 STATIC_MODIFIER_DESC_oe_v240_ea_inj_shiraz_court:0 "Royal patronage of Persian letters and Gulf caravan houses turns Shiraz into the brightest cultural and commercial beacon of southern Iran."
 STATIC_MODIFIER_NAME_oe_v240_ea_krt_herat_autonomy:0 "Kartid Autonomy of Herat"
 STATIC_MODIFIER_DESC_oe_v240_ea_krt_herat_autonomy:0 "Throwing off Togha Temur's fading overlordship, Malik Husayn fortifies Herat as a disciplined autonomous bulwark in eastern Khorasan."
 STATIC_MODIFIER_NAME_oe_v240_ea_krt_silk_caravans:0 "Herat Silk-Caravan Emporium"
 STATIC_MODIFIER_DESC_oe_v240_ea_krt_silk_caravans:0 "Balancing Khorasan diplomacy allows Herat's bazaars to capture overland caravan revenue linking Transoxiana, Iran, and India."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_ayas_treaty:0 "1337 Treaty of Ayas Concessions"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_ayas_treaty:0 "With Cilician Armenia forced to surrender Ayas and pay heavy tribute, Mamluk customs and prestige command the northeastern Levant."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_levant_peace:0 "Northern Levant Frontier Truce"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_levant_peace:0 "A measured truce along the Taurus frontier trims garrison upkeep in Syria while keeping Mediterranean spice shipping brisk."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_citadel_supremacy:0 "Supremacy of the Cairo Citadel"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_citadel_supremacy:0 "Banishing the Abbasid Caliph to Qus leaves the Citadel diwan firmly in command of Cairo's administration and revenues."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_caliphal_sanction:0 "Sanction of the Cairo Caliphate"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_caliphal_sanction:0 "Honoring the Abbasid Caliph in Cairo wins the warm backing of the ulama and elevates Mamluk standing across the Islamic world."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_bahri_compact:0 "Bahri Amirs & Niyabat Compact"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_bahri_compact:0 "A carefully brokered power-sharing pact among Cairo's amirs and the Syrian na'ibs steadies the Bahri succession."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_citadel_purge:0 "Cairo Citadel Guard Purge"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_citadel_purge:0 "Ruthless purges by the royal mamluk household centralize power in Cairo and sharpen heavy cavalry discipline at Syria's expense."
 STATIC_MODIFIER_NAME_oe_v240_ea_mam_karak_arbitration:0 "Karak Treasury & Syrian Levies"
 STATIC_MODIFIER_DESC_oe_v240_ea_mam_karak_arbitration:0 "Drawing upon the fortress-treasury of Karak and Syrian frontier troops bolsters Mamluk morale, manpower, and defensive grit."
 STATIC_MODIFIER_NAME_oe_v240_ea_sgn_fakhruddin_revolt:0 "Fakhruddin's Sonargaon Independence"
 STATIC_MODIFIER_DESC_oe_v240_ea_sgn_fakhruddin_revolt:0 "Proclaiming independence at Sonargaon, Sultan Fakhruddin Mubarak Shah rallies Bengal delta levies and riverine fleets against Delhi."
 STATIC_MODIFIER_NAME_oe_v240_ea_sgn_delta_charter:0 "Chartered Delta Viceroyalty"
 STATIC_MODIFIER_DESC_oe_v240_ea_sgn_delta_charter:0 "Maintaining formal ties with Delhi secures commercial autonomy for Sonargaon's famed muslins and eastern delta ports."
 STATIC_MODIFIER_NAME_oe_v240_ea_stn_ilyas_bid:0 "Ilyas Shah's Bid for Bengal"
 STATIC_MODIFIER_DESC_oe_v240_ea_stn_ilyas_bid:0 "Casting off Tughluq vassalage from Satgaon, Shamsuddin Ilyas Shah drills disciplined hosts to unite Gaur, Pandua, and Sonargaon."
 STATIC_MODIFIER_NAME_oe_v240_ea_stn_satgaon_port:0 "Satgaon Golden River Emporium"
 STATIC_MODIFIER_DESC_oe_v240_ea_stn_satgaon_port:0 "Expanding docks and customs houses on the Hooghly transforms Satgaon into western Bengal's richest maritime gateway."
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_shahmir_stewardship:0 "Shah Mir's Valley Stewardship"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_shahmir_stewardship:0 "Minister Shah Mir restores tax registers, granaries, and mountain garrisons across the scarred Kashmir valley."
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_kota_rani_guard:0 "Kota Rani's Damara Guard"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_kota_rani_guard:0 "Queen Kota Rani binds Kashmir's Damara hill lords to the ancient throne with fervent loyalty and martial grit."
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_shah_mir_sultanate:0 "Shah Mir Sultanate of Kashmir"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_shah_mir_sultanate:0 "Crowned Sultan Shams al-Din, Shah Mir pairs light taxation and Persianate learning with pragmatic tolerance toward valley subjects."
 STATIC_MODIFIER_NAME_oe_v240_ea_ksh_lohara_restoration:0 "Lohara Mountain Restoration"
 STATIC_MODIFIER_DESC_oe_v240_ea_ksh_lohara_restoration:0 "Repulsing the coup at Indarkot preserves Kashmir's ancient Hindu monarchy behind an unyielding ring of Himalayan fortresses."
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_sondhar_relief:0 "Tughluq Sondhar Famine Loans"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_sondhar_relief:0 "After crushing the Awadh mutiny from Sargadwari, the Sultan issues sondhar agricultural loans to revive the famine-stricken Doab."
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_awadh_granary:0 "Awadh-Jaunpur Granary Accord"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_awadh_granary:0 "Confirming Ain al-Mulk in Awadh-Jaunpur secures uninterrupted grain convoys to the Doab and calms the eastern iqta lords."
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_khammar_purge:0 "Dhar Purge of the Amiran-i-Sada"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_khammar_purge:0 "Backing Aziz Khammar's bloody crackdown at Dhar strengthens central authority and tax yields while straining viceregal trust."
 STATIC_MODIFIER_NAME_oe_v240_ea_dlh_centurion_compact:0 "Malwa-Deccan Centurion Charter"
 STATIC_MODIFIER_DESC_oe_v240_ea_dlh_centurion_compact:0 "Recalling Aziz Khammar and confirming the Amiran-i-Sada's iqta charters restores vital harmony across Malwa and the Deccan."
 STATIC_MODIFIER_NAME_oe_v240_ea_stc_yoshino_resolve:0 "Yoshino Loyalist Resolve"
 STATIC_MODIFIER_DESC_oe_v240_ea_stc_yoshino_resolve:0 "Grief over Kanegasaki steels the Southern Court's loyalists as Kitabatake Akiie rallies fresh hosts to strike back toward Kyoto."
 STATIC_MODIFIER_NAME_oe_v240_ea_stc_imperial_regalia:0 "Sanctuary of the Imperial Regalia"
 STATIC_MODIFIER_DESC_oe_v240_ea_stc_imperial_regalia:0 "Fortifying the mountain shrine of Yoshino while dispatching imperial princes to distant provinces upholds the Southern Court's legitimacy."
 STATIC_MODIFIER_NAME_oe_v240_ea_jap_kemmu_shikimoku:0 "Kemmu Formulary Governance"
 STATIC_MODIFIER_DESC_oe_v240_ea_jap_kemmu_shikimoku:0 "Following his 1338 investiture as Shogun, Takauji anchors the Muromachi Bakufu in the Kemmu Formulary and Tadayoshi's Kyoto courts."
 STATIC_MODIFIER_NAME_oe_v240_ea_jap_shugo_network:0 "Muromachi Shugo Constable Network"
 STATIC_MODIFIER_DESC_oe_v240_ea_jap_shugo_network:0 "Granting broad Shugo constabulary rights to warrior houses binds Japan's battle-hardened clans firmly to the new Shogunate."
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_irrawaddy_claim:0 "Pinya Irrawaddy Primacy"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_irrawaddy_claim:0 "Asserting seniority over Pagan's ancient heartland, Pinya musters river levies and war elephants to challenge rival Sagaing."
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_kyaukse_canals:0 "Kyaukse Rice-Granary Canals"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_kyaukse_canals:0 "Restoring the ancient irrigation canals of the Kyaukse rice bowl fills Pinya's granaries and strengthens its riverine heartland."
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_kyawswa_elephants:0 "Kyawswa I's Five-Elephant Guard"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_kyawswa_elephants:0 "King Kyawswa I, Lord of Five White Elephants, welds royal elephant shock troops and provincial vassals into a formidable Pinya realm."
 STATIC_MODIFIER_NAME_oe_v240_ea_pin_sangha_compact:0 "Pinya Sangha & Vassal Compact"
 STATIC_MODIFIER_DESC_oe_v240_ea_pin_sangha_compact:0 "Honoring the Theravada Sangha and confirming the charters of Toungoo and Prome builds enduring harmony across Upper Burma."
 STATIC_MODIFIER_NAME_oe_v240_ea_sag_shan_marches:0 "Sagaing Northern Shan Stockades"
 STATIC_MODIFIER_DESC_oe_v240_ea_sag_shan_marches:0 "Timber stockades and river watchposts along the upper Chindwin brace Sagaing against mounting Maw Shan incursions."
 STATIC_MODIFIER_NAME_oe_v240_ea_sag_river_toll:0 "Sagaing Confluence River Tolls"
 STATIC_MODIFIER_DESC_oe_v240_ea_sag_river_toll:0 "Calm river diplomacy turns the Chindwin-Irrawaddy confluence into a steady customs revenue artery for Sagaing."
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_minh_tong_regency:0 "Tran Minh Tong's Imperial Regency"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_minh_tong_regency:0 "Ruling as Retired Emperor at Thang Long, Tran Minh Tong promotes upright scholars like Chu Van An to keep Dai Viet steady and learned."
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_tran_princes:0 "Tran Royal Princes & Thanh Hoa Garrisons"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_tran_princes:0 "Entrusting Tran princes with standing regiments and Thanh Hoa frontier forts fortifies Dai Viet's martial backbone."
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_champa_claim:0 "Dai Viet Champa Intervention"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_champa_claim:0 "Sheltering exiled Cham prince Che Mo gives Dai Viet both sea galleys and siege momentum to press south toward Vijaya."
 STATIC_MODIFIER_NAME_oe_v240_ea_dai_southern_watch:0 "Tonkin Gulf Watch & Van Don Trade"
 STATIC_MODIFIER_DESC_oe_v240_ea_dai_southern_watch:0 "Holding the southern passes while strengthening Van Don's port turns Gulf of Tonkin shipping into steady wealth and security."
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_amda_katama:0 "Amda Seyon's Royal Katama Host"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_amda_katama:0 "Emperor Amda Seyon's mobile royal camp projects iron Solomonic discipline and commands loyal obedience from Tigray to Shoa."
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_monastic_accord:0 "Highland Monastic Reconciliation"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_monastic_accord:0 "Reconciling with Ethiopia's outspoken monasteries enriches Ge'ez scholarship and deepens popular devotion to the Solomonic crown."
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_ifat_march:0 "Ifat Frontier Marches"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_ifat_march:0 "Fortified eastern marches along the rift escarpment keep the Walashma lords of Ifat in check and assert highland dominance toward Zeila."
 STATIC_MODIFIER_NAME_oe_v240_ea_eth_zeila_caravans:0 "Highland-to-Zeila Caravan Accord"
 STATIC_MODIFIER_DESC_oe_v240_ea_eth_zeila_caravans:0 "Guaranteed caravan corridors linking Shoa's markets to the Red Sea port of Zeila swell customs coffers for court and merchant alike."
 STATIC_MODIFIER_NAME_oe_v240_ea_son_ali_kolon_revival:0 "Ali Kolon's Sonni Revival at Gao"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_ali_kolon_revival:0 "Escaping Mali's court at Niani, Ali Kolon raises the independent Sonni standard over Gao and ignites Songhai martial pride."
 STATIC_MODIFIER_NAME_oe_v240_ea_son_niger_armory:0 "Gao Quiet Armory & Salt Trade"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_niger_armory:0 "Masking ambition behind diplomatic tribute lets Gao stockpile gold, salt revenues, and riverbank defenses in relative safety."
 STATIC_MODIFIER_NAME_oe_v240_ea_son_sorko_flotilla:0 "Sorko River Flotilla"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_sorko_flotilla:0 "Master Sorko boatmen transform the Niger River into a fast highway for Songhai war canoes and mercantile patrols."
 STATIC_MODIFIER_NAME_oe_v240_ea_son_gao_entrepot:0 "Gao Trans-Saharan Entrepot"
 STATIC_MODIFIER_DESC_oe_v240_ea_son_gao_entrepot:0 "Maghrebi salt caravans and jurists gathering at Gao elevate the city's merchant clout and scholarly vitality."
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_tlatelolco_market:0 "Twin-Island Tlatelolco Market"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_tlatelolco_market:0 "Chartering the northern islet of Tlatelolco as a bustling partner market draws canoes and traders from across the Valley of Mexico."
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_tenoch_order:0 "Tenoch's Central Temple Authority"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_tenoch_order:0 "Elder Tenoch binds the lake settlements under strict temple discipline, hardening Tenochtitlan's unity and causeway defenses."
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_tepanec_auxiliaries:0 "Tepanec Campaign Auxiliaries"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_tepanec_auxiliaries:0 "Serving as Azcapotzalco's deadliest mercenary vanguard forges hardened Mexica warrior discipline across Lake Texcoco."
 STATIC_MODIFIER_NAME_oe_v240_ea_tnc_lake_autonomy:0 "Chinampa Surplus & Lake Diplomacy"
 STATIC_MODIFIER_DESC_oe_v240_ea_tnc_lake_autonomy:0 "Quietly conserving chinampa harvests while courting Tetzcoco's lords strengthens Tenochtitlan's fiscal and diplomatic resilience."
 STATIC_MODIFIER_NAME_oe_v240_ea_chm_nancenpinco_conquest:0 "Nancenpinco's Coastal Campaigns"
 STATIC_MODIFIER_DESC_oe_v240_ea_chm_nancenpinco_conquest:0 "King Nancenpinco leads disciplined Chimor columns up and down the desert valleys, extending Chan Chan's rule across the Peruvian coast."
 STATIC_MODIFIER_NAME_oe_v240_ea_chm_chan_chan_canals:0 "Chan Chan Irrigation & Goldsmiths"
 STATIC_MODIFIER_DESC_oe_v240_ea_chm_chan_chan_canals:0 "Monumental Moche valley canals and Chan Chan's renowned goldsmith workshops pour wealth and administrative order into Chimor."
 STATIC_MODIFIER_NAME_oe_v240_ea_coc_mercenary_guard:0 "Cocom Tabasco Mercenary Guard"
 STATIC_MODIFIER_DESC_oe_v240_ea_coc_mercenary_guard:0 "Foreign mercenary guards from Tabasco enforce Cocom hegemony inside Mayapan's walls with disciplined shock power."
 STATIC_MODIFIER_NAME_oe_v240_ea_coc_multepal_council:0 "Renewed Multepal League Council"
 STATIC_MODIFIER_DESC_oe_v240_ea_coc_multepal_council:0 "Honoring the ancient Multepal joint council calms noble rivals in Mani and keeps Yucatan's salt and cacao trade thriving."
 STATIC_MODIFIER_NAME_oe_v240_ea_xiu_uxmal_revival:0 "Tutul Xiu Western Coalition"
 STATIC_MODIFIER_DESC_oe_v240_ea_xiu_uxmal_revival:0 "Invoking Uxmal's ancient renown, the Tutul Xiu rally western Maya batabs for an eventual reckoning with Mayapan."
 STATIC_MODIFIER_NAME_oe_v240_ea_xiu_mani_prosperity:0 "Mani Cacao & Salt Prosperity"
 STATIC_MODIFIER_DESC_oe_v240_ea_xiu_mani_prosperity:0 "Cultivating Mani's fertile hills, cacao groves, and salt trade builds quiet strength beneath Mayapan's watch."
 oe_v240_ea.1.t:0 "The Banners of Bashtin: March on Sabzevar"
 oe_v240_ea.1.d:0 "In the spring of 1337, Abd al-Razzaq ibn Fazlullah raised the Sarbadar rebellion at Bashtin after villagers struck down abusive Ilkhanid tax officials, swearing they would rather swing from the gallows than submit again. With Togha Temur's western expedition faltering, the walled city of Sabzevar lies within striking distance — shall our insurgents storm Sabzevar at once or first knit Shaykh Khalifa's dervish circles into an impregnable mountain commune?"
 oe_v240_ea.1.a:0 "Storm Sabzevar and proclaim the Sarbadar Commonwealth"
 oe_v240_ea.1.b:0 "Fortify Bashtin with Shaykh Khalifa's dervish brotherhood"
 oe_v240_ea.2.t:0 "Fars and Yazd: The Inju-Muzaffarid Struggle"
 oe_v240_ea.2.d:0 "As the Ilkhanate shatters into rival successor courts, Shiraz and Yazd stand locked in a bitter contest for southern Iran. Across the desert roads, Mubariz al-Din Muhammad of the Muzaffarids has seized Kerman and eyes Fars itself, while poets and silk merchants crowd the gardens of Shiraz. Shall the Inju house ride east to crush Yazd before Mubariz al-Din grows unstoppable, or turn Shiraz into a dazzling cultural capital whose wealth outshines its rivals?"
 oe_v240_ea.2.a:0 "Challenge Mubariz al-Din for Yazd and supremacy in southern Iran"
 oe_v240_ea.2.b:0 "Patronize Shiraz's poets, scholars, and Persian Gulf caravan guilds"
 oe_v240_ea.3.t:0 "Herat Between Gorgan and Sabzevar: Kartid Autonomy"
 oe_v240_ea.3.d:0 "From the citadel of Herat, Malik Mu'izz al-Din Husayn Kart watches eastern Khorasan dissolve into fire. His nominal Mongol overlord Togha Temur at Gorgan reels from western setbacks while the militant Sarbadars surge across Sabzevar and Nishapur. Herat's nobles press the Malik to cast off Gorgan's fading tribute and reign as sovereign champion of Khorasan, though caravan masters warn that nominal peace with Togha Temur keeps northern trade open."
 oe_v240_ea.3.a:0 "Cast off Togha Temur's overlordship and rule Herat as an autonomous realm"
 oe_v240_ea.3.b:0 "Maintain nominal tribute to Gorgan while enriching Herat's bazaars"
 oe_v240_ea.4.t:0 "The Treaty of Ayas: Cilician Settlement of 1337"
 oe_v240_ea.4.d:0 "Following devastating Mamluk raids launched from Aleppo and Damascus across the Taurus passes, envoys of King Leo IV of Cilician Armenia kneel before Sultan al-Nasir Muhammad's court. They beg for peace at the price of ceding the vital Mediterranean port of Ayas and heavy annual tribute. Enforcing full Mamluk claims over Ayas will delight our Aleppo commanders and lock down Anatolian customs, whereas a lenient truce eases Syrian garrison costs."
 oe_v240_ea.4.a:0 "Enforce the Ayas port concessions and collect Cilician tribute"
 oe_v240_ea.4.b:0 "Grant a measured truce to ease Syrian frontier upkeep"
 oe_v240_ea.5.t:0 "The Shadow Caliph Exiled to Qus"
 oe_v240_ea.5.d:0 "A bitter breach has opened atop the Cairo Citadel between Sultan al-Nasir Muhammad and the Abbasid Caliph al-Mustakfi I over a palace intrigue. Unwilling to tolerate even symbolic defiance, the Sultan has ordered the Caliph and his entire household banished far south up the Nile to Qus under strict guard. Keeping the Abbasids confined at Qus asserts absolute Citadel mastery over the diwan, while restoring the Caliph's honor in Cairo calms the qadis and pious estates."
 oe_v240_ea.5.a:0 "Keep the Abbasid household confined at Qus under Citadel authority"
 oe_v240_ea.5.b:0 "Restore the Caliph to Cairo with full ceremony and honor"
 oe_v240_ea.6.t:0 "After al-Nasir Muhammad: The Bahri Succession Turmoil"
 oe_v240_ea.6.d:0 "The towering third reign of Sultan al-Nasir Muhammad has reached its twilight in June 1341, leaving rival sons — al-Mansur Abu Bakr, al-Ashraf Kujuk, and al-Nasir Ahmad — surrounded by ambitious senior amirs such as Qawsun and Bashtak. Far across the Sinai, the great Syrian niyabats of Damascus, Aleppo, and Karak watch Cairo's faction fights with hands on their hilts. Our court must either buy a delicate concord with all three Syrian na'ibs, back a ruthless Cairo Citadel purge, or lean on Karak's fortress-treasury to arbitrate the throne."
 oe_v240_ea.6.a:0 "Broker a power-sharing pact with the amirs and all three Syrian na'ibs"
 oe_v240_ea.6.b:0 "Unleash the Cairo Citadel guard to purge rival amirs"
 oe_v240_ea.6.c:0 "Rely on Karak's fortress-treasury and Damascus levies to arbitrate"
 oe_v240_ea.7.t:0 "Fakhruddin Mubarak Shah: Sonargaon Breaks from Delhi"
 oe_v240_ea.7.d:0 "Upon the death of Delhi's governor Bahram Khan in 1338, his armor-bearer Fakhruddin has seized the bustling river capital of Sonargaon, proclaiming himself Sultan Fakhruddin Mubarak Shah and striking independent silver tankas! With Muhammad bin Tughluq bogged down by famine in the distant Doab while rival governors at Gaur and Satgaon scramble for position, Sonargaon must decide whether to sever Delhi's yoke forever or seek imperial confirmation as a privileged delta viceroy."
 oe_v240_ea.7.a:0 "Proclaim the independent Sultanate of Sonargaon and defy Delhi"
 oe_v240_ea.7.b:0 "Petition Delhi for hereditary charter over the eastern delta ports"
 oe_v240_ea.8.t:0 "Ilyas Shah of Satgaon & the Three-Bengal Contest"
 oe_v240_ea.8.d:0 "Following the death of Satgaon's loyal governor Izz al-Din Yahya in 1338, his ambitious foster-brother Haji Ilyas has seized western Bengal as Shamsuddin Ilyas Shah. Almost simultaneously at Gaur, Alauddin Ali Shah has toppled Qadar Khan and moved his court to Pandua, turning all three Bengal provinces — Satgaon, Gaur, and Fakhruddin's Sonargaon — into a fierce race for sovereignty. Shall Ilyas Shah renounce Delhi and march north on Gaur to unify Bengal, or first build Satgaon into the richest port on the Hooghly?"
 oe_v240_ea.8.a:0 "Cast off Delhi's suzerainty and contest Gaur for all of Bengal"
 oe_v240_ea.8.b:0 "Expand Satgaon's river wharves and dominate Hooghly maritime commerce"
 oe_v240_ea.9.t:0 "Twilight of the Loharas: Queen Kota Rani and Shah Mir"
 oe_v240_ea.9.d:0 "Still bearing the scars of Dulucha's Mongol devastation, the Himalayan valley of Kashmir faces an uncertain interregnum after King Udayanadeva's death in 1338. Wise Queen Kota Rani holds Srinagar's palace, yet the resourceful Swati minister Shah Mir already commands the valley's key tax districts and frontier forts. Entrusting Srinagar's stewardship to Shah Mir will swiftly restore order while smoothing his path to power, whereas rallying the Damara hill barons prepares the ancient Hindu crown for a coming showdown."
 oe_v240_ea.9.a:0 "Entrust Kashmir's forts and revenue registers to Minister Shah Mir"
 oe_v240_ea.9.b:0 "Rally the Damara valley barons behind Queen Kota Rani"
 oe_v240_ea.10.t:0 "The 1339 Shah Mir Coup: Crown of the Kashmir Valley"
 oe_v240_ea.10.d:0 "In the autumn of 1339, the silent struggle for Srinagar erupts into open confrontation at the fortress of Indarkot. Backed by valley garrisons and weary townsfolk, Shah Mir demands the throne to inaugurate the Muslim Sultanate of Kashmir under the title Sultan Shams al-Din, promising light taxes and Persianate renewal. Only a desperate stand by Kota Rani's loyalist barons can keep Kashmir's ancient Hindu dynasty alive."
 oe_v240_ea.10.a:0 "Crown Sultan Shams al-Din Shah Mir and establish the Kashmir Sultanate"
 oe_v240_ea.10.b:0 "Hold Indarkot and preserve Queen Kota Rani's Hindu mountain realm"
 oe_v240_ea.11.t:0 "Doab Famine & Ain al-Mulk's Awadh Mutiny"
 oe_v240_ea.11.d:0 "Years of drought and crushing taxation across the Ganges-Yamuna Doab have forced Sultan Muhammad bin Tughluq's court into the sprawling relief encampment of Sargadwari, sustained almost entirely by grain barges dispatched from Awadh and Jaunpur by Governor Ain al-Mulk Multani. When imperial orders arrive transferring Ain al-Mulk southward to govern the restive Deccan, his officers rise in armed revolt across the Ganges at Kanauj! Shall Delhi crush the mutiny and fund sondhar famine loans, or confirm Ain al-Mulk in Awadh to keep the grain fleets sailing?"
 oe_v240_ea.11.a:0 "Crush Ain al-Mulk's rebellion and disburse sondhar famine loans"
 oe_v240_ea.11.b:0 "Confirm Ain al-Mulk in Awadh-Jaunpur in exchange for steady grain convoys"
 oe_v240_ea.12.t:0 "Aziz Khammar at Dhar: The Malwa Centurions Crisis"
 oe_v240_ea.12.d:0 "Seeking ruthless loyalty in central India, the court has appointed the low-born administrator Aziz Khammar to govern Malwa from Dhar — and he has stunned the Sultanate by arresting and executing eighty-nine foreign centurion amirs (Amiran-i-Sada) in a single bloody stroke! Shockwaves race instantly from Dhar south to Daulatabad and east to Jaunpur as surviving centurions reach for their swords. Will Delhi reward Khammar's terror to crush provincial defiance, or swiftly recall him and guarantee the iqta officers' charters?"
 oe_v240_ea.12.a:0 "Reward Aziz Khammar's purge at Dhar and confiscate rebel estates"
 oe_v240_ea.12.b:0 "Recall Aziz Khammar and guarantee the Malwa and Deccan iqta charters"
 oe_v240_ea.13.t:0 "Fall of Kanegasaki Castle & the Stand at Yoshino"
 oe_v240_ea.13.d:0 "Bitter tidings reach the misty cedar halls of Yoshino: after months of winter starvation above Tsuruga Bay, Nitta Yoshisada's coastal fortress of Kanegasaki has fallen to Ashikaga besiegers, costing the Southern Court both Crown Prince Tsuneyoshi and Prince Takayoshi. Yet Emperor Go-Daigo refuses to yield the Imperial Regalia — shall Yoshino summon Kitabatake Akiie's northern army for an immediate counter-march toward Kyoto, or turn the mountain shrines into an unbreakable bastion while sending imperial princes across the provinces?"
 oe_v240_ea.13.a:0 "Summon Kitabatake Akiie's army for a fierce counter-offensive toward Kyoto"
 oe_v240_ea.13.b:0 "Fortify Yoshino's mountain shrines and dispatch imperial princes afar"
 oe_v240_ea.14.t:0 "Investiture of the Muromachi Shogunate (1338)"
 oe_v240_ea.14.d:0 "Following the capture of Kanegasaki and the hard-fought defeat of Kitabatake Akiie's loyalist host outside Sakai, Emperor Komyo of the Northern Court formally invests Ashikaga Takauji as Seii Taishogun in Kyoto in August 1338. A new warrior government — the Muromachi Bakufu — now rises beside the imperial palace. Shall Takauji anchor the regime in the Kemmu Formulary and his brother Tadayoshi's orderly Kyoto courts, or cement power by granting sweeping Shugo constabulary privileges to the great warrior houses?"
 oe_v240_ea.14.a:0 "Uphold the Kemmu Formulary and Tadayoshi's Kyoto administrative courts"
 oe_v240_ea.14.b:0 "Empower loyal warrior houses with sweeping Shugo constabulary rights"
 oe_v240_ea.15.t:0 "Twin Thrones on the Irrawaddy: Pinya and Sagaing"
 oe_v240_ea.15.d:0 "Across the wide waters of the Irrawaddy sit the twin Myinsaing sibling kingdoms of Pinya and Sagaing, each claiming the golden mantle of ancient Pagan while eyeing the other's river forts. King Uzana I's ministers at Pinya debate whether to press our royal seniority across the water against Sagaing before northern Shan raiders destabilize the river valley, or first restore the rich irrigation canals of the Kyaukse rice bowl to outgrow our northern kin."
 oe_v240_ea.15.a:0 "Assert Pinya's royal seniority across the Irrawaddy against Sagaing"
 oe_v240_ea.15.b:0 "Restore the Kyaukse rice-bowl canals and strengthen Pinya's heartland"
 oe_v240_ea.16.t:0 "Kyawswa I: Lord of Five White Elephants"
 oe_v240_ea.16.d:0 "In September 1340, King Uzana I steps aside in favor of his martial half-brother Kyawswa I — famed across Upper Burma as Nga-Si-Shin, Lord of Five White Elephants — who consolidates unchallenged sovereignty at Pinya through 1344. Energized by the new reign, Pinya can either forge an elite royal elephant guard to keep Toungoo, Prome, and Sagaing in awe, or patronize the Theravada Sangha and renew provincial fief charters for lasting domestic peace."
 oe_v240_ea.16.a:0 "Drill Kyawswa I's royal white-elephant vanguard and assert crown might"
 oe_v240_ea.16.b:0 "Patronize the Theravada Sangha and confirm Toungoo and Prome charters"
 oe_v240_ea.17.t:0 "Sagaing Under Fire: Rival Princes and Shan Raids"
 oe_v240_ea.17.d:0 "Sandwiched between Pinya's watchful banners to the south and restless Maw Shan horsemen probing down the upper Irrawaddy and Chindwin valleys from the northeast, the smaller kingdom of Sagaing faces relentless pressure in the early 1340s. Palace factions quarrel over the throne even as frontier villages burn. Sagaing must either pour its silver into northern timber stockades and border levies, or secure riverine trade tolls and cautious diplomacy to survive the storm."
 oe_v240_ea.17.a:0 "Raise timber stockades and frontier levies along the northern Shan passes"
 oe_v240_ea.17.b:0 "Charter confluence river tolls and pursue cautious valley diplomacy"
 oe_v240_ea.18.t:0 "The Retired Emperor's Regency: Tran Minh Tong at Thang Long"
 oe_v240_ea.18.d:0 "True to the Tran dynasty's singular dual-monarchy custom, Retired Emperor (Thai thuong hoang) Tran Minh Tong guides young Emperor Tran Hien Tong from Thang Long, steering Dai Viet with seasoned statecraft while revered scholars such as Chu Van An guard court integrity. Yet rising highland tensions along Thanh Hoa and Nghe An tempt the royal princes to demand broader military commands. Shall Thang Long deepen Minh Tong's scholarly bureaucracy, or elevate the Tran princes' standing frontier armies?"
 oe_v240_ea.18.a:0 "Uphold Tran Minh Tong's regency and Chu Van An's scholarly examinations"
 oe_v240_ea.18.b:0 "Empower the royal Tran princes and Thanh Hoa frontier garrisons"
 oe_v240_ea.19.t:0 "The 1342 Champa Succession Crisis: Che Mo's Plea"
 oe_v240_ea.19.d:0 "Following the death of Champa's veteran king Che A Nan in 1342, his son-in-law Tra Hoa Bo De has usurped the throne at Vijaya, driving the rightful heir Prince Che Mo northward into Dai Viet to beg Thang Long for military intervention. Sheltering Che Mo grants Dai Viet a prized pretext to press Champa for tribute and coastal dominance, whereas holding the southern passes calmly allows Van Don's merchants to harvest Gulf of Tonkin sea trade undisturbed."
 oe_v240_ea.19.a:0 "Shelter Prince Che Mo and assert Dai Viet's claim over Vijaya"
 oe_v240_ea.19.b:0 "Guard the southern passes and expand Van Don's maritime commerce"
 oe_v240_ea.20.t:0 "Amda Seyon's Late Reign: The Solomonic Roving Court"
 oe_v240_ea.20.d:0 "Crowned in glory after his sweeping 1332 victories over the eastern sultanates, Emperor Amda Seyon I governs Ethiopia from his formidable mobile royal camp (katama), holding Tigray's Bahr Negash and highland nobles under firm Solomonic command. Yet fiery monastic reformers led by Abba Ewostatewos and the abbots of Debre Asbo openly rebuke royal marriage customs. Shall the Emperor assert iron Solomonic supremacy through his roving army, or endow the highland monasteries to seal enduring church-crown harmony?"
 oe_v240_ea.20.a:0 "Assert Solomonic supremacy and strengthen the roving royal katama"
 oe_v240_ea.20.b:0 "Endow highland monasteries and reconcile with the monastic clergy"
 oe_v240_ea.21.t:0 "The Ifat Frontier: Tributary Zeila and the Red Sea Gate"
 oe_v240_ea.21.d:0 "Though humbled into tributary submission after Amda Seyon's 1332 campaign, the Walashma Sultanate of Ifat still holds the vital caravan descent from the Shoa plateau to Harar and the Red Sea port of Zeila. As Amda Seyon's long reign enters its final years, lowland amirs test Ethiopian resolve along the rift border. Shall our empire garrison the eastern escarpment and press direct claims toward Zeila, or charter protected highland-to-Red Sea caravans that enrich both treasury and merchants?"
 oe_v240_ea.21.a:0 "Fortify the Shoa-Ifat marches and press Solomonic claims on Zeila"
 oe_v240_ea.21.b:0 "Charter peaceful salt, gold, and ivory caravans down to Zeila"
 oe_v240_ea.22.t:0 "Escape from Niani: Ali Kolon's Return to Gao"
 oe_v240_ea.22.d:0 "Chroniclers of the Niger tell how Songhai prince Ali Kolon and his brother Sulayman Nar served for years as royal hostages at the Mali court of Niani, quietly hiding weapons and grain along the eastward road. Now, as Mansa Musa's towering reign fades into succession disputes, Ali Kolon has galloped home to Gao and rallied the Songhai people beneath the new Sonni banner! Shall Gao cast off Mali's yoke in open defiance right now, or mask its rearmament behind cautious tribute until Mali weakens further?"
 oe_v240_ea.22.a:0 "Cast off Mali's yoke and proclaim the independent Sonni Dynasty of Gao"
 oe_v240_ea.22.b:0 "Mask Gao's ambitions behind Saharan tribute while building an armory"
 oe_v240_ea.23.t:0 "Mastery of the Niger Bend: Gao's Flotilla and Salt Roads"
 oe_v240_ea.23.d:0 "With the Sonni line taking root at Gao while Mali wrestles with rivalries between Mansa Maghan and Mansa Sulayman, the entire eastern bend of the Niger beckons. Sorko master boatmen stand ready to launch war canoes upstream toward the glittering caravans of Timbuktu, while Maghrebi salt merchants flock to Gao's riverfront mosques seeking safe warehouses and fair tolls. Shall Songhai project armed river power westward, or first transform Gao into the Sahel's foremost trading hub?"
 oe_v240_ea.23.a:0 "Muster the Sorko war-canoe flotilla and eye Timbuktu upstream"
 oe_v240_ea.23.b:0 "Welcome Maghrebi salt caravans and jurists to Gao's river market"
 oe_v240_ea.24.t:0 "The 1337 Tlatelolco Split: Twin Islands on Lake Texcoco"
 oe_v240_ea.24.d:0 "Twelve short years after the Mexica planted their reed huts around the eagle's cactus at Tenochtitlan, a proud dissident faction breaks away in 1337 to settle the sandy northern islet of Tlatelolco, laying out broad canoe wharves and marketplaces. Elder Tenoch and the temple council weigh their response: chartering Tlatelolco's merchants as a sister trading ward could flood both islands with Valley of Mexico commerce, while asserting firm central temple order keeps the fledgling Mexica united against lake rivals."
 oe_v240_ea.24.a:0 "Charter Tlatelolco's northern wharves as a thriving sister market"
 oe_v240_ea.24.b:0 "Enforce Tenoch's central temple authority across both lake islets"
 oe_v240_ea.25.t:0 "Tribute to Azcapotzalco: Serving the Tepanec Overlord"
 oe_v240_ea.25.d:0 "Perched on marshy lake islets leased from mighty Azcapotzalco, early Tenochtitlan survives at the pleasure of the Tepanec lords across the western shore. Their tribute collectors demand not only reeds, lake fish, and woven cloaks, but fierce Mexica spear-warriors to spearhead Tepanec campaigns across the basin. Serving as Azcapotzalco's loyal shock auxiliaries will forge unmatched Mexica battlefield skill while winning Tepanec goodwill, whereas hoarding chinampa harvests and quietly courting Tetzcoco prepares an independent path."
 oe_v240_ea.25.a:0 "Serve Azcapotzalco faithfully as elite Tepanec campaign auxiliaries"
 oe_v240_ea.25.b:0 "Conserve chinampa harvests and quietly cultivate ties with Tetzcoco"
 oe_v240_ea.26.t:0 "Nancenpinco's Coastal Campaigns from Chan Chan"
 oe_v240_ea.26.d:0 "From the sun-baked labyrinthine palaces of Chan Chan in the Moche Valley, King Nancenpinco gazes north toward the fertile valleys of Pakatnamu and Sana, and south toward Huacatambo and the Casma oases. Chimor's disciplined infantry and master hydraulic engineers can either launch sweeping coastal conquests to unite Peru's northern desert kingdoms under one gold-crowned sovereign, or first double the irrigation canals and goldsmith workshops of Chan Chan itself."
 oe_v240_ea.26.a:0 "March north and south along the desert valleys to expand Chimor"
 oe_v240_ea.26.b:0 "Expand Chan Chan's Moche irrigation network and royal goldsmiths"
 oe_v240_ea.27.t:0 "The League of Mayapan: Cocom Primacy and Foreign Guards"
 oe_v240_ea.27.d:0 "Within the stone walls of Mayapan, the Cocom dynasty compels Yucatan's noble houses — above all the proud Tutul Xiu lords of Mani — to reside near the royal temples under watchful eyes. Growing whispers of resentment among provincial batabs present a fateful choice: hiring hardened Tabasco mercenary warriors from the Gulf coast will enforce iron Cocom primacy over Mani, whereas renewing the shared Multepal council restores goodwill across the Maya League."
 oe_v240_ea.27.a:0 "Hire Tabasco mercenary guards to enforce Cocom hegemony over Mani"
 oe_v240_ea.27.b:0 "Renew the Multepal joint council with the Tutul Xiu and coastal lords"
 oe_v240_ea.28.t:0 "Tutul Xiu of Mani: Whispered Defiance Against Mayapan"
 oe_v240_ea.28.d:0 "Proud heirs to the storied stone palaces of Uxmal, the Tutul Xiu lords of Mani chafe beneath the heavy-handed dominance of the Cocom court at Mayapan and its foreign mercenary guards. Envoys from restless western Yucatec towns arrive at Mani under cover of night, urging Ah Suytok Tutul Xiu to forge a rival coalition to topple Mayapan — though prudent elders counsel quietly enriching Mani's cacao orchards and salt trade until the Cocom overreach."
 oe_v240_ea.28.a:0 "Forge a secret western Maya coalition to challenge Mayapan"
 oe_v240_ea.28.b:0 "Enrich Mani's cacao groves and salt roads while biding our time"
