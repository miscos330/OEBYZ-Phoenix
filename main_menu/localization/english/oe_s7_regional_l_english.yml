 oe_s7.1.t: "The Humiliation of Cilicia"
 oe_s7.1.d1: "Early in 1337 the Mamluk sultan sent the armies of Egypt and Syria into Cilicia under the governor of Aleppo. They took fortress after fortress and forced the port of Ayas to surrender. Around June King Leo IV of Armenia had to accept a humiliating truce: Ayas and other forts and lands were given up, a heavy indemnity was paid, and the king promised to have no more dealings with the West. Guy of Lusignan, who would take the Armenian throne in 1342, was at this time the empire's governor of Serres.\n\nNow Ayas belongs to the Mamluks. Envoys from Cilicia have come to Constantinople, hoping the empire can spare some help."
 oe_s7.1.d: "Early in 1337 the Mamluk sultan sent the armies of Egypt and Syria into Cilicia under the governor of Aleppo. They took fortress after fortress and forced the port of Ayas to surrender. Around June King Leo IV of Armenia had to accept a humiliating truce: Ayas and other forts and lands were given up, a heavy indemnity was paid, and the king promised to have no more dealings with the West. Guy of Lusignan, who would take the Armenian throne in 1342, was at this time the empire's governor of Serres.\n\nNow the Mamluk army is still in Cilicia, and Ayas has not changed hands. Envoys from Cilicia have come to Constantinople to ask for help."
 oe_s7.1.a: "Send help to King Leo"
 oe_s7.1.a.tt: "Gold #R −30#!.\nCilicia's opinion of us #G +20#! (#Y 10#! years)."
 oe_s7.1.b: "Stay out of eastern affairs"
 oe_s7.1.b.tt: "Nothing else happens."
 oe_s7.2.t: "The Interdict over Patras"
 oe_s7.2.d1: "The archbishop of Patras was the greatest church vassal of the Principality of Achaea. In 1337 Archbishop William Frangipani died, and before the successor, Roger, could arrive from Italy, the bailli of Achaea, Bertrand of Les Baux, laid siege to Patras to bring the city under the prince. Pope Benedict XII declared Patras land of the Roman Church and laid the principality under interdict, and Bertrand had to withdraw. From then on Patras was in practice independent of the principality; the archbishop owed the prince service only for the secular fiefs.\n\nNow Patras has broken away from Achaea, and the Latins of Achaea are quarrelling under the interdict. On the Morean border the empire can take a side, or simply watch."
 oe_s7.2.d: "The archbishop of Patras was the greatest church vassal of the Principality of Achaea. In 1337 Archbishop William Frangipani died, and before the successor, Roger, could arrive from Italy, the bailli of Achaea, Bertrand of Les Baux, laid siege to Patras to bring the city under the prince. Pope Benedict XII declared Patras land of the Roman Church and laid the principality under interdict, and Bertrand had to withdraw. From then on Patras was in practice independent of the principality; the archbishop owed the prince service only for the secular fiefs.\n\nNow the quarrel at Patras is not yet settled, and the Latins of Achaea are at odds with one another. On the Morean border the empire can take a side, or simply watch."
 oe_s7.2.a: "Back the archbishop and the Pope"
 oe_s7.2.a.tt: "Gold #R −20#! (gifts for the envoys).\nThe Papal States's opinion of us #G +15#! (#Y 10#! years).\nAchaea's opinion of us #R −15#! (#Y 10#! years)."
 oe_s7.2.b: "Back the bailli of Achaea"
 oe_s7.2.b.tt: "Achaea's opinion of us #G +15#! (#Y 10#! years).\nThe Papal States's opinion of us #R −10#! (#Y 10#! years)."
 oe_s7.2.c: "Let the Latins quarrel"
 oe_s7.2.c.tt: "Nothing else happens."
 oe_s7.3.t: "Catherine Comes to Achaea"
 oe_s7.3.d1: "Catherine of Valois, titular empress of the Latin Empire, governed Achaea for Catherine's son Robert. In 1338 Catherine crossed to Achaea with the whole household and the adviser Niccolò Acciaioli, and stayed about two years. The young Nikephoros II of Epirus had already been brought to Catherine's court in the hope of Angevin help to win back Epirus; late in 1338 Epirote rebels, urged on by Catherine, seized Arta in the boy's name.\n\nNow Catherine has settled in Achaea, and the old servants of the Epirote house are in close touch with the Latins. If Arta and Ioannina are left unguarded, the rebels may rise at any moment."
 oe_s7.3.d: "Catherine of Valois, titular empress of the Latin Empire, governed Achaea for Catherine's son Robert. In 1338 Catherine crossed to Achaea with the whole household and the adviser Niccolò Acciaioli, and stayed about two years. The young Nikephoros II of Epirus had already been brought to Catherine's court in the hope of Angevin help to win back Epirus; late in 1338 Epirote rebels, urged on by Catherine, seized Arta in the boy's name.\n\nNow Catherine has settled in Achaea. Epirus is still our subject, but some at its court already hope to use the Angevins to break free of the empire."
 oe_s7.3.a: "Reinforce Epirus"
 oe_s7.3.a.tt: "Gold #R −60#!.\nOur locations at Arta and Ioannina get Epirote Garrison (#Y 3#! years): defence #G +25%#!, unrest #G −10%#!.\nIf Epirus is still our subject: liberty desire #G −10#!."
 oe_s7.3.b: "Protest to Achaea"
 oe_s7.3.b.tt: "Achaea's opinion of us #R −15#! (#Y 10#! years).\nOur locations at Arta and Ioannina get Angevin Incitement (#Y 12#! months): unrest #R +20%#!, max control #R −10%#!.\nIf Epirus is still our subject: liberty desire #R +5#!."
 oe_s7.3.c: "Pay it no heed"
 oe_s7.3.c.tt: "Our locations at Arta and Ioannina get Angevin Incitement (#Y 24#! months): unrest #R +20%#!, max control #R −10%#!.\nIf Epirus is still our subject: liberty desire #R +10#!."
 oe_s7.4.t: "Barlaam's Embassy to Avignon"
 oe_s7.4.d: "In 1339 Andronikos III sent Barlaam, a monk from Calabria, to Pope Benedict XII at Avignon. Barlaam proposed that the West first send troops to drive the Turks out of Asia Minor, and that a council of both churches then meet to discuss union; Barlaam also said plainly that the bitterness between the two peoples was harder to overcome than the difference in doctrine. The Pope would not agree to a council before union, and the embassy came to nothing.\n\nNow Barlaam asks to be sent to Avignon. The clergy of the capital distrust any approach to Rome, and to the followers of Palamas, Barlaam is not a man to be trusted."
 oe_s7.4.a: "Send Barlaam"
 oe_s7.4.a.tt: "Gold #R −40#!.\nThe Papal States's opinion of us #G +15#! (#Y 10#! years).\nClergy satisfaction #R −2.5%#!."
 oe_s7.4.b: "Send no embassy for now"
 oe_s7.4.b.tt: "Clergy satisfaction #G +2.5%#!."
