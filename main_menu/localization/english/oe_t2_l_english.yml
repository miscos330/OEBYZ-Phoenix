l_english:
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_3: "Theme Loyalty Sync: Loyal"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_3: "This theme's strategos stands steadfastly loyal (Theme Loyalty >= 70), strongly bolstering allegiance to the Imperial overlord."
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_2: "Theme Loyalty Sync: Steady"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_2: "This theme's strategos remains steady in obedience (Theme Loyalty 40-69), maintaining reliable subject loyalty."
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_1: "Theme Loyalty Sync: Restless"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_1: "This theme's commander grows restive (Theme Loyalty 20-39), eroding subject loyalty and inviting defiance."
 AUTO_MODIFIER_NAME_oe_t2_loyalty_sync_band_0: "Theme Loyalty Sync: Disloyal"
 AUTO_MODIFIER_DESC_oe_t2_loyalty_sync_band_0: "This theme verges on open sedition (Theme Loyalty below 20), severely undermining subject loyalty."
 AUTO_MODIFIER_NAME_oe_t2_archetype_army: "Core Army Theme Doctrine"
 AUTO_MODIFIER_DESC_oe_t2_archetype_army: "A loyal core army theme fields disciplined standing regiments with reinforced manpower and battlefield morale."
 AUTO_MODIFIER_NAME_oe_t2_archetype_navy: "Naval Theme Maritime Patrol"
 AUTO_MODIFIER_DESC_oe_t2_archetype_navy: "A loyal naval theme patrols imperial sea lanes, suppresses piracy, slows maritime decay, and bolsters maritime trade power."
 AUTO_MODIFIER_NAME_oe_t2_archetype_frontier: "Frontier Theme Bastion Network"
 AUTO_MODIFIER_DESC_oe_t2_archetype_frontier: "A loyal frontier theme maintains cost-efficient border fortresses, deeper garrisons, and resilient defensive lines."
 AUTO_MODIFIER_NAME_oe_t2_archetype_civil: "Civil Theme Heartland Prosperity"
 AUTO_MODIFIER_DESC_oe_t2_archetype_civil: "A loyal civil theme stays aloof from offensive wars, channeling food production, rising literacy, and efficient taxes to the realm."
 AUTO_MODIFIER_NAME_oe_t2_archetype_charter: "Charter Theme Commercial Hub"
 AUTO_MODIFIER_DESC_oe_t2_archetype_charter: "A loyal chartered commercial theme leverages low-interest credit and merchant fleets to expand imperial trade revenues."
 STATIC_MODIFIER_NAME_oe_t2_senate_triumphator: "Triumphator of the Senate"
 STATIC_MODIFIER_DESC_oe_t2_senate_triumphator: "A veteran strategos recalled with full triumphal honors to counsel the Senate in Constantinople."
 STATIC_MODIFIER_NAME_oe_t2_imperial_triumph_splendor: "Splendor of an Imperial Triumph"
 STATIC_MODIFIER_DESC_oe_t2_imperial_triumph_splendor: "A grand imperial triumph celebrates loyal service, lifting dynastic legitimacy and courtly prestige."
 STATIC_MODIFIER_NAME_oe_t2_imperial_inlaw_bond: "Imperial Dynastic In-Law Bond"
 STATIC_MODIFIER_DESC_oe_t2_imperial_inlaw_bond: "A marriage alliance with the imperial house anchors this theme's loyalty and diplomatic standing."
 STATIC_MODIFIER_NAME_oe_t2_hereditary_strategos: "Hereditary Strategos Charter"
 STATIC_MODIFIER_DESC_oe_t2_hereditary_strategos: "Confirmed hereditary command inspires fierce frontier defense and lower fort upkeep, though recalling such authority carries grave risk."
 STATIC_MODIFIER_NAME_oe_t2_inspectorate_order: "Imperial Inspectorate Order"
 STATIC_MODIFIER_DESC_oe_t2_inspectorate_order: "Imperial inspectors audit provincial accounts and discipline, lifting tax efficiency and theme allegiance."
 STATIC_MODIFIER_NAME_oe_t2_tax_concession_5y: "Senatorial Tribute Concession"
 STATIC_MODIFIER_DESC_oe_t2_tax_concession_5y: "Five years of fiscal leniency brokered by the Senate ease local burdens and soothe a restive strategos."
 STATIC_MODIFIER_NAME_oe_t2_strategoi_pay_pledge: "Oath of the Strategoi Pay Pledge"
 STATIC_MODIFIER_DESC_oe_t2_strategoi_pay_pledge: "Higher standing military stipends secure renewed oaths of loyalty from assembled theme commanders."
 STATIC_MODIFIER_NAME_oe_t2_loyal_enforcer_honor: "Honors of the Loyal Enforcer"
 STATIC_MODIFIER_DESC_oe_t2_loyal_enforcer_honor: "Rewarded for marching against a defiant neighbor at the Emperor's call, this theme fights with heightened morale and devotion."
 oe_t2_setup.1.t: "Establishing the Imperial Themes"
 oe_t2_setup.1.d: "Beset by external foes and fiscal strain, the empire must organize its provincial defenses. Founding every historical subdivision at once splits our Balkan core into numerous small themes that drain diplomatic capacity, whereas establishing two streamlined core themes with temporary co-administration preserves crownland and keeps diplomatic upkeep light.\n\nHistorical regions eligible now: [ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_ui_creatable_count')|0]"
 oe_t2_setup.1.a: "Streamlined Core Themes (Recommended)"
 oe_t2_setup.1.a.tt: "Founds only #Y 2#! core themes: #Y Thrace-Macedonia (Adrianople)#! and #Y Thessaloniki#! (temporarily co-administering the adjoining #Y Serres#! corridor, splittable later), while keeping #Y Plovdiv#! and #Y Thessaly#! as direct crownland. Cuts Day-1 diplomatic capacity drain from #R 2.50#! to #G 0.30#! at no Authority cost."
 oe_t2_setup.1.b: "Full Historical Subdivision"
 oe_t2_setup.1.b.tt: "Founds a separate theme in every eligible historical region at no Authority cost, with founding regiments, ships, and treasury scaled to jurisdiction size."
 oe_t2_setup.1.c: "Direct Crown Administration"
 oe_t2_setup.1.c.tt: "Founds no themes at start, retaining all provinces under direct crown rule. Themes can be founded later from the Themes tab or edicts for #R 5#! Authority each."
 oe_t2_auth_3_tt: "Imperial Authority is at least #Y 3#!"
 oe_t2_auth_5_tt: "Imperial Authority is at least #Y 5#!"
 oe_t2_auth_8_tt: "Imperial Authority is at least #Y 8#!"
 oe_t2_auth_10_tt: "Imperial Authority is at least #Y 10#!"
 oe_t2_auth_16_tt: "Imperial Authority is at least #Y 16#! (revoking hereditary command costs double Authority)"
 oe_t2_small_jurisdiction_tt: "This theme administers at most #Y 7#! locations (only minor themes may be consolidated)"
 oe_t2_receiver_loyal_tt: "Receiving theme must be #G Steady#! or #G Loyal#!"
 oe_t2_split_seat_owned_tt: "The historic seat of the co-administered region must still be owned by the Empire"
 oe_t2_cd_ready_tt: "This theme is not currently on cooldown for this decree"
 oe_t2_inspect_cd_tt: "At least #Y 10#! years have passed since the last Imperial Inspectorate"
 oe_t2_tenure_4_tt: "This theme's strategos has served at least #Y 4#! years"
 oe_t2_tenure_6_tt: "This theme's strategos has served at least #Y 6#! years"
 oe_t2_band_1_plus_tt: "This theme has not fallen into #R Disloyal#! status"
 oe_t2_band_2_plus_tt: "This theme must be #G Steady#! or #G Loyal#!"
 oe_t2_hereditary_req_tt: "This theme must be a frontier march or hold at least #G Good#! military efficiency"
 oe_t2_choose_receiving_theme: "Select Receiving Neighbouring Theme"
 oe_t2_no_receiving_theme: "@trigger_no!No eligible loyal theme in the same or adjacent distance band is free to co-administer"
 oe_t2_choose_rotate_partner: "Select Partner Theme for Rotation"
 oe_t2_no_rotate_partner: "@trigger_no!No other non-despotate theme with a living strategos is available to swap"
 oe_t2_consolidate_theme: "Consolidate Minor Theme"
 oe_t2_consolidate_theme_desc: "Spend #R 5#! Imperial Authority to merge a minor theme of 7 or fewer locations into a loyal neighbouring theme, transferring its posts, armies, navies, and half its treasury and manpower to save diplomatic capacity while keeping historic region IDs intact for future splitting."
 oe_t2_consolidate_theme_act: "Consolidate [SCOPE.sCountry('recipient').GetName] into a Neighbouring Theme"
 oe_t2_consolidate_theme_effect_text: "[SCOPE.sCountry('actor').GetName] decrees the consolidation of [SCOPE.sCountry('recipient').GetName]."
 oe_t2_consolidate_theme_effect_text_past: "[SCOPE.sCountry('actor').GetName] consolidated [SCOPE.sCountry('recipient').GetName] into a neighbouring theme."
 PROPOSE_oe_t2_consolidate_theme: "Spend 5 Imperial Authority to consolidate $RECIPIENT$ under a loyal neighbouring theme?\n\n$INFO$"
 oe_t2_split_theme: "Split Co-Administered Theme"
 oe_t2_split_theme_desc: "Spend #R 10#! Imperial Authority to detach this theme's temporarily co-administered historical region into a standalone theme at its historic seat with size-scaled founding forces, granting the parent theme #G +5#! loyalty."
 oe_t2_split_theme_act: "Split Co-Administered Region from [SCOPE.sCountry('recipient').GetName]"
 oe_t2_split_theme_effect_text: "[SCOPE.sCountry('actor').GetName] splits the co-administered region from [SCOPE.sCountry('recipient').GetName] into a standalone theme."
 oe_t2_split_theme_effect_text_past: "[SCOPE.sCountry('actor').GetName] split the co-administered region from [SCOPE.sCountry('recipient').GetName] into a standalone theme."
 PROPOSE_oe_t2_split_theme: "Spend 10 Imperial Authority to split the co-administered historical region off from $RECIPIENT$?\n\n$INFO$"
 oe_t2_rotate_strategoi: "Rotate Strategoi"
 oe_t2_rotate_strategoi_desc: "Spend #R 5#! Imperial Authority and #R 50#! gold to swap a strategos with 4+ years of tenure with another theme's commander: both keep their traits and abilities while resetting tenure penalties and gaining #G +8#! loyalty. 5-year cooldown."
 oe_t2_rotate_strategoi_act: "Rotate the Strategos of [SCOPE.sCountry('recipient').GetName]"
 oe_t2_rotate_strategoi_effect_text: "[SCOPE.sCountry('actor').GetName] orders a peaceful rotation of the strategos of [SCOPE.sCountry('recipient').GetName]."
 oe_t2_rotate_strategoi_effect_text_past: "[SCOPE.sCountry('actor').GetName] rotated the strategos of [SCOPE.sCountry('recipient').GetName] to another theme."
 PROPOSE_oe_t2_rotate_strategoi: "Spend 5 Imperial Authority and 50 gold to rotate the strategos of $RECIPIENT$ with another theme?\n\n$INFO$"
 oe_t2_triumph_retire: "Triumph and Retire Strategos"
 oe_t2_triumph_retire_desc: "Invest #R 3#! Imperial Authority and #R 120#! gold to recall a loyal veteran strategos (6+ years tenure) to Constantinople for a grand Triumph and Senate retirement: the empire reaps #G +8#! Authority (net #G +5#!), #G +10#! Army Tradition, and 5 years of Triumph splendor, while the theme smoothly appoints a successor with #G +10#! loyalty. 10-year cooldown."
 oe_t2_triumph_retire_act: "Grant a Triumph and Retire the Strategos of [SCOPE.sCountry('recipient').GetName]"
 oe_t2_triumph_retire_effect_text: "[SCOPE.sCountry('actor').GetName] recalls the veteran strategos of [SCOPE.sCountry('recipient').GetName] for an imperial Triumph."
 oe_t2_triumph_retire_effect_text_past: "[SCOPE.sCountry('actor').GetName] honored the veteran strategos of [SCOPE.sCountry('recipient').GetName] with an imperial Triumph."
 PROPOSE_oe_t2_triumph_retire: "Spend 120 gold to grant the veteran strategos of $RECIPIENT$ an imperial Triumph and honorable retirement?\n\n$INFO$"
 oe_t2_imperial_marriage_tie: "Imperial Marriage Tie"
 oe_t2_imperial_marriage_tie_desc: "Spend #R 5#! Imperial Authority and #R 10#! prestige to forge an imperial marriage tie with this theme's strategos, granting a 20-year In-Law Bond (#G +12#! loyalty to overlord, #G +15#! theme loyalty). If the strategos hails from a Great House, that house gains #R +60#! influence. 10-year cooldown."
 oe_t2_imperial_marriage_tie_act: "Forge an Imperial Marriage Tie with [SCOPE.sCountry('recipient').GetName]"
 oe_t2_imperial_marriage_tie_effect_text: "[SCOPE.sCountry('actor').GetName] forges an imperial marriage tie with [SCOPE.sCountry('recipient').GetName]."
 oe_t2_imperial_marriage_tie_effect_text_past: "[SCOPE.sCountry('actor').GetName] forged an imperial marriage tie with [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_t2_imperial_marriage_tie: "Spend 5 Imperial Authority and 10 prestige to arrange an imperial marriage tie with $RECIPIENT$?\n\n$INFO$"
 oe_t2_confirm_hereditary_command: "Confirm Hereditary Command"
 oe_t2_confirm_hereditary_command_desc: "Spend #R 8#! Imperial Authority to confirm hereditary command for a frontier or elite theme: activates the hereditary loyalty bonus and grants 30 years of martial vigor (#G +8%#! morale, #G +25%#! reinforcement speed, #G +20%#! fort upkeep efficiency). Trade-off: doubles defiance risk during low-loyalty crises and costs double Authority to revoke."
 oe_t2_confirm_hereditary_command_act: "Confirm Hereditary Command in [SCOPE.sCountry('recipient').GetName]"
 oe_t2_confirm_hereditary_command_effect_text: "[SCOPE.sCountry('actor').GetName] confirms hereditary command in [SCOPE.sCountry('recipient').GetName]."
 oe_t2_confirm_hereditary_command_effect_text_past: "[SCOPE.sCountry('actor').GetName] confirmed hereditary command in [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_t2_confirm_hereditary_command: "Spend 8 Imperial Authority to confirm hereditary military command in $RECIPIENT$?\n\n$INFO$"
 oe_t2_dec_imperial_inspection: "Dispatch Imperial Theme Inspectorate"
 oe_t2_dec_imperial_inspection.title: "Dispatch Imperial Theme Inspectorate"
 oe_t2_dec_imperial_inspection_desc: "Dispatch imperial inspectors from Constantinople across all themes to audit stipends and administration, granting steady themes five years of Inspectorate Order and calming restive commanders. 10-year cooldown."
 oe_t2_dec_imperial_inspection.desc: "Dispatch imperial inspectors from Constantinople across all themes to audit stipends and administration, granting steady themes five years of Inspectorate Order and calming restive commanders. 10-year cooldown."
 oe_t2_dec_imperial_inspection.a: "Issue the Inspectorate Decree"
 oe_t2_dec_imperial_inspection_tt: "All steady and loyal themes gain 5 years of #G Imperial Inspectorate Order#! (+5% tax efficiency, +6 loyalty to overlord) and #G +5#! theme loyalty; restive themes gain #G +8#! calming loyalty. 10-year cooldown."
 oe_t2_dec_revoke_hereditary_charter: "Revoke Hereditary Strategos Charter"
 oe_t2_dec_revoke_hereditary_charter.title: "Revoke Hereditary Strategos Charter"
 oe_t2_dec_revoke_hereditary_charter_desc: "Spend double Imperial Authority (16) to strip hereditary military command from the most estranged hereditary theme, ending its doubled defiance threat at the cost of sharp local resentment."
 oe_t2_dec_revoke_hereditary_charter.desc: "Spend double Imperial Authority (16) to strip hereditary military command from the most estranged hereditary theme, ending its doubled defiance threat at the cost of sharp local resentment."
 oe_t2_dec_revoke_hereditary_charter.a: "Revoke the Hereditary Charter"
 oe_t2_dec_revoke_hereditary_charter_tt: "Strips hereditary status and the 30-year Hereditary Strategos modifier from the most estranged hereditary theme, reducing its theme loyalty by #R -15#!."
 oe_t2_dec_split_merged_region: "Split Co-Administered Region into New Theme"
 oe_t2_dec_split_merged_region.title: "Split Co-Administered Region into New Theme"
 oe_t2_dec_split_merged_region_desc: "Once Imperial Authority and diplomatic capacity allow, detach a co-administered historical region (such as Serres under Thessaloniki) into an independent theme at its historic seat."
 oe_t2_dec_split_merged_region.desc: "Once Imperial Authority and diplomatic capacity allow, detach a co-administered historical region (such as Serres under Thessaloniki) into an independent theme at its historic seat."
 oe_t2_dec_split_merged_region.a: "Charter the Standalone Theme"
 oe_t2_dec_split_merged_region_tt: "Removes the parent theme's posts from the co-administered region and founds a standalone theme at its historic seat with size-scaled forces, granting the parent theme #G +5#! loyalty."
 oe_t2_crisis.1.t: "Defiance and Tax Withholding"
 oe_t2_crisis.1.d: "Urgent dispatches reach the Great Palace: the strategos of [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName] has withheld seasonal remittances to Constantinople, quietly expanded personal retainers, and stalled imperial envoys. Open rebellion has not yet erupted — leaving the throne a vital window for decisive statecraft before swords are drawn."
 oe_t2_crisis.1.a: "Dispatch Imperial Guards for a Sudden Purge"
 oe_t2_crisis.1.a.tt: "Normally #G 70%#! chance to arrest the defiant commander (immediate replacement, tenure reset, loyalty raised to #G 55#!, all other themes cowed #G +5#! loyalty, hereditary charter stripped); #R 30%#! chance word leaks and loyalty plunges to #R 15#!. If the theme holds #Y Hereditary Command#!, failure risk doubles to #R 60%#!."
 oe_t2_crisis.1.b: "Broker a Senatorial Compromise"
 oe_t2_crisis.1.b.tt: "Grants [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName] 5 years of #Y Senatorial Tribute Concession#! (+12 loyalty to overlord) and immediately lifts its theme loyalty by #G +20#!, peacefully defusing the crisis at the cost of #R -5#! Public Opinion."
 oe_t2_crisis.1.c: "Mobilize Loyal [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName] to Crack Down and Seize Estates"
 oe_t2_crisis.1.c.tt: "Orders loyal [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName] to march and depose the defiant commander, rewarding [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName] with #G 100#! gold and #G +10#! loyalty while resetting [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName] to a new strategos at #G 50#! loyalty. If the defiant general hailed from a Great House, confiscates rebel estates for #G -80#! house influence and #G +250#! gold."
 oe_t2_crisis.2.t: "Joint Petition of the Themes"
 oe_t2_crisis.2.d: "Several disgruntled strategoi have quietly banded together, putting forward [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName] to deliver a joint petition to Constantinople demanding fiscal relief, guaranteed military pay, and restraint over provincial commands. Left unchecked, this coalition could ignite a coordinated rebellion."
 oe_t2_crisis.2.a: "Bribe and Co-opt the Lead Petitioner"
 oe_t2_crisis.2.a.tt: "Buys off [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName] with #Y 120#! gold and a 5-year tribute concession (#G +20#! loyalty), breaking the coalition and restoring #G +6#! loyalty among the remaining restive themes."
 oe_t2_crisis.2.b: "Convene an Oath of the Strategoi"
 oe_t2_crisis.2.b.tt: "Spends #R 6#! Imperial Authority and accepts 5 years of the #Y Oath of the Strategoi Pay Pledge#! in exchange for #G +12#! loyalty across every theme of the empire."
 oe_t2_crisis.2.c: "Reject the Petition Outright"
 oe_t2_crisis.2.c.tt: "Immediately raises Imperial Authority by #G +10#!, but all restive themes lose #R -8#! loyalty (and hereditary themes lose an extra #R -8#!), driving matters toward a showdown."
 oe_t2_crisis.3.t: "Rebel Estates Confiscated and Theme Purged"
 oe_t2_crisis.3.d: "Backed by the loyal arms of [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName], the defiant commander of [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_crisis_theme').GetCountry.GetName] has been stripped of office and escorted to Constantinople, with dissident estates and granaries inventoried under imperial seal. The Senate and Treasury now await Your Majesty's decree on the spoils."
 oe_t2_crisis.3.a: "Reward Loyal [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName] to Inspire Devotion"
 oe_t2_crisis.3.a.tt: "Grants [ROOT.GetCountry.MakeScope.GetVariable('oe_t2_enforcer_theme').GetCountry.GetName] 10 years of #G Honors of the Loyal Enforcer#! (+5% land morale, +10 loyalty to overlord) and adds #G +5#! imperial prestige."
 oe_t2_crisis.3.b: "Fold Confiscated Estates into the Imperial Fisc"
 oe_t2_crisis.3.b.tt: "Converts seized estates into #G +100#! gold for the imperial treasury and raises Imperial Authority by #G +4#!."
