 STATIC_MODIFIER_NAME_oe_trs_commandaria: "The Commandery Vineyards"
 oe_trs.1.t: "The Water of Bizye"
 oe_trs.1.d: "In the fourth century the aqueduct of the emperor Valens brought the springs of the Thracian hills into Constantinople, and in the fifth its channels were carried on to the hills of Bizye. No emperor has kept it up properly since Andronikos I, and the city now lives mostly on its cisterns. [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] lies nearest to the capital, and [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] offers men to repair the channels."
 oe_trs.1.a: "Pay for it from the treasury"
 oe_trs.1.a.tt: "Constantinople gains 'The Water of Bizye' for 20 years (monthly prosperity +0.5%, population growth +0.5%, disease resistance +10%)"
 oe_trs.1.b: "Let [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] supply the labour"
 oe_trs.1.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +15 (5 years, replacing any earlier recent bonus)\nConstantinople gains 'The Water of Bizye' for 20 years (monthly prosperity +0.5%, population growth +0.5%, disease resistance +10%)"
 oe_trs.1.c: "The cisterns will do"
 oe_trs.2.t: "The Gallipoli Crossing"
 oe_trs.2.d: "In 1305 the Catalan Company made Gallipoli its base and ravaged Thrace for two years, leaving only when the land was eaten bare. Now another band of western mercenaries has come to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName], offering to hold Gallipoli and guard the straits for the empire if they may keep the ferry dues."
 oe_trs.2.a: "Hire them to guard the straits"
 oe_trs.2.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −10, also added to its loyalty target for 5 years"
 oe_trs.2.b: "Let [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] hold it"
 oe_trs.2.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery coastal location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Watch on the Straits' for 10 years (defensiveness +15%)"
 oe_trs.2.c: "Pay them to move on"
 oe_trs.3.t: "The Monastery of Petritzos"
 oe_trs.3.d: "In 1083 Gregory Pakourianos, a Georgian-born general of the empire, founded this monastery in a valley south of Philippopolis. His rule required the monks to know Georgian and kept Greeks out. The Georgian brethren have long since dwindled, and now both the Greek and the Bulgarian monks of the district want the house and its estates."
 oe_trs.3.a: "Give it to the Greek monks"
 oe_trs.3.a.tt: "Imperial Authority +2\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Slighted Bulgarian Monks' for 5 years (unrest +20%)"
 oe_trs.3.b: "Give it to the Bulgarian monks"
 oe_trs.3.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\nImperial Authority −2"
 oe_trs.3.c: "Bring back Georgian monks under the founder's rule"
 oe_trs.4.t: "The Salt Pans of Anchialos"
 oe_trs.4.d: "All through the Middle Ages sea salt has been the living of Anchialos, and its pans are one of the chief sources of salt for Constantinople. Last winter's storms broke the dykes of the pans; the salt-makers ask for them to be rebuilt, and Genoese merchants offer to buy the whole year's salt."
 oe_trs.4.a: "Rebuild the dykes"
 oe_trs.4.a.tt: "Every coastal location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Dykes of Anchialos' for 20 years (salt output +25%, monthly prosperity +0.25%)"
 oe_trs.4.b: "Sell the year's salt to the Genoese"
 oe_trs.4.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −10, also added to its loyalty target for 5 years"
 oe_trs.4.c: "Leave the salt revenue to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]"
 oe_trs.4.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury +80\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)"
 oe_trs.5.t: "The Patriarch of Tarnovo"
 oe_trs.5.d: "In 1235 a church council at Lampsacus recognised the Bulgarian patriarch at Tarnovo as independent. Now that Tarnovo lies within [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName], the Patriarch of Constantinople wants it back under his see, while the Bulgarian bishops and boyars beg the emperor to let them keep their own."
 oe_trs.5.a: "Keep the patriarch at Tarnovo"
 oe_trs.5.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +15, also added to its loyalty target for 5 years\nImperial Authority −3"
 oe_trs.5.b: "Bring it under Constantinople"
 oe_trs.5.b.tt: "Imperial Authority +3\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −10, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Grievance of Tarnovo' for 5 years (unrest +20%)"
 oe_trs.5.c: "Make it an autonomous archbishopric"
 oe_trs.5.c.tt: "Imperial Authority −1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years"
 oe_trs.6.t: "The Hermit of Rila"
 oe_trs.6.d: "In the tenth century the hermit John of Rila withdrew into the mountains south of Serdica, and his disciples built a monastery around him. In 1335 the local lord Hrelja finished a stone tower there. Pilgrims now crowd the mountain paths, robbers have come with them, and the monks ask [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] to guard the road."
 oe_trs.6.a: "Guard the road"
 oe_trs.6.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −50\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Pilgrim Road to Rila' for 10 years (monthly prosperity +0.25%, migration attraction +0.1)"
 oe_trs.6.b: "Let the monastery hire its own guards"
 oe_trs.6.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nImperial Authority −1"
 oe_trs.6.c: "Tax the pilgrims"
 oe_trs.7.t: "The Silver of Novo Brdo"
 oe_trs.7.d: "The silver mines of Novo Brdo were opened under the Serbian king Milutin and appear in documents by 1326. Saxon miners work them under their own mining law, and Ragusan merchants carry the silver to the coast. Now that the mines belong to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName], the Saxons ask to keep their law, and the Ragusans bid to farm the mint."
 oe_trs.7.a: "Confirm the Saxon law"
 oe_trs.7.a.tt: "Imperial Authority −1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Saxon Mining Law' for 20 years (silver output +25%, monthly development +0.005)"
 oe_trs.7.b: "Farm the mint to the Ragusans"
 oe_trs.7.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)"
 oe_trs.7.c: "Take the mines for the crown"
 oe_trs.7.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −10, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Mines Seized' for 5 years (unrest +20%)"
 oe_trs.9.t: "The Long Wall of Christoupolis"
 oe_trs.9.d: "In 1302 the Catalans failed to take Christoupolis. To keep them from coming back, the emperor built a long wall outside the town that closes the whole road between the mountains and the sea. It guards the gate of Macedonia, but it needs men to hold it, and its toll gate has become the most profitable spot in [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]."
 oe_trs.9.a: "Man the wall"
 oe_trs.9.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Long Wall of Christoupolis' for 20 years (defensiveness +15%)"
 oe_trs.9.b: "The tolls go to the treasury"
 oe_trs.9.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.9.c: "The tolls go to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]"
 oe_trs.9.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury +100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)"
 oe_trs.10.t: "The Highlanders of Kruja"
 oe_trs.10.d: "Around 1190 the Albanian Progon ruled Kruja as an archon under the empire, and his son Dhimitër was granted a high imperial title. Now the highlanders of Kruja are driving their flocks down into the plains of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] again, and their chief asks the emperor for a title, offering to hold the mountains for the empire."
 oe_trs.10.a: "Grant the title and let them hold the mountains"
 oe_trs.10.a.tt: "Imperial Authority −2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years"
 oe_trs.10.b: "Settle them in the plains"
 oe_trs.10.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Albanian Settlers' for 10 years (monthly development +0.005, population growth +0.5%)"
 oe_trs.10.c: "Drive them back"
 oe_trs.10.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years"
 oe_trs.11.t: "Saint Theodora of Arta"
 oe_trs.11.d: "Theodora was the wife of Michael II, ruler of Epirus; he drove her from court and she lived five years in poverty. After his death she retired to the convent of St George she had founded in Arta, and the miracles at her tomb made it a place of pilgrimage. Her feast on 11 March is near, and the old nobility of Arta want to march under the banners of the despots of Epirus."
 oe_trs.11.a: "Allow it"
 oe_trs.11.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\nImperial Authority −2"
 oe_trs.11.b: "Imperial banners only"
 oe_trs.11.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years\nImperial Authority +2"
 oe_trs.11.c: "The emperor restores her shrine"
 oe_trs.11.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Shrine of Saint Theodora' for 10 years (monthly prosperity +0.25%, migration attraction +0.1)"
 oe_trs.12.t: "The Herders of Vlachia"
 oe_trs.12.d: "The Vlachs of Thessaly speak a Romance tongue; in summer they drive their flocks into the mountains and in winter bring them down to the plains. Kekaumenos wrote in the eleventh century that they had no respect for officials, and by the thirteenth 'Vlachia' had become a name for Thessaly itself. This autumn, as the flocks came down, the lowland landowners complained to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] that the sheep had trampled their wheat."
 oe_trs.12.a: "Mark out winter pastures"
 oe_trs.12.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] civil administration efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Vlach Winter Pastures' for 20 years (wool output +20%, livestock output +10%)"
 oe_trs.12.b: "Tax the herders"
 oe_trs.12.b.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Herders' Anger' for 5 years (unrest +20%)"
 oe_trs.12.c: "Enlist the herders as mountain troops"
 oe_trs.12.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +10 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.13.t: "The Silk of Thebes"
 oe_trs.13.d: "Thebes and Corinth were once the two great silk towns of the empire. In 1147 the fleet of Roger II of Sicily sacked them both and carried the weavers off with their looms to set up his own silkworks at Palermo. The weavers left in Thebes now ask for lower taxes so they can open their workshops again."
 oe_trs.13.a: "Lower their taxes"
 oe_trs.13.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Silk Workshops of Thebes' for 20 years (silk output +25%, monthly prosperity +0.25%)"
 oe_trs.13.b: "Make them an imperial workshop"
 oe_trs.13.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −10, also added to its loyalty target for 5 years"
 oe_trs.13.c: "Leave things as they are"
 oe_trs.13.c.tt: "Nothing changes"
 oe_trs.15.t: "The Island Corsairs"
 oe_trs.15.d: "In 1185 the king of Sicily granted Cephalonia and Zakynthos to Margaritus of Brindisi, a pirate turned admiral, and later Ithaca became a refuge for pirates. Now the shipowners of the islands ask [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] for letters of marque to prey on enemy merchantmen."
 oe_trs.15.a: "Grant the letters"
 oe_trs.15.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury +100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years"
 oe_trs.15.b: "Take them into the imperial fleet"
 oe_trs.15.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery coastal location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Island Sailors' for 20 years (sailors +10%)"
 oe_trs.15.c: "Forbid privateering"
 oe_trs.15.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] justice efficiency +15 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −10, also added to its loyalty target for 5 years"
 oe_trs.16.t: "The Palace of Diocletian"
 oe_trs.16.d: "The town of Split grew up inside the palace of Diocletian. When Salona was destroyed in the seventh century its people took refuge within the palace walls and never left, and the emperor's mausoleum became the cathedral of Saint Domnius. Now the townsfolk want to pull down stretches of the old walls to build houses, while the bishop asks the emperor to pay for the cathedral's bell tower."
 oe_trs.16.a: "Let them build"
 oe_trs.16.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Houses in the Palace Walls' for 20 years (monthly development +0.005, defensiveness −10%)"
 oe_trs.16.b: "Pay for the bell tower"
 oe_trs.16.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +10 (5 years, replacing any earlier recent bonus)"
 oe_trs.16.c: "Not one stone of the palace"
 oe_trs.16.c.tt: "Imperial Authority +1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.17.t: "The Vineyards of Probus"
 oe_trs.17.d: "The emperor Probus was born at Sirmium. He liked to keep his soldiers at work in peacetime, planting vines in Pannonia and draining marshes, and in 282, at Sirmium itself, soldiers tired of the labour killed him. Now [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] wants the soldiers of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] to tend the vineyards between campaigns, and the veterans have begun to mutter."
 oe_trs.17.a: "Do as Probus did"
 oe_trs.17.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency −10 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Vineyards of Probus' for 20 years (wine output +25%, monthly prosperity +0.25%)"
 oe_trs.17.b: "Soldiers drill and nothing else"
 oe_trs.17.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −60\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)"
 oe_trs.17.c: "Hire peasants to do it"
 oe_trs.17.c.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Vineyards of Probus' for 20 years (wine output +25%, monthly prosperity +0.25%)"
 oe_trs.18.t: "The Military Road at Niš"
 oe_trs.18.d: "Constantine the Great was born in 272 at Naissus, the Niš of today. In 1189 Frederick Barbarossa's crusaders marched down the Roman Via Militaris and were entertained at Niš by the Serbian grand župan Stefan Nemanja. The road stations have mostly fallen into ruin; the caravans ask for the road to be repaired, while the Serbian headmen along it want to collect the tolls themselves."
 oe_trs.18.a: "Rebuild the stations"
 oe_trs.18.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Military Road Restored' for 20 years (market access +10%, monthly prosperity +0.25%)"
 oe_trs.18.b: "Let the headmen collect the tolls"
 oe_trs.18.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\nImperial Authority −2"
 oe_trs.18.c: "Set up imperial tolls"
 oe_trs.18.c.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Tolls on the Military Road' for 10 years (market access −5%)"
 oe_trs.19.t: "The Mastic of Chios"
 oe_trs.19.d: "Mastic is the treasure of Chios, and under the emperors its trade has always been an imperial monopoly. From 1304 the Genoese Zaccaria family held the island, until in 1329 the islanders drove them out and returned to the empire. This year the harvest is rich, and the Genoese merchants are back, offering to buy the whole crop."
 oe_trs.19.a: "Keep the imperial monopoly"
 oe_trs.19.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency +10 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.19.b: "Sell to the Genoese"
 oe_trs.19.b.tt: "Imperial Authority −2"
 oe_trs.19.c: "Let the villagers sell freely"
 oe_trs.19.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Mastic Villages' for 20 years (monthly prosperity +0.5%, market access +5%)"
 oe_trs.22.t: "The Studs of Malagina"
 oe_trs.22.d: "Malagina in the Sangarios valley was the army's nearest great mustering ground to the capital; when the emperor marched east, the troops of the themes joined him there. It also held some of the largest imperial stud farms. The studs have lain waste for years, and [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] asks to restore them to breed horses for the cavalry."
 oe_trs.22.a: "Restore the imperial studs"
 oe_trs.22.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Studs of Malagina' for 20 years (horse output +25%, livestock output +10%)"
 oe_trs.22.b: "Let [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] run them"
 oe_trs.22.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Studs of Malagina' for 20 years (horse output +25%, livestock output +10%)"
 oe_trs.22.c: "Turn them into farmland"
 oe_trs.22.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency −10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Studs Turned to Fields' for 10 years (monthly development +0.005)"
 oe_trs.23.t: "The New Castles"
 oe_trs.23.d: "Between 1162 and 1173 Manuel I drove off the Turkish raiders and rebuilt and fortified Pergamon, Chliara and Adramyttion, and the theme of Neokastra, the New Castles, took its name from them. Early in the fourteenth century the district fell to the Turks of Karasi and Saruhan. Now the castles are the empire's again, and [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] says a castle without a garrison is only a heap of stones."
 oe_trs.23.a: "Garrison them"
 oe_trs.23.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Garrisons of the New Castles' for 20 years (defensiveness +20%)"
 oe_trs.23.b: "Settle colonists as Manuel did"
 oe_trs.23.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Settlers of the New Castles' for 20 years (monthly development +0.005, population growth +0.5%)"
 oe_trs.23.c: "Let [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] see to its own walls"
 oe_trs.23.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +10 (5 years, replacing any earlier recent bonus)"
 oe_trs.24.t: "Philadelphia Alone"
 oe_trs.24.d: "In the early fourteenth century Philadelphia was ringed by Turkish emirates, and its people had to defend the walls themselves. Metropolitan Theoleptos, who held the see from 1283 to 1322, led the citizens in beating off a Turkish siege. Now the elders of the city ask the emperor to confirm their old custom of keeping their own walls, and to remit their taxes."
 oe_trs.24.a: "Confirm the custom and remit the taxes"
 oe_trs.24.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +15, also added to its loyalty target for 5 years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Citizens Hold the Walls' for 20 years (defensiveness +15%, unrest −10%)"
 oe_trs.24.b: "Send an imperial garrison"
 oe_trs.24.b.tt: "Imperial Authority +2\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.24.c: "Honour the citizens"
 oe_trs.24.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years"
 oe_trs.25.t: "The Stones of the Mausoleum"
 oe_trs.25.d: "The tomb of King Mausolus at Halicarnassus was one of the Seven Wonders of the world. Since the twelfth century earthquake after earthquake has brought it down, and now only a field of marble remains. The builders of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] have their eye on this ready-cut stone for the walls, but the town's clergy say the works of the ancients should not be used to build walls."
 oe_trs.25.a: "Take the stone for the walls"
 oe_trs.25.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Stone from the Mausoleum' for 20 years (defensiveness +15%)"
 oe_trs.25.b: "Protect the ruins"
 oe_trs.25.c: "Burn the marble for lime"
 oe_trs.25.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury +100"
 oe_trs.26.t: "Saint Nicholas of Myra"
 oe_trs.26.d: "Saint Nicholas was bishop of Myra, and his tomb lies in the church there. In 1087 merchants from Bari, taking advantage of the chaos of the Turkish invasion, broke open the sarcophagus and carried his bones off to Italy. Pilgrims still come to Myra; the monks ask for money to repair the church, and pilgrims from Bari offer a price for the relics that remain."
 oe_trs.26.a: "Repair the church"
 oe_trs.26.a.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Pilgrims to Myra' for 20 years (monthly prosperity +0.25%, migration attraction +0.1)"
 oe_trs.26.b: "Sell to the men of Bari"
 oe_trs.26.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.26.c: "Leave it to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]"
 oe_trs.26.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −60\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] civil administration efficiency +10 (5 years, replacing any earlier recent bonus)"
 oe_trs.27.t: "The House at Kastamon"
 oe_trs.27.d: "Manuel Erotikos Komnenos, the first known man of his house, acquired wide estates at Kastamon in Paphlagonia, and in the eleventh century it was the stronghold of a family that later gave the empire several emperors. Now Kastamon is the empire's again, and the people point to the ruined castle on the hill and call it the emperors' old home."
 oe_trs.27.a: "Restore it as an imperial estate"
 oe_trs.27.b: "Give it to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]"
 oe_trs.27.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +15, also added to its loyalty target for 5 years\nImperial Authority −3"
 oe_trs.27.c: "Divide the land among the peasants"
 oe_trs.27.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] civil administration efficiency +10 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Land for the Peasants' for 20 years (monthly development +0.005)"
 oe_trs.29.t: "The Pass of Tzivritze"
 oe_trs.29.d: "On 17 September 1176 the army of Manuel I was ambushed by Sultan Kilij Arslan II in the pass of Tzivritze near Myriokephalon, and afterwards the emperor compared himself to Romanos at Manzikert. Now the scouts of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] report that Turkmen nomads are driving their herds into the same passes."
 oe_trs.29.a: "Fortify the passes"
 oe_trs.29.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Forts in the Passes' for 20 years (defensiveness +20%)"
 oe_trs.29.b: "Hire the nomads as scouts"
 oe_trs.29.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.29.c: "Drive them out"
 oe_trs.29.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years"
 oe_trs.30.t: "The Brotherhood of Ankyra"
 oe_trs.30.d: "The craftsmen and merchants of Ankyra are bound together in the Ahi brotherhood. Around 1290, as Seljuk power waned, the brotherhood made Ankara all but independent under nominal Mongol overlordship, much like an Italian merchant republic. Now the city belongs to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName], and the elders of the brotherhood ask to keep their lodges and their guild rules."
 oe_trs.30.a: "Recognise the brotherhood"
 oe_trs.30.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nImperial Authority −2\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Ahi Lodges' for 20 years (market access +5%, monthly prosperity +0.25%)"
 oe_trs.30.b: "Bring the guilds under imperial law"
 oe_trs.30.b.tt: "Imperial Authority +1\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] justice efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Guilds Resent It' for 5 years (unrest +20%)"
 oe_trs.30.c: "Tax the lodges"
 oe_trs.30.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.31.t: "Mevlana and Saint Chariton"
 oe_trs.31.d: "Rumi died at Konya in 1273, and the Mevlevi dervishes who follow him have kept his tomb ever since. Greeks live in the village of Sille outside the city; legend says the saint of the monastery of St Chariton once saved Rumi's son, and Rumi bade the Turks never to harm the village's Greeks. Now the elders of the order and the abbot of the monastery have come together to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName], asking protection for their houses and lands."
 oe_trs.31.a: "Protect them both"
 oe_trs.31.a.tt: "Imperial Authority −2\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Peace of Sille' for 20 years (unrest −10%)"
 oe_trs.31.b: "Protect only the monastery"
 oe_trs.31.b.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Dervishes Resent It' for 10 years (unrest +20%)"
 oe_trs.31.c: "Both must pay taxes"
 oe_trs.32.t: "The Basiliad"
 oe_trs.32.d: "In the fourth century Basil, bishop of Caesarea, built a poorhouse, hostel and hospital outside the city; people called it the Basiliad, and Gregory of Nazianzus compared it to the wonders of the world. In the famine that followed the drought of 368, Basil fed the poor with his own hands. Now Caesarea has had a bad year again, and the clergy ask for the poorhouse to be rebuilt."
 oe_trs.32.a: "The emperor pays for it"
 oe_trs.32.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Basiliad' for 20 years (disease resistance +10%, population growth +0.5%)"
 oe_trs.32.b: "Order [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] to open its granaries"
 oe_trs.32.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] civil administration efficiency +15 (5 years, replacing any earlier recent bonus)"
 oe_trs.32.c: "Let the church raise alms"
 oe_trs.32.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.33.t: "The Fair of Euchaita"
 oe_trs.33.d: "Euchaita is the shrine of the martyr Saint Theodore. In the mid-eleventh century his feast brought a lively fair, and merchants and pilgrims came together from every side. After Manzikert the town lay on the frontier of the Turkoman raids and was probably soon deserted. Now the merchants of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] ask for the fair to be revived, free of customs while it lasts."
 oe_trs.33.a: "Revive it, free of customs"
 oe_trs.33.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Fair of Euchaita' for 20 years (market access +10%, monthly prosperity +0.25%)"
 oe_trs.33.b: "Revive it, with customs"
 oe_trs.33.b.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Fair of Euchaita' for 10 years (market access +10%, monthly prosperity +0.25%)"
 oe_trs.33.c: "No need"
 oe_trs.33.c.tt: "Nothing changes"
 oe_trs.34.t: "The Forty Martyrs of Sebasteia"
 oe_trs.34.d: "Around 320 forty Christian soldiers of Rome were stripped and left overnight on a frozen lake outside Sebasteia. One fled to a warm bath and died at once; a guard who saw a light over the lake threw off his clothes and joined them, so they were still forty. The chapel on the shore has fallen into ruin, and [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName] asks to rebuild it as the shrine of the soldiers of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName]."
 oe_trs.34.a: "The emperor pays for it"
 oe_trs.34.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years"
 oe_trs.34.b: "Let [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] pay"
 oe_trs.34.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury −100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] military efficiency +15 (5 years, replacing any earlier recent bonus)"
 oe_trs.34.c: "Some other time"
 oe_trs.34.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.35.t: "The Cave of Saint Thecla"
 oe_trs.35.d: "On the hill outside Seleukeia is the cave where Saint Thecla spent her last years; the western pilgrim Egeria came here in 384. The Kalykadnos below runs fast, and in 1190 the German emperor Barbarossa drowned in it. The pilgrims ask for a new bridge over the river."
 oe_trs.35.a: "Build the bridge"
 oe_trs.35.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Saint Thecla's Bridge' for 20 years (market access +5%, migration attraction +0.1)"
 oe_trs.35.b: "Run a ferry and charge a fare"
 oe_trs.35.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury +60\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years"
 oe_trs.35.c: "Leave it as it is"
 oe_trs.35.c.tt: "Nothing changes"
 oe_trs.36.t: "The Harbour of Ayas"
 oe_trs.36.d: "In the thirteenth century Ayas was a great port of the Armenian kingdom of Cilicia. After Acre fell and the harbour of Tarsus silted up, the trade between East and West came here for a while, and in 1271 Marco Polo landed here to begin his journey to China. Now the harbour belongs to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName], and its Armenian merchants ask that the old kingdom's privileges for the Italians be kept, so the ships will stay."
 oe_trs.36.a: "Keep the privileges"
 oe_trs.36.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +5, also added to its loyalty target for 5 years\nEvery coastal location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Trade of Ayas' for 20 years (market access +10%, monthly prosperity +0.25%)"
 oe_trs.36.b: "Revoke them"
 oe_trs.36.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.36.c: "Fortify the harbour first"
 oe_trs.36.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] works efficiency +15 (5 years, replacing any earlier recent bonus)\nEvery coastal location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Harbour Walls of Ayas' for 20 years (defensiveness +15%)"
 oe_trs.37.t: "The Syrians of Melitene"
 oe_trs.37.d: "John Kourkouas took Melitene for the empire in 934. In the tenth century Nikephoros II persuaded the patriarch of the Syriac church to move his seat to the district of Melitene, and its monasteries later produced scholars such as the patriarch Michael the Syrian. Now the Syriac bishops ask the emperor to let them keep their own faith, as Nikephoros once did."
 oe_trs.37.a: "Promise toleration"
 oe_trs.37.a.tt: "Imperial Authority −2\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'Syriac Merchants' for 20 years (monthly prosperity +0.25%, market access +5%)"
 oe_trs.37.b: "Demand union with the Patriarch"
 oe_trs.37.b.tt: "Imperial Authority +2\nEvery location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Syriac Church Resents It' for 10 years (unrest +20%)"
 oe_trs.37.c: "Toleration for a price"
 oe_trs.37.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty −5, also added to its loyalty target for 5 years"
 oe_trs.38.t: "The Wine of the Commandery"
 oe_trs.38.d: "Kolossi near Limassol was the Grand Commandery of the Templars and later of the Hospitallers, and the knights sold its sweet wine to the courts of Europe, so the wine took the name Commandaria. Legend says Richard the Lionheart drank it at his wedding in Limassol and called it the wine of kings. Now the knights ask the empire to leave them their estate and their export rights."
 oe_trs.38.a: "Leave them the estate"
 oe_trs.38.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] finance efficiency −10 (5 years, replacing any earlier recent bonus)"
 oe_trs.38.b: "Take the estate for the empire"
 oe_trs.38.b.tt: "Every location of [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] gains 'The Commandery Vineyards' for 20 years (wine output +25%)"
 oe_trs.38.c: "Grant it to [GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetGovernment.GetRuler.GetName]"
 oe_trs.38.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] treasury +100\n[GetCountry('BYZ').MakeScope.GetVariable('oe_trs_theme').GetCountry.GetName] loyalty +10, also added to its loyalty target for 5 years\nImperial Authority −2"
