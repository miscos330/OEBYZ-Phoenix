 STATIC_MODIFIER_NAME_oe_trs_dervish_anger: "The Dervishes Resent It"
 STATIC_MODIFIER_NAME_oe_trs_basiliad: "The Basiliad"
 STATIC_MODIFIER_NAME_oe_trs_euchaita_fair: "The Fair of Euchaita"
 STATIC_MODIFIER_NAME_oe_trs_thecla_bridge: "Saint Thecla's Bridge"
 STATIC_MODIFIER_NAME_oe_trs_ayas_trade: "The Trade of Ayas"
