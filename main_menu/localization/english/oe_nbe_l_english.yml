l_english:
 oe_nbe_b_kalmar_bond: "Kalmar Three Crowns Compact"
 oe_nbe_b_sound_toll_clash: "Øresund Sound Toll Friction"
 oe_nbe_b_hansa_accord: "Øresund-Hanseatic Trade Charter"
 oe_nbe_b_baltic_rivalry: "Baltic Hegemony & Livonian Rivalry"
 oe_nbe_b_baltic_entente: "Baltic-Commonwealth Accord"
 oe_nbe_b_danube_frontier_clash: "Danube Gateways Contestation"
 oe_nbe_b_danube_rome_accord: "Danube-Sava Christian Frontier Accord"
 oe_nbe_b_east_kango_accord: "East Asian Kangō & Maritime Silk Accord"
 oe_nbe_b_east_frontier_clash: "Maritime Smuggling & Liaodong Frontier Clash"
 STATIC_MODIFIER_NAME_oe_nbe_kalmar_centralized: "Kalmar Centralized Three-Crowns Charter"
 STATIC_MODIFIER_DESC_oe_nbe_kalmar_centralized: "Centralizing Denmark, Sweden, and Norway under one crown strengthens subject loyalty and royal power while stirring noble resentment and stability strain."
 STATIC_MODIFIER_NAME_oe_nbe_kalmar_federal: "Kalmar Noble-Council Federal Compact"
 STATIC_MODIFIER_DESC_oe_nbe_kalmar_federal: "Confirming noble council autonomy across the Three Crowns brings domestic prosperity and peace at the cost of weaker crown authority and tax receipts."
 STATIC_MODIFIER_NAME_oe_nbe_sound_toll_enforced: "Øresund Sound Toll Enforcement"
 STATIC_MODIFIER_DESC_oe_nbe_sound_toll_enforced: "Strict Sound Toll levies at Helsingør and Copenhagen swell crown coffers while souring foreign diplomacy and straining patrol upkeep."
 STATIC_MODIFIER_NAME_oe_nbe_hansa_compromise: "Hanseatic Sound Toll Concession"
 STATIC_MODIFIER_DESC_oe_nbe_hansa_compromise: "Granting toll concessions to Lübeck and the Hanseatic League invigorates burghers and merchants while surrendering royal customs revenue."
 STATIC_MODIFIER_NAME_oe_nbe_dominium_maris_baltici: "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_oe_nbe_dominium_maris_baltici: "Disciplined standing armies and heavy Baltic warships contest Riga, Tallinn, Vyborg, and the Neva at steep military and naval upkeep."
 STATIC_MODIFIER_NAME_oe_nbe_baltic_plc_entente: "Baltic-Commonwealth Maritime Entente"
 STATIC_MODIFIER_DESC_oe_nbe_baltic_plc_entente: "Sharing Livonian trade lanes with Poland-Lithuania bolsters morale and commerce while trimming customs revenue and irritating domestic magnates."
 STATIC_MODIFIER_NAME_oe_nbe_swedish_copper_consolidation: "Bothnian Copper & Iron Consolidation"
 STATIC_MODIFIER_DESC_oe_nbe_swedish_copper_consolidation: "Focusing on domestic copper and ironworks lifts production and prosperity while scaling back naval patrols and levy mobilization."
 STATIC_MODIFIER_NAME_oe_nbe_sound_toll_charter_mod: "The Øresund Sound Toll Charter"
 STATIC_MODIFIER_DESC_oe_nbe_sound_toll_charter_mod: "Codifying Baltic transit tolls boosts trade income and merchant reach while incurring diplomatic friction and heavier naval upkeep."
 STATIC_MODIFIER_NAME_oe_nbe_black_army_hun: "Shield of the Danube: The Black Army"
 STATIC_MODIFIER_DESC_oe_nbe_black_army_hun: "Funded by extraordinary hearth taxes, the standing Black Army hardens discipline, heavy cavalry, and Danube forts at harsh upkeep and peasant cost."
 STATIC_MODIFIER_NAME_oe_nbe_magnate_banderia: "Danube Magnate Banderia"
 STATIC_MODIFIER_DESC_oe_nbe_magnate_banderia: "Relying on great magnate banderia from Croatia and Transylvania wins noble loyalty and deeper levies at the expense of royal power and discipline."
 STATIC_MODIFIER_NAME_oe_nbe_hussite_wagenburg: "Hussite Wagenburg & Utraquist Autonomy"
 STATIC_MODIFIER_DESC_oe_nbe_hussite_wagenburg: "Preserving Hussite wagon-fort tactics and Prague Utraquist autonomy boosts infantry, defense, and learning while isolating diplomacy and angering clergy."
 STATIC_MODIFIER_NAME_oe_nbe_compactata_compromise: "Compactata of Prague: Central European Accord"
 STATIC_MODIFIER_DESC_oe_nbe_compactata_compromise: "Reconciling Catholics and moderate Utraquists eases sectarian strife and boosts diplomacy at the cost of looser crown power and pricier stability."
 STATIC_MODIFIER_NAME_oe_nbe_danube_military_frontier: "Danube Military Frontier"
 STATIC_MODIFIER_DESC_oe_nbe_danube_military_frontier: "Fortifying the Vienna-Buda-Belgrade corridor raises defenses, discipline, and manpower while imposing steep tax and maintenance drains."
 STATIC_MODIFIER_NAME_oe_nbe_danube_rome_accord: "Danube-Sava Christian Frontier Accord"
 STATIC_MODIFIER_DESC_oe_nbe_danube_rome_accord: "Demarcating the Danube-Sava frontier with a living New Rome boosts trade, defense, and diplomacy while trimming border customs and crown leverage."
 STATIC_MODIFIER_NAME_oe_nbe_danube_customs_union: "Vienna-Prague Danubian Customs Union"
 STATIC_MODIFIER_DESC_oe_nbe_danube_customs_union: "Integrating Bohemian silver routes and Austrian river commerce boosts trade and prosperity while slackening frontier levies and combat morale."
 STATIC_MODIFIER_NAME_oe_nbe_danube_black_guard_mod: "Danube Standing Black Guard"
 STATIC_MODIFIER_DESC_oe_nbe_danube_black_guard_mod: "Maintaining a permanent standing guard along the Danube strengthens discipline, morale, and fortifications at steep fiscal and upkeep cost."
 STATIC_MODIFIER_NAME_oe_nbe_korea_sadae_trade: "Korean Sadae Diplomacy & Dongnae Trade"
 STATIC_MODIFIER_DESC_oe_nbe_korea_sadae_trade: "Measured Sadae diplomacy and regulated border marts enrich trade, scholarship, and prestige while relaxing levy readiness and army upkeep."
 STATIC_MODIFIER_NAME_oe_nbe_korea_yuan_maritime: "Yuan-Korean Maritime & Liaodong Trade Compact"
 STATIC_MODIFIER_DESC_oe_nbe_korea_yuan_maritime: "Linking Korea directly into Restored Yuan land roads and Quanzhou sea lanes lifts trade and institution growth while ruffling conservative elites."
 STATIC_MODIFIER_NAME_oe_nbe_yuan_korea_bond: "Eastern Peninsula Trade Concord"
 STATIC_MODIFIER_DESC_oe_nbe_yuan_korea_bond: "Korean integration with Yuan roads and maritime trade lifts commerce and prestige at the modest fiscal cost of tributary reciprocity."
 STATIC_MODIFIER_NAME_oe_nbe_korea_turtle_navy: "Korean Coastal Defense & Turtle Ship Navy"
 STATIC_MODIFIER_DESC_oe_nbe_korea_turtle_navy: "Armored coastal warships and fortified garrisons sharpen galley combat, defense, and discipline at steep naval and fiscal cost."
 STATIC_MODIFIER_NAME_oe_nbe_japan_kango_tally: "Japanese Kangō Tally Trade & Anti-Wokou Edict"
 STATIC_MODIFIER_DESC_oe_nbe_japan_kango_tally: "Monopolizing continental commerce under official Kangō tallies and curbing Wokou lifts trade and diplomacy while angering regional lords and raising fleet costs."
 STATIC_MODIFIER_NAME_oe_nbe_japan_wokou_privateers: "Western Daimyo Privateering & Armed Smuggling"
 STATIC_MODIFIER_DESC_oe_nbe_japan_wokou_privateers: "Allowing armed maritime smugglers across Kyushu swells privateer durability, galley power, and sailors at severe diplomatic and stability cost."
 STATIC_MODIFIER_NAME_oe_nbe_japan_silver_silk_road: "Iwami Silver & Quanzhou-Ningbo Silk Route"
 STATIC_MODIFIER_DESC_oe_nbe_japan_silver_silk_road: "Surging Japanese silver exports to Ningbo and Quanzhou fuel trade, output, and reach while stoking inflation and loosening coastal control."
 STATIC_MODIFIER_NAME_oe_nbe_silver_maritime_boom: "East Asian Silver Maritime Boom"
 STATIC_MODIFIER_DESC_oe_nbe_silver_maritime_boom: "Steady inflows of Japanese silver into Quanzhou and Ningbo supercharge maritime trade and workshops while edging inflation upward."
 STATIC_MODIFIER_NAME_oe_nbe_shuinsen_controlled: "Shuinsen Licensed Voyages & Port Controls"
 STATIC_MODIFIER_DESC_oe_nbe_shuinsen_controlled: "Restricting maritime trade to licensed Shuinsen voyages strengthens crown power and taxes while narrowing trade reach and curbing independent merchants."
 STATIC_MODIFIER_NAME_oe_nbe_liaodong_weisuo_order: "Liaodong-Nurgan Weisuo Garrison Order"
 STATIC_MODIFIER_DESC_oe_nbe_liaodong_weisuo_order: "Anchoring Liaodong forts and Fushun horse-markets strengthens border defense, subject loyalty, and cavalry at steep garrison and fiscal upkeep."
 STATIC_MODIFIER_NAME_oe_nbe_manchu_banner_rise: "Jurchen-Manchu Eight Banners Ascendant"
 STATIC_MODIFIER_DESC_oe_nbe_manchu_banner_rise: "Uniting the Jurchen tribes into disciplined Eight Banners surges cavalry shock, discipline, and manpower while alarming neighbors and straining prosperity."
 STATIC_MODIFIER_NAME_oe_nbe_liaodong_fur_frontier: "Kaiyuan-Liaoyang Fur & Ginseng Frontier"
 STATIC_MODIFIER_DESC_oe_nbe_liaodong_fur_frontier: "Opening frontier fur and ginseng marts lifts trade and border prosperity while softening border fortifications and combat morale."
 STATIC_MODIFIER_NAME_oe_nbe_east_sea_tallies_mod: "East Asian Kangō Tally Charter"
 STATIC_MODIFIER_DESC_oe_nbe_east_sea_tallies_mod: "Standardizing official maritime tallies boosts trade income, range, and merchant power while taxing naval patrols and coastal control."
 STATIC_MODIFIER_NAME_oe_nbe_sound_customs_loc: "Øresund Royal Customs & Sound Fortress"
 STATIC_MODIFIER_DESC_oe_nbe_sound_customs_loc: "Royal tollhouses and coastal batteries commanding the Øresund amplify local trade power and prosperity."
 STATIC_MODIFIER_NAME_oe_nbe_baltic_arsenal_loc: "Baltic Royal Dockyard & Arsenal"
 STATIC_MODIFIER_DESC_oe_nbe_baltic_arsenal_loc: "Deepwater Baltic drydocks and fortified quays speed warship construction and bolster sailor reserves."
 STATIC_MODIFIER_NAME_oe_nbe_danube_bastion_loc: "Danube Iron-Gate Bastion & Garrison"
 STATIC_MODIFIER_DESC_oe_nbe_danube_bastion_loc: "Heavy bastions and standing barracks guarding the Danube corridor strengthen local fortifications and manpower."
 STATIC_MODIFIER_NAME_oe_nbe_kango_mart_loc: "East Asian Kangō Trade Emporium"
 STATIC_MODIFIER_DESC_oe_nbe_kango_mart_loc: "Official tally-trade warehouses and silver exchanges anchor regional maritime commerce and local prosperity."
 STATIC_MODIFIER_NAME_oe_nbe_liaodong_weisuo_loc: "Liaodong Weisuo Garrison & Horse-Market"
 STATIC_MODIFIER_DESC_oe_nbe_liaodong_weisuo_loc: "A fortified northeastern garrison and horse-market bolstering border defense, local manpower, and resource output."
 oe_nbe_dec_sound_toll_charter.title: "Enact the Øresund Sound Toll Charter"
 oe_nbe_dec_sound_toll_charter.desc: "Codify uniform shipping dues across the Øresund and Baltic gates, raising trade revenue and merchant power at the cost of Hanseatic friction and patrol upkeep."
 oe_nbe_dec_sound_toll_charter.a: "Seal the Øresund Sound Toll Charter"
 oe_nbe_dec_danube_black_guard.title: "Charter the Danube Standing Black Guard"
 oe_nbe_dec_danube_black_guard.desc: "Raise a salaried standing guard to anchor Buda, Belgrade, Vienna, and Prague, boosting discipline and fortifications at steep fiscal and aristocratic cost."
 oe_nbe_dec_danube_black_guard.a: "Fund the Danube Standing Black Guard"
 oe_nbe_dec_east_sea_tallies.title: "Issue the East Asian Kangō Tally Charter"
 oe_nbe_dec_east_sea_tallies.desc: "Standardize official maritime tallies across Korea, Japan, and mainland Silk Road ports, raising trade income and reach at the price of patrol upkeep and coastal control."
 oe_nbe_dec_east_sea_tallies.a: "Seal the East Asian Kangō Tally Charter"
 oe_nbe.1.t: "The 1397 Union of Kalmar: Three Crowns Compact"
 oe_nbe.1.d: "Bells ring out across Kalmar Castle on the Baltic shore. Pressed by Lübeck and the Hanseatic League, magnates and prelates from Denmark, Sweden, and Norway gather to unite the three Scandinavian crowns under a single sovereign.\n\nA centralized royal union can forge a formidable northern power at the risk of noble resentment, whereas confirming council autonomy preserves peace while loosening royal command and revenues."
 oe_nbe.1.a: "Enact the Kalmar Three-Crowns Charter under firm royal centralization"
 oe_nbe.1.a.tt: "Costs #R 140 gold#!, Stability #R −3#!, Prestige #G +12#!, #G +40#! opinion across the Nordic crowns; gain [ShowModifier('oe_nbe_kalmar_centralized')] for #Y 35 years#!."
 oe_nbe.1.b: "Guarantee noble council autonomy to sustain a federal Nordic union"
 oe_nbe.1.b.tt: "Costs #R 80 gold#!, Stability #G +5#!, #G +40#! opinion across the Nordic crowns; gain [ShowModifier('oe_nbe_kalmar_federal')] for #Y 35 years#!."
 oe_nbe.2.t: "The Øresund Sound Toll and the Hanseatic League"
 oe_nbe.2.d: "Only a few nautical miles wide, the Øresund Strait bottlenecks every hull passing between the Baltic and the North Sea. From Helsingør and Copenhagen, Hanseatic cogs laden with Polish grain, timber, and furs glide past day and night.\n\nRoyal treasurers urge enforcing a strict Sound Toll to fill the crown's coffers, even at the cost of Lübeck's wrath; granting Hanseatic exemptions eases trade friction while surrendering lucrative customs sovereignty."
 oe_nbe.2.a: "Enforce the Øresund Sound Toll at Helsingør and claim the Baltic gate!"
 oe_nbe.2.a.tt: "Costs #R 120 gold#!, Prestige #G +12#!, #R −45#! opinion with Lübeck/Hansa, builds [ShowModifier('oe_nbe_sound_customs_loc')]; gain [ShowModifier('oe_nbe_sound_toll_enforced')] for #Y 35 years#!."
 oe_nbe.2.b: "Grant Lübeck and the Hansa toll concessions to share Baltic trade"
 oe_nbe.2.b.tt: "Costs #R 80 gold#!, Stability #G +4#!, #G +40#! opinion with Lübeck/Hansa; gain [ShowModifier('oe_nbe_hansa_compromise')] for #Y 35 years#!."
 oe_nbe.3.t: "Swedish Independence and Dominium Maris Baltici"
 oe_nbe.3.d: "As sixteenth-century upheaval breaks old northern bonds, a resurgent Sweden looks across the water toward Livonia and the Gulf of Finland. Riga, Tallinn, Vyborg, and the Neva estuary hold the keys to Baltic mastery—contested fiercely by Poland-Lithuania and Russia/Novgorod.\n\nShall we pursue Dominium Maris Baltici by steel and sail, forge a Baltic entente with Poland-Lithuania against the East, or consolidate our domestic copper and ironworks?"
 oe_nbe.3.a: "Proclaim Dominium Maris Baltici and contest Riga, Tallinn, Vyborg, and Neva!"
 oe_nbe.3.a.tt: "Costs #R 220 gold#!, Manpower #R −2#!, raises Army & Navy Tradition (extra Prestige #G +8#! if PLC Lublin or Early Modern Russia is active), #R −45#! opinion with PLC/Rus', builds [ShowModifier('oe_nbe_baltic_arsenal_loc')]; gain [ShowModifier('oe_nbe_dominium_maris_baltici')] for #Y 35 years#!."
 oe_nbe.3.b: "Partner with Poland-Lithuania to check Eastern Rus' and share Livonian ports"
 oe_nbe.3.b.tt: "Costs #R 140 gold#!, #G +45#! opinion with Poland-Lithuania, #R −45#! with Rus'; gain [ShowModifier('oe_nbe_baltic_plc_entente')] for #Y 35 years#!."
 oe_nbe.3.c: "Consolidate Swedish copper and ironworks, avoiding multi-front Baltic wars"
 oe_nbe.3.c.tt: "Costs #R 100 gold#!, Stability #G +5#!; gain [ShowModifier('oe_nbe_swedish_copper_consolidation')] for #Y 35 years#!."
 oe_nbe.4.t: "Shield of the Danube: Matthias's Black Army"
 oe_nbe.4.d: "Southern armies press relentlessly against Belgrade and the lower Danube. Slow, fractious feudal banderia can no longer hold the river frontier against standing Balkan or Ottoman hosts.\n\nBuda proposes raising extraordinary hearth taxes to field a permanent salaried force—the Black Army of Hungary—anchoring the Croatian and Transylvanian marches, at the price of magnate wrath and heavier peasant dues."
 oe_nbe.4.a: "Levy hearth taxes and forge the standing Black Army of Hungary!"
 oe_nbe.4.a.tt: "Costs #R 220 gold#!, Stability #R −3#!, Nobles anger (extra Army Tradition #G +10#! if Hungary's governorate system is active), fortifies Buda/Belgrade with [ShowModifier('oe_nbe_danube_bastion_loc')]; gain [ShowModifier('oe_nbe_black_army_hun')] for #Y 35 years#!."
 oe_nbe.4.b: "Rely on magnate banderia from Croatia and Transylvania instead of new taxes"
 oe_nbe.4.b.tt: "Costs #R 90 gold#!, Stability #G +4#!, Nobles satisfaction rises; gain [ShowModifier('oe_nbe_magnate_banderia')] for #Y 35 years#!."
 oe_nbe.5.t: "Bohemian Hussite Legacy and the Central European Crown"
 oe_nbe.5.d: "Forged in the crucible of the Hussite Wars, Prague preserves both the formidable gunpowder Wagenburg wagon-fort and fierce estate autonomy. Now the Crown of St. Wenceslas stands as the pivot of Central Europe, courted by both Habsburg Vienna and Buda.\n\nShall Bohemia uphold its Hussite military legacy and independent Utraquist estates, or seal the Compactata of Prague to harmonize confessions and bind Central Europe's crowns together?"
 oe_nbe.5.a: "Uphold the Hussite Wagenburg and Utraquist autonomy in Prague"
 oe_nbe.5.a.tt: "Costs #R 150 gold#!, Army Tradition #G +12#! (extra Stability #G +5#! if Hussite Wars or Hussite faith is active); gain [ShowModifier('oe_nbe_hussite_wagenburg')] for #Y 35 years#!."
 oe_nbe.5.b: "Enact the Compactata of Prague to reconcile faiths and Central European crowns"
 oe_nbe.5.b.tt: "Costs #R 120 gold#!, Stability #G +5#!, #G +40#! opinion with Austria/Hungary; gain [ShowModifier('oe_nbe_compactata_compromise')] for #Y 35 years#!."
 oe_nbe.6.t: "Gateways of the Danube: Vienna, Buda, Belgrade & Prague"
 oe_nbe.6.d: "From Prague and Vienna downstream to Buda and Belgrade, the Danube corridor marks the vital hinge between Central Europe and the Balkans. Whenever a great southeastern power—be it the Ottoman Sultanate or a living New Rome—marches to the Sava, all of Central Europe trembles.\n\nWill we raise a fortified Danube Military Frontier, negotiate a Danube-Sava defense accord with a surviving New Rome, or focus inward on a Vienna-Prague customs union?"
 oe_nbe.6.a: "Fortify the Vienna-Buda-Belgrade Military Frontier against the southeast!"
 oe_nbe.6.a.tt: "Costs #R 240 gold#!, Manpower #R −2#!, Army Tradition #G +10#!, #R −50#! opinion with Ottoman/Balkan rivals, builds [ShowModifier('oe_nbe_danube_bastion_loc')]; gain [ShowModifier('oe_nbe_danube_military_frontier')] for #Y 35 years#!."
 oe_nbe.6.b: "Sign the Danube-Sava Christian Frontier Accord with New Rome"
 oe_nbe.6.b.tt: "Costs #R 150 gold#!, Prestige #R −6#!, #G +50#! bilateral opinion with New Rome; both gain [ShowModifier('oe_nbe_danube_rome_accord')] for #Y 35 years#!."
 oe_nbe.6.c: "Develop the Vienna-Prague customs union and avoid Balkan attrition"
 oe_nbe.6.c.tt: "Costs #R 110 gold#!, Stability #G +5#!; gain [ShowModifier('oe_nbe_danube_customs_union')] for #Y 35 years#!."
 oe_nbe.7.t: "The Korean Crossroads: Sadae Diplomacy and Eastern Seas"
 oe_nbe.7.d: "Kaesong, Hanyang, and Dongnae look out across the Yellow Sea and Tsushima Strait as mainland empires shift. Should a Restored Mongol Yuan still command Dadu and open Zaytun's sea lanes, Korea may plug directly into Eurasian overland and maritime trade; should Ming prevail, Confucian tributary diplomacy takes center stage.\n\nWill Korea uphold cautious Sadae border trade, seal a special maritime compact with Restored Yuan, or invest heavily in coastal turtle-ship defenses?"
 oe_nbe.7.a: "Uphold measured Sadae diplomacy and regulated Dongnae border marts"
 oe_nbe.7.a.tt: "Costs #R 120 gold#!, Stability #G +5#!, #G +45#! opinion with mainland China, builds [ShowModifier('oe_nbe_kango_mart_loc')]; gain [ShowModifier('oe_nbe_korea_sadae_trade')] for #Y 35 years#!."
 oe_nbe.7.b: "Seal the Yuan-Korean Maritime & Liaodong Trade Compact with Restored Yuan!"
 oe_nbe.7.b.tt: "Costs #R 150 gold#! (extra Prestige #G +10#! if Zaytun sea lanes are open), #G +45#! bilateral opinion with Restored Yuan (granting Yuan [ShowModifier('oe_nbe_yuan_korea_bond')]), builds [ShowModifier('oe_nbe_kango_mart_loc')]; gain [ShowModifier('oe_nbe_korea_yuan_maritime')] for #Y 35 years#!."
 oe_nbe.7.c: "Modernize coastal defenses and build an armored turtle-ship navy"
 oe_nbe.7.c.tt: "Costs #R 180 gold#!, Manpower #R −2#!, Navy Tradition #G +12#!; gain [ShowModifier('oe_nbe_korea_turtle_navy')] for #Y 35 years#!."
 oe_nbe.8.t: "Japanese Kangō Tally Trade and Wokou Suppression"
 oe_nbe.8.d: "From Kyoto to Hakata and Kyushu's maritime domains, a fierce contest unfolds over East Asian trade. Wokou raiders harry mainland and Korean shores, threatening official commerce, while western clans vie for coveted continental tallies.\n\nShall we issue official Kangō tallies and crack down on Kyushu piracy to unlock legitimate continental wealth, or tolerate armed maritime privateering across the East China Sea?"
 oe_nbe.8.a: "Enforce official Kangō tallies and suppress Kyushu Wokou piracy!"
 oe_nbe.8.a.tt: "Costs #R 160 gold#!, Manpower #R −1.5#!, Navy Tradition #G +10#! (extra Prestige #G +8#! while Wokou crisis is active), #G +45#! opinion with mainland China, builds [ShowModifier('oe_nbe_kango_mart_loc')]; gain [ShowModifier('oe_nbe_japan_kango_tally')] for #Y 35 years#!."
 oe_nbe.8.b: "Tolerate western daimyo privateers and armed smuggling across the sea"
 oe_nbe.8.b.tt: "Costs #R 90 gold#!, Army Tradition #G +12#!, #R −50#! opinion with China and Korea; gain [ShowModifier('oe_nbe_japan_wokou_privateers')] for #Y 35 years#!."
 oe_nbe.9.t: "Iwami Silver and the Quanzhou-Ningbo Maritime Silk Road"
 oe_nbe.9.d: "Cupellation smelting unleashes a torrent of Japanese silver from Iwami, packed aboard hulls bound from Hakata and Kyushu straight for the twin gateways of the Maritime Silk Road—Ningbo (Yinxian) and Quanzhou (Jinjiang).\n\nWith continental Shibosi customs open, silver buys silk, porcelain, and spices at immense profit, though unchecked bullion flows stoke inflation unless reined in by licensed Shuinsen port controls."
 oe_nbe.9.a: "Ship Iwami silver directly to Ningbo and Quanzhou along the Maritime Silk Road!"
 oe_nbe.9.a.tt: "Costs #R 180 gold#!, Prestige #G +12#! (extra Stability #G +6#! if Yuan Shibosi/Zaytun is open), #G +45#! opinion with China (granting [ShowModifier('oe_nbe_silver_maritime_boom')]), builds [ShowModifier('oe_nbe_kango_mart_loc')]; gain [ShowModifier('oe_nbe_japan_silver_silk_road')] for #Y 35 years#!."
 oe_nbe.9.b: "Issue licensed Shuinsen charters and port controls to curb bullion outflow"
 oe_nbe.9.b.tt: "Costs #R 110 gold#!, Stability #G +5#!; gain [ShowModifier('oe_nbe_shuinsen_controlled')] for #Y 35 years#!."
 oe_nbe.10.t: "Liaodong Jurchen Weisuo and the Rising Manchu"
 oe_nbe.10.d: "Across the forests of Hetu Ala, Fushun, Kaiyuan, and Girin Ula, the Jianzhou and Haixi Jurchen tribes watch the garrison gates of Shenyang and Liaoyang. Should a Restored Yuan still hold Liaodong, disciplined Weisuo garrisons and horse-markets may keep the northeastern frontier tethered to the throne.\n\nYet if unified Jurchen tribes or a rising Manchu state rally the Eight Banners, the frontier will erupt into a storm across East Asia."
 oe_nbe.10.a: "Fortify the Liaodong-Nurgan Weisuo garrisons and Fushun horse-markets!"
 oe_nbe.10.a.tt: "Costs #R 200 gold#!, Manpower #R −2#!, Army Tradition #G +10#! (extra Prestige #G +8#! for Restored Yuan), builds [ShowModifier('oe_nbe_liaodong_weisuo_loc')]; gain [ShowModifier('oe_nbe_liaodong_weisuo_order')] for #Y 35 years#!."
 oe_nbe.10.b: "Unite the Jurchen tribes into Eight Banners and march on Liaodong!"
 oe_nbe.10.b.tt: "Costs #R 160 gold#!, Stability #R −3#!, Army Tradition #G +15#!, #R −50#! opinion with China and Korea, builds [ShowModifier('oe_nbe_liaodong_weisuo_loc')]; gain [ShowModifier('oe_nbe_manchu_banner_rise')] for #Y 35 years#!."
 oe_nbe.10.c: "Relax Kaiyuan-Liaoyang fur and ginseng marts to pacify the northeast"
 oe_nbe.10.c.tt: "Costs #R 110 gold#!, Stability #G +5#!; gain [ShowModifier('oe_nbe_liaodong_fur_frontier')] for #Y 35 years#!."
 oe_nbe.20.t: "Eurasian Rim Pack: Choice Takes Effect"
 oe_nbe.90.t: "Eurasian Frontier Realms Status Ledger"
