 oe_ilk_noyan:0 "Ilkhanate Noyan"
 oe_ilk_noyan_desc:0 "A semi-autonomous Mongol-Persian amirate or frontier lordship sworn to an Ilkhanid successor court. It shares its overlord's map color while displaying its own dynastic name, pays vassal tribute at low diplomatic cost, and cannot be casually annexed until centralized by a kurultai."
