 # NEW 2026-11-23 v21.0 Batch 3 Specialized Vassal Systems (JAL/GRG, TIB, MAL + KHM Khorat Mandala) (gen_v210_vassal_realms.py) — Localization (english). Generated by gen_v210_vassal_realms.py; edit the generator, not this file.
