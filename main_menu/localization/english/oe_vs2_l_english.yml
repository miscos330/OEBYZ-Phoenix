 oe_tib_myriarchy:0 "Tibetan Myriarchy"
 oe_tib_myriarchy_desc:0 "One of the monastic-feudal myriarchies of Ü-Tsang, Kham, and Ngari bound to Sakya or Phagmodrupa Tibet. Sharing Tibet's map color and name, it enjoys highland monastic granary and supply bonuses, costs minimal diplomatic capacity, and cannot be annexed until Dzong centralization is enacted."
 LEAD_oe_tib_myriarchy:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_tib_myriarchy:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_tib_myriarchy_subject_opinion:0 "Snowland Throne"
 oe_tib_myriarchy_overlord_opinion:0 "Tibetan Myriarchy"
 oe_vs2_tib_join_off_tt:0 "Snowland Myriarchy Cohesion is at least #Y 55#!"
 oe_vs2_tib_call_off_tt:0 "Snowland Myriarchy Cohesion is at least #Y 25#!"
 oe_vs2_tib_join_def_tt:0 "Snowland Myriarchy Cohesion is at least #Y 25#!"
 oe_mal_farba:0 "Mali Farba Province"
 oe_mal_farba_desc:0 "A provincial governorship or tributary realm administered by a Farba under the Mansa of Mali. Sharing Mali's map color and name, it thrives on goldfield output and trans-Saharan trade, requires low diplomatic capacity, and answers Niani's war summons whenever Mali Imperial Authority stands strong."
 LEAD_oe_mal_farba:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_mal_farba:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_mal_farba_subject_opinion:0 "Mansa of Niani"
 oe_mal_farba_overlord_opinion:0 "Mali Farba Province"
 oe_vs2_mal_join_off_tt:0 "Mali Imperial Authority is at least #Y 55#!"
 oe_vs2_mal_call_off_tt:0 "Mali Imperial Authority is at least #Y 25#!"
 oe_vs2_mal_join_def_tt:0 "Mali Imperial Authority is at least #Y 25#!"
 oe_khm_mandala:0 "Khmer Mandala Vassal"
 oe_khm_mandala_desc:0 "A frontier mandala polity linked to Angkor by stone royal highways and sacred temple networks, such as Phimai on the Khorat Plateau. Sharing Khmer map color and name, it fortifies the northern frontier at low diplomatic cost and remains unannexable until Angkor restores its barays and integrates Khorat."
 LEAD_oe_khm_mandala:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_khm_mandala:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_khm_mandala_subject_opinion:0 "Chakravartin of Angkor"
 oe_khm_mandala_overlord_opinion:0 "Khmer Mandala Vassal"
 oe_vs2_khm_join_off_tt:0 "Khmer Mandala Power is at least #Y 50#!"
 oe_vs2_khm_call_off_tt:0 "Khmer Mandala Power is at least #Y 25#!"
 oe_vs2_khm_join_def_tt:0 "Khmer Mandala Power is at least #Y 25#!"
 oe_vs2_dec_ilk_kurultai_centralize.title:0 "Ilkhanid Kurultai: Subjugate the Noyans"
 oe_vs2_dec_ilk_kurultai_centralize.desc:0 "With Ilkhanid court legitimacy at #Y 70#! or above and a great imperial seat at Baghdad, Tabriz, or Gorgan secured, summon a decisive military kurultai to curb autonomous noyans and reorganize all remaining Ilkhanate Noyan subjects into standard annexable vassals."
 oe_vs2_dec_ilk_kurultai_centralize.a:0 "Proclaim the Centralized Ilkhanid Diwan"
 oe_vs2_dec_tib_dzong_centralize.title:0 "Enact the Dzong District Centralization"
 oe_vs2_dec_tib_dzong_centralize.desc:0 "With Snowland Cohesion at #Y 70#! or above and Lhasa alongside Sakya or Nedong under our writ, abolish hereditary myriarch privileges in favor of salaried Dzongpon governors and convert all Tibetan Myriarchy subjects into annexable vassals."
 oe_vs2_dec_tib_dzong_centralize.a:0 "Establish the Dzongpon Administration"
 oe_vs2_dec_mal_gold_audit.title:0 "Mansa Goldfields & Farba Treasury Audit"
 oe_vs2_dec_mal_gold_audit.desc:0 "Dispatch royal treasury commissioners from Niani to audit Bambuk and Niger caravan rolls, raising Mali Imperial Authority by #G +12#!, calming Farba liberty desire, and sending gold stipends to hard-pressed provinces once every #Y 5#! years."
 oe_vs2_dec_mal_gold_audit.a:0 "Dispatch the Mansa's Gold Auditors"
 oe_vs2_dec_mal_centralize_farbas.title:0 "Centralize the Farba Provinces"
 oe_vs2_dec_mal_centralize_farbas.desc:0 "With Mali Imperial Authority at #Y 75#! or above and the Niger gold axis from Niani to Timbuktu or Gao secure, enact a permanent Kouroukan Fouga centralization charter and convert all remaining Mali Farba Provinces into standard annexable vassals."
 oe_vs2_dec_mal_centralize_farbas.a:0 "Proclaim the Centralized Empire of Mali"
 oe_vs2_dec_khm_khorat_integration.title:0 "Angkor Hydraulic Restoration & Khorat Integration"
 oe_vs2_dec_khm_khorat_integration.desc:0 "With Khmer Mandala Power at #Y 70#! or above and both Angkor and Phimai secured along the Royal Highway, complete the grand restoration of the Angkor barays and reorganize all Khmer Mandala frontier vassals into standard annexable vassals."
 oe_vs2_dec_khm_khorat_integration.a:0 "Restore the Barays and Integrate Khorat"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ilk_legit_high:0 "Ascendant Ilkhanid Court"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ilk_legit_high:0 "Persianate viziers and Mongol noyans alike acknowledge our court's imperial writ across the Iranian plateau and Mesopotamia."
 STATIC_MODIFIER_NAME_oe_vs2_mod_ilk_legit_low:0 "Contested Ilkhanid Legitimacy"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ilk_legit_low:0 "Rival dynasts and restless frontier amirs question our royal patents, withholding customs tolls and dragging their feet at muster."
 STATIC_MODIFIER_NAME_oe_vs2_mod_ilk_centralized:0 "Centralized Ilkhanid Diwan"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ilk_centralized:0 "Through a decisive kurultai, autonomous noyans have been subordinated to salaried governors and imperial diwan registers."
 STATIC_MODIFIER_NAME_oe_vs2_mod_tib_cohesion_high:0 "Harmonious Thirteen Myriarchies"
 STATIC_MODIFIER_DESC_oe_vs2_mod_tib_cohesion_high:0 "Monastic abbots and highland myriarchs keep the plateau relay roads open, provisioning royal banners across Ü-Tsang, Kham, and Ngari."
 STATIC_MODIFIER_NAME_oe_vs2_mod_tib_cohesion_low:0 "Restless Snowland Myriarchies"
 STATIC_MODIFIER_DESC_oe_vs2_mod_tib_cohesion_low:0 "Rivalry among noble estates and monastic sects fractures authority over the thirteen myriarchies, slowing tribute and highland levies."
 STATIC_MODIFIER_NAME_oe_vs2_mod_tib_dzong_centralized:0 "Snowland Dzongpon Administration"
 STATIC_MODIFIER_DESC_oe_vs2_mod_tib_dzong_centralized:0 "Salaried Dzongpon magistrates stationed in fortress-districts have replaced fragmented myriarchies with unified Tibetan statecraft."
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_auth_high:0 "Golden Authority of the Mansa"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_auth_high:0 "From Bambuk to the Niger Bend, loyal farba governors remit gold dust, kola, and caravan customs promptly to the court of Niani."
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_auth_low:0 "Faltering Mandate of Niani"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_auth_low:0 "Succession quarrels erode Niani's prestige; distant provinces along the Senegal and lower Niger withhold tribute and test imperial resolve."
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_gold_audit:0 "Mansa's Goldfields Cadastre"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_gold_audit:0 "Fresh royal weigh-houses and audited caravan ledgers curb smuggling while reassuring loyal farbas of imperial backing."
 STATIC_MODIFIER_NAME_oe_vs2_mod_mal_centralized:0 "Centralized Mali Empire"
 STATIC_MODIFIER_DESC_oe_vs2_mod_mal_centralized:0 "Having overcome centrifugal rebellion, the Mansa rules an integrated West African empire anchored on Niani, Timbuktu, and the goldfields."
 STATIC_MODIFIER_NAME_oe_vs2_mod_khm_mandala_high:0 "Radiant Angkor Mandala"
 STATIC_MODIFIER_DESC_oe_vs2_mod_khm_mandala_high:0 "Sacred baray reservoirs and royal stone causeways radiate Angkor's prestige from the Tonle Sap plains up onto the Khorat Plateau."
 STATIC_MODIFIER_NAME_oe_vs2_mod_khm_mandala_low:0 "Strained Khmer Mandala"
 STATIC_MODIFIER_DESC_oe_vs2_mod_khm_mandala_low:0 "Silted canals and rising Thai and Lao rivals strain Angkor's central treasury, loosening its pull over the outer Khorat frontier."
 STATIC_MODIFIER_NAME_oe_vs2_mod_khm_centralized:0 "Restored Chakravartin Empire"
 STATIC_MODIFIER_DESC_oe_vs2_mod_khm_centralized:0 "Dredged imperial reservoirs and an integrated Angkor-Phimai highway weld Lower Mekong and Khorat into one resilient Khmer state."
 STATIC_MODIFIER_NAME_oe_vs2_mod_loc_angkor_baray_restored:0 "Restored Great Barays of Angkor"
 STATIC_MODIFIER_DESC_oe_vs2_mod_loc_angkor_baray_restored:0 "Rebuilt sluice gates, stone spillways, and irrigation embankments deliver three abundant rice harvests around Angkor Thom."
 oe_vs2.1.title:0 "Twin Courts of the Ilkhanate: Baghdad and Gorgan"
 oe_vs2.1.desc:0 "Since Abu Sa'id's death without an heir, the legacy of Hulagu lies split between rival claimants and ambitious noyan dynasties. Across Iraq, Azerbaijan, Anatolia, and Khorasan, nineteen western amirates watch Baghdad while ten eastern lords watch Gorgan, weighing which court can still enforce the imperial yarligh and protect the Silk Road."
 oe_vs2.1.a:0 "Assert Hulaguid primacy over Tabriz and the Iranian plateau"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev1_a:0 "Imperial Yarligh of the Ilkhan"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev1_a:0 "Bold proclamations of Hulaguid succession rally Persian viziers and steppe cavalry behind our banner."
 oe_vs2.1.b:0 "Confirm frontier tax charters to conciliate the noyans"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev1_b:0 "Noyan Frontier Tax Covenant"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev1_b:0 "Generous revenue confirmations calm restless provincial amirs and keep caravan tolls flowing smoothly."
 oe_vs2.2.title:0 "Eretnid Ambitions in Sivas and Rum"
 oe_vs2.2.desc:0 "In central Anatolia, the Uyghur viceroy Eretna governs Sivas and Kayseri with disciplined troops and rich caravan revenues. Seeing Baghdad preoccupied with Chobanid and Turkmen rivals in Azerbaijan, Eretna has begun striking coins in his own name and negotiating directly with Cairo, testing whether Jalayirid suzerainty still reaches Rum."
 oe_vs2.2.a:0 "Acknowledge Eretnid independence and consolidate Iraq"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev2_a:0 "Consolidated Mesopotamian Core"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev2_a:0 "Relinquishing overstretched Anatolian commitments lets Baghdad tighten fiscal control over Iraq and Kurdistan."
 oe_vs2.2.b:0 "March westward to Sivas and enforce noyan homage"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev2_b:0 "Anatolian Noyan Supremacy"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev2_b:0 "A decisive show of force along the Euphrates reminds every western amir that Baghdad's writ remains unbroken."
 oe_vs2.3.title:0 "Kartids of Herat and the Caspian Lords of Tabaristan"
 oe_vs2.3.desc:0 "In eastern Iran, Togha Temur's court at Gorgan balances precariously between the Tajik Kartid kings of Herat, the Sarbadar rebels of Sabzevar, and the mountain princes of Tabaristan along the Caspian littoral. Malik Mu'izz al-Din Husayn of Herat now hints that Khorasan no longer needs a Chinggisid overlord unless Gorgan proves its strength."
 oe_vs2.3.a:0 "Yield Herat's autonomy to defend Gorgan and Mazandaran"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev3_a:0 "Caspian Citadel Bastion"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev3_a:0 "Retrenching behind the Elburz passes secures fertile Mazandaran and Gorgan against wider Khorasan turmoil."
 oe_vs2.3.b:0 "Enforce Togha Temur's writ across Khorasan and Tabaristan"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev3_b:0 "Khorasan Noyan Compact"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev3_b:0 "Unflinching cavalry expeditions overawe both Herat and the Caspian valleys into renewed obedience."
 oe_vs2.4.title:0 "The Soltaniyeh Diwan and the Reckoning of Iran"
 oe_vs2.4.desc:0 "Beneath the turquoise dome of Soltaniyeh and the bustling bazaars of Tabriz, Persian scribes who once served Ghazan and Rashid al-Din present a sweeping administrative blueprint. By restoring unified coinage, postal relays, and cadastral tax rolls across the plateau, our court can outgrow warlord politics and claim the true mantle of Iran."
 oe_vs2.4.a:0 "Restore the Persianate Grand Diwan of Tabriz and Soltaniyeh"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev4_a:0 "Restored Diwan-i Buzurg"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev4_a:0 "Trained Persian bureaucrats standardize provincial accounting and anchor royal prestige across every bazaar."
 oe_vs2.4.b:0 "Rally the Mongol tumens for a grand campaign of unification"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev4_b:0 "Hulaguid Tumen Banner"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev4_b:0 "Reorganized cavalry tumens ride out from Azerbaijan and Iraq to bring every rival claimant to heel."
 oe_vs2.5.title:0 "Changchub Gyaltsen and the Crisis of the Thirteen Myriarchies"
 oe_vs2.5.desc:0 "Across the Yarlung Tsangpo valley, the Sakya Ponchen administration faces mounting defiance from rival myriarchies. At Nedong, the brilliant Phagmodrupa myriarch Tai Situ Changchub Gyaltsen has won over highland nobles and monasteries alike through fearless legal arbitration, challenging Sakya's century-old hegemony over Tibet."
 oe_vs2.5.a:0 "Back Changchub Gyaltsen and the Phagmodrupa reform movement"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev5_a:0 "Phagmodrupa Ascendancy"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev5_a:0 "Changchub Gyaltsen's vigorous leadership breathes new discipline into Tibetan administration and highland levies."
 oe_vs2.5.b:0 "Rally monastic endowments to uphold the Sakya Ponchen court"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev5_b:0 "Sakya Pontifical Mandate"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev5_b:0 "Generous temple endowments steady the traditional Sakya hierarchy and keep the thirteen myriarchies pacified."
 oe_vs2.6.title:0 "The 1354 Nedong Takeover and the Xuanzheng Yuan Seal"
 oe_vs2.6.desc:0 "By 1354 the balance of power in Ü-Tsang has shifted decisively to Nedong, while imperial authority in Dadu strains beneath Red Turban uprisings. Envoys from the Bureau of Buddhist and Tibetan Affairs (Xuanzheng Yuan) arrive bearing the golden Tai Situ seal: shall Tibet accept imperial confirmation while ruling autonomously, or sever formal vassalage to Great Yuan outright?"
 oe_vs2.6.a:0 "Accept the Tai Situ seal from Dadu while ruling Tibet autonomously"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev6_a:0 "Tai Situ Imperial Patent"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev6_a:0 "Nominal Yuan investiture legitimizes Nedong's rule before conservative abbots while keeping tea-horse trade wide open."
 oe_vs2.6.b:0 "Renounce Xuanzheng Yuan vassalage and proclaim sovereign Snowland"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev6_b:0 "Sovereign Snowland Revival"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev6_b:0 "Casting off outside suzerainty revives memories of the Yarlung emperors and steels highland warriors."
 oe_vs2.7.title:0 "From Thirteen Myriarchies to Dzong Fortresses"
 oe_vs2.7.desc:0 "The Mongol-era myriarchies were carved to divide Tibetan nobles against one another. Now reformers at Nedong and Lhasa propose replacing hereditary fiefs with thirteen fortified Dzong administrative centers governed by appointed Dzongpons, linking judicial courts, grain stores, and border garrisons directly to the central throne."
 oe_vs2.7.a:0 "Build Dzong fortresses and appoint salaried Dzongpon governors"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev7_a:0 "Dzong Fortress Network"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev7_a:0 "Stone Dzong citadels oversee highland valleys, curbing noble feuds while filling central granaries."
 oe_vs2.7.b:0 "Preserve federated myriarch charters in Kham and Ngari"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev7_b:0 "Federated Myriarch Accord"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev7_b:0 "Honoring hereditary local autonomy secures enthusiastic military and logistical cooperation across the frontier."
 oe_vs2.8.title:0 "The Sixteen-Article Legal Code of the Snowland"
 oe_vs2.8.desc:0 "Drawing upon Songtsen Gampo's ancient royal statutes rather than Mongol legal imports, Tibetan jurists compile the Sixteen-Article Code governing blood-money settlements, caravan protection, monastic immunity, and highland post-stations. Its promulgation promises lasting peace across the Roof of the World."
 oe_vs2.8.a:0 "Promulgate the Sixteen-Article Code and rebuild highland relays"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev8_a:0 "Sixteen-Article Snowland Code"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev8_a:0 "Uniform Tibetan jurisprudence and secure relay posts bind distant mountain valleys into a peaceful realm."
 oe_vs2.8.b:0 "Entrust judicial arbitration to the great monastic estates"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev8_b:0 "Monastic Dharma Concord"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev8_b:0 "Respected abbots settle clan disputes peacefully while expanding monastic libraries and highland literacy."
 oe_vs2.9.title:0 "Mansa Sulayman's Golden Age and the Niani Treasury"
 oe_vs2.9.desc:0 "After the lavish pilgrimage of Mansa Musa, his prudent brother Mansa Sulayman restores iron fiscal order across Mali's thirteen Farba provinces. Ibn Battuta marvels at the security of the savanna roads from Takrur and Jolof to Timbuktu and Gao, where provincial governors remit gold dust tribute under the watchful eye of Niani."
 oe_vs2.9.a:0 "Audit the Bambuk goldfields and patronize Timbuktu's jurists"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev9_a:0 "Mansa Sulayman's Golden Order"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev9_a:0 "Disciplined treasury governance fills Niani's vaults while binding all thirteen Farba provinces in prosperity."
 oe_vs2.9.b:0 "Expand the royal Farba cavalry garrisons along the Niger"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev9_b:0 "Imperial Farba Cavalry Corps"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev9_b:0 "Well-mounted Mandinka cavalry squadrons patrol the savanna highways from Senegal to the Niger Bend."
 oe_vs2.10.title:0 "The Succession Crisis of Mari Jata II"
 oe_vs2.10.desc:0 "Following Mansa Sulayman's death in 1360, civil war erupts between his son Qasa and his nephew Mari Jata II. Prodigal spending, court factions, and disputed royal gold nuggets empty Niani's reserves just as outer Farba provinces sense hesitation at the center. Can the council contain the storm before the frontier fractures?"
 oe_vs2.10.a:0 "Endure the succession struggle and concede provincial tax shares"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev10_a:0 "Niani Succession Strain"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev10_a:0 "Dynastic infighting drains imperial prestige and emboldens distant provinces to question Niani's demands."
 oe_vs2.10.b:0 "Empower the Vizier's Treasury Council to steady the throne"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev10_b:0 "Vizier's Regency Stewardship"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev10_b:0 "Decisive treasury stewardship shields Niani from total collapse while buying precious time to restore authority."
 oe_vs2.11.title:0 "Centrifugal Storm: Songhai of Gao and Jolof of the Atlantic"
 oe_vs2.11.desc:0 "As Niani wrestles with succession turmoil, the eastern river lords of Songhai at Gao and the western Wolof confederation of Jolof stop dispatching royal tribute. Both realms command strategic trade corridors far from the Mandinka heartland—holding them by force will test the treasury to its limit, yet letting them go redraws West Africa."
 oe_vs2.11.a:0 "Bow to distance—Gao and Jolof break free from Niani"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev11_a:0 "Consolidated Upper Niger Core"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev11_a:0 "Accepting the loss of distant Gao and Jolof allows Mali to concentrate its garrisons around Niani and the goldfields."
 oe_vs2.11.b:0 "Send royal Niger flotillas and cavalry columns to hold both provinces"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev11_b:0 "Iron Grip of the Mansa"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev11_b:0 "Relentless riverine and cavalry expeditions force Gao and Jolof back beneath Mali's golden umbrella."
 oe_vs2.12.title:0 "The Mansa Revival and the Kouroukan Fouga Charter"
 oe_vs2.12.desc:0 "With the storm of the 1360s weathered, seasoned counselors invoke Sundiata's venerable Kouroukan Fouga assembly to renew the pact between the Mansa, the Wangara gold merchants, and the remaining Farba provinces. Fresh salt-gold caravans stream south from Taghaza toward Timbuktu and Niani, heralding a second golden era for Mali."
 oe_vs2.12.a:0 "Rebind the Farba provinces under a renewed Kouroukan Fouga pact"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev12_a:0 "Revived Kouroukan Fouga Covenant"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev12_a:0 "Restored constitutional oaths unite Mali's provincial governors and clans behind a confident sovereign."
 oe_vs2.12.b:0 "Channel caravan duties into royal mints and Sankore patronage"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev12_b:0 "Niani-Timbuktu Gold Standard"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev12_b:0 "Pure Malian gold coinage and flourishing Sankore scholarship make the empire the commercial beacon of the Sahel."
 oe_vs2.13.title:0 "Silted Barays and the Hydraulic Strain of Angkor"
 oe_vs2.13.desc:0 "For centuries Angkor's unmatched rice harvests depended on monumental baray reservoirs, stone spillways, and hundreds of leagues of gravity-fed canals. Now erratic monsoons and deferred dredging have choked the eastern feeder channels with silt, threatening both the capital's food surplus and Angkor's prestige across the Khorat Plateau."
 oe_vs2.13.a:0 "Defer full dredging and redirect funds to immediate court needs"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev13_a:0 "Silted Angkor Canals"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev13_a:0 "Clogged reservoirs curtail double-cropping around the Tonle Sap and erode confidence in royal stewardship."
 oe_vs2.13.b:0 "Mobilize corvee engineers to dredge the West Baray and sluices"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev13_b:0 "Dredged Angkor Barays"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev13_b:0 "Restored canals pour clear monsoon water into Angkor's paddies, feeding both court artisans and frontier garrisons."
 oe_vs2.14.title:0 "Storm from the Chao Phraya: Ayutthaya's Rise"
 oe_vs2.14.desc:0 "West of the Dangrek escarpment, the newly consolidated Thai kingdom on the Chao Phraya—heir to Lavo and Sukhothai—probes Angkor's western gateways with war elephants and riverine levies. War drums echo from Battambang to the Khorat road; Angkor must decide whether to subsidize its Khorat mandala shield or purchase a tactical truce."
 oe_vs2.14.a:0 "Fortify the Dangrek passes and reinforce the Khorat Mandala"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev14_a:0 "Dangrek Rampart Defense"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev14_a:0 "Reinforced hill fortresses and loyal Khorat auxiliaries blunt western Thai offensives before they reach Angkor."
 oe_vs2.14.b:0 "Grant western border trade concessions to buy breathing space"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev14_b:0 "Pragmatic Mekong Truce"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev14_b:0 "Temporary tariff concessions calm western hostilities, though proud nobles whisper that Angkor's aura is dimming."
 oe_vs2.15.title:0 "Lan Xang and the Upper Mekong Corridor at Phimai"
 oe_vs2.15.desc:0 "From Muang Sua in the northern mountains, the rising Lao confederation of Lan Xang pushes southward down the Mekong toward Savannakhet and Vat Phou. Along the ancient stone highway linking Angkor to Phimai, local Khmer and Kuy governors await clear instructions: autonomy as a loyal mandala buffer, or tighter imperial garrisons?"
 oe_vs2.15.a:0 "Confirm Phimai's mandala autonomy along the Royal Highway"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev15_a:0 "Angkor-Phimai Royal Highway"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev15_a:0 "Rest-houses, shrines, and respected local charters keep Phimai staunchly loyal across the Khorat frontier."
 oe_vs2.15.b:0 "Station direct Angkor garrisons at Champasak and Vat Phou"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev15_b:0 "Upper Mekong Fortress Line"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev15_b:0 "Direct royal garrisons anchor the Mekong river crossings, strengthening Angkor's hand despite local grumbling."
 oe_vs2.16.title:0 "Twilight or Revival of the Chakravartin Mandala"
 oe_vs2.16.desc:0 "As the fourteenth century turns, the Khmer realm stands at a grand historical crossroads. Either Angkor mobilizes its agrarian heartland and Khorat allies to launch a true hydraulic and military renaissance, or the monarchy pivots southward toward the maritime river-ports of Phnom Penh and Longvek to tap the rising South China Sea trade."
 oe_vs2.16.a:0 "Launch the Angkor Hydraulic and Mandala Renaissance"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev16_a:0 "Chakravartin Hydraulic Renaissance"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev16_a:0 "Overflowing granaries and disciplined war-elephant hosts prove that Angkor's imperial sun has not set."
 oe_vs2.16.b:0 "Pivot toward the Lower Mekong river-ports of Phnom Penh"
 STATIC_MODIFIER_NAME_oe_vs2_mod_ev16_b:0 "Lower Mekong Maritime Emporium"
 STATIC_MODIFIER_DESC_oe_vs2_mod_ev16_b:0 "Bustling river entrepots welcome Chinese junks and Nusantara spice traders, funding a resilient Khmer revival."
