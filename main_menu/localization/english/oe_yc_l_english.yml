 oe_yc.1.t: "The Debate on the Paper Money"
 oe_yc.1.desc_t: "#F In 1350, it is recorded, the official Wu Qi proposed to remake the paper money, and Xie Zhedu, the minister of personnel, seconded the proposal: one string of Zhongtong notes was to stand for a thousand copper cash and for two strings of the old Zhiyuan notes, and a new Zhizheng coin was to be cast beside the old copper. When the court met to debate it, the scholar Lü Sicheng spoke against it before them all: it would not work.#!\n\nNow Chancellor Toqto'a leads the debate and waits for the court's decision.\n\nNote: from now on the court debates the year's spending each January and sets how many notes to print; the #bold #color_yellow credit of the notes#!#! decides how well the paper money holds."
 oe_yc.1.desc_x: "#F In 1350, it is recorded, the official Wu Qi proposed to remake the paper money, and Xie Zhedu, the minister of personnel, seconded the proposal: one string of Zhongtong notes was to stand for a thousand copper cash and for two strings of the old Zhiyuan notes, and a new Zhizheng coin was to be cast beside the old copper. When the court met to debate it, the scholar Lü Sicheng spoke against it before them all: it would not work.#!\n\nNow the debate has come before the throne and waits for the court's decision.\n\nNote: from now on the court debates the year's spending each January and sets how many notes to print; the #bold #color_yellow credit of the notes#!#! decides how well the paper money holds."
 oe_yc.1.a: "Issue the Zhizheng notes and cast the Zhizheng coin"
 oe_yc.1.a.tt: "Credit of the notes #R −15#!\nThe yearly debates follow as usual."
 oe_yc.1.b: "Heed Lü Sicheng and keep the old notes"
 oe_yc.1.b.tt: "Credit of the notes #G +5#!\nOld notes are hard to print more of: from now on 'print more' and 'print without count' in the yearly debate bring half as much."
 oe_yc.1.c: "Cast the Zhizheng coin only, keep the notes as they are"
 oe_yc.1.c.tt: "Credit of the notes #R −5#!"
 oe_yc.2.t: "The Year's Spending"
 oe_yc.2.desc_o: "In the first month the Secretariat and the Ministry of Revenue weigh the year's spending. [ROOT.GetCountry.Custom('OeYcNeedNone')][ROOT.GetCountry.Custom('OeYcNeedWar')][ROOT.GetCountry.Custom('OeYcNeedWorks')][ROOT.GetCountry.Custom('OeYcNeedGold')][ROOT.GetCountry.Custom('OeYcNeedC10')]The #bold #color_yellow credit of the notes#!#! stands at #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_trust').GetValue|0]#! ([ROOT.GetCountry.Custom('OeYcTier')]), inflation at #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_infl').GetValue|1]#!%.\n\nThe court kept the old notes, which are hard to print more of: printing more brings only half."
 oe_yc.2.desc_x: "In the first month the Secretariat and the Ministry of Revenue weigh the year's spending. [ROOT.GetCountry.Custom('OeYcNeedNone')][ROOT.GetCountry.Custom('OeYcNeedWar')][ROOT.GetCountry.Custom('OeYcNeedWorks')][ROOT.GetCountry.Custom('OeYcNeedGold')][ROOT.GetCountry.Custom('OeYcNeedC10')]The #bold #color_yellow credit of the notes#!#! stands at #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_trust').GetValue|0]#! ([ROOT.GetCountry.Custom('OeYcTier')]), inflation at #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_infl').GetValue|1]#!%."
 oe_yc.2.a: "Withdraw notes and spend less"
 oe_yc.2.a.tt: "Credit of the notes #G +8#!\nWhile the suppression goes on: the suppression's momentum pool #R −2#!\nThe armies are paid short."
 oe_yc.2.b: "Print the usual quota"
 oe_yc.2.b.tt: "Credit of the notes #R −2#!"
 oe_yc.2.c: "Print more to pay the armies"
 oe_yc.2.c.tt: "Credit of the notes #R −8#!\nWhile the suppression goes on: the suppression's momentum pool #G +3#!\nIf vanilla's High Inflation (from Times of Desperation) is also on us, the two inflations add up."
 oe_yc.2.d: "Print without count"
 oe_yc.2.d.tt: "Credit of the notes #R −15#!\nWhile the suppression goes on: the suppression's momentum pool #G +5#!\nIf vanilla's High Inflation (from Times of Desperation) is also on us, the two inflations add up.\nOnly when this year's need is at its worst or the treasury is empty."
 oe_yc.3.t: "The Paper Money Fails"
 oe_yc.3.desc_x: "#F The histories say that soon after the new notes came out, prices rose more than tenfold; later ten ingots of notes could not buy a peck of millet in the capital, people everywhere bartered goods, the notes all but stopped passing, and the state's revenue failed.#!\n\nNow the #bold #color_yellow credit of the notes#!#! has hit bottom: the notes sent out to pay the armies are refused in every market."
 oe_yc.3.a: "Pay the armies in kind"
 oe_yc.3.a.tt: "Grain and cloth stand in for notes: the armies calm a little, and coin grows scarcer in the markets."
 oe_yc.3.b: "Let it be"
 oe_yc.3.b.tt: "The paper money goes on as it is."
 oe_yc.4.t: "Restoring the Notes"
 oe_yc.4.desc_x: "With the Red Turbans subsiding, a memorial reaches the court: a restoration must begin by making the notes trusted again, by withdrawing the notes printed in excess and printing no more for three years. Yet the #bold #color_yellow credit of the notes#!#! stands at only #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_trust').GetValue|0]#! and inflation at #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_yc_t_infl').GetValue|1]#!%, and withdrawing the notes will cost a great deal."
 oe_yc.4.a: "Three years of withdrawing notes"
 oe_yc.4.a.tt: "Credit of the notes #G +25#!"
 oe_yc.4.b: "Not yet"
 oe_yc.4.b.tt: "Credit of the notes #G +5#!"
