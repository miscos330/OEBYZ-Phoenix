l_english:
 oe_ivr_interregnum: "The Ottoman Interregnum"
 oe_ivr_interregnum_desc: "The Ottoman princes each hold a part of the realm and fight for the sultanate. The empire may back one of them: if that prince takes the throne, the empire recovers its lost cities; if the empire backs a loser, the new sultan will settle accounts.\n\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n[GetCountry('BYZ').Custom('OeBetSt3')]\nThe empire: [GetCountry('BYZ').Custom('OeBetBack')]; commitment #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_stake').GetValue|0]#! / #Y 3#!   Months so far: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!\n\nEach month every prince's strength rises and falls with the fighting; the one on the throne gains #Y +1#!; the one the empire backs gains #Y 1#! + the commitment. The contest is decided when one reaches #Y 90#!, when only one prince is left, or after #Y 12#! years."
 STATIC_MODIFIER_NAME_oe_ivr_straits_pact: "The Straits Clause"
 oe_ivr_treaty_op: "Partner in the Treaty of Gallipoli"
 oe_ivr_obedient_son: "The Obedient Son"
 oe_ivr_spurned: "Backed a Rival"
 oe_ivr.1.t: "News from Ankara"
 oe_ivr.1.desc_nobet: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Sultan Bayezid prisoner. Bayezid's sons each seized a part of the realm, and eleven years of civil war followed.#!\n\nNow the Ottoman throne has been shaken, but there is no second grown prince of the house to contest it. The empire can only look on."
 oe_ivr.1.desc_captured: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Sultan Bayezid prisoner. Bayezid's sons each seized a part of the realm, and eleven years of civil war followed.#!\n\nNow Sultan [GetCountry('BYZ').MakeScope.GetVariable('oe_ivr_sultan').GetCharacter.GetName] is a prisoner and the princes each hold a part of the realm:\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName] holds the throne;\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName] contests it.\nThe empire may back a prince with money, ships and soldiers, and win back its lost cities; or it may stand aside until the contest is decided."
 oe_ivr.1.desc_war: "#F In July 1402 Timur routed the Ottoman army at Ankara and took Sultan Bayezid prisoner. Bayezid's sons each seized a part of the realm, and eleven years of civil war followed.#!\n\nNow the Ottomans have fallen into civil war and the men of the house each command an army:\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName] holds the throne;\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName] contests it.\nThe empire may back a prince with money, ships and soldiers, and win back its lost cities; or it may stand aside until the contest is decided."
 oe_ivr.1.a: "Prepare to take a hand"
 oe_ivr.1.a.tt: "The situation #bold #color_yellow The Ottoman Interregnum#!#! begins: the empire may back one prince, and if that prince wins the throne the cities come back to the empire\nIn about #Y 2#! months the prince on the throne will send envoys"
 oe_ivr.1.b: "Wait and see"
 oe_ivr.1.b.tt: "The situation #bold #color_yellow The Ottoman Interregnum#!#! begins, and the empire keeps its counsel\nIn about #Y 5#! months the prince on the throne will still send envoys"
 oe_ivr.1.c: "Watch from the walls"
 oe_ivr.1.c.tt: "No other Ottoman prince can contest the throne; the empire has no part in this"
 oe_ivr.2.t: "The Rumelian Prince's Terms"
 oe_ivr.2.desc: "#F Early in 1403 Süleyman, who held Adrianople, signed the Treaty of Gallipoli with the empire: Thessaloniki and the coastal towns went back, and the empire's tribute was ended.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName], who holds the throne, has sent envoys with the same terms: if the empire takes that side, Thessaloniki with Chalkidiki and the towns from Selymbria to the Black Sea coast, as far as the Ottomans hold them, will come back, and the empire will pay the sultan no more tribute."
 oe_ivr.2.a: "Accept the terms"
 oe_ivr.2.a.tt: "Back [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName] and sign the Treaty of Gallipoli"
 oe_ivr.2.b: "Ask for one more port"
 oe_ivr.2.b.tt: "#G 40%#! chance they give up Varna as well: back them and sign\n#R 60%#! chance the envoys walk out: no treaty, their strength #Y −5#!"
 oe_ivr.2.c: "Refuse and keep watching"
 oe_ivr.2.c.tt: "Back no one for now"
 oe_ivr.3.t: "The Treaty of Gallipoli"
 oe_ivr.3.desc: "#F The treaty was signed by the prince ruling in the capital and confirmed by the emperor after returning to the capital. Ottoman ships were not to leave the Dardanelles without the emperor's leave, and the sultan's young brothers and sister were sent to Constantinople as hostages.#!\n\nNow the treaty is drawn up and waits only for the empire's envoys to sign."
 oe_ivr.3.a: "Sign it"
 oe_ivr.3.a.tt: "These places, as far as the Ottomans hold them, return to the empire: Thessaloniki and Chalkidiki (#Y 5#! places); Selymbria, Tzouroulos, Rhaidestos, Medeia, Agathopolis, Sozopolis, Anchialos, Pyrgos; and Varna, if they agreed\n#G No more tribute to the sultan#!: any buying-peace agreement with the Ottomans ends\nA #Y 10#!-year truce with the Ottomans\nThe Ottomans gain [ShowModifier('oe_ivr_straits_pact')] for #Y 10#! years\nVenice and Genoa: opinion of the empire #G +10#!\nA young son of the captive sultan comes to Constantinople as a hostage (if there is one)"
 oe_ivr.4.t: "Bursa and Amasya"
 oe_ivr.4.desc: "#F After Ankara, İsa held Bursa and Mehmed held Amasya, and the brothers fought each other in Anatolia.#!\n\nNow the princes are fighting over the towns and loyalties of Anatolia, and the balance has shifted. Month #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!:\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\n[GetCountry('BYZ').Custom('OeBetSt3')]\nThe empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 oe_ivr.4.a: "Fund our prince"
 oe_ivr.4.a.tt: "Costs #R 2#! months of trade and tax income\nCommitment #G +1#! (at most #Y 3#!); our claimant's strength #G +10#!"
 oe_ivr.4.b: "Back the one ahead"
 oe_ivr.4.b.tt: "Back the strongest prince now: [GetCountry('BYZ').Custom('OeBetLeader')]"
 oe_ivr.4.c: "Stay out of it"
 oe_ivr.4.c.tt: "No cost; the contest goes on"
 oe_ivr.5.t: "The Released Prince"
 oe_ivr.5.desc: "#F Musa, taken prisoner along with Bayezid, was set free, crossed into Rumelia and in 1411 defeated Süleyman.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c3').GetCharacter.GetName] has marched into Rumelia with an army and is gaining fast: strength #Y +25#!."
 oe_ivr.5.a: "Stand by our prince"
 oe_ivr.5.a.tt: "Costs #R 2#! months of trade and tax income\nCommitment #G +1#! (at most #Y 3#!); our claimant's strength #G +10#!"
 oe_ivr.5.b: "Back the newcomer"
 oe_ivr.5.b.tt: "Back [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c3').GetCharacter.GetName] instead; our commitment starts again from nothing"
 oe_ivr.5.c: "Watch"
 oe_ivr.5.c.tt: "The contest goes on"
 oe_ivr.6.t: "An Army at the Walls"
 oe_ivr.6.desc: "#F In 1411 Musa, to punish the empire for backing Süleyman, laid siege to Constantinople and raided Thessaloniki and Selymbria, but could not take the city.#!\n\nNow [GetCountry('BYZ').Custom('OeBetLeader')], the strongest of the princes, resents the empire for backing a rival and has brought an army to the walls of Constantinople."
 oe_ivr.6.a: "Hold the walls"
 oe_ivr.6.a.tt: "The siege fails: the besieger's strength #G −10#!"
 oe_ivr.6.b: "Pay them to go"
 oe_ivr.6.b.tt: "Costs #R 3#! months of trade and tax income\nThe besieger withdraws"
 oe_ivr.6.c: "Back the other prince"
 oe_ivr.6.c.tt: "Back the prince who is neither the besieger nor the one we backed; our commitment starts again from nothing, and that prince's strength #G +10#!; the besieger withdraws"
 oe_ivr.7.t: "Ships for the Crossing"
 oe_ivr.7.desc: "#F Imperial ships ferried Mehmed's army across the straits, and imperial soldiers marched with it. In July 1413 Mehmed defeated Musa at Çamurlu.#!\n\nNow the prince we back asks for the imperial fleet to carry an army across the straits."
 oe_ivr.7.a: "Lend the ships"
 oe_ivr.7.a.tt: "Our prince's strength #G +20#!"
 oe_ivr.7.b: "Ships and soldiers"
 oe_ivr.7.b.tt: "Our prince's strength #G +30#!"
 oe_ivr.7.c: "Refuse"
 oe_ivr.7.c.tt: "The contest goes on"
 oe_ivr.8.t: "Çamurlu"
 oe_ivr.8.desc_none: "#F In July 1413 Mehmed, helped by the Serbs, the Hungarians and the empire, defeated Musa at Çamurlu, and the Ottomans were one realm again.#!\n\nNow every prince in the contest is dead or in chains, and the throne has passed to someone else. The empire's bet comes to nothing, and it owes nobody anything."
 oe_ivr.8.desc_won: "#F In July 1413 Mehmed, helped by the Serbs, the Hungarians and the empire, defeated Musa at Çamurlu, and the Ottomans were one realm again.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] has won the throne. The empire backed the right prince."
 oe_ivr.8.desc_lost: "#F In July 1413 Mehmed, helped by the Serbs, the Hungarians and the empire, defeated Musa at Çamurlu, and the Ottomans were one realm again.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] has won the throne. The empire backed a rival, and the new sultan will not forget it."
 oe_ivr.8.desc_aloof: "#F In July 1413 Mehmed, helped by the Serbs, the Hungarians and the empire, defeated Musa at Çamurlu, and the Ottomans were one realm again.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName] has won the throne. The empire stood aside throughout, and the new sultan owes it neither thanks nor grudge."
 oe_ivr.8.a: "The Ottomans have one sultan again"
 oe_ivr.8.a.tt: "If we backed the winner: the new sultan will come to confirm the agreement\nIf we backed a loser: the new sultan will come to settle accounts\nIf we only watched: the matter ends here"
 oe_ivr.9.t: "The Obedient Son"
 oe_ivr.9.desc: "#F Mehmed I confirmed the Treaty of Gallipoli, took the title of the emperor's obedient son and kept the treaty until dying in 1421.#!\n\nNow the new sultan, [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName], has sent envoys to thank the empire for its help and to confirm the agreement."
 oe_ivr.9.a: "Confirm the peace"
 oe_ivr.9.a.tt: "If the Treaty of Gallipoli was never signed, it is signed now (see its terms)\nA #Y 20#!-year truce with the Ottomans\nOttoman opinion of the empire #G +50#! for #Y 8#! years"
 oe_ivr.10.t: "The New Sultan's Reckoning"
 oe_ivr.10.desc: "#F Those who backed the wrong prince usually paid for it.#!\n\nNow the new sultan, [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_wc').GetCharacter.GetName], remembers that the empire backed a rival, and has sent envoys to demand amends."
 oe_ivr.10.a: "Pay to keep the land"
 oe_ivr.10.a.tt: "Pay tribute again under a buying-peace agreement: one payment now and one every January; also #R prestige −15#! and #R [oe_tu_authority|e] −5#!\nThe cities from the treaty are kept"
 oe_ivr.10.b: "Give some land back"
 oe_ivr.10.b.tt: "About #R half#! of the cities from the treaty go back to the Ottomans"
 oe_ivr.10.c: "Refuse"
 oe_ivr.10.c.tt: "Ottoman opinion of the empire #R −50#! for #Y 10#! years\n#R The truce with the Ottomans ends#!"
