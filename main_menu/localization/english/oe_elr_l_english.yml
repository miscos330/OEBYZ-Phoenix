l_english:
 # NEW 2026-11-21 v10.5 Worker 4: Act III Atlantic Hegemony & Act IV Nostos / Imperium Bicephalum (oe_elr_, Slot 74). Generated by gen_elysia_return.py; edit the generator, not this file.
 oe_sit_elysian_nostos: "The Fourth Odyssey: Nostos"
 oe_sit_elysian_nostos_desc: "Having forged an oceanic realm of copper-clad fleets and New World might across the western sea, Nova Elysia sounds the trumpet of homecoming. Purple banners sail eastward past the Azores and the Pillars of Heracles toward Constantinople and Eternal Rome."
 oe_sit_elysian_nostos_triumph: "Triumph of Nostos: Eagles Over the Queen of Cities"
 oe_sit_elysian_nostos_triumph_desc: "The fleets of Nova Elysia have crossed the Atlantic, reclaimed Constantinople, and sealed the destiny of the empire—whether by returning the flame to the Bosphorus or forging a twin-capital Imperium Bicephalum across two seas."
 oe_sit_elysian_nostos_new_era: "A New Era: Leaving the Old World Behind"
 oe_sit_elysian_nostos_new_era_desc: "Nova Elysia has chosen to release its centuries-old longing for the eastern Mediterranean, pouring its full vigor into an enduring New World Roman civilization across the Atlantic."
 oe_elr_map_elysia_tt: "#color_purple Realm of Nova Elysia#!"
 oe_elr_map_sacred_target_tt: "#color_gold Sacred Nostos Objective (Constantinople / Rome)#!"
 oe_elr_map_staging_hub_tt: "#Y Atlantic Nostos Staging Hub (Azores / Gibraltar)#!"
 oe_elr_map_old_world_holder_tt: "#R Old World Holder of the Imperial Capitals#!"
 oe_elr_map_atlantic_rival_tt: "#Y Atlantic Colonial Rival#!"
 oe_elr_cb_nostos_reclamation: "Nostos Imperial Reclamation"
 oe_elr_cb_nostos_reclamation_desc: "Nova Elysia wages war against the occupiers of Constantinople, Rome, Gibraltar, or the Azores stepping-stones to reclaim the ancient heartland of the Roman Empire."
 oe_elr_cb_nostos_target_tt: "The Nostos Expedition must be proclaimed, and the target must hold Constantinople, Rome, Gibraltar, or the Azores."
 oe_elr_ref_imperium_bicephalum: "Imperium Bicephalum"
 oe_elr_ref_imperium_bicephalum_desc: "At last the two-headed eagle fulfills its deepest emblem: one gaze fixed on Nea Konstantinoupolis on the Chesapeake, the other guarding the ancient Queen of Cities on the Bosphorus. Twin administrative cores and oceanic packet fleets bind Atlantic and Mediterranean into a single Roman sphere."
 oe_elr_human_only_tt: "Only available to a player-controlled Nova Elysia."
 oe_elr_nostos_thresholds_tt: "Must control the Chesapeake (or Nansemond), Manhattan, and Roanoke, hold at least 25 American locations, field at least 15 heavy ships (or 25 total ships), and reach the year 1520 (1480 on the early 1337 departure)."
 oe_elr_abandon_ready_tt: "Must have proclaimed Atlantic Mastery, declared Nostos, or reached the year 1550."
 oe_elr_dec_declare_nostos.title: "Declare the Nostos Expedition"
 oe_elr_dec_declare_nostos.desc: "The harbors of Nova Elysia bristle with copper-clad galleons and the arsenals of Chalybopolis gleam with Greek-fire muskets. The hour has come to raise the purple banners eastward and ignite the Nostos Reclamation."
 oe_elr_dec_declare_nostos.a: "Raise the Purple Banners Eastward!"
 oe_elr_dec_declare_nostos_tt: "Launches Act IV and the Nostos situation, revealing the Atlantic-Mediterranean corridor and granting reclamation Casus Belli against the holders of Constantinople, Rome, Gibraltar, and the Azores."
 oe_elr_dec_abandon_old_world.title: "Abandon Old World Obsession"
 oe_elr_dec_abandon_old_world.desc: "The ashes of the Old World belong to another age. The Senate may formally release all obsession with reconquering the eastern Mediterranean and dedicate Nova Elysia to an enduring New World golden age."
 oe_elr_dec_abandon_old_world.a: "Embrace the Eternal Era of Nova Elysia"
 oe_elr_dec_abandon_old_world_tt: "Peacefully concludes the Nostos arc, granting the permanent Independent New World Roman Era modifier along with stability, prestige, and cultural tradition."
 oe_elr_dec_telemetry.title: "Atlantic Hegemony & Nostos Ledger"
 oe_elr_dec_telemetry.desc: "Inspect read-only telemetry for Acts III and IV (Slot 74): Nostos stage, Great Pestilence quarantine status, silver fleet interceptions, and grand ending state."
 oe_elr_dec_telemetry.a: "Open Read-Only Telemetry"
 OE_REGNUM_NOVAE_ELYSIAE: "Regnum Novae Elysiae"
 OE_REGNUM_NOVAE_ELYSIAE_ADJ: "Elysian Viceregal"
 STATIC_MODIFIER_NAME_oe_elr_atlantic_shock_mod: "Atlantic First-Contact Readiness"
 STATIC_MODIFIER_DESC_oe_elr_atlantic_shock_mod: "As European sails reappear off the American coast, Elysian fleets and envoys stand ready to meet Old World astonishment with imperial poise."
 STATIC_MODIFIER_NAME_oe_elr_tordesillas_defiance_mod: "Defiance of Tordesillas"
 STATIC_MODIFIER_DESC_oe_elr_tordesillas_defiance_mod: "The Senate of Nova Elysia openly repudiates Iberian partition treaties, asserting ancient Roman law backed by heavy warships."
 STATIC_MODIFIER_NAME_oe_elr_parallel_30_accord_mod: "Thirtieth Parallel Atlantic Accord"
 STATIC_MODIFIER_DESC_oe_elr_parallel_30_accord_mod: "A pragmatic Atlantic demarcation with Iberian courts eases diplomatic friction while expanding maritime trade across the western ocean."
 STATIC_MODIFIER_NAME_oe_elr_corsair_letters_mod: "Florida Strait Letters of Marque"
 STATIC_MODIFIER_DESC_oe_elr_corsair_letters_mod: "Imperial letters of marque unleash fast corsair squadrons across the Florida Strait to harry rival treasure convoys."
 STATIC_MODIFIER_NAME_oe_elr_havana_smuggling_mod: "Havana–Nea Konstantinoupolis Contraband Web"
 STATIC_MODIFIER_DESC_oe_elr_havana_smuggling_mod: "Clandestine silver and tobacco shipping between Havana and the Chesapeake funnels lucrative maritime revenue into Elysian ports."
 STATIC_MODIFIER_NAME_oe_elr_northern_fleet_mod: "North Atlantic Fishery & Patrol Mastery"
 STATIC_MODIFIER_DESC_oe_elr_northern_fleet_mod: "Northern cruiser squadrons anchored at Nea Athenai secure the Hudson estuary and Grand Banks fisheries against rival European incursions."
 STATIC_MODIFIER_NAME_oe_elr_haudenosaunee_fur_pact_mod: "St. Lawrence & Haudenosaunee Fur Compact"
 STATIC_MODIFIER_DESC_oe_elr_haudenosaunee_fur_pact_mod: "Equitable trade compacts with the northern longhouse nations channel prized interior furs directly into Elysian rivers and ports."
 STATIC_MODIFIER_NAME_oe_elr_mesoamerican_trade_mod: "Trans-Hemispheric Silver & Cacao Lanes"
 STATIC_MODIFIER_DESC_oe_elr_mesoamerican_trade_mod: "Direct maritime commerce with Mesoamerican and Andean realms brings cacao, bullion, and diplomatic prestige to Elysian merchants."
 STATIC_MODIFIER_NAME_oe_elr_mesoamerican_arms_mod: "Covert Firelock Aid to Mesoamerica"
 STATIC_MODIFIER_DESC_oe_elr_mesoamerican_arms_mod: "Clandestine shipments of Chalybopolis matchlocks stiffen Mesoamerican resistance and strain European colonial ventures."
 STATIC_MODIFIER_NAME_oe_elr_quarantine_ports_mod: "Imperial Harbor Quarantine Edict"
 STATIC_MODIFIER_DESC_oe_elr_quarantine_ports_mod: "Byzantine port physicians enforce strict forty-day harbor quarantines, sacrificing short-term trade income for powerful Great Pestilence resistance."
 STATIC_MODIFIER_NAME_oe_elr_quarantine_lax_mod: "Open Harbors Amid the Pestilence"
 STATIC_MODIFIER_DESC_oe_elr_quarantine_lax_mod: "Keeping the docks open preserves commercial revenues during the Great Pestilence at the cost of heightened vulnerability to contagion."
 STATIC_MODIFIER_NAME_oe_elr_hesperian_medical_codex_mod: "The Hesperian Medical Codex"
 STATIC_MODIFIER_DESC_oe_elr_hesperian_medical_codex_mod: "A landmark synthesis of Byzantine clinical medicine, quarantine law, and Algonquian herbal remedies that endures across generations."
 STATIC_MODIFIER_NAME_oe_elr_atlantic_mastery_mod: "Purple Sails: Mastery of the Atlantic"
 STATIC_MODIFIER_DESC_oe_elr_atlantic_mastery_mod: "From the Chesapeake and Nea Athenai to Bermuda and the Caribbean passages, the purple-sailed fleets command the Atlantic lanes unchallenged."
 STATIC_MODIFIER_NAME_oe_elr_new_world_eternal_era_mod: "Eternal Era of Nova Elysia"
 STATIC_MODIFIER_DESC_oe_elr_new_world_eternal_era_mod: "Released from Old World entanglements, Nova Elysia channels its full creative energy into New World urban growth, scholarship, and immigration."
 STATIC_MODIFIER_NAME_oe_elr_azores_staging_mod: "Hesperides Transatlantic Staging"
 STATIC_MODIFIER_DESC_oe_elr_azores_staging_mod: "Forward staging across the Azores and Atlantic convoy depots slashes oceanic distance penalties for the eastward armada."
 STATIC_MODIFIER_NAME_oe_elr_odysseus_homecoming_mod: "Spirit of Odysseus Returning"
 STATIC_MODIFIER_DESC_oe_elr_odysseus_homecoming_mod: "Having pierced the Pillars of Heracles, Elysian soldiers and sailors burn with generational resolve to liberate the Queen of Cities."
 STATIC_MODIFIER_NAME_oe_elr_flame_returned_mod: "Triumph Over the Theodosian Walls"
 STATIC_MODIFIER_DESC_oe_elr_flame_returned_mod: "Double-headed eagles returned from beyond the western ocean fly once more above the Theodosian Walls, filling the realm with historic pride."
 STATIC_MODIFIER_NAME_oe_elr_eternal_city_reunion_mod: "Reunion of the Eternal City"
 STATIC_MODIFIER_DESC_oe_elr_eternal_city_reunion_mod: "Romans from beyond the sunset ocean have entered the Eternal City on the Tiber, uniting three continents beneath a single imperial legacy."
 STATIC_MODIFIER_NAME_oe_elr_return_flame_direct_mod: "Return of the Flame: Direct Atlantic Crown"
 STATIC_MODIFIER_DESC_oe_elr_return_flame_direct_mod: "From a restored throne in Constantinople, fast imperial packet fleets maintain direct crown governance over the loyal American homeland."
 STATIC_MODIFIER_NAME_oe_elr_return_flame_viceroy_mod: "Crown of the Elysian Viceroyalty"
 STATIC_MODIFIER_DESC_oe_elr_return_flame_viceroy_mod: "The imperial crown in Constantinople and the grand Dominion of Nova Elysia stand bound in loyal oceanic partnership."
 STATIC_MODIFIER_NAME_oe_elr_imperium_bicephalum_mod: "Imperium Bicephalum: Twin-Ocean Projection"
 STATIC_MODIFIER_DESC_oe_elr_imperium_bicephalum_mod: "With Nea Konstantinoupolis and Constantinople reigning as twin capitals, imperial copper-clad packet lines bridge the deep Atlantic."
 STATIC_MODIFIER_NAME_oe_elr_viceroy_elysia_mod: "Charter of the Regnum Novae Elysiae"
 STATIC_MODIFIER_DESC_oe_elr_viceroy_elysia_mod: "Entrusted with the western Atlantic shore, the Viceroyalty preserves the Senate and copper-clad naval traditions of Nea Konstantinoupolis."
 STATIC_MODIFIER_NAME_oe_elr_foederati_quarantine_loc_mod: "Byzantine Quarantine & Herbal Camp"
 STATIC_MODIFIER_DESC_oe_elr_foederati_quarantine_loc_mod: "Imperial physicians operate clean-water stations, isolation wards, and herbal dispensaries that sharply blunt the mortality of the Great Pestilence."
 STATIC_MODIFIER_NAME_oe_elr_asclepius_quarantine_loc_mod: "Asclepian Sacred Quarantine Precinct"
 STATIC_MODIFIER_DESC_oe_elr_asclepius_quarantine_loc_mod: "Jointly administered by priests of Asclepius and imperial physicians, sacred purification rites and strict medical quarantine dramatically curb the Great Pestilence."
 STATIC_MODIFIER_NAME_oe_elr_nea_smyrna_base_mod: "Nea Smyrna Caribbean Naval Station"
 STATIC_MODIFIER_DESC_oe_elr_nea_smyrna_base_mod: "Fortified imperial dockyards commanding Havana's deep natural harbor lock down the Straits of Florida and Gulf trade routes."
 STATIC_MODIFIER_NAME_oe_elr_twin_capital_east_mod: "Eastern Co-Capital: Constantinopolitan Core"
 STATIC_MODIFIER_DESC_oe_elr_twin_capital_east_mod: "Serving as the eastern co-capital of the Imperium Bicephalum, Constantinople radiates full metropolitan proximity across the Mediterranean and Eurasia."
 STATIC_MODIFIER_NAME_oe_elr_twin_capital_west_mod: "Western Co-Capital: Nea Konstantinoupolis Core"
 STATIC_MODIFIER_DESC_oe_elr_twin_capital_west_mod: "Serving as the western co-capital of the Imperium Bicephalum, Nea Konstantinoupolis radiates full metropolitan proximity across the Atlantic seaboard."
 oe_elr.1.title: "Shock Across the Atlantic: Old World Sails Sighted"
 oe_elr.1.desc: "Watchtowers along the Chesapeake capes send up triple beacons as European caravels break the eastern horizon. When the Old World mariners behold Tyrian purple double-headed eagle banners flying over stone seawalls and hear harbor magistrates hail them in classical Greek and Latin, disbelief sweeps their decks: in the land they thought uncharted, Rome already stands."
 oe_elr.1.a: "Dispatch Purple Envoys to Announce Nova Elysia"
 oe_elr.1.a.tt: "Sends formal diplomatic dispatches to existing Atlantic European courts while preparing coastal readiness."
 oe_elr.1.b: "Fire Warning Broadsides and Patrol the Approaches"
 oe_elr.1.b.tt: "Demonstrates unmistakable naval strength before European explorers, gaining naval tradition and prestige at diplomatic cost."
 oe_elr.2.title: "Mockery of Tordesillas"
 oe_elr.2.desc: "Merchant captains from the southern islands deliver a copy of an Iberian meridian treaty presuming to partition the entire western hemisphere. Laughter echoes through the Senatus Novae Elysiae—Roman jurists wrote the law of the sea a millennium before those crowns existed. Yet the Senate must choose whether to shatter their claim with warships or negotiate a pragmatic northern boundary."
 oe_elr.2.a: "Proclaim Roman Law Over All Hesperia!"
 oe_elr.2.a.tt: "Defies the Iberian partition, charts Havana and the Bahamas, and bolsters heavy-ship power while angering Iberian courts."
 oe_elr.2.b: "Propose the Thirtieth Parallel Accord"
 oe_elr.2.b.tt: "Calms diplomatic friction with Iberian realms in exchange for lasting Atlantic sea-trade efficiency."
 oe_elr.3.title: "Treasure Galleons of the Florida Strait"
 oe_elr.3.desc: "Each spring, Iberian treasure fleets heavy with Mexican silver and Andean bullion ride the Gulf Stream northward past Havana, the Bahamas, and Bermuda—straight across the maritime heartland of Nova Elysia. Admirals urge an outright naval interception, privateer captains beg for letters of marque, and Chesapeake merchants whisper of quieter contraband fortunes."
 oe_elr.3.a: "Dispatch Copper-Clad Galleons to Seize the Silver!"
 oe_elr.3.a.tt: "Intercepts the treasure convoy for massive gold, prestige, and naval tradition, provoking fierce Iberian hostility."
 oe_elr.3.b: "Issue Imperial Letters of Marque"
 oe_elr.3.b.tt: "Empowers licensed privateers for steady plunder and ship capture with milder diplomatic fallout."
 oe_elr.3.c: "Open the Havana–Chesapeake Contraband Network"
 oe_elr.3.c.tt: "Avoids direct naval clash in favor of a long-term smuggling network lifting maritime trade income."
 oe_elr.4.title: "Nea Smyrna: Mastery of Havana"
 oe_elr.4.desc: "Purple banners now fly above the limestone headlands of Havana's deep natural harbor. Honoring the lost jewel of Asia Minor, the Senate proclaims the port Nea Smyrna. Nearby Ciboney and Lucayo peoples watch closely as imperial engineers prepare to lock down the gateway to the Gulf."
 oe_elr.4.a: "Establish the Naval Station & Island Compact"
 oe_elr.4.a.tt: "Permanently fortifies Nea Smyrna as a Caribbean naval station and fosters friendly ties with the Ciboney and Lucayo peoples."
 oe_elr.4.b: "Fortify the Straits & Levy Imperial Harbor Dues"
 oe_elr.4.b.tt: "Permanently establishes the Nea Smyrna naval base while collecting immediate transit dues and prestige."
 oe_elr.5.title: "Struggle for Nea Athenai: Northern Atlantic Rivals"
 oe_elr.5.desc: "Out of the cold North Atlantic mists, English, French, and Dutch merchantmen and settlers probe the Hudson approaches, New England coves, and northern fisheries. Eyeing the deep harbor of Nea Athenai and the rich fur rivers beyond, the local archon appeals to Nea Konstantinoupolis for firm direction."
 oe_elr.5.a: "Assert Imperial Fishery & Hudson Supremacy"
 oe_elr.5.a.tt: "Grants the North Atlantic Fishery & Patrol Mastery modifier and naval tradition at diplomatic cost with northern rivals."
 oe_elr.5.b: "Charter Regulated Foreign Piers at Nea Athenai"
 oe_elr.5.b.tt: "Eases northern Atlantic tensions with rival courts while collecting substantial port charter fees."
 oe_elr.6.title: "St. Lawrence Furs and the Haudenosaunee Compact"
 oe_elr.6.desc: "Greek fur factors paddling the northern rivers report that the St. Lawrence valley and Haudenosaunee longhouse confederacies control the arterial fur routes of the interior. Pressured by newcomers from across the sea, northern chiefs invite Nova Elysia to strike an exclusive trade compact."
 oe_elr.6.a: "Seal the Northern Fur Compact"
 oe_elr.6.a.tt: "Invests gold in gifts to secure the St. Lawrence & Haudenosaunee Fur Compact and warm relations with the northern tribes."
 oe_elr.6.b: "Fortify the Northern River Approaches"
 oe_elr.6.b.tt: "Skips exclusive concessions, bolstering army tradition and collecting frontier duties instead."
 oe_elr.7.title: "Envoys from the Valley of Mexico and Cusco"
 oe_elr.7.desc: "Elysian scout caravels return from the southern seas accompanied by envoys from the great civilizations of Mesoamerica and the Andes. Astonished by the marble colonnades and firearms of Nea Konstantinoupolis, they seek partnership with a realm equally wary of European conquest."
 oe_elr.7.a: "Covertly Supply Firelocks to Check Iberian Expansion"
 oe_elr.7.a.tt: "Ships matchlocks southward to stiffen Mesoamerican and Andean defenses, raising prestige and war-score leverage."
 oe_elr.7.b: "Open Trans-Hemispheric Silver and Cacao Lanes"
 oe_elr.7.b.tt: "Establishes lucrative coastal trade routes linking Nova Elysia to Mesoamerican and Andean markets."
 oe_elr.8.title: "Refugees of the European Wars of Religion"
 oe_elr.8.desc: "Confessional war ravages the Old World from the Rhine to the Channel. Packet ships crowded with printers, clockmakers, physicians, and scholars cross the stormy Atlantic seeking refuge in the Chesapeake and Nea Athenai. Under the Atlantic Edict of Symmachus, twice as many skilled exiles answer the call of Nova Elysia."
 oe_elr.8.a: "Open Every Harbor to Exiled Scholars and Craftsmen!"
 oe_elr.8.a.tt: "Settles waves of skilled European burgher refugees in Nea Konstantinoupolis and Nea Athenai with cultural tradition; yield doubles on the Symmachus Toleration path."
 oe_elr.8.b: "Admit Only Co-Religionist Artisans"
 oe_elr.8.b.tt: "Admits a smaller stream of co-religionist burghers into the capital while bolstering domestic stability."
 oe_elr.9.title: "Shadow of the Great Pestilence: Imperial Physicians Warn"
 oe_elr.9.desc: "Transatlantic hulls carry not only silver and cloth, but devastating Old World contagion sweeping across the Americas. Imperial physicians schooled in centuries of Mediterranean plague lore sound the alarm, urging immediate forty-day harbor quarantines despite the severe toll on maritime customs."
 oe_elr.9.a: "Enforce Strict Imperial Harbor Quarantine"
 oe_elr.9.a.tt: "Trades short-term maritime customs for formidable national Great Pestilence and disease resistance."
 oe_elr.9.b: "Keep the Harbors Open to Commerce"
 oe_elr.9.b.tt: "Preserves trade revenues during the crisis at the cost of reduced resistance to the Great Pestilence."
 oe_elr.10.title: "Save the Foederati or Watch Them Fall?"
 oe_elr.10.desc: "Contagion darkens the rivers of the Chesapeake and Potomac as native villages and allied Foederati towns cry out for aid. The chief physician reports that dispatching herbal remedies, clean wells, and isolation camps across all American provinces can save vast numbers—and if Asclepius sits enthroned in the Roman Pantheon, his temple healers stand ready to sanctify the quarantine at no cost to the treasury."
 oe_elr.10.a: "Invoke the Asclepius Temple Quarantine Edict!"
 oe_elr.10.a.tt: "Religio Romana Asclepius Synergy: Free of charge, consecrates Asclepian quarantine precincts across all American locations (-70% local Great Pestilence impact) while lifting stability, prestige, and native trust."
 oe_elr.10.b: "Fund Imperial Physicians and Herbal Isolation Camps"
 oe_elr.10.b.tt: "Spends treasury to establish Byzantine quarantine camps across all American locations (-50% local Great Pestilence impact) and strengthens native goodwill."
 oe_elr.10.c: "Guard Only the Hellenic Capital Core"
 oe_elr.10.c.tt: "Conserves treasury by quarantining only the capital at the expense of domestic stability."
 oe_elr.11.title: "The Hesperian Medical Codex"
 oe_elr.11.desc: "As the long shadow of the Great Pestilence recedes across the western hemisphere, the imperial academy compiles the Hesperian Medical Codex—uniting Byzantine clinical treatises, maritime quarantine law, and Algonquian herbal pharmacopoeia into an enduring monument of public health."
 oe_elr.11.a: "Promulgate the Hesperian Medical Codex"
 oe_elr.11.a.tt: "Permanently grants +10% global disease resistance, +2 global life expectancy, Great Pestilence resilience, prestige, and cultural tradition."
 oe_elr.12.title: "Purple Sails Across the Ocean: Atlantic Mastery"
 oe_elr.12.desc: "From the Chesapeake shipyards to Nea Athenai, Bermuda, and the Caribbean sea lanes, an unbroken arc of copper-clad Byzantine hulls commands the western ocean. On the evening the Senate celebrates Atlantic Mastery, a generational question fills the marble chamber: now that the ocean obeys our sails, shall we turn eastward to reclaim the Queen of Cities?"
 oe_elr.12.a: "The Atlantic Is Ours—Open the Debate on Returning East!"
 oe_elr.12.a.tt: "Permanently grants the Purple Sails Atlantic Mastery modifier while unlocking the strategic choice between Nostos and an independent New World era."
 oe_elr.13.title: "Nostos: Oath to Reclaim the Queen of Cities"
 oe_elr.13.desc: "The exiles who fled the burning Bosphorus sleep beneath Chesapeake pines, yet their bronze-inscribed vow endures above the Senate doors: one day the sacred flame shall return to Constantinople. With fleets and legions ready, you may either sound the trumpet of Nostos eastward or turn the final page on the Old World forever."
 oe_elr.13.a: "Swear the Ancestral Oath—Launch the Nostos Expedition!"
 oe_elr.13.a.tt: "Ignites the Nostos situation, reveals the Atlantic-to-Aegean sea corridor, and grants reclamation Casus Belli against the holders of Constantinople, Rome, Gibraltar, and the Azores."
 oe_elr.13.b: "Leave the Old World to Its Ashes—Crown the Eternal Era of Nova Elysia"
 oe_elr.13.b.tt: "Concludes the Nostos arc peacefully and permanently grants the Eternal Era of Nova Elysia modifier."
 oe_elr.14.title: "Return to the Hesperides: Azores and Gibraltar Staging"
 oe_elr.14.desc: "An amphibious crusade across three thousand miles of ocean demands forward bases. The Elysian Admiralty fixes its compass upon the Azores and Gibraltar—the very waters where the ancestral exodus fleet once watered its casks. Secure these stepping-stones, and New World powder and legions will pour unbroken into the Mediterranean."
 oe_elr.14.a: "Reclaim Our Ancestral Azores Beacon Outpost!"
 oe_elr.14.a.tt: "Uses the Act I Azores beacon to claim an unowned Azores harbor directly with a core while granting oceanic staging logistics."
 oe_elr.14.b: "Press Strategic Claims Across the Atlantic Stepping-Stones"
 oe_elr.14.b.tt: "Grants the Hesperides Transatlantic Staging modifier and refreshes reclamation Casus Belli on all staging and imperial objectives."
 oe_elr.14.c: "Commission Floating Atlantic Supply Convoys"
 oe_elr.14.c.tt: "Invests gold in dedicated ocean supply convoys for extended transatlantic staging relief and naval tradition."
 oe_elr.15.title: "Copper-Clad Fleet Through the Pillars of Heracles"
 oe_elr.15.desc: "A shiver sweeps across the Old World as ranks of gleaming copper-clad galleons flying Tyrian purple banners emerge from the morning mist of Gibraltar into the Mediterranean. Bell towers ring from Seville to Venice, and in Constantinople the current masters of the strait pale at the news: the exiled Romans have returned from beyond the ocean."
 oe_elr.15.a: "Full Sail for the Queen of Cities!"
 oe_elr.15.a.tt: "Advances Nostos to Stage 2, granting the Spirit of Odysseus Returning combat and siege modifier while refreshing reclamation Casus Belli."
 oe_elr.16.title: "The Flame Returns! Eagles Over the Theodosian Walls"
 oe_elr.16.desc: "Gunsmoke clears as dawn breaks gold across the ancient triple walls of Theodosius and the shimmering Golden Horn. Disciplined ranks of Pyrophoroi musketeers march up the Mese bearing purple standards carried across the Atlantic from Chesapeake Bay. Tears stream down weathered faces along the marble steps: the long western odyssey has brought the flame home to the Queen of Cities."
 oe_elr.16.a: "Rededicate Hagia Sophia to the Universal Orthodox Flame!"
 oe_elr.16.a.tt: "Advances Nostos to Stage 3 with a grand Orthodox rededication of Hagia Sophia, granting the Triumph modifier, prestige, legitimacy, and stability."
 oe_elr.16.b: "Proclaim the Triumph of Sol Invictus and the Atlantic Pantheon!"
 oe_elr.16.b.tt: "Advances Nostos to Stage 3 with a classical Religio Romana triumph on the Bosphorus, ensuring omens remain unlocked and granting prestige and cultural tradition."
 oe_elr.16.c: "Proclaim the Ecumenical Jubilee of the Two-Headed Eagle!"
 oe_elr.16.c.tt: "Advances Nostos to Stage 3 with a grand civic and ecumenical jubilee, granting the Triumph modifier, stability, and cultural tradition."
 oe_elr.17.title: "Echoes of the Eternal City: Western Romans in Rome"
 oe_elr.17.desc: "Purple standards cross the Apennines as legions from beyond the western ocean march along the Via Sacra into Rome. Beneath weathered triumphal arches and the Capitoline Hill, soldiers speaking Atlantic Greek and classical Latin gaze upon millennia-old marble: from the Tiber to the Bosphorus, across the sea to the Chesapeake, and home again to Rome."
 oe_elr.17.a: "Inscribe the Tri-Continental Triumph Upon the Capitoline!"
 oe_elr.17.a.tt: "Permanently grants the Reunion of the Eternal City modifier, prestige, and cultural tradition; if following Religio Romana, unlocks all ten European Hexapantheon deities for full Capitoline synergy."
 oe_elr.18.title: "Destiny of Empire: Return of the Flame or Imperium Bicephalum?"
 oe_elr.18.desc: "Purple carpets once more line the imperial palaces of Constantinople, yet across the Atlantic Nea Konstantinoupolis blazes with undimmed prosperity. The empire awaits your supreme decree: return the throne to the Bosphorus—governing America directly or chartering a grand Viceroyalty of Nova Elysia—or shatter ancient precedent by founding the Imperium Bicephalum, a true twin-capital empire spanning two oceans."
 oe_elr.18.a: "Ending A (Direct): Return the Capital to Constantinople"
 oe_elr.18.a.tt: "Moves the capital back to Constantinople, restores the Eastern Roman title, grants permanent transatlantic direct-rule proximity relief, and seals Stage 4."
 oe_elr.18.b: "Ending A (Viceroyalty): Return East & Charter Regnum Novae Elysiae"
 oe_elr.18.b.tt: "Moves the capital to Constantinople first, restores the Eastern Roman title, and charters all American holdings into the loyal Dominion of Regnum Novae Elysiae with permanent bonuses for both realms."
 oe_elr.18.c: "Ending B: Proclaim the Twin-Capital Imperium Bicephalum!"
 oe_elr.18.c.tt: "Renames the realm to Imperium Bicephalum, enacts the exclusive Twin-Capital Reform, slashes ocean and deep-ocean proximity penalties, and permanently anchors full 100 local proximity sources in both Constantinople and Nea Konstantinoupolis."
 oe_elr.19.title: "True Meaning of the Two-Headed Eagle"
 oe_elr.19.desc: "From desperate flight past the Pillars of Heracles and Sargasso storms, through the pine-ringed birth of Nea Konstantinoupolis, to the copper-clad armada returning beneath the dome of Hagia Sophia—chroniclers proclaim that the two-headed eagle has at last found its truest meaning: one head gazing upon the ancient East, the other upon the boundless New World. The Fourth Odyssey is complete."
 oe_elr.19.a: "Inscribe the Fourth Odyssey in the Imperial Chronicles!"
 oe_elr.19.a.tt: "Formally closes the Nostos situation, records the chronicle milestone, and awards prestige, stability, and cultural tradition."
 oe_elr.20.title: "Atlantic Hegemony & Nostos Telemetry"
 oe_elr.20.desc: "#T Fourth Odyssey Acts III & IV Read-Only Telemetry (Slot 74 oe_elr_)#!\n- Nostos Campaign Stage (0 Idle / 1 Staging / 2 Mediterranean / 3 Constantinople Reclaimed / 4 Finale): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_nostos_stage').GetValue|0]#!\n- Great Pestilence Quarantine Tier (0 None / 1 Harbor / 2 Foederati Camps / 3 Asclepian Sanctum): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_quarantine_state').GetValue|0]#!\n- Caribbean Silver Fleet Interceptions: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_silver_intercepts').GetValue|0]#!\n- Grand Ending Code (0 Pending / 1 Return of the Flame / 2 Imperium Bicephalum): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_elr_grand_ending_achieved').GetValue|0]#!"
 oe_elr.20.a: "Close Telemetry"
