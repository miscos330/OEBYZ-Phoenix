l_english:
 oe_belisarius_retired: "Retired from Office"
 oe_belisarius_retired_desc: "This character has been ordered to retire from public service. They cannot enter the cabinet, command armies or fleets, or hold an imperial court office. Retirement does not change their estate, religion or residence."
 oe_flavor_byz.1017.t: "The Laurels of Ravenna"
 oe_flavor_byz.1017.d: "(Mehmed II)\n\nDispatches from Italy now cover the table before the throne. Thirty towns and districts have been brought into the Empire, and the name of Belisarius has travelled across the peninsula with every report.\n\nItalian envoys now bring silver, silks and laurel wreaths to his tent. Some ask him to settle their cities’ disputes; others present gifts intended for the Emperor first to the commander who decides when their gates must open. Soldiers shout his name around the campfires, while the imperial titles at the head of each dispatch grow shorter.\n\nNo one can say precisely when he overstepped his station. He still claims to campaign by imperial command and hands his conquests to the Empire. Yet the court is uneasy. When people speak of Rome’s victories in Italy, whom do they remember first: the Emperor, or his general?"
 oe_flavor_byz.1017.a: "He has earned these honours."
 oe_flavor_byz.1017.a.tt: "Authority #R -10#!. Belisarius retains his eligibility for office and military command."
 oe_flavor_byz.1017.b: "Let him retire."
 oe_flavor_byz.1017.b.tt: "Belisarius gains the Retired from Office trait and relinquishes cabinet, army and fleet commands. He cannot hold these positions again and leaves any imperial court office. His personal conquest abilities in Italy and the Fertile Crescent cease to function."
 oe_flavor_byz.1017.historical_info: "This event imagines a court fearing the fame of a victorious general during an Eastern Roman restoration. The historical Mehmed II was an Ottoman sultan, not a general under a Roman emperor. The laurels in the title symbolize military prestige; owning Ravenna itself is not required."
 oe_flavor_byz.1018.t: "Expedition to the Two Rivers"
 oe_flavor_byz.1018.d: "(Mehmed II)\n\nWord of war in the east has reached the court. Belisarius unfolds a map of the Euphrates and Tigris, pointing out crossings, granary towns and provincial seats along their courses. He is no longer an untested young officer. His victories have taught him how the fall of a fortress can decide the fate of an entire district.\n\n“Your Majesty, these cities depend upon roads, canals and storehouses. To let the enemy organize a fresh resistance in every town is to give him back the time we have won. Let me receive the countryside on the day its provincial capital falls, with officials following our soldiers into the granaries and chancelleries. The fortresses that still refuse us will be dealt with in turn.”\n\nThe work of governing will be long. For now, he asks that Rome’s decrees advance eastward alongside its standards."
 oe_flavor_byz.1018.a: "Cross the two rivers. Turn victory into imperial territory."
 oe_flavor_byz.1018.a.tt: "Byzantine armies personally commanded by Belisarius gain strong conquest against wartime enemies in the Fertile Crescent. Occupied ordinary locations and fortresses won by siege immediately become Byzantine territory. Taking a provincial capital also transfers every unfortified Fertile Crescent location held by wartime enemies in the same geographical province. Other fortresses require separate sieges.\n#Y No new cores#! are granted; existing cores are retained. Neutral and friendly lands are excluded. The ability belongs to Belisarius alone and ceases to function if he retires or dies."
 oe_flavor_byz.1018.historical_info: "Belisarius leading Eastern Roman armies between the Euphrates and Tigris is an alternate-history premise of this chain. Provincial capitals causing unfortified locations to change ownership is a gameplay mechanic of this mod."
