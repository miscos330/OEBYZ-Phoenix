# NEW 2026-11-22 v15.5 Stars of East Asia — Northern Yuan Revival (oe_nyu_). Generated by gen_v155_east_se_asia.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_nyu_karakorum_rally_mod:0 "Karakorum Rally of the Golden Lineage"
 STATIC_MODIFIER_DESC_oe_nyu_karakorum_rally_mod:0 "Regrouping beneath the nine yak-tail banners at Karakorum keeps the Borjigin imperial mandate alive across the steppe."
 STATIC_MODIFIER_NAME_oe_nyu_pasture_recovery_mod:0 "Kerulen-Selenga Pasture Recovery"
 STATIC_MODIFIER_DESC_oe_nyu_pasture_recovery_mod:0 "Securing fertile river pastures across the Kerulen and Selenga restores herds, remounts, and tribal manpower."
 STATIC_MODIFIER_NAME_oe_nyu_borjigin_seal_mod:0 "Imperial Seal of the Borjigin"
 STATIC_MODIFIER_DESC_oe_nyu_borjigin_seal_mod:0 "Safeguarding the imperial seal and chancery sustains the Khagan's unmatched prestige across the Eurasian steppe."
 STATIC_MODIFIER_NAME_oe_nyu_mobile_warbands_mod:0 "Steppe Mobile Warbands"
 STATIC_MODIFIER_DESC_oe_nyu_mobile_warbands_mod:0 "Dispersed horse-archer squadrons turn the vast Gobi into an elastic shield, outmaneuvering slower armies."
 STATIC_MODIFIER_NAME_oe_nyu_oirat_compact_mod:0 "Oirat-Khalkha Steppe Compact"
 STATIC_MODIFIER_DESC_oe_nyu_oirat_compact_mod:0 "Reconciling western Oirat taishis and eastern lords secures pasture roads from the Altai to the Orkhon."
 STATIC_MODIFIER_NAME_oe_nyu_khagan_supremacy_mod:0 "Khagan's Martial Supremacy"
 STATIC_MODIFIER_DESC_oe_nyu_khagan_supremacy_mod:0 "Breaking rival warlords concentrates elite steppe cavalry directly beneath the Great Khan's personal banner."
 STATIC_MODIFIER_NAME_oe_nyu_esen_ascendancy_mod:0 "Esen Taishi's Steppe Ascendancy"
 STATIC_MODIFIER_DESC_oe_nyu_esen_ascendancy_mod:0 "Commanding tributaries from Hami to the Manchurian borderlands, united steppe hosts project overwhelming martial force."
 STATIC_MODIFIER_NAME_oe_nyu_oasis_caravans_mod:0 "Hexi & Oasis Caravan Routes"
 STATIC_MODIFIER_DESC_oe_nyu_oasis_caravans_mod:0 "Guarding oasis caravan tracks linking Hami and Samarkand funnels silk, tea, and silver duties into the steppe court."
 STATIC_MODIFIER_NAME_oe_nyu_tumu_hegemony_mod:0 "Tumu Victory Steppe Hegemony"
 STATIC_MODIFIER_DESC_oe_nyu_tumu_hegemony_mod:0 "A stunning encirclement along the northern frontier shatters southern complacency and cements steppe martial prestige."
 STATIC_MODIFIER_NAME_oe_nyu_tumu_arsenal_mod:0 "Captured Ordnance & Steppe Smiths"
 STATIC_MODIFIER_DESC_oe_nyu_tumu_arsenal_mod:0 "Integrating captured gunsmiths and armorers introduces steel forging and gunpowder ordnance to steppe arsenals."
 STATIC_MODIFIER_NAME_oe_nyu_mandukhai_mod:0 "Queen Mandukhai's Unbroken Banner"
 STATIC_MODIFIER_DESC_oe_nyu_mandukhai_mod:0 "Armored in battle to protect the Borjigin heir, Queen Mandukhai inspires fierce devotion and dynastic revival."
 STATIC_MODIFIER_NAME_oe_nyu_steppe_marriages_mod:0 "Steppe Dynastic Alliances"
 STATIC_MODIFIER_DESC_oe_nyu_steppe_marriages_mod:0 "Strategic marriage ties knit restless frontier chieftains into a steadier dynastic coalition."
 STATIC_MODIFIER_NAME_oe_nyu_six_tumens_mod:0 "Dayan Khan's Six Tumens Constitutional Order"
 STATIC_MODIFIER_DESC_oe_nyu_six_tumens_mod:0 "Abolishing rogue warlords, Dayan Khan divides the realm into disciplined Left and Right Wing Tumens under royal princes."
 STATIC_MODIFIER_NAME_oe_nyu_ordos_autonomy_mod:0 "Ordos Bend Frontier Autonomy"
 STATIC_MODIFIER_DESC_oe_nyu_ordos_autonomy_mod:0 "Granting frontier autonomy across the fertile Ordos loop keeps western border riders swift and well-supplied."
 STATIC_MODIFIER_NAME_oe_nyu_dalan_victory_mod:0 "Victory at Dalan Terigun"
 STATIC_MODIFIER_DESC_oe_nyu_dalan_victory_mod:0 "Triumph over rebellious right-wing lords seals royal supremacy from the Kerulen to the Yellow River bend."
 STATIC_MODIFIER_NAME_oe_nyu_noble_levies_mod:0 "Taiji Cavalry Levies"
 STATIC_MODIFIER_DESC_oe_nyu_noble_levies_mod:0 "Confirmed noble pastures guarantee swift cavalry levies whenever the Khagan sounds the war horn."
 STATIC_MODIFIER_NAME_oe_nyu_hohhot_city_mod:0 "Hohhot the Blue City Metropolis"
 STATIC_MODIFIER_DESC_oe_nyu_hohhot_city_mod:0 "Altan Khan's walled Blue City blends irrigated farms, ironworks, and caravan bazaars into a permanent steppe capital."
 STATIC_MODIFIER_NAME_oe_nyu_seasonal_court_mod:0 "Dual Nomadic & Urban Court"
 STATIC_MODIFIER_DESC_oe_nyu_seasonal_court_mod:0 "Wintering in walled trade cities while summering on open pastures balances commercial revenue with steppe agility."
 STATIC_MODIFIER_NAME_oe_nyu_horse_markets_mod:0 "Longqing Border Horse Markets"
 STATIC_MODIFIER_DESC_oe_nyu_horse_markets_mod:0 "Regulated horse-for-silk and tea markets along the frontier replace endless border raids with booming customs wealth."
 STATIC_MODIFIER_NAME_oe_nyu_caravan_arsenal_mod:0 "Caravan Customs Ordnance Works"
 STATIC_MODIFIER_DESC_oe_nyu_caravan_arsenal_mod:0 "Channeling border market tolls into armorers and gunsmiths steadily equips steppe armies with modern arms."
 STATIC_MODIFIER_NAME_oe_nyu_dalai_patronage_mod:0 "Dalai Lama Patron-Priest Bond"
 STATIC_MODIFIER_DESC_oe_nyu_dalai_patronage_mod:0 "Bestowing the Dalai Lama title and translating Buddhist scriptures weaves Mongolia and Tibet into a lasting cultural alliance."
 STATIC_MODIFIER_NAME_oe_nyu_tengri_synthesis_mod:0 "Tengri & Dharma Harmony"
 STATIC_MODIFIER_DESC_oe_nyu_tengri_synthesis_mod:0 "Honoring ancestral Tengri traditions alongside Buddhist monasteries fosters broad spiritual harmony across the steppe."
 STATIC_MODIFIER_NAME_oe_nyu_yellow_hat_mod:0 "Yellow Hat Council & Monastic Learning"
 STATIC_MODIFIER_DESC_oe_nyu_yellow_hat_mod:0 "Great monasteries beside old Karakorum serve as academies of script, medicine, and astronomy across the steppes."
 STATIC_MODIFIER_NAME_oe_nyu_ortoo_post_mod:0 "Revived Ortoo Relay Network"
 STATIC_MODIFIER_DESC_oe_nyu_ortoo_post_mod:0 "Restored horse-relay stations slash communication delays across the vast steppes and tighten imperial control."
 STATIC_MODIFIER_NAME_oe_nyu_ligdan_stand_mod:0 "Ligdan Khan's Chahar Stand"
 STATIC_MODIFIER_DESC_oe_nyu_ligdan_stand_mod:0 "Defying Jurchen Banner expansion from Chahar, the Khagan rallies loyal banners behind an unyielding frontier shield."
 STATIC_MODIFIER_NAME_oe_nyu_western_regroup_mod:0 "Qinghai Western Regrouping"
 STATIC_MODIFIER_DESC_oe_nyu_western_regroup_mod:0 "Preserving veteran cavalry westward toward Qinghai builds strategic depth and fresh highland alliances."
 STATIC_MODIFIER_NAME_oe_nyu_1640_code_mod:0 "1640 Mongol-Oirat Great Code"
 STATIC_MODIFIER_DESC_oe_nyu_1640_code_mod:0 "Forty-four Khalkha and Oirat princes ratify a unified pan-Mongol legal code outlawing internecine feuds."
 STATIC_MODIFIER_NAME_oe_nyu_clan_pact_mod:0 "Steppe Wartime Clan Pact"
 STATIC_MODIFIER_DESC_oe_nyu_clan_pact_mod:0 "Flexible wartime pledges preserve traditional clan autonomy while mobilizing swift mounted coalitions on demand."
 STATIC_MODIFIER_NAME_oe_nyu_camel_artillery_mod:0 "Camel Swivel Guns & Steppe Dragoons"
 STATIC_MODIFIER_DESC_oe_nyu_camel_artillery_mod:0 "Pairing camel-borne swivel artillery with matchlock dragoons fuses legendary steppe mobility with modern gunpowder shock."
 STATIC_MODIFIER_NAME_oe_nyu_armored_lancers_mod:0 "Armored Steppe Lancer Tumens"
 STATIC_MODIFIER_DESC_oe_nyu_armored_lancers_mod:0 "Laminar-armored shock lancers smash wavering infantry formations in thunderous steppe charges."
 STATIC_MODIFIER_NAME_oe_nyu_reclaim_mandate_mod:0 "Reclaim the Celestial Mandate"
 STATIC_MODIFIER_DESC_oe_nyu_reclaim_mandate_mod:0 "Emerging triumphant from the northern steppes, the Khagan marches south to reclaim Dadu and restore the Great Yuan Mandate."
 STATIC_MODIFIER_NAME_oe_nyu_steppe_confederacy_mod:0 "Modern Eurasian Steppe Confederacy"
 STATIC_MODIFIER_DESC_oe_nyu_steppe_confederacy_mod:0 "Uniting Karakorum, Hohhot, and transcontinental caravan lanes into a modern, prosperous, gunpowder-armed Eurasian confederacy."
 oe_nyu_dec_six_tumens.title:0 "Unite the Six Tumens (Dayan Khan Reform)"
 oe_nyu_dec_six_tumens.desc:0 "Abolish rogue warlord taishis and reorganize the realm into six disciplined Left and Right Wing Tumens under the royal banner, lifting manpower, discipline, subject loyalty, and horde cohesion for 30 years."
 oe_nyu_dec_six_tumens.a:0 "Proclaim the Six Tumens Reform"
 oe_nyu_dec_yellow_hat_council.title:0 "Convene the Yellow Hat Council"
 oe_nyu_dec_yellow_hat_council.desc:0 "Invite Gelugpa Tibetan masters to convene a grand monastic council and establish Mongolian translation academies, accelerating literacy, institution spread, and realm stability for 30 years."
 oe_nyu_dec_yellow_hat_council.a:0 "Convene the Council"
 oe_nyu_dec_horse_markets.title:0 "Open Border Horse Markets"
 oe_nyu_dec_horse_markets.desc:0 "Charter protected horse-for-silk and tea markets along the frontier passes and Hohhot caravan roads, boosting trade income, tax revenue, and diplomatic standing for 25 years."
 oe_nyu_dec_horse_markets.a:0 "Charter the Border Horse Markets"
 oe_nyu.1.title:0 "Retreat to Karakorum: Biligtu Khan Rallies the Steppe"
 oe_nyu.1.desc:0 "With Dadu fallen, the imperial seal rides north across the Gobi to the ancestral capital of Karakorum. Biligtu Khan and Koke Temur muster loyal steppe cavalry beneath the nine yak-tail banners to defend the surviving dynasty."
 oe_nyu.1.a:0 "Rally the Imperial Guard at Karakorum"
 oe_nyu.1.b:0 "Regroup Herds and Clans Along the Kerulen and Selenga"
 oe_nyu.2.title:0 "Aftermath of Buir Lake: Guarding the Imperial Seal"
 oe_nyu.2.desc:0 "A sudden southern raid shatters the eastern royal encampment at Buir Lake, emboldening rival chieftains. The court must decide whether to anchor legitimacy in the Borjigin imperial seal or disperse into elusive mobile warbands."
 oe_nyu.2.a:0 "Uphold the Borjigin Seal and Royal Chancery"
 oe_nyu.2.b:0 "Adopt Dispersed Mobile Steppe Warfare"
 oe_nyu.3.title:0 "Ascendancy of the Four Oirats"
 oe_nyu.3.desc:0 "Growing wealthy from Altai pastures and western caravan tracks, the Four Oirats challenge eastern Borjigin primacy. Unity could forge an unstoppable steppe empire; civil war invites outside intervention."
 oe_nyu.3.a:0 "Forge an Eastern-Western Steppe Compact"
 oe_nyu.3.b:0 "Subdue Rival Taishis Under Single Command"
 oe_nyu.4.title:0 "Esen Taishi's Steppe Ascendancy"
 oe_nyu.4.desc:0 "Under Esen Taishi's commanding leadership, steppe banners stretch once again from Hami to Manchuria. Massive armed horse-tribute embassies ride toward the southern frontier demanding generous silk quotas and open trade."
 oe_nyu.4.a:0 "Project Martial Hegemony Along the Frontier"
 oe_nyu.4.b:0 "Secure the Oasis Caravan Trade Westward"
 oe_nyu.5.title:0 "Victory at Tumu: Steppe Hegemony Restored"
 oe_nyu.5.desc:0 "Along the Xuanfu-Datong frontier, swift steppe encirclements cut off water supplies and shatter a massive southern imperial expedition. Captured banners, armor, and firearms announce that northern cavalry remain the terror of East Asia."
 oe_nyu.5.a:0 "Press the Prestige Triumph for Frontier Concessions"
 oe_nyu.5.b:0 "Integrate Captured Gunsmiths and Ordnance Into the Steppe"
 oe_nyu.6.title:0 "Queen Mandukhai the Wise Saves the Golden Lineage"
 oe_nyu.6.desc:0 "When warlords threaten to extinguish the Borjigin line, Queen Mandukhai spurns usurpers, proclaims seven-year-old Batu Mongke as Khagan before Genghis Khan's shrines, and rides armored into battle to reunite the fractured tumens."
 oe_nyu.6.a:0 "Ride Under Mandukhai's Banner to Reunite the Tumens"
 oe_nyu.6.b:0 "Seal Marriage Compacts With Frontier Chieftains"
 oe_nyu.7.title:0 "Dayan Khan's Six Tumens Revival"
 oe_nyu.7.desc:0 "Ascending to full rule, Dayan Khan abolishes rogue warlord taishis and reorganizes the Mongolian realm into six disciplined administrative Tumens—Left Wing and Right Wing—entrusted directly to royal Borjigin princes."
 oe_nyu.7.a:0 "Enact the Six Tumens Borjigin Constitutional Order"
 oe_nyu.7.b:0 "Grant Autonomous Frontier Charters to the Right Wing"
 oe_nyu.8.title:0 "Battle of Dalan Terigun: Pacifying the Right Wing"
 oe_nyu.8.desc:0 "Defiant Right-Wing magnates rebel against royal centralization. Dayan Khan leads Left-Wing regiments across the Ordos plain to Dalan Terigun in a decisive clash that will seal or break the Six Tumens order."
 oe_nyu.8.a:0 "Enforce Royal Supremacy Over the Right Wing"
 oe_nyu.8.b:0 "Confirm Noble Pastures in Exchange for Cavalry Levies"
 oe_nyu.9.title:0 "Altan Khan Founds Hohhot, the Blue City"
 oe_nyu.9.desc:0 "Across the fertile Tumed plain near old Fengzhou, Altan Khan invites farmers, ironsmiths, and builders to raise Koke Qota—Hohhot, the Blue City—forging a permanent walled hub of steppe agriculture, craftsmanship, and commerce."
 oe_nyu.9.a:0 "Build Hohhot's Walls, Foundries, and Irrigated Farms"
 oe_nyu.9.b:0 "Keep Hohhot a Seasonal Hub While Preserving Steppe Mobility"
 oe_nyu.10.title:0 "The Longqing Accord and Border Horse Markets"
 oe_nyu.10.desc:0 "Ending a century of exhausting frontier warfare, envoys seal a historic border peace opening regulated horse markets from Datong to Xuanfu. Steeds and pelts now exchange smoothly for silk, brick tea, ironware, and silver."
 oe_nyu.10.a:0 "Guarantee Peaceful Border Horse and Silk Markets"
 oe_nyu.10.b:0 "Channel Market Customs Into Steppe Ordnance Workshops"
 oe_nyu.11.title:0 "The Third Dalai Lama and Mongolia's Buddhist Conversion"
 oe_nyu.11.desc:0 "Meeting Gelugpa master Sonam Gyatso beside Qinghai Lake, Altan Khan bestows the title 'Dalai Lama,' renewing the classical Kublai-Phagpa Patron-Priest bond and igniting a wave of scholarship and scriptural translation across Mongolia."
 oe_nyu.11.a:0 "Embrace the Gelugpa Patron-Priest Alliance and Translations"
 oe_nyu.11.b:0 "Harmonize Ancestral Tengri Rites With Buddhist Monasteries"
 oe_nyu.12.title:0 "Erdene Zuu and Monastic Learning on the Orkhon"
 oe_nyu.12.desc:0 "Beside the ancient stones of Karakorum, the great monastery of Erdene Zuu rises as a center of literacy, medicine, and Mongolian printing—while princes also debate reviving the imperial Ortoo horse-relay stations."
 oe_nyu.12.a:0 "Patronize Monastic Scriptoria and Steppe Academies"
 oe_nyu.12.b:0 "Restore the Imperial Ortoo Relay Network"
 oe_nyu.13.title:0 "Ligdan Khan's Chahar Stand Against the Jurchens"
 oe_nyu.13.desc:0 "Expanding Jurchen Banners peel away eastern steppe tribes one by one. Chahar Khagan Ligdan Khan rallies loyal regiments beneath the Borjigin banner, preparing a fateful stand to preserve Mongolian independence."
 oe_nyu.13.a:0 "Hold Firm in Chahar Against Banner Expansion"
 oe_nyu.13.b:0 "Regroup Westward Toward Qinghai and Highland Allies"
 oe_nyu.14.title:0 "The 1640 Mongol-Oirat Great Code"
 oe_nyu.14.desc:0 "Confronted by mighty empires on every border, forty-four Khalkha and Oirat princes convene a grand Kurultai to swear the Great Code of 1640—banning internal feuds and pledging mutual defense of the steppe."
 oe_nyu.14.a:0 "Ratify the Pan-Mongol Great Code and Defense Charter"
 oe_nyu.14.b:0 "Preserve Clan Autonomy Under a Loose Wartime Pact"
 oe_nyu.15.title:0 "Gunpowder Cavalry and Camel Swivel Artillery"
 oe_nyu.15.desc:0 "To answer settled gunpowder armies, steppe commanders mount bronze swivel cannon on kneeling camels and train matchlock dragoons to dismount and pour volley fire before launching armored cavalry charges."
 oe_nyu.15.a:0 "Equip Camel Swivel Artillery and Matchlock Dragoons"
 oe_nyu.15.b:0 "Forge Armored Shock Lancer Tumens"
 oe_nyu.16.title:0 "The Steppe Revival Path: Reclaim the Mandate or Modern Confederacy"
 oe_nyu.16.desc:0 "Having outlasted three centuries of division and mastered both cities and gunpowder, the revived Northern Yuan stands at destiny's crossroads: march south to reclaim Dadu and the Celestial Mandate, or weld the steppes and caravan cities into a modern Eurasian confederacy."
 oe_nyu.16.a:0 "Reclaim the Celestial Mandate and Restore Great Yuan"
 oe_nyu.16.b:0 "Forge a Modern Eurasian Steppe Confederacy"
