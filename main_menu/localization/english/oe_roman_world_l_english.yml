l_english:
 oe_byz_roman_world: "Roman Cultural Sphere"
 oe_byz_roman_world_desc: "The cities, faiths and political traditions of Rome connect the states around Constantinople. Leadership and Roman Legitimacy follow ownership of the city. Conquest within the circle generates 66% less antagonism; outsiders invading members generate 25% more."
 OE_ROMAN_WORLD_SHARED_HERITAGE: "The Roman World"
 OE_ROMAN_WORLD_OVERVIEW: "Centered on #Y Constantinople#!, Roman towns, faith and political traditions still connect the surrounding states. Emperors, beys, despots and Latin lords fight one another while relying on the same inherited roads, trade routes and institutions.\n\nAnnexation within this circle provokes less hostility; whoever holds Constantinople commands the center of the struggle for #Y Roman legitimacy#!."
 OE_ROMAN_WORLD_NO_MEMBERS: "No members currently hold this status."
 OE_ROMAN_FILTER_ALL: "All"
 OE_ROMAN_FILTER_ALL_DESC: "Show all territorial members once, including countries with multiple statuses."
 OE_ROMAN_FILTER_BYZ: "Claims"
 OE_ROMAN_FILTER_BEYLIK: "Beyliks"
 OE_ROMAN_FILTER_PRINCE: "Despots"
 OE_ROMAN_FILTER_LATIN_DUCHY: "Latins"
 OE_ROMAN_FILTER_ORTHODOX_KINGDOM: "Orthodox"
 oe_byz_roman_world_byz: "Roman Legitimacy"
 oe_byz_roman_world_byz_desc: "Held exclusively by the owner of Constantinople, not its military occupier."
 oe_byz_roman_world_beylik: "Turkish Beyliks"
 oe_byz_roman_world_beylik_desc: "Members whose primary culture is Turkish or Turkoman."
 oe_byz_roman_world_prince: "Despots"
 oe_byz_roman_world_prince_desc: "Members with a primary culture in the Greek culture group, whether independent or subject."
 oe_byz_roman_world_latin_duchy: "Latin Principalities"
 oe_byz_roman_world_latin_duchy_desc: "Members with a French, Iberian or Italian group primary culture and a capital in the Balkans or Anatolia."
 oe_byz_roman_world_orthodox_kingdom: "Eastern Christianity"
 oe_byz_roman_world_orthodox_kingdom_desc: "All Orthodox or Miaphysite members, regardless of country rank."
 OE_ROMAN_CONTEST_TAB: "Contest of Warlords"
 OE_ROMAN_CONTEST_LEADERS: "Contenders for the Empire"
 OE_ROMAN_CONTEST_RANK_1: "#bold #color_yellow First#!#!"
