 OE_ROMAN_CONTEST_QUOTE: "#bold #color_yellow Qin lost its stag; all beneath heaven pursued it.#!#!"
 OE_ROMAN_CONTEST_QUOTE_SOURCE: "#bold #color_yellow — Records of the Grand Historian#!#!"
 OE_ROMAN_CONTEST_ACTIONS: "The Imperial Contest"
 OE_ROMAN_CONTEST_RULES: "#bold Strength#! = #color_yellow Military strength + Country tax base#!. All territorial members, including subjects, compete. Rankings update each game day and upon territorial changes. Ties follow member order. Rank does not grant Roman legitimacy or organization leadership."
 OE_ROMAN_CONTEST_SCORE_BREAKDOWN: "#bold Strength#!\nMilitary: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('oe_roman_world_contest_military')|1]\nTax base: [GuiScope.SetRoot(Country.MakeScope).ScriptValue('oe_roman_world_contest_tax')|1]\n\n$OE_ROMAN_CONTEST_RULES$"
