 oe_sr_ct_next1: "rung 1, All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#! of its 2 regions restored, #Y 2#! needed (Philippopolis–Rhodope and Anchialos)"
 oe_sr_ct_next2: "rung 2, Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#! of its 3 regions restored, #Y 3#! needed (Nikopolis, Hellas–Thebes and Peloponnese)"
 oe_sr_ct_next3: "rung 3, The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#! of its 3 regions restored, #Y 3#! needed, Lower Danube–Paristrion among them (Lower Danube–Paristrion, Serdica and Skopje–Ohrid)"
 oe_sr_ct_next4: "rung 4, The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#! of its 4 regions restored, #Y 3#! needed (Dyrrhachion–Aulon, Dalmatia, Sirmium–Sava and Belgrade–Morava)"
 oe_sr_ct_next5: "rung 5, The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#! of its 5 regions restored, #Y 4#! needed (Opsikion, Optimatoi–Malagina, Neokastra, Thrakesion and Mylasa–Melanoudion)"
 oe_sr_ct_next6: "rung 6, The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#! of its 6 regions restored, #Y 4#! needed (Paphlagonia, Anatolikon–Phrygia, Boukellarion, Ikonion–Lykaonia, Cappadocia–Charsianon and Armeniakon)"
 oe_sr_ct_next7: "rung 7, The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#! of its 4 regions restored, #Y 3#! needed, Sebasteia–Tephrike and Melitene–Germanikeia among them (Sebasteia–Tephrike, Melitene–Germanikeia, Chaldia–Pontic Coast and Cilicia)"
 oe_sr_ct_next8: "rung 8, The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#! of its 4 regions restored, #Y 3#! needed (Kephallenia–Ionian Isles, Aegean Islands, Crete and Cyprus)"
 oe_sr_ct_next_all: "all eight rungs of the old frontiers are restored"
 oe_sr.1.t: "The Counsel of Restoration"
 oe_sr.1.desc_l: "#F In 1333 Andronikos III took back the north and east of Thessaly; in 1340 Epirus too returned to the empire.#!\n\nThe empire and its subjects now hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! of the historical regions, and the City is the empire's. The court debates where to put its strength next. The work of restoration has eight rungs of old frontiers, and each brings its celebration and rewards when its regions are back in the empire's hands:\n1  All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2, #Y 2#! needed\n2  Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3, #Y 3#! needed\n3  The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3, #Y 3#! needed\n4  The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4, #Y 3#! needed\n5  The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5, #Y 4#! needed\n6  The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6, #Y 4#! needed\n7  The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4, #Y 3#! needed\n8  The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4, #Y 3#! needed"
 oe_sr.1.desc_x: "#F In 1333, after the death of the lord of Thessaly, Andronikos III took back the north and east of Thessaly and sent a governor to rule it.#!\n\nThe empire and its subjects now hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! of the historical regions, and the City is the empire's. The court debates where to put its strength next. The work of restoration has eight rungs of old frontiers, and each brings its celebration and rewards when its regions are back in the empire's hands:\n1  All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2, #Y 2#! needed\n2  Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3, #Y 3#! needed\n3  The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3, #Y 3#! needed\n4  The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4, #Y 3#! needed\n5  The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5, #Y 4#! needed\n6  The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6, #Y 4#! needed\n7  The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4, #Y 3#! needed\n8  The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4, #Y 3#! needed"
 oe_sr.1.a: "West: the Balkans and the Danube"
 oe_sr.1.a.tt: "The emphasis is set: west. When rungs 1, 2, 3, 4 are restored, the reward is one step higher\nThe eight rungs are open from now on and checked every January"
 oe_sr.1.b: "East: Asia Minor and the Euphrates"
 oe_sr.1.b.tt: "The emphasis is set: east. When rungs 5, 6, 7 are restored, the reward is one step higher\nThe eight rungs are open from now on and checked every January"
 oe_sr.1.c: "The sea: the isles and the straits"
 oe_sr.1.c.tt: "The emphasis is set: the sea. When rungs 8, 2 are restored, the reward is one step higher\nThe eight rungs are open from now on and checked every January"
 oe_sr.1.d: "Set no emphasis"
 oe_sr.1.d.tt: "[Concept('oe_tu_authority','Imperial Authority')|e] #G +2#!\nThe eight rungs are open from now on and checked every January"
 oe_sr.2.t: "An Old Frontier Restored"
 oe_sr.2.desc_1: "#F In 1333, after the death of the lord of Thessaly, Andronikos III took back the north and east of Thessaly and sent a governor to rule it.#!\n\nThe old frontier of All Thrace has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#! of its 2 historical regions (Philippopolis–Rhodope and Anchialos) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_2l: "#F In 1349 John VI gave the Morea to Manuel, a son of the emperor, to govern, and the empire again had a prince of its house in the south of Greece.#!\n\nThe old frontier of Greece has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#! of its 3 historical regions (Nikopolis, Hellas–Thebes and Peloponnese) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_2: "The old frontier of Greece has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#! of its 3 historical regions (Nikopolis, Hellas–Thebes and Peloponnese) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_3: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe old frontier of the Danube Line has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#! of its 3 historical regions (Lower Danube–Paristrion, Serdica and Skopje–Ohrid) are restored. The Danube line stands again. The emperor must decide how to mark it."
 oe_sr.2.desc_4: "The old frontier of the North-West March has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#! of its 4 historical regions (Dyrrhachion–Aulon, Dalmatia, Sirmium–Sava and Belgrade–Morava) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_5: "The old frontier of the Gates of Asia has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#! of its 5 historical regions (Opsikion, Optimatoi–Malagina, Neokastra, Thrakesion and Mylasa–Melanoudion) are restored. It is said that the Komnenoi took back the western coast of Asia Minor from here. The emperor must decide how to mark it."
 oe_sr.2.desc_6: "The old frontier of the Plateau Themes has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#! of its 6 historical regions (Paphlagonia, Anatolikon–Phrygia, Boukellarion, Ikonion–Lykaonia, Cappadocia–Charsianon and Armeniakon) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_7: "The old frontier of the Euphrates Line has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#! of its 4 historical regions (Sebasteia–Tephrike, Melitene–Germanikeia, Chaldia–Pontic Coast and Cilicia) are restored. It is said that in the tenth century the empire's eastern frontier reached the Euphrates; now the Euphrates line stands again. The emperor must decide how to mark it."
 oe_sr.2.desc_8: "The old frontier of the Sea and the Isles has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#! of its 4 historical regions (Kephallenia–Ionian Isles, Aegean Islands, Crete and Cyprus) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_x: "The empire has taken back another old frontier. The emperor must decide how to mark it."
 oe_sr.2.a: "Proclaim the old frontier"
 oe_sr.2.a.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_core_n')|0]#! places of these regions that the empire itself owns and that are not yet its cores become its cores (no land in other hands)\nPrestige #G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_pres')|0]#! (within the chosen emphasis: one step higher)"
 oe_sr.2.b: "Reward the legions"
 oe_sr.2.b.tt: "[Concept('oe_tu_authority','Imperial Authority')|e] #G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_auth')|0]#! (within the chosen emphasis: one step higher)\nThe empire gains [ShowModifier('oe_sr_legions')] for #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_legion_y')|0]#! years"
 oe_sr.2.c: "Settle the people and hold the frontier"
 oe_sr.2.c.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_n')|0]#! places of these regions that the empire owns gain [ShowModifier('oe_sr_old_land')] for #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_y')|0]#! years"
 oe_sr.3.t: "The Restoration"
 oe_sr.3.desc_x: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe empire and its subjects hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! historical regions, and the Ottomans are no longer stronger than the empire, or are gone. People have begun to say that the empire is restored."
 oe_sr.3.a: "Hold a triumph"
 oe_sr.3.a.tt: "Prestige #G +10#!\nStability #G +7#!"
 oe_sr.3.b: "Honour the emperors before: restore their tombs and churches"
 oe_sr.3.b.tt: "Legitimacy #G +10#!\nClergy satisfaction #G +5%#!"
 oe_sr.3.c: "Make no show of it"
 oe_sr.3.c.tt: "[Concept('oe_tu_authority','Imperial Authority')|e] #G +4#!"
