 oe_sr_b_primacy: "The emperor recognised the primacy of the pope"
 oe_sr_b_primacy_cath: "The Roman emperor recognised the primacy of the pope"
 oe_sr_b_rival_see: "The emperor set up an Orthodox bishop in Rome"
 oe_sr_b_rival_see_cath: "The Roman emperor set up an Orthodox bishop in Rome"
 oe_sr_b_persia_peace: "Made peace and trade with us after the campaign"
 oe_sr_b_genoa: "Let the Genoese back into the Black Sea"
 oe_sr_ct_t0: "Historical"
 oe_sr_ct_t1f: "Foothold (the restoration faltered)"
 oe_sr_ct_t1: "Foothold"
 oe_sr_ct_t2r: "Restoration (renewed)"
