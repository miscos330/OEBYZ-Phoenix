 oe_sr_ct_next1: "rung 1, All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#! of its 2 regions restored, #Y 2#! needed (Philippopolis–Rhodope and Anchialos)"
 oe_sr_ct_next2: "rung 2, Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#! of its 3 regions restored, #Y 3#! needed (Nikopolis, Hellas–Thebes and Peloponnese)"
 oe_sr_ct_next3: "rung 3, The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#! of its 3 regions restored, #Y 3#! needed, Lower Danube–Paristrion among them (Lower Danube–Paristrion, Serdica and Skopje–Ohrid)"
 oe_sr_ct_next4: "rung 4, The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#! of its 4 regions restored, #Y 3#! needed (Dyrrhachion–Aulon, Dalmatia, Sirmium–Sava and Belgrade–Morava)"
 oe_sr_ct_next5: "rung 5, The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#! of its 5 regions restored, #Y 4#! needed (Opsikion, Optimatoi–Malagina, Neokastra, Thrakesion and Mylasa–Melanoudion)"
 oe_sr_ct_next6: "rung 6, The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#! of its 6 regions restored, #Y 4#! needed (Paphlagonia, Anatolikon–Phrygia, Boukellarion, Ikonion–Lykaonia, Cappadocia–Charsianon and Armeniakon)"
 oe_sr_ct_next7: "rung 7, The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#! of its 4 regions restored, #Y 3#! needed, Sebasteia–Tephrike and Melitene–Germanikeia among them (Sebasteia–Tephrike, Melitene–Germanikeia, Chaldia–Pontic Coast and Cilicia)"
 oe_sr_ct_next8: "rung 8, The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#! of its 4 regions restored, #Y 3#! needed (Kephallenia–Ionian Isles, Aegean Islands, Crete and Cyprus)"
 oe_sr_ct_next_all: "all eight rungs of the old frontiers are restored"
 oe_sr_ct_emph1: "west: the Balkans and the Danube"
 oe_sr_ct_emph2: "east: Asia Minor and the Euphrates"
 oe_sr_ct_emph3: "the sea: the isles and the straits"
 oe_sr_ct_emph0: "no emphasis"
 oe_sr_ct_emph_none: "not settled yet"
 oe_sr_ct_fs_none: "(no region can be opened)"
 oe_sr_ct_goal_egypt: "the goal of the campaign in Egypt, Alexandria and the grain ships: hold Alexandria: only then can the patriarch of the City name a patriarch of Alexandria, and the grain ships run twice as long"
 oe_sr_ct_goal_italy: "the goal of the campaign in Italy, the Bishop of Rome: hold Rome: only then can an Orthodox bishop be set up there"
 oe_sr_ct_goal_persia: "the goal of the campaign in Persia, the road to Tabriz: hold Tabriz: the reopened silk road brings twice as much"
 oe_sr_ct_goal_blacksea: "the goal of the campaign in the Black Sea, the Genoese factories: hold Caffa: the factories bring more, and so do the customs"
 oe_sr_ct_goal_none: "none"
 oe_sr_ct_eg_n: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_eg_n')|0]#! places of the empire in Egypt"
 oe_sr_ct_eg_none: "The empire's places in Egypt (none at present)"
 oe_sr.1.t: "The Counsel of Restoration"
 oe_sr.1.desc_l: "#F In 1333 Andronikos III took back the north and east of Thessaly; in 1340 Epirus too returned to the empire.#!\n\nThe empire and its subjects now hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! of the historical regions, and the City is the empire's. The court debates where to put its strength next. The work of restoration has eight rungs of old frontiers, and each brings its celebration and rewards when its regions are back in the empire's hands:\n1  All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2, #Y 2#! needed\n2  Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3, #Y 3#! needed\n3  The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3, #Y 3#! needed\n4  The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4, #Y 3#! needed\n5  The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5, #Y 4#! needed\n6  The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6, #Y 4#! needed\n7  The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4, #Y 3#! needed\n8  The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4, #Y 3#! needed"
 oe_sr.1.desc_x: "#F In 1333, after the death of the lord of Thessaly, Andronikos III took back the north and east of Thessaly and sent a governor to rule it.#!\n\nThe empire and its subjects now hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! of the historical regions, and the City is the empire's. The court debates where to put its strength next. The work of restoration has eight rungs of old frontiers, and each brings its celebration and rewards when its regions are back in the empire's hands:\n1  All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2, #Y 2#! needed\n2  Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3, #Y 3#! needed\n3  The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3, #Y 3#! needed\n4  The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4, #Y 3#! needed\n5  The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5, #Y 4#! needed\n6  The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6, #Y 4#! needed\n7  The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4, #Y 3#! needed\n8  The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4, #Y 3#! needed"
 oe_sr.1.a: "West: the Balkans and the Danube"
 oe_sr.1.a.tt: "The emphasis is set: west. When rungs 1, 2, 3, 4 are restored, the reward is one step higher\nThe eight rungs are open from now on and checked every January"
 oe_sr.1.b: "East: Asia Minor and the Euphrates"
 oe_sr.1.b.tt: "The emphasis is set: east. When rungs 5, 6, 7 are restored, the reward is one step higher\nThe eight rungs are open from now on and checked every January"
 oe_sr.1.c: "The sea: the isles and the straits"
 oe_sr.1.c.tt: "The emphasis is set: the sea. When rungs 8, 2 are restored, the reward is one step higher\nThe eight rungs are open from now on and checked every January"
 oe_sr.1.d: "Set no emphasis"
 oe_sr.1.d.tt: "[Concept('oe_tu_authority','Imperial Authority')|e] #G +2#!\nThe eight rungs are open from now on and checked every January"
 oe_sr.2.t: "An Old Frontier Restored"
 oe_sr.2.desc_1: "#F In 1333, after the death of the lord of Thessaly, Andronikos III took back the north and east of Thessaly and sent a governor to rule it.#!\n\nThe old frontier of All Thrace has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#! of its 2 historical regions (Philippopolis–Rhodope and Anchialos) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_2l: "#F In 1349 John VI gave the Morea to Manuel, a son of the emperor, to govern, and the empire again had a prince of its house in the south of Greece.#!\n\nThe old frontier of Greece has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#! of its 3 historical regions (Nikopolis, Hellas–Thebes and Peloponnese) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_2: "The old frontier of Greece has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#! of its 3 historical regions (Nikopolis, Hellas–Thebes and Peloponnese) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_3: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe old frontier of the Danube Line has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#! of its 3 historical regions (Lower Danube–Paristrion, Serdica and Skopje–Ohrid) are restored. The Danube line stands again. The emperor must decide how to mark it."
 oe_sr.2.desc_4: "The old frontier of the North-West March has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#! of its 4 historical regions (Dyrrhachion–Aulon, Dalmatia, Sirmium–Sava and Belgrade–Morava) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_5: "The old frontier of the Gates of Asia has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#! of its 5 historical regions (Opsikion, Optimatoi–Malagina, Neokastra, Thrakesion and Mylasa–Melanoudion) are restored. It is said that the Komnenoi took back the western coast of Asia Minor from here. The emperor must decide how to mark it."
 oe_sr.2.desc_6: "The old frontier of the Plateau Themes has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#! of its 6 historical regions (Paphlagonia, Anatolikon–Phrygia, Boukellarion, Ikonion–Lykaonia, Cappadocia–Charsianon and Armeniakon) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_7: "The old frontier of the Euphrates Line has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#! of its 4 historical regions (Sebasteia–Tephrike, Melitene–Germanikeia, Chaldia–Pontic Coast and Cilicia) are restored. It is said that in the tenth century the empire's eastern frontier reached the Euphrates; now the Euphrates line stands again. The emperor must decide how to mark it."
 oe_sr.2.desc_8: "The old frontier of the Sea and the Isles has returned to the empire: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#! of its 4 historical regions (Kephallenia–Ionian Isles, Aegean Islands, Crete and Cyprus) are restored. The emperor must decide how to mark it."
 oe_sr.2.desc_x: "The empire has taken back another old frontier. The emperor must decide how to mark it."
 oe_sr.2.a: "Proclaim the old frontier"
 oe_sr.2.a.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_core_n')|0]#! places of these regions that the empire itself owns and that are not yet its cores become its cores (no land in other hands)\nPrestige #G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_pres')|0]#! (within the chosen emphasis: one step higher)"
 oe_sr.2.b: "Reward the legions"
 oe_sr.2.b.tt: "[Concept('oe_tu_authority','Imperial Authority')|e] #G +[GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_auth')|0]#! (within the chosen emphasis: one step higher)\nThe empire gains [ShowModifier('oe_sr_legions')] for #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_legion_y')|0]#! years"
 oe_sr.2.c: "Settle the people and hold the frontier"
 oe_sr.2.c.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_n')|0]#! places of these regions that the empire owns gain [ShowModifier('oe_sr_old_land')] for #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_y')|0]#! years"
 oe_sr.2.d: "Settle the people: a frontier programme"
 oe_sr.2.d.tt: "A #bold #color_yellow frontier programme#!#! is opened free of charge in #Y [GetCountry('BYZ').Custom('OeSrFsReg')]#! (no Authority, no gold; the region of this rung with the most empty land of the empire where one can be opened)\nIf this rung lies in the chosen emphasis, one step higher: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_n')|0]#! places of these regions that the empire owns also gain [ShowModifier('oe_sr_old_land')] for #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rw_land_y')|0]#! years\nShould it not open after all (all programmes taken, for instance), the places of these regions that the empire owns gain [ShowModifier('oe_sr_old_land')] instead"
 oe_sr.3.t: "The Restoration"
 oe_sr.3.desc_x: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe empire and its subjects hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! historical regions, and the Ottomans are no longer stronger than the empire, or are gone. People have begun to say that the empire is restored. The stories written for a weak empire (the blockade of the City, the sultan's vassal, the loss of the towns of Thrace, the last siege) will not come while the empire stays restored; and Thessalonica, even if besieged, will no longer give in without a fight."
 oe_sr.3.a: "Hold a triumph"
 oe_sr.3.a.tt: "Prestige #G +10#!\nStability #G +7#!"
 oe_sr.3.b: "Honour the emperors before: restore their tombs and churches"
 oe_sr.3.b.tt: "Legitimacy #G +10#!\nClergy satisfaction #G +5%#!"
 oe_sr.3.c: "Make no show of it"
 oe_sr.3.c.tt: "[Concept('oe_tu_authority','Imperial Authority')|e] #G +4#!"
 oe_sr.4.t: "The Emphasis Weighed Again"
 oe_sr.4.desc_x: "The emphasis set at the counsel of restoration is #Y [GetCountry('BYZ').Custom('OeSrEmph')]#!. Now some at court ask for it to be weighed again: which rungs of the old frontiers come first? It can be changed once, and then it stays.\n1  All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2, #Y 2#! needed\n2  Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3, #Y 3#! needed\n3  The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3, #Y 3#! needed\n4  The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4, #Y 3#! needed\n5  The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5, #Y 4#! needed\n6  The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6, #Y 4#! needed\n7  The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4, #Y 3#! needed\n8  The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4, #Y 3#! needed"
 oe_sr.4.a: "West: the Balkans and the Danube"
 oe_sr.4.a.tt: "The emphasis is set: west. When rungs 1, 2, 3, 4 are restored, the reward is one step higher\n[Concept('oe_tu_authority','Imperial Authority')|e] #R −5#!; the emphasis can be changed this once only"
 oe_sr.4.b: "East: Asia Minor and the Euphrates"
 oe_sr.4.b.tt: "The emphasis is set: east. When rungs 5, 6, 7 are restored, the reward is one step higher\n[Concept('oe_tu_authority','Imperial Authority')|e] #R −5#!; the emphasis can be changed this once only"
 oe_sr.4.c: "The sea: the isles and the straits"
 oe_sr.4.c.tt: "The emphasis is set: the sea. When rungs 8, 2 are restored, the reward is one step higher\n[Concept('oe_tu_authority','Imperial Authority')|e] #R −5#!; the emphasis can be changed this once only"
 oe_sr.4.d: "Set no emphasis"
 oe_sr.4.d.tt: "No emphasis: every rung brings the ordinary reward from now on\n[Concept('oe_tu_authority','Imperial Authority')|e] #R −5#!; the emphasis can be changed this once only"
 oe_sr.4.e: "Keep It as It Is"
 oe_sr.4.e.tt: "The emphasis stays and no Authority is spent; it may still be weighed again later"
 oe_sr.5.t: "Hold or Yield"
 oe_sr.5.desc_a: "The Ottomans have closed the ring around Thessaloniki and the city's will to hold out is spent; the notables are ready to make terms as of old. The commander asks for the order: the empire is restored, and at a word from the emperor the whole city will fight once more. The chance to hold is #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_ths_chance')|0]%#! (base #Y 50%#!; #G +15%#! when the empire's army is at least the Ottomans'; #G +10%#! when the emphasis of the restoration is the west or the sea; at least #Y 30%#!, at most #Y 75%#!)."
 oe_sr.5.desc_d: "The Ottomans have blockaded Thessaloniki once more and hold the land all around it; the city's will to hold out is spent and the garrison is ready to open the gates. The commander asks for the order: the empire is restored, and at a word from the emperor the whole city will fight once more. The chance to hold is #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_ths_chance')|0]%#! (base #Y 50%#!; #G +15%#! when the empire's army is at least the Ottomans'; #G +10%#! when the emphasis of the restoration is the west or the sea; at least #Y 30%#!, at most #Y 75%#!)."
 oe_sr.5.a: "Order the City to Hold"
 oe_sr.5.a.tt: "Chance to hold: #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_ths_chance')|0]%#!\nHeld: the siege is lifted and Thessaloniki stays with the empire; prestige #G +10#! (in the siege of the prince's court, the Theme of Thessalonica's loyalty #G +5#! as well)\nLost: the city opens its gates as of old: while the Ottomans still encircle it, Thessaloniki goes to them; if the ring has loosened, the city stays with the empire and pays the sultan every year; stability #R −7#!"
 oe_sr.5.b: "Let the City Make Terms"
 oe_sr.5.b.tt: "The city opens its gates as of old: while the Ottomans still encircle it, Thessaloniki goes to them; if the ring has loosened, the city stays with the empire and pays the sultan every year\nIn the siege of the prince's court: prestige #R −10#!"
 oe_sr.6.t: "The Fate of Thessaloniki"
 oe_sr.6.desc_held: "The city held: the Ottomans have lifted the siege, and Thessaloniki is still the empire's."
 oe_sr.6.desc_lost: "The city did not hold: the garrison opened the gates, and Thessaloniki belongs to the Ottomans."
 oe_sr.6.desc_lostharac: "The city did not hold, but the Ottoman ring had loosened: the city stays with the empire and pays the sultan every year."
 oe_sr.6.desc_gave: "The city made terms and opened its gates; Thessaloniki belongs to the Ottomans."
 oe_sr.6.desc_harac: "The city has agreed terms with the Ottomans: it stays with the empire and pays the sultan every year."
 oe_sr.6.a: "So Be It"
 oe_sr.6.a.tt: "News only; the result has already taken effect"
 oe_sr.21.t: "Alexandria and the Grain Ships"
 oe_sr.21.desc_held: "#F In 645 Constans II sent Manuel with a fleet to retake Egypt; the next year the venture failed, and Manuel fell.#!\n\nThe campaign in Egypt is over, and Alexandria is in the hands of the empire and its subjects. The patriarch of the City proposes that the patriarch of Alexandria be named from the City. The elders of the Copts ask the emperor to recognise their own church; the grain officials care only whether the Nile's grain ships will sail north every year."
 oe_sr.21.desc_x: "#F In 645 Constans II sent Manuel with a fleet to retake Egypt; the next year the venture failed, and Manuel fell.#!\n\nThe campaign in Egypt is over, but Alexandria is still not in the hands of the empire and its subjects, so there is no throne of a patriarch to fill. The elders of the Copts ask the emperor to recognise their own church; the grain officials care only whether the Nile's grain ships will sail north every year."
 oe_sr.21.a: "Let the Patriarch of the City Name a Patriarch of Alexandria"
 oe_sr.21.a.tt: "Prestige #G +10#!; clergy satisfaction #G +5%#!\nThe empire gains [ShowModifier('oe_sr_eg_see')] for #Y 20#! years\n[GetCountry('BYZ').Custom('OeSrEgN')] gain [ShowModifier('oe_sr_eg_unrest')] for #Y 10#! years (the Copts there do not accept this patriarch)\nOnly while Alexandria is held by the empire and its subjects and the Ecumenical Patriarchate is still the empire's, in the City"
 oe_sr.21.b: "Recognise the Coptic Church"
 oe_sr.21.b.tt: "Stability #G +7#!; clergy satisfaction #R −5%#!\n[GetCountry('BYZ').Custom('OeSrEgN')] gain [ShowModifier('oe_sr_eg_peace')] for #Y 10#! years\nIf Orthodoxy was imposed during the campaign, [ShowModifier('oe_hc_coptic_conversion')] is removed from these places"
 oe_sr.21.c: "The Tribute of the Nile"
 oe_sr.21.c.tt: "The empire gains [ShowModifier('oe_hc_grain_ships')]: for #Y 20#! years while Alexandria is held by the empire and its subjects, else #Y 10#! years (one already running starts again from now)"
 oe_sr.23.t: "The Bishop of Rome"
 oe_sr.23.desc_union: "#F From 537 to 752 a bishop of Rome needed the emperor's approval before consecration.#!\n\nThe campaign in Italy is over. The union of the empire with Rome has been signed, and the pope's envoys say that, the union being made, the emperor ought to recognise the successor of the apostle Peter as the first."
 oe_sr.23.desc_avignon: "#F From 537 to 752 a bishop of Rome needed the emperor's approval before consecration.#!\n\nRome is in the hands of the empire and its subjects, yet the pope still lives at Avignon. The clergy of Rome are split: some ask the emperor to recognise the pope's primacy and bring the pope back to the city; others say that a city of the Roman emperor should have an Orthodox bishop."
 oe_sr.23.desc_held: "#F From 537 to 752 a bishop of Rome needed the emperor's approval before consecration.#!\n\nRome is in the hands of the empire and its subjects. The pope's envoys ask the emperor to recognise the pope's primacy; the Greeks of the city and the bishops of the capital say that a city of the Roman emperor should have an Orthodox bishop."
 oe_sr.23.desc_x: "#F From 537 to 752 a bishop of Rome needed the emperor's approval before consecration.#!\n\nThe campaign in Italy is over, but Rome is not in the hands of the empire and its subjects. The pope's envoys come all the same to ask whether the empire recognises the pope's primacy."
 oe_sr.23.a: "Recognise the Primacy of the Pope"
 oe_sr.23.a.tt: "The pope's opinion of the empire #G +30#! (#Y 20#! years); every Catholic country #G +10#! (#Y 10#! years)\nClergy satisfaction #R −5%#! (the Orthodox clergy are displeased)"
 oe_sr.23.b: "Set Up an Orthodox Bishop in Rome"
 oe_sr.23.b.tt: "Prestige #G +25#!; clergy satisfaction #G +5%#!\nThe pope's opinion of the empire #R −40#! (#Y 20#! years); every Catholic country #R −15#! (#Y 10#! years)\nOnly while Rome is held by the empire and its subjects"
 oe_sr.23.c: "Leave the Question Open"
 oe_sr.23.c.tt: "Nothing changes; that the emperor did not answer is recorded"
 oe_sr.27.t: "The Road to Tabriz"
 oe_sr.27.desc_heldsz: "#F In 627 Heraclius defeated the Persian army near Nineveh; Kavad soon sued for peace, and the empire regained all the lands it had lost.#!\n\nThe campaign in Persia is over, and Tabriz is in the hands of the empire and its subjects: the silk road to the east starts here. Shiraz too has fallen to the Muzaffarids, and Fars is theirs; the kings of Persia who remain send to ask whether the empire wants the trade road or peace."
 oe_sr.27.desc_held: "#F In 627 Heraclius defeated the Persian army near Nineveh; Kavad soon sued for peace, and the empire regained all the lands it had lost.#!\n\nThe campaign in Persia is over, and Tabriz is in the hands of the empire and its subjects: the silk road to the east starts here. The kings of Persia who remain send to ask whether the empire wants the trade road or peace."
 oe_sr.27.desc_xsz: "#F In 627 Heraclius defeated the Persian army near Nineveh; Kavad soon sued for peace, and the empire regained all the lands it had lost.#!\n\nThe campaign in Persia is over, but Tabriz is still not in the hands of the empire and its subjects. Shiraz too has fallen to the Muzaffarids, and Fars is theirs; the kings of Persia who remain send to ask whether the empire wants the trade road or peace."
 oe_sr.27.desc_x: "#F In 627 Heraclius defeated the Persian army near Nineveh; Kavad soon sued for peace, and the empire regained all the lands it had lost.#!\n\nThe campaign in Persia is over, but Tabriz is still not in the hands of the empire and its subjects. The kings of Persia who remain send to ask whether the empire wants the trade road or peace."
 oe_sr.27.a: "Reopen the Silk Road"
 oe_sr.27.a.tt: "The empire gains [ShowModifier('oe_sr_silk_road')] for #Y 20#! years; while Tabriz is held by the empire and its subjects, the doubled [ShowModifier('oe_sr_silk_road_2')] instead"
 oe_sr.27.b: "Make Peace and Trade with the Kings of Persia"
 oe_sr.27.b.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_pe_n')|0]#! countries outside the empire's side with their capital in Persia and Mesopotamia: opinion of the empire #G +25#! (#Y 10#! years)\nThe empire gains [ShowModifier('oe_sr_persia_peace')] for #Y 10#! years"
 oe_sr.28.t: "The Genoese Factories"
 oe_sr.28.desc_held: "#F The Treaty of Nymphaeum in 1261 gave the Genoese customs privileges throughout the empire.#!\n\nThe campaign on the Black Sea is over, and Caffa is in the hands of the empire and its subjects: the Genoese factories, warehouses and counting-houses wait for a new master."
 oe_sr.28.desc_gen: "#F The Treaty of Nymphaeum in 1261 gave the Genoese customs privileges throughout the empire.#!\n\nThe campaign on the Black Sea is over. Caffa is still Genoese, but the empire and its subjects now have the say over the steppe road."
 oe_sr.28.desc_x: "#F The Treaty of Nymphaeum in 1261 gave the Genoese customs privileges throughout the empire.#!\n\nThe campaign on the Black Sea is over. Caffa is held neither by the empire's side nor by the Genoese, but the empire and its subjects now have the say over the steppe road."
 oe_sr.28.a: "Give the Trade to the Roman Company"
 oe_sr.28.a.tt: "The Company's fund grows by #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_bs_amt')|0]#! gold and its autonomy by #Y +3#! (a charter of the City's merchants or of a foreign partner); a crown monopoly pays the #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_bs_amt')|0]#! gold straight into the treasury\nThe sum: #Y 4#! months of income, #Y 6#! while Caffa is held by the empire and its subjects"
 oe_sr.28.b: "Let the Genoese Back into the Black Sea"
 oe_sr.28.b.tt: "Genoa's trading privileges go up one tier (the empire collects less in customs: see the Italian privileges)\nGenoa's opinion of the empire #G +30#! (#Y 10#! years)"
 oe_sr.28.c: "Appoint a Kommerkiarios for the Black Sea"
 oe_sr.28.c.tt: "The empire gains [ShowModifier('oe_sr_bs_customs')] for #Y 20#! years; while Caffa is held by the empire and its subjects, the doubled [ShowModifier('oe_sr_bs_customs_2')] instead"
 oe_sr_change_emph: "The Work of Restoration"
 oe_sr_change_emph_card: "The eight rungs of the old frontiers (hover for them); the emphasis can be changed once."
 oe_sr_change_emph_desc: "The work of restoration: #Y [GetCountry('BYZ').Custom('OeSrTier')]#!, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! historical regions restored (stage 1 at #Y 8#!, stage 2 at #Y 15#!); emphasis: #Y [GetCountry('BYZ').Custom('OeSrEmph')]#!.\n1  All Thrace: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc1')|0]#!/2, #Y 2#! needed\n2  Greece: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc2')|0]#!/3, #Y 3#! needed\n3  The Danube Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc3')|0]#!/3, #Y 3#! needed\n4  The North-West March: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc4')|0]#!/4, #Y 3#! needed\n5  The Gates of Asia: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc5')|0]#!/5, #Y 4#! needed\n6  The Plateau Themes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc6')|0]#!/6, #Y 4#! needed\n7  The Euphrates Line: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc7')|0]#!/4, #Y 3#! needed\n8  The Sea and the Isles: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_rc8')|0]#!/4, #Y 3#! needed\nNext: [GetCountry('BYZ').Custom('OeSrNext')].\nClick to change the emphasis once: it costs #R 5#! [Concept('oe_tu_authority','Imperial Authority')|e] (only when a new emphasis is chosen); the rungs inside the emphasis bring a reward one step higher."
 oe_sr_change_emph_tt: "The court weighs the emphasis of the restoration again (the event 'The Emphasis Weighed Again'; Authority is spent only if a new emphasis is chosen)"
 oe_sr_allow_emph: "The counsel of restoration has been answered"
 oe_sr_allow_once: "The emphasis has not been changed before"
 oe_sr_allow_open: "No weighing of the emphasis is under way"
 oe_sr_allow_auth: "At least 5 Imperial Authority"
