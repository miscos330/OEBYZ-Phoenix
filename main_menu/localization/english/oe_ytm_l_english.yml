 oe_ytm.1.t: "News of the Lame Conqueror from Samarkand"
 oe_ytm.1.desc_x: "#F In the 1370s, Amir Timur of the Barlas rose to mastery over Samarkand and Bukhara. Barred by steppe custom from claiming the title of Khan directly, Timur ruled behind puppet Chagatai khans as Güregen, the Imperial Son-in-Law.#!\n\nCaravans arriving from Samarkand warn that the Lame Conqueror is forging a formidable war machine across Transoxiana. Should Dadu immediately fortify the Hexi and Hami approaches, or dispatch merchant scouts westward first?"
 oe_ytm.1.a: "Dispatch Scouts and Merchants to Samarkand"
 oe_ytm.1.a.tt: "Gain [ShowModifier('oe_ytm_caravan_intel')] (#Y 96#! months: higher land trade and diplomatic reputation, slight control cost); western readiness set to #Y 1#!."
 oe_ytm.1.b: "Reinforce the Hexi & Hami Frontier Garrisons"
 oe_ytm.1.b.tt: "Gain [ShowModifier('oe_ytm_hexi_watch')] (#Y 96#! months: higher defensiveness and land morale, #R +15%#! light-cavalry upkeep); western readiness set to #Y 2#!."
 oe_ytm.2.t: "Envoys of Timur at Dadu: Güregen vs Great Khan"
 oe_ytm.2.desc_han: "#F Claiming authority as Son-in-Law of the House of Genghis, Timur faced an acute paradox before a surviving Great Yuan: with Kublai's direct heirs still enthroned at Dadu, the conqueror tested imperial legitimacy through tribute demands and steppe law.#!\n\nTimur's envoys have arrived at Dadu, mocking the court's Han-law reforms as an abandonment of the Great Yassa and demanding equal protocol. How shall the Great Khan answer this Barlas Son-in-Law?"
 oe_ytm.2.desc_cus: "#F Claiming authority as Son-in-Law of the House of Genghis, Timur faced an acute paradox before a surviving Great Yuan: with Kublai's direct heirs still enthroned at Dadu, the conqueror tested imperial legitimacy through tribute demands and steppe law.#!\n\nTimur's envoys demand equal standing at Dadu, yet with ancestral Mongol customs upheld across the court, the imperial princes scorn Timur as a mere Barlas outsider presuming to lecture the Great Khan."
 oe_ytm.2.desc_gen: "#F Claiming authority as Son-in-Law of the House of Genghis, Timur faced an acute paradox before a surviving Great Yuan: with Kublai's direct heirs still enthroned at Dadu, the conqueror tested imperial legitimacy through tribute demands and steppe law.#!\n\nEnvoys from Samarkand have delivered an arrogant letter to Dadu testing the Great Yuan's western resolve. The court must choose between stern Genghisid defiance, nominal appeasement, or frontier retrenchment."
 oe_ytm.2.a: "Assert Supreme Genghisid Sovereignty and Rebuke Timur"
 oe_ytm.2.a.tt: "Gain [ShowModifier('oe_ytm_genghisid_pride')] (#Y 144#! months: morale and legitimacy at #R +15%#! heavy-cavalry upkeep); Yuan princes loyalty #G +5#!; mutual opinion with Timur #R −60#!."
 oe_ytm.2.b: "Bestow Nominal Title of Western Marshal to Deflect Timur"
 oe_ytm.2.b.tt: "Gain [ShowModifier('oe_ytm_western_deflection')] (#Y 144#! months: diplomacy and land trade at monthly legitimacy loss); Yuan princes loyalty #R −5#!; mutual opinion with Timur #G +20#!."
 oe_ytm.2.c: "Seal Jiayuguan and Retrench Behind Hexi"
 oe_ytm.2.c.tt: "Gain [ShowModifier('oe_ytm_jiayuguan_retrench')] (#Y 144#! months: defense and control at #R −12%#! land trade efficiency); Yuan princes loyalty #R −5#!."
 oe_ytm.3.t: "Struggle for the Tarim & Turpan"
 oe_ytm.3.desc_x: "#F Turpan, Kashgar, and Yarkand command the caravan gateways north and south of the Tian Shan, forming the contested hinge between Chagatai lords, Timurid armies, and Great Yuan's western approaches.#!\n\nDispatches from Turpan and Kashgar warn of shifting loyalties across the Tarim oases. Should Dadu invest heavily to revive the Western Regions Protectorate, or maintain a leaner frontier buffer through Hami?"
 oe_ytm.3.a: "Maintain a Tribute Buffer Through Hami and the Oases"
 oe_ytm.3.a.tt: "Gain [ShowModifier('oe_ytm_frontier_buffer')] (#Y 144#! months: defense and stability at modest land trade cost); Hami and Turpan gain [ShowModifier('oe_ytm_oasis_buffer')]."
 oe_ytm.3.b: "Revive the Western Regions Protectorate in Turpan, Kashgar & Yarkand"
 oe_ytm.3.b.tt: "Gain [ShowModifier('oe_ytm_protectorate_mod')] (#Y 144#! months: #G +10%#! land trade and diplomacy at #R +15%#! cavalry upkeep and slight control strain); Turpan, Kashgar, and Yarkand gain [ShowModifier('oe_ytm_oasis_garrison')]."
 oe_ytm.4.t: "Otrar 1405: The Winter of Decision"
 oe_ytm.4.desc_x: "#F In the winter of 1404, Timur marched east from Samarkand with a vast host aimed at China, crossing the frozen Syr Darya to Otrar. Historically, the bitter winter of early 1405 claimed Timur's life at Otrar and broke the campaign before it reached the Tian Shan.#!\n\nBlizzards lash the Syr Darya around Otrar. Scouts report winter sickness tearing through Timur's camp, threatening to collapse the expedition overnight, yet rumors also warn that Timur's vanguard may still force the passes toward Hexi."
 oe_ytm.4.a: "[Historical] Winter Claims Timur at Otrar; Hold the Passes"
 oe_ytm.4.a.tt: "Enters the historic post-Otrar succession branch; gain [ShowModifier('oe_ytm_otrar_vigil')] (#Y 60#! months: defense and trade recovery at #R +10%#! cavalry upkeep)."
 oe_ytm.4.b: "[Alt-History] Timur Survives Otrar: Mobilize the Great Banner!"
 oe_ytm.4.b.tt: "Unlocks the Great Eastern Campaign showdown; gain [ShowModifier('oe_ytm_great_campaign')] (#Y 60#! months: #G +8%#! morale and #G +3%#! discipline at #R +25%#! upkeep and rising war exhaustion); Timur gains matching [Concept('oe_tu_march','march')|e] effects without forced scripted war."
 oe_ytm.5.t: "Battle for Transoxiana & the Hexi Corridor"
 oe_ytm.5.desc_clash: "#F The winter at Otrar tipped the balance of Inner Asia: either Timurid succession wars left the corridor open to Yuan diplomacy, or a grueling clash raged across the passes from Hexi to Transoxiana.#!\n\nTimur's eastern vanguard and the Great Khan's frontier armies are locked in bitter combat across Turpan and the Hexi approaches. Should Dadu launch a costly counter-offensive toward Samarkand, or bleed the invaders in a Hexi war of attrition?"
 oe_ytm.5.desc_hist: "#F The winter at Otrar tipped the balance of Inner Asia: either Timurid succession wars left the corridor open to Yuan diplomacy, or a grueling clash raged across the passes from Hexi to Transoxiana.#!\n\nConfirmed word arrives from Otrar: Timur is dead and his heirs are fighting over Samarkand and Herat. Should Dadu invest in securing the Hexi-Turpan relay stations, or keep troops at home and tax frontier caravans?"
 oe_ytm.5.a: "Bleed the Invader in a Hexi War of Attrition"
 oe_ytm.5.a.tt: "Gain [ShowModifier('oe_ytm_hexi_attrition')] (#Y 96#! months: #G +12%#! defensiveness with war exhaustion and land trade loss); Hami and Turpan suffer [ShowModifier('oe_ytm_corridor_scar')]."
 oe_ytm.5.b: "Press the Counter-Offensive Toward Samarkand"
 oe_ytm.5.b.tt: "Decisive victory! Gain [ShowModifier('oe_ytm_transoxiana_triumph')] (#Y 144#! months: prestige, morale, and land trade at #R +20%#! cavalry upkeep); Samarkand gains [ShowModifier('oe_ytm_silk_station')]."
 oe_ytm.5.c: "Hold Home Defenses and Collect Frontier Tariffs"
 oe_ytm.5.c.tt: "Gain [ShowModifier('oe_ytm_border_tariffs')] (#Y 144#! months: #G +4%#! tax efficiency at #R −5%#! land trade efficiency)."
 oe_ytm.5.d: "Secure the Hexi-Turpan Corridor During Timurid Strife"
 oe_ytm.5.d.tt: "Gain [ShowModifier('oe_ytm_corridor_secured')] (#Y 144#! months: #G +8%#! land trade and merchant capacity at #R +10%#! cavalry upkeep); Turpan gains [ShowModifier('oe_ytm_silk_station')]."
 oe_ytm.6.t: "Post-Timur Settlement: Samarkand and Herat"
 oe_ytm.6.desc_x: "#F As Timur's tempest subsided into successor states centered on Samarkand and Herat, while Chagatai princes regrouped across the Tian Shan, Inner Asia stood ready for a durable diplomatic settlement.#!\n\nEnvoys from Samarkand, Bukhara, and Herat request regular relay traffic through the Jade Gate. Should Dadu establish permanent embassies in Samarkand and Herat to reopen overland commerce, or prioritize frontier compacts with the Chagatai lords?"
 oe_ytm.6.a: "Stabilize the Chagatai Borderlands by Frontier Treaty"
 oe_ytm.6.a.tt: "Gain [ShowModifier('oe_ytm_chagatai_stabilized')] (#Y 144#! months: defense and stability at modest trade cost); Kashgar and Yarkand gain [ShowModifier('oe_ytm_oasis_buffer')]."
 oe_ytm.6.b: "Open Permanent Embassies to Samarkand and Herat"
 oe_ytm.6.b.tt: "Marks the Central Asian corridor open for Silk Road diplomacy; gain [ShowModifier('oe_ytm_samarkand_embassy')] (#Y 144#! months: #G +8%#! land trade and diplomacy at slight control cost); Samarkand and Herat gain [ShowModifier('oe_ytm_silk_station')]."
 oe_ytm.7.t: "Shah Rukh's Embassy of Peace"
 oe_ytm.7.desc_x: "#F Between 1419 and 1422, Timur's son Shah Rukh sent a grand embassy of over five hundred envoys and artists from Herat, chronicled by Ghiyath al-Din Naqqash, inaugurating an era of peaceful trade and astronomical exchange across Eurasia.#!\n\nShah Rukh's splendid embassy from Herat and Samarkand now awaits audience at Dadu bearing fine horses, astrolabes, and letters of friendship. Should the court welcome them as equal sovereigns to expand trade and science, or insist on strict tributary submission?"
 oe_ytm.7.a: "Demand Formal Tributary Submission to the Great Khan"
 oe_ytm.7.a.tt: "Gain [ShowModifier('oe_ytm_khan_suzerainty')] (#Y 144#! months: prestige and legitimacy at #R −6%#! land trade efficiency and lower diplomatic reputation)."
 oe_ytm.7.b: "Welcome Shah Rukh's Embassy as Equal Sovereigns"
 oe_ytm.7.b.tt: "Opens the mid-Eurasian Silk Road for Twin Phoenix diplomacy; gain [ShowModifier('oe_ytm_shah_rukh_accord')] (#Y 144#! months: #G +10%#! land trade, merchant capacity, and research at slight prestige loss); boosts paper money trust by #G +4#! if active."
 oe_ytm.8.t: "Legacy of the Western Regions"
 oe_ytm.8.desc_x: "#F After half a century of Timurid storms, the winter of Otrar, and Shah Rukh's diplomacy, a restored Great Yuan has weathered its greatest western trial and set the lasting order between Dadu and Samarkand.#!\n\nWith the western horizon settled, the Secretariat asks the Great Khan to codify Great Yuan's enduring western doctrine: proclaim a Restored Pax Eurasiana from Dadu to Samarkand, or consolidate a fortified Western Frontier Bastion?"
 oe_ytm.8.a: "Consolidate the Western Frontier Bastion"
 oe_ytm.8.a.tt: "Gain lasting [ShowModifier('oe_ytm_frontier_bastion')] until Yuan falls (strong defense and morale with fort upkeep and land trade trade-offs). Completes this line."
 oe_ytm.8.b: "Proclaim the Restored Pax Eurasiana to Samarkand"
 oe_ytm.8.b.tt: "Exposes the Pax Eurasiana flag for Silk Road Twin Phoenix; gain lasting [ShowModifier('oe_ytm_pax_eurasiana')] until Yuan falls (land trade, merchant capacity, diplomacy at #R +15%#! cavalry upkeep). Completes this line."
