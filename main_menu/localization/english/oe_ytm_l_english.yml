 STATIC_MODIFIER_NAME_oe_ytm_tim_eastern_march: "Grand Eastern Campaign"
 STATIC_MODIFIER_DESC_oe_ytm_tim_eastern_march: "Pushing past Otrar toward the Tian Shan fuels Timurid battle fervor while straining long-range cavalry logistics."
 STATIC_MODIFIER_NAME_oe_ytm_transoxiana_triumph: "Triumph of Transoxiana"
 STATIC_MODIFIER_DESC_oe_ytm_transoxiana_triumph: "Breaking the eastern drive along the Tian Shan restores Genghisid majesty and caravan security at steep heavy-cavalry upkeep."
 STATIC_MODIFIER_NAME_oe_ytm_hexi_attrition: "Hexi Corridor Attrition"
 STATIC_MODIFIER_DESC_oe_ytm_hexi_attrition: "Scorched-earth defense along the Hexi Corridor blunts the invader's momentum at the price of war exhaustion and disrupted trade."
 STATIC_MODIFIER_NAME_oe_ytm_corridor_secured: "Hexi-Turpan Corridor Secured"
 STATIC_MODIFIER_DESC_oe_ytm_corridor_secured: "Securing post stations through Turpan during Timurid succession strife boosts land trade alongside modest patrol upkeep."
 STATIC_MODIFIER_NAME_oe_ytm_border_tariffs: "Western Frontier Tariffs"
 STATIC_MODIFIER_DESC_oe_ytm_border_tariffs: "Collecting frontier customs without western entanglement bolsters tax revenue while cooling long-distance caravan volume."
 STATIC_MODIFIER_NAME_oe_ytm_samarkand_embassy: "Samarkand & Herat Embassies"
 STATIC_MODIFIER_DESC_oe_ytm_samarkand_embassy: "Permanent Yuan envoys in Samarkand and Herat revive Transoxian commerce and diplomacy while slightly diluting central control."
 STATIC_MODIFIER_NAME_oe_ytm_chagatai_stabilized: "Chagatai Frontier Compact"
