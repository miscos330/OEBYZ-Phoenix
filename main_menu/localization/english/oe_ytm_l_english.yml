 STATIC_MODIFIER_DESC_oe_ytm_oasis_buffer: "Local oasis chieftains guard the passes under treaty, aiding defense while keeping merchant volume modest."
 STATIC_MODIFIER_NAME_oe_ytm_silk_station: "Yuan Overland Envoy Station"
