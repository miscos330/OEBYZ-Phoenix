l_english:
 oe_byz_ecumenical_patriarch_policy: "Ecumenical Patriarch"
 oe_byz_ecumenical_patriarch_policy_desc: "The patriarch of New Rome guards the shared faith of the Eastern churches, while the emperor protects the church."
 oe_rw_recruit_turkic_mercenaries: "Recruit Turkic Mercenaries"
 oe_rw_recruit_turkic_mercenaries_desc: "All members may pay 200 national treasury gold to hire 3 light cavalry and 2 light infantry units for 120 months at a cost multiplier of 0.8. One-year cooldown. Maintenance still applies. No imperial treasury, authority or public opinion cost."
 oe_rw_turkic_mercenary_company: "Turkic Company"
 oe_rw_classical_revival: "#bold #color_yellow Revive Greco-Roman Arts#!#!"
 oe_rw_classical_revival_desc: "Homer, Plato and the ancient historians have never entirely left our shelves. Now scholars wish to bring them back into the classroom, while artists look to antiquity for new forms of expression. Court patronage may make Constantinople the center of this revival.\n\nOnly the holder of #bold #color_yellow Roman Legitimacy#!#! may act. Costs #color_yellow 100 national treasury gold#! and has a #color_yellow ten-year#! cooldown, but the entire chain #bold may begin only once#!. The first event fires immediately; the next two follow at one-year intervals. Some options additionally cost half a year's income.\nThe action disappears once the Renaissance has appeared or the third event has fired. Payment comes from the national treasury, not the Privy Purse; no Authority or Public Opinion is spent.\n\n#Y Renaissance Progress: [GuiScope.SetRoot(GetInternationalOrganization('oe_byz_roman_world').MakeScope).ScriptValue('oe_rw_renaissance_progress')|0] / 3#!"
 oe_rw_recognize_local_rule: "Recognize Local Rule"
 oe_rw_recognize_local_rule_desc: "The Roman claimant recognizes a neighboring territorial member. Gain gold equal to six months of the target's tax and trade income and suffer -2 diplomatic reputation for one year. No upfront cost; one-year cooldown. For ten years the target cannot be selected for Press Imperial Claims or recognized again. This grants no truce and does not debit the target treasury."
 oe_rw_recognition_concessions: "Recognition of Local Rule"
 oe_rw_recognition_concessions_desc: "Other courts have seen that our imperial claims are open to negotiation."
 OE_RW_RECOGNITION_TARGET: "Choose a neighboring member"
 OE_RW_RECOGNITION_NO_TARGET: "@trigger_no! No eligible neighboring members"
 OE_RW_NOT_ALREADY_RECOGNIZED: "The target is not already protected by a ten-year recognition"
 OE_RW_CLAIM_RECOGNITION_BLOCK: "The target is not protected by a ten-year recognition"
 OE_RW_REVIVAL_ONCE: "This organization has not started the chain before"
 OE_RW_RENAISSANCE_PROGRESS_TITLE: "Renaissance Progress"
 OE_RW_RENAISSANCE_PROGRESS_DESC: "0–1 points: no final reward. 2 points: 20 prestige. 3 points: 20 prestige and Constantinople becomes the only eligible birthplace of the unspawned Renaissance, at its normal date. Rewards settle once after the final choice. An institution that appeared during the chain is not relocated."
 OE_RW_RENAISSANCE_ADD_SCORE: "#bold #color_yellow Renaissance progress +1#!#!"
 OE_RW_RENAISSANCE_BIRTHPLACE_SECURED: "The Renaissance will be born in #bold #color_yellow Constantinople#!#! at its normal date."
 oe_rw_renaissance.1.title: "A New Interest in Greco-Roman Learning"
 oe_rw_renaissance.1.desc: "Scholars and copyists are comparing ancient manuscripts and bringing them back into their classrooms. They ask the court to purchase more books and support their work. Rome may still command attention through learning, even where its armies cannot."
 oe_rw_renaissance.1.a: "Buy more manuscripts and support their research."
 oe_rw_renaissance.1.b: "I do not care."
 oe_rw_renaissance.2.title: "Invite Italian Artists"
 oe_rw_renaissance.2.desc: "A Tuscan painter offers to bring his drawings and techniques to Constantinople. Working alongside our painters, he could unite traditions from both shores. The treasury, however, has many other demands upon it."
 oe_rw_renaissance.2.a: "They are excellent artists."
 oe_rw_renaissance.2.b: "We cannot afford such luxuries."
 oe_rw_renaissance.3.title: "The Church's Intellectual Authority Questioned"
 oe_rw_renaissance.3.desc: "Scholars ask for greater freedom to study history, rhetoric and moral philosophy. Some clergy welcome the debate; others fear for the authority of traditional teaching. The court must decide.\n\n$OE_RW_RENAISSANCE_PROGRESS_DESC$"
 oe_rw_renaissance.3.a: "Encourage humanist thought."
 oe_rw_renaissance.3.b: "The position of the Church is unshakable."
