 # NEW 2026-11-23 v22.0 Module 3 Teutonic Eastward Enfeoffment — English Localization (100% EN/ZH parity) (oe_tom_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v220_teu_east_enfeoff.py; edit the generator, not this file.
 oe_teu_ordensmark:0 "Teutonic Ordensmark"
 oe_teu_ordensmark_desc:0 "A specialized landed knightly march chartered by the Teutonic Order (or its imperial Ordensstaat successor) across the eastern frontier. Sharing the Order's map color while bearing its own proud regional title, an Ordensmark answers every overlord call to arms, remits a modest knightly tithe, accelerates Ostsiedlung settlement and conversion, and remains shielded from arbitrary diplomatic annexation."
 LEAD_oe_teu_ordensmark:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
