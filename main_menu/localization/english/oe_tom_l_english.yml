 OE_TOM_SIT_LEGEND_TITLE:0 "Baltic Crusade Theater Legend"
 OE_TOM_SIT_LEGEND_DESC:0 "Country color: Teutonic Order / Secular Prussia core; Green: Bounded M1-M4 Ordensmarks & Livonian allies; Red: Poland-Lithuania coalition; Amber: Nordic, Hanseatic, Rus', and Imperial observers."
