 oe_teu_act_guest_crusaders:0 "Summon Western Guest Knights"
 oe_teu_act_guest_crusaders_cd:0 "Summon Western Guest Knights"
 oe_teu_act_guest_crusaders_desc:0 "Summon Rhineland and Imperial guest knights to Prussia (shared 8-year cooldown with the Preussenreisen decision). Grants manpower, army tradition, heavy cavalry morale, and +4 Momentum—halved at +50% gold cost after the Krewo Crisis."
 oe_teu_act_guest_crusaders_tt:0 "Shifts Crusade Momentum by #G +4#! (+2 after Krewo Crisis; shared cooldown with Preussenreisen decision)."
 oe_teu_act_fortify_ordensburgen:0 "Fortify Brick Ordensburgen"
 oe_teu_act_fortify_ordensburgen_cd:0 "Fortify Brick Ordensburgen"
 oe_teu_act_fortify_ordensburgen_desc:0 "Fund brick castle upgrades across Prussia and Livonia for 5 years of +10% defense and fort upkeep efficiency, pushing Crusade Momentum by #G +3#!."
 oe_teu_act_fortify_ordensburgen_tt:0 "Shifts Crusade Momentum by #G +3#! (action shift bounded within -20 to +20)."
 oe_teu_act_curia_plea:0 "Plead Legitimacy Before Rome"
 oe_teu_act_curia_plea_cd:0 "Plead Legitimacy Before Rome"
 oe_teu_act_curia_plea_desc:0 "Available only after Lithuania's baptism triggers the Krewo Crisis: spend gold and prestige at the Roman Curia to lift active Papal Censure, restore diplomatic standing for 5 years, and recover #G +3#! Momentum."
 oe_teu_act_curia_plea_tt:0 "Clears active Papal Censure, grants 5 years of Curial dispensation, and shifts Crusade Momentum by #G +3#!."
 oe_teu_act_pl_defensive_levy:0 "Rally Polish-Lithuanian Defensive Levy"
 oe_teu_act_pl_defensive_levy_cd:0 "Rally Polish-Lithuanian Defensive Levy"
 oe_teu_act_pl_defensive_levy_desc:0 "Mobilize Polish noble banners and Lithuanian border cavalry for 5 years of +8% defense, +8% light cavalry, and +5% morale, shifting Crusade Momentum by #R -4#!."
 oe_teu_act_pl_defensive_levy_tt:0 "Shifts Crusade Momentum by #R -4#! against the Order (action shift bounded within -20 to +20)."
 oe_teu_act_constance_indictment:0 "Indictment at the Council of Constance"
 oe_teu_act_constance_indictment_cd:0 "Indictment at the Council of Constance"
 oe_teu_act_constance_indictment_desc:0 "Following Paulus Vladimiri's famous indictment, challenge the Order's sword-mission before Christendom. Doubles potency once Lithuania is Catholic: shifts Momentum by #R -6#! and pushes Teutonic Prussian Bund tension by #R +10#!."
 oe_teu_act_constance_indictment_tt:0 "Shifts Crusade Momentum by #R -3#! (or #R -6#! and #R +10#! Teutonic Bund tension once Lithuania is Catholic)."
 oe_teu_act_baltic_trade_charter:0 "Neutral Baltic & Hanseatic Trade Charter"
 oe_teu_act_baltic_trade_charter_cd:0 "Neutral Baltic & Hanseatic Trade Charter"
 oe_teu_act_baltic_trade_charter_desc:0 "Escort neutral Baltic convoys to profit from Hanseatic trade, gaining 5 years of maritime efficiency—and if Prussian Bund tension is already high, discreetly emboldening Gdańsk and Toruń burghers (+6 Bund tension)."
 oe_msn_56_teu:0 "#bold #color_yellow Teutonic Order: Baltic Ordensstaat & 1525 Destiny#!#!"
 oe_msn_56_teu_DESCRIPTION:0 "From 1346 Estonia, Samogitia, Gotland, and Neumark through the Krewo and Prussian Bund crises to bounded eastern marches (M1-M4) and the 1525 Crossroads"
 oe_msn_56_teu_CRITERIA_DESCRIPTION:0 "Close the Baltic ring (1346 Estonia, Samogitia, Gotland/Neumark), harmonize the Four Bishoprics and Livonian Confederation, withstand Tannenberg and the Prussian Bund, establish bounded eastern shields (M1-M4), and choose Prussia's 1525 destiny."
 oe_msn_56_teu_BUTTON_TOOLTIP:0 "Embark on the Teutonic Order Historical Baltic Destiny"
 oe_msn_56_teu_BUTTON_DETAILS:0 "A grounded sixteen-task four-branch Baltic tree for the Teutonic Order (1337 and 1453 compatible): unite the Baltic corridor, manage the Four Bishoprics and Prussian Confederation, charter bounded eastern marches (M1-M4), and decide between 1525 Secular Prussia (bridging into Prussian Destiny) or a Counter-Reformation Ordensstaat."
 oe_tom.1.title:0 "Baptism of the Samogitian Woods & Vytautas's Remnants"
 oe_tom.1.desc:0 "Deep beneath the ancient oaks along the Dubysa and Nemunas rivers, our new Samaiten-Litauen Landmeister receives the oaths of baptized Samogitian elders while stubborn guerilla bands loyal to Lithuanian princes still lurk in the marshes. Shall we ring the river crossings with stern brick watchtowers, or entrust bilingual friars and tolerant native charters to win the forest parishes peacefully?"
 oe_tom.1.a:0 "Ring the Nemunas Crossings with Brick Watchtowers"
 oe_tom.1.b:0 "Dispatch Bilingual Friars and Respect Native Freemen"
 oe_tom.2.title:0 "Trinity Cathedral of Pskov & the Hanseatic Fur Kontor"
 oe_tom.2.desc:0 "Above the Velikaya River, the white stone walls of Pskov's Krom fortress and the domes of Trinity Cathedral now look out over Teutonic lances. Stopping prudently along the Peipus-Luga frontier rather than chasing the endless eastern woods, our northern marshal asks whether Pskov should serve as a frost-hardened winter bastion or reopen its bustling fur and wax kontor to Hanseatic merchants from Narva and Riga."
 oe_tom.2.a:0 "Fortify the Frozen Peipus-Luga Garrison Line"
 oe_tom.2.b:0 "Charter the Pskov-Narva Hanseatic Fur Kontor"
 oe_tom.3.title:0 "Custom Houses of Polotsk & the Daugava Bastions"
 oe_tom.3.desc:0 "River barges laden with pine timber, hemp, and beeswax drift down the Western Dvina past Polotsk toward Riga's sea wharves. By capping our eastern reach at the Dvina watershed rather than marching recklessly toward the Dnieper and Volga, our new Polotsk commander can either anchor the upper river with stone bastions or cultivate Polotsk's thriving customs staple."
 oe_tom.3.a:0 "Anchor Upper Polotsk and Vitebsk with Stone Bastions"
 oe_tom.3.b:0 "Establish Standardized Dvina Timber & Wax Customs"
 oe_tom.4.title:0 "Echoes of Duke Konrad at Płock & the Vistula Grain Road"
 oe_tom.4.desc:0 "Over a century ago, Duke Konrad of Mazovia invited the Teutonic Knights to the Vistula to guard his frontier; today, Marienburg's banners fly over Płock, Dobrzyń, and Kuyavia itself. Knowing that pushing further into Kraków or Poznań would invite endless Catholic vengeance, our southern warden asks whether to harden the middle Vistula bridgeheads or charter peaceful grain barges bound for Gdańsk."
 oe_tom.4.a:0 "Fortify the Middle Vistula Bridgehead Keeps"
 oe_tom.4.b:0 "Charter Kuyavian-Mazovian Grain Barges to Gdańsk"
 oe_tom.5.title:0 "Marienburg Chapter: Targeted March Integration"
 oe_tom.5.desc:0 "Before the Grand Officers in Marienburg's Chapter Hall lie the ledgers of our bounded eastern marches. Peacefully absorbing a mature, loyal march (established 25+ years, Liberty Desire < 25, <= 35 tiles) demands 200 gold, 20 prestige, and will unsettle the remaining march commanders (+15 Liberty Desire for 10 years)—or we may confirm autonomous march compacts instead."
 oe_tom.5.a:0 "Reintegrate M1: Ordensmark Samaiten-Litauen (200g / 20p)"
 oe_tom.5.b:0 "Reintegrate M2: Ordensmark Pleskau-Peipus (200g / 20p)"
 oe_tom.5.c:0 "Reintegrate M3: Ordensmark Düna-Polozk (200g / 20p)"
 oe_tom.5.d:0 "Reintegrate M4: Ordensmark Kujawien-Masowien (200g / 20p)"
 oe_tom.5.e:0 "Confirm Bounded Autonomous March Compacts (-75g)"
 oe_tom.8.title:0 "1242 Battle on the Ice Avenged"
 oe_tom.8.desc:0 "Over a century ago, the cracked ice of Lake Peipus swallowed the brothers' armored charge. Today our banners stand firm over Pskov and Izborsk—securing the eastern shore of the lake and settling the memory of 1242 along a defensible Baltic frontier."
 oe_tom.8.a:0 "Raise the Peipus Memorial Pillar and Drill Winter Knights"
 oe_tom.8.b:0 "Open the Pskov-Baltic Fur & Wax Trade Route"
 oe_tom.9.title:0 "Trial of Tannenberg: Grunwald Reckoning"
 oe_tom.9.desc:0 "Whether forged by victory against the combined hosts of Poland and Lithuania or secured through patient border statesmanship after Krewo, Marienburg has weathered its supreme strategic trial. Shall we enshrine a stern martial honor code across our regiments, or seal a pragmatic Perpetual Peace of Marienburg?"
 oe_tom.9.a:0 "Enshrine the Martial Honor of Tannenberg (+2% Disc / -8% Maint)"
 oe_tom.9.b:0 "Seal the Perpetual Peace of Marienburg (Gold, Stability & Trade)"
 oe_tom.10.title:0 "Black Cross and Double-Headed Eagle"
 oe_tom.10.desc:0 "Against every historical expectation, knights wearing the Black Cross now stand upon the stone ramparts of Crimea, gazing south across the Black Sea toward Constantinople. Envoys from the Roman Emperor await our word: forge an extraordinary Eurasian Christian alliance, or assert Roman Papal Primacy?"
 oe_tom.10.a:0 "Proclaim the Eurasian Christian Alliance with Constantinople"
 oe_tom.10.b:0 "Demand Papal Primacy Across the Black Sea"
 oe_tom.11.title:0 "Envoys of the Black Cross from Crimea"
 oe_tom.11.desc:0 "Knights of the Teutonic Order have reached the Crimean ports and dispatched envoys to the Golden Horn proposing a grand Christian alliance between Marienburg and New Rome."
 oe_tom.11.a:0 "Seal the Pact of the Black Cross and Double-Headed Eagle"
 oe_tom.11.b:0 "Prefer a Pragmatic Euxine Commercial Accord"
 oe_tom.12.title:0 "Ultimatum from the Northern Cross"
 oe_tom.12.desc:0 "Teutonic heralds arriving from Crimea have demanded recognition of Roman Papal Primacy over the Eastern Church, stirring bitter memories of 1204 throughout Constantinople."
 oe_tom.12.a:0 "Defy the Northern Knights Behind the Theodosian Walls"
 oe_tom.12.b:0 "De-escalate with a Black Sea Commercial Truce"
 oe_tom.14.title:0 "Verdict of the Northern Crusade"
 oe_tom.14.desc:0 "After generations of Baltic campaigns, diplomatic duels at Constance, and hard-fought transformations across Prussia, Livonia, Lithuania, and Poland, the era of the Northern Crusade reaches its historic close."
 oe_tom.14.a:0 "Preserve the Martial Heritage of the Baltic Frontier"
 oe_tom.14.b:0 "Turn Settled Borders into Lasting Hanseatic Prosperity"
 oe_tom.15.title:0 "Baptism at Vilnius: Collapse of Crusade Legitimacy"
 oe_tom.15.desc:0 "Bells ring across Kraków and Vilnius: Lithuania has embraced the Catholic faith and bound its destiny to Poland! Overnight, our Order's century-old charter to wage holy war against Europe's last pagans lies in ruins. Western Preussenreisen guest knights are already turning homeward, their upkeep costs rising by half while their numbers dwindle, and attacking Catholic Poland-Lithuania now risks Papal Censure at Constance. How shall Marienburg redefine its mission?"
 oe_tom.15.a:0 "Pivot Eastward Against the Orthodox Frontier (Pskov & Novgorod)"
 oe_tom.15.b:0 "Integrate into Regular Imperial Princely Diplomacy (HRE Law)"
 oe_tom.15.c:0 "Invoke the Bull of Rimini and Rule by the Sword (-1 Dip Rep / +15 Bund)"
 oe_tom.16.title:0 "Inquisition at Constance: Debate on Sword-Mission"
 oe_tom.16.desc:0 "By declaring offensive war on a fellow Catholic Polish-Lithuanian crown after the baptism of Lithuania, we have handed Polish jurists led by Paulus Vladimiri devastating ammunition before the Council and the Roman Curia. Cardinals denounce our campaign as unlawful aggression, Papal Censure hangs over Marienburg (preventing automatic offensive calls of our marches), and Prussian burghers murmur loudly against fresh war taxes."
 oe_tom.16.a:0 "Defy the Jurists and Endure Ten Years of Papal Censure"
 oe_tom.16.b:0 "Dispatch Curial Indemnities to Soften the Censure (-120g / -15p)"
 oe_tom.17.title:0 "Petition of Marienwerder: The Prussian Confederation"
 oe_tom.17.desc:0 "Delegates of Gdańsk, Toruń, Elbląg, and the Kulm gentry have assembled at Marienwerder (Kwidzyn) to form the Preußischer Bund—the Prussian Confederation! Angered by war taxes, commercial competition from the Order's Great Stewards, and distant eastern entanglements, they demand a binding charter for the Prussian Estates. Compromise will curb our crown power and urban taxes for twenty years, while flat refusal threatens open municipal defiance."
 oe_tom.17.a:0 "Ratify the Charter of the Prussian Estates (-35 Bund Tension)"
 oe_tom.17.b:0 "Reject the Petition and Uphold Order Sovereignty (+20 Tension)"
 oe_tom.18.title:0 "Uprising of the Prussian Confederation & Thirteen Years' Crisis"
 oe_tom.18.desc:0 "Patience has snapped across Royal Prussia! Town councils in Gdańsk, Toruń, and Elbląg have slammed their gates against our tax bailiffs, seized Order granaries, and dispatched secret envoys southward to Kraków begging the King of Poland to take Prussia under his crown. Marienburg faces the gravest internal crisis in its history!"
 oe_tom.18.a:0 "Crush the Rebel Councils by Force (Poland May Intervene!)"
 oe_tom.18.b:0 "Grant Sweeping Emergency Concessions to Pacify the Cities (-180g / -20p)"
 oe_tom.24.title:0 "Envoys of the Prussian Confederation Arrive in Kraków"
 oe_tom.24.desc:0 "Magistrates from Gdańsk, Toruń, and Elbląg kneel before the Polish throne declaring that the Teutonic Order has trampled their charters and offering Royal Prussia's allegiance if Poland will champion their cause."
 oe_tom.24.a:0 "Champion the Prussian Confederation and Claim Royal Prussia!"
 oe_tom.24.b:0 "Remain Cautious and Husband the Realm's Treasury"
 oe_tom.19.title:0 "1525 Crossroads: The Black Cross and the Iron Eagle"
 oe_tom.19.desc:0 "Reformation sermons echo through Königsberg and Gdańsk while the medieval crusading era fades into memory. At this historic crossroads, the Grand Master faces two irreconcilable paths: secularize the Prussian heartland into the Lutheran Duchy of Prussia (forming PRU, legally lifting monastic conversion blocks, unlocking the Prussian Destiny mission tree, dissolving the Catholic German Bailiwicks, and reshaping Livonia)—OR stand defiant as a Counter-Reformation Catholic Baltic Ordensstaat, enduring fierce domestic religious turmoil to preserve the Black Cross, our German Bailiwicks, and our bounded eastern marches."
 oe_tom.19.a:0 "Secularize as Lutheran Ducal Prussia (Form PRU & Unlock Prussian Destiny)"
 oe_tom.19.b:0 "Uphold the Counter-Reformation Catholic Baltic Ordensstaat"
 oe_tom.20.title:0 "The Fate of Livonia: Duchy of Courland and Livonia"
 oe_tom.20.desc:0 "With Marienburg secularized under the Iron Eagle of Prussia, our northern Livonian brethren must decide their new place in the Baltic order. Just as Gotthard Kettler later transformed Livonia into the secular Duchy of Courland, we may reorganize Livonia into a loyal Lutheran ducal fiefdom, forcibly absorb it directly into the Prussian Crown at steep administrative strain, or release it peacefully to remain in the Catholic camp."
 oe_tom.20.a:0 "Reorganize as the Secular Duchy of Courland & Livonia (Lutheran Fief)"
 oe_tom.20.b:0 "Absorb Livonia Directly into the Prussian Crown (-15 Stab / Overstretch)"
 oe_tom.20.c:0 "Peacefully Release Livonia into the Catholic Camp (+10 Prestige / +5 Stab)"
 oe_tom.21.title:0 "Teutonic Offer to Purchase Danish Estonia"
 oe_tom.21.desc:0 "Envoys from the Teutonic Grand Master have arrived with heavy silver chests offering 280 gold for our distant, turbulent Estonian province around Tallinn and Narva. Selling Estonia fills the royal treasury immediately, whereas refusing preserves our Baltic foothold at the risk of border friction."
 oe_tom.21.a:0 "Accept 280 Gold and Transfer Estonia to the Order"
 oe_tom.21.b:0 "Refuse the Sale and Hold Tallinn for the Danish Crown"
 oe_tom.22.title:0 "Synod of the Four Prussian Bishoprics"
 oe_tom.22.desc:0 "Bishops from Sambia, Pomesania, Kulm, and autonomous Warmia gather at Marienburg to settle diocesan jurisdiction. Compliant dioceses closely bound to the Order may be peacefully incorporated into direct governance, while proud Warmia presents a genuine choice: respect its historic ecclesiastical autonomy for scholarly and clerical goodwill, or absorb it outright at the cost of Papal anger."
 oe_tom.22.a:0 "Peacefully Incorporate a Compliant Prussian Diocese (SMD / PMS / CHL)"
 oe_tom.22.b:0 "Confirm Warmian Ecclesiastical Autonomy (+Clergy / +Research / +Papal)"
 oe_tom.22.c:0 "Forcibly Incorporate Warmia into Order Rule (-40 Papal / -Clergy)"
 oe_tom.23.title:0 "Papal Legate Mediation in the Livonian Confederation"
 oe_tom.23.desc:0 "Papal legates convened between Riga, Dorpat, and Pärnu remind Marienburg that Livonia's bishoprics and Hanseatic city cannot be erased with a stroke of the pen. Through patient diplomacy and curial stipends, we may incorporate ONE compliant see into the Livonian Order this decade, or seal a federal compact strengthening northern loyalty."
 oe_tom.23.a:0 "Mediate the Incorporation of ONE Compliant Livonian See (-160g / -15p)"
 oe_tom.23.b:0 "Reaffirm the Livonian Confederation Federal Compact (-60g)"
 OE_TOM_MARCH_SAMAITEN:0 "Ordensmark Samaiten-Litauen"
 OE_TOM_MARCH_SAMAITEN_ADJ:0 "Samogitian-Teutonic"
 oe_tom_dec_enfeoff_samaiten.title:0 "Charter M1 Frontier March: Ordensmark Samaiten-Litauen"
 oe_tom_dec_enfeoff_samaiten.desc:0 "Establish the bounded Ordensmark Samaiten-Litauen over conquered non-protected holdings in Samogitia and Western-Central Lithuania (41 tiles) (never touching Prussia, Livonia, Gotland, or Neumark). Grants ONLY a capital core, automatically tolerates native frontier cultures, counts toward the 4-march cap at 0.60 diplomatic capacity scale, and requires owning a regional capital, 8+ tiles, a brick Ordensburg, and peace."
 oe_tom_dec_enfeoff_samaiten.a:0 "Grant the Bounded Charter of Samaiten-Litauen"
 oe_tom_dec_enfeoff_samaiten_req_tt:0 "Own capital (Raseiniai / Kaunas / Vilnius), hold at least #Y 8#! non-protected tiles in Samogitia and Western-Central Lithuania (41 tiles), and maintain a Castle, Order Stronghold, or Bastion there."
 oe_tom_dec_enfeoff_samaiten_tt:0 "Creates #Y Ordensmark Samaiten-Litauen#! as a bounded Teutonic Ordensmark (1 capital core only, native cultures tolerated, hard cap 4 marches) and triggers its unique regional charter event."
 OE_TOM_MARCH_PLESKAU:0 "Ordensmark Pleskau-Peipus"
 OE_TOM_MARCH_PLESKAU_ADJ:0 "Pskovian-Teutonic"
 oe_tom_dec_enfeoff_pleskau.title:0 "Charter M2 Frontier March: Ordensmark Pleskau-Peipus"
 oe_tom_dec_enfeoff_pleskau.desc:0 "Establish the bounded Ordensmark Pleskau-Peipus over conquered non-protected holdings in Lake Peipus, Pskov, and the Luga frontier (28 tiles) (never touching Prussia, Livonia, Gotland, or Neumark). Grants ONLY a capital core, automatically tolerates native frontier cultures, counts toward the 4-march cap at 0.60 diplomatic capacity scale, and requires owning a regional capital, 6+ tiles, a brick Ordensburg, and peace."
 oe_tom_dec_enfeoff_pleskau.a:0 "Grant the Bounded Charter of Pleskau-Peipus"
 oe_tom_dec_enfeoff_pleskau_req_tt:0 "Own capital (Pskov / Koporye), hold at least #Y 6#! non-protected tiles in Lake Peipus, Pskov, and the Luga frontier (28 tiles), and maintain a Castle, Order Stronghold, or Bastion there."
 oe_tom_dec_enfeoff_pleskau_tt:0 "Creates #Y Ordensmark Pleskau-Peipus#! as a bounded Teutonic Ordensmark (1 capital core only, native cultures tolerated, hard cap 4 marches) and triggers its unique regional charter event."
 OE_TOM_MARCH_POLOZK:0 "Ordensmark Duna-Polozk"
 OE_TOM_MARCH_POLOZK_ADJ:0 "Polotskian-Teutonic"
 oe_tom_dec_enfeoff_polozk.title:0 "Charter M3 Frontier March: Ordensmark Duna-Polozk"
 oe_tom_dec_enfeoff_polozk.desc:0 "Establish the bounded Ordensmark Duna-Polozk over conquered non-protected holdings in Upper Western Dvina, Polotsk, Vitebsk, and Breslauja (30 tiles) (never touching Prussia, Livonia, Gotland, or Neumark). Grants ONLY a capital core, automatically tolerates native frontier cultures, counts toward the 4-march cap at 0.60 diplomatic capacity scale, and requires owning a regional capital, 6+ tiles, a brick Ordensburg, and peace."
 oe_tom_dec_enfeoff_polozk.a:0 "Grant the Bounded Charter of Duna-Polozk"
 oe_tom_dec_enfeoff_polozk_req_tt:0 "Own capital (Polotsk / Vitebsk), hold at least #Y 6#! non-protected tiles in Upper Western Dvina, Polotsk, Vitebsk, and Breslauja (30 tiles), and maintain a Castle, Order Stronghold, or Bastion there."
 oe_tom_dec_enfeoff_polozk_tt:0 "Creates #Y Ordensmark Duna-Polozk#! as a bounded Teutonic Ordensmark (1 capital core only, native cultures tolerated, hard cap 4 marches) and triggers its unique regional charter event."
 OE_TOM_MARCH_KUJAWIEN:0 "Ordensmark Kujawien-Masowien"
 OE_TOM_MARCH_KUJAWIEN_ADJ:0 "Kuyavian-Teutonic"
 oe_tom_dec_enfeoff_kujawien.title:0 "Charter M4 Frontier March: Ordensmark Kujawien-Masowien"
 oe_tom_dec_enfeoff_kujawien.desc:0 "Establish the bounded Ordensmark Kujawien-Masowien over conquered non-protected holdings in Dobrzyn, Kuyavia, Northern Mazovia, and Naklo (28 tiles) (never touching Prussia, Livonia, Gotland, or Neumark). Grants ONLY a capital core, automatically tolerates native frontier cultures, counts toward the 4-march cap at 0.60 diplomatic capacity scale, and requires owning a regional capital, 6+ tiles, a brick Ordensburg, and peace."
 oe_tom_dec_enfeoff_kujawien.a:0 "Grant the Bounded Charter of Kujawien-Masowien"
 oe_tom_dec_enfeoff_kujawien_req_tt:0 "Own capital (Plock / Warsaw / Inowroclaw), hold at least #Y 6#! non-protected tiles in Dobrzyn, Kuyavia, Northern Mazovia, and Naklo (28 tiles), and maintain a Castle, Order Stronghold, or Bastion there."
 oe_tom_dec_enfeoff_kujawien_tt:0 "Creates #Y Ordensmark Kujawien-Masowien#! as a bounded Teutonic Ordensmark (1 capital core only, native cultures tolerated, hard cap 4 marches) and triggers its unique regional charter event."
 oe_msn_teu_a1_nemunas_iron_curtain:0 "Iron Curtain of the Nemunas"
 oe_msn_teu_a1_nemunas_iron_curtain_desc:0 "Along the misty Nemunas frontier, brick watchtowers guard Prussia's eastern approaches. Securing our [fort|e] line sharpens [army_tradition|e] and—so long as Lithuania remains pagan—justifies a holy crusade across Samogitia."
 oe_msn_teu_a1_nemunas_iron_curtain_req_tt:0 "Own or have subjects own Malbork or Pärnu, hold 5 Stability, and maintain at least one Castle, Order Stronghold, or Bastion."
 oe_msn_teu_a2_estonia_1346:0 "1346 Purchase of Estonia"
 oe_msn_teu_a2_estonia_1346_desc:0 "Acquiring Danish Estonia—whether through King Valdemar's historic sale after St. George's Night or direct negotiation—locks the Gulf of Finland beneath the Order's northern [trade|e] and fortress umbrella."
 oe_msn_teu_a2_estonia_1346_req_tt:0 "Own or have subjects (including Livonia) own both Tallinn and Narva."
 oe_msn_teu_a3_samogitian_land_bridge:0 "The Samogitian Land Bridge"
 oe_msn_teu_a3_samogitian_land_bridge_desc:0 "For a century Samogitia severed Prussia from Livonia. Holding Memel and the key river crossings binds both Baltic wings into a unified logistical corridor of [control|e]."
 oe_msn_teu_a3_samogitian_land_bridge_req_tt:0 "Control Memel, hold Raseiniai or Palanga, and control at least 6 locations in Samogitia (directly or via subjects)."
 oe_msn_teu_a4_trial_of_tannenberg:0 "Trial of Tannenberg"
 oe_msn_teu_a4_trial_of_tannenberg_desc:0 "Whether decided by armored lances on the fields of Grunwald or through a hard-won diplomatic settlement after the Union of Krewo, the Order must prove its [army|e] and statecraft can survive Poland-Lithuania's rise."
 oe_msn_teu_a4_trial_of_tannenberg_req_tt:0 "Defeat Poland or Lithuania in war, OR control Kaunas or Płock, OR maintain peace with 15 Stability after the Krewo Crisis."
 oe_msn_teu_b1_kulm_and_bishoprics:0 "Kulm Law & the Four Bishoprics"
 oe_msn_teu_b1_kulm_and_bishoprics_desc:0 "Harmonizing Kulm municipal charters with the four Prussian bishoprics—Warmia, Sambia, Pomesania, and Kulm—anchors domestic [development|e] and clerical [estate_satisfaction|e]."
 oe_msn_teu_b1_kulm_and_bishoprics_req_tt:0 "Control Toruń, Malbork, and Königsberg, reach 12 Capital Development, and either enact Bishopric Concordats or keep Sambia and Pomesania loyal."
 oe_msn_teu_b2_marienburg_brick_crown:0 "Crown of Brick Gothic: Marienburg"
 oe_msn_teu_b2_marienburg_brick_crown_desc:0 "Fired from Prussian clay along the Nogat, Marienburg's soaring brick vaults stand as Christendom's premier monastic [fort|e], treasury vault, and administrative seat."
 oe_msn_teu_b2_marienburg_brick_crown_req_tt:0 "Control Malbork with a Castle/Order Stronghold/Bastion and 15 Development, and hold 150 Gold."
 oe_msn_teu_b3_neumark_and_gotland:0 "Neumark Bridge & Gotland Shield"
 oe_msn_teu_b3_neumark_and_gotland_desc:0 "Whether sweeping Victual Brothers pirates from Gotland (1398) or acquiring the Neumark (1402) to open an overland bridge to Germany, the Order secures its western [trade|e] arteries."
 oe_msn_teu_b3_neumark_and_gotland_req_tt:0 "Control Visby (Gotland) OR at least 3 locations in Neumark (directly or via subjects)."
 oe_msn_teu_b4_prussian_confederation:0 "Confront the Prussian Confederation"
 oe_msn_teu_b4_prussian_confederation_desc:0 "The clash between monastic monopoly and the Hanseatic liberties of Gdańsk, Toruń, and Elbląg defines the Order's fifteenth century. Resolving the Prussian Confederation secures domestic [crown_power|e] and urban peace."
 oe_msn_teu_b4_prussian_confederation_req_tt:0 "Reach 1420 or the Age of Renaissance, and resolve Prussian Confederation tension (tension <= 25, granted Estates Charter, or survived the uprising)."
 oe_msn_teu_c1_livonian_confederation:0 "Mediate the Livonian Confederation"
 oe_msn_teu_c1_livonian_confederation_desc:0 "Respecting the historic autonomy of the Livonian Landmeister while mediating peacefully between Riga, Dorpat, and Courland secures loyal northern [subjects|e] and Baltic [trade|e]."
 oe_msn_teu_c1_livonian_confederation_req_tt:0 "Control Riga, Tartu, and Kuldīga (directly or via subjects), and keep Livonia loyal (Liberty Desire < 40) if it exists."
 oe_msn_teu_c2_samogitia_march_m1:0 "Nemunas-Samogitia March (M1)"
 oe_msn_teu_c2_samogitia_march_m1_desc:0 "Organizing Samogitia and the western Nemunas basins either as the bounded Samaiten-Litauen Ordensmark or unified Baltic holdings extends disciplined [control|e] over the northern forests."
 oe_msn_teu_c2_samogitia_march_m1_req_tt:0 "Charter Ordensmark Samaiten-Litauen (M1), OR control all 16 locations of Samogitia directly or via subjects."
 oe_msn_teu_c3_peipus_defense_m2:0 "Debts of the Ice: Peipus Line (M2)"
 oe_msn_teu_c3_peipus_defense_m2_desc:0 "Securing Pskov, Izborsk, and the Lake Peipus-Luga river frontier answers the memory of 1242 without overstretching into the endless Russian interior, anchoring northern [fort|e] security."
 oe_msn_teu_c3_peipus_defense_m2_req_tt:0 "Charter Ordensmark Pleskau-Peipus (M2), OR control both Pskov and Izborsk directly or via subjects."
 oe_msn_teu_c4_eastern_shields_m3_m4:0 "Eastern Shields: Dvina or Kuyavia (M3 / M4)"
 oe_msn_teu_c4_eastern_shields_m3_m4_desc:0 "Completing the Order's bounded strategic perimeter along the Western Dvina at Polotsk or the middle Vistula at Płock creates a sustainable network of loyal frontier [subjects|e] and [control|e]."
 oe_msn_teu_c4_eastern_shields_m3_m4_req_tt:0 "Charter Ordensmark Düna-Polozk (M3) or Kujawien-Masowien (M4), OR maintain at least 2 active Ordensmarks."
 oe_msn_teu_d1_mergentheim_and_empire:0 "Mergentheim & Imperial Princely Law"
 oe_msn_teu_d1_mergentheim_and_empire_desc:0 "Resolving the Order's constitutional standing between the Reichsschild imperial princehood and the sovereign Bull of Rimini anchors our German bailiwicks and diplomatic [prestige|e]."
 oe_msn_teu_d1_mergentheim_and_empire_req_tt:0 "Have 20 Prestige and either enact the Reichsschild / Rimini decision (or reach the Age of Reformation)."
 oe_msn_teu_d2_amber_and_hansa:0 "Baltic Amber & Hanseatic Compact"
 oe_msn_teu_d2_amber_and_hansa_desc:0 "Unifying Samland's royal amber staple with the bustling wharves of Gdańsk and Königsberg transforms Prussia into Northern Europe's premier maritime [market|e]."
 oe_msn_teu_d2_amber_and_hansa_req_tt:0 "Control Gdańsk and Königsberg, hold 2 Marketplaces or Docks, and enact the Amber Monopoly Law (or a Hanseatic Trade policy)."
 oe_msn_teu_d3_1525_crossroads:0 "1525 Reformation Crossroads"
 oe_msn_teu_d3_1525_crossroads_desc:0 "As Martin Luther's theses sweep the Baltic ports, the Grand Master faces the defining choice of 1525: secularize into the Lutheran Duchy of Prussia or forge a Counter-Reformation Baltic [crown_power|e] Ordensstaat."
 oe_msn_teu_d3_1525_crossroads_req_tt:0 "Reach the Age of Reformation (or 1520) and complete the 1525 Crossroads choice (or have formed Prussia)."
 oe_msn_teu_d4_baltic_destiny:0 "Iron Eagle Reborn / Eternal Baltic Black Cross"
 oe_msn_teu_d4_baltic_destiny_desc:0 "From Malbork and Königsberg to Gdańsk, Riga, and Tallinn, the Baltic domain stands reborn—either bridging seamlessly into the modern Prussian Crown or enduring as a Counter-Reformation Ordensstaat of unmatched [crown_power|e]."
 oe_msn_teu_d4_baltic_destiny_req_tt:0 "Hold 15 Stability and control Malbork, Königsberg, Gdańsk, and Riga or Tallinn (directly or via subjects)."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_charter:0 "Chartered Ordensmark Foundation"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_charter:0 "Fresh brick commanderies, frontier garrisons, and native-toleration compacts stabilize a newly chartered eastern march."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_reint_unease:0 "Frontier March Autonomy Unease"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_reint_unease:0 "Seeing a neighboring Ordensmark absorbed into direct rule stirs wary resentment among the remaining march commanders."
 STATIC_MODIFIER_NAME_oe_tom_mod_m1_nemunas_forts:0 "Nemunas Brick Watchtower Chain"
 STATIC_MODIFIER_DESC_oe_tom_mod_m1_nemunas_forts:0 "Fortified timber-and-brick watchtowers along the Nemunas guard Samogitia against Lithuanian raids at the cost of local trade."
 STATIC_MODIFIER_NAME_oe_tom_mod_m1_forest_missions:0 "Samogitian Parish & Forest Missions"
 STATIC_MODIFIER_DESC_oe_tom_mod_m1_forest_missions:0 "Bilingual friars preach peacefully among baptized Samogitian freemen, speeding heathen conversion and rural prosperity at lower fortress readiness."
 STATIC_MODIFIER_NAME_oe_tom_mod_m2_peipus_garrison:0 "Peipus Winter Frontier Garrison"
 STATIC_MODIFIER_DESC_oe_tom_mod_m2_peipus_garrison:0 "Cold-hardened garrisons patrol the frozen approaches of Pskov and Izborsk at heavier supply cost."
 STATIC_MODIFIER_NAME_oe_tom_mod_m2_fur_kontor:0 "Pskov-Narva Hanseatic Fur Kontor"
 STATIC_MODIFIER_DESC_oe_tom_mod_m2_fur_kontor:0 "Licensed Hanseatic factors at Pskov channel northern sable, beeswax, and flax westward while easing fortress levies."
 STATIC_MODIFIER_NAME_oe_tom_mod_m3_dvina_bastions:0 "Upper Dvina Citadel Chain"
 STATIC_MODIFIER_DESC_oe_tom_mod_m3_dvina_bastions:0 "Riverine redoubts anchoring Polotsk and Vitebsk tighten eastern control and defensive depth at steeper fort outlay."
 STATIC_MODIFIER_NAME_oe_tom_mod_m3_polotsk_customs:0 "Polotsk Dvina River Customs"
 STATIC_MODIFIER_DESC_oe_tom_mod_m3_polotsk_customs:0 "Standardized timber, hemp, and wax customs along the Daugava enrich the march treasury while softening military discipline."
 STATIC_MODIFIER_NAME_oe_tom_mod_m4_vistula_bridgehead:0 "Vistula Bridgehead Fortresses"
 STATIC_MODIFIER_DESC_oe_tom_mod_m4_vistula_bridgehead:0 "Heavy keeps at Płock and Dobrzyń guard the southern Vistula approaches against Polish counterstrikes at elevated garrison upkeep."
 STATIC_MODIFIER_NAME_oe_tom_mod_m4_grain_charter:0 "Kuyavian-Mazovian Grain Charter"
 STATIC_MODIFIER_DESC_oe_tom_mod_m4_grain_charter:0 "River barges descending from Kuyavia and Mazovia feed Baltic granaries and port revenues while conceding local gentry privileges."
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_overlord:0 "Grand Master's Eastern Circuit"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_overlord:0 "The Grand Master's personal inspection across the bounded eastern marches sustains vassal fealty and standing."
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_march:0 "Invested by the Grand Master"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_march:0 "Bearing banners blessed at Marienburg, march commanders focus on frontier heathen missions and disciplined border watch."
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier1:0 "Eastern Ordensmark Host (Vanguard)"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier1:0 "Knightly banners from one or two eastern marches bolster heavy cavalry shock and campaign morale at higher supply cost."
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier2:0 "Eastern Ordensmark Host (Grand Muster)"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier2:0 "Three or four bounded eastern marches rally beneath the Black Cross, delivering formidable heavy cavalry shock at steep upkeep."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_mobilized:0 "Ordensmark War Muster"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_mobilized:0 "Commanderies across the march open their armories and granaries to sustain the Grand Master's campaign."
 STATIC_MODIFIER_NAME_oe_tom_mod_direct_rule:0 "Direct Crown Reintegration"
 STATIC_MODIFIER_DESC_oe_tom_mod_direct_rule:0 "Absorbing a mature march into direct rule raises crown authority and control while straining traditional noble estates."
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_1:0 "Autonomous March Compact (I)"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_1:0 "Honoring bounded march autonomy sustains steady frontier trade and loyal vassals at a slight dip in central power."
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_2:0 "Autonomous March Compact (II)"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_2:0 "Three or four autonomous Baltic marches anchor eastern trade lanes and cavalry traditions while moderating central crown authority."
 STATIC_MODIFIER_NAME_oe_tom_mod_crusade_legitimacy_waning:0 "Waning Crusade Legitimacy (Post-Krewo)"
 STATIC_MODIFIER_DESC_oe_tom_mod_crusade_legitimacy_waning:0 "Lithuania's Catholic baptism strips away the Order's pagan-crusade mandate, drying up Western mercenaries and curial backing."
 STATIC_MODIFIER_NAME_oe_tom_mod_papal_censure:0 "Papal Censure of Constance"
 STATIC_MODIFIER_DESC_oe_tom_mod_papal_censure:0 "Condemned by jurists at Constance for attacking fellow Catholic realms, Marienburg endures severe diplomatic isolation and curial rebuke."
 STATIC_MODIFIER_NAME_oe_tom_mod_pl_constance_defense:0 "Coalition Defense of Christendom"
 STATIC_MODIFIER_DESC_oe_tom_mod_pl_constance_defense:0 "Backed by papal jurists and unified noble banners, Polish-Lithuanian armies rally fiercely to defend their borders."
 STATIC_MODIFIER_NAME_oe_tom_mod_krewo_rus_pivot:0 "Pivot to the Orthodox Frontier"
 STATIC_MODIFIER_DESC_oe_tom_mod_krewo_rus_pivot:0 "Refocusing crusader zeal toward Pskov and Novgorod preserves partial martial momentum while alarming eastern neighbors."
 STATIC_MODIFIER_NAME_oe_tom_mod_krewo_imperial_law:0 "Secular Imperial Princely Alignment"
 STATIC_MODIFIER_DESC_oe_tom_mod_krewo_imperial_law:0 "Trading pagan-crusade privileges for regular imperial diplomacy heals European standing at the cost of fervent crusading zeal."
 STATIC_MODIFIER_NAME_oe_tom_mod_krewo_sword_rule:0 "Rimini Rule by the Sword"
 STATIC_MODIFIER_DESC_oe_tom_mod_krewo_sword_rule:0 "Defying curial restraint to rule by steel sharpens campaign morale at the harsh price of diplomatic isolation and heavier military costs."
 STATIC_MODIFIER_NAME_oe_tom_mod_prussian_estates_charter:0 "Charter of the Prussian Estates"
 STATIC_MODIFIER_DESC_oe_tom_mod_prussian_estates_charter:0 "Conceding fiscal consultation to Gdańsk, Toruń, and Elbląg calms the Prussian Confederation while reducing crown power and burgher tax caps."
 STATIC_MODIFIER_NAME_oe_tom_mod_bund_uprising_strain:0 "Thirteen Years' Crisis Strain"
 STATIC_MODIFIER_DESC_oe_tom_mod_bund_uprising_strain:0 "Open revolt across the Vistula ports drains Marienburg's treasury, tax receipts, and manpower reserves."
 STATIC_MODIFIER_NAME_oe_tom_mod_secular_march_drift:0 "Secularized Frontier Protectorate Drift"
 STATIC_MODIFIER_DESC_oe_tom_mod_secular_march_drift:0 "After Marienburg's secularization, former monastic marches chafe under secular kingship and demand greater autonomy."
 STATIC_MODIFIER_NAME_oe_tom_mod_counter_reformation_purge:0 "Counter-Reformation Iron Purges"
 STATIC_MODIFIER_DESC_oe_tom_mod_counter_reformation_purge:0 "Suppressing Lutheran agitation across coastal Prussian towns triggers painful burgher unrest and slows scholarly openness."
 STATIC_MODIFIER_NAME_oe_tom_mod_catholic_bulwark:0 "Papal Bulwark of the Baltic"
 STATIC_MODIFIER_DESC_oe_tom_mod_catholic_bulwark:0 "Unwavering loyalty to Rome secures papal subsidies, diplomatic respect among Catholic courts, and hardened bastion defenses."
 STATIC_MODIFIER_NAME_oe_tom_mod_courland_duchy_pact:0 "Duchy of Courland-Livonia Compact"
 STATIC_MODIFIER_DESC_oe_tom_mod_courland_duchy_pact:0 "Reorganizing the northern branch into a loyal secular Lutheran fief preserves Baltic maritime commerce without northern overstretch."
 STATIC_MODIFIER_NAME_oe_tom_mod_livonian_overstretch:0 "Livonian Direct Annexation Overstretch"
 STATIC_MODIFIER_DESC_oe_tom_mod_livonian_overstretch:0 "Forcibly absorbing Livonia's noble estates and distant towns stretches Prussian bureaucracy and fuels regional unrest."
 STATIC_MODIFIER_NAME_oe_tom_mod_warmia_autonomy:0 "Warmian Ecclesiastical Autonomy"
 STATIC_MODIFIER_DESC_oe_tom_mod_warmia_autonomy:0 "Respecting the Prince-Bishopric of Warmia's historic charter wins clerical gratitude and nurtures cathedral scholarship."
 STATIC_MODIFIER_NAME_oe_tom_mod_livonian_federal_compact:0 "Livonian Confederation Federal Compact"
 STATIC_MODIFIER_DESC_oe_tom_mod_livonian_federal_compact:0 "Diplomatic mediation across Riga and the Baltic sees stabilizes northern vassal loyalty and Daugava river trade."
 STATIC_MODIFIER_NAME_oe_tom_mod_peipus_avenged_a:0 "Vengeance of Lake Peipus"
 STATIC_MODIFIER_DESC_oe_tom_mod_peipus_avenged_a:0 "Having secured Pskov and Izborsk beyond Lake Peipus, our winter columns march across northern forests with iron resolve."
 STATIC_MODIFIER_NAME_oe_tom_mod_peipus_avenged_b:0 "Pskov-Baltic Fur Hansa"
 STATIC_MODIFIER_DESC_oe_tom_mod_peipus_avenged_b:0 "Order trade houses along Lake Peipus channel northern furs and beeswax directly into Baltic ports."
 STATIC_MODIFIER_NAME_oe_tom_mod_tannenberg_reversed_a:0 "Triumph of the Black Cross"
