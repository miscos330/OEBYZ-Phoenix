 oe_teu_ordensmark_subject_opinion:0 "Grand Master's Overlordship"
 oe_teu_ordensmark_overlord_opinion:0 "Teutonic Ordensmark"
 oe_tom_ordensmark_reform:0 "Ordensmark Fortress Charter"
 oe_tom_ordensmark_reform_desc:0 "A network of brick Ordensburg castles, Kulm-law frontier towns, and monastic commanderies that lowers fortress upkeep, speeds Ostsiedlung cultural and Catholic integration, and drills elite Teutonic heavy cavalry."
 oe_tom_op_enfeoffed:0 "Chartered as Teutonic Ordensmark"
 oe_tom_op_circuit:0 "Grand Master's Eastern Circuit"
 oe_tom_op_byz_holy_alliance:0 "Black Cross & Double-Headed Eagle Pact"
 oe_tom_op_byz_papal_demand:0 "Demanded Papal Primacy"
 oe_tom_dec_grand_master_circuit.title:0 "Grand Master's Eastern Circuit & Investiture"
 oe_tom_dec_grand_master_circuit.desc:0 "Lead the Grand Master's chapter in a solemn eastern inspection across every chartered Teutonic Ordensmark, reducing liberty desire by #G -15#!, raising mutual opinion, and accelerating Ostsiedlung cultural assimilation and Catholic conversion for #Y 5#! years."
 oe_tom_dec_grand_master_circuit.a:0 "Bless the Banners of the Eastern Marches"
 oe_tom_dec_grand_master_circuit_tt:0 "All active Teutonic Ordensmarks lose #G 15#! Liberty Desire, gain #G +35#! opinion, and receive a #Y 5#!-year Ostsiedlung assimilation and Catholic conversion bonus (5-year cooldown)."
 oe_tom_dec_levy_ordensmark_host.title:0 "Levy the Eastern Ordensmark Host"
 oe_tom_dec_levy_ordensmark_host.desc:0 "Sound the war horns from Marienburg to the eastern steppes to mobilize heavy cavalry and siege banners from every active Teutonic Ordensmark. Military synergy scales across #Y 1–2#!, #Y 3–4#!, and #Y 5+#! active marches."
 oe_tom_dec_levy_ordensmark_host.a:0 "Muster the Black Cross Marches"
 oe_tom_dec_levy_ordensmark_host_tt:0 "Grants a #Y 5#!-year wartime synergy modifier scaled by the number of active Teutonic Ordensmarks (1–2 Vanguard, 3–4 Grand Crusade, 5+ Continental Levy) and mobilizes all marches (5-year cooldown)."
 oe_tom_dec_reintegrate_march.title:0 "Feudal March Autonomy vs. Direct Crown Rule"
 oe_tom_dec_reintegrate_march.desc:0 "As our eastern Ordensmarks mature into rich brick-built provinces, the Grand Master's chapter debates the future of the empire: peacefully reintegrate a loyal mature march directly into the crown domain, or confirm autonomous march charters in exchange for permanent scaling federation bonuses."
 oe_tom_dec_reintegrate_march.a:0 "Direct Rule: Peacefully Reintegrate a Loyal Ordensmark"
 oe_tom_dec_reintegrate_march.b:0 "Feudal Autonomy: Confirm Permanent Ordensmark Federation Charters"
 oe_tom_dec_reintegrate_march_req_tt:0 "At least one AI-controlled Teutonic Ordensmark has Liberty Desire below #Y 30#!."
 oe_tom_dec_reintegrate_march_a_tt:0 "Peacefully annexes our largest loyal AI Teutonic Ordensmark (Liberty Desire < 30), grants a core on its capital, and applies a #Y 15#!-year Direct Crown Reintegration modifier."
 oe_tom_dec_reintegrate_march_b_tt:0 "Preserves autonomous marches, reduces every Ordensmark's Liberty Desire by #G -15#!, and activates the permanent #Y Autonomous Ordensmark Federation#! bonus scaling at 1+, 3+, and 5+ marches."
 oe_sit_northern_crusade:0 "The Northern Crusade & Baltic Holy War"
 oe_sit_northern_crusade_desc:0 "Across the forests, rivers, and brick citadels of the eastern Baltic, the Teutonic and Livonian Orders clash with Lithuania and Poland over Samogitia, Ostsiedlung settlement, and the fate of Eastern Europe. Will Marienburg forge an eastern crusader hegemony, or will a Polish-Lithuanian union break the Black Cross?"
 oe_sit_northern_crusade_outcome_order:0 "Teutonic Eastern Ascendancy"
 oe_sit_northern_crusade_outcome_order_desc:0 "Baltic Crusade Momentum reaches 80 (after 24 months) or the Teutonic Order commands Vilnius, Warsaw, and at least two active Ordensmarks."
 oe_sit_northern_crusade_outcome_plu:0 "Polish-Lithuanian Triumph"
 oe_sit_northern_crusade_outcome_plu_desc:0 "The Teutonic Order falls, Crusade Momentum collapses to 15 or below, or the Commonwealth seizes Marienburg."
 oe_sit_northern_crusade_outcome_settlement:0 "Baltic Frontier Equilibrium"
 oe_sit_northern_crusade_outcome_settlement_desc:0 "By 1525 without a knockout blow by either side, the Baltic crusade hardens into an enduring regional balance of power."
