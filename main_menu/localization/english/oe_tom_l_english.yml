 OE_TOM_SIT_LEGEND_DESC:0 "Country color: Teutonic Order core domain; Green: Chartered Teutonic Ordensmarks & Livonian allies; Red: Poland-Lithuania & opposing coalition; Amber: Rus', Nordic, and imperial neighbors watching the Baltic balance."
