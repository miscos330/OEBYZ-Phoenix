 oe_msn_56_teu:0 "#bold #color_yellow Teutonic Order: Eastward Enfeoffment & Black Cross Crusade#!#!"
 oe_msn_56_teu_DESCRIPTION:0 "From Marienburg, Livland, and Samogitia across Poland, Novgorod, Kyiv, Moscow, and Crimea to the Black Cross & Double-Headed Eagle climax"
 oe_msn_56_teu_CRITERIA_DESCRIPTION:0 "Consolidate Livland and the Samogitian corridor, reverse Tannenberg, build Marienburg's brick-gothic statecraft, charter eastern Ordensmarks to Novgorod, Kyiv, Moscow, and Crimea, and proclaim the Eternal Gross-Ordensstaat."
 oe_msn_56_teu_BUTTON_TOOLTIP:0 "Embark on the Teutonic Eastward Enfeoffment Destiny"
 oe_msn_56_teu_BUTTON_DETAILS:0 "A sixteen-task four-branch flagship tree for the Teutonic Order (and Livonian Order if it inherits the chapter): crush Baltic rivals and reverse Tannenberg; expand Kulm Law, Marienburg, and the Golden Bull of Rimini; enfeoff knightly marches across Vistula, Novgorod, Kyiv, and Moscow; and reach the Black Sea to meet Byzantium."
 oe_tom.8.title:0 "1242 Battle on the Ice Avenged"
 oe_tom.8.desc:0 "More than a century ago, the cracked ice of Lake Peipus claimed the armored brothers of the Order before Alexander Nevsky's druzhina. Today our warhorses stand triumphant across Pskov and Lord Novgorod the Great, bells tolling in St. Sophia as black-and-white banners flutter above the Volkhov."
 oe_tom.8.a:0 "Raise the Chudskoye Victory Pillar and drill winter knights"
 oe_tom.8.b:0 "Charter the Baltic-Novgorod Fur and Amber Hansa"
 oe_tom.9.title:0 "Tannenberg Reversed: Triumph of the Black Cross"
 oe_tom.9.desc:0 "Rival chroniclers whispered that the combined armies of Poland and Lithuania would one day crush the Order upon the Prussian border. Instead, our disciplined lances and brick citadels have shattered their coalition, bringing both Vilnius and the Polish heartland under Marienburg's shadow."
 oe_tom.9.a:0 "Proclaim the Grand Master's Eastern Triumph"
 oe_tom.9.b:0 "Enact the Perpetual Peace of Marienburg and bind our marches"
 oe_tom.10.title:0 "Black Cross and Double-Headed Eagle"
 oe_tom.10.desc:0 "From the fortified towers of Kaffa and Crimea, Teutonic galleys now gaze south across the Black Sea toward the dome of Hagia Sophia. Envoys from Constantinople await our word: shall the Black Cross of Marienburg join the Double-Headed Eagle in a grand Eurasian Christian Holy Alliance against steppe khans and Anatolian sultans, or demand Latin Papal Primacy at sword's point?"
 oe_tom.10.a:0 "Proclaim the Eurasian Christian Holy Alliance with Byzantium"
 oe_tom.10.b:0 "Demand Papal Primacy and prepare the march on Constantinople"
 oe_tom.11.title:0 "Envoys of the Black Cross: A Eurasian Holy Alliance"
 oe_tom.11.desc:0 "Knights wearing white mantles marked with the Black Cross have arrived from Crimea bearing the Grand Master's golden seal. Having forged a chain of eastern marches from the Baltic to the Euxine, they propose a solemn Eurasian Christian Holy Alliance with New Rome to shield Christendom from both steppe and sultan."
 oe_tom.11.a:0 "Seal the Pact of the Black Cross and Double-Headed Eagle"
 oe_tom.11.b:0 "Open Euxine trade charters while guarding Orthodox autonomy"
 oe_tom.12.title:0 "Ultimatum from the North: The Black Cross Demands Submission"
 oe_tom.12.desc:0 "Flushed with conquest from Prussia to Crimea, the Teutonic Grand Master has dispatched heralds to the Golden Horn demanding recognition of Roman Papal Primacy over the Eastern Church. Memories of 1204 stir fierce indignation across Constantinople's streets and barracks."
 oe_tom.12.a:0 "Defy the northern knights behind the Theodosian Walls"
 oe_tom.12.b:0 "Cool tensions with a pragmatic Black Sea commercial truce"
 oe_tom.13.title:0 "Ordensburg Frontier Settlement and Brick Citadel Milestone"
 oe_tom.13.desc:0 "Across our chartered eastern Ordensmarks, river barges unload fired brick, lime mortar, and wagon trains of German colonists and parish priests. Each new castle-town deepens our hold on the eastern plain—how shall the Grand Master direct this five-year frontier investment?"
 oe_tom.13.a:0 "Subsidize brick Ordensburg citadels and frontier capitals"
 oe_tom.13.b:0 "Sponsor Ostsiedlung settlers and Catholic missions across all marches"
 oe_tom.14.title:0 "Verdict of the Northern Crusade"
 oe_tom.14.desc:0 "After decades of winter campaigns, brick fortress sieges, and diplomacy across Prussia, Livonia, Lithuania, and Poland, the great Baltic struggle reaches its historic verdict. The banners of the victors now set the law of the northern plain."
 oe_tom.14.a:0 "Uphold the martial legacy of the Northern Crusade"
 oe_tom.14.b:0 "Turn hard-won borders into lasting Baltic commerce"
 OE_TOM_MARCH_LIVLAND:0 "Grand Bailiwick of Livland"
 OE_TOM_MARCH_LIVLAND_ADJ:0 "Livonian-Teutonic"
 oe_tom_dec_enfeoff_livland.title:0 "Tier 1 Enfeoffment: Charter Grand Bailiwick of Livland"
 oe_tom_dec_enfeoff_livland.desc:0 "Invest a loyal Teutonic Ordensmark over our conquered non-capital territories in Livonia, Estonia, and Courland (never ceding our capital or Prussia). The new march shares our map color, joins every war, pays a modest knightly tithe, and adopts the Ordensmark Fortress Charter."
 oe_tom_dec_enfeoff_livland.a:0 "Grant the Charter of Livland"
 oe_tom_dec_enfeoff_livland_req_tt:0 "Either Livonian Order is our subject, OR we own at least #Y 3#! non-capital locations in Livonia, Estonia, and Courland (outside Prussia)."
 oe_tom_dec_enfeoff_livland_tt:0 "Consolidates Livonia and any subject Baltic bishoprics (Riga, Courland, Ösel-Wiek, Dorpat) into a unified #Y Teutonic Ordensmark#! seated at Riga or Pärnu, then opens the Charter Ceremony."
 oe_tom.1.title:0 "Charter Ceremony: Grand Bailiwick of Livland"
 oe_tom.1.desc:0 "Before the high altar of Marienburg, the newly appointed Landmeister of Grand Bailiwick of Livland kneels to receive the Black Cross banner and iron seal over Livonia, Estonia, and Courland. Shall this Ordensmark be organized primarily as a martial bastion of steel cavalry, or as a Kulm-law haven for Ostsiedlung settlers and Catholic missions?"
 oe_tom.1.a:0 "Charter Livland as a Military-Knightly March"
 oe_tom.1.b:0 "Charter Livland as a Settler-Missionary March"
