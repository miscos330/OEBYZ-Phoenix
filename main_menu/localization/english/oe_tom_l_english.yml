l_english:
 # NEW 2026-11-24 v26.0 WP12 Teutonic Order Historical Overhaul — English Localization (100% EN/ZH parity) (oe_tom_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v220_teu_east_enfeoff.py; edit the generator, not this file.
 oe_teu_ordensmark:0 "Teutonic Ordensmark"
 oe_teu_ordensmark_desc:0 "A bounded landed frontier march chartered by the Teutonic Order across the eastern Baltic rim (hard-capped at 4 marches: M1-M4). Carrying real diplomatic capacity (0.60) and relative-strength weight (-0.20), an Ordensmark tolerates native frontier cultures, supports heathen missionary work, and joins offensive campaigns only while loyal and free of Papal Censure."
 LEAD_oe_teu_ordensmark:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_teu_ordensmark:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_teu_ordensmark_subject_opinion:0 "Grand Master's Overlordship"
 oe_teu_ordensmark_overlord_opinion:0 "Teutonic Ordensmark"
 OE_TOM_DUCHY_COURLAND:0 "Duchy of Courland and Livonia"
 OE_TOM_DUCHY_COURLAND_ADJ:0 "Courlandian"
 oe_tom_ordensmark_reform:0 "Ordensmark Frontier Fortress Charter"
 oe_tom_ordensmark_reform_desc:0 "Exclusive to chartered Teutonic Ordensmarks: organizes brick Ordensburg fortresses, frontier heavy horse, and heathen mission parishes without imposing rapid cultural assimilation."
 oe_tom_op_enfeoffed:0 "Chartered as Teutonic Ordensmark"
 oe_tom_op_circuit:0 "Grand Master's Eastern Circuit"
 oe_tom_op_byz_holy_alliance:0 "Black Cross & Double-Headed Eagle Pact"
 oe_tom_op_byz_papal_demand:0 "Demanded Papal Primacy"
 oe_tom_op_papal_censure:0 "Censured at Constance for Attacking Catholics"
 oe_tom_op_secularization_outrage:0 "Outrage Over 1525 Secularization of Prussia"
 oe_tom_op_warmia_concord:0 "Confirmed Warmian Ecclesiastical Autonomy"
 oe_tom_op_warmia_annexed:0 "Forcibly Incorporated Bishopric of Warmia"
 oe_tom_op_krewo_friction:0 "Post-Krewo Frontier Encroachment"
 oe_tom_dec_transfer_frontier_land.title:0 "Transfer Conquered Border Tiles to Ordensmark"
 oe_tom_dec_transfer_frontier_land.desc:0 "Hand over newly conquered non-core border tiles inside an active M1-M4 Ordensmark's historical boundary to that march. Grants no free cores, adding #G +25%#! integration progress and #G -3#! liberty desire."
 oe_tom_dec_transfer_frontier_land.a:0 "Assign New Border Holdings to the March"
 oe_tom_dec_transfer_frontier_land_tt:0 "Transfers owned non-core holdings within active M1-M4 march zones to their matching Ordensmarks with +25% integration progress (2-year cooldown)."
 oe_tom_dec_reintegrate_march.title:0 "Targeted Ordensmark Integration vs. March Autonomy"
 oe_tom_dec_reintegrate_march.desc:0 "Convene the Marienburg Chapter to choose a specific mature, loyal Ordensmark (established 25+ years, Liberty Desire < 25, <= 35 tiles) for targeted reintegration at the cost of #R 200 gold#!, #R 20 prestige#!, and #R +15 Liberty Desire#! across remaining marches—or reaffirm autonomous march charters."
 oe_tom_dec_reintegrate_march.a:0 "Convene the Chapter Debate on March Governance"
 oe_tom_dec_reintegrate_march_req_tt:0 "At least one AI Ordensmark is mature (25+ years), loyal (LD < 25), and <= 35 tiles—or March Autonomy has not yet been confirmed."
 oe_tom_dec_reintegrate_march_a_tt:0 "Opens the targeted March Reintegration picker event (M1/M2/M3/M4 or Confirm Autonomy; 5-year cooldown)."
 oe_tom_dec_grand_master_circuit.title:0 "Grand Master's Eastern Circuit & Inspection"
 oe_tom_dec_grand_master_circuit.desc:0 "Lead an 8-year inspection circuit across our bounded eastern marches, spending #R 150 gold#! and #R 10 prestige#! to reduce Liberty Desire by #G -8#!, improve opinion, and encourage heathen missions without forcing cultural erasure."
 oe_tom_dec_grand_master_circuit.a:0 "Inspect the Eastern Ordensmarks"
 oe_tom_dec_grand_master_circuit_tt:0 "All active Ordensmarks lose #G 8#! Liberty Desire, gain #G +25#! opinion, and receive a 5-year heathen mission & loyalty modifier (8-year cooldown)."
 oe_tom_dec_levy_ordensmark_host.title:0 "Levy the Eastern Ordensmark Host"
 oe_tom_dec_levy_ordensmark_host.desc:0 "Muster heavy cavalry banners from our active eastern marches for #Y 5 years#!, scaling across #Y 1-2#! and #Y 3-4#! active marches at elevated military upkeep."
 oe_tom_dec_levy_ordensmark_host.a:0 "Muster the Frontier Banners"
 oe_tom_dec_levy_ordensmark_host_tt:0 "Grants a 5-year heavy cavalry & morale muster (1-2 Vanguard or 3-4 Grand Muster) with higher military maintenance (6-year cooldown)."
 oe_teu_dec_buy_estonia.title:0 "Negotiate the 1346 Purchase of Danish Estonia"
 oe_teu_dec_buy_estonia.desc:0 "Following the unrest in Danish Estonia, offer the King of Denmark #Y 280 gold#! to purchase Tallinn, Narva, and the Duchy of Estonia—handing the province to our Livonian branch (or directly to the Order) just as historically concluded in 1346."
 oe_teu_dec_buy_estonia.a:0 "Dispatch Silver Envoys to Copenhagen"
 oe_teu_dec_buy_estonia_tt:0 "Sends a formal 280-gold purchase offer to Denmark for all Danish-held locations in Estonia (transferred to Livonia if our subject, otherwise to us)."
 oe_teu_dec_prussian_bishoprics_concordat.title:0 "Concordat of the Four Prussian Bishoprics"
 oe_teu_dec_prussian_bishoprics_concordat.desc:0 "Negotiate a formal ecclesiastical concordat with our loyal Prussian bishopric vassals—Sambia (SMD), Pomesania (PMS), Kulm (CHL), and autonomous Warmia (ERM)—peacefully integrating compliant dioceses or confirming Warmia's historic charter."
 oe_teu_dec_prussian_bishoprics_concordat.a:0 "Convene the Prussian Episcopal Synod"
 oe_teu_dec_prussian_bishoprics_concordat_req_tt:0 "At least one Prussian bishopric (SMD/PMS/CHL/ERM) is our AI subject with Liberty Desire < 35 and Opinion >= 120."
 oe_teu_dec_prussian_bishoprics_concordat_tt:0 "Opens the Prussian Bishoprics Concordat event (10-year cooldown): integrate one loyal see or confirm Warmian autonomy."
 oe_teu_dec_livonian_confederation_diplomacy.title:0 "Papal Mediation in the Livonian Confederation"
 oe_teu_dec_livonian_confederation_diplomacy.desc:0 "Instead of tearing apart the Livonian Confederation overnight, work through papal legates and regional diets to incorporate ONE compliant northern see (Courland, Ösel-Wiek, Dorpat, Riga Archbishopric, or Riga City) into Livonia every #Y 12 years#!, or reaffirm the federal compact."
 oe_teu_dec_livonian_confederation_diplomacy.a:0 "Petition Papal Legates for Livonian Mediation"
 oe_teu_dec_livonian_confederation_diplomacy_tt:0 "Opens the staged Livonian Confederation event (12-year cooldown): integrate ONE compliant minor into LIV or strengthen federal loyalty."
 oe_teu_dec_1525_reformation_crossroads.title:0 "1525 Crossroads: Secularization or Catholic Ordensstaat"
 oe_teu_dec_1525_reformation_crossroads.desc:0 "With Reformation doctrines sweeping Prussia's ports, decide the destiny of the Teutonic Order: secularize cleanly into Lutheran Ducal Prussia (unblocking religious conversion, forming PRU, dissolving HRE Bailiwicks, and unlocking the Prussian Destiny mission tree) OR forge a Counter-Reformation Catholic Baltic Ordensstaat."
 oe_teu_dec_1525_reformation_crossroads.a:0 "Decide the Fate of the Order"
 oe_teu_dec_1525_reformation_crossroads_tt:0 "Triggers the 1525 Dual Endgame event: Secularize into PRU (with Courland-Livonia choice) OR uphold the Counter-Reformation Baltic Ordensstaat."
 oe_sit_northern_crusade:0 "The Northern Crusade & Baltic Reckoning"
 oe_sit_northern_crusade_desc:0 "Across the brick citadels of Prussia, the autonomous sees of Livonia, and the forests of Samogitia, the Teutonic Order confronts Lithuania and Poland. Lithuania's baptism at Krewo shatters the pagan-crusade mandate, while Hanseatic burghers challenge Marienburg's monopolies—driving the Baltic toward Polish-Lithuanian containment, Teutonic breakthrough, or 1525 secularization."
 oe_sit_northern_crusade_outcome_order:0 "Teutonic Baltic Ascendancy"
 oe_sit_northern_crusade_outcome_order_desc:0 "Baltic Crusade Momentum reaches 80 (after 24 months) or the Teutonic Order commands Vilnius, Płock, and at least two active bounded Ordensmarks."
 oe_sit_northern_crusade_outcome_plu:0 "Polish-Lithuanian Triumph"
 oe_sit_northern_crusade_outcome_plu_desc:0 "Both Baltic Orders fall without Prussian secularization, Crusade Momentum collapses to 15 or below, or the Commonwealth seizes Malbork."
 oe_sit_northern_crusade_outcome_settlement:0 "Baltic New Order & 1525 Settlement"
 oe_sit_northern_crusade_outcome_settlement_desc:0 "The Teutonic Order secularizes into Ducal Prussia (PRU) OR the Baltic struggle reaches 1525 without a knockout blow, locking in an enduring regional balance."
 OE_TOM_SIT_TITLE:0 "Northern Crusade Momentum & Baltic Crises"
 OE_TOM_SIT_MOM_L:0 "Polish-Lithuanian Bulwark (15)"
 OE_TOM_SIT_MOM_R:0 "Teutonic Ascendancy (80)"
 OE_TOM_SIT_MOM_FOOT:0 "Tracks Prussia, Tallinn, Riga, Samogitia, Vilnius, Płock, active M1-M4 marches, Krewo legitimacy loss (-12), and Prussian Bund unrest (-8). Secularizing into PRU settles peacefully."
 OE_TOM_SIT_PHASE_KPI:0 "Crusade Stage"
 OE_TOM_SIT_MARCHES_KPI:0 "Eastern Marches"
 OE_TOM_SIT_BUND_KPI:0 "Prussian Bund Tension"
