 oe_msn_teu_a1_break_lithuanian_raid:0 "Break the Lithuanian Raid"
 oe_msn_teu_a1_break_lithuanian_raid_desc:0 "Along the misty Nemunas frontier, Lithuanian warbands probe our timber watchtowers every winter. Securing our Prussian [fort|e] line and hardening crusader [army_tradition|e] launches the decisive Baltic counteroffensive."
 oe_msn_teu_a1_break_lithuanian_raid_req_tt:0 "Own or have subjects own Malbork or Pärnu, maintain 5 Stability, and reach 12 Army Tradition or hold a Castle."
 oe_msn_teu_a2_consolidate_livland:0 "Consolidate Livland"
 oe_msn_teu_a2_consolidate_livland_desc:0 "By welding Riga, Pärnu, Courland, and the northern bishoprics under one Livonian Ordensmark banner, the Order replaces quarrelsome prelates with an unbroken northern Baltic bastion of [control|e] and [trade|e]."
 oe_msn_teu_a2_consolidate_livland_req_tt:0 "Own or have subjects own Riga and Pärnu, and either charter Livland (Tier 1) or hold 8 Stability."
 oe_msn_teu_a3_samogitian_corridor:0 "Master of the Samogitian Corridor"
 oe_msn_teu_a3_samogitian_corridor_desc:0 "For a century Samogitia severed Prussia from Livonia like a pagan wedge. Securing Memel and the Nemunas crossings unites both wings of the Order into one continuous Baltic [core|e] corridor."
 oe_msn_teu_a3_samogitian_corridor_req_tt:0 "Own or have subjects own Memel plus Raseiniai, Šiauliai, Palanga, or Kaunas."
 oe_msn_teu_a4_reverse_of_tannenberg:0 "Reverse of Tannenberg"
 oe_msn_teu_a4_reverse_of_tannenberg_desc:0 "Where history foretold disaster on the fields of Grunwald, our steel lances shatter the Polish-Lithuanian coalition instead. Subduing Vilnius and the Vistula plain crowns the Order's unmatched [army|e] hegemony."
 oe_msn_teu_a4_reverse_of_tannenberg_req_tt:0 "Either charter both Litauen-Mark and Weichsel-Mark, OR control Vilnius/Kaunas alongside Warsaw, Kraków, or Poznań."
 oe_msn_teu_b1_kulm_law_prosperity:0 "Kulm Law & Ostsiedlung Prosperity"
 oe_msn_teu_b1_kulm_law_prosperity_desc:0 "The Kulm Charter drew German burghers, timber-wrights, and grain farmers across the Vistula under clear municipal law. Cultivating urban [development|e] and chartered [prosperity|e] funds every eastern campaign."
 oe_msn_teu_b1_kulm_law_prosperity_req_tt:0 "Own or have subjects own Chełmno, Toruń, or Gdańsk, have 8 Stability, and reach 12 Development in our capital."
 oe_msn_teu_b2_marienburg_brick_fortress:0 "Marienburg Brick Citadel"
 oe_msn_teu_b2_marienburg_brick_fortress_desc:0 "Rising in fired red brick above the Nogat river, Marienburg stands as the mightiest gothic [fort|e] in Christendom—treasury vault, Grand Master's palace, and blueprint for every eastern Ordensburg."
 oe_msn_teu_b2_marienburg_brick_fortress_req_tt:0 "Own or have subjects own Malbork, hold 180 Gold, and maintain a Castle, Order Stronghold, or Bastion."
 oe_msn_teu_b3_imperial_bailiwicks:0 "Imperial Bailiwick Network"
 oe_msn_teu_b3_imperial_bailiwicks_desc:0 "From Coblenz and Franconia to Vienna and Bohemia, the Order's German bailiwicks channel recruits, silver, and diplomatic leverage into Prussia, reinforcing [crown_power|e] and clerical [estate_satisfaction|e]."
 oe_msn_teu_b3_imperial_bailiwicks_req_tt:0 "Reach the Age of Renaissance, maintain 12 Stability and 20 Prestige, and hold a Monastery, Order Commandery, or University (or 55% Clergy satisfaction)."
 oe_msn_teu_b4_reichsschild_or_rimini:0 "Reichsschild & Golden Bull of Rimini"
 oe_msn_teu_b4_reichsschild_or_rimini_desc:0 "Invoking Emperor Frederick II's Golden Bull of Rimini, our sovereign Order stands equal to imperial electors—whether remaining a martial monastic state or transforming into an Ordensstaat crown with enduring [legitimacy|e] over all [subjects|e]."
 oe_msn_teu_b4_reichsschild_or_rimini_req_tt:0 "Reach the Age of Discovery, have 15 Stability, and control 45 locations (directly or via subjects) or maintain 2 active Ordensmarks."
 oe_msn_teu_c1_vistula_granary_march:0 "Vistula Granary March"
 oe_msn_teu_c1_vistula_granary_march_desc:0 "Linking Gdańsk's Hanseatic grain wharves to the broad fertile plains of Mazovia and Greater Poland places Northern Europe's richest harvest [market|e] firmly beneath the Black Cross."
 oe_msn_teu_c1_vistula_granary_march_req_tt:0 "Own or have subjects own Gdańsk, and either charter Weichsel-Mark (Tier 3) or control Warsaw or Poznań."
 oe_msn_teu_c2_avenge_lake_peipus:0 "Avenge Lake Peipus"
 oe_msn_teu_c2_avenge_lake_peipus_desc:0 "In 1242 the ice of Lake Peipus swallowed the brothers' charge. Planting our banners over Pskov and Lord Novgorod the Great erases that ancient stain and commands the northern fur [trade|e]."
 oe_msn_teu_c2_avenge_lake_peipus_req_tt:0 "Charter Newa-Nowgorod (Tier 4), or own/have subjects own both Novgorod and Pskov."
 oe_msn_teu_c3_dnieper_frontier_kiev:0 "Dnieper Frontier of Kyiv"
 oe_msn_teu_c3_dnieper_frontier_kiev_desc:0 "Marching south from Smolensk along the great river road to Kyiv opens the historic Varangian highway to the Black Sea, anchoring our eastern [control|e] across the forests and black-earth steppes."
 oe_msn_teu_c3_dnieper_frontier_kiev_req_tt:0 "Charter Ruthenien-Mark (Tier 5), or own/have subjects own Kyiv alongside Smolensk or Minsk."
 oe_msn_teu_c4_cross_over_moscow_volga:0 "Cross Over Moscow & the Volga"
 oe_msn_teu_c4_cross_over_moscow_volga_desc:0 "Reaching the white walls of Moscow and the Oka-Volga confluence at Nizhny Novgorod carries the Teutonic crusade to the heart of the Russian plain, projecting unrivaled [manpower|e] and [prestige|e] eastward."
 oe_msn_teu_c4_cross_over_moscow_volga_req_tt:0 "Charter Moskau-Wolga (Tier 6), or own/have subjects own Moscow alongside Nizhny Novgorod, Vladimir, or Tver."
 oe_msn_teu_d1_black_sea_pontus_march:0 "Black Sea Pontus-Krim March"
 oe_msn_teu_d1_black_sea_pontus_march_desc:0 "When black-and-white surcoats water their warhorses in the warm surf of Kaffa and Crimea, the Teutonic Order achieves a two-sea dominion stretching from the Baltic ice to the Crimean [market|e]."
 oe_msn_teu_d1_black_sea_pontus_march_req_tt:0 "Charter Pontus-Krim (Tier 7), or own/have subjects own Kaffa, Solkhat, or Qirq-Yer."
 oe_msn_teu_d2_baltic_black_sea_road:0 "Baltic-Black Sea Amber & Fur Road"
 oe_msn_teu_d2_baltic_black_sea_road_desc:0 "Prussian amber, Novgorodian sable, and Ukrainian wheat flow southward to meet Silk Road spices and Pontic wine at Kaffa, weaving an unbroken trans-continental [trade|e] artery guarded by Ordensburg forts."
 oe_msn_teu_d2_baltic_black_sea_road_req_tt:0 "Control Gdańsk or Riga alongside Kaffa, Solkhat, or Tana, and earn 30 monthly trade/tax income (or hold a Marketplace)."
 oe_msn_teu_d3_black_cross_double_eagle:0 "Black Cross & Double-Headed Eagle"
 oe_msn_teu_d3_black_cross_double_eagle_desc:0 "Across the Euxine waters, the northern Knights of Marienburg meet the ancient Roman throne of Constantinople. Whether sealed in a Eurasian Christian alliance or decided by the sword, our [prestige|e] reshapes Christendom."
 oe_msn_teu_d3_black_cross_double_eagle_req_tt:0 "Establish the Pontus-Krim Black Sea presence and resolve the Black Cross & Double-Headed Eagle encounter (or hold Constantinople / see Byzantium fallen)."
 oe_msn_teu_d4_eternal_gross_ordensstaat:0 "Eternal Gross-Ordensstaat"
 oe_msn_teu_d4_eternal_gross_ordensstaat_desc:0 "From Marienburg and Riga to Kyiv, Moscow, and the Crimean shore, a constellation of loyal Ordensmarks shields Christendom's eastern horizon. Brick citadels, iron discipline, and sovereign [crown_power|e] endure for generations."
 oe_msn_teu_d4_eternal_gross_ordensstaat_req_tt:0 "Have 18 Stability, establish the Black Sea anchor, control Malbork, Riga, Kyiv, and Moscow or Novgorod, and hold 90 locations (with subjects) or 4 active Ordensmarks."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_charter:0 "Chartered Ordensmark Foundation"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_charter:0 "Fresh brick commanderies, frontier tax exemptions, and loyal Teutonic garrisons stabilize a newly chartered eastern march."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_military:0 "Military-Knightly Ordensmark"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_military:0 "Chartered as an iron shield along the eastern steppe, this Ordensmark pours tithes into heavy chargers, brick keep bastions, and siege trains."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_settler:0 "Settler-Missionary Ordensmark"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_settler:0 "Chartered under Kulm law to settle German burghers and Catholic parishes across the eastern marches, driving rapid conversion and urban prosperity."
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_overlord:0 "Grand Master's Eastern Circuit"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_overlord:0 "The Grand Master's personal inspection across the eastern Ordensmarks cements vassal obedience and imperial prestige."
 STATIC_MODIFIER_NAME_oe_tom_mod_circuit_march:0 "Invested by the Grand Master"
 STATIC_MODIFIER_DESC_oe_tom_mod_circuit_march:0 "Bearing fresh banners blessed by the Grand Master, local commanders accelerate Catholic conversion and Ostsiedlung town charters."
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier1:0 "Eastern Ordensmark Host (Vanguard)"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier1:0 "Knightly banners from our eastern marches ride beneath the Black Cross, strengthening cavalry shock and field morale."
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier2:0 "Eastern Ordensmark Host (Grand Crusade)"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier2:0 "Three or more eastern Ordensmarks answer the Grand Master's war horn in unison, fielding formidable steel cavalry and disciplined siege engines."
 STATIC_MODIFIER_NAME_oe_tom_mod_levy_tier3:0 "Eastern Ordensmark Host (Continental Levy)"
 STATIC_MODIFIER_DESC_oe_tom_mod_levy_tier3:0 "Five or more great marches from the Baltic to the Volga and Crimea unite in one unstoppable crusading host."
 STATIC_MODIFIER_NAME_oe_tom_mod_march_mobilized:0 "Ordensmark War Muster"
 STATIC_MODIFIER_DESC_oe_tom_mod_march_mobilized:0 "Commanderies across the march open their armories and grain stores to sustain the Grand Master's campaign."
 STATIC_MODIFIER_NAME_oe_tom_mod_direct_rule:0 "Direct Crown Reintegration"
 STATIC_MODIFIER_DESC_oe_tom_mod_direct_rule:0 "Absorbing a mature Ordensmark directly into the Grand Master's domain tightens centralized control and fiscal extraction."
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_1:0 "Autonomous Ordensmark Federation (I)"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_1:0 "Honoring feudal march autonomy rewards the Order with steady knightly tithes, road tolls, and unwavering border loyalty."
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_2:0 "Autonomous Ordensmark Federation (II)"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_2:0 "A chain of three or more autonomous Ordensmarks binds Eastern Europe into a prosperous feudal network under Marienburg."
 STATIC_MODIFIER_NAME_oe_tom_mod_feudal_network_3:0 "Autonomous Ordensmark Federation (III)"
 STATIC_MODIFIER_DESC_oe_tom_mod_feudal_network_3:0 "Five or more autonomous Ordensmarks span Eurasia from the Baltic to the Black Sea, sustaining the Grand Master's imperial hegemony."
 STATIC_MODIFIER_NAME_oe_tom_mod_peipus_avenged_a:0 "Vengeance of Lake Peipus"
 STATIC_MODIFIER_DESC_oe_tom_mod_peipus_avenged_a:0 "Having avenged the 1242 defeat on the ice, our winter columns march across northern lakes and forests without fear."
 STATIC_MODIFIER_NAME_oe_tom_mod_peipus_avenged_b:0 "Baltic-Novgorod Fur & Amber Hansa"
 STATIC_MODIFIER_DESC_oe_tom_mod_peipus_avenged_b:0 "Teutonic trade houses in Novgorod, Pskov, and Riga monopolize northern sable, beeswax, and Baltic amber shipments."
 STATIC_MODIFIER_NAME_oe_tom_mod_tannenberg_reversed_a:0 "Triumph of the Black Cross"
 STATIC_MODIFIER_DESC_oe_tom_mod_tannenberg_reversed_a:0 "The memory of Grunwald rewritten in Teutonic victory inspires awe across every court from the Rhine to the Dnieper."
 STATIC_MODIFIER_NAME_oe_tom_mod_tannenberg_reversed_b:0 "Perpetual Peace of Marienburg"
 STATIC_MODIFIER_DESC_oe_tom_mod_tannenberg_reversed_b:0 "Broken rivals swear perpetual peace before the Grand Master's chapter, filling Marienburg's coffers and calming every border march."
 STATIC_MODIFIER_NAME_oe_tom_mod_papal_primacy_march:0 "Crusade for Papal Primacy"
 STATIC_MODIFIER_DESC_oe_tom_mod_papal_primacy_march:0 "Declaring universal Latin obedience over the Bosporus fires crusader zeal and hardens siege columns bound for Thrace."
 STATIC_MODIFIER_NAME_oe_tom_mod_black_cross_eagle_teu:0 "Black Cross & Double-Headed Eagle Pact"
 STATIC_MODIFIER_DESC_oe_tom_mod_black_cross_eagle_teu:0 "Standing shoulder to shoulder with Constantinople from the Baltic to the Bosporus, the Teutonic Order guards the northern flank of Christendom."
 STATIC_MODIFIER_NAME_oe_tom_mod_black_cross_eagle_byz:0 "Eurasian Christian Holy Alliance"
 STATIC_MODIFIER_DESC_oe_tom_mod_black_cross_eagle_byz:0 "Teutonic knights on the Crimean shore shield the northern Euxine approaches, freeing New Rome to confront Anatolia and the steppe."
 STATIC_MODIFIER_NAME_oe_tom_mod_euxine_accord:0 "Euxine Commercial Accord"
 STATIC_MODIFIER_DESC_oe_tom_mod_euxine_accord:0 "Mutual port charters linking Kaffa, Tana, and Constantinople open lucrative Baltic-to-Mediterranean trade lanes."
 STATIC_MODIFIER_NAME_oe_tom_mod_byz_defiance:0 "Defiance of the Theodosian Walls"
 STATIC_MODIFIER_DESC_oe_tom_mod_byz_defiance:0 "Refusing northern Latin demands of submission, New Rome rallies Orthodox garrisons and imperial pride along the Straits."
 STATIC_MODIFIER_NAME_oe_tom_mod_brick_ordensburg:0 "Brick Ordensburg Citadel Program"
 STATIC_MODIFIER_DESC_oe_tom_mod_brick_ordensburg:0 "Master bricklayers from Marienburg raise moated keep-fortresses across our eastern marches at reduced upkeep."
 STATIC_MODIFIER_NAME_oe_tom_mod_ostsiedlung_wave:0 "Ostsiedlung Settler & Parish Wave"
 STATIC_MODIFIER_DESC_oe_tom_mod_ostsiedlung_wave:0 "Fresh convoys of German farmers, craftsmen, and parish priests settle around frontier commanderies."
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_order_victory:0 "Teutonic Baltic Ascendancy"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_order_victory:0 "Emerging victorious from the Northern Crusade, the Teutonic Order commands the Baltic coast and eastern plains without rival."
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_pl_victory:0 "Polish-Lithuanian Baltic Triumph"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_pl_victory:0 "Having checked the Teutonic drive, Poland and Lithuania stand united as the dominant shield of Central and Eastern Europe."
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_crusade_legacy:0 "Legacy of the Northern Crusade"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_crusade_legacy:0 "Generations of frontier warfare have forged an indomitable martial tradition across the Baltic marches."
 STATIC_MODIFIER_NAME_oe_tom_mod_sit_baltic_peace:0 "Baltic Frontier Equilibrium"
 STATIC_MODIFIER_DESC_oe_tom_mod_sit_baltic_peace:0 "Settled borders along the Vistula and Nemunas usher in thriving Hanseatic commerce and diplomatic stability."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_samogitia:0 "United Prussia-Livonia Corridor"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_samogitia:0 "Secure overland highways through Samogitia bind Marienburg and Riga into a single strategic theater."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_tannenberg:0 "Heirs of the Reversed Tannenberg"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_tannenberg:0 "Victory over the combined hosts of Poland and Lithuania seals the legend of Teutonic heavy lancers."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_marienburg:0 "Crown Jewel of Brick Gothic"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_marienburg:0 "Marienburg's vaulted halls and outer curtain walls set the gold standard for Teutonic fortification engineering."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_bailiwicks:0 "Imperial Bailiwick Subsidies"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_bailiwicks:0 "German commanderies remit silver, scholars, and noble volunteers faithfully to the Grand Master's chapter."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_rimini:0 "Sovereign Seal of Rimini"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_rimini:0 "Confirmed by imperial bull and battlefield mastery, the Ordensstaat commands sovereign fealty from every march."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_vistula:0 "Vistula Grain Monopoly"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_vistula:0 "Grain barges descending from Mazovia and Greater Poland to Gdańsk keep every garrison and city abundantly fed."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_dnieper:0 "Dnieper Frontier Watch"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_dnieper:0 "Brick redoubts overlooking Kyiv and Smolensk anchor the central bridge between the Baltic and steppe."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_volga:0 "Master of the Volga Marches"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_volga:0 "Carrying the Black Cross past Moscow to the Volga grants immense strategic depth and eastern tribute."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_amber_fur_road:0 "Baltic-Black Sea Amber & Fur Road"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_amber_fur_road:0 "Seamless north-south river and port customs join Baltic amber, northern furs, and Pontic spices into one treasury engine."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_black_cross_eagle:0 "Accord of the Two Crosses & Eagle"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_black_cross_eagle:0 "Reaching the historic crossroads of Constantinople elevates the Teutonic Order into a trans-continental Christian great power."
 STATIC_MODIFIER_NAME_oe_tom_mod_msn_gross_ordensstaat:0 "Eternal Gross-Ordensstaat"
 STATIC_MODIFIER_DESC_oe_tom_mod_msn_gross_ordensstaat:0 "Stretching from Prussia and Livland across Poland, Rus', and Crimea, the Grand Master's federated Ordensstaat stands unrivaled in Eurasian history."
