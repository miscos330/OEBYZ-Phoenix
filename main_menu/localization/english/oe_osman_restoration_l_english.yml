l_english:
 oe_flavor_byz.1002.t: "The Conversion of the House of Osmaris"
 oe_flavor_byz.1002.d: "Three years have passed, and the former ruling family has grown accustomed to the bells of Constantinople. Today they enter the church in Roman dress, receive baptism before its priests, and publicly profess the Orthodox faith. Their children study Greek, while the customs of their household increasingly follow those of the Rhomaioi of Anatolia.\n\nThey ask the Emperor to recognize this change. Their family will henceforth bear the Greek name Osmaris, a name entered among loyal imperial subjects rather than defeated enemies. Baptism has welcomed their souls; whether the court will welcome their house remains our decision."
 oe_flavor_byz.1002.a: "Welcome them. Former enemies may become Roman subjects."
 oe_flavor_byz.1002.a.tt: "Authority: #G +2#!.\n#Y Begin the House of Osmaris event chain#!. All living members of the dynasty follow #Y Orthodoxy#! and adopt #Y Rûm culture#!. Future newborn and scripted historical members follow the same rule."
 oe_flavor_byz.1002.b: "Baptism cannot purchase our trust. Expel them."
 oe_osman_expel.tt: "All living members of the House of Osmaris disappear from play. Any pending conversion is cancelled and this event chain is permanently closed."
 oe_osman_arrived: "The House of Osmaris has arrived in the empire"
 oe_osman_fate_pending: "The fate of the House of Osmaris awaits judgment"
 oe_osman_fate_shown: "The fate of the House of Osmaris has been decided"
 oe_osman_conversion_waiting: "Awaiting the conversion of the House of Osmaris"
 oe_osman_conversion_due: "Three-year supervision of the House of Osmaris"
 oe_osman_conversion_presented: "The House of Osmaris has requested acceptance"
 oe_osman_chain_active: "The House of Osmaris event chain is active"
 oe_osman_expelled: "The House of Osmaris has been permanently expelled"
