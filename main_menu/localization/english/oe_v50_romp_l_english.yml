l_english:
 # Project Phoenix v50.0 Hellenism Deep Overhaul (Main Mod Layer 1, oe_v50_romp_)
 oe_v50_romp_janus_god:0 "Janus Bifrons"
 oe_v50_romp_janus_god.latin_language:0 "Janus Quirinus"
 oe_v50_romp_janus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_janus_god')] gazes at once upon the Mediterranean dawn and the western ocean horizon, presiding over thresholds, imperial transitions, statecraft, diplomacy, and overseas passage."
 oe_v50_romp_janus_god_omen:0 "Bronze keys turn softly within the twin arches of the Forum, swinging open toward peace, passage, and distant sea-lanes as [ShowGodName('oe_v50_romp_janus_god')] blesses every threshold of the realm..."
 oe_v50_romp_omen_janus_twin_horizons:0 "Two-Ocean Thresholds"
 oe_v50_romp_omen_janus_twin_horizons_desc:0 "Facing both East and West, the two-faced god extends imperial sea charts and colonial charters far across open waters."
 oe_v50_romp_omen_janus_portunus_harbors:0 "Guardian of Harbors & Gates"
 oe_v50_romp_omen_janus_portunus_harbors_desc:0 "Sacred vows at every quay and city gate tighten provincial administration and speed maritime customs."
 oe_v50_romp_omen_janus_consular_calends:0 "Calends of Civic Transition"
 oe_v50_romp_omen_janus_consular_calends_desc:0 "Opening the civil year with solemn Janus rites steadies magistrates and accelerates cabinet reform."
 oe_v50_romp_omen_janus_pax_portals:0 "Closed Gates of Peace"
 oe_v50_romp_omen_janus_pax_portals_desc:0 "When the bronze doors of Janus stand bolted in honorable concord, foreign courts trust our word and provinces flourish."
 oe_v50_romp_omen_janus_frontier_passage:0 "Passage of the Pioneers"
 oe_v50_romp_omen_janus_frontier_passage_desc:0 "Caravels and frontier surveyors cross unknown straits with swift winds and steady colonial migration."
 oe_v50_romp_hestia_god:0 "Hestia Prytaneia"
 oe_v50_romp_hestia_god.latin_language:0 "Vesta Mater"
 oe_v50_romp_hestia_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_hestia_god')] tends the undying public hearth of the Prytaneum, from which every new colony carries a live ember. Her quiet grace binds civic harmony, stability, thriving households, and enduring prosperity."
 oe_v50_romp_hestia_god_omen:0 "An unblemished ember lifted from the Prytaneum glows steady as liquid gold, warming council chambers and village hearths alike as [ShowGodName('oe_v50_romp_hestia_god')] watches over the commonwealth..."
 oe_v50_romp_omen_hestia_prytaneum_flame:0 "Flame of the Prytaneum"
 oe_v50_romp_omen_hestia_prytaneum_flame_desc:0 "The unbroken public hearth calms factional turmoil and anchors imperial stability."
 oe_v50_romp_omen_hestia_civic_concord:0 "Concord of the Estates"
 oe_v50_romp_omen_hestia_civic_concord_desc:0 "Every household shares the first libation to Hestia, reconciling nobles, burghers, clergy, and commons."
 oe_v50_romp_omen_hestia_fecund_hearths:0 "Fecund Households"
 oe_v50_romp_omen_hestia_fecund_hearths_desc:0 "Clean hearths and sheltered cradles lift population growth and shield cities from contagion."
 oe_v50_romp_omen_hestia_golden_prosperity:0 "Prosperity of the Polis"
 oe_v50_romp_omen_hestia_golden_prosperity_desc:0 "Protected workshops and thriving marketplaces steadily expand both urban and rural development."
 oe_v50_romp_omen_hestia_sacred_asylum:0 "Sanctuary of the Hearth"
 oe_v50_romp_omen_hestia_sacred_asylum_desc:0 "Citizens defending their ancestral hearth endure siege and hardship without breaking."
 oe_v50_romp_hermes_god:0 "Hermes Thalassios"
 oe_v50_romp_hermes_god.latin_language:0 "Mercurius Pelagius"
 oe_v50_romp_hermes_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_hermes_god')] guides winged sails, clever heralds, oceanic explorers, and merchant syndicates across every sea-lane, turning bold navigation and silver-tongued diplomacy into enduring empire."
 oe_v50_romp_hermes_god_omen:0 "Salt breeze fills the lateen sails and twin serpents gleam upon the herald's bronze caduceus as [ShowGodName('oe_v50_romp_hermes_god')] opens swift passages across sea and court..."
 oe_v50_romp_omen_hermes_winged_caravels:0 "Winged Sails of the Horizon"
 oe_v50_romp_omen_hermes_winged_caravels_desc:0 "Captains blessed by the swift messenger chart distant coastlines and reach far colonial waters ahead of rivals."
 oe_v50_romp_omen_hermes_caduceus_envoys:0 "Envoys of the Caduceus"
 oe_v50_romp_omen_hermes_caduceus_envoys_desc:0 "Eloquent ambassadors bearing Hermes's emblems melt hostility and command respect in every foreign capital."
 oe_v50_romp_omen_hermes_emporion_winds:0 "Winds of the Emporion"
 oe_v50_romp_omen_hermes_emporion_winds_desc:0 "Favorable monsoon and trade-wind passages swell merchant power and maritime cargo returns."
 oe_v50_romp_omen_hermes_silver_scales:0 "Scales of Mercury"
 oe_v50_romp_omen_hermes_silver_scales_desc:0 "Honest weights and insured sea convoys boost state trade income and maritime presence."
 oe_v50_romp_omen_hermes_star_charts:0 "Charts of the Navigator"
 oe_v50_romp_omen_hermes_star_charts_desc:0 "Refined astrolabes and harbor pilotage extend naval reach while sparing ocean fleets from attrition."
 oe_v50_romp_dionysus_god:0 "Dionysus Eleuthereus"
 oe_v50_romp_dionysus_god.latin_language:0 "Liber Pater"
 oe_v50_romp_dionysus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_dionysus_god')] crowns civic theater, fine arts, viticulture, and ecstatic mystery fellowships, dissolving suspicion among diverse peoples so newly integrated provinces embrace Hellenic life with joy."
 oe_v50_romp_dionysus_god_omen:0 "Ivy garlands drape the marble amphitheater as flutes, chorus, and laughter echo through every quarter; [ShowGodName('oe_v50_romp_dionysus_god')] pours the wine of civic joy across the empire..."
 oe_v50_romp_omen_dionysus_great_dionysia:0 "The Great Dionysia"
 oe_v50_romp_omen_dionysus_great_dionysia_desc:0 "Civic tragedies and comedies staged in grand stone theaters elevate imperial prestige and cultural tradition."
 oe_v50_romp_omen_dionysus_muses_atelier:0 "Chorus of Fine Arts"
 oe_v50_romp_omen_dionysus_muses_atelier_desc:0 "Inspired sculptors, dramatists, and musicians flock to imperial patronage."
 oe_v50_romp_omen_dionysus_liber_concord:0 "Ecstatic Concord of Peoples"
 oe_v50_romp_omen_dionysus_liber_concord_desc:0 "The welcoming spirit of Liber Pater softens sectarian divides across heathens and heretics alike."
 oe_v50_romp_omen_dionysus_thyrsus_assimilation:0 "Civic Blending of the Festival"
 oe_v50_romp_omen_dionysus_thyrsus_assimilation_desc:0 "Shared civic festivals draw frontier peoples voluntarily into the Hellenic cultural fold."
 oe_v50_romp_omen_dionysus_vintage_revelry:0 "Vintage Joy of the Commons"
 oe_v50_romp_omen_dionysus_vintage_revelry_desc:0 "Bountiful autumn festivals lift popular contentment and hasten social mobility across towns."
 oe_v50_romp_demeter_god:0 "Demeter Karpophoros"
 oe_v50_romp_demeter_god.latin_language:0 "Ceres Frugifera"
 oe_v50_romp_demeter_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_demeter_god')] sanctifies every ploughed furrow, terraced orchard, and frontier homestead—multiplying grain harvests, sustaining vast armies and cities, and drawing eager settlers into new lands."
 oe_v50_romp_demeter_god_omen:0 "Golden wheat-ears bow beneath a clear spring sky and the scent of turned loam rises from every valley as [ShowGodName('oe_v50_romp_demeter_god')] walks the fields of the empire..."
 oe_v50_romp_omen_demeter_golden_sheaf:0 "Golden Sheaf of Eleusis"
 oe_v50_romp_omen_demeter_golden_sheaf_desc:0 "Blessed harvests fill provincial granaries and ward off spoilage through long winters."
 oe_v50_romp_omen_demeter_settler_furrows:0 "Settler Furrows of the Frontier"
 oe_v50_romp_omen_demeter_settler_furrows_desc:0 "Promise of fertile allotments draws hardy settler families to frontier colonies and raises natural growth."
 oe_v50_romp_omen_demeter_rural_blossom:0 "Rural Settlement Blossom"
 oe_v50_romp_omen_demeter_rural_blossom_desc:0 "Drainage canals, olive terraces, and seed-banks steadily raise rural development and attraction."
 oe_v50_romp_omen_demeter_granary_law:0 "Law of the Sacred Granaries"
 oe_v50_romp_omen_demeter_granary_law_desc:0 "Expanded state grain reserves and rural workshops strengthen food storage and output across the realm."
 oe_v50_romp_omen_demeter_thesmophoria:0 "Blessing of the Thesmophoria"
 oe_v50_romp_omen_demeter_thesmophoria_desc:0 "Autumn harvest rites honor agrarian law, delighting the peasantry and lifting provincial prosperity."
 oe_v50_romp_bellona_god:0 "Bellona Victrix"
 oe_v50_romp_bellona_god.latin_language:0 "Bellona Duellona"
 oe_v50_romp_bellona_god_desc:0 "[ShowGodNameWithNoTooltip('oe_v50_romp_bellona_god')] drives the bronze-wheeled war chariot before the Senate's Column of War—mastering siege artillery, fiery naval broadsides, tireless campaign endurance, and laurel-crowned triumphs."
 oe_v50_romp_bellona_god_omen:0 "A crimson spear is cast across the sacred boundary before the Temple of Bellona, and bronze cannons answer with rolling thunder as [ShowGodName('oe_v50_romp_bellona_god')] rides ahead of our banners..."
 oe_v50_romp_omen_bellona_wall_breaker:0 "Breacher of Citadels"
 oe_v50_romp_omen_bellona_wall_breaker_desc:0 "Sappers and master gunners shatter enemy bastions under Bellona's relentless gaze."
 oe_v50_romp_omen_bellona_bronze_thunder:0 "Bronze Thunder of Artillery"
 oe_v50_romp_omen_bellona_bronze_thunder_desc:0 "Imperial foundries cast heavier, truer cannon batteries at lower cost for every field army."
 oe_v50_romp_omen_bellona_fiery_broadside:0 "Fire Upon the Waves"
 oe_v50_romp_omen_bellona_fiery_broadside_desc:0 "Naval gunners and Greek-fire crews deliver devastating broadsides with fearless sea morale."
 oe_v50_romp_omen_bellona_unyielding_spear:0 "Unyielding War Spirit"
 oe_v50_romp_omen_bellona_unyielding_spear_desc:0 "Battle-hardened regiments rally rapidly after clash and endure protracted campaigns with minimal exhaustion."
 oe_v50_romp_omen_bellona_campus_triumph:0 "Triumph of the Campus Martius"
 oe_v50_romp_omen_bellona_campus_triumph_desc:0 "The promise of a Capitoline triumph sharpens iron discipline and lifelong martial tradition."
 oe_v50_romp_eleusinian_mysteries_aspect:0 "Greater Eleusinian Mysteries"
 oe_v50_romp_eleusinian_mysteries_aspect_desc:0 "Revives the torchlit sacred initiations of Demeter and Persephone across imperial provinces—accelerating peaceful conversion, inspiring new artists, nurturing population growth, and welcoming curious heathens."
 oe_v50_romp_orphic_astronomy_aspect:0 "Orphic Celestial Astronomy"
 oe_v50_romp_orphic_astronomy_aspect_desc:0 "Unites Orphic cosmic harmony with practical Alexandrian cartography and oceanic navigation—quickening scholarly research, elevating maximum literacy, and extending both naval and colonial reach."
 oe_v50_romp_stoic_civitas_aspect:0 "Stoic Civic Virtues"
 oe_v50_romp_stoic_civitas_aspect_desc:0 "Instills the discipline of Marcus Aurelius and Zeno into magistracy and legion alike—sharpening military discipline, deepening provincial control, strengthening stability efficiency, and quieting factional unrest."
 oe_v50_romp_promethean_foundry_aspect:0 "Promethean Craft & Foundry"
 oe_v50_romp_promethean_foundry_aspect_desc:0 "Honors Prometheus and Hephaestus as patrons of fire, metallurgy, and engineering—boosting production efficiency, bronze artillery power, and the pace of public construction."
 oe_v50_romp_cab_sibylline_augury:0 "Consult the Sibylline Books"
 oe_v50_romp_cab_sibylline_augury_desc:0 "Assign a senior counselor to oversee the Sibylline Books and state augury—strengthening stability efficiency, omen potency, scholarly research, and diplomatic standing."
 oe_v50_romp_cab_sibylline_augury_action:0 "Consult the Sibylline Books"
 oe_v50_romp_cab_sibylline_augury_active:0 "Active: Consult the Sibylline Books"
 oe_v50_romp_cab_sibylline_augury_action_progress:0 "Active"
 oe_v50_romp_cab_sibylline_augury_action_progress_wordier:0 "Consult the Sibylline Books (Active)"
 oe_v50_romp_cab_sibylline_augury_action_progress_tooltip:0 "Assign a senior counselor to oversee the Sibylline Books and state augury—strengthening stability efficiency, omen potency, scholarly research, and diplomatic standing."
 oe_v50_romp_cab_consecrate_temples:0 "Consecrate Provincial Sanctuaries"
 oe_v50_romp_cab_consecrate_temples_desc:0 "Dispatch a pontifical commissioner to consecrate Hellenic temples across a target province—accelerating conversion, cultural assimilation, and local administrative control."
 oe_v50_romp_cab_consecrate_temples_action:0 "Consecrate Provincial Sanctuaries: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v50_romp_cab_consecrate_temples_active:0 "Consecrating Sanctuaries in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v50_romp_cab_consecrate_temples_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v50_romp_cab_consecrate_temples_action_progress_wordier:0 "Consecrate Provincial Sanctuaries ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v50_romp_cab_consecrate_temples_action_progress_tooltip:0 "Dispatch a pontifical commissioner to consecrate Hellenic temples across a target province—accelerating conversion, cultural assimilation, and local administrative control."
 oe_v50_romp_cab_consecrate_temples_select_province:0 "Select a Province to Consecrate Hellenic Sanctuaries"
 oe_v50_romp_cab_consecrate_temples_no_provinces:0 "@trigger_no! No eligible provinces available to consecrate Hellenic sanctuaries."
 oe_v50_romp_dec_ludi_saeculares.title:0 "Celebrate the Ludi Saeculares"
 oe_v50_romp_dec_ludi_saeculares.desc:0 "Proclaim the Centennial Secular Games of purification and renewal—lifting imperial prestige, legitimacy, and cultural tradition while opening the grand Ludi Saeculares ceremony (#Y 15#!-year cooldown)."
 oe_v50_romp_dec_ludi_saeculares.a:0 "Kindle the Torches of the Ludi Saeculares!"
 oe_v50_romp_dec_ludi_cd_tt:0 "At least #Y 15#! years have passed since the last Ludi Saeculares."
 oe_v50_romp_dec_ludi_saeculares_tt:0 "Awards immediate prestige, legitimacy, and cultural tradition, and triggers #Y The Ludi Saeculares: Renewal of the Golden Age#! (#Y 15#!-year cooldown)."
 oe_v50_romp_dec_sibylline_oracle.title:0 "Invoke the Sibylline War & State Oracle"
 oe_v50_romp_dec_sibylline_oracle.desc:0 "Summon the Quindecimviri to unseal the Sibylline verses, choosing among a 10-year military omen of Mars & Bellona, maritime-colonial omen of Hermes & Neptune, or scholarly-civic omen of Apollo & Athena (#Y 10#!-year cooldown)."
 oe_v50_romp_dec_sibylline_oracle.a:0 "Unseal the Sibylline Scrolls"
 oe_v50_romp_dec_sibylline_cd_tt:0 "At least #Y 10#! years have passed since the last Sibylline Oracle consultation."
 oe_v50_romp_dec_sibylline_oracle_tt:0 "Opens #Y Verses of the Sibylline War & State Oracle#! with three distinct 10-year prophetic paths (#Y 10#!-year cooldown)."
 oe_v50_romp_dec_imperial_apotheosis.title:0 "Decree the Imperial Cult of the Divus"
 oe_v50_romp_dec_imperial_apotheosis.desc:0 "Before the Collegium Pontificum and Senate, establish the permanent philosophical and civic creed of our Hellenic imperium—choosing among Julian Neoplatonism, Stoic Imperium, or Universal Syncretic Pantheon."
 oe_v50_romp_dec_imperial_apotheosis.a:0 "Proclaim the Permanent Imperial Creed"
 oe_v50_romp_dec_imperial_apotheosis_tt:0 "Triggers #Y Decree of the Imperial Cult of the Divus#! to establish a permanent state philosophy and civic creed."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ludi_civic:0 "Ludi Saeculares: Civic Concord"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ludi_civic:0 "The Centennial Secular Games renew the sacred bond between crown, senate, and people across every province."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ludi_martial:0 "Ludi Saeculares: Triumphal Circus"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ludi_martial:0 "Chariot races, sham naval battles, and martial parades inspire legions at elevated pageant upkeep."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ludi_arts:0 "Ludi Saeculares: Hymn of the Carmen Saeculare"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ludi_arts:0 "Choirs of youths and classical poets inaugurate a new cultural saeculum of learning and fine arts."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_oracle_bellona:0 "Sibylline Prophecy of Mars & Bellona"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_oracle_bellona:0 "The Sibylline verses summon the legions to disciplined siege warfare, demanding heavier campaign provisioning."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_oracle_hermes:0 "Sibylline Prophecy of Hermes & Neptune"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_oracle_hermes:0 "The Sibylline verses point toward open oceans, charting new trade routes and distant colonial horizons."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_oracle_apollo:0 "Sibylline Prophecy of Apollo & Athena"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_oracle_apollo:0 "The Sibylline verses illuminate philosophical academies, civic stability, and clear omens."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_creed_julian_neoplatonism:0 "Imperial Creed: Julian Neoplatonism"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_creed_julian_neoplatonism:0 "Elevates Philosopher-Emperor Julian's solar theology and academies into the permanent state creed, vexing conservative nobles."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_creed_stoic_imperium:0 "Imperial Creed: Stoic Imperium"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_creed_stoic_imperium:0 "Binds ruler, legions, and provincial governors to austere Stoic duty and civic order, curbing mercantile luxury."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_creed_syncretic_pantheon:0 "Imperial Creed: Universal Syncretic Pantheon"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_creed_syncretic_pantheon:0 "Embraces Interpretatio Romana across every land and ocean, welcoming foreign deities into civic concord while unsettling orthodox priests."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_academy_neo:0 "Imperial Philosophical Symposium"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_academy_neo:0 "Neoplatonic, Stoic, and Epicurean masters debate in marble colonnades under imperial patronage."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_vestal_guard:0 "Guardians of the Vestal Hearth"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_vestal_guard:0 "Renewed endowments for the Vestal sanctuary fortify stability, public health, and quiet prosperity."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_eleusis_harvest:0 "Eleusinian Bounty & Mysteries"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_eleusis_harvest:0 "Initiates return from torchlit harvest mysteries bearing renewed devotion and fuller granaries."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_pantheon_reopened:0 "Reopened Dome of the Roman Pantheon"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_pantheon_reopened:0 "Sunlight streams once more through the great oculus of Rome's Pantheon onto altars of all the gods."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_olympus_pilgrimage:0 "Imperial Pilgrimage to Mount Olympus"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_olympus_pilgrimage:0 "Ascent to the cloud-wreathed slopes of Olympus confirms heaven's mandate upon ruler and realm."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_civic_jurisprudence:0 "Hellenic Civic Citizenship Charter"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_civic_jurisprudence:0 "Municipal courts harmonize classical natural law with inclusive citizenship across newly incorporated cities."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_olive_groves:0 "Sacred Olive Groves of Athena"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_olive_groves:0 "State-protected olive orchards and craft guilds enrich rural prosperity and artisan production."
 STATIC_MODIFIER_NAME_oe_v50_romp_mod_ev_poseidon_convoy:0 "Consecrated Fleets of Poseidon"
 STATIC_MODIFIER_DESC_oe_v50_romp_mod_ev_poseidon_convoy:0 "Bull-sacrifice libations along imperial dockyards steel sailors and widen sea trade reach."
 oe_romp.501.title:0 "The Great Academy Debate: Neoplatonists, Stoics & Epicureans"
 oe_romp.501.desc:0 "Beneath the marble colonnades of our capital's restored philosophical halls, three classical schools contest the soul of the Hellenic revival. Neoplatonists preach cosmic ascent toward the Solar One, Stoics demand iron civic duty in law and legion, while Epicurean savants champion tranquil inquiry and tolerant municipal life."
 oe_romp.501.a:0 "Patronize the Neoplatonic Solar Academy"
 oe_romp.501.a.tt:0 "Grants #Y Imperial Philosophical Symposium#! for #Y 15#! years, research progress, and religious influence."
 oe_romp.501.b:0 "Enshrine Stoic Duty in Senate and Camp"
 oe_romp.501.b.tt:0 "Raises stability, prestige, and shifts society toward #Y Quality#!."
 oe_romp.501.c:0 "Welcome Epicurean Gardens of Civic Toleration"
 oe_romp.501.c.tt:0 "Improves burgher satisfaction, cultural tradition, and shifts toward #Y Humanist#!."
 oe_romp.502.title:0 "Omen of the Vestal Sacred Flame"
 oe_romp.502.desc:0 "At the midnight watch within the circular hearth-sanctuary, the eternal flame of Hestia-Vesta leaped threefold into a bright silver column without a breath of wind. The chief Vestal reports the prodigy to the Senate: the augurs read either a call to endow the sacred precinct, a summons to distribute hearth-embers to every provincial capital, or a reminder to replenish public granaries."
 oe_romp.502.a:0 "Endow the Guardians of the Vestal Hearth"
 oe_romp.502.a.tt:0 "Grants #Y Guardians of the Vestal Hearth#! for #Y 15#! years and boosts stability."
 oe_romp.502.b:0 "Carry Live Embers to Every Provincial Prytaneum"
 oe_romp.502.b.tt:0 "Raises capital prosperity, legitimacy, and religious influence."
 oe_romp.502.c:0 "Dedicate State Granaries to the Domestic Hearth"
 oe_romp.502.c.tt:0 "Boosts peasant satisfaction and grants #Y Eleusinian Bounty & Mysteries#! for #Y 10#! years."
 oe_romp.503.title:0 "Torchlit Initiation into the Eleusinian Mysteries"
 oe_romp.503.desc:0 "Along a lantern-lit sacred way outside the city gates, thousands of citizens, scholars, and foreign merchants gather in white linen robes for the autumn initiation of Demeter and Kore. The Hierophant invites our court to preside over the rites—shall we open the mystery fellowships broadly to provincial converts, restrict them to elite philosophical circles, or dedicate the harvest offerings to rural relief?"
 oe_romp.503.a:0 "Open the Sacred Way to Provincial Initiates"
 oe_romp.503.a.tt:0 "Grants #Y Eleusinian Bounty & Mysteries#! for #Y 15#! years and increases religious influence."
 oe_romp.503.b:0 "Reserve the Inner Sanctum for Classical Scholars"
 oe_romp.503.b.tt:0 "Grants #Y Imperial Philosophical Symposium#! for #Y 12#! years and raises cultural tradition."
 oe_romp.503.c:0 "Distribute the Harvest Offerings to Rural Villages"
 oe_romp.503.c.tt:0 "Raises peasant and burgher satisfaction and capital prosperity."
 oe_romp.504.title:0 "Triumphal Sacrifice to Jupiter Capitolinus"
 oe_romp.504.desc:0 "Laurel-crowned veterans and bronze eagle standards line the sacred avenue as priests prepare snow-white bulls with gilded horns in thanksgiving to Jupiter Optimus Maximus. Before the roaring crowd, the sovereign must set the tone of our martial creed: celebrate iron army discipline, honor the veteran soldiers with land grants, or offer a solemn vow of clemency toward conquered peoples."
 oe_romp.504.a:0 "Consecrate the Eagles to Bellona and Jupiter"
 oe_romp.504.a.tt:0 "Grants #Y Sibylline Prophecy of Mars & Bellona#! for #Y 10#! years and prestige."
 oe_romp.504.b:0 "Award Veteran Donatives and Civic Honors"
 oe_romp.504.b.tt:0 "Raises army tradition, legitimacy, and noble satisfaction."
 oe_romp.504.c:0 "Proclaim Roman Clemency and Civic Law"
 oe_romp.504.c.tt:0 "Grants #Y Hellenic Civic Citizenship Charter#! for #Y 12#! years and improves stability."
 oe_romp.505.title:0 "Reopening the Roman Pantheon"
 oe_romp.505.desc:0 "With Rome resting securely beneath Hellenic banners, master masons have polished Agrippa's Corinthian portico and restored the coffered concrete dome of the Pantheon. As noon sunlight pours through the great oculus onto freshly carved altars for all twelve Olympians and the Roman state deities, pilgrims stream from across the Mediterranean."
 oe_romp.505.a:0 "Re-Consecrate the Dome to All Gods of Heaven"
 oe_romp.505.a.tt:0 "Grants #Y Reopened Dome of the Roman Pantheon#! for #Y 20#! years, prestige, and religious influence."
 oe_romp.505.b:0 "Dedicate the Rotunda as a Hall of Universal Toleration"
 oe_romp.505.b.tt:0 "Grants #Y Hellenic Civic Citizenship Charter#! for #Y 15#! years and boosts Rome's prosperity."
 oe_romp.505.c:0 "Attach an Imperial Library of Classical Law to the Portico"
 oe_romp.505.c.tt:0 "Grants #Y Imperial Philosophical Symposium#! for #Y 15#! years and research progress."
 oe_romp.506.title:0 "Imperial Pilgrimage to Mount Olympus"
 oe_romp.506.desc:0 "From the plains of Thessaly and the Gulf of Thessaloniki, the snow-crowned throne of Mount Olympus pierces the summer clouds. Priests, poets, and provincial deputies urge the sovereign to lead a grand state pilgrimage up the cedar slopes to kindle a high-altitude beacon altar where the immortals once held council."
 oe_romp.506.a:0 "Lead the Sovereign Ascent to the Cloud Altar"
 oe_romp.506.a.tt:0 "Grants #Y Imperial Pilgrimage to Mount Olympus#! for #Y 20#! years and raises legitimacy."
 oe_romp.506.b:0 "Host Panhellenic Athletic Games at the Mountain Foot"
 oe_romp.506.b.tt:0 "Grants #Y Ludi Saeculares: Civic Concord#! for #Y 12#! years and raises cultural tradition."
 oe_romp.506.c:0 "Charter a Protected Sacred Forest Reserve Around the Peaks"
 oe_romp.506.c.tt:0 "Grants #Y Sacred Olive Groves of Athena#! for #Y 15#! years and lifts stability."
 oe_romp.507.title:0 "The Legacy of Philosopher-Emperor Julian"
 oe_romp.507.desc:0 "Archivists have assembled a freshly illuminated edition of Emperor Julian's letters, his Hymn to King Helios, and his statutes reforming pagan charity and priesthood ethics. Court counselors ask how best to honor the Restorer of the Temples: imitate his charitable hostels for the poor, publish his philosophical treatises in every school, or emulate his austere frontier campaigning."
 oe_romp.507.a:0 "Found Julianic Hospices and Civic Charity Halls"
 oe_romp.507.a.tt:0 "Grants #Y Guardians of the Vestal Hearth#! for #Y 15#! years and improves estate satisfaction."
 oe_romp.507.b:0 "Circulate the Hymn to King Helios Across All Academies"
 oe_romp.507.b.tt:0 "Grants #Y Imperial Philosophical Symposium#! for #Y 15#! years and research progress."
 oe_romp.507.c:0 "Emulate Julian's Austere Discipline on Campaign"
 oe_romp.507.c.tt:0 "Raises army tradition, prestige, and legitimacy."
 oe_romp.508.title:0 "Hellenic Law & Universal Civic Citizenship"
 oe_romp.508.desc:0 "Jurists trained in both Attic rhetoric and Roman civil statutes present a bold draft extending municipal citizenship to loyal non-Hellenic communities who swear civic fidelity at the public altar. Traditionalists fear diluting ancestral prestige, while governors argue an inclusive franchise will bind distant frontiers faster than any garrison."
 oe_romp.508.a:0 "Enact the Universal Hellenic Citizenship Charter"
 oe_romp.508.a.tt:0 "Grants #Y Hellenic Civic Citizenship Charter#! for #Y 15#! years and raises stability."
 oe_romp.508.b:0 "Require Civic Initiation Before Granting Franchise"
 oe_romp.508.b.tt:0 "Grants #Y Eleusinian Bounty & Mysteries#! for #Y 12#! years and boosts religious influence."
 oe_romp.508.c:0 "Preserve Patrician Municipal Curiae"
 oe_romp.508.c.tt:0 "Improves noble satisfaction, legitimacy, and prestige."
 oe_romp.509.title:0 "Sacred Olive Groves of Athena Polias"
 oe_romp.509.desc:0 "Guildmasters and agronomists propose planting consecrated olive groves and orchards across imperial crown estates, exporting prized lamp oil for sanctuaries while awarding amphorae of sacred oil to winners of civic games and outstanding artisan workshops."
 oe_romp.509.a:0 "Consecrate Crown Orchards to Athena Ergane"
 oe_romp.509.a.tt:0 "Grants #Y Sacred Olive Groves of Athena#! for #Y 15#! years and enriches treasury."
 oe_romp.509.b:0 "Award Sacred Oil Amphorae to Civic Games"
 oe_romp.509.b.tt:0 "Raises prestige, cultural tradition, and burgher satisfaction."
 oe_romp.509.c:0 "Fund Temple Lamp Endowments Across the Provinces"
 oe_romp.509.c.tt:0 "Increases religious influence and clergy satisfaction."
 oe_romp.510.title:0 "Winter Solstice Festival of Sol Invictus"
 oe_romp.510.desc:0 "On the twenty-fifth of December, bonfires blaze from every harbor mole and hilltop sanctuary to hail Dies Natalis Solis Invicti—the rebirth of the unconquered sun. Citizens exchange gilded laurel branches and bronze sun-medallions while imperial astronomers verify the exact solstice meridian."
 oe_romp.510.a:0 "Proclaim a Realm-Wide Solar Solstice Jubilee"
 oe_romp.510.a.tt:0 "Grants #Y Ludi Saeculares: Civic Concord#! for #Y 12#! years and boosts religious influence."
 oe_romp.510.b:0 "Commission Meridian Sundials and Solar Observatories"
 oe_romp.510.b.tt:0 "Grants #Y Sibylline Prophecy of Apollo & Athena#! for #Y 10#! years and research progress."
 oe_romp.510.c:0 "Strike Commemorative Gold Solidi Bearing the Radiate Crown"
 oe_romp.510.c.tt:0 "Raises prestige, legitimacy, and treasury gold."
 oe_romp.511.title:0 "Maritime Libation to Poseidon Pelagios"
 oe_romp.511.desc:0 "Before the spring sailing season opens, admirals and merchant captains assemble along the main naval breakwater to pour dark wine into the surf and hang bronze tridents upon flagship prows. How shall we channel this maritime devotion?"
 oe_romp.511.a:0 "Consecrate the Ocean Convoys and Admiralty"
 oe_romp.511.a.tt:0 "Grants #Y Consecrated Fleets of Poseidon#! for #Y 15#! years and naval tradition."
 oe_romp.511.b:0 "Dispatch Blue-Water Explorers Under Hermes & Poseidon"
 oe_romp.511.b.tt:0 "Grants #Y Sibylline Prophecy of Hermes & Neptune#! for #Y 10#! years."
 oe_romp.511.c:0 "Charter Coastal Lighthouses and Port Guilds"
 oe_romp.511.c.tt:0 "Boosts burgher satisfaction, treasury gold, and capital prosperity."
 oe_romp.512.title:0 "Reform of the Collegium Pontificum"
 oe_romp.512.desc:0 "As restored temples multiply from urban forums to frontier towns, senior flamines and augurs petition the Pontifex Maximus to codify priestly stipends, sanctuary archives, and calendar intercalation so civic rites remain dignified, uncorrupted, and harmonized across every province."
 oe_romp.512.a:0 "Standardize the Sacred Fasti and Pontifical Archives"
 oe_romp.512.a.tt:0 "Grants #Y Reopened Dome of the Roman Pantheon#! for #Y 12#! years and raises religious influence."
 oe_romp.512.b:0 "Subordinate Temple Treasuries to Imperial Auditors"
 oe_romp.512.b.tt:0 "Increases crown treasury gold and stability, slightly annoying the clergy."
 oe_romp.512.c:0 "Grant Provincial Priesthoods Broad Local Autonomy"
 oe_romp.512.c.tt:0 "Boosts clergy satisfaction and grants #Y Hellenic Civic Citizenship Charter#! for #Y 10#! years."
 oe_romp.513.title:0 "The Twin Gates of Janus Bifrons"
 oe_romp.513.desc:0 "Before the twin-arched shrine of Janus, magistrates debate the ancient ritual of the bronze gates—open in eras of bold expansion and war, bolted fast in seasons of civic renewal and diplomacy. Citizens gather in solemn silence to hear our sovereign decree."
 oe_romp.513.a:0 "Dedicate the Threshold to Overseas Passage & Trade"
 oe_romp.513.a.tt:0 "Grants #Y Sibylline Prophecy of Hermes & Neptune#! for #Y 10#! years and prestige."
 oe_romp.513.b:0 "Bolt the Bronze Doors in Honor of Pax Civica"
 oe_romp.513.b.tt:0 "Grants #Y Guardians of the Vestal Hearth#! for #Y 12#! years and improves stability."
 oe_romp.513.c:0 "Throw Wide the Gates to Summon the Legions"
 oe_romp.513.c.tt:0 "Grants #Y Ludi Saeculares: Triumphal Circus#! for #Y 10#! years and army tradition."
 oe_romp.514.title:0 "Chorus of the Great Dionysia"
 oe_romp.514.desc:0 "Playwrights from every major city have entered new tragedies and civic comedies for the spring festival of Dionysus Eleuthereus. Thousands pack the tiered marble benches from dawn till dusk, awaiting the imperial laurels that will crown the winning dramatist and set the artistic spirit of the age."
 oe_romp.514.a:0 "Crown the Classical Dramatists and Choral Poets"
 oe_romp.514.a.tt:0 "Grants #Y Ludi Saeculares: Hymn of the Carmen Saeculare#! for #Y 12#! years and cultural tradition."
 oe_romp.514.b:0 "Stage Multilingual Plays Celebrating Provincial Unity"
 oe_romp.514.b.tt:0 "Grants #Y Hellenic Civic Citizenship Charter#! for #Y 12#! years and boosts prestige."
 oe_romp.514.c:0 "Endow Municipal Theaters as Free Civic Gatherings"
 oe_romp.514.c.tt:0 "Boosts peasant and burgher satisfaction and raises stability."
 oe_romp.515.title:0 "Golden Harvest of Demeter & Ceres"
 oe_romp.515.desc:0 "Unusually gentle spring rains and warm harvest winds have yielded the richest grain crop in living memory. Farmers bring braided wheat-crowns to the temples of Demeter-Ceres, asking how the imperial treasury shall steward this windfall."
 oe_romp.515.a:0 "Store Surplus Grain in Sacred Frontier Granaries"
 oe_romp.515.a.tt:0 "Grants #Y Eleusinian Bounty & Mysteries#! for #Y 15#! years and capital prosperity."
 oe_romp.515.b:0 "Export Golden Grain Across Foreign Markets"
 oe_romp.515.b.tt:0 "Adds substantial treasury gold and improves burgher satisfaction."
 oe_romp.515.c:0 "Remit Rural Tithes in Gratitude to the Peasantry"
 oe_romp.515.c.tt:0 "Boosts peasant satisfaction, stability, and religious influence."
 oe_romp.516.title:0 "Vow to Bellona Before the Siege"
 oe_romp.516.desc:0 "Master siege engineers and bronze-casters gather outside the artillery park to offer a ceremonial libation to Bellona Victrix. They present three competing military reforms: heavier siege bombards for cracking stone bastions, rapid naval cannon drills for our fleets, or fortified logistics depots to sustain armies far from home."
 oe_romp.516.a:0 "Cast Heavy Siege Batteries in Bellona's Name"
 oe_romp.516.a.tt:0 "Grants #Y Sibylline Prophecy of Mars & Bellona#! for #Y 12#! years and army tradition."
 oe_romp.516.b:0 "Drill Naval Gunnery Squadrons Along the Coast"
 oe_romp.516.b.tt:0 "Grants #Y Consecrated Fleets of Poseidon#! for #Y 12#! years and navy tradition."
 oe_romp.516.c:0 "Invest in Frontier Arsenals and Citizen Militias"
 oe_romp.516.c.tt:0 "Grants #Y Sacred Olive Groves of Athena#! for #Y 12#! years and improves noble satisfaction."
 oe_romp.517.title:0 "Orphic Star-Tables of the Celestial Spheres"
 oe_romp.517.desc:0 "Mathematicians and sacred astronomers have compiled new brass armillary tables mapping planetary harmonies alongside exact latitudes for transoceanic voyages. Their patron asks whether these celestial tables should first serve the universities, the royal admiralty, or the Pontifical calendar keepers."
 oe_romp.517.a:0 "Endow Imperial Academies with the New Ephemerides"
 oe_romp.517.a.tt:0 "Grants #Y Sibylline Prophecy of Apollo & Athena#! for #Y 12#! years and research progress."
 oe_romp.517.b:0 "Issue the Star-Tables to Ocean Navigators"
 oe_romp.517.b.tt:0 "Grants #Y Sibylline Prophecy of Hermes & Neptune#! for #Y 12#! years."
 oe_romp.517.c:0 "Harmonize the Sacred Calendar and Omen Rites"
 oe_romp.517.c.tt:0 "Grants #Y Reopened Dome of the Roman Pantheon#! for #Y 12#! years and religious influence."
 oe_romp.518.title:0 "The Forge of Prometheus & Civic Artisans"
 oe_romp.518.desc:0 "Metallurgists, glassmakers, and architects honoring Prometheus and Hephaestus have organized a grand civic guild exhibition in the capital's forum, displaying refined blast furnaces, hydraulic hoists, and fireproof kiln bricks."
 oe_romp.518.a:0 "Charter Royal Promethean Foundries Across the Cities"
 oe_romp.518.a.tt:0 "Grants #Y Sacred Olive Groves of Athena#! for #Y 15#! years and boosts burgher satisfaction."
 oe_romp.518.b:0 "Direct the New Furnaces Toward Heavy Cannon Casting"
 oe_romp.518.b.tt:0 "Grants #Y Sibylline Prophecy of Mars & Bellona#! for #Y 10#! years."
 oe_romp.518.c:0 "Tax the Guild Exhibition to Refill the Treasury"
 oe_romp.518.c.tt:0 "Adds gold and boosts capital prosperity."
 oe_romp.519.title:0 "Hermes of the Crossroads & Merchant Guilds"
 oe_romp.519.desc:0 "Caravan factors and overseas supercargoes have erected carved stone Herms along major imperial highways and port quays, swearing oaths of fair weights and mutual credit under Hermes's protection. They offer to bankroll a new diplomatic commercial league if granted royal charter."
 oe_romp.519.a:0 "Grant the Caduceus Maritime & Overland Charter"
 oe_romp.519.a.tt:0 "Grants #Y Sibylline Prophecy of Hermes & Neptune#! for #Y 12#! years and treasury gold."
 oe_romp.519.b:0 "Pair Merchant Envoys with Imperial Embassies"
 oe_romp.519.b.tt:0 "Raises prestige, diplomatic standing, and burgher satisfaction."
 oe_romp.519.c:0 "Use Merchant Contributions to Beautify Civic Sanctuaries"
 oe_romp.519.c.tt:0 "Increases religious influence and cultural tradition."
 oe_romp.520.title:0 "Hestia's Eternal Hearth in the Provinces"
 oe_romp.520.desc:0 "Delegations from distant provincial cities arrive at court carrying silver braziers to draw fire from the imperial Prytaneum, symbolizing that every frontier town—whether on Mediterranean shores or across distant oceans—shares one undivided Roman-Hellenic hearth."
 oe_romp.520.a:0 "Kindle Provincial Hearths with Imperial Blessings"
 oe_romp.520.a.tt:0 "Grants #Y Guardians of the Vestal Hearth#! for #Y 15#! years and raises legitimacy."
 oe_romp.520.b:0 "Bind the Hearth Delegations into Civic Self-Governance"
 oe_romp.520.b.tt:0 "Grants #Y Hellenic Civic Citizenship Charter#! for #Y 15#! years."
 oe_romp.520.c:0 "Celebrate a Grand Pan-Imperial Hearth Festival"
 oe_romp.520.c.tt:0 "Grants #Y Ludi Saeculares: Civic Concord#! for #Y 12#! years and improves stability."
 oe_romp.521.title:0 "The Ludi Saeculares: Renewal of the Golden Age"
 oe_romp.521.desc:0 "For three nights and three days, torchlit sacrifices to the Moirai and Eileithyiai alternate with bright daytime offerings to Jupiter, Juno, Apollo, and Diana. At the climax of the Ludi Saeculares, twenty-seven youths and twenty-seven maidens sing the Carmen Saeculare before the assembled realm. What spirit shall crown this new saeculum?"
 oe_romp.521.a:0 "Crown the Saeculum with Civic Concord & Pax Deorum"
 oe_romp.521.a.tt:0 "Grants #Y Ludi Saeculares: Civic Concord#! for #Y 15#! years, stability, and religious influence."
 oe_romp.521.b:0 "Stage Grand Triumphal Circus Games for the Legions"
 oe_romp.521.b.tt:0 "Grants #Y Ludi Saeculares: Triumphal Circus#! for #Y 15#! years and army tradition."
 oe_romp.521.c:0 "Patronize the Poets, Choirs & Scholars of the Carmen Saeculare"
 oe_romp.521.c.tt:0 "Grants #Y Ludi Saeculares: Hymn of the Carmen Saeculare#! for #Y 15#! years and cultural tradition."
 oe_romp.522.title:0 "Verses of the Sibylline War & State Oracle"
 oe_romp.522.desc:0 "The Quindecimviri unseal the gilded chest holding the hexameter verses of the Cumaean Sibyl. By flickering temple lamps, three prophetic counsels emerge from the ancient Greek scrolls—each pointing the empire down a decisive ten-year destiny."
 oe_romp.522.a:0 "Heed the War Oracle of Mars & Bellona"
 oe_romp.522.a.tt:0 "Grants #Y Sibylline Prophecy of Mars & Bellona#! for #Y 10#! years and army tradition."
 oe_romp.522.b:0 "Heed the Oceanic Oracle of Hermes & Neptune"
 oe_romp.522.b.tt:0 "Grants #Y Sibylline Prophecy of Hermes & Neptune#! for #Y 10#! years and navy tradition."
 oe_romp.522.c:0 "Heed the Scholarly Oracle of Apollo & Athena"
 oe_romp.522.c.tt:0 "Grants #Y Sibylline Prophecy of Apollo & Athena#! for #Y 10#! years and research progress."
 oe_romp.523.title:0 "Decree of the Imperial Cult of the Divus"
 oe_romp.523.desc:0 "Before the assembled Collegium Pontificum and Senate, the sovereign formally establishes the enduring philosophical and civic foundation of our Hellenic imperium. This solemn decree shall shape our academies, legions, and temples for generations to come."
 oe_romp.523.a:0 "Enshrine Julian Neoplatonism as State Philosophy"
 oe_romp.523.a.tt:0 "Permanently grants #Y Imperial Creed: Julian Neoplatonism#! (Research, Omen Strength, Religious Influence, Max Literacy; slight Noble dissatisfaction)."
 oe_romp.523.b:0 "Enshrine the Austere Stoic Imperium"
 oe_romp.523.b.tt:0 "Permanently grants #Y Imperial Creed: Stoic Imperium#! (Discipline, Monthly Control, Stability Efficiency; slight Burgher dissatisfaction)."
 oe_romp.523.c:0 "Enshrine the Universal Syncretic Pantheon"
 oe_romp.523.c.tt:0 "Permanently grants #Y Imperial Creed: Universal Syncretic Pantheon#! (Heathen & Heretic Tolerance, Diplomatic Reputation, Assimilation; slight Clergy dissatisfaction)."
