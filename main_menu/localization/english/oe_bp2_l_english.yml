l_english:
 oe_bp2_b_serbian_toll_accord: "Macedonian Toll & Transit Accord"
 oe_bp2_b_serbian_rebuff: "Rebuffed Macedonian Extortion"
 oe_bp2_b_turk_mercenary_rift: "Cracked Down on Mutinous Turkish Raiders"
 oe_bp2_b_venice_debt_settled: "Settled the Crown Jewels Pledge"
 oe_bp2_b_venice_debt_stalled: "Deferred Crown Jewels Redemption"
 oe_bp2_b_patristic_dialogue: "East-West Patristic Dialogue"
 oe_bp2_b_union_enforced: "Enforced the Union Liturgy"
 oe_bp2_b_union_hedged: "Hedged on the Church Union"
 oe_bp2_b_florence_formula: "Adopted the Florence Compromise Formula"
 oe_bp2_b_rus_autocephaly_accord: "Recognized Russian Autocephaly Accord"
 oe_bp2_b_rus_ecclesiastical_chill: "Condemned Unilateral Russian Consecration"
 STATIC_MODIFIER_NAME_oe_bp2_new_man_cadre: "Meritocratic New-Man Cadre"
 STATIC_MODIFIER_DESC_oe_bp2_new_man_cadre: "Crown-elevated bureaucrats of humble birth sharpen cabinet efficiency, crown power, and tax collection while provoking magnate resentment."
 STATIC_MODIFIER_NAME_oe_bp2_chancellery_clerks: "Provincial Chancellery Clerks"
 STATIC_MODIFIER_DESC_oe_bp2_chancellery_clerks: "Quietly inducting provincial clerks steadies chancellery administration and tax rolls with minimal aristocratic friction."
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_purple_council: "Purple Chamber In-Law Council"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_purple_council: "Inducting the consort's kindred into imperial counsel bolsters diplomacy, legitimacy, and subject loyalty at the price of growing noble clout."
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_barred_command: "Edict Barring In-Laws from Command"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_barred_command: "Barring maternal kin from military commands and high ministries secures crown centralization while cooling dynastic diplomacy."
 STATIC_MODIFIER_NAME_oe_bp2_civic_relief_accord: "Imperial Civic Relief Accord"
 STATIC_MODIFIER_DESC_oe_bp2_civic_relief_accord: "Distributing treasury alms and civic grain soothes estate grievances and steadies public stability."
 STATIC_MODIFIER_NAME_oe_bp2_crown_consolidation: "Consistorium Crown Consolidation"
 STATIC_MODIFIER_DESC_oe_bp2_crown_consolidation: "Reasserting imperial prerogatives through the Consistorium strengthens crown power and keeps provincial commanders obedient."
 STATIC_MODIFIER_NAME_oe_bp2_senate_theme_concordat: "Senate-Theme Concordat"
 STATIC_MODIFIER_DESC_oe_bp2_senate_theme_concordat: "A solemn concordat between the Senate and the thematic commanders elevates subject loyalty and cabinet coordination."
 STATIC_MODIFIER_NAME_oe_bp2_magnate_tax_exemption: "Magnate Estate Tax Exemption"
 STATIC_MODIFIER_DESC_oe_bp2_magnate_tax_exemption: "Temporarily exempting magnate estates from cadastral reassessments buys aristocratic goodwill and manpower at a fiscal cost."
 STATIC_MODIFIER_NAME_oe_bp2_crown_cadastre_enforced: "Enforced Imperial Cadastre"
 STATIC_MODIFIER_DESC_oe_bp2_crown_cadastre_enforced: "Treasury auditors register concealed magnate holdings, swelling tax efficiency at the expense of noble satisfaction."
 STATIC_MODIFIER_NAME_oe_bp2_absorbed_latin_retinue: "Absorbed Latin Tagma Retinues"
 STATIC_MODIFIER_DESC_oe_bp2_absorbed_latin_retinue: "Folding private Latin mercenaries into the imperial standing army sharpens morale and discipline while raising upkeep."
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_logothete: "Consort-Kin Logothete"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_logothete: "Appointing a kinsman of the empress as logothete pleases nobles and foreign courts at a modest drop in cabinet efficiency."
 STATIC_MODIFIER_NAME_oe_bp2_merit_logothete: "Merit-Appointed Logothete"
 STATIC_MODIFIER_DESC_oe_bp2_merit_logothete: "Rejecting in-law patronage in favor of proven competence lifts cabinet efficiency while nettling court magnates."
 STATIC_MODIFIER_NAME_oe_bp2_purple_guardianship: "Purple Chamber Guardianship Oath"
 STATIC_MODIFIER_DESC_oe_bp2_purple_guardianship: "A joint oath of the Senate and consort's kin around the imperial heir steadies dynastic legitimacy and subject loyalty."
 STATIC_MODIFIER_NAME_oe_bp2_palace_tutelage: "Palace Scholarly Tutelage"
 STATIC_MODIFIER_DESC_oe_bp2_palace_tutelage: "Entrusting the heir to palace scholars insulates succession from magnate intrigue and fosters learning."
 STATIC_MODIFIER_NAME_oe_bp2_inlaw_war_subsidy: "Consort House War Subsidy"
 STATIC_MODIFIER_DESC_oe_bp2_inlaw_war_subsidy: "Private funds from the empress's house ease army maintenance in wartime while enlarging aristocratic influence."
 STATIC_MODIFIER_NAME_oe_bp2_empress_grain_fund: "Empress's Charitable Grain Fund"
 STATIC_MODIFIER_DESC_oe_bp2_empress_grain_fund: "Converting consort-house donations into permanent public granaries boosts food supply and peasant satisfaction."
 STATIC_MODIFIER_NAME_oe_bp2_mixed_audit_board: "Mixed Senate-Bureaucracy Audit Board"
 STATIC_MODIFIER_DESC_oe_bp2_mixed_audit_board: "A joint audit commission of senators and new-man clerks improves legislative smoothness and cabinet output at a slight tax compromise."
 STATIC_MODIFIER_NAME_oe_bp2_emergency_dole: "Emergency Imperial Grain Dole"
 STATIC_MODIFIER_DESC_oe_bp2_emergency_dole: "Opening state granaries and remitting hearth taxes calms urban unrest at a short-term cost to tax efficiency."
 STATIC_MODIFIER_NAME_oe_bp2_palace_martial_order: "Palace Guard Martial Order"
 STATIC_MODIFIER_DESC_oe_bp2_palace_martial_order: "Deploying the imperial guards restores administrative control by force while chilling estate goodwill."
 STATIC_MODIFIER_NAME_oe_bp2_broken_oligarchy: "Shattered Magnate Oligarchy"
 STATIC_MODIFIER_DESC_oe_bp2_broken_oligarchy: "Playing the two dominant houses against each other breaks their oligarchic grip and restores crown power."
 STATIC_MODIFIER_NAME_oe_bp2_senatorial_oligarchy: "Senatorial Oligarchy Compact"
 STATIC_MODIFIER_DESC_oe_bp2_senatorial_oligarchy: "Sharing governance with the twin magnate houses secures noble loyalty and calm at the cost of crown authority and tax receipts."
 STATIC_MODIFIER_NAME_oe_bp2_macedonian_toll_concession: "Macedonian Transit Toll Concession"
 STATIC_MODIFIER_DESC_oe_bp2_macedonian_toll_concession: "Granting Serbian merchants duty privileges along the Vardar stalls Dušan's advance at a modest loss in trade revenue."
 STATIC_MODIFIER_NAME_oe_bp2_orthodox_macedonia_rally: "Orthodox Defense of Macedonia"
 STATIC_MODIFIER_DESC_oe_bp2_orthodox_macedonia_rally: "Defying foreign extortion rallies imperial troops, garrison resilience, and clerical devotion."
 STATIC_MODIFIER_NAME_oe_bp2_turkic_auxiliary_pact: "Turkic Auxiliary Mercenary Pact"
 STATIC_MODIFIER_DESC_oe_bp2_turkic_auxiliary_pact: "Harnessing Anatolian Turkish horsemen boosts battlefield punch and mercenary upkeep efficiency while devastating the countryside."
 STATIC_MODIFIER_NAME_oe_bp2_redeemed_crown_jewels: "Imperial Crown Jewels Redeemed"
 STATIC_MODIFIER_DESC_oe_bp2_redeemed_crown_jewels: "Redeeming the imperial regalia from Venetian vaults erases decades of humiliation and restores Roman majesty."
 STATIC_MODIFIER_NAME_oe_bp2_venetian_customs_lien: "Venetian Customs Lien Settlement"
 STATIC_MODIFIER_DESC_oe_bp2_venetian_customs_lien: "Pledging Black Sea tariff shares brings the crown jewels home early at the cost of reduced trade income."
 STATIC_MODIFIER_NAME_oe_bp2_postwar_amnesty: "Post-War Amnesty & Reconciliation"
 STATIC_MODIFIER_DESC_oe_bp2_postwar_amnesty: "Pardoning rival captains accelerates thematic loyalty recovery and prosperity while slightly tempering crown power."
 STATIC_MODIFIER_NAME_oe_bp2_postwar_confiscation: "Post-War Attainder & Confiscation"
 STATIC_MODIFIER_DESC_oe_bp2_postwar_confiscation: "Confiscating rival magnate estates fills the fisc and strengthens the crown while embittering the nobility."
 STATIC_MODIFIER_NAME_oe_bp2_theme_reconstruction_board: "Theme Reconstruction Commission"
 STATIC_MODIFIER_DESC_oe_bp2_theme_reconstruction_board: "Rebuilding battered border forts and restoring stratiotai rolls strengthens imperial manpower and garrison upkeep."
 STATIC_MODIFIER_NAME_oe_bp2_zealot_guild_commerce: "Aegean Municipal Guild Charter"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_guild_commerce: "Chartering Thessaloniki's guilds energizes imperial burghers and maritime commerce to rival Venice and Genoa."
 STATIC_MODIFIER_NAME_oe_bp2_zealot_iron_order: "White Tower Iron Order"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_iron_order: "Crushing the Zealot commune by force pleases landed magnates and stiffens crown control at the expense of burgher trust."
 STATIC_MODIFIER_NAME_oe_bp2_zealot_civic_concord: "Saint Demetrios Civic Concord"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_civic_concord: "Integrating moderate guild deputies into a mixed municipal senate balances social harmony, stability, and urban literacy."
 STATIC_MODIFIER_NAME_oe_bp2_hellenic_purism: "Classical Hellenic Purism"
 STATIC_MODIFIER_DESC_oe_bp2_hellenic_purism: "Rooting the empire in Classical Hellenic paideia and Orthodox purity elevates cultural tradition, literacy, and true-faith unity."
 STATIC_MODIFIER_NAME_oe_bp2_universal_citizenship: "Pan-Mediterranean Roman Citizenship"
 STATIC_MODIFIER_DESC_oe_bp2_universal_citizenship: "Reviving the spirit of the Constitutio Antoniniana speeds provincial integration and assimilation while easing multi-ethnic friction."
 STATIC_MODIFIER_NAME_oe_bp2_patristic_orthodoxy_banner: "Banner of Athonite & Patristic Orthodoxy"
 STATIC_MODIFIER_DESC_oe_bp2_patristic_orthodoxy_banner: "Reaffirming Athonite and patristic orthodoxy rallies clergy, religious influence, and conversion fervor."
 STATIC_MODIFIER_NAME_oe_bp2_ecumenical_scholarship: "East-West Patristic Scholarship"
 STATIC_MODIFIER_DESC_oe_bp2_ecumenical_scholarship: "Sponsoring scholarly exchanges between Greek and Latin theologians advances research, literacy, and diplomacy despite clerical unease."
 STATIC_MODIFIER_NAME_oe_bp2_anatolia_stratiotai: "Anatolian Stratiotai Revival"
 STATIC_MODIFIER_DESC_oe_bp2_anatolia_stratiotai: "Settling military farmers across recovered Asia Minor boosts manpower, fort upkeep, and assimilation while sharpening religious tension."
 STATIC_MODIFIER_NAME_oe_bp2_anatolia_frontier_peace: "Anatolian Frontier Settlement Peace"
 STATIC_MODIFIER_DESC_oe_bp2_anatolia_frontier_peace: "Gentle taxation and pasture charters turn Anatolian nomads into settled taxpayers, aiding food output and peaceful integration."
 STATIC_MODIFIER_NAME_oe_bp2_egypt_coptic_accord: "Coptic Liturgical Conciliation"
 STATIC_MODIFIER_DESC_oe_bp2_egypt_coptic_accord: "Recognizing Coptic liturgical autonomy wins local cooperation across the Nile valley, securing abundant grain and smoother integration."
 STATIC_MODIFIER_NAME_oe_bp2_alexandrian_renaissance: "Alexandrian Mouseion Revival"
 STATIC_MODIFIER_DESC_oe_bp2_alexandrian_renaissance: "Reopening Greek academies in Alexandria propels research, literacy, and Hellenization while straining Coptic relations."
 STATIC_MODIFIER_NAME_oe_bp2_italy_bilingual_charter: "Ravenna Bilingual Municipal Charter"
 STATIC_MODIFIER_DESC_oe_bp2_italy_bilingual_charter: "Preserving Italian civic charters alongside bilingual Roman courts wins burgher loyalty, merchant clout, and faster integration."
 STATIC_MODIFIER_NAME_oe_bp2_italy_basilica_code: "Exarchate Basilica Law Enforcement"
 STATIC_MODIFIER_DESC_oe_bp2_italy_basilica_code: "Imposing Constantinople's Basilica Code across the Italian Exarchate heightens crown control and assimilation while chafing urban communes."
 STATIC_MODIFIER_NAME_oe_bp2_gaul_senate_pact: "Gallo-Roman Senatorial Compact"
 STATIC_MODIFIER_DESC_oe_bp2_gaul_senate_pact: "Admitting Latin magnates of Gaul into the imperial Senate accelerates western integration, prestige, and cultural reach."
 STATIC_MODIFIER_NAME_oe_bp2_gaul_chancery_rule: "Gallic Imperial Chancery Administration"
 STATIC_MODIFIER_DESC_oe_bp2_gaul_chancery_rule: "Mandating uniform imperial chancery records and thematic levies across Gaul lifts tax, manpower, and assimilation at a cost to local goodwill."
 STATIC_MODIFIER_NAME_oe_bp2_union_enforced_aid: "Enforced Union Western Aid Accord"
 STATIC_MODIFIER_DESC_oe_bp2_union_enforced_aid: "Suppressing anti-unionist monks secures western diplomatic backing and cheaper mercenaries while alienating Orthodox clergy."
 STATIC_MODIFIER_NAME_oe_bp2_quiet_orthodox_rite: "Quiet Preservation of Orthodox Rites"
 STATIC_MODIFIER_DESC_oe_bp2_quiet_orthodox_rite: "Tacitly allowing monasteries and parishes to keep traditional rites calms domestic strife while cooling Rome's enthusiasm."
 STATIC_MODIFIER_NAME_oe_bp2_florence_humanist_bridge: "Florence Humanist Theological Bridge"
 STATIC_MODIFIER_DESC_oe_bp2_florence_humanist_bridge: "A nuanced compromise on the Filioque fuels Graeco-Italian humanist scholarship and diplomacy while ruffling conservative clergy."
 STATIC_MODIFIER_NAME_oe_bp2_ephesus_creed_stand: "Stand of Mark of Ephesus"
 STATIC_MODIFIER_DESC_oe_bp2_ephesus_creed_stand: "Refusing doctrinal dilution of the Nicene Creed strengthens true-faith cohesion and religious influence at diplomatic cost in the West."
 STATIC_MODIFIER_NAME_oe_bp2_northern_ecclesiastical_accord: "Northern Autocephaly Strategic Accord"
 STATIC_MODIFIER_DESC_oe_bp2_northern_ecclesiastical_accord: "Recognizing Russian ecclesiastical autonomy preserves northern alliances and commerce at a modest cost to patriarchal influence."
 STATIC_MODIFIER_NAME_oe_bp2_ecumenical_primacy_asserted: "Ecumenical Patriarchal Primacy Asserted"
 STATIC_MODIFIER_DESC_oe_bp2_ecumenical_primacy_asserted: "Defending Constantinople's canonical primacy over northern sees bolsters religious prestige while chilling ties with Rus'."
 STATIC_MODIFIER_NAME_oe_bp2_pentarchy_triumph: "Triumph of the Orthodox Pentarchy"
 STATIC_MODIFIER_DESC_oe_bp2_pentarchy_triumph: "Reclaiming the ancient patriarchal sees without bowing to Rome crowns Eastern Orthodoxy with unmatched prestige, faith, and cultural vigor."
 STATIC_MODIFIER_NAME_oe_bp2_pentarchy_universal_charter: "Universal Pentarchy Charter of Learning"
 STATIC_MODIFIER_DESC_oe_bp2_pentarchy_universal_charter: "Dedicating the restored Pentarchy to academies, civic charity, and diplomacy lifts literacy, estate harmony, and imperial renown."
 STATIC_MODIFIER_NAME_oe_bp2_zealot_charter_city: "Thessaloniki Chartered Free City"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_charter_city: "Imperial recognition of guild and civic self-governance fuels vibrant workshops and prosperity at a modest loss of direct crown control."
 STATIC_MODIFIER_NAME_oe_bp2_zealot_crown_garrison: "White Tower Crown Garrison"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_crown_garrison: "A heavy imperial garrison holds Thessaloniki's walls in iron control, though commerce and prosperity recover slowly after the purge."
 STATIC_MODIFIER_NAME_oe_bp2_zealot_civic_senate: "Thessaloniki Civic-Senate Council"
 STATIC_MODIFIER_DESC_oe_bp2_zealot_civic_senate: "A balanced council of moderate guild leaders and local senators fosters urban literacy, civic peace, and steady development."
 STATIC_MODIFIER_NAME_oe_bp2_loc_anatolia_revival: "Anatolian Rumelian Revival Hub"
 STATIC_MODIFIER_DESC_oe_bp2_loc_anatolia_revival: "Rebuilt stratiotai estates and revived Greek-Roman parishes restore manpower, assimilation, and prosperity."
 STATIC_MODIFIER_NAME_oe_bp2_loc_nile_granary: "Imperial Nile Valley Granary"
 STATIC_MODIFIER_DESC_oe_bp2_loc_nile_granary: "Conciliated local communities and restored canals turn this Nile metropolis into an abundant imperial granary."
 STATIC_MODIFIER_NAME_oe_bp2_loc_ravenna_exarchate: "Ravenna Exarchate Chancery Hub"
 STATIC_MODIFIER_DESC_oe_bp2_loc_ravenna_exarchate: "Bilingual Roman courts and revived urban guilds anchor imperial governance, literacy, and craft output in Italy."
 STATIC_MODIFIER_NAME_oe_bp2_loc_gaul_diocese: "Gallic Praetorian Diocese Seat"
 STATIC_MODIFIER_DESC_oe_bp2_loc_gaul_diocese: "Restored Roman diocesan administration fosters control, cultural integration, and urban growth across Gaul."
 oe_bp2_dec_promote_new_men.title: "Promote Meritocratic New Men"
 oe_bp2_dec_promote_new_men.desc: "Follow the precedent of Alexios Apokaukos by elevating capable commoners into imperial ministries to counterbalance the dominant magnate house, gaining cabinet efficiency, crown power, and tax receipts at the risk of aristocratic backlash."
 oe_bp2_dec_promote_new_men.a: "Elevate New Men to Curb the Strongest Magnate House"
 oe_bp2_dec_promote_new_men.a.tt: "Imperial Authority -10, Public Opinion +4, Strongest Magnate House Influence -65 (may provoke a magnate remonstrance)"
 oe_bp2_dec_promote_new_men.b: "Quietly Induct Provincial Clerks into the Chancellery"
 oe_bp2_dec_promote_new_men.b.tt: "Imperial Authority -5, Strongest Magnate House Influence -30"
 oe_bp2_dec_inlaw_compact.title: "Codify Consort & In-Law Court Protocol"
 oe_bp2_dec_inlaw_compact.desc: "Royal marriage inevitably draws the consort's kindred into court and thematic politics. Formally induct them into the Purple Council to bolster diplomacy and subject loyalty, or bar in-laws from military command to safeguard crown centralization."
 oe_bp2_dec_inlaw_compact.a: "Induct the Consort's Kin into the Purple Council"
 oe_bp2_dec_inlaw_compact.a.tt: "Imperial Authority -6, all Themes gain +5 recent loyalty, activates Purple Council in-law policy (15 years)"
 oe_bp2_dec_inlaw_compact.b: "Promulgate the Edict Barring In-Laws from Command"
 oe_bp2_dec_inlaw_compact.b.tt: "Imperial Authority -6, Strongest Magnate House Influence -25, enforces strict anti-in-law command rules (15 years)"
 oe_bp2_dec_rebalance_pillars.title: "Imperial Consistorium Pillar Rebalance"
 oe_bp2_dec_rebalance_pillars.desc: "When Imperial Authority, Public Opinion, and magnate influence fall out of kilter, convene the Consistorium to trade treasury, opinion, and patronage to rebalance the Pillars and reinforce thematic loyalty."
 oe_bp2_dec_rebalance_pillars.a: "Distribute Civic Alms to Restore Public Opinion"
 oe_bp2_dec_rebalance_pillars.a.tt: "Public Opinion +14, Imperial Authority +4, all Themes gain +4 recent loyalty"
 oe_bp2_dec_rebalance_pillars.b: "Consolidate Imperial Authority Through the Consistorium"
 oe_bp2_dec_rebalance_pillars.b.tt: "Public Opinion -6, Imperial Authority +14, Strongest Magnate House Influence -35, all Themes gain +5 recent loyalty"
 oe_bp2_dec_rebalance_pillars.c: "Convene a Joint Senate-Theme Concordat"
 oe_bp2_dec_rebalance_pillars.c.tt: "Imperial Authority +6, Public Opinion +6, all Themes gain +8 recent loyalty"
 oe_bp2_dec_roman_identity.title: "Proclaim the Empire's Cultural Identity Doctrine"
 oe_bp2_dec_roman_identity.desc: "Amid Renaissance currents and imperial reconquest, the empire must define what it means to be Roman: Classical Hellenic Purism grounded in Greek paideia and Orthodox purity, or Pan-Mediterranean Roman Citizenship reviving the Constitutio Antoniniana. (A single costly pivot is permitted from the Age of Absolutism onward.)"
 oe_bp2_dec_roman_identity.a: "Track I: Adopt Classical Hellenic Purism"
 oe_bp2_dec_roman_identity.a.tt: "Establishes Classical Hellenic Purism as permanent state doctrine (a second pivot costs 15 Stability and 15 Imperial Authority and permanently locks the choice)"
 oe_bp2_dec_roman_identity.b: "Track II: Proclaim Pan-Mediterranean Roman Citizenship"
 oe_bp2_dec_roman_identity.b.tt: "Establishes Pan-Mediterranean Roman Citizenship as permanent state doctrine (a second pivot costs 15 Stability and 15 Imperial Authority and permanently locks the choice)"
 oe_bp2_dec_synod_doctrine_review.title: "Convene Imperial Synod on Ecclesiastical Order"
 oe_bp2_dec_synod_doctrine_review.desc: "Amid debates between Athonite monastic tradition and western conciliar theology, convene an imperial synod in Constantinople to rally behind patristic orthodoxy or sponsor scholarly East-West dialogue."
 oe_bp2_dec_synod_doctrine_review.a: "Reaffirm Athonite & Patristic Orthodoxy"
 oe_bp2_dec_synod_doctrine_review.a.tt: "Public Opinion +5, gains 'Banner of Athonite & Patristic Orthodoxy' for 10 years"
 oe_bp2_dec_synod_doctrine_review.b: "Sponsor East-West Patristic Scholarship"
 oe_bp2_dec_synod_doctrine_review.b.tt: "Advances Greek scholarly exchanges, improves Papal opinion (+15), gains 'East-West Patristic Scholarship' for 10 years"
 oe_bp2.1.t: "Magnate Demand for Hereditary Theme Command"
 oe_bp2.1.d: "Envoys of the empire's foremost magnate house have laid a formal petition before the Consistorium, claiming their kin have bled enough on the frontier to merit a hereditary patent over a thematic command. Granting it will quiet the generals for now, yet erode the crown's ancient right of appointment."
 oe_bp2.1.a: "Grant a Hereditary Patent to Placate the Magnates"
 oe_bp2.1.a.tt: "One non-hereditary Theme gains hereditary command (oe_tg_hereditary) and +12 recent loyalty; Strongest Magnate House Influence +40"
 oe_bp2.1.b: "Refuse Outright: Themes Belong to the Crown Alone"
 oe_bp2.1.b.tt: "Imperial Authority +5, Strongest Magnate House Influence -30, Themes led by noble houses lose 8 recent loyalty"
 oe_bp2.1.c: "Buy Off the Petition with a Temporary Stipend"
 oe_bp2.1.c.tt: "Public Opinion +3, Strongest Magnate House Influence -10"
 oe_bp2.2.t: "Noble Petition for Cadastre Tax Exemption"
 oe_bp2.2.d: "Hardly have the treasury surveyors submitted the new land cadastre than the leading magnate house petitions for an exemption on its vast estates, citing war damage and offering levies from its tenants in exchange."
 oe_bp2.2.a: "Grant Five Years of Exemption for Manpower & Goodwill"
 oe_bp2.2.a.tt: "Strongest Magnate House Influence +30, gains 'Magnate Estate Tax Exemption' for 5 years"
 oe_bp2.2.b: "Reject the Petition and Enforce the Imperial Cadastre"
 oe_bp2.2.b.tt: "Public Opinion +6, Strongest Magnate House Influence -35, gains 'Enforced Imperial Cadastre' for 5 years"
 oe_bp2.3.t: "Arbitration Between Rival Magnate Houses"
 oe_bp2.3.d: "Two of the empire's great houses stand at daggers drawn before the Senate over a disputed Thracian estate and a broken marriage compact. Both appeal to the throne, testing whether the crown will check the stronger house, mediate peace, or seize the prize itself."
 oe_bp2.3.a: "Award the Estate to the Rival House to Check the Dominant Magnates"
 oe_bp2.3.a.tt: "Imperial Authority +4, Strongest Magnate House Influence -45, Rival House Influence +35"
 oe_bp2.3.b: "Broker a Crown-Witnessed Marriage Settlement"
 oe_bp2.3.b.tt: "Both rival houses gain +15 Influence"
 oe_bp2.3.c: "Confiscate the Disputed Estates for the Imperial Fisc"
 oe_bp2.3.c.tt: "Public Opinion +4, Strongest Magnate House Influence -30, Rival House Influence -20"
 oe_bp2.4.t: "Scandal of Private Latin Mercenary Retinues"
 oe_bp2.4.d: "Imperial inspectors report that the foremost magnate house has quietly hired companies of Genoese crossbowmen and Latin lancers to garrison its private strongholds. Whispers of a palace coup already race through Constantinople."
 oe_bp2.4.a: "Order Immediate Disbandment and Seize the Armories"
 oe_bp2.4.a.tt: "Imperial Authority +7, Strongest Magnate House Influence -40"
 oe_bp2.4.b: "Buy Out Their Contracts and Absorb Them into the Tagmata"
 oe_bp2.4.b.tt: "Strongest Magnate House Influence -20, gains 'Absorbed Latin Tagma Retinues' for 6 years"
 oe_bp2.4.c: "Overlook the Scandal in Exchange for Frontier Levies"
 oe_bp2.4.c.tt: "Imperial Authority -5, Strongest Magnate House Influence +35"
 oe_bp2.5.t: "Empress's Kin Meddle in Consistorium Appointments"
 oe_bp2.5.d: "With the post of Grand Logothete vacant, the empress's relatives press the throne to appoint one of their own. Veteran ministers warn that yielding the chancellery to maternal kin will invite a dangerous in-law faction."
 oe_bp2.5.a: "Confirm the Consort's Kinsman as Logothete"
 oe_bp2.5.a.tt: "Imperial Authority -4, gains 'Consort-Kin Logothete' for 8 years"
 oe_bp2.5.b: "Rebuke In-Law Patronage and Appoint by Merit"
 oe_bp2.5.b.tt: "Imperial Authority +5, Public Opinion +4, gains 'Merit-Appointed Logothete' for 8 years"
 oe_bp2.6.t: "Purple Chamber Succession & In-Law Factions"
 oe_bp2.6.d: "Factions of the consort's kin and senior senators are quietly vying over the imperial heir's tutors and future guardianship. Settling the arrangement now can cement legitimacy or keep the heir strictly within palace hands."
 oe_bp2.6.a: "Swear Senate and Maternal Kin to a Joint Guardianship Oath"
 oe_bp2.6.a.tt: "Imperial Authority +4, gains 'Purple Chamber Guardianship Oath' for 10 years"
 oe_bp2.6.b: "Place the Heir Strictly Under Palace Scholars"
 oe_bp2.6.b.tt: "Imperial Authority +6, Strongest Magnate House Influence -20, gains 'Palace Scholarly Tutelage' for 10 years"
 oe_bp2.7.t: "Consort's House Finances the Imperial War Chest"
 oe_bp2.7.d: "At an opportune moment for the imperial treasury, the consort's kindred have dispatched coffers of gold and grain deeds to the palace, offering to underwrite military expenses or endow public granaries in the empress's name."
 oe_bp2.7.a: "Accept the War Chest and Grant Court Honors"
 oe_bp2.7.a.tt: "Imperial Authority -3, Strongest Magnate House Influence +25, gains 'Consort House War Subsidy' for 6 years"
 oe_bp2.7.b: "Convert Half into a Permanent Charitable Grain Fund"
 oe_bp2.7.b.tt: "Public Opinion +8, gains 'Empress's Charitable Grain Fund' for 6 years"
 oe_bp2.8.t: "Magnate Remonstrance Against the New Men"
 oe_bp2.8.d: "Smarting under fiscal audits led by crown-promoted bureaucrats, the great houses have presented a joint remonstrance in the Senate denouncing the 'new men' as lowborn upstarts subverting ancestral privilege."
 oe_bp2.8.a: "Stand Firmly Behind the New Men and Rebuke the Magnates"
 oe_bp2.8.a.tt: "Imperial Authority +6, Strongest Magnate House Influence -45"
 oe_bp2.8.b: "Dismiss a Scapegoat Collector to Calm the Lords"
 oe_bp2.8.b.tt: "Imperial Authority -4"
 oe_bp2.8.c: "Compromise with a Mixed Senate-Bureaucracy Audit Board"
 oe_bp2.8.c.tt: "Public Opinion +4, gains 'Mixed Senate-Bureaucracy Audit Board' for 6 years"
 oe_bp2.9.t: "Pillar Crisis: Faltering Authority & Urban Unrest"
 oe_bp2.9.d: "The Imperial Pillars are dangerously out of balance: crown authority has ebbed while angry crowds murmur across Constantinople's quarters. Decisive intervention is needed before unrest spirals into upheaval."
 oe_bp2.9.a: "Open the Imperial Granaries and Remit Hearth Taxes"
 oe_bp2.9.a.tt: "Public Opinion +12, Imperial Authority +5, gains 'Emergency Imperial Grain Dole' for 5 years"
 oe_bp2.9.b: "Deploy the Palace Guards to Enforce Martial Order"
 oe_bp2.9.b.tt: "Imperial Authority +10, Public Opinion -6, gains 'Palace Guard Martial Order' for 5 years"
 oe_bp2.9.c: "Address the Senate and Synod in Person to Rally Unity"
 oe_bp2.9.c.tt: "Imperial Authority +6, Public Opinion +6"
 oe_bp2.10.t: "Pillar Crisis: Oligarchic Capture by Twin Houses"
 oe_bp2.10.d: "Two magnate houses have simultaneously surpassed 600 influence, forming a tacit oligarchy across the Senate and provincial commands that threatens to reduce the throne to a figurehead."
 oe_bp2.10.a: "Play the Twin Oligarchs Against Each Other and Audit Their Estates"
 oe_bp2.10.a.tt: "Imperial Authority +6, Strongest Magnate House Influence -70, gains 'Shattered Magnate Oligarchy' for 6 years"
 oe_bp2.10.b: "Formalize a Senatorial Oligarchy Compact for Stability"
 oe_bp2.10.b.tt: "Imperial Authority -6, gains 'Senatorial Oligarchy Compact' for 8 years"
 oe_bp2.11.t: "Stefan Dušan's Secret Macedonian Bargain"
 oe_bp2.11.d: "With civil war raging, envoys of King Stefan Dušan of Serbia arrive with a covert proposition: grant Serbian caravans toll-free passage through the Macedonian passes and he will stall his southward push and cool toward the rebels."
 oe_bp2.11.a: "Grant Macedonian Toll Concessions to Stall Serbian Advance"
 oe_bp2.11.a.tt: "Serbia opinion +20; if the 1341 civil war tide is active, Tide -6 (favors the imperial court); gains 'Macedonian Transit Toll Concession' for 6 years"
 oe_bp2.11.b: "Reject Dušan's Extortion and Rally Orthodox Macedonia"
 oe_bp2.11.b.tt: "Serbia opinion -20, Public Opinion +8, gains 'Orthodox Defense of Macedonia' for 6 years"
 oe_bp2.12.t: "Turkish Mercenary Double-Cross in Thrace"
 oe_bp2.12.d: "Ottoman and Aydinid Turkish horsemen hired during the civil war have turned from allies into predators, burning Thracian villages and driving off captives. Commanders demand an immediate decision on these treacherous auxiliaries."
 oe_bp2.12.a: "Ransom the Captives and Escort the Raiders Back Across the Strait"
 oe_bp2.12.a.tt: "Public Opinion +10, Ottoman opinion -25"
 oe_bp2.12.b: "Harness Their Horsemen Against Domestic Rivals Despite the Plunder"
 oe_bp2.12.b.tt: "Public Opinion -10; shifts active civil war tide by -8 in the court's favor; gains 'Turkic Auxiliary Mercenary Pact' for 6 years"
 oe_bp2.12.c: "Ambush and Expel the Mutinous Bands by Force"
 oe_bp2.12.c.tt: "Imperial Authority +6, Ottoman and Aydinid opinion -25"
 oe_bp2.13.t: "Renegotiating the Pawned Crown Jewels in Venice"
 oe_bp2.13.d: "The imperial crown jewels pawned to Venice during the darkest days of civil war still rest in the vaults of San Marco, a lingering wound to Roman honor. With domestic peace restored and coin in the fisc, Venetian envoys have arrived to negotiate their redemption."
 oe_bp2.13.a: "Redeem the Imperial Crown Jewels in Full"
 oe_bp2.13.a.tt: "Redeems the crown jewels from Venice, Venice opinion +20, gains 'Imperial Crown Jewels Redeemed' for 20 years"
 oe_bp2.13.b: "Pledge Black Sea Customs Tariffs to Recover the Regalia"
 oe_bp2.13.b.tt: "Recovers the crown jewels on credit, Venice opinion +20, gains 'Venetian Customs Lien Settlement' for 15 years"
 oe_bp2.13.c: "Defer Redemption and Conserve Treasury Reserves"
 oe_bp2.13.c.tt: "Venice opinion -15"
 oe_bp2.14.t: "Post-War Amnesty & Theme Reconstruction Act"
 oe_bp2.14.d: "At last the fratricidal civil war is over, leaving scarred frontiers and suspicious thematic captains. The Consistorium presents three post-war settlements: generous amnesty, punitive confiscation, or a methodical reconstruction commission."
 oe_bp2.14.a: "Proclaim a General Amnesty to Heal the Themes"
 oe_bp2.14.a.tt: "Public Opinion +8, all Themes gain +12 recent loyalty, gains 'Post-War Amnesty & Reconciliation' for 10 years"
 oe_bp2.14.b: "Attaint Rebel Partisans and Confiscate Their Estates"
 oe_bp2.14.b.tt: "Imperial Authority +8, Strongest Magnate House Influence -60, gains 'Post-War Attainder & Confiscation' for 10 years"
 oe_bp2.14.c: "Establish a Theme Reconstruction Commission"
 oe_bp2.14.c.tt: "Imperial Authority +4, Public Opinion +4, all Themes gain +6 recent loyalty, gains 'Theme Reconstruction Commission' for 10 years"
 oe_bp2.15.t: "Final Reckoning with the Zealots of Thessalonica"
 oe_bp2.15.d: "Emerging from the storm of the Zealot uprising, Thessalonica stands at a crossroads. Harbor guilds demand a formal municipal charter, exiled aristocrats beg for crown troops to storm the White Tower, and Palamite clergy urge a mixed civic-senatorial settlement."
 oe_bp2.15.a: "Ending A: Grant the Charter of Municipal Autonomy"
 oe_bp2.15.a.tt: "Ends the commune turmoil in Thessaloniki and triggers the Municipal Autonomy Charter ending in 10 days"
 oe_bp2.15.b: "Ending B: Dispatch Crown Troops for Armed Suppression"
 oe_bp2.15.b.tt: "Ends the commune turmoil in Thessaloniki and triggers the Armed Suppression ending in 10 days"
 oe_bp2.15.c: "Ending C: Broker a Palamite Civic-Senate Reform"
 oe_bp2.15.c.tt: "Ends the commune turmoil in Thessaloniki and triggers the Civic-Senate Reform ending in 10 days"
 oe_bp2.16.t: "Thessalonica Ending: Charter of Municipal Autonomy"
 oe_bp2.16.d: "A chrysobull read before Saint Demetrios formally recognizes the fiscal autonomy of Thessaloniki's guilds and civic assembly. Shipyards and looms hum with renewed vigor as a native imperial trading powerhouse rises to rival Venice and Genoa."
 oe_bp2.16.a: "May Aegean Sails Enrich the Empire"
 oe_bp2.16.a.tt: "Thessaloniki gains 'Thessaloniki Chartered Free City' for 40 years; the empire gains 'Aegean Municipal Guild Charter' for 25 years"
 oe_bp2.17.t: "Thessalonica Ending: Armed Suppression & Crown Garrison"
 oe_bp2.17.d: "Thracian guardsmen and noble retainers stormed the gates and crushed the Zealot holdouts beneath the White Tower. Exiled magnates have reclaimed their mansions and imperial authority stands undisputed, though shattered docks will take decades to recover."
 oe_bp2.17.a: "Sedition Is Crushed; Imperial Law Prevails"
 oe_bp2.17.a.tt: "Imperial Authority +12; Thessaloniki gains 'White Tower Crown Garrison' for 40 years; the empire gains 'White Tower Iron Order' for 25 years"
 oe_bp2.18.t: "Thessalonica Ending: Civic-Senate Municipal Reform"
 oe_bp2.18.d: "Mediated by Gregory Palamas and patriarchal envoys, moderate guild deputies and local senators have formed a joint municipal council in Thessaloniki. Bloodshed is averted, and a durable model of urban governance and scholarship takes root."
 oe_bp2.18.a: "Anchor the Second City in Law and Reconciliation"
 oe_bp2.18.a.tt: "Public Opinion +8; Thessaloniki gains 'Thessaloniki Civic-Senate Council' for 40 years; the empire gains 'Saint Demetrios Civic Concord' for 25 years"
 oe_bp2.19.t: "Anatolia: Nomad Settlement & Rumelian Greek Revival"
 oe_bp2.19.d: "Imperial banners fly once more over inner Anatolia, confronting administrators with a lasting choice: restore military farmer estates and Greek-Roman parishes across the plateau, or settle Turkoman pastoralists through gentle taxation and pasture charters."
 oe_bp2.19.a: "Settle Stratiotai and Revive Anatolian Greek Parishes"
 oe_bp2.19.a.tt: "Gains 'Anatolian Stratiotai Revival' for 25 years; owned Smyrna/Ankara/Konya gain 'Anatolian Rumelian Revival Hub' for 25 years"
 oe_bp2.19.b: "Offer Tax Toleration and Settle the Highland Nomads Peacefully"
 oe_bp2.19.b.tt: "Gains 'Anatolian Frontier Settlement Peace' for 25 years; owned Smyrna/Ankara/Konya gain 'Anatolian Rumelian Revival Hub' for 25 years"
 oe_bp2.20.t: "Egypt: Coptic Conciliation & the Nile Granary"
 oe_bp2.20.d: "After seven centuries, Roman eagles fly once again over Alexandria and the Nile Delta. Coptic bishops ask that their ancient liturgical autonomy be respected to secure the grain fleet, while scholars urge reopening Alexandria's Greek academies."
 oe_bp2.20.a: "Recognize Coptic Liturgical Autonomy & Secure the Nile Granary"
 oe_bp2.20.a.tt: "Gains 'Coptic Liturgical Conciliation' for 25 years; owned Alexandria/Cairo gain 'Imperial Nile Valley Granary' for 25 years"
 oe_bp2.20.b: "Reopen the Alexandrian Mouseion & Classical Hellenism"
 oe_bp2.20.b.tt: "Gains 'Alexandrian Mouseion Revival' for 25 years; owned Alexandria/Cairo gain 'Imperial Nile Valley Granary' for 25 years"
 oe_bp2.21.t: "Italy: Ravenna Exarchate & Bilingual Roman Law"
 oe_bp2.21.d: "With key Italian seats restored to Roman rule, jurists assemble at Ravenna. The Italian communes prize their municipal charters and Latin statutes, whereas imperial jurists press to enforce Constantinople's Basilica Code directly."
 oe_bp2.21.a: "Charter Bilingual Latin-Greek Law & Municipal Liberties"
 oe_bp2.21.a.tt: "Gains 'Ravenna Bilingual Municipal Charter' for 25 years; owned Ravenna/Rome gain 'Ravenna Exarchate Chancery Hub' for 25 years"
 oe_bp2.21.b: "Enforce the Basilica Code Across the Exarchate"
 oe_bp2.21.b.tt: "Gains 'Exarchate Basilica Law Enforcement' for 25 years; owned Ravenna/Rome gain 'Ravenna Exarchate Chancery Hub' for 25 years"
 oe_bp2.22.t: "Gaul: Gallo-Roman Senators & Western Administration"
 oe_bp2.22.d: "Roman banners have crossed the Alps into ancient Gaul. From Marseille to Lyon and Paris, Latin nobles await the empire's settlement: will Constantinople revive the Gallo-Roman senatorial compact or impose uniform imperial chancery rule?"
 oe_bp2.22.a: "Charter the Gallic Prefecture & Admit Latin Senators"
 oe_bp2.22.a.tt: "Gains 'Gallo-Roman Senatorial Compact' for 25 years; owned Marseille/Lyon/Paris gain 'Gallic Praetorian Diocese Seat' for 25 years"
 oe_bp2.22.b: "Mandate Imperial Chancery Law & Gallic Theme Levies"
 oe_bp2.22.b.tt: "Gains 'Gallic Imperial Chancery Administration' for 25 years; owned Marseille/Lyon/Paris gain 'Gallic Praetorian Diocese Seat' for 25 years"
 oe_bp2.23.t: "Anti-Unionist Patriarchal Unrest & Athonite Protest"
 oe_bp2.23.d: "The church union has ignited fierce resistance: monks of Mount Athos denounce the compromise as betrayal, and congregations boycott Hagia Sophia wherever the union liturgy is read. The crown walks a razor's edge between western aid and domestic upheaval."
 oe_bp2.23.a: "Enforce the Union Liturgy and Detain Athonite Dissidents"
 oe_bp2.23.a.tt: "Public Opinion -8, Papal opinion +25, gains 'Enforced Union Western Aid Accord' for 10 years"
 oe_bp2.23.b: "Quietly Permit Traditional Orthodox Rites in Parishes"
 oe_bp2.23.b.tt: "Public Opinion +6, Papal opinion -15, gains 'Quiet Preservation of Orthodox Rites' for 10 years"
 oe_bp2.24.t: "Florence Synod Nuances: Filioque & Purgatory"
 oe_bp2.24.d: "Council debates have deadlocked over the Filioque clause and Purgatory. Humanist scholars like Bessarion propose a patristic compromise ('through the Son'), while Mark of Ephesus insists not a syllable of the Nicene Creed may be altered."
 oe_bp2.24.a: "Adopt the 'Through the Son' Formula & Patronize Greek Scholars"
 oe_bp2.24.a.tt: "Adds to Greek scholarly exchanges in Italy, Papal opinion +20, gains 'Florence Humanist Theological Bridge' for 12 years"
 oe_bp2.24.b: "Stand with Mark of Ephesus on the Unaltered Nicene Creed"
 oe_bp2.24.b.tt: "Public Opinion +6, Papal opinion -15, gains 'Stand of Mark of Ephesus' for 12 years"
 oe_bp2.25.d_autocephaly: "Dispatches from the north confirm the worst: citing Constantinople's church union, the Rus' synod has already proclaimed ecclesiastical autocephaly and rejected Constantinople's metropolitan. The empire must decide between northern alliance and canonical primacy."
 oe_bp2.25.d_default: "News of Constantinople's church union has sparked outrage across Moscow and the Rus' lands, where northern bishops are preparing to consecrate their own metropolitan without patriarchal approval. The throne must decide how to meet this northern ecclesiastical ripple."
 oe_bp2.25.t: "Ripple in the North: Autocephaly of the Russian Metropolitanate"
 oe_bp2.25.a: "Recognize Russian Ecclesiastical Autonomy for a Northern Accord"
 oe_bp2.25.a.tt: "Imperial Authority -5, Rus' states opinion +25, gains 'Northern Autocephaly Strategic Accord' for 15 years"
 oe_bp2.25.b: "Uphold Ecumenical Primacy and Condemn Unilateral Consecration"
 oe_bp2.25.b.tt: "Imperial Authority +6, Rus' states opinion -25, gains 'Ecumenical Patriarchal Primacy Asserted' for 15 years"
 oe_bp2.26.t: "Triumph of the Orthodox Pentarchy"
 oe_bp2.26.d: "Without bowing to Rome, the empire has recovered the ancient seats of the Pentarchy by its own strength and faith. Bells thunder beneath the dome of Hagia Sophia as delegates from across the Mediterranean proclaim the triumph of the Orthodox Roman Empire."
 oe_bp2.26.a: "Convene the Great Synod in Hagia Sophia to Proclaim Pentarchy Triumph"
 oe_bp2.26.a.tt: "Imperial Authority +12, Public Opinion +10, gains permanent modifier 'Triumph of the Orthodox Pentarchy'"
 oe_bp2.26.b: "Proclaim a Universal Pentarchy Charter of Learning & Mercy"
 oe_bp2.26.b.tt: "Public Opinion +12, gains permanent modifier 'Universal Pentarchy Charter of Learning'"
