 STATIC_MODIFIER_DESC_oe_col4_ce_cashcrop_mod: "Lucrative tobacco and cocoa cultivation supercharges maritime exports and workshop output, diverting some arable acreage away from staple grains."
 STATIC_MODIFIER_DESC_oe_col4_ce_plantation_mod: "Sugar, coffee, and wheat estates pour raw commodities into Atlantic trade networks, at the price of growing social friction among colonial estates."
 STATIC_MODIFIER_DESC_oe_col4_ce_ranching_mod: "Vast Eurasian herds transform American plains into thriving overland trade and light-cavalry breeding grounds, though frontier ranchers chafe at central authority."
 STATIC_MODIFIER_DESC_oe_col4_ce_staple_boom_mod: "Potatoes and maize dramatically expand caloric output across marginal soils, accelerating population growth while empowering rural estates."
 STATIC_MODIFIER_DESC_oe_col4_crown_enclave_mod: "Retaining fortified overseas anchorages extends fleet reach and maritime commerce, at the cost of stretched metropolitan administrative control."
 STATIC_MODIFIER_DESC_oe_col4_survivor_resilience_mod: "Communities that weathered the Great Pestilence develop enduring immunological and demographic resilience, though devastated tax networks recover slowly."
 STATIC_MODIFIER_DESC_oe_col4_syncretic_governor_mod: "Drawing governors from local creole and indigenous elites wins broad domestic estate harmony and regional diplomacy, while widening autonomy from the distant metropole."
 STATIC_MODIFIER_DESC_oe_col4_viceroy_charter_mod: "Transforming an armed conquistador expedition into a civil viceroyalty brings rapid control and settlement growth, though rough frontier justice strains diplomatic standing."
 STATIC_MODIFIER_DESC_oe_col4_viceroy_grant_mod: "Freshly consolidated provinces bolster colonial administration and loyalty to the Crown, though fiscal integration temporarily softens tax yields."
 STATIC_MODIFIER_NAME_oe_col4_ce_cashcrop_mod: "Transoceanic Cash-Crop Boom"
 STATIC_MODIFIER_NAME_oe_col4_ce_plantation_mod: "Colonial Plantation Boom"
 STATIC_MODIFIER_NAME_oe_col4_ce_ranching_mod: "Frontier Horse & Cattle Ranches"
 STATIC_MODIFIER_NAME_oe_col4_ce_staple_boom_mod: "New World Staple Harvest"
 STATIC_MODIFIER_NAME_oe_col4_crown_enclave_mod: "Crown Maritime Enclaves"
 STATIC_MODIFIER_NAME_oe_col4_survivor_resilience_mod: "Post-Pestilence Resilience"
 STATIC_MODIFIER_NAME_oe_col4_syncretic_governor_mod: "Syncretic Colonial Governance"
 STATIC_MODIFIER_NAME_oe_col4_viceroy_charter_mod: "Newly Chartered Viceroyalty"
 STATIC_MODIFIER_NAME_oe_col4_viceroy_grant_mod: "Viceregal Territorial Charter"
 oe_col4.1.a: "Transfer all newly conquered regional lands to [target_colony.GetName]"
 oe_col4.1.a.tt: "Hands over all non-core overseas holdings in this region to your primary regional colonial nation, boosting its loyalty and administrative control."
 oe_col4.1.b: "Retain coastal ports for the Crown; transfer the interior"
 oe_col4.1.b.tt: "Transfers inland holdings to your regional colonial nation while keeping coastal anchorages directly under Crown control."
 oe_col4.1.c: "Keep direct metropolitan administration over all holdings"
 oe_col4.1.c.tt: "Retains every newly conquered territory directly under your own administration."
 oe_col4.1.d: "Our armies have secured new territories across the sea within the same colonial theater already governed by [target_colony.GetName]. Rather than leaving fragmented enclaves stranded under distant metropolitan clerks, our colonial council proposes consolidating the frontier under a unified regional administration."
 oe_col4.1.t: "Administering Newly Conquered Overseas Territories"
 oe_col4.10.a: "Call upon the clan elders to endure the storm"
 oe_col4.10.d: "Strange fevers carried along distant coastal trade routes have erupted across our hunting grounds and river towns. Elders warn that outlying hamlets cannot be sustained if the sickness lingers."
 oe_col4.10.t: "The Great Pestilence Strikes Our Villages"
 oe_col4.11.a: "Abandon the stricken frontier and regroup the survivors"
 oe_col4.11.a.tt: "Abandons the devastated frontier location, returning it to uncolonized wilderness while stabilizing surviving clans."
 oe_col4.11.b: "Send grain and healers to hold the ancestral ground"
 oe_col4.11.b.tt: "Spends treasury and stability to keep the location inhabited."
 oe_col4.11.d: "Fever has decimated the outlying settlement of [depop_loc.GetName]. The surviving families plead to gather their belongings and retreat toward our stronger central villages before winter falls."
 oe_col4.11.t: "Outlying Settlement Emptied by Pestilence"
 oe_col4.12.a: "Disperse into a migratory society to survive"
 oe_col4.12.a.tt: "Converts the realm into a mobile pop-based society."
 oe_col4.12.b: "Remain anchored beside our remaining sacred hearths"
 oe_col4.12.d: "With our permanent towns shattered by waves of pestilence, war chiefs and shamans debate folding our tents and dispersing into a mobile confederacy across the open frontier."
 oe_col4.12.t: "Return to the Migratory Path"
 oe_col4.13.a: "Rebuild stronger from the ashes"
 oe_col4.13.d: "At long last the terrible fevers recede from our valleys. A hardened generation raised amid calamity now rebuilds council houses, gardens, and alliances across the surviving homelands."
 oe_col4.13.t: "Dawn After the Great Pestilence"
 oe_col4.20.a: "Issue the Royal Charter — establish a Colonial Viceroyalty"
 oe_col4.20.a.tt: "Converts the peacetime conquistador army state into a landed Colonial Nation with founding treasury and administrative bonuses."
 oe_col4.20.b: "Keep the expedition under arms for further frontier campaigns"
 oe_col4.20.b.tt: "Postpones civil conversion for five years so the conquistador may launch further wars."
 oe_col4.20.d: "Our armed expedition under [conq_subject.GetName] has laid down its weapons after carving out a foothold across the ocean. Rather than letting military adventurers linger indefinitely as a roving army state, the Crown may now issue a royal charter establishing a formal civil Colonial Nation."
 oe_col4.20.t: "Chartering a Formal Colonial Viceroyalty"
 oe_col4.21.a: "Uphold Metropolitan Governors (Recommended)"
 oe_col4.21.a.tt: "Aligns current and future governors with your overlord's metropolitan culture."
 oe_col4.21.b: "Embrace Local Syncretic Governance"
 oe_col4.21.b.tt: "Permits diverse local governors and grants domestic estate harmony at the expense of overlord loyalty."
 oe_col4.21.d: "As our colonial assembly convenes to seat a new governor, metropolitan officials urge restricting high office strictly to statesmen of the motherland's culture, whereas local planters advocate welcoming syncretic native-born leadership."
 oe_col4.21.t: "Colonial Governor Appointment Policy"
 oe_col4.30.a: "Champion Potatoes & Maize to banish famine"
 oe_col4.30.a.tt: "Introduces potatoes or maize to a climatically suitable non-precious Old World province and grants a 10-year staple harvest boom."
 oe_col4.30.b: "Charter Tobacco & Cocoa cash-crop estates"
 oe_col4.30.b.tt: "Introduces tobacco or cocoa to a warm non-precious Old World province and grants a 10-year commercial boom."
 oe_col4.30.d: "Botanical chests arriving from transoceanic voyages carry hardy American tubers, golden maize, fragrant tobacco leaves, and cacao pods. Royal agronomists await your directive on which crop program should receive crown land grants and tax exemptions."
 oe_col4.30.t: "Columbian Exchange: Acclimatizing New World Crops"
 oe_col4.31.a: "Expand Eurasian Horse & Cattle Ranches"
 oe_col4.31.a.tt: "Introduces horses or livestock to a climatically suitable non-precious American province and boosts frontier cavalry and overland trade."
 oe_col4.31.b: "Establish Sugar, Coffee & Wheat Estates"
 oe_col4.31.b.tt: "Introduces sugar, coffee, or wheat to a suitable non-precious American province and boosts colonial commodity exports."
 oe_col4.31.d: "Transatlantic caravels have unloaded Andalusian breeding stallions, hardy cattle herds, sugar cane cuttings, and highland coffee saplings along our American ports. Colonial governors seek your charter to shape the frontier's agrarian economy."
 oe_col4.31.t: "Columbian Exchange: Eurasian Livestock & Plantations"
 oe_col4_cab_botanical_acclimatization: "Transoceanic Botanical Acclimatization"
 oe_col4_cab_botanical_acclimatization_action: "Acclimatizing Transoceanic Crops"
 oe_col4_cab_botanical_acclimatization_action_progress: "Acclimatizing Crops"
 oe_col4_cab_botanical_acclimatization_action_progress_tooltip: "Royal botanists are steadily adapting New and Old World crops across our territories, sustaining higher food and raw-material output."
 oe_col4_cab_botanical_acclimatization_action_progress_wordier: "Acclimatizing Transoceanic Crops & Livestock"
 oe_col4_cab_botanical_acclimatization_active: "Transoceanic Botanical Acclimatization Active"
 oe_col4_cab_botanical_acclimatization_desc: "Commission royal botanists and colonial agronomists to acclimatize newly discovered crops and livestock across metropolitan and overseas soils, boosting food output and settler migration at modest fiscal expense."
 oe_col4_confederate_chiefdom: "Confederate Chiefdom"
 oe_col4_confederate_chiefdom_desc: "A loose council of allied clans bound by kinship and ritual diplomacy. It rallies fierce tribal levies and fosters neighborly mediation, yet forbids permanent territorial annexation in peace treaties until society centralizes."
 oe_col4_dec_consolidate_overseas.a: "Review regional colonial consolidation"
 oe_col4_dec_consolidate_overseas.desc: "Streamline imperial overseas governance by transferring scattered overseas holdings to your primary colonial subject in the same region, or carving out strategic Crown port stations."
 oe_col4_dec_consolidate_overseas.title: "Consolidate Overseas Colonial Enclaves"
 oe_col4_dec_import_new_world_crops.a: "Fund botanical expeditions and seed nurseries"
 oe_col4_dec_import_new_world_crops.desc: "From the Age of Reformation onward, sponsor royal estates and agrarian guilds to introduce American potatoes, maize, tobacco, or cocoa into climatically suited Old World provinces without displacing precious mines or spice monopolies."
 oe_col4_dec_import_new_world_crops.title: "Columbian Exchange: Acclimatize New World Crops"
 oe_col4_dec_introduce_old_world_livestock.a: "Charter overseas breeding studs and plantations"
 oe_col4_dec_introduce_old_world_livestock.desc: "Sponsor transoceanic breeding studs and estate charters in the Americas, introducing Eurasian horses, cattle, sugar, coffee, or wheat to suitable New World climates while preserving precious mineral seams."
 oe_col4_dec_introduce_old_world_livestock.title: "Columbian Exchange: Introduce Eurasian Livestock & Estates"
 oe_col4_pestilence_collapse: "Great Pestilence Frontier Collapse"
 oe_col4_pestilence_collapse_desc: "Old World epidemics sweep through indigenous confederacies, emptying outlying villages and forcing surviving bands to contract toward core settlements or return to migratory life."
