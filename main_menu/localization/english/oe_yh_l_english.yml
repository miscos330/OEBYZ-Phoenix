 oe_yh.1.t: "Fang Guozhen Takes to the Sea"
 oe_yh.1.desc_x: "#F In the eighth Zhizheng year (1348) Fang Guozhen of Huangyan in Taizhou took to the sea with the Fang brothers and their men, seized the grain ships and closed the sea route (so the usual account, History of Yuan, 41).#!\n\nNow word comes from the coast of eastern Zhejiang: Fang Guozhen has gathered men at sea, and the grain ships cannot leave Liujiagang. Send troops after Fang, or grant Fang an office?"
 oe_yh.1.a: "Send troops after Fang"
 oe_yh.1.a.tt: "Costs #R 1#! month of trade and tax income\nUntil the end of 1350 the sea route is blocked: each May only six tenths of the sea grain reaches the capital."
 oe_yh.1.b: "Pardon Fang and grant an office"
 oe_yh.1.b.tt: "The sea route stays open. Should Fang later hold land and turn on the court, the route will be blocked again."
 oe_yh.2.t: "The Grain Fleet Arrives"
 oe_yh.2.desc_wt3r1n: "#F Under the Yuan the grain of the south went north by sea, loaded at Liujiagang and landed at Zhigu. In the second Tianli year (1329) 3.34 million shi arrived; in the first Zhizheng year (1341) the three southern provinces together sent only 2.8 million, and the next year 2.6 million (History of Yuan, 93, 97).#!\n\nThis May #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_arrive')|0]#! ten-thousand shi reached the capital: #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_sea')|0]#! by sea, #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_canal')|0]#! by the canal, #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_farm')|0]#! from the farms of the capital area and #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_warlord')|0]#! sent by the south. The capital's granaries hold #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#! ten-thousand shi; at the capital's use of #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#! a month that lasts about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#! months. The granaries are full. The sea route is blocked, and many ships do not arrive. This is the first grain Zhang Shicheng has sent to the capital."
