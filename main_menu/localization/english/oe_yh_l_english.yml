e.ScriptValue('oe_yh_rd_d4')|0]  .3 [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_d3')|0]  .2 [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_d2')|0]  .1 state [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_st1')|0]  .6 state [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_st6')|0]  last .5 [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_m5')|0]  last event [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_last_ev')|0]  end code [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_end')|0]\n#T Other lines and vanilla#!\nsuppression phase [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_phase')|0]  suppression start S [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_s')|0]  paper-money tier [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_yc')|0]  flags [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_flags')|0]  Dadu province food % [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_pfood')|0]  Dadu market food % [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_mfood')|0]\n(tier: 3 plenty 2 as usual 1 short 0 famine; route: 2 open 1 blocked 0 cut; Fang: 0 not yet 1 at sea 2 pardoned 3 rebelled again; Zhang: 0 none 1 sent 2 delivered 3 refused 4 given up; farms: 0 none 1 working 2 lost; .1/.6: 1 sent 2 lapsed; flags: see the notes)"
 oe_yh.90.a: "Close"
