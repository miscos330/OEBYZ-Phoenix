 oe_yh.2.a: "So be it"
 oe_yh.2.a.tt: "The capital uses #Y 21#! ten-thousand shi a month; the granary has four tiers by the months it lasts:\nPlenty (a year or more): peasants' target satisfaction #G +5%#!\nShort (three to five months): peasants #R −5%#!; unrest in Dadu #R +0.25#!; every May the suppression's momentum #R −2#! and court opinion #R −2#! (with Toqto'a in charge)\nFamine (under three months): peasants #R −10%#!, burghers #R −5%#!, legitimacy #R −0.05#! a month; unrest in Dadu #R +0.5#!, population growth #R −0.2%#!; every May the suppression's momentum #R −5#! and the princes' loyalty #R −2#!"
 oe_yh.3.t: "Grain from Zhang Shicheng"
 oe_yh.3.desc_hs: "#F In the nineteenth Zhizheng year (1359) the court sent the Minister of War Bayan Temür and the Minister of Revenue Cao Lüheng with imperial wine and dragon robes for Zhang Shicheng, and put Dashi Temür, chancellor of Jiangzhe, in charge of the sea transport: Zhang was to send grain, Fang Guozhen to provide the ships. The next May 110,000 shi reached the capital (History of Yuan, 97).#!\n\nNow Zhang Shicheng holds the court's titles and the lands of Suzhou and Songjiang (allegiance #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!). If envoys order Zhang to send grain, the chance that Zhang obeys is about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%. Ships for the grain can be found."
 oe_yh.3.desc_hn: "#F In the nineteenth Zhizheng year (1359) the court sent the Minister of War Bayan Temür and the Minister of Revenue Cao Lüheng with imperial wine and dragon robes for Zhang Shicheng, and put Dashi Temür, chancellor of Jiangzhe, in charge of the sea transport: Zhang was to send grain, Fang Guozhen to provide the ships. The next May 110,000 shi reached the capital (History of Yuan, 97).#!\n\nNow Zhang Shicheng holds the court's titles and the lands of Suzhou and Songjiang (allegiance #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!). If envoys order Zhang to send grain, the chance that Zhang obeys is about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%. But there are no ships: Fang Guozhen has not come over, and Ningbo is not in the court's hands. This year nothing can be done."
 oe_yh.3.desc_gs: "#F Under the Yuan the capital lived on the grain of the south, carried north by sea every year. The lands around Suzhou and Songjiang are where it is loaded.#!\n\nNow Zhang Shicheng holds the court's titles and the lands of Suzhou and Songjiang (allegiance #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!). If envoys order Zhang to send grain, the chance that Zhang obeys is about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%. Ships for the grain can be found."
 oe_yh.3.desc_gn: "#F Under the Yuan the capital lived on the grain of the south, carried north by sea every year. The lands around Suzhou and Songjiang are where it is loaded.#!\n\nNow Zhang Shicheng holds the court's titles and the lands of Suzhou and Songjiang (allegiance #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_wuual')|0]#!). If envoys order Zhang to send grain, the chance that Zhang obeys is about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_p3_sv')|0]#!%. But there are no ships: Fang Guozhen has not come over, and Ningbo is not in the court's hands. This year nothing can be done."
 oe_yh.3.a: "Send envoys with wine and dragon robes: Zhang to send grain, Fang to provide ships"
 oe_yh.3.a.tt: "Costs #R 1#! month of trade and tax income\nA roll at the chance above. Success: this May the south sends #G +11#! ten-thousand shi (one more each later year, at most #Y 13#!); Zhang's allegiance #R −5#!; the suppression's momentum #G +2#! and court opinion #G +2#! (with Toqto'a in charge).\nFailure: Zhang makes excuses, and the matter comes back next month."
 oe_yh.3.b: "Send no one this year"
 oe_yh.3.b.tt: "No grain from the south this year."
 oe_yh.4.t: "Zhang Shicheng Makes Excuses"
 oe_yh.4.desc_h2: "#F In the ninth month of the twenty-third Zhizheng year (1363) the court sent envoys for grain again, and Zhang Shicheng made excuses and gave none. The grain of the south-east stopped reaching the capital in that year (History of Yuan, 97).#!\n\nNow Zhang Shicheng drifts away from the court (Wu's allegiance is below fifty), and this year's grain will not come."
 oe_yh.4.desc_h1: "#F In the ninth month of the twenty-third Zhizheng year (1363) the court sent envoys for grain again, and Zhang Shicheng made excuses and gave none. The grain of the south-east stopped reaching the capital in that year (History of Yuan, 97).#!\n\nNow the envoys sent for grain come back empty-handed: Zhang Shicheng pleads storms at sea and empty granaries."
 oe_yh.4.desc_g2: "#F The warlords of the south took the court's titles, but they did not always send their grain north: every shipload was pay for their own soldiers.#!\n\nNow Zhang Shicheng drifts away from the court (Wu's allegiance is below fifty), and this year's grain will not come."
 oe_yh.4.desc_g1: "#F The warlords of the south took the court's titles, but they did not always send their grain north: every shipload was pay for their own soldiers.#!\n\nNow the envoys sent for grain come back empty-handed: Zhang Shicheng pleads storms at sea and empty granaries."
 oe_yh.4.a: "Win Zhang back with higher titles"
 oe_yh.4.a.tt: "Costs #R 2#! months of trade and tax income\nZhang's allegiance #G +15#!; grain can be asked of Zhang again next February."
 oe_yh.4.b: "Let it be"
 oe_yh.4.b.tt: "No more grain is asked of Zhang until Wu leaves the court and comes over again."
 oe_yh.5.t: "Famine in the Capital"
 oe_yh.5.desc_h: "#F In the eighteenth Zhizheng year (1358) the capital suffered a great famine and an epidemic; the eunuch Bak Bulhwa paid for the burial of the dead (so it is said, History of Yuan, 45, 204).#!\n\nNow the capital's granaries hold #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#! ten-thousand shi; at the capital's use of #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#! a month that lasts about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#! months. Rice is dear, and people are dying of hunger in the city."
 oe_yh.5.desc_g: "#F The people of the capital live on grain from elsewhere: once the grain routes fail, famine is at the gates.#!\n\nNow the capital's granaries hold #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_grain')|0]#! ten-thousand shi; at the capital's use of #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_use')|0]#! a month that lasts about #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yh_rd_months')|0]#! months. Rice is dear, and people are dying of hunger in the city."
 oe_yh.5.a: "Sell from the granaries cheaply, and buy grain to refill them"
 oe_yh.5.a.tt: "Costs #R 3#! months of trade and tax income\nThe granary #G +30#! ten-thousand shi."
 oe_yh.5.b: "Sell from the granaries cheaply, and buy grain with paper notes"
 oe_yh.5.b.tt: "Costs #R 5#! months of trade and tax income\nThe paper money has collapsed and the merchants refuse notes: buying grain costs more.\nThe granary #G +30#! ten-thousand shi."
 oe_yh.5.c: "Order the temples and the rich to give grain"
 oe_yh.5.c.tt: "The granary #G +20#! ten-thousand shi."
 oe_yh.5.d: "Shut the gates and wait"
 oe_yh.5.d.tt: "Unrest in Dadu #R +0.3#! for #Y 12#! months (#bold #color_yellow Gates Shut on the Hungry#!#!)."
 oe_yh.6.t: "Farms in the Capital Area"
 oe_yh.6.desc_ht: "#F In the twelfth Zhizheng year (1352) the chancellor Toqto'a had a branch Office of Agriculture set up around the capital and brought men of the south who knew paddy farming to work the land: from the Western Hills to Baoding and Hejian, to Tan and Shun in the north and Qianminzhen in the east (so the usual account, History of Yuan, 138, 43).#!\n\nNow the granaries hang on the sea route, and the sea route grows harder every year. Farms around the capital would need a large sum first. The chancellor Toqto'a presses for it."
 oe_yh.6.desc_hx: "#F In the twelfth Zhizheng year (1352) the chancellor Toqto'a had a branch Office of Agriculture set up around the capital and brought men of the south who knew paddy farming to work the land: from the Western Hills to Baoding and Hejian, to Tan and Shun in the north and Qianminzhen in the east (so the usual account, History of Yuan, 138, 43).#!\n\nNow the granaries hang on the sea route, and the sea route grows harder every year. Farms around the capital would need a large sum first."
 oe_yh.6.desc_gt: "#F The capital's grain all comes from the south. Some propose to open paddy fields around the capital and grow it close at hand.#!\n\nNow the granaries hang on the sea route, and the sea route grows harder every year. Farms around the capital would need a large sum first. The chancellor Toqto'a presses for it."
 oe_yh.6.desc_gx: "#F The capital's grain all comes from the south. Some propose to open paddy fields around the capital and grow it close at hand.#!\n\nNow the granaries hang on the sea route, and the sea route grows harder every year. Farms around the capital would need a large sum first."
 oe_yh.6.a: "Set up the branch Office of Agriculture and bring farmers from the south"
 oe_yh.6.a.tt: "Costs #R 6#! months of trade and tax income\nFrom now on the farms send #G +40#! ten-thousand shi each May (the Yuan must own and control Dadu and at least #Y 10#! places of the capital area; lost, they go to waste).\nMonthly food output of the Shuntian and Tongzhou prefectures #G +10%#! (#bold #color_yellow Farms of the Capital Area#!#!, #Y 30#! years)."
 oe_yh.6.b: "No"
 oe_yh.6.b.tt: "The capital goes on living on the south."
 oe_yh.20.t: "Sea transport and grain: the choice takes effect"
 oe_yh.90.t: "[TEST] Sea transport and grain: readings"
