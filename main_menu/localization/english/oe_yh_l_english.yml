 STATIC_MODIFIER_NAME_oe_yh_full: "The Capital's Granaries Full"
 STATIC_MODIFIER_NAME_oe_yh_short: "Grain Short in the Capital"
 STATIC_MODIFIER_NAME_oe_yh_famine: "Famine in the Capital"
 STATIC_MODIFIER_NAME_oe_yh_short_dadu: "Dear Rice"
 STATIC_MODIFIER_NAME_oe_yh_famine_dadu: "The Starving in the Streets"
 STATIC_MODIFIER_NAME_oe_yh_closed: "Gates Shut on the Hungry"
