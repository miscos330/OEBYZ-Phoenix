 oe_spqr_cab_mare_nostrum_staple_action_progress_tooltip:0 "Dispatch a Senatorial Maritime Commissioner to coordinate convoy protection, harbor customs, and arsenal slipways in a coastal province—boosting sea trade efficiency, maritime presence, local trade power, and shipbuilding speed."
 oe_spqr_cab_mare_nostrum_staple_select_province:0 "Select a Coastal Province for Maritime Staple Commission"
 oe_spqr_cab_mare_nostrum_staple_no_provinces:0 "@trigger_no! No eligible coastal provinces available for Maritime Staple Commission."
 oe_spqr_law_consular_imperium:0 "Consular Imperium & Dictatorship Code"
 oe_spqr_law_consular_imperium_desc:0 "Defines the supreme executive magistracy of the revived Roman Republic—balancing annual collegiate accountability between two Consuls against wartime emergency dictatorship or the lifetime preeminence of a Princeps Senatus."
 oe_spqr_pol_dual_consuls:0 "Annual Dual Consuls"
 oe_spqr_pol_dual_consuls_desc:0 "Two co-equal Consuls hold reciprocal veto and step down each year, safeguarding republican tradition, legislative consensus, and diplomatic trust while restraining unchecked executive centralization."
 oe_spqr_pol_dictator_mandate:0 "Wartime Dictator Emergency Mandate"
 oe_spqr_pol_dictator_mandate_desc:0 "Codifies rapid senatorial appointment of a supreme wartime Dictator and Master of Horse during existential crises—sharpening army discipline, siegecraft, and morale at a steady cost to republican tradition."
 oe_spqr_pol_princeps_senatus:0 "Perpetual Princeps Senatus"
 oe_spqr_pol_princeps_senatus_desc:0 "Elevates the foremost statesman of the Senate to lifelong moral and administrative primacy—like Augustus or a Venetian Doge writ grand—delivering high cabinet efficiency, central control, and crown leverage while curbing popular assemblies."
 oe_spqr_law_civitas_romana:0 "Civitas Romana Franchise Code"
 oe_spqr_law_civitas_romana_desc:0 "Determines who shares full Roman citizenship across the peninsula and Mediterranean—from an exclusive circle of ancient patrician families to an Italian Socii federation or a universal Mediterranean commonwealth."
 oe_spqr_pol_patrician_franchise:0 "Exclusive Patrician Franchise"
 oe_spqr_pol_patrician_franchise_desc:0 "Restricts full voting rolls and high magistracies to registered patrician and merchant-oligarch families, tightening tax collection and noble stability while slowing integration of newly acquired provinces."
 oe_spqr_pol_italian_socii:0 "Italian Socii Confederation"
 oe_spqr_pol_italian_socii_desc:0 "Extends municipal Roman citizenship to federated Italian communes from the Alps to Sicily, expanding citizen manpower, cultural cohesion, and urban promotion at a modest fiscal trade-off."
 oe_spqr_pol_universal_med_civitas:0 "Universal Mediterranean Citizenship"
 oe_spqr_pol_universal_med_civitas_desc:0 "Inspired by the Constitutio Antoniniana, grants Roman legal standing to free inhabitants of every province from Hispania to Alexandria—maximizing assimilation, tolerance, and reduced separatism despite conservative noble resentment."
 oe_spqr_law_proconsular_admin:0 "Proconsular Provincial Governance Code"
 oe_spqr_law_proconsular_admin_desc:0 "Regulates how the Republic governs its overseas Mare Nostrum provinces—whether through autonomous commercial proconsuls, senatorial oversight committees, or direct praetorian centralization from Rome."
 oe_spqr_pol_commercial_proconsuls:0 "Autonomous Commercial Proconsuls"
 oe_spqr_pol_commercial_proconsuls_desc:0 "Grants overseas proconsuls wide latitude over local ports, customs houses, and merchant courts—raising subject loyalty, diplomatic capacity, and maritime trade while easing central administrative grasp."
 oe_spqr_pol_senatorial_oversight:0 "Senatorial Proconsular Oversight"
 oe_spqr_pol_senatorial_oversight_desc:0 "Pairs every proconsular governor with a senatorial quaestor auditing accounts and road upkeep, balancing subject obedience, naval logistics, and integration speed across the Mediterranean."
 oe_spqr_pol_praetorian_direct:0 "Direct Praetorian Rule"
 oe_spqr_pol_praetorian_direct_desc:0 "Subordinates provincial governors directly to Rome's urban praetors and treasury clerks, maximizing direct tax extraction, control, and crown authority at the cost of restive overseas subjects."
 oe_spqr_law_senate_banks:0 "Senate, Public Credit & Maritime Banks Code"
 oe_spqr_law_senate_banks_desc:0 "Governs the nexus between republican politics and Mediterranean high finance—choosing between a Casa di San Giorgio public-debt consortium, broad guild-merchant democracy, or state-directed grain and naval arsenals."
 oe_spqr_pol_san_giorgio_credit:0 "San Giorgio & Public Credit Consortium"
 oe_spqr_pol_san_giorgio_credit_desc:0 "Entrusts state debt servicing and port customs bonds to a federated Senate bank modeled on Genoa's Casa di San Giorgio and Florence's gold florin—lowering interest, expanding loan capacity, and enriching trade at burgher-oligarch clout."
 oe_spqr_pol_guild_merchant_demo:0 "Guild-Merchant Democracy"
 oe_spqr_pol_guild_merchant_demo_desc:0 "Opens municipal councils to artisan guilds, cloth weavers, and small shipowners alongside great bankers—driving production efficiency, research, and estate harmony at slightly lighter direct taxation."
 oe_spqr_pol_grain_naval_dole:0 "State Grain & Naval Arsenal Dole"
 oe_spqr_pol_grain_naval_dole_desc:0 "Channels Mediterranean grain tariffs directly into Roman public granaries and Venetian-style state shipyards—securing abundant food, faster shipbuilding, and naval sailors while taxing private merchant margins."
 oe_msn_spqr_a1_italian_republican_league:0 "Forge the Italian Republican League"
 oe_msn_spqr_a1_italian_republican_league_desc:0 "Across the lagoons, Tuscan hills, and Adriatic cliffs, Italy's maritime communes rediscover the ancient strength of federated civic [trade|e] and republican solidarity."
 oe_msn_spqr_a1_italian_republican_league_req_tt:0 "Be an eligible Italian Republic with 5 Stability, and hold 4 locations, 120 Gold, or a Wharf."
 oe_msn_spqr_a2_maritime_rival_supremacy:0 "Maritime Republic Rival Supremacy"
 oe_msn_spqr_a2_maritime_rival_supremacy_desc:0 "For generations Venice, Genoa, Pisa, and Florence bled each other for Adriatic and Tyrrhenian mastery. Uniting two great republican hubs bends Italy's rival [navy|e] yards to one purpose."
 oe_msn_spqr_a2_maritime_rival_supremacy_req_tt:0 "Control (directly or via subjects) at least 2 major Italian maritime hubs (Venice, Genoa, Pisa, Florence, Dubrovnik, Ancona, Naples, Palermo), have ports, and hold 15 Navy Tradition or a Dock/Shipyard."
 oe_msn_spqr_a3_lombardy_tuscany:0 "Secure Lombardy & Tuscany"
 oe_msn_spqr_a3_lombardy_tuscany_desc:0 "Breaking the Lombard signori at Milan while securing the Arno workshops of Tuscany places Northern Italy's richest armories, looms, and banking [market|e] securely under the Republic."
 oe_msn_spqr_a3_lombardy_tuscany_req_tt:0 "Own or have subjects own Milan alongside Florence, Pisa, or Siena."
 oe_msn_spqr_a4_unite_italy:0 "Unite the Italian Peninsula"
 oe_msn_spqr_a4_unite_italy_desc:0 "From the Po valley through Rome down to Naples and Sicily's grain ports, the entire peninsula stands freed of foreign dynasts under unified consular [control|e]."
 oe_msn_spqr_a4_unite_italy_req_tt:0 "Own or have subjects own Rome, Naples, and Palermo."
 oe_msn_spqr_b1_cola_di_rienzo:0 "Heed Cola di Rienzo's Call"
 oe_msn_spqr_b1_cola_di_rienzo_desc:0 "When the Roman Tribune proclaims liberty upon the ruined Capitoline steps in 1347, our Republic answers the call—reviving classical [prestige|e] and claiming the mantle of Italy's civic rebirth."
 oe_msn_spqr_b1_cola_di_rienzo_req_tt:0 "Back Cola di Rienzo via decision/event, control Rome, or reach 1365 while keeping the republican flame alive."
 oe_msn_spqr_b2_enter_eternal_city:0 "Enter the Eternal City"
 oe_msn_spqr_b2_enter_eternal_city_desc:0 "Our banners pass beneath the Aurelian Walls and climb the Via Sacra past the Arch of Titus. Holding Rome restores the living [core|e] heart of classical antiquity."
 oe_msn_spqr_b2_enter_eternal_city_req_tt:0 "Own or have subjects own Rome and maintain at least 5 Stability."
 oe_msn_spqr_b3_convene_roman_senate:0 "Convene the Roman Senate"
 oe_msn_spqr_b3_convene_roman_senate_desc:0 "In the restored Curia Julia, senators from Venice, Genoa, Florence, and Rome take their marble seats, uniting patricians and plebeians under formal [parliament|e] law."
 oe_msn_spqr_b3_convene_roman_senate_req_tt:0 "Control Rome with 10 Stability, and either adopt the Roman Senate parliament, proclaim S.P.Q.R., or reach 65 Republican Tradition."
 oe_msn_spqr_b4_nova_res_publica:0 "Proclaim Nova Res Publica Romana"
 oe_msn_spqr_b4_nova_res_publica_desc:0 "Bronze eagles rise above the Capitol as Italy's republics merge into an Empire-rank Nova Res Publica Romana—proving that a sovereign [republic|e] can rival every crowned Caesar."
 oe_msn_spqr_b4_nova_res_publica_req_tt:0 "Enact the Proclaim Nova Res Publica Romana (S.P.Q.R.) decision while controlling Rome."
 oe_msn_spqr_c1_proconsul_africa:0 "Proconsul of Africa"
 oe_msn_spqr_c1_proconsul_africa_desc:0 "Crossing the Sicilian narrows to seize Tunis and the ancient Punic shore secures the central Mediterranean narrows and opens the African grain [trade|e] to Rome once again."
 oe_msn_spqr_c1_proconsul_africa_req_tt:0 "Charter the Proconsulate of Africa, or own/have subjects own Tunis, Bizerte, or Tripoli."
 oe_msn_spqr_c2_proconsul_west:0 "Proconsuls of Hispania & Gallia"
 oe_msn_spqr_c2_proconsul_west_desc:0 "Planting the consular fasces along Marseille, Narbonne, and Barcelona turns the Gulf of Lion and Balearic waters into an uncontested western republican [navy|e] bastion."
 oe_msn_spqr_c2_proconsul_west_req_tt:0 "Charter Gallia or Hispania, or own/have subjects own Barcelona, Marseille, or Valencia."
 oe_msn_spqr_c3_proconsul_graecia:0 "Proconsul of Illyria & Graecia"
 oe_msn_spqr_c3_proconsul_graecia_desc:0 "From Dalmatian ports and Crete to Athens and Thessaloniki, our galleys secure the Aegean archipelagos and reunite Graeco-Roman learning under republican [subjects|e]."
 oe_msn_spqr_c3_proconsul_graecia_req_tt:0 "Charter Illyria & Graecia, or own/have subjects own Athens, Thessaloniki, or Candia."
 oe_msn_spqr_c4_proconsul_orient:0 "Proconsuls of Asia & Aegyptus"
 oe_msn_spqr_c4_proconsul_orient_desc:0 "Reaching Smyrna, Antioch, and Alexandria restores the ancient breadbasket of the Nile and the Levantine spice terminus—completing Mare Nostrum's eastern [market|e] arc."
 oe_msn_spqr_c4_proconsul_orient_req_tt:0 "Charter Asia or Syria & Aegyptus, or own/have subjects own Alexandria, Antioch, or Smyrna."
 oe_msn_spqr_d1_papal_question:0 "Resolve the Papal Question"
 oe_msn_spqr_d1_papal_question_desc:0 "No Roman Republic can rest while spiritual and temporal jurisdictions collide across the Tiber. Sealing the Lateran Concordat or sending the Curia to Avignon defines civic [stability|e]."
 oe_msn_spqr_d1_papal_question_req_tt:0 "Resolve the Papal Question decision in Rome (or witness the Papal State dissolved)."
 oe_msn_spqr_d2_two_romes:0 "Dialogue of Two Romes"
 oe_msn_spqr_d2_two_romes_desc:0 "Across the Aegean stands the Second Rome of Constantine. Whether forged into a Twin-Rome Mediterranean Accord or settled beneath the Theodosian Walls, our [prestige|e] rewrites Roman destiny."
 oe_msn_spqr_d2_two_romes_req_tt:0 "Resolve the Dialogue of Two Romes event with Byzantium (or control Constantinople / witness Byzantium fallen)."
 oe_msn_spqr_d3_black_sea_med_hegemony:0 "Black Sea–Mediterranean Trade Hegemony"
 oe_msn_spqr_d3_black_sea_med_hegemony_desc:0 "Unifying Venetian arsenals, Genoese Gazaria ports, and Black Sea grain routes—and even linking with Teutonic Pontus if knights hold Crimea—crowns our unbroken two-sea [trade|e] supremacy."
 oe_msn_spqr_d3_black_sea_med_hegemony_req_tt:0 "Unify the Roman Maritime Bank, trigger the Black Sea Grain Pact, see Teutonic Pontus established, or control Kaffa or Constantinople."
 oe_msn_spqr_d4_spqr_eternal:0 "Senatus Populusque Romanus Eternal"
 oe_msn_spqr_d4_spqr_eternal_desc:0 "From the Alps and Pillars of Hercules to the Nile and Bosphorus, proconsular fleets and free municipal assemblies guard an immortal Roman [republic|e] shining across every age."
 oe_msn_spqr_d4_spqr_eternal_req_tt:0 "Proclaim Nova Res Publica Romana, hold Rome with 15 Stability, and command at least 3 active Proconsulates or 85 locations (including subjects)."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_lex_agraria:0 "Lex Agraria & Civitas Romana"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_lex_agraria:0 "Broadened Roman municipal citizenship and protected civic smallholdings accelerate integration and food abundance."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_classis_mare:0 "Classis Mare Nostrum Admiralty"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_classis_mare:0 "Joint Mediterranean republican shipyards field formidable war galleys and dominate coastal sea lanes."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_scu_decree:0 "Senatus Consultum Ultimum Mobilization"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_scu_decree:0 "Emergency consular command steels the citizen legions and walls of the Republic against external peril."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pi_via_consularis:0 "Via Consularis & Harbor Commission"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pi_via_consularis:0 "Paved consular roads and deep-water republican wharves knit peninsula and sea into one rapid administrative network."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_patrician_seats:0 "Patrician Cursus Honorum"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_patrician_seats:0 "Confirmed senatorial offices satisfy patrician families and polish diplomatic authority while trimming noble tax caps."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_equestrian_cmd:0 "Equestrian Officer Commissions"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_equestrian_cmd:0 "Dedicated equestrian commanders bolster military leadership and provincial obedience while softening direct crown leverage."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_san_giorgio:0 "Republican Public Credit Charter"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_san_giorgio:0 "Guaranteed public bonds enrich banking houses and lower state borrowing rates at a slight burgher tax concession."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_free_ports:0 "Mediterranean Free-Port Pact"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_free_ports:0 "Lower harbor transit tolls draw shipping across the basin while slightly easing direct tax receipts."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_plebeian_grain:0 "Annona Civic Grain Dole"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_plebeian_grain:0 "Subsidized grain reserves calm popular unrest and nurture civic prosperity at a mild rural tax offset."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pa_basilica_endow:0 "Civic Basilica & Charity Endowment"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pa_basilica_endow:0 "Patronage of Italian basilicas and hospices earns clerical goodwill and civic prestige at modest tax relief."
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_senate:0 "Senatorial Decree Enactment"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_senate:0 "Magistrates and senatorial clerks are recording the newly enacted constitutional law upon bronze tablets in the Forum."
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_burghers:0 "Maritime Guild Statute Transition"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_burghers:0 "Port consuls, banking houses, and shipwright guilds align their ledgers to the Republic's revised commercial statute."
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_plebs:0 "Comitia Civic Franchise Transition"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_plebs:0 "Tribunes and municipal censors enroll newly franchised citizens across Italian communes under the updated civic statute."
 STATIC_MODIFIER_NAME_oe_spqr_mod_law_tr_state:0 "Consular Executive Transition"
 STATIC_MODIFIER_DESC_oe_spqr_mod_law_tr_state:0 "Lictors and praetorian commissioners enforce tighter central authority across the Republic's armies and provinces."
 STATIC_MODIFIER_NAME_oe_spqr_mod_rienzo_league:0 "Tribune's Classical Republican League"
 STATIC_MODIFIER_DESC_oe_spqr_mod_rienzo_league:0 "Answering Cola di Rienzo's clarion call from the Capitol rallies Italian civic pride, diplomatic reach, and republican fervor."
 STATIC_MODIFIER_NAME_oe_spqr_mod_dictator_ultimum:0 "Senatus Consultum Ultimum: Wartime Dictator"
 STATIC_MODIFIER_DESC_oe_spqr_mod_dictator_ultimum:0 "Invested with the twenty-four fasces for five perilous years, our Dictator commands unified legions and relentless siege trains."
 STATIC_MODIFIER_NAME_oe_spqr_mod_constitutio_antoniniana:0 "Constitutio Antoniniana: Extended Civitas"
 STATIC_MODIFIER_DESC_oe_spqr_mod_constitutio_antoniniana:0 "Extending full Roman municipal franchise across Italy and our Mediterranean ports accelerates integration, cultural harmony, and provincial loyalty."
 STATIC_MODIFIER_NAME_oe_spqr_mod_roman_maritime_bank:0 "United Roman Maritime Bank (Stato & San Giorgio)"
 STATIC_MODIFIER_DESC_oe_spqr_mod_roman_maritime_bank:0 "Merging Venetian Arsenal ledgers, Genoese Casa di San Giorgio bonds, and Pisan-Tuscan exchanges creates the supreme financial clearinghouse of Mare Nostrum."
 STATIC_MODIFIER_NAME_oe_spqr_mod_proconsul_charter:0 "Chartered Roman Proconsulate"
 STATIC_MODIFIER_DESC_oe_spqr_mod_proconsul_charter:0 "Fresh consular roads, harbor courts, and Roman municipal charters anchor a newly chartered Mare Nostrum proconsulate."
 STATIC_MODIFIER_NAME_oe_spqr_mod_proconsul_network_1:0 "Mare Nostrum Proconsular Network (I)"
 STATIC_MODIFIER_DESC_oe_spqr_mod_proconsul_network_1:0 "Overseas proconsulates channel customs dues, grain convoys, and naval timber back to Rome's Senate."
 STATIC_MODIFIER_NAME_oe_spqr_mod_proconsul_network_2:0 "Mare Nostrum Proconsular Network (II)"
 STATIC_MODIFIER_DESC_oe_spqr_mod_proconsul_network_2:0 "Three or more proconsular provinces ring the Mediterranean with loyal republican harbors and grain fleets."
 STATIC_MODIFIER_NAME_oe_spqr_mod_proconsul_network_3:0 "Mare Nostrum Proconsular Imperium (III)"
 STATIC_MODIFIER_DESC_oe_spqr_mod_proconsul_network_3:0 "Five or more great proconsulates turn the entire Mediterranean back into a Roman lake of law, commerce, and fleets."
 STATIC_MODIFIER_NAME_oe_spqr_mod_rienzo_fervor:0 "Capitoline Tribune's Call"
 STATIC_MODIFIER_DESC_oe_spqr_mod_rienzo_fervor:0 "Cola di Rienzo's speeches invoking Cicero and Scipio kindle civic enthusiasm across Italian council halls."
 STATIC_MODIFIER_NAME_oe_spqr_mod_rienzo_pragmatic:0 "Measured Italian Civic Diplomacy"
 STATIC_MODIFIER_DESC_oe_spqr_mod_rienzo_pragmatic:0 "Treating Roman revolutionary rhetoric with steady statecraft reassures Italian neighbors and commercial partners."
 STATIC_MODIFIER_NAME_oe_spqr_mod_ven_stato_mar_spqr:0 "Serenissima Fleet of the New Senate"
 STATIC_MODIFIER_DESC_oe_spqr_mod_ven_stato_mar_spqr:0 "Venice's Arsenal slipways and Adriatic convoy fleets pledge their winged-lion banners to a Mediterranean Roman Republic."
 STATIC_MODIFIER_NAME_oe_spqr_mod_ven_grand_council_commerce:0 "Great Council Maritime Monopoly"
 STATIC_MODIFIER_DESC_oe_spqr_mod_ven_grand_council_commerce:0 "The Great Council channels classical republican prestige directly into spice auctions, glassworks, and Levant shipping."
 STATIC_MODIFIER_NAME_oe_spqr_mod_gen_san_giorgio_gazaria:0 "Casa di San Giorgio & Gazaria Charter"
 STATIC_MODIFIER_DESC_oe_spqr_mod_gen_san_giorgio_gazaria:0 "Genoese financiers link Black Sea Caffa and Ligurian harbors through sovereign public-credit bonds."
 STATIC_MODIFIER_NAME_oe_spqr_mod_gen_crossbow_marines:0 "Ligurian Naval & Crossbow Cohorts"
 STATIC_MODIFIER_DESC_oe_spqr_mod_gen_crossbow_marines:0 "Genoese shipmasters pair veteran crossbow companies with swift war galleys to contest every Mediterranean strait."
 STATIC_MODIFIER_NAME_oe_spqr_mod_tuscan_renaissance_spqr:0 "Tuscan & Adriatic Civic Humanism"
 STATIC_MODIFIER_DESC_oe_spqr_mod_tuscan_renaissance_spqr:0 "Scholars, architects, and maritime republics from Pisa and Florence to Siena, Lucca, Ragusa, and Ancona revive classical Roman civic virtue."
 STATIC_MODIFIER_NAME_oe_spqr_mod_meloria_vengeance:0 "Vengeance for Meloria: Tyrrhenian Revival"
 STATIC_MODIFIER_DESC_oe_spqr_mod_meloria_vengeance:0 "Remembering the 1284 battle off Meloria, proud Tuscan and Adriatic seamen forge an indomitable republican war fleet and citizen militia."
 STATIC_MODIFIER_NAME_oe_spqr_mod_spqr_proclaimed_civic:0 "Senatus Populusque Romanus: Civic Restoration"
 STATIC_MODIFIER_DESC_oe_spqr_mod_spqr_proclaimed_civic:0 "Proclaimed atop the Capitoline Hill, the revived Roman Republic inspires civic pride, legislative vigor, and unwavering republican law across Europe."
 STATIC_MODIFIER_NAME_oe_spqr_mod_spqr_proclaimed_eagles:0 "Aquilae Redivivae: Eagles of the New Republic"
 STATIC_MODIFIER_DESC_oe_spqr_mod_spqr_proclaimed_eagles:0 "Bronze eagles gleam once more before the consular legions as Nova Res Publica Romana marches to reclaim Mare Nostrum."
 STATIC_MODIFIER_NAME_oe_spqr_mod_lateran_concordat:0 "Lateran Republican Concordat"
 STATIC_MODIFIER_DESC_oe_spqr_mod_lateran_concordat:0 "Guaranteeing the Pope's spiritual enclave at St. Peter's while securing civic Rome for the Senate reconciles Catholic Christendom with S.P.Q.R."
 STATIC_MODIFIER_NAME_oe_spqr_mod_secular_capitol:0 "Secular Sovereignty of the Capitol"
 STATIC_MODIFIER_DESC_oe_spqr_mod_secular_capitol:0 "Expelling papal temporal rule back toward Avignon frees Rome's magistrates to pursue secular jurisprudence, humanist scholarship, and civic revenue."
 STATIC_MODIFIER_NAME_oe_spqr_mod_march_on_constantinople:0 "Crusade Against Eastern Autocracy"
 STATIC_MODIFIER_DESC_oe_spqr_mod_march_on_constantinople:0 "Denouncing imperial autocracy on the Bosporus fires our consular armies and siege galleys with fierce republican zeal."
 STATIC_MODIFIER_NAME_oe_spqr_mod_twin_romes_accord_spqr:0 "Twin Romes Mediterranean Accord (West)"
 STATIC_MODIFIER_DESC_oe_spqr_mod_twin_romes_accord_spqr:0 "Recognizing Constantinople as sister guardian of the East opens seamless maritime trade, joint defense, and diplomatic stature from Gibraltar to the Golden Horn."
 STATIC_MODIFIER_NAME_oe_spqr_mod_twin_romes_accord_byz:0 "Twin Romes Mediterranean Accord (East)"
 STATIC_MODIFIER_DESC_oe_spqr_mod_twin_romes_accord_byz:0 "An enduring concord with the revived Roman Republic in Italy secures New Rome's western maritime flank and enriches Aegean-Italian trade."
 STATIC_MODIFIER_NAME_oe_spqr_mod_byz_autocrat_defiance:0 "Basileus Defiant: One Emperor, One Rome"
 STATIC_MODIFIER_DESC_oe_spqr_mod_byz_autocrat_defiance:0 "Rejecting Western republican claims to the Roman title steels the garrisons and imperial pride of Constantinople."
 STATIC_MODIFIER_NAME_oe_spqr_mod_cincinnatus_virtue:0 "Virtue of Cincinnatus: Return of the Fasces"
 STATIC_MODIFIER_DESC_oe_spqr_mod_cincinnatus_virtue:0 "Voluntarily laying down emergency dictatorial powers after victory enshrines constitutional liberty and earns universal admiration."
 STATIC_MODIFIER_NAME_oe_spqr_mod_caesar_imperium:0 "Temptation of Caesar: Imperator's Ascendancy"
 STATIC_MODIFIER_DESC_oe_spqr_mod_caesar_imperium:0 "Crossing the Rubicon of constitutional restraint concentrates dazzling battlefield command and imperial prestige in one iron hand."
 STATIC_MODIFIER_NAME_oe_spqr_mod_teu_pontus_grain_pact:0 "Roman-Teutonic Pontus Grain & Amber Pact"
 STATIC_MODIFIER_DESC_oe_spqr_mod_teu_pontus_grain_pact:0 "Linking Roman Mediterranean convoys directly to the Teutonic Pontus-Krim harbors channels steppe grain, northern amber, and silk across two seas."
 STATIC_MODIFIER_NAME_oe_spqr_mod_gazaria_grain_fleet:0 "Unified Gazaria & Black Sea Grain Fleet"
 STATIC_MODIFIER_DESC_oe_spqr_mod_gazaria_grain_fleet:0 "Chartered merchant galleys ply the Crimean and Aegean waters continuously, guaranteeing abundant grain and surging maritime customs."
 STATIC_MODIFIER_NAME_oe_spqr_mod_med_silk_staple:0 "Mediterranean Silk & Naval Staple"
 STATIC_MODIFIER_DESC_oe_spqr_mod_med_silk_staple:0 "Fortified strait factories and war-galley patrols lock down high-value Eastern silk and spice revenues for the Senate treasury."
 STATIC_MODIFIER_NAME_oe_spqr_mod_civitas_golden_age:0 "Golden Age of Civitas Romana"
 STATIC_MODIFIER_DESC_oe_spqr_mod_civitas_golden_age:0 "Marble forums, humanist academies, and bustling free ports flourish from Milan and Venice to Carthage and Alexandria beneath shared Roman law."
 STATIC_MODIFIER_NAME_oe_spqr_mod_pax_republica_trade:0 "Pax Res Publica Commercial Renaissance"
 STATIC_MODIFIER_DESC_oe_spqr_mod_pax_republica_trade:0 "Stable republican jurisprudence and unified coinage ignite unprecedented banking, craft output, and maritime trade across Italy."
 STATIC_MODIFIER_NAME_oe_spqr_mod_sit_spqr_triumph:0 "Triumph of the Revived Roman Republic"
 STATIC_MODIFIER_DESC_oe_spqr_mod_sit_spqr_triumph:0 "Outlasting princes, empires, and curial bans, S.P.Q.R. stands restored as the defining republican colossus of the Mediterranean."
 STATIC_MODIFIER_NAME_oe_spqr_mod_sit_papal_victory:0 "Curial & Princely Order Preserved"
 STATIC_MODIFIER_DESC_oe_spqr_mod_sit_papal_victory:0 "Having weathered the classical republican storm, Rome's traditional ecclesiastical and princely hierarchy reasserts steady sway over Italy."
 STATIC_MODIFIER_NAME_oe_spqr_mod_sit_legacy_civic:0 "Enduring Legacy of the Forum"
 STATIC_MODIFIER_DESC_oe_spqr_mod_sit_legacy_civic:0 "Centuries of civic statutes, humanist rhetoric, and maritime assemblies leave an indelible republican stamp upon our statecraft."
 STATIC_MODIFIER_NAME_oe_spqr_mod_sit_legacy_naval:0 "Masters of the Classical Sea Lanes"
 STATIC_MODIFIER_DESC_oe_spqr_mod_sit_legacy_naval:0 "Shipyards, bankers, and admirals carry forward the maritime momentum forged during the struggle for Italy and Rome."
 STATIC_MODIFIER_NAME_oe_spqr_mod_msn_italian_unity:0 "Federated Peninsula of Italia"
 STATIC_MODIFIER_DESC_oe_spqr_mod_msn_italian_unity:0 "From Alpine passes to the Sicilian straits, every Italian commune answers the consular fasces in prosperous civic unity."
 STATIC_MODIFIER_NAME_oe_spqr_mod_msn_mare_nostrum_west:0 "Western Mare Nostrum Dominion"
 STATIC_MODIFIER_DESC_oe_spqr_mod_msn_mare_nostrum_west:0 "Carthage, Barcelona, and Marseille anchor the western basin beneath Roman maritime patrols and merchant convoys."
 STATIC_MODIFIER_NAME_oe_spqr_mod_msn_mare_nostrum_east:0 "Eastern Mare Nostrum Hegemony"
 STATIC_MODIFIER_DESC_oe_spqr_mod_msn_mare_nostrum_east:0 "From Athens and Smyrna to Antioch and Alexandria, the spice and silk arteries of the Levant flow into the Roman treasury."
 STATIC_MODIFIER_NAME_oe_spqr_mod_msn_spqr_eternal:0 "Senatus Populusque Romanus Eternal"
 STATIC_MODIFIER_DESC_oe_spqr_mod_msn_spqr_eternal:0 "Across Italy, Gaul, Hispania, Africa, Greece, Asia, and Egypt, the Senate and People of Rome stand reborn as an immortal maritime empire of free citizens."
