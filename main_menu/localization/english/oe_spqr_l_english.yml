 oe_spqr_cab_consular_legions:0 "Consular Legionary Mustering"
 oe_spqr_cab_consular_legions_desc:0 "Assign a senior martial magistrate to drill citizen infantry, regulate condottieri contracts, and muster consular cohorts across our Italian municipalities—raising discipline, manpower, and levy recruitment speed at modest army upkeep."
 oe_spqr_cab_consular_legions_action:0 "Consular Legionary Mustering"
 oe_spqr_cab_consular_legions_active:0 "Active: Consular Legionary Mustering"
 oe_spqr_cab_consular_legions_action_progress:0 "Active"
 oe_spqr_cab_consular_legions_action_progress_wordier:0 "Consular Legionary Mustering (Active)"
 oe_spqr_cab_consular_legions_action_progress_tooltip:0 "Assign a senior martial magistrate to drill citizen infantry, regulate condottieri contracts, and muster consular cohorts across our Italian municipalities—raising discipline, manpower, and levy recruitment speed at modest army upkeep."
 oe_spqr_cab_mare_nostrum_staple:0 "Mare Nostrum Maritime Staple Commission"
 oe_spqr_cab_mare_nostrum_staple_desc:0 "Dispatch a Senatorial Maritime Commissioner to coordinate convoy protection, harbor customs, and arsenal slipways in a coastal province—boosting sea trade efficiency, maritime presence, local trade power, and shipbuilding speed."
 oe_spqr_cab_mare_nostrum_staple_action:0 "Mare Nostrum Maritime Staple Commission: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_spqr_cab_mare_nostrum_staple_active:0 "Mare Nostrum Maritime Staple Commission in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_spqr_cab_mare_nostrum_staple_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
