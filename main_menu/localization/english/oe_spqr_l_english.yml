 OE_SPQR_PROV_AFRICA_ADJ:0 "Afro-Roman"
 OE_SPQR_PROV_GRAECIA:0 "Proconsulate of Illyria & Graecia"
 OE_SPQR_PROV_GRAECIA_ADJ:0 "Graeco-Illyrian"
 OE_SPQR_PROV_ASIA:0 "Proconsulate of Asia"
 OE_SPQR_PROV_ASIA_ADJ:0 "Asiatic-Roman"
 OE_SPQR_PROV_ORIENT:0 "Proconsulate of Syria & Aegyptus"
 OE_SPQR_PROV_ORIENT_ADJ:0 "Oriens-Roman"
 oe_spqr_pi_lex_agraria_civitas:0 "Lex Agraria & Civitas Franchise"
 oe_spqr_pi_lex_agraria_civitas_desc:0 "Enact a Gracchan-inspired agrarian and civic charter extending Roman citizenship and smallholding protections across Italian municipalities—lifting population growth, cultural assimilation, and food yields while slightly curbing patrician privileges."
 oe_spqr_pi_classis_mare_nostrum:0 "Classis Mare Nostrum Fleet Act"
 oe_spqr_pi_classis_mare_nostrum_desc:0 "Authorize pooled Venetian, Genoese, and Tyrrhenian shipyard contracts under senatorial admiralty oversight, boosting war galley power, maritime trade efficiency, and naval presence across the Mediterranean at elevated naval upkeep."
 oe_spqr_pi_senatus_consultum_ultimum:0 "Senatus Consultum Ultimum Readiness"
 oe_spqr_pi_senatus_consultum_ultimum_desc:0 "Empower the Consuls by final senatorial decree to ensure the Republic suffers no harm, hardening army discipline, land morale, and fortress defense while demanding stern civic vigilance over republican liberties."
 oe_spqr_pi_via_consularis_ports:0 "Via Consularis & Free-Port Infrastructure"
 oe_spqr_pi_via_consularis_ports_desc:0 "Commission paved consular highways linking Rome to the northern and Adriatic ports alongside stone quays and customs warehouses, accelerating road construction, provincial control, and trade volume."
 oe_spqr_pa_patrician_senate_seats:0 "Patrician Cursus Honorum Confirmation"
 oe_spqr_pa_patrician_senate_seats_desc:0 "Guarantee senatorial magistracy precedence for established patrician houses in return for Senate support."
 oe_spqr_pa_equestrian_proconsul_commissions:0 "Equestrian & Proconsular Command Charters"
 oe_spqr_pa_equestrian_proconsul_commissions_desc:0 "Commission equestrian officers to lead frontier garrisons and proconsular audits in exchange for noble backing."
 oe_spqr_pa_san_giorgio_staple_charter:0 "San Giorgio & Arsenal Credit Charter"
 oe_spqr_pa_san_giorgio_staple_charter_desc:0 "Guarantee public debt repayments and merchant bank privileges to rally urban guilds in the Senate."
 oe_spqr_pa_mediterranean_free_ports:0 "Mediterranean Free-Port Customs Pact"
 oe_spqr_pa_mediterranean_free_ports_desc:0 "Lower staple transit dues for Italian and Levantine merchant convoys to win burgher deputies' votes."
 oe_spqr_pa_plebeian_tribune_grain:0 "Tribune of the Plebs & Civic Grain Dole"
 oe_spqr_pa_plebeian_tribune_grain_desc:0 "Fund public granaries and confirm tribunician protections for citizens and smallholders in the Comitia."
 oe_spqr_pa_lateran_basilica_endowment:0 "Capitoline & Civic Basilica Endowment"
 oe_spqr_pa_lateran_basilica_endowment_desc:0 "Endow municipal cathedrals, hospitals, and Roman basilicas to reconcile clergy with the Republican Senate."
 oe_spqr_cab_census_civitas:0 "Census & Civitas Romana Extension"
 oe_spqr_cab_census_civitas_desc:0 "Dispatch Republican Censors to register households, verify civic rolls, and extend Roman municipal franchise across a target province—accelerating cultural assimilation, provincial integration, and administrative control."
 oe_spqr_cab_census_civitas_action:0 "Census & Civitas Romana Extension: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_spqr_cab_census_civitas_active:0 "Census & Civitas Romana Extension in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_spqr_cab_census_civitas_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
