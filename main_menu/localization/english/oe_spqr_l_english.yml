 OE_SPQR_SIT_P3:0 "#color_orange Banners on the Capitol#!"
 OE_SPQR_SIT_P4:0 "#G Nova Res Publica Romana#!"
 OE_SPQR_SIT_LEGEND_TITLE:0 "Mediterranean Republican Theater Legend"
 OE_SPQR_SIT_LEGEND_DESC:0 "Country color: Proclaimed Nova Res Publica Romana (S.P.Q.R.); Green: Italian Maritime & City Republics and chartered Proconsular Provinces; Red: Papal State & Italian princely/monarchical rivals; Amber: Mediterranean powers watching the Capitol."
 oe_spqr_sit_map_spqr_tt:0 "Proclaimed Nova Res Publica Romana (S.P.Q.R.)."
 oe_spqr_sit_map_proconsul_tt:0 "Chartered Roman Proconsular Province of Mare Nostrum."
 oe_spqr_sit_map_rep_tt:0 "Italian Maritime or City Republic carrying the classical republican banner."
 oe_spqr_sit_map_pap_tt:0 "Papal or princely power contesting republican unity in Italy."
 oe_spqr_sit_map_nbr_tt:0 "Mediterranean or European power watching the Roman Revival."
 oe_msn_60_spqr:0 "#bold #color_yellow S.P.Q.R.: Ultimate Revival of the Roman Republic#!#!"
 oe_msn_60_spqr_DESCRIPTION:0 "Shared flagship destiny for Venice, Genoa, Pisa, Florence, Siena, Lucca, Ragusa, Ancona, and any Italian republic: unite Italy, climb the Capitol, charter 6 Mare Nostrum Proconsuls, and converse with Constantinople."
 oe_msn_60_spqr_CRITERIA_DESCRIPTION:0 "Forge the Italian Republican League, secure Lombardy, Tuscany, Rome, and Sicily, convene the Roman Senate, proclaim Empire-rank Nova Res Publica Romana, charter Mare Nostrum Proconsulates, settle the Papal and Two Romes questions, and crown S.P.Q.R. Eternal."
 oe_msn_60_spqr_BUTTON_TOOLTIP:0 "Embark on the S.P.Q.R. Roman Republic Revival Destiny"
 oe_msn_60_spqr_BUTTON_DETAILS:0 "A sixteen-task four-branch flagship tree shared by all Italian Maritime & City Republics: Maritime Republic Ascendancy across Italy, Return to the Capitol and Empire-rank S.P.Q.R., Six Mare Nostrum Proconsular Provinces, and the Papal Question, Dialogue of Two Romes, and Black Sea–Mediterranean Trade Hegemony."
 oe_spqr.1.title:0 "1347: Cola di Rienzo Proclaims the Roman Republic!"
 oe_spqr.1.desc:0 "With the Popes lingering in distant Avignon, a charismatic Roman notary named Cola di Rienzo has climbed the steps of the Capitoline Hill clad in white silk and proclaimed the Good Estate—invoking the ancient Senate and People of Rome and summoning every Italian commune to send envoys to a united Italian Republic."
 oe_spqr.1.a:0 "Hail the Tribune and embrace the classical republican dream!"
 oe_spqr.1.b:0 "Dispatch cautious envoys while securing our municipal trade"
 oe_spqr.2.title:0 "Debate of the Venetian Great Council: Lion of St. Mark & Roman Eagle"
 oe_spqr.2.desc:0 "Inside the Doge's Palace, patrician senators debate whether the Most Serene Republic should anchor its Stato da Màr fleets to the grand dream of a revived Roman Republic across Italy, or concentrate its Arsenal shipyards and Levant convoys on pure Adriatic commercial monopoly."
 oe_spqr.2.a:0 "Commit the Venetian Arsenal to a Roman Mare Nostrum!"
 oe_spqr.2.b:0 "Safeguard Great Council commerce and Levantine spice auctions"
 oe_spqr.3.title:0 "Genoa's Casa di San Giorgio & the Black Sea Gazaria Charter"
 oe_spqr.3.desc:0 "From the marble vaults of Liguria to the stone towers of Crimean Caffa and Pera, Genoese bankers and captains hold the golden lifelines of two seas. Shall the Superba deploy its sovereign public-credit bonds to bankroll a wider Roman Republic, or harden its famed crossbow companies and war galleys for maritime conquest?"
 oe_spqr.3.a:0 "Charter San Giorgio public bonds across Gazaria and Italy"
 oe_spqr.3.b:0 "Expand Genoese crossbow marines and swift galley squadrons"
 oe_spqr.4.title:0 "Pisa's Vengeance for Meloria & the Tuscan-Adriatic Civic Revival"
 oe_spqr.4.desc:0 "In the piazzas of Pisa, Florence, Siena, Lucca, Ragusa, and Ancona, chroniclers remember both bitter naval setbacks like Meloria in 1284 and the soaring civic genius of Italian communes. Humanists, merchants, and sailors alike look to Rome's classical republic as the banner under which proud city-states can rise above every rival."
 oe_spqr.4.a:0 "Champion Tuscan-Adriatic civic humanism and republican learning"
 oe_spqr.4.b:0 "Avenge Meloria—rebuild our war galleys and citizen militia!"
 oe_spqr.5.title:0 "Senatus Populusque Romanus: Proclamation on the Capitoline Hill!"
 oe_spqr.5.desc:0 "Trumpets echo across the Roman Forum as consuls clad in purple-bordered togas ascend the Capitol before delegations from Venice, Genoa, Florence, Pisa, Milan, and every freed Italian commune. Nova Res Publica Romana is proclaimed at Empire rank—neither feudal monarchy nor papal fief, but the immortal Republic reborn! What creed shall define our first decades?"
 oe_spqr.5.a:0 "Enshrine Civic Law, Senate Concord, and Universal Citizenship"
 oe_spqr.5.b:0 "Raise the Bronze Eagles—March to Reclaim Mare Nostrum!"
 oe_spqr.6.title:0 "Western Proconsular Commission: Gallia, Hispania & Africa"
 oe_spqr.6.desc:0 "Before the Curia Julia, provincial maps of the Western Mediterranean are unrolled upon marble tables. Which conquered overseas territory outside Italy shall the Senate organize today as a chartered Roman Proconsular Province (120 Gold; your capital and core Italian hubs are never touched)?"
 oe_spqr.6.a:0 "Charter the Proconsulate of Gallia (Marseille / Southern France)"
 oe_spqr.6.b:0 "Charter the Proconsulate of Hispania (Barcelona / Iberia)"
 oe_spqr.6.c:0 "Charter the Proconsulate of Africa (Tunis / Carthage-Maghreb)"
 oe_spqr.6.d:0 "Defer western provincial charters for now"
 oe_spqr.7.title:0 "Eastern Proconsular Commission: Graecia, Asia & Aegyptus"
 oe_spqr.7.desc:0 "Admirals and quaestors return from the Aegean, Anatolia, and the Nile bearing ledgers of conquered ports. Which eastern Mediterranean territory outside Italy and Constantinople shall the Senate invest today as a Roman Proconsular Province (120 Gold)?"
 oe_spqr.7.a:0 "Charter the Proconsulate of Illyria & Graecia (Athens / Thessaloniki)"
 oe_spqr.7.b:0 "Charter the Proconsulate of Asia (Smyrna / Anatolia)"
 oe_spqr.7.c:0 "Charter the Proconsulate of Syria & Aegyptus (Alexandria / Antioch)"
 oe_spqr.7.d:0 "Defer eastern provincial charters for now"
 oe_spqr.8.title:0 "The Papal Question: Lateran Concordat or Exile to Avignon"
 oe_spqr.8.desc:0 "Across the Tiber, cardinals and Republican senators face one another for the fate of Christendom's holiest city. We may sign a solemn Lateran Republican Concordat—guaranteeing the Pope's spiritual sanctuary at St. Peter's while securing temporal Rome for S.P.Q.R.—or assert uncompromising secular sovereignty and drive the Papal Curia back into Avignon exile."
 oe_spqr.8.a:0 "Sign the Lateran Republican Concordat honoring Vatican spiritual autonomy"
 oe_spqr.8.b:0 "Assert Secular Capitoline Supremacy—send the Papacy back to Avignon!"
 oe_spqr.9.title:0 "Dialogue of Two Romes: Consuls of the Tiber & Basileus of the Straits"
 oe_spqr.9.desc:0 "Word of our restored Roman Republic has crossed the Ionian Sea to the Golden Horn, where the Roman Emperor in Constantinople watches with wary awe. Shall the Senate extend the olive branch of a Dual-Consul Mediterranean Accord uniting West and East as sister Romes, or denounce Eastern imperial autocracy and prepare consular legions for the Bosporus?"
 oe_spqr.9.a:0 "Propose the Dual-Consul Mediterranean Accord of Two Romes"
 oe_spqr.9.b:0 "Denounce Eastern Autocracy—claim sole Roman destiny and march East!"
 oe_spqr.10.title:0 "Envoys from the Capitol: The Revived Roman Republic Speaks"
 oe_spqr.10.desc:0 "Heralds bearing silver eagles and the letters S.P.Q.R. have entered the Great Palace of Constantinople. The Italian republics have raised a revived Roman Republic atop the Capitoline Hill and now await the Basileus's verdict: shall East and West seal a Twin Romes Mediterranean Accord, or shall New Rome reject every Western republican pretender behind the Theodosian Walls?"
 oe_spqr.10.a:0 "Seal the Twin Romes Mediterranean Accord with the Western Consuls"
 oe_spqr.10.b:0 "There is One Emperor and One Rome—defy the Western Republic!"
 oe_spqr.11.title:0 "Senatus Consultum Ultimum: Cincinnatus Returns the Fasces?"
 oe_spqr.11.desc:0 "Five years have passed since the Senate placed emergency dictatorial fasces into one commander's hands. The republic's armies cheer their victorious leader outside Rome's gates while senators hold their breath inside the Curia. Will our Dictator emulate Cincinnatus and lay down absolute power with grace, or yield to the Temptation of Caesar?"
 oe_spqr.11.a:0 "Emulate Cincinnatus—return the fasces to the Senate and People!"
 oe_spqr.11.b:0 "Yield to the Temptation of Caesar—retain Imperator ascendancy!"
 oe_spqr.12.title:0 "Black Sea–Mediterranean Grain & Silk Pact"
 oe_spqr.12.desc:0 "From Crimean Kaffa and Tana through the Bosporus into Venice, Genoa, and Rome, merchant galleys carry steppe wheat, northern amber, and Silk Road textiles. With our maritime banks united—and should Teutonic knights now hold the Pontic shore—how shall the Senate seal this trans-sea commercial artery?"
 oe_spqr.12.a:0 "Seal the Roman–Teutonic Pontus Grain & Amber Pact!"
 oe_spqr.12.b:0 "Charter the Unified Gazaria & Black Sea Grain Fleet"
 oe_spqr.12.c:0 "Fortify the Straits and enforce a Mediterranean Silk Staple"
 oe_spqr.13.title:0 "Golden Age of Civitas Romana"
 oe_spqr.13.desc:0 "Across Italy and our Mediterranean proconsulates, newly enfranchised citizens crowd restored basilicas, humanist universities, and marble harbors. Lawyers cite Cicero alongside municipal charters, while silver and gold coinage bearing S.P.Q.R. circulates from Marseille to Alexandria."
 oe_spqr.13.a:0 "Celebrate the Humanist & Civic Renaissance of Civitas Romana"
 oe_spqr.13.b:0 "Channel Pax Res Publica into commercial and artisan prosperity"
 oe_spqr.14.title:0 "Verdict of the Roman Revival"
 oe_spqr.14.desc:0 "After generations of upheaval ignited by Cola di Rienzo's cry upon the Capitoline Hill, the great contest between classical republicanism, papal temporal dominion, and princely rule across Italy reaches its historic conclusion."
 oe_spqr.14.a:0 "Preserve the Enduring Civic & Constitutional Legacy of the Forum"
 oe_spqr.14.b:0 "Carry Forward Our Maritime Supremacy Across New Horizons"
