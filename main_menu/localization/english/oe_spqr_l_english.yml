 OE_SPQR_PROV_GALLIA_ADJ:0 "Gallo-Roman"
 OE_SPQR_PROV_HISPANIA:0 "Proconsulate of Hispania"
 OE_SPQR_PROV_HISPANIA_ADJ:0 "Hispano-Roman"
