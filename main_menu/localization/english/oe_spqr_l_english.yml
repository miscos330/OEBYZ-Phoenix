l_english:
 # NEW 2026-11-23 v23.0 Module B3 Roman Republic Revival (S.P.Q.R., oe_spqr_ + oe_msn_60_spqr) — English Localization (100% EN/ZH parity) (0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v230_roman_republic_spqr.py; edit the generator, not this file.
 OE_SPQR_COUNTRY_NAME:0 "Nova Res Publica Romana (S.P.Q.R.)"
 OE_SPQR_COUNTRY_ADJ:0 "Roman Republican"
 oe_spqr_senate:0 "Roman Senate & Popular Assemblies"
 oe_spqr_senate_desc:0 "Restores the classical twin pillars of the Res Publica on the Capitoline Hill: a patrician-commercial Senate deliberating high diplomacy and maritime strategy alongside Popular Assemblies of burghers and free citizens—sharpening legislative authority, republican tradition, and maritime presence at a modest court upkeep cost."
 oe_spqr_res_publica_reform:0 "Nova Res Publica Romana (Dual Consuls & Senate)"
 oe_spqr_res_publica_reform_desc:0 "Restores the collegiate magistracy of two annual Consuls guided by the revived Roman Senate, binding Italian maritime trade, proconsular loyalty, and citizen legions into an Empire-rank Republic."
 oe_spqr_proconsul_reform:0 "Roman Proconsular Province"
 oe_spqr_proconsul_reform_desc:0 "Chartered under senatorial law for overseas Mediterranean provinces, pairing republican harbor courts with steady cultural integration and maritime defense."
 oe_spqr_proconsul:0 "Roman Proconsular Province"
 oe_spqr_proconsul_desc:0 "A specialized republican provincial subject chartered across Mare Nostrum (Gallia, Hispania, Africa, Illyria & Graecia, Asia, Syria & Aegyptus). Sharing the Republic's map color while preserving its classical provincial title, a Proconsulate joins every war, remits provincial revenue, strengthens Mediterranean shipping, and remains protected from generic diplomatic annexation."
 LEAD_oe_spqr_proconsul:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_spqr_proconsul:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_spqr_proconsul_subject_opinion:0 "Senatorial Proconsular Mandate"
 oe_spqr_proconsul_overlord_opinion:0 "Roman Proconsular Province"
 oe_spqr_op_proconsul_charter:0 "Chartered as Roman Proconsulate"
 oe_spqr_op_lateran_concordat:0 "Lateran Republican Concordat"
 oe_spqr_op_avignon_exile:0 "Expelled the Papacy from Rome"
 oe_spqr_op_two_romes_accord:0 "Twin Romes Mediterranean Accord"
 oe_spqr_op_two_romes_rivalry:0 "Denounced Eastern Imperial Autocracy"
 oe_spqr_op_black_sea_pact:0 "Black Sea–Mediterranean Grain Pact"
 oe_spqr_dec_support_rienzo.title:0 "Back Cola di Rienzo & the Classical Republican League"
 oe_spqr_dec_support_rienzo.desc:0 "Endorse the 1347 Roman Tribune's call for a federated Italian Republic centered upon the Capitol—igniting the Classical Republican Revival, rallying republican tradition, and forging claims against papal temporal rule in Rome."
 oe_spqr_dec_support_rienzo.a:0 "Send Envoys and Coin to the Capitoline Tribune"
 oe_spqr_dec_support_rienzo_tt:0 "Ignites the #Y Classical Republican Revival#! situation, grants a #Y 15#!-year Republican League modifier, and awards a Casus Belli against the Papal State if it holds Rome."
 oe_spqr_dec_proclaim_roman_republic.title:0 "Proclaim Nova Res Publica Romana (S.P.Q.R.)"
 oe_spqr_dec_proclaim_roman_republic.desc:0 "Having entered the Eternal City while commanding at least two major Italian metropolitan hubs, our Republic ascends the Capitoline Hill to proclaim an Empire-rank Nova Res Publica Romana—instituting Dual Consuls, convening the Roman Senate, and unlocking the Restore Roman Borders ambition across Mare Nostrum."
 oe_spqr_dec_proclaim_roman_republic.a:0 "Raise the Bronze Eagles of S.P.Q.R.!"
 oe_spqr_dec_proclaim_hubs_tt:0 "Control (directly or via subjects) at least #Y 2#! major Italian hubs among Venice, Genoa, Florence, Pisa, Milan, Naples, and Palermo."
 oe_spqr_dec_proclaim_roman_republic_tt:0 "Elevates our Republic to #Y Empire Rank#!, renames us to #Y Nova Res Publica Romana (S.P.Q.R.)#!, grants the #Y Dual Consuls & Senate#! reform and #Y Roman Senate#! parliament, unlocks #Y Restore Roman Borders#!, and triggers the Capitoline Proclamation event."
 oe_spqr_dec_proconsul_west.title:0 "Charter a Western Mare Nostrum Proconsul"
 oe_spqr_dec_proconsul_west.desc:0 "Organize conquered western Mediterranean territories outside Italy into a loyal Roman Proconsular Province—choosing among Gallia (Marseille), Hispania (Barcelona), or Africa (Tunis) without ever ceding your capital or core Italian hubs."
 oe_spqr_dec_proconsul_west.a:0 "Convene the Western Proconsular Commission"
 oe_spqr_dec_proconsul_west_req_tt:0 "Own at least #Y 3#! non-protected locations in an unchartered western region: Gallia (France), Hispania (Iberia), or Africa (Maghreb)."
 oe_spqr_dec_proconsul_west_tt:0 "Opens the Western Proconsular Charter event to invest #Y Gallia#!, #Y Hispania#!, or #Y Africa#! as a specialized Roman Proconsular Province (120 Gold upon confirmation; never cedes capital or Italy)."
 oe_spqr_dec_proconsul_east.title:0 "Charter an Eastern Mare Nostrum Proconsul"
 oe_spqr_dec_proconsul_east.desc:0 "Organize conquered eastern Mediterranean territories outside Italy into a loyal Roman Proconsular Province—choosing among Illyria & Graecia (Athens/Thessaloniki), Asia (Smyrna), or Syria & Aegyptus (Alexandria/Antioch) without ever ceding your capital or Constantinople."
 oe_spqr_dec_proconsul_east.a:0 "Convene the Eastern Proconsular Commission"
 oe_spqr_dec_proconsul_east_req_tt:0 "Own at least #Y 3#! non-protected locations in an unchartered eastern region: Illyria & Graecia (Balkans), Asia (Anatolia), or Syria & Aegyptus (Egypt/Levant)."
 oe_spqr_dec_proconsul_east_tt:0 "Opens the Eastern Proconsular Charter event to invest #Y Illyria & Graecia#!, #Y Asia#!, or #Y Syria & Aegyptus#! as a specialized Roman Proconsular Province (120 Gold upon confirmation; never cedes capital, Italy, or Constantinople)."
 oe_spqr_dec_appoint_dictator.title:0 "Invoke Senatus Consultum Ultimum (Appoint Wartime Dictator)"
 oe_spqr_dec_appoint_dictator.desc:0 "In a moment of war, the Senate invests a supreme Dictator with emergency military powers for #Y 5#! years—sharpening army discipline, morale, and siegecraft at the cost of #R -10#! Republican Tradition. When five years elapse, the Dictator must face the test of Cincinnatus or Caesar."
 oe_spqr_dec_appoint_dictator.a:0 "Bestow the Twenty-Four Fasces for Five Years"
 oe_spqr_dec_appoint_dictator_tt:0 "Grants #Y 5#!-year emergency Dictator bonuses (Discipline, Morale, Siege Ability, Army Upkeep) and triggers #Y Cincinnatus Returns the Fasces#! after five years (10-year cooldown)."
 oe_spqr_dec_extend_civitas.title:0 "Enact Constitutio Antoniniana Civic Integration"
 oe_spqr_dec_extend_civitas.desc:0 "Proclaim a sweeping civic franchise across Italian communes and Mediterranean cities—accelerating cultural assimilation, provincial integration, urban prosperity, and Proconsular loyalty for #Y 15#! years."
 oe_spqr_dec_extend_civitas.a:0 "Enroll the Free Cities into Civitas Romana"
 oe_spqr_dec_extend_civitas_tt:0 "Grants #Y Constitutio Antoniniana#! for #Y 15#! years, raises prosperity in our capital and Rome, and lowers all Proconsuls' Liberty Desire by #G -10#! (10-year cooldown)."
 oe_spqr_dec_stato_gazaria_merger.title:0 "Unify Stato da Màr, Gazaria & Pisan Ports into Roman Maritime Bank"
 oe_spqr_dec_stato_gazaria_merger.desc:0 "Commanding multiple Italian commercial capitals, the Senate merges Venice's Adriatic Arsenal, Genoa's Casa di San Giorgio, and Tyrrhenian exchanges into one sovereign Roman Maritime Bank—delivering permanent trade income, lower interest, and merchant supremacy."
 oe_spqr_dec_stato_gazaria_merger.a:0 "Charter the Sovereign Roman Maritime Bank"
 oe_spqr_dec_stato_gazaria_req_tt:0 "Control (directly or via subjects) at least #Y 2#! major maritime hubs among Venice, Genoa, Pisa, Florence, Dubrovnik, Ancona, Naples, and Palermo."
 oe_spqr_dec_stato_gazaria_merger_tt:0 "Permanently establishes the #Y United Roman Maritime Bank#!, granting enduring Trade Income, Sea Trade Efficiency, lower Bank Interest, and expanded Loan Capacity."
 oe_spqr_dec_papal_lateran_settlement.title:0 "Settle the Papal Question in Rome"
 oe_spqr_dec_papal_lateran_settlement.desc:0 "With republican banners flying above Rome, the Senate must permanently resolve the status of the Holy See: negotiate a respectful Lateran Concordat safeguarding Vatican spiritual independence, or strip papal temporal claims and drive the Curia back to Avignon."
 oe_spqr_dec_papal_lateran_settlement.a:0 "Open the Capitoline Debate on the Holy See"
 oe_spqr_dec_papal_lateran_settlement_tt:0 "Opens #Y The Papal Question#! event to choose between the #Y Lateran Republican Concordat#! or #Y Secular Exile to Avignon#!."
 oe_sit_spqr_revival:0 "Senatus Populusque Romanus: Classical Republican Revival"
 oe_sit_spqr_revival_desc:0 "Sparked by Cola di Rienzo's 1347 uprising on the Capitoline Hill and sustained by Italy's proud maritime and civic republics—Venice, Genoa, Pisa, Florence, Siena, Lucca, Ragusa, and Ancona—a bold dream sweeps across the peninsula: to dismantle feudal princes and papal temporal rule and raise Nova Res Publica Romana across Mare Nostrum."
 oe_sit_spqr_revival_outcome_spqr:0 "Triumph of Nova Res Publica Romana"
 oe_sit_spqr_revival_outcome_spqr_desc:0 "Nova Res Publica Romana (S.P.Q.R.) is proclaimed, and either Revival Momentum reaches 75 (after 24 months) or at least two Mare Nostrum Proconsulates are chartered."
 oe_sit_spqr_revival_outcome_papacy:0 "Triumph of Papacy & Princes"
 oe_sit_spqr_revival_outcome_papacy_desc:0 "After 36 months without S.P.Q.R. proclaimed, Republican Revival Momentum collapses to 20 or below while Papal and princely courts hold sway over Italy."
 oe_sit_spqr_revival_outcome_equilibrium:0 "Renaissance Italian Equilibrium"
 oe_sit_spqr_revival_outcome_equilibrium_desc:0 "By 1560 without a decisive knockout, the republican revival crystallizes into a durable multipolar Renaissance balance across Italy and the Mediterranean."
 OE_SPQR_SIT_TITLE:0 "Classical Republican Revival & Mare Nostrum"
 OE_SPQR_SIT_MOM_L:0 "Curial & Princely Order (20)"
 OE_SPQR_SIT_MOM_R:0 "S.P.Q.R. Ascendancy (75)"
 OE_SPQR_SIT_MOM_FOOT:0 "Live-tracked across Cola di Rienzo's uprising, control of Rome, Italian republican capitals, and Mediterranean anchors. Proclaim S.P.Q.R. and reach 75 Momentum or 2 Proconsuls to triumph."
 OE_SPQR_SIT_PHASE_KPI:0 "Revival Phase"
 OE_SPQR_SIT_PROCONSULS_KPI:0 "Mare Nostrum Proconsuls"
 OE_SPQR_SIT_MARE_KPI:0 "Mare Nostrum Integration"
 OE_SPQR_SIT_P1:0 "#Y Tribune's Spark#!"
