l_english:
 oe_heg_plan_egypt: "Plan the Invasion of Egypt"
 oe_heg_plan_egypt_desc: "Provision the ships and redraw the old provincial charts. The road back to the southern granary begins on the coast of Alexandria."
 oe_heg_plan_egypt_effect: "Spend 1000 treasury gold. Gain a province-conquest casus belli against the current owner of Alexandria, targeting its province. Add the Levant area and Egypt region to the Roman World and unlock the three eastern governorate actions. Once only."
 oe_heg_plan_africa: "Plan the Invasion of North Africa"
 oe_heg_plan_africa_desc: "With Alexandria secured, the western sea road lies open. Pay the shipmasters and prepare to return the African coast to the imperial maps."
 oe_heg_plan_africa_effect: "Spend 1000 treasury gold. Add all passable land locations in the Maghreb region to the Roman World and unlock the North African Expedition. Once only."
 oe_heg_africa_expedition: "North African Expedition"
 oe_heg_africa_expedition_desc: "Grant a coastal foothold to an expeditionary army. Its soldiers must win their own lands and defend every conquest."
 oe_heg_africa_expedition_effect: "Create an expedition subject at the selected rural coast with its special reform, six era infantry regiments, six cogs, 3000 gold and a fortified camp. All foreign countries still owning Maghreb land declare war on it; Byzantium and all its subjects are excluded. Occupation immediately transfers Maghreb land to the expedition; enemy occupation immediately transfers expedition land to the enemy. At peace, remove the reform and become a Roman Ally. Once only."
 oe_heg_support_expedition: "Support a Military Expedition"
 oe_heg_support_expedition_desc: "Send fresh soldiers and stores to the distant standards. Theme infantry and Cataphracts march with light horse and foot to sustain the expedition."
 oe_heg_support_expedition_effect: "Send four regiments each of current-age Theme infantry, Byzantine Cataphracts, ordinary light cavalry and ordinary light infantry to the capital of a subject with the Expeditionary Army reform. Costs two months of income and 0.5 manpower. Once per month."
 oe_heg_end_expedition: "End a Military Expedition"
 oe_heg_end_expedition_desc: "Recall the mandate of conquest and replace the camp with lasting government."
 oe_heg_end_expedition_effect: "At no cost, immediately settle all wars involving the selected expedition. Remove its expedition reform and change it to a Roman Ally. Directly conquered territory is retained. Repeatable."
 oe_pillars_integrate_roman_alliance: "Integrate a Roman Ally"
 oe_pillars_integrate_roman_alliance_desc: "A decade of allegiance has bound this realm to the empire. Bring its civil and military powers under closer imperial supervision."
 oe_pillars_integrate_roman_alliance_effect: "Spend 5 Authority to turn a Roman Ally that has been a Byzantine subject for more than ten years and whose opinion of the empire is at least 50 into a Provincial Subject."
 oe_heg_expedition: "Expeditionary Army"
 oe_heg_expedition_desc: "An imperial expedition that fights its own wars. Its economic values follow those of a Roman Ally; the overlord is not automatically called into its wars. It becomes a Roman Ally at peace."
 oe_heg_expedition_reform: "Expeditionary Army"
 oe_heg_expedition_reform_desc: "Implemented over three days: +33% siege ability, +20% army morale, +5% discipline and no independent peace negotiations. Occupied Maghreb locations are conquered immediately, and enemies immediately conquer occupied expedition land. Removed at peace.\n\nMonthly Rebel Growth #G -5%#!."
 OE_HEG_AFRICA_EXPEDITION_COUNTRY: "African Expedition"
 OE_HEG_AFRICA_EXPEDITION_ADJ: "African Expeditionary"
 OE_HEG_EGYPT_PLAN_REQUIRED: "Completed Plan the Invasion of Egypt"
 OE_HEG_AFRICA_PLAN_REQUIRED: "Completed Plan the Invasion of North Africa"
 OE_HEG_AFRICA_ALEXANDRIA: "Byzantium or one of its subjects owns Alexandria"
 OE_HEG_AUTHORITY_5: "At least 5 Authority"
 OE_HEG_CHOOSE_AFRICA_TARGET: "Choose a country with its capital in the Maghreb"
 OE_HEG_CHOOSE_FOOTHOLD: "Choose a rural coastal foothold in the Maghreb"
 OE_HEG_CHOOSE_EXPEDITION: "Choose an imperial subject with the Expeditionary Army reform"
 OE_HEG_NO_TARGETS: "No eligible country is available"
 OE_HEG_EGYPT_PLAN_DONE: "Completed: Plan the Invasion of Egypt"
 OE_HEG_AFRICA_PLAN_DONE: "Completed: Plan the Invasion of North Africa"
 OE_HEG_AFRICA_EXPEDITION_DONE: "Completed: North African Expedition"
 OE_HEG_AFRICA_ACTIONS_HINT: "All North African actions require Byzantine or subject ownership of Alexandria. Planning and launching the expedition are each once only. Supporting and ending expeditions, and acquiring invasion claims, are repeatable."
 OE_RW_AFRICA: "North Africa"
 OE_RW_AFRICA_DESC: "Beyond the lighthouse of Alexandria lie the old African shores. Let the charts guide the fleet and victory draw the borders."
 OE_RW_AFRICA_OPEN: "View North African actions"
 OE_RW_AFRICA_ACTIONS: "North African Actions"
 OE_RW_AFRICA_HINT: "Click the map to open its action panel here."
 OE_RW_TUNIS: "Tunis"
 OE_RW_TUNIS_OWNER: "Current owner of Tunis"
 oe_heg_expedition_supply_reform: "Expeditionary Supply Administration"
 oe_heg_expedition_supply_reform_desc: "Dedicated officials oversee the expedition’s pay and provisions, sustaining its camps far from the imperial capital. Exclusive to Expeditionary Army subjects. Implemented over three days: +1000% army maintenance efficiency, +25 gold per month, -20% unit food consumption and -15 maximum war exhaustion. Removed when expeditionary subject status ends."
