 STATIC_MODIFIER_NAME_oe_br_simeon_unrest: "Simeon's Partisans"
 STATIC_MODIFIER_NAME_oe_br_ottoman_auxiliaries: "Ottoman Auxiliaries"
 STATIC_MODIFIER_NAME_oe_br_western_aid: "Help from the West"
 STATIC_MODIFIER_NAME_oe_br_union_scandal: "The Scandal of Submission"
 STATIC_MODIFIER_NAME_oe_br_tenedos: "The Price of Tenedos"
 OE_BR_JEWELS_YES: "\n\nThe Venetians have not forgotten that the crown jewels the Empress pawned to them years ago are still in their vaults."
 OE_BR_JEWELS_NO: ""
 oe_br.1.t: "The Coronation at Skopje"
 oe_br.1.d: "On Easter Day Stefan Dušan was crowned at Skopje as 'Emperor of the Serbs and Romans'. The crown was placed on his head by a Serbian patriarch he had just raised to that rank himself, without Constantinople's consent. The empire's western neighbour now has a Roman emperor of its own."
 oe_br.1.a: "Rome has only one emperor"
 oe_br.1.a.tt: "Serbia's opinion of us #R −50#! (fades by #Y 2#! a year)"
 oe_br.1.b: "Let the title pass for the sake of peace"
 oe_br.1.b.tt: "Serbia's opinion of us #G +50#! (fades by #Y 2#! a year)"
 oe_br.2.t: "The Patriarch's Anathema"
 oe_br.2.d: "Patriarch Kallistos of Constantinople has drafted the act: the Serbian emperor and the patriarch he set up without leave are both to be cut off from the Church. It needs only the emperor's assent."
 oe_br.2.a: "Proclaim the anathema"
 oe_br.2.a.tt: "Serbia's opinion of us #R −100#! (fades by #Y 2#! a year)"
 oe_br.2.b: "Hold it back and keep a door open"
 oe_br.3.t: "The Death of Dušan"
 oe_br.3.d: "Stefan Dušan is dead. Young Uroš V cannot master the great lords his father left him, and Dušan's brother Simeon has proclaimed himself emperor in Thessaly. The old lands of the empire that Serbia took are, for now, guarded by no one in earnest."
 oe_br.3.a: "Claim the lost lands"
 oe_br.3.a.tt: "A 'Restore Roman Borders' casus belli against Serbia for #Y 20#! years\nSerbia's opinion of us #R −30#! (fades by #Y 2#! a year)"
 oe_br.3.b: "Back Simeon"
 oe_br.3.b.tt: "Serbia's places in Thessaly and Epirus gain 'Simeon's Partisans' (#Y 10#! years, more unrest)"
 oe_br.3.c: "Make friends with the new emperor"
 oe_br.3.c.tt: "Serbia's opinion of us #G +50#! (fades by #Y 2#! a year)"
 oe_br.4.t: "Reconciliation at Serres"
 oe_br.4.d: "Jovan Uglješa, lord of Serres, has sent envoys to Constantinople: he will bring the churches of his lands back under the Patriarch and end the years of anathema. The Ottoman threat makes him need friends more than Dušan ever did."
 oe_br.4.a: "Welcome him"
 oe_br.4.a.tt: "If Serbia falls apart, taking over Serres will cost half as much"
 oe_br.4.b: "Refuse"
 oe_br.5.t: "After the Maritsa"
 oe_br.5.d: "The Serbian lords have been all but wiped out on the Maritsa, and Serres has no master. The townsfolk are asking whose army they should open the gates to."
 oe_br.5.d_l5: "The Serbian lords have been all but wiped out on the Maritsa, and Serres has no master. The townsfolk are asking whose army they should open the gates to. The people of Serres remember that the empire's soldiers came."
 oe_br.5.a: "Send troops to take it over"
 oe_br.5.a.tt: "#R −300#! gold and #Y 3#! months of manpower (half if Uglješa was welcomed; a third less again if the empire sent troops to the despot's appeal)\nSerres and up to #Y 2#! nearby Serbian places return to the empire"
 oe_br.5.b: "Stay put"
 oe_br.6.t: "Guests Who Will Not Leave"
 oe_br.6.d: "The civil war is over, but the troops Orhan sent are wintering in Thrace. They say they are waiting for their pay, and the village granaries are already empty."
 oe_br.6.a: "Pay them to go"
 oe_br.6.b: "Drive them out"
 oe_br.6.b.tt: "The Ottomans's opinion of us #R −50#! (fades by #Y 2#! a year)"
 oe_br.6.c: "Give them a fort to settle"
 oe_br.6.c.tt: "One place in Thrace passes to the Ottomans\nGain 'Ottoman Auxiliaries' for #Y 10#! years"
 oe_br.7.t: "The Kidnapped Prince"
 oe_br.7.d: "Orhan's young son Halil has been seized by pirates in the Gulf of Nicomedia and is held in the castle of Phokaia. Orhan begs the empire's help: if his son is brought back he will pay half the ransom, and Halil will marry a princess of the empire."
 oe_br.7.a: "Pay the ransom and promise the marriage"
 oe_br.7.a.tt: "The Ottomans's opinion of us #G +100#! (fades by #Y 1#! a year)\nA #Y 10#!-year truce with the Ottomans"
 oe_br.7.b: "Keep him as a hostage"
 oe_br.7.b.tt: "The Ottomans's opinion of us #R −100#! (fades by #Y 2#! a year)"
 oe_br.8.t: "The Count of Savoy's Crusade"
 oe_br.8.d: "Amadeus of Savoy, the 'Green Count' and a kinsman of the Empress Anna, has come to the straits with fifteen ships and seventeen hundred men to take Gallipoli back from the Ottomans. What he lacks is ships and money."
 oe_br.8.a: "Hire Venetian galleys for him"
 oe_br.8.a.tt: "Gallipoli returns to the empire"
 oe_br.8.b: "Decline politely"
 oe_br.9.t: "The Emperor Goes West"
 oe_br.9.d: "The Ottomans are at the gates of the Thracian towns and the treasury is empty. The emperor is thinking of going to Rome himself, swearing obedience to the Pope in St Peter's, and buying knights and ships from the West."
 oe_br.9.a: "Go west and submit"
 oe_br.9.a.tt: "Gain 'Help from the West' for #Y 10#! years\nGain 'The Scandal of Submission' for #Y 10#! years\nThe way home passes through Venice..."
 oe_br.9.b: "Stay in Constantinople"
 oe_br.10.t: "The Creditors of Venice"
 oe_br.10.d: "Rome gave the emperor little. On the way home through Venice he could not pay his loans and his passage, and the Venetian merchants would not let him leave. Give us Tenedos, the Venetians say, and the debt is forgiven.[GetCountry('BYZ').Custom('OeBrJewels')]"
 oe_br.10.a: "Give them Tenedos"
 oe_br.10.a.tt: "Gain 'The Price of Tenedos' for #Y 20#! years (Venetian customs privileges, tax income efficiency #R −5%#!; Tenedos is not on the EU5 map, so this stands in for the cession)"
 oe_br.10.b: "Raise the money"
 oe_br.10.c: "Wait for his son to come"
 oe_br_denied_title: "Denied our imperial title"
 oe_br_recognised_title: "Let our imperial title pass"
 oe_br_anathema: "Anathematised our ruler and patriarch"
 oe_br_claimed_lands: "Claims our lands"
 oe_br_new_friendship: "Befriended our new ruler"
 oe_br_expelled: "Drove out our troops"
 oe_br_halil_ransomed: "Ransomed Halil"
 oe_br_halil_held: "Holds Halil hostage"
