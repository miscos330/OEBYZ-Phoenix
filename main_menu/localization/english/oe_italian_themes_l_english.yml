l_english:
 oe_ir_italian_theme: "Establish Italian Themes"
 oe_ir_italian_theme_desc: "Once East Rome and its subjects own at least 50% of Italy's conquerable locations, spend 20 Imperial Authority to choose a system of provincial rule and unlock Establish a Theme in Italy under Military Edicts."
 OE_IR_ITALY_HALF_REQUIRED: "East Rome and its subjects own at least 50% of the conquerable locations in Italy."
 oe_create_theme_in_italy: "Establish a Theme in Italy"
 oe_create_theme_in_italy_desc: "Spend #R 5#! [oe_tu_authority|e] to establish a theme on directly owned Italian land. The selected province provides the seat; other directly owned Italian locations in its area receive offices. The reform event determines whether Italian or Latin themes are created. Neither type can be converted, but both can be abolished."
 OE_IT_THEME_CHOICE_REQUIRED: "The Italian administration event has unlocked either Italian or Latin themes."
 OE_IT_THEME_NO_PROVINCE: "@trigger_no! No eligible province: its capital must be directly owned by East Rome in Italy, and its area must contain no other theme offices."
 oe_italian_themes.1.t: "The Cities and Commands of Italy"
 oe_italian_themes.1.d: "Imperial banners have crossed the Adriatic once more. Envoys of Italy's cities arrive at court bearing the seals of councils, the ledgers of guilds and the petitions of local nobles. Our soldiers have opened the roads; securing the lasting allegiance of these proud and prosperous cities remains a matter for the throne.\n\nWe may respect their autonomy, placing civic leaders over the new commands and allowing workshops, estates and commerce to flourish in return for revenue and loyalty. Or we may organize Latin themes under noble governors and military offices, binding Italy more closely to the empire through its armies and administration. Today's judgment will determine the duties of the Italian cities for generations to come."
 oe_italian_themes.1.a: "Respect Italy's autonomy."
 oe_italian_themes.1.b: "We shall integrate Italy."
 OE_IT_THEME_AUTONOMY_UNLOCK: "Unlock Italian themes: production and revenue commands paying 15% tax-base tribute, excluded from overlord wars, military pay and manpower payments. Their type cannot be converted."
 OE_IT_THEME_LATIN_UNLOCK: "Unlock Latin themes: noble and military commands receiving military pay and manpower under ordinary theme military laws, with no tribute. Their type cannot be converted."
 oe_empire_theme_italian: "Italian Theme"
 oe_empire_theme_italian_desc: "A civic Italian command paying 15% tax-base tribute and improving imperial production efficiency. It does not join overlord wars. Religious and theme-type conversion are prohibited."
 oe_empire_theme_latin: "Latin Theme"
 oe_empire_theme_latin_desc: "A military command integrating Italy, improving imperial mercenary maintenance efficiency and receiving military pay and manpower without tribute. Religious and theme-type conversion are prohibited."
 oe_byz_theme_italian_subject: "Italian Theme System"
 oe_byz_theme_italian_subject_desc: "Civic leaders administer imperial commands, advancing a capital economy, burgher satisfaction and building upkeep efficiency. Central Administration also secures their loyalty to the throne."
 oe_byz_theme_latin_subject: "Latin Theme System"
 oe_byz_theme_latin_subject_desc: "Noble governors and soldiers integrate Italy under the ordinary theme army expectations, manpower capacity and military pay laws."
 oe_byz_theme_italian_seat: "Italian Theme Seat"
 oe_byz_theme_italian_seat_desc: "A civic seat improving local production, raw material capacity and output, providing its building owner with gold equal to 100% of the local tax base and ten monthly gold."
 oe_byz_theme_italian_post: "Italian Theme Office"
 oe_byz_theme_italian_post_desc: "A civic office improving local production, raw material capacity and output and providing its building owner with gold equal to 15% of the local tax base."
 oe_byz_theme_latin_seat: "Latin Theme Seat"
 oe_byz_theme_latin_seat_desc: "A noble seat providing its building owner with gold equal to 100% of the local tax base and ten monthly gold and adding 50 monthly local manpower."
 oe_byz_theme_latin_post: "Latin Theme Office"
 oe_byz_theme_latin_post_desc: "A military office providing its building owner with gold equal to 15% of the local tax base, five monthly local manpower and a 50% local manpower modifier, and permitting army recruitment."
 oe_pillars_italian_theme: "Italian Theme"
 oe_pillars_italian_theme_desc: "An autonomous civic command excluded from military pay and manpower payments."
 oe_pillars_latin_theme: "Latin Theme"
 oe_pillars_latin_theme_desc: "An Italian integration command counted for both military pay and manpower payments."
