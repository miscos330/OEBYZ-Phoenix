 oe_nb.1.t: "A Crown for the Governor of Serres"
 oe_nb.1.desc1: "#F In August 1341 King Leo IV of Armenia was killed by the kingdom's own nobles, who had long resented the king's leaning to the West and to church union. The nobles first offered the crown to John of Lusignan, but John urged Guy, the elder brother, to take it instead. Guy, a Catholic prince of the royal house of Cyprus, had served the empire as governor of Serres since 1328; after long hesitation Guy was crowned king of Armenian Cilicia in 1342 as Constantine II.#!\n\nNow word of Leo IV's death has reached Constantinople, and envoys from Cilicia have followed close behind: they ask that the governor of Serres, [SCOPE.sCharacter('oe_nb_guy').GetName], come east to take the throne. The envoys make a point of saying that Cilicia has not forgotten the help the empire sent in 1337."
 oe_nb.1.desc2: "#F In August 1341 King Leo IV of Armenia was killed by the kingdom's own nobles, who had long resented the king's leaning to the West and to church union. The nobles first offered the crown to John of Lusignan, but John urged Guy, the elder brother, to take it instead. Guy, a Catholic prince of the royal house of Cyprus, had served the empire as governor of Serres since 1328; after long hesitation Guy was crowned king of Armenian Cilicia in 1342 as Constantine II.#!\n\nNow word of Leo IV's death has reached Constantinople, and envoys from Cilicia have followed close behind: they ask that the governor of Serres, [SCOPE.sCharacter('oe_nb_guy').GetName], come east to take the throne."
 oe_nb.1.desc3: "#F In August 1341 King Leo IV of Armenia was killed by the kingdom's own nobles, who had long resented the king's leaning to the West and to church union. The nobles first offered the crown to John of Lusignan, but John urged Guy, the elder brother, to take it instead. Guy, a Catholic prince of the royal house of Cyprus, had served the empire as governor of Serres since 1328; after long hesitation Guy was crowned king of Armenian Cilicia in 1342 as Constantine II.#!\n\nNow envoys from Cilicia have come to Constantinople, asking that the governor of Serres, [SCOPE.sCharacter('oe_nb_guy').GetName], come east to take the throne. The envoys make a point of saying that Cilicia has not forgotten the help the empire sent in 1337."
 oe_nb.1.desc: "#F In August 1341 King Leo IV of Armenia was killed by the kingdom's own nobles, who had long resented the king's leaning to the West and to church union. The nobles first offered the crown to John of Lusignan, but John urged Guy, the elder brother, to take it instead. Guy, a Catholic prince of the royal house of Cyprus, had served the empire as governor of Serres since 1328; after long hesitation Guy was crowned king of Armenian Cilicia in 1342 as Constantine II.#!\n\nNow envoys from Cilicia have come to Constantinople, asking that the governor of Serres, [SCOPE.sCharacter('oe_nb_guy').GetName], come east to take the throne."
 oe_nb.1.a: "Send the governor east to be king"
 oe_nb.1.a.tt: "[SCOPE.sCharacter('oe_nb_guy').GetName] goes to Cilicia and takes the throne\nCilicia: opinion of us #G +40#!"
 oe_nb.1.b: "Keep the governor here"
 oe_nb.1.b.tt: "[SCOPE.sCharacter('oe_nb_guy').GetName] stays in the empire and Cilicia crowns someone else\nCilicia: opinion of us #R −10#!"
 oe_nb.2.t: "A Bride from Bulgaria"
 oe_nb.2.desc1: "#F Around 1355 the empire and Bulgaria made a new treaty: Keratsa, daughter of Tsar Ivan Alexander, was promised to Andronikos, eldest son of John V. Both children were only seven or eight. Gregoras places the match between 1355 and 1357.#!\n\nNow envoys from Tarnovo bring the tsar's offer: Princess [SCOPE.sCharacter('oe_nb_bride').GetName] for [SCOPE.sCharacter('oe_nb_groom').GetName], and the two houses joined by marriage. Maria, daughter of Andronikos III and married into the Bulgarian royal house, has written from Tarnovo to urge the match."
 oe_nb.2.desc2: "#F Around 1355 the empire and Bulgaria made a new treaty: Keratsa, daughter of Tsar Ivan Alexander, was promised to Andronikos, eldest son of John V. Both children were only seven or eight. Gregoras places the match between 1355 and 1357.#!\n\nNow envoys from Tarnovo bring the tsar's offer: Princess [SCOPE.sCharacter('oe_nb_bride').GetName] for [SCOPE.sCharacter('oe_nb_groom').GetName], and the two houses joined by marriage."
 oe_nb.2.desc3: "#F Around 1355 the empire and Bulgaria made a new treaty: Keratsa, daughter of Tsar Ivan Alexander, was promised to Andronikos, eldest son of John V. Both children were only seven or eight. Gregoras places the match between 1355 and 1357.#!\n\nNow envoys from Tarnovo bring the tsar's offer of a marriage between the two houses, but there is no one suitable at court just now. Maria, daughter of Andronikos III and married into the Bulgarian royal house, has written from Tarnovo to urge the match."
 oe_nb.2.desc: "#F Around 1355 the empire and Bulgaria made a new treaty: Keratsa, daughter of Tsar Ivan Alexander, was promised to Andronikos, eldest son of John V. Both children were only seven or eight. Gregoras places the match between 1355 and 1357.#!\n\nNow envoys from Tarnovo bring the tsar's offer of a marriage between the two houses, but there is no one suitable at court just now."
 oe_nb.2.a: "Agree to the match"
 oe_nb.2.a.tt: "[SCOPE.sCharacter('oe_nb_bride').GetName] comes to Constantinople, betrothed to [SCOPE.sCharacter('oe_nb_groom').GetName]; they marry when both are #Y 14#!\nBulgaria: opinion of us #G +40#!\nA truce with Bulgaria for #Y 10#! years"
 oe_nb.2.b: "Look elsewhere for a match"
 oe_nb.2.b.tt: "Bulgaria: opinion of us #R −20#!"
 oe_nb.3.t: "The Tsar at Vidin"
 oe_nb.3.desc1: "#F In 1356 Ivan Sratsimir, second son of Ivan Alexander, took the style 'Emperor of the Bulgarians and the Greeks' at Vidin and ruled apart from the tsar, who had already named Shishman, son of a second marriage, as heir.#!\n\nNow #bold #color_yellow Vidin#!#! is a realm of its own. [SCOPE.sCharacter('oe_nb_sra').GetName] rules there as tsar, still owing homage to Tarnovo, yet writes to the empire as 'Emperor of the Greeks'. The court must decide how to answer."
 oe_nb.3.desc: "#F In 1356 Ivan Sratsimir, second son of Ivan Alexander, took the style 'Emperor of the Bulgarians and the Greeks' at Vidin and ruled apart from the tsar, who had already named Shishman, son of a second marriage, as heir.#!\n\nNow #bold #color_yellow Vidin#!#! and Tarnovo go their own ways, and both have sent envoys to Constantinople. The court must decide whom to recognise."
 oe_nb.3.a: "Recognise the tsar at Vidin"
 oe_nb.3.a.tt: "Vidin: opinion of us #G +30#!\nBulgaria: opinion of us #R −20#!"
 oe_nb.3.b: "Recognise Tarnovo alone"
 oe_nb.3.b.tt: "Bulgaria: opinion of us #G +20#!\nVidin, if it exists: opinion of us #R −20#!"
 oe_nb.3.c: "'Emperor of the Greeks'?"
 oe_nb.3.c.tt: "Vidin: opinion of us #R −30#!"
 oe_nb.4.t: "The Principality beyond the Mountains"
 oe_nb.4.desc1: "#F In the late 1340s the king of Hungary had Dragoș set up a march east of the Carpathians against the Tatars. Early in the 1360s Bogdan, a noble of Maramureș at odds with Hungary, crossed the mountains and drove out Dragoș's heirs, and Moldavia broke away from Hungary. The sources disagree on the year.#!\n\nNow Moldavia stands on its own under [SCOPE.sCharacter('oe_nb_molr').GetName], and has sent men south to learn how the empire regards it. The empire already holds Wallachia: the action Moldavian Governorate could bring this valley in as well."
 oe_nb.4.desc2: "#F In the late 1340s the king of Hungary had Dragoș set up a march east of the Carpathians against the Tatars. Early in the 1360s Bogdan, a noble of Maramureș at odds with Hungary, crossed the mountains and drove out Dragoș's heirs, and Moldavia broke away from Hungary. The sources disagree on the year.#!\n\nNow Moldavia stands on its own under [SCOPE.sCharacter('oe_nb_molr').GetName], and has sent men south to learn how the empire regards it."
 oe_nb.4.desc3: "#F In the late 1340s the king of Hungary had Dragoș set up a march east of the Carpathians against the Tatars. Early in the 1360s Bogdan, a noble of Maramureș at odds with Hungary, crossed the mountains and drove out Dragoș's heirs, and Moldavia broke away from Hungary. The sources disagree on the year.#!\n\nNow envoys from Moldavia have come south to learn how the empire regards their land. The empire already holds Wallachia: the action Moldavian Governorate could bring this valley in as well."
 oe_nb.4.desc: "#F In the late 1340s the king of Hungary had Dragoș set up a march east of the Carpathians against the Tatars. Early in the 1360s Bogdan, a noble of Maramureș at odds with Hungary, crossed the mountains and drove out Dragoș's heirs, and Moldavia broke away from Hungary. The sources disagree on the year.#!\n\nNow envoys from Moldavia have come south to learn how the empire regards their land."
 oe_nb.4.a: "Send envoys with icons and books"
 oe_nb.4.a.tt: "Moldavia: opinion of us #G +30#!\nThe empire and Moldavia open relations"
 oe_nb.4.b: "See how Hungary takes it first"
 oe_nb.4.b.tt: "Hungary: opinion of us #G +10#!"
 oe_nb.5.t: "The Quarrel over the Black Sea Ports"
 oe_nb.5.desc1: "#F In 1364 the empire and Bulgaria went to war again over the ports of Anchialos and Mesembria, and this time Bulgaria held them.#!\n\nNow #bold #color_yellow Anchialos#!#! is still Bulgarian, a short sail from the empire's coast. Greek merchants in the town write in secret that the garrison is careless. Yet the marriage agreement between the two houses still stands."
 oe_nb.5.desc: "#F In 1364 the empire and Bulgaria went to war again over the ports of Anchialos and Mesembria, and this time Bulgaria held them.#!\n\nNow #bold #color_yellow Anchialos#!#! is still Bulgarian, a short sail from the empire's coast. Greek merchants in the town write in secret that the garrison is careless."
 oe_nb.5.a: "Raid Anchialos from the sea"
 oe_nb.5.a.tt: "Chance of success #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_raid_chance')|0]%#! (base #Y 30%#!; #G +15%#! with at least #Y 20#! ships; #G +10%#! while Bulgaria is at war with the Ottomans)\nSuccess: Anchialos comes to the empire (if a player controls Bulgaria, a casus belli against it for #Y 10#! years instead)\nFailure: prestige #R −5#!\nEither way: Bulgaria: opinion of us #R −30#!; a truce with Bulgaria for #Y 5#! years"
 oe_nb.5.b: "Keep a claim for later"
 oe_nb.5.b.tt: "A casus belli against Bulgaria (to conquer the area of Anchialos) for #Y 10#! years\nBulgaria: opinion of us #R −10#!"
 oe_nb.5.c: "Keep the peace"
 oe_nb.5.c.tt: "Bulgaria: opinion of us #G +10#!"
 oe_nb.6.t: "The Franciscans at Vidin"
 oe_nb.6.desc1: "#F In May 1365 King Louis I of Hungary marched on Vidin and took it on 2 June; Ivan Sratsimir and family were carried off to Croatia and held for about four years. Franciscan friars came with the army and tried to force the people into the Catholic faith, mostly in vain. In the autumn of 1369 Sratsimir returned to Vidin as Hungary's vassal.#!\n\nNow #bold #color_yellow Vidin#!#! is Hungary's vassal, and its Orthodox priests have been driven from their churches. The patriarch asks the emperor to take a stand."
 oe_nb.6.desc: "#F In May 1365 King Louis I of Hungary marched on Vidin and took it on 2 June; Ivan Sratsimir and family were carried off to Croatia and held for about four years. Franciscan friars came with the army and tried to force the people into the Catholic faith, mostly in vain. In the autumn of 1369 Sratsimir returned to Vidin as Hungary's vassal.#!\n\nNow the Orthodox of #bold #color_yellow Vidin#!#! appeal to Constantinople: Hungarian Franciscans are forcing conversions in the town. The patriarch asks the emperor to take a stand."
 oe_nb.6.a: "Have the patriarch protest"
 oe_nb.6.a.tt: "Hungary: opinion of us #R −20#!"
 oe_nb.6.b: "The emperor needs Hungary"
 oe_nb.6.b.tt: "Hungary: opinion of us #G +20#!"
 oe_nb.7.t: "The Green Count Turns on Bulgaria"
 oe_nb.7.desc1: "#F In 1366 John V was on the way home from Hungary when Bulgaria refused passage, leaving the emperor stranded near Vidin. Amadeus VI of Savoy, the 'Green Count', who had just won Gallipoli back for the empire, turned north: in October the count took Mesembria, then Anchialos, but failed before Varna. At the end of the year Bulgaria let the emperor through, and the emperor agreed to pay the count's campaign costs, 15,000 florins, in exchange for the towns.#!\n\nNow the Green Count's men hold #bold #color_yellow Anchialos#!#! and the coast around it, waiting for the empire to pay. (Mesembria is not on the map; Burgas and its surroundings stand in for it.) A Bulgarian princess lives at our court, and the marriage agreement still stands."
 oe_nb.7.desc: "#F In 1366 John V was on the way home from Hungary when Bulgaria refused passage, leaving the emperor stranded near Vidin. Amadeus VI of Savoy, the 'Green Count', who had just won Gallipoli back for the empire, turned north: in October the count took Mesembria, then Anchialos, but failed before Varna. At the end of the year Bulgaria let the emperor through, and the emperor agreed to pay the count's campaign costs, 15,000 florins, in exchange for the towns.#!\n\nNow the Green Count's men hold #bold #color_yellow Anchialos#!#! and the coast around it, waiting for the empire to pay. (Mesembria is not on the map; Burgas and its surroundings stand in for it.)"
 oe_nb.7.a: "Take the towns and pay the count"
 oe_nb.7.a.tt: "Anchialos and Burgas, where Bulgaria holds them, come to the empire (if a player controls Bulgaria, a casus belli against it for #Y 10#! years instead)\nBulgaria: opinion of us #R −30#!\nA truce with Bulgaria for #Y 5#! years"
 oe_nb.7.b: "Trade the towns for peace"
 oe_nb.7.b.tt: "The towns stay Bulgarian\nBulgaria: opinion of us #G +30#!"
 oe_nb.8.t: "Another Vassal for the Sultan"
 oe_nb.8.desc1: "#F Around 1373 Tsar Ivan Shishman submitted to Murad I, and the tsar's sister Kera Tamara entered the sultan's harem. The sources differ on the year of the marriage.#!\n\nNow Bulgaria too pays tribute to the Ottomans. The empire and Tarnovo both stand in the sultan's shadow, and some at court want the two to keep in touch."
 oe_nb.8.desc: "#F Around 1373 Tsar Ivan Shishman submitted to Murad I, and the tsar's sister Kera Tamara entered the sultan's harem. The sources differ on the year of the marriage.#!\n\nNow Bulgaria totters under Ottoman pressure. Some at court want to keep in touch with Tarnovo."
 oe_nb.8.a: "Keep in touch with Tarnovo"
 oe_nb.8.a.tt: "Bulgaria: opinion of us #G +25#!\nShould Tarnovo fall within #Y 15#! years, taking in its scribes costs half as much"
 oe_nb.8.b: "Ask the tsar's sister to speak to the sultan"
 oe_nb.8.b.tt: "The sultan's patience #G +10#! (vassal of the sultan)\nOnly a sounding: the sultan may not take it kindly"
 oe_nb.8.c: "Each to their own troubles"
 oe_nb.9.t: "The Last Year of Sis"
 oe_nb.9.desc1: "#F Leo V was crowned at Sis in September 1374. On 13 April the next year the Mamluks stormed Sis; the king fell back to the fortress of Kapan and was soon captured and taken to Egypt. So ended the Armenian kingdom of Cilicia. The king spent some seven years in Egyptian captivity, until the king of Castile paid the ransom.#!\n\nNow the Mamluk host bears down on #bold #color_yellow Sis#!#!. The empire stands guarantor for Cilicia, and Cilician envoys kneel before the emperor, asking the empire to keep its word. The Armenians have not forgotten the help the empire sent in 1337."
 oe_nb.9.desc2: "#F Leo V was crowned at Sis in September 1374. On 13 April the next year the Mamluks stormed Sis; the king fell back to the fortress of Kapan and was soon captured and taken to Egypt. So ended the Armenian kingdom of Cilicia. The king spent some seven years in Egyptian captivity, until the king of Castile paid the ransom.#!\n\nNow the Mamluk host bears down on #bold #color_yellow Sis#!#!. The empire stands guarantor for Cilicia, and Cilician envoys kneel before the emperor, asking the empire to keep its word."
 oe_nb.9.desc3: "#F Leo V was crowned at Sis in September 1374. On 13 April the next year the Mamluks stormed Sis; the king fell back to the fortress of Kapan and was soon captured and taken to Egypt. So ended the Armenian kingdom of Cilicia. The king spent some seven years in Egyptian captivity, until the king of Castile paid the ransom.#!\n\nNow #bold #color_yellow Sis#!#! has fallen, and Cilicia has passed into Mamluk hands. Armenian refugees are fleeing west by sea, and some have reached the empire's ports. The Armenians have not forgotten the help the empire sent in 1337."
 oe_nb.9.desc4: "#F Leo V was crowned at Sis in September 1374. On 13 April the next year the Mamluks stormed Sis; the king fell back to the fortress of Kapan and was soon captured and taken to Egypt. So ended the Armenian kingdom of Cilicia. The king spent some seven years in Egyptian captivity, until the king of Castile paid the ransom.#!\n\nNow #bold #color_yellow Sis#!#! has fallen, and Cilicia has passed into Mamluk hands. Armenian refugees are fleeing west by sea, and some have reached the empire's ports."
 oe_nb.9.desc5: "#F Leo V was crowned at Sis in September 1374. On 13 April the next year the Mamluks stormed Sis; the king fell back to the fortress of Kapan and was soon captured and taken to Egypt. So ended the Armenian kingdom of Cilicia. The king spent some seven years in Egyptian captivity, until the king of Castile paid the ransom.#!\n\nNow the Mamluk host bears down on #bold #color_yellow Sis#!#!, and Cilicia's fate hangs by a thread. Armenian merchants have begun to flee west with what they own. The Armenians have not forgotten the help the empire sent in 1337."
 oe_nb.9.desc: "#F Leo V was crowned at Sis in September 1374. On 13 April the next year the Mamluks stormed Sis; the king fell back to the fortress of Kapan and was soon captured and taken to Egypt. So ended the Armenian kingdom of Cilicia. The king spent some seven years in Egyptian captivity, until the king of Castile paid the ransom.#!\n\nNow the Mamluk host bears down on #bold #color_yellow Sis#!#!, and Cilicia's fate hangs by a thread. Armenian merchants have begun to flee west with what they own."
 oe_nb.9.a: "Honour the guarantee"
 oe_nb.9.a.tt: "Cilicia gains [ShowModifier('oe_nb_cil_roman_aid')] for #Y 10#! years\nThe empire gains [ShowModifier('oe_nb_cil_burden')] for #Y 10#! years\nThe Mamluks: opinion of us #R −50#!\nCilicia: opinion of us #G +40#!\nCilicia is spared"
 oe_nb.9.b: "Plead in Cairo"
 oe_nb.9.b.tt: "#G 40%#! chance the sultan holds back and Cilicia is spared\nOtherwise (#R 60%#!) Sis falls and Cilicia passes to the Mamluks"
 oe_nb.9.c: "Withdraw the guarantee"
 oe_nb.9.c.tt: "The guarantee of Cilicia is withdrawn; Sis falls and Cilicia passes to the Mamluks\nCilicia: opinion of us #R −50#!"
 oe_nb.9.d: "Welcome the Armenian merchants"
 oe_nb.9.d.tt: "The empire gains [ShowModifier('oe_nb_armenian_merchants')] for #Y 10#! years"
 oe_nb.9.e: "Raise a ransom for the king"
 oe_nb.9.e.tt: "The empire offers a share of the captive king's ransom"
 oe_nb.9.f: "Stay out of eastern affairs"
 oe_nb.10.t: "The Fall of Tarnovo"
 oe_nb.10.desc1: "#F On 17 July 1393, after a three-month siege, the Ottomans took Tarnovo, capital of Bulgaria, and sent Patriarch Euthymius into exile. Tsar Ivan Shishman held out at Nikopol with what was left of the realm.#!\n\nNow #bold #color_yellow Tarnovo#!#! is in Ottoman hands. Scribes, monks and copyists are fleeing south with their books, and some have reached the empire's border. Vidin still stands, though no one expects it to last. The sultan who took it is the same one who takes the empire's tribute."
 oe_nb.10.desc2: "#F On 17 July 1393, after a three-month siege, the Ottomans took Tarnovo, capital of Bulgaria, and sent Patriarch Euthymius into exile. Tsar Ivan Shishman held out at Nikopol with what was left of the realm.#!\n\nNow #bold #color_yellow Tarnovo#!#! is in Ottoman hands. Scribes, monks and copyists are fleeing south with their books, and some have reached the empire's border. The sultan who took it is the same one who takes the empire's tribute."
 oe_nb.10.desc3: "#F On 17 July 1393, after a three-month siege, the Ottomans took Tarnovo, capital of Bulgaria, and sent Patriarch Euthymius into exile. Tsar Ivan Shishman held out at Nikopol with what was left of the realm.#!\n\nNow #bold #color_yellow Tarnovo#!#! is in Ottoman hands. Scribes, monks and copyists are fleeing south with their books, and some have reached the empire's border. Vidin still stands, though no one expects it to last."
 oe_nb.10.desc: "#F On 17 July 1393, after a three-month siege, the Ottomans took Tarnovo, capital of Bulgaria, and sent Patriarch Euthymius into exile. Tsar Ivan Shishman held out at Nikopol with what was left of the realm.#!\n\nNow #bold #color_yellow Tarnovo#!#! is in Ottoman hands. Scribes, monks and copyists are fleeing south with their books, and some have reached the empire's border."
 oe_nb.10.a: "Take in the scribes and monks"
 oe_nb.10.a.tt: "The empire gains [ShowModifier('oe_nb_tarnovo_scribes')] for #Y 20#! years\nOur ties with Tarnovo halve the cost"
 oe_nb.10.b: "Take in the scribes and monks"
 oe_nb.10.b.tt: "The empire gains [ShowModifier('oe_nb_tarnovo_scribes')] for #Y 20#! years"
 oe_nb.10.c: "Close the gates"
 oe_nb.10.c.tt: "The sultan's patience #G +5#! (vassal of the sultan)"
 oe_nb.10.d: "Close the gates"
 oe_nb.10.d.tt: "The Ottomans: opinion of us #G +10#!"
 oe_nb.10.e: "Appeal to the West"
 oe_nb.10.e.tt: "Hungary: opinion of us #G +15#!\nThe West will remember the empire's appeal"
 oe_nb.11.t: "The Gates of Vidin"
 oe_nb.11.desc1: "#F In September 1396 the crusaders from the West were routed at Nicopolis. At the end of that year or early the next, the Ottomans took Vidin; Ivan Sratsimir was taken to Bursa and died there. The Second Bulgarian Empire was at an end.#!\n\nNow, hard on the news of the rout at Nicopolis, the gates of #bold #color_yellow Vidin#!#! have opened to the Ottomans. The last Bulgarian nobles have fled to the empire."
 oe_nb.11.desc2: "#F In September 1396 the crusaders from the West were routed at Nicopolis. At the end of that year or early the next, the Ottomans took Vidin; Ivan Sratsimir was taken to Bursa and died there. The Second Bulgarian Empire was at an end.#!\n\nNow, for all the crusaders' victory at Nicopolis, #bold #color_yellow Vidin#!#! has fallen to the Ottomans. The last Bulgarian nobles have fled to the empire."
 oe_nb.11.desc: "#F In September 1396 the crusaders from the West were routed at Nicopolis. At the end of that year or early the next, the Ottomans took Vidin; Ivan Sratsimir was taken to Bursa and died there. The Second Bulgarian Empire was at an end.#!\n\nNow the gates of #bold #color_yellow Vidin#!#! have opened to the Ottomans, and Bulgaria's last stronghold is gone. The last Bulgarian nobles have fled to the empire."
 oe_nb.11.a: "Give the exiles a house"
 oe_nb.11.a.tt: "The empire gains [ShowModifier('oe_nb_bul_exiles')] for #Y 10#! years"
 oe_nb.11.b: "Mourn, and ask no more"
 oe_nb.91.t: "News Comes Back"
 oe_nb.91.desc1: "The raid succeeded: our ships put in by night, and the empire's banner now flies over #bold #color_yellow Anchialos#!#!."
 oe_nb.91.desc2: "The raid succeeded but the town could not be held: the Bulgarians rallied, and the court has marked the debt to collect later (a casus belli for #Y 10#! years)."
 oe_nb.91.desc3: "The raid failed: the garrison was ready, and our ships came back empty-handed."
 oe_nb.91.desc4: "The sultan in Cairo accepted the gifts and agreed to hold back. Cilicia is spared."
 oe_nb.91.desc5: "Cairo would not relent: #bold #color_yellow Sis#!#! has fallen and Cilicia has passed to the Mamluks."
 oe_nb.91.desc6: "Cairo would not relent, and the Mamluk host remains in Cilicia."
 oe_nb.91.desc: "The news has come back."
 oe_nb.91.a: "So be it"
 oe_nb.90.t: "Bulgaria, Moldavia and Cilicia: the choice takes effect"
