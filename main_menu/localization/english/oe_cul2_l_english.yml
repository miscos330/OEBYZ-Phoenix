# NEW 2026-11-21 v9.9 Worker 3: 4-Speed Organic Assimilation & Cultural Capitals 2.0 (oe_cul2_). Generated by gen_v99_culture.py; edit the generator, not this file.
 AUTO_MODIFIER_NAME_oe_cul2_urban_melting_pot:0 "Urban Cultural Melting Pot"
 AUTO_MODIFIER_DESC_oe_cul2_urban_melting_pot:0 "Well-controlled towns and cities equipped with universities, libraries, theaters, academies, madrasas, or presses draw artisans and scholars into the realm's cultural mainstream, accelerating local assimilation and literacy."
 AUTO_MODIFIER_NAME_oe_cul2_metropolis_academy_surge:0 "Metropolitan Academy Surge"
 AUTO_MODIFIER_DESC_oe_cul2_metropolis_academy_surge:0 "A securely governed metropolis anchored by a major university or academy serves as a premier cultural engine, compounding local assimilation pull and raising maximum literacy."
 AUTO_MODIFIER_NAME_oe_cul2_maritime_entrepot:0 "Cosmopolitan Maritime Entrepot"
 AUTO_MODIFIER_DESC_oe_cul2_maritime_entrepot:0 "A well-connected port with thriving wharves, markets, and customs houses fosters organic civic assimilation through shared mercantile speech and guild life."
 AUTO_MODIFIER_NAME_oe_cul2_rural_heartland_friction:0 "Remote Rural & Rugged Terrain Friction"
 AUTO_MODIFIER_DESC_oe_cul2_rural_heartland_friction:0 "Low-control rural districts outside the capital region, along with roadless mountains, deserts, jungles, and arctic tracts, strongly resist rapid cultural change until roads, state control, and urban institutions arrive."
 AUTO_MODIFIER_NAME_oe_cul2_remote_low_control_friction:0 "Unroaded Backwater Isolation"
 AUTO_MODIFIER_DESC_oe_cul2_remote_low_control_friction:0 "Severely under-controlled rural settlements without any road network remain culturally insulated, further slowing local pop assimilation."
 AUTO_MODIFIER_NAME_oe_cul2_frontier_settlement_pull:0 "Active Frontier Settlement Pull"
 AUTO_MODIFIER_DESC_oe_cul2_frontier_settlement_pull:0 "Frontier districts undergoing active homesteading, military-farmer resettlement, or chartered commercial settlement attract newcomers and accelerate organic cultural integration."
 AUTO_MODIFIER_NAME_oe_cul2_trilingual_harmony:0 "Tri-Language Harmony"
 AUTO_MODIFIER_DESC_oe_cul2_trilingual_harmony:0 "Court, liturgical, and capital market languages stand in full alignment, uniting decrees, sacred texts, and mercantile contracts to strengthen legislation, cultural influence, and integration."
 AUTO_MODIFIER_NAME_oe_cul2_dual_court_liturgy_harmony:0 "Court-Liturgical Concord"
 AUTO_MODIFIER_DESC_oe_cul2_dual_court_liturgy_harmony:0 "Chancery and liturgy share a common tongue even amid a polyglot marketplace, reinforcing legislative coherence, cultural tradition, and literacy."
 AUTO_MODIFIER_NAME_oe_cul2_bilingual_imperial_chancellery:0 "Bilingual Imperial Chancellery"
 AUTO_MODIFIER_DESC_oe_cul2_bilingual_imperial_chancellery:0 "A standing multilingual chancery staffed by imperial translators lowers accepted-culture upkeep, expands cultural capacity, and boosts cross-lingual commerce in exchange for heavier court administration costs."
 oe_cul2_act_toggle_bilingual_chancellery:0 "Establish or Reform Bilingual Chancellery"
 oe_cul2_act_toggle_bilingual_chancellery_desc:0 "For realms with at least three accepted cultures and a pluralist, scholarly, millet, or translation-bureau framework, activate or retire the standing Bilingual Imperial Chancellery."
 oe_cul2_bilingual_chancellery_enabled_tt:0 "Enabled the #Y Bilingual Imperial Chancellery#! auto-modifier while multilingual requirements are met."
 oe_cul2_bilingual_chancellery_disabled_tt:0 "Retired the #Y Bilingual Imperial Chancellery#!, relieving court spending overhead."
 oe_cul2_act_patronize_lexicon_translation:0 "Commission Imperial Polyglot Lexicon"
 oe_cul2_act_patronize_lexicon_translation_desc:0 "Sponsor scholars from across the realm to compile polyglot lexicons and translations, boosting cultural influence, literacy, institution growth, and research for 10 years."
 oe_cul2_act_promote_market_lingua_franca:0 "Charter Commercial Lingua Franca"
 oe_cul2_act_promote_market_lingua_franca_desc:0 "Install sworn interpreters and bilingual notaries in major ports, raising merchant power, trade range, burgher satisfaction, and capital assimilation for 10 years."
 oe_cul2_act_convene_cultural_congress:0 "Convene Cultural Synthesis Congress"
 oe_cul2_act_convene_cultural_congress_desc:0 "If eligible for one of the five Eurasian Cultural Hybridization Arcs, formally convene its synthesis assembly; otherwise host an imperial cultural symposium to raise prestige, artistic talent, and cultural influence."
 oe_cul2_priv_accepted_guild_charter:0 "Accepted Community Guild Charter"
 oe_cul2_priv_accepted_guild_charter_desc:0 "Grants accepted-culture merchants and artisans protected guild houses in imperial ports, boosting maritime commerce and burgher satisfaction at the cost of lower direct tax yield and greater burgher clout."
 oe_cul2_priv_vernacular_courts:0 "Vernacular Customary Courts"
 oe_cul2_priv_vernacular_courts_desc:0 "Permits local courts in non-primary communities to hear disputes in vernacular speech and custom, curbing unrest and separatism while noticeably slowing cultural assimilation."
 oe_cul2_priv_translation_bureau:0 "Imperial Translation Bureau"
 oe_cul2_priv_translation_bureau_desc:0 "Establishes a permanent clerical and scholarly translation bureau that raises maximum literacy, institution spread, and artistic output while increasing court administrative expenditure."
 oe_cul2_priv_autonomous_voivodeship:0 "Autonomous Frontier Voivodeships"
 oe_cul2_priv_autonomous_voivodeship_desc:0 "Empowers frontier nobles and voivodes to muster non-primary communities under local banners, boosting wrong-culture levies, manpower, and fort defense at the expense of crown estate power."
 STATIC_MODIFIER_NAME_oe_cul2_frontier_charter_loc:0 "Chartered Frontier & Interpreter Quarter"
 STATIC_MODIFIER_DESC_oe_cul2_frontier_charter_loc:0 "A chartered commercial or frontier settlement supported by imperial interpreters, boosting local assimilation, merchant power, and literacy."
 STATIC_MODIFIER_NAME_oe_cul2_beacon_city_loc_mod:0 "Radiance of the World Cultural Capital"
 STATIC_MODIFIER_DESC_oe_cul2_beacon_city_loc_mod:0 "Standing atop the seven great cultural capitals of Eurasia, this metropolis magnetizes scholars, artists, and migrants from afar."
 STATIC_MODIFIER_NAME_oe_cul2_polyglot_lexicon_mod:0 "Imperial Polyglot Lexicon"
 STATIC_MODIFIER_DESC_oe_cul2_polyglot_lexicon_mod:0 "Standardized polyglot lexicons circulate across chanceries and schools, raising cultural influence, literacy, and scholarly progress."
 STATIC_MODIFIER_NAME_oe_cul2_market_lingua_mod:0 "Commercial Lingua Franca Network"
 STATIC_MODIFIER_DESC_oe_cul2_market_lingua_mod:0 "Shared commercial contracts and port interpreters reduce friction across markets, boosting merchant power and trade reach."
 STATIC_MODIFIER_NAME_oe_cul2_cultural_symposium_mod:0 "Imperial Cultural Symposium"
 STATIC_MODIFIER_DESC_oe_cul2_cultural_symposium_mod:0 "A grand gathering of scholars, poets, and master artisans elevates cultural influence, tradition, and artistic brilliance."
 STATIC_MODIFIER_NAME_oe_cul2_beacon_mediterranean_mod:0 "Regional Beacon: Mediterranean"
 STATIC_MODIFIER_DESC_oe_cul2_beacon_mediterranean_mod:0 "Leading the Mediterranean rivalry between Constantinople and Rome brings classical prestige and faster institution diffusion."
 STATIC_MODIFIER_NAME_oe_cul2_beacon_western_mod:0 "Regional Beacon: Western Europe"
 STATIC_MODIFIER_DESC_oe_cul2_beacon_western_mod:0 "Western European courtly letters and university prestige radiate from Paris, enhancing diplomacy and cultural magnetism."
 STATIC_MODIFIER_NAME_oe_cul2_beacon_east_asia_mod:0 "Regional Beacon: East Asia"
 STATIC_MODIFIER_DESC_oe_cul2_beacon_east_asia_mod:0 "Imperial codification, academies, and statecraft centered in Dadu lead East Asia, strengthening prestige and legislative order."
 STATIC_MODIFIER_NAME_oe_cul2_beacon_islamic_mod:0 "Regional Beacon: Islamic World"
 STATIC_MODIFIER_DESC_oe_cul2_beacon_islamic_mod:0 "Leading the scholarly contest between Cairo and Samarkand propels scientific inquiry, prestige, and cultural sway."
 STATIC_MODIFIER_NAME_oe_cul2_beacon_eastern_mod:0 "Regional Beacon: Eastern Europe"
 STATIC_MODIFIER_DESC_oe_cul2_beacon_eastern_mod:0 "Monastic scriptoria, chronicles, and civic learning in Moscow establish a cultural lighthouse across Eastern Europe and the steppe."
 STATIC_MODIFIER_NAME_oe_cul2_world_cultural_capital_mod:0 "World Cultural Capital"
 STATIC_MODIFIER_DESC_oe_cul2_world_cultural_capital_mod:0 "Crowned supreme in the annual cultural race of Eurasia's seven great capitals, commanding unmatched diplomatic prestige and artistic patronage."
 STATIC_MODIFIER_NAME_oe_cul2_rivalry_patronage_mod:0 "Cultural Counter-Patronage"
 STATIC_MODIFIER_DESC_oe_cul2_rivalry_patronage_mod:0 "To reclaim cultural primacy, the court commits heavy patronage to recruit master artists and elevate cultural influence."
 STATIC_MODIFIER_NAME_oe_cul2_rivalry_academy_mod:0 "Academic Renewal Campaign"
 STATIC_MODIFIER_DESC_oe_cul2_rivalry_academy_mod:0 "Answering a rival's cultural ascent, the realm invests deeply in academies, literacy, and durable cultural tradition."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_anatolia_sym_mod:0 "Greco-Anatolian Symbiosis"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_anatolia_sym_mod:0 "Greek silk workshops, Rum court poetry, and Anatolian frontier horsemanship flourish together, trading slower assimilation for vibrant commerce and influence."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_anatolia_assim_mod:0 "Guided Anatolian Integration"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_anatolia_assim_mod:0 "State-sponsored schools and provincial administration steadily draw Anatolia toward the primary identity at the cost of temporary estate friction."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_anatolia_auton_mod:0 "Traditional Anatolian Autonomy"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_anatolia_auton_mod:0 "Preserving local guild and village customs secures reliable taxes and religious peace while leaving cultural boundaries intact."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_magna_sym_mod:0 "Magna Graecia Maritime Synthesis"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_magna_sym_mod:0 "Greek humanist scholarship and Italian maritime banking intertwine, accelerating institutions, sea trade, and artistic mastery."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_magna_assim_mod:0 "Aegean-Adriatic Mainstream Integration"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_magna_assim_mod:0 "Unified legal codes and state academies absorb port elites into the dominant tradition, raising assimilation and legislative order."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_magna_auton_mod:0 "Maritime Quarter Charters"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_magna_auton_mod:0 "Honoring autonomous maritime merchant quarters secures broad trade reach and burgher loyalty at the expense of slower assimilation."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_yuan_sym_mod:0 "Sino-Mongol-Semu Synthesis"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_yuan_sym_mod:0 "Bilingual imperial colleges, Semu astronomy, and classical civil examinations turn a multi-ethnic empire into an administrative and scholarly engine."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_yuan_assim_mod:0 "Imperial Orthodoxy Integration"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_yuan_assim_mod:0 "Centralized rites and state schooling align diverse subjects with the primary imperial tradition, speeding assimilation and crown authority."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_yuan_auton_mod:0 "Rule According to Local Custom"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_yuan_auton_mod:0 "Maintaining parallel steppe and sedentary customs preserves estate harmony, tax yield, and religious tolerance."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_rus_sym_mod:0 "Russo-Steppe Yam & Cossack Synthesis"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_rus_sym_mod:0 "Service Tatar princes, frontier Cossack hosts, and Yam relay roads sharpen light cavalry tactics, frontier levies, and administrative reach."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_rus_assim_mod:0 "Volga-Steppe Crown Integration"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_rus_assim_mod:0 "Fortified towns, monasteries, and crown administration steadily draw steppe borderlands into the primary Rus' polity."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_rus_auton_mod:0 "Kasimov-Style Frontier Autonomy"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_rus_auton_mod:0 "Preserving autonomous Tatar service appanages and Cossack hosts yields deep manpower reserves and sturdy frontier defenses."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_balkan_sym_mod:0 "Greco-Slavic Orthodox Commonwealth"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_balkan_sym_mod:0 "Mount Athos, Ohrid, and Tarnovo bind Greek and Church Slavonic learning into one Orthodox commonwealth, lifting literacy and easing Balkan separatism."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_balkan_assim_mod:0 "Balkan Canonical Integration"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_balkan_assim_mod:0 "Standardized chancery and cathedral schools draw Balkan highlands toward the core identity, raising assimilation and legislative efficiency."
 STATIC_MODIFIER_NAME_oe_cul2_hyb_balkan_auton_mod:0 "Monastic & Communal Balkan Concord"
 STATIC_MODIFIER_DESC_oe_cul2_hyb_balkan_auton_mod:0 "Honoring local parishes and village liberties wins clerical and peasant loyalty while sharply dampening separatism."
 oe_cul2_hyb.1.t:0 "Two Tongues of Anatolia: The Greco-Anatolian Synthesis"
 oe_cul2_hyb.1.d:0 "Generations of war, commerce, and intermarriage have woven Greek silk weavers, Cappadocian townsfolk, and Turkish frontier riders into a single Anatolian tapestry. From Konya to Smyrna, guildsmen and elders now await the crown's decree on the plateau's cultural destiny."
 oe_cul2_hyb.1.a:0 "Champion Greco-Anatolian symbiosis in court, loom, and saddle"
 oe_cul2_hyb.1.b:0 "Fund state academies to guide steady mainstream integration"
 oe_cul2_hyb.1.c:0 "Preserve traditional communal and guild autonomies"
 oe_cul2_hyb.2.t:0 "Magna Graecia Reborn: The Italo-Byzantine Maritime Bridge"
 oe_cul2_hyb.2.d:0 "Greek scholars carry classical manuscripts westward while Italian maritime statutes, banking ledgers, and shipwright innovations flow east across the Aegean and Adriatic. Port elites on both shores now urge the realm to institutionalize this maritime renaissance."
 oe_cul2_hyb.2.a:0 "Patronize bilingual humanist academies and joint maritime ventures"
 oe_cul2_hyb.2.b:0 "Fold port elites into our unified imperial legal tradition"
 oe_cul2_hyb.2.c:0 "Uphold autonomous maritime quarters to maximize Mediterranean trade"
 oe_cul2_hyb.3.t:0 "The Polyglot Chancery of Dadu: Sino-Mongol-Semu Synthesis"
 oe_cul2_hyb.3.d:0 "Between Dadu's Imperial College, astronomical observatories, and Jiangnan printing houses, Chinese statecraft, Mongol imperial tradition, and Semu mathematical learning are forging a distinctly Eurasian court culture. Ministers and princes now debate the empire's lasting path."
 oe_cul2_hyb.3.a:0 "Institutionalize bilingual colleges and Semu scholarly bureaus"
 oe_cul2_hyb.3.b:0 "Advance unified imperial rites and centralized assimilation"
 oe_cul2_hyb.3.c:0 "Govern each realm by its own customs to secure peace and revenue"
 oe_cul2_hyb.4.t:0 "Winds of the Volga and Don: Russo-Steppe & Cossack Synthesis"
 oe_cul2_hyb.4.d:0 "As East Slavic settlers press down the great rivers onto the Kipchak steppe, service Tatar princes, free Cossack hosts, and ancient Yam relay networks are reshaping the realm's military and administrative backbone. The boyar council awaits the sovereign's verdict."
 oe_cul2_hyb.4.a:0 "Integrate Yam relays, service Tatar cavalry, and Cossack hosts"
 oe_cul2_hyb.4.b:0 "Anchor the steppe with fortified towns and steady crown assimilation"
 oe_cul2_hyb.4.c:0 "Grant Kasimov-style frontier autonomies in return for loyal levies"
 oe_cul2_hyb.5.t:0 "From Athos to Tarnovo: The Greco-Slavic Orthodox Commonwealth"
 oe_cul2_hyb.5.d:0 "Across Mount Athos, Ohrid, and Tarnovo, Greek theological treatises and Church Slavonic manuscripts circulate hand in hand. Shared Orthodox liturgy and monastic learning offer a historic bridge across the mountainous divisions of the Balkans."
 oe_cul2_hyb.5.a:0 "Sponsor bilingual Greek-Slavonic scriptoria across the Orthodox Balkans"
 oe_cul2_hyb.5.b:0 "Use unified cathedral schools to accelerate core cultural integration"
 oe_cul2_hyb.5.c:0 "Guarantee monastic and communal liberties to end Balkan separatism"
 oe_cul2_cap.1.t:0 "World Cultural Capital: The Eternal Radiance of Constantinople"
 oe_cul2_cap.1.d:0 "From Hagia Sophia's dome to the academies and workshops along the Golden Horn, Constantinople once again captivates scholars, envoys, and artisans across East and West. In the annual contest of Eurasia's seven cultural capitals, New Rome claims the global crown!"
 oe_cul2_cap.1.a:0 "Welcome scholars from every shore to spread our influence"
 oe_cul2_cap.1.b:0 "Deepen classical traditions and civic stability at home"
 oe_cul2_cap.2.t:0 "World Cultural Capital: Rome Renews Its Classical Splendor"
 oe_cul2_cap.2.d:0 "Along the Tiber, marble porticoes, libraries, and master studios shine anew as jurists, humanists, and sculptors gather from across Christendom. Rome rises above Eurasia's seven great capitals to claim the crown of World Cultural Capital!"
 oe_cul2_cap.2.a:0 "Proclaim the Eternal City's splendor across the world"
 oe_cul2_cap.2.b:0 "Channel this prestige into enduring scholarly tradition"
 oe_cul2_cap.3.t:0 "World Cultural Capital: Paris Sets the Standard of Letters"
 oe_cul2_cap.3.d:0 "Parisian lecture halls, royal salons, and printing houses have become the model emulated by courts and scholars far and wide. Surpassing Eurasia's seven great capitals, Paris ascends as the World Cultural Capital!"
 oe_cul2_cap.3.a:0 "Let Parisian letters and style lead the courts of nations"
 oe_cul2_cap.3.b:0 "Anchor the realm's academies and cultural traditions"
 oe_cul2_cap.4.t:0 "World Cultural Capital: Dadu, Pinnacle of Civilized Learning"
 oe_cul2_cap.4.d:0 "Dadu's observatories, imperial colleges, publishing houses, and grand court rites astound envoys arriving by steppe and sea. Standing foremost among Eurasia's seven cultural capitals, Dadu claims the mantle of World Cultural Capital!"
 oe_cul2_cap.4.a:0 "Publish our classics and extend our cultural radiance afar"
 oe_cul2_cap.4.b:0 "Cultivate enduring scholarship and harmony within the realm"
 oe_cul2_cap.5.t:0 "World Cultural Capital: Cairo, Jewel of Nile Scholarship"
 oe_cul2_cap.5.d:0 "The lecture courts of Al-Azhar, Nile translation houses, and grand domed mosques draw minds from the Mediterranean to the Indian Ocean. Triumphing among Eurasia's seven cultural capitals, Cairo is hailed as the World Cultural Capital!"
 oe_cul2_cap.5.a:0 "Expand Al-Azhar's renown and attract scholars from every land"
 oe_cul2_cap.5.b:0 "Preserve our manuscripts and fortify cultural tradition"
 oe_cul2_cap.6.t:0 "World Cultural Capital: Samarkand, Turquoise Crown of the Silk Road"
 oe_cul2_cap.6.d:0 "The turquoise madrasas of the Registan, celestial observatories, and Perso-Turkic poetic courts make Samarkand the luminous heart between Transoxiana, Persia, India, and China. Samarkand claims the crown of World Cultural Capital!"
 oe_cul2_cap.6.a:0 "Summon Silk Road astronomers and master painters to our court"
 oe_cul2_cap.6.b:0 "Strengthen madrasas and enduring scholarly traditions"
 oe_cul2_cap.7.t:0 "World Cultural Capital: Moscow, Rising Beacon of the North"
 oe_cul2_cap.7.d:0 "Beneath the gilded domes of the Kremlin, royal presses, chroniclers, and icon workshops have raised a northern civilization admired from Europe to the steppe. Moscow surges to the summit of Eurasia's seven cultural capitals!"
 oe_cul2_cap.7.a:0 "Proclaim the white-stone capital's cultural ascent to all nations"
 oe_cul2_cap.7.b:0 "Deepen cathedral schools and enduring national tradition"
 oe_cul2_cap.8.t:0 "Cultural Primacy Challenged: Rival Claims the World Capital Crown"
 oe_cul2_cap.8.d:0 "Envoys and traveling scholars whisper that a rival Eurasian metropolis has overtaken our realm in cultural influence, claiming the mantle of World Cultural Capital. Our court must decide how to answer this soft-power challenge!"
 oe_cul2_cap.8.a:0 "Launch lavish court patronage to reclaim cultural influence"
 oe_cul2_cap.8.b:0 "Invest in academies and literacy to build lasting strength"
 oe_cul2_cap.9.t:0 "Regional Beacon of Civilization"
 oe_cul2_cap.9.d:0 "Through soaring cultural influence, urban grandeur, and flourishing academies, our cultural metropolis now stands foremost in its Eurasian macro-region as a Regional Beacon of Civilization. Further investment in universities, arts, and prestige can propel it to the global crown!"
 oe_cul2_cap.9.a:0 "Build upon this acclaim toward the global cultural crown"
