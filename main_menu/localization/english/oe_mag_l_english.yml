l_english:
 oe_mag_b_maghreb_rivalry: "Tripartite Maghreb Hegemony Rivalry"
 oe_mag_b_maghreb_truce: "Maghreb Caravan Truce Accord"
 oe_mag_b_gibraltar_accord: "Strait of Gibraltar Customs Accord"
 oe_mag_b_ottoman_corsair_bond: "Ottoman-Barbary Corsair Protection Pact"
 oe_mag_b_barbary_raids: "Scourge of the Barbary Corsairs"
 oe_mag_b_saharan_gold_tie: "Trans-Saharan Gold Caravan Bond"
 STATIC_MODIFIER_NAME_oe_mag_tripartite_hegemony: "Maghreb Hegemony Ambition"
 STATIC_MODIFIER_DESC_oe_mag_tripartite_hegemony: "Vying for supreme mastery across Fez, Tlemcen, and Tunis fires cavalry and morale while raising stability costs and regional suspicion."
 STATIC_MODIFIER_NAME_oe_mag_caravan_truce: "Maghreb Caravan Truce"
 STATIC_MODIFIER_DESC_oe_mag_caravan_truce: "Halting internecine campaigns to protect Maghreb caravan roads enriches merchants and diplomacy at a modest cost to martial edge."
 STATIC_MODIFIER_NAME_oe_mag_berber_tribal_levies: "Berber Tribal Levy Charter"
 STATIC_MODIFIER_DESC_oe_mag_berber_tribal_levies: "Granting grazing charters to Atlas and Saharan Amazigh confederacies swells manpower and tribal loyalty while loosening central control."
 STATIC_MODIFIER_NAME_oe_mag_strait_guard_mod: "Strait of Gibraltar Maritime Guard"
 STATIC_MODIFIER_DESC_oe_mag_strait_guard_mod: "Garrisoning Ceuta and Tangier with shore batteries and patrol galleys secures the Pillars of Hercules while raising naval upkeep."
 STATIC_MODIFIER_NAME_oe_mag_strait_customs_mod: "Ceuta-Tangier Strait Customs"
 STATIC_MODIFIER_DESC_oe_mag_strait_customs_mod: "Opening Gibraltar customs arrangements with Iberian realms lifts trade receipts and burgher contentment at the price of prestige and clerical anger."
 STATIC_MODIFIER_NAME_oe_mag_independent_taifa: "Independent Barbary Taifa of Rais"
 STATIC_MODIFIER_DESC_oe_mag_independent_taifa: "Autonomous corsair captains turn Barbary harbors into feared galley havens, bolstering raiders and sailors while hurting diplomacy and central control."
 STATIC_MODIFIER_NAME_oe_mag_ottoman_eyalet_corsairs: "Ottoman-Backed Barbary Artillery Fleet"
 STATIC_MODIFIER_DESC_oe_mag_ottoman_eyalet_corsairs: "Accepting Ottoman patronage brings Janissary gunners and foundry cannon to North African ports while curbing local crown autonomy."
 STATIC_MODIFIER_NAME_oe_mag_med_customs_order: "Regularized Maghreb Maritime Customs"
 STATIC_MODIFIER_DESC_oe_mag_med_customs_order: "Reining in corsair captains under formal port tariffs enriches merchants and suppresses piracy while sacrificing raiding galley punch."
 STATIC_MODIFIER_NAME_oe_mag_grand_corso_economy: "Grand Corso Privateering Economy"
 STATIC_MODIFIER_DESC_oe_mag_grand_corso_economy: "Coordinated corsair squadrons sweep Western Mediterranean sea lanes for prizes and recruits while alienating legitimate merchants and courts."
 STATIC_MODIFIER_NAME_oe_mag_western_raid_pressure: "Barbary Coastal Raid Pressure"
 STATIC_MODIFIER_DESC_oe_mag_western_raid_pressure: "Relentless Barbary raids disrupt Western Mediterranean shipping and coastal prosperity while forcing naval crews into hard readiness."
 STATIC_MODIFIER_NAME_oe_mag_ransom_passports: "Mediterranean Ransom & Passports"
 STATIC_MODIFIER_DESC_oe_mag_ransom_passports: "Issuing paid maritime safe-conducts and regulated ransoms turns piracy into steady tribute, offset by constant escort upkeep."
 STATIC_MODIFIER_NAME_oe_mag_corsair_last_stand: "Last Stand of the Barbary Ports"
 STATIC_MODIFIER_DESC_oe_mag_corsair_last_stand: "Under bombardment by great-power squadrons, corsair strongholds double down on coastal defense and fanatical seamanship while lawful commerce collapses."
 STATIC_MODIFIER_NAME_oe_mag_piracy_pacified: "Western Mediterranean Pacified"
 STATIC_MODIFIER_DESC_oe_mag_piracy_pacified: "Breaking the century-old Barbary corsair network restores secure Mediterranean commerce and maritime presence at ongoing patrol expense."
 STATIC_MODIFIER_NAME_oe_mag_regular_admiral_fleet: "Regularized Maghreb State Navy"
 STATIC_MODIFIER_DESC_oe_mag_regular_admiral_fleet: "Folding independent corsair crews into a disciplined state admiralty elevates naval tradition and cruisers while increasing fleet maintenance."
 STATIC_MODIFIER_NAME_oe_mag_corsair_commission_mod: "Barbary Privateering Commission"
 STATIC_MODIFIER_DESC_oe_mag_corsair_commission_mod: "State-sealed corsair letters boost privateer durability, galley strength, and sailor pools at the expense of diplomatic standing."
 STATIC_MODIFIER_NAME_oe_mag_mali_gold_caravans: "Trans-Saharan Royal Gold Caravans"
 STATIC_MODIFIER_DESC_oe_mag_mali_gold_caravans: "Vast camel trains carrying Niger gold north from Niani, Timbuktu, and Gao pour trade wealth and renown into the realm while stoking inflation."
 STATIC_MODIFIER_NAME_oe_mag_salt_gold_regulation: "Timbuktu-Gao Salt-Gold Regulation"
 STATIC_MODIFIER_DESC_oe_mag_salt_gold_regulation: "Regulating salt-for-gold exchange across Timbuktu and Gao nurtures steady taxes, stability, and prosperity while moderating windfall trade profits."
 STATIC_MODIFIER_NAME_oe_mag_gold_mint_surge: "Saharan Bullion Surge & Overheated Mint"
 STATIC_MODIFIER_DESC_oe_mag_gold_mint_surge: "Torrents of Saharan gold dust flood North African mints, surging fiscal receipts while fueling inflation and monetary overheating."
 STATIC_MODIFIER_NAME_oe_mag_sijilmasa_reserve: "Sijilmasa Gold Reserve & Customs"
 STATIC_MODIFIER_DESC_oe_mag_sijilmasa_reserve: "Establishing a bullion reserve at Sijilmasa curbs runaway inflation and steadies merchants at the cost of restrained immediate taxation."
 STATIC_MODIFIER_NAME_oe_mag_roman_sahara_caravan: "Rome Returns to the Sahara"
 STATIC_MODIFIER_DESC_oe_mag_roman_sahara_caravan: "Imperial caravans marching south from Carthage and Tripoli reopen classical desert routes to Timbuktu, expanding reach and prestige with mild gold inflation."
 STATIC_MODIFIER_NAME_oe_mag_saharan_caravan_mod: "Sponsored Trans-Saharan Caravan"
 STATIC_MODIFIER_DESC_oe_mag_saharan_caravan_mod: "State-escorted salt and gold caravans link the Sahel to Maghreb markets, boosting trade and merchant capacity with gentle inflationary pressure."
 STATIC_MODIFIER_NAME_oe_mag_african_annona: "Carthaginian Annona Grain Supply"
 STATIC_MODIFIER_DESC_oe_mag_african_annona: "Restored Carthaginian granaries ship African grain to Constantinople, lifting food supply and prosperity at the price of maritime subsidy costs."
 STATIC_MODIFIER_NAME_oe_mag_carthage_merchant_lease: "Tunis Imperial Quay Lease"
 STATIC_MODIFIER_DESC_oe_mag_carthage_merchant_lease: "Leasing Tunis customs quays to chartered merchants generates brisk trade revenue and burgher favor while diluting direct imperial control."
 STATIC_MODIFIER_NAME_oe_mag_limes_tripolitanus: "Limes Tripolitanus Frontier Wall"
 STATIC_MODIFIER_DESC_oe_mag_limes_tripolitanus: "Rebuilding the classical Limes Tripolitanus fortresses locks down frontier defense and control at the cost of steeper fort upkeep and Amazigh resentment."
 STATIC_MODIFIER_NAME_oe_mag_berber_foederati: "Amazigh Foederati Frontier Pact"
 STATIC_MODIFIER_DESC_oe_mag_berber_foederati: "Enrolling Amazigh confederacies as salaried frontier Foederati sharpens light cavalry and tribal calm while conceding central administrative reach."
 STATIC_MODIFIER_NAME_oe_mag_west_med_patrol: "Imperial West Mediterranean Patrol"
 STATIC_MODIFIER_DESC_oe_mag_west_med_patrol: "Permanent imperial squadrons based at Tunis, Algiers, and Tripoli enforce Western Mediterranean maritime dominance and crush piracy at steady fleet upkeep."
 STATIC_MODIFIER_NAME_oe_mag_coastal_watchtowers: "North African Coastal Watchtowers"
 STATIC_MODIFIER_DESC_oe_mag_coastal_watchtowers: "Stone watchtowers and local convoy escorts provide economical coastal security without the full reach of an offensive battlefleet."
 STATIC_MODIFIER_NAME_oe_mag_carthage_christian_revival: "Archbishopric of Carthage & Romanitas"
 STATIC_MODIFIER_DESC_oe_mag_carthage_christian_revival: "Restoring the ancient See of Carthage accelerates African Romanization and conversion while sharpening friction with non-Christian communities."
 STATIC_MODIFIER_NAME_oe_mag_african_synod_tolerance: "Tri-Communal African Synod"
 STATIC_MODIFIER_DESC_oe_mag_african_synod_tolerance: "A tri-communal Carthage synod fosters peaceful coexistence, provincial control, and gradual Romanization while displeasing rigorist clergy."
 STATIC_MODIFIER_NAME_oe_mag_carthage_admiralty_mod: "Carthage Imperial Admiralty"
 STATIC_MODIFIER_DESC_oe_mag_carthage_admiralty_mod: "A permanent imperial admiralty at Carthage commands Western Mediterranean sea lanes and suppresses piracy at sustained naval maintenance cost."
 STATIC_MODIFIER_NAME_oe_mag_strait_bastion_loc: "Strait of Gibraltar Bastion"
 STATIC_MODIFIER_DESC_oe_mag_strait_bastion_loc: "Heavy coastal bastions and galley slips guarding the narrow passage between the Atlantic and Mediterranean."
 STATIC_MODIFIER_NAME_oe_mag_corsair_haven_loc: "Barbary Corsair Haven"
 STATIC_MODIFIER_DESC_oe_mag_corsair_haven_loc: "A bustling corsair anchorage rich in shipyards and recruits, though teeming with raiders and dockside unrest."
 STATIC_MODIFIER_NAME_oe_mag_caravan_hub_loc: "Trans-Saharan Gold Caravan Hub"
 STATIC_MODIFIER_DESC_oe_mag_caravan_hub_loc: "A premier desert terminus where salt blocks, gold dust, and ivory change hands, lifting trade power and prosperity."
 STATIC_MODIFIER_NAME_oe_mag_carthage_granary_loc: "Carthage Harbor & Imperial Granaries"
 STATIC_MODIFIER_DESC_oe_mag_carthage_granary_loc: "Rebuilt on the classical cothon plan, Carthaginian quays and state granaries turn Tunis into the empire's western breadbasket."
 STATIC_MODIFIER_NAME_oe_mag_limes_citadel_loc: "Limes Tripolitanus Citadel"
 STATIC_MODIFIER_DESC_oe_mag_limes_citadel_loc: "A stone frontier fortress anchoring the Limes Tripolitanus, strengthening local defense, order, and imperial control."
 STATIC_MODIFIER_NAME_oe_mag_imperial_fleet_base_loc: "Imperial African Fleet Base"
 STATIC_MODIFIER_DESC_oe_mag_imperial_fleet_base_loc: "An imperial naval yard and squadron station whose patrols drive corsairs from surrounding waters."
 STATIC_MODIFIER_NAME_oe_mag_carthage_see_loc: "See of Carthage & Christian Quarter"
 STATIC_MODIFIER_DESC_oe_mag_carthage_see_loc: "The restored metropolitan cathedral and tri-communal schools of Carthage invigorate African Romanization and civic order."
 oe_mag_dec_gibraltar_fortress.title: "Fortify the Pillars of Hercules"
 oe_mag_dec_gibraltar_fortress.desc: "Raise heavy coastal bastions and galley slips at Ceuta or Tangier to lock the Strait of Gibraltar, at the price of sustained naval upkeep."
 oe_mag_dec_gibraltar_fortress.a: "Fund the Strait of Gibraltar coastal fortifications"
 oe_mag_dec_barbary_taifa.title: "Commission the Barbary Taifa of Rais"
 oe_mag_dec_barbary_taifa.desc: "Grant fifteen-year letters of marque to corsair captains at Algiers, Tunis, or Tripoli, boosting galleys and sailors while raising Barbary Heat and hurting diplomacy."
 oe_mag_dec_barbary_taifa.a: "Seal fifteen-year Barbary corsair letters"
 oe_mag_dec_saharan_caravan.title: "Sponsor Trans-Saharan Gold-Salt Caravan"
 oe_mag_dec_saharan_caravan.desc: "Finance an escorted desert caravan linking Timbuktu, Gao, Fez, and Tunis, lifting trade income while adding to the Saharan Gold Surge."
 oe_mag_dec_saharan_caravan.a: "Dispatch the escorted trans-Saharan caravan"
 oe_mag_dec_carthage_patrol.title: "Carthage Naval Patrol: Pacify the Western Sea"
 oe_mag_dec_carthage_patrol.desc: "Establish the Carthage Imperial Admiralty across Tunis, Algiers, and Tripoli to eradicate Barbary corsair nests and relieve imperial strain."
 oe_mag_dec_carthage_patrol.a: "Found the Carthage Admiralty and sweep the corsairs"
 oe_mag.1.t: "Tripartite Maghreb: Marinids, Hafsids, and Zayyanids"
 oe_mag.1.d: "Since the fall of the Almohads, the Maghreb has been locked in a three-way contest: the Marinids of Fez and Marrakesh, the Hafsids guarding Tunis and the central sea, and the Zayyanids of Tlemcen straddling the caravan crossroads between them.\n\nOur court must set its course for North Africa: bid for outright Maghreb hegemony, broker a commercial caravan truce, or enlist the Atlas and Saharan Berber confederacies under formal charters."
 oe_mag.1.a: "Press our claim to supreme hegemony across the Maghreb!"
 oe_mag.1.a.tt: "Costs #R 80 gold#!, Army Tradition #G +8#!, Prestige #G +10#!, #R −45#! opinion with Maghreb rivals; gain [ShowModifier('oe_mag_tripartite_hegemony')] for #Y 30 years#!."
 oe_mag.1.b: "Pause tripartite warfare and ratify a Maghreb caravan truce"
 oe_mag.1.b.tt: "Costs #R 60 gold#!, Stability #G +4#!, #G +35#! opinion with Maghreb neighbors; gain [ShowModifier('oe_mag_caravan_truce')] for #Y 30 years#!."
 oe_mag.1.c: "Grant grazing charters to organize Berber tribal levies"
 oe_mag.1.c.tt: "Costs #R 70 gold#!, Tribes gain satisfaction; gain [ShowModifier('oe_mag_berber_tribal_levies')] for #Y 30 years#! (higher manpower, lower control)."
 oe_mag.2.t: "Gate of the Pillars: Ceuta and Tangier"
 oe_mag.2.d: "Portuguese and Castilian sails prowl the Strait of Gibraltar, eyeing Ceuta and Tangier—the twin gateways of North Africa and the last maritime lifeline to Granada.\n\nWith Iberian expeditions threatening to leap across the Pillars of Hercules, we must decide whether to pour silver into coastal bastions and war galleys, or negotiate a pragmatic customs truce across the strait."
 oe_mag.2.a: "Fortify Ceuta and Tangier and mass war galleys to lock the strait"
 oe_mag.2.a.tt: "Costs #R 140 gold#! and #R −1#! Manpower, Navy Tradition #G +8#!, builds [ShowModifier('oe_mag_strait_bastion_loc')]; gain [ShowModifier('oe_mag_strait_guard_mod')] for #Y 30 years#!."
 oe_mag.2.b: "Conclude a Gibraltar customs accord with the Iberian crowns"
 oe_mag.2.b.tt: "Costs #R 80 gold#!, Prestige #R −6#!, #G +30#! opinion with Portugal/Castile/Spain; gain [ShowModifier('oe_mag_strait_customs_mod')] for #Y 30 years#!."
 oe_mag.3.t: "Rise of the Barbary Corsair Network"
 oe_mag.3.d: "Swelled by Andalusi exiles and seasoned mariners, the harbors of Algiers, Tunis, and Tripoli hum with restless energy. Captains of the Taifa of Rais stand ready to unleash fast war galleys across Western Mediterranean shipping lanes.\n\nShall we charter an autonomous corsair network, seek Ottoman patronage in exchange for Janissary artillery and imperial backing, or curb the raiders under regularized maritime customs?"
 oe_mag.3.a: "Charter an autonomous Taifa of Rais across our Barbary ports"
 oe_mag.3.a.tt: "Costs #R 120 gold#!, Navy Tradition #G +10#!, Barbary Heat rises to #Y 2#!, builds [ShowModifier('oe_mag_corsair_haven_loc')]; gain [ShowModifier('oe_mag_independent_taifa')] for #Y 35 years#!."
 oe_mag.3.b: "Pledge allegiance to the Ottoman Sultan for Janissary artillery and protection!"
 oe_mag.3.b.tt: "Costs #R 100 gold#!, Army Tradition #G +10#!, Navy Tradition #G +8#!, Barbary Heat rises to #Y 3#!, bilateral #G +60#! opinion with Ottomans; gain [ShowModifier('oe_mag_ottoman_eyalet_corsairs')] for #Y 35 years#!."
 oe_mag.3.c: "Curb privateers and enforce regular maritime customs in our harbors"
 oe_mag.3.c.tt: "Costs #R 90 gold#!, Stability #G +4#!, resets Barbary Heat to #Y 0#!; gain [ShowModifier('oe_mag_med_customs_order')] for #Y 35 years#!."
 oe_mag.4.t: "Barbary Privateer Escorts & Western Sea Raids"
 oe_mag.4.d: "Barbary squadrons from Algiers, Tunis, and Tripoli now dominate the Western Mediterranean sailing season. Prize ships and ransoms fill North African treasuries while Christian ports from Sicily to Andalusia brace for coastal descents.\n\nThe captains await orders: unleash an all-out Grand Corso to choke Western Mediterranean shipping, or monetize our sea power through paid maritime passports and regulated ransoms?"
 oe_mag.4.a: "Unleash the Grand Corso against Western Mediterranean Christian shipping!"
 oe_mag.4.a.tt: "Gain #G +160 gold#!, Navy Tradition #G +10#!, Barbary Heat maxes at #Y 3#!, inflicts [ShowModifier('oe_mag_western_raid_pressure')] & hostility on Western Christian powers; gain [ShowModifier('oe_mag_grand_corso_economy')] for #Y 30 years#!."
 oe_mag.4.b: "Institute Mediterranean safe-conduct passports and regulated ransoms"
 oe_mag.4.b.tt: "Gain #G +90 gold#!, Stability #G +3#!, lowers Barbary Heat to #Y 1#!; gain [ShowModifier('oe_mag_ransom_passports')] for #Y 30 years#!."
 oe_mag.5.t: "Golden Age of Piracy: Mediterranean Reckoning"
 oe_mag.5.d: "As heavy ships of the line sweep the seas and the global Golden Age of Piracy reaches its twilight, great-power admiralties refuse to tolerate corsair sanctuaries astride vital shipping lanes. Bombardment squadrons now stand off the North African coast.\n\nThe century-long Barbary era faces final reckoning: clear the corsair nests to restore Western Mediterranean order, reform privateers into a regular state navy, or defy the armadas from fortified harbors?"
 oe_mag.5.a: "Sweep the Barbary nests and restore Western Mediterranean maritime order!"
 oe_mag.5.a.tt: "Costs #R 200 gold#! and #R −1.5#! Manpower, Navy Tradition #G +12#!, resets Barbary Heat to #Y 0#! (relieves Imperial Strain #G −3#! if active); gain [ShowModifier('oe_mag_piracy_pacified')] for #Y 40 years#!."
 oe_mag.5.b: "Absorb corsair crews into a disciplined regular state navy"
 oe_mag.5.b.tt: "Costs #R 140 gold#!, Navy Tradition #G +10#!, resets Barbary Heat to #Y 0#!; gain [ShowModifier('oe_mag_regular_admiral_fleet')] for #Y 35 years#!."
 oe_mag.5.c: "Defy the armadas and defend our corsair bastions to the last!"
 oe_mag.5.c.tt: "Costs #R 120 gold#!, Prestige #G +12#!, keeps Barbary Heat at #Y 2#!; gain [ShowModifier('oe_mag_corsair_last_stand')] for #Y 30 years#!."
 oe_mag.6.t: "Land of Gold: Mali, Songhai, and the Saharan Caravans"
 oe_mag.6.d: "Along the Niger bend at Niani, Timbuktu, and Gao, alluvial gold dust from Bure and Bambuk is packed for the northward desert crossing. Merchants in Fez and Tunis wait eagerly with Saharan rock salt, copper, textiles, and horses.\n\nShall our court dispatch grand royal gold caravans north for vast trade receipts—raising the Saharan bullion surge—or regulate salt-for-gold exchange at Timbuktu and Gao to keep prices and prosperity steady?"
 oe_mag.6.a: "Dispatch royal gold caravans north to Fez and Tunis!"
 oe_mag.6.a.tt: "Gain #G +180 gold#!, Prestige #G +10#!, Saharan Gold Surge rises to #Y 2#! (feeds imperial inflation), builds [ShowModifier('oe_mag_caravan_hub_loc')] and warms ties with Maghreb terminals; gain [ShowModifier('oe_mag_mali_gold_caravans')] for #Y 35 years#!."
 oe_mag.6.b: "Regulate salt-for-gold exchange at Timbuktu and Gao for steady growth"
 oe_mag.6.b.tt: "Gain #G +80 gold#!, Stability #G +5#!, keeps Saharan Gold Surge modest at #Y 1#!, builds [ShowModifier('oe_mag_caravan_hub_loc')]; gain [ShowModifier('oe_mag_salt_gold_regulation')] for #Y 35 years#!."
 oe_mag.7.t: "Timbuktu to Fez: The Saharan Bullion Surge"
 oe_mag.7.d: "Caravans arriving from Timbuktu and Gao have poured a flood of West African gold dust into Fez, Marrakesh, Sijilmasa, and Tunis. Mints strike dinars around the clock and state coffers overflow, yet bread and cloth prices are climbing across the bazaars—sending inflationary ripples across the Mediterranean.\n\nWill we let the bullion surge fuel treasury and armies at peak inflation, or lock surplus gold into a Sijilmasa reserve?"
 oe_mag.7.a: "Flood the mints with Saharan gold to finance grand ambitions!"
 oe_mag.7.a.tt: "Gain #G +240 gold#!, Stability #R −3#!, pushes #bold #color_yellow Saharan Gold Surge#!#! to peak #Y 3#! (read by Imperial Entropy inflation), builds [ShowModifier('oe_mag_caravan_hub_loc')]; gain [ShowModifier('oe_mag_gold_mint_surge')] for #Y 35 years#!."
 oe_mag.7.b: "Establish the Sijilmasa gold reserve to sterilize excess bullion"
 oe_mag.7.b.tt: "Costs #R 100 gold#!, Stability #G +4#!, moderates Saharan Gold Surge to #Y 1#!, builds [ShowModifier('oe_mag_caravan_hub_loc')]; gain [ShowModifier('oe_mag_sijilmasa_reserve')] for #Y 35 years#!."
 oe_mag.8.t: "Rome Returns to the Sahara: Caravans to Timbuktu"
 oe_mag.8.d: "Not since the age of Septimius Severus have Roman standards looked south across the Saharan oases. With North Africa back under imperial rule, Carthaginian merchants and Amazigh guides petition the throne to reopen the classical Fezzan caravan track straight to Timbuktu and Gao.\n\nShall the empire charter a trans-Saharan expedition to tap Mali and Songhai gold directly, or seal the desert gates and merely tax oasis markets?"
 oe_mag.8.a: "Charter imperial caravans south to Timbuktu and reopen the classical desert road!"
 oe_mag.8.a.tt: "Costs #R 160 gold#!, Prestige #G +15#!, raises Saharan Gold Surge to at least #Y 2#!, bilateral #G +40#! opinion with Mali/Songhai, builds [ShowModifier('oe_mag_caravan_hub_loc')]; gain [ShowModifier('oe_mag_roman_sahara_caravan')] for #Y 35 years#!."
 oe_mag.8.b: "Hold the northern oasis gates and levy transit customs to contain inflation"
 oe_mag.8.b.tt: "Costs #R 80 gold#!, Stability #G +4#!, caps Saharan Gold Surge at #Y 1#!; gain [ShowModifier('oe_mag_sijilmasa_reserve')] for #Y 30 years#!."
 oe_mag.9.t: "Exarchate of Africa (I): Carthage Harbor & Granaries"
 oe_mag.9.d: "Imperial banners fly once more over the Gulf of Tunis and the ruins of Carthage. Ever since Belisarius reclaimed Africa for Justinian, the Medjerda wheatlands have promised to feed the New Rome.\n\nAs the first pillar of deep African governance, the Exarch proposes reconstructing Carthage's cothon harbor and imperial Annona granaries to relieve imperial strain—or, at lower treasury cost, leasing the Tunis quays to chartered merchant houses."
 oe_mag.9.a: "Rebuild Carthage harbor and imperial Annona granaries to feed the empire!"
 oe_mag.9.a.tt: "Advances Africa Exarchate Step #Y 1#!, costs #R 220 gold#!, Prestige #G +12#!, relieves #bold #color_yellow Imperial Strain#!#! by #G −5#! (extra #G −2#! with Africa Diocese/Exarchate), builds [ShowModifier('oe_mag_carthage_granary_loc')]; gain [ShowModifier('oe_mag_african_annona')] for #Y 40 years#!."
 oe_mag.9.b: "Lease Tunis customs quays to imperial merchant syndicates"
 oe_mag.9.b.tt: "Advances Africa Exarchate Step #Y 1#!, costs #R 100 gold#!, relieves #bold #color_yellow Imperial Strain#!#! by #G −2#!, upgrades Tunis harbor; gain [ShowModifier('oe_mag_carthage_merchant_lease')] for #Y 35 years#!."
 oe_mag.10.t: "Exarchate of Africa (II): Limes Tripolitanus & the Berbers"
 oe_mag.10.d: "With Carthage's quays restored, the interior mountains and Tripolitanian desert remain restless. Mobile Amazigh tribal horsemen know every pass and oasis—the very frontier challenge that once bled Justinian's Exarchate.\n\nFor the second stage of African governance, shall we rebuild the fortified stone line of the Limes Tripolitanus at steep garrison cost, or enroll Berber chiefs as salaried Foederati frontier auxiliaries?"
 oe_mag.10.a: "Rebuild the Limes Tripolitanus stone forts to lock down the southern frontier"
 oe_mag.10.a.tt: "Advances Africa Exarchate Step #Y 2#!, costs #R 200 gold#! and #R −1.5#! Manpower, relieves #bold #color_yellow Imperial Strain#!#! by #G −3#!, builds [ShowModifier('oe_mag_limes_citadel_loc')]; gain [ShowModifier('oe_mag_limes_tripolitanus')] for #Y 40 years#!."
 oe_mag.10.b: "Enroll Amazigh tribes as salaried imperial Foederati light cavalry"
 oe_mag.10.b.tt: "Advances Africa Exarchate Step #Y 2#!, costs #R 120 gold#!, Army Tradition #G +8#!, relieves #bold #color_yellow Imperial Strain#!#! by #G −2#!; gain [ShowModifier('oe_mag_berber_foederati')] for #Y 40 years#!."
 oe_mag.11.t: "Exarchate of Africa (III): Clearing the Corsair Nests"
 oe_mag.11.d: "Even with Carthage's granaries and the Limes taking shape, corsair coves around Algiers, Bejaia, and Tripoli still prey on imperial grain ships leaving the Gulf of Tunis.\n\nAs the third pillar of African governance, shall we launch a full naval sweep to raze the pirate nests and establish permanent imperial fleet bases, or rely on cheaper coastal watchtowers and convoy escorts?"
 oe_mag.11.a: "Launch an imperial naval sweep to purge Algiers and Tripoli for good!"
 oe_mag.11.a.tt: "Advances Africa Exarchate Step #Y 3#!, costs #R 220 gold#! and #R −2#! Manpower, Navy Tradition #G +12#!, resets Barbary Heat to #Y 0#!, relieves #bold #color_yellow Imperial Strain#!#! by #G −3#!, builds [ShowModifier('oe_mag_imperial_fleet_base_loc')]; gain [ShowModifier('oe_mag_west_med_patrol')] for #Y 40 years#!."
 oe_mag.11.b: "Erect coastal watchtowers and organize escorted grain convoys"
 oe_mag.11.b.tt: "Advances Africa Exarchate Step #Y 3#!, costs #R 110 gold#!, Navy Tradition #G +6#!, lowers Barbary Heat, upgrades naval bases; gain [ShowModifier('oe_mag_coastal_watchtowers')] for #Y 35 years#!."
 oe_mag.12.t: "Exarchate of Africa (IV): Revival of African Christendom"
 oe_mag.12.d: "With Carthage's granaries full, the Limes fortified, and corsair dens cleared, the Exarchate of Africa reaches its crowning fourth pillar. On the soil once shepherded by Cyprian and Augustine, remnants of African Latin Christianity, Greek-Roman settlers, and loyal Amazigh communities gather beneath the restored vaults of Carthage.\n\nShall we re-establish the Archbishopric of Carthage to spearhead Romanization and conversion, or convene a tri-communal synod anchoring imperial rule in broad religious tolerance?"
 oe_mag.12.a: "Restore the Archbishopric of Carthage and accelerate African Romanization!"
 oe_mag.12.a.tt: "Completes Africa Exarchate Step #Y 4#!, costs #R 200 gold#!, Stability #R −2#!, Prestige #G +15#!, relieves #bold #color_yellow Imperial Strain#!#! by #G −5#! (extra Stability #G +4#! & #G −3#! strain with Africa Diocese or Romanization), builds [ShowModifier('oe_mag_carthage_see_loc')]; gain [ShowModifier('oe_mag_carthage_christian_revival')] for #Y 45 years#!."
 oe_mag.12.b: "Convene a tri-communal Latin-Berber-Greek synod of provincial tolerance"
 oe_mag.12.b.tt: "Completes Africa Exarchate Step #Y 4#!, costs #R 140 gold#!, Stability #G +5#!, relieves #bold #color_yellow Imperial Strain#!#! by #G −3#! (extra Prestige #G +8#! & #G −2#! strain with Africa Diocese or Romanization), builds [ShowModifier('oe_mag_carthage_see_loc')]; gain [ShowModifier('oe_mag_african_synod_tolerance')] for #Y 45 years#!."
 oe_mag.20.t: "Maghreb & Exarchate of Carthage: Choice Takes Effect"
