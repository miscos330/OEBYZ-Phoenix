l_english:
 OE_CITY_REQUIRE_PALACE: "Expansion Requirement: #Y Complete the Great Palace expansion#!"
 OE_CITY_REQUIRE_1454: "Expansion Requirement: From #Y January 1, 1454#! onward"
 oe_byz_constantinople_sea_walls: "Sea Walls of Constantinople"
 oe_byz_constantinople_sea_walls_desc: "The coastal fortifications shelter the harbors and streets behind them. Repairing fallen stretches and restoring patrols will make the capital less vulnerable to threats from the sea."
 oe_city_sea_walls_maintenance: "Sea Walls of Constantinople Maintenance"
 oe_byz_constantinople_basil_academy: "Basil Military Academy"
 oe_byz_constantinople_basil_academy_desc: "An academy bearing Basil's name trains the empire's officers. Military history, terrain and marching discipline receive equal attention, ensuring that experience earned on campaign does not vanish with the passing of old generals.\n\n$OE_ACADEMY_ARMY_SCORE_100$"
 oe_city_basil_academy_maintenance: "Basil Military Academy Maintenance"
 oe_byz_constantinople_urban_academy: "Urban Artillery Academy"
 oe_byz_constantinople_urban_academy_desc: "Gunfounders and officers study barrels, charges and gunnery near the city walls. The academy named for Urban turns craftsmen's experience into a teachable art and trains officers skilled in artillery.\n\nExpansion becomes available on #Y January 1, 1454#!.\n\n$OE_ACADEMY_ARMY_SCORE_100$"
 oe_city_urban_academy_maintenance: "Urban Artillery Academy Maintenance"
 oe_byz_constantinople_constantine_column: "Column of Constantine"
 oe_byz_constantinople_constantine_column_desc: "Its weathered shaft bears witness to the long life of New Rome. Restoring its base and the surrounding square allows the monument to continue speaking of the ambitions that founded the capital.\n\nThe second level represents restoration of the base and the surrounding square."
 oe_city_constantine_column_maintenance: "Column of Constantine Maintenance"
 oe_byz_constantinople_thutmose_obelisk: "Obelisk of Thutmose III"
 oe_byz_constantinople_thutmose_obelisk_desc: "An Egyptian monument carried across the sea stands upon a Roman base. Cleaning its carvings, strengthening its pedestal and restoring the surrounding public space keep the legacy of ancient empires within the capital's daily life.\n\nThe second level represents restoration of the base and the surrounding square."
 oe_city_thutmose_obelisk_maintenance: "Obelisk of Thutmose III Maintenance"
 oe_byz_constantinople_nymphaeum: "Nymphaeum"
 oe_byz_constantinople_nymphaeum_desc: "Clear water flows through the ancient fountain court once more. Restored colonnades, statues and pools offer travelers a place to rest and bring a quiet public space to the busy ceremonial district."
 oe_city_nymphaeum_maintenance: "Nymphaeum Maintenance"
 oe_byz_constantinople_theodosian_market: "Theodosian Commercial Quarter"
 oe_byz_constantinople_theodosian_market_desc: "Shops and warehouses along the Mese gather goods from many lands. Better access, orderly streets and new premises encourage merchants and newcomers to settle here."
 oe_city_theodosian_market_maintenance: "Theodosian Commercial Quarter Maintenance"
 oe_byz_constantinople_senate_rotunda: "Senate Rotunda"
 oe_byz_constantinople_senate_rotunda_desc: "The rotunda once again houses deliberations and the examination of official papers. Senators and officials review records and debate affairs, placing an ancient tradition of government at the service of the present empire."
 oe_city_senate_rotunda_maintenance: "Senate Rotunda Maintenance"
 oe_byz_constantinople_magnaura: "Magnaura Palace"
 oe_byz_constantinople_magnaura_desc: "The restored reception halls welcome envoys from abroad. Ceremonies, negotiations and formal audiences lend the empire's promises a dignity worthy of its history.\n\nExpansion requires the #Y completed Great Palace expansion#!. Merely beginning construction is not sufficient."
 oe_city_magnaura_maintenance: "Magnaura Palace Maintenance"
 oe_byz_constantinople_daphne: "Daphne Palace"
 oe_byz_constantinople_daphne_desc: "The old imperial residence is restored. Daily court life and formal ceremonies bring vitality back to the Great Palace, making the continuity of the throne visible to its subjects.\n\nExpansion requires the #Y completed Great Palace expansion#!. Merely beginning construction is not sufficient."
 oe_city_daphne_maintenance: "Daphne Palace Maintenance"
 oe_byz_constantinople_chalke: "Chalke Palace"
 oe_byz_constantinople_chalke_desc: "The stately gatehouse welcomes imperial processions once more. Guards watch the gates and officials enter according to ceremony, displaying the order and authority of the court to the capital and the wider empire.\n\nExpansion requires the #Y completed Great Palace expansion#!. Merely beginning construction is not sufficient."
 oe_city_chalke_maintenance: "Chalke Palace Maintenance"
 oe_byz_constantinople_jewish_community: "Jewish Quarter"
 oe_byz_constantinople_jewish_community_desc: "Under common imperial jurisdiction, Jewish residents receive secure homes and places of business. Families, workshops and community life gradually recover, bringing new skills and connections to the Golden Horn.\n\nExpansion requires the imperial reform #Y Expel Foreign Powers#!."
 oe_city_jewish_community_maintenance: "Jewish Quarter Maintenance"
