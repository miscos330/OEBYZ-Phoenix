l_english:
 oe_hungarian_romanization: "Romanize Hungary"
 oe_hungarian_romanization_desc: "After the Paeones identity movement has begun, spend 50 Political Influence to change a Hungarian dominion that has been a Roman subject for over ten years to Orthodox religion and Paeones primary culture."
 oe_hungarian_romanization_movement_tt: "The Paeones identity movement has been started"
 oe_roman_march: "Roman March"
 oe_roman_march_desc: "An autonomous frontier dominion whose lords maintain the fortresses and defend the Roman borders."
 OE_MOLDAVIAN_MARCH: "Moldavian March"
 OE_MOLDAVIAN_MARCH_ADJ: "Moldavian"
 oe_found_moldavian_march.title: "Establish the Moldavian March"
 oe_found_moldavian_march.desc: "Entrust the towns and fortresses between the Carpathians and the Dniester to a loyal frontier lord. Release all of Moldavia as an Orthodox, Dacian Roman March under Byzantium."
 oe_found_moldavian_march.a: "Let the frontier beacons stand watch for Rome."
 oe_moldavian_march_territory_tt: "Byzantium directly owns every conquerable location in Moldavia"
 oe_moldavian_march_founded: "Established the Moldavian March"
 OE_RW_ASSIM_GRIKO_TITLE: "Start the Griko Identity Movement"
 OE_RW_ASSIM_GRIKO_ROW: "Griko Culture"
 OE_RW_ASSIM_GRIKO_FLAVOR: "Greek hymns still echo in the churches of Sicily, and its ports have never forgotten Constantinople. As schools and courts adopt a common language, the island’s people renew their Roman inheritance through the traditions of their homeland."
 OE_RW_ASSIM_GRIKO_CONDITION: "Byzantium and all levels of its subjects own at least 80% of conquerable locations in Abruzzo, Apulia, Basilicata, Campania and Sicily combined. Occupation alone does not count."
 OE_RW_ASSIM_GRIKO_NOT_STARTED: "Not successfully started; an older save with no established movement may start it once more."
 OE_RW_ASSIM_GRIKO_SOURCES: "Source culture: [ShowCultureName('sicilian')]."
 OE_RW_ASSIM_GRIKO_TARGET: "Gradually converts the source cultures to [ShowCultureName('griko_culture')]. Spreads only in Byzantine or subject-owned locations with source-culture population.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_GRIKO_WAITING: "Not yet started"
 OE_RW_ASSIM_GRIKO_STARTED: "Started: Griko"
 OE_RW_ASSIM_GRIKO_VALID_ORIGIN: "At least one location in Abruzzo, Apulia, Basilicata, Campania and Sicily is owned by Byzantium or its subjects and contains source-culture population"
 OE_RW_ASSIM_GRIKO_PROGRESS: "Owned: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_griko_owned')|0] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_griko_total')|0]; required: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_assim_griko_required')|0]."
