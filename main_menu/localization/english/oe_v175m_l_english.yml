 oe_v175m_dec_ulus_stipend: "Send Sarai Steppe Stipend and Winter Forage"
 oe_v175m_dec_ulus_stipend.title: "Send Sarai Steppe Stipend and Winter Forage"
 oe_v175m_dec_ulus_stipend.desc: "Dispatch silver, winter grain, and remounts from Sarai to sustain the garrisons of our Ulus wings across the harsh steppe winter. Transfers treasury relief to all active Jochid Ulus wings (with extra support for low-treasury wings), lowers their Liberty Desire, raises Ulus Cohesion, and grants #Y Sarai Winter Forage Stipend#! for 5 years."
 oe_v175m_dec_ulus_stipend_desc: "Send 150 gold in winter forage and garrison stipends from Sarai to active Jochid Ulus wings, boosting loyalty and Ulus Cohesion once every 5 years."
 oe_v175m_dec_ulus_stipend.a: "Dispatch grain caravans and silver to the wings"
 STATIC_MODIFIER_NAME_oe_v175m_ulus_garrison_mod: "Steppe Ulus Winter Garrison"
 STATIC_MODIFIER_DESC_oe_v175m_ulus_garrison_mod: "Organized steppe forage depots, pasture herds, and Sarai supply relays sustain this Ulus wing's horsemen through severe winters without disbanding."
 STATIC_MODIFIER_NAME_oe_v175m_sarai_stipend_mod: "Sarai Winter Forage Stipend"
 STATIC_MODIFIER_DESC_oe_v175m_sarai_stipend_mod: "Direct silver stipends and grain caravans from Sarai ease army upkeep, shield riders from winter attrition, and bind this wing firmly to the Khan."
