 oe_war2_pt_open_treaty_ports_tt:0 "Establishes a #Y Treaty Port Concession#! diplomatic relation with the defeated coastal realm whenever diplomatic conditions permit."
 oe_war2_pt_installment_reparations_tt:0 "Transfers an immediate bullion tranche (#Y 30–350#! gold, scaled to the defeated realm's economic base) before beginning 15-year installment reparations."
 oe_war2_pt_raze_border_forts_tt:0 "Physically demolishes defensive fortification buildings in up to #Y 2#! of the defeated realm's most populous fortified locations."
 oe_war2_pt_seize_royal_manuscripts_tt:0 "Physically transfers the defeated realm's highest-quality non-priceless masterpiece to the victor's capital and grants the aggrieved loser grounds for a #Y Recover Plundered Heritage#! claim."
 oe_war2_pt_impose_court_language_tt:0 "Immediately changes the defeated court's sovereign #Y Court Language#! to match the victor's dialect."
 oe_war2_pt_break_coalition_oath_tt:0 "Immediately severs the defeated realm's alliances with Great Powers and rivals of the victor."
 oe_war2_pt_release_tributary_buffer_tt:0 "Establishes a #Y 10-year#! mutual truce and designates the victor as guarantor of the frontier neutral buffer charter for #Y 20 years#!."
 OE_WAR2_CB_OPEN_PORTS_REASON:0 "Embargoed by Rival Coastal Power"
 OE_WAR2_CB_HERITAGE_REASON:0 "Reclaim Plundered National Masterpieces"
 OE_WAR2_CB_BUFFER_REASON:0 "Defend Guaranteed Neutral Buffer"
 OE_WAR2_CB_BALANCE_REASON:0 "Check Overbearing Continental Hegemon"
 OE_WAR2_ADVISORY_FAVORS_BASE:0 "Military Advisory Mission Favors"
 oe_war2_act_dispatch_instructors:0 "Dispatch Military Instructors"
 oe_war2_act_dispatch_instructors_desc:0 "Spend #R 50#! gold to second veteran staff instructors to an allied, friendly, or subject realm for ten years, elevating their discipline and morale while earning favors, army tradition, and goodwill. Ten-year cooldown."
