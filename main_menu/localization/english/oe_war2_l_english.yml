 oe_war2_op_military_instructors:0 "Dispatched Military Instructors"
 oe_war2_op_fort_restraint_accepted:0 "Honored Border Fort Restraint"
 oe_war2_op_fort_restraint_refused:0 "Pressured Over Border Fortresses"
 oe_war2_op_port_lease_accord:0 "Concluded Treaty Port Lease"
 oe_war2_op_cultural_exhibition:0 "Sponsored Joint Cultural Exhibition"
 oe_war2_op_treaty_resentment:0 "Harsh Strategic Treaty Clauses"
 oe_war2.1.title:0 "The Pike-and-Shot Tercio Square"
 oe_war2.1.desc:0 "Seasoned marshals who studied the great European battlefields have drafted a unified pike-and-shot manual. Dense phalanxes of long ash pikes shield arquebusier sleeves from cavalry shock while mobile batteries pound opposing infantry blocks."
 oe_war2.1.a:0 "Fortify the Heavy Pike Bastion"
 oe_war2.1.b:0 "Expand Musketeer Sleeves and Field Batteries"
 oe_war2.2.title:0 "The Mandarin Duck (Yuanyang) Array"
 oe_war2.2.desc:0 "Veteran commanders defending rugged coasts and fractured hills propose reorganizing infantry into twelve-man Mandarin Duck squads. Rattan shields, bamboo wolf-brushes, long spears, and tridents cover one another so no lone warrior ever faces an enemy blade unaided."
 oe_war2.2.a:0 "Standardize Interlocking Infantry Squads"
 oe_war2.2.b:0 "Drill Coastal Anti-Raider Garrisons"
 oe_war2.3.title:0 "Weisuo Wagon-Camp & Military Colonies"
 oe_war2.3.desc:0 "Quartermasters on the northern steppes report that iron-rimmed battle wagons chained into a circular laager turn flat plains into instant timber fortresses. Backed by hereditary military colony farms, entire armies can campaign for months without starving the imperial treasury."
 oe_war2.3.a:0 "Standardize Fortified Wagon Laagers"
 oe_war2.3.b:0 "Expand Self-Sustaining Military Colony Farms"
 oe_war2.4.title:0 "Steppe Mangudai & Timariot Cavalry Exercises"
 oe_war2.4.desc:0 "Across sunlit grasslands and Anatolian plains, horse-archer banners and armored provincial sipahis stage grand autumn maneuvers. Feigned retreats lure mock vanguard columns into deadly crescent jaws while heavy lancers thunder across the flanks."
 oe_war2.4.a:0 "Perfect Feigned-Retreat Crescent Maneuvers"
 oe_war2.4.b:0 "Audit Provincial Timariot Cavalry Fiefs"
 oe_war2.5.title:0 "Byzantine Stratiotai Phalanx & Colony Rosters"
 oe_war2.5.desc:0 "Strategoi poring over classical manuals urge the crown to revitalize thematic soldier-farmer registers. Bound by hereditary land allotments, the Stratiotai field stubborn heavy-infantry phalanxes while keeping frontier districts orderly and loyal."
 oe_war2.5.a:0 "Revive Thematic Stratiotai Phalanx Drills"
 oe_war2.5.b:0 "Codify the Imperial Military Colony Roster"
 oe_war2.6.title:0 "Line-Infantry Volley Rank & Mass Conscription"
 oe_war2.6.desc:0 "The clash of modern empires has outgrown small dynastic armies. General staff officers stand divided between perfecting lethal flintlock platoon volleys backed by massed artillery, or constructing nationwide conscription depots capable of marching entire corps across continents."
 oe_war2.6.a:0 "Drill Precision Line-Infantry Volley Ranks"
 oe_war2.6.b:0 "Mobilize Continental Mass Conscription Cadres"
 oe_war2.7.title:0 "Grand Treaty-Port & Silk Corridor Charter"
 oe_war2.7.desc:0 "Salute cannons boom across sunlit piers as diplomats exchange ribboned commercial charters. Stone custom houses, bonded silk warehouses, and overland trunk depots promise to funnel transcontinental wealth straight through our markets."
 oe_war2.7.a:0 "Charter Maritime Custom Houses and Enclaves"
 oe_war2.7.b:0 "Invest in Overland Silk and Rail Depots"
 oe_war2.8.title:0 "Congress of Indemnities & Broken Coalitions"
 oe_war2.8.desc:0 "Around velvet-draped treaty tables, envoys tally war indemnities and ratify clauses dissolving hostile alliance blocs. How the crown channels this diplomatic victory will define our fiscal credibility and concert leadership for a generation."
 oe_war2.8.a:0 "Establish a Dedicated War Indemnity Sinking Fund"
 oe_war2.8.b:0 "Institutionalize the Grand Peace Congress Chancery"
 oe_war2.9.title:0 "Frontier Fortresses Dismantled"
 oe_war2.9.desc:0 "Sappers and diplomatic commissioners inspect ruined stone bastions along the contested frontier. With treaty markers fixing new demilitarized zones, the war council debates training offensive siege corps or consolidating our own interior defense belt."
 oe_war2.9.a:0 "Codify Siege Demolition and Sapper Doctrine"
 oe_war2.9.b:0 "Consolidate Our Demarcated Border Watch"
 oe_war2.10.title:0 "Royal Archives, Masterworks & Sovereign Tongue"
 oe_war2.10.desc:0 "Crates of illuminated manuscripts, celestial atlases, and treaty seals arrive at the capital while foreign courts begin drafting dispatches in our sovereign court language. Scholars and envoys clamor to turn this triumph into lasting intellectual primacy."
 oe_war2.10.a:0 "Endow the Imperial Manuscript and Map Repository"
 oe_war2.10.b:0 "Expand the Diplomatic Lingua Franca Chancery"
 oe_war2.11.title:0 "Maritime Tonnage Convention & Raider Patrols"
 oe_war2.11.desc:0 "Naval attaches conclude a sweeping tonnage convention governing warship slipways across contested seas. The Admiralty weighs investing in a disciplined heavy battleline under treaty ratios against deploying swift commerce-raiding cruiser squadrons."
 oe_war2.11.a:0 "Standardize the Heavy Treaty Battleline"
 oe_war2.11.b:0 "Commission Fast Commerce-Raider Squadrons"
 oe_war2.12.title:0 "Sacred Pilgrim Passage & Neutral Buffer Guarantee"
 oe_war2.12.desc:0 "Pilgrim caravans bearing wax-sealed safe-conducts cross newly neutralized frontier passes beneath international banners. Whether framed as a sacred hospice mandate or a secular concert of neutral buffers, the peace promises enduring calm."
 oe_war2.12.a:0 "Charter Protected Pilgrim Hospices and Escorts"
 oe_war2.12.b:0 "Uphold the Concert of Neutral Buffer States"
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_ports_winner:0 "Forced Open Treaty Ports"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_ports_winner:0 "Chartered commercial concessions and reduced harbor dues channel maritime trade directly into our merchant fleets."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_ports_loser:0 "Treaty Port Customs Imposed"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_ports_loser:0 "Foreign merchant houses operate under treaty privilege along our coast, eroding trade barriers while bringing new techniques ashore."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_reparations_winner:0 "Installment War Indemnities Received"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_reparations_winner:0 "Scheduled treaty installments fortify the royal treasury, fund post-war reconstruction, and elevate imperial prestige."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_reparations_loser:0 "Installment War Indemnity Burden"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_reparations_loser:0 "Annual indemnity remittances drain domestic tax receipts and strain public fiscal confidence."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_forts_winner:0 "Frontier Bastions Breached & Demolished"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_forts_winner:0 "With rival frontier citadels leveled by treaty decree, our engineers and field armies enjoy unmatched offensive leverage."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_forts_loser:0 "Dismantled Frontier Fortresses"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_forts_loser:0 "Treaty clauses prohibiting rapid border refortification leave frontier marches exposed and garrison maintenance strained."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_manuscripts_winner:0 "Seized Royal Archives & Masterworks"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_manuscripts_winner:0 "Transferred codices, astronomical charts, and royal masterworks enrich our capital libraries and court scholarship."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_manuscripts_loser:0 "Plundered Royal Archives"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_manuscripts_loser:0 "The forced removal of treasured codices and masterworks scars national pride and fuels determination to reclaim lost heritage."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_language_winner:0 "Sovereign Court Language Ascendancy"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_language_winner:0 "Compelling a vanquished court to conduct statecraft in our tongue broadcasts unmatched cultural hegemony across foreign chancelleries."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_language_loser:0 "Imposed Foreign Court Language"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_language_loser:0 "Adopting the victor's chancery tongue humbles domestic prestige yet opens direct scholarly conduits to foreign institutions."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_navy_cap_winner:0 "Naval Tonnage Supremacy"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_navy_cap_winner:0 "Restricting a defeated rival's fleet construction secures command of contested waters and boosts naval prestige."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_navy_cap_loser:0 "Naval Tonnage Limitation Imposed"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_navy_cap_loser:0 "Strict treaty quotas cap capital-ship slipways, curb naval mobilization, and burden remaining squadrons."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_coalition_winner:0 "Broken Hostile Coalition Pledge"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_coalition_winner:0 "Forcing a rival to repudiate hostile alliances shatters encirclement schemes and magnifies our diplomatic stature."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_coalition_loser:0 "Coalition Oaths Dissolved"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_coalition_loser:0 "Mandatory treaty renunciation of foreign alliances isolates the chancellery and limits diplomatic maneuvering."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_pilgrim_winner:0 "Protector of Sacred Pilgrim Routes"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_pilgrim_winner:0 "Treaty guarantees securing safe passage for pilgrims exalt our spiritual authority and international goodwill."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_pilgrim_loser:0 "Chartered Sacred Pilgrim Passage"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_pilgrim_loser:0 "Treaty immunities protect foreign pilgrims crossing our territory, curbing religious coercion while promoting broader toleration."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_silk_corridor_winner:0 "Duty-Free Silk & Rail Corridor"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_silk_corridor_winner:0 "Toll-free overland transit charters link continental depots and speed imperial communications across Eurasia."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_silk_corridor_loser:0 "Transit Corridor Duty Exemption"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_silk_corridor_loser:0 "Waiving overland transit tolls trims domestic customs margins yet spurs road upgrades and bustling station markets."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_buffer_winner:0 "Guarantor of the Neutral Buffer"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_buffer_winner:0 "Charting a neutralized frontier buffer relieves garrison pressure and showcases principled statesmanship."
 STATIC_MODIFIER_NAME_oe_war2_mod_pt_buffer_loser:0 "Neutral Buffer Charter Restraint"
 STATIC_MODIFIER_DESC_oe_war2_mod_pt_buffer_loser:0 "Recognizing a neutralized frontier charter restrains aggressive expansion while granting breathing space for internal recovery."
 STATIC_MODIFIER_NAME_oe_war2_mod_rel_port_host:0 "Treaty Port Concession Host"
 STATIC_MODIFIER_DESC_oe_war2_mod_rel_port_host:0 "Hosting a chartered foreign commercial enclave channels global merchandise and institutional learning into our coastal provinces."
 STATIC_MODIFIER_NAME_oe_war2_mod_rel_port_holder:0 "Treaty Port Concession Holder"
 STATIC_MODIFIER_DESC_oe_war2_mod_rel_port_holder:0 "Privileged consular wharves and coaling anchorages extend our maritime reach and commercial dominance."
 STATIC_MODIFIER_NAME_oe_war2_mod_rel_advisor_sender:0 "Foreign Military Advisory Mission"
 STATIC_MODIFIER_DESC_oe_war2_mod_rel_advisor_sender:0 "Seconding veteran staff officers abroad refines our own doctrine through live theater observation and strengthens diplomatic ties."
 STATIC_MODIFIER_NAME_oe_war2_mod_rel_advisor_host:0 "Hosted Military Advisory Mission"
 STATIC_MODIFIER_DESC_oe_war2_mod_rel_advisor_host:0 "Foreign drillmasters modernize our regimental manuals, sharpen battlefield discipline, and reduce veteran experience decay."
 STATIC_MODIFIER_NAME_oe_war2_mod_rel_grain_rail:0 "Mutual Grain & Rail Transit Pact"
 STATIC_MODIFIER_DESC_oe_war2_mod_rel_grain_rail:0 "Linked granary reserves and shared trunk corridors buffer harvests against famine and speed overland trade."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_mission_prestige:0 "Officer Cadre Seconded Abroad"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_mission_prestige:0 "Dispatched tactical instructors spread our military reputation across foreign courts while enriching staff experience."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_instructed_army:0 "Foreign Tactical Instructor Cadre"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_instructed_army:0 "Visiting military instructors overhaul volley drills and field formations across our active regiments."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_fort_restraint_actor:0 "Frontier Restraint Verified"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_fort_restraint_actor:0 "Diplomatic inspection of neighboring border garrisons gives our generals clear intelligence and frontier confidence."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_fort_restraint_target:0 "Border Fortification Restraint"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_fort_restraint_target:0 "Agreeing to freeze frontier fortress expansion weakens border readiness yet eases domestic political tension."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_port_lessee:0 "Leased Treaty Port Warehouses"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_port_lessee:0 "Long-term warehouse leases in a friendly harbor expand our maritime export reach and customs leverage."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_port_lessor:0 "Treaty Port Lease Revenue"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_port_lessor:0 "Negotiated harbor rents replenish the treasury and draw foreign engineering and institutional currents into port cities."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_cultural_host:0 "Grand Diplomatic Exhibition Patron"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_cultural_host:0 "Sponsoring an international showcase of crafts, manuscripts, and statecraft enhances our court's cultural magnetism."
 STATIC_MODIFIER_NAME_oe_war2_mod_act_cultural_guest:0 "International Exhibition Exchange"
 STATIC_MODIFIER_DESC_oe_war2_mod_act_cultural_guest:0 "Participating scholars and artisans return home with technical treatises, artistic methods, and fresh institutional ideas."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_tercio_square:0 "Tercio Pike Square Bastion"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_tercio_square:0 "Deep ranks of disciplined pikemen anchor the battlefield against cavalry shock and hold contested ground."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_tercio_shot:0 "Tercio Arquebus Sleeves & Battery"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_tercio_shot:0 "Expanded musketeer sleeves and coordinated field guns rain rolling volleys before the pikes even lock."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_yuanyang_squad:0 "Mandarin Duck Interlocking Squads"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_yuanyang_squad:0 "Shieldbearers, wolf-brush bearers, and long spears interlock in mutually supporting squads that recover swiftly from shock."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_yuanyang_coastal:0 "Coastal Anti-Raider Militia Array"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_yuanyang_coastal:0 "Drilling coastal levies in Mandarin Duck tactics turns local garrisons into formidable shields against maritime raiders."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_weisuo_laager:0 "Weisuo Fortified Wagon Laager"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_weisuo_laager:0 "Chained iron-rimmed battle wagons form instant mobile redoubts across open plains, cutting campaign attrition and upkeep."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_weisuo_colony:0 "Hereditary Military Colony Farms"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_weisuo_colony:0 "Self-sustaining military colony farms replenish manpower pools and stock frontier granaries without draining civil taxes."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_mangudai_crescent:0 "Steppe Mangudai Envelopment"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_mangudai_crescent:0 "Disciplined feigned retreats and swift horse-archer horns trap overextended foes in devastating encirclements."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_timariot_muster:0 "Timariot Sipahi Provincial Muster"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_timariot_muster:0 "Well-audited provincial cavalry fiefs deliver armored lancers swiftly to the imperial banner each campaign season."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_stratiotai_phalanx:0 "Thematic Stratiotai Phalanx Drill"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_stratiotai_phalanx:0 "Reviving classic Roman tactical manuals hardens thematic infantry into an unyielding shield wall."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_colony_roster:0 "Imperial Military Colony Roster"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_colony_roster:0 "Codified hereditary colony registers anchor provincial administration while preserving veteran military expertise."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_line_volley:0 "Line-Infantry Platoon Volley Doctrine"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_line_volley:0 "Precision flintlock platoon firing synchronized with mobile horse artillery dominates open-field pitched battles."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_mass_cadre:0 "Continental Mass Conscription Cadre"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_mass_cadre:0 "Nationwide conscription depots and forced-march corps logistics throw vast, rapidly trained armies onto decisive fronts."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_harbor_customs:0 "Treaty-Port Custom House Authority"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_harbor_customs:0 "Standardized harbor manifests, bonded stone warehouses, and treaty tariffs transform coastal entrepots into fiscal engines."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_silk_rail_hub:0 "Eurasian Silk & Rail Freight Exchange"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_silk_rail_hub:0 "Interlocking overland customs stations and fast trunk highways unlock interior continental commerce."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_indemnity_treasury:0 "War Indemnity Sinking Fund"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_indemnity_treasury:0 "Channeling treaty reparations into a dedicated sinking fund stabilizes public credit and strengthens fiscal administration."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_congress_diplomacy:0 "Grand Peace Congress Chancery"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_congress_diplomacy:0 "Codified multilateral treaty protocols elevate our envoys and expand our network of diplomatic guarantees."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_frontier_dismantled:0 "Siege Demolition & Sapper Doctrine"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_frontier_dismantled:0 "Lessons from dismantling great border citadels sharpen our siegecraft and breach-assault regiments."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_frontier_garrison:0 "Demarcated Border Watch Network"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_frontier_garrison:0 "Clear treaty boundary stones allow our own garrisons to concentrate on key passes with lean upkeep."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_imperial_archive:0 "Imperial Manuscript & Map Repository"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_imperial_archive:0 "Cataloguing acquired manuscripts and royal maps accelerates scientific inquiry and elevates literary culture."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_court_chancery:0 "Diplomatic Lingua Franca Chancery"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_court_chancery:0 "Training interpreters and chancery scribes in our sovereign court tongue multiplies soft power across foreign capitals."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_tonnage_accord:0 "Maritime Tonnage Ratio Standard"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_tonnage_accord:0 "Disciplined capital-ship ratios trim excess shipyard overhead while sharpening line-of-battle readiness."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_raider_cruisers:0 "Fast Cruiser & Raider Squadron Doctrine"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_raider_cruisers:0 "Sleek commerce raiders and fast frigates dominate blockade patrols and choke hostile sea lanes."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_pilgrim_guard:0 "Chartered Sacred Hospice & Escort Order"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_pilgrim_guard:0 "Fortified pilgrim hospices and multi-faith safe-conducts turn sacred roads into pillars of spiritual harmony."
 STATIC_MODIFIER_NAME_oe_war2_mod_ev_buffer_compact:0 "Guaranteed Neutral Buffer Concert"
 STATIC_MODIFIER_DESC_oe_war2_mod_ev_buffer_compact:0 "Upholding neutral buffer charters eases border friction, quiets war weariness, and reinforces continental stability."
 OE_WAR2_AI_MARITIME_INTEREST:0 "Maritime & Commercial Stake"
