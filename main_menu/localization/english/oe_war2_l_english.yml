 oe_war2_u_stratiotai_phalanx:0 "Byzantine Stratiotai Phalanx Levy"
 oe_war2_u_stratiotai_phalanx_desc:0 "Hereditary thematic soldier-farmers trained in interlocking Roman pike phalanxes, stubborn on the defensive."
 oe_war2_levy_byz_stratiotai_phalanx:0 "Byzantine Stratiotai Phalanx Levy"
 oe_war2_u_ming_weisuo_wagon:0 "Ming Weisuo Wagon-Camp Levy"
 oe_war2_u_ming_weisuo_wagon_desc:0 "Military-colony garrison troops deploying chained wooden war wagons, polearms, and matchlocks to blunt cavalry shock."
 oe_war2_levy_ming_weisuo_wagon:0 "Ming Weisuo Wagon-Camp Levy"
 oe_war2_u_steppe_mangudai:0 "Steppe Mangudai Banner Levy"
 oe_war2_u_steppe_mangudai_desc:0 "Veteran horse-archer banners raised from steppe tribes and banner nobles, unmatched in feigned retreats and wing envelopment."
 oe_war2_levy_steppe_mangudai:0 "Steppe Mangudai Banner Levy"
 oe_war2_u_ottoman_timariot:0 "Ottoman Timariot Sipahi Levy"
 oe_war2_u_ottoman_timariot_desc:0 "Armored provincial cavalry answering the Sultan's call from hereditary Timar land grants, fierce in shock charges."
 oe_war2_levy_ottoman_timariot:0 "Ottoman Timariot Sipahi Levy"
 oe_war2_rec_imperial_colony_roster:0 "Imperial Military Colony Roster"
 oe_war2_rec_imperial_colony_roster_desc:0 "Draws recruits from hereditary frontier military colonies: slower to assemble, but regiments enter the field with 25 starting experience."
 oe_war2_rec_continental_mass_cadre:0 "Continental Mass Conscription Cadre"
 oe_war2_rec_continental_mass_cadre_desc:0 "Rapidly expands regular cadres through nationwide conscription depots: cuts recruitment time by 40%, fielding regiments initially at 75% strength."
 oe_war2_form_spanish_tercio:0 "Spanish Tercio Pike-and-Shot Square"
 oe_war2_form_spanish_tercio_desc:0 "Dense heavy-infantry pike blocks anchor the center and wings while arquebusier sleeves and field guns deliver continuous fire."
 oe_war2_form_mandarin_duck_array:0 "Ming Mandarin Duck (Yuanyang) Array"
 oe_war2_form_mandarin_duck_array_desc:0 "Interlocking heavy and light infantry squads cover every flank in mutual defense, supported by light center ordnance."
 oe_war2_form_steppe_feigned_crescent:0 "Steppe Feigned-Retreat Crescent"
 oe_war2_form_steppe_feigned_crescent_desc:0 "A nimble central screen lures hostile ranks forward while overwhelming light and heavy cavalry horns sweep both flanks."
 oe_war2_form_line_infantry_volley:0 "Line-Infantry Volley Rank"
 oe_war2_form_line_infantry_volley_desc:0 "Extended firing lines maximize musket frontage across every wing while massed center artillery shatters opposing formations."
 oe_war2_ua_fortify_wagon_laager:0 "Fortify Wagon Laager"
 oe_war2_ua_fortify_wagon_laager_desc:0 "Circles the army's supply and battle wagons into a stationary timber redoubt, stiffening discipline, morale recovery, and supply preservation while immobilized."
 oe_war2_ua_volley_fire_drill:0 "Volley Fire Drill"
 oe_war2_ua_volley_fire_drill_desc:0 "Drills infantry ranks for synchronized platoon volleys, boosting light and heavy infantry firepower and discipline at higher powder upkeep and slower march speed."
 oe_war2_ua_commerce_raider_sweep:0 "Commerce Raider Sweep"
 oe_war2_ua_commerce_raider_sweep_desc:0 "Disperses fast frigates and light squadrons to harry enemy shipping lanes, boosting light-ship power, fleet speed, and blockade reach at higher wear and upkeep."
 oe_war2_ua_imperial_forced_march:0 "Imperial Forced March"
 oe_war2_ua_imperial_forced_march_desc:0 "Drives field corps along forced double-stage marches for rapid theater redeployment, sharply accelerating speed and initiative at steep attrition and morale recovery cost."
 oe_war2_pt_open_treaty_ports:0 "Force Open Treaty Ports"
 oe_war2_pt_open_treaty_ports_desc:0 "Compels the defeated coastal power to open privileged treaty ports and consular merchant houses for 20 years, establishing a Treaty Port Concession where eligible."
 oe_war2_pt_open_treaty_ports_entry:0 "Force open treaty ports and merchant concessions for 20 years"
 oe_war2_pt_open_treaty_ports_entry_short:0 "Open Treaty Ports"
 oe_war2_pt_installment_reparations:0 "Installment War Indemnities"
 oe_war2_pt_installment_reparations_desc:0 "Secures an immediate bounded bullion tranche plus a 15-year installment indemnity schedule fortifying the victor's exchequer at the defeated realm's fiscal expense."
 oe_war2_pt_installment_reparations_entry:0 "Collect immediate bullion and 15-year installment war indemnities"
 oe_war2_pt_installment_reparations_entry_short:0 "Installment Indemnities"
 oe_war2_pt_raze_border_forts:0 "Dismantle Frontier Fortresses"
 oe_war2_pt_raze_border_forts_desc:0 "Orders the physical demolition of defensive fortifications in up to two fortified sites and restricts refortification across the defeated frontier for 15 years."
 oe_war2_pt_raze_border_forts_entry:0 "Physically demolish up to 2 fortresses and curb frontier refortification for 15 years"
 oe_war2_pt_raze_border_forts_entry_short:0 "Dismantle Fortresses"
 oe_war2_pt_seize_royal_manuscripts:0 "Seize Royal Archives & Masterworks"
 oe_war2_pt_seize_royal_manuscripts_desc:0 "Physically transfers the defeated realm's highest-quality movable masterpiece to the victor's capital and boosts research and literacy for 15 years, though the aggrieved foe gains grounds to reclaim its heritage."
 oe_war2_pt_seize_royal_manuscripts_entry:0 "Seize 1 top royal masterpiece to our capital and gain 15-year archival scholarship"
 oe_war2_pt_seize_royal_manuscripts_entry_short:0 "Seize Royal Archives"
 oe_war2_pt_impose_court_language:0 "Impose Sovereign Court Language"
 oe_war2_pt_impose_court_language_desc:0 "Compels the defeated court to adopt the victor's sovereign court dialect for diplomatic and chancery affairs, exalting the victor's cultural influence for 20 years."
 oe_war2_pt_impose_court_language_entry:0 "Impose our sovereign court language on the defeated court for 20 years"
 oe_war2_pt_impose_court_language_entry_short:0 "Impose Court Language"
 oe_war2_pt_demilitarize_navy:0 "Naval Tonnage Limitation"
 oe_war2_pt_demilitarize_navy_desc:0 "Caps the defeated power's naval shipyards, sailor reserves, and fleet upkeep for 20 years while affirming the victor's heavy-ship supremacy at sea."
 oe_war2_pt_demilitarize_navy_entry:0 "Impose a 20-year naval tonnage limitation curbing the defeated fleet"
 oe_war2_pt_demilitarize_navy_entry_short:0 "Naval Tonnage Limit"
 oe_war2_pt_break_coalition_oath:0 "Dissolve Hostile Coalition Pledge"
 oe_war2_pt_break_coalition_oath_desc:0 "Severs the defeated country's alliances with rival courts and Great Powers while imposing 15 years of diplomatic isolation and boosting the victor's congress prestige."
 oe_war2_pt_break_coalition_oath_entry:0 "Sever hostile rival alliances and impose 15 years of coalition restraint"
 oe_war2_pt_break_coalition_oath_entry_short:0 "Break Coalition Oath"
 oe_war2_pt_guarantee_pilgrim_passage:0 "Guarantee Sacred Pilgrim Passage"
 oe_war2_pt_guarantee_pilgrim_passage_desc:0 "Obliges the defeated state to protect sacred pilgrimage routes and grant religious toleration for 20 years, elevating the victor's religious influence and standing."
 oe_war2_pt_guarantee_pilgrim_passage_entry:0 "Guarantee sacred pilgrim safe-conduct and toleration for 20 years"
 oe_war2_pt_guarantee_pilgrim_passage_entry_short:0 "Pilgrim Passage"
 oe_war2_pt_silk_corridor_toll_free:0 "Duty-Free Silk & Rail Corridor"
 oe_war2_pt_silk_corridor_toll_free_desc:0 "Exempts the victor's overland caravans and rail freight from transit tolls across the defeated realm for 20 years, expanding continental trade and trunk road integration."
 oe_war2_pt_silk_corridor_toll_free_entry:0 "Establish a 20-year duty-free overland silk and rail transit corridor"
 oe_war2_pt_silk_corridor_toll_free_entry_short:0 "Duty-Free Corridor"
 oe_war2_pt_release_tributary_buffer:0 "Establish Neutral Buffer Charter"
 oe_war2_pt_release_tributary_buffer_desc:0 "Establishes a guaranteed neutral frontier buffer backed by a 10-year mutual truce, tempering aggressive expansion while strengthening defensive stability on both sides."
 oe_war2_pt_release_tributary_buffer_entry:0 "Establish a neutral buffer charter with a 10-year mutual truce and 20-year guarantees"
 oe_war2_pt_release_tributary_buffer_entry_short:0 "Neutral Buffer Charter"
 oe_war2_cb_open_ports_war:0 "Open Ports Commercial War"
 oe_war2_cb_open_ports_war_PROV:0 "Maritime campaign to compel open treaty ports and tariff concessions"
 oe_war2_cb_open_ports_war_desc:0 "A coastal power bars our merchants from its thriving harbors. Our fleets shall compel open treaty ports and fair maritime tariff charters."
 oe_war2_cb_recover_heritage:0 "Recover Plundered Heritage"
 oe_war2_cb_recover_heritage_PROV:0 "Expedition to reclaim plundered royal archives and cultural masterpieces"
 oe_war2_cb_recover_heritage_desc:0 "Treasured manuscripts or masterworks crafted in our realm lie captive in foreign palaces. We march to reclaim our stolen cultural patrimony."
 oe_war2_cb_defend_buffer:0 "Defend Neutral Buffer"
 oe_war2_cb_defend_buffer_PROV:0 "Intervention to uphold neutral frontier buffer charters"
 oe_war2_cb_defend_buffer_desc:0 "A belligerent neighbor threatens the fragile equilibrium of our guaranteed frontier buffer zones. Armed intervention shall restore treaty boundaries."
 oe_war2_cb_enforce_balance:0 "Enforce Balance of Power"
 oe_war2_cb_enforce_balance_PROV:0 "Coalition war to check continental hegemony and restore balance of power"
 oe_war2_cb_enforce_balance_desc:0 "An overmighty Great Power threatens to overturn the equilibrium of nations. We take up arms to dismantle hegemonic ambition and restore multipolar balance."
