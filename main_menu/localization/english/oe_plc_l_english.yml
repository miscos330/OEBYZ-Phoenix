l_english:
 oe_plc_b_krewo_union: "Compact of the Union of Krewo"
 oe_plc_b_teutonic_rivalry: "Baltic & Samogitian Rivalry"
 oe_plc_b_orthodox_bridge: "Orthodox Ruthenian Bridge"
 oe_plc_b_varna_brotherhood: "Carpathian-Danube Solidarity"
 STATIC_MODIFIER_NAME_oe_plc_eastern_frontier_drive: "Eastern Ruthenian Frontier Drive"
 STATIC_MODIFIER_DESC_oe_plc_eastern_frontier_drive: "Strategic expansion along the Dnieper corridor raises frontier levies and court prestige."
 STATIC_MODIFIER_NAME_oe_plc_crown_commerce_focus: "Vistula-Neman Royal Commerce"
 STATIC_MODIFIER_DESC_oe_plc_crown_commerce_focus: "Orderly tolls between Krakow and Vilnius strengthen royal revenue and merchant guilds."
 STATIC_MODIFIER_NAME_oe_plc_krewo_compact: "Union of Krewo Compact"
 STATIC_MODIFIER_DESC_oe_plc_krewo_compact: "The marriage of Jadwiga and Jogaila binds Crown and Grand Duchy under Latin Christendom."
 STATIC_MODIFIER_NAME_oe_plc_orthodox_lit_if: "Orthodox-Leaning Grand Duchy"
 STATIC_MODIFIER_DESC_oe_plc_orthodox_lit_if: "Embracing Orthodox Ruthenian traditions wins deep loyalty from Kyiv to Smolensk."
 STATIC_MODIFIER_NAME_oe_plc_carpathian_diplomacy: "Carpathian Royal Equilibrium"
 STATIC_MODIFIER_DESC_oe_plc_carpathian_diplomacy: "Without a Lithuanian union, the Polish crown balances central Europe through Carpathian ties."
 STATIC_MODIFIER_NAME_oe_plc_great_war_rally: "Great War Baltic Mobilization"
 STATIC_MODIFIER_DESC_oe_plc_great_war_rally: "Crown banners and Lithuanian horsemen march together toward Malbork and the Baltic coast."
 STATIC_MODIFIER_NAME_oe_plc_teutonic_crusade: "Crusader Host of Malbork"
 STATIC_MODIFIER_DESC_oe_plc_teutonic_crusade: "Western crusaders rally to Malbork's brick citadels to defend the Order's Prussian domain."
 STATIC_MODIFIER_NAME_oe_plc_baltic_truce: "Imperial and Papal Baltic Truce"
 STATIC_MODIFIER_DESC_oe_plc_baltic_truce: "Papal and imperial mediation buys time to fortify borders and refill the war chest."
 STATIC_MODIFIER_NAME_oe_plc_grunwald_ascendant: "Ascendancy of Grunwald"
 STATIC_MODIFIER_DESC_oe_plc_grunwald_ascendant: "Victory on the field of Grunwald establishes Poland-Lithuania as the preeminent power of eastern Europe."
 STATIC_MODIFIER_NAME_oe_plc_marienburg_bulwark: "Unbroken Bulwark of Malbork"
 STATIC_MODIFIER_DESC_oe_plc_marienburg_bulwark: "The brick fortress of Malbork withstands the storm, preserving the Order's Prussian bastion."
 STATIC_MODIFIER_NAME_oe_plc_thorn_reparations: "Thorn Reparations and Recovery"
 STATIC_MODIFIER_DESC_oe_plc_thorn_reparations: "War indemnities and border peace restore farms, river tolls, and royal coffers."
 STATIC_MODIFIER_NAME_oe_plc_horodlo_heraldry: "Heraldic Brotherhood of Horodlo"
 STATIC_MODIFIER_DESC_oe_plc_horodlo_heraldry: "Shared coats of arms bind Polish szlachta and Catholic Lithuanian boyars into one estate."
 STATIC_MODIFIER_NAME_oe_plc_ruthenian_friction: "Ruthenian Orthodox Noble Friction"
 STATIC_MODIFIER_DESC_oe_plc_ruthenian_friction: "Confining Horodlo privileges to Catholic lords stirs quiet resentment among Orthodox Ruthenian princes."
 STATIC_MODIFIER_NAME_oe_plc_ruthenian_parity: "Ruthenian Princely Parity Charter"
 STATIC_MODIFIER_DESC_oe_plc_ruthenian_parity: "Extending equal legal standing to Orthodox Ruthenian nobles secures Kyiv and the eastern marches."
 STATIC_MODIFIER_NAME_oe_plc_varna_bulwark: "Vanguard of the Danubian Bulwark"
 STATIC_MODIFIER_DESC_oe_plc_varna_bulwark: "Answering the call of Hungary and the Balkans steels the realm's cavalry for southern campaigns."
 STATIC_MODIFIER_NAME_oe_plc_jagiellonian_consolidation: "Jagiellonian Domestic Consolidation"
 STATIC_MODIFIER_DESC_oe_plc_jagiellonian_consolidation: "Avoiding distant Balkan gambles keeps the treasury full and the Crown lands orderly."
 STATIC_MODIFIER_NAME_oe_plc_vistula_grain_boom: "Vistula-Gdansk Grain Boom"
 STATIC_MODIFIER_DESC_oe_plc_vistula_grain_boom: "With Gdansk open to the sea, Vistula grain barges enrich both royal customs and coastal burghers."
 STATIC_MODIFIER_NAME_oe_plc_prussian_autonomy: "Royal Prussian Estates Charter"
 STATIC_MODIFIER_DESC_oe_plc_prussian_autonomy: "Respecting the Prussian estates' ancient charters secures peaceful rule along the Baltic."
 STATIC_MODIFIER_NAME_oe_plc_sejm_liberties: "Nihil Novi and the Sejm"
 STATIC_MODIFIER_DESC_oe_plc_sejm_liberties: "No new law passes without the Sejm's consent, raising noble loyalty while checking royal decree."
 STATIC_MODIFIER_NAME_oe_plc_royal_execution_movement: "Execution of the Laws Movement"
 STATIC_MODIFIER_DESC_oe_plc_royal_execution_movement: "Reclaiming alienated crown lands and auditing royal revenues fortifies central administration."
 STATIC_MODIFIER_NAME_oe_plc_lublin_consolidation: "Consolidated Union of Lublin"
 STATIC_MODIFIER_DESC_oe_plc_lublin_consolidation: "One Sejm, one currency, and unified royal administration forge the Commonwealth into an eastern colossus."
 STATIC_MODIFIER_NAME_oe_plc_golden_liberty: "Commonwealth of Golden Liberty"
 STATIC_MODIFIER_DESC_oe_plc_golden_liberty: "Noble liberties, religious toleration, and the famed winged hussars unite a vast multi-confessional realm."
 oe_plc_dec_royal_sejm.title: "Convene the General Sejm of Crown and Lithuania"
 oe_plc_dec_royal_sejm.desc: "Summon delegates from across the Crown and Grand Duchy to renew royal concord and domestic stability."
 oe_plc_dec_royal_sejm.a: "Enact the General Sejm's Resolutions"
 oe_plc_dec_ruthenian_charter.title: "Confirm the Ruthenian Toleration Charter"
 oe_plc_dec_ruthenian_charter.desc: "Guarantee the hereditary rights of Orthodox Ruthenian lords in Kyiv and Vilnius, ending frontier friction."
 oe_plc_dec_ruthenian_charter.a: "Seal the Ruthenian Charter"
 oe_plc_dec_baltic_grain_staple.title: "Charter the Vistula-Gdansk Grain Staple"
 oe_plc_dec_baltic_grain_staple.desc: "Organize Vistula granaries and Baltic shipping duties through Gdansk or Malbork for lasting prosperity."
 oe_plc_dec_baltic_grain_staple.a: "Establish the Baltic Grain Staple"
 oe_plc.1.t: "Blue Waters and the Ruthenian Frontier"
 oe_plc.1.d: "As steppe authority wavers across the Pontic plains, the Dnieper corridor from Kyiv to Volhynia beckons. Counselors in Krakow and Vilnius debate whether to press eastward into Ruthenia or consolidate the Vistula and Neman trade routes first."
 oe_plc.1.a: "Press eastward into the Ruthenian marches"
 oe_plc.1.a.tt: "Advances the regional line to Stage 1, grants [ShowModifier('oe_plc_eastern_frontier_drive')] (#Y 20#! years), and strengthens Polish-Lithuanian ties."
 oe_plc.1.b: "Consolidate Krakow and Vilnius royal commerce"
 oe_plc.1.b.tt: "Advances the regional line to Stage 1, grants #G +60#! gold and [ShowModifier('oe_plc_crown_commerce_focus')] (#Y 20#! years)."
 oe_plc.2.t: "The Union of Krewo: Jadwiga and Jogaila"
 oe_plc.2.d: "Pressed by the Teutonic Order along the Baltic, the Polish Crown seeks a martial consort while Grand Duke Jogaila stands at a historic crossroads. Shall Crown and Grand Duchy seal the Union of Krewo under Latin baptism, or part ways with an Orthodox-leaning Lithuania anchored in Ruthenia?"
 oe_plc.2.a: "Seal the Union of Krewo and Lithuania's Latin baptism"
 oe_plc.2.a.tt: "Historical Union path: Lithuania adopts Catholic faith, gains [ShowModifier('oe_plc_krewo_compact')] (#Y 25#! years), deepens Polish-Lithuanian trust, and sharpens Teutonic rivalry."
 oe_plc.2.b: "Keep separate realms: an Orthodox-leaning Lithuania"
 oe_plc.2.b.tt: "Alternate path: Lithuania turns Orthodox with [ShowModifier('oe_plc_orthodox_lit_if')] (#Y 30#! years), while Poland pivots to Carpathian diplomacy with [ShowModifier('oe_plc_carpathian_diplomacy')] (#Y 25#! years)."
 oe_plc.3.t: "Storm over Samogitia and the Great War"
 oe_plc.3.d: "Long-simmering disputes over Samogitia, the port of Gdansk, and the brick fortress of Malbork erupt into open crisis. Western knights ride north to the Order's banners while Polish and Lithuanian hosts muster along the Vistula."
 oe_plc.3.a: "Muster the war host for Malbork and the Baltic"
 oe_plc.3.a.tt: "Grants [ShowModifier('oe_plc_great_war_rally')] (or [ShowModifier('oe_plc_teutonic_crusade')] for the Teutonic Order) for #Y 15#! years."
 oe_plc.3.b: "Seek Papal and Imperial mediation"
 oe_plc.3.b.tt: "Grants #G +50#! gold and [ShowModifier('oe_plc_baltic_truce')] (#Y 12#! years)."
 oe_plc.4.t: "Echoes of Grunwald"
 oe_plc.4.d: "The clash on the fields of Grunwald and Tannenberg reverberates across Christendom. Whether Malbork holds or yields, the balance of northern Europe has shifted decisively—now the realm must choose how to press the peace."
 oe_plc.4.a: "Press the strategic ascendancy on the Baltic"
 oe_plc.4.a.tt: "Advances to Stage 3, grants #G +15#! prestige and [ShowModifier('oe_plc_grunwald_ascendant')] (or [ShowModifier('oe_plc_marienburg_bulwark')] if the Order holds Malbork) for #Y 25#! years."
 oe_plc.4.b: "Accept Thorn reparations and rebuild the realm"
 oe_plc.4.b.tt: "Advances to Stage 3, grants #G +100#! gold, #G +5#! stability, and [ShowModifier('oe_plc_thorn_reparations')] (#Y 20#! years)."
 oe_plc.5.t: "Union of Horodlo and the Ruthenian Nobility"
 oe_plc.5.d: "At Horodlo, Polish szlachta offer shared coats of arms and noble liberties to Catholic Lithuanian boyars. Yet across Kyiv and the eastern duchies, Orthodox Ruthenian princes bristle at exclusion from the new heraldic brotherhood."
 oe_plc.5.a: "Enact the Horodlo Charter for Catholic nobility"
 oe_plc.5.a.tt: "Grants [ShowModifier('oe_plc_horodlo_heraldry')] (#Y 25#! years); if Kyiv is owned, Kyiv suffers [ShowModifier('oe_plc_ruthenian_friction')] (#Y 15#! years)."
 oe_plc.5.b: "Extend equal privileges to Orthodox Ruthenian princes"
 oe_plc.5.b.tt: "Costs #R 5#! prestige, grants [ShowModifier('oe_plc_ruthenian_parity')] (#Y 30#! years), and clears Ruthenian friction in Kyiv."
 oe_plc.6.t: "Varna Echo and the Jagiellonian Crossroads"
 oe_plc.6.d: "Storm clouds gather along the lower Danube, and envoys from Hungary and Constantinople plead for Jagiellonian banners. Shall the Crown commit its lances to the Balkan bulwark, or safeguard its northern domains first?"
 oe_plc.6.a: "Stand with Hungary and Constantinople on the Danube"
 oe_plc.6.a.tt: "Grants #G +10#! prestige and [ShowModifier('oe_plc_varna_bulwark')] (#Y 20#! years), improving ties with Hungary and Byzantium."
 oe_plc.6.b: "Avoid southern overextension and consolidate the Crown"
 oe_plc.6.b.tt: "Grants #G +5#! stability and [ShowModifier('oe_plc_jagiellonian_consolidation')] (#Y 20#! years)."
 oe_plc.7.t: "Second Peace of Thorn and Royal Prussia"
 oe_plc.7.d: "After decades of struggle along the Vistula estuary, the fate of Gdansk and Malbork stands ready for lasting settlement. Grain barges await the North Sea markets, and the Crown must decide how Royal Prussia shall be governed."
 oe_plc.7.a: "Integrate the Vistula-Gdansk grain trade"
 oe_plc.7.a.tt: "Advances to Stage 4, grants #G +80#! gold and [ShowModifier('oe_plc_vistula_grain_boom')] (#Y 30#! years)."
 oe_plc.7.b: "Confirm the autonomous charters of the Prussian estates"
 oe_plc.7.b.tt: "Advances to Stage 4, grants #G +8#! stability and [ShowModifier('oe_plc_prussian_autonomy')] (#Y 30#! years)."
 oe_plc.8.t: "Nihil Novi and the Rise of the Sejm"
 oe_plc.8.d: "At the Diet of Radom, gentry deputies and senators press the monarch to pledge that nothing new shall be decreed without the Sejm's consent. Shall the Crown endorse noble constitutionalism or push back to reclaim royal revenues?"
 oe_plc.8.a: "Confirm Nihil Novi and empower the Sejm"
 oe_plc.8.a.tt: "Grants #G +6#! stability and [ShowModifier('oe_plc_sejm_liberties')] (#Y 30#! years, with a slight crown power trade-off)."
 oe_plc.8.b: "Launch the Execution of the Laws to bolster the Crown"
 oe_plc.8.b.tt: "Costs #R 4#! stability and grants [ShowModifier('oe_plc_royal_execution_movement')] (#Y 30#! years)."
 oe_plc.9.t: "The Union of Lublin: Two Nations Become One"
 oe_plc.9.d: "Confronted by Baltic rivalries and rising Muscovite power, delegates of Poland and Lithuania gather at Lublin to transform a personal union into a lasting Commonwealth. Shall the new realm lean toward royal consolidation or the proud Golden Liberty of its estates?"
 oe_plc.9.a: "Forge a consolidated, crown-led Commonwealth"
 oe_plc.9.a.tt: "Completes the line (Stage 5), costs #R 5#! stability, and grants [ShowModifier('oe_plc_lublin_consolidation')] (#Y 50#! years)."
 oe_plc.9.b: "Proclaim the Golden Liberty Commonwealth of Nobles"
 oe_plc.9.b.tt: "Completes the line (Stage 5), grants #G +15#! prestige and [ShowModifier('oe_plc_golden_liberty')] (#Y 50#! years)."
 oe_plc.20.t: "Poland-Lithuania: Choice Takes Effect"
 oe_plc.90.t: "[TEST] Poland-Lithuania Line: Readings"
 oe_plc.90.d: "#T Core State#!\nstage(0..5) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_stage')|0]  union(1Cat/2Ort) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_union')|0]  ruthenia(1C/2P) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_ruth')|0]  lublin(1C/2L) [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_lublin')|0]\n#T Scheduler#!\nsent [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_cnt')|0]  ran month [ROOT.GetCountry.MakeScope.ScriptValue('oe_plc_rd_m')|0]"
 oe_plc.90.a: "Close"
 oe_plc.90.b: "Refresh"
