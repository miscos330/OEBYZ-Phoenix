l_english:
 STATIC_MODIFIER_NAME_oe_hcr_genoese_privileges: "Genoese Privileges"
 STATIC_MODIFIER_NAME_oe_hcr_venetian_privileges: "Venetian Privileges"
 STATIC_MODIFIER_NAME_oe_hcr_garrison: "Garrison in the New Lands"
 STATIC_MODIFIER_NAME_oe_hcr_amnesty: "Amnesty in the New Lands"
 STATIC_MODIFIER_NAME_oe_hcr_amnesty_local: "Amnesty and Tax Relief"
 oe_hcr.1.t: "The Syrian Relief Army"
 oe_hcr.1.d: "In 1365 King Peter of Cyprus stormed Alexandria and left three days later: his barons wanted to sail home with the loot rather than face the Mamluk relief army. Now the empire's banners fly over the Nile, and the governor of Damascus is marching the Syrian regiments south through Gaza."
 oe_hcr.1.a: "Hold Alexandria"
 oe_hcr.1.a.tt: "Enemy reinforcements appear at Gaza (#Y 5#! infantry, #Y 3#! cavalry regiments)\nEgypt campaign pressure #R +10#!"
 oe_hcr.1.b: "Strike Gaza first"
 oe_hcr.1.b.tt: "#R −200#! gold, manpower #R −3#!\n#Y 60%#!: Egypt campaign progress #G +10#! and only half the reinforcements arrive\n#Y 40%#!: Egypt campaign pressure #R +15#! and all of them arrive"
 oe_hcr.1.c: "Do as King Peter did: plunder and withdraw"
 oe_hcr.1.c.tt: "#G +500#! gold\nEgypt campaign progress #R −15#!, pressure #G −20#!\nHope of the Reconquest #Y −5#!"
 oe_hcr.2.t: "The Tribes Turn"
 oe_hcr.2.d: "In 1347 the Marinid sultan Abu al-Hasan entered Tunis almost without a fight; the next year he tried to tighten his hold on the Arab tribes, and they turned on him and routed him below Kairouan that April. Now the tribal elders come to the imperial camp asking for the same thing: the subsidies they were always paid."
 oe_hcr.2.a: "Pay the subsidies as before"
 oe_hcr.2.a.tt: "#R −400#! gold\nNorth Africa campaign pressure #G −10#!"
 oe_hcr.2.b: "Tighten our hold"
 oe_hcr.2.b.tt: "North Africa campaign progress #G +5#!\n#R 50%#!: the tribes rise: nationalist rebels appear in the inland land won in this campaign (rebellion progress #Y 50%#!), pressure #R +10#!"
 oe_hcr.2.c: "Set one clan against another"
 oe_hcr.2.c.tt: "#R −200#! gold\nNorth Africa campaign progress #G +5#!, pressure #R +5#!"
 oe_hcr.3.t: "The Counter-stroke at Brindisi"
 oe_hcr.3.d: "In 1156 Manuel I's expedition took Bari and laid siege to Brindisi. William I of Sicily struck back by land and sea, the empire's mercenaries demanded more pay on the eve of battle, and the expedition collapsed; three weeks later the Pope made peace with William at Benevento. Now the southern kingdom is gathering an army at Taranto, and the mercenary captains are naming their price again."
 oe_hcr.3.a: "Meet the mercenaries' price"
 oe_hcr.3.a.tt: "Enemy reinforcements appear at Taranto (#Y 5#! infantry, #Y 3#! cavalry regiments)\n#R −500#! gold\nItaly campaign pressure #G −10#!"
 oe_hcr.3.b: "Fall back on Bari"
 oe_hcr.3.b.tt: "Enemy reinforcements appear at Taranto (#Y 5#! infantry, #Y 3#! cavalry regiments)\nItaly campaign progress #R −5#!, pressure #G −10#!"
 oe_hcr.3.c: "Send to Rome before the Pope changes sides"
 oe_hcr.3.c.tt: "Enemy reinforcements appear at Taranto (#Y 5#! infantry, #Y 3#! cavalry regiments)\n#R −400#! gold\nThe Papal States' opinion of us #G +50#! (fades by #Y 2#! a year)\nThe Pope will not call for war on the schismatics for #Y 10#! years"
 oe_hcr.4.t: "The Arrière-ban"
 oe_hcr.4.d: "On 30 April 1337 Philip VI sent the arrière-ban across France; that year he declared Gascony forfeit, and Edward III answered that he himself was the rightful king of France. Now the summons runs through France again, and knights and militia are gathering at Orléans."
 oe_hcr.4.a: "Approach England"
 oe_hcr.4.a.tt: "Enemy reinforcements appear at Orléans (#Y 6#! infantry, #Y 4#! cavalry regiments)\n#R −300#! gold\nIf England exists and is not at war with us, it joins this war on our side"
 oe_hcr.4.b: "Meet them in the field"
 oe_hcr.4.b.tt: "Enemy reinforcements appear at Orléans (#Y 6#! infantry, #Y 4#! cavalry regiments)\nFrance campaign progress #G +5#!, pressure #R +10#!"
 oe_hcr.4.c: "Make a separate peace with some of the princes"
 oe_hcr.4.c.tt: "Enemy reinforcements appear at Orléans (#Y 6#! infantry, #Y 4#! cavalry regiments)\nA white peace with the weakest enemy, which is no longer a target of this campaign\nFrance campaign progress #R −5#!, pressure #G −15#!"
 oe_hcr.5.t: "The Alliance of the Salado"
 oe_hcr.5.d: "In 1340 Pope Benedict XII proclaimed a crusade, and Castile and Portugal, usually at odds, joined forces to defeat the Marinids and Granada on the Salado. The kingdoms of the peninsula have always done this: when an outsider comes, old quarrels wait. Now the Orders of Santiago and Calatrava are calling up their men."
 oe_hcr.5.a: "Divide them"
 oe_hcr.5.a.tt: "A white peace with the weakest kingdom, which is no longer a target of this campaign\nReinforcements at every other enemy capital (#Y 2#! infantry, #Y 1#! cavalry regiment)\nIberia campaign progress #R −5#!, pressure #G −15#!"
 oe_hcr.5.b: "Buy off the Orders"
 oe_hcr.5.b.tt: "#R −300#! gold\nOnly one infantry regiment appears at each enemy capital"
 oe_hcr.5.c: "Take on the alliance"
 oe_hcr.5.c.tt: "Reinforcements at every enemy capital (#Y 2#! infantry, #Y 1#! cavalry regiment)\nIberia campaign pressure #R +5#!"
 oe_hcr.6.t: "The Blow from across the Channel"
 oe_hcr.6.d: "In the first years of the Hundred Years' War both kingdoms raided each other's ports; in 1338 a French fleet sacked Southampton. The Channel can be crossed from either side. Now the ships of the Cinque Ports are gathering to cut the empire's supply convoys."
 oe_hcr.6.a: "Organise convoys"
 oe_hcr.6.a.tt: "Enemy reinforcements appear at Southampton (#Y 4#! infantry, #Y 2#! cavalry regiments)\n#R −300#! gold"
 oe_hcr.6.b: "Approach Scotland"
 oe_hcr.6.b.tt: "Enemy reinforcements appear at Southampton (#Y 4#! infantry, #Y 2#! cavalry regiments)\n#R −200#! gold\nIf Scotland exists and is not at war with us, it joins this war on our side\nFor #Y 12#! months raiders strike the supply ships: Britain campaign pressure #R +1#! a month"
 oe_hcr.6.c: "Ignore them"
 oe_hcr.6.c.tt: "Enemy reinforcements appear at Southampton (#Y 4#! infantry, #Y 2#! cavalry regiments)\nFor #Y 12#! months raiders strike the supply ships: Britain campaign pressure #R +1#! a month"
 oe_hcr.7.t: "The Two Hasans"
 oe_hcr.7.d: "In 1335 the Ilkhan Abu Sa'id died without an heir. Hasan Buzurg of the Jalayirids and Hasan Kuchak of the Chobanids each set up a puppet khan and fought from 1338 to 1340, until Hasan Buzurg withdrew to Baghdad and ruled in his own name. Now, facing a Roman army, the princes of Persia have sat down together for the first time."
 oe_hcr.7.a: "Back one of them"
 oe_hcr.7.a.tt: "#R −400#! gold\nPersia campaign progress #G +10#!\nThe alliance never forms"
 oe_hcr.7.b: "Wait for them to fall out"
 oe_hcr.7.b.tt: "An allied army appears at the enemy capital (#Y 5#! infantry, #Y 3#! cavalry regiments)\nPersia campaign pressure #R +5#!\nIn #Y 6#! months: #Y 60%#! the alliance breaks (progress #G +10#!), #Y 40%#! it holds (pressure #R +10#!)"
 oe_hcr.7.c: "Face the allied army"
 oe_hcr.7.c.tt: "An allied army appears at the enemy capital (#Y 5#! infantry, #Y 3#! cavalry regiments)\nPersia campaign progress #G +5#!"
 oe_hcr.8.t: "The Siege of Caffa"
 oe_hcr.8.d: "From 1343 the Golden Horde's khan Jani Beg besieged Genoese Caffa again and again. In 1346 plague broke out in the besiegers' camp, and it is said they threw the dead over the walls. Now the khan's host is on the Crimean steppe once more."
 oe_hcr.8.a: "Hold Caffa to the last"
 oe_hcr.8.a.tt: "Enemy reinforcements appear at Solkhat (#Y 6#! infantry, #Y 4#! cavalry regiments)\nBlack Sea campaign pressure #R +10#!\n#Y 25%#!: plague in the camp, a further pressure #R +10#! and manpower #R −5#!"
 oe_hcr.8.b: "Evacuate Caffa by sea"
 oe_hcr.8.b.tt: "Black Sea campaign progress #R −10#!, pressure #G −15#!"
 oe_hcr.8.c: "Pay tribute to the khan"
 oe_hcr.8.c.tt: "#R −500#! gold\nA separate white peace with the khan; the other enemies fight on"
 oe_hcr.9.t: "The Mahmal from Cairo"
 oe_hcr.9.d: "Every pilgrimage season the sultan in Cairo sends an empty litter with the caravan to proclaim himself protector of the two holy cities; after 1350 the Hejaz was in practice a Mamluk province. With the holy cities changing hands, Cairo cannot look away."
 oe_hcr.9.a: "Let the pilgrimage go on, under our escort"
 oe_hcr.9.a.tt: "#R −300#! gold\nArabia campaign pressure #G −10#!\nThe Mamluks stay out of the war, though their opinion of us falls by #Y 20#! (fades by #Y 2#! a year)"
 oe_hcr.9.b: "Close the holy cities"
 oe_hcr.9.b.tt: "Arabia campaign progress #G +10#!\nEvery Muslim country's opinion of us #R −30#! (fades by #Y 1#! a year)\nIf the Mamluks are not at war with us they join this war, with reinforcements (#Y 4#! infantry, #Y 2#! cavalry regiments)"
 oe_hcr.9.c: "Recognise the Sharif's rule"
 oe_hcr.9.c.tt: "Arabia campaign progress #R −10#!, pressure #G −15#!\nThe Mamluks stay out of the war"
 oe_hcr.10.t: "War on the Schismatics"
 oe_hcr.10.d: "In 1281 Pope Martin IV excommunicated Michael VIII and blessed Charles of Anjou's war on Constantinople. Michael had held Charles off with the union of the churches at the Council of Lyon in 1274, and at the last he was saved by the Sicilian Vespers, which he had helped to pay for. Now the Curia is raising money again for a war on the Greek schismatics."
 oe_hcr.10.a: "Send envoys to discuss church union"
 oe_hcr.10.a.tt: "The Pope withdraws the call\n[oe_tu_authority|e] #R −5#!, stability falls"
 oe_hcr.10.b: "Pay for trouble in their own house"
 oe_hcr.10.b.tt: "#R −500#! gold\n#Y 60%#!: the call finds no response; current campaign progress #G +5#!\n#Y 40%#!: the plot is discovered, the call goes out, and Catholic opinion of us falls by a further #Y 15#!"
 oe_hcr.10.c: "Ignore it"
 oe_hcr.10.c.tt: "The call goes out: the strongest Catholic country not at war with us joins this war\nEvery Catholic country's opinion of us #R −25#! (fades by #Y 1#! a year)"
 oe_hcr.11.t: "The Call to Jihad"
 oe_hcr.11.d: "The sultan in Cairo calls himself the protector of Islam. After Alexandria was sacked in 1365, Cairo at once ordered a fleet built for revenge. Now the call is read out in mosques everywhere, summoning the faithful against the Romans."
 oe_hcr.11.a: "Proclaim tolerance: protect the mosques and the pilgrimage"
 oe_hcr.11.a.tt: "[oe_tu_authority|e] #R −5#!\nThe call loses its force: only the strongest Muslim country joins this war"
 oe_hcr.11.b: "Send envoys to divide them"
 oe_hcr.11.b.tt: "#R −400#! gold\n#Y 60%#!: the call finds no response\n#Y 40%#!: the call goes out"
 oe_hcr.11.c: "Ignore it"
 oe_hcr.11.c.tt: "The call goes out: while a holy city is in our hands the Mamluks (or the strongest Muslim power) proclaim a jihad against the empire; otherwise the strongest Muslim country joins this war"
 oe_hcr.12.t: "Genoa or Venice"
 oe_hcr.12.d: "In 1261 Michael VIII made the Treaty of Nymphaeum with Genoa, trading customs privileges for a Genoese fleet; after the Genoese lost at sea in 1263 he made peace with Venice in 1268. Now envoys of both republics have come to court at once, each asking for the empire's ports for itself alone."
 oe_hcr.12.a: "Ally with Genoa"
 oe_hcr.12.a.tt: "Gain 'Genoese Privileges' (tariff income #R −10%#!, #Y 20#! years)\nCoastal campaigns: pressure #G −1#! a month, and 'The Genoese Factors' no longer happens (#Y 20#! years)\nVenice's opinion of us #R −40#! (fades by #Y 2#! a year); #Y 30%#! that it joins the enemy whenever a coastal campaign starts"
 oe_hcr.12.b: "Ally with Venice"
 oe_hcr.12.b.tt: "Gain 'Venetian Privileges' (tariff income #R −10%#!, #Y 20#! years)\nCoastal campaigns: pressure #G −1#! a month, and 'The Venetian Fleet' no longer happens (#Y 20#! years)\nGenoa's opinion of us #R −40#! (fades by #Y 2#! a year); #Y 30%#! that it joins the enemy whenever a coastal campaign starts"
 oe_hcr.12.c: "Give neither"
 oe_hcr.12.c.tt: "Things stay as they are; both go on naming their prices"
 oe_hcr.13.t: "The Day of Battle"
 oe_hcr.13.d: "The enemy's main army has marched out and drawn up, offering battle. In 552 Narses at Taginae placed his archers on the wings; Totila's horsemen charged into the centre and broke under arrows from both sides, and one day decided Italy. Manzikert in 1071 ended the other way."
 oe_hcr.13.a: "Give battle"
 oe_hcr.13.a.tt: "#Y 50%#! to win; #Y +15%#! at Rising fervour or above, #Y +10%#! with a frontier theme, #Y −15%#! at pressure #Y 60#! or more\nWin: current campaign progress #G +15#!, pressure #G −10#!, Hope of the Reconquest #R +5#!\nLoss: current campaign pressure #R +20#!, manpower #R −5#!, Hope #R −5#!"
 oe_hcr.13.b: "Do as Narses did: hold a strong line"
 oe_hcr.13.b.tt: "Current campaign progress #G +5#!, pressure #R +5#!"
 oe_hcr.13.c: "Refuse battle"
 oe_hcr.13.c.tt: "Current campaign progress #R −5#!, pressure #G −5#!"
 oe_hcr.14.t: "Quarrels in the Enemy Camp"
 oe_hcr.14.d.egypt: "After al-Nasir Muhammad died in 1341, the emirs set up and threw down his sons and grandsons one after another. The court in Cairo is split into factions once more."
 oe_hcr.14.d.arabia: "After al-Nasir Muhammad died in 1341 the emirs made and unmade sultans in Cairo, and the sharifian house in Mecca quarrels over its own succession."
 oe_hcr.14.d.africa: "When the Hafsid sultan Abu Bakr died in 1346 his sons fought over the throne, which let the Marinids in. The same crack has opened in the enemy camp."
 oe_hcr.14.d.persia: "Since the Ilkhanate fell apart, the Jalayirids, Chobanids and Muzaffarids have fought one another, and none can command the whole country."
 oe_hcr.14.d.blacksea: "From 1359 the Golden Horde fell into the 'Great Troubles', with more than twenty khans in twenty years. The steppe nobles are quarrelling over the throne again."
 oe_hcr.14.d: "The enemy's lords are arguing over who should lead and who should pay, and some are quietly asking what terms the empire might offer."
 oe_hcr.14.a: "Buy one side"
 oe_hcr.14.a.tt: "#R −300#! gold\nCurrent campaign progress #G +10#!"
 oe_hcr.14.b: "Watch and wait"
 oe_hcr.14.b.tt: "Current campaign pressure #G −10#!"
 oe_hcr.15.t: "Risings in the New Lands"
 oe_hcr.15.d: "After Justinian recovered Africa, Stotzas led unpaid soldiers in mutiny in 536 and the Moorish chief Antalas rose in 544; it took the empire another ten years, and John Troglita, to end it. Now the people of the newly won land have taken up arms too."
 oe_hcr.15.a: "Send more garrisons"
 oe_hcr.15.a.tt: "#R −300#! gold\nRebellion progress #R −20%#!\nThe new lands gain 'Garrison in the New Lands' (max control #G +10%#!, monthly control #G +1%#!, #Y 5#! years)"
 oe_hcr.15.b: "Amnesty and five years' tax relief"
 oe_hcr.15.b.tt: "The rebels disband\nGain 'Amnesty in the New Lands' (tax efficiency #R −5%#!, #Y 5#! years)\nThe new lands gain 'Amnesty and Tax Relief' (unrest #G −0.2#!, #Y 5#! years)"
 oe_hcr.15.c: "Ignore them"
 oe_hcr.15.c.tt: "Rebellion progress #G +20%#!"
 oe_hcr.16.t: "The Alliance Breaks"
 oe_hcr.16.d: "As expected, the two Hasans fell out again over Baghdad and Tabriz, and each took his army home."
 oe_hcr.16.a: "Just as we thought"
 oe_hcr.16.a.tt: "Persia campaign progress #G +10#!"
 oe_hcr.17.t: "The Alliance Holds"
 oe_hcr.17.d: "This time the Persian princes proved more patient than we thought. The alliance holds, and its armies are learning to fight together."
 oe_hcr.17.a: "We misjudged them"
 oe_hcr.17.a.tt: "Persia campaign pressure #R +10#!"
