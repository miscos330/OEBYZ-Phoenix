 STATIC_MODIFIER_DESC_oe_kr2_haengju_hwacha_mod:0 "Coordinated Hwacha rocket salvos and mountain earthworks turn Korean hillforts into impregnable killing grounds."
 STATIC_MODIFIER_NAME_oe_kr2_righteous_armies_mod:0 "Righteous Armies & Monk Militias"
 STATIC_MODIFIER_DESC_oe_kr2_righteous_armies_mod:0 "Provincial scholar militias and warrior monks harass enemy supply lines and swell national manpower in times of peril."
 STATIC_MODIFIER_NAME_oe_kr2_myeongnyang_mod:0 "Miracle of Myeongnyang Strait"
 STATIC_MODIFIER_DESC_oe_kr2_myeongnyang_mod:0 "Exploiting fierce narrows tides with iron resolve, Korea's outnumbered warships earn immortal naval renown."
 STATIC_MODIFIER_NAME_oe_kr2_allied_relief_mod:0 "Allied Relief & Coastal Coordination"
 STATIC_MODIFIER_DESC_oe_kr2_allied_relief_mod:0 "Coordinating allied land columns with coastal naval blockades turns strategic defense into counteroffensive."
 STATIC_MODIFIER_NAME_oe_kr2_daedongbeop_mod:0 "Daedongbeop Unified Land Tax"
 STATIC_MODIFIER_DESC_oe_kr2_daedongbeop_mod:0 "Replacing arbitrary local tribute levies with uniform rice-and-cloth land taxes relieves farmers while swelling state revenue."
 STATIC_MODIFIER_NAME_oe_kr2_gongin_markets_mod:0 "Gongin Licensed Merchants & Markets"
 STATIC_MODIFIER_DESC_oe_kr2_gongin_markets_mod:0 "State procurement through licensed Gongin merchants stimulates artisan guilds and nationwide commercial exchange."
 STATIC_MODIFIER_NAME_oe_kr2_namhansan_defiance_mod:0 "Namhansanseong Mountain Defiance"
 STATIC_MODIFIER_DESC_oe_kr2_namhansan_defiance_mod:0 "Reforged behind highland bastions, royal matchlock corps and stubborn garrison forces harden national resilience."
 STATIC_MODIFIER_NAME_oe_kr2_pragmatic_peace_mod:0 "Pragmatic Border Autonomy"
 STATIC_MODIFIER_DESC_oe_kr2_pragmatic_peace_mod:0 "Pragmatic frontier diplomacy preserves internal autonomy and channels resources back into demographic and fiscal recovery."
 STATIC_MODIFIER_NAME_oe_kr2_hyojong_firearms_mod:0 "Hyojong's Royal Firearms Corps"
 STATIC_MODIFIER_DESC_oe_kr2_hyojong_firearms_mod:0 "Expanding standing matchlock regiments and artillery crews transforms Korea's royal army into a disciplined gunpowder force."
 STATIC_MODIFIER_NAME_oe_kr2_domestic_recovery_mod:0 "Sangpyeong Coinage & Granary Recovery"
 STATIC_MODIFIER_DESC_oe_kr2_domestic_recovery_mod:0 "Standardized copper coinage and revitalized coastal grain transport bring steady prosperity across the peninsula."
 STATIC_MODIFIER_NAME_oe_kr2_tangpyeong_mod:0 "Tangpyeong Impartiality & Equalized Service"
 STATIC_MODIFIER_DESC_oe_kr2_tangpyeong_mod:0 "Impartial royal appointments curb court factionalism while halving peasant military cloth taxes stabilizes the realm."
 STATIC_MODIFIER_NAME_oe_kr2_amhaengeosa_mod:0 "Amhaengeosa Secret Royal Inspectors"
 STATIC_MODIFIER_DESC_oe_kr2_amhaengeosa_mod:0 "Covert royal inspectors audit county magistrates across the provinces, curbing abuses and raising administrative control."
 STATIC_MODIFIER_NAME_oe_kr2_silhak_renaissance_mod:0 "Kyujanggak & Silhak Practical Learning"
 STATIC_MODIFIER_DESC_oe_kr2_silhak_renaissance_mod:0 "Royal Kyujanggak scholars pioneer cranes, cartography, medicine, and practical economic reform in a Korean Enlightenment."
 STATIC_MODIFIER_NAME_oe_kr2_hwaseong_fortress_mod:0 "Suwon Hwaseong Modern Citadel"
 STATIC_MODIFIER_DESC_oe_kr2_hwaseong_fortress_mod:0 "Engineered with pulleys, brick bastions, and planned merchant boulevards, Hwaseong anchors both defense and commerce."
 STATIC_MODIFIER_NAME_oe_kr2_turtle_dockyards_mod:0 "Imperial Turtle Ship Dockyards"
 STATIC_MODIFIER_DESC_oe_kr2_turtle_dockyards_mod:0 "Dedicated naval yards in Jeolla and Gyeongsang turn out armored Geobukseon warships at unmatched speed and quality."
 STATIC_MODIFIER_NAME_oe_kr2_hwacha_batteries_mod:0 "Standing Hwacha Rocket Batteries"
 STATIC_MODIFIER_DESC_oe_kr2_hwacha_batteries_mod:0 "State ordnance bureaus mass-produce Hwacha rocket batteries for border citadels and field armies alike."
 oe_kr2_dec_turtle_dockyards.title:0 "Commission Turtle Ship Dockyards"
 oe_kr2_dec_turtle_dockyards.desc:0 "Fund dedicated royal dockyards along the southern naval stations, immediately unlocking recruitable Geobukseon Turtle Ships while boosting shipbuilding speed and naval combat power for 25 years."
 oe_kr2_dec_turtle_dockyards.a:0 "Commission the Turtle Ship Yards"
 oe_kr2_dec_hwacha_batteries.title:0 "Deploy Hwacha Rocket Batteries"
 oe_kr2_dec_hwacha_batteries.desc:0 "Direct state ordnance workshops to mass-produce wheeled Hwacha rocket carts, unlocking recruitable Hwacha artillery regiments and granting 25 years of artillery and siege bonuses."
 oe_kr2_dec_hwacha_batteries.a:0 "Deploy the Hwacha Batteries"
 oe_kr2_dec_tangpyeong.title:0 "Enact Tangpyeong Impartiality"
 oe_kr2_dec_tangpyeong.desc:0 "Rise above bitter court factionalism by appointing capable officials impartially across parties and easing rural tax burdens, lifting stability, legitimacy, and fiscal efficiency for 30 years."
 oe_kr2_dec_tangpyeong.a:0 "Proclaim Tangpyeong Impartiality"
 oe_kr2.1.title:0 "The Wihwado Retreat: Yi Seong-gye Turns Back"
 oe_kr2.1.desc:0 "Swollen monsoon waters trap the expeditionary host on Wihwado Island in the Yalu near Uiju. General Yi Seong-gye petitions that marching north in summer rains invites ruin and turns his seasoned regiments back toward Kaesong."
 oe_kr2.1.a:0 "Back Yi Seong-gye's Reform Host"
 oe_kr2.1.b:0 "Mediate Between Generals and the Kaesong Court"
 oe_kr2.2.title:0 "Founding of Joseon and the Hanseong Court"
 oe_kr2.2.desc:0 "As a new dynastic era dawns, chief architect Jeong Do-jeon urges moving the capital from Kaesong to Hanseong along the Han River while auditing aristocratic estates under a unified land register. Kaesong merchants plead to preserve their historic guild charters."
 oe_kr2.2.a:0 "Establish the Hanseong Court and Land Cadastre"
 oe_kr2.2.b:0 "Protect Kaesong Merchant Guilds Alongside Hanseong"
 oe_kr2.3.title:0 "King Sejong's Hall of Worthies and Scientific Instruments"
 oe_kr2.3.desc:0 "Within the Hall of Worthies, royal engineers led by Jang Yeong-sil unveil bronze armillary spheres, automated water clocks, and the world's first standardized rain gauges, bringing empirical astronomy and meteorology to the Korean court."
 oe_kr2.3.a:0 "Fund the Royal Observatory and Celestial Instruments"
 oe_kr2.3.b:0 "Deploy Rain Gauges and Agronomy Manuals Across Every Province"
 oe_kr2.4.title:0 "Promulgation of Hangul and Bronze Movable Type"
 oe_kr2.4.desc:0 "Modeled on the vocal organs themselves, the twenty-eight letters of Hangul allow commoners to read laws, medicine, and farming guides within days. Conservative scholars protest breaking with classical Chinese letters, forcing a decisive royal choice."
 oe_kr2.4.a:0 "Print Hangul Primers and Practical Books Nationwide"
 oe_kr2.4.b:0 "Publish Dual-Script Classical and Hangul Editions"
 oe_kr2.5.title:0 "Munjong's Singijeon and Hwacha Rocket Cart Trials"
 oe_kr2.5.desc:0 "Royal ordnance engineers perfect a two-wheeled cart firing a hundred iron-tipped Singijeon rockets in one deafening volley. Frontier commanders debate mass-producing Hwacha batteries immediately or pouring funds into northern river fortresses."
 oe_kr2.5.a:0 "Mass-Produce Hwacha Rocket Batteries"
 oe_kr2.5.b:0 "Fortify the Four Commanderies and Six Garrisons"
 oe_kr2.6.title:0 "The First Literati Purge: Hungu vs Sarim"
 oe_kr2.6.desc:0 "A caustic line in a royal draft history ignites open strife between entrenched Hungu grandees in the State Council and idealistic Sarim Neo-Confucian censors rising from provincial academies."
 oe_kr2.6.a:0 "Uphold Sarim Censorial Integrity"
 oe_kr2.6.b:0 "Empower the Hungu State Council"
 oe_kr2.7.title:0 "Gimyosahwa and Jo Gwang-jo's Village Compacts"
 oe_kr2.7.desc:0 "Reformer Jo Gwang-jo champions meritocratic recruitment, rural Hyangyak mutual-aid compacts, and a purge of padded noble stipends—provoking fierce conservative backlash inside the palace."
 oe_kr2.7.a:0 "Preserve the Hyangyak Village Compacts"
 oe_kr2.7.b:0 "Broker a Conciliatory Court Truce"
 oe_kr2.8.title:0 "Easterners and Westerners: Factionalism and Border Defense"
 oe_kr2.8.desc:0 "Disputes over personnel appointments split the scholar-bureaucracy into rival Easterner and Westerner factions just as dark clouds gather across the Korea Strait and along the northern rivers."
 oe_kr2.8.a:0 "Strengthen the Non-Partisan Border Defense Council"
 oe_kr2.8.b:0 "Back a Dominant Ministerial Coalition"
 oe_kr2.9.title:0 "Admiral Yi Sun-sin and the Geobukseon at Hansando"
 oe_kr2.9.desc:0 "Off Geoje Island, Admiral Yi Sun-sin lures the invading armada into the open waters of Hansando. Spiked armored Geobukseon turtle ships punch straight through the enemy center while Panokseon broadsides sweep shut in the Crane-Wing formation, severing sea supply lines."
 oe_kr2.9.a:0 "Commission Geobukseon Squadrons Across the Southern Stations"
 oe_kr2.9.b:0 "Expand Three-Province Shipyards and Naval Granaries"
 oe_kr2.10.title:0 "Victory at Haengju: Hwacha Rain of Fire"
 oe_kr2.10.desc:0 "Holding a steep riverside earthwork overlooking the Han River, General Gwon Yul and volunteer defenders shatter seven furious assaults with coordinated volleys from Hwacha rocket carts, turning Haengju into a symbol of Korean land resistance."
 oe_kr2.10.a:0 "Standardize Hwacha Rocket Batteries Across All Garrisons"
 oe_kr2.10.b:0 "Reward the Righteous Armies and Monk Volunteers"
 oe_kr2.11.title:0 "The Miracle of Myeongnyang Strait"
 oe_kr2.11.desc:0 "When disaster reduces the southern navy to a dozen battered warships, court ministers urge disbanding the fleet. Reinstated Admiral Yi writes 'I still have twelve ships,' harnessing Myeongnyang's roaring tidal narrows to rout an armada ten times his size."
 oe_kr2.11.a:0 "Forge an Unbreakable Strait Defense Doctrine"
 oe_kr2.11.b:0 "Coordinate Maritime Blockades With Continental Allies"
 oe_kr2.12.title:0 "Post-War Reconstruction and the Daedongbeop Tax Reform"
 oe_kr2.12.desc:0 "Devastated counties struggle beneath arbitrary regional tribute quotas. Chief State Councilor Yi Won-ik champions the Daedongbeop, commuting tangled local levies into a single transparent land assessment paid in rice, cloth, or coin."
 oe_kr2.12.a:0 "Enact the Unified Daedongbeop Land Tax"
 oe_kr2.12.b:0 "Charter Gongin Merchants to Stimulate National Markets"
 oe_kr2.13.title:0 "Byeongja Horan: The Winter Siege of Namhansanseong"
 oe_kr2.13.desc:0 "Northern Banner cavalry cross the frozen Yalu in midwinter and race toward Hanseong. Sheltered behind the snowbound ramparts of Namhansanseong, court hawks vow defiance to the last arrow while pragmatists warn of famine and ruin."
 oe_kr2.13.a:0 "Hold the Mountain Ramparts and Drill Firearms Corps"
 oe_kr2.13.b:0 "Negotiate Pragmatic Terms to Safeguard Domestic Autonomy"
 oe_kr2.14.title:0 "King Hyojong's Northern Expedition Debate"
 oe_kr2.14.desc:0 "King Hyojong consults generals and scholars on launching a Northern Expedition built around a modernized standing Royal Firearms Corps, while treasury officials urge prioritizing copper coinage and domestic granary recovery first."
 oe_kr2.14.a:0 "Expand the Royal Firearms Corps and Ordnance Arsenals"
 oe_kr2.14.b:0 "Mint Sangpyeong Coinage and Invest in Domestic Recovery"
 oe_kr2.15.title:0 "Yeongjo's Tangpyeong Impartiality and Equalized Service"
 oe_kr2.15.desc:0 "Determined to break a century of paralyzing court factionalism, King Yeongjo erects the Tangpyeong Stone of Impartiality, appointing ministers across rival parties while halving peasant military cloth taxes."
 oe_kr2.15.a:0 "Enact Tangpyeong Impartiality and Equalized Service"
 oe_kr2.15.b:0 "Dispatch Secret Royal Inspectors Across the Eight Provinces"
 oe_kr2.16.title:0 "King Jeongjo, Kyujanggak, and the Silhak Renaissance"
 oe_kr2.16.desc:0 "King Jeongjo's Kyujanggak Royal Library gathers Silhak thinkers like Jeong Yak-yong to apply empirical engineering, cartography, and commercial reform—culminating in the crane-built brick bastions and merchant boulevards of Suwon's Hwaseong Fortress."
 oe_kr2.16.a:0 "Patronize the Kyujanggak Library and Silhak Engineering"
 oe_kr2.16.b:0 "Develop Suwon Hwaseong as a Modern Citadel and Trade Hub"
