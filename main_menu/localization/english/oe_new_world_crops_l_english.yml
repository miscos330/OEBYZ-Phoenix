l_english:
 oe_works_transplant_new_world_crops: "Transplant New World Crops"
 oe_works_transplant_new_world_crops_desc: "Requires the #Y Age of Discovery or a later age#!. Choose #Y Chili Peppers, Maize, Potatoes, Tobacco or Cocoa#!, then a suitable location owned by Byzantium or any of its subjects. Spend #Y 200 Gold#! to replace its raw material with the chosen crop. The location gains #Y Transplanting New World Crops#!: initially #R −20% Food Production#!, fading over #Y five years#!.\n\nNo cooldown or use limit. Locations already producing the chosen crop cannot be selected. Replanting restarts the adjustment period without stacking the penalty.\n\n$OE_NW_CROP_RULES$"
 OE_NW_CROP_CHOOSE_GOOD: "Choose a New World crop"
 OE_NW_CROP_CHOOSE_LOCATION: "Choose suitable Byzantine or subject land"
 OE_NW_CROP_NO_LOCATION: "No Byzantine or subject location is suitable for this crop, or suitable locations already produce it.\n\n$OE_NW_CROP_RULES$"
 OE_NW_CROP_SUITABLE_TT: "The selected crop suits this location’s climate, terrain, vegetation and water supply"
 OE_NW_CROP_RULES: "#Y Growing conditions#!\nChili peppers: flatlands, hills or plateaus with a warm growing season; farmland, grasslands, woods, forest or sparse vegetation.\nMaize: similar to peppers, also allowing jungle and tropical or subtropical mountains.\nPotatoes: cool or Mediterranean flatlands, hills, plateaus and mountains; warmer climates require plateaus or mountains. No jungle.\nTobacco: warm-season flatlands, hills or plateaus; farmland, grasslands, woods or sparse vegetation.\nCocoa: tropical or subtropical flatlands and hills with farmland, woods, forest or jungle.\n\nArid, semi-arid or sparsely vegetated locations require a river or existing farmland. No deserts, wetlands, Arctic climates or unconquerable locations."
 oe_new_world_crop_transplant: "Transplanting New World Crops"
 oe_new_world_crop_transplant_desc: "Fields are being reorganized while farmers learn the new crop’s seasons, water needs and harvest methods. Initial food losses gradually fade as cultivation takes root."
