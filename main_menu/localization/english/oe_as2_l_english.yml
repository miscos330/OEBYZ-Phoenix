 oe_as2_dec_cultural_doctrine.title: "Set Imperial Cultural Doctrine"
 oe_as2_dec_cultural_doctrine.desc: "Define how our realm governs its diverse peoples: invest court revenues into Active Civic Assimilation, or codify a Cosmopolitan Foederati Federation that turns accepted minority cultures into pillars of trade, production, and manpower."
 oe_as2_dec_cultural_doctrine.a: "Convene the Imperial Cultural Council"
 oe_as2_dec_extend_romanization.title: "Fund Romanization & Frontier Synthesis"
 oe_as2_dec_extend_romanization.desc: "Commit imperial treasury and prestige to sustain active Roman identity movements, advance our integration milestones, or extend Greco-Roman synthesis into Mesopotamia, Persia, the Caucasus, and the Pontic Steppe."
 oe_as2_dec_extend_romanization.a: "Review Imperial Integration Allocations"
 oe_as2_dec_china_integration.title: "Enact Celestial Cultural Governance Charter"
 oe_as2_dec_china_integration.desc: "Advance our dynastic integration policy across three historic pillars: Gaituguiliu vs. Tusi frontier autonomy, Imperial Examinations and academies, and organized interior resettlement."
 oe_as2_dec_china_integration.a: "Issue the Next Celestial Integration Edict"
 oe_as2_dec_ottoman_integration.title: "Enact Sublime Porte Cultural Charter"
 oe_as2_dec_ottoman_integration.desc: "Shape the Ottoman Empire's multi-ethnic equilibrium through the Millet Charter, the Devshirme and Kapikulu imperial cadre, and the grand cultural synthesis of Kayser-i Rum."
 oe_as2_dec_ottoman_integration.a: "Convene the Imperial Divan on Subjects"
 oe_as2_dec_russia_integration.title: "Enact All-Russian Frontier Integration Charter"
 oe_as2_dec_russia_integration.desc: "Direct the integration of the steppe and eastern forests through Cossack frontier hosts, regulated Yasak fur treaties across Siberia, and the service-nobility decree."
 oe_as2_dec_russia_integration.a: "Summon the Boyar Council on Frontier Lands"
 oe_as2_dec_persianate_integration.title: "Enact Persianate & Subcontinental Synthesis Charter"
 oe_as2_dec_persianate_integration.desc: "Harmonize diverse faiths and linguistic worlds across Iran, Transoxiana, and India through Persianate chancery culture, Sulh-i-Kul universal conciliation, and regional lord compacts."
 oe_as2_dec_persianate_integration.a: "Summon the Royal Chancery & Scholars"
 oe_as2.1.t: "Imperial Cultural Doctrine: Unity or Federation"
 oe_as2.1.d: "As our borders encompass ever more languages, customs, and ancient cities, ministers debate the soul of imperial governance. One faction urges sustained state investment in roads, civic academies, and uniform law to fuse provincial populations into one imperial culture, accepting higher court outlays and temporary local friction. Another advocates a Cosmopolitan Foederati Federation—granting formal protection to accepted minority cultures so their workshops, merchants, and levies serve the throne willingly without forced assimilation."
 oe_as2.1.a: "Adopt Active Civic Assimilation — fund academies and uniform law."
 oe_as2.1.b: "Adopt Cosmopolitan Foederati Federation — protect and empower accepted cultures."
 oe_as2.1.c: "Leave provincial custom undisturbed for now."
 oe_as2.2.t: "Romanization Milestone I: Provincial Elites Admitted to the Senate"
 oe_as2.2.d: "Across our newly Romanizing provinces, a quarter of the great civic transformation is complete. Bilingual magistrates, wealthy landholders, and guild masters now petition Constantinople for formal recognition in the imperial order. How we incorporate this rising provincial class will set the tone for the next generation of Romanitas."
 oe_as2.2.a: "Enfranchise landed provincial nobles into the Senate."
 oe_as2.2.b: "Empower urban burghers and municipal guild councils."
 oe_as2.2.c: "Enforce a strict Hellenic-Roman grammar and legal curriculum."
 oe_as2.3.t: "Romanization Milestone II: Bilingual Provincial Law Code & Civic Franchise"
 oe_as2.3.d: "Roman identity has reached its midway zenith across the provinces. Imperial courts now hear cases in paired Greek and local tongues, while provincial towns clamor for the ancient dignity of Roman citizenship. Inspired by the Constitutio Antoniniana of old, the chancery presents three decrees to cement provincial loyalty."
 oe_as2.3.a: "Proclaim a new Constitutio Antoniniana granting broad civic franchise."
 oe_as2.3.b: "Grant tax immunities to loyal municipalities and schools."
 oe_as2.3.c: "Distribute veteran military-colonist land grants along provincial highways."
 oe_as2.4.t: "Romanization Milestone III: Full Roman Provincial Integration"
 oe_as2.4.d: "Three-quarters of our grand integration work has borne lasting fruit. Provincial cathedrals, basilicas, universities, and municipal archives alike speak the shared legal and cultural idiom of Rome. Envoys from every quarter gather in the capital to seal the permanent constitutional form of this renewed Roman Commonwealth."
 oe_as2.4.a: "Seal the Ecumenical Romanitas Charter of unified civic law."
 oe_as2.4.b: "Consecrate a Federative Commonwealth of self-governing Roman provinces."
 oe_as2.4.c: "Redirect surplus endowments into frontier roads and reconstruction."
 oe_as2.5.t: "Imperial Integration Renewal & Eastern Frontier Synthesis"
 oe_as2.5.d: "Sustaining cultural cohesion across continents requires more than an initial decree—it demands steady stipends for teachers, road engineers, and bilingual courts. Our chancery also proposes special synthesis charters for the ancient crossroads of Mesopotamia and Persia (echoing Seleucid Hellenism) and for the Caucasian highlands and Pontic Steppe."
 oe_as2.5.a: "Fund a 15-year renewal of active Romanization academies and highways."
 oe_as2.5.b: "Proclaim Seleucid-Mesopotamian & Persian Frontier Synthesis."
 oe_as2.5.c: "Proclaim the Caucasian & Pontic Steppe Synthesis Charter."
 oe_as2.5.e: "Pause active cultural drives and consolidate fiscal peace."
 oe_as2.6.t: "Gaituguiliu or Tusi Autonomy"
 oe_as2.6.d: "Along the misty river gorges and mountain marches of the southwest, hereditary Tusi chieftains have long ruled under imperial seals. Court centralizers urge appointing rotating career magistrates—Gaituguiliu—to bring uniform taxes, schools, and direct law to every valley. Border veterans warn that abrupt abolition invites mountain revolts, and favor reaffirming hereditary autonomy."
 oe_as2.6.a: "Enforce Gaituguiliu and install salaried imperial magistrates."
 oe_as2.6.b: "Confirm hereditary Tusi seals and local tribal custom."
 oe_as2.6.c: "Institute dual-track circuits pairing magistrates with local elders."
 oe_as2.7.t: "Imperial Examinations & Frontier Academies"
 oe_as2.7.d: "The Ministry of Rites reports growing petitions from frontier provinces seeking dedicated examination quotas and funded Confucian academies. Opening the civil service ladder to borderlands binds ambitious local scholars to the throne, while multilingual translation bureaus offer a gentler bridge for non-Han elites."
 oe_as2.7.a: "Expand prefectural academies and grant frontier examination quotas."
 oe_as2.7.b: "Fund multilingual classics and imperial translation bureaus."
 oe_as2.7.c: "Keep metropolitan quotas intact and conserve treasury funds."
 oe_as2.8.t: "Huguang Fills Sichuan: Organized Frontier Resettlement"
 oe_as2.8.d: "While densely packed river plains groan under land hunger, fertile frontier basins and border valleys lie half-empty after decades of war. Provincial governors propose a grand state-assisted migration—issuing homestead deeds, seed grain, and multi-year tax exemptions—or establishing hereditary Tuntian military-agricultural colonies."
 oe_as2.8.a: "Sponsor state homesteads, road depots, and seed grants."
 oe_as2.8.b: "Establish hereditary Tuntian military-agricultural garrisons."
 oe_as2.8.c: "Grant guild merchant syndicates frontier market concessions."
 oe_as2.9.t: "The Millet Charter & Imperial Centralization"
 oe_as2.9.d: "With Greek, Slavic, Armenian, Arab, and Jewish communities living side by side under the Sultan's banner, the Imperial Divan weighs how to codify provincial order. Formalizing autonomous confessional Millets secures steady tax yields and quiet borders without forcing cultural erasure, while strict Kadi centralization promises deeper imperial control."
 oe_as2.9.a: "Codify the autonomous Millet Charter for confessional communities."
 oe_as2.9.b: "Strengthen centralized Kadi courts across provincial towns."
 oe_as2.9.c: "Promulgate a balanced Kanunname reconciling custom and throne."
 oe_as2.10.t: "The Devshirme & Kapikulu Imperial Cadre"
 oe_as2.10.d: "Grand Viziers debate how best to staff the Sultan's standing regiments and palace chancery. Institutionalizing the Devshirme levy and Enderun palace academy creates an unmatched corps of disciplined soldiers and administrators loyal solely to the crown, though provincial notables resent losing influence and subjects chafe at the levy."
 oe_as2.10.a: "Institutionalize the Enderun Palace School and Devshirme cadre."
 oe_as2.10.b: "Expand provincial Timariot fiefs for landed Sipahi cavalry."
 oe_as2.10.c: "Transition toward salaried volunteer regiments to ease unrest."
 oe_as2.11.t: "Kayser-i Rum: The Grand Cultural Synthesis"
 oe_as2.11.d: "Poets, architects, and jurists from Bursa to the Danube gather at court, hailing the Padishah as heir to both Islamic sovereignty and the imperial legacy of Rome. Will the Porte embrace the cosmopolitan synthesis of Kayser-i Rum, champion Gazi heartland assimilation, or anchor imperial wealth in Mediterranean merchant enclaves?"
 oe_as2.11.a: "Proclaim the cosmopolitan throne of Kayser-i Rum."
 oe_as2.11.b: "Champion Gazi orthodoxy and core cultural assimilation."
 oe_as2.11.c: "Charter Mediterranean bazaar guilds and artisan enclaves."
 oe_as2.12.t: "Cossack Frontier Hosts & the Wild Fields"
 oe_as2.12.d: "South and east of the forest belt stretches the vast black-earth steppe, raided by nomads yet teeming with fertile river valleys. Free frontier horsemen—Cossacks—offer to guard the river crossings in exchange for internal liberty, while court commanders propose regular crown garrisons or fortified peasant Abatis lines."
 oe_as2.12.a: "Charter autonomous Cossack frontier hosts along the steppe rivers."
 oe_as2.12.b: "Deploy salaried crown Streltsy garrisons and voivode forts."
 oe_as2.12.c: "Fortify the Abatis Line and settle peasant plowmen."
 oe_as2.13.t: "Yasak Fur Tribute & Siberian Integration"
 oe_as2.13.d: "Beyond the Urals, navigable rivers open an endless realm of sable, pine forests, and indigenous Siberian peoples. The Siberian Chancellery asks whether to rely on regulated Yasak fur treaties that respect local clans, push Orthodox river missions and Slavic colonization, or entrust frontier development to chartered merchant magnates."
 oe_as2.13.a: "Enforce fair Yasak fur treaties and ostrog trading posts."
 oe_as2.13.b: "Sponsor Orthodox river missions and Slavic ostrog colonization."
 oe_as2.13.c: "Grant chartered Stroganov merchant-magnate concessions."
 oe_as2.14.t: "Service Nobility & the All-Russian Integration Decree"
 oe_as2.14.d: "As our Tsardom stretches from Baltic harbors to eastern river basins, the Boyar Council debates how to bind newly annexed elites to Moscow. Making Russian chancery service and cultural conformity the sole path to rank accelerates assimilation, while co-opting Tatar murzas and Baltic barons into an inclusive imperial nobility preserves tranquility across vast frontiers."
 oe_as2.14.a: "Enact the uniform Service-Nobility Assimilation Charter."
 oe_as2.14.b: "Co-opt steppe and borderland elites into the imperial Dvorianstvo."
 oe_as2.14.c: "Prioritize heartland legal reform and agrarian productivity."
 oe_as2.15.t: "The Persianate Court & Imperial Chancery"
 oe_as2.15.d: "From Samarkand and Isfahan to Delhi, the graceful cadence of Persian chancery prose, poetry, and madrasa scholarship serves as the lingua franca of empire. Our Viziers propose either funding a grand imperial Diwan and academy network to spread unified high court culture, or sponsoring multilingual patronage uniting Persian, Turkic, and Indic learning."
 oe_as2.15.a: "Establish the Imperial Persianate Diwan and madrasa network."
 oe_as2.15.b: "Sponsor multilingual Turko-Persian and Indic letters."
 oe_as2.15.c: "Endow urban waqf trusts and bazaar scribal guilds."
 oe_as2.16.t: "Sulh-i-Kul: Universal Conciliation or Orthoprax Unity"
 oe_as2.16.d: "Governing millions of subjects across varied faiths and sects tests every sovereign of the Iranian plateau and Hindustan. Reformist scholars champion Sulh-i-Kul—universal peace with all creeds and cultures—promising booming workshops and quiet provinces at the price of orthodox clerical discontent. Conservative jurists counter that firm state orthopraxy alone ensures enduring unity."
 oe_as2.16.a: "Proclaim Sulh-i-Kul — universal peace with all faiths and cultures."
 oe_as2.16.b: "Enforce orthoprax state patronage and doctrinal integration."
 oe_as2.16.c: "Convene the Ibadat Khana interfaith scholarly dialogues."
 oe_as2.17.t: "The Qizilbash & Zamindar Provincial Compact"
 oe_as2.17.d: "Between the royal palace and the distant village stand martial tribal chiefs and hereditary regional revenue lords—Qizilbash emirs in the Iranian marches, Zamindars and Rajputs across Hindustan. Integrating them into graded imperial compacts delivers vast cavalry and loyalty, while replacing them with salaried Ghulam crown administrators deepens tax collection and direct rule."
 oe_as2.17.a: "Seal the Mansabdar and Qizilbash provincial compact."
 oe_as2.17.b: "Replace hereditary tax-farmers with salaried Ghulam crown officials."
 oe_as2.17.c: "Charter royal caravanserais and Silk Road merchant guilds."
