l_english:
 STATIC_MODIFIER_NAME_oe_as2_track_assimilation_mod: "Active Civic Assimilation Doctrine"
 STATIC_MODIFIER_DESC_oe_as2_track_assimilation_mod: "State-funded academies, bilingual chanceries, and uniform civic law steadily fold provincial subjects into the imperial culture at an ongoing fiscal and political cost."
 STATIC_MODIFIER_NAME_oe_as2_track_foederati_mod: "Cosmopolitan Foederati Federation"
 STATIC_MODIFIER_DESC_oe_as2_track_foederati_mod: "Imperial charters safeguard accepted minority cultures in exchange for loyal levies, thriving workshops, and tranquil frontiers, trading away forced assimilation and central crown share."
 STATIC_MODIFIER_NAME_oe_as2_doctrine_cooldown_mod: "Recent Cultural Doctrine Revision"
 STATIC_MODIFIER_DESC_oe_as2_doctrine_cooldown_mod: "Chanceries and provincial governors are still adapting to the latest imperial cultural directive."
 STATIC_MODIFIER_NAME_oe_as2_chain_cooldown_mod: "Imperial Cultural Charter Implementation"
 STATIC_MODIFIER_DESC_oe_as2_chain_cooldown_mod: "Provincial magistrates are implementing the most recent imperial cultural integration ordinance."
 STATIC_MODIFIER_NAME_oe_as2_ms25_senatorial_nobles_mod: "Provincial Elites in the Senate"
 STATIC_MODIFIER_DESC_oe_as2_ms25_senatorial_nobles_mod: "Enfranchised provincial magnates bind local estates to Constantinople, accelerating integration while sharing court leverage."
 STATIC_MODIFIER_NAME_oe_as2_ms25_urban_burghers_mod: "Chartered Civic Guild Councils"
 STATIC_MODIFIER_DESC_oe_as2_ms25_urban_burghers_mod: "Municipal guilds and civic councils anchor Roman administration in newly integrated cities at modest stipend cost."
 STATIC_MODIFIER_NAME_oe_as2_ms25_hellenic_curriculum_mod: "Strict Hellenic-Roman Curriculum"
 STATIC_MODIFIER_DESC_oe_as2_ms25_hellenic_curriculum_mod: "Mandatory imperial grammar schools and legal academies hasten cultural convergence despite conservative aristocratic grumbling."
 STATIC_MODIFIER_NAME_oe_as2_ms50_civic_franchise_mod: "New Constitutio Antoniniana"
 STATIC_MODIFIER_DESC_oe_as2_ms50_civic_franchise_mod: "Extending imperial citizenship to loyal provincial freeholders lowers resentment and bridges bilingual courts at a slight tax concession."
 STATIC_MODIFIER_NAME_oe_as2_ms50_loyal_cities_mod: "Loyal Municipality Tax Immunities"
 STATIC_MODIFIER_DESC_oe_as2_ms50_loyal_cities_mod: "Temporary fiscal immunities win over civic elites and stimulate urban commerce across bilingual provinces."
 STATIC_MODIFIER_NAME_oe_as2_ms50_military_colonists_mod: "Veteran Frontier Land Grants"
 STATIC_MODIFIER_DESC_oe_as2_ms50_military_colonists_mod: "Retired soldiers settled along provincial highways reinforce imperial control and spread camp speech into the countryside."
 STATIC_MODIFIER_NAME_oe_as2_ms75_roman_integration_mod: "Ecumenical Romanitas Charter"
 STATIC_MODIFIER_DESC_oe_as2_ms75_roman_integration_mod: "Provincial law, rhetoric, and administration have matured into a self-sustaining civic Roman commonwealth."
 STATIC_MODIFIER_NAME_oe_as2_ms75_federative_romanitas_mod: "Federative Commonwealth of Provinces"
 STATIC_MODIFIER_DESC_oe_as2_ms75_federative_romanitas_mod: "Autonomous provincial assemblies swear enduring allegiance to the Augustus under a pluralistic Roman legal canopy."
 STATIC_MODIFIER_NAME_oe_as2_ms75_frontier_dividend_mod: "Provincial Reconstruction Dividend"
 STATIC_MODIFIER_DESC_oe_as2_ms75_frontier_dividend_mod: "Surplus integration endowments are reinvested into roads, granaries, and frontier settlement corridors."
 STATIC_MODIFIER_NAME_oe_as2_romanization_extension_mod: "Funded Romanization Extension"
 STATIC_MODIFIER_DESC_oe_as2_romanization_extension_mod: "Dedicated imperial treasuries sustain provincial academies, highways, and identity movements across newly pacified frontiers."
 STATIC_MODIFIER_NAME_oe_as2_frontier_persia_synthesis_mod: "Seleucid-Mesopotamian Frontier Synthesis"
 STATIC_MODIFIER_DESC_oe_as2_frontier_persia_synthesis_mod: "Greco-Persian chanceries along the Euphrates and Zagros blend civic Hellenic law with ancient Mesopotamian and Iranian traditions."
 STATIC_MODIFIER_NAME_oe_as2_frontier_pontic_synthesis_mod: "Caucasian & Pontic Steppe Synthesis"
 STATIC_MODIFIER_DESC_oe_as2_frontier_pontic_synthesis_mod: "Pontic ports, Caucasian highland principalities, and steppe border garrisons are bound into the imperial frontier order."
 STATIC_MODIFIER_NAME_oe_as2_consolidation_truce_mod: "Imperial Consolidation Pause"
 STATIC_MODIFIER_DESC_oe_as2_consolidation_truce_mod: "Temporarily halting active cultural drives calms provincial unrest and restores fiscal balance."
 STATIC_MODIFIER_NAME_oe_as2_frontier_homestead_loc_mod: "Imperial Frontier Homesteads"
 STATIC_MODIFIER_DESC_oe_as2_frontier_homestead_loc_mod: "State-issued land deeds, seed grain, and tools turn sparse frontier soil into loyal agricultural settlements."
 STATIC_MODIFIER_NAME_oe_as2_chi_gaituguiliu_mod: "Gaituguiliu Direct Circuit Rule"
 STATIC_MODIFIER_DESC_oe_as2_chi_gaituguiliu_mod: "Replacing hereditary border chieftains with rotating imperial magistrates extends direct law and census rolls into the southwest."
 STATIC_MODIFIER_NAME_oe_as2_chi_tusi_mod: "Hereditary Tusi Autonomy Charters"
 STATIC_MODIFIER_DESC_oe_as2_chi_tusi_mod: "Recognizing native frontier chiefs preserves peace in mountain marches and secures loyal irregular auxiliaries."
 STATIC_MODIFIER_NAME_oe_as2_chi_dual_tusi_mod: "Dual-Track Frontier Circuits"
 STATIC_MODIFIER_DESC_oe_as2_chi_dual_tusi_mod: "Shared jurisdictions pair imperial circuit intendants with local hereditary elders for measured integration."
 STATIC_MODIFIER_NAME_oe_as2_chi_keju_academies_mod: "Imperial Examinations & Frontier Academies"
 STATIC_MODIFIER_DESC_oe_as2_chi_keju_academies_mod: "Reserved examination quotas and prefectural Confucian academies draw frontier gentry into the imperial civil service."
 STATIC_MODIFIER_NAME_oe_as2_chi_multilingual_classics_mod: "Multilingual Imperial Translation Bureau"
 STATIC_MODIFIER_DESC_oe_as2_chi_multilingual_classics_mod: "Parallel editions of state classics and law codes bridge Han, Mongol, Manchu, Tibetan, and southwestern elites."
 STATIC_MODIFIER_NAME_oe_as2_chi_huguang_resettlement_mod: "Huguang-to-Sichuan Resettlement Edict"
 STATIC_MODIFIER_DESC_oe_as2_chi_huguang_resettlement_mod: "Tax holidays and road-station grain depots channel dense river-basin farmers into war-scarred or sparse interior basins."
 STATIC_MODIFIER_NAME_oe_as2_chi_tuntian_mod: "Frontier Tuntian Military Colonies"
 STATIC_MODIFIER_DESC_oe_as2_chi_tuntian_mod: "Hereditary garrison-farmers plow border valleys and guard passes, cutting supply strain while anchoring imperial presence."
 STATIC_MODIFIER_NAME_oe_as2_chi_merchant_colonists_mod: "Guild Merchant Resettlement Concessions"
 STATIC_MODIFIER_DESC_oe_as2_chi_merchant_colonists_mod: "Salt and tea guild syndicates finance frontier roads and market towns in exchange for commercial privileges."
 STATIC_MODIFIER_NAME_oe_as2_tur_millet_mod: "Imperial Millet Autonomy Charter"
 STATIC_MODIFIER_DESC_oe_as2_tur_millet_mod: "Confessional communities manage their own civil courts and charities under the Sultan's protection, securing fiscal revenue and civic peace."
 STATIC_MODIFIER_NAME_oe_as2_tur_centralization_mod: "Centralized Kadi & Anatolian Chancery"
 STATIC_MODIFIER_DESC_oe_as2_tur_centralization_mod: "Uniform imperial judicial circuits extend central Ottoman law directly into provincial towns."
 STATIC_MODIFIER_NAME_oe_as2_tur_kanun_mod: "Balanced Imperial Kanunname"
 STATIC_MODIFIER_DESC_oe_as2_tur_kanun_mod: "Pragmatic provincial codes reconcile customary local dues with central imperial administration."
 STATIC_MODIFIER_NAME_oe_as2_tur_devshirme_mod: "Enderun Palace School & Devshirme Cadre"
 STATIC_MODIFIER_DESC_oe_as2_tur_devshirme_mod: "Provincial youths trained in the palace academy form an elite standing corps and meritocratic bureaucracy loyal solely to the Porte."
 STATIC_MODIFIER_NAME_oe_as2_tur_timariot_mod: "Provincial Timariot & Sipahi Fiefs"
 STATIC_MODIFIER_DESC_oe_as2_tur_timariot_mod: "Expanding cavalry land grants empowers provincial notables to police rural districts and field swift horsemen."
 STATIC_MODIFIER_NAME_oe_as2_tur_volunteer_corps_mod: "Salaried Imperial Volunteer Regiments"
 STATIC_MODIFIER_DESC_oe_as2_tur_volunteer_corps_mod: "Replacing coercive levies with paid volunteer regiments eases provincial grievances at greater treasury expense."
 STATIC_MODIFIER_NAME_oe_as2_tur_kayser_synthesis_mod: "Kayser-i Rum Cosmopolitan Synthesis"
 STATIC_MODIFIER_DESC_oe_as2_tur_kayser_synthesis_mod: "Claiming the twin mantles of Islamic sovereignty and Roman imperial statecraft turns the Porte into a cosmopolitan crossroads."
 STATIC_MODIFIER_NAME_oe_as2_tur_gazi_assim_mod: "Gazi Heartland Consolidation"
 STATIC_MODIFIER_DESC_oe_as2_tur_gazi_assim_mod: "Religious endowments and Turkish-Islamic urban foundations steadily reshape borderlands around the core imperial identity."
 STATIC_MODIFIER_NAME_oe_as2_tur_med_guilds_mod: "Mediterranean Bazaar & Guild Enclaves"
 STATIC_MODIFIER_DESC_oe_as2_tur_med_guilds_mod: "Protected port quarters and artisan guilds draw skilled craftsmen and maritime wealth across the Levant and Balkans."
 STATIC_MODIFIER_NAME_oe_as2_rus_cossack_hosts_mod: "Autonomous Cossack Frontier Hosts"
 STATIC_MODIFIER_DESC_oe_as2_rus_cossack_hosts_mod: "Tax-exempt Cossack hosts settle steppe riverbanks, screening the frontier and opening wild fields to Slavic settlement."
 STATIC_MODIFIER_NAME_oe_as2_rus_crown_garrisons_mod: "Crown Frontier Streltsy Garrisons"
 STATIC_MODIFIER_DESC_oe_as2_rus_crown_garrisons_mod: "Salaried crown regiments and voivode forts enforce strict central obedience along newly annexed rivers."
 STATIC_MODIFIER_NAME_oe_as2_rus_abatis_settlers_mod: "Abatis Line Peasant Colonization"
 STATIC_MODIFIER_DESC_oe_as2_rus_abatis_settlers_mod: "Fortified timber lines shield black-earth homesteads, steadily multiplying frontier harvests and villages."
 STATIC_MODIFIER_NAME_oe_as2_rus_yasak_treaties_mod: "Fair Yasak Fur Treaties"
 STATIC_MODIFIER_DESC_oe_as2_rus_yasak_treaties_mod: "Regulated fur-tribute compacts win cooperation from Ural and Siberian peoples while enriching crown trade."
 STATIC_MODIFIER_NAME_oe_as2_rus_siberian_missions_mod: "Siberian River Missions & Ostrogs"
 STATIC_MODIFIER_DESC_oe_as2_rus_siberian_missions_mod: "Monastic outposts and timber ostrogs anchor Orthodox parishes and Slavic river settlements across the taiga."
 STATIC_MODIFIER_NAME_oe_as2_rus_stroganov_charter_mod: "Stroganov Frontier Charter"
 STATIC_MODIFIER_DESC_oe_as2_rus_stroganov_charter_mod: "Merchant-magnate concessions build saltworks, iron foundries, and river convoys across the Urals."
 STATIC_MODIFIER_NAME_oe_as2_rus_service_assim_mod: "Imperial Service-Nobility Charter"
 STATIC_MODIFIER_DESC_oe_as2_rus_service_assim_mod: "State service ranks unify provincial gentry under Russian chancery speech, orthography, and legal administration."
 STATIC_MODIFIER_NAME_oe_as2_rus_coopted_elites_mod: "Co-opted Imperial Dvorianstvo"
 STATIC_MODIFIER_DESC_oe_as2_rus_coopted_elites_mod: "Tatar murzas, Baltic barons, and frontier lords enter the imperial nobility while keeping local estates and customs."
 STATIC_MODIFIER_NAME_oe_as2_rus_heartland_reform_mod: "Heartland Legal & Agrarian Code"
 STATIC_MODIFIER_DESC_oe_as2_rus_heartland_reform_mod: "Streamlined provincial courts and grain surveys strengthen the core fiscal base of the Tsardom."
 STATIC_MODIFIER_NAME_oe_as2_per_chancery_mod: "Imperial Persianate Diwan & Madrasas"
 STATIC_MODIFIER_DESC_oe_as2_per_chancery_mod: "Refined chancery prose, architecture, and endowed colleges radiate high court culture from Khorasan to Hindustan."
 STATIC_MODIFIER_NAME_oe_as2_per_multilingual_court_mod: "Multilingual Turko-Persian & Indic Letters"
 STATIC_MODIFIER_DESC_oe_as2_per_multilingual_court_mod: "Court patrons translate Sanskrit, Turkic, Arabic, and Persian classics side by side, knitting diverse elites together."
 STATIC_MODIFIER_NAME_oe_as2_per_waqf_guilds_mod: "Urban Waqf & Scribal Guild Patronage"
 STATIC_MODIFIER_DESC_oe_as2_per_waqf_guilds_mod: "Endowed civic trusts and bazaar guilds sustain artisans, calligraphers, and urban order."
 STATIC_MODIFIER_NAME_oe_as2_per_sulh_mod: "Sulh-i-Kul Universal Conciliation"
 STATIC_MODIFIER_DESC_oe_as2_per_sulh_mod: "Peace with all faiths and peoples binds vast multi-religious realms together in prosperity, despite conservative clerical dissent."
 STATIC_MODIFIER_NAME_oe_as2_per_orthoprax_mod: "Orthoprax State Patronage"
 STATIC_MODIFIER_DESC_oe_as2_per_orthoprax_mod: "State-backed jurists and preachers enforce doctrinal uniformity and brisk cultural integration."
 STATIC_MODIFIER_NAME_oe_as2_per_ibadat_mod: "Ibadat Khana Scholarly Dialogues"
 STATIC_MODIFIER_DESC_oe_as2_per_ibadat_mod: "Open royal debates among philosophers, jurists, and astronomers foster inquiry and civic harmony."
 STATIC_MODIFIER_NAME_oe_as2_per_mansab_compact_mod: "Qizilbash & Zamindar Provincial Compact"
 STATIC_MODIFIER_DESC_oe_as2_per_mansab_compact_mod: "Integrating tribal chiefs and regional landholders into graded imperial ranks turns potential rebels into loyal cavalry commanders."
 STATIC_MODIFIER_NAME_oe_as2_per_ghulam_admin_mod: "Salaried Ghulam Crown Administration"
 STATIC_MODIFIER_DESC_oe_as2_per_ghulam_admin_mod: "Replacing hereditary tax-farmers with salaried crown officials raises fiscal yield and central reach at aristocratic expense."
 STATIC_MODIFIER_NAME_oe_as2_per_caravanserai_mod: "Royal Caravanserai & Guild Network"
 STATIC_MODIFIER_DESC_oe_as2_per_caravanserai_mod: "Fortified road-inns and chartered merchant quarters weave caravan cities from Isfahan to Delhi into one thriving market."
 AUTO_MODIFIER_NAME_oe_as2_auto_track_a_civic_corridor: "Imperial Civic Integration Corridor"
 AUTO_MODIFIER_DESC_oe_as2_auto_track_a_civic_corridor: "Connected roads, firm local control, and educational or administrative institutions under Active Civic Assimilation accelerate cultural integration."
 AUTO_MODIFIER_NAME_oe_as2_auto_track_b_foederati_metropolis: "Cosmopolitan Foederati Metropolis"
 AUTO_MODIFIER_DESC_oe_as2_auto_track_b_foederati_metropolis: "An accepted minority city thriving under Cosmopolitan Foederati charters boosts local production, trade, and reliable manpower."
 AUTO_MODIFIER_NAME_oe_as2_auto_foederati_rural_harmony: "Foederati Rural Autonomy"
 AUTO_MODIFIER_DESC_oe_as2_auto_foederati_rural_harmony: "Accepted minority villages retain customary governance, lowering separatism and strengthening provincial levies while slowing assimilation."
 AUTO_MODIFIER_NAME_oe_as2_auto_unrest_faith_resistance: "Provincial Cultural Resistance"
 AUTO_MODIFIER_DESC_oe_as2_auto_unrest_faith_resistance: "Low satisfaction or an unaligned local faith with weak central control causes provincial communities to resist forced cultural assimilation."
