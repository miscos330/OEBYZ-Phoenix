l_english:
 oe_peasants_irrigation_commons: "Communal Irrigation"
 oe_peasants_irrigation_commons_desc: "A channel passes one household and nourishes an entire village. Recognize the villagers' right to maintain their canals, mills and embankments, arranging labor and water among themselves so that #Y common work#! sustains their fields."
 oe_peasants_reclamation_grants: "Grants for Reclamation"
 oe_peasants_reclamation_grants_desc: "Weeds must not forever claim the fields once crossed by the plough. Offer seed, tools and a secure settlement to those willing to reclaim them. Let the displaced return and new households take root, until #Y abandoned fields bear grain again#!."
 oe_peasants_imperial_petition: "Right of Imperial Petition"
 oe_peasants_imperial_petition_desc: "Those beyond the palace gates are Romans under the Emperor's protection. Allow villages to petition together against encroachment, extortion and injustice. While #Y the Empire is willing to listen#!, the afflicted need not seek justice through arms alone."
 oe_burghers_golden_horn_charter: "Golden Horn Merchant Charter"
 oe_burghers_golden_horn_charter_desc: "Not every mast in the Golden Horn should bear a foreign banner. Grant Roman merchants a charter to organize fleets, establish trading houses and deal with distant suppliers, so that #Y the Empire's own merchants#! may share in its harbor's prosperity."
 oe_burghers_eastern_entrepot: "Eastern Entrepot Rights"
 oe_burghers_eastern_entrepot_desc: "Spices, dyes and costly fabrics arrive through long trading routes before departing our warehouses for distant shores. Recognize the merchants' #Y right of transit and re-export#!, making Rome a meeting place for the commerce of many lands.\n\nBurghers Satisfaction Equilibrium +5%, Burghers Power +50%, Export Efficiency +5%, Trade Range +50%, and Monthly Progress towards Plutocracy +0.1."
 oe_burghers_caravan_hostels: "Merchant Hostel Rights"
 oe_burghers_caravan_hostels_desc: "A charter alone cannot carry a caravan across the mountains. Permit merchant companies to maintain hostels and warehouses along the roads, supplying fodder and shelter so that their trains find #Y dependable resting places#! between our towns."
 oe_burghers_straits_convoys: "Straits Convoy Contracts"
 oe_burghers_straits_convoys_desc: "The waters leading to our ports must be watched by sail and oar. Recognize contracts through which shipowners fund escorts, gather convoys and share news of the sea. #Y Safe passage#! sustains both the merchants and the imperial capital."
 oe_burghers_shipyard_contracts: "Shipyard Contracts"
 oe_burghers_shipyard_contracts_desc: "The sound of axes in the yard promises sails upon the sea. Allow shipowners and shipwrights' guilds to undertake imperial contracts, assembling craftsmen and timber themselves so that #Y practiced skill#! is not wasted in delay."
 oe_clergy_athos_autonomy: "Autonomy of the Holy Mountain"
 oe_clergy_athos_autonomy_desc: "Let the clamor of the world cease at the gates of the Holy Mountain. Recognize the Athonite communities' right to order their own affairs, protecting their prayer, fasting and common life, so that #Y the lamps of intercession#! may endure beyond worldly quarrels."
 oe_clergy_parish_relief: "Parish Poor Relief"
 oe_clergy_parish_relief_desc: "The church door should not open to the poor only for worship. Permit parishes to gather alms, distribute meals and shelter the destitute, answering hardship with #Y mercy made tangible#! and giving the people somewhere to turn in their distress."
 oe_clergy_episcopal_visitations: "Episcopal Visitations"
 oe_clergy_episcopal_visitations_desc: "The pastoral staff must reach beyond the splendid churches of our towns. Support bishops visiting distant parishes, repairing places of worship, appointing clergy and teaching the faithful, so that #Y the words of the true faith#! reach the villages and frontiers."
 oe_clergy_public_liturgy: "Sermons and Public Liturgy"
 oe_clergy_public_liturgy_desc: "Bells gather the people, sermons instruct their hearts and festival processions bring strangers side by side. Entrust public preaching and solemn rites to the Church, sustaining trust and order among the imperial subjects through #Y common prayer#!."
 oe_clergy_episcopal_council: "Episcopal Deliberation"
 oe_clergy_episcopal_council_desc: "The grievances and disputes of our dioceses must not be lost in scattered correspondence. Allow the bishops to deliberate together and present their knowledge before the throne, making #Y the counsel of many shepherds#! a help in imperial affairs."
 oe_clergy_patriarchal_envoys: "Patriarchal Envoys"
 oe_clergy_patriarchal_envoys_desc: "Some doors closed to arms will admit a bearer of the Patriarch's letters. Recognize his envoys in mediation and negotiation, using shared faith, ceremony and learning to approach other realms. Let #Y words of concord#! arrive before the drums of war."
 oe_peasants_village_watch: "Village Watch"
 oe_peasants_village_watch_desc: "When the alarm sounds, our villages should not depend solely on distant armies. Permit villagers to organize watches, keep arms and muster beneath their communal banners, making #Y the defense of their homes#! a shared duty of free subjects.\n\nIncompatible with all four levels of #Y Rise of the Landlords#!."
