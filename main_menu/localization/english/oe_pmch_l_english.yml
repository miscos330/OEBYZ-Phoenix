 STATIC_MODIFIER_NAME_oe_pmch_mod_tribute_horse_market:0 "Central Plains Horse-Market Tribute"
 STATIC_MODIFIER_DESC_oe_pmch_mod_tribute_horse_market:0 "Tributary horse markets bring ironware, silk, and frontier trade grants to steady early tribal finances."
 STATIC_MODIFIER_NAME_oe_pmch_mod_white_mountain_riders:0 "White Mountain Mounted Archery"
 STATIC_MODIFIER_DESC_oe_pmch_mod_white_mountain_riders:0 "Jurchen hunters sharpen mounted archery across forest and frozen river, forging fierce steppe-woodland cavalry."
 STATIC_MODIFIER_NAME_oe_pmch_mod_fushun_sable_monopoly:0 "Hetu Ala Ginseng & Sable Exchange"
 STATIC_MODIFIER_DESC_oe_pmch_mod_fushun_sable_monopoly:0 "Controlling wild ginseng, sable pelts, and iron trade at Fushun builds the war chest of Jianzhou's rise."
 STATIC_MODIFIER_NAME_oe_pmch_mod_haixi_compact:0 "Hulun Haixi Confederated Trade"
 STATIC_MODIFIER_DESC_oe_pmch_mod_haixi_compact:0 "Intermarriage and shared grain-fur fairs bind the Haixi walled towns into a steadier Jurchen network."
 STATIC_MODIFIER_NAME_oe_pmch_mod_thirteen_armors:0 "Thirteen Suits of Armor"
 STATIC_MODIFIER_DESC_oe_pmch_mod_thirteen_armors:0 "Rising from thirteen suits of ancestral armor to unify Jianzhou and Hulun steels Banner resolve and siege momentum."
 STATIC_MODIFIER_NAME_oe_pmch_mod_eight_banners_drill:0 "Eight Banners Niru Mobilization"
 STATIC_MODIFIER_DESC_oe_pmch_mod_eight_banners_drill:0 "Three-hundred-household Niru companies organized into Eight Banners unite war and administration, bolstered by the new Manchu script."
 STATIC_MODIFIER_NAME_oe_pmch_mod_clan_confederation:0 "Four-Banner Clan Confederation"
 STATIC_MODIFIER_DESC_oe_pmch_mod_clan_confederation:0 "Preserving Beile clan autonomy steadies tribal cohesion while moderating the pace of full centralization."
 STATIC_MODIFIER_NAME_oe_pmch_mod_sarhu_lightning:0 "1619 Sarhu Lightning Victory"
 STATIC_MODIFIER_DESC_oe_pmch_mod_sarhu_lightning:0 "'Let them come by many roads; I will meet them on one!' Interior-line concentration shatters converging armies and flips Liaodong."
 STATIC_MODIFIER_NAME_oe_pmch_mod_hetu_ala_bastion:0 "Hetu Ala Mountain Defenses"
 STATIC_MODIFIER_DESC_oe_pmch_mod_hetu_ala_bastion:0 "Fortified ridges around Hetu Ala bleed invading supply trains and preserve Banner strength."
 STATIC_MODIFIER_NAME_oe_pmch_mod_ujen_cooha_corps:0 "Ujen Cooha Heavy Artillery Banners"
 STATIC_MODIFIER_DESC_oe_pmch_mod_ujen_cooha_corps:0 "Defecting gunners and master founders form the Ujen Cooha heavy artillery banners, overcoming fortified walls with massed Hongyi siege batteries."
 STATIC_MODIFIER_NAME_oe_pmch_mod_mongol_banners:0 "Mongol Eight Banners & Imperial Kinship"
 STATIC_MODIFIER_DESC_oe_pmch_mod_mongol_banners:0 "Khorchin alliances and Mongol Eight Banners expand elite cavalry numbers while anchoring Inner Asian suzerainty."
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_offense_base:0 "Shanhaiguan Pass: Banner Siege Pressure"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_offense_base:0 "Banner hosts press hard along the Liaoxi corridor, testing the Ming fortresses before Shanhaiguan."
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_offense_high:0 "Shanhaiguan Pass: Ujen Cooha Breakthrough"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_offense_high:0 "Full Eight Banners mobilization backed by Ujen Cooha heavy siege trains pounds Liaoxi bastions toward a decisive breakthrough."
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_defense_base:0 "Shanhaiguan Pass: Great Wall Defense"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_defense_base:0 "Central Plains garrisons man the Great Wall and Liaoxi ramparts against the Banner advance."
 STATIC_MODIFIER_NAME_oe_pmch_mod_pass_defense_high:0 "Shanhaiguan Pass: Guanning Hongyi Iron Wall"
 STATIC_MODIFIER_DESC_oe_pmch_mod_pass_defense_high:0 "Layered Hongyi artillery bastions across Ningyuan and Shanhaiguan turn the Liaoxi corridor into an iron wall."
 STATIC_MODIFIER_NAME_oe_pmch_mod_ningjin_triumph:0 "Triumph of Ningyuan-Jinzhou"
 STATIC_MODIFIER_DESC_oe_pmch_mod_ningjin_triumph:0 "Holding the Guanning line across fifteen bitter years seals a legendary defensive victory and cements imperial prestige."
 STATIC_MODIFIER_NAME_oe_pmch_mod_northern_pivot:0 "Northern & Korean Strategic Pivot"
 STATIC_MODIFIER_DESC_oe_pmch_mod_northern_pivot:0 "Checked before Shanhaiguan, the Manchu state pivots toward hegemony across Korea, the Amur, and northern Inner Asia."
 STATIC_MODIFIER_NAME_oe_pmch_mod_liaodong_hushi_accord:0 "Great Wall Partition & Liaodong Trade Peace"
 STATIC_MODIFIER_DESC_oe_pmch_mod_liaodong_hushi_accord:0 "Exhausted rivals formalize a border settlement along the Wall, reopening lucrative horse, silk, and ginseng markets across Liaodong."
 STATIC_MODIFIER_NAME_oe_pmch_mod_songjin_siege:0 "Songshan-Jinzhou Siege Train"
 STATIC_MODIFIER_DESC_oe_pmch_mod_songjin_siege:0 "Massed Hongyi siege guns and deep entrenchments grind down the fortresses of Songshan and Jinzhou."
 STATIC_MODIFIER_NAME_oe_pmch_mod_qing_dyarchy:0 "Great Qing: Manchu-Han Dyarchy"
 STATIC_MODIFIER_DESC_oe_pmch_mod_qing_dyarchy:0 "Enthroned in Beijing under the Great Qing name, conciliatory Manchu-Han dyarchy calms Jiangnan and speeds imperial integration."
 STATIC_MODIFIER_NAME_oe_pmch_mod_qing_martial_garrison:0 "Great Qing: Banner Garrison Supremacy"
 STATIC_MODIFIER_DESC_oe_pmch_mod_qing_martial_garrison:0 "Proclaiming Great Qing while fortifying Banner garrison enclaves preserves fierce martial discipline at the price of sharper provincial friction."
 STATIC_MODIFIER_NAME_oe_pmch_mod_lifan_tanding:0 "Lifan Yuan & Tan Ding Ru Mu"
 STATIC_MODIFIER_DESC_oe_pmch_mod_lifan_tanding:0 "The Lifan Yuan coordinates Mongolia, Tibet, and Xinjiang while merging head taxes into land assessments unleashes demographic and fiscal growth."
 STATIC_MODIFIER_NAME_oe_pmch_mod_western_governorships:0 "Western Regions Military Governorships"
 STATIC_MODIFIER_DESC_oe_pmch_mod_western_governorships:0 "Military governorships and frontier farming garrisons anchor direct control and manpower across Inner Asia."
 STATIC_MODIFIER_NAME_oe_pmch_mod_kyakhta_fur_road:0 "Nerchinsk & Kyakhta Caravan Trade"
 STATIC_MODIFIER_DESC_oe_pmch_mod_kyakhta_fur_road:0 "Fixed Amur borders and regulated Kyakhta tea-for-fur caravans bring lasting peace and overland trade profits along the Siberian frontier."
 STATIC_MODIFIER_NAME_oe_pmch_mod_amur_bastion:0 "Amur & Albazin Frontier Bastions"
 STATIC_MODIFIER_DESC_oe_pmch_mod_amur_bastion:0 "Riverine flotillas and timber-stone forts along the Amur guard the ancestral Manchurian homeland against northern encroachment."
 STATIC_MODIFIER_NAME_oe_pmch_mod_cohong_canton:0 "Canton Cohong Thirteen Factories"
 STATIC_MODIFIER_DESC_oe_pmch_mod_cohong_canton:0 "Channeling maritime commerce through Canton's licensed Cohong merchants delivers steady customs bullion and calm ports while slowing foreign institutional diffusion."
 STATIC_MODIFIER_NAME_oe_pmch_mod_maritime_qing_opening:0 "Imperial Maritime Opening & Modern Navy"
 STATIC_MODIFIER_DESC_oe_pmch_mod_maritime_qing_opening:0 "Opening coastal customs houses, backing Nanyang merchant fleets, and commissioning modern warships propel research and sea power."
 STATIC_MODIFIER_NAME_oe_pmch_mod_modern_banner_army:0 "Modernized Firearms Banners & Imperial Science"
 STATIC_MODIFIER_DESC_oe_pmch_mod_modern_banner_army:0 "Uniting Ujen Cooha siege ordnance, flintlock volley tactics, and imperial observatory science forges Asia's preeminent modern military power."
 STATIC_MODIFIER_NAME_oe_pmch_mod_banner_commercial_reform:0 "Bannerman Civilian Transition & Green Standard Reform"
 STATIC_MODIFIER_DESC_oe_pmch_mod_banner_commercial_reform:0 "Releasing surplus bannermen into commerce and trimming bloated Green Standard rolls cures chronic treasury drain and lifts domestic industry."
 STATIC_MODIFIER_NAME_oe_pmch_mod_banner_martial_purge:0 "Imperial Purge of Banner Discipline"
 STATIC_MODIFIER_DESC_oe_pmch_mod_banner_martial_purge:0 "Strict inspections and generous stipends restore the fighting edge of metropolitan Banner regiments at steep fiscal cost."
 oe_pmch_ref_eight_banner_state:0 "Eight Banners Military-Civil State"
 oe_pmch_ref_eight_banner_state_desc:0 "Supersedes clan divisions with the Eight Banners Niru system, unifying civic households and military mobilization while elevating heavy cavalry and siege artillery."
 oe_pmch_ref_dual_inner_asian_empire:0 "Lifan Yuan Inner Asian Dual Empire"
 oe_pmch_ref_dual_inner_asian_empire_desc:0 "Pairs Chinese provincial bureaucracy with the Lifan Yuan's stewardship over Mongolia, Tibet, and Xinjiang, widening cultural capacity and slashing distance-from-capital control loss."
 oe_pmch_banner_governance_law:0 "Banner & Dual-Empire Governance Law"
 oe_pmch_banner_governance_law_desc:0 "Sets the constitutional balance of the Manchu realm between martial Banner primacy, Manchu-Han administrative dyarchy, and Cohong maritime opening."
 oe_pmch_pol_manchu_martial_primacy:0 "Manchu-Mongol Martial Primacy"
 oe_pmch_pol_manchu_martial_primacy_desc:0 "Preserves ancestral mounted archery and Banner military privileges, boosting heavy cavalry power, discipline, and tribal loyalty."
 oe_pmch_pol_manchu_han_dyarchy:0 "Manchu-Han Administrative Dyarchy"
 oe_pmch_pol_manchu_han_dyarchy_desc:0 "Appoints Manchu and Han officials side by side across ministries while championing civil examinations to lift tax revenue, integration, and administrative control."
 oe_pmch_pol_cohong_maritime_opening:0 "Cohong & Maritime Customs Opening"
 oe_pmch_pol_cohong_maritime_opening_desc:0 "Modernizes Canton's Cohong factories and coastal customs, converting tea, silk, and porcelain exports into bullion and empirical technology."
 oe_pmch_banner_drillground:0 "Eight Banners Drillground & Ujen Cooha Foundry"
 oe_pmch_banner_drillground_desc:0 "Combines Eight Banners cavalry drillgrounds, Ujen Cooha heavy cannon foundries, and garrison horse-market commissariats to lift local manpower, control, output, and merchant capacity."
 oe_pmch_banner_drillground_maint:0 "Banner Drillground & Foundry Upkeep"
 oe_pmch_banner_heavy_cavalry:0 "Eight Banners Bayara Heavy Cavalry"
 oe_pmch_banner_heavy_cavalry_desc:0 "Elite Bayara guard cavalry drawn from the Eight Banners, clad in layered brigandine and iron mail to combine devastating composite-bow volleys with shock lance charges."
 oe_pmch_ujen_cooha_artillery:0 "Ujen Cooha Heavy Cannon Artillery"
 oe_pmch_ujen_cooha_artillery_desc:0 "Hong Taiji's dedicated Ujen Cooha heavy artillery banners operating massive Hongyi siege batteries engineered to smash the stone ramparts of Liaoxi and Shanhaiguan."
 oe_pmch_adv_ujen_cooha:0 "Ujen Cooha Ordnance & Bayara Doctrine"
 oe_pmch_adv_ujen_cooha_desc:0 "Integrates Bayara heavy cavalry shock assaults with Ujen Cooha Hongyi siege batteries, unlocking both elite Manchu regiments."
 oe_pmch_dec_organize_eight_banners.title:0 "Organize the Eight Banners (Niru)"
 oe_pmch_dec_organize_eight_banners.desc:0 "Register households into three-hundred-man Niru companies across the Eight Banners, raising Banner mobilization, discipline, and manpower reserves."
 oe_pmch_dec_organize_eight_banners.a:0 "Muster the Niru and Raise the Eight Banners"
 oe_pmch_dec_organize_eight_banners_tt:0 "Raises Eight Banners mobilization by +25 (max 100) and grants a 20-year Banner drill modifier."
 oe_pmch_dec_raise_ujen_cooha.title:0 "Raise the Ujen Cooha Heavy Cannon Banners"
 oe_pmch_dec_raise_ujen_cooha.desc:0 "Recruit defecting gunners and master founders to expand the Ujen Cooha artillery banners for breaching Liaoxi and Shanhaiguan."
 oe_pmch_dec_raise_ujen_cooha.a:0 "Cast Hongyi Cannon and Expand the Ujen Cooha"
 oe_pmch_dec_raise_ujen_cooha_tt:0 "Raises Ujen Cooha tier by +1 (max 4), grants a 25-year heavy artillery bonus, and pushes breach pressure if the Shanhaiguan Pass situation is active."
 oe_pmch_dec_establish_lifan_yuan.title:0 "Establish the Lifan Yuan & Enact Tan Ding Ru Mu"
 oe_pmch_dec_establish_lifan_yuan.desc:0 "Found the Lifan Yuan to administer Mongolia, Tibet, and Xinjiang while enacting Tan Ding Ru Mu tax consolidation and Gai Tu Gui Liu across the realm."
 oe_pmch_dec_establish_lifan_yuan.a:0 "Found the Lifan Yuan and Enact Tax Consolidation"
 oe_pmch_dec_establish_lifan_yuan_tt:0 "Shifts dual-rule balance +20 toward imperial integration and grants a 40-year Lifan Yuan & Tan Ding Ru Mu modifier."
 oe_sit_manchu_pass:0 "Battle for Shanhaiguan: The Manchu Pass"
 oe_sit_manchu_pass_desc:0 "Marshaling the Eight Banners and Ujen Cooha heavy siege artillery along the Liaoxi corridor, Manchu armies clash against the Ming or Yuan Hongyi bastions of Ningyuan, Jinzhou, and Shanhaiguan (Funing). Victory through the pass crowns a Great Qing dynasty in Beijing; holding the wall reshapes East Asia for centuries."
 oe_sit_manchu_pass_conquest:0 "Through Shanhaiguan: Mandate of the Great Qing"
 oe_sit_manchu_pass_conquest_desc:0 "Banner forces and Ujen Cooha cannon breach Shanhaiguan and seize Beijing (Dadu), proclaiming the Great Qing while preserving continuous statehood to inaugurate an Inner Asian-Chinese dual empire."
 oe_sit_manchu_pass_repelled:0 "The Guanning Iron Wall Holds"
 oe_sit_manchu_pass_repelled_desc:0 "Central Plains defenders hold the Guanning Hongyi bastions for fifteen years or reclaim Shenyang and Liaoyang, repelling the pass offensive and forcing Manchu armies to pivot north."
 oe_sit_manchu_pass_stalemate:0 "Great Wall Partition & Liaodong Accord"
 oe_sit_manchu_pass_stalemate_desc:0 "Locked in an exhausting deadlock across Liaoxi, both empires formalize a Great Wall frontier treaty and reopen regulated Liaodong horse and silk markets."
 oe_pmch_map_manchu_tt:0 "#G Manchu Eight Banners Contender#!"
 oe_pmch_map_pass_tt:0 "#Y Shanhaiguan-Ningyuan-Dadu Battleground#!"
 oe_pmch_map_defender_tt:0 "#R Central Plains Guanning Defender#!"
 oe_pmch_map_observer_tt:0 "#color_yellow East & North Asian Observers#!"
 oe_pmch.1.title:0 "White Mountain and Black River: Jianzhou, Haixi, and Wild Jurchens"
 oe_pmch.1.desc:0 "Between Changbai's forests and the Songhua and Amur rivers, the Jurchen realms divide into Jianzhou, the four Haixi towns, and the Wild Jurchen clans. Chiefs must choose between tributary horse markets with the Central Plains or hardening mounted archery for regional unification."
 oe_pmch.1.a:0 "Send Tribute Horses for Border Market Grants"
 oe_pmch.1.b:0 "Drill Mounted Archers and Prepare to Unite the Tribes"
 oe_pmch.2.title:0 "Rise of Hetu Ala and the Fushun Horse Markets"
 oe_pmch.2.desc:0 "From the mountain stronghold of Hetu Ala, wild ginseng, sable furs, and river pearls flow into the Fushun horse markets in return for iron and grain. Monopolizing the exchange rapidly fills Jianzhou's war chest, whereas confederated trade compacts court Haixi chiefs."
 oe_pmch.2.a:0 "Monopolize the Fushun Ginseng and Sable Trade"
 oe_pmch.2.b:0 "Forge Trade Compacts with the Haixi Towns"
 oe_pmch.3.title:0 "Thirteen Suits of Armor and the Hulun Four Tribes"
 oe_pmch.3.desc:0 "From thirteen suits of ancestral armor, the Jianzhou banner now looms over Hada, Hoifa, Ula, and Yehe of the Hulun confederation. Swift conquest stamps unrivaled prestige across Manchuria, while marriage diplomacy smooths integration toward forming Manchu."
 oe_pmch.3.a:0 "Subdue the Hulun Four Tribes by Sword and Banner"
 oe_pmch.3.b:0 "Blend Arms with Marriage Alliances Across Hulun"
 oe_pmch.4.title:0 "Founding the Eight Banners (Niru) and the Manchu Script"
 oe_pmch.4.desc:0 "To transcend fractured clan loyalties, the Khan organizes households into three-hundred-man Niru hunting companies grouped into four plain and four bordered Banners—soldiers in war, farmers in peace—while scholars adapt the Mongol alphabet into the Manchu script."
 oe_pmch.4.a:0 "Codify the Eight Banners and Promulgate the Manchu Script"
 oe_pmch.4.b:0 "Retain Four Banners and Clan Council Autonomy"
 oe_pmch.5.title:0 "The Seven Grievances and the 1619 Battle of Sarhu"
 oe_pmch.5.desc:0 "After proclaiming the Seven Grievances, four converging columns march on Hetu Ala. Outnumbered yet operating on interior lines, the Khan vows: 'Let them come by many roads; I will meet them on one!' Concentrated Banner cavalry can shatter each column in detail at Sarhu."
 oe_pmch.5.a:0 "Strike Each Column in Detail at Sarhu"
 oe_pmch.5.b:0 "Hold the Mountain Ridges and Starve Enemy Columns"
 oe_pmch.6.title:0 "Lesson of Ningyuan: Raising the Ujen Cooha Heavy Cannon Banners"
 oe_pmch.6.desc:0 "Bloodied by Ming Hongyi heavy artillery before the stone walls of Ningyuan, the Manchu leadership draws a ruthless lesson: defecting Han officers and master bronze-founders are organized into the Ujen Cooha—the heavy cannon banners built to smash every fortress between Shenyang and Beijing."
 oe_pmch.6.a:0 "Raise the Ujen Cooha Heavy Artillery Banners"
 oe_pmch.6.b:0 "Rely on Armored Bayara Cavalry Raids"
 oe_pmch.7.title:0 "Manchu-Mongol Alliances and the Inner Mongol Banners"
 oe_pmch.7.desc:0 "Khorchin and Chahar lords rally to Shenyang, presenting the storied imperial seal of the steppe. By sealing generational marriage pacts and forming the Mongol Eight Banners, the Manchu throne secures its western flank and unites forest warriors with steppe horsemen."
 oe_pmch.7.a:0 "Found the Mongol Eight Banners and Seal Kinship Pacts"
 oe_pmch.7.b:0 "Fold Southern Steppe Tribes Under Direct Shenyang Oversight"
 oe_pmch.8.title:0 "Storm Over Shanhaiguan: The Pass Awaits"
 oe_pmch.8.desc:0 "Strained by fiscal crisis and frontier war, the Central Plains stakes its survival on the Ningyuan-Shanhaiguan corridor. The Battle for Shanhaiguan situation has begun: shall the Banners batter the Liaoxi forts head-on with heavy cannon, or secretly court disillusioned pass commanders?"
 oe_pmch.8.a:0 "Concentrate Banners and Ujen Cooha to Storm the Pass"
 oe_pmch.8.b:0 "Dispatch Secret Envoys to Turn Guanning Commanders"
 oe_pmch.9.title:0 "Battle of Songshan-Jinzhou and the Heavy Siege Train"
 oe_pmch.9.desc:0 "Smoke shrouds Jinzhou and Ningyuan as the decisive Songshan-Jinzhou campaign unfolds. Unleashing the full Ujen Cooha siege train can shatter the Liaoxi anchor and open Shanhaiguan itself—unless the court prefers a negotiated Great Wall partition and Liaodong trade settlement."
 oe_pmch.9.a:0 "Unleash the Full Ujen Cooha Siege Train at Songshan-Jinzhou"
 oe_pmch.9.b:0 "Propose a Great Wall Partition and Liaodong Trade Accord"
 oe_pmch.10.title:0 "Dragon Over Beijing: Proclaiming the Great Qing"
 oe_pmch.10.desc:0 "Banner standards fly above Shanhaiguan and the walls of Dadu! Solemnly proclaiming the Great Qing dynasty while keeping unbroken statehood, the throne moves to Beijing to claim the Mandate of Heaven. Shall the new order conciliate Han scholar-gentry in Manchu-Han dyarchy, or govern through armed Banner garrisons?"
 oe_pmch.10.a:0 "Proclaim Great Qing in Beijing with Manchu-Han Dyarchy"
 oe_pmch.10.b:0 "Proclaim Great Qing in Beijing with Banner Garrison Supremacy"
 oe_pmch.11.title:0 "Establishing the Lifan Yuan and the Inner Asian Dual Empire"
 oe_pmch.11.desc:0 "From the Changbai coast across the Mongol steppe to Lhasa, Turpan, and Kashgar, governing both China and Inner Asia demands institutional genius. Founding the Lifan Yuan builds a flexible pluralistic dual empire, whereas military governorships impose direct garrison rule."
 oe_pmch.11.a:0 "Institutionalize the Lifan Yuan Dual Empire"
 oe_pmch.11.b:0 "Establish Direct Frontier Military Governorships"
 oe_pmch.12.title:0 "Tan Ding Ru Mu Tax Reform and Gai Tu Gui Liu"
 oe_pmch.12.desc:0 "Merging the centuries-old poll tax permanently into land assessments under Tan Ding Ru Mu frees landless peasants from ruinous head levies, while Gai Tu Gui Liu replaces hereditary southwestern chieftains with imperial magistrates—unlocking explosive demographic and fiscal expansion."
 oe_pmch.12.a:0 "Enact Tan Ding Ru Mu and Gai Tu Gui Liu Nationwide"
 oe_pmch.12.b:0 "Preserve Existing Tax Rolls and Tusi Autonomy"
 oe_pmch.13.title:0 "Nerchinsk and the 1727 Treaty of Kyakhta"
 oe_pmch.13.desc:0 "As Russian pioneers push across Siberia toward the Amur, clashes at Albazin bring both empires to the table. Ratifying the Nerchinsk and Kyakhta treaties secures the northern frontier and opens lucrative tea-for-fur caravan trade, while fortifying the Amur projects iron deterrence."
 oe_pmch.13.a:0 "Sign the Nerchinsk & Kyakhta Frontier Trade Treaties"
 oe_pmch.13.b:0 "Fortify the Amur and Songhua River Garrisons"
 oe_pmch.14.title:0 "Canton Cohong Thirteen Factories or Maritime Opening?"
 oe_pmch.14.desc:0 "European merchantmen crowd Canton (Guangzhou/Panyu) to trade silver for tea, silk, and porcelain. The dynasty faces a fateful eighteenth-century fork: confine foreign commerce to the licensed Cohong Thirteen Factories for stable revenue and calm coasts, or open maritime customs and build a modern battle fleet?"
 oe_pmch.14.a:0 "Route A: Confine Sea Trade to Canton's Cohong Thirteen Factories"
 oe_pmch.14.b:0 "Route B: Open Coastal Customs and Modernize the Imperial Navy"
 oe_pmch.15.title:0 "Astronomical Synthesis and Modernized Banner Firearms"
 oe_pmch.15.desc:0 "Imperial astronomers synthesize Chinese and European cartography while grand councilors study rapid-firing flintlocks and field artillery. Breaking with archaic bow-and-lance orthodoxy, the empire fuses Ujen Cooha ordnance with modern volley drills and scientific academies."
 oe_pmch.15.a:0 "Modernize the Banners with Flintlock Drill and Imperial Science"
 oe_pmch.15.b:0 "Pair Banner Ceremonial Guards with Reformed Coastal Batteries"
 oe_pmch.16.title:0 "The Eight Banners Livelihood Crisis and Green Standard Reform"
 oe_pmch.16.desc:0 "A century after entering the Pass, forbidden from trade or farming yet multiplying fast, Banner households sink into debt while garrison readiness erodes and Green Standard payrolls bloat. Shall the court release surplus bannermen into civilian enterprise or pay heavily to purge military decay?"
 oe_pmch.16.a:0 "Allow Bannermen into Commerce and Streamline the Green Standard"
 oe_pmch.16.b:0 "Fund a Ruthless Purge to Restore Banner Martial Discipline"
 oe_pmch.90.title:0 "Audit Readout: Jurchen/Manchu Eight Banners & Shanhaiguan Status"
 oe_pmch.90.desc:0 "#T Slot 80 · Jurchen/Manchu Eight Banners & Shanhaiguan (oe_pmch_) Telemetry#!\n- Telemetry Source (0 None, 1 Self Host, 2 c:MCH, 3 c:JEC): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_host').GetValue|0]#!\n- Eight Banners Mobilization (0-100) / Ujen Cooha Tier (0-4): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_banners').GetValue|0]#! / #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_ujen').GetValue|0]#!\n- Dual-Rule Axis (-100 Martial Primacy .. +100 Manchu-Han Dyarchy): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_dual').GetValue|0]#!\n- Great Qing Proclaimed (1 = Dynamic QNG Name Active on tag=MCH): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_qing').GetValue|0]#!\n- oe_sit_manchu_pass State (0 Idle, 1 Active, 11 Conquest, 12 Repelled, 13 Stalemate): #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_sit_state').GetValue|0]#!\n- Pass Breach Pressure (0-100) / Months Elapsed / Manchu Events Fired: #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_pressure').GetValue|0]#! / #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_months').GetValue|0]#! / #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_pmch_rd_events').GetValue|0]#!"
 oe_pmch.90.a:0 "Acknowledged (Close Readout)"
 oe_mch_act_banner_vanguard:0 "Mobilize Eight-Banner Vanguard"
 oe_mch_act_banner_vanguard_cd:0 "Mobilize Eight-Banner Vanguard"
 oe_mch_act_banner_vanguard_desc:0 "Commit treasury silver and prestige to concentrate armored Eight-Banner shock columns and siege cannon before Shanhaiguan, gaining manpower, army tradition, 5 years of cavalry and siege power, and raising Pass Breach Pressure by #G +8#!."
