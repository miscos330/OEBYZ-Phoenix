 oe_cel_enfeoffment_law: "Enfeoffment of the Princes"
 oe_cel_enfeoffment_law_desc: "How the throne treats the fiefs of its princes and great servants: hereditary guardians of the frontier, princes sent across the seas, or fiefs divided among heirs until they fade."
 oe_cel_pol_enf_touxia_feudal: "Hereditary Frontier Fiefs"
 oe_cel_pol_enf_touxia_feudal_desc: "The fiefs guard the frontier from father to son and stay loyal to the throne."
 oe_cel_pol_enf_overseas_princes: "Princes Across the Seas"
 oe_cel_pol_enf_overseas_princes_desc: "Princes of the blood are sent to rule distant shores, widening the reach of the throne."
 oe_cel_pol_enf_tui_en_centralize: "Divide and Centralize"
 oe_cel_pol_enf_tui_en_centralize_desc: "Fiefs are divided among all sons until they shrink; the court grows stronger, but the princes grow resentful."
 oe_cel_jimi_duhu_law: "Loose Rein and Protectorates"
 oe_cel_jimi_duhu_law_desc: "How the throne rules its far frontiers: by the loose rein of local custom, by grand protectorates across the seas, or by a court of frontier affairs that treats all peoples alike."
 oe_cel_pol_jimi_classic_tusi: "Rule by Local Custom"
 oe_cel_pol_jimi_classic_tusi_desc: "Local chiefs keep their hereditary offices as long as they send tribute."
 oe_cel_pol_jimi_sihai_duhu: "Protectorates of the Four Seas"
 oe_cel_pol_jimi_sihai_duhu_desc: "Grand protectorates are founded in distant lands; founding one costs less."
 oe_cel_pol_jimi_lifan_huayi: "One Realm of All Peoples"
 oe_cel_pol_jimi_lifan_huayi_desc: "A court of frontier affairs governs the outer peoples, who are counted subjects of the throne like any other."
 oe_cel_gaituguiliu_law: "Pace of Gaituguiliu"
 oe_cel_gaituguiliu_law_desc: "How fast native offices and commissions are replaced by direct rule: gently over generations, in planned stages, or at one stroke."
 oe_cel_pol_gtgl_gradual_charter: "Gentle Charter"
 oe_cel_pol_gtgl_gradual_charter_desc: "Direct rule comes slowly and meets little resistance."
 oe_cel_pol_gtgl_provincial_wave: "Provincial Waves"
 oe_cel_pol_gtgl_provincial_wave_desc: "Direct rule advances province by province at a steady pace."
 oe_cel_pol_gtgl_iron_commandery: "Iron Commanderies"
 oe_cel_pol_gtgl_iron_commandery_desc: "Commanderies replace native rule at one stroke; fastest, but native lords resist more often."
 oe_cel_tianxia_ocean_law: "Land and Sea Under Heaven"
 oe_cel_tianxia_ocean_law_desc: "The throne's policy toward the sea: tribute through licensed ports, treasure fleets trading across the oceans, or land and sea power together."
 oe_cel_pol_ocean_tribute_gate: "Tribute Through Licensed Ports"
 oe_cel_pol_ocean_tribute_gate_desc: "Only licensed tribute ships may enter port; the dignity of the throne is upheld."
 oe_cel_pol_ocean_treasure_hegemony: "Treasure Fleets"
 oe_cel_pol_ocean_treasure_hegemony_desc: "Treasure fleets sail every ocean and trade with every land."
 oe_cel_pol_ocean_continental_pivot: "Land and Sea Together"
 oe_cel_pol_ocean_continental_pivot_desc: "Army and fleet are built up together to master both the continent and the coasts."
