 oe_cel_dec_yuan_kurultai.title: "Great Yuan: Reconvene the Kurultai"
 oe_cel_dec_yuan_kurultai.desc: "Summon the princes of the Golden Lineage to a kurultai and settle their ranks and appanages anew. The princes grow more loyal and the grievances over curbing them cool."
 oe_cel_dec_yuan_kurultai.a: "Convene the kurultai"
 oe_cel_dec_ming_zongren_fu.title: "Ming: Found the Court of the Imperial Clan"
 oe_cel_dec_ming_zongren_fu.desc: "Found a court to keep the register of the imperial clan and fix the princes' stipends. Tribute from the fiefs becomes more reliable and the princes' armies are kept in check."
 oe_cel_dec_ming_zongren_fu.a: "Found the court"
 oe_cel_dec_qing_mengqi.title: "Qing: Organize the Leagues and Banners"
 oe_cel_dec_qing_mengqi.desc: "Organize the submitted Mongol tribes into leagues and banners under hereditary jasags who meet in regular assemblies. With fixed borders the banners cannot easily combine against the throne."
 oe_cel_dec_qing_mengqi.a: "Organize the banners"
 oe_cel_dec_alt_mandate.title: "Accept the Mandate and Found the Dynasty"
 oe_cel_dec_alt_mandate.desc: "We are not the old masters of the Central Plain, yet the Mandate is ours. Shall we take up the rites and institutions of the celestial court entirely, or keep our own tradition and rule as a dual sovereign?"
 oe_cel_dec_alt_mandate.a: "Adopt the celestial order and found a new dynasty"
 oe_cel_dec_alt_mandate.b: "Keep our own tradition as a dual sovereign"
 oe_cel_adv_sihai_duhu: "Founding Protectorates Across the Seas"
 oe_cel_adv_sihai_duhu_desc: "The methods for founding grand protectorates in distant lands; colonial charters can now found grand protectorates."
 oe_cel_adv_tusi_registry: "Registers for Gaituguiliu"
 oe_cel_adv_tusi_registry_desc: "Surveying fields and registering households in newly ruled lands, so that direct rule takes hold sooner."
 oe_cel_adv_kunyu_wanguo: "Map of the Myriad Countries of the World"
 oe_cel_adv_kunyu_wanguo_desc: "Modelled on the world map of 1602, the throne sees the whole world on a single chart for the first time."
