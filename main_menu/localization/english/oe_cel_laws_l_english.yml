 STATIC_MODIFIER_DESC_oe_cel_duhu_supplied_mod: "Money, grain and ships from the throne keep the protectorate's garrison steady."
 STATIC_MODIFIER_NAME_oe_cel_lifan_assembly_mod: "Rewarded at the Assembly"
 STATIC_MODIFIER_DESC_oe_cel_lifan_assembly_mod: "Rewarded by the Son of Heaven at the assembly, this commission keeps quiet for now."
 STATIC_MODIFIER_NAME_oe_cel_kurultai_accord_mod: "Accord of the Kurultai"
 STATIC_MODIFIER_DESC_oe_cel_kurultai_accord_mod: "The kurultai has settled the princes' ranks, and they accept it for now."
 STATIC_MODIFIER_NAME_oe_cel_zongren_fu_mod: "Court of the Imperial Clan"
 STATIC_MODIFIER_DESC_oe_cel_zongren_fu_mod: "The court keeps the imperial clan's register and stipends; the fiefs are better kept in hand."
 STATIC_MODIFIER_NAME_oe_cel_mengqi_banner_mod: "League and Banner"
 STATIC_MODIFIER_DESC_oe_cel_mengqi_banner_mod: "Organized into a league and banners with fixed borders, the tribes cannot easily combine."
 STATIC_MODIFIER_NAME_oe_cel_full_sinicization_mod: "Full Sinicization"
 STATIC_MODIFIER_DESC_oe_cel_full_sinicization_mod: "The new dynasty takes up the rites and institutions of the celestial court entirely."
 STATIC_MODIFIER_NAME_oe_cel_dual_sovereign_mod: "Dual Sovereign"
 STATIC_MODIFIER_DESC_oe_cel_dual_sovereign_mod: "The Son of Heaven keeps the old tradition of his homeland and rules as a dual sovereign."
