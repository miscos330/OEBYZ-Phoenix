# NEW 2026-11-23 v17.0 Module 17.0-C2: Byzantine Strong-Route 5 Conquest Directions & John VII Thessaloniki Epilogue (oe_sre_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v170_byz_finale.py; edit the generator, not this file.
 oe_sre_proclaim_five_theater_triumph.title: "Proclaim the Five-Theater Imperial Triumph"
 oe_sre_proclaim_five_theater_triumph.desc: "With Hispania, Gallia, Britannia, Germania and the Danube Limes, and the Persian-Mesopotamian heartland of Ctesiphon all restored beneath Roman eagles, summon Senate, army, and peoples to celebrate the supreme five-theater triumph."
 oe_sre_proclaim_five_theater_triumph.a: "Ascend the Capitol and the Mese in Eternal Triumph"
 oe_sre_seal_thessaloniki_reconciliation.title: "Seal the Thessaloniki Palaiologan Reconciliation"
 oe_sre_seal_thessaloniki_reconciliation.desc: "Issue a permanent imperial chrysobull enshrining the concord between Constantinople and Thessaloniki, confirming the civic liberties of St. Demetrius' city and closing the era of Palaiologan dynastic civil wars forever."
 oe_sre_seal_thessaloniki_reconciliation.a: "Affix the Purple Signature to the Twin-City Concord"
 STATIC_MODIFIER_NAME_oe_sre_five_theater_triumph_mod: "Five-Theater Imperial Triumph"
 STATIC_MODIFIER_DESC_oe_sre_five_theater_triumph_mod: "From the Pillars of Hercules and Hadrian's Wall to the Rhine, Danube, and the brick vaults of Ctesiphon, Roman banners fly unchallenged across five imperial theaters."
 STATIC_MODIFIER_NAME_oe_sre_thessaloniki_reconciliation_mod: "Thessaloniki Palaiologan Reconciliation"
 STATIC_MODIFIER_DESC_oe_sre_thessaloniki_reconciliation_mod: "Sealed between the Great Palace of Constantinople and the civic council of Thessaloniki, this concord heals decades of Palaiologan rivalry and binds Macedonia firmly to the throne."
 STATIC_MODIFIER_NAME_oe_sre_spania_beachhead_mod: "Restored Exarchate of Spania"
 STATIC_MODIFIER_DESC_oe_sre_spania_beachhead_mod: "Following the landing at Carthago Nova, imperial naval bases and garrisoned coastal forts anchor Roman expansion across eastern and southern Hispania."
 STATIC_MODIFIER_NAME_oe_sre_spania_arsenals_mod: "Iberian Imperial Dockyards"
 STATIC_MODIFIER_DESC_oe_sre_spania_arsenals_mod: "Levantine shipwrights and Catalan-Murcian harbors are chartered into a western Mediterranean arsenal supplying imperial dromons and merchant convoys."
 STATIC_MODIFIER_NAME_oe_sre_toledo_legal_synthesis_mod: "Toledo Visigothic-Roman Legal Synthesis"
 STATIC_MODIFIER_DESC_oe_sre_toledo_legal_synthesis_mod: "Jurists in Toledo harmonize the ancient Visigothic Liber Iudiciorum with the Byzantine Basilika, reconciling Iberian estates under shared Roman jurisprudence."
 STATIC_MODIFIER_NAME_oe_sre_toledo_praetorian_edict_mod: "Praetorian Edict of Toledo"
 STATIC_MODIFIER_DESC_oe_sre_toledo_praetorian_edict_mod: "Constantinopolitan magistrates assume direct fiscal and judicial command in Toledo, enforcing uniform imperial taxation across the Iberian meseta."
 STATIC_MODIFIER_NAME_oe_sre_pillars_of_hercules_mod: "Guardians of the Pillars of Hercules"
 STATIC_MODIFIER_DESC_oe_sre_pillars_of_hercules_mod: "Twin imperial citadels flanking the Strait of Gibraltar seal the western gates of Mare Nostrum and levy customs upon every vessel entering from the Atlantic."
 STATIC_MODIFIER_NAME_oe_sre_hercules_oceanic_charter_mod: "Atlantic Gateways Fleet Charter"
 STATIC_MODIFIER_DESC_oe_sre_hercules_oceanic_charter_mod: "With the Pillars of Hercules under the Double-Headed Eagle, imperial pilots chart oceanic trade lanes linking Seville, Lisbon, and Constantinople."
 STATIC_MODIFIER_NAME_oe_sre_narbonensis_crossing_mod: "Restored Via Domitia & Narbonensis"
 STATIC_MODIFIER_DESC_oe_sre_narbonensis_crossing_mod: "Bridging the Rhone and repairing the ancient stone causeways of Gallia Narbonensis lets imperial armies march rapidly from Italy into the heart of Gaul."
 STATIC_MODIFIER_NAME_oe_sre_rhone_communes_mod: "Charter of the Rhone Communes"
 STATIC_MODIFIER_DESC_oe_sre_rhone_communes_mod: "Confirming the commercial franchises of Marseille, Arles, and Lyon wins prosperous burgher backing for Roman governance in southern Gaul."
 STATIC_MODIFIER_NAME_oe_sre_lutetia_prefecture_mod: "Lutetia Praetorian Prefecture"
 STATIC_MODIFIER_DESC_oe_sre_lutetia_prefecture_mod: "Re-establishing the Praetorian Prefecture of the Gauls at Lutetia unites the Seine and Loire basins under disciplined Roman fiscal and judicial registries."
 STATIC_MODIFIER_NAME_oe_sre_seine_imperial_schools_mod: "Imperial Academy of Lutetia"
 STATIC_MODIFIER_DESC_oe_sre_seine_imperial_schools_mod: "Binding the masters of Paris with Byzantine rhetoricians and canonists turns Lutetia into the premier western pillar of Greco-Roman scholarship."
 STATIC_MODIFIER_NAME_oe_sre_gallic_senators_mod: "Gallic Senators of the Consistorium"
 STATIC_MODIFIER_DESC_oe_sre_gallic_senators_mod: "Admitting great Gallo-Roman lineages into the Sacrum Consistorium echoes Claudius' famous senatorial reform, knitting western nobility into the imperial fabric."
 STATIC_MODIFIER_NAME_oe_sre_gallic_tagmata_mod: "Gallo-Roman Cataphract Tagmata"
 STATIC_MODIFIER_DESC_oe_sre_gallic_tagmata_mod: "Blending Gallic chivalric shock horse with Byzantine cataphract drill produces formidable armored squadrons patrolling the western provinces."
 STATIC_MODIFIER_NAME_oe_sre_channel_bridgehead_mod: "Classis Britannica Restored"
 STATIC_MODIFIER_DESC_oe_sre_channel_bridgehead_mod: "Commanding the narrow seas from Dover to the Thames estuary ensures uninterrupted convoys and amphibious supremacy across the Channel."
 STATIC_MODIFIER_NAME_oe_sre_londinium_staple_mod: "Londinium Imperial Wool Staple"
 STATIC_MODIFIER_DESC_oe_sre_londinium_staple_mod: "Chartering Londinium's wool merchants and cloth halls channels North Sea commerce directly into the imperial treasury."
 STATIC_MODIFIER_NAME_oe_sre_hadrians_limes_mod: "Rebuilt Wall of Hadrian"
 STATIC_MODIFIER_DESC_oe_sre_hadrians_limes_mod: "Restored stone milecastles, signal beacons, and garrison forts stretching from Solway to Tyne anchor the northernmost Roman rampart."
 STATIC_MODIFIER_NAME_oe_sre_northern_limitanei_mod: "Britannic Northern Limitanei"
 STATIC_MODIFIER_DESC_oe_sre_northern_limitanei_mod: "Allotting hereditary frontier plots along Eboracum and the northern marches raises hardened infantry garrisons defending imperial Britannia."
 STATIC_MODIFIER_NAME_oe_sre_britannia_restored_mod: "Diocese of the Four Britanniae"
 STATIC_MODIFIER_DESC_oe_sre_britannia_restored_mod: "With Londinium, Eboracum, and the northern frontier restored under the eagle, imperial officials revive the late-Roman Diocese of the Britanniae."
 STATIC_MODIFIER_NAME_oe_sre_insular_admiralty_mod: "Britannic Insular Admiralty"
 STATIC_MODIFIER_DESC_oe_sre_insular_admiralty_mod: "Turning British oak forests and deep estuaries into imperial naval yards projects Roman seapower across the North Sea and northern Atlantic."
 STATIC_MODIFIER_NAME_oe_sre_agri_decumates_mod: "Agri Decumates Bastion Line"
 STATIC_MODIFIER_DESC_oe_sre_agri_decumates_mod: "Linking Vindobona, Castra Regina, and Mogontiacum into a continuous artillery-ready frontier closes the historic gap between Rhine and Danube."
 STATIC_MODIFIER_NAME_oe_sre_rhine_danube_corridor_mod: "Rhine-Danube Imperial Waterway"
 STATIC_MODIFIER_DESC_oe_sre_rhine_danube_corridor_mod: "Standardized river tolls and imperial barge convoys bind Central European mines and workshops directly to Black Sea and Mediterranean markets."
 STATIC_MODIFIER_NAME_oe_sre_foederati_legions_mod: "Integrated Imperial Foederati Corps"
 STATIC_MODIFIER_DESC_oe_sre_foederati_legions_mod: "Enrolling Rhenish and Danubian warrior bands under Roman officers and regular pay transforms former frontier foes into loyal shock regiments."
 STATIC_MODIFIER_NAME_oe_sre_germanic_concordats_mod: "Free-City & Princely Imperial Concordats"
 STATIC_MODIFIER_DESC_oe_sre_germanic_concordats_mod: "Respecting urban charters along the Rhine and Danube softens local resistance and turns Central European estates into willing imperial clients."
 STATIC_MODIFIER_NAME_oe_sre_pax_beyond_limes_mod: "Pax Romana Beyond the Limes"
 STATIC_MODIFIER_DESC_oe_sre_pax_beyond_limes_mod: "Imperial highways, stone bridges, and watch-stations extend beyond the ancient Rhine-Danube boundary, fulfilling Augustus' unfinished northern vision."
 STATIC_MODIFIER_NAME_oe_sre_trans_rhenish_vicariate_mod: "Trans-Rhenish Imperial Diocese"
 STATIC_MODIFIER_DESC_oe_sre_trans_rhenish_vicariate_mod: "Delegating local governance to sworn Romanized estates beyond the Rhine secures steady tribute and calm borders across Germania."
 STATIC_MODIFIER_NAME_oe_sre_ctesiphon_triumph_mod: "Triumph Beneath the Arch of Ctesiphon"
 STATIC_MODIFIER_DESC_oe_sre_ctesiphon_triumph_mod: "As Roman cataphracts parade beneath the colossal brick vault on the Tigris, the ghost of Trajan and Heraclius cheers an empire unmatched from west to east."
 STATIC_MODIFIER_NAME_oe_sre_tigris_granaries_mod: "Restored Tigris-Euphrates Canals"
 STATIC_MODIFIER_DESC_oe_sre_tigris_granaries_mod: "Imperial hydraulic engineers dredge ancient Mesopotamian canals and rebuild river granaries, reviving the legendary agricultural wealth of the Fertile Crescent."
 STATIC_MODIFIER_NAME_oe_sre_carrhae_avenged_mod: "Eagles of Carrhae Avenged"
 STATIC_MODIFIER_DESC_oe_sre_carrhae_avenged_mod: "Commemorating the final vindication of Roman arms across Mesopotamia and the Iranian plateau instills unbreakable martial pride throughout the legions."
 STATIC_MODIFIER_NAME_oe_sre_persian_satrapy_mod: "Greco-Persian Imperial Concord"
 STATIC_MODIFIER_DESC_oe_sre_persian_satrapy_mod: "Blending Roman provincial law with Persian chancery scribes and religious toleration pacifies the plateau cities from Tabriz to Isfahan."
 STATIC_MODIFIER_NAME_oe_sre_silk_road_gateways_mod: "Silk Road Imperial Gateways"
 STATIC_MODIFIER_DESC_oe_sre_silk_road_gateways_mod: "Controlling both the Persian Gulf roadstead of Basra and the caravan bazaars of Tabriz and Isfahan channels Eurasian silk and spice duties straight to Constantinople."
 STATIC_MODIFIER_NAME_oe_sre_eastern_gates_mod: "Iron Gates of Zagros & Khorasan"
 STATIC_MODIFIER_DESC_oe_sre_eastern_gates_mod: "Fortified mountain defiles and garrisoned caravan citadels along the Iranian frontier shield the eastern empire against steppe and plateau incursions."
 STATIC_MODIFIER_NAME_oe_sre_thessaloniki_charter_mod: "Chrysobull of Thessaloniki Concord"
 STATIC_MODIFIER_DESC_oe_sre_thessaloniki_charter_mod: "Recognizing Thessaloniki's dignity as the co-emperor's honored seat heals the Palaiologan dynastic breach and rallies Macedonian citizens around the throne."
 STATIC_MODIFIER_NAME_oe_sre_macedonian_crown_pact_mod: "Macedonian Crown Centralization Pact"
 STATIC_MODIFIER_DESC_oe_sre_macedonian_crown_pact_mod: "Folding Thessaloniki's magnate factions directly into the central chancery trims court factions and strengthens fiscal unity across Thrace and Macedonia."
 STATIC_MODIFIER_NAME_oe_sre_st_demetrius_jurists_mod: "Library & Jurists of St. Demetrius"
 STATIC_MODIFIER_DESC_oe_sre_st_demetrius_jurists_mod: "Heirs of Harmenopoulos' Hexabiblos and monastic copyists in Thessaloniki preserve Roman civil law and Hellenistic learning under imperial patronage."
 STATIC_MODIFIER_NAME_oe_sre_thermaic_guilds_mod: "Thermaic Gulf Twin-Port Guilds"
 STATIC_MODIFIER_DESC_oe_sre_thermaic_guilds_mod: "Harmonized harbor dues between Thessaloniki and the Golden Horn turn the Aegean into a thriving commercial highway funding imperial revival."
 STATIC_MODIFIER_NAME_oe_sre_two_thrones_united_mod: "Legacy of Two Thrones Made One"
 STATIC_MODIFIER_DESC_oe_sre_two_thrones_united_mod: "The peaceful passing of the reconciled senior Palaiologan court at Thessaloniki leaves no civil war behind — only an enduring covenant of dynastic unity between the Empire's two greatest cities."
 STATIC_MODIFIER_NAME_oe_sre_dual_capital_legacy_mod: "Dual-Capital Covenant of Law and Letters"
 STATIC_MODIFIER_DESC_oe_sre_dual_capital_legacy_mod: "Honoring John VII's reconciliation through permanent legal, scholarly, and civic endowments binds Constantinople and Thessaloniki as twin pillars of Roman civilization."
 oe_sre.1.title: "Landing at Carthago Nova"
 oe_sre.1.desc: "Eight centuries after Justinian's general Liberius planted the imperial labarum upon the cliffs of Spania, Roman dromons and transports once more drop anchor beneath the headlands of Carthago Nova. Provincial ports throw open their sea-gates as scouts ride inland toward the olive valleys of the Levante, bearing imperial proclamations that Rome has returned to the Western Sea."
 oe_sre.1.a: "Re-establish the Maritime Exarchate of Spania"
 oe_sre.1.b: "Charter Iberian Port Arsenals & Naval Convoys"
 oe_sre.2.title: "Visigothic-Roman Legal Synthesis in Toledo"
 oe_sre.2.desc: "Within the cliff-girt citadel of Toledo, royal archives still preserve the weathered Latin folios of the Visigothic Liber Iudiciorum — itself descended from Theodosius' ancient code. Castilian and Aragonese jurists now meet Constantinopolitan legists beneath the vaulted cathedral cloisters, asking whether Hispania shall be governed by a harmonized Roman-Iberian code or by direct Praetorian decree."
 oe_sre.2.a: "Harmonize the Liber Iudiciorum with the Basilika"
 oe_sre.2.b: "Enforce Direct Constantinopolitan Praetorian Law"
 oe_sre.3.title: "Pillars of Hercules Restored"
 oe_sre.3.desc: "Where the rock of Calpe faces the African shore across surging azure swells, imperial trumpeters sound the salute to the setting sun. For the first time since the twilight of antiquity, the twin Pillars of Hercules stand once again beneath the Roman eagle: Mare Nostrum is sealed from the Golden Horn to the outer Ocean, and the wide Atlantic beckons beyond."
 oe_sre.3.a: "Fortify the Strait of Hercules & Imperial Customs"
 oe_sre.3.b: "Open the Western Ocean Fleet Charter"
 oe_sre.4.title: "Crossing the Rhone into Narbonensis"
 oe_sre.4.desc: "Imperial standards file across the stone spans of the Rhone beneath the weathered amphitheaters of Arles and Nimes, where Latin inscriptions of the Caesars still crown the arches. Local magistrates from Marseille to Narbonne greet the vanguard with keys of silver, marveling that the legions of New Rome have marched west along the ancient Via Domitia."
 oe_sre.4.a: "Restore the Via Domitia & Narbonensis Garrison"
 oe_sre.4.b: "Confirm the Liberties of the Rhone Communes"
 oe_sre.5.title: "Lutetia Imperial Prefecture"
 oe_sre.5.desc: "On the island in the Seine where Emperor Julian was once lifted upon a soldier's shield, imperial purple hangs once more from the ancient halls of Lutetia. Clerks of the Sacrum Consistorium inspect royal tax rolls and university charters, preparing to erect a revived Praetorian Prefecture of the Gauls bridging the Mediterranean to the northern seas."
 oe_sre.5.a: "Seat the Praetorian Prefect of the Gauls at Lutetia"
 oe_sre.5.b: "Charter the Imperial Academy of the Seine"
 oe_sre.6.title: "Gallic Senators in the Consistorium"
 oe_sre.6.desc: "Envoys of the great houses of Aquitaine, Burgundy, and the Ile-de-France arrive in solemn procession before the imperial throne, invoking Emperor Claudius' timeless bronze speech admitting Gallic notables to the Senate of Rome. Their integration promises either an illustrious western patriciate within the Sacrum Consistorium or iron-clad Gallo-Roman cavalry corps for the imperial host."
 oe_sre.6.a: "Admit Gallic Patricians to the Sacrum Consistorium"
 oe_sre.6.b: "Raise Gallo-Roman Cataphract Tagmata"
 oe_sre.7.title: "Channel Crossing to Londinium"
 oe_sre.7.desc: "Through swirling grey Channel mist, imperial galleys and heavy carracks make landfall beneath the white cliffs of Dubris and sweep upriver to the wharves of Londinium. Along the crumbling footings of the ancient Roman wall by the Thames, imperial heralds read aloud the proclamation ending a thousand years of Britain's separation from the Roman world."
 oe_sre.7.a: "Recommission the Classis Britannica on the Thames"
 oe_sre.7.b: "Charter the Londinium Guilds & Wool Staple"
 oe_sre.8.title: "Rebuilding Hadrian's Limes"
 oe_sre.8.desc: "North of Eboracum, imperial engineers trace the mossy ashlar blocks of Emperor Hadrian's wall across windswept moorland between the Solway Firth and the Tyne. Masons and military surveyors propose either restoring the full stone chain of milecastles and beacon towers or settling hereditary frontier limitanei across the rugged northern marches."
 oe_sre.8.a: "Restore the Stone Milecastles of Hadrian's Wall"
 oe_sre.8.b: "Muster Northern Limitanei & Frontier Garrisons"
 oe_sre.9.title: "Imperial Province of Britannia Restored"
 oe_sre.9.desc: "In the stone basilica of Eboracum — the very city where Constantine the Great was first hailed Augustus — imperial legates unfurl the purple banner over the restored Diocese of the Four Britanniae. From Cornish tin shafts to the northern ramparts, the island beyond the Ocean once more strikes gold solidi bearing the Emperor's image."
 oe_sre.9.a: "Proclaim the Diocese of the Four Britanniae"
 oe_sre.9.b: "Establish the Insular Admiralty & North Sea Yards"
 oe_sre.10.title: "Rhine-Danube Agri Decumates Frontier"
 oe_sre.10.desc: "From the river bastion of Vindobona through Castra Regina to the forested hills of the Black Forest and the Rhine bend, imperial detachments have reclaimed the strategic hinge of Central Europe — the ancient Agri Decumates. Commanders survey star-fort earthworks along both great rivers while merchants eye an unbroken waterway linking the North Sea to the Euxine."
 oe_sre.10.a: "Fortify the Agri Decumates & Danube Castra"
 oe_sre.10.b: "Charter the Rhine-Danube Imperial Waterway"
 oe_sre.11.title: "Imperial Foederati Integration"
 oe_sre.11.desc: "Across the cathedrals and guildhalls of Cologne, Mainz, and Nuremberg, seasoned German landsknechts, civic burgomasters, and knights weigh their future under the revived Roman purple. Rather than endless partisan warfare across deep forests, the Imperial War Council proposes reviving the classical Foederati covenant — binding martial prowess and free-city charters directly to imperial service."
 oe_sre.11.a: "Enroll Germanic Foederati into Standing Regiments"
 oe_sre.11.b: "Ratify Free-City & Princely Imperial Concordats"
 oe_sre.12.title: "Pax Romana Beyond the Limes"
 oe_sre.12.desc: "Where Varus' legions once perished in dark woodland ambushes, Roman milestones now measure paved imperial highways stretching across the German plains. From the Alpine passes to the northern rivers, bells ring for a Pax Romana extending farther into Central Europe than even Augustus or Marcus Aurelius ever beheld."
 oe_sre.12.a: "Extend Imperial Highways & Watch-Stations to the Elbe"
 oe_sre.12.b: "Establish the Trans-Rhenish Imperial Diocese"
 oe_sre.13.title: "Crossing the Tigris to Ctesiphon"
 oe_sre.13.desc: "At dusk beneath the towering baked-brick vault of Taq Kasra on the banks of the Tigris, columns of lamellar-armored Roman cataphracts ride past swaying date palms bearing golden labarum standards and crimson draco banners. Trajan, Severus, and Heraclius each drove eastern empires before them to this river plain; now the Double-Headed Eagle claims Mesopotamia anew."
 oe_sre.13.a: "Raise the Imperial Labarum Beneath the Arch of Ctesiphon"
 oe_sre.13.b: "Dredge the Ancient Tigris Canals & Rebuild Granaries"
 oe_sre.14.title: "Avenging Carrhae & Heraclius' Triumph"
 oe_sre.14.desc: "From the citadel of Tabriz to the high passes of the Iranian plateau, imperial detachments recover trophies of centuries of Roman-Persian rivalry. In solemn liturgy beneath imperial field tents, chaplains invoke Emperor Heraclius' recovery of the True Cross while commanders salute the final vindication of Crassus' lost standards at Carrhae."
 oe_sre.14.a: "Proclaim the Final Vindication of Roman Arms"
 oe_sre.14.b: "Charter a Greco-Persian Provincial Administration"
 oe_sre.15.title: "Silk Road Imperial Gateways"
 oe_sre.15.desc: "With imperial customs flags raised over the bazaars of Persia and the river roadsteads opening onto the Persian Gulf, caravans laden with Cathayan silk, Samarkand paper, and Indian spices pass through uninterrupted Roman toll-houses from Hormuz and Isfahan straight to the Golden Horn. The eastern borderland has become the richest artery of the world."
 oe_sre.15.a: "Unify the Persian Gulf & Overland Silk Road Caravanserais"
 oe_sre.15.b: "Garrison the Zagros & Khorasan Eastern Gates"
 oe_sre.16.title: "Thessaloniki's Civic Reconciliation Charter"
 oe_sre.16.desc: "After a generation of bitter Palaiologan civil strife, the proud second city of the Empire — Thessaloniki, sanctuary of St. Demetrius — stands once more under the imperial eagle alongside Constantinople. Envoys of the senior Palaiologan branch led by John VII's circle now submit a solemn civic charter: confirming Thessaloniki's honorable dignity as co-imperial seat in exchange for unbreakable fealty to the Golden Horn."
 oe_sre.16.a: "Grant the Chrysobull of Thessaloniki Concord"
 oe_sre.16.b: "Bind Macedonian Magnates Directly to the Great Palace"
 oe_sre.17.title: "The Co-Emperor's Imperial Library & Jurists of St. Demetrius"
 oe_sre.17.desc: "With peace secured between the Bosporus and the Thermaic Gulf, the co-imperial court at Thessaloniki blossoms into a beacon of Roman jurisprudence and civic renewal. Disciples of Constantine Harmenopoulos revise the Hexabiblos in the shadow of the Basilica of St. Demetrius, while maritime guilds plead for an imperial harbor treaty uniting Aegean shipping with the Golden Horn."
 oe_sre.17.a: "Endow the Imperial Library & School of St. Demetrius"
 oe_sre.17.b: "Charter the Thermaic Guilds & Twin-Port Customs"
 oe_sre.18.title: "Legacy of Two Thrones Made One"
 oe_sre.18.desc: "At dawn above the triple Theodosian walls and along the sea-towers of Thessaloniki, cathedral bells toll in unison. The elder Palaiologan line that once threatened to tear the Empire apart has passed into honored memory in loyal brotherhood — leaving Constantinople and Thessaloniki united under a single unbroken crown, braced together against every tempest yet to come."
 oe_sre.18.a: "Enshrine the Eternal Concord of the Two Thrones"
 oe_sre.18.b: "Dedicate the Dual-Capital Legacy to Law and Letters"
