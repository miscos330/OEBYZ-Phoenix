 STATIC_MODIFIER_DESC_oe_msn2_elr_shipyard_mod:0 "Copper-sheathed slipways and Greek fire arsenals accelerate naval construction and sharpen heavy warship firepower."
 STATIC_MODIFIER_NAME_oe_msn2_elr_m3:0 "Six Exarchates Imperial Web"
