 STATIC_MODIFIER_NAME_oe_msn2_elr_m4:0 "Imperium Bicephalum Eternal"
 STATIC_MODIFIER_DESC_oe_msn2_elr_m4:0 "Spanning Old and New Worlds alike, the twin-headed eagle crowns a disciplined, prosperous, and enlightened transoceanic superpower."
 STATIC_MODIFIER_NAME_oe_msn2_eth_m1:0 "Prester John Envoy & Orthodox Prestige"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m1:0 "Solomonic ecclesiastical heritage and transoceanic embassies elevate Ethiopia's standing from the Nile to Lisbon."
 STATIC_MODIFIER_NAME_oe_msn2_eth_m2:0 "Red Sea Coffee & Gold Commerce"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m2:0 "Mastering Red Sea ports links Ethiopian coffee, gold, and highland wares directly into lucrative monsoon trade lanes."
 STATIC_MODIFIER_NAME_oe_msn2_eth_m3:0 "Amba Citadels & Modern Gunpowder Legions"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m3:0 "Pairing impregnable highland amba citadels with disciplined matchlock and artillery corps makes Ethiopia unconquerable."
 STATIC_MODIFIER_NAME_oe_msn2_eth_m4:0 "Solomonic Hegemon of the Horn"
 STATIC_MODIFIER_DESC_oe_msn2_eth_m4:0 "Uniting highland sanctuaries and Red Sea commerce, the Solomonic crown endures as sovereign master of the Horn of Africa."
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m1:0 "Triple Alliance Hegemony"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m1:0 "Tenochtitlan commands Mesoamerica through sacred legitimacy and organized tributary obligations, ensuring loyal subjects and ample levies."
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m2:0 "Pochteca Merchants & Cacao-Gold Treasury"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m2:0 "Pochteca long-distance guilds connect Gulf ports and Maya markets, pouring cacao, gold, and customs wealth into the lake capital."
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m3:0 "Sunset Bastion: Obsidian to Firearms"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m3:0 "Meeting transoceanic arrivals on equal terms, reformed Aztec armies and scholars master steel, gunpowder, and grand diplomacy."
 STATIC_MODIFIER_NAME_oe_msn2_tnc_m4:0 "Empire of the Undying Sun"
 STATIC_MODIFIER_DESC_oe_msn2_tnc_m4:0 "Sustained by chinampa abundance, two-ocean trade, and modernized legions, the Empire of the Sun stands unbroken into the modern age."
 STATIC_MODIFIER_NAME_oe_msn2_csu_m1:0 "Qhapaq Nan, Terraces & Quipu Administration"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m1:0 "Royal highland roads, vertical terraced granaries, and meticulous quipu registries overcome Andean geography with unmatched efficiency."
 STATIC_MODIFIER_NAME_oe_msn2_csu_m2:0 "Pacific Emporia & Andean Silver Treasury"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m2:0 "Linking Quito, Chimor, and Arequipa ports channels Andean silver, wool, and coastal shipping into an inexhaustible imperial treasury."
 STATIC_MODIFIER_NAME_oe_msn2_csu_m3:0 "Pacific Oceanic Breakthrough"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m3:0 "Modernizing Pacific shipyards and maritime doctrine empowers Tawantinsuyu to project trade and naval strength across open oceans."
 STATIC_MODIFIER_NAME_oe_msn2_csu_m4:0 "Lord of the Four Quarters: Eternal Tawantinsuyu"
 STATIC_MODIFIER_DESC_oe_msn2_csu_m4:0 "From Quito to the southern coast, imperial roads, disciplined armies, and radiant craftsmanship crown Tawantinsuyu eternal sovereign of the Andes."
 oe_msn_elr_destiny:0 "#bold #color_yellow Nova Elysia: Transatlantic Imperial Destiny#!#!"
 oe_msn_elr_destiny_DESCRIPTION:0 "From Chesapeake Landing to Continental Exarchates and Imperium Bicephalum"
 oe_msn_elr_destiny_CRITERIA_DESCRIPTION:0 "Secure New Constantinople, forge Elysian faith and identity, charter American exarchates, and crown Imperium Bicephalum."
 oe_msn_elr_destiny_BUTTON_TOOLTIP:0 "Embark on the Nova Elysia Destiny"
 oe_msn_elr_destiny_BUTTON_DETAILS:0 "A dedicated sixteen-task four-pillar destiny for Nova Elysia: establish the Chesapeake hearth, convene the Elysian Senate and Three Faiths, encounter Vinland and Spartania, build Elysian Silk Looms and Greek Fire Arsenals, charter imperial exarchates, and decide the fate of Old and New Rome after the Great Reunion."
 oe_msn_elr_01_chesapeake_hearth:0 "Chesapeake Hearth: Found New Constantinople"
 oe_msn_elr_01_chesapeake_hearth_desc:0 "Having braved the uncharted Atlantic storm to salvage the Roman flame, the imperial exiles raise timber walls and marble altars along the sheltered waters of Chesapeake Bay. Erecting foundational harbor [buildings|e], nurturing [capital|e] [development|e], and securing fragile [stability|e] kindles New Constantinople into an inextinguishable hearth of [prosperity|e] on western shores."
 oe_msn_elr_01_chesapeake_hearth_req_tt:0 "Own Chesapeake or Nansemond, Stability >= 5, and either Capital Development >= 12 or own a Wharf/Granary."
 oe_msn_elr_02_elysian_senate:0 "Convene the Elysian Senate"
 oe_msn_elr_02_elysian_senate_desc:0 "Exiled patricians, veteran ship captains, and frontier landowners gather in solemn forum to draft a living charter for Rome reborn across the ocean. Balancing imperial authority with senatorial [parliament|e] counsel elevates [legitimacy|e], deepens [cultural_tradition|e], and secures civic [estate_satisfaction|e] for the fledgling Elysian Empire."
 oe_msn_elr_02_elysian_senate_req_tt:0 "Convene the Elysian Senate or hold >= 8 Locations, and Nobles Satisfaction >= 45%."
 oe_msn_elr_03_three_faiths_pillar:0 "Pillar of the Three Faiths"
 oe_msn_elr_03_three_faiths_pillar_desc:0 "Cut off from Old World patriarchates and confronting ancient indigenous traditions, Elysian thinkers debate Western Orthodoxy, Hellenic revival, and Symmachian toleration. Raising sacred [buildings|e] and settling the realm's spiritual course strengthens [religious_influence|e], [stability|e], and harmonious [estate_satisfaction|e] across a diverse frontier empire."
 oe_msn_elr_03_three_faiths_pillar_req_tt:0 "Establish the Three Faiths path or Stability >= 15, and either own a Temple/Monastery or Clergy Satisfaction >= 50%."
 oe_msn_elr_04_hellenic_ethnogenesis:0 "Elysian Hellenic Ethnogenesis"
 oe_msn_elr_04_hellenic_ethnogenesis_desc:0 "Generations born under western skies speak an Attic-tinged tongue enriched by frontier life, blending Homeric letters with Chesapeake shipcraft and native lore. Endowing scholarly [buildings|e] and raising [capital|e] [development|e] elevates [literacy|e] and [cultural_tradition|e], forging a proud new Elysian civilization distinct from both Old Rome and Europe."
 oe_msn_elr_04_hellenic_ethnogenesis_req_tt:0 "Complete Elysian Ethnogenesis or hold >= 18 Locations, and either Capital Development >= 18 or own a Library/University."
 oe_msn_elr_05_pyrophoroi_and_copper:0 "Pyrophoroi & Copper-Clad Fleet"
 oe_msn_elr_05_pyrophoroi_and_copper_desc:0 "Pairing Great Lakes native copper sheathing with perfected Greek Fire projectors creates terrifying Pyrophoroi assault legions and flame-belching oceanic galleons. Harnessing cutting-edge military [advances|e] and arsenal [buildings|e] surges both [army_tradition|e] and [navy_tradition|e], ensuring no Old World armada dares challenge Elysian waters."
 oe_msn_elr_05_pyrophoroi_and_copper_req_tt:0 "Unlock Pyrophoroi or Copper-Clad Fleet (or Age of Discovery+), and either Army/Navy Tradition >= 20 or own a Cannon Maker/Dry Dock."
 oe_msn_elr_06_eastern_seaboard:0 "Master the Eastern Seaboard"
 oe_msn_elr_06_eastern_seaboard_desc:0 "Breaking out from the sheltered estuaries of Virginia, Elysian settlers plant farms, fisheries, and deep-water ports along the fertile Atlantic coast. Expanding vibrant [colony|e] settlements and coastal [maritime_presence|e] secures abundant food, swells treasury [gold|e], and lays the demographic backbone of a continental New World empire."
 oe_msn_elr_06_eastern_seaboard_req_tt:0 "Own >= 12 Locations and >= 6 Ports."
 oe_msn_elr_07_north_atlantic_kin:0 "Northern Kin: Vinland & the St. Lawrence"
 oe_msn_elr_07_north_atlantic_kin_desc:0 "Sailing north past the Hudson mouth toward the icy fjords of the St. Lawrence, Roman navigators encounter Norse Vinland descendants remembering the Varangian oath. Extending northern [diplomacy|e] and [navy_tradition|e] secures cod fisheries, fur [trade|e], and loyal northern [subjects|e] shielding Elysia's boreal frontier."
 oe_msn_elr_07_north_atlantic_kin_req_tt:0 "Contact Vinland, or own/non-sovereign subject-own Manhattan or Stadacona."
 oe_msn_elr_08_gulf_and_laconians:0 "Southern Phalanx: Spartania & the Gulf"
 oe_msn_elr_08_gulf_and_laconians_desc:0 "Venturing south through the Straits of Florida into the warm currents of the Gulf and Yucatan reveals lost Laconian colonists and the golden key to the Caribbean. Anchoring southern [army_tradition|e] and Gulf [maritime_presence|e] secures sugar and silver [trade|e] while multiplying imperial [gold|e] across the warm southern seas."
 oe_msn_elr_08_gulf_and_laconians_req_tt:0 "Contact Spartania, or own/non-sovereign subject-own Havana or Bulbancha."
 oe_msn_elr_09_masters_of_hesperia:0 "Masters of Hesperia"
 oe_msn_elr_09_masters_of_hesperia_desc:0 "From the northern forests to the Caribbean islands, the double-headed purple eagle reigns supreme over the western continent of Hesperia. Rising into the ranks of global [great_power|e] states backed by sprawling territories and Exarchate [subjects|e], New Constantinople now convenes a grand constitutional assembly to determine how its continental [control|e] shall be governed."
 oe_msn_elr_09_masters_of_hesperia_req_tt:0 "Hold >= 35 Locations or >= 3 American Exarchates, and either Great Power status or Monthly Trade & Tax Income >= 35."
 oe_msn_elr_10_elysian_silk_looms:0 "Elysian Silk Looms"
 oe_msn_elr_10_elysian_silk_looms_desc:0 "Acclimatizing imperial silkworms to native Virginian mulberry groves revives the ancient Byzantine monopoly on Tyrian purple brocade in a brand-new hemisphere. Expanding state textile [buildings|e] transforms New Constantinople into a dazzling luxury [market|e], pouring [gold|e] and urban [prosperity|e] into every guild hall along the Chesapeake."
 oe_msn_elr_10_elysian_silk_looms_req_tt:0 "Build an Elysian Silk Ergasterion, or hold Treasury >= 500 Gold and own a Cloth Guild/Marketplace."
 oe_msn_elr_11_greek_fire_dockyards:0 "Greek Fire Dockyards & Arsenals"
 oe_msn_elr_11_greek_fire_dockyards_desc:0 "Deep-water slipways lining the Chesapeake launch copper-clad capital ships fitted with pressurized Greek Fire siphons and heavy broadside cannon. Operating advanced dockyard [buildings|e] and seasoned [sailors|e] elevates [navy_tradition|e] to mythic heights, turning the Elysian [navy|e] into the undisputed terror of the Atlantic."
 oe_msn_elr_11_greek_fire_dockyards_req_tt:0 "Build a Greek Fire Arsenal, or hold Navy Tradition >= 25 and >= 10 Ports."
 oe_msn_elr_12_six_exarchates_web:0 "Imperial Web of Exarchates"
 oe_msn_elr_12_six_exarchates_web_desc:0 "Adapting Justinian's Ravenna and Carthage model to transoceanic distances, Elysia delegates frontier defense and provincial commerce to chartered viceregal Exarchates. Coordinating this disciplined constellation of loyal [subjects|e] multiplies imperial [diplomacy|e] and continental [control|e] without overstretching the central bureaucracy of New Constantinople."
 oe_msn_elr_12_six_exarchates_web_req_tt:0 "Command >= 3 Elysian Exarchates (or >= 3 Subjects and >= 30 Locations)."
 oe_msn_elr_13_great_reunion:0 "The Great Transatlantic Reunion"
 oe_msn_elr_13_great_reunion_desc:0 "As Atlantic fog lifts and Old World caravels collide with sleek purple-sailed dromons from the West, Europe recoils in astonishment: the lost Romans have returned as an oceanic titan. Reopening transatlantic [diplomacy|e] and [trade|e] floods Elysia with immense [prestige|e] and rekindles the ancient [navy|e] road back to the Mediterranean."
 oe_msn_elr_13_great_reunion_req_tt:0 "Trigger the Great Reunion (or Age of Discovery+), and hold >= 8 Ports."
 oe_msn_elr_14_hesperides_springboard:0 "Hesperides Springboard"
 oe_msn_elr_14_hesperides_springboard_desc:0 "Fortifying mid-Atlantic island stations in Bermuda, the Azores, or the Rock of Gibraltar turns the vast ocean into an imperial Roman highway. Projecting unbreakable [maritime_presence|e] and hardened [navy_tradition|e] from these unsinkable [fort|e] harbors puts Iberia, the Mediterranean, and Constantinople itself within reach of the Elysian [navy|e]."
 oe_msn_elr_14_hesperides_springboard_req_tt:0 "Establish the Hesperides Springboard, or own/non-sovereign subject-own Ponta Delgada, Angra, Bermuda, or Gibraltar."
 oe_msn_elr_15_nostos_or_new_world:0 "Nostos Return or New World Era"
 oe_msn_elr_15_nostos_or_new_world_desc:0 "Whether raising the purple Labarum once more above Hagia Sophia in triumphant Nostos or proclaiming a sovereign New World Roman Era unchained from Old World ruins, history bends to Elysia's will. Achieving paramount [great_power|e] mastery crowns the Empire with unmatched [prestige|e], [cultural_tradition|e], and sovereign [legitimacy|e]."
 oe_msn_elr_15_nostos_or_new_world_req_tt:0 "Own or non-sovereign subject-own Constantinople, or declare the New World Era; and hold Great Power status."
 oe_msn_elr_16_imperium_bicephalum:0 "Imperium Bicephalum: Twin-Ocean Eternal Rome"
 oe_msn_elr_16_imperium_bicephalum_desc:0 "One head gazes across the verdant plains of Hesperia, the other watches the storied shores of the Old World: Rome has transcended geography to become a twin-ocean colossus. Standing supreme as an immortal [great_power|e] with soaring [capital|e] [development|e], iron [stability|e], and transcendent [prestige|e], Imperium Bicephalum now seals its eternal two-world order."
 oe_msn_elr_16_imperium_bicephalum_req_tt:0 "Complete all four pillars, Stability >= 20, Great Power status, Capital Development >= 28, and achieve the Bicephalum Entity or Elysian Grand Ending."
 oe_msn_eth_destiny:0 "#bold #color_yellow Solomonic Throne: Ethiopian Highland Destiny#!#!"
 oe_msn_eth_destiny_DESCRIPTION:0 "From Aksumite Sanctuaries and Red Sea Ports to Horn of Africa Supremacy"
 oe_msn_eth_destiny_CRITERIA_DESCRIPTION:0 "Unite highland churches, command Red Sea coffee and gold ports, and forge a modern gunpowder kingdom."
 oe_msn_eth_destiny_BUTTON_TOOLTIP:0 "Embark on the Ethiopian Destiny"
 oe_msn_eth_destiny_BUTTON_DETAILS:0 "A focused ten-task destiny for Solomonic Ethiopia: consolidate the highland throne from Axum to Debra Berhan, elevate Miaphysite scholarship and Prester John diplomacy, master Red Sea coffee and gold ports, and modernize highland fortresses and gunpowder legions."
 oe_msn_eth_01_highland_throne:0 "Highland Throne: Axum, Lalibela & Debra Berhan"
 oe_msn_eth_01_highland_throne_desc:0 "From the ancient obelisks of Axum to the carved monoliths of Lalibela and the winter court at Debra Berhan, reaffirming Solomonic [legitimacy|e] anchors the [capital|e] highlands. Elevating regional [development|e] and curbing restless regional lords secures lasting [stability|e] across the Ethiopian plateau."
 oe_msn_eth_01_highland_throne_req_tt:0 "Own or have subjects own Axum, Lalibela, and Debra Berhan, have at least 5 Stability, and reach 12 Development in our capital."
 oe_msn_eth_02_kebra_nagast_church:0 "Kebra Nagast & the Orthodox Church"
 oe_msn_eth_02_kebra_nagast_church_desc:0 "The Kebra Nagast binds the Ark of Zion to the Lion of Judah, giving the Negusa Nagast unmatched [religious_influence|e] among the mountain monasteries. Endowing sacred [buildings|e] and nurturing clerical [estate_satisfaction|e] cements spiritual [crown_power|e] across every highland parish."
 oe_msn_eth_02_kebra_nagast_church_req_tt:0 "Own or have subjects own Axum, have at least 10 Stability, maintain a Temple or Monastery, and keep Clergy satisfaction at least 50%."
 oe_msn_eth_03_gonder_rock_churches:0 "Gonder Citadels & Highland Academies"
 oe_msn_eth_03_gonder_rock_churches_desc:0 "Replacing roving tent capitals with stone palaces at Gonder and Ge'ez parchment houses around Lalibela transforms royal [cultural_tradition|e]. Funding enduring scholarly [buildings|e] spreads highland [literacy|e] and multiplies the [prestige|e] of Ethiopia's royal chronicles."
 oe_msn_eth_03_gonder_rock_churches_req_tt:0 "Own or have subjects own Gonder and Lalibela, hold 200 Gold, maintain a Scriptorium or Library, and reach 16 Development in our capital."
 oe_msn_eth_04_prester_john_diplomacy:0 "Embassies of Prester John"
 oe_msn_eth_04_prester_john_diplomacy_desc:0 "Envoys dispatched from Zara Yaqob's court to Rome, Lisbon, and Jerusalem turned the legend of Prester John into sharp sovereign [diplomacy|e]. Exchanging artisans and [institutions|e] across distant seas elevates our [diplomatic_reputation|e] while importing practical [advances|e] to the highlands."
 oe_msn_eth_04_prester_john_diplomacy_req_tt:0 "Have at least 15 Stability, establish a Christian overseas diplomatic partner or reach the Age of Discovery, and embrace Feudalism or Renaissance (or reach 20 Stability)."
 oe_msn_eth_05_massawa_red_sea_gate:0 "Red Sea Gateway of Massawa"
 oe_msn_eth_05_massawa_red_sea_gate_desc:0 "Descending the Eritrean escarpment to reclaim Massawa breaks Ethiopia's mountain encirclement and opens a direct [core|e] window onto the Red Sea. Mustering coastal [sailors|e] and asserting [maritime_presence|e] lays the keel for a resilient Highland [navy|e]."
 oe_msn_eth_05_massawa_red_sea_gate_req_tt:0 "Own or have subjects own Massawa and control at least one port."
 oe_msn_eth_06_zeila_harar_corridor:0 "Zeila & Harar Caravan Corridor"
 oe_msn_eth_06_zeila_harar_corridor_desc:0 "Controlling walled Harar and the Gulf of Aden port of Zeila places the Horn's frankincense, ivory, and highland grain [trade|e] under imperial customs. Protecting caravan [market|e] stations strengthens coastal [control|e] and fills the royal coffers with [gold|e]."
 oe_msn_eth_06_zeila_harar_corridor_req_tt:0 "Own or have subjects own Zeila and Harar, and maintain a Marketplace or Caravanserai."
 oe_msn_eth_07_indian_ocean_coffee_gold:0 "Indian Ocean Coffee & Gold Trade"
 oe_msn_eth_07_indian_ocean_coffee_gold_desc:0 "Wild Kaffa coffee, alluvial Fazogli ore, and aromatic myrrh draw dhows from Yemen and Gujarat to our shores. Channeling monsoon [trade|e] into vibrant port [prosperity|e] expands imperial [gold|e] reserves while enriching merchant [estates|e] from Lake Tana to Aden."
 oe_msn_eth_07_indian_ocean_coffee_gold_req_tt:0 "Hold 400 Gold, own at least 25 locations, earn at least 25 monthly trade and tax income, and maintain a Wharf or at least 3 ports."
 oe_msn_eth_08_highland_amba_forts:0 "Highland Roads & Amba Citadels"
 oe_msn_eth_08_highland_amba_forts_desc:0 "Flat-topped amba mesas rise like natural citadels above sheer gorges, garrisoned by royal chewa regiments loyal to the crown. Linking each mountain [fort|e] by courier roads hones [army_tradition|e], safeguards highland [manpower|e], and projects decisive [control|e] over border valleys."
 oe_msn_eth_08_highland_amba_forts_req_tt:0 "Own at least 18 locations, reach 15 Army Tradition, and build a Chewa Amba Citadel or Castle (or reach 12 Stability)."
 oe_msn_eth_09_modern_gunpowder_legions:0 "Modernized Gunpowder Legions"
 oe_msn_eth_09_modern_gunpowder_legions_desc:0 "Remembering how matchlocks and brass culverins reshaped the Adal wars, the throne drills standing musketeer [regulars|e] beside highland shock cavalry. Mastering imported gunpowder [advances|e] lifts [army_tradition|e] and turns the Solomonic [army|e] into a disciplined continental shield."
 oe_msn_eth_09_modern_gunpowder_legions_req_tt:0 "Reach the Age of Discovery, hold 300 Gold, build an Armory or Cannon Maker (or reach 25 Army Tradition), and adopt Pike and Shot or Professional Armies (or reach 30 Army Tradition)."
 oe_msn_eth_10_solomonic_horn_hegemon:0 "Solomonic Hegemon of the Horn"
 oe_msn_eth_10_solomonic_horn_hegemon_desc:0 "From the Blue Nile cataracts to the monsoon straits of Bab el-Mandeb, the restored Solomonic empire stands acknowledged as a [great_power|e]. Unshakeable [legitimacy|e], thriving highland [prosperity|e], and unyielding sovereign [prestige|e] crown the eternal Negusa Nagast."
 oe_msn_eth_10_solomonic_horn_hegemon_req_tt:0 "Own or have subjects own Axum and Gonder, have at least 20 Stability, own 35 locations, reach 22 Development in our capital, and become a Great Power or earn 50 monthly trade and tax income."
 oe_msn_tnc_destiny:0 "#bold #color_yellow Eagle & Serpent: Aztec Triple Alliance Destiny#!#!"
 oe_msn_tnc_destiny_DESCRIPTION:0 "From Tenochtitlan Chinampas to Two-Ocean Trade and the Undying Sun"
 oe_msn_tnc_destiny_CRITERIA_DESCRIPTION:0 "Unite sacred pyramid cities, master Gulf and Maya commerce, and modernize to stand unbroken against transoceanic rivals."
 oe_msn_tnc_destiny_BUTTON_TOOLTIP:0 "Embark on the Aztec Destiny"
 oe_msn_tnc_destiny_BUTTON_DETAILS:0 "A focused ten-task destiny for the Aztec Triple Alliance (TNC/TTZ/AZT): anchor Tenochtitlan's chinampas, consecrate Teotihuacan and Cholula, secure Gulf and Yucatan trade routes, and modernize firearms and diplomacy to forge an unbroken Empire of the Sun."
 oe_msn_tnc_01_chinampa_hearth:0 "Chinampa Hearth: Tenochtitlan"
 oe_msn_tnc_01_chinampa_hearth_desc:0 "Anchored on Lake Texcoco by willow stakes and fertile silt, the chinampa floating gardens yield multiple harvests a year for our island [capital|e]. Expanding dikes and freshwater [buildings|e] accelerates urban [development|e] and brings abundant [prosperity|e] to the Mexica valley."
 oe_msn_tnc_01_chinampa_hearth_req_tt:0 "Own or have subjects own Tenochtitlan, have at least 5 Stability, and build a Granary or Aqueduct System (or reach 14 Development in our capital)."
 oe_msn_tnc_02_sacred_pyramids_pilgrimage:0 "Sacred Pyramids: Teotihuacan & Cholula"
 oe_msn_tnc_02_sacred_pyramids_pilgrimage_desc:0 "Processions along the Avenue of the Dead at Teotihuacan and up the Great Pyramid of Cholula link Mexica rule to Toltec antiquity. Securing both [core|e] sanctuaries magnifies royal [prestige|e], deepens imperial [legitimacy|e], and affirms sacred [control|e] over the central basin."
 oe_msn_tnc_02_sacred_pyramids_pilgrimage_req_tt:0 "Own or have subjects own Teotihuacan and Cholula."
 oe_msn_tnc_03_sun_priests_calmecac:0 "Sun Priests & Calmecac Academies"
 oe_msn_tnc_03_sun_priests_calmecac_desc:0 "Inside the calmecac academies surrounding the Templo Mayor, noble youths master pictorial glyphs, astronomy, and statecraft under sun priests. Patronizing priesthood [religious_influence|e] elevates [cultural_tradition|e], spreads sacred [literacy|e], and fortifies priestly [estate_satisfaction|e]."
 oe_msn_tnc_03_sun_priests_calmecac_req_tt:0 "Own or have subjects own Tenochtitlan, have at least 12 Stability, keep Clergy satisfaction at least 50%, and build a Temple or Library (or reach 18 Development in our capital)."
 oe_msn_tnc_04_triple_alliance_hegemony:0 "Hegemony of the Triple Alliance"
 oe_msn_tnc_04_triple_alliance_hegemony_desc:0 "Uniting Tenochtitlan, Texcoco, and Tlacopan under tribute rolls turns rival altepetl city-states into an engine of continental rule. Disciplining tributary [subjects|e] tightens imperial [crown_power|e], steadies highland [stability|e], and enlarges the Huey Tlatoani's [manpower|e] levy."
 oe_msn_tnc_04_triple_alliance_hegemony_req_tt:0 "Own at least 20 locations, have at least 15 Stability, and hold at least 2 subjects or reach 18 Army Tradition."
 oe_msn_tnc_05_gulf_gateway_cempoala:0 "Gulf Gateway of Cempoala"
 oe_msn_tnc_05_gulf_gateway_cempoala_desc:0 "Marching down from the obsidian sierra to the lime-plastered Totonac capital of Cempoala opens the Gulf of Mexico to Mexica banners. Integrating this coastal [core|e] recruits lowland [sailors|e], establishes Gulf [maritime_presence|e], and launches our first sea-going [navy|e]."
 oe_msn_tnc_05_gulf_gateway_cempoala_req_tt:0 "Own or have subjects own Cempoala and control at least one port."
 oe_msn_tnc_06_yucatan_maya_cities:0 "Yucatan & the Maya Cities"
 oe_msn_tnc_06_yucatan_maya_cities_desc:0 "Extending imperial power across the Tabasco lagoons to the limestone walls of Mayapan bridges the valley of Mexico and the Caribbean shore. Securing this eastern [core|e] links distant canoe [trade|e] networks, raises southern [development|e], and expands imperial [prestige|e]."
 oe_msn_tnc_06_yucatan_maya_cities_req_tt:0 "Own or have subjects own Mayapan and maintain a Wharf or at least 3 ports."
 oe_msn_tnc_07_pochteca_cacao_gold:0 "Pochteca Guilds & Cacao-Gold Revenue"
 oe_msn_tnc_07_pochteca_cacao_gold_desc:0 "Armed pochteca guilds range from Soconusco to Xicalango, returning to Tlatelolco's great [market|e] with quetzal plumes, jade, and cacao beans. Backing merchant [estates|e] turns overland [trade|e] into steady tribute [gold|e] while doubling as the throne's eyes abroad."
 oe_msn_tnc_07_pochteca_cacao_gold_req_tt:0 "Hold 400 Gold, own at least 25 locations, earn 25 monthly trade and tax income, and maintain a Marketplace or Guild Hall (or 55% Burghers satisfaction)."
 oe_msn_tnc_08_obsidian_to_firearms:0 "From Obsidian to Steel & Firearms"
 oe_msn_tnc_08_obsidian_to_firearms_desc:0 "Eagle and Jaguar knights who once prized razor-sharp macuahuitl obsidian now forge tempered halberds and cast bronze harquebuses inside lake-shore arsenals. Drilling steel-armed [regulars|e] sharpens [army_tradition|e], modernizes the [army|e], and embeds military [advances|e] in warrior orders."
 oe_msn_tnc_08_obsidian_to_firearms_req_tt:0 "Reach the Age of Discovery or 20 Army Tradition, and build a Weapon Guild or Armory (or reach 25 Army Tradition)."
 oe_msn_tnc_09_transoceanic_visitors:0 "Meeting the Transoceanic Arrivals"
 oe_msn_tnc_09_transoceanic_visitors_desc:0 "When tall-masted caravels appear off the eastern surf, Tenochtitlan responds not with panic but with calculated [diplomacy|e] and controlled exchange. Studying foreign [institutions|e] and ocean-going [advances|e] wins sovereign [diplomatic_reputation|e] across both hemispheres."
 oe_msn_tnc_09_transoceanic_visitors_req_tt:0 "Encounter Old World or Elysian arrivals (or reach the Age of Discovery), and embrace Feudalism, New World, or Pike and Shot (or reach 18 Stability)."
 oe_msn_tnc_10_undying_sun_empire:0 "Empire of the Undying Sun"
 oe_msn_tnc_10_undying_sun_empire_desc:0 "The Fifth Sun refuses to set over the shining causeways of Tenochtitlan, now recognized from the Andes to Europe as a sovereign [great_power|e]. Unmatched [prosperity|e], enduring [stability|e], and radiant imperial [prestige|e] proclaim an unbroken Mexica century."
 oe_msn_tnc_10_undying_sun_empire_req_tt:0 "Own or have subjects own Tenochtitlan, have 20 Stability, own 35 locations, reach 24 Development in our capital, and become a Great Power or earn 55 monthly trade and tax income."
 oe_msn_csu_destiny:0 "#bold #color_yellow Tawantinsuyu: Incan Andean Destiny#!#!"
 oe_msn_csu_destiny_DESCRIPTION:0 "From Sacred Qusqu and the Qhapaq Nan to Pacific Andean Supremacy"
 oe_msn_csu_destiny_CRITERIA_DESCRIPTION:0 "Build the Qhapaq Nan road network and vertical economy, unite the Four Quarters from Quito to Arequipa, and master the Pacific."
 oe_msn_csu_destiny_BUTTON_TOOLTIP:0 "Embark on the Incan Destiny"
 oe_msn_csu_destiny_BUTTON_DETAILS:0 "A focused ten-task destiny for Tawantinsuyu (CSU/INC): secure the Sacred Valley at Qusqu, weave the Qhapaq Nan highland road network with vertical terraced farms and quipu archives, unite Quito, Chimor, and Arequipa, and break out onto the Pacific Ocean."
 oe_msn_csu_01_sacred_valley_qusqu:0 "Sacred Valley: Qusqu & Quillarumioc"
 oe_msn_csu_01_sacred_valley_qusqu_desc:0 "Laid out in the shape of a sacred puma where mountain rivers meet, Qusqu anchors the royal panacas as the navel of the world. Strengthening our high-altitude [capital|e] elevates valley [development|e], secures Sapa Inca [legitimacy|e], and stabilizes alpine [stability|e]."
 oe_msn_csu_01_sacred_valley_qusqu_req_tt:0 "Own or have subjects own Qusqu and Quillarumioc, have at least 5 Stability, and reach 12 Development in our capital."
 oe_msn_csu_02_qhapaq_nan_roads:0 "Qhapaq Nan Royal Roads & Tambos"
 oe_msn_csu_02_qhapaq_nan_roads_desc:0 "Stone stairways, fiber suspension bridges, and stocked tambo waystations turn jagged cordilleras into the swift Qhapaq Nan highway. Relay chasqui runners project immediate [control|e] across mountain passes, speeding [army|e] marches and enriching provincial [prosperity|e] with swift [trade|e]."
 oe_msn_csu_02_qhapaq_nan_roads_req_tt:0 "Own or have subjects own Qusqu, and either connect a Qhapaq Nan road to Qusqu, build a Quipu Tambo Archive, or own at least 12 locations."
 oe_msn_csu_03_vertical_terraces_mita:0 "Vertical Terraces & Mita Granaries"
 oe_msn_csu_03_vertical_terraces_mita_desc:0 "Tiered stone andenes harvest maize in warm gorges and frost-hardy potatoes on cold punas, filling state qullqa storehouses through rotational mita service. Investing in irrigation [buildings|e] guards peasant [estate_satisfaction|e], deepens [development|e], and feeds vast [manpower|e] reserves."
 oe_msn_csu_03_vertical_terraces_mita_req_tt:0 "Own or have subjects own Qusqu, have 12 Stability, 200 Gold, 50% Peasants satisfaction, and build a Granary or Aqueduct System (or reach 16 Development in our capital)."
 oe_msn_csu_04_quipu_coricancha_sun:0 "Quipu Accounting & Coricancha Temple"
 oe_msn_csu_04_quipu_coricancha_sun_desc:0 "Beneath the gold-plated walls of Coricancha, quipucamayoc accountants knot census totals, llama herds, and tribute quotas onto dyed cotton cords. Perfecting this [cabinet|e] audit system raises [crown_power|e], enriches [cultural_tradition|e], and spreads Inti's [religious_influence|e]."
 oe_msn_csu_04_quipu_coricancha_sun_req_tt:0 "Own or have subjects own Qusqu, have 15 Stability, 50% Clergy satisfaction, and build a Temple or Scriptorium (or reach 18 Development in our capital)."
 oe_msn_csu_05_north_quito_chimu:0 "Northern Suyu: Quito & Chan Chan"
 oe_msn_csu_05_north_quito_chimu_desc:0 "Subduing the adobe metropolis of Chan Chan and raising an equatorial stronghold at Quito completes Chinchaysuyu from desert oasis to volcanic highland. Integrating both [core|e] hubs draws Chimu goldsmith [prosperity|e], swells imperial [prestige|e], and anchors northern [control|e]."
 oe_msn_csu_05_north_quito_chimu_req_tt:0 "Own or have subjects own Quito and Chan Chan."
 oe_msn_csu_06_south_arequipa_coast:0 "Southern Suyu: Arequipa & the Coast"
 oe_msn_csu_06_south_arequipa_coast_desc:0 "Volcanic sillar stone quarries at Arequipa and guano-rich Pacific coves bind the altiplano herds to southern coastal fisheries. Securing this maritime [core|e] boosts southern [development|e], yields steady [gold|e] tolls, and trains coastal [sailors|e] along the Humboldt Current."
 oe_msn_csu_06_south_arequipa_coast_req_tt:0 "Own or have subjects own Arequipa and control at least one port."
 oe_msn_csu_07_pacific_ports_silver:0 "Pacific Emporia & Silver Treasury"
 oe_msn_csu_07_pacific_ports_silver_desc:0 "Silver lodes of the high cordillera and balsa-raft convoys bearing Spondylus shell turn our Pacific littoral into a continental bullion corridor. Regulating coastal [market|e] exchanges multiplies [trade|e] revenue, fills state [gold|e] vaults, and guards against runaway [inflation|e]."
 oe_msn_csu_07_pacific_ports_silver_req_tt:0 "Hold 400 Gold, own 25 locations, earn 25 monthly trade and tax income, and build a Marketplace or Wharf (or hold 4 ports)."
 oe_msn_csu_08_andean_mountain_forts:0 "Andean Cloud-Fortress Bastions"
 oe_msn_csu_08_andean_mountain_forts_desc:0 "Cyclopean zigzag ramparts at Sacsayhuaman and Ollantaytambo interlock without mortar atop knife-edge ridges, defying any invader from sierra or coast. Garrisoning every mountain [fort|e] drills highland [army_tradition|e], hardens our [army|e], and safeguards imperial [stability|e]."
 oe_msn_csu_08_andean_mountain_forts_req_tt:0 "Own at least 18 locations, have 10 Stability, and build a Castle (or reach 18 Army Tradition)."
 oe_msn_csu_09_oceanic_breakthrough:0 "Pacific Breakthrough & Modern Fleets"
 oe_msn_csu_09_oceanic_breakthrough_desc:0 "Remembering Tupac Yupanqui's legendary Pacific voyage, royal shipwrights fuse Andean hardwood frames with blue-water rigging and navigational [advances|e]. Building an oceanic fleet sharpens [navy_tradition|e], spreads [maritime_presence|e], and welcomes global [institutions|e]."
 oe_msn_csu_09_oceanic_breakthrough_req_tt:0 "Reach the Age of Discovery or 15 Navy Tradition, embrace Feudalism, New World, or Professional Armies (or 20 Navy Tradition), and build a Wharf or Dock (or hold 4 ports)."
 oe_msn_csu_10_lord_of_four_quarters:0 "Lord of the Four Quarters: Tawantinsuyu"
 oe_msn_csu_10_lord_of_four_quarters_desc:0 "Chinchaysuyu, Antisuyu, Qullasuyu, and Kuntisuyu bow as one under the golden sun-disk of Qusqu, unbroken before the world as a sovereign [great_power|e]. Sovereign [legitimacy|e], enduring Andean [prosperity|e], and unmatched [prestige|e] immortalize Tawantinsuyu."
 oe_msn_csu_10_lord_of_four_quarters_req_tt:0 "Own or have subjects own Qusqu, have 20 Stability, own 35 locations, reach 22 Development in our capital, and become a Great Power or earn 55 monthly trade and tax income."
