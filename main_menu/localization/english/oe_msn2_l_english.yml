 oe_msn_csu_05_north_quito_chimu_req_tt:0 "Control Quito and Chan Chan directly or via subjects."
 oe_msn_csu_06_south_arequipa_coast:0 "Southern Suyu: Arequipa & the Coast"
 oe_msn_csu_06_south_arequipa_coast_desc:0 "Secure Arequipa and the southern Pacific approaches to anchor imperial rule over the southern highlands."
 oe_msn_csu_06_south_arequipa_coast_req_tt:0 "Control Arequipa directly or via subjects."
 oe_msn_csu_07_pacific_ports_silver:0 "Pacific Emporia & Silver Treasury"
 oe_msn_csu_07_pacific_ports_silver_desc:0 "Coordinate Andean silver extraction with thriving Pacific ports to turn Tawantinsuyu into an oceanic bullion hub."
 oe_msn_csu_07_pacific_ports_silver_req_tt:0 "Hold at least 400 Gold and 25 locations."
 oe_msn_csu_08_andean_mountain_forts:0 "Andean Cloud-Fortress Bastions"
