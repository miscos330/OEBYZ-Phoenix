l_english:
 oe_byz_parish_hospital: "Parish Hospital"
 oe_byz_parish_hospital_desc: "Parish clergy tend the sick, store medicines and support mothers, bringing care to both towns and villages. Available to Byzantium after ending the Phoenix Reborn disaster and completing Centralization. Limited to one level per location, employing 200 Clergy. Local Disease Resistance +10% and Population Growth +0.1%. Upkeep consumes Fiber Crops, Tools, Paper, Books, Medicaments, Mercury and Glass."
 oe_byz_promote_births: "Promote Population Growth"
 oe_byz_promote_births_desc: "The Logothetes coordinate childcare relief, midwifery and support for families. Choose a province: while assigned, its conquerable locations directly owned by Byzantium gain Population Growth +0.1%. Up to three cabinet members may perform this action in different provinces. The effect scales with Cabinet Efficiency."
 oe_byz_imperial_healthcare: "Imperial Healthcare"
 oe_byz_imperial_healthcare_desc: "Coordinate physicians, medicines and parish care throughout a region. While assigned, conquerable locations in the selected region directly owned by Byzantium gain Disease Resistance +5%, Monthly Prosperity +0.1%, and Migration Attraction +0.1. Up to three cabinet members may perform this action in different regions. All effects scale with Cabinet Efficiency."
 oe_byz_trade_directorate: "Directorate of Trade"
 oe_byz_trade_directorate_desc: "A dedicated office coordinates customs houses, shipping routes and commercial records. While assigned, the country gains Export Efficiency +1% and Import Efficiency +1%, scaling with Cabinet Efficiency. Only one cabinet member may perform this action at a time."
 OE_BYZ_WELFARE_MAX_THREE: "Fewer than three cabinet members are performing this action."
 oe_byz_welfare_choose_province: "Choose a province to promote population growth"
 oe_byz_welfare_no_province: "No eligible province: it must contain conquerable locations directly owned by Byzantium and have no cabinet member performing the same task."
 oe_byz_welfare_choose_region: "Choose a region for imperial healthcare"
 oe_byz_welfare_no_region: "No eligible region: it must contain conquerable locations directly owned by Byzantium and have no cabinet member performing the same task."
