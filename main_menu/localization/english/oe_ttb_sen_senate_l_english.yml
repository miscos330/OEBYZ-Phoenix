 oe_ttb_sen.1.t: "The Senate and the Tribute"
 oe_ttb_sen.1.d3: "Andronikos III tried to pay off the Ottomans with tribute, yet it did not stop Orhan from taking Nicomedia in 1337.\n\nNow the senate rings with condemnation of the tribute. The dignitaries say peace bought with gold will not keep our lands, and the emperor's standing suffers with it.\n\nThe senate's grievance over tribute is [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0] now."
 oe_ttb_sen.1.d2: "Andronikos III tried to pay off the Ottomans with tribute, yet it did not stop Orhan from taking Nicomedia in 1337.\n\nNow the senate's resentment of the tribute is out in the open. The dignitaries say the empire's gold buys only a moment's quiet.\n\nThe senate's grievance over tribute is [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0] now."
 oe_ttb_sen.1.d1: "Andronikos III tried to pay off the Ottomans with tribute, yet it did not stop Orhan from taking Nicomedia in 1337.\n\nNow the tribute goes out payment after payment, and the senate is full of talk. The dignitaries complain that the money the provinces send ends up in foreign treasuries.\n\nThe senate's grievance over tribute is [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0] now."
 oe_ttb_sen.1.d0: "Andronikos III tried to pay off the Ottomans with tribute, yet it did not stop Orhan from taking Nicomedia in 1337.\n\nNow the empire has begun to pay tribute abroad. Some in the senate say in private that the gold is gone and the enemy is still at the border. For now it is only talk.\n\nThe senate's grievance over tribute is [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0] now."
 oe_ttb_sen.1.a0: "Let them talk"
 oe_ttb_sen.1.a0.tt: "Nothing else happens. The senate's grievance over tribute rises with every payment and slowly fades each month; it has consequences from 15."
 oe_ttb_sen.1.a1: "We hear them"
 oe_ttb_sen.1.a1.tt: "(Already in effect) 'The Senate Grumbles at the Tribute': nobles' target satisfaction −3%.\nEach chartered city: loyalty −3 (also in the loyalty target for 5 years).\nIt ends when the grievance falls below 5."
 oe_ttb_sen.1.a2: "Bear it for now"
 oe_ttb_sen.1.a2.tt: "(Already in effect) 'The Senate Resents the Tribute': nobles' target satisfaction −6% (replaces the tier below).\nEach province with senate seats (chartered cities, exarchates, despotates): loyalty −3 (also in the loyalty target for 5 years).\nImperial Authority −2.\nIt drops a tier when the grievance falls below 15."
 oe_ttb_sen.1.a3: "That is the price of peace"
 oe_ttb_sen.1.a3.tt: "(Already in effect) 'The Senate Condemns the Tribute': nobles' target satisfaction −10% (replaces the tier below).\nEach province with senate seats (chartered cities, exarchates, despotates): loyalty −5 (also in the loyalty target for 5 years).\nImperial Authority −3.\nIt drops a tier when the grievance falls below 40."
