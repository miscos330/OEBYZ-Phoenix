l_english:
 oe_flavor_byz.1015.t: "A Name to Remember"
 oe_flavor_byz.1015.d: "(Mehmed II)\n\nWhen the last enemy standard fell from the battlements, the army finally ceased to regard Belisarius as merely a young scion of House Osmaris. Throughout the siege he inspected walls and ditches, checked the progress of the works himself, restrained officers eager for a premature assault, and sent engineers and supplies wherever they were needed.\n\nThe defenders had expected to hold out much longer. Only when a breach opened and their relief routes were severed did they realize how tightly the siege had closed around them. The fortress now belongs to the Empire. At court and in the army, the young name on the dispatch is beginning to command attention.\n\nThe storm at Varna may have been no more than a boy’s dream. This surrendered fortress is a victory that no one can deny."
 oe_flavor_byz.1015.a: "Rome has another soldier worth remembering."
 oe_flavor_byz.1015.a.tt: "Osmaris great-house Influence #G +10#!.\nPrestige #G +5#!."
 oe_flavor_byz.1015.historical_info: "The historical Mehmed II became renowned for siege warfare; his capture of Constantinople in 1453 marked a decisive turning point in his reign. Belisarius and his victories in Eastern Roman service belong to this alternate history."
 oe_flavor_byz.1016.t: "The Art of War"
 oe_flavor_byz.1016.d: "(Mehmed II)\n\nWar has begun in Italy, but Belisarius has not marked every village on the map he brings before the Emperor. His finger rests instead upon provincial seats, road junctions and the fortresses capable of sustaining resistance.\n\n“Your Majesty, a province’s strength is not divided equally among its farms. Take its capital, seize its records, granaries and revenue offices, then send your decree into the countryside. Places without walls will have little means to resist. Those cities that still possess fortresses we shall take ourselves.”\n\nHe asks to advance with soldiers, clerks and officials ready to receive each new district, turning every victory directly into imperial territory. Teaching its inhabitants to accept Roman rule and integrating their lands will remain the long work of peace."
 oe_flavor_byz.1016.a: "Proceed. Turn victory into imperial territory."
 oe_flavor_byz.1016.a.tt: "Armies personally commanded by Belisarius for Byzantium gain occupation-to-conquest against wartime enemies in Italy:\nAn occupied unfortified location or a fortress won by siege immediately becomes Byzantine territory.\nTaking a provincial capital also transfers all #Y unfortified#! Italian locations held by wartime enemies in the same geographical province. Other fortresses must be captured separately.\n#Y No new cores#! are granted; existing cores are retained. Neutral countries, Byzantium and its subjects are excluded from the provincial sweep. Other commanders do not gain this ability."
 oe_flavor_byz.1016.historical_info: "The historical Mehmed II combined military conquest with the takeover of local administration, and Ottoman forces captured Otranto in Italy in 1480. This event recasts his career as Belisarius, a commander in Eastern Roman service. The provincial-capital conquest rule is a gameplay mechanic of this mod."
