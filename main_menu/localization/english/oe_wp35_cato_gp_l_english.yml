 # Project Phoenix v31.0 WP35: Cato Heir Education & 3 Great Power Crises.
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_mil_tutoring: "Royal Martial Academy Tutoring"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_mil_tutoring: "Seasoned marshals drill the heir in siegecraft, logistics, and battlefield command."
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_dip_tutoring: "Royal Chancery & Embassy Tutoring"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_dip_tutoring: "Envoys and jurists instruct the heir in treaty-making, courtly rhetoric, and alliances."
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_adm_tutoring: "Royal Exchequer & Law Tutoring"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_adm_tutoring: "Treasurers and magistrates train the heir in state finance, cadastral law, and governance."
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_hum_tutoring: "Royal Humanist Scholarship"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_hum_tutoring: "Humanist polymaths nurture the heir in classical letters, philosophy, and sciences."
 STATIC_MODIFIER_NAME_oe_wp35_mod_cato_prepared_heir: "Prepared Royal Successor"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cato_prepared_heir: "A rigorously educated heir reassures estates and secures dynastic continuity."
 STATIC_MODIFIER_NAME_oe_wp35_mod_koprulu_revival: "Köprülü Imperial Revival"
 STATIC_MODIFIER_DESC_oe_wp35_mod_koprulu_revival: "Resolute grand viziers curb palace corruption, restore fiscal discipline, and revitalize imperial arms."
 STATIC_MODIFIER_NAME_oe_wp35_mod_pragmatic_sanction: "The Pragmatic Sanction"
 STATIC_MODIFIER_DESC_oe_wp35_mod_pragmatic_sanction: "An indivisible dynastic settlement unites the hereditary lands under a single recognized succession."
 STATIC_MODIFIER_NAME_oe_wp35_mod_may_constitution: "Constitutional Commonwealth Reform"
 STATIC_MODIFIER_DESC_oe_wp35_mod_may_constitution: "Curbing magnate veto paralysis restores decisive royal governance and regular standing forces."
 oe_wp35_cato_educate_heir: "Commission Royal Heir Education"
 oe_wp35_cato_educate_heir.title: "Commission Royal Heir Education"
 oe_wp35_cato_educate_heir.desc: "Appoint a distinguished royal tutor to guide the heir through a structured curriculum in military art, statecraft, diplomacy, or humanist letters."
 oe_wp35_cato_educate_heir.a: "Convene the Royal Tutorial Council"
 oe_wp35_cato.1.title: "The Heir's Royal Curriculum"
 oe_wp35_cato.1.desc: "Our young heir has crossed the threshold into formal princely instruction, and the grand council chamber has assembled the kingdom's finest minds to present four rival curricula. Grizzled marshals advocate steel and siegecraft, senior ambassadors champion alliance statecraft, exchequer magistrates press fiscal jurisprudence, and humanist polymaths invoke classical history—waiting for the sovereign to bend the sapling toward the future crown's greatest need."
 oe_wp35_cato.1.a: "Train in Martial Command & Siegecraft"
 oe_wp35_cato.1.b: "Train in Diplomacy & Treaty Statecraft"
 oe_wp35_cato.1.c: "Train in Finance, Law & Administration"
 oe_wp35_cato.1.d: "Train in Humanist Letters & Philosophy"
 oe_wp35_cato.2.title: "Field Maneuvers & Martial Examination"
 oe_wp35_cato.2.desc: "After twelve demanding months of map-table sieges, horseback drills, and classical military treatises, the royal marshals invite our heir onto the autumn muster plain to direct a live two-wing field maneuver. Veteran captains watch intently from horseback to judge whether the future monarch commands with fiery battlefield audacity, disciplined logistical foresight, or the steadying counsel of a veteran military tutor."
 oe_wp35_cato.2.a: "Fund full field maneuvers with veteran cadres"
 oe_wp35_cato.2.b: "Emphasize logistics and garrison administration"
 oe_wp35_cato.2.c: "Retain the senior marshal-tutor in royal service"
 oe_wp35_cato.3.title: "Mock Embassy & Chancery Disputation"
 oe_wp35_cato.3.desc: "Beneath tapestried vaults in the royal chancery, our senior chancellor has staged an elaborate diplomatic tribunal attended by visiting foreign ambassadors. Before this discerning audience, the young heir must defend maritime trade clauses, weigh dynastic marriage terms, and counter subtle provocations without losing regal poise—a public rehearsal watched closely by every neighboring court."
 oe_wp35_cato.3.a: "Sponsor a full court reception for foreign envoys"
 oe_wp35_cato.3.b: "Focus on chancery archives and treaty drafting"
 oe_wp35_cato.3.c: "Elevate the seasoned royal envoy-tutor to the council"
 oe_wp35_cato.4.title: "Exchequer Audit & Realm Survey"
 oe_wp35_cato.4.desc: "Spreading real provincial tax ledgers, customs manifests, and disputed land charters across the long oak table of the Exchequer, our senior treasurers challenge the heir to balance an entire fiscal year without alienating key estates. Whether the young successor rides out to inspect distant bailiwicks in person or masters central statute books beside seasoned auditors will leave a lasting stamp on the realm's future governance."
 oe_wp35_cato.4.a: "Commission a full provincial inspection tour"
 oe_wp35_cato.4.b: "Keep the heir at court auditing central charters"
 oe_wp35_cato.4.c: "Appoint the master exchequer tutor to our cabinet"
 oe_wp35_cato.5.title: "Humanist Academy & Royal Library"
 oe_wp35_cato.5.desc: "Renowned astronomers, classical philologists, and moral philosophers have answered the royal summons, turning the palace library into a vibrant colloquium of manuscripts, globes, and spirited debate. Listening intently as our heir weighs ancient Roman histories against contemporary statecraft, visiting scholars proclaim that an enlightened sovereign could usher our court into a golden age of letters and governance."
 oe_wp35_cato.5.a: "Endow a royal colloquium and manuscript collection"
 oe_wp35_cato.5.b: "Conclude with quiet classical tutorials"
 oe_wp35_cato.5.c: "Keep the foremost humanist scholar as court counselor"
 oe_wp35_cato.6.title: "Completion of the Heir's Education"
 oe_wp35_cato.6.desc: "Before an admiring assembly of nobles, clergy, burghers, and visiting envoys, our royal heir has passed the final examination of the Tutorial Council with rare distinction. Poised in speech, seasoned in judgment, and deeply versed in the burdens of sovereignty, the future monarch steps onto the public stage—reassuring every province that our dynasty's continuity rests in truly capable hands."
 oe_wp35_cato.6.a: "Proclaim the heir's readiness with capital celebrations"
 oe_wp35_cato.6.b: "Dispatch the newly graduated heir on a unifying realm progress"
 oe_wp35_cato.6.c: "Endow a permanent Royal Tutorial College in the capital"
 oe_wp35_crisis_ottoman_decline: "Ottoman Imperial Decline"
 oe_wp35_crisis_ottoman_decline_desc: "Palace intrigue, Janissary restlessness, fiscal inflation, and provincial ayan autonomy threaten to hollow out the Sublime Porte unless resolute grand viziers restore order."
 oe_wp35_crisis_habsburg_succession: "Habsburg Dual Succession Stress"
 oe_wp35_crisis_habsburg_succession_desc: "Competing hereditary claims, uneasy provincial diets, and foreign envy strain the unity of the Habsburg patrimonial crowns."
 oe_wp35_crisis_polish_partition: "Polish Magnate Partition Crisis"
 oe_wp35_crisis_polish_partition_desc: "Magnate confederations and parliamentary deadlock paralyze the Commonwealth while ambitious great powers circle its borders."
 oe_wp35_gp.1.title: "Shadows Over the Sublime Porte"
 oe_wp35_gp.1.desc: "Alarming dispatches pour through the Imperial Gate into Topkapi: provincial tax arrears swell by the month, clipped silver akces erode market confidence, and restive Janissary barracks echo with demands for lavish accession gifts. While palace factions trade bitter accusations inside the Divan, every veteran statesman recognizes that only disciplined fiscal and military reform can halt the empire's slide."
 oe_wp35_gp.1.a: "Summon the Divan and confront the barracks first"
 oe_wp35_gp.1.b: "Commit emergency treasury funds to audit provincial revenues"
 oe_wp35_gp.1.c: "Empower an austere reforming Grand Vizier immediately"
 oe_wp35_gp.2.title: "Janissary Demands at the Gate"
 oe_wp35_gp.2.desc: "Before dawn in the vast courtyard outside the palace, mutinous Janissary orta commanders have ceremonially overturned their copper soup cauldrons—the dreaded traditional signal of open defiance. Crowds of armed soldiers clamor for double pay, hereditary payroll vouchers, and immunity from muster inspections. Yielding will bleed the treasury white, yet breaking their defiance demands iron nerve."
 oe_wp35_gp.2.a: "Audit the muster rolls and enforce strict discipline"
 oe_wp35_gp.2.b: "Buy off the mutinous barracks for temporary calm"
 oe_wp35_gp.2.c: "Elevate a stern loyal Agha to purge corrupt officers"
 oe_wp35_gp.3.title: "Reining in Provincial Ayan Tax-Farmers"
 oe_wp35_gp.3.desc: "Across Anatolia and the Balkans, entrenched provincial ayan notables have turned lifelong tax-farming contracts into private fiefdoms, siphoning customs duties and withholding provincial levies whenever the capital calls. Presenting stacks of audited petitions to the throne, a resolute Grand Vizier proposes revoking corrupt leases and restoring direct imperial fiscal officers across the eyalets."
 oe_wp35_gp.3.a: "Empower the Grand Vizier to purge corrupt leases"
 oe_wp35_gp.3.b: "Confirm local notables in exchange for an emergency gift"
 oe_wp35_gp.3.c: "Recruit an incorruptible treasury defterdar to rebuild cadastres"
 oe_wp35_gp.4.title: "The Köprülü Revival"
 oe_wp35_gp.4.desc: "Years of unflinching discipline have broken the back of imperial decay: the central treasury ledgers balance in gold, mutinous barracks obey the Sultan's writ without murmur, and chastened provincial governors remit taxes and troops on time. Foreign envoys departing Constantinople report home in awe that the Sublime Porte has shaken off its lethargy and reclaimed the dread vigor of its golden age."
 oe_wp35_gp.4.a: "The crescent shines anew across every frontier!"
 oe_wp35_gp.4.b: "Consolidate the fiscal surplus to fund future campaigns"
 oe_wp35_gp.5.title: "Strain Across the Hereditary Crowns"
 oe_wp35_gp.5.desc: "Uneasy murmurs echo through the gilded diet halls of Vienna, Prague, and Pressburg as provincial estates question whether the patchwork of Habsburg patrimonial kingdoms can remain bound beneath a single heir. Watching eagerly from rival European capitals, ambitious foreign monarchs already dust off ancient marriage treaties and legal claims—forcing us to forge an ironclad dynastic settlement before the union fractures."
 oe_wp35_gp.5.a: "Convene the provincial diets to negotiate a unified law"
 oe_wp35_gp.5.b: "Dispatch royal envoys abroad with generous diplomatic pledges"
 oe_wp35_gp.5.c: "Entrust the dynastic charter to a master imperial jurist"
 oe_wp35_gp.6.title: "Negotiating with the Provincial Diets"
 oe_wp35_gp.6.desc: "Seated behind ancestral coats of arms in the estate chambers, delegates from our Austrian, Bohemian, and Danubian lands deliver a polite yet unyielding ultimatum. Before swearing perpetual fealty to an indivisible royal succession, they insist upon written confirmation of historic local liberties, judicial privileges, and modest tax relief—testing our diplomacy between unity and royal prerogative."
 oe_wp35_gp.6.a: "Grant fiscal concessions to secure unanimous ratification"
 oe_wp35_gp.6.b: "Delay the vote and lean on court loyalists"
 oe_wp35_gp.6.c: "Commission an eloquent Aulic chancellor to win over moderates"
 oe_wp35_gp.7.title: "Foreign Recognition of the Succession"
 oe_wp35_gp.7.desc: "Encrypted dispatches from Paris, Madrid, Berlin, and Constantinople convey the same cool diplomatic calculus: Europe's rival powers will sign solemn treaties honoring our indivisible Habsburg inheritance only if compensated with trade concessions, territorial guarantees, or ceremonial deference. Yet our veteran generals warn that parchment signatures crumble overnight unless backed by full coffers and bayonets."
 oe_wp35_gp.7.a: "Yield minor diplomatic prestige for binding guarantees"
 oe_wp35_gp.7.b: "Rely on the sword rather than parchment promises"
 oe_wp35_gp.7.c: "Dispatch a gifted plenipotentiary envoy to secure balanced pacts"
 oe_wp35_gp.8.title: "Triumph of the Pragmatic Sanction"
 oe_wp35_gp.8.desc: "Trumpets sound across the Hofburg courtyard as the last provincial diet seal and foreign treaty ratification are laid beside the Imperial Crown. Bound forever as an indivisible and inseparable realm under one recognized line, the Habsburg monarchy steps out of the shadow of dynastic fragmentation with renewed prestige, deeper legitimacy, and unshaken confidence across Central Europe."
 oe_wp35_gp.8.a: "Indivisible and inseparable forever!"
 oe_wp35_gp.8.b: "Proclaim an empire-wide amnesty and jubilee celebration"
 oe_wp35_gp.9.title: "Shadow of Partition Over the Commonwealth"
 oe_wp35_gp.9.desc: "Gloom hangs thick over the Sejm chamber in Warsaw as rival magnate confederations once again shout the fatal Liberum Veto, exploding a crucial tax-and-army session into anarchy. Beyond our unguarded borders, three hungry great powers already mass regiments and bribe parliamentary deputies to keep the Commonwealth helpless—unless patriotic reformers break magnate paralysis before foreign ink redraws our map."
 oe_wp35_gp.9.a: "Rally patriotic reformers in the Sejm immediately"
 oe_wp35_gp.9.b: "Invest royal funds to counter foreign bribes directly"
 oe_wp35_gp.9.c: "Elevate a fearless constitutional statesman to lead the cause"
 oe_wp35_gp.10.title: "The Great Sejm Confronts the Magnates"
 oe_wp35_gp.10.desc: "Packed galleries roar as reformist deputies and urban burgher spokesmen lay a sweeping constitutional bill before the Great Sejm: abolish the suicidal Liberum Veto forever, levy equitable taxes on vast magnate estates, and raise a disciplined standing army answerable solely to king and parliament. Conservative magnates rattle their sabers in fury, daring the throne to choose between swift reform and fragile compromise."
 oe_wp35_gp.10.a: "Back the reform coalition and curb magnate vetoes"
 oe_wp35_gp.10.b: "Compromise with conservative confederates"
 oe_wp35_gp.10.c: "Bring a brilliant burgher jurist into the royal ministry"
 oe_wp35_gp.11.title: "Defying Foreign Protectors"
 oe_wp35_gp.11.desc: "Striding uninvited into the royal audience hall, ambassadors of our powerful neighbors deliver an insolent joint note demanding the permanent preservation of 'Golden Liberty'—knowing full well that noble anarchy leaves the Commonwealth defenseless against partition. Patriotic officers crowd the steps outside swearing to die beneath the White Eagle rather than surrender Poland's sovereign right to reform."
 oe_wp35_gp.11.a: "Enact sovereign constitutional reform despite foreign threats"
 oe_wp35_gp.11.b: "Temporize diplomatically to avoid immediate confrontation"
 oe_wp35_gp.11.c: "Commission a resolute patriotic marshal to fortify the frontier"
 oe_wp35_gp.12.title: "Dawn of the Reformed Commonwealth"
 oe_wp35_gp.12.desc: "Church bells ring out from Krakow and Warsaw to Vilnius as the Great Sejm ratifies a modern constitutional settlement by thunderous acclaim. With the Liberum Veto consigned to history, magnate armies folded into regular national regiments, and foreign meddlers sent packing, the reborn Commonwealth stands proud, solvent, and sovereign—defying every partition scheme of Europe's empires."
 oe_wp35_gp.12.a: "Long live the Reformed Commonwealth!"
 oe_wp35_gp.12.b: "Honor the patriots who defended national sovereignty"
