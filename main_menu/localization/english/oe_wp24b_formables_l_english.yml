l_english:
 oe_wp24b_adv_rom_renovatio_senatus: "Renovatio Senatus"
 oe_wp24b_adv_rom_renovatio_senatus_desc: "Recodifies senatorial jurisdiction and provincial magistracies under a single imperial charter, unlocking the Forum of the Phoenix."
 oe_wp24b_adv_rom_palatini_cohort: "Palatini Imperial Cohorts"
 oe_wp24b_adv_rom_palatini_cohort_desc: "Establishes permanent palace-trained legionary cohorts drilled in combined volley and phalanx discipline, unlocking Palatini Imperial Guard regiments."
 oe_wp24b_bld_forum_of_phoenix: "Forum of the Phoenix"
 oe_wp24b_bld_forum_of_phoenix_desc: "A monumental marble civic complex uniting imperial law courts, senatorial archives, and triumphal colonnades at the heart of the restored Roman world."
 oe_wp24b_pm_forum_of_phoenix: "Forum of the Phoenix Maintenance"
 oe_wp24b_u_palatini_guard: "Palatini Imperial Guard"
 oe_wp24b_u_palatini_guard_desc: "Armored imperial household infantry trained to hold the center against pike charges and musket salvos alike."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_rom_senate_concord: "Renovatio Senatus Concord"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_rom_senate_concord: "Senatorial jurisprudence and provincial representation elevate imperial legislation and diplomacy while sharing authority beyond the palace."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_rom_aquila_legions: "Eagles of the Restored Legions"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_rom_aquila_legions: "Standardized legionary drill sharpens battlefield discipline and martial tradition at increased upkeep cost."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_rom_mare_nostrum: "Mare Nostrum Commercial Peace"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_rom_mare_nostrum: "Imperial highways and unified maritime customs expand trade and urban production while curbing aristocratic toll privileges."
 oe_wp24b.101.title: "The Eagle Reborn: Destiny of Restored Rome"
 oe_wp24b.101.desc: "From the Seven Hills to the Golden Horn, heralds proclaim the restoration of the Roman Commonwealth. Senators, marshals, and urban magistrates gather beneath the Phoenix standards to set the founding course of the new imperial age."
 oe_wp24b.101.a: "Proclaim the Renovatio Senatus and restore civic concord"
 oe_wp24b.101.b: "Raise the Golden Eagles and drill standing imperial legions"
 oe_wp24b.101.c: "Charter Mediterranean roads and customs for Mare Nostrum commerce"
 oe_wp24b.102.title: "Codification of the Phoenix Forum"
 oe_wp24b.102.desc: "With the first triumphal season concluded, jurists and architects present the completed provincial legal code and imperial muster rolls for permanent enactment across the restored empire."
 oe_wp24b.102.a: "Inscribe the Statute Code in marble and endow the provincial courts"
 oe_wp24b.102.b: "Distribute triumphal donatives to the estates and garrisons"
 oe_wp24b_adv_lat_outremer_code: "Outremer Feudal Code"
 oe_wp24b_adv_lat_outremer_code_desc: "Harmonizes the Assizes of Romania with Frankish feudal baronies and Aegean maritime charters, unlocking the Citadel of the Latin Patriarchate."
 oe_wp24b_adv_lat_cataphract_knights: "Latin Cataphract Order"
 oe_wp24b_adv_lat_cataphract_knights_desc: "Fuses Western couched-lance chivalry with Eastern barded cavalry armor, unlocking Latin Cataphract-Knights."
 oe_wp24b_bld_latin_patriarchate_citadel: "Citadel of the Latin Patriarchate"
 oe_wp24b_bld_latin_patriarchate_citadel_desc: "A fortified cathedral-citadel housing the Latin Patriarchal chancery, crusader chapter halls, and Aegean garrison magazines."
 oe_wp24b_pm_latin_patriarchate_citadel: "Citadel of the Latin Patriarchate Maintenance"
 oe_wp24b_u_latin_cataphract_knights: "Latin Cataphract-Knights"
 oe_wp24b_u_latin_cataphract_knights_desc: "Barded heavy lancers blending Frankish tournament chivalry with Eastern Roman composite armor."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_lat_assizes_romania: "Assizes of Romania Compact"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_lat_assizes_romania: "A negotiated feudal compact steadies realm stability and Latin diplomatic prestige while conceding baronial autonomy."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_lat_crusader_bastion: "Crusader Bastion of the Straits"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_lat_crusader_bastion: "Dedicated knightly garrisons bolster field morale and fortress defense at steeper military maintenance."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_lat_aegean_charters: "Aegean Maritime Charters"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_lat_aegean_charters: "Commercial leagues across the Straits lift naval morale and trade revenues while provoking mild clerical suspicion."
 oe_wp24b.201.title: "Crown of Romania: Destiny of the Latin Empire"
 oe_wp24b.201.desc: "With the Latin imperial banner flying over the Straits, feudal barons, cathedral prelates, and maritime consuls assemble to define how this Outremer empire shall endure between West and East."
 oe_wp24b.201.a: "Ratify the Assizes of Romania among barons and Greek archons"
 oe_wp24b.201.b: "Summon Western knights to garrison the Bosporus bastion"
 oe_wp24b.201.c: "Grant Aegean maritime charters to merchant communes"
 oe_wp24b.202.title: "Chapter of the Latin Patriarchate"
 oe_wp24b.202.desc: "Envoys from Christendom and commanders of the strait castles convene at the patriarchal precinct to seal the empire's feudal registers and maritime covenants."
 oe_wp24b.202.a: "Confirm the Patriarchal chancery and diplomatic missions"
 oe_wp24b.202.b: "Reinforce the knightly fiefs and Aegean ports"
 oe_wp24b_adv_pru_ordensstaat_arsenal: "Ordensstaat Arsenal Doctrine"
 oe_wp24b_adv_pru_ordensstaat_arsenal_desc: "Transforms the Baltic commandery magazines into a centralized state foundry and logistics corps, unlocking the Konigsberg Grand Armory."
 oe_wp24b_adv_pru_black_eagle_corps: "Black Eagle Grenadier Corps"
 oe_wp24b_adv_pru_black_eagle_corps_desc: "Institutes iron-ramrod platoon fire and rigorous officer academies under the Black Eagle standard, unlocking Black Eagle Grenadiers."
 oe_wp24b_bld_konigsberg_grand_armory: "Konigsberg Grand Armory"
 oe_wp24b_bld_konigsberg_grand_armory_desc: "A disciplined Baltic arsenal combining bronze foundries, powder magazines, and officer cadet barracks."
 oe_wp24b_pm_konigsberg_grand_armory: "Konigsberg Grand Armory Maintenance"
 oe_wp24b_u_black_eagle_grenadiers: "Black Eagle Grenadiers"
 oe_wp24b_u_black_eagle_grenadiers_desc: "Tall shock-and-volley line grenadiers drilled to advance in unbroken cadence through cannon smoke."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_pru_canton_drill: "Prussian Canton Discipline"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_pru_canton_drill: "District conscription and relentless field maneuvers forge sharp discipline and martial tradition while raising army upkeep."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_pru_general_directory: "General Directory of Domains"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_pru_general_directory: "Frugal fiscal auditors improve cabinet efficiency and state revenues while trimming traditional Junker exemptions."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_pru_baltic_foundries: "Baltic Academies & Foundries"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_pru_baltic_foundries: "Technical academies and state workshops boost industrial output and research at higher administrative spending."
 oe_wp24b.301.title: "Iron and Eagle: Destiny of the Prussian State"
 oe_wp24b.301.desc: "The old monastic commanderies of the Baltic have matured into a disciplined state apparatus. Marshals, fiscal councillors, and Konigsberg scholars convene to chart the destiny of the Black Eagle realm."
 oe_wp24b.301.a: "Enforce the Canton Ordinance and permanent regimental drill"
 oe_wp24b.301.b: "Establish the General Directory of War and Domains"
 oe_wp24b.301.c: "Sponsor Konigsberg academies and Baltic state foundries"
 oe_wp24b.302.title: "Charter of the Konigsberg Staff"
 oe_wp24b.302.desc: "Regimental inspectors deliver the first realm-wide audit of armories, canton rolls, and cadet commissions."
 oe_wp24b.302.a: "Codify the officer examinations and artillery standards"
 oe_wp24b.302.b: "Reward provincial estates for funding the frontier magazines"
 oe_wp24b_adv_mng_yongle_secretariat: "Yongle Maritime & Secretariat Legacy"
 oe_wp24b_adv_mng_yongle_secretariat_desc: "Unites Grand Secretariat archive governance with ocean-going shipyard standards, unlocking the Imperial Censorate Pavilion."
 oe_wp24b_adv_mng_shenji_musketeers: "Shenji Firearms Division"
 oe_wp24b_adv_mng_shenji_musketeers_desc: "Standardizes rotating matchlock volleys, wagon barricades, and imperial powder bureaus, unlocking Shenji Musketeer Guards."
 oe_wp24b_bld_imperial_censorate_pavilion: "Imperial Censorate Pavilion"
 oe_wp24b_bld_imperial_censorate_pavilion_desc: "The supreme court of administrative oversight and imperial memorials, auditing provincial magistrates and safeguarding the civil examination canon."
 oe_wp24b_pm_imperial_censorate_pavilion: "Imperial Censorate Pavilion Maintenance"
 oe_wp24b_u_shenji_musketeer_guards: "Shenji Musketeer Guards"
 oe_wp24b_u_shenji_musketeer_guards_desc: "Elite imperial firearms infantry trained in continuous three-rank rotating volley fire behind armored pavise carts."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mng_grand_secretariat: "Grand Secretariat Governance"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mng_grand_secretariat: "Coordinated metropolitan ministries and scholarly memorials raise cabinet efficiency and learning while increasing court upkeep."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mng_shenji_frontier: "Shenji & Nine Garrisons Readiness"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mng_shenji_frontier: "Modernized powder magazines and frontier bastions strengthen siegecraft and defense at higher upkeep."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mng_maritime_tribute: "Southern Seas Superintendencies"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mng_maritime_tribute: "Regulated oceanic ports boost commercial income and merchant reach while straining traditional agrarian levies."
 oe_wp24b.401.title: "Mandate Renewed: Destiny of Great Ming"
 oe_wp24b.401.desc: "Grand Secretaries, frontier commanders, and coastal superintendents assemble before the Dragon Throne as Great Ming consolidates the Middle Kingdom. The court must choose the defining pillar of the new dynastic era."
 oe_wp24b.401.a: "Empower the Grand Secretariat and Imperial Censorate audits"
 oe_wp24b.401.b: "Expand the Shenji firearms bureaus and Nine Garrisons"
 oe_wp24b.401.c: "Reopen the Maritime Trade Superintendencies of the Southern Seas"
 oe_wp24b.402.title: "Memorial of the Censorate Pavilion"
 oe_wp24b.402.desc: "Imperial censors return from the circuits bearing tax registers, granary audits, and coastal shipyard inventories."
 oe_wp24b.402.a: "Confirm the Yellow Registers and scholarly endowments"
 oe_wp24b.402.b: "Remit arrears to stabilize the provinces and prefectures"
 oe_wp24b_adv_mch_eight_banner_council: "Eight-Banner Grand Council"
 oe_wp24b_adv_mch_eight_banner_council_desc: "Integrates the Eight Banners' military-civil households with a swift imperial Grand Council, unlocking the Mukden Imperial Armory."
 oe_wp24b_adv_mch_gilded_banner_guard: "Gilded Banner Guard Regiments"
 oe_wp24b_adv_mch_gilded_banner_guard_desc: "Outfits the senior imperial banners with lamellar brigandines, composite bows, and shock sabers, unlocking Gilded Banner Heavy Cavalry."
 oe_wp24b_bld_mukden_imperial_armory: "Mukden Imperial Armory"
 oe_wp24b_bld_mukden_imperial_armory_desc: "The ancestral Banner ordnance complex of Mukden, storing composite bows, heavy brigandines, and siege artillery for rapid deployment."
 oe_wp24b_pm_mukden_imperial_armory: "Mukden Imperial Armory Maintenance"
 oe_wp24b_u_gilded_banner_cavalry: "Gilded Banner Heavy Cavalry"
 oe_wp24b_u_gilded_banner_cavalry_desc: "Armored imperial banner horsemen combining rapid steppe maneuver with disciplined shock charges."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mch_banner_muster: "Eight-Banner Grand Muster"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mch_banner_muster: "Hereditary banner households expand standing manpower and battlefield resolve at steeper military upkeep."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mch_grand_council: "Imperial Grand Council"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mch_grand_council: "Secret palace memorials sharpen crown power and ministerial speed while restraining autonomous banner princes."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_mch_dual_chancery: "Dual-Script Imperial Chancery"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_mch_dual_chancery: "Bilingual chanceries and frontier courts accelerate integration and tax collection at higher court outlay."
 oe_wp24b.501.title: "Eight Banners Unfurled: Destiny of the Banner Empire"
 oe_wp24b.501.desc: "Beneath the eight colored standards at Mukden and the passes of the Great Wall, banner princes, Mongol allies, and scholar-officials await the sovereign edict that will shape the imperial order."
 oe_wp24b.501.a: "Expand the Eight-Banner muster rolls and frontier garrisons"
 oe_wp24b.501.b: "Centralize statecraft under the Imperial Grand Council"
 oe_wp24b.501.c: "Institute bilingual Manchu-Han ministries and frontier pacification"
 oe_wp24b.502.title: "Ordinance of the Mukden Armory"
 oe_wp24b.502.desc: "Banner commanders present newly cast cannon, inspection scrolls, and garrison maps from Liaodong to the frontier marches."
 oe_wp24b.502.a: "Review the Gilded Banners in full imperial parade"
 oe_wp24b.502.b: "Grant stipends to provincial granaries and banner schools"
 oe_wp24b_adv_yua_great_yassa_yam: "Great Yassa & Imperial Yam"
 oe_wp24b_adv_yua_great_yassa_yam_desc: "Rebuilds the trans-continental Yam relay stations and reaffirms the Great Yassa across steppe tumens and settled circuits, unlocking the Karakorum Golden Orda Pavilion."
 oe_wp24b_adv_yua_kheshig_lancers: "Kheshig Imperial Guard Revival"
 oe_wp24b_adv_yua_kheshig_lancers_desc: "Restores the Khagan's elite day-and-night household guard as an armored shock-lancer corps, unlocking Kheshig Imperial Lancers."
 oe_wp24b_bld_karakorum_orda_pavilion: "Karakorum Golden Orda Pavilion"
 oe_wp24b_bld_karakorum_orda_pavilion_desc: "The ceremonial seat of the Great Kurultai and central Yam relay hub, linking caravan silver roads with the steppe tumens."
 oe_wp24b_pm_karakorum_orda_pavilion: "Karakorum Golden Orda Pavilion Maintenance"
 oe_wp24b_u_kheshig_imperial_lancers: "Kheshig Imperial Lancers"
 oe_wp24b_u_kheshig_imperial_lancers_desc: "The Khagan's lamellar-armored household lancers, renowned for sweeping flank encirclements and decisive lance charges."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_yua_kurultai_tumens: "Tumens of the Eternal Sky"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_yua_kurultai_tumens: "Unified steppe tumens march with unmatched velocity and battle ardor at higher campaign upkeep."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_yua_yam_caravans: "Imperial Yam & Paiza Caravans"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_yua_yam_caravans: "Protected trans-Eurasian relay routes revive caravan trade and merchant reach while curbing tribal raiding tolls."
 STATIC_MODIFIER_NAME_oe_wp24b_mod_yua_dual_court: "Dual Court of the Great Khagan"
 STATIC_MODIFIER_DESC_oe_wp24b_mod_yua_dual_court: "Bridging Borjigin legitimacy with settled chancery offices lifts governance and stability at higher court expense."
 oe_wp24b.601.title: "Banner of the Eternal Sky: Destiny of Northern Yuan"
 oe_wp24b.601.desc: "From the Orkhon river valleys to the northern passes, noyans, Kheshig captains, and Secretariat scribes gather beneath the Nine Yak-Tail Standard to proclaim the resurgence of the Great Yuan."
 oe_wp24b.601.a: "Rally the Six Tumens beneath the Nine Yak-Tail Banner"
 oe_wp24b.601.b: "Reopen the Imperial Yam and Paiza Silk Road passports"
 oe_wp24b.601.c: "Restore the Dual Court of Steppe and Zhongshu Secretariat"
 oe_wp24b.602.title: "Kurultai of the Golden Orda"
 oe_wp24b.602.desc: "Riders arrive along every Yam relay bearing oaths of fealty from the steppe banners and tribute tallies from the caravan towns."
 oe_wp24b.602.a: "Distribute golden Paiza tablets to loyal commanders"
 oe_wp24b.602.b: "Confirm steppe pasture charters and caravan sanctuaries"
