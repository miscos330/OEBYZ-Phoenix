 # NEW 2026-11-22 v13.0 Wave 8 Worker 3 Slot 98 (oe_amr_). Generated by gen_v130_americas.py; edit the generator, not this file.
 oe_amr_qhapaq_nan_road: "Qhapaq Nan Royal Road"
 oe_amr_qhapaq_nan_road_desc: "A high-altitude imperial [road|e] carved across Andean passes with fitted flagstones, suspension bridges, and tambo depots, enabling Chasqui runners and highland armies to outpace mountain terrain."
 build_oe_amr_qhapaq_nan_road: "Build $oe_amr_qhapaq_nan_road$"
 oe_amr_build_qhapaq_nan: "Build $oe_amr_qhapaq_nan_road$"
 oe_amr_build_qhapaq_nan_demand: "Building [ShowRoadTypeNameWithNoTooltip('oe_amr_qhapaq_nan_road')]"
 oe_amr_act_elysian_foederati_exchange: "Chesapeake Foederati Iron-and-Fur Exchange"
 oe_amr_act_elysian_foederati_exchange_desc: "Under the Chesapeake Roman Foederati Compact, exchange northern furs and grain with Nova Elysia for forged iron, firearms, and metallurgical instruction (10-year cooldown, grants reciprocal 10-year modifiers to both realms)."
 oe_amr_act_longhouse_council_summit: "Convene Onondaga Longhouse Council Summit"
 oe_amr_act_longhouse_council_summit_desc: "Summon sachems of the Five Nations and riverland allies before the council fire to renew wampum treaties, gaining stability and an 8-year consensus bonus."
 oe_amr_rf_chinampa_agronomy: "Chinampa Hydraulic Agronomy"
 oe_amr_rf_chinampa_agronomy_desc: "Expand the stone dikes, sluices, and raised chinampa lake-beds across the Valley of Mexico, securing year-round maize harvests and steadying the realm against doom."
 oe_amr_rf_calmecac_codices: "Calmecac Codices and Calendrics"
 oe_amr_rf_calmecac_codices_desc: "Open the Calmecac academies to systematic study of bark-paper codices, astronomy, arithmetic, and law, training a literate administrative corps ready to absorb new institutions."
 oe_amr_rf_pochteca_intelligence: "Pochteca Intelligence Network"
 oe_amr_rf_pochteca_intelligence_desc: "Charter the long-distance Pochteca merchant guilds as imperial couriers and intelligence agents, mapping distant coasts, securing trade lanes, and exposing foreign spies."
 oe_amr_rf_anti_pestilence_herbalism: "Tlamatini Anti-Pestilence Herbalism"
 oe_amr_rf_anti_pestilence_herbalism_desc: "Codify Mesoamerican botanical medicine and establish lakeside quarantine wards along causeway checkpoints, blunting the demographic shock of transoceanic pestilence."
 oe_amr_chinampa_agronomy_complex: "Chinampa Hydraulic Agronomy Complex"
 oe_amr_chinampa_agronomy_complex_desc: "A Mesoamerican lakeside complex of dikes, drainage canals, and raised chinampa beds supporting intensive maize cultivation. Buildable only in Tenochtitlan, Tetzcoco, Tlacopan, Xochimilco, Chalco, Cholollan, and Teotihuacan (one per location); grants realm-wide food and disease-resistance bonuses in the capital. Unlocked by Triple Alliance Tribute and Chinampas."
 oe_amr_chinampa_agronomy_complex_maint: "Chinampa Dike Maintenance"
 oe_amr_quipu_tambo_archive: "Quipu-Tambo Imperial Archive"
 oe_amr_quipu_tambo_archive_desc: "An Andean highland hub uniting knotted Quipu census archives, Chasqui relay stables, and quarantine granaries. Buildable only in Qusqu, Chan Chan, Quito, Hatun Xauxa, Hatunqulla, Chucuito, Tiwanaku, Ishma, and Charka (one per location); cuts road distance cost and build time in the capital. Unlocked by Qhapaq Nan Royal Road Engineering."
 oe_amr_quipu_tambo_archive_maint: "Quipu-Tambo Upkeep"
 oe_amr_grand_council_longhouse: "Great Law Grand Council Longhouse"
 oe_amr_grand_council_longhouse_desc: "The central cedar longhouse guarding the eternal council fire, wampum treaties, and consensus diplomacy of the Five Nations and Mississippi riverlands. Buildable only in Tsikahiotsisto, Canajoharie, Onenioteke, Canadaigua, Skaniatares, and Cahokia (one per location); grants diplomatic reputation and disease resistance in the capital. Unlocked by Kayanerenko:wa Federation."
 oe_amr_grand_council_longhouse_maint: "Council Longhouse Upkeep"
 oe_amr_cab_mesoamerican_reformation: "Mesoamerican Reformation Directorate"
 oe_amr_cab_mesoamerican_reformation_desc: "Assign an administrative minister to coordinate Calmecac manuscript compilation, chinampa irrigation, and herbalist wards, accelerating Nahuatl religious focus progress, literacy, and disease resistance at a slight clergy satisfaction cost."
 oe_amr_cab_mesoamerican_reformation_action: "Direct Mesoamerican Reformation"
 oe_amr_cab_mesoamerican_reformation_active: "Directing Mesoamerican Reformation"
 oe_amr_cab_mesoamerican_reformation_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('monthly_nahualt_reform_progress')]"
 oe_amr_cab_mesoamerican_reformation_action_progress_wordier: "Mesoamerican Reformation Active"
 oe_amr_cab_mesoamerican_reformation_action_progress_long_wordier: "Mesoamerican Reformation Directorate Active"
 oe_amr_cab_mesoamerican_reformation_action_progress_tooltip: "Continuously boosts Nahuatl reform focus progress, literacy growth, and national disease resistance."
 oe_amr_cab_qhapaq_nan_census: "Qhapaq Nan Quipu Census"
 oe_amr_cab_qhapaq_nan_census_desc: "Dispatch Quipucamayoc officials along the royal highway to audit a province's Mit'a rolls and tambo quarantine depots, reducing road distance decay while boosting provincial control and disease resistance."
 oe_amr_cab_qhapaq_nan_census_action: "Conduct Quipu Census in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_amr_cab_qhapaq_nan_census_active: "Auditing Quipu Rolls in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_amr_cab_qhapaq_nan_census_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('global_disease_resistance')]"
 oe_amr_cab_qhapaq_nan_census_action_progress_wordier: "Quipu Census Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_amr_cab_qhapaq_nan_census_action_progress_long_wordier: "Qhapaq Nan Quipu Census and Tambo Quarantine Active in [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_amr_cab_qhapaq_nan_census_action_progress_tooltip: "Audits provincial quipu registers and tambo isolation depots, cutting road proximity decay while raising local control and disease resistance."
 oe_amr_cab_qhapaq_nan_census_select_province: "Select Province for Qhapaq Nan Quipu Census"
 oe_amr_cab_qhapaq_nan_census_no_provinces: "@trigger_no! No eligible owned and controlled province is available for Qhapaq Nan Quipu Census."
 oe_amr_adv_triple_alliance_tribute: "Triple Alliance Tribute and Chinampas"
 oe_amr_adv_triple_alliance_tribute_desc: "Unifies the chinampa lake-gardens of the Valley of Mexico with the tribute rolls of the Triple Alliance, unlocking the Chinampa Hydraulic Agronomy Complex and accelerating Nahuatl reform."
 oe_amr_adv_obsidian_to_steel: "From Obsidian to Matchlock Steel"
 oe_amr_adv_obsidian_to_steel_desc: "Reforges the elite Mesoamerican warrior orders with forged steel blades, matchlock muskets, and herbalist sanitary discipline, lowering institution adoption costs."
 oe_amr_adv_qhapaq_nan_engineering: "Qhapaq Nan Royal Road Engineering"
 oe_amr_adv_qhapaq_nan_engineering_desc: "Masters Andean cliff-cut paving, drainage causeways, and suspension bridges, unlocking both the Qhapaq Nan Royal Road and the Quipu-Tambo Imperial Archive."
 oe_amr_adv_tawantinsuyu_quarantine_mita: "Tawantinsuyu Quarantine Mit'a"
 oe_amr_adv_tawantinsuyu_quarantine_mita_desc: "Adapts the reciprocal Mit'a labor service and freeze-dried highland granaries into a coordinated mountain quarantine system across the four quarters of Tawantinsuyu."
 oe_amr_adv_kayanerenkowa_federation: "Kayanerenko:wa Federation"
 oe_amr_adv_kayanerenkowa_federation_desc: "Codifies the Great Law of Peace and wampum council procedures into a durable federal order, unlocking the Great Law Grand Council Longhouse and expanding diplomatic capacity."
 oe_amr_adv_woodlands_flintlock_diplomacy: "Woodlands Flintlock Diplomacy"
 oe_amr_adv_woodlands_flintlock_diplomacy_desc: "Combines flintlock marksmanship and forest skirmishing with nimble multilateral diplomacy between Nova Elysia and European powers, accelerating native institution growth."
 oe_amr_tribute_and_labor_law: "Tribute and Reciprocal Labor Code"
 oe_amr_tribute_and_labor_law_desc: "Governs how indigenous realms mobilize food, labor, and public works: through the Triple Alliance's tribute quotas over vassal cities, or through Quipu-recorded reciprocal Mit'a service."
 oe_amr_pol_triple_alliance_tribute: "Triple Alliance Tribute Rolls"
 oe_amr_pol_triple_alliance_tribute_desc: "Assesses regular tribute in maize, cocoa, and cloth by painted tribute rolls, preserving local dynasts while securing imperial grain reserves."
 oe_amr_pol_reciprocal_mita_quipu: "Quipu Audits and Reciprocal Mit'a"
 oe_amr_pol_reciprocal_mita_quipu_desc: "Rotates public labor through knotted Quipu registers to build highways, terraces, and quarantine granaries, returning state grain in times of famine or pestilence."
 oe_amr_transatlantic_contact_law: "Transatlantic Contact Doctrine"
 oe_amr_transatlantic_contact_law_desc: "Determines the realm's strategic posture upon encountering Nova Elysia or European Atlantic powers: selective diplomatic exchange for steel and firearms, or sovereign defense across forests and highlands."
 oe_amr_pol_selective_gunpowder_embassy: "Selective Gunpowder Embassies"
 oe_amr_pol_selective_gunpowder_embassy_desc: "Channels foreign iron, firearms, and books through chartered embassies and merchant guilds, rapidly domesticating new technology and institutions."
 oe_amr_pol_sovereign_cordillera_resistance: "Sovereign Cordillera and Woodland Defense"
 oe_amr_pol_sovereign_cordillera_resistance_desc: "Fortifies mountain passes and forest trails with quarantine checkpoints and skirmishing detachments, grinding down invading expeditions."
 oe_amr_triple_alliance_hegemony: "Triple Alliance Hegemony"
 oe_amr_triple_alliance_hegemony_desc: "Consolidates the joint rule of Tenochtitlan, Tetzcoco, and Tlacopan over lake-basin chinampas, warrior orders, and tributary city-states."
 oe_amr_reformed_qhapaq_tawantinsuyu: "Reformed Qhapaq Tawantinsuyu"
 oe_amr_reformed_qhapaq_tawantinsuyu_desc: "Binds the four quarters of Tawantinsuyu from Qusqu through the Qhapaq Nan highway, Quipu census records, and high-altitude tambo quarantine stations."
 oe_amr_haudenosaunee_grand_council: "Haudenosaunee Grand Council"
 oe_amr_haudenosaunee_grand_council_desc: "Unites the member nations under the eternal council fire of the Great Law of Peace, pairing consensus diplomacy with resilient woodland defense."
 oe_amr_priv_pochteca_guild_intelligence: "Pochteca Merchant-Spy Charter"
 oe_amr_priv_pochteca_guild_intelligence_desc: "Confirms the self-governing tribunals and protected caravan rights of the Pochteca guilds in exchange for long-range trade and espionage intelligence."
 oe_amr_priv_quipucamayoc_keepers: "Quipucamayoc Keepers' Mandate"
 oe_amr_priv_quipucamayoc_keepers_desc: "Guarantees the hereditary mandate of the Quipucamayoc keepers over imperial census cords, granary ledgers, and solar calendars."
 oe_amr_priv_clan_mothers_consensus: "Clan Mothers' Council Mandate"
 oe_amr_priv_clan_mothers_consensus_desc: "Upholds the constitutional authority of the Clan Mothers to nominate and recall sachems, strengthening tribal cohesion, food security, and domestic peace."
 oe_amr_player_only_tt: "Only a player-controlled country can use this"
 oe_amr_pachacuti_free_build_reason: "Pachacuti Imperial Charter"
 oe_amr_dec_excan_tlahtoloyan_pact.title: "Forge the Triple Alliance Pact"
 oe_amr_dec_excan_tlahtoloyan_pact.desc: "Unite the martial and tributary order of Tenochtitlan, Tetzcoco, and Tlacopan (from 1415, costs 100 gold). Holding both Teotihuacan and Cholollan grants an additional Twin Pyramids reform synergy."
 oe_amr_dec_excan_tlahtoloyan_pact.a: "Swear the Triple Alliance"
 oe_amr_dec_aztec_pestilence_countermeasure.title: "Launch Mesoamerican Pestilence Countermeasures"
 oe_amr_dec_aztec_pestilence_countermeasure.desc: "Mobilize Tlamatini herbalists and causeway quarantine checkpoints against transoceanic pestilence (from 1490, during the Great Pestilence, or once Nova Elysia has settled; costs 150 gold), establishing Mesoamerica's modernization milestone."
 oe_amr_dec_aztec_pestilence_countermeasure.a: "Enact Herbal Quarantine"
 oe_amr_dec_pachacuti_tawantinsuyu.title: "Inaugurate Pachacuti's Tawantinsuyu Reform"
 oe_amr_dec_pachacuti_tawantinsuyu.desc: "Reorganize the realm around Qusqu (from 1430, requires owning Qusqu, costs 120 gold): unlocks Qhapaq Nan Royal Road Engineering, erects a free Quipu-Tambo Imperial Archive in Qusqu, and lays initial Qhapaq Nan royal road spans to owned neighbors."
 oe_amr_dec_pachacuti_tawantinsuyu.a: "Reforge the Four Quarters"
 oe_amr_dec_inca_highland_quarantine.title: "Activate Andean Tambo Highland Quarantine"
 oe_amr_dec_inca_highland_quarantine.desc: "Seal mountain passes with isolated tambo granaries, quipu health rolls, and Andean febrifuges (from 1490, during the Great Pestilence, or with Quarantine Mit'a; costs 150 gold), establishing Tawantinsuyu's imperial milestone."
 oe_amr_dec_inca_highland_quarantine.a: "Seal the Highland Passes"
 oe_amr_dec_great_law_of_peace.title: "Convene the Great Law of Peace Council"
 oe_amr_dec_great_law_of_peace.desc: "Kindle the council fire beneath the Tree of Peace to codify consensus diplomacy and accelerate peaceful integration of the Haudenosaunee and riverland nations (from 1380, costs 80 gold)."
 oe_amr_dec_great_law_of_peace.a: "Kindle the Council Fire"
 oe_amr_dec_chesapeake_roman_embassy.title: "Dispatch the Chesapeake & Atlantic Embassy"
 oe_amr_dec_chesapeake_roman_embassy.desc: "Send a Grand Council embassy south to Nova Elysia on the Chesapeake to choose between a Roman Foederati Compact and a Pan-American Longhouse Resistance Confederacy (if Nova Elysia has not settled, shifts automatically to European Atlantic Beaver Wars diplomacy; costs 60 gold)."
 oe_amr_dec_chesapeake_roman_embassy.a: "Dispatch the Embassy"
 oe_amr.1.title: "Emerald Chinampas of Lake Tetzcoco"
 oe_amr.1.desc: "Across the shallow waters of Lake Tetzcoco, engineers weave willow stakes and fertile silt into raised chinampa gardens. Year-round harvests of maize and squash swell our lakeside granaries and population."
 oe_amr.1.a: "Expand the chinampa beds and stone sluices"
 oe_amr.1.b: "Channel surplus grain into our warrior orders"
 oe_amr.2.title: "Excan Tlahtoloyan: The Triple Alliance"
 oe_amr.2.desc: "Before the temple stairs, the lake cities of Tenochtitlan, Tetzcoco, and Tlacopan bind their armies, courts, and tribute rolls into the Triple Alliance, uniting the Valley of Mexico into a formidable imperial engine."
 oe_amr.2.a: "Proclaim the Triple Alliance tribute rolls"
 oe_amr.2.b: "Honor the sacred cities and allied dynasts"
 oe_amr.3.title: "Pilgrimage to the Ancient Pyramids: Teotihuacan and Cholollan"
 oe_amr.3.desc: "Morning mist rises over the towering pyramids of Teotihuacan and the sacred precinct of Cholollan. Calmecac astronomers and priests copy ancient calendars and murals, binding our modernization to the deepest prestige of Mesoamerica."
 oe_amr.3.a: "Restore the sacred observatories to accelerate reform"
 oe_amr.3.b: "Open the pyramid sanctuaries to regional pilgrims and merchants"
 oe_amr.4.title: "Pochteca Spies and Calmecac Codices"
 oe_amr.4.desc: "Returning Pochteca caravans bring cocoa, jade, and whispered reports of strange sails along distant shores, while Calmecac scholars petition the crown to expand bark-paper codices of astronomy, law, and statecraft."
 oe_amr.4.a: "Charter both the Pochteca intelligence guild and Calmecac codices"
 oe_amr.4.b: "Tax the returning caravans to fill the war chest"
 oe_amr.5.title: "Tlamatini Herbalism Against the Great Pestilence"
 oe_amr.5.desc: "As word spreads of devastating Old World plagues, Tlamatini physicians and civic wardens institute strict causeway quarantines, clean-water ordinances, and botanical clinics across the lake cities, preserving the demographic core of Mesoamerica."
 oe_amr.5.a: "Enforce realm-wide herbal quarantine and seal the Mesoamerican reform milestone"
 oe_amr.5.b: "Prioritize capital wards and army camps while keeping trade open"
 oe_amr.6.title: "From Obsidian Macuahuitl to Matchlock Steel"
 oe_amr.6.desc: "Furnaces roar day and night as Mesoamerican smiths reverse-engineer steel cuirasses and matchlock barrels acquired by trade or capture. Our warrior orders emerge reborn as disciplined gunpowder regiments."
 oe_amr.6.a: "Re-equip the Triple Alliance regiments with steel and matchlocks"
 oe_amr.6.b: "Pair mobile skirmishers with fortified highland passes"
 oe_amr.7.title: "The Chanka Storm at the Gates of Qusqu"
 oe_amr.7.desc: "Fierce Chanka armies surge through the mountain valleys toward Qusqu. While timid councillors urge flight, a resolute prince rallies every highland village around the Temple of the Sun to hold the sacred capital."
 oe_amr.7.a: "Stand firm at Qusqu and rally the highland levies"
 oe_amr.7.b: "Fortify the passes and outlast the invasion"
 oe_amr.8.title: "Pachacuti and the Four Quarters of Tawantinsuyu"
 oe_amr.8.desc: "Triumphant over rival lords, the Sapa Inca Pachacuti rebuilds Qusqu as the navel of four great quarters, uniting highland valleys through paved highways, knotted quipu records, and reciprocal Mit'a labor."
 oe_amr.8.a: "Enact the full Tawantinsuyu road and Quipu reorganization"
 oe_amr.8.b: "Invest first in highland terraces and local conciliation"
 oe_amr.9.title: "Quipu Cords and the Runners of the Chasqui"
 oe_amr.9.desc: "From station to station along mist-shrouded ridges, Chasqui relay runners carry knotted Quipu ledgers between Qusqu, Hatun Xauxa, Chan Chan, and Quito, keeping every granary and levy accountable to the crown."
 oe_amr.9.a: "Expand the Quipucamayoc corps and Chasqui relays"
 oe_amr.9.b: "Direct surplus Mit'a supplies into central reserves"
 oe_amr.10.title: "First Stones of the Qhapaq Nan"
 oe_amr.10.desc: "As the final fitted stones lock into place above the cloud-filled gorge, the first stretch of our Qhapaq Nan Royal Road opens to runners, llama trains, and highland armies."
 oe_amr.10.a: "Reward the road-builders and extend the royal highway"
 oe_amr.11.title: "Highland Tambo Quarantine and the Great Pestilence"
 oe_amr.11.desc: "As coastal plagues approach the foothills, Tawantinsuyu seals the mountain passes: Chasqui couriers shout dispatches across quarantine lines while isolated tambo granaries dispense freeze-dried potatoes and highland febrifuges, shielding the Andean heartland."
 oe_amr.11.a: "Complete the Qhapaq Nan quarantine network and seal the Andean milestone"
 oe_amr.11.b: "Guard the royal highway and highland mines while sustaining trade"
 oe_amr.12.title: "The Silver Cordillera: From Charka to Quito"
 oe_amr.12.desc: "From the silver smelters of highland Charka to the equatorial observatories of Quito, Andean metallurgists and astronomers fuse native precision with global scientific learning."
 oe_amr.12.a: "Sponsor Charka metallurgy and Quito equatorial astronomy"
 oe_amr.12.b: "Mint highland silver to finance modern armaments"
 oe_amr.13.title: "Kayanerenko:wa: The Tree of Peace at Onondaga"
 oe_amr.13.desc: "Beneath the Great White Pine, sachems and Clan Mothers of the Five Nations bury their war clubs and weave the wampum belts of the Great Law of Peace, uniting the People of the Longhouse in consensus federation."
 oe_amr.13.a: "Establish the Great Law Grand Council across the eastern woodlands"
 oe_amr.13.b: "Keep our warriors vigilant while honoring the council fire"
 oe_amr.14.title: "Wampum Belts and the Mound Cities of Cahokia"
 oe_amr.14.desc: "Along the Great Lakes and Ohio waterways, Longhouse envoys carrying wampum belts establish riverborne trade with the monumental mound cities of Cahokia, linking eastern forests with the Mississippi heartland."
 oe_amr.14.a: "Seal the Great Lakes to Mississippi river trade compact"
 oe_amr.14.b: "Levy river tolls to enrich the council treasury"
 oe_amr.15.title: "The Longhouse and the Two-Headed Eagle: Chesapeake Foederati or Pan-American Resistance?"
 oe_amr.15.desc: "Purple banners bearing the two-headed eagle now fly over walled cities on the Chesapeake! The exiled Romans of Nova Elysia possess forged steel, firearms, and books, and their envoys stand before the Longhouse. Shall the Grand Council ratify an equal Chesapeake Roman Foederati Compact, or raise the war-belt to forge a Pan-American Longhouse Resistance Confederacy?"
 oe_amr.15.a: "Seal the Chesapeake Roman Foederati Compact: exchange furs for iron and firearms"
 oe_amr.15.b: "Forge the Pan-American Longhouse Resistance Confederacy: defend native sovereignty!"
 oe_amr.16.title: "Envoys of the Great Peace at the Chesapeake Senate"
 oe_amr.16.desc: "Sachems from the northern Longhouse enter the Chesapeake Senate bearing white wampum belts, offering to harmonize Roman Foederati law with the Great Law of Peace: steady furs and secure northern borders in return for iron, firearms, and scholarly exchange."
 oe_amr.16.a: "Ratify the reciprocal Chesapeake-Longhouse Foederati Compact"
 oe_amr.16.b: "Accept the pact while asserting Roman primacy and frontier tribute"
 oe_amr.17.title: "Smoke on the Northern Frontier: The Longhouse Confederacy Rises"
 oe_amr.17.desc: "Scouts race back from the northern valleys with grim news: the Haudenosaunee nations and their riverland allies have rejected accommodation with the Two-Headed Eagle, kindling a war-council Confederacy across the northern forests."
 oe_amr.17.a: "Reinforce the northern Limes forts and frontier rangers"
 oe_amr.17.b: "Station Hellenic-Iroquoian interpreters at border posts to keep dialogue alive"
 oe_amr.18.title: "Sails on the Atlantic Horizon: Fur Trade and the Beaver Wars"
 oe_amr.18.desc: "Without an Elysian settlement on the Chesapeake, ships from Old World European powers have reached the Atlantic coast and Saint Lawrence. Their hunger for beaver pelts brings flintlocks, ironware, and fierce commercial rivalry to our doorstep."
 oe_amr.18.a: "Play rival European traders off each other to acquire flintlocks and iron"
 oe_amr.18.b: "Guard woodland sovereignty and mobilize Longhouse guerrilla defenses"
 oe_amr.90.title: "Americas Indigenous Empires & Nova Elysia: Overview"
 oe_amr.90.desc: "Slot 98 Pulses: [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_pulses')|0] | Current Axis (0=None/1=Mesoamerica/2=Andes/3=Haudenosaunee): [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_axis')|0]\nInjected Nahuatl Focuses Completed: [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_nahuatl_focuses')|0] / 4 | Sacred Pyramids Held (Teotihuacan/Cholollan, 0 DLC): [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_sacred_pyramids')|0] / 2\nTriple Alliance Reformed (oe_amr_triple_alliance_reformed): [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_triple_reformed')|0] | Qhapaq Nan Completed (oe_amr_qhapaq_nan_completed): [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_qhapaq_done')|0]\nNova Elysia Present (oe_ely_settled + host): [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_elysia_present')|0] | Elysia Pact State (0=None/1=Foederati/2=Resistance): [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_elysia_pact')|0]\nAmericas Advances Researched: [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_advances')|0] / 6 | Foederati Iron-Fur Exchanges: [ROOT.GetCountry.MakeScope.ScriptValue('oe_amr_v_exchanges')|0]"
 oe_amr.90.a: "Close"
 STATIC_MODIFIER_NAME_oe_amr_chinampa_expansion_mod: "Expanded Lake Chinampas"
 STATIC_MODIFIER_DESC_oe_amr_chinampa_expansion_mod: "Newly reclaimed chinampa lake-beds and sluices keep valley granaries full."
 STATIC_MODIFIER_NAME_oe_amr_triple_alliance_pact_mod: "Excan Tlahtoloyan Compact"
 STATIC_MODIFIER_DESC_oe_amr_triple_alliance_pact_mod: "Tenochtitlan, Tetzcoco, and Tlacopan govern the Valley of Mexico in concert."
 STATIC_MODIFIER_NAME_oe_amr_dual_pyramids_synergy_mod: "Twin Pyramids Sacred Synergy"
 STATIC_MODIFIER_DESC_oe_amr_dual_pyramids_synergy_mod: "Control of both Teotihuacan and Cholollan elevates imperial legitimacy and accelerates Nahuatl reform."
 STATIC_MODIFIER_NAME_oe_amr_sacred_pyramid_pilgrimage_mod: "Sacred Pyramid Pilgrimage"
 STATIC_MODIFIER_DESC_oe_amr_sacred_pyramid_pilgrimage_mod: "Stewardship of an ancient pyramid city strengthens reform momentum and domestic reverence."
