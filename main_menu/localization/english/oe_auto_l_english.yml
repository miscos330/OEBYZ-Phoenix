l_english:
 STATIC_MODIFIER_NAME_oe_auto_mod_theme_subsidy: "Imperial Theme Replenishment Subsidy"
 STATIC_MODIFIER_DESC_oe_auto_mod_theme_subsidy: "Annual replenishment funds disbursed by the Imperial Automation Console to cover theme deficits and restore manpower."
 STATIC_MODIFIER_NAME_oe_auto_mod_subject_stipend: "Overlord Stipend & Goodwill Grant"
 STATIC_MODIFIER_DESC_oe_auto_mod_subject_stipend: "Standardized goodwill stipend distributed via the Renewal Center to steady subject finances and calm dissent."
 STATIC_MODIFIER_NAME_oe_auto_mod_prefect_relief: "Emergency Prefectural Tribute Remission"
 STATIC_MODIFIER_DESC_oe_auto_mod_prefect_relief: "Temporary tribute remission granted to distressed Praetorian Prefectures and Exarchates to stabilize finances and loyalty."
 STATIC_MODIFIER_NAME_oe_auto_mod_parliament_ready: "Parliamentary Summons Preparation"
 STATIC_MODIFIER_DESC_oe_auto_mod_parliament_ready: "Imperial clerks have prepared the parliamentary docket and agendas, ready for formal convocation in the Government panel."
 oe_auto_human_only_tt: "Human-controlled country only"
 oe_auto_console_decision.title: "Imperial Governance Automation Console"
 oe_auto_console_decision.desc: "Open the Imperial Governance Automation Console (disabled by default, strictly human-only with zero AI overhead). Independently toggle annual infrastructure patrols (Feb), prefecture/theme replenishment (Mar), diplomatic/subject/order/parliament radar (Jun), and December ledger archival with configurable treasury floors and annual caps."
 oe_auto_console_decision.a: "Open Governance Automation Console"
 oe_auto_ledger_decision.title: "Inspect Annual Governance Automation Ledger"
 oe_auto_ledger_decision.desc: "Review a transparent read-only report of current-year and last-archived automated actions (granaries, roads, ports/markets, academies, theme subsidies, diplomatic renewals, and live warnings), or pause all automation at once."
 oe_auto_ledger_decision.a: "Open Annual Transparent Ledger"
 OE_QHUD_AUTO: "Auto Gov"
 OE_QHUD_AUTO_TT: "#T Imperial Governance Automation Console#!\nClick to open the governance automation console (OFF by default, human-only with zero AI overhead; independently toggle infrastructure, theme/prefecture subsidies, diplomatic renewals, and annual ledger)."
 oe_auto.1.t: "Imperial Governance Automation Console"
 oe_auto.1.d: "#T Automation Console Status (Human-Only | Default OFF)#!\nMaster Switch #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_master')|0]#! (0 OFF / 1 ON)  Treasury #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_gold')|0]#!  Floor #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_floor')|0]#!  Annual Cap #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_cap')|0]#!\nWartime Building #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_war_ok')|0]#! (0 Pause in War / 1 Allow)  Popup Mode #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_popup')|0]#! (0 Silent Log / 1 Popup)\n\n#T Four Staggered Engines (Feb / Mar / Jun / Dec)#!\nEngine 1 (Feb Provincial Infrastructure: Granaries, Roads, Ports, Academies): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_infra')|0]#! (normal queue, zero debt)\nEngine 2 (Mar Praetorian Prefectures, Exarchates & Theme Subsidies): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_prefect')|0]#! (after Jan quota, max 2/yr)\nEngine 3 (Jun Subject, Religious Order & Parliament Radar): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_diplo')|0]#! (active warnings #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_total')|0]#!)\nEngine 4 (Dec Annual Ledger Archive | Lifetime Automated Actions): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_life_total')|0]#!"
 oe_auto.1.a: "Toggle Master Switch (ON / OFF)"
 oe_auto.1.b: "Toggle Engine 1: Feb Provincial Infrastructure"
 oe_auto.1.c: "Toggle Engine 2: Mar Prefecture & Theme Subsidies"
 oe_auto.1.e: "Toggle Engine 3: Jun Diplomatic & Order Radar"
 oe_auto.1.f: "Configure Treasury Floor, Cap & Popups"
 oe_auto.1.g: "Open Renewal & Warning Center"
 oe_auto.1.h: "Inspect Annual Transparent Ledger"
 oe_auto.1.z: "Close Console"
 oe_auto.10.t: "Governance Automation: Treasury Floor & Caps"
 oe_auto.10.d: "#T Treasury Reserve Guard & Annual Quotas#!\nCurrent Treasury Floor: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_floor')|0]#! Gold (tiers: 500 / 1500 / 3000 / 5000; never queues below floor or while in debt)\nCurrent Annual Build Cap: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_cap')|0]#!/year (tiers: 2 / 3 / 5; always uses standard cost and build time)\nWartime Infrastructure Mode: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_war_ok')|0]#! (0 = pause in war / 1 = allow in war)\nNotification Mode: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_popup')|0]#! (0 = silent annual ledger only / 1 = June & December popups)"
 oe_auto.10.a: "Cycle Treasury Floor (500 / 1500 / 3000 / 5000)"
 oe_auto.10.b: "Cycle Annual Build Cap (2 / 3 / 5)"
 oe_auto.10.c: "Toggle Wartime Infrastructure (Pause / Allow)"
 oe_auto.10.e: "Toggle Notification Mode (Silent / Popup)"
 oe_auto.10.f: "Return to Automation Console"
 oe_auto.10.z: "Save and Close"
 oe_auto.20.t: "Imperial Renewal & Warning Center"
 oe_auto.20.d: "#T Live Imperial Duty Radar (Total Alerts #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_total')|0]#! | Treasury #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_gold')|0]#!)#!\n1. High Liberty Desire / Low Loyalty Subjects: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_subs')|0]#! (including distressed Themes/Exarchates: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_themes')|0]#!)\n2. Overseas Factoria Charter/Lease Ready: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_far')|0]#! (0 None / 1 Ready in Far Seas decisions)\n3. Low-Zeal Religious Orders (Zeal < 35): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_orders')|0]#!\n4. Parliament Idle 6+ Months Past Cooldown: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_parl')|0]#! (0 OK / 1 Ready to call in Government panel)"
 oe_auto.20.a: "Batch Pacify Disloyal Subjects (60 Gold each, max 5)"
 oe_auto.20.b: "Emergency Relief for Themes & Exarchates (100 Gold each, max 3)"
 oe_auto.20.c: "Endow Low-Zeal Religious Orders (80 Gold each, +18 Zeal)"
 oe_auto.20.e: "Prepare Parliamentary Summons Docket (1 yr +5% Legislative Efficiency)"
 oe_auto.20.f: "Return to Automation Console"
 oe_auto.20.z: "Acknowledge and Log to Ledger"
 oe_auto.90.t: "Imperial Governance Automation: Annual Ledger"
 oe_auto.90.d: "#T Automation Control Status (Transparent Ledger)#!\nMaster #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_master')|0]#!  Infra #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_infra')|0]#!  Prefects #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_prefect')|0]#!  Diplo #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_diplo')|0]#!  Popup #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_popup')|0]#!\nTreasury #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_gold')|0]#!  Floor #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_floor')|0]#!  Cap #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_cap')|0]#!/yr  Lifetime Total #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_life_total')|0]#!\n\n#T Current Year-To-Date Breakdown#!\nInfrastructure #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_total')|0]#! (Granaries #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_granary')|0]#! / Roads #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_roads')|0]#! / Trade-Ports #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_trade')|0]#! / Academies #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_edu')|0]#!)\nTheme & Prefecture Subsidies #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_prefect')|0]#!  Diplomatic & Renewal Actions #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_yr_diplo')|0]#!\n\n#T Last Archived Year (Year #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_yr')|0]#!)#!\nInfrastructure #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_total')|0]#! (Granaries #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_granary')|0]#! / Roads #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_roads')|0]#! / Trade-Ports #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_trade')|0]#! / Academies #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_edu')|0]#!)  Subsidies #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_prefect')|0]#!  Diplo #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_last_diplo')|0]#!\n\n#T Current Live Warnings#!\nDisloyal Subjects #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_subs')|0]#!  Distressed Themes/Exarchates #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_themes')|0]#!  Low-Zeal Orders #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_orders')|0]#!  Idle Parliament #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_parl')|0]#!  Overseas Lease #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_auto_rd_warn_far')|0]#!"
 oe_auto.90.a: "Close Ledger"
 oe_auto.90.b: "Refresh Live Figures"
 oe_auto.90.c: "Toggle Silent Log / Popup Mode"
 oe_auto.90.e: "Open Automation Console"
 oe_auto.90.f: "Reset Statistics"
 oe_auto.90.g: "Emergency Pause All Automation"
