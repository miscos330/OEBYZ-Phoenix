 OE_WP33_DIR_FISCAL_TITLE:0 "Imperial Fiscal Assessment"
 OE_WP33_DIR_FISCAL_DESC:0 "Overlord gains +10% Subject Income; subjects gain +9% Tax Efficiency with -5 Loyalty to Overlord for 5 years."
