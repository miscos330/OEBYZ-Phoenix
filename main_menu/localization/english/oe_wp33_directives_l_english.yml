 OE_WP33_AUTO_DIR_TITLE:0 "Auto-Renew Active Subject Directives"
 OE_WP33_AUTO_DIR_DESC:0 "Yearly Strategikon pulse refreshes your active directive on all existing and newly acquired subjects before expiry."
 OE_WP33_AUTO_DIR_TT:0 "Toggle automatic yearly renewal of the currently active Mass Subject Directive (human player only; zero per-frame cost)."
 OE_WP33_AUTO_SUB_TITLE:0 "Auto-Subsidize Struggling Frontier Themes & Vassals"
 OE_WP33_AUTO_SUB_DESC:0 "While treasury >= 500 gold, grants 50 gold and -5 Liberty Desire (max 3 subjects/year) to distressed or low-loyalty subjects."
 OE_WP33_AUTO_SUB_TT:0 "Toggle automatic frontier theme and vassal relief subsidies with a strict 500-gold treasury safety floor and 2-year per-subject cooldown."
 OE_WP33_QUIET_ADMIN_TITLE:0 "Auto-Quiet Routine Administrative Alerts"
 OE_WP33_QUIET_ADMIN_DESC:0 "Runs Strategikon directives and Brebion census updates silently in the background without routine administrative popups."
 OE_WP33_QUIET_ADMIN_TT:0 "Toggle silent background administrative operation for Phoenix Command Dock automation."
 OE_WP33_AUTO_WAR_TITLE:0 "Emergency Wartime Mobilization Auto-Switch"
 OE_WP33_AUTO_WAR_DESC:0 "Automatically switches all subjects to Border Fortification & Levy Mobilization during war, and restores your peacetime directive at peace."
