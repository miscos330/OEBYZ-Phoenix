 OE_WP33_COMPASS_GP_TT:0 "Available to any Great Power or major historical realm (TUR, IRA, AQQ, QAR, MOS, RUS, MUG, DLH, VIJ, FRA, CAS, SPA, GBR, ENG, BYZ, ROM, MNG, CHI, MCH). 180-day cooldown."
