 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_build:0 "Imperial Construction Drive"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_build:0 "Subject directive focusing provincial resources on public works, urban development, and resource extraction."
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_assimilate:0 "Hellenic & Roman Cultural Integration"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_assimilate:0 "Subject directive coordinating administrative control and civic cultural integration."
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_convert:0 "Ecclesiastical Mission Drive"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_convert:0 "Subject directive backing metropolitan sees and parish missions to unify provincial faith."
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_military:0 "Border Fortification & Levy Mobilization"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_military:0 "Subject directive strengthening frontier citadels and accelerating thematic levy mobilization."
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_fiscal_subject:0 "Imperial Fiscal Assessment"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_fiscal_subject:0 "Subject directive tightening provincial tax assessment at the cost of heightened resentment toward the overlord."
 STATIC_MODIFIER_NAME_oe_wp33_mod_dir_fiscal_overlord:0 "Imperial Fiscal Cadastre"
 STATIC_MODIFIER_DESC_oe_wp33_mod_dir_fiscal_overlord:0 "Central fiscal oversight increasing tribute and fiscal returns collected from all subjects."
 STATIC_MODIFIER_NAME_oe_wp33_mod_frontier_subsidy:0 "Imperial Frontier Subsidy"
 STATIC_MODIFIER_DESC_oe_wp33_mod_frontier_subsidy:0 "Emergency imperial treasury grant stabilizing a struggling frontier theme or vassal."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_colonial_audit:0 "Overseas Colonial Audit"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_colonial_audit:0 "A one-year imperial audit of overseas charters and viceroyalties accelerating settler migration and subject loyalty at the cost of metropolitan estate grumbling."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_colonial_charter:0 "Viceroyalty Charter Compromise"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_colonial_charter:0 "Broadening local charter privileges reassures colonial assemblies and extends maritime reach while trimming crown tariff yields."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_colonial_mercantile:0 "Crown Mercantile Enforcement"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_colonial_mercantile:0 "Strict navigation acts and customs oversight swell imperial tribute and trade protection while straining overseas subject loyalty."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_gp_centralize:0 "Great Power Reform Push"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_gp_centralize:0 "Focused executive statecraft sharpens cabinet efficiency and sovereign prestige while provoking conservative estates."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_gp_consolidate:0 "Imperial Court Consensus"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_gp_consolidate:0 "Measured concessions to provincial notables calm domestic tensions and ease stability costs while ceding crown leverage."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_culture_assimilate:0 "Classical Assimilation Posture"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_culture_assimilate:0 "State patronage of the court language and civic institutions accelerates cultural assimilation at the expense of confessional leniency."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_culture_cosmopolitan:0 "Cosmopolitan Tolerance Posture"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_culture_cosmopolitan:0 "Broad legal protections for minority faiths and communities preserve imperial harmony while slowing cultural assimilation."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_culture_syncretic:0 "Scholarly Syncretism Posture"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_culture_syncretic:0 "Cross-cultural academies and translation bureaus hasten institution spread and research while testing traditional orthodoxy."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_wonders_builders:0 "Imperial Master Builders Charter"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_wonders_builders:0 "Mobilizing master architects and stone guilds speeds monumental construction and enhances prestige while raising building upkeep."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_wonders_sitonia:0 "Granary & Civic Maintenance"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_wonders_sitonia:0 "Directing crown funds into public granaries, aqueducts, and urban control steadily raises prosperity while trimming tax receipts."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_diplo_accord:0 "Pax & Subject Assurances"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_diplo_accord:0 "Formal diplomatic guarantees elevate imperial standing and calm vassal courts while moderating tribute exactions."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_diplo_leases:0 "Chartered Banking & Maritime Leases"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_diplo_leases:0 "Harmonizing port leases and chartered banking accords expands merchant power and diplomatic capacity while chafing domestic estates."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_era_reform:0 "Era Reform Agenda"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_era_reform:0 "Aligning crown policy with the defining institutions of the age boosts research and innovation while straining traditional stability."
 STATIC_MODIFIER_NAME_oe_wp33_mod_compass_era_horizon:0 "Strategic & Diplomatic Horizon"
 STATIC_MODIFIER_DESC_oe_wp33_mod_compass_era_horizon:0 "Expanding embassies and geopolitical reconnaissance raises diplomatic reputation and envoy flow at a modest fiscal cost."
 oe_wp33.201.t:0 "Colonial Empire & Autonomy Pulse"
 oe_wp33.201.d_overlord:0 "Royal surveyors have completed an audit of our overseas charters and viceroyalties. Project Phoenix provides four core colonial governance decisions in the Decisions ledger: (1) Colonial Charter Tax & Trade Concession to balance tariff revenue against liberty desire, (2) Arbitrate Colonial Viceroyalty Borders to resolve frontier friction, (3) Grant Colonial Self-Government Charter from the Age of Absolutism onward for peaceful dominion reform, and (4) Consolidate Overseas Enclaves alongside Columbian Exchange crop transfers. How shall the Chancellery steer overseas administration?"
 oe_wp33.201.d_subject:0 "Envoys across our colonial assemblies have assessed our standing under the metropole. From the Age of Reformation onward, colonial realms can import Old World livestock and estate agriculture via Columbian Exchange decisions; once the Age of Absolutism dawns and Liberty Desire reaches 55 or higher, the Proclaim Colonial Declaration of Independence decision unlocks in the Decisions ledger, alongside self-government negotiations with the overlord. How shall our assembly prepare?"
 oe_wp33.201.a:0 "Confirm Viceroyalty Charter Compromises"
 oe_wp33.201.b:0 "Enforce Strict Crown Mercantile Tariffs"
 oe_wp33.201.c:0 "File the Colonial Audit Without Further Decree"
 oe_wp33.202.t:0 "Great Power Unique System Briefing"
 oe_wp33.202.d_byz:0 "The Imperial Secretariat has assembled the Roman statecraft dossier. Byzantium and Restored Rome unlock signature Project Phoenix pillars: the 28 Imperial Great Projects (from the Anatolian Phryktoria Beacon Chain and Chora Academy to Capital and Mediterranean Wonders), Armamenton, Pronoia, Sitonia grain administration, Pentarchy diplomacy, Imperial Themes with Heirless Escheatment, and the Praecepta Militaria wartime mobilizations wired right into Tab 2 of this Console."
 oe_wp33.202.d_tur:0 "The Imperial Divan has reviewed the Ottoman statecraft dossier. The Sublime Porte features bespoke decisions and reforms covering Kapikulu Janissary expansion versus Porte centralization, frontier Eyalet management, Anatolian and Balkan gunpowder modernization, and Mediterranean maritime expansion. Balance military vigor against court stability as you expand across three continents."
 oe_wp33.202.d_per:0 "The Royal Chancery has prepared the Iranian statecraft dossier. Persia, Aq Qoyunlu, and Qara Qoyunlu unlock dedicated decisions balancing Qizilbash tribal mobilization against Ghulam court centralization, Silk Road commercial patronage, and sectarian consolidation across the Iranian plateau and Mesopotamia."
 oe_wp33.202.d_rus:0 "The Tsar's Chancellery has compiled the Rus statecraft dossier. Muscovy and Russia feature dedicated reforms spanning Third Rome ideological claims, central service nobility and administrative consolidation, steppe frontier garrisoning, Orthodox autocephaly, and Eurasian expansion pathways."
 oe_wp33.202.d_ind:0 "The Imperial Court has prepared the South Asian statecraft dossier. The Mughals, Delhi Sultanate, and Vijayanagara unlock specialized imperial governance decisions balancing Mansabdar and regional revenue cadastres, religious syncretism versus orthodoxy, Deccan military campaigns, and Indian Ocean maritime trade."
 oe_wp33.202.d_west:0 "The Privy Council has reviewed the Western Great Power dossier. France, Castile/Spain, and England/Great Britain feature signature Project Phoenix mechanics spanning royal centralization and parliamentary compacts, overseas colonial viceroyalties, East India and chartered trading companies, naval armada doctrines, and late-game revolutionary currents."
 oe_wp33.202.d_east:0 "The Grand Secretariat has compiled the Celestial statecraft dossier. Ming, China, and Qing command specialized governance decisions balancing imperial examinations, maritime and tributary circuits, frontier banner or Garrison commands, and late-imperial fiscal reform against dynastic crises."
 oe_wp33.202.d_gp:0 "As a recognized Great Power, our court commands the full suite of Project Phoenix universal imperial mechanics: Empire-Wide Mass Vassal Directives in Tab 2, Imperial Cultural Integration Laws, the Royal Cipher Bureau espionage network, Chartered Banking Houses, Overseas Colonial Charters, and Great Power diplomatic crisis decisions."
 oe_wp33.202.a:0 "Accelerate Executive Centralization"
 oe_wp33.202.b:0 "Broker Court & Estate Consensus"
 oe_wp33.202.c:0 "Archive the Great Power Dossier"
 oe_wp33.203.t:0 "Cultural Synthesis & Assimilation Switch"
 oe_wp33.203.d_default:0 "Our realm currently maintains a balanced default cultural posture. In the Laws screen, Kingdom and Empire realms unlock the Imperial Cultural Integration Law with four enduring policies: Classical Assimilation, Imperial Cosmopolitanism, Federated Millet, and Scholarly Syncretism, complemented by Court Language and Cultural Fusion pathways. Select an immediate 3-year administrative posture below."
 oe_wp33.203.d_assim:0 "Current Posture: Classical Assimilation. Provincial courts are actively promoting the primary court culture and civic identity, pairing strongly with the Classical Assimilation policy under the Imperial Cultural Integration Law and Tab 1 Cultural Integration subject directives. You may hold this course or pivot to Tolerance or Syncretism."
 oe_wp33.203.d_cosmo:0 "Current Posture: Cosmopolitan Tolerance. Imperial law shields minority faiths and regional communities to curb unrest across multi-ethnic domains, complementing Imperial Cosmopolitanism or Federated Millet in the Laws screen. You may renew this posture or switch toward Assimilation or Syncretism."
 oe_wp33.203.d_syncretic:0 "Current Posture: Scholarly Syncretism. Academies and translators are bridging regional traditions to accelerate institution spread and research, pairing with Scholarly Syncretism in the Imperial Cultural Integration Law. Choose whether to maintain this focus or shift posture."
 oe_wp33.203.a:0 "Enact Classical Assimilation Posture"
 oe_wp33.203.b:0 "Enact Cosmopolitan Tolerance Posture"
 oe_wp33.203.c:0 "Enact Scholarly Syncretism Posture"
 oe_wp33.204.t:0 "Great Projects & Imperial Monuments Ledger"
 oe_wp33.204.d_byz:0 "The Office of Imperial Works has audited our monumental readiness. In the Decisions ledger, Byzantium and Restored Rome can charter the 8-Peak Anatolian Phryktoria Beacon Chain, Gregoras Chora Academy, Capital Palace Wonders, Frontier Citadels, and Mediterranean Great Projects, alongside Hippodrome Games, regional Triumphs, Armamenton arsenals, Pronoia thematic land administration, and Sitonia grain reserves."
 oe_wp33.204.d_world:0 "Master builders across our realm have surveyed regional infrastructure and monumental projects. Consult the Infrastructure and Country Decisions menus for bespoke regional wonders, academies, road networks, and urban fortifications unlocked as your treasury, stability, and Age advance. Choose whether to prioritize monumental construction or civic grain and prosperity upkeep."
 oe_wp33.204.a:0 "Charter Imperial Master Builders"
 oe_wp33.204.b:0 "Fund Public Granaries & Civic Maintenance"
 oe_wp33.204.c:0 "Record the Monument Ledger Only"
 oe_wp33.205.t:0 "Pax & Bilateral Treaties Audit"
 oe_wp33.205.d_peace:0 "The Chancellery has refreshed the Brebion subject census and audited our peacetime diplomatic architecture. Key Project Phoenix instruments available in peace include: Tab 1 & Tab 2 Mass Subject Directives, Chartered Banking Houses and loan regulation, Maritime Trade Leases, bilateral peace treaties, and from the Age of Discovery onward, the Royal Cipher Bureau espionage decisions."
 oe_wp33.205.d_war:0 "Our realm is currently at war, and the Chancellery has refreshed the Brebion subject census. Enable Emergency Wartime Mobilization Auto-Switch in Tab 3 (Strategikon) to automatically fortify subjects during war and restore peacetime policies afterward, monitor distressed vassal loyalty in Tab 4 (Brebion), and leverage Chartered Banking credit or diplomatic assurances to hold coalitions steady."
 oe_wp33.205.a:0 "Issue Pax & Subject Loyalty Assurances"
 oe_wp33.205.b:0 "Audit Chartered Banking & Maritime Leases"
 oe_wp33.205.c:0 "Keep Current Diplomatic Posture"
 oe_wp33.206.t:0 "Campaign & Era Handbook"
 oe_wp33.206.d_age1:0 "Current Era: Age of Traditions. Early priorities in Project Phoenix: consolidate your core realm and subject network, track Themes and Vassals via Tab 4 (Brebion), configure zero-lag automation in Tab 3 (Strategikon), issue construction or military directives in Tab 1, and prepare treasury and stability for Renaissance academies, banking houses, and Great Projects."
 oe_wp33.206.d_age2:0 "Current Era: Age of Renaissance. Newly prominent systems: charter regional Great Projects, academies, and urban infrastructure; enact Imperial Cultural Integration Laws once you reach Kingdom or Empire rank; establish Chartered Banking Houses; and coordinate subjects at scale through Tab 1 Directives and Tab 2 Imperial Edicts."
 oe_wp33.206.d_age3:0 "Current Era: Age of Discovery. Overseas horizons open: sponsor Colonial Charters and consolidate conquered enclaves into unified Colonial Viceroyalties, establish the Royal Cipher Bureau in Decisions for court espionage, expand Maritime Trade Leases, and monitor colonial loyalty using the Tab 5 Colonial Pulse."
 oe_wp33.206.d_age4:0 "Current Era: Age of Reformation. Confessional and oceanic shifts accelerate: trigger Global Columbian Exchange 2.0 decisions to introduce New World staples or Old World livestock, align your Cultural Synthesis posture between Assimilation and Tolerance in Tab 5, and reinforce frontier fortifications across vassals and themes."
 oe_wp33.206.d_age5:0 "Current Era: Age of Absolutism. Imperial centralization peaks: balance Crown Power against estate satisfaction, manage Colonial Self-Government Charters versus rising colonial Liberty Desire (overseas colonies may proclaim independence at 55+ Liberty Desire), and deploy Great Power unique reforms and Chartered Trading Companies."
 oe_wp33.206.d_age6:0 "Current Era: Age of Revolutions. The culminating era of Project Phoenix: navigate Revolutionary Clamor, Constitutional Reforms, Industrialization, Colonial Independence movements, and Late-Game Great Power Crises. Use the full 5-Tab Phoenix Master Console to coordinate global vassals, wartime mobilization, and diplomatic stability."
 oe_wp33.206.a:0 "Adopt Era Reform & Innovation Agenda"
 oe_wp33.206.b:0 "Expand Strategic & Diplomatic Horizon"
 oe_wp33.206.c:0 "Close the Campaign & Era Handbook"
