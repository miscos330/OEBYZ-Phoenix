 OE_YN_BTN_P_SHUMIYUAN: "Shumiyuan"
 OE_YN_BTN_P_SHUMIYUAN_DESC: "Grant wartime Branch Bureau of Military Affairs powers (#Y 5y cooldown#! ).\nEffect: #G +10%#! local control, 5y #G +25%#! local levies and pacification.\nCost: #R +18#! provincial warlordism."
 OE_YN_BTN_P_CENSORATE: "Censorate"
 OE_YN_BTN_P_CENSORATE_DESC: "Dispatch a Branch Censorate inspection (#Y 25 gold#!, #Y 5y cooldown#! ).\nEffect: #G -20#! warlordism, #G +10#! loyalty, 5y #G +8%#! anti-corruption tax output, #G -0.5%#! national inflation."
 OE_YN_BTN_P_REQUISITION: "Requisition"
 OE_YN_BTN_P_REQUISITION_DESC: "Levy canal grain and salt taxes from this secretariat (#Y 4y cooldown#! ).\nEffect: Gain #G 1.5 months income#! (40-220 gold) and #G +250#! Dadu province food; requisitioning Jiangzhe or Jiangxi also rebates #G +15 gold#! on Stipend disbursements.\nCost: #R -12#! loyalty and #R +5#! warlordism."
 OE_YN_BTN_P_STIPEND: "Stipend"
 OE_YN_BTN_P_STIPEND_DESC: "Disburse imperial garrison stipends and military-colony grain (#Y 50 gold#!, or #G 35 net#! if Jiangzhe/Jiangxi requisition is active; #Y 4y cooldown#! ).\nEffect: Target gains #G +100 gold#!, #G +0.5 manpower#!, #G +10#! loyalty, #G -6#! warlordism, and 5y Imperial Garrison Stipend (#G +25%#! army upkeep efficiency, #G +20%#! reinforcement, #G -20%#! food consumption); landed secretariats also gain #G +180#! capital province food.\nDisbursing #Y twice#! to a Frontier Secretariat (Lingbei/Liaoyang/Gansu) permanently establishes Frontier Tuntian Colonies and buffs Great Yuan's northern supply & cavalry!"
 OE_YN_BTN_P_SANSI: "3-Comm."
 OE_YN_BTN_P_SANSI_DESC: "Split the secretariat into Three Commissions (requires Yuan Restoration or Grand Debate unlock, loyalty #Y >=75#!, warlordism #Y <=25#!, once per province).\nEffect: Permanently locks warlordism to #G 0#! and grants permanent Three-Commission bonuses (#G +8%#! max control, #G +10%#! tax output, #G +10%#! levies)."
 OE_YN_BTN_W_SEAL: "Bestow Seal"
 OE_YN_BTN_W_SEAL_DESC: "Award a golden seal and imperial decree (#Y 35 gold#!, #Y 5 prestige#!, #Y 3y cooldown#! ).\nEffect: #G +15#! prince loyalty and #G +25#! opinion of the Great Yuan."
 OE_YN_BTN_W_BANNER: "Summon Banner"
 OE_YN_BTN_W_BANNER_DESC: "Call this prince's cavalry banners with a tiger tally (requires loyalty #Y >=65#! and prince manpower #Y >=800#!; costs #Y 40 gold#! and #Y -800#! real prince manpower, #Y 5y cooldown#! ).\nEffect: Mustering #G 2 Mongol cavalry regiments#! (1 light + 1 heavy) at Dadu or the capital, #R -4#! loyalty."
 OE_YN_BTN_W_COMMUTE: "Commute Fief"
 OE_YN_BTN_W_COMMUTE_DESC: "Commute appanage grants and convert this prince to a regular vassal (requires Yuan Restoration or year #Y 1400+#! and loyalty #Y >=75#! ).\nEffect: Permanently clears the appanage prince flag (ends Suici drain) and grants a 20-year transition bonus."
