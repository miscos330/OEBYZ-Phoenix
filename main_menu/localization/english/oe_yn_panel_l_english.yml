 oe_yn_sup_steady: "Steady"
 OE_YN_SUPPLY_TT: "Provincial garrison treasury & logistics status:\n#G Tuntian#!: Frontier secretariat has completed Permanent Tuntian Colonies (permanent grain, winter supply & cavalry buffs).\n#G Stipend#!: Active 5y Imperial Garrison Stipend (upkeep, reinforcement & food relief).\n#Y Shumiyuan#!: Wartime Branch Bureau of Military Affairs active (expanded garrison & war participation).\n#R Low Gold#!: Secretariat treasury below 30 gold — click Stipend to keep garrisons funded.\n#R Warlord#!: Warlordism >=60 — dispatch Branch Censorate to curb local autonomy."
 OE_YN_COL_PRINCE: "Prince"
 OE_YN_COL_TITLE: "Title"
 OE_YN_COL_PAID: "Grant"
 OE_YN_COL_ATT: "Kurultai"
 OE_YN_ROLE_TT: "Five Regional Governance Profiles: Wealth/Canal (Jiangzhe/Jiangxi), Central Front (Henan/Huguang), Pass/Fortress (Shaanxi/Sichuan), Frontier Cavalry (Lingbei/Liaoyang/Gansu, linked to Yam roads), and Yunnan/Zhengdong."
 OE_YN_LOY_TT: "Each secretariat's independent loyalty (#Y 0#! to #Y 100#! ), shaped by its own territorial losses, warlordism and provincial events; #Y -1#! means uninitialized."
 OE_YN_WL_TT: "Provincial warlordism (#Y 0#! to #Y 100#! ). Wartime Shumiyuan powers raise it; Censorate audits lower it; reaching #R >=60#! triggers warlordism penalties and revolt hazards; Three-Commission reform locks it to #G 0#!."
 OE_YN_PTIER_TT: "Compliant (>=70): activates top-tier regional bonuses (tax/goods, levies, forts, steppe cavalry, or special synergy).\nNormal (40-69): activates active baseline regional bonuses.\nSlack (20-39): levy size #R -10%#!, max control #R -5%#!.\nEstranged (<20): levy size #R -20%#!, max control #R -10%#!."
 OE_YN_WLOY_TT: "The prince's loyalty (#Y 0#! to #Y 100#! ). Holding their Central Plains Wuhusi fief raises loyalty target and directly discounts cash Suici."
 OE_YN_WTIER_TT: "Loyal (>=70): boosts princely cavalry, manpower and supply, and stacks #G +1.5% cavalry / +2% manpower#! on the Yuan (up to 10 stacks).\nAloof (40-69): mild manpower and loyalty drag.\nEstranged (<40): severe loyalty/trade drag and crisis risk when Suppression Momentum is low."
 OE_YN_PAID_TT: "The last year this prince received a grant; #Y 0#! means never."
 OE_YN_ATT_TT: "The last year this prince came to the Shangdu Kurultai; #Y 0#! means never."
 mapmode_oe_yn_tiers_name: "Secretariats and Princes"
 MAPMODE_OE_YN_TIERS: "#T $mapmode_oe_yn_tiers_name$#!\nThe lands of the Yuan's branch secretariats take the colour of their tier: compliant green, normal sand, slack orange, estranged red.\nThe princes' lands take the colour of theirs: loyal blue, aloof slate, negligent purple, estranged dark purple.\nOther land the Yuan rules directly is stone; everything else is dark grey."
