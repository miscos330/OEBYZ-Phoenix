 oe_found_saharan_march.title: "Establish the Saharan March"
 oe_found_saharan_march.desc: "The wells and fortresses of the oases sustain the roads across the desert. Entrust every directly owned Byzantine holding in the Sahara Oases and Western Sahara areas to a new Orthodox March of Roman culture, subject to Byzantium. This decision can be taken only once."
 oe_found_saharan_march.a: "Let Roman banners watch over the oases."
 OE_SAHARAN_MARCH_TERRITORY_REQUIRED: "Byzantium directly owns at least one conquerable location in the Sahara Oases or Western Sahara areas."
 oe_saharan_march_founded: "Saharan March established"
