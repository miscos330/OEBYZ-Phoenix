l_english:
 OE_CW_ST_COMMUNE: "#G Zealot commune#!"
 OE_CW_ST_KANTA: "#Y Kantakouzenos#!"
 OE_CW_ST_REGENCY: "#P The regency#!"
 OE_CW_ST_FOREIGN: "Foreign"
 STATIC_MODIFIER_NAME_oe_cw_raided: "Plundered by the Turks"
 STATIC_MODIFIER_NAME_oe_cw_zealot_guard: "The Zealots Hold the City"
 STATIC_MODIFIER_NAME_oe_cw_zealot_commune: "Zealot Commune"
 STATIC_MODIFIER_NAME_oe_cw_joint_rule: "Joint Rule"
 STATIC_MODIFIER_NAME_oe_cw_scars: "Scars of the Civil War"
 OE_CW_REBELS: "The Kantakouzenists"
 OE_CW_REBELS_country: "The Kantakouzenists"
 OE_CW_REBELS_country_adjective: "Kantakouzenist"
 oe_cw_war: "The War of the Two Johns"
 oe_cw_war_desc: "John V's regency and John Kantakouzenos, proclaimed at Didymoteicho, are fighting for the empire. Most townsfolk stand with the regency, most landowners and soldiers with Kantakouzenos, and the foreign powers sell their help to whichever side pays.\n\nTide: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = Kantakouzenos enters the capital, #Y 0#! = he gives up and takes the cowl)   Months of war: [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]\nEach month the tide moves with who controls these ten cities (weights in brackets), and with foreign aid:\nConstantinople (#Y 4#!): [GetCountry('BYZ').Custom('OeCwCity_constantinople')]\nThessaloniki (#Y 3#!): [GetCountry('BYZ').Custom('OeCwCity_thessaloniki')]\nAdrianople (#Y 2#!): [GetCountry('BYZ').Custom('OeCwCity_edirne')]\nDidymoteicho (#Y 2#!): [GetCountry('BYZ').Custom('OeCwCity_demotica')]\nSerres (#Y 1#!): [GetCountry('BYZ').Custom('OeCwCity_serres')]\nBerroia (#Y 1#!): [GetCountry('BYZ').Custom('OeCwCity_veria')]\nSelymbria (#Y 1#!): [GetCountry('BYZ').Custom('OeCwCity_silivri')]\nPhilippopolis (#Y 1#!): [GetCountry('BYZ').Custom('OeCwCity_plovdiv')]\nKomotini (#Y 1#!): [GetCountry('BYZ').Custom('OeCwCity_komotini')]\nChristopolis (#Y 1#!): [GetCountry('BYZ').Custom('OeCwCity_kavala')]\n\nIf the Kantakouzenists hold Constantinople for #Y 3#! months he enters it as emperor. After #Y 6#! years the two sides make peace."
 oe_cw.1.t: "The Old Fever Returns"
 oe_cw.1.d: "The emperor's fever has returned. It has dogged him for years, and every bout is worse than the last. The physicians say that if he wishes to live longer he must set the business of state aside."
 oe_cw.1.a: "Carry on governing"
 oe_cw.1.a.tt: "The emperor's health #R −4#! (he dies at zero)"
 oe_cw.1.b: "Rest for a while"
 oe_cw.1.b.tt: "The emperor's health #R −3#! (he dies at zero)"
 oe_cw.1.c: "Summon every physician"
 oe_cw.1.c.tt: "The emperor's health #R −2#! (he dies at zero)"
 oe_cw.2.t: "Standoff in the Palace"
 oe_cw.2.d: "Andronikos III lies in state in the palace, and John Kantakouzenos has already set guards on its gates to protect the [SCOPE.sCharacter('oe_cw_j5').GetAgeInYears]-year-old John V and the Empress Anna. He asks that the boy marry his daughter Helena. Patriarch John Kalekas produces a document left by the late emperor in 1334 and claims the regency as his own."
 oe_cw.2.a: "Agree to the betrothal"
 oe_cw.2.a.tt: "Rift #Y −15#! (#Y 60#! means war)\nJohn V is betrothed to Helena Kantakouzene; they will marry when he comes of age"
 oe_cw.2.b: "Let the Patriarch decide"
 oe_cw.2.b.tt: "Rift #Y +10#! (#Y 60#! means war)"
 oe_cw.2.c: "Let the guards declare themselves"
 oe_cw.2.c.tt: "Rift #Y −5#! (#Y 60#! means war)"
 oe_cw.3.t: "The Thracian Campaign"
 oe_cw.3.d: "Dušan's Serbs are in Macedonia, the Turks of Saruhan are raiding the Thracian coast, and Ivan Alexander of Bulgaria is massing on the border. Kantakouzenos means to take the army out of the city and leave the capital to the megas doux Alexios Apokaukos."
 oe_cw.3.a: "Fund the campaign and let him go"
 oe_cw.3.a.tt: "Rift #Y −5#! (#Y 60#! means war)"
 oe_cw.3.b: "Keep him in the capital"
 oe_cw.3.b.tt: "Rift #Y +5#! (#Y 60#! means war)\nThrace is plundered (#Y 3#! years)"
 oe_cw.4.t: "Apokaukos's Plot"
 oe_cw.4.d: "At the end of August Apokaukos tried to carry off the boy emperor. He failed and fled to his fortified house at Epibatai, where the guards now have him surrounded. Kantakouzenos is hurrying back from Thrace."
 oe_cw.4.a: "Hold him prisoner"
 oe_cw.4.a.tt: "Rift #Y −15#! (#Y 60#! means war)\nApokaukos is out of politics"
 oe_cw.4.b: "Pardon him and restore his offices"
 oe_cw.4.b.tt: "Rift #Y +10#! (#Y 60#! means war)"
 oe_cw.4.c: "Quietly let it pass"
 oe_cw.4.c.tt: "Rift #Y +20#! (#Y 60#! means war)"
 oe_cw.5.t: "Declared a Public Enemy"
 oe_cw.5.d: "With Kantakouzenos out of the city again, Apokaukos has won over Gabalas, Choumnos and other grandees, and the Patriarch has drafted a decree: Kantakouzenos is to be stripped of every office and declared a public enemy, and the Patriarch is to be regent. It needs only the Empress's consent."
 oe_cw.5.a: "Approve the decree"
 oe_cw.5.a.tt: "Rift #Y +25#! (#Y 60#! means war)\nKantakouzenos's estates are confiscated and his mother Theodora is placed under arrest"
 oe_cw.5.b: "Suppress the decree"
 oe_cw.5.b.tt: "[oe_tu_authority|e] #R −5#!\nRift #Y −15#! (#Y 60#! means war)"
 oe_cw.5.c: "Call a council to mediate"
 oe_cw.5.c.tt: "Rift #Y −10#! (#Y 60#! means war)"
 oe_cw.6.t: "Proclaimed at Didymoteicho"
 oe_cw.6.d: "On 26 October Kantakouzenos's army and the landowners who have joined him proclaim him emperor at Didymoteicho. He still has John V and Anna acclaimed before himself, but the empire now has two emperors."
 oe_cw.6.a: "Civil war has begun"
 oe_cw.6.a.tt: "Kantakouzenos rises with Didymoteicho and the Thracian countryside; the situation 'War of the Two Johns' begins"
 oe_cw.7.t: "A Compact of Joint Rule"
 oe_cw.7.d: "The rift did not widen after all. The Empress and Kantakouzenos agree in the palace that he will be regent beside the boy emperor and that Helena will one day marry John V. The empire is spared a civil war."
 oe_cw.7.a: "May the peace last"
 oe_cw.7.a.tt: "Kantakouzenos becomes regent; John V is betrothed to Helena; 'Joint Rule' for #Y 10#! years"
 oe_cw.8.t: "The People Drive Out the Nobles"
 oe_cw.8.d: "The day after the news, the people of Adrianople stormed the nobles' houses and drove them out of the city. Town after town in Thrace and Macedonia is following suit: to the common folk, 'Kantakouzenist' means the powerful."
 oe_cw.8.a: "Ride the wave"
 oe_cw.8.a.tt: "Tide #Y −5#! (in the regency's favour)\nEvery theme: loyalty #R −5#! (strategoi of the landed families are unhappy; also in their targets for #Y 5#! years)"
 oe_cw.8.b: "Restrain the mob"
 oe_cw.8.b.tt: "#Y 50%#!: Adrianople's nobles hold the city and go over to Kantakouzenos"
 oe_cw.9.t: "The Themes Choose Sides"
 oe_cw.9.d: "As civil war tears the empire apart, the provincial strategoi hold back and weigh their oaths against their ambitions. Commanders loyal to the reigning house have already dispatched troops to reinforce the capital, while disaffected officers secretly send couriers toward Didymoteicho to treat with the rival camp."
 oe_cw.9.a: "Pardon the waverers and keep them"
 oe_cw.9.a.tt: "[oe_tu_authority|e] #R −5#!\nEstranged themes: loyalty #G +15#! (also in their targets for #Y 5#! years), they stay\nTreasonous themes rise next month and join Kantakouzenos\nEach loyal theme brings the empire #Y 2#! months of manpower"
 oe_cw.9.b: "Let them go where they will"
 oe_cw.9.b.tt: "Estranged and treasonous themes rise next month and join Kantakouzenos\nEach loyal theme brings the empire #Y 2#! months of manpower"
 oe_cw.10.t: "Theodora in Captivity"
 oe_cw.10.d: "Kantakouzenos's mother Theodora is still under arrest in the capital, short of food and warmth and failing by the day. Every envoy Kantakouzenos sends begins by asking after her."
 oe_cw.10.a: "Let her go to her son"
 oe_cw.10.a.tt: "Tide #Y −5#! (in the regency's favour)\nThe door to talks stays open"
 oe_cw.10.b: "Keep her confined"
 oe_cw.10.b.tt: "Theodora dies in captivity; Kantakouzenos will not speak of peace again"
 oe_cw.11.t: "The Zealots Hold the City"
 oe_cw.11.d: "The governor of Thessaloniki meant to hand the city to Kantakouzenos, but the sailors' guild of the harbour and the city's 'Zealots' struck first and drove him out with the Kantakouzenist nobles. The emperor spoke for the guild at the feast of Saint Demetrios, and they have not forgotten."
 oe_cw.11.a: "Thessaloniki is the emperor's city"
 oe_cw.11.a.tt: "Tide #Y −10#! (in the regency's favour)\nThessaloniki gains 'The Zealots Hold the City' (#Y 8#! years)"
 oe_cw.12.t: "The Zealot Commune"
 oe_cw.12.d: "The Zealots of Thessaloniki have driven out the nobles and chosen their own archons, governing the city in John V's name. They will not obey Kantakouzenos, nor much the capital either: landlords' estates are being divided and rich men's houses burned."
 oe_cw.12.a: "Recognise their self-rule"
 oe_cw.12.a.tt: "Thessaloniki becomes a Zealot commune until it is won back after the war (counts for neither side)"
 oe_cw.12.b: "Send troops to crush them"
 oe_cw.12.b.tt: "#Y 50%#!: they are crushed; #Y 50%#!: it fails and Thessaloniki becomes a Zealot commune anyway"
 oe_cw.13.t: "Refuge with Dušan"
 oe_cw.13.d: "Beaten back before Serres, Kantakouzenos has only a few hundred men left. He has fled into Serbia and met Stefan Dušan near Pristina. Dušan's lords urge him to help, on condition that the towns they take belong to Serbia."
 oe_cw.13.a: "Kantakouzenos has a new ally"
 oe_cw.13.a.tt: "Tide #Y +10#! (in Kantakouzenos's favour)\nSerbia sides with Kantakouzenos and takes up to #Y 2#! places on the Macedonian border"
 oe_cw.14.t: "Berroia Opens Its Gates"
 oe_cw.14.d: "The Serbs besieged Berroia for months, but the townsmen would surrender only to Kantakouzenos in person. Dušan's men have laboured for nothing, and at the Serbian court some are saying Kantakouzenos's power should not be helped any further."
 oe_cw.14.a: "Buy Dušan over with border towns"
 oe_cw.14.a.tt: "Tide #Y −10#! (in the regency's favour)\nSerbia allies with the regency instead and takes up to #Y 2#! more places on the Macedonian border"
 oe_cw.14.b: "Leave it"
 oe_cw.15.t: "Umur's Fleet"
 oe_cw.15.d: "Umur, emir of Aydın, is Kantakouzenos's old friend. He has sailed up the Evros with #Y 300#! ships, lifted the siege of Didymoteicho, and spent months plundering the Thracian countryside."
 oe_cw.15.a: "We must endure it"
 oe_cw.15.b: "Appeal to the Pope"
 oe_cw.15.b.tt: "The Empress promises the Church's obedience to Rome; in about half a year a Latin crusade will strike Umur's harbour at Smyrna"
 oe_cw.16.t: "The Smyrniote Crusade"
 oe_cw.16.d: "A league of the Pope, Venice, the Knights of Rhodes and Cyprus has taken the harbour of Smyrna. Umur has hurried home with the bulk of his army, and Kantakouzenos has lost his strongest ally."
 oe_cw.16.a: "Heaven helps us"
 oe_cw.16.a.tt: "Tide #Y −5#! (in the regency's favour)\nUmur no longer aids Kantakouzenos"
 oe_cw.17.t: "Pawning the Crown Jewels"
 oe_cw.17.d: "The treasury is empty, and the Turkish raids have left the capital short of bread. The Venetians will lend #Y 30,000#! ducats if the crown jewels of the empire are lodged in their vaults."
 oe_cw.17.a: "Pawn them to Venice"
 oe_cw.17.a.tt: "The crown jewels stay in Venice from now on"
 oe_cw.17.b: "Rather go hungry"
 oe_cw.18.t: "Bulgaria's Price"
 oe_cw.18.d: "Ivan Alexander of Bulgaria will send troops against Kantakouzenos. His price is Philippopolis and several towns along the northern Evros."
 oe_cw.18.a: "Agree"
 oe_cw.18.a.tt: "Tide #Y −10#! (in the regency's favour)\nPhilippopolis and up to #Y 2#! places in northern Thrace pass to Bulgaria\nBulgarian troops for #Y 2#! years (tide #Y −1#! a month)"
 oe_cw.18.b: "Refuse"
 oe_cw.19.t: "The Brigand of the Rhodope"
 oe_cw.19.d: "Momchil was a brigand until Kantakouzenos made him lord of Merope. Now he holds five thousand men in the Rhodope and fights for whoever pays best."
 oe_cw.19.a: "Buy him"
 oe_cw.19.a.tt: "Momchil fights for the regency (tide #Y −0.5#! a month)"
 oe_cw.19.b: "Ignore him"
 oe_cw.19.b.tt: "Momchil rules the mountains for himself"
 oe_cw.20.t: "The Battle of Peritheorion"
 oe_cw.20.d: "On 7 July the armies of Kantakouzenos and Umur caught Momchil before Peritheorion. The townsmen shut the gates against him. The brigand's army was scattered and Momchil fell."
 oe_cw.20.a: "The mountains are quiet again"
 oe_cw.20.a.tt: "Momchil is dead; if he fought for the regency, tide #Y +5#!"
 oe_cw.21.t: "The Governor Changes Sides"
 oe_cw.21.d: "The governor of Adrianople, Manuel Apokaukos, the megas doux's own son, has sent word to Kantakouzenos. The general John Vatatzes is wavering with him."
 oe_cw.21.a: "Promote them and keep them"
 oe_cw.21.a.tt: "[oe_tu_authority|e] #R −3#!"
 oe_cw.21.b: "Let them go"
 oe_cw.21.b.tt: "Tide #Y +5#! (in Kantakouzenos's favour)\nAdrianople goes over to Kantakouzenos"
 oe_cw.22.t: "The Death of Apokaukos"
 oe_cw.22.d: "On 11 June the megas doux went to inspect the new prison he had built for his enemies, without his guards. The prisoners took up the builders' tools and killed him. The regency has lost its pillar."
 oe_cw.22.a: "The regency has lost its pillar"
 oe_cw.22.a.tt: "Tide #Y +10#! (in Kantakouzenos's favour)"
 oe_cw.23.t: "Saruhan's Mercenaries"
 oe_cw.23.d: "Envoys from the Emir of Saruhan have crossed the straits with a tempting offer: #Y 6,000#! seasoned Anatolian fighters ready to take the field for the regency at a remarkably modest price. Such reinforcements could swiftly tip the war, though welcoming foreign mercenaries onto Roman soil rarely ends cleanly."
 oe_cw.23.a: "Hire them"
 oe_cw.23.a.tt: "#Y 70%#!: they plunder Thrace and go over to Kantakouzenos (tide #Y +10#!, Thrace plundered for #Y 3#! years)\n#Y 30%#!: they really fight for us (tide #Y −10#!)"
 oe_cw.23.b: "Refuse"
 oe_cw.24.t: "Orhan Asks for a Bride"
 oe_cw.24.d: "Orhan the Ottoman has sent envoys to Kantakouzenos's camp asking for his daughter Theodora. If the marriage is made, Ottoman troops will cross the straits to help him."
 oe_cw.24.a: "Pay Orhan to stay out of it"
 oe_cw.24.a.tt: "Orhan stays neutral"
 oe_cw.24.b: "We cannot stop it"
 oe_cw.24.b.tt: "Tide #Y +15#! (in Kantakouzenos's favour)\nTheodora marries Orhan at Selymbria; Ottoman troops cross over (tide #Y +1.5#! a month)\nThe Ottomans now have a foothold in Europe"
 oe_cw.25.t: "The Dome of Hagia Sophia"
 oe_cw.25.d: "The earthquake of a few years ago cracked the dome of Hagia Sophia, and the cracks were never properly repaired. On 19 May the eastern arch and part of the dome finally came crashing down. Everyone in the capital says it is God's judgement on this civil war."
 oe_cw.25.a: "Pay for the repairs"
 oe_cw.25.b: "We cannot afford it"
 oe_cw.26.t: "The Genoese Seize the Islands"
 oe_cw.26.d: "Simone Vignoso of Genoa has appeared off Chios with a fleet. The empire's ships are all busy with the civil war, and the island's garrison will not hold for long."
 oe_cw.26.a: "Pay to hold them"
 oe_cw.26.b: "Accept the loss"
 oe_cw.26.b.tt: "Chios and Phokaia pass to Genoa"
 oe_cw.27.t: "Friars Bearing Terms"
 oe_cw.27.d: "Kantakouzenos has sent Franciscan friars to the capital with terms: he to be senior emperor for ten years, then equal with John V; Helena to marry John V; an amnesty on both sides."
 oe_cw.27.a: "Accept the terms"
 oe_cw.27.a.tt: "The war ends in a peace"
 oe_cw.27.b: "Refuse"
 oe_cw.27.b.tt: "No further terms for two years"
 oe_cw.28.t: "The Golden Gate Opens"
 oe_cw.28.d: "On the night of 2 February his supporters inside the city opened the long-disused Golden Gate. Kantakouzenos came in with a thousand men and by morning had surrounded the Blachernae Palace. The Empress held out for a few days; in the end John V persuaded his mother to accept the terms: Kantakouzenos senior emperor for ten years, then joint rule with John V; Helena to marry John V; an amnesty on both sides."
 oe_cw.28.a: "John VI is enthroned"
 oe_cw.28.a.tt: "Kantakouzenos becomes Emperor John VI; John V is his heir and marries Helena; an amnesty on both sides"
 oe_cw.29.t: "Retreat to Mount Athos"
 oe_cw.29.d: "Kantakouzenos's army has melted away and his allies have gone. He lays aside the purple and goes to Mount Athos as a monk. John V keeps his throne, but Thrace lies in ruins."
 oe_cw.29.a: "The empire belongs to John V"
 oe_cw.29.a.tt: "Kantakouzenos becomes a monk; his family's influence #Y −200#!; legitimacy rises"
 oe_cw.30.t: "A Belated Peace"
 oe_cw.30.d: "Neither side can fight on. The terms are almost exactly those Kantakouzenos offered years before: he to be regent, Helena to marry John V, an amnesty on both sides. Later historians would say the same terms could have been had five years earlier, sparing the empire much suffering."
 oe_cw.30.a: "At last it is over"
 oe_cw.30.a.tt: "Kantakouzenos becomes regent; John V is betrothed to Helena; an amnesty on both sides"
 oe_cw.31.t: "Thessaloniki Returns"
 oe_cw.31.d: "A year after the war, the Zealot leaders have fled or been taken one by one, and Andreas Palaiologos has entered a monastery on Athos. Thessaloniki opens its gates again to a governor sent from the capital."
 oe_cw.31.a: "The city is back"
 oe_cw.31.a.tt: "The Zealot commune of Thessaloniki ends"
