l_english:
 oe_nf_redeem_title: "Redeem House Holdings"
 oe_nf_redeem_desc: "Redeem the estates and workshops held by a great house, returning local livelihoods to the protection of imperial law.\n\nSpend #R one month of privy-purse income#! and #R 1 Authority#! to remove this house’s control from one selected location. The house gains #G 2 Influence#!. Requires sufficient privy-purse funds; no cooldown. Other houses in the same location retain their holdings."
 oe_nf_relief_title: "Entrust Relief"
 oe_nf_relief_desc: "Charge a great house with feeding the needy and restoring calm among its neighbours. Relief honours the throne while increasing the standing of those entrusted with it.\n\nSpend #R 2 Authority#! and gain #G 2 Public Opinion#!. The house gains #G 4 Influence#!. All houses share a #Y 3-month#! cooldown."
 oe_nf_recommend_title: "Request a Recommended Retainer"
 oe_nf_recommend_desc: "Invite the head of the house to recommend a capable retainer for imperial service.\n\nSpend #R 1 Authority#! to receive an adult Roman, Orthodox retainer with at least one ability #G above 65#!. The house gains #G 2 Influence#!. This house has a #Y 3-month#! cooldown."
 oe_nf_mediate_dispute: "Mediate a Dispute Between Houses"
 oe_nf_mediate_dispute_desc: "Before any one house can dominate the court, summon two rivals and settle their quarrel by imperial judgement.\n\nNo house may have Influence #Y above 300#!. Choose two different houses, each with Influence #Y above 50#!. Each loses #R 25 Influence#!; gain #G 1 Authority#!. Nationwide cooldown: #Y 12 months#!."
 oe_nf_oppose_monopoly: "Curb Aristocratic Monopoly"
 oe_nf_oppose_monopoly_desc: "Use the authority of the reformed offices to break a province’s aristocratic monopolies.\n\nRequires #Y Reorganize the Offices#!. Choose a province containing imperial land and house holdings. Spend #R 5 Authority#! to remove every house’s control throughout that geographic province and #G permanently prevent#! further house claims there. No cooldown."
 OE_NF_CHOOSE_HOLDING: "Choose a Holding to Redeem"
 OE_NF_CHOOSE_FIRST_HEAD: "Choose the First House"
 OE_NF_CHOOSE_SECOND_HEAD: "Choose the Second House"
 oe_noble_clients.1.t: "Talent from a Great Household"
 oe_noble_clients.1.d: "The [SCOPE.sDynasty('oe_nf_patron_family').GetName] house has answered our summons by recommending [SCOPE.sCharacter('oe_nf_recommended').GetName] from among its retainers. Long experience has earned this candidate the patron’s confidence; a letter of introduction now opens the way to imperial service."
 oe_noble_clients.1.a: "Welcome this talent into imperial service."
