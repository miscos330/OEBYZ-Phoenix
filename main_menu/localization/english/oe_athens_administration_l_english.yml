l_english:
 oe_athens_administration.1.t: "The Offices of Athens"
 oe_athens_administration.1.d: "The imperial double-headed eagle flies over Athens once more, yet the tax registers and petitions of the surrounding country remain scattered. Envoys from nearby towns still travel to Constantinople merely to obtain an official decree. Our officials propose restoring the old halls of the Acropolis as permanent offices, bringing the revenues, courts and administration of Greece together in one place. A modest founding grant would allow this ancient city to serve the empire anew."
 oe_athens_administration.1.a: "Rebuild the administrative centre in Athens."
 oe_athens_administration_pending: "Athens administrative centre proposal awaiting a decision"
