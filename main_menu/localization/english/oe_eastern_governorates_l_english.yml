l_english:
 oe_roman_province: "Roman Province"
 oe_roman_province_desc: "A governor appointed by the imperial court brings civil and military administration under one body of law. The province retains its own court and offices while owing allegiance to Constantinople."
 oe_heg_reclaim_syria: "Reclaim Syria"
 oe_heg_return_holy_land: "Return to the Holy Land"
 oe_heg_egypt_campaign: "The Egyptian Campaign"
 OE_HEG_SYRIA_COUNTRY: "Governorate of Syria"
 OE_HEG_SYRIA_ADJ: "Syrian"
 OE_HEG_JERUSALEM_COUNTRY: "Governorate of Jerusalem"
 OE_HEG_JERUSALEM_ADJ: "Jerusalemite"
 OE_HEG_EGYPT_COUNTRY: "Governorate of Egypt"
 OE_HEG_EGYPT_ADJ: "Egyptian"
 OE_HEG_NO_PENDING_GOVERNOR: "The previous governorate has received its governor"
 OE_HEG_THREE_CANDIDATES: "At least three eligible domestic characters outside the cabinet, excluding the current ruler"
 OE_HEG_SYRIA_YEAR: "Byzantium or its subjects have continuously occupied Aleppo or Damascus for over a year (366 days)"
 OE_HEG_JERUSALEM_YEAR: "Byzantium or its subjects have continuously occupied Jerusalem for over a year (366 days)"
 OE_HEG_ALEXANDRIA_YEAR: "Byzantium or its subjects have continuously occupied Alexandria for over a year (366 days)"
 OE_HEG_LEVANT_OWNERSHIP: "Byzantium or its subjects own Aleppo, Damascus and Jerusalem"
 OE_HEG_ACTIONS_HINT: "Governorates are formed only from occupied enemy territory. Existing possessions, independent allied occupations and unconquered locations are excluded."
 oe_eastern_governorates.1.t: "An Imperial Appointment"
 oe_eastern_governorates.1.d: "The boundaries of [oe_heg_new_country.GetName] have been drawn, and its officials await the governor who will take up the seal of office. Three names have reached the imperial court. Who shall leave the capital to exercise the emperor’s authority in the new province?"
 oe_eastern_governorates.1.defer: "Prepare a new list of candidates."
 OE_HEG_RETRY_GOVERNOR: "All three original candidates have become unavailable. The court will check again in thirty days and present a new list once three eligible candidates are available."
 oe_eastern_governorates.1.1: "Appoint [oe_heg_candidate_1.GetName]. (ADM [oe_heg_candidate_1.GetAbility('adm')] / DIP [oe_heg_candidate_1.GetAbility('dip')] / MIL [oe_heg_candidate_1.GetAbility('mil')])"
 oe_eastern_governorates.1.2: "Appoint [oe_heg_candidate_2.GetName]. (ADM [oe_heg_candidate_2.GetAbility('adm')] / DIP [oe_heg_candidate_2.GetAbility('dip')] / MIL [oe_heg_candidate_2.GetAbility('mil')])"
 oe_eastern_governorates.1.3: "Appoint [oe_heg_candidate_3.GetName]. (ADM [oe_heg_candidate_3.GetAbility('adm')] / DIP [oe_heg_candidate_3.GetAbility('dip')] / MIL [oe_heg_candidate_3.GetAbility('mil')])"
 OE_HEG_SYRIA_EFFECT: "Immediately grant all enemy locations occupied by Byzantium or its direct and indirect subjects in the Halab, Ayntab, Hims, Latakia, Tadmur, Deir and Shaam provinces to the new governorate. It becomes a Byzantine provincial subject with monarchy, Roman culture, Orthodox religion and the Roman Province reform (3 days to implement; monthly rebel growth -1%; government reform slots +1). Choose its governor from the three highest-ability eligible domestic characters."
 oe_heg_reclaim_syria_desc: "Byzantium or its subjects have continuously occupied Aleppo or Damascus for over a year (366 days). \n\nImmediately grant all enemy locations occupied by Byzantium or its direct and indirect subjects in the Halab, Ayntab, Hims, Latakia, Tadmur, Deir and Shaam provinces to the new governorate. It becomes a Byzantine provincial subject with monarchy, Roman culture, Orthodox religion and the Roman Province reform (3 days to implement; monthly rebel growth -1%; government reform slots +1). Choose its governor from the three highest-ability eligible domestic characters."
 OE_HEG_SYRIA_DONE: "#G Governorate of Syria established#!"
 OE_HEG_JERUSALEM_EFFECT: "Immediately grant all enemy locations occupied by Byzantium or its direct and indirect subjects in the Filastin, Sharat, Hawran and Lebanon provinces to the new governorate. It becomes a Byzantine provincial subject with monarchy, Roman culture, Orthodox religion and the Roman Province reform (3 days to implement; monthly rebel growth -1%; government reform slots +1). Choose its governor from the three highest-ability eligible domestic characters."
 oe_heg_return_holy_land_desc: "Byzantium or its subjects have continuously occupied Jerusalem for over a year (366 days). \n\nImmediately grant all enemy locations occupied by Byzantium or its direct and indirect subjects in the Filastin, Sharat, Hawran and Lebanon provinces to the new governorate. It becomes a Byzantine provincial subject with monarchy, Roman culture, Orthodox religion and the Roman Province reform (3 days to implement; monthly rebel growth -1%; government reform slots +1). Choose its governor from the three highest-ability eligible domestic characters."
 OE_HEG_JERUSALEM_DONE: "#G Governorate of Jerusalem established#!"
 OE_HEG_EGYPT_EFFECT: "Immediately grant all enemy locations occupied by Byzantium or its direct and indirect subjects in the entire Egyptian region to the new governorate. It becomes a Byzantine Egyptian domain with monarchy, Roman culture, Orthodox religion and the Roman Province reform (3 days to implement; monthly rebel growth -1%; government reform slots +1). Choose its governor from the three highest-ability eligible domestic characters."
 oe_heg_egypt_campaign_desc: "Byzantium or its subjects have continuously occupied Alexandria for over a year (366 days). Byzantium or its subjects own Aleppo, Damascus and Jerusalem. \n\nImmediately grant all enemy locations occupied by Byzantium or its direct and indirect subjects in the entire Egyptian region to the new governorate. It becomes a Byzantine Egyptian domain with monarchy, Roman culture, Orthodox religion and the Roman Province reform (3 days to implement; monthly rebel growth -1%; government reform slots +1). Choose its governor from the three highest-ability eligible domestic characters."
 OE_HEG_EGYPT_DONE: "#G Governorate of Egypt established#!"
 OE_HEG_SYRIA_PROGRESS: "Continuous occupation: Aleppo [GuiScope.SetRoot(GetLocationByKey('aleppo').MakeScope).ScriptValue('oe_heg_hold_duration')|0]/366 days; Damascus [GuiScope.SetRoot(GetLocationByKey('damascus').MakeScope).ScriptValue('oe_heg_hold_duration')|0]/366 days"
 OE_HEG_JERUSALEM_PROGRESS: "Continuous occupation: Jerusalem [GuiScope.SetRoot(GetLocationByKey('jerusalem').MakeScope).ScriptValue('oe_heg_hold_duration')|0]/366 days"
 OE_HEG_EGYPT_PROGRESS: "Continuous occupation: Alexandria [GuiScope.SetRoot(GetLocationByKey('alexandria').MakeScope).ScriptValue('oe_heg_hold_duration')|0]/366 days"
 OE_HEG_GOVERNORATE_LOST: "The governorate can no longer receive our appointment."
