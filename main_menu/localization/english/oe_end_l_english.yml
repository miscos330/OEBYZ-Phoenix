 STATIC_MODIFIER_DESC_oe_end_armed_neutrality_mod: "Proclaiming armed neutrality amid global war reaps wartime shipping and trade windfalls at the cost of prestige in belligerent courts."
 STATIC_MODIFIER_DESC_oe_end_atlantic_crusade_mod: "Ships of the line cross the Atlantic to contest oceanic mastery, elevating heavy-ship power, naval morale, and sailor reserves."
 STATIC_MODIFIER_DESC_oe_end_central_miracle_mod: "Brilliant interior-lines campaigning defies encircling foes across Central Europe, raising discipline and morale at mounting exhaustion."
 STATIC_MODIFIER_DESC_oe_end_coalition_aligned_mod: "Aligned with the Grand Coalition of Balance, uniting rivals against unipolar hegemony with higher morale and diplomacy at heavier upkeep."
 STATIC_MODIFIER_DESC_oe_end_concert_guarantor_mod: "As architect of the Vienna-style Eurasian Concert after checking hegemony, our court enjoys elevated diplomacy, stability, and peaceful trade."
 STATIC_MODIFIER_DESC_oe_end_congress_charter_mod: "Postwar border guarantees and standing ambassadorial congresses erase war exhaustion while bolstering diplomacy and domestic stability."
 STATIC_MODIFIER_DESC_oe_end_continental_blockade_mod: "Sweeping port closures and naval cordons sharpen blockade pressure and heavy-ship power while choking maritime commerce at home."
 STATIC_MODIFIER_DESC_oe_end_diplomatic_revolution_mod: "Overturning centuries of ancestral rivalry expands diplomatic capacity, reputation, and alliance coordination across continents."
 STATIC_MODIFIER_DESC_oe_end_exhausted_compromise_mod: "After an exhausting intercontinental conflict, the compromise congress locks frontiers in place, melting war exhaustion and restoring prosperity."
 STATIC_MODIFIER_DESC_oe_end_hegemon_aligned_mod: "Aligned with the Hegemonic Axis in the Eurasian Great War, gaining discipline and war-score efficiency while drawing hostile antagonism."
 STATIC_MODIFIER_DESC_oe_end_ideological_fervor_mod: "The clash of revolutionary ideals and dynastic crowns ignites mass enlistment and morale while straining internal stability."
 STATIC_MODIFIER_DESC_oe_end_levee_en_masse_mod: "Total national mobilization pours unprecedented manpower and fervor to the front at steep military upkeep and rising war exhaustion."
 STATIC_MODIFIER_DESC_oe_end_med_campaign_mod: "Amphibious operations across Constantinople, Venice, Alexandria, and Naples boost naval morale and siege power at higher naval upkeep."
 STATIC_MODIFIER_DESC_oe_end_new_world_primacy_mod: "While Old World empires bleed across Eurasia, western Atlantic ports capture dominant trade income, merchant capacity, and prestige."
 STATIC_MODIFIER_DESC_oe_end_orient_expedition_mod: "Distant fleets and silk-road convoys project power into the East Asian theater, lifting sailors and sea trade at steeper naval upkeep."
 STATIC_MODIFIER_DESC_oe_end_revolutionary_order_mod: "Revolutionary triumph sweeps old regimes aside across Eurasia, accelerating research, institutions, and morale while unsettling dynastic legitimacy."
 STATIC_MODIFIER_DESC_oe_end_unipolar_imperium_mod: "Emerging supreme from the 1750-1836 Eurasian Great War cements unmatched imperial prestige and reach, though conquered rivals never forget."
 STATIC_MODIFIER_DESC_oe_end_war_bonds_mod: "Long-term sovereign war bonds expand credit capacity and lower interest rates while raising the political cost of domestic stability."
 STATIC_MODIFIER_DESC_oe_end_war_subsidy_mod: "Steady intercontinental war subsidies sustain allied field armies, lifting morale, manpower recovery, and coalition cohesion."
