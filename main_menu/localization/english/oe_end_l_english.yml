 oe_end_op_neutral_violation: "Wartime Violation of Armed Neutrality"
 oe_end_player_only_tt: "Only a human-controlled country may enact this decision."
 oe_end_timeline_concert: "The Vienna-style Eurasian Concert concludes, establishing an intercontinental balance of power."
 oe_end_timeline_hegemon: "The Eurasian Endgame Great War concludes in the triumph of Unipolar Imperial Hegemony."
 oe_end_timeline_peace: "The World Peace Congress ratifies an Exhausted Compromise Peace, ending the Eurasian Great War."
 oe_end_timeline_revolution: "Revolutionary forces prevail in the Eurasian Great War, ushering in a Revolutionary New Order."
 oe_end_timeline_start: "The 1750-1836 Eurasian Endgame Great War erupts, splitting Eurasia and the Atlantic into rival global blocs."
 oe_sit_eurasian_great_war: "1750-1836 Eurasian Endgame Great War"
 oe_sit_eurasian_great_war_concert: "Vienna Eurasian Concert of Balance"
 oe_sit_eurasian_great_war_concert_desc: "The Grand Coalition of Balance checks unipolar hegemony (Balance <= 15, or the hegemon collapses under high entropy at Balance <= 35), inaugurating a Vienna-style Eurasian Concert."
 oe_sit_eurasian_great_war_desc: "Polarized by late-game hegemony, diplomatic revolutions, and revolutionary upheaval, Eurasia and the Atlantic split into the Hegemonic Axis and the Grand Coalition of Balance. War rages across five global theaters—the Mediterranean, Central Europe, Eastern Europe-India, East Asia-Pacific, and the Atlantic-Nova Elysia—until decisive triumph or a Vienna-style Peace Congress seals the era."
 oe_sit_eurasian_great_war_hegemon: "Unipolar Imperial Hegemony"
 oe_sit_eurasian_great_war_hegemon_desc: "The Hegemonic Axis overwhelms all opposition across the five theaters (Balance >= 85, or Coalition leader falls at Balance >= 70 under a non-revolutionary leader), cementing unipolar imperial dominance."
 oe_sit_eurasian_great_war_peace: "Exhausted Century Compromise Peace"
 oe_sit_eurasian_great_war_peace_desc: "Global war exhaustion reaches 85, a Peace Congress seals a compromise, or 1835 arrives. Exhausted powers ratify an intercontinental settlement locking existing frontiers."
 oe_sit_eurasian_great_war_revolution: "Enlightenment & Revolutionary New Order"
 oe_sit_eurasian_great_war_revolution_desc: "A revolutionary hegemonic coalition achieves decisive victory (Balance >= 85 under a revolutionary leader), sweeping old dynastic structures into a new constitutional era."
