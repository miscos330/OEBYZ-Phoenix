 oe_end.1.a: "Sound the trumpets of total war and seize the initiative"
 oe_end.1.b: "Mobilize measured reserves and secure the diplomatic rear"
 oe_end.1.d: "Decades of hegemonic polarization and great-power rivalry have finally erupted into intercontinental war. From the Bosphorus to the Rhine, and from Moscow to the South China Sea and Chesapeake Bay, states rally behind the Hegemonic Axis or the Grand Coalition of Balance."
 oe_end.1.t: "Outbreak of the Eurasian Great War"
 oe_end.10.a: "Underwrite our allies' armies with intercontinental gold subsidies"
 oe_end.10.b: "Float emergency war bonds to replenish our own treasury"
 oe_end.10.d: "Years of multi-theater warfare have drained imperial treasuries to the bone. Frontline allies plead urgently for gold subsidies while metropolitan financiers offer massive sovereign bond flotations."
 oe_end.10.t: "Exhausted Treasuries and Intercontinental Subsidies"
 oe_end.11.a: "Expand armed escort squadrons to defend neutral maritime law"
 oe_end.11.b: "Abandon neutrality and join the Grand Coalition of Balance"
 oe_end.11.d: "Belligerent cruisers have seized neutral merchantmen on the high seas as contraband and hauled them before prize courts. Outraged merchants and statesmen demand retribution against maritime tyranny."
 oe_end.11.t: "Intercepted Convoys: Crisis of Armed Neutrality"
 oe_end.12.a: "Pay diplomatic guarantees to hold the bloc firm for victory"
 oe_end.12.b: "Open back-channel talks to prepare a World Peace Congress"
 oe_end.12.d: "Relentless levies and mounting debts have strained every belligerent court. Envoys report whispered separate-peace feelers in neutral capitals—forcing a choice between shoring up the alliance or steering toward a Peace Congress."
 oe_end.12.t: "War Weariness and Secret Peace Feelers"
 oe_end.13.a: "Inscribe this triumph in the annals of empire"
 oe_end.13.d: "The Eurasian Endgame Great War ends in decisive triumph for the Hegemonic Axis! Rival coalitions lie broken across all five theaters, and defeated envoys affix their seals to the victor's terms—crowning an age of unipolar imperial preeminence."
 oe_end.13.t: "Finale: Triumph of the Unipolar Imperium"
 oe_end.14.a: "Sign the Final Act of the Eurasian Concert"
 oe_end.14.d: "Under glittering chandeliers, plenipotentiaries of Eurasia and the Atlantic sign the Final Act of the Eurasian Concert. Unipolar hegemony has been checked by the Grand Coalition, inaugurating a multipolar era of diplomatic congresses and guaranteed frontiers."
 oe_end.14.t: "Finale: The Vienna Congress of Eurasian Balance"
 oe_end.15.a: "Proclaim the end of the old regime and the dawn of a new era"
 oe_end.15.d: "Revolutionary standards fly over the great capitals of Eurasia as ancient feudal walls crumble in the furnace of the Great War. Civil codes, constitutional charters, and Enlightenment reform reshape the world into a modern age."
 oe_end.15.t: "Finale: Dawn of the Revolutionary New Order"
 oe_end.16.a: "Ratify the Compromise Peace and rebuild the realm"
 oe_end.16.d: "Years of intercontinental total war have bled every great power white. Recognizing that no side can force unconditional surrender, the delegates ratify a pragmatic Compromise Peace locking existing borders so an exhausted world may heal."
 oe_end.16.t: "Finale: The Century Compromise Peace Congress"
 oe_end.2.a: "Seal the Diplomatic Revolution and coordinate our fronts"
 oe_end.2.b: "Keep our diplomatic hands free and bolster the treasury"
 oe_end.2.d: "Just as the 1756 Treaty of Versailles overturned two centuries of Habsburg-Bourbon enmity overnight, ancient rivals now exchange secret plenipotentiary powers under the shadow of global hegemony, reshaping the diplomatic map of Eurasia."
 oe_end.2.t: "The Diplomatic Revolution: Ancestral Rivals Unite"
 oe_end.3.a: "Join the Hegemonic Axis (Bloc A)"
 oe_end.3.b: "Join the Grand Coalition of Balance (Bloc B)"
 oe_end.3.c: "Proclaim Armed Neutrality and profit from wartime trade"
 oe_end.3.d: "Envoys from both global blocs arrive at court bearing treaties and veiled ultimatums. One offers preeminence under a new imperial order, the other appeals to the balance of power, while merchants urge profitable armed neutrality."
 oe_end.3.t: "The Great War: Great Powers Choose Sides"
 oe_end.4.a: "Commit funds to reinforce the Mediterranean battlefleet and legions"
 oe_end.4.b: "Guard the straits and convoys to build naval tradition"
 oe_end.4.d: "The Mediterranean and Balkans theater has ignited into the pivotal hinge of Eurasia. Around Constantinople, Venice, Alexandria, and Naples, battlefleets and amphibious hosts fight bitterly for command of the straits."
 oe_end.4.t: "Clash of the Mediterranean and the Straits"
 oe_end.5.a: "Press the decisive interior-lines offensive across Central Europe"
 oe_end.5.b: "Consolidate fortified lines and replenish manpower reserves"
 oe_end.5.d: "Across the Paris-Vienna-Berlin-London heartland, converging armies tighten an iron ring. Through audacious interior-lines marches and iron discipline, field commanders shatter the encirclement, jolting the strategic balance of Europe."
 oe_end.5.t: "Central European Front: Miracle of Interior Lines"
 oe_end.6.a: "Dispatch expeditionary squadrons to contest the Eastern theaters"
 oe_end.6.b: "Secure the Eastern silver and silk lanes to fill the war chest"
 oe_end.6.d: "The conflagration leaps across the Urals and the Indian Ocean to Dadu, Edo, and Manila. Silver galleon routes and overland silk corridors alike become contested fronts as Eastern powers tip the Eurasian ledger."
 oe_end.6.t: "East Asian Seas and the Intercontinental Silk Front"
 oe_end.7.a: "Send the transatlantic battlefleet to tip the Old World balance"
 oe_end.7.b: "Seize New World maritime primacy while the Old World bleeds"
 oe_end.7.d: "Cannon thunder across the Atlantic triangle linking Chesapeake, Havana, and Lisbon. Nova Elysia and the Atlantic powers face a fateful choice: cross the ocean to decide the Eurasian struggle, or secure unchallenged mastery of the New World while Europe bleeds."
 oe_end.7.t: "The Atlantic Theater: Nova Elysia and the New World"
 oe_end.8.a: "Rally ideological volunteers to the standards for total victory"
 oe_end.8.b: "Temper radical fervor and safeguard domestic stability"
 oe_end.8.d: "The Great War is no longer merely a contest of borders—revolutionary manifestos, citizen levies, and legitimist crowns turn every capital into an ideological crucible, filling the ranks while testing domestic order."
 oe_end.8.t: "Tricolor Banners Against Ancient Crowns"
 oe_end.9.a: "Tighten port blockades ruthlessly despite commercial friction"
 oe_end.9.b: "Quietly license neutral blockade-runners to ease wartime strain"
 oe_end.9.d: "Belligerent powers impose sweeping embargoes and continental blockades to starve enemy treasuries. Yet soaring prices for colonial wares and saltpeter spawn vast smuggling networks from the Baltic to the Caribbean."
 oe_end.9.t: "The Continental Blockade and Global Smuggling"
 oe_end.90.a: "Audit complete."
 oe_end.90.d: "1750-1836 Eurasian Endgame Great War (oe_sit_eurasian_great_war) live audit:\n· Situation State (0 Idle / 1 Active / 2 Ended): [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_state')|0] | Outcome Code (1 Hegemon / 2 Vienna / 3 Revolution / 4 Peace): [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_outcome')|0]\n· Country Bloc Code (0 None / 1 Axis A / 2 Coalition B / 3 Neutral): [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_bloc')|0]\n· Aligned Great Powers (A : B): [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_members_a')|0] : [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_members_b')|0] | W2 4D Hegemon Tension: [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_heg2_tension')|0] / 100\n· Endgame Balance (0 Coalition <-> 100 Axis): [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_balance')|0] / 100 | Global Exhaustion: [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_exhaustion')|0] / 100\n· 18 Strategic Anchors Held (A : B): [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_score_a')|0] : [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_score_b')|0]\n· 5-Theater Scores (-20B..+20A): Med [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t1')|0] | CentEur [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t2')|0] | EastEur/Ind [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t3')|0] | EastAsia/Pac [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t4')|0] | Atlantic/Elysia [ROOT.GetCountry.MakeScope.ScriptValue('oe_end_val_t5')|0]"
 oe_end.90.t: "Slot 86 Eurasian Great War Audit Readout (oe_end_)"
 oe_end_act_armed_neutrality: "Proclaim Armed Neutrality"
 oe_end_act_armed_neutrality_desc: "Proclaim the League of Armed Neutrality to reap wartime gold and an 8-year trade windfall while staying outside the blocs at a modest cost to prestige."
 oe_end_act_join_coalition_bloc: "Join the Grand Coalition of Balance (Bloc B)"
 oe_end_act_join_coalition_bloc_desc: "Set aside old rivalries to join the Grand Coalition of Balance (Bloc B), gaining a 10-year morale and diplomatic pact while shifting Great War Balance -4 against hegemony."
 oe_end_act_join_hegemon_bloc: "Join the Hegemonic Axis (Bloc A)"
 oe_end_act_join_hegemon_bloc_desc: "Align formally with the Hegemonic Axis (Bloc A), gaining a 10-year military discipline and war-score pact, shifting Great War Balance +4, and antagonizing the Coalition."
 oe_end_act_levee_en_masse: "Proclaim Levée en Masse"
 oe_end_act_levee_en_masse_desc: "Pay gold, stability, and war exhaustion to raise 18 months of manpower and a 6-year total mobilization surge, shifting Great War Balance by 4 points and raising global exhaustion +4."
 oe_end_act_summon_peace_congress: "Summon the World Peace Congress"
 oe_end_act_summon_peace_congress_desc: "Once war exhaustion reaches 65, Balance crosses 75 or 25, or 1825 arrives, convene a Vienna-style World Peace Congress to accelerate decisive resolution or compromise peace."
 oe_end_act_war_subsidy_chest: "Dispatch Intercontinental War Subsidies"
 oe_end_act_war_subsidy_chest_desc: "Channel intercontinental subsidies to your bloc's war effort, conferring a 5-year morale and manpower boost while swinging Great War Balance by 5 points in your bloc's favor."
 oe_end_adv_total_mobilization: "Total War & National Mobilization"
 oe_end_adv_total_mobilization_desc: "Integrates universal conscription, wartime arsenals, intercontinental logistics, and sovereign finance to sustain prolonged global total war."
 oe_end_blockade_cd_tt: "At least 10 years have passed since our last Continental Blockade decree."
 oe_end_bonds_cd_tt: "At least 10 years have passed since our last Great War bond issue."
 oe_end_cb_balance_of_power: "War for the Eurasian Balance of Power"
 oe_end_cb_balance_of_power_PROV: "Coalition Great War to Restore the Balance of Power"
 oe_end_cb_balance_of_power_desc: "No single empire shall subjugate all Eurasia. As a member of the Grand Coalition of Balance, we unite to break the Hegemonic Axis and restore a balanced concert of powers."
 oe_end_cb_great_war: "Eurasian Great War of Hegemony"
 oe_end_cb_great_war_PROV: "Great War to Impose Eurasian Hegemony"
 oe_end_cb_great_war_desc: "The Eurasian Endgame Great War has begun. As a member of the Hegemonic Axis, we march against the Grand Coalition and rival powers to impose decisive order across the five global theaters."
 oe_end_dec_congress_charter.a: "Ratify the Charter of Balance"
 oe_end_dec_congress_charter.desc: "After the Eurasian Great War closes, proclaim a postwar Charter of Balance and Frontier Guarantees to shed exhaustion, lower Imperial Entropy, and earn Great Power goodwill."
 oe_end_dec_congress_charter.title: "Promulgate the Eurasian Charter of Balance"
 oe_end_dec_congress_charter_tt: "Grants stability, prestige, sharp war exhaustion and Imperial Entropy relief (#G -12#! if tracked), a #Y 25-year#! Charter modifier, and Great Power goodwill."
 oe_end_dec_continental_blockade.a: "Enforce the Blockade Cordons"
 oe_end_dec_continental_blockade.desc: "Deploy ships of the line to seal hostile ports and throttle enemy war commerce across key maritime chokepoints."
 oe_end_dec_continental_blockade.title: "Enact the Continental Blockade Act"
 oe_end_dec_continental_blockade_tt: "Grants the #Y 10-year#! Continental Blockade modifier (higher blockade efficiency and heavy-ship power at modest sea-trade cost) and swings Great War Balance by #G 3#!."
 oe_end_dec_diplomatic_revolution.a: "Sign the Diplomatic Revolution Pact"
 oe_end_dec_diplomatic_revolution.desc: "Following the precedent of 1756, clear ancestral rivalries with fellow bloc powers to forge a unified intercontinental war coalition."
 oe_end_dec_diplomatic_revolution.title: "Enact the Diplomatic Revolution"
 oe_end_dec_diplomatic_revolution_tt: "Clears rival-bloc hostility with fellow bloc Great Powers, grants a #Y 15-year#! Diplomatic Revolution modifier, and triggers the Diplomatic Revolution event."
 oe_end_dec_war_bonds_issue.a: "Float the Sovereign War Consols"
 oe_end_dec_war_bonds_issue.desc: "Float long-term sovereign war bonds across merchant and banking houses; countries with Sovereign Clearing (Economy 2.0) raise extra funds without stability loss."
 oe_end_dec_war_bonds_issue.title: "Issue Great War Sovereign Consols"
 oe_end_dec_war_bonds_issue_tt: "Raises a substantial scaled war chest and grants a #Y 10-year#! Sovereign Consols modifier (Sovereign Clearing adds #G +250#! extra gold with no stability penalty)."
 oe_end_map_anchor_tt: "One of the 18 strategic five-theater scoring anchors driving the quarterly Great War balance."
