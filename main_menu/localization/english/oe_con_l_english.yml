 STATIC_MODIFIER_NAME_oe_con_kanhe_tributary_mod: "Kanhe Tributary Trade Charter"
 STATIC_MODIFIER_DESC_oe_con_kanhe_tributary_mod: "Renewed Kanhe tallies open profitable tributary markets and accelerate institutional exchange with the Middle Kingdom."
 STATIC_MODIFIER_NAME_oe_con_kaihai_open_seas_mod: "Celestial Kaihai Open Seas Decree"
 STATIC_MODIFIER_DESC_oe_con_kaihai_open_seas_mod: "The Middle Kingdom and its tributaries open the maritime frontier, boosting sea trade, shipbuilding, sailors, and institutional spread."
 STATIC_MODIFIER_NAME_oe_con_haijin_closed_seas_mod: "Celestial Haijin Maritime Ban"
 STATIC_MODIFIER_DESC_oe_con_haijin_closed_seas_mod: "Strict maritime prohibitions fortify the coast against raiders and contagion at the price of reduced overseas sea trade."
 STATIC_MODIFIER_NAME_oe_con_pacification_banner_mod: "Imperial Frontier Pacification Banners"
 STATIC_MODIFIER_DESC_oe_con_pacification_banner_mod: "Tributary supply depots and mobilization banners bolster army morale and logistics for frontier pacification."
 STATIC_MODIFIER_NAME_oe_con_duhu_charter_subsidy_mod: "Charter of the Grand Protectorates"
 STATIC_MODIFIER_DESC_oe_con_duhu_charter_subsidy_mod: "An imperial charter strengthens diplomatic capacity, subject loyalty, and long-distance administrative reach across overseas protectorates."
 STATIC_MODIFIER_NAME_oe_con_duhu_garrison_mod: "Protectorate Frontier Garrison Charter"
 STATIC_MODIFIER_DESC_oe_con_duhu_garrison_mod: "Chartered Grand Protectorates and Pacification Commissions receive imperial garrison and administrative support."
 STATIC_MODIFIER_NAME_oe_con_concert_sovereignty_mod: "Congress of Vienna & Constantinople Accord"
 STATIC_MODIFIER_DESC_oe_con_concert_sovereignty_mod: "Multilateral congress diplomacy heals war weariness, expands diplomatic capacity, and speeds the easing of international antagonism."
 STATIC_MODIFIER_NAME_oe_con_anti_hegemon_league_mod: "Anti-Hegemonic Containment Pact"
 STATIC_MODIFIER_DESC_oe_con_anti_hegemon_league_mod: "Signatories of the Eurasian Concert coordinate land and naval defense to contain an overmighty hegemon."
 STATIC_MODIFIER_NAME_oe_con_mare_liberum_mod: "Mare Liberum Free Seas Convention"
 STATIC_MODIFIER_DESC_oe_con_mare_liberum_mod: "Following Grotius's Mare Liberum, open-sea navigation and free maritime trade flourish across global straits."
 STATIC_MODIFIER_NAME_oe_con_mare_clausum_mod: "Mare Clausum Closed Seas Convention"
 STATIC_MODIFIER_DESC_oe_con_mare_clausum_mod: "Following Selden's Mare Clausum, coastal powers enforce strait sovereignty, maritime patrol power, and privateer charters at the cost of open sea efficiency."
 STATIC_MODIFIER_NAME_oe_con_sanitary_accord_mod: "International Maritime Sanitary Accord"
 STATIC_MODIFIER_DESC_oe_con_sanitary_accord_mod: "Standardized international port quarantine and epidemic reporting sharply curb Levantine Plague and Camp Fever losses while easing maritime trade disruption."
