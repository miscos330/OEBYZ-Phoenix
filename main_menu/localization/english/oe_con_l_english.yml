 oe_con.1.t: "Founding of the Eurasian Concert of Powers"
 oe_con.1.d: "Confronted by transcontinental rivalries and the specter of universal monarchy, the great powers of Eurasia have assembled in solemn congress to establish the Eurasian Concert of Powers. With a rotating presidency, five permanent Pentarchy seats, neutral treaty buffer zones, and formal multilateral voting resolutions, a new balance-of-power order begins."
 oe_con.1.a: "May multilateral balance preserve Eurasian peace."
 oe_con.2.t: "Ecumenical Defense Mobilization Enacted"
 oe_con.2.d: "By multilateral vote of the Roman World, the Ecumenical Defense Mobilization has passed. From the fortresses of the Aegean to the Danube frontier, member realms rally their garrisons, reserves, and morale in common defense."
 oe_con.2.a: "Stand united in defense of the Oikoumene."
 oe_con.3.t: "Frontier Stronghold Incorporated into the Roman Oikoumene"
 oe_con.3.d: "By vote of the Roman World, a strategic border stronghold has been formally incorporated into the Roman Oikoumene jurisdiction. Imperial envoys deliver a frontier charter bolstering its fortifications and administrative reach."
 oe_con.3.a: "The frontier limes grows stronger."
 oe_con.4.t: "Celestial Kaihai Open Seas Decree Enacted"
 oe_con.4.d: "The Middle Kingdom has enacted the Kaihai Open Seas Decree, lifting maritime restrictions across the tributary sphere. Shipyards hum along the coast as merchant junks carry silk, porcelain, and new knowledge across the monsoon routes."
 oe_con.4.a: "Set sail across open eastern seas."
 oe_con.5.t: "Imperial Frontier Pacification Decree Proclaimed"
 oe_con.5.d: "The Middle Kingdom assembly has ratified the Imperial Frontier Pacification Decree. Armed with formal multilateral sanction and bolstered tributary logistics, the Son of Heaven stands ready to chastise frontier aggressors."
 oe_con.5.a: "With rightful sanction, pacify the frontier."
 oe_con.6.t: "Charter of the Grand Protectorates Enacted"
 oe_con.6.d: "The Middle Kingdom has ratified the Charter of the Grand Protectorates, codifying distant frontier governance, maritime communications, and loyal tributary obligations from the Western Regions to Nanyang."
 oe_con.6.a: "Distant protectorates stand firm beneath the Mandate."
 oe_con.7.t: "Final Act of the Congress of Vienna & Constantinople"
 oe_con.7.d: "After six months of grand diplomacy, the Congress of Vienna and Constantinople concludes with a landmark Final Act. War weariness recedes, diplomatic standing rises, and designated minor capitals enter multilateral neutral buffer protection."
 oe_con.7.a: "Let treaty law prevail over endless war."
 oe_con.8.t: "Anti-Hegemonic Containment Pact Enacted"
 oe_con.8.d: "Alarmed by an overmighty hegemon threatening the independence of Eurasian realms, the Concert of Powers has passed the Anti-Hegemonic Containment Pact. Non-allied members gain a formal Balance of Power Casus Belli and coordinated defense readiness."
 oe_con.8.a: "Unite to restore the balance of power."
 oe_con.9.t: "Global Straits Convention: Mare Liberum Prevails"
 oe_con.9.d: "The great legal debate of the oceans is decided in favor of Hugo Grotius's Mare Liberum. The high seas are declared open to lawful commerce of all nations, expanding naval reach and maritime trade while marking member-held global straits as free-passage ports."
 oe_con.9.a: "The high seas belong to all nations."
 oe_con.10.t: "Global Straits Convention: Mare Clausum Prevails"
 oe_con.10.d: "After fierce maritime lobbying, John Selden's Mare Clausum carries the day. Coastal empires secure recognition for sovereign strait tolls, naval patrols, and privateer charters, tightening open-sea trade across Eurasia."
 oe_con.10.a: "Sovereign waters remain under armed guard."
 oe_con.11.t: "International Maritime Sanitary Accord Signed"
 oe_con.11.d: "Confronted by transoceanic Levantine Plague and Camp Fever, the Eurasian Concert has ratified the International Maritime Sanitary Accord. Uniform quarantine signals, lazaretto inspections, and shared outbreak reports sharply reduce epidemic mortality while easing maritime trade disruption."
 oe_con.11.a: "Shared quarantine shields both ports and commerce."
