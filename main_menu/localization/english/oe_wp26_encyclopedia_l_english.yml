l_english:
# Project Phoenix v30.0 WP26-B — Compliant Era Soundtrack Playlists & Bilingual Historical Encyclopedia. Generated by gen_v300_wp26_encyclopedia_and_music.py; edit the generator, not this file.
 oe_wp26_bio_none:0 ""
 game_concept_oe_wp26_enc_532_justinian_i:0 "Justinian I (482-565)"
 game_concept_oe_wp26_enc_532_justinian_i_desc:0 "Born Flavius Petrus Sabbatius in Illyrian Tauresium and elevated by his uncle Justin I, Justinian I ascended the Eastern Roman throne in 527 determined to restore Roman law, Christian unity, and Mediterranean dominion. After surviving the Nika riots of January 532 and concluding the Eternal Peace with Khosrow I, he dispatched Belisarius and Narses to recover North Africa from the Vandals, Italy from the Ostrogoths, and southern Hispania from the Visigoths.\n\nEven as the Plague of Justinian and renewed Persian wars strained imperial finances, his lasting legacy proved institutional and architectural: the Corpus Juris Civilis systematized a millennium of Roman jurisprudence, while the rebuilt Hagia Sophia crowned Constantinople as the unrivaled capital of Late Antiquity."
 game_concept_oe_wp26_enc_532_theodora:0 "Empress Theodora (c. 500-548)"
 game_concept_oe_wp26_enc_532_theodora_desc:0 "Rising from the theatrical world of the Constantinople Hippodrome to become Augusta beside Justinian I, Theodora exercised an unmatched partnership in late-antique imperial governance. During the desperate Nika insurrection of January 532, when senior ministers urged flight across the Bosphorus, her celebrated refusal to abandon the imperial purple steeled the court to stand firm and crush the usurpation.\n\nThroughout her reign she championed legal protections for women, tightened statutes against forced trafficking, and sheltered Miaphysite bishops in Syria and Egypt as a deliberate counterweight to Chalcedonian rigidity, preserving fragile religious loyalty across the empire's wealthiest eastern provinces."
 game_concept_oe_wp26_enc_532_belisarius:0 "Flavius Belisarius (c. 500-565)"
 game_concept_oe_wp26_enc_532_belisarius_desc:0 "The foremost Roman field commander of the sixth century, Belisarius first won fame at Dara in 530 by halting a superior Sassanid army through disciplined trenches and heavy cavalry countercharges. After helping suppress the Nika riots in 532, he sailed to Africa in 533 with barely fifteen thousand men, defeating King Gelimer at Ad Decimum and Tricamarum to extinguish the Vandal Kingdom in a single campaign season.\n\nIn the Gothic War he captured Sicily, Naples, Rome, and Ravenna, defending Rome through a year-long siege against overwhelming odds. Operating repeatedly with scarce reinforcements and wary court oversight, he remained fiercely loyal to Justinian I and returned in old age to repel the Kutrigurs at Melantias in 559."
 game_concept_oe_wp26_enc_532_gen_narses:0 "Narses the Patrician (478-573)"
 game_concept_oe_wp26_enc_532_gen_narses_desc:0 "An Armenian eunuch who rose through the imperial treasury to become grand chamberlain and trusted confidant of Justinian I and Theodora, Narses proved an extraordinary late-blooming strategist. During the Nika riots of 532 his bold bribery and negotiation split the Blue faction from the insurgents, opening the Hippodrome to Belisarius's decisive assault.\n\nAt the age of seventy-four he assumed supreme command in Italy with full financial backing. Combining Lombard, Herul, and Roman contingents in disciplined defensive-offensive arrays, he crushed King Totila at Taginae in 552 and destroyed the Franco-Alamannic invasion at the Volturnus in 554, securing imperial Italy as its first exarchal prefect."
 game_concept_oe_wp26_enc_532_tribonian:0 "Tribonian (c. 485-542)"
 game_concept_oe_wp26_enc_532_tribonian_desc:0 "A jurist from Pamphylia celebrated for his vast personal library and encyclopedic command of classical Roman jurisprudence, Tribonian served as Justinian I's Quaestor of the Sacred Palace and chief architect of the empire's legal codification. Appointed to the first codification commission in 528, he soon chaired the monumental compilation of the Digest, distilling two thousand classical legal treatises into fifty coherent books in just three years.\n\nHe also guided the Institutes textbook for law students and the revised Justinianic Code of 534. Dismissed briefly to appease the Nika rioters in 532, he was swiftly restored by Justinian and shaped imperial legislation until his death during the great plague of 542."
 game_concept_oe_wp26_enc_532_john_cappadocian:0 "John the Cappadocian (c. 490-after 548)"
 game_concept_oe_wp26_enc_532_john_cappadocian_desc:0 "Serving as Praetorian Prefect of the East from 531 to 541, John the Cappadocian was the formidable fiscal engine behind Justinian I's sweeping wars and architectural projects. Unpolished in classical rhetoric yet brilliant in accounting, he pruned redundant provincial bureaus, curtailed the imperial post, and switched administrative decrees from Latin to Greek so eastern taxpayers could read the law directly.\n\nHis relentless tax enforcement filled the treasury for Hagia Sophia and the African campaign—which he initially opposed as fiscally reckless—but earned fierce hatred from aristocrats and Empress Theodora, whose court intrigue finally toppled him into exile in 541."
 game_concept_oe_wp26_enc_532_khosrow_i:0 "Khosrow I Anushirvan (501-579)"
 game_concept_oe_wp26_enc_532_khosrow_i_desc:0 "Revered across Iranian memory as Anushirvan, 'of the Immortal Soul', Khosrow I ascended the Sassanid throne in 531 and transformed Eranshahr into the supreme rival of Justinian's Rome. After securing the Eternal Peace of 532 to consolidate internal order, he dismantled Mazdakite upheaval, surveyed all arable land for fixed cash taxation, and divided the empire into four great military quarters under regional spahbeds.\n\nA relentless strategist and patron of learning, he shattered the Hephthalite Empire in alliance with the Gokturks, repeatedly tested Roman Syria and Lazica, and welcomed exiled Greek philosophers from Athens alongside Indian scholars at the celebrated academy of Gundeshapur."
 game_concept_oe_wp26_enc_532_emperor_wu_liang:0 "Emperor Wu of Liang — Xiao Yan (464-549)"
 game_concept_oe_wp26_enc_532_emperor_wu_liang_desc:0 "Founder of the Southern Liang dynasty in 502, Xiao Yan ruled from Jiankang for nearly half a century, presiding over the most radiant cultural flowering of China's Southern Dynasties. A skilled general in his youth who toppled the chaotic Southern Qi court, he later devoted his vast energy to Buddhist scholarship, Confucian ritual, calligraphy, musicology, and literary salons anchored by his gifted sons.\n\nUnder his patronage monasteries multiplied across Jiangnan and royal missions linked Jiankang with Southeast Asia and India, yet his lenient governance of noble clans and fateful acceptance of the northern rebel general Hou Jing in 547 ultimately unleashed the catastrophic sack of Jiankang."
 game_concept_oe_wp26_enc_532_chen_qingzhi:0 "Chen Qingzhi (484-539)"
 game_concept_oe_wp26_enc_532_chen_qingzhi_desc:0 "Beginning his career as a modest attendant and chess companion to Xiao Yan, Chen Qingzhi became one of medieval China's most astonishing military tacticians. Neither robust in stature nor trained in archery from horseback, he commanded fierce devotion from his troops through calm foresight and logistical precision.\n\nIn 529, escorting the Northern Wei claimant Yuan Hao northward with just seven thousand white-cloaked soldiers, Chen fought forty-seven consecutive engagements, captured thirty-two fortified towns, and marched triumphantly into Luoyang itself. Though Erzhu Rong's overwhelming counterattack forced a withdrawal, Chen's later victories along the Huai frontier cemented his legend as the 'White-Cloaked General'."
 game_concept_oe_wp26_enc_532_gao_huan:0 "Gao Huan (496-547)"
 game_concept_oe_wp26_enc_532_gao_huan_desc:0 "Raised in the militarized Six Garrisons of northern Shanxi among Xianbeiized frontier soldiers, Gao Huan rose from humble border guard to become the paramount warlord of northeastern China after the collapse of the Erzhu clan in 532. Gathering both hardened garrison cavalry and wealthy Hebei aristocratic lineages, he established his seat at Jinyang while controlling the puppet court of Eastern Wei at Ye.\n\nShrewdly balancing Xianbei martial pride against Han agrarian taxation, Gao laid the military and fiscal foundations of the Northern Qi dynasty. His epic rivalry with Yuwen Tai along the Yellow River passes—from Shayuan to Mangshan and Yubi—defined the geopolitical partition of northern China for decades."
 game_concept_oe_wp26_enc_532_yuwen_tai:0 "Yuwen Tai (507-556)"
 game_concept_oe_wp26_enc_532_yuwen_tai_desc:0 "A Xianbei commander of Wuchuan Garrison who inherited leadership of the Guanlong frontier army in 534, Yuwen Tai forged the Western Wei state in Shaanxi despite holding far less territory and population than Gao Huan's Eastern Wei. By defeating Gao's superior force at Shayuan in 537 and defending Guanzhong's passes, he ensured the survival of an independent western realm centered on Chang'an.\n\nMore decisively still, Yuwen Tai engineered the Fubing divisional militia system and the Six Ministries inspired by the Rites of Zhou, fusing Xianbei warriors and northwestern Han elites into the Guanlong aristocracy—the very institutional crucible that later produced the Sui and Tang empires."
 game_concept_oe_wp26_enc_532_gelimer:0 "King Gelimer of the Vandals (480-553)"
 game_concept_oe_wp26_enc_532_gelimer_desc:0 "The last monarch of the Vandal and Alan Kingdom of Carthage, Gelimer deposed his Romanophile cousin Hilderic in 530 with the backing of traditionalist Arian nobles who resented Hilderic's concessions to Constantinople. That coup inadvertently handed Justinian I the legal pretext he sought to launch an amphibious reconquest of North Africa.\n\nCaught with his best troops detached to quell a revolt in Sardinia, Gelimer failed to coordinate his encirclement at Ad Decimum in September 533 and lost his kingdom at Tricamarum. After starving out the winter atop Mount Papua, he surrendered with stoic irony—quoting 'Vanity of vanities' in Belisarius's triumph—and retired peacefully to an imperial estate in Galatia."
 game_concept_oe_wp26_enc_532_amalasuntha:0 "Queen Amalasuntha of the Ostrogoths (c. 495-535)"
 game_concept_oe_wp26_enc_532_amalasuntha_desc:0 "Highly educated daughter of Theodoric the Great, Amalasuntha governed Ostrogothic Italy as regent for her young son Athalaric from 526, striving to sustain her father's delicate synthesis of Gothic armed might and Roman senatorial administration. Fluent in Latin, Greek, and Gothic, she cultivated close diplomatic ties with Justinian I and sheltered Roman civic institutions at Ravenna.\n\nHer insistence on a classical Roman education for Athalaric alienated Gothic warrior magnates. After Athalaric's premature death in 534, she shared power with her cousin Theodahad, who betrayed and murdered her on Lake Bolsena in 535—giving Justinian the decisive casus belli for the twenty-year Gothic War."
 game_concept_oe_wp26_enc_532_kaleb_aksum:0 "King Kaleb of Aksum (r. c. 514-540)"
 game_concept_oe_wp26_enc_532_kaleb_aksum_desc:0 "Known in Ge'ez inscriptions as Ella Atsbeha, King Kaleb raised the Christian Kingdom of Aksum to the zenith of Red Sea maritime dominance. Following the persecution of Najran's Christians by the Himyarite ruler Dhu Nuwas, Kaleb marshaled a formidable Ethiopian fleet—supported by Roman merchant vessels arranged through Constantinople—and crossed the Bab el-Mandeb in 525 to conquer southern Arabia.\n\nJustinian I courted Kaleb as a strategic Red Sea partner to bypass Sassanid silk monopolies via Indian Ocean shipping. Later in life Kaleb abdicated the crown, sent his diadem to Jerusalem, and entered a monastic hermitage, entering Ethiopian and universal Christian memory as Saint Elesbaan."
 game_concept_oe_wp26_enc_532_yashodharman:0 "Yashodharman of Malwa (fl. 528-540)"
 game_concept_oe_wp26_enc_532_yashodharman_desc:0 "Ruler of the Aulikara house of Dashapura and Ujjain in central India, Yashodharman stepped into the breach as the classical Gupta Empire fractured under relentless Alchon Hun incursions. Around 528 he forged a coalition with Gupta remnants and smashed the feared Hunnic king Mihirakula in decisive battle, breaking Alchon supremacy across the Gangetic plains.\n\nHis towering sandstone victory pillars at Sondani proclaim dominion stretching from the Brahmaputra to the Arabian Sea and from the Himalayas to the Eastern Ghats. Though his empire dissolved swiftly after his passing, his triumph saved northern Indian urban civilization from protracted steppe devastation."
 game_concept_oe_wp26_enc_lm_hagia_sophia:0 "Hagia Sophia — Great Church of Holy Wisdom"
 game_concept_oe_wp26_enc_lm_hagia_sophia_desc:0 "After the Nika riots of January 532 reduced the Theodosian basilica to ashes, Justinian I commissioned the mathematicians Anthemius of Tralles and Isidore of Miletus to erect a sanctuary without equal in human history. Completed in an astonishing five years and dedicated in December 537, its vast pendentive dome appeared suspended from heaven by a golden chain, bathed in forty clerestory windows and polychrome marble quarried from Thessaly, Phrygia, and Egypt.\n\nFor nearly a millennium Hagia Sophia served as the cathedral of the Ecumenical Patriarchate and the ceremonial heart of Eastern Roman coronations, inspiring both Orthodox architecture and the great domed mosques of the early modern Ottoman capital after 1453."
 game_concept_oe_wp26_enc_lm_corpus_juris_civilis:0 "Corpus Juris Civilis (Justinian's Code)"
 game_concept_oe_wp26_enc_lm_corpus_juris_civilis_desc:0 "Commissioned by Justinian I and executed under Tribonian between 529 and 534, the Corpus Juris Civilis gathered the entirety of classical and imperial Roman law into four interlocking parts: the imperial Code of imperial constitutions, the fifty-book Digest of juristic opinions, the Institutes manual for legal schools, and the later Novellae issued mostly in Greek.\n\nPreserving legal thought from Gaius, Papinian, and Ulpian that would otherwise have vanished, the compilation governed Eastern Roman courts for centuries and sparked the medieval European legal renaissance at Bologna—forming the enduring foundation of civil law systems across Europe, Latin America, and East Asia."
 game_concept_oe_wp26_enc_lm_theodosian_walls:0 "Theodosian Walls of Constantinople"
 game_concept_oe_wp26_enc_lm_theodosian_walls_desc:0 "Constructed under Praetorian Prefect Anthemius between 408 and 413 and strengthened with an outer moat and second curtain wall after the earthquake of 447, the six-kilometer Theodosian land ramparts turned Constantinople into the most formidable fortress in medieval Eurasia. Stretching from the Sea of Marmara to the Golden Horn, their staggered inner and outer limestone-and-brick curtains bristled with ninety-six flanking towers and a wide brick-lined ditch.\n\nAvars, Sassanids, Arab caliphs, Bulgars, and Rus hosts all broke in vain against these defenses for more than a thousand years, until Ottoman heavy siege bombards finally battered the Lycus valley breaches in 1453."
 game_concept_oe_wp26_enc_1204_theodore_laskaris:0 "Theodore I Laskaris (c. 1175-1221)"
 game_concept_oe_wp26_enc_1204_theodore_laskaris_desc:0 "Son-in-law of Emperor Alexios III Angelos and heroic defender of Constantinople during the Crusader siege of 1204, Theodore Laskaris crossed the Bosphorus as the capital fell and rallied Byzantine refugees, provincial soldiers, and Orthodox clergy around Nicaea and Prusa. Crowned emperor in 1208 by a newly re-established Ecumenical Patriarch in exile, he kept the flame of Roman legitimacy alive in western Anatolia.\n\nDespite fighting simultaneously against the Latin Empire to the northwest and the Seljuk Sultanate of Rum to the east, Theodore slew Sultan Kaykhusraw I in personal combat at Antioch on the Maeander in 1211, forging the resilient Empire of Nicaea that eventually reconquered Constantinople in 1261."
 game_concept_oe_wp26_enc_1204_baldwin_i:0 "Baldwin I of Constantinople (1172-1205)"
 game_concept_oe_wp26_enc_1204_baldwin_i_desc:0 "Count Baldwin IX of Flanders and VI of Hainaut took the cross for the Fourth Crusade and emerged as its foremost northern French magnate. When the Crusaders stormed Constantinople in April 1204 and partitioned the Byzantine lands under the Partitio Terrarum Imperii Romaniae, a joint Frankish-Venetian electoral council preferred the pious, younger Baldwin over Boniface of Montferrat as the first Latin Emperor.\n\nCrowned in Hagia Sophia on May 16, 1204, Baldwin inherited a shattered metropolis stripped of wealth and surrounded by hostile Greek nobles and an ascendant Bulgaria. Riding out against Tsar Kaloyan's Vlach, Bulgarian, and Cuman host at Adrianople in April 1205, he was captured and perished in Bulgarian captivity."
 game_concept_oe_wp26_enc_1204_enrico_dandolo:0 "Doge Enrico Dandolo (c. 1107-1205)"
 game_concept_oe_wp26_enc_1204_enrico_dandolo_desc:0 "Elected Doge of Venice in 1192 at well over eighty years of age and virtually blind, Enrico Dandolo possessed an iron will and geopolitical acumen that reshaped Mediterranean history. When the Fourth Crusade defaulted on its contract for Venetian transport galleys, Dandolo redirected the indebted knights first to reclaim rebellious Zara on the Adriatic and then toward Constantinople to restore the deposed Angeloi.\n\nPersonally leading Venetian war galleys against the Golden Horn sea walls under showers of arrows, he secured for Venice three-eighths of the former Byzantine realm—including Crete, key Peloponnesian ports, and Aegean trade hegemony—before dying in Constantinople in 1205 and being laid to rest inside Hagia Sophia."
 game_concept_oe_wp26_enc_1204_kaloyan:0 "Tsar Kaloyan of Bulgaria (c. 1170-1207)"
 game_concept_oe_wp26_enc_1204_kaloyan_desc:0 "Youngest of the Asen brothers who restored the Second Bulgarian Empire, Kaloyan (Ioannitsa) combined canny papal diplomacy with ferocious steppe-allied warfare. Securing royal coronation and an autonomous archbishopric from Pope Innocent III in 1204, he simultaneously offered friendship to the newly crowned Latin knights of Constantinople—only to be rebuffed with arrogant demands for feudal submission.\n\nAllying with discontented Thracian Greeks and swift Cuman horse-archers, Kaloyan lured Emperor Baldwin I's heavy cavalry into a devastating ambush at Adrianople in April 1205, shattering Latin expansion in Europe and earning both fear and grudging respect across the Balkans until his assassination outside Thessaloniki."
 game_concept_oe_wp26_enc_1204_genghis_khan:0 "Temujin — Genghis Khan (c. 1162-1227)"
 game_concept_oe_wp26_enc_1204_genghis_khan_desc:0 "In 1204 Temujin stood on the threshold of unifying the entire Mongolian steppe: having overcome the Kereits, he crushed the powerful Naiman confederation at Chakirmaut that summer, capturing the Uyghur scribe Tata-tonga and adopting the vertical Uyghur script for imperial chancery administration. Two years later, at the grand kurultai by the Onon River in 1206, the tribes proclaimed him Chinggis Khan, Universal Ruler.\n\nReorganizing steppe society into decimal military units (arban, jagun, mingghan, tumen) bound by meritocracy and the Yassa legal code, he forged the disciplined war machine that subdued Western Xia, shattered Jin northern China, toppled the Khwarazmian Empire, and opened the trans-Eurasian Pax Mongolica."
 game_concept_oe_wp26_enc_1204_emperor_ningzong:0 "Emperor Ningzong of Song (1168-1224)"
 game_concept_oe_wp26_enc_1204_emperor_ningzong_desc:0 "Ascending the Southern Song throne in Hangzhou in 1194 amid court factionalism, Emperor Ningzong presided over an era of dazzling commercial prosperity, ceramic artistry, and Neo-Confucian synthesis—yet acute strategic dilemma along the Huai frontier. In 1204 chief councillor Han Tuozhou championed revanchist sentiment, posthumously ennobling the martyr general Yue Fei and preparing the Kaixi Northern Expedition.\n\nWhen the 1206-1207 campaign against the Jurchen Jin faltered under Wu Xi's Sichuan mutiny and stretched logistics, Ningzong's court pivoted toward Shi Miyuan's cautious peace settlement of 1208, preserving Jiangnan's maritime wealth while the rising Mongol tempest gathered on the northern horizon."
 game_concept_oe_wp26_enc_1204_philip_ii_augustus:0 "Philip II Augustus of France (1165-1223)"
 game_concept_oe_wp26_enc_1204_philip_ii_augustus_desc:0 "The pivotal architect of the medieval French monarchy, Philip II transformed the Capetian crown from a modest Ile-de-France suzerainty into Western Europe's premier kingdom. In 1204—the very year Constantinople fell in the East—Philip broke the Angevin Empire by storming Chateau Gaillard and conquering Normandy, Anjou, Maine, and Touraine from King John of England.\n\nBeyond battlefield triumphs culminating in the decisive victory at Bouvines in 1214 against an Anglo-Welf-Flemish coalition, Philip fortified and paved Paris, built the Louvre fortress, chartered the University of Paris, and appointed salaried royal baillis to replace hereditary feudal administrators."
 game_concept_oe_wp26_enc_1204_pope_innocent_iii:0 "Pope Innocent III (1161-1216)"
 game_concept_oe_wp26_enc_1204_pope_innocent_iii_desc:0 "Born Lotario dei Conti di Segni and trained in theology at Paris and canon law at Bologna, Pope Innocent III raised the medieval papacy to the apex of its spiritual and political authority. Claiming universal arbitration over Christian kings, he intervened in the German imperial succession, placed France and England under interdict, and accepted feudal homage from Aragon, Bulgaria, and England.\n\nAlthough he initially excommunicated the Fourth Crusaders for attacking Christian Zara and condemned the brutal sack of Constantinople in 1204, he subsequently sought to bring the eastern churches under Rome while convening the landmark Fourth Lateran Council of 1215 to reform ecclesiastical discipline and doctrine."
 game_concept_oe_wp26_enc_1204_michael_epirus:0 "Michael I Komnenos Doukas (c. 1170-1215)"
 game_concept_oe_wp26_enc_1204_michael_epirus_desc:0 "A cousin of the Angeloi emperors who initially accompanied Boniface of Montferrat after the fall of Constantinople in 1204, Michael Komnenos Doukas swiftly broke with the Crusaders and rallied Greek resistance in western Greece around the walled river capital of Arta. Turning the rugged mountains of Epirus, Acarnania, and Aetolia into a defiant Byzantine bastion, he sheltered thousands of refugees fleeing Latin rule.\n\nThrough pragmatic treaties with Venice and agile campaigns against Frankish Thessalonica, Michael secured the survival of the Despotate of Epirus—the western twin rival to Nicaea in the century-long quest to reclaim the imperial city on the Bosphorus."
 game_concept_oe_wp26_enc_1204_alexios_trebizond:0 "Alexios I Megas Komnenos (c. 1182-1222)"
 game_concept_oe_wp26_enc_1204_alexios_trebizond_desc:0 "Grandson of the last Komnenian emperor Andronikos I and raised at the Georgian court of his aunt Queen Tamar, Alexios Komnenos marched along the Black Sea coast with Georgian troops in April 1204—weeks before Constantinople itself fell to the Fourth Crusade—and seized the wealthy Pontic port of Trebizond.\n\nAssuming the resonant title Megas Komnenos ('Grand Komnenos'), he and his brother David established the Empire of Trebizond. Anchored behind the Pontic Alps and enriched by Caucasian and Persian transit trade, his dynasty outlasted Constantinople itself, enduring on the Black Sea littoral until 1461."
 game_concept_oe_wp26_enc_lm_hippodrome_cistern:0 "Hippodrome & Basilica Cistern of Constantinople"
 game_concept_oe_wp26_enc_lm_hippodrome_cistern_desc:0 "At the civic heart of Constantinople stood two complementary marvels of Roman urbanism: the monumental Hippodrome expanded by Constantine the Great, where chariot factions voiced imperial acclamation and political dissent from the Nika riots onward, and Justinian I's subterranean Basilica Cistern (Yerebatan), supported by 336 marble columns storing eighty thousand cubic meters of aqueduct water against long sieges.\n\nDuring the Fourth Crusade sack of 1204, priceless bronze statuary crowning the Hippodrome's spina—including the four gilded horses carried off to Saint Mark's Basilica in Venice—was stripped away, yet the obelisks and silent subterranean vaults endured across empires."
 game_concept_oe_wp26_enc_lm_nicaean_exile_citadel:0 "Imperial Walls of Nicaea (Exile Capital)"
 game_concept_oe_wp26_enc_lm_nicaean_exile_citadel_desc:0 "Encircling the fertile lakeside basin of Lake Ascania with five kilometers of double brick-and-stone curtain walls and over a hundred semicircular towers, Nicaea's fortifications had already guarded the sites of the First and Seventh Ecumenical Councils. After 1204 Theodore I Laskaris and John III Doukas Vatatzes reinforced the outer ramparts and ditches to turn the city into an impregnable seat of Roman continuity in Anatolia.\n\nWithin these walls flourished the exiled Ecumenical Patriarchate, imperial mints striking gold hyperpyra, and scholarly scriptoria preserving classical Greek manuscripts until Michael VIII Palaiologos marched back through the Golden Gate of Constantinople in 1261."
 game_concept_oe_wp26_enc_1453_constantine_xi:0 "Constantine XI Palaiologos (1405-1453)"
 game_concept_oe_wp26_enc_1453_constantine_xi_desc:0 "Fourth son of Emperor Manuel II and Helena Dragas, Constantine XI proved his mettle as Despot of the Morea, rebuilding the Hexamilion wall across the Isthmus of Corinth and temporarily reuniting the Peloponnese under Byzantine banners. Crowned at Mystras in January 1449, he inherited a nearly bankrupt capital ringed by Ottoman power yet refused every offer to abandon the city for a comfortable pensioned exile.\n\nThroughout the fifty-three-day siege of spring 1453 he coordinated Greek defenders alongside Giovanni Giustiniani's Genoese volunteers along the crumbling Saint Romanos sector. When the walls finally gave way on May 29, he cast off his imperial insignia and fell sword in hand, entering Greek folklore as the Marble Emperor."
 game_concept_oe_wp26_enc_1453_mehmed_ii:0 "Sultan Mehmed II the Conqueror (1432-1481)"
 game_concept_oe_wp26_enc_1453_mehmed_ii_desc:0 "Returning to the Ottoman throne at nineteen in 1451, Mehmed II combined ruthless military innovation with Renaissance-scale imperial ambition. Casting gigantic bronze siege cannon with Hungarian founder Orban, raising Rumeli Hisari to seal the Bosphorus, and hauling war galleys overland past Galata into the Golden Horn, he stormed Constantinople on May 29, 1453, earning the epithet Fatih ('the Conqueror') and claiming the Roman style Kayser-i Rum.\n\nOver three subsequent decades he absorbed Serbia, the Morea, Trebizond, Bosnia, and Crimean vassalage, repopulated Istanbul with diverse guilds, codified Ottoman state law (Kanunname), and welcomed Greek scholars, Persian poets, and Italian painters such as Gentile Bellini to Topkapi Palace."
 game_concept_oe_wp26_enc_1453_yu_qian:0 "Yu Qian — Grand Minister of War (1398-1457)"
 game_concept_oe_wp26_enc_1453_yu_qian_desc:0 "A fiercely incorruptible Hangzhou scholar-official renowned from youth for his 'Ode to Limestone', Yu Qian saved the Ming dynasty from total collapse after the catastrophic Tumu Crisis of 1449, when Oirat forces destroyed the imperial field army and captured Emperor Yingzong. As panicked courtiers clamored to abandon Beijing for Nanjing, Yu Qian denounced flight, championed the enthronement of the Jingtai Emperor, and mobilized two hundred twenty thousand regional troops around Beijing's northern gates.\n\nOutside Desheng Gate he lured Esen Taishi's horsemen into disciplined firearms ambushes, repelling the invasion and forging the elite Twelve Training Camps (Tuanying). Tragically, after the 1457 Duomen Coup restored Yingzong, Yu Qian was executed on fabricated charges—leaving behind only empty chests and an immortal name for civic integrity."
 game_concept_oe_wp26_enc_1453_jingtai:0 "Jingtai Emperor — Zhu Qiyu (1428-1457)"
 game_concept_oe_wp26_enc_1453_jingtai_desc:0 "Younger half-brother of Emperor Yingzong, Zhu Qiyu was thrust onto the Ming throne in September 1449 during the darkest crisis since the dynasty's founding. Placing full trust in Yu Qian and capable provincial commanders, the Jingtai court rallied the Defense of Beijing, stabilized the northern passes, reorganized metropolitan military training, and oversaw vital Yellow River and Grand Canal repairs.\n\nYet the unexpected return of his elder brother from Oirat captivity in 1450 cast a shadow over his reign: confining Yingzong in the Southern Palace and replacing the crown prince triggered bitter succession friction, culminating in the 1457 Duomen Coup while Jingtai lay gravely ill, just weeks before his death."
 game_concept_oe_wp26_enc_1453_zhu_qizhen:0 "Emperor Yingzong — Zhu Qizhen (1427-1464)"
 game_concept_oe_wp26_enc_1453_zhu_qizhen_desc:0 "The only Ming sovereign to reign twice under separate era names (Zhengtong and Tianshun), Zhu Qizhen inherited the prosperous Renxuan realm as a boy before falling under the sway of the eunuch Wang Zhen. His ill-prepared personal expedition against the Oirats ended in disaster at Tumu in 1449, leaving him a steppe captive for a year and a secluded retired emperor in the Southern Palace for seven more.\n\nRestored to the throne by the 1457 Duomen Coup, his second reign began with the tragic execution of Yu Qian, yet matured into steadier administration under Grand Secretary Li Xian and ended with a humane testament that permanently abolished imperial concubine immolation in the Ming court."
 game_concept_oe_wp26_enc_1453_casimir_iv:0 "Casimir IV Jagiellon (1427-1492)"
 game_concept_oe_wp26_enc_1453_casimir_iv_desc:0 "Grand Duke of Lithuania from 1440 and King of Poland from 1447, Casimir IV forged the Jagiellonian realm into East-Central Europe's foremost dynastic powerhouse. Embracing the Prussian Confederation's appeal against the Teutonic Knights in 1454, he persevered through the grueling Thirteen Years' War to win Royal Prussia, Danzig, and Baltic access at the Second Peace of Thorn in 1466.\n\nThrough adroit dynastic diplomacy—placing his eldest son Vladislaus on the thrones of Bohemia and Hungary—he extended Jagiellonian crowns from the Baltic to the Adriatic, while granting the Nieszawa Statutes that elevated the Polish gentry Sejm into a defining parliamentary institution."
 game_concept_oe_wp26_enc_1453_frederick_iii:0 "Emperor Frederick III of Habsburg (1415-1493)"
 game_concept_oe_wp26_enc_1453_frederick_iii_desc:0 "The last Holy Roman Emperor crowned in Rome by a pope (1452) and ruler for an extraordinary fifty-three years, Frederick III was often mocked by fiery contemporaries for slow caution—yet outlasted every rival to lay the foundations of Habsburg world empire. In 1453 he ratified the Privilegium Maius, formally elevating Austria to an Archduchy and uniting his hereditary lands under his enigmatic motto A.E.I.O.U.\n\nEven when Matthias Corvinus occupied Vienna in 1485, Frederick calmly bided his time while arranging the epochal 1477 marriage of his son Maximilian to Mary of Burgundy, securing the rich Low Countries and launching the marital statecraft that soon spanned Europe and the Americas."
 game_concept_oe_wp26_enc_1453_cosimo_medici:0 "Cosimo de' Medici (1389-1464)"
 game_concept_oe_wp26_enc_1453_cosimo_medici_desc:0 "Head of Europe's premier banking network and unofficial master of Florence after his return from exile in 1434, Cosimo de' Medici governed the Tuscan republic without ever claiming a princely title—guiding elections from behind the scenes while cultivating popular and merchant loyalty. His bold diplomatic realignment with Francesco Sforza's Milan helped produce the Peace of Lodi in 1454, stabilizing Italy for forty years.\n\nAs Europe's greatest Renaissance patron, Cosimo financed Brunelleschi's cathedral dome, Donatello's bronzes, Fra Angelico's frescoes, the first public library at San Marco, and Marsilio Ficino's Platonic Academy, earning the posthumous civic honor Pater Patriae ('Father of the Fatherland')."
 game_concept_oe_wp26_enc_1453_francesco_sforza:0 "Francesco Sforza (1401-1466)"
 game_concept_oe_wp26_enc_1453_francesco_sforza_desc:0 "The most accomplished condottiere of fifteenth-century Italy, Francesco Sforza inherited his father Muzio's mercenary company and married Bianca Maria Visconti, natural daughter of Duke Filippo Maria of Milan. When the Visconti line ended in 1447 and the Golden Ambrosian Republic faltered under Venetian pressure, Sforza methodically besieged and entered Milan in 1450, winning acclamation as its new Duke.\n\nAlongside Cosimo de' Medici he anchored the 1454 Peace of Lodi and Italic League, modernized Milanese taxation and canals, rebuilt the Castello Sforzesco, and transformed a soldier's seizure of power into one of Renaissance Europe's most brilliant and orderly courts."
 game_concept_oe_wp26_enc_1453_george_podebrady:0 "George of Podebrady (1420-1471)"
 game_concept_oe_wp26_enc_1453_george_podebrady_desc:0 "Leader of the moderate Utraquist Hussites and provincial administrator of Bohemia by 1452, George of Podebrady brought order to a kingdom exhausted by decades of religious civil war. Following the sudden death of young King Ladislaus the Posthumous, the Bohemian estates elected George in 1458 as Europe's first non-Catholic monarch of the late medieval West.\n\nFamed for his 'King of Two Peoples' tolerance balancing Catholics and Hussites under the Compactata of Basel, he even circulated a visionary 1464 treaty proposal for a permanent European league of sovereign states to settle disputes peacefully and unite against Ottoman expansion—centuries ahead of modern international law."
 game_concept_oe_wp26_enc_1453_esen_taishi:0 "Esen Taishi of the Oirats (1407-1455)"
 game_concept_oe_wp26_enc_1453_esen_taishi_desc:0 "Inheriting the Choros leadership from his father Toghon in 1439, Esen Taishi united the Western Oirat Mongols with the Eastern Mongols, subdued Hami and the Jurchen borderlands, and briefly forged the most formidable steppe confederation since the fall of Dadu. When Ming border authorities slashed horse-tribute quotas in 1449, Esen launched a four-pronged offensive that annihilated the Ming field army at Tumu and captured Emperor Yingzong alive.\n\nRepulsed before Beijing by Yu Qian's iron defense, Esen returned the captive emperor in 1450 to sow discord at the Ming court, then broke steppe tradition by proclaiming himself Great Khan in 1453 despite lacking Chinggisid blood—a usurpation that triggered fatal internal rebellion within two years."
 game_concept_oe_wp26_enc_1453_pachacuti:0 "Sapa Inca Pachacuti (r. 1438-1471)"
 game_concept_oe_wp26_enc_1453_pachacuti_desc:0 "Born Cusi Yupanqui, he rallied the desperate defense of Cusco against the invading Chanka confederation in 1438 and took the throne name Pachacuti—'He Who Remakes the World'. Within a single generation he transformed a highland valley chiefdom into Tawantinsuyu, the Four-Quarter Empire stretching across the central Andes from Lake Titicaca to Quito.\n\nAs visionary builder as much as conqueror, Pachacuti redesigned Cusco in the form of a puma, perfected earthquake-resistant ashlar masonry at Sacsayhuaman and Machu Picchu, expanded the Qhapaq Nan mountain highway and chasqui relay network, and institutionalized state granaries and mit'a labor logistics."
 game_concept_oe_wp26_enc_lm_forbidden_city:0 "The Forbidden City (Zijincheng, Beijing)"
 game_concept_oe_wp26_enc_lm_forbidden_city_desc:0 "Ordered by the Yongle Emperor in 1406 and completed in 1420 after fourteen years of timber, marble, and golden-brick logistics drawn from across China, the Forbidden City served twenty-four Ming and Qing emperors for five centuries. Laid out along Beijing's sacred north-south meridian with 980 timber halls surrounded by ten-meter walls and a fifty-two-meter moat, its architecture translated Confucian cosmic hierarchy into glazed yellow tiles, marble terraces, and interlocking dougong brackets.\n\nFrom the Outer Court's Hall of Supreme Harmony—where imperial edicts, New Year audiences, and military triumphs were proclaimed—to the Inner Court's Grand Council chambers, Zijincheng stood as the ceremonial and administrative heart of the early modern East Asian world."
 game_concept_oe_wp26_enc_lm_grand_canal_huaian:0 "Grand Canal & Huai'an Qingkou Conservancy"
 game_concept_oe_wp26_enc_lm_grand_canal_huaian_desc:0 "Following the Yongle reopening of the northern canal reaches in 1411, the 1,800-kilometer Grand Canal became the fiscal and logistical spine of Ming and Qing China, carrying four million shi of Jiangnan tax grain north to Beijing each year. Its most perilous bottleneck lay at Qingkou near Huai'an, where the silt-laden Yellow River captured the Huai River course and crossed the canal.\n\nIn the sixteenth century hydraulic master Pan Jixun engineered the High Dike of Hongze Lake to 'confine clear water to scour yellow silt' (shushui gongsha). Governed by the imperial Director-Generals of Grain Transport and River Conservancy headquartered at Huai'an, this hydraulic nexus remained one of pre-industrial humanity's greatest feats of state engineering."
 game_concept_oe_wp26_enc_lm_porcelain_tower:0 "Porcelain Tower of Nanjing (Great Bao'en Temple)"
 game_concept_oe_wp26_enc_lm_porcelain_tower_desc:0 "Built between 1412 and 1431 outside Nanjing's Zhonghua Gate under the Yongle and Xuande emperors, the nine-story octagonal pagoda of the Great Bao'en Monastery soared nearly seventy-eight meters above the Yangtze plain. Clad entirely in luminous five-color glazed porcelain bricks baked at imperial kilns and hung with over one hundred forty night lanterns and bronze wind bells, it captivated travelers from every continent.\n\nEuropean envoys such as Johan Nieuhof hailed the Porcelain Tower alongside the Great Wall as one of the Wonders of the World, inspiring Chinoiserie pagodas across eighteenth-century Europe until the Taiping conflict tragically destroyed the original spire in 1856."
 game_concept_oe_wp26_enc_1648_louis_xiv:0 "King Louis XIV — The Sun King (1638-1715)"
 game_concept_oe_wp26_enc_1648_louis_xiv_desc:0 "Only ten years old when the Peace of Westphalia confirmed French gains in Alsace and the Fronde rebellions shook Paris, Louis XIV resolved never again to let rebellious princes or parlements dictate to the crown. Assuming personal rule in 1661 after Cardinal Mazarin's death, he built Europe's quintessential absolutist monarchy with ministers Jean-Baptiste Colbert, Louvois, and fortress genius Vauban.\n\nMoving the court to Versailles to tame the nobility through dazzling ceremonial etiquette, he made French the language of European diplomacy and taste while fighting four vast coalition wars that expanded France's frontiers to Strasbourg and Franche-Comte and placed a Bourbon prince upon the Spanish throne."
 game_concept_oe_wp26_enc_1648_oliver_cromwell:0 "Oliver Cromwell (1599-1658)"
 game_concept_oe_wp26_enc_1648_oliver_cromwell_desc:0 "A Huntingdonshire gentleman farmer with no formal military training until his forties, Oliver Cromwell forged the disciplined Ironsides cavalry and helped organize Parliament's professional New Model Army, shattering Royalist power at Marston Moor (1644), Naseby (1645), and Preston (1648). Convinced that King Charles I could no longer be trusted, he backed the monarch's trial and execution in January 1649.\n\nAs Lord Protector of the Commonwealth of England, Scotland, and Ireland from 1653, he enforced brutal pacification in Ireland and Scotland, enacted the Navigation Act that challenged Dutch maritime supremacy in the First Anglo-Dutch War, captured Jamaica from Spain, and left an indelible mark on British constitutional history."
 game_concept_oe_wp26_enc_1648_prince_dorgon:0 "Prince Regent Dorgon (1612-1650)"
 game_concept_oe_wp26_enc_1648_prince_dorgon_desc:0 "Fourteenth son of Nurhaci and brilliant strategist of the Eight Banners, Prince Rui Dorgon brokered the 1643 succession compromise that placed his young nephew Fulin (the Shunzhi Emperor) on the Qing throne under his own regency. Seizing the historic opening created by Li Zicheng's sack of Beijing in spring 1644, Dorgon accepted Wu Sangui's alliance, crushed the Shun army at Shanhai Pass, and entered Beijing in triumph.\n\nCombining rapid Banner offensives across Jiangnan and Shaanxi with pragmatic retention of Ming ministries, civil examinations, and surrendered Han generals, Dorgon laid the decisive foundations of Qing dominion over China—though his harsh tonsure edicts ignited fierce southern resistance before his sudden death in 1650."
 game_concept_oe_wp26_enc_1648_shunzhi:0 "Shunzhi Emperor — Fulin (1638-1661)"
 game_concept_oe_wp26_enc_1648_shunzhi_desc:0 "Enthroned at age five in Mukden and proclaimed sovereign in Beijing in October 1644, the Shunzhi Emperor became the first Qing monarch to reign from the Forbidden City. Following Prince Regent Dorgon's death in 1650, the teenage emperor asserted personal control, dismantled Dorgon's faction, and worked earnestly to bridge Manchu Banner governance and Han Confucian statecraft.\n\nIntellectually curious, Shunzhi mastered Chinese calligraphy, conversed warmly with the Jesuit astronomer Johann Adam Schall von Bell on calendar reform, welcomed the Fifth Dalai Lama to Beijing in 1653, and reined in bureaucratic corruption before smallpox cut his life short at twenty-two, leaving the throne to his young son Kangxi."
 game_concept_oe_wp26_enc_1648_yongli:0 "Yongli Emperor — Zhu Youlang (1623-1662)"
 game_concept_oe_wp26_enc_1648_yongli_desc:0 "Grandson of the Wanli Emperor, Zhu Youlang assumed the Southern Ming throne at Zhaoqing in late 1646 as the Yongli Emperor, sustaining the longest-lived Ming loyalist regime against Qing conquest. In 1648, as Jin Shenghuan in Jiangxi and Li Chengdong in Guangdong mutinied back to Ming allegiance, the Yongli court briefly recovered seven southern provinces and sent diplomatic appeals as far as Rome.\n\nLater allied with former Da Xi generals Sun Kewang and the devoted Li Dingguo across Guizhou and Yunnan, Yongli held the southwest for over a decade while coordinating symbolically with Zheng Chenggong on the coast, before being pushed into Burma and handed over to Wu Sangui in 1662."
 game_concept_oe_wp26_enc_1648_zheng_chenggong:0 "Zheng Chenggong — Koxinga (1624-1662)"
 game_concept_oe_wp26_enc_1648_zheng_chenggong_desc:0 "Born in Hirado to maritime magnate Zheng Zhilong and a Japanese mother, Zheng Chenggong broke irrevocably with his father when Zhilong submitted to the Qing in 1646. Honored with the imperial surname Zhu—hence 'Guoxingye' or Koxinga—by the Southern Ming court, he forged Xiamen and Kinmen into the hub of East Asia's mightiest armed merchant fleet, dominating commerce between China, Japan, and Southeast Asia.\n\nAfter his daring 1659 Yangtze campaign reached the walls of Nanjing before stalling, Koxinga turned across the strait in 1661 with twenty-five thousand seasoned soldiers, besieging Fort Zeelandia for nine months until the Dutch East India Company surrendered Taiwan in February 1662—establishing an enduring Ming bastion."
 game_concept_oe_wp26_enc_1648_li_dingguo:0 "Prince of Jin Li Dingguo (1621-1662)"
 game_concept_oe_wp26_enc_1648_li_dingguo_desc:0 "Originally an adopted son and cavalry general of rebel leader Zhang Xianzhong, Li Dingguo underwent one of history's most remarkable political transformations after 1647, swearing unswerving loyalty to the Ming Yongli Emperor to defend China against Qing conquest. Disciplined, austere, and protective of civilians, he restored Ming prestige across the southwest.\n\nIn 1652 his brilliant campaigns at Guilin and Hengzhou stunned the Qing Empire—driving Prince Kong Youde to suicide and slaying the Manchu commander Prince Nikan in battle—achieving the famed feat of 'felling two princes in one year'. Even after Sun Kewang's betrayal broke Ming unity, Li Dingguo fought to his last breath on the Burmese frontier, passing away in grief upon hearing of Yongli's death."
 game_concept_oe_wp26_enc_1648_shah_jahan:0 "Emperor Shah Jahan (1592-1666)"
 game_concept_oe_wp26_enc_1648_shah_jahan_desc:0 "Fifth Mughal Padishah and ruler from 1628 to 1658, Prince Khurram took the title Shah Jahan ('King of the World') and presided over the zenith of Mughal architectural splendor and administrative wealth. In 1648 he formally inaugurated his magnificent new imperial capital of Shahjahanabad (Old Delhi), centered on the sandstone Red Fort and Jama Masjid, while commissioning the jewel-encrusted Peacock Throne and the marble Taj Mahal at Agra in memory of Empress Mumtaz Mahal.\n\nMilitarily he subjugated the Deccan sultanates of Ahmadnagar, Bijapur, and Golconda and mounted costly campaigns toward Balkh and Kandahar, before his illness in 1657 ignited a fierce fratricidal war that left him confined by his son Aurangzeb overlooking the Taj Mahal."
 game_concept_oe_wp26_enc_1648_great_elector:0 "Frederick William — The Great Elector (1620-1688)"
 game_concept_oe_wp26_enc_1648_great_elector_desc:0 "Inheriting a devastated, scattered Brandenburg-Prussia in 1640 during the Thirty Years' War, Frederick William emerged from the 1648 Peace of Westphalia with Farther Pomerania, Halberstadt, Minden, and Magdeburg—and a fierce determination never again to be helpless before invading armies. Forging the 1653 Recess with the Junkers, he created a permanent standing army funded by centralized excise taxation.\n\nWinning full sovereignty over Ducal Prussia from Poland in 1657-1660 and routing the Swedes at Fehrbellin in 1675, he also welcomed twenty thousand skilled French Huguenot refugees via the 1685 Edict of Potsdam, laying every institutional brick of the future Kingdom of Prussia."
 game_concept_oe_wp26_enc_1648_tsar_alexis:0 "Tsar Alexis I of Russia (1629-1676)"
 game_concept_oe_wp26_enc_1648_tsar_alexis_desc:0 "Second Romanov Tsar and father of Peter the Great, Alexis Mikhailovich inherited a fragile realm shaken by the Moscow Salt Riot of 1648. Responding through a representative Zemsky Sobor, he promulgated the Sobornoye Ulozheniye of 1649—a comprehensive legal code that organized Russian society for nearly two centuries while binding peasants legally into full serfdom.\n\nUnder his reign Russia accepted Bohdan Khmelnytsky's Zaporozhian Cossacks in the 1654 Treaty of Pereyaslav, won Smolensk, Left-Bank Ukraine, and Kiev from Poland in the Truce of Andrusovo (1667), pushed explorers to the Pacific Amur, and weathered Patriarch Nikon's fateful liturgical reforms and Stenka Razin's uprising."
 game_concept_oe_wp26_enc_1648_queen_christina:0 "Queen Christina of Sweden (1626-1689)"
 game_concept_oe_wp26_enc_1648_queen_christina_desc:0 "Only surviving child of the warrior-king Gustavus Adolphus, Christina grew into one of seventeenth-century Europe's most learned and enigmatic monarchs. Against the hawkish counsel of Chancellor Axel Oxenstierna, she pressed steadfastly for the 1648 Peace of Westphalia, securing Western Pomerania, Wismar, and Bremen-Verden to crown Sweden's Baltic Empire while ending thirty years of bloodshed.\n\nTransforming Stockholm into the 'Athens of the North'—summoning Rene Descartes, Hugo Grotius's heirs, and European humanists to her library—she stunned Christendom in 1654 by abdicating the Lutheran throne in favor of her cousin Charles X Gustav, converting to Catholicism, and living out her days as a celebrated patron of arts and music in Rome."
 game_concept_oe_wp26_enc_1648_khmelnytsky:0 "Hetman Bohdan Khmelnytsky (1595-1657)"
 game_concept_oe_wp26_enc_1648_khmelnytsky_desc:0 "A Jesuit-educated Ruthenian noble and seasoned Zaporozhian Cossack officer, Bohdan Khmelnytsky ignited the earthquake that reshaped Eastern Europe in spring 1648. Forging a bold alliance with the Crimean Tatars, he crushed Polish Crown armies at Zhovti Vody, Korsun, and Pyliavtsi, liberating the Dnieper heartland and establishing an autonomous Cossack Hetmanate.\n\nPinned between Polish counteroffensives, wavering Tatar allies, and Ottoman suzerainty offers, Khmelnytsky swore allegiance to Tsar Alexis I in the 1654 Pereyaslav Agreement—shifting the balance of Eastern Europe decisively from the Polish-Lithuanian Commonwealth toward Moscow."
 game_concept_oe_wp26_enc_1648_tokugawa_iemitsu:0 "Shogun Tokugawa Iemitsu (1604-1651)"
 game_concept_oe_wp26_enc_1648_tokugawa_iemitsu_desc:0 "Third Shogun of the Tokugawa line and grandson of Ieyasu, Tokugawa Iemitsu famously declared himself a 'born Shogun' and completed the institutional architecture that kept Japan at peace for two and a half centuries. In 1635 he formalized sankin-kotai (alternate attendance), requiring every daimyo to maintain lavish residences and family hostages in Edo, draining feudal coffers while stimulating highway commerce.\n\nAfter suppressing the Shimabara Rebellion in 1638, Iemitsu finalized the maritime restriction edicts (kaikin / sakoku), channeling all foreign trade through strictly regulated gateways at Nagasaki's Dejima (Dutch and Chinese), Tsushima (Korea), Satsuma (Ryukyu), and Matsumae (Ezo)."
 game_concept_oe_wp26_enc_lm_versailles:0 "Palace of Versailles"
 game_concept_oe_wp26_enc_lm_versailles_desc:0 "Expanded from Louis XIII's modest brick hunting lodge by architects Louis Le Vau and Jules Hardouin-Mansart, painter Charles Le Brun, and landscape master Andre Le Notre, the Palace of Versailles became the supreme architectural statement of European absolutism when Louis XIV installed his court and ministries there in 1682. Its 73-meter Hall of Mirrors, geometric parterre gardens, and hydraulic fountains projected royal order over both nature and aristocracy.\n\nImitated from Potsdam and Vienna to Saint Petersburg, Versailles housed the French crown for over a century until the Revolutionary march of October 1789 returned Louis XVI to Paris."
 game_concept_oe_wp26_enc_lm_taj_mahal:0 "Taj Mahal & Shahjahanabad"
 game_concept_oe_wp26_enc_lm_taj_mahal_desc:0 "Rising on the southern bank of the Yamuna River at Agra between 1632 and 1648 under Emperor Shah Jahan and master designer Ustad Ahmad Lahori, the Taj Mahal synthesized Timurid-Persian chahar bagh garden geometry with Rajasthani Makrana white marble and inlaid semi-precious pietra dura stonework into one of humanity's most harmonious monuments.\n\nCompleted in the same year Shah Jahan inaugurated his grand planned capital of Shahjahanabad in Delhi with its Red Fort and Jama Masjid, these twin architectural triumphs reflected a Mughal Empire whose textile workshops and agrarian revenues accounted for nearly a quarter of the early modern global economy."
 game_concept_oe_wp26_enc_lm_westphalia_halls:0 "Peace Halls of Munster & Osnabruck (1648)"
 game_concept_oe_wp26_enc_lm_westphalia_halls_desc:0 "Between 1643 and October 24, 1648, over a hundred diplomatic envoys representing nearly two hundred European rulers, imperial estates, and republics negotiated simultaneously in the neutral Westphalian cities of Catholic Munster and Protestant Osnabruck to end the catastrophic Thirty Years' War and the Eighty Years' War.\n\nThe resulting treaties recognized Dutch and Swiss independence, extended imperial religious toleration to Calvinists alongside Catholics and Lutherans, guaranteed German territorial princes sovereign treaty rights, and inaugurated the modern diplomatic order of multilateral congresses and territorial state sovereignty."
 game_concept_oe_wp26_enc_1776_george_washington:0 "George Washington (1732-1799)"
 game_concept_oe_wp26_enc_1776_george_washington_desc:0 "A Virginia planter and veteran of the Seven Years' War frontier, George Washington accepted command of the Continental Army in 1775 and held the fledgling American Revolution alive through defeat, winter privation at Valley Forge, and chronic congressional poverty. Combining strategic Fabian persistence with daring counterstrokes at Trenton, Princeton, and the Franco-American encirclement at Yorktown (1781), he compelled Britain to recognize American independence.\n\nEven more revolutionary than his military endurance was his republican restraint: resigning his military commission to civilian Congress in 1783, chairing the 1787 Constitutional Convention, and stepping down voluntarily after two terms as the first President of the United States."
 game_concept_oe_wp26_enc_1776_qianlong:0 "Qianlong Emperor — Hongli (1711-1799)"
 game_concept_oe_wp26_enc_1776_qianlong_desc:0 "Ruling the Qing Empire in person for sixty years (1735-1796) and wielding supreme influence as Retired Emperor until 1799, Hongli—the Qianlong Emperor—presided over the territorial and demographic zenith of imperial China. His Ten Great Campaigns extinguished the Dzungar Khanate, incorporated Xinjiang into the empire, solidified authority over Tibet and Mongolia, and maintained a vast tributary frontier.\n\nA prolific poet, art collector, and patron of the monumental Siku Quanshu encyclopedia, he governed a multicultural realm of three hundred million subjects—yet late-reign fiscal strain, literary censorship, official corruption under Heshen, and dismissal of Britain's Macartney Embassy foreshadowed nineteenth-century storms."
 game_concept_oe_wp26_enc_1776_frederick_ii:0 "Frederick II the Great (1712-1786)"
 game_concept_oe_wp26_enc_1776_frederick_ii_desc:0 "Flute-playing philosopher-king, correspondent of Voltaire, and tactical genius of the oblique order, Frederick II vaulted Prussia from a second-tier German electorate into the pentarchy of European Great Powers. Seizing wealthy Silesia from Austria in 1740, he defended his prize through the existential crucible of the Seven Years' War (1756-1763) against France, Austria, and Russia with masterstrokes at Rossbach and Leuthen.\n\nProclaiming himself 'the first servant of the state', he abolished judicial torture, championed religious toleration, drained the Oder marshes, promoted potato cultivation, and joined Russia and Austria in the 1772 First Partition of Poland that united Brandenburg with East Prussia."
 game_concept_oe_wp26_enc_1776_catherine_ii:0 "Catherine II the Great (1729-1796)"
 game_concept_oe_wp26_enc_1776_catherine_ii_desc:0 "Born Princess Sophie of Anhalt-Zerbst in Stettin, Catherine mastered Russian language, Orthodoxy, and court politics before seizing the throne in the 1762 guards coup. Over thirty-four dynamic years she completed Peter the Great's imperial vision across the Black Sea and Eastern Europe: crushing the Ottoman fleet at Chesma (1770), winning the Treaty of Kucuk Kaynarca (1774), annexing the Crimean Khanate in 1783, and founding Black Sea ports such as Sevastopol and Odessa.\n\nCorresponding with Diderot and Voltaire, she drafted the Enlightenment-inspired Nakaz legal instruction, founded the Hermitage collection and Smolny Institute, and led the Partitions of Poland—yet after Pugachev's massive Cossack-peasant rebellion (1773-1775) she entrenched noble privileges and serfdom across the empire."
 game_concept_oe_wp26_enc_1776_george_iii:0 "King George III of Great Britain (1738-1820)"
 game_concept_oe_wp26_enc_1776_george_iii_desc:0 "The first Hanoverian monarch born in Britain and speaking English as his native tongue, George III ascended the throne in 1760 as the Seven Years' War vaulted Britain into global maritime preeminence from Canada to Bengal. Determined to uphold parliamentary sovereignty and imperial fiscal unity, his ministries' colonial taxation policies sparked the American Revolutionary War in 1775-1783.\n\nThough remembered abroad for losing the Thirteen Colonies, his sixty-year reign witnessed the Industrial Revolution's takeoff, the expansion of British India, the Royal Academy of Arts, Kew Gardens, and the eventual defeat of Napoleonic France—shadowed in his final decade by recurrent neurological illness."
 game_concept_oe_wp26_enc_1776_louis_xvi:0 "King Louis XVI of France (1754-1793)"
 game_concept_oe_wp26_enc_1776_louis_xvi_desc:0 "Well-intentioned, pious, and fascinated by cartography and locksmithing, Louis XVI inherited an indebted Ancien Regime in 1774 whose privileged estates fiercely resisted fiscal reform. Guided by Foreign Minister Vergennes, he intervened decisively in the American Revolution in 1778, dispatching fleets and armies under Rochambeau and de Grasse that secured American independence and avenged France's Seven Years' War humiliation.\n\nYet that geopolitical triumph bankrupted the royal treasury. Unable to push tax equalization past the parlements after dismissing reformers Turgot and Calonne, Louis summoned the Estates-General in 1789—setting in motion the French Revolution that swept away absolute monarchy and brought him to the guillotine in 1793."
 game_concept_oe_wp26_enc_1776_charles_iii:0 "King Charles III of Spain (1716-1788)"
 game_concept_oe_wp26_enc_1776_charles_iii_desc:0 "Seasoned by twenty-five years as reforming King of Naples and Sicily—where he patronized the excavation of Pompeii and Herculaneum—Charles III ascended the Spanish throne in 1759 as the ablest of the Spanish Bourbons. Assisted by Enlightenment ministers Esquilache, Aranda, Campomanes, and Floridablanca, he modernized Madrid's streets, liberalized colonial trade across Spanish ports, and established the Viceroyalty of the Rio de la Plata in 1776.\n\nRebuilding the Spanish Armada after 1763, Charles entered the American Revolutionary War in 1779, recovering Menorca and Florida through Bernardo de Galvez's Gulf Coast campaigns while leaving Spain at its eighteenth-century peak."
 game_concept_oe_wp26_enc_1776_maria_theresa:0 "Archduchess Maria Theresa (1717-1780)"
 game_concept_oe_wp26_enc_1776_maria_theresa_desc:0 "The sole female ruler of the Habsburg dominions, Maria Theresa inherited a beleaguered empire in 1740 immediately assailed by Prussia, France, and Bavaria in the War of the Austrian Succession. Rallying the Hungarian Diet with legendary poise, she preserved the Habsburg monarchy and launched sweeping modernizations with ministers Haugwitz and Kaunitz.\n\nStandardizing taxation across aristocratic estates, establishing mandatory primary schooling, founding the Theresian Military Academy, and engineering the 1756 Diplomatic Revolution that allied Vienna with Bourbon France, she co-ruled from 1765 with her impatient son Joseph II while transforming Austria into a resilient bureaucratic superpower."
 game_concept_oe_wp26_enc_1776_king_jeongjo:0 "King Jeongjo of Joseon (1752-1800)"
 game_concept_oe_wp26_enc_1776_king_jeongjo_desc:0 "Ascending the Joseon throne in 1776 after the tragic childhood loss of his father Crown Prince Sado, King Jeongjo ushered in Korea's celebrated eighteenth-century cultural and administrative renaissance. Founding the Kyujanggak Royal Library as both an archival academy and policy think tank, he opened advancement to gifted scholars from marginalized secondary lineages and championed Practical Learning (Silhak) thinkers such as Jeong Yagyong.\n\nBalancing court factions through his impartial Tangpyeong policy, dismantling monopolistic guild restrictions in Seoul via the 1791 Sinhae Tonggong reform, and erecting the innovative brick-and-stone Hwaseong Fortress at Suwon using pulley cranes, Jeongjo embodied enlightened East Asian statecraft."
 game_concept_oe_wp26_enc_1776_king_taksin:0 "King Taksin the Great of Thonburi (1734-1782)"
 game_concept_oe_wp26_enc_1776_king_taksin_desc:0 "Born Sin to a Teochew Chinese tax-farmer father and a Thai mother, Taksin broke through Burmese encirclement before the catastrophic sack of Ayutthaya in April 1767 with barely five hundred followers. Rallying coastal garrisons from Chanthaburi within seven months, he sailed up the Chao Phraya, expelled the Burmese occupation force, and established a new river capital at Thonburi.\n\nOver a decade of relentless campaigning alongside his trusted commanders Chao Phraya Chakri and Surasi, Taksin reunified Siam, drove Burmese armies from Lan Na (Chiang Mai), extended suzerainty over Laos and Cambodia, and revived overseas junk trade with Qing Canton—earning eternal veneration as Thailand's savior."
 game_concept_oe_wp26_enc_1776_hyder_ali:0 "Hyder Ali of Mysore (c. 1720-1782)"
 game_concept_oe_wp26_enc_1776_hyder_ali_desc:0 "Rising from an illiterate cavalry officer in the Kingdom of Mysore to become its de facto sovereign in 1761, Hyder Ali proved the most formidable military modernizer facing the British East India Company in eighteenth-century South Asia. Employing French drillmasters, constructing state arsenals, and pioneering iron-cased Mysorean war rockets far outranging European artillery, he built a centralized, religiously pragmatic realm across southern India.\n\nIn the First Anglo-Mysore War (1767-1769) he marched straight to the gates of Madras to dictate terms, and in 1780 launched the Second Anglo-Mysore War with a devastating victory at Pollilur—bequeathing to his son Tipu Sultan an unmatched tradition of anti-colonial technological warfare."
 game_concept_oe_wp26_enc_lm_independence_hall:0 "Independence Hall of Philadelphia"
 game_concept_oe_wp26_enc_lm_independence_hall_desc:0 "Completed in 1753 in Georgian red brick as the Pennsylvania State House, Philadelphia's civic hall became the crucible of modern constitutional republicanism. Within its Assembly Room the Second Continental Congress appointed George Washington Commander-in-Chief in 1775 and adopted the Declaration of Independence on July 4, 1776, proclaiming that legitimate government derives from the consent of the governed.\n\nEleven summers later, delegates returned to the very same chamber behind closed windows to draft the Constitution of the United States in 1787, forging a federal republic of separated powers whose legal architecture reverberated across the Atlantic and global revolutionary movements."
 game_concept_oe_wp26_enc_lm_siku_quanshu:0 "Imperial Library of the Four Treasuries (Siku Quanshu)"
 game_concept_oe_wp26_enc_lm_siku_quanshu_desc:0 "Commissioned by the Qianlong Emperor in 1773 and compiled over a decade by Chief Editor Ji Yun alongside more than three hundred sixty eminent scholars and thousands of calligraphers, the Siku Quanshu ('Complete Library in Four Sections': Classics, History, Philosophy, and Belles-Lettres) stands as the largest manuscript encyclopedia in pre-modern history—preserving 3,461 complete works across 36,381 volumes.\n\nSeven hand-copied master sets were housed in specially built fire-guarded pavilions modeled on Ningbo's Tianyi Pavilion, led by the Wenyuan Pavilion inside the Forbidden City. Alongside monumental preservation and evidential philology, the project also carried out rigorous imperial censorship of texts deemed disrespectful to the Manchu dynasty."
 game_concept_oe_wp26_enc_lm_winter_palace:0 "Winter Palace & Saint Petersburg"
 game_concept_oe_wp26_enc_lm_winter_palace_desc:0 "Rising in emerald, white, and gold along the Neva embankment to the baroque vision of Bartolomeo Rastrelli and completed just as Catherine II took power in 1762, the fourth Winter Palace anchored Peter the Great's 'Window on Europe'. Its more than one thousand five hundred state rooms, Jordan Staircase, and adjacent Hermitage galleries displayed the Russian Empire's transition from secluded Muscovy to continental arbiter.\n\nFrom Saint Petersburg's Admiralty shipyards and Academy of Sciences to Catherine's Bronze Horseman monument, the Neva capital embodied the grand architectural and geopolitical ambition of imperial Russia across the eighteenth and nineteenth centuries."
 shanyang_huaian_desc:0 "Shanyang—seat of Huai'an Prefecture—guarded the vital junction of the Grand Canal and the historic Huai River. Serving from the Yongle reign onward as headquarters of the imperial Director-General of Grain Transport, its customs houses, wharves, and salt-merchant quarters coordinated millions of shi of Jiangnan tax grain bound north for Beijing."
 qinghe_huaian_desc:0 "Qinghe—known to hydraulic engineers as Qingkou—lay at the perilous triple confluence where the silt-choked Yellow River met the Huai River and the Grand Canal. Reinforced by masters such as Pan Jixun and Jin Fu through Hongze Lake's high dikes and sluice gates, its 'clear water scouring yellow silt' works kept China's imperial grain lifeline open."
 mysore_desc:0 "Set atop the fertile Deccan plateau of southern Karnataka, Mysore emerged from the twilight of Vijayanagara under the Wadiyar rulers. In the late eighteenth century Hyder Ali and Tipu Sultan transformed it into a formidable modernizing state whose state arsenals and iron-cased Mysorean war rockets repeatedly stunned British East India Company armies."
 munster_desc:0 "Set at the heart of Westphalia, Munster thrived as both a prince-bishopric capital and a prosperous inland Hanseatic center. Between 1643 and 1648 its gothic Town Hall hosted the Catholic envoys of the Congress of Westphalia, producing the landmark treaties that ended the Thirty Years' and Eighty Years' Wars and defined European state sovereignty."
 berlin_desc:0 "Growing from twin Spree river trading towns into the Hohenzollern electoral residence, Berlin recovered dramatically after the Thirty Years' War under the Great Elector's canal works and Huguenot immigration. Expanded in the eighteenth century with the boulevards, academies, and arsenals of Frederick the Great, it stood as the disciplined capital of ascendant Prussia."
 potsdam_desc:0 "Surrounded by the lakes and pinewoods of the Havel River, Potsdam rose to renown with the Great Elector's 1685 Edict of Potsdam welcoming Huguenot artisans. Crowned in the 1740s by Frederick the Great's terraced vineyard pavilion of Sanssouci, the town paired Prussian garrison discipline with the philosophical salons of the European Enlightenment."
 shackamaxon_desc:0 "Where the Schuylkill meets the Delaware, the Lenape council ground of Shackamaxon became the site of William Penn's 1682 treaty and the planned grid of Philadelphia. By 1776 the city ranked as British North America's foremost port and center of print culture, hosting both the Declaration of Independence and the 1787 Constitutional Convention in its State House."
 orkhon_desc:0 "Watered by clear mountain streams across Mongolia's central steppe, the Orkhon Valley served for over two millennia as the sacred imperial heartland of Xiongnu, Rouran, Gokturk, Uyghur, and Mongol rulers. Crowned by the eighth-century Orkhon runic stelae and later by Karakorum, the valley anchored the political and caravan rhythms of Inner Asia."
 toshima_kanto_desc:0 "Positioned where the Musashi plain meets Edo Bay, Toshima grew around the castle first fortified by Ota Dokan and transformed by Tokugawa Ieyasu into the shogunal seat in 1603. Fueled by Tokugawa Iemitsu's alternate-attendance system, Edo expanded into a metropolis of over a million inhabitants renowned for merchant guilds, kabuki theater, and vibrant print culture."
 gonder_desc:0 "Perched in the rugged highlands north of Lake Tana, Gondar became the permanent capital of Ethiopia in 1636 under Emperor Fasilides, ending centuries of itinerant royal camps. Crowned by the crenellated stone castles of the Fasil Ghebbi and frescoed churches, the city flourished as the artistic, liturgical, and diplomatic jewel of the Solomonic Empire."
 bosra_desc:0 "Built from dark volcanic basalt across the fertile Hauran plain, Bosra served as capital of Roman Arabia, headquarters of Legio III Cyrenaica, and home to one of antiquity's finest preserved stone theaters. In the sixth century its caravan roads and churches anchored the Ghassanid Arab-Roman frontier shielding Byzantine Syria against desert and Sassanid raids."
 ujjain_desc:0 "Standing beside the Shipra River on the fertile Malwa plateau, ancient Ujjain served Indian astronomers as the classical prime meridian while connecting Gangetic overland roads to Gujarat's Arabian Sea ports. In the sixth century it formed the heartland of King Yashodharman's triumph over the Alchon Huns, safeguarding classical Sanskrit scholarship and temple artistry."
