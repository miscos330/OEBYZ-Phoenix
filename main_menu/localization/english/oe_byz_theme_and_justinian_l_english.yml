l_english:
 oe_byz_theme_system_reform: "Theme System"
 oe_byz_theme_system_reform_desc: "A system of provincial headquarters and armies, spearheaded by a strategos with dual responsibilities to protect the locals and establish authority at the behest of the [GetCountry('BYZ').GetFlavorRank]. This system replaced the provincial administration of Diocletian and has served our people ever since. Yet time has worn it thin, it endures still, a relic of ages long past."
 oe_byz_justinian_code: "Code of Justinian"
 oe_byz_justinian_code_desc: "Imperial enactments, the writings of jurists and generations of judgments form the foundation of Roman law. Affirm the authority of the #Y Code of Justinian#!, binding public offices to a common legal order, guiding the deliberations of the court and preventing officeholders from treating public authority as private property."
