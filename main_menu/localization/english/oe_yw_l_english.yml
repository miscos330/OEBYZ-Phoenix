 STATIC_MODIFIER_NAME_oe_yw_tier_loyal: "A Loyal Prince"
 STATIC_MODIFIER_DESC_oe_yw_tier_loyal: "This prince receives the #bold #color_yellow annual grant#!#! on time, often comes to the #bold #color_yellow Shangdu assembly#!#! and is loyal to the Yuan court."
 STATIC_MODIFIER_NAME_oe_yw_tier_aloof: "An Aloof Prince"
 STATIC_MODIFIER_DESC_oe_yw_tier_aloof: "This prince is cool towards the Yuan court: the #bold #color_yellow annual grant#!#! comes late, and the prince stays away from the assembly."
 STATIC_MODIFIER_NAME_oe_yw_tier_estranged: "An Estranged Prince"
 STATIC_MODIFIER_DESC_oe_yw_tier_estranged: "This prince has turned away from the Yuan court."
 STATIC_MODIFIER_NAME_oe_yw_qas_horses: "The Prince of Qi's Horses"
 STATIC_MODIFIER_DESC_oe_yw_qas_horses: "The herds sent by the house of Qasar fill the Yuan's cavalry."
 oe_yw_bw_shen_fail: "The Shen Faction's Failed Coup"
 oe_yw_bw_duan_aid: "Dali Came to Liang's Aid"
 oe_yw_bw_duan_slain: "Duan Gong's Murder (One Account)"
 oe_yw_bw_duan_peace: "Liang and Dali Reconciled"
 oe_yw_bw_glh_grant: "Appanage Revenue Paid"
 oe_yw_touxia: "Appanage Prince"
 oe_yw_touxia_desc: "The princes of the Yuan hold appanages by inheritance; the court collects their revenue and pays their annual grant. An appanage prince cannot be annexed by the overlord, and the overlord cannot end the tie. It declares no wars of its own, its diplomacy is limited by the overlord, and it follows the overlord into defensive wars. A loyal prince joins the overlord's offensive wars unasked; the others must be called, and an estranged prince will not answer. It keeps its own colour on the map."
 LEAD_oe_yw_touxia: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yw_touxia: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yw_touxia_subject_opinion: "Our Great Khan"
 oe_yw_touxia_overlord_opinion: "Our Prince"
 oe_yw_touxia_join_tt: "The prince's loyalty tier among the Yuan princes is Loyal"
 oe_yw_touxia_call_tt: "The prince's loyalty tier among the Yuan princes is not Estranged"
 oe_yw.1.t: "A Khongirad Empress"
 oe_yw.1.d: "#F In the third month of the third Zhiyuan year (April 1337) Emperor Toghon Temür made Bayan Khutugh of the Khongirad empress, with a jade seal and a jade patent. The Khongirad had long given the Yuan its empresses; the Prince of Lu held Yingchang and Quanning for generations and chose the officials of both circuits without appointments from the court.#!\n\nNow the investiture is at hand, and the envoys of the Prince of Lu have reached Dadu.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.1.a: "Invest the Khongirad lady by the old custom"
 oe_yw.1.a.tt: "Loyalty target of the Prince of Lu #G +10#! for #Y 60#! months."
 oe_yw.1.b: "Invest the empress and reward the consort clan richly"
 oe_yw.1.b.tt: "The Prince of Lu receives the same sum.\nLoyalty target of the Prince of Lu #G +15#! for #Y 60#! months."
 oe_yw.1.c: "Keep the ceremony plain"
 oe_yw.1.c.tt: "Loyalty target of the Prince of Lu #R −10#! for #Y 24#! months."
 oe_yw.2.t: "The Death of the Prince of Tan"
 oe_yw.2.d: "#F In the fifth Zhiyuan year (1339) Bayan framed Chechetu, the Prince of Tan, and asked that the prince be put to death; the emperor refused, and Bayan had the sentence carried out in the emperor's name. Bayan also had two more princes, of Xuanrang and of Weishun, demoted before any edict came.#!\n\nNow the princes have heard, and every one of them fears for their own safety.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.2.a: "Bear it in silence"
 oe_yw.2.a.tt: "Loyalty target of every member prince #R −10#!, until the princes are reassured #Y 12#! months after Bayan loses power."
 oe_yw.2.b: "Send envoys to reassure the princes"
 oe_yw.2.b.tt: "The money goes to the member princes by the ranks of the #bold #color_yellow annual grant#!#! (none to the Prince of Shen).\nLoyalty target of every member prince #R −5#!, until the princes are reassured #Y 12#! months after Bayan loses power."
 oe_yw.2.c: "Rebuke Bayan by edict"
 oe_yw.2.c.tt: "The princes bear no grievance. Bayan stays or goes as before."
 oe_yw.3.t: "The Prince of Qi's Horses"
 oe_yw.3.d1: "#F In the eighth month of the twelfth Zhizheng year (1352) Shiliemen, the Prince of Qi, presented fifteen thousand horses to the capital (some say ten thousand).#!\n\nNow the herds of Shiliemen, the Prince of Qi, have reached the walls of Dadu.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.3.d: "#F In the eighth month of the twelfth Zhizheng year (1352) Shiliemen, the Prince of Qi, presented fifteen thousand horses to the capital (some say ten thousand).#!\n\nNow [GetCountry('QAS').GetGovernment.GetRuler.GetName] of the house of Qasar has sent herds of horses.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.3.a: "Accept the horses and reward the giver richly"
 oe_yw.3.a.tt: "The house of Qasar receives the same sum.\nLoyalty target of the house of Qasar #G +10#! for #Y 60#! months."
 oe_yw.3.b: "Accept the horses and record the service"
 oe_yw.3.b.tt: "Loyalty target of the house of Qasar #G +5#! for #Y 60#! months."
 oe_yw.3.c: "Decline the gift"
 oe_yw.3.c.tt: "Loyalty target of the house of Qasar #R −10#! for #Y 60#! months."
 oe_yw.4.t: "The Prince of Liang"
 oe_yw.4.d1: "#F According to the Dictionary of Chinese History, Bolod, younger brother of Aru, the Prince of Yunnan, succeeded as Prince of Yunnan in the Zhizheng years and was raised to Prince of Liang for merit in the fifteenth Zhizheng year (1355).#!\n\nNow the household of the Prince of Yunnan asks for a higher title.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.4.d: "#F According to the Dictionary of Chinese History, Bolod, younger brother of Aru, the Prince of Yunnan, succeeded as Prince of Yunnan in the Zhizheng years and was raised to Prince of Liang for merit in the fifteenth Zhizheng year (1355).#!\n\nNow the household of the Prince of Yunnan reports Bolod's merits and asks for a higher title.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.4.a: "Raise the prince to Prince of Liang"
 oe_yw.4.a.tt: "Loyalty target of the Prince of Yunnan #G +10#! for #Y 60#! months.\nYunnan is called Liang again. If Yunnan is AI, its prestige #Y +5#!."
 oe_yw.4.b: "Let the prince remain Prince of Yunnan"
 oe_yw.4.b.tt: "Loyalty target of the Prince of Yunnan #R −5#! for #Y 60#! months."
 oe_yw.5.t: "The Prince of Yangdi Demands the Seal"
 oe_yw.5.d1: "#F In the twentieth Zhizheng year (1360) Aluhui Temür, the Prince of Yangdi, camped with several hundred thousand men at Mu'erguchewu and threatened the capital region. The prince's envoy said: 'Our ancestors gave you the realm, and you have lost the greater part of it. Give me the seal of state, and I will rule it myself.' The court sent Tügen Temür of the Bureau of Military Affairs and others against the prince, without success.#!\n\nNow the envoy of the Prince of Yangdi stands before the throne.\nAs the Prince of Yangdi is AI, this has already raised the prince's liberty desire by #R +10#! and changed the loyalty target by #R −20#! (#Y 36#! months).\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.5.d: "#F In the twentieth Zhizheng year (1360) Aluhui Temür, the Prince of Yangdi, camped with several hundred thousand men at Mu'erguchewu and threatened the capital region. The prince's envoy said: 'Our ancestors gave you the realm, and you have lost the greater part of it. Give me the seal of state, and I will rule it myself.' The court sent Tügen Temür of the Bureau of Military Affairs and others against the prince, without success.#!\n\nNow the envoy of the Prince of Yangdi stands before the throne.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.5.a: "Send generals against the prince"
 oe_yw.5.a.tt: "If the Prince of Yangdi is AI: the rising may be put down in the second half of next year; the prince's liberty desire #G −20#!, and the loss in the loyalty target ends."
 oe_yw.5.b: "Buy peace with rich gifts"
 oe_yw.5.b.tt: "The Prince of Yangdi receives half of it.\nThe Prince of Yangdi's loyalty target item becomes #G +5#! for #Y 36#! months.\nIf the Prince of Yangdi is AI: the prince's liberty desire #G −10#!."
 oe_yw.5.c: "Ignore the demand"
 oe_yw.5.c.tt: "The loss in the Prince of Yangdi's loyalty target stays."
 oe_yw.6.t: "The Prince of Zhao Flees by Night"
 oe_yw.6.d1: "#F In the ninth month of the eighteenth Zhizheng year (1358) Mieli, a follower of the Prince of Zhao, rose and meant to kill the prince. Xiban Temür, an official of the prince's household, and Xiban Temür's wife, who had nursed the prince as a child, dressed their son Guanyinnu in the prince's robes and left the boy in the palace, and at midnight led the prince away in disguise. The rebels came and killed Guanyinnu; the prince escaped.#!\n\nNow the Prince of Zhao's urgent report has reached Dadu.\nAs the Prince of Zhao is AI, the rising has already cost the prince #Y −7#! stability.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.6.d: "#F In the ninth month of the eighteenth Zhizheng year (1358) Mieli, a follower of the Prince of Zhao, rose and meant to kill the prince. Xiban Temür, an official of the prince's household, and Xiban Temür's wife, who had nursed the prince as a child, dressed their son Guanyinnu in the prince's robes and left the boy in the palace, and at midnight led the prince away in disguise. The rebels came and killed Guanyinnu; the prince escaped.#!\n\nNow the Prince of Zhao's urgent report has reached Dadu.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.6.a: "Send troops to pacify the Ongud"
 oe_yw.6.a.tt: "If the Prince of Zhao is AI: the prince's stability #Y +7#! (making up for the rising).\nLoyalty target of the Prince of Zhao #G +10#! for #Y 60#! months."
 oe_yw.6.b: "Let the prince settle the tribe alone"
 oe_yw.6.b.tt: "Loyalty target of the Prince of Zhao #R −5#! for #Y 60#! months."
 oe_yw.7.t: "The Shazhou Troops Go to Sichuan"
 oe_yw.7.d: "#F In the second month of the twelfth Zhizheng year (1352) the court ordered Yaghan Shah, Prince of Xining, a prince of the house of Chübei seated at Shazhou, to hold Sichuan. In the twelfth month of the next year the prince, with the armies of the Jiangzhe and Sichuan branch secretariats, attacked Xu Shouhui at Qishui and won; in the same month the prince returned to Shazhou, and the court gave a thousand ingots in paper notes (History of Yuan, 42 and 43).#!\n\nNow the Red Turbans have risen everywhere, and the court debates calling the troops of the house of Chübei from Hexi into Sichuan.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.7.a: "Call the Shazhou troops to Sichuan"
 oe_yw.7.a.tt: "The Prince of Bin receives the same sum.\nIf the Prince of Bin is AI: #G 10%#! of the prince's manpower goes to the Yuan.\nLoyalty target of the Prince of Bin #G +5#! for #Y 36#! months."
 oe_yw.7.b: "Let the house keep the western frontier"
 oe_yw.7.b.tt: "The Shazhou troops stay in Hexi. Nothing else changes."
 oe_yw.8.t: "The Appanage Lost"
 oe_yw.8.d1: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Qi's appanage, Banyang circuit, is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Qi's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d2: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Jinan's appanage, Jinan circuit, is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Jinan's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
