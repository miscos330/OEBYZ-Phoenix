 oe_yw_touxia_subject_opinion: "Our Great Khan"
 oe_yw_touxia_overlord_opinion: "Our Prince"
 oe_yw_touxia_join_tt: "The prince's loyalty tier among the Yuan princes is Loyal"
 oe_yw_touxia_call_tt: "The prince's loyalty tier among the Yuan princes is not Estranged"
 oe_yw.1.t: "A Khongirad Empress"
 oe_yw.1.d: "#F In the third month of the third Zhiyuan year (April 1337) Emperor Toghon Temür made Bayan Khutugh of the Khongirad empress, with a jade seal and a jade patent. The Khongirad had long given the Yuan its empresses; the Prince of Lu held Yingchang and Quanning for generations and chose the officials of both circuits without appointments from the court.#!\n\nNow the investiture is at hand, and the envoys of the Prince of Lu have reached Dadu.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.1.a: "Invest the Khongirad lady by the old custom"
 oe_yw.1.a.tt: "Loyalty target of the Prince of Lu #G +10#! for #Y 60#! months."
 oe_yw.1.b: "Invest the empress and reward the consort clan richly"
 oe_yw.1.b.tt: "The Prince of Lu receives the same sum.\nLoyalty target of the Prince of Lu #G +15#! for #Y 60#! months."
 oe_yw.1.c: "Keep the ceremony plain"
 oe_yw.1.c.tt: "Loyalty target of the Prince of Lu #R −10#! for #Y 24#! months."
 oe_yw.2.t: "The Death of the Prince of Tan"
 oe_yw.2.d: "#F In the fifth Zhiyuan year (1339) Bayan framed Chechetu, the Prince of Tan, and asked that the prince be put to death; the emperor refused, and Bayan had the sentence carried out in the emperor's name. Bayan also had two more princes, of Xuanrang and of Weishun, demoted before any edict came.#!\n\nNow the princes have heard, and every one of them fears for their own safety.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.2.a: "Bear it in silence"
 oe_yw.2.a.tt: "Loyalty target of every member prince #R −10#!, until the princes are reassured #Y 12#! months after Bayan loses power."
 oe_yw.2.b: "Send envoys to reassure the princes"
 oe_yw.2.b.tt: "The money goes to the member princes by the ranks of the #bold #color_yellow annual grant#!#! (none to the Prince of Shen).\nLoyalty target of every member prince #R −5#!, until the princes are reassured #Y 12#! months after Bayan loses power."
 oe_yw.2.c: "Rebuke Bayan by edict"
 oe_yw.2.c.tt: "The princes bear no grievance. Bayan stays or goes as before."
 oe_yw.3.t: "The Prince of Qi's Horses"
 oe_yw.3.d1: "#F In the eighth month of the twelfth Zhizheng year (1352) Shiliemen, the Prince of Qi, presented fifteen thousand horses to the capital (some say ten thousand).#!\n\nNow the herds of Shiliemen, the Prince of Qi, have reached the walls of Dadu.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.3.d: "#F In the eighth month of the twelfth Zhizheng year (1352) Shiliemen, the Prince of Qi, presented fifteen thousand horses to the capital (some say ten thousand).#!\n\nNow [GetCountry('QAS').GetGovernment.GetRuler.GetName] of the house of Qasar has sent herds of horses.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.3.a: "Accept the horses and reward the giver richly"
 oe_yw.3.a.tt: "The house of Qasar receives the same sum.\nLoyalty target of the house of Qasar #G +10#! for #Y 60#! months."
 oe_yw.3.b: "Accept the horses and record the service"
 oe_yw.3.b.tt: "Loyalty target of the house of Qasar #G +5#! for #Y 60#! months."
 oe_yw.3.c: "Decline the gift"
 oe_yw.3.c.tt: "Loyalty target of the house of Qasar #R −10#! for #Y 60#! months."
 oe_yw.4.t: "The Prince of Liang"
 oe_yw.4.d1: "#F According to the Dictionary of Chinese History, Bolod, younger brother of Aru, the Prince of Yunnan, succeeded as Prince of Yunnan in the Zhizheng years and was raised to Prince of Liang for merit in the fifteenth Zhizheng year (1355).#!\n\nNow the household of the Prince of Yunnan asks for a higher title.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.4.d: "#F According to the Dictionary of Chinese History, Bolod, younger brother of Aru, the Prince of Yunnan, succeeded as Prince of Yunnan in the Zhizheng years and was raised to Prince of Liang for merit in the fifteenth Zhizheng year (1355).#!\n\nNow the household of the Prince of Yunnan reports Bolod's merits and asks for a higher title.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.4.a: "Raise the prince to Prince of Liang"
 oe_yw.4.a.tt: "Loyalty target of the Prince of Yunnan #G +10#! for #Y 60#! months.\nYunnan is called Liang again. If Yunnan is AI, its prestige #Y +5#!."
 oe_yw.4.b: "Let the prince remain Prince of Yunnan"
 oe_yw.4.b.tt: "Loyalty target of the Prince of Yunnan #R −5#! for #Y 60#! months."
 oe_yw.5.t: "The Prince of Yangdi Demands the Seal"
 oe_yw.5.d1: "#F In the twentieth Zhizheng year (1360) Aluhui Temür, the Prince of Yangdi, camped with several hundred thousand men at Mu'erguchewu and threatened the capital region. The prince's envoy said: 'Our ancestors gave you the realm, and you have lost the greater part of it. Give me the seal of state, and I will rule it myself.' The court sent Tügen Temür of the Bureau of Military Affairs and others against the prince, without success.#!\n\nNow the envoy of the Prince of Yangdi stands before the throne.\nAs the Prince of Yangdi is AI, this has already raised the prince's liberty desire by #R +10#! and changed the loyalty target by #R −20#! (#Y 36#! months).\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.5.d: "#F In the twentieth Zhizheng year (1360) Aluhui Temür, the Prince of Yangdi, camped with several hundred thousand men at Mu'erguchewu and threatened the capital region. The prince's envoy said: 'Our ancestors gave you the realm, and you have lost the greater part of it. Give me the seal of state, and I will rule it myself.' The court sent Tügen Temür of the Bureau of Military Affairs and others against the prince, without success.#!\n\nNow the envoy of the Prince of Yangdi stands before the throne.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.5.a: "Send generals against the prince"
 oe_yw.5.a.tt: "If the Prince of Yangdi is AI: the rising may be put down in the second half of next year; the prince's liberty desire #G −20#!, and the loss in the loyalty target ends."
 oe_yw.5.b: "Buy peace with rich gifts"
 oe_yw.5.b.tt: "The Prince of Yangdi receives half of it.\nThe Prince of Yangdi's loyalty target item becomes #G +5#! for #Y 36#! months.\nIf the Prince of Yangdi is AI: the prince's liberty desire #G −10#!."
 oe_yw.5.c: "Ignore the demand"
 oe_yw.5.c.tt: "The loss in the Prince of Yangdi's loyalty target stays."
 oe_yw.6.t: "The Prince of Zhao Flees by Night"
 oe_yw.6.d1: "#F In the ninth month of the eighteenth Zhizheng year (1358) Mieli, a follower of the Prince of Zhao, rose and meant to kill the prince. Xiban Temür, an official of the prince's household, and Xiban Temür's wife, who had nursed the prince as a child, dressed their son Guanyinnu in the prince's robes and left the boy in the palace, and at midnight led the prince away in disguise. The rebels came and killed Guanyinnu; the prince escaped.#!\n\nNow the Prince of Zhao's urgent report has reached Dadu.\nAs the Prince of Zhao is AI, the rising has already cost the prince #Y −7#! stability.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.6.d: "#F In the ninth month of the eighteenth Zhizheng year (1358) Mieli, a follower of the Prince of Zhao, rose and meant to kill the prince. Xiban Temür, an official of the prince's household, and Xiban Temür's wife, who had nursed the prince as a child, dressed their son Guanyinnu in the prince's robes and left the boy in the palace, and at midnight led the prince away in disguise. The rebels came and killed Guanyinnu; the prince escaped.#!\n\nNow the Prince of Zhao's urgent report has reached Dadu.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.6.a: "Send troops to pacify the Ongud"
 oe_yw.6.a.tt: "If the Prince of Zhao is AI: the prince's stability #Y +7#! (making up for the rising).\nLoyalty target of the Prince of Zhao #G +10#! for #Y 60#! months."
 oe_yw.6.b: "Let the prince settle the tribe alone"
 oe_yw.6.b.tt: "Loyalty target of the Prince of Zhao #R −5#! for #Y 60#! months."
 oe_yw.7.t: "The Shazhou Troops Go to Sichuan"
 oe_yw.7.d: "#F The house of Chübei held the western end of the Hexi corridor for generations: the Prince of Bin at Suzhou, the Prince of Xining at Shazhou and the Prince of Weiwu Xining at Hami, while the Idiqut, Prince of Gaochang, also seated in Hexi, later submitted to Ming after the fall of the Yuan. In the second month of the twelfth Zhizheng year (1352) the court ordered Yaghan Shah, Prince of Xining, to hold Sichuan. In the twelfth month of the next year the prince, with the armies of the Jiangzhe and Sichuan branch secretariats, attacked Xu Shouhui at Qishui and won; in the same month the prince returned to Shazhou, and the court gave a thousand ingots in paper notes (History of Yuan, 42 and 43).#!\n\nNow the Red Turbans have risen everywhere, and the court debates calling the troops of the house of Chübei from Hexi into Sichuan.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.7.a: "Call the Shazhou troops to Sichuan"
 oe_yw.7.a.tt: "The Prince of Bin receives the same sum.\nIf the Prince of Bin is AI: #G 10%#! of the prince's manpower goes to the Yuan.\nLoyalty target of the Prince of Bin #G +5#! for #Y 36#! months."
 oe_yw.7.b: "Let the house keep the western frontier"
 oe_yw.7.b.tt: "The Shazhou troops stay in Hexi. Nothing else changes."
 oe_yw.8.t: "The Appanage Lost"
 oe_yw.8.d1: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Qi's appanage, Banyang circuit, is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Qi's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d2: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Jinan's appanage, Jinan circuit, is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Jinan's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d3: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Liao's appanage, Yidu circuit, is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Liao's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d4: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Guangning's appanage, Enzhou, is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Guangning's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d5: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Yangdi's appanage, Junzhou (seat Yangdi), is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Yangdi's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d6: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Yunnan's appanage, Fu'an county of Fuzhou circuit, is no longer in the hands of the court or its princes, and this year's household notes cannot be collected. The Prince of Yunnan's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d7: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Lu's appanage, Jining circuit (the Princess of Lu's share), is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Lu's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d8: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Zhao's appanage, Gaotang (the Princess of Zhao's share), is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Zhao's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow a prince's appanage is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.a: "Make it good from the privy purse"
 oe_yw.8.a.tt: "While the appanage stays lost, the prince's grant is paid in full; the court pays #R 50%#! more for it each year, buying the silk elsewhere. Loyalty is not touched."
 oe_yw.8.b: "Halve the grant"
 oe_yw.8.b.tt: "While the appanage stays lost, the prince receives half the grant and the court pays half; the prince's loyalty target #R −5#!."
 oe_yw.8.c: "Stop the grant"
 oe_yw.8.c.tt: "While the appanage stays lost, the prince receives no grant and no lapse is recorded; the prince's loyalty target #R −10#! (#R −15#! for a far prince such as Yangdi or Yunnan)."
 oe_yw.9.t: "Keeping the Northern Yuan Calendar"
 oe_yw.9.d1: "#F After Dadu fell in 1368 and Emperor Toghon Temür withdrew to the steppe, Basalawarmi, the Prince of Liang seated at Kunming, continued to keep the Northern Yuan's Xuanguang calendar and sent envoys northward through Hexi. Once the Hexi corridor was cut off, Yunnan stood isolated in the southwest until Ming armies entered Yunnan in 1381.#!\n\nNow that Dadu has fallen, Yunnan still keeps the old court's calendar. The Prince of Liang gains [ShowModifier('oe_yw_liang_loyal')]; if both Lanzhou and Suzhou in Gansu fall and the Hexi corridor is severed, [ShowModifier('oe_yw_liang_cut_off')] also applies until the road reopens or 1390 passes."
 oe_yw.9.d: "#F After Dadu fell in 1368 and Emperor Toghon Temür withdrew to the steppe, Basalawarmi, the Prince of Liang seated at Kunming, continued to keep the Northern Yuan's Xuanguang calendar and sent envoys northward through Hexi. Once the Hexi corridor was cut off, Yunnan stood isolated in the southwest until Ming armies entered Yunnan in 1381.#!\n\nThough the central plains are lost, the Prince of Liang far in the southwest still holds Kunming under the old calendar. Liang gains [ShowModifier('oe_yw_liang_loyal')]; if the Hexi corridor is severed, [ShowModifier('oe_yw_liang_cut_off')] applies as well until the road reopens or 1390 passes."
 oe_yw.9.a: "Keep the old calendar"
 oe_yw.10.t: "Petition by Tang and Song Precedent"
 oe_yw.10.d: "#F After Ming forces took Kunming and the Prince of Liang fell in 1381, the Duan governors of Dali, Duan Ming and Duan Shi, wrote to the Ming commanders Fu Youde and Lan Yu, asking to follow Tang and Song precedent by serving as an outer vassal paying tribute rather than coming under direct rule. The Ming court refused and marched into Dali.#!\n\nNow the Yuan is gone and a new sovereign of the central plains turns toward the southwest. The Duan house of Dali must decide whether to cite Tang and Song precedent and petition to remain an outer vassal, or stand behind the passes of Lake Erhai."
 oe_yw.10.a: "Cite Tang and Song precedent and seek outer vassalage"
 oe_yw.10.a.tt: "If a non-Mongol Celestial Empire leader exists, mutual opinion #G +25#! for #Y 60#! months. No forced subject change or land transfer."
 oe_yw.10.b: "Hold Lake Erhai and refuse submission"
 oe_yw.10.b.tt: "If a non-Mongol Celestial Empire leader exists, mutual opinion #R −30#! for #Y 60#! months."
 oe_yw.11.t: "The Prince of Bin Retires Westward"
 oe_yw.11.d1: "#F The house of Chübei guarded the western end of the Hexi corridor for generations: the Prince of Bin at Suzhou, the Prince of Xining at Shazhou, the Prince of Su at Guazhou and the Prince of Weiwu Xining at Hami, while the Idiqut, Prince of Gaochang, turned eastward and submitted to Ming after the Yuan fell. Once Dadu and Gansu were lost, the Chübei princes fell back to Chijin, Guasha and Hami until Ming forces struck Chijin in 1380 and stormed Hami in 1391.#!\n\nWith the central plains and Gansu lost, the house of Chübei pulls back to Guazhou, Shazhou and Hami. The house gains [ShowModifier('oe_yw_bin_westward')] for 10 years, relying on its frontier cavalry and oasis routes to endure."
 oe_yw.11.d: "#F The house of Chübei guarded the western end of the Hexi corridor for generations: the Prince of Bin at Suzhou, the Prince of Xining at Shazhou, the Prince of Su at Guazhou and the Prince of Weiwu Xining at Hami, while the Idiqut, Prince of Gaochang, turned eastward and submitted to Ming after the Yuan fell. Once Dadu and Gansu were lost, the Chübei princes fell back to Chijin, Guasha and Hami until Ming forces struck Chijin in 1380 and stormed Hami in 1391.#!\n\nWith the central plains and Gansu lost, the house of Chübei falls back westward to Guasha and Hami, while the Idiqut of Gaochang seeks its own settlement with the new court. The Prince of Bin gains [ShowModifier('oe_yw_bin_westward')] for 10 years."
 oe_yw.11.a: "Fall back to Guasha and Hami"
 oe_yw.20.t: "Grand Shangdu Kurultai"
 oe_yw.20.d: "#F By Mongol custom the Great Khan held summer court at Shangdu, where the princes of the blood, imperial sons-in-law and Kheshig magnates gathered at the Pavilion of Great Peace to receive annual grants, audit the Five-Household Silk rolls and debate imperial policy. Every ten years, and upon a new sovereign's first assembly, this grand Kurultai set the balance between steppe appanages and the central treasury.#!\n\nNow the drums sound at the Pavilion of Great Peace as envoys of the princes and ministers of the Central Secretariat gather before the throne. Three grand courses lie open for the coming decade: uphold ancestral grants, commute stipends into paper-silver to guard central revenue, or press Han administrative centralization.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.20.a: "Uphold ancestral custom and enrich the princes"
 oe_yw.20.a.tt: "All active princes gain #G +12#! loyalty and #G −10#! liberty desire."
 oe_yw.20.b: "Audit Five-Household Silk and commute grants to paper-silver"
 oe_yw.20.b.tt: "All active princes gain #G +4#! loyalty while audited silver-note commutation bolsters the treasury."
 oe_yw.20.c: "Advance Han law centralization and curb princely prerogatives"
 oe_yw.20.c.tt: "All active princes lose #R −8#! loyalty in exchange for stronger central cabinet efficiency and control."
 oe_yw.21.t: "Estranged Princes Demand Emergency Grants"
 oe_yw.21.d: "#F Whenever rebellions dragged on in the Central Plain and imperial momentum faltered, annual grants and Five-Household Silk revenues fell short. Commanded by powerful steppe lords, estranged princes of the eastern and western wings sent envoys to Dadu demanding arrears and fresh subsidies.#!\n\nImperial momentum is dangerously low, and estranged princes have sent joint envoys to Dadu warning that without immediate grants and war funds they will withhold all troops.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], from #Y 40#! to 69 [ShowModifier('oe_yw_tier_aloof')], below #Y 40#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.21.a: "Pay emergency grants from the privy purse to steady the princes"
 oe_yw.21.a.tt: "Estranged princes gain #G +15#! loyalty and #G −10#! liberty desire; other active princes gain #G +8#! loyalty."
 oe_yw.21.b: "Invoke imperial lineage and rally loyal houses"
 oe_yw.21.b.tt: "Non-estranged princes gain #G +5#! loyalty; estranged princes lose #R −5#! loyalty and gain #R +5#! liberty desire."
 oe_yw.21.c: "Rebuke the demands and tighten oversight over appanage officials"
 oe_yw.21.c.tt: "Estranged princes lose #R −10#! loyalty and gain #R +15#! liberty desire, while central command holds firm."
