 STATIC_MODIFIER_NAME_oe_yw_tier_loyal: "A Loyal Prince"
 STATIC_MODIFIER_DESC_oe_yw_tier_loyal: "This prince receives the #bold #color_yellow annual grant#!#! on time, attends the #bold #color_yellow Shangdu assembly#!#! and stands ready to muster elite cavalry and manpower for the Yuan."
 STATIC_MODIFIER_NAME_oe_yw_tier_aloof: "An Aloof Prince"
 STATIC_MODIFIER_DESC_oe_yw_tier_aloof: "This prince keeps a cool distance from the Yuan court: the #bold #color_yellow annual grant#!#! and assembly remain lukewarm, and levies answer slowly."
 STATIC_MODIFIER_NAME_oe_yw_tier_estranged: "An Estranged Prince"
 STATIC_MODIFIER_DESC_oe_yw_tier_estranged: "This prince has turned away from the Yuan court, refusing summons and disrupting northern trade routes."
 STATIC_MODIFIER_NAME_oe_yw_overlord_loyal_host: "Loyal Princely Cavalry Host"
 STATIC_MODIFIER_DESC_oe_yw_overlord_loyal_host: "Loyal appanage princes reinforce the Yuan with elite steppe cavalry and manpower (stacks once per active loyal prince at 70 or higher loyalty, up to 10 stacks)."
 STATIC_MODIFIER_NAME_oe_yw_kurultai_tradition_mod: "Shangdu Kurultai: Ancestral Grants"
 STATIC_MODIFIER_DESC_oe_yw_kurultai_tradition_mod: "At the Shangdu Kurultai the Great Khan upheld ancestral custom and enriched the princes, rallying princely cavalry to the throne."
 STATIC_MODIFIER_NAME_oe_yw_kurultai_commute_mod: "Shangdu Kurultai: Commuted Paper-Silver"
 STATIC_MODIFIER_DESC_oe_yw_kurultai_commute_mod: "At the Shangdu Kurultai the court audited Five-Household Silk accounts and commuted stipends into balanced silver and notes, safeguarding central revenue."
 STATIC_MODIFIER_NAME_oe_yw_kurultai_hanlaw_mod: "Shangdu Kurultai: Han Law Centralization"
 STATIC_MODIFIER_DESC_oe_yw_kurultai_hanlaw_mod: "Using the Shangdu Kurultai to curb princely prerogatives under Han administrative law, the court strengthens central governance and control."
 STATIC_MODIFIER_NAME_oe_yw_crisis_strict_mod: "Stern Edict Over the Princes"
 STATIC_MODIFIER_DESC_oe_yw_crisis_strict_mod: "Confronting princely demands during the crisis, the court tightened oversight over appanage officials to uphold central dignity."
 STATIC_MODIFIER_NAME_oe_yw_commuted_vassal_mod: "Commuted Provincial Vassal"
 STATIC_MODIFIER_DESC_oe_yw_commuted_vassal_mod: "This former appanage prince has been peacefully converted into an ordinary vassal, ending central grant drains while harmonizing local taxation."
 STATIC_MODIFIER_NAME_oe_yw_qas_horses: "The Prince of Qi's Horses"
 STATIC_MODIFIER_DESC_oe_yw_qas_horses: "The herds sent by the house of Qasar fill the Yuan's cavalry."
 STATIC_MODIFIER_NAME_oe_yw_tusi_unrest: "Tusi Unrest"
 STATIC_MODIFIER_DESC_oe_yw_tusi_unrest: "The southwestern tusi shift between submission and defiance, straining ties with the Prince of Liang."
 STATIC_MODIFIER_NAME_oe_yw_liang_loyal: "Loyal to the Northern Yuan"
 STATIC_MODIFIER_DESC_oe_yw_liang_loyal: "Though Dadu has fallen, the Prince of Liang still holds Yunnan and keeps the Northern Yuan's Xuanguang calendar."
 STATIC_MODIFIER_NAME_oe_yw_liang_cut_off: "Cut Off from the North"
 STATIC_MODIFIER_DESC_oe_yw_liang_cut_off: "With the Hexi corridor lost, Yunnan stands isolated in the southwest, cut off from northern envoys and overland trade."
 STATIC_MODIFIER_NAME_oe_yw_duan_petition: "Petitioning by Tang and Song Precedent"
 STATIC_MODIFIER_DESC_oe_yw_duan_petition: "The Duan house of Dali cites Tang and Song precedent, petitioning the new court to remain an outer vassal."
 STATIC_MODIFIER_NAME_oe_yw_duan_defiant: "Holding Erhai"
 STATIC_MODIFIER_DESC_oe_yw_duan_defiant: "The Duan house of Dali refuses submission and rallies behind the mountain passes and shores of Lake Erhai."
 STATIC_MODIFIER_NAME_oe_yw_bin_westward: "Westward to Hami and Guasha"
 STATIC_MODIFIER_DESC_oe_yw_bin_westward: "With the central plains lost, the house of Chübei falls back to Guazhou, Shazhou and Hami, holding the western end of the Hexi corridor."
 oe_yw_bw_shen_fail: "The Shen Faction's Failed Coup"
 oe_yw_bw_duan_aid: "Dali Came to Liang's Aid"
 oe_yw_bw_duan_slain: "Duan Gong's Murder (One Account)"
 oe_yw_bw_duan_peace: "Liang and Dali Reconciled"
 oe_yw_bw_glh_grant: "Appanage Revenue Paid"
 oe_yw_b_duan_petition: "Petitioned by Tang and Song Precedent"
 oe_yw_b_duan_defiant: "Dali Refused Submission"
 oe_yw_bw_bestow_seal: "Imperial Gold Seal Bestowed"
 oe_yw_touxia: "Appanage Prince"
 oe_yw_touxia_desc: "The princes of the Yuan hold appanages by inheritance; the court collects their revenue and pays their annual grant. An appanage prince cannot be annexed by the overlord, and the overlord cannot end the tie. It declares no wars of its own, its diplomacy is limited by the overlord, and it follows the overlord into defensive wars. A loyal prince joins the overlord's offensive wars unasked; the others must be called, and an estranged prince will not answer. It keeps its own colour on the map."
 LEAD_oe_yw_touxia: "$LIST$ is a [SUBJECT_TYPE.GetName]"
