 oe_yw.8.d: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow a prince's appanage is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.a: "Make it good from the privy purse"
 oe_yw.8.a.tt: "While the appanage stays lost, the prince's grant is paid in full; the court pays #R 50%#! more for it each year, buying the silk elsewhere. Loyalty is not touched."
 oe_yw.8.b: "Halve the grant"
 oe_yw.8.b.tt: "While the appanage stays lost, the prince receives half the grant and the court pays half; the prince's loyalty target #R −5#!."
 oe_yw.8.c: "Stop the grant"
 oe_yw.8.c.tt: "While the appanage stays lost, the prince receives no grant and no lapse is recorded; the prince's loyalty target #R −10#! (#R −15#! for a far prince such as Yangdi or Yunnan)."
