 oe_yw.8.d5: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Yangdi's appanage, Junzhou (seat Yangdi), is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Yangdi's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d6: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Yunnan's appanage, Fu'an county of Fuzhou circuit, is no longer in the hands of the court or its princes, and this year's household notes cannot be collected. The Prince of Yunnan's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
 oe_yw.8.d7: "#F Under Yuan law the princes, empresses and princesses each held appanage households: the households paid their taxes to the court as usual, and every five households gave one catty of silk to their lord. The court collected this silk, and the household notes of Jiangnan, and paid them out with the annual grant (History of Yuan, 95). From Khubilai's time on, a prince could place only a darughachi in the appanage; the court appointed every other official.#!\n\nNow the Prince of Lu's appanage, Jining circuit (the Princess of Lu's share), is no longer in the hands of the court or its princes, and this year's five-household silk cannot be collected. The Prince of Lu's envoy asks whether the #bold #color_yellow annual grant#!#! will still be paid in full.\nOnce the appanage is recovered, the grant is paid as before and this decision lapses; each prince asks only once.\nNote: each prince's loyalty moves #Y 1#! point a month toward its target; at #Y 70#! or more the prince is [ShowModifier('oe_yw_tier_loyal')], below #Y 40#! [ShowModifier('oe_yw_tier_aloof')], below #Y 20#! [ShowModifier('oe_yw_tier_estranged')]."
