 STATIC_MODIFIER_DESC_oe_pi2_mod_dec_monsoon_guild:0 "Protected merchant syndicates and deep-water Indian shipyards harness both seasonal monsoons for unrivaled oceanic commerce."
 oe_pi2.1.title:0 "Jalayirid Courts of Baghdad & Tabriz"
 oe_pi2.1.desc:0 "Amid the fracturing of the old Ilkhanate, the twin metropolises of Baghdad and Tabriz have emerged as radiant refuges for Persian calligraphers, astronomers, and master miniaturists. At court, viziers debate whether to lavish bullion on imperial scriptoria or fortify the Tigris-Azerbaijan tax highways."
 oe_pi2.1.a:0 "Patronize the Baghdad-Tabriz Miniature Ateliers"
 oe_pi2.1.b:0 "Rebuild the Tigris-Tabriz Imperial Diwan & Roads"
 oe_pi2.2.title:0 "Muzaffarid Shiraz & the Rose-Garden of Letters"
 oe_pi2.2.desc:0 "Beneath the cypress gardens of Shiraz and the desert wind-catchers of Yazd, Persian lyric poetry has reached sublime perfection in the verses of Hafez while merchants weave silk brocades coveted from Cairo to Delhi. Scholars and estate stewards seek royal charters to anchor this southern Iranian revival."
 oe_pi2.2.a:0 "Endow Shiraz Madrasas & Poetic Assemblies"
 oe_pi2.2.b:0 "Expand Yazd Silk Guilds & Fars Garrison Citadels"
 oe_pi2.3.title:0 "Turkmen Confederations: Black & White Sheep"
 oe_pi2.3.desc:0 "Across the high summer pastures of Armenia, Kurdistan, and western Azerbaijan, the pastoral banners of the Qara Qoyunlu and Aq Qoyunlu ride in growing strength. Integrating these formidable Turkmen horse-archers into our realm promises unstoppable steppe mobility, yet risks unsettling the settled Persian bureaucracy."
 oe_pi2.3.a:0 "Grant Pastures & Banner Honors to Turkmen Emirs"
 oe_pi2.3.b:0 "Uphold the Persian Diwan & Sedentary Tax Cadastre"
 oe_pi2.4.title:0 "Soltaniyeh & the Qanat Arteries of Iran"
 oe_pi2.4.desc:0 "Beneath the soaring turquoise dome of Soltaniyeh, engineers and master water-diviners present an ambitious blueprint: restore subterranean qanat irrigation galleries across the arid central plateau and link every major bazaar with vaulted stone caravanserais spaced a single day's march apart."
 oe_pi2.4.a:0 "Dig New Qanat Galleries & Granary Oases"
 oe_pi2.4.b:0 "Build Royal Caravanserais & Silver Mint Relays"
 oe_pi2.5.title:0 "Rise of the Ardabil Sufi Order"
 oe_pi2.5.desc:0 "From the sacred shrine complex of Ardabil near the Caspian forests, fervent spiritual preachers have forged a disciplined brotherhood of devoted warriors wearing twelve-gored crimson caps. Thousands of horsemen from Azerbaijan, Anatolia, and Khorasan now look to Ardabil as the spark of a new Iranian dynasty."
 oe_pi2.5.a:0 "Rally the Crimson-Turbaned Qizilbash Vanguard"
 oe_pi2.5.b:0 "Channel Sufi Shrine Endowments into State Unity"
 oe_pi2.6.title:0 "Coronation of the Crimson Banners in Tabriz"
 oe_pi2.6.desc:0 "Beneath fluttering crimson standards, heralds proclaim a sovereign Shahanshah over Azerbaijan and the Iranian plateau, uniting ancient Persian kingship with zealous new court institutions. The Qurchi royal bodyguard and the Sadr religious ministry await their imperial commission."
 oe_pi2.6.a:0 "Commission the Royal Qurchi Guard & Imperial Sword"
 oe_pi2.6.b:0 "Elevate the Grand Vizier & Imperial Chancery"
 oe_pi2.7.title:0 "Gunpowder Shock of Chaldiran"
 oe_pi2.7.desc:0 "Dispatches from the western frontier chill the entire divan: disciplined ranks of enemy musketeers shielded behind chained artillery wagons have demonstrated that fearless lance charges alone can no longer break a modern gunpowder line. Our military doctrine stands at a decisive crossroads."
 oe_pi2.7.a:0 "Forge Tofangchi Musketeer & Tupchi Artillery Corps"
 oe_pi2.7.b:0 "Adopt Scorched-Earth Defense & Highland Raids"
 oe_pi2.8.title:0 "Qazvin Court & the Imperial Shahnameh"
 oe_pi2.8.desc:0 "To shield the throne from sudden western incursions, the court has moved inward to Qazvin, where royal pavilions rise amid lush gardens and master painters illuminate monumental editions of the Shahnameh. Meanwhile frontier governors press for permanent stone citadels along Azerbaijan and Khorasan."
 oe_pi2.8.a:0 "Commission the Royal Shahnameh & Court Academy"
 oe_pi2.8.b:0 "Fortify the Qazvin-Tabriz-Herat Frontier Belt"
 oe_pi2.9.title:0 "Shah Abbas I & the Ghulam Royal Corps"
 oe_pi2.9.desc:0 "Determined to break factional tribal tutelage forever, the sovereign unveils a sweeping military reorganization: alongside modernized Tofangchi musketeers and bronze artillery, a loyal standing corps of Georgian, Armenian, and Circassian Ghulam horsemen paid straight from crown lands will answer to the throne alone."
 oe_pi2.9.a:0 "Forge the Standing Ghulam & Tofangchi Crown Army"
 oe_pi2.9.b:0 "Convert Tribal Provinces into Crown Khassah Estates"
 oe_pi2.10.title:0 "Isfahan: Nisf-e Jahan (Half the World)"
 oe_pi2.10.desc:0 "Across the riverbanks of the Zayandeh Rud rises a metropolis of breathtaking urban geometry: the colossal Naqsh-e Jahan Square framed by cobalt-tiled domes of the Royal Mosque, the elevated Ali Qapu palace veranda, the grand Qeysarieh Bazaar, and tree-lined Chahar Bagh avenues. Envoys whisper in wonder: Isfahan is half the world."
 oe_pi2.10.a:0 "Complete the Royal Mosque & Imperial Piazza"
 oe_pi2.10.b:0 "Expand the Grand Qeysarieh Bazaar & Guild Mint"
 oe_pi2.11.title:0 "Royal Karkhaneh: Carpets & State Silk Factories"
 oe_pi2.11.desc:0 "Inside thirty-two royal karkhaneh manufactories in Isfahan, Kashan, and Kerman, master weavers knot silk-and-gold-thread carpets of luminous intricacy while skilled Armenian merchants of New Julfa manage overseas bullion shipments from Caspian mulberry groves straight to Venice, Amsterdam, and Surat."
 oe_pi2.11.a:0 "Scale Royal Carpet & Brocade Karkhaneh Guilds"
 oe_pi2.11.b:0 "Grant New Julfa Merchants Eurasian Silk Charters"
 oe_pi2.12.title:0 "Liberation of Hormuz & the Gulf Entrepot"
 oe_pi2.12.desc:0 "For over a century foreign cannon forts perched on the salt-crusted island of Hormuz taxed every bale of Persian silk and Arabian stallion crossing the Strait. Now our coastal armies and allied warships stand poised to reclaim the island and establish a great mainland port under royal customs."
 oe_pi2.12.a:0 "Storm Hormuz & Build the Royal Gulf Arsenal"
 oe_pi2.12.b:0 "Open a Free Mainland Entrepot for All Nations"
 oe_pi2.13.title:0 "The School of Isfahan & Eurasian Diplomacy"
 oe_pi2.13.desc:0 "Within Isfahan's serene tiled seminaries, luminous thinkers such as Mir Damad and Mulla Sadra weave classical Hellenic philosophy with Islamic metaphysics into a bold intellectual synthesis. Meanwhile foreign embassies from Europe, Muscovy, and Hindustan compete for Persian alliances and scientific exchange."
 oe_pi2.13.a:0 "Patronize the School of Isfahan & Translation Halls"
 oe_pi2.13.b:0 "Dispatch Grand Persian Embassies Across Eurasia"
 oe_pi2.14.title:0 "Nader Shah's Military Revival & Zamburak Corps"
 oe_pi2.14.desc:0 "Rising from years of frontier turmoil, a brilliant Persian warlord has forged the deadliest field army in Asia: elite Jazayerchi heavy-musket infantry firing rifled volleys, lightning Khorasan cavalry, and mobile Zamburak camel-mounted swivel artillery able to outmaneuver fixed siege lines across desert and pass alike."
 oe_pi2.14.a:0 "Deploy Zamburak Camel Artillery & Jazayerchi Regiments"
 oe_pi2.14.b:0 "Launch Twin Caspian & Persian Gulf War Fleets"
 oe_pi2.15.title:0 "George V the Brilliant & Highland Recovery"
 oe_pi2.15.desc:0 "After generations of steppe tribute and princely fragmentation, firm royal diplomacy has reunited the Caucasian lowlands with fiercely independent mountain clans. Crown jurists now present the Dzeglis Deba mountain code alongside plans to strike pure silver coinage bearing our sovereign title."
 oe_pi2.15.a:0 "Promulgate the Dzeglis Deba Highland Code"
 oe_pi2.15.b:0 "Strike Silver Giorgauli Coinage & Reopen Pass Tolls"
 oe_pi2.16.title:0 "Bagrationi Highland Castles & Khevsur Towers"
 oe_pi2.16.desc:0 "High above glacier-fed valleys in Svaneti, Khevsureti, and Syunik, stone defensive towers stand shoulder to shoulder with cliffside churches. Highland clans offer to muster permanent mail-armored Khevsur infantry regiments in return for tax-free alpine grazing charters."
 oe_pi2.16.a:0 "Muster the Khevsur Highland Guard & Beacon Towers"
 oe_pi2.16.b:0 "Develop Alpine Terraces, Iron Forges & Vineyards"
 oe_pi2.17.title:0 "Storm of Timur in the Caucasus"
 oe_pi2.17.desc:0 "Smoke rises above the southern plains as Timurid columns thunder toward the Caucasus passes, demanding unconditional submission and shattering walled towns that dare resist. Our mountain lords gather at dusk to weigh total highland guerrilla resistance against shrewd tactical diplomacy."
 oe_pi2.17.a:0 "Defy the Conqueror from Every Gorge & Citadel"
 oe_pi2.17.b:0 "Shield the Cities Through Envoys & Tribute Delays"
 oe_pi2.18.title:0 "Shirvan Silk Ports of the Caspian"
 oe_pi2.18.desc:0 "Along the western shore of the Caspian Sea, Shirvan's silk markets at Shamakhi, the glowing naphtha wells of Baku, and the ancient iron wall of Derbent control the vital bottleneck linking Astrakhan and Rus with Tabriz and the Indian Ocean. Merchant guilds seek royal harbor investments."
 oe_pi2.18.a:0 "Expand Shamakhi Silk Bazaars & Baku Naphtha Docks"
 oe_pi2.18.b:0 "Fortify the Iron Gate of Derbent & Coastal Patrols"
 oe_pi2.19.title:0 "Armenian Highland Melikdoms & Cilician Diaspora"
 oe_pi2.19.desc:0 "As Mediterranean trade routes shift, veteran artisans, shipwrights, and chroniclers from Cilician Armenia reunite with the fiercely autonomous Armenian meliks of Syunik, Khachen, and the Ararat plateau. Together they offer to forge a cultural and military renaissance across the southern Caucasus."
 oe_pi2.19.a:0 "Charter Autonomous Melik Citadels & Mountain Militia"
 oe_pi2.19.b:0 "Welcome Cilician Artisans, Goldsmiths & Scribes"
 oe_pi2.20.title:0 "Sadrosho Military Banners & Highland Vigil"
 oe_pi2.20.desc:0 "Surrounded by rising gunpowder empires on every compass point, our royal council reorganizes the kingdom into four territorial Sadrosho banner commands—vanguard, right wing, left wing, and royal guard—so that every valley can mobilize armed levies and matchlock companies within days."
 oe_pi2.20.a:0 "Institute the Four Territorial Sadrosho Commands"
 oe_pi2.20.b:0 "Entrust Frontier Banners to Warrior-Bishop Sees"
 oe_pi2.21.title:0 "Between Empires: Defying Ottoman-Persian Partition"
 oe_pi2.21.desc:0 "Envoys bring grave intelligence: our two colossal neighbors to west and east have drafted spheres of partition splitting the Caucasus down the Surami ridge. To remain sovereign masters of our own destiny, we must either forge an unbreakable mountain defensive pact or play one superpower adroitly against the other."
 oe_pi2.21.a:0 "Proclaim the Pan-Caucasus Armed Neutrality Pact"
 oe_pi2.21.b:0 "Master Balance-of-Power Embassies Across Eurasia"
 oe_pi2.22.title:0 "Merchants of New Julfa & Global Silk Credit"
 oe_pi2.22.desc:0 "Operating through family commenda contracts from Julfa and Tbilisi to Isfahan, Venice, Amsterdam, Astrakhan, and Madras, Armenian and Caucasian merchant houses have built one of the world's most sophisticated long-distance commercial networks. Their treasurers offer to anchor a homeland banking house."
 oe_pi2.22.a:0 "Charter the Homeland Julfa Credit & Silk Exchange"
 oe_pi2.22.b:0 "Channel Diaspora Wealth into Printing & Schools"
 oe_pi2.23.title:0 "Caucasus Orthodox & Apostolic Golden Age"
 oe_pi2.23.desc:0 "From the frescoed academies of Gelati and Mtskheta to the ancient scriptoria of Gladzor and Etchmiadzin, a magnificent cultural revival sweeps the highlands. Royal jurists compile the sweeping Dasturlamali administrative code while chroniclers, painters, and polyphonic choirs honor an unbroken heritage."
 oe_pi2.23.a:0 "Codify the Dasturlamali Royal Administration"
 oe_pi2.23.b:0 "Celebrate the Gelati-Etchmiadzin Cultural Synthesis"
 oe_pi2.24.title:0 "Fortress of the Two Seas: Black & Caspian Crossroads"
 oe_pi2.24.desc:0 "Modern paved mountain carriageways now climb across the passes connecting Black Sea ports at Batumi and Poti with Tbilisi, Yerevan, and Caspian docks at Baku. Armed with modern cast-iron hill batteries and thriving silk-and-wine exports, the Caucasus stands no longer as a buffer, but as a sovereign hinge of Eurasia."
 oe_pi2.24.a:0 "Mount Modern Cast-Iron Batteries Along Every Pass"
 oe_pi2.24.b:0 "Inaugurate the Black-to-Caspian Free Transit Corridor"
 oe_pi2.25.title:0 "Vijayanagara: Hampi Hydraulic Canals & Weirs"
 oe_pi2.25.desc:0 "Amid boulder-strewn granite hills beside the Tungabhadra River, royal hydraulic engineers carve sweeping stone anicuts, aqueducts, and stepped temple tanks to water verdant paddy fields and bustling colonnaded bazaars. Temple trustees and provincial governors propose doubling the canal grid."
 oe_pi2.25.a:0 "Construct Grand Anicuts & Royal Reservoir Tanks"
 oe_pi2.25.b:0 "Endow Temple Granaries & Colonnaded Craft Bazaars"
 oe_pi2.26.title:0 "Nayaka Military Tenures & Arabian Warhorses"
 oe_pi2.26.desc:0 "Across the rocky Deccan and Carnatic plains, armored cavalry and disciplined infantry win empires. Royal commanders advocate codifying the Amara-Nayaka military tenure system alongside exclusive port contracts with Ormus and Aden horse traders for thousands of swift Arabian and Persian chargers."
 oe_pi2.26.a:0 "Secure Exclusive Arabian & Persian Warhorse Imports"
 oe_pi2.26.b:0 "Codify Amara-Nayaka Fortress & Revenue Quotas"
 oe_pi2.27.title:0 "Sonargaon Muslin & Bengal's Padma River Fleets"
 oe_pi2.27.desc:0 "Along the emerald delta channels of the Padma and Meghna rivers, master Bengali weavers spin cotton muslin so airy that entire bolts slip through a signet ring. Alongside the looms, royal dockyards launch sleek oared war-boats—the Nawara fleet—to patrol the river labyrinth and Bay of Bengal."
 oe_pi2.27.a:0 "Expand Royal Muslin Looms & Delta Silk Exports"
 oe_pi2.27.b:0 "Commission the Nawara Delta War-Boat Fleet"
 oe_pi2.28.title:0 "Gujarat's Cambay & Surat Ocean Guilds"
 oe_pi2.28.desc:0 "No ship sails between Malacca, Kilwa, and Aden without touching the bustling ports of Gujarat. At Khambat and Surat, cosmopolitan mahajan banking councils clear bills of exchange across three seas while teak shipyards build stout three-masted ocean carriers."
 oe_pi2.28.a:0 "Empower the Mahajan Banking & Hundi Councils"
 oe_pi2.28.b:0 "Subsidize Teak Ocean Shipyards & Coastal Escorts"
 oe_pi2.29.title:0 "Deccan Citadel & Mahmud Gawan's Madrasa"
 oe_pi2.29.desc:0 "Beneath towering cobalt-and-gold glazed minarets in the Deccan plateau, a visionary statesman has erected a grand three-story college housing thousands of manuscripts in Persian, Arabic, and Sanskrit. Yet court unity demands reconciling proud local Deccani nobles with newly arrived Western administrators and scholars."
 oe_pi2.29.a:0 "Endow the Grand Madrasa & Deccan Scientific Library"
 oe_pi2.29.b:0 "Balance Deccani & Western Nobles via Provincial Reform"
 oe_pi2.30.title:0 "Golconda Diamonds & Deccan Wootz Crucible Steel"
 oe_pi2.30.desc:0 "Along the Krishna River valleys, miners uncover crystalline diamonds of legendary clarity destined for royal crowns from Isfahan to Paris. Simultaneously, village metallurgists in Telangana perfect crucible-forged Wootz steel cakes—the prized raw material behind every celebrated Damascus blade."
 oe_pi2.30.a:0 "Establish Crown Diamond & Wootz Export Monopolies"
 oe_pi2.30.b:0 "Forge Wootz Armor, Blades & Gun Barrels for Our Armies"
 oe_pi2.31.title:0 "Bijapur Heavy Bronze Artillery & Iron War-Rockets"
 oe_pi2.31.desc:0 "Inside roaring Deccan foundries, master founders pour molten bell-metal into colossal siege cannon like the famed Malik-i-Maidan, while pyrotechnic artisans hammer iron tubes packed with black powder into streaking battlefield rockets mounted on camels and armored war-elephants."
 oe_pi2.31.a:0 "Form the Deccan Rocket & War-Elephant Batteries"
 oe_pi2.31.b:0 "Mount Heavy Bronze Cannon on Stone Bastion Forts"
 oe_pi2.32.title:0 "Krishnadevaraya's Golden Court of Vijayanagara"
 oe_pi2.32.desc:0 "Foreign ambassadors marvel at the wide avenues of the City of Victory, where rubies and diamonds are weighed in open baskets and towering carved stone gopurams catch the morning sun. At court, eight celebrated Ashtadiggajas poets compose epics in Telugu, Kannada, and Sanskrit while armies march beneath gilded standards."
 oe_pi2.32.a:0 "Patronize the Ashtadiggajas Poets & Grand Gopurams"
 oe_pi2.32.b:0 "Enforce Sovereign Coastal Treaties & Army Readiness"
 oe_pi2.33.title:0 "Gunpowder Synthesis in Hindustan: Tulughma & Wagons"
 oe_pi2.33.desc:0 "On the dusty northern plains, a stunning tactical revolution unfolds: mobile Central Asian flanking cavalry (Tulughma) now fight in concert with roped ox-wagon breastworks, Ottoman-trained bronze field cannon, and disciplined matchlock infantry. Adopting this combined-arms doctrine promises mastery over the subcontinent."
 oe_pi2.33.a:0 "Drill Combined Wagon-Artillery & Flanking Cavalry"
 oe_pi2.33.b:0 "Standardize Imperial Mansabdar Officer Ranks"
 oe_pi2.34.title:0 "Grand Trunk Caravanserais & Silver Rupiya"
 oe_pi2.34.desc:0 "Stretching over fifteen hundred miles from Sonargaon in Bengal across Delhi to Lahore and the Kabul passes, a shaded royal highway rises with stone milestones, fresh wells, fortified sarais, and horse-relay postal riders. Simultaneously, imperial mints strike pure standardized silver Rupiya coins."
 oe_pi2.34.a:0 "Complete the Grand Trunk Road & Dak Postal Relays"
 oe_pi2.34.b:0 "Enforce Standardized Silver Rupiya Mints Nationwide"
 oe_pi2.35.title:0 "Raja Todar Mal's Zabti Revenue Cadastre"
 oe_pi2.35.desc:0 "Determined to end arbitrary tax-farming and famine extortion, finance minister Raja Todar Mal dispatches survey teams armed with bamboo measuring rods joined by iron rings. By averaging ten years of local harvests and grain prices into the Dahsala schedule, the treasury gains predictable silver while farmers earn relief in lean seasons."
 oe_pi2.35.a:0 "Enact the Dahsala Bamboo-Rod Land Cadastre"
 oe_pi2.35.b:0 "Share Survey Audits with Zamindar Village Councils"
 oe_pi2.36.title:0 "Ibadat Khana & Indo-Persian Cultural Synthesis"
 oe_pi2.36.desc:0 "Inside the carved sandstone colonnades of the House of Worship, Muslim jurists, Hindu pandits, Jain ascetics, Parsi fire-priests, and Sikh musicians debate philosophy under royal patronage. Translators render the Mahabharata and Ramayana into illuminated Persian volumes as marble domes blend lotus finials with Persian arches."
 oe_pi2.36.a:0 "Proclaim Sulh-i Kul (Peace With All) & Imperial Translations"
 oe_pi2.36.b:0 "Commission Pietra Dura Marble Palaces & Gardens"
 oe_pi2.37.title:0 "Indian Textile Boom: Calico, Chintz & Global Silver"
 oe_pi2.37.desc:0 "From Coromandel and Gujarat to Bengal, hundreds of thousands of village spinners, indigo dyers, and block-printers weave vivid colorfast chintz and fine calico coveted from Manila and Nagasaki to London and Lisbon. Ships arrive weighted down with Spanish and Japanese silver bars simply to pay for our cloth."
 oe_pi2.37.a:0 "Invest in Urban Loom Guilds & Indigo Dye Works"
 oe_pi2.37.b:0 "Levy Bullion Export Customs & Expand Coastal Mints"
 oe_pi2.38.title:0 "Maratha Hill-Forts & Swarajya of the Sahyadris"
 oe_pi2.38.desc:0 "High along the mist-veiled basalt crags of the Western Ghats, an interlocking chain of three hundred hill fortresses—Raigarh, Pratapgad, Sinhagad, Torna—forms the spine of Swarajya. From their hidden passes sweep lightning Bargir cavalry columns practicing Ganimi Kava, cutting off slow imperial supply trains before vanishing into the hills."
 oe_pi2.38.a:0 "Muster Bargir Light Horse & Sahyadri Hill-Fort Network"
 oe_pi2.38.b:0 "Establish the Ashta Pradhan Council of Eight Ministers"
 oe_pi2.39.title:0 "Konkan Navy & Sea Forts of Sindhudurg"
 oe_pi2.39.desc:0 "Recognizing that whoever rules the waves rules the trade of India, coastal admirals erect massive island sea-forts anchored in molten lead along the Konkan reefs while launching shallow-draft Gurab and Galbat gunboats able to outmaneuver heavy European East Indiamen along rocky estuaries."
 oe_pi2.39.a:0 "Launch the Konkan Gurab-Galbat Fleet & Sea-Forts"
 oe_pi2.39.b:0 "Enforce Sovereign Coastal Passes & Convoy Tariffs"
 oe_pi2.40.title:0 "Iron-Cased War Rockets & Elephant Artillery of the Deccan"
 oe_pi2.40.desc:0 "Master armorers across Mysore and the Deccan have perfected hammered soft-iron rocket cylinders strapped to bamboo shafts and sword-blades, soaring over a mile in howling salvos. Paired with armored war-elephants hauling heavy field guns, this terrifying pyrotechnic corps sends European linear infantry reeling."
 oe_pi2.40.a:0 "Commission Full Rocket-Elephant Artillery Brigades"
 oe_pi2.40.b:0 "Build State Gunpowder Mills & Bore-Cast Foundries"
 oe_pi2.41.title:0 "Pushback Against East India Trading Factories"
 oe_pi2.41.desc:0 "Alarming reports arrive from our richest seaports: English and French chartered companies are illegally erecting stone bastions around their trading factories, abusing duty-free dastak passes to undercut native merchants, and hiring sepoy battalions on our own soil. Swift sovereign action is imperative."
 oe_pi2.41.a:0 "Dismantle Unauthorized Bastions & Enforce Port Law"
 oe_pi2.41.b:0 "Charter Sovereign Indian Joint-Stock Ocean Companies"
 oe_pi2.42.title:0 "Subcontinental Awakening: Modern Arsenals & Hundi Banks"
 oe_pi2.42.desc:0 "Standing proud and unbowed in an age of global empires, Indian bankers, shipwrights, and military engineers unite ancestral strengths with industrial innovation: Jagat Seth and Maratha hundi syndicates underwrite sovereign bonds while drilled flintlock corps, iron-rocket brigades, and copper-sheathed warships guard the Indian Ocean."
 oe_pi2.42.a:0 "Modernize Standing Flintlock Divisions & War Foundries"
 oe_pi2.42.b:0 "Forge a Sovereign Hundi Central Bank & Steam Docks"
