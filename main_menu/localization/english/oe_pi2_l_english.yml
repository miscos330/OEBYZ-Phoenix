 oe_pi2_qizilbash_lancers:0 "Persian Qizilbash Heavy Lancers"
 oe_pi2_qizilbash_lancers_desc:0 "Devoted crimson-turbaned heavy cavalry of the Persian plateau, pairing composite bows and mail-and-plate horse barding with thunderous couched-lance charges across arid plains."
 oe_pi2_caucasus_khevsur_guard:0 "Caucasus Khevsur Highland Guard"
 oe_pi2_caucasus_khevsur_guard_desc:0 "Chainmail-clad Georgian and Armenian highland infantry armed with broadswords and iron bucklers, unyielding in rocky mountain defiles and fortified monastery passes."
 oe_pi2_deccan_rocket_elephants:0 "Deccan Rocket & War-Elephant Corps"
 oe_pi2_deccan_rocket_elephants_desc:0 "Armored South Asian war-elephants paired with iron-cased gunpowder rocket batteries, unleashing deafening fiery salvos that shatter fortifications and enemy battle lines alike."
 oe_pi2_maratha_bargir_raiders:0 "Maratha Bargir Fast Cavalry"
 oe_pi2_maratha_bargir_raiders_desc:0 "Crown-mounted Maratha light horsemen bred on hardy Deccan ponies, famed for lightning Ganimi Kava flank raids, supply ambushes, and tireless sweeps over Sahyadri hill passes."
 oe_pi2_dec_isfahan_silk_monopoly.title:0 "Establish the Silk Monopoly of Isfahan"
 oe_pi2_dec_isfahan_silk_monopoly.desc:0 "Centralize raw Caspian silk purchases from Gilan and Mazandaran under royal warehouses, dispatching chartered caravan factors across Anatolia, the Gulf, and the Levant to turn Persian silk into a sovereign treasury engine."
 oe_pi2_dec_isfahan_silk_monopoly.a:0 "Seal the Royal Silk Charter"
 oe_pi2_dec_caucasus_fortress_monastery.title:0 "Swear the Caucasus Fortress-Monastery Compact"
 oe_pi2_dec_caucasus_fortress_monastery.desc:0 "Unite highland stone watchtowers, cliffside monasteries, and noble mountain lineages under a shared defensive covenant, turning every Caucasus gorge into a provisioned bastion."
 oe_pi2_dec_caucasus_fortress_monastery.a:0 "Consecrate the Mountain Ramparts"
 oe_pi2_dec_monsoon_guild_charter.title:0 "Grant the Indian Ocean Monsoon Guild Charter"
 oe_pi2_dec_monsoon_guild_charter.desc:0 "Empower coastal shipwrights, hundi banking syndicates, and ocean-going merchant guilds from Gujarat and Konkan to Coromandel and Bengal with royal naval escorts and unified port weights."
 oe_pi2_dec_monsoon_guild_charter.a:0 "Charter the Monsoon Guild Fleet"
