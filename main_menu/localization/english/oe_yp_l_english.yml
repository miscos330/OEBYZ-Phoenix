 oe_yp_xingsheng: "Branch Secretariat"
 oe_yp_xingsheng_desc: "This country is a provincial Branch Secretariat of [GetCountry('CHI').GetName]. Its governor keeps an office at the provincial seat and handles revenue and civil affairs for the court; the land, households and armies of the province remain under the court. It cannot declare wars, joins none, and never joins independence wars."
 LEAD_oe_yp_xingsheng: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yp_xingsheng: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yp_frontier: "Frontier Branch Secretariat"
 oe_yp_frontier_desc: "This country is a frontier Branch Secretariat of [GetCountry('CHI').GetName] and governs the land and troops of its province directly. It shows on the map in its overlord's colour and name, cannot be annexed, cannot declare its own wars, follows its overlord into war, and never joins independence wars."
 LEAD_oe_yp_frontier: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yp_frontier: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yp_xingsheng_subject: "Branch Secretariat"
 oe_yp_xingsheng_subject_desc: "This country is a provincial Branch Secretariat of [GetCountry('CHI').GetName]. It holds only its seat office; the land of its province stays under the court."
 oe_yp_xingsheng_seat: "Branch Secretariat Office"
 oe_yp_xingsheng_seat_desc: "The seat of the provincial governor. Gives its owner a little gold and manpower and does not reduce local levies."
 oe_yp_xingsheng_seat_maintain: "Provincial Administration"
 oe_yp.1.t: "[TEST] Yuan branch secretariats"
 oe_yp.1.d: "#T Inputs of the loyalty target#!\nFactional strife intensity [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_intensity').GetValue|2] (1 when unset)  Bayan dictator modifier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dictator').GetValue|0]  Red Turban situation active [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr').GetValue|0]  -> target [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_target').GetValue|1]\nBranch secretariats of the Yuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_subjects').GetValue|0] (should be 6)  in the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_in_mk').GetValue|0]  subject relation added at start [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_subject').GetValue|0]  seat office built at start [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_seat').GetValue|0]\n#T Branch secretariats (exists: 1 Yuan's branch secretariat, -1 exists otherwise, 0 missing; loyalty -1 = no data)#!\nHenan Jiangbei: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHN').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHN').GetValue|1]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHN').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_2').GetValue|0] (start 240)\nJiangzhe: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJZ').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJZ').GetValue|1]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJZ').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_3').GetValue|0] (start 180)\nJiangxi: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJX').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJX').GetValue|1]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJX').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_4').GetValue|0] (start 135)\nHuguang: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHG').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHG').GetValue|1]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHG').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_5').GetValue|0] (start 198)\nShaanxi: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSX').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSX').GetValue|1]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSX').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_6').GetValue|0] (start 133)\nSichuan: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSC').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSC').GetValue|1]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSC').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_7').GetValue|0] (start 110)\nFuli (under the Central Secretariat, no branch secretariat): Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_1').GetValue|0] (start 409)"
