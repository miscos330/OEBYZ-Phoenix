 STATIC_MODIFIER_NAME_oe_yp_tier_loyal: "Compliant Province"
 STATIC_MODIFIER_DESC_oe_yp_tier_loyal: "The provincial governor works hand in hand with the court; revenue and recruits come in readily."
 STATIC_MODIFIER_NAME_oe_yp_tier_lax: "Slack Province"
 STATIC_MODIFIER_DESC_oe_yp_tier_lax: "The provincial governor carries out the court's orders half-heartedly; levies come late and revenue falls short."
 STATIC_MODIFIER_NAME_oe_yp_tier_estranged: "Estranged Province"
 STATIC_MODIFIER_DESC_oe_yp_tier_estranged: "The province has turned from the court; local strongmen go their own way and levies can hardly be raised."
 oe_yp_xingsheng: "Branch Secretariat"
 oe_yp_xingsheng_desc: "This country is a provincial Branch Secretariat of [GetCountry('CHI').GetName]. Its governor keeps an office at the provincial seat and handles revenue and civil affairs for the court; the land, households and armies of the province remain under the court. It cannot declare wars, joins none, and never joins independence wars."
 LEAD_oe_yp_xingsheng: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yp_xingsheng: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yp_frontier: "Frontier Branch Secretariat"
 oe_yp_frontier_desc: "This country is a frontier Branch Secretariat of [GetCountry('CHI').GetName] and governs the land and troops of its province directly. It shows on the map in its overlord's colour and name, cannot be annexed, cannot declare its own wars, follows its overlord into war, and never joins independence wars."
 LEAD_oe_yp_frontier: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yp_frontier: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yp_xingsheng_subject: "Branch Secretariat"
 oe_yp_xingsheng_subject_desc: "This country is a provincial Branch Secretariat of [GetCountry('CHI').GetName]. It holds only its seat office; the land of its province stays under the court."
 oe_yp_xingsheng_seat: "Branch Secretariat Office"
 oe_yp_xingsheng_seat_desc: "The seat of the provincial governor. Gives its owner a little gold and manpower and does not reduce local levies."
 oe_yp_xingsheng_seat_maintain: "Provincial Administration"
 oe_yp.1.t: "[TEST] Yuan branch secretariats"
 oe_yp.1.d: "#T Inputs of the loyalty target#!\nFactional strife intensity [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_intensity').GetValue|2] (1 when unset)  Bayan dictator modifier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dictator').GetValue|0]  Red Turban situation active [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr').GetValue|0]  -> target [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_target').GetValue|1]\nBranch secretariats of the Yuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_subjects').GetValue|0] (should be 6)  in the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_in_mk').GetValue|0]  subject relation added at start [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_subject').GetValue|0]  seat office built at start [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_seat').GetValue|0]\n#T Branch secretariats (exists: 1 Yuan's branch secretariat, -1 exists otherwise, 0 missing; loyalty -1 = no data)#! (tier: 3 compliant, 2 normal, 1 slack, 0 estranged, -1 = no data)\nHenan Jiangbei: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHN').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHN').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHN').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHN').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_2').GetValue|0] (start 240)\nJiangzhe: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJZ').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJZ').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJZ').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJZ').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_3').GetValue|0] (start 180)\nJiangxi: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJX').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJX').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJX').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJX').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_4').GetValue|0] (start 135)\nHuguang: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHG').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHG').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHG').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHG').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_5').GetValue|0] (start 198)\nShaanxi: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSX').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSX').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSX').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSX').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_6').GetValue|0] (start 133)\nSichuan: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSC').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSC').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSC').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSC').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_7').GetValue|0] (start 110)\nFuli (under the Central Secretariat, no branch secretariat): Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_1').GetValue|0] (start 409)\n#T Frontier branch secretariats (land subjects; exists: 1 Yuan's frontier branch secretariat)#! (tier: 3 compliant, 2 normal, 1 slack, 0 estranged, -1 = no data)\nLingbei: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLB').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLB').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLB').GetValue|0]  locations [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLB').GetValue|0] (start 75)\nLiaoyang: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLY').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLY').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLY').GetValue|0]  locations [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLY').GetValue|0] (start 120)\nGansu: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YGU').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YGU').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YGU').GetValue|0]  locations [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YGU').GetValue|0] (start 37)\nFrontier branch secretariats of the Yuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_subjects').GetValue|0] (should be 3)  in the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_in_mk').GetValue|0] (should be 0); Karakorum and Liaoyang city stay with the Yuan.\n#T Collapse of the Yuan (Y2)#!\nDissolved [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved').GetValue|0] (0 = no; reason: 1 = the Yuan (CHI) no longer exists, 2 = a Red Turban leader holds the CHI tag, 3 = the CHI tag passed to another country, 4 = the Middle Kingdom no longer exists, 5 = another country holds the Mandate, 6 = the CHI tag or the Yuan's YUA was formed (vanilla .101, .105, flavor_chi.33), 9 = test)  year [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved_year').GetValue|0]\nFallen now [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fallen_now').GetValue|0]  Yuan leads the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_mk_chi').GetValue|0]  Yuan still holds CHI [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yuan_chi').GetValue|0]  Red Turban dynasty mark [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_chi_new').GetValue|0]  Northern Yuan exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yua').GetValue|0]  vanilla Red Turban .42 fired [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr42').GetValue|0]\nUnits ended (0 = no, 1 = seat lost, 2 = no longer the Yuan's subject, 3 = the secretariat country is gone, 4 = vanilla event (Liaoyang .42), 5 = the Yuan fell, 9 = test): Henan Jiangbei [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u2').GetValue|0]  Jiangzhe [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u3').GetValue|0]  Jiangxi [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u4').GetValue|0]  Huguang [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u5').GetValue|0]  Shaanxi [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u6').GetValue|0]  Sichuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u7').GetValue|0]  Lingbei [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u8').GetValue|0]  Liaoyang [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u9').GetValue|0]  Gansu [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u10').GetValue|0]\nLocations of the ten units still carrying a marker or a tier modifier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_marked').GetValue|0] (0 after the collapse)"
