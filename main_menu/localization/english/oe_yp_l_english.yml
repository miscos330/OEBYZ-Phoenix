 STATIC_MODIFIER_NAME_oe_yp_ev32_dongting_fleet_mod: "Dongting & Yangtze River Fleet"
 STATIC_MODIFIER_DESC_oe_yp_ev32_dongting_fleet_mod: "River flotillas patrolling Lake Dongting secure central supply lines and naval firepower."
 STATIC_MODIFIER_NAME_oe_yp_ev35_chi_horses_mod: "Sichuan Tea-Horse Remounts"
 STATIC_MODIFIER_DESC_oe_yp_ev35_chi_horses_mod: "Steady remounts from the Sichuan tea-horse trade strengthen imperial light cavalry."
 STATIC_MODIFIER_NAME_oe_yp_ev36_yam_post_mod: "Karakorum Yam Post Revival"
 STATIC_MODIFIER_DESC_oe_yp_ev36_yam_post_mod: "Prioritized Imperial Road Office works revive the steppe Yam network to Karakorum."
 STATIC_MODIFIER_NAME_oe_yp_ev36_remounts_mod: "Lingbei Imperial Stud Remounts"
 STATIC_MODIFIER_DESC_oe_yp_ev36_remounts_mod: "Steppe herds from Lingbei replenish imperial heavy and light cavalry regiments."
 STATIC_MODIFIER_NAME_oe_yp_ev36_pasture_mod: "Steppe Pasture Recovery"
 STATIC_MODIFIER_DESC_oe_yp_ev36_pasture_mod: "Tax relief restores steppe herds, food stores and frontier manpower."
 STATIC_MODIFIER_NAME_oe_yp_ev37_jurchen_mod: "Pacified Jurchen Myriarchies"
 STATIC_MODIFIER_DESC_oe_yp_ev37_jurchen_mod: "Confirmed Jurchen myriarchies strengthen Liaoyang cavalry and northeastern post roads."
 STATIC_MODIFIER_NAME_oe_yp_ev37_coast_mod: "Liaodong Coastal Defense"
 STATIC_MODIFIER_DESC_oe_yp_ev37_coast_mod: "Fortified Liaodong ports guard Bohai approaches and maritime trade."
 STATIC_MODIFIER_NAME_oe_yp_ev38_silk_relay_mod: "Hexi Silk Road Relays"
 STATIC_MODIFIER_DESC_oe_yp_ev38_silk_relay_mod: "Upgraded Hexi relay stations accelerate overland Silk Road trade and road construction."
 STATIC_MODIFIER_NAME_oe_yp_ev38_hexi_guard_mod: "Hexi Corridor Joint Defense"
 STATIC_MODIFIER_DESC_oe_yp_ev38_hexi_guard_mod: "Joint patrols between Gansu and the western princes fortify the Hexi corridor."
 STATIC_MODIFIER_NAME_oe_yp_ev39_yunnan_accord_mod: "Liang-Duan Administrative Accord"
 STATIC_MODIFIER_DESC_oe_yp_ev39_yunnan_accord_mod: "Balanced civil-military governance between Liang and Dali stabilizes Yunnan."
 STATIC_MODIFIER_NAME_oe_yp_ev39_liang_command_mod: "Prince of Liang's Unified Command"
 STATIC_MODIFIER_DESC_oe_yp_ev39_liang_command_mod: "Unified military command under the Prince of Liang raises Yunnan's troop morale and manpower."
 STATIC_MODIFIER_NAME_oe_yp_ev40_jeju_horses_mod: "Jeju Stud Farms & East Sea Fleet"
 STATIC_MODIFIER_DESC_oe_yp_ev40_jeju_horses_mod: "Jeju cavalry mounts and Goryeo warships reinforce imperial land and naval forces."
 STATIC_MODIFIER_NAME_oe_yp_path_sansi_mod: "Restored Yuan Order: Three Commissions"
 STATIC_MODIFIER_DESC_oe_yp_path_sansi_mod: "Splitting grand secretariats into Three Commissions establishes durable central control and fiscal strength."
 STATIC_MODIFIER_NAME_oe_yp_path_cavalry_mod: "Restored Yuan Order: Cavalry Viceroyalties"
 STATIC_MODIFIER_DESC_oe_yp_path_cavalry_mod: "Preserving military-civil Grand Secretariats unleashes unmatched steppe cavalry and imperial manpower."
 STATIC_MODIFIER_NAME_oe_yp_tier_lax_c: "Slack Frontier Secretariat"
 STATIC_MODIFIER_DESC_oe_yp_tier_lax_c: "A slack frontier governor drags down local levies and administrative control."
 STATIC_MODIFIER_NAME_oe_yp_tier_estranged_c: "Estranged Frontier Secretariat"
 STATIC_MODIFIER_DESC_oe_yp_tier_estranged_c: "An estranged frontier secretariat undermines levies and imperial control."
 STATIC_MODIFIER_NAME_oe_yp_chi_warlordism_drag: "Entrenched Provincial Warlordism Drag"
 STATIC_MODIFIER_DESC_oe_yp_chi_warlordism_drag: "Inner branch secretariats with entrenched warlordism siphon taxes and erode central control."
 STATIC_MODIFIER_NAME_oe_yp_chi_tier_loyal_synergy: "Compliant Secretariats Synergy"
 STATIC_MODIFIER_DESC_oe_yp_chi_tier_loyal_synergy: "Compliant inner secretariats deliver steadier tax remittances and levies alongside routine court upkeep."
 STATIC_MODIFIER_NAME_oe_yp_chi_tier_estranged_drag: "Estranged Secretariats Drag"
 STATIC_MODIFIER_DESC_oe_yp_chi_tier_estranged_drag: "Slack or estranged inner branch secretariats weaken central levy mobilization and control."
 STATIC_MODIFIER_NAME_oe_yp_chi_sansi_network: "Inner Three-Commission Provincial Network"
 STATIC_MODIFIER_DESC_oe_yp_chi_sansi_network: "Reformed Three-Commission inner provinces permanently strengthen imperial control, taxation, and levies while curbing aristocratic autonomy."
 oe_yp.30.t: "Jiangzhe Maritime Grain & Coastal Magnates"
 oe_yp.30.d: "Coastal raiders and Fang Guozhen's fleets menace Mingzhou and Wenzhou, disrupting the maritime grain lifeline from Jiangzhe to Dadu. The Jiangzhe Branch Secretariat asks whether to charter coastal magnates to haul the grain, dispatch war galleys to sweep the sea lanes, or divert shipments inland along the Grand Canal."
 oe_yp.30.a: "Charter coastal magnates to haul the imperial grain"
 oe_yp.30.b: "Dispatch imperial galleys to sweep the sea lanes"
 oe_yp.30.c: "Divert shipments inland along the Grand Canal"
 oe_yp.31.t: "Henan: Jia Lu's Yellow River Dike & Local Militia"
 oe_yp.31.d: "The Yellow River has breached its dikes at Baimao, flooding the plains around Bianliang and severing canal routes. Minister Jia Lu proposes conscripting huge labor levies to force the river back into its old course, while the Henan Jiangbei Secretariat warns of unrest and urges relief works backed by local militia."
 oe_yp.31.a: "Back Jia Lu's great dike to restore the river course"
 oe_yp.31.b: "Ease labor levies, distribute relief and muster militia"
 oe_yp.31.c: "Order Henan Jiangbei to fund repairs locally"
 oe_yp.32.t: "Huguang Yangtze Defense & Dongting Fleet"
 oe_yp.32.d: "Commanding the middle Yangtze and Lake Dongting, Huguang links the southern frontier to the Central Plain. The branch secretariat asks whether to fortify river citadels at Wuchang and Yuezhou, expand the Dongting war fleet, or march Jingxiang veterans north to reinforce imperial armies."
 oe_yp.32.a: "Fortify the Yangtze citadels at Wuchang and Yuezhou"
 oe_yp.32.b: "Expand the Lake Dongting fleet to patrol the Yangtze"
 oe_yp.32.c: "Draw Jingxiang veterans north for the Central Plain"
 oe_yp.33.t: "Jiangxi: Jingdezhen Imperial Kilns & Salt Audits"
 oe_yp.33.d: "Blue-and-white porcelain from Jingdezhen commands high prices across land and sea, yet salt smuggling erodes Jiangxi's fiscal books. Provincial officials ask to expand the Fuliang Porcelain Bureau, while censors urge a strict salt-monopoly audit to refill the treasury and curb inflation."
 oe_yp.33.a: "Expand the Fuliang Bureau for imperial porcelain exports"
 oe_yp.33.b: "Dispatch censors to audit Jiangxi's salt monopoly"
 oe_yp.33.c: "Ease merchant dues to reassure local guilds"
 oe_yp.34.t: "Shaanxi: The Four Generals Entrench in Guanzhong"
 oe_yp.34.d: "Years of frontier warfare have left the Four Shaanxi Generals entrenched across Guanzhong with private levies and competing tax claims. Left unchecked, Shaanxi risks hardening into an autonomous military domain beyond Dadu's reach."
 oe_yp.34.a: "Send censors and commissioners to divide their commands"
 oe_yp.34.b: "Grant provincial honors and let the generals guard the passes"
 oe_yp.34.c: "Issue a stern decree ordering demobilization"
 oe_yp.35.t: "Sichuan Tea-Horse Trade & Ba-Shu Frontier Alert"
 oe_yp.35.d: "Ringed by formidable passes, Sichuan sustains vital Tibetan horse purchases through the Yazhou tea markets while guarding the upper Yangtze against Xia incursions. The court must decide whether to revive the tea-horse bureaus, fortify Jiange and Qutang Gorge, or ship Sichuan grain east."
 oe_yp.35.a: "Revive the Yazhou Tea-Horse Bureau for cavalry mounts"
 oe_yp.35.b: "Fortify Jiange Pass and Qutang Gorge against raids"
 oe_yp.35.c: "Requisition Sichuan grain for the eastern fronts and Dadu"
 oe_yp.36.t: "Lingbei: Karakorum Horse-Posts & Steppe Snow Disaster"
 oe_yp.36.d: "Severe blizzards have struck the northern steppe, killing relay horses along the Karakorum Yam posts and thinning imperial herds in Lingbei. Prioritizing Imperial Road Office construction alongside snow relief will restore steppe logistics, or the court may requisition remaining remounts or grant pasture tax relief."
 oe_yp.36.a: "Fund relief and prioritize Imperial Road Office steppe Yam roads"
 oe_yp.36.b: "Requisition Lingbei stud horses for capital cavalry"
 oe_yp.36.c: "Remit steppe pasture taxes so Lingbei herds recover"
 oe_yp.37.t: "Liaoyang Frontier & Jurchen Myriarchies"
 oe_yp.37.d: "Liaoyang anchors the northeastern frontier, bordering Jurchen tribes, Goryeo and the Bohai coast while balancing the eastern princes. Jurchen myriarchs have arrived at Daning seeking renewed seals, while coastal forts request funding against raiders."
 oe_yp.37.a: "Confirm Jurchen myriarchs and expand Daning post roads"
 oe_yp.37.b: "Fortify Liaodong ports and Bohai sea lanes"
 oe_yp.37.c: "Entrust eastern frontier armies to Liaoyang's governor"
 oe_yp.38.t: "Gansu: Hexi Silk Road Relays & Western Caravans"
 oe_yp.38.d: "Caravans laden with jade, mounts and spices from Central Asia have gathered at Ganzhou and Suzhou. The Gansu Branch Secretariat proposes upgrading the Hexi Silk Road relays, levying caravan customs for the throne, or joining forces with the western princes to guard the corridor."
 oe_yp.38.a: "Upgrade the Ganzhou and Suzhou Silk Road relay network"
 oe_yp.38.b: "Levy customs duties on the Western Regions caravans"
 oe_yp.38.c: "Coordinate with the western princes to guard Hexi"
 oe_yp.39.t: "Yunnan: The Prince of Liang & the Duan Governors of Dali"
 oe_yp.39.d: "Governance in Yunnan balances the imperial Prince of Liang at Kunming with the hereditary Duan governors of Dali. Rival claims over native tusi levies and revenues have sharpened into an open dispute laid before the throne in Dadu."
 oe_yp.39.a: "Mediate a civil-military accord between Liang and Dali"
 oe_yp.39.b: "Grant the Prince of Liang unified command over Yunnan"
 oe_yp.39.c: "Dispatch central secretariat officials to oversee Yunnan"
 oe_yp.40.t: "Zhengdong: Jeju Stud Farms & East Sea Fleet"
 oe_yp.40.d: "Jeju Island's pastures provide prime warhorses for the Yuan while Goryeo shipyards maintain formidable coastal fleets. The court may fund Jeju stud farms and joint naval patrols, charter Goryeo ships to haul southern grain north, or ease tribute burdens to strengthen loyalty."
 oe_yp.40.a: "Expand Jeju stud farms and commend the East Sea fleet"
 oe_yp.40.b: "Charter Zhengdong ships to haul southern grain to Dadu"
 oe_yp.40.c: "Ease Zhengdong tribute burdens to win goodwill"
 oe_yp.41.t: "Grand Debate: Three Commissions vs. Cavalry Viceroyalties"
 oe_yp.41.d: "With the empire resurgent, a decisive debate splits the Great Yuan court over the future of the eleven branch secretariats. Centralizing ministers urge splitting provincial governors into Three Commissions (civil, judicial and military) to extinguish warlordism forever, while steppe nobles champion preserving integrated Cavalry Viceroyalties to project unmatched military might."
 oe_yp.41.a: "Reform into Three Commissions: centralize and end warlordism"
 oe_yp.41.b: "Preserve Cavalry Viceroyalties: integrated steppe military power"
 oe_yp.31.a.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Henan Jiangbei gain #G Jia Lu's Yellow River Dikes#! for #Y 15#! years (local food #G +12%#!, production #G +8%#!)."
 oe_yp.31.b.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Henan Jiangbei gain #G Henan Local Militia#! for #Y 10#! years (local levies #G +15%#!, defensive #G +10%#!)."
 oe_yp.32.a.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Huguang gain #G Huguang Yangtze River Forts#! for #Y 10#! years (local defensive #G +15%#!, garrison #G +20%#!)."
 oe_yp.33.a.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Jiangxi gain #G Fuliang Imperial Porcelain Bureau#! for #Y 15#! years (local porcelain #G +20%#!, production #G +8%#!)."
 oe_yp.34.a.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Shaanxi gain #G Shaanxi Imperial Oversight#! for #Y 10#! years (local max control #G +8%#!, unrest #G -5%#!)."
 oe_yp.34.b.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Shaanxi gain #G Garrisons of the Four Shaanxi Generals#! for #Y 10#! years (local levies #G +20%#!, defensive #G +15%#!)."
 oe_yp.35.a.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Sichuan gain #G Yazhou Tea-Horse Market#! for #Y 15#! years (local tea #G +20%#!, supply limit #G +10%#!)."
 oe_yp.35.b.mod_tt: "Up to #Y 8#! key seats, forts, and cities in Sichuan gain #G Jiange & Qutang Gorge Defenses#! for #Y 15#! years (local defensive #G +22%#!, garrison #G +20%#!)."
 oe_yp_xingsheng: "Branch Secretariat"
 oe_yp_xingsheng_desc: "This country is a provincial Branch Secretariat of [GetCountry('CHI').GetName]. Its governor maintains a provincial seat office and lean garrison regiments supplied via overlord food access while the land and levies stay under the court. Loyal or Branch Shumiyuan-empowered secretariats defend the throne and may be called to arms; they never declare independent wars or join independence wars."
 oe_yp_xingsheng_defend_tt: "Defends Great Yuan when Normal/Compliant or empowered with a wartime Branch Shumiyuan."
 oe_yp_xingsheng_call_tt: "Can be called into offensive wars when Compliant or empowered with a wartime Branch Shumiyuan."
 OE_YP_SHUMIYUAN_GARRISON_ACTIVE: "Branch Bureau of Military Affairs active: expanded garrison"
 LEAD_oe_yp_xingsheng: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yp_xingsheng: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yp_frontier: "Frontier Branch Secretariat"
 oe_yp_frontier_desc: "This country is a frontier Branch Secretariat of [GetCountry('CHI').GetName] governing borderland territory and military colonies directly. Its local revenues stay on the frontier (zero tribute) to sustain border garrisons; it shows in its overlord's colour and name, follows its overlord into war, cannot be annexed, and never joins independence wars."
 LEAD_oe_yp_frontier: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_yp_frontier: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_yp_xingsheng_subject: "Branch Secretariat"
 oe_yp_xingsheng_subject_desc: "This country is a provincial Branch Secretariat of [GetCountry('CHI').GetName], maintaining lean seat garrisons with overlord food access and garrison upkeep relief while provincial land stays under the court."
 oe_yp_xingsheng_seat: "Branch Secretariat Office"
 oe_yp_xingsheng_seat_desc: "The seat office and garrison compound of the provincial governor. Allows recruiting garrison regiments locally and supplies gold and manpower without reducing Great Yuan's levies."
 oe_yp_xingsheng_seat_maintain: "Provincial Administration"
 oe_yp.1.t: "[TEST] Yuan branch secretariats"
 oe_yp.1.d: "#T Inputs of the loyalty target#!\nFactional strife intensity [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_intensity').GetValue|2] (1 when unset)  Bayan dictator modifier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dictator').GetValue|0]  Red Turban situation active [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr').GetValue|0]  -> target [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_target').GetValue|1]\nBranch secretariats of the Yuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_subjects').GetValue|0] (should be 6)  in the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_in_mk').GetValue|0]  subject relation added at start [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_subject').GetValue|0]  seat office built at start [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fb_seat').GetValue|0]\n#T Branch secretariats (exists: 1 Yuan's branch secretariat, -1 exists otherwise, 0 missing; loyalty -1 = no data)#! (tier: 3 compliant, 2 normal, 1 slack, 0 estranged, -1 = no data; diplo cap 6x0.0+3x0.15=0.45)\nHenan Jiangbei: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHN').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHN').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHN').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YHN').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHN').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_2').GetValue|0] (start 240)\nJiangzhe: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJZ').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJZ').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJZ').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YJZ').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJZ').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_3').GetValue|0] (start 180)\nJiangxi: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YJX').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YJX').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YJX').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YJX').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YJX').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_4').GetValue|0] (start 135)\nHuguang: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YHG').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YHG').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YHG').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YHG').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YHG').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_5').GetValue|0] (start 194)\nShaanxi: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSX').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSX').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSX').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YSX').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSX').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_6').GetValue|0] (start 133)\nSichuan: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YSC').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YSC').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YSC').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YSC').GetValue|0]  seat office [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_seat_YSC').GetValue|0]  Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_7').GetValue|0] (start 110)\nFuli (under the Central Secretariat, no branch secretariat): Yuan locations with this unit [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_locs_1').GetValue|0] (start 409)\n#T Frontier branch secretariats (land subjects; exists: 1 Yuan's frontier branch secretariat)#! (tier: 3 compliant, 2 normal, 1 slack, 0 estranged, -1 = no data; diplo cap 6x0.0+3x0.15=0.45)\nLingbei: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLB').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLB').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLB').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YLB').GetValue|0]  locations [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLB').GetValue|0] (start 75)\nLiaoyang: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YLY').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YLY').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YLY').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YLY').GetValue|0]  locations [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YLY').GetValue|0] (start 117)\nGansu: exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_ex_YGU').GetValue|0]  loyalty [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_loy_YGU').GetValue|1]  tier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_tier_YGU').GetValue|0]  warlordism [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_wl_YGU').GetValue|0]  locations [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_land_YGU').GetValue|0] (start 37)\nFrontier branch secretariats of the Yuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_subjects').GetValue|0] (should be 3)  in the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fr_in_mk').GetValue|0] (should be 0); Karakorum is Lingbei's seat and Liaoyang belongs to Liaoyang Secretariat.\n#T Collapse of the Yuan (Y2)#!\nDissolved [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved').GetValue|0] (0 = no; reason: 1 = the Yuan (CHI) no longer exists, 2 = a Red Turban leader holds the CHI tag, 3 = the CHI tag passed to another country, 4 = the Middle Kingdom no longer exists, 5 = another country holds the Mandate, 6 = the CHI tag or the Yuan's YUA was formed (vanilla .101, .105, flavor_chi.33), 9 = test)  year [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_dissolved_year').GetValue|0]\nFallen now [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_fallen_now').GetValue|0]  Yuan leads the Middle Kingdom [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_mk_chi').GetValue|0]  Yuan still holds CHI [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yuan_chi').GetValue|0]  Red Turban dynasty mark [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_chi_new').GetValue|0]  Northern Yuan exists [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_yua').GetValue|0]  vanilla Red Turban .42 fired [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_rtr42').GetValue|0]\nUnits ended (0 = no, 1 = seat lost, 2 = no longer the Yuan's subject, 3 = the secretariat country is gone, 4 = vanilla event (Liaoyang .42), 5 = the Yuan fell, 9 = test): Henan Jiangbei [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u2').GetValue|0]  Jiangzhe [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u3').GetValue|0]  Jiangxi [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u4').GetValue|0]  Huguang [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u5').GetValue|0]  Shaanxi [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u6').GetValue|0]  Sichuan [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u7').GetValue|0]  Lingbei [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u8').GetValue|0]  Liaoyang [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u9').GetValue|0]  Gansu [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_end_u10').GetValue|0]\nLocations of the ten units still carrying a marker or a tier modifier [ROOT.GetCountry.MakeScope.GetVariable('oe_yp_r_marked').GetValue|0] (0 after the collapse)"
