 STATIC_MODIFIER_NAME_oe_yp_prof_frontier_t2: "Frontier Cavalry Province (Normal)"
 STATIC_MODIFIER_DESC_oe_yp_prof_frontier_t2: "Frontier relay posts and supply lines keep imperial armies provisioned across the steppe."
 STATIC_MODIFIER_NAME_oe_yp_prof_frontier_t3: "Frontier Cavalry Province (Compliant)"
