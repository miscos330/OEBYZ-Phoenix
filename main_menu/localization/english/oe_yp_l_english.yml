 STATIC_MODIFIER_DESC_oe_yp_tuntian_overlord_mod: "Established frontier military colonies expand imperial supply limits and cavalry recruitment."
 STATIC_MODIFIER_NAME_oe_yp_censorate_country_mod: "Branch Censorate Audit"
