 oe_fs_cl_p2_s2: "[GetCountry('BYZ').Custom('OeFsRegP2')], step 2, settlers (month #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p2_w')|0]#! of at most #Y 36#!)"
