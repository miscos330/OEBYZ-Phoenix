l_english:
 STATIC_MODIFIER_NAME_oe_fs_crown_land: "Crown Estate"
 STATIC_MODIFIER_NAME_oe_fs_held_land: "Newly Held Land"
 STATIC_MODIFIER_NAME_oe_fs_new_rule: "New Rulers, Old Ways"
 STATIC_MODIFIER_NAME_oe_fs_crown_won: "A Crown Abolished"
 STATIC_MODIFIER_NAME_oe_fs_exking_court: "Kept at Court with a Dignity"
 STATIC_MODIFIER_NAME_oe_fs_exking_monk: "Retired to a Monastery"
 oe_fs_old_house: "Our old ruler came back as despot"
 oe_fs.1.t: "The Settlement of a Conquered Crown"
 oe_fs.1.desc_kr: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe crown of [oe_fs_cap.GetName] has fallen to the emperor. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#! places of the new land are not yet in any theme; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#! of them around the old capital can be kept as #bold #color_yellow crown estates#!#! under the empire's direct rule. How the other #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_rest_n')|0]#! are to be ordered is the emperor's to decide.\n\nThe former ruler, [oe_fs_k.GetFirstNameWithNoTooltip], has been brought to the City to await the emperor's will."
 oe_fs.1.desc_k: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe crown of [oe_fs_cap.GetName] has fallen to the emperor. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#! places of the new land are not yet in any theme; there is little of it, and all of it can be kept as #bold #color_yellow crown estates#!#! under the empire's direct rule.\n\nThe former ruler, [oe_fs_k.GetFirstNameWithNoTooltip], has been brought to the City to await the emperor's will."
 oe_fs.1.desc_r: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe crown of [oe_fs_cap.GetName] has fallen to the emperor. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#! places of the new land are not yet in any theme; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#! of them around the old capital can be kept as #bold #color_yellow crown estates#!#! under the empire's direct rule. How the other #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_rest_n')|0]#! are to be ordered is the emperor's to decide."
 oe_fs.1.desc_x: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!\n\nThe crown of [oe_fs_cap.GetName] has fallen to the emperor. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_open_n')|0]#! places of the new land are not yet in any theme; there is little of it, and all of it can be kept as #bold #color_yellow crown estates#!#! under the empire's direct rule."
 oe_fs.1.a: "Abolish the crown and set up themes on the rest"
 oe_fs.1.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_cost_a')|0]#! [Concept('oe_tu_authority','Imperial Authority')|e]\nSet up #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_nth')|0]#! theme(s), each seat in a different area; the rest goes to the nearest seat. A theme on a foreign border becomes a [Concept('oe_tu_march','march')|e], the others an [Concept('oe_tu_exarchate','exarchate')|e]\nThe rest gains [ShowModifier('oe_fs_new_rule')] for #Y 5#! years\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#! crown estates gain [ShowModifier('oe_fs_crown_land')] for #Y 20#! years; the empire gains [ShowModifier('oe_fs_crown_won')] for #Y 10#! years\nIf it cannot be done, the rest is held directly as in the last choice"
 oe_fs.1.b: "Abolish the crown and grant the land to a prince of the house as despot"
 oe_fs.1.b.tt: "The rest becomes one theme, its seat the most populous place; the eldest prince of the house becomes its despot, and the theme an appanage\nCosts #R 10#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 10#! prestige (the price of the appanage action)\nThe rest gains [ShowModifier('oe_fs_new_rule')] for #Y 5#! years\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#! crown estates gain [ShowModifier('oe_fs_crown_land')] for #Y 20#! years; the empire gains [ShowModifier('oe_fs_crown_won')] for #Y 10#! years\nIf it cannot be done, the rest is held directly as in the last choice"
 oe_fs.1.c: "Raise a local lord as despot, an ally of Rome"
 oe_fs.1.c.tt: "A duchy is raised with [oe_fs_s1.GetName] as its seat, a Roman ally and subject of the empire; the rest goes to it\nPrestige #G +5#!; if a place is free, its ruler receives the dignity of despot\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#! crown estates gain [ShowModifier('oe_fs_crown_land')] for #Y 20#! years; the empire gains [ShowModifier('oe_fs_crown_won')] for #Y 10#! years\nIf the duchy cannot be raised, the rest is held directly as in the last choice"
 oe_fs.1.d: "Leave it for now and hold it all directly"
 oe_fs.1.d.tt: "The rest gains [ShowModifier('oe_fs_held_land')] for #Y 10#! years; themes can still be set up there later as usual\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_cnt')|0]#! crown estates gain [ShowModifier('oe_fs_crown_land')] for #Y 20#! years; the empire gains [ShowModifier('oe_fs_crown_won')] for #Y 10#! years"
 oe_fs.2.t: "The Former King"
 oe_fs.2.desc_hl: "#F In 1340 the young ruler of Epirus, Nikephoros, surrendered, married a daughter of the Kantakouzenos house and received a high title of the empire.#!\n\n[oe_fs_k.GetFirstNameWithNoTooltip], once a crowned ruler, has been brought to the City. The crown is gone, but the old standing remains, and the emperor must decide where this former ruler is to go."
 oe_fs.2.desc_h: "#F When Bulgaria submitted in 1018, its nobles kept their standing.#!\n\n[oe_fs_k.GetFirstNameWithNoTooltip], once a crowned ruler, has been brought to the City. The crown is gone, but the old standing remains, and the emperor must decide where this former ruler is to go."
 oe_fs.2.desc_xl: "#F In 1340 the young ruler of Epirus, Nikephoros, surrendered, married a daughter of the Kantakouzenos house and received a high title of the empire.#!\n\nBut the former royal family scattered on the road and could not be brought to the City."
 oe_fs.2.desc_x: "#F When Bulgaria submitted in 1018, its nobles kept their standing.#!\n\nBut the former royal family scattered on the road and could not be brought to the City."
 oe_fs.2.a: "Grant a dignity and keep them in the City"
 oe_fs.2.a.tt: "They gain #bold #color_yellow Kept at Court with a Dignity#!#! (a little better at work in the cabinet)\nPrestige #G +5#!"
 oe_fs.2.b: "Send them to a monastery"
 oe_fs.2.b.tt: "They gain #bold #color_yellow Retired to a Monastery#!#!: no cabinet, no succession, no command, no marriage\nStability #G +7#!"
 oe_fs.2.c: "Send them back as despot of the new duchy"
 oe_fs.2.c.tt: "They become ruler of [oe_fs_a.GetName]\n[oe_fs_a.GetName]'s opinion of the empire #G +25#!, falling by #Y 2#! a year"
 oe_fs.2.d: "Make them the first strategos of the new theme"
 oe_fs.2.d.tt: "They become ruler of [oe_fs_t1.GetName]\n[oe_fs_t1.GetName]'s loyalty #G +10#!"
 oe_fs.2.e: "The royal house has scattered"
 oe_fs.2.e.tt: "Nothing happens"
 oe_fs.12.t: "Forts and Soldier-Farmers"
 oe_fs.12.desc_r1: "#F In the 1240s John III settled Cumans in Thrace, Macedonia and Phrygia, on condition that they served the empire as soldiers.#!\n\nThe frontier programme of [GetCountry('BYZ').Custom('OeFsRegEv')] has reached its third step. The register is complete: the households and fields of the land are on the rolls. Settlers have come as well: new households have been placed at [oe_fs_pk.GetName]. A frontier is only held once it has forts and soldier-farmers."
 oe_fs.12.desc_r2: "#F In the 1240s John III settled Cumans in Thrace, Macedonia and Phrygia, on condition that they served the empire as soldiers.#!\n\nThe frontier programme of [GetCountry('BYZ').Custom('OeFsRegEv')] has reached its third step. The register is complete: the households and fields of the land are on the rolls. There is no sparse land here to settle, so the settlers' step was passed over. A frontier is only held once it has forts and soldier-farmers."
 oe_fs.12.desc_r3: "#F In the 1240s John III settled Cumans in Thrace, Macedonia and Phrygia, on condition that they served the empire as soldiers.#!\n\nThe frontier programme of [GetCountry('BYZ').Custom('OeFsRegEv')] has reached its third step. The register is complete: the households and fields of the land are on the rolls. The settlers, however, never came. A frontier is only held once it has forts and soldier-farmers."
 oe_fs.12.a: "Build a fort on the border"
 oe_fs.12.a.tt: "Costs #R 150#! gold\nA #bold #color_yellow castle#!#! is built at [oe_fs_fl.GetName] at once; where one cannot be built, the place gains [ShowModifier('oe_fs_fort_loc')] for #Y 20#! years instead"
 oe_fs.12.b: "Settle foreign soldier-farmers in the theme"
 oe_fs.12.b.tt: "Costs #R 3#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 150#! gold (the price of the soldier-settler action)\n[oe_fs_ths.GetName] receives foreign soldier-farmers: more manpower, faster recruiting and faster growth in its jurisdiction for #Y 20#! years, some unrest in the first #Y 5#!; a theme takes settlers once in #Y 30#! years"
 oe_fs.12.c: "Make soldier-farmers of the local households"
 oe_fs.12.c.tt: "Costs #R 3#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 150#! gold (the price of the soldier-settler action)\n[oe_fs_ths.GetName] receives native soldier-farmers: a little more manpower and faster recruiting, faster assimilation in its jurisdiction and less unrest, for #Y 20#! years; a theme takes settlers once in #Y 30#! years"
 oe_fs.12.d: "Grant the frontier land as pronoia"
 oe_fs.12.d.tt: "[oe_fs_thp.GetName]'s revenues are granted as [Concept('oe_tu_pronoia','pronoia')|e] (as the theme officials' 'grant' does; the officials cannot be changed again for two years)\nCosts nothing"
 oe_fs.12.e: "Put it off for a year"
 oe_fs.12.e.tt: "Asked again in #Y 12#! months; it cannot be put off twice"
 oe_fs.12.f: "Leave it: no fort, no settlers"
 oe_fs.12.f.tt: "Nothing is done in this step; the programme goes on"
 STATIC_MODIFIER_NAME_oe_fs_prog_loc: "Frontier Register"
 STATIC_MODIFIER_NAME_oe_fs_fort_loc: "Frontier Fort"
 oe_fs_cl_reg_none: "(a region)"
 oe_fs_cl_free: "free"
 oe_fs_cl_p1_s1: "[GetCountry('BYZ').Custom('OeFsRegP1')], step 1, the register (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p1_w')|0]#!/#Y 24#! months)"
 oe_fs_cl_p1_s2: "[GetCountry('BYZ').Custom('OeFsRegP1')], step 2, settlers (month #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p1_w')|0]#! of at most #Y 36#!)"
 oe_fs_cl_p1_s3: "[GetCountry('BYZ').Custom('OeFsRegP1')], step 3, forts and soldier-farmers (awaiting a decision)"
 oe_fs_cl_p2_s1: "[GetCountry('BYZ').Custom('OeFsRegP2')], step 1, the register (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p2_w')|0]#!/#Y 24#! months)"
 oe_fs_cl_p2_s2: "[GetCountry('BYZ').Custom('OeFsRegP2')], step 2, settlers (month #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p2_w')|0]#! of at most #Y 36#!)"
 oe_fs_cl_p2_s3: "[GetCountry('BYZ').Custom('OeFsRegP2')], step 3, forts and soldier-farmers (awaiting a decision)"
 oe_fs_cl_p3_s1: "[GetCountry('BYZ').Custom('OeFsRegP3')], step 1, the register (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p3_w')|0]#!/#Y 24#! months)"
 oe_fs_cl_p3_s2: "[GetCountry('BYZ').Custom('OeFsRegP3')], step 2, settlers (month #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_p3_w')|0]#! of at most #Y 36#!)"
 oe_fs_cl_p3_s3: "[GetCountry('BYZ').Custom('OeFsRegP3')], step 3, forts and soldier-farmers (awaiting a decision)"
 oe_fs_open_prog: "Run a Frontier Programme"
 oe_fs_open_prog_desc: "Open a frontier programme for one historical region and make new or empty border land the empire's own, step by step: first #bold #color_yellow the register#!#! (#Y 24#! months), then #bold #color_yellow settlers#!#! (through [oe_tu_resettle|e]; the emperor chooses whom, as usual), then #bold #color_yellow forts and soldier-farmers#!#! (a border fort, soldier-settlers or a [Concept('oe_tu_pronoia','pronoia')|e] grant); backers and romanisation, the fourth and fifth steps, come later.\nCosts #R 3#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 100#! gold. At most #Y 3#! at once. The empire needs at least #Y 3#! places in the region, at least #Y 2#! of them sparse, or one taken from a foreign hand within #Y 20#! years. While war reaches the region (a place of ours there occupied, or bordering an enemy), the clock stops.\nNow: programme 1: [GetCountry('BYZ').Custom('OeFsP1')]; programme 2: [GetCountry('BYZ').Custom('OeFsP2')]; programme 3: [GetCountry('BYZ').Custom('OeFsP3')]."
 oe_fs_open_prog_card: "Open a frontier programme for a region: register, settlers, forts and soldier-farmers."
 oe_fs_open_prog_select: "Choose a region (the lit regions may open a programme)"
 oe_fs_open_prog_none: "@trigger_no!No region may open a programme: the empire needs 3 or more places there, with sparse or newly gained land; a region already in a programme cannot open again."
 oe_fs_open_prog_tt: "Costs #R 3#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 100#! gold: the chosen region opens a frontier programme, beginning with the register."
 oe_fs_allow_calm: "The empire is not in a civil war"
 oe_fs_allow_slot: "Fewer than 3 frontier programmes are running"
 oe_fs_allow_auth: "At least 3 Imperial Authority"
 oe_fs_allow_gold: "At least 100 gold"
