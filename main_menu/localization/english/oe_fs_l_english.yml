 oe_fs_redeem: "Buy Out Frontier Backers"
 oe_fs_redeem_desc: "Pay a great house or the [Concept('oe_tu_company','Roman Company')|e] off at once and end one frontier backers' contract early: the price is #Y 220#! gold less #Y 12#! for each year paid (at least #Y 50#!), plus any arrears; what the Company is paid goes into its fund. Once ended, no more returns are paid and the house gains no more influence from it.\nNow: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_bk_n')|0]#! contract(s), #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_bk_due')|0]#! gold due next January, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_bk_debt')|0]#! gold in arrears."
 oe_fs_redeem_card: "End a frontier backers' contract: pay the rest, pay no more returns."
 oe_fs_redeem_select: "Choose a region (the lit regions have a contract to buy out)"
 oe_fs_redeem_none: "@trigger_no!No backers' contract to buy out (only a great house's or the Roman Company's money earns a return)."
 oe_fs_redeem_tt: "Pay the chosen region's contract price at once and end the contract."
 oe_fs_redeem_short: "Not enough gold to pay the chosen region's contract price."
 oe_fs_allow_contract: "At least one backers' contract that earns a return"
 oe_fs_allow_rgold: "At least 50 gold"
