 oe_fs_open_prog: "Run a Frontier Programme"
 oe_fs_open_prog_desc: "Open a frontier programme for one historical region and make new or empty border land the empire's own, step by step: first #bold #color_yellow the register#!#! (#Y 24#! months), then #bold #color_yellow settlers#!#! (through [oe_tu_resettle|e]; the emperor chooses whom, as usual), then #bold #color_yellow forts and soldier-farmers#!#! (a border fort, soldier-settlers or a [Concept('oe_tu_pronoia','pronoia')|e] grant), then #bold #color_yellow backers#!#! (a great house, the monasteries or the [Concept('oe_tu_company','Roman Company')|e] put in money, or the treasury pays) and, #Y 10#! years later, #bold #color_yellow settlement#!#! (romanisation may follow).\nCosts #R 3#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 100#! gold. At most #Y 3#! at once. The empire needs at least #Y 3#! places in the region, at least #Y 2#! of them sparse, or one taken from a foreign hand within #Y 20#! years. While war reaches the region (a place of ours there occupied, or bordering an enemy), the clock stops.\nNow: programme 1: [GetCountry('BYZ').Custom('OeFsP1')]; programme 2: [GetCountry('BYZ').Custom('OeFsP2')]; programme 3: [GetCountry('BYZ').Custom('OeFsP3')]. At steps 4 and 5: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_wait4_n')|0]#!; backers' contracts: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_bk_n')|0]#!."
 oe_fs_open_prog_card: "Open a frontier programme for a region: register, settlers, forts and soldier-farmers, backers, settlement."
 oe_fs_open_prog_select: "Choose a region (the lit regions may open a programme)"
 oe_fs_open_prog_none: "@trigger_no!No region may open a programme: the empire needs 3 or more places there, with sparse or newly gained land; a region already in a programme cannot open again."
 oe_fs_open_prog_tt: "Costs #R 3#! [Concept('oe_tu_authority','Imperial Authority')|e] and #R 100#! gold: the chosen region opens a frontier programme, beginning with the register."
 oe_fs_allow_calm: "The empire is not in a civil war"
 oe_fs_allow_slot: "Fewer than 3 frontier programmes are running"
 oe_fs_allow_auth: "At least 3 Imperial Authority"
 oe_fs_allow_gold: "At least 100 gold"
