 oe_s37_crown_coemperor: "Crown a Co-Emperor"
 oe_s37_crown_coemperor_desc: "Andronikos III had been crowned co-emperor in 1325, yet the son John was never crowned in the emperor's lifetime. When the emperor died in June 1341, John was still uncrowned. That October John Kantakouzenos was proclaimed emperor at Didymoteicho and civil war broke out; the regency crowned John V only in November.\nCrown the heir John co-emperor now, so the succession is no longer left open. Imperial Authority −10, prestige −15.\nJohn V becomes Co-Emperor for life: monthly prestige +0.1, +200 in the heir score of the Eastern Roman succession, and moves to the crown estate.\nRequires: an emperor on the throne (no regency), John alive, at our court and not yet crowned, no other co-emperor, and Imperial Authority of at least 10."
 oe_s37_crown_coemperor_card: "Crown the heir John co-emperor to secure the succession."
 oe_s37_crown_coemperor_tt: "Imperial Authority −10, prestige −15.\nJohn V becomes Co-Emperor for life: monthly prestige +0.1, +200 in the heir score of the Eastern Roman succession, and moves to the crown estate."
 oe_s37_crown_allow_ruler: "An emperor is on the throne (no regency)"
 oe_s37_crown_allow_john: "John V is alive, at our court, not a ruler and not yet crowned"
 oe_s37_crown_allow_none: "We have no other co-emperor"
 oe_s37_crown_allow_auth: "Imperial Authority is at least 10"
 oe_s37.1.t: "The Fall of Nicomedia"
 oe_s37.1.d: "The Ottomans besieged Nicomedia for several years. In 1337, with Andronikos III away campaigning in Albania, the city ran out of food and the garrison surrendered to Orhan. The inhabitants were allowed to leave for Constantinople. The city went to Süleyman, the eldest son of Orhan.\n\nNow Nicomedia has opened its gates to Orhan. Its Greeks are crossing the water to Constantinople with whatever they can carry. The empire holds one stronghold fewer in Asia."
 oe_s37.1.a: "Take in the refugees"
 oe_s37.1.a.tt: "Constantinople gains 2 thousand peasants and 1 thousand burghers of the empire's main culture and faith (our capital instead, if we do not hold Constantinople).\nIt gets Refugees from Nicomedia (2 years): pop food consumption +10%."
 oe_s37.1.b: "Offer Orhan tribute for peace"
 oe_s37.1.b.tt: "Envoys go to the Ottomans under the rules of Buy Peace with Tribute (Roman World panel); the answer comes back at once.\nThe tribute is 3 months of our total income (about [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0] gold now), fixed at signing; the first year is paid at once, then every January.\nAt peace with us, the Ottomans accept with a chance of 70% (40% if their opinion of us is below −50); at war, they accept only if they are not winning.\nOn acceptance: a mutual truce of 5 years, prestige −15, Imperial Authority −5, their opinion of us +25 (5 years). After a refusal we cannot ask the Ottomans again for 12 months."
 oe_s37.1.c: "Fortify the Bosporus"
 oe_s37.1.c.tt: "−50 gold.\nÜsküdar and Şilli on the Asian shore of the Bosporus (those we still hold) each get Bosporus Defences (10 years): defence +25%, garrison growth +25%. If we hold neither, Constantinople gets it."
 oe_s37.2.t: "The Albanian Tribes Rise"
 oe_s37.2.d1: "In 1337 the Albanian tribes around Mount Tomorr near Berat and around Kanina rose, in spite of privileges the emperor had granted them a few years before. They took the fortress of Tomorr and overran the country around Skrapar and Klisura. Andronikos III put the revolt down with an army made up mostly of Turks; 2,000 of them had been sent by Umur of Aydin. John Kantakouzenos wrote that the imperial soldiers did not enslave the Albanians, fellow Christians, but could not stop the Turkish allies from taking captives; the emperor later ransomed some of them.\n\nNow the tribes around Berat and Avlonya have risen again and hold the forts in the hills. Our locations there have Tribal Revolt (unrest +25%, max control −25%) until the revolt is put down, 24 months at most. A march that governs them has border pressure +25 until then.\n\nUmur of Aydin is our ally and can be asked for troops."
 oe_s37.2.d: "In 1337 the Albanian tribes around Mount Tomorr near Berat and around Kanina rose, in spite of privileges the emperor had granted them a few years before. They took the fortress of Tomorr and overran the country around Skrapar and Klisura. Andronikos III put the revolt down with an army made up mostly of Turks; 2,000 of them had been sent by Umur of Aydin. John Kantakouzenos wrote that the imperial soldiers did not enslave the Albanians, fellow Christians, but could not stop the Turkish allies from taking captives; the emperor later ransomed some of them.\n\nNow the tribes around Berat and Avlonya have risen again and hold the forts in the hills. Our locations there have Tribal Revolt (unrest +25%, max control −25%) until the revolt is put down, 24 months at most. A march that governs them has border pressure +25 until then.\n\nWe have no alliance with Aydin now, so Umur's troops are not ours to call."
 oe_s37.2.a: "March in person"
 oe_s37.2.a.tt: "−60 gold, manpower −3 months of growth.\nTribal Revolt ends after 6 months. The border pressure +25 of a march that governs them also ends after 6 months."
 oe_s37.2.b: "Call on Umur's Turks"
 oe_s37.2.b.tt: "−25 gold (paid to Aydin under the alliance).\nTribal Revolt ends after 3 months. The border pressure +25 of a march that governs them also ends after 3 months.\nThe Turks carry villagers off: these locations get Villagers Carried Off (5 years): population growth −0.5%, unrest +10%. A theme that governs them: loyalty −5.\nCountries whose main culture is Albanian: opinion of us −25 (10 years)."
 oe_s37.2.c: "Negotiate with the tribes"
 oe_s37.2.c.tt: "−40 gold (gifts, and the old privileges confirmed again).\nTribal Revolt ends only after 12 months. The border pressure +25 of a march that governs them also ends after 12 months."
 oe_s37.3.t: "An Opening in Epirus"
 oe_s37.3.d1: "In 1335 John II Orsini of Epirus died suddenly, possibly poisoned by Anna, the despot's wife. Anna became regent for the young Nikephoros II, the despot's son. The empire had already taken Ioannina. The sources say that after dealing with the Albanians the emperor demanded the full surrender of Epirus; Anna tried to bargain but accepted in the end, and Theodore Synadenos was made governor.\n\nNow the fighting in Albania is over. Epirus is still our subject, and Arta is not yet in the emperor's hands. To bring Epirus under direct rule, launch the expedition Pacify Epirus."
 oe_s37.3.d: "In 1335 John II Orsini of Epirus died suddenly, possibly poisoned by Anna, the despot's wife. Anna became regent for the young Nikephoros II, the despot's son. The empire had already taken Ioannina. The sources say that after dealing with the Albanians the emperor demanded the full surrender of Epirus; Anna tried to bargain but accepted in the end, and Theodore Synadenos was made governor.\n\nNow Epirus is still our subject, and Arta is not yet in the emperor's hands. To bring Epirus under direct rule, launch the expedition Pacify Epirus."
 oe_s37.3.a: "Plan the western campaign"
 oe_s37.3.a.tt: "(A reminder only; nothing happens.) Pacify Epirus is launched from the expeditions screen: after 1 January 1338, at peace, with at least 10 political influence, and a leader from the crown or the nobles estate. It can be launched only once."
 oe_s37.5.t: "The Universal Judges on Trial"
 oe_s37.5.d: "In 1329 Andronikos III replaced the old court of twelve with four 'universal judges of the Romans' (katholikoi kritai), at least one of them a bishop. The first four were Bishop Joseph of Apros, the archdeacon Gregory Kleidas, Glabas and Nicholas Matarangos. Three of them were later convicted of taking bribes.\n\nNow the case against three of the universal judges has been proven and lies before the emperor. The judges the capital sends to the themes are watching how the court will decide."
 oe_s37.5.a: "Punish them hard"
 oe_s37.5.a.tt: "Legitimacy +10.\nNobles satisfaction −10%."
 oe_s37.5.b: "Deal with them leniently"
 oe_s37.5.b.tt: "Legitimacy −5.\nNobles satisfaction +5%.\nWe get Lenient Judges (5 years): tax income efficiency −2.5%."
 oe_s37.6.t: "The Release of Martino Zaccaria"
 oe_s37.6.d: "Martino Zaccaria, a Genoese, had been lord of Chios. When Andronikos III recovered Chios in the autumn of 1329, Martino was defeated and taken prisoner, and was held in Constantinople from then on. The sources say that in 1337 the emperor let Martino go after the Pope and King Philip VI of France pleaded for the prisoner.\n\nNow envoys of the Pope and of the King of France have come again to plead for Martino. The Genoese of Galata are waiting for the news as well."
 oe_s37.6.a: "Release Martino"
 oe_s37.6.a.tt: "The Papal States' opinion of us +20 (10 years).\nFrance's opinion of us +20 (10 years)."
 oe_s37.6.b: "Keep Martino prisoner"
 oe_s37.6.b.tt: "Genoa's opinion of us −20 (10 years).\nThe Genoese of Galata modifier, if we have it, stays as it is."
 oe_s37.9.t: "1337 start events: the choice takes effect"
