 oe_chgu_dec_summon_transoxiana_amirs.title:0 "Summon the Transoxiana and Syr Darya Amirs"
 oe_chgu_dec_summon_transoxiana_amirs.desc:0 "Dispatch golden paizas from Almaliq to summon the amirs of Fergana, Otrar-Chach, Samarkand, and the Tarim oases. Spending royal silver calms amir liberty desire by #G -15#!, raises Chagatai Authority by #G +10#!, and delivers winter stipends to cash-strapped amirates once every #Y 5#! years."
 oe_chgu_dec_summon_transoxiana_amirs.a:0 "Convene the seventeen amirs under Almaliq's banner"
 oe_chgu_dec_integrate_fergana_otrar.title:0 "Integrate the Fergana-Otrar Corridor"
 oe_chgu_dec_integrate_fergana_otrar.desc:0 "With stability, prestige, and direct or subject control over Andijan and Chach, reorganize the Fergana Ulus and Otrar-Chach Ulus from autonomous Chagatai Amirates into standard annexable vassals, unlocking direct chancery integration along the wealthy Syr Darya and Tian Shan silk corridor."
 oe_chgu_dec_integrate_fergana_otrar.a:0 "Subordinate Fergana and Otrar-Chach into annexable vassals"
 oe_chgu_dec_proclaim_moghulistan_revival.title:0 "Proclaim the Moghulistan Revival"
 oe_chgu_dec_proclaim_moghulistan_revival.desc:0 "Whether after the 1347 East-West Split or in the mid-fourteenth century, rally the eastern clans of Almaliq, Yangibaliq, Kashgar, and Qocho beneath a renewed Chagatai steppe banner. Grants #G +20#! Horde Unity (if a steppe horde), calms Dughlat, Qocho, and Beshbalik-Emil liberty desire, and empowers our armies for #Y 35#! years."
 oe_chgu_dec_proclaim_moghulistan_revival.a:0 "Raise the Eastern Chagatai banner across the Tian Shan"
 STATIC_MODIFIER_NAME_oe_chgu_mod_ulus_frontier_garrison:0 "Chagatai Ulus Frontier Stores"
 STATIC_MODIFIER_DESC_oe_chgu_mod_ulus_frontier_garrison:0 "Dedicated winter fodder depots, oasis granaries, and pastoral logistics keep this landed Chagatai ulus supplied across mountain passes and steppe winters."
 STATIC_MODIFIER_NAME_oe_chgu_mod_west_amir_confed:0 "West Chagatai Amir Confederation"
 STATIC_MODIFIER_DESC_oe_chgu_mod_west_amir_confed:0 "Freed from Almaliq's eastern court, the fourteen western amirs draw upon Transoxianan oasis revenues and Turko-Mongol cavalry retinues to contend for mastery between the Syr and Amu Darya."
 STATIC_MODIFIER_NAME_oe_chgu_mod_qazaghan_hegemony:0 "Amir Qazaghan's Western Supremacy"
 STATIC_MODIFIER_DESC_oe_chgu_mod_qazaghan_hegemony:0 "Having toppled Qazan Khan and rallied the Qara'unas and Transoxianan amirs, Amir Qazaghan presides as first among equals over the loose federation of Western Chagatai."
 STATIC_MODIFIER_NAME_oe_chgu_mod_east_moghul_wing:0 "Loyal Eastern Moghul Wing"
 STATIC_MODIFIER_DESC_oe_chgu_mod_east_moghul_wing:0 "Bound by shared Tian Shan pastures and steppe covenants, the eastern wings of Dughlat, Qocho, and Beshbalik-Emil anchor the Moghulistan khanate's frontiers."
 STATIC_MODIFIER_NAME_oe_chgu_mod_moghulistan_khanate:0 "Eastern Chagatai — Moghulistan"
 STATIC_MODIFIER_DESC_oe_chgu_mod_moghulistan_khanate:0 "Though Transoxiana has broken loose, the eastern khanate preserves the unbroken Chagatai royal lineage across Zhetysu, Dzungaria, and the Tarim Basin."
 STATIC_MODIFIER_NAME_oe_chgu_mod_dec_amir_summons:0 "Transoxiana & Syr Darya Amir Summons"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dec_amir_summons:0 "Oaths renewed by the amirs of Fergana, Otrar-Chach, Samarkand, and the Tarim steady Almaliq's overlordship across all seventeen uluses."
 STATIC_MODIFIER_NAME_oe_chgu_mod_dec_fergana_otrar_corridor:0 "Integrated Fergana-Otrar Silk Corridor"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dec_fergana_otrar_corridor:0 "Direct chancery integration along Andijan, Chach, and Otrar fuses the Syr Darya granaries and Tian Shan caravan passes into Almaliq's fiscal heartland."
 STATIC_MODIFIER_NAME_oe_chgu_mod_dec_moghulistan_revival:0 "Revival of Moghulistan"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dec_moghulistan_revival:0 "Reinvigorated by the eastern clans of Almaliq, Beshbalik-Emil, Kashgar, and Qocho, the Eastern Chagatai banner rides forth with renewed discipline and steppe unity."
 STATIC_MODIFIER_NAME_oe_chgu_mod_fergana_silk_tax:0 "Fergana Silk-Road Charter"
 STATIC_MODIFIER_DESC_oe_chgu_mod_fergana_silk_tax:0 "Balanced caravan tariffs across Andijan, Akhsikath, and Osh encourage Bukharan and Kashgar merchants to stream through the Fergana passes."
 STATIC_MODIFIER_NAME_oe_chgu_mod_fergana_tribute:0 "Heavy Fergana Royal Tribute"
 STATIC_MODIFIER_DESC_oe_chgu_mod_fergana_tribute:0 "Extraordinary silver assessments levied on Fergana's fertile orchards swell the royal coffers at the price of growing valley resentment."
 STATIC_MODIFIER_NAME_oe_chgu_mod_otrar_border_watch:0 "Otrar & Chach Frontier Watch"
 STATIC_MODIFIER_DESC_oe_chgu_mod_otrar_border_watch:0 "Mounted patrols and fortified oasis watchtowers from Otrar to Turkestan and Chach deter White Horde raids across the lower Syr Darya."
 STATIC_MODIFIER_NAME_oe_chgu_mod_syr_darya_truce:0 "Syr Darya Steppe Pasture Accord"
 STATIC_MODIFIER_DESC_oe_chgu_mod_syr_darya_truce:0 "Demarcated winter grazing rights between Otrar and Sighnaq calm border feuds and reopen caravan lanes linking Sarai to Transoxiana."
 STATIC_MODIFIER_NAME_oe_chgu_mod_beshbalik_marches:0 "Beshbalik-Emil Steppe Marches"
 STATIC_MODIFIER_DESC_oe_chgu_mod_beshbalik_marches:0 "Disciplined steppe tumens stationed along Yangibaliq, Bortala, and the Emil River shield Dzungaria and the Ili heartland from eastern incursions."
 STATIC_MODIFIER_NAME_oe_chgu_mod_dzungaria_caravans:0 "Tian Shan Northern Caravan Diplomacy"
 STATIC_MODIFIER_DESC_oe_chgu_mod_dzungaria_caravans:0 "Regular embassies through Yangibaliq, Urumqi, and Qocho revitalize trade with Gansu and the Great Yuan frontier posts."
 STATIC_MODIFIER_NAME_oe_chgu_mod_qazaghan_crushed:0 "Qazaghan's Revolt Broken"
 STATIC_MODIFIER_DESC_oe_chgu_mod_qazaghan_crushed:0 "By striking down Amir Qazaghan's coalition before Transoxiana could secede, Almaliq preserves the unity of all seventeen Chagatai uluses."
 STATIC_MODIFIER_NAME_oe_chgu_mod_west_council_pact:0 "Council of the Fourteen Western Amirs"
 STATIC_MODIFIER_DESC_oe_chgu_mod_west_council_pact:0 "Shared arbitration among the fourteen Transoxianan amirates tempers internecine feuds and lets oasis cities like Samarkand, Chach, and Andijan thrive."
 STATIC_MODIFIER_NAME_oe_chgu_mod_west_iron_emir:0 "Iron Amirate of Transoxiana"
 STATIC_MODIFIER_DESC_oe_chgu_mod_west_iron_emir:0 "Rejecting weak confederation compromises, the ruling amir drills relentless cavalry hosts to forge a single sovereign empire over Transoxiana."
 STATIC_MODIFIER_NAME_oe_chgu_mod_tughlugh_islam:0 "Tughlugh Timur's Islamic Banner"
 STATIC_MODIFIER_DESC_oe_chgu_mod_tughlugh_islam:0 "The conversion of Almaliq, Beshbalik-Emil, and Dughlat unites steppe tribes and Tarim oases in zealous solidarity under the Crescent and Yassa."
 STATIC_MODIFIER_NAME_oe_chgu_mod_tianshan_pluralism:0 "Tian Shan Multi-Faith Covenant"
 STATIC_MODIFIER_DESC_oe_chgu_mod_tianshan_pluralism:0 "Upholding Genghisid religious liberty keeps Tengri nomads, Qocho Buddhists, Nestorian scribes, and oasis merchants loyal to the eastern court."
 STATIC_MODIFIER_NAME_oe_chgu_mod_moghul_west_campaign:0 "Tughlugh Timur's Western Expedition"
 STATIC_MODIFIER_DESC_oe_chgu_mod_moghul_west_campaign:0 "Fresh Moghul cavalry columns surge past Otrar and Fergana to reclaim the rebellious Transoxianan amirates for the House of Chagatai."
 STATIC_MODIFIER_NAME_oe_chgu_mod_moghul_home_bastion:0 "Fortress of Zhetysu and Dzungaria"
 STATIC_MODIFIER_DESC_oe_chgu_mod_moghul_home_bastion:0 "Rather than squandering riders across the Oxus, the khan fortifies Almaliq, Yangibaliq, and Kashgar into an impregnable mountain-steppe citadel."
 STATIC_MODIFIER_NAME_oe_chgu_mod_chg_centralization_triumph:0 "Triumph of the Unified Chagatai Chancery"
 STATIC_MODIFIER_DESC_oe_chgu_mod_chg_centralization_triumph:0 "With Ili, Fergana, Otrar-Chach, and Beshbalik answering one undivided seal, the House of Chagatai rises above feudal fragmentation as a premier Silk Road empire."
 STATIC_MODIFIER_NAME_oe_chgu_mod_chg_steppe_supremacy:0 "Eternal Cavalry Khaganate of Chagatai"
 STATIC_MODIFIER_DESC_oe_chgu_mod_chg_steppe_supremacy:0 "Forged from unified eastern and western tumens, the Chagatai military machine commands the central Eurasian corridor from the Pamirs to the Altai."
 oe_chgu.1.title:0 "Silk-Road Tolls of the Fergana Valley"
 oe_chgu.1.desc:0 "Caravans bearing Bukharan silk, Badakhshan lapis, and Kashgar jade wind constantly through the mountain gates of Andijan, Akhsikath, and Osh. The newly empowered Fergana Ulus petitions Almaliq for a fair transit-tax charter to fund caravanserais, while hardline courtiers urge the Khan to squeeze extraordinary silver tribute from the valley's lush orchards."
 oe_chgu.1.a:0 "Grant the Fergana Ulus a fair Silk-Road tax charter"
 oe_chgu.1.b:0 "Demand heavy royal silver tribute from Andijan and Akhsikath"
 oe_chgu.2.title:0 "Border Clash on the Syr Darya: Otrar and the White Horde"
 oe_chgu.2.desc:0 "Along the reed marshes between Otrar, Turkestan, and Sighnaq, mounted scouts of the Left Wing White Horde have clashed repeatedly with patrols of our Otrar-Chach Ulus over winter grazing meadows and caravan fords. Chach's commanders ask for royal reinforcements to fortify the river towns, while steppe envoys suggest a demarcated grazing truce to keep northern commerce flowing."
 oe_chgu.2.a:0 "Reinforce the Otrar and Chach tumens along the Syr Darya"
 oe_chgu.2.b:0 "Negotiate a Syr Darya pasture truce with the northern steppes"
 oe_chgu.3.title:0 "Beshbalik-Emil and the Dzungarian Frontier"
 oe_chgu.3.desc:0 "North of the snowy Tian Shan spine, the Beshbalik-Emil Ulus guards the wind-swept corridors linking Yangibaliq, Urumqi, and the Emil River to the Altai pastures and the Great Yuan frontier posts of Gansu. Noyans at Yangibaliq warn of restless Oirat and Ögedeid herdsmen pressing westward, whereas Qocho traders plead for open diplomatic embassies along the northern Silk Road."
 oe_chgu.3.a:0 "Fortify the Beshbalik-Emil steppe marches against eastern raids"
 oe_chgu.3.b:0 "Open caravan embassies through Yangibaliq and Qocho to the east"
 oe_chgu.4.title:0 "1347: Amir Qazaghan's Coup and the Great East-West Split"
 oe_chgu.4.desc:0 "The simmering rift between the nomadic eastern court of Almaliq and the settled Turko-Mongol amirs of Transoxiana has erupted into open civil war. Amir Qazaghan of the Qara'unas has rallied fourteen western amirates—stretching from Samarkand, Bukhara, and Balkh to Andijan and Otrar—against royal centralization, while only the three eastern wings of Dughlat, Qocho, and Beshbalik-Emil hold faith with the Khan."
 oe_chgu.4.a:0 "The Khanate Fractures: Fourteen Western Amirs Break Free, Three Eastern Wings Hold Moghulistan"
 oe_chgu.4.b:0 "March West and Crush Qazaghan's Coalition at All Costs!"
 oe_chgu.5.title:0 "Federation of the Fourteen Western Amirs"
 oe_chgu.5.desc:0 "With Almaliq's writ shattered west of the Syr Darya, fourteen proud amirates—from Qara'unas, Yasa'uri, and Barlas to Fergana and Otrar-Chach—now share the rich oasis heartland of Transoxiana. Nominal puppet khans sit beneath the sword of Amir Qazaghan, yet every clan chief must decide whether to honor a collective Transoxianan council or sharpen cavalry blades for sole mastery over Samarkand."
 oe_chgu.5.a:0 "Uphold the Council of the Fourteen Amirs and protect oasis trade"
 oe_chgu.5.b:0 "Forge an iron cavalry host to bid for sole mastery of Transoxiana"
 oe_chgu.6.title:0 "Tughlugh Timur and the Faith of Moghulistan"
 oe_chgu.6.desc:0 "Across Zhetysu, Dzungaria, and the Tarim rim, young Tughlugh Timur Khan—backed by the Dughlat emirs of Kashgar—stands at a historic crossroads of faith and legitimacy. Embracing Sunni Islam promises to bind the nomadic banners of Almaliq and Beshbalik-Emil tightly to the Muslim oases of Kashgar and Transoxiana, while upholding ancient Genghisid pluralism preserves harmony with Qocho's Buddhists and eastern steppe nomads."
 oe_chgu.6.a:0 "Embrace Sunni Islam across Almaliq, Beshbalik-Emil, and Dughlat"
 oe_chgu.6.b:0 "Preserve the ancient Genghisid multi-faith covenant along the Tian Shan"
 oe_chgu.7.title:0 "Tughlugh Timur's Western Campaign into Transoxiana"
 oe_chgu.7.desc:0 "Following the assassination of Amir Qazaghan, the fourteen western amirates have plunged into bitter feuding from Chach and Fergana to Samarkand and Balkh. From the Ili pastures and Beshbalik-Emil, the Eastern Chagatai host stands poised to cross the Syr Darya and reunite the entire ancestral Ulus by the sword—or to stay east and transform Zhetysu and Dzungaria into an unassailable stronghold."
 oe_chgu.7.a:0 "Ride west across Otrar and Fergana to reclaim Transoxiana!"
 oe_chgu.7.b:0 "Consolidate the Zhetysu, Emil, and Tarim strongholds first"
 oe_chgu.8.title:0 "Triumph of the Centralized Chagatai Ulus"
 oe_chgu.8.desc:0 "Against every tide of fourteenth-century steppe fragmentation, the banner of Almaliq once more commands the great corridor from Yangibaliq and the Ili Valley through Fergana and Otrar-Chach to the rich cities of Transoxiana. Elders, scribes, and tumen commanders await the Khan's final decree to crown this triumph as either a Silk Road administrative empire or an invincible cavalry khaganate."
 oe_chgu.8.a:0 "Enshrine the Unified Chagatai Silk-Road Chancery"
 oe_chgu.8.b:0 "Crown the Eternal Cavalry Khaganate of Chagatai"
