l_english:
 oe_rights_city_of_worlds_desire: "City of the World’s Desire"
 oe_rights_city_of_worlds_desire_desc: "The ashes of disaster have cooled, and the bells of the straits ring for the Empire once more. Merchants, scholars and craftsmen bring their wealth and skill through the gates of Constantinople. Available only here after the Phoenix disaster has ended."
 oe_rights_metropolis: "Metropolis"
 oe_rights_metropolis_desc: "Ordinary municipal statutes no longer suffice for the imperial capital. Reorganizing its districts, food provisions and civic occupations will allow a vast metropolis to flourish. Available only in Constantinople after the Phoenix disaster has ended."
 OE_CITY_PHOENIX_ENDED_TT: "The Phoenix disaster has ended"
 OE_WORKS_EGYPT_OPEN: "View imperial engineering projects in Egypt"
 OE_WORKS_EGYPT_FLAVOR: "The rise and fall of the Nile nourishes the fields and determines the bread of a distant capital. Restore embankments, survey the fields and rebuild granaries. Every action requires direct Byzantine ownership of all conquerable locations in the Egypt region."
 OE_WORKS_EGYPT_PROGRESS: "Canal projects: #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_works_egypt_canals_used')|0] / 3#!"
 OE_WORKS_EGYPT_OWNED_TT: "Byzantium directly owns all conquerable locations in the Egypt region; subject ownership does not count"
 OE_WORKS_EGYPT_CANAL_COOLDOWN_TT: "Five years have passed since the last canal project"
 OE_WORKS_EGYPT_THREE_CANALS_TT: "Fewer than three canal projects have been commissioned"
 oe_works_egypt_plan: "Plan Egyptian Grain Expansion"
 oe_works_egypt_plan_desc: "Spend #Y 5,000 gold#! to add one permanent layer of #Y Egyptian Grain Expansion#! to every Egyptian agricultural location. Once only.\n\nEligible locations are owned rural settlements producing a food good, fiber crops or sugar beside the Nile or its delta branches in Lower and Upper Egypt, excluding Alexandria province."
 oe_works_aswan: "Restore the Aswan Dam"
 oe_works_aswan_desc: "After the grain plan, spend #Y 10,000 gold#! to begin a #Y five-year#! project. On completion, build the Aswan Dam at Syene (Aswan), if still owned, and add one layer of #Y Egyptian Grain Expansion#! to all owned Egyptian agricultural locations. Once only."
 oe_works_egypt_supply: "Provision Constantinople"
 oe_works_egypt_supply_desc: "After the grain plan, spend #Y 2,000 gold#! to unlock the #Y Egyptian Grain Supply#! slider on the Imperial Pillars finance page. Plan shipments using the selected share of Alexandria market’s positive monthly food surplus. Collect actual food from owned provincial granaries in Lower and Upper Egypt and deliver it to Constantinople’s provincial granary, paying #Y 1 gold per 100 food#! actually received. Once only."
 oe_works_egypt_canal: "Restore Irrigation Canals"
 oe_works_egypt_canal_desc: "After the grain plan, select an eligible agricultural location in Lower Egypt and spend #Y 5,000 gold#! to unlock and start one level of #Y Egyptian Canal#!, with no additional construction startup charge. Uses the native infrastructure construction time.\n\nEach site may be selected once. #Y Five-year#! cooldown, at most #Y three#! projects. Commissioning the third adds another layer of #Y Egyptian Grain Expansion#! to every eligible agricultural location."
 oe_works_egypt_smallholders: "Protect Smallholders"
 oe_works_egypt_smallholders_desc: "After the grain plan, with the #Y Land to the Tiller#! privilege, give every Egyptian agricultural location one layer of #Y Egyptian Grain Expansion#! and permanent #Y Protecting Egyptian Smallholders#!.\n\nOnce only, mutually exclusive with Cooperation with Landowners. No additional cost."
 oe_works_egypt_landowners: "Cooperate with Great Landowners"
 oe_works_egypt_landowners_desc: "After the grain plan, with the #Y Hierarchical Order#! privilege, give every Egyptian agricultural location one layer of #Y Egyptian Grain Expansion#! and permanent #Y Cooperation with Egyptian Landowners#!.\n\nOnce only, mutually exclusive with Protect Smallholders. No additional cost."
 oe_works_egypt_canal_choose: "Choose a rural agricultural site in Lower Egypt"
 oe_works_egypt_canal_none: "@trigger_no! No eligible owned agricultural location in Lower Egypt remains available for a canal project."
 OE_EGYPT_ADD_FOOD_LAYER_TT: "Every owned Egyptian agricultural location gains one permanent layer of Egyptian Grain Expansion: local food output #G +10%#!, raw material size #G +10%#! and raw material output #G +10%#!."
 OE_EGYPT_SMALLHOLDERS_TT: "All owned Egyptian agricultural locations permanently gain Protecting Egyptian Smallholders: peasant power #G +100%#!, noble power #R −50%#!, crown power #R −10%#! and raw material output #G +10%#!."
 OE_EGYPT_LANDOWNERS_TT: "All owned Egyptian agricultural locations permanently gain Cooperation with Egyptian Landowners: noble power #G +33%#! and crown power #G +100%#!."
 OE_EGYPT_SUPPLY_UNLOCK_TT: "Unlock the Egyptian Grain Supply slider on the Imperial Pillars finance page."
 oe_egypt_food_expansion: "Egyptian Grain Expansion"
 oe_egypt_food_expansion_desc: "Restored waterways, surveyed fields and dependable grain transport turn the Nile’s bounty into fuller harvests. Related project and policy milestones each add a layer."
 oe_egypt_protect_smallholders: "Protecting Egyptian Smallholders"
 oe_egypt_protect_smallholders_desc: "The Empire secures smallholders’ fields and water rights against encroachment by great estates."
 oe_egypt_cooperate_landowners: "Cooperation with Egyptian Landowners"
 oe_egypt_cooperate_landowners_desc: "Great landowners undertake irrigation, storage and grain collection under imperial contracts and supervision."
 oe_aswan_dam: "Aswan Dam"
 oe_aswan_dam_desc: "Embankments, sluices and a guarded river passage at Syene. Employs 3,000 laborers; local garrison +1,000, fort defense +33%, proximity efficiency +50%."
 oe_egypt_canal: "Egyptian Canal"
 oe_egypt_canal_desc: "An irrigation and transport channel carrying Nile water into the fields. Employs 1,000 laborers; local food output +50%, raw material size +50%, market access +10%."
 oe_aswan_dam_maintenance: "Aswan Embankment Administration"
 oe_egypt_canal_maintenance: "Egyptian Canal Administration"
 oe_egypt_works.1.t: "Restoration of the Aswan Dam Begins"
 oe_egypt_works.1.d: "From the delta to Syene, surveyors’ ropes and ancient water gauges have returned to imperial ledgers. Engineers will repair embankments and sluices, masons strengthen the foundations, and laborers clear the accumulated silt. The local garrison is to protect the workers and passing grain boats.\n\nThe undertaking will require five years. With water guided more reliably into the fields, Egypt’s abundance need no longer depend upon a single timely flood."
 oe_egypt_works.1.a: "Let the river nourish the Empire."
 oe_egypt_works.2.t: "The Aswan Dam Is Complete"
 oe_egypt_works.2.d: "Five years of surveying, masonry and dredging have reached their conclusion. Syene has sent the final accounts: the banks are strengthened, the sluices restored and the river watch provided with permanent quarters.\n\nSo long as the riverbank remains in imperial hands, the new works can serve their purpose. Farmers prepare to draw water according to the revised schedules, while grain merchants anticipate a fuller harvest. A southern embankment has brought Egypt’s fields closer to the granaries of Constantinople."
 oe_egypt_works.2.a: "May the harvest follow river and sea."
 oe_pillars_egypt_food_budget: "Egyptian Grain Supply"
 oe_pillars_egypt_food_budget_desc: "0% ships nothing; 100% requests Alexandria market’s entire positive monthly food surplus, scaling linearly. Food is collected proportionally from owned provincial granaries in Lower and Upper Egypt and delivered to Constantinople’s province. Pay 1 gold per 100 food actually received. Shipments are capped by donor stores, destination granary space and affordable freight; they do not directly change market food reserves. Byzantium must own both cities, and Alexandria must remain a market center. Settles once per month."
 OE_EGYPT_SUPPLY_PREVIEW: "Egyptian provincial stores: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_source_food')|2] food\nCapital provincial granary: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_destination_food')|2] / [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_destination_capacity')|2]\nEstimated shipment: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_amount')|2] food/month\nEstimated freight: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_supply_cost')|2]@gold!/month"
 OE_EGYPT_SUPPLY_HINT: "Last actual delivery: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_last_shipment_display')|2] food for [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_egypt_last_bill_display')|2]@gold!.\nPay 1 gold per 100 food actually added to the provincial granary."
