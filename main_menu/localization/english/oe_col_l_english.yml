 oe_col.1.t: "Who Shall Come?"
 oe_col.1.d1: "#F In 747 Constantine V moved great numbers of Paulicians from the east to guard the Thracian frontier; in 970 John I Tzimiskes settled more of them at Philippopolis. After 1122 John II settled Pecheneg captives as soldier-farmers and moved Serbs to the country around Nicomedia. In the 1240s John III took in Cumans driven west by the Mongols and gave them land in return for service.#!\n\n[SCOPE.sLocation('oe_col_loc').GetName], in the jurisdiction of [SCOPE.sCountry('oe_col_theme').GetName], has too few people for its land. [GetCountry('BYZ').Custom('OeColWhy')] The local officials ask: shall we bring people from elsewhere in the empire, or settle foreign soldier families?"
 oe_col.1.d2: "#F In 747 Constantine V moved great numbers of Paulicians from the east to guard the Thracian frontier; in 970 John I Tzimiskes settled more of them at Philippopolis. After 1122 John II settled Pecheneg captives as soldier-farmers and moved Serbs to the country around Nicomedia. In the 1240s John III took in Cumans driven west by the Mongols and gave them land in return for service.#!\n\n[SCOPE.sLocation('oe_col_loc').GetName] has too few people for its land. [GetCountry('BYZ').Custom('OeColWhy')] The local officials ask: shall we bring people from elsewhere in the empire, or settle foreign soldier families?"
 oe_col.1.a: "Move people from a crowded province"
 oe_col.1.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! gold ([GetCountry('BYZ').Custom('OeColInWhy')])\nAbout #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_total').GetValue|1]#! thousand people leave [SCOPE.sProvince('oe_col_src').GetName] for [SCOPE.sLocation('oe_col_loc').GetName] over #Y 24#! months: what one loses, the other gains\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_homesteads')] for #Y 10#! years\nTakes one of the moves for #Y 24#! months; no more settlers for [SCOPE.sLocation('oe_col_loc').GetName] for #Y 20#! years\nWithin #Y 1#! to #Y 2#! years after the move, a #R 40%#! chance of a quarrel between new and old settlers"
 oe_col.1.b: "Settle foreign soldier families ([GetCountry('BYZ').Custom('OeColGroup')])"
 oe_col.1.b.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#! gold ([GetCountry('BYZ').Custom('OeColOutWhy')])\n[SCOPE.sLocation('oe_col_loc').GetName] gains #G +1.3#! thousand [GetCountry('BYZ').Custom('OeColGroup')]: #Y 1#! thousand peasants and #Y 0.3#! thousand soldiers, who keep their own tongue and faith (the Armenians are Miaphysite, the others Orthodox)\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_foreign_settlers')] for #Y 20#! years\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_newcomers')] for #Y 5#! years\nTakes one of the moves for #Y 12#! months; no more settlers for [SCOPE.sLocation('oe_col_loc').GetName] for #Y 20#! years\nWithin #Y 1#! to #Y 2#! years after they settle, a #R 60%#! chance of a quarrel between new and old settlers"
 oe_col.1.c: "Let it be"
 oe_col.1.c.tt: "#G 1#! [oe_tu_authority|e] is returned\nAnother place may be resettled at once (no cooldown)"
 oe_col.2.t: "New Settlers and Old"
 oe_col.2.d1: "The old settlers of [SCOPE.sLocation('oe_col_loc').GetName] and [GetCountry('BYZ').Custom('OeColDspWho')] are at odds over fields and water. The old families say the land was always theirs and only lay fallow for a few years; the newcomers hold deeds from the officials. After some fighting the case has gone to the governor of [SCOPE.sCountry('oe_col_theme').GetName], and on to the capital."
 oe_col.2.d2: "The old settlers of [SCOPE.sLocation('oe_col_loc').GetName] and [GetCountry('BYZ').Custom('OeColDspWho')] are at odds over fields and water. The old families say the land was always theirs and only lay fallow for a few years; the newcomers hold deeds from the officials. After some fighting the case has gone to the capital."
 oe_col.2.a: "Uphold the newcomers' deeds"
 oe_col.2.a.tt: "[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_newcomers')] lasts #Y 3#! years longer (or is added for #Y 3#! years)\nLoyalty of the theme that holds it #R −3#! (none if no theme holds it)"
 oe_col.2.b: "Follow the old settlers' custom"
 oe_col.2.b.tt: "[SCOPE.sLocation('oe_col_loc').GetName] loses [ShowModifier('oe_col_homesteads')], [ShowModifier('oe_col_foreign_settlers')] and [ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_settlers_curbed')] for #Y 10#! years\nLoyalty of the theme that holds it #G +3#! (none if no theme holds it)"
 oe_col.2.c: "Send a judge to survey the bounds"
 oe_col.2.c.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! gold ([GetCountry('BYZ').Custom('OeColInWhy')])\n[SCOPE.sLocation('oe_col_loc').GetName] loses [ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_surveyed')] for #Y 10#! years"
 oe_col.3.t: "The Soldiers' Sons"
 oe_col.3.d1: "The sons of the foreign soldier families settled at [SCOPE.sLocation('oe_col_loc').GetName] have come of age. Fewer of them speak the old tongue, and more have married local wives. The young men ask whether they are to serve in arms as their fathers did, or to farm and pay taxes like their neighbours. The governor of [SCOPE.sCountry('oe_col_theme').GetName] asks the court to decide."
 oe_col.3.d2: "The sons of the foreign soldier families settled at [SCOPE.sLocation('oe_col_loc').GetName] have come of age. Fewer of them speak the old tongue, and more have married local wives. The young men ask whether they are to serve in arms as their fathers did, or to farm and pay taxes like their neighbours. The local officials ask the court to decide."
 oe_col.3.a: "Enter them on the muster rolls"
 oe_col.3.a.tt: "The theme that holds [SCOPE.sLocation('oe_col_loc').GetName]: manpower #G +1#!, loyalty #G +3#! (if no theme holds it, the empire's manpower #G +1#! instead)"
 oe_col.3.b: "Let them become Romans"
 oe_col.3.b.tt: "[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_assimilating')] for #Y 20#! years"
 oe_col.3.c: "Leave things as they are"
 oe_col.3.c.tt: "Nothing changes"
 oe_col.10.t: "Where Shall the Refugees Go?"
 oe_col.10.d1: "#F In 1337 Nicomedia, starved of food, surrendered, and its people were allowed to leave for Constantinople.#!\n\nThe refugees from Nicomedia have lived in [SCOPE.sLocation('oe_col_city').GetName] for a year, and the price of bread keeps rising. Some propose to give them the empty land around [SCOPE.sLocation('oe_col_loc').GetName]; others would put the young men into the garrison and the fleet."
 oe_col.10.d2: "#F In 1337 Nicomedia, starved of food, surrendered, and its people were allowed to leave for Constantinople.#!\n\nThe refugees from Nicomedia have lived in [SCOPE.sLocation('oe_col_city').GetName] for a year, and the price of bread keeps rising. The empire has no empty land to give them just now; some would put the young men into the garrison and the fleet, others ask the Church to feed them."
 oe_col.10.a: "Give them empty land to farm"
 oe_col.10.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! gold ([GetCountry('BYZ').Custom('OeColInWhy')])\nAbout #Y 1.8#! thousand people move from the province of [SCOPE.sLocation('oe_col_city').GetName] to [SCOPE.sLocation('oe_col_loc').GetName] over #Y 12#! months\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_homesteads')] for #Y 10#! years\n[SCOPE.sLocation('oe_col_city').GetName]: [ShowModifier('oe_col_refugees_moved')] for #Y 1#! year, making up for part of the refugees' bread\nNo more settlers for [SCOPE.sLocation('oe_col_loc').GetName] for #Y 20#! years; takes one of the moves for #Y 12#! months if one is free"
 oe_col.10.b: "Enlist them in the garrison and the fleet"
 oe_col.10.b.tt: "We gain [ShowModifier('oe_col_refugee_levy')] for #Y 5#! years"
 oe_col.10.c: "Leave them to the Church's charity"
 oe_col.10.c.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_half')|0]#! gold (half a month of tax and trade income)\nClergy satisfaction #G +5%#!"
 oe_col.11.t: "The Albanian Herdsmen of Thessaly"
 oe_col.11.desc: "#F John VI Kantakouzenos tells that about 1332 the Albanian tribes in the mountains of Thessaly, the Bua, the Malakasioi and the Mazaraki, made a pact with the emperor: they would serve the empire in arms and pay tribute in return for leave to graze the plain.#!\n\nChieftains from the hills of Thessaly have sent word again. They ask to bring their people and flocks down to the plain around [SCOPE.sLocation('oe_col_a1').GetName] and [SCOPE.sLocation('oe_col_a2').GetName], and offer service and tribute as before."
 oe_col.11.a: "Let them graze the plain and enrol them as soldiers"
 oe_col.11.a.tt: "[SCOPE.sLocation('oe_col_a1').GetName] and [SCOPE.sLocation('oe_col_a2').GetName] each gain #G +1.3#! thousand Albanians: #Y 1#! thousand peasants and #Y 0.3#! thousand soldiers, Orthodox, keeping their own tongue\nBoth places: [ShowModifier('oe_col_foreign_settlers')] for #Y 20#! years and [ShowModifier('oe_col_newcomers')] for #Y 5#! years\nThe empire gains [ShowModifier('oe_col_albanian_service')] for #Y 20#! years\nBoth places: no more settlers for #Y 20#! years; after #Y 10#! years the soldiers' sons come of age and may ask for a ruling"
 oe_col.11.b: "Take their tribute, give no land"
 oe_col.11.b.tt: "We gain #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m2')|0]#! gold (two months of tax and trade income)"
 oe_col.11.c: "Keep them in the hills"
 oe_col.11.c.tt: "Every place of ours in the province of Thessaly: [ShowModifier('oe_col_hill_raids')] for #Y 5#! years"
 oe_col.12.t: "The Albanians of the Peloponnese"
 oe_col.12.d1: "#F In 1394–1395, it is told, some ten thousand Albanians came before the Isthmus of Corinth and asked the despot of the Morea for leave to settle. They went first to Arcadia and later further south; the rulers of the Morea used them to fill empty land and as soldiers.#!\n\n[SCOPE.sCountry('oe_col_theme').GetGovernment.GetRuler.GetName], who governs [SCOPE.sCountry('oe_col_theme').GetName], writes: a great many Albanians have come to the Isthmus again with their families and herds, and ask to settle around [SCOPE.sLocation('oe_col_a1').GetName]. Whether to let them in is for the emperor to decide."
 oe_col.12.d2: "#F In 1394–1395, it is told, some ten thousand Albanians came before the Isthmus of Corinth and asked the despot of the Morea for leave to settle. They went first to Arcadia and later further south; the rulers of the Morea used them to fill empty land and as soldiers.#!\n\nThe governor of the Morea writes: a great many Albanians have come to the Isthmus again with their families and herds, and ask to settle around [SCOPE.sLocation('oe_col_a1').GetName]. Whether to let them in is for the emperor to decide."
 oe_col.12.a: "Let them in: land for service"
 oe_col.12.a.tt: "Up to #Y 3#! of our places in the province of Arcadia (the least populous first, starting with [SCOPE.sLocation('oe_col_a1').GetName]) each gain #G +1.3#! thousand Albanians: #Y 1#! thousand peasants and #Y 0.3#! thousand soldiers, Orthodox, keeping their own tongue\nEach of them: [ShowModifier('oe_col_foreign_settlers')] for #Y 20#! years and [ShowModifier('oe_col_newcomers')] for #Y 5#! years\nThe empire gains [ShowModifier('oe_col_stratiotai')] for #Y 20#! years\nLoyalty of the theme that holds Mistra #G +5#! (none if no theme holds it)\nThose places: no more settlers for #Y 20#! years; after #Y 10#! years the soldiers' sons come of age and may ask for a ruling"
 oe_col.12.b: "Admit only some of them"
 oe_col.12.b.tt: "[SCOPE.sLocation('oe_col_a1').GetName] gains #G +1.3#! thousand Albanians: #Y 1#! thousand peasants and #Y 0.3#! thousand soldiers, Orthodox, keeping their own tongue\n[SCOPE.sLocation('oe_col_a1').GetName]: [ShowModifier('oe_col_foreign_settlers')] for #Y 20#! years and [ShowModifier('oe_col_newcomers')] for #Y 5#! years\nThe empire gains [ShowModifier('oe_col_stratiotai')] for #Y 20#! years\nLoyalty of the theme that holds Mistra #G +5#! (none if no theme holds it)\n[SCOPE.sLocation('oe_col_a1').GetName]: no more settlers for #Y 20#! years; after #Y 10#! years the soldiers' sons come of age and may ask for a ruling"
 oe_col.12.c: "Turn them back at the Isthmus"
 oe_col.12.c.tt: "Prestige #G +2#!"
 oe_col.14.t: "Fugitives from the Steppe"
 oe_col.14.desc: "#F In the 1240s Cumans driven west by the Mongols came over to the empire with their families, for land and pay; early in the fourteenth century Alans came with their families too.#!\n\nThe steppe knows no peace, and another band of [GetCountry('BYZ').Custom('OeColSteppe')] riders has crossed the Danube with their families and asks to settle within the empire. The local officials propose [SCOPE.sLocation('oe_col_loc').GetName]."
 oe_col.14.a: "Take them in and settle them"
 oe_col.14.a.tt: "[SCOPE.sLocation('oe_col_loc').GetName] gains #G +1.3#! thousand [GetCountry('BYZ').Custom('OeColSteppe')] settlers: #Y 1#! thousand peasants and #Y 0.3#! thousand soldiers, Orthodox, keeping their own tongue\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_foreign_settlers')] for #Y 20#! years and [ShowModifier('oe_col_newcomers')] for #Y 5#! years\nThe empire gains [ShowModifier('oe_col_steppe_riders')] for #Y 10#! years\nThe Golden Horde's opinion of us #R −10#! for #Y 5#! years (none if the Golden Horde is gone)\n[SCOPE.sLocation('oe_col_loc').GetName]: no more settlers for #Y 20#! years; after #Y 10#! years the soldiers' sons come of age and may ask for a ruling"
 oe_col.14.b: "Only hire them to fight"
 oe_col.14.b.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#! gold (one month of tax and trade income)\nThe empire gains [ShowModifier('oe_col_steppe_riders')] for #Y 5#! years"
 oe_col.14.c: "Send them back to the steppe"
 oe_col.14.c.tt: "The Golden Horde's opinion of us #G +10#! for #Y 5#! years (none if the Golden Horde is gone)"
 oe_col.20.t: "The Empire's Merchant Ships"
 oe_col.20.d1: "#F At the end of the thirteenth century the historian Pachymeres complained that the carrying of grain from the Black Sea had long since passed into Genoese hands. In 1348 John VI lowered the customs and borrowed money to build ships, so that the empire need not depend on Galata for its grain and its shipping.#!\n\nThe Greek merchants of the City have petitioned together for leave to set up houses in the ports of the Black Sea under the emperor's charter. There are men ready to go to Tana, Caffa, Trebizond, Sinope, Varna and Kilia."
 oe_col.20.d2: "#F At the end of the thirteenth century the historian Pachymeres complained that the carrying of grain from the Black Sea had long since passed into Genoese hands.#!\n\nThe Greek merchants of the City have petitioned together for leave to set up houses in the ports of the Black Sea under the emperor's charter. There are men ready to go to Tana, Caffa, Trebizond, Sinope, Varna and Kilia."
 oe_col.20.a: "Grant the charter; the treasury stands behind them"
 oe_col.20.a.tt: "Opens the action 'Open a Trading Post' (fiscal edicts). See [Concept('oe_tu_emporion','trading posts')|e]\nCosts #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#! gold (one month of tax and trade income)\nThe first post opened within #Y 24#! months costs no gold (saving #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_post')|0]#!)"
 oe_col.20.b: "Grant it, but let the merchants find the money"
 oe_col.20.b.tt: "Opens the action 'Open a Trading Post' (fiscal edicts). See [Concept('oe_tu_emporion','trading posts')|e]"
 oe_col.21.t: "The Answer About the Trading Post"
 oe_col.21.d1: "[SCOPE.sCountry('oe_col_host').GetName] has agreed: Roman merchants may set up a house at [SCOPE.sLocation('oe_col_site').GetName], and a warehouse and a quay by the water are marked out for them."
 oe_col.21.d2: "The men of [SCOPE.sCountry('oe_col_host').GetName] say that the quays of [SCOPE.sLocation('oe_col_site').GetName] are Genoese quays. The Romans may come, but at a price: a sum of money, or more favour for the Genoese at Constantinople."
 oe_col.21.d3: "[SCOPE.sCountry('oe_col_host').GetName] has refused: no Roman house at [SCOPE.sLocation('oe_col_site').GetName]."
 oe_col.21.a: "Seal the agreement and open"
 oe_col.21.a.tt: "A trading post opens at [SCOPE.sLocation('oe_col_site').GetName] (#G +1#! point): the #bold #color_yellow Roman Emporion#!#! is built and the empire's merchants gain weight in the market there\n[SCOPE.sCountry('oe_col_host').GetName]: opinion of us #G +10#! for #Y 10#! years\nIf Caffa or Tana is not on Genoa's side: Genoa's opinion of us #R −10#! for #Y 5#! years\nUpkeep every January: #R half a month#! of tax and trade income a point"
 oe_col.21.b: "Pay the price they ask"
 oe_col.21.b.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_price')|0]#! gold (two months of tax and trade income), paid to [SCOPE.sCountry('oe_col_host').GetName]\nA trading post opens at [SCOPE.sLocation('oe_col_site').GetName] (#G +1#! point): the #bold #color_yellow Roman Emporion#!#! is built and the empire's merchants gain weight in the market there\n[SCOPE.sCountry('oe_col_host').GetName]: opinion of us #G +10#! for #Y 10#! years\nIf Caffa or Tana is not on Genoa's side: Genoa's opinion of us #R −10#! for #Y 5#! years\nUpkeep every January: #R half a month#! of tax and trade income a point"
 oe_col.21.c: "Trade a tier of privileges for their consent"
 oe_col.21.c.tt: "Genoa's [Concept('oe_tu_privilege','privileges')|e] at Constantinople rise one tier\nA trading post opens at [SCOPE.sLocation('oe_col_site').GetName] (#G +1#! point): the #bold #color_yellow Roman Emporion#!#! is built and the empire's merchants gain weight in the market there\n[SCOPE.sCountry('oe_col_host').GetName]: opinion of us #G +10#! for #Y 10#! years\nIf Caffa or Tana is not on Genoa's side: Genoa's opinion of us #R −10#! for #Y 5#! years\nUpkeep every January: #R half a month#! of tax and trade income a point"
 oe_col.21.d: "Give it up"
 oe_col.21.d.tt: "Half the gold paid comes back (#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_req_refund')|0]#!)\nNo post at [SCOPE.sLocation('oe_col_site').GetName] for #Y 60#! months"
 oe_col.21.e: "So be it"
 oe_col.21.e.tt: "Half the gold paid comes back (#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_req_refund')|0]#!)\nNo post at [SCOPE.sLocation('oe_col_site').GetName] for #Y 60#! months"
 oe_col.22.t: "A Trading Post Lost"
 oe_col.22.d1: "[SCOPE.sCountry('oe_col_host').GetName] is at war with the empire. The Roman house at [SCOPE.sLocation('oe_col_site').GetName] has been sealed and every bale in its warehouse seized: #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#! gold is lost."
 oe_col.22.d2: "Tana has been laid waste, and none of the foreign houses in the town was spared; the Roman house is gone with the rest."
 oe_col.22.d3: "The treasury cannot pay the upkeep of the trading posts. The house at [SCOPE.sLocation('oe_col_site').GetName], the last to open, has had to close, and its merchants are on their way home."
 oe_col.22.d4: "Genoese Gazaria is no more, and the Roman house at [SCOPE.sLocation('oe_col_site').GetName] ends with it."
 oe_col.22.d5: "[SCOPE.sLocation('oe_col_site').GetName] has a new master, who does not honour the Romans' charter. The house has been taken away."
 oe_col.22.a: "Claim damages from them"
 oe_col.22.a.tt: "[SCOPE.sCountry('oe_col_host').GetName]: opinion of us #R −10#! for #Y 5#! years\nA #G 40%#! chance that they pay #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#! gold (one month of income) back in #Y 3#! months"
 oe_col.22.b: "Bear the loss"
 oe_col.22.b.tt: "Nothing more comes of it"
 oe_col.22.c: "Look for another port"
 oe_col.22.c.tt: "The next post opened within #Y 24#! months costs no gold"
 oe_col.23.t: "A Thriving Post"
 oe_col.23.desc: "The Roman house at [SCOPE.sLocation('oe_col_site').GetName] has stood for more than ten years and trade grows from year to year; the Greek merchants there fill a street of their own. They ask for a wall around it and a judge sent by the emperor, which the men of [SCOPE.sCountry('oe_col_host').GetName] do not much like. Others say the Patriarchate should rather found a parish there."
 oe_col.23.a: "Wall the quarter and send a judge"
 oe_col.23.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_fort')|0]#! gold (four months of tax and trade income)\nThe post at [SCOPE.sLocation('oe_col_site').GetName] becomes a chartered quarter (#G 2#! points); its upkeep is paid for #Y 2#! points from now on\n[SCOPE.sLocation('oe_col_site').GetName]: [ShowModifier('oe_col_emporion_fort')] (for as long as it is a chartered quarter)\nIf [SCOPE.sCountry('oe_col_host').GetName] is on Genoa's or Venice's side: opinion of us #R −5#! for #Y 5#! years"
 oe_col.23.b: "Leave things as they are"
 oe_col.23.b.tt: "[SCOPE.sCountry('oe_col_host').GetName]: opinion of us #G +10#! for #Y 10#! years\nThe question is not raised again for this post for #Y 10#! years"
 oe_col.23.c: "Let the Patriarchate found a parish there"
 oe_col.23.c.tt: "Clergy satisfaction #G +5%#!\nThe Patriarchate's standing #G +2#! (none before the church framework has begun)\nThe question is not raised again for this post for #Y 10#! years"
 oe_col.24.t: "The Romans Ask for a Trading Post"
 oe_col.24.desc: "The emperor at Constantinople has sent to us, asking leave for Roman merchants to set up a house at [SCOPE.sLocation('oe_col_site').GetName]. They will pay the dues and keep the customs of the place, the envoy says, and ask only for a warehouse and a quay by the water."
 oe_col.24.a: "Let them come"
 oe_col.24.a.tt: "The Romans will open a house at [SCOPE.sLocation('oe_col_site').GetName] (a foreign building, theirs)\nOur opinion of the Romans rises by #Y 10#! for #Y 10#! years"
 oe_col.24.b: "Yes, at a price"
 oe_col.24.b.tt: "The Romans may pay a sum (to us), offer privileges at Constantinople instead, or give up"
 oe_col.24.c: "Refuse"
 oe_col.24.c.tt: "The Romans may not open a house at [SCOPE.sLocation('oe_col_site').GetName]"
 oe_col.30.t: "A New Colonia"
 oe_col.30.d1: "#F Under the Republic and the first emperors the Romans planted colonies on newly won land, settling citizens and discharged veterans there, with offices and allotments on the Roman pattern. The Deeds of the Divine Augustus put the veterans settled in the new colonies of that age at some hundred and twenty thousand.#!\n\n[SCOPE.sLocation('oe_col_seat').GetName] has become a colonia of the empire. No theme governed that country, so a new one, [SCOPE.sCountry('oe_col_theme').GetName], has been set up at [SCOPE.sLocation('oe_col_seat').GetName]; [GetCountry('BYZ').Custom('OeColC30Status')]. [GetCountry('BYZ').Custom('OeColC30Cmp')]The officials ask how the new city is to be filled first."
 oe_col.30.d2: "#F Under the Republic and the first emperors the Romans planted colonies on newly won land, settling citizens and discharged veterans there, with offices and allotments on the Roman pattern. The Deeds of the Divine Augustus put the veterans settled in the new colonies of that age at some hundred and twenty thousand.#!\n\n[SCOPE.sLocation('oe_col_seat').GetName] has become a colonia of the empire and is placed under the neighbouring [SCOPE.sCountry('oe_col_theme').GetName]. [GetCountry('BYZ').Custom('OeColC30Cmp')]The officials ask how the new city is to be filled first."
 oe_col.30.a: "Settle veterans"
 oe_col.30.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#! gold (one month of tax and trade income)\n[SCOPE.sLocation('oe_col_seat').GetName]: [ShowModifier('oe_col_veterans')] for #Y 20#! years\nLoyalty of [SCOPE.sCountry('oe_col_theme').GetName] #G +5#!"
 oe_col.30.b: "Make it a harbour city"
 oe_col.30.b.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m1')|0]#! gold (one month of tax and trade income)\n[SCOPE.sCountry('oe_col_theme').GetName] turns to the sea (the naval choice of the theme's course)\nThe course cannot change again for #Y 5#! years"
 oe_col.30.c: "Bring in settlers"
 oe_col.30.c.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_m2')|0]#! gold (two months of tax and trade income)\nPeople move from [SCOPE.sProvince('oe_col_src').GetName] to [SCOPE.sLocation('oe_col_seat').GetName] over #Y 24#! months (the internal move of [Concept('oe_tu_resettle','resettlement')|e]; the action's cooldown does not apply)\n[SCOPE.sLocation('oe_col_seat').GetName]: [ShowModifier('oe_col_homesteads')] for #Y 10#! years\nTakes one of the moves for #Y 24#! months; no more settlers for [SCOPE.sLocation('oe_col_seat').GetName] for #Y 20#! years"
 oe_col.30.d: "Leave it as it is"
 oe_col.30.d.tt: "The new city is governed by its theme as it is; nothing is spent"
