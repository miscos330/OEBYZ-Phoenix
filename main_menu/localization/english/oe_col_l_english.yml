 oe_col_resettle: "Resettle the Land"
 oe_col_resettle_desc: "Bring people to reclaimed or deserted old Roman land: move them from a crowded province of the empire, or settle foreign soldier families there. See [Concept('oe_tu_resettle','resettlement')|e].\nCosts #R 2#! [oe_tu_authority|e]; the next choice costs gold: #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! for an internal move, #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#! for foreign soldier families. The first sparse place of the chosen province is the target: reclaimed land first, then the least populous.\nAt most #Y 2#! moves at a time; at least #Y 24#! months between two resettlements; the same place once in #Y 20#! years.\nNow: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_sparse_n')|0]#! sparse places; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_slots_used')|0]#! moves under way. [GetCountry('BYZ').Custom('OeColG1Now')]; [GetCountry('BYZ').Custom('OeColG2Now')]; [GetCountry('BYZ').Custom('OeColG3Now')]."
 oe_col_resettle_select: "Choose a province (highlighted ones have sparse land)"
 oe_col_resettle_none: "@trigger_no!The empire has no sparse land to resettle."
 oe_col_resettle_tt: "Costs #R 2#! [oe_tu_authority|e]. Resettles the first sparse place of the chosen province (the next choice decides who comes)."
 oe_col_resettle_card: "Bring people to reclaimed or deserted old Roman land: an internal move, or foreign soldier families."
 OE_COL_WHY_RECLAIMED: "It has only just been won back from the enemy; of the old families many are dead or fled, and #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_pop').GetValue|1]#! thousand people are left."
 OE_COL_WHY_RAIDED: "It was raided in recent years and the villages have not recovered; #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_pop').GetValue|1]#! thousand people are left."
 OE_COL_WHY_FAITH: "Most of its #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_pop').GetValue|1]#! thousand people are not Orthodox; the old Roman families are long gone and many fields lie untilled."
 OE_COL_WHY_THIN: "Only #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_pop').GetValue|1]#! thousand people are left, and wide fields lie empty."
 OE_COL_DSP_FOREIGN: "the foreign soldier families who settled there"
 OE_COL_DSP_INTERNAL: "the families moved there from elsewhere"
 game_concept_oe_tu_resettle: "Resettlement"
 game_concept_oe_tu_resettle_desc: "#F In 747 and 970 emperors moved whole communities of Paulicians to guard Thrace; in the twelfth century John II settled Pecheneg captives and Serbs as soldier-farmers; in the 1240s John III traded land for the service of the Cumans.#!\n\nThe empire can bring people to reclaimed or deserted old Roman land (the action 'Resettle the Land').\n#bold Sparse land#!: old Roman land the empire itself owns and controls (the historical regions, the former provinces of the outer circle, reclaimed land waiting to be settled) with fewer than #Y 6#! thousand people, or still recovering from raids, or newly reclaimed, or mostly not Orthodox; never Constantinople itself, nor a place resettled in the last #Y 20#! years.\n#bold Internal moves#!: people leave the empire's most populous other province over #Y 24#! months; what one loses the other gains. Costs one month of tax and trade income.\n#bold Foreign soldier families#!: Albanians, Cumans or Alans, or Armenians, #Y 1.3#! thousand new people each time, bringing manpower and defence and some unrest in the first years. Costs three months of income. Which people can come depends on the empire's lands and on the state of the steppe.\nAt most #Y 2#! moves at a time, at least #Y 24#! months between two resettlements. A year or two after a move, newcomers and old settlers may quarrel over the land.\nThe sources tell of tens of thousands moved at once; the game scales the numbers down.\n#bold Who does what#!: 'Settle Soldier Families' gives a [Concept('oe_tu_march','march')|e] or [Concept('oe_tu_exarchate','exarchate')|e] on the army course a manpower modifier; 'Settling a Reclaimed Province' sets the first five years of reclaimed land; resettlement really adds and moves people in a place."
 OE_COL_EMPTY: ""
 OE_COL_CHR_NIC_1: "The refugees from Nicomedia were given empty land. "
 OE_COL_CHR_NIC_2: "The refugees from Nicomedia joined the garrison and the fleet. "
 OE_COL_CHR_NIC_3: "The refugees from Nicomedia were left to the Church's charity. "
 OE_COL_CHR_NIC_0: "The refugees from Nicomedia were never resettled. "
 STATIC_MODIFIER_NAME_oe_col_homesteads: "Resettled Homesteads"
 STATIC_MODIFIER_DESC_oe_col_homesteads: "Families moved here from elsewhere in the empire were given empty fields and entered on the rolls, with some of their dues remitted for a few years."
 STATIC_MODIFIER_NAME_oe_col_foreign_settlers: "Foreign Soldier Families"
 STATIC_MODIFIER_DESC_oe_col_foreign_settlers: "Foreign families hold land here on condition that they serve the empire in arms."
 STATIC_MODIFIER_NAME_oe_col_newcomers: "Newcomers"
 STATIC_MODIFIER_DESC_oe_col_newcomers: "The newcomers do not yet know the land, and they quarrel with the old settlers."
 STATIC_MODIFIER_NAME_oe_col_settlers_curbed: "Settlers Kept Down"
 STATIC_MODIFIER_DESC_oe_col_settlers_curbed: "The officials took the old settlers' side; the newcomers were left with the poorer fields."
 STATIC_MODIFIER_NAME_oe_col_surveyed: "Bounds Surveyed"
 STATIC_MODIFIER_DESC_oe_col_surveyed: "A judge sent from the capital measured the fields again, set boundary stones and entered everything in the land register."
 STATIC_MODIFIER_NAME_oe_col_refugees_moved: "Refugees Moved On"
 STATIC_MODIFIER_DESC_oe_col_refugees_moved: "Some of the refugees have gone to farm in the country, and the city's grain goes further."
 STATIC_MODIFIER_NAME_oe_col_refugee_levy: "Refugees Under Arms"
 STATIC_MODIFIER_DESC_oe_col_refugee_levy: "Refugees who lost their homes now serve in the garrison of the City and in the fleet."
 oe_col.1.t: "Who Shall Come?"
 oe_col.1.d1: "#F In 747 Constantine V moved great numbers of Paulicians from the east to guard the Thracian frontier; in 970 John I Tzimiskes settled more of them at Philippopolis. After 1122 John II settled Pecheneg captives as soldier-farmers and moved Serbs to the country around Nicomedia. In the 1240s John III took in Cumans driven west by the Mongols and gave them land in return for service.#!\n\n[SCOPE.sLocation('oe_col_loc').GetName], in the jurisdiction of [SCOPE.sCountry('oe_col_theme').GetName], has too few people for its land. [GetCountry('BYZ').Custom('OeColWhy')] The local officials ask: shall we bring people from elsewhere in the empire, or settle foreign soldier families?"
 oe_col.1.d2: "#F In 747 Constantine V moved great numbers of Paulicians from the east to guard the Thracian frontier; in 970 John I Tzimiskes settled more of them at Philippopolis. After 1122 John II settled Pecheneg captives as soldier-farmers and moved Serbs to the country around Nicomedia. In the 1240s John III took in Cumans driven west by the Mongols and gave them land in return for service.#!\n\n[SCOPE.sLocation('oe_col_loc').GetName] has too few people for its land. [GetCountry('BYZ').Custom('OeColWhy')] The local officials ask: shall we bring people from elsewhere in the empire, or settle foreign soldier families?"
 oe_col.1.a: "Move people from a crowded province"
 oe_col.1.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! gold (one month of tax and trade income)\nAbout #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_t_total').GetValue|1]#! thousand people leave [SCOPE.sProvince('oe_col_src').GetName] for [SCOPE.sLocation('oe_col_loc').GetName] over #Y 24#! months: what one loses, the other gains\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_homesteads')] for #Y 10#! years\nTakes one of the moves for #Y 24#! months; no more settlers for [SCOPE.sLocation('oe_col_loc').GetName] for #Y 20#! years\nWithin #Y 1#! to #Y 2#! years after the move, a #R 40%#! chance of a quarrel between new and old settlers"
 oe_col.1.b: "Settle foreign soldier families ([GetCountry('BYZ').Custom('OeColGroup')])"
 oe_col.1.b.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#! gold (three months of tax and trade income)\n[SCOPE.sLocation('oe_col_loc').GetName] gains #G +1.3#! thousand [GetCountry('BYZ').Custom('OeColGroup')]: #Y 1#! thousand peasants and #Y 0.3#! thousand soldiers, who keep their own tongue and faith (the Armenians are Miaphysite, the others Orthodox)\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_foreign_settlers')] for #Y 20#! years\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_newcomers')] for #Y 5#! years\nTakes one of the moves for #Y 12#! months; no more settlers for [SCOPE.sLocation('oe_col_loc').GetName] for #Y 20#! years\nWithin #Y 1#! to #Y 2#! years after they settle, a #R 60%#! chance of a quarrel between new and old settlers"
 oe_col.1.c: "Let it be"
 oe_col.1.c.tt: "#G 1#! [oe_tu_authority|e] is returned\nAnother place may be resettled at once (no cooldown)"
 oe_col.2.t: "New Settlers and Old"
 oe_col.2.d1: "The old settlers of [SCOPE.sLocation('oe_col_loc').GetName] and [GetCountry('BYZ').Custom('OeColDspWho')] are at odds over fields and water. The old families say the land was always theirs and only lay fallow for a few years; the newcomers hold deeds from the officials. After some fighting the case has gone to the governor of [SCOPE.sCountry('oe_col_theme').GetName], and on to the capital."
 oe_col.2.d2: "The old settlers of [SCOPE.sLocation('oe_col_loc').GetName] and [GetCountry('BYZ').Custom('OeColDspWho')] are at odds over fields and water. The old families say the land was always theirs and only lay fallow for a few years; the newcomers hold deeds from the officials. After some fighting the case has gone to the capital."
 oe_col.2.a: "Uphold the newcomers' deeds"
 oe_col.2.a.tt: "[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_newcomers')] lasts #Y 3#! years longer (or is added for #Y 3#! years)\nLoyalty of the theme that holds it #R −3#! (none if no theme holds it)"
 oe_col.2.b: "Follow the old settlers' custom"
 oe_col.2.b.tt: "[SCOPE.sLocation('oe_col_loc').GetName] loses [ShowModifier('oe_col_homesteads')], [ShowModifier('oe_col_foreign_settlers')] and [ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_settlers_curbed')] for #Y 10#! years\nLoyalty of the theme that holds it #G +3#! (none if no theme holds it)"
 oe_col.2.c: "Send a judge to survey the bounds"
 oe_col.2.c.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! gold (one month of tax and trade income)\n[SCOPE.sLocation('oe_col_loc').GetName] loses [ShowModifier('oe_col_newcomers')]\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_surveyed')] for #Y 10#! years"
 oe_col.10.t: "Where Shall the Refugees Go?"
 oe_col.10.d1: "#F In 1337 Nicomedia, starved of food, surrendered, and its people were allowed to leave for Constantinople.#!\n\nThe refugees from Nicomedia have lived in [SCOPE.sLocation('oe_col_city').GetName] for a year, and the price of bread keeps rising. Some propose to give them the empty land around [SCOPE.sLocation('oe_col_loc').GetName]; others would put the young men into the garrison and the fleet."
 oe_col.10.d2: "#F In 1337 Nicomedia, starved of food, surrendered, and its people were allowed to leave for Constantinople.#!\n\nThe refugees from Nicomedia have lived in [SCOPE.sLocation('oe_col_city').GetName] for a year, and the price of bread keeps rising. The empire has no empty land to give them just now; some would put the young men into the garrison and the fleet, others ask the Church to feed them."
 oe_col.10.a: "Give them empty land to farm"
 oe_col.10.a.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! gold (one month of tax and trade income)\nAbout #Y 1.8#! thousand people move from the province of [SCOPE.sLocation('oe_col_city').GetName] to [SCOPE.sLocation('oe_col_loc').GetName] over #Y 12#! months\n[SCOPE.sLocation('oe_col_loc').GetName]: [ShowModifier('oe_col_homesteads')] for #Y 10#! years\n[SCOPE.sLocation('oe_col_city').GetName]: [ShowModifier('oe_col_refugees_moved')] for #Y 1#! year, making up for part of the refugees' bread\nNo more settlers for [SCOPE.sLocation('oe_col_loc').GetName] for #Y 20#! years; takes one of the moves for #Y 12#! months if one is free"
 oe_col.10.b: "Enlist them in the garrison and the fleet"
 oe_col.10.b.tt: "We gain [ShowModifier('oe_col_refugee_levy')] for #Y 5#! years"
 oe_col.10.c: "Leave them to the Church's charity"
 oe_col.10.c.tt: "Costs #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_half')|0]#! gold (half a month of tax and trade income)\nClergy satisfaction #G +5%#!"
