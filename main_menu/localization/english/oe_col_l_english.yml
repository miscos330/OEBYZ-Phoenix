 oe_col_open_post_desc: "Ask for a [Concept('oe_tu_emporion','trading post')|e] of the empire in a port of the Black Sea or the Levant. We ask; the master of the place answers: yes, a price, or no.\nCosts #R 2#! [oe_tu_authority|e] and #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_post')|0]#! gold (three months of tax and trade income); half the gold comes back if the host refuses or we give up. Upkeep every January: #R half a month#! of tax and trade income a point. At most #Y 6#! in foreign ports.\nNow: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_posts_n').GetValue|0]#! points of posts, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_grain_posts').GetValue|0]#! of them in grain ports; this year's upkeep about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_upkeep')|0]#! gold.[GetCountry('BYZ').Custom('OeColVoucherNow')][GetCountry('BYZ').Custom('OeColGrainNow')]\nTana (grain port): [GetCountry('BYZ').Custom('OeColSt_tana')]\nCaffa (grain port): [GetCountry('BYZ').Custom('OeColSt_kaffa')]\nTrebizond: [GetCountry('BYZ').Custom('OeColSt_trebizond')]\nSinope: [GetCountry('BYZ').Custom('OeColSt_sinop')]\nVarna (grain port): [GetCountry('BYZ').Custom('OeColSt_varna')]\nKilia (grain port): [GetCountry('BYZ').Custom('OeColSt_chilia')]\nFamagusta: [GetCountry('BYZ').Custom('OeColSt_famagusta')]\nAlexandria: [GetCountry('BYZ').Custom('OeColSt_alexandria')]\nBeirut: [GetCountry('BYZ').Custom('OeColSt_beirut')]"
 oe_col_open_post_select: "Choose a site (highlighted ones are open to us)"
