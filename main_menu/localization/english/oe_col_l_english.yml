 oe_col_resettle_desc: "Bring people to reclaimed or deserted old Roman land: move them from a crowded province of the empire, or settle foreign soldier families there. See [Concept('oe_tu_resettle','resettlement')|e].\nCosts #R 2#! [oe_tu_authority|e]; the next choice costs gold: #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_in')|0]#! for an internal move, #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_out')|0]#! for foreign soldier families. The first sparse place of the chosen province is the target: reclaimed land first, then the least populous.\nAt most #Y 2#! moves at a time; at least #Y [GetCountry('BYZ').Custom('OeColCdMonths')]#! months between two resettlements; the same place once in #Y 20#! years.\nNow: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_sparse_n')|0]#! sparse places; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_slots_used')|0]#! moves under way. [GetCountry('BYZ').Custom('OeColG1Now')]; [GetCountry('BYZ').Custom('OeColG2Now')]; [GetCountry('BYZ').Custom('OeColG3Now')].[GetCountry('BYZ').Custom('OeColDiscNow')]"
