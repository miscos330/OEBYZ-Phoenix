 oe_col_open_post_tt: "Costs #R 2#! [oe_tu_authority|e] and #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_cost_post')|0]#! gold (no gold if the treasury has promised to pay). The master of the chosen port is asked for a post and answers within #Y 2#! months."
 oe_col_open_post_card: "Ask for a trading post of the empire in a port of the Black Sea or the Levant."
 oe_col_allow_any_post: "The empire has a trading post"
 oe_col_close_post: "Close a Trading Post"
 oe_col_close_post_desc: "Withdraw a [Concept('oe_tu_emporion','trading post')|e]: the house is taken down and no more upkeep is paid for it. The master of the place: opinion of us #R −5#! (#Y 5#! years); no new post there for #Y 60#! months.\nTana (grain port): [GetCountry('BYZ').Custom('OeColSt_tana')]\nCaffa (grain port): [GetCountry('BYZ').Custom('OeColSt_kaffa')]\nTrebizond: [GetCountry('BYZ').Custom('OeColSt_trebizond')]\nSinope: [GetCountry('BYZ').Custom('OeColSt_sinop')]\nVarna (grain port): [GetCountry('BYZ').Custom('OeColSt_varna')]\nKilia (grain port): [GetCountry('BYZ').Custom('OeColSt_chilia')]\nFamagusta: [GetCountry('BYZ').Custom('OeColSt_famagusta')]\nAlexandria: [GetCountry('BYZ').Custom('OeColSt_alexandria')]\nBeirut: [GetCountry('BYZ').Custom('OeColSt_beirut')]"
 oe_col_close_post_select: "Choose the post to close"
 oe_col_close_post_none: "@trigger_no!The empire has no trading post."
 oe_col_close_post_tt: "Closes the chosen post. The master of the place: opinion of us #R −5#! (#Y 5#! years); no new post there for #Y 60#! months."
 oe_col_close_post_card: "Withdraw one of the empire's trading posts on the Black Sea."
 game_concept_oe_tu_emporion: "Trading Post"
 game_concept_oe_tu_emporion_desc: "#F At the end of the thirteenth century the historian Pachymeres complained that the carrying of grain from the Black Sea had long since passed into Genoese hands. In 1348 John VI lowered the customs and borrowed money to build ships, so that the empire need not depend on Galata for its grain and its shipping.#!\n\nThe empire can have trading posts of its own in nine ports of the Black Sea and the Levant: Tana, Caffa, Trebizond, Sinope, Varna, Kilia, Famagusta, Alexandria, Beirut (none at Alexandria for some five years after the sack of 1365; the action 'Open a Trading Post', opened by the event 'The Empire's Merchant Ships', in 1366 at the latest).\n#bold Asking and the answer#!: we ask, for #Y 2#! [oe_tu_authority|e] and three months of tax and trade income; the master of the place answers within #Y 2#! months. A better opinion of us and a shared Orthodox faith make a yes likelier; a host on Genoa's side looks at Genoa's privilege tier at Constantinople and asks a price when it is low. A refusal, or giving up, returns half the gold.\n#bold The house#!: once admitted, the empire is entered on the place's list and the #bold #color_yellow Roman Emporion#!#! is built there; a country that is not on the list cannot build one. The house gives the empire's merchants weight in that market.\n#bold Points and benefits#!: a post counts #Y 1#! point; a thriving one, walled and with a judge, becomes a chartered quarter and counts #Y 2#!; a suspended post counts nothing. #Y 1#! point: merchant power #G +3%#!, trade income #G +2%#!; #Y 2#! to #Y 3#! points: #G +5%#!, #G +4%#!; #Y 4#! points and more: #G +8%#!, #G +6%#!.\n#bold Grain ports#!: Tana, Caffa, Varna, Kilia. #Y 2#! points of posts in grain ports ease the City's grain road by one step.\n#bold Upkeep#!: #R half a month#! of income a point every January; if it cannot be paid the newest post closes. At most #Y 6#! posts in foreign ports.\n#bold Suspension#!: an embargo at Tana and Caffa, or war at Caffa, suspends the post; it reopens by itself afterwards.\n#bold Loss#!: the master of the place goes to war with the empire; the port passes to a new master hostile to us; Tana is laid waste; Gazaria falls. Some years must pass before a lost site can be asked for again.\nA port that comes to the empire's side keeps its post, which pays no more upkeep. If the empire itself holds the port and no theme governs it, the land around it becomes a Roman colonia, joined to a neighbouring theme or given a theme of its own."
 OE_COL_CHR_POSTS: "Trading posts on the Black Sea: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_posts_n').GetValue|0]#! points, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_grain_posts').GetValue|0]#! of them in grain ports. "
