 oe_ywp13_1337_zhongshu_fiscal_mod:0 "Zhongshu Sheng Emergency Fiscal Retrenchment"
 oe_ywp13_1337_zhongshu_fiscal_mod_desc:0 "During the opening decade of Zhiyuan (1337–1347), the Central Secretariat trims ceremonial tributary outlays, consolidates salt-monopoly receipts, and audits provincial garrison and court stipends to stave off immediate insolvency—at the cost of noble and merchant resentment."
 STATIC_MODIFIER_NAME_oe_ywp13_1337_zhongshu_fiscal_mod:0 "Zhongshu Sheng Emergency Fiscal Retrenchment"
 STATIC_MODIFIER_DESC_oe_ywp13_1337_zhongshu_fiscal_mod:0 "During the opening decade of Zhiyuan (1337–1347), the Central Secretariat trims ceremonial tributary outlays, consolidates salt-monopoly receipts, and audits provincial garrison and court stipends to stave off immediate insolvency—at the cost of noble and merchant resentment."
 oe_ywp13_dec_four_class_closure.title:0 "Proclaim the Four-Class & Three-Teachings Concord"
 oe_ywp13_dec_four_class_closure.desc:0 "Convene grand councillors, Confucian academicians, the Sakya Imperial Preceptor, and Daoist masters at Dadu to settle the long-simmering rift between the Four-Class hierarchy and imperial religious order. Costs #Y 120#! gold and opens the #Y Great Concord of the Four Classes and Three Teachings#! event (unlocking a long-term stability investment and religious-estate settlement)."
 oe_ywp13_dec_four_class_closure.a:0 "Convene the Great Dadu Council"
 oe_ywp13.1.t:0 "The Great Concord of the Four Classes and Three Teachings"
 oe_ywp13.1.d:0 "For decades, the Four-Class hierarchy dividing Mongols, Semu, Han, and Southerners—paired with lavish subsidies to favored monastic houses—strained the foundations of the Great Yuan. Now that the court at Dadu holds firm command over the capital, ministers present three paths to anchor lasting realm stability: repeal ethnic quotas under a Sinicized Three-Teachings concord, codify imperial legitimacy through the Tibetan Buddhist Imperial Preceptor and steppe noble oaths, or phase in gradual civil quotas without provoking an abrupt aristocratic backlash."
 oe_ywp13.1.a:0 "Proclaim the Three Teachings Concord and abolish ethnic barriers (Sinicized path)"
 oe_ywp13.1.b:0 "Elevate the Sakya Imperial Preceptor and Steppe Dharma oaths"
 oe_ywp13.1.c:0 "Phase in gradual civil quotas and local tax relief"
 oe_ywp13.2.t:0 "Echoes of the Great Edict Across the Realm"
 oe_ywp13.2.d:0 "Imperial couriers have carried the Great Dadu Edict from the northern steppe to the academies and temples of Jiangnan. Provincial prefects report calmer countryside markets, revived examination halls, and a tangible return of trust between the throne and the realm's diverse communities."
 oe_ywp13.2.a:0 "Engrave the edict in bronze and stone across every circuit"
 oe_ywp13.2.b:0 "Endow bilingual academies and monastic relief granaries"
 oe_ywp13.3.t:0 "The Papal Embassy of Giovanni de' Marignolli and the Heavenly Steed"
 oe_ywp13.3.d:0 "In answer to the imperial letter carried westward by the Alan chieftains of Dadu, Pope Benedict XII's Franciscan legate Giovanni de' Marignolli has reached Shangdu after traveling through Constantinople and the Golden Horde. Amid grand court ceremonial, the embassy presents a towering Western destrier—hailed by Chinese scholars as the 'Heavenly Steed of Fulin' (Constantinople). Court master Zhou Lang stands ready to paint the celebrated scroll while Grand Academician Ouyang Xuan composes its colophon."
 oe_ywp13.3.a:0 "Commission Zhou Lang's Heavenly Horse scroll and honor the envoys at Dadu"
 oe_ywp13.3.b:0 "Assign the Western warhorses to the Imperial Stud and tighten caravan passes"
 oe_ywp13.4.t:0 "Erke'un of Dadu and the Ecumenical Patriarchate on the Silk Road"
 oe_ywp13.4.d:0 "With peace restored across Great Yuan and the Roman Empire still holding the Queen of Cities on the Bosphorus, Dadu's Erke'un Christian communities and Alan guardsmen propose establishing permanent reciprocal merchant hostels with the guilds and Ecumenical Patriarchate of Constantinople. Caravans bearing Jingdezhen porcelain, Hangzhou silk, and Roman glasswork could once more unite the twin empires of the Eurasian Silk Road."
 oe_ywp13.4.a:0 "Charter the reciprocal Dadu-Constantinople merchant hostels"
 oe_ywp13.4.b:0 "Invite Roman astronomers and silk factors to the Qintianjian Observatory"
