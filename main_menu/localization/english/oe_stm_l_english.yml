# NEW 2026-11-23 v16.5 Module 16.5-A: Steam Age, Early Industrial Revolution, Tier-9 Steam Railway & Nova Elysia Act III (oe_stm_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v165_steam_industry.py; edit the generator, not this file.
 oe_steam_engines: "Steam Machinery & Engines"
 oe_steam_engines_desc: "Precision-cast iron cylinders, riveted boilers, and rotary steam engines forged in coal-fired ironworks. They power mechanized textile manufactories and early steam railway terminuses across the industrializing world."
 oe_stm_railway_depot_construction: "Steam Railway Terminus Construction"
 oe_stm_inaugural_depot_cost_reason: "Imperial Trunk Railway Program Charter"
 oe_stm_steam_ironworks: "Coal-Fired Steam Ironworks"
 oe_stm_steam_ironworks_desc: "An industrial foundry and boiler works operating from 1740 onward that smelts coal and iron into commercial Steam Machinery & Engines while boosting local coal, iron, and steel productivity."
 oe_stm_mechanized_textile_mill: "Steam Textile Manufactory"
 oe_stm_mechanized_textile_mill_desc: "A steam-driven spinning and power-loom factory available from 1755 onward that combines coal, raw cotton or wool, and Steam Machinery & Engines to mass-produce cloth and fine drapery."
 oe_stm_early_steam_railway_depot: "Early Steam Railway Terminus"
 oe_stm_early_steam_railway_depot_desc: "Imperial Roads Tier 9 terminus available in cities and megalopolises from 1775 onward. Requires heavy steel, coal, and steam machinery investment, establishing a regional proximity source, superior market access, and army supply hub that amplifies surrounding Imperial Roads."
 oe_stm_pm_atmospheric_ironworks: "Atmospheric & Condensing Engines"
 oe_stm_pm_atmospheric_ironworks_desc: "Casts iron cylinders, brass valves, and riveted boilers over coal-fired hearths to manufacture commercial steam engines."
 oe_stm_pm_coke_high_pressure_engines: "Coke-Smelted High-Pressure Engines"
 oe_stm_pm_coke_high_pressure_engines_desc: "Uses coke-smelted precision steel and heavy boring mills to turn out compact high-pressure rotary engines and locomotive boilers."
 oe_stm_pm_steam_cotton_cloth: "Steam-Driven Cotton Power Looms"
 oe_stm_pm_steam_cotton_cloth_desc: "Line shafts driven by stationary steam engines spin raw cotton into uniform bolts of cloth at industrial scale."
 oe_stm_pm_steam_wool_cloth: "Steam-Driven Woollen Carding & Looms"
 oe_stm_pm_steam_wool_cloth_desc: "Mechanized carding engines and steam looms transform fleece into durable broadcloth and military uniforms year-round."
 oe_stm_pm_steam_fine_drapery: "Steam Jacquard & Fine Broadcloth"
 oe_stm_pm_steam_fine_drapery_desc: "Combines rotary steam power with punch-card looms and chemical dye vats to weave export-grade fine cloth."
 oe_stm_pm_railway_depot_maint: "Steam Locomotive & Iron Rail Maintenance"
 oe_stm_pm_railway_depot_maint_desc: "Supplies coal fuel, replacement steel rails, and boiler parts to keep trunk locomotives and depot switches running on schedule."
 oe_stm_dec_patent_board.title: "Charter the Imperial Steam Engine Patent Board"
 oe_stm_dec_patent_board.desc: "Establish a sovereign patent registry protecting cylinder, condenser, and power-loom designs. Unlocks Steam Ironworks and Steam Textile Manufactories immediately and grants the #G Imperial Steam Engine Patent Board#! modifier for 40 years. Costs #Y 250#! gold."
 oe_stm_dec_patent_board.a: "Issue the Imperial Steam Patent Charter"
 oe_stm_dec_railway_program.title: "Launch the Tier-9 Imperial Steam Railway Program"
 oe_stm_dec_railway_program.desc: "Standardize iron rail gauges, slash railroad construction costs across Imperial Roads corridors, and raise an inaugural #T Tier-9 Early Steam Railway Terminus#! in your capital if it is a city or megalopolis. Costs #Y 500#! gold."
 oe_stm_dec_railway_program.a: "Authorize the Imperial Trunk Railway Program"
 oe_stm_dec_factory_act.title: "Proclaim the Industrial Factory Act"
 oe_stm_dec_factory_act.desc: "Enact statutory boiler safety inspections, child labor limits, and parish evening schools across industrial boroughs, lifting stability, estate satisfaction, literacy, and prosperity for 40 years. Costs #Y 200#! gold."
 oe_stm_dec_factory_act.a: "Proclaim the Factory Act Across the Realm"
 STATIC_MODIFIER_NAME_oe_stm_mod_dec_patent_board: "Imperial Steam Engine Patent Board"
 STATIC_MODIFIER_DESC_oe_stm_mod_dec_patent_board: "A chartered patent commission secures mechanical blueprints, attracts master engine-wrights, and accelerates mill construction."
 STATIC_MODIFIER_NAME_oe_stm_mod_dec_railway_program: "Tier-9 Imperial Steam Railway Program"
 STATIC_MODIFIER_DESC_oe_stm_mod_dec_railway_program: "Standardized iron track gauges and steam railway terminuses extend Imperial Roads into the age of locomotive traction."
 STATIC_MODIFIER_NAME_oe_stm_mod_dec_factory_act: "The Industrial Factory Act"
 STATIC_MODIFIER_DESC_oe_stm_mod_dec_factory_act: "Statutory limits on child labor, boiler inspections, and parish mill schools temper industrial strife while raising skilled literacy."
 STATIC_MODIFIER_NAME_oe_stm_mod_atmospheric_pumps: "Crown Colliery Pumping Engines"
 STATIC_MODIFIER_DESC_oe_stm_mod_atmospheric_pumps: "Fire-engines drain deep coal and iron shafts around the clock, opening seams once drowned below the water table."
 STATIC_MODIFIER_NAME_oe_stm_mod_private_mine_patents: "Private Colliery Engine Royalties"
 STATIC_MODIFIER_DESC_oe_stm_mod_private_mine_patents: "Pit-owners license pumping cylinders on royalty terms, expanding coal extraction with minimal strain on the treasury."
 STATIC_MODIFIER_NAME_oe_stm_mod_coke_smelting: "Coke-Fired Blast Furnaces"
 STATIC_MODIFIER_DESC_oe_stm_mod_coke_smelting: "Smelting pig iron with mineral coke frees metallurgy from timber shortages and fuels massive cast-iron construction."
 STATIC_MODIFIER_NAME_oe_stm_mod_charcoal_guild_accord: "Crown Timber & Ironmaster Accord"
 STATIC_MODIFIER_DESC_oe_stm_mod_charcoal_guild_accord: "Regulated charcoal forests and gradual furnace transition keep old ironmasters loyal while preserving rural woodlands."
 STATIC_MODIFIER_NAME_oe_stm_mod_power_loom_boom: "Mechanized Spinning & Power Looms"
 STATIC_MODIFIER_DESC_oe_stm_mod_power_loom_boom: "Multi-spindle frames and steam-driven looms flood domestic and overseas depots with inexpensive woven cloth."
 STATIC_MODIFIER_NAME_oe_stm_mod_guild_transition_pact: "Handloom Guild Transition Pact"
 STATIC_MODIFIER_DESC_oe_stm_mod_guild_transition_pact: "Retraining stipends and quality hallmarks ease traditional weavers into mechanized workshops without violent upheaval."
 STATIC_MODIFIER_NAME_oe_stm_mod_watt_condenser: "Rotary Condensing Steam Engines"
 STATIC_MODIFIER_DESC_oe_stm_mod_watt_condenser: "Separate condensers cut coal consumption by two-thirds and deliver smooth rotary motion fit for every factory floor."
 STATIC_MODIFIER_NAME_oe_stm_mod_open_steam_blueprints: "Open Steam Engineering Drawings"
 STATIC_MODIFIER_DESC_oe_stm_mod_open_steam_blueprints: "Publishing cylinder tolerances and valve linkages across provincial workshops spreads steam fabrication rapidly throughout the realm."
 STATIC_MODIFIER_NAME_oe_stm_mod_coalfield_urban_boom: "Chartered Industrial Boroughs"
 STATIC_MODIFIER_DESC_oe_stm_mod_coalfield_urban_boom: "Booming pithead towns win municipal charters, drawing rural laborers into skilled burgher and mechanic trades."
 STATIC_MODIFIER_NAME_oe_stm_mod_pithead_excise: "Imperial Pithead Coal Excise"
 STATIC_MODIFIER_DESC_oe_stm_mod_pithead_excise: "Treasury collectors weigh every coal wagon leaving the shafts, filling crown coffers at the expense of working families."
 STATIC_MODIFIER_NAME_oe_stm_mod_locomotive_trials: "Steam Locomotive Rail Trials"
 STATIC_MODIFIER_DESC_oe_stm_mod_locomotive_trials: "Flanged iron wheels hauling coal trains over wrought rails prove that steam locomotion can outrun every horse team."
 STATIC_MODIFIER_NAME_oe_stm_mod_turnpike_standardization: "Macadamized Imperial Turnpikes"
 STATIC_MODIFIER_DESC_oe_stm_mod_turnpike_standardization: "Crushed-stone drainage and standardized post-houses squeeze peak reliability out of existing carriage and road corridors."
 STATIC_MODIFIER_NAME_oe_stm_mod_mill_security_order: "Frame-Breaking Statute & Dragoons"
 STATIC_MODIFIER_DESC_oe_stm_mod_mill_security_order: "Mounted patrols guard spinning mills under stern felony decrees, keeping looms running despite bitter resentments."
 STATIC_MODIFIER_NAME_oe_stm_mod_parish_artisan_relief: "Parish Artisan Relief Boards"
 STATIC_MODIFIER_DESC_oe_stm_mod_parish_artisan_relief: "Municipal grain funds and apprenticeship vouchers absorb displaced weavers, turning unrest back into orderly labor."
 STATIC_MODIFIER_NAME_oe_stm_mod_industrial_sanitation: "Municipal Brick Sewers & Waterworks"
 STATIC_MODIFIER_DESC_oe_stm_mod_industrial_sanitation: "Steam pumping stations deliver clean filtered water and flush crowded factory alleys, halting urban contagion."
 STATIC_MODIFIER_NAME_oe_stm_mod_factory_quarantine: "Emergency Mill-District Cordons"
 STATIC_MODIFIER_DESC_oe_stm_mod_factory_quarantine: "Strict sanitary cordons check the spread of cholera into court quarters, though halted shifts weigh on urban prosperity."
 STATIC_MODIFIER_NAME_oe_stm_mod_factory_hours_reform: "Statutory Mill Hours & Safety Inspectors"
 STATIC_MODIFIER_DESC_oe_stm_mod_factory_hours_reform: "Sworn inspectors enforce safe shift limits and elementary schooling for mill children, building a healthier workforce."
 STATIC_MODIFIER_NAME_oe_stm_mod_laissez_faire_mills: "Unfettered Mill-Owner Charters"
 STATIC_MODIFIER_DESC_oe_stm_mod_laissez_faire_mills: "Unrestricted double shifts drive loom output and mill-owner dividends to dizzying heights at harsh human cost."
 STATIC_MODIFIER_NAME_oe_stm_mod_steam_packet_fleet: "Imperial Steam-Packet Lines"
 STATIC_MODIFIER_DESC_oe_stm_mod_steam_packet_fleet: "Paddle-wheel mail steamers keep fixed timetables across estuaries and narrow seas regardless of contrary winds."
 STATIC_MODIFIER_NAME_oe_stm_mod_river_steamer_charters: "Private River Steamboat Syndicates"
 STATIC_MODIFIER_DESC_oe_stm_mod_river_steamer_charters: "Shallow-draft paddle boats carry coal, grain, and passengers upstream against currents that once defied sail."
 STATIC_MODIFIER_NAME_oe_stm_mod_protective_tariffs: "Protective Industrial Tariff Wall"
 STATIC_MODIFIER_DESC_oe_stm_mod_protective_tariffs: "Targeted duties shield infant domestic ironworks and textile mills from predatory foreign dumping."
 STATIC_MODIFIER_NAME_oe_stm_mod_reciprocal_free_trade: "Reciprocal Commercial Treaties"
 STATIC_MODIFIER_DESC_oe_stm_mod_reciprocal_free_trade: "Lowered customs barriers open vast continental markets to steam-manufactured exports and cheap raw inputs."
 STATIC_MODIFIER_NAME_oe_stm_mod_trunk_railway_boom: "State-Backed Trunk Railway Boom"
 STATIC_MODIFIER_DESC_oe_stm_mod_trunk_railway_boom: "Sovereign railway bonds bridge rivers and tunnels, knitting provincial capitals into a single steam-linked market."
 STATIC_MODIFIER_NAME_oe_stm_mod_prudent_rail_charters: "Prudent Railway Bourse Regulation"
 STATIC_MODIFIER_DESC_oe_stm_mod_prudent_rail_charters: "Audited prospectuses weed out speculative bubble lines, keeping national credit rock-solid through the rail boom."
 STATIC_MODIFIER_NAME_oe_stm_mod_telegraph_corridors: "Trunk Signal & Telegraph Corridors"
 STATIC_MODIFIER_DESC_oe_stm_mod_telegraph_corridors: "Optical semaphores and experimental galvanic wires relay market prices and imperial orders faster than any courier."
 STATIC_MODIFIER_NAME_oe_stm_mod_galvanic_academies: "Academy Galvanic Laboratories"
 STATIC_MODIFIER_DESC_oe_stm_mod_galvanic_academies: "Royal academies fund voltaic piles and electromagnetic coils, laying the theoretical bedrock of the coming century."
 STATIC_MODIFIER_NAME_oe_stm_mod_urban_franchise_reform: "Reformed Urban Franchise & Councils"
 STATIC_MODIFIER_DESC_oe_stm_mod_urban_franchise_reform: "Industrial cities gain formal representation, channeling artisan petitions into lawful constitutional debate."
 STATIC_MODIFIER_NAME_oe_stm_mod_estate_settlement_upheld: "Upheld Landed Estate Settlement"
 STATIC_MODIFIER_DESC_oe_stm_mod_estate_settlement_upheld: "The throne and landed peers stand firm against mass suffrage petitions, preserving traditional command of state offices."
 STATIC_MODIFIER_NAME_oe_stm_mod_great_exhibition: "Host of the Great Industrial Exhibition"
 STATIC_MODIFIER_DESC_oe_stm_mod_great_exhibition: "Envoys and engineers from every continent marvel beneath vaulted iron-and-glass halls packed with gleaming engines."
 STATIC_MODIFIER_NAME_oe_stm_mod_industrial_espionage_board: "Foreign Machinery Survey Commission"
 STATIC_MODIFIER_DESC_oe_stm_mod_industrial_espionage_board: "Discreet state engineers sketch rival looms, boring mills, and locomotive valves to replicate abroad-tested designs at home."
 STATIC_MODIFIER_NAME_oe_stm_mod_workshop_of_world: "Iron Workshop of the World"
 STATIC_MODIFIER_DESC_oe_stm_mod_workshop_of_world: "Chimneys, steam ironworks, power looms, and trunk railways proclaim an empire forged in coal, iron, and steel."
 STATIC_MODIFIER_NAME_oe_stm_mod_balanced_industrial_realm: "Stewardship of the Machine Age"
 STATIC_MODIFIER_DESC_oe_stm_mod_balanced_industrial_realm: "Civic schools, clean industrial boroughs, and regulated rail corridors unite steam-powered wealth with enduring social peace."
 STATIC_MODIFIER_NAME_oe_stm_mod_appalachian_belt: "Imperial Appalachian Mining Commission"
 STATIC_MODIFIER_DESC_oe_stm_mod_appalachian_belt: "Roman surveyors open rich bituminous coal and iron ore ridges beyond the Shenandoah, feeding Chesapeake furnaces for generations."
 STATIC_MODIFIER_NAME_oe_stm_mod_frontier_mining_leases: "Exarchate Frontier Mining Leases"
 STATIC_MODIFIER_DESC_oe_stm_mod_frontier_mining_leases: "Frontier Exarchates and burgher syndicates share Appalachian seam concessions, binding interior loyalty to metropolitan metallurgy."
 STATIC_MODIFIER_NAME_oe_stm_mod_chesapeake_foundries: "Chesapeake Imperial Steam Foundries"
 STATIC_MODIFIER_DESC_oe_stm_mod_chesapeake_foundries: "New Constantinople's waterfront foundries marry Greek-fire metallurgy with coal-fired steam engines decades ahead of Europe."
 STATIC_MODIFIER_NAME_oe_stm_mod_chesapeake_syndicates: "Elysian Merchant Foundry Syndicates"
 STATIC_MODIFIER_DESC_oe_stm_mod_chesapeake_syndicates: "Hellenic-American shipping houses finance private ironworks along the Patapsco and James rivers, multiplying Atlantic exports."
 STATIC_MODIFIER_NAME_oe_stm_mod_pan_american_federation: "Pan-American Maritime Federation"
 STATIC_MODIFIER_DESC_oe_stm_mod_pan_american_federation: "Unified imperial admiralty courts and tariff-free sea lanes link Chesapeake, the Kyklades, Borealis, and Hesperia into one oceanic commonwealth."
 STATIC_MODIFIER_NAME_oe_stm_mod_chesapeake_navigation_acts: "Chesapeake Imperial Navigation Acts"
 STATIC_MODIFIER_DESC_oe_stm_mod_chesapeake_navigation_acts: "Imperial staples channel every colonial cargo through New Constantinople's customs wharves before transatlantic shipment."
 STATIC_MODIFIER_NAME_oe_stm_mod_industrial_senate_reform: "Industrial Curia of the Elysian Senate"
 STATIC_MODIFIER_DESC_oe_stm_mod_industrial_senate_reform: "Master engineers, shipbuilders, and rail financiers take purple-bordered seats beside ancient patrician houses in the Senatus Hesperiae."
 STATIC_MODIFIER_NAME_oe_stm_mod_patrician_industrial_charters: "Patrician Imperial Monopoly Charters"
 STATIC_MODIFIER_DESC_oe_stm_mod_patrician_industrial_charters: "Crown-appointed curators oversee strategic arsenals and steam foundries under the direct authority of the Basileus."
 STATIC_MODIFIER_NAME_oe_stm_mod_elysian_citizenship_edict: "Nova Constitutio Antoniniana"
 STATIC_MODIFIER_DESC_oe_stm_mod_elysian_citizenship_edict: "Abolishing bondage across all American provinces and extending Roman civitas unleashes a wave of free labor, schooling, and civic pride."
 STATIC_MODIFIER_NAME_oe_stm_mod_gradual_manumission: "Compensated Manumission Charters"
 STATIC_MODIFIER_DESC_oe_stm_mod_gradual_manumission: "Imperial redemption bonds phase out bound estates over a generation, safeguarding plantation revenues while widening free tenancy."
 STATIC_MODIFIER_NAME_oe_stm_mod_trans_appalachian_rail: "Via Ferrea Hesperiae"
 STATIC_MODIFIER_DESC_oe_stm_mod_trans_appalachian_rail: "Twin iron tracks pierce the Appalachian passes from Chesapeake to the Ohio and Mississippi valleys, uniting a continental empire."
 STATIC_MODIFIER_NAME_oe_stm_mod_hesperian_rail_companies: "Joint-Stock Hesperian Rail Companies"
 STATIC_MODIFIER_DESC_oe_stm_mod_hesperian_rail_companies: "Private syndicate bonds finance branch lines into every frontier market town, multiplying inland freight and land values."
 STATIC_MODIFIER_NAME_oe_stm_mod_transatlantic_steamer: "Bicephalum Imperial Steam Packet"
 STATIC_MODIFIER_DESC_oe_stm_mod_transatlantic_steamer: "Iron-hulled paddle-steamers link New Constantinople, the Azores, and the Golden Horn on a twelve-day schedule across the ocean."
 STATIC_MODIFIER_NAME_oe_stm_mod_atlantic_steam_cruisers: "Steam-Powered Atlantic Auxiliary Fleet"
 STATIC_MODIFIER_DESC_oe_stm_mod_atlantic_steam_cruisers: "Fast coal-fired steam packets double as armed cruisers in wartime, projecting imperial sea power from Chesapeake to the Straits."
 STATIC_MODIFIER_NAME_oe_stm_mod_twin_rome_centennial: "1836 Twin-Rome Industrial Pax"
 STATIC_MODIFIER_DESC_oe_stm_mod_twin_rome_centennial: "Five centuries after the flight from the Bosphorus, Steam and Eagle unite New and Old Rome in an unprecedented industrial golden age."
 STATIC_MODIFIER_NAME_oe_stm_mod_centennial_civic_renaissance: "Centennial Civic Renaissance of Nova Elysia"
 STATIC_MODIFIER_DESC_oe_stm_mod_centennial_civic_renaissance: "Universities, free workshops, and continental railways celebrate a cosmopolitan Roman republic of science, law, and steam."
 oe_stm.1.title: "The Atmospheric Pumping Engine"
 oe_stm.1.desc: "Deep below the coal-fields, groundwater has long drowned our richest seams. Now an ingenious brass-and-iron fire-engine condenses steam inside an upright cylinder, rocking an oak beam that lifts torrents from the shafts day and night. Ironmasters and colliery bailiffs clamor for crown backing to multiply these engines."
 oe_stm.1.a: "Finance Crown Colliery Pumping Engines"
 oe_stm.1.b: "Grant Private Colliery Engine Patents"
 oe_stm.2.title: "Coke-Fired Blast Furnaces"
 oe_stm.2.desc: "For centuries our foundries devoured entire forests for charcoal, stalling iron output whenever timber grew scarce. Master smelters have perfected a towering blast furnace fed on roasted mineral coke, pouring clean molten pig iron cheap enough for bridges, cannons, and steam boilers alike."
 oe_stm.2.a: "Subsidize Coke-Smelting Blast Furnaces"
 oe_stm.2.b: "Preserve Timber Guild Accords During Transition"
 oe_stm.3.title: "Spinning Jennies and Power Looms"
 oe_stm.3.desc: "In the clattering workshops of our textile towns, multi-spindle spinning frames and heavy timber power looms now outpace dozens of hand-spinners at once. Coupled to steam shafts, a single mill can clothe an entire province — yet older drapers' guilds warn that cottage looms face ruin."
 oe_stm.3.a: "Charter Mechanized Steam Textile Mills"
 oe_stm.3.b: "Fund a Handloom Guild Transition Pact"
 oe_stm.4.title: "The Separate Condenser Breakthrough"
 oe_stm.4.desc: "An instrument maker examining a model fire-engine has solved its greatest waste: instead of cooling the working cylinder on every stroke, steam is drawn into a separate condensing chamber while sun-and-planet gears turn pistons into smooth rotary power. Coal consumption plunges, and steam engines can now drive mills far from the mines."
 oe_stm.4.a: "Grant an Exclusive Rotary Condenser Patent"
 oe_stm.4.b: "Publish Open Engineering Drawings Across the Realm"
 oe_stm.5.title: "Coal-Field Urban Boom"
 oe_stm.5.desc: "Villages that held scarcely a parish church a generation ago now bristle with brick chimneys, iron foundries, and rows of workers' terraces beside the coal seams. Local magistrates petition the throne for borough charters, market courts, and paved haulage roads."
 oe_stm.5.a: "Charter New Industrial Boroughs"
 oe_stm.5.b: "Levy an Imperial Excise on Pithead Coal"
 oe_stm.6.title: "Early Iron Rail and the Steam Locomotive"
 oe_stm.6.desc: "Along the colliery wagonways, cast-iron edge rails have replaced rutted oak planks — and a bold foundry engineer has bolted a high-pressure boiler onto flanged wheels, pulling ten tons of iron ore under its own billowing plume of steam. Imperial Roads surveyors report that trunk rail hubs could transform overland logistics forever."
 oe_stm.6.a: "Sponsor High-Pressure Locomotive Trials"
 oe_stm.6.b: "Standardize Macadamized Imperial Turnpikes First"
 oe_stm.7.title: "Machine-Breakers in the Mill Towns"
 oe_stm.7.desc: "Under cover of winter fog, masked bands of displaced handloom weavers have raided mechanized mills with sledgehammers, smashing power frames and posting defiant broadsheets in the name of their legendary captain. Factory owners demand cavalry garrisons, while parish vestries plead for bread relief."
 oe_stm.7.a: "Dispatch Dragoons and Pass the Frame-Breaking Statute"
 oe_stm.7.b: "Establish Parish Artisan Relief and Retraining Funds"
 oe_stm.8.title: "Factory Town Cholera and Sanitation Reform"
 oe_stm.8.desc: "Rapid industrial crowding has outstripped medieval wells and open drains. A virulent outbreak of waterborne fever sweeps the tenement alleys near the dye-works and tanneries. Physicians urge the crown to lay vaulted brick sewers and steam-pumped water mains before contagion paralyzes our workshops."
 oe_stm.8.a: "Fund Municipal Brick Sewers and Steam Waterworks"
 oe_stm.8.b: "Impose Temporary Sanitary Cordons Around Mill Districts"
 oe_stm.9.title: "Child Labor and the Factory Act Debate"
 oe_stm.9.desc: "A sobering commission dossier lays bare sixteen-hour shifts, unfenced drive belts, and children as young as eight piecing threads beneath thunderous looms. Reformers demand statutory hour caps and mill schools; industrial syndicates warn that regulation will surrender our export lead to foreign rivals."
 oe_stm.9.a: "Enact Statutory Mill Hours and Safety Inspectors"
 oe_stm.9.b: "Side with Mill-Owners for Unfettered Output"
 oe_stm.10.title: "Steam Packets and Paddle Steamers"
 oe_stm.10.desc: "Against a stiff headwind that keeps tall-masted brigs anchored in port, a timber-and-iron packet churning twin paddle wheels steams cleanly out of the harbor. Merchants envision scheduled coastal mail lines and upstream river freight no longer hostage to calms or tides."
 oe_stm.10.a: "Commission Imperial Steam-Packet Mail Lines"
 oe_stm.10.b: "License Private River Steamboat Syndicates"
 oe_stm.11.title: "Industrial Tariff Wars"
 oe_stm.11.desc: "Steam-powered looms and iron foundries have upended the old balance of commerce. Foreign ports bristle with retaliatory duties against cheap factory cloth, while domestic manufacturers split sharply between demanding protective tariffs and campaigning for reciprocal free-trade treaties."
 oe_stm.11.a: "Erect a Protective Industrial Tariff Wall"
 oe_stm.11.b: "Champion Reciprocal Free-Trade Treaties"
 oe_stm.12.title: "Trunk Railway Mania"
 oe_stm.12.desc: "Speculators, provincial mayors, and banking syndicates crowd the bourse clamoring for railway acts. Maps crisscrossed in crimson ink promise steam travel from coal-field to capital in a single day — yet reckless promotions also threaten a credit bubble if left unexamined."
 oe_stm.12.a: "Guarantee Sovereign Trunk Railway Bonds"
 oe_stm.12.b: "Enforce Prudent Railway Bourse Audits"
 oe_stm.13.title: "Telegraph Signal Experiments"
 oe_stm.13.desc: "Along the new trunk embankments, engineers have demonstrated both hillside shutter semaphores and needle deflections sent through copper wire from a voltaic pile. For the first time in history, state dispatches and train timetables can outpace the fastest locomotive."
 oe_stm.13.a: "String State Signal Corridors Along Trunk Lines"
 oe_stm.13.b: "Sponsor Academy Galvanic Laboratories"
 oe_stm.14.title: "Chartist and Guild Suffrage Petitions"
 oe_stm.14.desc: "Hundreds of thousands of mechanics, railmen, and shopkeepers from the booming factory towns have signed a towering roll of parchment demanding representation, municipal elections, and fair taxation. The council must decide whether to widen the civic franchise or stand fast upon the ancient estate settlement."
 oe_stm.14.a: "Broaden the Urban Franchise and Municipal Councils"
 oe_stm.14.b: "Uphold the Traditional Landed Estate Settlement"
 oe_stm.15.title: "The Great Industrial Exhibition"
 oe_stm.15.desc: "Cast-iron ribs and acres of plate glass rise above the capital's parklands for an unprecedented showcase of human ingenuity: gleaming steam locomotives, Jacquard looms, precision lathes, and steel ordnance arrayed beneath one glittering roof."
 oe_stm.15.a: "Host the Grand Exhibition of Arts and Manufactures"
 oe_stm.15.b: "Dispatch Technical Commissioners to Study Foreign Engines"
 oe_stm.16.title: "Dawn of the Machine Age"
 oe_stm.16.desc: "As the third decade of the nineteenth century opens, the rhythm of pistons, blast furnaces, and railway whistles has remade every corner of the realm. What began with a single mine-draining cylinder now defines the destiny of nations — and posterity will judge how we wield this iron inheritance."
 oe_stm.16.a: "Forge the Iron Workshop of the World"
 oe_stm.16.b: "Crown the Age with Balanced Civic Stewardship"
 oe_stm.17.title: "The Appalachian Coal and Iron Belt"
 oe_stm.17.desc: "Imperial surveyors pushing past the Blue Ridge and Shenandoah valleys have returned to New Constantinople with saddlebags of black bituminous coal and high-grade hematite ore. Beneath the forested Appalachian ridges sleeps enough fuel and iron to arm and industrialize an entire hemisphere."
 oe_stm.17.a: "Charter the Imperial Appalachian Mining Commission"
 oe_stm.17.b: "Lease Frontier Seams to Exarchate Magnates"
 oe_stm.18.title: "Chesapeake Steam and Iron Foundries"
 oe_stm.18.desc: "In the smoky dockyards of Chesapeake, Greek-fire alchemists and ironmasters trained in ancient Roman hydraulics have mated pressurized copper boilers to coal-fired blast furnaces. Years before Old World courts grasp the full power of steam, New Constantinople's waterfront beats to the stroke of industrial engines."
 oe_stm.18.a: "Establish Imperial Chesapeake Steam Foundries"
 oe_stm.18.b: "Partner with Elysian Merchant Foundry Syndicates"
 oe_stm.19.title: "Pan-American Maritime Federation"
 oe_stm.19.desc: "From Borealis cod fleets to Caribbean Kykladean sugar convoys and southern silver packets, every American Exarchate now sails under the Purple Eagle. Admiralty delegates gather in Chesapeake to propose a permanent Pan-American Maritime Federation unifying convoy defense, customs codes, and oceanic charts."
 oe_stm.19.a: "Convene the Pan-American Admiralty and Customs Union"
 oe_stm.19.b: "Enforce Metropolitan Chesapeake Navigation Acts"
 oe_stm.20.title: "New Roman Industrial Senate Reform"
 oe_stm.20.desc: "Three centuries of exile and enterprise have raised a formidable class of ironmasters, steam shipwrights, and continental bankers who now demand a formal curia inside the Senatus Hesperiae. Traditional patrician families argue that imperial arsenals should remain crown monopolies under noble curators."
 oe_stm.20.a: "Seat the Industrial Curia in the Elysian Senate"
 oe_stm.20.b: "Bind Strategic Industry to Patrician Imperial Charters"
 oe_stm.21.title: "The Elysian Abolition and Citizenship Edict"
 oe_stm.21.desc: "As mechanized mills and free wage workshops eclipse older plantation bondage, jurists in New Constantinople invoke Emperor Caracalla's ancient Constitutio Antoniniana. They urge the throne to abolish chattel slavery across all American provinces and proclaim universal Roman civitas for every free inhabitant."
 oe_stm.21.a: "Proclaim the Nova Constitutio Antoniniana"
 oe_stm.21.b: "Enact Compensated Gradual Manumission Charters"
 oe_stm.22.title: "The Trans-Appalachian Imperial Steam Railway"
 oe_stm.22.desc: "Imperial engineers have surveyed stone viaducts and switchback grades across the Appalachian wall, linking New Constantinople's tidewater terminuses directly to the Ohio and Mississippi basins. Once iron locomotives breach the mountains, the vast interior of Hesperia will lie days — not months — from the Senate."
 oe_stm.22.a: "Build the State-Funded Via Ferrea Hesperiae"
 oe_stm.22.b: "Charter Joint-Stock Hesperian Rail Companies"
 oe_stm.23.title: "Transatlantic Steamer Packet to Constantinople"
 oe_stm.23.desc: "From Chesapeake piers, a sleek iron-hulled twin-funnel paddle steamer departs on a coal-staged course via the Azores and Gibraltar straight for the Golden Horn — cutting the ancestral voyage to twelve days. Two worlds separated since the fourteenth century are bridged at last by fire and steam."
 oe_stm.23.a: "Inaugurate the Imperial Bicephalum Steam Mail"
 oe_stm.23.b: "Arm the Steam-Packets as Rapid Atlantic Cruisers"
 oe_stm.24.title: "1836 Twin-Rome Industrial Centennial"
 oe_stm.24.desc: "Half a millennium after desperate refugees hoisted purple sails against the sunset, delegations from every American Exarchate and Old World Mediterranean port convene beneath the vaulted steel pavilion of New Constantinople. Steam locomotives whistle along the Trans-Appalachian trunk line as twin bells toll for Old Rome and New — an industrial colossus spanning two worlds."
 oe_stm.24.a: "Proclaim the Eternal Industrial Pax Romana"
 oe_stm.24.b: "Dedicate the Centennial to Civic Science and Liberty"
