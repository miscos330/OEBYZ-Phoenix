l_english:
 OE_AR_PATH_1: "Constantinople rules them all"
 OE_AR_PATH_2: "Rome as the capital"
 OE_AR_PATH_3: "Two capitals"
 OE_AR_TIER_1: "#G At ease#!"
 OE_AR_TIER_2: "#Y Strained#!"
 OE_AR_TIER_3: "#R Overburdened#!"
 oe_ar_burden: "The Burden of Rome"
 oe_ar_burden_desc: "The empire is restored; keeping it is harder.\n\nImperial strain: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ar_strain').GetValue|0]#! / #Y 100#!  [GetCountry('BYZ').Custom('OeArTier')]  Monthly change [GetCountry('BYZ').MakeScope.ScriptValue('oe_ar_strain_delta')|1]\nCapital: [GetCountry('BYZ').Custom('OeArPath')]  [Concept('oe_tu_exarchate','Exarchates')|e]: [GetCountry('BYZ').MakeScope.ScriptValue('oe_ar_exarch_count')|0]\nMonths in a row below #Y 30#!: [GetCountry('BYZ').MakeScope.GetVariable('oe_ar_low').GetValue|0] (#Y 120#! brings the Pax Romana)\n\nMonthly sources: size (#G +1#! per #Y 600#! places, at most #G +2#!); the West (Italy, North Africa, Gaul, Iberia, Britain: #Y +1#! per #Y 300#! places, at most #Y +3#!; halved with Rome as capital, #Y 30%#! with two capitals); war #Y +1#!, peace #Y −2#!; debt #R +1#!; negative stability #G +1#!, #Y 50#! or more #R −1#!; each exarchate #Y −1#! (at most #Y −2#!).\nFrom #Y 30#! 'Strained', from #Y 60#! 'Overburdened', with crises such as a hollow frontier or plague."
 OE_AR_EXARCH_RAVENNA: "Exarchate of Ravenna"
 OE_AR_EXARCH_RAVENNA_ADJ: "Ravennan"
 OE_AR_EXARCH_CARTHAGE: "Exarchate of Carthage"
 OE_AR_EXARCH_CARTHAGE_ADJ: "Carthaginian"
 STATIC_MODIFIER_NAME_oe_ar_strained: "Imperial Strain"
 STATIC_MODIFIER_NAME_oe_ar_overburdened: "Overburdened"
 STATIC_MODIFIER_NAME_oe_ar_pax_romana: "Pax Romana"
 STATIC_MODIFIER_NAME_oe_ar_senate: "The Senate Restored"
 STATIC_MODIFIER_NAME_oe_ar_council_orthodox: "The Triumph of Orthodoxy"
 STATIC_MODIFIER_NAME_oe_ar_council_union: "The Union of the Churches"
 STATIC_MODIFIER_NAME_oe_ar_council_roman: "The Primacy of Rome"
 STATIC_MODIFIER_NAME_oe_ar_plague: "Spreading Sickness"
 STATIC_MODIFIER_NAME_oe_ar_hollow_border: "The Hollow Frontier"
 oe_ar_two_emperors_eased: "Recognised us as 'Emperor of the Franks'"
 oe_ar_two_emperors_demand: "Demanded we give up the Roman title"
 oe_ar.1.t: "After the Restoration"
 oe_ar.1.d: "For the first time in a thousand years Rome, Alexandria, Antioch and Carthage answer to one emperor. But everyone remembers Justinian: he won Italy, and three years after his death the Lombards came. To keep it all, the empire must first answer an old question: where should the emperor live?"
 oe_ar.1.a: "Constantinople rules them all"
 oe_ar.1.a.tt: "The capital stays; the distant West makes strain grow fastest"
 oe_ar.1.b: "Move the capital to Rome"
 oe_ar.1.b.tt: "The capital moves to Rome; strain from the West is halved\nConstantinople's nobles will resent it: Constans II died in his bath over rumours of such a move"
 oe_ar.1.c: "Two capitals, East and West"
 oe_ar.1.c.tt: "Constantinople stays and a co-emperor holds the West; strain from the West falls to #Y 30%#!\nThe West may drift away"
 oe_ar.2.t: "Ravenna and Carthage"
 oe_ar.2.d: "In the sixth century the empire placed a single governor over all civil and military affairs in Italy and in Africa: the exarchates of Ravenna and Carthage. Distant provinces need someone who can decide on the spot, not wait for letters from Constantinople."
 oe_ar.2.a: "Create the exarchates"
 oe_ar.2.a.tt: "An [Concept('oe_tu_exarchate','exarchate')|e] in Italy and one in North Africa, each covering all imperial land there not yet in a theme, run by the theme rules (loyalty, offices, revolts), with exarchate status: a tenth of its monthly income goes to the treasury\nEach exarchate: imperial strain #G −1#! a month"
 oe_ar.2.b: "Keep ruling them directly"
 oe_ar.3.t: "The Exarch's Ambition"
 oe_ar.3.d: "The exarch of [GetCountry('BYZ').MakeScope.GetVariable('oe_ar_exarch').GetCountry.GetName] holds all power in the province and is far from the capital. Eleutherius of Ravenna in 619 and Gregory of Carthage in 646 both took this road to proclaiming themselves emperor."
 oe_ar.3.a: "Shower the exarch with honours"
 oe_ar.3.a.tt: "That [Concept('oe_tu_exarchate','exarchate')|e]: loyalty #G +15#!, also in its target for #Y 5#! years"
 oe_ar.3.b: "Recall the exarch"
 oe_ar.3.b.tt: "[oe_tu_authority|e] #R −5#!\n#Y 70%#!: the exarch steps down and a new one takes over\n#R 30%#!: the exarch refuses and rises next month"
 oe_ar.3.c: "Wait and see"
 oe_ar.4.t: "The Assassin in the Bath"
 oe_ar.4.d: "Since the move to Rome, the nobles of Constantinople have watched the court, the taxes and the glory all go west. Someone is buying men among the palace servants. Constans II was killed in his bath at Syracuse by his own chamberlain, with a bucket."
 oe_ar.4.a: "Search the palace"
 oe_ar.4.a.tt: "[oe_tu_authority|e] #R −5#!"
 oe_ar.4.b: "Pay it no mind"
 oe_ar.4.b.tt: "#Y 30%#!: the emperor is murdered"
 oe_ar.5.t: "The Western Co-Emperor"
 oe_ar.5.d: "East and West have been ruled apart for twenty years. The western exarchs collect their own taxes and make their own peace, and write to Constantinople less and less. Everyone knows how the story of the two halves ended after Theodosius."
 oe_ar.5.a: "Draw them closer"
 oe_ar.5.a.tt: "[oe_tu_authority|e] #R −5#!\nEvery [Concept('oe_tu_exarchate','exarchate')|e]: loyalty #G +15#!, also in its target for #Y 5#! years"
 oe_ar.5.b: "Let them go their way"
 oe_ar.5.b.tt: "Every [Concept('oe_tu_exarchate','exarchate')|e]: loyalty #R −20#!, also in its target for #Y 5#! years"
 oe_ar.6.t: "Restoring the Consulship"
 oe_ar.6.d: "Rome's last ordinary consul, Basilius, took office in 541. Now that the empire is whole again, some propose reviving the custom of naming consuls each year and counting the years by their names."
 oe_ar.6.a: "Revive the old custom"
 oe_ar.6.a.tt: "A consul's inauguration every new year from now on"
 oe_ar.6.b: "No need"
 oe_ar.7.t: "The Senate of Rome"
 oe_ar.7.d: "The Senate of Rome has been silent for more than seven hundred years. Now that the emperor has returned to the West, the great families of Rome ask for it to sit again."
 oe_ar.7.a: "Give it a voice"
 oe_ar.7.a.tt: "[oe_tu_authority|e] #R −5#!\nGain 'The Senate Restored' for #Y 30#! years"
 oe_ar.7.b: "Keep it as an honour"
 oe_ar.8.t: "The Problem of Two Emperors"
 oe_ar.8.d: "The ruler of [SCOPE.sCountry('oe_ar_hre').GetName] still styles himself 'Emperor of the Romans'. In 812 Byzantine envoys at Aachen hailed Charlemagne as 'emperor', but never as emperor of the Romans. Now that Rome is ours, the question should be settled."
 oe_ar.8.a: "Recognise him as 'Emperor of the Franks'"
 oe_ar.8.a.tt: "Their opinion of us #G +50#! (fades by #Y 2#! a year)"
 oe_ar.8.b: "Demand he give up the Roman title"
 oe_ar.8.b.tt: "A 'Restore Roman Borders' casus belli against the Holy Roman Emperor for #Y 20#! years\nTheir opinion of us #R −50#! (fades by #Y 2#! a year)"
 oe_ar.8.c: "Ignore it"
 oe_ar.9.t: "The Ecumenical Council"
 oe_ar.9.d: "Rome, Constantinople, Alexandria, Antioch, Jerusalem: for the first time since the seventh century all five patriarchates are under one emperor. The emperor summons an ecumenical council to heal three centuries of schism between East and West. Its verdict depends on which side he takes."
 oe_ar.9.a: "Hold to Orthodoxy"
 oe_ar.9.a.tt: "Gain 'The Triumph of Orthodoxy' for #Y 25#! years"
 oe_ar.9.b: "A compromise, each side yielding"
 oe_ar.9.b.tt: "Gain 'The Union of the Churches' for #Y 25#! years"
 oe_ar.9.c: "Accept the primacy of Rome"
 oe_ar.9.c.tt: "Gain 'The Primacy of Rome' for #Y 25#! years"
 oe_ar.10.t: "The Hollow Frontier"
 oe_ar.10.d: "The armies have all gone further afield, and the walls around [SCOPE.sLocation('oe_ar_border').GetName] are held by a handful of old soldiers. That is how the Lombards walked into Italy."
 oe_ar.10.a: "Send a garrison"
 oe_ar.10.a.tt: "The frontier is manned again"
 oe_ar.10.b: "We cannot spare them"
 oe_ar.11.t: "The Shadow of Plague"
 oe_ar.11.d: "The great plague of 541 crippled Justinian's empire just as Italy was nearly won. Now the empire is stretched thin again, and the ships crowding its harbours bring goods from every shore, and sickness with them."
 oe_ar.11.a: "Build quarantine houses"
 oe_ar.11.b: "Leave it to God"
 oe_ar.11.b.tt: "Gain 'Spreading Sickness' for #Y 5#! years"
 oe_ar.12.t: "Pax Romana"
 oe_ar.12.d: "For ten years no frontier has fallen and no exarch has rebelled. Merchants travel from Gibraltar to Antioch with one coinage and one law. People have begun to call it the Pax Romana of Augustus's day."
 oe_ar.12.a: "May it last"
 oe_ar.12.a.tt: "Gain 'Pax Romana' permanently"
 oe_ar.13.t: "The Consul Takes Office"
 oe_ar.13.d: "On the first day of the year the new consul walks the streets in his purple robe, scattering coins to the crowd. By the old custom, the year will bear his name."
 oe_ar.13.a: "A grand inauguration"
 oe_ar.13.b: "Keep it modest this year"
