l_english:
 oe_boyar_title_integration: "Integration of Boyar Titles"
 oe_boyar_title_integration_desc: "Bring the boyars' ranks, oaths and hereditary rights into a common order, allowing local nobles to preserve their dignity while accepting a single sovereign. Diplomatic Annexation Efficiency +20%."
 oe_rus_mercenary_cost: "Three Months of Income"
 oe_rus_mercenary_gold_paid: "Gold Paid for This Mercenary Mission"
 oe_ra_expand_west: "Expand Westward"
 oe_ra_expand_west_desc: "Spend 25 Political Influence and three months of our national income to gain a province conquest Casus Belli in the Baltic, Ruthenia or Russia regions, or the Finland or Karelia areas. The selected province must border Russia or one of its direct or indirect subjects. Allies, subjects, overlords and union partners are excluded. Cooldown: six months."
 oe_ra_expand_west_cooldown: "Expand Westward"
 oe_ra_build_kremlin: "Build a Kremlin"
 oe_ra_build_kremlin_desc: "Spend three months of national income and 25 Political Influence to commission a Kremlin in an owned non-capital city or megalopolis in Russia, Ruthenia or the Steppes. Uses the existing Rus building, shared five-building limit and five-year cooldown. The native Moscow Kremlin also counts toward the limit."
 oe_ra_establish_ukraine: "Establish the Ukrainian Governorate"
 oe_ra_establish_ukraine_desc: "Directly own every conquerable location in Right-Bank and Left-Bank Ukraine, then spend 50 Political Influence and six months of our national income to unlock and begin constructing a level-one Ukrainian Governor's Office in Kyiv. It employs 1,000 Nobles, provides +80 Local Proximity and consumes administrative maintenance goods. This action may be used only once."
 oe_ra_establish_south_russia: "Establish the Southern Russian Governorate"
 oe_ra_establish_south_russia_desc: "Directly own every conquerable location in the Lower Don and Astrakhan areas, then spend 50 Political Influence and six months of our national income to unlock and begin constructing a level-one Southern Governor's Office in Sarai. It employs 1,000 Nobles, provides +80 Local Proximity and consumes administrative maintenance goods. This action may be used only once."
 oe_ra_red_square: "Red Square"
 oe_ra_red_square_desc: "The capital's square serves military reviews, public proclamations, petitions and state ceremonies. Employs 1,000 Laborers and consumes 0.5 Stone and 0.2 Tools each month. Provides national Monthly Army Tradition +0.1, Monthly War Exhaustion -0.05 and Maximum War Exhaustion +5."
 oe_ra_red_square_maintenance: "Square and Ceremonial Facilities Maintenance"
 oe_ra_ukrainian_governorate: "Ukrainian Governor's Office"
 oe_ra_ukrainian_governorate_desc: "The governor's offices in Kyiv coordinate records, taxation and noble affairs on both banks of the Dnieper. Employs 1,000 Nobles and provides +80 Local Proximity. Uses the native Local Governor's administrative maintenance recipe."
 oe_ra_ukrainian_governorate_maintenance: "Ukrainian Governorate Administration"
 oe_ra_southern_governorate: "Southern Governor's Office"
 oe_ra_southern_governorate_desc: "The governor's offices in Sarai establish a common administration for the Lower Don and the lower Volga. Employs 1,000 Nobles and provides +80 Local Proximity. Uses the native Local Governor's administrative maintenance recipe."
 oe_ra_southern_governorate_maintenance: "Southern Governorate Administration"
 oe_russian_ambition.2.t: "A Capital for Russia"
 oe_russian_ambition.2.d: "The principalities now share the name of Russia, but the united realm still needs a lasting center. Smolensk commands the western roads; Tver stands on the Volga's trade routes; Moscow gathers princes and churchmen; Novgorod preserves the traditions of assembly and commerce; and Kyiv stands as the ancient Mother of Rus' Cities.\n\nLet us choose among the cities we rule directly and commission a Red Square for military reviews, proclamations and state ceremonies, bringing local prestige into the service of a common realm."
 oe_russian_ambition.2.smolensk: "Make Smolensk our capital."
 oe_russian_ambition.2.tver: "Make Tver our capital."
 oe_russian_ambition.2.moscow: "Make Moscow our capital."
 oe_russian_ambition.2.novgorod: "Make Novgorod our capital."
 oe_russian_ambition.2.kyiv: "Make Kyiv our capital."
 oe_russian_ambition.2.none: "None of the five cities is ours. Retain our present capital."
 oe_ra_western_province: "Western Province Bordering Russia or Its Subjects"
 oe_ra_area_fully_owned: "Russia Directly Owns Every Conquerable Location in This Area"
 oe_ra_ukraine_ready: "Directly Own All Conquerable Locations in Both Banks of Ukraine, with No Ukrainian Governorate Yet Established"
 oe_ra_south_russia_ready: "Directly Own All Conquerable Locations in the Lower Don and Astrakhan, with No Southern Governorate Yet Established"
 oe_ra_owns_capital_candidate: "Directly Owns One of the Five Candidate Capitals"
 oe_ra_choose_capital: "Establish the Capital and Commission Red Square"
 oe_ra_western_cost: "Three Months of Income"
 oe_ra_three_years_income: "Three Years of Income"
 oe_ra_governorate_cost: "Six Months of Income"
 oe_ra_ukraine_governorate_established: "Ukrainian Governorate Established"
 oe_ra_south_russia_governorate_established: "Southern Governorate Established"
