l_english:
 OE_EUG_NAME_MOGHULISTAN: "Moghulistan"
 OE_EUG_NAME_MOGHULISTAN_ADJ: "Moghul"
 OE_EUG_NAME_TRANSOXIANA: "Transoxiana Amirate"
 OE_EUG_NAME_TRANSOXIANA_ADJ: "Transoxianan"
 oe_eug_dlh_deccan: "Deccan Iqta Viceroyalty"
 oe_eug_dlh_deccan_desc: "Provincial viceroyalty seated at Gulbarga overseeing Delhi's Deccan garrisons and revenues; bolsters control while loyal, yet feeds autonomy during imperial overextension."
 oe_eug_dlh_deccan_maintenance: "Deccan Viceroyalty Administration"
 oe_eug_dlh_malwa: "Malwa Iqta Viceroyalty"
 oe_eug_dlh_malwa_desc: "Delhi's central Indian viceroyalty at Dhar, guarding the highland corridor to the Deccan and mobilizing regional levies."
 oe_eug_dlh_malwa_maintenance: "Malwa Viceroyalty Administration"
 oe_eug_dlh_gujarat: "Gujarat Maritime Viceroyalty"
 oe_eug_dlh_gujarat_desc: "Delhi's coastal viceroyalty at Khambat, administering Gujarat's wealthy Indian Ocean customs and port merchants."
 oe_eug_dlh_gujarat_maintenance: "Gujarat Viceroyalty Administration"
 oe_eug_dlh_jaunpur: "Sharqi-Jaunpur Viceroyalty"
 oe_eug_dlh_jaunpur_desc: "Delhi's eastern viceroyalty at Jaunpur, supervising the fertile Gangetic heartland and the eastern marches toward Bengal."
 oe_eug_dlh_jaunpur_maintenance: "Jaunpur Viceroyalty Administration"
 oe_eug_mam_damascus: "Niyabat of Damascus"
 oe_eug_mam_damascus_desc: "Chief Syrian viceregal court of the Mamluk Sultanate at Damascus, anchoring Levant commerce and frontier armies yet prone to emir factionalism."
 oe_eug_mam_damascus_maintenance: "Damascus Niyabat Administration"
 oe_eug_mam_aleppo: "Niyabat of Aleppo"
 oe_eug_mam_aleppo_desc: "Northern Syrian viceregal fortress at Aleppo, guarding the Mamluk marches facing Anatolia and Mesopotamia."
 oe_eug_mam_aleppo_maintenance: "Aleppo Niyabat Administration"
 oe_eug_hun_transylvania: "Voivodeship of Transylvania"
 oe_eug_hun_transylvania_desc: "Royal Voivode's seat guarding the Carpathian passes at Brasov, uniting frontier garrisons into a formidable southern bulwark."
 oe_eug_hun_transylvania_maintenance: "Transylvanian Voivodeship Administration"
 oe_eug_hun_croatia: "Banate of Croatia-Slavonia"
 oe_eug_hun_croatia_desc: "Royal Banate seated at Zagreb, coordinating Sava frontier defense and noble assemblies across Slavonia and Croatia."
 oe_eug_hun_croatia_maintenance: "Croatia-Slavonia Banate Administration"
 oe_eug_b_amir_revolt: "Transoxianan Amir Defiance"
 oe_eug_b_kurultai_accord: "Chagatai Kurultai Accord"
 oe_eug_b_moghul_bond: "Moghulistan Islamic Bond"
 oe_eug_b_silk_road_truce: "Tianshan Silk Road Accord"
 STATIC_MODIFIER_NAME_oe_eug_chg_yassa_hammer: "Qazan Khan's Iron Yassa"
 STATIC_MODIFIER_DESC_oe_eug_chg_yassa_hammer: "Harsh centralization stiffens royal horsemen while inflaming Transoxianan amir resentment."
 STATIC_MODIFIER_NAME_oe_eug_chg_yassa_compromise: "Almaliq Kurultai Compromise"
 STATIC_MODIFIER_DESC_oe_eug_chg_yassa_compromise: "Sharing pasture rights and customs revenues with the amirs buys vital cohesion for the khanate."
 STATIC_MODIFIER_NAME_oe_eug_west_transoxiana: "Turko-Persian Amirate of Transoxiana"
 STATIC_MODIFIER_DESC_oe_eug_west_transoxiana: "Freed from eastern steppe rule, Samarkand and Bukhara fuse Persianate urban wealth with Turko-Mongol arms."
 STATIC_MODIFIER_NAME_oe_eug_moghulistan_east: "Steppe Heritage of Moghulistan"
 STATIC_MODIFIER_DESC_oe_eug_moghulistan_east: "Eastern Chagatai clans across Zhetysu and the Tarim basin uphold nomadic horsemanship along the Tianshan."
 STATIC_MODIFIER_NAME_oe_eug_chg_yassa_restored: "Chagatai's Yassa Restored"
 STATIC_MODIFIER_DESC_oe_eug_chg_yassa_restored: "The khan has averted the 1347 schism, binding Zhetysu and Transoxiana once more under one Yassa."
 STATIC_MODIFIER_NAME_oe_eug_moghul_islamization: "Tughlugh Timur's Islamization"
 STATIC_MODIFIER_DESC_oe_eug_moghul_islamization: "Conversion of the eastern court binds Kashgar, Yarkand, and the Zhetysu begs under a shared Islamic banner."
 STATIC_MODIFIER_NAME_oe_eug_silk_road_pluralism: "Tianshan Silk Road Pluralism"
 STATIC_MODIFIER_DESC_oe_eug_silk_road_pluralism: "Toleration of steppe, Buddhist, and oasis communities keeps caravan tolls brisk from Turpan to Almaliq."
 STATIC_MODIFIER_NAME_oe_eug_samarkand_amirate: "Urban Amirate of Samarkand"
 STATIC_MODIFIER_DESC_oe_eug_samarkand_amirate: "Samarkand and Bukhara draw artisans and ambitious amirs alike, preparing the stage for empire."
 STATIC_MODIFIER_NAME_oe_eug_chagatai_warbands: "Chagatai Frontier Warbands"
 STATIC_MODIFIER_DESC_oe_eug_chagatai_warbands: "Battle-hardened warbands between the Syr and Amu Darya swell the khanate's mounted hosts."
 STATIC_MODIFIER_NAME_oe_eug_dlh_iqta_loyal: "Loyal Delhi Iqta Viceroyalty"
 STATIC_MODIFIER_DESC_oe_eug_dlh_iqta_loyal: "The provincial viceroy remits taxes promptly and maintains imperial authority across the region."
 STATIC_MODIFIER_NAME_oe_eug_dlh_iqta_autonomous: "Autonomous Iqta Tax-Retention"
 STATIC_MODIFIER_DESC_oe_eug_dlh_iqta_autonomous: "Overextended rule lets the provincial viceroy withhold revenue and stoke local defiance."
 STATIC_MODIFIER_NAME_oe_eug_mam_naib_loyal: "Loyal Syrian Niyabat"
 STATIC_MODIFIER_DESC_oe_eug_mam_naib_loyal: "The Syrian Naib holds the northern marches in Cairo's name, securing Levant trade and citadels."
 STATIC_MODIFIER_NAME_oe_eug_mam_naib_factional: "Factional Syrian Emir Autonomy"
 STATIC_MODIFIER_DESC_oe_eug_mam_naib_factional: "Factional intrigue between Cairo and Syrian emirs undermines imperial control and incites unrest."
 STATIC_MODIFIER_NAME_oe_eug_hun_voivode_loyal: "Loyal Frontier Voivode"
 STATIC_MODIFIER_DESC_oe_eug_hun_voivode_loyal: "The royal Voivode and Ban guard Hungary's marches loyally, keeping mountain passes secure."
 STATIC_MODIFIER_NAME_oe_eug_hun_voivode_autonomous: "Magnate Frontier Autonomy"
 STATIC_MODIFIER_DESC_oe_eug_hun_voivode_autonomous: "During royal weakness, provincial magnates treat the frontier office as a semi-independent fief."
 STATIC_MODIFIER_NAME_oe_eug_dlh_firuz_settlement: "Conciliatory Iqta Settlement"
 STATIC_MODIFIER_DESC_oe_eug_dlh_firuz_settlement: "Easing harsh levies and confirming hereditary stipends stabilizes Delhi's surviving provinces."
 STATIC_MODIFIER_NAME_oe_eug_dlh_imperial_diwan: "Centralized Delhi Imperial Diwan"
 STATIC_MODIFIER_DESC_oe_eug_dlh_imperial_diwan: "Recalling autonomous viceroys restores direct treasury accounting and imperial control from Delhi."
 STATIC_MODIFIER_NAME_oe_eug_mam_burji_guard: "Burji Mamluk Garrison Reform"
 STATIC_MODIFIER_DESC_oe_eug_mam_burji_guard: "Reforming the Burji garrisons sharpens Mamluk cavalry discipline and northern frontier defense."
 STATIC_MODIFIER_NAME_oe_eug_mam_cairo_centralized: "Cairo Rotation of Syrian Naibs"
 STATIC_MODIFIER_DESC_oe_eug_mam_cairo_centralized: "Regular rotation and direct Cairo audits curb Syrian viceregal overreach while preserving Levant wealth."
 STATIC_MODIFIER_NAME_oe_eug_hun_ottoman_bulwark: "Carpathian-Danubian Bulwark"
 STATIC_MODIFIER_DESC_oe_eug_hun_ottoman_bulwark: "Empowering the frontier Voivode and Ban turns Hungary's borderlands into an iron shield."
 STATIC_MODIFIER_NAME_oe_eug_hun_royal_prerogative: "Hungarian Crown Diet Centralization"
 STATIC_MODIFIER_DESC_oe_eug_hun_royal_prerogative: "Crown Diet statutes curb frontier magnates and restore royal authority from Buda to Brasov."
 oe_eug_dec_chg_restore_yassa.title: "Restore Chagatai's Yassa"
 oe_eug_dec_chg_restore_yassa.desc: "Reassert Almaliq's supreme authority over Transoxiana and the eastern begs, permanently averting the 1347 Chagatai schism."
 oe_eug_dec_chg_restore_yassa.a: "Proclaim the Unified Yassa"
 oe_eug_dec_dlh_audit_viceroys.title: "Dispatch Imperial Diwan Auditors to the Viceroyalties"
 oe_eug_dec_dlh_audit_viceroys.desc: "Send royal auditors from Delhi to restore loyal tax remittance across active provincial viceroyalties."
 oe_eug_dec_dlh_audit_viceroys.a: "Audit the Four Viceroyalties"
 oe_eug_dec_dlh_recentralize_iqtas.title: "Abolish Autonomous Delhi Iqta Viceroyalties"
 oe_eug_dec_dlh_recentralize_iqtas.desc: "Recall and dismantle the four domestic Iqta Viceroyalty seats, placing surviving provinces under Delhi's direct Imperial Diwan."
 oe_eug_dec_dlh_recentralize_iqtas.a: "Centralize under the Imperial Diwan"
 oe_eug_dec_mam_recall_naibs.title: "Recall and Centralize the Syrian Naibs"
 oe_eug_dec_mam_recall_naibs.desc: "Recall the entrenched Damascus and Aleppo Niyabat seats into Cairo's direct rotation system, ending Syrian factional drag."
 oe_eug_dec_mam_recall_naibs.a: "Enact Direct Cairo Rotation"
 oe_eug_dec_hun_crown_diet.title: "Crown Diet: Centralize Transylvania and Slavonia"
 oe_eug_dec_hun_crown_diet.desc: "Use the Hungarian Crown Diet to recall autonomous frontier offices at Brasov and Zagreb into direct royal administration."
 oe_eug_dec_hun_crown_diet.a: "Enact Crown Diet Centralization"
 oe_eug.1.t: "Qazan Khan's Centralization Drive"
 oe_eug.1.d: "Qazan Khan moves to break the entrenched power of the Turko-Mongol amirs across Samarkand, Bukhara, and the Barlas domains. Between the Oxus and Jaxartes, Amir Qazaghan and his confederates quietly rally their banners against Almaliq's decree."
 oe_eug.1.a: "Enforce the Khan's Yassa ruthlessly"
 oe_eug.1.a.tt: "Grants [ShowModifier('oe_eug_chg_yassa_hammer')] (#Y 12#! years), inflames Transoxianan amir hostility, and primes the 1347 East-West split."
 oe_eug.1.b: "Convene a Kurultai at Almaliq and share revenues"
 oe_eug.1.b.tt: "Costs #R 60#! gold and #R 5#! prestige, grants [ShowModifier('oe_eug_chg_yassa_compromise')] (#Y 15#! years), and opens the centralization counter-path."
 oe_eug.2.t: "The 1347 Split: Transoxiana and Moghulistan"
 oe_eug.2.d: "Clash between Qazan Khan and Amir Qazaghan shakes Central Asia to its core. The settled amirs of Samarkand and Bukhara renounce Almaliq's overlordship, while the eastern begs of Zhetysu, Kashgar, and Yarkand prepare to proclaim Moghulistan."
 oe_eug.2.a: "The Khanate Splits: West Transoxiana and East Moghulistan"
 oe_eug.2.a.tt: "Historical split: releases Transoxianan amirs with [ShowModifier('oe_eug_west_transoxiana')] (paving the road for Timur), while the East reorganizes as Moghulistan with [ShowModifier('oe_eug_moghulistan_east')]."
 oe_eug.2.b: "Hold the Realm Together: Restore Chagatai's Yassa!"
 oe_eug.2.b.tt: "Counter-path: costs #R 120#! gold and #R 6#! stability, averts the split, and grants [ShowModifier('oe_eug_chg_yassa_restored')] (#Y 35#! years)."
 oe_eug.3.t: "Tughlugh Timur and the Islamization of Moghulistan"
 oe_eug.3.d: "Across Zhetysu and the Tarim Basin, Tughlugh Timur and the Dughlat begs weigh the realm's spiritual future: embrace Sunni Islam to unite Kashgar, Yarkand, and the steppe clans, or uphold traditional steppe pluralism along the Turpan Silk Road?"
 oe_eug.3.a: "Embrace Sunni Islam and unite Tarim and Zhetysu"
 oe_eug.3.a.tt: "Converts eastern Chagatai and Dughlat to Sunni Islam, grants [ShowModifier('oe_eug_moghul_islamization')] (#Y 30#! years), and strengthens tribal cohesion."
 oe_eug.3.b: "Uphold steppe pluralism and Turpan caravan trade"
 oe_eug.3.b.tt: "Retains existing faith, grants [ShowModifier('oe_eug_silk_road_pluralism')] (#Y 30#! years), and improves relations with Qocho."
 oe_eug.4.t: "Shadow over Samarkand: The Road to Timur"
 oe_eug.4.d: "With eastern overlordship broken, Samarkand and Bukhara become the arena of rival Turko-Mongol amirs. Amid oasis guilds and steppe warbands, ambitious commanders from Barlas and neighboring clans prepare the ground for a coming conqueror."
 oe_eug.4.a: "Anchor power in the urban wealth of Samarkand and Bukhara"
 oe_eug.4.a.tt: "Grants #G +75#! gold and [ShowModifier('oe_eug_samarkand_amirate')] (#Y 25#! years)."
 oe_eug.4.b: "Rally the nomadic Chagatai warbands"
 oe_eug.4.b.tt: "Grants #G +10#! prestige and [ShowModifier('oe_eug_chagatai_warbands')] (#Y 25#! years)."
 oe_eug.5.t: "Delhi Sultanate: The Four Iqta Viceroyalties"
 oe_eug.5.d: "Stretching from the Gangetic plain to the Deccan, the Delhi Sultanate governs its distant marches through four domestic Iqta Viceroyalties at Gulbarga, Dhar, Khambat, and Jaunpur—projecting control without detaching crown lands, yet carrying the seed of provincial autonomy."
 oe_eug.5.a: "Confirm the four Iqta Viceroyalties in Delhi's name"
 oe_eug.5.a.tt: "Installs the four domestic Viceroyalty buildings in owned Gulbarga, Dhar, Khambat, and Jaunpur with [ShowModifier('oe_eug_dlh_iqta_loyal')] and #G +4#! stability."
 oe_eug.5.b: "Pair the four Viceroyalties with imperial treasury audits"
 oe_eug.5.b.tt: "Installs the four Viceroyalties in loyal standing and grants #G +10#! prestige and #G +60#! gold."
 oe_eug.6.t: "Tughluq Overextension: Viceregal Tax-Retention"
 oe_eug.6.d: "Costly campaigns, fiscal strain, and unrest sap Delhi's authority. Across Gulbarga, Dhar, Khambat, and Jaunpur, provincial viceroys begin withholding imperial taxes and tolerating local defiance."
 oe_eug.6.a: "Central authority falters as the viceroyalties turn autonomous"
 oe_eug.6.a.tt: "Costs #R 5#! stability; active Delhi viceroyalties shift to [ShowModifier('oe_eug_dlh_iqta_autonomous')] (control penalty & unrest pressure; counterable via centralization decisions)."
 oe_eug.6.b: "Drain the treasury to keep the viceroys in line"
 oe_eug.6.b.tt: "Costs #R 150#! gold and #R 8#! stability to hold the viceroyalties at [ShowModifier('oe_eug_dlh_iqta_loyal')]."
 oe_eug.7.t: "Delhi's Reckoning with the Provincial Governors"
 oe_eug.7.d: "After years of upheaval, Delhi must decide the fate of its surviving provincial viceroyalties: conciliate the nobility with Firuz-style fiscal moderation, or abolish autonomous viceregal courts in favor of direct imperial diwans."
 oe_eug.7.a: "Conciliate surviving viceroys with fiscal moderation"
 oe_eug.7.a.tt: "Restores [ShowModifier('oe_eug_dlh_iqta_loyal')] on active viceroyalties and grants [ShowModifier('oe_eug_dlh_firuz_settlement')] (#Y 25#! years)."
 oe_eug.7.b: "Abolish the autonomous viceroyalties and centralize"
 oe_eug.7.b.tt: "Costs #R 100#! gold and #R 6#! stability, removes the four viceroyalty buildings cleanly, and grants [ShowModifier('oe_eug_dlh_imperial_diwan')] (#Y 30#! years)."
 oe_eug.8.t: "After Tankiz: The Syrian Naibs of Damascus and Aleppo"
 oe_eug.8.d: "Following the fall of the long-serving viceroy Tankiz, Cairo reorganizes its Syrian administration. The domestic Niyabats of Damascus and Aleppo anchor Levant trade and the northern frontier, while remaining prizes of emir ambition."
 oe_eug.8.a: "Appoint loyal Bahri emirs to Damascus and Aleppo"
 oe_eug.8.a.tt: "Installs Damascus and Aleppo Niyabat buildings with [ShowModifier('oe_eug_mam_naib_loyal')] and grants #G +8#! prestige."
 oe_eug.8.b: "Extract heavier Syrian customs for Cairo's treasury"
 oe_eug.8.b.tt: "Installs both Niyabats and grants #G +80#! gold, but triggers [ShowModifier('oe_eug_mam_naib_factional')] in Damascus and Aleppo."
 oe_eug.9.t: "Bahri to Burji: Syrian Emir Factionalism"
 oe_eug.9.d: "As Barquq's Circassian faction reshapes Cairo in the transition from Bahri to Burji rule, the Naibs of Damascus and Aleppo become focal points of emir rivalry. Shall Cairo crush dissent by arms or buy stability through rotation?"
 oe_eug.9.a: "Lean on the Burji Mamluk guard to awe the emirs"
 oe_eug.9.a.tt: "Grants [ShowModifier('oe_eug_mam_burji_guard')] (#Y 25#! years), while Damascus and Aleppo experience [ShowModifier('oe_eug_mam_naib_factional')] (resolvable by recall decision)."
 oe_eug.9.b: "Fund a settlement and rotate the Syrian Naibs"
 oe_eug.9.b.tt: "Costs #R 90#! gold, restores [ShowModifier('oe_eug_mam_naib_loyal')], and grants [ShowModifier('oe_eug_mam_cairo_centralized')] (#Y 25#! years)."
 oe_eug.10.t: "Hungary: The Voivode of Transylvania and the Frontier"
 oe_eug.10.d: "As dynastic pressures test the Crown of Saint Stephen, the Voivode of Transylvania at Brasov and the Ban at Zagreb stand at the heart of both frontier defense and noble politics. Empower the marches as an iron bulwark, or rein in magnate autonomy via the Crown Diet?"
 oe_eug.10.a: "Empower the frontier Voivode as an iron bulwark"
 oe_eug.10.a.tt: "Confirms [ShowModifier('oe_eug_hun_voivode_loyal')] at Brasov and Zagreb and grants [ShowModifier('oe_eug_hun_ottoman_bulwark')] (#Y 30#! years)."
 oe_eug.10.b: "Curb frontier magnate autonomy through the Crown Diet"
 oe_eug.10.b.tt: "Costs #R 4#! stability, grants [ShowModifier('oe_eug_hun_royal_prerogative')] (#Y 30#! years), and briefly provokes [ShowModifier('oe_eug_hun_voivode_autonomous')]."
 oe_eug.20.t: "Eurasian Governors & Chagatai: Choice Takes Effect"
 oe_eug.90.t: "[TEST] Chagatai 1347 & Eurasian Governors: Readings"
 oe_eug.90.d: "#T Chagatai & Governors State#!\nChagatai(0/1S/2Y) [ROOT.GetCountry.MakeScope.ScriptValue('oe_eug_rd_chg_split')|0]  Delhi(1L/2A/3C) [ROOT.GetCountry.MakeScope.ScriptValue('oe_eug_rd_dlh_state')|0]  Mamluk(1L/2F/3C) [ROOT.GetCountry.MakeScope.ScriptValue('oe_eug_rd_mam_state')|0]  Hungary(1L/2A/3C) [ROOT.GetCountry.MakeScope.ScriptValue('oe_eug_rd_hun_state')|0]\n#T Scheduler#!\nsent [ROOT.GetCountry.MakeScope.ScriptValue('oe_eug_rd_cnt')|0]  ran month [ROOT.GetCountry.MakeScope.ScriptValue('oe_eug_rd_m')|0]"
 oe_eug.90.a: "Close"
 oe_eug.90.b: "Refresh"
