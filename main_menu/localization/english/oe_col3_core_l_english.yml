 STATIC_MODIFIER_DESC_oe_col3_convoy_port_supply_mod: "Tools, seed grain, timber, and provisions landed by the official convoy turn this overseas staging port into a thriving magnet for settlers, construction, and natural growth."
 STATIC_MODIFIER_NAME_oe_col3_frontier_charter_boost_mod: "Ten-Year Frontier Integration Boost"
 STATIC_MODIFIER_DESC_oe_col3_frontier_charter_boost_mod: "Newly chartered overseas settlements and governor seats receive ten years of imperial integration support, lifting control ceiling, monthly control, settler draw, and cultural assimilation while drawing priority road links."
 STATIC_MODIFIER_NAME_oe_col3_convoy_escort_shield_mod: "Ocean Convoy Escort Shield"
 STATIC_MODIFIER_DESC_oe_col3_convoy_escort_shield_mod: "Armed naval escorts patrol our key oceanic trade lanes, markedly strengthening anti-piracy warfare, sea trade efficiency, and light-ship combat readiness."
 STATIC_MODIFIER_NAME_oe_col3_company_dividend_boom_mod: "Chartered Company Dividend Boom"
 STATIC_MODIFIER_DESC_oe_col3_company_dividend_boom_mod: "Homeward-bound Indiamen laden with spices, porcelain, and silver deliver bumper dividends, lifting national trade income, merchant capacity, and burgher satisfaction."
