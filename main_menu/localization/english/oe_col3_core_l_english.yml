 STATIC_MODIFIER_DESC_oe_col3_cartaz_defiance_mod: "Refusing to submit to coercive maritime pass monopolies, heavily gunned merchantmen and escort warships force open the sea lanes, strengthening heavy ships, sea trade efficiency, and trade range."
 STATIC_MODIFIER_NAME_oe_col3_pirate_crackdown_mod: "Oceanic Privateer Crackdown"
 STATIC_MODIFIER_DESC_oe_col3_pirate_crackdown_mod: "Joint naval and chartered-company hunter squadrons sweep privateer anchorages from the sea lanes, boosting anti-piracy warfare, light-ship effectiveness, and commercial revenue."
 STATIC_MODIFIER_NAME_oe_col3_imperial_federation_mod: "Imperial Federation Charter"
 STATIC_MODIFIER_DESC_oe_col3_imperial_federation_mod: "Metropolitan and overseas provinces share parliamentary representation under an imperial federal compact, anchoring subject loyalty, maximum control, diplomatic reputation, and realm-wide cohesion."
 STATIC_MODIFIER_NAME_oe_col3_colonial_autonomy_act_mod: "Colonial Autonomy Charter"
 STATIC_MODIFIER_DESC_oe_col3_colonial_autonomy_act_mod: "The metropole codifies fiscal and local self-government for overseas realms, trading a share of direct subject tribute for durable loyalty, estate harmony, and buoyant oceanic trade."
 STATIC_MODIFIER_NAME_oe_col3_heavy_tariff_crackdown_mod: "Heavy Overseas Tariffs & Crackdown"
 STATIC_MODIFIER_DESC_oe_col3_heavy_tariff_crackdown_mod: "Punitive stamp duties and customs tariffs wring short-term revenue from overseas provinces and subjects, but severely erode colonial loyalty and stoke simmering rebellion."
 STATIC_MODIFIER_NAME_oe_col3_colonial_tea_boycott_mod: "Harbor Tea Protest & Commercial Boycott"
 STATIC_MODIFIER_DESC_oe_col3_colonial_tea_boycott_mod: "Anti-tariff boycotts and harbor protests sweep colonial ports as merchants refuse metropolitan wares, depressing trade revenue, alienating burghers, and fueling unrest."
 STATIC_MODIFIER_NAME_oe_col3_independence_fervor_loc_mod: "Overseas Independence Fervor"
 STATIC_MODIFIER_DESC_oe_col3_independence_fervor_loc_mod: "Provincial congresses and declarations of liberty ignite separatist fervor across this settlement, driving local unrest upward and sharply eroding metropolitan control."
 STATIC_MODIFIER_NAME_oe_col3_post_imperial_trade_pact_mod: "Transoceanic Commonwealth Trade Pact"
 STATIC_MODIFIER_DESC_oe_col3_post_imperial_trade_pact_mod: "A dignified commonwealth settlement preserves preferential sea lanes, mutual trade revenue, and diplomatic goodwill between the metropole and self-governing overseas realms."
 oe_col3_convoy_ready_tt: "The Official Settler Supply Convoy is not on its 3-year cooldown"
 oe_col3_dec_colonial_supply_convoy.title: "Dispatch Official Settler Convoy & Pioneer Supply Fleet"
 oe_col3_dec_colonial_supply_convoy.desc: "Spend 75 gold (3-year cooldown) to charter an official settler and supply fleet: grants a 3-year flat and proportional colonial migration boost nationwide, dispatches 36-month migration streams from our most populous homeland province to our smallest overseas staging port and up to 2 active colonial charters, and lands 500 pioneer peasants and burghers with 5-year port supplies if the hub is below 10,000 inhabitants—breaking overseas new-market stalls."
 oe_col3_dec_colonial_supply_convoy.a: "Weigh Anchor and Supply the Frontier"
 oe_col3_dec_imperial_federation_seat.title: "Grant Imperial Parliament Representation"
 oe_col3_dec_imperial_federation_seat.desc: "From 1700 onward, a metropole facing maturing overseas provinces and colonial subjects may embrace the Imperial Federation path by granting parliamentary seats to overseas governorates and loyal colonies. Requires at least 10 Stability and no active heavy tariff crackdown; grants the 40-year Imperial Federation Charter, lowers all colonial subjects' liberty desire by 25, and convenes the Federation Ceremony."
 oe_col3_dec_imperial_federation_seat.a: "Seal the Imperial Federation Charter"
 oe_col3_dec_colonial_autonomy_act.title: "Enact the Colonial Autonomy Charter"
 oe_col3_dec_colonial_autonomy_act.desc: "From 1700 onward, when overseas tariff disputes and commercial boycotts threaten imperial unity, the realm may spend 150 gold to enact the Colonial Autonomy Charter: immediately ends any harbor tea boycott, grants the 30-year Colonial Autonomy Charter, lowers all colonial subjects' liberty desire by 20, and opens the Transoceanic Commonwealth Trade Pact."
 oe_col3_dec_colonial_autonomy_act.a: "Proclaim the Colonial Autonomy Charter"
