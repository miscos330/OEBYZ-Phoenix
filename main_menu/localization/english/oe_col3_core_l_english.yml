 AUTO_MODIFIER_DESC_oe_col3_bureau_network_auto: "Anchored by operational Colonial Recruitment & Outfitting Bureaus, a coordinated nationwide emigration network provides steady flat and proportional colonial migration growth alongside lower charter upkeep."
