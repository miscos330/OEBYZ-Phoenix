 oe_col3_colonial_recruitment_bureau: "Colonial Recruitment & Outfitting Bureau"
 oe_col3_colonial_recruitment_bureau_desc: "A state-chartered emigration and outfitting bureau stationed at major ports, market centers, and overseas staging harbors to recruit homesteaders, issue passage contracts, and coordinate colonial supplies. Operating at least one bureau nationwide activates the national Recruitment Bureau Network, injecting flat colonial migration to break overseas new-market stalls."
 oe_col3_recruitment_bureau_upkeep: "Emigration Ledgers & Outfitting Upkeep"
 oe_col3_colonial_governor_palace: "Overseas Colonial Governor's Palace"
 oe_col3_colonial_governor_palace_desc: "A grand provincial seat of imperial governance erected in overseas towns and cities. Serving as a regional proximity source (+35), it raises maximum control, monthly control growth, and cultural assimilation speed while anchoring overseas trunk roads."
 oe_col3_governor_palace_upkeep: "Viceroyal Chancery & Household Upkeep"
 oe_col3_chartered_company_law: "Chartered Trading Company Law"
 oe_col3_chartered_company_law_desc: "Governs how the realm administers oceanic trade routes, overseas factories, and colonial monopolies: retaining maritime commerce under crown monopoly, chartering joint-stock trading companies, or opening free ports to spur migration and competition."
 oe_col3_pol_crown_monopoly_trade: "Royal Maritime Monopoly"
 oe_col3_pol_crown_monopoly_trade_desc: "Following the model of royal maritime houses and state shipping bureaus, the crown directly monopolizes spice, bullion, and colonial tribute, strengthening royal power and fiscal receipts at the cost of burgher discontent."
 oe_col3_pol_joint_stock_charter: "Chartered Joint-Stock Company"
 oe_col3_pol_joint_stock_charter_desc: "Grants royal charters and oceanic trading privileges to joint-stock merchant companies, mobilizing private capital to expand merchant capacity, sea trade efficiency, and commercial reach while ceding a measure of crown sway."
 oe_col3_pol_free_port_competition: "Free Port & Open Competition"
 oe_col3_pol_free_port_competition_desc: "Dismantles restrictive maritime monopolies and opens overseas harbors to competing merchants and settlers, lowering charter costs, accelerating colonial migration, and securing lasting loyalty from overseas subjects."
 oe_col3_cab_charter_monopoly: "Audit Chartered Monopoly & Dividends"
