 oe_navy_ousiakos_1: "Ousiakos Light Sailship"
 oe_navy_ousiakos_1_desc: "The Ousiakos carries an old name of the imperial warship into a new age. Patrolling trade routes and straits, these swift vessels hunt pirates, escort merchants and defend the emperor's waters with speed and capable guns. This generation retains traditional rigging and shipboard weapons.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla naval advance #Y Barque#! (full chain: Barque -> Caravel -> Pinnace -> Frigate -> Heavy Frigate); upgrade directly in the fleet panel once researched."
