 oe_navy_dromon_5: "Dromon Two-Decker"
 oe_navy_dromon_5_desc: "The Dromon bears the majesty of the imperial battle fleet. Its broad, reinforced hull carries armoured marines and concentrated firepower. From Greek-fire siphons to banks of heavy guns, breaking enemy ships takes precedence over chasing their sails. Standardised designs and fleet drill improve coordination at sea.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Two-decker#!; final tier unlocks via #Y Three-decker#! — upgrade directly in the fleet panel."
 oe_navy_dromon_6: "Dromon Three-Decker"
 oe_navy_dromon_6_desc: "The Dromon bears the majesty of the imperial battle fleet. Its broad, reinforced hull carries armoured marines and concentrated firepower. From Greek-fire siphons to banks of heavy guns, breaking enemy ships takes precedence over chasing their sails. Generations of imperial shipwrights and naval officers have refined this mature design.\n\n#Y Era Upgrade Path:#! Final era tier, unlocked automatically by the vanilla naval advance #Y Three-decker#!."
 oe_navy_chelandion_1: "Chelandion War Transport"
 oe_navy_chelandion_1_desc: "Descended from the Dromon tradition, the Chelandion carries the armies of the empire. Spacious holds accommodate troops and provisions, while a strengthened hull and defensive armament allow it to resist attackers until its escorts arrive. This generation retains traditional rigging and shipboard weapons.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla naval advance #Y Hulk#! (full chain: Hulk -> Flute -> Brig -> Merchantman -> East-Indiaman); upgrade directly in the fleet panel once researched."
