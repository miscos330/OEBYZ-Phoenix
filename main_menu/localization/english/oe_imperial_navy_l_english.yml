 oe_navy_dromon_1: "Dromon Warship"
 oe_navy_dromon_1_desc: "The Dromon bears the majesty of the imperial battle fleet. Its broad, reinforced hull carries armoured marines and concentrated firepower. From Greek-fire siphons to banks of heavy guns, breaking enemy ships takes precedence over chasing their sails. This generation retains traditional rigging and shipboard weapons.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla naval advance #Y Early Carrack#! (full chain: Early Carrack -> Carrack -> Galleon -> Two-decker -> Three-decker); upgrade directly in the fleet panel once researched."
 oe_navy_dromon_2: "Dromon Heavy Carrack"
 oe_navy_dromon_2_desc: "The Dromon bears the majesty of the imperial battle fleet. Its broad, reinforced hull carries armoured marines and concentrated firepower. From Greek-fire siphons to banks of heavy guns, breaking enemy ships takes precedence over chasing their sails. Improved rigging and shipbuilding renew the old tradition.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Early Carrack#!; next tier unlocks via #Y Carrack#! (followed by Galleon -> Two-decker -> Three-decker) — upgrade directly in the fleet panel."
 oe_navy_dromon_3: "Dromon Oceanic Carrack"
 oe_navy_dromon_3_desc: "The Dromon bears the majesty of the imperial battle fleet. Its broad, reinforced hull carries armoured marines and concentrated firepower. From Greek-fire siphons to banks of heavy guns, breaking enemy ships takes precedence over chasing their sails. Experience at sea brings advances in hull construction and armament.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Carrack#!; next tier unlocks via #Y Galleon#! (followed by Two-decker -> Three-decker) — upgrade directly in the fleet panel."
