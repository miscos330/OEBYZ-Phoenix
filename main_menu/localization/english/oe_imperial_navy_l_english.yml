 oe_navy_karabisian_1: "Karabisian Galley"
 oe_navy_karabisian_1_desc: "The Karabisian preserves the name of the empire's early standing fleet. Disciplined oarsmen, helmsmen familiar with the straits and devastating close-range fire make these warships a dependable shield among the islands and narrow seas. This generation retains traditional rigging and shipboard weapons.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla naval advance #Y Mediterranean Galley#! (full chain: Mediterranean Galley -> War Galley -> Italian Galleass / Galleass -> Xebec -> Enlightenment); upgrade directly in the fleet panel once researched."
