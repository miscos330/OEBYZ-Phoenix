l_english:
 STATIC_MODIFIER_NAME_oe_trg_kephale_rule: "Under a Katholike Kephale"
 STATIC_MODIFIER_DESC_oe_trg_kephale_rule: "A katholike kephale governs this province's great region. Loyalty target #G +5#!, each of the five office efficiencies #G +5#!. Renewed every year; ends when the kephale leaves office."
 STATIC_MODIFIER_NAME_oe_trg_kephale_defiant: "A Defiant Kephale"
 STATIC_MODIFIER_DESC_oe_trg_kephale_defiant: "The great region's kephale ignores the capital. The kephale's bonus turns into loyalty target #R −5#!, and the office efficiencies get nothing."
 oe_trg_region_1: "Thrace"
 oe_trg_region_2: "Macedonia and Thessaly"
 oe_trg_region_3: "Hellas and the Islands"
 oe_trg_region_4: "Danube and Illyricum"
 oe_trg_region_5: "Western Anatolia"
 oe_trg_region_6: "Eastern Anatolia"
 oe_trg_region_7: "Italy"
 oe_trg_region_8: "Overseas"
 OE_TRG_REGION_NONE: "the region"
 oe_trg_appoint: "Appoint a Katholike Kephale"
 oe_trg_appoint_desc: "Choose an adult of the court (not the emperor or the heir) to govern a great region as [Concept('oe_tu_kephale','katholike kephale')|e], for #R 3#! [oe_tu_authority|e]. Only regions with at least #Y 2#! provinces and no kephale can be chosen.\n\nWhile the kephale holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends when the kephale dies, leaves the court, takes the throne or is dismissed.\n\nA kephale whose house has at least #Y 500#! influence, or who governs #Y 4#! or more provinces and has an ability of #Y 70#! or more, grows overmighty: they may ignore orders, or ask for their region as an appanage.\n\nThe eight great regions: Thrace, Macedonia and Thessaly, Hellas and the Islands, Danube and Illyricum, Western Anatolia, Eastern Anatolia, Italy, Overseas.\n\n#F In the fourteenth century the empire set katholikai kephalai over groups of katepanikia, usually relatives of the emperor or sons of great families. By the end of the century the post was gone, replaced by despotates held by princes.#!"
 oe_trg_appoint.tt: "Costs #R 3#! [oe_tu_authority|e] once a region is chosen."
 oe_trg_allow_auth: "Imperial Authority is at least #Y 3#!"
 oe_trg_allow_open: "At least one great region has #Y 2#! or more provinces and no kephale"
 OE_TRG_SELECT: "Choose the kephale"
 OE_TRG_NONE: "@trigger_no!No suitable person at court"
 oe_trg_dismiss: "Dismiss a Katholike Kephale"
 oe_trg_dismiss_desc: "Dismiss a [Concept('oe_tu_kephale','katholike kephale')|e]; their region loses 'Under a Katholike Kephale'.\n\nIf the kephale has grown overmighty (house influence #Y 500#! or more, or #Y 4#! or more provinces and an ability of #Y 70#! or more), every province of the region loses #R 5#! loyalty (also in the loyalty target for #Y 5#! years) and their house loses #Y 50#! influence."
 oe_trg_dismiss.tt: "The kephale leaves office. If the kephale was overmighty: every province of the region loyalty #R −5#! (also in the loyalty target for #Y 5#! years), their house #Y −50#! influence."
 oe_trg_allow_any: "At least one katholike kephale is in office"
 OE_TRG_SELECT_DISMISS: "Choose the kephale to dismiss"
 OE_TRG_NONE_DISMISS: "@trigger_no!No kephale in office"
 oe_trg.1.t: "Appointing a Katholike Kephale"
 oe_trg.1.d: "In the fourteenth century the basic unit of the empire was the katepanikion, held by a kephale with civil and military powers. To coordinate several neighbouring districts the emperor sometimes set a katholike kephale over them, usually a relative of his or a son of a great family. By the end of the century the post had disappeared, as despotates held by princes took its place.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName] awaits the emperor's command. Choose the region [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] will govern; the appointment costs #R 3#! Imperial Authority. Only regions with at least #Y 2#! provinces and no kephale are listed."
 oe_trg.1.r1: "Govern Thrace ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_1').GetValue|0] provinces)"
 oe_trg.1.r1.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Thrace. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.r2: "Govern Macedonia and Thessaly ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_2').GetValue|0] provinces)"
 oe_trg.1.r2.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Macedonia and Thessaly. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.r3: "Govern Hellas and the Islands ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_3').GetValue|0] provinces)"
 oe_trg.1.r3.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Hellas and the Islands. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.r4: "Govern Danube and Illyricum ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_4').GetValue|0] provinces)"
 oe_trg.1.r4.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Danube and Illyricum. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
