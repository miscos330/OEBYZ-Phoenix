 oe_trg.1.r5.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Western Anatolia. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.r6: "Govern Eastern Anatolia ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_6').GetValue|0] provinces)"
 oe_trg.1.r6.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Eastern Anatolia. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.r7: "Govern Italy ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_7').GetValue|0] provinces)"
 oe_trg.1.r7.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Italy. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.r8: "Govern Overseas ([GetCountry('BYZ').MakeScope.GetVariable('oe_trg_n_8').GetValue|0] provinces)"
 oe_trg.1.r8.tt: "#R −3#! [oe_tu_authority|e]\n[SCOPE.sCharacter('oe_trg_kephale').GetName] becomes [Concept('oe_tu_kephale','katholike kephale')|e] of Overseas. While [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] holds office every province of the region is 'Under a Katholike Kephale' (renewed every year): loyalty target #G +5#!, each of the five office efficiencies #G +5#!. The office ends on death, departure from the court, accession or dismissal."
 oe_trg.1.x: "Not now"
 oe_trg.1.x.tt: "No [oe_tu_authority|e] is spent; nothing else happens."
 oe_trg.2.t: "The Kephale Defies the Capital"
 oe_trg.2.d: "A kephale with too much power soon treats the region as a private domain. When civil war broke out in 1341 the commanders of many towns and forts went over to whichever side seemed to be winning, and the capital's orders counted for nothing beyond its gates.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName], katholike kephale of [GetCountry('BYZ').Custom('OeTrgEvRegion')], has held back the men and money the capital demanded and writes that local business comes first. The governors of [GetCountry('BYZ').Custom('OeTrgEvRegion')] are watching to see what the emperor will do."
 oe_trg.2.a: "Dismiss [SCOPE.sCharacter('oe_trg_kephale').GetHerHim]"
 oe_trg.2.a.tt: "[SCOPE.sCharacter('oe_trg_kephale').GetName] leaves office; [GetCountry('BYZ').Custom('OeTrgEvRegion')] has no kephale\nEvery province of [GetCountry('BYZ').Custom('OeTrgEvRegion')]: loyalty #R −5#! (also in the loyalty target for #Y 5#! years)\nIf [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] was born to a house on the roll: that house #Y −50#! influence"
 oe_trg.2.b: "Give way and accept [SCOPE.sCharacter('oe_trg_kephale').GetHerHis] arrangements"
 oe_trg.2.b.tt: "#R −3#! [oe_tu_authority|e]\nIf [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] was born to a house on the roll: that house #Y +50#! influence\n[SCOPE.sCharacter('oe_trg_kephale').GetName] stays in office and makes no more trouble for #Y 5#! years"
 oe_trg.2.c: "A reprimand will do"
 oe_trg.2.c.tt: "Every province of [GetCountry('BYZ').Custom('OeTrgEvRegion')] gets 'A Defiant Kephale' for #Y 2#! years: the kephale's bonus turns into loyalty target #R −5#! and the office efficiencies get nothing\n[SCOPE.sCharacter('oe_trg_kephale').GetName] stays in office"
 oe_trg.3.t: "The Kephale Asks for an Appanage"
 oe_trg.3.da: "In 1349 the despot Manuel Kantakouzenos, son of John VI, took up the government of the Morea and ruled it as a half-independent land; later Thessalonica too was handed to imperial princes more than once. This is how the regional kephale gave way to the despotate held as an appanage.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName], katholike kephale of [GetCountry('BYZ').Custom('OeTrgEvRegion')], asks for [GetCountry('BYZ').Custom('OeTrgEvRegion')] as [SCOPE.sCharacter('oe_trg_kephale').GetHerHis] appanage. [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] is of the imperial house and may be granted it: [SCOPE.sCountry('oe_trg_fief').GetName], the largest heartland province of [GetCountry('BYZ').Custom('OeTrgEvRegion')], would become a despotate with [SCOPE.sCharacter('oe_trg_kephale').GetHerHim] as despot."
 oe_trg.3.db: "In 1349 the despot Manuel Kantakouzenos, son of John VI, took up the government of the Morea and ruled it as a half-independent land; later Thessalonica too was handed to imperial princes more than once. This is how the regional kephale gave way to the despotate held as an appanage.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName], katholike kephale of [GetCountry('BYZ').Custom('OeTrgEvRegion')], asks for [GetCountry('BYZ').Custom('OeTrgEvRegion')] as [SCOPE.sCharacter('oe_trg_kephale').GetHerHis] appanage. By custom only members of the imperial house are granted despotates, and [GetCountry('BYZ').Custom('OeTrgEvRegion')] may have no heartland province to grant. The emperor can only refuse or offer something else."
 oe_trg.3.a: "Grant it as a despotate"
 oe_trg.3.a.tt: "[SCOPE.sCountry('oe_trg_fief').GetName] becomes a despotate and sends #Y 5%#! of its monthly income to the treasury\n[SCOPE.sCharacter('oe_trg_kephale').GetName] moves to [SCOPE.sCountry('oe_trg_fief').GetName] as its despot; the former governor returns to court\n[SCOPE.sCharacter('oe_trg_kephale').GetName] leaves the office of kephale; [GetCountry('BYZ').Custom('OeTrgEvRegion')] has no kephale"
 oe_trg.3.b: "Honours and estates instead"
 oe_trg.3.b.tt: "#R −3#! [oe_tu_authority|e]\nIf [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] was born to a house on the roll: that house #Y +50#! influence\n[SCOPE.sCharacter('oe_trg_kephale').GetName] stays in office and makes no more trouble for #Y 5#! years"
 oe_trg.3.c: "Refuse and dismiss [SCOPE.sCharacter('oe_trg_kephale').GetHerHim]"
 oe_trg.3.c.tt: "[SCOPE.sCharacter('oe_trg_kephale').GetName] leaves office; [GetCountry('BYZ').Custom('OeTrgEvRegion')] has no kephale\nEvery province of [GetCountry('BYZ').Custom('OeTrgEvRegion')]: loyalty #R −5#! (also in the loyalty target for #Y 5#! years)\nIf [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] was born to a house on the roll: that house #Y −50#! influence"
 oe_trg.4.t: "A Kephale's Office Falls Vacant"
 oe_trg.4.d: "[SCOPE.sCharacter('oe_trg_gone').GetName] no longer governs [GetCountry('BYZ').Custom('OeTrgEvRegion')] as katholike kephale: [SCOPE.sCharacter('oe_trg_gone').GetSheHe] has died, left the court or taken the throne. The provinces of [GetCountry('BYZ').Custom('OeTrgEvRegion')] are no longer 'Under a Katholike Kephale'; a new kephale can be appointed from the Pillars of the Empire."
 oe_trg.4.a: "We shall find another"
 oe_trg.4.a.tt: "Nothing else happens."
 oe_trg.2.d_pre: "A kephale with too much power soon treats the region as a private domain. In the civil war of 1321 to 1328 between the two Andronikoi, the commanders of many towns and forts went over to whichever side seemed to be winning, and the capital's orders counted for nothing beyond its gates.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName], katholike kephale of [GetCountry('BYZ').Custom('OeTrgEvRegion')], has held back the men and money the capital demanded and writes that local business comes first. The governors of [GetCountry('BYZ').Custom('OeTrgEvRegion')] are watching to see what the emperor will do."
 oe_trg.3.da_pre: "From 1316 to 1322 Andronikos Asen, a nephew of Andronikos II, governed the Morea and took several castles in Arcadia from the Latins. A great command in the hands of the emperor's kin was one step from an appanage.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName], katholike kephale of [GetCountry('BYZ').Custom('OeTrgEvRegion')], asks for [GetCountry('BYZ').Custom('OeTrgEvRegion')] as [SCOPE.sCharacter('oe_trg_kephale').GetHerHis] appanage. [SCOPE.sCharacter('oe_trg_kephale').GetSheHe] is of the imperial house and may be granted it: [SCOPE.sCountry('oe_trg_fief').GetName], the largest heartland province of [GetCountry('BYZ').Custom('OeTrgEvRegion')], would become a despotate with [SCOPE.sCharacter('oe_trg_kephale').GetHerHim] as despot."
 oe_trg.3.db_pre: "From 1316 to 1322 Andronikos Asen, a nephew of Andronikos II, governed the Morea and took several castles in Arcadia from the Latins. A great command in the hands of the emperor's kin was one step from an appanage.\n\n[SCOPE.sCharacter('oe_trg_kephale').GetName], katholike kephale of [GetCountry('BYZ').Custom('OeTrgEvRegion')], asks for [GetCountry('BYZ').Custom('OeTrgEvRegion')] as [SCOPE.sCharacter('oe_trg_kephale').GetHerHis] appanage. By custom only members of the imperial house are granted despotates, and [GetCountry('BYZ').Custom('OeTrgEvRegion')] may have no heartland province to grant. The emperor can only refuse or offer something else."
