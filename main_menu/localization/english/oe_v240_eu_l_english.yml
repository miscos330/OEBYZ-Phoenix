# NEW 2026-11-24 v24.0 Phase 2A-2C Early-1337 Historical Opening Depth Pack Europe & Steppes (oe_v240_eu_, gen_v240_1337_europe_depth.py) — english localization (235 keys). Edit gen_v240_1337_europe_depth.py, not this file.
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_wool_crisis:0 "Wool Embargo Mediation"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_wool_crisis:0 "Burgher envoys from Ghent and Bruges negotiate to reopen English wool shipments, easing guild unrest despite temporary loom shortages."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_french_loyalist:0 "Loyalty to the French Crown"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_french_loyalist:0 "Standing by Philip VI and seizing English staples earns noble backing and Parisian gratitude while straining Flemish wool ports."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_alt_staple:0 "Alternative Wool Staples"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_alt_staple:0 "Emergency subsidies bring Castilian and northern raw wool to Flemish looms, keeping Ghent and Bruges workshops humming."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_artevelde_council:0 "Artevelde's Council of Three Towns"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_artevelde_council:0 "Captain-General Jacob van Artevelde unites Ghent, Bruges, and Ypres in a civic league that revives cloth production and maritime trade."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_comital_authority:0 "Restored Comital Authority"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_comital_authority:0 "Count Louis rallies his chivalry at Bruges to restrain the Ghent guilds and reassert comital authority across Flanders."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_ghent_pact:0 "1340 Ghent Vrijdagmarkt Pact"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_ghent_pact:0 "Acclaiming Edward III on Ghent's Vrijdagmarkt secures full English wool privileges and joint North Sea convoy protection."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_eng_flemish_staple:0 "Flemish Wool Staple & Channel Allies"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_eng_flemish_staple:0 "Flemish recognition opens Bruges and Ghent to English wool convoys, swelling royal customs and Channel naval reach."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_fla_armed_neutrality:0 "Flemish Armed Neutrality"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_fla_armed_neutrality:0 "Maintaining armed neutrality between Paris and London shields Flemish cities behind disciplined militias and cautious diplomacy."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_elder_union:0 "Elder Capetian Marital Union"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_elder_union:0 "Coordinated chancelleries across Dijon, Dole, and Arras weave Burgundy, Franche-Comte, and Artois into a cohesive dynastic bloc."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_saone_knights:0 "Chivalry of the Saone"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_saone_knights:0 "Favoring the ducal domain's feudal hosts produces a formidable corps of Burgundian heavy lancers along the Saone."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_valois_bridge:0 "Burgundian Succession Charter"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_valois_bridge:0 "The Estates of Burgundy codify indivisible ducal succession during the Elder Capetian twilight, smoothing the transition to future greatness."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bur_imperial_tilt:0 "Imperial Franche-Comte Pivot"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bur_imperial_tilt:0 "Anchoring the dynasty in Imperial Franche-Comte strengthens overland Alpine commerce and strategic leverage against Paris."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_montfort_cause:0 "House of Montfort Maritime Pact"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_montfort_cause:0 "Backing John of Montfort links Breton harbors with English sea lanes, sharpening coastal defense and maritime trade."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_blois_cause:0 "House of Blois & Conflans Decree"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_blois_cause:0 "Upholding the Arret de Conflans aligns Brittany's baronage with French chivalry and orthodox ducal legitimacy."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_hennebont_bastion:0 "Defiance of Hennebont"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_hennebont_bastion:0 "Inspired by Joanna of Flanders's defense of Hennebont, Breton march castles and coastal garrisons endure sieges with steel resolve."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bri_malestroit_truce:0 "Truce of Malestroit Recovery"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bri_malestroit_truce:0 "The papally brokered Truce of Malestroit gives Breton ports breathing room to rebuild salt convoys and civic prosperity."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_por_rio_salado:0 "Victors of Rio Salado"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_por_rio_salado:0 "Setting aside border feuds to crush the Marinid host at Rio Salado crowns King Afonso IV with Iberian martial renown."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_por_atlantic_watch:0 "Algarve & Atlantic Watch"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_por_atlantic_watch:0 "Prioritizing Lisbon's royal squadrons secures the Algarve coast and trains a generation of Atlantic mariners."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_por_coimbra_order:0 "Coimbra Dynastic Council"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_por_coimbra_order:0 "Firm royal arbitration at Coimbra contains Castilian exile factions around Crown Prince Pedro and steadies court administration."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_munich_jurists:0 "Munich Imperial Jurists"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_munich_jurists:0 "Sheltering William of Ockham and imperial scholars in Munich invigorates statecraft, jurisprudence, and antipapal prestige."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_avignon_embassy:0 "Avignon Conciliation Embassy"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_avignon_embassy:0 "Conciliatory envoys to Pope Benedict XII soothe German prelates and ease the domestic burden of papal censure."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_licet_iuris:0 "Declaration of Rhense & Licet iuris"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_licet_iuris:0 "Proclaiming Licet iuris after the Electoral Diet of Rhense affirms that imperial sovereignty flows directly from the Electors, not Avignon."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_rhense_compact:0 "Electoral League of Rhense"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_rhense_compact:0 "Framing Rhense as a defensive electoral league secures princely solidarity while keeping diplomatic bridges open."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_alpine_corridor:0 "Wittelsbach Alpine Corridor"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_alpine_corridor:0 "Securing the Tyrolean passes links Bavaria to Italian commerce and Alpine revenues at the price of fierce Luxembourg rivalry."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_ubv_reichsfrieden:0 "Bavarian-Luxembourg Reichsfrieden"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_ubv_reichsfrieden:0 "Restraining Wittelsbach claims in Tyrol preserves imperial peace with Bohemia and calms restive German estates."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_trinacria_defiance:0 "Defiance of Trinacria"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_trinacria_defiance:0 "Honoring Frederick III's legacy, Trinacria defies both Papal interdict and Angevin fleets with stubborn island resilience."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_papal_overture:0 "Palermo Curial Overture"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_papal_overture:0 "Envoys from Palermo petition Avignon to lift the interdict, calming Sicilian clergy and reopening Mediterranean lanes."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_catalan_faction:0 "Catalan Faction of Catania"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_catalan_faction:0 "Empowering the Alagona and Catalan barons at Catania stiffens military discipline and ties Sicily tightly to Aragon."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_latin_faction:0 "Latin Barons of Palermo"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_latin_faction:0 "Accommodating the Chiaramonte and native Latin magnates restores Palermo's customs yield and baronial cooperation."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_randazzo_regency:0 "Regency of John of Randazzo"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_randazzo_regency:0 "Duke John of Randazzo imposes firm royal arbitration between rival baronial cliques, salvaging crown control."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_catania_peace:0 "1347 Peace of Catania"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_catania_peace:0 "The Treaty of Catania halts decades of Angevin raids, reviving Sicily's rich grain exports and coastal markets."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_sic_messina_bastion:0 "Bastion of the Messina Strait"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_sic_messina_bastion:0 "Refusing Neapolitan tribute, Sicily fortifies Messina and Syracuse and drills war galleys to command the Strait."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_laupen_halberds:0 "Halberdiers of Laupen"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_laupen_halberds:0 "Marching to relieve Bern at Laupen in 1339 proves Swiss halberd-and-pike squares can shatter armored feudal chivalry."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_gotthard_tolls:0 "St. Gotthard Pass Guardians"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_gotthard_tolls:0 "Guarding the St. Gotthard mountain highway channels steady Alpine transit tolls while conserving canton levies."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_zurich_pact:0 "1351 Eternal Pact of Zurich"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_zurich_pact:0 "Mayor Rudolf Brun's guild republic of Zurich enters the Swiss Confederacy, marrying urban trade wealth with Alpine arms."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_limmat_trade:0 "Limmat Commercial Accord"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_limmat_trade:0 "A cautious commercial treaty with Zurich captures regional trade without triggering immediate Habsburg retaliation."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_eight_cantons:0 "Eight Old Cantons (Acht Alte Orte)"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_eight_cantons:0 "Bern's 1353 Eternal Pact completes the Eight Old Cantons, cementing the Swiss Confederacy as Central Europe's Alpine bulwark."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swi_forest_autonomy:0 "Forest Cantons Compact"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swi_forest_autonomy:0 "Preserving the tight-knit Forest Cantons compact focuses governance and fortifications on the Alpine inner valleys."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_atterdag_rising:0 "Atterdag's National Rising"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_atterdag_rising:0 "Niels Ebbesen's strike at Randers shatters Holstein's mortgage rule and rallies Jutland behind Valdemar IV Atterdag's return."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_holstein_redemption:0 "Gradual Pawn Redemption"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_holstein_redemption:0 "Negotiated mortgage redemptions with the Holstein counts avoid open bloodshed while steadily restoring crown estates."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_crown_redemption:0 "Atterdag's Crown Redemption"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_crown_redemption:0 "Turning Baltic silver into redeemed Zealand and Jutland castles rebuilds a centralized, solvent Danish monarchy."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_dan_baltic_reach:0 "Danish Baltic Reach"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_dan_baltic_reach:0 "Holding onto eastern Baltic strongholds preserves Denmark's maritime prestige and trains seasoned northern crews."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swe_landslag:0 "Magnus Eriksson's Landslag"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swe_landslag:0 "Promulgating Sweden's first unified National Law Code protects free yeomen and strengthens royal fiscal authority."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_swe_riksrad_compact:0 "Compact with the Riksråd"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_swe_riksrad_compact:0 "Granting constitutional concessions to the Swedish Council of the Realm rallies noble purses and cavalry behind the crown."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_posada_legacy:0 "Legacy of Posada"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_posada_legacy:0 "The memory of Posada emboldens Wallachian mountain garrisons as Basarab I anchors an independent Carpathian voivodeship."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_danube_charter:0 "Danube & Saxon Transit Charter"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_danube_charter:0 "Easing border tensions with Buda opens lucrative overland trade between Transylvanian Saxon towns and the lower Danube."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_metropolitanate:0 "Metropolitanate of Ungro-Wallachia"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_metropolitanate:0 "Canonical recognition from Constantinople establishes the Metropolitanate of Ungro-Wallachia, fortifying Orthodox statehood."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_wal_carpathian_balance:0 "Carpathian Diplomatic Balance"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_wal_carpathian_balance:0 "Balancing Orthodox heritage with pragmatic ties to Hungary safeguards Wallachia's borders and mercantile corridors."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_kotromanic_balance:0 "Kotromanic Religious Balance"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_kotromanic_balance:0 "Admitting the Franciscan Vicariate while quietly tolerating native Krstjani lords shields Bosnia from crusades and civil strife."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_krstjani_bastion:0 "Bastion of the Bosnian Church"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_krstjani_bastion:0 "Openly championing the native Bosnian Church unites highland magnates into a fierce mountain defense against foreign meddling."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_srebrenica_silver:0 "Srebrenica Silver & Ragusan Charter"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_srebrenica_silver:0 "Saxon miners at Srebrenica and customs charters with Ragusa turn Bosnia's mountain silver into booming fiscal wealth."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_bos_royal_citadels:0 "Bosnian Royal Citadels"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_bos_royal_citadels:0 "Channeling silver revenues into mountain fortresses and ducal garrisons deters ambitious neighbors on every frontier."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_tve_rurikid_pride:0 "Tverian Rurikid Defiance"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_tve_rurikid_pride:0 "Alexander Mikhailovich's return kindles fierce Tverian pride, steeling Volga levies against Muscovite intrigue."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_tve_sarai_yarlyk:0 "Sarai Yarlyk Diplomacy"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_tve_sarai_yarlyk:0 "Lavish tribute and nimble diplomacy at Uzbeg Khan's court steady Tver's patent of rule and Volga trade routes."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_psk_bolotovo_charter:0 "1348 Treaty of Bolotovo"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_psk_bolotovo_charter:0 "The Treaty of Bolotovo secures Pskov's full judicial and political independence as Novgorod's autonomous younger brother."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_psk_izborsk_shield:0 "Shield of Izborsk"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_psk_izborsk_shield:0 "Reinforcing the limestone ramparts of Izborsk and Pskov hardens Rus's northwestern shield against Baltic raids."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_dzeglis_deda:0 "Dzeglis Deda Royal Code"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_dzeglis_deda:0 "Having expelled Mongol garrisons, George V the Brilliant promulgates the Dzeglis Deda code, restoring royal law across the Caucasus."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_giorgauli_mint:0 "Giorgauli Silver Coinage"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_giorgauli_mint:0 "Striking pure silver Giorgauli coins revives Tbilisi's Silk-Road bazaars linking Tabriz to Black Sea harbors."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_bagratid_zenith:0 "Bagratid Caucasus Zenith"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_bagratid_zenith:0 "Reuniting Imereti and binding Samtskhe under Tbilisi crowns George V's reign as medieval Georgia's triumphant golden autumn."
 STATIC_MODIFIER_NAME_oe_v240_eu_mod_geo_holy_cross:0 "Custodians of the Holy Cross"
 STATIC_MODIFIER_DESC_oe_v240_eu_mod_geo_holy_cross:0 "Diplomatic triumph in Cairo and Constantinople restores Georgia's historic Monastery of the Holy Cross in Jerusalem."
 oe_v240_eu.1.t:0 "The English Wool Embargo on Flanders"
 oe_v240_eu.1.d:0 "As war clouds gather across the Channel, King Edward III of England has abruptly halted raw wool exports to Flanders to punish Count Louis I of Dampierre for his fealty to Philip VI of France. Looms stand silent from Ghent to Ypres, weavers crowd the guildhalls demanding bread, and our council must choose how to answer England's economic stranglehold."
 oe_v240_eu.1.a:0 "Allow Ghent and Bruges envoys to negotiate English wool concessions"
 oe_v240_eu.1.b:0 "Stand firmly by Philip VI and confiscate English staples in Bruges"
 oe_v240_eu.1.c:0 "Subsidize emergency Castilian and Baltic wool shipments"
 oe_v240_eu.2.t:0 "Captain-General Jacob van Artevelde of Ghent"
 oe_v240_eu.2.d:0 "Starved of English fleeces and outraged by royal interference, the guilds of Ghent have elected the wealthy draper Jacob van Artevelde as Hoofdman and formed a coalition of the Three Good Towns — Ghent, Bruges, and Ypres. Artevelde promises to broker Flemish neutrality and reopen the looms, though his civic regime eclipses the Count's feudal court."
 oe_v240_eu.2.a:0 "Empower Jacob van Artevelde and the League of the Three Good Towns"
 oe_v240_eu.2.b:0 "Rally the Count's knights at Bruges to curb the Ghent guilds"
 oe_v240_eu.3.t:0 "The Ghent Proclamation: Edward III's Quartered Arms"
 oe_v240_eu.3.d:0 "On Ghent's Vrijdagmarkt, envoys from London lay a daring bargain before the Flemish estates: to skirt the ruinous papal interdict bound to rebellion against their French liege, Flanders may formally acclaim Edward III as rightful King of France, while Edward quarters the golden lilies with the English leopards and guarantees eternal wool liberties."
 oe_v240_eu.3.a:0 "Acclaim Edward III on the Vrijdagmarkt and seal the Channel Pact"
 oe_v240_eu.3.b:0 "Decline the royal title and maintain armed neutrality between Paris and London"
 oe_v240_eu.4.t:0 "The Two Burgundies & Artois: Eudes IV's Capetian Bloc"
 oe_v240_eu.4.d:0 "Through his marriage to Countess Joan III of Burgundy and Artois, Duke Eudes IV of the Elder Capetian House presides over a remarkable patrimony spanning French Dijon, Imperial Dole in the Franche-Comte, and northern Arras. Unifying the legal registers of these three lordships will forge a proto-Burgundian state straddling France and the Empire."
 oe_v240_eu.4.a:0 "Harmonize the chancelleries of Dijon, Dole, and Arras"
 oe_v240_eu.4.b:0 "Focus on drilling the Duchy's feudal cavalry along the Saone"
 oe_v240_eu.5.t:0 "Twilight of the Elder Capetians & the Valois Bridge"
 oe_v240_eu.5.d:0 "Tragedy strikes the ducal house: Duke Eudes IV's sole son Philip has perished in Gascony, leaving only the infant Philip of Rouvres to carry the Elder Capetian line. Both Paris and Imperial lords eye the succession of Dijon and Dole — urging the Estates of Burgundy to secure an orderly dynastic bridge before the line fails."
 oe_v240_eu.5.a:0 "Codify the Burgundian Estates' charter for an indivisible succession"
 oe_v240_eu.5.b:0 "Anchor the ducal treasury and inheritance firmly toward the Empire"
 oe_v240_eu.6.t:0 "1341 Breton Succession Crisis: Montfort vs Blois"
 oe_v240_eu.6.d:0 "Duke John III of Brittany has died without direct heirs, splitting the peninsula along the great fault line of the Hundred Years' War. His half-brother John of Montfort has seized Nantes and appeals to Edward III of England, while his niece Joan of Penthievre and her husband Charles of Blois invoke the French Court of Peers at Conflans."
 oe_v240_eu.6.a:0 "Back John of Montfort and open Breton harbors to English relief"
 oe_v240_eu.6.b:0 "Honor the Arret de Conflans and rally behind Charles of Blois"
 oe_v240_eu.7.t:0 "Hennebont's Defiance & the Truce of Malestroit"
 oe_v240_eu.7.d:0 "After Joanna of Flanders — hailed as Fiery Joanna — rode out in armor to burn the besiegers' camp at Hennebont and held out until relief sails crested the bay, papal legates have brokered the Truce of Malestroit. Though Brittany lies scarred by chevauchees, our towns and garrisons now face a fateful pause."
 oe_v240_eu.7.a:0 "Fortify the Breton march castles and drill coastal garrisons"
 oe_v240_eu.7.b:0 "Ratify the Truce of Malestroit and restore Atlantic salt trade"
 oe_v240_eu.8.t:0 "1340 Rio Salado & the Coimbra Court"
 oe_v240_eu.8.d:0 "Barely two years after the bitter Castilian-Portuguese war, Marinid Sultan Abu al-Hasan has crossed the Strait of Gibraltar to besiege Tarifa alongside Granada. Queen Maria implores her father King Afonso IV to march beside Castile at Rio Salado, even as courtiers at Coimbra warn of growing Castilian exile intrigue around Crown Prince Pedro and the noblewoman Ines de Castro."
 oe_v240_eu.8.a:0 "March beside Castile to Tarifa and crush the invaders at Rio Salado"
 oe_v240_eu.8.b:0 "Prioritize the Algarve coast and Lisbon's royal Atlantic fleet"
 oe_v240_eu.8.c:0 "Settle the Coimbra court and curb Castilian exile cliques around Ines de Castro"
 oe_v240_eu.9.t:0 "The Excommunicated Emperor & the Avignon Curia"
 oe_v240_eu.9.d:0 "Excommunicated since 1324, Emperor Louis IV of Bavaria hoped Pope Benedict XII would lift the papal ban — yet French royal envoys at Avignon have once again torpedoed absolution. In Munich, refugee Franciscan jurists led by William of Ockham urge Louis to defy Avignon openly and rally the German princes and English gold behind imperial independence."
 oe_v240_eu.9.a:0 "Shelter Ockham's jurists in Munich and rally the German estates"
 oe_v240_eu.9.b:0 "Dispatch penitential envoys to Avignon to seek papal absolution"
 oe_v240_eu.10.t:0 "Declaration of Rhense & the Law Licet iuris (1338)"
 oe_v240_eu.10.d:0 "At the wooded Rhine bank of Rhense, six Prince-Electors have sworn an unprecedented constitutional manifesto: whoever is chosen King of the Romans by a majority of the Electors requires no confirmation from the Pope. Weeks later at Frankfurt, Emperor Louis IV stands ready to elevate this triumph into the imperial statute Licet iuris."
 oe_v240_eu.10.a:0 "Promulgate Licet iuris at Frankfurt and proclaim electoral sovereignty"
 oe_v240_eu.10.b:0 "Keep Rhense as a defensive Electoral League without provoking Rome further"
 oe_v240_eu.11.t:0 "The Tyrolean Marriage Crisis (1342)"
 oe_v240_eu.11.d:0 "Countess Margaret of Tyrol has expelled her Luxembourg husband John Henry and offers her strategic Alpine county — commanding the Brenner Pass into Italy — to Louis IV's eldest son, Margrave Louis V of Brandenburg. Annulling a canonical marriage on imperial authority alone will hand the Wittelsbachs the Alps, yet risks uniting Bohemia and Avignon in open revolt."
 oe_v240_eu.11.a:0 "Invoke imperial jurisdiction and wed Louis V to the heiress of Tyrol"
 oe_v240_eu.11.b:0 "Respect Luxembourg rights in Tyrol to preserve imperial peace"
 oe_v240_eu.12.t:0 "Death of Frederick III: Trinacria Under the Interdict"
 oe_v240_eu.12.d:0 "After forty years defending Sicilian independence from Angevin Naples and the Avignon Curia, King Frederick III of Trinacria has died near Paterno. His frail son Peter II inherits an island still groaning under the Papal interdict of 1321, with King Robert of Naples preparing fresh landings and rival Sicilian magnates sharpening their daggers."
 oe_v240_eu.12.a:0 "Uphold the Aragonese Crown of Trinacria and defy Angevin designs"
 oe_v240_eu.12.b:0 "Petition Avignon to lift the interdict and explore a truce with Naples"
 oe_v240_eu.13.t:0 "The Parzialita: Catalan vs Latin Barons of Sicily"
 oe_v240_eu.13.d:0 "Peter II's premature death leaves four-year-old Louis I on the throne as Sicily fractures into the bitter Parzialita. In eastern Catania, the Catalan-Aragonese lords of House Alagona demand fierce loyalty to Aragon, while in Palermo and Messina the native Latin magnates of Houses Chiaramonte and Palizzi carve out virtual principalities of their own."
 oe_v240_eu.13.a:0 "Lean on the Catalan faction of Catania to guard Aragonese Sicily"
 oe_v240_eu.13.b:0 "Accommodate the Latin Chiaramonte magnates of Palermo and Messina"
 oe_v240_eu.13.c:0 "Back Regent John of Randazzo's royal arbitration across both factions"
 oe_v240_eu.14.t:0 "The Peace of Catania & Trinacrian Survival (1347)"
 oe_v240_eu.14.d:0 "Exhausted by dynastic turmoil in Naples, Queen Joanna I has offered Regent John of Randazzo the Peace of Catania — acknowledging Trinacria's practical autonomy in return for nominal tribute and an end to sixty-five years of Vespers warfare. Ratifying the treaty promises rich wheat exports, while hardliners urge fortifying Messina instead."
 oe_v240_eu.14.a:0 "Ratify the Peace of Catania and revive Sicilian grain exports"
 oe_v240_eu.14.b:0 "Reject Neapolitan tribute and fortify Messina and Syracuse"
 oe_v240_eu.15.t:0 "The Battle of Laupen: Forest Cantons Aid Bern (1339)"
 oe_v240_eu.15.d:0 "Habsburg-backed Burgundian and Fribourg nobles have surrounded the Imperial city of Bern's stronghold at Laupen, threatening to snuff out civic liberty across the western Alps. Urgent messengers from Bern have crossed the Brunig Pass pleading for Forest Canton halberdiers to march beside Rudolf von Erlach's burgher squares."
 oe_v240_eu.15.a:0 "March our halberdiers over the Brunig Pass to shatter the knights at Laupen"
 oe_v240_eu.15.b:0 "Hold the St. Gotthard mountain passes and conserve canton levies"
 oe_v240_eu.16.t:0 "The 1351 Pact of Zurich: Guild Republic Joins the Confederacy"
 oe_v240_eu.16.d:0 "After crushing a nocturnal Habsburg-backed patrician conspiracy, Mayor Rudolf Brun of Zurich stands exposed to Austrian retaliation. Envoys from Zurich now arrive at our Alpine diet offering an Eternal Pact with Lucerne, Uri, Schwyz, and Unterwalden — transforming our mountain league into a true urban-rural Confederacy."
 oe_v240_eu.16.a:0 "Swear the Eternal Pact and welcome Zurich into the Swiss Confederacy"
 oe_v240_eu.16.b:0 "Sign a limited Limmat trade accord to avoid Habsburg entanglement"
 oe_v240_eu.17.t:0 "Bern Enters the Confederacy (1353): The Eight Old Cantons"
 oe_v240_eu.17.d:0 "Remembering the brotherhood sealed in blood at Laupen, the proud western republic of Bern now petitions to swear an Eternal Pact with Uri, Schwyz, and Unterwalden. Welcoming Bern completes the historic Acht Alte Orte — the Eight Old Cantons — anchoring an unbroken Alpine shield from Lake Geneva's approaches to Lake Zurich."
 oe_v240_eu.17.a:0 "Seal Bern's Eternal Pact and complete the Eight Old Cantons"
 oe_v240_eu.17.b:0 "Preserve the Forest Cantons' inner compact and alpine autonomy"
 oe_v240_eu.18.t:0 "Night of Randers: Niels Ebbesen & Valdemar IV Atterdag"
 oe_v240_eu.18.d:0 "For eight bitter years Denmark has had no crowned king while Count Gerhard III of Holstein — the Bald Count — ruled Jutland and Funen by mercenary pawn. On the night of April 1, 1340, Jutland squire Niels Ebbesen slipped into Randers and struck Gerhard down, igniting a national uprising that beckons exiled Prince Valdemar IV Atterdag home from Bavaria."
 oe_v240_eu.18.a:0 "Rally the Jutland squires behind Valdemar IV Atterdag's restoration"
 oe_v240_eu.18.b:0 "Negotiate a peaceful pawn-redemption schedule with Holstein"
 oe_v240_eu.19.t:0 "Atterdag's Ledger: Redeeming the Crown & Selling Reval (1346)"
 oe_v240_eu.19.d:0 "True to his byname Atterdag — Another Day — King Valdemar IV has spent six patient years buying back mortgaged castles across Zealand and Jutland. After the 1343 St. George's Night revolt shook distant Danish Estonia, the Teutonic Order offers 19,000 silver Cologne marks for Reval and Harria-Virland, a windfall that could unify Denmark's core once and for all."
 oe_v240_eu.19.a:0 "Accept Teutonic silver to redeem Denmark's core castles and treasury"
 oe_v240_eu.19.b:0 "Keep our eastern Baltic prestige and rely on Sound naval power"
 oe_v240_eu.20.t:0 "Magnus IV Eriksson's Landslag & the Scanian Debt"
 oe_v240_eu.20.d:0 "King Magnus IV Eriksson of Sweden and Norway — who abolished thralldom in 1335 and mortgaged crown taxes to purchase rich Scania for 34,000 silver marks — has completed Sweden's first unified National Law Code (Landslag). Promulgating the code will check regional magnates and protect free peasants, though the powerful Riksrad demands fiscal concessions in return."
 oe_v240_eu.20.a:0 "Promulgate the unified Landslag and uphold free Swedish yeomen"
 oe_v240_eu.20.b:0 "Strike a fiscal compact with the Riksrad to shoulder the Scanian debt"
 oe_v240_eu.21.t:0 "Heirs of Posada: Voivode Basarab I's Mountain Realm"
 oe_v240_eu.21.d:0 "Eight years after shattering King Charles Robert of Hungary's royal army in the Carpathian gorge of Posada, Voivode Basarab I presides over a proud, newly sovereign Wallachia from Campulung and Arges. To secure his dynasty between Hungary and the Danube, the Voivode must either harden the mountain passes or strike a profitable Severin trade accord with Buda."
 oe_v240_eu.21.a:0 "Fortify the Carpathian passes and elevate Campulung and Arges"
 oe_v240_eu.21.b:0 "Negotiate a Danube-Transylvanian trade charter with Hungary"
 oe_v240_eu.22.t:0 "The Metropolitanate of Ungro-Wallachia"
 oe_v240_eu.22.d:0 "Pressured by Hungarian royal missions along the Carpathians, Wallachia's voivodes have petitioned the Ecumenical Patriarch in Constantinople to transfer Metropolitan Hyacinth of Vicina to Curtea de Arges. Canonical recognition of a Wallachian Metropolitanate will anchor Orthodox sovereignty north of the Danube for centuries to come."
 oe_v240_eu.22.a:0 "Petition Constantinople to establish the Metropolitanate at Arges"
 oe_v240_eu.22.b:0 "Keep flexible religious diplomacy between Constantinople and Buda"
 oe_v240_eu.23.t:0 "Stephen II Kotromanic & the Bosnian Church Balance"
 oe_v240_eu.23.d:0 "Ruling from the Dinaric highlands to the Adriatic shore of Hum, Ban Stephen II Kotromanic faces relentless papal denunciation of Bosnia's autonomous native church (the Krstjani). Welcoming a Franciscan Vicariate will disarm Hungarian crusade pretexts without forcing a bloody purge of our native highland nobles."
 oe_v240_eu.23.a:0 "Admit the Franciscan Vicariate while quietly tolerating the Krstjani"
 oe_v240_eu.23.b:0 "Defend the native Bosnian Church and rally the highland bans"
 oe_v240_eu.24.t:0 "Silver of Srebrenica & the Ragusan Trade Charter"
 oe_v240_eu.24.d:0 "Experienced Saxon miners have opened dazzling silver and lead veins around Srebrenica and Olovo, while merchants from Dubrovnik (Ragusa) bid eagerly for exclusive export corridors down to the Adriatic. Ban Stephen II can channel this highland silver boom into thriving commerce or an impregnable chain of royal mountain citadels."
 oe_v240_eu.24.a:0 "Grant Saxon mining charters and Ragusan customs liberties"
 oe_v240_eu.24.b:0 "Pour Srebrenica's silver into mountain fortresses and ducal garrisons"
 oe_v240_eu.25.t:0 "Alexander Mikhailovich Returns to Tver: Shadow of Sarai"
 oe_v240_eu.25.d:0 "Pardoned by Uzbeg Khan after a decade of exile in Pskov following the 1327 anti-Tatar uprising, Prince Alexander Mikhailovich has returned to Tver to reclaim his patrimony. Yet Grand Prince Ivan I Kalita of Moscow already rides toward Sarai with silver and accusations — leaving Tver to choose between proud defiance and costly Horde diplomacy."
 oe_v240_eu.25.a:0 "Defend Tver's senior Rurikid dignity against Muscovite intrigue"
 oe_v240_eu.25.b:0 "Dispatch silver gifts to Uzbeg Khan's court at Sarai"
 oe_v240_eu.26.t:0 "The Treaty of Bolotovo (1348): Pskov's Sovereign Republic"
 oe_v240_eu.26.d:0 "After decades of shielding Rus's western frontier against the Livonian Order — and marching to rescue Novgorod from King Magnus IV of Sweden's crusade — Pskov's posadniks have extracted a historic settlement at Bolotovo. Novgorod formally renounces judicial authority over Pskov and hails the city as its autonomous younger brother republic."
 oe_v240_eu.26.a:0 "Ratify the Treaty of Bolotovo and charter the Pskov Veche Republic"
 oe_v240_eu.26.b:0 "Expand the limestone fortress of Izborsk and train frontier militias"
 oe_v240_eu.27.t:0 "George V the Brilliant & the Dzeglis Deda Code"
 oe_v240_eu.27.d:0 "Having expelled the last Ilkhanid Mongol garrisons and ended a century of foreign tribute by 1335, King George V the Brilliant sets about healing a fractured Caucasus. Before the royal council at Tbilisi stand two pillars of renewal: promulgating the celebrated Dzeglis Deda legal code to discipline mountain lords, or minting pure silver Giorgauli coins to revive Silk-Road trade."
 oe_v240_eu.27.a:0 "Promulgate the Dzeglis Deda and reform the Royal Court of Tbilisi"
 oe_v240_eu.27.b:0 "Mint pure silver Giorgauli coins to revive Tbilisi's Silk-Road bazaars"
 oe_v240_eu.28.t:0 "Restoration of the Georgian Realm & the Holy Cross"
 oe_v240_eu.28.d:0 "From the Black Sea ports of Abkhazia to the high citadels of Samtskhe, Bagratid banners fly united once again under George V the Brilliant. Envoys returning from Cairo even bring word that the Mamluk Sultan is prepared to restore the historic Georgian Monastery of the Holy Cross in Jerusalem — crowning Georgia's golden autumn with martial unity or diplomatic glory."
 oe_v240_eu.28.a:0 "Bind Samtskhe and the Caucasus marches firmly under Tbilisi's banner"
 oe_v240_eu.28.b:0 "Confirm our embassies to Cairo and Constantinople for the Holy Cross"
