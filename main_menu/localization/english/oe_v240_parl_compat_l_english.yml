l_english:
 oe_v240_pc_crown_chancery_audit: "Realm Chancery & Tax Audit"
 oe_v240_pc_crown_chancery_audit_desc: "Empower the realm's central chancery to review provincial tax rolls and ministerial accounts across all crown offices, strengthening tax yield and cabinet efficiency at the cost of mild aristocratic friction."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_crown_chancery_audit: "Audited Realm Chancery"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_crown_chancery_audit: "Regularized treasury audits and disciplined chancery clerks improve direct tax collection and ministerial efficiency across the realm."
 oe_v240_pc_crown_statute_consolidation: "Statute Consolidation & Provincial Writs"
 oe_v240_pc_crown_statute_consolidation_desc: "Harmonize overlapping provincial charters into a clear statutory digest circulated by royal circuit inspectors, raising legislative efficiency and steady monthly control while adding modest administrative outlay."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_crown_statute_consolidation: "Consolidated Realm Statutes"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_crown_statute_consolidation: "Unified statutory digests and circuit inspectors accelerate legislative decrees and gradually extend central control across distant provinces."
 oe_v240_pc_nobles_border_garrison_charter: "Frontier Fortress & Garrison Charter"
 oe_v240_pc_nobles_border_garrison_charter_desc: "Confirm hereditary warden duties over border strongholds and standardize fortress provisioning across frontier marches, lifting fortification defense and upkeep efficiency at a slight burden on rural laborers."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_nobles_border_garrison: "Frontier Garrison Charter"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_nobles_border_garrison: "Chartered border wardens maintain well-provisioned strongholds, strengthening fortress defense and curbing garrison upkeep costs."
 oe_v240_pc_nobles_marshal_muster_ordinance: "Marshal's Muster & Reserve Ordinance"
 oe_v240_pc_nobles_marshal_muster_ordinance_desc: "Mandate seasonal field drills under the realm's marshals and register regional levy cadres for rapid mobilization, expanding manpower reserves and army tradition while raising routine army upkeep."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_nobles_marshal_muster: "Marshal's Muster Ordinance"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_nobles_marshal_muster: "Seasonal military musters and disciplined officer cadres expand manpower availability and cultivate lasting army tradition."
 oe_v240_pc_clergy_parish_literacy_act: "Parish Schools & Scriptoria Act"
 oe_v240_pc_clergy_parish_literacy_act_desc: "Grant endowments to cathedral schools, monastic scriptoria, and learned seminaries so scribes and jurists can train across every province, accelerating literacy and scholarly research at modest court cost."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_clergy_parish_literacy: "Parish Schools & Scriptoria"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_clergy_parish_literacy: "Endowed religious schools and scriptoria broaden basic literacy and nourish steady scholarly research across the realm."
 oe_v240_pc_clergy_concord_relief_bill: "Sacred Concord & Alms Relief Bill"
 oe_v240_pc_clergy_concord_relief_bill_desc: "Channel parish tithes into hospitals, poorhouses, and pastoral outreach across newly integrated provinces, easing stability upkeep and speeding religious conversion in exchange for a small fiscal concession."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_clergy_concord_relief: "Sacred Concord & Relief"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_clergy_concord_relief: "Charitable parish networks and coordinated pastoral missions lower stability strain and accelerate religious integration across the realm."
 oe_v240_pc_burghers_market_weights_act: "Uniform Weights & Market Charter"
 oe_v240_pc_burghers_market_weights_act_desc: "Standardize coinage weights, dry measures, and commercial court procedures across chartered fairs and merchant hubs, lifting trade income and merchant leverage while slightly curtailing feudal market tolls."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_burghers_market_weights: "Uniform Market Weights"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_burghers_market_weights: "Standardized commercial measures and dependable market courts expand trade earnings and strengthen merchant guilds across every trade hub."
 oe_v240_pc_burghers_public_works_bill: "Civic Guilds & Public Works Bill"
 oe_v240_pc_burghers_public_works_bill_desc: "Partner with urban master guilds to finance stone bridges, granary quays, and craftsman workshops across chartered towns, speeding construction and raising production efficiency while granting towns greater civic autonomy."
 STATIC_MODIFIER_NAME_oe_v240_pc_mod_burghers_public_works: "Civic Guilds & Public Works"
 STATIC_MODIFIER_DESC_oe_v240_pc_mod_burghers_public_works: "Guild-backed municipal infrastructure and artisan workshops accelerate realm-wide construction and raise overall production efficiency."
