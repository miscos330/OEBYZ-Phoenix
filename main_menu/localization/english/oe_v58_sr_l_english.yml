l_english:
 # Project Phoenix v58.0 — Pan-Eurasian Silk Road & Maritime Spice Corridor (EN).
 oe_sit_v58_silk_road_spice_corridor: "Pan-Eurasian Silk Road & Maritime Spice Corridor"
 oe_sit_v58_silk_road_spice_corridor_desc: "Across steppe caravanserais from Jingzhao and Samarkand to Tabriz and Constantinople, and along monsoon sea-lanes from Quanzhou and Malacca through Calicut, Hormuz, and Alexandria, Eurasian realms vie to protect, tax, and master the arteries of silk, porcelain, silver, and spice."
 hint_oe_sit_v58_silk_road_spice_corridor: "Guide: Silk Road & Maritime Spice Corridor"
 hint_oe_sit_v58_silk_road_spice_corridor_desc: "Use the 6 interactive corridor actions, 6 Silk Road hub buildings, and 4 trade edicts to steer Corridor Vitality (0-100) and Maritime Share (0-100). Raising Corridor Vitality to 85 crowns a Pan-Eurasian Golden Commercial Equilibrium; driving Maritime Share to 75 after 1650 ushers in Oceanic Spice Hegemony."
 oe_v58_sr_out_eurasian_golden_web: "Pan-Eurasian Golden Commercial Equilibrium"
 oe_v58_sr_out_eurasian_golden_web_desc: "Overland caravan empires and monsoon maritime ports have woven a resilient commercial web from the Yellow Sea to the Mediterranean."
 oe_v58_sr_out_oceanic_hegemony: "Oceanic Spice Hegemony"
 oe_v58_sr_out_oceanic_hegemony_desc: "Armed blue-water spice fleets and Cape-route trading companies have permanently eclipsed the ancient overland caravan roads."
 oe_v58_sr_out_corridor_transition: "Twilight of the Old Silk & Spice Monopolies"
 oe_v58_sr_out_corridor_transition_desc: "By the late eighteenth century, industrializing empires and global shipping lanes have absorbed the classic Eurasian silk and spice corridors."
 OE_V58_SR_GUI_HDR_ERA: "Corridor Era"
 OE_V58_SR_GUI_HDR_VITALITY: "Corridor Vitality"
 OE_V58_SR_GUI_CARD_TITLE: "Arteries of Silk, Porcelain, and Spice"
 OE_V58_SR_GUI_CARD_BODY: "Caravan states and monsoon thalassocracies compete to secure the dual overland and oceanic corridors linking East Asia, South Asia, Persia, the Levant, and the Mediterranean."
 OE_V58_SR_GUI_FLOW_LABEL: "Pan-Eurasian Corridor Vitality"
 OE_V58_SR_GUI_MARITIME_LABEL: "Oceanic & Monsoon Maritime Share"
 OE_V58_SR_GUI_FOOTNOTE: "Reach 85 Vitality for the Golden Commercial Equilibrium, or push Maritime Share to 75 after 1650 for Oceanic Spice Hegemony."
 oe_v58_sr_legend_overland: "Overland Silk Road Artery"
 oe_v58_sr_legend_maritime: "Maritime Spice & Porcelain Rim"
 oe_v58_sr_legend_clearing: "Mediterranean & Steppe Clearinghouses"
 oe_v58_sr_map_overland_tt: "Overland Silk Road Artery: caravan relay heartland linking China, Xinjiang, Transoxiana, Persia, and Anatolia."
 oe_v58_sr_map_maritime_tt: "Maritime Spice & Porcelain Rim: monsoon sea-lanes linking East China, Malacca, Malabar, Hormuz, Red Sea, and Swahili ports."
 oe_v58_sr_map_clearing_tt: "Clearinghouse Rim: Mediterranean, Levantine, Pontic, and Iberian terminals settling Eurasian bullion and luxury goods."
 oe_v58_sr_act_caravan_escort: "Caravan Escort Network"
 oe_v58_sr_act_caravan_escort_desc: "Commission mounted patrol posts, fortified relay wells, and sworn escort captains along our overland Silk Road stages to deter steppe raiders and secure camel trains."
 oe_v58_sr_act_caravan_escort_tt: "Strengthens overland Silk Road vitality (+7) while drawing trade back from oceanic lanes (-4 Maritime Share)."
 oe_v58_sr_act_monsoon_spice_fleet: "Monsoon Spice Fleet"
 oe_v58_sr_act_monsoon_spice_fleet_desc: "Outfit armed merchant convoys timed to the reversing Indian Ocean and South China Sea monsoons, linking Malabar pepper, Moluccan cloves, and Chinese porcelain directly to our ports."
 oe_v58_sr_act_monsoon_spice_fleet_tt: "Boosts Silk & Spice Corridor vitality (+8) and shifts commerce toward oceanic sea-lanes (+7 Maritime Share)."
 oe_v58_sr_act_strait_toll_charter: "Strait Toll Charter"
 oe_v58_sr_act_strait_toll_charter_desc: "Codify port anchorage dues, lighthouse fees, and convoy safe-conduct passes across key straits and mountain passes so merchants trade predictability for steady crown customs."
 oe_v58_sr_act_strait_toll_charter_tt: "Raises Silk & Spice Corridor vitality (+4) and maritime transit order (+3 Maritime Share)."
 oe_v58_sr_act_merchant_guild_quarter: "Merchant Guild Quarter"
 oe_v58_sr_act_merchant_guild_quarter_desc: "Grant self-governing foreign merchant quarters (fondaci, shahbandar wards, and fanfang precincts) with bonded warehouses, interpreters, and commercial courts."
 oe_v58_sr_act_merchant_guild_quarter_tt: "Expands Silk & Spice Corridor vitality (+7) and cosmopolitan entrepot networks (+2 Maritime Share)."
 oe_v58_sr_act_silver_silk_exchange: "Silver-Silk Exchange"
 oe_v58_sr_act_silver_silk_exchange_desc: "Charter trans-regional bullion assay houses and bills of exchange (suftaja and feiqian) that settle raw silk, spice, and porcelain contracts without hauling coin across every border."
 oe_v58_sr_act_silver_silk_exchange_tt: "Greatly boosts Silk & Spice Corridor vitality (+8) and transoceanic credit settlement (+4 Maritime Share)."
 oe_v58_sr_act_imperial_staple_monopoly: "Imperial Staple Monopoly"
 oe_v58_sr_act_imperial_staple_monopoly_desc: "Designate royal staple entrepots where all raw silk, pepper, and porcelain consignments must first be weighed, taxed, and bid upon by state factors."
 oe_v58_sr_act_imperial_staple_monopoly_tt: "Channels customs revenue to the crown at the cost of slight corridor friction (-3 Vitality, -2 Maritime Share)."
 oe_v58_sr.1.title: "The Golden Road of Samarkand"
 oe_v58_sr.1.desc: "Dust rises above the turquoise domes of Transoxiana as thousand-camel caravans descend from the Pamir passes bearing rolls of raw Jiangnan silk, Khotan jade, and Fergana steeds. Sogdian-schooled brokers, Persian scribes, and steppe horse-lords meet beneath the caravanserai arches of Samarkand and Bukhara to weigh silver ingots against bolts of brocade. Securing the desert stages could pour customs wealth into our treasury, though steppe retainers demand generous transit stipends."
 oe_v58_sr.1.a: "Charter Imperial Caravanserais and Escort Stations"
 oe_v58_sr.1.b: "Lease Transit Tolls to Transoxianan Merchant Syndicates"
 oe_v58_sr.1.c: "Levy Heavy Customs on Luxury Silk Consignments"
 oe_v58_sr.2.title: "The Tabriz-Trebizond Silk Brokerage"
 oe_v58_sr.2.desc: "From the mulberry groves of Gilan and Mazandaran, mule trains climb the Armenian highlands through Tabriz toward Trebizond and the Black Sea emporia. Venetian, Genoese, and Armenian factors bid fiercely for Caspian raw silk before winter snows seal the Zigana Pass. Our treasurers note that regulating the great silk scales at Tabriz can anchor Western Asian textile crafts, yet overly tight bullion rules risk driving Italian buyers toward Syrian ports."
 oe_v58_sr.2.a: "Standardize Silk Scales and Welcome Foreign Factors"
 oe_v58_sr.2.b: "Reserve Fine Caspian Silk for Domestic Weaving Guilds"
 oe_v58_sr.2.c: "Auction Exclusive Export Licenses to the Highest Bidder"
 oe_v58_sr.3.title: "Bazaars of the Queen of Cities"
 oe_v58_sr.3.desc: "Where the Bosphorus narrows between two continents, the covered vaults of Constantinople and Galata hum with fifty tongues. Black Sea grain and furs meet Persian raw silk, Anatolian mohair, and Egyptian pepper beneath marble colonnades. Whether through imperial customs houses on the Golden Horn or negotiated privileges for maritime republics, whoever governs the Straits holds a golden tollgate over Eurasian trade."
 oe_v58_sr.3.a: "Expand the Golden Horn Customs and Bonded Warehouses"
 oe_v58_sr.3.b: "Grant Balanced Capitulations to Visiting Merchant Guilds"
 oe_v58_sr.3.c: "Impose Emergency Strait Surcharges on Foreign Hulls"
 oe_v58_sr.4.title: "The Jingzhao-Hexi Camel Trains"
 oe_v58_sr.4.desc: "Beyond the Yellow River bends and the beacon towers of the Hexi Corridor, camel bells echo past Ganzhou, Shazhou, and Turpan into the Tarim oases. Imperial Tea-Horse Offices trade brick tea, woven damask, and iron cookware for steppe warhorses and oasis jade. Maintaining garrisons along the desert narrows requires silver and grain, yet an open Hexi Corridor anchors the entire eastern terminus of the Silk Road."
 oe_v58_sr.4.a: "Fund the Tea-Horse Bureau and Oasis Garrison Wells"
 oe_v58_sr.4.b: "Issue Imperial Tally Passes to Private Frontier Merchants"
 oe_v58_sr.4.c: "Close Frontier Markets to Conserve Grain and Silver"
 oe_v58_sr.5.title: "Karimi Merchants of the Red Sea"
 oe_v58_sr.5.desc: "With the spring southerly winds, lateen-rigged dhows unload tons of Malabar pepper, Ceylon cinnamon, and Yemeni aromatics at Jeddah and Suez. From the Red Sea quays, the great Karimi merchant houses transport spice bales across the desert to Cairo and Alexandria, where Venetian galleys await. Crown advisors debate whether to partner with the Karimi magnates as state financiers or fold the spice trade into a royal monopoly."
 oe_v58_sr.5.a: "Confirm Karimi Guild Charters and Escort Red Sea Convoys"
 oe_v58_sr.5.b: "Establish a Royal Spice Staple in Cairo and Alexandria"
 oe_v58_sr.5.c: "Tax Transit Caravans to Fund Red Sea Coastal Garrisons"
 oe_v58_sr.6.title: "The Pearl Ring of Hormuz"
 oe_v58_sr.6.desc: "Set like a jewel at the mouth of the Persian Gulf, the island emporium of Hormuz has neither fresh springs nor arable fields, yet its vaults overflow with Indian cottons, Persian rosewater, Arabian warhorses, and Bahrayni pearls. Every vessel bound between Basra, Shiraz, and Gujarat must reckon with its customs quays and war galleys. Wise stewardship of the Gulf strait can make this arid rock a sovereign banker to empires."
 oe_v58_sr.6.a: "Fortify the Strait Quays and Codify Gulf Customs"
 oe_v58_sr.6.b: "Subsidize the Horse-for-Spice Trade with Indian Courts"
 oe_v58_sr.6.c: "Extract Tribute from Passing Pearl and Pepper Fleets"
 oe_v58_sr.7.title: "Monsoon Sails of Calicut"
 oe_v58_sr.7.desc: "Along the palm-fringed Malabar coast, the Zamorin's port of Kozhikode welcomes giant Chinese treasure junks from the east and Arab teak dhows from the west on the exact turning of the southwest and northeast monsoons. Black pepper vines from the Western Ghats, cardamom, and ginger fill the beachside warehouses, guarded by strict oaths of harbor neutrality. Backing Malabar's open-port courts draws merchants from every ocean rim."
 oe_v58_sr.7.a: "Establish Permanent Spice Factors and Monsoon Pilots"
 oe_v58_sr.7.b: "Guarantee Neutral Port Arbitration for Foreign Guilds"
 oe_v58_sr.7.c: "Demand Preferential Pepper Quotas by Naval Show of Force"
 oe_v58_sr.8.title: "The Malacca Strait Entrepot"
 oe_v58_sr.8.desc: "Sheltered from Sumatra's gales, the Strait of Malacca acts as the turnstile of the Asian seas. Four appointed Shahbandars—harbormasters for Gujarati, Kling and Bengali, Javanese and Malay, and Chinese and Ryukyuan fleets—settle disputes, inspect weights, and coordinate monsoon departures. Clearing strait piracy and upholding maritime law turns this narrow waterway into the richest crossroads between the Indian Ocean and the South China Sea."
 oe_v58_sr.8.a: "Support the Four Shahbandars and Anti-Piracy Patrols"
 oe_v58_sr.8.b: "Enforce Strait Anchorage Tolls and Escort Certificates"
 oe_v58_sr.8.c: "Redirect Spice Fleets Toward Alternative Sunda Passages"
 oe_v58_sr.9.title: "Zaytun's Porcelain Armada"
 oe_v58_sr.9.desc: "From the dragon kilns of Jingdezhen and Dehua, river barges float crates of cobalt blue-and-white porcelain down to Jinjiang (Quanzhou) and Guangzhou. Packed in damp sand and tea leaves as ballast beneath bolts of Hangzhou damask, these porcelain cargoes fetch ten times their weight in silver from Cairo to Lisbon. Expanding maritime customs offices and export kilns promises vast bullion inflows, though conservative magistrates warn against unchecked coastal smuggling."
 oe_v58_sr.9.a: "Expand Imperial Export Kilns and Maritime Customs"
 oe_v58_sr.9.b: "License Regulated Tribute-and-Trade Junk Convoys"
 oe_v58_sr.9.c: "Tighten Coastal Bans to Suppress Smuggling Syndicates"
 oe_v58_sr.10.title: "The Cape of Storms Bypass Shock"
 oe_v58_sr.10.desc: "Shockwaves sweep the counting houses of Venice, Cairo, and Tabriz: heavily gunned Atlantic carracks have rounded the southern cape of Africa, sailing straight into the Indian Ocean to buy pepper at its source and fire upon rival dhows. Overnight, spice prices tumble in Lisbon while Levantine customs receipts shudder. Every Eurasian realm must now choose whether to fortify traditional caravan and Red Sea arteries or build ocean-going fleets of its own."
 oe_v58_sr.10.a: "Commission Blue-Water Armed Fleets for the Cape Era"
 oe_v58_sr.10.b: "Slash Overland and Red Sea Duties to Keep Old Routes Competitive"
 oe_v58_sr.10.c: "Impose Protective Customs Walls Against Foreign Ocean Factors"
 oe_v58_sr.11.title: "Venice, Cairo, and the Sublime Porte: Spice Diplomacy"
 oe_v58_sr.11.desc: "Envoys from Mediterranean maritime republics, Levantine sultans, and imperial chanceries meet behind closed cedar doors to negotiate the fate of the eastern spice trade. Proposals range from joint galley timber shipments down to Suez, to reciprocal consular treaties in Alexandria and Constantinople, to hard-edged embargoes against rival buyers. In this triangular diplomacy, commercial survival frequently outweighs confessional rivalry."
 oe_v58_sr.11.a: "Sign Reciprocal Spice Capitulations and Consular Accords"
 oe_v58_sr.11.b: "Fund Joint Timber and Naval Escort Pacts in the Levant"
 oe_v58_sr.11.c: "Enforce Strategic Embargoes Against Commercial Rivals"
 oe_v58_sr.12.title: "The Great Silver-for-Silk Reckoning"
 oe_v58_sr.12.desc: "From Andean and Japanese mines to Persian mints and Jiangnan tax offices, refined silver has become the universal bloodstream connecting overland caravans and monsoon spice fleets alike. Bankers across Europe, the Islamic world, India, and China now quote bills of exchange in a single synchronized bullion cycle. Harnessing this bimetallic convergence can transform our realm into a continental clearinghouse, provided we tame inflation and mint debasement."
 oe_v58_sr.12.a: "Establish an Imperial Bimetallic Clearinghouse"
 oe_v58_sr.12.b: "Coin Standardized Trade Ducats and Silver Ingots"
 oe_v58_sr.12.c: "Hoard Bullion Reserves and Restrict Silver Exports"
