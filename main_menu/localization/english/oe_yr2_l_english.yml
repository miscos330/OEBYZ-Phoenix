l_english:
 oe_yr2_dec_chao_reserve_audit: "Audit Provincial Pingzhunku Reserves"
 oe_yr2_dec_chao_reserve_audit.title: "Audit Provincial Pingzhunku Reserves"
 oe_yr2_dec_chao_reserve_audit_desc: "Dispatch Secretariat treasury inspectors to audit provincial Pingzhunku silver reserves, replenish bullion backing for paper notes, curb inflation, and convene a reserve ledger report. 5-year cooldown."
 oe_yr2_dec_chao_reserve_audit.desc: "Dispatch Secretariat treasury inspectors to audit provincial Pingzhunku silver reserves, replenish bullion backing for paper notes, curb inflation, and convene a reserve ledger report. 5-year cooldown."
 oe_yr2_dec_chao_reserve_audit.a: "Replenish Reserves and Present the Ledger"
 oe_yr2_dec_chao_reserve_audit.tt: "Raises Jiaochao trust by 10, cuts inflation by 2%, and opens the Pingzhunku Reserve Audit Report."
 oe_yr2_dec_silver_peg_reform: "Enact Silver-Chao Dual Circulation"
 oe_yr2_dec_silver_peg_reform.title: "Enact Silver-Chao Dual Circulation"
 oe_yr2_dec_silver_peg_reform_desc: "When Jiaochao trust falls to crisis levels or Great Yuan Restoration reaches Stage II, anchor paper circulation to imperial silver bullion for 20 years to break runaway inflation. 20-year cooldown."
 oe_yr2_dec_silver_peg_reform.desc: "When Jiaochao trust falls to crisis levels or Great Yuan Restoration reaches Stage II, anchor paper circulation to imperial silver bullion for 20 years to break runaway inflation. 20-year cooldown."
 oe_yr2_dec_silver_peg_reform.a: "Promulgate the Silver-Chao Peg Edict"
 oe_yr2_dec_silver_peg_reform.tt: "Immediately raises Jiaochao trust by 12, reduces inflation by 3%, and grants the Silver-Chao Bullion Peg modifier for 20 years."
 oe_yr2_dec_grain_convoy_escort: "Dispatch Naval Myriarchies to Escort Sea Grain"
 oe_yr2_dec_grain_convoy_escort.title: "Dispatch Naval Myriarchies to Escort Sea Grain"
 oe_yr2_dec_grain_convoy_escort_desc: "Assign coastal naval myriarchies to escort the Jiangnan-to-Zhigu grain convoy, suppressing pirates and cushioning losses during typhoon storms. 4-year cooldown."
 oe_yr2_dec_grain_convoy_escort.desc: "Assign coastal naval myriarchies to escort the Jiangnan-to-Zhigu grain convoy, suppressing pirates and cushioning losses during typhoon storms. 4-year cooldown."
 oe_yr2_dec_grain_convoy_escort.a: "Deploy the Convoy Escort Fleet"
 oe_yr2_dec_grain_convoy_escort.tt: "Immediately adds 25 grain to the capital granary and protects sea convoys against piracy and typhoon losses for 4 years."
 oe_yr2_dec_touxia_grand_review: "Grand Review of Tou-Xia Princes and Frontier Secretariats"
 oe_yr2_dec_touxia_grand_review.title: "Grand Review of Tou-Xia Princes and Frontier Secretariats"
 oe_yr2_dec_touxia_grand_review_desc: "Review annual stipends and household rolls across the Prince of Liang, Liaoyang Secretariat, and Tou-Xia princes, choosing generous conciliation or fiscal audit. 8-year cooldown."
 oe_yr2_dec_touxia_grand_review.desc: "Review annual stipends and household rolls across the Prince of Liang, Liaoyang Secretariat, and Tou-Xia princes, choosing generous conciliation or fiscal audit. 8-year cooldown."
 oe_yr2_dec_touxia_grand_review.a: "Distribute Generous Stipends to Cement Loyalty"
 oe_yr2_dec_touxia_grand_review.a.tt: "Raises loyalty across active Tou-Xia princes and the Liaoyang Secretariat and grants Generous Princely Stipends for 8 years."
 oe_yr2_dec_touxia_grand_review.b: "Send Censors to Audit Concealed Appanage Rolls"
 oe_yr2_dec_touxia_grand_review.b.tt: "Slightly lowers princely and Liaoyang loyalty in exchange for 8 years of stronger tax efficiency and crown power."
 oe_yr2_grant_touxia_charter: "Grant Tou-Xia Stipend & Tiger Tally"
 oe_yr2_grant_touxia_charter_desc: "Disburse imperial bullion and a golden tiger tally to a Tou-Xia prince or frontier secretariat, sharply boosting loyalty, opinion, and military readiness. 10-year cooldown."
 oe_yr2_grant_touxia_charter_act: "Grant a Tou-Xia Stipend and Tiger Tally to [SCOPE.sCountry('recipient').GetName]"
 oe_yr2_grant_touxia_charter_effect_text: "[SCOPE.sCountry('actor').GetName] grants an imperial stipend and tiger tally to [SCOPE.sCountry('recipient').GetName]."
 oe_yr2_grant_touxia_charter_effect_text_past: "[SCOPE.sCountry('actor').GetName] granted an imperial stipend and tiger tally to [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_yr2_grant_touxia_charter: "Grant a Tou-Xia stipend and tiger tally to $RECIPIENT$?\n\n$INFO$"
 oe_yr2_grant_cd_tt: "Target appanage has not received a Tou-Xia tiger tally within 10 years"
 oe_yr2_curtail_touxia_audit: "Dispatch Censors to Audit Tou-Xia Rolls"
 oe_yr2_curtail_touxia_audit_desc: "Send imperial censors to audit private appanage households, curtailing the target prince's independent manpower and fiscal base while strengthening Great Yuan tax revenue, at the cost of loyalty. 12-year cooldown."
 oe_yr2_curtail_touxia_audit_act: "Dispatch Censors to Audit [SCOPE.sCountry('recipient').GetName]'s Appanage Rolls"
 oe_yr2_curtail_touxia_audit_effect_text: "[SCOPE.sCountry('actor').GetName] dispatches imperial censors to audit [SCOPE.sCountry('recipient').GetName]'s appanage rolls."
 oe_yr2_curtail_touxia_audit_effect_text_past: "[SCOPE.sCountry('actor').GetName] dispatched imperial censors to audit [SCOPE.sCountry('recipient').GetName]'s appanage rolls."
 PROPOSE_oe_yr2_curtail_touxia_audit: "Dispatch imperial censors to audit the Tou-Xia rolls of $RECIPIENT$?\n\n$INFO$"
 oe_yr2_curtail_cd_tt: "Target appanage has not been audited by imperial censors within 12 years"
 oe_yr2.1.t: "Pingzhunku Reserve Audit Report"
 oe_yr2.1.d: "Secretariat treasury inspectors have tallied silver bullion chests and cancelled-note ledgers across the capital circuit and Jiangzhe. Fresh bullion has arrived at the Pingzhunku vaults, calming urban money-shops. Your ministers ask whether to burn worn notes to tighten circulation or extend credit to salt and grain merchants."
 oe_yr2.1.a: "Burn Worn Notes and Enforce Reserve Discipline"
 oe_yr2.1.a.tt: "Further raises Jiaochao trust and trims inflation."
 oe_yr2.1.b: "Lend Surplus Reserves to Salt and Grain Syndicates"
 oe_yr2.1.b.tt: "Brings immediate commercial revenue and burgher satisfaction with slight inflation pressure."
 oe_yr2.2.t: "Jiangnan Salt-Voucher & Chao Redemption Storm"
 oe_yr2.2.d: "Lianghuai and Liangzhe salt merchants have converged on the Pingzhunku offices in Hangzhou and Suzhou, warning that newly printed Chao notes trade at a steep discount. Unless salt vouchers are honored in silver bullion, they threaten to halt official salt shipments vital to imperial revenue."
 oe_yr2.2.a: "Honor the Salt Vouchers in Silver Bullion"
 oe_yr2.2.a.tt: "Costs substantial bullion but strongly restores Jiaochao trust and eases inflation."
 oe_yr2.2.b: "Issue Dedicated Salt-Backed Jiangnan Notes"
 oe_yr2.2.b.tt: "Trades modest prestige for ten years of steady salt taxes and trade."
 oe_yr2.2.c: "Enforce Mandatory Chao Acceptance by Edict"
 oe_yr2.2.c.tt: "Yields quick cash at the price of falling Jiaochao trust, higher inflation, and unrest."
 oe_yr2.3.t: "Dadu Money-Shop Run & Secretariat Bailout"
 oe_yr2.3.d: "Inflationary jitters have struck the capital itself: soldiers and townsfolk are besieging Ortoq money-shops and pawn-houses near Dadu's Jishuitan wharves. Allowing them to collapse will paralyze metropolitan commerce and garrison pay, yet a full bailout will strain the imperial treasury."
 oe_yr2.3.a: "Open the Imperial Vaults to Guarantee Dadu Deposits"
 oe_yr2.3.a.tt: "Costly bailout that halts the panic, strengthens Jiaochao trust, and stabilizes Dadu."
 oe_yr2.3.b: "Charter a Joint Mongol-Han Ortoq Clearing Guild"
 oe_yr2.3.b.tt: "Shares bailout expenses while establishing a ten-year clearing network."
 oe_yr2.3.c: "Freeze Withdrawals and Seize Speculator Hoards"
 oe_yr2.3.c.tt: "Seizes bullion for the crown at severe cost to stability, Jiaochao trust, and trade."
 oe_yr2.4.t: "Pingzhunku Old-Chao Recall Succeeds"
 oe_yr2.4.d: "Sustained reserve audits and silver-backed discipline have borne fruit: millions of worn notes have been retired across the Pingzhunku network, grain and silk prices have steadied, and merchants from Jiangnan to the Silk Road once again accept imperial Chao at par."
 oe_yr2.4.a: "Codify the Permanent Silver-Chao Ledger"
 oe_yr2.4.a.tt: "Consolidates Jiaochao Reform gains with fifteen years of fiscal and legitimacy bonuses."
 oe_yr2.4.b: "Rebate Provincial Commercial Taxes to Reward the Realm"
 oe_yr2.4.b.tt: "Rewards burghers and peasants with twelve years of prosperity and estate goodwill."
 oe_yr2.5.t: "Heishui Sea Typhoon & Grain-Fleet Rescue"
 oe_yr2.5.d: "A summer monsoon has exploded into a violent typhoon across the Heishui Sea off the Shandong headland, scattering flat-bottomed Jiangnan grain junks onto the reefs. Coastal myriarchs warn Dadu that without rapid salvage and hull replacement, capital granaries face a steep shortfall."
 oe_yr2.5.d_escort: "A fierce summer typhoon swept the Heishui Sea, yet because the imperial naval escort guided the convoy into sheltered Shandong anchorages in time, most grain junks survived intact. Coastal commanders await orders on salvage and reserve replenishment."
 oe_yr2.5.a: "Fund Coastal Salvage Flotillas and Compensate Captains"
 oe_yr2.5.a.tt: "Adds grain if Convoy Escort is active, otherwise sharply limits losses and boosts naval recovery for 8 years."
 oe_yr2.5.b: "Open Canal Granaries to Cushion the Shortfall"
 oe_yr2.5.b.tt: "Lower treasury outlay with stability gains; preserves a small surplus if escorted."
 oe_yr2.5.c: "Impress Coastal Laborers to Build Replacement Junks"
 oe_yr2.5.c.tt: "Recovers grain without treasury cost at the price of stability and peasant resentment."
 oe_yr2.6.t: "Wokou & Fang Guozhen Remnant Grain Raiders"
 oe_yr2.6.d: "Wokou corsairs and Zhejiang sea-lord remnants have joined forces among the offshore islands to prey on Jiangnan grain fleets leaving port. The Secretariat is split between co-opting the sea-lords with naval ranks, launching a joint naval sweep, or shifting shipments onto the Grand Canal."
 oe_yr2.6.a: "Amnesty Sea-Lords with Naval Myriarch Ranks"
 oe_yr2.6.a.tt: "Quickly restores sea deliveries (+25 grain) and eases piracy at minor cost to prestige and crown power."
 oe_yr2.6.b: "Launch a Joint Imperial Naval Suppression"
 oe_yr2.6.b.tt: "Builds formidable anti-piracy patrols, raises navy tradition, and secures +15 grain."
 oe_yr2.6.c: "Dredge the Grand Canal for Overland Grain Relay"
 oe_yr2.6.c.tt: "Bypasses sea raiders, delivers +20 grain, and improves inland logistics at higher cost."
 oe_yr2.7.t: "Suzhou-Zhigu Charitable Granary Stabilization"
 oe_yr2.7.d: "A bumper Jiangnan grain convoy has reached the wharves of Zhigu, driving capital rice prices down. Officials propose building ever-normal charitable granaries at Zhigu and the Jiangnan embarkation ports to stabilize prices, or earmarking the surplus for capital garrisons."
 oe_yr2.7.a: "Build Ever-Normal Charitable Granaries at Zhigu"
 oe_yr2.7.a.tt: "Adds 35 grain, raises stability, and upgrades Zhigu's granary hub for 15 years."
 oe_yr2.7.b: "Reserve the Grain Surplus for Imperial Garrisons"
 oe_yr2.7.b.tt: "Adds 20 grain and manpower while strengthening garrisons and reinforcement for 10 years."
 oe_yr2.8.t: "New Sea Lanes & Nanyang Rice Exchange"
 oe_yr2.8.d: "Zaytun and Mingzhou mariners have charted faster monsoon lanes to Champa, Khmer, and Java, returning with fast-ripening Champa rice and Nanyang spices. Opening a regulated maritime grain mart could diversify imperial food supply and broaden imperial commerce."
 oe_yr2.8.a: "Charter the Zaytun-Nanyang Grain & Porcelain Mart"
 oe_yr2.8.a.tt: "Adds 40 grain, boosts Jiaochao trust, and grants a 15-year Nanyang grain-trade boom."
 oe_yr2.8.b: "Sponsor Deep-Water Convoy Guilds"
 oe_yr2.8.b.tt: "Raises navy tradition, shipbuilding speed, and maritime merchant power for 15 years."
 oe_yr2.9.t: "Prince of Liang's Yunnan Covenant"
 oe_yr2.9.d: "Envoys from the Prince of Liang have ridden north from Yunnan to report orderly tusi tribute roads and steady silver output, requesting formal confirmation of the prince's southwestern military command as an unshakable loyalist redoubt. Yet censors warn against unchecked regional autonomy."
 oe_yr2.9.a: "Confirm the Prince of Liang's Yunnan Command"
 oe_yr2.9.a.tt: "Sharply boosts Prince of Liang's loyalty and defenses while securing southwestern trade corridors for 15 years."
 oe_yr2.9.b: "Station Imperial Censors in Yunnan's Treasury"
 oe_yr2.9.b.tt: "Curtails Liang's autonomy and boosts central tax efficiency at the cost of Liang's loyalty."
 oe_yr2.10.t: "Counsel on Köke Temür's Supreme Field Command"
 oe_yr2.10.d: "Köke Temür's disciplined cavalry in Shanxi and Henan have proven the empire's sharpest sword. War hawks urge investing him with supreme field command to sweep the central plains, while court factions warn that unchecked military prestige could overshadow the throne itself."
 oe_yr2.10.a: "Invest Köke Temür with Supreme Military Authority"
 oe_yr2.10.a.tt: "Strongly boosts imperial morale, discipline, and army tradition, and empowers Köke Temür if active."
 oe_yr2.10.b: "Balance Field Generals Under Imperial Supervisors"
 oe_yr2.10.b.tt: "Strengthens crown authority, stability, and army upkeep efficiency, cooling relations with Köke Temür."
 oe_yr2.11.t: "Liaoyang Secretariat & Eastern Princes Yam-Road Defense"
 oe_yr2.11.d: "The Liaoyang Branch Secretariat and the Eastern Princes report that the long yam-post roads stretching across Liaodong and Manchuria require fresh silver and remounts to secure frontier garrisons. Meanwhile, capital commanders propose transferring seasoned Liaodong riders to reinforce Dadu's Keshig."
 oe_yr2.11.a: "Fund Eastern Yam Garrisons and Honor the Eastern Princes"
 oe_yr2.11.a.tt: "Boosts Liaoyang and Eastern Princes loyalty while reinforcing yam roads and frontier forts for 15 years."
 oe_yr2.11.b: "Reassign Liaoyang Cavalry to Dadu's Keshig"
 oe_yr2.11.b.tt: "Grants substantial manpower and boosts central forces at the cost of Liaoyang loyalty."
 oe_yr2.12.t: "New Shangdu Kurultai Compact"
 oe_yr2.12.d: "Having weathered tempest and rebellion, Great Yuan's princes and provincial grandees gather once more beside the Luan River at Shangdu. As the Great Yuan Restoration matures, the court faces a defining constitutional choice: convert hereditary Tou-Xia fiefs into salaried imperial commands, or renew the Golden Lineage covenant."
 oe_yr2.12.a: "Convert Tou-Xia Fiefs into Salaried Imperial Commands"
 oe_yr2.12.a.tt: "Trades short-term stability and princely discontent for 30 years of strong crown power, taxation, and control."
 oe_yr2.12.b: "Renew the Golden Lineage Covenant at Shangdu"
 oe_yr2.12.b.tt: "Unites all princes through lavish gifts, granting 30 years of high subject loyalty, legitimacy, and morale."
 STATIC_MODIFIER_NAME_oe_yr2_silver_chao_peg: "Silver-Chao Bullion Peg"
 STATIC_MODIFIER_DESC_oe_yr2_silver_chao_peg: "Imperial silver reserves back paper Chao circulation, curbing inflation and steadying tax collection at the cost of minting windfalls."
 STATIC_MODIFIER_NAME_oe_yr2_audit_sound_notes: "Sound Note Reserve Discipline"
 STATIC_MODIFIER_DESC_oe_yr2_audit_sound_notes: "Destroying worn bills and enforcing vault audits bolsters merchant trust in imperial notes."
 STATIC_MODIFIER_NAME_oe_yr2_audit_merchant_credit: "Pingzhunku Merchant Credit"
 STATIC_MODIFIER_DESC_oe_yr2_audit_merchant_credit: "Low-interest reserve loans to salt and grain syndicates stimulate trade and burgher satisfaction."
 STATIC_MODIFIER_NAME_oe_yr2_salt_voucher_stabilizer: "Jiangnan Salt-Voucher Stabilization"
 STATIC_MODIFIER_DESC_oe_yr2_salt_voucher_stabilizer: "Official salt monopoly revenues anchor paper circulation across Jiangnan."
 STATIC_MODIFIER_NAME_oe_yr2_dadu_market_rescued: "Secretariat Capital Bailout"
 STATIC_MODIFIER_DESC_oe_yr2_dadu_market_rescued: "Treasury guarantees halt the Dadu banking panic and revive metropolitan prosperity."
 STATIC_MODIFIER_NAME_oe_yr2_ortoq_clearing_guild: "Ortoq Clearing Guild"
 STATIC_MODIFIER_DESC_oe_yr2_ortoq_clearing_guild: "A joint Mongol-Han clearing guild lowers borrowing costs and expands merchant influence."
 STATIC_MODIFIER_NAME_oe_yr2_dadu_credit_freeze: "Capital Credit Freeze"
 STATIC_MODIFIER_DESC_oe_yr2_dadu_credit_freeze: "Freezing withdrawals strengthens state grip while chilling urban commerce."
 STATIC_MODIFIER_NAME_oe_yr2_chao_ledger_triumph: "Codified Silver-Chao Ledger"
 STATIC_MODIFIER_DESC_oe_yr2_chao_ledger_triumph: "Institutionalized reserve ledgers cement paper currency credibility across the empire."
 STATIC_MODIFIER_NAME_oe_yr2_tax_rebate_boom: "Imperial Commercial Tax Rebate"
 STATIC_MODIFIER_DESC_oe_yr2_tax_rebate_boom: "Tax rebates spur craft production, prosperity, and broad estate goodwill."
 STATIC_MODIFIER_NAME_oe_yr2_convoy_escort: "Naval Grain Convoy Escort"
 STATIC_MODIFIER_DESC_oe_yr2_convoy_escort: "Naval myriarchies escort grain convoys north, deterring pirates and protecting maritime trade."
 STATIC_MODIFIER_NAME_oe_yr2_coastal_salvage_corps: "Coastal Salvage Flotilla"
 STATIC_MODIFIER_DESC_oe_yr2_coastal_salvage_corps: "Dedicated salvage crews speed shipbuilding and preserve coastal maritime presence."
 STATIC_MODIFIER_NAME_oe_yr2_sea_lord_pact: "Sea-Lord Amnesty Compact"
 STATIC_MODIFIER_DESC_oe_yr2_sea_lord_pact: "Co-opted Zhejiang sea-lords safeguard shipping lanes in exchange for local autonomy."
 STATIC_MODIFIER_NAME_oe_yr2_anti_wokou_patrol: "Joint Anti-Wokou Patrol"
 STATIC_MODIFIER_DESC_oe_yr2_anti_wokou_patrol: "Aggressive offshore patrols sweep Wokou bases and sharpen naval morale."
 STATIC_MODIFIER_NAME_oe_yr2_grand_canal_relay: "Grand Canal Overland Relay"
 STATIC_MODIFIER_DESC_oe_yr2_grand_canal_relay: "Inland canal relays buffer food supply and improve capital communications."
 STATIC_MODIFIER_NAME_oe_yr2_zhigu_granary_loc: "Zhigu Ever-Normal Granary"
 STATIC_MODIFIER_DESC_oe_yr2_zhigu_granary_loc: "Grand imperial granaries at Zhigu stabilize food prices and boost port prosperity."
 STATIC_MODIFIER_NAME_oe_yr2_capital_grain_garrison: "Capital Grain Garrison Reserve"
 STATIC_MODIFIER_DESC_oe_yr2_capital_grain_garrison: "Abundant maritime grain reserves strengthen empire-wide garrisons and reinforcement."
 STATIC_MODIFIER_NAME_oe_yr2_nanyang_grain_mart: "Zaytun-Nanyang Grain Mart"
 STATIC_MODIFIER_DESC_oe_yr2_nanyang_grain_mart: "Champa rice and Southeast Asian goods expand imperial food security and trade reach."
 STATIC_MODIFIER_NAME_oe_yr2_deepwater_guild: "Deep-Water Convoy Guild"
 STATIC_MODIFIER_DESC_oe_yr2_deepwater_guild: "Chartered ocean-going guilds boost shipbuilding and maritime merchant power."
 STATIC_MODIFIER_NAME_oe_yr2_touxia_tiger_tally: "Imperial Tiger Tally"
 STATIC_MODIFIER_DESC_oe_yr2_touxia_tiger_tally: "Generous imperial stipends and a golden tiger tally fortify this appanage's loyalty and combat spirit."
 STATIC_MODIFIER_NAME_oe_yr2_touxia_curtailed: "Audited Tou-Xia Appanage"
 STATIC_MODIFIER_DESC_oe_yr2_touxia_curtailed: "Imperial household audits curb this appanage's private manpower and fiscal autonomy."
 STATIC_MODIFIER_NAME_oe_yr2_curtailed_touxia_fisc: "Reclaimed Appanage Revenue"
 STATIC_MODIFIER_DESC_oe_yr2_curtailed_touxia_fisc: "Auditing concealed appanage rolls expands central tax efficiency and crown power."
 STATIC_MODIFIER_NAME_oe_yr2_touxia_generous_court: "Generous Princely Stipends"
 STATIC_MODIFIER_DESC_oe_yr2_touxia_generous_court: "Generous annual stipends cement vassal loyalty and elevate court prestige."
 STATIC_MODIFIER_NAME_oe_yr2_liang_bastion: "Liang's Yunnan Redoubt"
 STATIC_MODIFIER_DESC_oe_yr2_liang_bastion: "Confirmed in southwestern command, the Prince of Liang fortifies Yunnan's mountain approaches."
 STATIC_MODIFIER_NAME_oe_yr2_yunnan_tusi_corridor: "Yunnan Tusi Tribute Corridor"
 STATIC_MODIFIER_DESC_oe_yr2_yunnan_tusi_corridor: "Loyal administration in Yunnan secures southwestern tribute roads and silver commerce."
 STATIC_MODIFIER_NAME_oe_yr2_koke_field_command: "Köke Temür's Field Command"
 STATIC_MODIFIER_DESC_oe_yr2_koke_field_command: "Köke Temür's unified command sharpens imperial discipline and morale, unsettling rival nobles."
 STATIC_MODIFIER_NAME_oe_yr2_koke_vanguard: "Henan Vanguard Cavalry"
 STATIC_MODIFIER_DESC_oe_yr2_koke_vanguard: "Invested with imperial trust, Köke Temür's cavalry vanguard fights with fierce resolve."
 STATIC_MODIFIER_NAME_oe_yr2_court_military_balance: "Imperial Military Balance"
 STATIC_MODIFIER_DESC_oe_yr2_court_military_balance: "Civilian oversight balances frontier commanders, bolstering crown power and stability."
 STATIC_MODIFIER_NAME_oe_yr2_liaoyang_wardens: "Liaoyang Eastern Wardens"
 STATIC_MODIFIER_DESC_oe_yr2_liaoyang_wardens: "Imperial subsidies fortify Liaoyang's garrisons and frontier loyalty."
 STATIC_MODIFIER_NAME_oe_yr2_eastern_yam_shield: "Eastern Yam-Road Shield"
 STATIC_MODIFIER_DESC_oe_yr2_eastern_yam_shield: "Reinforced Manchurian yam-post roads speed imperial decrees and cut fort upkeep."
 STATIC_MODIFIER_NAME_oe_yr2_dadu_keshig_reinforce: "Liaodong Keshig Reinforcements"
 STATIC_MODIFIER_DESC_oe_yr2_dadu_keshig_reinforce: "Seasoned Liaodong horsemen bolster the capital Keshig and imperial manpower."
 STATIC_MODIFIER_NAME_oe_yr2_kurultai_salaried_commands: "Salaried Imperial Commands"
 STATIC_MODIFIER_DESC_oe_yr2_kurultai_salaried_commands: "Replacing hereditary appanages with salaried imperial governors deepens crown control and taxation."
 STATIC_MODIFIER_NAME_oe_yr2_kurultai_golden_compact: "Shangdu Golden Lineage Compact"
 STATIC_MODIFIER_DESC_oe_yr2_kurultai_golden_compact: "Renewing the Chinggisid compact at Shangdu binds all princely houses in loyal service."
 oe_yr2_b_touxia_charter: "Granted Tou-Xia Stipend & Tiger Tally"
 oe_yr2_b_touxia_audit: "Audited Tou-Xia Appanage Rolls"
 oe_yr2_b_liang_covenant: "Yunnan Loyalty Covenant"
 oe_yr2_b_koke_investiture: "Invested Supreme Field Command"
 oe_yr2_b_liaoyang_pact: "Funded Eastern Yam Defenses"
 oe_yr2_b_sea_amnesty: "Maritime Amnesty & Naval Rank"
