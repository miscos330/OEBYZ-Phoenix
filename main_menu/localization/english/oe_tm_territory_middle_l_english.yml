 oe_tm_apply_3_tt: "The subject is annexed. Its land becomes #Y 1#! to #Y 3#! provinces (#Y 2#! with #Y 12#! or more locations, #Y 3#! with #Y 30#! or more), seated at its most populous locations; every other location goes to the nearest seat. Provinces bordering a country outside the Byzantine bloc become frontier commands, the others [Concept('oe_tu_exarchate','exarchates')|e]."
 oe_tm_reject_3_tt: "The subject cannot be proposed again for #Y 5#! years; its opinion of the empire #R −20#! (recovers #Y 2#! a year)."
 oe_tm_provincialise: "Make a Province"
 oe_tm_provincialise_desc: "Annex a provincialised subject and turn its land into #Y 1–3#! provinces ([Concept('oe_tu_provincialise','provincialisation')|e]). Requires #Y 10#! years as a provincialised subject (each refused muster adds #Y 5#!); an opinion of the empire of at least #Y 70#!, or a ruler installed by the emperor; a primary culture of the Roman group, the same state religion as the empire, or an accepted culture with at least #Y 80#! opinion and #Y 35#! [oe_tu_authority|e]. The Imperial Domain of Egypt needs none of these. Costs #R 10#! [oe_tu_authority|e] and needs a vote of the [Concept('oe_tu_senate','senate')|e].\n\n$oe_tsn_pv_3$"
 oe_tm_provincialise_card: "Turn a provincialised subject into imperial provinces, by vote of the senate."
 oe_tm_provincialise_select: "Choose a subject"
 oe_tm_provincialise_none: "@trigger_no!No subject meets the conditions"
 oe_tm_provincialise_effect: "Spend #R 10#! [oe_tu_authority|e] and put the proposal to the [Concept('oe_tu_senate','senate')|e]. If it passes, the subject is annexed and its land becomes #Y 1#! to #Y 3#! provinces: frontier commands where they border foreign countries, [Concept('oe_tu_exarchate','exarchates')|e] elsewhere; its former ruler may become the first governor. If it fails, the subject cannot be proposed again for #Y 5#! years and its opinion of the empire drops by #Y 20#!."
 oe_tm_tt_opinion_int: "Opinion of the empire at least #Y 50#!"
 oe_tm_tt_ladder: "Long enough a subject (each refused muster adds #Y 5#! years)"
 oe_tm_tt_demoted: "Has not fallen back to the Roman alliance in the last #Y 10#! years"
 oe_tm_tt_auth: "Imperial Authority at least #Y 10#!"
 oe_tm_tt_pending: "No province proposal is before the senate"
 oe_tm_tt_any_target: "At least one subject meets the conditions for a province"
 oe_tm.1.t: "Made a Province"
 oe_tm.1.d: "In 17 AD, after the death of Archelaus, the last king of Cappadocia, Tiberius made the client kingdom a province. In 1018 Basil II, having subdued Bulgaria, created the theme of Bulgaria with its seat at Skopje; he ordered that the Bulgarian tax system continue, and the Bulgarian aristocracy kept its position.\n\nThe senate has passed the proposal. The former subject is now part of the empire, and its land is divided into these provinces:"
 oe_tm.1.d1_frontier: "\n· [SCOPE.sCountry('oe_tm_t1').GetName] (frontier command)"
 oe_tm.1.d1_exarch: "\n· [SCOPE.sCountry('oe_tm_t1').GetName] (exarchate)"
 oe_tm.1.d2_frontier: "\n· [SCOPE.sCountry('oe_tm_t2').GetName] (frontier command)"
 oe_tm.1.d2_exarch: "\n· [SCOPE.sCountry('oe_tm_t2').GetName] (exarchate)"
 oe_tm.1.d3_frontier: "\n· [SCOPE.sCountry('oe_tm_t3').GetName] (frontier command)"
 oe_tm.1.d3_exarch: "\n· [SCOPE.sCountry('oe_tm_t3').GetName] (exarchate)"
 oe_tm.1.dk: "\n\nThe former ruler, [SCOPE.sCharacter('oe_tm_king').GetName], has come to Constantinople. [SCOPE.sCharacter('oe_tm_king').GetSheHe|U] could be made the first governor of [SCOPE.sCountry('oe_tm_t1').GetName]."
 oe_tm.1.a: "Make [SCOPE.sCharacter('oe_tm_king').GetName] the first governor"
 oe_tm.1.a.tt: "[SCOPE.sCharacter('oe_tm_king').GetName] takes charge of [SCOPE.sCountry('oe_tm_t1').GetName], replacing the man the court had named. [SCOPE.sCountry('oe_tm_t1').GetName]: loyalty #G +10#!, also in its loyalty target for #Y 5#! years."
 oe_tm.1.b: "The court names its own governor"
 oe_tm.1.b.tt: "[SCOPE.sCharacter('oe_tm_king').GetName] stays in Constantinople. [SCOPE.sCountry('oe_tm_t1').GetName]: loyalty #R −5#!, also in its loyalty target for #Y 5#! years; [oe_tu_authority|e] #G +3#!."
 oe_tm.1.c: "So be it"
 oe_tm.1.c.tt: "Each province is governed by the man the court has named."
 oe_tm.2.t: "The Senate Rejects the Province"
 oe_tm.2.d: "Augustus kept most client kingdoms as they were, and usually made one a province only after its king had died.\n\nThe senate has rejected the proposal to make [SCOPE.sCountry('oe_tm_rej').GetName] a province. Word has reached its court, and the empire's intentions are now known to all."
 oe_tm.2.a: "Let it rest"
 oe_tm.2.a.tt: "[SCOPE.sCountry('oe_tm_rej').GetName] cannot be proposed again for #Y 5#! years; its opinion of the empire #R −20#! (recovers #Y 2#! a year)."
 oe_tm.3.t: "A Subject Drifts Away"
 oe_tm.3.d: "In 17 AD Tiberius joined Commagene to the province of Syria. In 38 AD Caligula gave it back to Antiochus IV as a client kingdom.\n\n[SCOPE.sCountry('oe_tm_dem').GetName] has resented the empire for three years. Its court asks to return to the old terms of the Roman alliance, free of the bonds of a provincialised subject."
 oe_tm.3.a: "Restore the old alliance"
 oe_tm.3.a.tt: "[SCOPE.sCountry('oe_tm_dem').GetName] falls back to the Roman alliance: tribute drops to #Y 10%#! and it may marry outside the imperial dynasty; it cannot be integrated again for #Y 10#! years."
 oe_tm.3.b: "Reassure them with imperial authority"
 oe_tm.3.b.tt: "[oe_tu_authority|e] #R −10#!; [SCOPE.sCountry('oe_tm_dem').GetName]'s opinion of the empire #G +25#! (fades #Y 2#! a year); the count of its grievance starts again."
 oe_tm.4.t: "The Allies Muster"
 oe_tm.4.d: "Rome's allies owed troops above all, sent by treaty in return for the empire's protection. Around 1312 the Serbian king Milutin sent Novak Grebostrek with a contingent to help Andronikos II against the Turks in Asia Minor.\n\nThe campaign has begun, and the empire has called on its subjects:"
 oe_tm.4.a1_1: "\n· [SCOPE.sCountry('oe_tm_a1').GetName] answers with #Y 1#! regiment"
 oe_tm.4.a1_2: "\n· [SCOPE.sCountry('oe_tm_a1').GetName] answers with #Y 2#! regiments"
 oe_tm.4.a1_3: "\n· [SCOPE.sCountry('oe_tm_a1').GetName] answers with #Y 3#! regiments"
