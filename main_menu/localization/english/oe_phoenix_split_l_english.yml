l_english:
 OE_PHOENIX_END_CIVIL_WAR_SETTLED_TT: "The early Palaiologan succession and civil war crisis has been settled (no ongoing civil war or court intrigue, and either the 1341 crisis is resolved or the year is at least 1355)"
 oe_fate_of_the_phoenix.1000.t: "The Phoenix Stirs"
 oe_fate_of_the_phoenix.1000.d: "The walls of Constantinople stand firm. The early dynastic civil wars and rural banditry have been quelled, and the empire has regained its footing across Thrace, Greece, and the Aegean shores. Though the long work of centralization, military reform, and theme land policy lies ahead, Rome has survived its most perilous hour."
 oe_fate_of_the_phoenix.1000.a: "The storm passes; renewal begins today!"
 oe_fate_of_the_phoenix.1000.tt: "The early survival crisis has ended. Theme land progression and peaceful Greek unification remain available in the Imperial Pillars."
 oe_pillars_protect_peasants: "Protect the Free Peasantry"
 oe_pillars_protect_peasants_desc: "Free peasants remain the bedrock of imperial rule. Even after the early crisis passes, we may continue using the Imperial Pillars to curb magnates and advance the theme land privilege toward the free peasantry."
 oe_pillars_protect_peasants_card: "Support freeholders and shift the #Y theme land privilege#! toward the peasantry."
 oe_pillars_protect_noble: "Cooperate with the Military Aristocracy"
 oe_pillars_protect_noble_desc: "The Basileus relies on capable military elites to hold the frontiers. Even after the early crisis passes, we may continue using the Imperial Pillars to empower the military aristocracy along the theme land track."
 oe_pillars_protect_noble_card: "Work with the military elite and shift the #Y theme land privilege#! toward the nobles."
 oe_pillars_own_greek_country: "Peaceful Unification with Brethren"
 oe_pillars_own_greek_country_desc: "There is no need to take up arms against Greek brethren abroad. Once the empire grows strong and deeply Hellenized, we may peacefully bring independent Greek countries into the fold as Roman Ally subjects through the Imperial Pillars."
 oe_pillars_own_greek_country_card: "Peacefully bring an independent #Y Greek#! country in as a Roman Ally subject."
