# NEW 2026-11-22 v15.5 Stars of East Asia — SE Asia & Tibet (oe_sea2_). Generated by gen_v155_east_se_asia.py; edit the generator, not this file.
 oe_sea2_war_elephants:0 "Southeast Asian Royal War Elephants"
 oe_sea2_war_elephants_desc:0 "Armored royal war elephants carrying archers and matchlock crews, crushing enemy morale and excelling across Southeast Asian jungles and riverine wetlands."
 oe_sea2_jong_ship:0 "Javanese Jong Great Ship"
 oe_sea2_jong_ship_desc:0 "A towering multi-planked teak warship of Nusantara built with dowel joinery, mounting bronze cetbang swivel guns while doubling as a resilient long-range amphibious transport."
 STATIC_MODIFIER_NAME_oe_sea2_dai_red_river_dykes_mod:0 "Tran Red River Dyke Network"
 STATIC_MODIFIER_DESC_oe_sea2_dai_red_river_dykes_mod:0 "State dyke commissioners turn the volatile Red River delta into an abundant double-harvest rice bowl."
 STATIC_MODIFIER_NAME_oe_sea2_dai_village_granaries_mod:0 "Communal Village Granaries"
 STATIC_MODIFIER_DESC_oe_sea2_dai_village_granaries_mod:0 "Local village granaries cushion monsoon floods and steady peasant livelihoods across the delta."
 STATIC_MODIFIER_NAME_oe_sea2_dai_lam_son_mod:0 "Lam Son Spirit & Great Proclamation"
 STATIC_MODIFIER_DESC_oe_sea2_dai_lam_son_mod:0 "Forged in ten years of guerrilla defiance from Lam Son to Thang Long, Dai Viet's armies fight with unbroken resolve."
 STATIC_MODIFIER_NAME_oe_sea2_dai_thanh_hoa_rally_mod:0 "Thanh Hoa Heartland Recovery"
 STATIC_MODIFIER_DESC_oe_sea2_dai_thanh_hoa_rally_mod:0 "Tax relief and resettlement anchored in Thanh Hoa swiftly rebuild demographic and fiscal strength."
 STATIC_MODIFIER_NAME_oe_sea2_dai_hong_duc_mod:0 "Hong Duc Legal Code Golden Age"
 STATIC_MODIFIER_DESC_oe_sea2_dai_hong_duc_mod:0 "The Hong Duc Code blends classical jurisprudence with distinctive Vietnamese land and family protections, lifting state efficiency."
 STATIC_MODIFIER_NAME_oe_sea2_dai_literati_exams_mod:0 "Thang Long Imperial Examinations"
 STATIC_MODIFIER_DESC_oe_sea2_dai_literati_exams_mod:0 "Expanding the Temple of Literature exams nurtures generations of loyal scholars and vibrant court arts."
 STATIC_MODIFIER_NAME_oe_sea2_dai_nam_tien_mod:0 "Nam Tien Don Dien Frontier Colonies"
 STATIC_MODIFIER_DESC_oe_sea2_dai_nam_tien_mod:0 "Military agricultural Don Dien settlements extend Dai Viet's farms, roads, and ports steadily down the coastal corridor."
 STATIC_MODIFIER_NAME_oe_sea2_dai_cham_integration_mod:0 "Cham Coastal Integration & Trade"
 STATIC_MODIFIER_DESC_oe_sea2_dai_cham_integration_mod:0 "Welcoming veteran Cham shipwrights and maritime merchants turns central coastal harbors into thriving entrepots."
 STATIC_MODIFIER_NAME_oe_sea2_dai_giao_chi_guns_mod:0 "Giao Chi Matchlocks & Riverine Artillery"
 STATIC_MODIFIER_DESC_oe_sea2_dai_giao_chi_guns_mod:0 "Renowned Vietnamese matchlocks and riverine swivel cannon give Dai Viet lethal combined-arms superiority."
 STATIC_MODIFIER_NAME_oe_sea2_dai_trinh_nguyen_trade_mod:0 "Hoi An International Emporium"
 STATIC_MODIFIER_DESC_oe_sea2_dai_trinh_nguyen_trade_mod:0 "Open ports at Hoi An and Pho Hien draw Japanese, Chinese, and European merchants seeking Vietnamese silk and ceramics."
 STATIC_MODIFIER_NAME_oe_sea2_dai_wall_of_dong_hoi_mod:0 "Dong Hoi Ramparts & Garrison Readiness"
 STATIC_MODIFIER_DESC_oe_sea2_dai_wall_of_dong_hoi_mod:0 "Mountain-to-sea ramparts and drilled coastal squadrons keep Dai Viet's heartland heavily fortified."
 STATIC_MODIFIER_NAME_oe_sea2_dai_tay_son_reform_mod:0 "Tay Son Reform: Nom Script & Rapid Army"
 STATIC_MODIFIER_DESC_oe_sea2_dai_tay_son_reform_mod:0 "Bold military mobilization, vernacular Nom administration, and swift elephant-artillery columns forge a revitalized Viet realm."
 STATIC_MODIFIER_NAME_oe_sea2_dai_unified_viet_mod:0 "Red River to Mekong Imperial Unity"
 STATIC_MODIFIER_DESC_oe_sea2_dai_unified_viet_mod:0 "Ending centuries of division unites Red River scholarship with Mekong Delta abundance under one sovereign throne."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_chao_phraya_mod:0 "Chao Phraya Riverine Metropolis"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_chao_phraya_mod:0 "Ringed by three converging rivers, the island capital of Ayutthaya commands both inland rice barges and ocean junks."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_sukhothai_heritage_mod:0 "Sukhothai Ceramic & Literary Heritage"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_sukhothai_heritage_mod:0 "Cherishing Sukhothai's script, temples, and renowned Sawankhalok celadon kilns enriches both prestige and exports."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_sakdina_mod:0 "Sakdina Civil-Military Code"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_sakdina_mod:0 "Separating civil and military ministries under clear Sakdina rice-field ranks streamlines taxation and royal mobilization."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_elephant_corps_mod:0 "Sacred White Elephant Royal Corps"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_elephant_corps_mod:0 "Armored royal war elephants paired with musketeer escorts anchor Siam's prestige and battlefield shock power."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_naresuan_glory_mod:0 "King Naresuan's Sovereign Renown"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_naresuan_glory_mod:0 "Heroic royal leadership rallies the Chao Phraya plains and reclaims key Indian Ocean trade corridors."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_cosmopolitan_mod:0 "Ayutthaya Cosmopolitan Foreign Quarters"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_cosmopolitan_mod:0 "Hosting Persian, Japanese, Dutch, and French quarters lets the Siamese court balance foreign powers while reaping rich customs."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_royal_monopoly_mod:0 "Royal Phrakhlang Junk Trade"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_royal_monopoly_mod:0 "State-chartered junks directed by the royal treasury sail to China and Japan, keeping commercial profits firmly in crown hands."
 STATIC_MODIFIER_NAME_oe_sea2_ayu_rattanakosin_mod:0 "Rattanakosin Maritime & Cultural Revival"
 STATIC_MODIFIER_DESC_oe_sea2_ayu_rattanakosin_mod:0 "Rebuilt closer to the sea with modernized forts, revised laws, and vibrant diplomacy, the kingdom enters a new golden era."
 STATIC_MODIFIER_NAME_oe_sea2_maj_palapa_oath_mod:0 "Gajah Mada's Palapa Oath"
 STATIC_MODIFIER_DESC_oe_sea2_maj_palapa_oath_mod:0 "Bound by Gajah Mada's solemn vow, Majapahit's fleets and armies press outward to unite the Nusantara archipelago."
 STATIC_MODIFIER_NAME_oe_sea2_maj_mandala_web_mod:0 "Nusantara Tributary Mandala"
 STATIC_MODIFIER_DESC_oe_sea2_maj_mandala_web_mod:0 "Ninety-eight island realms honor Trowulan's sacred court, channeling tribute, loyalty, and maritime diplomacy into Java."
 STATIC_MODIFIER_NAME_oe_sea2_maj_jong_cetbang_mod:0 "Javanese Jong & Cetbang Ordnance"
 STATIC_MODIFIER_DESC_oe_sea2_maj_jong_cetbang_mod:0 "Multi-planked teak Jong ships bristling with bronze cetbang swivel cannon project unmatched Javanese sea power."
 STATIC_MODIFIER_NAME_oe_sea2_maj_spice_golden_mod:0 "Spice Islands Clove & Nutmeg Boom"
 STATIC_MODIFIER_DESC_oe_sea2_maj_spice_golden_mod:0 "Controlling Moluccan cloves and Banda nutmeg through Javanese entrepots fills Trowulan's coffers with oceanic wealth."
 STATIC_MODIFIER_NAME_oe_sea2_maj_wali_songo_mod:0 "Wali Songo Maritime Synthesis"
 STATIC_MODIFIER_DESC_oe_sea2_maj_wali_songo_mod:0 "Blending Javanese arts with Islamic commercial law links northern coastal ports seamlessly into Indian Ocean trade networks."
 STATIC_MODIFIER_NAME_oe_sea2_maj_hindu_mandala_mod:0 "Hindu-Buddhist Mandala Resilience"
 STATIC_MODIFIER_DESC_oe_sea2_maj_hindu_mandala_mod:0 "Defending ancient candi temples and classical Javanese kingship rallies eastern Java and Bali behind steadfast faith."
 STATIC_MODIFIER_NAME_oe_sea2_maj_nusantara_shield_mod:0 "Nusantara Anti-Monopoly Armada"
 STATIC_MODIFIER_DESC_oe_sea2_maj_nusantara_shield_mod:0 "United archipelago fleets and coastal cannon forts break foreign spice monopolies and safeguard Nusantara's seas."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_straits_hub_mod:0 "Parameswara's Monsoon Entrepot"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_straits_hub_mod:0 "Positioned where Indian Ocean and South China Sea monsoons meet, the strait becomes Eurasia's premier maritime crossroads."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_zheng_he_mod:0 "Zheng He Depot & Celestial Alliance"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_zheng_he_mod:0 "Ming treasure fleets establish protected depots along the strait, conferring diplomatic security and booming silk-porcelain exchange."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_maritime_law_mod:0 "Undang-Undang Laut Maritime Code"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_maritime_law_mod:0 "Four Shahbandars administer cosmopolitan merchant quarters under Asia's most trusted maritime commercial code."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_malay_letters_mod:0 "Golden Age of Malay Letters"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_malay_letters_mod:0 "Classical Malay becomes the lingua franca of archipelago diplomacy, jurisprudence, and maritime scholarship."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_anti_portuguese_mod:0 "Anti-Portuguese Straits Defense"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_anti_portuguese_mod:0 "Bronze cannon batteries and agile Malay-Javanese squadrons fiercely contest European attempts to seize the strait."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_straits_coalition_mod:0 "Johor-Pasai-Aceh Free Straits League"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_straits_coalition_mod:0 "A resilient network of Malay and Sumatran ports redirects spice shipping around hostile fortresses and sustains maritime independence."
 STATIC_MODIFIER_NAME_oe_sea2_mlc_anti_dutch_mod:0 "Free Straits Against Company Monopolies"
 STATIC_MODIFIER_DESC_oe_sea2_mlc_anti_dutch_mod:0 "Playing rival empires against chartered monopolies preserves open shipping lanes and thriving Malay customs houses."
 STATIC_MODIFIER_NAME_oe_sea2_tib_phagmodrupa_mod:0 "Phagmodrupa Dzong & Legal Revival"
 STATIC_MODIFIER_DESC_oe_sea2_tib_phagmodrupa_mod:0 "Replacing fractured estates with royal dzong citadels and classical legal codes revitalizes secular Tibetan governance."
 STATIC_MODIFIER_NAME_oe_sea2_tib_gelugpa_mod:0 "Tsongkhapa & Gelugpa Scholastic Order"
 STATIC_MODIFIER_DESC_oe_sea2_tib_gelugpa_mod:0 "The Great Prayer Festival and great monastic universities elevate Tibetan philosophy, medicine, and administrative literacy."
 STATIC_MODIFIER_NAME_oe_sea2_tib_patron_priest_mod:0 "Trans-Himalayan Patron-Priest Diplomacy"
 STATIC_MODIFIER_DESC_oe_sea2_tib_patron_priest_mod:0 "Patron-priest ties linking Lhasa, Mongolia, and Himalayan kingdoms secure highland borders and thriving caravan roads."
 STATIC_MODIFIER_NAME_oe_sea2_tib_potala_mod:0 "Ganden Phodrang & Potala Palace"
 STATIC_MODIFIER_DESC_oe_sea2_tib_potala_mod:0 "Crowning Marpo Ri above Lhasa, the Potala Palace stands as an enduring beacon of Tibetan sovereignty and sacred prestige."
 STATIC_MODIFIER_NAME_oe_sea2_tib_tea_horse_mod:0 "Highland Tea-Horse & Salt Caravans"
 STATIC_MODIFIER_DESC_oe_sea2_tib_tea_horse_mod:0 "Guarded yak caravans linking Sichuan tea, Guge salt, and Himalayan passes enrich mountain treasuries and monasteries."
 oe_sea2.1.title:0 "Tran Dynasty Red River Dykes"
 oe_sea2.1.desc:0 "As monsoon floods swell the Red River, royal dyke commissioners mobilize delta counties to reinforce the great earthen levees protecting Thang Long's double-harvest rice fields."
 oe_sea2.1.a:0 "Fund the Royal Red River Dyke System"
 oe_sea2.1.b:0 "Build Communal Village Granaries Across the Delta"
 oe_sea2.2.title:0 "The Lam Son Uprising and Le Loi's Independence"
 oe_sea2.2.desc:0 "Raising the banner of independence in the hills of Thanh Hoa, Le Loi and strategist Nguyen Trai wage a masterful ten-year liberation war, entering Thang Long to proclaim Dai Viet's eternal sovereignty in the Binh Ngo Dai Cao."
 oe_sea2.2.a:0 "Rally the Lam Son Veterans and Proclaim Independence"
 oe_sea2.2.b:0 "Prioritize Thanh Hoa Tax Relief and Recovery"
 oe_sea2.3.title:0 "Emperor Le Thanh Tong and the Hong Duc Legal Code"
 oe_sea2.3.desc:0 "Emperor Le Thanh Tong promulgates the celebrated Hong Duc Code—pairing disciplined six-ministry bureaucracy and land distribution with distinctive Vietnamese legal protections for rural customs and property rights."
 oe_sea2.3.a:0 "Promulgate the Hong Duc Legal Code Nationwide"
 oe_sea2.3.b:0 "Expand the Thang Long Temple Examinations and Court Arts"
 oe_sea2.4.title:0 "Nam Tien: Southward Expansion Along the Coast"
 oe_sea2.4.desc:0 "Pressed by dense population in the Red River delta, Dai Viet pushes southward along the Annamite coast toward Hue and Vijaya, anchoring each frontier province with military agricultural Don Dien colonies."
 oe_sea2.4.a:0 "Launch Don Dien Frontier Settlements Southward"
 oe_sea2.4.b:0 "Integrate Cham Shipwrights and Coastal Entrepots"
 oe_sea2.5.title:0 "Giao Chi Arquebuses and Riverine Gunboats"
 oe_sea2.5.desc:0 "Vietnamese gunsmiths forge elongated Giao Chi matchlocks prized across East and Southeast Asia for accuracy and rapid fire, equipping both infantry lines and shallow-draft delta war galleys."
 oe_sea2.5.a:0 "Expand State Giao Chi Matchlock and Cannon Foundries"
 oe_sea2.5.b:0 "Export Fine Ordnance and Goods Through Coastal Ports"
 oe_sea2.6.title:0 "The Trinh-Nguyen Rivalry: Ramparts and Hoi An Trade"
 oe_sea2.6.desc:0 "Rival Trinh lords in the north and Nguyen lords in the south confront each other across the great ramparts of Dong Hoi—yet both courts open Hoi An and Pho Hien wide to foreign silver, silk, and artillery merchants."
 oe_sea2.6.a:0 "Open Hoi An and Pho Hien to Global Maritime Commerce"
 oe_sea2.6.b:0 "Fortify the Dong Hoi Ramparts and Standing Squadrons"
 oe_sea2.7.title:0 "The Tay Son Crisis and Reunification of Viet"
 oe_sea2.7.desc:0 "Rebellion erupting from the Tay Son highlands shatters two centuries of north-south division. Dai Viet may seize the moment for sweeping military and vernacular Nom reform, or forge a unified empire stretching from Thang Long to the Mekong Delta."
 oe_sea2.7.a:0 "Embrace Tay Son Military and Vernacular Nom Reforms"
 oe_sea2.7.b:0 "Unite North and South Into One Imperial Realm"
 oe_sea2.8.title:0 "Founding of Ayutthaya on the Chao Phraya"
 oe_sea2.8.desc:0 "At the confluence of three great rivers on the lower Chao Phraya, the island city of Ayutthaya rises—naturally moated against invaders while linking Sukhothai's heartland to Gulf of Siam ocean trade."
 oe_sea2.8.a:0 "Develop the Chao Phraya Island Capital and Canals"
 oe_sea2.8.b:0 "Patronize Sukhothai Letters and Celadon Kilns"
 oe_sea2.9.title:0 "King Trailok's Sakdina Administrative Code"
 oe_sea2.9.desc:0 "King Trailok separates civil governance from military command and codifies the Sakdina system, assigning every noble, official, and commoner an exact rank measured in rice fields to unify taxation and royal levies."
 oe_sea2.9.a:0 "Enact the Sakdina Civil-Military Code"
 oe_sea2.9.b:0 "Strengthen Royal Treasury Maritime Monopolies"
 oe_sea2.10.title:0 "The White Elephant Wars"
 oe_sea2.10.desc:0 "Demands from western Burmese rivals to surrender Ayutthaya's sacred white elephants spark ferocious campaigns through the Three Pagodas Pass, testing Siam's royal war elephants and riverine walls."
 oe_sea2.10.a:0 "Muster the Sacred White Elephant Royal Corps"
 oe_sea2.10.b:0 "Reinforce Chao Phraya Riverine Walls and Arsenals"
 oe_sea2.11.title:0 "King Naresuan's Elephant Duel and Sovereign Revival"
 oe_sea2.11.desc:0 "Amid swirling dust and cannon smoke, King Naresuan drives his royal war elephant straight into the enemy center and triumphs in legendary single combat—reclaiming Siamese independence and southern trade routes."
 oe_sea2.11.a:0 "Press Sovereign Renown to Expand Army and Sea Lanes"
 oe_sea2.11.b:0 "Consolidate Peace and Mainland Tributary Ties"
 oe_sea2.12.title:0 "Foreign Quarters of Ayutthaya: French, Dutch, and Persian Envoys"
 oe_sea2.12.desc:0 "Ayutthaya dazzles visitors from across Eurasia as Persian courtiers, Japanese merchants, Dutch factors, and French ambassadors vie for royal favor—giving the crown rare diplomatic leverage and access to global science."
 oe_sea2.12.a:0 "Balance Foreign Quarters for Diplomacy and Science"
 oe_sea2.12.b:0 "Curb Foreign Concessions and Expand Royal Junk Trade"
 oe_sea2.13.title:0 "The Rattanakosin Revival on the Lower Chao Phraya"
 oe_sea2.13.desc:0 "Rising resiliently from crisis, Siam shifts its royal seat closer to the sea on the lower Chao Phraya, codifying the Three Seals Law, modernizing coastal forts, and reviving maritime commerce across the Gulf."
 oe_sea2.13.a:0 "Establish the Lower Chao Phraya Capital and Maritime Revival"
 oe_sea2.13.b:0 "Restore Royal Temples, Crafts, and Classical Learning"
 oe_sea2.14.title:0 "Gajah Mada's Palapa Oath"
 oe_sea2.14.desc:0 "Before the assembled court at Trowulan, Prime Minister Gajah Mada swears the immortal Palapa Oath: he will taste no spiced delicacy until every realm of Nusantara—from Sumatra and Temasek to the Moluccas—acknowledges Majapahit."
 oe_sea2.14.a:0 "Honor the Palapa Oath and Project Archipelago Power"
 oe_sea2.14.b:0 "Consolidate East Java's Temples and Granaries First"
 oe_sea2.15.title:0 "Nagarakretagama and the Nusantara Tributary Mandala"
 oe_sea2.15.desc:0 "At the zenith of Hayam Wuruk's reign, the epic Nagarakretagama records ninety-eight island tributaries bound to Trowulan's sacred mandala through diplomacy, shared ritual, and bustling sea commerce."
 oe_sea2.15.a:0 "Codify the Nusantara Tributary Mandala Web"
 oe_sea2.15.b:0 "Expand Northern Java Ports for Monsoon Commerce"
 oe_sea2.16.title:0 "Javanese Jong Shipyards and Cetbang Swivel Guns"
 oe_sea2.16.desc:0 "Along Java's northern shipyards, colossal multi-planked teak Jong ships slide down the ways armed with locally cast bronze cetbang swivel cannon, giving Majapahit commanding reach across the archipelago."
 oe_sea2.16.a:0 "Expand State Jong Shipyards and Cetbang Foundries"
 oe_sea2.16.b:0 "Deploy Jong Convoys Along the Spice Trade Lanes"
 oe_sea2.17.title:0 "Spice Trade Golden Age: Moluccan Cloves and Nutmeg"
 oe_sea2.17.desc:0 "Jong convoys returning from Ternate, Tidore, and Banda unload fragrant cargoes of cloves and nutmeg at Surabaya and Gresik, trading Javanese rice for spices worth their weight in gold across Eurasia."
 oe_sea2.17.a:0 "Anchor the Rice-for-Spices Nusantara Exchange"
 oe_sea2.17.b:0 "Reinforce Tributary Protections Over the Spice Islands"
 oe_sea2.18.title:0 "The Demak Islamic Transition and the Nine Saints"
 oe_sea2.18.desc:0 "Along Java's bustling northern Pasisir ports, the Wali Songo weave Islamic jurisprudence into Javanese puppetry and music as Demak's merchant fleets surge. Trowulan must decide whether to embrace maritime synthesis or defend the classical Hindu-Buddhist mandala."
 oe_sea2.18.a:0 "Embrace the Wali Songo Maritime Synthesis"
 oe_sea2.18.b:0 "Defend the Classical Hindu-Buddhist Mandala"
 oe_sea2.19.title:0 "Nusantara Resilience Against Oceanic Monopolies"
 oe_sea2.19.desc:0 "Armed European galleons enter the Sunda Strait seeking fortress monopolies over Banten, Sunda Kelapa, and the Moluccas. Only united archipelago fleets and modernized coastal cannon can defend Nusantara's maritime sovereignty."
 oe_sea2.19.a:0 "Assemble the Nusantara Anti-Monopoly Armada"
 oe_sea2.19.b:0 "Play Rival Foreign Companies Against One Another"
 oe_sea2.20.title:0 "Parameswara's Straits Entrepot"
 oe_sea2.20.desc:0 "Exiled prince Parameswara anchors a new haven on the Malacca Strait complementing Pasai across the water. Blessed by reversing monsoon winds and fair customs duties, the strait rapidly rises into Asia's greatest maritime crossroads."
 oe_sea2.20.a:0 "Build Free Warehouses and Harbor Defenses"
 oe_sea2.20.b:0 "Coordinate Twin-Shore Shipping With Sumatran Ports"
 oe_sea2.21.title:0 "Zheng He's Treasure Fleet and the Celestial Alliance"
 oe_sea2.21.desc:0 "Towering nine-masted Ming treasure ships anchor in the roadstead as Admiral Zheng He grants royal investiture and builds a palisaded imperial supply depot—shielding the strait diplomatically while flooding its bazaars with silk and porcelain."
 oe_sea2.21.a:0 "Charter the Treasure Fleet Depot and Silk Road Alliance"
 oe_sea2.21.b:0 "Invite Indian and Arab Merchant Guilds to Expand the Port"
 oe_sea2.22.title:0 "Undang-Undang Laut Melaka: Maritime Law of the Straits"
 oe_sea2.22.desc:0 "To govern dozens of merchant communities speaking scores of tongues, the sultanate promulgates the Undang-Undang Laut Melaka—Asia's benchmark maritime law—administered by four specialized Shahbandars ensuring swift, impartial justice."
 oe_sea2.22.a:0 "Promulgate the Straits Maritime Law and Four Shahbandars"
 oe_sea2.22.b:0 "Patronize Jurists and Malay Commercial Academies"
 oe_sea2.23.title:0 "Golden Age of Malay Letters and Archipelago Islam"
 oe_sea2.23.desc:0 "Jawi chronicles, legal treatises, and court poetry composed in Malacca and Pasai sail aboard monsoon vessels to Borneo, Java, and the Moluccas, establishing Malay as the shared diplomatic language of the entire archipelago."
 oe_sea2.23.a:0 "Sponsor Royal Academies of Malay Letters and Charts"
 oe_sea2.23.b:0 "Establish Federated Malay Merchant Factories Across the Seas"
 oe_sea2.24.title:0 "Anti-Portuguese Defense of the Straits"
 oe_sea2.24.desc:0 "Heavily gunned Portuguese carracks drop anchor off the strait demanding fortresses and exclusive spice passes. The sultanate must rally bronze artillery and war galleys at the harbor mouth, or weave Johor, Pasai, and Aceh into an unbreakable coalition."
 oe_sea2.24.a:0 "Defend the Strait With Bronze Artillery and War Galleys"
 oe_sea2.24.b:0 "Forge the Johor-Pasai-Aceh Free Straits League"
 oe_sea2.25.title:0 "Anti-Dutch Spice Wars and Free Straits Diplomacy"
 oe_sea2.25.desc:0 "Chartered Dutch East India fleets attempt to lock down tin and pepper exports through coercive treaties. The strait's rulers answer with armed escort squadrons and deft multilateral diplomacy to keep their harbors free."
 oe_sea2.25.a:0 "Break Company Monopolies With Armed Free-Port Diplomacy"
 oe_sea2.25.b:0 "Deepen Maritime Law Guarantees for Independent Asian Merchants"
 oe_sea2.26.title:0 "Phagmodrupa Secular Rule and the Dzong Reforms"
 oe_sea2.26.desc:0 "Tai Situ Changchub Gyaltsen replaces fading feudal tenures with appointed governors in strategic highland dzong citadels and revives classical Tibetan legal codes, restoring native secular vigor across the plateau."
 oe_sea2.26.a:0 "Establish Royal Dzong Citadels and Classical Law"
 oe_sea2.26.b:0 "Develop Highland Tea-Horse and Salt Caravan Trails"
 oe_sea2.27.title:0 "Tsongkhapa and the Founding of the Gelugpa Order"
 oe_sea2.27.desc:0 "Master Tsongkhapa inaugurates the Great Prayer Festival at Lhasa and founds Ganden Monastery, launching the disciplined Gelugpa Order whose great monastic universities soon become centers of philosophy, astronomy, and medicine."
 oe_sea2.27.a:0 "Patronize the Gelugpa Universities and Prayer Festival"
 oe_sea2.27.b:0 "Balance Monastic Renewal With Dzong Secular Governance"
 oe_sea2.28.title:0 "Trans-Himalayan and Steppe Patron-Priest Diplomacy"
 oe_sea2.28.desc:0 "Tibetan hierarchs forge Patron-Priest alliances stretching from Mongol khans on the northern steppe to Guge and Himalayan kingdoms, transforming spiritual prestige into diplomatic security and safe caravan roads."
 oe_sea2.28.a:0 "Seal Trans-Himalayan and Steppe Patron-Priest Bonds"
 oe_sea2.28.b:0 "Expand Cross-Pass Caravan Stations and Salt Customs"
 oe_sea2.29.title:0 "Ganden Phodrang and the Building of the Potala Palace"
 oe_sea2.29.desc:0 "Uniting U and Tsang under the Ganden Phodrang government centered at Lhasa, master builders raise the soaring White and Red Palaces of the Potala atop Marpo Ri—crowning Tibetan sovereignty and prestige."
 oe_sea2.29.a:0 "Raise the Potala Palace and Consolidate Ganden Phodrang"
 oe_sea2.29.b:0 "Sponsor Medical Colleges and Woodblock Printing Houses"
 oe_sea2.30.title:0 "Snowland Crossroads: Tea-Horse Caravans and Highland Autonomy"
