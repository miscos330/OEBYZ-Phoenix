l_english:
 oe_exp_survey.1.t:0 "Measuring the Nile's Gift"
 oe_exp_survey.1.d:0 "Floods move the field boundaries while old registers still describe the holdings of earlier generations. The fiscal offices have supplied ropes, stakes and ledgers. From Cairo, the surveyors will inspect the valley's fields, canals and obligations with village elders as witnesses. The empire needs a register fit for government, not another volume left unopened on a shelf."
 oe_exp_survey.1.a:0 "Send forth the ropes and ledgers."
 oe_exp_survey.2.t:0 "Two Deeds for One Field"
 oe_exp_survey.2.d:0 "Two households at Bilbeis present old, sealed deeds to the same field. The elders remember a change in the river's course but cannot locate the former boundary stones. The surveyors can hire a local copyist or spend longer comparing the witnesses' accounts."
 oe_exp_survey.2.a:0 "Hire a copyist familiar with the old deeds."
 oe_exp_survey.2.a.tt:0 "Ledger completeness +15; remain here for 60 days."
 oe_exp_survey.2.b:0 "Hear the households in turn."
 oe_exp_survey.2.b.tt:0 "Ledger completeness +5; remain here for 90 days."
 oe_exp_survey.3.t:0 "Boundary Stones Washed Away"
 oe_exp_survey.3.d:0 "Floodwater has receded outside Asyut, leaving the fields intact but burying their marked stones in silt. Several copied pages are also soaked. Boatmen can help recover the markers; otherwise the party must reconstruct the boundaries from neighboring plots. The damage remains manageable."
 oe_exp_survey.3.a:0 "Hire boatmen to recover the markers."
 oe_exp_survey.3.a.tt:0 "Ledger completeness +10; remain here for 60 days."
 oe_exp_survey.3.b:0 "Recalculate from neighboring fields."
 oe_exp_survey.3.b.tt:0 "Ledger completeness -5; remain here for 90 days."
 oe_exp_survey.4.t:0 "Village and Estate Registers"
 oe_exp_survey.4.d:0 "An estate steward near Qus has recorded a communal canal as private property. The villages insist that its water has long been shared. No violence has followed, but neither side will seal the new register. A capable leader can reconcile the documents; a longer meeting of village delegates will also settle the matter."
 oe_exp_survey.4.a:0 "Rule from the verified records."
 oe_exp_survey.4.a.tt:0 "Ledger completeness +10; remain here for 60 days."
 oe_exp_survey.4.b:0 "Let the villages agree on water rights."
 oe_exp_survey.4.b.tt:0 "Ledger completeness +5; remain here for 90 days."
 oe_exp_survey.5.t:0 "Sealing the New Land Register"
 oe_exp_survey.5.d:0 "At Syene, records from each stretch of the valley cover a long table. The leader orders missing canals, duplicate households and uncertain boundaries checked before the complete register returns to Cairo. A final delay is preferable to preserving mistakes in the imperial archives."
 oe_exp_survey.5.a:0 "Check the final page before returning."
 oe_exp_survey.5.a.tt:0 "Complete the ledger to 100; remain for 120 days if completeness was below 80, otherwise 60 days."
 oe_exp_survey.6.t:0 "A Register for the Empire"
 oe_exp_survey.6.d:0 "The new register has reached Cairo. Officials can now distribute canal water and assess fields from a common record, instead of reopening the same disputes each spring. No land has appeared from nothing, but the Nile's gifts can be managed with greater care. Every qualifying Egyptian agricultural location has received one additional layer of Egyptian Agricultural Expansion."
 oe_exp_survey.6.a:0 "Distribute copies to the provincial offices."
 oe_exp_survey.7.t:0 "An Unfinished Survey"
 oe_exp_survey.7.d:0 "The survey could not be completed. Provincial offices will preserve the copied records while the remaining boundaries await another inspection. The court will reorganize the party before trying again, without imposing any further penalty."
 oe_exp_survey.7.a:0 "Preserve the papers; reconsider in two years."
 oe_exp_nile.1.t:0 "Down the River"
 oe_exp_nile.1.d:0 "An old manuscript from the delta describes chapels swallowed by river silt, wandering monks and an ancient chest once escorted by strangers. The court has provisioned a small party to investigate from Cairo. Its leader is charged with bringing back evidence that can withstand scrutiny, rather than a story fashioned to please the palace."
 oe_exp_nile.1.a:0 "Follow the old accounts."
 oe_exp_nile.2.t:0 "The Other Half of the Manuscript"
 oe_exp_nile.2.d:0 "A bookseller at Bilbeis recognizes a mark on the manuscript and offers several matching leaves. The monk warns that some annotations may be recent additions. The party can buy the fragments for comparison or search the church archives for independent evidence."
 oe_exp_nile.2.a:0 "Buy the fragments and compare them."
 oe_exp_nile.2.a.tt:0 "Clue reliability +20; remain for 45 days."
 oe_exp_nile.2.b:0 "Consult the church archives."
 oe_exp_nile.2.b.tt:0 "Clue reliability +10; remain for 90 days."
 oe_exp_nile.3.t:0 "The Old Channel Among the Reeds"
 oe_exp_nile.3.d:0 "Fishermen at Damietta say that reeds and silt now conceal the channel shown on the old map. A boatman offers to guide the party and replenish its stores. Following the embankment will also reach the destination, but takes longer."
 oe_exp_nile.3.a:0 "Hire the boatman and replenish supplies."
 oe_exp_nile.3.a.tt:0 "Provisions +15; remain for 30 days."
 oe_exp_nile.3.b:0 "Follow the embankment."
 oe_exp_nile.3.b.tt:0 "Provisions -10; remain for 75 days."
 oe_exp_nile.4.t:0 "A Chapel Beneath the Silt"
 oe_exp_nile.4.d:0 "Near Faqus, the party finds a half-buried stone doorway. Beyond it lie damp niches, broken chests and fragments bearing old names. Masons could secure the arch for a careful examination. The existing party can continue unaided, provided its tired guards take turns resting."
 oe_exp_nile.4.a:0 "Hire masons and examine the chapel carefully."
 oe_exp_nile.4.a.tt:0 "Clue reliability +30; remain for 90 days."
 oe_exp_nile.4.b:0 "Rotate the guards and continue searching."
 oe_exp_nile.4.b.tt:0 "Clue reliability +20, expedition guards -3; remain for 90 days."
 oe_exp_nile.5.t:0 "The Sealed Chest"
 oe_exp_nile.5.d:0 "At Rashid, monks lead the party to a secluded storeroom. Its records list objects once brought from the interior, including a chest with traces of gold covering that resembles the manuscript's description. The leader can remain to examine its seals and provenance, or record the find without endorsing an unproven claim."
 oe_exp_nile.5.a:0 "Examine the seals and escort any credible find home."
 oe_exp_nile.5.a.tt:0 "Clue reliability gives a 5% / 15% / 25% chance of finding the Ark. The relic and Discovery of the Ark modifier are awarded only after a safe return. Remain for 90 days, or 150 days if provisions are below 25."
 oe_exp_nile.5.b:0 "Bring back only the records and observations."
 oe_exp_nile.5.b.tt:0 "Do not seek the Ark on this journey; remain for 30 days before returning."
 oe_exp_nile.6.t:0 "Discovery of the Ark"
 oe_exp_nile.6.d:0 "The expedition has returned safely with an ancient gilded chest and a body of corroborating records. After lengthy examination, the Church accepts its identity and the court receives the relic with solemn ceremony. The Ark has been placed in the capital. Across the empire, its arrival offers the faithful a renewed sense of common conviction."
 oe_exp_nile.6.a:0 "May this faith sustain Rome."
 oe_exp_nile.6.a.tt:0 "Receive the unique Ark of the Covenant and permanent Discovery of the Ark: tolerance of the true faith +1. Prestige +3."
 oe_exp_nile.7.t:0 "Accounts from the Delta"
 oe_exp_nile.7.d:0 "The returning party brings manuscript copies, channel records and sketches of old objects, but no relic that can be identified as the Ark. Court scholars receive the material with care. Patient inquiry has value of its own, and a future expedition will know where to continue."
 oe_exp_nile.7.a:0 "Preserve these accounts."
 oe_exp_nile.7.a.tt:0 "Prestige +1."
 oe_exp_nile.8.t:0 "An Interrupted Search"
 oe_exp_nile.8.d:0 "The expedition could not complete its itinerary. Scattered reports have reached the officials, but unverified discoveries will not be proclaimed. The court imposes no further penalty and asks future travelers to learn from this attempt."
 oe_exp_nile.8.a:0 "Wait for another suitable opportunity."
 oe_exp_sahara.1.t:0 "Beyond the Sea of Sand"
 oe_exp_sahara.1.d:0 "At Tripoli, the caravan loads its waterskins and trade goods. Its guides explain that the road is preserved in wells, stars and generations of merchants' memories, rather than on paper. Imperial traders will journey south to exchange goods and credit for gold, then return by the oasis road."
 oe_exp_sahara.1.a:0 "Let the guides lead the way."
 oe_exp_sahara.2.t:0 "The Wells of Ghadames"
 oe_exp_sahara.2.d:0 "The well keepers of Ghadames welcome the caravan, though the most convenient wells are crowded. A modest fee will refill the waterskins quickly. Waiting for a regular turn instead gives the merchants time to repair their packs and exchange news of the road."
 oe_exp_sahara.2.a:0 "Pay for water and loading."
 oe_exp_sahara.2.a.tt:0 "Water +25; remain for 30 days."
 oe_exp_sahara.2.b:0 "Wait for a regular turn."
 oe_exp_sahara.2.b.tt:0 "Water +10; remain for 75 days."
 oe_exp_sahara.3.t:0 "The Guides of Ghat"
 oe_exp_sahara.3.d:0 "Several small wells ahead are running low this year. Guides at Ghat offer a route around the worst ground. The leader may instead follow the known markers, with closer attention to guards and water."
 oe_exp_sahara.3.a:0 "Hire local guides."
 oe_exp_sahara.3.a.tt:0 "Expedition guards +5, up to 40; remain for 30 days."
 oe_exp_sahara.3.b:0 "Let the leader organize a careful march."
 oe_exp_sahara.3.b.tt:0 "Military ability at least 50: remain for 30 days; otherwise guards -3, water -5 and a 75-day stay."
 oe_exp_sahara.4.t:0 "A Guarantor at Agadez"
 oe_exp_sahara.4.d:0 "Brokers at Agadez offer introductions to buyers farther south. A guarantee fee can secure favorable terms in advance, while a diplomatic leader may earn the same treatment through the cargo manifest and the caravan's reputation. Failure to agree merely means a smaller profit."
 oe_exp_sahara.4.a:0 "Pay a guarantee fee."
 oe_exp_sahara.4.a.tt:0 "Secure favorable trading terms; remain for 30 days."
 oe_exp_sahara.4.b:0 "Negotiate on the strength of our reputation."
 oe_exp_sahara.4.b.tt:0 "Secure favorable terms if the leader has at least 50 diplomatic ability; remain for 60 days."
 oe_exp_sahara.5.t:0 "The Scales of Timbuktu"
 oe_exp_sahara.5.d:0 "At Timbuktu, the merchants open their packs. Gold is weighed repeatedly on small scales while clerks record each exchange in agreed marks. A well-supplied, well-guarded caravan can carry a larger purchase home. A cautious leader may take a lighter load and begin the return sooner."
 oe_exp_sahara.5.a:0 "Load gold according to the caravan's condition."
 oe_exp_sahara.5.a.tt:0 "Load 20 gold; with at least 50 water and 30 guards, load 40, or 60 with favorable trading terms. Deliver to the Constantinople market only after a safe return. Remain for 60 days."
 oe_exp_sahara.5.b:0 "Return with a lighter load."
 oe_exp_sahara.5.b.tt:0 "Load 20 gold and gain 20 water; remain for 30 days."
 oe_exp_sahara.6.t:0 "Scattered Packs on the Homeward Road"
 oe_exp_sahara.6.d:0 "A brief sandstorm frightened the pack animals and scattered several bundles south of Ghat. The caravan is safely sheltered; the only question is whether to hire help to recover them. Moving on will mean accepting a small cargo loss as the cost of the road."
 oe_exp_sahara.6.a:0 "Hire help to recover the packs."
 oe_exp_sahara.6.a.tt:0 "Preserve all gold cargo; remain for 45 days."
 oe_exp_sahara.6.b:0 "The people are safe; accept the small loss."
 oe_exp_sahara.6.b.tt:0 "Gold cargo -5; remain for 30 days."
 oe_exp_sahara.7.t:0 "Gold Across the Desert"
 oe_exp_sahara.7.d:0 "The caravan bells sound once more outside Tripoli. Its gold has been checked, sealed and forwarded to the Constantinople market: [ROOT.GetCountry.MakeScope.GetVariable('oe_exp_last_sahara_gold').GetValue|0] units delivered. Alongside the metal comes an account of wells, distances and trading customs gathered along the road."
 oe_exp_sahara.7.a:0 "File the manifests and welcome the travelers."
 oe_exp_sahara.7.a.tt:0 "Gold goods have been added to the Constantinople market; prestige +1."
 oe_exp_sahara.8.t:0 "A Caravan That Could Not Complete Its Journey"
 oe_exp_sahara.8.d:0 "The caravan could not complete its round trip, and the expected gold did not reach the coast. The court imposes no further fine or punishment, recording the experience for those who prepare a future journey."
 oe_exp_sahara.8.a:0 "Record the lessons and postpone another attempt."
 oe_egypt_land_survey:0 "Survey the Lands of Egypt"
 oe_egypt_land_survey_desc:0 "Send officials to survey the Nile valley. Requires direct ownership of all conquerable Egyptian locations and completion of Plan Egyptian Agricultural Expansion. Costs 1500 ducats plus the native expedition fee of 25 political influence. Once successful, it cannot be repeated; failure permits another attempt after two years."
 oe_egypt_land_survey_outcome_overview:0 "Successful return: add one layer of Egyptian Agricultural Expansion to every qualifying Egyptian agricultural location. Minor expenses during the journey have slower, free alternatives."
 oe_lower_nile_exploration:0 "Explore the Lower Nile"
 oe_lower_nile_exploration_desc:0 "Follow old manuscripts through the delta from Cairo in search of a lost relic. May start during the Ages of Traditions, Renaissance or Discovery; expeditions already underway may finish later. Costs 500 ducats and 25 political influence, with five years between launches. Closes once the Ark is recovered."
 oe_lower_nile_exploration_outcome_overview:0 "Clues improve the chance of finding the Ark. Returning it safely grants the unique relic and permanent Discovery of the Ark: tolerance of the true faith +1."
 oe_cross_the_sahara:0 "Across the Sahara"
 oe_cross_the_sahara_desc:0 "Send a caravan from directly owned Tripoli through the oases to trade for gold at Timbuktu. May start during the Ages of Traditions, Renaissance or Discovery; expeditions already underway may finish later. Costs 300 ducats and 25 political influence, with ten years between launches."
 oe_cross_the_sahara_outcome_overview:0 "Load 20 to 60 units of gold according to the caravan's condition and trading terms, with possible minor cargo losses. Deliver the surviving goods to the Constantinople market after a safe return."
 oe_exp_survey_progress:0 "Surveyed Districts"
 oe_exp_survey_progress_desc:0 "Representative districts whose field inspections are complete, out of five."
 oe_exp_ledger:0 "Ledger Completeness"
 oe_exp_ledger_desc:0 "Completeness of boundary, canal and household records; gaps lengthen the final review."
 oe_exp_provisions:0 "Expedition Provisions"
 oe_exp_provisions_desc:0 "Stores carried by the party; decreases by 1 each traveling month."
 oe_exp_clues:0 "Clue Reliability"
 oe_exp_clues_desc:0 "Chance to find the Ark: 5% below 60 reliability, 15% at 60, and 25% at 80."
 oe_exp_guards:0 "Expedition Guards"
 oe_exp_guards_desc:0 "Effective strength of the escort; does not deduct national manpower or units."
 oe_exp_water:0 "Caravan Water"
 oe_exp_water_desc:0 "Water carried by the caravan; decreases by 1 each traveling month."
 oe_exp_gold_cargo:0 "Gold Cargo"
 oe_exp_gold_cargo_desc:0 "Gold goods still carried by the caravan; delivered to the Constantinople market only after a safe return."
 oe_exp_elapsed:0 "Expedition Duration"
 oe_exp_elapsed_desc:0 "Months elapsed, excluding time waiting for a player decision."
 oe_exp_early_ages_tt:0 "The current age is Traditions, Renaissance or Discovery."
 oe_exp_survey_reward_tt:0 "Add one layer of Egyptian Agricultural Expansion to every qualifying directly owned Egyptian agricultural location."
 oe_exp_survey_retry:0 "Preparing Another Egyptian Survey"
 oe_lower_nile_exploration_cooldown:0 "Preparing a Nile Expedition"
 oe_cross_the_sahara_cooldown:0 "Preparing a Saharan Caravan"
 STATIC_MODIFIER_NAME_oe_discovery_of_the_ark:0 "Discovery of the Ark"
 STATIC_MODIFIER_DESC_oe_discovery_of_the_ark:0 "The relic recovered by the Nile expedition has become a shared focus of the empire's orthodox faith."
 oe_ark_of_the_covenant:0 "Ark of the Covenant"
 oe_ark_of_the_covenant_desc:0 "An ancient relic recovered by the Nile expedition and accepted by the Church as the Ark of the Covenant."

 oe_pacify_epirus: "Pacify Epirus"
 oe_pacify_epirus_desc: "Lead an imperial mission through Thessalonica and compel the garrisons of Rogoi, Arta and Thomokastron to submit, bringing Epirus under direct imperial rule.\n\nOnly one attempt is allowed. The expedition disappears after launch, even if it later fails. Launch cost: 10 Political Influence. The leader must be an adult member of the Crown or Nobility estate of our country.\n\nMap route: Thessalonica–Preveza (Rogoi)–Arta–Parga (Thomokastron)."
 oe_pacify_epirus_outcome_overview: "Success annexes Epirus and gives Arta the Epirote Administrative Center modifier for 30 years (+33 Local Proximity). With Andronikos III leading, Nikephoros always surrenders; successful completion costs Andronikos 1 Health."
 oe_pacify_epirus_waypoint_thessaloniki: "The expedition reaches Thessalonica to address the Epirote succession dispute."
 oe_pacify_epirus_waypoint_preveza: "The expedition reaches the Preveza district and invests the castle of Rogoi."
 oe_pacify_epirus_waypoint_arta: "The expedition reaches Arta, where the gates of the old Epirote capital remain shut."
 oe_pacify_epirus_waypoint_parga: "The expedition turns toward the coast around Parga to besiege Thomokastron."
 oe_exp_epirus.1.t: "The Epirote Succession Crisis"
 oe_exp_epirus.1.d: "After the death of John II Orsini, authority in Epirus passed to the regent Anna Palaiologina, while the young Nikephoros II inherited a title divided by faction and ambition. Anna was no stranger to the imperial house: a great-granddaughter of Michael VIII, she shared the Palaiologan ancestry of Andronikos III.\n\nKinship alone has not opened the western fortresses. Local magnates cling to their privileges, Orsini loyalists look across the sea for support, and imperial officials have yet to command universal obedience. At Thessalonica, envoys place their letters before our expedition leader. The dispute over Arta must now be settled by imperial authority."
 oe_exp_epirus.1.a: "Restore order in the west, in the Emperor’s name."
 oe_exp_epirus.2.t: "The Siege of Rogoi"
 oe_exp_epirus.2.d: "The walls of Rogoi rise above the plain of the Louros, and its garrison watches the imperial banners from behind the battlements. Some still expect relief; others are weighing what resistance may cost their households and their lives.\n\nAn intermediary offers a settlement: a payment equal to one year of Epirote income will persuade the garrison to disarm. Otherwise, our men must remain and let a sixty-day siege do its work."
 oe_exp_epirus.2.a: "Negotiate the garrison’s submission."
 oe_exp_epirus.2.b: "Begin the siege."
 oe_exp_epirus.2.c: "Abandon the siege and withdraw."
 oe_exp_epirus.3.t: "The Siege of Arta"
 oe_exp_epirus.3.desc: "The stout walls of Arta, ancient seat of Epirus, rise above the bend of the Arachthos as its garrison bars the gates and waits for our expedition to falter. Divided between uneasy nobles and hired captains, the defenders may yield to imperial gold, a patient blockade, or a costly storming of the ramparts."
 oe_exp_epirus.3.d: "Abandon the siege and withdraw."
 oe_exp_epirus.3.a: "Bribe the garrison lavishly."
 oe_exp_epirus.3.b: "Invest Arta."
 oe_exp_epirus.3.c: "Storm the walls."
 oe_exp_epirus.4.t: "Arta Requests Negotiations"
 oe_exp_epirus.4.d: "One hundred and eighty days have passed. The banners still fly, but conviction inside Arta has ebbed away. Delegates emerge to ask that the inhabitants and their property be spared. They offer an indemnity and recognition of the Emperor’s judgment.\n\nMercy would allow the old capital to recover quickly. A harsh settlement would remind every wavering fortress that defiance carries a price."
 oe_exp_epirus.4.a: "Offer lenient terms."
 oe_exp_epirus.4.b: "Impose a harsh settlement."
 oe_exp_epirus.5.t: "The Siege of Thomokastron"
 oe_exp_epirus.5.desc: "Perched above the Ionian cliffs, Thomokastron stands as the last coastal stronghold of the Orsini faction, its surf-beaten cove hiding swift vessels ready for escape. Whether we buy off the garrison, settle in for a year-long blockade, or storm the walls by force will decide the final fate of Epirus."
 oe_exp_epirus.5.d: "Abandon the siege and withdraw."
 oe_exp_epirus.5.a: "Bribe the garrison lavishly."
 oe_exp_epirus.5.b: "Invest Thomokastron."
 oe_exp_epirus.5.c: "Storm the walls."
 oe_exp_epirus.7.t: "Nikephoros II Flees to Naples"
 oe_exp_epirus.7.d: "When the imperial banner finally rises above the walls, Nikephoros’s quarters are found empty. A small vessel slipped away under cover of darkness, carrying the Orsini heir toward Naples. We have taken his fortress without securing his personal submission.\n\nThe expedition will nevertheless bring Epirus under direct rule, with Arta serving as its administrative center. Across the sea, another exile will nurse the memory of a lost title."
 oe_exp_epirus.7.a: "The fortresses have yielded. Complete the annexation."
 oe_exp_epirus.8.t: "Nikephoros II Surrenders"
 oe_exp_epirus.8.d: "At last the gates of Thomokastron open. Nikephoros leaves the fortress and accepts the Emperor’s judgment. The garrison lays down its weapons; attendants surrender accounts, seals and valuables. Walls and foreign patrons will no longer arbitrate the Epirote succession.\n\nNikephoros will be taken to Thessalonica under imperial supervision. New officials and records will make Arta the administrative center of Epirus. The long dispute in the west has reached a Roman settlement."
 oe_exp_epirus.8.a: "Accept his submission and restore direct rule."
 oe_exp_epirus.9.t: "The Epirote Expedition Ends"
 oe_exp_epirus.9.d: "The expedition has failed to pacify Epirus. Withdrawal, the loss of its leader or a change in political circumstances has brought the original plan to an end. Envoys pack away their papers and the last campfires die, leaving the western question to be settled by other means.\n\nThis expedition’s sole attempt has been spent. Epirus is not annexed, and Arta receives no administrative-center modifier."
 oe_exp_epirus.9.a: "Recall those who remain."
 oe_exp_epirus.inactive: "The expedition has already ended."
 oe_epi_wait_60_tt: "The expedition remains here for #Y 60 days#! before continuing to Arta."
 oe_epi_wait_180_tt: "The expedition remains at Arta for #Y 180 days#!, then Arta Requests Negotiations fires."
 oe_epi_wait_365_tt: "The expedition remains at Thomokastron for #Y 365 days#! before Nikephoros’s fate is decided."
 oe_epi_destroy_army_tt: "Destroy the entire professional army listed below, with more than #Y 1,000 soldiers#! and no levies or mercenaries."
 oe_epi_completion_tt: "Successfully end the expedition and annex Epirus. Arta gains Epirote Administrative Center for #Y 30 years#!, granting #G +33#! Local Proximity. If Andronikos III led the expedition, he loses #R 1#! Health."
 oe_epirus_administrative_center: "Epirote Administrative Center"
 oe_epirus_administrative_center_desc: "New offices, archives and communications make Arta the center of imperial administration in Epirus."
 STATIC_MODIFIER_NAME_oe_epirus_administrative_center: "Epirote Administrative Center"
 STATIC_MODIFIER_DESC_oe_epirus_administrative_center: "Arta administers Epirus and strengthens the connections of imperial rule in the west."
