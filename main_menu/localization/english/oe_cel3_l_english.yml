 STATIC_MODIFIER_NAME_oe_cel3_duhu_charter_mod: "Newly Chartered Grand Protectorate"
 STATIC_MODIFIER_DESC_oe_cel3_duhu_charter_mod: "Armed with the imperial tiger tally and bronze seal, the newly chartered Grand Protectorate consolidates frontier governance and steadfast loyalty to the Son of Heaven."
 STATIC_MODIFIER_NAME_oe_cel3_first_charter_mod: "First Imperial Protectorate Charter"
 STATIC_MODIFIER_DESC_oe_cel3_first_charter_mod: "Having promulgated the first trans-continental Grand Protectorate charter, the Celestial court commands wider maritime reach and heightened vassal loyalty."
 STATIC_MODIFIER_NAME_oe_cel3_frontier_trade_mod: "Protectorate Frontier Entrepots"
 STATIC_MODIFIER_DESC_oe_cel3_frontier_trade_mod: "Chartered entrepots anchored in the Grand Protectorates funnel caravan customs and maritime tribute straight back to the imperial treasury."
 STATIC_MODIFIER_NAME_oe_cel3_tribute_audience_mod: "Myriad Nations Imperial Audience"
 STATIC_MODIFIER_DESC_oe_cel3_tribute_audience_mod: "The quinquennial tribute audience welcomes frontier envoys and merchant caravans, swelling imperial tribute revenues and market authority."
 STATIC_MODIFIER_NAME_oe_cel3_grand_tribute_festival_mod: "Four-Seas Silver & Spice Grand Festival"
 STATIC_MODIFIER_DESC_oe_cel3_grand_tribute_festival_mod: "Tribute fleets from three or more continents arrive in concert, turning the imperial capital into the clearing house of global silver, spice, and silk."
 STATIC_MODIFIER_NAME_oe_cel3_ocean_charting_mod: "Four-Seas Nautical Rutters"
 STATIC_MODIFIER_DESC_oe_cel3_ocean_charting_mod: "Combining charts submitted by overseas protectorates, the Admiralty expands shipyards and extends blue-water fleet range across the oceans."
 STATIC_MODIFIER_NAME_oe_cel3_dynastic_seal_mod: "Dynastic Protectorate Seals Recast"
 STATIC_MODIFIER_DESC_oe_cel3_dynastic_seal_mod: "Imperial seals and frontier titles have been harmonized with the reigning dynasty's institutions, reinforcing mandate legitimacy across every protectorate."
 STATIC_MODIFIER_NAME_oe_cel3_sun_never_sets_mod: "Four Seas Submitted: Celestial Sun Never Sets"
 STATIC_MODIFIER_DESC_oe_cel3_sun_never_sets_mod: "Five or more trans-continental Grand Protectorates anchor the Celestial trade and defense network across land and sea."
 STATIC_MODIFIER_NAME_oe_cel3_eight_directions_mod: "Eight Directions Harmonized Under Heaven"
 STATIC_MODIFIER_DESC_oe_cel3_eight_directions_mod: "With eight trans-continental Grand Protectorates operating in unison, the Celestial order spans the known world in unmatched prestige and commercial splendor."
 STATIC_MODIFIER_NAME_oe_cel3_pacific_meridian_mod: "Pacific Meridian Trade Accord"
 STATIC_MODIFIER_DESC_oe_cel3_pacific_meridian_mod: "The Celestial Empire and Nova Elysia demarcate peaceful Pacific sea lanes, granting both realms superior maritime trade efficiency and ocean range."
 STATIC_MODIFIER_NAME_oe_cel3_silver_porcelain_mod: "Silver-for-Silk & Porcelain Treaty"
 STATIC_MODIFIER_DESC_oe_cel3_silver_porcelain_mod: "Chartered exchanges of New World silver for imperial silk and porcelain sustain booming customs receipts and urban prosperity."
 STATIC_MODIFIER_NAME_oe_cel3_pacific_rivalry_mod: "Pacific Hegemony Standoff"
 STATIC_MODIFIER_DESC_oe_cel3_pacific_rivalry_mod: "Competing naval displays across the Pacific spur rapid shipbuilding, heightened sailor recruitment, and fierce maritime pride."
 STATIC_MODIFIER_NAME_oe_cel3_io_demarcation_mod: "Indian Ocean Sea-Lane Demarcation"
 STATIC_MODIFIER_DESC_oe_cel3_io_demarcation_mod: "Joint customs charters between Ceylon, Malabar, and the Red Sea secure peaceful maritime commerce for both eastern and western empires."
 STATIC_MODIFIER_NAME_oe_cel3_io_spice_contest_mod: "Indian Ocean Spice-Lane Contest"
 STATIC_MODIFIER_DESC_oe_cel3_io_spice_contest_mod: "Relentless fleet patrols between Malacca, Ceylon, and Hormuz keep maritime presence high and sailors battle-ready."
 STATIC_MODIFIER_NAME_oe_cel3_twin_suns_charter_mod: "Trans-Eurasian Twin-Suns Peace Charter"
 STATIC_MODIFIER_DESC_oe_cel3_twin_suns_charter_mod: "Mutual recognition between the Celestial Empire and the Roman world stabilizes global protectorates while accelerating trade and scholarly exchange."
 STATIC_MODIFIER_NAME_oe_cel3_celestial_primacy_mod: "Unilateral Celestial Primacy"
 STATIC_MODIFIER_DESC_oe_cel3_celestial_primacy_mod: "Rejecting any formal parity with western courts, the Son of Heaven asserts undivided universal sovereignty and strengthens imperial centralization."
 STATIC_MODIFIER_NAME_oe_cel3_duhu_stipend_mod: "Imperial Stipends & Silks"
 STATIC_MODIFIER_DESC_oe_cel3_duhu_stipend_mod: "Generous stipends and silk grants from the imperial court cement the protectorate's loyalty and calm frontier unrest."
 STATIC_MODIFIER_NAME_oe_cel3_duhu_discipline_mod: "Protectorate Censorate Audit"
 STATIC_MODIFIER_DESC_oe_cel3_duhu_discipline_mod: "Imperial censors tighten fiscal and military discipline across distant protectorates, raising administrative efficiency and tribute collection."
 STATIC_MODIFIER_NAME_oe_cel3_daqin_envoy_mod: "Embassies of Taixi & Daqin"
 STATIC_MODIFIER_DESC_oe_cel3_daqin_envoy_mod: "Following the establishment of the Taixi-Daqin Protectorate, scholars and merchants from the Mediterranean enrich imperial trade and learning."
 STATIC_MODIFIER_NAME_oe_cel3_daqin_arsenal_mod: "Taixi Foundry & Cartography Bureau"
 STATIC_MODIFIER_DESC_oe_cel3_daqin_arsenal_mod: "Master founders and cartographers from the European protectorate modernize imperial artillery, shipyards, and technical research."
 STATIC_MODIFIER_NAME_oe_cel3_xinzhou_envoy_mod: "Trans-Pacific Xinzhou Silver Post"
 STATIC_MODIFIER_DESC_oe_cel3_xinzhou_envoy_mod: "Scheduled imperial galleons from the Xinzhou Grand Protectorate bind New World mines and commodities directly to East Asian ports."
 STATIC_MODIFIER_NAME_oe_cel3_pacific_charts_mod: "Pacific Kuroshio & Trade-Wind Charts"
 STATIC_MODIFIER_DESC_oe_cel3_pacific_charts_mod: "Joint surveys between Fusang and Xinzhou master the Pacific currents, extending imperial naval reach across the entire hemisphere."
 oe_cel3.1.title: "Imperial Edict of the Grand Protectorates"
 oe_cel3.1.desc: "Before the Golden Hall, heralds proclaim the imperial charter and bestow the gilt tiger tally and bronze seal. Distant provinces are no longer drained by distant direct administration, but anchored by a Grand Protectorate holding the frontier in the Son of Heaven's name."
 oe_cel3.1.a: "Bestow the Tiger Tally & Establish the Frontier Charter"
 oe_cel3.1.b: "Open Chartered Entrepots to Fund the Frontier"
 oe_cel3.2.title: "Myriad Nations Tribute: Maritime Ships & Silk Caravans"
 oe_cel3.2.desc: "The quinquennial Myriad Nations Tribute audience has arrived. Envoys, merchant galleons, and frontier caravans from the empire's protectorates stream into the capital market, delivering tribute silver, exotic commodities, expanded merchant power, and renewed Celestial authority."
 oe_cel3.2.a: "Host the Grand Audience & Open the Tribute Exchange"
 oe_cel3.2.b: "Bestow Generous Counter-Gifts Upon Every Protectorate"
 oe_cel3.3.title: "Myriad Nations Tribute: Four-Seas Silver & Spice Festival"
 oe_cel3.3.desc: "Embassies from three or more continents converge on the imperial court in the same season! Galleons bearing American silver, Nanyang spices, Persian silks, and Western wares turn the capital into the commercial axis of the entire globe."
 oe_cel3.3.a: "Open the Four-Seas Grand Customs & Clearing Houses"
 oe_cel3.3.b: "Compile Oceanic Rutters & Expand the Treasure Fleet"
 oe_cel3.4.title: "Harmonizing the Dynastic Protectorate Seals"
 oe_cel3.4.desc: "With multiple frontier protectorates operating under the throne, the Ministry of Rites proposes recasting every protectorate's bronze seal and official designation to match the reigning dynasty's institutional tradition—whether Yuan Branch Secretariats, Ming Grand Protectorates, Qing Generalcies, or universal Celestial titles."
 oe_cel3.4.a: "Recast Every Protectorate Seal Under the Reigning Dynasty"
 oe_cel3.4.b: "Confirm Existing Commissions & Reassure Distant Governors"
 oe_cel3.5.title: "Four Seas Submitted: The Celestial Sun Never Sets"
 oe_cel3.5.desc: "Five trans-continental Grand Protectorates now stand watch across mountain, steppe, and ocean. Wherever the sun rises or sets, imperial seals govern the sea lanes and caravan roads in an enduring Celestial order."
 oe_cel3.5.a: "Proclaim the Realm Where the Celestial Sun Never Sets"
 oe_cel3.6.title: "Eight Directions Harmonized Under Heaven"
 oe_cel3.6.desc: "Eight trans-continental Grand Protectorates have been chartered across Eurasia and the oceans beyond. Court chroniclers record an unprecedented universal harmony binding East and West into a single tributary and commercial cosmos."
 oe_cel3.6.a: "Inscribe the Stele of Eight Directions for All Ages"
 oe_cel3.7.title: "Twin Suns Across the Pacific"
 oe_cel3.7.desc: "Imperial treasure ships sailing from Fusang and Xinzhou have encountered the copper-clad fleets of Nova Elysia off the Pacific rim! Dragon banners and purple double-headed eagles salute one another across the golden swell—two empires on which the sun never sets must decide the fate of the great ocean."
 oe_cel3.7.a: "Sign the Pacific Meridian Trade Accord"
 oe_cel3.7.b: "Ratify the Silver-for-Silk & Porcelain Treaty"
 oe_cel3.7.c: "Contest Pacific Naval Supremacy"
 oe_cel3.8.title: "Twin Phoenixes of the Indian Ocean"
 oe_cel3.8.desc: "As the empire's Nanyang and Western Ocean protectorate fleets patrol Ceylon and Malabar, Roman squadrons operating out of Egypt and the Red Sea arrive on the monsoon winds. At the crossroads of the spice routes, East and West face a historic choice."
 oe_cel3.8.a: "Negotiate the Indian Ocean Sea-Lane Demarcation"
 oe_cel3.8.b: "Press for Exclusive Dominance of the Spice Lanes"
 oe_cel3.9.title: "Eurasian Concert: Twin Suns Co-Governance"
 oe_cel3.9.desc: "Both the Celestial Empire and the Roman world now anchor multi-continental networks of protectorates and overseas realms. Envoys propose crowning the Eurasian diplomatic order with a Twin-Suns Peace Charter defining mutual recognition, maritime law, and trade."
 oe_cel3.9.a: "Sign the Trans-Eurasian Twin-Suns Peace Charter"
 oe_cel3.9.b: "Assert Unilateral Celestial Sovereignty"
 oe_cel3.10.title: "Far-Frontier Conciliation & Protectorate Audit"
 oe_cel3.10.desc: "With distant Grand Protectorates commanding wealthy ports and frontier armies thousands of leagues away, court ministers debate policy: bestow generous stipends to secure loyal hearts, or dispatch imperial censors to tighten fiscal and military discipline."
 oe_cel3.10.a: "Bestow Imperial Stipends & Silks for Loyalty"
 oe_cel3.10.b: "Dispatch Censors to Tighten Discipline & Authority"
 oe_cel3.11.title: "Embassies from Taixi & Daqin"
 oe_cel3.11.desc: "The Grand Protectorate of Taixi and Daqin has been established in the far west! Envoys, master artisans, and scholars from the Mediterranean and Atlantic coasts arrive in the imperial capital bearing fine cloth, treatises, and bronze-foundry designs."
 oe_cel3.11.a: "Welcome the Western Embassies & Open Metropolitan Demand"
 oe_cel3.11.b: "Fund a Western Foundry & Cartography Academy"
 oe_cel3.12.title: "Envoys from Xinzhou Across the Eastern Ocean"
 oe_cel3.12.desc: "The Grand Protectorate of Xinzhou now stands across the Pacific! Official treasure galleons from the western coasts and Andean highlands complete the ocean crossing with silver, cocoa, sugar, and new Pacific charts."
 oe_cel3.12.a: "Charter the Trans-Pacific Silver Post"
 oe_cel3.12.b: "Reward the Ocean Navigators & Chart the Trade Winds"
