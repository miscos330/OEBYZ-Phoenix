 oe_cel3_dem_tribute_asia: "Myriad Nations Asian & Maritime Tribute Demand"
 oe_cel3_dem_tribute_asia_desc: "Envoys and treasure ships from the Nanyang, Western Ocean, and Eastern Sea protectorates ignite metropolitan demand for pepper, cloves, incense, ivory, and pearls."
 oe_cel3_dem_tribute_steppe_persia: "Myriad Nations Silk Road & Steppe Tribute Demand"
 oe_cel3_dem_tribute_steppe_persia_desc: "Caravans from Anxi, Beiting, and Persia converge on the imperial market, driving strong demand for silk, saffron, dyes, furs, and steppe horses."
 oe_cel3_dem_tribute_europe_med: "Myriad Nations Far-Western & Mediterranean Tribute Demand"
 oe_cel3_dem_tribute_europe_med_desc: "Embassies from the Taixi-Daqin Grand Protectorate stimulate metropolitan appetite for fine cloth, scholarly books, firearms, and heavy artillery."
 oe_cel3_dem_tribute_americas: "Myriad Nations Xinzhou & Pacific Silver Tribute Demand"
 oe_cel3_dem_tribute_americas_desc: "Trans-Pacific tribute galleons from Xinzhou fill the imperial customs houses, fueling strong market clearing in silver, cocoa, tobacco, and sugar."
 oe_cel3_myriad_tribute_mp: "Myriad Nations Tribute Merchant Power"
 oe_cel3_dec_charter_duhu_1.title: "Charter the Grand Protectorate of Anxi"
