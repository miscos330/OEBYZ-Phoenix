l_english:
 oe_byz_opening.1.t: "The Reign of Andronikos III"
 oe_byz_opening.1.d: "The reign of Andronikos III is the last light before Byzantium slides into the abyss. Under [ROOT.GetCountry.GetGovernment.GetRuler.GetName], the regular army has begun to recover, the fleet has been rebuilt, and Chios and other maritime possessions have returned to Roman rule. Having overthrown his grandfather, the emperor has sought to restore order through administrative and economic reform. Yet territorial losses, the rise of the Turks and Serbs, an exhausted treasury and the shadow of civil war still hang over the empire like the #Y sword of Damocles#!.\n\nOnce the bridge between East and West, Rome now watches Genoa and Venice reap the riches passing through the Black Sea and the Levant. Since Andronikos II disbanded the fleet, the gulf between us and the Latins has never been wider. A few new warships cannot restore centuries of lost commerce, and concessions at the straits remain the price of imperial weakness.\n\nThe friendship of #Y Kantakouzenos#! won the emperor his throne and the support of the military aristocracy. To govern, however, he must also rely on the professional officials of Constantinople, the patriarchate and the merchant guilds. On one side stands his trusted friend, backed by powerful military families; on the other, his son #Y John V#!, the rightful heir around whom those resentful of the favourite may gather.\n\nThe emperor dismisses these fears. His friend would never harm his heir. Besides, he is still in the #R prime of life#!. What could there be to fear?"
 oe_byz_opening.1.a: "May God preserve Rome."
 oe_pillars_adjust_imperial_style: "Set the Imperial Name and Colours"
 oe_pillars_adjust_imperial_style_desc: "Summon the scribes and heralds to choose the name and map colour of the empire. No resource cost; may be used again."
 oe_pillars_adjust_imperial_style_edict_summary: "Choose the imperial name and map colour\nFree; repeatable"
 oe_pillars_country_name_desc: "The scribes present a fresh imperial decree. By what name shall Rome make itself known to the world?"
 oe_pillars_country_color_desc: "The heralds unfold a map of the empire. Choose the colour in which its cities and frontiers shall appear."
 oe_byz_opening.2.t: "The Emperor Falls Gravely Ill"
 oe_byz_opening.2.d: "The purple curtains remain closed, and the lamps in the imperial chamber burn through the night. The physicians emerge again and again, but none will promise recovery. Andronikos, once so vigorous in the saddle and so eloquent at the banquet table, can now hear only prayers beyond the heavy drapes.\n\nAt dawn his breathing ceases. Courtiers still whisper in the corridors, while the army has lost its most familiar voice of command. Bells carry across the straits, spreading grief and uncertainty through Constantinople. The throne stands empty once more. Who will lead Rome into the morning?"
 oe_byz_opening.2.a: "May the Lord receive his soul."
 OE_ANDRONIKOS_ILLNESS_EFFECT_TT: "Andronikos III dies of illness. Byzantium loses #R 10 Legitimacy#!."
