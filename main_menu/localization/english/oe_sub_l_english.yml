 oe_sub_summon_subject_heir_hostage: "Summon Vassal Heir to Court"
 oe_sub_summon_subject_heir_hostage_concept: "[character|e]"
 oe_sub_summon_subject_heir_hostage_act: "$oe_sub_summon_subject_heir_hostage$"
 oe_sub_summon_subject_heir_hostage_desc: "Summon a subject's heir or royal kinsman to reside and study at the imperial court for five years, slashing liberty desire while hosted and triggering a homecoming bond event on return. 15-year cooldown."
 oe_sub_summon_subject_heir_hostage_desc_specific: "Summon [SCOPE.sCharacter('recipient').GetName] to reside and study at the court of [SCOPE.sCountry('actor').GetName] for five years."
