 oe_sub_educate_subject_noble_at_court: "Patronize Subject Noble at Academy"
 oe_sub_educate_subject_noble_at_court_concept: "[character|e]"
 oe_sub_educate_subject_noble_at_court_act: "$oe_sub_educate_subject_noble_at_court$"
 oe_sub_educate_subject_noble_at_court_desc: "Spend 60 gold to sponsor a young subject noble or official at the imperial academy, raising ADM, DIP, and MIL by 5 each with a strong chance to adopt the overlord's culture. 10-year cooldown."
 oe_sub_educate_subject_noble_at_court_desc_specific: "Patronize [SCOPE.sCharacter('recipient').GetName] at the imperial academy of [SCOPE.sCountry('actor').GetName]."
 oe_sub_educate_subject_noble_at_court_past: "[SCOPE.sCharacter('recipient').GetName] Enrolled at Imperial Academy"
 oe_sub_educate_subject_noble_at_court_act_past: "[SCOPE.sCountry('actor').GetName] sponsored [SCOPE.sCharacter('recipient').GetName] at the imperial academy."
 oe_sub_recall_disloyal_governor: "Recall Disloyal Vassal Minister"
 oe_sub_recall_disloyal_governor_concept: "[character|e]"
 oe_sub_recall_disloyal_governor_act: "$oe_sub_recall_disloyal_governor$"
 oe_sub_recall_disloyal_governor_desc: "Spend 10 prestige to haul a restive minister or commander from a disloyal subject (loyalty < 45 or liberty desire >= 45) to the imperial capital under house arrest, briefly shaking subject stability while cutting liberty desire by 15. 15-year cooldown."
 oe_sub_recall_disloyal_governor_desc_specific: "Recall restive vassal official [SCOPE.sCharacter('recipient').GetName] to [SCOPE.sCountry('actor').GetName] under imperial detention."
 oe_sub_recall_disloyal_governor_past: "[SCOPE.sCharacter('recipient').GetName] Recalled to Imperial Court"
 oe_sub_recall_disloyal_governor_act_past: "[SCOPE.sCountry('actor').GetName] recalled [SCOPE.sCharacter('recipient').GetName] under imperial detention."
 oe_sub_sponsor_dynastic_marriage_pact: "Sponsor Dynastic Marriage Pact"
 oe_sub_sponsor_dynastic_marriage_pact_concept: "[marriage|e]"
 oe_sub_sponsor_dynastic_marriage_pact_act: "$oe_sub_sponsor_dynastic_marriage_pact$"
 oe_sub_sponsor_dynastic_marriage_pact_desc: "Provide 100 gold in dowry to wed an eligible royal kinsman into a monarchy subject's ruling court, slashing liberty desire by 20 and forging a twenty-year dynastic bond. 15-year cooldown."
 oe_sub_sponsor_dynastic_marriage_pact_desc_specific: "Sponsor a dynastic marriage for [SCOPE.sCharacter('recipient').GetName] with the selected monarchy subject."
 oe_sub_sponsor_dynastic_marriage_pact_past: "[SCOPE.sCharacter('recipient').GetName] Wed in Dynastic Pact"
 oe_sub_sponsor_dynastic_marriage_pact_act_past: "[SCOPE.sCountry('actor').GetName] sealed a dynastic marriage pact through [SCOPE.sCharacter('recipient').GetName]."
 oe_sub.30.t: "Imperial Arbitration: A Feud of Vassals"
 oe_sub.30.d: "Envoys from the feuding subjects kneel before the imperial throne, each laying petitions of grievance and border claims. Having imposed a five-year truce, the court awaits the suzerain's final verdict."
 oe_sub.30.a: "Deliver an Impartial Ruling"
 oe_sub.30.b: "Favor the Appealing Vassal"
 oe_sub.30.c: "Fine Both Parties for Breaching the Peace"
 oe_sub.40.t: "The Imperial Diet of Homage"
 oe_sub.40.d: "Vassal rulers and envoys assemble at the imperial capital to render homage and renew their oaths of fealty. Imperial censors scrutinize every delegation for signs of quiet disaffection."
 oe_sub.40.a: "Confirm Charters and Reprimand Plotters"
 oe_sub.40.b: "Host a Grand Imperial Banquet"
 oe_sub.40.c: "Enforce Strict Imperial Vassal Law"
 oe_sub.50.t: "A Prince-Viceroy Takes His Seat"
 oe_sub.50.d: "The royal kinsman dispatched from the imperial court has arrived at the subject's seat, met by local magnates and officials. Shall we invest him with full viceregal insignia, or attach treasury officers to assist his administration?"
 oe_sub.50.a: "Grant Full Viceregal Insignia"
 oe_sub.50.b: "Attach Imperial Treasury Engineers"
 oe_sub.55.t: "The Vassal Heir Returns from Court"
 oe_sub.55.d: "After five years studying law, statecraft, and letters at the imperial academy, the hosted vassal heir is ready to return home. Envoys have arrived to escort him back with due ceremony."
 oe_sub.55.a: "Send Home with Imperial Honors"
 oe_sub.55.b: "Extend Imperial Court Service for Three Years"
 oe_sub.60.t: "The Frontier Protectorates Flourish"
 oe_sub.60.d: "Two or more of the great historic frontier seats — Kashgar, Beshbalik, Nurgan, and Thang Long — now stand beneath the empire's Frontier Protectorate banner. Relay stations hum with envoys and silk-road trade."
 oe_sub.60.a: "Codify the Frontier Protectorate System"
 oe_sub.60.b: "Cut Frontier Trade Tolls for All Protectorates"
