 oe_sub_dispatch_prince_viceroy_act: "$oe_sub_dispatch_prince_viceroy$"
 oe_sub_dispatch_prince_viceroy_desc: "Spend 100 gold and 10 prestige to dispatch an adult prince of the ruling house to oversee a subject realm for twenty years, curbing unrest and triggering an investiture event. 20-year cooldown."
 oe_sub_dispatch_prince_viceroy_desc_specific: "Dispatch royal kinsman [SCOPE.sCharacter('recipient').GetName] as Prince-Viceroy to the selected subject."
