 oe_sub_pays_foederati: "Foederati Military Tribute"
 oe_sub_pays_charter_city: "Chartered Free City Commercial Share"
 oe_sub_pays_brother_kingdom: "Imperial Brother-Kingdom Tribute"
 oe_sub_pays_duhu: "Frontier Protectorate Symbolic Tribute"
 oe_sub_foederati: "Foederati"
 oe_sub_foederati_desc: "A frontier military ally modeled on classical Roman Foederati. It pays minimal coin tribute in exchange for manpower, garrison duty, and mandatory war service; the overlord may build roads, forts, and levy regiments on its soil, and must demote it to a regular vassal before annexation."
 LEAD_oe_sub_foederati: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_sub_foederati: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_sub_foederati_subject_opinion: "Imperial Overlord"
 oe_sub_foederati_overlord_opinion: "Imperial Foederati"
 oe_sub_charter_city: "Chartered Free City"
 oe_sub_charter_city_desc: "An autonomous coastal merchant republic chartered on the model of Cherson, Ragusa, Zaytun, and Novgorod. Exempt from distant offensive wars, it yields heavy commercial tribute, fleet basing rights, merchant capacity, and rapid two-way institution spread."
 LEAD_oe_sub_charter_city: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_sub_charter_city: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_sub_charter_city_subject_opinion: "Charter Overlord"
 oe_sub_charter_city_overlord_opinion: "Chartered Free City"
 oe_sub_brother_kingdom: "Imperial Brother-Kingdom"
 oe_sub_brother_kingdom_desc: "A high-ranking partner kingdom invested by an imperial overlord of the same faith or dynasty. Bearing deep loyalty and high prestige, it strengthens imperial legitimacy and diplomatic capacity while transferring substantial great-power score, and may be integrated after fifty years of cordial ties."
 LEAD_oe_sub_brother_kingdom: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_sub_brother_kingdom: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_sub_brother_kingdom_subject_opinion: "Imperial Senior Sovereign"
 oe_sub_brother_kingdom_overlord_opinion: "Imperial Brother-Kingdom"
 oe_sub_protectorate_duhu: "Frontier Protectorate (Duhu)"
 oe_sub_protectorate_duhu_desc: "A frontier protectorate modeled on the classical Anxi, Beiting, Nurgan, and Annan protectorates. Demanding minimal diplomatic capacity, it grants the overlord road-building, fortress construction, food access, and enforced peace while trading slower assimilation for high control and loyalty; holding the four historic seats unlocks extra silk-road prestige."
 LEAD_oe_sub_protectorate_duhu: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_sub_protectorate_duhu: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_sub_protectorate_duhu_subject_opinion: "Protectorate Suzerain"
 oe_sub_protectorate_duhu_overlord_opinion: "Frontier Protectorate"
 STATIC_MODIFIER_NAME_oe_sub_foederati_muster: "Foederati Frontier Muster"
 STATIC_MODIFIER_DESC_oe_sub_foederati_muster: "Freshly invested as Foederati, the border realm reinforces garrisons, levies, and frontier fortifications."
 STATIC_MODIFIER_NAME_oe_sub_duhu_anxi: "Anxi Protectorate Command"
 STATIC_MODIFIER_DESC_oe_sub_duhu_anxi: "Anchored at Kashgar on the western Silk Road, safeguarding oasis trade caravans and Pamir frontier passes."
 STATIC_MODIFIER_NAME_oe_sub_duhu_beiting: "Beiting Protectorate Command"
 STATIC_MODIFIER_DESC_oe_sub_duhu_beiting: "Anchored at Beshbalik north of the Tianshan, commanding steppe relay stations and mounted frontier auxiliaries."
 STATIC_MODIFIER_NAME_oe_sub_duhu_nurgan: "Nurgan Regional Command"
 STATIC_MODIFIER_DESC_oe_sub_duhu_nurgan: "Anchored at Nurgan on the Amur estuary, maintaining imperial order and riverine authority across the northeast frontier."
 STATIC_MODIFIER_NAME_oe_sub_duhu_annan: "Annan Protectorate Command"
 STATIC_MODIFIER_DESC_oe_sub_duhu_annan: "Anchored at Thang Long on the Red River delta, linking South China Sea commerce with imperial frontier administration."
 STATIC_MODIFIER_NAME_oe_sub_duhu_overlord_network: "Protectorate Silk-Road Prestige"
 STATIC_MODIFIER_DESC_oe_sub_duhu_overlord_network: "Frontier protectorates holding key Eurasian seats channel overland trade prestige and diplomatic renown back to the imperial throne."
 STATIC_MODIFIER_NAME_oe_sub_four_duhu_glory: "Glory of the Frontier Protectorates"
 STATIC_MODIFIER_DESC_oe_sub_four_duhu_glory: "Multiple historic protectorate seats stand beneath the imperial banner, projecting unmatched suzerain prestige across Eurasia."
 STATIC_MODIFIER_NAME_oe_sub_fort_comp_tax: "Fortress Requisition Tax Relief"
 STATIC_MODIFIER_DESC_oe_sub_fort_comp_tax: "Five years of fiscal relief granted by the overlord to compensate for ceding a strategic frontier fortress."
 STATIC_MODIFIER_NAME_oe_sub_requisitioned_fleet: "Requisitioned Vassal Squadron"
 STATIC_MODIFIER_DESC_oe_sub_requisitioned_fleet: "Coastal subjects supply warships and trained crews under imperial requisition, bolstering naval tradition and easing fleet upkeep."
 STATIC_MODIFIER_NAME_oe_sub_tribute_remitted: "Imperial Tribute Remission"
 STATIC_MODIFIER_DESC_oe_sub_tribute_remitted: "A decade of remitted tribute eases fiscal pressure on the subject treasury and deepens loyalty to the overlord."
 STATIC_MODIFIER_NAME_oe_sub_overlord_remit_tribute: "Imperial Tribute Concession"
 STATIC_MODIFIER_DESC_oe_sub_overlord_remit_tribute: "The imperial court foregoes part of its subject revenue to cultivate enduring vassal loyalty."
 STATIC_MODIFIER_NAME_oe_sub_heavy_war_tribute: "Extraordinary War Tribute Burden"
 STATIC_MODIFIER_DESC_oe_sub_heavy_war_tribute: "Raising emergency war funds for the overlord strains local tax collection and stirs unrest."
 STATIC_MODIFIER_NAME_oe_sub_imperial_engineers: "Imperial Engineering Corps Aid"
 STATIC_MODIFIER_DESC_oe_sub_imperial_engineers: "Imperial engineers and master masons accelerate fortifications, public works, and urban growth across the subject realm."
 STATIC_MODIFIER_NAME_oe_sub_imperial_drill: "Imperial Military Drill Mission"
 STATIC_MODIFIER_DESC_oe_sub_imperial_drill: "Overlord drillmasters reorganize vassal regiments under imperial tactical doctrine, lifting discipline and battlefield morale."
 STATIC_MODIFIER_NAME_oe_sub_shared_commercial_code: "Imperial Shared Commercial Code"
 STATIC_MODIFIER_DESC_oe_sub_shared_commercial_code: "Unified weights, measures, and commercial courts bind overlord and subject markets while accelerating institution spread."
 STATIC_MODIFIER_NAME_oe_sub_frontier_subsidy: "Imperial Frontier Garrison Subsidy"
 STATIC_MODIFIER_DESC_oe_sub_frontier_subsidy: "Standing imperial subsidies underwrite frontier fortress maintenance and expand border garrisons facing rival powers."
 STATIC_MODIFIER_NAME_oe_sub_imperial_diet_authority: "Authority of the Imperial Diet"
 STATIC_MODIFIER_DESC_oe_sub_imperial_diet_authority: "Having received the solemn homage of assembled vassals, the imperial throne enjoys heightened legitimacy and suzerain obedience."
 STATIC_MODIFIER_NAME_oe_sub_famous_general_garrison: "Imperial Marshal in Command"
 STATIC_MODIFIER_DESC_oe_sub_famous_general_garrison: "A seasoned imperial commander dispatched by the overlord stiffens local discipline, border defenses, and allegiance."
 STATIC_MODIFIER_NAME_oe_sub_dynastic_regency: "Imperial Prince-Viceroy Oversight"
 STATIC_MODIFIER_DESC_oe_sub_dynastic_regency: "A prince of the ruling house presides over vassal affairs, curbing separatism and anchoring dynastic loyalty."
 STATIC_MODIFIER_NAME_oe_sub_heir_at_imperial_court: "Vassal Heir at Imperial Court"
 STATIC_MODIFIER_DESC_oe_sub_heir_at_imperial_court: "With its heir or royal kinsman residing at the overlord's court, the subject remains steadfastly loyal."
 STATIC_MODIFIER_NAME_oe_sub_court_educated_bond: "Imperial Court Education Bond"
 STATIC_MODIFIER_DESC_oe_sub_court_educated_bond: "Returning from years at the imperial court, the educated heir fosters enduring loyalty and institutional adoption at home."
 STATIC_MODIFIER_NAME_oe_sub_overlord_honor_prestige: "Suzerain Fountain of Honors"
 STATIC_MODIFIER_DESC_oe_sub_overlord_honor_prestige: "Bestowing coveted imperial dignities upon loyal vassal rulers elevates the court's diplomatic standing."
 STATIC_MODIFIER_NAME_oe_sub_imperial_resident: "Imperial Resident Commissioner"
 STATIC_MODIFIER_DESC_oe_sub_imperial_resident: "An imperial commissioner audits finances and strengthens administrative control, though local ministers chafe at the oversight."
 STATIC_MODIFIER_NAME_oe_sub_resident_tribute_gain: "Resident Fiscal Oversight Returns"
 STATIC_MODIFIER_DESC_oe_sub_resident_tribute_gain: "Imperial residents auditing subject accounts improve the flow of tribute into the suzerain treasury."
 STATIC_MODIFIER_NAME_oe_sub_dynastic_marriage_bond: "Imperial Dynastic Marriage Pact"
 STATIC_MODIFIER_DESC_oe_sub_dynastic_marriage_bond: "A dynastic marriage sponsored by the imperial house cements mutual trust and shields the vassal from foreign subversion."
 STATIC_MODIFIER_NAME_oe_sub_imperial_bastion_loc: "Imperial Frontier Bastion"
 STATIC_MODIFIER_DESC_oe_sub_imperial_bastion_loc: "A frontier fortress transferred and reinforced under imperial charter, strengthening local defense and control."
 STATIC_MODIFIER_NAME_oe_sub_imperial_engineers_loc: "Imperial Engineer Works"
 STATIC_MODIFIER_DESC_oe_sub_imperial_engineers_loc: "Imperial engineers stationed in this town speed construction and stimulate local prosperity."
 STATIC_MODIFIER_NAME_oe_sub_frontier_marshal_char: "Imperial Frontier Marshal"
 STATIC_MODIFIER_DESC_oe_sub_frontier_marshal_char: "An imperial commander invested to hold the frontier marches, sharpening military command and battlefield morale."
 STATIC_MODIFIER_NAME_oe_sub_imperial_viceroy_char: "Imperial Prince-Viceroy"
 STATIC_MODIFIER_DESC_oe_sub_imperial_viceroy_char: "A royal kinsman dispatched to oversee a subject realm with viceregal dignity and administrative authority."
 STATIC_MODIFIER_NAME_oe_sub_hostage_at_court_char: "Vassal Ward at Imperial Court"
 STATIC_MODIFIER_DESC_oe_sub_hostage_at_court_char: "Residing at the overlord's capital for imperial schooling and diplomacy; barred from military command while at court."
 STATIC_MODIFIER_NAME_oe_sub_imperial_honor_title_char: "Imperial Vassal Dignity"
 STATIC_MODIFIER_DESC_oe_sub_imperial_honor_title_char: "Honored by the suzerain with an exalted court dignity such as Sebastokrator, Imperial Prince, or Grand Boyar."
 STATIC_MODIFIER_NAME_oe_sub_resident_commission_char: "Commissioned Imperial Resident"
 STATIC_MODIFIER_DESC_oe_sub_resident_commission_char: "Serving a ten-year commission overseeing a vassal's administration, unavailable for domestic cabinet posts during this term."
 STATIC_MODIFIER_NAME_oe_sub_imperial_academy_grad_char: "Imperial Academy Alumnus"
 STATIC_MODIFIER_DESC_oe_sub_imperial_academy_grad_char: "A promising subject courtier trained at the overlord's imperial academy, gaining well-rounded administrative, diplomatic, and martial skill."
 STATIC_MODIFIER_NAME_oe_sub_house_arrest_char: "Imperial Court Detention"
 STATIC_MODIFIER_DESC_oe_sub_house_arrest_char: "Recalled in disgrace from a restive subject and held under imperial guard, barred from cabinet office and military command."
