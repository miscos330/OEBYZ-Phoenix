 oe_sub_grant_imperial_title_to_vassal_act: "$oe_sub_grant_imperial_title_to_vassal$"
 oe_sub_grant_imperial_title_to_vassal_desc: "Spend 80 gold and 3 prestige to bestow a permanent imperial court dignity upon a subject's reigning ruler, granting personal prestige, lower liberty desire, and suzerain diplomatic reputation. 12-year cooldown."
 oe_sub_grant_imperial_title_to_vassal_desc_specific: "Confer an exalted imperial court dignity upon vassal ruler [SCOPE.sCharacter('recipient').GetName]."
