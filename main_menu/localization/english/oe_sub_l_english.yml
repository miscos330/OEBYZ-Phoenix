 oe_sub_enfeoff_general_to_subject_desc: "Dispatch an accomplished adult commander (MIL >= 65) to serve as military governor of an eligible frontier subject, granting fifteen years of garrison discipline and lowering liberty desire. 15-year cooldown."
 oe_sub_enfeoff_general_to_subject_desc_specific: "Enfeoff [SCOPE.sCharacter('recipient').GetName] to command the selected frontier subject, bolstering defense and loyalty."
