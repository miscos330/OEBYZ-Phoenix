 oe_sub_convert_to_foederati: "Invest as Imperial Foederati"
 oe_sub_convert_to_foederati_desc: "Convert a frontier subject into Imperial Foederati, lowering coin tribute in exchange for immediate manpower reserves and ten-year border defense bonuses. 15-year cooldown."
 oe_sub_convert_to_foederati_act: "Convert [SCOPE.sCountry('recipient').GetName] into Imperial Foederati"
 oe_sub_convert_to_foederati_effect_text: "[SCOPE.sCountry('actor').GetName] converts [SCOPE.sCountry('recipient').GetName] into Imperial Foederati."
