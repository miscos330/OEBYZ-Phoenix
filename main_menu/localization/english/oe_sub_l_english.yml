 oe_sub_promote_to_brother_kingdom: "Elevate to Imperial Brother-Kingdom"
 oe_sub_promote_to_brother_kingdom_desc: "Elevate a loyal, substantial same-faith subject to an Imperial Brother-Kingdom, trading prestige and legitimacy for deep loyalty, great-power score transfer, and imperial prestige. 20-year cooldown."
 oe_sub_promote_to_brother_kingdom_act: "Elevate [SCOPE.sCountry('recipient').GetName] to an Imperial Brother-Kingdom"
 oe_sub_promote_to_brother_kingdom_effect_text: "[SCOPE.sCountry('actor').GetName] elevates [SCOPE.sCountry('recipient').GetName] to an Imperial Brother-Kingdom."
