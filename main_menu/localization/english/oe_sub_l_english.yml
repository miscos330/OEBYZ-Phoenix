 oe_sub_appoint_imperial_resident_concept: "[character|e]"
 oe_sub_appoint_imperial_resident_act: "$oe_sub_appoint_imperial_resident$"
 oe_sub_appoint_imperial_resident_desc: "Commission a capable domestic minister (ADM >= 60) as Imperial Resident in a subject for ten years, boosting subject control, tax efficiency, and suzerain tribute while occupying the official for a decade. 12-year cooldown."
 oe_sub_appoint_imperial_resident_desc_specific: "Appoint [SCOPE.sCharacter('recipient').GetName] as Imperial Resident Commissioner in the selected subject for ten years."
 oe_sub_appoint_imperial_resident_past: "[SCOPE.sCharacter('recipient').GetName] Appointed Imperial Resident"
