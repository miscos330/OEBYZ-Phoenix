 PROPOSE_oe_sub_convert_to_foederati: "Convert $RECIPIENT$ into Imperial Foederati?\n\n$INFO$"
 oe_sub_charter_free_port: "Charter Commercial Free City"
 oe_sub_charter_free_port_desc: "Grant a small coastal subject a Free City commercial charter, shifting it to a republic exempt from offensive wars in return for high trade tribute and rapid institution spread. 15-year cooldown."
 oe_sub_charter_free_port_act: "Charter [SCOPE.sCountry('recipient').GetName] as a Commercial Free City"
 oe_sub_charter_free_port_effect_text: "[SCOPE.sCountry('actor').GetName] charters [SCOPE.sCountry('recipient').GetName] as a Commercial Free City."
 oe_sub_charter_free_port_effect_text_past: "[SCOPE.sCountry('actor').GetName] chartered [SCOPE.sCountry('recipient').GetName] as a Commercial Free City."
 PROPOSE_oe_sub_charter_free_port: "Charter $RECIPIENT$ as a Commercial Free City?\n\n$INFO$"
 oe_sub_establish_duhu_protectorate: "Establish Frontier Protectorate (Duhu)"
 oe_sub_establish_duhu_protectorate_desc: "Establish a frontier subject in Xinjiang, Manchuria, Mongolia, Tibet, Siberia, Steppe, Khorasan, or Indochina as an Eastern Frontier Protectorate; holding Kashgar, Beshbalik, Nurgan, or Thang Long activates historic seat modifiers. 15-year cooldown."
 oe_sub_establish_duhu_protectorate_act: "Establish [SCOPE.sCountry('recipient').GetName] as a Frontier Protectorate"
 oe_sub_establish_duhu_protectorate_effect_text: "[SCOPE.sCountry('actor').GetName] establishes [SCOPE.sCountry('recipient').GetName] as a Frontier Protectorate."
 oe_sub_establish_duhu_protectorate_effect_text_past: "[SCOPE.sCountry('actor').GetName] established [SCOPE.sCountry('recipient').GetName] as a Frontier Protectorate."
 PROPOSE_oe_sub_establish_duhu_protectorate: "Establish $RECIPIENT$ as a Frontier Protectorate?\n\n$INFO$"
 oe_sub_demote_to_direct_vassal: "Demote to Direct Vassal"
 oe_sub_demote_to_direct_vassal_desc: "Revoke special charter status from a highly loyal Foederati, Free City, Brother-Kingdom, or Protectorate and convert it into a standard Vassal, unlocking annexation at the cost of prestige, opinion, and liberty desire. 20-year cooldown."
 oe_sub_demote_to_direct_vassal_act: "Demote [SCOPE.sCountry('recipient').GetName] to a Direct Vassal"
 oe_sub_demote_to_direct_vassal_effect_text: "[SCOPE.sCountry('actor').GetName] demotes [SCOPE.sCountry('recipient').GetName] to a Direct Vassal."
 oe_sub_demote_to_direct_vassal_effect_text_past: "[SCOPE.sCountry('actor').GetName] demoted [SCOPE.sCountry('recipient').GetName] to a Direct Vassal."
 PROPOSE_oe_sub_demote_to_direct_vassal: "Demote $RECIPIENT$ to a Direct Vassal?\n\n$INFO$"
 oe_sub_transfer_border_fortress: "Transfer Border Fortress"
 oe_sub_transfer_border_fortress_desc: "Transfer one of our non-capital fortified border locations to an adjoining subject with a ten-year imperial bastion modifier, lowering liberty desire and boosting opinion. 10-year cooldown."
 oe_sub_transfer_border_fortress_act: "Transfer a Border Fortress to [SCOPE.sCountry('recipient').GetName]"
 oe_sub_transfer_border_fortress_effect_text: "[SCOPE.sCountry('actor').GetName] transfers a border fortress to [SCOPE.sCountry('recipient').GetName]."
 oe_sub_transfer_border_fortress_effect_text_past: "[SCOPE.sCountry('actor').GetName] transferred a border fortress to [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_transfer_border_fortress: "Transfer a border fortress to $RECIPIENT$?\n\n$INFO$"
 oe_sub_requisition_frontier_fort: "Requisition Strategic Fortress"
 oe_sub_requisition_frontier_fort_desc: "Pay 250 gold to requisition a non-capital fortified location bordering our realm from a loyal subject, granting five-year tax compensation while raising liberty desire. 15-year cooldown."
 oe_sub_requisition_frontier_fort_act: "Requisition a Strategic Fortress from [SCOPE.sCountry('recipient').GetName]"
 oe_sub_requisition_frontier_fort_effect_text: "[SCOPE.sCountry('actor').GetName] requisitions a strategic fortress from [SCOPE.sCountry('recipient').GetName]."
 oe_sub_requisition_frontier_fort_effect_text_past: "[SCOPE.sCountry('actor').GetName] requisitioned a strategic fortress from [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_requisition_frontier_fort: "Requisition a strategic fortress from $RECIPIENT$?\n\n$INFO$"
 oe_sub_levy_subject_fleet: "Levy Subject Naval Squadron"
 oe_sub_levy_subject_fleet_desc: "Requisition warships and sailors from a loyal coastal subject, granting a five-year naval squadron modifier, sailor reinforcements, and fresh galleys in our port. 10-year cooldown."
 oe_sub_levy_subject_fleet_act: "Levy a Naval Squadron from [SCOPE.sCountry('recipient').GetName]"
 oe_sub_levy_subject_fleet_effect_text: "[SCOPE.sCountry('actor').GetName] levies a naval squadron from [SCOPE.sCountry('recipient').GetName]."
 oe_sub_levy_subject_fleet_effect_text_past: "[SCOPE.sCountry('actor').GetName] levied a naval squadron from [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_levy_subject_fleet: "Levy a naval squadron from $RECIPIENT$?\n\n$INFO$"
 oe_sub_arbitrate_subject_feud: "Arbitrate Vassal Feud"
 oe_sub_arbitrate_subject_feud_desc: "Spend 50 gold and 5 Political Influence to compel feuding or warring subjects into a five-year truce and convene an imperial arbitration ruling. 5-year cooldown."
 oe_sub_arbitrate_subject_feud_act: "Arbitrate the Vassal Feud of [SCOPE.sCountry('recipient').GetName]"
 oe_sub_arbitrate_subject_feud_effect_text: "[SCOPE.sCountry('actor').GetName] arbitrates the vassal feud involving [SCOPE.sCountry('recipient').GetName]."
 oe_sub_arbitrate_subject_feud_effect_text_past: "[SCOPE.sCountry('actor').GetName] arbitrated the vassal feud involving [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_arbitrate_subject_feud: "Convene an imperial arbitration to end the feud of $RECIPIENT$?\n\n$INFO$"
 oe_sub_remit_tribute_for_loyalty: "Remit Tribute for Loyalty"
 oe_sub_remit_tribute_for_loyalty_desc: "Forego a portion of overlord tribute receipts for ten years to grant this subject fiscal relief, bonus loyalty, and an immediate -20 liberty desire reduction. 10-year cooldown."
 oe_sub_remit_tribute_for_loyalty_act: "Remit Tribute for [SCOPE.sCountry('recipient').GetName]"
 oe_sub_remit_tribute_for_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName] remits tribute for [SCOPE.sCountry('recipient').GetName] to secure loyalty."
 oe_sub_remit_tribute_for_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName] remitted tribute for [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_remit_tribute_for_loyalty: "Remit ten years of tribute for $RECIPIENT$ to bolster loyalty?\n\n$INFO$"
 oe_sub_levy_war_extra_tribute: "Levy Extraordinary War Tribute"
 oe_sub_levy_war_extra_tribute_desc: "Levy an emergency war contribution equal to six months of the subject's trade and tax income (capped at 250 gold), raising liberty desire and imposing a five-year fiscal strain. 10-year cooldown."
 oe_sub_levy_war_extra_tribute_act: "Levy Extra War Tribute from [SCOPE.sCountry('recipient').GetName]"
 oe_sub_levy_war_extra_tribute_effect_text: "[SCOPE.sCountry('actor').GetName] levies extraordinary war tribute from [SCOPE.sCountry('recipient').GetName]."
 oe_sub_levy_war_extra_tribute_effect_text_past: "[SCOPE.sCountry('actor').GetName] levied extraordinary war tribute from [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_levy_war_extra_tribute: "Levy extraordinary war tribute from $RECIPIENT$?\n\n$INFO$"
 oe_sub_dispatch_imperial_engineers: "Dispatch Imperial Engineers"
 oe_sub_dispatch_imperial_engineers_desc: "Invest 200 gold to dispatch imperial engineers to the subject's capital and major town, boosting construction speed and prosperity for ten years while reducing liberty desire. 10-year cooldown."
 oe_sub_dispatch_imperial_engineers_act: "Dispatch Imperial Engineers to [SCOPE.sCountry('recipient').GetName]"
 oe_sub_dispatch_imperial_engineers_effect_text: "[SCOPE.sCountry('actor').GetName] dispatches imperial engineers to [SCOPE.sCountry('recipient').GetName]."
 oe_sub_dispatch_imperial_engineers_effect_text_past: "[SCOPE.sCountry('actor').GetName] dispatched imperial engineers to [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_dispatch_imperial_engineers: "Dispatch imperial engineers to aid $RECIPIENT$?\n\n$INFO$"
 oe_sub_military_drill_mission: "Send Imperial Military Drill Mission"
 oe_sub_military_drill_mission_desc: "Spend 150 gold to send an imperial drill mission to reform the subject's army, granting ten years of discipline and morale while awarding the overlord +2 Army Tradition. 12-year cooldown."
 oe_sub_military_drill_mission_act: "Send a Military Drill Mission to [SCOPE.sCountry('recipient').GetName]"
 oe_sub_military_drill_mission_effect_text: "[SCOPE.sCountry('actor').GetName] sends a military drill mission to [SCOPE.sCountry('recipient').GetName]."
 oe_sub_military_drill_mission_effect_text_past: "[SCOPE.sCountry('actor').GetName] sent a military drill mission to [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_military_drill_mission: "Send an imperial military drill mission to $RECIPIENT$?\n\n$INFO$"
 oe_sub_codify_shared_law: "Codify Shared Commercial Law"
 oe_sub_codify_shared_law_desc: "Spend 80 gold to harmonize commercial law, weights, and measures between overlord and subject for fifteen years, lifting export efficiency and institution growth while briefly displeasing subject burghers. 20-year cooldown."
 oe_sub_codify_shared_law_act: "Codify Shared Commercial Law with [SCOPE.sCountry('recipient').GetName]"
 oe_sub_codify_shared_law_effect_text: "[SCOPE.sCountry('actor').GetName] codifies shared commercial law with [SCOPE.sCountry('recipient').GetName]."
 oe_sub_codify_shared_law_effect_text_past: "[SCOPE.sCountry('actor').GetName] codified shared commercial law with [SCOPE.sCountry('recipient').GetName]."
 PROPOSE_oe_sub_codify_shared_law: "Codify shared commercial law and standards with $RECIPIENT$?\n\n$INFO$"
 oe_sub_subsidize_frontier_garrison: "Subsidize Frontier Garrisons"
 oe_sub_subsidize_frontier_garrison_desc: "Grant 180 gold in frontier defense subsidies to a subject bordering our rival or enemy, giving ten years of fort upkeep efficiency and garrison size plus opinion. 10-year cooldown."
 oe_sub_subsidize_frontier_garrison_act: "Subsidize Frontier Garrisons in [SCOPE.sCountry('recipient').GetName]"
