 # NEW 2026-11-18 fourth round D1. Generated by gen_round4_tributary.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_ttb_suzerain: "Suzerain of Tributaries"
 STATIC_MODIFIER_DESC_oe_ttb_suzerain: "The Imperial Authority is high enough for the emperor to receive vassals. We may offer other countries tributary status through diplomacy. The title is lost when the authority falls below #Y 40#!; existing tributaries stay."
 STATIC_MODIFIER_NAME_oe_ttb_harbour: "Tributary Harbours and Markets"
 STATIC_MODIFIER_DESC_oe_ttb_harbour: "A tributary lets the empire's merchants and warships use its harbours and markets."
 oe_ttb_marriage: "Promised a Marriage Tie"
 oe_ttb_harbour_op: "Harbour and Trade Rights"
 oe_ttb_peace_op: "Receives Tribute from the Empire"
 oe_ttb_broken: "The Empire Broke Its Tribute Pact"
 oe_ttb_arrears: "The Empire Owes Its Tribute"
 oe_ttb_buy_peace: "Buy Peace with Tribute"
 oe_ttb_buy_peace_desc: "Send envoys to a country with a larger army than ours that borders us (or lies one sea zone away) or is at war with us, and buy a mutual truce of #Y 5#! years with a yearly tribute. The tribute is #Y 3#! months of our total income (about [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0] gold now), fixed at signing; the first year is paid at once, then every January.\nA country at war with us accepts only if it is not winning, and the war ends (white peace when both lead their sides; otherwise the one that does not lead leaves the war). At peace, it accepts with a chance of #Y 70%#!, or #Y 40%#! if its opinion of us is below #Y −50#!. After a refusal we cannot ask the same country again for #Y 12#! months.\nOn acceptance: prestige #R −15#!, [oe_tu_authority|e] #R −5#!, their opinion of us #G +25#! (#Y 5#! years). One agreement per country, at most #Y 3#! at once. If we cannot pay or stop paying: the agreement ends, the truce is void, prestige #R −10#!, and their opinion of us #R −40#! (broken faith, #Y 5#! years).\nThe [Concept('oe_tu_senate','senate')|e]: every payment of tribute (at signing and each January) raises the senate's grievance over tribute: #Y 2#! points for each month of our total income the payment is worth, and #Y 25%#! more for each earlier payment still remembered (at most #Y 4#!; each payment is remembered once, and half a payment is forgotten each January). The grievance falls by #Y 3%#! a month, then by #Y 0.25#! more. Now [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]: [GetCountry('BYZ').Custom('OeTtbSenTier')].\nAt #Y 15#!: nobles' target satisfaction #R −3%#!; on reaching it, each [Concept('oe_tu_charter','chartered city')|e]: loyalty #R −3#! (also in the loyalty target for #Y 5#! years). It ends when the grievance falls below #Y 5#!.\nAt #Y 40#!: nobles' target satisfaction #R −6%#! (replaces the tier below); on reaching it, each province with senate seats (chartered cities, [Concept('oe_tu_exarchate','exarchates')|e], despotates): loyalty #R −3#! (also in the loyalty target for #Y 5#! years); Imperial Authority #R −2#!. It drops a tier when the grievance falls below #Y 15#!.\nAt #Y 70#!: nobles' target satisfaction #R −10%#! (replaces the tier below); on reaching it, each province with senate seats (chartered cities, exarchates, despotates): loyalty #R −5#! (also in the loyalty target for #Y 5#! years); Imperial Authority #R −3#!. It drops a tier when the grievance falls below #Y 40#!.\nProvinces with low loyalty are more likely to vote against bills in the senate; with low noble satisfaction, so are court officials from the nobility."
 oe_ttb_buy_peace_select: "Choose who to pay"
 oe_ttb_buy_peace_none: "@trigger_no!No country to pay for peace (it must have a larger army than ours, border us, lie one sea zone away or be at war with us, and have no agreement yet)."
 oe_ttb_buy_peace_tt: "The envoys take the first year's tribute (about [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0] gold) to the chosen country; the answer comes back at once."
 oe_ttb_refused_tt: "This country turned our envoys away in the last #Y 12#! months"
 oe_ttb_allow_count: "Fewer than #Y 3#! tribute agreements are running"
 oe_ttb_allow_gold: "The treasury holds the first year's tribute ([GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0] gold)"
 oe_ttb_allow_any: "At least one tribute agreement is running"
 oe_ttb_stop_peace: "Stop Paying Tribute"
 oe_ttb_stop_peace_desc: "Stop paying tribute to a country. The agreement ends, the truce is void, prestige #R −10#!, and its opinion of us #R −40#! (broken faith, #Y 5#! years). The same as failing to pay in January."
 oe_ttb_stop_peace_select: "Choose the agreement to end"
 oe_ttb_stop_peace_none: "@trigger_no!We pay tribute to no one."
 oe_ttb_stop_peace_tt: "The agreement ends and the truce is void. Prestige #R −10#!; that country's opinion of us #R −40#! (broken faith, #Y 5#! years)."
 oe_ttb_tt_ally_cd: "Rose from tributary to Roman ally at least #Y 10#! years ago"
 oe_ttb.1.t: "A New Tributary"
 oe_ttb.1.d: "In 1304 the Genoese noble Benedetto Zaccaria seized Chios. Andronikos II could not take it back, so he accepted it and granted him the island as a fief, first for #Y 10#! years and then renewed every five years. In 1329 Andronikos III sailed with a fleet and recovered the island. In 1355 Francesco Gattilusio, who had helped John V back into Constantinople, was made lord of Lesbos and married the emperor's sister Maria. He ruled the island as the emperor's vassal.\n\nNow [SCOPE.sCountry('oe_ttb_ev_trib').GetName] pays tribute to the emperor as a vassal. The emperor must give the new vassal its place."
 oe_ttb.1.a: "Make its ruler protosebastos"
 oe_ttb.1.a.tt: "Through the [Concept('oe_tu_dignity','court dignities')|e], the ruler of [SCOPE.sCountry('oe_ttb_ev_trib').GetName] becomes protosebastos: prestige #R −10#!, [oe_tu_authority|e] #R −4#!.\nThe ruler holds the dignity for life, with monthly prestige #G +0.05#!.\n[SCOPE.sCountry('oe_ttb_ev_trib').GetName]'s opinion of us #G +25#! (fades by #Y 2#! a year), and #G +10#! more while this ruler reigns; as our subject, loyalty to the overlord #G +8#!.\n[SCOPE.sCountry('oe_ttb_ev_trib').GetName] cannot be honoured again for #Y 5#! years.\nOffered only when the country has a place in the [Concept('oe_tu_family','family of kings')|e], its ruler can receive the dignity, and we can afford it."
 oe_ttb.1.b: "Promise a marriage tie"
 oe_ttb.1.b.tt: "[SCOPE.sCountry('oe_ttb_ev_trib').GetName]'s opinion of us #G +30#! (#Y 10#! years).\nPrestige #G +5#!.\nIt is only a promise; no marriage is arranged."
 oe_ttb.1.c: "Grant harbour and trade rights"
 oe_ttb.1.c.tt: "We gain Tributary Harbours and Markets for #Y 10#! years: merchant power #G +5%#!, maritime presence #G +10%#! (one copy only; a new grant restarts the #Y 10#! years).\n[SCOPE.sCountry('oe_ttb_ev_trib').GetName]'s opinion of us #G +15#! (#Y 10#! years)."
 oe_ttb.2.t: "A Tributary Asks to Become an Ally"
 oe_ttb.2.d: "After the battle of Gallipoli in 1312, King Milutin of Serbia sent Novak Grebostrek with a second contingent to Asia Minor to help Andronikos II against the Turks. The emperor rewarded the contingent well, and his chrysobull for the Hilandar monastery in 1313 thanks Milutin for the aid.\n\nNow [SCOPE.sCountry('oe_ttb_ev_trib').GetName] has paid tribute to the emperor for ten years and stands close to the empire. Its envoys ask whether it may follow the emperor in war like a Roman ally, for a closer place."
 oe_ttb.2.a: "Accept it as a Roman ally"
 oe_ttb.2.a.tt: "[SCOPE.sCountry('oe_ttb_ev_trib').GetName] changes from tributary to Roman ally: it joins every war of ours, pays the Roman alliance's tribute of #Y 10%#!, and neither side can end the tie alone; it cannot be annexed.\nAfter #Y 10#! years as a Roman ally, with opinion of us at #Y 50#! or more, it can be made a provincial subject in the civil edicts, and later turned into provinces."
 oe_ttb.2.b: "Wait a few more years"
 oe_ttb.2.b.tt: "[SCOPE.sCountry('oe_ttb_ev_trib').GetName] stays a tributary. If it still qualifies in #Y 5#! years, it will ask again."
 oe_ttb.3.t: "Suzerain Again"
 oe_ttb.3.d: "The emperor has had vassals in name before. From 1304 to 1329 the Zaccaria ruled Chios, in theory as the emperor's vassals; from 1355 the Gattilusio ruled Lesbos as vassals of the emperor.\n\nNow the Imperial Authority has reached #Y 50#!, and the emperor may receive vassals again."
 oe_ttb.3.a: "Let them come"
 oe_ttb.3.a.tt: "(Already in effect) We are Suzerain of Tributaries: we may offer other countries tributary status through diplomacy (the vanilla tributary pays yearly, cannot be annexed, and either side may end it); diplomatic reputation #G +1#!.\nThe title is lost when the [oe_tu_authority|e] falls below #Y 40#!; existing tributaries stay.\nA new tributary asks for its place; after #Y 10#! years, with opinion of us at #Y 50#! or more and an Eastern church or a seat in the Roman World, it may rise to Roman ally."
 oe_ttb.4.t: "Suzerainty Lapses"
 oe_ttb.4.d: "Now the Imperial Authority has fallen below #Y 40#!. For now the emperor cannot receive new vassals; existing tributaries stay."
 oe_ttb.4.a: "Another day"
 oe_ttb.4.a.tt: "(Already in effect) We lose Suzerain of Tributaries and cannot take new tributaries. It returns when the [oe_tu_authority|e] is back at #Y 50#! or more."
 oe_ttb.5.t: "Tribute Buys a Truce"
 oe_ttb.5.d1: "Now [SCOPE.sCountry('oe_ttb_ev_t').GetName] has taken our tribute, and the war between us is over. There is a truce of #Y 5#! years. Each January we pay [SCOPE.sCountry('oe_ttb_ev_t').GetName] [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_ev_amt').GetValue|0] gold; the first year is already paid. If we cannot pay in any year, or stop paying, the truce is void."
 oe_ttb.5.d: "Now [SCOPE.sCountry('oe_ttb_ev_t').GetName] has taken our tribute. There is a truce of #Y 5#! years. Each January we pay [SCOPE.sCountry('oe_ttb_ev_t').GetName] [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_ev_amt').GetValue|0] gold; the first year is already paid. If we cannot pay in any year, or stop paying, the truce is void."
 oe_ttb.5.a: "It had to be done"
 oe_ttb.5.a.tt: "(Already in effect) Prestige #R −15#!, [oe_tu_authority|e] #R −5#!.\n[SCOPE.sCountry('oe_ttb_ev_t').GetName]'s opinion of us #G +25#! (#Y 5#! years).\nThe [Concept('oe_tu_senate','senate')|e]'s grievance over tribute +[GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_last').GetValue|0], now [GetCountry('BYZ').MakeScope.GetVariable('oe_ttb_sen_grudge').GetValue|0]: [GetCountry('BYZ').Custom('OeTtbSenTier')]."
 oe_ttb.6.t: "The Envoys Return Empty-Handed"
 oe_ttb.6.d1: "After Nicaea fell in 1331, Andronikos III offered Orhan tribute for peace, and Orhan refused. Nicomedia held out through years of siege and still fell in 1337.\n\nNow [SCOPE.sCountry('oe_ttb_ev_t').GetName] has the upper hand in the field and will not take our tribute."
 oe_ttb.6.d: "After Nicaea fell in 1331, Andronikos III offered Orhan tribute for peace, and Orhan refused. Nicomedia held out through years of siege and still fell in 1337.\n\nNow [SCOPE.sCountry('oe_ttb_ev_t').GetName] has turned our tribute down."
 oe_ttb.6.a: "We must find another way"
 oe_ttb.6.a.tt: "Nothing is spent. [SCOPE.sCountry('oe_ttb_ev_t').GetName] will not receive our envoys again for #Y 12#! months."
 oe_ttb.7.t: "The Tribute Pact Ends"
 oe_ttb.7.d1: "Now the treasury cannot find this year's tribute for [SCOPE.sCountry('oe_ttb_ev_t').GetName]. The agreement is void, and the truce with it."
 oe_ttb.7.d: "Now we are at war with [SCOPE.sCountry('oe_ttb_ev_t').GetName] again, and the tribute agreement is void."
 oe_ttb.7.a: "We have broken faith"
 oe_ttb.7.a.tt: "(Already in effect) The truce is void. Prestige #R −10#!.\n[SCOPE.sCountry('oe_ttb_ev_t').GetName]'s opinion of us #R −40#! (broken faith, #Y 5#! years)."
 oe_ttb.7.b: "No more tribute, then"
 oe_ttb.7.b.tt: "(Already in effect) No more tribute is paid. This time there is no penalty for broken faith."
 oe_ttb.8.t: "Tribute for peace: the answer"
 oe_ttb.1.d_pre: "In 1304 the Genoese noble Benedetto Zaccaria seized Chios. Andronikos II could not take it back, so he accepted it and granted him the island as a fief, first for #Y 10#! years and then renewed every five years. In 1329 Andronikos III sailed with a fleet and recovered the island.\n\nNow [SCOPE.sCountry('oe_ttb_ev_trib').GetName] pays tribute to the emperor as a vassal. The emperor must give the new vassal its place."
 oe_ttb.3.d_pre: "The emperor has had vassals in name before. From 1304 to 1329 the Zaccaria ruled Chios, in theory as the emperor's vassals.\n\nNow the Imperial Authority has reached #Y 50#!, and the emperor may receive vassals again."
 oe_ttb.6.d1_pre: "After Nicaea fell in 1331, Andronikos III offered Orhan tribute for peace, and Orhan refused. Nicomedia has been under siege for years.\n\nNow [SCOPE.sCountry('oe_ttb_ev_t').GetName] has the upper hand in the field and will not take our tribute."
 oe_ttb.6.d_pre: "After Nicaea fell in 1331, Andronikos III offered Orhan tribute for peace, and Orhan refused. Nicomedia has been under siege for years.\n\nNow [SCOPE.sCountry('oe_ttb_ev_t').GetName] has turned our tribute down."
