 oe_glh_b_church_moscow: "The empire relied on the metropolitan in Moscow"
 oe_glh_b_grain_pact: "A grain treaty with the empire"
 oe_glh_b_north_raid: "The empire struck north while we were divided"
 oe_glh_b_kul_blessing: "The patriarch hailed the victory on the Don"
 oe_glh_b_kul_affront: "The empire hailed Moscow's victory over us"
 oe_glh_b_lithuania: "The empire favoured the metropolitan of Kiev"
 oe_glh_b_khan_recognized: "The empire recognised the new khan"
 oe_glh_b_moscow_sympathy: "The empire sent words of comfort to Moscow"
 oe_glh_b_east_route: "Imperial merchants now use our route"
 oe_glh_b_genoa_caffa: "The empire relies on our colony at Caffa"
 oe_glh_bw_tver_grief: "Our prince died through Moscow's scheming"
 oe_glh_bw_tana: "The bloodshed at Tana"
 oe_glh.1.t: "Execution at Sarai"
 oe_glh.1.d0: "#F After the rising at Tver in 1327, Grand Prince Alexander of Tver fled to Pskov. Ivan Kalita marched against Pskov on the khan's orders but did not storm it; at Ivan's request Metropolitan Theognostus, a native of Constantinople, excommunicated Alexander and all Pskov. Alexander was later pardoned by the khan and went back to Sarai; in the autumn of 1339 Alexander and a son, Fyodor, were put to death there.#!"
 oe_glh.1.d1a: "\n\nNow [SCOPE.sCharacter('oe_glh_mos_r').GetName] of Moscow stands higher than ever at the court of the Golden Horde. The metropolitan, whose see sits in Moscow, has sent to Constantinople to learn the will of the emperor and the patriarch."
 oe_glh.1.d1b: "\n\nNow Moscow stands higher than ever at the court of the Golden Horde. The metropolitan, whose see sits in Moscow, has sent to Constantinople to learn the will of the emperor and the patriarch."
 oe_glh.1.a: "Back the metropolitan's course in Moscow"
 oe_glh.1.a.tt: "Moscow: opinion of us #G +15#! (#Y 10#! years)\nPrestige #G +5#!\nThe empire leans towards Moscow in Rus' (Rus' leaning #Y +1#!)"
 oe_glh.1.b: "Mourn the martyred prince"
 oe_glh.1.b.tt: "Tver and Pskov: opinion of us #G +20#! (#Y 10#! years)\nThe Golden Horde: opinion of us #R −10#! (#Y 5#! years)\nThe empire leans towards Tver in Rus' (Rus' leaning #Y −1#!)"
 oe_glh.1.c: "Keep out of northern affairs"
 oe_glh.1.c.tt: "The Golden Horde: opinion of us #G +10#! (#Y 5#! years)"
 oe_glh.2.t: "An Embassy to Sarai"
 oe_glh.2.d0: "#F For twenty years Tatar horsemen had crossed the Danube into Thrace again and again, and in 1337 they came once more. According to the traveller Ibn Battuta, one of Khan Özbeg's wives was a daughter of the emperor, who went home to Constantinople and never returned.#!"
 oe_glh.2.d1: "\n\nThe khan of the Golden Horde is old. The heir, Tini Beg, holds the east, but the khan's wife Taydula favours another son, Jani Beg. The empire is to send an embassy to Sarai to ask the khan to rein in the raiders; who receives the gifts must be settled first."
 oe_glh.2.a: "Court the heir, Tini Beg"
 oe_glh.2.a.tt: "Gold #R −50#!\nThe Golden Horde: opinion of us #G +20#! (#Y 10#! years)\nThe bet is settled when the throne changes hands. If we backed the winner: the Golden Horde's opinion of us #G +30#! (#Y 20#! years) and [ShowModifier('oe_glh_sarai_friend')] for #Y 20#! years; if not: opinion #R −15#! (#Y 10#! years). Either way this replaces the opinion bought by the gifts."
 oe_glh.2.b: "Court Taydula and Jani Beg"
 oe_glh.2.b.tt: "Gold #R −50#!\nThe Golden Horde: opinion of us #G +20#! (#Y 10#! years)\nThe bet is settled when the throne changes hands. If we backed the winner: the Golden Horde's opinion of us #G +30#! (#Y 20#! years) and [ShowModifier('oe_glh_sarai_friend')] for #Y 20#! years; if not: opinion #R −15#! (#Y 10#! years). Either way this replaces the opinion bought by the gifts."
 oe_glh.2.c: "Strengthen Arkadiopolis"
 oe_glh.2.c.tt: "Gold #R −40#!\nArkadiopolis (Lüleburgaz) gains [ShowModifier('oe_glh_arkadiopolis')] for #Y 25#! years: defence #G +25%#!, unrest #G −10%#!; if it is not in our hands, the capital gets it instead\nNo bet on the succession"
 oe_glh.2.d: "Send only a letter"
 oe_glh.2.d.tt: "The Golden Horde: opinion of us #G +10#! (#Y 5#! years)\nNo bet on the succession"
 oe_glh.3.t: "Blood at Tana"
 oe_glh.3.d0: "#F In the autumn of 1343 a Venetian nobleman killed one of the khan's officials at Tana. Jani Beg drove out the Italians and the khan's army laid siege to Caffa; Venice and Genoa joined in an embargo.#!"
 oe_glh.3.d1: "\n\nNow the grain ships from the northern shore of the Black Sea have stopped, and bread grows dearer in the capital by the day."
 oe_glh.3.d2a: "\n\nSarai remembers that the empire backed the right man, and looks on us with favour."
 oe_glh.3.d2b: "\n\nSarai remembers that the empire backed the wrong man, and is cool towards us."
 oe_glh.3.d2c: "\n\nThe empire has no special friends at Sarai."
 oe_glh.3.a: "Buy grain from Anatolia and Trebizond"
 oe_glh.3.a.tt: "Gold #R −60#!\nTrebizond, if it exists: opinion of us #G +10#! (#Y 5#! years)"
 oe_glh.3.b: "Join the Italians' embargo"
 oe_glh.3.b.tt: "Genoa and Venice: opinion of us #G +15#! (#Y 10#! years)\nThe Golden Horde: opinion of us #R −15#! (#Y 10#! years)\nGain [ShowModifier('oe_glh_grain_dear')] for #Y 3#! years: monthly food #R −5%#!"
 oe_glh.3.c: "Let our ships sail north as usual"
 oe_glh.3.c.tt: "Gold #G +40#!\nThe Golden Horde: opinion of us #G +15#! (#Y 10#! years)\nGenoa and Venice: opinion of us #R −15#! (#Y 10#! years)"
 oe_glh.4.t: "The Death of Jani Beg"
 oe_glh.4.d0: "#F In the winter of 1356–57 Jani Beg took Tabriz, fell ill on the march home and died; accounts of the death differ. That year, it is said, Metropolitan Alexius was summoned to Sarai and cured Taydula's eyes. The new khan, Berdi Beg, had a dozen close kin killed as soon as the throne was won.#!"
 oe_glh.4.d1a: "\n\nJani Beg had come to the throne by doing away with Tini Beg; now the throne of the Golden Horde has changed hands in blood again."
 oe_glh.4.d1b: "\n\nJani Beg had come to the throne in peace; now the throne of the Golden Horde has changed hands in blood."
 oe_glh.4.d1c: "\n\nNow the throne of the Golden Horde has changed hands in blood."
 oe_glh.4.d2a: "\n\nSarai remembers that the empire backed the right man, and looks on us with favour."
 oe_glh.4.d2b: "\n\nSarai remembers that the empire backed the wrong man, and is cool towards us."
 oe_glh.4.d2c: "\n\nThe empire has no special friends at Sarai."
 oe_glh.4.d3: "\n\nShould the empire send gifts to the new khan?"
 oe_glh.4.a: "Send envoys to greet the new khan"
 oe_glh.4.a.tt: "Gold #R −40#!\nThe Golden Horde: opinion of us #G +20#! (#Y 10#! years)\nIf we have [ShowModifier('oe_glh_sarai_friend')], it runs for #Y 10#! more years from now"
 oe_glh.4.b: "Send our greetings through the metropolitan"
 oe_glh.4.b.tt: "Gold #R −10#!\nThe Golden Horde: opinion of us #G +10#! (#Y 5#! years)\nMoscow: opinion of us #G +10#! (#Y 5#! years)"
 oe_glh.4.c: "Send no more gifts to Sarai"
 oe_glh.4.c.tt: "Lose [ShowModifier('oe_glh_sarai_friend')], if we have it"
 oe_glh.5.t: "The Great Troubles"
 oe_glh.5.d0: "#F Berdi Beg died in 1359 and Qulpa took the throne four days later; in the next twenty years more than twenty khans came and went. Sarai and the Crimea each had a khan of their own, and the great emir Mamai set up puppets. Lithuania took Kiev at the Blue Waters (1362 or 1363), and the Genoese took Soldaia in 1365.#!"
 oe_glh.5.d1a: "\n\nNow the Golden Horde is at war with itself, and the towns of the northern shore look for new protectors. The khans of Batu's line are gone; if the empire was a [ShowModifier('oe_glh_sarai_friend')], that friendship ends here. The empire's Black Sea campaign is under way, and the chaos on the steppe is an opening."
 oe_glh.5.d1b: "\n\nNow the Golden Horde is at war with itself, and the towns of the northern shore look for new protectors. The khans of Batu's line are gone; if the empire was a [ShowModifier('oe_glh_sarai_friend')], that friendship ends here."
 oe_glh.5.a: "Sign a grain treaty with the northern shore"
 oe_glh.5.a.tt: "Gold #R −50#!\nGain [ShowModifier('oe_glh_north_grain')] for #Y 15#! years: monthly food #G +5%#!, trade income #G +3%#!\nTheodoro, if it exists: opinion of us #G +15#! (#Y 10#! years)"
 oe_glh.5.b: "Turn north while they fight"
 oe_glh.5.b.tt: "Black Sea campaign progress bonus #G +10#!\nThe Golden Horde: opinion of us #R −20#! (#Y 10#! years)"
 oe_glh.5.c: "Watch the steppe"
 oe_glh.5.c.tt: "Nothing else happens."
 oe_glh.6.t: "The Battle on the Don"
 oe_glh.6.d0: "#F On 8 September 1380 Grand Prince Dmitry of Moscow defeated Mamai on the field of Kulikovo by the upper Don, and Mamai's puppet khan fell. The monk's single combat before the battle and the Genoese infantry fighting for Mamai are mostly later legend.#!"
 oe_glh.6.d1a: "\n\nNow the news of [SCOPE.sCharacter('oe_glh_mos_r').GetName]'s victory has reached Constantinople by way of Caffa and Pera, and the patriarch waits for the emperor's word. Moscow and Lithuania are both contending for the metropolitan of all Rus'."
 oe_glh.6.d1b: "\n\nNow the news of Moscow's victory has reached Constantinople by way of Caffa and Pera, and the patriarch waits for the emperor's word. Moscow and Lithuania are both contending for the metropolitan of all Rus'."
 oe_glh.6.a: "Have the patriarch congratulate Moscow"
 oe_glh.6.a.tt: "Moscow: opinion of us #G +25#! (#Y 20#! years)\nThe Golden Horde: opinion of us #R −15#! (#Y 10#! years)\nPrestige #G +10#!\nThe empire leans towards Moscow in Rus' (Rus' leaning #Y +1#!)"
 oe_glh.6.b: "Take no side"
 oe_glh.6.b.tt: "The Golden Horde: opinion of us #G +10#! (#Y 5#! years)"
 oe_glh.6.c: "Favour Lithuania and the metropolitan of Kiev"
 oe_glh.6.c.tt: "Lithuania: opinion of us #G +15#! (#Y 10#! years)\nThe empire leans towards Lithuania in Rus' (Rus' leaning #Y −1#!)"
 oe_glh.7.t: "Tokhtamysh"
 oe_glh.7.d0: "#F Tokhtamysh, who had fled to Timur, took Sarai (in 1378 or 1380) and at the Kalka won over Mamai's followers. Mamai fled to the Crimea and was killed near Solkhat (some say in Caffa); the Genoese of Caffa made a treaty with the new khan and gained the villages around Soldaia.#!"
 oe_glh.7.d1a: "\n\nIn August 1382 Tokhtamysh came before Moscow, tricked the gates open and burned the city to the ground."
 oe_glh.7.d1b: "\n\nThis time Moscow has escaped the new khan's revenge."
 oe_glh.7.d2a: "\n\nThe new khan, it is said, owes the throne to Timur, and the two are still allies."
 oe_glh.7.d2b: "\n\nHow the new khan stands with Timur is not yet clear."
 oe_glh.7.d3: "\n\nNow the Golden Horde has one undisputed khan again. Whether the northern trade can be reopened depends on how the empire treats the new khan."
 oe_glh.7.a: "Recognise the new khan and reopen the northern trade"
 oe_glh.7.a.tt: "Gold #R −60#!\nThe Golden Horde: opinion of us #G +25#! (#Y 20#! years)\nGain [ShowModifier('oe_glh_north_trade')] for #Y 15#! years: trade income #G +5%#!, tariff income #G +5%#!"
 oe_glh.7.b: "Console Moscow and the metropolitan"
 oe_glh.7.b.tt: "Moscow: opinion of us #G +15#! (#Y 10#! years)\nPrestige #G +5#!\nThe empire leans towards Moscow in Rus' (Rus' leaning #Y +1#!)"
 oe_glh.7.c: "Say nothing"
 oe_glh.7.c.tt: "Nothing else happens."
 oe_glh.8.t: "The Ashes of Tana"
 oe_glh.8.d0: "#F After Tokhtamysh's two great defeats, in 1391 and 1395, Timur's armies sacked Tana, Astrakhan and Sarai.#!"
 oe_glh.8.d1: "\n\nNow the northern trade routes are cut; if the empire had [ShowModifier('oe_glh_north_trade')], it is lost with them."
 oe_glh.8.a: "Turn to the road through Trebizond and Tabriz"
 oe_glh.8.a.tt: "Gold #R −30#!\nTrebizond, if it exists: opinion of us #G +15#! (#Y 10#! years)\nGain [ShowModifier('oe_glh_east_route')] for #Y 10#! years: trade income #G +3%#!"
 oe_glh.8.b: "Rely on the Genoese of Caffa"
 oe_glh.8.b.tt: "Genoa: opinion of us #G +15#! (#Y 10#! years)"
 oe_glh.8.c: "Nothing can be done"
 oe_glh.8.c.tt: "Nothing else happens."
