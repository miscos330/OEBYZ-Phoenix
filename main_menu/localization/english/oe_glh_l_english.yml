 STATIC_MODIFIER_NAME_oe_glh_sarai_friend: "Friend of Sarai"
 STATIC_MODIFIER_DESC_oe_glh_sarai_friend: "The empire backed the right claimant to the khan's throne, and the officials and merchants of Sarai look kindly on our ships."
 STATIC_MODIFIER_NAME_oe_glh_arkadiopolis: "Walls of Arkadiopolis"
 STATIC_MODIFIER_DESC_oe_glh_arkadiopolis: "Against the next Tatar raid across the Danube, the empire has rebuilt the walls of inland Thrace."
 STATIC_MODIFIER_NAME_oe_glh_grain_dear: "Northern Grain Cut Off"
 STATIC_MODIFIER_DESC_oe_glh_grain_dear: "The empire has joined the Italians' embargo, and no grain from the northern shore of the Black Sea reaches the capital."
 STATIC_MODIFIER_NAME_oe_glh_north_grain: "Grain Treaty with the North Shore"
 STATIC_MODIFIER_DESC_oe_glh_north_grain: "While the Horde is at war with itself, the empire has made a grain treaty with the towns of the northern shore."
 STATIC_MODIFIER_NAME_oe_glh_north_trade: "The Northern Trade"
 STATIC_MODIFIER_DESC_oe_glh_north_trade: "The new khan has welcomed our merchants, and the roads to Tana and Sarai are open again."
 STATIC_MODIFIER_NAME_oe_glh_east_route: "The Eastern Route"
 STATIC_MODIFIER_DESC_oe_glh_east_route: "With the northern roads cut, our merchants go by way of Trebizond and Tabriz."
 STATIC_MODIFIER_NAME_oe_glh_kulikovo_glory: "Victory on the Don"
 STATIC_MODIFIER_DESC_oe_glh_kulikovo_glory: "At Kulikovo, Moscow beat the host of the Golden Horde in the open field."
 oe_glh_b_moscow_line: "The empire backed the metropolitan in Moscow"
