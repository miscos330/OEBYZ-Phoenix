l_english:
 oe_ir_succession: "Secure the Succession"
 oe_ir_succession_desc: "Place the succession above private loyalties at court, so that a new sovereign inherits both the crown and a court prepared to obey it.\n\nRequires #Y Centralization#!, #Y more than 40%#! Crown Power, and no non-allied noble house with #Y more than 200 Influence#!. Permanently grants #G +10%#! Court Spending Efficiency. May be completed only once."
 oe_ir_succession_done: "Succession Secured"
 oe_ir_succession_modifier: "Secured Succession"
 OE_IR_SUCCESSION_NO_RIVAL: "No non-allied noble house has more than #Y 200#! Influence"
 OE_NF_OPENING_ALLY_TT: "Establish the #Y Kantakouzenos family#! as our political ally, unlocking exclusive interactions and granting the house #R +1 monthly Influence#!. The alliance ends upon the ruler's death."
 oe_succession_settlement.1.t: "The Ambition of Kantakouzenos"
 oe_succession_settlement.1.d: "The coffin of Andronikos III has scarcely left the palace before the balance sustained by his friendship begins to crumble. A regency now exercises the throne's authority, and every decree and seal has become a prize in the struggle at court.\n\nJohn Kantakouzenos invokes his service as the late emperor's trusted friend and minister, insisting that no one understands his wishes better. Letters travel to estates and military camps; old companions gather at his door and relatives hurry between audiences. Power once secured by the emperor's trust is becoming a force answerable to the family alone.\n\nHe still publicly promises to protect the imperial household. Yet the whispers in the city ask a different question: does this great minister intend to be the young sovereign's shield, or the true master of the throne?"
 oe_succession_settlement.1.a: "The late emperor's trust can no longer hold the court together."
 OE_NF_KANTAKOUZENOS_AMBITION_TT: "The Kantakouzenos family gains #R 300 Influence#!, subject to the existing #Y 1,000#! cap."
 oe_nf_andronikos_iii_died: "Andronikos III Has Died"
 oe_nf_kantakouzenos_ambition_seen: "The Ambition of Kantakouzenos Has Occurred"
 OE_NF_SOVEREIGN_DYNASTY_RULE: "The Byzantine sovereign's dynasty cannot be a noble house. An already registered ruling dynasty loses its noble status and controlled holdings. A regent's dynasty is exempt."
