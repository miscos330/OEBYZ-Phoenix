 STATIC_MODIFIER_NAME_oe_romp_mod_secular_games:0 "Splendor of the Secular Games"
 STATIC_MODIFIER_DESC_oe_romp_mod_secular_games:0 "The realm celebrates the Secular Games of renewal, raising prestige, prosperity, cultural tradition, and estate contentment."
 STATIC_MODIFIER_NAME_oe_romp_mod_vestal_flame:0 "Eternal Flame of Vesta"
 STATIC_MODIFIER_DESC_oe_romp_mod_vestal_flame:0 "The rekindled hearth-flame of Vesta steadies imperial order, resists pestilence, and calms rebellious unrest."
 STATIC_MODIFIER_NAME_oe_romp_loc_triumphal_vow:0 "Sanctuary of the Triumphal Vow"
 STATIC_MODIFIER_DESC_oe_romp_loc_triumphal_vow:0 "A triumphal temple vowed in victory adorns this city, elevating cultural tradition, prosperity, fortifications, and civic calm."
 STATIC_MODIFIER_NAME_oe_romp_mod_sibylline_war:0 "Sibylline Oracle: Rite of Mars"
 STATIC_MODIFIER_DESC_oe_romp_mod_sibylline_war:0 "The Sibylline scrolls prescribe solemn martial rites, sharpening legionary discipline, morale, siegecraft, and war endurance."
 STATIC_MODIFIER_NAME_oe_romp_mod_sibylline_plague:0 "Sibylline Oracle: Lustration of Asclepius"
 STATIC_MODIFIER_DESC_oe_romp_mod_sibylline_plague:0 "Purificatory lustrations ordered by the Sibylline Books fortify plague resistance, food security, and demographic recovery."
 STATIC_MODIFIER_NAME_oe_romp_mod_sibylline_peace:0 "Sibylline Oracle: Concord of Peace"
 STATIC_MODIFIER_DESC_oe_romp_mod_sibylline_peace:0 "Peacetime rites drawn from the Sibylline Books reinforce civic stability, provincial control, prosperity, and commerce."
 STATIC_MODIFIER_NAME_oe_romp_mod_symposium_patronage:0 "Neoplatonic Symposium Patronage"
 STATIC_MODIFIER_DESC_oe_romp_mod_symposium_patronage:0 "Imperial sponsorship of philosophical symposia accelerates research, literacy, cultural prestige, and artistic brilliance."
 STATIC_MODIFIER_NAME_oe_romp_mod_julian_scroll:0 "Julian's Scroll of King Helios"
 STATIC_MODIFIER_DESC_oe_romp_mod_julian_scroll:0 "Secret study of Emperor Julian's philosophical hymn kindles classical scholarship, literacy, and artistic ambition at court."
 STATIC_MODIFIER_NAME_oe_romp_mod_hagia_sophia_preserved:0 "Hagia Sophia Protected under Symmachus"
 STATIC_MODIFIER_DESC_oe_romp_mod_hagia_sophia_preserved:0 "Preserving Hagia Sophia as a protected Christian cathedral earns profound goodwill across Christendom and deepens religious toleration."
 STATIC_MODIFIER_NAME_oe_romp_mod_hagia_sophia_pantheon:0 "Pantheon of Divine Wisdom & Helios"
 STATIC_MODIFIER_DESC_oe_romp_mod_hagia_sophia_pantheon:0 "Rededicating the Great Dome to Divine Wisdom, Athena, and Sol Invictus surges imperial prestige, religious influence, and missionary fervor."
 STATIC_MODIFIER_NAME_oe_romp_mod_hagia_sophia_dual:0 "Dual-Rite Sanctuary of Hagia Sophia"
 STATIC_MODIFIER_DESC_oe_romp_mod_hagia_sophia_dual:0 "A balanced dual-rite charter honors both Christian worship and classical philosophical heritage beneath the dome of Hagia Sophia."
 STATIC_MODIFIER_NAME_oe_romp_mod_edict_symmachus:0 "New Edict of Symmachus"
 STATIC_MODIFIER_DESC_oe_romp_mod_edict_symmachus:0 "A solemn imperial edict guarantees Christian freedom of worship, defusing external hostility and anchoring humanist statecraft."
 STATIC_MODIFIER_NAME_oe_romp_mod_classical_supremacy:0 "Declaration of Classical Supremacy"
 STATIC_MODIFIER_DESC_oe_romp_mod_classical_supremacy:0 "Defies foreign condemnation by proclaiming classical polytheism supreme, hardening legionary resolve and accelerating conversion."
 STATIC_MODIFIER_NAME_oe_romp_mod_janus_pax:0 "Gates of Janus Closed: Pax Romana"
 STATIC_MODIFIER_DESC_oe_romp_mod_janus_pax:0 "The bronze doors of Janus stand closed in solemn peace, ushering in booming trade, rising prosperity, and diplomatic esteem."
 STATIC_MODIFIER_NAME_oe_romp_mod_indo_greek_dialogue:0 "Indo-Greek Philosophical Dialogue"
 STATIC_MODIFIER_DESC_oe_romp_mod_indo_greek_dialogue:0 "Revives the classical dialogue between Hellenistic philosophers and Indian sages, boosting heathen tolerance, scholarship, and merchant reach."
 STATIC_MODIFIER_NAME_oe_romp_mod_logos_tao_dialogue:0 "Concord of Logos & the Tao"
 STATIC_MODIFIER_DESC_oe_romp_mod_logos_tao_dialogue:0 "Envoys of the Collegium converse with Eastern scholars on Logos, Heaven, and the Tao, lifting literacy, cultural renown, and diplomacy."
 STATIC_MODIFIER_NAME_oe_romp_mod_heliocentric_dawn:0 "Heliocentric Dawn of Sol Invictus"
 STATIC_MODIFIER_DESC_oe_romp_mod_heliocentric_dawn:0 "Heliocentric astronomy harmonizes seamlessly with Julian's solar cosmology, uniting empirical science with sacred inspiration."
 STATIC_MODIFIER_NAME_oe_romp_mod_solar_enlightenment:0 "Solar Rational Enlightenment"
 STATIC_MODIFIER_DESC_oe_romp_mod_solar_enlightenment:0 "Neoclassical rationalism guides imperial academies, transforming the pantheon into a beacon of literacy, research, and enlightened toleration."
 STATIC_MODIFIER_NAME_oe_romp_mod_sacred_tradition:0 "Sacred Traditionalist Revival"
 STATIC_MODIFIER_DESC_oe_romp_mod_sacred_tradition:0 "Traditionalist hierophants uphold the majesty of ancestral mysteries, magnifying omen potency, military discipline, and sacred devotion."
 STATIC_MODIFIER_NAME_oe_romp_mod_classical_encyclopedia:0 "Greco-Latin Classical Encyclopedia"
 STATIC_MODIFIER_DESC_oe_romp_mod_classical_encyclopedia:0 "Joint academies of Constantinople, Rome, and Athens publish a monumental encyclopedia uniting classical letters with natural philosophy."
 STATIC_MODIFIER_NAME_oe_romp_mod_civic_imperium:0 "Civic Religion & Constitutional Imperium"
 STATIC_MODIFIER_DESC_oe_romp_mod_civic_imperium:0 "Channels revolutionary ferment through Roman civic religion and constitutional law, stabilizing governance and cabinet efficiency."
 STATIC_MODIFIER_NAME_oe_romp_mod_new_saeculum:0 "New Saeculum of the Eternal City"
 STATIC_MODIFIER_DESC_oe_romp_mod_new_saeculum:0 "A millennial Secular Games celebrated across Rome and Constantinople crowns the empire in prestige, legitimacy, and golden prosperity."
 STATIC_MODIFIER_NAME_oe_romp_roma_aeterna_legacy:0 "Roma Aeterna: Classical Enlightenment Legacy"
 STATIC_MODIFIER_DESC_oe_romp_roma_aeterna_legacy:0 "From Plethon's midnight manuscripts at Mistra to the Solar Enlightenment, restored Religio Romana endures as an immortal imperial legacy."
 oe_romp_consecrate_pantheon_seat:0 "Consecrate Pantheon Seat"
 oe_romp_human_only_action_tt:0 "Available to human players only"
 oe_romp_consecrate_pantheon_seat_desc:0 "Convene the priesthood to rotate an unlocked deity into the Administrative, Diplomatic, or Military pillars of the six-seat Hexapantheon without exceeding six active gods."
 oe_romp_consecrate_pantheon_seat_past:0 "Consecrated a new seat within the six-pillar imperial Hexapantheon."
 oe_romp_consecrate_pantheon_seat_effect_tt:0 "Opens the Hexapantheon seat consecration ceremony to swap unlocked Roman and syncretic deities while keeping exactly 6 active gods."
 oe_romp_consult_sibylline_books:0 "Consult the Sibylline Books"
 oe_romp_consult_sibylline_books_desc:0 "Instruct the Quindecimviri to unseal the Sibylline Books for a ten-year state oracle tailored to war, pestilence, or peace, with enhanced rites if Augury & Sibylline Books is adopted."
 oe_romp_consult_sibylline_books_past:0 "Unsealed the Sibylline Books and proclaimed the prescribed state oracle."
 oe_romp_consult_sibylline_books_effect_tt:0 "Triggers the Sibylline Books consultation event offering war, plague-relief, or peacetime oracles."
 oe_romp_declare_secular_games:0 "Declare the Secular Games"
 oe_romp_declare_secular_games_desc:0 "Proclaim the Ludi Saeculares of purification and renewal, granting a ten-year realm-wide golden festival modifier and spreading the classical revival from the capital."
 oe_romp_declare_secular_games_past:0 "Celebrated the Secular Games across the empire in renewal of the Roman age."
 oe_romp_consecrate_triumphal_temple:0 "Consecrate a Triumphal Temple"
 oe_romp_consecrate_triumphal_temple_desc:0 "Fulfill a martial vow after victory or at peak army tradition by consecrating a twenty-year Triumphal Vow sanctuary and commissioning a classical monument in the chosen city."
 oe_romp_consecrate_triumphal_temple_past:0 "Consecrated a Triumphal Vow temple and raised a classical victory monument."
 oe_romp_triumphal_temple_allow_tt:0 "Has won a war within the last 5 years, or possesses at least #Y 40#! Army Tradition."
 oe_romp_sanctify_vestal_flame:0 "Sanctify the Vestal Flame"
 oe_romp_sanctify_vestal_flame_desc:0 "Direct the Vestal Virgins to renew the eternal hearth-flame, conferring ten years of stability, disease resistance, and rebel suppression while soothing the capital province."
 oe_romp_sanctify_vestal_flame_past:0 "Rekindled the eternal Vestal Flame to guard imperial stability and the capital province."
 oe_romp_vestal_flame_satisfaction_tt:0 "Major pops owned by our realm in the capital province gain satisfaction."
 oe_romp_hold_neoplatonic_symposium:0 "Hold a Neoplatonic Symposium"
 oe_romp_hold_neoplatonic_symposium_desc:0 "Summon philosophers, scholars, and artists in the tradition of Athens and Mistra to advance learning and literacy, with bonus classical treatises under Mistra Academy or Monism."
 oe_romp_hold_neoplatonic_symposium_past:0 "Hosted a Neoplatonic Symposium enriching classical scholarship and court culture."
 oe_romp_hold_neoplatonic_symposium_effect_tt:0 "Triggers the Neoplatonic Symposium event to patronize philosophers, boost research, or acquire classical works."
