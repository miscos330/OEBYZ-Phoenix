# NEW 2026-11-21 v9.8 Worker 2: Religio Romana Priesthood & Modifiers (oe_romp_). Generated by gen_romp_priesthood.py.
 oe_romp_augury_sibylline_aspect:0 "Augury & Sibylline Books"
 oe_romp_augury_sibylline_aspect_desc:0 "Entrusts state divination to the College of Augurs and the Quindecimviri guarding the Sibylline Books, widening offered omens and extending their duration."
 oe_romp_vestal_flame_aspect:0 "Sacred Flame of Vesta"
 oe_romp_vestal_flame_aspect_desc:0 "Keeps the eternal hearth-flame of Vesta burning in the imperial sanctuary, safeguarding civic stability, provincial prosperity, and resistance to pestilence."
 oe_romp_ludi_saeculares_aspect:0 "Ludi Saeculares"
 oe_romp_ludi_saeculares_aspect_desc:0 "Revives the Augustan Secular Games of purification and renewal, elevating imperial prestige, cultural tradition, and estate harmony across the realm."
 oe_romp_pontifex_maximus_aspect:0 "Pontifex Maximus Primacy"
 oe_romp_pontifex_maximus_aspect_desc:0 "Vests supreme priestly jurisdiction in the Emperor as Pontifex Maximus, curbing clerical autonomy, expanding crown authority, and pairing seamlessly with the Imperial Cult."
 oe_romp_mistra_academy_aspect:0 "Plethon's Mistra Academy"
 oe_romp_mistra_academy_aspect_desc:0 "Follows the Neoplatonic revival of Mistra, uniting classical philosophy, higher literacy, and refined artistic patronage with civic polytheistic rites."
 oe_romp_pax_deorum_toleration_aspect:0 "Pax Deorum Toleration"
 oe_romp_pax_deorum_toleration_aspect_desc:0 "Upholds the ancient Roman ethos of religious accommodation, granting lawful worship to diverse creeds to widen cultural capacity and ease integration."
 oe_romp_triumphal_vow_mars_aspect:0 "Triumphal Vow to Mars"
 oe_romp_triumphal_vow_mars_aspect_desc:0 "Binds legions and commanders to solemn vows before Mars prior to campaign, sharpening discipline, heavy infantry prowess, siegecraft, and triumphal rites."
 oe_romp_mystery_initiations_aspect:0 "Imperial Mystery Initiations"
 oe_romp_mystery_initiations_aspect_desc:0 "Unites the Eleusinian, Mithraic, and Isiac mystery brotherhoods under imperial patronage, amplifying omen potency, diplomatic standing, and conversion zeal."
 oe_romp_pontifical_college_law:0 "Collegium Pontificum Charter"
 oe_romp_pontifical_college_law_desc:0 "Defines the constitutional structure of the imperial priesthood, balancing supreme crown oversight, senatorial flamens, philosopher-hierophants, and fetial war-priests."
 oe_romp_pax_deorum_edict_law:0 "Edict of Symmachus & Pax Deorum"
 oe_romp_pax_deorum_edict_law_desc:0 "Establishes imperial policy toward Christians, foreign cults, and ancestral rites across the Edict of Symmachus, Interpretatio Romana syncretism, solar henotheism, and strict revival."
 oe_romp_io_sacred_calendar_law:0 "Roman Sacred Calendar Compact"
 oe_romp_io_sacred_calendar_law_desc:0 "Sets the shared sacred calendar and liturgical cycle observed across the Collegium Pontificum, spanning the Julian Fasti, the Quadrennial Olympiad, and the Solar Astronomical Calendar."
 oe_romp_io_cal_julian_fasti:0 "Julian Fasti & Roman Festivals"
 oe_romp_io_cal_julian_fasti_desc:0 "Regulates the liturgical year by the classical Julian Fasti, lowering Roman festival costs and reinforcing stability across the Collegium."
 oe_romp_io_cal_olympiad_cycle:0 "Quadrennial Olympiad Cycle"
 oe_romp_io_cal_olympiad_cycle_desc:0 "Anchors sacred observance to the four-year Olympiad cycle, enriching cultural tradition, extending omen duration, and elevating shared prestige."
 oe_romp_io_cal_solar_enlightenment:0 "Solar Astronomical Calendar"
 oe_romp_io_cal_solar_enlightenment_desc:0 "Harmonizes solar solstice rites with empirical astronomy, accelerating research speed, literacy growth, and omen strength across member realms."
 oe_romp_pol_imperial_pontifex:0 "Imperial Pontifex Maximus"
 oe_romp_pol_imperial_pontifex_desc:0 "Places the Collegium directly under the Emperor as Pontifex Maximus, strengthening crown estate power, religious influence, and omen-invocation efficiency."
 oe_romp_pol_senatorial_flamens:0 "Senatorial Flamens"
 oe_romp_pol_senatorial_flamens_desc:0 "Reserves the ancient flaminate offices for senatorial houses, fostering mutual harmony among nobles and clergy while bolstering legitimacy and stability."
 oe_romp_pol_philosopher_hierophants:0 "Philosopher-Hierophants"
 oe_romp_pol_philosopher_hierophants_desc:0 "Appoints Neoplatonic and Stoic scholars as hierophants, turning sanctuaries into academies that advance research, literacy, and artistic mastery."
 oe_romp_pol_militant_fetiales:0 "Fetial War-Priests"
 oe_romp_pol_militant_fetiales_desc:0 "Revives the ancient Fetial priesthood governing sacred declarations of war, instilling martial discipline, siege prowess, and wartime endurance."
 oe_romp_pol_edict_of_symmachus:0 "Edict of Symmachus"
 oe_romp_pol_edict_of_symmachus_desc:0 "Echoes Symmachus's plea that no single road leads to so great a mystery, protecting Christian and foreign worship at the expense of slower conversion."
 oe_romp_pol_interpretatio_syncretism:0 "Interpretatio Romana Syncretism"
 oe_romp_pol_interpretatio_syncretism_desc:0 "Applies the classical Interpretatio Romana to recognize regional deities within the imperial pantheon, widening cultural capacity and smoothing heathen conversion."
 oe_romp_pol_solar_henotheism:0 "Solar Henotheism"
 oe_romp_pol_solar_henotheism_desc:0 "Elevates Sol Invictus as the unifying fountainhead of the pantheon after Aurelian and Julian, strengthening omens, religious influence, and conversion."
 oe_romp_pol_strict_ancestral_rites:0 "Strict Ancestral Rites"
 oe_romp_pol_strict_ancestral_rites_desc:0 "Enforces uncompromising ancestral orthodoxy in public life, sharply accelerating religious conversion and true-faith devotion at the cost of heathen friction."
 oe_romp_pontificate:0 "Collegium Pontificum"
 oe_romp_pontificate_desc:0 "The supreme priestly college uniting realms of Religio Romana under the Pontifex Maximus, coordinating sacred calendars, shared rites, and the Pax Deorum."
