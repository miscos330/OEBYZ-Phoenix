l_english:
 OE_TQ_CELL_NONE: "Troops: not set"
 OE_TQ_CELL_LAND_RED: "#R Troops [Country.MakeScope.ScriptValue('oe_tq_have')|1]/[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|1]#!"
 OE_TQ_CELL_LAND_FULL: "#weak Troops [Country.MakeScope.ScriptValue('oe_tq_have')|1]/[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|1]#!"
 OE_TQ_CELL_LAND_OPEN: "Troops [Country.MakeScope.ScriptValue('oe_tq_have')|1]/[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|1]"
 OE_TQ_CELL_SEA_RED: "#R Ships [Country.MakeScope.ScriptValue('oe_tq_have')|0]/[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|0]#!"
 OE_TQ_CELL_SEA_FULL: "#weak Ships [Country.MakeScope.ScriptValue('oe_tq_have')|0]/[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|0]#!"
 OE_TQ_CELL_SEA_OPEN: "Ships [Country.MakeScope.ScriptValue('oe_tq_have')|0]/[Country.MakeScope.GetVariable('oe_tq_quota').GetValue|0]"
 OE_TQ_CELL_TT_LAND: "#T Theme replenishment#!\nRegulars [Country.MakeScope.ScriptValue('oe_tq_have')|1] thousand, quota [Country.MakeScope.GetVariable('oe_tq_quota').GetValue|1] thousand.\nQuota = status [Country.MakeScope.ScriptValue('oe_tq_q_base')|1] military office [Country.MakeScope.ScriptValue('oe_tq_q_tier')|+=1] [Concept('oe_tu_pronoia','pronoia')|e] [Country.MakeScope.ScriptValue('oe_tq_q_pronoia')|+=1]; [Country.Custom('OeTqDisarm')]at most #Y 5#!.\nThis year: [Country.Custom('OeTqLast')]\nSelf-check: [Country.Custom('OeTqChk')]\n\nChecked every January; when short, the theme raises troops from its own treasury: on land two regiments a step for #R 1.2#! thousand manpower and #R 80#! gold, one step a year (two in a [oe_tu_march|e]); at sea one galley a step for #R 30#! gold, two steps a year. The gold is shared by [oe_tu_fiscal|e]: with central officials the empire pays half (when it has at least #Y 200#! gold), a tax farm pays a quarter more, pronoia grants pay half. The theme keeps at least #Y 100#! gold. Below loyalty #Y 40#! it stops. When the player set a target for this theme in the force targets table of the Pillars overview, that yearly system raises its troops instead (it needs 1000 gold in the theme's treasury)."
 OE_TQ_CELL_TT_SEA: "#T Theme replenishment#!\nShips [Country.MakeScope.ScriptValue('oe_tq_have')|0], quota [Country.MakeScope.GetVariable('oe_tq_quota').GetValue|0] (by the military office: disorder #Y 4#!, fair and good #Y 6#!, excellent #Y 8#!).\nThis year: [Country.Custom('OeTqLast')]\nSelf-check: [Country.Custom('OeTqChk')]\n\nChecked every January; when short, the theme raises troops from its own treasury: on land two regiments a step for #R 1.2#! thousand manpower and #R 80#! gold, one step a year (two in a [oe_tu_march|e]); at sea one galley a step for #R 30#! gold, two steps a year. The gold is shared by [oe_tu_fiscal|e]: with central officials the empire pays half (when it has at least #Y 200#! gold), a tax farm pays a quarter more, [Concept('oe_tu_pronoia','pronoia')|e] grants pay half. The theme keeps at least #Y 100#! gold. Below loyalty #Y 40#! it stops. When the player set a target for this theme in the force targets table of the Pillars overview, that yearly system raises its troops instead (it needs 1000 gold in the theme's treasury)."
 oe_tq_disarm_on: "halved while the disarming cooldown runs; "
 oe_tq_disarm_off: ""
 oe_tq_last_1: "troops raised"
 oe_tq_last_2: "at quota"
 oe_tq_last_3: "#R short of gold#!"
 oe_tq_last_4: "#R short of manpower#!"
 oe_tq_last_5: "#R stopped: loyalty under 40#!"
 oe_tq_last_6: "#R seat lost, besieged or not on the coast#!"
 oe_tq_last_8: "left to the force targets table"
 oe_tq_last_9: "civil course or chartered city: none"
 oe_tq_last_10: "#R switched off for all themes#!"
 oe_tq_last_none: "not checked yet (every January)"
 oe_tq_chk_0: "nothing raised this year"
 oe_tq_chk_1: "raised as expected"
 oe_tq_chk_2: "#R fewer regiments than expected#!"
 oe_tq_chk_3: "#R no regiment appeared#!"
 oe_tq_chk_4: "#R no ship appeared#!"
 OE_TQ_SUM_LINE: "[GetCountry('BYZ').Custom('OeTqSum')]"
 oe_tq_sum_off: "Theme replenishment: #R off#! (the edict 'Theme Replenishment: Off / On' turns it back on)."
 oe_tq_sum_year: "Themes' replenishment this year: [GetCountry('BYZ').MakeScope.GetVariable('oe_tq_sum_regs').GetValue|0] regiments, [GetCountry('BYZ').MakeScope.GetVariable('oe_tq_sum_ships').GetValue|0] ships; the themes paid [GetCountry('BYZ').MakeScope.GetVariable('oe_tq_sum_gold').GetValue|0] gold, the empire [GetCountry('BYZ').MakeScope.GetVariable('oe_tq_sum_byz').GetValue|0]."
 oe_tq_sum_none: "Themes' replenishment this year: not checked yet (every January)."
 OE_TQ_SUM_TT: "Themes cannot recruit (the game's rule for building countries); instead the army and navy themes replenish themselves every January from their own treasury and manpower, up to a quota. Each theme's quota and this year's result are in the 'Troops' cell of its card.\n\nChecked every January; when short, the theme raises troops from its own treasury: on land two regiments a step for #R 1.2#! thousand manpower and #R 80#! gold, one step a year (two in a [oe_tu_march|e]); at sea one galley a step for #R 30#! gold, two steps a year. The gold is shared by [oe_tu_fiscal|e]: with central officials the empire pays half (when it has at least #Y 200#! gold), a tax farm pays a quarter more, [Concept('oe_tu_pronoia','pronoia')|e] grants pay half. The theme keeps at least #Y 100#! gold. Below loyalty #Y 40#! it stops. When the player set a target for this theme in the force targets table of the Pillars overview, that yearly system raises its troops instead (it needs 1000 gold in the theme's treasury)."
 oe_tq_toggle: "Theme Replenishment: Off / On"
 oe_tq_toggle_desc: "Stop or restart the themes' own replenishment every January, for all themes. Now: [GetCountry('BYZ').Custom('OeTqState')]. The AI never uses this."
 oe_tq_toggle_off_tt: "All themes stop replenishing themselves every year, until it is turned back on."
 oe_tq_toggle_on_tt: "All themes replenish themselves again every January."
 oe_tq_state_on: "#G on#!"
 oe_tq_state_off: "#R off#!"
