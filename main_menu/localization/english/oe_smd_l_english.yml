 oe_smd.6.a: "Send ships and gold"
 oe_smd.6.a.tt: "Costs #R 3#! months of trade and tax income\nWhen the sultan later besieges Belgrade, the chance that the fortress holds #G +10%#!\nHungary: opinion of the empire #G +20#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −15#! for #Y 10#! years\nIf the empire pays tribute to the sultan: the sultan's patience #R −10#!"
 oe_smd.6.b: "Send only gold"
 oe_smd.6.b.tt: "Costs #R 1#! month of trade and tax income\nWhen the sultan later besieges Belgrade, the chance that the fortress holds #G +5%#!\nHungary: opinion of the empire #G +10#! for #Y 10#! years"
 oe_smd.6.c: "Stay out of it"
 oe_smd.6.c.tt: "The Hungarians must defend Belgrade alone."
 oe_smd.7.t: "Helena, Despotess of Serbia"
 oe_smd.7.desc_ml: "#F Early in 1458 Despot Lazar Branković died. The widow Helena was a daughter of Thomas Palaiologos, Despot of the Morea; afterwards the Bosnian prince Stefan Tomašević entered [GetLocationByKey('smederevo').GetName], and before long the gates opened to the sultan and Serbia fell.#!\n\nNow a messenger from [GetLocationByKey('smederevo').GetName] has come before the emperor: the despotess asks the imperial house for counsel, with the fortress hard pressed—what is to be done? The despotess's father Thomas still sits at Mistra, and the imperial house still has ground there. Yet the emperor, too, no longer holds the City."
 oe_smd.7.desc_m: "#F Early in 1458 Despot Lazar Branković died. The widow Helena was a daughter of Thomas Palaiologos, Despot of the Morea; afterwards the Bosnian prince Stefan Tomašević entered [GetLocationByKey('smederevo').GetName], and before long the gates opened to the sultan and Serbia fell.#!\n\nNow a messenger from [GetLocationByKey('smederevo').GetName] has come before the emperor: the despotess asks the imperial house for counsel, with the fortress hard pressed—what is to be done? The despotess's father Thomas still sits at Mistra, and the imperial house still has ground there."
