 oe_smd.7.a: "Advise turning to Bosnia"
 oe_smd.7.a.tt: "Smederevo will turn to Bosnia; events on the Danube take their course."
 oe_smd.7.b: "Advise submitting to the sultan to save the city"
 oe_smd.7.b.tt: "The Ottomans: opinion of the empire #G +10#! for #Y 10#! years\nIf Serbia is nobody's subject and both Serbia and the Ottomans are AI at peace, Serbia becomes the Ottomans' tributary\nThe surrender of Smederevo is put off by about ten years (to 1468–1469)"
 oe_smd.7.c: "Invite the despotess and followers to the empire"
 oe_smd.7.c.tt: "Costs #R 1#! month of trade and tax income\nFor #Y 10#! years resettlement costs half and cools down sooner"
 oe_smd.90.t: "Serbia and the Danube: worker"
