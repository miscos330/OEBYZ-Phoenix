 oe_smd.1.t: "Lazar's Envoys"
 oe_smd.1.desc_euv: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. The two Churches have been reconciled, and the envoys are received with honour. The envoys remember that the empire sent troops before the Maritsa. And the emperor, too, pays tribute to the sultan."
 oe_smd.1.desc_eu: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. The two Churches have been reconciled, and the envoys are received with honour. The envoys remember that the empire sent troops before the Maritsa."
 oe_smd.1.desc_ev: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. The two Churches have been reconciled, and the envoys are received with honour. And the emperor, too, pays tribute to the sultan."
 oe_smd.1.desc_e: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. The two Churches have been reconciled, and the envoys are received with honour."
 oe_smd.1.desc_uv: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. But the anathema on the Serbian Church has not been lifted, and the patriarch will not be pleased. The envoys remember that the empire sent troops before the Maritsa. And the emperor, too, pays tribute to the sultan."
 oe_smd.1.desc_u: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. But the anathema on the Serbian Church has not been lifted, and the patriarch will not be pleased. The envoys remember that the empire sent troops before the Maritsa."
 oe_smd.1.desc_v: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. But the anathema on the Serbian Church has not been lifted, and the patriarch will not be pleased. And the emperor, too, pays tribute to the sultan."
 oe_smd.1.desc_x: "#F In 1386 Sultan Murad took [GetLocationByKey('nis').GetName]. It is said that Prince Lazar of [GetLocationByKey('krusevac').GetName] then stopped the sultan at Pločnik, and sent envoys everywhere: to Bosnia, to Hungary, and to Constantinople as well.#!\n\nNow the Serbian envoys have come to the palace: they ask the empire for money, or at least not to send troops for the sultan. As things stand, when the decisive battle comes the Serbs have about a #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_smd_kos_chance')|0]#!% chance of not bowing to the sultan. But the anathema on the Serbian Church has not been lifted, and the patriarch will not be pleased."
 oe_smd.1.a: "Send money in secret"
 oe_smd.1.a.tt: "Costs #R 2#! months of trade and tax income\nSerbia: opinion of the empire #G +25#! for #Y 10#! years\nLater at Kosovo, the chance that the Serbs do not bow to the sultan #G +10%#!\nIf the empire pays tribute to the sultan: the sultan's patience #R −5#!"
 oe_smd.1.b: "Counsel peace with the sultan"
 oe_smd.1.b.tt: "Serbia: opinion of the empire #R −10#! for #Y 5#! years\nThe Ottomans: opinion of the empire #G +10#! for #Y 5#! years\nLater at Kosovo, the chance that the Serbs do not bow to the sultan #Y −5%#!"
 oe_smd.1.c: "Do not receive them"
 oe_smd.1.c.tt: "The Serbs must look elsewhere."
 oe_smd.2.t: "News from Kosovo"
 oe_smd.2.desc_ky: "#F In June 1389 Lazar and Sultan Murad met on the Field of Kosovo, and both died that day; the Serbian nobility was all but destroyed. Lazar's widow Milica ruled for their young son Stefan.#!\n\nNow the news comes from the north: the Serbs bled at Kosovo, but they have not bowed to the sultan."
 oe_smd.2.desc_k: "#F In June 1389 Lazar and Sultan Murad met on the Field of Kosovo, and both died that day; the Serbian nobility was all but destroyed. Lazar's widow Milica ruled for their young son Stefan.#!\n\nNow the news comes from the north: the Serbs bled at Kosovo, but they have not bowed to the sultan."
 oe_smd.2.desc_y: "#F In June 1389 Lazar and Sultan Murad met on the Field of Kosovo, and both died that day; the Serbian nobility was all but destroyed. The next summer Lazar's widow Milica submitted to the new sultan, Bayezid.#!\n\nNow the news comes from the north: Serbia has become the sultan's tributary, and Serbian soldiers will fight in the sultan's wars."
 oe_smd.2.desc_x: "#F In June 1389 Lazar and Sultan Murad met on the Field of Kosovo, and both died that day; the Serbian nobility was all but destroyed. Lazar's widow Milica ruled for their young son Stefan.#!\n\nNow the news comes from the north: Serbia has become the sultan's tributary, and Serbian soldiers will fight in the sultan's wars."
 oe_smd.2.a: "Hold a requiem for Lazar in Hagia Sophia"
 oe_smd.2.a.tt: "Serbia: opinion of the empire #G +15#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years"
 oe_smd.2.b: "Congratulate the new sultan"
 oe_smd.2.b.tt: "The Ottomans: opinion of the empire #G +15#! for #Y 5#! years\nSerbia: opinion of the empire #R −10#! for #Y 5#! years"
 oe_smd.2.c: "Take in the Serbian monks and nobles who flee"
 oe_smd.2.c.tt: "Costs #R 1#! month of trade and tax income\nFor #Y 5#! years resettlement costs half and cools down sooner"
 oe_smd.3.t: "A Bride of the Kantakouzenoi"
 oe_smd.3.desc_d: "#F Despot Stefan had no son; the heir was a nephew, Đurađ Branković. The chronicles say that Đurađ married Irene Kantakouzene, a granddaughter of Emperor John VI (the year is told differently); Irene's brother Thomas later led Serbia's armies.#!\n\nNow Serbian envoys have come with an offer of marriage: the despot's heir is to take a wife, and is there a well-born bride at the palace? The despot's very title was granted by the emperor; the match comes naturally."
 oe_smd.3.desc_x: "#F Despot Stefan had no son; the heir was a nephew, Đurađ Branković. The chronicles say that Đurađ married Irene Kantakouzene, a granddaughter of Emperor John VI (the year is told differently); Irene's brother Thomas later led Serbia's armies.#!\n\nNow Serbian envoys have come with an offer of marriage: the despot's heir is to take a wife, and is there a well-born bride at the palace?"
 oe_smd.3.a: "Promise a Kantakouzene"
 oe_smd.3.a.tt: "The dowry: Costs #R 1#! month of trade and tax income\nSerbia: opinion of the empire #G +40#!, falling by #Y 1#! a year\nFrom now on the Serbian court has kin of the emperor."
 oe_smd.3.b: "Promise a Palaiologan princess"
 oe_smd.3.b.tt: "The dowry: Costs #R 2#! months of trade and tax income\nSerbia: opinion of the empire #G +50#!, falling by #Y 1#! a year\nA daughter of the imperial house sent so far: some at court grumble."
 oe_smd.3.c: "Decline politely"
 oe_smd.3.c.tt: "Serbia: opinion of the empire #R −10#! for #Y 5#! years"
 oe_smd.4.t: "The Walls of Smederevo"
 oe_smd.4.desc_t: "#F In 1427 Despot Stefan died and was succeeded by a nephew, Đurađ; as agreed, Đurađ gave [GetLocationByKey('belgrad').GetName] back to Hungary and set out to build a new capital on the Danube. Work on the fortress of [GetLocationByKey('smederevo').GetName] began at once; some say its walls were laid out after those of Constantinople.#!\n\nNow the despot's men have come to the palace to ask whether the empire could lend a few craftsmen who know fortification. The despot's wife was born in the empire, and the envoys make a point of it."
 oe_smd.4.desc_x: "#F In 1427 Despot Stefan died and was succeeded by a nephew, Đurađ; as agreed, Đurađ gave [GetLocationByKey('belgrad').GetName] back to Hungary and set out to build a new capital on the Danube. Work on the fortress of [GetLocationByKey('smederevo').GetName] began at once; some say its walls were laid out after those of Constantinople.#!\n\nNow the despot's men have come to the palace to ask whether the empire could lend a few craftsmen who know fortification."
 oe_smd.4.a: "Send craftsmen"
 oe_smd.4.a.tt: "Costs #R 2#! months of trade and tax income\nSerbia: opinion of the empire #G +20#! for #Y 10#! years\nOnce Smederevo is Serbia's capital, it gains [ShowModifier('oe_smd_walls')] for #Y 50#! years\nWhen the sultan later besieges Smederevo, the chance that the city holds #G +15%#!"
 oe_smd.4.b: "Send only money"
 oe_smd.4.b.tt: "Costs #R 1#! month of trade and tax income\nWhen the sultan later besieges Smederevo, the chance that the city holds #G +5%#!"
 oe_smd.4.c: "We cannot even mend our own walls"
 oe_smd.4.c.tt: "The despot must manage alone."
 oe_smd.5.t: "The Despot in Exile"
 oe_smd.5.desc_zt: "#F In 1439 [GetLocationByKey('smederevo').GetName] fell after a siege of three months. Despot Đurađ had already gone to Hungary; Đurađ's daughter Mara was married into Sultan Murad's court.#!\n\nNow the despot's envoy has found the emperor: would the empire speak for the despot in the West, or lend money to raise men? Only a few scattered towns are left to the despot. The despot's wife was born in the empire, and the envoy makes a point of it."
 oe_smd.5.desc_z: "#F In 1439 [GetLocationByKey('smederevo').GetName] fell after a siege of three months. Despot Đurađ had already gone to Hungary; Đurađ's daughter Mara was married into Sultan Murad's court.#!\n\nNow the despot's envoy has found the emperor: would the empire speak for the despot in the West, or lend money to raise men? Only a few scattered towns are left to the despot."
 oe_smd.5.desc_t: "#F In 1439 [GetLocationByKey('smederevo').GetName] fell after a siege of three months. Despot Đurađ had already gone to Hungary; Đurađ's daughter Mara was married into Sultan Murad's court.#!\n\nNow the despot's envoy has found the emperor: would the empire speak for the despot in the West, or lend money to raise men? Not an inch of Serbia is left in the despot's hands. The despot's wife was born in the empire, and the envoy makes a point of it."
 oe_smd.5.desc_x: "#F In 1439 [GetLocationByKey('smederevo').GetName] fell after a siege of three months. Despot Đurađ had already gone to Hungary; Đurađ's daughter Mara was married into Sultan Murad's court.#!\n\nNow the despot's envoy has found the emperor: would the empire speak for the despot in the West, or lend money to raise men? Not an inch of Serbia is left in the despot's hands."
 oe_smd.5.a: "Speak for the despot at Florence and Buda"
 oe_smd.5.a.tt: "Hungary and the Pope: opinion of the empire #G +10#! for #Y 10#! years\nSerbia (if it still exists): opinion of the empire #G +20#! for #Y 10#! years\nWhen Hungary later makes peace with the sultan, it is more likely to win the despot's capital back."
 oe_smd.5.b: "Lend the despot money to raise men"
 oe_smd.5.b.tt: "Costs #R 3#! months of trade and tax income\nShould the despot return to Smederevo, #Y 1#! year later Serbia repays #Y 2#! months of the empire's income (as much as it has, if it cannot pay it all)"
 oe_smd.5.c: "We cannot offend the sultan"
 oe_smd.5.c.tt: "The Ottomans: opinion of the empire #G +10#! for #Y 5#! years\nSerbia: opinion of the empire #R −20#! for #Y 10#! years"
 oe_smd.6.t: "Hunyadi's Appeal"
 oe_smd.6.desc_lhv: "#F In 1455 [GetLocationByKey('novo_brdo').GetName] fell again, and Sultan Mehmed soon marched north with army and fleet to besiege [GetLocationByKey('belgrad').GetName]. Hunyadi broke the river blockade and beat back the general assault under the walls; the sultan withdrew wounded, and three weeks later Hunyadi died of plague in camp.#!\n\nNow Hungarian envoys have found the court in exile, saying the sultan means to push north along the Danube, and still asking the empire for ships and gold. As things stand, [GetLocationByKey('belgrad').GetName] has about a #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_smd_bel_odds').GetValue|0]#!% chance to hold. The appeal was sent by Hunyadi in person; the defence of the fortress rests on that seasoned commander. Yet the emperor pays tribute to the sultan, and aiding Hungary openly is sure to anger the sultan."
 oe_smd.6.desc_lh: "#F In 1455 [GetLocationByKey('novo_brdo').GetName] fell again, and Sultan Mehmed soon marched north with army and fleet to besiege [GetLocationByKey('belgrad').GetName]. Hunyadi broke the river blockade and beat back the general assault under the walls; the sultan withdrew wounded, and three weeks later Hunyadi died of plague in camp.#!\n\nNow Hungarian envoys have found the court in exile, saying the sultan means to push north along the Danube, and still asking the empire for ships and gold. As things stand, [GetLocationByKey('belgrad').GetName] has about a #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_smd_bel_odds').GetValue|0]#!% chance to hold. The appeal was sent by Hunyadi in person; the defence of the fortress rests on that seasoned commander."
 oe_smd.6.desc_lv: "#F In 1455 [GetLocationByKey('novo_brdo').GetName] fell again, and Sultan Mehmed soon marched north with army and fleet to besiege [GetLocationByKey('belgrad').GetName]. Hunyadi broke the river blockade and beat back the general assault under the walls; the sultan withdrew wounded, and three weeks later Hunyadi died of plague in camp.#!\n\nNow Hungarian envoys have found the court in exile, saying the sultan means to push north along the Danube, and still asking the empire for ships and gold. As things stand, [GetLocationByKey('belgrad').GetName] has about a #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_smd_bel_odds').GetValue|0]#!% chance to hold. Yet the emperor pays tribute to the sultan, and aiding Hungary openly is sure to anger the sultan."
 oe_smd.6.desc_l: "#F In 1455 [GetLocationByKey('novo_brdo').GetName] fell again, and Sultan Mehmed soon marched north with army and fleet to besiege [GetLocationByKey('belgrad').GetName]. Hunyadi broke the river blockade and beat back the general assault under the walls; the sultan withdrew wounded, and three weeks later Hunyadi died of plague in camp.#!\n\nNow Hungarian envoys have found the court in exile, saying the sultan means to push north along the Danube, and still asking the empire for ships and gold. As things stand, [GetLocationByKey('belgrad').GetName] has about a #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_smd_bel_odds').GetValue|0]#!% chance to hold."
 oe_smd.6.desc_hv: "#F In 1455 [GetLocationByKey('novo_brdo').GetName] fell again, and Sultan Mehmed soon marched north with army and fleet to besiege [GetLocationByKey('belgrad').GetName]. Hunyadi broke the river blockade and beat back the general assault under the walls; the sultan withdrew wounded, and three weeks later Hunyadi died of plague in camp.#!\n\nNow Hungarian envoys have come to the palace, saying the sultan means to push north along the Danube, and asking the empire for ships and gold. As things stand, [GetLocationByKey('belgrad').GetName] has about a #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_smd_bel_odds').GetValue|0]#!% chance to hold. The appeal was sent by Hunyadi in person; the defence of the fortress rests on that seasoned commander. Yet the emperor pays tribute to the sultan, and aiding Hungary openly is sure to anger the sultan."
