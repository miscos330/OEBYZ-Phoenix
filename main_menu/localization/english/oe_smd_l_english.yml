 oe_smd_b_lazar_aid: "The empire secretly paid Lazar"
 oe_smd_b_rebuffed: "The empire told us to bow to the sultan"
 oe_smd_b_counsel: "The empire counselled the Serbs to make peace"
 oe_smd_b_requiem: "The empire held a requiem for Lazar"
 oe_smd_b_requiem_tur: "The empire held a requiem for our enemy"
 oe_smd_b_congrats: "The empire congratulated the new sultan"
 oe_smd_b_congrats_ser: "The empire congratulated the men who killed Lazar"
 oe_smd_b_sigismund: "The King of Hungary handed Belgrade to us"
 oe_smd_b_bride_no: "The empire declined our offer of marriage"
 oe_smd_b_walls: "The empire lent us craftsmen for our walls"
 oe_smd_b_held: "Smederevo did not open its gates to us"
 oe_smd_b_szeged: "Hungary won Smederevo back for us in the peace"
 oe_smd_b_plead: "The empire spoke for the exiled Serbian despot"
 oe_smd_b_plead_ser: "The empire spoke for the despot in the West"
 oe_smd_b_prudent: "The empire did not take up the Serbian despot's cause"
 oe_smd_b_abandoned: "The empire stood aside when the despot fell"
 oe_smd_b_detained: "The despot detained Hunyadi on the retreat"
 oe_smd_b_appeal: "The empire sent ships and gold for Belgrade"
 oe_smd_b_appeal_tur: "The empire sent ships and gold to the defenders of Belgrade"
 oe_smd_b_appeal_gold: "The empire sent gold for Belgrade"
 oe_smd_b_helena_sub: "The empire counselled Serbia to remain the sultan's tributary"
 oe_smd_b_test_hun: "(Test) Grudges against Serbia set aside for now"
 oe_smd_b_bride: "The despot's heir married a Kantakouzene"
 oe_smd_b_bride_p: "The despot's heir married a Palaiologan princess"
 oe_smd_rel_protection: "Hungarian Protection"
 oe_smd_rel_protection_desc: "The King of Hungary has taken the despot under protection: neither may make war on the other. It is not an alliance, and it ends when either becomes another's subject."
 oe_smd_rel_protection_relation: "Hungarian Protection"
 oe_smd_rel_protection_relation_desc: "The King of Hungary has taken the despot under protection: neither may make war on the other. It is not an alliance, and it ends when either becomes another's subject."
