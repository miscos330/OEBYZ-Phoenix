l_english:
 OE_SMD_SO_5: "The southern lords: their lands have passed to the Ottomans."
 OE_SMD_SO_2: "The southern lords: the lords of Prilep and Velbužd submitted to the sultan."
 OE_SMD_SO_1: "The southern lords: the lord of Prilep submitted to the sultan."
 OE_SMD_SO_F: "The southern lords: the lordship was not built."
 OE_SMD_SO_3: "The southern lords: Serbia or the Ottomans are played by a person or on the empire's side; this did not happen."
 OE_SMD_SO_X: "The southern lords: in these years no lord in the south broke away."
 OE_SMD_SO_W: "The southern lords: not yet (from the autumn of 1371)."
 OE_SMD_KO_E1B1: "The last fortresses: Belgrade withstood the sultan's siege, yet Smederevo opened its gates to the sultan and Serbia fell."
 OE_SMD_KO_E1B2: "The last fortresses: Belgrade and Smederevo fell one after the other, the Danube line collapsed, and Serbia fell."
 OE_SMD_KO_E1: "The last fortresses: Smederevo opened its gates to the sultan and Serbia fell."
 OE_SMD_KO_E2: "The last fortresses: Serbia held on ten years longer by tribute, yet in the end passed to the Ottomans."
 OE_SMD_KO_E3B1: "The last fortresses: Belgrade held and Smederevo did not fall; Serbia endured on the Danube."
 OE_SMD_KO_E3: "The last fortresses: Smederevo did not open its gates to the sultan, and Serbia endured on the Danube."
 OE_SMD_KO_B1: "The Danube line: Belgrade withstood the sultan's army and fleet."
 OE_SMD_KO_B2: "The Danube line: Belgrade fell into Ottoman hands."
 OE_SMD_KO_14: "The Danube line: Novo Brdo fell to the Ottomans once more."
 OE_SMD_KO_12: "The Danube line: after the peace of Szeged the despot returned to Smederevo, still paying tribute to the sultan."
 OE_SMD_KO_FG: "The Danube line: Smederevo fell, Serbia passed to the Ottomans, and the despot lives in exile."
 OE_SMD_KO_F1: "The Danube line: Smederevo fell, and the despot kept only a few towns on the coast of Zeta."
 OE_SMD_KO_F2: "The Danube line: Smederevo withstood the sultan's siege."
 OE_SMD_KO_10: "The Danube line: the despot moved the capital to newly built Smederevo."
 OE_SMD_KO_9: "The Danube line: Belgrade was given back to Hungary."
 OE_SMD_KO_78: "The despotate: Belgrade became the despot's capital, and Zeta passed to Serbia as well."
 OE_SMD_KO_7: "The despotate: Serbia no longer pays tribute to the sultan, and Belgrade became the despot's capital."
 OE_SMD_KO_68: "The despotate: Serbia no longer pays tribute to the sultan, and Zeta passed to Serbia as well."
 OE_SMD_KO_6: "The despotate: after Ankara, Serbia no longer pays tribute to the sultan."
 OE_SMD_KO_8: "Zeta: the lord of Zeta left the country to Serbia."
 OE_SMD_KO_1: "Kosovo: Serbia became the sultan's tributary."
 OE_SMD_KO_2: "Kosovo: the Serbs did not bow to the sultan."
 OE_SMD_KO_3: "Kosovo: Serbia or the Ottomans are played by a person or on the empire's side; this did not happen."
 OE_SMD_KO_X: "Kosovo: the sultan never marched north to a decisive battle with Serbia."
 OE_SMD_KO_W: "Kosovo: not yet (from the summer of 1389)."
