 rome_reconquista_desc: "The Eastern Roman state has always considered restoring the empire's territories its highest ideal. With the internal and external affairs of the Eastern Roman Empire settled, it is destined to tread the path walked by countless #bold #color_yellow previous Roman emperors#!#!. Europeans will soon realize that the empire itself is a more dangerous entity than the Turkish infidels.\n\nReconquest Fervour: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_rr_hope').GetValue|0]#! ([GetCountry('BYZ').Custom('OeRrTierName')])  Restored: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_rr_count').GetValue|0]#! / #Y 10#!\n\nEgypt: [GetCountry('BYZ').Custom('OeRrStatus_egypt')]\nNorth Africa: [GetCountry('BYZ').Custom('OeRrStatus_africa')]\nItaly: [GetCountry('BYZ').Custom('OeRrStatus_italy')]\nFrance: [GetCountry('BYZ').Custom('OeRrStatus_france')]\nIberia: [GetCountry('BYZ').Custom('OeRrStatus_iberia')]\nBritain: [GetCountry('BYZ').Custom('OeRrStatus_britain')]\nGermany: [GetCountry('BYZ').Custom('OeRrStatus_germany')]\nPersia: [GetCountry('BYZ').Custom('OeRrStatus_persia')]\nBlack Sea: [GetCountry('BYZ').Custom('OeRrStatus_blacksea')]\nArabia: [GetCountry('BYZ').Custom('OeRrStatus_arabia')]\n\n#Y 3#! regions: Imperial Revival; #Y 6#!: Rome Shines Again; all #Y 10#! plus Rome, Alexandria, Antioch and Carthage: the Restoration of Rome. At zero fervour the dream is broken."
 OE_RR_CARD_TITLE: "Roman Reconquest"
 OE_RR_CARD_STATE: "State: [GetCountry('BYZ').Custom('OeRrState')]"
 OE_RR_CARD_HOPE: "Reconquest Fervour #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_rr_hope').GetValue|0]#! / #Y 100#!  [GetCountry('BYZ').Custom('OeRrTierName')]"
 OE_RR_CARD_HOPE_TT: "How far rulers and people accept the story of restoring the empire.\nCampaign victory #Y +15#!, peace #Y +8#!, defeat #Y −15#!; restored city #Y +3#! (Rome #Y +5#!); triumph #Y +5#!; propaganda events ±#Y 3#!–#Y 5#!.\nA campaign older than #Y 3#! years: #Y −3#! a year; #Y 5#! years without a campaign: #Y −2#! a year.\nDispirited #Y 1#!–#Y 24#!: campaign cost #R +50%#!, legitimacy falls; Steady #Y 25#!–#Y 59#!; Rising #Y 60#!–#Y 84#!: land morale #G +5%#!, campaign event progress #G +2#!; Fervent #Y 85#!–#Y 100#!: land morale #G +10%#!, campaign pressure #G −1#! a month, stability investment penalty."
