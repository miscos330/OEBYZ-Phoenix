 OE_RR_START_TT: "The Roman Reconquest begins with Reconquest Fervour at #Y 40#!. Campaign results, restored cities and triumphs move it; at zero the dream is broken."
 OE_RR_BROKEN_TT: "The situation ends; restored regions and their rewards are kept. Tending What Remains for #Y 20#! years; after that the reconquest can be rekindled."
 oe_rr.20.t: "Imperial Revival"
 oe_rr.20.d: "Three regions have returned to the empire. Merchants in the markets speak of distant goods by the old provincial names, and the old men of the Senate say no generation since Heraclius has seen the like."
 oe_rr.20.a: "This is only the beginning"
 oe_rr.21.t: "Rome Shines Again"
 oe_rr.21.d: "Six regions are restored. An envoy leaving Constantinople can now travel on imperial soil to the far side of the sea."
 oe_rr.21.a: "Rome never left"
 OE_RR_AUTH_20: "Imperial Authority #G +20#!"
 OE_RR_AUTH_30: "Imperial Authority #G +30#!"
 oe_rr.22.t: "All Lands United"
 oe_rr.22.d: "All ten regions are restored. Once Rome, Alexandria, Antioch and Carthage are all in imperial hands and no war is being fought, the Emperor may proclaim the Restoration of Rome."
 oe_rr.22.a: "Prepare the proclamation"
 OE_RR_FINAL_TT: "The Restoration of Rome action in the Roman world panel is now available (see its conditions)."
 oe_rr.40.t: "Rekindle the Reconquest"
 oe_rr.40.d: "Twenty years have passed. A new generation of commanders never saw the old retreat, and at court they talk again of Carthage, Rome and Alexandria."
 oe_rr.40.a: "Rekindle the reconquest (Imperial Authority #R −30#!, fervour starts at #Y 25#!)"
 oe_rr.40.b: "Not yet"
 OE_RR_REKINDLE_LATER: "This will not be offered again; the Roman Reconquest stays ended."
