 STATIC_MODIFIER_DESC_oe_m2e_loc_hab_vienna_palace:0 "Baroque palaces, fortified bastions, and centralized Aulic registries bind the Alpine and Danubian crownlands together."
 STATIC_MODIFIER_NAME_oe_m2e_loc_dlh_grand_trunk:0 "Grand Trunk Road & Imperial Karkhana"
 STATIC_MODIFIER_DESC_oe_m2e_loc_dlh_grand_trunk:0 "Shaded highway sarais, imperial textile workshops, and stone citadels unite the Yamuna-Ganges heartland."
 STATIC_MODIFIER_NAME_oe_m2e_loc_chi_dadu_observatory:0 "Dadu Astronomical Observatory & Treasury"
 STATIC_MODIFIER_DESC_oe_m2e_loc_chi_dadu_observatory:0 "Guo Shoujing's astronomical instruments, silver-backed treasury vaults, and sea-grain wharves restore Great Yuan's metropolitan splendor."
 STATIC_MODIFIER_NAME_oe_m2e_loc_mng_longjiang_yard:0 "Longjiang Treasure Shipyards & Kiln Hub"
 STATIC_MODIFIER_DESC_oe_m2e_loc_mng_longjiang_yard:0 "Monumental dry docks, state porcelain distribution wharves, and Grand Canal locks anchor Great Ming's maritime and inland wealth."
 STATIC_MODIFIER_NAME_oe_m2e_loc_elr_new_const:0 "New Constantinople Imperial Acropolis"
 STATIC_MODIFIER_DESC_oe_m2e_loc_elr_new_const:0 "Copper-sheathed naval yards, silk ergasteria, and marble senate halls crown the Chesapeake as Rome reborn across the Atlantic."
 STATIC_MODIFIER_NAME_oe_m2e_loc_chg_samarkand_karez:0 "Samarkand Madrasa & Oasis Karez Network"
 STATIC_MODIFIER_DESC_oe_m2e_loc_chg_samarkand_karez:0 "Subterranean snowmelt qanats, turquoise madrasas, and armored caravan yards turn Transoxiana into the beating heart of Inner Asia."
 oe_m2e.1.t:0 "Crossroads of New Rome: Themes or Senate?"
 oe_m2e.1.d:0 "With Praetorian prefectures restored across forty cities, Constantinople faces a defining debate over the institutional spine of the resurgent Empire. Strategoi urge a return to disciplined Theme bureaucracies and hereditary landholding garrisons, while Golden Horn magnates plead for an Imperial Senate Maritime Charter backed by free sea lanes and merchant credit."
 oe_m2e.1.a:0 "Restore the Theme Bureaucracy and Katepanates."
 STATIC_MODIFIER_NAME_oe_m2e_byz_theme_mod:0 "Restored Theme Bureaucracy"
 STATIC_MODIFIER_DESC_oe_m2e_byz_theme_mod:0 "Disciplined military provinces and imperial registrars tighten Constantinople's administrative grip."
 oe_m2e.1.b:0 "Grant the Imperial Senate Maritime Charter."
 STATIC_MODIFIER_NAME_oe_m2e_byz_senate_mod:0 "Imperial Senate Maritime Charter"
 STATIC_MODIFIER_DESC_oe_m2e_byz_senate_mod:0 "Chartered senatorial syndicates and free-port clearing houses flood the Golden Horn with commerce."
 oe_m2e.1.c:0 "Forge an Ecumenical Imperial Synthesis."
 STATIC_MODIFIER_NAME_oe_m2e_byz_synth_mod:0 "Ecumenical Imperial Synthesis"
 STATIC_MODIFIER_DESC_oe_m2e_byz_synth_mod:0 "Balanced cooperation between Palace, Senate, and Themes secures harmonious provincial rule."
 oe_m2e.2.t:0 "Coronation of Eternal Rome"
 oe_m2e.2.d:0 "Beneath the soaring dome of Hagia Sophia, envoys from the Tiber to the Euphrates bow before the unbroken throne of the Caesars. Having survived five centuries of tempest to reclaim its birthright as a modern superpower, Eternal Rome now proclaims the enduring constitutional doctrine that will guide the Empire through the age of empires and industry."
 oe_m2e.2.a:0 "Proclaim the Constitutional Basileia of the Romans."
 STATIC_MODIFIER_NAME_oe_m2e_byz_const_mod:0 "Constitutional Basileia"
 STATIC_MODIFIER_DESC_oe_m2e_byz_const_mod:0 "Law-bound imperial institutions unite classical jurisprudence with modern scientific administration."
 oe_m2e.2.b:0 "Enthrone the Thalassocracy of the Two Seas."
 STATIC_MODIFIER_NAME_oe_m2e_byz_mare_mod:0 "Roman Thalassocracy"
 STATIC_MODIFIER_DESC_oe_m2e_byz_mare_mod:0 "Purple-sailed squadrons and Golden Horn banks dominate trade across the Mediterranean and beyond."
 oe_m2e.2.c:0 "Crown the Universal Autokrator of East and West."
 STATIC_MODIFIER_NAME_oe_m2e_byz_auto_mod:0 "Universal Autokrator"
 STATIC_MODIFIER_DESC_oe_m2e_byz_auto_mod:0 "Unquestioned imperial sovereignty commands legions and prefectures from Italy to the Levant."
 oe_m2e.3.t:0 "The Apple of the World: Kostantiniyye's Imperial Order"
 oe_m2e.3.d:0 "With the banners of Osman raised above the battered Theodosian Walls, the Sultan enters the greatest metropolis of the Mediterranean as conqueror and heir to Rome. Grand Viziers, Janissary Agas, and Greek, Armenian, and Jewish community leaders await the decree that will transform Kostantiniyye into the new center of Eurasia."
 oe_m2e.3.a:0 "Rule as Kayser-i Rum with a Centralized Imperial Divan."
 STATIC_MODIFIER_NAME_oe_m2e_tur_kayser_mod:0 "Kayser-i Rum Sovereignty"
 STATIC_MODIFIER_DESC_oe_m2e_tur_kayser_mod:0 "Fusing Ottoman Kanun with Byzantine imperial majesty accelerates integration across Rumelia and Anatolia."
 oe_m2e.3.b:0 "Empower the Janissary Corps and Tophane Arsenals."
 STATIC_MODIFIER_NAME_oe_m2e_tur_janissary_mod:0 "Tophane Gunpowder Supremacy"
 STATIC_MODIFIER_DESC_oe_m2e_tur_janissary_mod:0 "State-funded Janissaries and monumental bronze siege guns make Ottoman armies unstoppable."
 oe_m2e.3.c:0 "Charter a Cosmopolitan Millet Commercial Metropolis."
 STATIC_MODIFIER_NAME_oe_m2e_tur_millet_mod:0 "Cosmopolitan Imperial Metropolis"
 STATIC_MODIFIER_DESC_oe_m2e_tur_millet_mod:0 "Protected merchant quarters and religious autonomy swiftly repopulate and enrich the Straits."
 oe_m2e.4.t:0 "The Sublime Porte Across Three Continents"
 oe_m2e.4.d:0 "From the Danube ramparts to Cairo and the Hejaz sanctuaries, the House of Osman presides over an empire spanning Europe, Asia, and Africa. Having modernized its treasuries and armies for the Age of Absolutism, the Sublime Porte now proclaims the enduring pillar of its global destiny."
 oe_m2e.4.a:0 "Enact the Nizam-i Cedid Modernizing Order."
 STATIC_MODIFIER_NAME_oe_m2e_tur_nizam_mod:0 "Nizam-i Cedid Order"
 STATIC_MODIFIER_DESC_oe_m2e_tur_nizam_mod:0 "Modern drill, disciplined fiscal ministries, and engineering schools keep the Porte ahead of every rival."
 oe_m2e.4.b:0 "Exalt the Universal Caliphate of the Two Sanctuaries."
 STATIC_MODIFIER_NAME_oe_m2e_tur_caliph_mod:0 "Sublime Caliphate"
 STATIC_MODIFIER_DESC_oe_m2e_tur_caliph_mod:0 "Unrivaled spiritual prestige binds distant Muslim realms and provinces in steadfast loyalty."
 oe_m2e.4.c:0 "Dominate the Mediterranean and Red Sea Trade Lanes."
 STATIC_MODIFIER_NAME_oe_m2e_tur_sea_mod:0 "Dual-Sea Ottoman Armada"
 STATIC_MODIFIER_DESC_oe_m2e_tur_sea_mod:0 "Imperial shipyards at Constantinople and Suez project uncontested maritime supremacy."
 oe_m2e.5.t:0 "Dismantling the Iqta: Diwan Salaries or Niyabat Federation?"
 oe_m2e.5.d:0 "With the Fifth Corps drilling beside the Cairo Citadel and Syria firmly secured, the Sultanate has outgrown its medieval iqta fiefs. Finance ministers propose sweeping fiscal centralization under a salaried royal Diwan, provincial emirs advocate a structured Niyabat viceroyalty compact, and Alexandria's Karimi magnates offer to bankroll the state through chartered spice exchanges."
 oe_m2e.5.a:0 "Centralize Revenues in the Cairo Diwan and Fifth Corps."
 STATIC_MODIFIER_NAME_oe_m2e_mam_diwan_mod:0 "Centralized Cairo Diwan"
 STATIC_MODIFIER_DESC_oe_m2e_mam_diwan_mod:0 "Salaried musketeers and direct Nile revenue audits break the power of rebellious iqta warlords."
 oe_m2e.5.b:0 "Codify the Reformed Niyabat Viceroyalty Compact."
 STATIC_MODIFIER_NAME_oe_m2e_mam_niyabat_mod:0 "Niyabat Viceroyalty Compact"
 STATIC_MODIFIER_DESC_oe_m2e_mam_niyabat_mod:0 "Accountable viceroys in Damascus, Aleppo, and the Hejaz govern distant frontiers with loyal efficiency."
 oe_m2e.5.c:0 "Partner with the Karimi Merchant-Financier Consortium."
 STATIC_MODIFIER_NAME_oe_m2e_mam_karimi_mod:0 "Karimi Financial Consortium"
 STATIC_MODIFIER_DESC_oe_m2e_mam_karimi_mod:0 "State-backed merchant guilds mobilize credit and spice convoys from Calicut to Venice."
 oe_m2e.6.t:0 "Master of the Two Seas: The Dual-Sea Sultanate"
 oe_m2e.6.d:0 "Ships flying the golden crescent glide directly from the Mediterranean through the dredged Trajan-Suez locks into the Red Sea and onward to Aden and India. Having defied European oceanic encirclement and modernized its ancient heartland, Egypt proclaims the eternal destiny of the Dual-Sea Sultanate."
 oe_m2e.6.a:0 "Command the Suez-Aden Oceanic Spice Empire."
 STATIC_MODIFIER_NAME_oe_m2e_mam_ocean_mod:0 "Suez-Aden Oceanic Empire"
 STATIC_MODIFIER_DESC_oe_m2e_mam_ocean_mod:0 "Uncontested control over the shortest sea lane between East and West makes Cairo the tollkeeper of world trade."
 oe_m2e.6.b:0 "Exalt the Sovereign Protector of Cairo and the Sanctuaries."
 STATIC_MODIFIER_NAME_oe_m2e_mam_sanct_mod:0 "Protector of the Two Sanctuaries"
 STATIC_MODIFIER_DESC_oe_m2e_mam_sanct_mod:0 "Al-Azhar scholarship and guardianship of Mecca and Medina crown Cairo with unmatched Islamic prestige."
 oe_m2e.6.c:0 "Build the Nile Industrial and Agrarian Powerhouse."
 STATIC_MODIFIER_NAME_oe_m2e_mam_nile_mod:0 "Nile Industrial Heartland"
 STATIC_MODIFIER_DESC_oe_m2e_mam_nile_mod:0 "Regulated Delta irrigation, sugar refineries, and cotton looms turn Egypt into a demographic and industrial colossus."
 oe_m2e.7.t:0 "Soul of the Tsardom: Oprichnina Autocracy or Zemsky Sobor?"
 oe_m2e.7.d:0 "As new-formation infantry regiments march beneath the Kremlin walls, Moscow confronts the fiercest constitutional crisis of Russian history. Hardliners demand an iron Oprichnina autocracy to crush hereditary boyar clans, provincial delegates rally behind the Zemsky Sobor Assembly of the Land, and modernizers champion a meritocratic Table of Ranks open to every loyal servant of the state."
 oe_m2e.7.a:0 "Enforce Oprichnina Service Autocracy."
 STATIC_MODIFIER_NAME_oe_m2e_rus_oprich_mod:0 "Service Autocracy"
 STATIC_MODIFIER_DESC_oe_m2e_rus_oprich_mod:0 "Absolute crown supremacy bends boyar estates and frontier provinces to rapid mobilization."
 oe_m2e.7.b:0 "Empower the Zemsky Sobor Assembly of the Land."
 STATIC_MODIFIER_NAME_oe_m2e_rus_sobor_mod:0 "Zemsky Sobor Compact"
 STATIC_MODIFIER_DESC_oe_m2e_rus_sobor_mod:0 "Representative estates from Novgorod to Kazan fund the Tsardom willingly in exchange for lawful governance."
 oe_m2e.7.c:0 "Codify the Imperial Table of Ranks Meritocracy."
 STATIC_MODIFIER_NAME_oe_m2e_rus_ranks_mod:0 "Table of Ranks Meritocracy"
 STATIC_MODIFIER_DESC_oe_m2e_rus_ranks_mod:0 "Fourteen grades of civil and military service forge a tireless, merit-driven imperial officer corps."
 oe_m2e.8.t:0 "Imperator of All the Russias"
 oe_m2e.8.d:0 "With naval ensigns flying on the Neva, merchant caravans spanning Siberia, and Astrakhan guarding the Caspian shore, the Russian Empire stands as an awe-inspiring Eurasian colossus. Before assembled princes, synod bishops, and foreign ambassadors, the Imperator declares the permanent grand vision of modern Russia."
 oe_m2e.8.a:0 "Champion the Europeanized Window on the Neva."
 STATIC_MODIFIER_NAME_oe_m2e_rus_euro_mod:0 "Window on Europe"
 STATIC_MODIFIER_DESC_oe_m2e_rus_euro_mod:0 "Baltic ports, engineering academies, and Ural foundries propel Russia into the front rank of modern powers."
 oe_m2e.8.b:0 "Exalt the Third Rome Orthodox Autocracy."
 STATIC_MODIFIER_NAME_oe_m2e_rus_third_mod:0 "Third Rome Imperium"
 STATIC_MODIFIER_DESC_oe_m2e_rus_third_mod:0 "Unshakable Orthodox devotion and boundless reserves steel the Russian army against any coalition."
 oe_m2e.8.c:0 "Forge the Trans-Siberian Continental Colossus."
 STATIC_MODIFIER_NAME_oe_m2e_rus_sib_mod:0 "Continental Colossus"
 STATIC_MODIFIER_DESC_oe_m2e_rus_sib_mod:0 "Imperial post roads, river steamers, and Cossack settlements knit twelve time zones under Moscow's hand."
 oe_m2e.9.t:0 "The New Yassa: Settled Gunpowder State or Ulus Confederation?"
 oe_m2e.9.d:0 "Under the brick domes of revitalized New Sarai, the Great Kurultai debates how the Ulus of Jochi shall survive and conquer in an age of cannon and printing presses. Urban scribes urge a settled gunpowder monarchy, proud wing begs defend a federated Ulus charter, and Black Sea merchants envision a vast Kipchak trade brokerage linking Europe to Persia."
 oe_m2e.9.a:0 "Build a Sedentary Gunpowder Khaganate at Sarai."
 STATIC_MODIFIER_NAME_oe_m2e_glh_sedent_mod:0 "Sedentary Gunpowder Khaganate"
 STATIC_MODIFIER_DESC_oe_m2e_glh_sedent_mod:0 "Masonry fortresses, bronze foundries, and cadastral taxes fuse nomadic ferocity with modern statecraft."
 oe_m2e.9.b:0 "Ratify the Federated Ulus and Wing Beg Charter."
 STATIC_MODIFIER_NAME_oe_m2e_glh_ulus_mod:0 "Federated Ulus Charter"
 STATIC_MODIFIER_DESC_oe_m2e_glh_ulus_mod:0 "Honoring the autonomy of Crimea, Kazan, and steppe wings binds every beg in fierce loyalty to Sarai."
 oe_m2e.9.c:0 "Transform the Horde into a Volga-Black Sea Silk Brokerage."
 STATIC_MODIFIER_NAME_oe_m2e_glh_trade_mod:0 "Kipchak Silk Brokerage"
 STATIC_MODIFIER_DESC_oe_m2e_glh_trade_mod:0 "Guaranteed caravan safety from Tana to Astrakhan turns the Kipchak steppe into a golden corridor."
 oe_m2e.10.t:0 "Eternal Ulus of Jochi"
 oe_m2e.10.d:0 "Defying every prediction of steppe decline, the Golden Horde commands the Volga-Don canal, polyglot scientific academies, and disciplined artillery-cavalry hosts from the Black Sea to the Urals. Before tribute envoys from Rus', Persia, and Central Asia, the Great Khan decrees the timeless charter of the Ulus of Jochi."
 oe_m2e.10.a:0 "Proclaim the Eurasian Gunpowder Super-Khaganate."
 STATIC_MODIFIER_NAME_oe_m2e_glh_gun_mod:0 "Eurasian Gunpowder Khaganate"
 STATIC_MODIFIER_DESC_oe_m2e_glh_gun_mod:0 "Armored horse-artillery brigades and wagon-fort doctrines render the Golden Horde invincible on the open plain."
 oe_m2e.10.b:0 "Crown Sarai the Polyglot River Metropolis."
 STATIC_MODIFIER_NAME_oe_m2e_glh_poly_mod:0 "Polyglot Sarai Metropolis"
 STATIC_MODIFIER_DESC_oe_m2e_glh_poly_mod:0 "Turkic, Persian, and Slavic scholars and merchants flourish together along the Volga-Don waterway."
 oe_m2e.10.c:0 "Enforce Eternal Suzerainty Over Forest and Steppe."
 STATIC_MODIFIER_NAME_oe_m2e_glh_suz_mod:0 "Supreme Steppe Suzerain"
 STATIC_MODIFIER_DESC_oe_m2e_glh_suz_mod:0 "Reformed Yarliq charters bind tributary princes and ulus lords into an unbreakable imperial pyramid."
 oe_m2e.11.t:0 "The State of France: Sun King Absolutism or Estates-General?"
 oe_m2e.11.d:0 "With royal Intendants auditing every generalite and the confessional wars healed, France stands on the threshold of continental supremacy. Court jurists urge full Versailles absolutism to tame provincial parlements forever, reformist nobles and townsmen press for a constitutional Estates-General, while treasury ministers champion Colbertian state manufactories and maritime tariffs."
 oe_m2e.11.a:0 "Enthrone Versailles Absolutism and Royal Intendants."
 STATIC_MODIFIER_NAME_oe_m2e_fra_abs_mod:0 "Versailles Absolutism"
 STATIC_MODIFIER_DESC_oe_m2e_fra_abs_mod:0 "L'Etat, c'est moi: centralized royal intendants and court splendor project unrivaled authority."
 oe_m2e.11.b:0 "Convene a Reformed Estates-General Charter."
 STATIC_MODIFIER_NAME_oe_m2e_fra_estates_mod:0 "Reformed Estates-General"
 STATIC_MODIFIER_DESC_oe_m2e_fra_estates_mod:0 "Consent-based taxation eliminates fiscal crises and binds all three orders to the French Crown."
 oe_m2e.11.c:0 "Unleash Colbertian Manufactures and Mercantilism."
 STATIC_MODIFIER_NAME_oe_m2e_fra_colbert_mod:0 "Colbertian Mercantilism"
 STATIC_MODIFIER_DESC_oe_m2e_fra_colbert_mod:0 "State tapestries, cannon foundries, and protected merchant fleets turn France into Europe's workshop."
 oe_m2e.12.t:0 "L'Etat et le Code: France at the Summit of Europe"
 oe_m2e.12.d:0 "From the Channel to the Alps, France radiates unrivaled military art, Enlightenment science, and legal clarity. Having completed its five-century transformation into the foremost nation of continental Europe, Paris now proclaims the grand legacy that shall illuminate the modern age."
 oe_m2e.12.a:0 "Promulgate the Universal Civil Code and Grande Armee."
 STATIC_MODIFIER_NAME_oe_m2e_fra_code_mod:0 "Civil Code & Grande Armee"
 STATIC_MODIFIER_DESC_oe_m2e_fra_code_mod:0 "Rational law and meritocratic marshals forge a continental colossus feared and emulated across Europe."
 oe_m2e.12.b:0 "Crown Paris the Republic of Letters and Industry."
 STATIC_MODIFIER_NAME_oe_m2e_fra_salon_mod:0 "Republic of Letters"
 STATIC_MODIFIER_DESC_oe_m2e_fra_salon_mod:0 "Encyclopedists, engineers, and royal academies place France at the cutting edge of modern science."
 oe_m2e.12.c:0 "Build a Twin-Sea Atlantic and Mediterranean Empire."
 STATIC_MODIFIER_NAME_oe_m2e_fra_ocean_mod:0 "Twin-Sea French Empire"
 STATIC_MODIFIER_DESC_oe_m2e_fra_ocean_mod:0 "Brest and Toulon fleets project French commerce and colonies across both the Atlantic and Indian Oceans."
 oe_m2e.13.t:0 "Crown and Commons: Parliamentary Bank or Royal Prerogative?"
 oe_m2e.13.d:0 "With London's docks teeming with oceanic tonnage and Westminster debating sovereign debt, England stands at the decisive constitutional fork of the early modern era. Whigs demand full Parliamentary supremacy paired with a national Bank of England, merchant magnates push for an Admiralty-chartered oceanic corporate state, while Cavaliers defend Crown prerogative backed by loyal gentry."
 oe_m2e.13.a:0 "Enact Parliamentary Supremacy and the Bank of England."
 STATIC_MODIFIER_NAME_oe_m2e_eng_parl_mod:0 "Bank of England Credit"
 STATIC_MODIFIER_DESC_oe_m2e_eng_parl_mod:0 "Sovereign parliamentary credit funds wars and canals at rates no absolutist rival can match."
 oe_m2e.13.b:0 "Empower Chartered Admiralty and Oceanic Companies."
 STATIC_MODIFIER_NAME_oe_m2e_eng_adm_mod:0 "Admiralty & Chartered Companies"
 STATIC_MODIFIER_DESC_oe_m2e_eng_adm_mod:0 "Joint-stock Indiamen backed by Royal Navy escorts sweep rivals from Atlantic and Asian lanes."
 oe_m2e.13.c:0 "Uphold the Prerogative Crown and Yeomanry Compact."
 STATIC_MODIFIER_NAME_oe_m2e_eng_crown_mod:0 "Prerogative Crown Compact"
 STATIC_MODIFIER_DESC_oe_m2e_eng_crown_mod:0 "Unified royal command and sturdy provincial militias forge an unyielding island fortress."
 oe_m2e.14.t:0 "Rule Britannia: Workshop and Fleet of the World"
 oe_m2e.14.d:0 "United from London to Edinburgh and Dublin, Britain commands the waves with ships of the line while the Royal Society and mechanized looms herald an industrial revolution. At Westminster's grand jubilee, the Empire chooses the crowning doctrine of the Pax Britannica."
 oe_m2e.14.a:0 "Maintain the Global Royal Navy Thalassocracy."
 STATIC_MODIFIER_NAME_oe_m2e_eng_navy_mod:0 "Pax Britannica Fleet"
 STATIC_MODIFIER_DESC_oe_m2e_eng_navy_mod:0 "Two-power naval supremacy secures every choke point from Gibraltar to the Strait of Malacca."
 oe_m2e.14.b:0 "Lead Mankind as the Industrial Workshop of the World."
 STATIC_MODIFIER_NAME_oe_m2e_eng_ind_mod:0 "Workshop of the World"
 STATIC_MODIFIER_DESC_oe_m2e_eng_ind_mod:0 "Steam engines, blast furnaces, and mechanized mills generate unprecedented wealth and technological lead."
 oe_m2e.14.c:0 "Found an Imperial Federation of Free Realms."
 STATIC_MODIFIER_NAME_oe_m2e_eng_fed_mod:0 "Imperial Federation"
 STATIC_MODIFIER_DESC_oe_m2e_eng_fed_mod:0 "Self-governing dominions and chartered provinces unite freely beneath the British Crown."
 oe_m2e.15.t:0 "Governing Both Hemispheres: Council of the Indies or Iberian Fueros?"
 oe_m2e.15.d:0 "Silver fleets from the Americas and Tercio dispatches from Italy flood the desks of the Council of the Indies. Royal secretaries propose rigid administrative centralization under Madrid, colonial governors advocate autonomous viceroyalties and adelantados, while Salamanca economists warn that only sound monetary reform and open Iberian ports can save Spain from silver inflation."
 oe_m2e.15.a:0 "Centralize the Council of the Indies and Tercios."
 STATIC_MODIFIER_NAME_oe_m2e_spa_council_mod:0 "Centralized Council of the Indies"
 STATIC_MODIFIER_DESC_oe_m2e_spa_council_mod:0 "Tight royal oversight marshals silver taxes and Tercio brigades across both hemispheres."
 oe_m2e.15.b:0 "Charter Federated Viceroyalties and Adelantados."
 STATIC_MODIFIER_NAME_oe_m2e_spa_viceroy_mod:0 "Federated Viceroyalty Charter"
 STATIC_MODIFIER_DESC_oe_m2e_spa_viceroy_mod:0 "Empowered viceroys and adelantados expand and defend overseas dominions with rapid local initiative."
 oe_m2e.15.c:0 "Enact Salamanca Monetary Reform and Open Ports."
 STATIC_MODIFIER_NAME_oe_m2e_spa_salamanca_mod:0 "Salamanca Monetary Order"
 STATIC_MODIFIER_DESC_oe_m2e_spa_salamanca_mod:0 "Disciplined minting and freer port charters turn American silver into enduring Iberian industry."
 oe_m2e.16.t:0 "Plus Ultra: Empire Where the Sun Never Sets"
 oe_m2e.16.d:0 "From Seville and Granada to Andean peaks and Pacific Manila, the Spanish monarchy has forged history's first truly planetary empire without succumbing to bankruptcy or decline. Before grandees, bishops, and admirals of two oceans, the Crown proclaims the eternal mission of Plus Ultra."
 oe_m2e.16.a:0 "Sustain the Twin-Ocean Galleon Dominion."
 STATIC_MODIFIER_NAME_oe_m2e_spa_galleon_mod:0 "Twin-Ocean Galleon Dominion"
 STATIC_MODIFIER_DESC_oe_m2e_spa_galleon_mod:0 "Escorted treasure convoys and Manila-Seville exchanges make Spain the master of global silver trade."
 oe_m2e.16.b:0 "Exalt the Universal Catholic Monarchy."
 STATIC_MODIFIER_NAME_oe_m2e_spa_cath_mod:0 "Universal Catholic Monarchy"
 STATIC_MODIFIER_DESC_oe_m2e_spa_cath_mod:0 "Steadfast faith and peerless infantry discipline defend the realms of Spain on every continent."
 oe_m2e.16.c:0 "Launch the Enlightened Reform Crown."
 STATIC_MODIFIER_NAME_oe_m2e_spa_reform_mod:0 "Enlightened Iberian Crown"
 STATIC_MODIFIER_DESC_oe_m2e_spa_reform_mod:0 "Royal academies, canal works, and fiscal transparency transform imperial gold into lasting prosperity."
 oe_m2e.17.t:0 "The Danubian Compromise: Aulic Centralization or Crownland Diets?"
 oe_m2e.17.d:0 "With Vienna, Prague, and the Carpathian marches linked beneath one scepter, Habsburg statesmen confront the central puzzle of a multilingual empire. Imperial jurists urge sweeping Aulic centralization from the Hofburg, Bohemian and Hungarian estates plead for a polyglot federal diet charter, while marshals of the Military Frontier demand permanent mobilization against eastern and western rivals."
 oe_m2e.17.a:0 "Unify Administration under the Vienna Aulic Chancery."
 STATIC_MODIFIER_NAME_oe_m2e_hab_aulic_mod:0 "Vienna Aulic Chancery"
 STATIC_MODIFIER_DESC_oe_m2e_hab_aulic_mod:0 "Standardized Hofkammer budgets and imperial courts weld diverse provinces into a cohesive modern state."
 oe_m2e.17.b:0 "Enact the Polyglot Crownland Confederation."
 STATIC_MODIFIER_NAME_oe_m2e_hab_diets_mod:0 "Crownland Confederation"
 STATIC_MODIFIER_DESC_oe_m2e_hab_diets_mod:0 "Respecting the historic charters of Bohemia and Hungary wins unshakeable loyalty and diplomatic renown."
 oe_m2e.17.c:0 "Fortify the Armed Military Frontier and Imperial Guard."
 STATIC_MODIFIER_NAME_oe_m2e_hab_grenze_mod:0 "Danubian Military Frontier"
 STATIC_MODIFIER_DESC_oe_m2e_hab_grenze_mod:0 "Star forts and seasoned Grenzer battalions turn the Danube valley into an impregnable fortress."
 oe_m2e.18.t:0 "A.E.I.O.U.: Destiny of the Double-Headed Eagle"
 oe_m2e.18.d:0 "Vienna's concert halls echo across Europe, Bohemian glass and Alpine steel fill continental markets, and the Double-Headed Eagle arbitrates the balance of power from the Rhine to the Balkans. In the grand Hall of Ceremonies, the Emperor seals Austria's lasting modern identity."
 oe_m2e.18.a:0 "Crown the Enlightened Danubian Reform Monarchy."
 STATIC_MODIFIER_NAME_oe_m2e_hab_enl_mod:0 "Enlightened Danubian Monarchy"
 STATIC_MODIFIER_DESC_oe_m2e_hab_enl_mod:0 "Universal schooling, tolerant law, and Baroque splendor make Vienna the beacon of Central Europe."
 oe_m2e.18.b:0 "Stand Supreme as Concert Arbiter of Europe."
 STATIC_MODIFIER_NAME_oe_m2e_hab_arb_mod:0 "Imperial Concert Arbiter"
 STATIC_MODIFIER_DESC_oe_m2e_hab_arb_mod:0 "Habsburg statecraft orchestrates continental coalitions and preserves Central European hegemony."
 oe_m2e.18.c:0 "Forge the Alpine-Danubian Industrial Heartland."
 STATIC_MODIFIER_NAME_oe_m2e_hab_ind_mod:0 "Danubian Industrial Heartland"
 STATIC_MODIFIER_DESC_oe_m2e_hab_ind_mod:0 "Bohemian factories, Alpine foundries, and imperial arsenals power an unmatched Central European economy."
 oe_m2e.19.t:0 "Pillars of Hindustan: Iqta Federalism or Imperial Diwan?"
 oe_m2e.19.d:0 "Inside the Ibadat Khana hall of debates, scholars, Rajput princes, Afghan mansabdars, and provincial iqtadars gather before the throne of Delhi. Revenue reformers press for direct Imperial Diwan centralization across every pargana, regional lords argue for an Iqta federal compact, while imperial philosophers urge full Sulh-i-Kul religious synthesis to unite all Hindustan in lasting peace."
 oe_m2e.19.a:0 "Establish Imperial Diwan and Mansabdar Centralization."
 STATIC_MODIFIER_NAME_oe_m2e_dlh_diwan_mod:0 "Imperial Diwan Centralization"
 STATIC_MODIFIER_DESC_oe_m2e_dlh_diwan_mod:0 "Measured zabt land surveys and accountable mansabdars channel Hindustan's vast wealth straight to Delhi."
 oe_m2e.19.b:0 "Ratify Iqta Provincial Federalism and the Zamindar Compact."
 STATIC_MODIFIER_NAME_oe_m2e_dlh_iqta_mod:0 "Iqta Federal Compact"
 STATIC_MODIFIER_DESC_oe_m2e_dlh_iqta_mod:0 "Autonomous provincial viceroys and Rajput allies mobilize massive regional armies in loyal harmony."
 oe_m2e.19.c:0 "Proclaim Universal Sulh-i-Kul Religious Synthesis."
 STATIC_MODIFIER_NAME_oe_m2e_dlh_sulh_mod:0 "Sulh-i-Kul Harmony"
 STATIC_MODIFIER_DESC_oe_m2e_dlh_sulh_mod:0 "Equitable governance across all faiths eliminates sectarian revolts and unleashes Indo-Persian creativity."
 oe_m2e.20.t:0 "Ascension to the Peacock Throne"
 oe_m2e.20.d:0 "Seated beneath the jeweled arches of the Peacock Throne, the sovereign of Delhi, Lahore, and Bengal rules a realm whose textile looms, marble monuments, and gunpowder armies astound visitors from across the globe. Amid trumpets and cannon salutes, the Padshah decrees the enduring destiny of Hindustan."
 oe_m2e.20.a:0 "Reign as the Manufacturing Workshop of the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_m2e_dlh_loom_mod:0 "Workshop of the Indian Ocean"
 STATIC_MODIFIER_DESC_oe_m2e_dlh_loom_mod:0 "Bengal muslins, Gujarati shipyards, and imperial karkhanas draw silver from every sea on earth."
 oe_m2e.20.b:0 "Crown the Universal Padshah of the Subcontinent."
 STATIC_MODIFIER_NAME_oe_m2e_dlh_pad_mod:0 "Universal Padshah"
 STATIC_MODIFIER_DESC_oe_m2e_dlh_pad_mod:0 "Peerless administrative poise and artistic patronage unite India from the Himalayas to the southern seas."
 oe_m2e.20.c:0 "Command the Grand Trunk Gunpowder Empire."
 STATIC_MODIFIER_NAME_oe_m2e_dlh_gun_mod:0 "Grand Trunk Gunpowder Empire"
 STATIC_MODIFIER_DESC_oe_m2e_dlh_gun_mod:0 "Rapidly deployed artillery trains and endless recruitment pools make Delhi unconquerable."
 oe_m2e.21.t:0 "Great Yuan at the Crossroads: Southern Tax Reform or Steppe Aristocracy?"
 oe_m2e.21.d:0 "With the Zhizheng upheaval mastered and Dadu's Central Secretariat restored, rival factions clash in the Great Hall of Brightness. Confucian reformers urge comprehensive southern tax rationalization and civil meritocracy, steppe princes defend traditional Mongol military aristocracy and Keshig privileges, while provincial grand councilors propose a balanced Xingsheng viceroyalty and maritime grain compact."
 oe_m2e.21.a:0 "Enact Southern Tax Reform and Secretariat Meritocracy."
 STATIC_MODIFIER_NAME_oe_m2e_chi_civil_mod:0 "Secretariat Civil Reform"
 STATIC_MODIFIER_DESC_oe_m2e_chi_civil_mod:0 "Fair agrarian taxation and multi-ethnic civil examinations unlock the full fiscal power of China."
 oe_m2e.21.b:0 "Uphold Steppe Military Aristocracy and Keshig Primacy."
 STATIC_MODIFIER_NAME_oe_m2e_chi_steppe_mod:0 "Keshig Military Aristocracy"
 STATIC_MODIFIER_DESC_oe_m2e_chi_steppe_mod:0 "Hereditary steppe banners reinforced with Yuan bronze firearms keep the Great Khan's armies peerless."
 oe_m2e.21.c:0 "Seal the Xingsheng Viceroyalty and Sea-Grain Compact."
 STATIC_MODIFIER_NAME_oe_m2e_chi_xingsheng_mod:0 "Xingsheng & Sea-Grain Compact"
 STATIC_MODIFIER_DESC_oe_m2e_chi_xingsheng_mod:0 "Harmonized provincial secretariats and ocean grain fleets link Jiangnan, Zaytun, and Dadu seamlessly."
 oe_m2e.22.t:0 "Pax Mongolica Reborn: The Modern Great Yuan"
 oe_m2e.22.d:0 "Astronomical armillary spheres turn atop Dadu's observatory, silver-backed Jiaochao circulates from Zaytun to Samarkand, and Shenjiying brigades stand watch from Kashgar to the East China Sea. Having forged an unprecedented modern synthesis of Eurasia, the Great Yuan proclaims its immortal imperial course."
 oe_m2e.22.a:0 "Lead the Shoushi Scientific and Monetary Renaissance."
 STATIC_MODIFIER_NAME_oe_m2e_chi_sci_mod:0 "Shoushi Scientific Renaissance"
 STATIC_MODIFIER_DESC_oe_m2e_chi_sci_mod:0 "Sound paper credit, astronomical precision, and Sino-Islamic scholarship spark an eastern modern age."
 oe_m2e.22.b:0 "Rule the Trans-Eurasian Silk and Oceanic Mandate."
 STATIC_MODIFIER_NAME_oe_m2e_chi_silk_mod:0 "Trans-Eurasian Silk Mandate"
 STATIC_MODIFIER_DESC_oe_m2e_chi_silk_mod:0 "Blue-and-white porcelain convoys and oasis highways unite the entire Old World under Yuan commerce."
 oe_m2e.22.c:0 "Reign Eternal as Dual-Realm Khagan and Son of Heaven."
 STATIC_MODIFIER_NAME_oe_m2e_chi_dual_mod:0 "Khagan and Son of Heaven"
 STATIC_MODIFIER_DESC_oe_m2e_chi_dual_mod:0 "Dual legitimacy commands fierce obedience from steppe uluses, xingsheng viceroys, and tributary realms."
 oe_m2e.23.t:0 "The Grand Debate of the Treasure Fleets: Oceanic Empire or Great Wall?"
 oe_m2e.23.d:0 "As Admiral Zheng He's monumental nine-masted treasure ships anchor off Nanjing bearing giraffes, Malaccan envoys, and Indian spices, fierce debate erupts in the imperial court. Maritime ministers urge permanent blue-water fleets and Nanyang trade charters, northern marshals warn that every tael spent at sea weakens the Great Wall against steppe horsemen, while practical grand secretaries propose a disciplined Single-Whip dual-front balance."
 oe_m2e.23.a:0 "Commit to the Zheng He Maritime Empire and Nanyang Charter."
 STATIC_MODIFIER_NAME_oe_m2e_mng_ocean_mod:0 "Zheng He Maritime Empire"
 STATIC_MODIFIER_DESC_oe_m2e_mng_ocean_mod:0 "Permanent treasure armadas turn the South China Sea and Indian Ocean into a Ming commercial sphere."
 oe_m2e.23.b:0 "Prioritize Great Wall Continental Defense and Weisuo Garrisons."
 STATIC_MODIFIER_NAME_oe_m2e_mng_wall_mod:0 "Great Wall Continental Shield"
 STATIC_MODIFIER_DESC_oe_m2e_mng_wall_mod:0 "Masonry fortresses, signal towers, and modernized garrisons seal the northern frontier impregnably."
 oe_m2e.23.c:0 "Adopt a Disciplined Dual-Front Fiscal Balance."
 STATIC_MODIFIER_NAME_oe_m2e_mng_whip_mod:0 "Balanced Dual-Front State"
 STATIC_MODIFIER_DESC_oe_m2e_mng_whip_mod:0 "Prudent budgeting sustains licensed coastal trade alongside strong northern frontier forts."
 oe_m2e.24.t:0 "Bright Mandate Over Land and Sea"
 oe_m2e.24.d:0 "Above the golden roofs of the Forbidden City and the bustling dry docks of Nanjing and Canton, Great Ming stands revitalized—its silver reserves steady, its red-cannon forts unbroken, its kilns and academies admired across the earth. The Emperor now proclaims the permanent destiny of the Bright Dynasty."
 oe_m2e.24.a:0 "Command Pacific Treasure-Fleet Hegemony."
 STATIC_MODIFIER_NAME_oe_m2e_mng_pac_mod:0 "Pacific Ming Hegemony"
 STATIC_MODIFIER_DESC_oe_m2e_mng_pac_mod:0 "Oceanic Ming convoys bridge Manila, Malacca, and the Indian Ocean in uncontested maritime splendor."
 oe_m2e.24.b:0 "Ignite the Tiangong Practical-Learning Empire."
 STATIC_MODIFIER_NAME_oe_m2e_mng_tech_mod:0 "Tiangong Practical Empire"
 STATIC_MODIFIER_DESC_oe_m2e_mng_tech_mod:0 "Empirical agronomy, precision metallurgy, and porcelain-textile industry usher China into early modernity."
 oe_m2e.24.c:0 "Preside Over the Tributary Harmony of the Four Seas."
 STATIC_MODIFIER_NAME_oe_m2e_mng_trib_mod:0 "Harmony of the Four Seas"
 STATIC_MODIFIER_DESC_oe_m2e_mng_trib_mod:0 "Loyal princes, protectorates, and tributary kingdoms sustain an unbroken East Asian peace."
 oe_m2e.25.t:0 "Charter of Hesperia: Imperial Exarchates or Federal Senate?"
 oe_m2e.25.d:0 "With purple eagles commanding the eastern seaboard from Vinland's northern waters to the Gulf of Mexico, Elysian leaders assemble in New Constantinople's marble Senate. Provincial commanders champion an Autonomous Exarchate Commonwealth, imperial centralists advocate an unbroken Chesapeake autocracy, while shipyard magnates press for a maritime republic powered by silk and copper-clad fleets."
 oe_m2e.25.a:0 "Ratify the Autonomous Exarchate Commonwealth."
 STATIC_MODIFIER_NAME_oe_m2e_elr_exarch_mod:0 "Exarchate Commonwealth"
 STATIC_MODIFIER_DESC_oe_m2e_elr_exarch_mod:0 "Loyal regional Exarchs settle and guard the vast expanses of Hesperia with autonomous vigor."
 oe_m2e.25.b:0 "Enforce Centralized New Constantinople Autocracy."
 STATIC_MODIFIER_NAME_oe_m2e_elr_auto_mod:0 "New Constantinople Autocracy"
 STATIC_MODIFIER_DESC_oe_m2e_elr_auto_mod:0 "Concentrated imperial command mobilizes Hesperian legions and revenues swiftly for global war."
 oe_m2e.25.c:0 "Empower the Atlantic Mercantile and Copper-Fleet Charter."
 STATIC_MODIFIER_NAME_oe_m2e_elr_fleet_mod:0 "Copper-Fleet Mercantile Charter"
 STATIC_MODIFIER_DESC_oe_m2e_elr_fleet_mod:0 "Elysian silk guilds and Greek Fire arsenals turn Chesapeake Bay into the wealthiest hub of the Atlantic."
 oe_m2e.26.t:0 "Imperium Bicephalum: Twin Crowns of Two Worlds"
 oe_m2e.26.d:0 "From Chesapeake Bay across the Azores to the Mediterranean horizon, the miracle of Elysia is complete. No longer desperate exiles clinging to a wilderness shore, the Romans of the West now choose the permanent grand mission of their twin-ocean imperium."
 oe_m2e.26.a:0 "Enthrone the Twin-Ocean Imperial Synthesis."
 STATIC_MODIFIER_NAME_oe_m2e_elr_twin_mod:0 "Twin-Ocean Synthesis"
 STATIC_MODIFIER_DESC_oe_m2e_elr_twin_mod:0 "Copper-clad dromons and transatlantic exarchates bind Europe and Hesperia under one purple crown."
 oe_m2e.26.b:0 "Proclaim the Nostos Restoration of the Old World."
 STATIC_MODIFIER_NAME_oe_m2e_elr_nostos_mod:0 "Nostos Restoration"
 STATIC_MODIFIER_DESC_oe_m2e_elr_nostos_mod:0 "Pyrophoroi legions and veteran admirals reclaim Rome's ancient Mediterranean patrimony in triumph."
 oe_m2e.26.c:0 "Celebrate the Sovereign New World Roman Era."
 STATIC_MODIFIER_NAME_oe_m2e_elr_newworld_mod:0 "New World Roman Era"
 STATIC_MODIFIER_DESC_oe_m2e_elr_newworld_mod:0 "Free from Old World quarrels, Elysian science, silk looms, and constitutional liberty blaze a new path."
 oe_m2e.27.t:0 "Destiny of the Silk Ulus: Transoxiana Urban Synthesis or Steppe Yassa?"
 oe_m2e.27.d:0 "With Almaliq, Samarkand, and Kashgar reunited beneath one khan, the great debate that historically shattered the Chagatai Ulus returns in triumph rather than civil war. Transoxianian scholars and merchants urge an urban Perso-Turkic synthesis, Ili steppe noyans fiercely defend the nomadic Yassa of Genghis Khan, while oasis governors advocate a balanced Federated Amirate Commonwealth."
 oe_m2e.27.a:0 "Embrace Transoxiana Perso-Turkic Urban Synthesis."
 STATIC_MODIFIER_NAME_oe_m2e_chg_urban_mod:0 "Transoxiana Urban Synthesis"
 STATIC_MODIFIER_DESC_oe_m2e_chg_urban_mod:0 "Samarkand madrasas, Bukharan guilds, and karez agriculture propel the Khanate into a sedentary renaissance."
 oe_m2e.27.b:0 "Uphold Steppe Yassa and Tian Shan Cavalry Supremacy."
 STATIC_MODIFIER_NAME_oe_m2e_chg_yassa_mod:0 "Steppe Yassa Supremacy"
 STATIC_MODIFIER_DESC_oe_m2e_chg_yassa_mod:0 "Unbroken nomadic martial code and armored cataphracts strike terror into sedentary empires east and west."
 oe_m2e.27.c:0 "Establish the Federated Amirate Silk Commonwealth."
 STATIC_MODIFIER_NAME_oe_m2e_chg_amir_mod:0 "Federated Amirate Commonwealth"
 STATIC_MODIFIER_DESC_oe_m2e_chg_amir_mod:0 "Chartered oasis amirates from Fergana to Turpan guard the Silk Road in prosperous unity."
 oe_m2e.28.t:0 "Eternal Khaganate of the Silk Road"
 oe_m2e.28.d:0 "Astronomers chart constellations in Samarkand, endless caravans cross snow-watered Fergana and Tarim oases, and armored Chagatai gunpowder batteries guard the passes from Khorasan to the Altai. At the grand Kurultai of the reunited ulus, the Khagan seals the eternal charter of Central Asia's supreme empire."
 oe_m2e.28.a:0 "Crown Samarkand the Astronomical and Cultural Jewel."
 STATIC_MODIFIER_NAME_oe_m2e_chg_ren_mod:0 "Chagatai Renaissance Jewel"
 STATIC_MODIFIER_DESC_oe_m2e_chg_ren_mod:0 "Chagatai poetry, oasis engineering, and astronomical tables shine as the intellectual lamp of Inner Asia."
 oe_m2e.28.b:0 "Reign as Continental Crossroads Trade Hegemon."
 STATIC_MODIFIER_NAME_oe_m2e_chg_silk_mod:0 "Silk Road Crossroads Hegemon"
 STATIC_MODIFIER_DESC_oe_m2e_chg_silk_mod:0 "Silver paizas and paved Yam highways funnel trade between China, India, Persia, and Europe through Chagatai hands."
 oe_m2e.28.c:0 "Forge the Armored Gunpowder Khaganate of Central Asia."
 STATIC_MODIFIER_NAME_oe_m2e_chg_gun_mod:0 "Armored Gunpowder Khaganate"
 STATIC_MODIFIER_DESC_oe_m2e_chg_gun_mod:0 "Silk Road cataphracts backed by modern field artillery dominate every pass and plain across Eurasia."
 STATIC_MODIFIER_NAME_oe_m2e_con_envoy_mod:0 "Concert Chancery Engagement"
 STATIC_MODIFIER_DESC_oe_m2e_con_envoy_mod:0 "Active diplomatic leadership in multilateral assemblies elevates sovereign prestige."
 STATIC_MODIFIER_NAME_oe_m2e_con_guard_mod:0 "Sovereign Autonomy Posture"
 STATIC_MODIFIER_DESC_oe_m2e_con_guard_mod:0 "Protecting domestic fortifications and fiscal independence shields the realm from foreign meddling."
 STATIC_MODIFIER_NAME_oe_m2e_con_market_mod:0 "Open-Treaty Merchant Exchange"
 STATIC_MODIFIER_DESC_oe_m2e_con_market_mod:0 "Harmonized treaty tariffs encourage cross-border guilds and lively urban markets."
 STATIC_MODIFIER_NAME_oe_m2e_con_militia_mod:0 "Civic Defense Mobilization"
 STATIC_MODIFIER_DESC_oe_m2e_con_militia_mod:0 "Provincial militias and frontier garrisons rally swiftly to defend the realm."
 STATIC_MODIFIER_NAME_oe_m2e_con_frontier_mod:0 "Imperial Frontier Charter"
 STATIC_MODIFIER_DESC_oe_m2e_con_frontier_mod:0 "Crown surveyors and frontier marshals integrate border strongholds cleanly into the realm."
 STATIC_MODIFIER_NAME_oe_m2e_con_maritime_mod:0 "Open-Seas Commercial Charter"
 STATIC_MODIFIER_DESC_oe_m2e_con_maritime_mod:0 "Licensed ocean fleets expand merchant reach across monsoon and Mediterranean routes."
 STATIC_MODIFIER_NAME_oe_m2e_con_granary_mod:0 "Inland Granary Reinvestment"
 STATIC_MODIFIER_DESC_oe_m2e_con_granary_mod:0 "Coastal tariffs redirected into rural granaries and roads cushion the realm against dearth."
 STATIC_MODIFIER_NAME_oe_m2e_con_expedition_mod:0 "Sanctioned Campaign Banner"
 STATIC_MODIFIER_DESC_oe_m2e_con_expedition_mod:0 "Multilateral sanction inspires troops marching to chasten frontier aggressors."
 STATIC_MODIFIER_NAME_oe_m2e_con_vassal_mod:0 "Chartered Protectorate Autonomy"
 STATIC_MODIFIER_DESC_oe_m2e_con_vassal_mod:0 "Fair tributary terms earn steadfast loyalty from distant marches and protectorates."
 STATIC_MODIFIER_NAME_oe_m2e_con_recovery_mod:0 "Post-Congress Reconstruction"
 STATIC_MODIFIER_DESC_oe_m2e_con_recovery_mod:0 "Demobilized troops and treaty peace heal devastated provinces rapidly."
 STATIC_MODIFIER_NAME_oe_m2e_con_privateer_mod:0 "Armed Strait Patrol & Letters of Marque"
 STATIC_MODIFIER_DESC_oe_m2e_con_privateer_mod:0 "Hardened captains enforce coastal tolls and harass hostile shipping along strategic narrows."
 STATIC_MODIFIER_NAME_oe_m2e_con_sanitary_mod:0 "Lazaretto Quarantine Network"
 STATIC_MODIFIER_DESC_oe_m2e_con_sanitary_mod:0 "Permanent harbor quarantine wards and shared medical logs shield cities from transoceanic plagues."
 STATIC_MODIFIER_NAME_oe_m2e_con_audit_mod:0 "Concert Chancery Archive"
 STATIC_MODIFIER_DESC_oe_m2e_con_audit_mod:0 "Compiled diplomatic rolls keep ambassadors well briefed on active international accords."
 STATIC_MODIFIER_NAME_oe_m2e_levy_elite_mod:0 "Armored & Drilled Flavour Levy"
 STATIC_MODIFIER_DESC_oe_m2e_levy_elite_mod:0 "Heavy state outlay for armor, mounts, and powder turns regional levies into lethal shock hosts."
 STATIC_MODIFIER_NAME_oe_m2e_levy_charter_mod:0 "Hereditary Levy Land Charter"
 STATIC_MODIFIER_DESC_oe_m2e_levy_charter_mod:0 "Guaranteed tax exemptions and grazing or farm rights ensure rapid muster recovery and loyal estates."
 STATIC_MODIFIER_NAME_oe_m2e_levy_audit_mod:0 "Muster Roll Registry Review"
 STATIC_MODIFIER_DESC_oe_m2e_levy_audit_mod:0 "Updated provincial muster registers keep recruitment officers prepared for sudden mobilization."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_yuan_civil_mod:0 "Dadu Civil Restoration Edict"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_yuan_civil_mod:0 "Reforming provincial censors and land rolls steadies Great Yuan's administrative spine."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_yuan_banner_mod:0 "Keshig Imperial Mobilization"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_yuan_banner_mod:0 "Rallied steppe princes and guard tumens ride south to uphold the Great Khan's banner."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_yuan_statute_mod:0 "New Statutes of Great Yuan"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_yuan_statute_mod:0 "Codified post-restoration statutes anchor multi-ethnic harmony across China and the steppe."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_yuan_frontier_mod:0 "Imperial Frontier Garrison Honours"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_yuan_frontier_mod:0 "Decorated generals and reinforced border forts safeguard the newly settled order."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_glh_kurultai_mod:0 "Sarai Emergency Kurultai"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_glh_kurultai_mod:0 "Stern oaths sworn by the wing begs stem factional fracture across the Kipchak steppe."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_glh_river_mod:0 "Volga Citadel & Merchant Levy"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_glh_river_mod:0 "Fortifying Sarai and Astrakhan with merchant silver buys precious time to outlast the Troubles."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_glh_rebuild_mod:0 "Volga Yam Reconstruction"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_glh_rebuild_mod:0 "Rebuilt caravanserais and census rolls revive the Golden Horde's devastated heartland."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_glh_yassa_mod:0 "Iron Yassa Steppe Discipline"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_glh_yassa_mod:0 "Stern enforcement of nomadic martial law restores fear of the Golden Horde's horsemen."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_byz_academy_mod:0 "Imperial Scriptoria & Academy"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_byz_academy_mod:0 "Copied Platonic manuscripts and Hellenic rhetoric halls ignite the Byzantine Renaissance."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_byz_atelier_mod:0 "Golden Horn Master Ateliers"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_byz_atelier_mod:0 "Greek and Italian architects, glassmakers, and printers transform Constantinople's urban craft."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_byz_letters_mod:0 "Charter of Hellenic Letters"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_byz_letters_mod:0 "Enduring academies anchor Constantinople as the intellectual bridge between East and West."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_byz_science_mod:0 "Applied Navigation & Engineering"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_byz_science_mod:0 "Humanist geometry and astronomy are turned directly toward cartography, cannon, and shipbuilding."
 STATIC_MODIFIER_NAME_oe_m2e_sit2_ec_fort_mod:0 "Zasyechnaya Frontier Line"
 STATIC_MODIFIER_DESC_oe_m2e_sit2_ec_fort_mod:0 "Abatis timber walls and stone citadels blunt steppe raids and Polish-Lithuanian offensives alike."
