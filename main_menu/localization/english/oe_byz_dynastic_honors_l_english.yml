l_english:
 OE_HEIR_SELECTION_ADOPTED_CHILD: "Adopted Child"
 OE_BYZ_CO_EMPEROR_FRAME: "#bold #color_yellow Co-Emperor#!#!"
 OE_BYZ_CO_EMPEROR_FRAME_TT: "The current holder of the Co-Emperor title. Click the portrait to view the character. The frame is empty when the office is vacant."
 OE_BYZ_NO_CO_EMPEROR_CANDIDATE: "@trigger_no! Requires a domestic character or theme ruler who is a dynastic descendant of the ruler or holds the title of Caesar."
 OE_BYZ_NO_ADOPTION_CANDIDATE: "@trigger_no! No eligible candidate: requires a living domestic character who is neither the Emperor nor a dynasty head and is not already a royal adopted child. Any estate, sex or age is eligible."
 OE_BYZ_ADOPTION_FIVE_YEARS: "This adoption action has not been used within the last five years."
 OE_BYZ_ADOPTION_THREE_YEARS: "Family adoption has not been used within the last three years."
 oe_byz_royal_adopted_child: "Royal Adopted Child"
 STATIC_MODIFIER_NAME_oe_byz_royal_adopted_child: "Royal Adopted Child"
 STATIC_MODIFIER_DESC_oe_byz_royal_adopted_child: "An adopted member of the imperial family. Monthly Prestige +0.05; Byzantine succession score +100."
 oe_byz_family_adoption.1.t: "A Child to Carry the House Forward"
 oe_byz_claim_imperial_leadership: "Claim Imperial Leadership"
 oe_byz_claim_imperial_leadership_desc_specific: "Spend 5 Prestige to make the Byzantine ruler leader of both the Imperial Pillars and the Roman World. Available only while the ruler does not lead both organizations."
 oe_byz_claim_imperial_leadership_concept: "#bold #color_yellow Imperial Prerogative#!#!"
 oe_byz_claim_imperial_leadership_act_past: "Claim Imperial Leadership has been carried out."
 oe_byz_adopt_child: "Adopt a Child"
 oe_byz_adopt_child_desc_specific: "Spend 10 Legitimacy to adopt a domestic character of any estate who is not a dynasty head. The recipient joins the ruler’s dynasty and becomes a Royal Adopted Child: Monthly Prestige +0.05 and succession score +100. Existing parents and family relationships are preserved. Usable once every five years."
 oe_byz_adopt_child_concept: "#bold #color_yellow Imperial Prerogative#!#!"
 oe_byz_adopt_child_act_past: "Adopt a Child has been carried out."
 oe_byz_adopt_from_family: "Adopt from the Family"
 oe_byz_adopt_from_family_desc_specific: "Spend 10 Legitimacy to choose an adopted son from three boys aged 3–12. Each has abilities between 20 and 50 and a random childhood education trait. The chosen boy becomes the ruler’s child, sharing their dynasty and culture, following the Orthodox Catholic Church. Usable once every three years."
 oe_byz_adopt_from_family_concept: "#bold #color_yellow Imperial Prerogative#!#!"
 oe_byz_adopt_from_family_act_past: "Adopt from the Family has been carried out."
 oe_byz_family_adoption.1.1: "Receive [SCOPE.sCharacter('oe_family_candidate_1').GetName] as my son."
 oe_byz_family_adoption.1.2: "Receive [SCOPE.sCharacter('oe_family_candidate_2').GetName] as my son."
 oe_byz_family_adoption.1.3: "Receive [SCOPE.sCharacter('oe_family_candidate_3').GetName] as my son."
 oe_byz_family_adoption.1.d: "The elders of the dynasty bring three boys before the court. Their deeds are still unwritten, but each already shows a distinct temper and promise. One may be received as the Emperor’s son, entered in the imperial genealogy and raised to carry the hopes of the house.\n\n[SCOPE.sCharacter('oe_family_candidate_1').GetName], age [SCOPE.sCharacter('oe_family_candidate_1').GetAgeInYears]: Administrative [SCOPE.sCharacter('oe_family_candidate_1').GetAbility('adm')|0], Diplomatic [SCOPE.sCharacter('oe_family_candidate_1').GetAbility('dip')|0], Military [SCOPE.sCharacter('oe_family_candidate_1').GetAbility('mil')|0].\n[SCOPE.sCharacter('oe_family_candidate_2').GetName], age [SCOPE.sCharacter('oe_family_candidate_2').GetAgeInYears]: Administrative [SCOPE.sCharacter('oe_family_candidate_2').GetAbility('adm')|0], Diplomatic [SCOPE.sCharacter('oe_family_candidate_2').GetAbility('dip')|0], Military [SCOPE.sCharacter('oe_family_candidate_2').GetAbility('mil')|0].\n[SCOPE.sCharacter('oe_family_candidate_3').GetName], age [SCOPE.sCharacter('oe_family_candidate_3').GetAgeInYears]: Administrative [SCOPE.sCharacter('oe_family_candidate_3').GetAbility('adm')|0], Diplomatic [SCOPE.sCharacter('oe_family_candidate_3').GetAbility('dip')|0], Military [SCOPE.sCharacter('oe_family_candidate_3').GetAbility('mil')|0]."
 oe_byz_change_dynasty_to_crown_foreign: "$oe_byz_change_dynasty_to_crown$"
 oe_byz_change_dynasty_to_crown_foreign_desc_specific: "$oe_byz_change_dynasty_to_crown_desc_specific$"
 oe_byz_change_dynasty_to_crown_foreign_concept: "$oe_byz_change_dynasty_to_crown_concept$"
 oe_byz_change_dynasty_to_crown_foreign_act_past: "$oe_byz_change_dynasty_to_crown_act_past$"
 oe_byz_confer_caesar_foreign: "$oe_byz_confer_caesar$"
 oe_byz_confer_caesar_foreign_desc_specific: "$oe_byz_confer_caesar_desc_specific$"
 oe_byz_confer_caesar_foreign_concept: "$oe_byz_confer_caesar_concept$"
 oe_byz_confer_caesar_foreign_act_past: "$oe_byz_confer_caesar_act_past$"
