 OE_NF_EXPANSION_RULES: "Automatic expansion is permanently disabled after Revoke Noble Privileges. Before that, every five years, expand into one adjacent location owned directly by Eastern Rome; a house without holdings instead chooses an eligible imperial location at random. Provinces protected against monopoly can never be claimed again. Above 100 and up to 400 Influence, spend 50 for one extra location; above 400, spend 150 for two extra locations. Failed extra expansion costs nothing. Rural holdings are exclusive; different houses may share non-rural locations. Mount Athos is excluded."
