 oe_thh_cab_amber_monopoly_action_progress_tooltip:0 "Empower the Order's Grand Steward (Grossschaffer) to direct Samland amber royalties and Vistula grain exports across Baltic and Hanseatic markets—lifting trade income, tax yield, and sea-trade efficiency while slightly chafing private port merchants."
 oe_thh_adv_age1_ritterbruder:0 "Ritterbruder Knightly Discipline"
 oe_thh_adv_age1_ritterbruder_desc:0 "Codifies the monastic lance wedge and iron obedience of Teutonic Knight-Brothers on the Baltic plains, unlocking Teutonic Ritterbruder Heavy Knights."
 oe_thh_ritterbruder:0 "Teutonic Ritterbruder Heavy Knights"
 oe_thh_ritterbruder_desc:0 "White-mantled Age of Traditions heavy knights bearing the black cross, renowned for disciplined lance charges across Prussia and Livonia."
 oe_thh_adv_age2_ordens_knechte:0 "Marienburg Ordens-Knechte Regiments"
 oe_thh_adv_age2_ordens_knechte_desc:0 "Integrates professional salaried infantry retainers and brick-fortress crossbow formations into Marienburg's standing armies, unlocking Marienburg Ordens-Knechte Heavy Infantry."
 oe_thh_ordens_knechte:0 "Marienburg Ordens-Knechte Heavy Infantry"
 oe_thh_ordens_knechte_desc:0 "Stalwart Renaissance halberdiers and armored foot retainers drilled beneath Marienburg's walls to anchor the Order's battle line and siegeworks."
 oe_thh_adv_age3_black_cross_reiters:0 "Black-Cross Reiter Caracole Doctrine"
 oe_thh_adv_age3_black_cross_reiters_desc:0 "Equips imperial German and Prussian noble cavalry with wheellock pistols and black-lacquered cuirasses for shock-and-fire maneuvers, unlocking Black-Cross Reiters Cavalry."
 oe_thh_black_cross_reiters:0 "Black-Cross Reiters Cavalry"
 oe_thh_black_cross_reiters_desc:0 "Age of Discovery armored pistolier-lancers recruited from Prussian commanderies and HRE Bailiwicks, combining wheellock volleys with relentless shock."
 oe_thh_adv_age4_baltic_grenadiers:0 "Baltic Fortress Grenadier Assaults"
 oe_thh_adv_age4_baltic_grenadiers_desc:0 "Forms disciplined pike-and-grenade assault companies specialized in storming bastion fortifications across the Baltic and Vistula theaters, unlocking Baltic Fortress Grenadiers."
 oe_thh_baltic_grenadiers:0 "Baltic Fortress Grenadiers"
 oe_thh_baltic_grenadiers_desc:0 "Hardened Age of Reformation assault infantry armed with flintlocks and iron grenades to crack bastion walls and hold Baltic star-forts."
 oe_thh_adv_age5_prussian_cuirassiers:0 "Prussian-Order Cuirassier Standards"
 oe_thh_adv_age5_prussian_cuirassiers_desc:0 "Merges monastic iron discipline with absolutist gallop-charge cavalry tactics, forging unstoppable Prussian-Order Cuirassiers."
 oe_thh_prussian_order_cuirassiers:0 "Prussian-Order Cuirassiers"
 oe_thh_prussian_order_cuirassiers_desc:0 "Absolutist-era heavy shock cuirassiers dressed in polished steel and white-and-black coats, shattering enemy lines in synchronized knee-to-knee charges."
 oe_thh_adv_age6_imperial_guard:0 "Imperial Cross Guard Regiments"
 oe_thh_adv_age6_imperial_guard_desc:0 "Culminates five centuries of Teutonic and Prussian drill in rapid-fire line guard infantry bearing the Iron Cross, unlocking Imperial Cross Guard Infantry."
 oe_thh_imperial_cross_guard:0 "Imperial Cross Guard Infantry"
 oe_thh_imperial_cross_guard_desc:0 "Pinnacle Age of Revolutions elite guardsmen uniting Teutonic martial heritage with modern Prussian fire discipline under the Iron Cross."
