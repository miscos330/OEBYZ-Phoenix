l_english:
# NEW 2026-11-23 v22.0 Module 2 Teutonic HRE Statecraft & Bailiwicks (oe_thh_, gen_v220_teu_hre_statecraft.py) — english localization (250 keys). Edit gen_v220_teu_hre_statecraft.py, not this file.
 OTB1:0 "Ballei Bohmen"
 OTB1_ADJ:0 "Bohemian Bailiwick"
 oe_thh_name_leo_von_dischingen:0 "Leo von Dischingen"
 oe_thh_ballei_seat_1:0 "Prague Bohemian Bailiwick Seat"
 oe_thh_ballei_seat_1_desc:0 "Foreign commandery headquarters of the Teutonic Bailiwick of Bohemia at Prague, channeling Czech-Moravian estates and guest crusaders northward to Marienburg without detaching Bohemian land."
 OTB2:0 "Ballei Osterreich"
 OTB2_ADJ:0 "Austrian Bailiwick"
 oe_thh_name_ortolf_von_weisseneck:0 "Ortolf von Weisseneck"
 oe_thh_ballei_seat_2:0 "Vienna Austrian Bailiwick Seat"
 oe_thh_ballei_seat_2_desc:0 "Foreign commandery house of the Teutonic Bailiwick of Austria in Vienna, linking Danubian princely patronage and pilgrim hospices to the Prussian crusade while Vienna stays under Habsburg ownership."
 OTB3:0 "Ballei Brandenburg"
 OTB3_ADJ:0 "Brandenburg Bailiwick"
 oe_thh_name_dietrich_von_witzleben:0 "Dietrich von Witzleben"
 oe_thh_ballei_seat_3:0 "Berlin Brandenburg Bailiwick Seat"
 oe_thh_ballei_seat_3_desc:0 "Northern German commandery seat of the Teutonic Bailiwick of Brandenburg at Berlin, staging Saxon and Brandenburgish knightly volunteers along the road to Marienburg without detaching Margravial land."
 OTB4:0 "Ballei Franken-Mergentheim"
 OTB4_ADJ:0 "Mergentheim Bailiwick"
 oe_thh_name_wolfram_von_nellenburg:0 "Wolfram von Nellenburg"
 oe_thh_ballei_seat_4:0 "Mergentheim Deutschmeister Seat"
 oe_thh_ballei_seat_4_desc:0 "Imperial headquarters of the Master of Germany (Deutschmeister) at Mergentheim in Franconia, coordinating every Teutonic estate, legal privilege, and knightly levy across the Holy Roman Empire."
 OTB5:0 "Ballei Koblenz-Rheinland"
 OTB5_ADJ:0 "Rhineland Bailiwick"
 oe_thh_name_heinrich_von_lonnig:0 "Heinrich von Lonnig"
 oe_thh_ballei_seat_5:0 "Cologne Rhineland Bailiwick Seat"
 oe_thh_ballei_seat_5_desc:0 "Rhenish chamber-bailiwick headquarters of the Teutonic Order in Cologne, drawing wine rents, Rhine river commerce, and noble recruits for the Grand Master while Cologne remains under the Archbishop-Elector."
 oe_teu_ballei:0 "Teutonic HRE Bailiwick"
 oe_teu_ballei_desc:0 "A building-based imperial Bailiwick (Ballei) chartered by the Teutonic Order inside the Holy Roman Empire. It administers foreign commanderies, hospices, and knightly levies from its urban seat without detaching any territorial land from the host prince."
 LEAD_oe_teu_ballei:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_teu_ballei:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_teu_ballei_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_teu_ballei_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_thh_ballei_reform:0 "Imperial Bailiwick Landkomturei"
 oe_thh_ballei_reform_desc:0 "Building-based governance of a Teutonic Landkomtur inside the Holy Roman Empire, sustaining knightly recruitment and hospital revenues from its foreign commandery seat."
 STATIC_MODIFIER_NAME_oe_thh_seat_loyal_mod:0 "Compliant Teutonic Bailiwick"
 STATIC_MODIFIER_DESC_oe_thh_seat_loyal_mod:0 "The local Teutonic Bailiwick works harmoniously with Marienburg, reinforcing civic defenses, trade discipline, and local authority."
 STATIC_MODIFIER_NAME_oe_thh_seat_restive_mod:0 "Restive Teutonic Bailiwick"
 STATIC_MODIFIER_DESC_oe_thh_seat_restive_mod:0 "Disputes between local Teutonic commanders and Marienburg over tithes and exemptions stir mild friction in the city."
 STATIC_MODIFIER_NAME_oe_thh_ballei_compliant_mod:0 "Teutonic Bailiwick: Loyal Commandery"
 STATIC_MODIFIER_DESC_oe_thh_ballei_compliant_mod:0 "This imperial Bailiwick faithfully obeys the Grand Master, dispatching seasoned knights and stipends to the eastern marches."
 STATIC_MODIFIER_NAME_oe_thh_ballei_restive_mod:0 "Teutonic Bailiwick: Localist Drift"
 STATIC_MODIFIER_DESC_oe_thh_ballei_restive_mod:0 "Local commanders prioritize regional estates over Baltic campaigns, slowing administrative coordination with Marienburg."
 STATIC_MODIFIER_NAME_oe_thh_mod_imperial_crusade_grant:0 "Imperial Crusade Grant"
 STATIC_MODIFIER_DESC_oe_thh_mod_imperial_crusade_grant:0 "Imperial subsidies and German guest crusaders authorized by the Emperor support Prussia's campaign morale, manpower, and heavy cavalry at elevated military upkeep."
 STATIC_MODIFIER_NAME_oe_thh_mod_emperor_crusade_patron:0 "Imperial Patron of the Eastern Crusade"
 STATIC_MODIFIER_DESC_oe_thh_mod_emperor_crusade_patron:0 "By underwriting the Teutonic Order's eastern crusade, the Holy Roman Emperor earns towering prestige, diplomatic standing, and ecclesiastical acclaim across Christendom."
 STATIC_MODIFIER_NAME_oe_thh_mod_reichsschild_prince:0 "Reichsschild: Shield of the Empire"
 STATIC_MODIFIER_DESC_oe_thh_mod_reichsschild_prince:0 "Invested as a Prince of the Empire (Reichsfurst) and sworn Shield of the East, the Grand Master deepens imperial diplomacy and Bailiwick loyalty while accepting imperial legal limits on central prerogative."
 STATIC_MODIFIER_NAME_oe_thh_mod_rimini_gross_ordensstaat:0 "Golden Bull of Rimini: Gross-Ordensstaat"
 STATIC_MODIFIER_DESC_oe_thh_mod_rimini_gross_ordensstaat:0 "Invoking the 1226 Golden Bull of Rimini, Marienburg asserts sovereign crusader independence, gaining iron discipline and campaign punch at the price of diplomatic isolation and steep military upkeep."
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_ostsiedlung:0 "Ostsiedlung Land Charter"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_ostsiedlung:0 "The General Chapter's Ostsiedlung land charter invites German farmers and craftsmen into Prussian valleys, boosting population growth, food supply, and steady regional development."
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_fortress_tithe:0 "Baltic Brick Fortress Tithe"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_fortress_tithe:0 "Dedicated fortress tithes approved by the General Chapter harden the red-brick Ordensburg line from Marienburg to Memel and tighten provincial control."
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_preussenreisen:0 "Preussenreisen Crusade Levy"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_preussenreisen:0 "Coordinated Preussenreisen war levies marshal imperial guest knights and Prussian banners alike, bolstering regiment reinforcement, army tradition, and reserves at higher upkeep."
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_amber_compact:0 "Hanseatic Amber Compact"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_amber_compact:0 "A negotiated commercial compact aligns the Order's amber staple with Hanseatic sea lanes, expanding maritime revenue and merchant leverage."
 STATIC_MODIFIER_NAME_oe_thh_mod_pi_hochmeister_charter:0 "Grand Master's Ordensstaat Charter"
 STATIC_MODIFIER_DESC_oe_thh_mod_pi_hochmeister_charter:0 "The General Chapter affirms the Grand Master's supreme administrative charter over the Prussian commanderies, raising crown authority, tax efficiency, and cabinet competence while trimming aristocratic autonomy."
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_chapter_tithe:0 "Commandery Chapel Tithe Exemption"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_chapter_tithe:0 "Confirming commandery chapel exemptions secures clerical votes in the General Chapter while lifting religious standing."
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_baltic_mission:0 "Baltic Frontier Missionaries"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_baltic_mission:0 "Chapter stipends dispatch missionary friars along the Baltic frontier, accelerating heathen conversion and true-faith cohesion."
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_ritter_stipend:0 "Ritterbruder Warhorse Stipends"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_ritter_stipend:0 "Warhorse and armor stipends win noble deputies in the General Chapter while sharpening heavy cavalry readiness."
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_ordensburg_fief:0 "Frontier Ordensburg Wardenships"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_ordensburg_fief:0 "Entrusting frontier keeps to noble wardens fortifies border castles and wins noble backing at a slight cost to central leverage."
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_kulm_towns:0 "Kulm Law Municipal Charter"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_kulm_towns:0 "Reaffirming Kulm Law municipal liberties rallies burgher delegates in the General Chapter and stimulates urban trade."
 STATIC_MODIFIER_NAME_oe_thh_mod_pa_freihufe_grant:0 "Freihufe Homestead Deeds"
 STATIC_MODIFIER_DESC_oe_thh_mod_pa_freihufe_grant:0 "Guaranteeing hereditary Freihufe farmsteads calms rural estates and expands grain yields across the Order's domains."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_diet_subsidy:0 "Imperial Diet Crusade Subsidy"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_diet_subsidy:0 "Funds and volunteer lances voted by the Imperial Diet strengthen Teutonic manpower, morale, and prestige."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_princes_favor:0 "Amber Diplomacy of the Princes"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_princes_favor:0 "Carved Baltic amber relics charm the German courts, lifting diplomatic standing, Bailiwick loyalty, and inland trade."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ostsiedlung_open:0 "Open Gates of Ostsiedlung"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ostsiedlung_open:0 "Five-year tax holidays draw steady waves of Franconian, Rhenish, and Saxon settlers and artisans into Prussian towns, boosting migration and social promotion."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ostsiedlung_vetted:0 "Vetted Catholic Settlement"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ostsiedlung_vetted:0 "Strict parish and guild vetting keeps newly settled Prussian communities orderly, devout, and harmoniously integrated."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ostsiedlung_frontier:0 "Armed Ordensburg Colonists"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ostsiedlung_frontier:0 "Settling German migrants around border Ordensburgen as armed colonists bolsters manpower, fort defense, and frontier control."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_mergentheim_autonomy:0 "Deutschmeister's Franconian Charter"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_mergentheim_autonomy:0 "Confirming the Deutschmeister's autonomy at Mergentheim secures unwavering Bailiwick loyalty and steady German recruitment."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_rhine_franconia_route:0 "Main-Rhine Commandery Trade Corridor"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_rhine_franconia_route:0 "Coordinated stewardship between Mergentheim and Cologne opens a lucrative inland wine-and-amber corridor across Germany."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ehrentisch_knights:0 "Grand Ehrentisch of Marienburg"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ehrentisch_knights:0 "Hosting European guest knights arriving via Prague and Berlin at Marienburg's famed Table of Honor elevates prestige, diplomatic renown, and martial tradition."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_rimini_imperial:0 "Imperial Reading of the Bull of Rimini"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_rimini_imperial:0 "Teutonic jurists highlight the imperial princely rank conferred at Rimini, deepening trust across the German courts and Bailiwicks."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_rimini_sovereign:0 "Sovereign Reading of the Bull of Rimini"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_rimini_sovereign:0 "Marienburg chroniclers proclaim Prussia a sovereign crusader domain answerable to God alone, steeling morale and central authority."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_ballei_rebate:0 "Imperial Bailiwick Tithe Rebate"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_ballei_rebate:0 "Five-year tithe relief wins devoted loyalty and heightened knightly levies across Bohemia, Austria, Brandenburg, Franconia, and the Rhineland."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_brick_castle_fund:0 "Baltic Brick Ordensburg Fund"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_brick_castle_fund:0 "Channeling Austrian and Rhenish commandery surpluses into Vistula and Neman brick castles hardens the entire Baltic defense line."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_generalkapitel_harmony:0 "Concord of the General Chapter"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_generalkapitel_harmony:0 "Balanced statutes agreed inside Marienburg's Grand Refectory elevate parliamentary consent and calm every estate of the Order."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_hochmeister_authority:0 "Martial Primacy of the Grand Master"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_hochmeister_authority:0 "Reasserting the Grand Master's martial prerogative strengthens army morale, devotion, and executive authority at the cost of burgher discontent."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_imperial_hospices:0 "Vienna & Cologne Order Hospices"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_imperial_hospices:0 "Honoring the Order's hospitaller founding, expanded infirmaries in Vienna and Cologne boost epidemic resilience and pious prestige."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_amber_depots:0 "Imperial Highway Amber Depots"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_amber_depots:0 "Converting Vienna and Cologne commandery houses into direct amber and salt depots enriches Teutonic merchants and treasury ledgers."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_elector_ambition:0 "Elector Ambition of the Reichsschild"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_elector_ambition:0 "Leveraging our investiture as Reichsschild across every German diet advances our claim to Elector standing and imperial leadership."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_eastern_bulwark:0 "Imperial Bulwark of the East"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_eastern_bulwark:0 "Devoting our imperial mandate to border fortifications and standing garrisons turns the Baltic marches into an impregnable shield."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_eastward_crusade:0 "Grand Eastward Crusader Drive"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_eastward_crusade:0 "Under the sovereign banner of the Gross-Ordensstaat, Teutonic armies surge eastward with fierce morale, siegecraft, and campaign momentum."
 STATIC_MODIFIER_NAME_oe_thh_mod_ev_sovereign_code:0 "Sovereign Code of the Baltic Order"
 STATIC_MODIFIER_DESC_oe_thh_mod_ev_sovereign_code:0 "Fusing Kulm Law with the Golden Bull of Rimini into a unified imperial code strengthens revenue, stability, and sovereign crown power."
 oe_thh_crusade_foe_tt:0 "Currently at war with a pagan, Orthodox, Islamic, or steppe realm"
 oe_thh_crusade_grant_cd_tt:0 "Has not petitioned for an Imperial Crusade Grant within the last 10 years"
 oe_thh_not_rimini_path_tt:0 "Has not proclaimed the Sovereign Golden Bull of Rimini path"
 oe_thh_not_reichsschild_path_tt:0 "Has not adopted the Reichsschild Imperial Prince path"
 oe_thh_dec_imperial_crusade_grant.title:0 "Petition the Emperor for an Imperial Crusade Grant"
 oe_thh_dec_imperial_crusade_grant.desc:0 "Dispatch envoys from Marienburg to the Holy Roman Emperor while our knights wage holy war against pagan, Orthodox, Islamic, or steppe foes. The Emperor gains prestige, religious standing, and diplomatic acclaim as patron of the crusade, while the Teutonic Order receives a guest-crusader war chest, manpower reserves, and five years of heightened martial vigor."
 oe_thh_dec_imperial_crusade_grant.a:0 "Dispatch Envoys to the Imperial Court"
 oe_thh_dec_imperial_crusade_grant_tt:0 "Grants a guest crusader war chest, #G +0.75#! yearly manpower, #Y Imperial Crusade Grant#! for #Y 5 years#!, and raises Bailiwick loyalty while bestowing #Y Imperial Patron of the Eastern Crusade#! and prestige upon the HRE Emperor."
 oe_thh_dec_reichsschild_path.title:0 "Path I: Proclaim the Reichsschild — Shield of the Empire"
 oe_thh_dec_reichsschild_path.desc:0 "Align the Teutonic Order wholeheartedly with the Holy Roman Empire as a sovereign Prince of the Empire (Reichsfurst). Entering the imperial fold cements our five German Bailiwicks, deepens diplomatic standing across every German court, and opens the constitutional highway toward Elector ambition and seamless Prussian-German imperial leadership. Mutually exclusive with the Golden Bull of Rimini Independence path."
 oe_thh_dec_reichsschild_path.a:0 "Swear as Prince and Shield of the Empire"
 oe_thh_dec_reichsschild_path_tt:0 "Brings our realm into the #Y Holy Roman Empire#!, grants permanent #Y Reichsschild: Shield of the Empire#!, lifts Bailiwick loyalty by #G +15#!, honors the Emperor, and triggers our imperial investiture."
 oe_thh_dec_rimini_independence.title:0 "Path II: Invoke the Golden Bull of Rimini — Gross-Ordensstaat"
 oe_thh_dec_rimini_independence.desc:0 "Invoke Emperor Frederick II's celebrated 1226 Golden Bull of Rimini to proclaim an independent sovereign Eastern Crusader Empire (Gross-Ordensstaat) co-equal with the Holy Roman Emperor. Standing free of imperial diets, Marienburg assumes royal dignity and unleashes maximum martial discipline and eastward expansion drive across the Baltic and Pontic steppes. Mutually exclusive with the Reichsschild path."
 oe_thh_dec_rimini_independence.a:0 "Proclaim the Sovereign Gross-Ordensstaat"
 oe_thh_dec_rimini_independence_tt:0 "Asserts sovereign independence outside HRE jurisdiction, elevates country rank to at least #Y Kingdom#!, grants permanent #Y Golden Bull of Rimini: Gross-Ordensstaat#!, and triggers the sovereign proclamation ceremony."
 oe_thh_dec_convene_generalkapitel.title:0 "Convene the Teutonic General Chapter"
 oe_thh_dec_convene_generalkapitel.desc:0 "Summon the Grand Officers, regional commanders, HRE Bailiwick delegates, and chartered Kulm Law towns to Marienburg's Grand Refectory to establish the Teutonic General Chapter (Generalkapitel) as our standing parliamentary institution."
 oe_thh_dec_convene_generalkapitel.a:0 "Open the Marienburg General Chapter"
 oe_thh_generalkapitel_refresh_tt:0 "Adopts the #Y Teutonic General Chapter#! parliamentary system. If the game is paused when switching parliaments, estate issue proposals refresh automatically at the next monthly tick."
 oe_thh.1.t:0 "Crusade Subsidies at the Imperial Diet"
 oe_thh.1.d:0 "Before the assembled princes and electors of the Holy Roman Empire, envoys from Marienburg recount our knights' tireless winter campaigns along the Baltic marches. Sympathetic imperial counselors propose a formal Diet subsidy, while some Teutonic diplomats favor charming the German courts with finely carved Samland amber gifts instead."
 oe_thh.1.a:0 "Petition the Emperor and Diet for immediate crusade subsidies"
 oe_thh.1.b:0 "Bestow Samland amber gifts upon the German princes and Bailiwicks"
 oe_thh.1.c:0 "Decline imperial charity and uphold Marienburg's self-reliance"
 oe_thh.2.t:0 "Storm in the Empire & the Great Ostsiedlung Wave"
 oe_thh.2.d:0 "Plague, feudal feuds, and ruined harvests across western Germany have sent caravans of Franconian weavers, Rhenish vintners, and Saxon freeholders trekking east toward the Order's disciplined domains. Inside Marienburg, the Grand Hospitaler urges throwing open our gates under Kulm Law, while conservative chapter brothers warn against unchecked migration."
 oe_thh.2.a:0 "Throw open the gates under Kulm Law for settlers and artisans"
 oe_thh.2.b:0 "Enforce strict Catholic doctrinal and guild vetting at every ferry"
 oe_thh.2.c:0 "Settle able-bodied migrants as armed colonists around border castles"
 oe_thh.3.t:0 "Report of the Deutschmeister from Mergentheim"
 oe_thh.3.d:0 "Master of Germany Wolfram von Nellenburg writes from the Order's Franconian stronghold at Mergentheim. Thanks to prudent estate management across the German Bailiwicks, fresh knights and silver rents stand ready—yet Wolfram respectfully reminds Marienburg that the imperial commanderies flourish best when their local charters and Rhenish trade links are respected."
 oe_thh.3.a:0 "Confirm Mergentheim's autonomy to swell German recruitment"
 oe_thh.3.b:0 "Tighten Marienburg's direct audit over Franconian treasuries"
 oe_thh.3.c:0 "Link Mergentheim and Cologne into a Main-Rhine trade corridor"
 oe_thh.4.t:0 "Bohemian and Brandenburg Knights Ride North"
 oe_thh.4.d:0 "Bannerets and young barons escorted by our Bailiwicks in Prague and Berlin have crossed the Vistula with warhorses, siege baggage, and gleaming plate for this season's Preussenreise. Hosting them at Marienburg's legendary Table of Honor (Ehrentisch) will fire knightly renown across Europe, though practical treasurers eye the rich transit tolls."
 oe_thh.4.a:0 "Host the Grand Ehrentisch banquet in Marienburg's refectory"
 oe_thh.4.b:0 "Levy war-chest tolls and muster auxiliary contingents"
 oe_thh.4.c:0 "Send diplomatic gratitude cementing our ties with Prague and Berlin"
 oe_thh.5.t:0 "The 1226 Golden Bull of Rimini Reexamined"
 oe_thh.5.d:0 "In Marienburg's chancery archives, imperial legates and canon lawyers lay bare the parchment of Emperor Frederick II's Golden Bull of Rimini. Did that historic charter bind the Grand Master as a loyal Prince of the Holy Roman Empire—or did it grant Prussia absolute sovereign majesty answerable to God alone? The debate foreshadows the Order's ultimate destiny."
 oe_thh.5.a:0 "Highlight our princely Reichsfurst bond with the Holy Roman Empire"
 oe_thh.5.b:0 "Proclaim Prussia a sovereign crusader realm co-equal with emperors"
 oe_thh.5.c:0 "Maintain deliberate chancery ambiguity and harvest diplomatic calm"
 oe_thh.6.t:0 "Grand Audit of the Five Imperial Bailiwicks"
 oe_thh.6.d:0 "Every fifth winter the Grand Treasurer's visitators inspect the ledgers of our five imperial Bailiwicks—Bohemia, Austria, Brandenburg, Mergentheim, and Koblenz-Rheinland. Strong harvests and busy Rhine vineyards have left healthy surpluses in commandery chests, posing a classic test of statecraft between generous rebates, immediate collection, or Baltic fortress investment."
 oe_thh.6.a:0 "Grant a five-year tithe rebate to cement Bailiwick devotion"
 oe_thh.6.b:0 "Remit all surplus arrears straight to Marienburg's treasury"
 oe_thh.6.c:0 "Channel Austrian and Rhenish surpluses into Baltic brick castles"
 oe_thh.7.t:0 "Convocation of the General Chapter at Marienburg"
 oe_thh.7.d:0 "Beneath the vaulted brick arches of Marienburg's Grand Refectory, the Grand Master presides over the assembled Grossgebietiger, Bailiwick envoys, cathedral canons, and municipal councilors of Kulm and Danzig. Setting the constitutional tone of the General Chapter will determine whether the Ordensstaat governs by balanced estate concord or martial command."
 oe_thh.7.a:0 "Enshrine balanced Chapter Statutes across knights, clergy, and towns"
 oe_thh.7.b:0 "Affirm the Grand Master's supreme martial authority over the Chapter"
 oe_thh.8.t:0 "Hospices of Vienna and Cologne on the Imperial Highways"
 oe_thh.8.d:0 "Our Landkomture in Vienna and Cologne report surging pilgrim traffic and riverborne commerce along the Danube and Rhine. Both cities welcome an expansion of the Order's famed St. Mary's hospices—yet shrewd stewards note that the same waterfront properties could serve as direct Baltic amber and grain depots."
 oe_thh.8.a:0 "Honor our hospitaller roots and endow the Vienna and Cologne hospices"
 oe_thh.8.b:0 "Convert the waterfront estates into direct Baltic amber depots"
 oe_thh.9.t:0 "Investiture as Reichsschild — Shield of the Empire"
 oe_thh.9.d:0 "Trumpets echo across the imperial hall as the Grand Master receives formal investiture as Reichsfurst and Reichsschild—sworn Shield of the Holy Roman Empire in the East. With our five German Bailiwicks jubilant and Prussian envoys seated among the foremost princes of Germany, Marienburg must choose how to wield its newfound imperial majesty."
 oe_thh.9.a:0 "Pursue Elector rank and Prussian-German imperial leadership"
 oe_thh.9.b:0 "Dedicate our imperial mandate to fortifying the eastern marches"
 oe_thh.10.t:0 "Proclamation of the Sovereign Gross-Ordensstaat"
 oe_thh.10.d:0 "Beneath the unfurled black cross and golden imperial eagle atop Marienburg's High Castle, the Grand Master proclaims the sovereign Gross-Ordensstaat by right of the 1226 Golden Bull of Rimini. Answerable to no secular overlord, the Eastern Crusader Empire stands co-equal with emperors and kings—ready either to launch an unstoppable eastward crusade or codify a sovereign Baltic legal order."
 oe_thh.10.a:0 "Unfurl the Grand Crusader Banner for maximum eastward expansion"
 oe_thh.10.b:0 "Codify the Sovereign Law of the Baltic Crusader Empire"
 oe_teu_generalkapitel:0 "Teutonic General Chapter"
 oe_teu_generalkapitel_desc:0 "The supreme yearly assembly of the Grand Master, Grand Officers, HRE Bailiwick Landkomture, and chartered Prussian towns inside Marienburg's Grand Refectory—sharpening martial discipline and fortress defense while giving clergy and knightly estates decisive voice."
 oe_thh_pi_ostsiedlung_charter:0 "Ostsiedlung Land Charter"
 oe_thh_pi_ostsiedlung_charter_desc:0 "Enact a General Chapter settlement charter under Kulm Law, inviting German farmers and village locators to clear Baltic riverlands—boosting population growth, food supply, and steady provincial development while gently curbing noble estate privilege."
 oe_thh_pi_baltic_fortress_tithe:0 "Baltic Fortress Tithe"
 oe_thh_pi_baltic_fortress_tithe_desc:0 "Dedicate ecclesiastical commandery tithes approved by the General Chapter to red-brick Ordensburg bastions and frontier watchtowers, strengthening national defense, fort upkeep efficiency, and provincial control at a modest rural burden."
 oe_thh_pi_preussenreisen_levy:0 "Preussenreisen War Levy"
 oe_thh_pi_preussenreisen_levy_desc:0 "Proclaim a coordinated seasonal crusade levy across all German Bailiwicks and Prussian banners, marshaling regiment reinforcement, army tradition, and manpower reserves at elevated military upkeep."
 oe_thh_pi_hanseatic_amber_compact:0 "Hanseatic Amber Compact"
 oe_thh_pi_hanseatic_amber_compact_desc:0 "Regulate Samland amber harvesting and Baltic grain convoys jointly with Hanseatic port burghers through the General Chapter, expanding sea trade efficiency, trade income, and merchant clout despite conservative clerical grumbling."
 oe_thh_pi_hochmeister_ordensstaat_charter:0 "Grand Master's Ordensstaat Charter"
 oe_thh_pi_hochmeister_ordensstaat_charter_desc:0 "Codify the Grand Master's administrative statutes across Marienburg, the Prussian commanderies, and the German Bailiwicks—elevating crown estate authority, fiscal tax yield, and cabinet efficiency at the cost of minor noble resentment."
 oe_thh_pa_clergy_chapter_tithe:0 "Confirm Commandery Chapel Exemptions"
 oe_thh_pa_clergy_chapter_tithe_desc:0 "Chaplain brothers ask the Grand Master to safeguard parish chapels and hospital endowments from extraordinary war taxes."
 oe_thh_pa_clergy_baltic_mission:0 "Endow Baltic Frontier Missions"
 oe_thh_pa_clergy_baltic_mission_desc:0 "Prelates of Samland and Kulm seek modest crown funds to dispatch missionary friars into newly won border parishes."
 oe_thh_pa_nobles_ritter_stipend:0 "Guarantee Ritterbruder Warhorse Stipends"
 oe_thh_pa_nobles_ritter_stipend_desc:0 "Knight-brothers demand guaranteed remount stipends and armor allowances before casting their Chapter votes."
 oe_thh_pa_nobles_ordensburg_fief:0 "Grant Frontier Ordensburg Wardenships"
 oe_thh_pa_nobles_ordensburg_fief_desc:0 "Regional komture request formal wardenship patents over border castles in exchange for backing the Grand Master's agenda."
 oe_thh_pa_burghers_kulm_towns:0 "Uphold Kulm Law Municipal Privileges"
 oe_thh_pa_burghers_kulm_towns_desc:0 "Councilors of Thorn, Elbing, and Konigsberg pledge parliamentary backing if the Order reaffirms their Kulm Law market liberties."
 oe_thh_pa_peasants_freihufe_grant:0 "Confirm Hereditary Freihufe Farmsteads"
 oe_thh_pa_peasants_freihufe_grant_desc:0 "Free village schulzen ask the General Chapter to guarantee hereditary Freihufe farm leases and ease rural dues."
 oe_thh_cab_kulm_settlement:0 "Kulm Law Ostsiedlung Settlement Charter"
 oe_thh_cab_kulm_settlement_desc:0 "Dispatch a Teutonic locator and charter magistrate under Kulm Law to settle German farmers and artisans in a target province—accelerating cultural assimilation, steady development, and population growth at a modest short-term tax exemption."
