 oe_thh_cab_amber_monopoly:0 "Baltic Amber & Grain Staple Commission"
 oe_thh_cab_amber_monopoly_desc:0 "Empower the Order's Grand Steward (Grossschaffer) to direct Samland amber royalties and Vistula grain exports across Baltic and Hanseatic markets—lifting trade income, tax yield, and sea-trade efficiency while slightly chafing private port merchants."
 oe_thh_cab_amber_monopoly_action:0 "Baltic Amber & Grain Staple Commission"
