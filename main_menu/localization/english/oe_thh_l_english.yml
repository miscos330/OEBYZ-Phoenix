 oe_thh_cab_ordensburg_frontier:0 "Brick Ordensburg Frontier Garrison"
 oe_thh_cab_ordensburg_frontier_desc:0 "Task the Grand Marshal's engineers and garrison komture with reinforcing red-brick Ordensburgen across a border or fortified province—raising fort defense, local max control, and garrison replenishment at slightly higher fort upkeep."
