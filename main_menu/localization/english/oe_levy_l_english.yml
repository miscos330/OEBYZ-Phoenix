 oe_levy.1.title: "The Soldier-Farmers Mustered"
 oe_levy.1.desc: "Across every province, imperial strategoi have convened a thorough muster of the hereditary soldier-farmers, enrolling each household strictly according to its landed allotment. As armoured stratiotai gather on the drill grounds with horses and spears maintained from their fields, the ancient fusion of plough and sword stirs anew."
 oe_levy.1.a: "Plough and sword together"
 oe_levy.2.title: "The Keshig Rides Out"
 oe_levy.2.desc: "At the summons of the throne, the imperial Keshig bodyguard and the battle-hardened frontier vanguards have assembled across the plains. Beneath a forest of yak-tail standards and gleaming lance tips, ten thousand seasoned riders check bowstrings and girths, poised to ride out at the sovereign's command."
 oe_levy.2.a: "Ten thousand riders are ready"
 oe_levy.3.title: "The Streltsy Are Founded"
 oe_levy.3.desc: "Breaking with older feudal levies, the court has recruited hereditary musketeers directly from the townsmen and artisan quarters. Issued heavy matchlock arquebuses, powder flasks, and crescent-bladed bardiches from the state armouries, these Streltsy form a loyal standing infantry corps ready to anchor our battle lines."
 oe_levy.3.a: "Make them a standing corps"
 oe_levy.4.title: "The Cossack Oath"
 oe_levy.4.desc: "Atamans and elders of the free Cossack hosts have ridden in from the steppe borderlands to swear an oath of martial service. Peerless scouts, raiders, and skirmishers along the wild frontier, these fiercely independent horsemen ask only that the crown respect their traditional liberties and riverland charters."
 oe_levy.4.a: "Grant them their liberties"
 oe_levy.5.title: "The Sipahis Reviewed"
 oe_levy.5.desc: "At the call to arms, fief-holding Sipahi horsemen ride into the provincial mustering grounds with the armoured retainers, remounts, and provisions required by their Timar revenue registers. Muster clerks inspect every lance, mail shirt, and mount by the roll to ensure imperial grants yield battle-ready cavalry."
 oe_levy.5.a: "Review them by the register"
 oe_levy.6.title: "The Qizilbash Take the Field"
 oe_levy.6.desc: "Clad in their distinctive crimson twelve-fold caps, tribal horsemen from across the highlands have converged beneath the sacred banner of the order. Raising lances and curved blades in fervent oaths of devotion, the Qizilbash warriors stand ready to unleash their fiery shock charges for faith and crown."
 oe_levy.6.a: "For the order"
 oe_levy.7.title: "The General Levy"
 oe_levy.7.desc: "Royal writs of general mobilization have raced through every palatinate and county, summoning the entire landed nobility to arm and mount. From great magnates to modest squires, the szlachta polish breastplates and lances, riding out with their retainers to defend the realm beneath traditional banners."
 oe_levy.7.a: "Every noble in harness"
 oe_levy.8.title: "Ranks Conferred"
 oe_levy.8.desc: "The imperial chancellery has conferred formal mansab ranks upon the realm's nobility, tying each officer's stipend and prestige directly to a fixed quota of maintained cavalrymen. Bound to keep vetted mounts, armour, and troopers ready for inspection, the empire's commanders are woven into a single disciplined military hierarchy."
 oe_levy.8.a: "Rank fixes the number"
