 oe_levy.1.title: "The Soldier-Farmers Mustered"
 oe_levy.1.desc: "The themes muster their hereditary soldier-farmers again and enrol them by their holdings."
 oe_levy.1.a: "Plough and sword together"
 oe_levy.2.title: "The Keshig Rides Out"
 oe_levy.2.desc: "The guard and the frontier vanguard gather, and their banners cover the plain."
 oe_levy.2.a: "Ten thousand riders are ready"
 oe_levy.3.title: "The Streltsy Are Founded"
 oe_levy.3.desc: "The court raises hereditary musketeers from the townsmen and issues them the arquebus and the long axe."
 oe_levy.3.a: "Make them a standing corps"
 oe_levy.4.title: "The Cossack Oath"
 oe_levy.4.desc: "The free riders of the borderlands offer their service to the throne, asking only to keep their liberties."
 oe_levy.4.a: "Grant them their liberties"
 oe_levy.5.title: "The Sipahis Reviewed"
 oe_levy.5.desc: "The fief-holding horsemen come to the review with the retainers their grants require."
 oe_levy.5.a: "Review them by the register"
 oe_levy.6.title: "The Qizilbash Take the Field"
 oe_levy.6.desc: "The tribal horsemen in red caps swear their oath beneath the banner of the order."
 oe_levy.6.a: "For the order"
 oe_levy.7.title: "The General Levy"
 oe_levy.7.desc: "The king's summons goes out, and the whole nobility arms and mounts."
 oe_levy.7.a: "Every noble in harness"
 oe_levy.8.title: "Ranks Conferred"
 oe_levy.8.desc: "The court fixes each noble's rank and the number of horsemen he must keep."
 oe_levy.8.a: "Rank fixes the number"
