 OE_RW_GERMANY: "Germany"
 OE_RW_GERMANY_DESC: "Cross the Rhine and the Alps, end the empire that claims Rome’s title, and settle the German lands."
 OE_RW_GERMANY_HINT: "Click the map to view actions; close the panel to return to the map."
 OE_HEG_GERMANY_PLAN_REQUIRED: "The invasion of Germany has been planned"
 OE_HEG_GERMANY_CAPITALS_REQUIRED: "Rome militarily occupies the capitals of the emperor and every elector"
 OE_HEG_GERMANY_HALF_REQUIRED: "Rome occupies or directly owns at least 50% of the Holy Roman Empire’s locations"
 OE_HEG_GERMANY_HRE_DESTROYED: "The Roman Emperor has ended the false empire"
 OE_HEG_GERMANY_WAR_NAME: "War to End the False Empire"
 OE_GERMANY_DEFER_LAND: "These lands remain available for the united German settlement; they are not reserved for direct Roman rule."
 oe_heg_germany_plan_desc: "Spend 1,000 gold to add the passable land of northern and southern Germany to the Roman World and unlock the remaining actions."
 oe_heg_germany_plan_effect: "Spend 1,000 gold to add the passable land of northern and southern Germany to the Roman World and unlock the remaining actions."
 oe_heg_germany_invasion_desc: "Spend 50 Political Influence and 5,000 gold to declare war on the emperor and bring every imperial member onto the defending side of one War to End the False Empire. Byzantine subjects within the Empire will also be released and join the defenders."
 oe_heg_germany_invasion_effect: "Spend 50 Political Influence and 5,000 gold to declare war on the emperor and bring every imperial member onto the defending side of one War to End the False Empire. Byzantine subjects within the Empire will also be released and join the defenders."
 oe_heg_germany_end_desc: "Spend 3 Diplomats and 100 gold to dismantle the Holy Roman Empire and transfer all member-owned locations to Rome without granting new cores. Resolve the Hansa, Bohemia, Low Countries, Rhine, Switzerland, Austria and Germany in sequence; rejecting German unity continues with Bavaria, northwestern Germany and northeastern Germany."
 oe_heg_germany_end_effect: "Spend 3 Diplomats and 100 gold to dismantle the Holy Roman Empire and transfer all member-owned locations to Rome without granting new cores. Resolve the Hansa, Bohemia, Low Countries, Rhine, Switzerland, Austria and Germany in sequence; rejecting German unity continues with Bavaria, northwestern Germany and northeastern Germany."
 oe_heg_germany_imperial_war: "End the False Empire"
 oe_heg_germany_imperial_war_desc: "Confront the empire claiming Rome’s title and compel its princes to accept the Roman Emperor’s judgment."
 war_goal_oe_heg_germany_take_capital: "$generic_war_goal_take_capital$"
