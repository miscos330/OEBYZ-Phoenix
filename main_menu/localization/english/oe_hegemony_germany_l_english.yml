 OE_RW_GERMANY_NO_HRE: "No Holy Roman Empire"
 OE_RW_GERMANY_CONTROL_TT: "The total consists of all locations currently belonging to the Holy Roman Empire organization.\nA location counts once if directly owned or militarily controlled by Rome or any direct or indirect subject. Independent allies do not count.\n\nThis is the combined progress of Rome and its subjects. End the False Empire retains its requirements for direct Byzantine occupation of the emperor’s and electors’ capitals and direct Byzantine ownership or occupation of imperial locations."
 oe_church_state_harmony: "Church–State Harmony"
 oe_church_state_harmony_desc: "The Emperor safeguards ecclesiastical order, while patriarchs and priests tend to the imperial people. Crown and Church discharge their duties in harmony, sustaining public peace through their shared faith.\n\nAvailable to Byzantium after completing the Spread Orthodoxy imperial reform. Stability Cost Efficiency +10%, Monthly Religious Influence +0.1 and Clergy Satisfaction +5%."
