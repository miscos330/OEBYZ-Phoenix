 oe_german_parliament: "German Parliament"
 oe_german_parliament_desc: "The parliamentary and administrative seat of a united Germany. Built only in the capital, it employs 1,000 nobles and consumes paper, books and fine cloth. Its national bonuses apply while it is in the capital."
 oe_german_parliament_maintenance: "Parliamentary Administration"
 OE_RW_GERMANY_OPEN: "Click the map to open German actions"
 OE_RW_GERMANY_ACTIONS: "German Actions"
 OE_HEG_GERMANY_ACTIONS_HINT: "After planning the invasion, confront the imperial states in one war and impose a settlement based on military occupation."
 OE_RW_GERMANY_CONTROL_LABEL: "Roman and Subject Control"
