 oe_german_holy_empire: "Holy Roman Empire"
 oe_german_holy_empire_desc: "A German subject empire sharing the Roman sovereign."
 oe_german_kingdom: "Kingdom of Germany"
 oe_german_kingdom_desc: "A united German state with its own sovereign under Roman overlordship."
 oe_germany_netherlands_kingdom: "Kingdom of the Netherlands"
 oe_germany_netherlands_kingdom_desc: "A common crown protects commerce among the lowland cities and sustains their loyalty to Rome."
 oe_german_unification: "A United Germany"
 oe_german_unification_desc: "Bind the German lands together through roads, law and parliament. Unlocks the German Parliament building."
 oe_german_army: "The German Army"
 oe_german_army_desc: "Unify the former princely armies under common training, command and supply. Unlocks the German Army System cabinet action."
 oe_german_army_system: "German Army System"
 oe_german_army_system_desc: "Coordinate marches, training and reinforcements: +10% Army Movement Speed, +5% Discipline and +10% Reinforcement Speed, scaled by Cabinet Efficiency."
