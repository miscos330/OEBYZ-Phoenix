 oe_hegemony_germany.1.t: "The Fate of the Hanseatic League"
 oe_hegemony_germany.1.desc: "The imperial banners have fallen, yet the northern merchants still balance their ledgers. Hanseatic envoys seek to preserve their trading houses and privileges. The Emperor must decide whether this league of contracts and countinghouses has a place in the Roman order."
 oe_hegemony_germany.1.a: "Destroy this mercantile league."
 oe_hegemony_germany.1.b: "Demand their submission."
 oe_hegemony_germany.1.c: "It is beneath our concern."
 oe_hegemony_germany.2.t: "The Fate of Bohemia"
 oe_hegemony_germany.2.desc: "The crown of Prague once sustained the pretender empire. Bohemian and Moravian envoys now petition for a frontier kingdom; others seek to include Silesia and both Lusatias. Rome may instead govern these lands directly, or leave them to a future German settlement."
 oe_hegemony_germany.2.a: "Establish the March of Bohemia."
 oe_hegemony_germany.2.b: "Establish Greater Bohemia."
 oe_hegemony_germany.2.c: "Leave Bohemia to Germany."
 oe_hegemony_germany.2.d: "Bohemia must be governed directly."
 oe_hegemony_germany.3.t: "The Fate of the Low Countries"
 oe_hegemony_germany.3.desc: "Canals, ports and weaving towns bind the Low Countries together. Their merchants ask for a common crown to protect commerce. Others propose a northern march, or direct Roman government throughout the lowlands."
 oe_hegemony_germany.3.a: "Establish a united Kingdom of the Netherlands."
 oe_hegemony_germany.3.b: "Establish the March of the Netherlands."
 oe_hegemony_germany.3.c: "The whole of the Low Countries shall be ours."
 oe_hegemony_germany.4.t: "The Fate of the Rhine"
 oe_hegemony_germany.4.desc: "The legions have returned to the Rhine. The imperial council considers the riverside holdings retained under the former march plans: most of the Rhineland, Mainz, Oppenheim, Worms and the Palatinate apart from Heidelberg. They may become a frontier kingdom, remain under direct Roman rule, or join a united Germany. The broad interior lands of the German princes are outside this Rhine settlement."
 oe_hegemony_germany.4.a: "Establish the March of the Rhine."
 oe_hegemony_germany.4.b: "The Rhine is our natural frontier."
 oe_hegemony_germany.4.c: "Leave these lands to Germany."
 oe_hegemony_germany.5.t: "The Fate of Switzerland"
 oe_hegemony_germany.5.desc: "The Alpine valleys command the roads between Italy and Germany. The communities of Romandy, Switzerland and Raetia defend old privileges, but must now accept a place under direct Roman rule, a frontier crown, or a united Germany."
 oe_hegemony_germany.5.a: "Establish the March of Raetia."
 oe_hegemony_germany.5.b: "We must govern these lands directly."
 oe_hegemony_germany.5.c: "Leave them to a united Germany."
 oe_hegemony_germany.6.t: "The Fate of Austria"
 oe_hegemony_germany.6.desc: "The Danubian lands and the passes into Italy await the Emperor’s judgment. Vienna may serve a new frontier kingdom. Alternatively, Roman officials may take charge, or these lands may be assigned to a future German crown."
 oe_hegemony_germany.6.a: "Establish the March of Austria."
 oe_hegemony_germany.6.b: "We must govern these lands directly."
 oe_hegemony_germany.6.c: "Leave them to a united Germany."
 oe_hegemony_germany.7.t: "The Fate of Germany"
 oe_hegemony_germany.7.desc: "Electoral seals and princely oaths no longer uphold the old order. The remaining German lands need a lasting settlement: a Holy Roman Empire under the Roman Emperor, a German kingdom with its own ruler, or a permanent division. Lands already reserved for direct Roman government are excluded."
 oe_hegemony_germany.7.a: "Establish a united Holy Roman Empire."
 oe_hegemony_germany.7.b: "Establish a united Kingdom of Germany."
 oe_hegemony_germany.7.c: "Germany must never unite!"
 oe_hegemony_germany.8.t: "The Fate of Bavaria"
 oe_hegemony_germany.8.desc: "The princes and towns of southern Germany await their settlement. Bavaria, Swabia and Franconia may form a frontier kingdom loyal to Rome. Direct government will instead place their administrative burdens and resistance upon the Empire."
 oe_hegemony_germany.8.a: "Establish the March of Bavaria."
 oe_hegemony_germany.8.b: "We must govern Bavaria directly."
 oe_hegemony_germany.9.t: "The Fate of Northwestern Germany"
 oe_hegemony_germany.9.desc: "From Westphalia to Lower Saxony, trading roads cross a patchwork of former lordships. A new march bearing Hanover’s name could unite them. Direct Roman rule would instead inherit their unsettled obligations and disputes."
 oe_hegemony_germany.9.a: "Establish the March of Hanover."
 oe_hegemony_germany.9.b: "We must govern directly."
 oe_hegemony_germany.10.t: "The Fate of Northeastern Germany"
 oe_hegemony_germany.10.desc: "The lands east of the Elbe and the Baltic ports form the final part of the settlement. Brandenburg may anchor a frontier kingdom linking Saxony to the northern coast. Without such a crown, Rome must uphold order in these distant lands itself."
 oe_hegemony_germany.10.a: "Establish the March of Brandenburg."
 oe_hegemony_germany.10.b: "We must govern directly."
