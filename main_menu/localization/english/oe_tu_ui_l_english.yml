 # NEW 2026-11-18 third round N1 (generated by gen_round3_ui.py)
 mapmode_oe_tu_status_name: "Provinces and Subjects"
 MAPMODE_OE_TU_STATUS: "#T $mapmode_oe_tu_status_name$#!\nLand the empire rules directly takes the colour of its province's [oe_tu_status|e]: heartland purple, [Concept('oe_tu_march','march')|e] orange-red, [Concept('oe_tu_exarchate','exarchate')|e] amber, [Concept('oe_tu_charter','chartered city')|e] teal, despotate rose; direct land without a province is stone, and province seats are striped.\nLand of the empire's subjects takes the colour of the subject type: Roman allies blue, [Concept('oe_tu_provincialise','provincialised')|e] subjects sky blue, Roman marches olive, regional kingdoms green, the Imperial Domain of Egypt tan, other subjects slate.\nEverything else is dark grey."
 LEGEND_KEY_OE_TU_S1: "Province: Heartland"
 LEGEND_KEY_OE_TU_S2: "Province: March"
 LEGEND_KEY_OE_TU_S3: "Province: Exarchate"
 LEGEND_KEY_OE_TU_S4: "Province: Chartered city"
 LEGEND_KEY_OE_TU_S5: "Province: Despotate"
 LEGEND_KEY_OE_TU_SEAT: "Province seat (stripes)"
 LEGEND_KEY_OE_TU_BYZ: "Ruled directly, no province"
 LEGEND_KEY_OE_TU_V_ALLY: "Subject: Roman ally"
 LEGEND_KEY_OE_TU_V_PROV: "Subject: Provincialised subject"
 LEGEND_KEY_OE_TU_V_MARCH: "Subject: Roman march"
 LEGEND_KEY_OE_TU_V_KINGDOM: "Subject: Regional kingdom"
 LEGEND_KEY_OE_TU_V_EGYPT: "Subject: Imperial Domain of Egypt"
 LEGEND_KEY_OE_TU_V_OTHER: "Subject: other type"
 LEGEND_KEY_OE_TU_NONE: "Other countries and empty land"
 game_concept_oe_tu_status: "Status"
 game_concept_oe_tu_status_desc: "The empire's provinces were never all alike: after the tenth-century reconquests in the east the frontier was held in doukata; Ravenna and Carthage were [Concept('oe_tu_exarchate','exarchates')|e]; from 1349 the Morea was the appanage of an imperial prince.\n\nEvery province here has one of five statuses: heartland, [Concept('oe_tu_march','march')|e], exarchate, [Concept('oe_tu_charter','chartered city')|e] or despotate. The status changes the five office lines, the loyalty target (march #R −10#!, exarchate #R −10#!, chartered city #R −5#!, despotate #G +5#!), the rank name and the governor's title. An exarchate sends #Y 10%#! of its monthly income to the treasury and a despotate #Y 5%#!; a chartered city pays #R 15%#! of its tax base and sends no troops.\n\nThe Themes tab of the Pillars of the Empire shows the status under each province's name; hover it for the exact numbers. The map mode Provinces and Subjects colours the map by status."
 game_concept_oe_tu_course: "Course"
 game_concept_oe_tu_course_desc: "Themes began as military districts whose strategos held both military and civil command; by the Palaiologan age the great themes were long gone and kephalai governed smaller katepanikia.\n\nThe course is the direction a province is run in. Army: military #G +15#!; navy: military #G +10#!, finance #G +5#!, and the seat must be on the coast; civil: civil #G +10#!, justice #G +5#!, finance #G +5#!, loyalty target #G +5#!. Army and navy provinces join the empire's wars, civil ones do not. Changing the course costs #R 5#! [oe_tu_authority|e] and cannot be repeated for #Y 5#! years; a [Concept('oe_tu_march','march')|e] cannot turn civil, and Latin [Concept('oe_tu_exarchate','exarchates')|e] and [Concept('oe_tu_charter','chartered cities')|e] cannot change.\n\nThe Themes tab shows the course after the status; hover it for the exact numbers. The Course button on the province card changes it."
 game_concept_oe_tu_fiscal: "Fiscal Regime"
 game_concept_oe_tu_fiscal_desc: "The fiscal regime decides who collects a province's taxes. It is set under Staff on the province card; after a change the staff cannot change again for #Y 2#! years.\n\nStrategos: finance #G +5#!, at no cost to the treasury. Central fiscal officer: finance #G +15#!, loyalty target #G +5#!; the treasury pays #R 0.2#! gold a month per jurisdiction location. Tax farm: justice #R −10#!, finance #G +10#!, loyalty target #R −5#!; the province gains #Y 0.5#! gold a month per jurisdiction location and its land develops more slowly. Land grants ([oe_tu_pronoia|e]): military #G +10#!, loyalty target #G +5#!; finance is #Y 5#! lower than under the strategos.\n\nFinance, on the second line of each province card in the Themes tab, shows the regime; hover it for the exact numbers."
 game_concept_oe_tu_senate: "Senate"
 game_concept_oe_tu_senate_desc: "#F The Byzantine senate lasted into the Palaiologan age, but by then it was a body of the highest dignitaries of the capital, not of delegates from the provinces.#! Seats for [Concept('oe_tu_charter','chartered cities')|e], [Concept('oe_tu_exarchate','exarchates')|e] and despotates are a game invention, modelled on the town councils of Roman municipia and of the Italian city communes.\n\n#Y Institutional Distinction#!: The #Y Imperial Senate#! is the Roman legislative and provincial-chartering assembly voting on four bills—an extra levy, a war levy, [Concept('oe_tu_provincialise','provincialisation')|e], and granting Roman law. It is distinct from the #Y Pillars of the Empire#! (the imperial governance organization hub) and the #Y East Roman Imperial Council#! (the domestic parliamentary council of clerical and burgher estates).\n\nSeats: #Y 2#! for each chartered city, #Y 1#! each for an exarchate and a despotate, #Y 1#! for every house on the roll and #Y 1#! for every court officer in office.\nVotes: provinces score by loyalty and status (chartered cities oppose levies), houses by influence and by whether they are the emperor's political ally, officials by their loyalty to the emperor and the satisfaction of their estate; a seat whose score reaches #Y 50#! votes for, and a bill passes with more seats for than against.\nForcing a bill: a failed bill can be forced through for #R 5#! [oe_tu_authority|e]; every province that voted against loses #R 10#! loyalty (in the loyalty target for #Y 5#! years) and every house that voted against loses #Y 25#! influence.\nPreview: the Imperial Senate preview card on the Pillars of the Empire Overview and each issue's description estimate live seats for and against; the count at the vote decides.\n\nVotes come as the event A Vote in the Senate. The emperor asks for a levy from the Pillars of the Empire; making a province, granting Roman law and the war levy at the start of a campaign also go to a vote."
 game_concept_oe_tu_kephale: "Katholike Kephale"
 game_concept_oe_tu_kephale_desc: "In the fourteenth century the empire set katholikai kephalai over groups of katepanikia, usually relatives of the emperor or sons of great families. By the end of the century the post was gone, replaced by despotates held by princes.\n\nThe empire has eight great regions. A region with at least #Y 2#! provinces and no kephale can get one for #R 3#! [oe_tu_authority|e]; while the kephale holds office every province of the region has loyalty target #G +5#! and #G +5#! on each of the five office lines. A kephale whose house has #Y 500#! influence, or who governs #Y 4#! or more provinces with an ability of #Y 70#! or more, grows overmighty and may ignore orders (loyalty target #R −5#! meanwhile) or ask for the region as an appanage. Dismissing an overmighty kephale costs the region's provinces #Y 5#! loyalty and the kephale's house #Y 50#! influence.\n\nAppoint one with Appoint a Katholike Kephale in the Pillars of the Empire, and remove him with Dismiss a Katholike Kephale."
 game_concept_oe_tu_family: "Family of Kings"
 game_concept_oe_tu_family_desc: "In the protocol of the court at Constantinople the emperor was the father of a family of kings; other rulers were called his sons, brothers or friends, by how close they stood.\n\nThe empire's subjects and the members of the Roman Cultural Sphere have a rank. Son: Orthodox or Miaphysite subjects, and the princes and Orthodox kingdoms of the Roman Cultural Sphere; brother: the Holy Roman Empire and Persian Empire subject types; friend: everyone else. A son's opinion of the empire #G +25#!, the empire's of it #G +10#!, its monthly prestige #G +0.02#!; a brother #Y +15#!, #Y +10#!, #Y +0.05#!; a friend #Y +10#!, #Y +5#!, #Y +0.01#!. Ranks are renewed every #Y 6#! months.\n\nThe Rank column of the Vassals tab in the Pillars of the Empire shows it; the rank decides which [oe_tu_dignities|e] a ruler can receive."
 game_concept_oe_tu_dignity: "Court Dignity"
 game_concept_oe_tu_dignity_desc: "Emperors often conferred court dignities on foreign rulers: Manuel I created the title of despot in 1163 for the Hungarian prince Béla.\n\nThe emperor can confer four dignities on reigning adult rulers of the [oe_tu_family|e]: despot (sons only, at most #Y 2#! at once); sebastokrator (sons only, at most #Y 2#! at once); kaisar (any rank, at most #Y 1#! at once); protosebastos (any rank, at most #Y 3#! at once). They cost prestige #R −20#!, #R −15#!, #R −15#!, #R −10#! and [oe_tu_authority|e] #R −8#!, #R −6#!, #R −10#!, #R −4#! in that order. The honoured country's opinion of the empire rises by #G +40#!, #G +30#!, #G +30#!, #G +25#!, fading #Y 2#! a year, with #G +10#! more while the ruler lives; a subject of the empire also gains loyalty #G +15#!, #G +12#!, #G +12#!, #G +8#!. A country can be honoured once every #Y 5#! years; a dignity is for life and does not pass to the successor. Some events make exceptions: a Latin lord of Ioannina may be made a despot, and the successor of a despot may send envoys to ask for the title again.\n\nConfer them with Confer a Court Dignity in the Roman Cultural Sphere panel; the Vassals tab of the Pillars of the Empire shows them too."
 game_concept_oe_tu_provincialise: "Provincialisation"
 game_concept_oe_tu_provincialise_desc: "Rome often turned client kingdoms into provinces: Tiberius made Cappadocia a province in #Y 17#! AD after the death of its last king, and Basil II set up the theme of Bulgaria on the conquered kingdom in 1018.\n\nA provincialised subject of 120 months (each refused muster adds #Y 5#! years), with an opinion of the empire of at least #Y 70#! or a ruler installed by the emperor, and a primary culture of the Roman group or the Orthodox faith, can be put forward for #R 10#! [oe_tu_authority|e]; the [oe_tu_senate|e] votes on it. If it passes, the subject is annexed and its land becomes #Y 1#! province, #Y 2#! with #Y 12#! or more locations, #Y 3#! with #Y 30#! or more; a province bordering a country outside the Byzantine bloc becomes a [Concept('oe_tu_march','march')|e], otherwise an [Concept('oe_tu_exarchate','exarchate')|e]. If it fails, it cannot be put forward again for #Y 5#! years and the subject's opinion of the empire changes by #R −20#!. The Imperial Domain of Egypt needs none of these conditions.\n\nStart it with the edict Make a Province in the Pillars of the Empire; the Vassals tab shows how far each subject is from it."
 game_concept_oe_tu_pronoia: "Pronoia"
 game_concept_oe_tu_pronoia_desc: "A pronoia was a grant of the revenue of a piece of land in place of a salary, at first revocable; Manuel I extended it to officers, and after 1261 Michael VIII made it inheritable.\n\nOnce the empire has the vanilla pronoia law (or the Komnenian formalization, Palaeologan hereditary transition or reformed pronoia that follow it), land grants appear under Staff on the province card: military #G +10#!, loyalty target #G +5#!; finance is #Y 5#! lower than under the strategos; manpower and levies of the province and its land #Y +10%#! to #Y +20%#! by the law in force; a strategos born into a house gives it #Y +5#! influence a year. After #Y 20#! years a grant can become hereditary; revoking a hereditary grant costs #R 15#! loyalty (#R 20#! under the Palaeologan law, #R 10#! under reformed pronoia).\n\nFinance in the Themes tab then reads Pronoia; hover it for the exact numbers."
 game_concept_oe_tu_authority: "Imperial Authority"
 game_concept_oe_tu_authority_desc: "The core reading of the Pillars of the Empire, between #Y 0#! and #Y 100#!: #Y 25#! at the 1337 start, falling by #Y 0.2#! a month on its own.\n\nMost actions in this mod cost Imperial Authority, for example founding themes, changing a course, appointing a [oe_tu_kephale|e], declaring a campaign and making provinces ([oe_tu_provincialise|e]).\n\nOn the Imperial Finances tab of the Pillars of the Empire, a grant for upholding authority turns the [oe_tu_purse|e] into Imperial Authority: spending the purse's whole monthly income gives at most #G +0.5#! a month. The overview of the Pillars of the Empire shows the current value."
 game_concept_oe_tu_purse: "Privy Purse"
 game_concept_oe_tu_purse_desc: "The emperor's own chest, kept apart from the treasury. The court nobility holds #Y 15%#! of the nobles' income and the higher clergy #Y 5%#! of the clergy's; both shares go into the purse every month.\n\nThe purse pays for upholding [oe_tu_authority|e] and for favours such as Bread and Circuses and Reward Loyal Officials. Treasury gold can be moved in with Deposit into the Privy Purse under Fiscal Orders, for #R 1#! legitimacy each time.\n\nThe Imperial Finances tab of the Pillars of the Empire shows what goes in and out."
 game_concept_oe_tu_march: "March"
 game_concept_oe_tu_march_desc: "A province bordering a country outside the Byzantine bloc; one of the five province statuses ([oe_tu_status|e]). Loyalty target #R −10#!, land morale and reinforcement speed #G +10%#! each, no tribute.\n\nWhen a province starts to border a foreign country, an event offers to make it a march; a march that used to be heartland can return to heartland after some years without a foreign border. A march cannot take the civil course and is exposed to border-threat events.\n\nThe Themes tab shows the status under each province's name."
 game_concept_oe_tu_exarchate: "Exarchate"
 game_concept_oe_tu_exarchate_desc: "A distant or newly made province; one of the five province statuses ([oe_tu_status|e]). Loyalty target #R −10#!, land morale #G +5%#!, #Y 10%#! of its monthly income sent as tribute, and #Y 1#! seat in the [oe_tu_senate|e].\n\nProvinces made from subjects ([oe_tu_provincialise|e]) that do not border a foreign country usually become exarchates; a Latin exarchate cannot change its course.\n\nThe Themes tab shows the status under each province's name."
 game_concept_oe_tu_charter: "Chartered City"
 game_concept_oe_tu_charter_desc: "A city holding a charter; one of the five province statuses ([oe_tu_status|e]), mostly in Italy. Loyalty target #R −5#!, pays #Y 15%#! of its tax base, sends no troops, holds #Y 2#! seats in the [oe_tu_senate|e] and votes against extra levies.\n\nA chartered city cannot change its course and refuses land surveys.\n\nThe Themes tab shows the status under each province's name."
 game_concept_oe_tu_church_parties: "Church Parties"
 game_concept_oe_tu_church_parties_desc: "#F From 1341 the Byzantine Church was divided by the hesychast controversy. Palamas and the monks around Palamas held that a monk at prayer could see the uncreated light of God; Barlaam, Akindynos, Gregoras and the Kydones brothers opposed them, and many of the opponents later argued for union with Rome.#!\n\nHere the Church has three parties whose shares add up to #Y 100#!: the Hesychasts (the monks of Mount Athos and the followers of Palamas), the Rationalists (the scholars of the court and the schools) and the Unionists (who would unite with Rome in return for help from the West). In history the last two overlapped a good deal; they are kept apart here to keep the reading clear.\n\nThe largest party prevails if it holds at least #Y 40#! and leads the next by #Y 5#! or more, and the empire gets that party's modifier; another party takes over only #Y 8#! ahead. Every January the shares drift: the sitting patriarch's party #Y +2#!; the Hesychasts rise while the empire holds Mount Athos and fall when it does not; help sought in the West, the scandal of the emperor's submission to the Pope, a Latinising or Hellenising society and vassalage to the sultan each push one party; a party above #Y 60#! slips back.\n\nWhen a patriarch dies and a successor is chosen: a monk of Mount Athos is of the Hesychasts; a churchman of the cabinet is of the Rationalists (of the Unionists while union is being negotiated); a monk of Constantinople is of the prevailing party (of the Hesychasts when none prevails). When a council or a new ruler empties the see, the Holy Synod puts forward candidates; choosing one not of the prevailing party costs [oe_tu_authority|e] and angers the faithful.\n\nThe monastic lands stand at one of four levels, each with its modifier: exempt (chrysobulls free the monasteries from tax), customary, half held as [Concept('oe_tu_pronoia','pronoia')|e] (half the estates go to soldiers) or confiscated. While the empire holds Mount Athos and the lands are exempt or customary, the Hesychasts gain #Y 2#! a year; with all the lands confiscated they lose #Y 3#! a year. From about 1371 a handful of events change the level.\n\nHold a Holy Synod in the Pillars of the Empire to see the shares and to push one party."
 game_concept_oe_tu_patriarchate: "Patriarchal Standing"
 game_concept_oe_tu_patriarchate_desc: "#F As the empire weakened in the fourteenth century, the Ecumenical Patriarch of Constantinople still consecrated the metropolitans of Rus', Lithuania, Wallachia and Moldavia. That standing was one of the empire's last holds on the Orthodox world.#!\n\nPatriarchal standing runs from #Y 0#! to #Y 100#!, starts at #Y 50#! and moves #Y 2#! towards its target every January. The target is #Y 30#!; #G +5#! for each see in our care or autocephalous; #G +10#! while the Hesychasts hold #Y 45#! or more (their monks travel the Balkans and Rus'); #G +5#! with the Ecumenical Patriarch policy; #R −10#! once union is proclaimed or while the scandal of the emperor's submission to the Pope lasts; #R −5#! for each see that broke away. Councils, the reconciliation with the Serbian and Bulgarian Churches and a successful council of Rus' also move it directly.\n\nAt #Y 70#! or more the empire gains Patriarch of the Nations; below #Y 40#!, The Patriarch Goes Unheard.\n\nSix sees are recorded: Rus', Lithuania, Wallachia, Moldavia, Serbia and Tarnovo, each none, in our care, disputed, autocephalous or broken away. Serbia and Tarnovo are updated every January from the state of their Churches.\n\nHold a Holy Synod in the Pillars of the Empire to see the standing and the sees."
 game_concept_oe_tu_dignities: "Court Dignities"
 oe_tu_tt_status_1: "[oe_tu_status|e]: #Y Heartland#!\nImperial heartland; the emperor appoints and dismisses its governor.\nOffices: Military #Y +0#!, Civil #Y +0#!, Justice #Y +0#!, Finance #Y +0#!, Works #Y +0#!\nLoyalty target #Y +0#!\nStatus modifier: loyalty to overlord #G +5#!"
 oe_tu_tt_status_2: "[oe_tu_status|e]: #Y March#!\nA province on a foreign border. One that was heartland returns to it after #Y 5#! years without a foreign border; others need Roman law.\nOffices: Military #G +5#!, Civil #R −5#!, Justice #Y +0#!, Finance #R −5#!, Works #G +5#!\nLoyalty target #R −10#!\nStatus modifier: land morale #G +10%#!, reinforcement speed #G +10%#!, loyalty to overlord #R −5#!"
 oe_tu_tt_status_3: "[oe_tu_status|e]: #Y [oe_tu_exarchate|e]#!\nDistant land; Roman law can make it heartland. #Y 1#! seat in the [Concept('oe_tu_senate','senate')|e].\nOffices: Military #Y +0#!, Civil #R −5#!, Justice #R −5#!, Finance #Y +0#!, Works #Y +0#!\nLoyalty target #R −10#!\nStatus modifier: land morale #G +5%#!, loyalty to overlord #R −5#!\nTribute: #Y 10%#! of the monthly income each month, more under a senate levy."
 oe_tu_tt_status_4: "[oe_tu_status|e]: #Y [Concept('oe_tu_charter','Chartered city')|e]#!\nSelf-governed by its own council; Roman law can make it heartland.\nOffices: Military #R −10#!, Civil #Y +0#!, Justice #Y +0#!, Finance #G +10#!, Works #Y +0#!\nLoyalty target #R −5#!\nStatus modifier: loyalty to overlord #R −5#!\nTribute: #Y 15%#! of the tax base; sends no troops; #Y 2#! seats in the [Concept('oe_tu_senate','senate')|e]."
 oe_tu_tt_status_5: "[oe_tu_status|e]: #Y Despotate#!\nA despotate of the inner circle, held by a member of the imperial house; its ruler is a despot and counts as holding the dignity of despot, without taking one of the places given to foreign rulers. #Y 1#! seat in the [Concept('oe_tu_senate','senate')|e]. Epirus, Ioannina and the other subjects named despotates on the vassals tab are landed allies, not despotates of the imperial house.\nOffices: Military #Y +0#!, Civil #G +5#!, Justice #Y +0#!, Finance #Y +0#!, Works #Y +0#!\nLoyalty target #G +5#!\nStatus modifier: loyalty to overlord #G +10#!, land morale #G +5%#!\nTribute: #Y 5%#! of the monthly income each month, more under a senate levy."
 oe_tu_tt_status_none: "[oe_tu_status|e]: not set yet; the next month sets it from the province type."
 oe_tu_tt_course_latin: "[oe_tu_course|e]: #Y Army#!\nOffices: Military #G +15#!, Civil #Y +0#!, Justice #Y +0#!, Finance #Y +0#!, Works #Y +0#!\nLoyalty target #Y +0#!\nJoins the empire's wars.\nA Latin [Concept('oe_tu_exarchate','exarchate')|e] cannot change course."
 oe_tu_tt_course_army: "[oe_tu_course|e]: #Y Army#!\nOffices: Military #G +15#!, Civil #Y +0#!, Justice #Y +0#!, Finance #Y +0#!, Works #Y +0#!\nLoyalty target #Y +0#!\nJoins the empire's wars.\nChanging the course costs #R 5#! [oe_tu_authority|e] and cannot be repeated for #Y 5#! years."
 oe_tu_tt_course_navy: "[oe_tu_course|e]: #Y Navy#!\nOffices: Military #G +10#!, Civil #Y +0#!, Justice #Y +0#!, Finance #G +5#!, Works #Y +0#!\nLoyalty target #Y +0#!\nJoins the empire's wars; the seat must be on the coast.\nChanging the course costs #R 5#! [oe_tu_authority|e] and cannot be repeated for #Y 5#! years."
 oe_tu_tt_course_civil: "[oe_tu_course|e]: #Y Civil#!\nOffices: Military #Y +0#!, Civil #G +10#!, Justice #G +5#!, Finance #G +5#!, Works #Y +0#!\nLoyalty target #G +5#!\nDoes not join the empire's wars; a [Concept('oe_tu_march','march')|e] cannot take this course.\nChanging the course costs #R 5#! [oe_tu_authority|e] and cannot be repeated for #Y 5#! years."
 oe_tu_tt_course_charter: "[oe_tu_course|e]: #Y Self-rule#!\nOffices: Military #Y +0#!, Civil #G +10#!, Justice #Y +0#!, Finance #G +5#!, Works #Y +0#!\nLoyalty target #Y +0#!\nSends no troops; the course cannot change."
 oe_tu_tt_course_none: "[oe_tu_course|e]: this province type has no course bonus."
 oe_tu_tt_fiscal_1: "[oe_tu_fiscal|e]: #Y Central#!\nOffices: Military #Y +0#!, Civil #Y +0#!, Justice #Y +0#!, Finance #G +15#!, Works #Y +0#!\nLoyalty target #G +5#!\nThe treasury pays #R 0.2#! gold a month per jurisdiction location in salary."
 oe_tu_tt_fiscal_2: "[oe_tu_fiscal|e]: #Y Tax farm#!\nOffices: Military #Y +0#!, Civil #Y +0#!, Justice #R −10#!, Finance #G +10#!, Works #Y +0#!\nLoyalty target #R −5#!\nThe province gains #Y 0.5#! gold a month per jurisdiction location; its land's monthly development #R −0.005#!."
 oe_tu_tt_fiscal_3: "[oe_tu_fiscal|e]: #Y [oe_tu_pronoia|e]#!\nOffices: Military #G +10#!, Civil #Y +0#!, Justice #Y +0#!, Finance #Y +0#!, Works #Y +0#!\nLoyalty target #G +5#!\nFinance is #Y 5#! lower than under the strategos. Manpower and levies of the province and its land #Y +10%#! to #Y +20%#! by the pronoia law in force; after #Y 20#! years the grant can become hereditary."
 oe_tu_tt_fiscal_0: "[oe_tu_fiscal|e]: #Y Strategos#!\nOffices: Military #Y +0#!, Civil #Y +0#!, Justice #Y +0#!, Finance #G +5#!, Works #Y +0#!\nLoyalty target #Y +0#!\nThe strategos collects the taxes: no cost to the treasury, but the strategos answers to no one."
 OE_TU_CARD_STATUS_TT: "[Country.Custom('OeTuStatusTT')]"
 OE_TU_CARD_COURSE_TT: "[Country.Custom('OeTuCourseTT')]"
