 mapmode_oe_tu_status_name: "Provinces and Subjects"
 MAPMODE_OE_TU_STATUS: "#T $mapmode_oe_tu_status_name$#!\nLand the empire rules directly takes the colour of its province's [oe_tu_status|e]: heartland purple, march orange-red, exarchate amber, chartered city teal, despotate rose; direct land without a province is stone, and province seats are striped.\nLand of the empire's subjects takes the colour of the subject type: Roman allies blue, provincialised subjects sky blue, Roman marches olive, regional kingdoms green, the Imperial Domain of Egypt tan, other subjects slate.\nEverything else is dark grey."
