 game_concept_oe_tu_status: "Status"
 game_concept_oe_tu_status_desc: "The empire's provinces were never all alike: after the tenth-century reconquests in the east the frontier was held in doukata; Ravenna and Carthage were exarchates; from 1349 the Morea was the appanage of an imperial prince.\n\nEvery province here has one of five statuses: heartland, march, exarchate, chartered city or despotate. The status changes the five office lines, the loyalty target (march -10, exarchate -10, chartered city -5, despotate +5), the rank name and the governor's title. An exarchate sends 10% of its monthly income to the treasury and a despotate 5%; a chartered city pays 15% of its tax base and sends no troops.\n\nThe Themes tab of the Pillars of the Empire shows the status under each province's name; hover it for the exact numbers. The map mode Provinces and Subjects colours the map by status."
 game_concept_oe_tu_course: "Course"
 game_concept_oe_tu_course_desc: "Themes began as military districts whose strategos held both military and civil command; by the Palaiologan age the great themes were long gone and kephalai governed smaller katepanikia.\n\nThe course is the direction a province is run in. Army: military +15; navy: military +10, finance +5, and the seat must be on the coast; civil: civil +10, justice +5, finance +5, loyalty target +5. Army and navy provinces join the empire's wars, civil ones do not. Changing the course costs 5 Imperial Authority and cannot be repeated for 5 years; a march cannot turn civil, and Latin exarchates and chartered cities cannot change.\n\nThe Themes tab shows the course after the status; hover it for the exact numbers. The Course button on the province card changes it."
 game_concept_oe_tu_fiscal: "Fiscal Regime"
 game_concept_oe_tu_fiscal_desc: "The fiscal regime decides who collects a province's taxes. It is set under Staff on the province card; after a change the staff cannot change again for 2 years.\n\nStrategos: finance +5, at no cost to the treasury. Central fiscal officer: finance +15, loyalty target +5; the treasury pays 0.2 gold a month per jurisdiction location. Tax farm: justice -10, finance +10, loyalty target -5; the province gains 0.5 gold a month per jurisdiction location and its land develops more slowly. Land grants ([oe_tu_pronoia|e]): military +10, loyalty target +5; finance is 5 lower than under the strategos.\n\nFinance, on the second line of each province card in the Themes tab, shows the regime; hover it for the exact numbers."
 game_concept_oe_tu_senate: "Senate"
 game_concept_oe_tu_senate_desc: "The Byzantine senate lasted into the Palaiologan age, but by then it was a body of the highest dignitaries of the capital, not of delegates from the provinces. Seats for chartered cities, exarchates and despotates are a game invention, modelled on the town councils of Roman municipia and of the Italian city communes.\n\nThe senate votes on four issues: an extra levy, a war levy, making a province, and granting Roman law. A chartered city has 2 seats, an exarchate and a despotate 1 each, every house on the roll 1 and every court officer in office 1; a seat whose score reaches 50 votes for, and a bill passes with more seats for than against. A failed bill can be forced through: 5 Imperial Authority, every province that voted against loses 10 loyalty (in the loyalty target for 5 years) and every house that voted against loses 25 influence.\n\nVotes come as the event A Vote in the Senate. The emperor asks for a levy from the Pillars of the Empire; making a province, granting Roman law and the war levy at the start of a campaign also go to a vote."
 game_concept_oe_tu_kephale: "Katholike Kephale"
 game_concept_oe_tu_kephale_desc: "In the fourteenth century the empire set katholikai kephalai over groups of katepanikia, usually relatives of the emperor or sons of great families. By the end of the century the post was gone, replaced by despotates held by princes.\n\nThe empire has eight great regions. A region with at least 2 provinces and no kephale can get one for 3 Imperial Authority; while the kephale holds office every province of the region has loyalty target +5 and +5 on each of the five office lines. A kephale whose house has 500 influence, or who governs 4 or more provinces with an ability of 70 or more, grows overmighty and may ignore orders (loyalty target -5 meanwhile) or ask for the region as an appanage. Dismissing an overmighty kephale costs the region's provinces 5 loyalty and the kephale's house 50 influence.\n\nAppoint one with Appoint a Katholike Kephale in the Pillars of the Empire, and remove him with Dismiss a Katholike Kephale."
 game_concept_oe_tu_family: "Family of Kings"
 game_concept_oe_tu_family_desc: "In the protocol of the court at Constantinople the emperor was the father of a family of kings; other rulers were called his sons, brothers or friends, by how close they stood.\n\nThe empire's subjects and the members of the Roman Cultural Sphere have a rank. Son: Orthodox or Miaphysite subjects, and the princes and Orthodox kingdoms of the Roman Cultural Sphere; brother: the Holy Roman Empire and Persian Empire subject types; friend: everyone else. A son's opinion of the empire +25, the empire's of it +10, its monthly prestige +0.02; a brother +15, +10, +0.05; a friend +10, +5, +0.01. Ranks are renewed every 6 months.\n\nThe Rank column of the Vassals tab in the Pillars of the Empire shows it; the rank decides which [oe_tu_dignities|e] a ruler can receive."
 game_concept_oe_tu_dignity: "Court Dignity"
 game_concept_oe_tu_dignity_desc: "Emperors often conferred court dignities on foreign rulers: Manuel I created the title of despot in 1163 for the Hungarian prince Béla.\n\nThe emperor can confer four dignities on reigning adult rulers of the [oe_tu_family|e]: despot (sons only, at most 2 at once); sebastokrator (sons only, at most 2 at once); kaisar (any rank, at most 1 at once); protosebastos (any rank, at most 3 at once). They cost prestige -20, -15, -15, -10 and Imperial Authority -8, -6, -10, -4 in that order. The honoured country's opinion of the empire rises by +40, +30, +30, +25, fading 2 a year, with +10 more while the ruler lives; a subject of the empire also gains loyalty +15, +12, +12, +8. A country can be honoured once every 5 years; a dignity is for life and does not pass to the successor.\n\nConfer them with Confer a Court Dignity in the Roman Cultural Sphere panel; the Vassals tab of the Pillars of the Empire shows them too."
 game_concept_oe_tu_provincialise: "Provincialisation"
 game_concept_oe_tu_provincialise_desc: "Rome often turned client kingdoms into provinces: Tiberius made Cappadocia a province in 17 AD after the death of its last king, and Basil II set up the theme of Bulgaria on the conquered kingdom in 1018.\n\nA provincialised subject of 120 months (each refused muster adds 5 years), with an opinion of the empire of at least 70 or a ruler installed by the emperor, and a primary culture of the Roman group or the Orthodox faith, can be put forward for 10 Imperial Authority; the [oe_tu_senate|e] votes on it. If it passes, the subject is annexed and its land becomes 1 province, 2 with 12 or more locations, 3 with 30 or more; a province bordering a country outside the Byzantine bloc becomes a march, otherwise an exarchate. If it fails, it cannot be put forward again for 5 years and the subject's opinion of the empire changes by -20. The Imperial Domain of Egypt needs none of these conditions.\n\nStart it with the edict Make a Province in the Pillars of the Empire; the Vassals tab shows how far each subject is from it."
 game_concept_oe_tu_pronoia: "Pronoia"
 game_concept_oe_tu_pronoia_desc: "A pronoia was a grant of the revenue of a piece of land in place of a salary, at first revocable; Manuel I extended it to officers, and after 1261 Michael VIII made it inheritable.\n\nOnce the empire has the vanilla pronoia law (or the Komnenian formalization, Palaeologan hereditary transition or reformed pronoia that follow it), land grants appear under Staff on the province card: military +10, loyalty target +5; finance is 5 lower than under the strategos; manpower and levies of the province and its land +10% to +20% by the law in force; a strategos born into a house gives it +5 influence a year. After 20 years a grant can become hereditary; revoking a hereditary grant costs 15 loyalty (20 under the Palaeologan law, 10 under reformed pronoia).\n\nFinance in the Themes tab then reads Pronoia; hover it for the exact numbers."
 game_concept_oe_tu_dignities: "Court Dignities"
 oe_tu_tt_status_1: "[oe_tu_status|e]: #Y Heartland#!\nImperial heartland; the emperor appoints and dismisses its governor.\nOffices: Military +0, Civil +0, Justice +0, Finance +0, Works +0\nLoyalty target +0\nStatus modifier: loyalty to overlord +5"
 oe_tu_tt_status_2: "[oe_tu_status|e]: #Y March#!\nA province on a foreign border. One that was heartland returns to it after 5 years without a foreign border; others need Roman law.\nOffices: Military #G +5#!, Civil #R -5#!, Justice +0, Finance #R -5#!, Works #G +5#!\nLoyalty target #R -10#!\nStatus modifier: land morale +10%, reinforcement speed +10%, loyalty to overlord -5"
 oe_tu_tt_status_3: "[oe_tu_status|e]: #Y Exarchate#!\nDistant land; Roman law can make it heartland. 1 seat in the senate.\nOffices: Military +0, Civil #R -5#!, Justice #R -5#!, Finance +0, Works +0\nLoyalty target #R -10#!\nStatus modifier: land morale +5%, loyalty to overlord -5\nTribute: 10% of the monthly income each month, more under a senate levy."
 oe_tu_tt_status_4: "[oe_tu_status|e]: #Y Chartered city#!\nSelf-governed by its own council; Roman law can make it heartland.\nOffices: Military #R -10#!, Civil +0, Justice +0, Finance #G +10#!, Works +0\nLoyalty target #R -5#!\nStatus modifier: loyalty to overlord -5\nTribute: 15% of the tax base; sends no troops; 2 seats in the senate."
 oe_tu_tt_status_5: "[oe_tu_status|e]: #Y Despotate#!\nHeld by a member of the imperial house. 1 seat in the senate.\nOffices: Military +0, Civil #G +5#!, Justice +0, Finance +0, Works +0\nLoyalty target #G +5#!\nStatus modifier: loyalty to overlord +10, land morale +5%\nTribute: 5% of the monthly income each month, more under a senate levy."
 oe_tu_tt_status_none: "[oe_tu_status|e]: not set yet; the next month sets it from the province type."
 oe_tu_tt_course_latin: "[oe_tu_course|e]: #Y Army#!\nOffices: Military #G +15#!, Civil +0, Justice +0, Finance +0, Works +0\nLoyalty target +0\nJoins the empire's wars.\nA Latin exarchate cannot change course."
 oe_tu_tt_course_army: "[oe_tu_course|e]: #Y Army#!\nOffices: Military #G +15#!, Civil +0, Justice +0, Finance +0, Works +0\nLoyalty target +0\nJoins the empire's wars.\nChanging the course costs 5 Imperial Authority and cannot be repeated for 5 years."
 oe_tu_tt_course_navy: "[oe_tu_course|e]: #Y Navy#!\nOffices: Military #G +10#!, Civil +0, Justice +0, Finance #G +5#!, Works +0\nLoyalty target +0\nJoins the empire's wars; the seat must be on the coast.\nChanging the course costs 5 Imperial Authority and cannot be repeated for 5 years."
 oe_tu_tt_course_civil: "[oe_tu_course|e]: #Y Civil#!\nOffices: Military +0, Civil #G +10#!, Justice #G +5#!, Finance #G +5#!, Works +0\nLoyalty target #G +5#!\nDoes not join the empire's wars; a march cannot take this course.\nChanging the course costs 5 Imperial Authority and cannot be repeated for 5 years."
 oe_tu_tt_course_charter: "[oe_tu_course|e]: #Y Self-rule#!\nOffices: Military +0, Civil #G +10#!, Justice +0, Finance #G +5#!, Works +0\nLoyalty target +0\nSends no troops; the course cannot change."
 oe_tu_tt_course_none: "[oe_tu_course|e]: this province type has no course bonus."
 oe_tu_tt_fiscal_1: "[oe_tu_fiscal|e]: #Y Central#!\nOffices: Military +0, Civil +0, Justice +0, Finance #G +15#!, Works +0\nLoyalty target #G +5#!\nThe treasury pays 0.2 gold a month per jurisdiction location in salary."
 oe_tu_tt_fiscal_2: "[oe_tu_fiscal|e]: #Y Tax farm#!\nOffices: Military +0, Civil +0, Justice #R -10#!, Finance #G +10#!, Works +0\nLoyalty target #R -5#!\nThe province gains 0.5 gold a month per jurisdiction location; its land's monthly development -0.005."
 oe_tu_tt_fiscal_3: "[oe_tu_fiscal|e]: #Y Pronoia#!\nOffices: Military #G +10#!, Civil +0, Justice +0, Finance +0, Works +0\nLoyalty target #G +5#!\nFinance is 5 lower than under the strategos. Manpower and levies of the province and its land +10% to +20% by the pronoia law in force; after 20 years the grant can become hereditary."
 oe_tu_tt_fiscal_0: "[oe_tu_fiscal|e]: #Y Strategos#!\nOffices: Military +0, Civil +0, Justice +0, Finance #G +5#!, Works +0\nLoyalty target +0\nThe strategos collects the taxes: no cost to the treasury, but the strategos answers to no one."
