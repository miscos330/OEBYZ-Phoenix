 # NEW 2026-11-19 v6.6 S8 (oe_s8_ Anatolian regional steps). Generated by gen_s8_anatolia.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_s8_theologo_consul: "Venetian Consul at Ayasuluk"
 STATIC_MODIFIER_DESC_oe_s8_theologo_consul: "In the spring of 1337 the Aydinid lord of Ayasuluk made a treaty with the Venetian duke of Crete: Venetians may trade here and keep a consul, and each side promised to stop raiding the other's coasts. The Latins call this port Theologo."
 STATIC_MODIFIER_NAME_oe_s8_malatya_frontier: "Mamluk Gate to the North"
 STATIC_MODIFIER_DESC_oe_s8_malatya_frontier: "A Mamluk army entered Malatya in 1315, and for a time afterwards the city was under Eretna. From 1338 the sultan in Cairo again keeps a governor here and holds the city as the frontier stronghold north of Syria."
 STATIC_MODIFIER_NAME_oe_s8_darende_seized: "Newly Taken by the Dulkadir"
 STATIC_MODIFIER_DESC_oe_s8_darende_seized: "In 1338 or 1339 Qaraja of Dulkadir pushed north and took Darende from Eretna. The townsfolk have not yet accepted their new lord."
 STATIC_MODIFIER_NAME_oe_s8_own_name: "Coins in the Ruler's Own Name"
 STATIC_MODIFIER_DESC_oe_s8_own_name: "Eretna began as a commander the Ilkhans left in Anatolia, and acknowledged first Hasan Buzurg of the Jalayirids and then the Mamluk sultan in Cairo. In 1340 Eretna stopped the Friday sermon in the Mamluk sultan's name; from 1341 the coins were struck in Eretna's own name, with the title of sultan."
 oe_s8_bw_theologo: "Made a trade treaty with us at Ayasuluk"
 oe_s8_bw_darende: "Took Darende from us"
 oe_s8_bw_khutba: "Dropped our sultan's name from the Friday sermon"
 oe_s8_b_khutba_kept: "Still names our sultan in the Friday sermon"
 oe_s8.4.t: "The Title of Sultan"
 oe_s8.4.desc: "#F Eretna began as a commander the Ilkhans left in Anatolia. When the khanate fell apart, Eretna first acknowledged Hasan Buzurg of the Jalayirids, then sent envoys to Cairo and was recognised by the Mamluk sultan as governor of Rum. In 1340 Eretna stopped the Friday sermon in the Mamluk sultan's name; from 1341 the coins were struck in Eretna's own name, and for the first time they carried the title of sultan.#!\n\nNow we answer to no overlord. The court asks the ruler to decide: strike coins and have the Friday sermon read in the ruler's own name, or keep naming the sultan in Cairo in the sermon and leave a way back."
 oe_s8.4.a: "Coins and sermon in our own name"
 oe_s8.4.a.tt: "Country rank rises to kingdom: the realm is styled a sultanate and its ruler a sultan.\nGain [ShowModifier('oe_s8_own_name')] for #Y 10#! years.\nEgypt (if not a player): opinion of us #R −15#! for #Y 10#! years."
 oe_s8.4.b: "Keep naming the sultan in Cairo"
 oe_s8.4.b.tt: "Egypt (if not a player): opinion of us #G +10#! for #Y 5#! years.\nCountry rank stays as it is."
 oe_s8.90.t: "Anatolian regional steps: worker"
