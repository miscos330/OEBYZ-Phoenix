l_english:
 OE_HEG_ROMAN_LEGITIMACY_REQUIRED: "Holds the Roman Legitimacy status in the Roman World"
 OE_HEG_ROMAN_ACTIONS_NOTICE: "Roman Hegemony opens after End the Turmoil is completed. Its actions require Byzantium to hold Roman Legitimacy."
 OE_RW_ITALY: "Italy"
 OE_RW_ITALY_DESC: "From Apulia to the Tiber, the old imperial roads still lead to Rome. The eagle will follow them home, and the Adriatic has old accounts to settle."
 OE_RW_ITALY_OPEN: "View Italian actions"
 OE_RW_ITALY_ACTIONS: "Italian Actions"
 OE_RW_ITALY_HINT: "Click the map to open its action panel here."
 OE_RW_ROME: "Rome"
 OE_RW_ROME_OWNER: "Current owner of Rome"
 OE_HEG_ITALY_ACTIONS_HINT: "Prepare the invasion, then advance along the coasts and old roads. Planning, marching on Rome and vengeance against Venice are each once only. Expelling the Normans and acquiring invasion claims are repeatable."
 OE_HEG_ITALY_PLAN_REQUIRED: "Completed Plan the Invasion of Italy"
 OE_HEG_SOUTH_ITALY_COVERED: "Every ownable location in Apulia and Basilicata is owned or militarily occupied by Byzantium or its subjects"
 OE_HEG_SOUTH_ITALY_OCCUPATION: "At least one enemy location in those areas is militarily occupied and can be transferred"
 OE_HEG_ROME_YEAR: "Byzantium or a subject has continuously occupied enemy-held Rome for more than one year"
 OE_HEG_VENICE_YEAR: "Byzantium or a subject has continuously occupied enemy-held Venice for more than one year"
 OE_HEG_ROME_PROGRESS: "Continuous occupation: Rome [GuiScope.SetRoot(GetLocationByKey('rome').MakeScope).ScriptValue('oe_heg_hold_duration')|0] / 366 days"
 OE_HEG_VENICE_PROGRESS: "Continuous occupation: Venice [GuiScope.SetRoot(GetLocationByKey('venice').MakeScope).ScriptValue('oe_heg_hold_duration')|0] / 366 days"
 OE_HEG_CHOOSE_INVASION_TARGET: "Choose a foreign country owning land in the target region"
 oe_heg_plan_italy: "Plan the Invasion of Italy"
 oe_heg_plan_italy_desc: "Unroll the old charts and provision the fleet. Imperial claims to Italy did not vanish with the last garrison; now they must be backed by ships and supplies."
 oe_heg_plan_italy_effect: "Spend 1000 treasury gold to add the Italy region to the Roman World and unlock the Italian actions. Once only."
 oe_heg_plan_italy_done: "Completed: Plan the Invasion of Italy"
 oe_heg_drive_out_normans: "Expel the Normans"
 oe_heg_drive_out_normans_desc: "The towns of southern Italy once paid their taxes to the empire. With Apulia and Basilicata secured, let imperial officials turn the army's occupation into lasting borders."
 oe_heg_drive_out_normans_effect: "Immediately transfer all enemy locations militarily occupied by Byzantium or its subjects in Apulia and Basilicata to Byzantium. Land already owned by subjects is retained by them. Free and repeatable when occupied territory is available."
 oe_heg_march_on_rome: "March on Rome"
 oe_heg_march_on_rome_desc: "The imperial standards have stood beside the Tiber for more than a year. The City of Seven Hills shall no longer be merely an occupation on a war map."
 oe_heg_march_on_rome_effect: "Immediately take ownership and control of Rome. Free; once only."
 oe_heg_march_on_rome_done: "Completed: March on Rome"
 oe_heg_revenge_on_venice: "Vengeance against Venice"
 oe_heg_revenge_on_venice_desc: "The sound of marching boots has silenced the oars of the lagoon. Constantinople remembers its wounds; today the imperial court calls the sea-borne republic to account."
 oe_heg_revenge_on_venice_effect: "Take ownership and control of Venice, downgrade it by one rank, and reduce prosperity by 50 percentage points. Byzantium gains 50 base antagonism centered on Venice, propagated by native rules. Noble and Commoner estate satisfaction each rises by 5 percentage points. Free; once only."
 oe_heg_revenge_on_venice_done: "Completed: Vengeance against Venice"
 oe_heg_invade_italy: "Invade Italy"
 oe_heg_invade_italy_desc: "Prepare the writs of war for rulers who still hold Italian land. Their capitals will be the objectives of the coming campaign."
 oe_heg_invade_italy_effect: "Spend 100 treasury gold. Select a country owning land in Italy, excluding Byzantium and all its subjects. Gain a fifteen-year casus belli to take its capital. Repeatable; does not declare war. Three-month cooldown."
 oe_heg_invade_egypt: "Invade Egypt"
 oe_heg_invade_egypt_desc: "Carry the imperial summons along the roads of Syria and the ports of Egypt. The rulers of the eastern lands must answer it in their own capitals."
 oe_heg_invade_egypt_effect: "Spend 100 treasury gold. Select a country owning land in Egypt or the Levant, excluding Byzantium and all its subjects. Gain a fifteen-year casus belli to take its capital. Repeatable; does not declare war. Three-month cooldown."
 oe_heg_invade_africa: "Invade North Africa"
 oe_heg_invade_africa_desc: "Coastal anchorages alone cannot secure Africa. Send the imperial ultimatum to every foreign ruler who still holds land in the Maghreb."
 oe_heg_invade_africa_effect: "Spend 100 treasury gold. Select a country owning land in the Maghreb, excluding Byzantium and all its subjects. Gain a fifteen-year casus belli to take its capital. Repeatable; does not declare war. Byzantine or subject ownership of Alexandria is still required. Three-month cooldown."
 oe_heg_capital_invasion: "Imperial Expedition"
 oe_heg_capital_invasion_desc: "The empire has prepared to reclaim its old lands. Taking the opposing capital will compel its ruler to submit."
