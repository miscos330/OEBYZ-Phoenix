l_english:
 oe_hetaireia_rum_pronoia: "Rum Pronoia"
 oe_hetaireia_rum_pronoia_desc: "The Emperor assigns the revenues of designated estates to Rum military households in return for a fixed obligation of armored horsemen and mounted archers. The beneficiaries provide their own horses and equipment and answer the imperial summons, sustaining both their families and a tradition of mounted service.\n\nHetaireia satisfaction equilibrium: #G +5%#!. Estate power: #Y +33%#!. National tax efficiency: #R −2.5%#!.\nTurcopoles and Rum Cataphracts use their #Y enhanced Pronoia variants#! of the same age, sharing the existing barracks capacity. Revoking the privilege restores their standard variants."
 OE_RUM_PRONOIA_UPGRADE_TT: "Convert existing Turcopoles and Rum Cataphracts into their enhanced Pronoia variants of the same age, and enable the corresponding recruitment and age upgrades. This grants no additional recruitment slots."
 OE_RUM_PRONOIA_DOWNGRADE_TT: "Restore existing Pronoia Turcopoles and Rum Cataphracts to their standard variants of the same age."
 oe_turcopoles_pronoia_1: "Pronoia Turcopole Horse Archers"
 oe_turcopoles_pronoia_1_desc: "From the pastures of Anatolia to the roads of Thrace, Rum horsemen bring their skill with bow and saddle into imperial service. Lightly armored, they watch the flanks for the moment an enemy formation falters.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +20%#! strength damage, #G +10%#! morale damage, #G +1#! combat speed, #G +1#! movement speed and #G +3#! initiative."
 oe_turcopoles_pronoia_2: "Pronoia Turcopole Mounted Bowmen"
 oe_turcopoles_pronoia_2_desc: "Training in the barracks gives the old mounted archery traditions a common set of commands. The Turcopoles harass the enemy with successive volleys before riding beyond pursuit.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +20%#! strength damage, #G +10%#! morale damage, #G +1#! combat speed, #G +1#! movement speed and #G +3#! initiative."
 oe_turcopoles_pronoia_3: "Pronoia Turcopole Light Lancers"
 oe_turcopoles_pronoia_3_desc: "Against increasingly ordered infantry formations, the horsemen add light lances to their equipment. Reconnaissance and harassment remain their first duties; a charge follows only when a flank gives way.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +20%#! strength damage, #G +10%#! morale damage, #G +1#! combat speed, #G +1#! movement speed and #G +3#! initiative."
 oe_turcopoles_pronoia_4: "Pronoia Turcopole Mounted Arquebusiers"
 oe_turcopoles_pronoia_4_desc: "The smoke of arquebuses begins to replace the sound of bowstrings. The Turcopoles learn to carry firearms on campaign and fight dismounted while retaining the mobility of light cavalry.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +20%#! strength damage, #G +10%#! morale damage, #G +1#! combat speed, #G +1#! movement speed and #G +3#! initiative."
 oe_turcopoles_pronoia_5: "Pronoia Turcopole Carabiniers"
 oe_turcopoles_pronoia_5_desc: "Standard carbines, sabres and saddles bring greater cohesion to these squadrons. They screen the army, raid supply lines and turn a retreat into a rout.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +20%#! strength damage, #G +10%#! morale damage, #G +1#! combat speed, #G +1#! movement speed and #G +3#! initiative."
 oe_turcopoles_pronoia_6: "Pronoia Turcopole Chasseurs"
 oe_turcopoles_pronoia_6_desc: "The ancient name of the Turcopoles is now borne by disciplined chasseurs. Their dispersed formations conceal the movements of the army and exploit breaches in the enemy line.\n\nSpecial light cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary light cavalry of the same age: #G +20%#! strength damage, #G +10%#! morale damage, #G +1#! combat speed, #G +1#! movement speed and #G +3#! initiative."
 oe_rum_cataphracts_pronoia_1: "Pronoia Rum Mail-Clad Horsemen"
 oe_rum_cataphracts_pronoia_1_desc: "Rum military households bring their horses, lances and carefully repaired mail beneath the imperial standard. They advance in close order, trusting their armor to carry them through the first volleys.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G −10%#! strength damage taken, #G +10%#! strength damage, #G +33%#! morale damage and #G +3#! initiative. Uses expensive heavy cavalry recruitment and maintenance supplies, without the standard variant’s movement speed penalty."
 oe_rum_cataphracts_pronoia_2: "Pronoia Rum Cataphracts"
 oe_rum_cataphracts_pronoia_2_desc: "The barracks organize privately equipped horsemen into disciplined ranks. At the sound of the horn, the riders hold their pace so that lance points and hooves reach the enemy together.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G −10%#! strength damage taken, #G +10%#! strength damage, #G +33%#! morale damage and #G +3#! initiative. Uses expensive heavy cavalry recruitment and maintenance supplies, without the standard variant’s movement speed penalty."
 oe_rum_cataphracts_pronoia_3: "Pronoia Rum Heavy Lancers"
 oe_rum_cataphracts_pronoia_3_desc: "Stronger lances and tighter formations demand patience. The Rum horsemen wait until the infantry pins the enemy before committing a complete squadron to the charge.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G −10%#! strength damage taken, #G +10%#! strength damage, #G +33%#! morale damage and #G +3#! initiative. Uses expensive heavy cavalry recruitment and maintenance supplies, without the standard variant’s movement speed penalty."
 oe_rum_cataphracts_pronoia_4: "Pronoia Rum Armored Reiters"
 oe_rum_cataphracts_pronoia_4_desc: "Pistols and sabres enter the riders’ equipment. The armored horsemen fire at close range and follow with steel, placing timing and distance alongside the old virtues of courage.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G −10%#! strength damage taken, #G +10%#! strength damage, #G +33%#! morale damage and #G +3#! initiative. Uses expensive heavy cavalry recruitment and maintenance supplies, without the standard variant’s movement speed penalty."
 oe_rum_cataphracts_pronoia_5: "Pronoia Rum Cuirassiers"
 oe_rum_cataphracts_pronoia_5_desc: "Heavy full armor gives way to a sturdy cuirass. The Rum squadrons retain their shock role while common drill and standardized equipment adapt their service to a changing battlefield.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G −10%#! strength damage taken, #G +10%#! strength damage, #G +33%#! morale damage and #G +3#! initiative. Uses expensive heavy cavalry recruitment and maintenance supplies, without the standard variant’s movement speed penalty."
 oe_rum_cataphracts_pronoia_6: "Pronoia Rum Guard Cuirassiers"
 oe_rum_cataphracts_pronoia_6_desc: "Centuries of armored cavalry service become the honor of the Guard Cuirassiers. Held for the decisive moment, they deliver a disciplined charge against the enemy’s final resistance.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G −10%#! strength damage taken, #G +10%#! strength damage, #G +33%#! morale damage and #G +3#! initiative. Uses expensive heavy cavalry recruitment and maintenance supplies, without the standard variant’s movement speed penalty."
