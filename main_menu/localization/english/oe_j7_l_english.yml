 oe_j7.5.desc_x: "#F In history, after 1390 John VII is said to have kept Silymvría as a base, under the sultan's protection.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] keeps a court apart, and everyone around calls [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] emperor. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] keeps a following of the elder line's own outside the City. At court they debate how to treat this 'other emperor'."
 oe_j7.5.a: "Grant the elder line a pension"
 oe_j7.5.a.tt: "Costs #R 1#! month of trade and tax income now, and again every year, #Y 5#! years in all; if it cannot be paid, the pension stops\nThe chance of a later reconciliation #G +20#!; if the pension stops, #R −10#!"
 oe_j7.5.b: "Ignore the elder line"
 oe_j7.5.b.tt: "The chance of a later reconciliation #R −10#! (each time the elder line is ignored)"
 oe_j7.5.c: "Ask Venice to mediate"
 oe_j7.5.c.tt: "Venice: opinion of the empire #G +5#! for #Y 5#! years\nThe chance of a later reconciliation #G +15#!"
 oe_j7.6.t: "Uncle and Nephew"
 oe_j7.6.desc_ytpk: "#F In 1399 uncle and nephew were reconciled, and John VII came back to the City; some say the French marshal Boucicaut brought them together. At the end of that year Manuel sailed west with Boucicaut and left the City to the nephew.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] sends word of being willing to come back to the City. Yet [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is still with the sultan, and must first get out of the sultan's door. The pension of these years was not paid in vain. The City is under the sultan's blockade, and some at court say one more prince on the walls can only help. [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] must decide."
 oe_j7.6.desc_ytp: "#F In 1399 uncle and nephew were reconciled, and John VII came back to the City; some say the French marshal Boucicaut brought them together. At the end of that year Manuel sailed west with Boucicaut and left the City to the nephew.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] sends word of being willing to come back to the City. Yet [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is still with the sultan, and must first get out of the sultan's door. The pension of these years was not paid in vain. [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] must decide."
