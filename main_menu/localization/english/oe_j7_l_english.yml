 oe_j7.6.a: "Make peace and invite the elder line back"
 oe_j7.6.a.tt: "Chance of a reconciliation: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_recon_pct').GetValue|0]%#!\nSuccess: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] comes back to the empire; where the empire may have a co-emperor and has none, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is crowned co-emperor (not made heir)\nFailure: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] will not come back\nAny pension ends here"
 oe_j7.6.b: "No reconciliation"
 oe_j7.6.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] stays away from the City\nAny pension ends here"
 oe_j7.91.t: "News from the City"
 oe_j7.91.desc_x221: "Won in the streets: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]'s men were scattered, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] fled to the sultan."
 oe_j7.91.desc_x222: "Won in the streets: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]'s men were scattered."
 oe_j7.91.desc_x223: "Lost in the streets: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] entered the palace, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] was locked up."
 oe_j7.91.desc_x224: "Lost in the streets; but the change in the palace did not go through (a failure code is recorded)."
 oe_j7.91.desc_x311: "The ships came: the City is ours again, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is restored."
 oe_j7.91.desc_x312: "The ships came: the City is ours again, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip] takes the throne."
 oe_j7.91.desc_x313: "The ships came; but the change in the palace did not go through (a failure code is recorded)."
 oe_j7.91.desc_x321: "Assault after assault failed. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is secure on the throne, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] has been locked up."
 oe_j7.91.desc_x391: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] has died, and the new reign has fallen apart. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is restored."
 oe_j7.91.desc_x392: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] has died, and the new reign has fallen apart. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip] takes the throne."
 oe_j7.91.desc_x393: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] has died, and the new reign has fallen apart; the succession settles the throne."
