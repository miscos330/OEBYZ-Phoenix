 oe_j7.3.a: "Borrow the Knights' galleys and bring the old emperor back"
 oe_j7.3.a.tt: "Costs #R 1#! month of trade and tax income\nThe Knights Hospitaller: opinion of the empire #G +10#! for #Y 5#! years\nChance of a restoration: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_restore_pct').GetValue|0]%#!\nSuccess: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is restored; where [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is gone, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip] takes the throne; [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] goes back to the appanage at Silymvría ([ShowModifier('oe_j7_appanage')], #Y 10#! years); where the sultan stands behind, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] goes to the sultan\nFailure: the new reign holds, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is imprisoned for #Y 5#! years"
 oe_j7.3.b: "Ask the sultan to judge"
 oe_j7.3.b.tt: "While the empire is the sultan's vassal: the yearly tribute #R +20%#!; otherwise costs #R 6#! months of trade and tax income\nThe restoration is sure: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is restored; where [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is gone, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip] takes the throne; [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] goes back to the appanage at Silymvría ([ShowModifier('oe_j7_appanage')], #Y 10#! years); where the sultan stands behind, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] goes to the sultan\nThe sultan will come to collect on this favour"
 oe_j7.3.c: "Accept the new emperor"
 oe_j7.3.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] stays on the throne; [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] retires and is not held\nThe one who gathered the ships, if in the empire, is aggrieved"
 oe_j7.4.t: "The Sultan's Price"
 oe_j7.4.desc_pgv: "#F In history, once the City was retaken, Bayezid is said to have demanded that John V pull down the new walls by the Golden Gate, or else Manuel, then in the sultan's camp, would not be let go. The old emperor is said to have complied.#!\n\nNow the sultan's envoy has come to the City: the new walls by the Golden Gate must come down. This is the favour owed since the sultan was asked to judge. The fortress by the Golden Gate has just held a corner of the City through the troubles. The empire is still the sultan's vassal; a refusal will cost dearly. [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] must decide."
