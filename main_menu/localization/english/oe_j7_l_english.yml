 oe_j7.1.a: "Appease the elder line with a larger appanage"
 oe_j7.1.a.tt: "Costs #R 2#! months of trade and tax income\nSilymvría gains [ShowModifier('oe_j7_appanage')] for #Y 10#! years\nThe chance of a rising is halved; and even if it comes to that, at the end there is an even chance that the elder line lets it go"
 oe_j7.1.b: "Offer the sultan a higher price"
 oe_j7.1.b.tt: "Costs #R 4#! months of trade and tax income\nThis time the sultan will not stand behind the elder line\nThe Ottomans: opinion of the empire #G +10#! for #Y 5#! years\nWhile the empire is the sultan's vassal: the sultan's patience #G +10#!"
 oe_j7.1.c: "Strengthen the City's guard and keep watch on the elder line"
 oe_j7.1.c.tt: "Costs #R 1#! month of trade and tax income\nLater, the chance in the streets #G +15#! and the chance of a restoration #G +10#!"
 oe_j7.1.d: "Crown the elder line co-emperor"
 oe_j7.1.d.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] becomes heir; where the empire may have a co-emperor, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is crowned co-emperor (where it already has one, only the heir is set)\nThere will be no coup; Manuel's branch is aggrieved"
 oe_j7.2.t: "The Golden Gate"
 oe_j7.2.desc_ytg: "#F In the spring of 1390 John VII entered the City with soldiers the sultan had lent, and took the title of emperor. The old emperor, John V, withdrew into the fortress by the Golden Gate and shut its doors. Some say that someone inside opened a gate.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]'s men are under the walls, and there are friends inside. The sultan's horsemen ride behind. The fortress by the Golden Gate is still ours. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] must decide: resist, or receive?"
 oe_j7.2.desc_yt: "#F In the spring of 1390 John VII entered the City with soldiers the sultan had lent, and took the title of emperor. The old emperor, John V, withdrew into the fortress by the Golden Gate and shut its doors. Some say that someone inside opened a gate.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]'s men are under the walls, and there are friends inside. The sultan's horsemen ride behind. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] must decide: resist, or receive?"
 oe_j7.2.desc_yog: "#F In the spring of 1390 John VII entered the City with soldiers the sultan had lent, and took the title of emperor. The old emperor, John V, withdrew into the fortress by the Golden Gate and shut its doors. Some say that someone inside opened a gate.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]'s men are under the walls, and there are friends inside. This time the sultan holds back; the claimant brings only Genoese and a household guard. The fortress by the Golden Gate is still ours. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] must decide: resist, or receive?"
