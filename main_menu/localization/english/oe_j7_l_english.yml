 oe_j7.4.a: "Comply and pull the new walls down"
 oe_j7.4.a.tt: "The City gains [ShowModifier('oe_j7_gate_razed')] for #Y 20#! years\nThe Golden Gate itself stands; only the new walls come down\nThe Ottomans: opinion of the empire #G +15#! for #Y 5#! years\nWhile the empire is the sultan's vassal: the sultan's patience #G +10#!"
 oe_j7.4.b: "Refuse"
 oe_j7.4.b.tt: "The Ottomans: opinion of the empire #R −30#! for #Y 5#! years\nWhile the empire is the sultan's vassal: the sultan's patience #R −20#!"
 oe_j7.4.c: "Send money instead"
 oe_j7.4.c.tt: "Costs #R 3#! months of trade and tax income\nThe sultan takes the money and lets the walls be"
 oe_j7.5.t: "The Other Emperor"
 oe_j7.5.desc_ftn: "#F In history, after 1390 John VII is said to have kept Silymvría as a base, under the sultan's protection. Some say that in 1397 John VII offered to sell the claim to the throne to the king of France.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] keeps a court apart, and everyone around calls [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] emperor. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] lives with the sultan, who treats [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] as an honoured guest. This is not the first time such news has reached the palace. At court they debate how to treat this 'other emperor'."
