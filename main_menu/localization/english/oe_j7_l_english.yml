 oe_j7.2.a: "Withdraw to the fortress by the Golden Gate and wait for help"
 oe_j7.2.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] takes the throne; [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] withdraws to the fortress by the Golden Gate and stays in the empire\nThe empire gains [ShowModifier('oe_j7_new_reign')] until the affair is settled\nIn three to six months, help will come"
 oe_j7.2.b: "Fight in the streets"
 oe_j7.2.b.tt: "Costs #R 1#! month of trade and tax income\nChance to win in the streets: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_street_pct').GetValue|0]%#!\nWon: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] flees (to the sultan where the sultan stands behind, otherwise imprisoned for #Y 5#! years), prestige #G +5#!\nLost: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] takes the throne, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] is imprisoned for #Y 5#! years, stability #R −2.5#!"
 oe_j7.2.c: "Open the gates and crown the elder line co-emperor"
 oe_j7.2.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] becomes heir; where the empire may have a co-emperor, [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is crowned co-emperor (where it already has one, only the heir is set)\nThere will be no coup; Manuel's branch is aggrieved"
 oe_j7.3.t: "Galleys from Rhodes"
 oe_j7.3.desc_yrkd: "#F In the summer of 1390 Manuel gathered a few ships abroad, among them, it is said, galleys of the Knights of Rhodes. After several assaults Manuel took the City back in the autumn and the old emperor was restored; some say that John VII fled and went over to the sultan.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] has sat on the throne for some months. The old emperor has died in the fortress. The men on the ships mean to raise [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip]. [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_rest').GetCharacter.GetFirstNameWithNoTooltip] has gathered ships at sea and waits for word from the City. The Knights of Rhodes have promised two galleys. Every party at court is waiting for an answer."
