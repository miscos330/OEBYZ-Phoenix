l_english:
 OE_J7_END_1: "The elder line: the emperor fought in the streets, and the elder line was driven off."
 OE_J7_END_2: "The elder line: given a larger appanage, the elder line never rose."
 OE_J7_END_3: "The elder line: made heir and co-emperor, the elder line staged no coup."
 OE_J7_END_4: "The elder line: the emperor opened the gates and made the elder line heir and co-emperor."
 OE_J7_END_5: "The elder line: the elder line took the City; months later the Knights' galleys brought a restoration."
 OE_J7_END_6: "The elder line: the elder line took the City, and the new reign held."
 OE_J7_END_7: "The elder line: the elder line took the City; the sultan judged, and the old reign was restored."
 OE_J7_END_8: "The elder line: the elder line was already the heir and had no need to take the City."
 OE_J7_END_9: "The elder line: Andronikos's branch left nobody to claim the throne."
 OE_J7_END_10: "The elder line: the elder line took the City, died soon after, and the old reign returned."
 OE_J7_END_R: "The elder line: [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] reigns, and [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_old').GetCharacter.GetFirstNameWithNoTooltip] holds out in the fortress by the Golden Gate."
 OE_J7_END_G: "The elder line: the claimant died before rising, or the City was no longer the empire's."
 OE_J7_END_X: "The elder line: these years were troubled at court, and the elder line never found its moment."
 OE_J7_END_S: "The elder line: the elder line nurses a grievance, and the empire is on its guard."
 OE_J7_END_W: "The elder line: not yet (from 1386, if anyone of Andronikos's branch is left)."
 OE_J7_END2_1: "Uncle and nephew were reconciled, and the elder line came back to the City."
 OE_J7_END2_2: "The court was willing to make peace, but the elder line did not come back."
 OE_J7_END2_3: "The emperor would not make peace with the elder line."
 OE_J7_END2_4: "The claimant died before any reconciliation."
 OE_J7_END2_5: "The moment for a reconciliation passed."
 OE_J7_END2_O: "[GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip] is still away from the City, and the court deals with the elder line at arm's length."
 OE_J7_END2_W: "What becomes of the elder line is not yet known."
 STATIC_MODIFIER_NAME_oe_j7_appanage: "The Elder Line's Appanage"
 STATIC_MODIFIER_NAME_oe_j7_new_reign: "A Reign Not Yet Secure"
 STATIC_MODIFIER_NAME_oe_j7_gate_razed: "The Golden Gate's New Walls Pulled Down"
 oe_j7_b_outbid: "Byzantium paid more for the sultan to stay out of the imperial family's quarrel"
 oe_j7_b_galleys: "Byzantium borrowed our galleys to take back its capital"
 oe_j7_b_razed: "Byzantium pulled down its capital's new walls as we asked"
 oe_j7_b_refused: "Byzantium refused to pull down its capital's new walls"
 oe_j7_b_mediate: "Byzantium asked us to mediate within its imperial family"
 oe_j7.1.t: "The Grievance at Silymvría"
 oe_j7.1.desc_shbm: "#F In 1373 Andronikos rose together with a son of Murad; the rising failed, and Andronikos was blinded in one eye. In 1376 Andronikos took the City with Genoese and Turkish help, and three years later was driven back to Galata. In 1381 (some say 1382) John V and Andronikos were reconciled: Andronikos and the young John were made heirs again, with Silymvría as an appanage. Andronikos died in 1385, and John came to believe that the uncle, Manuel, would sooner or later push John aside. It is said that John sought help from both the sultan and the Genoese.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_j7_claimant').GetCharacter.GetFirstNameWithNoTooltip]'s envoys come and go between the sultan's camp and Galata. The claimant holds Silymvría, with walls and soldiers. The claimant grew up at the sultan's court. It is said that the claimant's mother was a daughter of the Bulgarian tsar. The claimant is the last son left of Andronikos's line. At court they debate what to do about the elder line."
