l_english:
 oe_ir_reclaim_privileges: "Revoke Noble Privileges"
 oe_ir_reclaim_privileges_desc: "An illustrious name must no longer license the seizure of imperial resources. Revoke the great houses' privileges over land and industry, restoring the authority of imperial registers and law.\n\nRequires #Y Secure the Succession#! and no non-allied house with #Y more than 200 Influence#!. Costs #R 50 Authority#!. Immediately removes all noble holding modifiers from directly owned Byzantine locations and permanently stops automatic noble expansion. Every house suffers an additional #G −1 monthly Influence#!. May be completed only once."
 oe_ir_reclaim_privileges_done: "Noble Privileges Revoked"
 oe_bi_force_repression: "Crush Noble Resistance"
 oe_bi_force_repression_desc: "Requires #Y Purge Noble Influence from the Capital#! during this crisis. Choose a non-allied house and spend #R 2 Authority#! and #R 100 Manpower#! to reduce its Influence by #G 50#!. Each use has an independent #R 20%#! chance of immediately triggering Civil War, without requiring a house above 400 Influence. No cooldown; repeatable."
 oe_bi_negotiate: "Negotiate with a Noble House"
 oe_bi_negotiate_desc: "Choose a non-allied house with #Y less than 400 Influence#!. Spend #R 2 Authority#! to reduce its Influence by #G 25#!. Nationwide cooldown: #Y 12 months#!. Each dynasty may be selected only once per disaster; replacing its head does not reset this restriction."
 oe_bi_display_authority: "Assert Royal Authority"
 oe_bi_display_authority_desc: "Lose #R 5 Stability#! and #R 5 Legitimacy#! to gain #G 5 Authority#!. Nationwide cooldown: #Y 12 months#!."
 oe_bi_curb_influence: "Curb Noble Influence"
 oe_bi_curb_influence_desc: "Choose a non-allied noble house. Spend #R 5 Authority#! to reduce its Influence by #G 25#!. Nationwide cooldown: #Y 3 months#!."
 OE_BI_REQUIRE_100_MANPOWER: "Have at least #Y 100#! Manpower"
 OE_BI_PAY_ROYAL_COST: "Can pay #R 5 Stability#! and #R 5 Legitimacy#!"
 oe_bi_negotiate_cooldown: "Noble Negotiation Cooldown"
 oe_bi_assert_authority_cooldown: "Assert Royal Authority Cooldown"
 oe_bi_curb_cooldown: "Curb Noble Influence Cooldown"
 oe_bi_negotiated_families: "Houses Negotiated with in This Crisis"
 oe_bi_forced_civil_war: "Civil War Provoked by Repression"
