 # NEW 2026-11-23 v21.0 Module C: Byzantine Reconquest & Hegemony Campaigns 2.0 (oe_rc2_) — Localization (english). Generated by gen_v210_byz_reconquest2.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_rc2_approach_ultimatum_mod: "Imperial Ultimatum & Subjugation Charter"
 STATIC_MODIFIER_DESC_oe_rc2_approach_ultimatum_mod: "Imperial envoys offer formal protectorate charters ahead of the advancing legions, softening regional hostility and reassuring loyal vassals."
 STATIC_MODIFIER_NAME_oe_rc2_subversion_mod: "Byzantine Theater Subversion Network"
 STATIC_MODIFIER_DESC_oe_rc2_subversion_mod: "Imperial gold buys rival captains, gatekeepers, and local guides across the campaign theater, accelerating sieges and marches."
 STATIC_MODIFIER_NAME_oe_rc2_subverted_defense_mod: "Subverted Fortifications & Divided Ranks"
 STATIC_MODIFIER_DESC_oe_rc2_subverted_defense_mod: "Imperial intrigue and bribed factions sow distrust within the garrisons, weakening defensive cohesion across the frontier."
 STATIC_MODIFIER_NAME_oe_rc2_approach_blitz_mod: "Total Reconquista Decree"
 STATIC_MODIFIER_DESC_oe_rc2_approach_blitz_mod: "An uncompromising imperial decree drives the legions to rapid territorial seizure, at the cost of elevated war upkeep and widespread regional alarm."
 STATIC_MODIFIER_NAME_oe_rc2_supply_generous_overlord_mod: "Generous Imperial Commissariat"
 STATIC_MODIFIER_DESC_oe_rc2_supply_generous_overlord_mod: "Constantinople shoulders full commissariat expenses for forward magazines and transport fleets, buying unwavering loyalty and steady rations."
 STATIC_MODIFIER_NAME_oe_rc2_supply_generous_subject_mod: "Imperial Commissariat Full Rations"
 STATIC_MODIFIER_DESC_oe_rc2_supply_generous_subject_mod: "Abundant gold, biscuit, and siege timber shipped directly from Constantinople keep this expeditionary force sharp and devoted."
 STATIC_MODIFIER_NAME_oe_rc2_supply_standard_overlord_mod: "Standard Provincial Requisition"
 STATIC_MODIFIER_DESC_oe_rc2_supply_standard_overlord_mod: "Balanced supply quotas split the logistical burden between the imperial treasury and forward depots along the campaign frontier."
 STATIC_MODIFIER_NAME_oe_rc2_supply_standard_subject_mod: "Standard Imperial Supply Quotas"
 STATIC_MODIFIER_DESC_oe_rc2_supply_standard_subject_mod: "Regular imperial convoys maintain orderly camp rations without extravagant donatives."
 STATIC_MODIFIER_NAME_oe_rc2_supply_austerity_overlord_mod: "Austerity Logistics: Live Off the Land"
 STATIC_MODIFIER_DESC_oe_rc2_supply_austerity_overlord_mod: "Treasury outlays are slashed by ordering expeditions to forage on campaign, saving gold while inflaming enemy resentment and commander unrest."
 STATIC_MODIFIER_NAME_oe_rc2_supply_austerity_subject_mod: "Starved Commissariat & Foraging Orders"
 STATIC_MODIFIER_DESC_oe_rc2_supply_austerity_subject_mod: "Chronic arrears from Constantinople force the legions to forage across hostile countryside, eroding discipline and loyalty to the throne."
 STATIC_MODIFIER_NAME_oe_rc2_purged_generals_mod: "Purged Strategoi & Suspicious Command"
 STATIC_MODIFIER_DESC_oe_rc2_purged_generals_mod: "Recalling ambitious expeditionary generals secures the purple throne at the cost of battered troop morale and diminished military leadership."
 STATIC_MODIFIER_NAME_oe_rc2_autonomous_legions_mod: "Autonomous Spoils & Warlord Legions"
 STATIC_MODIFIER_DESC_oe_rc2_autonomous_legions_mod: "Permitting field marshals to retain provincial spoils spares the treasury and spurs rapid storming of cities, yet erodes imperial oversight."
 STATIC_MODIFIER_NAME_oe_rc2_overextension_t1_mod: "Imperial Overextension: Strained Frontiers"
 STATIC_MODIFIER_DESC_oe_rc2_overextension_t1_mod: "Simultaneous theaters or prolonged reconquest campaigns strain the logothetes, driving up court and military expenses while estates grow restless."
 STATIC_MODIFIER_NAME_oe_rc2_overextension_t2_mod: "Imperial Overextension: Exhausted Empire"
 STATIC_MODIFIER_DESC_oe_rc2_overextension_t2_mod: "Overstretched supply lines and relentless campaigning drain the provinces dry, inflaming estate opposition, provincial separatism, and domestic unrest."
 STATIC_MODIFIER_NAME_oe_rc2_frontier_consolidation_mod: "Rested Armies & Consolidated Frontiers"
 STATIC_MODIFIER_DESC_oe_rc2_frontier_consolidation_mod: "A deliberate pause in foreign expeditions allows the imperial chancery to audit tax registers, repair border fortresses, and soothe war-weary estates."
 STATIC_MODIFIER_NAME_oe_rc2_italy_reconcile_mod: "Pentarchic Conciliation of Rome"
 STATIC_MODIFIER_DESC_oe_rc2_italy_reconcile_mod: "An honourable accord with the Roman See calms Catholic courts across Italy and bolsters imperial legitimacy."
 STATIC_MODIFIER_NAME_oe_rc2_italy_crush_mod: "Iron Supremacy Over the Latin League"
 STATIC_MODIFIER_DESC_oe_rc2_italy_crush_mod: "Refusing papal mediation, the legions assert unbroken Roman sovereignty from Ravenna to the Tiber."
 STATIC_MODIFIER_NAME_oe_rc2_italy_guilds_mod: "Lombard & Maritime Guild Compact"
 STATIC_MODIFIER_DESC_oe_rc2_italy_guilds_mod: "Imperial charters bind Italian banking houses, cloth guilds, and galley shipwrights to Constantinople's trade network."
 STATIC_MODIFIER_NAME_oe_rc2_egypt_annona_mod: "Restored Imperial Annona Grain Fleet"
 STATIC_MODIFIER_DESC_oe_rc2_egypt_annona_mod: "Annual grain convoys from Alexandria once again feed the capital and imperial armies across the Eastern Mediterranean."
 STATIC_MODIFIER_NAME_oe_rc2_egypt_coptic_mod: "Alexandrian & Coptic Autonomy Compact"
 STATIC_MODIFIER_DESC_oe_rc2_egypt_coptic_mod: "Guaranteeing Coptic churches and local notables pacifies the Nile Valley and speeds provincial integration, while slowing forced religious conversion."
 STATIC_MODIFIER_NAME_oe_rc2_egypt_customs_mod: "Red Sea & Karimi Customs Monopoly"
 STATIC_MODIFIER_DESC_oe_rc2_egypt_customs_mod: "Imperial customs officials at Alexandria and Damietta tax the spice flow from the Red Sea straight into the treasury."
 STATIC_MODIFIER_NAME_oe_rc2_africa_navy_mod: "Carthage Exarchate War Fleet"
 STATIC_MODIFIER_DESC_oe_rc2_africa_navy_mod: "Rebuilt dockyards along the Gulf of Tunis sweep Barbary corsairs from the central Mediterranean lanes."
 STATIC_MODIFIER_NAME_oe_rc2_africa_berber_mod: "Berber Foederati Frontier Charter"
 STATIC_MODIFIER_DESC_oe_rc2_africa_berber_mod: "Allied desert tribes guide imperial columns across arid interior tracks and police the Saharan caravan rim."
 STATIC_MODIFIER_NAME_oe_rc2_africa_ports_mod: "Maghreb Grain & Olive Export Ports"
 STATIC_MODIFIER_DESC_oe_rc2_africa_ports_mod: "Revived coastal granaries and olive presses across Tunisia and Tripolitania enrich imperial food stocks and customs."
 STATIC_MODIFIER_NAME_oe_rc2_iberia_accord_mod: "Iberian Joint Crusade Accord"
 STATIC_MODIFIER_DESC_oe_rc2_iberia_accord_mod: "Coordinating reconquest boundaries with Iberian crowns dampens western hostility and steadies imperial vassals."
 STATIC_MODIFIER_NAME_oe_rc2_iberia_spania_mod: "Legacy of Justinian's Spania"
 STATIC_MODIFIER_DESC_oe_rc2_iberia_spania_mod: "Proclaiming direct descent from Justinian's Province of Spania steels the legions and sharpens imperial treaty claims."
 STATIC_MODIFIER_NAME_oe_rc2_iberia_strait_mod: "Toll of the Pillars of Hercules"
 STATIC_MODIFIER_DESC_oe_rc2_iberia_strait_mod: "Imperial squadrons at Gibraltar and Cartagena levy tolls on Atlantic-Mediterranean shipping and extend oceanic trade reach."
 STATIC_MODIFIER_NAME_oe_rc2_gaul_claim_mod: "Shattered Shadow of Charlemagne"
 STATIC_MODIFIER_DESC_oe_rc2_gaul_claim_mod: "Declaring the Frankish imperial title void rallies Roman pride across the legions while provoking Western Europe."
 STATIC_MODIFIER_NAME_oe_rc2_gaul_nobles_mod: "Gallican Noble Conciliation Charter"
 STATIC_MODIFIER_DESC_oe_rc2_gaul_nobles_mod: "Confirming provincial parlements and noble estates under Roman law pacifies Gaul and accelerates administrative control."
 STATIC_MODIFIER_NAME_oe_rc2_gaul_trade_mod: "Lyon-Marseille Rhone Trade Charter"
 STATIC_MODIFIER_DESC_oe_rc2_gaul_trade_mod: "Linking Marseille's docks with the fairs of Lyon channels western European textiles and silver into imperial coffers."
 STATIC_MODIFIER_NAME_oe_rc2_britain_naval_mod: "Channel Naval Domination Charter"
 STATIC_MODIFIER_DESC_oe_rc2_britain_naval_mod: "Ocean-going imperial squadrons master the Narrow Seas, safeguarding cross-Channel logistics at lower upkeep."
 STATIC_MODIFIER_NAME_oe_rc2_britain_client_mod: "Britannic Client Crown & Hadrianic Limes"
 STATIC_MODIFIER_DESC_oe_rc2_britain_client_mod: "Restoring northern border garrisons and autonomous Britannic governance fortifies the frontier and reassures client realms."
 STATIC_MODIFIER_NAME_oe_rc2_britain_monopoly_mod: "Imperial Tin & Wool Staple Monopoly"
 STATIC_MODIFIER_DESC_oe_rc2_britain_monopoly_mod: "Imperial staple courts monopolize Cornish tin and English wool exports across continental markets."
 STATIC_MODIFIER_NAME_oe_rc2_persia_seleucid_mod: "Seleucid-Roman Eastern Frontier Mandate"
 STATIC_MODIFIER_DESC_oe_rc2_persia_seleucid_mod: "Invoking Alexander, Trajan, and Heraclius steelens the eastern tagmata and widens recruitment across Mesopotamia."
 STATIC_MODIFIER_NAME_oe_rc2_persia_accord_mod: "Euphrates Partition & Dual-Court Accord"
 STATIC_MODIFIER_DESC_oe_rc2_persia_accord_mod: "A formal treaty respecting Persian court dignity along the Zagros eases war weariness and quiets Mesopotamian unrest."
 STATIC_MODIFIER_NAME_oe_rc2_persia_silk_mod: "Tigris & Silk Caravan Protectorate"
 STATIC_MODIFIER_DESC_oe_rc2_persia_silk_mod: "Guarded caravanserais from Tabriz to Baghdad channel Persian silk and Indian wares directly into imperial markets."
 STATIC_MODIFIER_NAME_oe_rc2_arabia_spice_mod: "Aden-Suez Spice Corridor Charter"
 STATIC_MODIFIER_DESC_oe_rc2_arabia_spice_mod: "Direct imperial shipping links from Aden to Suez unlock Indian Ocean spice routes and maritime merchant influence."
 STATIC_MODIFIER_NAME_oe_rc2_arabia_foederati_mod: "Ghassanid-Arab Desert Foederati"
 STATIC_MODIFIER_DESC_oe_rc2_arabia_foederati_mod: "Reviving the ancient Ghassanid phylarchate grants unrivaled desert scouts, cutting arid attrition and speeding marches."
 STATIC_MODIFIER_NAME_oe_rc2_arabia_truce_mod: "Holy Cities Truce & Pilgrim Safe-Conduct"
 STATIC_MODIFIER_DESC_oe_rc2_arabia_truce_mod: "Protecting pilgrim caravans to Mecca and Medina under imperial safe-conduct sharply reduces hostility across the Islamic world."
 STATIC_MODIFIER_NAME_oe_rc2_blacksea_bastion_mod: "Cherson & Tauric Naval Bastion"
 STATIC_MODIFIER_DESC_oe_rc2_blacksea_bastion_mod: "Fortified Crimean harbors and swift Black Sea dromons lock down the northern shore against steppe and corsair raids."
 STATIC_MODIFIER_NAME_oe_rc2_blacksea_buffer_mod: "Pontic Steppe Buffer & Frontier Cavalry"
 STATIC_MODIFIER_DESC_oe_rc2_blacksea_buffer_mod: "Recruiting Pontic frontier horsemen expands manpower reserves and equips imperial columns for steppe mobility."
 STATIC_MODIFIER_NAME_oe_rc2_blacksea_emporium_mod: "Black Sea Silk & Crimean Grain Emporium"
 STATIC_MODIFIER_DESC_oe_rc2_blacksea_emporium_mod: "Grain barges from the Azov plains and steppe silk caravans turn the Black Sea into an imperial commercial lake."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage1_mod: "Stage I: Military Occupation & Garrison Friction"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage1_mod: "Newly seized reconquest territories require heavy garrison upkeep while stubborn local resistance smolders."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage1_governor_mod: "Stage I: Theme Governors & Garrison Cadastre"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage1_governor_mod: "Appointed strategoi survey newly acquired districts, curbing occupation friction and steadily building imperial control."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage1_concil_mod: "Stage I: Municipal Tax Holiday & Conciliation"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage1_concil_mod: "Temporary tax concessions calm conquered burghers and restore prosperity at the cost of reduced fiscal returns."
 STATIC_MODIFIER_NAME_oe_rc2_martial_levy_mod: "Punitive War Requisition & Martial Law"
 STATIC_MODIFIER_DESC_oe_rc2_martial_levy_mod: "Harsh military requisitions enforce immediate crown obedience while stoking resentment among conquered towns."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage2_civil_mod: "Stage II: Praetorian Civil Fiscal Charter"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage2_civil_mod: "A civil praetorian administration rationalizes tax rolls, revitalizes urban markets, and widens imperial reach."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage2_military_mod: "Stage II: Stratiotai Military Theme Charter"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage2_military_mod: "Soldier-farmers settle frontier estates along the reconquered theater, supplying sturdy levies and suppressing revolt."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage2_judicial_mod: "Stage II: Basilika Imperial Law Charter"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage2_judicial_mod: "Uniform Roman courts replace feudal custom across the theater, fostering cultural integration and crown authority."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage3_citizenship_mod: "Stage III: Imperial Citizenship & Senatorial Incorporation"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage3_citizenship_mod: "Full Roman citizenship and senatorial representation turn former conquest zones into loyal pillars of the restored empire."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage3_demesne_mod: "Stage III: Crown Imperial Demesne Incorporation"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage3_demesne_mod: "Direct integration into the imperial fisc delivers enduring tax revenue and concentrated crown authority."
 STATIC_MODIFIER_NAME_oe_rc2_digest_stage3_autonomy_mod: "Stage III: Cosmopolitan Provincial Commonwealth"
 STATIC_MODIFIER_DESC_oe_rc2_digest_stage3_autonomy_mod: "Chartered provincial autonomy weaves local merchants and nobles into a prosperous, peaceful imperial commonwealth."
 STATIC_MODIFIER_NAME_oe_rc2_incorporated_province_loc_mod: "Incorporated Roman Imperial Province"
 STATIC_MODIFIER_DESC_oe_rc2_incorporated_province_loc_mod: "Having completed military pacification and thematic chartering, this district enjoys lasting imperial order, prosperity, and Roman civic life."
 oe_rc2_dec_supply_doctrine.title: "Adjust Imperial Expedition Supply Doctrine"
 oe_rc2_dec_supply_doctrine.desc: "Convene the Logothetes of the Army to set Constantinople's logistical commitment for overseas campaigns and expeditionary subjects: Generous Commissariat, Standard Provincial Requisition, or Austerity Foraging (12-month cooldown)."
 oe_rc2_dec_supply_doctrine.a: "Convene the Imperial Commissariat"
 oe_rc2_dec_consolidate_frontiers.title: "Rest, Consolidate & Reorganize the Frontiers"
 oe_rc2_dec_consolidate_frontiers.desc: "While the empire is at peace with no active regional campaigns, invest 150 gold to clear Imperial Overextension Fatigue, soothe war-weary estates, restore provincial control, and accelerate ongoing post-conquest settlement (5-year cooldown)."
 oe_rc2_dec_consolidate_frontiers.a: "Order Imperial Consolidation"
 oe_rc2_dec_provincial_settlement.title: "Advance Post-Conquest Provincial Settlement"
 oe_rc2_dec_provincial_settlement.desc: "Invest 200 gold once a conquered reconquest theater has weathered at least 4 years of administration to advance directly from Stage I Military Administration to Stage II Theme/Exarchate Structuring, or from Stage II to Stage III Full Imperial Provincial Incorporation."
 oe_rc2_dec_provincial_settlement.a: "Dispatch Imperial Commissioners"
 oe_rc2.1.t: "The Imperial Mandate: Campaign Strategy"
 oe_rc2.1.d: "The standards of the Basileus stand unfurled along the frontier, and the strategoi await your final strategic directive for this theater. Shall imperial envoys precede the eagles with formal charters of submission, shall our gold fracture enemy garrisons from within, or shall we proclaim an uncompromising Decree of Total Reconquista?"
 oe_rc2.1.a: "Imperial Ultimatum & Subjugation Charter"
 oe_rc2.1.b: "Divide & Subvert Local Factions"
 oe_rc2.1.c: "Total Reconquista Decree — Blitz Offensive"
 oe_rc2.2.t: "Imperial Commissariat: Expeditionary Supply Doctrine"
 oe_rc2.2.d: "Maintaining imperial armies and expeditionary subjects beyond the Aegean drains grain fleets and nomismata alike. The Logothete of the Military lays three logistical ledgers before the throne: full imperial funding, balanced provincial requisition, or harsh austerity that forces commanders to live off enemy soil—at the peril of mutiny."
 oe_rc2.2.a: "Generous Imperial Commissariat (High Upkeep, Loyal & Strong Forces)"
 oe_rc2.2.b: "Standard Provincial Requisition (Balanced)"
 oe_rc2.2.c: "Austerity: Live Off the Land (Saves Treasury, Mutiny Risk)"
 oe_rc2.3.t: "Shadow of Belisarius & Narses: Restless Expeditionary Marshals"
 oe_rc2.3.d: "Starved of regular remittances from Constantinople, the expeditionary camps have turned sullen and self-willed. Whispers reach the Great Palace that victorious strategoi are distributing plunder in their own names, echoing the old imperial dread of victorious generals who forget who wears the purple."
 oe_rc2.3.a: "Dispatch an Emergency Donative & Restore Generous Supply"
 oe_rc2.3.b: "Recall & Purge the Suspected Strategoi"
 oe_rc2.3.c: "Grant Field Commanders Autonomous Spoils Rights"
 oe_rc2.11.t: "Italy: The Papacy & the Lombard Cities"
 oe_rc2.11.d: "As imperial banners press across the peninsula toward Ravenna, Naples, and the banks of the Tiber, Italy's political crossroads lays itself bare. The Roman Curia hints at a restored Pentarchic compromise, hardline Latin princes rally a crusade against Greek rule, and the rich Lombard and maritime guilds test what liberties an Eastern Basileus will confirm."
 oe_rc2.11.a: "Reconcile Rome & Restore the Pentarchic Accord"
 oe_rc2.11.b: "Crush the Latin Coalition by Imperial Right"
 oe_rc2.11.c: "Seal the Lombard & Maritime Guild Compact"
 oe_rc2.12.t: "Egypt: The Nile Granary & Alexandrian Patriarchate"
 oe_rc2.12.d: "The fertile Delta and the ancient harbor of Alexandria once again hear Greek commands. Imperial officials survey the silted granaries that fed Rome for seven centuries, while Coptic bishops and Karimi spice factors wait to see whether Constantinople will revive the Annona grain fleet, grant Coptic autonomy, or monopolize Red Sea customs."
 oe_rc2.12.a: "Restore the Imperial Annona Grain Fleet"
 oe_rc2.12.b: "Enact the Coptic Autonomy & Patriarchate Compact"
 oe_rc2.12.c: "Establish the Red Sea Customs & Spice Monopoly"
 oe_rc2.13.t: "Africa: Carthage Exarchate & the Barbary Corsairs"
 oe_rc2.13.d: "From Tripoli to the ruins of Carthage and the corsair coves of the Maghreb, imperial eagles return to Belisarius's first western triumph. Rebuilding the Exarchate's fleet could sweep piracy from the central sea, whereas a charter with inland Berber tribes or revived coastal grain ports offers quieter paths to lasting mastery."
 oe_rc2.13.a: "Rebuild the Carthage Exarchate War Fleet"
 oe_rc2.13.b: "Grant the Berber Foederati Frontier Charter"
 oe_rc2.13.c: "Charter the Mediterranean Grain & Olive Ports"
 oe_rc2.14.t: "Iberia: Reconquista Clash & the Pillars of Hercules"
 oe_rc2.14.d: "Imperial legions crossing into Hispania collide directly with the proud Iberian crowns forged by centuries of Reconquista. Envoys debate whether to negotiate a joint Christian crusade partition, assert Justinian's unbroken claim to the Province of Spania, or seize toll supremacy over the Pillars of Hercules."
 oe_rc2.14.a: "Negotiate a Joint Crusade Accord with Iberian Crowns"
 oe_rc2.14.b: "Claim the Visigothic-Roman Legacy of Spania"
 oe_rc2.14.c: "Enforce Strait Toll Supremacy at the Pillars of Hercules"
 oe_rc2.15.t: "Gaul: Shadow of Charlemagne & the Rhone Valley"
 oe_rc2.15.d: "From Marseille up the Rhone toward Lyon and Paris, Roman roads still run beneath Frankish castles. Here the old quarrel over Charlemagne's coronation burns hottest: Constantinople may formally repudiate the Western imperial claim, conciliate the proud Gallican nobility, or bind the Rhone valley fairs to imperial commerce."
 oe_rc2.15.a: "Challenge & Void the Western Imperial Claim"
 oe_rc2.15.b: "Issue the Gallican Noble Conciliation Charter"
 oe_rc2.15.c: "Ratify the Lyon-Marseille Rhone Trade Charter"
 oe_rc2.16.t: "Britain: Hadrianic Frontier & Channel Supremacy"
 oe_rc2.16.d: "Beyond the stormy narrows of the English Channel lies Britannia, last abandoned by Honorius's legions nearly a millennium ago. Holding an island at the rim of the known world demands a decisive choice: invest in Channel naval domination, restore a fortified Britannic client kingdom, or monopolize Cornish tin and English wool."
 oe_rc2.16.a: "Enact the Channel Naval Domination Charter"
 oe_rc2.16.b: "Charter a Britannic Client Kingdom & Hadrianic Limes"
 oe_rc2.16.c: "Establish the Imperial Tin & Wool Monopoly"
 oe_rc2.17.t: "Persia: The Twin Eagles of Ctesiphon"
 oe_rc2.17.d: "Across the Euphrates and the ruins of ancient Ctesiphon, Rome confronts its oldest eastern rival once more. The imperial council divides sharply: proclaim the Seleucid-Roman frontier down to the Zagros, negotiate a dignified Euphrates partition accord, or turn Mesopotamia into a fortified silk caravan protectorate."
 oe_rc2.17.a: "Proclaim the Seleucid-Roman Eastern Frontier"
 oe_rc2.17.b: "Ratify the Euphrates Partition & Dual-Court Accord"
 oe_rc2.17.c: "Establish the Tigris Silk Caravan Protectorate"
 oe_rc2.18.t: "Arabia: The Red Sea Gate & Desert Caravans"
 oe_rc2.18.d: "From the incense ports of Aden to the holy roads of the Hejaz, imperial expeditions enter scorching expanses where logistics decide victory before swords ever cross. Constantinople can open an Aden-Suez spice corridor, revive the Ghassanid desert foederati, or guarantee a solemn truce and safe-conduct for pilgrim caravans."
 oe_rc2.18.a: "Open the Aden-Suez Spice Corridor Charter"
 oe_rc2.18.b: "Revive the Ghassanid-Arab Desert Foederati"
 oe_rc2.18.c: "Guarantee the Holy Cities Truce & Pilgrim Safe-Conduct"
 oe_rc2.19.t: "Black Sea: The Tauric Shield & Crimean Grain"
 oe_rc2.19.d: "Where the Pontic steppe meets the ports of Caffa, Soldaia, and Tana, Constantinople's ancient northern shield stands open to restoration. Imperial planners propose fortifying Cherson and Crimea as a naval bastion, raising Pontic frontier cavalry as a steppe buffer, or transforming the northern ports into a silk and grain emporium."
 oe_rc2.19.a: "Fortify the Cherson & Tauric Naval Bastion"
 oe_rc2.19.b: "Raise the Pontic Steppe Buffer & Frontier Cavalry"
 oe_rc2.19.c: "Charter the Black Sea Silk & Crimean Grain Emporium"
 oe_rc2.20.t: "Post-Conquest Stage I: Military Administration"
 oe_rc2.20.d: "The treaties are sealed, yet victory on the battlefield is only the beginning of empire. Broken walls, sullen burghers, and unmapped estates demand a decade of firm post-conquest digestion before the theater can join the regular Roman provincial order. How shall our initial military administration govern these newly won lands?"
 oe_rc2.20.a: "Appoint Theme Governors & Survey Garrison Cadastres"
 oe_rc2.20.b: "Impose Strict Martial Law & Punitive Requisitions"
 oe_rc2.20.c: "Grant Local Municipal Conciliation & Tax Holidays"
 oe_rc2.21.t: "Post-Conquest Stage II: Theme & Exarchate Structuring"
 oe_rc2.21.d: "Years of military pacification have broken open resistance across the conquered theater, allowing the imperial chancery to replace emergency occupation with permanent Roman institutions. Choose the provincial charter that will shape this exarchate: Civil Fiscal Prefecture, Military Stratiotai Theme, or Judicial Basilika Code."
 oe_rc2.21.a: "Civil Fiscal Charter — Praetorian Prefecture"
 oe_rc2.21.b: "Military Theme Charter — Stratiotai Exarchate"
 oe_rc2.21.c: "Judicial Imperial Code Charter — Basilika Law"
 oe_rc2.22.t: "Post-Conquest Stage III: Imperial Provincial Incorporation"
 oe_rc2.22.d: "Tax registers are settled, highways repaired, and local magistracies operate in the Basileus's name. The conquered theater has completed its long journey from battlefield frontier to full Imperial Province—ready to deliver durable fiscal, administrative, and civic rewards to the restored Roman realm."
 oe_rc2.22.a: "Grant Full Roman Citizenship & Senatorial Seats"
 oe_rc2.22.b: "Integrate Into the Crown Imperial Demesne"
 oe_rc2.22.c: "Charter a Cosmopolitan Provincial Commonwealth"
