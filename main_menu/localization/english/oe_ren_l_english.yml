l_english:
 oe_ren_b_italian_scholars: "Greek Scholars in Italy"
 oe_ren_b_italian_snub: "Withheld Greek Scholars"
 oe_ren_b_florence_bridge: "Florentine Humanist Bridge"
 oe_ren_b_universal_letters: "Graeco-Latin Republic of Letters"
 STATIC_MODIFIER_NAME_oe_ren_chrysoloras_embassy: "Chrysoloras's Florentine Chair"
 STATIC_MODIFIER_DESC_oe_ren_chrysoloras_embassy: "Sending Manuel Chrysoloras to teach Greek in Florence strengthens Italian ties and institution spread, at the cost of domestic clerical unease."
 STATIC_MODIFIER_NAME_oe_ren_imperial_chancery_letters: "Imperial Chancery Letters"
 STATIC_MODIFIER_DESC_oe_ren_imperial_chancery_letters: "Retaining Chrysoloras to train imperial secretaries boosts domestic literacy and research, while slowing external institution spread."
 STATIC_MODIFIER_NAME_oe_ren_mystras_circle: "Mystras Philosophical Circle"
 STATIC_MODIFIER_DESC_oe_ren_mystras_circle: "Scholars gathering in Mystras elevate local literacy and book output while unsettling local conservatives."
 STATIC_MODIFIER_NAME_oe_ren_plethon_memoranda: "Trial of Plethon's Memoranda"
 STATIC_MODIFIER_DESC_oe_ren_plethon_memoranda: "Testing Plethon's citizen-militia and unified tax proposals bolsters manpower, tax efficiency, and research, provoking noble and clerical backlash."
 STATIC_MODIFIER_NAME_oe_ren_classical_patronage: "Patronage of Classical Letters"
 STATIC_MODIFIER_DESC_oe_ren_classical_patronage: "Sponsoring classical scholarship while shelving radical agrarian reform expands cultural influence at modest fiscal cost."
 STATIC_MODIFIER_NAME_oe_ren_orthodox_jurisprudence: "Orthodox Jurisprudence Upheld"
 STATIC_MODIFIER_DESC_oe_ren_orthodox_jurisprudence: "Reaffirming patristic orthodoxy and imperial law steadies the realm and pleases the clergy, slowing innovation and institution spread."
 STATIC_MODIFIER_NAME_oe_ren_acad_orthodox: "Patriarchal Pandidakterion"
 STATIC_MODIFIER_DESC_oe_ren_acad_orthodox: "Reopening the Imperial University under Patriarchal supervision advances literacy and orthodoxy while restraining foreign currents."
 STATIC_MODIFIER_NAME_oe_ren_acad_platonic: "Platonic Chairs of the Pandidakterion"
 STATIC_MODIFIER_DESC_oe_ren_acad_platonic: "Endowing chairs of Platonic philosophy accelerates research, literacy, and cultural tradition, while antagonizing the clergy and straining stability."
 STATIC_MODIFIER_NAME_oe_ren_acad_humanist: "Bilingual Chairs of the Golden Horn"
 STATIC_MODIFIER_DESC_oe_ren_acad_humanist: "Hosting Greek and Latin chairs together accelerates institution spread and commerce, at the cost of clerical discontent and legitimacy strain."
 STATIC_MODIFIER_NAME_oe_ren_scholarios_rigor: "Scholarios's Palamite Rigor"
 STATIC_MODIFIER_DESC_oe_ren_scholarios_rigor: "Backing Gennadios Scholarios's synthesis of Aristotelian logic and Palamite theology strengthens Orthodox cohesion while cooling Western ties."
 STATIC_MODIFIER_NAME_oe_ren_bessarion_bridge: "Bessarion's Graeco-Latin Bridge"
 STATIC_MODIFIER_DESC_oe_ren_bessarion_bridge: "Channeling Cardinal Bessarion's scholarly bridge speeds Renaissance adoption and diplomacy, while testing Orthodox trust at home."
 STATIC_MODIFIER_NAME_oe_ren_plethon_florence: "Plethon's Platonic Lectures"
 STATIC_MODIFIER_DESC_oe_ren_plethon_florence: "Plethon's lectures dazzle Italian humanists and exalt Greek prestige, while alarming Orthodox clergy over heterodox philosophy."
 STATIC_MODIFIER_NAME_oe_ren_nomoi_burned: "Burning of the Nomoi"
 STATIC_MODIFIER_DESC_oe_ren_nomoi_burned: "Publicly burning Plethon's Nomoi reassures the Church and steadies the realm, chilling philosophical inquiry and cultural vitality."
 STATIC_MODIFIER_NAME_oe_ren_nomoi_sealed: "Nomoi Sealed in the Palace Archive"
 STATIC_MODIFIER_DESC_oe_ren_nomoi_sealed: "Confining the Nomoi to the imperial archive preserves rare scholarship while containing scandal, though the clergy remain suspicious."
 STATIC_MODIFIER_NAME_oe_ren_nomoi_open: "Open Study of the Nomoi"
 STATIC_MODIFIER_DESC_oe_ren_nomoi_open: "Protecting open study of Plethon's radical treatise ignites an intellectual surge, at the cost of fierce clerical outrage and domestic unrest."
 STATIC_MODIFIER_NAME_oe_ren_golden_horn_press: "Golden Horn Greek Printing Press"
 STATIC_MODIFIER_DESC_oe_ren_golden_horn_press: "Constantinople's bilingual movable-type press pours out classical editions and spreads the Renaissance, while stirring urban pamphlet unrest."
 STATIC_MODIFIER_NAME_oe_ren_patristic_press: "Patristic & Liturgical Press"
 STATIC_MODIFIER_DESC_oe_ren_patristic_press: "Restricting the imperial press to scripture and patristics bolsters conversion and book output, while braking secular research and spread."
 STATIC_MODIFIER_NAME_oe_ren_hellenic_press: "Hellenic Mathematical & Classical Press"
 STATIC_MODIFIER_DESC_oe_ren_hellenic_press: "Printing classical philosophy and mathematics boosts books, literacy, and research, at the expense of clerical trust and tax efficiency."
 STATIC_MODIFIER_NAME_oe_ren_scholars_returned: "Return of the Greek Scholars"
 STATIC_MODIFIER_DESC_oe_ren_scholars_returned: "With Constantinople resilient, Argyropoulos and Lascaris remain in imperial service, fueling research and institutions at heavy patronage cost."
 STATIC_MODIFIER_NAME_oe_ren_italian_exchange: "Graeco-Italian Scholarly Exchange"
 STATIC_MODIFIER_DESC_oe_ren_italian_exchange: "Formal scholarly exchanges with Florence and Venice boost trade and Renaissance spread, though partial talent outflow trims domestic research."
 STATIC_MODIFIER_NAME_oe_ren_scholar_diaspora: "Westward Diaspora of Greek Scholars"
 STATIC_MODIFIER_DESC_oe_ren_scholar_diaspora: "Hardship drives Greek luminaries and manuscripts westward to Italy, impairing research and institution growth while inward piety hardens."
 STATIC_MODIFIER_NAME_oe_ren_athos_renewal: "Athonite Hesychast Renewal"
 STATIC_MODIFIER_DESC_oe_ren_athos_renewal: "Endowing Mount Athos fortifies Orthodox unity and stability, while dampening secular research and burgher enthusiasm."
 STATIC_MODIFIER_NAME_oe_ren_manuscript_catalog: "Imperial Monastic Manuscript Survey"
 STATIC_MODIFIER_DESC_oe_ren_manuscript_catalog: "Cataloging ancient Greek codices across monastic libraries boosts literacy, research, and spread, irritating monastic autonomy."
 STATIC_MODIFIER_NAME_oe_ren_guarded_academy: "Imperial Guard Protecting the Academy"
 STATIC_MODIFIER_DESC_oe_ren_guarded_academy: "Suppressing forum riots by force keeps scholarly chairs open, leaving bitter clerical resentment and heightened rebel growth."
 STATIC_MODIFIER_NAME_oe_ren_compromised_curia: "Conciliatory Edict Curbing Tracts"
 STATIC_MODIFIER_DESC_oe_ren_compromised_curia: "Appeasing the estates and curbing radical tracts restores calm and clerical goodwill, at the cost of slower research and institution spread."
 STATIC_MODIFIER_NAME_oe_ren_academy_patronage: "Imperial Academy Endowment"
 STATIC_MODIFIER_DESC_oe_ren_academy_patronage: "Treasury grants expand lectures and scriptoria, raising literacy and research at a steady fiscal and clerical cost."
 STATIC_MODIFIER_NAME_oe_ren_summoned_scholars: "Summoned Scholars of the Empire"
 STATIC_MODIFIER_DESC_oe_ren_summoned_scholars: "Recruiting Greek and Italian savants accelerates institution growth and trims advisor costs, unsettling the domestic clergy."
 STATIC_MODIFIER_NAME_oe_ren_school_hesychast: "School Ascendant: Orthodox Hesychasm"
 STATIC_MODIFIER_DESC_oe_ren_school_hesychast: "The Palamite-Scholarios synthesis anchors clergy loyalty, faith, stability, and legitimacy, trading away Renaissance spread and research pace."
 STATIC_MODIFIER_NAME_oe_ren_school_neoplatonic: "School Ascendant: Mystras Neo-Platonism"
 STATIC_MODIFIER_DESC_oe_ren_school_neoplatonic: "Plethon's Neo-Platonic Hellenic revival drives research, literacy, culture, and citizen manpower, provoking severe clerical and noble friction."
 STATIC_MODIFIER_NAME_oe_ren_school_humanist: "School Ascendant: Graeco-Latin Humanism"
 STATIC_MODIFIER_DESC_oe_ren_school_humanist: "The Chrysoloras-Bessarion school turns the empire into an East-West humanist hub, speeding institutions and trade while testing Orthodox purists."
 STATIC_MODIFIER_NAME_oe_ren_culm_hesychast: "Triumph of the Orthodox Renaissance"
 STATIC_MODIFIER_DESC_oe_ren_culm_hesychast: "Constantinople and Mount Athos forge an enduring Roman-Orthodox synthesis of unmatched stability, faith, and legitimacy, accepting slower Western secular adoption."
 STATIC_MODIFIER_NAME_oe_ren_culm_neoplatonic: "Triumph of the Hellenic Neo-Platonic Renaissance"
 STATIC_MODIFIER_DESC_oe_ren_culm_neoplatonic: "The flame lit in Mystras remakes the empire in classical Hellenic vigor—accelerating research, literacy, culture, manpower, and tax—while leaving deep clerical and noble resentment."
 STATIC_MODIFIER_NAME_oe_ren_culm_humanist: "Triumph of the Graeco-Latin Universal Renaissance"
 STATIC_MODIFIER_DESC_oe_ren_culm_humanist: "Constantinople stands beside Florence as twin capitals of the Renaissance—excelling in institution spread, diplomacy, literacy, and trade—while Orthodox purists remain wary."
 STATIC_MODIFIER_NAME_oe_ren_culm_compromise: "Pragmatic Settlement of the Great Debate"
 STATIC_MODIFIER_DESC_oe_ren_culm_compromise: "High tension or instability prevented a sweeping triumph; the realm settles on a cautious compromise that preserves modest learning alongside mild institutional drag."
 STATIC_MODIFIER_NAME_oe_ren_bosporus_seat: "Bosporus Seat of the Renaissance"
 STATIC_MODIFIER_DESC_oe_ren_bosporus_seat: "Constantinople's revived university, scriptoria, and presses anchor an eastern Renaissance beacon of literacy, books, trade, and bustling urban ferment."
