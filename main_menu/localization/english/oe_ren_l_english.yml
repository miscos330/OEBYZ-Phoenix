 oe_ren_cl_un_made: "Though the Union of Florence was proclaimed, suspicion of Latinization burns hotter across the City."
 oe_ren_cl_un_void: "With the Union of Florence rejected, anti-unionist sentiment rides high and Bessarion's circle treads carefully."
 oe_ren_cl_un_open: "With East-West church talks still unsettled, theological polemic and classical humanism entwine."
 oe_ren_cl_city_strong: "Constantinople stands firm and prosperous enough to bid for the loyalty of its greatest minds."
 oe_ren_cl_city_fragile: "Though Constantinople still flies the imperial banner, war and empty coffers tempt its scholars westward."
 oe_ren_cl_city_lost: "With Constantinople lost, an exiled court can scarcely stem the dispersion of Greek letters to Italy."
 oe_ren_dec_patronize_academy.title: "Patronize the Imperial Academy"
 oe_ren_dec_patronize_academy.desc: "Spend #R 150#! gold to expand the chairs and scriptoria of the Pandidakterion, raising Academy Tier and advancing Renaissance progress in Constantinople, with a #Y 10#!-year patronage modifier (+literacy & research; trade-off: −tax efficiency & −clergy satisfaction). Usable once every #Y 5#! years."
 oe_ren_dec_patronize_academy.a: "Endow the Imperial Chairs"
 oe_ren_dec_summon_scholars.title: "Summon Scholars to Mystras & the City"
 oe_ren_dec_summon_scholars.desc: "Spend #R 120#! gold and a modest stability cost to summon Greek and Italian scholars to Constantinople and Mystras, boosting Renaissance spread across core Greek cities while shifting influence toward Humanism and Neo-Platonism (tension #R +6#!)."
 oe_ren_dec_summon_scholars.a: "Issue Imperial Summons to the Scholars"
 oe_ren_dec_fund_greek_press.title: "Fund the Greek Printing Press"
 oe_ren_dec_fund_greek_press.desc: "From #Y 1455#!, spend #R 200#! gold and weather clerical displeasure to establish Constantinople's first Greek movable-type workshop, propelling Renaissance progress and unlocking the 'Imperial Scriptorium & Greek Press' cabinet action."
 oe_ren_dec_fund_greek_press.a: "Cast the Greek Type on the Golden Horn"
 oe_ren_imperial_scriptorium: "Imperial Scriptorium & Greek Press"
 oe_ren_imperial_scriptorium_desc: "Directs Constantinople's scriptoria and movable-type workshops to accelerate institution spread, books output, and literacy; trade-off: lower clergy satisfaction."
 oe_ren_imperial_scriptorium_action: "$oe_ren_imperial_scriptorium$"
 oe_ren_imperial_scriptorium_active: "Directing the Imperial Scriptorium & Press"
 oe_ren_imperial_scriptorium_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 oe_ren_imperial_scriptorium_action_progress_wordier: "Imperial Scriptorium & Greek Press"
 oe_ren_imperial_scriptorium_action_progress_long_wordier: "Imperial Scriptorium & Greek Press"
 oe_ren_imperial_scriptorium_action_progress_tooltip: "Directs Constantinople's scriptoria and movable-type workshops to accelerate institution spread, books output, and literacy; trade-off: lower clergy satisfaction."
 oe_ren_philosophical_seminar: "Mystras–Constantinople Philosophical Seminar"
 oe_ren_philosophical_seminar_desc: "Convenes imperial savants and visiting envoys for classical disputation, boosting research, cultural influence, and diplomatic reputation; trade-off: higher stability costs."
 oe_ren_philosophical_seminar_action: "$oe_ren_philosophical_seminar$"
 oe_ren_philosophical_seminar_active: "Convening the Philosophical Seminar"
 oe_ren_philosophical_seminar_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('research_speed_modifier')]"
 oe_ren_philosophical_seminar_action_progress_wordier: "Mystras–Constantinople Philosophical Seminar"
 oe_ren_philosophical_seminar_action_progress_long_wordier: "Mystras–Constantinople Philosophical Seminar"
 oe_ren_philosophical_seminar_action_progress_tooltip: "Convenes imperial savants and visiting envoys for classical disputation, boosting research, cultural influence, and diplomatic reputation; trade-off: higher stability costs."
 oe_ren.1.t: "Chrysoloras's Journey to Florence"
 oe_ren.1.d: "Chancellor Coluccio Salutati of Florence has written to Constantinople inviting the imperial scholar-diplomat Manuel Chrysoloras to hold a public chair of Greek along the Arno. Sending him may win Italian goodwill and open a channel to Western learning—yet keeping his counsel in Constantinople or dispatching him to Mystras carries its own promise and cost."
 oe_ren.1.a: "Send Chrysoloras to Florence as Scholar-Envoy"
 oe_ren.1.a.tt: "Graeco-Latin Humanism #G +12#!, Hesychasm #R -5#!, tension #R +5#!; #G +15#! opinion with FLO, VEN, GEN & PAP; gain 'Chrysoloras's Florentine Chair' for #Y 15#! years (#Y +10%#! institution growth, #G +1#! dip rep; trade-off: #Y −4%#! clergy satisfaction & −religious influence)."
 oe_ren.1.b: "Retain Chrysoloras in the Imperial Chancery"
 oe_ren.1.b.tt: "Costs #R 60#! gold; Hesychasm #G +8#!, Neo-Platonism #G +5#!, Humanism #R -8#!, tension #G -5#!; gain 'Imperial Chancery Letters' for #Y 15#! years (#Y +4%#! research, +monthly literacy; trade-off: #Y −5%#! institution growth, #R −10#! FLO opinion)."
 oe_ren.1.c: "Dispatch Him to the Circle of Mystras"
 oe_ren.1.c.tt: "Costs #R 40#! gold; Mystras Neo-Platonism #G +12#!, Hesychasm #R -6#!, tension #R +8#!; Mystras gains 'Mystras Philosophical Circle' for #Y 15#! years (+literacy & books output; trade-off: +local unrest)."
 oe_ren.2.t: "Gemistus Plethon's Memoranda from Mystras"
 oe_ren.2.d: "From Mystras, the philosopher George Gemistus Plethon has presented his famous Memoranda on Peloponnesian reform. Denouncing mercenaries and magnate monopolies, he urges a native citizen-militia, land reform with a single in-kind tax, and a council of learned advisors. Magnates and bishops alike recoil at his sweeping challenge to landed privilege and church law."
 oe_ren.2.a: "Trial Plethon's Citizen-Militia & Tax Reform"
 oe_ren.2.a.tt: "Costs #R 80#! gold; Neo-Platonism #G +18#!, Hesychasm #R -10#!, tension #R +16#!, Patriarchate standing #R -5#!; clergy & noble satisfaction falls; gain 'Trial of Plethon's Memoranda' for #Y 15#! years (#G +8%#! manpower, #G +6%#! tax, #G +5%#! research; trade-off: #Y −6%#! nobles/clergy satisfaction & +rebel growth)."
 oe_ren.2.b: "Praise His Classical Learning, Shelve the Land Reform"
 oe_ren.2.b.tt: "Costs #R 30#! gold; Humanism #G +8#!, Neo-Platonism #G +5#!, tension #R +5#!; gain 'Patronage of Classical Letters' for #Y 15#! years (+literacy & cultural influence; trade-off: #R −3%#! tax efficiency)."
 oe_ren.2.c: "Reprimand His Innovations and Uphold Orthodox Law"
 oe_ren.2.c.tt: "Hesychasm #G +15#!, Neo-Platonism #R -12#!, tension #G -8#!, Patriarchate standing #G +5#!; gain 'Orthodox Jurisprudence Upheld' for #Y 15#! years (+stability cost efficiency & clergy satisfaction; trade-off: #Y −5%#! research & #Y −6%#! institution growth)."
 oe_ren.3.t: "The Imperial Academy Reborn"
 oe_ren.3.d: "Founded by Theodosius II a millennium ago, the Imperial University of Constantinople—the Pandidakterion—awaits formal revival. Scholars petition the throne to reopen its halls of rhetoric, law, philosophy, and theology, yet three factions vie to write its charter."
 oe_ren.3.a: "Charter the Academy under Patriarchal Oversight"
 oe_ren.3.a.tt: "Costs #R 90#! gold; Academy Tier #G +1#!, Hesychasm #G +12#!, tension #G -5#!, Patriarchate standing #G +4#!; gain 'Patriarchal Pandidakterion' for #Y 20#! years (+literacy, clergy satisfaction & conversion; trade-off: #Y −5%#! institution growth)."
 oe_ren.3.b: "Open Chairs of Platonic Philosophy & Hellenic Law"
 oe_ren.3.b.tt: "Costs #R 120#! gold; Academy Tier #G +1#!, Neo-Platonism #G +14#!, tension #R +12#!, Patriarchate standing #R -4#!; gain 'Platonic Chairs of the Pandidakterion' for #Y 20#! years (#Y +7%#! research, literacy & cultural tradition; trade-off: #Y −7%#! clergy satisfaction & #R −4%#! stability efficiency)."
 oe_ren.3.c: "Invite Bilingual Greek & Latin Chairs"
 oe_ren.3.c.tt: "Costs #R 110#! gold; Academy Tier #G +1#!, Humanism #G +14#!, tension #R +8#!, boosts Renaissance progress in Constantinople; gain 'Bilingual Chairs of the Golden Horn' for #Y 20#! years (#Y +15%#! institution growth, #R −8%#! embrace cost, +trade power; trade-off: #Y −5%#! clergy satisfaction & −legitimacy)."
 oe_ren.4.t: "Council of Florence: Scholars in Dispute"
 oe_ren.4.d: "The debates surrounding the Council of Ferrara-Florence have grown far beyond dogma into a clash of the empire's three foremost minds. [ROOT.GetCountry.Custom('OeRenUnionContext')] Gennadios Scholarios defends Palamite orthodoxy with Aristotelian precision; Bessarion calls for a bridge of Greek and Latin letters; and aged Plethon lectures Florentine notables on Plato."
 oe_ren.4.a: "Back Scholarios: Palamite Orthodoxy & Aristotelian Rigor"
 oe_ren.4.a.tt: "Hesychasm #G +16#!, Neo-Platonism #R -8#!, Humanism #R -6#!, tension #G -8#!, Patriarchate standing #G +6#!; gain 'Scholarios's Palamite Rigor' for #Y 15#! years (#Y +1#! tolerance own, #Y +6%#! clergy satisfaction; trade-off: #Y −8%#! institution growth & #Y −1#! dip rep)."
 oe_ren.4.b: "Back Bessarion's Graeco-Latin Humanist Bridge"
 oe_ren.4.b.tt: "Humanism #G +16#!, Hesychasm #R -8#!, tension #R +10#! (#R +16#! if Union proclaimed); #G +20#! opinion with FLO/VEN/GEN/PAP & Renaissance progress; gain 'Bessarion's Graeco-Latin Bridge' for #Y 15#! years (#Y +15%#! institution growth, #G +1#! dip rep; trade-off: #Y −8%#! clergy satisfaction & #Y −0.5#! tolerance own)."
 oe_ren.4.c: "Let Plethon Dazzle Florence with Plato"
 oe_ren.4.c.tt: "Neo-Platonism #G +14#!, Humanism #G +4#!, Hesychasm #R -6#!, tension #R +10#!, Patriarchate standing #R -4#!; gain prestige & 'Plethon's Platonic Lectures' for #Y 15#! years (#Y +10%#! cultural influence, #Y +5%#! research; trade-off: #Y −6%#! clergy satisfaction & −religious influence)."
 oe_ren.5.t: "Plethon's Nomoi: Fire or Archive?"
 oe_ren.5.d: "Following the death of Gemistus Plethon, the manuscript of his secret magnum opus—the Nomoi, or Book of Laws—has surfaced in Constantinople. Its startling blueprint for a Hellenic rationalist cosmos challenges Christian orthodoxy outright. Scholarios and the synod demand its immediate burning, while humanists and disciples plead that the manuscript be preserved."
 oe_ren.5.a: "Order Scholarios to Burn the Nomoi Publicly"
 oe_ren.5.a.tt: "Hesychasm #G +16#!, Neo-Platonism #R -18#!, tension #G -12#!, Patriarchate standing #G +8#!, +stability; gain 'Burning of the Nomoi' for #Y 15#! years (#Y +8%#! clergy satisfaction, #G +6%#! stability efficiency; trade-off: #Y −6%#! research & #Y −8%#! cultural tradition)."
 oe_ren.5.b: "Seal the Nomoi in the Imperial Palace Archive"
 oe_ren.5.b.tt: "Costs #R 40#! gold; Humanism #G +10#!, Neo-Platonism #G +4#!, tension #R +6#!, Patriarchate standing #R -3#!; gain 'Nomoi Sealed in the Palace Archive' for #Y 15#! years (#Y +4%#! research, #Y +5%#! institution growth; trade-off: #Y −4%#! clergy satisfaction)."
 oe_ren.5.c: "Defend Open Inquiry and Preserve the Nomoi"
 oe_ren.5.c.tt: "Neo-Platonism #G +22#!, Hesychasm #R -14#!, tension #R +24#!, Patriarchate standing #R -15#!, stability & clergy satisfaction hit; gain 'Open Study of the Nomoi' for #Y 20#! years (#Y +12%#! research, +literacy & cultural influence; trade-off: #Y −12%#! clergy satisfaction, #R −1.0#! tolerance own & +rebel growth)."
 oe_ren.6.t: "Printing Press of the Golden Horn"
 oe_ren.6.d: "Movable-type printing is sweeping Europe from the Rhine to northern Italy, and Venetian workshops already plan Greek typefaces to monopolize classical editions. Constantinopolitan scholars urge the throne to establish an imperial Greek press on the Golden Horn before the western republics claim the heritage of Greek print."
 oe_ren.6.a: "Charter an Imperial Bilingual Press on the Golden Horn"
 oe_ren.6.a.tt: "Costs #R 160#! gold; Academy Tier #G +1#!, Humanism #G +15#!, tension #R +8#!, boosts Renaissance progress; Constantinople permanently gains 'Golden Horn Greek Printing Press' (#Y +25%#! books, #Y +20%#! institution growth, +literacy; trade-off: +local unrest) and unlocks the Scriptorium cabinet action."
 oe_ren.6.b: "Restrict Printing to Liturgical & Patristic Texts"
 oe_ren.6.b.tt: "Costs #R 90#! gold; Hesychasm #G +14#!, tension #G -6#!, Patriarchate standing #G +5#!; gain 'Patristic & Liturgical Press' for #Y 20#! years (#Y +12%#! books, +conversion & clergy satisfaction; trade-off: #Y −6%#! institution growth & #Y −4%#! research), unlocking the Scriptorium cabinet action."
 oe_ren.6.c: "Fund Hellenic Mathematical & Classical Editions"
 oe_ren.6.c.tt: "Costs #R 130#! gold; Neo-Platonism #G +14#!, tension #R +10#!, Patriarchate standing #R -4#!; gain 'Hellenic Mathematical & Classical Press' for #Y 20#! years (#Y +15%#! books, #Y +6%#! research, +literacy; trade-off: #Y −6%#! clergy satisfaction & #R −4%#! tax efficiency), unlocking the Scriptorium cabinet action."
 oe_ren.7.t: "Greek Émigrés or Return of the Scholars?"
 oe_ren.7.d: "Across Italy, princely courts bid fiercely for Greek savants and ancient codices, sending offers to John Argyropoulos, Constantine Lascaris, and their peers. [ROOT.GetCountry.Custom('OeRenCityStrength')] Whether this generation stays on the Bosporus or departs for Italy will shape the geography of the Renaissance."
 oe_ren.7.a: "Recall Argyropoulos & Lascaris to Constantinople"
 oe_ren.7.a.tt: "Costs #R 180#! gold; Academy Tier #G +1#!, marks Scholars Retained, major Renaissance progress across Constantinople, Thessaloniki & Mystras; gain 'Return of the Greek Scholars' for #Y 25#! years (#Y +8%#! research, #Y +15%#! institution growth, #R −10%#! advisor cost; trade-off: #R −5%#! tax & #R −4%#! clergy satisfaction)."
 oe_ren.7.b: "Establish Scholarly Exchanges with Florence & Venice"
 oe_ren.7.b.tt: "Costs #R 60#! gold; Humanism #G +10#!, #G +15#! opinion with Italian states; gain 'Graeco-Italian Scholarly Exchange' for #Y 15#! years (#Y +10%#! institution growth, #G +8%#! trade power; trade-off: #Y −4%#! cultural tradition & #Y −3%#! research from partial outflow)."
 oe_ren.7.c: "Endure the Westward Diaspora of Scholars"
 oe_ren.7.c.tt: "No gold cost; Hesychasm #G +8#!, tension #G -6#!; suffer 'Westward Diaspora of Greek Scholars' for #Y 15#! years (#Y −6%#! research, #Y −8%#! institution growth; #Y +5%#! clergy satisfaction & #Y +0.5#! tolerance own)."
 oe_ren.8.t: "Athonite Monasteries & Hesychast Renewal"
 oe_ren.8.d: "While secular savants debate Plato and Latin eloquence in the cities, the great monasteries of Mount Athos petition the emperor and patriarch to anchor imperial learning in Hesychast spirituality. Imperial librarians, meanwhile, urge the court to dispatch auditors to catalog the ancient classical codices sleeping inside Athonite vaults."
 oe_ren.8.a: "Endow Athonite Scriptoria as Bastions of Orthodoxy"
 oe_ren.8.a.tt: "Costs #R 100#! gold; Hesychasm #G +16#!, Neo-Platonism #R -10#!, tension #G -10#!, Patriarchate standing #G +8#!; gain 'Athonite Hesychast Renewal' for #Y 20#! years (#Y +1#! tolerance own, #G +6%#! stability efficiency, #G +6%#! clergy satisfaction; trade-off: #Y −5%#! research & #Y −6%#! burgher satisfaction)."
 oe_ren.8.b: "Dispatch Imperial Auditors to Catalog Monastic Manuscripts"
 oe_ren.8.b.tt: "Costs #R 60#! gold; Neo-Platonism & Humanism #G +8#! each, Hesychasm #R -8#!, tension #R +10#!, Patriarchate standing #R -5#!; gain 'Imperial Monastic Manuscript Survey' for #Y 20#! years (+literacy, #Y +8%#! institution growth, #G +5%#! research; trade-off: #Y −6%#! clergy satisfaction)."
 oe_ren.9.t: "The Great Debate of Constantinople"
 oe_ren.9.d: "After decades of ferment, the halls of the Blachernae, Hagia Sophia, and the Pandidakterion can no longer straddle three irreconcilable visions of Roman renewal. Spokesmen of Palamite Hesychasm, Mystras Neo-Platonism, and Graeco-Latin Humanism stand before the throne awaiting a binding imperial decree.\n\n#T Current School Influence#!: Orthodox Hesychasm #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hes_val')|0]%#! | Mystras Neo-Platonism #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_neo_val')|0]%#! | Graeco-Latin Humanism #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hum_val')|0]%#!  Tension: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 100#!"
 oe_ren.9.a: "Crown the Orthodox Hesychast Synthesis"
 oe_ren.9.a.tt: "Locks the #Y Orthodox Hesychasm#! path and enters Stage #Y 4#!: #Y +8%#! clergy satisfaction, #G +1#! tolerance own, #G +8%#! stability efficiency, +legitimacy, Patriarchate standing #G +8#!; trade-off: #Y −12%#! institution growth, #R −5%#! research, #G +10%#! embrace cost."
 oe_ren.9.b: "Proclaim the Mystras Neo-Platonic Hellenic Revival"
 oe_ren.9.b.tt: "Locks the #Y Mystras Neo-Platonism#! path and enters Stage #Y 4#!: #Y +10%#! research, +monthly literacy, #Y +12%#! cultural influence, #Y +6%#! manpower; trade-off: tension #R +15#!, Patriarchate standing #R -10#!, #Y −10%#! clergy & #Y −6%#! noble satisfaction, #R −0.75#! tolerance own, +rebel growth."
 oe_ren.9.c: "Establish the Graeco-Latin Humanist Academy"
 oe_ren.9.c.tt: "Locks the #Y Graeco-Latin Humanism#! path and enters Stage #Y 4#!: #Y +20%#! institution growth, #R −12%#! embrace cost, #R +1.5#! dip rep, #R +10%#! trade power; trade-off: tension #R +8#!, #Y −8%#! clergy satisfaction, #R −0.5#! tolerance own, −religious influence & #R −4%#! stability efficiency."
 oe_ren.10.t: "Ideological Backlash in the Forum"
 oe_ren.10.d: "Years of ideological friction have spilled into the streets. Incensed monks, disgruntled magnates' retainers, and anti-Latin crowds pack the Forum of Constantine, burning pamphlets and demanding the dismissal of court savants. Left unchecked, runaway tension could derail the culmination of our Renaissance."
 oe_ren.10.a: "Enforce Order with the Guard and Defend the Scholars"
 oe_ren.10.a.tt: "Costs #R 120#! gold & stability; tension #G -10#!, Patriarchate standing #R -6#!; gain 'Imperial Guard Protecting the Academy' for #Y 10#! years (#Y +4%#! research; trade-off: #Y −6%#! clergy satisfaction & +rebel growth)."
 oe_ren.10.b: "Grant Concessions to the Estates and Curb Radical Tracts"
 oe_ren.10.b.tt: "Lose minor prestige; tension drops #G -28#!, Patriarchate standing #G +6#!; gain 'Conciliatory Edict Curbing Tracts' for #Y 10#! years (#Y +6%#! clergy satisfaction, #G +4%#! stability efficiency; trade-off: #Y −8%#! research & #Y −10%#! institution growth)."
 oe_ren.11.t: "Culmination: The Orthodox Renaissance"
 oe_ren.11.d: "A decade after the Great Debate, Constantinople and Mount Athos have forged a cohesive Roman-Orthodox synthesis. Aristotelian logic serves patristic theology, imperial law harmonizes with liturgy, and the Orthodox world once again looks to New Rome as its beacon of faith and order.\n\n#T Culmination Check#!: Ideological Tension #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 80#! (requires tension < #Y 80#! and stability >= #Y 0#! for full triumph)."
 oe_ren.11.a: "Proclaim the Triumph of the Orthodox Renaissance"
 oe_ren.11.a.tt: "Permanently gain 'Triumph of the Orthodox Renaissance' (#Y +10%#! clergy satisfaction, #G +1.5#! tolerance own, #G +10%#! stability efficiency, #G +10%#! conversion, +legitimacy, +religious influence, +literacy; trade-off: #Y −10%#! institution growth, #R −4%#! research, #G +8%#! embrace cost); Patriarchate standing #G +12#!."
 oe_ren.11.b: "Settle for a Pragmatic Orthodox Compromise"
 oe_ren.11.b.tt: "Permanently gain 'Pragmatic Settlement of the Great Debate' (modest literacy, spread & stability gains with mild clergy/tax drag); tension #G -20#!."
 oe_ren.12.t: "Culmination: The Hellenic Neo-Platonic Renaissance"
 oe_ren.12.d: "The classical flame kindled at Mystras now blazes across the empire's academies and ministries. Native citizen-militia ideals, Platonic mathematics, and a proud Hellenic consciousness infuse the state with startling vigor—even as prelates and old magnates brood in the shadows.\n\n#T Culmination Check#!: Ideological Tension #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 80#! (requires tension < #Y 80#! and stability >= #Y 0#! for full triumph)."
 oe_ren.12.a: "Proclaim the Hellenic Neo-Platonic Renaissance"
 oe_ren.12.a.tt: "Permanently gain 'Triumph of the Hellenic Neo-Platonic Renaissance' (#Y +12%#! research, #Y +0.08#! literacy, #Y +15%#! cultural influence, #Y +12%#! cultural tradition, #G +8%#! manpower, #G +6%#! tax; trade-off: #Y −10%#! clergy & #Y −6%#! noble satisfaction, #R −0.75#! tolerance own, −religious influence)."
 oe_ren.12.b: "Tempered Hellenic Compromise"
 oe_ren.12.b.tt: "Permanently gain 'Pragmatic Settlement of the Great Debate' (modest literacy, spread & stability gains with mild clergy/tax drag); tension #G -20#!."
 oe_ren.13.t: "Culmination: The Graeco-Latin Universal Renaissance"
 oe_ren.13.d: "Following the trail blazed by Chrysoloras and Bessarion, Constantinople's bilingual university, Golden Horn presses, and Italian academies have woven a Mediterranean Republic of Letters. Greek and Latin antiquity reunite on the Bosporus as twin capitals of a universal Renaissance.\n\n#T Culmination Check#!: Ideological Tension #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 80#! (requires tension < #Y 80#! and stability >= #Y 0#! for full triumph)."
 oe_ren.13.a: "Proclaim the Graeco-Latin Universal Renaissance"
 oe_ren.13.a.tt: "Permanently gain 'Triumph of the Graeco-Latin Universal Renaissance' (#Y +25%#! institution growth, #R −15%#! embrace cost, #R +2#! dip rep, #R +12%#! trade power, +literacy, #R +6%#! research; trade-off: #Y −8%#! clergy satisfaction, #R −0.5#! tolerance own, −religious influence & #R −4%#! stability efficiency); #G +25#! opinion with FLO/VEN/GEN/PAP."
 oe_ren.13.b: "Cautious Mercantile-Humanist Compromise"
 oe_ren.13.b.tt: "Permanently gain 'Pragmatic Settlement of the Great Debate' (modest literacy, spread & stability gains with mild clergy/tax drag); tension #G -20#!."
 oe_ren.14.t: "Renaissance of the Bosporus: Synthesis"
 oe_ren.14.d: "After more than a century of disputation, patronage, and print, Constantinople, Thessaloniki, and Mystras stand united as the eastern pillar of the Renaissance. Whether anchored in Hesychast orthodoxy, Hellenic philosophy, or Graeco-Latin humanism, New Rome has written its own chapter into the dawn of the modern age.\n\n#T Fate of the Phoenix Synergy#!: [ROOT.GetCountry.Custom('OeRenPhoenixSynergy')]"
 oe_ren.14.a: "Dedicate the Bosporus Seat of the Renaissance"
 oe_ren.14.a.tt: "Costs #R 150#! gold; surges Renaissance progress in Constantinople, Thessaloniki & Mystras (extra progress & prestige if Fate of the Phoenix was won); Constantinople permanently gains 'Bosporus Seat of the Renaissance' (#Y +20%#! institution growth, #G +0.06#! literacy, #G +15%#! books, #G +10%#! trade power; trade-off: +local unrest). Concludes the arc."
 oe_ren.14.b: "Preserve the Guilds as Civic Endowments"
 oe_ren.14.b.tt: "Costs #R 50#! gold; tension #G -15#!, boosts Constantinople Renaissance progress and grants permanent 'Bosporus Seat of the Renaissance'. Concludes the arc."
 oe_ren.90.t: "Byzantine Renaissance Debate Overview"
 oe_ren.90.d: "#T Arc Status#!: [ROOT.GetCountry.Custom('OeRenStatus')]  Current Stage: [ROOT.GetCountry.Custom('OeRenStageName')]\n#T Ascendant School#!: [ROOT.GetCountry.Custom('OeRenSchoolName')]\n#T Imperial Academy Tier#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_academy_tier_val')|0]#! / #Y 3#!  #T Ideological Tension#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_tension_val')|0]#! / #Y 100#! (requires < #Y 80#! for full triumph)\n\n#T Three-School Influence Shares#!:\n• Orthodox Hesychasm (Palamas–Scholarios): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hes_val')|0]%#!\n• Mystras Neo-Platonism (Plethon): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_neo_val')|0]%#!\n• Graeco-Latin Humanism (Chrysoloras–Bessarion): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_ren_inf_hum_val')|0]%#!\n\n#T Key Milestones#!: Nomoi Status: [ROOT.GetCountry.Custom('OeRenNomoiStatus')]  Phoenix Synergy: [ROOT.GetCountry.Custom('OeRenPhoenixSynergy')]"
 oe_ren.90.a: "Close the Ledger"
