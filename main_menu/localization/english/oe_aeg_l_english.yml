 oe_aeg.1.t: "Vignoso's Fleet"
 oe_aeg.1.desc_k: "#F In June 1346 the Genoese Simone Vignoso appeared off Chios with twenty-nine galleys. The fleet had been fitted out by private shipowners, who wanted to take the island before the crusaders from the West could. Old governor Kalothetos had won this very island back from the Genoese years before.#!\n\nNow the governor's fast boat brings word: the Genoese have landed on [GetLocationByKey('chios').GetName], and the castle is still ours. The shipowners want the island and its revenues."
 oe_aeg.1.desc_x: "#F In June 1346 the Genoese Simone Vignoso appeared off Chios with twenty-nine galleys. The fleet had been fitted out by private shipowners, who wanted to take the island before the crusaders from the West could.#!\n\nNow the governor's fast boat brings word: the Genoese have landed on [GetLocationByKey('chios').GetName], and the castle is still ours. The shipowners want the island and its revenues."
 oe_aeg.1.a: "Pay for ships and hold Chios"
 oe_aeg.1.a.tt: "Costs #R 3#! months of income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m3')|0]#! gold)\nGenoa's opinion of the empire #R −20#! (falling back by #Y 2#! a year)\nGenoa loses the precondition of vanilla's 'Reconquest of Chios': from now on the Genoese will not simply seize Chios when the empire falls into a disaster"
 oe_aeg.1.b: "Farm the island out to the Genoese shareholders"
 oe_aeg.1.b.tt: "[GetLocationByKey('chios').GetName] stays with the empire and gains [ShowModifier('oe_aeg_maona_lease')] for #Y 30#! years\nThe shareholders pay #G 2#! months of income in advance (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m2')|0]#! gold)\nThen a rent every January: #G 0.3#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_rent')|0]#! gold; while the modifier lasts and the island is the empire's)\nGenoa's opinion of the empire #G +15#! (falling back by #Y 2#! a year)\nIf the Italian privileges are on the books: Genoa's privileges rise one tier\nGenoa loses the precondition of vanilla's 'Reconquest of Chios': from now on the Genoese will not simply seize Chios when the empire falls into a disaster"
 oe_aeg.1.c: "Give up Chios"
 oe_aeg.1.c.tt: "[GetLocationByKey('chios').GetName] goes to Genoa, and [GetLocationByKey('foca').GetName] too if the empire holds it\nPrestige #R −5#!\nThe shareholders who paid for the fleet will then form the 'Maona' on the island"
 oe_aeg.2.t: "A Genoese Adventurer"
 oe_aeg.2.desc_x: "#F In the winter of 1354 the Genoese adventurer Francesco Gattilusio helped John V take back the City with a few ships; the next year Francesco married the emperor's sister Maria and received the island of Lesbos as the dowry, and the island's coins still bore the emperor's cross.#!\n\nNow there has been no such civil war, yet the same Genoese has come all the same. The Gattilusio galleys have driven Turkish pirates from the straits for the empire, and now they ask for a marriage, and an island."
 oe_aeg.2.a: "Grant the marriage and Lesbos"
 oe_aeg.2.a.tt: "[GetLocationByKey('mitilene').GetName] and [GetLocationByKey('molyvos').GetName] (where the empire holds them itself) gain [ShowModifier('oe_cw2_gattilusio_fief')] (permanent); both stay the empire's and pay their taxes as before\nThe Gattilusi are lords of Lesbos from now on\nPrestige #G +5#!"
 oe_aeg.2.b: "Hire only the Gattilusio galleys"
 oe_aeg.2.b.tt: "Costs #R 1#! month of income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m1')|0]#! gold)\nThe empire gains [ShowModifier('oe_aeg_galleys')] for #Y 5#! years"
 oe_aeg.2.c: "Send the Genoese away"
 oe_aeg.2.c.tt: "The matter is closed"
 oe_aeg.3.t: "The Maona's Tribute"
 oe_aeg.3.desc_l: "#F In 1347 the commune of Genoa could not repay the cost of the expedition and handed the revenues of Chios and Phokaia to the shareholders who had paid for it: the 'Maona'. It is said that in 1349 the Genoese even promised to give the island back to the empire after ten years. In 1363 the Maona paid John V a tribute.#!\n\nNow the Maona's envoys have come: they will pay a sum every year if the emperor recognises things as they are."
 oe_aeg.3.desc_x: "#F In 1347 the commune of Genoa could not repay the cost of the expedition and handed the revenues of Chios and Phokaia to the shareholders who had paid for it: the 'Maona'. It is said that in 1349 the Genoese even promised to give the island back to the empire after ten years.#!\n\nNow the Maona's envoys have come: they will pay a sum every year if the emperor recognises things as they are."
 oe_aeg.3.a: "Accept the tribute and recognise things as they are"
 oe_aeg.3.a.tt: "Every January from now on: #G 0.5#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_trib1')|0]#! gold) (while Chios stays Genoa's and the City the empire's)\nGenoa's opinion of the empire #G +10#! (falling back by #Y 2#! a year)"
 oe_aeg.3.b: "Take the money: the island must come back one day"
 oe_aeg.3.b.tt: "Every January from now on: #G 0.3#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_trib2')|0]#! gold) (while Chios stays Genoa's and the City the empire's)\nGenoa's opinion of the empire #R −5#! (falling back by #Y 2#! a year)"
 oe_aeg.3.c: "Refuse: we want the island"
 oe_aeg.3.c.tt: "Genoa's opinion of the empire #R −20#! (falling back by #Y 2#! a year)\nPrestige #G +5#!"
 oe_aeg.4.t: "Ainos for the Brother"
 oe_aeg.4.desc_n: "#F In the 1370s Francesco's brother Niccolò became lord of Ainos. The town guards the mouth of the Hebros, and salt and grain leave it by sea.#!\n\nNow the lord of Lesbos comes to ask for [GetLocationByKey('enez').GetName] for a younger brother. This is the very town the despot once held for the emperor."
 oe_aeg.4.desc_x: "#F In the 1370s Francesco's brother Niccolò became lord of Ainos. The town guards the mouth of the Hebros, and salt and grain leave it by sea.#!\n\nNow the lord of Lesbos comes to ask for [GetLocationByKey('enez').GetName] for a younger brother."
 oe_aeg.4.a: "Grant Ainos to the brother"
 oe_aeg.4.a.tt: "[GetLocationByKey('enez').GetName] (where the empire holds it itself) gains [ShowModifier('oe_cw2_gattilusio_fief')] (permanent), stays the empire's and pays its taxes as before; the January gift grows with it\nLoyalty of the Gattilusi #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)\nPrestige #G +5#!"
 oe_aeg.4.b: "Decline politely"
 oe_aeg.4.b.tt: "Loyalty of the Gattilusi #R −10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)"
 oe_aeg.5.t: "The Earthquake at Mytilene"
 oe_aeg.5.desc_x: "#F On 6 August 1384 an earthquake struck Lesbos. Francesco I and two sons died in the fallen castle; the third son, Jacopo, survived and succeeded as Francesco II.#!\n\nNow many walls and houses of [GetLocationByKey('mitilene').GetName] lie in ruins, and the island is left with a young lord. Some at court say the old dowry can be taken back."
 oe_aeg.5.a: "Recognise the young lord"
 oe_aeg.5.a.tt: "Prosperity in [GetLocationByKey('mitilene').GetName] falls (the earthquake; the 'weak' step of vanilla's earthquake events)\nLoyalty of the Gattilusi #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)\nPrestige #G +5#!"
 oe_aeg.5.b: "Take Lesbos back while we can"
 oe_aeg.5.b.tt: "Prosperity in [GetLocationByKey('mitilene').GetName] falls (the earthquake; the 'weak' step of vanilla's earthquake events)\nEvery fief of the Gattilusi returns to the crown: [ShowModifier('oe_cw2_gattilusio_fief')] leaves all five places (the land was the empire's all along and changes no hands)\nNo more January gift; the story of the Gattilusi ends here\nGenoa's opinion of the empire #R −20#! (falling back by #Y 2#! a year)\nPrestige #R −5#!\nStability #G +2.5#!"
 oe_aeg.6.t: "Thasos and Lemnos"
 oe_aeg.6.desc_x: "#F In the early fifteenth century the lands of the Gattilusi reached out from Lesbos and Ainos to the northern islands: Samothrace, Thasos, and the castles of Lemnos.#!\n\nNow Lesbos asks for land again: Turkish pirates often fall on [GetLocationByKey('thasos').GetName] and [GetLocationByKey('lemnos').GetName] to the north, and the Gattilusi offer ships and men to guard them."
 oe_aeg.6.a: "Grant Thasos"
 oe_aeg.6.a.tt: "[GetLocationByKey('thasos').GetName] gains [ShowModifier('oe_cw2_gattilusio_fief')] (permanent), stays the empire's and pays its taxes as before; the January gift grows with it\nLoyalty of the Gattilusi #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)"
 oe_aeg.6.b: "Grant Lemnos as well"
 oe_aeg.6.b.tt: "[GetLocationByKey('thasos').GetName] and [GetLocationByKey('lemnos').GetName] (where the empire holds them itself) gains [ShowModifier('oe_cw2_gattilusio_fief')] (permanent), stays the empire's and pays its taxes as before; the January gift grows with it\nThe alum of [GetLocationByKey('lemnos').GetName] is still the empire's\nLoyalty of the Gattilusi #G +15#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)"
 oe_aeg.6.c: "Grant neither"
 oe_aeg.6.c.tt: "Loyalty of the Gattilusi #R −10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)"
 oe_aeg.7.t: "A Gattilusi Bride"
 oe_aeg.7.desc_l: "#F Generation after generation the Gattilusi married into the Palaiologoi: Francesco I married Maria, the sister of John V, and a granddaughter married John VII; in 1405 another daughter of the house, Helena, married Stefan of Serbia. One account says that in 1441 Dorino's daughter Caterina married Constantine, the emperor's brother, and died the following year.#!\n\nNow the lord of Lesbos proposes a daughter of the house as a bride for one of the emperor's brothers."
 oe_aeg.7.desc_x: "#F Generation after generation the Gattilusi married into the Palaiologoi: Francesco I married Maria, the sister of John V, and a granddaughter married John VII; in 1405 another daughter of the house, Helena, married Stefan of Serbia.#!\n\nNow the lord of Lesbos proposes a daughter of the house as a bride for one of the emperor's brothers."
 oe_aeg.7.a: "Agree to the marriage"
 oe_aeg.7.a.tt: "One more marriage between the houses: from now on the loyalty of the Gattilusi drifts toward a higher mark each year\nLoyalty of the Gattilusi #G +15#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)\nThe dowry: #G 1#! month of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m1')|0]#! gold)\nPrestige #G +5#!"
 oe_aeg.7.b: "Decline the match"
 oe_aeg.7.b.tt: "Loyalty of the Gattilusi #R −10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)"
 oe_aeg.8.t: "The Island Promised to the Captain"
 oe_aeg.8.desc_g: "#F It is said that that winter the emperor promised the Genoese captain Giustiniani the island of Lemnos as the reward for defending the City.#!\n\nNow the City has held, and the captain's people have come to claim the island. Yet [GetLocationByKey('lemnos').GetName] was granted to Lesbos long ago, so another island must be given instead."
 oe_aeg.8.desc_o: "#F It is said that that winter the emperor promised the Genoese captain Giustiniani the island of Lemnos as the reward for defending the City.#!\n\nNow the City has held, and the captain's people have come to claim the island. Yet [GetLocationByKey('lemnos').GetName] is not held directly by the empire right now, so another island must be given instead."
 oe_aeg.8.desc_x: "#F It is said that that winter the emperor promised the Genoese captain Giustiniani the island of Lemnos as the reward for defending the City.#!\n\nNow the City has held, and the captain's people have come to claim the island."
 oe_aeg.8.a: "Grant the promised island to the captain"
 oe_aeg.8.a.tt: "The first of [GetLocationByKey('lemnos').GetName], [GetLocationByKey('imbros').GetName] and [GetLocationByKey('thasos').GetName] held directly by the empire and not yet a fief gains [ShowModifier('oe_aeg_captain_fief')] (permanent); the island stays the empire's and does not count toward the Gattilusi's gift\nGenoa's opinion of the empire #G +15#! (falling back by #Y 2#! a year)"
 oe_aeg.8.b: "Pay the promise off in gold"
 oe_aeg.8.b.tt: "Costs #R 3#! months of income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m3')|0]#! gold)\nGenoa's opinion of the empire #G +5#! (falling back by #Y 2#! a year)"
 oe_aeg.8.c: "Go back on the promise"
 oe_aeg.8.c.tt: "Genoa's opinion of the empire #R −20#! (falling back by #Y 2#! a year)\nPrestige #R −5#!"
 oe_aeg.9.t: "The Fratricide of Mytilene"
 oe_aeg.9.desc_f: "#F Late in 1458 Niccolò Gattilusio deposed and killed an elder brother, Domenico, and seized Lesbos. A few years later the sultan used the murder as a pretext to land a fleet on the island; Hospitallers from Rhodes stood among the defenders, yet after a fortnight Niccolò surrendered the town, was taken to the City, and was later strangled.#!\n\nNow the new lord of Lesbos has killed an elder brother to take the island and sends envoys to ask the emperor's recognition — yet the emperor no longer has the City."
 oe_aeg.9.desc_x: "#F Late in 1458 Niccolò Gattilusio deposed and killed an elder brother, Domenico, and seized Lesbos. A few years later the sultan used the murder as a pretext to land a fleet on the island; Hospitallers from Rhodes stood among the defenders, yet after a fortnight Niccolò surrendered the town, was taken to the City, and was later strangled.#!\n\nNow the new lord of Lesbos has killed an elder brother to take the island and sends envoys to ask the emperor's recognition."
 oe_aeg.9.a: "Take back Lesbos and every fief"
 oe_aeg.9.a.tt: "Every fief of the Gattilusi returns to the crown: [ShowModifier('oe_cw2_gattilusio_fief')] leaves all five places (the land was the empire's all along and changes no hands)\nNo more January gift; the story of the Gattilusi ends here\nLegitimacy #G +5#!"
 oe_aeg.9.b: "Recognise the accomplished fact"
 oe_aeg.9.b.tt: "Loyalty of the Gattilusi #R −10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)\nPrestige #R −5#!"
 oe_aeg.9.c: "Demand a fine in gold from Lesbos"
 oe_aeg.9.c.tt: "Gain #G 2#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m2')|0]#! gold)\nLoyalty of the Gattilusi #R −15#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_loy')|0]#!)"
