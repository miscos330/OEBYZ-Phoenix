 oe_aeg_ct_chios_c3: "Chios stays with the empire; its revenues were farmed out to Genoese shareholders."
 oe_aeg_ct_chios_c4: "The revenues of Chios had been farmed out to Genoese shareholders; once the island left the empire's own hands, the farm ended."
 oe_aeg_ct_gat_1: "The Gattilusi are lords of Lesbos and hold #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_fief_n')|0]#! fiefs."
 oe_aeg_ct_gat_2: "After the second civil war the empire did not give the Gattilusi the Lesbos it had promised."
 oe_aeg_ct_gat_3: "The empire took back the fiefs of the Gattilusi."
