 oe_aeg.1.t: "Vignoso's Fleet"
 oe_aeg.1.desc_k: "#F In June 1346 the Genoese Simone Vignoso appeared off Chios with twenty-nine galleys. The fleet had been fitted out by private shipowners, who wanted to take the island before the crusaders from the West could. Old governor Kalothetos had won this very island back from the Genoese years before.#!\n\nNow the governor's fast boat brings word: the Genoese have landed on [GetLocationByKey('chios').GetName], and the castle is still ours. The shipowners want the island and its revenues."
 oe_aeg.1.desc_x: "#F In June 1346 the Genoese Simone Vignoso appeared off Chios with twenty-nine galleys. The fleet had been fitted out by private shipowners, who wanted to take the island before the crusaders from the West could.#!\n\nNow the governor's fast boat brings word: the Genoese have landed on [GetLocationByKey('chios').GetName], and the castle is still ours. The shipowners want the island and its revenues."
 oe_aeg.1.a: "Pay for ships and hold Chios"
 oe_aeg.1.a.tt: "Costs #R 3#! months of income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m3')|0]#! gold)\nGenoa's opinion of the empire #R −20#! (falling back by #Y 2#! a year)\nGenoa loses the precondition of vanilla's 'Reconquest of Chios': from now on the Genoese will not simply seize Chios when the empire falls into a disaster"
 oe_aeg.1.b: "Farm out the island's revenues to the Genoese shareholders"
 oe_aeg.1.b.tt: "[GetLocationByKey('chios').GetName] stays with the empire and gains [ShowModifier('oe_aeg_maona_lease')] for #Y 30#! years\nThe shareholders pay #G 2#! months of income in advance (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m2')|0]#! gold)\nThen a rent every January: #G 0.3#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_rent')|0]#! gold; while the modifier lasts and the island is the empire's)\nGenoa's opinion of the empire #G +15#! (falling back by #Y 2#! a year)\nIf the Italian privileges are on the books: Genoa's privileges rise one tier\nGenoa loses the precondition of vanilla's 'Reconquest of Chios': from now on the Genoese will not simply seize Chios when the empire falls into a disaster"
 oe_aeg.1.c: "Give up Chios"
 oe_aeg.1.c.tt: "[GetLocationByKey('chios').GetName] goes to Genoa, and [GetLocationByKey('foca').GetName] too if the empire holds it\nPrestige #R −5#!\nThe shareholders who paid for the fleet will then form the 'Maona' on the island"
 oe_aeg.2.t: "A Genoese Adventurer"
 oe_aeg.2.desc_x: "#F In the winter of 1354 the Genoese adventurer Francesco Gattilusio helped John V take back the City with a few ships; the next year Francesco married the emperor's sister Maria and received the island of Lesbos as the dowry, and the island's coins still bore the emperor's cross.#!\n\nNow there has been no such civil war, yet the same Genoese has come all the same. The Gattilusio galleys have driven Turkish pirates from the straits for the empire, and now they ask for a marriage, and an island."
 oe_aeg.2.a: "Grant the marriage and Lesbos"
 oe_aeg.2.a.tt: "[GetLocationByKey('mitilene').GetName] and [GetLocationByKey('molyvos').GetName] (where the empire holds them itself) gain [ShowModifier('oe_cw2_gattilusio_fief')] (permanent); both stay the empire's and pay their taxes as before\nThe Gattilusi are lords of Lesbos from now on\nPrestige #G +5#!"
 oe_aeg.2.b: "Hire only the Gattilusio galleys"
 oe_aeg.2.b.tt: "Costs #R 1#! month of income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_m1')|0]#! gold)\nThe empire gains [ShowModifier('oe_aeg_galleys')] for #Y 5#! years"
 oe_aeg.2.c: "Send the Genoese away"
 oe_aeg.2.c.tt: "The matter is closed"
 oe_aeg.3.t: "The Maona's Tribute"
 oe_aeg.3.desc_l: "#F In 1347 the commune of Genoa could not repay the cost of the expedition and handed the revenues of Chios and Phokaia to the shareholders who had paid for it: the 'Maona'. It is said that in 1349 the Genoese even promised to give the island back to the empire after ten years. In 1363 the Maona paid John V a tribute.#!\n\nNow the Maona's envoys have come: they will pay a sum every year if the emperor recognises things as they are."
 oe_aeg.3.desc_x: "#F In 1347 the commune of Genoa could not repay the cost of the expedition and handed the revenues of Chios and Phokaia to the shareholders who had paid for it: the 'Maona'. It is said that in 1349 the Genoese even promised to give the island back to the empire after ten years.#!\n\nNow the Maona's envoys have come: they will pay a sum every year if the emperor recognises things as they are."
 oe_aeg.3.a: "Accept the tribute and recognise things as they are"
 oe_aeg.3.a.tt: "Every January from now on: #G 0.5#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_trib1')|0]#! gold) (while Chios stays Genoa's and the City the empire's)\nGenoa's opinion of the empire #G +10#! (falling back by #Y 2#! a year)"
 oe_aeg.3.b: "Take the money: the island must come back one day"
 oe_aeg.3.b.tt: "Every January from now on: #G 0.3#! months of income (about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_aeg_v_trib2')|0]#! gold) (while Chios stays Genoa's and the City the empire's)\nGenoa's opinion of the empire #R −5#! (falling back by #Y 2#! a year)"
 oe_aeg.3.c: "Refuse: we want the island"
 oe_aeg.3.c.tt: "Genoa's opinion of the empire #R −20#! (falling back by #Y 2#! a year)\nPrestige #G +5#!"
