 oe_aeg_ct_chios_c1t1: "Chios was given up to the Genoese, whose shareholders formed the Maona; the Maona pays the emperor a yearly tribute, and the emperor has recognised it."
 oe_aeg_ct_chios_c1t2: "Chios was given up to the Genoese, whose shareholders formed the Maona; the Maona pays a yearly tribute; the emperor takes the money but not its title."
 oe_aeg_ct_chios_c1t3: "Chios was given up to the Genoese, whose shareholders formed the Maona; the emperor refused the Maona's tribute and wants the island back."
 oe_aeg_ct_chios_mt1: "Chios is in the hands of the Genoese Maona; the Maona pays the emperor a yearly tribute, and the emperor has recognised it."
 oe_aeg_ct_chios_mt2: "Chios is in the hands of the Genoese Maona; the Maona pays a yearly tribute; the emperor takes the money but not its title."
 oe_aeg_ct_chios_mt3: "Chios is in the hands of the Genoese Maona; the emperor refused the Maona's tribute and wants the island back."
 oe_aeg_ct_chios_c1: "Chios was given up to the Genoese."
