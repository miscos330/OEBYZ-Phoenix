# NEW 2026-11-24 v25.0 Phase 4A: 1337-1460 Deep Flavor & Mechanic Packs (TUR/FRA/ENG) (oe_v250_eng_, 0 mainline slots, 0 rules, 0 vanilla overrides) — english localization for Kingdom of England (1337-1460) (140 keys). Edit gen_v250_1337_tur_fra_eng.py, not this file.
 oe_v250_eng_reform_crown_in_parliament:0 "King-in-Parliament Fiscal Compact"
 oe_v250_eng_reform_crown_in_parliament_desc:0 "Anchors royal subsidies and statutory law inside Westminster's Lords and Commons, strengthening tax compliance and legislative efficiency at the price of softer royal prerogative and heightened burgher leverage."
 oe_v250_eng_reform_indenture_retinues:0 "Indenture Retinues & Yeoman Array"
 oe_v250_eng_reform_indenture_retinues_desc:0 "Combines salaried baronial indenture companies with shire longbow arrays to field disciplined, lethal expeditionary armies, while elevating payroll costs, baronial livery influence, and dynastic faction strain."
 oe_v250_eng_priv_yeoman_archery:0 "Freeholder Yeomanry & Archery Butts"
 oe_v250_eng_priv_yeoman_archery_desc:0 "Guarantees shire freeholders village archery commons and lighter feudal dues in return for crack longbow arrays, boosting levy lethality and manpower while expanding peasant clout and diverting farm hands."
 oe_v250_eng_priv_wool_staplers:0 "Company of Merchants of the Staple"
 oe_v250_eng_priv_wool_staplers_desc:0 "Grants chartered English wool staplers exclusive export conduits across the Narrow Sea, enriching customs and maritime commerce while enlarging merchant estate power and capping burgher taxes and domestic looms."
 oe_v250_eng_cab_justices_peace:0 "Shire Justices of the Peace Commission"
 oe_v250_eng_cab_justices_peace_desc:0 "Empowers local county gentry as crown Justices of the Peace in a target province to suppress brigandage, uphold royal writs, and stabilize shire prosperity, while slightly boosting landed gentry power and court fees."
 oe_v250_eng_cab_justices_peace_action:0 "Shire Justices of the Peace Commission: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_eng_cab_justices_peace_active:0 "Shire Justices of the Peace Commission in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_eng_cab_justices_peace_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_eng_cab_justices_peace_action_progress_wordier:0 "Shire Justices of the Peace Commission ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_eng_cab_justices_peace_action_progress_tooltip:0 "Empowers local county gentry as crown Justices of the Peace in a target province to suppress brigandage, uphold royal writs, and stabilize shire prosperity, while slightly boosting landed gentry power and court fees."
 oe_v250_eng_cab_justices_peace_select_province:0 "Select a Province for Justices of the Peace Commission"
 oe_v250_eng_cab_justices_peace_no_provinces:0 "@trigger_no! No eligible provinces available for Justices of the Peace."
 oe_v250_eng_cab_cinque_ports_watch:0 "Cinque Ports & Channel Fleet Watch"
 oe_v250_eng_cab_cinque_ports_watch_desc:0 "Coordinates ship-service quotas across Dover, Sandwich, and the Channel towns to guard wool convoys and dominate sea lanes, elevating naval morale and maritime reach at the price of steep fleet and land upkeep."
 oe_v250_eng_cab_cinque_ports_watch_action:0 "Cinque Ports & Channel Fleet Watch"
 oe_v250_eng_cab_cinque_ports_watch_active:0 "Active: Cinque Ports & Channel Fleet Watch"
 oe_v250_eng_cab_cinque_ports_watch_action_progress:0 "Active"
 oe_v250_eng_cab_cinque_ports_watch_action_progress_wordier:0 "Cinque Ports & Channel Fleet Watch (Active)"
 oe_v250_eng_cab_cinque_ports_watch_action_progress_tooltip:0 "Coordinates ship-service quotas across Dover, Sandwich, and the Channel towns to guard wool convoys and dominate sea lanes, elevating naval morale and maritime reach at the price of steep fleet and land upkeep."
 oe_v250_eng_dec_order_garter.title:0 "Found the Most Noble Order of the Garter"
 oe_v250_eng_dec_order_garter.desc:0 "Establish Edward III's chivalric fellowship at Windsor to bind England's foremost captains and barons in martial honor. Costs 100 gold; raises prestige, land morale, and noble loyalty for 25 years while expanding aristocratic clout and court outlays."
 oe_v250_eng_dec_order_garter.a:0 "Invest the Knights of the Garter at Windsor"
 oe_v250_eng_dec_calais_staple.title:0 "Charter the Calais Royal Wool Staple"
 oe_v250_eng_dec_calais_staple.desc:0 "Designate fortified Calais as England's sovereign Continental wool entrepot and customs mint. Costs 110 gold; boosts trade revenue, sea trade efficiency, and merchant reach for 25 years at the cost of heavy Pale garrison upkeep and Continental friction."
 oe_v250_eng_dec_calais_staple.a:0 "Seal the Charter of the Calais Staple"
 oe_v250_eng_dec_statute_pleading.title:0 "Enact the Statute of Pleading in English"
 oe_v250_eng_dec_statute_pleading.desc:0 "Require royal law courts across England to hear pleadings in English rather than court French, forging a cohesive vernacular administration. Available from 1360; costs 90 gold, boosting cabinet efficiency, cultural assimilation, and commoner morale for 25 years while irritating Francophone peers and foreign courts."
 oe_v250_eng_dec_statute_pleading.a:0 "Proclaim English in the King's Courts"
 oe_v250_eng_dec_portsmouth_dockyard.title:0 "Expand the Royal Dockyards of Portsmouth & Southampton"
 oe_v250_eng_dec_portsmouth_dockyard.desc:0 "Build fortified timber basins and dry-berths along the Solent to maintain royal carracks and Channel patrol squadrons. Available from 1410; costs 140 gold, strengthening heavy ships, sailor reserves, and naval morale for 25 years at substantial naval upkeep."
 oe_v250_eng_dec_portsmouth_dockyard.a:0 "Lay Down the Solent Royal Slipways"
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_order_garter:0 "Most Noble Order of the Garter"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_order_garter:0 "Windsor's brotherhood of chivalry inspires English armies and binds peers to the throne, while reinforcing noble prestige and ceremonial court spending."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_calais_staple:0 "Calais Royal Wool Staple"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_calais_staple:0 "Controlling the wool gate at Calais channels North Sea bullion directly into English customs, though defending the Pale strains fort budgets and diplomatic relations."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_statute_pleading:0 "Statute of Pleading in English"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_statute_pleading:0 "Vernacular justice unites shire courts with Westminster and accelerates English civic integration, while distancing England from Continental Francophone aristocracy."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_dec_portsmouth_dock:0 "Solent Royal Naval Dockyards"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_dec_portsmouth_dock:0 "Dedicated royal yards on the southern coast sustain mighty Channel warships and trained crews, demanding heavy dockyard payrolls and steady timber taxes."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev1_flemish_staple:0 "Flemish Wool Staple Customs"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev1_flemish_staple:0 "Channeled raw wool shipments fill royal customs chests and cement North Sea diplomacy, while slowing native English cloth weaving and empowering staple merchants."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev1_domestic_cloth:0 "English Broadcloth Weaving Guilds"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev1_domestic_cloth:0 "Welcoming skilled weavers lifts native industrial output and urban prosperity at the cost of lower raw-wool export duties and irritated Flemish ports."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev2_longbow_statute:0 "Shire Longbow Yeomanry"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev2_longbow_statute:0 "Relentless parish practice makes English yeoman levies lethal in battle and steels morale, while modestly lowering rural food surplus and workshop output."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev2_yeoman_harvest:0 "Undisturbed Shire Harvests"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev2_yeoman_harvest:0 "Keeping shire villagers at their plows swells food yields and rural contentment, yet leaves English infantry levies less seasoned for Continental warfare."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev3_commons_bargain:0 "The Commons' Subsidy Bargain"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev3_commons_bargain:0 "Constitutional tax consent lifts legislative efficiency and reliable war revenues while curbing unilateral crown power and enlarging burgher leverage."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev3_royal_purveyance:0 "Royal Purveyance Prerogative"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev3_royal_purveyance:0 "Bypassing Westminster preserves autocratic crown leverage and short-term grain seizures, yet sours parliamentary harmony and strains stability."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev4_calais_enclave:0 "Fortified Narrow-Sea Staple"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev4_calais_enclave:0 "Holding a fortified Channel entrepot accelerates English sea trade, merchant power, and maritime projection while burdening fort maintenance and Franco-English ties."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev4_home_staples:0 "English Home-Port Staples"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev4_home_staples:0 "Concentrating customs in London, Bristol, and Dover trims military upkeep and nurtures domestic towns while relinquishing Continental maritime leverage."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev5_wage_freeze:0 "Statute of Labourers Enforcement"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev5_wage_freeze:0 "Capping rural wages steadies noble estate incomes and grain harvests, at the sharp cost of peasant resentment and heavier domestic stability expenses."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev5_free_wages:0 "Free Market Leaseholds"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev5_free_wages:0 "Accepting rising rural wages accelerates village recovery and artisan productivity while angering conservative barons and pinching manorial rents."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev6_praemunire:0 "Statutes of Provisors & Praemunire"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev6_praemunire:0 "Blocking foreign ecclesiastical appointments raises crown leverage and keeps clerical tax wealth inside England, while bruising diplomatic ties with Rome and unsettling bishops."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev6_curial_harmony:0 "Papal Curial Conciliation"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev6_curial_harmony:0 "Deferring to papal appointments calms the English Church and strengthens international diplomacy, at the expense of silver remittances and weaker crown leverage."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev7_good_parliament:0 "Reforms of the Good Parliament"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev7_good_parliament:0 "Holding royal treasurers accountable sharpens cabinet administration and tax honesty while clipping royal prerogative and irritating court magnates."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev7_court_prerogative:0 "Unchecked Court Prerogative"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev7_court_prerogative:0 "Protecting royal favorites defends crown autonomy and magnate alliances, yet breeds fiscal leakage and undermines parliamentary trust."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev8_smithfield_charter:0 "Charters of Rural Emancipation"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev8_smithfield_charter:0 "Freeing villeins sparks long-term rural prosperity and loyal yeoman commoners, while infuriating landed lords and thinning direct poll revenues."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev8_feudal_order:0 "Restored Feudal Order"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev8_feudal_order:0 "Decisive royal repression cements baronial allegiance and central authority, yet leaves embittered villages and sluggish domestic output."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev9_oxford_vernacular:0 "Oxford Vernacular Scholarship"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev9_oxford_vernacular:0 "English scripture circles boost national research, institution spread, and popular literacy while provoking clerical backlash and steeper stability costs."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev9_episcopal_orthodoxy:0 "Orthodox Episcopal Censorship"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev9_episcopal_orthodoxy:0 "Suppressing unauthorized sermons preserves Catholic unity, clerical loyalty, and internal calm at the cost of slower scholarship and intellectual caution."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev10_marcher_castles:0 "Fortified Welsh March Castles"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev10_marcher_castles:0 "Reinforced concentric castles harden national defense and garrison endurance while draining fort maintenance and inflaming border resentment."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev10_welsh_charter:0 "Welsh Shire Reconciliation Charter"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev10_welsh_charter:0 "Guaranteeing Welsh legal representation accelerates peaceful integration and boosts highland archer recruitment, while trimming crown dominance and marcher noble favor."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev11_grace_dieu:0 "Flagship Grace Dieu & Royal Fleet"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev11_grace_dieu:0 "Towering royal carracks command the English Channel and elevate naval combat prowess, imposing heavy fleet upkeep and fiscal pressure."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev11_merchant_levy:0 "Requisitioned Merchant Cogs"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev11_merchant_levy:0 "Leasing civilian vessels saves naval wages and keeps port trade humming, though English fleets lose punch against dedicated Continental warships."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev12_curb_livery:0 "Statutes Against Noble Livery"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev12_curb_livery:0 "Disbanding private baronial retainers fortifies sovereign crown authority, discipline, and domestic control while provoking angry peers and legitimacy friction."
 STATIC_MODIFIER_NAME_oe_v250_eng_mod_ev12_loveday_council:0 "Great Council Love-Day Truce"
 STATIC_MODIFIER_DESC_oe_v250_eng_mod_ev12_loveday_council:0 "Solemn noble reconciliation averts open civil rupture and lifts domestic stability, while entrenching overmighty peerages and slowing crown administration."
 oe_v250_eng.1.t:0 "The Wool Staple & the Flemish Alliance"
 oe_v250_eng.1.d:0 "Fine English fleece is the lifeblood of Ghent and Bruges looms, giving Edward III potent leverage across the North Sea. Funneling all wool exports through a Flemish staple under royal customs guarantees immediate war gold and Flemish political alignment—yet ties English commerce to Low Countries merchants; alternatively, protecting domestic English weavers builds native workshops while straining our Flemish bridgehead."
 oe_v250_eng.1.a:0 "Bind the wool staple to Flemish allies for maximum war customs"
 oe_v250_eng.1.b:0 "Encourage domestic English cloth looms over raw exports"
 oe_v250_eng.2.t:0 "Statute of Archery & Longbow Yeomanry"
 oe_v250_eng.2.d:0 "Crown marshals urge proclaiming a realm-wide Statute of Archery banning idle Sunday games and obliging every able yeoman from Kent to Yorkshire to train weekly at the parish yew-bow butts. Mandatory archery drill will turn English commoners into the deadliest missile infantry in Europe, though pulling hands from fields and craft benches will slightly dampen village harvests."
 oe_v250_eng.2.a:0 "Enforce mandatory Sunday longbow drill in every shire"
 oe_v250_eng.2.b:0 "Leave village labor undisturbed for richer harvests and rents"
 oe_v250_eng.3.t:0 "Parliamentary War Subsidies & the Commons' Bargain"
 oe_v250_eng.3.d:0 "With Italian bankers defaulting and Continental armies awaiting pay, the knights of the shire and borough burgesses in Westminster offer a generous fifteenth-and-tenth subsidy—on one firm condition: no future direct war tax or wool maltolt may be levied without Parliamentary statute. Accepting codifies fiscal consent and unlocks dependable war money; bypassing Parliament preserves royal prerogative at the cost of fierce unrest."
 oe_v250_eng.3.a:0 "Confirm Parliamentary consent over war taxes for generous subsidies"
 oe_v250_eng.3.b:0 "Raise forced purveyance and royal tallage without the Commons"
 oe_v250_eng.4.t:0 "The Calais Staple Port Charter"
 oe_v250_eng.4.d:0 "Standing just twenty miles across the Dover Strait, a fortified Continental bridgehead at Calais lets England hold both shores of the Narrow Sea and channel wool customs under royal cannon. Yet maintaining a permanent salaried garrison on French soil devours tens of thousands of silver marks each decade—prompting thrifty counselors to propose routing wool staples through English home ports instead."
 oe_v250_eng.4.a:0 "Fortify the Continental staple enclave and garrison the Pale"
 oe_v250_eng.4.b:0 "Route wool staples through English home ports to save garrison gold"
 oe_v250_eng.5.t:0 "The Statute of Labourers & Post-Plague Wages"
 oe_v250_eng.5.d:0 "Severe pestilence has thinned the English countryside, leaving surviving ploughmen and artisans bold enough to demand double wages or abandon manorial demesnes altogether. Landed barons in Parliament clamor for a harsh Statute of Labourers freezing wages at pre-plague levels and punishing vagrant workers—yet enforcing wage ceilings sows smoldering rural hatred across Kent and Essex."
 oe_v250_eng.5.a:0 "Enforce the Statute of Labourers and freeze manorial wages"
 oe_v250_eng.5.b:0 "Permit market wages and free leasehold contracts"
 oe_v250_eng.6.t:0 "The Statutes of Provisors & Praemunire"
 oe_v250_eng.6.d:0 "Anger simmers in Westminster as papal courts at Avignon—widely suspected of favoring France—award rich English bishoprics to foreign clerics and drain silver in curial fees. Enacting the Statutes of Provisors and Praemunire bars appeals to foreign papal tribunals and guards English church wealth for the Crown, though senior bishops and Rome will fiercely protest the breach of canon jurisdiction."
 oe_v250_eng.6.a:0 "Enact Provisors and Praemunire to curb papal drainage"
 oe_v250_eng.6.b:0 "Preserve traditional curial rights to court papal mediation"
 oe_v250_eng.7.t:0 "The Good Parliament & Royal Accountability"
 oe_v250_eng.7.d:0 "With war campaigns stalling and royal courtiers accused of embezzling wool loans and manipulating state monopolies, the Commons elect their first formal Speaker and invent impeachment to put corrupt ministers on trial. Allowing the Good Parliament to purge court profiteers cleanses administration and restores tax credibility, while shielding court magnates guards royal authority at the cost of seething public distrust."
 oe_v250_eng.7.a:0 "Back the Commons' impeachment and root out court corruption"
 oe_v250_eng.7.b:0 "Shield the court circle and dissolve the defiant Commons"
 oe_v250_eng.8.t:0 "Wat Tyler & the Great Peasants' Revolt"
 oe_v250_eng.8.d:0 "Driven past endurance by repeated flat-rate poll taxes, tens of thousands of Kentish and Essex rebels under Wat Tyler and preacher John Ball march across London Bridge demanding the end of villeinage, fair land rents, and the heads of royal tax collectors. Honoring the Smithfield manumission charters could usher in a free yeoman countryside at the price of baronial outrage, while crushing the revolt reasserts feudal hierarchy amid burning manors."
 oe_v250_eng.8.a:0 "Honor the manumission charters and abolish the poll tax"
 oe_v250_eng.8.b:0 "Revoke the charters and crush the rebels to restore feudal order"
 oe_v250_eng.9.t:0 "John Wycliffe & the Lollard Scriptures"
 oe_v250_eng.9.d:0 "Oxford theologian John Wycliffe and his 'Poor Preachers' circulate English translations of Scripture while questioning clerical wealth and papal supremacy. Quietly shielding Wycliffe's scholars stimulates vernacular literacy and fearless intellectual inquiry across English universities—yet risks branded heresy, ecclesiastical censure, and sharp Catholic unrest unless bishops enforce strict orthodoxy."
 oe_v250_eng.9.a:0 "Quietly tolerate Oxford vernacular scholarship and lay literacy"
 oe_v250_eng.9.b:0 "Enforce episcopal orthodoxy and suppress Lollard preaching"
 oe_v250_eng.10.t:0 "The Welsh Marches & Owain Glyndwr's Rising"
 oe_v250_eng.10.d:0 "Sparked by land disputes with English marcher lords, Welsh nobleman Owain Glyndwr unfurls the golden dragon of Wales across the mountain valleys, assaulting Edwardian stone castles from Harlech to Cardiff and seeking alliances with France and Scotland. Pouring royal gold into the frontier castles and punitive statutes asserts iron control at heavy upkeep, while negotiating a Welsh shire charter offers lasting reconciliation at a softer crown grip."
 oe_v250_eng.10.a:0 "Garrison the Edwardian castles and tighten Marcher rule"
 oe_v250_eng.10.b:0 "Negotiate a Welsh shire charter and local reconciliation"
 oe_v250_eng.11.t:0 "Royal Navy of the Cinque Ports & the Grace Dieu"
 oe_v250_eng.11.d:0 "To sweep Franco-Castilian and Genoese carracks from the English Channel before a grand invasion of Normandy, Henry V's shipwrights at Southampton propose building colossal royal great ships crowned by the mighty Grace Dieu. Forging a permanent royal war fleet establishes undisputed Narrow-Sea dominance at crushing dockyard expense, whereas relying on requisitioned merchant cogs spares the Exchequer at the risk of contested crossings."
 oe_v250_eng.11.a:0 "Lay down the Grace Dieu and expand the Royal Channel Fleet"
 oe_v250_eng.11.b:0 "Rely on requisitioned merchant cogs and lighter naval budgets"
 oe_v250_eng.12.t:0 "Lancaster vs York: Shadow of the Roses"
 oe_v250_eng.12.d:0 "With Continental garrisons reeling and rival aristocratic affinities swaggering through London in private livery badges, England stands upon the brink of a fratricidal struggle between the Houses of Lancaster and York. Strictly enforcing Statutes of Livery to disband private baronial retinues strengthens the Crown for the future at fierce noble hostility and legitimacy risk, while staging a conciliatory Great Council Love-Day buys fragile peace at the cost of royal authority."
 oe_v250_eng.12.a:0 "Enforce Statutes of Livery and curb overmighty noble retinues"
 oe_v250_eng.12.b:0 "Broker a Great Council Love-Day compromise among rival peers"
