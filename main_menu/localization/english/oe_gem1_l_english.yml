# NEW 2026-11-23 v19.5 Module 19.5-A (Lithuania & Novgorod): Lithuania & Novgorod Module Localization (english) (oe_gem1_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_lit_nov.py; edit the generator, not this file.
 oe_msn_lit_destiny:0 "#bold #color_yellow Grand Duchy of Lithuania: Crown of Two Seas#!#!"
 oe_msn_lit_destiny_DESCRIPTION:0 "From the Gediminid Citadel of Vilnius and Samogitian Shields to the Baltic-to-Black-Sea Ruthenian Corridor, Tri-Faith Synthesis, and the Statutes of Lithuania"
 oe_msn_lit_destiny_CRITERIA_DESCRIPTION:0 "Consolidate Vilnius, Trakai, and Kaunas, break the Teutonic Orders on the Baltic, secure Polotsk, Smolensk, and Kyiv toward the Black Sea, and enact the Grand Ducal Statutes."
 oe_msn_lit_destiny_BUTTON_TOOLTIP:0 "Embark on the Grand Duchy of Lithuania Destiny"
 oe_msn_lit_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Lithuania: defend Samogitia and field Grand Ducal Vytis Lancers against the Teutonic Orders; forge the Baltic-to-Black-Sea Ruthenian corridor through Polotsk, Smolensk, and Kyiv; and unite Baltic, Orthodox, and Latin traditions under the Unions of Krewo and Horodlo and the Statutes of Lithuania."
 oe_msn_lit_01_gediminid_crown:0 "Gediminid Crown of Vilnius & Trakai"
 oe_msn_lit_01_gediminid_crown_desc:0 "From the island castle of Trakai and the pine-crowned hills of Vilnius, the house of Gediminas rallied Baltic tribes into a sovereign realm. Consolidating dynastic [legitimacy|e] and urban [buildings|e] anchors the [capital|e] and spurs early [development|e] along the Neris."
 oe_msn_lit_01_gediminid_crown_req_tt:0 "Hold Vilnius, Trakai, and Kaunas (or via subjects), Stability >= 5, and own a Castle or Marketplace."
 oe_msn_lit_02_samogitian_shield:0 "Samogitian Shield Against the Orders"
 oe_msn_lit_02_samogitian_shield_desc:0 "Dense oak forests and timber hillforts in Samogitia stood as the sole wedge dividing the Teutonic and Livonian Orders. Fortifying this western [fort|e] line rallies boyar [manpower|e], hardens our [army_tradition|e], and preserves national [stability|e] against northern crusaders."
 oe_msn_lit_02_samogitian_shield_req_tt:0 "Hold Raseiniai and Medininkai (or via subjects), Stability >= 8, Castle or Weapon Guild, and Army Tradition >= 12 or Nobles Satisfaction >= 50%."
 oe_msn_lit_03_vytis_lancers:0 "Marshal the Vytis Lancers"
 oe_msn_lit_03_vytis_lancers_desc:0 "Beneath the crimson Vytis banner of the charging knight, Lithuanian heavy horsemen and Tatar auxiliaries mastered rapid shock warfare from Grunwald to the steppe. Channeling [gold|e] into armored [regulars|e] and martial [advances|e] elevates the [army|e] into an unstoppable spearhead."
 oe_msn_lit_03_vytis_lancers_req_tt:0 "Age of Renaissance+, hold Trakai, Gold >= 200, Armory or Cannon Maker, and Army Tradition >= 20 or Professional Armies."
 oe_msn_lit_04_baltic_crusade_broken:0 "Shatter the Baltic Crusades"
 oe_msn_lit_04_baltic_crusade_broken_desc:0 "Breaking through the amber coast to Palanga and the Memel estuary ends two centuries of crusader blockade against the Grand Duchy. Turning the Prussian shore into a secure [core|e] rewards our [army_tradition|e] with Baltic [maritime_presence|e] and direct access to sea [trade|e]."
 oe_msn_lit_04_baltic_crusade_broken_req_tt:0 "Age of Discovery+, hold Palanga, Memel, Konigsberg, or Malbork, Stability >= 12, Training Fields or Dry Dock, and Army Tradition >= 25."
 oe_msn_lit_05_daugava_polotsk:0 "Daugava Gate of Polotsk & Vitebsk"
 oe_msn_lit_05_daugava_polotsk_desc:0 "Timber, beeswax, and flax floated down the Western Dvina through Polotsk and Vitebsk toward Riga's Hanseatic wharves. Securing these ancient Rus river cities as our [core|e] enriches the northern [market|e], fills the treasury with [gold|e], and deepens riverine [prosperity|e]."
 oe_msn_lit_05_daugava_polotsk_req_tt:0 "Hold Polotsk and Vitebsk (or via subjects), and own a Marketplace or Guild Hall."
 oe_msn_lit_06_smolensk_bastion:0 "Secure the Smolensk Dnieper Bastion"
 oe_msn_lit_06_smolensk_bastion_desc:0 "Perched above the upper Dnieper portage, Smolensk commands the classic invasion highway between Moscow and Vilnius. Claiming this eastern [fort|e] as a permanent [core|e] projects Lithuanian [control|e] across the Russian borderlands and bolsters ducal [prestige|e]."
 oe_msn_lit_06_smolensk_bastion_req_tt:0 "Hold Smolensk (or via subjects) and Nobles Satisfaction >= 50%."
 oe_msn_lit_07_kyiv_blue_waters:0 "Kyiv & the Victory of Blue Waters"
 oe_msn_lit_07_kyiv_blue_waters_desc:0 "At the Battle of Blue Waters, Grand Duke Algirdas shattered the Golden Horde's western tumens and brought ancient Kyiv under Gediminid protection. Restoring the Mother of Rus Cities as a loyal [core|e] multiplies our [manpower|e], lifts urban [development|e], and wins steppe [prestige|e]."
 oe_msn_lit_07_kyiv_blue_waters_req_tt:0 "Hold Kyiv and Chernihiv or Lutsk (or via subjects), and Army Tradition >= 15 or at least 1 subject."
 oe_msn_lit_08_baltic_to_black_sea:0 "Baltic-to-Black-Sea Ruthenian Corridor"
 oe_msn_lit_08_baltic_to_black_sea_desc:0 "Vytautas dreamed of watering Lithuanian horses in the Black Sea, linking Riga's grain fleets to Crimean silk caravans along one unbroken corridor. Holding both coasts with loyal [subjects|e] transforms our [trade|e] network, floods coffers with [gold|e], and secures continental [control|e]."
 oe_msn_lit_08_baltic_to_black_sea_req_tt:0 "Age of Renaissance+, hold Dashev, Cetatea Alba, or Riga, 140+ locations owned or by subjects, and own a port or Trade/Tax Income >= 60."
 oe_msn_lit_09_trifaith_synthesis:0 "Pagan-Orthodox-Catholic Synthesis"
 oe_msn_lit_09_trifaith_synthesis_desc:0 "Few European realms balanced ancestral Baltic groves, Orthodox Rus cathedrals, and Latin parishes under one tolerant crown as deftly as Lithuania. Harmonizing diverse [estates|e] and [estate_satisfaction|e] turns multi-confessional [diplomacy|e] into durable domestic [stability|e]."
 oe_msn_lit_09_trifaith_synthesis_req_tt:0 "Hold Vilnius and Kreva (or via subjects), Stability >= 10, Temple or Monastery, and Clergy Satisfaction >= 50%."
 oe_msn_lit_10_krewo_horodlo_compact:0 "Compacts of Krewo & Horodlo"
 oe_msn_lit_10_krewo_horodlo_compact_desc:0 "The acts of Krewo and Horodlo wove Lithuanian heraldry, Magdeburg charters, and Polish alliances into a dignified constitutional order. Elevating the [capital|e] with civic [development|e] strengthens [diplomatic_reputation|e] and enriches Vilnius [cultural_tradition|e]."
 oe_msn_lit_10_krewo_horodlo_compact_req_tt:0 "Age of Renaissance+, hold Vilnius, Gold >= 240, Capital Development >= 16, and own a University or Counting House."
 oe_msn_lit_11_statute_chancery:0 "Lithuanian Statute & Grand Ducal Chancery"
 oe_msn_lit_11_statute_chancery_desc:0 "Drafted in Ruthenian chancery prose and printed across the realm, the Lithuanian Statutes became Eastern Europe's finest monument of codified jurisprudence. Pairing legal [institutions|e] with rising [literacy|e] sharpens [cabinet|e] governance and safeguards [crown_power|e]."
 oe_msn_lit_11_statute_chancery_req_tt:0 "Age of Discovery+, hold Vilnius, Stability >= 15, embrace Printing Press, and own a Printing Press Shop or Library."
 oe_msn_lit_12_grand_duchy_great_power:0 "Grand Duchy Great Power Capstone"
 oe_msn_lit_12_grand_duchy_great_power_desc:0 "No longer a junior partner in any western union, the Grand Duchy commands the amber ports, the Dnieper granaries, and the respect of rival courts. Anchored by thriving [capital|e] [prosperity|e] and sovereign [legitimacy|e], Vilnius ascends as an enduring Eastern [great_power|e]."
 oe_msn_lit_12_grand_duchy_great_power_req_tt:0 "Age of Reformation+, hold Ruthenia core and Vilnius, Stability >= 18, Capital Development >= 24, and Great Power or Trade/Tax Income >= 100."
 oe_msn_nov_destiny:0 "#bold #color_yellow Lord Novgorod the Great: Sovereign Republic of the North#!#!"
 oe_msn_nov_destiny_DESCRIPTION:0 "From the St. Sophia Veche Bell and Hanseatic Peterhof Silver to the Neva Fortress Belt, Pomor White Sea Fur Routes, and Ushkuiniki Volga Expeditions"
 oe_msn_nov_destiny_CRITERIA_DESCRIPTION:0 "Defend the Veche and Pskov-Ladoga-Neva fortress belt, master Hanseatic silver and Pomor-Pechora fur frontiers, launch Ushkuiniki Volga expeditions, and forge the Great Republic of the North."
 oe_msn_nov_destiny_BUTTON_TOOLTIP:0 "Embark on the Sovereign Republic of Novgorod Destiny"
 oe_msn_nov_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Novgorod: fortify the Pskov, Staraya Ladoga, Oreshek, and Neva belt and field Ushkuiniki Raiders; expand the Pomor White Sea and Pechora fur frontier while striking down the Volga; and elevate the Peterhof Kontor and birch-bark civic culture into the Great Republic of the North."
 oe_msn_nov_01_veche_sophia_bell:0 "Sovereign Veche & St. Sophia Bell"
 oe_msn_nov_01_veche_sophia_bell_desc:0 "Whenever the bronze veche bell rang beside St. Sophia Cathedral, merchants and posadniks gathered across the Volkhov to bind princes by oath and charter. Guarding civic [parliament|e] and salt-boiling [buildings|e] sustains [stability|e] and fuels urban [development|e]."
 oe_msn_nov_01_veche_sophia_bell_req_tt:0 "Hold Novgorod and Staraya Russa (or via subjects), Stability >= 5, Marketplace or Cathedral, and Burghers Satisfaction >= 50%."
 oe_msn_nov_02_pskov_ladoga_belt:0 "Pskov, Ladoga & Oreshek Fortress Belt"
 oe_msn_nov_02_pskov_ladoga_belt_desc:0 "Limestone kremlins at Pskov, Staraya Ladoga, and island Oreshek formed the stone shield that broke Swedish and Livonian assaults on Lake Ilmen. Welding this frontier [fort|e] chain into our [core|e] strengthens northwestern [control|e] and seasons civic [army_tradition|e]."
 oe_msn_nov_02_pskov_ladoga_belt_req_tt:0 "Hold Pskov, Staraya Ladoga, and Oreshek (or via subjects), and own a Castle."
 oe_msn_nov_03_neva_baltic_gate:0 "Master the Neva Baltic Gate"
 oe_msn_nov_03_neva_baltic_gate_desc:0 "Through the freezing waters of the Neva estuary passed every cog carrying Flemish cloth eastward and Russian sable westward. Securing the Baltic gate as a [core|e] builds [maritime_presence|e], trains northern [sailors|e], and deepens republican [navy_tradition|e]."
 oe_msn_nov_03_neva_baltic_gate_req_tt:0 "Hold Neva, Koporye, and Korela or Ivangorod (or via subjects), Stability >= 10, Wharf or Fishing Village, and own a port."
 oe_msn_nov_04_ushkuiniki_river_host:0 "Charter the Ushkuiniki River Host"
 oe_msn_nov_04_ushkuiniki_river_host_desc:0 "Daring ushkuiniki mariners rowed shallow-draft river galleys across portages to raid rival princes from the Kama to the Volga. Commissioning these corsairs with [gold|e] into salaried [regulars|e] fuses our [army|e] and river [navy|e] into a disciplined amphibious force."
 oe_msn_nov_04_ushkuiniki_river_host_req_tt:0 "Age of Renaissance+, hold Novgorod, Gold >= 220, Armory or Dock, and Army Tradition >= 18 or Navy Tradition >= 15."
 oe_msn_nov_05_pomor_white_sea:0 "Pomor White Sea & Dvina Coast"
 oe_msn_nov_05_pomor_white_sea_desc:0 "Along the misty White Sea littoral, Pomor fishers and salt-makers navigated drift ice in sturdy koch hulls to link the Northern Dvina with subarctic fisheries. Developing these cold shores expands our [sailors|e] pool, boosts maritime [trade|e], and yields steady [gold|e]."
 oe_msn_nov_05_pomor_white_sea_req_tt:0 "Hold Kholmogory, Arkhangelsk, and Pomorye (or via subjects), and own at least 3 ports."
 oe_msn_nov_06_pechora_fur_frontier:0 "Pechora & Yugra Fur Frontier"
 oe_msn_nov_06_pechora_fur_frontier_desc:0 "Beyond Vologda lay the boundless taiga of Pechora and Yugra, where winter tribute in arctic fox, ermine, and black sable underpinned Novgorod's silver wealth. Extending [control|e] over Veliky Ustyug's [core|e] supplies the northern [market|e] while keeping frontier [estates|e] content."
 oe_msn_nov_06_pechora_fur_frontier_req_tt:0 "Hold Vologda and Pechora, Pustozersk, Mezen, or Veliky Ustyug (or via subjects), and Peasants Satisfaction >= 50%."
 oe_msn_nov_07_volga_ushkuiniki_raids:0 "Ushkuiniki Volga River Expeditions"
 oe_msn_nov_07_volga_ushkuiniki_raids_desc:0 "By striking down the Volga toward Kostroma and Nizhny Novgorod, Novgorod broke Muscovite grain embargoes and seized the eastern river fairs. Planting our [core|e] on the upper Volga redirects Caspian [trade|e], expands civic [manpower|e], and broadcasts republican [prestige|e]."
 oe_msn_nov_07_volga_ushkuiniki_raids_req_tt:0 "Age of Renaissance+, hold Vyatka, Kostroma, Yaroslavl, or Nizhny Novgorod, and Army Tradition >= 15 or Professional Armies."
 oe_msn_nov_08_master_russian_rivers:0 "Sovereign of the Russian Riverways"
 oe_msn_nov_08_master_russian_rivers_desc:0 "Instead of bowing to autocratic princes, the merchant republic now rules the portages linking the Volkhov, Oka, and Volga basins. Absorbing Tver and Moscow into our [core|e] cements continental [control|e], enriches inland [market|e] centers, and sustains [prosperity|e] across Rus."
 oe_msn_nov_08_master_russian_rivers_req_tt:0 "Age of Discovery+, hold Tver, Moscow, or Kazan, 210+ locations owned or by subjects, and own a Trading Hub or Merchants' Quarters."
 oe_msn_nov_09_peterhof_kontor:0 "Hanseatic Peterhof Kontor & Baltic Silver"
 oe_msn_nov_09_peterhof_kontor_desc:0 "Within the timber palisades of the Peterhof Kontor, Hanseatic factors weighed Lubeck silver against crates of wax and pelts under strict Novgorodian treaties. Balancing commercial [diplomacy|e] with civic [buildings|e] enriches our [market|e] and lifts merchant [estate_satisfaction|e]."
 oe_msn_nov_09_peterhof_kontor_req_tt:0 "Hold Novgorod (or via subjects), Gold >= 220, Guild Hall or Marketplace, and Trade/Tax Income >= 25."
 oe_msn_nov_10_birchbark_literacy:0 "Birch-Bark Literacy & Civic Law"
 oe_msn_nov_10_birchbark_literacy_desc:0 "Artisans, widows, and apprentices etched contracts, lawsuits, and personal letters onto strips of birch bark, proving how deeply civic learning permeated Novgorod. Expanding public [literacy|e] and judicial [institutions|e] strengthens [stability|e] and nurtures [cultural_tradition|e]."
 oe_msn_nov_10_birchbark_literacy_req_tt:0 "Age of Renaissance+, hold Novgorod, Stability >= 12, Library or University, and Capital Development >= 16."
 oe_msn_nov_11_northern_maritime_exchange:0 "Baltic-Arctic Sovereign Exchange"
 oe_msn_nov_11_northern_maritime_exchange_desc:0 "Linking Baltic convoys with Arctic White Sea trade houses turns Novgorod from a foreign kontor host into an independent sovereign exchange. Adopting modern financial [institutions|e] curbs [inflation|e], multiplies sea [trade|e], and expands northern [maritime_presence|e]."
 oe_msn_nov_11_northern_maritime_exchange_req_tt:0 "Age of Discovery+, hold Novgorod and Kholmogory, Gold >= 350, embrace Banking, Dry Dock or Trading Hub, and Trade/Tax Income >= 65."
 oe_msn_nov_12_great_republic_north:0 "Great Republic of the North Capstone"
 oe_msn_nov_12_great_republic_north_desc:0 "Lord Novgorod the Great has defied the fate of medieval city-states to command every river and frozen coast of the Eurasian north. Sustained by [capital|e] [prosperity|e] and free [parliament|e] rule, the republic takes its rightful chair as a sovereign northern [great_power|e]."
 oe_msn_nov_12_great_republic_north_req_tt:0 "Age of Reformation+, hold Northern Corridor, Stability >= 18, Capital Development >= 24, and Great Power or Trade/Tax Income >= 100."
 oe_gem1_lit_vytis_lancers:0 "Grand Ducal Vytis Lancers"
 oe_gem1_lit_vytis_lancers_desc:0 "Armored noble lancers riding under the crimson Vytis banner of Vilnius and Trakai, blending Baltic woodland mobility with heavy shock charges forged against Teutonic crusaders and steppe tumens."
 oe_gem1_nov_ushkuiniki_raiders:0 "Novgorodian Ushkuiniki Raiders"
 oe_gem1_nov_ushkuiniki_raiders_desc:0 "Battle-hardened riverine raiders and boarding axesmen operating from shallow-draft ushkui longboats, masters of surprise amphibious strikes along the Neva, Northern Dvina, and Volga waterways."
 oe_gem1_dec_lithuanian_statute.title:0 "Promulgate the First Statute of Lithuania"
 oe_gem1_dec_lithuanian_statute.desc:0 "With the Grand Ducal Chancery of Vilnius unified across Baltic and Ruthenian lands after #Y 1520#!, codify written land law, estate rights, and sovereign judicial authority into the landmark First Statute of Lithuania."
 oe_gem1_dec_lithuanian_statute.a:0 "Seal and promulgate the Statute of Lithuania"
 oe_gem1_dec_veche_northern_charter.title:0 "Enact the Great Veche Northern Commercial Charter"
 oe_gem1_dec_veche_northern_charter.desc:0 "After #Y 1380#!, ratify a unified republican charter at Yaroslav's Court binding Hanseatic Baltic silver tolls with Pomor White Sea fur and salt convoys under the sovereign seal of Lord Novgorod the Great."
 oe_gem1_dec_veche_northern_charter.a:0 "Ratify the Northern Commercial Charter by Veche acclamation"
 STATIC_MODIFIER_NAME_oe_gem1_mod_lithuanian_statute:0 "First Statute of Lithuania"
 STATIC_MODIFIER_DESC_oe_gem1_mod_lithuanian_statute:0 "Comprehensive Renaissance statutory law binds Baltic and Ruthenian courts under sovereign Grand Ducal jurisprudence, securing estate loyalty and fiscal efficiency."
 STATIC_MODIFIER_NAME_oe_gem1_mod_veche_northern_charter:0 "Great Veche Northern Commercial Charter"
 STATIC_MODIFIER_DESC_oe_gem1_mod_veche_northern_charter:0 "Unified commercial law linking Baltic Peterhof tolls with Pomor White Sea fur fleets enriches Novgorod's burghers and strengthens republican sovereignty."
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m1:0 "Breaker of the Baltic Crusades"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m1:0 "Shattering Teutonic dominance along the Baltic shore steels Lithuania's Vytis cavalry and frontier castles."
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m2:0 "Baltic-to-Black-Sea Corridor"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m2:0 "Commanding the Daugava, Dnieper, and Pontic approaches floods Vilnius with riverine customs and loyal Ruthenian tribute."
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m3:0 "Grand Ducal Chancery Renaissance"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m3:0 "Chancery Ruthenian jurisprudence, printed treatises, and tri-faith tolerance make Vilnius an intellectual capital of Eastern Europe."
 STATIC_MODIFIER_NAME_oe_gem1_msn_lit_m4:0 "Grand Duchy Great Power"
 STATIC_MODIFIER_DESC_oe_gem1_msn_lit_m4:0 "Stretching from Baltic ports to Kyiv and Smolensk beneath written statutes and unbeaten Vytis Lancers crowns Lithuania as an enduring continental Great Power."
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m1:0 "Chartered Ushkuiniki Marine Host"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m1:0 "Disciplined riverine raiders and Baltic fortress garrisons turn Novgorod's waterways into lethal ambush zones."
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m2:0 "Sovereign of the Northern Rivers"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m2:0 "Uniting the Volkhov, Northern Dvina, Pechora, and Upper Volga trade routes secures unrivaled fur and silver supremacy."
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m3:0 "Baltic-Arctic Commercial Exchange"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m3:0 "Synchronized customs houses from the Neva to Kholmogory channel global northern trade through Novgorod's merchant guilds."
 STATIC_MODIFIER_NAME_oe_gem1_msn_nov_m4:0 "Great Republic of the North"
 STATIC_MODIFIER_DESC_oe_gem1_msn_nov_m4:0 "From Pskov and the Neva to the White Sea and Volga, the sovereign Veche stands triumphant as the premier mercantile republic of northern Eurasia."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev1_a:0 "Grand Ducal Chancery of Vilnius"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev1_a:0 "Bilingual Ruthenian-Latin charters streamline governance and elevate Vilnius's diplomatic standing across Eastern Europe."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev1_b:0 "Trakai Co-Rulership Watch"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev1_b:0 "Fast frontier scouts and fortified river crossings shield western Lithuania from sudden raids."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev2_a:0 "Victors of Blue Waters"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev2_a:0 "Lithuanian heavy cavalry rides with unmatched confidence after routing the Golden Horde in open steppe warfare."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev2_b:0 "Ruthenian Princely Compact"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev2_b:0 "Preserving old Ruthenian charters and customs secures loyal vassal levies and brisk tribute across the Dnieper basin."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev3_a:0 "Trakai Island Fortifications"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev3_a:0 "Water-ringed brick citadels across Trakai and Kaunas turn every western invasion into a costly siege."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev3_b:0 "Trakai Guard Communities"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev3_b:0 "Loyal Karaite and Tatar retainers bolster Lithuania's garrison pool and showcase the Grand Duchy's cosmopolitan tolerance."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev4_a:0 "Latin Chancery of Vilnius"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev4_a:0 "Recognition from European courts strips the crusading orders of moral pretext and accelerates Renaissance exchange."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev4_b:0 "Vilnius Tri-Faith Concord"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev4_b:0 "Guaranteed religious liberty binds Samogitian elders, Orthodox boyars, and Catholic townsmen peacefully beneath one grand ducal crown."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev5_a:0 "Grunwald Vytis Lancer Doctrine"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev5_a:0 "Disciplined maneuver and devastating countercharges make Grand Ducal heavy cavalry feared across the Baltic plain."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev5_b:0 "Smolensk Iron Regiments"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev5_b:0 "Steadfast Ruthenian heavy footmen who held the center at Grunwald set a lasting standard of battlefield discipline."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev6_a:0 "Crown of Grand Duke Vytautas"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev6_a:0 "The splendor of the Congress of Lutsk anchors Vilnius as an unmistakable sovereign power from the Baltic to the Pontic steppe."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev6_b:0 "Horodlo Heraldic Concord"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev6_b:0 "Shared noble coats of arms and balanced council seats harmonize Lithuanian magnates with regional allies."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev7_a:0 "Sovereign Statute Tribunals"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev7_a:0 "Written jurisprudence curtails arbitrary feudal fees and boosts state control, tax yield, and legal scholarship."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev7_b:0 "Charter of Lithuanian Liberties"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev7_b:0 "Protected burgher charters and confessional peace attract artisans, printers, and scholars from across Reformation Europe."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev8_a:0 "Baltic-Black Sea River Exchange"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev8_a:0 "Timber, flax, grain, and Pontic wares move smoothly along guarded Lithuanian waterways linking two seas."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev8_b:0 "Hegemon of the Intermarium"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev8_b:0 "Modernized Vytis cavalry banners and massive Ruthenian levies deter every imperial challenger on two frontiers."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev9_a:0 "Sovereign Council of Lords"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev9_a:0 "Experienced posadniks and disciplined civic chanceries keep republican administration swift without sacrificing liberty."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev9_b:0 "Civic Guilds of the Five Ends"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev9_b:0 "Empowered guildhalls and artisan wards pour lively commerce and steady customs dues into Novgorod's treasury."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev10_a:0 "Peterhof Silver Accord"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev10_a:0 "Mutual weight standards and verified fur grading restore booming Baltic silver inflows without yielding sovereignty."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev10_b:0 "St. John's Wax & Fur Monopoly"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev10_b:0 "Native Novgorodian merchant associations capture the lucrative wholesale margins once skimmed by foreign factors."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev11_a:0 "Ushkuiniki River Vanguard"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev11_a:0 "Swift amphibious skirmishers outpace conventional feudal armies along every northern river and forest portage."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev11_b:0 "Volkhov-Volga Escort Flotilla"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev11_b:0 "Armed republican galleys guard fur barges and Baltic merchant convoys against piracy and rival customs seizures."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev12_a:0 "Birch-Bark Civic Literacy"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev12_a:0 "Remarkable urban literacy accelerates commercial accounting, cartography, and scholarly innovation across the republic."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev12_b:0 "Novgorod Judicial Charter"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev12_b:0 "Transparent mixed courts and written procedural guarantees calm factional feuds and strengthen provincial governance."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev13_a:0 "Pomor Koch Arctic Fleet"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev13_a:0 "Ice-worthy Pomor shipyards push Novgorodian settlements and maritime charts far across the Arctic rim."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev13_b:0 "White Sea Salt & Sable Syndicates"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev13_b:0 "Organized northern salt boilers and fur auctions generate vast export surpluses for Baltic and Volga markets."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev14_a:0 "Neva-Pskov Winter Shield"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev14_a:0 "Layered stone bastions and frozen bog defenses exact a brutal toll on every invading host."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev14_b:0 "Standing Guard of Lord Novgorod"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev14_b:0 "Paid professional officers drill citizen levies and Ushkuiniki veterans into a steadfast republican army."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev15_a:0 "Northern Sea Admiralty"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev15_a:0 "Well-rigged Baltic escorts and White Sea patrols project Novgorodian maritime presence across two seas."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev15_b:0 "Charter of the Northern Sea"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev15_b:0 "Direct credit clearing with Dutch, English, and Baltic factors makes Novgorod's entrepots the richest hubs in northern Europe."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev16_a:0 "Federated Republic of All Rus'"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev16_a:0 "Chartered urban assemblies and rapid civic integration turn every annexed principality into a thriving republican partner."
 STATIC_MODIFIER_NAME_oe_gem1_mod_ev16_b:0 "Great Banner of St. Sophia"
 STATIC_MODIFIER_DESC_oe_gem1_mod_ev16_b:0 "Iron republican discipline and unbroken civic pride prove free citizens can outfight any autocratic empire."
 oe_gem1.1.title:0 "The Gediminid Chancery of Vilnius and Trakai"
 oe_gem1.1.desc:0 "As Algirdas assumes the grand ducal seat in Vilnius while Kestutis guards the western castles from Trakai, scribes fluent in Chancery Ruthenian, Latin, and German assemble to administer a rapidly expanding Baltic-Ruthenian realm. Guiding the Grand Ducal Chancery now will define whether Vilnius rules through diplomatic law or border arms."
 oe_gem1.1.a:0 "Expand the polyglot Grand Ducal Chancery in Vilnius"
 oe_gem1.1.b:0 "Empower the Trakai western march co-rulership"
 oe_gem1.2.title:0 "Triumph at the Battle of Blue Waters"
 oe_gem1.2.desc:0 "On the banks of the Syni Vody, Lithuanian and Ruthenian banners shatter three Golden Horde tumens in a decisive steppe campaign. With Mongol tribute broken across the Dnieper valley, Kyiv, Podolia, and the fertile black-earth plains lie open before Vilnius's advancing host."
 oe_gem1.2.a:0 "Press the pursuit across the Dnieper with heavy horse"
 oe_gem1.2.b:0 "Confirm Ruthenian princely autonomy under Vilnius"
 oe_gem1.3.title:0 "Stone Bastions of Trakai Island Castle"
 oe_gem1.3.desc:0 "Decades of relentless Teutonic Reisen raids have taught Lithuania that wooden hillforts alone cannot endure siege engines. Masons raise red-brick walls upon the rocky island of Lake Galve at Trakai, while exiled Karaite and Tatar warriors offer loyal service as personal guards to the Grand Duke."
 oe_gem1.3.a:0 "Complete the red-brick island citadel and moatworks"
 oe_gem1.3.b:0 "Charter Karaite and Tatar guard settlements at Trakai"
 oe_gem1.4.title:0 "Baptism of Vilnius or Tri-Faith Synthesis"
 oe_gem1.4.desc:0 "With Latin Europe pressing the Teutonic crusade on one border and millions of Orthodox Ruthenians living inside the Grand Duchy, Vilnius faces its most fateful spiritual crossroads. Accepting Catholic baptism removes the crusaders' pretext and opens Western crowns, yet preserving harmonious balance among ancient Baltic, Orthodox, and Catholic subjects remains vital to internal peace."
 oe_gem1.4.a:0 "Embrace Latin baptism and Western diplomatic legitimacy"
 oe_gem1.4.b:0 "Uphold solemn Tri-Faith Pagan-Orthodox-Catholic concord"
 oe_gem1.5.title:0 "Thunder at Grunwald and Tannenberg"
 oe_gem1.5.desc:0 "Beneath forty fluttering banners bearing the Vytis and the Columns of Gediminas, Grand Duke Vytautas leads Lithuanian horsemen, Samogitian warriors, and three ironclad Smolensk regiments onto the rolling fields of Grunwald. Feigned cavalry withdrawal and unyielding Ruthenian infantry shatter the Teutonic Knights in one of medieval Europe's greatest clashes."
 oe_gem1.5.a:0 "Codify Vytautas's Vytis cavalry feigned-retreat doctrine"
 oe_gem1.5.b:0 "Honor the unbreakable Smolensk infantry regiments"
 oe_gem1.6.title:0 "Congress of Lutsk and Vytautas's Crown"
 oe_gem1.6.desc:0 "Kings, imperial envoys, papal legates, and Tatar khans gather at Lutsk Castle for thirteen weeks of lavish statecraft. Offered a royal crown to elevate Lithuania into a sovereign kingdom alongside Europe's premier monarchies, Vilnius weighs outright imperial independence against deepening the Horodlo noble brotherhood with Poland."
 oe_gem1.6.a:0 "Claim sovereign royal majesty for the Lithuanian throne"
 oe_gem1.6.b:0 "Deepen the Horodlo heraldic brotherhood of the estates"
 oe_gem1.7.title:0 "Codification of the Statutes of Lithuania"
 oe_gem1.7.desc:0 "Jurists of the Grand Ducal Chancery present a monumental legal code written in Chancery Ruthenian—binding sovereign authority, property security, criminal procedure, and religious peace into one coherent Renaissance statute. Few realms in sixteenth-century Europe possess so systematic a foundation of written law."
 oe_gem1.7.a:0 "Enforce uniform sovereign courts and cadastral law"
 oe_gem1.7.b:0 "Enshrine civic liberties and multi-confessional peace"
 oe_gem1.8.title:0 "Hegemony from the Baltic to the Black Sea"
 oe_gem1.8.desc:0 "From the amber ports and timber barges of the Neman and Daugava to the grain-rich estates of Kyiv and the southern steppes, the Grand Duchy of Lithuania has matured into a continental colossus. Vilnius now chooses whether to crown its golden century as an Intermarium trade emporium or an unrivalled martial arbiter of Eastern Europe."
 oe_gem1.8.a:0 "Transform the Dnieper-Neman corridor into an Intermarium exchange"
 oe_gem1.8.b:0 "Proclaim Grand Ducal martial primacy across Eastern Europe"
 oe_gem1.9.title:0 "Bell of the Great Veche Assembly"
 oe_gem1.9.desc:0 "When the bronze bell tolls over Yaroslav's Court, boyars, merchant guilds, and free craftsmen from all five districts of Novgorod stream across the Volkhov Bridge. Electing the Posadnik and Tysiatsky in open assembly reaffirms the ancient boast: Who can stand against God and Lord Novgorod the Great?"
 oe_gem1.9.a:0 "Strengthen the Council of Lords and Posadnik executive"
 oe_gem1.9.b:0 "Broaden merchant and artisan suffrage in the Veche"
 oe_gem1.10.title:0 "Dispute at the Hanseatic Peterhof Kontor"
 oe_gem1.10.desc:0 "Behind the palisades of the Peterhof Kontor, Lubeck and Gotland factors complain of Novgorodian wax inspections and river tolls, threatening a Baltic trade embargo. Novgorod's wax and sable merchants counter that Hanseatic silver weights have grown short and demand sovereign control over the Volkhov quay."
 oe_gem1.10.a:0 "Negotiate a balanced Baltic silver treaty with the Hansa"
 oe_gem1.10.b:0 "Enforce native Novgorodian wax and fur guild monopolies"
 oe_gem1.11.title:0 "Sails of the Ushkuiniki River Fleet"
 oe_gem1.11.desc:0 "Dozens of swift shallow-draft ushkui longboats slip down the rivers toward Kostroma, Nizhny Novgorod, and the middle Volga. Financed by enterprising boyars and manned by daring oarsmen, the Ushkuiniki can project Novgorodian steel deep into rival principalities—or escort merchant barges safely past steppe and river brigands."
 oe_gem1.11.a:0 "Unleash the Ushkuiniki as an offensive river strike corps"
 oe_gem1.11.b:0 "Commission Ushkuiniki squadrons as river convoy escorts"
 oe_gem1.12.title:0 "Birch-Bark Literacy and the House of St. Sophia"
 oe_gem1.12.desc:0 "Unlike realms where parchment belongs solely to cloisters, ordinary Novgorodian merchants, artisans, and householders tally debts, compose legal petitions, and teach children their letters on strips of silver birch bark. Under the Archbishop's patronage at St. Sophia, this civic literacy promises a northern renaissance of law and chronicle."
 oe_gem1.12.a:0 "Endow St. Sophia civic schools and chronicle scriptoria"
 oe_gem1.12.b:0 "Codify the Novgorod Judicial Charter for all five districts"
 oe_gem1.13.title:0 "Pomor Voyages Across the White Sea"
 oe_gem1.13.desc:0 "Hardy Pomor shipwrights at Kholmogory craft round-hulled koch vessels designed to rise safely above crushing pack ice rather than splinter. Sailing beyond the White Sea toward Kola, Mezen, and the Pechora estuary, they open an Arctic frontier rich in walrus ivory, sea salt, and prized Yugra sable."
 oe_gem1.13.a:0 "Fund Pomor koch shipyards and Arctic frontier charters"
 oe_gem1.13.b:0 "Organize White Sea saltworks and Pechora fur exchanges"
 oe_gem1.14.title:0 "Defense of the Neva and the Shelon Crisis"
 oe_gem1.14.desc:0 "Autocratic ambitions from the south and rival northern fleets along the Gulf of Finland converge to test whether a free Russian republic can survive the age of standing armies. The Veche must decide immediately whether to anchor its survival in impenetrable winter fortresses along the Neva and Pskov or drill a disciplined standing republican army."
 oe_gem1.14.a:0 "Harden Oreshek, Koporye, and Pskov winter bastion chains"
 oe_gem1.14.b:0 "Raise a disciplined standing republican militia"
 oe_gem1.15.title:0 "Charter of the Northern Sea"
 oe_gem1.15.desc:0 "As Atlantic caravels round northern Norway and Baltic merchants seek direct access to Russian naval timber, hemp, and fur, Novgorod holds the keys to both the Neva and the White Sea. Ratifying a grand Charter of the Northern Sea will turn the republic into a sovereign oceanic power."
 oe_gem1.15.a:0 "Establish the Sovereign Baltic-White Sea Admiralty"
 oe_gem1.15.b:0 "Open free international clearing houses at Novgorod and Kholmogory"
 oe_gem1.16.title:0 "Sovereign Republic of All Rus'"
 oe_gem1.16.desc:0 "Against every expectation of monarchs and khans, the bronze bell of St. Sophia still rings free across northern Eurasia. From the Gulf of Finland and the White Sea to the Upper Volga, cities look to Novgorod not as a conquered subject, but as the beacon of a federated Russian commonwealth governed by charter and consent."
 oe_gem1.16.a:0 "Proclaim the Federated Commonwealth of Free Cities"
 oe_gem1.16.b:0 "Raise the Great Banner of St. Sophia across Eurasia"
