 # NEW 2026-11-23 v23.0 Module B2: Latin Greece & Restoration of the Latin Empire (oe_lat_) — english localization (303 keys) (oe_lat_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v230_latin_greece_empire.py; edit the generator, not this file.
 oe_lat_fief:0 "Latin Fief of Romania"
 oe_lat_fief_desc:0 "A specialized landed feudal fiefdom modeled on the 1204 Partitio Terrarum Imperii Romaniae. Sharing its overlord's map color while bearing its own historic regional title, a Latin Fief answers every call to arms, remits a feudal tithe, maintains castle garrisons and Aegean galleys, and remains shielded from arbitrary diplomatic annexation."
 LEAD_oe_lat_fief:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_lat_fief:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_lat_fief_subject_opinion:0 "Latin Imperial Suzerainty"
 oe_lat_fief_overlord_opinion:0 "Latin Fief of Romania"
 oe_lat_fief_reform:0 "Partitio Baronial Fief Charter"
 oe_lat_fief_reform_desc:0 "Organizes Latin Greece and imperial conquests under the feudal customs of the 1204 Partitio and Assizes of Romania, strengthening fortifications, heavy knights, sea trade, and pragmatic tolerance."
 oe_lat_op_enfeoffed:0 "Invested Under the Partitio Charter"
 oe_lat_op_catalan_corridor:0 "Catalan-Aragonese Mediterranean Corridor"
 oe_lat_op_cyprus_cilicia_pact:0 "Cyprus-Cilicia Crusader Pact"
 oe_lat_op_tripartite_crusade:0 "Tripartite Catholic Crusade Accord"
 oe_lat_op_venetian_accord:0 "Venetian-Latin Aegean Trade Accord"
 oe_lat_dec_proclaim_latin_empire.title:0 "Proclaim the Restored Latin Empire"
 oe_lat_dec_proclaim_latin_empire.desc:0 "With our banners flying over Constantinople, sweep away medieval legal delays and solemnly proclaim the restored #Y Latin Empire (Imperium Romaniae)#! directly at Hagia Sophia—elevating our throne to Empire rank without late-age barriers."
 oe_lat_dec_proclaim_latin_empire.a:0 "Crown the Emperor of Romania in Hagia Sophia!"
 oe_lat_dec_proclaim_latin_empire_tt:0 "Restores #Y Imperium Romaniae (LAT)#!, elevates country rank to #Y Empire#!, moves capital to #Y Constantinople#! with a core, grants the #Y Partitio Baronial Fief Charter#!, and triggers the imperial coronation ceremony."
 oe_lat_dec_catalan_aragon_corridor.title:0 "Forge the Catalan-Aragonese Mediterranean Corridor"
 oe_lat_dec_catalan_aragon_corridor.desc:0 "Link Athens and Thebes directly with the fleets of Aragon and Sicily, forging a sweeping Iberian-Sicilian-Greek maritime hegemony backed by Almogavar crossbowmen and Catalan war galleys."
 oe_lat_dec_catalan_aragon_corridor.a:0 "Open the Mediterranean Sea-Lane from Barcelona to Athens"
 oe_lat_dec_catalan_aragon_corridor_tt:0 "Grants a #Y 30#!-year #Y Catalan-Aragonese Mediterranean Corridor#! modifier, raises mutual opinion with #Y Aragon#! and #Y Sicily#!, and musters Catalan crossbowmen and galleys in Athens."
 oe_lat_dec_enfeoff_thessalonica.title:0 "Partitio Tier 1: Enfeoff Kingdom of Thessalonica"
 oe_lat_dec_enfeoff_thessalonica.desc:0 "Invest our conquered non-capital territories in Macedonia as the specialized #Y Latin Fief of Thessalonica#! (never ceding our capital, Constantinople, or Thrace)."
 oe_lat_dec_enfeoff_thessalonica.a:0 "Grant the Partitio Charter of Thessalonica"
 oe_lat_dec_enfeoff_thessalonica_req_tt:0 "Directly own at least #Y 3#! non-capital locations in Macedonia (outside Thrace and Constantinople)."
 oe_lat_dec_enfeoff_thessalonica_tt:0 "Creates #Y Latin Thessalonica#! as a specialized #Y Latin Fief of Romania#! over our non-capital holdings in Macedonia, then opens the Investiture Ceremony."
 oe_lat_dec_enfeoff_morea_athens.title:0 "Partitio Tiers 2–3: Enfeoff Morea or Athens & Hellas"
 oe_lat_dec_enfeoff_morea_athens.desc:0 "Restore the classic Frankokratia fiefdoms of southern and central Greece under the Partitio Charter—investing either the #Y Principality of Achaea & Morea#! (Peloponnese) or the #Y Duchy of Athens & Hellas#! (Central Greece & Aegean Islands), never touching our capital or Thrace."
 oe_lat_dec_enfeoff_morea_athens.a:0 "Tier 2: Charter the Principality of Achaea & Morea"
 oe_lat_dec_enfeoff_morea_athens.b:0 "Tier 3: Charter the Duchy of Athens & Hellas"
 oe_lat_dec_enfeoff_morea_athens_req_tt:0 "Own at least #Y 3#! non-capital locations in Morea (if Tier 2 not yet chartered) OR in Northern Greece / Aegean Islands (if Tier 3 not yet chartered)."
 oe_lat_dec_enfeoff_morea_athens_a_tt:0 "Creates #Y Frankish Morea#! (Tier 2) as a specialized #Y Latin Fief of Romania#! over our non-capital Peloponnese holdings (falls back to Athens if Morea is unavailable)."
 oe_lat_dec_enfeoff_morea_athens_b_tt:0 "Creates #Y Attic Hellas#! (Tier 3) as a specialized #Y Latin Fief of Romania#! over our non-capital Central Greek & Aegean holdings (falls back to Morea if Athens is unavailable)."
 oe_lat_dec_enfeoff_nicaea_anatolia.title:0 "Partitio Tier 4: Enfeoff Latin Duchy of Nicaea & Anatolia"
 oe_lat_dec_enfeoff_nicaea_anatolia.desc:0 "Invest our conquered non-capital lands across Marmara, Bithynia, and Western Anatolia as the #Y Latin Duchy of Nicaea & Anatolia#! (never ceding our capital, Constantinople, or Thrace)."
 oe_lat_dec_enfeoff_nicaea_anatolia.a:0 "Grant the Partitio Charter of Nicaea & Anatolia"
 oe_lat_dec_enfeoff_nicaea_anatolia_req_tt:0 "Directly own at least #Y 4#! non-capital locations in Marmara or Western Anatolia."
 oe_lat_dec_enfeoff_nicaea_anatolia_tt:0 "Creates #Y Latin Nicaea#! as a specialized #Y Latin Fief of Romania#! over our non-capital Western Anatolian holdings, then opens the Investiture Ceremony."
 oe_lat_dec_enfeoff_outremer.title:0 "Partitio Tier 5: Enfeoff Principality of Outremer-Antioch"
 oe_lat_dec_enfeoff_outremer.desc:0 "Invest our conquered non-capital territories in Cilicia, Antioch, and the Levant as the #Y Principality of Outremer-Antioch#! (never ceding our capital, Constantinople, or Thrace)."
 oe_lat_dec_enfeoff_outremer.a:0 "Grant the Partitio Charter of Outremer-Antioch"
 oe_lat_dec_enfeoff_outremer_req_tt:0 "Directly own at least #Y 3#! non-capital locations in Cilicia or the Levant."
 oe_lat_dec_enfeoff_outremer_tt:0 "Creates #Y Outremer Antioch#! as a specialized #Y Latin Fief of Romania#! over our non-capital Cilician & Levantine holdings, then opens the Investiture Ceremony."
 oe_lat_dec_muster_frankish_knights.title:0 "Muster Western Crusader & Catalan Vanguard"
 oe_lat_dec_muster_frankish_knights.desc:0 "Dispatch recruiting heralds to France, Aragon, and Italy to raise veteran crusader knights or Catalan crossbowmen. Repeating every #Y 10 years#!, the summons grants #G +3#! manpower, #G +5#! army tradition, two standing vanguard regiments, and #G 5 years#! of campaign fervor."
 oe_lat_dec_muster_frankish_knights.a:0 "Call the Chivalric Vanguard to Our Banners"
 oe_lat_dec_muster_frankish_knights_tt:0 "Adds #G +3#! manpower, #G +5#! army tradition, spawns #Y 2#! standing Crusader Knight or Catalan Crossbowman units at our capital, and grants a #Y 5#!-year vanguard bonus (10-year cooldown)."
 oe_lat_dec_tripartite_crusade_accord.title:0 "Seal the Tripartite Catholic Crusade Accord"
 oe_lat_dec_tripartite_crusade_accord.desc:0 "Unite Latin Romania with the #Y Knights Hospitaller (Rhodes)#!, the #Y Teutonic Order (Marienburg)#!, and the #Y Holy See#! in a grand pan-Christian crusade compact."
 oe_lat_dec_tripartite_crusade_accord.a:0 "Swear the Three-Cross Crusade Accord"
 oe_lat_dec_tripartite_crusade_accord_tt:0 "Seals the #Y Tripartite Catholic Crusade Accord#!, grants a #Y 25#!-year crusade bonus to ourselves, the #Y Knights Hospitaller#!, and the #Y Teutonic Order#!, raises mutual opinion with #Y Rome#!, and convenes the Crusade Summit."
 oe_sit_frankokratia:0 "Twilight of the Aegean & Latin Restoration"
 oe_sit_frankokratia_desc:0 "Across the Peloponnese, Attica, the Cyclades, Cyprus, Cilicia, and the Straits, the surviving crusader baronies of Frankokratia face a three-way reckoning against Byzantine reconquest and the rising Turkish beyliks of Anatolia. Will a restored Latin Empire rise again in Hagia Sophia, or will Frankokratia fade into Aegean memory?"
 oe_sit_frankokratia_outcome_latin:0 "Restoration of Imperium Romaniae"
 oe_sit_frankokratia_outcome_latin_desc:0 "After 24 months, the Latin Empire holds Constantinople OR the Latin Ascendancy Index reaches 80."
 oe_sit_frankokratia_outcome_eastern:0 "Twilight of Frankokratia"
 oe_sit_frankokratia_outcome_eastern_desc:0 "After 24 months without a restored Latin Empire, the Latin Ascendancy Index drops to 15 or below, or the core Aegean Latin states fall."
 oe_sit_frankokratia_outcome_equilibrium:0 "Aegean Maritime Equilibrium"
 oe_sit_frankokratia_outcome_equilibrium_desc:0 "By 1520 without a decisive knockout, the Aegean settles into an enduring balance among Latin, Greek, and Anatolian powers."
 OE_LAT_SIT_TITLE:0 "Frankokratia Ascendancy & Aegean Struggle"
 OE_LAT_SIT_IDX_L:0 "Eastern Reconquest (15)"
 OE_LAT_SIT_IDX_R:0 "Latin Restoration (80)"
 OE_LAT_SIT_IDX_FOOT:0 "Live-tracked across Andravida, Athens, Naxos, Negroponte, Thessalonica, Constantinople, Bursa, and Antioch. Reach 80 or crown LAT in Constantinople for Latin Restoration; fall to 15 for Eastern Triumph."
 OE_LAT_SIT_PHASE_KPI:0 "Aegean Phase"
 OE_LAT_SIT_FIEFS_KPI:0 "Partitio Fiefs"
 OE_LAT_SIT_PRESS_KPI:0 "Eastern Pressure"
 OE_LAT_SIT_P1:0 "#Y Frankokratia Twilight#!"
 OE_LAT_SIT_P2:0 "#color_gold Contest for the Aegean#!"
 OE_LAT_SIT_P3:0 "#color_orange Battle for the Straits#!"
 OE_LAT_SIT_P4:0 "#G Imperium Romaniae#!"
 OE_LAT_SIT_LEGEND_TITLE:0 "Aegean & Straits Theater Legend"
 OE_LAT_SIT_LEGEND_DESC:0 "Country color: Restored Latin Empire; Green: Frankokratia baronies, Cyprus, Cilicia, Rhodes & Partitio Fiefs; Amber: Byzantine Empire & Mediterranean observers; Red: Ottoman & Anatolian Beylik coalition."
 oe_lat_sit_map_lat_tt:0 "Restored Latin Empire (Imperium Romaniae)."
 oe_lat_sit_map_fief_tt:0 "Chartered Latin Partitio Fief of Romania."
 oe_lat_sit_map_frank_tt:0 "Latin Greece or Eastern Crusader realm fighting for Frankokratia."
 oe_lat_sit_map_byz_tt:0 "Byzantine imperial realm striving to reclaim Greece and the Aegean."
 oe_lat_sit_map_tur_tt:0 "Ottoman or Anatolian Beylik power expanding across the Aegean."
 oe_lat_sit_map_nbr_tt:0 "Italian, Iberian, or Papal power watching the Aegean struggle."
 oe_msn_59_lat:0 "#bold #color_yellow Frankokratia & Imperium Romaniae: Crusade of the Aegean#!#!"
 oe_msn_59_lat_DESCRIPTION:0 "From Achaea, Catalan Athens, Naxos, Negroponte, Cyprus, and Cilicia to Hagia Sophia, Partitio enfeoffment, Outremer, and the Tripartite Catholic Crusade"
 oe_msn_59_lat_CRITERIA_DESCRIPTION:0 "Unite Latin Greece and break the Anatolian beyliks, restore the Latin Empire in Constantinople and charter Partitio fiefs, forge the Catalan-Outremer corridor and Tripartite Crusade, and achieve eternal Latin-Greek synthesis."
 oe_msn_59_lat_BUTTON_TOOLTIP:0 "Embark on the Frankokratia & Latin Empire Destiny"
 oe_msn_59_lat_BUTTON_DETAILS:0 "A sixteen-task four-branch flagship tree for Achaea, Athens, Naxos, Negroponte, Cephalonia, Cyprus, Cilicia, and the Latin Empire: survive Frankokratia's twilight, reclaim Thessalonica and Constantinople, forge the Catalan-Aragonese and Outremer crusade, and fuse Latin chivalry with Hellenic prosperity."
 oe_lat_law_assizes_romania:0 "Assizes of Romania Legal Code"
 oe_lat_law_assizes_romania_desc:0 "Codifies the feudal customs of Frankish Greece and the Latin Empire—choosing whether sovereign justice rests on hereditary Latin baronies, bilingual Greek archon co-governance, or chartered Aegean merchant communes."
 oe_lat_pol_frankish_baronial_fiefs:0 "Frankish Baronial Fiefs"
 oe_lat_pol_frankish_baronial_fiefs_desc:0 "Upholds the Twelve High Baronies and knightly liege-homage of the Assizes, binding Latin vassals and castle-holders in loyal feudal array."
 oe_lat_pol_greek_archon_cogovernance:0 "Greek Archon Co-Governance"
 oe_lat_pol_greek_archon_cogovernance_desc:0 "Admits Byzantine archons and local Greek notables into provincial courts and tax registries, widening realm control, fiscal intake, and inter-confessional peace."
 oe_lat_pol_maritime_merchant_charters:0 "Maritime Merchant Charters"
 oe_lat_pol_maritime_merchant_charters_desc:0 "Grants self-governing customs franchises to Latin, Venetian, Catalan, and Greek shipping guilds across Aegean harbors, accelerating sea trade and naval presence."
 oe_lat_law_company_levies:0 "Grand Company & Latin Knightly Levies Law"
 oe_lat_law_company_levies_desc:0 "Defines the military backbone of Frankokratia and Imperium Romaniae—balancing veteran Catalan free companies, Franco-Angevin heavy chivalry, and swift Aegean war-galley corsairs."
 oe_lat_pol_catalan_grand_company:0 "Standing Catalan Grand Company"
 oe_lat_pol_catalan_grand_company_desc:0 "Institutionalizes battle-hardened Almogavar infantry and mercenary contracts under royal captains, slashing mercenary upkeep while boosting field morale and siege assault."
 oe_lat_pol_franco_angevin_vanguard:0 "Franco-Angevin Chivalric Vanguard"
 oe_lat_pol_franco_angevin_vanguard_desc:0 "Musters armored French, Poitevin, and Neapolitan knights into disciplined lance-formations modeled on the flower of Western chivalry."
 oe_lat_pol_aegean_corsair_fleet:0 "Aegean Corsair Fleet"
 oe_lat_pol_aegean_corsair_fleet_desc:0 "Commissions island shipwrights and licensed Christian corsairs across Naxos, Negroponte, and Cyprus to sweep Anatolian raiders from the archipelago."
 oe_lat_law_church_union:0 "Aegean East-West Church Union Law"
 oe_lat_law_church_union_desc:0 "Determines how Latin crowns govern their Orthodox Greek and Eastern Christian majorities—ranging from papal-backed Latinization to a Uniate liturgical compromise or autonomous Greek metropolitans."
 oe_lat_pol_strict_latinization:0 "Strict Latinization"
 oe_lat_pol_strict_latinization_desc:0 "Endows Dominican and Franciscan friaries across Greece and Anatolia under the Roman See, speeding Catholic conversion and Papal goodwill at the cost of local resentment."
 oe_lat_pol_uniate_rite_compromise:0 "Uniate Rite Compromise"
 oe_lat_pol_uniate_rite_compromise_desc:0 "Preserves the Greek and Armenian liturgies in full communion with Rome, fostering diplomatic prestige, administrative harmony, and gradual voluntary union."
 oe_lat_pol_autonomous_greek_metropolitans:0 "Autonomous Greek Metropolitans"
 oe_lat_pol_autonomous_greek_metropolitans_desc:0 "Guarantees Orthodox metropolitan sees and monastic estates full self-rule in exchange for civil obedience, quieting separatism and lifting provincial prosperity."
 OE_LAT_FIEF_THESSALONICA:0 "Latin Thessalonica"
 OE_LAT_FIEF_THESSALONICA_ADJ:0 "Thessalonican-Latin"
 OE_LAT_FIEF_MOREA:0 "Frankish Morea"
 OE_LAT_FIEF_MOREA_ADJ:0 "Morean-Frankish"
 OE_LAT_FIEF_ATHENS:0 "Attic Hellas"
 OE_LAT_FIEF_ATHENS_ADJ:0 "Athenian-Latin"
 OE_LAT_FIEF_NICAEA:0 "Latin Nicaea"
 OE_LAT_FIEF_NICAEA_ADJ:0 "Nicaean-Latin"
 OE_LAT_FIEF_OUTREMER:0 "Outremer Antioch"
 OE_LAT_FIEF_OUTREMER_ADJ:0 "Outremer-Latin"
 oe_msn_lat_a1_secure_baronies:0 "Secure the Latin Baronies"
 oe_msn_lat_a1_secure_baronies_desc:0 "Across the hills of the Morea, Attica, and the island archipelagos, Frankish castles stand as islands amid rival empires. Securing our core [fort|e] citadels and sharpening knightly [army_tradition|e] ensures Frankokratia endures."
 oe_msn_lat_a1_secure_baronies_req_tt:0 "Maintain at least 5 Stability and reach 12 Army Tradition or own a Castle."
 oe_msn_lat_a2_unite_morea_attica:0 "Unite Morea & Attica"
 oe_msn_lat_a2_unite_morea_attica_desc:0 "For decades the Princes of Achaea and Dukes of Athens bled one another across the Isthmus of Corinth. Binding Andravida and Athens under one banner welds mainland Frankish Greece into a unified [control|e] heartland."
 oe_msn_lat_a2_unite_morea_attica_req_tt:0 "Own or have subjects own Andravida alongside Athens or Thebes."
 oe_msn_lat_a3_master_aegean_duchies:0 "Master the Aegean Duchies"
 oe_msn_lat_a3_master_aegean_duchies_desc:0 "From the marble towers of Naxos to the fortified bridge of Negroponte, command of the Cyclades and Euboea turns the Aegean into a Latin sea-fortress protecting our [trade|e] and galley lanes."
 oe_msn_lat_a3_master_aegean_duchies_req_tt:0 "Own or have subjects own Naxos and Negroponte, and field 10 ships or reach 12 Navy Tradition."
 oe_msn_lat_a4_break_beyliks:0 "Break the Anatolian Beyliks"
 oe_msn_lat_a4_break_beyliks_desc:0 "Landing armored banners across the Aegean onto Smyrna, Bursa, and Nicaea shatters the Turkish corsair beyliks at their source, securing eastern Christendom's [army|e] supremacy."
 oe_msn_lat_a4_break_beyliks_req_tt:0 "Control Bursa, Smyrna, Iznik, or Manisa (directly or via subjects), or directly own 3 locations in Marmara/West Anatolia."
 oe_msn_lat_b1_march_thessalonica:0 "March on Thessalonica"
 oe_msn_lat_b1_march_thessalonica_desc:0 "Once the royal seat of Boniface of Montferrat, Thessalonica commands the Via Egnatia toward Thrace. Reclaiming its walled [core|e] harbor opens the imperial highway to Constantinople."
 oe_msn_lat_b1_march_thessalonica_req_tt:0 "Own or have subjects own Thessaloniki."
 oe_msn_lat_b2_storm_queen_of_cities:0 "Storm the Queen of Cities"
 oe_msn_lat_b2_storm_queen_of_cities_desc:0 "Once more Latin banners climb the Golden Horn seawalls and fly beside the domes of Constantinople. Holding the Bosphorus [market|e] crossroads restores our claim to the imperial diadem."
 oe_msn_lat_b2_storm_queen_of_cities_req_tt:0 "Own or have subjects own Constantinople."
 oe_msn_lat_b3_proclaim_imperium_romaniae:0 "Proclaim Imperium Romaniae"
 oe_msn_lat_b3_proclaim_imperium_romaniae_desc:0 "Beneath the vast golden dome of Hagia Sophia, the Latin Emperor receives crown, orb, and sword, elevating Frankokratia's scattered baronies into an imperial [legitimacy|e] throne."
 oe_msn_lat_b3_proclaim_imperium_romaniae_req_tt:0 "Directly own Constantinople and proclaim the Latin Empire (LAT)."
 oe_msn_lat_b4_enforce_partitio:0 "Enforce the Partitio Enfeoffment"
 oe_msn_lat_b4_enforce_partitio_desc:0 "Drawing on the 1204 Partitio Terrarum Imperii Romaniae, Constantinople invests loyal Latin fiefs from Thessalonica and Morea to Nicaea and Antioch, anchoring our [subjects|e] and [crown_power|e]."
 oe_msn_lat_b4_enforce_partitio_req_tt:0 "Maintain at least 2 active Latin Partitio Fiefs, or control 45 locations (directly or via subjects)."
 oe_msn_lat_c1_catalan_company_supremacy:0 "Catalan Grand Company Supremacy"
 oe_msn_lat_c1_catalan_company_supremacy_desc:0 "Shouting 'Desperta ferro!' across the fields of Boeotia, the veterans of the Catalan Company proved fierce steel could humble feudal hosts. Harnessing their [army_tradition|e] and Mediterranean shipping gives our arms lethal reach."
 oe_msn_lat_c1_catalan_company_supremacy_req_tt:0 "Control Athens and Thebes (with subjects), and reach 15 Army Tradition, open the Catalan-Aragonese Corridor, or enact the Standing Catalan Grand Company policy."
 oe_msn_lat_c2_union_cyprus_cilicia:0 "Union with Cyprus & Cilicia"
 oe_msn_lat_c2_union_cyprus_cilicia_desc:0 "Linking Aegean Greece with Lusignan Cyprus and the mountain citadels of Cilician Armenia forms an unbroken Christian [maritime|e] bridge pointing directly at the Levantine shore."
 oe_msn_lat_c2_union_cyprus_cilicia_req_tt:0 "Control Nicosia or Sis (directly or via subjects), or hold an alliance with Cyprus or Cilician Armenia."
 oe_msn_lat_c3_reclaim_antioch_jerusalem:0 "Reclaim Antioch & Jerusalem"
 oe_msn_lat_c3_reclaim_antioch_jerusalem_desc:0 "From the Orontes citadel of Antioch to the sacred walls of Jerusalem, Crusader pennants rise once more over Outremer, filling Christendom with awe and radiant [prestige|e]."
 oe_msn_lat_c3_reclaim_antioch_jerusalem_req_tt:0 "Own or have subjects own Antioch or Jerusalem."
 oe_msn_lat_c4_tripartite_crusade:0 "Tripartite Catholic Crusade"
 oe_msn_lat_c4_tripartite_crusade_desc:0 "Uniting the restored Latin Empire with the Hospitallers of Rhodes and the Teutonic Knights of Marienburg under papal blessing creates a continental shield of [manpower|e] and faith from the Baltic to the Levant."
 oe_msn_lat_c4_tripartite_crusade_req_tt:0 "Reach 25 Prestige and seal the Tripartite Catholic Crusade Accord (or ally the Knights Hospitaller or Teutonic Order)."
 oe_msn_lat_d1_assizes_prosperity:0 "Assizes of Romania Prosperity"
 oe_msn_lat_d1_assizes_prosperity_desc:0 "Clear charters under the Assizes of Romania protect vineyard estates, silk workshops, and urban courts alike, turning our capital into a beacon of lawful [development|e] and [prosperity|e]."
 oe_msn_lat_d1_assizes_prosperity_req_tt:0 "Maintain 8 Stability and reach 12 Development or 25% Prosperity in our capital."
 oe_msn_lat_d2_aegean_commercial_monopoly:0 "Aegean Commercial Monopoly"
 oe_msn_lat_d2_aegean_commercial_monopoly_desc:0 "Silk from Thebes, Peloponnesian wine, Naxian marble, and Levantine spices converge in our chartered ports, establishing an enviable eastern Mediterranean [trade|e] monopoly."
 oe_msn_lat_d2_aegean_commercial_monopoly_req_tt:0 "Earn at least 20 monthly trade and tax income, or own a Marketplace, Dock, or Guild Hall."
 oe_msn_lat_d3_uniate_ecclesiastical_peace:0 "Uniate Ecclesiastical Peace"
 oe_msn_lat_d3_uniate_ecclesiastical_peace_desc:0 "Bridging Latin cathedrals and Greek metropolitan monasteries resolves the bitter wounds of 1204, securing serene [estate_satisfaction|e] and enduring religious peace across Romania."
 oe_msn_lat_d3_uniate_ecclesiastical_peace_req_tt:0 "Maintain 12 Stability and enact an Aegean Church Union policy or reach 55% Clergy satisfaction."
 oe_msn_lat_d4_eternal_latin_romania:0 "Eternal Latin Romania"
 oe_msn_lat_d4_eternal_latin_romania_desc:0 "From the castles of Morea and Attica to Hagia Sophia, Anatolia, and Outremer, Frankish chivalry, Catalan steel, and Greek civilization fuse into one radiant Mediterranean empire of eternal [crown_power|e]."
 oe_msn_lat_d4_eternal_latin_romania_req_tt:0 "Have 15 Stability, control Constantinople, Thessalonica, and Athens or Andravida, and hold 2 Partitio Fiefs or 60 total locations (with subjects)."
 oe_lat_emp.1.title:0 "1337 Frankokratia Crisis: Twilight Over the Aegean"
 oe_lat_emp.1.desc:0 "More than a century after the Fourth Crusade, the Latin lordships of Greece stand perilously hemmed in by Byzantine armies in Mystras, Catalan rivals in Boeotia, and Turkish corsair fleets crossing from Anatolia. At Andravida, Naxos, Negroponte, and Cephalonia, barons and burghers gather to decide whether to rally a standing crusader vanguard or invest our emergency war chest in fortified baronial recovery."
 oe_lat_emp.1.a:0 "Sound the Horns: Rally the Frankish Knights and Aegean War Chest!"
 oe_lat_emp.1.b:0 "Invest in Baronial Castles and Assizes Civic Recovery"
 oe_lat_emp.2.title:0 "Manifesto of the Catalan Grand Company"
 oe_lat_emp.2.desc:0 "Since smashing the Frankish chivalry at Halmyros in 1311, the iron-willed Almogavars of the Catalan Company have ruled Thebes, Athens, and Neopatras beneath the banner of St. George and the bars of Aragon. Now our captains debate the Duchy's destiny: anchor our throne tightly to the Royal House of Aragon and Sicily, or proclaim a sovereign Catalan mercenary republic-duchy answering to steel alone?"
 oe_lat_emp.2.a:0 "Bind Our Crown to the Royal Aragonese-Sicilian Dynasty"
 oe_lat_emp.2.b:0 "Proclaim a Sovereign Mercenary Republic-Duchy of Steel!"
 oe_lat_emp.3.title:0 "The Cyprus-Cilicia Crusader Pact"
 oe_lat_emp.3.desc:0 "Across the narrow Cilician strait, the Lusignan Kings of Cyprus and the Hethumid Kings of Cilician Armenia share bloodlines, mountain passes, and the perilous vanguard of Levantine Christendom. With Mamluk armies eyeing Sis and Turkish fleets probing Famagusta, our courts consider forging a formal Outremer defense pact or channeling royal capital into the lucrative Famagusta-Ayas silk emporium."
 oe_lat_emp.3.a:0 "Seal the Lusignan-Hethumid Outremer Defense Pact"
 oe_lat_emp.3.b:0 "Charter the Famagusta-Ayas Silk & Spice Emporium"
 oe_lat_emp.4.title:0 "Restoration of the Latin Empire at Hagia Sophia"
 oe_lat_emp.4.desc:0 "Bells peal across the Golden Horn as crimson-and-gold crosses ascend the marble galleries of Hagia Sophia. For the first time since Baldwin II fled in 1261, a Latin Emperor stands sovereign over the Queen of Cities. How shall we proclaim Imperium Romaniae before Europe and the Greek East—as an uncompromising Western imperial throne, or as a bilingual Latin-Greek commonwealth?"
 oe_lat_emp.4.a:0 "Receive the Diadem of Baldwin and Henry in Imperial Splendor!"
 oe_lat_emp.4.b:0 "Promulgate a Bilingual Latin-Greek Charter of Romania"
 oe_lat_emp.5.title:0 "Partitio Charter: Kingdom of Thessalonica"
 oe_lat_emp.5.desc:0 "Before the imperial throne, the newly invested lord of Latin Thessalonica swears liege homage over Macedonia and the Thermaic Gulf in the tradition of 1204. Shall this northern fief serve primarily as an armored frontier march guarding the Via Egnatia, or as a chartered commercial-agrarian barony integrating the Macedonian plains?"
 oe_lat_emp.5.a:0 "Charter Thessalonica as a Chivalric Frontier March"
 oe_lat_emp.5.b:0 "Charter Thessalonica as a Commercial & Agrarian Fief"
 oe_lat_emp.6.title:0 "Partitio Charter: Morea & Athens"
 oe_lat_emp.6.desc:0 "Heralds proclaim the renewal of our southern Greek baronies across the Peloponnese, Attica, and the Aegean archipelago. Under the ancient Assizes of Romania, shall the newly invested fief prioritize Frankish-Catalan castle garrisons or prosperous archon-burgher co-rule?"
 oe_lat_emp.6.a:0 "Enforce Chivalric Castle Garrisons Across Hellas"
 oe_lat_emp.6.b:0 "Grant Assizes Archon & Maritime Guild Liberties"
 oe_lat_emp.7.title:0 "Partitio Charter: Latin Duchy of Nicaea & Anatolia"
 oe_lat_emp.7.desc:0 "Across the Sea of Marmara, the fertile valleys of Bithynia, Nicaea, and Smyrna now kneel beneath our Latin Partitio banner—fulfilling the dream denied to Emperor Henry of Flanders three centuries ago. Shall this Anatolian duchy stand as an iron crusader frontier against the steppe and plateau, or as a trading and missionary province?"
 oe_lat_emp.7.a:0 "Raise the Anatolian Frontier Knights of Nicaea"
 oe_lat_emp.7.b:0 "Promote Marmara Silk Trade & Parish Integration"
 oe_lat_emp.8.title:0 "Partitio Charter: Principality of Outremer-Antioch"
 oe_lat_emp.8.desc:0 "From the Cilician gates to the stone citadels of Antioch and the Levant, the red cross of Outremer shines once more under imperial suzerainty. Shall our easternmost Partitio principality organize its barons as an unrelenting crusader garrison or reopen the pilgrim and spice harbors of the Levant?"
 oe_lat_emp.8.a:0 "Fortify the Crusader Bastions of Outremer"
 oe_lat_emp.8.b:0 "Reopen the Pilgrim & Levantine Spice Harbors"
 oe_lat_emp.9.title:0 "Summit of the Tripartite Catholic Crusade"
 oe_lat_emp.9.desc:0 "Envoys bearing the White Cross of Rhodes, the Black Cross of Marienburg, and the Papal Keys assemble at our court beside the crimson banners of Romania. Together, the Latin Empire, Knights Hospitaller, and Teutonic Order coordinate a grand continental strategy across the Mediterranean and Eastern Europe. Shall the Summit proclaim a joint land-and-sea offensive or endow a permanent three-orders naval and treasury league?"
 oe_lat_emp.9.a:0 "Proclaim the Joint Land-Sea Tripartite Crusade Offensive!"
 oe_lat_emp.9.b:0 "Establish the Permanent Three-Orders Armada & Treasury Pool"
 oe_lat_emp.10.title:0 "Parliament of the Assizes of Romania"
 oe_lat_emp.10.desc:0 "Barons, bailiffs, and municipal syndics convene to revise the celebrated Liber Consuetudinum Imperii Romaniae—the Assizes of Romania. Codifying feudal liberties and urban charters wins eager backing from estates and fiefs, whereas empowering salaried royal bailiffs tightens crown revenue and direct control."
 oe_lat_emp.10.a:0 "Codify Baronial & Municipal Liberties Under the Assizes"
 oe_lat_emp.10.b:0 "Empower Salaried Crown Bailiffs Across Every Province"
 oe_lat_emp.11.title:0 "The Venetian-Latin Aegean Trade Accord"
 oe_lat_emp.11.desc:0 "Venetian bailos from Modon, Coron, Candia, and Negroponte offer a comprehensive Aegean commercial treaty: lower harbor dues for the Most Serene Republic's galleys in exchange for banking credit, naval escorts, and booming transit trade. Yet our own merchants urge us to reject Venetian dominance and expand sovereign Latin shipyards."
 oe_lat_emp.11.a:0 "Ratify the Venetian Aegean Commercial Compact"
 oe_lat_emp.11.b:0 "Fund Sovereign Latin Shipyards & Customs Independence"
 oe_lat_emp.12.title:0 "Conciliation of the Greek Archons"
 oe_lat_emp.12.desc:0 "Prominent Greek archons and Orthodox abbots across our provinces petition the throne for confirmed land deeds, bilingual judges, and unhindered liturgical life. Embracing their partnership promises loyal taxpayers and peaceful countrysides, whereas upholding strict Frankish-Latin chivalric primacy preserves knightly privileges and missionary urgency."
 oe_lat_emp.12.a:0 "Grant Archon Charters & Orthodox Rite Autonomy"
 oe_lat_emp.12.b:0 "Uphold Frankish-Latin Chivalric Primacy"
 oe_lat_emp.13.title:0 "1204 Healed or Vindicated: Destiny of Imperium Romaniae"
 oe_lat_emp.13.desc:0 "With our banners flying triumphantly over Constantinople and the Aegean, scholars from Athens, Paris, Barcelona, and Rome look back upon the fateful year of 1204. Shall our restored empire solemnly heal the ancient breach by weaving Latin chivalry and Hellenic letters into a reborn Roman synthesis, or vindicate the Fourth Crusade as an unyielding Western imperial triumph?"
 oe_lat_emp.13.a:0 "Heal the Wound of 1204: Forge a Greco-Latin Renaissance"
 oe_lat_emp.13.b:0 "Vindicate the Fourth Crusade: Unyielding Latin Imperial Dominion!"
 oe_lat_emp.14.title:0 "Verdict of the Aegean: End of the Frankokratia Struggle"
 oe_lat_emp.14.desc:0 "After generations of sea battles off Euboea, mountain sieges across Morea, and diplomatic gambits for the Straits, the long struggle between Frankokratia, Byzantine reconquest, and Anatolian beyliks reaches its historic verdict. How shall the victors shape the new century of the Eastern Mediterranean?"
 oe_lat_emp.14.a:0 "Enshrine Our Hard-Won Martial Supremacy Over the Straits"
 oe_lat_emp.14.b:0 "Transform Victory into an Aegean Maritime Commonwealth"
 STATIC_MODIFIER_NAME_oe_lat_mod_law_transition:0 "Assizes Statute Promulgation"
 STATIC_MODIFIER_DESC_oe_lat_mod_law_transition:0 "Baronial courts and port bailiffs are promulgating the realm's newly enacted charter across every Latin province."
 STATIC_MODIFIER_NAME_oe_lat_mod_fief_foundation:0 "Chartered Partitio Fief Foundation"
 STATIC_MODIFIER_DESC_oe_lat_mod_fief_foundation:0 "Newly invested knights, castle garrisons, and Assizes judges stabilize a Partitio fief of Imperium Romaniae."
 STATIC_MODIFIER_NAME_oe_lat_mod_fief_military:0 "Chivalric Frontier Fief"
 STATIC_MODIFIER_DESC_oe_lat_mod_fief_military:0 "Chartered as an iron crusader bastion, this fief devotes its tithes to heavy knights, hill castles, and border defense."
 STATIC_MODIFIER_NAME_oe_lat_mod_fief_charter:0 "Assizes Commercial & Agrarian Fief"
 STATIC_MODIFIER_DESC_oe_lat_mod_fief_charter:0 "Governed through bilingual archon courts and chartered harbors, this fief fosters trade, tolerance, and urban prosperity."
 STATIC_MODIFIER_NAME_oe_lat_mod_catalan_aragon_corridor:0 "Catalan-Aragonese Mediterranean Corridor"
 STATIC_MODIFIER_DESC_oe_lat_mod_catalan_aragon_corridor:0 "War galleys and Almogavar veterans ply an unbroken sea lane linking Barcelona, Palermo, and Athens."
 STATIC_MODIFIER_NAME_oe_lat_mod_frankish_vanguard:0 "Western Crusader & Catalan Vanguard"
 STATIC_MODIFIER_DESC_oe_lat_mod_frankish_vanguard:0 "Fresh volunteers and armored captains from France, Aragon, and Italy reinforce our field banners."
 STATIC_MODIFIER_NAME_oe_lat_mod_tripartite_crusade_accord:0 "Tripartite Catholic Crusade Accord"
 STATIC_MODIFIER_DESC_oe_lat_mod_tripartite_crusade_accord:0 "Bound in mutual defense with Rhodes, Marienburg, and Rome, our armies and fleets campaign under unified crusader resolve."
 STATIC_MODIFIER_NAME_oe_lat_mod_frankokratia_rally:0 "1337 Frankokratia Emergency Rally"
 STATIC_MODIFIER_DESC_oe_lat_mod_frankokratia_rally:0 "Determined not to vanish from the Aegean, Latin barons and island shipmasters pool silver and steel for immediate defense."
 STATIC_MODIFIER_NAME_oe_lat_mod_baronial_recovery:0 "Assizes Baronial Reconstruction"
 STATIC_MODIFIER_DESC_oe_lat_mod_baronial_recovery:0 "Repaired castle keeps, fair rural assessments, and calm archon relations rebuild the sinews of Latin Greece."
 STATIC_MODIFIER_NAME_oe_lat_mod_catalan_royal_house:0 "Aragonese-Sicilian Royal Patronage"
 STATIC_MODIFIER_DESC_oe_lat_mod_catalan_royal_house:0 "Backed by Barcelona and Sicilian naval arsenals, the Catalan Duchy of Athens commands disciplined galleys and royal standing."
 STATIC_MODIFIER_NAME_oe_lat_mod_catalan_mercenary_duchy:0 "Sovereign Catalan Free Company Duchy"
 STATIC_MODIFIER_DESC_oe_lat_mod_catalan_mercenary_duchy:0 "Answering to battle-proven Almogavar captains, our independent martial duchy fields relentless shock infantry and siege troops."
 STATIC_MODIFIER_NAME_oe_lat_mod_outremer_pact:0 "Lusignan-Hethumid Outremer Defense Pact"
 STATIC_MODIFIER_DESC_oe_lat_mod_outremer_pact:0 "Coordinated Cyprus galley patrols and Cilician Taurus fortresses shield the northeastern Levant together."
 STATIC_MODIFIER_NAME_oe_lat_mod_levant_emporium:0 "Famagusta-Ayas Silk & Spice Emporium"
 STATIC_MODIFIER_DESC_oe_lat_mod_levant_emporium:0 "Caravans descending from Anatolia meet Cypriot carracks and galleys in booming duty-regulated Levantine entrepots."
 STATIC_MODIFIER_NAME_oe_lat_mod_hagia_sophia_crown:0 "Imperial Crown of Hagia Sophia"
 STATIC_MODIFIER_DESC_oe_lat_mod_hagia_sophia_crown:0 "Crowned beside the high altar of Hagia Sophia, the restored Latin Emperor radiates crusader majesty across Europe and Asia."
 STATIC_MODIFIER_NAME_oe_lat_mod_bilingual_imperium:0 "Bilingual Latin-Greek Imperial Charter"
 STATIC_MODIFIER_DESC_oe_lat_mod_bilingual_imperium:0 "Confirming Greek municipal law alongside Latin imperial sovereignty wins broad stability and rapid administrative integration."
 STATIC_MODIFIER_NAME_oe_lat_mod_summit_offensive:0 "Tripartite Crusade Grand Offensive"
 STATIC_MODIFIER_DESC_oe_lat_mod_summit_offensive:0 "Tempered by joint councils with Rhodes and Marienburg, our armies drive forward with iron siegecraft and crusade zeal."
 STATIC_MODIFIER_NAME_oe_lat_mod_summit_armada:0 "Three-Orders Mediterranean Armada & Treasury"
 STATIC_MODIFIER_DESC_oe_lat_mod_summit_armada:0 "Shared galley yards and European priory remittances finance overwhelming maritime control across the Aegean and Levant."
 STATIC_MODIFIER_NAME_oe_lat_mod_assizes_codified:0 "Codified Liberties of the Assizes"
 STATIC_MODIFIER_DESC_oe_lat_mod_assizes_codified:0 "Transparent baronial and civic statutes foster loyal fiefs, calm parliament sessions, and steady prosperity."
 STATIC_MODIFIER_NAME_oe_lat_mod_crown_bailiffs:0 "Royal Bailiff Chancery Network"
 STATIC_MODIFIER_DESC_oe_lat_mod_crown_bailiffs:0 "Salaried crown bailiffs audit ports and feudal dues directly for the sovereign treasury."
 STATIC_MODIFIER_NAME_oe_lat_mod_venetian_accord:0 "Venetian-Latin Maritime Compact"
 STATIC_MODIFIER_DESC_oe_lat_mod_venetian_accord:0 "Allied Venetian galleys and shared banking counters channel vibrant commerce through every Aegean port."
 STATIC_MODIFIER_NAME_oe_lat_mod_sovereign_shipyards:0 "Sovereign Latin Imperial Shipyards"
 STATIC_MODIFIER_DESC_oe_lat_mod_sovereign_shipyards:0 "Expanding our own arsenals at Piraeus, Negroponte, and the Golden Horn builds naval self-reliance."
 STATIC_MODIFIER_NAME_oe_lat_mod_archon_conciliation:0 "Greek Archon Charter of Conciliation"
 STATIC_MODIFIER_DESC_oe_lat_mod_archon_conciliation:0 "Partnering with Greek landowners and parish clergy yields peaceful tax collection and flourishing cities."
 STATIC_MODIFIER_NAME_oe_lat_mod_latin_primacy:0 "Frankish-Latin Chivalric Primacy"
 STATIC_MODIFIER_DESC_oe_lat_mod_latin_primacy:0 "Affirming Latin knightly rank and Roman missions sharpens crusader morale and Catholic conversion."
 STATIC_MODIFIER_NAME_oe_lat_mod_1204_healed:0 "Greco-Latin Renaissance Synthesis"
 STATIC_MODIFIER_DESC_oe_lat_mod_1204_healed:0 "Healing the memory of 1204 joins Western chivalry and Byzantine scholarship into a luminous Mediterranean golden age."
 STATIC_MODIFIER_NAME_oe_lat_mod_1204_vindicated:0 "Triumph of the Fourth Crusade"
 STATIC_MODIFIER_DESC_oe_lat_mod_1204_vindicated:0 "Standing vindicated over the Bosporus, Latin arms command fear and obedience from Italy to the Euphrates."
 STATIC_MODIFIER_NAME_oe_lat_mod_sit_latin_victory:0 "Aegean Latin Restoration Triumph"
 STATIC_MODIFIER_DESC_oe_lat_mod_sit_latin_victory:0 "Having reversed the twilight of Frankokratia, the restored Latin realm presides unrivaled over Greece and the Straits."
 STATIC_MODIFIER_NAME_oe_lat_mod_sit_eastern_victory:0 "End of Frankokratia in the Aegean"
 STATIC_MODIFIER_DESC_oe_lat_mod_sit_eastern_victory:0 "Sweeping the Latin baronies from Greece and the islands cements eastern imperial mastery over the Aegean basin."
 STATIC_MODIFIER_NAME_oe_lat_mod_sit_martial_legacy:0 "Martial Legacy of the Aegean Wars"
 STATIC_MODIFIER_DESC_oe_lat_mod_sit_martial_legacy:0 "Generations of island sieges and galley clashes have forged veteran armies and sea-hardened crews."
 STATIC_MODIFIER_NAME_oe_lat_mod_sit_maritime_peace:0 "Aegean Maritime Commonwealth"
 STATIC_MODIFIER_DESC_oe_lat_mod_sit_maritime_peace:0 "Peace across the straits and cycladic sea lanes ushers in flourishing maritime commerce and urban wealth."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_morea_attica:0 "Unified Frankish Hellas"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_morea_attica:0 "Uniting Andravida and Athens under one administrative court eliminates feudal rivalry across southern Greece."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_aegean_duchies:0 "Archipelago Sea-Fortress Network"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_aegean_duchies:0 "Interlocking castle ports across Naxos, Euboea, and Attica project unbroken naval mastery across the Aegean."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_break_beyliks:0 "Scourge of the Anatolian Beyliks"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_break_beyliks:0 "Shattering Turkish strongholds along the Aegean coast clears eastern sea lanes and lifts crusader prestige."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_imperium_romaniae:0 "Restored Imperium Romaniae"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_imperium_romaniae:0 "Reborn upon the Bosphorus, the Latin Empire commands feudal fealty and imperial legitimacy from Rome to the Straits."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_partitio_enforced:0 "Partitio Imperial Suzerainty"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_partitio_enforced:0 "A loyal ring of Partitio fiefs shields Constantinople while remitting knights, galleys, and steady feudal revenue."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_catalan_supremacy:0 "Almogavar Steel Tradition"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_catalan_supremacy:0 "Veteran Catalan footmen and Mediterranean sea-captains give our campaigns ferocious shock power."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_cyprus_cilicia:0 "Eastern Crusader Sea-Bridge"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_cyprus_cilicia:0 "Allied ports in Nicosia, Famagusta, and Sis anchor our logistics for every Levantine expedition."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_outremer_reclaimed:0 "Guardians of Antioch & Jerusalem"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_outremer_reclaimed:0 "Holding the sacred citadels of Outremer fills Catholic Christendom with devotion and draws eager knights east."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_tripartite_crusade:0 "Three-Cross Shield of Christendom"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_tripartite_crusade:0 "Latin Romania, Rhodes, and Marienburg stand united as a pan-European crusader alliance."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_aegean_commerce:0 "Aegean Golden Trade Monopoly"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_aegean_commerce:0 "Silk, marble, wine, and eastern spices enrich our customs houses across every Aegean strait."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_uniate_peace:0 "Peace of the Two Liturgies"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_uniate_peace:0 "Mutual respect between Roman and Greek sanctuaries calms the provinces and accelerates learning."
 STATIC_MODIFIER_NAME_oe_lat_mod_msn_eternal_romania:0 "Eternal Imperium Romaniae"
 STATIC_MODIFIER_DESC_oe_lat_mod_msn_eternal_romania:0 "Uniting Frankish chivalry, Catalan steel, Greek learning, and Partitio fiefs from the Peloponnese to the Levant, the restored Latin Empire endures across the ages."
