l_english:
 OE_RW_ASSIM_PENTARCHY_TITLE: "Begin the Reunion of the Churches"
 OE_RW_ASSIM_PENTARCHY_ROW: "Reunite the Pentarchy"
 OE_RW_ASSIM_PENTARCHY_FLAVOR: "Rome, Constantinople, Alexandria, Antioch and Jerusalem now stand together under imperial protection. Envoys of the Eastern and Western Churches gather to heal centuries of division and restore communion among their altars."
 OE_RW_ASSIM_PENTARCHY_CONDITION: "Byzantium and its direct or indirect subjects must own Rome, Alexandria, Antioch, Jerusalem and Constantinople. Occupation does not count."
 OE_RW_ASSIM_PENTARCHY_NOT_STARTED: "The Reunion of the Churches has not begun"
 OE_RW_ASSIM_PENTARCHY_PROGRESS: "Sees owned: [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).ScriptValue('oe_rw_pentarchy_cities_owned_count')|0] / 5."
 OE_RW_ASSIM_PENTARCHY_TARGET: "Begin the existing Reunion of the Churches movement, gradually bringing Christians into Orthodoxy.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
 OE_RW_ASSIM_PENTARCHY_RULES: "May be started once. Rome is strongly preferred as its origin. Existing Christian population rules and spread rates are retained."
 OE_RW_ASSIM_PENTARCHY_WAITING: "Not yet begun"
 OE_RW_ASSIM_PENTARCHY_STARTED: "Begun: Reunion of the Churches"
 oe_orthodox_identity_movement: "Reunion of the Eastern and Western Churches"
 oe_orthodox_identity_movement_desc: "All five patriarchal sees unite under imperial protection, opening a path towards reconciliation between the Eastern and Western Churches.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"
