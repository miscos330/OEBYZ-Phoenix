 STATIC_MODIFIER_DESC_oe_v45_ai_mod_gunpowder_frontier_cohesion:0 "Major Ottoman, Mughal, Qing, and Persian AI empires reinforce provincial control and frontier manpower at the cost of heavier bureaucratic inertia."
