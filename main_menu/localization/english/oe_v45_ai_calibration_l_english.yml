 STATIC_MODIFIER_DESC_oe_v45_ai_mod_revolutionary_mobilization:0 "Late-game Great Power AI sharpens wartime taxation, artillery corps, and mass levies while risking heightened social unrest and upkeep strain."
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_early_industrial_fiscal:0 "Early Industrial Maritime & Fiscal Readiness"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_early_industrial_fiscal:0 "Industrializing AI realms accelerate workshop output, naval shipyards, and institutional diffusion while unsettling traditional aristocratic estates."
