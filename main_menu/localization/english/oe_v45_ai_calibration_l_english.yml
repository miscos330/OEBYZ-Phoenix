 # Project Phoenix v45.0 Main Mod AI Calibration & Era Audio Localization (EN).
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_late_medieval_restraint:0 "Late Medieval Frontier Consolidation"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_late_medieval_restraint:0 "AI European realms focus administrative effort on regional consolidation and fortified marches rather than premature transoceanic colonization."
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_anatolian_balkan_focus:0 "Anatolian-Balkan Heartland Posture"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_anatolian_balkan_focus:0 "AI realms across Anatolia and the Balkans prioritize overland mobilization and local campaigns over distant blue-water expeditions."
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_discovery_atlantic_pace:0 "Age of Discovery Atlantic Cadence"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_discovery_atlantic_pace:0 "Iberian and Atlantic AI admiralties extend oceanic exploration range and colonial logistics while absorbing heavier continental friction in Europe."
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_discovery_continental_restraint:0 "Renaissance Continental Equilibrium"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_discovery_continental_restraint:0 "Inland European AI courts direct resources toward diplomatic networks and urban production rather than unhistorical overseas settlements."
 STATIC_MODIFIER_NAME_oe_v45_ai_mod_confessional_coalition_balance:0 "Confessional-Absolutist Coalition Resilience"
 STATIC_MODIFIER_DESC_oe_v45_ai_mod_confessional_coalition_balance:0 "Great Power AI chanceries sustain resilient defensive alliances and siege campaigns while higher fortress overhead discourages indefinite stalemate."
