l_english:
 oe_rw_divide_bulgaria_serbia: "Divide Bulgaria and Serbia"
 oe_rw_divide_bulgaria_serbia_desc: "Send our envoys north with gold, promises and carefully chosen reports to unravel the alliance between Bulgaria and Serbia.\n\nVisible only while they are allied and this action remains unused. Requires Roman Legitimacy. Costs 100 gold, 1 diplomat and 5 legitimacy; ends their alliance. Once per campaign, then hidden."
 oe_rw_found_moldavian_governorate: "Moldavian Governorate"
 oe_rw_found_moldavian_governorate_desc: "Bring the castles, crossings and towns east of the Carpathians under a governor appointed by the empire.\n\nAll conquerable locations in Wallachia must belong to Byzantium or its direct or indirect subjects. Requires Roman Legitimacy and 200 gold. Establishes the governorate once, combining the entire territory of countries whose capitals lie in Moldavia and which own at most 20 locations, plus all Byzantine and subject holdings in Moldavia. The new country is a provincial subject of Byzantium."
 OE_DANUBE_MOLDAVIA_HAS_SOURCE: "Moldavia contains at least one eligible location for the governorate."
 OE_DANUBE_MOLDAVIA_FOUND_EFFECT: "Pay 200 gold to combine eligible small Moldavian realms and Byzantine or subject holdings in the area into the #Y Moldavian Governorate#!, a provincial subject of Byzantium. If the Golden Horde still owns 1 to 9 locations in Moldavia, trigger Expel the Mongols."
 OE_MOLDAVIAN_GOVERNORATE: "Moldavian Governorate"
 OE_MOLDAVIAN_GOVERNORATE_ADJ: "Moldavian"
 oe_danube_settlement.1.t: "Expel the Mongols"
 oe_danube_settlement.1.d: "The governor has received his seal, yet the Golden Horde still collects dues at several crossings and towns. Its banners remind the inhabitants that commands from the steppe have not entirely fallen silent.\n\nOur governor requests troops to remove these remaining garrisons and bring their lands under his administration. The empire must bear the cost in supplies and men. We could instead rest content with the prestige already won by founding the governorate."
 oe_danube_settlement.1.a: "Drive the khan’s banners from the valleys."
 oe_danube_settlement.1.b: "The new governorate already proclaims our prestige."
 OE_DANUBE_MONGOL_HANDOVER: "Transfer every Golden Horde location in Moldavia to the Moldavian Governorate."
 pe_byz_wallachian_protectorate: "Doom of the Impaler"
 pe_byz_wallachian_protectorate_desc: "Replace the old Wallachian order with a realm under Roman protection. Available only when Byzantium attacks Wallachia using the Homeland of the Vampire casus belli. Costs 100 war score."
 OE_DANUBE_WALLACHIA_TREATY_EFFECT: "Form the #Y Wallachian Protectorate#! from Wallachia’s holdings in the Wallachia area, as a #Y Roman Ally#! of Byzantium. Transfer Wallachia’s Moldavian holdings to Byzantium and add all passable land in Moldavia to the #Y Roman World#!."
 OE_WALLACHIAN_PROTECTORATE: "Wallachian Protectorate"
 OE_WALLACHIAN_PROTECTORATE_ADJ: "Wallachian"
 pe_byz_wallachian_protectorate_entry_short: "Doom of the Impaler"
 pe_byz_wallachian_protectorate_entry: "Establish the Wallachian Protectorate as a Roman Ally of Byzantium; transfer Wallachia’s Moldavian holdings to Byzantium and include Moldavia in the Roman World."
