# NEW 2026-11-21 v9.6 Module 1: Scriptable Hints (oe_hint_). Generated by gen_v96_cat_hints.py.
 oe_hint_byz_phoenix_start:0 "Project Phoenix: Byzantium 1337 Opening Guide"
 oe_hint_byz_phoenix_start_hint_text:0 "#T Opening Priorities#!\n@hint! Eastern Rome in 1337 stands between dynastic crisis and frontier encirclement. Watch the civil-war warnings closely and build stability and treasury reserves early.\n\n#T Customs and Golden Horn Recovery#!\n@hint! Curb Italian merchant privileges at Galata, reclaim Golden Horn customs revenue, and stabilize finances through imperial banking and coinage reforms.\n\n#T Thracian Defense Line#!\n@hint! Fortify the Adrianople-Thrace corridor and exploit rivalries among the Anatolian beyliks before striking back."
 oe_hint_byz_phoenix_start_adm:0 "\"Reclaiming Galata customs and pruning corrupt estate privileges stabilizes Constantinople's treasury far faster than taking loans.\""
 oe_hint_byz_phoenix_start_dip:0 "\"Exploit rivalries between Balkan neighbors and Italian republics to buy breathing room and avoid a two-front war.\""
 oe_hint_byz_phoenix_start_mil:0 "\"Anchor your defense on Adrianople and the straits, defeating invading columns piecemeal with concentrated strike forces.\""
 oe_hint_byz_themes_and_pillars:0 "Imperial Pillars, Theme Quotas & Sacrum Consistorium"
 oe_hint_byz_themes_and_pillars_hint_text:0 "#T Theme System and Muster Quotas#!\n@hint! Following the early crisis, organize frontier lands through Imperial Pillars and Theme vassals while drawing reliable frontier levies via Theme Quota actions.\n\n#T Praetorian Prefectures and Exarchates#!\n@hint! As the empire spans the Mediterranean, delegate distant provinces to Praetorian Prefectures and overseas Exarchates to preserve control and contain Imperial Entropy."
 oe_hint_byz_themes_and_pillars_adm:0 "\"Assign low-control borderlands to Praetorian Prefectures or Themes so the capital can focus direct governance on wealthy core provinces.\""
 oe_hint_byz_themes_and_pillars_dip:0 "\"Audit Exarchate and Theme loyalty regularly, granting court dignities or tribute relief before provincial resentment hardens.\""
 oe_hint_byz_themes_and_pillars_mil:0 "\"Review Theme quotas before major wars so frontier themes absorb attrition while imperial tagmata deliver decisive blows.\""
 oe_hint_byz_orthodoxy_synod:0 "Orthodox Hesychasm, Patriarchate Laws & Sacred Icons"
 oe_hint_byz_orthodoxy_synod_hint_text:0 "#T Autocephalous Patriarchate Tenets#!\n@hint! Open your Autocephalous Patriarchate organization to vote between Hesychast Orthodoxy, Unionist Dialogue, Athonite Asceticism, and Imperial Humanism.\n\n#T Native Orthodox Actions and Sacred Icons#!\n@hint! Use the Religion panel to Convene an Ecumenical Synod, Patronize Mount Athos, and Commission Imperial Icons directly into your capital's treasury of sacred art."
 oe_hint_byz_orthodoxy_synod_adm:0 "\"Athonite Asceticism and Imperial Humanism excel at stability efficiency and literacy respectively; switch tenets as your strategic era evolves.\""
 oe_hint_byz_orthodoxy_synod_dip:0 "\"When facing Catholic pressure from the West, Unionist Dialogue bolsters diplomatic reputation and heretic tolerance.\""
 oe_hint_byz_orthodoxy_synod_mil:0 "\"Synod relief and Athonite patronage curb war exhaustion and speed conversion, sustaining protracted campaigns.\""
 oe_hint_yuan_restoration_start:0 "Great Yuan Restoration: 1337 Opening Guide"
 oe_hint_yuan_restoration_start_hint_text:0 "#T Stabilize Jiaochao and Maritime Grain#!\n@hint! Great Yuan opens under pressure from paper-currency inflation, Yellow River floods, and fluctuating southern grain shipments. Prioritize Jiaochao Reform and coastal transport to keep Dadu supplied.\n\n#T Court Balance and Rebellion Readiness#!\n@hint! Balance the central secretariat with the Eastern Palace, maintain standing discipline, and prepare garrisons before the Red Turban storm breaks."
 oe_hint_yuan_restoration_start_adm:0 "\"Curb inflation and secure grain deliveries first so the Great Yuan Restoration can fund structural reforms without bankruptcy.\""
 oe_hint_yuan_restoration_start_dip:0 "\"Keep Korea, Yunnan, and southwestern tusi loyal so your outer flanks remain quiet while the heartland stabilizes.\""
 oe_hint_yuan_restoration_start_mil:0 "\"Position Keshig field armies along the Yellow River and Huai valleys to crush early uprisings before they unite.\""
 oe_hint_yuan_secretariats_touxia:0 "Yuan Branch Secretariats, Touxia & Maritime Silk"
 oe_hint_yuan_secretariats_touxia_hint_text:0 "#T Branch Secretariats vs. Touxia Appanages#!\n@hint! Branch Secretariats sharpen central taxation while Touxia appanages absorb governance strain across distant frontier circuits. Adjust the balance as control improves.\n\n#T Zaytun Maritime Silk and Xuanzheng Yuan#!\n@hint! Keep order in Quanzhou to protect the Maritime Silk Corridor while honoring Tibetan preceptors through the Xuanzheng Yuan to bind steppe and plateau vassals."
 oe_hint_yuan_secretariats_touxia_adm:0 "\"Deepen direct secretariat rule in Jiangnan and the central plains while using delegated frontier vassals in the far north and plateau.\""
 oe_hint_yuan_secretariats_touxia_dip:0 "\"Cultivate commercial ties along Zaytun, Malacca, and Ceylon to channel steady maritime trade wealth back to Dadu.\""
 oe_hint_yuan_secretariats_touxia_mil:0 "\"Combine steppe cavalry shock with Jiangnan firearms workshops to stay ahead of Timurid and maritime rivals.\""
 oe_hint_yuan_sanjiao_preceptor:0 "Three Teachings, Sect Laws, Preceptors & Hui Scholars"
 oe_hint_yuan_sanjiao_preceptor_hint_text:0 "#T Imperial Religious Policy and Sect Laws#!\n@hint! Choose among four state religious policies in the Laws panel—Three Teachings Balance, Xuanzheng Lama Patronage, Hui Astronomical Bureau, or Strict Neo-Confucianism—to steer governance and tolerance.\n\n#T Grand Debate, Preceptor Blessing & Hui Scholars#!\n@hint! Use the Religion panel to convene the Three Teachings Debate (enacting sect synthesis laws), receive the Imperial Preceptor's Blessing, and invite native Muslim Scholars to boost research and literacy."
 oe_hint_yuan_sanjiao_preceptor_adm:0 "\"Pairing the Hui Astronomical Bureau law with invited Muslim Scholars stacks strong research speed and literacy gains.\""
 oe_hint_yuan_sanjiao_preceptor_dip:0 "\"Honoring the Imperial Preceptor raises diplomatic reputation, heathen tolerance, and the loyalty of Tibetan and Mongol subjects.\""
 oe_hint_yuan_sanjiao_preceptor_mil:0 "\"During grueling wars, favor Chan-Pure Land or Kagyu protector doctrines to reduce war exhaustion and stiffen morale.\""
 oe_hint_rus_tatar_yoke_start:0 "Rise of Rus': Breaking the Tatar Yoke & Third Rome"
 oe_hint_rus_tatar_yoke_start_hint_text:0 "#T Gathering the Lands of Rus'#!\n@hint! Consolidate rival principalities across the Volga-Oka basin and exploit divisions inside the Golden Horde to prepare for breaking the Tatar Yoke.\n\n#T Boyar Duma and Imperial Continuity#!\n@hint! Balance boyar estates against centralizing reforms, then pursue Twin Eagles diplomacy and Third Rome claims as Orthodox power shifts northward."
 oe_hint_rus_tatar_yoke_start_adm:0 "\"Securing Novgorod's fur trade and the Oka agricultural belt provides the fiscal base needed to withstand steppe raids.\""
 oe_hint_rus_tatar_yoke_start_dip:0 "\"Track fissures among the Golden Horde wings and Lithuania carefully; ally Orthodox peers so you never fight on two fronts.\""
 oe_hint_rus_tatar_yoke_start_mil:0 "\"Use rivers, timber forts, and the Abatis Line to blunt steppe cavalry before striking south down the Volga.\""
 oe_hint_rus_church_and_siberia:0 "Russian Church Property, Cossacks & Siberian Advance"
 oe_hint_rus_church_and_siberia_hint_text:0 "#T Josephites, Non-Possessors & Old Believers#!\n@hint! Your Russian Patriarchate unlocks dedicated Church Property and Ritual laws spanning Josephite Possessors, Non-Possessors, Nikonian Reform, and the Old Believer Accord. Use Mediate Russian Schism whenever tensions flare.\n\n#T Cossack Hosts and the Siberian Tract#!\n@hint! Charter the Cossack Host and Stroganov ventures, push beyond the Urals with Siberian Post Roads, and open the Pacific and Kyakhta tea corridors."
 oe_hint_rus_church_and_siberia_adm:0 "\"Non-Possessors curb clergy power and raise literacy, whereas Josephites reinforce centralization and legitimacy—choose to fit your statecraft.\""
 oe_hint_rus_church_and_siberia_dip:0 "\"After 1580, Nikonian Reform boosts Orthodox diplomatic standing, while the Old Believer Accord turns dissenters into frontier pioneers.\""
 oe_hint_rus_church_and_siberia_mil:0 "\"Transition smoothly from Cossack Hosts and Streltsy into New Order Regiments to match both steppe speed and European firepower.\""
 oe_hint_glh_ulus_survival:0 "Ulus of Jochi Cohesion, Steppe Turmoil & Kipchak Trade"
 oe_hint_glh_ulus_survival_hint_text:0 "#T Preserve Horde Cohesion Across the Five Wings#!\n@hint! Steppe survival hinges on Horde Cohesion and Yassa authority. Use Kurultai gifts, Yassa reforms, and beg purges to keep the Five Wings of Jochi from fracturing during the Great Troubles.\n\n#T Tengri Aspects and the Sarai Corridor#!\n@hint! Tengri realms can select four new religious aspects—Eternal Yassa, Shamanic Syncretism, Ordu Horsemasters, and Silk Caravan Oath—while taxing the Sarai-Astrakhan-Crimea trade arc."
 oe_hint_glh_ulus_survival_adm:0 "\"Reform the Yassa while finances are healthy so Horde Cohesion does not collapse during a succession crisis.\""
 oe_hint_glh_ulus_survival_dip:0 "\"Keep Russian princes divided while safeguarding merchant caravans linking the Black Sea and Transoxiana.\""
 oe_hint_glh_ulus_survival_mil:0 "\"Leverage cavalry power and off-road speed to crush foes on open steppe rather than bleeding out beneath stone fortresses.\""
 oe_hint_oe_entropy_warning:0 "Warning: Rising Imperial Entropy & Mitigation Guide"
 oe_hint_oe_entropy_warning_hint_text:0 "#T Understanding Five-Dimensional Imperial Entropy#!\n@hint! Your Imperial Entropy index has crossed the warning threshold. It tracks Overextension, monetary inflation, Satrapy Drift, cultural friction, and prolonged wartime exhaustion.\n\n#T Immediate Entropy Mitigation#!\n@hint! Enact Inspectorate Audit, Currency Stabilization, Tolerance Charter, and Peacetime Amnesty decisions, and delegate low-control frontier provinces to Praetorian Prefectures or vassals."
 oe_hint_oe_entropy_warning_adm:0 "\"Curbing Overextension and inflation steadily pulls Imperial Entropy back down toward Pax Imperialis.\""
 oe_hint_oe_entropy_warning_dip:0 "\"Pause conquests and issue a Tolerance Charter to calm restless minorities and wavering subjects.\""
 oe_hint_oe_entropy_warning_mil:0 "\"Endless campaigning drives up the wartime entropy dimension; take peacetime pauses and enact Grand Amnesty between wars.\""
 oe_hint_oe_quick_hud_and_decisions:0 "Project Phoenix Interface: Decisions, Automation & Gazetteer"
 oe_hint_oe_quick_hud_and_decisions_hint_text:0 "#T Seven Color-Coded Decision Filters#!\n@hint! Over a hundred mod decisions are now organized across all native color-coded tabs—Country-Specific, Expansion, Government, Religious, Economy, and Infrastructure—for effortless browsing.\n\n#T Quick Bar, Governance Automation & City Gazetteer#!\n@hint! Use the top Quick Bar or Government decisions to open the Imperial Panorama Chronicle, Governance Automation Console, and Annual Transparent Ledger, and hover over famed Eurasian and African cities to read their historical profiles."
 oe_hint_oe_quick_hud_and_decisions_adm:0 "\"Open the Governance Automation Console in the Government decisions tab to configure treasury reserve floors and automated infrastructure checks.\""
 oe_hint_oe_quick_hud_and_decisions_dip:0 "\"Use the Chronicle and regional decision tabs to track major Eurasian diplomatic shifts and crisis chains.\""
 oe_hint_oe_quick_hud_and_decisions_mil:0 "\"Expansion and Infrastructure decisions now sit in dedicated tabs so restoration claims, marches, and fortification projects stand out immediately.\""
 oe_hint_oe_imperial_roads_stances:0 "Imperial Roads & Specialized Subject Military Stances"
 oe_hint_oe_imperial_roads_stances_hint_text:0 "#T Civilization-Specific Imperial Roads#!\n@hint! Once unlocked via advances, construct Via Romana Imperial Highways, Great Yuan Jam Post Roads, or Russian Siberian Tracts directly from the Road Builder to project control, market access, and army speed.\n\n#T Specialized Subject Military Stances#!\n@hint! Assign tailored stances in the Manage Subjects panel—Scorched-Earth Raiders, Maritime Escort Fleets, or Silk Road Garrison Guards—so every vassal fulfills a clear wartime role."
 oe_hint_oe_imperial_roads_stances_adm:0 "\"Extend Imperial Roads from your capital toward trade hubs and frontier fortresses first to maximize control propagation.\""
 oe_hint_oe_imperial_roads_stances_dip:0 "\"Assign maritime subjects to escort duties and landward marches to frontier garrisons so allied armies avoid wasteful losses.\""
 oe_hint_oe_imperial_roads_stances_mil:0 "\"Scorched-Earth raiding stances instruct agile vassals to evade enemy main stacks while disrupting rear supply and sieges.\""
