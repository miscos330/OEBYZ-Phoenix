 oe_form_dec_compile_tactica.title: "Compile the Imperial Tactica"
 oe_form_dec_compile_tactica.desc: "Gather the military treatises of past ages and issue them to the army. Costs 100 gold; lasts 20 years."
 oe_form_dec_compile_tactica.a: "Issue it"
 oe_form_dec_standing_drill.title: "Issue Standing Drill Regulations"
 oe_form_dec_standing_drill.desc: "Give every corps the same drill regulations. Costs 100 gold; lasts 20 years."
 oe_form_dec_standing_drill.a: "Issue it"
 oe_form_dec_line_of_battle.title: "Issue the Fighting Instructions"
 oe_form_dec_line_of_battle.desc: "Order the fleet to fight in line by standing instructions. For countries with ports, from 1600. Costs 100 gold; lasts 20 years."
 oe_form_dec_line_of_battle.a: "Issue it"
 oe_form.1.title: "The Hollow Square on Parade"
 oe_form.1.desc: "Across the parade fields outside the capital, imperial regiments rehearse the classical hollow square drawn from ancient military treatises. Heavy infantry lock shields along all four faces to form a mobile fortress, leaving measured corridors through which armoured cataphracts charge out against the foe and withdraw safely to reform."
 oe_form.1.a: "Have every corps drill it"
 oe_form.2.title: "The Envelopment Exercise"
 oe_form.2.desc: "Across the open steppe, thunderous squadrons of horsemen rehearse the classic double envelopment. As the centre feigns a disorderly retreat to draw the opposing line forward and stretch its ranks, the wide flanking wings sweep smoothly inward from either side to close the iron ring, keeping alive the timeless mastery of nomadic warfare."
 oe_form.2.a: "This is how our fathers fought"
 oe_form.3.title: "Pike and Shot Arrive"
 oe_form.3.desc: "Treatises and veteran reports of combined pike-and-shot formations have reached our camps, describing dense squares of long pikes shielded by sleeves of matchlock musketeers firing in steady rotation. Yet battle-hardened captains view the foreign drill with skepticism, debating whether to test it in a single corps or hold to proven ways."
 oe_form.3.a: "Try it with one corps"
 oe_form.3.b: "Keep to the old drill"
 oe_form.4.title: "The Staff Debates"
 oe_form.4.desc: "Around the map tables of headquarters, senior staff officers clash fiercely over battlefield doctrine. One faction insists upon thin, extended lines to unleash the full weight of disciplined volley fire, while the other champions deep assault columns able to manoeuvre swiftly and smash enemy positions by shock alone."
 oe_form.4.a: "Use both together"
 oe_form.5.title: "Broadside Exercises"
 oe_form.5.desc: "Beneath brisk offshore winds, our warships manoeuvre into a crisp line of battle, each vessel holding exact station and interval by flagship signal. Passing the target hulks in smooth succession, entire tiers of heavy ordnance thunder in disciplined broadsides, forging a naval formation fit to dominate the open seas."
 oe_form.5.a: "Let every ship learn its station"
 oe_form.6.title: "Lessons of the Galleys"
 oe_form.6.desc: "Grizzled galley captains and veteran seamen have assembled to commit generations of hard-won coastal warfare to paper. Their manual details every manoeuvre of oar-driven combat—from forming the sweeping crescent and loosing bow-chaser volleys to closing the flanking wings and storming across locked decks in fierce boarding actions."
 oe_form.6.a: "Print it for the fleet"
 oe_form.7.title: "Assembly Lines and a School for Seamen"
 oe_form.7.desc: "With state dockyards reorganized into standardized assembly bays, new warships are slipping down the ways faster than ever before. Seeing the expanding fleet outpace its officer corps, admiralty advisers urge the throne to found a dedicated naval academy teaching navigation, charting, and gunnery alongside hull construction."
 oe_form.7.a: "Found the school"
 oe_form.7.b: "Ships first"
 oe_form.8.title: "Quick Levies or Trained Men"
 oe_form.8.desc: "As the new military regulations await the royal seal, commanders and treasurers divide sharply over how the realm should raise its soldiers. Martial reformers insist that only rigorously drilled standing troops can endure modern fire, while fiscal counsellors argue for preserving broad emergency levies ready to mobilize when war strikes."
 oe_form.8.a: "Trained men above all"
 oe_form.8.b: "Keep both ways ready"
