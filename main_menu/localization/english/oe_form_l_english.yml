 oe_form_menavlatoi_square: "Menavlatoi Hollow Square"
 oe_form_menavlatoi_square_desc: "Heavy infantry with long pikes form a square on every side, with the cataphracts held inside to sally out. Wings and centre are mostly heavy infantry."
 oe_form_steppe_crescent: "Steppe Crescent"
 oe_form_steppe_crescent_desc: "The centre feigns retreat to draw the enemy in while cavalry on both wings closes round him. The wings are all cavalry."
 oe_form_tercio_pike_shot: "Pike and Shot"
 oe_form_tercio_pike_shot_desc: "Pikes in the middle, shot on the outside and field guns alongside. A thick centre."
 oe_form_ordre_mixte: "Ordre Mixte"
 oe_form_ordre_mixte_desc: "Guns massed in the centre, with lines to fire and columns to charge used in turn."
 oe_form_line_of_battle: "Line of Battle"
 oe_form_line_of_battle_desc: "Heavy ships in a single line ahead, bringing every broadside to bear."
 oe_form_galley_ram_crescent: "Galley Crescent"
 oe_form_galley_ram_crescent_desc: "Galleys in a crescent, the wings closing in to ram and board."
 oe_rec_imperial_cadre: "Guard Cadre Training"
 oe_rec_imperial_cadre_desc: "Slower to raise, but recruits join with 35 experience."
 oe_rec_emergency_conscription: "Emergency Conscription"
 oe_rec_emergency_conscription_desc: "Raised in half the time, but new regiments start at six tenths strength."
 oe_rec_arsenale_canal_line: "Canal Assembly Line"
 oe_rec_arsenale_canal_line_desc: "Ships are built a third faster and launched slightly under strength."
 oe_rec_admiralty_navigation_corps: "Naval Academy Training"
 oe_rec_admiralty_navigation_corps_desc: "Slower to build, but crews come aboard with 30 experience."
 oe_form_adv_combined_arms_manuals: "Combined Arms Manuals"
 oe_form_adv_combined_arms_manuals_desc: "Manuals that set down how pike, shot and guns work together."
 oe_form_adv_arsenale_shipbuilding: "Arsenale Shipbuilding"
 oe_form_adv_arsenale_shipbuilding_desc: "Ships built to one pattern: a stronger fleet, sooner launched."
 oe_form_adv_ordre_mixte_staff: "General Staff"
 oe_form_adv_ordre_mixte_staff_desc: "A permanent staff plans the army's tactics and movements."
 oe_form_player_only_tt: "Only a player-controlled country can use this"
 oe_form_dec_compile_tactica.title: "Compile the Imperial Tactica"
 oe_form_dec_compile_tactica.desc: "Gather the military treatises of past ages and issue them to the army. Costs 100 gold; lasts 20 years."
 oe_form_dec_compile_tactica.a: "Issue it"
 oe_form_dec_standing_drill.title: "Issue Standing Drill Regulations"
 oe_form_dec_standing_drill.desc: "Give every corps the same drill regulations. Costs 100 gold; lasts 20 years."
 oe_form_dec_standing_drill.a: "Issue it"
 oe_form_dec_line_of_battle.title: "Issue the Fighting Instructions"
 oe_form_dec_line_of_battle.desc: "Order the fleet to fight in line by standing instructions. For countries with ports, from 1600. Costs 100 gold; lasts 20 years."
 oe_form_dec_line_of_battle.a: "Issue it"
 oe_form.1.title: "The Hollow Square on Parade"
 oe_form.1.desc: "The army drills the hollow square from the treatise: heavy foot on every side, and the cataphracts riding out through the gaps and back again."
 oe_form.1.a: "Have every corps drill it"
 oe_form.2.title: "The Envelopment Exercise"
 oe_form.2.desc: "The horsemen practise the envelopment on the open steppe: the centre gives way and the wings close in."
 oe_form.2.a: "This is how our fathers fought"
 oe_form.3.title: "Pike and Shot Arrive"
 oe_form.3.desc: "The method of forming pike and shot together in great squares has reached us, and the old captains are doubtful."
 oe_form.3.a: "Try it with one corps"
 oe_form.3.b: "Keep to the old drill"
 oe_form.4.title: "The Staff Debates"
 oe_form.4.desc: "The staff argues whether the army should rely more on lines that fire or on columns that charge."
 oe_form.4.a: "Use both together"
 oe_form.5.title: "Broadside Exercises"
 oe_form.5.desc: "The fleet forms one line and fires its broadsides in turn."
 oe_form.5.a: "Let every ship learn its station"
 oe_form.6.title: "Lessons of the Galleys"
 oe_form.6.desc: "The old seamen set down how galleys fight: the crescent, the closing wings, and the boarding."
 oe_form.6.a: "Print it for the fleet"
 oe_form.7.title: "Assembly Lines and a School for Seamen"
 oe_form.7.desc: "The yards have turned to the assembly line, and the court considers a school to teach navigation and gunnery."
 oe_form.7.a: "Found the school"
 oe_form.7.b: "Ships first"
 oe_form.8.title: "Quick Levies or Trained Men"
 oe_form.8.desc: "As the regulations go out, the court argues how soldiers should be found: raised in haste when war comes, or trained at leisure."
 oe_form.8.a: "Trained men above all"
 oe_form.8.b: "Keep both ways ready"
