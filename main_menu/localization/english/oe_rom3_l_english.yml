l_english:
 oe_rom3_b_twin_eagles: "Twin Eagles Orthodox Concordat"
 oe_rom3_b_eagle_rivalry: "Second vs Third Rome Primacy Rivalry"
 oe_rom3_b_conciliar_truce: "Conciliar Reconciliation of the Two Sees"
 STATIC_MODIFIER_NAME_oe_rom3_twin_lights_proposal: "Twin Lights of Orthodoxy"
 STATIC_MODIFIER_DESC_oe_rom3_twin_lights_proposal: "Proposing northern-southern Orthodox sisterhood while Constantinople stands earns wide canonical respect."
 STATIC_MODIFIER_NAME_oe_rom3_northern_primacy_claim: "Claim of Uncorrupted Northern Orthodoxy"
 STATIC_MODIFIER_DESC_oe_rom3_northern_primacy_claim: "Questioning Mediterranean compromises raises northern prestige and zeal while straining Ecumenical ties."
 STATIC_MODIFIER_NAME_oe_rom3_twin_eagles_concordat: "Twin Eagles Concordat (Second & Third Rome)"
 STATIC_MODIFIER_DESC_oe_rom3_twin_eagles_concordat: "Constantinople and All Rus' ratify a sisterhood concordat honoring a northern Patriarchate in full communion, boosting diplomacy and trade."
 STATIC_MODIFIER_NAME_oe_rom3_greek_typographers: "Greek Typographers & Northern Gold"
 STATIC_MODIFIER_DESC_oe_rom3_greek_typographers: "Byzantine scholars revise northern liturgical books while northern silver endows Mount Athos and Hagia Sophia."
 STATIC_MODIFIER_NAME_oe_rom3_new_rome_primacy: "Ecumenical Primacy of New Rome"
 STATIC_MODIFIER_DESC_oe_rom3_new_rome_primacy: "The Queen of Cities firmly asserts its singular imperial and Ecumenical primacy across the Orthodox world."
 STATIC_MODIFIER_NAME_oe_rom3_eagle_rivalry_duel: "Duel of the Two Eagles"
 STATIC_MODIFIER_DESC_oe_rom3_eagle_rivalry_duel: "A fierce contest over imperial dignity and Orthodox primacy fuels domestic pride and legitimacy at the price of ecclesiastical friction."
 STATIC_MODIFIER_NAME_oe_rom3_exclusive_orthodoxy: "Triumph of Exclusive Orthodoxy"
 STATIC_MODIFIER_DESC_oe_rom3_exclusive_orthodoxy: "Uncompromising insistence on sole uncorrupted Orthodoxy sharpens faith and unity while cooling foreign courts."
 STATIC_MODIFIER_NAME_oe_rom3_conciliar_settlement: "Pragmatic Conciliar Settlement"
 STATIC_MODIFIER_DESC_oe_rom3_conciliar_settlement: "Bishops of both realms set aside imperial polemics to restore sacramental peace and diplomatic calm."
 STATIC_MODIFIER_NAME_oe_rom3_third_rome_mantle: "Translatio Imperii: Mantle of the Third Rome"
 STATIC_MODIFIER_DESC_oe_rom3_third_rome_mantle: "Two Romes have fallen, the third stands, and a fourth there shall not be. Carrying the universal Orthodox mantle grants towering majesty alongside heavy imperial burdens."
 STATIC_MODIFIER_NAME_oe_rom3_humble_guardianship: "Humble Guardianship of the Faith"
 STATIC_MODIFIER_DESC_oe_rom3_humble_guardianship: "Choosing pious stewardship over imperial hubris steadies clergy, subjects, and realm alike."
 STATIC_MODIFIER_NAME_oe_rom3_all_rus_patriarchate: "Patriarchate of All Rus' (1589)"
 STATIC_MODIFIER_DESC_oe_rom3_all_rus_patriarchate: "The Church of Rus' is formally elevated to a canonical Patriarchate, crowning a century of Orthodox statecraft."
 STATIC_MODIFIER_NAME_oe_rom3_detachment_focus: "Focus on Mediterranean Recovery"
 STATIC_MODIFIER_DESC_oe_rom3_detachment_focus: "Setting aside distant northern polemics frees the imperial court to focus on Mediterranean reconstruction."
 oe_rom3_dec_twin_eagles_embassy.title: "Dispatch the Twin Eagles Embassy"
 oe_rom3_dec_twin_eagles_embassy.desc: "Following the Twin Eagles Concordat, dispatch a ceremonial and commercial embassy to renew solidarity between Second and Third Rome."
 oe_rom3_dec_twin_eagles_embassy.a: "Send imperial gifts to renew the Twin Eagles bond"
 oe_rom3_dec_claim_third_rome.title: "Proclaim the Mantle of the Third Rome"
 oe_rom3_dec_claim_third_rome.desc: "With Constantinople fallen, our liberated Orthodox Rus' realm formally proclaims Translatio Imperii and the Mantle of the Third Rome."
 oe_rom3_dec_claim_third_rome.a: "Two Romes have fallen; the third stands!"
 oe_rom3_dec_affirm_ecumenical_primacy.title: "Affirm the Ecumenical Primacy of New Rome"
 oe_rom3_dec_affirm_ecumenical_primacy.desc: "While Constantinople stands under imperial rule, solemnly reaffirm New Rome's singular imperial dignity and Ecumenical Patriarchal primacy."
 oe_rom3_dec_affirm_ecumenical_primacy.a: "New Rome endures; the imperial mantle is indivisible"
 oe_rom3.1.t: "Epistle of Filofei of Pskov: Twin Lights of Orthodoxy"
 oe_rom3.1.d: "Elder Filofei of the Eleazar Monastery in Pskov addresses a solemn epistle to our throne. Because Second Rome still stands upon the Bosphorus, the monk frames our liberated realm not as an heir to ashes, but as the northern lamp shining beside Constantinople in defense of Orthodoxy.\n\nShall we propose a Twin Eagles Concordat of sister realms, or challenge southern compromises and assert northern primacy?"
 oe_rom3.1.a: "Propose the Twin Eagles Concordat in communion with Constantinople"
 oe_rom3.1.a.tt: "Open Path 1 (#bold #color_yellow Twin Eagles Concordat#!#!), Religious Influence #G +15#!; gain [ShowModifier('oe_rom3_twin_lights_proposal')] for #Y 25 years#!."
 oe_rom3.1.b: "Assert uncorrupted northern Orthodoxy and challenge Constantinople's monopoly"
 oe_rom3.1.b.tt: "Open Path 2 (#bold #color_yellow Imperial & Patriarchal Rivalry#!#!), Prestige #G +15#!; gain [ShowModifier('oe_rom3_northern_primacy_claim')] for #Y 25 years#!."
 oe_rom3.2.t: "Epistle of Filofei: Two Romes Have Fallen, the Third Stands"
 oe_rom3.2.d: "Elder Filofei of Pskov sends a thunderous epistle to our sovereign: 'Two Romes have fallen, the third stands, and there shall never be a fourth.' With Constantinople lost or driven from its throne, all Orthodox hopes turn northward.\n\nShall we formally assume the imperial Mantle of the Third Rome, or accept a humbler stewardship of the surviving faith?"
 oe_rom3.2.a: "Claim the Mantle of the Third Rome and guard universal Orthodoxy!"
 oe_rom3.2.a.tt: "Open Path 3 (#bold #color_yellow Translatio Imperii#!#!), Prestige #G +20#!, Legitimacy #G +10#!; gain [ShowModifier('oe_rom3_third_rome_mantle')] for #Y 30 years#!."
 oe_rom3.2.b: "Embrace humble guardianship of the faith without imperial hubris"
 oe_rom3.2.b.tt: "Open Path 3 (#bold #color_yellow Humble Guardianship#!#!), Stability #G +8#!; gain [ShowModifier('oe_rom3_humble_guardianship')] for #Y 30 years#!."
 oe_rom3.3.t: "Northern Whispers of a Third Rome"
 oe_rom3.3.d: "Envoys and Black Sea merchants bring astonishing word from the north: freed from the Tatar Yoke, the rising Rus' realm circulates epistles calling its capital a 'Third Rome' and debating imperial titles and an autonomous Patriarchate.\n\nBeneath the dome of Hagia Sophia, Emperor and Ecumenical Patriarch must decide how New Rome will answer."
 oe_rom3.3.a: "Extend the Twin Eagles Concordat: recognize a sister Rus' Patriarchate"
 oe_rom3.3.a.tt: "Advance Path 1 (#bold #color_yellow Twin Eagles Concordat#!#!), Religious Influence #G +15#!, improve bilateral opinion; gain [ShowModifier('oe_rom3_twin_lights_proposal')] for #Y 25 years#!."
 oe_rom3.3.b: "Rebuke northern pretensions and defend New Rome's sole primacy!"
 oe_rom3.3.b.tt: "Advance Path 2 (#bold #color_yellow Imperial & Patriarchal Rivalry#!#!), Prestige #G +15#!, worsen bilateral opinion; gain [ShowModifier('oe_rom3_new_rome_primacy')] for #Y 25 years#!."
 oe_rom3.3.c: "Remain cool and focus on Mediterranean reconstruction"
 oe_rom3.3.c.tt: "Stability #G +5#!; gain [ShowModifier('oe_rom3_detachment_focus')] for #Y 20 years#!."
 oe_rom3.4.t: "The Synod of the Twin Eagles"
 oe_rom3.4.d: "Metropolitans and imperial envoys from the Bosphorus and the northern rivers meet in solemn synod. Before the icons they seal the Twin Eagles Concordat: Constantinople recognizes a canonical Patriarchate of All Rus' in the sacred diptychs, while the northern sovereign honors New Rome as elder sister in an enduring Orthodox and commercial partnership."
 oe_rom3.4.a: "Ratify the full Twin Eagles Sisterhood Concordat!"
 oe_rom3.4.a.tt: "Both realms gain [ShowModifier('oe_rom3_twin_eagles_concordat')] for #Y 30 years#! with strong mutual opinion, Prestige #G +15#!, Religious Influence #G +20#!."
 oe_rom3.4.b: "Sign a measured liturgical compact keeping diplomatic flexibility"
 oe_rom3.4.b.tt: "Both realms gain [ShowModifier('oe_rom3_conciliar_settlement')] for #Y 25 years#!, Stability #G +6#!."
 oe_rom3.5.t: "Greek Typographers & Northern Gold"
 oe_rom3.5.d: "Along the open sea and river lanes of the Concordat, learned Athonite monks and Greek printers travel north to correct Slavic liturgical books, while northern sable furs and silver chests sail south to endow Mount Athos and Hagia Sophia.\n\nA golden season of Orthodox scholarship dawns across both courts."
 oe_rom3.5.a: "Endow the scholarly exchange, printing presses, and Mount Athos"
 oe_rom3.5.a.tt: "Spend #R 60 gold#!, Prestige #G +10#!; both realms gain [ShowModifier('oe_rom3_greek_typographers')] for #Y 25 years#!."
 oe_rom3.5.b: "Keep the exchange modest through monastic prayers and save treasury gold"
 oe_rom3.5.b.tt: "Religious Influence #G +15#!; gain [ShowModifier('oe_rom3_humble_guardianship')] for #Y 20 years#!."
 oe_rom3.6.t: "The Duel of the Two Eagles: Imperial & Theological Rivalry"
 oe_rom3.6.d: "Smoldering disputes between Second and Third Rome erupt into open polemic! Northern polemicists denounce southern compromises with the Latins, while Constantinople's canonists condemn unauthorized northern imperial titles and autocephaly.\n\nClergy on both sides grow restless: shall we press the duel for primacy, or seek a cooling synod?"
 oe_rom3.6.a: "Yield nothing! Press our singular imperial and Orthodox primacy"
 oe_rom3.6.a.tt: "Prestige #G +18#!, Legitimacy #G +12#!, worsen bilateral opinion; both realms gain [ShowModifier('oe_rom3_eagle_rivalry_duel')] for #Y 25 years#! (with clergy tension)."
 oe_rom3.6.b: "Call for episcopal restraint before the rift hardens into schism"
 oe_rom3.6.b.tt: "Stability #G +5#!; both realms gain [ShowModifier('oe_rom3_conciliar_settlement')] for #Y 20 years#!."
 oe_rom3.7.t: "Reckoning of the Two Seats"
 oe_rom3.7.d: "Decades of polemics and diplomatic duels between Second and Third Rome reach their reckoning as harsher threats gather across Eurasia.\n\nOur court must bring the contest to a close: seal a proud triumph of exclusive Orthodoxy, or forge a late conciliar peace."
 oe_rom3.7.a: "Proclaim the triumph of exclusive Orthodoxy!"
 oe_rom3.7.a.tt: "Complete the Second/Third Rome line, Prestige #G +20#!; gain [ShowModifier('oe_rom3_exclusive_orthodoxy')] for #Y 30 years#!."
 oe_rom3.7.b: "Heal the breach through a late conciliar reconciliation"
 oe_rom3.7.b.tt: "Complete the Second/Third Rome line, Stability #G +10#!; both realms improve relations and gain [ShowModifier('oe_rom3_conciliar_settlement')] for #Y 30 years#!."
 oe_rom3.8.t: "Translatio Imperii: The Northern Crown of Caesars"
 oe_rom3.8.d: "With Constantinople silenced, Orthodox faithful across the Balkans and the East look northward in hope. Monomakh's Cap, the Double-Headed Eagle, and imperial coronation rites now converge in a formal proclamation of Translatio Imperii.\n\nYet the mantle of Rome is no light crown: it brings towering prestige and ambition alongside heavy responsibility."
 oe_rom3.8.a: "Proclaim Translatio Imperii and shoulder the full mantle of Third Rome!"
 oe_rom3.8.a.tt: "Prestige #G +25#!, Legitimacy #G +15#!; gain [ShowModifier('oe_rom3_third_rome_mantle')] for #Y 35 years#!."
 oe_rom3.8.b: "Guard the faith prudently without overstretching the realm"
 oe_rom3.8.b.tt: "Stability #G +10#!, Religious Influence #G +20#!; gain [ShowModifier('oe_rom3_humble_guardianship')] for #Y 30 years#!."
 oe_rom3.9.t: "Elevation of the Patriarchate of All Rus' (1589)"
 oe_rom3.9.d: "A century of ecclesiastical striving reaches its historic summit! In the spirit of the 1589 elevation of Moscow's first Patriarch, the Metropolitanate of Rus' is solemnly raised to the canonical Patriarchate of All Rus'.\n\nWhether Constantinople stands as a living sister or lives on in sacred memory, the spiritual pillar of the northern Orthodox realm is complete."
 oe_rom3.9.a: "Proclaim the Patriarchate of All Rus'!"
 oe_rom3.9.a.tt: "Complete the Second/Third Rome line, Prestige #G +20#!, Religious Influence #G +30#!; gain [ShowModifier('oe_rom3_all_rus_patriarchate')] for #Y 40 years#!."
 oe_rom3.9.b: "Close the reform with a balanced conciliar charter across all dioceses"
 oe_rom3.9.b.tt: "Complete the Second/Third Rome line, Stability #G +10#!; gain [ShowModifier('oe_rom3_conciliar_settlement')] for #Y 30 years#!."
 oe_rom3.20.t: "Second & Third Rome: Choice Takes Effect"
 oe_rom3.90.t: "[TEST] Second & Third Rome: Readings"
