 oe_feu_io_ilkhan_imperial_seal:0 "Claim Ilkhanid Imperial Seal"
 oe_feu_io_ilkhan_imperial_seal_desc:0 "Issue chancery decrees stamped with the vermilion tamgha of the Ilkhanate, asserting sovereign legitimacy over Persian divans and calming restless vassal emirs."
 oe_feu_io_ilkhan_imperial_seal_cd:0 "Ilkhanid Imperial Seal Cooldown"
 oe_feu_io_ilkhan_tuyul_banner:0 "Muster Turco-Mongol Tuyul Banner"
 oe_feu_io_ilkhan_tuyul_banner_desc:0 "Call up hereditary cavalry quotas from tuyul land grants across the Ilkhanid provinces, sharpening light-cavalry shock and accelerating troop recovery."
 oe_feu_io_ilkhan_tuyul_banner_cd:0 "Tuyul Banner Muster Cooldown"
 oe_feu_io_swiss_alpine_pikes:0 "Charter Alpine Pike Cantons"
 oe_feu_io_swiss_alpine_pikes_desc:0 "Standardize cantonal pike-square drills and valley alarm beacons across the Swiss Confederation, granting disciplined infantry prowess and shared mountain defense to sister cantons."
 oe_feu_io_swiss_alpine_pikes_cd:0 "Alpine Pike Canton Charter Cooldown"
 oe_feu_io_swiss_perpetual_neutrality:0 "Proclaim Perpetual Neutrality Compact"
 oe_feu_io_swiss_perpetual_neutrality_desc:0 "Declare armed cantonal neutrality above foreign dynastic wars, fortifying Alpine passes at lower upkeep while licensing disciplined Swiss regiments abroad."
 oe_feu_io_swiss_perpetual_neutrality_cd:0 "Perpetual Neutrality Compact Cooldown"
 oe_feu_io_guelph_papal_subsidy:0 "Guelph Papal League Subsidy"
 oe_feu_io_guelph_papal_subsidy_desc:0 "Mobilize curial credit and Guelph banking consortia to finance civic commerce, satisfy burgher guilds, and lower condottieri upkeep."
 oe_feu_io_guelph_papal_subsidy_cd:0 "Guelph Papal League Subsidy Cooldown"
 oe_feu_io_ghibelline_imperial_vicar:0 "Ghibelline Imperial Vicar Mandate"
 oe_feu_io_ghibelline_imperial_vicar_desc:0 "Secure an Imperial Vicarate patent through the Ghibelline League, consolidating princely crown authority, diplomatic prestige, and battlefield morale."
 oe_feu_io_ghibelline_imperial_vicar_cd:0 "Ghibelline Imperial Vicar Mandate Cooldown"
 oe_feu_io_ireland_pale_parliament:0 "Pale Charter Parliament"
 oe_feu_io_ireland_pale_parliament_desc:0 "Summon the Anglo-Norman lords and burgesses of the Pale to ratify charter subsidies, extend royal control across marcher shires, and steady subject loyalty."
 oe_feu_io_ireland_pale_parliament_cd:0 "Pale Charter Parliament Cooldown"
 oe_feu_io_ireland_tara_muster:0 "Tara Gaelic High-King Muster"
 oe_feu_io_ireland_tara_muster_desc:0 "Sound the hosting horns at Tara to rally Gaelic provincial levies and galloglass bands under the High Kingship's ancestral banner."
 oe_feu_io_ireland_tara_muster_cd:0 "Tara High-King Muster Cooldown"
 oe_feu_io_sikh_khalsa_sangha:0 "Khalsa Martial Sangha"
 oe_feu_io_sikh_khalsa_sangha_desc:0 "Consecrate disciplined Khalsa regiments drawn from the Sikh congregation, raising battlefield morale, discipline, and manpower reserves."
 oe_feu_io_sikh_khalsa_sangha_cd:0 "Khalsa Martial Sangha Cooldown"
 oe_feu_io_hindu_bhakti_endowment:0 "Bhakti Temple Endowment"
 oe_feu_io_hindu_bhakti_endowment_desc:0 "Endow sacred mathas, vernacular devotional schools, and grand temple estates across your Hindu branch, elevating literacy, priestly goodwill, and sister-realm fellowship."
 oe_feu_io_hindu_bhakti_endowment_cd:0 "Bhakti Temple Endowment Cooldown"
 oe_feu_dec_france_royal_domain.title:0 "Louis XI Crown Domain Consolidation"
 oe_feu_dec_france_royal_domain.desc:0 "France begins fragmented among thirty-eight appanages and feudal vassals. Dispatch royal baillis, audit peerage reversion charters, and compel solemn homage in Paris to pacify princely ambition and accelerate incorporation into the royal domain. Enacting this during wartime also invokes a Royal Banner Loyalty Oath across all French subjects."
 oe_feu_dec_france_royal_domain.a:0 "Seal the Crown Domain Ordinance"
 oe_feu_dec_france_royal_domain_tt:0 "Calms liberty desire across all French appanages and vassals, grants #Y Louis XI Crown Domain Consolidation#! for 20 years (and #Y Wartime Royal Banner Loyalty Oath#! for 10 years if currently at war)."
 oe_feu_dec_bohemia_silesian_diet.title:0 "Silesian & Moravian Estates Compact"
 oe_feu_dec_bohemia_silesian_diet.desc:0 "Unify the charters of Bohemia's twenty Silesian, Moravian, and Lusatian duchies in a grand Prague Estates Diet, streamlining vassal governance, raising subject loyalty, and harmonizing royal taxation."
 oe_feu_dec_bohemia_silesian_diet.a:0 "Ratify the Crown Lands Compact"
 oe_feu_dec_bohemia_silesian_diet_tt:0 "Reduces liberty desire across all Bohemian subjects and grants #Y Silesian & Moravian Estates Compact#! for 20 years."
 oe_feu_dec_yunnan_pacification_office.title:0 "Yunnan Pacification Commission (Xuanweisi)"
 oe_feu_dec_yunnan_pacification_office.desc:0 "Administering Yunnan's sixty-seven hereditary tusi chieftaincies strains ordinary diplomacy to the breaking point. Establish a formal Xuanweisi Pacification Commission with tallied copper seals and tuntian frontier granaries to relieve diplomatic strain, elevate tusi loyalty, and feed mountain garrisons."
 oe_feu_dec_yunnan_pacification_office.a:0 "Commission the Xuanweisi Registry"
 oe_feu_dec_yunnan_pacification_office_tt:0 "Reduces liberty desire across all subjects, relieves multi-tusi diplomatic strain, and grants #Y Yunnan Pacification Commission (Xuanweisi)#! for 20 years."
 oe_feu_dec_mandala_tribute_circuit.title:0 "Mandala Sacred Tributary Circuit"
 oe_feu_dec_mandala_tribute_circuit.desc:0 "Elevate the royal capital as the luminous axis of a Southeast Asian Mandala court, codifying golden bunga mas embassies, maritime convoy rights, and harmonious tributary reciprocity."
 oe_feu_dec_mandala_tribute_circuit.a:0 "Proclaim the Mandala Tribute Circuit"
 oe_feu_dec_mandala_tribute_circuit_tt:0 "Calms tributary liberty desire and grants #Y Mandala Sacred Tributary Circuit#! for 20 years."
 oe_feu_dec_sahara_pomor_frontier.title:0 "Trans-Saharan Gold-Salt & Pomor Fur Charter"
 oe_feu_dec_sahara_pomor_frontier.desc:0 "Charter frontier vassals along the Saharan gold-salt oasis routes or the subarctic Pomor sable rivers, pairing diplomatic protection with structured caravan customs and fur tribute logistics."
 oe_feu_dec_sahara_pomor_frontier.a:0 "Grant the Frontier Trade Charter"
 oe_feu_dec_sahara_pomor_frontier_tt:0 "Calms frontier vassals and tributaries and grants #Y Gold-Salt & Pomor Fur Vassal Charter#! for 20 years."
 oe_feu.1.title:0 "The Thirty-Eight Appanages of the Lily"
 oe_feu.1.desc:0 "Envoys from Burgundy, Bourbon, Orléans, Brittany, Armagnac, and three dozen lesser fiefs crowd the Palais de la Cité in Paris. Each peer guards ancestral charters jealously while foreign claimants probe the realm's borders. Shall the crown bind these great houses through solemn homage and pensioned peerage, or expand royal bailli appellate courts inside their fiefs?"
 oe_feu.1.a:0 "Convene the Grand Assize of Peerage Homage"
 oe_feu.1.b:0 "Extend Royal Bailli Appellate Courts"
 oe_feu.2.title:0 "Ordonnance of the Royal Compagnies"
 oe_feu.2.desc:0 "Decades of campaigning have shown that feudal hosts disperse whenever private lords sulk in their castles. Royal councilors present a landmark ordinance: establish permanent salaried Compagnies d'Ordonnance funded by a perpetual royal taille, freeing the king from baronial military blackmail."
 oe_feu.2.a:0 "Muster the Compagnies d'Ordonnance"
 oe_feu.2.b:0 "Codify the Perpetual Royal Taille"
 oe_feu.3.title:0 "The Universal Spider & the League of the Public Weal"
 oe_feu.3.desc:0 "Alarmed by encroaching royal centralization, the richest appanage princes whisper of a 'League of the Public Weal' to preserve feudal autonomy. The king's chancery offers two remedies: weave a patient spiderweb of secret treaties, pensions, and inheritance reverts—or roll bronze royal siege trains straight to their castle gates."
 oe_feu.3.a:0 "Spin the Spider's Web of Treaties and Reversions"
 oe_feu.3.b:0 "March the Royal Ordnance Against Defiant Castles"
 oe_feu.4.title:0 "Edict of Moulins: Indivisibility of the Crown Domain"
 oe_feu.4.desc:0 "One by one, the great medieval appanages have reverted to the crown through diplomacy, marriage, or war. Chancellor jurists now lay the Edict of Moulins before the throne, declaring every annexed duchy an inalienable part of the French sovereign domain forevermore."
 oe_feu.4.a:0 "Proclaim the Inalienable Crown Domain"
 oe_feu.4.b:0 "Register Unified Customs Across All Parlements"
 oe_feu.5.title:0 "Diet of the Silesian & Moravian Duchies"
 oe_feu.5.desc:0 "Twenty Piast dukes from Wroclaw, Opole, Teschen, and Legnica ride into Prague alongside Moravian margraves to confirm their incorporation under the Crown of Saint Wenceslas. Careful institutional integration can turn this dense vassal mosaic into Central Europe's wealthiest crown domain."
 oe_feu.5.a:0 "Bind the Silesian Duchies in Solemn Crown Homage"
 oe_feu.5.b:0 "Elevate the Golden Chancery of Prague"
 oe_feu.6.title:0 "Compactata of the Bohemian Estates"
 oe_feu.6.desc:0 "Religious fervor and estates autonomy threaten to fracture the bond between Prague's burghers and the Catholic Silesian duchies. Shall the kingdom pursue a balanced Compactata settlement guaranteeing estates peace, or fortify the countryside behind chained war-wagon bastions?"
 oe_feu.6.a:0 "Ratify the Estates Compactata Peace"
 oe_feu.6.b:0 "Standardize the Wagenburg Field Fortifications"
 oe_feu.7.title:0 "The Sixty-Seven Tusis of Yunnan"
 oe_feu.7.desc:0 "From the terraced gorges of Dali and Lijiang to the tropical river bends of Cheli and Luchuan, sixty-seven hereditary tusi chieftains submit tallied bamboo registers to the Yunnan Pacification Commission. Formalizing their Xuanweisi seals prevents diplomatic overload while keeping the southwest mountain passes secure."
 oe_feu.7.a:0 "Issue Tallied Xuanweisi Copper Seals"
 oe_feu.7.b:0 "Expand the Tea-Horse Mountain Relay Posts"
 oe_feu.8.title:0 "Gaituguiliu: Garrison Granaries & Prefectural Seals"
 oe_feu.8.desc:0 "Generations of peace along the Yunnan frontier have linked highland valleys with imperial highways. Governors now propose pairing military tuntian farming colonies with gradual gaituguiliu prefectural administration wherever hereditary lines lapse."
 oe_feu.8.a:0 "Provision Frontier Tuntian Military Granaries"
 oe_feu.8.b:0 "Advance Gradual Gaituguiliu Prefectures"
 oe_feu.9.title:0 "Bunga Mas: The Mandala Tribute Circuit"
 oe_feu.9.desc:0 "At the change of the monsoon, ceremonial barges arrive bearing intricate trees of beaten gold and silver—the Bunga Mas sent by peripheral rajahs and river principalities. In the Mandala order, power radiates not from rigid borderlines but from sacred prestige and generous reciprocity."
 oe_feu.9.a:0 "Hold the Grand Bunga Mas Court Ceremony"
 oe_feu.9.b:0 "Dispatch Mandala Royal Arbitrators Abroad"
 oe_feu.10.title:0 "Nusantara & Mekong Maritime Suzerainty"
 oe_feu.10.desc:0 "Pepper, cloves, tin, and porcelain pour through the straits and river deltas linking our tributary ports. Coastal vassals offer war-prahu escorts in exchange for unified entrepot customs that shelter their merchant fleets from piracy."
 oe_feu.10.a:0 "Commission Tributary War-Prahu Escorts"
 oe_feu.10.b:0 "Harmonize Spice Entrepot Harbor Customs"
 oe_feu.11.title:0 "Gold of Bambuk, Salt of Taghaza"
 oe_feu.11.desc:0 "Thousands of laden camels file out of the desert dunes carrying slabs of rock salt from Taghaza to trade weight for weight against gold dust from Bambuk and Bure. Oasis emirs and desert vassals await our charter guaranteeing safe wells, fair qadi courts, and escort riders."
 oe_feu.11.a:0 "Deploy Mounted Gold-Salt Caravan Escorts"
 oe_feu.11.b:0 "Patronize Sankore & Oasis Jurist Courts"
 oe_feu.12.title:0 "Ushkuiniks & the Pomor Sable Frontier"
 oe_feu.12.desc:0 "Beyond Lake Onega and down the Northern Dvina toward the White Sea and Perm, Novgorod's tributary river folk bring winter bales of prime sable, silver fox, and walrus ivory. The Veche debates whether to lock in annual fur tribute ledgers or expand Ushkuinik shallow-draft river flotillas across the northern portages."
 oe_feu.12.a:0 "Expand the Pomor & Perm Sable Tribute Ledgers"
 oe_feu.12.b:0 "Charter Ushkuinik River Portage Flotillas"
 oe_feu.13.title:0 "The Fractured Seal of the Ilkhanate"
 oe_feu.13.desc:0 "Though the last unified Ilkhan sleeps in Sultaniyya, the scarlet tamgha of Hulegu's realm still commands awe from Baghdad to Khorasan. Rival emirs, Persian viziers, and nomadic tuyul-holders weigh whether to restore the Ilkhanid chancery's legal prestige or rally Turco-Mongol horsemen beneath freshly blessed standards."
 oe_feu.13.a:0 "Promulgate the Yarligh of the Restored Ilkhanate"
 oe_feu.13.b:0 "Mobilize Persian-Mongol Tuyul Cavalry"
 oe_feu.14.title:0 "Oath of the Alpine Passes"
 oe_feu.14.desc:0 "Snowmelt roars beneath the stone bridge of the Gotthard Pass as delegates from forest and city cantons renew their Eternal Pact. Surrounded by ambitious dynastic empires, the Confederation must choose whether to fortify every alpine defile with iron-disciplined pike squares or turn the Tagsatzung Diet into Europe's most trusted mediator and commercial crossroads."
 oe_feu.14.a:0 "Fortify the Gotthard Pass Pike Redoubts"
 oe_feu.14.b:0 "Strengthen the Tagsatzung Federal Diet"
 oe_feu.15.title:0 "Banners of the Keys: The Guelph League"
 oe_feu.15.desc:0 "Under the crossed keys of Saint Peter, Guelph communes and banking houses convene to counter imperial encroachments across Italy. Guild consuls urge channeling curial florins into trans-peninsular credit networks, while militia captains call for rallying citizens beneath the communal Carroccio."
 oe_feu.15.a:0 "Channel Guelph Consortia & Curial Florins"
 oe_feu.15.b:0 "Rally the Carroccio Civic Guild Militia"
 oe_feu.16.title:0 "Eagles of the Emperor: The Ghibelline Compact"
 oe_feu.16.desc:0 "Beneath the black eagle of the Empire, Ghibelline signori and Lombard communes assemble to uphold imperial law against papal factionalism. Shall we codify our authority through Imperial Vicarate charters, or pool league silver to hire disciplined Ghibelline condottieri?"
 oe_feu.16.a:0 "Enforce the Imperial Vicarate Charter"
 oe_feu.16.b:0 "Contract Veteran Ghibelline Condottieri"
 oe_feu.17.title:0 "Statutes of the Dublin Pale"
 oe_feu.17.desc:0 "From Dublin Castle to the marches of Kildare and Ormond, Anglo-Norman barons gather in Parliament to shore up the Lordship of Ireland. Law clerks draft sweeping statutes to stabilize taxes and vassal loyalty, while marcher wardens petition for ditch ramparts and stone tower houses."
 oe_feu.17.a:0 "Enact the Statutes of the Dublin Pale"
 oe_feu.17.b:0 "Fortify the Pale Ditch & Marcher Towers"
 oe_feu.18.title:0 "Stone of Destiny at Tara"
 oe_feu.18.desc:0 "Bards, Brehon jurists, and Gaelic tanists converge upon the green ridge of Tara beneath the ancient High Kingship. With rival earldoms pressing from the east, the assembly weighs summoning a grand provincial hosting of galloglass warriors or renewing a Brehon Law concord across every Irish sept."
 oe_feu.18.a:0 "Summon the Grand Hosting of Tara"
 oe_feu.18.b:0 "Proclaim the Brehon Law & Bardic Concord"
 oe_feu.19.title:0 "Brotherhood of the Khalsa"
 oe_feu.19.desc:0 "Across the fertile doabs of the five rivers, devotees gather around the Sikh congregation in defiance of tyranny and caste division. Elders propose consecrating disciplined Khalsa bands to defend the faithful, or expanding gurdwara langar communal kitchens and granaries to anchor popular devotion."
 oe_feu.19.a:0 "Consecrate the Order of the Khalsa Panth"
 oe_feu.19.b:0 "Endow Gurdwara Langar & Granary Charity"
 oe_feu.20.title:0 "Saints and Temples of the Bhakti Tide"
 oe_feu.20.desc:0 "Devotional hymns composed in living regional tongues echo from temple gopurams and village shrines across our Hindu branch. Royal patronage can endow matha academies to spread vernacular learning, or channel temple treasuries into irrigation tanks and merchant guilds."
 oe_feu.20.a:0 "Patronize Bhakti Poet-Saints & Matha Schools"
 oe_feu.20.b:0 "Fund Temple Guilds & Tank Irrigation"
 STATIC_MODIFIER_NAME_oe_feu_mod_io_ilkhan_seal:0 "Ilkhanid Imperial Seal Decree"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_ilkhan_seal:0 "Chancery decrees stamped with the red tamgha of the Ilkhanate command submission from rival emirs and elevate the court's sovereign claim."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_ilkhan_tuyul:0 "Turco-Mongol Tuyul Banner Levy"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_ilkhan_tuyul:0 "Land-grant cavalry retinues drawn from tuyul fiefs ride swiftly under imperial standards, swelling steppe reserves and battlefield recovery."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_swiss_pikes:0 "Alpine Pike Canton Charter"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_swiss_pikes:0 "Cantonal drill ordinances forge tightly disciplined ash-wood pike phalanxes capable of breaking armored cavalry across narrow mountain defiles."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_swiss_canton_pact:0 "Confederate Alpine Pike Solidarity"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_swiss_canton_pact:0 "Shared cantonal militia obligations assure neighboring Alpine valleys of swift relief whenever foreign princes march on the passes."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_swiss_neutrality:0 "Perpetual Neutrality Compact"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_swiss_neutrality:0 "Standing aloof from dynastic entanglements turns the confederated cantons into an impregnable mountain redoubt and prized source of chartered soldiers."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_guelph_subsidy:0 "Guelph Papal League Treasury"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_guelph_subsidy:0 "Florentine and curial bankers channel florins across Guelph communes, sustaining civic guilds and contracted condottieri companies."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_ghibelline_vicar:0 "Ghibelline Imperial Vicar Mandate"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_ghibelline_vicar:0 "Imperial charters confirm Ghibelline signori as lawful vicars of northern Italy, strengthening princely authority and battlefield morale."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_pale_parliament:0 "Dublin Pale Charter Parliament"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_pale_parliament:0 "Regular parliaments convened within the Pale codify marcher taxes, stabilize Anglo-Norman earldoms, and extend administrative reach."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_tara_muster:0 "Tara Gaelic High-King Muster"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_tara_muster:0 "Horn blasts from the Hill of Tara summon galloglass warriors and provincial kern levies to defend ancestral Gaelic lordships."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_sikh_khalsa:0 "Khalsa Martial Sangha"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_sikh_khalsa:0 "Initiated saint-soldiers bind egalitarian devotion to unyielding martial discipline across the five rivers."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_hindu_bhakti:0 "Bhakti Temple Endowment"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_hindu_bhakti:0 "Royal land grants to devotional mathas and great temples nourish vernacular scholarship, priestly goodwill, and agrarian tithes."
 STATIC_MODIFIER_NAME_oe_feu_mod_io_hindu_bhakti_fellow:0 "Bhakti Pilgrimage Fellowship"
 STATIC_MODIFIER_DESC_oe_feu_mod_io_hindu_bhakti_fellow:0 "Pilgrim hymns and shared temple endowments link sister Hindu kingdoms in spiritual harmony and scholarly exchange."
 STATIC_MODIFIER_NAME_oe_feu_mod_dec_france_royal_domain:0 "Louis XI Crown Domain Consolidation"
 STATIC_MODIFIER_DESC_oe_feu_mod_dec_france_royal_domain:0 "Royal baillis, Parlement registers, and calibrated marriage-reversion clauses steadily gather France's scattered appanages into the sovereign crown domain."
 STATIC_MODIFIER_NAME_oe_feu_mod_sub_france_oath:0 "Sworn Appanage Homage to Paris"
 STATIC_MODIFIER_DESC_oe_feu_mod_sub_france_oath:0 "Peerage patents and royal court pensions reconcile provincial dukes and counts to lawful submission beneath the fleur-de-lis."
 STATIC_MODIFIER_NAME_oe_feu_mod_france_hyw_oath:0 "Wartime Royal Banner Loyalty Oath"
 STATIC_MODIFIER_DESC_oe_feu_mod_france_hyw_oath:0 "Confronted by foreign invasion, the peers and appanage lords rally under the Oriflamme, suspending feudal quarrels for the defense of the realm."
 STATIC_MODIFIER_NAME_oe_feu_mod_dec_bohemia_diet:0 "Silesian & Moravian Estates Compact"
 STATIC_MODIFIER_DESC_oe_feu_mod_dec_bohemia_diet:0 "The Bohemian Crown Chancery harmonizes the charters of Silesian Piast duchies and Moravian estates, curbing vassal friction and unifying royal revenues."
 STATIC_MODIFIER_NAME_oe_feu_mod_sub_bohemia_compact:0 "Bohemian Crown Lands Accord"
 STATIC_MODIFIER_DESC_oe_feu_mod_sub_bohemia_compact:0 "Recognized estates privileges under the Crown of Saint Wenceslas keep Silesian and Lusatian fiefs prosperous and dutiful."
 STATIC_MODIFIER_NAME_oe_feu_mod_dec_yunnan_pacification:0 "Yunnan Pacification Commission (Xuanweisi)"
 STATIC_MODIFIER_DESC_oe_feu_mod_dec_yunnan_pacification:0 "Structured Xuanweisi seal registers, military tuntian granaries, and hereditary confirmation writs tame the diplomatic burden of Yunnan's dozens of tusi chieftaincies."
 STATIC_MODIFIER_NAME_oe_feu_mod_sub_tusi_xuanweisi:0 "Xuanweisi Confirmed Tusi Seal"
 STATIC_MODIFIER_DESC_oe_feu_mod_sub_tusi_xuanweisi:0 "Imperial copper seals and frontier grain stipends secure hereditary tusi authority while binding mountain passes to peaceful tribute."
 STATIC_MODIFIER_NAME_oe_feu_mod_dec_mandala_circuit:0 "Mandala Sacred Tributary Circuit"
 STATIC_MODIFIER_DESC_oe_feu_mod_dec_mandala_circuit:0 "Ceremonial bunga mas embassies and harmonized monsoon harbor tolls knit peripheral riverine and island vassals into a luminous Mandala center."
 STATIC_MODIFIER_NAME_oe_feu_mod_sub_mandala_bunga_mas:0 "Bunga Mas Protected Tributary"
 STATIC_MODIFIER_DESC_oe_feu_mod_sub_mandala_bunga_mas:0 "In exchange for symbolic golden trees, the Mandala center guarantees maritime safe-conduct and regional prestige to tributary courts."
 STATIC_MODIFIER_NAME_oe_feu_mod_dec_frontier_charter:0 "Gold-Salt & Pomor Fur Vassal Charter"
 STATIC_MODIFIER_DESC_oe_feu_mod_dec_frontier_charter:0 "Chartered oasis wells, desert guides, and northern river portages transform distant frontier subjects into lucrative trade and tribute corridors."
 STATIC_MODIFIER_NAME_oe_feu_mod_sub_frontier_charter:0 "Chartered Caravan & Fur Tributary"
 STATIC_MODIFIER_DESC_oe_feu_mod_sub_frontier_charter:0 "Guaranteed staple markets and overlord protection reward frontier vassals who keep desert oases and boreal portages open."
 STATIC_MODIFIER_NAME_oe_feu_mod_strain_relief_major:0 "Grand Feudal Chancery (Multi-Vassal Relief)"
 STATIC_MODIFIER_DESC_oe_feu_mod_strain_relief_major:0 "Dedicated chancery clerks managing dozens of hereditary fiefs, appanages, or tusis prevent administrative collapse while consolidation proceeds."
 STATIC_MODIFIER_NAME_oe_feu_mod_strain_relief_minor:0 "Frontier Suzerainty Chancery"
 STATIC_MODIFIER_DESC_oe_feu_mod_strain_relief_minor:0 "Dedicated tribute registrars and envoy relays ease the diplomatic upkeep of widespread vassal and tributary networks."
 STATIC_MODIFIER_NAME_oe_feu_mod_ev_fra_appanage_homage:0 "Grand Assize of Appanage Homage"
 STATIC_MODIFIER_DESC_oe_feu_mod_ev_fra_appanage_homage:0 "Solemn fealty sworn before the peers of France quiets appanage ambitions and eases diplomatic integration."
 STATIC_MODIFIER_NAME_oe_feu_mod_ev_fra_bailli_courts:0 "Royal Bailli Appellate Courts"
 STATIC_MODIFIER_DESC_oe_feu_mod_ev_fra_bailli_courts:0 "Crown magistrates hear appeals directly from seigneurial courts, eroding private baronial jurisdiction in favor of royal law."
 STATIC_MODIFIER_NAME_oe_feu_mod_ev_fra_compagnies:0 "Compagnies d'Ordonnance"
