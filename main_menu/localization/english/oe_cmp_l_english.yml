 game_concept_oe_tu_company: "Roman Company"
 game_concept_oe_tu_company_desc: "#F Byzantium never gave its own merchants a company charter: the Company is a 'what if'. Its shape is borrowed from the Genoese: it is said that the shareholders who fitted out the fleet that took Chios in 1346 were later given the island's revenues, and their association was called the 'Maona'.#!\n\nThe Roman Company runs the empire's [Concept('oe_tu_emporion','trading posts')|e] on the Black Sea; it opens no posts of its own. There are three kinds of charter:\nthe crown's monopoly: the treasury puts up the money and takes all the profit, and the Company has no will of its own;\nthe merchants of the City: they put up the money and the treasury takes half the profit;\na Genoese or Venetian partner: the partner puts up the money, the treasury takes two fifths, and the partner thinks better of the empire.\nThe books are closed every January: the gross profit follows the points of the posts, less their upkeep it is the net profit; the treasury takes its share as a dividend and the rest stays in the fund. When the treasury is short of the upkeep at the end of the year, a merchants' or partners' company advances it.\nA company with shareholders has more of a will of its own every year (autonomy); investing and audits keep it down. At 40 the shareholders ask to farm the customs.\nOnce the Company is #Y 10#! years old and its posts come to #Y 3#! points (or it has a post in the Levant), it may buy a piece of coast next to a post from its master, or the quarter its post stands in, and offer protection treaties to small rulers on the coasts of the Black Sea and the Levant; whether to sell or to sign is for the other side to decide. Land it buys becomes a Roman colonia.\nOnce the autonomy of a company with shareholders has reached #Y 40#!, the Company is on the rise: at #Y 70#! it goes its own way, at #Y 90#! or after #Y 2#! years of losses in a row it falls into crisis; the emperor may nationalise it at any time (the treasury pays the shareholders half its fund). From #Y 1360#! the shares of Genoese Chios may come up for sale. A ruler under its protection for #Y 10#! years may choose to become the empire's tributary. After #Y 5#! years in a row without the City or without a single post, the Company is wound up."
