 oe_cmp_buy: "Buy Land"
 oe_cmp_buy_desc: "The [Concept('oe_tu_company','Roman Company')|e] offers to buy a piece of coast next to one of its posts, or the quarter its post stands in, from the master of the place.\nThe Company's fund pays: a quarter #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_q')|0]#! gold; a village #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_rural_settlement')|0]#!, a town #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_town')|0]#!, a city #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_city')|0]#! gold. Its master is asked and answers: sell, only a street, or no; a country somebody plays decides for itself. Half comes back after a refusal or #Y 2#! months without an answer. Land bought becomes a Roman colonia, with a truce of #Y 5#! years with the seller; one location in #Y 60#! months, at most #Y 4#! in this phase.\n\n#T The Company's Books#!\nCharter: [GetCountry('BYZ').Custom('OeCmpHolder')]; fund #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#! gold; the treasury's share #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#!; autonomy #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#! ([GetCountry('BYZ').Custom('OeCmpAutoNext')])\nLast year: gross #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!, upkeep #R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!, net #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!, to the treasury #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#! (gold)[GetCountry('BYZ').Custom('OeCmpFarmNow')]\nPoints of posts: Tana #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_tana').GetValue|0]#!, Caffa #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_kaffa').GetValue|0]#!, Trebizond #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_trebizond').GetValue|0]#!, Sinope #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_sinop').GetValue|0]#!, Varna #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_varna').GetValue|0]#!, Kilia #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_chilia').GetValue|0]#! (total #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!; this year's upkeep about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_upkeep_now')|0]#! gold)\nCharter: [GetCountry('BYZ').Custom('OeCmpStCharter')]\nInvest: [GetCountry('BYZ').Custom('OeCmpStInvest')]; audit: [GetCountry('BYZ').Custom('OeCmpStAudit')]\nLand and protection: [GetCountry('BYZ').Custom('OeCmpStLand')]\nThe Company's rise: [GetCountry('BYZ').Custom('OeCmpStGrow')]\nNationalisation: [GetCountry('BYZ').Custom('OeCmpStNat')]\nThe shares of Chios: [GetCountry('BYZ').Custom('OeCmpStChios')]"
 oe_cmp_buy_tt: "The Company's fund pays: a quarter #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_q')|0]#! gold; a village #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_rural_settlement')|0]#!, a town #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_town')|0]#!, a city #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_price_city')|0]#! gold. Its master is asked and answers: sell, only a street, or no; a country somebody plays decides for itself. Half comes back after a refusal or #Y 2#! months without an answer. Land bought becomes a Roman colonia, with a truce of #Y 5#! years with the seller; one location in #Y 60#! months, at most #Y 4#! in this phase."
 oe_cmp_buy_card: "The Roman Company buys land or a quarter next to its posts."
 oe_cmp_buy_select: "Choose a location (highlighted ones can be asked for)"
