 oe_cmp_protect: "Offer Protection"
 oe_cmp_protect_desc: "The [Concept('oe_tu_company','Roman Company')|e] offers a treaty of protection to a small ruler on the coasts of the Black Sea or the Levant.\nA small ruler is offered a treaty of protection and answers. Once signed, the Company pays it #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#! gold a year; its opinion of the empire #G +20#!, and land is easier to buy there. When the fund cannot pay, the treaty ends and its opinion #R −10#!. At most #Y 3#!.\n\n[The Company's Books]\nCharter: [GetCountry('BYZ').Custom('OeCmpHolder')]; fund #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#! gold; the treasury's share #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#!; autonomy #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#! ([GetCountry('BYZ').Custom('OeCmpAutoNext')])\nLast year: gross #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#!, upkeep #R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#!, net #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#!, to the treasury #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#! (gold)[GetCountry('BYZ').Custom('OeCmpFarmNow')]\nPoints of posts: Tana #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_tana').GetValue|0]#!, Caffa #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_kaffa').GetValue|0]#!, Trebizond #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_trebizond').GetValue|0]#!, Sinope #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_sinop').GetValue|0]#!, Varna #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_varna').GetValue|0]#!, Kilia #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_post_chilia').GetValue|0]#! (total #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#!; this year's upkeep about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_upkeep_now')|0]#! gold)\nCharter: [GetCountry('BYZ').Custom('OeCmpStCharter')]\nInvest: [GetCountry('BYZ').Custom('OeCmpStInvest')]; audit: [GetCountry('BYZ').Custom('OeCmpStAudit')]\nLand and protection: [GetCountry('BYZ').Custom('OeCmpStLand')]\nThe Company's rise: [GetCountry('BYZ').Custom('OeCmpStGrow')]"
 oe_cmp_protect_tt: "A small ruler is offered a treaty of protection and answers. Once signed, the Company pays it #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#! gold a year; its opinion of the empire #G +20#!, and land is easier to buy there. When the fund cannot pay, the treaty ends and its opinion #R −10#!. At most #Y 3#!."
 oe_cmp_protect_card: "The Roman Company offers a small ruler its protection."
 oe_cmp_protect_select: "Choose the ruler's capital (highlighted ones can be asked)"
 oe_cmp_protect_none: "@trigger_no!No ruler can be offered protection now."
 oe_cmp.1.t: "The Charter"
 oe_cmp.1.d1: "#F In 1346 the Genoese fleet that took Chios was fitted out by private shareholders; it is said that the commune could not repay them and handed them the island's revenues instead, and their association was called a 'mahona'. In 1348 John VI lowered the customs and borrowed to build ships, so that the empire would no longer depend on Galata for its grain and its shipping.#!\n\nThe merchants of the City who keep the house at [SCOPE.sLocation('oe_cmp_site').GetName] have sent a joint petition. They say that the empire's [Concept('oe_tu_emporion','trading posts')|e] now come to #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#! points, but every house runs its own business and finds its own ships, and no one speaks for them when things go wrong. They ask the emperor for a charter that hands the posts to one [Concept('oe_tu_company','Roman Company')|e], with a fund of its own, which shares its profit with the treasury.[GetCountry('BYZ').Custom('OeCmpE1Native')][GetCountry('BYZ').Custom('OeCmpE1Monem')]\nWhoever holds the charter decides who puts up the money, how much the treasury takes, and how much of a will the Company will have."
 oe_cmp.1.d2: "#F In 1346 the Genoese fleet that took Chios was fitted out by private shareholders; it is said that the commune could not repay them and handed them the island's revenues instead, and their association was called a 'mahona'. In 1348 John VI lowered the customs and borrowed to build ships, so that the empire would no longer depend on Galata for its grain and its shipping.#!\n\nThe merchants of the City have sent a joint petition. They say that the empire's [Concept('oe_tu_emporion','trading posts')|e] now come to #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#! points, but every house runs its own business and finds its own ships, and no one speaks for them when things go wrong. They ask the emperor for a charter that hands the posts to one [Concept('oe_tu_company','Roman Company')|e], with a fund of its own, which shares its profit with the treasury.[GetCountry('BYZ').Custom('OeCmpE1Native')][GetCountry('BYZ').Custom('OeCmpE1Monem')]\nWhoever holds the charter decides who puts up the money, how much the treasury takes, and how much of a will the Company will have."
 oe_cmp.1.a: "The crown runs it"
 oe_cmp.1.a.tt: "The treasury puts up the fund: #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_a')|0]#! gold (#Y 4#! months of income; #Y 2#! more must stay in reserve)\nAll the net profit goes to the treasury; the Company has no will of its own (autonomy stays #Y 0#!)\nBurghers' satisfaction #R −5%#!\nFrom now on the books are closed every January; the two actions of the 'Company' group of the fiscal edicts open: invest and audit"
 oe_cmp.1.b: "The merchants of the City take shares"
 oe_cmp.1.b.tt: "The merchants raise a fund of #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_b')|0]#! gold; the treasury pays nothing\nThe treasury takes #Y 50%#! of the net profit\nThe Company's autonomy rises by #R +2#! plus the points of posts every year\nBurghers' satisfaction #G +5%#!\nFrom now on the books are closed every January; the two actions of the 'Company' group of the fiscal edicts open: invest and audit"
 oe_cmp.1.c: "Take Genoese partners"
 oe_cmp.1.c.tt: "Genoese shareholders put up #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_c')|0]#! gold\nThe treasury takes #Y 40%#! of the net profit\nAutonomy starts at #R 10#! and grows #Y 1.5#! times as fast as with the City's merchants\nGenoa's opinion of the empire #G +15#! for #Y 10#! years\nFrom now on the books are closed every January; the two actions of the 'Company' group of the fiscal edicts open: invest and audit"
 oe_cmp.1.d: "Take Venetian partners"
 oe_cmp.1.d.tt: "Venetian shareholders put up #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_cap_c')|0]#! gold\nThe treasury takes #Y 40%#! of the net profit\nAutonomy starts at #R 10#! and grows #Y 1.5#! times as fast as with the City's merchants\nVenice's opinion of the empire #G +15#! for #Y 10#! years\nFrom now on the books are closed every January; the two actions of the 'Company' group of the fiscal edicts open: invest and audit"
 oe_cmp.1.e: "Not now"
 oe_cmp.1.e.tt: "The merchants will ask again in #Y 10#! years; refuse a second time and the matter is closed for good"
 oe_cmp.2.t: "The First Accounts"
 oe_cmp.2.d1: "#F Venice's great merchant galleys were built by the state and every year auctioned, route by route, to partnerships of merchants who sailed them in convoy; it is said that this is what was called the 'muda'.#!\n\nThe crown's [Concept('oe_tu_company','Roman Company')|e] has closed its first year: gross #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#! gold, upkeep of the posts #R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#! gold, net #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#! gold. The gross went straight to the treasury, which paid the upkeep of the posts itself; the treasury is #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#! gold the richer. The Company's fund now stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#! gold, its autonomy at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!.\nThe officials who keep the books ask: does the money stay in the treasury, or go back to the Company to grow on?"
 oe_cmp.2.d2: "#F Venice's great merchant galleys were built by the state and every year auctioned, route by route, to partnerships of merchants who sailed them in convoy; it is said that this is what was called the 'muda'.#!\n\nThe [Concept('oe_tu_company','Roman Company')|e] ([GetCountry('BYZ').Custom('OeCmpHolder')]) has closed its first year: gross #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_p').GetValue|0]#! gold, upkeep of the posts #R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_u').GetValue|0]#! gold, net #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_n').GetValue|0]#! gold. By the charter the treasury takes #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_share').GetValue|0]%#! of the net, #G [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#! gold, already paid in. The Company's fund now stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_fund').GetValue|0]#! gold, its autonomy at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_auto').GetValue|0]#!.\nThe shareholders would leave this year's dividend in the business; the treasury's men say the crown's share in the charter is too small as it is."
 oe_cmp.2.a: "Pay out as the charter says"
 oe_cmp.2.a.tt: "The accounts stand as they were closed"
 oe_cmp.2.b: "Leave this year's dividend in the business"
 oe_cmp.2.b.tt: "The treasury hands this year's dividend, #R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#! gold, back to the Company's fund\nThe Company's autonomy #R +5#!\nWith the City's merchants: Burghers' satisfaction #G +5%#!; with an Italian partner: [GetCountry('BYZ').Custom('OeCmpPartner')]'s opinion of the empire #G +5#! for #Y 5#! years"
 oe_cmp.2.c: "Raise the crown's share"
 oe_cmp.2.c.tt: "The treasury's share #G +10#! points (at most #Y 20#! above the charter's), from next year's accounts\nThe Company's autonomy #G −5#!\nWith the City's merchants: Burghers' satisfaction #R −5%#!; with an Italian partner: [GetCountry('BYZ').Custom('OeCmpPartner')]'s opinion of the empire #R −10#! for #Y 5#! years"
 oe_cmp.2.d: "Into the treasury"
 oe_cmp.2.d.tt: "The money stays in the treasury"
 oe_cmp.2.e: "Keep it for the Company to grow on"
 oe_cmp.2.e.tt: "The treasury pays this year's net profit, #R [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_d').GetValue|0]#! gold, into the Company's fund"
 oe_cmp.3.t: "The Shareholders' Petition"
 oe_cmp.3.d1: "#F The empire had long farmed out the taxes of a district to whoever bid highest; the sources call them tax farmers. It is said that the Genoese of Chios took hold of the island's revenues in the same way.#!\n\nThe shareholders of the [Concept('oe_tu_company','Roman Company')|e] ask that the tenth paid on goods brought from [SCOPE.sLocation('oe_cmp_site').GetName] to the City be farmed out to the Company: it pays a fixed sum each year and keeps whatever it collects above it. The treasury loses some duties every year and the Company gains #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#! gold of gross a year; it also gains a good deal of confidence."
 oe_cmp.3.d2: "#F The empire had long farmed out the taxes of a district to whoever bid highest; the sources call them tax farmers. It is said that the Genoese of Chios took hold of the island's revenues in the same way.#!\n\nThe shareholders of the [Concept('oe_tu_company','Roman Company')|e] ask that the tenth paid on goods from the Black Sea be farmed out to the Company: it pays a fixed sum each year and keeps whatever it collects above it. The treasury loses some duties every year and the Company gains #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#! gold of gross a year; it also gains a good deal of confidence."
 oe_cmp.3.a: "Grant the farm"
 oe_cmp.3.a.tt: "[ShowModifier('oe_cmp_customs_farmed')] for #Y 20#! years\nMeanwhile the Company's gross rises by #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#! gold a year\nThe Company's autonomy #R +10#!"
 oe_cmp.3.b: "Ten years only"
 oe_cmp.3.b.tt: "[ShowModifier('oe_cmp_customs_farmed')] for #Y 10#! years\nMeanwhile the Company's gross rises by #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_farm_amt')|0]#! gold a year\nThe Company's autonomy #R +5#!"
 oe_cmp.3.c: "Refuse"
 oe_cmp.3.c.tt: "Costs #R 1#! [oe_tu_authority|e]\nThe Company's autonomy #G −10#!\nWith the City's merchants: Burghers' satisfaction #R −5%#!; with an Italian partner: [GetCountry('BYZ').Custom('OeCmpPartner')]'s opinion of the empire #R −10#! for #Y 5#! years"
 oe_cmp.11.t: "The Romans Wish to Buy Land"
 oe_cmp.11.d1: "#F It is said that the emperors of Trebizond in the fourteenth century gave quarters and warehouses in their city first to the Venetians and then to the Genoese, to run as their own.#!\n\nThe [Concept('oe_tu_company','Roman Company')|e] of Constantinople has sent to us, offering #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#! gold for the street of the Roman house at [SCOPE.sLocation('oe_cmp_land').GetName]: its warehouses, quay and lodgings would be the Roman merchants' own, with a wall of their own and a judge sent by the emperor. The place itself stays ours.[GetCountry('BYZ').Custom('OeCmpE11Grant')]"
 oe_cmp.11.d2: "#F It is said that the emperors of Trebizond in the fourteenth century gave quarters and warehouses in their city first to the Venetians and then to the Genoese, to run as their own.#!\n\nThe [Concept('oe_tu_company','Roman Company')|e] of Constantinople has sent to us, offering #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#! gold for the coast around [SCOPE.sLocation('oe_cmp_land').GetName]: the Roman merchants have a house nearby and want a quay and fields of their own. Once the land is theirs, the envoy says, it will be governed in the Roman way.[GetCountry('BYZ').Custom('OeCmpE11Street')]"
 oe_cmp.11.a: "Sell the land to the Romans"
 oe_cmp.11.a.tt: "[SCOPE.sLocation('oe_cmp_land').GetName] becomes Byzantium's (a Roman colonia is set up there)\nWe receive #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#! gold\nA truce of #Y 5#! years with Byzantium\nOur opinion of the Romans #R −5#! for #Y 5#! years"
 oe_cmp.11.b: "Only a street for the Roman house"
 oe_cmp.11.b.tt: "The Roman post at [SCOPE.sLocation('oe_cmp_street').GetName] becomes a chartered quarter (the place stays ours)\nWe receive #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#! gold"
 oe_cmp.11.c: "Let the Romans have the street"
 oe_cmp.11.c.tt: "The Roman post at [SCOPE.sLocation('oe_cmp_land').GetName] becomes a chartered quarter, walled and with the emperor's judge (the place stays ours)\nWe receive #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#! gold"
 oe_cmp.11.d: "Refuse"
 oe_cmp.11.d.tt: "The Romans will not ask again for some years (#Y 5#!; #Y 2#! for a country nobody plays)"
 oe_cmp.12.t: "The Answer"
 oe_cmp.12.d1: "[SCOPE.sCountry('oe_cmp_seller').GetName] has agreed: the coast around [SCOPE.sLocation('oe_cmp_land').GetName] is sold to the [Concept('oe_tu_company','Roman Company')|e] for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#! gold. Once the deed is sealed, a Roman colonia will be set up there."
 oe_cmp.12.d2: "[SCOPE.sCountry('oe_cmp_seller').GetName] has agreed: the street of the Roman house at [SCOPE.sLocation('oe_cmp_land').GetName] goes to the Roman merchants for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cmp_req_paid').GetValue|0]#! gold."
 oe_cmp.12.d3: "[SCOPE.sCountry('oe_cmp_seller').GetName] will not sell the land, only a street for the Roman house at [SCOPE.sLocation('oe_cmp_street').GetName], for half the price, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#! gold; the other half goes back to the Company."
 oe_cmp.12.d4: "[SCOPE.sCountry('oe_cmp_seller').GetName] has accepted the [Concept('oe_tu_company','Roman Company')|e]'s treaty of protection."
 oe_cmp.12.d5: "[SCOPE.sCountry('oe_cmp_seller').GetName] has declined the [Concept('oe_tu_company','Roman Company')|e]'s treaty of protection."
 oe_cmp.12.d6: "[SCOPE.sCountry('oe_cmp_seller').GetName] has sent no answer. As is the custom, the treaty is dropped."
 oe_cmp.12.d7: "[SCOPE.sCountry('oe_cmp_seller').GetName] has sent no answer. As is the custom, the request is dropped, and half the money (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#! gold) goes back to the Company."
 oe_cmp.12.d8: "[SCOPE.sCountry('oe_cmp_seller').GetName] has refused. What the Company spent on the journey and on gifts is gone; half (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#! gold) comes back."
 oe_cmp.12.a: "Seal the deed"
 oe_cmp.12.a.tt: "[SCOPE.sLocation('oe_cmp_land').GetName] becomes the empire's and then a Roman colonia (the event 'A New Colonia' follows)\nA truce of #Y 5#! years with [SCOPE.sCountry('oe_cmp_seller').GetName]\n[SCOPE.sCountry('oe_cmp_seller').GetName]'s opinion of the empire #R −5#! for #Y 5#! years\n#G [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_land_amt')|0]#! more gross a year while the empire holds the land\nNo more land for the Company for #Y 60#! months"
 oe_cmp.12.b: "Seal it"
 oe_cmp.12.b.tt: "The post at [SCOPE.sLocation('oe_cmp_land').GetName] becomes a chartered quarter (#G +2#! points)"
 oe_cmp.12.c: "So be it"
 oe_cmp.12.c.tt: "The post at [SCOPE.sLocation('oe_cmp_street').GetName] becomes a chartered quarter (#G +2#! points)\n#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#! gold back to the Company's fund"
 oe_cmp.12.d: "Sign"
 oe_cmp.12.d.tt: "The Company pays [SCOPE.sCountry('oe_cmp_seller').GetName] #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#! gold a year (the treaty ends when the fund cannot)\n[SCOPE.sCountry('oe_cmp_seller').GetName]'s opinion of the empire #G +20#! while the treaty lasts\nRequests for land from [SCOPE.sCountry('oe_cmp_seller').GetName]: #G +20#! points likelier to be granted"
 oe_cmp.12.e: "Noted"
 oe_cmp.12.e.tt: "[SCOPE.sCountry('oe_cmp_seller').GetName] is not asked again for #Y 2#! years"
 oe_cmp.12.f: "Let it go"
 oe_cmp.12.f.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_req_half')|0]#! gold back to the Company's fund\n[SCOPE.sCountry('oe_cmp_seller').GetName] is not asked again for some years (#Y 5#!; #Y 2#! for a country nobody plays)"
 oe_cmp.13.t: "The Roman Company Offers Protection"
 oe_cmp.13.desc: "The [Concept('oe_tu_company','Roman Company')|e] of Constantinople has sent to us with a treaty of protection: the Company pays us #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#! gold a year, our ports are open to Roman merchants, and in time of need the Company speaks for us before the emperor. The treaty, the envoy says, asks neither homage nor soldiers of us."
 oe_cmp.13.a: "Sign the treaty"
 oe_cmp.13.a.tt: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_prot_fee')|0]#! gold a year from the Roman Company\nOur opinion of the Romans #G +20#! while the treaty lasts\nRequests of the Romans for land here are #Y 20#! points likelier to be granted (we may still refuse)"
 oe_cmp.13.b: "Decline"
 oe_cmp.13.b.tt: "The Romans will not ask again for #Y 2#! years"
 oe_cmp.14.t: "The Company's Sailings"
 oe_cmp.14.desc: "#F Every year the merchant galleys of Venice left port in convoy on fixed dates, for Romania and the Black Sea, for Alexandria and Beirut; it is said that such a sailing was called a 'muda'.#!\n\nThe [Concept('oe_tu_company','Roman Company')|e] is ten years old, and its posts come to #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_cmp_pts')|0]#! points. The shareholders propose that its ships too should sail in convoy on fixed dates, with crews and risks of their own; others say the goods would go cheaper and easier with the convoys of [GetCountry('BYZ').Custom('OeCmpE14Who')].\nFrom now on the 'Company' group of the fiscal edicts in the Imperial Pillars has two more actions: buy land, offer protection."
 oe_cmp.14.a: "Our own sailings"
 oe_cmp.14.a.tt: "[ShowModifier('oe_cmp_own_convoys')] for #Y 10#! years"
 oe_cmp.14.b: "Sail with the Italians"
 oe_cmp.14.b.tt: "[GetCountry('BYZ').Custom('OeCmpE14Who')]'s opinion of the empire #G +10#! for #Y 10#! years"
