# NEW 2026-11-23 v17.5 Steppe Storm, Eurasian Plates & Reactive World — Module 17.5-B: v17.5 Chagatai Destiny Mission Tree oe_msn_44_chg (english) (oe_chg2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v175_chagatai_eurasia.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_chg2_msn_m1:0 "Transoxiana Steppe-Gunpowder Vanguard"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m1:0 "Tian Shan horse archers, Samarkand heavy cataphracts, and royal bronze artillery turn Chagatai hosts into an unstoppable combined-arms force."
 STATIC_MODIFIER_NAME_oe_chg2_msn_m2:0 "Reunited Ulus of Chagatai"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m2:0 "From the Ili Valley to the Oxus and the Tarim oases, every ulus and amirate answers one undivided throne."
 STATIC_MODIFIER_NAME_oe_chg2_msn_m3:0 "Chagatai Silk Road Renaissance"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m3:0 "Karez aqueducts, stone caravanserais, and bilingual Samarkand-Kashgar academies flood Central Asia with wealth and learning."
 STATIC_MODIFIER_NAME_oe_chg2_msn_m4:0 "Eternal Silk Road Khaganate"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m4:0 "Commanding Almaliq, Samarkand, and Kashgar beneath invincible gunpowder-cavalry armies and continental commerce crowns the Heir of Chagatai forever."
 oe_msn_chg_destiny:0 "#bold #color_yellow Chagatai Khanate: Sovereign of the Silk Road#!#!"
 oe_msn_chg_destiny_DESCRIPTION:0 "From the Almaliq Kurultai and Tian Shan Riders to Unified Transoxiana, Tarim Karez Oases, and Silk Road Gunpowder Hegemony"
 oe_msn_chg_destiny_CRITERIA_DESCRIPTION:0 "Secure Almaliq, rally Tian Shan Horse Archers and Samarkand Cataphracts, unite Transoxiana, the Tarim Basin, and Khorasan gates, and crown a modern Chagatai Silk Road empire."
 oe_msn_chg_destiny_BUTTON_TOOLTIP:0 "Embark on the Chagatai Khanate Destiny"
 oe_msn_chg_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Chagatai and its successors: modernize steppe cavalry into Tian Shan Horse Archers, Samarkand Silk-Road Cataphracts, and Transoxiana gunpowder batteries; unite Almaliq, Samarkand, Bukhara, Kashgar, Qocho, and Balkh under one throne; and build a Silk Road Renaissance of caravanserais, karez aqueducts, and academies."
 oe_msn_chg_01_almaliq_kurultai:0 "Summon the Almaliq Kurultai"
 oe_msn_chg_01_almaliq_kurultai_desc:0 "Amid the apple orchards of the Ili valley, summoning steppe noyans and Transoxianian amirs beneath the white tug of Almaliq halts the centrifugal pull tearing the middle ulus apart. Bolstering [horde_unity|e], disciplining regional [subjects|e], and refurbishing khanate [buildings|e] steadies [stability|e] and reasserts Chagatai primacy across Inner Asia."
 oe_msn_chg_01_almaliq_kurultai_req_tt:0 "Own or non-sovereign subject-own Almaliq, Stability >= 5, and either command a Chagatai Amir subject, >= 2 Subjects, or own a Kurultai/Caravanserai."
 oe_msn_chg_02_tianshan_riders:0 "Drill the Tian Shan Horse Archers"
 oe_msn_chg_02_tianshan_riders_desc:0 "Mounted on hardy Semirechye horses and armed with laminated horn bows forged in oasis workshops, Tian Shan horse archers outmaneuver every rival across pass and plain. Upgrading military [buildings|e] and maintaining rigorous mounted drills sharpens [army_tradition|e], yielding a lightning-fast [army|e] ready to enforce the Khan's will from Kashgar to the Oxus."
 oe_msn_chg_02_tianshan_riders_req_tt:0 "Treasury >= 160 Gold, Stability >= 8, and either Army Tradition >= 15 or own a Castle/Weapon Guild."
 oe_msn_chg_03_samarkand_cataphracts:0 "Forge Samarkand Silk-Road Cataphracts"
 oe_msn_chg_03_samarkand_cataphracts_desc:0 "Fusing Sogdian steel lamellar armor from Samarkand's master smiths with nomadic steppe horsemanship produces heavy Silk Road cataphracts of terrifying shock power. Supporting urban armory [buildings|e] and veteran [army_tradition|e] arms the Khan's elite [army|e] to shatter rival warlords and dominate the battlefields of Transoxiana."
 oe_msn_chg_03_samarkand_cataphracts_req_tt:0 "Own or non-sovereign subject-own Samarkand, Stability >= 12, and either Army Tradition >= 20 or own an Armory/Weapon Guild."
 oe_msn_chg_04_transoxiana_gunpowder:0 "Transoxiana Gunpowder Batteries"
 oe_msn_chg_04_transoxiana_gunpowder_desc:0 "Bridging Ming bronze-gun foundry lore from the East with Ottoman matchlock drill from the West, Transoxiana stands uniquely placed to modernize steppe warfare. Embracing gunpowder [advances|e] and erecting foundry [buildings|e] boosts [army_tradition|e] and disciplined [regulars|e], ensuring the Chagatai military remains peer to Eurasia's greatest gunpowder empires."
 oe_msn_chg_04_transoxiana_gunpowder_req_tt:0 "Own or non-sovereign subject-own Samarkand, Stability >= 15, Age of Discovery or later, and either Gunpowder advance, Cannon Maker/Hand Cannon Guild, or Army Tradition >= 25."
 oe_msn_chg_05_transoxiana_jewels:0 "Jewels of Transoxiana: Samarkand & Bukhara"
 oe_msn_chg_05_transoxiana_jewels_desc:0 "Samarkand and Bukhara gleam like twin turquoise jewels between the Amu Darya and Syr Darya, brimming with paper mills, silk bazaars, and renowned madrasas. Anchoring these ancient [core|e] cities with bustling civic [buildings|e] unleashes soaring urban [development|e], vibrant [prosperity|e], and prodigious caravan [trade|e] across the western ulus."
 oe_msn_chg_05_transoxiana_jewels_req_tt:0 "Own or non-sovereign subject-own Samarkand and Bukhara, and either own a Marketplace/Madrasa or Monthly Trade & Tax Income >= 22."
 oe_msn_chg_06_tarim_oases:0 "Lords of the Tarim Oasis Rim"
 oe_msn_chg_06_tarim_oases_desc:0 "Encircling the Taklamakan sands from Kashgar to Qocho, the Tarim oasis ring serves as the indispensable bridge linking Transoxiana to Cathay. Consolidating these eastern [core|e] gates directly or through loyal Amir [subjects|e] safeguards jade and silk [trade|e], pouring reliable transit [gold|e] into the Khan's treasury."
 oe_msn_chg_06_tarim_oases_req_tt:0 "Own or non-sovereign subject-own Kashgar and Qocho, and either command a Chagatai Amir subject or own a Caravanserai."
 oe_msn_chg_07_khorasan_hindukush:0 "Gates of Khorasan and the Hindu Kush"
 oe_msn_chg_07_khorasan_hindukush_desc:0 "Commanding ancient Balkh alongside Herat or Kabul unlocks the twin southern gates leading into the Iranian plateau and the wealthy plains of Hindustan. Extending Chagatai [core|e] sway and vassal [subjects|e] across eighty territories projects towering [prestige|e] and places both Persia and northern India within reach of the Khan's banners."
 oe_msn_chg_07_khorasan_hindukush_req_tt:0 "Own or non-sovereign subject-own Balkh and either Herat or Kabul, with >= 80 Locations owned by self or subjects."
 oe_msn_chg_08_unite_the_uluses:0 "Heir to One Undivided Chagatai Ulus"
 oe_msn_chg_08_unite_the_uluses_desc:0 "Where historical fate rent Chagatai into rival Moghulistan and Transoxiana, one sovereign now binds Almaliq, Samarkand, and Kashgar beneath an undivided banner. With resurgent [horde_unity|e], obedient [subjects|e], and continental [legitimacy|e], the great Kurultai must now decide the soul of the reunited realm: Perso-Turkic urban synthesis, pure steppe Yassa supremacy, or a federated Amirate commonwealth."
 oe_msn_chg_08_unite_the_uluses_req_tt:0 "Own or non-sovereign subject-own Almaliq, Samarkand, and Kashgar, Age of Renaissance or later, and either Great Power status or >= 3 Subjects."
 oe_msn_chg_09_silk_road_yam:0 "Revive the Imperial Silk Road Yam"
 oe_msn_chg_09_silk_road_yam_desc:0 "Restoring stone caravanserais, silver paiza safe-conducts, and fresh remount stables along the Central Asian highways breathes new life into the continental Silk Road. Expanding relay [buildings|e] and reassuring merchant guilds to lift [estate_satisfaction|e] multiplies overland [trade|e] and channels steady toll [gold|e] into the Khan's treasury."
 oe_msn_chg_09_silk_road_yam_req_tt:0 "Own or non-sovereign subject-own Almaliq, Treasury >= 220 Gold, Monthly Trade & Tax Income >= 20, and own a Caravanserai or Marketplace."
 oe_msn_chg_10_fergana_karez:0 "Fergana and Turpan Karez Irrigation"
 oe_msn_chg_10_fergana_karez_desc:0 "Tunneling underground karez aqueducts from the Tian Shan and Pamir snowpacks transforms arid Fergana and Turpan basins into lush vineyards, mulberry orchards, and wheat fields. Investing in hydraulic [buildings|e] drives sustainable oasis [development|e] and rural [prosperity|e], anchoring deep demographic [stability|e] across the desert rim."
 oe_msn_chg_10_fergana_karez_req_tt:0 "Own or non-sovereign subject-own Khujand or Turpan, Age of Renaissance or later, and either own a Granary/Aqueduct System or Capital Development >= 20."
 oe_msn_chg_11_chagatai_renaissance:0 "Patronize the Chagatai Renaissance"
 oe_msn_chg_11_chagatai_renaissance_desc:0 "Beneath the glazed domes of Registan and marble sextants charting the stars, poets of Chagatai Turkic, Persian astronomers, and calligraphers spark an Inner Asian Renaissance. Patronizing academic [buildings|e] and modern [institutions|e] lifts [literacy|e], [cultural_tradition|e], and scientific [advances|e] to rival Florence, Constantinople, and Dadu."
 oe_msn_chg_11_chagatai_renaissance_req_tt:0 "Own or non-sovereign subject-own Samarkand, Stability >= 15, Age of Reformation or later, and either embrace Printing Press or own a Madrasa/University."
 oe_msn_chg_12_eternal_silk_khaganate:0 "Eternal Khaganate of the Silk Road"
 oe_msn_chg_12_eternal_silk_khaganate_desc:0 "Tripod-anchored by Almaliq, Samarkand, and Kashgar, the reunited Chagatai Ulus towers over the crossroads of Eurasia with gunpowder legions, green oases, and unmatched caravan wealth. Crowned as a continental [great_power|e] backed by flourishing [capital|e] [development|e], unbroken [stability|e], and radiant [prestige|e], the Eternal Silk Khaganate now seals its glorious modern charter."
 oe_msn_chg_12_eternal_silk_khaganate_req_tt:0 "Complete all three branches, own or non-sovereign subject-own Almaliq, Samarkand, and Kashgar, Stability >= 18, Age of Absolutism or later, Great Power status, and Capital Development >= 28."
