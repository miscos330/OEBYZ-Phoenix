# NEW 2026-11-23 v17.5 Steppe Storm, Eurasian Plates & Reactive World — Module 17.5-B: v17.5 Chagatai Destiny Mission Tree oe_msn_44_chg (english) (oe_chg2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v175_chagatai_eurasia.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_chg2_msn_m1:0 "Transoxiana Steppe-Gunpowder Vanguard"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m1:0 "Tian Shan horse archers, Samarkand heavy cataphracts, and royal bronze artillery turn Chagatai hosts into an unstoppable combined-arms force."
 STATIC_MODIFIER_NAME_oe_chg2_msn_m2:0 "Reunited Ulus of Chagatai"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m2:0 "From the Ili Valley to the Oxus and the Tarim oases, every ulus and amirate answers one undivided throne."
 STATIC_MODIFIER_NAME_oe_chg2_msn_m3:0 "Chagatai Silk Road Renaissance"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m3:0 "Karez aqueducts, stone caravanserais, and bilingual Samarkand-Kashgar academies flood Central Asia with wealth and learning."
 STATIC_MODIFIER_NAME_oe_chg2_msn_m4:0 "Eternal Silk Road Khaganate"
 STATIC_MODIFIER_DESC_oe_chg2_msn_m4:0 "Commanding Almaliq, Samarkand, and Kashgar beneath invincible gunpowder-cavalry armies and continental commerce crowns the Heir of Chagatai forever."
 oe_msn_chg_destiny:0 "#bold #color_yellow Chagatai Khanate: Sovereign of the Silk Road#!#!"
 oe_msn_chg_destiny_DESCRIPTION:0 "From the Almaliq Kurultai and Tian Shan Riders to Unified Transoxiana, Tarim Karez Oases, and Silk Road Gunpowder Hegemony"
 oe_msn_chg_destiny_CRITERIA_DESCRIPTION:0 "Secure Almaliq, rally Tian Shan Horse Archers and Samarkand Cataphracts, unite Transoxiana, the Tarim Basin, and Khorasan gates, and crown a modern Chagatai Silk Road empire."
 oe_msn_chg_destiny_BUTTON_TOOLTIP:0 "Embark on the Chagatai Khanate Destiny"
 oe_msn_chg_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Chagatai and its successors: modernize steppe cavalry into Tian Shan Horse Archers, Samarkand Silk-Road Cataphracts, and Transoxiana gunpowder batteries; unite Almaliq, Samarkand, Bukhara, Kashgar, Qocho, and Balkh under one throne; and build a Silk Road Renaissance of caravanserais, karez aqueducts, and academies."
 oe_msn_chg_01_almaliq_kurultai:0 "Summon the Almaliq Kurultai"
 oe_msn_chg_01_almaliq_kurultai_desc:0 "Anchor sovereign authority in the Ili Valley capital of Almaliq and convene the tribal noyans and oasis amirs beneath the white banner."
 oe_msn_chg_01_almaliq_kurultai_req_tt:0 "Control Almaliq (directly or via subject) and have at least 5 Stability."
 oe_msn_chg_02_tianshan_riders:0 "Drill the Tian Shan Horse Archers"
 oe_msn_chg_02_tianshan_riders_desc:0 "Equip our Zhetysu warbands with composite bows and hardy mountain mounts to master rapid highland and steppe warfare."
 oe_msn_chg_02_tianshan_riders_req_tt:0 "Hold at least 160 Gold and have at least 8 Stability."
 oe_msn_chg_03_samarkand_cataphracts:0 "Forge Samarkand Silk-Road Cataphracts"
 oe_msn_chg_03_samarkand_cataphracts_desc:0 "Harness Samarkand's steel armories to raise armored Turko-Persian heavy cataphracts capable of breaking any infantry square."
 oe_msn_chg_03_samarkand_cataphracts_req_tt:0 "Control Samarkand (directly or via subject) and have at least 12 Stability."
 oe_msn_chg_04_transoxiana_gunpowder:0 "Transoxiana Gunpowder Batteries"
 oe_msn_chg_04_transoxiana_gunpowder_desc:0 "Pair bronze field artillery and matchlock squadrons with our steppe horsemen so Chagatai armies outmatch every gunpowder empire."
 oe_msn_chg_04_transoxiana_gunpowder_req_tt:0 "Control Samarkand (directly or via subject) with at least 15 Stability in the Age of Discovery or later."
 oe_msn_chg_05_transoxiana_jewels:0 "Jewels of Transoxiana: Samarkand & Bukhara"
 oe_msn_chg_05_transoxiana_jewels_desc:0 "Secure the glittering river metropolises of Samarkand and Bukhara as the western economic anchor of the Khanate."
 oe_msn_chg_05_transoxiana_jewels_req_tt:0 "Control both Samarkand and Bukhara (directly or via subject)."
 oe_msn_chg_06_tarim_oases:0 "Lords of the Tarim Oasis Rim"
 oe_msn_chg_06_tarim_oases_desc:0 "Bind Kashgar and Qocho firmly under our Silk Road authority to command both northern and southern Taklamakan caravan lanes."
 oe_msn_chg_06_tarim_oases_req_tt:0 "Control both Kashgar and Qocho (directly or via subject)."
 oe_msn_chg_07_khorasan_hindukush:0 "Gates of Khorasan and the Hindu Kush"
 oe_msn_chg_07_khorasan_hindukush_desc:0 "Hold ancient Balkh together with Herat or Kabul, opening imperial trade and campaign roads toward Persia and northern India."
 oe_msn_chg_07_khorasan_hindukush_req_tt:0 "Control Balkh, control Herat or Kabul, and hold at least 80 Locations directly or via subjects."
 oe_msn_chg_08_unite_the_uluses:0 "Heir to One Undivided Chagatai Ulus"
 oe_msn_chg_08_unite_the_uluses_desc:0 "Overcome the historic East-West divide by holding Almaliq, Samarkand, and Kashgar together as one unbreakable sovereign khanate."
 oe_msn_chg_08_unite_the_uluses_req_tt:0 "Control Almaliq, Samarkand, and Kashgar (directly or via subjects) in the Age of Renaissance or later."
 oe_msn_chg_09_silk_road_yam:0 "Revive the Imperial Silk Road Yam"
 oe_msn_chg_09_silk_road_yam_desc:0 "Restore royal post relays, silver passports, and guarded caravanserais linking Almaliq to every Silk Road entrepot."
 oe_msn_chg_09_silk_road_yam_req_tt:0 "Control Almaliq (directly or via subject) and hold at least 220 Gold."
 oe_msn_chg_10_fergana_karez:0 "Fergana and Turpan Karez Irrigation"
 oe_msn_chg_10_fergana_karez_desc:0 "Invest in underground karez aquifers and mountain snowmelt canals across Khujand and Turpan to transform oasis agriculture."
 oe_msn_chg_10_fergana_karez_req_tt:0 "Control Khujand or Turpan (directly or via subject) in the Age of Renaissance or later."
 oe_msn_chg_11_chagatai_renaissance:0 "Patronize the Chagatai Renaissance"
 oe_msn_chg_11_chagatai_renaissance_desc:0 "Sponsor astronomical observatories, madrasas, and classical Chagatai letters so Samarkand and Kashgar illuminate Eurasia."
 oe_msn_chg_11_chagatai_renaissance_req_tt:0 "Control Samarkand (directly or via subject) with at least 15 Stability in the Age of Reformation or later."
 oe_msn_chg_12_eternal_silk_khaganate:0 "Eternal Khaganate of the Silk Road"
 oe_msn_chg_12_eternal_silk_khaganate_desc:0 "Standing unified, prosperous, and armed with modern gunpowder across Almaliq, Samarkand, and Kashgar fulfills the supreme destiny of the House of Chagatai."
 oe_msn_chg_12_eternal_silk_khaganate_req_tt:0 "Control Almaliq, Samarkand, and Kashgar (directly or via subjects) with at least 18 Stability in the Age of Absolutism or later."
