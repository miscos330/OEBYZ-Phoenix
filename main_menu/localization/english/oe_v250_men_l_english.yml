# NEW 2026-11-24 v25.0 Batch 3 Pack B: 1337-1460 Med/East/North Tracks (MAM/DLH/JAP/MLO-FLO/SWE/DAN) (oe_v250_men_, 0 mainline slots, 0 rules, 0 vanilla overrides) — english localization (272 keys). Edit gen_v250_1337_med_east_north.py, not this file.
 oe_v250_men_ref_mam_bahri_diwan:0 "Bahri Citadel Diwan al-Jaysh"
 oe_v250_men_ref_mam_bahri_diwan_desc:0 "Centralizes iqta muster rolls, royal Mamluk barracks, and garrison rosters atop the Cairo Citadel, sharpening heavy cavalry, battlefield discipline, and chancery coordination while taxing military upkeep and chafing senior emirs."
 oe_v250_men_priv_mam_karimi_guild:0 "Karimi Spice Merchant Consortium"
 oe_v250_men_priv_mam_karimi_guild_desc:0 "Confirms the great Karimi merchant houses in their Red Sea and Alexandrian spice warehouses, strengthening maritime commerce and sea presence at the expense of higher burgher clout, lower merchant tax caps, and military aristocratic resentment."
 oe_v250_men_cab_mam_rawk_cadastre:0 "Rawk al-Nasiri Nile Cadastre"
 oe_v250_men_cab_mam_rawk_cadastre_desc:0 "Dispatches Citadel surveyors along the Nile canals and Syrian plains to re-measure flood basins and iqta yields, lifting local control, harvests, and state taxation while irritating both landed emirs and fellahin cultivators."
 oe_v250_men_cab_mam_rawk_cadastre_action:0 "Rawk al-Nasiri Nile Cadastre: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_mam_rawk_cadastre_active:0 "Rawk al-Nasiri Nile Cadastre in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_men_cab_mam_rawk_cadastre_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_mam_rawk_cadastre_action_progress_wordier:0 "Rawk al-Nasiri Nile Cadastre ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_mam_rawk_cadastre_action_progress_tooltip:0 "Dispatches Citadel surveyors along the Nile canals and Syrian plains to re-measure flood basins and iqta yields, lifting local control, harvests, and state taxation while irritating both landed emirs and fellahin cultivators."
