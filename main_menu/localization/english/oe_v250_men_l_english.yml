 oe_v250_men_cab_mam_rawk_cadastre_no_provinces:0 "@trigger_no! No eligible provinces available for the Rawk Cadastre."
 oe_v250_men_dec_mam_alexandria_guard.title:0 "Fortify the Alexandria & Damietta Sea Guard"
 oe_v250_men_dec_mam_alexandria_guard.desc:0 "Rebuild the Pharos coastal batteries, harbor chains, and Delta patrol slipways against Cypriot and Frankish corsair descents. Costs 110 gold; strengthens galley power, coastal defense, and sailors for 25 years at steeper fleet and fortress upkeep."
 oe_v250_men_dec_mam_alexandria_guard.a:0 "Raise the Harbor Chains and Arm the Delta Patrols"
 oe_v250_men_dec_mam_alexandria_guard_tt:0 "Develops #Y Alexandria#!, boosts prosperity in #Y Damietta#!, and establishes the #Y Alexandria & Damietta Sea Guard#! for 25 years."
 oe_v250_men.1.t:0 "Succession After al-Nasir Muhammad"
 oe_v250_men.1.d:0 "With the passing of the long-reigning Sultan al-Nasir Muhammad, factions of veteran Bahri emirs crowd the Lion Gate of the Cairo Citadel, vying to guide his young Qalawunid sons and carve up the finest Nile and Syrian iqtas. Backing the Citadel Diwan and royal household troops preserves central discipline at steep wages and noble hostility, while distributing patronage among senior emirs or Cairo's qadis buys peace at a clear structural price."
 oe_v250_men.1.a:0 "Back the Citadel Diwan and Royal Mamluk Household"
 oe_v250_men.1.b:0 "Share Iqta Patronage with Senior Bahri Emirs"
 oe_v250_men.1.c:0 "Lean on the Cairo Ulama and Civic Qadis to Mediate"
 oe_v250_men.2.t:0 "The Alexandrian Raid & Red Sea Spice Monopoly"
 oe_v250_men.2.d:0 "Bold Latin corsair fleets operating from Cyprus and Rhodes have reminded Cairo how vulnerable Egypt's northern gates are—even as Indian Ocean pepper and cloves continue pouring through Jeddah and Suez into Alexandrian fondacos. Enforcing strict sultanic spice monopolies funds a permanent coastal galley guard at the cost of merchant discontent and foreign friction, whereas empowering the Karimi houses and renewing Venetian trade charters swells commercial prosperity while diluting crown leverage."
 oe_v250_men.2.a:0 "Enact Sultanic Spice Monopolies and Arm the Levant Guard"
 oe_v250_men.2.b:0 "Charter Karimi Convoys and Renew Mediterranean Capitulations"
 oe_v250_men.3.t:0 "Rise of Barquq & the Burji Citadel Order"
 oe_v250_men.3.d:0 "With the last Qalawunid child-sultans eclipsed by court intrigue, the Circassian commander Sayf al-Din Barquq stands poised to inaugurate the Burji Sultanate—replacing hereditary Bahri succession with disciplined barracks meritocracy and vigilant garrisoning of Damascus, Aleppo, and the Cyprus sea lanes. Reforming the military order around the Burji tower guards bolsters cavalry and manpower at legitimacy and wage costs, while conciliating Syrian viceroys and Cairo's madrasahs eases unrest at the price of looser central command."
 oe_v250_men.3.a:0 "Consolidate the Burji Circassian Barracks and Syrian Marches"
 oe_v250_men.3.b:0 "Conciliate Syrian Governors and Endow Cairo's Madrasahs"
 oe_v250_men_ref_dlh_tughluq_iqta:0 "Tughluq Iqta & Diwan-i-Wizarat Ledger"
 oe_v250_men_ref_dlh_tughluq_iqta_desc:0 "Audits every provincial muqti's revenue surplus and cavalry quota through Delhi's central Diwan-i-Wizarat, bolstering taxation, control, and manpower at the price of emir and peasant discontent and steeper stability costs."
 oe_v250_men_priv_dlh_muqti_cavalry:0 "Muqti Provincial Cavalry Assignments"
 oe_v250_men_priv_dlh_muqti_cavalry_desc:0 "Confirms reliable Turkish and Afghan amirs in hereditary provincial iqta commands, lifting heavy cavalry punch and levy depth while strengthening aristocratic power and narrowing royal tax ceilings."
 oe_v250_men_cab_dlh_amir_i_kohi:0 "Diwan-i-Amir-i-Kohi Reclamation"
 oe_v250_men_cab_dlh_amir_i_kohi_desc:0 "Dispatches state agrarian officers to extend Sondhar seed loans, sink wells, and restore fallow Doab fields, expanding food harvests and prosperity at the expense of direct court subsidies and temporary tax remissions."
 oe_v250_men_cab_dlh_amir_i_kohi_action:0 "Diwan-i-Amir-i-Kohi Reclamation: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_dlh_amir_i_kohi_active:0 "Diwan-i-Amir-i-Kohi Reclamation in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_men_cab_dlh_amir_i_kohi_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_dlh_amir_i_kohi_action_progress_wordier:0 "Diwan-i-Amir-i-Kohi Reclamation ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_dlh_amir_i_kohi_action_progress_tooltip:0 "Dispatches state agrarian officers to extend Sondhar seed loans, sink wells, and restore fallow Doab fields, expanding food harvests and prosperity at the expense of direct court subsidies and temporary tax remissions."
 oe_v250_men_cab_dlh_amir_i_kohi_select_province:0 "Select a Province for Diwan-i-Amir-i-Kohi Reclamation"
 oe_v250_men_cab_dlh_amir_i_kohi_no_provinces:0 "@trigger_no! No eligible provinces available for agrarian reclamation."
 oe_v250_men_dec_dlh_yamuna_canals.title:0 "Dig the Yamuna & Sutlej Irrigation Canals"
 oe_v250_men_dec_dlh_yamuna_canals.desc:0 "Cut great perennial irrigation canals from the Yamuna and Sutlej across the Haryana plains and upper Doab to water orchards, sugar cane, and winter wheat. Costs 115 gold; raises food output, production, and prosperity for 25 years at steep court upkeep and lighter peasant levies."
 oe_v250_men_dec_dlh_yamuna_canals.a:0 "Open the Sluices Across the Doab Plains"
 oe_v250_men_dec_dlh_yamuna_canals_tt:0 "Develops #Y Delhi#!, raises prosperity in #Y Panipat#!, and activates #Y Yamuna & Sutlej Canals#! for 25 years."
 oe_v250_men.4.t:0 "The Doab Famine & Sondhar Agricultural Loans"
 oe_v250_men.4.d:0 "Seven harsh seasons of failed monsoon rains and heavy Doab assessments have emptied villages between the Ganges and Yamuna, forcing Sultan Muhammad bin Tughluq's court into camp at Sargadwari. Creating a dedicated Diwan-i-Amir-i-Kohi to advance Sondhar seed-and-oxen loans can revive the breadbasket at substantial treasury expense, while squeezing iqta arrears refills Delhi's coffers only by risking deeper rural misery."
 oe_v250_men.4.a:0 "Found the Diwan-i-Amir-i-Kohi and Advance Sondhar Loans"
 oe_v250_men.4.b:0 "Audit Iqta Arrears Strictly to Refill Delhi's Treasury"
 oe_v250_men.4.c:0 "Remit Doab Taxes and Empower Local Granary Headmen"
 oe_v250_men.5.t:0 "Firuz Shah's Karkhanas & Hereditary Iqtas"
 oe_v250_men.5.d:0 "After years of exhausting campaigns in the Deccan and Bengal, Firuz Shah Tughluq's ministers advocate a conciliatory settlement: expand imperial Karkhana textile and craft workshops, abolish vexatious tolls, and permit loyal officers to pass iqtas to their sons. Yet veteran commanders warn that hereditary grants erode royal leverage and blunt battlefield discipline whenever western raiders probe the Punjab."
 oe_v250_men.5.a:0 "Expand Royal Karkhanas and Confirm Hereditary Iqtas"
 oe_v250_men.5.b:0 "Maintain Central Cash Stipends and Frontier Garrison Drills"
 oe_v250_men.6.t:0 "The Indus Frontier Watch & Doab Granary Forts"
 oe_v250_men.6.d:0 "Storm clouds over Transoxiana and restless provincial governors across Jaunpur, Malwa, and Gujarat threaten the Sultanate's northwestern passes and Doab heartland. Fortifying the Multan–Lahore–Panipat barrier with stockpiled granary citadels secures the approaches to Delhi at steep fortress and tax cost, while recruiting Afghan and Rajput frontier auxiliaries swells our field hosts at the expense of noble autonomy and cohesion."
 oe_v250_men.6.a:0 "Fortify the Lahore–Panipat Line and Stockpile Doab Granaries"
 oe_v250_men.6.b:0 "Recruit Afghan and Rajput Auxiliaries under Frontier Compacts"
 oe_v250_men_ref_jap_muromachi_kanrei:0 "Muromachi Kanrei & Shugo-Daimyo Council"
 oe_v250_men_ref_jap_muromachi_kanrei_desc:0 "Institutionalizes the Hosokawa, Shiba, and Hatakeyama Kanrei deputyship in Kyoto to arbitrate Shugo-Daimyo rivalries, improving cabinet stewardship, vassal loyalty, and legitimacy while curbing direct shogunal crown power and tax receipts."
 oe_v250_men_priv_jap_za_merchants:0 "Kyoto Za Guilds & Doso Moneylenders"
 oe_v250_men_priv_jap_za_merchants_desc:0 "Grants monopoly charters to Kyoto's sake brewers, silk weavers, and Doso pawnbrokers in exchange for reliable commercial dues, lifting artisan production and overland trade while expanding merchant influence and sparking rural debt resentment."
 oe_v250_men_cab_jap_hanzei_stewardship:0 "Kanrei Shugo Mediation & Hanzei Oversight"
 oe_v250_men_cab_jap_hanzei_stewardship_desc:0 "Assigns a senior Bakufu deputy to mediate Shugo-Daimyo border disputes and audit Hanzei estate shares, reinforcing vassal allegiance and diplomatic stature while reducing direct tax yield and irritating landed monasteries."
 oe_v250_men_cab_jap_hanzei_stewardship_action:0 "Kanrei Shugo Mediation & Hanzei Oversight"
 oe_v250_men_cab_jap_hanzei_stewardship_active:0 "Active: Kanrei Shugo Mediation & Hanzei Oversight"
 oe_v250_men_cab_jap_hanzei_stewardship_action_progress:0 "Active"
 oe_v250_men_cab_jap_hanzei_stewardship_action_progress_wordier:0 "Kanrei Shugo Mediation & Hanzei Oversight (Active)"
 oe_v250_men_cab_jap_hanzei_stewardship_action_progress_tooltip:0 "Assigns a senior Bakufu deputy to mediate Shugo-Daimyo border disputes and audit Hanzei estate shares, reinforcing vassal allegiance and diplomatic stature while reducing direct tax yield and irritating landed monasteries."
 oe_v250_men_dec_jap_tenryuji_fleet.title:0 "Charter the Tenryu-ji & Kangō Tally Voyages"
 oe_v250_men_dec_jap_tenryuji_fleet.desc:0 "Authorize licensed Kangō tally merchant vessels sailing from Hakata and Settsu to continental ports, importing copper coin, silk, and scholarly texts. Costs 100 gold; elevates maritime trade, scholarship, and cultural tradition for 25 years at steeper fleet upkeep and samurai disapproval."
 oe_v250_men_dec_jap_tenryuji_fleet.a:0 "Issue the Imperial Tallies and Launch the Voyages"
 oe_v250_men_dec_jap_tenryuji_fleet_tt:0 "Develops #Y Kyoto#!, boosts prosperity in #Y Hakata#!, and charters the #Y Kangō Tally Voyages#! for 25 years."
 oe_v250_men.7.t:0 "The Tenryu-ji Trading Vessels & Continental Ties"
 oe_v250_men.7.d:0 "Zen master Muso Soseki and Ashikaga ministers propose dispatching official merchant ships—the Tenryu-ji-bune—from Hakata and Settsu to continental ports, pledging a fixed return of copper cash regardless of voyage hazards. Backing the licensed merchant consortium will invigorate sea trade and sailors at higher fleet upkeep, whereas restricting sails to monastic embassies or deputizing Kyushu maritime lords reshapes who holds Japan's sea lanes."
 oe_v250_men.7.a:0 "Back the Tenryu-ji Merchant Fleet and Regulate Hakata Shipping"
 oe_v250_men.7.b:0 "Restrict Voyages to Gozan Zen Monastery Envoys"
 oe_v250_men.7.c:0 "Empower Kyushu Maritime Clans to Guard the Straits"
 oe_v250_men.8.t:0 "The Kanno Disturbance & the Hanzei Edict"
 oe_v250_men.8.d:0 "Factional civil war within the Ashikaga house has split samurai allegiances from Kamakura to Kyoto. To rally provincial Shugo governors back to the Shogun's banner, generals urge proclaiming the Hanzei Edict—granting Shugo half the annual tax rice of aristocratic and monastic estates as war provisions. Yet court jurists warn that conceding Hanzei turns appointed governors into entrenched territorial daimyo."
 oe_v250_men.8.a:0 "Enact the Hanzei Edict to Secure Shugo-Daimyo Allegiance"
 oe_v250_men.8.b:0 "Defend Shoen Land Registers under Direct Bakufu Judges"
 oe_v250_men.9.t:0 "Kitayama Court Splendor & the Golden Pavilion"
 oe_v250_men.9.d:0 "With the rival courts reconciled in Kyoto, the Shogun's Kitayama villa—crowned by the gold-leafed Rokuon-ji pavilion—blends courtly elegance with Zen austerity, sponsoring Zeami's Noh theater, ink-wash masters, and continental embassies. Lavishing silver on Kitayama arts and diplomacy elevates scholarship and prestige at high court spending, while diverting Kyoto's commercial surplus to the direct Hokoshu guard hardens shogunal rule at urban expense."
 oe_v250_men.9.a:0 "Sponsor Kitayama Arts, Gozan Learning, and Kangō Diplomacy"
 oe_v250_men.9.b:0 "Channel Kyoto Revenues into the Shogun's Hokoshu Guard"
 oe_v250_men_ref_ita_civic_chancery:0 "Lombard-Tuscan Signoria & Civic Chancery"
 oe_v250_men_ref_ita_civic_chancery_desc:0 "Recruits humanist notaries, commercial jurists, and guild syndics into a permanent civic chancery across Lombardy and Tuscany, accelerating scholarship, craft production, and administration while relying on costly mercenary contracts over feudal levies."
 oe_v250_men_priv_ita_arti_banks:0 "Major Arti Guilds & Florin Exchange Houses"
 oe_v250_men_priv_ita_arti_banks_desc:0 "Entrusts bullion assays, silk standards, and international bills of exchange to the great banking and textile guilds, lifting overland trade and burgher literacy at the cost of dominant merchant oligarchs and lower direct burgher tax caps."
 oe_v250_men_cab_ita_catasto_survey:0 "Catasto Register & Lombard Silk Inspection"
 oe_v250_men_cab_ita_catasto_survey_desc:0 "Audits urban workshops, landholdings, and movable capital in a target province to standardize silk quality and equitable Catasto assessments, boosting local output and development while provoking patrician and noble tax protests."
 oe_v250_men_cab_ita_catasto_survey_action:0 "Catasto Register & Lombard Silk Inspection: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_ita_catasto_survey_active:0 "Catasto Register & Lombard Silk Inspection in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_men_cab_ita_catasto_survey_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_ita_catasto_survey_action_progress_wordier:0 "Catasto Register & Lombard Silk Inspection ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_ita_catasto_survey_action_progress_tooltip:0 "Audits urban workshops, landholdings, and movable capital in a target province to standardize silk quality and equitable Catasto assessments, boosting local output and development while provoking patrician and noble tax protests."
 oe_v250_men_cab_ita_catasto_survey_select_province:0 "Select a Province for Catasto & Silk Inspection"
 oe_v250_men_cab_ita_catasto_survey_no_provinces:0 "@trigger_no! No eligible provinces available for Catasto Inspection."
 oe_v250_men_dec_ita_condottieri_silk.title:0 "Charter Silk Looms & the Condotta Bureau"
 oe_v250_men_dec_ita_condottieri_silk.desc:0 "Sponsor mulberry plantations, hydraulic silk-throwing mills, and a permanent civic Condotta office to contract disciplined professional captains. Costs 110 gold; boosts craft output, discipline, and development for 25 years at heavier military payrolls and smaller citizen levies."
 oe_v250_men_dec_ita_condottieri_silk.a:0 "Charter the Silk Mills and Seal the Condotta Rolls"
 oe_v250_men_dec_ita_condottieri_silk_tt:0 "Develops #Y Milan#! or #Y Florence#! (if owned) and grants #Y Silk Looms & Condotta Bureau#! for 25 years."
 oe_v250_men.10.t:0 "The Bardi-Peruzzi Banking Shock & Civic Credit"
 oe_v250_men.10.d:0 "Sovereign defaults by northern European crowns have shattered the Bardi and Peruzzi banking titans, sending shockwaves from Florence's Mercato Nuovo to Milan's Visconti mints. Consolidating civic obligations into funded Monte Comune bonds restores fiscal reliability and urban prosperity at higher borrowing costs and merchant grumbling, while pivoting capital into Lombard armorers and silk looms or levying emergency patrician assessments each carries sharp trade-offs."
 oe_v250_men.10.a:0 "Consolidate Debt into the Monte Comune and Guard the Florin"
 oe_v250_men.10.b:0 "Redirect Credit to Lombard Armorers and Fine Silk Looms"
 oe_v250_men.10.c:0 "Shield Guild Depositors via Emergency Noble Assessments"
 oe_v250_men.11.t:0 "The Catasto Assessment & Condottieri Contracts"
 oe_v250_men.11.d:0 "Relentless Po Valley and Tuscan warfare has strained old indirect excises to breaking point, even as architects raise bold marble domes and humanist scholars fill ducal and Medici libraries. Introducing a transparent Catasto property register funds elite Condottieri companies with disciplined precision at high payroll and patrician resentment, while prioritizing Renaissance monuments and learning elevates cultural glory at the cost of martial sharpness."
 oe_v250_men.11.a:0 "Enact the Catasto Cadastre and Retain Veteran Condottieri"
 oe_v250_men.11.b:0 "Patronize Humanist Domes, Libraries, and Civic Letters"
 oe_v250_men.12.t:0 "The Peace of Lodi & the Italic Balance"
 oe_v250_men.12.d:0 "With the fall of Constantinople rattling Christendom and decades of inconclusive campaigns exhausting Milan, Florence, and Venice alike, Francesco Sforza and Cosimo de' Medici broker a bold Italian League at Lodi—backed by permanent resident ambassadors to preserve peninsula equilibrium. Embracing the Peace of Lodi delivers golden diplomatic leverage and civic prosperity while dulling siegecraft, whereas pressing for outright dominance keeps our armies razor-sharp at steep diplomatic isolation."
 oe_v250_men.12.a:0 "Sign the Peace of Lodi and Establish Resident Embassies"
 oe_v250_men.12.b:0 "Reject Parity and Press for Hegemony over Northern Italy"
 oe_v250_men_ref_swe_landslag_council:0 "Magnus Eriksson's Landslag & Riksråd"
 oe_v250_men_ref_swe_landslag_council_desc:0 "Replaces scattered provincial law codes with a unified Swedish Landslag sworn by Crown and Council alike, stabilizing the realm, raising control, and protecting freeholding peasants while curtailing unchecked royal absolutism and noble judicial privileges."
 oe_v250_men_priv_swe_bergslagen_charter:0 "Bergslagen Bergsmän Mining Charters"
 oe_v250_men_priv_swe_bergslagen_charter_desc:0 "Grants royal self-governance and timber rights to the iron- and copper-mining Bergsmän of Dalarna and Västmanland, swelling mineral extraction and workshop output at the price of wider burgher influence and lighter merchant tax caps."
 oe_v250_men_cab_swe_bergslagen_mining:0 "Bergslagen Royal Mining Assize"
 oe_v250_men_cab_swe_bergslagen_mining_desc:0 "Sends royal bailiffs and assay-masters to inspect blast furnaces, charcoal quotas, and copper shares in a target province, lifting local ore yield and development while straining royal administration and rural forest labor."
 oe_v250_men_cab_swe_bergslagen_mining_action:0 "Bergslagen Royal Mining Assize: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_men_cab_swe_bergslagen_mining_active:0 "Bergslagen Royal Mining Assize in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_men_cab_swe_bergslagen_mining_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_swe_bergslagen_mining_action_progress_wordier:0 "Bergslagen Royal Mining Assize ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_men_cab_swe_bergslagen_mining_action_progress_tooltip:0 "Sends royal bailiffs and assay-masters to inspect blast furnaces, charcoal quotas, and copper shares in a target province, lifting local ore yield and development while straining royal administration and rural forest labor."
 oe_v250_men_cab_swe_bergslagen_mining_select_province:0 "Select a Province for the Royal Mining Assize"
 oe_v250_men_cab_swe_bergslagen_mining_no_provinces:0 "@trigger_no! No eligible provinces available for the Royal Mining Assize."
 oe_v250_men_dec_swe_stora_kopparberg.title:0 "Royal Charter of Stora Kopparberg"
 oe_v250_men_dec_swe_stora_kopparberg.desc:0 "Issue King Magnus's great charter confirming shareholding miners at Falun's Stora Kopparberg copper mountain and standardizing Swedish iron shipments through Stockholm. Costs 95 gold; boosts raw ore output, production, and tax yield for 25 years at lower burgher tax caps and higher crown supervision costs."
 oe_v250_men_dec_swe_stora_kopparberg.a:0 "Seal the Stora Kopparberg Charter"
 oe_v250_men_dec_swe_stora_kopparberg_tt:0 "Develops #Y Falun#!, raises prosperity in #Y Stockholm#!, and activates the #Y Stora Kopparberg Charter#! for 25 years."
 oe_v250_men.13.t:0 "The Kopparberg Charter & Magnus Eriksson's Landslag"
 oe_v250_men.13.d:0 "Royal jurists at Örebro and Stockholm have finished drafting Sweden's first uniform national law code—the Landslag—paired with a landmark charter for the copper-mining Bergsmän of Kopparberg. Enacting the unified code binds every province under equal crown justice and supercharges mineral output at the price of magnate grumbling and court administration costs, while leaving regional lawmen untouched or seizing direct mining royalties each shifts the balance of Swedish estates."
 oe_v250_men.13.a:0 "Promulgate the Uniform Landslag and Charter the Bergsmän"
 oe_v250_men.13.b:0 "Preserve Provincial Lawmen and Magnate Judicial Rights"
 oe_v250_men.13.c:0 "Claim Direct Crown Royalties over All Copper & Iron Pits"
 oe_v250_men.14.t:0 "Stockholm's German Burghers & Baltic Iron Trade"
 oe_v250_men.14.d:0 "Wealthy Hanseatic merchants from Lübeck and Danzig command Stockholm's docks and finance nearly all Bergslagen osmund-iron shipments across the Baltic, sparking sharp friction with Swedish townsmen over seats in the Town Council. Asserting equal Swedish burgher representation and native iron staples fortifies domestic industry and crown leverage at the price of Hanseatic reprisals, while confirming Lübeck's charters keeps maritime silver flowing at heavier merchant autonomy."
 oe_v250_men.14.a:0 "Enforce Swedish Town Council Parity and Native Iron Staples"
 oe_v250_men.14.b:0 "Confirm Hanseatic Staple Privileges for Steady Baltic Credit"
 oe_v250_men.15.t:0 "Engelbrekt's Arboga Riksdag of the Four Estates"
 oe_v250_men.15.d:0 "Angered by foreign bailiffs and wartime Baltic blockades choking Bergslagen iron exports, Dalarna miners and freeholding yeomen have rallied behind Engelbrekt Engelbrektsson to convene a historic assembly at Arboga—summoning peasants and burghers alongside nobles and clergy into Sweden's first Four-Estate Riksdag. Recognizing this broad estates assembly galvanizes yeoman morale and manpower at the cost of softer royal and noble dominance, while confining rule to the magnate Riksråd secures elite administration at sharp peasant resentment."
 oe_v250_men.15.a:0 "Institutionalize the Four-Estate Riksdag and Yeoman Militia"
 oe_v250_men.15.b:0 "Confine Realm Governance to the Magnate Riksråd Council"
 oe_v250_men_ref_dan_atterdag_crown:0 "Atterdag Crown Redemption & Danehof"
 oe_v250_men_ref_dan_atterdag_crown_desc:0 "Recovers pawned royal castles and codifies Crown rights before the Danehof assembly, strengthening taxation, crown estate authority, and Nordic diplomacy while irritating magnate creditors and raising stabilization costs."
 oe_v250_men_priv_dan_skane_herring:0 "Skåne Herring Market & Sound Pilot Guilds"
 oe_v250_men_priv_dan_skane_herring_desc:0 "Confirms royal fair charters for the autumn Skåne herring salters and Øresund strait pilots, lifting sea trade and sailor reserves at the price of stronger merchant guilds, lower burgher tax caps, and extra naval patrol outlays."
 oe_v250_men_cab_dan_sound_dues:0 "Øresund Toll & Baltic Strait Watch"
 oe_v250_men_cab_dan_sound_dues_desc:0 "Stations royal customs ships off Helsingør and Copenhagen to inspect passing Baltic cogs and collect Sound Dues, enhancing tax receipts, maritime presence, and light ships while irritating foreign maritime leagues and adding fleet upkeep."
 oe_v250_men_cab_dan_sound_dues_action:0 "Øresund Toll & Baltic Strait Watch"
 oe_v250_men_cab_dan_sound_dues_active:0 "Active: Øresund Toll & Baltic Strait Watch"
 oe_v250_men_cab_dan_sound_dues_action_progress:0 "Active"
 oe_v250_men_cab_dan_sound_dues_action_progress_wordier:0 "Øresund Toll & Baltic Strait Watch (Active)"
 oe_v250_men_cab_dan_sound_dues_action_progress_tooltip:0 "Stations royal customs ships off Helsingør and Copenhagen to inspect passing Baltic cogs and collect Sound Dues, enhancing tax receipts, maritime presence, and light ships while irritating foreign maritime leagues and adding fleet upkeep."
 oe_v250_men_dec_dan_krogen_sound_dues.title:0 "Erect Krogen Castle & Levy the Sound Dues"
 oe_v250_men_dec_dan_krogen_sound_dues.desc:0 "Build the coastal fortress of Krogen at Helsingør to command the narrowest chokepoint of the Øresund and collect royal transit dues from every ship entering or leaving the Baltic. Costs 105 gold; boosts tax yield, maritime presence, and sea trade for 25 years at the cost of foreign resentment and fort upkeep."
 oe_v250_men_dec_dan_krogen_sound_dues.a:0 "Raise the Bastions of Krogen and Collect the Toll"
 oe_v250_men_dec_dan_krogen_sound_dues_tt:0 "Develops #Y Helsingør#!, raises prosperity in #Y Copenhagen#!, and establishes the #Y Krogen Sound Dues#! for 25 years."
 oe_v250_men.16.t:0 "Valdemar Atterdag & the Redemption of Denmark"
 oe_v250_men.16.d:0 "After eight years without a king and vast Danish provinces pawned to Holstein counts and creditors, Prince Valdemar IV—'Atterdag', the return of day—mounts the throne determined to redeem Zealand, Funen, and Jutland castle by castle. Selling distant Estonian holdings and driving relentless land-redemption taxes restores royal sovereignty at harsh domestic strain, while relying on Jutland noble bailouts or pledging Skåne customs reshapes the reborn kingdom's base."
 oe_v250_men.16.a:0 "Liquidize Distant Pawns and Drive Hard for Crown Redemption"
 oe_v250_men.16.b:0 "Negotiate Royal Bailouts with the Jutland Nobility"
 oe_v250_men.16.c:0 "Pledge Skåne Herring Customs to Re-Arm Royal Castles"
 oe_v250_men.17.t:0 "The Skåne Herring Market & Hanseatic Strife"
 oe_v250_men.17.d:0 "Every autumn, thousands of vessels crowd Skanör, Falsterbo, and Malmö for Europe's richest herring fishery—and Denmark's renewed mastery of Skåne and Gotland has provoked Lübeck and the Confederation of Cologne into open maritime contest. Defying the Hanseatic embargo with heavy royal warships asserts Baltic sovereignty at steep naval upkeep and diplomatic hostility, whereas negotiating a Stralsund compromise reopens lucrative silver and salt flows at clear fiscal and prestige concessions."
 oe_v250_men.17.a:0 "Defy the Hanseatic League and Fortify the Øresund Strait"
 oe_v250_men.17.b:0 "Broker a Stralsund Compromise to Restore Baltic Silver Flows"
 oe_v250_men.18.t:0 "Queen Margaret I & the Kalmar Union Compact"
 oe_v250_men.18.d:0 "Through tireless statecraft across Roskilde, Oslo, and Stockholm, Queen Margaret I has assembled the prelates and magnates of the North at Kalmar to crown a single monarch for Denmark, Norway, and Sweden. Steering the Union through conciliatory council diplomacy secures enduring vassal fidelity and diplomatic reach at lighter crown authority, whereas centralizing Nordic revenues around Copenhagen and the Sound Dues fills Denmark's coffers at the risk of restless northern subjects."
 oe_v250_men.18.a:0 "Uphold the Kalmar Union via Conciliatory Council Diplomacy"
 oe_v250_men.18.b:0 "Centralize Nordic Revenues Around Copenhagen & the Sound"
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_mam_alexandria_guard:0 "Alexandria & Damietta Sea Guard"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_mam_alexandria_guard:0 "Fortified Delta harbors and permanent galley patrols shield Egypt and the Levant from maritime raids at heavy naval and garrison expense."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev1_citadel_diwan:0 "Citadel Household Ascendancy"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev1_citadel_diwan:0 "Direct royal Mamluk stewardship sharpens army discipline and crown authority while straining field pay and angering entrenched emirs."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev1_bahri_compact:0 "Bahri Emir Iqta Compact"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev1_bahri_compact:0 "Conciliating the senior commanders boosts battlefield morale and aristocratic loyalty while enlarging noble clout and trimming treasury collection."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev1_ulama_mediation:0 "Cairo Qadi Regency Accord"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev1_ulama_mediation:0 "Legal legitimacy from al-Azhar and the chief qadis eases domestic stabilization while elevating clerical power and softening cavalry drills."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev2_spice_monopoly:0 "Sultanic Spice Monopoly & Coast Guard"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev2_spice_monopoly:0 "State spice requisitioning finances Levant galley patrols and higher tax receipts while alienating Karimi merchants and European trading partners."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev2_karimi_convoys:0 "Karimi Red Sea Convoys"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev2_karimi_convoys:0 "Free-flowing spice partnerships across Jeddah and Alexandria boost maritime trade and domestic prosperity while reducing crown leverage and burgher taxation."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev3_burji_barracks:0 "Burji Circassian Citadel Order"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev3_burji_barracks:0 "Meritocratic Circassian barracks produce formidable heavy horsemen and deeper reserves, offset by succession friction and higher military expenses."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev3_syrian_conciliation:0 "Cairo Madrasahs & Syrian Accord"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev3_syrian_conciliation:0 "Scholarly patronage and generous viceregal charters advance research and diplomatic stature while softening crown power and martial zeal."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_dlh_yamuna_canals:0 "Yamuna & Sutlej Irrigation Canals"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_dlh_yamuna_canals:0 "Sultanic irrigation canals turn parched Doab tracts into dependable double-cropped farmland, demanding steady administrative expenditure and tax concessions."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev4_sondhar_loans:0 "Diwan-i-Amir-i-Kohi Sondhar Relief"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev4_sondhar_loans:0 "State-backed agricultural advances restore Doab irrigation and crop rotation at heavy court outlay and softer short-term tax collection."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev4_strict_iqta_audit:0 "Strict Tughluq Iqta Audits"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev4_strict_iqta_audit:0 "Unsparing fiscal audits boost crown authority and tax receipts while stirring resentment among both villagers and provincial amirs."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev4_doab_remission:0 "Doab Tax Remission & Village Granaries"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev4_doab_remission:0 "Generous rural tax relief calms the Gangetic countryside and lowers stability outlays at the price of reduced fiscal intake and weaker central grip."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev5_firuz_karkhanas:0 "Firuzian Karkhanas & Hereditary Iqtas"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev5_firuz_karkhanas:0 "Thriving royal ateliers and assured noble tenures lift craft output and aristocratic loyalty while weakening central power and martial rigor."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev5_cash_stipend_army:0 "Delhi Standing Cash-Pay Garrisons"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev5_cash_stipend_army:0 "Paying troops directly from Delhi sharpens discipline and fortress defense while imposing heavy military upkeep and frustrating provincial amirs."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev6_indus_fort_line:0 "Indus–Panipat Granary Fortifications"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev6_indus_fort_line:0 "Reinforced Punjab citadels and siege magazines harden frontier defense and siegecraft while weighing heavily on fort maintenance and taxation."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev6_frontier_auxiliaries:0 "Afghan & Rajput Frontier Auxiliaries"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev6_frontier_auxiliaries:0 "Hardened frontier clans swell Delhi's morale and manpower reserves while increasing aristocratic political weight and internal friction."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_jap_tenryuji_fleet:0 "Tenryu-ji & Kangō Tally Voyages"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_jap_tenryuji_fleet:0 "Regulated tally voyages enrich Kyoto's temples and ports with continental coin and learning while demanding escort upkeep and chafing provincial warriors."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev7_tenryuji_commerce:0 "Tenryu-ji Licensed Sea Trade"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev7_tenryuji_commerce:0 "Official trading voyages from Hakata expand sea commerce and maritime manpower at the cost of escort upkeep and grumbling inland lords."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev7_gozan_envoys:0 "Gozan Zen Monastic Diplomacy"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev7_gozan_envoys:0 "Entrusting overseas intercourse to Gozan Zen scholars elevates cultural reach and clerical satisfaction while curbing commercial volume and enlarging monastic clout."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev7_kyushu_sea_lords:0 "Autonomous Kyushu Sea Patrols"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev7_kyushu_sea_lords:0 "Relying on coastal clans strengthens light-ship flotillas and maritime presence while eroding shogunal control and alarming Korean neighbors."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev8_hanzei_edict:0 "Hanzei Provincial Military Provisions"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev8_hanzei_edict:0 "Sharing estate rents with Shugo governors lifts samurai morale and manpower mobilization while expanding noble autonomy and cutting direct treasury tax."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev8_bakufu_judges:0 "Bakufu Shoen Judicial Oversight"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev8_bakufu_judges:0 "Resisting Hanzei encroachments protects central taxation and provincial control at the cost of resentful Shugo lords and stiffer stability outlays."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev9_kitayama_culture:0 "Kitayama Court & Cultural Flourishing"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev9_kitayama_culture:0 "Patronage of Noh drama, Zen scholarship, and continental embassies boosts cultural tradition, research, and diplomacy at steep court expenses."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev9_hokoshu_guard:0 "Direct Shogunal Hokoshu Guard"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev9_hokoshu_guard:0 "Funding a loyal household guard sharpens battlefield discipline and crown power while raising military payrolls and taxing Kyoto's burghers."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_ita_condottieri_silk:0 "Silk Looms & Permanent Condotta Bureau"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_ita_condottieri_silk:0 "Hydraulic silk mills finance vetted Condottieri companies across northern Italy, elevating industry and discipline while straining army budgets and citizen levies."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev10_monte_comune:0 "Monte Comune & Sound Florin"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev10_monte_comune:0 "Funded municipal debt and unalloyed coinage stabilize state taxation and urban recovery at the price of steeper interest service and taxed burghers."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev10_lombard_workshops:0 "Lombard Armor & Silk Syndicates"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev10_lombard_workshops:0 "Backing master armorers and weavers boosts industrial output and heavy infantry equipment while trimming short-term fiscal intake and noble rents."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev10_guild_bailout:0 "Civic Guild Credit Guarantee"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev10_guild_bailout:0 "Protecting urban depositors wins merchant gratitude and commercial repute abroad while antagonizing landed aristocrats and softening sovereign leverage."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev11_catasto_condotta:0 "Catasto Tax & Veteran Condotta"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev11_catasto_condotta:0 "Comprehensive wealth registries fund seasoned mercenary captains, raising tax efficiency and discipline at steep military upkeep and merchant discontent."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev11_renaissance_patronage:0 "Lombard-Tuscan Civic Humanism"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev11_renaissance_patronage:0 "Sponsoring architects, translators, and painters accelerates research, cultural tradition, and urban growth while straining military budgets and field morale."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev12_peace_of_lodi:0 "Peace of Lodi & Resident Embassies"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev12_peace_of_lodi:0 "Peninsula-wide diplomatic equilibrium accelerates envoy capacity, reputation, and urban prosperity while allowing siege habits and martial tradition to soften."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev12_italic_hegemony:0 "Lombard-Tuscan Hegemonic Drive"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev12_italic_hegemony:0 "Keeping seasoned siege trains and mercenary spears mobilized boosts combat tempo while alarming Italian peers and draining military budgets."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_swe_stora_kopparberg:0 "Royal Charter of Stora Kopparberg"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_swe_stora_kopparberg:0 "Structured shareholding at Falun's copper mountain turns Swedish metallurgy into a northern fiscal pillar, balanced by merchant exemptions and inspection costs."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev13_landslag_mining:0 "Landslag & Bergsmän Charters"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev13_landslag_mining:0 "Unified Swedish statute law and chartered copper shafts enhance stability, ore extraction, and control while displeasing regional magnates and costing chancery upkeep."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev13_provincial_lawmen:0 "Provincial Lawmen Autonomy"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev13_provincial_lawmen:0 "Respecting regional law-speakers keeps noble families content and regional levies ready at the expense of softer crown power and provincial control."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev13_crown_ore_royalties:0 "Crown Bergslagen Royalties"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev13_crown_ore_royalties:0 "Strict royal ore exactions fill Stockholm's treasury and bolster crown authority while angering both mining burghers and charcoal-burning peasants."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev14_native_iron_staple:0 "Swedish Iron Staple & Town Parity"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev14_native_iron_staple:0 "Curbing foreign merchant monopolies elevates domestic ironworking and royal authority while irritating Hanseatic ports and cooling Baltic sea trade."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev14_hanseatic_credit:0 "Hanseatic Baltic Iron Compact"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev14_hanseatic_credit:0 "Honoring Lübeck's port charters boosts maritime commerce and urban prosperity while expanding burgher political clout and capping merchant taxes."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev15_arboga_riksdag:0 "Arboga Four-Estate Riksdag"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev15_arboga_riksdag:0 "Giving freeholding miners and peasants a permanent voice in the Riksdag lifts battlefield morale, manpower, and rural loyalty while constraining crown power and noble primacy."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev15_magnate_riksrad:0 "Magnate Riksråd Oligarchy"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev15_magnate_riksrad:0 "Relying on experienced aristocratic councillors strengthens cabinet competence and noble loyalty at the expense of angry yeomen and swollen noble power."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_dec_dan_krogen_sound_dues:0 "Krogen Castle & Øresund Sound Dues"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_dec_dan_krogen_sound_dues:0 "Coastal guns at Helsingør turn the Baltic narrows into a premier royal revenue gate, offset by diplomatic friction with trading leagues and garrison upkeep."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev16_atterdag_redemption:0 "Atterdag Crown Land Redemption"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev16_atterdag_redemption:0 "Relentless royal recovery restores Danish taxation, crown power, and provincial control while squeezing both peasants and proud magnates."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev16_jutland_bailout:0 "Jutland Noble Redemption Compact"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev16_jutland_bailout:0 "Co-funding redemption with provincial magnates calms the realm and secures aristocratic loyalty at the price of enlarged noble power and leaner taxes."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev16_castle_rearmament:0 "Danish Royal Castle Rearmament"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev16_castle_rearmament:0 "Prioritizing castle garrisons lifts homeland defense and soldier morale while mortgaging merchant tax ceilings and souring foreign courts."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev17_defy_hansa:0 "Danish Baltic Naval Defiance"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev17_defy_hansa:0 "Commissioning royal warships boosts heavy-ship combat and maritime presence while draining naval budgets and isolating Denmark diplomatically."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev17_stralsund_accord:0 "Stralsund Commercial Compromise"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev17_stralsund_accord:0 "Restoring Hanseatic trading liberties revives sea commerce, diplomatic standing, and Skåne prosperity while surrendering customs share and court prestige."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev18_kalmar_diplomacy:0 "Kalmar Union Conciliatory Compact"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev18_kalmar_diplomacy:0 "Honoring separate Norwegian and Swedish councils bolsters Nordic reputation, subject loyalty, and diplomatic capacity at the price of softer crown centralization and court outlays."
 STATIC_MODIFIER_NAME_oe_v250_men_mod_ev18_copenhagen_centralism:0 "Copenhagen Sound Centralization"
 STATIC_MODIFIER_DESC_oe_v250_men_mod_ev18_copenhagen_centralism:0 "Concentrating bailiffs and customs administration in Copenhagen elevates Danish taxation and crown power while straining northern vassal loyalty and diplomatic warmth."
