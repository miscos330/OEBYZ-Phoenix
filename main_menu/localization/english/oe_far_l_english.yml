l_english:
 oe_far_factoria: "Roman Overseas Factoria"
 oe_far_factoria_desc: "An imperial trading house chartered in an Indian Ocean or Atlantic treaty port. Requires port-owner admission and peaceful relations; closes automatically if war breaks out or the charter is revoked."
 oe_far_factoria_upkeep: "Overseas Factoria Books & Quays"
 oe_far_exarch_seat: "Overseas Exarchate Seat"
 oe_far_exarch_seat_desc: "An imperial headquarters directing overseas exarchates, convoy schedules, and distant customs. Eases metropolitan administrative strain while strengthening local magnates and overseas autonomy."
 oe_far_exarch_seat_upkeep: "Exarchate Chancery & Upkeep"
 OE_FAR_HESPERIA_NAME: "Exarchate of Hesperia"
 OE_FAR_HESPERIA_ADJ: "Hesperian"
 OE_FAR_TAPROBANE_NAME: "Exarchate of Taprobane"
 OE_FAR_TAPROBANE_ADJ: "Taprobanian"
 oe_far_trade_tribute: "$oe_far_exarchate_trade$ Symbolic Tribute"
 oe_far_exarchate_trade: "Commercial Exarchate"
 oe_far_exarchate_trade_desc: "A chartered building-based Commercial Exarchate administering Roman overseas factorias across Indian Ocean treaty ports. It stays out of wars and vanilla independence movements, pays a symbolic engine tribute alongside an annual script-calculated trade dividend, and may be recalled and safely annexed by imperial decree."
 LEAD_oe_far_exarchate_trade: "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_far_exarchate_trade: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_far_exarchate_trade_subject_opinion: "Imperial Overlord"
 oe_far_exarchate_trade_overlord_opinion: "Commercial Exarchate"
 oe_far_exarchate: "Overseas Exarchate"
 oe_far_exarchate_desc: "A territorial Overseas Exarchate invested across the New World or distant shores under imperial monarchy. It shares exploration and merchant power with Constantinople, pays colonial tribute while halving western administrative strain, and is recalled only by imperial centralization decree."
 LEAD_oe_far_exarchate: "$LIST$ is an [SUBJECT_TYPE.GetName]"
 AM_oe_far_exarchate: "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_far_exarchate_subject_opinion: "Imperial Overlord"
 oe_far_exarchate_overlord_opinion: "Overseas Exarchate"
 oe_far_b_port_charter: "Overseas Factoria Charter"
 oe_far_b_port_pressure: "Pressured Port Concession"
 oe_far_b_mamluk_demo: "Alexandrian Naval Demonstration"
 oe_far_b_tordesillas_defied: "Defied the Treaty of Tordesillas"
 oe_far_b_tordesillas_pact: "Atlantic Sea-Lane Accord"
 oe_far_b_privateer_raid: "Licensed Overseas Privateering"
 oe_far_b_enclave_lease: "Twenty-Five-Year Enclave Port Lease"
 oe_far_b_zaytun_rendezvous: "Malacca-Zaytun Twin-Phoenix Sea Pact"
 STATIC_MODIFIER_NAME_oe_far_east_tier_1: "Eastern Spice Ledger: First Foothold"
 STATIC_MODIFIER_DESC_oe_far_east_tier_1: "A first foothold on the Red Sea or Indian Ocean lanes yields steady spice profits while raising naval and garrison upkeep."
 STATIC_MODIFIER_NAME_oe_far_east_tier_2: "Eastern Spice Ledger: Monsoon Network"
 STATIC_MODIFIER_DESC_oe_far_east_tier_2: "Monsoon stations linking the Red Sea, Gulf, and Malabar double eastern trade returns at steep naval and fort maintenance cost."
 STATIC_MODIFIER_NAME_oe_far_east_tier_3: "Eastern Spice Ledger: Ocean Dominance"
 STATIC_MODIFIER_DESC_oe_far_east_tier_3: "A vast network from Suez through Taprobane to Malacca commands eastern commerce, driving heavy upkeep and creeping inflation."
 STATIC_MODIFIER_NAME_oe_far_west_tier_1: "Western Ocean Ledger: Beyond the Pillars"
 STATIC_MODIFIER_DESC_oe_far_west_tier_1: "A first Atlantic staging point extends imperial colonial reach while lifting naval and fort maintenance outlays."
 STATIC_MODIFIER_NAME_oe_far_west_tier_2: "Western Ocean Ledger: Atlantic Relays"
 STATIC_MODIFIER_DESC_oe_far_west_tier_2: "Macaronesian relays secure Atlantic return winds and trade throughput at rising escort and fortress costs."
 STATIC_MODIFIER_NAME_oe_far_west_tier_3: "Western Ocean Ledger: Transatlantic Reach"
 STATIC_MODIFIER_DESC_oe_far_west_tier_3: "Transatlantic convoys linking Iberia, Macaronesia, and the New World bring rich revenues alongside heavy upkeep and bullion inflation."
 STATIC_MODIFIER_NAME_oe_far_auto_withhold: "Overseas Tax Withholding"
 STATIC_MODIFIER_DESC_oe_far_auto_withhold: "Runaway overseas autonomy lets distant exarchs and factors skim customs receipts under pretext of local defense, eroding crown revenue."
 STATIC_MODIFIER_NAME_oe_far_audit_cool: "Overseas Accounts Audit"
 STATIC_MODIFIER_DESC_oe_far_audit_cool: "Imperial auditors inspect overseas ledgers and curb private skimming, restoring crown power while briefly chilling trade and burghers."
 STATIC_MODIFIER_NAME_oe_far_recall_turmoil: "Overseas Exarchate Recall Turmoil"
 STATIC_MODIFIER_DESC_oe_far_recall_turmoil: "Revoking overseas exarch charters and re-centralizing ports disrupts convoys and provokes local resistance across a decade of retrenchment."
 STATIC_MODIFIER_NAME_oe_far_red_escort: "Imperial Red Sea Escort Squadron"
 STATIC_MODIFIER_DESC_oe_far_red_escort: "Royal squadrons based along Suez and Aden safeguard spice convoys and maritime presence at a steep naval upkeep price."
 STATIC_MODIFIER_NAME_oe_far_mamluk_tolls: "Heavy Red Sea Customs Accord"
 STATIC_MODIFIER_DESC_oe_far_mamluk_tolls: "Accepting steeper transit tolls in Egypt preserves factoria charters and diplomacy at a lasting cut to trade earnings."
 STATIC_MODIFIER_NAME_oe_far_persian_detour: "Persian Gulf Spice Detour"
 STATIC_MODIFIER_DESC_oe_far_persian_detour: "Routing Indian Ocean cargoes through Hormuz and Muscat bypasses Red Sea tolls, boosting merchant capacity at higher naval cost."
 STATIC_MODIFIER_NAME_oe_far_socotra_mission: "Socotra Eastern Christian Waystation"
 STATIC_MODIFIER_DESC_oe_far_socotra_mission: "Endowing Hadibu's ancient Eastern Christian parishes and careening yards wins clerical support and goodwill at steady fiscal cost."
 STATIC_MODIFIER_NAME_oe_far_taprobane_charter: "Charter of the Exarch of Taprobane"
 STATIC_MODIFIER_DESC_oe_far_taprobane_charter: "Empowering the Taprobane Exarchate coordinates Malabar and Ceylon commerce while trimming direct crown power and diplomatic capacity."
 STATIC_MODIFIER_NAME_oe_far_direct_warehouses: "Crown-Managed Indian Ocean Warehouses"
 STATIC_MODIFIER_DESC_oe_far_direct_warehouses: "Direct metropolitan oversight avoids autonomous exarchs but strains stability outlays and distant garrison upkeep."
 STATIC_MODIFIER_NAME_oe_far_twin_phoenix_sea: "Twin-Phoenix Maritime Silk Nexus"
 STATIC_MODIFIER_DESC_oe_far_twin_phoenix_sea: "Linking Malacca with Zaytun unleashes historic spice-and-silk flows, elevating trade revenue alongside escort costs and inflation."
 STATIC_MODIFIER_NAME_oe_far_malacca_customs: "Unilateral Malacca Strait Customs"
 STATIC_MODIFIER_DESC_oe_far_malacca_customs: "Enforcing unilateral strait duties boosts tax efficiency and maritime reach while alienating regional courts."
 STATIC_MODIFIER_NAME_oe_far_atlantic_expedition: "Imperial Atlantic Exploration Fleet"
 STATIC_MODIFIER_DESC_oe_far_atlantic_expedition: "Commissioning ocean-going caravels and master pilots accelerates Atlantic discovery and reach at steep naval upkeep."
 STATIC_MODIFIER_NAME_oe_far_iberian_passage: "Iberian Transit & Pilotage Charter"
 STATIC_MODIFIER_DESC_oe_far_iberian_passage: "Leasing Iberian portage lowers upfront risk and keeps courts cordial while trimming trade margins and exploration pace."
 STATIC_MODIFIER_NAME_oe_far_island_shipyards: "Macaronesian Shipyards & Sugar Estates"
 STATIC_MODIFIER_DESC_oe_far_island_shipyards: "Island careening yards and sugar plantations speed shipbuilding and colonial reach while pressuring peasants and domestic taxes."
 STATIC_MODIFIER_NAME_oe_far_mare_liberum: "Proclamation of Mare Liberum"
 STATIC_MODIFIER_DESC_oe_far_mare_liberum: "Invoking Justinian's Digest to defy the papal meridian energizes colonial growth and trade while provoking Catholic maritime rivals."
 STATIC_MODIFIER_NAME_oe_far_atlantic_truce: "Secret Atlantic Sea-Lane Accord"
 STATIC_MODIFIER_DESC_oe_far_atlantic_truce: "Buying a ten-year maritime accommodation steadies diplomacy and order at the expense of prestige and fleet morale."
 STATIC_MODIFIER_NAME_oe_far_hesperia_exarch: "Charter of the Exarchate of Hesperia"
 STATIC_MODIFIER_DESC_oe_far_hesperia_exarch: "Investing New World holdings as the Exarchate of Hesperia boosts tariffs, settlement, and subject loyalty at slight crown-power cost."
 STATIC_MODIFIER_NAME_oe_far_crown_west_provinces: "Crown-Direct Western Provinces"
 STATIC_MODIFIER_DESC_oe_far_crown_west_provinces: "Taxing transatlantic holdings directly from Constantinople swells short-term receipts while dragging down control and stability."
 STATIC_MODIFIER_NAME_oe_far_new_world_crops: "New World Crops in the Heartland"
 STATIC_MODIFIER_DESC_oe_far_new_world_crops: "Introducing maize and potatoes across Anatolia and Thrace lifts population capacity and prosperity at a temporary fiscal adjustment cost."
 STATIC_MODIFIER_NAME_oe_far_silver_arbitrage: "Two-Ocean Silver & Spice Arbitrage"
 STATIC_MODIFIER_DESC_oe_far_silver_arbitrage: "Channeling American silver into eastern spices and silk yields huge trade gains while fueling bullion inflation and rivalry."
 STATIC_MODIFIER_NAME_oe_far_bullion_discipline: "Strict Bullion & Coinage Discipline"
 STATIC_MODIFIER_DESC_oe_far_bullion_discipline: "Strict mint controls on New World bullion curb inflation and steady the realm while slowing commercial expansion."
 STATIC_MODIFIER_NAME_oe_far_antoniniana_edict: "Constitutio Antoniniana II"
 STATIC_MODIFIER_DESC_oe_far_antoniniana_edict: "Extending Roman citizenship and Senate representation overseas calms colonial subjects while angering metropolitan nobles and trimming tax efficiency."
 STATIC_MODIFIER_NAME_oe_far_caesar_federation: "Federated Overseas Caesars Compact"
 STATIC_MODIFIER_DESC_oe_far_caesar_federation: "Autonomous overseas Caesars preserve maritime trade and peace at the cost of sharply reduced tariffs and weaker crown authority."
 STATIC_MODIFIER_NAME_oe_far_iron_expedition: "Ironclad Expeditionary Centralization"
 STATIC_MODIFIER_DESC_oe_far_iron_expedition: "Dispatching expeditionary fleets defends full tariff receipts and naval morale while inflating military upkeep and fueling unrest."
 STATIC_MODIFIER_NAME_oe_far_port_lease_hub: "Roman Chartered Enclave Port"
 STATIC_MODIFIER_DESC_oe_far_port_lease_hub: "A leased overseas enclave administered under imperial charter, boosting trade power and maritime presence amid lingering local friction."
 oe_far_dec_envoy_east.title: "Dispatch Envoy to Eastern Ports"
 oe_far_dec_envoy_east.desc: "Send envoys to one of the twelve eastern corridor ports to charter a Roman factoria, press concessions through power projection, or propose a 25-year enclave lease on a ten-year factoria (human owners always choose freely). Costs drop 25% when Trajan's Canal is open."
 oe_far_dec_envoy_east.a: "Diplomatic Charter (1.5 months' income)"
 oe_far_dec_envoy_east.b: "Press Concessions (half gold, −25 opinion, PP ≥ 30)"
 oe_far_dec_envoy_east.c: "Propose 25-Year Enclave Lease (10-year factoria)"
 oe_far_dec_envoy_west.title: "Charter Western Atlantic Waystations"
 oe_far_dec_envoy_west.desc: "Negotiate waystations across the eight Gibraltar and Macaronesian ports or propose a 25-year enclave lease on a ten-year western factoria (human owners always choose freely). Requires the western corridor and colonization capability."
 oe_far_dec_envoy_west.a: "Charter Atlantic Waystation (1.5 months' income)"
 oe_far_dec_envoy_west.b: "Fund Transatlantic Expedition (1 month's income)"
 oe_far_dec_envoy_west.c: "Propose 25-Year Western Enclave Lease"
 oe_far_dec_audit_exarchs.title: "Audit Overseas Exarchs & Company Books"
 oe_far_dec_audit_exarchs.desc: "Send imperial auditors to inspect eastern and western ledgers, cutting overseas autonomy (−15) and Roman Company autonomy (−8) at a cost in prestige, gold, and a 3-year trade chill."
 oe_far_dec_audit_exarchs.a: "Dispatch Imperial Overseas Auditors"
 oe_far_dec_recall_exarch.title: "Recall & Centralize Overseas Exarchate"
 oe_far_dec_recall_exarch.desc: "Revoke overseas exarchate charters, reclaim all eastern foreign factorias, safely annex Commercial and Overseas Exarchate subjects with zero leftover entities, and dismantle exarch seats. Ends runaway autonomy at the cost of a decade of turmoil and +6 imperial strain."
 oe_far_dec_recall_exarch.a: "Revoke Exarchates & Restore Direct Rule"
 oe_far.1.t: "Beyond the Inner Seas"
 oe_far.1.d: "With the Roman Company anchored across the Mediterranean and Black Sea, charts and cargoes from beyond Suez and the Pillars of Herakles stir the Senate and shipowners alike. The council must decide whether to focus eastward, launch a costly two-ocean charter, or hold to the inner seas."
 oe_far.1.a: "Focus East: Charter the Red Sea and Indian Ocean corridor"
 oe_far.1.a.tt: "Opens the 12-port eastern corridor and envoy decisions; costs #R 1#! month's income and adds #R +2#! imperial strain."
 oe_far.1.b: "Two-Ocean Charter: Open eastern and western corridors together"
 oe_far.1.b.tt: "Opens both corridors at once; costs #R 2.5#! months' income and adds #R +5#! imperial strain."
 oe_far.1.c: "Hold to the Mediterranean and revisit in ten years"
 oe_far.1.c.tt: "Defers the overseas charter for 10 years and grants #G +3#! stability."
 oe_far.2.t: "Keys of Suez and Aden"
 oe_far.2.d: "As work along Suez advances and our first Red Sea factoria opens, the pepper route past Jeddah, Massawa, and Aden beckons Roman keels. Yet the Bab el-Mandeb is treacherous and contested, forcing a choice between royal squadrons and Company brokerage."
 oe_far.2.a: "Establish a Royal Red Sea Escort Squadron"
 oe_far.2.a.tt: "Costs #R 1#! month's income; grants #G +5#! navy tradition and [ShowModifier('oe_far_red_escort')] (#Y 25#! years, higher naval upkeep). If Trajan's Canal is open, grants prestige and opens an Aden post."
 oe_far.2.b: "Entrust Red Sea convoys to the Roman Company"
 oe_far.2.b.tt: "Spares upfront naval outlays and grants [ShowModifier('oe_far_persian_detour')] (#Y 15#! years), but raises Company autonomy #R +12#! and overseas autonomy #R +8#!."
 oe_far.3.t: "The Mamluk Spice Monopoly"
 oe_far.3.d: "Cairo has abruptly hiked transit duties on pepper at Suez and Aden, detaining Roman cargoes under a royal monopoly. Merchants press the palace: accept steeper Red Sea tolls, detour via Hormuz and Muscat, or stage a naval show of force off Alexandria?"
 oe_far.3.a: "Renegotiate Red Sea tolls to keep the posts open"
 oe_far.3.a.tt: "Grants [ShowModifier('oe_far_mamluk_tolls')] (#Y 10#! years, lower trade income for diplomatic calm) and improves Mamluk opinion."
 oe_far.3.b: "Detour via the Persian Gulf through Hormuz and Muscat"
 oe_far.3.b.tt: "Costs #R 1.5#! months' income; grants [ShowModifier('oe_far_persian_detour')] (#Y 20#! years) and opens Hormuz and Muscat factorias."
 oe_far.3.c: "Stage a naval demonstration off Alexandria"
 oe_far.3.c.tt: "Requires at least 25 ships; grants #G +10#! prestige and #G +5#! navy tradition, but Mamluk opinion #R −40#!."
 oe_far.4.t: "Socotra and the Malabar Landfall"
 oe_far.4.d: "Riding the southwest monsoon, our first ocean squadron calls at Hadibu's ancient Eastern Christian port on Socotra before crossing the Arabian Sea to Kozhikode and Goa. Malabar princes greet envoys of the Roman Emperor with cautious curiosity."
 oe_far.4.a: "Seal the Kozhikode commercial charter for Malabar"
 oe_far.4.a.tt: "Costs #R 1#! month's income; establishes a Kozhikode factoria and grants #G +5#! navy tradition."
 oe_far.4.b: "Endow Socotra's Eastern Christian careening station"
 oe_far.4.b.tt: "Costs #R 1#! month's income; opens a Hadibu station and grants [ShowModifier('oe_far_socotra_mission')] (#Y 25#! years, clerical goodwill at modest fiscal cost)."
 oe_far.5.t: "Investiture of the Exarch of Taprobane"
 oe_far.5.d: "Ancient Greek geographers called Ceylon Taprobane; now imperial posts span Khambat, Goa, Kozhikode, and Kotte. Monsoon distances defy direct orders from Constantinople, prompting debate over investing a dedicated Exarchate of Taprobane."
 oe_far.5.a: "Invest the Exarchate of Taprobane and Malabar"
 oe_far.5.a.tt: "Creates the Exarchate of Taprobane as a building-based Commercial Exarchate subject, transfers eastern foreign factorias to it, and remits an annual script-calculated trade dividend to the treasury (never draining a low-treasury subject); halves annual eastern strain, grants [ShowModifier('oe_far_taprobane_charter')] (#Y 40#! years), sets overseas autonomy floor to #Y 25#!, and adds #R +4#! strain."
 oe_far.5.b: "Keep crown-managed warehouses under Constantinople"
 oe_far.5.b.tt: "Avoids autonomous exarchs and grants [ShowModifier('oe_far_direct_warehouses')] (#Y 30#! years), but adds #R +7#! imperial strain."
 oe_far.6.t: "Malacca and the Zaytun Rendezvous"
 oe_far.6.d: "Imperial sails have reached the Strait of Malacca. Across the South China Sea, great junks from Zaytun and Guangzhou ride the monsoon—for the first time in history, the empires of Constantinople and the East meet directly on the open ocean."
 oe_far.6.a: "Send envoys to Zaytun to seal the Twin-Phoenix Sea Pact"
 oe_far.6.a.tt: "Seals the Twin-Phoenix Sea Pact: grants [ShowModifier('oe_far_twin_phoenix_sea')] (#Y 20#! years, rich trade with inflation and naval upkeep), #G +12#! prestige, and #G +25#! Silk Road sea score; shared with Great Yuan if extant."
 oe_far.6.b: "Levy unilateral imperial customs at Malacca"
 oe_far.6.b.tt: "Grants [ShowModifier('oe_far_malacca_customs')] (#Y 20#! years) and #G +5#! navy tradition, but cools diplomacy with eastern powers."
 oe_far.7.t: "Beyond the Pillars of Herakles"
 oe_far.7.d: "Imperial resurgence now reaches the western gates of the Mediterranean. From Ceuta and Gibraltar, mariners gaze out upon the Atlantic and petition the throne to sail past the Pillars of Herakles toward the Isles of the Blessed and lands beyond."
 oe_far.7.a: "Commission an Imperial Atlantic Exploration Fleet"
 oe_far.7.a.tt: "Opens the 8-port western corridor; costs #R 2#! months' income, granting #G +8#! navy tradition and [ShowModifier('oe_far_atlantic_expedition')] (#Y 25#! years, higher naval upkeep)."
 oe_far.7.b: "Lease Iberian waystations for a cautious western venture"
 oe_far.7.b.tt: "Opens the western corridor at lower outlay (#R 1#! month's income), granting [ShowModifier('oe_far_iberian_passage')] (#Y 20#! years)."
 oe_far.8.t: "Isles of the Blessed"
 oe_far.8.d: "Imperial caravels have reached Ptolemy's Isles of the Blessed—Funchal, Ponta Delgada, Aguere, and Santiago command the Atlantic trade winds. Any lasting transatlantic venture depends on turning these islands into careening relays."
 oe_far.8.a: "Develop Imperial Atlantic shipyards and sugar estates"
 oe_far.8.a.tt: "Costs #R 1#! month's income; opens Funchal relay and grants [ShowModifier('oe_far_island_shipyards')] (#Y 25#! years, faster shipbuilding at peasant and fiscal cost)."
 oe_far.8.b: "Contract the Roman Company to build Atlantic relays"
 oe_far.8.b.tt: "Spares treasury outlays and opens an Aguere relay, raising Company autonomy #R +10#! and overseas autonomy #R +8#!."
 oe_far.9.t: "Defying the Meridian of Tordesillas"
 oe_far.9.d: "The Latin papacy has presumed to partition the ocean world between Iberian Catholic crowns. Jurists in Constantinople cite Justinian's Digest—that the sea is common to all—while diplomats weigh the cost of provoking Atlantic rivals."
 oe_far.9.a: "Proclaim Mare Liberum under Roman law"
 oe_far.9.a.tt: "Grants #G +10#! prestige and [ShowModifier('oe_far_mare_liberum')] (#Y 30#! years, boosting colonization and trade), but Catholic Iberian opinion #R −45#!."
 oe_far.9.b: "Negotiate a quiet Atlantic sea-lane accord"
 oe_far.9.b.tt: "Costs #R 1.5#! months' income and #R −5#! prestige; grants [ShowModifier('oe_far_atlantic_truce')] (#Y 10#! years) and eases Iberian tensions."
 oe_far.10.t: "Exarchate of Hesperia (Nova Roma)"
 oe_far.10.d: "The purple banner and double-headed eagle now fly along New World shores. Invoking the ancient Greek name Hesperia for the western horizon, the Senate asks whether to invest a chartered Exarchate or tax the western provinces directly."
 oe_far.10.a: "Invest the Exarchate of Hesperia"
 oe_far.10.a.tt: "Invests the Exarchate of Hesperia (promoting an American colonial subject to an Overseas Exarchate or chartering one from owned New World territory, with an Exarch seat), halving western annual strain and granting [ShowModifier('oe_far_hesperia_exarch')] (#Y 40#! years)."
 oe_far.10.b: "Rule the western provinces directly from the palace"
 oe_far.10.b.tt: "Grants [ShowModifier('oe_far_crown_west_provinces')] (#Y 30#! years, higher taxes at heavy control and stability cost) and adds #R +8#! imperial strain."
 oe_far.11.t: "The Two-Ocean Exchange"
 oe_far.11.d: "As the Columbian Exchange reshapes both hemispheres, maize, potatoes, and American silver pour into imperial ports. Ministers propose three paths: plant New World crops across the heartland, arbitrage silver for eastern spices, or enforce strict bullion discipline."
 oe_far.11.a: "Promote New World crops across Anatolia and Thrace"
 oe_far.11.a.tt: "Grants [ShowModifier('oe_far_new_world_crops')] (#Y 30#! years, higher population capacity and prosperity at slight tax adjustment) and adds #R +4#! strain."
 oe_far.11.b: "Link American silver with eastern spices in two-ocean arbitrage"
 oe_far.11.b.tt: "Requires the eastern corridor; grants [ShowModifier('oe_far_silver_arbitrage')] (#Y 25#! years, surging trade with steady inflation) and adds #R 2%#! inflation."
 oe_far.11.c: "Restrict bullion inflows to defend imperial coinage"
 oe_far.11.c.tt: "Grants [ShowModifier('oe_far_bullion_discipline')] (#Y 20#! years, curbing inflation at modest trade cost) and lowers inflation by #G 1.5%#!."
 oe_far.12.t: "Constitutio Antoniniana II"
 oe_far.12.d: "Enlightenment ferment and colonial unrest sweep both oceans as overseas assemblies protest taxation without representation in the Senate. Jurists unroll the text of the 212 AD Constitutio Antoniniana—the empire must seal its overseas settlement."
 oe_far.12.a: "Issue Constitutio Antoniniana II granting overseas citizenship"
 oe_far.12.a.tt: "Completes the Far Seas line; overseas autonomy #G −35#!, grants [ShowModifier('oe_far_antoniniana_edict')] (#Y 15#! years, high subject loyalty vs noble anger and lower taxes), adds #R +8#! strain."
 oe_far.12.b: "Reorganize as a federated realm of autonomous overseas Caesars"
 oe_far.12.b.tt: "Completes the Far Seas line; overseas autonomy #G −20#!, grants [ShowModifier('oe_far_caesar_federation')] (#Y 25#! years, halving tariffs for peace and trade)."
 oe_far.12.c: "Dispatch expeditionary fleets to enforce central authority"
 oe_far.12.c.tt: "Completes the Far Seas line; preserves tariffs while raising overseas autonomy #R +15#! and granting [ShowModifier('oe_far_iron_expedition')] (#Y 20#! years, steep upkeep and unrest)."
 oe_far.13.t: "Monsoon Corsairs & Chartered Friction"
 oe_far.13.d: "As overseas posts multiply and local autonomy climbs, corsairs prey on convoy lanes while ambitious factors provoke port rulers. The palace must fund royal escorts, license privateering, or retrench an overextended outpost."
 oe_far.13.a: "Fund royal escort squadrons to suppress piracy and discipline posts"
 oe_far.13.a.tt: "Costs #R 1.5#! months' income; reduces overseas autonomy #G −8#! and grants #G +4#! navy tradition (10-year cooldown)."
 oe_far.13.b: "License exarchs and the Company to arm privateers"
 oe_far.13.b.tt: "Spares treasury outlays, but raises overseas autonomy #R +14#! and lowers regional rulers' opinion #R −25#! (10-year cooldown)."
 oe_far.13.c: "Retrench one distant unprofitable outpost"
 oe_far.13.c.tt: "Closes one overseas factoria and relieves imperial strain by #G −5#! (10-year cooldown)."
 oe_far.14.t: "Roman Envoys Seek an Enclave Port Lease"
 oe_far.14.d: "Imperial Roman envoys arrive with chests of gold, noting ten years of peaceful factoria trade in our port. They offer substantial tribute and a fifteen-year truce for a twenty-five-year enclave lease on that single port. We may sign the lease, renew only the factoria charter, or flatly refuse."
 oe_far.14.a: "Sign the 25-year enclave lease (cede this single port for gold and a 15-year truce)"
 oe_far.14.a.tt: "Transfers this single enclave port to Rome with [ShowModifier('oe_far_port_lease_hub')] in exchange for generous lease tribute and a #Y 15#!-year mutual truce (great powers always refuse)."
 oe_far.14.b: "Keep our soil and renew only the factoria charter for rent"
 oe_far.14.b.tt: "Retains full sovereignty while renewing the Roman factoria charter for modest rent."
 oe_far.14.c: "Flatly refuse any lease (15-year port cooldown)"
 oe_far.14.c.tt: "Rejects the enclave offer and imposes a #Y 15#!-year negotiation cooldown on this port."
 oe_far.20.t: "Far Seas Line: Decree Takes Effect"
 oe_far.90.t: "[TEST] Far Seas Line (plan_a_script_div): Readings"
