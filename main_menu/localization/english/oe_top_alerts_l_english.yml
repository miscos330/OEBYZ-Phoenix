 OE_ALERT_RIGHT_DISMISS: "Right-click: Dismiss alert for this session"
 OE_ALERT_CTA_ENTROPY_PILLARS: "Left-click: Open Imperial Pillars for the Entropy Dashboard"
 OE_ALERT_CTA_ENTROPY_MODAL: "Left-click: Toggle the Imperial Entropy Visual Dashboard"
 OE_ALERT_CTA_PRF: "Left-click: Open the Sacrum Consistorium panel"
 OE_ALERT_CTA_EXARCH: "Left-click: Open Imperial Pillars Themes & Vassals"
 OE_ALERT_CTA_DECISIONS: "Left-click: Open Country Decisions"
 OE_ALERT_HIGH_ENTROPY_TITLE: "High Imperial Entropy (>=60)"
 OE_ALERT_HIGH_ENTROPY_DESC: "Five-dimensional Imperial Entropy has climbed to #R 60#! or higher, inflicting severe tax, manpower, and control penalties while risking provincial and fiscal crises. Open the Entropy Dashboard and enact active countermeasures."
 OE_ALERT_PRF_AVAIL_TITLE: "Praetorian Prefecture / Diocese Available"
 OE_ALERT_PRF_AVAIL_DESC: "Your realm qualifies to establish a new Praetorian Prefecture or invest a Classical Diocese via the Sacrum Consistorium to offset Imperial Entropy and administrative strain."
 OE_ALERT_EXARCH_DISLOYAL_TITLE: "Disloyal Theme or Exarchate"
 OE_ALERT_EXARCH_DISLOYAL_DESC: "At least one Theme or Exarchate has fallen into a low loyalty band, steadily driving Dimension 3 Satrapy Drift and risking defiance. Visit Imperial Pillars to pacify or audit frontier commands."
 OE_ALERT_SILK_OPEN_TITLE: "Maritime Silk Corridor Charter Ready"
 OE_ALERT_SILK_OPEN_DESC: "A key South/Southeast Asian Maritime Silk Corridor port charter or monsoon convoy decision is ready in Country Decisions to expand corridor prosperity."
 OE_ALERT_FAR_POST_TITLE: "Overseas Factoria Envoy Ready"
 OE_ALERT_FAR_POST_DESC: "Eastern or Atlantic sea lanes are ready for a diplomatic Overseas Factoria envoy or waystation charter in Country Decisions."
 OE_ALERT_YUAN_ZHIZHENG_TITLE: "Great Yuan Zhizheng Crisis Active"
 OE_ALERT_YUAN_ZHIZHENG_DESC: "The Zhizheng Red Turban crisis remains unresolved across Great Yuan. Use pacification actions, princely banners, and branch secretariat measures before imperial authority slips."
 OE_ALERT_CELESTIAL_TITLE: "Celestial Mandate / Tributary Charter Ready"
 OE_ALERT_CELESTIAL_DESC: "The Celestial Mandate system is active for your realm. Visit Country Decisions or diplomacy to advance tributary charters, protectorates, or centralizing reforms."
 OE_ALERT_ROAD_UPGRADE_TITLE: "Imperial Road Network Upgrade Ready"
 OE_ALERT_ROAD_UPGRADE_DESC: "Your treasury and road technology are ready for high-tier road upgrades. Open the Imperial Road Office in Country Decisions to manage paved roads, imperial highways, or automated routing."
 OE_ALERT_ELYSIA_TITLE: "Nova Elysia Frontier / Settlement Ready"
 OE_ALERT_ELYSIA_DESC: "The Fourth Odyssey voyage or Nova Elysia frontier development is active. Open Country Decisions to direct colonial preparations, frontier charters, and transatlantic strategy."
 OE_ALERT_THEME_EXP_TITLE: "Theme Expansion / Consolidation Ready"
 OE_ALERT_THEME_EXP_DESC: "Your Empire has unlocked Tier-2 expansion provinces ready for batch founding or eligible non-naval themes (<=15 locations) ready for consolidation. Open Imperial Pillars or subject interactions to organize them."
