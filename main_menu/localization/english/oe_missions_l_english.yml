l_english:
 oe_byz_missions_athens: "#bold #color_yellow Looking South to Athens#!#!"
 oe_byz_missions_athens_BUTTON_DETAILS: "The disastrous betrayal of the Catalan Company during the reign of [GetCharacter('byz_andronikos_ii_palaiologos').GetName] ultimately cost the empire Athens. The descendants of those mercenaries now occupy fertile Attica and defile one of our greatest cities, the ancient center of Greek civilization. We cannot allow these lawless Latins to rule the south indefinitely."
 oe_byz_missions_athens_BUTTON_TOOLTIP: "Begin the Campaign"
 oe_byz_missions_athens_DESCRIPTION: "Athena smiles upon us."
 oe_byz_missions_athens_CRITERIA_DESCRIPTION: "Drive the Latins from southern Greece."
 oe_byz_missions_athens_I: "The Southern States"
 oe_byz_missions_athens_II: "Secure the Thessalian Plain"
 oe_byz_missions_athens_II_desc: "The road to Athens passes through Thessaly. Before marching south, we must secure the plain to keep our army's food supplies and lines of communication safe.\n#Y Costs 5 ducats and 50 manpower each month.#!"
 oe_byz_missions_athens_III: "Send Envoys to the Pope"
 oe_byz_missions_athens_III_desc: "Not every western power wishes to oppose the empire. We should try diplomacy and send envoys to Rome, seeking an end to their hostility.\n#Y Western powers with an opinion of us above 0 will attend the Conference of Rome and may withdraw their support through papal mediation. Those with an opinion above 50 will certainly withdraw.#!"
 oe_byz_missions_athens_IV: "Secure Epirus"
 oe_byz_missions_athens_IV_desc: "The rulers of Epirus waver between Rome and the Latins. To prevent their betrayal in wartime, we must bring their autonomy to an end."
 oe_byz_missions_athens_V: "March on Athens"
 oe_byz_missions_athens_V_desc: "The time has come to march on Athens. Forward!"
 oe_byz_missions_athens_VI: "Subdue the Peloponnese"
 oe_byz_missions_athens_VI_desc: "Athens is ours. The whole Peloponnese must now submit."
 oe_byz_missions_athens_VII: "Restore the Acropolis"
 oe_byz_missions_athens_VII_desc: "Latin neglect has left the Acropolis overgrown and crumbling. We will fund its restoration and rebuild the glory of Athens."
 oe_byz_missions_athens_VIII: "Encourage Marble Quarrying"
 oe_byz_missions_athens_VIII_desc: "Marble is one of Athens' foremost industries. Few stones enjoy a reputation equal to its own."
 oe_byz_missions_athens_IX: "Encourage Agriculture"
 oe_byz_missions_athens_IX_desc: "The Attic plain yields many valuable crops. We should make full use of its potential."
 oe_byz_missions_athens_X: "Athens Rebuilt"
 oe_byz_missions_athens_X_desc: "Under our rule, Athens is renewed. A new age begins."
 oe_byz_missions_athens_XI: "Homeland of the Lacedaemonians"
 oe_byz_missions_athens_XI_desc: "The Peloponnese, homeland of the Spartans, is rich in resources and full of promise."
 oe_byz_missions_athens_XII: "The South Reclaimed"
 oe_byz_missions_athens_XII_desc: "Our soldiers' courage has restored southern Greece to the empire and driven out its Latin rulers for good."
 oe_byz_missions_athens_XII_tt: "#Y The Latins will be expelled from southern Greece.#!"
 oe_byz_missions_tur: "#bold #color_yellow The Reconquest of Anatolia#!#!"
 oe_byz_missions_tur_BUTTON_DETAILS: "Since Manzikert, the empire's Asian frontier has known little security. Turkish tribes arriving from the east have steadily taken the fertile lands of Anatolia. Centuries of decline have brought us close to losing the peninsula altogether, leaving countless countrymen under Turkish rule. Anatolia remains essential to the empire's revenues and armies. We must recover our homeland if the empire is to survive."
 oe_byz_missions_tur_BUTTON_TOOLTIP: "Begin the Campaign"
 oe_byz_missions_tur_DESCRIPTION: "In the Name of the Sword"
 oe_byz_missions_tur_CRITERIA_DESCRIPTION: "Recover the lost lands and drive out the Turks."
 oe_byz_missions_tur_I: "Across the Water"
 oe_byz_missions_tur_II: "Prepare for War"
 oe_byz_missions_tur_III: "Infiltrate the Turkish Realms"
 oe_byz_missions_tur_IV: "The Blessing of Saint Michael"
 oe_byz_missions_tur_V: "Cross the Straits"
 oe_byz_missions_tur_VI: "Recover Nicaea"
 oe_byz_missions_tur_VII: "Recover Smyrna"
 oe_byz_missions_tur_VIII: "Advance the Front"
 oe_byz_missions_tur_IX: "The Fall of the Ottomans"
 oe_byz_missions_tur_X: "Conquer Ankara"
 oe_byz_missions_tur_XI: "Conquer Karaman"
 oe_byz_missions_tur_XII: "A Cappadocian Cultural Revival"
 oe_byz_missions_tur_XIII: "Conquer Sivas"
 oe_byz_missions_tur_XIV: "A Land of Milk and Honey"
 oe_byz_missions_tur_XV: "The Return of Trebizond"
 oe_byz_missions_athens_I_desc: "Southern Greece is scattered with Latin principalities, the legacy of mercenary betrayal and the Latin Empire. Their soldiers should not be underestimated, but their resources cannot match ours. What prevents us from sweeping through the south is the support of western powers: Naples and Sicily guarantee these states' independence, while Venice and Genoa may reinforce them should war come."
