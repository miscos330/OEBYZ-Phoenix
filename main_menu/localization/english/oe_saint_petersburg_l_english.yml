l_english:
 oe_ra_found_saint_petersburg: "Build Saint Petersburg"
 oe_ra_found_saint_petersburg_desc: "After 1550 (from 1551 onward), while at peace, with no levies raised and Neva directly owned, Russia may spend one year of income and 50 Political Influence to establish a new capital. Neva becomes a city named Saint Petersburg, gains migration attraction and population growth for 50 years, and unlocks and begins construction of the Alexander Column and Nevsky Prospect. The capital moves to Neva. This action can be taken only once."
 STATIC_MODIFIER_NAME_oe_ra_establish_saint_petersburg: "Establishing Saint Petersburg"
 STATIC_MODIFIER_DESC_oe_ra_establish_saint_petersburg: "The new capital on the Neva draws settlers from afar as streets, workshops, and homes spread along its banks."
 oe_ra_alexander_column: "Alexander Column"
 oe_ra_alexander_column_desc: "A monumental column in Saint Petersburg that strengthens national cultural tradition and influence. Its upkeep consumes tools."
 oe_ra_alexander_column_maintenance: "Alexander Column Maintenance"
 oe_ra_nevsky_prospect: "Nevsky Prospect"
 oe_ra_nevsky_prospect_desc: "A broad avenue through the new city. It grants national proximity efficiency only while Saint Petersburg is the capital. Its upkeep consumes stone and tools."
 oe_ra_nevsky_prospect_maintenance: "Nevsky Prospect Maintenance"
