l_english:
 OE_NP_HOUSES: "Register of Noble Houses"
 OE_NP_HOUSES_DESC: "Lineage preserves a house; wealth and service sustain its standing. This register includes every noble house under Eastern Roman rule, including new and marginal houses."
 OE_NP_FAMILY: "House"
 OE_NP_INFLUENCE: "Influence"
 OE_NP_INFLUENCE_DESC: "Political Influence: #Y [Country.MakeScope.GetVariable('oe_np_influence').GetValue|2]#! / #Y 1000#!. Ranking multiplier: #Y 0.2#!.\n\nExpected monthly change: #Y [Country.MakeScope.GetVariable('oe_np_monthly_change').GetValue|2]#!\nBase −2; +1 per Eastern Roman cabinet seat; +1.5 per imperial court office; +0.25 per Eastern Roman army or navy commander.\n\nFamily member wins while commanding for Eastern Rome: +10\nRuler of the house country dies: −50\nEach family member marries: +5\nEach Authority spent in house interactions: +2 to that house\n\nInfluence is limited to 0–1000. Each spouse contributes to their own house; two spouses of the same house contribute +10. Manual refresh does not apply a monthly tick."
 OE_NP_INTERACT: "Interact"
 OE_NP_INTERACT_DESC: "Open interactions with this house and inspect their requirements."
 OE_NP_INTERACTIONS_TITLE: "Dealings with the House"
 OE_NP_CLOSE: "Close"
 OE_NP_NO_INTERACTIONS: "No interactions are currently available."
 OE_NP_NO_HOUSES: "No noble houses are currently listed."
 OE_NP_RANKING: "Standing of the Noble Houses"
 OE_NP_RANKING_DESC: "Ordered by total score. Ranks #Y 1–3#! are powerful houses, #Y 4–5#! are established houses, and rank #Y 6#! onward denotes marginal houses. Ties use registration order. Standing does not change subject type."
 OE_NP_RANKING_HINT: "Updated monthly. Hover over a total to inspect its components."
 OE_NP_REFRESH: "Refresh"
 OE_NP_REFRESH_DESC: "Recount houses, score components and ranks immediately, at no cost."
 OE_NP_POWERFUL: "Powerful House"
 OE_NP_ESTABLISHED: "Established House"
 OE_NP_MARGINAL: "Marginal House"
 AUTO_MODIFIER_NAME_oe_np_retinue_economies: "Household Retinue Organization"
 OE_NP_OTHER_STATUS: "[SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.GetVariable('oe_np_rank').GetValue, '(CFixedPoint)6'), 'OE_NP_ESTABLISHED', 'OE_NP_MARGINAL')]"
 OE_NP_SCORE_BREAKDOWN: "#bold [Country.GetNameWithNoTooltip]#!\nRank: [Country.MakeScope.GetVariable('oe_np_rank').GetValue|0]  [SelectLocalization(LessThan_CFixedPoint(Country.MakeScope.GetVariable('oe_np_rank').GetValue, '(CFixedPoint)4'), 'OE_NP_POWERFUL', 'OE_NP_OTHER_STATUS')]\nTotal: #Y [Country.MakeScope.GetVariable('oe_np_total').GetValue|2]#!\n\nLiving dynasty members × 1: [Country.MakeScope.GetVariable('oe_np_score_living').GetValue|2]\nYears as a Roman subject × 0.1: [Country.MakeScope.GetVariable('oe_np_score_tenure').GetValue|2] ([Country.MakeScope.GetVariable('oe_np_years').GetValue|2] years)\nTreasury gold × 0.005: [Country.MakeScope.GetVariable('oe_np_score_treasury').GetValue|2]\nEastern Roman cabinet seats × 20: [Country.MakeScope.GetVariable('oe_np_score_cabinet').GetValue|2]\nImperial court offices × 25: [Country.MakeScope.GetVariable('oe_np_score_court').GetValue|2]\nEastern Roman army/navy commanders × 5: [Country.MakeScope.GetVariable('oe_np_score_command').GetValue|2]\nEach complete 100 current soldiers × 1: [Country.MakeScope.GetVariable('oe_np_score_soldiers').GetValue|2]\nCurrent imperial consort from this house × 50: [Country.MakeScope.GetVariable('oe_np_score_consort').GetValue|2]\nPolitical influence × 0.2: [Country.MakeScope.GetVariable('oe_np_score_influence').GetValue|2]\n\n#italic Only Eastern Roman cabinet and command appointments count. Living members include the entire dynasty regardless of residence; each commander counts once. Tenure uses recorded dependency duration, using the shortest link in the current Roman dependency chain for indirect subjects. All components share one refresh.#!"
 oe_np_influence: "House Political Influence"
 oe_np_dynasty: "House Dynasty"
 oe_np_serial: "House Registration Order"
 oe_np_initialized: "Noble Register Established"
 oe_np_next_serial: "House Registration Counter"
 oe_np_rank: "House Rank"
 oe_np_total: "House Total Score"
 oe_np_years: "Years as a Roman Subject"
 oe_np_houses: "Roman Noble Houses"
 oe_np_score_living: "Living Members Score"
 oe_np_score_tenure: "Dependency Tenure Score"
 oe_np_score_treasury: "Treasury Score"
 oe_np_score_cabinet: "Cabinet Score"
 oe_np_score_court: "Court Office Score"
 oe_np_score_command: "Command Score"
 oe_np_score_soldiers: "Soldiers Score"
