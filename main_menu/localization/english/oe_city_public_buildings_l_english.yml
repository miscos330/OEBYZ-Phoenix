l_english:
 OE_CITY_REQUIRE_EXPEL: "Expansion Requirement: Complete #Y Expel Foreign Powers#!"
 OE_CITY_REQUIRE_PORT: "Expansion Requirement: #Y Complete a level-five Propontis Harbor#!"
 oe_byz_constantinople_granary: "Imperial Granary"
 oe_byz_constantinople_granary_desc: "Grain unloaded from merchant ships is weighed and stored here. Sound reserves allow the capital to weather failed harvests and blockades."
 oe_city_granary_maintenance: "Imperial Granary Operations"
 oe_byz_constantinople_customs: "Golden Horn Customs House"
 oe_byz_constantinople_customs_desc: "Customs officers inspect manifests, merchants store their cargoes and guards watch the quays. An orderly customs house makes trade in the Golden Horn more dependable."
 oe_city_customs_maintenance: "Golden Horn Customs House Operations"
 oe_byz_constantinople_repair: "Harbor Repair Yard"
 oe_byz_constantinople_repair_desc: "Shipwrights replace planks and mend rigging along the shore. Modest facilities are enough to return damaged vessels to sea more quickly."
 oe_city_repair_maintenance: "Harbor Repair Yard Operations"
 oe_byz_constantinople_chancery: "Blachernae Chancery"
 oe_byz_constantinople_chancery_desc: "Edicts, registers and provincial petitions arrive close to the court. Clerks versed in the law arrange the archives, ensuring that imperial commands are not lost among piles of documents."
 oe_city_chancery_maintenance: "Blachernae Chancery Operations"
 oe_byz_constantinople_baths: "Mese Public Baths"
 oe_byz_constantinople_baths_desc: "Steam rises from the baths once more as townspeople wash and talk after their daily work. Clean pools and well-kept furnaces sustain the old rhythms of urban life."
 oe_city_baths_maintenance: "Mese Public Baths Operations"
 oe_byz_constantinople_hospital: "Pantokrator Hospital"
 oe_byz_constantinople_hospital_desc: "The monastery opens its wards to the sick and the poor. Physicians and monks assign beds according to need, easing suffering with medicine, food and careful nursing."
 oe_city_hospital_maintenance: "Pantokrator Hospital Operations"
 oe_byz_constantinople_arsenal: "Land Walls Arsenal"
 oe_byz_constantinople_arsenal_desc: "Storehouses behind the walls hold bows, crossbows, armor and tools for repairs. When the alarm sounds, the garrison need no longer search the city for usable weapons."
 oe_city_arsenal_maintenance: "Land Walls Arsenal Operations"
 oe_byz_constantinople_scriptorium: "Capital Scriptorium"
 oe_byz_constantinople_scriptorium_desc: "Scribes collate scriptures, law books and classical works page by page. Books are preserved here, then find their way into schools and private collections."
 oe_city_scriptorium_maintenance: "Capital Scriptorium Operations"
 oe_byz_constantinople_silk: "Imperial Silk Workshops"
 oe_byz_constantinople_silk_desc: "Weavers fashion fine patterns from silk and dyes. Court commissions sustain their skill and keep the capital's fabrics in demand far beyond its walls."
 oe_city_silk_maintenance: "Imperial Silk Workshops Operations"
 oe_byz_constantinople_galata_hall: "New Galata Quarter"
 oe_byz_constantinople_galata_hall_desc: "With Galata restored to imperial control, merchants may still lodge, trade and hold meetings here. Their business is protected by common laws, rather than the privileges of a foreign power.\n\nExpansion requires the imperial reform #Y Expel Foreign Powers#!."
 oe_city_galata_hall_maintenance: "New Galata Quarter Operations"
 oe_byz_constantinople_new_venice: "New Venetian Quarter"
 oe_byz_constantinople_new_venice_desc: "The former Venetian trading district reopens under a new order. Merchants and artisans willing to accept imperial jurisdiction may settle here, bringing their experience of maritime trade back to the capital.\n\nExpansion requires the imperial reform #Y Expel Foreign Powers#!."
 oe_city_new_venice_maintenance: "New Venetian Quarter Operations"
 oe_byz_constantinople_naval_academy: "Imperial Naval Academy"
 oe_byz_constantinople_naval_academy_desc: "Officers study voyage records, learn coasts and winds, and practice fleet maneuvers in the harbor. The empire's experience at sea passes to a new generation of commanders.\n\nExpansion requires a #Y completed level-five Propontis Harbor#! in Constantinople. Levels still under construction do not count."
 oe_city_naval_academy_maintenance: "Imperial Naval Academy Operations"
 oe_byz_constantinople_athena_shipyard: "Athena Shipyard"
 oe_byz_constantinople_athena_shipyard_desc: "Ample slipways and skilled craftsmen allow the construction of large warships to be carefully organized. Sturdy hulls, reliable rigging and common standards provide stronger ships for the imperial fleet.\n\nExpansion requires a #Y completed level-five Propontis Harbor#! in Constantinople. Levels still under construction do not count."
 oe_city_athena_shipyard_maintenance: "Athena Shipyard Operations"
