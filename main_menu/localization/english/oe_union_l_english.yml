 STATIC_MODIFIER_NAME_oe_un_city_unease: "Unease in the City"
 STATIC_MODIFIER_NAME_oe_un_isidore_men: "The Cardinal's Archers"
 STATIC_MODIFIER_NAME_oe_un_school: "The Greek School at Court"
 oe_un_b_talks: "Constantinople is willing to talk"
 oe_un_b_union: "The churches are united"
 oe_un_b_union_half: "A union with reservations"
 oe_un_b_cold: "The Greeks are stalling again"
 oe_un_b_broken: "The Greeks broke the union"
 oe_un_b_sultan_wary: "The Greeks turned to Rome"
 oe_un_b_side_pope: "Came to our council"
 oe_un_b_side_basel: "Went to the council of the Basel party"
 oe_un_b_basel_union: "Made union with the fathers of Basel"
 oe_un_b_pledge: "The emperor has promised union"
 oe_un_b_scholar: "A Greek scholar came to Italy"
 oe_un_b_galleys: "Sailed east on our ships"
 oe_un_b_sultan_glad: "The emperor turned Rome down"
 oe_un.10.t: "Two Invitations"
 oe_un.10.desc_late: "#F In 1431 the Council of Basel opened. Both its fathers and Pope Eugenius IV wanted the Greeks at a council of union. In September 1437 the pope decreed that the council move to Ferrara, while the Basel party wanted to meet at Basel, Avignon or in Savoy. It is said that both sides sent ships to fetch the Greeks.#!\n\nNow envoys from both sides are in the capital: the pope asks the emperor to bring the patriarch and the bishops to Italy, while the fathers of Basel ask the emperor to a council of their choosing. To go means talking of union and leaving the capital for years; to stay means still less hope of help from the West.[GetCountry('BYZ').Custom('OeUnV10Bar')][GetCountry('BYZ').Custom('OeUnV10Isi')][GetCountry('BYZ').Custom('OeUnVRome')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.10.desc_early: "#F In 1431 the Council of Basel opened. Both its fathers and Pope Eugenius IV wanted the Greeks at a council of union, and both sent envoys to Constantinople.#!\n\nNow envoys from both sides are in the capital: the pope asks the emperor to bring the patriarch and the bishops to Italy, while the fathers of Basel ask the emperor to a council of their choosing. To go means talking of union and leaving the capital for years; to stay means still less hope of help from the West.[GetCountry('BYZ').Custom('OeUnV10Bar')][GetCountry('BYZ').Custom('OeUnV10Isi')][GetCountry('BYZ').Custom('OeUnVRome')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.10.a: "Sail to Ferrara on the pope's ships"
 oe_un.10.a.tt: "The papacy: opinion of the empire #G +20#! for #Y 10#! years\nTalks of union with Rome begin for #Y 5#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe emperor leaves for the council: the empire gains [ShowModifier('oe_un_emperor_away')] until the emperor returns\n[oe_tu_authority|e] #R −5#!\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −2#!, Rationalists #Y −1#!, Unionists #Y +3#!\nIn about #Y 600#! days the council comes to its end"
 oe_un.10.b: "Answer the call of the Council of Basel"
 oe_un.10.b.tt: "The papacy: opinion of the empire #R −20#! for #Y 10#! years\nTalks of union with Rome begin for #Y 5#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe emperor leaves for the council: the empire gains [ShowModifier('oe_un_emperor_away')] until the emperor returns\n[oe_tu_authority|e] #R −5#!\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −2#!, Rationalists #Y −1#!, Unionists #Y +3#!\nA union made this way is recognised only by the Basel party, and counts for half in the West\nIn about #Y 600#! days the council comes to its end"
 oe_un.10.c: "Stay at home and keep the faith"
 oe_un.10.c.tt: "[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +4#!, Unionists #Y −3#!\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years\nThe empire stays away, and nothing comes of this union"
 oe_un.11.t: "Signatures at Florence"
 oe_un.11.desc_basel_late: "#F In the spring of 1438 more than seven hundred Greeks reached Ferrara, and the first solemn session met on 9 April. For want of money and for fear of the plague, the council moved to Florence in January 1439. In June Patriarch Joseph II died there. On 6 July the council proclaimed Laetentur Caeli; the eastern bishops all signed, except Mark of Ephesus.#!\n\nNow the council of the Basel party has come to its end. Its fathers have put forward terms of union somewhat milder than Rome's. But the pope in Rome does not recognise this council, and only some of the western princes will accept such a union. The bishops wait for the emperor to decide.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.11.desc_basel_early: "#F In 1274 the envoys of Emperor Michael VIII accepted union at the Council of Lyon, in return for the pope holding back the western princes who meant to attack the empire. Back in Constantinople, hardly anyone would accept it.#!\n\nNow the council of the Basel party has come to its end. Its fathers have put forward terms of union somewhat milder than Rome's. But the pope in Rome does not recognise this council, and only some of the western princes will accept such a union. The bishops wait for the emperor to decide.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.11.desc_late: "#F In the spring of 1438 more than seven hundred Greeks reached Ferrara, and the first solemn session met on 9 April. For want of money and for fear of the plague, the council moved to Florence in January 1439. In June Patriarch Joseph II died there. On 6 July the council proclaimed Laetentur Caeli; the eastern bishops all signed, except Mark of Ephesus.#!\n\nNow the council has come to its end. The Latins ask the Greeks to accept the Filioque in the creed, the teaching on purgatory and the pope's primacy as the terms of union; the pope promises money and ships, and a crusade to relieve Constantinople. The bishops wait for the emperor to decide.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.11.desc_early: "#F In 1274 the envoys of Emperor Michael VIII accepted union at the Council of Lyon, in return for the pope holding back the western princes who meant to attack the empire. Back in Constantinople, hardly anyone would accept it.#!\n\nNow the council has come to its end. The Latins ask the Greeks to accept the Filioque in the creed, the teaching on purgatory and the pope's primacy as the terms of union; the pope promises money and ships, and a crusade to relieve Constantinople. The bishops wait for the emperor to decide.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.11.a: "Sign the decree of union"
 oe_un.11.a.tt: "The union is signed: the empire gains [ShowModifier('oe_un_signed')]\nThe papacy: opinion of the empire #G +30#! for #Y 20#! years\nThe Ottomans: opinion of the empire #R −15#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −4#!, Rationalists #Y −4#!, Unionists #Y +8#!\n[oe_tu_patriarchate|e] #R −3#!\nGain #G 2#! months of trade and tax income\nSome Greek scholars of the delegation stay on in Italy\nIn about #Y 200#! days the emperor is back in the capital"
 oe_un.11.b: "Keep the creed; grant the pope a primacy of honour only"
 oe_un.11.b.tt: "#G 40%#! chance the other side gives way: the union is signed with reservations and the empire gains [ShowModifier('oe_un_signed_soft')]; the papacy: opinion of the empire #G +15#! for #Y 20#! years; [Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −2#!, Rationalists #Y −2#!, Unionists #Y +4#!\n#R 60%#! chance the council breaks down and no union is signed: the papacy: opinion of the empire #R −10#! for #Y 5#! years; [Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +3#!, Unionists #Y −2#!\nIn about #Y 200#! days the emperor is back in the capital"
 oe_un.11.c: "Walk out"
 oe_un.11.c.tt: "The council breaks down; no union is signed\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +5#!, Unionists #Y −3#!\nThe papacy: opinion of the empire #R −30#! for #Y 15#! years\nIn about #Y 200#! days the emperor is back in the capital"
 oe_un.11.d: "Sign the decree of union"
 oe_un.11.d.tt: "The union is signed: the empire gains [ShowModifier('oe_un_signed')]\nThis union is recognised only by the Basel party, and counts for half in the West\nSavoy: opinion of the empire #G +10#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −15#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −4#!, Rationalists #Y −4#!, Unionists #Y +8#!\n[oe_tu_patriarchate|e] #R −3#!\nGain #G 1#! month of trade and tax income\nSome Greek scholars of the delegation stay on in Italy\nIn about #Y 200#! days the emperor is back in the capital"
 oe_un.11.e: "Keep the creed; grant the pope a primacy of honour only"
 oe_un.11.e.tt: "#G 60%#! chance the other side gives way: the union is signed with reservations and the empire gains [ShowModifier('oe_un_signed_soft')]; Savoy: opinion of the empire #G +10#! for #Y 10#! years; [Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −2#!, Rationalists #Y −2#!, Unionists #Y +4#!\n#R 40%#! chance the council breaks down and no union is signed: [Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +3#!, Unionists #Y −2#!\nIn about #Y 200#! days the emperor is back in the capital"
 oe_un.11.f: "Walk out"
 oe_un.11.f.tt: "The council breaks down; no union is signed\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +5#!, Unionists #Y −3#!\nIn about #Y 200#! days the emperor is back in the capital"
 oe_un.12.t: "Home to Constantinople"
 oe_un.12.desc_signed_late: "#F On 1 February 1440 the emperor came back to the capital. Most of the clergy and people of the City would not accept the union, and many who had signed it took back their word once home. In May the unionist Metrophanes II became patriarch. The emperor never formally proclaimed the union in the City.#!\n\nNow the emperor is back in the capital.[GetCountry('BYZ').Custom('OeUnV12Basel')] The union signed at the council has not yet been read out in the City, and the City talks of little else.[GetCountry('BYZ').Custom('OeUnV12Opp')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.12.desc_signed_early: "#F When Michael VIII died in 1282, the new emperor Andronikos II at once set the union of Lyon aside. Michael had replaced a patriarch and punished many opponents for the sake of that union, and in the end nothing of it remained.#!\n\nNow the emperor is back in the capital.[GetCountry('BYZ').Custom('OeUnV12Basel')] The union signed at the council has not yet been read out in the City, and the City talks of little else.[GetCountry('BYZ').Custom('OeUnV12Opp')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.12.desc_none_late: "#F On 1 February 1440 the emperor came back to the capital. Most of the clergy and people of the City would not accept the union, and many who had signed it took back their word once home. In May the unionist Metrophanes II became patriarch. The emperor never formally proclaimed the union in the City.#!\n\nNow the emperor is back in the capital. The council came to nothing, and the union has been set aside for now. The clergy of the City are relieved, but the western envoys remind the emperor that the pope's patience has its limits.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.12.desc_none_early: "#F When Michael VIII died in 1282, the new emperor Andronikos II at once set the union of Lyon aside. Michael had replaced a patriarch and punished many opponents for the sake of that union, and in the end nothing of it remained.#!\n\nNow the emperor is back in the capital. The council came to nothing, and the union has been set aside for now. The clergy of the City are relieved, but the western envoys remind the emperor that the pope's patience has its limits.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.12.a: "Proclaim the union in Hagia Sophia at once"
 oe_un.12.a.tt: "The union is read out in the City: the empire gains [ShowModifier('oe_un_proclaimed')]\nThe papacy: opinion of the empire #G +30#! for #Y 20#! years\nClergy satisfaction #R −15%#! (opposition at home #Y 60#! or more), else #R −10%#!\nConstantinople gains [ShowModifier('oe_un_city_strife')] for #Y 5#! years\n[oe_tu_patriarchate|e] #R −5#!\nWhile the church framework runs, the patriarch steps down and the Holy Synod puts up new candidates, a unionist among them (a unionist patriarch stays)"
 oe_un.12.b: "Hold back the proclamation and find a unionist patriarch"
 oe_un.12.b.tt: "The union stays signed and is not read out in the City for now\nWhile the church framework runs, the patriarch steps down and the Holy Synod puts up new candidates, a unionist among them (a unionist patriarch stays)"
 oe_un.12.c: "Declare the signatures void"
 oe_un.12.c.tt: "The union is void: the empire gains [ShowModifier('oe_un_repudiated')] for #Y 10#! years\nThe papacy: opinion of the empire #R −30#! for #Y 15#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +6#!, Unionists #Y −6#!"
 oe_un.12.d: "Bring the empire into communion with Rome"
 oe_un.12.d.tt: "The unionists prevail. The event 'The Council of Florence' follows at once; there it is decided whether the whole realm turns Catholic"
 oe_un.12.e: "Write to the pope: we will talk again"
 oe_un.12.e.tt: "Talks of union with Rome begin for #Y 5#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +5#! for #Y 5#! years"
 oe_un.12.f: "No more talk of union"
 oe_un.12.f.tt: "[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +3#!, Unionists #Y −3#!"
 oe_un.20.t: "Mark of Ephesus"
 oe_un.20.desc_late: "#F Mark, metropolitan of Ephesus, did not sign the decree of Florence, and at home became the leader of those who opposed the union. The emperor is recorded to have kept Mark confined on Lemnos for two years. In 1443 the three eastern patriarchs met at Jerusalem and condemned the union. Mark died on 23 June 1444, and on the deathbed charged a former pupil, George Scholarios, to defend Orthodoxy.#!\n\nNow Mark is dead, and the pupil Scholarios has taken up the cause, preaching and writing in the capital that the signatures of the council sold the faith; monks and townsfolk crowd to listen. The unionist bishops ask the emperor to act, and the pope's envoys wait to see what the emperor will do.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.20.desc_mid: "#F At Florence in July 1439 Mark, metropolitan of Ephesus, did not sign the decree of union. In February 1440 the Greeks came home to Constantinople, and Mark soon became the leader of those who opposed the union.#!\n\nNow Mark preaches and writes in the capital, saying that the signatures of the council sold the faith, and monks and townsfolk crowd to listen. The unionist bishops ask the emperor to act, and the pope's envoys wait to see what the emperor will do.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.20.desc_early: "#F After the union of Lyon in 1274, Emperor Michael VIII replaced the patriarch who would not accept it and had many opponents exiled or blinded; even the emperor's own sister Eulogia stood against the union. The opposition never fell silent.#!\n\nNow Mark preaches and writes in the capital, saying that the signatures of the council sold the faith, and monks and townsfolk crowd to listen. The unionist bishops ask the emperor to act, and the pope's envoys wait to see what the emperor will do.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.20.a: "Let the preaching and the writing go on"
 oe_un.20.a.tt: "Opposition at home #R +10#! (until 1450)\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +5#!, Unionists #Y −3#!\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years"
 oe_un.20.b: "Confine Mark on Lemnos"
 oe_un.20.b.tt: "Opposition at home #R +5#! (until 1450)\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +2#!\n[oe_tu_authority|e] #R −3#!\nThe papacy: opinion of the empire #G +5#! for #Y 5#! years"
 oe_un.20.c: "Send Scholarios away from court"
 oe_un.20.c.tt: "Opposition at home #R +5#! (until 1450)\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +2#!\n[oe_tu_authority|e] #R −3#!\nThe papacy: opinion of the empire #G +5#! for #Y 5#! years"
 oe_un.20.d: "Hold a public disputation at the palace"
 oe_un.20.d.tt: "#G 50%#! chance the emperor's side wins: opposition at home #G −5#! (until 1450); [Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −3#!, Rationalists #Y +2#!, Unionists #Y +1#!; prestige #G +5#!\n#R 50%#! chance it loses: opposition at home #R +10#! (until 1450); [Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +4#!, Rationalists #Y −2#!, Unionists #Y −2#!; prestige #R −5#!"
 oe_un.21.t: "No Crowning in the City"
 oe_un.21.desc_late: "#F On 31 October 1448 John VIII died. On 6 January 1449 Constantine XI was proclaimed emperor at Mystras, and on 12 March entered Constantinople. The new emperor was never crowned in Hagia Sophia; it is said that a crowning by the unionist patriarch Gregory III would have angered those who opposed the union.#!\n\nNow the empire has a new emperor, and the union with Rome still stands.[GetCountry('BYZ').Custom('OeUnV21Pat')] A crowning in Hagia Sophia would have to follow the rite of the union and name the pope; without a crowning, the new reign will always lack something.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.21.desc_early: "#F Michael VIII died in 1282. The new emperor, Andronikos II, soon set aside the union the old emperor had signed at Lyon; Michael had upheld it for eight years, and it did not outlast one reign.#!\n\nNow the empire has a new emperor, and the union with Rome still stands.[GetCountry('BYZ').Custom('OeUnV21Pat')] A crowning in Hagia Sophia would have to follow the rite of the union and name the pope; without a crowning, the new reign will always lack something.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.21.a: "Be crowned in Hagia Sophia by the rite of the union"
 oe_un.21.a.tt: "With opposition at home #Y 60#! or more: Constantinople gains [ShowModifier('oe_un_city_unease')] for #Y 3#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +2#!"
 oe_un.21.b: "Go without a crowning"
 oe_un.21.c: "Be crowned by a patriarch who rejects the union, and let the union go"
 oe_un.21.c.tt: "The union is void: the empire gains [ShowModifier('oe_un_repudiated')] for #Y 10#! years\nThe papacy: opinion of the empire #R −30#! for #Y 15#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +5#!, Unionists #Y −5#!\nWhile the church framework runs, the patriarch steps down and the Holy Synod puts up new candidates, a hesychast among them (a hesychast patriarch stays)"
 oe_un.22.t: "Rome's Condition"
 oe_un.22.desc_late: "#F In 1451 Mehmed II came to the throne; in April 1452 the sultan began to build a fortress on the European shore of the Bosphorus. That year the emperor wrote to Pope Nicholas V for help and promised to carry out the union. The pope paid for two hundred archers and sent them to the City with Cardinal Isidore.#!\n\nNow the Ottoman border runs next to the capital. The pope's envoys bring a condition:[GetCountry('BYZ').Custom('OeUnV22St')] In return the pope will pay for archers and send a cardinal with them to hold the walls; once the union is read out, the princes of the West will be readier to help.[GetCountry('BYZ').Custom('OeUnV22Isi')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.22.desc_early: "#F The union signed at Florence in July 1439 was never formally read out after the Greeks came home to Constantinople. In March 1447 Nicholas V was elected pope. Rome had always tied its help to the union.#!\n\nNow the Ottoman border runs next to the capital. The pope's envoys bring a condition:[GetCountry('BYZ').Custom('OeUnV22St')] In return the pope will pay for archers and send a cardinal with them to hold the walls; once the union is read out, the princes of the West will be readier to help.[GetCountry('BYZ').Custom('OeUnV22Isi')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.22.a: "Agree to proclaim the union in Hagia Sophia"
 oe_un.22.a.tt: "Constantinople gains [ShowModifier('oe_un_isidore_men')] for #Y 5#! years\nGain #G 1#! month of trade and tax income\nThe papacy: opinion of the empire #G +15#! for #Y 10#! years\nIn about #Y 60#! to #Y 90#! days the union is read out in Hagia Sophia"
 oe_un.22.b: "Take the archers and put off the proclamation"
 oe_un.22.b.tt: "Constantinople gains [ShowModifier('oe_un_isidore_men')] for #Y 2#! years\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years"
 oe_un.22.c: "Refuse"
 oe_un.22.c.tt: "With a union signed: the union is void and the empire gains [ShowModifier('oe_un_repudiated')] for #Y 10#! years; the papacy: opinion of the empire #R −30#! for #Y 15#! years\nOtherwise: the papacy: opinion of the empire #R −10#! for #Y 5#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +4#!, Unionists #Y −3#!"
 oe_un.23.t: "The Liturgy in Hagia Sophia"
 oe_un.23.desc_late: "#F On 12 December 1452 Cardinal Isidore celebrated the liturgy of union in Hagia Sophia and read out the decree of Florence. Those who opposed it flocked to the monastery of the Pantokrator to find the monk Gennadios, who, it is said, kept out of sight and left only a notice on the door of the cell. One saying spread widely: 'Better the sultan's turban than the Latin mitre.' The historian Doukas put it in the mouth of the grand duke Notaras; later scholars mostly think that Doukas named the wrong person.#!\n\nNow the union has been read out in Hagia Sophia, and the pope was named in the liturgy.[GetCountry('BYZ').Custom('OeUnV23Mood')] The union now counts as proclaimed; [oe_tu_patriarchate|e] #R −5#!.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.23.desc_early: "#F After the emperor came home from Florence in 1440, the decree of union lay unread in Constantinople for many years: many who had signed took back their word, in 1443 the three eastern patriarchs condemned the union at Jerusalem, and most of the clergy and people of the City would not accept it.#!\n\nNow the union has been read out in Hagia Sophia, and the pope was named in the liturgy.[GetCountry('BYZ').Custom('OeUnV23Mood')] The union now counts as proclaimed; [oe_tu_patriarchate|e] #R −5#!.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.23.a: "Leave Hagia Sophia to the unionists; let the others worship elsewhere"
 oe_un.23.a.tt: "[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +3#!"
 oe_un.23.b: "Promise that a general council will look at the terms again"
 oe_un.23.b.tt: "In Constantinople [ShowModifier('oe_un_city_strife')] falls to [ShowModifier('oe_un_city_unease')]; if there is only [ShowModifier('oe_un_city_unease')], it goes\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years"
 oe_un.23.c: "Put down the monks who stir up the crowds"
 oe_un.23.c.tt: "Constantinople loses [ShowModifier('oe_un_city_strife')] and [ShowModifier('oe_un_city_unease')]\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +6#!, Unionists #Y −3#!"
 oe_un.1.t: "A Golden Bull for Avignon"
 oe_un.1.desc_late: "#F In 1354 the Ottomans took Gallipoli and gained a foothold on the European shore of the straits. In 1355 the emperor bargained with the pope's envoy Paul, Latin archbishop of Smyrna, and offered great concessions, among them sending the young Manuel to the papal court as a hostage, in return for ships and men from the West. The pope answered only in general terms. In April 1357 the papal legate Peter Thomas came to Constantinople and received the emperor's submission, but the army that had been promised never came.#!\n\nNow the Ottomans come closer in Thrace every year. The pope's envoy waits in the capital for the emperor's answer: if the emperor will promise union in a golden bull, the pope will call on the West for ships and men. But the monks and clergy of the City have never accepted the primacy of Rome.[GetCountry('BYZ').Custom('OeUnV1Kant')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.1.desc_mid: "#F In 1354 the Ottomans took Gallipoli and gained a foothold on the European shore of the straits. In 1355 the emperor bargained with the pope's envoy Paul, Latin archbishop of Smyrna, and offered great concessions, among them sending the young Manuel to the papal court as a hostage, in return for ships and men from the West. The pope answered only in general terms.#!\n\nNow the Ottomans come closer in Thrace every year. The pope's envoy waits in the capital for the emperor's answer: if the emperor will promise union in a golden bull, the pope will call on the West for ships and men. But the monks and clergy of the City have never accepted the primacy of Rome.[GetCountry('BYZ').Custom('OeUnV1Kant')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.1.desc_early: "#F In 1354 the Ottomans took Gallipoli and gained a foothold on the European shore of the straits. The breach between Rome and Constantinople was old: in 1274 Emperor Michael VIII accepted union at Lyon, and back in the City hardly anyone would have it.#!\n\nNow the Ottomans come closer in Thrace every year. The pope's envoy waits in the capital for the emperor's answer: if the emperor will promise union in a golden bull, the pope will call on the West for ships and men. But the monks and clergy of the City have never accepted the primacy of Rome.[GetCountry('BYZ').Custom('OeUnV1Kant')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.1.a: "Issue the golden bull"
 oe_un.1.a.tt: "Talks of union with Rome begin for #Y 10#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +15#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −3#!, Unionists #Y +5#!\n[oe_tu_patriarchate|e] #R −2#!"
 oe_un.1.b: "Ask for ships and men; leave the Church out of it"
 oe_un.1.b.tt: "The papacy: opinion of the empire #G +5#! for #Y 5#! years"
 oe_un.1.c: "Write no such letter"
 oe_un.1.c.tt: "[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +2#!"
 oe_un.2.t: "A Disputation at the Palace"
 oe_un.2.desc_late: "#F In 1366 the Count of Savoy's crusade came east, and with it came Paul, made Latin patriarch by the pope: the same archbishop of Smyrna who had come to the City to talk of union more than ten years before. In June 1367, before leaving, Paul disputed at the palace with the former emperor Kantakouzenos, now a monk; the two agreed that within two years a general council of both churches should meet in Constantinople. The pope soon turned the proposal down.#!\n\nNow Paul is still in the capital and wants an answer from the emperor. Paul is told by [GetCountry('BYZ').Custom('OeUnV2Who')] that a quarrel over the faith cannot be ended by a decree of the emperor: a general council of both churches must meet in Constantinople, with the patriarchs of the East present.[GetCountry('BYZ').Custom('OeUnV2Bar')] Others urge the emperor to go to Rome in person and submit, in return for help from the West.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.2.desc_mid: "#F In 1366 the Count of Savoy's crusade came east, and with it came Paul, made Latin patriarch by the pope: the same archbishop of Smyrna who had come to the City to talk of union more than ten years before. In June 1367, before leaving, Paul disputed at the palace with the former emperor Kantakouzenos, now a monk; the two agreed that within two years a general council of both churches should meet in Constantinople.#!\n\nNow Paul is still in the capital and wants an answer from the emperor. Paul is told by [GetCountry('BYZ').Custom('OeUnV2Who')] that a quarrel over the faith cannot be ended by a decree of the emperor: a general council of both churches must meet in Constantinople, with the patriarchs of the East present.[GetCountry('BYZ').Custom('OeUnV2Bar')] Others urge the emperor to go to Rome in person and submit, in return for help from the West.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.2.desc_early: "#F In 1366 the Count of Savoy's crusade came east, and with it came Paul, made Latin patriarch by the pope: the same archbishop of Smyrna who had come to the City to talk of union more than ten years before.#!\n\nNow Paul is still in the capital and wants an answer from the emperor. Paul is told by [GetCountry('BYZ').Custom('OeUnV2Who')] that a quarrel over the faith cannot be ended by a decree of the emperor: a general council of both churches must meet in Constantinople, with the patriarchs of the East present.[GetCountry('BYZ').Custom('OeUnV2Bar')] Others urge the emperor to go to Rome in person and submit, in return for help from the West.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.2.a: "Propose a general council in Constantinople"
 oe_un.2.a.tt: "Talks of union with Rome begin for #Y 5#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +5#! for #Y 5#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +2#!, Rationalists #Y +2#!\n[oe_tu_patriarchate|e] #G +3#!"
 oe_un.2.b: "The emperor will go to Rome and submit in person"
 oe_un.2.b.tt: "Talks of union with Rome begin for #Y 5#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +15#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −2#!, Unionists #Y +4#!"
 oe_un.2.c: "No more talk of union"
 oe_un.2.c.tt: "[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y +3#!, Unionists #Y −2#!\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years"
 oe_un.3.t: "Greek Lessons in Florence"
 oe_un.3.desc_late: "#F In 1390 Manuel Chrysoloras went to Venice on the emperor's business, to seek help for the empire. From 1397, at the call of Salutati, chancellor of Florence, Chrysoloras taught Greek there; the future historian Bruni was among the pupils.#!\n\nNow Salutati, chancellor of Florence, writes to ask for Chrysoloras to teach Greek in Florence, paid by the city. Let Chrysoloras go, and the empire has one more friend and advocate in Italy; keep Chrysoloras at home, and the school at court gains the teacher it lacks.[GetCountry('BYZ').Custom('OeUnV3Byd')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.3.desc_early: "#F In 1390 Manuel Chrysoloras went to Venice on the emperor's business, to seek help for the empire.#!\n\nNow Salutati, chancellor of Florence, writes to ask for Chrysoloras to teach Greek in Florence, paid by the city. Let Chrysoloras go, and the empire has one more friend and advocate in Italy; keep Chrysoloras at home, and the school at court gains the teacher it lacks.[GetCountry('BYZ').Custom('OeUnV3Byd')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.3.a: "Let Chrysoloras go"
 oe_un.3.a.tt: "Florence, the papacy and Venice: opinion of the empire #G +10#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Rationalists #Y −3#!, Unionists #Y +2#!\nChrysoloras teaches in Italy (one more Greek scholar in the West)"
 oe_un.3.b: "Keep Chrysoloras to teach in the City"
 oe_un.3.b.tt: "The empire gains [ShowModifier('oe_un_school')] for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Rationalists #Y +3#!\nChrysoloras will go to Italy a few years later"
 oe_un.4.t: "Greeks at Constance"
 oe_un.4.desc_late: "#F From 1414 the Church of the West met in council at Constance to end the rule of rival popes. On 15 April 1415 Manuel Chrysoloras died at Constance; before that, Chrysoloras had gone to see Sigismund about where the council should meet. Early in 1416 the emperor sent an embassy under Nicholas Eudaimonoioannes to the council, which arrived on 25 March. In November 1417 the embassy saw Martin V elected pope.#!\n\nNow the empire's envoys are still at Constance. The Church of the West has one pope again whom all accept, and the new pope asks the envoys whether the Greeks will talk of union. The envoys wait for the emperor's instructions.[GetCountry('BYZ').Custom('OeUnV4Schism')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.4.desc_mid: "#F From 1414 the Church of the West met in council at Constance to end the rule of rival popes. On 15 April 1415 Manuel Chrysoloras died at Constance; before that, Chrysoloras had gone to see Sigismund about where the council should meet. Early in 1416 the emperor sent an embassy under Nicholas Eudaimonoioannes to the council, which arrived on 25 March.#!\n\nNow the empire's envoys are at the council of Constance. The Church of the West is about to end the rule of rival popes, and the fathers of the council ask the envoys whether the Greeks will talk of union. The envoys wait for the emperor's instructions.[GetCountry('BYZ').Custom('OeUnV4Schism')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.4.desc_early: "#F From 1414 the Church of the West met in council at Constance to end the rule of rival popes. On 15 April 1415 Manuel Chrysoloras died at Constance; before that, Chrysoloras had gone to see Sigismund about where the council should meet.#!\n\nNow the empire's envoys are at the council of Constance. The Church of the West is about to end the rule of rival popes, and the fathers of the council ask the envoys whether the Greeks will talk of union. The envoys wait for the emperor's instructions.[GetCountry('BYZ').Custom('OeUnV4Schism')]\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.4.a: "Ask the pope to call a council of union"
 oe_un.4.a.tt: "Talks of union with Rome begin for #Y 10#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +15#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −2#!, Unionists #Y +3#!\nIn one to two years the pope replies"
 oe_un.4.b: "Talk only of help and marriages"
 oe_un.4.b.tt: "The papacy: opinion of the empire #G +5#! for #Y 5#! years\nIn one to two years the pope replies"
 oe_un.4.c: "Let the envoys come home empty-handed"
 oe_un.4.c.tt: "The embassy brings nothing home"
 oe_un.5.t: "The Pope's Reply"
 oe_un.5.desc_brides_wed: "#F In November 1417 the council of Constance elected Pope Martin V, and the rule of rival popes was over. At the request of the empire's embassy, the pope allowed two of the emperor's sons to marry Catholic princesses. In August 1420 Sophia of Montferrat and Cleofe Malatesta came east on Venetian ships. In 1421 the young John married Sophia. The old emperor is said to have advised the heir to keep talking of a council of union, to frighten the sultan, but never to let it meet.#!\n\nNow the pope's reply has come.[GetCountry('BYZ').Custom('OeUnV5Ask')] The emperor must decide what to do next.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.5.desc_brides: "#F In November 1417 the council of Constance elected Pope Martin V, and the rule of rival popes was over. At the request of the empire's embassy, the pope allowed two of the emperor's sons to marry Catholic princesses. In August 1420 Sophia of Montferrat and Cleofe Malatesta came east on Venetian ships.#!\n\nNow the pope's reply has come.[GetCountry('BYZ').Custom('OeUnV5Ask')] The emperor must decide what to do next.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.5.desc_martin: "#F In November 1417 the council of Constance elected Pope Martin V, and the rule of rival popes was over. At the request of the empire's embassy, the pope allowed two of the emperor's sons to marry Catholic princesses.#!\n\nNow the pope's reply has come.[GetCountry('BYZ').Custom('OeUnV5Ask')] The emperor must decide what to do next.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.5.desc_early: "#F From 1414 the Church of the West met in council at Constance to end the rule of rival popes; the empire's envoys were there too.#!\n\nNow the pope's reply has come.[GetCountry('BYZ').Custom('OeUnV5Ask')] The emperor must decide what to do next.\n\n[oe_tu_church_union|e]: the West's will to help #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 oe_un.5.a: "Welcome two Catholic brides; let the council wait"
 oe_un.5.a.tt: "Two marriages are agreed; the brides come east on Venetian ships\nTalks of union with Rome run again, for #Y 10#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +5#! for #Y 5#! years\nVenice: opinion of the empire #G +5#! for #Y 5#! years"
 oe_un.5.b: "Prepare the council of union at once"
 oe_un.5.b.tt: "Talks of union with Rome run again, for #Y 10#! years; the empire gains [ShowModifier('oe_un_pledge')]\nThe papacy: opinion of the empire #G +15#! for #Y 10#! years\n[Concept('oe_tu_church_parties','Church parties')|e] shares: Hesychasts #Y −3#!, Unionists #Y +4#!\nThe invitations to a council of union may come as early as #Y 1425#! (else from #Y 1435#!)"
 oe_un.5.c: "Decline politely, lest the sultan grow suspicious"
 oe_un.5.c.tt: "The Ottomans: opinion of the empire #G +10#! for #Y 5#! years\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years\nThe talks of union with Rome end"
 oe_un.90.t: "The Price of Union: worker"
