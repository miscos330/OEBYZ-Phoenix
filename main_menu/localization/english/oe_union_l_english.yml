 OE_UN_V10_BAR: " Barlaam asked at Avignon nearly a hundred years ago for a council first; now one is at last within reach."
 OE_UN_EMPTY: ""
 OE_UN_V10_ISI: " Isidore, the new metropolitan of Rus', is ready to go with the emperor."
 OE_UN_V_ROME: " John V's submission in Rome long ago won the empire nothing."
 OE_UN_V12_BAS: " This union was signed with the fathers of Basel, and the pope in Rome does not recognise it."
 OE_UN_V12_H: " Monks and many of the clergy say openly that the bishops who signed have sold the faith; in the streets people call them traitors to their faces."
 OE_UN_V12_M: " The clergy argue about it; some wait to see, others oppose it quietly."
 OE_UN_V12_L: " There is little open opposition; most people are waiting to see whether help from the West will come."
 OE_UN_V21_U: " The patriarch of the City is a unionist."
 OE_UN_V21_N: " The patriarch of the City is no unionist, but the signatures of the union still stand."
 OE_UN_V22_2: " the union already signed must be read out in Hagia Sophia."
 OE_UN_V22_4: " the union once declared void must be accepted again and read out in Hagia Sophia."
 OE_UN_V22_0: " the decree of Florence must be accepted and then read out in Hagia Sophia."
 OE_UN_V22_ISI: " The cardinal who is to come, Isidore, is the metropolitan once sent to Rus'."
 OE_UN_V23_2: " Those who oppose it will not set foot in Hagia Sophia again; monks lead crowds through the streets, and the City is in uproar."
 OE_UN_V23_1: " Those who oppose it will not set foot in Hagia Sophia again; the City is uneasy, though no one has yet taken to the streets."
 OE_UN_V1_K: " The house of Kantakouzenos has won the civil war and holds the throne, and the new reign looks to the West for help just the same."
 OE_UN_V2_EMP: "the emperor in person"
 OE_UN_V2_KAN: "the former emperor Kantakouzenos, now a monk,"
 OE_UN_V2_THEO: "the theologians of the court"
 OE_UN_V2_BAR: " Barlaam made the same case at Avignon long ago."
 OE_UN_V3_BYD: " The sultan's camp lies outside the walls, and letters can leave only by sea."
 OE_UN_V4_S1: " The empire was quick to greet the pope whom the council upholds, and its envoys are heard."
 OE_UN_V4_S2: " The empire backed the wrong pope before, and its envoys must tread carefully at the council."
 OE_UN_V4_S3: " The empire took no side in the quarrel of the popes, and its envoys can only listen for now."
 OE_UN_V5_1: " The pope is willing to talk of a council of union and asks when the emperor will send envoys to settle where it should meet."
 OE_UN_V5_2: " The pope promises to help find Catholic brides for the emperor's sons, but of help against the Turks says only that it can wait."
 OE_UN_R1369_1: "In 1369 John V submitted to Rome in person and brought back no help."
 OE_UN_R1369_2: "In 1369 the emperor did not go to Rome."
 OE_UN_CHR_V1: "The empire took the road of restoration; union with Rome is no longer spoken of."
 OE_UN_CHR_V2: "No invitation to a council of union came before 1446."
 OE_UN_CHR_D5: "The empire entered communion with Rome."
 OE_UN_CHR_DR: "The empire refused Rome's condition; the union was not read out in Hagia Sophia."
 OE_UN_CHR_D3R: "The union was read out in Hagia Sophia and the City was in uproar over it; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!."
 OE_UN_CHR_D3U: "The union was read out in Hagia Sophia and the City was uneasy; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!."
 OE_UN_CHR_D3: "The union was read out in Hagia Sophia; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!."
 OE_UN_CHR_D4: "The union once signed was declared void."
 OE_UN_CHR_D2: "The signatures of the council were never read out in the City."
 OE_UN_CHR_D0: "In the end there was no union with Rome."
 OE_UN_CHR_R22: "The emperor has agreed to Rome's condition; the union will soon be read out in Hagia Sophia."
 OE_UN_CHR_R2: "The union is signed but not yet read out in the City; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 OE_UN_CHR_RT: "The emperor is away at the council."
 OE_UN_CHR_RK: "Talks of union with Rome go on; worth #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_west_bonus')|0]#! in the West."
 OE_UN_CHR_RB: "The council broke down; no union was signed."
 OE_UN_CHR_R22B: "The empire took the pope's archers and is putting off the proclamation of the union."
 OE_UN_CHR_RN: "The emperor stayed away from the council; the union was set aside."
 OE_UN_CHR_WE: "The council of union has been brought forward: from 1425 the pope may invite the emperor to it."
 OE_UN_CHR_W1: "From 1355 the emperor may write to the pope, offering union for help from the West."
 OE_UN_CHR_W2: "From 1366 a papal envoy may come to the capital to talk of a general council of both churches."
 OE_UN_CHR_W3: "The empire's scholars and envoys come and go in Italy; from 1435 the pope and the Council of Basel may invite the emperor to a council. [GetCountry('BYZ').Custom('OeUnRome1369')]"
 OE_UN_CHR_W: "From 1435 the pope and the Council of Basel may invite the emperor to a council. [GetCountry('BYZ').Custom('OeUnRome1369')]"
 game_concept_oe_tu_church_union: "Union of the Churches"
 game_concept_oe_tu_church_union_desc: "Union of the empire with the Church of Rome: from no talks, through talks, signed and proclaimed, to repudiated or converted. Every step is paid for in two ledgers:\n#bold #color_yellow Opposition at home#!#!: worked out from the [Concept('oe_tu_church_parties','Church parties')|e], the Hesychasts' share plus half the Rationalists'; #Y 60#! when the church framework is not running, and #Y 5#! more after 1443 while a union is in force. Until 1450, Mark of Ephesus and those who follow Mark add #Y 10#! while preaching freely and #Y 5#! while confined, and take off #Y 5#! after losing a disputation at the palace. #Y 60#! and up is high, #Y 40#! to #Y 59#! middling, less is low. The higher it is, the more anger a union proclaimed in the City stirs up.\n#bold #color_yellow Worth in the West#!#!: talks #G +5#!, signed #G +15#! (with reservations, or recognised only by the Basel party, #G +8#!), proclaimed #G +25#!, repudiated #R −10#!. It goes into the West's will to help, which decides how much the West will do.\nThe emperor must go to the council and sign in person, and decide at home whether to proclaim. A union signed but not accepted at home is never quite believed in the West; without one, help is still harder to hope for."
 STATIC_MODIFIER_NAME_oe_un_pledge: "A Promise to Rome"
 STATIC_MODIFIER_NAME_oe_un_emperor_away: "The Emperor in Italy"
 STATIC_MODIFIER_NAME_oe_un_signed: "The Union Signed"
 STATIC_MODIFIER_NAME_oe_un_signed_soft: "A Union with Reservations"
 STATIC_MODIFIER_NAME_oe_un_proclaimed: "The Union in Hagia Sophia"
 STATIC_MODIFIER_NAME_oe_un_repudiated: "The Union Repudiated"
