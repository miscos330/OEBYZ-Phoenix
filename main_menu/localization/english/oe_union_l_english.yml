 OE_UN_V10_BAR: " Barlaam asked at Avignon nearly a hundred years ago for a council first; now one is at last within reach."
 OE_UN_EMPTY: ""
 OE_UN_V10_ISI: " Isidore, the new metropolitan of Rus', is ready to go with the emperor."
 OE_UN_V_ROME: " John V's submission in Rome long ago won the empire nothing."
 OE_UN_V12_BAS: " This union was signed with the fathers of Basel, and the pope in Rome does not recognise it."
 OE_UN_V12_H: " Monks and many of the clergy say openly that the bishops who signed have sold the faith; in the streets people call them traitors to their faces."
 OE_UN_V12_M: " The clergy argue about it; some wait to see, others oppose it quietly."
 OE_UN_V12_L: " There is little open opposition; most people are waiting to see whether help from the West will come."
 OE_UN_R1369_1: "In 1369 John V submitted to Rome in person and brought back no help."
 OE_UN_R1369_2: "In 1369 the emperor did not go to Rome."
 OE_UN_CHR_V1: "The empire took the road of restoration; union with Rome is no longer spoken of."
 OE_UN_CHR_V2: "No invitation to a council of union came before 1446."
 OE_UN_CHR_D5: "The empire entered communion with Rome."
 OE_UN_CHR_D3: "The union was read out in Hagia Sophia; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#!."
 OE_UN_CHR_D4: "The union once signed was declared void."
 OE_UN_CHR_D2: "The signatures of the council were never read out in the City."
 OE_UN_CHR_D0: "In the end there was no union with Rome."
 OE_UN_CHR_R2: "The union is signed but not yet read out in the City; opposition at home #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_opp')|0]#! ([GetCountry('BYZ').Custom('OeUnOpp')])."
 OE_UN_CHR_RT: "The emperor is away at the council."
 OE_UN_CHR_RK: "Talks of union with Rome go on; worth #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_un_west_bonus')|0]#! in the West."
 OE_UN_CHR_RB: "The council broke down; no union was signed."
 OE_UN_CHR_RN: "The emperor stayed away from the council; the union was set aside."
 OE_UN_CHR_W: "From 1435 the pope and the Council of Basel may invite the emperor to a council. [GetCountry('BYZ').Custom('OeUnRome1369')]"
 game_concept_oe_tu_church_union: "Union of the Churches"
 game_concept_oe_tu_church_union_desc: "Union of the empire with the Church of Rome: from no talks, through talks, signed and proclaimed, to repudiated or converted. Every step is paid for in two ledgers:\n#bold #color_yellow Opposition at home#!#!: worked out from the [Concept('oe_tu_church_parties','Church parties')|e], the Hesychasts' share plus half the Rationalists'; #Y 60#! when the church framework is not running, and #Y 5#! more after 1443 while a union is in force. #Y 60#! and up is high, #Y 40#! to #Y 59#! middling, less is low. The higher it is, the more anger a union proclaimed in the City stirs up.\n#bold #color_yellow Worth in the West#!#!: talks #G +5#!, signed #G +15#! (with reservations, or recognised only by the Basel party, #G +8#!), proclaimed #G +25#!, repudiated #R −10#!. It goes into the West's will to help, which decides how much the West will do.\nThe emperor must go to the council and sign in person, and decide at home whether to proclaim. A union signed but not accepted at home is never quite believed in the West; without one, help is still harder to hope for."
 STATIC_MODIFIER_NAME_oe_un_pledge: "A Promise to Rome"
 STATIC_MODIFIER_NAME_oe_un_emperor_away: "The Emperor in Italy"
