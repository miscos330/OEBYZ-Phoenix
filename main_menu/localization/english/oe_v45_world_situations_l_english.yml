l_english:
 oe_sit_v45_global_silver_flow: "Global Silver Flow & Price Revolution"
 oe_sit_v45_global_silver_flow_desc: "American and Japanese silver mines now feed a single planetary monetary circuit stretching from Potosi, Zacatecas, and Iwami through European clearing exchanges into Ming-Qing China and Mughal India. Navigate oceanic bullion convoys, Single Whip silver taxes, and Price Revolution inflation to forge a lasting global standard."
 oe_v45_silver_end_global_standard: "Stabilized Global Silver Standard"
 oe_v45_silver_end_global_standard_desc: "Disciplined royal mints, trans-oceanic galleon charters, and Amsterdam-Antwerp clearing houses tame the Price Revolution, knitting the continents into a mature global commercial system."
 oe_v45_silver_end_price_shock: "Protracted Price Revolution"
 oe_v45_silver_end_price_shock_desc: "Protectionist hoarding and competitive debasement leave realms wrestling with volatile grain prices and fiscal restructuring well into the new century."
 oe_v45_silver_end_equilibrium: "Seventeenth-Century Bullion Equilibrium"
 oe_v45_silver_end_equilibrium_desc: "By 1700, silver purchasing power converges across Europe, Asia, and the Americas, closing the first great era of planetary bullion arbitrage."
 oe_v45_silver_map_producers_tt: "#Y Silver-Producing Mines#!: Andean, Mesoamerican, and Japanese lodes supplying global bullion."
 oe_v45_silver_map_forwarders_tt: "#Y Bullion-Forwarding Hubs#!: Iberian, Atlantic, and Levantine exchanges routing silver across the seas."
 oe_v45_silver_map_absorbers_tt: "#Y Silver-Absorbing Sinks#!: East, South, and Southeast Asian economies anchoring global bullion demand."
 oe_v45_silver_legend_producers: "Silver Producers (Americas / Japan)"
 oe_v45_silver_legend_forwarders: "Bullion-Forwarding Exchanges"
 oe_v45_silver_legend_absorbers: "Silver-Absorbing Asian Sinks"
 OE_V45_SILVER_GUI_HDR_ERA: "Global Cycle"
 OE_V45_SILVER_GUI_HDR_METER: "Global Silver Index"
 OE_V45_SILVER_GUI_CARD_TITLE: "Trans-Oceanic Bullion Circuit & Price Revolution"
 OE_V45_SILVER_GUI_CARD_BODY: "Silver extracted from the Americas and Japan flows through European clearing houses toward East and South Asia. Use the five Situation actions to steer bullion integration, curb mint debasement, and reach Global Silver Index 85+ for a Stabilized Global Silver Standard."
 OE_V45_SILVER_GUI_GAUGE_LABEL: "Global Silver Index (85+ seals Global Silver Standard)"
 OE_V45_SILVER_GUI_FOOTNOTE: "Data Map: Gold highlights silver-producing Americas & Japan; Blue marks European/Levantine forwarding hubs; Teal marks Asian silver-absorbing sinks."
 hint_oe_sit_v45_global_silver_flow: "[GetSituationByKey('oe_sit_v45_global_silver_flow').GetNameWithNoTooltip]"
 hint_oe_sit_v45_global_silver_flow_hint_text: "#T Overview#!\n@hint! #Y Global Silver Flow & Price Revolution#! runs from #Y 1550 to 1700#!. Track the live #Y Global Silver Index#! (0-100) and choose between maritime bullion expansion (Manila Galleons, Amsterdam-Antwerp Exchange), fiscal silverization (Single Whip Tax), sound coinage (Mint Debasement Curbs), or protectionist Bullion Mercantilism."
 hint_oe_sit_v45_global_silver_flow_administrative: "Combine Single Whip Silver Tax with Mint Debasement Curbs whenever inflation climbs above 3%, keeping treasury receipts high without letting prices outrun fixed taxes."
 hint_oe_sit_v45_global_silver_flow_diplomatic: "Chartering the Amsterdam-Antwerp Exchange and Manila Galleons raises global bullion integration toward 85+ while avoiding the diplomatic penalty of harsh Bullion Mercantilism."
 hint_oe_sit_v45_global_silver_flow_military: "Treasure convoys require escort upkeep; pair maritime bullion charters with strong coastal ports so privateer surges never disrupt wartime solvency."
 oe_sit_v45_little_ice_age: "The Little Ice Age & General Crisis"
 oe_sit_v45_little_ice_age_desc: "A prolonged solar minimum chills temperate Eurasia and North America from 1570 to 1715, freezing rivers, shortening growing seasons, and testing every treasury against famine and rural rebellion. Build relief granaries, adopt hardy New-World crops, and master crisis logistics to endure the century of frost."
 oe_v45_lia_end_resilient_recovery: "Agrarian Resilience & Granary Mastery"
 oe_v45_lia_end_resilient_recovery_desc: "Ever-Normal granaries, cold-hardy tubers, and emergency grain logistics defeat the frost decades, leaving states more resilient and better fed than before the solar minimum."
 oe_v45_lia_end_hard_thaw: "Scars of the Seventeenth-Century Crisis"
 oe_v45_lia_end_hard_thaw_desc: "Decades of crop failure and fiscal strain leave austere treasuries and depopulated uplands that gradually recover as solar warmth returns."
 oe_v45_lia_end_solar_return: "Return of the Sun"
 oe_v45_lia_end_solar_return_desc: "By 1715, sunspots reappear and growing seasons lengthen once again across Eurasia and America, closing the sharpest trough of the Little Ice Age."
 oe_v45_lia_map_severe_frost_tt: "#Y Severe Frost Belt#!: Arctic, subpolar, and continental heartlands suffering acute Little Ice Age crop shortening."
 oe_v45_lia_map_temperate_stress_tt: "#Y Cold-Stressed Breadbaskets#!: Oceanic and cold-steppe agricultural basins enduring wet summers and fuel pressure."
 oe_v45_lia_map_grain_buffer_tt: "#Y Warm Relief Grain Basins#!: Mediterranean and subtropical exporters supplying emergency maritime grain."
 oe_v45_lia_legend_severe_frost: "Severe Frost-Hit Heartlands"
 oe_v45_lia_legend_temperate_stress: "Cold-Stressed Agrarian Basins"
 oe_v45_lia_legend_grain_buffer: "Warm Relief Grain Exporters"
 OE_V45_LIA_GUI_HDR_ERA: "Solar Minimum"
 OE_V45_LIA_GUI_HDR_METER: "Climate Resilience"
 OE_V45_LIA_GUI_CARD_TITLE: "Surviving the Seventeenth-Century General Crisis"
 OE_V45_LIA_GUI_CARD_BODY: "Shortened summers and deep frosts threaten harvests across temperate Eurasia and North America. Raise Little Ice Age Resilience to 85+ through relief granaries, hardy New-World crops, tax moratoriums, forestry edicts, and emergency maritime grain charters to achieve lasting Agrarian Resilience."
 OE_V45_LIA_GUI_GAUGE_LABEL: "Little Ice Age Resilience (85+ achieves Resilient Recovery)"
 OE_V45_LIA_GUI_FOOTNOTE: "Data Map: Glacial Blue shows severe frost-hit continental/subpolar heartlands; Slate Blue shows cold-stressed agrarian basins; Warm Amber marks grain-relief coastal basins."
 hint_oe_sit_v45_little_ice_age: "[GetSituationByKey('oe_sit_v45_little_ice_age').GetNameWithNoTooltip]"
 hint_oe_sit_v45_little_ice_age_hint_text: "#T Overview#!\n@hint! #Y The Little Ice Age & General Crisis#! spans #Y 1570 to 1715#!, peaking during the #Y 1615-1675#! deep frost decades. Invest proactively in #Y Hardy New-World Crop Adoption#! and #Y Ever-Normal Relief Granaries#! to push global resilience toward 85+."
 hint_oe_sit_v45_little_ice_age_administrative: "Hardy New-World Crop Adoption halts mid-century frost decay while Ever-Normal Relief Granaries and Peasant Tax Moratoriums protect stability during lean years."
 hint_oe_sit_v45_little_ice_age_diplomatic: "Emergency Maritime Grain Charters work best when maritime corridors stay open—avoid unnecessary multi-front blockades during peak winter shortages."
 hint_oe_sit_v45_little_ice_age_military: "Enacting the Frost-Resistant Forestry & Fuel Edict trims land unit attrition by 10% and strengthens fort defense, saving armies during bitter winter campaigns."
 oe_sit_v45_atlantic_revolutions: "Age of Atlantic & Constitutional Revolutions"
 oe_sit_v45_atlantic_revolutions_desc: "Between 1775 and 1830, Enlightenment pamphlets, fiscal crises, and colonial independence struggles fuse into a single trans-Atlantic constitutional upheaval. Champion Constituent Assemblies and Declarations of Rights, rally a Conservative Concert of sovereign crowns, or forge a Moderate Constitutional Compromise."
 oe_v45_rev_end_constitutional_dawn: "Dawn of Constitutional Sovereignty"
 oe_v45_rev_end_constitutional_dawn_desc: "Representative assemblies and bills of civic rights triumph across the Atlantic world, rewriting sovereignty around written constitutions and citizen consent."
 oe_v45_rev_end_conservative_concert: "Legitimist Concert of Crowns"
 oe_v45_rev_end_conservative_concert_desc: "Allied monarchies contain revolutionary contagion through congress diplomacy and coordinated royal treaties, preserving dynastic continuity into the new century."
 oe_v45_rev_end_balanced_charters: "Trans-Atlantic Constitutional Equilibrium"
 oe_v45_rev_end_balanced_charters_desc: "By 1830, neither radical upheaval nor rigid absolutism holds total sway; constitutional monarchies and young republics settle into a pragmatic equilibrium."
 oe_v45_rev_map_constitutional_tt: "#Y Constitutional & Revolutionary Camp#!: Republics, revolutionary powers, and realms championing Constituent Assemblies."
 oe_v45_rev_map_moderate_tt: "#Y Moderate Constitutional Compromise#!: Realms bridging sovereign continuity with chartered parliamentary consent."
 oe_v45_rev_map_concert_tt: "#Y Conservative Concert Camp#!: Legitimist monarchies defending dynastic order and diplomatic balance."
 oe_v45_rev_legend_constitutional: "Constitutional / Revolutionary Realms"
 oe_v45_rev_legend_moderate: "Moderate Constitutional Compromise"
 oe_v45_rev_legend_concert: "Conservative Concert Monarchies"
 OE_V45_REV_GUI_HDR_ERA: "Revolutionary Era"
 OE_V45_REV_GUI_HDR_METER: "Revolutionary Fervor"
 OE_V45_REV_GUI_CARD_TITLE: "Constitutional Sovereignty vs. Conservative Concert"
 OE_V45_REV_GUI_CARD_BODY: "Ideological battle lines divide Europe and the Americas. Push Revolutionary Fervor to +75 for Constitutional Dawn, pull it down to -75 for a Conservative Concert of Crowns, or steer toward 0 through Moderate Constitutional Compromise."
 OE_V45_REV_GUI_GAUGE_LABEL: "Revolutionary Fervor (-100 Concert <---> +100 Constitutional)"
 OE_V45_REV_GUI_FOOTNOTE: "Data Map: Crimson marks Constitutional/Revolutionary realms; Emerald marks Moderate Constitutional Compromise realms; Royal Navy Blue marks Conservative Concert monarchies."
 hint_oe_sit_v45_atlantic_revolutions: "[GetSituationByKey('oe_sit_v45_atlantic_revolutions').GetNameWithNoTooltip]"
 hint_oe_sit_v45_atlantic_revolutions_hint_text: "#T Overview#!\n@hint! #Y Age of Atlantic & Constitutional Revolutions#! unfolds from #Y 1775 to 1830#!. Its bidirectional #Y Revolutionary Fervor#! meter spans #Y -100 to +100#!, shifting map colors and unlocking three distinct ideological endings."
 hint_oe_sit_v45_atlantic_revolutions_administrative: "Convening a Constituent Assembly boosts legislative and cabinet efficiency at the expense of noble satisfaction, while Moderate Constitutional Compromise prioritizes broad estate harmony."
 hint_oe_sit_v45_atlantic_revolutions_diplomatic: "Promulgating the Declaration of Rights energizes literacy and institutions but alarms conservative courts; Forming a Conservative Concert delivers strong diplomatic reputation and legitimacy."
 hint_oe_sit_v45_atlantic_revolutions_military: "Mobilizing the National Guard yields +7% Land Morale and +12% Manpower for revolutionary campaigns, balanced by steeper army maintenance."
 oe_sit_v45_proto_industrialization: "Dawn of Proto-Industrialization"
 oe_sit_v45_proto_industrialization_desc: "From 1750 to 1836, literate societies endowed with coal and iron stand at history's greatest economic inflection point. Dig coal-and-iron canals, reform urban guilds, sponsor steam-pump engineering, found Polytechnic Academies, and enforce factory standards to ignite the Steam & Iron Age."
 oe_v45_ind_end_steam_age: "Triumph of the Steam & Iron Age"
 oe_v45_ind_end_steam_age_desc: "Steam engines, coke blast furnaces, inland canals, and polytechnic colleges shatter Malthusian ceilings, propelling industrial vanguard nations into the machine century."
 oe_v45_ind_end_artisan_synthesis: "Guild-Artisan Synthesis"
 oe_v45_ind_end_artisan_synthesis_desc: "Refined craft workshops and water-powered mills flourish without rapid smokestack upheaval, preserving prestige and civic calm."
 oe_v45_ind_end_industrial_horizon: "Threshold of the Machine Century"
 oe_v45_ind_end_industrial_horizon_desc: "By 1836, coal basins and ironworks glow across the globe, signaling that the age of agrarian empires is giving way to the age of steam."
 oe_v45_ind_map_coal_tt: "#Y Coalfield Industrial Basin#!: Deep coal seams fueling atmospheric steam pumps and coke smelting."
 oe_v45_ind_map_iron_tt: "#Y Metallurgical Iron Heartland#!: Iron ore districts feeding blast furnaces, precision tools, and bored artillery."
 oe_v45_ind_map_pioneer_tt: "#Y Industrializing Pioneer Realm#!: High-literacy or pioneering states driving proto-industrial takeoff."
 oe_v45_ind_legend_coal: "Coal Basins (Steam Fuel)"
 oe_v45_ind_legend_iron: "Iron Metallurgical Heartlands"
 oe_v45_ind_legend_pioneer: "Industrializing Pioneer Realms"
 OE_V45_IND_GUI_HDR_ERA: "Industrial Takeoff"
 OE_V45_IND_GUI_HDR_METER: "Industrial Index"
 OE_V45_IND_GUI_CARD_TITLE: "Coal, Iron, Steam Pumps & Polytechnic Mastery"
 OE_V45_IND_GUI_CARD_BODY: "Literate nations with coal and iron access are crossing into mechanized production. Invest in Coal & Iron Canals, Guild Reform, Steam-Pump Engineering, Polytechnic Academies, and Factory Quality Standards to push the Industrialization Index to 85+ and crown the Steam & Iron Age."
 OE_V45_IND_GUI_GAUGE_LABEL: "Proto-Industrialization Index (85+ ignites Steam & Iron Age)"
 OE_V45_IND_GUI_FOOTNOTE: "Data Map: Ember Orange highlights coal basins; Steel Blue-Grey marks iron heartlands; Emerald Teal highlights literate & pioneering industrial realms."
 hint_oe_sit_v45_proto_industrialization: "[GetSituationByKey('oe_sit_v45_proto_industrialization').GetNameWithNoTooltip]"
 hint_oe_sit_v45_proto_industrialization_hint_text: "#T Overview#!\n@hint! #Y Dawn of Proto-Industrialization#! activates between #Y 1750 and 1836#! once realms reach the Age of Revolutions or pair #Y 25%+ literacy#! with #Y coal or iron#!. Use the five Situation actions to drive #Y Industrialization Index#! from 20 to 85+."
 hint_oe_sit_v45_proto_industrialization_administrative: "Prioritize Sponsor Steam-Pump Engineering and Charter Coal & Iron Canals if you control coal or iron provinces, then Found a Polytechnic Academy to supercharge research and literacy."
 hint_oe_sit_v45_proto_industrialization_diplomatic: "Reforming Urban Guild Monopolies temporarily upsets burghers while Polytechnic Academies trim clergy satisfaction—pace your reforms so estate loyalty stays healthy."
 hint_oe_sit_v45_proto_industrialization_military: "Enforcing Factory Quality Standards adds +2% Discipline alongside production and development growth, while Coke-Smelted Ironworks strengthens siege artillery casting."
 oe_v45_act_silver_manila_galleon: "Manila Galleon Charter"
 oe_v45_act_silver_manila_galleon_desc: "Charter heavily armed ocean-going treasure galleons linking American and Japanese silver mines directly to East and South Asian silk, tea, and porcelain entrepots."
 oe_v45_act_silver_manila_galleon_tt: "Raises Global Silver Index by #G +8#!, grants #Y Manila Galleon Bullion Charter#! for 12 years, and records your realm as a bullion charter power."
 oe_v45_act_silver_single_whip: "Single Whip Silver Tax"
 oe_v45_act_silver_single_whip_desc: "Commute fragmented grain levies and corvee labor obligations into unified silver bullion assessments, anchoring treasury accounts to the global silver network."
 oe_v45_act_silver_single_whip_tt: "Raises Global Silver Index by #G +7#! and enacts #Y Single Whip Silver Commutation#! for 12 years."
 oe_v45_act_silver_bullion_mercantilism: "Bullion Mercantilism"
 oe_v45_act_silver_bullion_mercantilism_desc: "Impose strict bullion export controls and domestic navigation monopolies to hoard precious metal inside sovereign vaults at the cost of global integration."
 oe_v45_act_silver_bullion_mercantilism_tt: "Lowers Global Silver Index by #R -6#! (protectionist hoard) and grants #Y Sovereign Bullion Mercantilism#! for 12 years."
 oe_v45_act_silver_mint_debasement_curbs: "Mint Debasement Curbs"
 oe_v45_act_silver_mint_debasement_curbs_desc: "Enforce strict metallurgical assay standards on royal mints, recall clipped copper-laden coinage, and arrest runaway Price Revolution inflation."
 oe_v45_act_silver_mint_debasement_curbs_tt: "Raises Global Silver Index by #G +9#!, cuts inflation by #G -1.5%#!, and grants #Y Assayed Coinage & Debasement Curbs#! for 12 years."
 oe_v45_act_silver_amsterdam_exchange: "Amsterdam-Antwerp Exchange"
 oe_v45_act_silver_amsterdam_exchange_desc: "Charter an international bullion clearing exchange backed by guaranteed silver deposits and negotiable bills of trade, turning maritime volatility into commercial credit."
 oe_v45_act_silver_amsterdam_exchange_tt: "Raises Global Silver Index by #G +8#! and grants #Y Amsterdam-Antwerp Bullion Exchange#! for 12 years."
 oe_v45_act_lia_relief_granaries: "Ever-Normal Relief Granaries"
 oe_v45_act_lia_relief_granaries_desc: "Construct state-funded provincial grain depots stocked in good harvests to stabilize bread prices and prevent winter famine during the solar minimum."
 oe_v45_act_lia_relief_granaries_tt: "Raises Little Ice Age Resilience by #G +9#! and grants #Y Ever-Normal Relief Granaries#! for 12 years."
 oe_v45_act_lia_hardy_crops: "Hardy New-World Crop Adoption"
 oe_v45_act_lia_hardy_crops_desc: "Sponsor royal seed distributions of frost-tolerant potatoes, sweet potatoes, and hardy maize across upland and northern estates where wheat harvests repeatedly fail."
 oe_v45_act_lia_hardy_crops_tt: "Raises Little Ice Age Resilience by #G +10#! and grants #Y Hardy New-World Crop Estates#! for 14 years."
 oe_v45_act_lia_tax_moratorium: "Peasant Tax Moratorium"
 oe_v45_act_lia_tax_moratorium_desc: "Proclaim an emergency remission of land-tax arrears in frost-struck counties to halt rural depopulation and avert seventeenth-century peasant uprisings."
 oe_v45_act_lia_tax_moratorium_tt: "Raises Little Ice Age Resilience by #G +8#!, grants #G +5#! Stability, and enacts #Y Frost-Year Peasant Tax Moratorium#! for 10 years."
 oe_v45_act_lia_forestry_fuel: "Frost-Resistant Forestry & Fuel Edict"
 oe_v45_act_lia_forestry_fuel_desc: "Regulate royal timber reserves, expand peat and surface-coal cutting, and guarantee winter heating rations for frontier garrisons and towns."
 oe_v45_act_lia_forestry_fuel_tt: "Raises Little Ice Age Resilience by #G +7#! and grants #Y Managed Forestry & Hearth Fuel Edict#! for 12 years."
 oe_v45_act_lia_maritime_grain: "Emergency Maritime Grain Charter"
 oe_v45_act_lia_maritime_grain_desc: "Suspend peacetime shipping tariffs for grain hulls and charter armed cargo fleets to import emergency wheat and rice from warmer coastal granaries."
 oe_v45_act_lia_maritime_grain_tt: "Raises Little Ice Age Resilience by #G +8#! and grants #Y Emergency Maritime Grain Charter#! for 12 years."
 oe_v45_act_rev_constituent_assembly: "Convene Constituent Assembly"
 oe_v45_act_rev_constituent_assembly_desc: "Summon elected delegates from provinces and cities to draft a written constitution, shifting the Atlantic balance decisively toward representative government."
 oe_v45_act_rev_constituent_assembly_tt: "Shifts Revolutionary Fervor by #G +16#!, aligns realm with the #Y Constitutional Camp#!, and grants #Y Constituent National Assembly#! for 12 years."
 oe_v45_act_rev_declaration_rights: "Promulgate Declaration of Rights"
 oe_v45_act_rev_declaration_rights_desc: "Publish a universal charter of civic liberties, press freedom, and legal equality, inspiring reformers across both shores of the Atlantic."
 oe_v45_act_rev_declaration_rights_tt: "Shifts Revolutionary Fervor by #G +18#!, aligns realm with the #Y Constitutional Camp#!, and grants #Y Declaration of Civic Rights#! for 12 years."
 oe_v45_act_rev_national_guard: "Mobilize National Guard"
 oe_v45_act_rev_national_guard_desc: "Arm municipal citizen battalions under tricolor or constitutional standards to defend representative assemblies against interventionist coalitions."
 oe_v45_act_rev_national_guard_tt: "Shifts Revolutionary Fervor by #G +14#!, grants #G +6#! Army Tradition, and enacts #Y Mobilized Citizen National Guard#! for 12 years."
 oe_v45_act_rev_conservative_concert: "Form Conservative Concert"
 oe_v45_act_rev_conservative_concert_desc: "Bind sovereign monarchies in a legitimist diplomatic concert dedicated to dynastic treaties, border stability, and containment of radical upheaval."
 oe_v45_act_rev_conservative_concert_tt: "Shifts Revolutionary Fervor by #B -18#!, aligns realm with the #Y Conservative Concert#!, and grants #Y Conservative Concert of Legitimacy#! for 12 years."
 oe_v45_act_rev_constitutional_compromise: "Moderate Constitutional Compromise"
 oe_v45_act_rev_constitutional_compromise_desc: "Promulgate a balanced charter pairing hereditary executive continuity with an elected legislative chamber, moderating ideological extremes across the realm."
 oe_v45_act_rev_constitutional_compromise_tt: "Moderates Revolutionary Fervor toward #Y 0#!, aligns realm with the #Y Moderate Compromise Camp#!, and grants #Y Moderate Constitutional Charter#! for 12 years."
 oe_v45_act_ind_coal_iron_canals: "Charter Coal & Iron Canals"
 oe_v45_act_ind_coal_iron_canals_desc: "Finance lock-gated inland canals connecting coal seams, iron furnaces, and tidewater quays to slash bulk haulage costs across industrializing heartlands."
 oe_v45_act_ind_coal_iron_canals_tt: "Raises Industrialization Index by #G +9#!, marks your realm an #Y Industrial Pioneer#!, and grants #Y Chartered Coal & Iron Canals#! for 14 years."
 oe_v45_act_ind_reform_guilds: "Reform Urban Guild Monopolies"
 oe_v45_act_ind_reform_guilds_desc: "Break restrictive municipal craft quotas so water-powered spinning mills, ironworks, and rural putting-out networks can scale freely."
 oe_v45_act_ind_reform_guilds_tt: "Raises Industrialization Index by #G +9#! and grants #Y Reformed Urban Workshop Charters#! for 12 years."
 oe_v45_act_ind_steam_pumps: "Sponsor Steam-Pump Engineering"
 oe_v45_act_ind_steam_pumps_desc: "Award royal patents and foundry grants to engineers building atmospheric steam pumps and rotary condensers for deep coal shafts and blast furnaces."
 oe_v45_act_ind_steam_pumps_tt: "Raises Industrialization Index by #G +11#!, grants #G +10#! Research Progress, and enacts #Y Atmospheric Steam-Pump Engineering#! for 14 years."
 oe_v45_act_ind_polytechnic: "Found Polytechnic Academy"
 oe_v45_act_ind_polytechnic_desc: "Establish state colleges of applied mathematics, metallurgy, chemistry, and mechanical drafting to train a permanent corps of industrial engineers."
 oe_v45_act_ind_polytechnic_tt: "Raises Industrialization Index by #G +10#!, grants #G +12#! Research Progress, and enacts #Y Royal Polytechnic Academy#! for 14 years."
 oe_v45_act_ind_factory_standards: "Enforce Factory Quality Standards"
 oe_v45_act_ind_factory_standards_desc: "Institute national weights, interchangeable iron tolerances, and textile inspectorates so early mechanized workshops command global export markets."
 oe_v45_act_ind_factory_standards_tt: "Raises Industrialization Index by #G +8#! and grants #Y Standardized Factory Inspectorate#! for 12 years."
 oe_v45_ws.1.title: "The Silver Mountain & the Ocean Caravans"
 oe_v45_ws.1.desc: "From the high Andean shafts of Potosi and Zacatecas to the coastal tunnels of Iwami in Japan, a river of refined silver now pours into every harbor from Seville and Antwerp to Manila, Malacca, and Guangzhou. Merchants weigh stamped pesos and sycee ingots side by side on harbor scales, marveling that a single mine shaft across the globe can double the price of bread in distant capitals within a generation. Our treasury councillors gather before ledger tables heavy with silver bars, asking whether we should anchor our customs to this oceanic tide or shield domestic prices from its shock."
 oe_v45_ws.1.a: "Open royal customs to trans-oceanic silver convoys and charter clearing houses."
 oe_v45_ws.1.b: "Impose bullion assay standards so silver enriches trade without destabilizing prices."
 oe_v45_ws.1.c: "Tax outbound bullion strictly and keep hard silver locked inside crown vaults."
 oe_v45_ws.2.title: "The Single Whip Silver Commutation"
 oe_v45_ws.2.desc: "Across the vast agrarian empires of East and South Asia, tax registrars are sweeping away centuries of tangled grain quotas, silk deliveries, and unpaid corvee labor in favor of a single, uniform assessment paid in weighed silver. The fiscal convenience is astonishing: provincial revenues arrive faster, army paymasters can purchase weapons directly from workshops, and maritime traders sail halfway round the earth to sell raw bullion where its purchasing power stands highest. Yet village elders warn that whenever ocean convoys are delayed by storms or piracy, peasants must dump their entire autumn harvest for a handful of silver."
 oe_v45_ws.2.a: "Unify all land and labor assessments in assayed silver to modernize the fiscus."
 oe_v45_ws.2.b: "Allow dual payment in silver or grain during lean harvests to protect rural households."
 oe_v45_ws.2.c: "Maintain traditional in-kind granary levies and shield villages from foreign bullion swings."
 oe_v45_ws.3.title: "Iwami Ginzan & the Red-Seal Bullion Run"
 oe_v45_ws.3.desc: "Cupellation furnaces imported across the Korean Strait have transformed Japanese hillside veins at Iwami and Ikuno into one of the richest silver engines on earth. Vermilion-sealed merchant ships—Shuinsen—now crowd the roadsteads of Nagasaki, Macao, Manila, and Ayutthaya, exchanging crates of gleaming chogin bars for raw Chinese silk, Bengal muslin, and European matchlocks. Our maritime brokers urge us to negotiate formal silver-for-silk factors at these Asian crossroads before rival chartered companies seize the entire East China Sea carrying trade."
 oe_v45_ws.3.a: "Charter East Asian silver-for-silk factors and expand ocean freight capacity."
 oe_v45_ws.3.b: "Buy Japanese cupellation methods to boost our own domestic mining and minting."
 oe_v45_ws.3.c: "Levy transit duties on foreign bullion ships entering our coastal straits."
 oe_v45_ws.4.title: "The Price Revolution Shakes the Exchanges"
 oe_v45_ws.4.desc: "Scholars in Salamanca, Antwerp, and Constantinople have begun to notice a troubling paradox: even as fleets unload mountains of silver onto European and Levantine docks, fixed-rent nobles, salaried clerks, and garrison pikemen grow poorer every winter. Grain, wool, and timber prices have doubled and trebled while traditional crown dues remain frozen at century-old nominal rates. Angry pamphlets circulate through the bourse demanding to know whether abundant bullion is truly wealth—or merely a mirage eroding the real foundations of state solvency."
 oe_v45_ws.4.a: "Back a central bullion exchange to stabilize credit bills and re-index customs."
 oe_v45_ws.4.b: "Grant emergency cost-of-living stipends to soldiers and civil officials."
 oe_v45_ws.4.c: "Impose rigid royal price ceilings on grain and cloth across urban markets."
 oe_v45_ws.5.title: "Armored Escorts for the Treasure Convoys"
 oe_v45_ws.5.desc: "Where silver sails, privateers gather like wolves along the windward straits. From the Caribbean passages and Cape Finisterre to the South China Sea, fast raiders carrying letters of marque stalk lumbering treasure hulls heavy with stamped eight-real pieces. Insurance rates at maritime exchanges have soared overnight, threatening to snap the intercontinental chain that pays our arsenals and feeds our customs houses. Our admirals propose organizing twice-yearly armed convoy systems, while bolder captains whisper of licensing our own commerce raiders."
 oe_v45_ws.5.a: "Fund permanent navy convoy squadrons and joint maritime insurance guilds."
 oe_v45_ws.5.b: "Sign anti-piracy escort treaties with neighboring maritime powers."
 oe_v45_ws.5.c: "Issue letters of marque to seize rival treasure fleets on the high seas."
 oe_v45_ws.6.title: "The Sovereign Mint & Assay Reckoning"
 oe_v45_ws.6.desc: "War debts and speculative silver drains have tempted several foreign courts to alloy their domestic coinage with cheap copper, triggering violent Kipper-und-Wipper panics where merchants refuse bad coin at the city gates. Inspectors from our own treasury report worn, clipped pieces circulating in provincial markets alongside crisp milled trade dollars. Before public confidence fractures, the crown must decide whether to absorb the steep immediate cost of a full recoinage in pure silver or quietly trim weight to cover urgent military obligations."
 oe_v45_ws.6.a: "Execute a full recoinage with milled edges and strict royal assay seals."
 oe_v45_ws.6.b: "Establish a joint-stock treasury bank issuing convertible silver receipts."
 oe_v45_ws.6.c: "Quietly debase provincial small coin to pay current garrison arrears."
 oe_v45_ws.7.title: "Frozen Rivers of the Solar Minimum"
 oe_v45_ws.7.desc: "Astronomers peering through brass telescopes report a sun curiously devoid of spots, while chroniclers across Europe, Anatolia, China, and North America record frosts killing blossoms in late May and early snow burying unharvested sheaves in September. Ox carts roll over thick ice on the Thames, the Bosphorus, the Danube, and the Grand Canal; alpine glaciers advance down pastoral valleys, crushing barns beneath walls of blue ice. As wheat prices treble and rural despair spreads, every ruler faces the supreme test of the seventeenth-century General Crisis."
 oe_v45_ws.7.a: "Empty crown reserves to open emergency soup kitchens and rural granaries."
 oe_v45_ws.7.b: "Impose strict urban grain rationing and garrison bread convoys."
 oe_v45_ws.7.c: "Leave parish relief to local nobles and monasteries while shielding crown gold."
 oe_v45_ws.8.title: "Hardy Tubers & Golden Ears Against the Frost"
 oe_v45_ws.8.desc: "Where brittle wheat and barley wither beneath unseasonable sleet, botanists and returning mariners display curious crops brought across the oceans from the Andes and Mesoamerica: rugged potatoes that thrive underground safe from hail and foraging troops, sweet potatoes capable of carpeting steep stony hillsides, and quick-ripening maize yielding four times the calories per acre. Conservative village elders initially eye the strange roots with suspicion, yet one royal demonstration plot planted beside the provincial highway could overturn a century of famine."
 oe_v45_ws.8.a: "Fund royal agricultural manuals and distribute free seed tubers nationwide."
 oe_v45_ws.8.b: "Grant five-year tax exemptions on hillside lands reclaimed with hardy crops."
 oe_v45_ws.8.c: "Stick to proven wheat and rice rotations rather than upsetting estate tithes."
 oe_v45_ws.9.title: "Opening the Ever-Normal Relief Granaries"
 oe_v45_ws.9.desc: "When three consecutive wet summers rot grain in the ear, merchant speculators lock private silos waiting for starvation prices. Provincial governors report that cities equipped with state Ever-Normal Granaries—buying surplus wheat and rice cheaply after abundant harvests and selling below market during bitter winters—have remained calm while neighboring districts erupt into bread riots. Expanding this granary bureau into a permanent imperial institution promises enduring stability, provided we root out corrupt warehouse clerks skimming the sacks."
 oe_v45_ws.9.a: "Institutionalize audited provincial Ever-Normal Granaries across the realm."
 oe_v45_ws.9.b: "Partner with municipal guilds to co-fund shared winter grain reserves."
 oe_v45_ws.9.c: "Seize hoarded private merchant silos outright under martial emergency decrees."
 oe_v45_ws.10.title: "Tax Arrears, Bandits, and Empty Villages"
 oe_v45_ws.10.desc: "Across Eurasia, the Little Ice Age has proved as deadly to proud dynasties as any foreign army. Frozen harvests shrink rural rents at the exact moment war expenditures peak; desperate tax collectors march into snowbound hamlets seizing seed corn and draft oxen, driving starving tenant farmers onto the roads where bandits and millenarian agitators wait. Petitions from our frontier magistrates plead for an immediate moratorium on back taxes before cold and hunger turn quiet provinces into tinderboxes."
 oe_v45_ws.10.a: "Proclaim a sweeping Peasant Tax Moratorium and resettle displaced families."
 oe_v45_ws.10.b: "Convert rural arrears into paid winter work repairing dikes, bridges, and roads."
 oe_v45_ws.10.c: "Enforce full tax collection with cavalry escorts to keep military coffers full."
 oe_v45_ws.11.title: "Hearth Timber, Peat Bogs, and Frozen Mills"
 oe_v45_ws.11.desc: "Longer winters mean six months of blazing hearths in every city from London and Vienna to Beijing and Edo. Nearby coppice woods have been stripped bare to feed domestic chimneys, salt pans, and glassworks, pushing firewood prices beyond what artisans can afford while frozen streams halt water-powered flour mills. Forest wardens and engineers present an unexpected silver lining: systematically harvesting peat bogs and shallow coal outcrops for urban fuel can spare our strategic shipbuilding oak while laying the fuel infrastructure of a coming century."
 oe_v45_ws.11.a: "Enact scientific forestry rotation and subsidize urban coal and peat fuel yards."
 oe_v45_ws.11.b: "Open royal hunting forests to winter deadwood gathering by freezing townsfolk."
 oe_v45_ws.11.c: "Reserve every oak grove strictly for naval shipyards regardless of winter fuel costs."
 oe_v45_ws.12.title: "Grain Fleets Across Ice-Choked Straits"
 oe_v45_ws.12.desc: "While northern steppes and alpine highlands groan under late blizzards, warm harvests along the Mediterranean, Bengal, the Mekong, and southern river deltas still yield rich surpluses. Maritime guilds and canal commissioners propose an ambitious lifeline: waiving every harbor toll on grain cargoes, commissioning ice-reinforced barges and heavy merchantmen, and signing reciprocal food-corridor compacts so no province starves merely because its local sky turned gray. Such convoys cost silver upfront, yet nations that master crisis logistics emerge stronger than empires that fracture."
 oe_v45_ws.12.a: "Charter duty-free maritime and canal grain convoys backed by naval escorts."
 oe_v45_ws.12.b: "Negotiate bilateral emergency grain-for-silver swaps with southern exporters."
 oe_v45_ws.12.c: "Ban all grain exports from our own ports and hoard domestic stocks strictly."
 oe_v45_ws.13.title: "Pamphlets of the Republic of Letters"
 oe_v45_ws.13.desc: "From Boston and Philadelphia to Paris, Amsterdam, Lisbon, and Buenos Aires, fast packet brigs now carry something more flammable than gunpowder: printed constitutional pamphlets, philosophical treatises on the separation of powers, and verbatim debates of distant assemblies. In every coffeehouse and reading club across our cities, lawyers, junior officers, and merchants read aloud that governments derive their just authority from the consent of citizens and codified law. Crown censors ask whether to shutter the presses or invite the sharpest minds into controlled constitutional reform."
 oe_v45_ws.13.a: "Guarantee press debate and invite Enlightenment jurists to draft civic reforms."
 oe_v45_ws.13.b: "Publish an official crown reform manifesto bridging royal tradition and legal rights."
 oe_v45_ws.13.c: "Reinforce royal censorship and coordinate police dossiers with allied crowns."
 oe_v45_ws.14.title: "Oaths of the Constituent Hall"
 oe_v45_ws.14.desc: "Fiscal debts from decades of trans-oceanic rivalry have compelled courts across the Atlantic world to summon estates, provincial assemblies, and national conventions. Once gathered beneath high vaulted roofs, delegates refuse to rubber-stamp new land taxes without first winning a written charter binding ministers to audited budgets and open courts. Crowds pack the harbor square outside, cheering every deputy who calls for a Declaration of Civic Rights, while veteran aristocrats warn that yielding the purse means surrendering the throne itself."
 oe_v45_ws.14.a: "Recognize the Constituent Assembly and codify parliamentary control of taxation."
 oe_v45_ws.14.b: "Negotiate a bicameral charter balancing an upper peerage chamber with elected commons."
 oe_v45_ws.14.c: "Dissolve the defiant hall and uphold indivisible sovereign authority."
 oe_v45_ws.15.title: "Cockades, Barricades, and Citizen Militias"
 oe_v45_ws.15.desc: "Rumors of foreign regiments massing on the frontier and bread shortages in the capital have electrified city quarters from dusk till dawn. Artisans, printers, and university students pin brightly colored cockades to their hats, drill in cobblestone squares with muskets from municipal armories, and proclaim a citizen National Guard answerable to the constitutional nation rather than dynastic mercenaries. Military commanders warn that a politicized militia can either multiply our national fighting spirit or topple royal discipline overnight."
 oe_v45_ws.15.a: "Formalize the National Guard under patriotic officers and merit promotions."
 oe_v45_ws.15.b: "Integrate municipal volunteers into disciplined royal reserve brigades."
 oe_v45_ws.15.c: "Disarm unauthorized street clubs with veteran line infantry and cavalry."
 oe_v45_ws.16.title: "The Legitimist Congress of Envoys"
 oe_v45_ws.16.desc: "Alarmed by cascading constitutional proclamations and colonial republics across the ocean, grand chancellors of the major monarchies have convened a stately diplomatic congress beneath gilded chandeliers. Their protocol calls for a Conservative Concert of sovereign powers pledged to uphold historic borders, dynastic legitimacy, and mutual diplomatic solidarity against revolutionary contagion. Our envoys await instructions: shall we sign the legitimist compact, mediate a moderate charter settlement, or denounce the congress as a league of tyrants?"
 oe_v45_ws.16.a: "Join the Conservative Concert to safeguard dynastic legitimacy and balance."
 oe_v45_ws.16.b: "Broker a non-intervention charter respecting both reformed crowns and republics."
 oe_v45_ws.16.c: "Reject the legitimist protocol and champion constitutional self-determination."
 oe_v45_ws.17.title: "Chartered Parliament or Sovereign Veto"
 oe_v45_ws.17.desc: "After years of turbulent speeches and anxious diplomacy, a generation of pragmatic statesmen steps forward across Europe and the Americas arguing that neither unbridled radicalism nor brittle absolutism can govern a complex commercial society. They draft a concise constitutional compromise: an independent judiciary, a publicly audited treasury, guaranteed property and religious tolerance, and a steady executive shielded from faction coups. Whether our realm embraces this middle way, pushes further toward popular sovereignty, or tightens royal command will echo for decades."
 oe_v45_ws.17.a: "Enact the Moderate Constitutional Compromise to reconcile crown, nobles, and citizens."
 oe_v45_ws.17.b: "Expand the franchise boldly and enshrine full legislative supremacy."
 oe_v45_ws.17.c: "Preserve an advisory council only and retain final sovereign decree."
 oe_v45_ws.18.title: "Echoes Across Two Atlantic Shores"
 oe_v45_ws.18.desc: "Colonial ports from Charleston and Veracruz to Cartagena and Rio de Janeiro have broken out of closed mercantilist monopolies, signing direct commercial charters with constitutional states and maritime republics across the ocean. Ship captains bring not only coffee, cotton, and silver, but also constitutional blueprints translated into six languages. As the revolutionary century crests, our chancellery must decide how to anchor our overseas commerce and diplomatic alignment in this transformed Atlantic order."
 oe_v45_ws.18.a: "Recognize constitutional maritime charters and sign open Atlantic trade treaties."
 oe_v45_ws.18.b: "Offer neutral mediation and commercial clearing rights to all Atlantic factions."
 oe_v45_ws.18.c: "Back historic colonial metropoles with naval convoys and legitimist guarantees."
 oe_v45_ws.19.title: "The Atmospheric Pump in the Deep Shaft"
 oe_v45_ws.19.desc: "For centuries, miners digging rich seams of coal and iron ore had to abandon their deepest galleries the moment groundwater flooded the tunnels. Today, beside a soot-blackened pithead, an iron cylinder hisses with pressurized steam, rocking a massive oak beam that lifts torrents of black water steadily into the daylight without a single draft horse. Visiting scholars, artillery founders, and mine proprietors stare in hushed awe: for the first time in human history, heat from buried coal is turning directly into tireless mechanical work."
 oe_v45_ws.19.a: "Grant royal patents and treasury funds to scale atmospheric steam engines."
 oe_v45_ws.19.b: "Commission practical field trials at crown arsenals and dockyards first."
 oe_v45_ws.19.c: "Tax coal-burning contraptions to protect traditional horse-gin and timber guilds."
 oe_v45_ws.20.title: "Putting-Out Looms Against Urban Guild Masters"
 oe_v45_ws.20.desc: "Enterprising cloth merchants have begun bypassing chartered city guilds altogether, distributing raw wool and cotton to hundreds of rural cottages and congregating multi-spindle spinning frames inside water-powered mills along fast river bends. Guild aldermen march into the town hall waving medieval parchment charters, warning that unchecked workshops will shatter centuries-old apprenticeship standards and flood the streets with impoverished journeymen. Yet export figures show that regions embracing mechanized workshops already undersell traditional rivals by half."
 oe_v45_ws.20.a: "Abolish restrictive guild output quotas and charter mechanized manufactories."
 oe_v45_ws.20.b: "Retrain displaced master artisans as salaried foremen inside new workshops."
 oe_v45_ws.20.c: "Uphold guild monopolies in luxury crafts and restrict rural spinning frames."
 oe_v45_ws.21.title: "Coke Blast Furnaces & Smelted Iron"
 oe_v45_ws.21.desc: "Ironmasters once watched their furnaces fall cold whenever surrounding woodlands ran out of charcoal. Now a revolutionary metallurgical triumph glows red-gold inside brick blast towers: baking sulfurous coal into clean coke allows towering furnaces to run month after month, pouring flawless molten iron for bridges, steam cylinders, precision machine beds, and bored siege cannon. Building full-scale coke ironworks demands steep capital and disciplined coal deliveries, yet any power that masters cheap iron commands the skeleton of modern industry and war."
 oe_v45_ws.21.a: "Co-finance regional coke blast furnaces and state cannon-boring foundries."
 oe_v45_ws.21.b: "Offer low-interest royal credit to private ironmasters adopting coke smelting."
 oe_v45_ws.21.c: "Import foreign iron castings for now and keep domestic capital in maritime trade."
 oe_v45_ws.22.title: "Gearwheels, Blueprints, and Polytechnic Scholars"
 oe_v45_ws.22.desc: "Gone are the days when industrial breakthroughs came solely from lone tinkerers working by candlelight. Across scientific societies and royal academies, mathematicians calculate boiler pressures, chemists refine bleach and sulphuric acid for textile mills, and draftsmen publish standardized engineering engravings readable from Manchester to Milan and Osaka. Leading savants petition the crown to found a dedicated Polytechnic Academy uniting theoretical physics with workshop practice—training civil, mining, and artillery engineers in a single corps."
 oe_v45_ws.22.a: "Endow a national Polytechnic Academy with metallurgy and mechanics laboratories."
 oe_v45_ws.22.b: "Offer annual royal cash prizes for practical inventions in textiles and mining."
 oe_v45_ws.22.c: "Keep higher education anchored in classical law, rhetoric, and court diplomacy."
 oe_v45_ws.23.title: "Barge Locks Linking Coalfield to Harbor"
 oe_v45_ws.23.desc: "Muddy turnpikes choke the flow of coal and pig iron every autumn: a single draft horse pulling a wagon on rutted clay can haul barely a ton, whereas the same horse towing a flat-bottomed barge along a level canal effortlessly pulls thirty tons across stone aqueducts and stepped locks. Canal syndicates lay survey maps before the treasury showing how a web of lock-gated waterways linking our inland coalfields to iron foundries and coastal ports could cut fuel prices in half within a single decade."
 oe_v45_ws.23.a: "Charter a national Coal & Iron Canal network backed by state engineering corps."
 oe_v45_ws.23.b: "Authorize private toll-canal joint-stock charters with modest crown oversight."
 oe_v45_ws.23.c: "Prioritize macadamized military post roads over commercial barge canals."
 oe_v45_ws.24.title: "The Smokestack Horizon & Factory Standards"
 oe_v45_ws.24.desc: "Tall brick chimneys now rise beside cathedral spires and fortress towers across the industrializing world, trailing gray plumes over humming water-frames, steam hammers, and iron rail spurs. Yet rapid factory growth brings sharp growing pains: uneven thread gauges, exploding boilers, and bitter clashes over workshop hours threaten to tarnish our exports and ignite urban unrest. Ministers of commerce urge the crown to establish a national Factory Inspectorate enforcing standardized weights, interchangeable parts, and boiler safety—sealing our passage into the industrial century."
 oe_v45_ws.24.a: "Establish a national Factory Standards & Precision Gauge Inspectorate."
 oe_v45_ws.24.b: "Adopt rapid laissez-faire deregulation to maximize short-term mill expansion."
 oe_v45_ws.24.c: "Cap heavy smokestack construction near capitals and favor refined craft workshops."
