l_english:
 oe_sit_v45_hre_golden_bull: "The Golden Bull & Electoral Constitution"
 oe_sit_v45_hre_golden_bull_desc: "Between 1345 and 1410, the Holy Roman Emperor, the seven Electors, the Imperial Free Cities, and the territorial princes hammer out the foundational Golden Bull constitution of the Reich—deciding whether imperial prerogative or electoral autonomy commands Central Europe."
 oe_v45_hre_bull_out_imperial: "Imperial Golden Bull Supremacy"
 oe_v45_hre_bull_out_imperial_desc: "The codified Golden Bull elevates Roman imperial jurisdiction, Landfriede peace enforcement, and coronation prestige across the Holy Roman Empire."
 oe_v45_hre_bull_out_electoral: "Electoral Estates Constitution"
 oe_v45_hre_bull_out_electoral_desc: "Sworn Wahlkapitulation compacts and indivisible electoral regalia entrench the liberties of the seven Electors and Free Cities across Germany."
 oe_v45_hre_bull_out_compromise: "Compromise of Nuremberg & Metz"
 oe_v45_hre_bull_out_compromise_desc: "By 1410, the constitutional struggle settles into a pragmatic balance between the Emperor's dignity and the traditional liberties of the imperial estates."
 oe_v45_hre_map_emperor_tt: "#Y Holy Roman Emperor#!: custodian of the Roman Crown and imperial Landfriede."
 oe_v45_hre_map_elector_tt: "#Y Imperial Elector#!: pillar of the Electoral College voting the King of the Romans."
 oe_v45_hre_map_free_city_tt: "#Y Imperial Free City#!: self-governing commercial metropolis directly beneath the Emperor."
 oe_v45_hre_map_prince_tt: "#Y Imperial Prince#!: territorial estate weighing loyalty to Crown and Diet."
 oe_sit_v45_hre_imperial_diet: "Perpetual Imperial Diet & Reichsreform"
 oe_sit_v45_hre_imperial_diet_desc: "From 1470 to 1600, Emperor and Estates convene at Worms, Augsburg, Nuremberg, and Regensburg to build lasting federal institutions: the Reichskammergericht High Court, the Common Penny levy, the ten Imperial Circles, and the Perpetual Imperial Diet."
 oe_v45_hre_diet_out_reform: "Consolidated Reichsreform"
 oe_v45_hre_diet_out_reform_desc: "Imperial courts, regional Circles, and a permanent Diet knit the Holy Roman Empire into a resilient, law-governed constitutional commonwealth."
 oe_v45_hre_diet_out_federation: "Federated Perpetual Diet"
 oe_v45_hre_diet_out_federation_desc: "The Perpetual Diet at Regensburg endures as Europe's premier diplomatic congress, mediating disputes among German princes and free cities."
 oe_v45_hre_diet_out_particularism: "Estates' Particularism Prevails"
 oe_v45_hre_diet_out_particularism_desc: "By 1600, resistance to imperial taxation leaves reform incomplete, encouraging princes and cities to strengthen their own territorial states."
 oe_v45_hre_diet_map_emperor_tt: "#Y Imperial Crown#!: presiding over Reichsreform and the Perpetual Diet."
 oe_v45_hre_diet_map_elector_tt: "#Y College of Electors#!: senior chamber shaping imperial statutes and taxation."
 oe_v45_hre_diet_map_free_city_tt: "#Y Bench of Free Cities#!: urban host and commercial financier of the Imperial Diet."
 oe_v45_hre_diet_map_circle_tt: "#Y Imperial Circle Estate#!: territorial prince participating in Reichskreise defense and law."
 oe_sit_v45_hre_confessional_leagues: "Confessional Leagues & Peace of Augsburg-Westphalia"
 oe_sit_v45_hre_confessional_leagues_desc: "Between 1555 and 1655, the Reformation divides the Holy Roman Empire into the Catholic League, the Evangelical Union, and Conciliatory Princes—testing whether Central Europe achieves Westphalian confessional parity or plunges into total religious rupture."
 oe_v45_hre_confess_out_westphalia: "Peace of Westphalia & Confessional Parity"
 oe_v45_hre_confess_out_westphalia_desc: "The twin congresses of Münster and Osnabrück enshrine Catholic and Protestant parity across the Reich, opening a new era of diplomatic law."
 oe_v45_hre_confess_out_militant: "Triumph of Confessional Militancy"
 oe_v45_hre_confess_out_militant_desc: "Uncompromising league mobilization overrides diplomatic compromise, forging hardened armies while leaving deep ideological scars across Germany."
 oe_v45_hre_confess_out_augsburg: "Exhausted Augsburg Settlement"
 oe_v45_hre_confess_out_augsburg_desc: "By 1655, decades of confessional rivalry subside into weary territorial coexistence under local religious customs."
 oe_v45_hre_confess_map_catholic_tt: "#Y Catholic League Estate#!: imperial territory aligned with the Roman Church and Catholic defense."
 oe_v45_hre_confess_map_protestant_tt: "#Y Evangelical Union Estate#!: Protestant principality or free city defending Reformed and Lutheran liberties."
 oe_v45_hre_confess_map_conciliatory_tt: "#Y Conciliatory Prince#!: imperial estate championing Cuius Regio compromise and Westphalian peace."
 oe_sit_v45_hre_austro_prussian_dualism: "Austro-Prussian Dualism & Twilight of the Reich"
 oe_sit_v45_hre_austro_prussian_dualism_desc: "From 1740 to 1820, Habsburg Austria, Hohenzollern Brandenburg-Prussia, and the Third-Germany middle states clash over Silesia, military reform, imperial mediatization, and the ultimate survival or dissolution of the thousand-year Holy Roman Crown."
 oe_v45_hre_dual_out_habsburg: "Habsburg Imperial Renewal"
 oe_v45_hre_dual_out_habsburg_desc: "Vienna successfully rallies the imperial chanceries and Danubian armies to preserve and modernize the Holy Roman Crown against northern rivalry."
 oe_v45_hre_dual_out_prussia: "Hohenzollern Northern Hegemony"
 oe_v45_hre_dual_out_prussia_desc: "Cantonal discipline and relentless statecraft elevate Brandenburg-Prussia to supreme leadership across Northern Germany, eclipsing Vienna."
 oe_v45_hre_dual_out_twilight: "Twilight of the Old Reich"
 oe_v45_hre_dual_out_twilight_desc: "Mediatization and revolutionary upheaval bring the thousand-year medieval Reich to a dignified close as modernized German states claim full sovereignty."
 oe_v45_hre_dual_map_habsburg_tt: "#Y Habsburg Imperium#!: Vienna and the Imperial Crown upholding the Pragmatic Sanction."
 oe_v45_hre_dual_map_prussia_tt: "#Y Hohenzollern Northern Power#!: Brandenburg-Prussia forging cantonal discipline and northern German hegemony."
 oe_v45_hre_dual_map_third_germany_tt: "#Y Third-Germany Middle State#!: imperial kingdom, duchy, or city balancing between Vienna and Berlin."
 hint_oe_sit_v45_hre_golden_bull: "[GetSituationByKey('oe_sit_v45_hre_golden_bull').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_golden_bull_hint_text: "#T Overview#!\n@hint! #Y The Golden Bull & Electoral Constitution#! spans #Y 1345–1410#! while the Holy Roman Empire exists. The data map highlights the Emperor (gold), Electors (crimson), Free Cities (teal), and Princes (amber). Use the five Situation actions to push #Y Constitutional Balance#! (-100 Electoral Autonomy to +100 Imperial Prerogative) and raise #Y Codification#! to 70+ for a decisive ending."
 hint_oe_sit_v45_hre_golden_bull_administrative: "Enacting Territorial Landfriede and guaranteeing Imperial Free Cities builds stable tax and trade foundations while steadily raising Constitutional Codification."
 hint_oe_sit_v45_hre_golden_bull_diplomatic: "As Emperor, convene the Frankfurt Coronation Diet and Codify Seven Electorates to secure +65 Constitutional Balance and bonus Imperial Authority; as an Elector or Prince, assert Princely Capitulation to swing toward -65 Electoral Liberties."
 hint_oe_sit_v45_hre_golden_bull_military: "Keeping internal imperial peace organically raises Codification each month, whereas prolonged interregnums pull Constitutional Balance sharply toward electoral autonomy."
 hint_oe_sit_v45_hre_imperial_diet: "[GetSituationByKey('oe_sit_v45_hre_imperial_diet').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_imperial_diet_hint_text: "#T Overview#!\n@hint! #Y Perpetual Imperial Diet & Reichsreform#! spans #Y 1470–1600#!. Track #Y Reichsreform Momentum#! (0..100) and #Y Estates & Diet Consensus#! (0..100) as Emperor and estates debate the Reichskammergericht High Court, Common Penny tax, Imperial Circles, and Regensburg Perpetual Diet."
 hint_oe_sit_v45_hre_imperial_diet_administrative: "The Common Penny tax surges Reform Momentum (+16) and immediate treasury income but lowers Diet Consensus (-6); pair it with the Reichskammergericht and Regensburg Perpetual Diet to keep Consensus above 55."
 hint_oe_sit_v45_hre_imperial_diet_diplomatic: "Non-Emperor estates can invoke Estates' Gravamina to boost domestic stability and Consensus while curbing imperial centralization toward a Federated Perpetual Diet."
 hint_oe_sit_v45_hre_imperial_diet_military: "Organizing the ten Imperial Circles strengthens national defense and manpower across participating realms while avoiding Consensus erosion from prolonged imperial wars."
 hint_oe_sit_v45_hre_confessional_leagues: "[GetSituationByKey('oe_sit_v45_hre_confessional_leagues').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_confessional_leagues_hint_text: "#T Overview#!\n@hint! #Y Confessional Leagues & Peace of Augsburg-Westphalia#! spans #Y 1555–1655#!. The data map distinguishes Catholic League estates (crimson), Evangelical Union states (blue), and Conciliatory Princes (gold). Shape #Y Confessional Tension#! (-100..+100) and #Y Westphalian Accord#! (0..100)."
 hint_oe_sit_v45_hre_confessional_leagues_administrative: "Proclaiming Cuius Regio and mediating the Westphalian Congress unlock high heretic tolerance, prosperity, and research speed at the price of slower missionary conversion."
 hint_oe_sit_v45_hre_confessional_leagues_diplomatic: "Push Westphalian Accord to 85 (or lower Tension to -60 after 1595) to ratify Confessional Parity and earn +6 Imperial Authority plus a 40-year diplomatic renaissance."
 hint_oe_sit_v45_hre_confessional_leagues_military: "Mobilizing the Catholic League Treasury, rallying the Evangelical Union, or enforcing Ecclesiastical Reservation yields potent army modifiers while driving Tension toward +85 Militant Triumph."
 hint_oe_sit_v45_hre_austro_prussian_dualism: "[GetSituationByKey('oe_sit_v45_hre_austro_prussian_dualism').GetNameWithNoTooltip]"
 hint_oe_sit_v45_hre_austro_prussian_dualism_hint_text: "#T Overview#!\n@hint! #Y Austro-Prussian Dualism & Twilight of the Reich#! spans #Y 1740–1820#!. The data map distinguishes Habsburg Austria / Imperial Crown (gold), Hohenzollern Brandenburg-Prussia (Prussian blue), and Third-Germany middle states (emerald). Contest #Y Dualism Balance#! (-100..+100) and #Y Old Reich Integrity#! (0..100)."
 hint_oe_sit_v45_hre_austro_prussian_dualism_administrative: "Imperial Mediatization sharply boosts control, integration speed, and taxation, yet each enactment erodes Old Reich Integrity (-10) and accelerates the Twilight of the Reich."
 hint_oe_sit_v45_hre_austro_prussian_dualism_diplomatic: "Austria and imperial loyalists win Habsburg Renewal at Dualism >= +70 with Integrity >= 50 via Pragmatic Sanction and Crown Renewal; Third-Germany states can deploy the Princes' League to stabilize Integrity while curbing Austrian overreach."
 hint_oe_sit_v45_hre_austro_prussian_dualism_military: "Brandenburg-Prussia can pair Cantonal Mobilization with Crown Reckoning to swing Dualism to -70 for Hohenzollern Northern Hegemony, while direct Austro-Prussian war drains Old Reich Integrity every month."
 OE_V45_HRE_BULL_HDR_L: "Constitutional Balance"
 OE_V45_HRE_BULL_HDR_R: "Golden Bull Codification"
 OE_V45_HRE_BULL_CARD_TITLE: "The Golden Bull & Electoral Constitution (1345-1410)"
 OE_V45_HRE_BULL_CARD_BODY: "Emperor, seven Electors, Imperial Free Cities, and Princes contest the foundational charter of the Holy Roman Empire. Push Constitutional Balance to +65 (Imperial Prerogative) or -65 (Electoral Autonomy) with Codification >= 70 to seal the Reich's constitutional destiny."
 OE_V45_HRE_GAUGE_BULL_CONST: "Electoral Autonomy (-100) <-> Imperial Prerogative (+100)"
 OE_V45_HRE_GAUGE_BULL_CODIF: "Constitutional Codification Progress"
 OE_V45_HRE_DIET_HDR_L: "Reichsreform Momentum"
 OE_V45_HRE_DIET_HDR_R: "Estates & Diet Consensus"
 OE_V45_HRE_DIET_CARD_TITLE: "Perpetual Imperial Diet & Reichsreform (1470-1600)"
 OE_V45_HRE_DIET_CARD_BODY: "Build the Reichskammergericht High Court, levy the Common Penny tax, organize the ten Imperial Circles, and charter the Regensburg Perpetual Diet. Reach Reform Momentum >= 85 with Diet Consensus >= 55 for Consolidated Reichsreform, or champion Estates' Gravamina."
 OE_V45_HRE_GAUGE_DIET_MOMENTUM: "Reichsreform Institutional Momentum"
 OE_V45_HRE_GAUGE_DIET_CONSENSUS: "Imperial Estates & Diet Consensus"
 OE_V45_HRE_CONFESS_HDR_L: "Confessional Tension"
 OE_V45_HRE_CONFESS_HDR_R: "Westphalian Accord"
 OE_V45_HRE_CONFESS_CARD_TITLE: "Confessional Leagues & Peace of Augsburg-Westphalia (1555-1655)"
 OE_V45_HRE_CONFESS_CARD_BODY: "Catholic League, Evangelical Union, and Conciliatory Princes vie for the soul of the Reich. Drive Westphalian Accord to 85 (or Tension <= -60 after 1595) for Confessional Parity, or push Tension to +85 after 1615 for Militant Confessional Hegemony."
 OE_V45_HRE_GAUGE_CONFESS_TENSION: "Reconciliation (-100) <-> Confessional Rupture (+100)"
 OE_V45_HRE_GAUGE_CONFESS_ACCORD: "Augsburg-Westphalia Diplomatic Accord"
 OE_V45_HRE_DUAL_HDR_L: "Dualism Balance"
 OE_V45_HRE_DUAL_HDR_R: "Old Reich Integrity"
 OE_V45_HRE_DUAL_CARD_TITLE: "Austro-Prussian Dualism & Twilight of the Reich (1740-1820)"
 OE_V45_HRE_DUAL_CARD_BODY: "Habsburg Vienna, Hohenzollern Berlin, and Third-Germany middle states contest the twilight of the thousand-year Reich. Reach +70 with Integrity >= 50 for Habsburg Imperial Renewal, -70 for Northern Hegemony, or watch the Old Reich yield to mediatized sovereign states."
 OE_V45_HRE_GAUGE_DUAL_BALANCE: "Northern Hegemony (-100) <-> Habsburg Imperium (+100)"
 OE_V45_HRE_GAUGE_DUAL_INTEGRITY: "Constitutional Integrity of the Old Reich"
 oe_v45_hre_act_codify_seven_electorates: "Codify Seven Electorates"
 oe_v45_hre_act_codify_seven_electorates_desc: "Enshrine the indivisible lands and majority voting procedure of the seven Imperial Electorates under the Golden Bull, advancing Constitutional Codification and raising Imperial Authority."
 oe_v45_hre_act_codify_seven_electorates_tt: "Advances Golden Bull Codification by #G +14#!, raises Imperial Authority by #G +3#!, and shifts Constitutional Balance toward Imperial Prerogative (if Emperor) or Electoral Autonomy (if Elector)."
 oe_v45_hre_act_guarantee_free_cities: "Guarantee Imperial Free Cities"
 oe_v45_hre_act_guarantee_free_cities_desc: "Confirm imperial immediacy, guild self-rule, and toll-free fair charters for the Free Cities of Swabia, Franconia, and the Rhineland."
 oe_v45_hre_act_guarantee_free_cities_tt: "Advances Golden Bull Codification by #G +10#! and shifts Constitutional Balance (+8 Emperor / -6 Free City or Prince)."
 oe_v45_hre_act_territorial_landfriede: "Establish Territorial Landfriede"
 oe_v45_hre_act_territorial_landfriede_desc: "Proclaim a sworn public peace across imperial highways to curb private feuds and robber barons, strengthening imperial order and domestic control."
 oe_v45_hre_act_territorial_landfriede_tt: "Shifts Constitutional Balance by #G +10#! toward Imperial Prerogative, advances Codification by #G +12#!, and grants #G +3#! Imperial Authority."
 oe_v45_hre_act_princely_capitulation: "Assert Princely Capitulation"
 oe_v45_hre_act_princely_capitulation_desc: "Bind future Kings of the Romans to a sworn Wahlkapitulation guaranteeing electoral tolls, regional estates, and princely autonomy."
 oe_v45_hre_act_princely_capitulation_tt: "Shifts Constitutional Balance by #Y -14#! toward Electoral Autonomy and advances Codification by #G +10#!."
 oe_v45_hre_act_frankfurt_coronation_diet: "Convene Frankfurt Coronation Diet"
 oe_v45_hre_act_frankfurt_coronation_diet_desc: "Summon the arch-offices and imperial estates to Frankfurt and Aachen to solemnize the electoral liturgy and seal the Golden Bull constitution."
 oe_v45_hre_act_frankfurt_coronation_diet_tt: "Advances Golden Bull Codification by #G +16#!, grants #G +4#! Imperial Authority, and shifts Constitutional Balance (+10 Emperor / -8 Elector)."
 oe_v45_hre_act_reichskammergericht: "Establish Reichskammergericht High Court"
 oe_v45_hre_act_reichskammergericht_desc: "Charter the supreme Imperial Chamber Court to adjudicate disputes across principalities and free cities under written Roman jurisprudence."
 oe_v45_hre_act_reichskammergericht_tt: "Raises Reichsreform Momentum by #G +14#!, Estates Consensus by #G +8#!, and Imperial Authority by #G +3#!."
 oe_v45_hre_act_common_penny_tax: "Levy Common Penny Imperial Tax"
 oe_v45_hre_act_common_penny_tax_desc: "Enact the Gemeiner Pfennig empire-wide defense assessment to fund imperial armies and courts, accelerating Reichsreform at the expense of Estates' patience."
 oe_v45_hre_act_common_penny_tax_tt: "Raises Reichsreform Momentum by #G +16#! and Imperial Authority by #G +4#!, while lowering Estates Consensus by #R -6#!."
 oe_v45_hre_act_imperial_circles: "Organize Imperial Circles"
 oe_v45_hre_act_imperial_circles_desc: "Group the estates into coordinated regional Reichskreise responsible for mutual defense quotas, mint inspections, and highway security."
 oe_v45_hre_act_imperial_circles_tt: "Raises Reichsreform Momentum by #G +14#!, Estates Consensus by #G +10#!, and Imperial Authority by #G +3#!."
 oe_v45_hre_act_regensburg_perpetual_diet: "Charter Regensburg Perpetual Diet"
 oe_v45_hre_act_regensburg_perpetual_diet_desc: "Transform occasional imperial assemblies into a permanent ambassadorial Reichstag seated at Regensburg uniting Electors, Princes, and Free Cities."
 oe_v45_hre_act_regensburg_perpetual_diet_tt: "Raises Reichsreform Momentum by #G +12#!, Estates Consensus by #G +14#!, and Imperial Authority by #G +3#!."
 oe_v45_hre_act_estates_gravamina: "Defend Estates' Gravamina"
 oe_v45_hre_act_estates_gravamina_desc: "Present formal constitutional grievances before the Imperial Diet to safeguard territorial liberties and check imperial fiscal centralization."
 oe_v45_hre_act_estates_gravamina_tt: "Raises Estates Consensus by #G +14#! while slowing Reichsreform Momentum by #Y -10#!."
 oe_v45_hre_act_cuius_regio: "Proclaim Cuius Regio Compromise"
 oe_v45_hre_act_cuius_regio_desc: "Endorse the Augsburg formula allowing each territorial ruler to determine public worship while guaranteeing orderly emigration rights, cooling confessional tension."
 oe_v45_hre_act_cuius_regio_tt: "Lowers Confessional Tension by #G -14#!, raises Westphalian Accord by #G +14#!, and marks this realm as a Conciliatory Prince."
 oe_v45_hre_act_catholic_league_treasury: "Mobilize Catholic League Treasury"
 oe_v45_hre_act_catholic_league_treasury_desc: "Pool Bavarian, Austrian, and Rhenish ecclesiastical contributions into a Catholic League war chest to defend imperial Catholicism by arms."
 oe_v45_hre_act_catholic_league_treasury_tt: "Raises Confessional Tension by #R +16#!, trims Westphalian Accord by #R -6#!, and mobilizes Catholic League field armies."
 oe_v45_hre_act_evangelical_union: "Rally Evangelical Union"
 oe_v45_hre_act_evangelical_union_desc: "Unite Lutheran and Reformed principalities and free cities in a sworn defensive coalition with shared artillery parks and war chests."
 oe_v45_hre_act_evangelical_union_tt: "Raises Confessional Tension by #R +16#!, trims Westphalian Accord by #R -6#!, and rallies Evangelical Union regiments."
 oe_v45_hre_act_westphalian_congress: "Mediate Westphalian Congress"
 oe_v45_hre_act_westphalian_congress_desc: "Host parallel Catholic and Protestant envoys at Münster and Osnabrück to draft an enduring peace of territorial sovereignty and confessional parity."
 oe_v45_hre_act_westphalian_congress_tt: "Lowers Confessional Tension by #G -18#!, surges Westphalian Accord by #G +18#!, and grants #G +3#! Imperial Authority."
 oe_v45_hre_act_ecclesiastical_reservation: "Enforce Ecclesiastical Reservation"
 oe_v45_hre_act_ecclesiastical_reservation_desc: "Apply imperial law to prevent secularization of prince-bishoprics and cathedral lands, defending imperial authority while inflaming confessional disputes."
 oe_v45_hre_act_ecclesiastical_reservation_tt: "Raises Confessional Tension by #R +14#!, edges Westphalian legal definition by #G +4#!, and grants #G +3#! Imperial Authority."
 oe_v45_hre_act_pragmatic_sanction: "Pragmatic Sanction Guarantee"
 oe_v45_hre_act_pragmatic_sanction_desc: "Secure binding European and imperial guarantees for Habsburg dynastic succession and the integrity of the Roman Crown."
 oe_v45_hre_act_pragmatic_sanction_tt: "Shifts Dualism Balance by #G +16#! toward Habsburg Imperium, raises Old Reich Integrity by #G +10#!, and grants #G +4#! Imperial Authority."
 oe_v45_hre_act_prussian_cantonal: "Prussian Cantonal Mobilization"
 oe_v45_hre_act_prussian_cantonal_desc: "Implement the Kantonreglement regimental recruiting districts and iron infantry drill to challenge Habsburg hegemony across Germany."
 oe_v45_hre_act_prussian_cantonal_tt: "Shifts Dualism Balance by #Y -16#! toward Northern Hegemony and strains Old Reich Integrity by #R -6#!."
 oe_v45_hre_act_third_germany_league: "Third-Germany Princes' League"
 oe_v45_hre_act_third_germany_league_desc: "Organize Bavaria, Saxony, Hanover, Württemberg, and imperial middle states into a Fürstenbund protecting German constitutional equilibrium."
 oe_v45_hre_act_third_germany_league_tt: "Shifts Dualism Balance by #Y -8#! against Habsburg dominance while bolstering Old Reich Integrity by #G +12#!."
 oe_v45_hre_act_imperial_mediatization: "Imperial Mediatization Reform"
 oe_v45_hre_act_imperial_mediatization_desc: "Consolidate fragmented ecclesiastical enclaves and micro-lordships into rationalized modern provinces, eroding medieval imperial structures."
 oe_v45_hre_act_imperial_mediatization_tt: "Reduces Old Reich Integrity by #R -10#!, shifts Dualism Balance (+8 Emperor/HAB, -8 others), and strengthens domestic administration."
 oe_v45_hre_act_dissolve_or_renew_crown: "Dissolve or Renew the Crown"
 oe_v45_hre_act_dissolve_or_renew_crown_desc: "Force the final constitutional reckoning of the Holy Roman Crown: either proclaim a renewed imperial compact from Vienna or accelerate the dissolution of medieval feudal allegiance."
 oe_v45_hre_act_dissolve_or_renew_crown_tt: "Decisively drives Dualism Balance & Old Reich Integrity (+14/+14 & +5 IA for Emperor/HAB; -14/-14 for Prussia/challengers)."
 oe_v45_hre.1.title: "The Seven Seals of Nuremberg"
 oe_v45_hre.1.desc: "Beneath the winter banners of Nuremberg Castle, imperial jurists lay thirty-one Latin chapters sealed in hammered gold before the assembled Electors and princes. For generations, rival double elections and papal writs of approval have plunged Germany into civil war after every emperor's death. Now the chancery proposes to codify the exact seven electoral votes, make their territories indivisible by primogeniture, and declare majority election at Frankfurt binding without outside confirmation—yet every prince asks whether the Golden Bull crowns the Emperor or immortalizes an oligarchy of seven."
 oe_v45_hre.1.a: "Enforce imperial oversight over electoral succession and coronation oaths."
 oe_v45_hre.1.b: "Confirm full electoral regalia, mining monopolies, and non-appeal courts."
 oe_v45_hre.1.c: "Inscribe balanced reciprocal pledges between Crown and Electoral College."
 oe_v45_hre.2.title: "Leagues of the Swabian & Rhenish Free Cities"
 oe_v45_hre.2.desc: "Delegations of velvet-robed burghers from Ulm, Augsburg, Nuremberg, Frankfurt, and Speyer arrive at court bearing ledgers of silver tolls and urgent complaints. Alarmed that imperial cities might be pawned by cash-strapped monarchs to territorial dukes, dozens of free municipalities have forged sworn Swabian and Rhenish urban leagues armed with crossbow militias and mercenary pikemen. Territorial princes denounce these urban confederations as forbidden conspiracies under the Golden Bull, whereas city magistrates insist that only prosperous, autonomous burghers can finance the empire's roads, fairs, and silver credit."
 oe_v45_hre.2.a: "Protect Free City immediacy and outlaw pawning imperial cities to princes."
 oe_v45_hre.2.b: "Dissolve armed urban leagues to appease territorial princes and electors."
 oe_v45_hre.2.c: "Mediate a joint urban-princely tariff court overseeing Rhine and Danube trade."
 oe_v45_hre.3.title: "Robber Barons & the Imperial Landfriede"
 oe_v45_hre.3.desc: "Along the steep crags above the Rhine, Main, and Neckar valleys, impoverished lesser knights have turned medieval right of feud into systematic highway extortion. Merchant wagons bound for the Frankfurt Easter Fair are ambushed beneath ruined toll castles, forcing caravans to hire private escorts while imperial judges lack troops to enforce a single verdict. Now bishops, princes, and city councils demand an iron-clad Landfriede—a sworn public peace backed by mounted execution squads—yet each estate fears handing permanent police powers to its rivals."
 oe_v45_hre.3.a: "Commission imperial Landfriede captains to raze unlawful toll castles."
 oe_v45_hre.3.b: "Entrust regional enforcement to local princes and provincial diets."
 oe_v45_hre.3.c: "Recruit repentant knights into salaried border escorts along imperial fairs."
 oe_v45_hre.4.title: "The Electoral Capitulation of Rhense"
 oe_v45_hre.4.desc: "Beneath the walnut trees of the Königsstuhl at Rhense where four electoral borders meet along the Rhine, envoys of Mainz, Cologne, Trier, the Palatinate, Saxony, Brandenburg, and Bohemia convene in solemn conclave. They invoke their ancient constitutional trust as pillars of the Holy Roman Empire, insisting that no monarch may alienate imperial fiefs, levy extraordinary dues, or declare imperial war without prior electoral consent. In the imperial chancellery, advisors warn that conceding a written Wahlkapitulation could reduce the Emperor to first among equals, while defying the College risks paralysis at the next election."
 oe_v45_hre.4.a: "Reject binding capitulations and assert direct imperial fief prerogative."
 oe_v45_hre.4.b: "Swear the Electoral Capitulation to anchor princely liberties in law."
 oe_v45_hre.4.c: "Establish annual Electors' Days rotating across imperial cities."
 oe_v45_hre.5.title: "Bells of Frankfurt & the Crown of Aachen"
 oe_v45_hre.5.desc: "All the bells of St. Bartholomew's Cathedral in Frankfurt ring out as heraldic trumpets summon the seven Arch-Offices of the Empire to the ceremonial banquet in the Römerberg square. From the Arch-Chancellor of Germany carrying the silver seal to the Arch-Marshal bearing the imperial sword and the Arch-Cupbearer pouring Franconian wine, every gesture dramatizes the sacred constitution forged since 1345. As pilgrims and ambassadors follow the imperial regalia onward to Charlemagne's marble throne in Aachen, the realm must decide what spirit will animate this newly ratified imperial order for the coming century."
 oe_v45_hre.5.a: "Proclaim the indivisible majesty of the Roman Crown over all German lands."
 oe_v45_hre.5.b: "Celebrate the Empire as a federated brotherhood of Electors, Princes, and Cities."
 oe_v45_hre.5.c: "Endow imperial law faculties in Prague, Vienna, and Heidelberg to train Reich jurists."
 oe_v45_hre.6.title: "The Diet of Worms & the Eternal Landfriede"
 oe_v45_hre.6.desc: "Under vaulted Gothic rafters in Worms, Archbishop-Electors, dukes, and city syndics open the most ambitious reform session in the history of the Reich. Faced with powerful western monarchies and Ottoman advances up the Danube, reformist statesmen insist that medieval feudal levies can no longer defend Germany. They propose an Eternal Public Peace outlawing all private warfare forever, paired with an independent Reichskammergericht High Court staffed by learned doctors of Roman law—demanding that both Emperor and princes submit their quarrels to written justice rather than the sword."
 oe_v45_hre.6.a: "Ratify the Eternal Landfriede and endow the Reichskammergericht bench."
 oe_v45_hre.6.b: "Insist the Emperor appoint the Chief Justice to keep appellate power close."
 oe_v45_hre.6.c: "Reserve territorial appeal exemptions for senior Electors and major duchies."
 oe_v45_hre.7.title: "Resistance to the Common Penny Levy"
 oe_v45_hre.7.desc: "No sooner do imperial commissioners ride out with tax registers for the Gemeiner Pfennig—the Empire's first universal property and poll assessment—than angry protests erupt from the Swiss Alps to the North Sea ports. Imperial knights declare that freemen serve with steel lances rather than peasant coin, free cities complain their merchant ledgers are audited twice while princely domains underreport their wealth, and provincial estates withhold receipts until guaranteed a voice over how every florin is spent. Without reliable fiscal revenue, however, both the Imperial Chamber Court and frontier garrisons face imminent bankruptcy."
 oe_v45_hre.7.a: "Enforce uniform collection through imperial treasurers in Frankfurt."
 oe_v45_hre.7.b: "Convert the levy into Matrikel military quotas paid by each estate's own treasury."
 oe_v45_hre.7.c: "Suspend the direct poll tax and grant emergency customs concessions instead."
 oe_v45_hre.8.title: "The Ten Imperial Circles & Regional Defense"
 oe_v45_hre.8.desc: "Cartographers spread a sweeping chart of Central Europe across the Diet table, dividing hundreds of overlapping duchies, bishoprics, counties, and free cities into ten coherent Imperial Circles—from Swabia, Franconia, and Bavaria to Upper Saxony, Lower Rhine-Westphalia, and Austria. Each circle will convene its own regional assembly, appoint a circle captain to execute Reichskammergericht rulings, inspect silver mints against debasement, and muster joint regiments against foreign invasion. Smaller estates hail the Circles as a vital shield against predatory neighbors, while great houses weigh whether circle leadership expands their regional hegemony."
 oe_v45_hre.8.a: "Empower Circle Captains with standing joint arsenals and mint inspectors."
 oe_v45_hre.8.b: "Focus Circles on uniform silver coinage, weights, and inter-city roads."
 oe_v45_hre.8.c: "Keep Circle assemblies consultative so princes retain full military command."
 oe_v45_hre.9.title: "The Perpetual Assembly of Regensburg"
 oe_v45_hre.9.desc: "Inside the timber-vaulted Reichssaal of Regensburg's Old Town Hall, an unprecedented transformation takes shape: instead of dispersing after a few costly weeks of royal pageantry, the envoys of the Electors, the College of Princes, and the Bench of Imperial Free Cities remain permanently accredited to negotiate treaties, taxes, and imperial law year-round. Critics scoff at endless parchment protocols and tedious precedence disputes over red velvet chairs, yet seasoned diplomats recognize that a continuous federal congress gives the fragmented German lands an enduring institutional voice unmatched anywhere in Europe."
 oe_v45_hre.9.a: "Grant the Free Cities equal deliberative weight alongside Electors and Princes."
 oe_v45_hre.9.b: "Place an Imperial Principal Commissioner at the head of all three colleges."
 oe_v45_hre.9.c: "Require unanimous electoral approval for every new imperial statute."
 oe_v45_hre.10.title: "Gravamina of the German Estates & Imperial Knights"
 oe_v45_hre.10.desc: "Bundles of sealed Gravamina—formal lists of constitutional, fiscal, and ecclesiastical grievances—pile high before the Diet clerks. Territorial estates protest foreign wars fought for dynastic ambitions outside German soil, imperial knights lament that gunpowder infantry and territorial bureaucracies are crushing their ancestral immediacy, and burgher delegates denounce ecclesiastical court fees draining silver southward across the Alps. How the Empire answers these voices will determine whether Reichsreform earns the voluntary loyalty of Germany or stalls amid bitter estate obstruction."
 oe_v45_hre.10.a: "Publish an Imperial Recess answering the Gravamina with fiscal accountability."
 oe_v45_hre.10.b: "Charter autonomous Imperial Knight Cantons directly loyal to the Crown."
 oe_v45_hre.10.c: "Defer contentious estate petitions to provincial princely courts."
 oe_v45_hre.11.title: "The Formula of Augsburg: Cuius Regio, Eius Religio"
 oe_v45_hre.11.desc: "In the gilded merchant halls of Augsburg, exhausted Catholic and Lutheran plenipotentiaries hammer out a landmark legal compromise to end decades of confessional bloodshed across the Empire. Under the principle of Cuius Regio, Eius Religio—whose realm, his religion—each sovereign prince may establish either the Roman Church or the Augsburg Confession inside his own borders, while dissenting subjects receive the lawful right to sell their homes and emigrate in peace. Yet two glaring omissions haunt the parchment: Calvinist Reformed estates are left outside the legal umbrella, and fiercely disputed bishoprics remain tinderboxes waiting for a single spark."
 oe_v45_hre.11.a: "Extend generous parity courts in bi-confessional cities to broaden the peace."
 oe_v45_hre.11.b: "Hold strictly to the letter of Augsburg and exclude further doctrinal concessions."
 oe_v45_hre.11.c: "Quietly fund confessional seminaries and defensive pacts to prepare for renewal of strife."
 oe_v45_hre.12.title: "The Ecclesiastical Reservation & Cologne Crisis"
 oe_v45_hre.12.desc: "A constitutional thunderbolt strikes the Rhineland when a sitting Prince-Archbishop embraces the Reformation yet refuses to vacate his electoral cathedral see, seeking to transform an ancient ecclesiastical electorate into a hereditary Protestant principality. Catholic princes immediately invoke the Reservatum Ecclesiasticum—the Ecclesiastical Reservation decreeing that any converting prelate forfeits his lands—because losing Cologne would hand an irreversible majority in the Electoral College to the Protestant camp. Protestant jurists counter that the Reservation was imposed by imperial fiat rather than estate consent, and regiments begin marching along both banks of the Rhine."
 oe_v45_hre.12.a: "Enforce the Ecclesiastical Reservation with Bavarian and Imperial troops."
 oe_v45_hre.12.b: "Challenge the Reservation and back secularized cathedral administrations."
 oe_v45_hre.12.c: "Broker a neutral cathedral chapter settlement preserving the Electoral balance."
 oe_v45_hre.13.title: "Donauwörth Incident & the Rival Leagues"
 oe_v45_hre.13.desc: "What began as a brawling street clash over a Catholic religious procession inside the predominantly Lutheran Imperial Free City of Donauwörth has exploded into an empire-wide constitutional rupture. Placed under imperial ban and occupied by Bavarian forces, the city's fate convinces Protestant estates at the Regensburg Diet that imperial courts no longer offer impartial justice. Within months, the Palatinate leads Protestant princes into the armed Evangelical Union, answered immediately by Bavaria's Catholic League—splitting the Holy Roman Empire into two bristling military camps awaiting only a succession crisis."
 oe_v45_hre.13.a: "Rally the confessional banners and stock gunpowder magazines for war."
 oe_v45_hre.13.b: "Convene a moderate Saxony-style Mediation Party refusing both armed leagues."
 oe_v45_hre.13.c: "Restore Donauwörth's free-city charters under joint Circle arbitrators."
 oe_v45_hre.14.title: "Defenestration & the Bohemian Storm"
 oe_v45_hre.14.desc: "Shocked couriers gallop into every German capital bearing news from Hradčany Castle in Prague: furious Bohemian noble estates have hurled royal governors from the chancery windows after disputes over the Letter of Majesty guaranteeing Protestant worship. Overnight, what seemed a local royal quarrel threatens to draw the Catholic League, the Evangelical Union, Spain, Denmark, Sweden, and France into a devastating war across Central Europe. Princes and burghers alike face an agonizing choice between seizing ideological victory amidst the flames or desperately containing the conflagration before Germany is laid waste."
 oe_v45_hre.14.a: "Mobilize field armies immediately to decide the Bohemian crown by battle."
 oe_v45_hre.14.b: "Offer Prague and Vienna a guaranteed Letter of Majesty arbitration treaty."
 oe_v45_hre.14.c: "Fortify homeland borders and declare armed circle neutrality."
 oe_v45_hre.15.title: "Twin Treaties of Münster and Osnabrück"
 oe_v45_hre.15.desc: "After years of grueling courier shuttles between the Catholic congress hall of Münster and the Protestant assembly chamber of Osnabrück, over a hundred diplomats stand ready to affix wax seals to the Peace of Westphalia. The draft recognizes Catholic, Lutheran, and Reformed confessions as equal estates of the Empire, fixes a Normal Year to end disputes over church property forever, and confirms the territorial sovereignty of every prince and free city inside the constitutional shelter of the Reich. Whether hailed as the rebirth of European diplomacy or mourned as the end of universal religious unity, a new era dawns."
 oe_v45_hre.15.a: "Sign the full Peace of Westphalia guaranteeing tri-confessional parity and amnesty."
 oe_v45_hre.15.b: "Pair religious parity with an Imperial Reconstruction Fund for war-torn provinces."
 oe_v45_hre.15.c: "Hold out for stricter confessional victory terms before sheathing the sword."
 oe_v45_hre.16.title: "The Pragmatic Sanction & Silesian Gambit"
 oe_v45_hre.16.desc: "Candlelight trembles across the gilded mirrors of Vienna as the Habsburg succession passes under the Pragmatic Sanction—the hard-won constitutional decree binding Austria, Bohemia, and Hungary into one indivisible inheritance. Yet scarcely has the ink dried on European guarantees before disciplined blue-coated regiments from Brandenburg-Prussia mass along the Oder frontier, eyeing the wealthy linen towns and silver mines of Silesia. Across Germany, electors and free cities watch breathlessly: will the ancient imperial hierarchy hold firm around Vienna, or has a fierce northern challenger broken Habsburg primacy forever?"
 oe_v45_hre.16.a: "Rally the Imperial Diet behind Vienna and defend the Pragmatic Sanction."
 oe_v45_hre.16.b: "Strike swiftly in the north to shatter Habsburg monopoly over the Reich."
 oe_v45_hre.16.c: "Demand electoral mediation and territorial guarantees before choosing sides."
 oe_v45_hre.17.title: "Cantons, Drill & the Potsdam Guard"
 oe_v45_hre.17.desc: "From the parade grounds of Potsdam to the drill squares of Magdeburg and Königsberg, a revolutionary military machine astonishes European observers. Under the cantonal recruiting system, every noble estate and peasant district feeds dedicated regiments drilled to fire disciplined rolling volleys at triple speed and execute oblique-order flank marches on command. In Vienna and Munich, royal ministers debate whether to answer Berlin by creating an equally austere fiscal-military state—or to lean instead on enlightened legal codes, Danubian wealth, and the diplomatic prestige of the Imperial Crown."
 oe_v45_hre.17.a: "Adopt cantonal conscription and oblique-order drill across our field armies."
 oe_v45_hre.17.b: "Launch enlightened Theresian-Josephinist administrative and fiscal reforms."
 oe_v45_hre.17.c: "Invest in Enlightenment academies, porcelain manufactories, and urban trade."
 oe_v45_hre.18.title: "The Fürstenbund: Third-Germany Speaks"
 oe_v45_hre.18.desc: "Alarmed by schemes to barter Bavaria for the distant Austrian Netherlands—and equally wary of unchecked Hohenzollern expansion across northern Germany—the princes of Saxony, Hanover, Mainz, Württemberg, Baden, and Hesse forge the Fürstenbund, the League of Princes. Representing the vibrant cultural and commercial heartland of 'Third Germany,' these middle states declare that the Holy Roman Empire belongs neither to Vienna's dynastic swaps nor to Berlin's parade barracks, but to the lawful equilibrium of all German estates. Both great powers suddenly discover they cannot reshape the Reich without courting Munich, Dresden, and Weimar."
 oe_v45_hre.18.a: "Champion the Fürstenbund to preserve constitutional balance across Germany."
 oe_v45_hre.18.b: "Offer middle-state electors generous imperial guarantees to win them back to Vienna."
 oe_v45_hre.18.c: "Fold northern German middle states into a Prussian-led customs and defense bloc."
 oe_v45_hre.19.title: "Reichsdeputationshauptschluss: The Great Mediatization"
 oe_v45_hre.19.desc: "An extraordinary imperial delegation at Regensburg unveils the most radical territorial redrawing of Central Europe in eight centuries: the secularization of ancient prince-bishoprics and abbey lands, alongside the mediatization of dozens of tiny free cities and knightly enclaves into larger modern kingdoms and grand duchies. Overnight, the Catholic ecclesiastical bench that long underpinned Habsburg electoral majorities evaporates, leaving Austria facing a streamlined Germany of ambitious secular powers. Yet reformers argue that only rationalizing three hundred medieval patchwork lordships can save Germany from revolutionary conquest."
 oe_v45_hre.19.a: "Execute sweeping mediatization to forge modern, compact territorial states."
 oe_v45_hre.19.b: "Defend the remaining ecclesiastical electorates and Free City charters in law."
 oe_v45_hre.19.c: "Compensate displaced prelates and knights with modern state pensions and offices."
 oe_v45_hre.20.title: "Twilight of the Double-Headed Eagle"
 oe_v45_hre.20.desc: "Across the Hofburg balcony in Vienna and the chancelleries of Berlin, Munich, and Frankfurt, a solemn silence falls over the fate of the thousand-year Holy Roman Empire. Revolution, Napoleonic coalitions, and Austro-Prussian dualism have strained the venerable medieval constitution to its breaking point. Before the ancient crown of Otto the Great is either laid down forever or reforged into a modern Central European federation, the rulers of Germany must render history's final verdict: renew the Roman imperial dignity, build a northern German powerhouse, or step boldly into an age of sovereign nation-states."
 oe_v45_hre.20.a: "Proclaim a Reformed Imperial Federal Constitution beneath the Double-Headed Eagle!"
 oe_v45_hre.20.b: "Champion a modern Northern German Union led by Prussian arms and reform!"
 oe_v45_hre.20.c: "Release the estates from medieval fealty and enter the modern sovereign age."
