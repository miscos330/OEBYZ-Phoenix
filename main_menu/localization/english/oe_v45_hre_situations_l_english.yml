 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_ecclesiastical_res: "Imperial mandates safeguard prince-bishoprics and cathedral chapters from secularization, bolstering clerical loyalty at the expense of confessional harmony."
 oe_v45_hre_mod_act_pragmatic_sanction: "Pragmatic Sanction Guarantee"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_pragmatic_sanction: "Pragmatic Sanction Guarantee"
