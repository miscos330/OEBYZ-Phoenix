 oe_v45_hre_mod_confess_westphalian_parity: "Westphalian Confessional Parity"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_confess_westphalian_parity: "Westphalian Confessional Parity"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_confess_westphalian_parity: "Mutual recognition of Catholic and Evangelical estates ends confessional war and revives Central European scholarship, moderating militant zeal."
 oe_v45_hre_mod_confess_militant_triumph: "Triumph of the Confessional Leagues"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_confess_militant_triumph: "Triumph of the Confessional Leagues"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_confess_militant_triumph: "Years of league mobilization forge battle-hardened pike-and-shot armies and fierce doctrinal solidarity while scarring Central European diplomacy."
 oe_v45_hre_mod_confess_augsburg_truce: "Exhausted Augsburg Confessional Truce"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_confess_augsburg_truce: "Exhausted Augsburg Confessional Truce"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_confess_augsburg_truce: "Decades of confessional friction settle into weary territorial coexistence, prioritizing urban recovery over bold diplomatic initiatives."
 oe_v45_hre_mod_dual_habsburg_renewal: "Habsburg Renewal of the Imperial Crown"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_dual_habsburg_renewal: "Habsburg Renewal of the Imperial Crown"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_dual_habsburg_renewal: "Vienna rallies the imperial chanceries and Danubian armies to preserve the Roman dignity across Central Europe, incurring heavy court and garrison outlays."
 oe_v45_hre_mod_dual_prussian_ascendancy: "Hohenzollern Northern Hegemony"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_dual_prussian_ascendancy: "Hohenzollern Northern Hegemony"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_dual_prussian_ascendancy: "Cantonal drill, austere bureaucracy, and disciplined infantry propel the northern German kingdom to paramount power at the cost of relentless military taxation."
 oe_v45_hre_mod_dual_twilight_sovereignty: "Sovereign Estates of the Twilight Reich"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_dual_twilight_sovereignty: "Sovereign Estates of the Twilight Reich"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_dual_twilight_sovereignty: "As medieval feudal bonds dissolve across Germany, mediatized kingdoms and duchies modernize administration while losing old imperial protections."
 oe_v45_hre_mod_act_seven_electorates: "Codified Seven Electorates"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_seven_electorates: "Codified Seven Electorates"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_seven_electorates: "Indivisible electoral principalities and clear succession ballots avert disputed double elections, while binding the court to electoral consent."
 oe_v45_hre_mod_act_free_cities: "Imperial Free City Charters"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_free_cities: "Imperial Free City Charters"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_free_cities: "Guaranteed market fairs and self-governing guilds turn Nuremberg, Frankfurt, and Augsburg into bustling commercial engines, irritating territorial lords."
 oe_v45_hre_mod_act_landfriede: "Territorial Landfriede Peace"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_landfriede: "Territorial Landfriede Peace"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_landfriede: "Sworn regional peace leagues suppress private feuds and robber knights along imperial highways, requiring paid mounted patrols."
 oe_v45_hre_mod_act_capitulation: "Electoral Capitulation Compact"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_capitulation: "Electoral Capitulation Compact"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_capitulation: "Sworn Wahlkapitulation clauses shield princely customs tolls and regional diets against imperial encroachment, softening unified defense."
 oe_v45_hre_mod_act_frankfurt_diet: "Frankfurt Coronation Assembly"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_frankfurt_diet: "Frankfurt Coronation Assembly"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_frankfurt_diet: "Magnificent electoral ceremonies in Frankfurt and Aachen broadcast imperial dignity throughout Christendom at substantial ceremonial expense."
 oe_v45_hre_mod_act_reichskammergericht: "Reichskammergericht High Court"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_reichskammergericht: "Reichskammergericht High Court"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_reichskammergericht: "Roman-law jurists adjudicate princely border suits and urban appeals across the empire, curbing feudal self-help while checking baronial privilege."
 oe_v45_hre_mod_act_common_penny: "Common Penny Imperial Levy"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_common_penny: "Common Penny Imperial Levy"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_common_penny: "An empire-wide wealth and hearth assessment fills the Reich defense chest, provoking sharp grumbling among taxpayers and provincial diets."
 oe_v45_hre_mod_act_imperial_circles: "Ten Imperial Circles Organization"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_imperial_circles: "Ten Imperial Circles Organization"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_imperial_circles: "Regional circle assemblies coordinate coinage standards, frontier garrisons, and mutual muster quotas, adding regional administrative overhead."
 oe_v45_hre_mod_act_regensburg_diet: "Regensburg Perpetual Diet"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_regensburg_diet: "Regensburg Perpetual Diet"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_regensburg_diet: "Permanent envoys of Electors, Princes, and Free Cities deliberate continuously on imperial treaties, enriching diplomacy while slowing cabinet decrees."
 oe_v45_hre_mod_act_gravamina: "Charter of Estates' Gravamina"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_gravamina: "Charter of Estates' Gravamina"
