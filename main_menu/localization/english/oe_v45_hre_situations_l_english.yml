 oe_v45_hre_mod_act_westphalia_congress: "Münster & Osnabrück Peace Mediation"
 STATIC_MODIFIER_NAME_oe_v45_hre_mod_act_westphalia_congress: "Münster & Osnabrück Peace Mediation"
 STATIC_MODIFIER_DESC_oe_v45_hre_mod_act_westphalia_congress: "Dual diplomatic congresses draft durable sovereign guarantees and religious amnesty, lifting European prestige while softening military readiness."
