 oe_jp2_dec_unite_chrysanthemum_sword.title: "Unite the Chrysanthemum and Sword"
 oe_jp2_dec_unite_chrysanthemum_sword.desc: "Having secured Kyoto, Edo, or Osaka and at least forty provinces across the archipelago, formally proclaim a unified national order binding imperial prestige to supreme martial law. Costs 200 gold."
 oe_jp2_dec_unite_chrysanthemum_sword.a: "Proclaim Unified Rule"
 oe_jp2_dec_open_rangaku_academy.title: "Open the Rangaku Academy"
 oe_jp2_dec_open_rangaku_academy.desc: "Establish a state-chartered academy of Dutch learning to systematically translate European treatises on astronomy, navigation, medicine, and ordnance. Requires a port and the year 1640; costs 150 gold."
 oe_jp2_dec_open_rangaku_academy.a: "Charter the Academy"
 oe_jp2_dec_modernize_coastal_defenses.title: "Modernize Coastal Defenses & Foundries"
 oe_jp2_dec_modernize_coastal_defenses.desc: "Erect sea-fortress batteries guarding our key straits and cast heavy iron artillery in reverberatory furnaces to meet the challenge of ocean-going steam fleets. Requires a port and the year 1780; costs 250 gold."
 oe_jp2_dec_modernize_coastal_defenses.a: "Fortify the Straits"
 STATIC_MODIFIER_NAME_oe_jp2_mod_sankin_kotai: "Sankin-Kotai Alternate Attendance"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sankin_kotai: "Provincial lords march in grand retinues to the shogunal capital each alternate year, binding their families and treasuries to the Bakufu."
 STATIC_MODIFIER_NAME_oe_jp2_mod_sword_hunt: "Great Sword Hunt Edict"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sword_hunt: "Blades and matchlocks confiscated from villages are melted into bolts for great temple halls, curbing rural uprisings and sharpening standing retinues."
 STATIC_MODIFIER_NAME_oe_jp2_mod_shuinsen_charter: "Shogunate Red Seal Charters"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shuinsen_charter: "Licensed merchantmen bearing vermilion shogunal seals carry Japanese silver and swords to Siam, Luzon, and Annam, returning laden with raw silk."
 STATIC_MODIFIER_NAME_oe_jp2_mod_bakufu_banner_levy: "Bakufu Banner Mobilization"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bakufu_banner_levy: "Direct vassals and hereditary retainers muster under the shogun's horse-standard in strict proportion to their assessed rice stipends."
 STATIC_MODIFIER_NAME_oe_jp2_mod_chrysanthemum_sword: "Harmony of Chrysanthemum and Sword"
 STATIC_MODIFIER_DESC_oe_jp2_mod_chrysanthemum_sword: "Imperial mandate from Kyoto and martial supremacy across the provinces unite in a single sovereign order over the archipelago."
 STATIC_MODIFIER_NAME_oe_jp2_mod_rangaku_academy: "Shogunal Rangaku Academy"
 STATIC_MODIFIER_DESC_oe_jp2_mod_rangaku_academy: "Scholars of Dutch learning translate European treatises on astronomy, ballistics, chemistry, and medicine inside state-sponsored academies."
 STATIC_MODIFIER_NAME_oe_jp2_mod_coastal_bastions: "Modernized Coastal Bastions"
 STATIC_MODIFIER_DESC_oe_jp2_mod_coastal_bastions: "Star-shaped sea batteries, iron-casting furnaces, and Western-rigged coastal guard ships watch every strait leading into the bays."
 STATIC_MODIFIER_NAME_oe_jp2_mod_court_mediation: "Imperial Court Mediation"
 STATIC_MODIFIER_DESC_oe_jp2_mod_court_mediation: "Ceremonial envoys and senior court nobles broker truces between rival military houses under the prestige of the chrysanthemum seal."
 STATIC_MODIFIER_NAME_oe_jp2_mod_shugo_marshal: "Constable-Marshal Commissions"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shugo_marshal: "Provincial constables receive half-tax military commissions to raise armed provincial retainers for the protracted court war."
 STATIC_MODIFIER_NAME_oe_jp2_mod_muromachi_protocol: "Protocol of the Palace of Flowers"
 STATIC_MODIFIER_DESC_oe_jp2_mod_muromachi_protocol: "From the grand residence in Muromachi, the shogunate weaves the three deputy houses and four magistrate clans into a gilded court hierarchy."
 STATIC_MODIFIER_NAME_oe_jp2_mod_meitoku_accord: "The Meitoku Reconciliation"
 STATIC_MODIFIER_DESC_oe_jp2_mod_meitoku_accord: "With the Three Sacred Treasures restored to Kyoto, fifty-six years of rival imperial claims close in solemn concord."
 STATIC_MODIFIER_NAME_oe_jp2_mod_kitayama_culture: "Kitayama Golden Splendor"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kitayama_culture: "Gilded Zen pavilions, classical Noh drama, and refined continental arts radiate from Kyoto across the archipelago."
 STATIC_MODIFIER_NAME_oe_jp2_mod_tokusei_relief: "Virtuous Governance Debt Relief"
 STATIC_MODIFIER_DESC_oe_jp2_mod_tokusei_relief: "Cancelling pawnshop debts quiets agrarian leagues around the capital, though moneylenders and brewers tighten their credit."
 STATIC_MODIFIER_NAME_oe_jp2_mod_bakufu_crackdown: "Warehouse & Guild Protection"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bakufu_crackdown: "Shogunal patrols guard Kyoto pawnbrokers and merchant guilds, preserving tax revenue at the cost of sullen villages."
 STATIC_MODIFIER_NAME_oe_jp2_mod_sengoku_mobilization: "Sengoku Total Mobilization"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sengoku_mobilization: "As the old shugo order burns in Kyoto, ruthless provincial warlords turn every valley into a proving ground of tactics and ambition."
 STATIC_MODIFIER_NAME_oe_jp2_mod_higashiyama_arts: "Higashiyama Wabi-Sabi"
 STATIC_MODIFIER_DESC_oe_jp2_mod_higashiyama_arts: "In quiet tea rooms, ink-wash scrolls, and raked gravel gardens, austere beauty endures untouched by the flames of civil war."
 STATIC_MODIFIER_NAME_oe_jp2_mod_ashigaru_drill: "Drilled Ashigaru Pike Corps"
 STATIC_MODIFIER_DESC_oe_jp2_mod_ashigaru_drill: "Uniform long-shafted yari pikes and volley-drilled peasant footmen transform war from knightly duels into disciplined mass battle."
 STATIC_MODIFIER_NAME_oe_jp2_mod_ikko_concordat: "Temple-Town Concordat"
 STATIC_MODIFIER_DESC_oe_jp2_mod_ikko_concordat: "Recognizing the chartered autonomy of fortified Buddhist temple towns turns zealous congregations into loyal defenders of our borders."
 STATIC_MODIFIER_NAME_oe_jp2_mod_daimyo_suppression: "Suppression of Militant Leagues"
 STATIC_MODIFIER_DESC_oe_jp2_mod_daimyo_suppression: "Relentless siege campaigns dismantle armed temple fortresses and subordinate religious estates to secular domain law."
 STATIC_MODIFIER_NAME_oe_jp2_mod_bunkokuho_code: "Bunkokuho Domain Law Code"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bunkokuho_code: "Written house laws regulate vassal succession, dyke corvee, and coinage, forging fragmented estates into a cohesive territorial state."
 STATIC_MODIFIER_NAME_oe_jp2_mod_kunitomo_gunsmiths: "Kunitomo & Sakai Matchlock Forges"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kunitomo_gunsmiths: "Master ironworkers master spiral-welded barrels and screw breeches, turning out thousands of reliable tanegashima matchlocks each season."
 STATIC_MODIFIER_NAME_oe_jp2_mod_okehazama_audacity: "Audacity of Okehazama"
 STATIC_MODIFIER_DESC_oe_jp2_mod_okehazama_audacity: "Swift forced marches through storm and gorge teach our commanders that bold initiative can shatter armies ten times their size."
 STATIC_MODIFIER_NAME_oe_jp2_mod_rakuichi_rakuza: "Rakuichi-Rakuza Free Markets"
 STATIC_MODIFIER_DESC_oe_jp2_mod_rakuichi_rakuza: "Abolishing toll barriers and closed guild monopolies fills castle-town streets with traveling merchants, coin brokers, and artisans."
 STATIC_MODIFIER_NAME_oe_jp2_mod_nagashino_volley: "Three-Rank Volley Doctrine"
 STATIC_MODIFIER_DESC_oe_jp2_mod_nagashino_volley: "Rotating ranks of gunners firing over bamboo palisades maintain a continuous wall of lead capable of breaking the fiercest cavalry charge."
 STATIC_MODIFIER_NAME_oe_jp2_mod_azuchi_atakebune: "Stone Keeps & Ironclad Atakebune"
 STATIC_MODIFIER_DESC_oe_jp2_mod_azuchi_atakebune: "Battered dry-stone castle bastions on land and iron-sheathed oared warships at sea establish overwhelming material dominance."
 STATIC_MODIFIER_NAME_oe_jp2_mod_osaka_citadel: "Citadel of the Realm's Kitchen"
 STATIC_MODIFIER_DESC_oe_jp2_mod_osaka_citadel: "Granite ramparts towering over the Yodo River delta anchor both national defense and the archipelago's richest rice and bullion exchange."
 STATIC_MODIFIER_NAME_oe_jp2_mod_taiko_kenchi: "Taiko Kenchi Cadastral Registry"
 STATIC_MODIFIER_DESC_oe_jp2_mod_taiko_kenchi: "Uniform measuring poles and village-by-village rice assessments sweep away overlapping medieval dues and reveal true agrarian wealth."
 STATIC_MODIFIER_NAME_oe_jp2_mod_heino_bunri: "Heino-Bunri: Warrior & Farmer"
 STATIC_MODIFIER_DESC_oe_jp2_mod_heino_bunri: "With cultivators bound to the soil and stipended warriors garrisoned in castle towns, armies can campaign year-round without harvest desertions."
 STATIC_MODIFIER_NAME_oe_jp2_mod_sekigahara_hegemony: "Triumph at Sekigahara"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sekigahara_hegemony: "Victory at the decisive crossroads of Mino redistributes vast fiefs and awes every surviving daimyo into acknowledging supreme command."
 STATIC_MODIFIER_NAME_oe_jp2_mod_bakuhan_order: "Bakuhan Taisei & Four-Tier Peace"
 STATIC_MODIFIER_DESC_oe_jp2_mod_bakuhan_order: "Laws for the Military Houses and the settled hierarchy of samurai, farmer, artisan, and merchant inaugurate generations of domestic tranquility."
 STATIC_MODIFIER_NAME_oe_jp2_mod_shimabara_pacification: "Temple Registry & Coastal Vigilance"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shimabara_pacification: "Strict temple census registries and vigilant coastal watchtowers eliminate clandestine foreign networks along the Kyushu littoral."
 STATIC_MODIFIER_NAME_oe_jp2_mod_shimabara_clemency: "Kyushu Tax Relief & Port Mediation"
 STATIC_MODIFIER_DESC_oe_jp2_mod_shimabara_clemency: "Dismissing rapacious local magistrates and moderating maritime edicts eases rural despair while keeping Kyushu ports humming with commerce."
 STATIC_MODIFIER_NAME_oe_jp2_mod_dejima_rangaku: "Dejima Window of Dutch Learning"
 STATIC_MODIFIER_DESC_oe_jp2_mod_dejima_rangaku: "Through the fan-shaped island in Nagasaki harbor flow annual world newsbooks, lenses, clocks, and surgical instruments from Europe."
 STATIC_MODIFIER_NAME_oe_jp2_mod_genroku_renaissance: "Genroku Floating World"
 STATIC_MODIFIER_DESC_oe_jp2_mod_genroku_renaissance: "Woodblock prints, bunraku puppet stages, kabuki playhouses, and publishing houses flourish across Edo, Kyoto, and Osaka."
 STATIC_MODIFIER_NAME_oe_jp2_mod_kyoho_fiscal: "Kyoho Reclamation & Dojima Exchange"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kyoho_fiscal: "Reclaimed rice polders, standardized criminal codes, and regulated rice futures stabilize shogunal treasuries against volatile harvests."
 STATIC_MODIFIER_NAME_oe_jp2_mod_kaitai_shinsho: "Spirit of Kaitai Shinsho"
 STATIC_MODIFIER_DESC_oe_jp2_mod_kaitai_shinsho: "Empirical observation triumphs over blind textual dogma as Japanese physicians and astronomers test every claim against nature itself."
 STATIC_MODIFIER_NAME_oe_jp2_mod_reverberatory_foundry: "Reverberatory Cannon Foundries"
 STATIC_MODIFIER_DESC_oe_jp2_mod_reverberatory_foundry: "Brick reverberatory furnaces cast high-grade iron coastal ordnance, laying the metallurgical cornerstone of modern Japanese industry."
 STATIC_MODIFIER_NAME_oe_jp2_mod_blackships_opening: "Treaty Ports & Strategic Opening"
 STATIC_MODIFIER_DESC_oe_jp2_mod_blackships_opening: "Recognizing the power of steam and rifled ordnance, pragmatic statesmen open treaty harbors while dispatching cadets to master industrial science."
 STATIC_MODIFIER_NAME_oe_jp2_mod_sonno_joi_defiance: "Revere the Throne, Guard the Shore"
 STATIC_MODIFIER_DESC_oe_jp2_mod_sonno_joi_defiance: "Samurai activists rally around imperial prestige and fortify every coastal strait, vowing never to yield sovereignty under foreign guns."
 STATIC_MODIFIER_NAME_oe_jp2_mod_meiji_dawn: "Dawn of the Reform Charter"
 STATIC_MODIFIER_DESC_oe_jp2_mod_meiji_dawn: "Feudal barriers yield to national conscription, steam dockyards, and universal schooling as Japan rises as an industrial East Asian power."
 oe_jp2.1.title: "Two Thrones: The Nanbokucho Schism"
 oe_jp2.1.desc: "From the mountain redoubt of Yoshino and the palaces of Kyoto, two rival imperial courts issue conflicting edicts while provincial constables trade loyalty for half-tax estates. Every great warrior house must decide whether to seek courtly mediation or expand shugo martial commissions."
 oe_jp2.1.a: "Broker imperial mediation through senior courtiers"
 oe_jp2.1.b: "Grant half-tax marshal commissions to the shugo"
 oe_jp2.2.title: "The Muromachi Palace of Flowers"
 oe_jp2.2.desc: "Along Muromachi Avenue in northern Kyoto rises the Hana no Gosho, a sumptuous residence ringed with flowering cherry trees and ponds. Here the shogunate binds the deputy kanrei houses and provincial governors into a single glittering courtly order."
 oe_jp2.2.a: "Codify the Muromachi ceremonial hierarchy"
 oe_jp2.2.b: "Keep the treasury modest and fortify provincial garrisons"
 oe_jp2.3.title: "The Meitoku Accord: Courts Reconciled"
 oe_jp2.3.desc: "After more than half a century of divided banners, envoys from Kyoto and Yoshino meet in solemn parley. Under the Meitoku Accord, the Southern regalia return to the capital and the two imperial lineages pledge reconciliation, ending the long schism."
 oe_jp2.3.a: "Proclaim the Meitoku Accord with grand court rites"
 oe_jp2.3.b: "Press military dominance while rival loyalists disarm"
 oe_jp2.4.title: "Kinkaku-ji & Kitayama Splendor"
 oe_jp2.4.desc: "Gold leaf shimmers over the Mirror Pond at Kitayama as Zen monks, continental calligraphers, and Noh playwrights like Zeami gather under shogunal patronage. The fusion of aristocratic elegance and samurai Zen defines an unforgettable cultural peak."
 oe_jp2.4.a: "Sponsor Kinkaku-ji, Noh troupes, and Five Mountain temples"
 oe_jp2.4.b: "Channel continental trade profits into coastal shipyards"
 oe_jp2.5.title: "The Kakitsu Upheaval & Do-Ikki Leagues"
 oe_jp2.5.desc: "Assassination at a banquet shakes the shogunate to its foundations, and within weeks thousands of indebted peasants and teamsters descend upon Kyoto's moneylenders demanding a sweeping Tokusei debt-cancellation edict."
 oe_jp2.5.a: "Issue a Tokusei debt-relief edict to calm the countryside"
 oe_jp2.5.b: "Deploy cavalry patrols to protect guilds and pawnbrokers"
 oe_jp2.6.title: "The Fires of the Onin War"
 oe_jp2.6.desc: "Rival succession disputes ignite full-scale street warfare inside Kyoto. Eastern and Western hosts torch palaces, libraries, and temples across eleven bitter years; when the smoke clears, central authority is shattered and the Warring States era has begun."
 oe_jp2.6.a: "Embrace the Sengoku crucible and mobilize every province"
 oe_jp2.6.b: "Salvage Kyoto archives and rebuild ruined urban wards"
 oe_jp2.7.title: "Ginkaku-ji & Higashiyama Wabi-Sabi"
 oe_jp2.7.desc: "Even as warlords carve up the provinces, secluded pavilions in Kyoto's eastern hills nurture an aesthetic of quiet imperfection: tea gatherings in four-mat huts, monochrome ink landscapes, and austere stone gardens that bind warriors through shared taste."
 oe_jp2.7.a: "Patronize tea masters, garden architects, and ink painters"
 oe_jp2.7.b: "Turn tea gatherings into secret diplomatic parleys"
 oe_jp2.8.title: "The Ashigaru Spear Revolution"
 oe_jp2.8.desc: "Lightly armored peasant-born ashigaru armed with three-ken long yari pikes are overturning centuries of mounted samurai dominance. Disciplined pike walls drilled to thrust in unison now decide the fate of every Sengoku campaign."
 oe_jp2.8.a: "Standardize long-pike drill and salaried ashigaru squads"
 oe_jp2.8.b: "Preserve elite samurai cavalry banners alongside levies"
 oe_jp2.9.title: "The Kaga Ikko-Ikki Commonwealth"
 oe_jp2.9.desc: "Chanting the nembutsu under banners reading 'He who advances wins paradise,' armed Pure Land Buddhist leagues have toppled provincial governors in Kaga and raised moated temple towns across the central plains."
 oe_jp2.9.a: "Grant chartered autonomy to fortified temple towns"
 oe_jp2.9.b: "Launch a resolute campaign to disarm militant temples"
 oe_jp2.10.title: "Sengoku House Codes (Bunkokuho)"
 oe_jp2.10.desc: "From Kai to Suruga and Echigo, ambitious territorial lords are replacing unwritten custom with crisp house codes: regulating vassal fiefs, curbing private blood feuds, inspecting irrigation dykes, and enforcing coin standards."
 oe_jp2.10.a: "Promulgate a comprehensive Bunkokuho legal code"
 oe_jp2.10.b: "Grant provincial retainers broad autonomy for fast levies"
 oe_jp2.11.title: "Tanegashima & the Sakai Gunsmiths"
 oe_jp2.11.desc: "When Portuguese matchlocks wash ashore on Tanegashima, Japanese master smiths in Kunitomo and Sakai decode the helical breech screw within months. Soon workshops along Osaka Bay are forging more arquebuses than any kingdom in Europe."
 oe_jp2.11.a: "Finance master smiths in Kunitomo and Sakai for mass production"
 oe_jp2.11.b: "Tax private gun merchants and import sulfur and lead"
 oe_jp2.12.title: "Storm at Okehazama"
 oe_jp2.12.desc: "An immense eastern army marches toward Kyoto, confident in its overwhelming numbers. Under the cover of a sudden summer cloudburst, a swift strike column plunges down the wooded ridge straight into the enemy's unguarded headquarters."
 oe_jp2.12.a: "Adopt rapid-maneuver ambush tactics across our officer corps"
 oe_jp2.12.b: "Fortify mountain passes and stockpile campaign rations"
 oe_jp2.13.title: "Rakuichi-Rakuza: Free Markets & Open Guilds"
 oe_jp2.13.desc: "For centuries temple guilds and roadside tollgates choked trade between provinces. By proclaiming Rakuichi-Rakuza around our castle towns—abolishing transit taxes and monopoly charters—commerce surges and artisans flock to our banners."
 oe_jp2.13.a: "Abolish toll barriers and proclaim Rakuichi-Rakuza free markets"
 oe_jp2.13.b: "Auction guild charters to established urban merchant houses"
 oe_jp2.14.title: "Palisades of Nagashino: Three-Rank Volley"
 oe_jp2.14.desc: "Behind triple wooden palisades and marshy streams stand three thousand matchlock gunners organized into alternating firing lines. When the famed red-armored cavalry charges across the muddy valley, relentless rolling volleys announce a new era of warfare."
 oe_jp2.14.a: "Institutionalize rotating volley fire and field fortifications"
 oe_jp2.14.b: "Combine armored shock reserves with flexible skirmish fire"
 oe_jp2.15.title: "Azuchi Keep & the Ironclad Atakebune"
 oe_jp2.15.desc: "Overlooking Lake Biwa rises a seven-story painted keep anchored on towering dry-stone walls, while down on Osaka Bay massive oared Atakebune warships clad in iron plates and heavy cannon sweep rival blockades from the Inland Sea."
 oe_jp2.15.a: "Build grand stone keeps and commission ironclad Atakebune"
 oe_jp2.15.b: "Focus funds on rapid lighter sekibune patrol squadrons"
 oe_jp2.16.title: "Osaka Castle & the Golden Tea Room"
 oe_jp2.16.desc: "Upon the commanding heights where the fortified monastery of Ishiyama once stood, tens of thousands of masons haul megalithic granite blocks to raise Osaka Castle. Inside its glittering halls, the realm's unifier entertains vassal lords in a portable tearoom plated in solid gold."
 oe_jp2.16.a: "Crown Osaka as the invincible seat of national unification"
 oe_jp2.16.b: "Distribute gold ingots to cement frontier daimyo oaths"
 oe_jp2.17.title: "The Taiko Kenchi Cadastral Survey"
 oe_jp2.17.desc: "Commissioners fan out across every rice valley carrying uniform measuring rods and standard grain boxes. By recording each plot's true yield in koku of rice and tying taxes directly to actual cultivators, centuries of tangled manor privileges vanish overnight."
 oe_jp2.17.a: "Enforce the standardized nationwide Taiko Kenchi survey"
 oe_jp2.17.b: "Permit local daimyo to submit self-assessed domain registers"
 oe_jp2.18.title: "Katana-Gari: Separation of Warrior & Peasant"
 oe_jp2.18.desc: "An epochal decree forbids farmers from bearing swords, spears, or arquebuses, while requiring samurai retainers to leave ancestral villages and take up stipended residences inside castle towns. Society hardens into distinct, disciplined orders."
 oe_jp2.18.a: "Enforce complete separation of samurai and cultivator"
 oe_jp2.18.b: "Allow rural goshi yeoman militia along coastal frontiers"
 oe_jp2.19.title: "Fog over Sekigahara"
 oe_jp2.19.desc: "Over a hundred and fifty thousand warriors confront one another in the autumn mist of Sekigahara pass. Amid thunderous matchlock volleys and wavering hilltop banners, secret correspondence swings decisive clans across the valley—handing supreme mastery of Japan to the victor."
 oe_jp2.19.a: "Redistribute defeated domains and seal supreme hegemony"
 oe_jp2.19.b: "Offer magnanimous terms to surviving western houses"
 oe_jp2.20.title: "Edo Bakufu, Bakuhan Taisei & Four-Tier Order"
 oe_jp2.20.desc: "From the moated citadel of Edo, the shogunate promulgates the Buke Shohatto—Laws for the Military Houses—limiting each domain to a single castle, arranging fudai and tozama fiefs in strategic rings, and fixing the Neo-Confucian four-tier order of samurai, peasant, artisan, and merchant."
 oe_jp2.20.a: "Codify the Bakuhan Taisei and Four-Tier Social Order"
 oe_jp2.20.b: "Grant Edo and Osaka townsmen special commercial charters"
 oe_jp2.21.title: "The Shimabara Uprising"
 oe_jp2.21.desc: "Famine taxes and harsh religious inquiries drive tens of thousands of Kyushu peasants and masterless ronin to seize ruined Hara Castle overlooking the Ariake Sea. Their desperate defense shocks the shogunate and forces a reckoning over maritime policy and domain governance."
 oe_jp2.21.a: "Tighten temple registries and seal unauthorized coastal traffic"
 oe_jp2.21.b: "Dismiss corrupt local lords and moderate maritime restrictions"
 oe_jp2.22.title: "Dejima Lanterns & the Birth of Rangaku"
 oe_jp2.22.desc: "Even under strict maritime edicts, the fan-shaped artificial island of Dejima in Nagasaki Bay stays open to Dutch East Indiamen. Alongside raw silk and brass telescopes, the merchants deliver yearly intelligence reports and European scientific treatises eagerly copied by Japanese interpreters."
 oe_jp2.22.a: "Encourage Nagasaki interpreters to study European treatises"
 oe_jp2.22.b: "Restrict Dejima strictly to bullion audits and silk imports"
 oe_jp2.23.title: "Genroku Floating World: Ukiyo-e & Kabuki"
 oe_jp2.23.desc: "Long peace transforms Edo into one of the largest cities on earth. Wealthy townsmen and Osaka rice brokers flock to vibrant kabuki theaters, commission polychrome ukiyo-e woodblock prints, and recite haiku verses in bustling teahouses."
 oe_jp2.23.a: "Celebrate urban publishing, ukiyo-e ateliers, and theater districts"
 oe_jp2.23.b: "Enforce sumptuary edicts to curb luxury and stabilize stipends"
 oe_jp2.24.title: "Kyoho Reforms & the Dojima Rice Exchange"
 oe_jp2.24.desc: "Swinging grain prices and mounting stipends strain shogunal finances. Reformers propose opening new coastal rice polders, chartering the world's first organized rice futures exchange at Dojima in Osaka, and lifting the ban on non-religious Western scientific books."
 oe_jp2.24.a: "Enact Kyoho fiscal reforms and charter the Dojima Exchange"
 oe_jp2.24.b: "Raise emergency domain contributions to balance the treasury"
 oe_jp2.25.title: "Kaitai Shinsho: New Book of Anatomy"
 oe_jp2.25.desc: "After years of painstakingly comparing Dutch anatomical engravings against empirical observation, a circle of Edo physicians publishes Kaitai Shinsho. Its accuracy astounds scholars across Japan and ignites a nationwide appetite for Western medicine, chemistry, and cartography."
 oe_jp2.25.a: "Sponsor medical translation societies and coastal cartography"
 oe_jp2.25.b: "Keep classical academies dominant while archiving the treatise"
 oe_jp2.26.title: "Tempo Strain & Reverberatory Foundries"
 oe_jp2.26.desc: "Poor harvests, urban rice riots, and foreign warships probing Nagasaki and Hokkaido test the Bakuhan system to its limit. Reform-minded domains like Saga and Satsuma translate Dutch metallurgy manuals to build brick reverberatory furnaces capable of casting modern iron cannon."
 oe_jp2.26.a: "Build reverberatory iron foundries and coastal gun batteries"
 oe_jp2.26.b: "Enforce Tempo austerity edicts and dissolve merchant monopolies"
 oe_jp2.27.title: "Black Ships off Uraga"
 oe_jp2.27.desc: "Columns of coal smoke darken the horizon at the mouth of Edo Bay. Black-hulled steam frigates drop anchor off Uraga, their long-range shell guns aimed toward the capital's sea approaches as foreign commodores demand treaty ports, coaling stations, and diplomatic parity."
 oe_jp2.27.a: "Open treaty ports strategically and send students abroad"
 oe_jp2.27.b: "Rally behind the throne and defy foreign gunboats at the straits"
 oe_jp2.28.title: "Dawn of the Reform Charter: Rich Nation, Strong Army"
 oe_jp2.28.desc: "Across Kyoto, Edo, and the southwestern domains, visionary samurai, imperial courtiers, and Rangaku engineers forge a bold national compact: abolish feudal fragmentation, establish modern dockyards and rifle battalions, and seek knowledge throughout the world to secure Japan's destiny."
 oe_jp2.28.a: "Proclaim the Charter of National Renewal and Modernization"
 oe_jp2.28.b: "Pursue gradual Bakufu-led federation of great domains"
