# NEW 2026-11-22 v15.5 Module 15.5-A: Japan Sengoku & Shogunate Deep Overhaul (oe_jp2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v155_japan.py; edit the generator, not this file.
 oe_jp2_ashigaru_spearmen: "Ashigaru Yari Pikemen"
 oe_jp2_ashigaru_spearmen_desc: "Disciplined Sengoku foot soldiers drilled to wield long yari pikes in dense wall formations, anchoring Japanese battle lines from the Onin War onward."
 oe_jp2_teppo_ashigaru: "Teppo Matchlock Corps"
 oe_jp2_teppo_ashigaru_desc: "Volley-drilled Japanese arquebusiers equipped with spiral-forged Tanegashima matchlocks from Sakai and Kunitomo, devastating heavy cavalry behind wooden palisades."
 oe_jp2_hatamoto_samurai: "Hatamoto Elite Samurai"
 oe_jp2_hatamoto_samurai_desc: "Hereditary bannermen serving directly beneath the warlord's horse-standard, clad in articulated lamellar armor and tempered to hold the fiercest melee."
 oe_jp2_atakebune: "Atakebune Armored Warship"
 oe_jp2_atakebune_desc: "Towering oared floating fortresses armored with timber bulwarks and iron plating, bristling with matchlock ports and heavy naval cannon across Japan's inland seas."
 oe_jp2_tenshu_jokamachi: "Tenshu Castle Town"
 oe_jp2_tenshu_jokamachi_desc: "A multi-tiered stone-walled keep surrounded by planned samurai quarters and merchant wards. Can be erected in major historic Japanese castle seats, bolstering local defense, garrison, and shogunal control."
 oe_jp2_tenshu_jokamachi_maint: "Castle Town Upkeep"
 oe_jp2_sakai_egoshu_hall: "Sakai Egoshu Merchant Hall"
 oe_jp2_sakai_egoshu_hall_desc: "A self-governing council hall modeled on Sakai's famed thirty-six Egoshu elders. Can be erected in major Japanese coastal trade ports, expanding merchant capacity, trade hub power, and skilled seafarers."
 oe_jp2_sakai_egoshu_hall_maint: "Merchant Hall Upkeep"
 oe_jp2_act_enforce_sankin_kotai: "Enforce Sankin-Kotai"
 oe_jp2_act_enforce_sankin_kotai_desc: "Require member daimyo of the Shogunate to attend the capital in alternating years, increasing national control, crown power, and subject loyalty at the cost of treasury funds and noble satisfaction."
