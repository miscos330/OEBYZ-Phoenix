# Project Phoenix v59.0 (Worker 5): World Town Charters, Universal Character Interactions, Cross-Civilization Unit Abilities & Global Hegemon Edicts (prefix: oe_v59_w5_). Generated by gen_v590_world_town_rights_chars_hegemons_abilities.py; edit the generator, not this file.
 oe_v59_w5_tr_roman_civitas: "Roman Municipal Civitas Charter"
 oe_v59_w5_tr_roman_civitas_desc: "Restores the classical curial magistracy and municipal law of an imperial civitas. Chartered civic councils elevate administrative control, social mobility, and classical cultural tradition while shifting local influence from direct crown stewards toward urban burghers."
 oe_v59_w5_tr_silk_caravanserai: "Silk Road Caravanserai Oasis Charter"
 oe_v59_w5_tr_silk_caravanserai_desc: "Charters walled overland caravanserais, irrigated karez wells, and bonded Silk Road warehouses across inland oasis towns. Protected caravan houses expand market access, merchant capacity, and steady urban prosperity in exchange for fiscal autonomy from the crown."
 oe_v59_w5_tr_maritime_comune: "Maritime Comune & Arsenal Charter"
 oe_v59_w5_tr_maritime_comune_desc: "Establishes a sworn maritime commune governing public slipways, ropewalks, and galley arsenals along Mediterranean ports. Standardizes naval shipbuilding and maritime projection while elevating merchant shipowners above landed nobility."
 oe_v59_w5_tr_fangshi_guild: "East Asian Fangshi Guild Market Charter"
 oe_v59_w5_tr_fangshi_guild_desc: "Charters organized urban commercial wards and artisan hang guilds in the East Asian Fangshi and Shizhen tradition. Expands market capacity, workshop productivity, and urban development while binding rural laborers to guild regulations."
 oe_v59_w5_tr_waqf_madrasa: "Islamic Waqf & Madrasa City Charter"
 oe_v59_w5_tr_waqf_madrasa_desc: "Protects perpetual charitable Waqf endowments funding collegiate madrasas, scriptoria, hospitals, and public fountains. Sustains rising literacy and rapid institutional diffusion while placing endowed urban districts under clerical trusteeship."
 oe_v59_w5_tr_mongol_yam_hub: "Mongol Yam Postal Hub Charter"
 oe_v59_w5_tr_mongol_yam_hub_desc: "Designates the town as a major imperial Yam relay station stocked with remount herds, courier barracks, and emergency grain stores. Accelerates administrative control and overland market links across vast steppes at the expense of private burgher privileges."
 oe_v59_w5_tr_cossack_sloboda: "Cossack Free Sloboda Charter"
 oe_v59_w5_tr_cossack_sloboda_desc: "Grants frontier sloboda tax exemptions and armed self-defense statutes to free Cossack and borderland settlers. Draws hardy migrants, expands local manpower, and hardens palisade defenses while markedly curbing central crown interference."
 oe_v59_w5_tr_swahili_entrepot: "Swahili Coral-Stone Entrepot Charter"
 oe_v59_w5_tr_swahili_entrepot_desc: "Charters a monsoon-season coral-stone port city linking Indian Ocean dhows with interior gold and ivory routes. Improves anchorage quality, merchant throughput, and coastal prosperity while strengthening patrician merchant houses."
 oe_v59_w5_tr_indian_guild_temple: "Indian Guild & Temple Town Charter"
 oe_v59_w5_tr_indian_guild_temple_desc: "Recognizes the joint charter of hereditary Shreni artisan-merchant guilds and grand temple treasuries. Elevates textile and craft output, trade brokerage, and cultural radiance while anchoring local wealth in clerical and merchant hands."
 oe_v59_w5_tr_hanseatic_kontor: "Hanseatic & Baltic Kontor Charter"
 oe_v59_w5_tr_hanseatic_kontor_desc: "Establishes a fortified northern trading kontor governed by league staple statutes and maritime weigh-houses. Expands marketplace infrastructure, merchant leverage, and Baltic sea lanes while empowering burgher aldermen over feudal lords."
 oe_v59_w5_tr_royal_audiencia: "Colonial Royal Audiencia Charter"
 oe_v59_w5_tr_royal_audiencia_desc: "Institutes a royal appellate court and colonial cabildo seat governing New World provinces. Strengthens administrative control, settler attraction, and civic promotion while centralizing authority in crown magistrates over private merchants."
 oe_v59_w5_tr_enlightenment_free_port: "Enlightenment Free Port & Exchange Charter"
 oe_v59_w5_tr_enlightenment_free_port_desc: "Proclaims a tariff-free international exchange, open printing press district, and marine insurance bourse available from 1648 onward. Accelerates institutional spread, literacy, and cosmopolitan commerce at the cost of reduced direct crown leverage."
 oe_v59_w5_ci_imperial_adoption: "Imperial Adoption & Designate Successor"
 oe_v59_w5_ci_imperial_adoption_concept: "[heir|e]"
 oe_v59_w5_ci_imperial_adoption_act: "$oe_v59_w5_ci_imperial_adoption$"
 oe_v59_w5_ci_imperial_adoption_desc: "Following the Roman Adoptive Emperors and classical dynastic custom, formally adopt a gifted adult subject into the ruling house and designate them as sovereign successor. Costs #Y 50#! gold and #Y 15#! government power (10-year cooldown)."
 oe_v59_w5_ci_imperial_adoption_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will be formally adopted into our ruling house and designated as our worthy successor."
 oe_v59_w5_ci_imperial_adoption_past: "Worthy Successor Adopted"
 oe_v59_w5_ci_imperial_adoption_act_past: "[SCOPE.sCharacter('recipient').GetName] has been adopted into the ruling dynasty and named designated successor."
 oe_v59_w5_ci_imperial_adoption_no_candidate: "@trigger_no! No loyal adult courtier with at least 150 combined abilities is available for adoption."
 oe_v59_w5_ci_imperial_adoption_cd_tt: "Has not performed an Imperial Adoption within the last 10 years."
 oe_v59_w5_ci_sponsor_treatise: "Sponsor Master Chronicle or Treatise"
 oe_v59_w5_ci_sponsor_treatise_concept: "[character|e]"
 oe_v59_w5_ci_sponsor_treatise_act: "$oe_v59_w5_ci_sponsor_treatise$"
 oe_v59_w5_ci_sponsor_treatise_desc: "Patronize a learned courtier or scholar to compose a landmark historical chronicle or scientific treatise. Advances national research, boosts literacy and prestige, and honors the scholar for life. Costs #Y 75#! gold (8-year cooldown)."
 oe_v59_w5_ci_sponsor_treatise_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will compose a master chronicle or scientific treatise under state patronage."
 oe_v59_w5_ci_sponsor_treatise_past: "Master Treatise Sponsored"
 oe_v59_w5_ci_sponsor_treatise_act_past: "[SCOPE.sCharacter('recipient').GetName] has completed a landmark master chronicle and scientific treatise for our realm."
 oe_v59_w5_ci_sponsor_treatise_no_candidate: "@trigger_no! No adult courtier with at least 55 Administrative or Diplomatic skill (or Artist status) is available."
 oe_v59_w5_ci_sponsor_treatise_cd_tt: "Has not sponsored a Master Treatise within the last 8 years."
 oe_v59_w5_ci_ennoble_war_hero: "Ennoble Distinguished War Hero"
 oe_v59_w5_ci_ennoble_war_hero_concept: "[character|e]"
 oe_v59_w5_ci_ennoble_war_hero_act: "$oe_v59_w5_ci_ennoble_war_hero$"
 oe_v59_w5_ci_ennoble_war_hero_desc: "Reward an accomplished commander or martial officer with hereditary peerage, ceremonial arms, and battlefield honors. Raises army tradition, elevates their martial prowess, and inspires noble ranks. Costs #Y 50#! gold and #Y 10#! prestige (5-year cooldown)."
 oe_v59_w5_ci_ennoble_war_hero_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will be ennobled as a celebrated war hero, sharpening their battlefield command."
 oe_v59_w5_ci_ennoble_war_hero_past: "War Hero Ennobled"
 oe_v59_w5_ci_ennoble_war_hero_act_past: "[SCOPE.sCharacter('recipient').GetName] has been raised to noble rank in recognition of distinguished martial service."
 oe_v59_w5_ci_ennoble_war_hero_no_candidate: "@trigger_no! No adult commander or officer with at least 60 Military skill is available for ennoblement."
 oe_v59_w5_ci_ennoble_war_hero_cd_tt: "Has not ennobled a War Hero within the last 5 years."
 oe_v59_w5_ci_frontier_governor: "Assign Frontier Military Governorship"
 oe_v59_w5_ci_frontier_governor_concept: "[character|e]"
 oe_v59_w5_ci_frontier_governor_act: "$oe_v59_w5_ci_frontier_governor$"
 oe_v59_w5_ci_frontier_governor_desc: "Commission a capable warden—strategos, jiedushi, margrave, or frontier bey—to oversee border fortresses, marcher garrisons, and provincial pacification. Strengthens realm defense and control for 10 years at heightened garrison upkeep. Costs #Y 60#! gold (8-year cooldown)."
 oe_v59_w5_ci_frontier_governor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will assume command of our frontier marches, fortifying border defenses and administration."
 oe_v59_w5_ci_frontier_governor_past: "Frontier Governor Commissioned"
 oe_v59_w5_ci_frontier_governor_act_past: "[SCOPE.sCharacter('recipient').GetName] has been commissioned as Frontier Military Governor to guard our marches."
 oe_v59_w5_ci_frontier_governor_no_candidate: "@trigger_no! No adult officer or administrator with at least 50 Military or Administrative skill is available."
 oe_v59_w5_ci_frontier_governor_cd_tt: "Has not commissioned a Frontier Military Governor within the last 8 years."
 oe_v59_w5_ci_honorable_retirement: "Honorable Monastery or Estate Retirement"
 oe_v59_w5_ci_honorable_retirement_concept: "[character|e]"
 oe_v59_w5_ci_honorable_retirement_act: "$oe_v59_w5_ci_honorable_retirement$"
 oe_v59_w5_ci_honorable_retirement_desc: "Grant a dignified retirement pension and sanctuary in a monastery, hermitage, or ancestral estate to an idle courtier or rival claimant. Removes them peacefully from succession, command, and cabinet politics while raising stability and clergy goodwill. Costs #Y 30#! gold (5-year cooldown)."
 oe_v59_w5_ci_honorable_retirement_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will retire honorably to a monastery or country estate, stepping away from public office and succession."
 oe_v59_w5_ci_honorable_retirement_past: "Honorable Retirement Granted"
 oe_v59_w5_ci_honorable_retirement_act_past: "[SCOPE.sCharacter('recipient').GetName] has withdrawn in honor to a quiet monastery or ancestral estate."
 oe_v59_w5_ci_honorable_retirement_no_candidate: "@trigger_no! No idle adult courtier outside the cabinet and military command is available for honorable retirement."
 oe_v59_w5_ci_honorable_retirement_cd_tt: "Has not granted an Honorable Retirement within the last 5 years."
 oe_v59_w5_ci_grand_diplomatic_envoy: "Dispatch Grand Diplomatic Envoy"
 oe_v59_w5_ci_grand_diplomatic_envoy_concept: "[character|e]"
 oe_v59_w5_ci_grand_diplomatic_envoy_act: "$oe_v59_w5_ci_grand_diplomatic_envoy$"
 oe_v59_w5_ci_grand_diplomatic_envoy_desc: "Accredits a silver-tongued plenipotentiary ambassador to tour foreign capitals with rich credentials and treaty charters. Immediately supplies #G +2#! diplomats, raises diplomatic reputation, and eases antagonism for 8 years. Costs #Y 60#! gold (6-year cooldown)."
 oe_v59_w5_ci_grand_diplomatic_envoy_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will lead a Grand Diplomatic Embassy abroad, enhancing our prestige and treaty standing."
 oe_v59_w5_ci_grand_diplomatic_envoy_past: "Grand Diplomatic Envoy Dispatched"
 oe_v59_w5_ci_grand_diplomatic_envoy_act_past: "[SCOPE.sCharacter('recipient').GetName] has set forth as our Grand Diplomatic Envoy to foreign courts."
 oe_v59_w5_ci_grand_diplomatic_envoy_no_candidate: "@trigger_no! No adult courtier with at least 50 Diplomatic skill is available to lead a Grand Embassy."
 oe_v59_w5_ci_grand_diplomatic_envoy_cd_tt: "Has not dispatched a Grand Diplomatic Envoy within the last 6 years."
 oe_v59_w5_ci_exploration_captain: "Commission Exploration & Cartography Captain"
 oe_v59_w5_ci_exploration_captain_concept: "[character|e]"
 oe_v59_w5_ci_exploration_captain_act: "$oe_v59_w5_ci_exploration_captain$"
 oe_v59_w5_ci_exploration_captain_desc: "Outfit an intrepid navigator or overland surveyor with astrolabes, portolan charts, and royal letters patent. Enables explorer recruitment, hastens expedition speed, and extends trade range for 10 years. Costs #Y 70#! gold (8-year cooldown)."
 oe_v59_w5_ci_exploration_captain_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will receive royal charts and patronage as our Exploration and Cartography Captain."
 oe_v59_w5_ci_exploration_captain_past: "Exploration Captain Commissioned"
 oe_v59_w5_ci_exploration_captain_act_past: "[SCOPE.sCharacter('recipient').GetName] has been commissioned as our Exploration and Cartography Captain."
 oe_v59_w5_ci_exploration_captain_no_candidate: "@trigger_no! No adult courtier outside the cabinet with at least 45 skill in any discipline is available."
 oe_v59_w5_ci_exploration_captain_cd_tt: "Has not commissioned an Exploration Captain within the last 8 years."
 oe_v59_w5_ci_endow_academy_chair: "Endow Imperial Academy Chair"
 oe_v59_w5_ci_endow_academy_chair_concept: "[character|e]"
 oe_v59_w5_ci_endow_academy_chair_act: "$oe_v59_w5_ci_endow_academy_chair$"
 oe_v59_w5_ci_endow_academy_chair_desc: "Establishes a salaried academy chair—Pandidakterion, Hanlin Academy, House of Wisdom, or Royal Society—headed by a distinguished scholar. Accelerates institutional growth, literacy, and research for 12 years at a slight fiscal stipend cost. Costs #Y 80#! gold (10-year cooldown)."
 oe_v59_w5_ci_endow_academy_chair_desc_specific: "[SCOPE.sCharacter('recipient').GetName] will preside over a newly endowed Imperial Academy Chair, elevating state scholarship."
 oe_v59_w5_ci_endow_academy_chair_past: "Imperial Academy Chair Endowed"
 oe_v59_w5_ci_endow_academy_chair_act_past: "[SCOPE.sCharacter('recipient').GetName] has been installed as Chair of our endowed Imperial Academy."
 oe_v59_w5_ci_endow_academy_chair_no_candidate: "@trigger_no! No adult scholar with at least 55 Administrative or Diplomatic skill is available for an Academy Chair."
 oe_v59_w5_ci_endow_academy_chair_cd_tt: "Has not endowed an Imperial Academy Chair within the last 10 years."
 oe_v59_w5_ua_greek_fire_broadside: "Byzantine Greek Fire Broadside"
 oe_v59_w5_ua_greek_fire_broadside_desc: "Equips Mediterranean dromons and capital ships with pressurized liquid-fire broadside projectors and incendiary pots, trading hazardous deck attrition and heavy upkeep for searing opening naval firepower."
 oe_v59_w5_ua_greek_fire_broadside_cta: "Click to toggle Byzantine Greek Fire Broadside formation."
 oe_v59_w5_ua_mongol_feigned_retreat: "Mongol Feigned Retreat & Encirclement"
 oe_v59_w5_ua_mongol_feigned_retreat_desc: "Deploys swift steppe horse-archer screens to lure enemy formations into outstretched pursuits before snapping reserve tumens shut around both flanks. Excels in open-field speed, initiative, and light cavalry power while sacrificing siege readiness and forage economy."
 oe_v59_w5_ua_mongol_feigned_retreat_cta: "Click to toggle Mongol Feigned Retreat & Encirclement maneuver."
 oe_v59_w5_ua_tercios_pike_square: "Tercios Pike-and-Shot Square"
 oe_v59_w5_ua_tercios_pike_square_desc: "Available from 1492 onward, interlocks bristling ash-pike squares with corner arquebusier sleeves in the classic Spanish and European Tercio doctrine. Slows strategic marches and demands extra powder upkeep in return for iron discipline, heavy infantry staying power, and superior battlefield tactics."
 oe_v59_w5_ua_tercios_pike_square_cta: "Click to toggle Tercios Pike-and-Shot Square formation."
 oe_v59_w5_ua_east_asian_shieldwall: "Tang & East-Asian Heavy Infantry Shieldwall"
 oe_v59_w5_ua_east_asian_shieldwall_desc: "Forms an armored Mo-Dao and tower-shield wall in the Tang and classical East Asian heavy-infantry tradition, braced to shatter cavalry charges and steady wavering lines. Trades march speed and maintenance for formidable heavy infantry combat strength and morale resilience."
 oe_v59_w5_ua_east_asian_shieldwall_cta: "Click to toggle East-Asian Heavy Infantry Shieldwall."
 oe_v59_w5_ua_janissary_volley: "Ottoman & Gunpowder Janissary Volley"
 oe_v59_w5_ua_janissary_volley_desc: "Available from 1450 onward, marshals elite standing matchlock infantry behind chained field guns and trench earthworks for rolling gunpowder volleys. Consumes steep powder upkeep and trims march pace to deliver punishing light-infantry fire, discipline, and siege efficiency."
 oe_v59_w5_ua_janissary_volley_cta: "Click to toggle Gunpowder Janissary Volley doctrine."
 oe_v59_w5_ua_roman_testudo_march: "Roman Testudo March"
 oe_v59_w5_ua_roman_testudo_march_desc: "Locks legionary and tagmatic shields overhead into an impenetrable Roman Testudo tortoise canopy during approaches and wall assaults. Markedly slows column movement and raises upkeep while cutting field attrition and boosting heavy-infantry assault strength."
 oe_v59_w5_ua_roman_testudo_march_cta: "Click to toggle Roman Testudo March formation."
 oe_v59_w5_dec_proclaim_silk_road_hegemon.title: "Proclaim Silk Road Overland Hegemony"
 oe_v59_w5_dec_proclaim_silk_road_hegemon.desc: "As an independent [great_power|e] holding key Eurasian Silk Road corridors and at least 10 urban centers, proclaim the Silk Road Overland Hegemony Edict. Grants a 25-year commercial mandate and activates the permanent #G Silk Road Overland Hegemon#! mantle whenever we maintain independent Great Power status along the overland arteries."
 oe_v59_w5_dec_proclaim_silk_road_hegemon.a: "Proclaim Sovereignty Over the Overland Silk Arteries"
 oe_v59_w5_dec_proclaim_scientific_hegemon.title: "Proclaim Scientific Luminary Hegemony"
 oe_v59_w5_dec_proclaim_scientific_hegemon.desc: "As an independent [great_power|e] leading the world in literacy and researched advances, proclaim the Scientific Luminary Hegemony Edict. Grants an immediate research surge, a 25-year academic mandate, and activates the ongoing #G Scientific Luminary Hegemon#! mantle while our Great Power scholarship endures."
 oe_v59_w5_dec_proclaim_scientific_hegemon.a: "Enshrine Our Realm as the Beacon of Inquiry"
 AUTO_MODIFIER_NAME_oe_v59_w5_auto_silk_road_hegemon: "Silk Road Overland Hegemon"
 AUTO_MODIFIER_DESC_oe_v59_w5_auto_silk_road_hegemon: "Sustained while an independent Great Power that proclaimed the Silk Road Edict holds Eurasian overland corridors. Amplifies overland trade efficiency, merchant capacity, capital proximity speed, and prestige while provoking rival diplomatic wariness."
 AUTO_MODIFIER_NAME_oe_v59_w5_auto_scientific_luminary_hegemon: "Scientific Luminary Hegemon"
 AUTO_MODIFIER_DESC_oe_v59_w5_auto_scientific_luminary_hegemon: "Sustained while an independent Great Power that proclaimed the Scientific Luminary Edict maintains at least 25% average literacy. Elevates research velocity, institutional spread, literacy growth, and prestige while drawing rival scrutiny."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_adopted_successor: "Adopted Imperial Successor"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_adopted_successor: "Formally adopted into the ruling house and groomed for sovereign stewardship in the classical adoptive tradition."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_master_chronicler: "Master Chronicler & Scholar"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_master_chronicler: "Celebrated across the realm for composing an enduring historical chronicle or foundational scientific treatise."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_ennobled_hero: "Ennobled War Hero"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_ennobled_hero: "Raised to aristocratic honors for valor under fire, commanding deep loyalty and initiative from every rank."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_frontier_governor: "Frontier Military Governor"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_frontier_governor: "Seasoned by commanding border garrisons, supply depots, and frontier pacification across contested marches."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_honorable_retirement: "Honorable Monastery Retirement"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_honorable_retirement: "Withdrawn peacefully from court ambition into contemplative monastic or country-estate retirement."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_grand_envoy: "Grand Plenipotentiary Envoy"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_grand_envoy: "Entrusted with high-level embassies, sovereign treaties, and delicate alliance negotiations abroad."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_cartography_captain: "Royal Exploration & Cartography Captain"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_cartography_captain: "Equipped with royal navigational charts, astrolabes, and seasoned crews to chart uncharted seas and frontiers."
 STATIC_MODIFIER_NAME_oe_v59_w5_cm_academy_chair: "Imperial Academy Chair"
 STATIC_MODIFIER_DESC_oe_v59_w5_cm_academy_chair: "Presides over state academies, archival translations, and the examination of rising administrators."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_master_treatise: "Patronized Master Chronicle & Treatise"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_master_treatise: "Widely copied royal treatises invigorate research, literacy, and cultural prestige, though bold scholarly debates unsettle conservative orthodoxy."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_frontier_march_wardens: "Frontier Military Governorship Network"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_frontier_march_wardens: "Vigilant marcher wardens fortify border citadels, raise frontier levies, and deepen administrative reach at the cost of higher garrison payrolls."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_grand_embassy_mission: "Grand Diplomatic Embassy Mission"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_grand_embassy_mission: "Resplendent plenipotentiary delegations elevate our diplomatic reputation and soothe foreign suspicions while committing chancery bandwidth abroad."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_cartography_expedition: "Royal Cartography & Exploration Commission"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_cartography_expedition: "Organized hydrographic surveys and expedition charters unlock explorer recruitment, speed voyages, and extend commercial reach while raising fleet outfitting outlays."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_endowed_academy_chair: "Endowed Imperial Academy Chairs"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_endowed_academy_chair: "Permanent royal professorships speed institutional adoption, literacy, and scientific progress, funded by dedicated treasury stipends."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_silk_road_hegemon_edict: "Edict of Silk Road Overland Hegemony"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_silk_road_hegemon_edict: "Proclaiming sovereignty over the great trans-Eurasian overland corridors multiplies caravan efficiency and merchant clout, even as rival empires resent our continental monopoly."
 STATIC_MODIFIER_NAME_oe_v59_w5_mod_scientific_hegemon_edict: "Edict of Scientific Luminary Hegemony"
 STATIC_MODIFIER_DESC_oe_v59_w5_mod_scientific_hegemon_edict: "Recognizing our academies, observatories, and printing houses as the foremost beacon of human inquiry speeds research and raises national literacy ceilings while testing conservative clerical patience."
