 OE_CHR_NAME_CIL: "Armenian Cilicia"
 OE_CHR_NAME_CIL_TT: "#F Leo IV was murdered in 1341 and Guy of Lusignan, the empire's governor of Serres, went east to be king; the Mamluks stormed Sis in 1375 and the Armenian kingdom of Cilicia came to an end.#!"
 OE_CHR_CIL_VOID_0: "Cilicia no longer exists."
 OE_CHR_CIL_VOID_1: "The last year of Sis never came: by 1380 Cilicia and the Mamluks no longer shared a border, or Cilicia was never at peace."
 OE_CHR_CIL_DONE_0: "Cilicia was already the empire's subject and was spared in 1375."
 OE_CHR_CIL_DONE_1: "The empire saved Cilicia: Sis did not fall."
 OE_CHR_CIL_DONE_2: "Sis fell and Cilicia passed to the Mamluks; the empire paid a share of the captive king's ransom."
 OE_CHR_CIL_DONE_3: "Sis fell and Cilicia passed to the Mamluks."
 OE_CHR_CIL_DONE_4: "The news of 1375 has reached Constantinople."
 OE_CHR_CIL_RUN_0: "The governor of Serres went east to be king; from 1375 the fate of Sis is decided."
 OE_CHR_CIL_RUN_1: "Cilicia crowned someone else; from 1375 the fate of Sis is decided."
 OE_CHR_CIL_RUN_2: "After the murder of Leo IV the Cilician nobles will come for the governor of Serres (until the end of 1343)."
 OE_CHR_CIL_WAIT_0: "From September 1341."
 OE_CHR_NAME_LAT: "Crusaders and Knights"
 OE_CHR_NAME_LAT_TT: "#F In 1344 the pope's league took the harbour castle of Smyrna, and in 1402 Timur stormed it; in 1399 or 1400 the Despot of the Morea sold the despotate to the Knights Hospitaller of Rhodes, and bought it back after Ankara; in 1444 the crusade was routed at Varna, and two years later the Ottomans broke the Hexamilion.#!"
 OE_CHR_LAT_VOID_0: "The league never asked the empire, the Knights never made an offer, and no crusade bull came."
 OE_CHR_LAT_DONE_0: "[GetCountry('BYZ').Custom('OeLatSmyrna')] [GetCountry('BYZ').Custom('OeLatMorea')] [GetCountry('BYZ').Custom('OeLatFall')] [GetCountry('BYZ').Custom('OeLatVarna')] [GetCountry('BYZ').Custom('OeLatVarnaSide')]"
 OE_CHR_LAT_DONE_1: "[GetCountry('BYZ').Custom('OeLatSmyrna')] [GetCountry('BYZ').Custom('OeLatMorea')] [GetCountry('BYZ').Custom('OeLatFall')] [GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_DONE_2: "[GetCountry('BYZ').Custom('OeLatSmyrna')] [GetCountry('BYZ').Custom('OeLatMorea')] [GetCountry('BYZ').Custom('OeLatVarna')] [GetCountry('BYZ').Custom('OeLatVarnaSide')]"
 OE_CHR_LAT_DONE_3: "[GetCountry('BYZ').Custom('OeLatSmyrna')] [GetCountry('BYZ').Custom('OeLatMorea')] [GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_RUN_0: "The Knights have held the Morea for the empire for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_morea_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeLatSmyrna')]"
 OE_CHR_LAT_RUN_1: "[GetCountry('BYZ').Custom('OeLatVarna')] [GetCountry('BYZ').Custom('OeLatVarnaSide')]"
 OE_CHR_LAT_RUN_2: "[GetCountry('BYZ').Custom('OeLatSmyrna')] [GetCountry('BYZ').Custom('OeLatMorea')] [GetCountry('BYZ').Custom('OeLatFall')] [GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_RUN_3: "[GetCountry('BYZ').Custom('OeLatSmyrna')] [GetCountry('BYZ').Custom('OeLatMorea')] [GetCountry('BYZ').Custom('OeLatVarna')]"
 OE_CHR_LAT_WAIT_0: "From the autumn of 1344 the league at Smyrna may ask the empire to join; from 1397 the Knights may make an offer for the Morea; from 1442 the pope may call a new crusade."
 OE_CHR_NAME_SER: "Dušan's Empire"
 OE_CHR_NAME_SER_TT: "#F Stefan Dušan was crowned Emperor of the Serbs and Romans at Skopje in 1346; his empire split after his death in 1355, and its lords fell at the Maritsa in 1371.#!"
 OE_CHR_SER_VOID_0: "Serbia no longer exists."
 OE_CHR_SER_VOID_1: "Dušan was never crowned emperor and Serbia never held Serres; this history will not come."
 OE_CHR_SER_DONE_0: "After the Maritsa, the lands around Serres returned to the empire. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! of #Y 5#! episodes took place."
 OE_CHR_SER_DONE_1: "Serbia has fallen. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! of #Y 5#! episodes took place."
 OE_CHR_SER_DONE_2: "Serres is no longer Serbian, so the rest will not come. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! of #Y 5#! episodes took place."
 OE_CHR_SER_RUN_0: "Dušan reigns. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! of #Y 5#! episodes so far."
 OE_CHR_SER_RUN_1: "Dušan is dead and his empire is breaking apart. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ser_n')|0]#! of #Y 5#! episodes so far."
 OE_CHR_SER_WAIT_0: "Waiting for Dušan to take the imperial title, or for Serbia to hold former imperial land."
 OE_CHR_NAME_GAL: "The Galata Dispute"
 OE_CHR_NAME_GAL_TT: "#F In 1348 John VI cut the customs at Constantinople and went to war with the Genoese of Galata; after the battle of the Bosporus in 1352 the empire had to make a separate peace.#!"
 OE_CHR_GAL_VOID_0: "The game did not start with the Genoese privileges at Galata (not the 1337 start); this line will not open."
 OE_CHR_GAL_DONE_0: "The reform Expel the Foreigners took Galata back and its privileges ended. [GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_1: "Genoa has fallen and Galata's privileges went with it. [GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_2: "Galata's customs privileges have been abolished. [GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_3: "Galata's privileges were cut back: [ShowModifier('oe_s37_gal_curbed')]. [GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_4: "The Genoese of Galata kept their privileges: [ShowModifier('oe_s37_galata')]. [GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_RUN_0: "Waiting for the customs reform (The Customs of Galata)."
 OE_CHR_GAL_RUN_1: "The Genoese may cross the Golden Horn at any time."
 OE_CHR_GAL_RUN_2: "The battle in the Golden Horn is close."
 OE_CHR_GAL_RUN_3: "Venice may offer an alliance."
 OE_CHR_GAL_RUN_4: "The battle of the Bosporus is close."
 OE_CHR_GAL_RUN_5: "The dispute over Galata is under way."
 OE_CHR_GAL_WAIT_0: "Opens from June 1347, once the civil war of 1341 is over."
 OE_CHR_NAME_OTT: "The Ottomans Cross Over"
 OE_CHR_NAME_OTT_TT: "#F Ottoman troops crossed the straits in the civil wars and stayed; Süleyman Pasha took Gallipoli in 1354, the Count of Savoy won it back in 1366, and John V went west for help in 1369.#!"
 OE_CHR_OTT_VOID_0: "The Ottoman state no longer exists."
 OE_CHR_OTT_DONE_0: "The Ottoman state is gone. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! of #Y 4#! episodes took place."
 OE_CHR_OTT_DONE_1: "The Count of Savoy's crusade and the emperor's journey west have both taken place. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! of #Y 4#! episodes."
 OE_CHR_OTT_RUN_0: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! of #Y 4#! episodes so far; the Count of Savoy's crusade and the journey west come after 1365."
 OE_CHR_OTT_RUN_1: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! of #Y 4#! episodes so far; the rest depend on the Ottomans holding Gallipoli and Thrace."
 OE_CHR_OTT_WAIT_0: "Waiting for the Ottomans to gain a foothold in Europe (the troops borrowed in the civil war), or for trouble at Orhan's court after 1356."
 OE_CHR_NAME_L5: "The Plague and Thrace"
 OE_CHR_NAME_L5_TT: "#F In 1347 the Black Death came to Constantinople by ship, and Andronikos, the youngest son of Kantakouzenos, died of it; the plague came back about eleven times. Didymóteichon fell in 1360 or 1361, Philippópolis in 1363; in 1366 John V went in person to Buda to ask the King of Hungary for help and came back empty-handed; around 1369 (an older account says 1361) Adrianoúpolis fell to the Ottomans; in 1371 the despot of Serres asked for help in vain and fell on the Maritsa.#!"
 OE_CHR_L5_VOID_0: "Before 1372 neither the plague in the City, nor Didymóteichon, nor the journey to Buda, nor the fate of Adrianoúpolis, nor the despot's appeal came as in history."
 OE_CHR_L5_DONE_0: "[GetCountry('BYZ').Custom('OeL5Plague')] [GetCountry('BYZ').Custom('OeL5Empty')] [GetCountry('BYZ').Custom('OeL5Dem')] [GetCountry('BYZ').Custom('OeL5Phi')] [GetCountry('BYZ').Custom('OeL5Buda')] [GetCountry('BYZ').Custom('OeL5Adr')] [GetCountry('BYZ').Custom('OeL5Ugl')] [GetCountry('BYZ').Custom('OeL5Ret')]"
 OE_CHR_L5_RUN_0: "[GetCountry('BYZ').Custom('OeL5Plague')] [GetCountry('BYZ').Custom('OeL5Empty')] [GetCountry('BYZ').Custom('OeL5Dem')] [GetCountry('BYZ').Custom('OeL5Phi')] [GetCountry('BYZ').Custom('OeL5Buda')] [GetCountry('BYZ').Custom('OeL5Adr')] [GetCountry('BYZ').Custom('OeL5Ugl')] [GetCountry('BYZ').Custom('OeL5Ret')]"
 OE_CHR_L5_WAIT_0: "From the autumn of 1346 the plague may come into the City by ship; then come Didymóteichon (from 1359), Philippópolis (from 1362), the journey to Buda (from 1365), Adrianoúpolis (from 1366) and the despot's appeal (from 1370)."
 OE_CHR_NAME_MO: "The Despotate of the Morea"
 OE_CHR_NAME_MO_TT: "#F Manuel Kantakouzenos became Despot of the Morea in 1349. For a century Mistra was the empire's seat in the Peloponnese: the Hexamilion was rebuilt in 1415 and nearly all the peninsula was won back by 1430.#!"
 OE_CHR_MO_VOID_0: "The Morea has become a separate state; this line has stopped."
 OE_CHR_MO_VOID_1: "Mistra is not in the empire's hands; the line is paused until it is retaken."
 OE_CHR_MO_DONE_0: "A century on, the Morea is still a despotate of the empire. [GetCountry('BYZ').Custom('OeChrMoWall')]"
 OE_CHR_MO_DONE_1: "A century on, the Morea is still in the empire's hands. [GetCountry('BYZ').Custom('OeChrMoWall')]"
 OE_CHR_MO_DONE_2: "Mistra has been lost."
 OE_CHR_MO_RUN_0: "The despotate has been founded. [GetCountry('BYZ').Custom('OeChrMoWall')]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#! scheduled events so far."
 OE_CHR_MO_RUN_1: "No despot was named; a kephale governs. [GetCountry('BYZ').Custom('OeChrMoWall')]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#! scheduled events so far."
 OE_CHR_MO_RUN_2: "The moment to name a despot has passed; the other chapters go on. [GetCountry('BYZ').Custom('OeChrMoWall')]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#! scheduled events so far."
 OE_CHR_MO_RUN_3: "A Despot of the Morea may now be named (until the end of 1352)."
 OE_CHR_MO_WAIT_0: "From June 1348 a Despot of the Morea may be named."
 OE_CHR_NAME_CW2: "The Civil War of 1352"
 OE_CHR_NAME_CW2_TT: "#F In 1352 Matthew Kantakouzenos and John V went to war again; Ottoman troops beat the Serbs at Didymoteicho. In 1354 John V entered the city and John VI became a monk.#!"
 OE_CHR_CW2_VOID_0: "The fuse went out: someone died or fell from power, or 1365 passed."
 OE_CHR_CW2_VOID_1: "It did not break out before 1365; this war will not come."
 OE_CHR_CW2_VOID_2: "The civil war of 1341 never happened, so there is no second one."
 OE_CHR_CW2_VOID_3: "John Kantakouzenos is dead or has taken the habit."
 OE_CHR_CW2_VOID_4: "Matthew Kantakouzenos is dead."
 OE_CHR_CW2_VOID_5: "John V is dead."
 OE_CHR_CW2_VOID_6: "John V or the Kantakouzenoi are no longer in the empire."
 OE_CHR_CW2_DONE_0: "The Palaiologan side won: John V rules alone and Kantakouzenos took the habit (after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#! months)."
 OE_CHR_CW2_DONE_1: "John VI stepped down and John V took the throne without a war."
 OE_CHR_CW2_DONE_2: "The Kantakouzenoi kept the crown."
 OE_CHR_CW2_DONE_3: "A divided empire: the two sides drew a line after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#! months."
 OE_CHR_CW2_DONE_4: "No war: the two houses settled into an uneasy concord."
 OE_CHR_CW2_RUN_0: "Month #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#! of the war: the tide stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = the Palaiologan side wins, #Y 0#! = the Kantakouzenoi win)."
 OE_CHR_CW2_RUN_1: "The rift has reached the point of war; it breaks out once the other civil war is over."
 OE_CHR_CW2_RUN_2: "The fuse: John VI reigns and John V is restless; the rift stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_rift').GetValue|0]#! / #Y 60#!."
 OE_CHR_CW2_RUN_3: "The fuse: John V reigns and the Kantakouzenoi will not step aside; the rift stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_rift').GetValue|0]#! / #Y 60#!."
 OE_CHR_CW2_WAIT_0: "Waiting for the civil war of 1341 to end."
 OE_CHR_CW2_WAIT_1: "Opens from 1351."
 OE_CHR_CW2_WAIT_2: "Waiting until John V is #Y 18#!, no other civil war is being fought, the court intrigue is over and the throne is held by John V or John VI."
 OE_CHR_NAME_ECR: "The Metropolitans of Rus'"
 OE_CHR_NAME_ECR_TT: "#F From 1353 Moscow and Lithuania contended for the metropolitan of all Rus', and the patriarch of Constantinople consecrated between them; in 1448 the bishops of Rus' chose Jonah as metropolitan without Constantinople.#!"
 OE_CHR_ECR_VOID_0: "[GetCountry('BYZ').Custom('OeEccChrRusVoid')]"
 OE_CHR_ECR_DONE_0: "[GetCountry('BYZ').Custom('OeEccChrRusDone')]"
 OE_CHR_ECR_RUN_0: "[GetCountry('BYZ').Custom('OeEccChrRusRun')]"
 OE_CHR_ECR_WAIT_0: "From 1353, when the see of all Rus' falls vacant, Rus' will send to Constantinople for a consecration."
 OE_CHR_ECR_WAIT_1: "Waiting for Rus' or Lithuania to send to Constantinople for a metropolitan."
 OE_CHR_NAME_BUL: "The Fall of Bulgaria"
 OE_CHR_NAME_BUL_TT: "#F A royal match around 1355 and the split at Vidin the next year; the Green Count took the Black Sea ports for the empire in 1366 and Bulgaria submitted to the sultan in 1373; Tarnovo fell in 1393 and Vidin in 1396.#!"
 OE_CHR_BUL_VOID_0: "Bulgaria outlasted the Middle Ages."
 OE_CHR_BUL_VOID_1: "Tarnovo belongs to the empire's bloc; Bulgaria will not fall as it did in history."
 OE_CHR_BUL_DONE_0: "Vidin fell and Bulgaria came to an end; the empire had won Anchialos and its coast in 1366. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes took place."
 OE_CHR_BUL_DONE_1: "Vidin fell and Bulgaria came to an end. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes took place."
 OE_CHR_BUL_RUN_0: "Tarnovo has fallen; Vidin still stands. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_RUN_1: "Bulgaria pays tribute to the sultan. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_RUN_2: "The two houses are joined by marriage. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_RUN_3: "Bulgaria is breaking apart. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_WAIT_0: "From 1355: a royal match, the split at Vidin, the quarrel over the Black Sea ports."
 OE_CHR_NAME_UN: "The Union of the Churches"
 OE_CHR_NAME_UN_TT: "#F The union was signed at Florence in July 1439, but read out in Hagia Sophia only on 12 December 1452.#!"
 OE_CHR_UN_VOID_0: "[GetCountry('BYZ').Custom('OeUnChrVoid')]"
 OE_CHR_UN_DONE_0: "[GetCountry('BYZ').Custom('OeUnChrDone')]"
 OE_CHR_UN_RUN_0: "[GetCountry('BYZ').Custom('OeUnChrRun')]"
 OE_CHR_UN_WAIT_0: "[GetCountry('BYZ').Custom('OeUnChrWait')]"
 OE_CHR_NAME_GEO: "The Kingdom of Georgia"
 OE_CHR_NAME_GEO_TT: "#F In 1357 a document signed by the patriarch took the monastery of Iviron on the Holy Mountain out of Georgian hands. In 1367 Anna, the eldest daughter of the Emperor of Trebizond, married King Bagrat V of Georgia. In November 1386 Timur stormed Tbilisi and took the king's family captive; for nearly twenty years he came again and again, eight times by the historians' count, and in 1401 Georgia bought peace with tribute. In 1412 the Black Sheep crushed the Georgians at Chalagan, and at Easter 1440 they sacked Tbilisi. In 1439 the Georgian bishop did not sign the decree of union at Florence. In 1449-1451 Constantine XI sent to Trebizond and Georgia for a bride and settled on a Georgian princess; the bridal ships could not sail in 1452, and the next year the City fell. In 1463 Bagrat defeated George VIII at Chikhori and was crowned King of Imereti; in 1465 the atabeg Qvarqvare II of Samtskhe took George VIII captive by Lake Paravani, Samtskhe broke away, and the united kingdom fell apart.#!"
 OE_CHR_GEO_VOID_0: "Georgia is gone, has changed its faith, has joined the empire's side, or the empire itself has entered Georgia; this history will not come."
 OE_CHR_GEO_VOID_1: "Iviron, the two marriages, Timur's invasion, the Black Sheep, Florence, the emperor's suit and the kingdom's division all failed to happen as in history."
