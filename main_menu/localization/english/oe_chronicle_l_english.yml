 OE_CHR_GEO_RUN_1: "[GetCountry('BYZ').Custom('OeGeoIviron')] [GetCountry('BYZ').Custom('OeGeoWed')] [GetCountry('BYZ').Custom('OeGeoWedSide')] [GetCountry('BYZ').Custom('OeGeoWed2')] [GetCountry('BYZ').Custom('OeGeoTbilisi')] [GetCountry('BYZ').Custom('OeGeoKakheti')] [GetCountry('BYZ').Custom('OeGeoShamkor')] [GetCountry('BYZ').Custom('OeGeoSheep')] [GetCountry('BYZ').Custom('OeGeoFlorence')] [GetCountry('BYZ').Custom('OeGeoEmpress')] [GetCountry('BYZ').Custom('OeGeoImereti')] [GetCountry('BYZ').Custom('OeGeoSamtskhe')]"
