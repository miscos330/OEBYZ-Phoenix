 OE_CHR_LGR1_RUN_3: "Thebes was sacked by the Navarrese Company. [GetCountry('BYZ').Custom('OeLgrNav')] [GetCountry('BYZ').Custom('OeLgrAth')] [GetCountry('BYZ').Custom('OeLgrNaxos')] [GetCountry('BYZ').Custom('OeLgrNeg')] [GetCountry('BYZ').Custom('OeLgrPrince')] [GetCountry('BYZ').Custom('OeLgrVicar')] [GetCountry('BYZ').Custom('OeLgrThebes')]"
 OE_CHR_LGR1_WAIT_0: "From 1379 the Navarrese Company enters central Greece and the Morea; then come the Acciaioli in Athens (from 1385) and Nerio's will (1394)."
 OE_CHR_NAME_THSA: "The Second Court at Thessaloniki"
 OE_CHR_NAME_THSA_TT: "#F In the autumn of 1382 Manuel slipped away to Thessaloniki, set up a court there and fought the Ottomans; the city was besieged from 1383 and opened its gates in April 1387.#!"
 OE_CHR_THSA_VOID_0: "No imperial son left for Thessaloniki before 1395; this history will not come."
 OE_CHR_THSA_DONE_0: "The gates opened: the city went to the Ottomans and kept its privileges."
 OE_CHR_THSA_DONE_1: "The gates opened on terms: the city stayed with the empire and pays the sultan every year."
 OE_CHR_THSA_DONE_2: "Held: four years of blockade, and the city never gave in."
 OE_CHR_THSA_DONE_3: "The emperor called the prince back, and the second court never formed."
 OE_CHR_THSA_DONE_4: "The prince died, and the second court fell apart."
 OE_CHR_THSA_DONE_5: "The Ottoman threat vanished, and the second court with it."
 OE_CHR_THSA_DONE_6: "Thessaloniki was lost in war, and the second court with it."
 OE_CHR_THSA_DONE_7: "The Ottoman army never came, and the prince returned to the capital."
 OE_CHR_THSA_RUN_0: "Under siege: Resolve #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#! months of blockade."
 OE_CHR_THSA_RUN_1: "The prince holds court at Thessaloniki; the Ottomans have not reached the walls yet."
 OE_CHR_THSA_RUN_2: "The prince has left for Thessaloniki; the empire weighs its answer."
 OE_CHR_THSA_WAIT_0: "From 1376 an imperial son passed over for the succession may leave for Thessaloniki."
 OE_CHR_THSA_WAIT_1: "Waiting until an imperial son is passed over for the succession or the Ottomans reach Macedonia, while the empire holds Thessaloniki and is not in a civil war."
 OE_CHR_NAME_ALB: "Albania and Skanderbeg"
 OE_CHR_NAME_ALB_TT: "#F After the battle of Savra in 1385 the Albanian lords submitted to the sultan; Venice took Durazzo, Lezhë and Scutari one after another; from 1443 Skanderbeg held Krujë against the sultan until 1468, when Skanderbeg died at Lezhë; a decade later Krujë and Scutari fell.#!"
 OE_CHR_ALB_VOID_0: "By 1480 none of the historic turns in Albania came to pass."
 OE_CHR_ALB_DONE_0: "[GetCountry('BYZ').Custom('OeAlbSavra')] [GetCountry('BYZ').Custom('OeAlbDurres')] [GetCountry('BYZ').Custom('OeAlbLeague')] [GetCountry('BYZ').Custom('OeAlbKruje')] [GetCountry('BYZ').Custom('OeAlbAfter')]"
 OE_CHR_ALB_RUN_0: "[GetCountry('BYZ').Custom('OeAlbSavra')] [GetCountry('BYZ').Custom('OeAlbDurres')] [GetCountry('BYZ').Custom('OeAlbLeague')] [GetCountry('BYZ').Custom('OeAlbKruje')] [GetCountry('BYZ').Custom('OeAlbAfter')]"
 OE_CHR_ALB_WAIT_0: "From the summer of 1385 a great battle may come to Albania; from the summer of 1390 the lord of Durazzo may sell the city; from the winter of 1443 a banner may rise over Krujë."
 OE_CHR_NAME_J7: "The Elder Line"
 OE_CHR_NAME_J7_TT: "#F In the spring of 1390 John VII, son of Andronikos IV, took the City with the sultan's backing, and John V held out in the fortress by the Golden Gate; that autumn Manuel came back with a few ships and the old emperor was restored. Uncle and nephew were reconciled in 1399.#!"
 OE_CHR_J7_VOID_0: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_VOID_1: "Before 1395 nobody of Andronikos's branch rose to claim the throne."
 OE_CHR_J7_DONE_0: "[GetCountry('BYZ').Custom('OeJ7End')] [GetCountry('BYZ').Custom('OeJ7End2')]"
 OE_CHR_J7_DONE_1: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_RUN_0: "[GetCountry('BYZ').Custom('OeJ7End')] [GetCountry('BYZ').Custom('OeJ7End2')]"
 OE_CHR_J7_RUN_1: "[GetCountry('BYZ').Custom('OeJ7End')]"
 OE_CHR_J7_WAIT_0: "From 1386, if a grown man of Andronikos's branch is still in the empire, the elder line may nurse a grievance."
 OE_CHR_NAME_BYD: "Bayezid's Blockade"
 OE_CHR_NAME_BYD_TT: "#F From 1394 Bayezid I blockaded Constantinople; in 1396 the crusade was crushed at Nicopolis; in 1399 Manuel II went west to seek help; after Ankara in 1402 the blockade was lifted.#!"
 OE_CHR_BYD_VOID_0: "The blockade came to nothing: the house of Osman has joined the empire."
 OE_CHR_BYD_VOID_1: "The Ottoman state no longer exists."
 OE_CHR_BYD_VOID_2: "The house of Osman has joined the empire; there will be no blockade."
 OE_CHR_BYD_VOID_3: "The interregnum came first; no sultan is able to blockade the capital."
 OE_CHR_BYD_VOID_4: "The empire is restored and no sultan can blockade the City; while the restoration lasts, this history will not come."
 OE_CHR_BYD_VOID_5: "No sultan blockaded the capital before 1420; this history will not come."
 OE_CHR_BYD_DONE_0: "Handed to the interregnum: the sultan had troubles of their own, and the blockade lifted after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_1: "The blockade broke up: the sultan could no longer hold the city in, after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_2: "Terms and tribute: the empire accepted the sultan's terms after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_3: "The capital was lost, and the blockade with it."
 OE_CHR_BYD_RUN_0: "The blockade is over; the capital is picking up the pieces."
 OE_CHR_BYD_RUN_1: "Under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months; grain stores #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#!, city morale #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#!. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_WAIT_0: "The empire answered the sultan's summons, and the blockade is put off for now."
 OE_CHR_BYD_WAIT_1: "Waiting for #Y 1394#!, or from 1385 if the sultan's wrath has already broken out."
 OE_CHR_BYD_WAIT_2: "Waiting until the Ottomans stand at the capital with more than #Y 1.5#! times the empire's army."
 OE_CHR_NAME_CRMF: "The Lords of Gothia"
 OE_CHR_NAME_CRMF_TT: "#F Around 1395 the city of Theodoro on its mountain was stormed by barbarians; in the 1420s its lord Alexios rebuilt it and raised the harbour of Kalamita on the coast; in 1433 the Greeks of Cembalo rose and went over to Gothia, and the next year a Genoese fleet retook Cembalo and was then routed near Solkhat.#!"
 OE_CHR_CRMF_VOID_0: "Theodoro is gone, has changed its faith, is in a player's hands, has joined the empire's side or has lost its city; this history will not come."
 OE_CHR_CRMF_VOID_1: "The ruin of Theodoro, its rebuilding and the Cembalo war all failed to happen as in history."
 OE_CHR_CRMF_DONE_0: "[GetCountry('BYZ').Custom('OeCrmRuin')] [GetCountry('BYZ').Custom('OeCrmLament')] [GetCountry('BYZ').Custom('OeCrmAlexios')] [GetCountry('BYZ').Custom('OeCrmKin')] [GetCountry('BYZ').Custom('OeCrmLom')] [GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_DONE_1: "[GetCountry('BYZ').Custom('OeCrmRuin')] [GetCountry('BYZ').Custom('OeCrmAlexios')] [GetCountry('BYZ').Custom('OeCrmKin')] [GetCountry('BYZ').Custom('OeCrmLom')] [GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_RUN_0: "[GetCountry('BYZ').Custom('OeCrmRuin')] [GetCountry('BYZ').Custom('OeCrmLament')] [GetCountry('BYZ').Custom('OeCrmAlexios')] [GetCountry('BYZ').Custom('OeCrmKin')] [GetCountry('BYZ').Custom('OeCrmLom')] [GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_RUN_1: "[GetCountry('BYZ').Custom('OeCrmRuin')] [GetCountry('BYZ').Custom('OeCrmAlexios')] [GetCountry('BYZ').Custom('OeCrmKin')] [GetCountry('BYZ').Custom('OeCrmLom')] [GetCountry('BYZ').Custom('OeCrmCembalo')]"
 OE_CHR_CRMF_WAIT_0: "From 1395 the city of Theodoro may be sacked; then come the suit for a bride (1424), the rebuilding (1425) and the Cembalo war (1434)."
 OE_CHR_NAME_IVR: "The Ottoman Interregnum"
 OE_CHR_NAME_IVR_TT: "#F Timur captured Bayezid I at Ankara in 1402 and his sons fought over the throne for eleven years; the Treaty of Gallipoli of 1403 returned Thessaloniki and the coast to the empire.#!"
 OE_CHR_IVR_VOID_0: "The contest stopped half-way: the Ottoman state is gone, or the house of Osman has joined the empire."
 OE_CHR_IVR_VOID_1: "The Ottoman state no longer exists."
 OE_CHR_IVR_VOID_2: "The house of Osman has joined the empire; there will be no interregnum."
 OE_CHR_IVR_DONE_0: "The Treaty of Gallipoli: the coastal cities came back and the tribute ended."
 OE_CHR_IVR_DONE_1: "The Treaty of Gallipoli was signed, but after the new sultan's reckoning the empire pays tribute again."
 OE_CHR_IVR_DONE_2: "The empire backed no one, or no treaty was signed."
 OE_CHR_IVR_RUN_0: "The princes have fought for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#! months; the empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 OE_CHR_IVR_RUN_1: "The news from Ankara has come; the empire weighs its choice."
 OE_CHR_IVR_WAIT_0: "Waiting for Timur to capture the sultan (historically at Ankara in 1402)."
 OE_CHR_IVR_WAIT_1: "Waiting for the sultan's capture, or for an Ottoman civil war."
 OE_CHR_NAME_DSP: "A Despot for Serbia"
 OE_CHR_NAME_DSP_TT: "#F After Ankara in 1402 Stefan Lazarević of Serbia passed through Constantinople and was made a despot; the Serbian state came to be called a despotate.#!"
 OE_CHR_DSP_VOID_0: "In the two years after Ankara no eligible Orthodox ruler of the Balkans came, or the empire had troubles of its own."
 OE_CHR_DSP_VOID_1: "The Ottoman state is gone, or the house of Osman has joined the empire; no guest will come after Ankara."
 OE_CHR_DSP_DONE_0: "The ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] was made a despot at the Blachernae."
 OE_CHR_DSP_DONE_1: "The ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] was made a sebastokrator."
 OE_CHR_DSP_DONE_2: "The empire feasted the ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] but conferred no dignity."
 OE_CHR_DSP_DONE_3: "When the news of Ankara came, the ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] was already a despot of the empire."
 OE_CHR_DSP_RUN_0: "The empire is in a civil war or does not hold Constantinople; no guest will come for now."
 OE_CHR_DSP_RUN_1: "For two years after the news from Ankara, an Orthodox ruler of the Balkans may come to the city."
 OE_CHR_DSP_WAIT_0: "Waiting for the Ottoman interregnum to begin (historically after Ankara in 1402)."
 OE_CHR_NAME_THSM: "The Revolt of Mustafa"
 OE_CHR_NAME_THSM_TT: "#F Around 1416 the Ottoman prince Mustafa fled to Thessaloniki after a failed revolt and was kept under guard by the empire; when the sultan died in 1421 the empire let Mustafa go to fight for the throne. Mustafa was beaten and killed in 1422, and in 1424 the empire paid tribute again.#!"
 OE_CHR_THSM_VOID_0: "The empire handed the refugee back to the sultan."
 OE_CHR_THSM_VOID_1: "The empire saw the refugee off with honour."
 OE_CHR_THSM_VOID_2: "The prince in custody died or left the empire."
 OE_CHR_THSM_VOID_3: "The sultan was still on the throne in 1440."
 OE_CHR_THSM_VOID_4: "No Ottoman prince sought refuge before 1440."
 OE_CHR_THSM_DONE_0: "The bet won: the prince took the sultan's throne, and the empire's tribute ended."
 OE_CHR_THSM_DONE_1: "The empire switched to the sultan in time and stood with the winner."
 OE_CHR_THSM_DONE_2: "The bet lost: peace in 1424, and the empire pays tribute again."
 OE_CHR_THSM_DONE_3: "The bet lost: the empire refused the peace of 1424."
 OE_CHR_THSM_DONE_4: "The bet lost: the new sultan came in arms."
 OE_CHR_THSM_DONE_5: "The empire handed the prince to the new sultan."
 OE_CHR_THSM_DONE_6: "The contest came to nothing, or the empire only watched."
 OE_CHR_THSM_RUN_0: "The contest has lasted #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#! months; the empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 OE_CHR_THSM_RUN_1: "The empire keeps an Ottoman prince under guard and waits for the sultan to change."
 OE_CHR_THSM_WAIT_0: "From 1410 (or after the Ottoman interregnum) a disappointed Ottoman prince may seek refuge."
 OE_CHR_THSM_WAIT_1: "Waiting for a disappointed Ottoman prince to seek refuge, with no bet running and no war with the Ottomans."
 OE_CHR_NAME_THSD: "The Blockade of Thessaloniki"
 OE_CHR_NAME_THSD_TT: "#F The Ottomans blockaded Thessaloniki in 1422; in 1423 the despot Andronikos handed the city to Venice; Murad II stormed it in March 1430.#!"
 OE_CHR_THSD_VOID_0: "When the time for the blockade came, Thessaloniki was no longer the empire's."
 OE_CHR_THSD_VOID_1: "No blockade came before 1453."
 OE_CHR_THSD_DONE_0: "Given to Venice; the city later fell to the Ottomans all the same."
 OE_CHR_THSD_DONE_1: "Given to Venice, which defends it."
 OE_CHR_THSD_DONE_2: "Its resolve spent, the city went to the Ottomans."
 OE_CHR_THSD_DONE_3: "Its resolve spent, the city stayed with the empire and pays the sultan every year."
 OE_CHR_THSD_DONE_4: "Held: five years of blockade, and the city never gave in."
 OE_CHR_THSD_DONE_5: "The empire paid, and the sultan lifted the blockade."
 OE_CHR_THSD_DONE_6: "Thessaloniki was lost in war."
 OE_CHR_THSD_DONE_7: "The Ottoman threat vanished, and the blockade ended."
 OE_CHR_THSD_RUN_0: "Under blockade: Resolve #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#! months; [GetCountry('BYZ').Custom('OeThsVenOk')]."
 OE_CHR_THSD_WAIT_0: "Waiting: the empire backed Mustafa and lost, refused the peace of 1424, or is at war with the Ottomans while they encircle the city."
 OE_CHR_NAME_LAT4: "The Curia after Florence"
 OE_CHR_NAME_LAT4_TT: "#F In December 1439 the pope at Florence made Bessarion of Nicaea and Isidore of Kiev cardinals; Isidore was also made the papal legate for Lithuania, Livonia and Rus'.#!"
 OE_CHR_LAT4_VOID_0: "The union of Florence was never signed, so the pope never sent to ask the empire."
 OE_CHR_LAT4_DONE_0: "[GetCountry('BYZ').Custom('OeLatHats')] [GetCountry('BYZ').Custom('OeLatCouncil')]"
 OE_CHR_LAT4_RUN_0: "The pope's envoy may come at any time to ask how the empire regards the two Greek cardinals. [GetCountry('BYZ').Custom('OeLatCouncil')]"
 OE_CHR_LAT4_WAIT_0: "From December 1439, once the union is signed, the pope will send word."
 OE_CHR_NAME_L7: "The Last Siege"
 OE_CHR_NAME_L7_TT: "#F In 1452 Mehmed II built a fortress on the European shore of the strait; from April 1453 he besieged Constantinople, and on the 29th of May the City fell and Constantine XI died fighting.#!"
 OE_CHR_L7_VOID_0: "The empire is restored and no sultan can besiege the City; while the restoration lasts, the last siege will not come."
 OE_CHR_L7_VOID_1: "By the end of 1480 no sultan came to besiege the City: in this game it never faced the last siege."
 OE_CHR_L7_DONE_0: "[GetCountry('BYZ').Custom('OeL7End')][GetCountry('BYZ').Custom('OeL7Emp')]"
 OE_CHR_L7_RUN_0: "[GetCountry('BYZ').Custom('OeL7Run')]"
 OE_CHR_L7_WAIT_0: "Waiting: between 1440 and 1480, for an Ottoman army more than #Y 2.5#! times the empire's, holding Adrianoúpolis and land next to the City, while the empire holds more than the City alone."
 OE_CHR_NAME_AEG: "The Lords of the Aegean"
 OE_CHR_NAME_AEG_TT: "#F In 1346 the Genoese took Chios and Phokaia, and the shareholders who had paid for it formed the Maona; in 1355 the Gattilusi received Lesbos and married into the Palaiologoi for four generations; Mytilene fell in 1462.#!"
 OE_CHR_AEG_VOID_0: "By 1463 nothing of Chios and Lesbos came as in history: no fleet of Vignoso, no Maona, and no Lesbos for the Gattilusi."
 OE_CHR_AEG_DONE_0: "[GetCountry('BYZ').Custom('OeAegChios')] [GetCountry('BYZ').Custom('OeAegGat')]"
 OE_CHR_AEG_RUN_0: "[GetCountry('BYZ').Custom('OeAegChios')] [GetCountry('BYZ').Custom('OeAegGat')]"
 OE_CHR_AEG_WAIT_0: "From the summer of 1346 a Genoese fleet may come to Chios; from 1355 a Genoese adventurer may come asking for a marriage and an island."
 OE_CHR_NAME_PRF: "Classical Praetorian Prefectures"
 OE_CHR_NAME_PRF_TT: "#F Diocletian and Constantine recast Roman governance into four Praetorian Prefectures — Oriens, Illyricum, Italia et Africa, and Galliae — overseeing twelve dioceses as recorded in the Notitia Dignitatum.#!"
 OE_CHR_PRF_VOID_0: "(none)"
 OE_CHR_PRF_DONE_0: "All four Praetorian Prefectures are established with #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#! dioceses under the full Notitia charter, steadily easing the imperial burden."
 OE_CHR_PRF_DONE_1: "All four Praetorian Prefectures are active with #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#! dioceses organized."
 OE_CHR_PRF_RUN_0: "Tier #Y 3#! (Full Notitia): #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_n')|0]#! / #Y 4#! prefectures and #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#! dioceses active."
 OE_CHR_PRF_RUN_1: "Tier #Y 2#! (West Opened): #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_n')|0]#! / #Y 4#! prefectures and #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#! dioceses active."
 OE_CHR_PRF_RUN_2: "Tier #Y 1#! (Consistorium Opened): #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_n')|0]#! / #Y 4#! prefectures and #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_prf_dio_n')|0]#! / #Y 12#! dioceses active."
 OE_CHR_PRF_WAIT_0: "Once three or more historical regions are restored, the empire may issue the Prefectural Charter and organize four Praetorian Prefectures and twelve dioceses to ease administrative strain."
 OE_CHR_NAME_GHH: "Ulus of Jochi & the Golden Horde"
 OE_CHR_NAME_GHH_TT: "#F In 1337 Uzbeg Khan ruled from Sarai over five wings — the White Horde, Shiban, Khwarazm, Kazan and Crimea; after Berdi Beg's death in 1359 the Great Troubles shattered the steppe into rival khanates.#!"
 OE_CHR_GHH_VOID_0: "The court of Sarai left the steppe before the five-wing cycle could unfold; this line is void."
 OE_CHR_GHH_DONE_0: "Sarai achieved full steppe renewal and brought the five wings back under one banner (final cohesion #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!)."
 OE_CHR_GHH_DONE_1: "The Ulus of Jochi has reached its finale: the five wings diverged into distinct khanates (cohesion #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_gv_oe_ghh_cohesion')|0]#!)."
