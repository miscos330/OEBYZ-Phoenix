 OE_CHR_TRE_RUN_3: "John III reigns (influence #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!)."
 OE_CHR_TRE_RUN_4: "Michael has been restored (influence #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!)."
 OE_CHR_TRE_RUN_5: "The new emperor is in Trebizond, waiting to be crowned (influence #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!)."
 OE_CHR_TRE_RUN_6: "Events in Trebizond are unfolding (influence #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tre_inf').GetValue|0]#!)."
 OE_CHR_TRE_WAIT_0: "The princess Irene is shunned at Trebizond; Basil still reigns."
 OE_CHR_TRE_WAIT_1: "From 1339: the marriage of Basil, emperor of Trebizond."
 OE_CHR_TRE_WAIT_2: "Waiting for Basil's death and the princess Irene's rise to power (1339–1341)."
 OE_CHR_NAME_CIL: "Armenian Cilicia"
 OE_CHR_NAME_CIL_TT: "#F Leo IV was murdered in 1341 and Guy of Lusignan, the empire's governor of Serres, went east to be king; the Mamluks stormed Sis in 1375 and the Armenian kingdom of Cilicia came to an end.#!"
 OE_CHR_CIL_VOID_0: "Cilicia no longer exists."
