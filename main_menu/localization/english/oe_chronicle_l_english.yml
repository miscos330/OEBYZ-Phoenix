 OE_CHR_BEY_WAIT_0: "From the spring of 1339 Umur of Aydin may ask the empire to sail into the Black Sea together; news of the emirates' fortunes follows."
 OE_CHR_NAME_TRE: "The Princess of Trebizond"
 OE_CHR_NAME_TRE_TT: "#F In 1339 Basil, emperor of Trebizond, took another wife and set aside the empress Irene, a daughter of Andronikos III. Basil died suddenly in 1340 and Irene took power; Trebizond changed rulers again and again until Basil's son, raised in Constantinople, came home in 1349 and was crowned Alexios III the next year.#!"
 OE_CHR_TRE_VOID_0: "By 1342 the princess Irene had not come to power; this history will not come."
 OE_CHR_TRE_VOID_1: "Trebizond no longer exists, or has become another country's subject."
