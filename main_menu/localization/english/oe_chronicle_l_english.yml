 OE_CHR_NAME_MO: "The Despotate of the Morea"
 OE_CHR_NAME_MO_TT: "#F Manuel Kantakouzenos became Despot of the Morea in 1349. For a century Mistra was the empire's seat in the Peloponnese: the Hexamilion was rebuilt in 1415 and nearly all the peninsula was won back by 1430.#!"
