 OE_CHR_ILK2_WAIT_0: "From 1357 Jani Beg of the Golden Horde may come south; then come the Jalayirids at Tabriz (1358), the battle of Mush (1366), Tokhtamysh's sack of Tabriz (1385) and Timur's march west (from 1393)."
 OE_CHR_NAME_EMDC: "Lusignan Cyprus"
 OE_CHR_NAME_EMDC_TT: "#F In 1358 Hugh IV gave the throne to Peter I; in 1365 Peter I sailed from Rhodes and sacked Alexandria; around 1373 the Genoese seized Famagusta; in 1426 the Mamluks took King Janus prisoner at Khirokitia, and Cyprus paid tribute to Cairo from then on; in 1442 Helena, daughter of the Despot of the Morea, married King John II; in 1464 James II took Famagusta back from the Genoese.#!"
 OE_CHR_EMDC_VOID_0: "The Kingdom of Cyprus is gone, has changed its faith, has joined the empire's side or has lost the island; this history will not come."
 OE_CHR_EMDC_VOID_1: "Peter I's accession, the sack of Alexandria, the fall of Famagusta, Khirokitia and the marriage all failed to happen as in history."
