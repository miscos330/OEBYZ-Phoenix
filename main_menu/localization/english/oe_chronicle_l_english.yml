 OE_CHR_NAME_OTT: "The Ottomans Cross Over"
 OE_CHR_NAME_OTT_TT: "#F Ottoman troops crossed the straits in the civil wars and stayed; Süleyman Pasha took Gallipoli in 1354, the Count of Savoy won it back in 1366, and John V went west for help in 1369.#!"
 OE_CHR_OTT_VOID_0: "The Ottoman state no longer exists."
 OE_CHR_OTT_DONE_0: "The Ottoman state is gone. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_ott_n')|0]#! of #Y 4#! episodes took place."
