 OE_CHR_EMDW_WAIT_0: "From the winter of 1364 the Prince of Wallachia may send envoys about the monastery on the Holy Mountain; then come Rovine (1394), the Ottoman interregnum and the sultan's revenge (1416)."
 OE_CHR_NAME_CRMG: "The Growth of Gazaria"
 OE_CHR_NAME_CRMG_TT: "#F In 1365 the Genoese of Caffa took Soldaia while the Golden Horde was in turmoil; in 1380 and 1381 the khan's governor ceded the coast of Gothia to Genoa; in the mid-1380s Caffa fought the governor of the steppe around Solkhat, and peace was made in the summer of 1387.#!"
 OE_CHR_CRMG_VOID_0: "Caffa is no longer held by the Genoese side, has joined the empire's side, or Genoa or Gazaria is in a player's hands; this history will not come."
 OE_CHR_CRMG_VOID_1: "The taking of Soldaia, the cession of the coast of Gothia and the Solkhat war all failed to happen as in history."
