 OE_CHR_TAB: "Chronicle"
 OE_CHR_TAB_DESC: "The empire's historical storylines: which have begun, how they ended, and why some never came."
 OE_CHR_TAB_REFORMS: "Reforms"
 OE_CHR_TITLE: "Imperial Chronicle"
 OE_CHR_INTRO: "The empire's historical storylines. Each appears only while its historical preconditions hold; once history takes another turn, the chapters that depended on it become void, with the reason given. Hover over a name for the history."
 OE_CHR_SUMMARY: "Under way #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_n_run')|0]#!   Ended #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_n_done')|0]#!   Not yet #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_n_wait')|0]#!   Void #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_n_void')|0]#!"
 OE_CHR_ST_WAIT: "#weak Not yet#!"
 OE_CHR_ST_RUN: "#bold #color_gold Under way#!#!"
 OE_CHR_ST_DONE: "#bold Ended#!"
 OE_CHR_ST_VOID: "#color_orange Void#!"
 OE_CHR_ST_TT: "Not yet: the time or the preconditions have not come.\nUnder way: the storyline is unfolding.\nEnded: the outcome is given.\nVoid: its preconditions can no longer hold; the reason is given."
 OE_CHR_NAME_S37: "The First Two Years"
 OE_CHR_NAME_S37_TT: "#F 1337: Nicomedia falls to Orhan, the Albanian clans rise and Epirus is restless; the general judges are tried for taking bribes, and the Genoese Zaccaria is set free.#!"
 OE_CHR_S37_VOID_0: "This game did not begin in April 1337, so the events of the first two years were never scheduled."
 OE_CHR_S37_DONE_0: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_s37_fired')|0]#! took place; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_s37_dropped')|0]#! were passed over when their conditions did not hold."
 OE_CHR_S37_RUN_0: "Month #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_s37_ev_m').GetValue|0]#! of the game: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_s37_fired')|0]#! took place and #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_s37_dropped')|0]#! were passed over; the rest wait in their windows."
 OE_CHR_S37_WAIT_0: "Scheduled from the second month of the game."
 OE_CHR_NAME_HES: "The Hesychast Dispute"
 OE_CHR_NAME_HES_TT: "#F From 1337 the monk Barlaam and Gregory Palamas quarrelled over hesychast prayer; a council at Constantinople ruled on it in June 1341.#!"
 OE_CHR_HES_VOID_0: "The dispute never broke out at the start, so the council of 1341 will not meet."
 OE_CHR_HES_DONE_0: "The council of June 1341 sided with Palamas, and Barlaam left the empire."
 OE_CHR_HES_DONE_1: "The council of June 1341 sided with Barlaam, and Palamas was forced into seclusion."
 OE_CHR_HES_DONE_2: "The council of June 1341 has given its ruling."
 OE_CHR_HES_RUN_0: "Barlaam and the hesychasts are at odds; from June 1341 a council will rule on the dispute."
 OE_CHR_HES_WAIT_0: "Soon after the start, Barlaam's quarrel with the hesychasts comes into the open."
 OE_CHR_NAME_ITP: "The Italian Treaties"
 OE_CHR_NAME_ITP_TT: "#F Venice, Genoa, Pisa and Ragusa each held privileges in the empire; in the fifteenth century the treaty with Venice was renewed again and again, almost word for word from that of 1390.#!"
 OE_CHR_ITP_VOID_0: "Constantinople is no longer the empire's; the republics' privileges there mean nothing now."
 OE_CHR_ITP_VOID_1: "None of the four Italian republics exists any more."
 OE_CHR_ITP_DONE_0: "A framework; it has no ending."
 OE_CHR_ITP_RUN_0: "Venice: [GetCountry('BYZ').Custom('OeItpTierVen')]; Genoa: [GetCountry('BYZ').Custom('OeItpTierGen')]; [GetCountry('BYZ').Custom('OeItpSlot4')]: [GetCountry('BYZ').Custom('OeItpTierPis')]; Ragusa: [GetCountry('BYZ').Custom('OeItpTierRag')]. Venetian claims #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_itp_ven_claims').GetValue|0]#! thousand ducats; [GetCountry('BYZ').Custom('OeItpVenPact')]. The Black Sea grain road: [GetCountry('BYZ').Custom('OeItpGrain')]."
 OE_CHR_ITP_WAIT_0: "The privileges are first counted in the first month of the game."
 OE_CHR_NAME_ILK1: "The Legacy of the Khanate"
 OE_CHR_NAME_ILK1_TT: "#F After the death of Abu Sa'id in 1335 the Ilkhanate broke apart. In 1337 Hasan Buzurg defeated Musa Khan at Soghurlugh; in 1338 Hasan Kuchak of the Chobanids took Tabriz; in 1343 Eretna made good an independent rule at Karanbük; in 1352 Trebizond gave a princess to the son of the chief of the White Sheep.#!"
 OE_CHR_ILK1_VOID_0: "The empire's Persian plan is complete; from now on its campaigns rewrite these lands, and history no longer takes its course here."
 OE_CHR_ILK1_VOID_1: "None of this happened in the old lands of the Ilkhanate as it did in history."
 OE_CHR_ILK1_DONE_0: "[GetCountry('BYZ').Custom('OeIlkMusa')] [GetCountry('BYZ').Custom('OeIlkRoad')] [GetCountry('BYZ').Custom('OeIlkSutay')] [GetCountry('BYZ').Custom('OeIlkEretna')] [GetCountry('BYZ').Custom('OeIlkKuchak')] [GetCountry('BYZ').Custom('OeIlkSheep')] [GetCountry('BYZ').Custom('OeIlkBride')]"
 OE_CHR_ILK1_RUN_0: "[GetCountry('BYZ').Custom('OeIlkMusa')] [GetCountry('BYZ').Custom('OeIlkRoad')] [GetCountry('BYZ').Custom('OeIlkSutay')] [GetCountry('BYZ').Custom('OeIlkEretna')] [GetCountry('BYZ').Custom('OeIlkKuchak')] [GetCountry('BYZ').Custom('OeIlkSheep')] [GetCountry('BYZ').Custom('OeIlkBride')]"
 OE_CHR_ILK1_WAIT_0: "From the summer of 1337 the war between the Jalayirids and Musa Khan may be settled; then come the Western merchants of Tabriz (1340), the Sutayids and Eretna (1343), the rise of the Black Sheep and the White Sheep (1350) and a bride for the White Sheep (1352)."
 OE_CHR_NAME_COL: "Colonies and Resettlement"
 OE_CHR_NAME_COL_TT: "#F Nicomedia surrendered in 1337 and its people were allowed to leave for Constantinople. The civil wars and raids of the fourteenth century left much of Thrace deserted.#!"
 OE_CHR_COL_VOID_0: "The empire has lost Constantinople and resettlement has stopped; it resumes if the City is retaken."
 OE_CHR_COL_DONE_0: "Resettlement has no end."
 OE_CHR_COL_RUN_0: "[GetCountry('BYZ').Custom('OeColChrNic')][GetCountry('BYZ').Custom('OeColChrThs')][GetCountry('BYZ').Custom('OeColChrStp')][GetCountry('BYZ').Custom('OeColChrMor')]#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_n_settled').GetValue|0]#! resettlements so far, about #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_col_pop_added').GetValue|1]#! thousand people expected; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_slots_used')|0]#! moves under way, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_col_sparse_n')|0]#! sparse places. [GetCountry('BYZ').Custom('OeColChrPosts')]"
 OE_CHR_COL_WAIT_0: "From 1338 the empire can move people onto reclaimed or deserted land; the refugees from Nicomedia are waiting too."
 OE_CHR_NAME_FS: "The Frontier and the Settlement"
 OE_CHR_NAME_FS_TT: "#F In 1018 Basil II ended the Bulgarian state and set up themes on its land; the old ways of taxation were kept.#!"
 OE_CHR_FS_VOID_0: "(none)"
 OE_CHR_FS_DONE_0: "(none)"
 OE_CHR_FS_RUN_0: "#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_n')|0]#! crowns abolished; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_crown_n')|0]#! crown estates; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_theme_n')|0]#! new themes; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_dsp_in_n')|0]#! appanages; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_dsp_out_n')|0]#! native despotates. Frontier programmes: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_a_n')|0]#! opened, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_prog_n')|0]#! running, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_park_n')|0]#! past step #Y 3#!, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_closed_n')|0]#! settled; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_fs_v_bk_n')|0]#! backers' contracts."
 OE_CHR_FS_WAIT_0: "When the empire annexes a whole duchy or kingdom, it may abolish the crown, keep crown estates and set up themes or despotates on the rest."
 OE_CHR_NAME_SR: "Restoration and Hegemony"
 OE_CHR_NAME_SR_TT: "#F In 1333 Andronikos III took back northern and eastern Thessaly; in 1340 Epirus returned to the empire.#!"
 OE_CHR_SR_VOID_0: "(none)"
 OE_CHR_SR_DONE_0: "(none)"
 OE_CHR_SR_RUN_0: "[GetCountry('BYZ').Custom('OeSrTier')]; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! historical regions restored; emphasis: [GetCountry('BYZ').Custom('OeSrEmph')]; [GetCountry('BYZ').Custom('OeSrHcGoal')]."
 OE_CHR_SR_RUN_1: "[GetCountry('BYZ').Custom('OeSrTier')]; #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_sr_v_back_n')|0]#! historical regions restored; emphasis: [GetCountry('BYZ').Custom('OeSrEmph')]; next: [GetCountry('BYZ').Custom('OeSrNext')]."
 OE_CHR_SR_WAIT_0: "The work of restoration begins once the empire and its subjects hold eight historical regions and Constantinople and pay no tribute to the Ottomans; with fifteen regions and the Ottomans no longer stronger, the Restoration begins."
 OE_CHR_NAME_CMP: "The Roman Company"
 OE_CHR_NAME_CMP_TT: "#F In 1346 the Genoese fleet that took Chios was fitted out by private shareholders; it is said that the commune could not repay them and handed them the island's revenues, and they were called the 'Maona'.#!"
 OE_CHR_CMP_VOID_0: "The Company has been wound up; its charter is void."
 OE_CHR_CMP_VOID_1: "The emperor refused the merchants twice; the empire will have no company of its own."
 OE_CHR_CMP_VOID_2: "Constantinople is no longer the empire's; the Company has stopped, and resumes if the City is retaken."
 OE_CHR_CMP_VOID_3: "Constantinople is no longer the empire's; there can be no charter until the City is retaken."
 OE_CHR_CMP_DONE_0: "[GetCountry('BYZ').Custom('OeCmpChrDone')]"
 OE_CHR_CMP_RUN_0: "[GetCountry('BYZ').Custom('OeCmpChrRun')]"
 OE_CHR_CMP_WAIT_0: "From 1352, once the empire has kept a trading post on the Black Sea for a year, the merchants of the City will ask the emperor for a charter."
 OE_CHR_NAME_GLH: "The Golden Horde"
 OE_CHR_NAME_GLH_TT: "#F Alexander of Tver was put to death at Sarai in 1339; from 1359 the Golden Horde fell into twenty years of turmoil. Moscow beat Mamai at Kulikovo in 1380, and Tokhtamysh burned Moscow in 1382.#!"
 OE_CHR_GLH_VOID_0: "The Golden Horde has come under the empire; this line has stopped."
 OE_CHR_GLH_VOID_1: "The Golden Horde no longer exists."
 OE_CHR_GLH_DONE_0: "The empire recognised Tokhtamysh and the northern trade reopened. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_glh_n_fired')|0]#! events took place."
 OE_CHR_GLH_DONE_1: "The empire did not recognise the new khan. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_glh_n_fired')|0]#! events took place."
 OE_CHR_GLH_RUN_0: "The Golden Horde is in the Great Troubles. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_glh_n_fired')|0]#! events so far."
 OE_CHR_GLH_RUN_1: "The empire backed the right khan, and Sarai looks on us with favour. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_glh_n_fired')|0]#! events so far."
 OE_CHR_GLH_RUN_2: "The empire backed the wrong khan, and Sarai is cool towards us. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_glh_n_fired')|0]#! events so far."
 OE_CHR_GLH_RUN_3: "News keeps coming from Sarai. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_glh_n_fired')|0]#! events so far."
 OE_CHR_GLH_WAIT_0: "From the autumn of 1339, news from Sarai begins to reach Constantinople."
 OE_CHR_NAME_ILK3: "The Persian Heartland"
 OE_CHR_NAME_ILK3_TT: "#F In 1340 Mubariz al-Din of the Muzaffarids took Kerman; late in 1353 the Sarbadars murdered Togha Temur of Gurgan, and the Muzaffarids went on to take Shiraz and hold Fars; in 1358 Shah Shoja deposed Mubariz al-Din. In 1381 Timur came before Herat, and the houses of Khorasan bowed one after another.#!"
 OE_CHR_ILK3_VOID_0: "The empire's Persian plan is complete; from now on its campaigns rewrite these lands, and history no longer takes its course here."
 OE_CHR_ILK3_VOID_1: "None of this happened in the Persian heartland as it did in history."
 OE_CHR_ILK3_DONE_0: "[GetCountry('BYZ').Custom('OeIlkKerman')] [GetCountry('BYZ').Custom('OeIlkTogha')] [GetCountry('BYZ').Custom('OeIlkShiraz')] [GetCountry('BYZ').Custom('OeIlkShuja')] [GetCountry('BYZ').Custom('OeIlkKhorasan')]"
 OE_CHR_ILK3_RUN_0: "[GetCountry('BYZ').Custom('OeIlkKerman')] [GetCountry('BYZ').Custom('OeIlkTogha')] [GetCountry('BYZ').Custom('OeIlkShiraz')] [GetCountry('BYZ').Custom('OeIlkShuja')] [GetCountry('BYZ').Custom('OeIlkKhorasan')]"
 OE_CHR_ILK3_WAIT_0: "From 1340 the Muzaffarids may take over Kerman; then come Togha Temur's death and Shiraz (1353), Shah Shoja's accession (1358) and Timur before Herat (1381)."
 OE_CHR_NAME_CW: "The Civil War of 1341"
 OE_CHR_NAME_CW_TT: "#F Andronikos III died in 1341, leaving the nine-year-old John V. The regency fell out with John Kantakouzenos; six years of war ended with his entry into the city in 1347.#!"
 OE_CHR_CW_VOID_0: "Kantakouzenos died before the war broke out; it will not be fought now."
 OE_CHR_CW_VOID_1: "No child emperor ruled with Kantakouzenos beside the throne before 1350; this war will not come."
 OE_CHR_CW_VOID_2: "John Kantakouzenos is dead."
 OE_CHR_CW_VOID_3: "John Kantakouzenos has left the empire."
 OE_CHR_CW_VOID_4: "John V is dead."
 OE_CHR_CW_VOID_5: "After Andronikos III, John V was not the heir: there is no child emperor to need a regent."
 OE_CHR_CW_DONE_0: "The Golden Gate opened: Kantakouzenos entered the city as emperor, with John V as his heir."
 OE_CHR_CW_DONE_1: "No blood was shed: the two sides agreed to rule jointly."
 OE_CHR_CW_DONE_2: "A belated peace: the two sides made terms after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]#! months of war."
 OE_CHR_CW_DONE_3: "The regency won: Kantakouzenos was beaten and retired to Mount Athos (after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]#! months)."
 OE_CHR_CW_RUN_0: "Month #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]#! of the war: the tide stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = Kantakouzenos enters the city, #Y 0#! = he is beaten and takes the habit)."
 OE_CHR_CW_RUN_1: "The rift has reached the point of war; it breaks out once the other civil war is over."
 OE_CHR_CW_RUN_2: "A standoff at court: the rift stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_rift').GetValue|0]#! / #Y 60#!; at #Y 60#! it means war, below that joint rule."
 OE_CHR_CW_RUN_3: "The outcome is decided; the last steps are under way."
 OE_CHR_CW_WAIT_0: "Andronikos III still reigns. The line begins when he dies, a child succeeds and Kantakouzenos is still at court."
 OE_CHR_CW_WAIT_1: "Waiting for a child emperor under a regency, with Kantakouzenos still at court."
 OE_CHR_NAME_ECF: "The Church and the Patriarchate"
 OE_CHR_NAME_ECF_TT: "#F In the middle of the fourteenth century the hesychast dispute went back and forth through several councils; after it, patriarchs often came and went with the changes of emperor.#!"
 OE_CHR_ECF_VOID_0: "[GetCountry('BYZ').Custom('OeEccChrFwVoid')]"
 OE_CHR_ECF_DONE_0: "[GetCountry('BYZ').Custom('OeEccChrFwDone')]"
