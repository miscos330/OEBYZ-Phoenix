 OE_CHR_NAME_ILK2: "Tabriz Changes Hands, and Timur"
 OE_CHR_NAME_ILK2_TT: "#F In 1357 Jani Beg of the Golden Horde came south, took Tabriz and put Malik Ashraf of the Chobanids to death; the Jalayirids then took Tabriz. From 1393 Timur marched west, and in July 1402 he took Sultan Bayezid prisoner at Ankara.#!"
 OE_CHR_ILK2_VOID_0: "The empire's Persian plan is complete; from now on its campaigns rewrite these lands, and history no longer takes its course here."
 OE_CHR_ILK2_VOID_1: "None of this happened as in history: neither the changes of masters at Tabriz nor what came with Timur."
