 OE_CHR_NAME_LAT3: "Two Popes"
 OE_CHR_NAME_LAT3_TT: "#F In 1378 thirteen cardinals at Fondi chose a second pope, and the West had two popes, its realms taking sides; only in 1417 did the council of Constance elect Martin V and end the Great Schism.#!"
 OE_CHR_LAT3_VOID_0: "When the schism ended, the papacy was gone."
 OE_CHR_LAT3_VOID_1: "The Church of the West did not split before 1402, so the empire never had to choose."
 OE_CHR_LAT3_DONE_0: "[GetCountry('BYZ').Custom('OeLatSchism')]"
 OE_CHR_LAT3_RUN_0: "[GetCountry('BYZ').Custom('OeLatSchism')]"
 OE_CHR_LAT3_WAIT_0: "From 1360 a papal election may split the Church of the West."
 OE_CHR_NAME_LGR1: "The Navarrese and the Acciaioli"
 OE_CHR_NAME_LGR1_TT: "#F In 1379 a band of the Navarrese Company stormed Thebes, and the Company then made itself master of Achaea; in 1388 the Florentine Nerio Acciaioli won the Acropolis of Athens; Nerio died in 1394, and a year or two later the Despot of the Morea bought Corinth. In 1383 the Crispo seized the Archipelago, and in 1390 the whole of Negroponte passed to Venice; in 1404 Centurione, lord of Arcadia, bought the title of prince of Achaea, and the Company's rule was over. In 1444 the despot marched into central Greece while the sultan was busy in the north, and the Duke of Athens paid tribute to the empire.#!"
 OE_CHR_LGR1_VOID_0: "The Navarrese Company never became master of Achaea and the Acciaioli never took Athens: this history did not come."
 OE_CHR_LGR1_VOID_1: "The Principality of Achaea is gone and Athens is in no Latin hands; this history will not come."
