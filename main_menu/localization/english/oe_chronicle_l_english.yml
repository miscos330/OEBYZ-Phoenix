 OE_CHR_NAME_CW: "The Civil War of 1341"
 OE_CHR_NAME_CW_TT: "#F Andronikos III died in 1341, leaving the nine-year-old John V. The regency fell out with John Kantakouzenos; six years of war ended with his entry into the city in 1347.#!"
 OE_CHR_CW_VOID_0: "Kantakouzenos died before the war broke out; it will not be fought now."
 OE_CHR_CW_VOID_1: "No child emperor ruled with Kantakouzenos beside the throne before 1350; this war will not come."
 OE_CHR_CW_VOID_2: "John Kantakouzenos is dead."
 OE_CHR_CW_VOID_3: "John Kantakouzenos has left the empire."
 OE_CHR_CW_VOID_4: "John V is dead."
 OE_CHR_CW_VOID_5: "After Andronikos III, John V was not the heir: there is no child emperor to need a regent."
 OE_CHR_CW_DONE_0: "The Golden Gate opened: Kantakouzenos entered the city as emperor, with John V as his heir."
 OE_CHR_CW_DONE_1: "No blood was shed: the two sides agreed to rule jointly."
 OE_CHR_CW_DONE_2: "A belated peace: the two sides made terms after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]#! months of war."
 OE_CHR_CW_DONE_3: "The regency won: Kantakouzenos was beaten and retired to Mount Athos (after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]#! months)."
 OE_CHR_CW_RUN_0: "Month #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_wm').GetValue|0]#! of the war: the tide stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = Kantakouzenos enters the city, #Y 0#! = he is beaten and takes the habit)."
 OE_CHR_CW_RUN_1: "The rift has reached the point of war; it breaks out once the other civil war is over."
 OE_CHR_CW_RUN_2: "A standoff at court: the rift stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw_rift').GetValue|0]#! / #Y 60#!; at #Y 60#! it means war, below that joint rule."
 OE_CHR_CW_RUN_3: "The outcome is decided; the last steps are under way."
 OE_CHR_CW_WAIT_0: "Andronikos III still reigns. The line begins when he dies, a child succeeds and Kantakouzenos is still at court."
 OE_CHR_CW_WAIT_1: "Waiting for a child emperor under a regency, with Kantakouzenos still at court."
 OE_CHR_NAME_ECF: "The Church and the Patriarchate"
 OE_CHR_NAME_ECF_TT: "#F In the middle of the fourteenth century the hesychast dispute went back and forth through several councils; after it, patriarchs often came and went with the changes of emperor.#!"
