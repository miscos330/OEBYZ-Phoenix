 OE_CHR_GEO_RUN_3: "[GetCountry('BYZ').Custom('OeGeoIviron')] [GetCountry('BYZ').Custom('OeGeoWed')] [GetCountry('BYZ').Custom('OeGeoWed2')] [GetCountry('BYZ').Custom('OeGeoTbilisi')] [GetCountry('BYZ').Custom('OeGeoKakheti')] [GetCountry('BYZ').Custom('OeGeoShamkor')] [GetCountry('BYZ').Custom('OeGeoSheep')] [GetCountry('BYZ').Custom('OeGeoFlorence')] [GetCountry('BYZ').Custom('OeGeoEmpress')] [GetCountry('BYZ').Custom('OeGeoImereti')] [GetCountry('BYZ').Custom('OeGeoSamtskhe')]"
 OE_CHR_GEO_WAIT_0: "From 1356 the two brotherhoods of Iviron on the Holy Mountain will ask the patriarch to decide between them; then come the two Trebizond marriages (1367, 1377), Timur's invasion (from the winter of 1386), the Black Sheep (1412, 1440), Florence (1439) and the emperor's suit (from the autumn of 1449), and last the kingdom's division (from 1463)."
 OE_CHR_NAME_LGR2: "Epirus and Thessaly"
 OE_CHR_NAME_LGR2_TT: "#F In 1348 Serbia took Epirus and Thessaly; after Dušan's death Simeon Uroš took the title of emperor at Trikala and Nikephoros II came back to Arta, to fall by the Achelous in 1359, after which Arta belonged to the Albanians. Ioannina got a despot of its own, and Thessaly later passed to the caesar Philanthropenos. In 1385 Esau, a Florentine, became lord of Ioannina; about 1393 the Ottomans took Thessaly and Salona. The Tocco took Ioannina in 1411 and Arta in 1416, and in 1430 Ioannina opened its gates to the sultan.#!"
 OE_CHR_LGR2_VOID_0: "The empire held Epirus and Thessaly; the West did not change hands as in history."
 OE_CHR_LGR2_VOID_1: "[GetCountry('BYZ').Custom('OeLgrWest')] [GetCountry('BYZ').Custom('OeLgrThs')] [GetCountry('BYZ').Custom('OeLgrEpi')]"
