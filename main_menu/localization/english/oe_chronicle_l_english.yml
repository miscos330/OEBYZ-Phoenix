 OE_CHR_EMDC_WAIT_0: "From the autumn of 1358 the crown of Cyprus may change hands; then come Alexandria (1365), Famagusta (1373), Khirokitia (1426) and the suit for a bride (1440)."
 OE_CHR_NAME_EMDW: "The Princes of Wallachia"
 OE_CHR_NAME_EMDW_TT: "#F Around 1364 the princes of Wallachia began to endow the monastery of Koutloumousiou on the Holy Mountain; in the autumn of 1394 or in May 1395 Mircea met Sultan Bayezid at Rovine, and who won is told differently; around 1409 Mircea allied with the claimant Musa; in 1416 Mircea sent troops to the pretender Mustafa, the sultan struck back, and Wallachia began to pay tribute.#!"
 OE_CHR_EMDW_VOID_0: "Wallachia is gone, has changed its faith, is in a player's hands or has joined the empire's side; this history will not come."
 OE_CHR_EMDW_VOID_1: "The gifts to the Holy Mountain, Rovine, the alliance in the interregnum and the sultan's revenge all failed to happen as in history."
