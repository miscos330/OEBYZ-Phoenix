 OE_CHR_SER_WAIT_0: "Waiting for Dušan to take the imperial title, or for Serbia to hold former imperial land."
 OE_CHR_NAME_GAL: "The Galata Dispute"
 OE_CHR_NAME_GAL_TT: "#F In 1348 John VI cut the customs at Constantinople and went to war with the Genoese of Galata; after the battle of the Bosporus in 1352 the empire had to make a separate peace.#!"
 OE_CHR_GAL_VOID_0: "The game did not start with the Genoese privileges at Galata (not the 1337 start); this line will not open."
 OE_CHR_GAL_DONE_0: "The reform Expel the Foreigners took Galata back and its privileges ended. [GetCountry('BYZ').Custom('OeChrGalDues')]"
 OE_CHR_GAL_DONE_1: "Genoa has fallen and Galata's privileges went with it. [GetCountry('BYZ').Custom('OeChrGalDues')]"
