 OE_CHR_MO_DONE_1: "A century on, the Morea is still in the empire's hands. [GetCountry('BYZ').Custom('OeChrMoWall')]"
 OE_CHR_MO_DONE_2: "Mistra has been lost."
 OE_CHR_MO_RUN_0: "The despotate has been founded. [GetCountry('BYZ').Custom('OeChrMoWall')]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#! scheduled events so far."
 OE_CHR_MO_RUN_1: "No despot was named; a kephale governs. [GetCountry('BYZ').Custom('OeChrMoWall')]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#! scheduled events so far."
 OE_CHR_MO_RUN_2: "The moment to name a despot has passed; the other chapters go on. [GetCountry('BYZ').Custom('OeChrMoWall')]#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_chr_mo_n')|0]#! scheduled events so far."
 OE_CHR_MO_RUN_3: "A Despot of the Morea may now be named (until the end of 1352)."
 OE_CHR_MO_WAIT_0: "From June 1348 a Despot of the Morea may be named."
 OE_CHR_NAME_CW2: "The Civil War of 1352"
 OE_CHR_NAME_CW2_TT: "#F In 1352 Matthew Kantakouzenos and John V went to war again; Ottoman troops beat the Serbs at Didymoteicho. In 1354 John V entered the city and John VI became a monk.#!"
 OE_CHR_CW2_VOID_0: "The fuse went out: someone died or fell from power, or 1365 passed."
 OE_CHR_CW2_VOID_1: "It did not break out before 1365; this war will not come."
 OE_CHR_CW2_VOID_2: "The civil war of 1341 never happened, so there is no second one."
 OE_CHR_CW2_VOID_3: "John Kantakouzenos is dead or has taken the habit."
 OE_CHR_CW2_VOID_4: "Matthew Kantakouzenos is dead."
 OE_CHR_CW2_VOID_5: "John V is dead."
 OE_CHR_CW2_VOID_6: "John V or the Kantakouzenoi are no longer in the empire."
 OE_CHR_CW2_DONE_0: "The Palaiologan side won: John V rules alone and Kantakouzenos took the habit (after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#! months)."
 OE_CHR_CW2_DONE_1: "John VI stepped down and John V took the throne without a war."
 OE_CHR_CW2_DONE_2: "The Kantakouzenoi kept the crown."
 OE_CHR_CW2_DONE_3: "A divided empire: the two sides drew a line after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#! months."
 OE_CHR_CW2_DONE_4: "No war: the two houses settled into an uneasy concord."
 OE_CHR_CW2_RUN_0: "Month #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_wm').GetValue|0]#! of the war: the tide stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = the Palaiologan side wins, #Y 0#! = the Kantakouzenoi win)."
 OE_CHR_CW2_RUN_1: "The rift has reached the point of war; it breaks out once the other civil war is over."
 OE_CHR_CW2_RUN_2: "The fuse: John VI reigns and John V is restless; the rift stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_rift').GetValue|0]#! / #Y 60#!."
 OE_CHR_CW2_RUN_3: "The fuse: John V reigns and the Kantakouzenoi will not step aside; the rift stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_cw2_rift').GetValue|0]#! / #Y 60#!."
 OE_CHR_CW2_WAIT_0: "Waiting for the civil war of 1341 to end."
 OE_CHR_CW2_WAIT_1: "Opens from 1351."
 OE_CHR_CW2_WAIT_2: "Waiting until John V is #Y 18#!, no other civil war is being fought, the court intrigue is over and the throne is held by John V or John VI."
 OE_CHR_NAME_ECR: "The Metropolitans of Rus'"
 OE_CHR_NAME_ECR_TT: "#F From 1353 Moscow and Lithuania contended for the metropolitan of all Rus', and the patriarch of Constantinople consecrated between them; in 1448 the bishops of Rus' chose Jonah as metropolitan without Constantinople.#!"
 OE_CHR_ECR_VOID_0: "[GetCountry('BYZ').Custom('OeEccChrRusVoid')]"
 OE_CHR_ECR_DONE_0: "[GetCountry('BYZ').Custom('OeEccChrRusDone')]"
 OE_CHR_ECR_RUN_0: "[GetCountry('BYZ').Custom('OeEccChrRusRun')]"
 OE_CHR_ECR_WAIT_0: "From 1353, when the see of all Rus' falls vacant, Rus' will send to Constantinople for a consecration."
 OE_CHR_ECR_WAIT_1: "Waiting for Rus' or Lithuania to send to Constantinople for a metropolitan."
 OE_CHR_NAME_BUL: "The Fall of Bulgaria"
 OE_CHR_NAME_BUL_TT: "#F A royal match around 1355 and the split at Vidin the next year; the Green Count took the Black Sea ports for the empire in 1366 and Bulgaria submitted to the sultan in 1373; Tarnovo fell in 1393 and Vidin in 1396.#!"
 OE_CHR_BUL_VOID_0: "Bulgaria outlasted the Middle Ages."
 OE_CHR_BUL_VOID_1: "Tarnovo belongs to the empire's bloc; Bulgaria will not fall as it did in history."
 OE_CHR_BUL_DONE_0: "Vidin fell and Bulgaria came to an end; the empire had won Anchialos and its coast in 1366. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes took place."
 OE_CHR_BUL_DONE_1: "Vidin fell and Bulgaria came to an end. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes took place."
 OE_CHR_BUL_RUN_0: "Tarnovo has fallen; Vidin still stands. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_RUN_1: "Bulgaria pays tribute to the sultan. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_RUN_2: "The two houses are joined by marriage. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_RUN_3: "Bulgaria is breaking apart. #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_nb_chr_bul_n')|0]#! of #Y 8#! episodes so far."
 OE_CHR_BUL_WAIT_0: "From 1355: a royal match, the split at Vidin, the quarrel over the Black Sea ports."
 OE_CHR_NAME_UN: "The Union of the Churches"
 OE_CHR_NAME_UN_TT: "#F The union was signed at Florence in July 1439, but read out in Hagia Sophia only on 12 December 1452.#!"
 OE_CHR_UN_VOID_0: "[GetCountry('BYZ').Custom('OeUnChrVoid')]"
 OE_CHR_UN_DONE_0: "[GetCountry('BYZ').Custom('OeUnChrDone')]"
 OE_CHR_UN_RUN_0: "[GetCountry('BYZ').Custom('OeUnChrRun')]"
 OE_CHR_UN_WAIT_0: "[GetCountry('BYZ').Custom('OeUnChrWait')]"
 OE_CHR_NAME_EMDC: "Lusignan Cyprus"
 OE_CHR_NAME_EMDC_TT: "#F In 1358 Hugh IV gave the throne to Peter I; in 1365 Peter I sailed from Rhodes and sacked Alexandria; around 1373 the Genoese seized Famagusta.#!"
 OE_CHR_EMDC_VOID_0: "The Kingdom of Cyprus is gone, has changed its faith, has joined the empire's side or has lost the island; this history will not come."
 OE_CHR_EMDC_VOID_1: "Peter I's accession, the sack of Alexandria and the fall of Famagusta all failed to happen as in history."
 OE_CHR_EMDC_DONE_0: "[GetCountry('BYZ').Custom('OeEmdPeter')] [GetCountry('BYZ').Custom('OeEmdAlex')] [GetCountry('BYZ').Custom('OeEmdFam')]"
 OE_CHR_EMDC_DONE_1: "[GetCountry('BYZ').Custom('OeEmdPeter')] [GetCountry('BYZ').Custom('OeEmdAlex')] [GetCountry('BYZ').Custom('OeEmdFam')] [GetCountry('BYZ').Custom('OeEmdFamSide')]"
 OE_CHR_EMDC_RUN_0: "[GetCountry('BYZ').Custom('OeEmdPeter')] [GetCountry('BYZ').Custom('OeEmdAlex')] [GetCountry('BYZ').Custom('OeEmdFam')]"
 OE_CHR_EMDC_WAIT_0: "From the autumn of 1358 the crown of Cyprus may change hands; then come Alexandria (1365) and Famagusta (1373)."
 OE_CHR_NAME_VAS: "Vassal of the Sultan"
 OE_CHR_NAME_VAS_TT: "#F After the Maritsa John V became the vassal of Murad I; in 1376 his son Andronikos IV seized the throne with Genoese and Ottoman help, and John V was restored in 1379.#!"
 OE_CHR_VAS_VOID_0: "The Ottoman state no longer exists."
 OE_CHR_VAS_VOID_1: "The house of Osman has joined the empire; there is no sultan to demand tribute."
 OE_CHR_VAS_VOID_2: "The empire refused the sultan three times; the sultan asks no more."
 OE_CHR_VAS_VOID_3: "The empire did not become the sultan's vassal before 1394; this history will not come."
 OE_CHR_VAS_DONE_0: "The sultan's wrath: the vassalage broke and the truce ended. [GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_1: "Free of the yoke: the Ottomans were no longer stronger, and the vassalage ended. [GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_2: "The Ottoman state fell and the vassalage with it. [GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_3: "The house of Osman joined the empire and the vassalage ended. [GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_DONE_4: "By 1394 the vassalage had quietly lapsed. [GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_RUN_0: "The usurper's war: the tide stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_tide').GetValue|0]#! / #Y 100#! (#Y 100#! = the usurper is beaten, #Y 0#! = the usurper takes the city)."
 OE_CHR_VAS_RUN_1: "The usurper reigns; the old emperor is a prisoner."
 OE_CHR_VAS_RUN_2: "The old emperor is restored; the usurper holds out in Galata."
 OE_CHR_VAS_RUN_3: "Vassal of the sultan: the sultan's patience stands at #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_patience').GetValue|0]#! / #Y 100#!. [GetCountry('BYZ').Custom('OeChrVasHeir')]"
 OE_CHR_VAS_WAIT_0: "The empire turned down the sultan's terms (#Y [GetCountry('BYZ').MakeScope.GetVariable('oe_vas_asks').GetValue|0]#! times); the sultan will ask again in a few years, and not after #Y 3#! refusals."
 OE_CHR_VAS_WAIT_1: "The empire played for time, pointing to help from the West; the sultan will ask again in two years."
 OE_CHR_VAS_WAIT_2: "From 1371, when the Ottomans hold Thrace and far outnumber the empire, the sultan will state his terms."
 OE_CHR_VAS_WAIT_3: "Waiting until the Ottomans hold Thrace with more than #Y 1.5#! times the empire's army, and the empire is not in a civil war."
 OE_CHR_NAME_ECC: "The Churches Reconciled"
 OE_CHR_NAME_ECC_TT: "#F In 1375 Constantinople lifted its anathema on the Serbian Church and recognised the patriarch at Peć; Tarnovo fell in 1393, and the next year the Bulgarian sees passed to the Ecumenical Patriarchate.#!"
 OE_CHR_ECC_VOID_0: "The empire no longer leads the Ecumenical Patriarchate."
 OE_CHR_ECC_VOID_1: "Serbia never came to seek reconciliation and the question of the Bulgarian sees never arose; this history will not come."
 OE_CHR_ECC_DONE_0: "[GetCountry('BYZ').Custom('OeEccChrSerbia')] [GetCountry('BYZ').Custom('OeEccChrTarnovo')]"
 OE_CHR_ECC_RUN_0: "Reconciled with the Serbian Church; the question of the Bulgarian sees is still to come."
 OE_CHR_ECC_RUN_1: "Peć has stepped down to an archbishopric; the question of the Bulgarian sees is still to come."
 OE_CHR_ECC_RUN_2: "The envoys of Peć were turned away; they may come again in ten years."
 OE_CHR_ECC_RUN_3: "[GetCountry('BYZ').Custom('OeEccChrSerbia')] [GetCountry('BYZ').Custom('OeEccChrTarnovo')]"
 OE_CHR_ECC_WAIT_0: "Serbia never came to seek reconciliation; waiting for a change at Tarnovo."
 OE_CHR_ECC_WAIT_1: "Waiting for Serbia after Dušan to seek reconciliation, or for a change at Tarnovo."
 OE_CHR_NAME_THSA: "The Second Court at Thessalonica"
 OE_CHR_NAME_THSA_TT: "#F In the autumn of 1382 Manuel slipped away to Thessalonica, set up a court there and fought the Ottomans; the city was besieged from 1383 and opened its gates in April 1387.#!"
 OE_CHR_THSA_VOID_0: "No imperial son left for Thessalonica before 1395; this history will not come."
 OE_CHR_THSA_DONE_0: "The gates opened: the city went to the Ottomans and kept its privileges."
 OE_CHR_THSA_DONE_1: "The gates opened on terms: the city stayed with the empire and pays the sultan every year."
 OE_CHR_THSA_DONE_2: "Held: four years of blockade, and the city never gave in."
 OE_CHR_THSA_DONE_3: "The emperor called the prince back, and the second court never formed."
 OE_CHR_THSA_DONE_4: "The prince died, and the second court fell apart."
 OE_CHR_THSA_DONE_5: "The Ottoman threat vanished, and the second court with it."
 OE_CHR_THSA_DONE_6: "Thessaloniki was lost in war, and the second court with it."
 OE_CHR_THSA_DONE_7: "The Ottoman army never came, and the prince returned to the capital."
 OE_CHR_THSA_RUN_0: "Under siege: Resolve #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#! months of blockade."
 OE_CHR_THSA_RUN_1: "The prince holds court at Thessaloniki; the Ottomans have not reached the walls yet."
 OE_CHR_THSA_RUN_2: "The prince has left for Thessaloniki; the empire weighs its answer."
 OE_CHR_THSA_WAIT_0: "From 1376 an imperial son passed over for the succession may leave for Thessaloniki."
 OE_CHR_THSA_WAIT_1: "Waiting until an imperial son is passed over for the succession or the Ottomans reach Macedonia, while the empire holds Thessaloniki and is not in a civil war."
 OE_CHR_NAME_BYD: "Bayezid's Blockade"
 OE_CHR_NAME_BYD_TT: "#F From 1394 Bayezid I blockaded Constantinople; in 1396 the crusade was crushed at Nicopolis; in 1399 Manuel II went west to seek help; after Ankara in 1402 the blockade was lifted.#!"
 OE_CHR_BYD_VOID_0: "The blockade came to nothing: the house of Osman has joined the empire."
 OE_CHR_BYD_VOID_1: "The Ottoman state no longer exists."
 OE_CHR_BYD_VOID_2: "The house of Osman has joined the empire; there will be no blockade."
 OE_CHR_BYD_VOID_3: "The interregnum came first; no sultan is able to blockade the capital."
 OE_CHR_BYD_VOID_4: "No sultan blockaded the capital before 1420; this history will not come."
 OE_CHR_BYD_DONE_0: "Handed to the interregnum: the sultan had troubles of their own, and the blockade lifted after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_1: "The blockade broke up: the sultan could no longer hold the city in, after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_2: "Terms and tribute: the empire accepted the sultan's terms after #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_DONE_3: "The capital was lost, and the blockade with it."
 OE_CHR_BYD_RUN_0: "The blockade is over; the capital is picking up the pieces."
 OE_CHR_BYD_RUN_1: "Under blockade for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_m').GetValue|0]#! months; grain stores #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_food').GetValue|0]#!, city morale #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_byd_morale').GetValue|0]#!. [GetCountry('BYZ').Custom('OeBydWest')]"
 OE_CHR_BYD_WAIT_0: "The empire answered the sultan's summons, and the blockade is put off for now."
 OE_CHR_BYD_WAIT_1: "Waiting for #Y 1394#!, or from 1385 if the sultan's wrath has already broken out."
 OE_CHR_BYD_WAIT_2: "Waiting until the Ottomans stand at the capital with more than #Y 1.5#! times the empire's army."
 OE_CHR_NAME_EMDW: "The Princes of Wallachia"
 OE_CHR_NAME_EMDW_TT: "#F In the autumn of 1394 or in May 1395 Prince Mircea of Wallachia met Sultan Bayezid at Rovine, and who won is told differently; in 1396 Mircea rode with the crusade to Nicopolis.#!"
 OE_CHR_EMDW_VOID_0: "Wallachia is gone, has changed its faith, is in a player's hands or has joined the empire's side; this history will not come."
 OE_CHR_EMDW_VOID_1: "[GetCountry('BYZ').Custom('OeEmdRov')]"
 OE_CHR_EMDW_DONE_0: "[GetCountry('BYZ').Custom('OeEmdRov')] [GetCountry('BYZ').Custom('OeEmdRovSide')]"
 OE_CHR_EMDW_RUN_0: "[GetCountry('BYZ').Custom('OeEmdRov')] [GetCountry('BYZ').Custom('OeEmdRovSide')]"
 OE_CHR_EMDW_WAIT_0: "From the autumn of 1394 the sultan may cross the Danube and fight the Prince of Wallachia."
 OE_CHR_NAME_IVR: "The Ottoman Interregnum"
 OE_CHR_NAME_IVR_TT: "#F Timur captured Bayezid I at Ankara in 1402 and his sons fought over the throne for eleven years; the Treaty of Gallipoli of 1403 returned Thessalonica and the coast to the empire.#!"
 OE_CHR_IVR_VOID_0: "The contest stopped half-way: the Ottoman state is gone, or the house of Osman has joined the empire."
 OE_CHR_IVR_VOID_1: "The Ottoman state no longer exists."
 OE_CHR_IVR_VOID_2: "The house of Osman has joined the empire; there will be no interregnum."
 OE_CHR_IVR_DONE_0: "The Treaty of Gallipoli: the coastal cities came back and the tribute ended."
 OE_CHR_IVR_DONE_1: "The Treaty of Gallipoli was signed, but after the new sultan's reckoning the empire pays tribute again."
 OE_CHR_IVR_DONE_2: "The empire backed no one, or no treaty was signed."
 OE_CHR_IVR_RUN_0: "The princes have fought for #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#! months; the empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 OE_CHR_IVR_RUN_1: "The news from Ankara has come; the empire weighs its choice."
 OE_CHR_IVR_WAIT_0: "Waiting for Timur to capture the sultan (historically at Ankara in 1402)."
 OE_CHR_IVR_WAIT_1: "Waiting for the sultan's capture, or for an Ottoman civil war."
 OE_CHR_NAME_DSP: "A Despot for Serbia"
 OE_CHR_NAME_DSP_TT: "#F After Ankara in 1402 Stefan Lazarević of Serbia passed through Constantinople and was made a despot; the Serbian state came to be called a despotate.#!"
 OE_CHR_DSP_VOID_0: "In the two years after Ankara no eligible Orthodox ruler of the Balkans came, or the empire had troubles of its own."
 OE_CHR_DSP_VOID_1: "The Ottoman state is gone, or the house of Osman has joined the empire; no guest will come after Ankara."
 OE_CHR_DSP_DONE_0: "The ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] was made a despot at the Blachernae."
 OE_CHR_DSP_DONE_1: "The ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] was made a sebastokrator."
 OE_CHR_DSP_DONE_2: "The empire feasted the ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] but conferred no dignity."
 OE_CHR_DSP_DONE_3: "When the news of Ankara came, the ruler of [GetCountry('BYZ').MakeScope.GetVariable('oe_dsp_guest').GetCountry.GetName] was already a despot of the empire."
 OE_CHR_DSP_RUN_0: "The empire is in a civil war or does not hold Constantinople; no guest will come for now."
 OE_CHR_DSP_RUN_1: "For two years after the news from Ankara, an Orthodox ruler of the Balkans may come to the city."
 OE_CHR_DSP_WAIT_0: "Waiting for the Ottoman interregnum to begin (historically after Ankara in 1402)."
 OE_CHR_NAME_THSM: "The Revolt of Mustafa"
 OE_CHR_NAME_THSM_TT: "#F Around 1416 the Ottoman prince Mustafa fled to Thessalonica after a failed revolt and was kept under guard by the empire; when the sultan died in 1421 the empire let Mustafa go to fight for the throne. Mustafa was beaten and killed in 1422, and in 1424 the empire paid tribute again.#!"
 OE_CHR_THSM_VOID_0: "The empire handed the refugee back to the sultan."
 OE_CHR_THSM_VOID_1: "The empire saw the refugee off with honour."
 OE_CHR_THSM_VOID_2: "The prince in custody died or left the empire."
 OE_CHR_THSM_VOID_3: "The sultan was still on the throne in 1440."
 OE_CHR_THSM_VOID_4: "No Ottoman prince sought refuge before 1440."
 OE_CHR_THSM_DONE_0: "The bet won: the prince took the sultan's throne, and the empire's tribute ended."
 OE_CHR_THSM_DONE_1: "The empire switched to the sultan in time and stood with the winner."
 OE_CHR_THSM_DONE_2: "The bet lost: peace in 1424, and the empire pays tribute again."
 OE_CHR_THSM_DONE_3: "The bet lost: the empire refused the peace of 1424."
 OE_CHR_THSM_DONE_4: "The bet lost: the new sultan came in arms."
 OE_CHR_THSM_DONE_5: "The empire handed the prince to the new sultan."
 OE_CHR_THSM_DONE_6: "The contest came to nothing, or the empire only watched."
 OE_CHR_THSM_RUN_0: "The contest has lasted #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#! months; the empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 OE_CHR_THSM_RUN_1: "The empire keeps an Ottoman prince under guard and waits for the sultan to change."
 OE_CHR_THSM_WAIT_0: "From 1410 (or after the Ottoman interregnum) a disappointed Ottoman prince may seek refuge."
 OE_CHR_THSM_WAIT_1: "Waiting for a disappointed Ottoman prince to seek refuge, with no bet running and no war with the Ottomans."
 OE_CHR_NAME_THSD: "The Blockade of Thessalonica"
 OE_CHR_NAME_THSD_TT: "#F The Ottomans blockaded Thessalonica in 1422; in 1423 the despot Andronikos handed the city to Venice; Murad II stormed it in March 1430.#!"
 OE_CHR_THSD_VOID_0: "When the time for the blockade came, Thessaloniki was no longer the empire's."
 OE_CHR_THSD_VOID_1: "No blockade came before 1453."
 OE_CHR_THSD_DONE_0: "Given to Venice; the city later fell to the Ottomans all the same."
 OE_CHR_THSD_DONE_1: "Given to Venice, which defends it."
 OE_CHR_THSD_DONE_2: "Its resolve spent, the city went to the Ottomans."
 OE_CHR_THSD_DONE_3: "Its resolve spent, the city stayed with the empire and pays the sultan every year."
 OE_CHR_THSD_DONE_4: "Held: five years of blockade, and the city never gave in."
 OE_CHR_THSD_DONE_5: "The empire paid, and the sultan lifted the blockade."
 OE_CHR_THSD_DONE_6: "Thessaloniki was lost in war."
 OE_CHR_THSD_DONE_7: "The Ottoman threat vanished, and the blockade ended."
 OE_CHR_THSD_RUN_0: "Under blockade: Resolve #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!, #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#! months; [GetCountry('BYZ').Custom('OeThsVenOk')]."
 OE_CHR_THSD_WAIT_0: "Waiting: the empire backed Mustafa and lost, refused the peace of 1424, or is at war with the Ottomans while they encircle the city."
 OE_CHR_H_OECHRVASHEIR_0: "The settlement: the elder son's line inherits."
 OE_CHR_H_OECHRVASHEIR_1: "The settlement: the second son stays heir."
 OE_CHR_H_OECHRVASHEIR_2: "The usurper once took the city; the old emperor has been restored."
 OE_CHR_H_OECHRVASHEIR_3: "The usurper once took the city."
 OE_CHR_H_OECHRVASHEIR_4: ""
 OE_CHR_H_OECHRMOWALL_0: "The Hexamilion stands. "
 OE_CHR_H_OECHRMOWALL_1: ""
 OE_CHR_H_OECHRGALDUES_0: "The low dues at Constantinople remain: [ShowModifier('oe_s37_gal_dues')]."
 OE_CHR_H_OECHRGALDUES_1: ""
