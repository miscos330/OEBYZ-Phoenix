 # NEW 2026-11-18 fourth round D4 (oe_trc_). Generated by gen_round4_reclaim.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_trc_settle_a: "Old Order Restored"
 STATIC_MODIFIER_DESC_oe_trc_settle_a: "Imperial officials have come back to tax and govern by the old registers. The place returns to an order it knows."
 STATIC_MODIFIER_NAME_oe_trc_settle_b: "Land Granted to Soldiers"
 STATIC_MODIFIER_DESC_oe_trc_settle_b: "The court has granted soldiers the right to collect part of the taxes here, as a reward for their service. There are more men for the army, and the peasants carry more."
 STATIC_MODIFIER_NAME_oe_trc_settle_bp: "Land Granted to Soldiers (Pronoia)"
 STATIC_MODIFIER_DESC_oe_trc_settle_bp: "The court has granted soldiers part of the taxes here as pronoia. Pronoia holders can be formed into units for war, so the levies are larger."
 STATIC_MODIFIER_NAME_oe_trc_settle_c: "Taxes Remitted for Settlers"
 STATIC_MODIFIER_DESC_oe_trc_settle_c: "Land abandoned because of war belongs to the state by law. The court has remitted the taxes here to bring the scattered households home and draw new settlers. For some years the officials collect little from this place."
 STATIC_MODIFIER_NAME_oe_trc_settle_d: "Monastic Estate"
 STATIC_MODIFIER_DESC_oe_trc_settle_d: "The estates here have been given to the monasteries. Imperial privileges for monasteries mostly exempted their lands from taxes and kept officials out. The monks manage the land, and the district is quieter for it."
 oe_trc_region_unknown: "the old jurisdiction"
 oe_trc.1.t: "Settling a Reclaimed Province"
 oe_trc.1.d1: "Around 1333 Stephen Gabrielopoulos, the ruler of Thessaly, died, and his heirs fell to quarrelling. John II Orsini of Epirus moved in. Andronikos III ordered Michael Monomachos at Thessalonica to intervene; the empire took the north and east of Thessaly, and Monomachos stayed on as governor of the new province with the title of protosebastos. The Albanians of the region, independent until then, were brought under imperial rule.\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations of [GetCountry('BYZ').Custom('OeTrcRegion')] are under imperial rule again; in [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0] of them most people are Orthodox. After the fighting the fields lie waste, many households have fled and the old offices are gone. The court must decide how to settle them. The chosen settlement lasts 5 years."
 oe_trc.1.d2: "In 1337 Andronikos III led an army into northern Epirus and first put down the raids of the Albanians. Anna, regent for her son Nikephoros II, at last surrendered the despotate, and Theodore Synadenos became its governor. In 1339 a revolt broke out in Nikephoros' name. The next year the emperor came in person with John Kantakouzenos; Nikephoros gave up Thomokastron, married Kantakouzenos' daughter Maria and received the title of panhypersebastos. John Angelos then became governor of Epirus, with his seat at Arta.\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations of [GetCountry('BYZ').Custom('OeTrcRegion')] are under imperial rule again; in [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0] of them most people are Orthodox. After the fighting the fields lie waste, many households have fled and the old offices are gone. The court must decide how to settle them. The chosen settlement lasts 5 years."
 oe_trc.1.d3: "Imperial privileges for monasteries mostly barred officials from entering their lands and exempted them from taxes (exkousseia). The Athonite monastery of Iviron held land and dependent peasants in the theme of Thessalonike. In November 1318 the apographeis Konstantinos Pergamenos and Georgios Pharisaios registered them all and issued the monastery's praktikon.\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations of [GetCountry('BYZ').Custom('OeTrcRegion')] are under imperial rule again; in [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0] of them most people are Orthodox. After the fighting the fields lie waste, many households have fled and the old offices are gone. The court must decide how to settle them. The chosen settlement lasts 5 years."
 oe_trc.1.d: "In the fourteenth century the empire was still winning back lost land. Around 1333 Andronikos III recovered Thessaly and left Michael Monomachos to govern the new province as protosebastos. Between 1337 and 1340 he recovered Epirus: the despot Nikephoros II gave up Thomokastron, married a daughter of John Kantakouzenos and was made panhypersebastos.\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations of [GetCountry('BYZ').Custom('OeTrcRegion')] are under imperial rule again; in [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0] of them most people are Orthodox. After the fighting the fields lie waste, many households have fled and the old offices are gone. The court must decide how to settle them. The chosen settlement lasts 5 years."
 oe_trc.1.a: "Restore the old order"
 oe_trc.1.a.tt: "Each of the [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations gets 'Old Order Restored' (5 years): monthly control +1%, max control +5%."
 oe_trc.1.b: "Grant the land to soldiers"
 oe_trc.1.b.tt: "Each of the [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations gets 'Land Granted to Soldiers' (5 years): monthly manpower +25%, levy size +25%, monthly prosperity −0.25%.\nUnder a pronoia policy the levy size would be +50% (there is none now)."
 oe_trc.1.bp: "Grant the land to soldiers"
 oe_trc.1.bp.tt: "Each of the [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations gets 'Land Granted to Soldiers (Pronoia)' (5 years): monthly manpower +25%, levy size +50%, monthly prosperity −0.25%.\nThe empire has a pronoia policy, so the levy bonus is larger."
 oe_trc.1.c: "Remit taxes and call settlers"
 oe_trc.1.c.tt: "Each of the [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_n').GetValue|0] locations gets 'Taxes Remitted for Settlers' (5 years): population growth +0.5%, migration attraction +0.5, max control −50%.\nMax control falls because the court collects little for some years: the local taxes and manpower fall with control."
 oe_trc.1.m1: "Give the estates to the monasteries of Mount Athos"
 oe_trc.1.m1.tt: "The [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0] locations where most people are Orthodox each get 'Monastic Estate' (5 years): unrest −20%, pop conversion speed +25%, local clergy power +25%, max control −10% (the monasteries pay no tax and officials stay out).\nThe other locations are settled as 'Old Order Restored': monthly control +1%, max control +5%.\nClergy satisfaction +5%."
 oe_trc.1.m2: "Give the land to the monasteries"
 oe_trc.1.m2.tt: "The [GetCountry('BYZ').MakeScope.GetVariable('oe_trc_orth_n').GetValue|0] locations where most people are Orthodox each get 'Monastic Estate' (5 years): unrest −20%, pop conversion speed +25%, local clergy power +25%, max control −10% (the monasteries pay no tax and officials stay out).\nThe other locations are settled as 'Old Order Restored': monthly control +1%, max control +5%.\nClergy satisfaction +5%."
 oe_trc.9.t: "Settlement takes effect"
