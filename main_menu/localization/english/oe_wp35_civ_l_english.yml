 # Project Phoenix v40.0 WP35: Great Power 3-Stage Arcs, FRA/SPA Systems & Cultural Synthesis.
 oe_wp35_fn_mehmed: "Mehmed"
 oe_wp35_ln_koprulu_pasha: "Köprülü Pasha"
