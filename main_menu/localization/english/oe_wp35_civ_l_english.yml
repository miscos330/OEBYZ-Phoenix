 oe_wp35_ln_de_olivares: "de Olivares"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_tur_kapikulu: "Expanded Kapikulu & Janissary Corps"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_tur_kapikulu: "Elite devshirme recruitment sharpens Ottoman infantry discipline and manpower reserves, at the cost of higher military upkeep and estate friction."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_tur_porte_reform: "Disciplined Sublime Porte Administration"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_tur_porte_reform: "Curbing Janissary palace meddling restores imperial stability, crown leverage, and treasury discipline while temporarily softening shock-infantry edge."
 oe_wp35_civ.1.a: "Enlarge the Janissary ortas and drill with modern muskets"
 oe_wp35_civ.1.b: "Balance Kapikulu recruitment with provincial Sipahi fiefs"
 oe_wp35_civ.1.c: "Promote a veteran Janissary Agha to lead imperial drills"
 oe_wp35_civ_tur_expand_kapikulu: "Expand the Kapikulu & Janissary Corps"
 oe_wp35_civ_tur_expand_kapikulu.title: "Expand the Kapikulu & Janissary Corps"
 oe_wp35_civ_tur_expand_kapikulu.desc: "Widen the devshirme levy and endow new Janissary orta barracks to forge an unmatched standing infantry corps, weighing elite discipline against treasury strain and palace politics."
 oe_wp35_civ_tur_expand_kapikulu.a: "Summon the Janissary Agha to expand the corps"
 oe_wp35_civ.1.title: "The Devshirme Levy & Janissary Barracks"
 oe_wp35_civ.1.desc: "Across the courtyard of the Topkapi Divan, tall Janissary standard-bearers stand at attention while provincial kadis report the tally of fresh devshirme recruits. Expanding the salaried Kapikulu corps promises formidable battlefield discipline and heavy infantry punch, yet grandees warn that pampered barracks soon dictate terms to the throne."
 oe_wp35_civ.2.a: "Purge ghost payrolls and restore Grand Vizier oversight"
 oe_wp35_civ.2.b: "Buy off the barracks with ceremonial donatives to preserve discipline"
 oe_wp35_civ.2.c: "Appoint a resolute Koprulu-style reformer to the Divan"
 oe_wp35_civ_tur_curb_janissaries: "Curb Janissary Political Meddling"
 oe_wp35_civ_tur_curb_janissaries.title: "Curb Janissary Political Meddling"
 oe_wp35_civ_tur_curb_janissaries.desc: "Audit barracks payrolls, rotate senior Janissary officers, and reassert the Grand Vizier's civilian authority over the Porte, trading raw military edge for enduring stability and estate harmony."
 oe_wp35_civ_tur_curb_janissaries.a: "Audit the barracks and reinforce Porte authority"
 oe_wp35_civ.2.title: "Reining in the Barracks at the Sublime Porte"
 oe_wp35_civ.2.desc: "Whispers of overturned soup cauldrons echo through the capital's bazaars after treasury inspectors uncovered phantom payrolls and unauthorized guild rackets run by retired Janissary officers. Now is the decisive hour for the Porte to reimpose strict civil discipline without shattering the Sultan's elite guard."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_per_qizilbash: "Qizilbash Tribal Cavalry Hosts"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_per_qizilbash: "Devoted Turkmen horsemen charge with fiery zeal and swelling levies, though powerful tribal amirs dilute royal provincial control."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_per_ghulam: "Shah Abbas Ghulam Standing Army"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_per_ghulam: "Crown-funded musketeers, artillery parks, and royal Ghulam regiments centralize Iranian authority at higher upkeep and lower tribal levies."
 oe_wp35_civ.3.a: "Grant tiyul frontier pastures to rally full Qizilbash hosts"
 oe_wp35_civ.3.b: "Channel tribal zeal into royal gunpowder regiments instead"
 oe_wp35_civ.3.c: "Elevate a celebrated Qizilbash warlord as border commander"
 oe_wp35_civ_per_mobilize_qizilbash: "Mobilize the Qizilbash Tribal Hosts"
 oe_wp35_civ_per_mobilize_qizilbash.title: "Mobilize the Qizilbash Tribal Hosts"
 oe_wp35_civ_per_mobilize_qizilbash.desc: "Summon the crimson-turbaned Turkmen tribes from Tabriz to Khorasan, unleashing devastating light-cavalry shock and warlike morale at the price of greater tribal autonomy."
 oe_wp35_civ_per_mobilize_qizilbash.a: "Raise the crimson banners across the Iranian plateau"
 oe_wp35_civ.3.title: "Riders of the Crimson Crown: The Qizilbash Hosts"
 oe_wp35_civ.3.desc: "Columns of dust rise along the mountain passes as Shamlu, Ustajlu, and Afshar chieftains ride into the royal camp under silk standards. Their unmatched horsemanship can shatter invading armies across the plateau, yet every governorate granted to their amirs weakens the Shah's direct hold on provincial revenues."
 oe_wp35_civ.4.a: "Establish permanent Ghulam musketeer and artillery corps"
 oe_wp35_civ.4.b: "Preserve a hybrid Qizilbash-gunpowder vanguard to appease tribes"
 oe_wp35_civ.4.c: "Recruit a master Ghulam artillery commander into royal service"
 oe_wp35_civ_per_ghulam_reform: "Enact Shah Abbas Ghulam Standing Army Reform"
 oe_wp35_civ_per_ghulam_reform.title: "Enact Shah Abbas Ghulam Standing Army Reform"
 oe_wp35_civ_per_ghulam_reform.desc: "Convert provincial lands into crown khasseh domains to fund loyal Ghulam musketeers and cast bronze field cannon, breaking tribal monopolies over Persian warfare."
 oe_wp35_civ_per_ghulam_reform.a: "Commission bronze foundries and Ghulam barracks"
 oe_wp35_civ.4.title: "Gunpowder & Royal Discipline: The Ghulam Reform"
 oe_wp35_civ.4.desc: "Inside the newly built cannon foundries of the royal capital, master founders inspect gleaming bronze culverins alongside disciplined rows of Ghulam cavalrymen and tufangchi musketeers paid directly from crown silk revenues. Tribal elders grumble at losing their hereditary monopolies, yet Persia's armies now rival the greatest gunpowder empires."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_rus_cossack_frontier: "Chartered Frontier Cossack Hosts"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_rus_cossack_frontier: "Self-governing Don, Volga, and Siberian Cossack hosts spearhead steppe cavalry raids and frontier settlement, at the price of tax exemptions and looser control."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_rus_zemsky_sobor: "Zemsky Sobor & Centralized Prikazy"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_rus_zemsky_sobor: "A disciplined assembly of the land and streamlined central chanceries bolster autocratic legitimacy, stability, and cabinet effectiveness while curbing wild frontier drift."
 oe_wp35_civ.5.a: "Confirm frontier tax freedoms to expand the Cossack Hosts"
 oe_wp35_civ.5.b: "Place border ostrogs under central Moscow prikaz governors"
 oe_wp35_civ.5.c: "Commission a legendary frontier Cossack Ataman"
 oe_wp35_civ_rus_cossack_hosts: "Charter the Frontier Cossack Hosts"
 oe_wp35_civ_rus_cossack_hosts.title: "Charter the Frontier Cossack Hosts"
 oe_wp35_civ_rus_cossack_hosts.desc: "Dispatch powder, grain, and royal charters to the steppe forts along the Wild Field and Ural rivers, trading frontier tax exemptions for fierce Cossack cavalry and rapid eastern settlement."
 oe_wp35_civ_rus_cossack_hosts.a: "Dispatch royal charters and powder to the steppe forts"
 oe_wp35_civ.5.title: "Watchtowers of the Wild Field: The Cossack Hosts"
 oe_wp35_civ.5.desc: "From stockaded river islands along the Don to birch-log ostrogs pushing past the Urals, bearded Cossack atamans present captured steppe banners alongside requests for royal grain, gunpowder, and freedom from tax collectors. Embracing these hardy horsemen accelerates eastern colonization and fortifies our cavalry screen, though Moscow's clerks will scarcely collect a kopek along the frontier."
 oe_wp35_civ.6.a: "Codify the Zemsky Sobor and central prikaz ministries"
 oe_wp35_civ.6.b: "Redirect restless servitors to open Cossack frontier marches"
 oe_wp35_civ.6.c: "Elevate an able Zemshchina chancellor to overhaul the prikazy"
 oe_wp35_civ_rus_zemsky_sobor: "Convene the Zemsky Sobor & Balance the Oprichnina"
 oe_wp35_civ_rus_zemsky_sobor.title: "Convene the Zemsky Sobor & Balance the Oprichnina"
 oe_wp35_civ_rus_zemsky_sobor.desc: "Summon boyars, service gentry, clergy, and townsmen to Moscow to codify central prikaz authority and temper harsh Oprichnina excesses with institutional stability."
 oe_wp35_civ_rus_zemsky_sobor.a: "Summon the Estates of the Land to the Kremlin"
 oe_wp35_civ.6.title: "The Zemsky Sobor & the Shadow of the Oprichnina"
 oe_wp35_civ.6.desc: "Beneath the frescoed vaults of the Kremlin's Faceted Chamber, provincial service nobles, cathedral metropolitans, and merchant elders gather to debate the legal code of Rus. Hardline crown servitors urge an iron-fisted Oprichnina purge against entrenched boyar clans, whereas conciliatory statesmen champion a durable Zemsky Sobor binding every estate to the Tsar's law."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_ind_mansabdar: "Codified Mansabdar & Nayankara Cadre"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_ind_mansabdar: "Ranked military-revenue assignments mobilize armored cavalry, manpower, and land taxes across the subcontinent, straining upkeep and noble patience."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_ind_sulh_i_kul: "Sulh-i-Kul & Royal Temple Patronage"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_ind_sulh_i_kul: "Universal peace across faiths and munificent patronage of Deccan and Gangetic shrines bolster legitimacy and harmony while slowing conversion and militant levy zeal."
 oe_wp35_civ.7.a: "Enforce strict Zat-and-Sawar cavalry musters and land audits"
 oe_wp35_civ.7.b: "Pair revenue reform with generous temple and community grants"
 oe_wp35_civ.7.c: "Promote an incorruptible Todar Mal-style revenue commander"
 oe_wp35_civ_ind_mansabdar: "Codify the Mansabdar Revenue-Military Cadre"
 oe_wp35_civ_ind_mansabdar.title: "Codify the Mansabdar Revenue-Military Cadre"
 oe_wp35_civ_ind_mansabdar.desc: "Institute audited Zat-and-Sawar military ranks and rotating jagir or nayankara assignments, welding regional elites into a disciplined revenue and armored-cavalry machine."
 oe_wp35_civ_ind_mansabdar.a: "Issue imperial rank patents and muster rolls"
 oe_wp35_civ.7.title: "Zat & Sawar: Codifying the Mansabdar Cadre"
 oe_wp35_civ.7.desc: "Scribes brand warhorses with imperial seals along the red-sandstone parade ground while revenue ministers cross-check village harvest ledgers against each commander's promised cavalry quota. Enforcing strict Mansabdar and Nayankara accountability swells both the treasury and heavy cavalry ranks, though proud hereditary lords resent periodic audits of their estates."
 oe_wp35_civ.8.a: "Enshrine Sulh-i-Kul and endow shrines across Hindustan and the Deccan"
 oe_wp35_civ.8.b: "Prioritize martial Mansabdar retainers over temple endowments"
 oe_wp35_civ.8.c: "Appoint a celebrated syncretic philosopher-minister to the court"
 oe_wp35_civ_ind_sulh_i_kul: "Proclaim Sulh-i-Kul & Subcontinental Temple Patronage"
 oe_wp35_civ_ind_sulh_i_kul.title: "Proclaim Sulh-i-Kul & Subcontinental Temple Patronage"
 oe_wp35_civ_ind_sulh_i_kul.desc: "Convene scholars of every faith at court and endow historic shrines across Hindustan and the Deccan, securing deep legitimacy and communal peace at the cost of slower proselytism."
 oe_wp35_civ_ind_sulh_i_kul.a: "Open the House of Debate and endow sacred shrines"
 oe_wp35_civ.8.title: "Sulh-i-Kul: Peace with All & Deccan Patronage"
 oe_wp35_civ.8.desc: "Under carved sandstone arches lit by oil lamps, Sufi mystics, Brahmin pandits, Jain ascetics, and Persian chroniclers gather at our invitation to debate law, astronomy, and justice. Enshrining Sulh-i-Kul and protecting revered Hindu and Islamic sanctuaries alike wins fierce popular devotion across India's patchwork of faiths, though zealous preachers lament the halt of forced conversions."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_tur_koprulu_nizam: "Köprülü Audit & Nizam-i Cedid Order"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_tur_koprulu_nizam: "Iron-fisted grand-vizieral audits and European-drilled Nizam regiments sharpen Ottoman discipline, artillery, and central control while straining military upkeep and entrenched notables."
 oe_wp35_civ_tur_koprulu_nizam: "Köprülü Audit & Nizam-i Cedid Modernization"
 oe_wp35_civ_tur_koprulu_nizam.title: "Köprülü Audit & Nizam-i Cedid Modernization"
 oe_wp35_civ_tur_koprulu_nizam.desc: "Culminate the Ottoman state reform arc by commissioning a sweeping Köprülü fiscal audit in Constantinople and drilling a disciplined Nizam-i Cedid artillery and infantry corps."
 oe_wp35_civ_tur_koprulu_nizam.a: "Proclaim the Köprülü Audit and Nizam-i Cedid"
 oe_wp35_civ.9.title: "The Sublime Porte at the Crossroads: Köprülü & Nizam-i Cedid"
 oe_wp35_civ.9.desc: "Inside the Imperial Council chamber overlooking the Golden Horn, grand treasury ledgers sit beside newly cast bronze field guns and French-style drill manuals. Having weathered the tensions between Kapikulu barracks and palace factions, the Sultan must now decide whether to entrust full plenipotentiary power to Köprülü Mehmed Pasha for a golden-age modernization, launch a ruthless military purge, or broker a cautious Porte settlement."
 oe_wp35_civ.9.a: "Appoint Köprülü Mehmed Pasha to audit the Porte and drill the Nizam-i Cedid"
 oe_wp35_civ.9.b: "Force through an iron-fisted artillery purge despite barracks fury"
 oe_wp35_civ.9.c: "Preserve imperial harmony through moderate Grand Vizieral mediation"
 oe_wp35_civ.21.title: "Reckoning on the Bosphorus: Fruits of Ottoman Modernization"
 oe_wp35_civ.21.desc: "Eight months after our landmark decree at the Topkapi Divan, disciplined Nizam-i Cedid battalions parade beneath the walls of Constantinople while audited customs revenues pour in from the Danube to Aleppo. Entrenched Janissary brokers and provincial ayans watch warily as the capital's new imperial order takes root—offering one decisive chance to lock in our golden-age legacy."
 oe_wp35_civ.21.a: "Found the Imperial Engineering & Artillery School in Constantinople"
 oe_wp35_civ.21.b: "Lock audited customs surpluses into the Imperial Treasury reserves"
 oe_wp35_civ.21.c: "Extend ceremonial charters to loyal guilds and provincial judges"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_per_isfahan_silk: "Isfahan Royal Silk Monopoly & Gunpowder Court"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_per_isfahan_silk: "Crown-managed silk caravansaries and royal siege foundries turn Iran into a luminous powerhouse of trade, culture, and gunpowder warfare while squeezing independent bazaar brokers."
 oe_wp35_civ_per_isfahan_silk_monopoly: "Royal Silk Monopoly & Isfahan Gunpowder Court"
 oe_wp35_civ_per_isfahan_silk_monopoly.title: "Royal Silk Monopoly & Isfahan Gunpowder Court"
 oe_wp35_civ_per_isfahan_silk_monopoly.desc: "Crown the Persian reform arc by centralizing Gilan and Mazandaran raw silk under royal agents in Isfahan, funding gleaming court architecture and modern siege artillery."
 oe_wp35_civ_per_isfahan_silk_monopoly.a: "Establish the Royal Silk Monopoly in Isfahan"
 oe_wp35_civ.10.title: "Half the World: Royal Silk & Isfahan's Gunpowder Court"
 oe_wp35_civ.10.desc: "Under the turquoise domes rising around Isfahan's grand royal square, Armenian New Julfa merchants unroll bales of shimmering Caspian silk beside bronze siege mortars cast by royal engineers. With Qizilbash tribal levies and Ghulam standing regiments both tested in battle, the Shah can now empower reform commander Allahverdi Khan to forge a true gunpowder golden age—or strike a gentler bargain with the bazaar guilds."
 oe_wp35_civ.10.a: "Empower Allahverdi Khan to direct the Royal Silk Monopoly and artillery park"
 oe_wp35_civ.10.b: "Seize private caravansaries directly to expand royal siege foundries"
 oe_wp35_civ.10.c: "Grant New Julfa and bazaar syndics shared silk export charters"
 oe_wp35_civ.22.title: "Caravans of the Shah: Isfahan's Golden Harvest"
 oe_wp35_civ.22.desc: "Eight months into the Royal Silk Monopoly, gleaming tilework adorns Isfahan's grand bazaar while pack trains laden with raw silk depart for Hormuz, Aleppo, and Astrakhan. Foreign envoys marvel at the Shah's disciplined cannon batteries and lavish court patronage, though bazaar elders still petition for relief from royal customs quotas."
 oe_wp35_civ.22.a: "Endow royal silk looms and grand caravansaries across Isfahan"
 oe_wp35_civ.22.b: "Channel silk bullion into permanent field-artillery magazines"
 oe_wp35_civ.22.c: "Ease customs tolls for loyal Persian and Armenian guild brokers"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_rus_table_of_ranks: "Table of Ranks & Siberian Frontier Charter"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_rus_table_of_ranks: "Fourteen meritocratic grades of imperial service and chartered Siberian expeditions transform Rus into a modernized autocracy, provoking deep resentment among hereditary boyar clans."
 oe_wp35_civ_rus_table_of_ranks: "Table of Ranks & Siberian Frontier Charter"
 oe_wp35_civ_rus_table_of_ranks.title: "Table of Ranks & Siberian Frontier Charter"
 oe_wp35_civ_rus_table_of_ranks.desc: "Culminate Russian state-building by abolishing hereditary mestnichestvo precedence in favor of a meritocratic Table of Ranks while chartering organized Siberian frontier settlement."
 oe_wp35_civ_rus_table_of_ranks.a: "Promulgate the Table of Ranks and Siberian Charter"
 oe_wp35_civ.11.title: "Merit Over Pedigree: The Table of Ranks & Siberia"
 oe_wp35_civ.11.desc: "Snow drifts against the Kremlin walls as imperial secretaries unroll fourteen grades of military and civil rank alongside gilded sable-tax maps stretching from the Ob to the Pacific. Having forged both Cossack frontier hosts and the Zemsky Sobor, the Tsar faces a defining choice: elevate brilliant legal reformer Mikhail Speransky to sweep away boyar birthright, push hard for Siberian crown charters, or entrust a Boris Godunov-style grand boyar to harmonize reform with tradition."
 oe_wp35_civ.11.a: "Appoint Mikhail Speransky to codify the meritocratic Table of Ranks"
 oe_wp35_civ.11.b: "Drive aggressive Siberian ostrog charters and service-nobility levies"
 oe_wp35_civ.11.c: "Entrust a Boris Godunov-style statesman to balance boyars and reform"
 oe_wp35_civ.23.title: "From the Kremlin to the Taiga: The New Service Empire"
 oe_wp35_civ.23.desc: "Eight months after the Table of Ranks shook Moscow's ancestral clans, gifted commoners and junior officers staff streamlined collegia while winter sledges haul rich Siberian furs into the imperial treasury. Old boyar families still mutter behind closed shutters, yet Russia's administrative reach now spans from European chanceries to distant eastern rivers."
 oe_wp35_civ.23.a: "Establish an Imperial Academy of Sciences & Chancery Law in Moscow"
 oe_wp35_civ.23.b: "Expand Siberian fur monopolies and trans-Ural customs posts"
 oe_wp35_civ.23.c: "Confirm hereditary estate charters for loyal service gentry"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_ind_peacock_treasury: "Imperial Diwan & Golden Peacock Treasury"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_ind_peacock_treasury: "Standardized Dahsala harvest assessments and imperial bullion coinage unleash subcontinental prosperity, production, and majesty while trimming zamindar autonomy and warming prices."
 oe_wp35_civ_ind_peacock_court: "Imperial Diwan & Golden Peacock Treasury"
 oe_wp35_civ_ind_peacock_court.title: "Imperial Diwan & Golden Peacock Treasury"
 oe_wp35_civ_ind_peacock_court.desc: "Crown the subcontinental governance arc by instituting standardized Dahsala cadastral audits and imperial mints beneath the Golden Peacock Court."
 oe_wp35_civ_ind_peacock_court.a: "Reform the Imperial Diwan and Golden Peacock Treasury"
 oe_wp35_civ.12.title: "Ledgers of Hindustan: The Imperial Diwan & Peacock Treasury"
 oe_wp35_civ.12.desc: "Beneath marble pavilions inlaid with lapis and carnelian, revenue surveyors unroll ten-year crop averages from Gujarat, Bengal, and the Deccan alongside gleaming silver rupees struck to uniform imperial weight. Building on our Mansabdar ranks and Sulh-i-Kul harmony, the sovereign can now appoint master finance minister Raja Todar Mal to perfect the Dahsala treasury, dazzle the world with Peacock Throne patronage, or settle gently with hereditary zamindars."
 oe_wp35_civ.12.a: "Appoint Raja Todar Mal to codify the Dahsala Imperial Diwan"
 oe_wp35_civ.12.b: "Commission the Golden Peacock Court to project supreme imperial prestige"
 oe_wp35_civ.12.c: "Negotiate generous regional revenue compacts with zamindar elders"
 oe_wp35_civ.24.title: "Silver Rupees of the Grand Trunk: Fruits of the Imperial Diwan"
 oe_wp35_civ.24.desc: "Eight months after the Imperial Diwan standardized measurements, cotton looms from Gujarat to Bengal hum day and night while silver-laden caravans traverse the Grand Trunk Road under imperial escort. Merchants hail predictable customs dues and soaring urban prosperity, though aristocratic landlords still grumble at meticulous revenue registers."
 oe_wp35_civ.24.a: "Invest treasury bullion into imperial looms and Grand Trunk sarais"
 oe_wp35_civ.24.b: "Mint pure silver rupees to stabilize regional credit and markets"
 oe_wp35_civ.24.c: "Reward compliant provincial diwans and temple guilds with tax rebates"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_fra_intendants: "Royal Intendants & Fronde Pacification"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_fra_intendants: "Crown-appointed provincial intendants enforce uniform taxation, justice, and royal control across France while provoking aristocratic resentment among Frondeur princes and parlements."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_fra_versailles_colbert: "Colbertist Manufactories & Versailles Court"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_fra_versailles_colbert: "Royal textile, glass, and tapestry manufactories alongside the dazzling court of Versailles elevate French industry, exports, and prestige at the cost of heavy courtly expenses."
 oe_wp35_civ_fra_intendants: "Royal Intendants & Curbing the Fronde"
 oe_wp35_civ_fra_intendants.title: "Royal Intendants & Curbing the Fronde"
 oe_wp35_civ_fra_intendants.desc: "Dispatch salaried royal intendants to every French généralité to audit tax collection, overrule defiant parlements, and crush aristocratic Fronde rebellions in the name of raison d'État."
 oe_wp35_civ_fra_intendants.a: "Commission Royal Intendants across the realm"
 oe_wp35_civ.13.title: "Raison d'État: Royal Intendants & the Fronde"
 oe_wp35_civ.13.desc: "In the candlelit chambers of the Palais-Royal in Paris, urgent dispatches recount defiant parlements blocking royal edicts and proud provincial dukes raising private banners against crown taxation. Commissioning loyal intendants—answerable solely to the King's council—can break noble fragmentation forever, yet every ducal house in France will bristle at the loss of its feudal prerogatives."
 oe_wp35_civ.13.a: "Empower Cardinal Richelieu and dispatch royal intendants across France"
 oe_wp35_civ.13.b: "Channel royal reform into Colbertist workshops and customs unity instead"
 oe_wp35_civ.13.c: "Negotiate a constitutional truce with the Parlement of Paris"
 oe_wp35_civ_fra_versailles_mercantilism: "Colbertist Manufactories & Versailles Court"
 oe_wp35_civ_fra_versailles_mercantilism.title: "Colbertist Manufactories & Versailles Court"
 oe_wp35_civ_fra_versailles_mercantilism.desc: "Endow royal Gobelins tapestry, mirror, and naval-supply manufactories while turning the royal court near Paris into Europe's cultural lodestar, binding ambitious nobility to gilded ceremony."
 oe_wp35_civ_fra_versailles_mercantilism.a: "Charter Royal Manufactories and the Versailles Court"
 oe_wp35_civ.14.title: "Looms of Gold & Mirrors of State: Colbert and Versailles"
 oe_wp35_civ.14.desc: "Across Paris and the Ile-de-France, master weavers, Venetian glassmakers, and shipwrights crowd royal workshops while architects unroll blueprints for marble galleries designed to dazzle every monarch in Christendom. Elevating Jean-Baptiste Colbert to coordinate mercantilist tariffs, manufactories, and courtly splendor will make France the envy of Europe—though taxpayers and garrisons must shoulder the lavish bill."
 oe_wp35_civ.14.a: "Appoint Jean-Baptiste Colbert to direct royal manufactories and Versailles"
 oe_wp35_civ.14.b: "Reinforce provincial intendant audits before expanding palace budgets"
 oe_wp35_civ.14.c: "Grant Lyon and Paris merchant guilds freer export privileges"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_spa_tercio_doctrine: "Imperial Tercio Pike-and-Shot Doctrine"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_spa_tercio_doctrine: "Tightly drilled squares of veteran pikemen and arquebusiers forge Europe's deadliest shock infantry and siege regiments, demanding steep royal pay and selective recruitment."
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_spa_casa_contratacion: "Casa de Contratación & Silver Fleet Audit"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_spa_casa_contratacion: "Centralized Seville customs registers, pilot-major sea charts, and armed treasure convoys maximize Atlantic trade and crown taxes while fueling bullion inflation and rival merchant friction."
 oe_wp35_civ_spa_tercio_reforms: "Imperial Tercio Pike-and-Shot Doctrine"
 oe_wp35_civ_spa_tercio_reforms.title: "Imperial Tercio Pike-and-Shot Doctrine"
 oe_wp35_civ_spa_tercio_reforms.desc: "Reorganize Castilian and Spanish field companies into mutually supporting squares of steel-tipped pikes and matchlock arquebusiers, forging Europe's premier professional infantry."
 oe_wp35_civ_spa_tercio_reforms.a: "Issue the Imperial Tercio Ordinances"
 oe_wp35_civ.15.title: "Forest of Pikes, Wall of Fire: The Imperial Tercio"
 oe_wp35_civ.15.desc: "Across the dusty muster plains of Castile, veteran infantry captains drill dense formations of eighteen-foot ash pikes flanked by crackling sleeves of arquebusiers and musketeers. Entrusting field reorganization to Gonzalo Fernández de Córdoba—El Gran Capitán—will make our Tercios feared from Flanders to Italy, though maintaining permanent professional cadres will test every treasury ledger."
 oe_wp35_civ.15.a: "Commission Gonzalo de Córdoba to forge the Imperial Tercio doctrine"
 oe_wp35_civ.15.b: "Prioritize maritime escorts and the Seville Casa de Contratación first"
 oe_wp35_civ.15.c: "Balance municipal militias with selective royal artillery training"
 oe_wp35_civ_spa_casa_contratacion: "Casa de Contratación & Silver Fleet Audit"
 oe_wp35_civ_spa_casa_contratacion.title: "Casa de Contratación & Silver Fleet Audit"
 oe_wp35_civ_spa_casa_contratacion.desc: "Centralize oceanic navigation charts, royal fifth silver audits, and armed galleon convoys at Seville's Casa de Contratación, harnessing Atlantic wealth while guarding against contraband and inflation."
 oe_wp35_civ_spa_casa_contratacion.a: "Audit the Silver Fleet at the Casa de Contratación"
 oe_wp35_civ.16.title: "Quays of the Guadalquivir: The Casa de Contratación"
 oe_wp35_civ.16.desc: "Along Seville's bustling Torre del Oro quays, royal assay masters weigh stacks of New World bullion bars while chief cosmographers update secret sea charts for the armed Flota de Indias. Appointing the energetic Count-Duke of Olivares to audit convoy manifests and unite imperial fiscal obligations promises immense maritime revenue, even as surging bullion heats domestic prices and tests provincial merchant patience."
 oe_wp35_civ.16.a: "Empower Count-Duke Olivares to audit the Casa de Contratación and Silver Fleet"
 oe_wp35_civ.16.b: "Funnel Atlantic bullion directly into permanent Tercio regiments"
 oe_wp35_civ.16.c: "Widen consulado shipping charters for Seville and Cadiz merchant houses"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_rhomaioi: "Greco-Anatolian Rhomaioi Synthesis"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_rhomaioi: "Blending Constantinopolitan Hellenism with Cappadocian, Pontic, and Anatolian frontier traditions accelerates assimilation, cultural reach, and prosperity while stirring traditionalist friction."
 oe_wp35_civ_syn_rhomaioi: "Greco-Anatolian Rhomaioi Synthesis"
 oe_wp35_civ_syn_rhomaioi.title: "Greco-Anatolian Rhomaioi Synthesis"
 oe_wp35_civ_syn_rhomaioi.desc: "Unite Aegean Greeks, Anatolian highland communities, and imperial urbanites into a revitalized Rhomaioi civic identity anchored in shared Roman law and Constantinopolitan learning."
 oe_wp35_civ_syn_rhomaioi.a: "Proclaim the Greco-Anatolian Rhomaioi Charter"
 oe_wp35_civ.17.title: "One Politeia Across Two Shores: The Rhomaioi Synthesis"
 oe_wp35_civ.17.desc: "From the marble lecture halls of Constantinople to the bustling bazaars of Nicaea, Smyrna, and Trebizond, bilingual magistrates, thematic soldiers, and artisans are weaving Greek classical letters together with hardy Anatolian frontier customs. Formally recognizing this living Greco-Anatolian Rhomaioi synthesis will knit both shores of the Aegean into one resilient civilization—though purist circles in the capital still guard ancient distinctions."
 oe_wp35_civ.17.a: "Proclaim full Greco-Anatolian Rhomaioi civic synthesis"
 oe_wp35_civ.17.b: "Codify bilingual thematic courts and imperial chancery schools"
 oe_wp35_civ.17.c: "Elevate a cosmopolitan Anatolian-Greek logothete to our council"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_rumelia: "Rumelian Cosmopolitan Administration"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_rumelia: "Harmonizing Ottoman statecraft with Rumelian Balkan guilds, languages, and millet autonomy deepens tolerance, cultural capacity, and provincial control while slowing conversion."
 oe_wp35_civ_syn_rumelia: "Rumelian Cosmopolitan Administration"
 oe_wp35_civ_syn_rumelia.title: "Rumelian Cosmopolitan Administration"
 oe_wp35_civ_syn_rumelia.desc: "Institutionalize a cosmopolitan Rumelian administrative synthesis from Edirne to the Danube, uniting Turkic, Greek, Slavic, and Albanian urban guilds beneath balanced imperial justice."
 oe_wp35_civ_syn_rumelia.a: "Codify the Rumelian Cosmopolitan Administration"
 oe_wp35_civ.18.title: "Crossroads of the Balkans: Rumelian Cosmopolitan Rule"
 oe_wp35_civ.18.desc: "In Edirne's domed bedestens and along the imperial highway linking Constantinople to Belgrade and Thessaloniki, Turkish timariots, Greek shippers, Slavic silver-miners, and Jewish cloth-dyers share courts, guilds, and caravan inns. Codifying this Rumelian cosmopolitan administration will secure peaceful control and wide cultural acceptance across the Balkans, even if austere jurists lament slower religious conversion."
 oe_wp35_civ.18.a: "Codify Rumelian millet charters and multilingual provincial courts"
 oe_wp35_civ.18.b: "Sponsor joint Balkan artisan guilds and Edirne caravan exchanges"
 oe_wp35_civ.18.c: "Appoint a seasoned Rumelian Beylerbey to oversee Balkan integration"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_hindustani: "Indo-Persian Hindustani Court Synthesis"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_hindustani: "The fusion of Persian court letters with Sanskrit sciences, Rajput chivalry, and Hindustani vernacular arts accelerates scholarship, cultural allure, and tolerance while tempering orthodox zeal."
 oe_wp35_civ_syn_hindustani: "Indo-Persian Hindustani Court Synthesis"
 oe_wp35_civ_syn_hindustani.title: "Indo-Persian Hindustani Court Synthesis"
 oe_wp35_civ_syn_hindustani.desc: "Patronize a luminous Indo-Persian Hindustani court synthesis in Delhi and Agra, uniting Persian historiography, Indic astronomy, and Urdu-Hindi poetry into one great imperial civilization."
 oe_wp35_civ_syn_hindustani.a: "Patronize the Indo-Persian Hindustani Court"
 oe_wp35_civ.19.title: "Ganga-Jamuni Tehzeeb: The Hindustani Court Synthesis"
 oe_wp35_civ.19.desc: "Within the royal translation bureaus of Delhi and Agra, Persian calligraphers illuminate Sanskrit epics while Rajput astronomers, classical sitar masters, and Hindustani court poets compose in a vibrant shared tongue. Endorsing this Indo-Persian synthesis will ignite an extraordinary flowering of science, architecture, and intercommunal loyalty—even as rigid clerics frown upon syncretic court patronage."
 oe_wp35_civ.19.a: "Endow the Imperial Hindustani Academy of Letters and Sciences"
 oe_wp35_civ.19.b: "Commission bilingual Persian-Sanskrit translations of statecraft classics"
 oe_wp35_civ.19.c: "Bring a celebrated Hindustani poet-minister into the imperial court"
 STATIC_MODIFIER_NAME_oe_wp35_mod_civ_syn_creole_atlantic: "Transatlantic Creole Imperial Charter"
 STATIC_MODIFIER_DESC_oe_wp35_mod_civ_syn_creole_atlantic: "Granting overseas creole elites legal parity, port consulados, and shared imperial citizenship supercharges Atlantic migration, sea trade, and subject loyalty while decentralizing metropolitan crown control."
 oe_wp35_civ_syn_creole_atlantic: "Transatlantic Creole Imperial Charter"
 oe_wp35_civ_syn_creole_atlantic.title: "Transatlantic Creole Imperial Charter"
 oe_wp35_civ_syn_creole_atlantic.desc: "Extend shared imperial citizenship, maritime consulado charters, and creole administrative parity across our Atlantic dominions to turn far-flung ports into a cohesive oceanic commonwealth."
 oe_wp35_civ_syn_creole_atlantic.a: "Proclaim the Transatlantic Creole Imperial Charter"
 oe_wp35_civ.20.title: "Two Hemispheres Under One Crown: The Creole Atlantic Charter"
 oe_wp35_civ.20.desc: "Across Atlantic ocean ports, generations of overseas-born merchants, planters, navigators, and mixed-heritage jurists have forged vibrant creole societies that speak our tongue yet carry the distinct stamp of new seas and horizons. Enacting a Transatlantic Creole Imperial Charter recognizes their municipal cabildos and grants equal standing in imperial trade—cementing overseas loyalty and migration at the price of loosening metropolitan centralization."
 oe_wp35_civ.20.a: "Proclaim the Transatlantic Creole Charter across both hemispheres"
 oe_wp35_civ.20.b: "Charter Atlantic merchant consulados to expand oceanic customs"
 oe_wp35_civ.20.c: "Summon a distinguished overseas Creole viceroy to the royal council"
