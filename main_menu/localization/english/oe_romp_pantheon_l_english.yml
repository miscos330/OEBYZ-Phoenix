l_english:
# NEW 2026-11-21 v9.8 Worker 1: Capitoline Hexapantheon 10 Gods & 50 Omens (oe_romp_). Generated by gen_romp_pantheon.py.
 oe_romp_cl_faith_roman:0 "Religio Romana"
 oe_romp_cl_faith_grecoroman:0 "Greco-Roman Polytheism"
 god_emperors:0 "God Emperors"
 heroes:0 "Heroes"
 divine_emperors:0 "Divine Emperors"
 oe_romp_sol_invictus_god:0 "Helios-Sol Invictus"
 oe_romp_sol_invictus_god.latin_language:0 "Sol Invictus"
 oe_romp_sol_invictus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_sol_invictus_god')] is the unconquered sovereign of the heavens and patron of the Roman diadem. From Aurelian's grand temple and Constantine's Porphyry Column to Julian's Hymn to King Helios, the radiant solar majesty upholds universal law and imperial legitimacy."
 oe_romp_sol_invictus_god_omen:0 "Dawn breaks through the vaulted clouds, pouring streams of gold across the Porphyry Column and the steps of the Senate. The priests raise golden libation bowls toward the heavens as [ShowGodName('oe_romp_sol_invictus_god')] turns his unconquered radiance upon the empire..."
 oe_romp_omen_sol_eternal_dawn:0 "Eternal Dawn"
 oe_romp_omen_sol_eternal_dawn_desc:0 "The unending dawn illuminates the furthest provinces, carrying imperial writs and steadfast governance to every frontier."
 oe_romp_omen_sol_celestial_sovereignty:0 "Celestial Sovereignty"
 oe_romp_omen_sol_celestial_sovereignty_desc:0 "As the sun governs the wandering stars, the purple throne stands supreme above all estates under the witness of Sol."
 oe_romp_omen_sol_radiant_law:0 "Radiant Law"
 oe_romp_omen_sol_radiant_law_desc:0 "The light of reason mirrors celestial harmony, dispelling ignorance and quickening scholarship across academies and chanceries."
 oe_romp_omen_sol_aurelian_crown:0 "Crown of Aurelian"
 oe_romp_omen_sol_aurelian_crown_desc:0 "A radiate diadem of twelve golden beams recalls Aurelian, Restorer of the World, inspiring awe in every distant court."
 oe_romp_omen_sol_solar_edict:0 "Solar Edict"
 oe_romp_omen_sol_solar_edict_desc:0 "An edict proclaimed at the solstice stills civic discord and swiftly restores harmony across the realm."
 oe_romp_juno_god:0 "Hera"
 oe_romp_juno_god.latin_language:0 "Juno Regina"
 oe_romp_juno_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_juno_god')] sits enthroned within the Capitoline Triad as sovereign queen of heaven, guardian of coinage, civic covenants, and the flourishing of Roman households."
 oe_romp_juno_god_omen:0 "The sacred geese of the Capitoline cry out in unison, and the mint rings with a clear, steady resonance. A shadow of peacock plumes passes over the altar as [ShowGodName('oe_romp_juno_god')] bestows her sovereign favor..."
 oe_romp_omen_juno_moneta:0 "Juno Moneta"
 oe_romp_omen_juno_moneta_desc:0 "Juno the Adviser watches over the sacred mint, keeping imperial coinage pure and checking the corrosion of inflation."
 oe_romp_omen_juno_regina:0 "Juno Regina"
 oe_romp_omen_juno_regina_desc:0 "The majesty of heaven's queen affirms the lawful succession of the purple throne before senate and people alike."
 oe_romp_omen_juno_sospita:0 "Juno Sospita"
 oe_romp_omen_juno_sospita_desc:0 "The Savior Goddess extends her shield over every civic order, nurturing contentment among nobles, burghers, and commons."
 oe_romp_omen_juno_lucina:0 "Juno Lucina"
 oe_romp_omen_juno_lucina_desc:0 "She who brings children into the light blesses every Roman hearth with abundant births and thriving generations."
 oe_romp_omen_juno_sacred_union:0 "Sacred Covenant"
 oe_romp_omen_juno_sacred_union_desc:0 "Oaths and royal unions consecrated under the Queen of Heaven lend weight and honor to every imperial embassy."
 oe_romp_vesta_god:0 "Hestia"
 oe_romp_vesta_god.latin_language:0 "Vesta"
 oe_romp_vesta_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_vesta_god')] guards the eternal civic hearth of Rome. So long as her sacred flame burns untended by neither war nor faction within her circular temple, the commonwealth endures."
 oe_romp_vesta_god_omen:0 "The hearth flame in the round temple rises bright and calm without a breath of wind, casting a quiet warmth over forum colonnades and household roofs. [ShowGodName('oe_romp_vesta_god')] watches over the foundations of the state..."
 oe_romp_omen_vesta_eternal_flame:0 "The Eternal Flame"
 oe_romp_omen_vesta_eternal_flame_desc:0 "The undying flame binds citizens to the commonwealth, feeding a steady current of civic stability."
 oe_romp_omen_vesta_hearth_peace:0 "Peace of the Hearth"
 oe_romp_omen_vesta_hearth_peace_desc:0 "The quiet grace of the sacred hearth heals scarred provinces and lifts towns and villages into lasting prosperity."
 oe_romp_omen_vesta_full_granaries:0 "Unfailing Granaries"
 oe_romp_omen_vesta_full_granaries_desc:0 "First-fruits and sacred salt cakes offered at the hearth bless the fields with bountiful harvests and full granaries."
 oe_romp_omen_vesta_pure_precinct:0 "Sanctuary of Purity"
 oe_romp_omen_vesta_pure_precinct_desc:0 "Rites of pure spring water and spotless precinct discipline shield cities and provinces from spreading contagion."
 oe_romp_omen_vesta_enduring_realm:0 "Enduring Commonwealth"
 oe_romp_omen_vesta_enduring_realm_desc:0 "While the sacred fire endures, loyalty holds firm across the provinces and sedition withers before it can spark."
 oe_romp_asclepius_god:0 "Asclepius"
 oe_romp_asclepius_god.latin_language:0 "Aesculapius-Hygieia"
 oe_romp_asclepius_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_asclepius_god')], bearer of the serpent-entwined staff alongside Hygieia, presides over the healing sanctuaries of Epidaurus, Pergamon, and Tiber Island, warding the empire against pestilence."
 oe_romp_asclepius_god_omen:0 "The clean scent of medicinal herbs drifts through the sanctuary colonnade as a harmless sacred serpent glides across the marble steps, and fevered groans soften into restful sleep. [ShowGodName('oe_romp_asclepius_god')] extends his healing hand..."
 oe_romp_omen_asclepius_serpent_staff:0 "Staff of the Serpent"
 oe_romp_omen_asclepius_serpent_staff_desc:0 "The emblem of the healing staff guides civic physicians across the provinces, fortifying the realm against every malady."
 oe_romp_omen_asclepius_plague_aegis:0 "Aegis Against the Plague"
 oe_romp_omen_asclepius_plague_aegis_desc:0 "Sanctuary quarantines and purified baths modeled on Pergamon and Tiber Island raise a stalwart bulwark against the Great Pestilence."
 oe_romp_omen_asclepius_longevity:0 "Blessing of Longevity"
 oe_romp_omen_asclepius_longevity_desc:0 "Balanced regimens and sanctuary medicine spread from court to household, lengthening the years of rulers, scholars, and citizens."
 oe_romp_omen_asclepius_sacred_spring:0 "Waters of the Sacred Spring"
 oe_romp_omen_asclepius_sacred_spring_desc:0 "Healing springs and careful midwifery preserve mothers and infants alike, swelling the vigor of every province."
 oe_romp_omen_asclepius_hygieia_code:0 "Code of Hygieia"
 oe_romp_omen_asclepius_hygieia_code_desc:0 "Repaired aqueducts, clean cisterns, and public health ordinances sharply curb the economic toll of outbreaks."
 oe_romp_janus_god:0 "Janus"
 oe_romp_janus_god.latin_language:0 "Janus Bifrons"
 oe_romp_janus_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_janus_god')] is Rome's primeval deity of beginnings, thresholds, treaties, and transitions, gazing backward and forward alike. His bronze gates stand shut in peace and thrown open in war."
 oe_romp_janus_god_omen:0 "Bronze temple doors shiver in the morning mist as the turning of a heavy key echoes across the forum. Past and future converge at the threshold where [ShowGodName('oe_romp_janus_god')] weighs the fate of the realm..."
 oe_romp_omen_janus_closed_gates:0 "Gates of Peace Closed"
 oe_romp_omen_janus_closed_gates_desc:0 "With the bronze gates of Janus barred, trade and diplomacy flourish; while the realm is at peace, the potency of this omen is doubled."
 oe_romp_omen_janus_open_gates:0 "Gates Opened for War"
 oe_romp_omen_janus_open_gates_desc:0 "When the gates stand open for war, the iron resolve of ancient Rome steadies the populace against protracted campaigns."
 oe_romp_omen_janus_crossroads_trade:0 "Portals of Commerce"
 oe_romp_omen_janus_crossroads_trade_desc:0 "Guardian of every archway, bridge, and market gate, Janus draws caravans and merchant fleets into thriving imperial hubs."
 oe_romp_omen_janus_new_year_augury:0 "Augury of the New Year"
 oe_romp_omen_janus_new_year_augury_desc:0 "Auspicious vows spoken upon the Kalends draw newly won provinces swiftly into Roman civic identity and customs."
 oe_romp_omen_janus_twofold_foresight:0 "Twofold Foresight"
 oe_romp_omen_janus_twofold_foresight_desc:0 "Looking both behind and ahead, the two-faced guardian exposes foreign intrigue before it can cross the threshold."
 oe_romp_apollo_god:0 "Apollo"
 oe_romp_apollo_god.latin_language:0 "Apollo Phoebus"
 oe_romp_apollo_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_apollo_god')] is the radiant lord of prophecy, music, reason, and purification, revered at Delphi, Delos, and the Palatine Hill. Since Augustus hailed him as patron of Actium, his golden lyre and laurel crown have guided classical letters and arts."
 oe_romp_apollo_god_omen:0 "A breeze stirs the sacred laurel boughs as the clear chord of a golden lyre seems to echo down from Parnassus. Vapors rise from the Castalian spring as [ShowGodName('oe_romp_apollo_god')] grants his luminous counsel..."
 oe_romp_omen_apollo_muses_chorus:0 "Chorus of the Muses"
 oe_romp_omen_apollo_muses_chorus_desc:0 "Leader of the Nine Muses, Apollo draws master poets, sculptors, and thinkers to the imperial court."
 oe_romp_omen_apollo_delphic_oracle:0 "Oracle of Delphi"
 oe_romp_omen_apollo_delphic_oracle_desc:0 "The cryptic wisdom of Delphi spurs imperial scholars to pierce natural mysteries and accelerate discovery."
 oe_romp_omen_apollo_radiant_enlightenment:0 "Radiant Enlightenment"
 oe_romp_omen_apollo_radiant_enlightenment_desc:0 "In Apollo's luminous name, civic academies of grammar and rhetoric flourish, lifting the ceiling of public literacy."
 oe_romp_omen_apollo_golden_lyre:0 "Harmony of the Golden Lyre"
 oe_romp_omen_apollo_golden_lyre_desc:0 "Pythian hymns and classical theater ring through every polis, deepening the empire's enduring cultural prestige."
 oe_romp_omen_apollo_purifying_arrows:0 "Purifying Arrows"
 oe_romp_omen_apollo_purifying_arrows_desc:0 "The Far-Shooter turns his silver bow against miasma and pestilence, cleansing threatened cities of contagion."
 oe_romp_isis_serapis_god:0 "Isis-Serapis"
 oe_romp_isis_serapis_god.latin_language:0 "Isis Pelagia-Serapis"
 oe_romp_isis_serapis_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_isis_serapis_god')] embodies the Mediterranean genius of Interpretatio Romana: revered from Alexandria's Grand Serapeum to Rome's Campus Martius as protector of grain fleets, Pharos navigation, arcane libraries, and the harmony of diverse peoples."
 oe_romp_isis_serapis_god_omen:0 "The beacon of Pharos shimmers across a glassy sea as the rhythmic chime of the sistrum and the scent of lotus drift over the harbor. [ShowGodName('oe_romp_isis_serapis_god')] casts her guiding starlight over merchant sails and river plains..."
 oe_romp_omen_isis_nile_flood:0 "Bounty of the Nile"
 oe_romp_omen_isis_nile_flood_desc:0 "As Sothis rises and the waters swell, fertile river plains yield abundant harvests to feed the imperial capitals."
 oe_romp_omen_isis_pelagia_star:0 "Star of Isis Pelagia"
 oe_romp_omen_isis_pelagia_star_desc:0 "Isis of the Sea spreads the sail and steadies the compass, magnifying imperial maritime presence and sea trade."
 oe_romp_omen_isis_myrionymos:0 "Goddess of Ten Thousand Names"
 oe_romp_omen_isis_myrionymos_desc:0 "Known by countless tongues from the Nile to the Danube, the Myrionymos fosters deep harmony among subjects of every creed."
 oe_romp_omen_isis_serapeum_scrolls:0 "Scrolls of the Serapeum"
 oe_romp_omen_isis_serapeum_scrolls_desc:0 "Papyri copied in the halls of the Serapeum circulate across the empire, steadily raising literacy month by month."
 oe_romp_omen_isis_mediterranean_league:0 "Mediterranean Merchant League"
 oe_romp_omen_isis_mediterranean_league_desc:0 "Navicularii guilds sworn to Isis Pelagia link Alexandria, Ostia, and the Golden Horn, amplifying imperial merchant power."
 oe_romp_quirinus_mars_god:0 "Mars Ultor & Romulus"
 oe_romp_quirinus_mars_god.latin_language:0 "Mars Ultor-Quirinus"
 oe_romp_quirinus_mars_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_quirinus_mars_god')] unites Augustus's Mars the Avenger with the deified founder Romulus-Quirinus—not reckless bloodshed, but the iron discipline of Roman legions, gilded aquilae, frontier limes, and sworn civic arms."
 oe_romp_quirinus_mars_god_omen:0 "The sacred bronze ancilia ring unbidden inside the camp shrine, and the gilded aquila catches the cold light of dusk. As the legions renew their sacramentum, [ShowGodName('oe_romp_quirinus_mars_god')] inspects his ordered ranks..."
 oe_romp_omen_quirinus_iron_legions:0 "Iron Legions"
 oe_romp_omen_quirinus_iron_legions_desc:0 "Locked shields and leveled blades turn Roman heavy infantry into an unbreakable wall of steel."
 oe_romp_omen_quirinus_aquila_discipline:0 "Discipline of the Aquila"
 oe_romp_omen_quirinus_aquila_discipline_desc:0 "Unflinching drill and reverence for the eagle standard forge steel discipline across every cohort."
 oe_romp_omen_quirinus_siegecraft:0 "Legionary Siegecraft"
 oe_romp_omen_quirinus_siegecraft_desc:0 "Legionary engineers raise ramps, torsion engines, and rams that shatter the stoutest hostile ramparts."
 oe_romp_omen_quirinus_limes_ramparts:0 "Ramparts of the Limes"
 oe_romp_omen_quirinus_limes_ramparts_desc:0 "Orderly border garrisons from the Danube to the Euphrates keep every frontier fortress sound at far lower cost."
 oe_romp_omen_quirinus_triumphal_oath:0 "Vow of the Triumph"
 oe_romp_omen_quirinus_triumphal_oath_desc:0 "Solemn vows sworn before Mars Ultor kindle fierce determination to return along the Sacred Way in triumph."
 oe_romp_mithras_god:0 "Mithras"
 oe_romp_mithras_god.latin_language:0 "Mithras Invictus"
 oe_romp_mithras_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_mithras_god')] bridges Anatolia, Iran, and the Roman frontiers through Interpretatio Romana. Sworn by oath in subterranean mithraea along every limes, he is the soldier's unconquered god of fidelity, armored cavalry, and endurance."
 oe_romp_mithras_god_omen:0 "Torches flare inside the vaulted mithraeum, bathing the tauroctony relief in molten gold. Cataphracts clasp their hilts and murmur the oath of the brotherhood as [ShowGodName('oe_romp_mithras_god')] steels their hearts..."
 oe_romp_omen_mithras_cataphracts:0 "Sacred Cataphracts"
 oe_romp_omen_mithras_cataphracts_desc:0 "Imperial cataphracts uniting Roman order with Anatolian and Persian horsemanship thunder through enemy lines."
 oe_romp_omen_mithras_mithraeum_oath:0 "Oath of the Mithraeum"
 oe_romp_omen_mithras_mithraeum_oath_desc:0 "Brothers bound by the secret oath of the mithraeum stand shoulder to shoulder, lifting army morale to heroic heights."
 oe_romp_omen_mithras_veteran_ranks:0 "Ranks of the Lions"
 oe_romp_omen_mithras_veteran_ranks_desc:0 "Seven grades of soldierly ordeal temper recruits into seasoned centurions, steadily enriching army tradition."
 oe_romp_omen_mithras_solar_campaign:0 "Campaign of the Sun"
 oe_romp_omen_mithras_solar_campaign_desc:0 "The covenant of Mithras guards long supply columns across steppe and plateau, extending imperial campaign reach."
 oe_romp_omen_mithras_tauroctony_vigor:0 "Vigor of the Tauroctony"
 oe_romp_omen_mithras_tauroctony_vigor_desc:0 "The life-renewing mystery of the sacred bull pours fresh vitality into depleted regiments on the march."
 oe_romp_cybele_god:0 "Cybele"
 oe_romp_cybele_god.latin_language:0 "Cybele Magna Mater"
 oe_romp_cybele_god_desc:0 "[ShowGodNameWithNoTooltip('oe_romp_cybele_god')], crowned with city battlements and drawn by twin lions, was summoned from Phrygian Pessinus by Sibylline oracle during Rome's darkest hour to dwell upon the Palatine as Magna Mater, eternal guardian of walled cities and fertile earth."
 oe_romp_cybele_god_omen:0 "Deep bronze drums and Phrygian flutes resound along the rampart towers as carved guardian lions seem to stir in the dawn light. The mural crown of [ShowGodName('oe_romp_cybele_god')] shelters every bastion and mountain pass..."
 oe_romp_omen_cybele_mural_crown:0 "The Mural Crown"
 oe_romp_omen_cybele_mural_crown_desc:0 "The turret-crowned Magna Mater blesses every wall and citadel, turning imperial fortresses into impassable bulwarks."
 oe_romp_omen_cybele_lion_garrison:0 "Garrison of the Twin Lions"
 oe_romp_omen_cybele_lion_garrison_desc:0 "The guardian lions of Cybele swell every fortress garrison, holding the gates firm against overwhelming odds."
 oe_romp_omen_cybele_sacred_mountain:0 "Wrath of the Sacred Mountain"
 oe_romp_omen_cybele_sacred_mountain_desc:0 "Wild mountain mists and treacherous defiles under Magna Mater's gaze exact a punishing toll on invading armies."
 oe_romp_omen_cybele_fertile_earth:0 "Bounty of the Great Mother"
 oe_romp_omen_cybele_fertile_earth_desc:0 "Mother of mountain and valley alike, Cybele fills provincial granaries to sustain armies and cities through siege and storm."
 oe_romp_omen_cybele_bronze_drums:0 "Thunder of the Bronze Drums"
 oe_romp_omen_cybele_bronze_drums_desc:0 "The booming drums of Cybele's rites rouse battered cohorts, restoring broken battle morale with startling speed."
