 STATIC_MODIFIER_NAME_oe_yem_treasure_fleet_mod: "Great Yuan Western Ocean Treasure Fleet"
 STATIC_MODIFIER_DESC_oe_yem_treasure_fleet_mod: "Colossal imperial treasure junks project the Mandate across the Southern and Indian Oceans, expanding reach and diplomacy at steep heavy-ship upkeep and fiscal tax burden."
 STATIC_MODIFIER_NAME_oe_yem_fleet_strain_mod: "Treasure Fleet Fiscal Overstretch"
 STATIC_MODIFIER_DESC_oe_yem_fleet_strain_mod: "Launching grand voyages while paper money confidence is fragile fuels inflation and raises administrative stability costs."
 STATIC_MODIFIER_NAME_oe_yem_merchant_syndicate_mod: "Chartered Ocean Merchant Syndicates"
 STATIC_MODIFIER_DESC_oe_yem_merchant_syndicate_mod: "Licensed merchant syndicates out of Jinjiang and Guangzhou expand sea trade and merchant power while eroding direct control and alienating conservative nobles."
 STATIC_MODIFIER_NAME_oe_yem_coastal_guard_mod: "Coastal Grain Escort Policy"
 STATIC_MODIFIER_DESC_oe_yem_coastal_guard_mod: "Forgoing ocean expeditions focuses resources on domestic taxation and stability at the cost of maritime trade and colonial reach."
 STATIC_MODIFIER_NAME_oe_yem_indian_ocean_hegemony: "Indian Ocean Tributary Network"
 STATIC_MODIFIER_DESC_oe_yem_indian_ocean_hegemony: "Entrepots from Malacca and Kozhikode to Hormuz and Aden honor Dadu's banners, boosting sea trade and prestige at steep heavy-ship upkeep and tax strain."
 STATIC_MODIFIER_NAME_oe_yem_customs_balance_mod: "Self-Financing Ocean Customs"
 STATIC_MODIFIER_DESC_oe_yem_customs_balance_mod: "Strict customs dues finance oceanic patrols and commerce while trimming ceremonial generosity, dampening prestige and noble favor."
 STATIC_MODIFIER_NAME_oe_yem_voyage_active_mod: "Imperial Western Ocean Expedition"
 STATIC_MODIFIER_DESC_oe_yem_voyage_active_mod: "A fresh treasure expedition sails for the Indian Ocean, lifting celestial prestige and sea trade while weighing on heavy-ship maintenance and tax efficiency."
 STATIC_MODIFIER_NAME_oe_yem_silver_reserve_chao: "Dadu Silver-Reserve Paper Money"
 STATIC_MODIFIER_DESC_oe_yem_silver_reserve_chao: "Backing Yuan paper notes with audited silver reserves curbs inflation and energizes commerce, while demanding heavy bureaucratic oversight from the imperial cabinet."
 STATIC_MODIFIER_NAME_oe_yem_single_whip_mod: "Great Yuan Single Whip Silver Tax"
 STATIC_MODIFIER_DESC_oe_yem_single_whip_mod: "Commuting corvee and taxes into silver sharply improves tax efficiency and state control, at the price of transitional prosperity drag and noble resentment."
 STATIC_MODIFIER_NAME_oe_yem_old_chao_stubborn: "Rigid Old Paper Money Edict"
 STATIC_MODIFIER_DESC_oe_yem_old_chao_stubborn: "Banning private silver to defend traditional paper notes pleases conservatives while driving inflation, shrinking trade, and slowing global institution spread."
 STATIC_MODIFIER_NAME_oe_yem_chao_vindicated_mod: "Silver Treasury Redemption Vindicated"
 STATIC_MODIFIER_DESC_oe_yem_chao_vindicated_mod: "Full silver redemption restores mercantile faith and holds down inflation while keeping the cabinet tied up in strict audits."
 STATIC_MODIFIER_NAME_oe_yem_chao_run_scar: "Paper Money Bank-Run Scars"
 STATIC_MODIFIER_DESC_oe_yem_chao_run_scar: "Suspended redemption shatters commercial confidence, sparking inflation, shrinking trade and tax yields, and angering the burghers."
 STATIC_MODIFIER_NAME_oe_yem_western_ports_mod: "Xiangshan & Zaytun Western Entrepots"
 STATIC_MODIFIER_DESC_oe_yem_western_ports_mod: "Opening Xiangshan and Jinjiang to European merchantmen boosts trade and institution spread while sparking clerical backlash and slower religious conversion."
 STATIC_MODIFIER_NAME_oe_yem_selective_arsenal_mod: "Selective Western Ordnance Policy"
 STATIC_MODIFIER_DESC_oe_yem_selective_arsenal_mod: "Confining European ships while purchasing their artillery strengthens army discipline and defenses at the cost of reduced trade and diplomatic friction."
 STATIC_MODIFIER_NAME_oe_yem_closed_ports_mod: "Strict Maritime Exclusion"
 STATIC_MODIFIER_DESC_oe_yem_closed_ports_mod: "Expelling European ships bolsters orthodoxy, stability, and imperial authority while severely retarding research and institution growth."
 STATIC_MODIFIER_NAME_oe_yem_jesuit_observatory_mod: "Sino-Western Observatory & Shenjiying Foundry"
 STATIC_MODIFIER_DESC_oe_yem_jesuit_observatory_mod: "Blending Western astronomy with Yuan calendrical science alongside the Dadu Shenjiying foundry lifts research, literacy, and discipline while provoking clerical resistance and army upkeep costs."
 STATIC_MODIFIER_NAME_oe_yem_practical_learning_mod: "Practical Ordnance & Calendar Bureau"
 STATIC_MODIFIER_DESC_oe_yem_practical_learning_mod: "Adopting European astronomy and cannon casting while barring inland missions boosts research and discipline at the expense of trade and diplomacy."
 STATIC_MODIFIER_NAME_oe_yem_orthodox_astronomy_mod: "Orthodox Shoushi & Huihui Astronomy"
 STATIC_MODIFIER_DESC_oe_yem_orthodox_astronomy_mod: "Dismissing foreign astronomers preserves traditional scholarship and court stability while widening the technological gap during the Scientific Revolution."
 STATIC_MODIFIER_NAME_oe_yem_lia_relief_mod: "Little Ice Age Grand Canal Relief"
 STATIC_MODIFIER_DESC_oe_yem_lia_relief_mod: "Opening imperial granaries and rushing canal grain to Liaodong and the steppe safeguards the Mandate and peasant loyalty at steep fiscal and administrative cost."
 STATIC_MODIFIER_NAME_oe_yem_lia_crisis_mod: "Little Ice Age Surcharge & Famine Crisis"
 STATIC_MODIFIER_DESC_oe_yem_lia_crisis_mod: "Levying emergency war surcharges during severe frost raises short-term tax yield at devastating cost to prosperity, peasant satisfaction, subject loyalty, and the Mandate."
 STATIC_MODIFIER_NAME_oe_yem_lifanyuan_central_mod: "Centralized Lifanyuan & Kyakhta Trade"
 STATIC_MODIFIER_DESC_oe_yem_lifanyuan_central_mod: "Integrating steppe appanages under a centralized Lifanyuan while opening the Kyakhta caravan border raises control, taxes, and land trade at the price of subject and noble discontent."
 STATIC_MODIFIER_NAME_oe_yem_plural_charter_mod: "Plural Imperial Charter & Kyakhta Mart"
 STATIC_MODIFIER_DESC_oe_yem_plural_charter_mod: "Codifying a dual steppe-agrarian charter alongside Kyakhta trade strengthens subject loyalty, manpower, and overland commerce while reducing cabinet and central control efficiency."
 STATIC_MODIFIER_NAME_oe_yem_northern_karun_mod: "Closed Northern Karun Watchposts"
 STATIC_MODIFIER_DESC_oe_yem_northern_karun_mod: "Fortified northern watchposts keep frontier defenses and stability tight while starving Siberian overland trade and diplomacy."
 STATIC_MODIFIER_NAME_oe_yem_kyakhta_trade_mod: "Kyakhta Tea & Fur Caravan Charter"
 STATIC_MODIFIER_DESC_oe_yem_kyakhta_trade_mod: "Regular chartered caravans exchange tea and silk for furs at Kyakhta, lifting land trade and diplomacy while lightly taxing frontier control."
 STATIC_MODIFIER_NAME_oe_yem_jiangnan_manufactory_mod: "Jiangnan Chartered Manufactories"
 STATIC_MODIFIER_DESC_oe_yem_jiangnan_manufactory_mod: "Silk, porcelain, coal, and iron workshops across Jiangnan and Dadu propel tax efficiency, development, and manufactory spread alongside mild inflation and peasant unrest."
 STATIC_MODIFIER_NAME_oe_yem_state_monopoly_mod: "Imperial Loom & Arsenal Monopoly"
 STATIC_MODIFIER_DESC_oe_yem_state_monopoly_mod: "Tight state monopolies over Jiangnan looms and arsenals strengthen control and discipline while stifling burghers and institution growth."
 STATIC_MODIFIER_NAME_oe_yem_modern_yuan_mod: "Early Modern Great Yuan Era"
 STATIC_MODIFIER_DESC_oe_yem_modern_yuan_mod: "Uniting oceanic trade, audited currency, scientific astronomy, and Jiangnan workshops places Great Yuan at the forefront of the early modern world at ongoing bureaucratic, clerical, and naval cost."
 STATIC_MODIFIER_NAME_oe_yem_celestial_bastion_mod: "Bastion of the Celestial Mandate"
 STATIC_MODIFIER_DESC_oe_yem_celestial_bastion_mod: "Anchoring the empire on domestic control, stability, and frontier defense renders Great Yuan formidable against turmoil while slowing maritime trade and scientific change."
 STATIC_MODIFIER_NAME_oe_yem_maritime_entrepot: "Yuan Treasure Fleet Entrepot"
 STATIC_MODIFIER_DESC_oe_yem_maritime_entrepot: "Imperial shipyards and ocean-going merchants boost local merchant power and maritime presence alongside mild port unrest."
 STATIC_MODIFIER_NAME_oe_yem_xiangshan_charter: "Xiangshan Chartered Western Port"
 STATIC_MODIFIER_DESC_oe_yem_xiangshan_charter: "Chartered European anchorage at Xiangshan accelerates commerce and institution growth at the cost of lower max control and local friction."
 STATIC_MODIFIER_NAME_oe_yem_dadu_observatory_loc: "Dadu Observatory & Shenjiying Foundry"
 STATIC_MODIFIER_DESC_oe_yem_dadu_observatory_loc: "The expanded observatory and artillery foundry accelerate institution spread and urban growth in Dadu amid mild conservative pushback."
 STATIC_MODIFIER_NAME_oe_yem_lia_famine_loc: "Little Ice Age Frost & Famine"
 STATIC_MODIFIER_DESC_oe_yem_lia_famine_loc: "Sustained frost and wartime tax surcharges depress local prosperity and fuel unrest."
 STATIC_MODIFIER_NAME_oe_yem_kyakhta_mart: "Kyakhta Russo-Yuan Trade Mart"
 STATIC_MODIFIER_DESC_oe_yem_kyakhta_mart: "Kyakhta thrives as the licensed tea, silk, and fur exchange between Great Yuan and Russia, adding merchant power alongside mild frontier friction."
 STATIC_MODIFIER_NAME_oe_yem_proto_industry_loc: "Jiangnan Proto-Industrial Workshops"
 STATIC_MODIFIER_DESC_oe_yem_proto_industry_loc: "Booming silk, porcelain, and iron workshops drive urban development and merchant power while increasing local social tension."
