 oe_yem_dec_treasure_expedition.title: "Dispatch Imperial Western Ocean Treasure Fleet"
 oe_yem_dec_treasure_expedition.desc: "Outfit ocean-going treasure junks from Jinjiang and Guangzhou to sail for Malacca, Kozhikode, Hormuz, and Aden, elevating celestial prestige and sea trade at heavy fleet upkeep."
 oe_yem_dec_treasure_expedition.a: "Launch the Western Ocean Fleet"
 oe_yem_dec_jesuit_observatory.title: "Expand the Dadu Observatory & Shenjiying Foundry"
 oe_yem_dec_jesuit_observatory.desc: "Expand the Dadu imperial observatory with Western astronomical instruments alongside a Shenjiying artillery foundry, accelerating Scientific Revolution and Artillery spread amid clerical pushback."
 oe_yem_dec_jesuit_observatory.a: "Charter the Observatory & Artillery Foundry"
 oe_yem_dec_jiangnan_manufactories.title: "Charter the Jiangnan Manufactory Bureaus"
 oe_yem_dec_jiangnan_manufactories.desc: "Establish chartered silk, porcelain, coal, and iron workshops in Hangzhou and Jiangning to drive manufactory spread and urban growth alongside mild peasant discontent."
 oe_yem_dec_jiangnan_manufactories.a: "Fund the Jiangnan Manufactories"
 oe_yem_dec_kyakhta_tea_caravan.title: "Dispatch the Kyakhta Tea & Fur Caravan"
 oe_yem_dec_kyakhta_tea_caravan.desc: "With the Kyakhta border mart open, dispatch a chartered tea-and-silk caravan northward to trade for furs and silver, boosting land commerce, Russo-Yuan diplomacy, and paper money confidence."
 oe_yem_dec_kyakhta_tea_caravan.a: "Dispatch the Kyakhta Caravan"
 oe_yem.1.t: "Commissioning the Great Yuan Treasure Fleets"
 oe_yem.1.desc_ready: "#F Since Kublai Khan's reign, Yuan fleets and Zaytun merchants had sailed the Southern and Indian Oceans. Having weathered the fourteenth-century storms and restored imperial rule, Dadu stands poised to project its naval might into the Age of Discovery.#!\n\nThe shipyards of Jinjiang and Guangzhou already hold seasoned timber, crews, and Indian Ocean rutters from the revived customs bureaus. Should the throne fund an imperial treasure fleet, charter merchant syndicates, or curtail ocean voyages to protect coastal grain?"
 oe_yem.1.desc_ban: "#F Since Kublai Khan's reign, Yuan fleets and Zaytun merchants had sailed the Southern and Indian Oceans. Having weathered the fourteenth-century storms and restored imperial rule, Dadu stands poised to project its naval might into the Age of Discovery.#!\n\nAlthough an earlier Sea Ban restricted private sailings, rising maritime traffic off Jinjiang, Guangzhou, and Xiangshan tempts Dadu back to the waves. Lifting the ban for grand voyages will demand steeper gold and stability costs. What is the Great Khan's decree?"
 oe_yem.1.desc_gen: "#F Since Kublai Khan's reign, Yuan fleets and Zaytun merchants had sailed the Southern and Indian Oceans. Having weathered the fourteenth-century storms and restored imperial rule, Dadu stands poised to project its naval might into the Age of Discovery.#!\n\nFrom Jinjiang to Guangzhou and Xiangshan, southern ports bustle with ocean-going shipping. Dadu must choose its maritime course: an imperial treasure fleet, chartered merchant syndicates, or a frugal coastal grain escort."
 oe_yem.1.a: "Commission an Imperial Western Ocean Treasure Fleet"
 oe_yem.1.a.tt: "Unlocks the Western Ocean Expedition decision; gain [ShowModifier('oe_yem_treasure_fleet_mod')] (#Y 180#! months: celestial authority, exploration, and diplomacy at #R +25%#! heavy-ship upkeep and #R −6%#! tax efficiency); Jinjiang and Guangzhou gain entrepot bonuses; paper money trust below #Y 40#! adds fiscal overstretch."
 oe_yem.1.b: "Charter Maritime Merchant Syndicates at Jinjiang & Guangzhou"
 oe_yem.1.b.tt: "Unlocks the Western Ocean Expedition decision; gain [ShowModifier('oe_yem_merchant_syndicate_mod')] (#Y 180#! months: #G +12%#! trade income and #G +15%#! merchant power at lower control and #R −8%#! noble satisfaction)."
 oe_yem.1.c: "Forego Ocean Expeditions and Focus on Coastal Grain Escort"
 oe_yem.1.c.tt: "Gain [ShowModifier('oe_yem_coastal_guard_mod')] (#Y 180#! months: higher tax and stability efficiency at #R −8%#! sea trade and #R −15%#! colonial range); keeps the treasure expedition decision locked."
 oe_yem.2.t: "From Zaytun to Hormuz: Envoys of the Western Ocean"
 oe_yem.2.desc_srk: "#F Sailing south from Jinjiang through Malacca to Kozhikode, and westward to Hormuz and Aden, Yuan mariners follow the great monsoon artery uniting the China Seas with the western oceans.#!\n\nAstounding dispatches reach Dadu: at Aden and the approaches to Alexandria, Great Yuan treasure junks have rendezvoused with purple-sailed Roman merchantmen! Envoys from Malacca, Kozhikode, and Hormuz now throng Jinjiang and Qiongzhou."
 oe_yem.2.desc_gen: "#F Sailing south from Jinjiang through Malacca to Kozhikode, and westward to Hormuz and Aden, Yuan mariners follow the great monsoon artery uniting the China Seas with the western oceans.#!\n\nYuan ships have linked Malacca, Kozhikode, Hormuz, and Aden, drawing foreign envoys bearing spices and gems to Jinjiang and Guangzhou. Should Dadu shower gifts to build an Indian Ocean tributary network, or levy strict customs to finance the fleet?"
 oe_yem.2.a: "Reward Foreign Envoys and Anchor the Indian Ocean Network"
 oe_yem.2.a.tt: "Gain [ShowModifier('oe_yem_indian_ocean_hegemony')] (#Y 144#! months: sea trade, diplomacy, and prestige at #R +25%#! heavy-ship upkeep and #R −4%#! tax efficiency); Qiongzhou gains entrepot bonus; #G +30#! mutual opinion with Byzantium/Rome if extant."
 oe_yem.2.b: "Enforce Strict Tally Customs to Finance the Fleet"
 oe_yem.2.b.tt: "Gain [ShowModifier('oe_yem_customs_balance_mod')] (#Y 144#! months: #G +8%#! trade income and maritime presence at modest prestige and noble satisfaction loss)."
 oe_yem.3.t: "Manila Silver and the Paper Money Reform"
 oe_yem.3.desc_x: "#F In the late sixteenth century, torrents of American and Japanese silver poured through Manila galleons and Longxi's Moon Harbor into China, shaking the Great Yuan's two-century-old paper currency system.#!\n\nMerchants across the southern ports increasingly price goods in foreign silver, straining traditional paper notes. Should Dadu back its notes with an audited Silver Reserve Treasury, switch taxes to a Single Whip silver standard, or outlaw silver to defend the old chao?"
 oe_yem.3.a: "Establish the Dadu Silver-Reserve Paper Currency"
 oe_yem.3.a.tt: "Gain [ShowModifier('oe_yem_silver_reserve_chao')] (#Y 180#! months: #G +10%#! trade income, merchant power, and lower inflation at #R −6%#! cabinet and #R −3%#! tax efficiency); paper trust #G +15#!; boosts Global Trade in Dadu and Jinjiang (risks a bank run if trust or stability falters)."
 oe_yem.3.b: "Enact the Single Whip Silver Tax Reform"
 oe_yem.3.b.tt: "Gain [ShowModifier('oe_yem_single_whip_mod')] (#Y 180#! months: #G +10%#! tax efficiency and control at transitional prosperity drag and #R −10%#! noble satisfaction); reduces paper money reliance (trust #R −15#!)."
 oe_yem.3.c: "Ban Private Silver and Uphold Old Chao Decrees"
 oe_yem.3.c.tt: "Gain [ShowModifier('oe_yem_old_chao_stubborn')] (#Y 120#! months: mild stability and clerical favor at higher inflation, #R −8%#! trade, and slower institutions); sharply raises bank-run risk."
 oe_yem.4.t: "Paper Money Bank Run & Silver Liquidity Crisis"
 oe_yem.4.desc_run: "#F Early modern paper credit and oceanic silver flows lived on a knife's edge: whenever war spending, wavering confidence, or disrupted galleon sailings struck, treasury halls faced a ruthless liquidity test.#!\n\nPanic has erupted! Fearing depleted silver vaults, crowds of merchants and townsfolk besiege the treasury halls of Dadu and Hangzhou demanding immediate silver redemption. Will the court drain the treasury to honor every note in full, or suspend redemption at severe economic cost?"
 oe_yem.4.desc_shock: "#F Early modern paper credit and oceanic silver flows lived on a knife's edge: whenever war spending, wavering confidence, or disrupted galleon sailings struck, treasury halls faced a ruthless liquidity test.#!\n\nDisrupted Pacific and East Asian sailings have halved silver imports, triggering a sudden silver squeeze across Jiangnan and the north. Should Dadu spend heavily from its reserves to stabilize liquidity, or restrict disbursements and weather a harsh downturn?"
 oe_yem.4.a: "Open the Treasury Vaults for Full Silver Redemption"
 oe_yem.4.a.tt: "Quells the panic! Gain [ShowModifier('oe_yem_chao_vindicated_mod')] (#Y 120#! months: #G +6%#! trade and lower inflation at #R −5%#! cabinet efficiency); paper trust recovers by #G +12#!."
 oe_yem.4.b: "Restrict Redemption and Discount Outstanding Notes"
 oe_yem.4.b.tt: "Inflicts the degraded crisis state [ShowModifier('oe_yem_chao_run_scar')] (#Y 120#! months: surging inflation, #R −10%#! trade, #R −5%#! tax efficiency, and #R −12%#! burgher satisfaction); strips silver-reserve backing and cuts paper trust by #R −20#!."
 oe_yem.5.t: "Anchorage at Xiangshan: Western Ships & Ordnance"
 oe_yem.5.desc_x: "#F Rounding Africa and Malacca, Portuguese, Spanish, and Dutch carracks now anchor off Xiangshan and the Fujian coast, carrying silver, woollens, and breech-loading swivel guns in pursuit of direct China trade.#!\n\nProvincial officials report European ships anchored off Xiangshan offering heavy tariffs and artillery schematics for anchorage rights. Should Dadu charter Xiangshan as an open entrepot, purchase their cannon while confining their ships, or expel them altogether?"
 oe_yem.5.a: "Charter Xiangshan as an Entrepot and Adopt Western Ordnance"
 oe_yem.5.a.tt: "Gain [ShowModifier('oe_yem_western_ports_mod')] (#Y 144#! months: #G +8%#! trade and institution spread at #R −8%#! clergy satisfaction and slower conversion); Xiangshan gains [ShowModifier('oe_yem_xiangshan_charter')] (#R −15%#! max control); boosts Artillery institution and Western maritime opinions."
 oe_yem.5.b: "Confine Foreign Ships While Acquiring European Artillery"
 oe_yem.5.b.tt: "Gain [ShowModifier('oe_yem_selective_arsenal_mod')] (#Y 144#! months: #G +2.5%#! discipline and defense at #R −4%#! trade and lower diplomacy); advances Artillery in Guangzhou."
 oe_yem.5.c: "Close the Ports and Expel European Vessels"
 oe_yem.5.c.tt: "Gain [ShowModifier('oe_yem_closed_ports_mod')] (#Y 144#! months: tolerance, stability, and celestial authority at #R −8%#! research and #R −15%#! institution growth); lowers opinion with Western maritime powers."
 oe_yem.6.t: "Debate of the Imperial Observatory & Shenjiying Foundry"
 oe_yem.6.desc_srk: "#F Dadu already boasted a cosmopolitan astronomical heritage uniting Guo Shoujing's Shoushi calendar with Jamal al-Din's Islamic observatory. In the age of the Scientific Revolution, European savants arriving via Xiangshan and the Silk Road present telescopes, geometry, and cast-bronze cannon methods before the court.#!\n\nJoined by scholars linked to Constantinople's Silk Road network, European savants spark a grand debate in Dadu over calendar reform and modern bronze ordnance. Embracing them will lay the foundation for a modernized Shenjiying Artillery Foundry, yet conservative scholars fiercely resist."
 oe_yem.6.desc_gen: "#F Dadu already boasted a cosmopolitan astronomical heritage uniting Guo Shoujing's Shoushi calendar with Jamal al-Din's Islamic observatory. In the age of the Scientific Revolution, European savants arriving via Xiangshan and the Silk Road present telescopes, geometry, and cast-bronze cannon methods before the court.#!\n\nInside the Imperial Observatory, European astronomers predict an eclipse to the second and offer to oversee a modernized Dadu Shenjiying Artillery Foundry, while traditionalists warn that foreign doctrines will erode imperial orthodoxy. How shall the Great Khan decide?"
 oe_yem.6.a: "Appoint Western Savants to the Observatory & Found the Shenjiying Foundry"
 oe_yem.6.a.tt: "Sets the Shenjiying artillery flag for future military modernization; gain [ShowModifier('oe_yem_jesuit_observatory_mod')] (#Y 180#! months: #G +10%#! research, #G +3%#! discipline, and literacy at #R −10%#! clergy satisfaction, slower conversion, and higher army upkeep); Dadu gains observatory bonus and major Scientific Revolution and Artillery progress."
 oe_yem.6.b: "Adopt Astronomy & Cannon Founding Only; Bar Inland Missions"
 oe_yem.6.b.tt: "Sets the Shenjiying artillery flag; gain [ShowModifier('oe_yem_practical_learning_mod')] (#Y 180#! months: #G +5%#! research and #G +3%#! discipline at #R −4%#! trade and lower diplomacy); advances Artillery and Scientific Revolution in Dadu."
 oe_yem.6.c: "Dismiss Foreign Astronomers and Uphold Traditional Science"
 oe_yem.6.c.tt: "Gain [ShowModifier('oe_yem_orthodox_astronomy_mod')] (#Y 180#! months: tolerance, stability, and celestial authority at #R −10%#! research and #R −15%#! institution growth); does not establish the Shenjiying foundry."
 oe_yem.7.t: "The Little Ice Age: Grand Canal Relief vs Emergency Taxes"
 oe_yem.7.desc_canal: "#F In the mid-seventeenth century, the Little Ice Age gripped the northern hemisphere: frozen canals, frost-blighted harvests in Liaodong, and white-dzud blizzards across Mongolia shattered agrarian and steppe economies alike.#!\n\nBitter frost grips the realm, yet Great Yuan's standing canal and sea-grain infrastructure can still rush southern surpluses north to Dadu, Liaodong, and the steppe. Relief will strain the treasury, whereas emergency surcharges risk famine and rebellion."
 oe_yem.7.desc_gen: "#F In the mid-seventeenth century, the Little Ice Age gripped the northern hemisphere: frozen canals, frost-blighted harvests in Liaodong, and white-dzud blizzards across Mongolia shattered agrarian and steppe economies alike.#!\n\nSevere frost strikes the North China Plain, Liaodong, and the steppe, decimating herds and harvests. Should Dadu spend heavily to dredge the Grand Canal and open granaries for northern relief, or impose emergency war surcharges to protect the treasury?"
 oe_yem.7.a: "Open Imperial Granaries & Rush Canal Relief Northward"
 oe_yem.7.a.tt: "Gain [ShowModifier('oe_yem_lia_relief_mod')] (#Y 120#! months: celestial authority, peasant satisfaction, and stability at #R −8%#! tax and #R −5%#! cabinet efficiency); adds #G +15#! grain stock if active."
 oe_yem.7.b: "Levy Liaodong Surcharges & Steppe Herd Taxes"
 oe_yem.7.b.tt: "Gains #G +2#! months of emergency gold but inflicts the famine crisis [ShowModifier('oe_yem_lia_crisis_mod')] (#Y 120#! months: falling prosperity, #R −15%#! peasant satisfaction, #R −12#! subject loyalty, and Mandate drain); scars Dadu and Liaoyang."
 oe_yem.8.t: "The Steppe Charter & Kyakhta Northern Accord"
 oe_yem.8.desc_rus: "#F After three centuries of rule, a restored Great Yuan must finally resolve the dual-empire question: how to bind the Mongolian steppe appanages and agrarian provinces into a durable early modern state while confronting Russian expansion toward Lake Baikal and Kyakhta.#!\n\nEnvoys from Russia, once tributary to the Golden Horde, have crossed Siberia to Irkutsk and Kyakhta seeking a formal border treaty and overland tea-and-fur mart with the Great Khan! Dadu must settle both steppe governance and the Kyakhta frontier."
 oe_yem.8.desc_gen: "#F After three centuries of rule, a restored Great Yuan must finally resolve the dual-empire question: how to bind the Mongolian steppe appanages and agrarian provinces into a durable early modern state while confronting Russian expansion toward Lake Baikal and Kyakhta.#!\n\nAs the great frost eases, steppe princes and provincial governors gather in Dadu to settle the empire's northern constitution and the rising caravan route through Kyakhta. Should Dadu centralize under the Lifanyuan, codify a plural charter, or seal the northern watchposts?"
 oe_yem.8.a: "Centralize Under the Lifanyuan & Sign the Kyakhta Trade Accord"
 oe_yem.8.a.tt: "Opens the Kyakhta trade interface and caravan decision; gain [ShowModifier('oe_yem_lifanyuan_central_mod')] (#Y 180#! months: control, tax, and land trade at #R −15#! subject loyalty and #R −8%#! noble satisfaction); charters Kyakhta mart and grants #G +35#! Russo-Yuan opinion."
 oe_yem.8.b: "Proclaim the Plural Imperial Charter & Open Kyakhta Mart"
 oe_yem.8.b.tt: "Opens the Kyakhta trade interface and caravan decision; gain [ShowModifier('oe_yem_plural_charter_mod')] (#Y 180#! months: #G +15#! subject loyalty, #G +10%#! manpower, and land trade at #R −6%#! cabinet efficiency and slight control loss); grants #G +35#! Russo-Yuan opinion."
 oe_yem.8.c: "Seal the Northern Karun Watchposts & Reject Border Trade"
 oe_yem.8.c.tt: "Gain [ShowModifier('oe_yem_northern_karun_mod')] (#Y 180#! months: #G +10%#! defense and stability at #R −10%#! land trade and lower diplomacy); keeps Kyakhta closed and lowers Russo-Yuan opinion by #R −25#!."
 oe_yem.9.t: "Jiangnan Manufactories & the Dadu Arsenal"
 oe_yem.9.desc_x: "#F At the turn of the eighteenth century, manufactories reshape Eurasian production. Across Hangzhou, Jiangning, and Shanghai, bustling silk, porcelain, and iron workshops alongside Dadu's ordnance foundries herald the dawn of proto-industrialization.#!\n\nJiangnan entrepreneurs and imperial master artisans petition Dadu to charter private-backed coal, iron, silk, and firearms manufactories, while bureaucratic traditionalists urge strict state monopolies over looms and arsenals."
 oe_yem.9.a: "Charter Private-Backed Jiangnan Manufactories & Dadu Arsenal"
 oe_yem.9.a.tt: "Reinforces the Shenjiying foundry flag; gain [ShowModifier('oe_yem_jiangnan_manufactory_mod')] (#Y 180#! months: #G +8%#! tax efficiency, development, and institution growth at #R −8%#! peasant satisfaction and mild inflation); grants workshop modifiers and Manufactories spread in Hangzhou, Jiangning, Shanghai, and Dadu."
 oe_yem.9.b: "Maintain Strict State Loom & Arsenal Monopolies"
 oe_yem.9.b.tt: "Gain [ShowModifier('oe_yem_state_monopoly_mod')] (#Y 180#! months: higher control and discipline at #R −10%#! burgher satisfaction and #R −8%#! institution growth)."
 oe_yem.10.t: "Four Seas at Peace: The Early Modern Great Yuan"
 oe_yem.10.desc_x: "#F From the fifteenth-century treasure voyages through the global silver tide, Xiangshan trade, the Imperial Observatory debates, the Little Ice Age, and the Kyakhta frontier, Great Yuan has endured three centuries of early modern transformation.#!\n\nAs the age of revolutions and industry looms ahead, the Secretariat asks the Great Khan to codify Great Yuan's enduring modern course: proclaim an open Early Modern Great Yuan Era, or anchor the realm as a Bastion of the Celestial Mandate?"
 oe_yem.10.a: "Proclaim the Early Modern Great Yuan Era"
 oe_yem.10.a.tt: "Gain lasting [ShowModifier('oe_yem_modern_yuan_mod')] until Yuan falls (#G +10%#! trade, #G +8%#! research, #G +10%#! institution spread, and celestial authority at #R −5%#! cabinet, #R −6%#! clergy, and #R +15%#! heavy-ship upkeep). Completes this line."
 oe_yem.10.b: "Consolidate the Bastion of the Celestial Mandate"
 oe_yem.10.b.tt: "Gain lasting [ShowModifier('oe_yem_celestial_bastion_mod')] until Yuan falls (strong control, defense, stability, and celestial authority at #R −6%#! research and #R −8%#! sea trade). Completes this line."
 oe_yem.20.t: "Restored Yuan Early Modern: Choice Takes Effect"
