 oe_prf_convene_consistorium: "Convene the Praetorian Consistorium"
 oe_prf_convene_consistorium_desc: "Summon the seats of the Praetorian Consistorium to review the four Prefectures, twelve Dioceses, and Imperial Strain relief, while syncing member seats."
 oe_prf_convene_consistorium_tt: "Sync Consistorium seats and Prefectural modifiers, then open the Prefectures & Dioceses overview."
 oe_prf_invest_diocese: "Invest a Diocesan Vicarius"
 oe_prf_invest_diocese_desc: "Appoint a Vicarius for an eligible unorganized classical Diocese, choosing between a Senatorial Civil Vicariate and a Military Ducatus."
 oe_prf_invest_diocese_tt: "Spend #R 5#! [oe_tu_authority|e] and #R 100#! gold to charter the next eligible classical Diocese as Civil or Military."
 oe_prf_reform_prefecture: "Reform a Praetorian Prefecture"
 oe_prf_reform_prefecture_desc: "Reopen the charter of an active Praetorian Prefecture to switch between Senatorial Civil governance and Imperial Military or Foederati rule (once every #Y 5#! years)."
 oe_prf_reform_prefecture_tt: "Spend #R 10#! [oe_tu_authority|e] and stability to reopen the charter choice for an active Praetorian Prefecture."
 oe_prf_enroll_subjects: "Enroll Exarchates & Roman Clients"
 oe_prf_enroll_subjects_desc: "Formally register newly created [Concept('oe_tu_exarchate','exarchates')|e], senior themes, and outer Roman client realms into the Praetorian Consistorium."
 oe_prf_enroll_subjects_tt: "All eligible [Concept('oe_tu_exarchate','exarchates')|e] and outer Roman clients join the Imperial Praetorian Consistorium with their respective seats."
 oe_prf_allow_chartered: "The New Notitia Dignitatum and Praetorian Consistorium have been established"
 oe_prf_allow_dio_avail: "At least one eligible classical Diocese remains unorganized"
 oe_prf_allow_pref_active: "At least one Praetorian Prefecture is chartered"
 oe_prf_allow_auth_5: "Imperial Authority is at least #Y 5#!"
 oe_prf_allow_auth_10: "Imperial Authority is at least #Y 10#!"
 oe_prf.1.t: "The New Notitia Dignitatum"
 oe_prf.1.d: "With three or more old regions recovered, ruling every frontier directly from Constantinople strains the palace. Imperial jurists have unrolled the fourth-century Notitia Dignitatum: Diocletian and Constantine divided the empire into four Praetorian Prefectures — Oriens, Illyricum, Italia et Africa, and Galliae — overseeing twelve classical Dioceses to share the imperial load. As we convene the Imperial Praetorian Consistorium, what charter shall guide it?"
 oe_prf.1.a: "Favor Senatorial Civil Governance"
 oe_prf.1.a.tt: "Establish the Imperial Praetorian Consistorium, unlocking the #Y 4#! Prefectures & #Y 12#! Dioceses with a civil-leaning charter"
 oe_prf.1.b: "Favor Imperial Military Exarchs"
 oe_prf.1.b.tt: "Establish the Imperial Praetorian Consistorium, unlocking the #Y 4#! Prefectures & #Y 12#! Dioceses with a military-leaning charter"
 oe_prf.1.c: "Balance Civil and Military Arms"
 oe_prf.1.c.tt: "Establish the Imperial Praetorian Consistorium, [oe_tu_authority|e] #G +5#!, judging each Prefecture on its own merits"
 oe_prf.2.t: "Charter of the Prefecture of the East"
 oe_prf.2.d: "From the Bosporus to the Euphrates and the Nile, the Prefecture of the East spans Thrace, Asiana, Pontica, Oriens, and Aegyptus. It is the empire's richest granary and customs artery, yet also its shield against eastern empires. Shall it be governed as a Senatorial Civil Prefecture or a Military Exarchate?"
 oe_prf.2.a: "Charter a Senatorial Civil Prefecture"
 oe_prf.2.a.tt: "Oriens adopts Senatorial Civil rule: tax efficiency #G +6%#!, prosperity & land trade up, Imperial Strain #G −0.25#!/month; trade-off: levy size #R −5%#!, garrison size #R −8%#!"
 oe_prf.2.b: "Charter the Military Exarchate of the East"
 oe_prf.2.b.tt: "Oriens adopts Military [oe_tu_exarchate|e] rule: garrison size #G +12%#!, manpower #G +6%#!, land morale #G +4%#!, Imperial Strain #G −0.12#!/month; trade-off: tax efficiency #R −4%#!, court spending #R −3%#!, risk of overmighty Exarch"
 oe_prf.2.c: "Defer the Charter for Now"
 oe_prf.2.c.tt: "Leave Oriens unchartered for now"
 oe_prf.3.t: "Charter of the Prefecture of Illyricum"
 oe_prf.3.d: "North of Thessaloniki stretch Macedonia, Dacia, and Pannonia — the empire's historic recruiting ground and Danubian shield. Civil administration accelerates assimilation and fiscal order, whereas a Danubian Limes Prefecture binds Balkan marches and clients into a military cordon at the cost of border prosperity."
 oe_prf.3.a: "Charter a Classical Civil Prefecture"
 oe_prf.3.a.tt: "Illyricum adopts Civil rule: assimilation #G +10%#!, tax efficiency #G +4%#!, stability cost efficiency #G +5%#!, Imperial Strain #G −0.25#!/month; trade-off: army levy size #R −5%#!, army maintenance #R −4%#!"
 oe_prf.3.b: "Charter the Danubian Limes Prefecture"
 oe_prf.3.b.tt: "Illyricum adopts Danubian Limes rule: army levy size #G +8%#!, supply limit #G +10%#!, subject loyalty #G +5%#!, Imperial Strain #G −0.12#!/month; trade-off: tax efficiency #R −3%#!, monthly prosperity penalty"
 oe_prf.3.c: "Defer for Now"
 oe_prf.3.c.tt: "Leave Illyricum unchartered for now"
 oe_prf.4.t: "Charter of the Prefecture of Italy & Africa"
 oe_prf.4.d: "Rome, Ravenna, and Carthage have returned beneath the purple, yet the distant Western Mediterranean is the heaviest source of Imperial Strain. Emperor Maurice once created the Exarchates of Ravenna and Carthage to hold these shores by force, while the Roman Senate begs for a civil dual-capital settlement."
 oe_prf.4.a: "Establish Senatorial Dual-Capital Provinces"
 oe_prf.4.a.tt: "Italia & Africa adopt Senatorial Dual-Capital rule: heretic tolerance #Y +1#!, development #G +6%#!, diplomatic reputation #G +1#!, Imperial Strain #G −0.40#!/month; trade-off: monthly legitimacy #R −0.04#!, max control #R −3%#!"
 oe_prf.4.b: "Establish the Exarchates of Ravenna & Carthage"
 oe_prf.4.b.tt: "Italia & Africa adopt Dual [oe_tu_exarchate|e] rule: max control #G +4%#!, naval morale #G +6%#!, garrison size #G +10%#!, Imperial Strain #G −0.20#!/month; trade-off: heretic tolerance #Y −0.5#!, tax efficiency #R −4%#!, Exarch revolt risk"
 oe_prf.4.c: "Defer for Now"
 oe_prf.4.c.tt: "Leave Italia & Africa unchartered for now"
 oe_prf.5.t: "Charter of the Prefecture of the Gauls"
 oe_prf.5.d: "Beyond the Alps and Pyrenees lie Gaul, Hispania, Britain, and the Rhine frontier — far from the Mediterranean core. Direct civil provincialization promises assimilation and tax at steep bureaucratic cost; reviving the Late Roman Foederati system delegates the outer rim to loyal client kings at the price of imperial tax revenue."
 oe_prf.5.a: "Enforce Western Civil Provincialization"
 oe_prf.5.a.tt: "Galliae adopts Civil Provincialization: assimilation #G +8%#!, tax efficiency #G +5%#!, monthly control up, Imperial Strain #G −0.40#!/month; trade-off: court spending #Y −5%#!, stability cost efficiency #R −6%#!"
 oe_prf.5.b: "Adopt the Foederati & Client System"
 oe_prf.5.b.tt: "Galliae adopts Foederati rule: subject loyalty #G +8%#!, subject opinion #G +15#!, levy recovery #G +10%#!, Imperial Strain #G −0.30#!/month; trade-off: tax efficiency #R −5%#!, monthly prestige #R −0.03#!"
 oe_prf.5.c: "Defer for Now"
 oe_prf.5.c.tt: "Leave Galliae unchartered for now"
 oe_prf.6.t: "Investing the Vicarius: [ROOT.GetCountry.Custom('OePrfPendingDio')]"
 oe_prf.6.d: "The Praetorian Consistorium reports that [ROOT.GetCountry.Custom('OePrfPendingDio')] is ready for diocesan organization. Under the Notitia Dignitatum, a Vicarius oversees the provinces beneath each Prefecture. Shall we install a Civil Vicarius to nurture trade and ease Imperial Strain, or a Military Dux to fortify garrisons and levies?"
 oe_prf.6.a: "Appoint a Civil Vicarius"
 oe_prf.6.a.tt: "Organize [ROOT.GetCountry.Custom('OePrfPendingDio')] as a Civil Diocese: seat gains prosperity, lower unrest & trade power, Imperial Strain #G −0.05#!/month; trade-off: local levies #Y −15%#!, local garrison #Y −10%#!"
 oe_prf.6.b: "Appoint a Military Dux"
 oe_prf.6.b.tt: "Organize [ROOT.GetCountry.Custom('OePrfPendingDio')] as a Military Diocese: seat gains local levies #Y +15%#!, local garrison #Y +15%#! & control growth, Imperial Strain #G −0.02#!/month; trade-off: lower local prosperity, higher unrest"
 oe_prf.6.c: "Leave This Diocese Unorganized for Now"
 oe_prf.6.c.tt: "Defer organizing this Diocese (can be chartered anytime via the Consistorium)"
 oe_prf.7.t: "An Overmighty Praetorian Exarch"
 oe_prf.7.d: "A Praetorian Exarch commanding one of our military prefectures has begun withholding provincial customs, appointing officers without imperial writ, and courting frontier magnates in the Consistorium. History warns Constantinople: uniting sword and purse in one governor defends the border, yet breeds contenders for the purple."
 oe_prf.7.a: "Curb the Exarch by Imperial Rescript"
 oe_prf.7.a.tt: "[oe_tu_authority|e] #R −5#!; gain 'Curbed Exarchal Authority' for #Y 10#! years (+legitimacy & cabinet efficiency, but garrison size #R −8%#! and subject loyalty #R −5%#!)"
 oe_prf.7.b: "Appease the Exarch with Honours and Gold"
 oe_prf.7.b.tt: "Gain 'Appeased Praetorian Exarch' for #Y 10#! years (+subject loyalty & garrison, but tax efficiency #R −5%#! and monthly legitimacy #R −0.03#!)"
 oe_prf.7.c: "Demilitarize One Prefecture into Senatorial Rule"
 oe_prf.7.c.tt: "Convert one Military Prefecture to Senatorial Civil governance, removing its military overreach"
 oe_prf.8.t: "Four Prefectures, One Empire"
 oe_prf.8.d: "Oriens, Illyricum, Italia et Africa, and Galliae — for the first time since the fifth century all four classical Praetorian Prefectures stand united in a single Notitia Dignitatum, with their dioceses answering the Consistorium from the Nile to the Rhine. Now we must seal its enduring constitutional shape."
 oe_prf.8.a: "Codify the New Notitia into Law"
 oe_prf.8.a.tt: "Permanently gain 'Codified New Notitia Dignitatum' (#Y +6%#! cabinet efficiency, +monthly control, extra #Y −0.15#!/month Imperial Strain relief; trade-off: court spending #Y −4%#!)"
 oe_prf.8.b: "Promulgate the Unified Praetorian Command"
 oe_prf.8.b.tt: "Permanently gain 'Unified Praetorian Command' (#G +6%#! manpower, #G +5%#! subject loyalty; trade-off: tax efficiency #R −3%#!)"
 oe_prf.90.t: "Imperial Praetorian Consistorium Overview"
 oe_prf.90.d: "#T Consistorium Status#!: [ROOT.GetCountry.Custom('OePrfConsistoriumState')]  Unlock Tier: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_unlock_tier')|0]#! / #Y 3#!  Posture: [ROOT.GetCountry.Custom('OePrfBalance')]\n#T Chartered Prefectures#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_active_prefectures')|0]#! / #Y 4#! (Civil [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_civil_prefectures')|0] | Military/Foederati [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_mil_prefectures')|0])\n#T Organized Dioceses#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_active_dioceses')|0]#! / #Y 12#! (Civil [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_civil_dioceses')|0] | Military [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_mil_dioceses')|0])\n#T Monthly Imperial Strain Relief#!: #G [ROOT.GetCountry.MakeScope.ScriptValue('oe_prf_strain_relief')|2]#! (applied monthly once The Burden of Rome begins)\n\n• Oriens (Thrace / Asiana / Pontica / Oriens / Aegyptus): [ROOT.GetCountry.Custom('OePrfMode1')]\n• Illyricum (Macedonia / Dacia / Pannonia): [ROOT.GetCountry.Custom('OePrfMode2')]\n• Italia et Africa (Italia / Africa): [ROOT.GetCountry.Custom('OePrfMode3')]\n• Galliae (Gaul & Hispania / Britain & Rhine): [ROOT.GetCountry.Custom('OePrfMode4')]"
 oe_prf.90.a: "Dismiss the Consistorium"
