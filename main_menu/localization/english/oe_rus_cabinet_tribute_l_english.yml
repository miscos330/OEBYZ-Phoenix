l_english:
 oe_rus_return_gifts: "Imperial Return Gifts"
 oe_rus_accelerate_unification: "Accelerate Unification"
 oe_rus_accelerate_unification_desc: "Available only to the highest-scoring country. Spend 25 Legitimacy to remove both directions of the truce with another country among the top three. Five-year cooldown."
 oe_rus_accelerate_unification_cooldown: "Accelerate Unification"
 oe_rus_siberian_migration: "Siberian Migration"
 oe_rus_siberian_migration_desc: "Organize migration from a wholly owned core province in Russia or the Urals to a province in Western or Eastern Siberia bordering Russia or its subjects and containing uncolonized locations. Monthly migration is 0.1% of the origin province's starting population, capped at 1,000 people, and draws only from our locations. After 60 uninterrupted months, all remaining ownable, unowned locations in the destination belong to Russia and become cores. Cabinet efficiency does not shorten this period. Only one cabinet may perform the task. Cancellation discards progress and stops migration. The origin receives +5% Population Growth, decaying over 60 months."
 oe_rus_siberian_migration_active: "Migrating to Siberia"
 oe_rus_siberian_migration_action: "Migrate to Siberia"
 oe_sm_choose_origin: "Select the origin province"
 oe_sm_choose_destination: "Select a Siberian destination"
 oe_sm_no_origin: "@trigger_no! No wholly owned core province in Russia or the Urals is free of the Siberian Migration Wave modifier."
 oe_sm_no_destination: "@trigger_no! No province in Western or Eastern Siberia borders our realm and contains ownable, unowned locations."
 STATIC_MODIFIER_NAME_oe_siberian_migration_wave: "Siberian Migration Wave"
 STATIC_MODIFIER_DESC_oe_siberian_migration_wave: "The homes and holdings left by settlers allow remaining households to raise more children. This effect gradually fades over five years."
 oe_siberian_migration.2.t: "New Villages in the Forest"
 oe_siberian_migration.2.d: "For five years, households have followed the rivers and old tracks to [SCOPE.sProvinceDefinition('oe_sm_completed_destination').GetName]. The first huts now stand within fenced yards, crops ripen in clearings, and church bells reach the new villages.\n\nOfficials have returned with the final registers. The remaining unclaimed settlements are now entered on Russia's rolls and joined to the country as core lands."
 oe_siberian_migration.2.a: "May they prosper on their new land."
 oe_sm_generation: "Siberian Migration Assignment"
 oe_sm_elapsed: "Months of Migration"
 oe_rus_siberian_migration_action_progress: "[SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60"
 oe_rus_siberian_migration_action_progress_wordier: "[SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60 months of migration"
 oe_rus_siberian_migration_action_progress_long_wordier: "Siberian migration: [SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60 months"
 oe_rus_siberian_migration_action_progress_tooltip: "Completes after 60 uninterrupted months, regardless of cabinet efficiency. Current progress: [SCOPE.sCountry('actor').MakeScope.GetVariable('oe_sm_elapsed').GetValue|0]/60 months."
