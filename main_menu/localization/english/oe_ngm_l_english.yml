 oe_ngm_ach_m20_tt:0 "We have inscribed Imperial Chronicle Milestone XX: Celestial Eight-Direction Protectorates"
 ACHIEVEMENT_oe_ngm_ach_m21:0 "98/98 Republic of All Nations & Synthesis"
 ACHIEVEMENT_DESC_oe_ngm_ach_m21:0 "Complete global enlightenment syntheses, safeguard world masterworks, or proclaim the Republic of All Nations."
 oe_ngm_ach_m21_tt:0 "We have inscribed Imperial Chronicle Milestone XXI: 98/98 Republic of All Nations & Synthesis"
 ACHIEVEMENT_oe_ngm_ach_m22:0 "Imperial Roads & Masterworks Custodian"
 ACHIEVEMENT_DESC_oe_ngm_ach_m22:0 "Construct at least 25 Imperial Road segments or serve as sworn Custodian of Immortal Masterworks."
 oe_ngm_ach_m22_tt:0 "We have inscribed Imperial Chronicle Milestone XXII: Imperial Roads & Masterworks Custodian"
 STATIC_MODIFIER_NAME_oe_ngm_anti_hegemon_pact_mod:0 "Grand Anti-Hegemon Coalition Pact"
 STATIC_MODIFIER_DESC_oe_ngm_anti_hegemon_pact_mod:0 "Bound by mutual deterrence against continental domination, signatory chancelleries pool military intelligence and diplomatic weight."
 STATIC_MODIFIER_NAME_oe_ngm_kanhe_grantor_mod:0 "Imperial Kanhe Tally Authority"
 STATIC_MODIFIER_DESC_oe_ngm_kanhe_grantor_mod:0 "Issuing numbered maritime Kanhe tallies channels lucrative tributary cargoes through imperial customs houses and elevates court prestige."
 STATIC_MODIFIER_NAME_oe_ngm_kanhe_partner_mod:0 "Chartered Kanhe Maritime Partner"
 STATIC_MODIFIER_DESC_oe_ngm_kanhe_partner_mod:0 "Holding a sovereign Kanhe tally unlocks privileged access to imperial ports, silver exchanges, and maritime scholarly circulation."
 STATIC_MODIFIER_NAME_oe_ngm_treaty_port_host_mod:0 "Open Treaty Port Customs"
 STATIC_MODIFIER_DESC_oe_ngm_treaty_port_host_mod:0 "Foreign commercial enclaves stimulate urban workshops and modern technical transfer, though they constrain unilateral customs sovereignty."
 STATIC_MODIFIER_NAME_oe_ngm_treaty_port_holder_mod:0 "Extraterritorial Treaty Port Enclave"
 STATIC_MODIFIER_DESC_oe_ngm_treaty_port_holder_mod:0 "Chartered consular factories and naval coaling stations project commercial and maritime dominance across distant sea basins."
 STATIC_MODIFIER_NAME_oe_ngm_coalition_vanguard_mod:0 "Vanguard of the Anti-Hegemon Correspondence"
 STATIC_MODIFIER_DESC_oe_ngm_coalition_vanguard_mod:0 "Secret envoys knit rival courts into an early warning network to check imperial hegemony before continental balance collapses."
 STATIC_MODIFIER_NAME_oe_ngm_armed_neutrality_mod:0 "League of Armed Neutrality"
 STATIC_MODIFIER_DESC_oe_ngm_armed_neutrality_mod:0 "Declining entanglement in Great Power crusades preserves domestic fortifications and guards neutral merchant shipping."
 STATIC_MODIFIER_NAME_oe_ngm_continental_blockade_mod:0 "Continental Blockade Decrees"
 STATIC_MODIFIER_DESC_oe_ngm_continental_blockade_mod:0 "Port closures and sweeping customs edicts weaponize continental markets to strangle rival maritime supply lines."
 STATIC_MODIFIER_NAME_oe_ngm_licensed_trade_mod:0 "Wartime Licensed Trade Charters"
 STATIC_MODIFIER_DESC_oe_ngm_licensed_trade_mod:0 "Controlled imperial trading licenses collect war tariffs while keeping industrial workshops supplied with vital raw materials."
 STATIC_MODIFIER_NAME_oe_ngm_neutral_convoy_mod:0 "Armed Neutral Convoy System"
 STATIC_MODIFIER_DESC_oe_ngm_neutral_convoy_mod:0 "Escorted merchant convoys and nimble frigates run continental cordons, turning wartime scarcity into windfall maritime profit."
 STATIC_MODIFIER_NAME_oe_ngm_customs_cordon_mod:0 "Coastal Customs Cordon"
 STATIC_MODIFIER_DESC_oe_ngm_customs_cordon_mod:0 "Tightly patrolled customs cordons suppress contraband rings and reinforce crown fiscal control over littoral provinces."
 STATIC_MODIFIER_NAME_oe_ngm_first_coalition_mod:0 "Accord of the First Coalition"
 STATIC_MODIFIER_DESC_oe_ngm_first_coalition_mod:0 "Rival monarchies and republics set aside old grievances to march under a common standard against continental hegemony."
 STATIC_MODIFIER_NAME_oe_ngm_subsidy_chest_mod:0 "Coalition Subsidy Exchequer"
 STATIC_MODIFIER_DESC_oe_ngm_subsidy_chest_mod:0 "Rather than risking immediate land campaigns, the treasury finances frontline allies through structured bullion remittances."
 STATIC_MODIFIER_NAME_oe_ngm_allied_war_chest_mod:0 "Sovereign Coalition War Bonds"
 STATIC_MODIFIER_DESC_oe_ngm_allied_war_chest_mod:0 "Deep capital markets and public war bonds sustain multi-theater coalition armies without exhausting domestic taxation."
 STATIC_MODIFIER_NAME_oe_ngm_specie_reserve_mod:0 "Fortified Bullion Treasury"
 STATIC_MODIFIER_DESC_oe_ngm_specie_reserve_mod:0 "Conserving hard specie reserves shields coinage from wartime inflation and keeps domestic credit rock-solid."
 STATIC_MODIFIER_NAME_oe_ngm_second_coalition_mod:0 "Second Coalition Counter-Offensive"
 STATIC_MODIFIER_DESC_oe_ngm_second_coalition_mod:0 "Hardened by earlier reverses, coalition generals adopt corps maneuvers and coordinated multi-front offensives."
 STATIC_MODIFIER_NAME_oe_ngm_river_fortress_mod:0 "Riverine Bastion Defense Line"
 STATIC_MODIFIER_DESC_oe_ngm_river_fortress_mod:0 "Layered star fortresses and pontoon depots anchor strategic river crossings against sudden hegemonic thrusts."
 STATIC_MODIFIER_NAME_oe_ngm_grand_muster_mod:0 "Grand Coalition General Levy"
 STATIC_MODIFIER_DESC_oe_ngm_grand_muster_mod:0 "Nationwide mobilization, unified staff maps, and massed field artillery turn coalition armies into an unstoppable juggernaut."
 STATIC_MODIFIER_NAME_oe_ngm_guard_corps_mod:0 "Reformed Imperial Guard Corps"
 STATIC_MODIFIER_DESC_oe_ngm_guard_corps_mod:0 "Veteran shock divisions and disciplined heavy infantry cadres stiffen the battle line during prolonged coalition campaigns."
 STATIC_MODIFIER_NAME_oe_ngm_third_coalition_mod:0 "Crusade for Eurasian Balance"
 STATIC_MODIFIER_DESC_oe_ngm_third_coalition_mod:0 "With continental liberties hanging in the balance, allied armies press relentless sieges and iron-disciplined line volleys."
 STATIC_MODIFIER_NAME_oe_ngm_amphibious_coalition_mod:0 "Maritime Blockade & Expeditionary Corps"
 STATIC_MODIFIER_DESC_oe_ngm_amphibious_coalition_mod:0 "Grand battlefleets choke coastal arteries while amphibious squadrons strike exposed imperial flanks."
 STATIC_MODIFIER_NAME_oe_ngm_battle_of_nations_mod:0 "Thunder of the Battle of Nations"
 STATIC_MODIFIER_DESC_oe_ngm_battle_of_nations_mod:0 "Massed reserve batteries and synchronized infantry assaults shatter the enemy center in the defining battle of the age."
 STATIC_MODIFIER_NAME_oe_ngm_enveloping_wings_mod:0 "Grand Enveloping Maneuver"
 STATIC_MODIFIER_DESC_oe_ngm_enveloping_wings_mod:0 "Disciplined flanking corps cut supply roads and force decisive operational encirclements with minimal attrition."
 STATIC_MODIFIER_NAME_oe_ngm_abdication_settlement_mod:0 "Honorable Regency & Peace Settlement"
 STATIC_MODIFIER_DESC_oe_ngm_abdication_settlement_mod:0 "By relinquishing overextended hegemonic ambitions, the realm arrests war exhaustion and secures an honored seat at the peace congress."
 STATIC_MODIFIER_NAME_oe_ngm_last_guard_mod:0 "Defiance of the Old Guard"
 STATIC_MODIFIER_DESC_oe_ngm_last_guard_mod:0 "Refusing surrender, the sovereign stakes throne and empire on one final thunderous campaign of imperial defiance."
 STATIC_MODIFIER_NAME_oe_ngm_vienna_rebalance_mod:0 "Congress of Vienna Legitimist Order"
 STATIC_MODIFIER_DESC_oe_ngm_vienna_rebalance_mod:0 "Plenipotentiaries ratify restored frontiers, diplomatic reciprocity, and collective restraint across the great courts of Eurasia."
 STATIC_MODIFIER_NAME_oe_ngm_vienna_indemnity_mod:0 "Post-War Commercial & Maritime Indemnities"
 STATIC_MODIFIER_DESC_oe_ngm_vienna_indemnity_mod:0 "Reparations and open-navigation clauses fill state coffers and cement maritime dominance in the post-war recovery."
 STATIC_MODIFIER_NAME_oe_ngm_buffer_guarantee_mod:0 "Guarantor of Neutral Buffer Corridors"
 STATIC_MODIFIER_DESC_oe_ngm_buffer_guarantee_mod:0 "Guaranteeing neutralized straits and frontier buffer realms stabilizes vassal loyalty and expands diplomatic standing."
 STATIC_MODIFIER_NAME_oe_ngm_border_marches_mod:0 "Fortified Post-Congress Marches"
 STATIC_MODIFIER_DESC_oe_ngm_border_marches_mod:0 "Rather than trusting parchment guarantees alone, border provinces are fortified into impregnable frontier bastions."
 STATIC_MODIFIER_NAME_oe_ngm_concert_peace_mod:0 "Concert of Eurasia Peace Protocol"
 STATIC_MODIFIER_DESC_oe_ngm_concert_peace_mod:0 "Regular ambassadorial congresses cool diplomatic flashpoints and usher in a prosperous generation of post-war reconstruction."
 STATIC_MODIFIER_NAME_oe_ngm_unilateral_doctrine_mod:0 "Sovereign Unilateral Doctrine"
 STATIC_MODIFIER_DESC_oe_ngm_unilateral_doctrine_mod:0 "Retaining freedom from collective vetoes preserves aggressive military initiative and independent strategic reach."
 STATIC_MODIFIER_NAME_oe_ngm_arbitration_tribunal_mod:0 "Great Power Arbitral Jurisprudence"
 STATIC_MODIFIER_DESC_oe_ngm_arbitration_tribunal_mod:0 "Submitting territorial and commercial disputes to codified international tribunals elevates prestige and stabilizes maritime trade."
 STATIC_MODIFIER_NAME_oe_ngm_sovereign_claims_mod:0 "Uncompromising Sovereign Claims"
 STATIC_MODIFIER_DESC_oe_ngm_sovereign_claims_mod:0 "Rejecting external arbitration affirms historic dynastic title and rallies domestic estates behind the crown."
 STATIC_MODIFIER_NAME_oe_ngm_industrial_treaty_mod:0 "Steam-Age Industrial Commerce Treaty"
 STATIC_MODIFIER_DESC_oe_ngm_industrial_treaty_mod:0 "Cross-border technical standards, machine imports, and industrial treaties propel factories and universities into the modern age."
 STATIC_MODIFIER_NAME_oe_ngm_concert_chancery_mod:0 "Imperial Concert Grand Chancery"
 STATIC_MODIFIER_DESC_oe_ngm_concert_chancery_mod:0 "An institutionalized diplomatic corps manages alliances, treaties, and cabinet correspondence with unmatched polish."
 STATIC_MODIFIER_NAME_oe_ngm_swan_song_concert_mod:0 "Imperial Swan Song: Eternal Concert"
 STATIC_MODIFIER_DESC_oe_ngm_swan_song_concert_mod:0 "As the early modern era closes in 1836, the empire crowns five centuries of statecraft with timeless diplomatic and cultural grandeur."
 STATIC_MODIFIER_NAME_oe_ngm_swan_song_industrial_mod:0 "Imperial Swan Song: Forge of the New Century"
 STATIC_MODIFIER_DESC_oe_ngm_swan_song_industrial_mod:0 "Steam hammers, literate citizens, and burgeoning workshops carry the ancient realm triumphantly across the threshold of the industrial century."
 oe_ngm.1.title:0 "The Shadow of Continental Hegemony"
 oe_ngm.1.desc:0 "Across embassies from the Bosphorus to the Atlantic, dispatches warn that one towering Great Power now threatens to overturn the balance of Eurasia. Courts debate whether to open secret anti-hegemon correspondence before subordinate frontiers collapse."
 oe_ngm.1.a:0 "Open the Anti-Hegemon Correspondence"
 oe_ngm.1.b:0 "Proclaim Armed Neutrality"
 oe_ngm.2.title:0 "The Continental Blockade Decrees"
 oe_ngm.2.desc:0 "Seeking to bend maritime rivals to our imperial will without fighting a battle on every sea, our ministers propose sealing continental harbors to hostile merchant fleets—even at the cost of restless port burghers."
 oe_ngm.2.a:0 "Enforce the Continental Blockade"
 oe_ngm.2.b:0 "Issue Licensed Wartime Charters"
 oe_ngm.3.title:0 "Smuggling Networks & Neutral Maritime Rights"
 oe_ngm.3.desc:0 "Harbor closures have spawned audacious coastal smuggling syndicates, neutral flag registries, and prize-court disputes. Admiralty lords urge armed neutral convoys to keep vital cargoes flowing, while treasury officers demand strict customs cordons."
 oe_ngm.3.a:0 "Charter Armed Neutral Convoys"
 oe_ngm.3.b:0 "Tighten the Coastal Customs Cordon"
 oe_ngm.4.title:0 "The First Anti-Hegemon Coalition"
 oe_ngm.4.desc:0 "Plenipotentiaries have convened to bind independent Great Powers into the First Anti-Hegemon Coalition. Joint military protocols, defensive pacts, and balance-of-power war claims stand ready for signature."
 oe_ngm.4.a:0 "Sign the First Coalition Accord"
 oe_ngm.4.b:0 "Finance Frontline Allies from the Treasury"
 oe_ngm.5.title:0 "Coalition Financing & Sovereign War Subsidies"
 oe_ngm.5.desc:0 "Continental campaigns devour gold as rapidly as powder. Bankers offer to float sovereign coalition war bonds backed by customs revenues, while conservative ministers warn against letting bullion drain abroad."
 oe_ngm.5.a:0 "Underwrite Sovereign Coalition War Bonds"
 oe_ngm.5.b:0 "Guard Domestic Bullion Reserves"
 oe_ngm.6.title:0 "The Second Anti-Hegemon Coalition Wave"
 oe_ngm.6.desc:0 "An uneasy truce has shattered as fresh diplomatic incidents ignite the Second Coalition Wave. Across river plains and mountain passes, reformed corps prepare for renewed multi-theater containment."
 oe_ngm.6.a:0 "Launch the Second Coalition Counter-Offensive"
 oe_ngm.6.b:0 "Fortify the Riverine Bastion Line"
 oe_ngm.7.title:0 "Grand Coalition Army Muster"
 oe_ngm.7.desc:0 "War ministries unveil standardized staff maps, mass conscription rolls, and mobile horse-artillery batteries. Commanders ask whether to summon a nationwide general levy or concentrate recruits into elite guard divisions."
 oe_ngm.7.a:0 "Proclaim the General Levy & Joint Staff"
 oe_ngm.7.b:0 "Expand the Reformed Guard Corps"
 oe_ngm.8.title:0 "The Third Coalition & Imperial Reckoning"
 oe_ngm.8.desc:0 "As the nineteenth century dawns, the Third Coalition rallies every remaining independent court for a decisive trial of arms. Land corps and oceanic battlefleets converge on the grand theater of Eurasia."
 oe_ngm.8.a:0 "Press the Crusade for Eurasian Balance"
 oe_ngm.8.b:0 "Coordinate Oceanic Blockade & Landings"
 oe_ngm.9.title:0 "Climax of the Battle of Nations"
 oe_ngm.9.desc:0 "Half a million troops and a thousand field guns clash under autumn smoke in the grand Battle of Nations. Staff officers await the decisive order: unleash the reserve batteries at the enemy center or snap the enveloping wings shut."
 oe_ngm.9.a:0 "Unleash the Reserve Artillery Batteries"
 oe_ngm.9.b:0 "Close the Enveloping Flanking Wings"
 oe_ngm.10.title:0 "Hegemon Exhaustion & Imperial Overstretch"
 oe_ngm.10.desc:0 "Generations of continental campaigning have bled treasuries, thinned veteran cadres, and strained subject loyalty to the breaking point. Marshals whisper of an honorable regency peace before the empire fractures altogether."
 oe_ngm.10.a:0 "Negotiate an Honorable Regency Settlement"
 oe_ngm.10.b:0 "Defy the Coalition with the Old Guard"
 oe_ngm.11.title:0 "Convocation of the Congress of Vienna"
 oe_ngm.11.desc:0 "After decades of coalition thunder, monarchs, chancellors, and ambassadors assemble at the Congress of Vienna to reconstruct borders, restore dynastic legitimacy, and institutionalize a lasting Eurasian Concert."
 oe_ngm.11.a:0 "Champion the Legitimist Balance of Power"
 oe_ngm.11.b:0 "Secure Commercial & Maritime Indemnities"
 oe_ngm.12.title:0 "Buffer Realms & Neutrality Guarantees"
 oe_ngm.12.desc:0 "Congress committees propose neutralizing contested river deltas, mountain passes, and vital maritime straits under joint Great Power guarantees so no single army can march unchecked across the continent again."
 oe_ngm.12.a:0 "Guarantee the Neutral Buffer Corridors"
 oe_ngm.12.b:0 "Fortify Our Sovereign Border Marches"
 oe_ngm.13.title:0 "The Concert Peace Guarantee"
 oe_ngm.13.desc:0 "Foreign ministers draft a standing Concert Peace Protocol committing Great Powers to convene ambassadorial summits whenever frontier crises threaten to ignite another continental conflagration."
 oe_ngm.13.a:0 "Ratify the Concert Peace Protocol"
 oe_ngm.13.b:0 "Reserve Sovereign Unilateral Discretion"
 oe_ngm.14.title:0 "Balance-of-Power Arbitration Tribunal"
 oe_ngm.14.desc:0 "A sharp commercial and frontier dispute between rival powers has been referred to an international arbitration tribunal of jurists and ambassadors—an unprecedented test of Concert law over cannon fire."
 oe_ngm.14.a:0 "Uphold the Arbitral Award & Jurisprudence"
 oe_ngm.14.b:0 "Stand Firm on Historic Sovereign Claims"
 oe_ngm.15.title:0 "Diplomatic & Industrial Equilibrium"
 oe_ngm.15.desc:0 "Coal-fired foundries, railway surveys, and telegraphed consular codes reshape the late-era balance of power. Statesmen debate whether to anchor imperial primacy on steam-age industrial treaties or a grand diplomatic chancery."
 oe_ngm.15.a:0 "Sponsor Steam-Age Industrial Treaties"
 oe_ngm.15.b:0 "Elevate the Imperial Concert Chancery"
 oe_ngm.16.title:0 "Imperial Swan Song: Twilight of the Early Modern Age"
 oe_ngm.16.desc:0 "As the final years of 1830–1836 approach, five centuries of dynasties, coalitions, maritime charters, and imperial foundries draw toward their grand close. Which enduring legacy shall our empire carry into the modern century?"
 oe_ngm.16.a:0 "Crown Five Centuries of Concert Grandeur"
 oe_ngm.16.b:0 "Kindle the Industrial Century Ahead"
