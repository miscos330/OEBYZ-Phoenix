 oe_scn.14.t: "Project Phoenix 12-Nation Curated Roster: Page 2 of 4 - Steppe, Red Sea & Baltic Crossroads"
 oe_scn.14.d: "#T 04. Golden Horde - Master of the Five Wings of Jochi (GLH | Capital: Sarai al-Jadid)#!\n#W Playstyle:#! Military | #W Proficiency:#! Experienced\nAt the height of Oz Beg Khan's reign, the #W Golden Horde#! surveys the Volga, Crimea, and the Pontic steppe from #W Sarai al-Jadid#!. In Project Phoenix, weather the #T Great Troubles of the Ulus of Jochi#!, balance the #T Five Wings of Jochi#! and #T Kurultai Regency#!, unleash #T Steppe Cavalry Charges#!, and dominate the Silk Road caravanserais from Kaffa and Astrakhan to Samarkand.\n\n#T 05. Mamluk Sultanate - Guardian of the Nile & Red Sea (MAM | Capital: Cairo)#!\n#W Playstyle:#! Military | #W Proficiency:#! Novice\nRuling the fertile Nile, magnificent #W Cairo#!, and the sacred cities of the Levant and Hejaz, the #W Mamluk Sultanate#! commands the richest spice corridor between East and West. In Project Phoenix, drill elite cavalry with #T Furusiyya Lance Drills#!, consecrate #T Giza#!, #T Jerusalem#!, and #T Mecca#!, charter #T Alexandria#! and #T Aden#!, and break oceanic monopolies through the #T Abolish Cartaz#! treaty.\n\n#T 06. Kingdom of Poland - Jagiellonian Commonwealth & Balance (POL | Capital: Krakow)#!\n#W Playstyle:#! Diplomatic | #W Proficiency:#! Novice\nUnder Casimir the Great, the #W Kingdom of Poland#! rebuilds from #W Krakow#!, gazing north to the Baltic and east toward union with Lithuania. In Project Phoenix, forge the #T Polish-Lithuanian Commonwealth#!, experience the bespoke #T Interrex Primate Regency#! and #T Wagenburg Tabor#! formations, charter #T Gdansk#! as a Hanseatic staple port, and champion #T Forced Religious Toleration#! and #T Westphalian Sovereignty#!."
 oe_scn.14.next: "Next Page: Page 3 of 4 (Venice, Jalayirid Persia, Vijayanagara)"
 oe_scn.14.prev: "Previous Page: Page 1 of 4 (Byzantium, Great Yuan, Moscow)"
