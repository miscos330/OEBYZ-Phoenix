# NEW 2026-11-22 v13.5 Worker 4: 12 Curated 1337 Scenarios & Roster (oe_scn_). Generated by gen_v135_scenarios.py; edit the generator, not this file.
 oe_scenario_01_byz: "Byzantine Empire - Phoenix of Constantinople"
 oe_scenario_01_byz_desc: "In 1337 the #W Byzantine Empire#! still guards the crossroads of Eurasia from #W Constantinople#! and bears the unbroken Roman legal heritage. Across Project Phoenix, guide #T Phoenix Restoration#!, rebuild the #T Theme System 2.0#!, command #T Greek-Fire Siphon#! fleets, patronize #T Imperial Codifiers#!, and explore the #T Religio Romana#! revival, the transoceanic #T Fourth Odyssey to Elysia#!, and the late-game #T Concert of Great Powers#!."
 oe_scenario_02_chi: "Great Yuan Celestial Empire - Mandate of Heaven"
 oe_scenario_02_chi_desc: "From #W Dadu#!, the #W Great Yuan Celestial Empire#! commands both the northern steppe and the rich canals and ports of China. In Project Phoenix, steer the #T Celestial Suzerainty#! four-track enfeoffment system, balance Zhizheng restoration against dynastic transition and administrative integration, patronize #T Imperial Kiln Superintendents#! at Fuliang, charter #T Jiangnan Silk Towns#! and #T Shibosi Maritime Wards#!, and enforce #T Celestial Investiture#! treaties."
 oe_scenario_03_mos: "Grand Principality of Moscow - Dawn of the Third Rome"
 oe_scenario_03_mos_desc: "Rising from the Russian forests, the #W Grand Principality of Moscow#! prepares to break the Tatar Yoke and gather the Rus lands. In Project Phoenix, navigate the #T Boyar Duma Regency#!, grant the #T Novgorod Fur Guild Charter#!, fortify with #T Wagenburg Tabor#! camps, welcome master iconographers, and crown your ascent to the #T Third Rome#! with the #T Kuchuk Kaynarca Straits#! and #T Nerchinsk Border#! treaties."
 oe_scenario_04_glh: "Golden Horde - Master of the Five Wings of Jochi"
 oe_scenario_04_glh_desc: "At the height of Oz Beg Khan's reign, the #W Golden Horde#! surveys the Volga, Crimea, and the Pontic steppe from #W Sarai al-Jadid#!. In Project Phoenix, weather the #T Great Troubles of the Ulus of Jochi#!, balance the #T Five Wings of Jochi#! and #T Kurultai Regency#!, unleash #T Steppe Cavalry Charges#!, and dominate the Silk Road caravanserais from Kaffa and Astrakhan to Samarkand."
 oe_scenario_05_mam: "Mamluk Sultanate - Guardian of the Nile & Red Sea"
 oe_scenario_05_mam_desc: "Ruling the fertile Nile, magnificent #W Cairo#!, and the sacred cities of the Levant and Hejaz, the #W Mamluk Sultanate#! commands the richest spice corridor between East and West. In Project Phoenix, drill elite cavalry with #T Furusiyya Lance Drills#!, consecrate #T Giza#!, #T Jerusalem#!, and #T Mecca#!, charter #T Alexandria#! and #T Aden#!, and break oceanic monopolies through the #T Abolish Cartaz#! treaty."
 oe_scenario_06_pol: "Kingdom of Poland - Jagiellonian Commonwealth & Balance"
 oe_scenario_06_pol_desc: "Under Casimir the Great, the #W Kingdom of Poland#! rebuilds from #W Krakow#!, gazing north to the Baltic and east toward union with Lithuania. In Project Phoenix, forge the #T Polish-Lithuanian Commonwealth#!, experience the bespoke #T Interrex Primate Regency#! and #T Wagenburg Tabor#! formations, charter #T Gdansk#! as a Hanseatic staple port, and champion #T Forced Religious Toleration#! and #T Westphalian Sovereignty#!."
 oe_scenario_07_ven: "Most Serene Republic of Venice - Queen of the Adriatic"
 oe_scenario_07_ven_desc: "From its fortified lagoon, the #W Most Serene Republic of Venice#! rules the Adriatic and links Europe to Levantine spices and silks. In Project Phoenix, command the bespoke #T Council of Ten Emergency Regency#!, unleash #T Galeazza Broadside#! war-galleys, enact the #T Venetian Fondaco Charter#!, patronize #T Murano Horologists & Opticians#!, and reshape Mediterranean sea law with #T Mare Liberum#! and #T Overseas Factory Concessions#!."
 oe_scenario_08_jal: "Jalayirid Persia - Heirs of Baghdad & Ilkhanid Splendor"
 oe_scenario_08_jal_desc: "As the Ilkhanate fractures, the #W Jalayirid Sultanate#! anchors #W Baghdad#! and Mesopotamia as the flagship protagonist of the #T Persian Theater#! in Project Phoenix. Unify Iran, harness the #T Persian Atabeg Regency#!, consecrate the #T Great Mosque of Samarra#!, grant the #T Persian Grand Bazaar#! and #T Hormuz Strait#! charters, and patronize #T Persian Miniaturist#! masters Behzad and Reza Abbasi."
 oe_scenario_09_vij: "Vijayanagara Empire - City of Victory in the Deccan"
 oe_scenario_09_vij_desc: "Newly founded upon the Tungabhadra, the #W Vijayanagara Empire#! rises to unite the Deccan and command the spice-rich Malabar Coast. In Project Phoenix, lead the #T Indian Theater#!, consecrate #T Srirangam#! and #T Sanchi#!, patronize #T Imperial Atelier Naturalists#!, charter the #T Calicut Monsoon Emporium#!, and shatter oceanic blockades with the #T Abolish Cartaz#! treaty."
 oe_scenario_10_jap: "Muromachi Japan - Four Shinto Schools & Sengoku Mastery"
 oe_scenario_10_jap_desc: "Centered on #W Kyoto#!, #W Muromachi Japan#! navigates courtly diplomacy, shogunal authority, and East Asian maritime trade. In Project Phoenix, engage all four native #T Shinto Factions#! (Yoshida, Watarai, Suika, and Ryobu), trigger the #T Shogunate Tairo Regency#!, command #T Sandan-Uchi Volley#! musketeers, grant the #T Sakai Egoshu Council#! charter, and patronize #T Suiboku & Fusuma Masters#! Sesshu and Kano Eitoku."
 oe_scenario_11_eth: "Solomonic Ethiopia - Highland Covenant & Lion of Judah"
 oe_scenario_11_eth_desc: "Enthroned on the Abyssinian highlands under Emperor Amda Seyon, #W Solomonic Ethiopia#! stands as the premier protagonist of the #T Africa Three Axes#! in Project Phoenix. Lead Zara Yaqob's #T Tewahedo Church reforms#!, govern through the #T Patriarch & Senate Regency#!, forge the #T Prester John Red Sea Accord#! with Constantinople and Lisbon, and project highland power to Aden and Kilwa."
 oe_scenario_12_tnc: "Tenochtitlan - Floating Gardens & New World Sovereignty"
 oe_scenario_12_tnc_desc: "Newly raised upon Lake Texcoco under Tenoch, #W Tenochtitlan#! stands on the threshold of forging the Mexica Triple Alliance. In Project Phoenix, spearhead the #T Americas Indigenous Epics#!, build the #T Chinampa Agronomy Complex#!, grant the #T Lake Chinampa Charter#!, consecrate #T Teotihuacan#! and #T Cholula#! with zero DLC dependency, and defend New World sovereignty against Europe and Elysia."
