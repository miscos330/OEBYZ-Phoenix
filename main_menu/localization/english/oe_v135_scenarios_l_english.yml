 oe_scn.15.t: "Project Phoenix 12-Nation Curated Roster: Page 3 of 4 - Maritime Republic, Persia & Deccan"
 oe_scn.15.d: "#T 07. Most Serene Republic of Venice - Queen of the Adriatic (VEN | Capital: Venice)#!\n#W Playstyle:#! Diplomatic | #W Proficiency:#! Experienced\nFrom its fortified lagoon, the #W Most Serene Republic of Venice#! rules the Adriatic and links Europe to Levantine spices and silks. In Project Phoenix, command the bespoke #T Council of Ten Emergency Regency#!, unleash #T Galeazza Broadside#! war-galleys, enact the #T Venetian Fondaco Charter#!, patronize #T Murano Horologists & Opticians#!, and reshape Mediterranean sea law with #T Mare Liberum#! and #T Overseas Factory Concessions#!.\n\n#T 08. Jalayirid Persia - Heirs of Baghdad & Ilkhanid Splendor (JAL | Capital: Baghdad)#!\n#W Playstyle:#! Military | #W Proficiency:#! Experienced\nAs the Ilkhanate fractures, the #W Jalayirid Sultanate#! anchors #W Baghdad#! and Mesopotamia as the flagship protagonist of the #T Persian Theater#! in Project Phoenix. Unify Iran, harness the #T Persian Atabeg Regency#!, consecrate the #T Great Mosque of Samarra#!, grant the #T Persian Grand Bazaar#! and #T Hormuz Strait#! charters, and patronize #T Persian Miniaturist#! masters Behzad and Reza Abbasi.\n\n#T 09. Vijayanagara Empire - City of Victory in the Deccan (VIJ | Capital: Vijayanagar)#!\n#W Playstyle:#! Military | #W Proficiency:#! Novice\nNewly founded upon the Tungabhadra, the #W Vijayanagara Empire#! rises to unite the Deccan and command the spice-rich Malabar Coast. In Project Phoenix, lead the #T Indian Theater#!, consecrate #T Srirangam#! and #T Sanchi#!, patronize #T Imperial Atelier Naturalists#!, charter the #T Calicut Monsoon Emporium#!, and shatter oceanic blockades with the #T Abolish Cartaz#! treaty."
 oe_scn.15.next: "Next Page: Page 4 of 4 (Japan, Ethiopia, Tenochtitlan)"
