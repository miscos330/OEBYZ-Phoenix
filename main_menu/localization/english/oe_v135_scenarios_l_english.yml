 oe_scn_view_12_roster.title: "Browse the Project Phoenix 12-Nation Curated Roster"
 oe_scn_view_12_roster.desc: "Open the four-page Project Phoenix 1337 Curated Roster to inspect playstyles, proficiency ratings, and full signature content roadmaps for Byzantium, Great Yuan, Moscow, Golden Horde, Mamluks, Poland, Venice, Jalayirid Persia, Vijayanagara, Muromachi Japan, Solomonic Ethiopia, and Tenochtitlan (zero-cost reference compendium)."
 oe_scn_view_12_roster.a: "Open the 12-Nation Curated Roster (4-Page Interactive Compendium)"
 oe_scn_view_12_roster_tt: "Opens the #T Project Phoenix 12-Nation Curated Roster#! (4 navigable pages covering all 12 curated 1337 starts at zero cost)."
 oe_scn_briefing_ack_tt: "Dismiss this opening briefing (you may revisit all 12 curated roadmaps at any time via the #W Browse the Project Phoenix 12-Nation Curated Roster#! government decision)."
 oe_scn_open_roster_tt: "Immediately opens the four-page #T Project Phoenix 12-Nation Curated Roster#! showcasing all 12 curated starts across four continents."
 oe_scn.1.t: "Curated Campaign Briefing: Byzantine Empire (Constantinople)"
 oe_scn.1.d: "#T Curated Protagonist No.01 | Byzantine Empire (BYZ) | Capital: Constantinople#!\n#W Playstyle:#! Administrative | #W Proficiency:#! Advanced\n\nIn 1337 the Palaiologan Empire stands encircled by Anatolian Beyliks, Balkan rivals, and Italian maritime republics, yet still holds the Theodosian Walls, the Roman legal legacy, and the Straits. Constantine Harmenopoulos is poised to compile the Hexabiblos in Thessaloniki while Palaeologan frescoes illuminate the Aegean world.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Imperial Renewal & Governance:#! Survive the 1341 and 1352 civil wars, rebuild Theme System 2.0 and the Praetorian Prefectures, and master Imperial Entropy toward Pax Imperialis.\n- #W Masters, Warfare & Charters:#! Patronize Imperial Codifiers, unleash Greek-Fire Siphon galleys, and charter Pontic-Aegean entrepots.\n- #W Alternate Destinies & Diplomacy:#! Choose Ecumenical Orthodoxy or Religio Romana, launch the Fourth Odyssey to Elysia, and shape the Concert of Great Powers with historic peace treaties."
 oe_scn.1.a: "Accept the Imperial Eagle and begin the Byzantine campaign"
 oe_scn.1.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.2.t: "Curated Campaign Briefing: Great Yuan Celestial Empire (Dadu)"
 oe_scn.2.d: "#T Curated Protagonist No.02 | Great Yuan Celestial Empire (CHI) | Capital: Dadu#!\n#W Playstyle:#! Administrative | #W Proficiency:#! Experienced\n\nIn 1337 Emperor Toghon Temur presides in Dadu over an empire stretching from the Mongolian steppe to the silk looms of Jiangnan and the maritime emporia of Quanzhou. Whether you achieve a Great Yuan Restoration or forge a new Celestial dynasty, every reform echoes across Eurasia.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Celestial Order & Regencies:#! Command the four-track enfeoffment, tusi integration, and Grand Duhu overseas administration alongside Dowager, Kurultai, and Grand Council regencies.\n- #W Imperial Kilns & Heritage:#! Award Fuliang Imperial Kiln, Jiangnan Silk, and Shibosi Maritime charters; patronize kiln masters and literati polymaths; consecrate Qufu and Leshan.\n- #W Grand Diplomacy:#! Enforce Celestial Investiture, Nerchinsk Border Trade, and Silk Road Caravan Immunity in decisive peace settlements."
 oe_scn.2.a: "Uphold the Mandate and guide the Celestial Empire"
 oe_scn.2.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.3.t: "Curated Campaign Briefing: Grand Principality of Moscow (Moscow)"
 oe_scn.3.d: "#T Curated Protagonist No.03 | Grand Principality of Moscow (MOS) | Capital: Moscow#!\n#W Playstyle:#! Military | #W Proficiency:#! Novice\n\nIn 1337 Grand Prince Ivan Kalita harnesses prudent finance and ecclesiastical prestige to make Moscow the rising heart of the Rus principalities. To the north lie the fur markets of Novgorod; to the south stands the Golden Horde and the road to the Black Sea.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Breaking the Yoke & Third Rome:#! Overthrow Tatar tributary dominance, unify the Rus, and steer the Boyar Duma toward Tsardom and Orthodox primacy.\n- #W Tactical Warfare & Trade:#! Deploy Wagenburg Tabor defensive camps, evolve Streltsy into New Order Regiments, and grant the Northern Fur Guild Charter.\n- #W Eurasian Treaties:#! Patronize Theophanes the Greek and secure Kuchuk Kaynarca Straits Access, Nerchinsk Border Trade, and Perpetual Peace."
 oe_scn.3.a: "Gather the Rus and march toward the Third Rome"
 oe_scn.3.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.4.t: "Curated Campaign Briefing: Golden Horde (Sarai al-Jadid)"
 oe_scn.4.d: "#T Curated Protagonist No.04 | Golden Horde (GLH) | Capital: Sarai al-Jadid#!\n#W Playstyle:#! Military | #W Proficiency:#! Experienced\n\nIn 1337 the Ulus of Jochi rules from opulent Sarai al-Jadid over Rus tributaries, Crimean trade ports, and the northern Silk Road corridors. Beneath this splendor, dynastic rivalries threaten fragmentation unless a bold Khan binds the steppe wings together.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Steppe Cohesion & Crisis:#! Navigate the Troubles of the Golden Horde, master Horde Cohesion across the Five Wings of Jochi, and steady the realm through the Kurultai Regency.\n- #W Steppe Warfare & Silk Charters:#! Unleash devastating cavalry charges and award Samarkand, Kashgar, Astrakhan, and Pontic entrepot charters.\n- #W Eurasian Leverage:#! Impose Silk Road Caravan Immunity, Silver Indemnity Schedules, and Hegemony Dismantlement on rival empires."
 oe_scn.4.a: "Raise the white banner and command the Kipchak Steppe"
 oe_scn.4.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.5.t: "Curated Campaign Briefing: Mamluk Sultanate (Cairo)"
 oe_scn.5.d: "#T Curated Protagonist No.05 | Mamluk Sultanate (MAM) | Capital: Cairo#!\n#W Playstyle:#! Military | #W Proficiency:#! Novice\n\nIn 1337 Sultan al-Nasir Muhammad presides over Cairo at its golden zenith, linking Indian Ocean spice convoys to Mediterranean galleys while standing sentry over Syria and the Hejaz.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Furusiyya Chivalry & Red Sea Struggle:#! Hone elite heavy cavalry through Furusiyya Lance Drills and contest the Red Sea and Indian Ocean maritime corridors.\n- #W Great Monuments & Strait Charters:#! Consecrate Giza, Mecca, and Jerusalem with zero DLC dependency, and charter Alexandria and Aden as premier entrepots.\n- #W Anti-Monopoly Diplomacy:#! Break foreign maritime blockades via Abolish Cartaz Monopoly, Free Straits Access, and Revoke Privateer Letters."
 oe_scn.5.a: "Raise the Sultan's standard over the Nile and Red Sea"
 oe_scn.5.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.6.t: "Curated Campaign Briefing: Kingdom of Poland (Krakow)"
 oe_scn.6.d: "#T Curated Protagonist No.06 | Kingdom of Poland (POL) | Capital: Krakow#!\n#W Playstyle:#! Diplomatic | #W Proficiency:#! Novice\n\nIn 1337 King Casimir III transforms Poland through stone fortresses, legal codification, and trade corridors between the Teutonic Baltic, the Empire, Hungary, and Lithuania.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Commonwealth & Interrex:#! Forge the Polish-Lithuanian union and experience Poland's historical Primate Interrex Regency during royal vacancies.\n- #W Tabor Tactics & Baltic Trade:#! Fortify armies with Wagenburg Tabor camps and grant Gdansk the Hanseatic Staple Kontor charter.\n- #W Equilibrium Diplomacy:#! Lead Central Europe with Forced Religious Toleration, Perpetual Peace, Westphalian Sovereignty, and Frontier Demilitarization."
 oe_scn.6.a: "Raise the White Eagle and lead the Kingdom of Poland"
 oe_scn.6.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.7.t: "Curated Campaign Briefing: Most Serene Republic of Venice (Venice)"
 oe_scn.7.d: "#T Curated Protagonist No.07 | Most Serene Republic of Venice (VEN) | Capital: Venice#!\n#W Playstyle:#! Diplomatic | #W Proficiency:#! Experienced\n\nIn 1337 the Winged Lion of Saint Mark patrols the Adriatic, Crete, and the Levantine convoy lanes while Murano's glassmakers kindle the optical arts of the Renaissance.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Republican Statecraft:#! Trigger the bespoke Council of Ten Emergency Regency during leadership crises to safeguard republican stability and maritime power.\n- #W Murano Masters & Fondaco:#! Recruit Murano Horologists and Grand Cartographers, commission St. Mark's Astronomical Clock, and grant the Venetian Fondaco charter.\n- #W Naval Supremacy & Treaties:#! Deploy Galeazza Broadsides and extract Mare Liberum Opening, Factory Concessions, and Restitution of Masterpieces."
 oe_scn.7.a: "Hoist the Lion of Saint Mark and sail from the Lagoon"
 oe_scn.7.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.8.t: "Curated Campaign Briefing: Jalayirid Persia (Baghdad)"
 oe_scn.8.d: "#T Curated Protagonist No.08 | Jalayirid Persia (JAL) | Capital: Baghdad#!\n#W Playstyle:#! Military | #W Proficiency:#! Experienced\n\nIn 1337 Hasan Buzurg establishes Jalayirid rule over Baghdad and Mesopotamia, standing at the pivot between Tabriz, Herat, Hormuz, and the Levant before Timur has even risen.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Persian Unification & Atabegs:#! Contest Tabriz, Isfahan, and Herat under the Persian Atabeg Regency and Furusiyya cavalry drills.\n- #W Miniaturist Renaissance & Charters:#! Patronize Persian Miniaturists for Behzad and Reza Abbasi masterworks, consecrate Samarra, and grant Grand Bazaar and Hormuz charters.\n- #W Silk Road Treaties:#! Secure Silk Road Caravan Immunity, Manuscript Tribute, and Restitution of Masterpieces across the Middle East."
 oe_scn.8.a: "Ride forth from Baghdad and forge a new Persian Empire"
 oe_scn.8.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.9.t: "Curated Campaign Briefing: Vijayanagara Empire (Vijayanagar)"
 oe_scn.9.d: "#T Curated Protagonist No.09 | Vijayanagara Empire (VIJ) | Capital: Vijayanagar#!\n#W Playstyle:#! Military | #W Proficiency:#! Novice\n\nIn 1337 the Sangama brothers have just raised the City of Victory along the Tungabhadra, poised between the temples of Tamil Nadu, the pepper ports of Malabar, and the contest for the Deccan.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Deccan Mastery:#! Unite southern India, fortify the Malabar and Coromandel coasts, and bid for supremacy across the subcontinent.\n- #W Sacred Sites & Naturalists:#! Consecrate Srirangam, Sanchi, and Bodh Gaya with zero DLC dependency, and recruit Imperial Atelier Naturalists.\n- #W Monsoon Free Ports:#! Charter Calicut, Goa, and Malacca while defeating maritime cartels via Abolish Cartaz and Mare Liberum."
 oe_scn.9.a: "Defend the City of Victory and master the Monsoon Seas"
 oe_scn.9.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.10.t: "Curated Campaign Briefing: Muromachi Japan (Kyoto)"
 oe_scn.10.d: "#T Curated Protagonist No.10 | Muromachi Japan (JAP) | Capital: Kyoto#!\n#W Playstyle:#! Diplomatic | #W Proficiency:#! Experienced\n\nIn 1337 Kyoto stands at the dawn of the Muromachi Shogunate, balancing imperial courtiers, proud samurai domains, monastic centers, and lucrative maritime routes across the East China Sea.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Four Shinto Factions & Tairo Regency:#! Command Yoshida, Watarai, Suika, and Ryobu Shinto factions with 10 bespoke actions, plus the Shogunate Tairo Regency.\n- #W Sandan-Uchi & Sakai Autonomy:#! Drill Sandan-Uchi rolling volley musketry, grant the Sakai Egoshu Council charter, and consecrate Enryaku-ji on Mount Hiei.\n- #W Golden Screens & Sea Trade:#! Patronize Sesshu Toyo and Kano Eitoku for painted fusuma masterworks and shape East Asian sea law."
 oe_scn.10.a: "Unite Kyoto and shape the destiny of Muromachi Japan"
 oe_scn.10.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.11.t: "Curated Campaign Briefing: Solomonic Ethiopia (Ankober)"
 oe_scn.11.d: "#T Curated Protagonist No.11 | Solomonic Ethiopia (ETH) | Capital: Ankober#!\n#W Playstyle:#! Administrative | #W Proficiency:#! Experienced\n\nIn 1337 the Solomonic Empire commands the Abyssinian plateau with unyielding faith, overlooking the Red Sea straits, the Nile corridor, and the Swahili gold coast.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Africa Three Axes & Tewahedo Renewal:#! Convene the Council of Zara Yaqob, establish the Ewostathian school, and draw upon the Patriarch & Senate Regency.\n- #W Prester John & Red Sea Corridor:#! Link Aksum with Constantinople and Lisbon in cross-civilization diplomacy while chartering Aden and Kilwa.\n- #W Continental Synthesis:#! Enforce Forced Religious Toleration, Abolish Cartaz, and Manuscript Tribute to secure Ethiopia's place among world empires."
 oe_scn.11.a: "Uphold the Solomonic Covenant and roar across the Red Sea"
 oe_scn.11.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.12.t: "Curated Campaign Briefing: Tenochtitlan (Tenochtitlan)"
 oe_scn.12.d: "#T Curated Protagonist No.12 | Tenochtitlan (TNC) | Capital: Tenochtitlan#!\n#W Playstyle:#! Military | #W Proficiency:#! Advanced\n\nIn 1337 the island city of Tenochtitlan is scarcely twelve years old, yet its fertile chinampas, stone causeways, and eagle-and-jaguar warriors are destined to command the Valley of Mexico.\n\n#T Project Phoenix Signature Arcs:#!\n- #W Chinampa Metropolis:#! Unite the Valley of Mexico, construct the Chinampa Agronomy Complex, and enact the Tenochtitlan Lake Charter for booming prosperity.\n- #W Zero-DLC Sacred Reform:#! Reclaim and consecrate Teotihuacan and Cholula to modernize Mesoamerican statecraft before overseas fleets arrive.\n- #W New World Sovereignty:#! Stand shoulder-to-shoulder with Andean and Longhouse peers against European empires and Elysia, enforcing Hegemony Dismantlement and Restitution of Masterpieces."
 oe_scn.12.a: "Follow the Eagle and Serpent and build the Mexica Empire"
 oe_scn.12.b: "Also browse the Project Phoenix 12-Nation Curated Roster (Page 1 of 4)"
 oe_scn.13.t: "Project Phoenix 12-Nation Curated Roster: Page 1 of 4 - Imperial Pillars of Eurasia"
 oe_scn.13.d: "#T 01. Byzantine Empire - Phoenix of Constantinople (BYZ | Capital: Constantinople)#!\n#W Playstyle:#! Administrative | #W Proficiency:#! Advanced\nIn 1337 the #W Byzantine Empire#! still guards the crossroads of Eurasia from #W Constantinople#! and bears the unbroken Roman legal heritage. Across Project Phoenix, guide #T Phoenix Restoration#!, rebuild the #T Theme System 2.0#!, command #T Greek-Fire Siphon#! fleets, patronize #T Imperial Codifiers#!, and explore the #T Religio Romana#! revival, the transoceanic #T Fourth Odyssey to Elysia#!, and the late-game #T Concert of Great Powers#!.\n\n#T 02. Great Yuan Celestial Empire - Mandate of Heaven (CHI | Capital: Dadu)#!\n#W Playstyle:#! Administrative | #W Proficiency:#! Experienced\nFrom #W Dadu#!, the #W Great Yuan Celestial Empire#! commands both the northern steppe and the rich canals and ports of China. In Project Phoenix, steer the #T Celestial Suzerainty#! four-track enfeoffment system, balance Zhizheng restoration against dynastic transition and administrative integration, patronize #T Imperial Kiln Superintendents#! at Fuliang, charter #T Jiangnan Silk Towns#! and #T Shibosi Maritime Wards#!, and enforce #T Celestial Investiture#! treaties.\n\n#T 03. Grand Principality of Moscow - Dawn of the Third Rome (MOS | Capital: Moscow)#!\n#W Playstyle:#! Military | #W Proficiency:#! Novice\nRising from the Russian forests, the #W Grand Principality of Moscow#! prepares to break the Tatar Yoke and gather the Rus lands. In Project Phoenix, navigate the #T Boyar Duma Regency#!, grant the #T Novgorod Fur Guild Charter#!, fortify with #T Wagenburg Tabor#! camps, welcome master iconographers, and crown your ascent to the #T Third Rome#! with the #T Kuchuk Kaynarca Straits#! and #T Nerchinsk Border#! treaties."
 oe_scn.13.next: "Next Page: Page 2 of 4 (Golden Horde, Mamluks, Poland)"
 oe_scn.13.prev: "Jump to Final Page: Page 4 of 4 (Japan, Ethiopia, Tenochtitlan)"
