 oe_scn.16.t: "Project Phoenix 12-Nation Curated Roster: Page 4 of 4 - Shogunate, Highlands & New World"
 oe_scn.16.d: "#T 10. Muromachi Japan - Four Shinto Schools & Sengoku Mastery (JAP | Capital: Kyoto)#!\n#W Playstyle:#! Diplomatic | #W Proficiency:#! Experienced\nCentered on #W Kyoto#!, #W Muromachi Japan#! navigates courtly diplomacy, shogunal authority, and East Asian maritime trade. In Project Phoenix, engage all four native #T Shinto Factions#! (Yoshida, Watarai, Suika, and Ryobu), trigger the #T Shogunate Tairo Regency#!, command #T Sandan-Uchi Volley#! musketeers, grant the #T Sakai Egoshu Council#! charter, and patronize #T Suiboku & Fusuma Masters#! Sesshu and Kano Eitoku.\n\n#T 11. Solomonic Ethiopia - Highland Covenant & Lion of Judah (ETH | Capital: Ankober)#!\n#W Playstyle:#! Administrative | #W Proficiency:#! Experienced\nEnthroned on the Abyssinian highlands under Emperor Amda Seyon, #W Solomonic Ethiopia#! stands as the premier protagonist of the #T Africa Three Axes#! in Project Phoenix. Lead Zara Yaqob's #T Tewahedo Church reforms#!, govern through the #T Patriarch & Senate Regency#!, forge the #T Prester John Red Sea Accord#! with Constantinople and Lisbon, and project highland power to Aden and Kilwa.\n\n#T 12. Tenochtitlan - Floating Gardens & New World Sovereignty (TNC | Capital: Tenochtitlan)#!\n#W Playstyle:#! Military | #W Proficiency:#! Advanced\nNewly raised upon Lake Texcoco under Tenoch, #W Tenochtitlan#! stands on the threshold of forging the Mexica Triple Alliance. In Project Phoenix, spearhead the #T Americas Indigenous Epics#!, build the #T Chinampa Agronomy Complex#!, grant the #T Lake Chinampa Charter#!, consecrate #T Teotihuacan#! and #T Cholula#! with zero DLC dependency, and defend New World sovereignty against Europe and Elysia."
