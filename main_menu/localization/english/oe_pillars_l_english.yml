l_english:
 oe_pillars_noble: "Noble Houses"
 oe_pillars_noble_desc: "The founding Kantakouzenos, Apokaukos and Synadenos houses."
 oe_pillars_subject: "Subject Realms"
 oe_pillars_subject_desc: "Territorial subject countries; military districts retain their district status."
 oe_pillars_authority: "Authority"
 oe_pillars_authority_desc: "Imperial authority ranges from 0 to 100, starting at 25. It decays by 0.2 each month. Invest up to 100% of recurring privy-purse income for up to 0.5 authority per month."
 oe_pillars_public_opinion: "Public Opinion"
 oe_pillars_public_opinion_desc: "Public approval, from 0 to 100, starting at 27. Monthly drift is (50 minus current opinion) divided by 100, moving up to 0.5 toward 50.\n\n#Y Public Opinion and Imperial Order#!\nApplies to Byzantium. At 50 opinion all effects are zero. At 0: monthly peasant rebel growth +0.1 percentage points, peasant satisfaction equilibrium -20%, stability base cost +50%. At 100: rebel growth -0.1 points, satisfaction equilibrium +20%, stability base cost -50%. Intermediate values vary continuously. Stability costs use the native efficiency calculation and stack with other efficiency modifiers."
 OE_PILLARS_AUTHORITY_VALUE: "$VAL|1$"
 OE_PILLARS_OPINION_VALUE: "$VAL|1$"
 OE_PILLARS_PRIVY_PURSE: "Privy Purse"
 OE_PILLARS_PRIVY_PURSE_HINT: "The court's private wealth"
 OE_PILLARS_AUTHORITY_HINT: "Monthly decay: 0.2"
 oe_byz_empire_org_action_create_pronia_infastry: "Muster the Pronoiars"
 oe_byz_empire_org_action_create_pronia_infastry_desc: "Call the soldiers supported by local pronoia grants to arms. The affected locations cannot provide levies again for three years."
# PAUSED:  oe_byz_roman_world_estate_tax: "Bureaucratic Diversion"
# PAUSED:  oe_byz_roman_world_estate_tax_desc: "Officials divert a corruption-dependent share of the four imperial estates' taxable income into the bureaucratic estate's account."
 OE_PILLARS_PURSE_DESC: "The #Y Privy Purse#! receives two recurring shares of imperial elite income: #Y 15%#! of noble estate income and #Y 5%#! of clergy estate income held by senior clergy. Authority draws on this purse; court and theme spending draw on the #Y state treasury#!."
 OE_PILLARS_COUNCIL: "Imperial Council"
 OE_PILLARS_LAWS: "Imperial Laws"
 OE_PILLARS_MEMBERS: "Pillars of the Realm"
 OE_PILLARS_MEMBERS_DESC: "The throne, noble houses, military themes, Imperial Bank and territorial subjects each hold their appointed place."
 OE_PILLARS_FOUNDATION: "THE THRONE AND ITS PILLARS"
 OE_PILLARS_OVERVIEW_DESC: "The throne rests upon noble houses, military themes and subject rulers. Bind them through the #Y Privy Purse#!, uphold imperial #Y Authority#! and heed #Y Public Opinion#!. Orders, finances and laws each have their own place in this council."
 oe_pillars_opinion_wrath: "Universal Wrath"
 oe_pillars_opinion_rumours: "Rumours Abound"
 oe_pillars_opinion_indifferent: "Public Indifference"
 oe_pillars_opinion_favoured: "Popular Approval"
 oe_pillars_opinion_united: "Universal Acclaim"
 OE_PILLARS_OPINION_BANDS: "0–<20: Universal Wrath\n20–<40: Rumours Abound\n40–<60: Public Indifference\n60–<80: Popular Approval\n80–100: Universal Acclaim\n\n#Y Public Opinion and Imperial Order#!\nApplies to Byzantium. At 50 opinion all effects are zero. At 0: monthly peasant rebel growth +0.1 percentage points, peasant satisfaction equilibrium -20%, stability base cost +50%. At 100: rebel growth -0.1 points, satisfaction equilibrium +20%, stability base cost -50%. Intermediate values vary continuously. Stability costs use the native efficiency calculation and stack with other efficiency modifiers."
# PAUSED:  oe_pillars_corruption: "Corruption"
# PAUSED:  oe_pillars_corruption_desc: "Corruption ranges from 0 to 100; lower is cleaner. Live conversion of the existing corruption/integrity societal value: 50 minus half that value. Existing bureaucratic diversion uses the same source."
# PAUSED:  OE_PILLARS_CORRUPTION_HINT: "Lower is cleaner"
 oe_pillars_nobles_contribution: "Court Magnates’ Income"
 oe_pillars_nobles_contribution_desc: "The #Y 10%#! share of noble estate income held by the court elite is recorded in the Privy Purse each month."
 oe_pillars_clergy_contribution: "Patriarchal Income"
 oe_pillars_clergy_contribution_desc: "The #Y 5%#! share of clergy estate income controlled by senior clergy is recorded as patriarchal income in the Privy Purse."
# PAUSED:  oe_pillars_houses_contribution: "Household Heads’ Income"
# PAUSED:  oe_pillars_houses_contribution_desc: "Household heads allocate #Y 25%#! of their houses’ current monthly income to the Privy Purse. Accumulated savings are excluded."
 OE_PILLARS_TRANSFERS: "Finances"
 OE_PILLARS_TRANSFERS_DESC: "The private income shares of court magnates and senior clergy form the #Y Privy Purse#!. Court and theme expenses draw on the #Y state treasury#!; authority funding draws on the purse."
 OE_PILLARS_OPEN_LAWS: "Imperial laws: military administration, the imperial code, citizenship, and land taxation. Changing any policy costs three months of Privy Purse income."
 OE_PILLARS_PURSE_INCOME: "Monthly purse revenue: [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_purse_monthly_income')|2]@gold!"
 oe_pillars_authority_budget: "Sustain Imperial Authority"
 oe_pillars_authority_budget_desc: "Byzantium can spend 0-100% of recurring monthly purse revenue for 0-0.5 authority. Natural decay is separately fixed at 0.2 per month. Benefits scale with actual payment; expenditure never exceeds reserves. Zero reserves or zero revenue grant no funded benefit. One-off gifts are not recurring income."
 OE_PILLARS_AUTHORITY_PREVIEW: "Spend [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_authority_available_spend')|2]@gold! / month; net authority [GuiScope.SetRoot(InternationalOrganizationsView.GetInternationalOrganization.MakeScope).ScriptValue('oe_pillars_authority_net_change')|2]"
 OE_PILLARS_AUTHORITY_BUDGET_HINT: "Full monthly revenue grants +0.5; natural decay is -0.2.\nBenefits scale with actual funding. No revenue means no investment."
 OE_PILLARS_NATIVE_COURT_HINT: "Original court spending, paid from the Byzantine national treasury with native costs and benefits; separate from the privy purse."
 OE_PILLARS_EDICTS: "Edicts"
 OE_PILLARS_EDICTS_DESC: "Military, fiscal and civil orders are grouped below. Hover over an order for its conditions and effects."
