 oe_ind2.1.title: "A Regional Industry Fostered"
 oe_ind2.1.desc: "For the first time, the throne has issued a formal charter to cultivate a targeted regional industry. Backed by state credit and improved transport links, new workshops are opening in rapid succession and drawing skilled artisans, while provincial magistrates find their careers judged by tangible industrial output."
 oe_ind2.1.a: "Judge the officials by results"
 oe_ind2.2.title: "The Silk Guilds Fight over Raw Silk"
 oe_ind2.2.desc: "Surging silk prices have turned the seasonal cocoon markets into a bitter battleground. Local weaving guilds and well-funded foreign merchants are aggressively outbidding one another for raw bales, carrying their dispute all the way to the magistrate's hall to decide whether domestic looms take priority or the highest coin rules."
 oe_ind2.2.a: "Our own weavers first"
 oe_ind2.2.b: "Let the highest bidder have it"
 oe_ind2.3.title: "Arsenals First, and the Townsfolk Complain"
 oe_ind2.3.desc: "To feed the insatiable demands of the front, state agents have conscripted waves of skilled hands and labourers into the royal arsenals. Ordinary town workshops, bakeries, and craft yards stand half-empty for want of workers, stirring loud resentment among burghers who beg the court to spare some labour for civic life."
 oe_ind2.3.a: "The front comes first"
 oe_ind2.3.b: "Leave some hands for the town"
 oe_ind2.4.title: "The Shipwrights Ask for Hereditary Places"
 oe_ind2.4.desc: "Master shipwrights of the royal yards have petitioned the throne to make their posts hereditary for their sons. They argue that the secrets of hull curvature, watertight joinery, and rigging balance survive only through lifelong family apprenticeship, though reformist officials counter that places must stay open to merit alone."
 oe_ind2.4.a: "Grant it"
 oe_ind2.4.b: "Places go to the able"
 oe_ind2.5.title: "Assigned Labour Stirs Resentment"
 oe_ind2.5.desc: "Peasants drafted into state mines, smelters, and public construction works endure gruelling quotas far from their fields, leaving families destitute and tempers raw. Desertions are mounting and local officials warn the court that without tax relief or lighter levies, simmering bitterness may soon boil into open unrest."
 oe_ind2.5.a: "Lighten their dues"
 oe_ind2.5.b: "Carry on as ordered"
 oe_ind2.6.title: "A Great Order Paid in Silver"
 oe_ind2.6.desc: "Wealthy merchants from distant seas have arrived at our wharves with an extraordinary bulk order for fine porcelain, glossy lacquerware, and prime tea, settling every invoice in heavy chests of pure silver. Kilns, tea estates, and workshops across the provinces stand eager to seize this windfall."
 oe_ind2.6.a: "Take the order"
 oe_ind2.7.title: "Cottons and Spices in Demand"
 oe_ind2.7.desc: "Our vibrant printed cottons and prized spices have captured the taste of markets far beyond our borders, commanding brisk sales at every port. While silver pours into domestic merchant houses, rival weavers in distant realms groan under the relentless competition, urging us to press our commercial edge."
 oe_ind2.7.a: "Press the advantage"
 oe_ind2.8.title: "A Golden Age of Industry"
 oe_ind2.8.desc: "Years of patient investment have brought royal manufactories, specialized provincial workshops, and disciplined labour charters into seamless harmony. Furnaces glow around the clock, looms clatter in thriving guild quarters, and caravans carry prized wares abroad in an unmistakable golden age of industry."
 oe_ind2.8.a: "Every craft prospers"
 oe_ind2.9.title: "Monopoly or Free Labour"
 oe_ind2.9.desc: "As workshops expand into major centres of wealth, the court splits over the foundations of economic policy. Traditionalists insist on strict state monopolies and centrally directed labour to safeguard fiscal order, while reformers argue that loosening controls and letting workers move freely will unleash far greater prosperity."
 oe_ind2.9.a: "Hold to monopoly"
 oe_ind2.9.b: "Relax control"
 oe_ind2.10.title: "Materials Run Short"
 oe_ind2.10.desc: "As the war drags on, relentless battlefield consumption has drained provincial stores of saltpetre, copper, and iron to the bottom. With smelting furnaces slowing and artillery casting stalled, arsenal overseers send urgent pleas to the throne for emergency treasury purchases before the front runs dry."
 oe_ind2.10.a: "Buy them from the treasury"
 oe_ind2.10.b: "The front must wait"
