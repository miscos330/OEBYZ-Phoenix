 oe_ind2.1.title: "A Regional Industry Fostered"
 oe_ind2.1.desc: "For the first time the court has ordered that a region's industry be fostered. Workshops open one after another, and the local officials have a new duty to answer for."
 oe_ind2.1.a: "Judge the officials by results"
 oe_ind2.2.title: "The Silk Guilds Fight over Raw Silk"
 oe_ind2.2.desc: "With silk prices rising, the local guilds and the foreign merchants are bidding against each other for raw silk, and the quarrel has reached the magistrate."
 oe_ind2.2.a: "Our own weavers first"
 oe_ind2.2.b: "Let the highest bidder have it"
 oe_ind2.3.title: "Arsenals First, and the Townsfolk Complain"
 oe_ind2.3.desc: "Labour has been drawn off to the arsenals, the town workshops cannot find hands, and the townsfolk are complaining loudly."
 oe_ind2.3.a: "The front comes first"
 oe_ind2.3.b: "Leave some hands for the town"
 oe_ind2.4.title: "The Shipwrights Ask for Hereditary Places"
 oe_ind2.4.desc: "The shipwrights ask that their sons inherit their places, saying only so will the craft be kept."
 oe_ind2.4.a: "Grant it"
 oe_ind2.4.b: "Places go to the able"
 oe_ind2.5.title: "Assigned Labour Stirs Resentment"
 oe_ind2.5.desc: "The peasants assigned to labour in the mines and on the works are bitter, and the local officials fear trouble."
 oe_ind2.5.a: "Lighten their dues"
 oe_ind2.5.b: "Carry on as ordered"
 oe_ind2.6.title: "A Great Order Paid in Silver"
 oe_ind2.6.desc: "Merchants from afar have ordered porcelain, lacquerware and tea in great quantity, and pay in silver."
 oe_ind2.6.a: "Take the order"
 oe_ind2.7.title: "Cottons and Spices in Demand"
 oe_ind2.7.desc: "Our printed cottons and spices sell well, and distant weavers complain of the competition."
 oe_ind2.7.a: "Press the advantage"
 oe_ind2.8.title: "A Golden Age of Industry"
 oe_ind2.8.desc: "The imperial manufactories, the regional industry and the employment system work well together, and every craft prospers."
 oe_ind2.8.a: "Every craft prospers"
 oe_ind2.9.title: "Monopoly or Free Labour"
 oe_ind2.9.desc: "The court debates whether to hold to state workshops and the planned allocation of labour, or to relax control and let men work where they will."
 oe_ind2.9.a: "Hold to monopoly"
 oe_ind2.9.b: "Relax control"
 oe_ind2.10.title: "Materials Run Short"
 oe_ind2.10.desc: "As the war drags on, saltpetre, copper and iron are running out, and the arsenals ask for emergency supplies."
 oe_ind2.10.a: "Buy them from the treasury"
 oe_ind2.10.b: "The front must wait"
