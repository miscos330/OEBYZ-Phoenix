# NEW 2026-11-24 v25.0 Phase 4B 1337 Great Yuan/Early Ming Deep Flavor & Mechanic Pack (oe_v250_yua_, gen_v250_1337_mos_yua.py) — english localization (80 keys). Edit gen_v250_1337_mos_yua.py, not this file.
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "Yellow Registers & Fish-Scale Cadastre"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "Nationwide household Yellow Registers and Fish-Scale land maps uncover hidden estates, lifting taxes, output, and control amid fierce gentry pushback."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_gentry_lijia_compromise:0 "Gentry Lijia Self-Assessment Compromise"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_gentry_lijia_compromise:0 "Letting rural magnates and lijia elders self-assess tax quotas buys rapid social peace while shrinking crown tax efficiency."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_salt_guild_fisc:0 "Salt-Ticket & Urban Guild Fiscal Order"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_salt_guild_fisc:0 "Expanding salt-voucher monopolies and urban customs boosts trade revenue and merchant clout while nudging rural living costs upward."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_weisuo_colonies:0 "Hereditary Weisuo Military Colonies"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_weisuo_colonies:0 "Self-sustaining hereditary Weisuo garrisons slash military upkeep and swell manpower and grain stocks at the price of softer battlefield drill."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_mobile_strike_corps:0 "Mobile Steppe Strike Cavalry Corps"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_mobile_strike_corps:0 "Funding full-time salaried cavalry strike divisions delivers lethal discipline and shock across the steppe while heavily straining state finances."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_wall_garrisons:0 "Fortified Northern Frontier Garrisons"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_wall_garrisons:0 "Anchoring the northern passes with stone garrison towns and early gunpowder pieces strengthens defense and siegecraft at steeper fort upkeep."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_haijin_tribute_order:0 "Haijin Coastal Defense & Tribute Order"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_haijin_tribute_order:0 "Restricting private shipping to official tribute tallies fortifies coastal order and imperial dignity while choking maritime commerce and ports."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_open_ports:0 "Regulated Shibosi Open Maritime Ports"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_open_ports:0 "Opening licensed Shibosi customs bureaus at Zaytun, Hangzhou, and Guangzhou floods the realm with sea trade while loosening coastal oversight."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_coastal_patrol_fleet:0 "Imperial Coastal Patrol Navy"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_coastal_patrol_fleet:0 "Commissioning standing coastal patrol squadrons crushes piracy and elevates naval dominance at heavy shipyard upkeep and fiscal drain."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_grand_canal_artery:0 "Restored Grand Canal Imperial Artery"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_grand_canal_artery:0 "Dredging the Huitong locks and Grand Canal trunk binds north and south in booming grain and overland trade at permanent maintenance expense."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_imperial_censorate:0 "Reorganized Imperial Censorate"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_imperial_censorate:0 "Empowering the Imperial Censorate to audit ministries and provincial ledgers boosts crown power, taxes, and cabinet work amid elite anxiety."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_bureaus:0 "Chartered Maritime Shibosi Bureaus"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_bureaus:0 "Institutionalizing maritime customs at Zaytun, Hangzhou, and Guangzhou swells sea-trade revenue while expanding coastal merchant influence."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_passes_watch:0 "Provisioned Nine Northern Passes"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_passes_watch:0 "Regular imperial inspections restock garrisons from Datong to Liaoyang, sharpening northern frontier defense and morale at higher fort upkeep."
 oe_v250_yua_ref_zhongshu_xing_sheng:0 "Branch Secretariat Provincial System"
 oe_v250_yua_ref_zhongshu_xing_sheng_desc:0 "Governs the Great Yuan through interlocking Branch Secretariats (Xing Zhongshusheng) accountable to Dadu—raising crown power, cabinet efficiency, and monthly control at steeper administrative cost and noble friction."
 oe_v250_yua_ref_huangce_weisuo_order:0 "Yellow Register & Weisuo Imperial Order"
 oe_v250_yua_ref_huangce_weisuo_order_desc:0 "Anchors Ming imperial governance in Yellow Register household rolls and self-sustaining Weisuo farming garrisons—bolstering taxes, manpower, and grain at the cost of inward commercial restraint and burgher displeasure."
 oe_v250_yua_priv_ortoq_merchant_guild:0 "Ortoq & Salt-Voucher Merchant Charter"
 oe_v250_yua_priv_ortoq_merchant_guild_desc:0 "Licenses Great Yuan Ortoq commercial syndicates and salt-voucher merchants across caravan and canal arteries—lifting trade income and merchant capacity while expanding burgher clout, nudging inflation, and trimming crown leverage."
 oe_v250_yua_priv_hanlin_gentry_exemption:0 "Imperial Academy & Scholar-Gentry Exemption"
 oe_v250_yua_priv_hanlin_gentry_exemption_desc:0 "Confers Ming tax and corvee exemptions upon Confucian academies and registered scholar households—accelerating research speed and literacy while enlarging clerical-scholar power and narrowing crown tax yields."
 oe_v250_yua_cab_caoyun_canal_office:0 "Grand Canal Grain-Transport Directorate"
 oe_v250_yua_cab_caoyun_canal_office_desc:0 "Stations a Grain-Transport Commissioner in a target province to dredge locks and oversee canal barges—raising local food, prosperity, and control alongside national grain and overland trade at heavier court overhead and rural corvee strain."
 oe_v250_yua_cab_caoyun_canal_office_action:0 "Grand Canal Grain-Transport Directorate: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_caoyun_canal_office_active:0 "Grand Canal Grain-Transport Directorate in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
