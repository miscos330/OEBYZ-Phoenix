 oe_v250_yua_cab_caoyun_canal_office_action_progress_tooltip:0 "Stations a Grain-Transport Commissioner in a target province to dredge locks and oversee canal barges—raising local food, prosperity, and control alongside national grain and overland trade at heavier court overhead and rural corvee strain."
 oe_v250_yua_cab_caoyun_canal_office_select_province:0 "Select a Province for Grand Canal Grain-Transport Directorate"
 oe_v250_yua_cab_caoyun_canal_office_no_provinces:0 "@trigger_no! No eligible provinces available for Grain-Transport Directorate."
 oe_v250_yua_cab_tuntian_garrison:0 "Frontier Tuntian Military-Farm Garrison"
 oe_v250_yua_cab_tuntian_garrison_desc:0 "Organizes hereditary military-farming garrisons inside a border or fortified province—bolstering fortress defense, garrison replenishment, local food, and national manpower while diverting artisan output and adding fort upkeep."
 oe_v250_yua_cab_tuntian_garrison_action:0 "Frontier Tuntian Military-Farm Garrison: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_tuntian_garrison_active:0 "Frontier Tuntian Military-Farm Garrison in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_yua_cab_tuntian_garrison_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_tuntian_garrison_action_progress_wordier:0 "Frontier Tuntian Military-Farm Garrison ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_tuntian_garrison_action_progress_tooltip:0 "Organizes hereditary military-farming garrisons inside a border or fortified province—bolstering fortress defense, garrison replenishment, local food, and national manpower while diverting artisan output and adding fort upkeep."
