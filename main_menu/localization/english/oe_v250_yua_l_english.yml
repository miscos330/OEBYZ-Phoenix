l_english:
# NEW 2026-11-24 v25.0 Phase 4B 1337 Great Yuan/Early Ming Deep Flavor & Mechanic Pack (oe_v250_yua_, gen_v250_1337_mos_yua.py) — english localization (179 keys). Edit gen_v250_1337_mos_yua.py, not this file.
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_bayan_regency:0 "Bayan's Mongol Conservative Regency"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_bayan_regency:0 "Grand Councilor Bayan backs conservative Mongol banners and cavalry grit while alienating urban gentry and slowing scholarly progress."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_keju_reopened:0 "Restoration of the Imperial Examinations"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_keju_reopened:0 "Reopening the civil examinations revitalizes Dadu's bureaucracy and research speed while provoking conservative Mongol noble friction."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_dadu_court_balance:0 "Dadu Court Factional Balance"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_dadu_court_balance:0 "Careful palace arbitration keeps Dadu's rival factions from bloodshed while dulling imperial authority and tax collection."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_zhizheng_new_deal:0 "Toqto'a's Zhizheng New Deal"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_zhizheng_new_deal:0 "Chancellor Toqto'a reforms Dadu's administration and commissions the Three Histories, invigorating crown rule against entrenched noble resentment."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_moderate_zhizheng:0 "Measured Zhizheng Retrenchment"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_moderate_zhizheng:0 "Trimming palace waste without touching princely stipends steadies revenue and calm while leaving aristocratic privilege entrenched."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_three_histories:0 "Imperial Commission of the Three Histories"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_three_histories:0 "Sponsoring the official Liao, Jin, and Song histories elevates imperial legitimacy and cultural prestige at a steady fiscal cost."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_yellow_river_corvee:0 "Baimao Breach Corvee Dike Works"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_yellow_river_corvee:0 "Massive corvee levies along the Yellow River safeguard harvests and salt works while stoking fierce peasant unrest across Henan and Shandong."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_granary_relief:0 "Yellow-Huai Granary Relief"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_granary_relief:0 "Opening imperial granaries and remitting flood-zone taxes calms rural anger and aids recovery while draining revenues and manpower."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_provincial_dike_neglect:0 "Deferred Provincial River Works"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_provincial_dike_neglect:0 "Leaving flood repairs to overstretched provincial governors spares Dadu's treasury today while eroding prosperity and local control."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_zhizheng_sound_coin:0 "Zhizheng Silver-Backed Coinage Reform"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_zhizheng_sound_coin:0 "Restricting paper issues and backing currency with silver and copper restores fiscal trust while squeezing state construction and court budgets."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_emergency_jiaochao:0 "Emergency Zhizheng Jiaochao Printing"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_emergency_jiaochao:0 "Flooding markets with newly printed Zhizheng notes eases immediate military and building bills while fueling inflation and merchant anger."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_dual_silver_market:0 "Permitted Copper & Silver Bullion Market"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_dual_silver_market:0 "Allowing merchants to settle accounts in copper cash and silver bullion revives overland commerce while weakening crown monetary leverage."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_jialu_canal_restored:0 "Jia Lu's Restored Grand Canal"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_jialu_canal_restored:0 "Engineer Jia Lu reopens the silted Grand Canal and restores vital grain logistics at the cost of smoldering rural resentment."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_paid_canal_works:0 "Salaried Canal Crews & River Garrisons"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_paid_canal_works:0 "Paying cash wages to canal crews under armed guard secures grain barges and local order while heavily burdening taxes and military pay."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_abandoned_canal_work:0 "Suspended Canal Conscription"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_abandoned_canal_work:0 "Halting mass canal conscription spares the peasantry and nudges coastal shipping forward at a sharp drop in inland trade and grain flow."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_armed_haiyun_escorts:0 "Armed Haiyun Grain Escort Convoys"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_armed_haiyun_escorts:0 "Armed escort squadrons force Jiangnan rice convoys past coastal insurgents to Dadu, boosting sea power at steeper naval upkeep."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_requisitions:0 "Northern Hebei-Shandong Grain Requisitions"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_requisitions:0 "Requisitioning emergency grain from Hebei and Shandong keeps capital garrisons fed while bruising northern peasant prosperity."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_haiyun_chartered_captains:0 "Chartered Coastal Haiyun Captains"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_haiyun_chartered_captains:0 "Granting official patents to private maritime captains revives customs income and sailor pools while eroding imperial prestige and authority."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_loyalist_militia_lords:0 "Empowered Regional Loyalist Commanders"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_loyalist_militia_lords:0 "Granting sweeping field commands to loyalist lords like Chaghan Temur revitalizes discipline and levies while hollowing out central control."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_central_keshig_banners:0 "Restored Central Keshig & Princely Banners"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_central_keshig_banners:0 "Rebuilding the imperial Keshig from steppe levies keeps crown authority and heavy cavalry sharp at high upkeep and narrower total manpower."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_censorate_military_audit:0 "Censorate Military Oversight"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_censorate_military_audit:0 "Embedding imperial censors inside regional armies preserves administrative control at the expense of battlefield initiative and noble goodwill."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_palace_guard_centralized:0 "Centralized Palace Guard under the Heir"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_palace_guard_centralized:0 "Consolidating the Palace Guard beneath Crown Prince Ayushiridara stiffens central power and discipline while straining frontier and vassal trust."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_frontier_warlord_accord:0 "Frontier Commanders' Autonomy Accord"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_frontier_warlord_accord:0 "Recognizing autonomous northern commands halts destructive feuds and rallies manpower at a deep concession of crown power and taxes."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_secretariat_mediation:0 "Reorganized Dadu Secretariat Mediation"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_secretariat_mediation:0 "Restructuring the Dadu Secretariat calms court strife and eases stability management at noticeably steeper administrative overhead."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_liaodong_bulwark:0 "Liaodong & Yalu Frontier Bulwark"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_liaodong_bulwark:0 "Fortifying Liaoyang and posting cavalry garrisons along the Yalu secures the northeastern flank at heavier fort and tax burdens."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_goryeo_flank_accord:0 "Dadu-Kaesong Northern Flank Accord"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_goryeo_flank_accord:0 "Securing a pragmatic diplomatic settlement with Goryeo stabilizes the northeastern flank and overland trade while softening martial prestige."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_liaodong_marches:0 "Autonomous Liaodong Banner Marches"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_liaodong_marches:0 "Empowering local Liaodong banners to defend the marches swells regional manpower and garrisons at a loss to direct imperial control."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "Yellow Registers & Fish-Scale Cadastre"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_yellow_fishscale_cadastre:0 "Nationwide household Yellow Registers and Fish-Scale land maps uncover hidden estates, lifting taxes, output, and control amid fierce gentry pushback."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_gentry_lijia_compromise:0 "Gentry Lijia Self-Assessment Compromise"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_gentry_lijia_compromise:0 "Letting rural magnates and lijia elders self-assess tax quotas buys rapid social peace while shrinking crown tax efficiency."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_salt_guild_fisc:0 "Salt-Ticket & Urban Guild Fiscal Order"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_salt_guild_fisc:0 "Expanding salt-voucher monopolies and urban customs boosts trade revenue and merchant clout while nudging rural living costs upward."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_weisuo_colonies:0 "Hereditary Weisuo Military Colonies"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_weisuo_colonies:0 "Self-sustaining hereditary Weisuo garrisons slash military upkeep and swell manpower and grain stocks at the price of softer battlefield drill."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_mobile_strike_corps:0 "Mobile Steppe Strike Cavalry Corps"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_mobile_strike_corps:0 "Funding full-time salaried cavalry strike divisions delivers lethal discipline and shock across the steppe while heavily straining state finances."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_wall_garrisons:0 "Fortified Northern Frontier Garrisons"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_wall_garrisons:0 "Anchoring the northern passes with stone garrison towns and early gunpowder pieces strengthens defense and siegecraft at steeper fort upkeep."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_haijin_tribute_order:0 "Haijin Coastal Defense & Tribute Order"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_haijin_tribute_order:0 "Restricting private shipping to official tribute tallies fortifies coastal order and imperial dignity while choking maritime commerce and ports."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_open_ports:0 "Regulated Shibosi Open Maritime Ports"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_open_ports:0 "Opening licensed Shibosi customs bureaus at Zaytun, Hangzhou, and Guangzhou floods the realm with sea trade while loosening coastal oversight."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_coastal_patrol_fleet:0 "Imperial Coastal Patrol Navy"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_coastal_patrol_fleet:0 "Commissioning standing coastal patrol squadrons crushes piracy and elevates naval dominance at heavy shipyard upkeep and fiscal drain."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_grand_canal_artery:0 "Restored Grand Canal Imperial Artery"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_grand_canal_artery:0 "Dredging the Huitong locks and Grand Canal trunk binds north and south in booming grain and overland trade at permanent maintenance expense."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_imperial_censorate:0 "Reorganized Imperial Censorate"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_imperial_censorate:0 "Empowering the Imperial Censorate to audit ministries and provincial ledgers boosts crown power, taxes, and cabinet work amid elite anxiety."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_shibosi_bureaus:0 "Chartered Maritime Shibosi Bureaus"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_shibosi_bureaus:0 "Institutionalizing maritime customs at Zaytun, Hangzhou, and Guangzhou swells sea-trade revenue while expanding coastal merchant influence."
 STATIC_MODIFIER_NAME_oe_v250_yua_mod_northern_passes_watch:0 "Provisioned Nine Northern Passes"
 STATIC_MODIFIER_DESC_oe_v250_yua_mod_northern_passes_watch:0 "Regular imperial inspections restock garrisons from Datong to Liaoyang, sharpening northern frontier defense and morale at higher fort upkeep."
 oe_v250_yua_ref_zhongshu_xing_sheng:0 "Branch Secretariat Provincial System"
 oe_v250_yua_ref_zhongshu_xing_sheng_desc:0 "Governs the vast realm through interlocking Branch Secretariats (Xing Zhongshusheng) accountable to the capital—raising crown power, cabinet efficiency, and monthly control at steeper administrative cost and noble friction."
 oe_v250_yua_ref_huangce_weisuo_order:0 "Yellow Register & Weisuo Imperial Order"
 oe_v250_yua_ref_huangce_weisuo_order_desc:0 "Anchors imperial governance in Yellow Register household rolls and self-sustaining Weisuo farming garrisons—bolstering taxes, manpower, and grain at the cost of inward commercial restraint and burgher displeasure."
 oe_v250_yua_priv_ortoq_merchant_guild:0 "Ortoq & Salt-Voucher Merchant Charter"
 oe_v250_yua_priv_ortoq_merchant_guild_desc:0 "Licenses Ortoq commercial syndicates and salt-voucher merchants across caravan and canal arteries—lifting trade income and merchant capacity while expanding burgher clout, nudging inflation, and trimming crown leverage."
 oe_v250_yua_priv_hanlin_gentry_exemption:0 "Imperial Academy & Scholar-Gentry Exemption"
 oe_v250_yua_priv_hanlin_gentry_exemption_desc:0 "Confers tax and corvee exemptions upon Confucian academies and registered scholar households—accelerating research speed and literacy while enlarging clerical-scholar power and narrowing crown tax yields."
 oe_v250_yua_cab_caoyun_canal_office:0 "Grand Canal Grain-Transport Directorate"
 oe_v250_yua_cab_caoyun_canal_office_desc:0 "Stations a Grain-Transport Commissioner in a target province to dredge locks and oversee canal barges—raising local food, prosperity, and control alongside national grain and overland trade at heavier court overhead and rural corvee strain."
 oe_v250_yua_cab_caoyun_canal_office_action:0 "Grand Canal Grain-Transport Directorate: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_caoyun_canal_office_active:0 "Grand Canal Grain-Transport Directorate in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress_wordier:0 "Grand Canal Grain-Transport Directorate ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_caoyun_canal_office_action_progress_tooltip:0 "Stations a Grain-Transport Commissioner in a target province to dredge locks and oversee canal barges—raising local food, prosperity, and control alongside national grain and overland trade at heavier court overhead and rural corvee strain."
 oe_v250_yua_cab_caoyun_canal_office_select_province:0 "Select a Province for Grand Canal Grain-Transport Directorate"
 oe_v250_yua_cab_caoyun_canal_office_no_provinces:0 "@trigger_no! No eligible provinces available for Grain-Transport Directorate."
 oe_v250_yua_cab_tuntian_garrison:0 "Frontier Tuntian Military-Farm Garrison"
 oe_v250_yua_cab_tuntian_garrison_desc:0 "Organizes hereditary military-farming garrisons inside a border or fortified province—bolstering fortress defense, garrison replenishment, local food, and national manpower while diverting artisan output and adding fort upkeep."
 oe_v250_yua_cab_tuntian_garrison_action:0 "Frontier Tuntian Military-Farm Garrison: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_yua_cab_tuntian_garrison_active:0 "Frontier Tuntian Military-Farm Garrison in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_yua_cab_tuntian_garrison_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_tuntian_garrison_action_progress_wordier:0 "Frontier Tuntian Military-Farm Garrison ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_yua_cab_tuntian_garrison_action_progress_tooltip:0 "Organizes hereditary military-farming garrisons inside a border or fortified province—bolstering fortress defense, garrison replenishment, local food, and national manpower while diverting artisan output and adding fort upkeep."
 oe_v250_yua_cab_tuntian_garrison_select_province:0 "Select a Border or Fortified Province for Tuntian Military-Farm Garrison"
 oe_v250_yua_cab_tuntian_garrison_no_provinces:0 "@trigger_no! No eligible border or fortified provinces available for Tuntian Garrison."
 oe_v250_yua_dec_dredge_grand_canal.title:0 "Dredge the Grand Canal & Huitong Locks"
 oe_v250_yua_dec_dredge_grand_canal.desc:0 "Execute a grand hydraulic overhaul of the Huitong locks and trunk canal linking Yangzhou and Xuzhou to the imperial capital. Costs #Y 200#! gold and grants the permanent #Y Restored Grand Canal Imperial Artery#! modifier (raising overland trade, food, and production at permanent court and construction overhead)."
 oe_v250_yua_dec_dredge_grand_canal.a:0 "Commission the Grand Canal Restoration"
 oe_v250_yua_dec_imperial_censorate.title:0 "Reorganize the Imperial Censorate & Six Ministries"
 oe_v250_yua_dec_imperial_censorate.desc:0 "Overhaul the Imperial Censorate and link circuit auditors directly to the Six Ministries' fiscal reviews. Requires at least #Y 30#! locations, #Y 8#! stability, and #Y 160#! gold; grants the permanent #Y Reorganized Imperial Censorate#! modifier (boosting cabinet efficiency, crown power, and taxes at higher noble friction and stability cost)."
 oe_v250_yua_dec_imperial_censorate.a:0 "Enact the Censorate & Ministry Audit Reform"
 oe_v250_yua_dec_shibosi_charter.title:0 "Charter the Maritime Shibosi Customs Bureaus"
 oe_v250_yua_dec_shibosi_charter.desc:0 "Establish permanent Shibosi maritime customs bureaus across Zaytun (Jinjiang), Hangzhou, or Guangzhou to tax Indian Ocean and Nanyang shipping. Costs #Y 150#! gold and grants the permanent #Y Chartered Maritime Shibosi Bureaus#! modifier (raising sea trade, customs income, and merchant power while enlarging burgher leverage at crown expense)."
 oe_v250_yua_dec_shibosi_charter.a:0 "Charter the Maritime Shibosi Bureaus"
 oe_v250_yua_dec_northern_passes_watch.title:0 "Inspect & Provision the Northern Passes"
 oe_v250_yua_dec_northern_passes_watch.desc:0 "Repeatable every #Y 15 years#!. Spend #Y 120#! gold to dispatch imperial inspectors across the passes from Datong to Dadu and Liaoyang, granting army tradition and a #Y 12#!-year #Y Provisioned Nine Northern Passes#! modifier (boosting defense, garrisons, and morale at steeper fort upkeep and tax strain)."
 oe_v250_yua_dec_northern_passes_watch.a:0 "Inspect and Provision the Northern Frontier Passes"
 oe_v250_yua_passes_cd_tt:0 "Have not inspected the Northern Passes within the last 15 years"
 oe_v250_yua.1.t:0 "Bayan's Hardline Regency vs Confucians"
 oe_v250_yua.1.d:0 "Grand Councilor Bayan of the Merkid dominates Emperor Toghon Temur's court in Dadu, having abolished the civil service examinations and curbed Han officials to uphold steppe aristocratic dominance. Yet his nephew Toqto'a and Confucian academicians warn privately that alienating the southern scholar-gentry will make the empire ungovernable. The throne must decide whether to back Bayan's conservative banners, restore the examinations, or walk a cautious tightrope."
 oe_v250_yua.1.a:0 "Back Bayan's Mongol conservative faction and steppe garrisons"
 oe_v250_yua.1.b:0 "Side with Toqto'a to reopen the Imperial Examinations"
 oe_v250_yua.1.c:0 "Maintain a delicate palace balance between Dadu's factions"
 oe_v250_yua.2.t:0 "Toqto'a's New Deal (Zhizheng Reform)"
 oe_v250_yua.2.d:0 "Having toppled his overbearing uncle Bayan, Chancellor Toqto'a launches the sweeping Zhizheng New Deal: purging administrative rot, reviving the Hanlin Academy, and settling decades of bitter debate by commissioning official histories for the Liao, Jin, and Song dynasties as equal legitimate lineages. Entrenched palace nobles bristle as their sinecures and stipends come under scrutiny."
 oe_v250_yua.2.a:0 "Press Toqto'a's full Zhizheng administrative and scholarly reform"
 oe_v250_yua.2.b:0 "Enact moderate court retrenchment while sparing noble stipends"
 oe_v250_yua.2.c:0 "Focus patronage on compiling the Three Histories to elevate legitimacy"
 oe_v250_yua.3.t:0 "The 1344 Yellow River Avulsion (Baimao Breach)"
 oe_v250_yua.3.d:0 "Relentless monsoon rains have shattered the Yellow River dikes at Baimao near Kaifeng, drowning Henan and western Shandong, submerging imperial salt pans, and choking the Grand Canal. With hundreds of thousands displaced, the Secretariat debates conscripting massive corvee labor to seal the breach, opening granaries with sweeping tax remissions, or shifting the burden onto provincial governors."
 oe_v250_yua.3.a:0 "Mobilize massive corvee dike labor across Henan and Shandong"
 oe_v250_yua.3.b:0 "Open imperial granaries and remit taxes across the flooded plains"
 oe_v250_yua.3.c:0 "Leave flood repairs to local governors to guard Dadu's treasury"
 oe_v250_yua.4.t:0 "Chao Paper Currency Hyperinflation"
 oe_v250_yua.4.d:0 "Years of flood relief, lavish palace grants, and frontier expenses have drained the silver reserves backing imperial Zhongtong and Zhiyuan paper notes. Across Jiangnan markets, merchants hoard copper coin and refuse chao bills at face value. The Ministry of Revenue presents three stark options: painful silver-backed recoinage, emergency printing of new Zhizheng paper bills, or legalizing private silver and copper bullion trade."
 oe_v250_yua.4.a:0 "Enact silver-and-copper-backed Zhizheng monetary reform"
 oe_v250_yua.4.b:0 "Print emergency Zhizheng paper currency to cover immediate deficits"
 oe_v250_yua.4.c:0 "Permit copper cash and silver bullion alongside paper bills"
 oe_v250_yua.5.t:0 "Jia Lu's Grand Canal Restoration"
 oe_v250_yua.5.d:0 "Master hydraulic engineer Jia Lu proposes mobilizing 150,000 laborers to seal the Yellow River breaches and dredge the silted Huitong Grand Canal in a single heroic season, reopening north-south grain barges to Dadu. Yet imperial informants warn that White Lotus preachers are already stirring the weary work camps with prophecies of a one-eyed stone man foretelling rebellion."
 oe_v250_yua.5.a:0 "Back Jia Lu's Grand Canal restoration despite Red Turban unrest"
 oe_v250_yua.5.b:0 "Pay cash wages to hired canal crews and guard camps with troops"
 oe_v250_yua.5.c:0 "Halt mass river conscription and lean on coastal grain shipping"
 oe_v250_yua.6.t:0 "Maritime Grain Tribute (Haiyun) Embargo"
 oe_v250_yua.6.d:0 "Coastal warlord Fang Guozhen's fleets off Zhejiang and Jiangnan uprisings have choked the vital Haiyun maritime grain convoys that feed Dadu's millions. With empty wharves at Zhigu and surging grain prices in the capital, the court must either fit out armed escort squadrons to smash the blockade, impose harsh northern grain requisitions in Hebei and Shandong, or buy off coastal merchant captains with imperial patents."
 oe_v250_yua.6.a:0 "Fit out armed escort convoys to force Jiangnan grain north"
 oe_v250_yua.6.b:0 "Enforce emergency grain requisitions across Hebei and Shandong"
 oe_v250_yua.6.c:0 "Grant official maritime patents to coastal merchant captains"
 oe_v250_yua.7.t:0 "Steppe Princes vs Han Garrison Commanders"
 oe_v250_yua.7.d:0 "Decades of peace have hollowed out the regular Mongol garrison banners, while volunteer regional armies led by loyalist commanders such as Chaghan Temur and Li Siqi are actually winning battles across Henan and Shaanxi. Delegating sweeping provincial commands to these militia lords can save the dynasty—at the peril of warlord fragmentation—whereas rebuilding central Keshig banners from the steppe is slow and costly."
 oe_v250_yua.7.a:0 "Empower loyalist militia lords like Chaghan Temur with regional commands"
 oe_v250_yua.7.b:0 "Rebuild the central Keshig and steppe princely banners under Dadu"
 oe_v250_yua.7.c:0 "Dispatch imperial censors to keep both banners and militias subordinate"
 oe_v250_yua.8.t:0 "Dadu Court Factionalism & Heir Ayushiridara"
 oe_v250_yua.8.d:0 "Even as southern enemies close in, Dadu's Great Interior fractures into open faction war: Crown Prince Ayushiridara and Empress Gi lean on Henan commander Koke Temur while rival northern general Bolad Temur marches toward Juyong Pass, turning loyalist armies against one another across Shanxi. The emperor must centralize the Palace Guard under his heir, recognize frontier warlord jurisdictions to halt civil war, or reorganize the Secretariat to mediate."
 oe_v250_yua.8.a:0 "Centralize the Palace Guard under Crown Prince Ayushiridara"
 oe_v250_yua.8.b:0 "Recognize frontier warlord jurisdictions to end northern civil war"
 oe_v250_yua.8.c:0 "Reorganize the Dadu Secretariat to mediate between court and frontier"
 oe_v250_yua.9.t:0 "Liaodong & Goryeo Frontier Diplomacy"
 oe_v250_yua.9.d:0 "King Gongmin of Goryeo has purged pro-Yuan court factions in Kaesong and pushed northward toward the Yalu while roving Red Turban bands spill into Liaodong. Losing the Liaoyang corridor would expose Dadu's eastern flank and sever the steppe-Manchurian lifeline. The court must choose whether to pour gold into Liaodong garrisons, negotiate a dignified frontier accord with Goryeo, or enfeoff local Liaodong banners to guard the marches."
 oe_v250_yua.9.a:0 "Fortify Liaoyang and post shock garrisons along the Yalu flank"
 oe_v250_yua.9.b:0 "Negotiate a dignified northern flank accord and border trade with Goryeo"
 oe_v250_yua.9.c:0 "Enfeoff local Liaodong banners to defend the marches at their own cost"
 oe_v250_yua.10.t:0 "Early Ming / Restored Yuan: Yellow Registers & Fish-Scale Cadastre"
 oe_v250_yua.10.d:0 "After decades of civil war—whether the Son of Heaven rules an ascendant Ming court in Nanjing or a restored Great Yuan in Dadu—tax rolls lie in ruins while wealthy magnates conceal vast acreage. The Ministry of Revenue proposes a realm-wide Yellow Register household census and Fish-Scale land survey to restore fiscal justice, though gentry resistance looms unless the court settles for local lijia self-assessment or urban salt-guild taxation."
 oe_v250_yua.10.a:0 "Enforce comprehensive Yellow Registers and Fish-Scale land surveys"
 oe_v250_yua.10.b:0 "Allow local gentry lijia elders to self-assess rural tax quotas"
 oe_v250_yua.10.c:0 "Focus fiscal recovery on salt-ticket monopolies and urban merchant guilds"
 oe_v250_yua.11.t:0 "Weisuo Military Colonies vs Steppe Cavalry"
 oe_v250_yua.11.d:0 "Defending the vast northern frontier from Liaodong to Gansu devours immense quantities of grain and silver. Strategists in the Ministry of War clash over the empire's permanent military model: hereditary self-sustaining Weisuo farming garrisons that cost the treasury almost nothing, heavily salaried mobile strike cavalry capable of deep steppe expeditions, or stone-walled frontier fortresses bristling with early artillery."
 oe_v250_yua.11.a:0 "Expand self-sustaining Weisuo military-farm colonies across the realm"
 oe_v250_yua.11.b:0 "Fund heavily salaried mobile strike cavalry corps for steppe warfare"
 oe_v250_yua.11.c:0 "Build walled northern garrison towns armed with frontier artillery"
 oe_v250_yua.12.t:0 "Imperial Sea Policy: Tribute Trade vs Coastal Defense"
 oe_v250_yua.12.d:0 "From Quanzhou (Zaytun) and Hangzhou to Guangzhou, illicit silver smuggling and Wokou coastal raids test the empire's maritime order. Conservative ministers urge strict Haijin bans channeling all foreign ships into official tribute tallies behind fortified coastal wards, fiscal reformers argue for opening regulated Shibosi customs ports, and veteran admirals press to build standing patrol squadrons to command the eastern seas."
 oe_v250_yua.12.a:0 "Enforce strict Haijin coastal defense and official Tribute Trade"
 oe_v250_yua.12.b:0 "Open regulated Shibosi customs ports at Zaytun, Hangzhou, and Guangzhou"
 oe_v250_yua.12.c:0 "Commission imperial coastal patrol fleets to suppress smuggling"
