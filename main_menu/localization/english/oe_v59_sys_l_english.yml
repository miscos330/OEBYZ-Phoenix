l_english:
# Project Phoenix v59.0 Main Mod Localization (English)
 oe_v59_sys_pi_maritime_charter: "Maritime Charter Act"
 oe_v59_sys_pi_maritime_charter_desc: "Grant royal convoy escorts, admiralty prize courts, and chartered dockyard franchises to coastal shipping houses, accelerating ship construction and maritime trade while chafing landed magnates."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_maritime_charter: "Maritime Charter Act"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_maritime_charter: "Chartered dockyards and escorted merchant lanes strengthen maritime presence, sea trade efficiency, and naval construction."
 oe_v59_sys_pi_imperial_grain_reserve: "Imperial Grain Reserve Bill"
 oe_v59_sys_pi_imperial_grain_reserve_desc: "Mandate provincial ever-normal granaries stocked from bumper harvests to cushion urban markets against blight and siege winters, trading modest fiscal receipts for food security and civic calm."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_grain_reserve: "Imperial Grain Reserve"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_grain_reserve: "State-managed provincial granaries steady national food supplies and ease stability costs at a slight fiscal outlay."
 oe_v59_sys_pi_mercenary_audit: "Mercenary Audit & Standing Pay Act"
 oe_v59_sys_pi_mercenary_audit_desc: "Dispatch royal muster-masters to inspect mercenary rolls, eliminate phantom companies, and standardize standing pay warrants, curbing contractor abuses at the cost of noble captain resentment."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_mercenary_audit: "Mercenary Audit & Standing Pay"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_mercenary_audit: "Strict muster inspections lower mercenary premiums and trim military payroll leakage."
 oe_v59_sys_pi_silk_spice_tariff: "Silk & Spice Tariff Charter"
 oe_v59_sys_pi_silk_spice_tariff_desc: "Unify transit tolls along overland caravan highways and spice entrepots under a transparent tariff book, enriching exporting guilds while letting bullion inflows nudge prices upward."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_silk_spice_tariff: "Silk & Spice Tariff Charter"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_silk_spice_tariff: "Standardized long-distance customs invigorate caravan trade and export returns despite mild inflationary pressure."
 oe_v59_sys_pi_printing_royal_academy: "Printing Press & Royal Academy Charter"
 oe_v59_sys_pi_printing_royal_academy_desc: "License movable-type presses alongside a salaried Royal Academy of sciences and letters, accelerating literacy and institutional discovery despite unease among conservative censors."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_printing_academy: "Printing Press & Royal Academy"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_printing_academy: "Licensed presses and royal academic patronage speed research, literacy, and institution spread."
 oe_v59_sys_pi_religious_toleration_edict: "Religious Toleration Edict"
 oe_v59_sys_pi_religious_toleration_edict_desc: "Proclaim statutory liberty of conscience and civil property protections for minority confessions across the realm, calming sectarian strife while provoking sharp clerical protest."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_toleration_edict: "Religious Toleration Edict"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_toleration_edict: "Legal protections for minority faiths calm communal unrest at the cost of clerical discontent."
 oe_v59_sys_pi_colonial_viceroyalty: "Colonial Viceroyalty Oversight"
 oe_v59_sys_pi_colonial_viceroyalty_desc: "Establish permanent royal audiencias and fiscal inspectors over overseas viceroyalties and autonomous dependencies, lifting remittances and settler coordination while stiffening foreign rivalry."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_colonial_viceroyalty: "Colonial Viceroyalty Oversight"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_colonial_viceroyalty: "Audited viceregal courts improve subject loyalty, tribute returns, and overseas settlement."
 oe_v59_sys_pi_industrial_infra_bond: "Industrial Infrastructure Bond"
 oe_v59_sys_pi_industrial_infra_bond_desc: "Float parliamentary public-works bonds to finance turnpikes, canals, coal wharves, and mechanized workshops across industrializing provinces, accepting higher debt service for surging output."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_industrial_bond: "Industrial Infrastructure Bond"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_industrial_bond: "Public-works financing accelerates national construction and industrial output at slightly higher interest costs."
 oe_v59_sys_pi_army_modernization_levy: "Army Modernization Levy"
 oe_v59_sys_pi_army_modernization_levy_desc: "Appropriate parliamentary funds for standardized drill manuals, cadet academies, and flintlock arsenals, sharpening battlefield discipline and recruitment at higher standing upkeep."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_army_modernization: "Army Modernization Program"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_army_modernization: "Standardized drill and modernized arsenals improve discipline and recruitment speed at greater army upkeep."
 oe_v59_sys_pi_east_asian_memorial: "East Asian Imperial Memorial Reform"
 oe_v59_sys_pi_east_asian_memorial_desc: "Institute sealed palace memorials and censorate circuit audits bypassing entrenched aristocratic intermediaries, sharpening cabinet efficiency and provincial control."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pi_east_asian_memorial: "Sealed Palace Memorial System"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pi_east_asian_memorial: "Direct sealed memorials and censorate audits heighten cabinet efficiency and central control across the provinces."
 oe_v59_sys_pa_nobles_officer_patents: "Confirm Hereditary Officer Patents"
 oe_v59_sys_pa_nobles_officer_patents_simple: "Hereditary Officer Patents"
 oe_v59_sys_pa_nobles_officer_patents_desc: "The landed aristocracy requests five-year confirmation of hereditary regimental commissions in exchange for parliamentary votes, raising army payroll slightly."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_officer_patents: "Hereditary Officer Patents"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_officer_patents: "Reserved regimental commissions satisfy the nobility while raising standing army upkeep."
 oe_v59_sys_pa_burghers_free_port_charter: "Free-Port Customs Franchise"
 oe_v59_sys_pa_burghers_free_port_charter_simple: "Free-Port Customs Franchise"
 oe_v59_sys_pa_burghers_free_port_charter_desc: "Merchant deputies seek temporary bonded warehouses and free-port duty exemptions to boost exports in exchange for backing crown legislation."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_free_port: "Free-Port Customs Franchise"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_free_port: "Bonded free-port privileges stimulate exports and burgher goodwill at reduced direct tax intake."
 oe_v59_sys_pa_clergy_seminary_tithe: "Endow Diocesan Seminaries"
 oe_v59_sys_pa_clergy_seminary_tithe_simple: "Diocesan Seminary Endowment"
 oe_v59_sys_pa_clergy_seminary_tithe_desc: "Ecclesiastical delegates ask for dedicated tithe allocations to train parish clergy and missionaries in return for rallying parliamentary support."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_seminary_tithe: "Diocesan Seminary Endowment"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_seminary_tithe: "State-backed seminaries speed provincial religious conversion and please the clergy at modest fiscal cost."
 oe_v59_sys_pa_peasants_famine_granary: "Open Parish Famine Granaries"
 oe_v59_sys_pa_peasants_famine_granary_simple: "Parish Famine Granaries"
 oe_v59_sys_pa_peasants_famine_granary_desc: "Rural deputies call for emergency grain distributions and suspension of non-essential road corvee during lean seasons in return for parliamentary backing."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_famine_granary: "Parish Famine Relief"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_famine_granary: "Emergency rural grain relief boosts food security and peasant contentment while slowing state building projects."
 oe_v59_sys_pa_burghers_guild_patent: "Uphold Craft Guild Patents"
 oe_v59_sys_pa_burghers_guild_patent_simple: "Craft Guild Patents"
 oe_v59_sys_pa_burghers_guild_patent_desc: "Urban guilds petition parliament to ratify exclusive quality stamps and workshop patents, boosting artisanal output while raising domestic consumer prices."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_guild_patent: "Craft Guild Patents"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_guild_patent: "Protected artisanal patents raise workshop productivity and burgher loyalty alongside mild inflation."
 oe_v59_sys_pa_nobles_hunting_forests: "Protect Seigniorial Hunting Forests"
 oe_v59_sys_pa_nobles_hunting_forests_simple: "Seigniorial Forest Rights"
 oe_v59_sys_pa_nobles_hunting_forests_desc: "Provincial lords demand royal enforcement of manor game preserves and timber wardenships, pleasing the nobility and tightening rural policing at peasant expense."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_pa_hunting_forests: "Seigniorial Forest Statutes"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_pa_hunting_forests: "Manor forestry enforcement satisfies noble landlords and aids local policing while irritating rural commoners."
 oe_v59_sys_ord_varangian_axe: "Order of the Varangian Axe"
 oe_v59_sys_ord_varangian_axe_desc: "Forged from the sworn oath of Norse-Greek imperial guardsmen who bore the double-edged Dane axe before the Emperor's dais, this elite brotherhood binds veteran commanders to unyielding discipline."
 oe_v59_sys_dec_ord_varangian_axe.title: "Charter the Order of the Varangian Axe"
 oe_v59_sys_dec_ord_varangian_axe.desc: "Formally reconstitute the axe-bearing Varangian fellowship as an imperial chivalric brotherhood open to our sovereign, princes, and seasoned captains."
 oe_v59_sys_dec_ord_varangian_axe.a: "Swear the Varangian Oath"
 oe_v59_sys_ord_danubian_dragon: "Order of the Dragon"
 oe_v59_sys_ord_danubian_dragon_desc: "Modeled upon the Danubian and Balkan crusade brotherhood of coiled-dragon knights, this order rallies frontier voivodes, magnates, and castle wardens in sworn defense of the Carpathian and Danube marches."
 oe_v59_sys_dec_ord_danubian_dragon.title: "Convene the Danubian Order of the Dragon"
 oe_v59_sys_dec_ord_danubian_dragon.desc: "Proclaim the coiled-dragon badge across the Danubian and Balkan fortresses, uniting border magnates and field marshals under a sworn defensive brotherhood."
 oe_v59_sys_dec_ord_danubian_dragon.a: "Raise the Dragon Banner"
 oe_v59_sys_ord_saint_stephen_lepanto: "Order of Saint Stephen & Lepanto"
 oe_v59_sys_ord_saint_stephen_lepanto_desc: "Inspired by Mediterranean galley-knights who swept corsair lanes from Pisa to Lepanto, this naval brotherhood honors admirals and patrician captains defending our sea lanes and arsenals."
 oe_v59_sys_dec_ord_saint_stephen_lepanto.title: "Charter the Order of Saint Stephen & Lepanto"
 oe_v59_sys_dec_ord_saint_stephen_lepanto.desc: "Endow a maritime knightly brotherhood of galley captains and admirals dedicated to Mediterranean sea mastery and convoy protection."
 oe_v59_sys_dec_ord_saint_stephen_lepanto.a: "Consecrate the Naval Cross"
 oe_v59_sys_ord_imperial_keshig: "Fellowship of the Imperial Keshig"
 oe_v59_sys_ord_imperial_keshig_desc: "Drawn from the sons of noyans and battle-tested quiver-bearers, the Imperial Keshig serves as both day-and-night royal guard and the elite proving ground for steppe marshals."
 oe_v59_sys_dec_ord_imperial_keshig.title: "Muster the Fellowship of the Imperial Keshig"
 oe_v59_sys_dec_ord_imperial_keshig.desc: "Enlist the choicest noble sons and tumen captains into the sovereign's Keshig guard, forging a lifelong martial fellowship of steppe commanders."
 oe_v59_sys_dec_ord_imperial_keshig.a: "Bestow the Golden Paiza"
 oe_v59_sys_ord_xuanjia_red_plume: "Brotherhood of the Xuanjia & Red-Plume Vanguard"
 oe_v59_sys_ord_xuanjia_red_plume_desc: "Inheriting the black-armored Xuanjia cataphract legacy and scarlet-plumed imperial vanguard standards, this Sinospheric martial fraternity honors officers who break enemy lines and guard the throne."
 oe_v59_sys_dec_ord_xuanjia_red_plume.title: "Charter the Xuanjia & Red-Plume Vanguard"
 oe_v59_sys_dec_ord_xuanjia_red_plume.desc: "Establish a black-iron cuirassier and scarlet-plumed vanguard brotherhood honoring loyal commanders and imperial military laureates."
 oe_v59_sys_dec_ord_xuanjia_red_plume.a: "Issue the Tiger Tally"
 oe_v59_sys_ord_qizilbash_immortals: "Order of the Qizilbash & Immortal Guard"
 oe_v59_sys_ord_qizilbash_immortals_desc: "Blending the ancient Persian Immortal royal guard tradition with the fervent crimson-crowned Qizilbash cavalry corps, this brotherhood binds devoted horsemen and provincial emirs to the Shahanshah's banner."
 oe_v59_sys_dec_ord_qizilbash_immortals.title: "Proclaim the Qizilbash & Immortal Guard"
 oe_v59_sys_dec_ord_qizilbash_immortals.desc: "Invest elite royal lancers and loyal emirs with the crimson headgear and Immortal lance standard of the Iranian crown."
 oe_v59_sys_dec_ord_qizilbash_immortals.a: "Don the Crimson Crown"
 oe_v59_sys_ord_hachiman_bushido: "Fellowship of Hachiman Bushido"
 oe_v59_sys_ord_hachiman_bushido_desc: "Sworn beneath the banners of Hachiman, patron deity of archery and samurai honor, this martial fraternity codifies austere swordsmanship, unbreakable loyalty, and lifelong military study."
 oe_v59_sys_dec_ord_hachiman_bushido.title: "Swear the Fellowship of Hachiman Bushido"
 oe_v59_sys_dec_ord_hachiman_bushido.desc: "Unite foremost samurai retainers and generals under a formal Hachiman martial oath preserving battlefield discipline across generations."
 oe_v59_sys_dec_ord_hachiman_bushido.a: "Take the Hachiman Vow"
 oe_v59_sys_ord_hesperian_eagle: "Order of the Hesperian Eagle"
 oe_v59_sys_ord_hesperian_eagle_desc: "Bearing a silver aquila crowned with the evening star, the Order of the Hesperian Eagle honors statesmen, navigators, and legionary commanders who carry Roman law and civilization across both Old and New Worlds."
 oe_v59_sys_dec_ord_hesperian_eagle.title: "Charter the Order of the Hesperian Eagle"
 oe_v59_sys_dec_ord_hesperian_eagle.desc: "Institute the silver-eagle imperial order of Roman restoration and western horizons, uniting senatorial magistrates and commanders."
 oe_v59_sys_dec_ord_hesperian_eagle.a: "Raise the Hesperian Aquila"
 oe_v59_sys_encyclopedia_canon: "Encyclopedic Grand Canon"
 oe_v59_sys_encyclopedia_canon_desc: "A multi-volume scholarly compendium gathering classical sciences, jurisprudence, and artisanal arts for generations of readers."
 oe_v59_sys_scientific_tractate: "Scientific Tractate"
 oe_v59_sys_scientific_tractate_desc: "A landmark mathematical or astronomical treatise transforming empirical observation, navigation, and institutional inquiry."
 oe_v59_sys_art_rihla_ibn_battuta: "Rihla: A Masterpiece to Those Who Contemplate the Wonders of Cities"
 oe_v59_sys_art_rihla_ibn_battuta_desc: "Dictated after thirty years of journeys from Tangier to Delhi, Kilwa, Timbuktu, and Quanzhou, this matchless travel chronicle illuminates the courts, ports, and caravans of the Afro-Eurasian world."
 oe_v59_sys_dec_mp_rihla.title: "Patronize the Rihla of Ibn Battuta"
 oe_v59_sys_dec_mp_rihla.desc: "Commission court scribes to compile the celebrated Maghrebi traveler's geographic accounts of cities, sea lanes, and sovereign courts across three continents."
 oe_v59_sys_dec_mp_rihla.a: "Commission the Grand Travelogue"
 oe_v59_sys.1.title: "The Rihla of Ibn Battuta"
 oe_v59_sys.1.desc: "Returning from decades across caravan oases, monsoon harbors, and distant royal capitals, the celebrated jurist-traveler offers to dictate his complete Rihla under our court's patronage. Scribes await our instructions on how this treasury of geography and statecraft should be preserved."
 oe_v59_sys.1.a: "Bind an Illuminated Royal Edition for Foreign Courts"
 oe_v59_sys.1.b: "Circulate Annotated Trade Itineraries to Merchants & Scholars"
 oe_v59_sys.1.c: "Deposit the Original Manuscript in the Palace Archive"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_rihla_grand: "Patron of the Rihla"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_rihla_grand: "Cosmopolitan geographic renown elevates our diplomatic prestige and overland trade."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_rihla_copies: "Rihla Caravan Itineraries"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_rihla_copies: "Widely copied geographic guides accelerate institution spread and export returns."
 oe_v59_sys_art_yongle_dadian: "Yongle Dadian: The Great Imperial Canon"
 oe_v59_sys_art_yongle_dadian_desc: "Compiled by over two thousand court scholars into eleven thousand silk-bound volumes, this supreme compendium gathers history, astronomy, hydraulics, medicine, and statecraft across millennia."
 oe_v59_sys_dec_mp_yongle.title: "Compile the Yongle Encyclopedia"
 oe_v59_sys_dec_mp_yongle.desc: "Summon the empire's finest Hanlin scholars and calligraphers to assemble every extant classic, treatise, and administrative record into an immortal grand encyclopedia."
 oe_v59_sys_dec_mp_yongle.a: "Summon the Grand Compilers"
 oe_v59_sys.2.title: "The Yongle Encyclopedia (Yongle Dadian)"
 oe_v59_sys.2.desc: "Thousands of scholars, proofreaders, and calligraphers have labored across the imperial book pavilions to synthesize centuries of classical philosophy, engineering, medicine, and history into a single monumental canon. How shall the throne proclaim its completion?"
 oe_v59_sys.2.a: "Enshrine the Yellow-Silk Imperial Master Set in the Grand Pavilion"
 oe_v59_sys.2.b: "Transcribe Provincial Reference Digests for Prefectural Academies"
 oe_v59_sys.2.c: "Seal Duplicate Fireproof Copies in the Imperial Treasury"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_yongle_grand: "Splendor of the Grand Canon"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_yongle_grand: "Comprehensive imperial scholarship accelerates research and elevates cabinet administration."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_yongle_copies: "Prefectural Canon Digests"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_yongle_copies: "Provincial study digests expand national literacy and classical cultural tradition."
 oe_v59_sys_art_timbuktu_sankore: "Grand Manuscript Canon of Sankore"
 oe_v59_sys_art_timbuktu_sankore_desc: "Bound in gilded desert leather along the Niger bend, the Sankore Canon preserves jurisprudence, astronomy, medicine, and trans-Saharan chronicles traded weight-for-weight with gold."
 oe_v59_sys_dec_mp_sankore.title: "Endow the Timbuktu Sankore Canon"
 oe_v59_sys_dec_mp_sankore.desc: "Sponsor the jurists, astronomers, and calligraphers of the Sankore madrasa network to bind a master canon of West African and Saharan learning."
 oe_v59_sys_dec_mp_sankore.a: "Endow the Sankore Libraries"
 oe_v59_sys.3.title: "The Timbuktu Sankore Canon"
 oe_v59_sys.3.desc: "Caravans bearing fine paper from the Mediterranean meet scholars along the Niger to assemble a definitive Sankore Canon spanning astronomy, commercial law, optics, and history. The chief qadis await royal decree on the canon's endowment."
 oe_v59_sys.3.a: "Establish a Royal Library Guild & Desert Book Trade"
 oe_v59_sys.3.b: "Expand Madrasa Fellowships Across Frontier Towns"
 oe_v59_sys.3.c: "Safeguard the Gilded Manuscripts in Sovereign Vaults"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_sankore_grand: "Sankore Book-Caravan Guild"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_sankore_grand: "Prestigious manuscript patronage fuels scholarly inquiry and trans-Saharan caravan trade."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_sankore_copies: "Sankore Madrasa Fellowships"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_sankore_copies: "Endowed teaching circles broaden literacy and strengthen spiritual authority."
 oe_v59_sys_art_de_revolutionibus: "De Revolutionibus Orbium Coelestium"
 oe_v59_sys_art_de_revolutionibus_desc: "Setting the Sun at the mathematical center of the planetary spheres, this revolutionary astronomical tractate reshapes navigation tables, calendar reform, and natural philosophy."
 oe_v59_sys_dec_mp_revolutionibus.title: "Patronize De Revolutionibus"
 oe_v59_sys_dec_mp_revolutionibus.desc: "Grant royal printing protection and observatory instruments to the pioneering heliocentric astronomer preparing six books on the celestial spheres."
 oe_v59_sys_dec_mp_revolutionibus.a: "Protect the Celestial Press"
 oe_v59_sys.4.title: "De Revolutionibus Orbium Coelestium"
 oe_v59_sys.4.desc: "A bold mathematical astronomer has laid before our court six meticulous books demonstrating a heliocentric model of the heavens. Traditionalist theologians bristle at its daring, while navigators and calendar reformers marvel at its precision."
 oe_v59_sys.4.a: "Publish Under Royal Privilege & Defend Free Inquiry"
 oe_v59_sys.4.b: "Adapt Its Planetary Tables for Admiralty Navigation"
 oe_v59_sys.4.c: "Place the Treatise Under Cautious Academic Review"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_revolutionibus_grand: "Heliocentric Revolution"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_revolutionibus_grand: "Bold royal patronage of celestial mathematics accelerates research and institution growth despite clerical unease."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_revolutionibus_tables: "Reformed Astronomical Ephemerides"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_revolutionibus_tables: "Updated star tables sharpen maritime navigation and empirical research."
 oe_v59_sys_art_principia_mathematica: "Philosophiae Naturalis Principia Mathematica"
 oe_v59_sys_art_principia_mathematica_desc: "Unifying terrestrial mechanics, ballistics, and celestial gravitation under universal mathematical laws, the Principia crowns the Scientific Revolution."
 oe_v59_sys_dec_mp_principia.title: "Sponsor the Principia Mathematica"
 oe_v59_sys_dec_mp_principia.desc: "Underwrite the Royal Society's printing of the landmark mathematical synthesis of motion, optics, and universal gravitation."
 oe_v59_sys_dec_mp_principia.a: "Underwrite the Royal Society Edition"
 oe_v59_sys.5.title: "Philosophiae Naturalis Principia Mathematica"
 oe_v59_sys.5.desc: "Before our Royal Society stands a work of astonishing clarity: three books uniting falling bodies, ocean tides, artillery arcs, and planetary orbits beneath a single mathematical architecture of motion and gravitation."
 oe_v59_sys.5.a: "Sponsor International Royal Society Editions"
 oe_v59_sys.5.b: "Apply Its Mechanics to Artillery & Engineering Academies"
 oe_v59_sys.5.c: "Endow a Permanent Chair of Natural Philosophy at Court"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_principia_grand: "Age of the Principia"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_principia_grand: "Mathematical mechanics propels scientific research and industrial workshop precision."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_principia_ballistics: "Mathematical Ballistics Corps"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_principia_ballistics: "Applied mechanics sharpens artillery gunnery and engineering research."
 oe_v59_sys_art_encyclopedie: "Encyclopedie: Systematic Dictionary of Sciences, Arts, and Trades"
 oe_v59_sys_art_encyclopedie_desc: "Illustrated with thousands of copperplate engravings detailing looms, blast furnaces, printing presses, and political philosophy, the Encyclopedie transforms public reason across the Enlightenment world."
 oe_v59_sys_dec_mp_encyclopedie.title: "License the Great Encyclopedie"
 oe_v59_sys_dec_mp_encyclopedie.desc: "Permit Enlightenment editors, engravers, and master artisans to publish a multi-volume systematic dictionary of human knowledge and mechanical arts."
 oe_v59_sys_dec_mp_encyclopedie.a: "Grant the Publishing Subscription"
 oe_v59_sys.6.title: "The Encyclopedie of Sciences, Arts & Trades"
 oe_v59_sys.6.desc: "Philosophes, master mechanics, and copperplate engravers petition for royal protection to publish twenty-eight folio volumes cataloging every known science, workshop craft, and civic institution. Censors warn of political ferment, while industrialists clamor for its technical plates."
 oe_v59_sys.6.a: "Champion Uncensored Enlightenment Publication"
 oe_v59_sys.6.b: "Emphasize the Mechanical Arts & Manufactory Plates"
 oe_v59_sys.6.c: "Approve a Curated State-Supervised Edition"
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_encyclopedie_grand: "Light of the Encyclopedie"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_encyclopedie_grand: "Widespread Enlightenment readership accelerates literacy and institution adoption despite conservative backlash."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_mp_encyclopedie_crafts: "Encyclopedie Manufactory Plates"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_mp_encyclopedie_crafts: "Detailed workshop engravings boost national production and construction efficiency."
 oe_v59_sys_dis_gui_steps_label: "Stabilization Progress:"
 oe_v59_sys_dis_gui_months_label: "Months Active:"
 oe_v59_sys_dis_ancien_regime_bankruptcy: "Ancien Regime Bankruptcy & Estates-General Crisis"
 oe_v59_sys_dis_ancien_regime_bankruptcy_desc: "Decades of war debt, opaque tax-farming, and privileged aristocratic tax exemptions have pushed the royal treasury to the brink of insolvency. With bondholders panicking and bread prices soaring, only sweeping fiscal settlement can avert revolutionary collapse."
 STATIC_MODIFIER_NAME_oe_v59_sys_mod_ancien_fiscal_solvency: "Modernized Public Credit"
 STATIC_MODIFIER_DESC_oe_v59_sys_mod_ancien_fiscal_solvency: "Overcoming Ancien Regime fiscal collapse through audited budgets and universal land taxation restores sovereign credit."
 oe_v59_sys_dis.1.title: "Exhaustion of the Royal Treasury & Convocation of the Estates"
 oe_v59_sys_dis.1.desc: "The Comptroller-General has delivered an alarming ledger: interest payments now consume half the crown's revenue, while provincial parlements refuse to register new emergency levies without convening an Estates-General."
 oe_v59_sys_dis.1.a: "Publish an Audited Budget & Propose Universal Land Tax (-5 Stability, +1 Recovery)"
 oe_v59_sys_dis.1.b: "Issue Emergency Sinking-Fund Bonds Backed by Crown Lands (-80 Gold, +1 Recovery)"
 oe_v59_sys_dis.1.c: "Suspend Bond Redemptions to Preserve Immediate Cash (+120 Gold, -8 Stability)"
 oe_v59_sys_dis.2.title: "Assembly of Notables Defies Fiscal Reform"
 oe_v59_sys_dis.2.desc: "Dukes, prelates, and senior magistrates have closed ranks against ending their centuries-old exemptions from the direct land tax, insisting that fiscal burdens remain upon commoners and urban commerce."
 oe_v59_sys_dis.2.a: "Override Exemptions with Representative Estates Backing (-4 Stability, +1 Recovery)"
 oe_v59_sys_dis.2.b: "Negotiate Graduated Debt-Retirement Contributions (-70 Gold, +1 Recovery)"
 oe_v59_sys_dis.2.c: "Bow to Privileged Exemptions & Raise Indirect Excise (+60 Gold, -6 Stability)"
 oe_v59_sys_dis.3.title: "Flour Bread Riots & Sovereign Bond Panic"
 oe_v59_sys_dis.3.desc: "A harsh winter has driven flour prices beyond artisan wages while pamphlets denounce royal court extravagance. Crowds gather outside municipal bakeries and exchange houses alike."
 oe_v59_sys_dis.3.a: "Subsidize Urban Grain & Establish a Transparent Sinking Fund (-100 Gold, +1 Recovery)"
 oe_v59_sys_dis.3.b: "Guarantee Public Debt Under Parliamentary Oversight (+6 Stability, +1 Recovery)"
 oe_v59_sys_dis.3.c: "Deploy Garrison Dragoons to Disperse the Exchange Crowds (-8 Stability, +40 Gold)"
 oe_v59_sys_dis.4.title: "Fiscal Settlement & Constitutional Solvency"
 oe_v59_sys_dis.4.desc: "Through painful restructuring, abolished tax-farming sinecures, and transparent debt servicing, the state's credit has stabilized. Bond yields fall across European exchanges as confidence returns."
 oe_v59_sys_dis.4.a: "Charter a Permanent National Budget & Sinking Fund"
 oe_v59_sys_dis.4.b: "Reconcile the Estates Around Shared Fiscal Responsibility"
