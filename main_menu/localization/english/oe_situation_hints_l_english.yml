l_english:
# NEW 2026-11-24 v25.5 Wave 2B: Situation Hints Localization for All 30 Active Custom Situations (EN).
 hint_oe_cw_war:0 "[GetSituationByKey('oe_cw_war').GetNameWithNoTooltip]"
 hint_oe_cw_war_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates when the 1341 Byzantine regency crisis erupts into open civil war between the Palaiologan court and John Kantakouzenos.\n\n#T Core Goal#!\n@hint! Track contested key cities across Thrace and Macedonia on the situation panel. Regain control of rebel-held strongholds and keep the Thessalonican Zealot commune from fracturing the realm.\n\n#T Resolution#!\n@hint! Defeat the rival claimant in the field or reach a negotiated dynastic settlement through the civil-war event chain to end the crisis."
 hint_oe_cw2_war:0 "[GetSituationByKey('oe_cw2_war').GetNameWithNoTooltip]"
 hint_oe_cw2_war_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates during the 1352 dynastic succession clash between John V Palaiologos and the Kantakouzenos faction.\n\n#T Core Goal#!\n@hint! Secure the imperial capital corridor and disputed Thracian cities before neighboring Serbian, Bulgarian, or Anatolian opportunists intervene.\n\n#T Resolution#!\n@hint! Force the opposing imperial faction to capitulate or settle the co-emperorship via the 1352 civil-war conclusion events."
 hint_oe_vas_vassalage:0 "[GetSituationByKey('oe_vas_vassalage').GetNameWithNoTooltip]"
 hint_oe_vas_vassalage_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates when Byzantium is forced into tributary vassalage under the Ottoman Sultan during the late-14th-century crisis (1371–1381).\n\n#T Core Goal#!\n@hint! Balance the Sultan's patience gauge against imperial defiance while preserving Constantinople and suppressing Andronikos's princely rebellion.\n\n#T Resolution#!\n@hint! Survive the tributary years, build alliances or military readiness, and break free once the vassalage chain reaches its conclusion."
 hint_oe_byd_blockade:0 "[GetSituationByKey('oe_byd_blockade').GetNameWithNoTooltip]"
 hint_oe_byd_blockade_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates when Sultan Bayezid I imposes the great land-and-sea blockade around Constantinople (1394–1402).\n\n#T Core Goal#!\n@hint! Keep City Morale above breaking thresholds by running grain supplies through the straits, soliciting Western aid, and holding the Theodosian Walls.\n\n#T Resolution#!\n@hint! Outlast the blockade until Ottoman power is broken from the east or lift the siege militarily to end the crisis."
 hint_oe_ivr_interregnum:0 "[GetSituationByKey('oe_ivr_interregnum').GetNameWithNoTooltip]"
 hint_oe_ivr_interregnum_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates after the Battle of Ankara shatters Ottoman unity into rival princely contenders competing for the Sultanate.\n\n#T Core Goal#!\n@hint! Track each Ottoman prince's leverage and back the claimant most willing to cede coastal cities, Thessalonica, and Gallipoli concessions to Byzantium.\n\n#T Resolution#!\n@hint! The situation ends once one Ottoman contender wins the interregnum and the territorial wagers are settled."
 hint_oe_ths_city:0 "[GetSituationByKey('oe_ths_city').GetNameWithNoTooltip]"
 hint_oe_ths_city_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates when Ottoman armies blockade Thessalonica and threaten Greece's second imperial metropolis.\n\n#T Core Goal#!\n@hint! Sustain the city's resistance will via imperial relief or weigh a desperate Venetian handover before the garrison starves out.\n\n#T Resolution#!\n@hint! Break the blockade militarily, complete a diplomatic transfer, or resolve the siege chain to conclude the crisis."
 hint_oe_ths_mustafa:0 "[GetSituationByKey('oe_ths_mustafa').GetNameWithNoTooltip]"
 hint_oe_ths_mustafa_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates when Byzantium unleashes the pretender Mustafa against the Ottoman Sultanate in a second high-stakes succession gamble.\n\n#T Core Goal#!\n@hint! Monitor Mustafa's field strength versus the reigning Sultan and decide how deeply to commit imperial troops and gold.\n\n#T Resolution#!\n@hint! Ends once Mustafa either seizes Rumelia and honors his promises or falls to the Sultan's counteroffensive."
 hint_oe_ar_burden:0 "[GetSituationByKey('oe_ar_burden').GetNameWithNoTooltip]"
 hint_oe_ar_burden_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates after the Restoration of Rome when governing sprawling Western and Mediterranean provinces creates severe Imperial Strain.\n\n#T Core Goal#!\n@hint! Lower Imperial Strain by constructing Theme Systems across reconquered western lands and delegating frontier administration via Imperial Pillars.\n\n#T Resolution#!\n@hint! Stabilize western provincial control and relieve strain through administrative reforms to consolidate the restored Empire."
 hint_rome_reconquista:0 "[GetSituationByKey('rome_reconquista').GetNameWithNoTooltip]"
 hint_rome_reconquista_hint_text:0 "#T Trigger & Overview#!\n@hint! Activates as Byzantium's overarching strategic framework for reclaiming the historic Roman world across nine regional theaters.\n\n#T Core Goal#!\n@hint! Maintain Imperial Fervour, plan regional campaigns in the Roman World organization, and launch focused Reconquest Campaigns one theater at a time.\n\n#T Resolution#!\n@hint! Complete the reconquest theaters or formally close the Roman Reconquest era through the umbrella progression milestones."
 hint_oe_hc_egypt:0 "[GetSituationByKey('oe_hc_egypt').GetNameWithNoTooltip]"
 hint_oe_hc_egypt_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Egypt & Levant Reconquest Campaign proclamation. Visible to the Imperial bloc, regional targets, and neighbors.\n\n#T Core Goal#!\n@hint! Byzantium drives Campaign Progress toward 100 by capturing Levantine and Nile strongholds; defenders push Campaign Pressure up to exhaust the offensive.\n\n#T Key Actions & Resolution#!\n@hint! Use the panel actions to dispatch Imperial Offensive Supply or rally Regional Coalition Resistance. The campaign concludes upon regional peace or victory."
 hint_oe_hc_africa:0 "[GetSituationByKey('oe_hc_africa').GetNameWithNoTooltip]"
 hint_oe_hc_africa_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Maghreb & Africa Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Push Campaign Progress across Carthage and North African coastal forts while preventing local resistance from driving Campaign Pressure to breaking point.\n\n#T Key Actions & Resolution#!\n@hint! Both attackers and Maghrebi defenders have dedicated supply and coalition-resistance actions in this panel. Ends when the Africa campaign resolves."
 hint_oe_hc_italy:0 "[GetSituationByKey('oe_hc_italy').GetNameWithNoTooltip]"
 hint_oe_hc_italy_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Italian Peninsula Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Advance imperial control from southern Italy toward Rome and Lombardy while countering Italian league resistance.\n\n#T Key Actions & Resolution#!\n@hint! Use Imperial Offensive Supply or Regional Coalition Resistance directly from the situation panel. Ends upon campaign victory or peace."
 hint_oe_hc_france:0 "[GetSituationByKey('oe_hc_france').GetNameWithNoTooltip]"
 hint_oe_hc_france_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Gaul / France Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Overcome dense Western European fortresses to raise Campaign Progress before coalition attrition raises Campaign Pressure too high.\n\n#T Key Actions & Resolution#!\n@hint! Trigger Imperial Offensive Supply as Byzantium/Rome or Regional Coalition Resistance as a defender. Ends once the Gaul campaign concludes."
 hint_oe_hc_iberia:0 "[GetSituationByKey('oe_hc_iberia').GetNameWithNoTooltip]"
 hint_oe_hc_iberia_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Hispania / Iberia Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Secure Iberian ports and interior strongholds to push Campaign Progress while countering rugged highland resistance.\n\n#T Key Actions & Resolution#!\n@hint! Use the panel's Imperial Offensive Supply and Regional Coalition Resistance actions every 3 years. Ends upon campaign settlement."
 hint_oe_hc_britain:0 "[GetSituationByKey('oe_hc_britain').GetNameWithNoTooltip]"
 hint_oe_hc_britain_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Britannia Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Sustain cross-Channel logistics to drive Campaign Progress in Britain while defenders exploit maritime attrition to spike Campaign Pressure.\n\n#T Key Actions & Resolution#!\n@hint! Both sides can invoke their dedicated situation actions inside this panel. Ends once the Britannia theater settles."
 hint_oe_hc_persia:0 "[GetSituationByKey('oe_hc_persia').GetNameWithNoTooltip]"
 hint_oe_hc_persia_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Persia & Mesopotamia Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Advance across the Tigris-Euphrates and Iranian plateau to fill Campaign Progress while managing high eastern supply strain.\n\n#T Key Actions & Resolution#!\n@hint! Use Imperial Offensive Supply or Regional Coalition Resistance in the panel to swing momentum. Ends when the Persian campaign concludes."
 hint_oe_hc_blacksea:0 "[GetSituationByKey('oe_hc_blacksea').GetNameWithNoTooltip]"
 hint_oe_hc_blacksea_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Pontic & Black Sea Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Lock down Crimea, the Pontic steppe littoral, and Caucasus gateways to drive Campaign Progress while fending off steppe-coalition pressure.\n\n#T Key Actions & Resolution#!\n@hint! Activate Imperial Offensive Supply or Regional Coalition Resistance from the situation actions below. Ends upon theater conclusion."
 hint_oe_hc_arabia:0 "[GetSituationByKey('oe_hc_arabia').GetNameWithNoTooltip]"
 hint_oe_hc_arabia_hint_text:0 "#T Trigger & Overview#!\n@hint! Activated by Byzantium's Arabia & Red Sea Reconquest Campaign proclamation.\n\n#T Core Goal#!\n@hint! Secure Hejaz and desert caravan nodes to drive Campaign Progress while preventing desert attrition from pushing Campaign Pressure to the limit.\n\n#T Key Actions & Resolution#!\n@hint! Use Imperial Offensive Supply as the Empire or Regional Coalition Resistance as a regional defender. Ends once the Arabian campaign concludes."
 hint_oe_sit_northern_crusade:0 "[GetSituationByKey('oe_sit_northern_crusade').GetNameWithNoTooltip]"
 hint_oe_sit_northern_crusade_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers before 1480 while the Teutonic/Livonian Order and Poland/Lithuania contest the Baltic frontier.\n\n#T Core Goal#!\n@hint! Tug Crusade Momentum (0–100): reach 80+ (or capture Vilnius, Warsaw, and charter 2+ Ordensmarks) for Order Victory; drop Momentum to 15 or below (or seize Malbork as PLC) for Polish-Lithuanian Victory; or reach 1525 for a Baltic Settlement.\n\n#T Key Actions#!\n@hint! Order states recruit German Guest Crusaders and fortify Ordensburgen (+Momentum); Poland-Lithuania rally Defensive Levies and petition Papal Arbitration (-Momentum); Baltic/HRE observers subsidize frontier trade."
 hint_oe_sit_manchu_pass:0 "[GetSituationByKey('oe_sit_manchu_pass').GetNameWithNoTooltip]"
 hint_oe_sit_manchu_pass_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers in 1580–1680 when a unified Jurchen/Manchu contender confronts a stressed Central Plains dynasty (Ming or Yuan) across Shanhaiguan.\n\n#T Core Goal#!\n@hint! Watch Pass Breach Pressure (0–100): Manchu wins by seizing Dadu or breaking through the Shanhaiguan-Ningyuan corridor; the defender wins by holding the Guanning line for 15 years or retaking Liaodong; prolonged deadlock leads to a Great Wall Partition.\n\n#T Key Actions#!\n@hint! Manchu mobilizes Eight-Banner Vanguards and courts Liaodong Defectors (+Pressure); Ming/Yuan reinforce Shanhaiguan and levy Bohai Frontier Supplies (-Pressure); East Asian observers hedge diplomacy and trade."
 hint_oe_sit_three_feudatories:0 "[GetSituationByKey('oe_sit_three_feudatories').GetNameWithNoTooltip]"
 hint_oe_sit_three_feudatories_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers in 1668–1740 when Manchu/Qing rules Beijing and substantial southern Chinese territory.\n\n#T Core Goal#!\n@hint! Qing seeks to raise Pacification Progress to 80+ (or cut Rebellion Tension to 15 or below) to abolish the Three Feudatories; if Tension hits 90+ or Qing loses Beijing, southern autonomy triumphs; moderate progress after 8 years yields a negotiated pacification.\n\n#T Key Actions#!\n@hint! Qing deploys Banner Expeditions, offers Amnesty to Generals, and fortifies the Yangtze; neighboring observers and Ming loyalists can fund Southern Smuggling (+Tension/-Progress) or hedge regional maritime trade."
 hint_oe_sit_twilight_of_empires:0 "[GetSituationByKey('oe_sit_twilight_of_empires').GetNameWithNoTooltip]"
 hint_oe_sit_twilight_of_empires_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers in the late modern era when colonial independence contagion collides with gunpowder-empire modernization pressure.\n\n#T Core Goal#!\n@hint! Track Modernization Reform, Colonial Liberty Contagion, and Concert Stability. Push reform high to achieve Imperial Renewal, let liberty surge to trigger Decolonization, or balance the great powers into a Concert of Empires.\n\n#T Key Actions#!\n@hint! Use the situation actions to enact constitutional/fiscal reforms, pacify overseas colonies, or back revolutionary independence movements."
 hint_oe_sit_eurasian_great_war:0 "[GetSituationByKey('oe_sit_eurasian_great_war').GetNameWithNoTooltip]"
 hint_oe_sit_eurasian_great_war_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers in 1750–1836 when rival Eurasian great-power blocs collide in a multi-theater global war.\n\n#T Core Goal#!\n@hint! Contest the Hegemon vs. Coalition Balance bar, five regional theaters, and War Exhaustion. Drive Balance to an extreme for Unipolar Hegemony, achieve a Vienna-style Concert, unleash a Revolutionary New Order, or reach the 1835 Compromise Congress.\n\n#T Key Actions#!\n@hint! Use bloc mobilization, theater offensives, war subsidies, and congress diplomacy actions below to tip the strategic balance."
 hint_oe_rise_of_rus:0 "[GetSituationByKey('oe_rise_of_rus').GetNameWithNoTooltip]"
 hint_oe_rise_of_rus_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers before 1637 while East Slavic principalities compete to unite Rus' as Golden Horde hegemony weakens.\n\n#T Core Goal#!\n@hint! Top-ranked Rus' powers accumulate rank, territory, and Orthodox authority to form Russia (RUS) before the Age of Absolutism closes the era.\n\n#T Key Actions#!\n@hint! Leading Rus' princes pay tribute, purchase minors, contest rivals, and unify Russia; Byzantium grants Metropolitan seats and mercenaries; Lithuania eyes Kyiv; minor principalities and neighbors fortify marches and run Novgorod-Volga fur diplomacy."
 hint_oe_russian_ambition:0 "[GetSituationByKey('oe_russian_ambition').GetNameWithNoTooltip]"
 hint_oe_russian_ambition_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers after Russia (RUS) is formed and the Rise of Rus' concludes, launching Russia's imperial expansion across the steppe, Siberia, and Eastern Europe.\n\n#T Core Goal#!\n@hint! Russia pursues frontier governorates, St. Petersburg, Oprichnina centralization, and steppe/Siberian conquests; rivals seek to contain or break Russian power.\n\n#T Key Actions#!\n@hint! Russia uses its 9 expansion and governance actions; non-Russian observers and neighbors can build Frontier Bulwarks, coordinate Counter-Diplomacy, and hire Steppe & Cossack Riders."
 hint_oe_sit_byz_renaissance:0 "[GetSituationByKey('oe_sit_byz_renaissance').GetNameWithNoTooltip]"
 hint_oe_sit_byz_renaissance_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers during the Palaiologan cultural revival across the Eastern Mediterranean and Italy.\n\n#T Core Goal#!\n@hint! Advance Renaissance Flourishing toward the top threshold while steering the ideological axis between Hellenic Classical Revival and Orthodox Hesychast Synthesis.\n\n#T Key Actions#!\n@hint! Invite Greek scholars, sponsor imperial academies, and host theological-philosophical patronage debates to lock in your preferred cultural triumph."
 hint_oe_sit_eastern_crossroads:0 "[GetSituationByKey('oe_sit_eastern_crossroads').GetNameWithNoTooltip]"
 hint_oe_sit_eastern_crossroads_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers when major powers contest the Pontic-Carpathian-Ruthenian crossroads linking Poland-Lithuania, Rus', Byzantium, and the steppe.\n\n#T Core Goal#!\n@hint! Shift Crossroads Dominance in your bloc's favor by holding key river gateways and rallying border allies until one regional order prevails.\n\n#T Key Actions#!\n@hint! Reinforce border garrisons, forge Cossack frontier pacts, and align regional diplomacy via the actions below."
 hint_oe_sit_glh_troubles:0 "[GetSituationByKey('oe_sit_glh_troubles').GetNameWithNoTooltip]"
 hint_oe_sit_glh_troubles_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers before 1490 when the Golden Horde enters its Great Troubles (1360+ or internal cohesion collapse).\n\n#T Core Goal#!\n@hint! The Golden Horde strives to restore Horde Cohesion (85+) for a Steppe Revival; Russian and steppe rivals push for Horde fragmentation into successor khanates.\n\n#T Key Actions#!\n@hint! Rally ulus riders, grant wing autonomy, or exploit rival succession strife through the situation actions below."
 hint_oe_sit_two_emperors:0 "[GetSituationByKey('oe_sit_two_emperors').GetNameWithNoTooltip]"
 hint_oe_sit_two_emperors_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers in 1520–1790 when a resurgent Eastern Roman Empire (BYZ/ROM) pushes westward into direct rivalry with the Holy Roman Emperor.\n\n#T Core Goal#!\n@hint! Contest Imperial Legitimacy Balance (0–100): reach 85+ (or hold hegemony for 12 months) for Unus Imperator and safe HRE dismantling; let Western balance dominate for HRE Vindication; or negotiate a Two-Romes Concord.\n\n#T Key Actions#!\n@hint! Issue Translatio Edicts, court Papal Arbitration, rally the Imperial Diet, or enlist French and Protestant counterweights using the actions below."
 hint_oe_sit_yuan_restoration:0 "[GetSituationByKey('oe_sit_yuan_restoration').GetNameWithNoTooltip]"
 hint_oe_sit_yuan_restoration_hint_text:0 "#T Trigger & Overview#!\n@hint! Triggers before 1415 once Great Yuan (CHI) survives or moves past the Red Turban Rebellions and opens the Zhizheng Restoration track.\n\n#T Core Goal#!\n@hint! Drive Restoration Progress to 80+ to proclaim Great Yuan Restored while balancing the court between Han-Law Reformers (0) and Steppe Conservatives (100).\n\n#T Key Actions#!\n@hint! Enact Han-Law Reforms, summon Steppe Banners, and collect East Asian Vassal Tribute in the actions panel to raise progress and manage court balance."
