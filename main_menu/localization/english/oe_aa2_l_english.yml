l_english:
# NEW 2026-11-22 v17.0 Across Eras & Symphonies — Module 17.0-C1: Africa & Americas Finale Units, Events & Modifiers Localization (english) (oe_aa2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v170_africa_americas.py; edit the generator, not this file.
 oe_aa2_mali_sofa_cavalry:0 "Mali-Songhai Sofa Armored Cavalry"
 oe_aa2_mali_sofa_cavalry_desc:0 "Elite quilted-armor and mail horsemen of the Sahelian imperial retinue, famed for devastating shock charges across the Niger grasslands and arid caravan roads."
 oe_aa2_kilwa_dhow:0 "Swahili Kilwa Armed Dhow"
 oe_aa2_kilwa_dhow_desc:0 "Ocean-going lateen-rigged Swahili war dhow stitched from East African hardwood and fitted with bronze swivel guns to dominate monsoon currents and coastal narrows."
 oe_aa2_iroquois_forest_rangers:0 "Haudenosaunee Woodland Rangers"
 oe_aa2_iroquois_forest_rangers_desc:0 "Swift Haudenosaunee light infantry blending ancestral forest scouting with Dutch and English trade flintlocks to ambush heavier formations across woods and hills."
 oe_aa2_maya_holkan_warriors:0 "Maya Holkan Noble Infantry"
 oe_aa2_maya_holkan_warriors_desc:0 "Veteran professional Holkan soldiers of Yucatan and Peten clad in brine-hardened cotton armor and wielding obsidian-edged macanas across dense limestone jungle."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev1_a:0 "Golden Pilgrimage Patronage"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev1_a:0 "Bullion reserves and lavish imperial patronage draw architects, jurists, and caravan princes from across the Sahara."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev1_b:0 "Gilded Sofa Royal Retinue"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev1_b:0 "Royal gold pays for quilted horse armor, imported Barbary steeds, and fortified grain depots along the upper Niger."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev2_a:0 "Sankore Manuscript Scriptoria"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev2_a:0 "Funded calligraphers and bookbinders turn Timbuktu into a radiant beacon of Sahelian science and literacy."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev2_b:0 "Sankore Provincial Qadi Network"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev2_b:0 "Learned magistrates trained in Timbuktu codify commercial contracts, settle estate disputes, and tighten imperial authority."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev3_a:0 "Askia Imperial Chancellery"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev3_a:0 "Dedicated royal ministries for agriculture, waterways, and taxation bind distant Niger provinces under swift central command."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev3_b:0 "Chartered Wangara Caravan Guilds"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev3_b:0 "Empowered Wangara and Dyula merchant houses expand overland credit, boosting customs receipts and urban prosperity."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev4_a:0 "Hi-Koi Niger River Admiralty"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev4_a:0 "Patrolling war canoes move imperial troops rapidly along the Niger bend, outflanking steppe raiders and guarding customs tolls."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev4_b:0 "Niger Riverine Granary Fleet"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev4_b:0 "Fleet convoys haul rice, millet, and kola nuts from the fertile inland delta to Timbuktu and Gao year-round."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev5_a:0 "Sahelian Gunpowder Modernization"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev5_a:0 "Crown arsenals purchase matchlocks via Atlantic and Tripolitanian traders, fusing Sahelian mobility with disciplined volley fire."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev5_b:0 "Fortified Sahelian Wells"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev5_b:0 "Garrisoned oasis redoubts and fast desert screens bleed invading columns dry before they reach the Niger crossings."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev6_a:0 "Imperial Gold-Salt Monopoly"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev6_a:0 "State-guarded azalai salt convoys exchange desert slabs weight-for-weight for alluvial gold, swelling the imperial treasury."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev6_b:0 "Dual Sahel-Atlantic Exchange"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev6_b:0 "By linking inland caravan depots with Atlantic coastal factors on equal terms, West African workshops absorb modern tools and credit."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev7_a:0 "Splendor of Husuni Kubwa"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev7_a:0 "Sumptuous coral-stone audience halls and bonded merchant warehouses draw envoys and shipmasters across the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev7_b:0 "Kilwa Sultanate Trade Coinage"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev7_b:0 "Uniform Swahili mints grease daily exchange from Sofala to Lamu, boosting customs collection and merchant liquidity."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev8_a:0 "Mu'allim Monsoon Dhow Guild"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev8_a:0 "Coir-sewn armed dhows and seasoned star navigators patrol reef channels and project Swahili maritime presence far offshore."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev8_b:0 "Indian Ocean Monsoon Factorias"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev8_b:0 "Permanent Swahili merchant agents overseas smooth seasonal price swings and open distant spice and porcelain markets."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev9_a:0 "Sofala Gold & Ivory Monopoly"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev9_a:0 "Protected warehouses and cordial treaties with inland plateau rulers guarantee an uninterrupted flow of gold and ivory."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev9_b:0 "Swahili Coral Stone Shipyards"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev9_b:0 "Expanded timber yards and stone slipways accelerate fleet construction and double maritime manpower along the coast."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev10_a:0 "Swahili Counter-Armada Batteries"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev10_a:0 "Shallow-draft cannon dhows and coral-block sea fortresses ambush lumbering foreign carracks inside treacherous reef channels."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev10_b:0 "Anti-Cartaz Monsoon Coalition"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev10_b:0 "Coordinated envoys align East African sultans with Red Sea and Indian spice ports to share naval intelligence and gunsmiths."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev11_a:0 "Stone-Town Maritime Commonwealth"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev11_a:0 "Shared harbor charters, unified admiralty signals, and mutual merchant courts lift every Swahili port in concert."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev11_b:0 "Centralized Swahili Customs Board"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev11_b:0 "Royal harbor intendants enforce uniform tariffs from Pate to Sofala, channeling wealth straight into a standing fleet."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev12_a:0 "Sovereign Monsoon Thalassocracy"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev12_a:0 "Unrivaled naval projection across the Mozambique Channel and Somali Sea secures total dominance over East African trade."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev12_b:0 "Tricontinental Coral Clearinghouse"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev12_b:0 "Open bond markets, marine insurance guilds, and cosmopolitan quarters make the Swahili coast an indispensable global hub."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev13_a:0 "Royal Brass & Ivory Guilds"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev13_a:0 "Exquisite brass plaques, ivory saltcellars, and woven luxury textiles elevate royal prestige and command premium prices abroad."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev13_b:0 "Great Earthworks & Royal Ramparts"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev13_b:0 "Vast concentric ramparts, moats, and cleared forest avenues turn our capital into an unassailable fortress-metropolis."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev14_a:0 "Atlantic Sovereign Embassies"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev14_a:0 "Educated royal envoys negotiate as crowned equals in Lisbon and Rome, returning with printing presses, Latin literacy, and maps."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev14_b:0 "Guarded Sovereign Port Charters"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev14_b:0 "Foreign merchants are confined to licensed river ports under royal customs officers, safeguarding domestic harmony and legitimacy."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev15_a:0 "Royal Equatorial Musket Guard"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev15_a:0 "Drilled standing musketeers and royal gunsmiths repair barrels locally, deterring both foreign encroachment and internal rebellion."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev15_b:0 "Crown Gunpowder Monopoly"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev15_b:0 "Every barrel of powder and brass piece passes exclusively through royal customs houses, curbing provincial defiance."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev16_a:0 "Royal Anti-Slave Sovereignty Edict"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev16_a:0 "Royal boarding inspectors free unlawful captives and expel predatory slavers, protecting demographic strength and moral authority."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev16_b:0 "Equatorial Commodity Trade Pivot"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev16_b:0 "Directing foreign demand toward West and Central African pepper, woven raffia, copper, and wax builds durable legitimate commerce."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev17_a:0 "Equatorial River Market Network"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev17_a:0 "Royal canoe stations and toll bridges stitch rainforest provinces together, accelerating trade and provincial development."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev17_b:0 "Equatorial Metallurgy & Looms"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev17_b:0 "Skilled smiths and weavers supply domestic markets with superior tools and cloth, reducing dependence on foreign imports."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev18_a:0 "Equatorial Constitutional Renaissance"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev18_a:0 "A published constitutional code, multilingual archives, and technical colleges cement lasting institutional vitality."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev18_b:0 "Sovereign Atlantic Bastion Fleet"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev18_b:0 "Modern masonry harbor forts and domestically owned ocean vessels project Central-West African power across the South Atlantic."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev19_a:0 "Great Tree of Peace Concord"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev19_a:0 "The Great Law of Peace replaces endless vendettas with federal harmony, swelling tribal cohesion and civic vigor."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev19_b:0 "Five-Arrow Military Confederacy"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev19_b:0 "Five arrows bound together cannot be snapped; coordinated war chiefs muster disciplined woodland hosts in unison."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev20_a:0 "Onondaga Federal Consensus"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev20_a:0 "Balanced matrilineal oversight and unanimous federal counsel prevent tyranny and stabilize every canton of the Longhouse."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev20_b:0 "Wampum Archive & Orator Corps"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev20_b:0 "Trained wampum keepers preserve every treaty word for word, making Haudenosaunee diplomacy legendary across the continent."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev21_a:0 "Flintlock Woodland Ranger Parity"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev21_a:0 "Haudenosaunee marksmen master rapid loading and aimed forest volley fire, outmatching European regulars in wooded terrain."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev21_b:0 "Multi-Post Fur Brokerage"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev21_b:0 "By auctioning beaver furs between rival coastal factors, Longhouse traders capture immense surpluses and diplomatic leverage."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev22_a:0 "Great Lakes Portage Hegemony"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev22_a:0 "Swift canoe task forces and ranger columns command every portage from Niagara to Detroit, channeling northern furs through Onondaga."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev22_b:0 "Extended Rafters Population Renewal"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev22_b:0 "Following the Mourning War ethos of renewal, the Confederacy welcomes newcomers as full citizens, replenishing villages and fields."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev23_a:0 "Brightened Silver Covenant Chain"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev23_a:0 "Formal treaty guarantees, neutral trade corridors, and European diplomatic recognition safeguard Haudenosaunee borders."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev23_b:0 "Palisade & Gunsmith Bastions"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev23_b:0 "Bastianed palisade towns and Haudenosaunee gunsmiths make the Five Nations homeland impregnable against every colonial army."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev24_a:0 "Turtle Island Constitutional Union"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev24_a:0 "A bilingual printed constitution, federal courts, and civic academies inspire peoples across both hemispheres."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev24_b:0 "Great Lakes Sovereign Industry"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev24_b:0 "Lake shipyards, ironworks, and Three-Sisters agronomy transform the Confederacy into an unshakable continental power."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev25_a:0 "Restored League of Mayapan"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev25_a:0 "Shared civic governance and royal hostage harmony heal dynastic feuds across the northern peninsula."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev25_b:0 "Mayapan Holkan War Banner"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev25_b:0 "Professional cotton-armored Holkan companies answer directly to the League's war captain, enforcing unity by spear and obsidian blade."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev26_a:0 "Maya Astronomical Almanac Academy"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev26_a:0 "Preserved bark-paper almanacs, zero-place mathematics, and disciplined astronomy elevate Mayan scholarship and cultural prestige."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev26_b:0 "Cenote & Almanac Agronomy"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev26_b:0 "Synchronizing milpa planting, karst cenote reservoirs, and terraced lowlands multiplies maize and squash harvests across Yucatan."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev27_a:0 "Caribbean Maya Canoe Fleet"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev27_a:0 "Coastal lighthouses at Tulum and Ekab guide booming sea lanes linking Gulf salt pans with southern cacao plantations."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev27_b:0 "Mayapan Cacao & Jade Exchange"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev27_b:0 "Verified weights and royal market judges curb counterfeit cacao beans, boosting customs revenues and artisan prosperity."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev28_a:0 "Mayan Botanical Quarantine"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev28_a:0 "Healers deploy herbal steam baths, clean cenote protocols, and dispersed forest hamlets, dramatically blunting transoceanic pestilence."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev28_b:0 "Steel-Armed Holkan Veterans"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev28_b:0 "Mayan smiths adapt captured iron blades, pikes, and matchlocks to jungle warfare, turning enemy weapons against invaders."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev29_a:0 "Sacbe Jungle Citadel Network"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev29_a:0 "Interlocking stone citadels and rapid white-road logistics make Yucatan and Peten an impenetrable tropical fortress."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev29_b:0 "Yucatan Coastal Cannon Bastions"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev29_b:0 "Limestone batteries guarding Campeche and the Caribbean reefs repel pirate raids and protect Mayan merchant convoys."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev30_a:0 "Second Mayan Golden Age"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev30_a:0 "Renewed observatories, botanical colleges, and bilingual presses place Maya civilization in the vanguard of global learning."
 STATIC_MODIFIER_NAME_oe_aa2_mod_ev30_b:0 "Yucatan-Peten Sovereign Commonwealth"
 STATIC_MODIFIER_DESC_oe_aa2_mod_ev30_b:0 "Modernized Caribbean shipyards, fertile terrace estates, and disciplined garrisons secure Mayan primacy across the Gulf."
 oe_aa2.1.title:0 "Mansa Musa's Golden Legacy"
 oe_aa2.1.desc:0 "Caravan chronicles from Cairo to Fez still speak in awe of the Mali sovereign whose golden pilgrimage reshaped Mediterranean bullion markets. At court in the Niger basin, griots and treasurers debate how best to steward the royal goldfields of Bambuk and Bure."
 oe_aa2.1.a:0 "Uphold the Royal Gold Standard & Patronage"
 oe_aa2.1.b:0 "Channel Bullion into Armored Sofa Retinues"
 oe_aa2.2.title:0 "Scholars of Timbuktu & Sankore"
 oe_aa2.2.desc:0 "Camel trains arrive in Timbuktu laden not only with desert salt slabs but with treatises on astronomy, medicine, poetry, and jurisprudence from Andalusia and Egypt. The mud-brick courtyards of Sankore and Jingereber are overflowing with eager students."
 oe_aa2.2.a:0 "Endow Sankore Manuscript Scriptoria"
 oe_aa2.2.b:0 "Dispatch Trained Qadi Magistrates to the Provinces"
 oe_aa2.3.title:0 "Songhai Askia Administration"
 oe_aa2.3.desc:0 "As Sahelian dominions stretch from the Atlantic rivers to the great bend of the Niger, hereditary clan tributes strain to govern bustling caravan towns. Reformist ministers propose salaried imperial governors, uniform weights, and dedicated treasury inspectors."
 oe_aa2.3.a:0 "Establish Salaried Askia Provinces & Inspectors"
 oe_aa2.3.b:0 "Charter Self-Governing Caravan Guilds"
 oe_aa2.4.title:0 "The Niger River War Fleet"
 oe_aa2.4.desc:0 "Stretching over a thousand leagues through arid savanna, the Niger River is both lifeline and highway of empire. Shipwrights at Kabara and Gao have crafted long war canoes able to ferry entire cavalry squadrons, grain barges, and riverine archers at remarkable speed."
 oe_aa2.4.a:0 "Commission the Hi-Koi River Admiralty"
 oe_aa2.4.b:0 "Expand Commercial Grain & Timber Barges"
 oe_aa2.5.title:0 "Moroccan Musketeer Threat Across the Sands"
 oe_aa2.5.desc:0 "Scouts arriving from the Taghaza salt pans report alarming rumors: Maghrebi sultans are assembling Andalusi renegade arquebusiers and cast brass cannon for a daring strike across the Sahara. Our proud lance-armed nobility must confront the coming age of gunpowder."
 oe_aa2.5.a:0 "Equip Sofa Horsemen & Foot with Imported Matchlocks"
 oe_aa2.5.b:0 "Fortify Desert Wells & Scorch the Approaches"
 oe_aa2.6.title:0 "Sahel Gold-Salt Revival"
 oe_aa2.6.desc:0 "While European caravels hug the Atlantic coast, our disciplined patrols and revived salt works at Taghaza and Taoudenni have restored confidence across the great inland trade highways. Gold dust, kola, textiles, and scholarly books once again converge on the Niger bend."
 oe_aa2.6.a:0 "Enforce Crown Salt-Gold Caravan Monopolies"
 oe_aa2.6.b:0 "Open Dual Atlantic-Saharan Trade Exchanges"
 oe_aa2.7.title:0 "Husuni Kubwa Coral Palace"
 oe_aa2.7.desc:0 "Carved from gleaming marine porites coral overlooking Kilwa harbor, the hundred-room cliffside palace of Husuni Kubwa astonishes travelers from Tangier to Hormuz. Its octagonal bathing pool, vaulted domes, and vast merchant courtyard proclaim Swahili splendor."
 oe_aa2.7.a:0 "Expand the Cliffside Emporium & Royal Audiences"
 oe_aa2.7.b:0 "Strike Silver & Copper Kilwa Trade Coinage"
 oe_aa2.8.title:0 "Monsoon Wind Dhows & Star Pilots"
 oe_aa2.8.desc:0 "Each winter the Kaskazi winds carry dhows southward from Arabia and Gujarat; each spring the Kusi winds speed East African cargoes north again. Master Swahili mu'allim pilots now chart every coral shoal and star latitude across the western Indian Ocean."
 oe_aa2.8.a:0 "Charter Armed Dhow Squadrons & Navigation Guilds"
 oe_aa2.8.b:0 "Establish Monsoon Warehouses in Aden & Gujarat"
 oe_aa2.9.title:0 "Sofala Gold & Interior Ivory"
 oe_aa2.9.desc:0 "Down from the stone-walled Zimbabwe plateau come seasoned porters bearing alluvial gold dust, copper ingots, and fine ivory tusks to the coastal entrepot of Sofala. Controlling this southern terminus turns our northern coral ports into the wealthiest hubs of Africa."
 oe_aa2.9.a:0 "Fortify the Sofala Gold Depot & Zambezi Roads"
 oe_aa2.9.b:0 "Reinvest Gold Revenues into Coral Shipyards"
 oe_aa2.10.title:0 "Confronting European Armadas"
 oe_aa2.10.desc:0 "Tall-masted European carracks armed with broadside bronze cannon have rounded the Cape of Good Hope, demanding tribute and cartaz sailing passes from every Swahili sultan. Either we adapt our ships and harbor batteries at once, or our ancient monsoon trade will fall into foreign hands."
 oe_aa2.10.a:0 "Mount Swivel Cannon on Armed Dhows & Coral Forts"
 oe_aa2.10.b:0 "Forge an Anti-Cartaz Indian Ocean League"
 oe_aa2.11.title:0 "Swahili Stone-Town League"
 oe_aa2.11.desc:0 "For centuries the gleaming stone towns from Lamu and Malindi to Mombasa, Zanzibar, and Kilwa competed fiercely over monsoon customs. Faced with oceanic empires, merchant patricians and coastal nobles now gather to craft a durable maritime commonwealth."
 oe_aa2.11.a:0 "Federate the Stone-Town Maritime Councils"
 oe_aa2.11.b:0 "Centralize Coastal Customs Under the Crown"
 oe_aa2.12.title:0 "Indian Ocean Thalassocracy"
 oe_aa2.12.desc:0 "Swahili copper-bottomed frigates and lateen escort squadrons now ride alongside East African merchantmen from the Cape to Malabar and the Strait of Malacca. Poets compose Swahili epics in Arabic script celebrating an unbroken oceanic empire."
 oe_aa2.12.a:0 "Proclaim Sovereign Mastery of the Western Monsoon"
 oe_aa2.12.b:0 "Make Kilwa the Free Clearinghouse of Three Continents"
 oe_aa2.13.title:0 "Royal Brass Casters & Master Guilds"
 oe_aa2.13.desc:0 "Inside the walled royal quarters, master founders pour molten brass into intricate lost-wax molds, casting court plaques, royal portraits, and ceremonial bells of breathtaking precision. Ivory carvers and raffia weavers likewise clamor for royal guild charters."
 oe_aa2.13.a:0 "Charter the Igun Eronmwon Royal Bronze & Ivory Guilds"
 oe_aa2.13.b:0 "Raise Monumental Earthwork Walls & Royal Roads"
 oe_aa2.14.title:0 "Sovereign Diplomatic Letters to Europe & Rome"
 oe_aa2.14.desc:0 "Foreign caravels have anchored off the Congo estuary and the Bight of Benin, carrying silk, mirrors, and envoys from distant European monarchs. Rather than accepting humble vassalage, our court scribes prepare proud letters asserting sovereign parity and requesting master builders, printers, and scholars."
 oe_aa2.14.a:0 "Dispatch Sovereign Royal Ambassadors & Scholars"
 oe_aa2.14.b:0 "Guard Ancestral Councils & Selective Port Treaties"
 oe_aa2.15.title:0 "Atlantic Firearms & Royal Sovereignty"
 oe_aa2.15.desc:0 "Matchlock muskets, iron barrels, and kegs of black powder have entered coastal river markets, threatening to upset the delicate balance between provincial governors and the crown. The king must decide how to master modern weaponry without letting unruly warlords arm themselves."
 oe_aa2.15.a:0 "Establish Royal Musket Guard & Iron Foundries"
 oe_aa2.15.b:0 "Enforce Strict Crown Monopoly on Imported Powder"
 oe_aa2.16.title:0 "Curbing the Atlantic Slave Trade"
 oe_aa2.16.desc:0 "Unscrupulous coastal brokers and foreign ship captains have begun seizing free subjects and even minor nobles to feed Atlantic plantation fleets, tearing at the social fabric of our villages. Outraged royal magistrates demand a decisive crown edict."
 oe_aa2.16.a:0 "Proclaim the Royal Anti-Slave Inspection Edict"
 oe_aa2.16.b:0 "Pivot Exports to Pepper, Cloth, Copper & Palm Oil"
 oe_aa2.17.title:0 "Rainforest Trade Corridors"
 oe_aa2.17.desc:0 "From the navigable reaches of the Congo River to the braided creeks of the Niger Delta, dugout flotillas and cleared forest trails carry copper crosses, iron hoes, salt, and smoked fish deep into the equatorial interior."
 oe_aa2.17.a:0 "Link Congo Basin & Gulf of Guinea River Markets"
 oe_aa2.17.b:0 "Expand Interior Copper, Iron & Textile Workshops"
 oe_aa2.18.title:0 "Equatorial Modern Kingdom"
 oe_aa2.18.desc:0 "Standing firm while rival coastal polities fractured under colonial pressure, our kingdom has fused ancient constitutional councils, world-renowned bronze artistry, literate chancellery archives, and disciplined firearms regiments into an unmistakable modern African great power."
 oe_aa2.18.a:0 "Codify a Sovereign Charter & Royal Academy"
 oe_aa2.18.b:0 "Build Star-Forts & Sovereign Atlantic Merchantmen"
 oe_aa2.19.title:0 "The Peacemaker & Hiawatha Wampum Belt"
 oe_aa2.19.desc:0 "After generations of blood feuds across the Finger Lakes and Mohawk Valley, the Peacemaker and Hiawatha stand beside the sacred shore holding purple-and-white wampum shells. Five nations are invited to bury their weapons beneath the Great White Pine and dwell together beneath one metaphorical Longhouse."
 oe_aa2.19.a:0 "Bury the Hatchet Beneath the Great Tree of Peace"
 oe_aa2.19.b:0 "Swear an Unbreakable Mutual Defense Confederacy"
 oe_aa2.20.title:0 "Council of Fifty Sachems at Onondaga"
 oe_aa2.20.desc:0 "Smoke rises from the central hearth at Onondaga as fifty hereditary Royaner sachems deliberate in solemn order: Mohawk and Seneca as Elder Brothers, Oneida and Cayuga as Younger Brothers, and Onondaga as Firekeepers weighing every voice until true unanimity is achieved."
 oe_aa2.20.a:0 "Affirm Clan Mother Oversight & Federal Consensus"
 oe_aa2.20.b:0 "Codify Wampum Diplomatic Archives & Envoys"
 oe_aa2.21.title:0 "Fur & Flintlock Diplomacy"
 oe_aa2.21.desc:0 "Transatlantic traders sailing up the Hudson and St. Lawrence crave glossy beaver pelts above all else, offering gleaming steel hatchets, wool blankets, and flintlock muskets in return. Our council must seize weapons parity without letting foreign posts dictate Longhouse policy."
 oe_aa2.21.a:0 "Equip Woodland Rangers with Trade Flintlocks"
 oe_aa2.21.b:0 "Play Competing Atlantic Trading Posts Against One Another"
 oe_aa2.22.title:0 "The Great Lakes Fur Wars"
 oe_aa2.22.desc:0 "As eastern beaver streams grow depleted, the rich northern lakes around Huron, Erie, and Ontario become the strategic prize of North America. Rival confederacies and their transatlantic backers contest every portage from Niagara to Mackinac."
 oe_aa2.22.a:0 "Assert Haudenosaunee Hegemony Over the Lake Portages"
 oe_aa2.22.b:0 "Extend the Rafters & Adopt Allied Peoples"
 oe_aa2.23.title:0 "The Silver Covenant Chain"
 oe_aa2.23.desc:0 "When Atlantic empires clash for supremacy over the eastern seaboard, envoys hasten to Onondaga bearing gifts to brighten the Covenant Chain. By holding the decisive balance between northern and southern powers, the Longhouse negotiates as a recognized sovereign arbiter."
 oe_aa2.23.a:0 "Polish the Covenant Chain on Equal Sovereign Terms"
 oe_aa2.23.b:0 "Fortify Mohawk-Ontario Castles & Gunsmith Lodges"
 oe_aa2.24.title:0 "Haudenosaunee Constitutional Confederacy"
 oe_aa2.24.desc:0 "Philosophers and statesmen across the Atlantic marvel at the ancient federal union of the Longhouse—its separation of civil and military authority, recallable delegates, and peaceful union of sovereign nations. Now the Grand Council stands ready to codify the Great Law for a new global era."
 oe_aa2.24.a:0 "Codify the Great Law into a Modern Federal Constitution"
 oe_aa2.24.b:0 "Forge an Industrial-Mercantile Shield of Turtle Island"
 oe_aa2.25.title:0 "League of Mayapan Restoration"
 oe_aa2.25.desc:0 "Within the nine-kilometer limestone ring wall of Mayapan, delegates from the great noble houses of Cocom, Xiu, Chel, and Itza convene beneath the painted temple of Kukulkan. Rivalries threaten to fracture Yucatan—unless the ancient Multepal joint-rule council is renewed with vigor."
 oe_aa2.25.a:0 "Renew the Multepal Joint Council of Yucatan"
 oe_aa2.25.b:0 "Raise Standing Holkan Noble Regiments"
 oe_aa2.26.title:0 "Dresden Astronomical Revival"
 oe_aa2.26.desc:0 "Seated atop stepped limestone observatories, Maya ah kin astronomer-priests calculate Venus synodic cycles and lunar eclipses to the very day, inscribing vigesimal zero mathematics onto lime-coated amate bark-paper folding almanacs."
 oe_aa2.26.a:0 "Endow Bark-Paper Scriptoria & Star Observatories"
 oe_aa2.26.b:0 "Align Agricultural Calendars & Cenote Irrigation"
 oe_aa2.27.title:0 "Cacao Currency & Coastal Trading Canoes"
 oe_aa2.27.desc:0 "Forty-foot cedar dugout canoes paddled by twenty-five oarsmen glide past Cozumel and the Bay of Honduras, stacked high with cotton mantles, salt from Emal, jade axes, obsidian blades, and prized cacao beans that serve as currency from Veracruz to Panama."
 oe_aa2.27.a:0 "Expand Seagoing Caribbean Canoe Flotillas"
 oe_aa2.27.b:0 "Standardize Cacao, Salt & Jade Clearinghouses"
 oe_aa2.28.title:0 "Resisting Epidemic & Steel"
 oe_aa2.28.desc:0 "Strange winged ships from across the eastern sunrise sea have brought both armored horsemen wielding Toledo steel and invisible fevers that sweep unchecked through crowded markets. Yet the decentralized jungle towns of Yucatan and Peten possess deep herbal lore and unforgiving terrain."
 oe_aa2.28.a:0 "Enforce Mayan Herbal Quarantine & Forest Dispersal"
 oe_aa2.28.b:0 "Reforge Captured Steel & Powder for Holkan Armories"
 oe_aa2.29.title:0 "Yucatan Stone Citadels"
 oe_aa2.29.desc:0 "Across the Puuc hills, the limestone cliffs of Tulum, and the island fortress of Noh Peten, Maya engineers have perfected layered stone bastions, concealed spiked pits, and interlocking sacbe white-stone causeways that let defenders strike and vanish into the canopy."
 oe_aa2.29.a:0 "Fortify Hilltop Bastions & Sacbe Ambush Roads"
 oe_aa2.29.b:0 "Erect Coastal Stone Harbor Forts & Cannon Batteries"
 oe_aa2.30.title:0 "Mesoamerican Mayan Renaissance"
 oe_aa2.30.desc:0 "Unbroken by conquest and enriched by selective exchange with the wider Atlantic world, Maya scholars print hieroglyphic and alphabetic treatises side by side while stepped limestone cities gleam once more from Chichen Itza to Lake Peten."
 oe_aa2.30.a:0 "Proclaim the Second Mayan Golden Age of Science"
 oe_aa2.30.b:0 "Unite the Yucatan-Peten Caribbean Commonwealth"
