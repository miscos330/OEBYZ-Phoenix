# NEW 2026-11-23 v21.0 Module E Part 1 (Worker 14A): 41 T2/T3 Mission Climax Events & 123 Static Modifiers (oe_m3e_). Generated by gen_v210_missions_t23.py.
 oe_m3e.1.t:0 "The Immortal Serenissima: Charter of the Maritime Federation"
 oe_m3e.1.d:0 "From the gilded Lion atop Piazza San Marco to the stone seawalls of Candia and the Lombard river cities, envoys of our maritime federation assemble before the Doge. No European coalition has forced a Campo Formio upon Venice; our [navy|e], Rialto [trade|e], and patrician [cabinet|e] stand unbroken as a sovereign [great_power|e]. Now the Grand Council must decide which pillar shall define the Serenissima's coming century."
 oe_m3e.1.a:0 "Crown the Stato da Mar: Permanent Arsenale Fleet & Levant Exchange"
 STATIC_MODIFIER_NAME_oe_m3e_ven_maritime_federation_mod:0 "Immortal Maritime Federation"
 STATIC_MODIFIER_DESC_oe_m3e_ven_maritime_federation_mod:0 "Standardized Arsenale slipways and federated Levantine ports secure Venetian primacy across Mediterranean sea lanes."
 oe_m3e.1.b:0 "Fortify the Terraferma Commonwealth & Lombard Industry"
 STATIC_MODIFIER_NAME_oe_m3e_ven_terraferma_shield_mod:0 "Terraferma Shield & Workshops"
 STATIC_MODIFIER_DESC_oe_m3e_ven_terraferma_shield_mod:0 "Alpine bastions and integrated Venetian-Lombard manufactories turn northern Italy into an unconquerable civic heartland."
 oe_m3e.1.c:0 "Enshrine the Aldine Republic of Letters & Glass Diplomacy"
 STATIC_MODIFIER_NAME_oe_m3e_ven_aldine_enlightenment_mod:0 "Aldine Enlightenment of Venice"
 STATIC_MODIFIER_DESC_oe_m3e_ven_aldine_enlightenment_mod:0 "Venetian presses, diplomatic envoys, and artistic ateliers radiate humanist influence across every European court."
 oe_m3e.2.t:0 "La Superba Unbound: Sovereign Clearinghouse of the Seas"
 oe_m3e.2.d:0 "Inside the Palazzo San Giorgio, gold scales never rest as bills of exchange from Lisbon, Antwerp, Kaffa, and Seville settle in Genoese scudi. With our [gold|e] vaults, guarded [trade|e] entrepots, and republican [navy|e] bound under one constitutional compact, Genoa stands as an independent [great_power|e]. The Doge and protectors of the Bank now set the enduring charter of our financial republic."
 oe_m3e.2.a:0 "Charter the Sovereign Clearinghouse of Europe"
 STATIC_MODIFIER_NAME_oe_m3e_gen_clearinghouse_mod:0 "San Giorgio Sovereign Clearinghouse"
 STATIC_MODIFIER_DESC_oe_m3e_gen_clearinghouse_mod:0 "Genoese bills and disciplined bullion reserves command Europe's credit markets with minimal inflation."
 oe_m3e.2.b:0 "Expand the Armed Maona Fleet & Black Sea Entrepots"
 STATIC_MODIFIER_NAME_oe_m3e_gen_maona_armada_mod:0 "Armed Maona Sea Network"
 STATIC_MODIFIER_DESC_oe_m3e_gen_maona_armada_mod:0 "Shareholder-funded escorts and fortified island entrepots keep Genoese shipping safe from Gibraltar to Crimea."
 oe_m3e.2.c:0 "Codify the Twenty-Eight Alberghi Civic Federation"
 STATIC_MODIFIER_NAME_oe_m3e_gen_alberghi_charter_mod:0 "Charter of the Eternal Alberghi"
 STATIC_MODIFIER_DESC_oe_m3e_gen_alberghi_charter_mod:0 "Constitutional harmony among Genoa's mercantile houses fuels tireless urban renewal and diplomatic stature."
 oe_m3e.3.t:0 "The May Third Crown: Tri-Sea Constitutional Commonwealth"
 oe_m3e.3.d:0 "Bells ring from Wawel to Warsaw, Vilnius, and Kyiv as the Great Sejm ratifies the Constitution of May Third without a single foreign bayonet daring to interfere. Freed from the paralytic veto, our [parliament|e], invincible [army|e], and thriving [trade|e] corridors bind the Baltic to the Black Sea as an unbreakable [great_power|e]. The Commonwealth now chooses the enduring vocation of its renewed crown."
 oe_m3e.3.a:0 "Proclaim the Sovereign Constitutional Sejm & Civic Liberty"
 STATIC_MODIFIER_NAME_oe_m3e_plc_may_third_charter_mod:0 "Constitution of May Third"
 STATIC_MODIFIER_DESC_oe_m3e_plc_may_third_charter_mod:0 "Majority legislation, secular academies, and civic enfranchisement forge Europe's premier constitutional monarchy."
 oe_m3e.3.b:0 "Immortalize the Winged Hussaria & Intermarium Shield"
 STATIC_MODIFIER_NAME_oe_m3e_plc_winged_hussars_mod:0 "Thunder of the Intermarium"
 STATIC_MODIFIER_DESC_oe_m3e_plc_winged_hussars_mod:0 "Modernized hussar lancers and registered steppe regiments stand ready to shatter any partition coalition."
 oe_m3e.3.c:0 "Crown the Vistula-Dnieper Granary & Multi-Faith Union"
 STATIC_MODIFIER_NAME_oe_m3e_plc_intermarium_union_mod:0 "Granary & Haven of Three Seas"
 STATIC_MODIFIER_DESC_oe_m3e_plc_intermarium_union_mod:0 "Religious peace and river-to-sea grain commerce bind Poles, Lithuanians, and Ruthenians in shared abundance."
 oe_m3e.4.t:0 "Order of the Dragon Triumphant: Eternal Danubian Crown"
 oe_m3e.4.d:0 "From the fortified hills of Buda to Belgrade's white ramparts and the high Carpathian passes, the Dragon emblem flies unbroken over Central Europe's greatest river kingdom. No disaster ever shattered our [army|e], our Corvinian [cultural_tradition|e], or our multi-confessional [parliament|e]; Hungary rises as an undisputed [great_power|e]. The royal diet convenes to seal the legacy of Saint Stephen's realm."
 oe_m3e.4.a:0 "Perpetuate the Standing Black Army & Border Bastions"
 STATIC_MODIFIER_NAME_oe_m3e_hun_black_army_mod:0 "Eternal Black Army of Buda"
 STATIC_MODIFIER_DESC_oe_m3e_hun_black_army_mod:0 "Royally paid professional regiments and river citadels turn the Carpathian basin into an impenetrable fortress."
 oe_m3e.4.b:0 "Crown the Carpathian Commonwealth of Crowns & Faiths"
 STATIC_MODIFIER_NAME_oe_m3e_hun_danubian_charter_mod:0 "Charter of the Danubian Peoples"
 STATIC_MODIFIER_DESC_oe_m3e_hun_danubian_charter_mod:0 "Confessional toleration and equitable royal charters unite Magyars, Slavs, Saxons, and Croats beneath one crown."
 oe_m3e.4.c:0 "Exalt the Corvinian Renaissance & Golden Forint Mint"
 STATIC_MODIFIER_NAME_oe_m3e_hun_corvinian_golden_mod:0 "Corvinian Golden Age"
 STATIC_MODIFIER_DESC_oe_m3e_hun_corvinian_golden_mod:0 "Royal academies, pure Forint coinage, and booming Danube river ports make Buda a radiant metropolis of arts and wealth."
 oe_m3e.5.t:0 "The Double-Headed White Eagle: Balkan Orthodox Imperium"
 oe_m3e.5.d:0 "From Kalemegdan's cliffs overlooking the Danube to Skopje, the monasteries of Pec, and the warm southern bays, the Serbian crown stands triumphant at Europe's oldest crossroads. Strengthened by Tsar Dusan's law, unbroken [religious_influence|e], and mountain-forged [army|e] valor, our realm commands respect as an enduring [great_power|e] and guardian of [legitimacy|e]. The imperial assembly now proclaims the guiding destiny of our Orthodox empire."
 oe_m3e.5.a:0 "Uphold the Sword of Dusan & Balkan Mountain Legions"
 STATIC_MODIFIER_NAME_oe_m3e_ser_dusan_legions_mod:0 "Iron Shield of the Balkans"
 STATIC_MODIFIER_DESC_oe_m3e_ser_dusan_legions_mod:0 "Mountain musketeers, heavy lancers, and Danube bastions render the Serbian heartland unconquerable."
 oe_m3e.5.b:0 "Exalt the Autocephalous Patriarchate & Orthodox Commonwealth"
 STATIC_MODIFIER_NAME_oe_m3e_ser_orthodox_commonwealth_mod:0 "Pillar of the Orthodox League"
 STATIC_MODIFIER_DESC_oe_m3e_ser_orthodox_commonwealth_mod:0 "The Patriarchate of Pec and sworn Balkan synods unite southeastern peoples in unshakeable spiritual and diplomatic solidarity."
 oe_m3e.5.c:0 "Expand the Silver Crossroads & Belgrade Enlightenment"
 STATIC_MODIFIER_NAME_oe_m3e_ser_silver_enlightenment_mod:0 "Silver & Letters of Belgrade"
 STATIC_MODIFIER_DESC_oe_m3e_ser_silver_enlightenment_mod:0 "Balkan silver mines, Adriatic-Danube caravans, and Cyrillic academies transform Serbia into a modern commercial crossroads."
 oe_m3e.6.t:0 "The Armillary Crown: Eternal Twin-Ocean Thalassocracy"
 oe_m3e.6.d:0 "Carreira naus heavy with Malabar pepper, Moluccan cloves, Chinese silk, and Brazilian gold drop anchor beneath Belem Tower as royal bells ring across Lisbon. From Ceuta and the Atlantic islands to Goa and Malacca, our [navy|e], global [trade|e] charters, and relentless [maritime_presence|e] place Portugal among the foremost [great_power|e] crowns. The royal council must choose how to steward this twin-ocean empire for generations ahead."
 oe_m3e.6.a:0 "Cement the Carreira da India & Global Spice Monopoly"
 STATIC_MODIFIER_NAME_oe_m3e_por_carreira_monopoly_mod:0 "Lords of the Carreira da India"
 STATIC_MODIFIER_DESC_oe_m3e_por_carreira_monopoly_mod:0 "Armored spice convoys and regulated Casa da India clearinghouses secure Portugal's oceanic trade empire."
 oe_m3e.6.b:0 "Fortify the Viceroyalty Chain & Oceanic Bombard Fleet"
 STATIC_MODIFIER_NAME_oe_m3e_por_estado_armada_mod:0 "Fortress Chain of the Estado"
 STATIC_MODIFIER_DESC_oe_m3e_por_estado_armada_mod:0 "Stone citadels at every choke point and heavy broadside fleets defend Portuguese sovereignty across three seas."
 oe_m3e.6.c:0 "Advance the Pombaline Enlightenment & Atlantic Union"
 STATIC_MODIFIER_NAME_oe_m3e_por_pombaline_atlantic_mod:0 "Pombaline Twin-Ocean Reform"
 STATIC_MODIFIER_DESC_oe_m3e_por_pombaline_atlantic_mod:0 "Rationalized ministries, colonial settlement charters, and scientific navigation modernize both Lisbon and its overseas provinces."
 oe_m3e.7.t:0 "Lion of the North: Eternal Dominium Maris Baltici"
 oe_m3e.7.d:0 "From Stockholm's island palaces to Riga's bustling quays and the fortified straits, the yellow cross on blue flies unchallenged over a united Baltic lake. Backed by Bergslagen ironworks, disciplined Carolean [regulars|e], and a vigilant [navy|e], Sweden enters history not as a fleeting meteor but as a permanent [great_power|e] of disciplined [crown_power|e]. The Riksdag and royal council now proclaim the creed of our northern imperium."
 oe_m3e.7.a:0 "Enshrine the Carolean Military School & Salvo Doctrine"
 STATIC_MODIFIER_NAME_oe_m3e_swe_carolean_doctrine_mod:0 "Invincible Carolean Doctrine"
 STATIC_MODIFIER_DESC_oe_m3e_swe_carolean_doctrine_mod:0 "Relentless salvo fire, bayonet assault, and allotment logistics make the Swedish army the benchmark of European warfare."
 oe_m3e.7.b:0 "Master the Baltic Lake: Naval Toll & Trade Imperium"
 STATIC_MODIFIER_NAME_oe_m3e_swe_baltic_imperium_mod:0 "Dominium Maris Baltici"
 STATIC_MODIFIER_DESC_oe_m3e_swe_baltic_imperium_mod:0 "Command of Riga, Tallinn, and the Baltic straits channels northern timber, grain, and iron wealth straight to Stockholm."
 oe_m3e.7.c:0 "Advance Northern Engineering, Steelworks & Royal Science"
 STATIC_MODIFIER_NAME_oe_m3e_swe_polhem_science_mod:0 "Northern Mechanical Enlightenment"
 STATIC_MODIFIER_DESC_oe_m3e_swe_polhem_science_mod:0 "Precision foundries, mechanical workshops, and the Royal Academy turn Sweden's mineral riches into industrial supremacy."
 oe_m3e.8.t:0 "The Undying Golden Century: Charter of the Free Oceans"
 oe_m3e.8.d:0 "Forests of masts crowd the IJ harbor as VOC Indiamen unload nutmeg and tea beside Baltic grain fluyts, while Amsterdam's Beurs sets credit rates for kings across Christendom. No rival armada broke our Admiralties, and no absolutist invasion drowned our polders; combining oceanic [trade|e], fearless [navy|e] broadsides, and free-press [literacy|e], the Republic stands as a radiant [great_power|e]. The States General now decree the enduring compass of our Golden Century."
 oe_m3e.8.a:0 "Perpetuate the Global Bourse & VOC Maritime Monopoly"
 STATIC_MODIFIER_NAME_oe_m3e_ned_global_bourse_mod:0 "World Bourse of Amsterdam"
 STATIC_MODIFIER_DESC_oe_m3e_ned_global_bourse_mod:0 "Joint-stock liquidity, sound Wisselbank reserves, and global spice factories make Amsterdam the financial hub of the earth."
 oe_m3e.8.b:0 "Proclaim Mare Liberum: Grand Admiralty of the Oceans"
 STATIC_MODIFIER_NAME_oe_m3e_ned_mare_liberum_mod:0 "Grand Admiralties of Mare Liberum"
 STATIC_MODIFIER_DESC_oe_m3e_ned_mare_liberum_mod:0 "Disciplined battle fleets and tireless Zaan shipyards enforce free navigation across every ocean on Dutch terms."
 oe_m3e.8.c:0 "Enshrine the Republic of Conscience, Art & Optics"
 STATIC_MODIFIER_NAME_oe_m3e_ned_conscience_golden_mod:0 "Beacon of Free Conscience"
 STATIC_MODIFIER_DESC_oe_m3e_ned_conscience_golden_mod:0 "Sheltering Europe's boldest scholars, artisans, and publishers turns the Netherlands into an engine of invention."
 oe_m3e.9.t:0 "The Crown of Saint Wenceslas: Heartland Sovereign of Europe"
 oe_m3e.9.d:0 "From Hradcany's cathedral towers across Moravia, Silesia, and the Lusatian towns, the Lands of the Bohemian Crown stand sovereign, prosperous, and unbroken. No foreign dynasty extinguished our estates; uniting Kutna Hora wealth, Charles University [literacy|e], unyielding [fort|e] passes, and prime electoral [diplomacy|e], Prague rises as a mighty [great_power|e]. The Bohemian Estates and royal council now seal the realm's grand vocation."
 oe_m3e.9.a:0 "Exalt Bohemian Industry: Crystal, Silver & Silesian Looms"
 STATIC_MODIFIER_NAME_oe_m3e_boh_crystal_industry_mod:0 "Bohemian Industrial Heartland"
 STATIC_MODIFIER_DESC_oe_m3e_boh_crystal_industry_mod:0 "Master crystal cutters, royal Thaler mints, and Silesian textile cities make the Crown Lands Central Europe's richest workshop."
 oe_m3e.9.b:0 "Cement Electoral Primacy & the Unconquered Mountain Fortress"
 STATIC_MODIFIER_NAME_oe_m3e_boh_electoral_bastion_mod:0 "Unconquered Electoral Bastion"
 STATIC_MODIFIER_DESC_oe_m3e_boh_electoral_bastion_mod:0 "Ringed by star-fortress passes and backed by iron martial heritage, Prague commands effortless authority across the Empire."
 oe_m3e.9.c:0 "Crown the Carolinum Enlightenment & Golden Prague"
 STATIC_MODIFIER_NAME_oe_m3e_boh_carolinum_beacon_mod:0 "Golden Prague of Letters"
 STATIC_MODIFIER_DESC_oe_m3e_boh_carolinum_beacon_mod:0 "Astronomers, jurists, and baroque architects gather at Charles University, illuminating Central European learning and governance."
 oe_m3e.10.t:0 "The Iron Kingdom of the North: Clockwork State of Steel"
 oe_m3e.10.d:0 "Beneath the black eagle banners fluttering from Potsdam and Berlin to Konigsberg and Silesian Wroclaw, Europe beholds a realm forged by iron willpower out of northern sands. With clockwork [cabinet|e] administration, unbeatable grenadier [regulars|e], and enlightened [literacy|e], Prussia rises among the continent's foremost [great_power|e] pillars. The royal throne now determines the defining spirit of the Prussian century."
 oe_m3e.10.a:0 "Perfect the Prussian General Staff & Oblique-Order Army"
 STATIC_MODIFIER_NAME_oe_m3e_pru_iron_legions_mod:0 "Iron Discipline of Potsdam"
 STATIC_MODIFIER_DESC_oe_m3e_pru_iron_legions_mod:0 "Relentless musketry cadence, Canton reserves, and operational staff planning turn the Prussian army into Europe's sharpest sword."
 oe_m3e.10.b:0 "Enshrine the Stein-Hardenberg Meritocratic State"
 STATIC_MODIFIER_NAME_oe_m3e_pru_merit_state_mod:0 "General Directory of Steel"
 STATIC_MODIFIER_DESC_oe_m3e_pru_merit_state_mod:0 "Incorruptible civil examinations, rational tax codes, and Silesian ironworks power an administrative machine without rival."
 oe_m3e.10.c:0 "Exalt Sanssouci & the Albertina Age of Reason"
 STATIC_MODIFIER_NAME_oe_m3e_pru_sanssouci_reason_mod:0 "Enlightenment of Sanssouci"
 STATIC_MODIFIER_DESC_oe_m3e_pru_sanssouci_reason_mod:0 "Compulsory schooling, Konigsberg philosophy, and royal academies unite Prussian duty with daring scientific inquiry."
 oe_m3e.11.t:0 "Eternal Lord of the Two Seas: The Unbroken Nordic Crown"
 oe_m3e.11.d:0 "From Kronborg's bronze salutes over the Oresund to Bergen's timber fjords, Scanian fields, and Gotland's ramparts, the Dannebrog reigns sovereign across both the North Sea and the Baltic. Combining Holmen [navy|e] mastery, Rentekammer [gold|e] discipline, and armed-neutrality [diplomacy|e], Denmark stands unshaken as a northern [great_power|e]. The royal court at Copenhagen now sets the enduring pillar of our twin-sea realm."
 oe_m3e.11.a:0 "Crown the Twin-Sea Royal Navy & Holmen Shipyards"
 STATIC_MODIFIER_NAME_oe_m3e_dan_twin_sea_navy_mod:0 "Sovereign Fleet of the Two Seas"
 STATIC_MODIFIER_DESC_oe_m3e_dan_twin_sea_navy_mod:0 "Norwegian oak hulls and veteran Nordic seamen keep the Sound, the Skagerrak, and the Baltic securely under Danish sails."
 oe_m3e.11.b:0 "Perpetuate the Sound Customs & Neutral Convoy Empire"
 STATIC_MODIFIER_NAME_oe_m3e_dan_sound_neutrality_mod:0 "Charter of Armed Neutrality"
 STATIC_MODIFIER_DESC_oe_m3e_dan_sound_neutrality_mod:0 "Sound Dues and escorted Nordic merchant convoys turn every European rivalry into soaring Copenhagen commerce."
 oe_m3e.11.c:0 "Cement the Kongeloven Union & Nordic Scientific Heritage"
 STATIC_MODIFIER_NAME_oe_m3e_dan_kongeloven_union_mod:0 "Eternal Kongeloven Union"
 STATIC_MODIFIER_DESC_oe_m3e_dan_kongeloven_union_mod:0 "Unified Nordic jurisprudence, coastal charts, and astronomical observatories bind Denmark, Norway, and the Atlantic isles in lasting harmony."
 oe_m3e.12.t:0 "The Sovereign Keys of Eternal Rome"
 oe_m3e.12.d:0 "From St. Peter's soaring travertine dome to the Adriatic piers of Ancona and the universities of Bologna, the restored Patrimonium Sancti Petri commands both spiritual awe and temporal might. Cardinals, condottieri, and humanist patrons now await the Pontiff's decree to define the enduring vocation of our [capital|e], our [religious_influence|e], and our [great_power|e] destiny."
 oe_m3e.12.a:0 "Proclaim the Universal Apostolic See"
 STATIC_MODIFIER_NAME_oe_m3e_pap_apostolic_see_mod:0 "Universal Apostolic See"
 STATIC_MODIFIER_DESC_oe_m3e_pap_apostolic_see_mod:0 "Papal legates, seminaries, and overseas missions radiate Roman spiritual primacy across Christendom."
 oe_m3e.12.b:0 "Uphold the Sword of the Church Militant"
 STATIC_MODIFIER_NAME_oe_m3e_pap_warrior_see_mod:0 "Sword of the Church Militant"
 STATIC_MODIFIER_DESC_oe_m3e_pap_warrior_see_mod:0 "Bastioned fortresses and disciplined papal guards ensure no foreign monarch ever dictates to Rome."
 oe_m3e.12.c:0 "Crown Eternal Rome Patron of Arts & Letters"
 STATIC_MODIFIER_NAME_oe_m3e_pap_renaissance_see_mod:0 "Eternal Patron of Arts & Letters"
 STATIC_MODIFIER_DESC_oe_m3e_pap_renaissance_see_mod:0 "Vatican libraries, academies, and marble workshops turn Rome into Europe's radiant seat of learning."
 oe_m3e.13.t:0 "From the Baltic to the Black Sea"
 oe_m3e.13.d:0 "The crimson Vytis flies unbroken from the pine forests of Vilnius and Samogitia to the golden domes of Kyiv and the southern river mouths. Having outlasted crusading orders and steppe khans alike, the Grand Duchy now chooses which institutional legacy will anchor its [army|e], its diverse [subjects|e], and its stature as an Eastern European [great_power|e]."
 oe_m3e.13.a:0 "Marshal the Sovereign Vytis Hegemony"
 STATIC_MODIFIER_NAME_oe_m3e_lit_vytis_hegemony_mod:0 "Vytis Sovereign Hegemony"
 STATIC_MODIFIER_DESC_oe_m3e_lit_vytis_hegemony_mod:0 "Lithuanian lancers, Ruthenian artillery, and frontier banners stand ready to defend both seas."
 oe_m3e.13.b:0 "Enshrine the Statute of the Three Faiths"
 STATIC_MODIFIER_NAME_oe_m3e_lit_statute_concord_mod:0 "Statute of the Three Faiths"
 STATIC_MODIFIER_DESC_oe_m3e_lit_statute_concord_mod:0 "Codified Ruthenian statutes and religious concord bind Baltic, Rus, and Tatar subjects in loyalty."
 oe_m3e.13.c:0 "Charter the Dnieper-Daugava Crown Union"
 STATIC_MODIFIER_NAME_oe_m3e_lit_river_commonwealth_mod:0 "Dnieper-Daugava Crown Union"
 STATIC_MODIFIER_DESC_oe_m3e_lit_river_commonwealth_mod:0 "Grain barges, amber convoys, and loyal autonomous duchies transform Lithuania into Eurasia's crossroads."
 oe_m3e.14.t:0 "The Great Bell of the Northern Republic"
 oe_m3e.14.d:0 "Far from being carted away as a trophy of autocracy, the veche bell of St. Sophia tolls in triumph over the Volkhov, the Neva, the White Sea, and the Volga portages. Citizens, shipmasters, and scribes now vote in the grand assembly on the pillar that shall immortalize our free [parliament|e], our northern [trade|e], and our sovereign [great_power|e] mandate."
 oe_m3e.14.a:0 "Charter the Arctic-Baltic Sovereign Exchange"
 STATIC_MODIFIER_NAME_oe_m3e_nov_arctic_exchange_mod:0 "Arctic-Baltic Sovereign Exchange"
 STATIC_MODIFIER_DESC_oe_m3e_nov_arctic_exchange_mod:0 "Novgorodian factors set the price of sable, hemp, and silver from Arkhangelsk to Lubeck."
 oe_m3e.14.b:0 "Commission the Eternal Ushkuiniki Armada"
 STATIC_MODIFIER_NAME_oe_m3e_nov_ushkuiniki_armada_mod:0 "Eternal Ushkuiniki Armada"
 STATIC_MODIFIER_DESC_oe_m3e_nov_ushkuiniki_armada_mod:0 "Ice-hardened Pomor mariners and river squadrons keep every northern strait open to republican flags."
 oe_m3e.14.c:0 "Enact the Veche Charter of Letters & Law"
 STATIC_MODIFIER_NAME_oe_m3e_nov_veche_charter_mod:0 "Veche Charter of Letters & Law"
 STATIC_MODIFIER_DESC_oe_m3e_nov_veche_charter_mod:0 "Universal civic literacy, printed statutes, and elected magistrates anchor Northern Russia's republic."
 oe_m3e.15.t:0 "The Sovereign Thistle of the North"
 oe_m3e.15.d:0 "Unbowed behind its northern firths and granite highlands, the Kingdom of Scotland now unites clan chiefs, maritime burghs, and Europe's sharpest academies beneath an independent crown. As bells echo from Edinburgh Castle to Glasgow and St Andrews, the Estates gather to decide how our [army|e], oceanic [navy|e], and intellectual [great_power|e] fame shall endure."
 oe_m3e.15.a:0 "Steel the Royal Schiltron & Highland Regiments"
 STATIC_MODIFIER_NAME_oe_m3e_sco_royal_schiltron_mod:0 "Royal Schiltron & Highland Regiments"
 STATIC_MODIFIER_DESC_oe_m3e_sco_royal_schiltron_mod:0 "Disciplined Lowland pike-and-shot and Highland shock battalions make Scotland unconquerable."
 oe_m3e.15.b:0 "Establish the Caledonian Atlantic Admiralty"
 STATIC_MODIFIER_NAME_oe_m3e_sco_atlantic_admiralty_mod:0 "Caledonian Atlantic Admiralty"
 STATIC_MODIFIER_DESC_oe_m3e_sco_atlantic_admiralty_mod:0 "Great Clyde shipyards and North Sea convoys carry the Saltire across the open Atlantic."
 oe_m3e.15.c:0 "Proclaim Edinburgh the Athens of the North"
 STATIC_MODIFIER_NAME_oe_m3e_sco_northern_enlightenment_mod:0 "Athens of the North"
 STATIC_MODIFIER_DESC_oe_m3e_sco_northern_enlightenment_mod:0 "Scottish jurists, inventors, and philosophers set the intellectual pace for an enlightened age."
 oe_m3e.16.t:0 "Mare Nostrum Under the Four Bars"
 oe_m3e.16.d:0 "Barcelona's royal shipyards, Valencia's silk exchange, Palma's anchorages, Palermo's wheat fleets, and Naples's baroque palaces now beat to a single Aragonese rhythm. Having forged a true Mediterranean commonwealth, the Crown must decree whether its supreme legacy lies in maritime [trade|e], victorious [army|e] banners, or pactist harmony among its [subjects|e]."
 oe_m3e.16.a:0 "Enthrone the Consulate of Mare Nostrum"
 STATIC_MODIFIER_NAME_oe_m3e_ara_mare_nostrum_mod:0 "Consulate of Mare Nostrum"
 STATIC_MODIFIER_DESC_oe_m3e_ara_mare_nostrum_mod:0 "Aragonese admiralty law, galley armadas, and consular banks command every Mediterranean lane."
 oe_m3e.16.b:0 "March Under the Desperta Ferro Eagles"
 STATIC_MODIFIER_NAME_oe_m3e_ara_almogavar_empire_mod:0 "Desperta Ferro Imperial Legions"
 STATIC_MODIFIER_DESC_oe_m3e_ara_almogavar_empire_mod:0 "Heirs of the Almogavars and tercios project irresistible amphibious power across every coast."
 oe_m3e.16.c:0 "Seal the Pactist Federation of Crowns"
 STATIC_MODIFIER_NAME_oe_m3e_ara_pactist_crowns_mod:0 "Pactist Federation of Crowns"
 STATIC_MODIFIER_DESC_oe_m3e_ara_pactist_crowns_mod:0 "Respected Cortes and fueros bind Iberia, Sicily, and Naples in voluntary, wealthy union."
 oe_m3e.17.t:0 "Cradle of the Renaissance Triumphant"
 oe_m3e.17.d:0 "From Brunelleschi's terracotta dome above the Arno to the free harbor of Livorno and the counting houses of Europe, Florence has elevated a Tuscan commune into a sovereign model for all Christendom. Bankers, philosophers, and captains now ask what golden seal shall crown our [capital|e], our [cultural_tradition|e], and our luminous [great_power|e] heritage."
 oe_m3e.17.a:0 "Entrench the Florin Clearinghouse of Europe"
 STATIC_MODIFIER_NAME_oe_m3e_flo_florin_hegemony_mod:0 "Florin Clearinghouse of Europe"
 STATIC_MODIFIER_DESC_oe_m3e_flo_florin_hegemony_mod:0 "Unimpeachable gold coinage and Tuscan banking networks anchor Europe's sovereign credit."
 oe_m3e.17.b:0 "Dedicate Florence to the Platonic Muse"
 STATIC_MODIFIER_NAME_oe_m3e_flo_platonic_muse_mod:0 "Platonic Muse of Florence"
 STATIC_MODIFIER_DESC_oe_m3e_flo_platonic_muse_mod:0 "Academies, Uffizi galleries, and natural philosophy keep Tuscany at the summit of human genius."
 oe_m3e.17.c:0 "Arm the Citizen Legions of Tuscany"
 STATIC_MODIFIER_NAME_oe_m3e_flo_civic_militia_mod:0 "Citizen Legions of Tuscany"
 STATIC_MODIFIER_DESC_oe_m3e_flo_civic_militia_mod:0 "Machiavellian civic arms and shrewd statecraft ensure foreign invaders never trample the Arno."
 oe_m3e.18.t:0 "The Alpine Citadel of Europe"
 oe_m3e.18.d:0 "From the snow-crowned passes of St. Gotthard to the watchmaking workshops of Geneva and the Rhine docks of Basel, the free cantons have defied kings and emperors to forge an unconquered alpine bastion. Before the assembled Tagsatzung, delegates now set the eternal course of our mountain [fort|e] shield, our sound [gold|e], and our respected [diplomacy|e]."
 oe_m3e.18.a:0 "Fortify the Impregnable Alpine Redoubt"
 STATIC_MODIFIER_NAME_oe_m3e_swi_fortress_alps_mod:0 "Impregnable Fortress Alps"
 STATIC_MODIFIER_DESC_oe_m3e_swi_fortress_alps_mod:0 "Star forts across every pass and veteran citizen militias turn the entire Confederacy into a citadel."
 oe_m3e.18.b:0 "Expand Cantonal Vaults & Precision Guilds"
 STATIC_MODIFIER_NAME_oe_m3e_swi_cantonal_vaults_mod:0 "Cantonal Vaults & Precision Guilds"
 STATIC_MODIFIER_DESC_oe_m3e_swi_cantonal_vaults_mod:0 "Discreet alpine vaults and unrivaled horology attract wealth and skilled artisans from all Europe."
 oe_m3e.18.c:0 "Proclaim the Eternal Mediation of the Tagsatzung"
 STATIC_MODIFIER_NAME_oe_m3e_swi_eternal_mediation_mod:0 "Eternal Mediation of the Tagsatzung"
 STATIC_MODIFIER_DESC_oe_m3e_swi_eternal_mediation_mod:0 "Respected armed neutrality makes Swiss envoys the trusted arbiters of European treaties."
 oe_m3e.19.t:0 "Lord of the Auspicious Conjunction"
 oe_m3e.19.d:0 "Beneath the lapis-and-gold domes of Samarkand and the ateliers of Herat, the House of Timur has mastered both the bronze siege gun and the astrolabe. Having unified Transoxiana's caravan arteries with settled imperial governance, the Padishah proclaims which enduring pillar shall guide our [army|e], Silk Road [trade|e], and transcendent [great_power|e] reign."
 oe_m3e.19.a:0 "Unleash the Sahib-Qiran Gunpowder Host"
 STATIC_MODIFIER_NAME_oe_m3e_tim_sahib_qiran_mod:0 "Sahib-Qiran Gunpowder Host"
 STATIC_MODIFIER_DESC_oe_m3e_tim_sahib_qiran_mod:0 "Timurid heavy siege batteries and disciplined shock cavalry break every fortress from the Oxus outward."
 oe_m3e.19.b:0 "Crown the Registan Emporium of Silk & Silver"
 STATIC_MODIFIER_NAME_oe_m3e_tim_registan_silk_mod:0 "Registan of Silk & Silver"
 STATIC_MODIFIER_DESC_oe_m3e_tim_registan_silk_mod:0 "Paved postal roads and vast caravanserais pull Eurasian luxury commerce straight into Samarkand."
 oe_m3e.19.c:0 "Immortalize the Star Tables of Ulugh Beg"
 STATIC_MODIFIER_NAME_oe_m3e_tim_star_tables_mod:0 "Observatory of Ulugh Beg"
 STATIC_MODIFIER_DESC_oe_m3e_tim_star_tables_mod:0 "Astronomers, miniature painters, and Persian viziers make Samarkand the intellectual jewel of Islam."
 oe_m3e.20.t:0 "Isfahan, Half the World"
 oe_m3e.20.d:0 "Caravans from China, dhows from Malabar, and envoys from Venice and Moscow crowd the tiled arcades of Naqsh-e Jahan, marveling at an Iran reborn from Tabriz to Hormuz. Standing before the Ali Qapu balcony, the Shahanshah decrees which luminous legacy shall sustain our [crown_power|e], oceanic [trade|e], and sovereign [great_power|e] dominion."
 oe_m3e.20.a:0 "Exalt the Shahanshah's Ghulam Artillery"
 STATIC_MODIFIER_NAME_oe_m3e_ira_ghulam_artillery_mod:0 "Shahanshah's Ghulam Artillery"
 STATIC_MODIFIER_DESC_oe_m3e_ira_ghulam_artillery_mod:0 "Salaried royal musketeers and heavy brass cannon guard Iran's borders from the Tigris to Khorasan."
 oe_m3e.20.b:0 "Enshrine the Royal Silk & Gulf Monopoly"
 STATIC_MODIFIER_NAME_oe_m3e_ira_royal_silk_mod:0 "Royal Silk & Gulf Monopoly"
 STATIC_MODIFIER_DESC_oe_m3e_ira_royal_silk_mod:0 "Imperial silk ateliers and Hormuz customs channels turn Iran into the wealthy pivot of global commerce."
 oe_m3e.20.c:0 "Perfect the Immortal Bureaucracy of Iran"
 STATIC_MODIFIER_NAME_oe_m3e_ira_nazir_bureaucracy_mod:0 "Immortal Bureaucracy of Iran"
 STATIC_MODIFIER_DESC_oe_m3e_ira_nazir_bureaucracy_mod:0 "Centuries of Persian statecraft, poetry, and royal administration bind the plateau under firm crown rule."
 oe_m3e.21.t:0 "Second Golden Age of Queen Tamar"
 oe_m3e.21.d:0 "Where rival empires sought only vassals and mountain tribute, a united Kingdom of Georgia now bridges the Black and Caspian Seas from Batumi and Tbilisi to Yerevan and Baku. Beneath the vaulted cathedral of Svetitskhoveli, the Crown chooses the permanent foundation for our mountain [fort|e] shield, transcontinental [trade|e], and unconquered [great_power|e] renaissance."
 oe_m3e.21.a:0 "Raise the Unconquered Sword of the Caucasus"
 STATIC_MODIFIER_NAME_oe_m3e_geo_caucasus_sword_mod:0 "Unconquered Sword of the Caucasus"
 STATIC_MODIFIER_DESC_oe_m3e_geo_caucasus_sword_mod:0 "Sadrosho banners, Khevsur veterans, and alpine bastions repel every sultan and shah who dares invade."
 oe_m3e.21.b:0 "Charter the Two-Seas Silk & Wine Emporium"
 STATIC_MODIFIER_NAME_oe_m3e_geo_two_seas_trade_mod:0 "Two-Seas Silk & Wine Emporium"
 STATIC_MODIFIER_DESC_oe_m3e_geo_two_seas_trade_mod:0 "Caucasian silk houses, Kakhetian vineyards, and twin-sea harbors enrich Georgia as Eurasia's bridge."
 oe_m3e.21.c:0 "Renew the Gelati & Dasturlamali Renaissance"
 STATIC_MODIFIER_NAME_oe_m3e_geo_gelati_code_mod:0 "Gelati & Dasturlamali Renaissance"
 STATIC_MODIFIER_DESC_oe_m3e_geo_gelati_code_mod:0 "Printing presses, royal statutes, and fortress monasteries illuminate a second Georgian Golden Age."
 oe_m3e.22.t:0 "Shahanshah of Tigris, Plateau, and Gulf"
 oe_m3e.22.d:0 "Envoys from Baghdad, Tabriz, Herat, and Hormuz gather beneath the turquoise vaults of our court to acclaim the restoration of an undivided Persianate [great_power|e]. With our [capital|e] ablaze with scholarship, gunpowder arsenals humming, and Gulf caravansaries overflowing with [trade|e], the imperial [cabinet|e] now sets the enduring pillar upon which our Shahanshah legacy will rest."
 oe_m3e.22.a:0 "Crown Nisf-e Jahan as Beacon of Letters and Statecraft"
 STATIC_MODIFIER_NAME_oe_m3e_jal_nisf_jahan_mod:0 "Splendor of Nisf-e Jahan"
 STATIC_MODIFIER_DESC_oe_m3e_jal_nisf_jahan_mod:0 "Imperial academies, tiled bazaars, and disciplined chanceries elevate the Persianate realm into a marvel of governance and art."
 oe_m3e.22.b:0 "Exalt the Ghulam Royal Guard and Zamburak Corps"
 STATIC_MODIFIER_NAME_oe_m3e_jal_zamburak_mod:0 "Zamburak and Ghulam Legion"
 STATIC_MODIFIER_DESC_oe_m3e_jal_zamburak_mod:0 "Salaried royal guards and mobile camel-swivel artillery break rivals from the Euphrates to the Oxus."
 oe_m3e.22.c:0 "Turn Hormuz and Basra into the Emporium of Two Seas"
 STATIC_MODIFIER_NAME_oe_m3e_jal_hormuz_silk_mod:0 "Hormuz and Silk Road Entrepot"
 STATIC_MODIFIER_DESC_oe_m3e_jal_hormuz_silk_mod:0 "Royal Karkhaneh silk and Gulf customs anchor Eurasian maritime trade under Iranian sails."
 oe_m3e.23.t:0 "Eternal City of Victory Across Both Oceans"
 oe_m3e.23.d:0 "Beneath the carved granite colonnades of Hampi, Tamil, Telugu, and Kannada lords present golden lotuses before the throne of a triumphant southern [great_power|e]. Having secured the Deccan ramparts and every spice quay from Malabar to Coromandel, our [legitimacy|e] shines unclouded as our [navy|e] and [market|e] anchor the entire Indian Ocean."
 oe_m3e.23.a:0 "Eternalize Hampi's Carnatic Renaissance and Dharma Rule"
 STATIC_MODIFIER_NAME_oe_m3e_vij_carnatic_mod:0 "Carnatic Golden Age"
 STATIC_MODIFIER_DESC_oe_m3e_vij_carnatic_mod:0 "Multilingual royal patronage, stone-carved sanctuaries, and irrigated paddies sustain unmatched southern splendor."
 oe_m3e.23.b:0 "Institutionalize the Imperial Nayaka Vanguard"
 STATIC_MODIFIER_NAME_oe_m3e_vij_nayaka_mod:0 "Vanguard of the Varaha Banner"
 STATIC_MODIFIER_DESC_oe_m3e_vij_nayaka_mod:0 "Arabian-mounted lancers, armored war elephants, and fortresses along the Krishna guard the peninsula forever."
 oe_m3e.23.c:0 "Proclaim Oceanic Supremacy Over the Monsoon Routes"
 STATIC_MODIFIER_NAME_oe_m3e_vij_monsoon_mod:0 "Lord of the Eastern and Western Seas"
 STATIC_MODIFIER_DESC_oe_m3e_vij_monsoon_mod:0 "Teak ocean armadas protect Indian spice fleets and dictate commerce from Hormuz to Malacca."
 oe_m3e.24.t:0 "Swarajya Triumphant: Bastion of the Indian Ocean"
 oe_m3e.24.d:0 "Saffron standards ripple from the basalt crags of Raigarh to the docks of Surat and the muslin looms of Bengal, proclaiming a self-ruled Indian [great_power|e] beyond any foreign company's reach. Guided by our [cabinet|e] of eight ministers, disciplined [regulars|e], and sovereign maritime [trade|e], the Chhatrapati now decrees the pillar of Swarajya's enduring reign."
 oe_m3e.24.a:0 "Perfect the Ashta Pradhan Industrial State"
 STATIC_MODIFIER_NAME_oe_m3e_mar_pradhan_mod:0 "Ashta Pradhan Sovereign State"
 STATIC_MODIFIER_DESC_oe_m3e_mar_pradhan_mod:0 "Salaried ministries, crucible steelworks, and textile guilds forge a centralized and industrial Swarajya."
 oe_m3e.24.b:0 "Forge the Iron Rocket and Bargir Combined-Arms Corps"
 STATIC_MODIFIER_NAME_oe_m3e_mar_rocket_mod:0 "Deccan Rocket and Bargir Doctrine"
 STATIC_MODIFIER_DESC_oe_m3e_mar_rocket_mod:0 "Mobile light lancers and salvos of iron-cased war rockets shatter colonial and imperial armies alike."
 oe_m3e.24.c:0 "Seal the Konkan-Bengal Oceanic Bastion"
 STATIC_MODIFIER_NAME_oe_m3e_mar_angre_mod:0 "Bastion of Admiral Angre"
 STATIC_MODIFIER_DESC_oe_m3e_mar_angre_mod:0 "Sea-fortresses, Hundi banking, and gunboat patrols preserve Indian maritime commerce in Indian hands."
 oe_m3e.25.t:0 "Apex of the Dual Inner-Asian Empire"
 oe_m3e.25.d:0 "From the pine mountains of Changbai and the steppe altars of Karakorum to the Forbidden City and the Pearl River estuary, one imperial seal commands an unprecedented multi-ethnic [great_power|e]. Balancing agrarian [prosperity|e], loyal frontier [subjects|e], and formidable gunpowder [regulars|e], the Son of Heaven proclaims the guiding legacy for the coming centuries."
 oe_m3e.25.a:0 "Perfect the Lifan Yuan and Multi-Ethnic Dyarchy"
 STATIC_MODIFIER_NAME_oe_m3e_mch_lifanyuan_mod:0 "Harmony of the Five Realms"
 STATIC_MODIFIER_DESC_oe_m3e_mch_lifanyuan_mod:0 "Bilingual ministries and Lifan Yuan statecraft bind agrarian provinces and Inner Asian banners into lasting unity."
 oe_m3e.25.b:0 "Modernize the Eight Banners and Ujen Cooha Ordnance"
 STATIC_MODIFIER_NAME_oe_m3e_mch_ujen_mod:0 "Banners of the Iron Dragon"
 STATIC_MODIFIER_DESC_oe_m3e_mch_ujen_mod:0 "Mounted bannermen and bronze heavy artillery project unstoppable continental supremacy across Asia."
 oe_m3e.25.c:0 "Command Both Kyakhta Caravans and Canton Sea Lanes"
 STATIC_MODIFIER_NAME_oe_m3e_mch_cohong_mod:0 "Silver Empire of Silk and Tea"
 STATIC_MODIFIER_DESC_oe_m3e_mch_cohong_mod:0 "Steppe tea caravans and oceanic porcelain fleets draw the bullion of every continent into imperial treasuries."
 oe_m3e.26.t:0 "Enlightened Gunpowder Power of East Asia"
 oe_m3e.26.d:0 "From the printing houses of Hanyang to the ironclad shipyards of Busan and the mountain fortresses guarding the Yalu, Korea stands tall as an enlightened, unconquered [great_power|e]. Armed with universal [literacy|e], pioneering gunpowder [advances|e], and unbroken [maritime_presence|e], our scholars and commanders now select the crowning charter of the peninsula."
 oe_m3e.26.a:0 "Crown the Hall of Worthies and Silhak Enlightenment"
 STATIC_MODIFIER_NAME_oe_m3e_kor_silhak_mod:0 "Silhak and Hangul Enlightenment"
 STATIC_MODIFIER_DESC_oe_m3e_kor_silhak_mod:0 "Metal movable type, empirical science, and fair Daedongbeop taxation propel Korea to the forefront of learning."
 oe_m3e.26.b:0 "Perfect the Chongtong Fortress and Hwacha Doctrine"
 STATIC_MODIFIER_NAME_oe_m3e_kor_chongtong_mod:0 "Bastion of Mountain and Gunpowder"
 STATIC_MODIFIER_DESC_oe_m3e_kor_chongtong_mod:0 "Interlocking mountain citadels, rocket barrages, and heavy bronze cannon render the peninsula utterly unassailable."
 oe_m3e.26.c:0 "Send Armored Turtle Fleets Across Both Eastern Seas"
 STATIC_MODIFIER_NAME_oe_m3e_kor_geobukseon_mod:0 "Legacy of Admiral Yi"
 STATIC_MODIFIER_DESC_oe_m3e_kor_geobukseon_mod:0 "Iron-roofed gunships and crane-wing naval squadrons keep the Korea Strait and Yellow Sea forever secure."
 oe_m3e.27.t:0 "Rising Sun Over the Pacific Horizon"
 oe_m3e.27.d:0 "With silver bullion flowing from Iwami Ginzan, Rangaku presses humming in Nagasaki, and unified banners flying from Edo to Hakata, Japan emerges from an open sea into a commanding Pacific [great_power|e]. Guided by modern [institutions|e], disciplined [regulars|e], and ocean-spanning [trade|e], our realm now chooses the eternal banner of its maritime age."
 oe_m3e.27.a:0 "Champion Rangaku Science and Industrial Openness"
 STATIC_MODIFIER_NAME_oe_m3e_jap_rangaku_mod:0 "Rangaku Open-Seas Renaissance"
 STATIC_MODIFIER_DESC_oe_m3e_jap_rangaku_mod:0 "Translating global science while financing domestic workshops turns Japan into an industrial marvel of Asia."
 oe_m3e.27.b:0 "Perfect the Disciplined Volley Army and Central Bakufu"
 STATIC_MODIFIER_NAME_oe_m3e_jap_ashigaru_mod:0 "Steel Discipline of the Shogunate"
 STATIC_MODIFIER_DESC_oe_m3e_jap_ashigaru_mod:0 "Bushido ethos fused with rotating volley fire creates an infantry corps feared across the Pacific rim."
 oe_m3e.27.c:0 "Unleash the Grand Red Seal Pacific Armada"
 STATIC_MODIFIER_NAME_oe_m3e_jap_shuinsen_mod:0 "Grand Red Seal Pacific Fleet"
 STATIC_MODIFIER_DESC_oe_m3e_jap_shuinsen_mod:0 "Ocean-going galleons and silver-backed merchant convoys weave East Asia and Nanyang into Japan's oceanic domain."
 oe_m3e.28.t:0 "Eternal Dai Viet: Sovereign of the Southern Heaven"
 oe_m3e.28.d:0 "As the ancient poem proclaims, the mountains and rivers of the South belong forever to the Southern Emperor: from Lang Son's misty limestone passes through Thang Long and Hue to the green delta of Gia Dinh, Dai Viet reigns as an unbowed [great_power|e]. Backed by legalist [institutions|e], famed gunpowder [regulars|e], and boundless [prosperity|e], our court chooses the enduring crest of the realm."
 oe_m3e.28.a:0 "Exalt the Hong Duc Code and Temple of Literature"
 STATIC_MODIFIER_NAME_oe_m3e_dai_hongduc_mod:0 "Realm of Manifest Civility"
 STATIC_MODIFIER_DESC_oe_m3e_dai_hongduc_mod:0 "Meritocratic examinations, equitable statutes, and classical Nha Nhac music crown a luminous Vietnamese golden age."
 oe_m3e.28.b:0 "Harden the Northern Passes and Giao Chi Arsenals"
 STATIC_MODIFIER_NAME_oe_m3e_dai_giaochi_mod:0 "Unconquered Southern Bastion"
 STATIC_MODIFIER_DESC_oe_m3e_dai_giaochi_mod:0 "Breech-loading firearms and layered mountain forts guarantee no northern or foreign army ever breaks Dai Viet."
 oe_m3e.28.c:0 "Unite the Red River and Mekong Into One Maritime Granary"
 STATIC_MODIFIER_NAME_oe_m3e_dai_mekong_mod:0 "Twin-Delta Granary and Sea Road"
 STATIC_MODIFIER_DESC_oe_m3e_dai_mekong_mod:0 "Dykes from Tonkin to Saigon harvest endless rice while Chu Dau ceramics and silk sail across the East Sea."
 oe_m3e.29.t:0 "Chakravartin of Eternal Siam"
 oe_m3e.29.d:0 "Golden barges glide past the glittering stupas of Ayutthaya as ambassadors from Lan Na, the Mekong, and distant Europe salute the Chakravartin of a sovereign Southeast Asian [great_power|e]. Anchored by Sakdina governance, cosmopolitan [diplomacy|e], and twin-ocean [trade|e], the Siamese throne now consecrates the eternal foundation of its golden kingdom."
 oe_m3e.29.a:0 "Weave the Golden Mandala of Sovereign Diplomacy"
 STATIC_MODIFIER_NAME_oe_m3e_ayu_mandala_mod:0 "Mandala of the Golden Spires"
 STATIC_MODIFIER_DESC_oe_m3e_ayu_mandala_mod:0 "Deft balance-of-power statecraft preserves Siamese independence while binding mainland vassals in willing allegiance."
 oe_m3e.29.b:0 "Exalt the Sacred White Elephants and Phrai Luang Army"
 STATIC_MODIFIER_NAME_oe_m3e_ayu_elephant_mod:0 "Royal Elephant and Artillery Guard"
 STATIC_MODIFIER_DESC_oe_m3e_ayu_elephant_mod:0 "Armored war elephants, disciplined Phrai Luang regiments, and river bastions keep every foe from the Chao Phraya."
 oe_m3e.29.c:0 "Expand the Phrakhlang Twin-Sea Emporium"
 STATIC_MODIFIER_NAME_oe_m3e_ayu_phrakhlang_mod:0 "Phrakhlang Two-Sea Emporium"
 STATIC_MODIFIER_DESC_oe_m3e_ayu_phrakhlang_mod:0 "Cosmopolitan foreign quarters and Tenasserim-Gulf portages funnel Asian and European wealth through Ayutthaya."
 oe_m3e.30.t:0 "Sovereign of Nusantara: The Palapa Oath Fulfilled"
 oe_m3e.30.d:0 "From Sumatra's pepper coast across Java's volcanic terraces to the clove isles of Ternate and Banda, the Sun of Majapahit shines over ten thousand islands united as an invincible oceanic [great_power|e]. With Gajah Mada's Palapa Oath redeemed through supreme [maritime_presence|e], loyal island [subjects|e], and sovereign spice [trade|e], Trowulan now decrees Nusantara's eternal course."
 oe_m3e.30.a:0 "Consecrate the Bhinneka Mandala Confederation"
 STATIC_MODIFIER_NAME_oe_m3e_maj_nusantara_mod:0 "Unity in Diversity Mandala"
 STATIC_MODIFIER_DESC_oe_m3e_maj_nusantara_mod:0 "Respecting diverse island faiths and customs binds every Nusantara rajah into harmonious imperial confederation."
 oe_m3e.30.b:0 "Rule the Waves With the Eternal Jong Armada"
 STATIC_MODIFIER_NAME_oe_m3e_maj_jong_mod:0 "Suryamajapahit Jong Armada"
 STATIC_MODIFIER_DESC_oe_m3e_maj_jong_mod:0 "Towering multi-deck war jongs and rapid-fire bronze Cetbang cannon command every strait from Malacca to Maluku."
 oe_m3e.30.c:0 "Enshrine the Moluccan Spice Free-Trade Charter"
 STATIC_MODIFIER_NAME_oe_m3e_maj_spice_mod:0 "Crown of the Spice Seas"
 STATIC_MODIFIER_DESC_oe_m3e_maj_spice_mod:0 "Cloves, nutmeg, pepper, and Gresik-Tuban shipping turn Nusantara into the wealthiest maritime marketplace on earth."
 oe_m3e.31.t:0 "Eternal Lord of the Two Seas"
 oe_m3e.31.d:0 "Where monsoon winds converge between the Indian Ocean and the South China Sea, our twin-shore sultanate has defied every colonial cannon to emerge as a glittering maritime [great_power|e]. Governed by the Maritime Law Code, guarded by our fierce [navy|e], and enriched by cosmopolitan [trade|e] and Jawi [cultural_tradition|e], Malacca now proclaims the immortal charter of the Straits."
 oe_m3e.31.a:0 "Enshrine the Monsoon Free-Port Shahbandar System"
 STATIC_MODIFIER_NAME_oe_m3e_mlc_shahbandar_mod:0 "Golden Entrepot of the Monsoons"
 STATIC_MODIFIER_DESC_oe_m3e_mlc_shahbandar_mod:0 "Four Shahbandar quarters, low customs, and honest weights make the Straits the indispensable clearinghouse of world trade."
 oe_m3e.31.b:0 "Expand the Iron Straits Laksamana War Fleet"
 STATIC_MODIFIER_NAME_oe_m3e_mlc_laksamana_mod:0 "Iron Straits Laksamana Armada"
 STATIC_MODIFIER_DESC_oe_m3e_mlc_laksamana_mod:0 "Heavy brass Lela cannon, nimble lancharas, and loyal Orang Laut navigators keep the twin shores forever unconquered."
 oe_m3e.31.c:0 "Spread Malay Letters and Straits Jurisprudence"
 STATIC_MODIFIER_NAME_oe_m3e_mlc_sejarah_mod:0 "Beacon of Malay Letters and Law"
 STATIC_MODIFIER_DESC_oe_m3e_mlc_sejarah_mod:0 "Classical Malay diplomacy, maritime jurisprudence, and cosmopolitan scholarship turn the Straits into a cultural lighthouse."
 oe_m3e.32.t:0 "Grand Council of the Solomonic Horn"
 oe_m3e.32.d:0 "Banners from Massawa, Zeila, Lalibela, and Gonder gather beneath the Lion of Judah as bishops, chewa commanders, and Red Sea merchants convene before the Negusa Nagast. With our [capital|e] recognized across oceans and our [prestige|e] assured as a [great_power|e], the court debates the eternal pillar that shall guide Ethiopia's coming centuries."
 oe_m3e.32.a:0 "Command the Red Sea and Indian Ocean Monsoon"
 STATIC_MODIFIER_NAME_oe_m3e_eth_red_sea_thalassocracy_mod:0 "Red Sea Solomonic Thalassocracy"
 STATIC_MODIFIER_DESC_oe_m3e_eth_red_sea_thalassocracy_mod:0 "Imperial dhows and customhouses from Massawa to Zeila dominate the Bab el-Mandeb monsoon lanes."
 oe_m3e.32.b:0 "Forge Eternal Chewa Gunpowder Legions"
 STATIC_MODIFIER_NAME_oe_m3e_eth_chewa_gunpowder_mod:0 "Chewa Highland Gunpowder Corps"
 STATIC_MODIFIER_DESC_oe_m3e_eth_chewa_gunpowder_mod:0 "Fortified amba mesas and standing musketeer regiments make the Ethiopian highlands unconquerable."
 oe_m3e.32.c:0 "Raise the Kebra Nagast Academies of Gonder"
 STATIC_MODIFIER_NAME_oe_m3e_eth_kebra_academies_mod:0 "Solomonic Scriptoria & Church Charter"
 STATIC_MODIFIER_DESC_oe_m3e_eth_kebra_academies_mod:0 "Ge'ez academies and imperial ecclesiastical councils fuse sacred tradition with disciplined scholarship."
 oe_m3e.33.t:0 "The New Fire of the Undying Sun"
 oe_m3e.33.d:0 "Atop the summit of Citlaltepetl and across the torchlit causeways of Lake Texcoco, runners carry the New Fire into every temple and calmecac of the empire. Having defied transoceanic peril to stand as a sovereign [great_power|e] of unmatched [prosperity|e] and [prestige|e], the Huey Tlatoani decrees the grand mandate of the new century."
 oe_m3e.33.a:0 "Enshrine the Pochteca & Triple Tribute Charter"
 STATIC_MODIFIER_NAME_oe_m3e_tnc_triple_tribute_mod:0 "Imperial Tribute & Pochteca Charter"
 STATIC_MODIFIER_DESC_oe_m3e_tnc_triple_tribute_mod:0 "Standardized tribute codices and oceanic pochteca guilds enrich Tenochtitlan from sea to shining sea."
 oe_m3e.33.b:0 "Arm the Steel Eagle and Jaguar Orders"
 STATIC_MODIFIER_NAME_oe_m3e_tnc_steel_jaguar_mod:0 "Steel Eagle & Jaguar Standing Legions"
 STATIC_MODIFIER_DESC_oe_m3e_tnc_steel_jaguar_mod:0 "Warrior brotherhoods equipped with domestic steel, rifled muskets, and bronze artillery guard the Fifth Sun."
 oe_m3e.33.c:0 "Expand the Calmecac & Chinampa Commonwealth"
 STATIC_MODIFIER_NAME_oe_m3e_tnc_calmecac_renaissance_mod:0 "Calmecac Enlightenment & Chinampa Agronomy"
 STATIC_MODIFIER_DESC_oe_m3e_tnc_calmecac_renaissance_mod:0 "Lake-garden hydraulics and manuscript academies sustain an educated, densely populated Mesoamerican renaissance."
 oe_m3e.34.t:0 "Grand Inti Raymi of Tawantinsuyu"
 oe_m3e.34.d:0 "Gold plaques blaze along the plaza of Haucaypata as governors from Quito, Chan Chan, Arequipa, and the high altiplano lay tribute before the Sapa Inca. With the four quarters united in [stability|e] and acknowledged across the oceans as a [great_power|e] of unmatched [control|e], the imperial council charts the destiny of Tawantinsuyu."
 oe_m3e.34.a:0 "Perfect the Qhapaq Nan and Quipu State"
 STATIC_MODIFIER_NAME_oe_m3e_csu_qhapaq_bureaucracy_mod:0 "Qhapaq Nan & Quipu Imperial Administration"
 STATIC_MODIFIER_DESC_oe_m3e_csu_qhapaq_bureaucracy_mod:0 "Royal stone highways, tambo couriers, and precision quipu ledgers project effortless governance across the Andes."
 oe_m3e.34.b:0 "Launch the Pacific Silver Armada"
 STATIC_MODIFIER_NAME_oe_m3e_csu_pacific_armada_mod:0 "Pacific Ocean-Going Silver Empire"
 STATIC_MODIFIER_DESC_oe_m3e_csu_pacific_armada_mod:0 "State-chartered galleons and disciplined bullion mints turn the South Pacific into an Andean trade lake."
 oe_m3e.34.c:0 "Fortify the Cloud-Fortress & Terrace Heartland"
 STATIC_MODIFIER_NAME_oe_m3e_csu_andean_bastion_mod:0 "Cloud-Fortress & Vertical Terrace Commonwealth"
 STATIC_MODIFIER_DESC_oe_m3e_csu_andean_bastion_mod:0 "Unbreakable cyclopean strongholds and brimming qullqa granaries shelter the Andean peoples against every storm."
 oe_m3e.35.t:0 "Coronation of the Niger Golden Empire"
 oe_m3e.35.d:0 "From Niani's royal groves to Gao's riverfront and Timbuktu's crowded book bazaars, drums and brass trumpets salute the triumphant Niger throne. Now standing as a continental [great_power|e] whose [gold|e] reserves and [prestige|e] awe both Mediterranean and Atlantic courts, our council chooses the enduring legacy of West Africa."
 oe_m3e.35.a:0 "Guard the Gold Standard & Saharan Monopoly"
 STATIC_MODIFIER_NAME_oe_m3e_mal_gold_dinar_mod:0 "Trans-Saharan Gold & Salt Reserve"
 STATIC_MODIFIER_DESC_oe_m3e_mal_gold_dinar_mod:0 "Strict mithqal assaying and protected desert-to-coast caravans anchor West Africa's financial dominance."
 oe_m3e.35.b:0 "Institutionalize the Sahelian Gunpowder Vanguard"
 STATIC_MODIFIER_NAME_oe_m3e_mal_sahel_gunpowder_mod:0 "Sofa Gunpowder & River Flotilla Vanguard"
 STATIC_MODIFIER_DESC_oe_m3e_mal_sahel_gunpowder_mod:0 "Standing sofa musketeers, bronze siege batteries, and Niger gunboats defend the savanna from every threat."
 oe_m3e.35.c:0 "Crown Sankore as the Beacon of Learning"
 STATIC_MODIFIER_NAME_oe_m3e_mal_sankore_beacon_mod:0 "Sankore University of All Africa"
 STATIC_MODIFIER_DESC_oe_m3e_mal_sankore_beacon_mod:0 "Vast manuscript libraries and cosmopolitan law colleges in Timbuktu draw scholars across the hemisphere."
 oe_m3e.36.t:0 "Sovereign Congress of the Monsoon Rim"
 oe_m3e.36.d:0 "Envoys from Sofala, Zanzibar, Mombasa, Lamu, and Gujarat crowd the white coral colonnades of Husuni Kubwa as lateen sails fill the horizon. Victorious over foreign armadas and honored across the ocean as a maritime [great_power|e] of vast [trade|e] and [maritime_presence|e], our Sultanate defines the character of its Indian Ocean hegemony."
 oe_m3e.36.a:0 "Charter the Rim-Wide Monsoon Syndicate"
 STATIC_MODIFIER_NAME_oe_m3e_kil_monsoon_syndicate_mod:0 "Monsoon Dhow & Emporium Syndicate"
 STATIC_MODIFIER_DESC_oe_m3e_kil_monsoon_syndicate_mod:0 "Coordinated seasonal sailings and coastal gold-ivory exchanges channel Indian Ocean wealth into Swahili hands."
 oe_m3e.36.b:0 "Expand the Coral Bastion & Broadside Fleet"
 STATIC_MODIFIER_NAME_oe_m3e_kil_coral_armada_mod:0 "Coral Bastion & Broadside Armada"
 STATIC_MODIFIER_DESC_oe_m3e_kil_coral_armada_mod:0 "Heavy-timber war dhows, reef forts, and seasoned Swahili mariners rule every monsoon strait."
 oe_m3e.36.c:0 "Cultivate the Cosmopolitan Swahili Letters"
 STATIC_MODIFIER_NAME_oe_m3e_kil_swahili_cosmopolis_mod:0 "Cosmopolitan Swahili Letters & Ports"
 STATIC_MODIFIER_DESC_oe_m3e_kil_swahili_cosmopolis_mod:0 "Open stone-town academies and multilingual courts turn the Swahili coast into a bridge of civilizations."
 oe_m3e.37.t:0 "Charter of the Equatorial Renaissance"
 oe_m3e.37.d:0 "Master bronze casters, royal printers, and river admirals assemble before the throne as sovereign banners fly unbroken from the Gulf of Guinea to the Congo estuary. Standing proud as an Atlantic [great_power|e] built upon free [manpower|e] and vibrant [prosperity|e], our realm seals the cornerstone of Central-West Africa's independent future."
 oe_m3e.37.a:0 "Champion Sovereign Craft & Clean Commerce"
 STATIC_MODIFIER_NAME_oe_m3e_kon_sovereign_commerce_mod:0 "Brass, Ivory & Clean Atlantic Commerce"
 STATIC_MODIFIER_DESC_oe_m3e_kon_sovereign_commerce_mod:0 "Guild-certified brassware, raffia textiles, and equatorial spices command equal trade across every ocean."
 oe_m3e.37.b:0 "Entrench Sovereign Flintlock & Earthwork Legions"
 STATIC_MODIFIER_NAME_oe_m3e_kon_rainforest_guard_mod:0 "Sovereign Flintlock & Earthwork Legions"
 STATIC_MODIFIER_DESC_oe_m3e_kon_rainforest_guard_mod:0 "Domestic arsenals and monumental rainforest earthworks keep every foreign predator far from our shores."
 oe_m3e.37.c:0 "Magnify the Equatorial Printing Academies"
 STATIC_MODIFIER_NAME_oe_m3e_kon_printing_academy_mod:0 "Equatorial Royal Printing & Chancery"
 STATIC_MODIFIER_DESC_oe_m3e_kon_printing_academy_mod:0 "Multilingual royal presses and educated provincial cadres sustain an innovative, self-reliant state."
 oe_m3e.38.t:0 "Grand Council of Sovereign Turtle Island"
 oe_m3e.38.d:0 "Fifty sachems, Clan Mothers, and envoys from the Great Lakes to the Atlantic tidewaters gather around the eternal fire at Onondaga, draping newly woven wampum belts across the council rafters. Recognized worldwide as a free [great_power|e] anchored by [parliament|e] concord and [stability|e], the Confederacy chooses its guiding covenant for the ages."
 oe_m3e.38.a:0 "Enshrine the Constitutional Longhouse Republic"
 STATIC_MODIFIER_NAME_oe_m3e_iro_great_law_republic_mod:0 "Constitutional Longhouse Republic"
 STATIC_MODIFIER_DESC_oe_m3e_iro_great_law_republic_mod:0 "Written Kaianerehkowa checks and balances inspire democratic concord across North America and beyond."
 oe_m3e.38.b:0 "Maintain the Rifled Woodland Ranger Corps"
 STATIC_MODIFIER_NAME_oe_m3e_iro_woodland_rangers_mod:0 "Rifled Woodland Rangers & Lake Bastions"
 STATIC_MODIFIER_DESC_oe_m3e_iro_woodland_rangers_mod:0 "Dead-eye frontier sharpshooters and portage forts keep every colonial ambition in check."
 oe_m3e.38.c:0 "Foster the Great Lakes & Three Sisters Exchange"
 STATIC_MODIFIER_NAME_oe_m3e_iro_great_lakes_exchange_mod:0 "Great Lakes Fur & Three Sisters Exchange"
 STATIC_MODIFIER_DESC_oe_m3e_iro_great_lakes_exchange_mod:0 "Abundant communal harvests and continent-spanning inland waterways power prosperous Longhouse cities."
 oe_m3e.39.t:0 "Stela of the Second Mayan Baktun"
 oe_m3e.39.d:0 "Carved in gleaming white limestone before the stepped temples of Mayapan and Chichen Itza, the great Baktun stela records our triumph over invasion, drought, and plague. Now esteemed across the seas as a [great_power|e] whose [cultural_tradition|e] and [prosperity|e] shine anew, the multepal council proclaims the guiding star of our Second Golden Age."
 oe_m3e.39.a:0 "Illumine the Venus Observatories & Presses"
 STATIC_MODIFIER_NAME_oe_m3e_may_observatory_science_mod:0 "Venus Observatories & Botanical Presses"
 STATIC_MODIFIER_DESC_oe_m3e_may_observatory_science_mod:0 "Precision astronomy, rainforest medicine, and printed Maya scholarship lead the Americas in learning."
 oe_m3e.39.b:0 "Fortify the Holkan Steel & Karst Citadels"
 STATIC_MODIFIER_NAME_oe_m3e_may_holkan_citadels_mod:0 "Holkan Steel Regiments & Karst Bastions"
 STATIC_MODIFIER_DESC_oe_m3e_may_holkan_citadels_mod:0 "Professional holkan musketeers and limestone fortress belts turn Yucatan and Peten into an inviolable shield."
 oe_m3e.39.c:0 "Command the Caribbean Jade & Cacao League"
 STATIC_MODIFIER_NAME_oe_m3e_may_caribbean_league_mod:0 "Caribbean Jade & Cacao Maritime League"
 STATIC_MODIFIER_DESC_oe_m3e_may_caribbean_league_mod:0 "Ocean-going Mayan merchantmen and loyal coastal polities command the Gulf and Caribbean trade currents."
 oe_m3e.40.t:0 "Enthronement of the Sheriffian Empire of the Far West"
 oe_m3e.40.d:0 "Beneath the gilded arches of Marrakesh and the storied towers of Fez, delegations from Tunis, Tlemcen, Sale, and Timbuktu renew their oaths of allegiance. Acclaimed from the Atlantic to the Nile as a sovereign [great_power|e] of unmatched [legitimacy|e] and [prestige|e], the Sultan decrees the supreme destiny of the Far West."
 oe_m3e.40.a:0 "Rule the Atlantic-to-Sahara Golden Monopoly"
 STATIC_MODIFIER_NAME_oe_m3e_mor_atlantic_sahara_mod:0 "Atlantic-to-Sahara Golden Monopoly"
 STATIC_MODIFIER_DESC_oe_m3e_mor_atlantic_sahara_mod:0 "Sale's blue-water squadrons, Sous refineries, and Saharan dinar mints command two worlds of commerce."
 oe_m3e.40.b:0 "Perpetuate the Victors of the Three Kings"
 STATIC_MODIFIER_NAME_oe_m3e_mor_three_kings_army_mod:0 "Victors of the Three Kings Gunpowder Line"
 STATIC_MODIFIER_DESC_oe_m3e_mor_three_kings_army_mod:0 "Disciplined imperial musketeers, heavy bronze siege trains, and elite cavalry preserve Maghrebi mastery."
 oe_m3e.40.c:0 "Exalt Al-Qarawiyyin and El Badi Splendor"
 STATIC_MODIFIER_NAME_oe_m3e_mor_qarawiyyin_el_badi_mod:0 "Al-Qarawiyyin & El Badi Imperial Splendor"
 STATIC_MODIFIER_DESC_oe_m3e_mor_qarawiyyin_el_badi_mod:0 "Fez's ancient university and Marrakesh's golden court radiate learning and majesty across the Islamic West."
 oe_m3e.41.t:0 "Great Mandala of the Roof of the World"
 oe_m3e.41.d:0 "Silk prayer banners flutter across the crimson walls of the Potala as lamas, khans, and district governors from Guge, U-Tsang, Kham, and Amdo prostrate before the sovereign Mandala. Respected across Inner and East Asia as an unconquered [great_power|e] grounded in [stability|e] and [prestige|e], Lhasa consecrates the timeless path of the Snowland."
 oe_m3e.41.a:0 "Consecrate the Potala Patron-Priest Commonwealth"
 STATIC_MODIFIER_NAME_oe_m3e_tib_patron_mandala_mod:0 "Potala Patron-Priest Commonwealth"
 STATIC_MODIFIER_DESC_oe_m3e_tib_patron_mandala_mod:0 "Revered diplomatic mediation and harmonious monastic-lay governance bind Inner Asia to Lhasa in peace."
 oe_m3e.41.b:0 "Muster Eternal Snowland Cataphracts & Dzongs"
 STATIC_MODIFIER_NAME_oe_m3e_tib_snowland_iron_mod:0 "Snowland Cataphracts & High-Pass Dzongs"
 STATIC_MODIFIER_DESC_oe_m3e_tib_snowland_iron_mod:0 "Armored highland cavalry and artillery-crowned mountain passes render the Roof of the World impregnable."
 oe_m3e.41.c:0 "Unite the Tea-Horse Road & Three Academies"
 STATIC_MODIFIER_NAME_oe_m3e_tib_chama_gelug_mod:0 "Tea-Horse Corridor & Three Monastic Academies"
 STATIC_MODIFIER_DESC_oe_m3e_tib_chama_gelug_mod:0 "High-pass caravan guilds and the woodblock printing halls of Sera, Drepung, and Ganden enrich the plateau."
