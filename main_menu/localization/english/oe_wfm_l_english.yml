l_english:
# NEW 2026-11-24 v26.1 WP15-3 Ming Historical Gap Arcs & 15 Curated East Asian Landmarks (oe_wfm_, gen_v261_wanfang_ming_landmarks.py) — 0 vanilla overrides, 0 oe_pmng overlap, G09/G12/G_ELR_ISOLATION compliant. Edit gen_v261_wanfang_ming_landmarks.py, not this file.
 STATIC_MODIFIER_NAME_oe_wfm_mod_border_princes:0 "Enfeoffment of the Nine Border Princes"
 STATIC_MODIFIER_DESC_oe_wfm_mod_border_princes:0 "Imperial princes garrisoning Yan, Jin, Qin, and Ning command seasoned frontier hosts against steppe incursions, though princely retinues dilute central crown leverage."
 STATIC_MODIFIER_NAME_oe_wfm_mod_central_commissions:0 "Centralized Five Military Commissions"
 STATIC_MODIFIER_DESC_oe_wfm_mod_central_commissions:0 "Restricting princely military retainers in favor of rotated Five-Commission commanders keeps frontier armies answerable to the throne while irritating royal nobles."
 STATIC_MODIFIER_NAME_oe_wfm_mod_jianwen_reduction:0 "Jianwen Imperial Reduction Edicts"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jianwen_reduction:0 "Rapidly dissolving princely fiefs concentrates provincial administration under civil officials while provoking fierce noble and royal clan alarm."
 STATIC_MODIFIER_NAME_oe_wfm_mod_princely_compromise:0 "Gradual Princely Stipend Settlement"
 STATIC_MODIFIER_DESC_oe_wfm_mod_princely_compromise:0 "Buying out princely military garrisons with generous imperial stipends eases noble friction and stabilizes the court at a lasting fiscal drain."
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingnan_scholars:0 "Triumph of the Civil Scholars"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingnan_scholars:0 "Holding the southern throne under Confucian academicians elevates civil governance and classical scholarship while leaving frontier armies costlier to sustain."
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingnan_regency:0 "Northern Frontier Military Ascendancy"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingnan_regency:0 "Battle-hardened northern campaigns forge disciplined Ming armies and resolute military leadership, though traditional scholars recoil at wartime rigor."
 STATIC_MODIFIER_NAME_oe_wfm_mod_literati_amnesty:0 "Clemency for Jiangnan Literati"
 STATIC_MODIFIER_DESC_oe_wfm_mod_literati_amnesty:0 "Sparing dissenting scholars and opening the Hanlin Academy to reconciled talents heals post-war scars and enriches cultural prestige while softening royal awe."
 STATIC_MODIFIER_NAME_oe_wfm_mod_iron_orthodoxy:0 "Iron Orthodoxy & Jianzhou Reordering"
 STATIC_MODIFIER_DESC_oe_wfm_mod_iron_orthodoxy:0 "Uncompromising enforcement of dynastic legitimacy paired with tighter Liaodong Jurchen garrisons projects central authority at the cost of scholarly alienation."
 STATIC_MODIFIER_NAME_oe_wfm_mod_grand_coordinators:0 "Provincial Grand Coordinators (Xunfu)"
 STATIC_MODIFIER_DESC_oe_wfm_mod_grand_coordinators:0 "Dispatching imperial Grand Coordinators to unify provincial civil, judicial, and military commissions streamlines realm control while expanding official stipends."
 STATIC_MODIFIER_NAME_oe_wfm_mod_three_commissions:0 "Classical Three-Commission Balance"
 STATIC_MODIFIER_DESC_oe_wfm_mod_three_commissions:0 "Preserving Hongwu's strict separation of provincial powers curbs gubernatorial overreach and trims fiscal overhead at slower provincial coordination."
 STATIC_MODIFIER_NAME_oe_wfm_mod_renxuan_recuperation:0 "Renxuan Agrarian Recuperation"
 STATIC_MODIFIER_DESC_oe_wfm_mod_renxuan_recuperation:0 "Halting costly foreign ventures to remit grain taxes and repair county granaries ushers in a golden age of rural prosperity while shrinking overseas reach."
 STATIC_MODIFIER_NAME_oe_wfm_mod_maritime_readiness:0 "Coastal Shipyards & Oceanic Readiness"
 STATIC_MODIFIER_DESC_oe_wfm_mod_maritime_readiness:0 "Keeping coastal dockyards and ocean charts active preserves Ming maritime expertise and commercial reach while drawing steadily on naval upkeep."
 STATIC_MODIFIER_NAME_oe_wfm_mod_tumu_emergency:0 "Emergency Defense of the Northern Gate"
 STATIC_MODIFIER_DESC_oe_wfm_mod_tumu_emergency:0 "Declaring a realm-wide defense of Beijing rallies provincial reinforcements and garrison resolve under acute wartime strain."
 STATIC_MODIFIER_NAME_oe_wfm_mod_tumu_retrenchment:0 "Southern Treasury Retrenchment"
 STATIC_MODIFIER_DESC_oe_wfm_mod_tumu_retrenchment:0 "Shifting reserves southward shields fiscal treasuries and civil order from steppe shock, at a painful blow to imperial prestige."
 STATIC_MODIFIER_NAME_oe_wfm_mod_yu_qian_camps:0 "Yu Qian's Twelve Training Camps"
 STATIC_MODIFIER_DESC_oe_wfm_mod_yu_qian_camps:0 "Reorganizing fragmented metropolitan guards into unified elite Training Camps transforms Beijing's defense into a steel bulwark at increased military upkeep."
 STATIC_MODIFIER_NAME_oe_wfm_mod_capital_militia:0 "Metropolitan Levy Mobilization"
 STATIC_MODIFIER_DESC_oe_wfm_mod_capital_militia:0 "Drawing broadly on North Zhili and Shandong garrison levies swells manpower and trims fort costs, though hastily trained ranks lack regular drill."
 STATIC_MODIFIER_NAME_oe_wfm_mod_southern_palace_truce:0 "Conciliation of the Southern Palace"
 STATIC_MODIFIER_DESC_oe_wfm_mod_southern_palace_truce:0 "Treating the returned Retired Emperor with visible filial honor calms court factionalism and noble unease while leaving rival loyalties quietly alive."
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingtai_centralization:0 "Consolidated Jingtai Succession"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingtai_centralization:0 "Tightening palace guards and consolidating the Jingtai ministerial coalition sharpens cabinet governance while fueling bitter aristocratic resentment."
 STATIC_MODIFIER_NAME_oe_wfm_mod_tianshun_restoration:0 "1457 Tianshun Restoration Order"
 STATIC_MODIFIER_DESC_oe_wfm_mod_tianshun_restoration:0 "The dramatic return of Emperor Yingzong restores senior dynastic legitimacy and rewards noble partisans, though the purge of Jingtai reformers sets back army drill."
 STATIC_MODIFIER_NAME_oe_wfm_mod_jingtai_continuity:0 "Foiled Coup: Jingtai Reform Continuity"
 STATIC_MODIFIER_DESC_oe_wfm_mod_jingtai_continuity:0 "With Yu Qian's loyal regiments securing the palace gates, the Jingtai reform cabinet endures intact despite enduring hostility from conservative court nobles."
 STATIC_MODIFIER_NAME_oe_wfm_mod_martial_exams:0 "Imperial Martial Examinations (Wuju)"
 STATIC_MODIFIER_DESC_oe_wfm_mod_martial_exams:0 "Instituting triennial Imperial Martial Examinations opens officer ranks to talented tacticians across the provinces, lifting military quality at modest examination expense."
 STATIC_MODIFIER_NAME_oe_wfm_mod_humane_rites:0 "Abolition of Palace Immolation"
 STATIC_MODIFIER_DESC_oe_wfm_mod_humane_rites:0 "Ending the harsh early-Ming custom of palace funerary immolation wins enduring moral prestige and civil harmony across the empire, mildly ruffling ultra-traditionalists."
 STATIC_MODIFIER_NAME_oe_wfm_mod_wokou_crackdown:0 "Shuangyu Anti-Contraband Crackdown"
 STATIC_MODIFIER_DESC_oe_wfm_mod_wokou_crackdown:0 "Smashing offshore smuggling strongholds tightens coastal security and blockade discipline while bruising southeastern merchant families tied to overseas trade."
 STATIC_MODIFIER_NAME_oe_wfm_mod_coastal_accommodation:0 "Quiet Coastal Guild Truce"
 STATIC_MODIFIER_DESC_oe_wfm_mod_coastal_accommodation:0 "Tolerating local maritime brokers keeps Jiangnan and Fujian commerce humming and calms burghers, at the expense of weaker imperial control along remote coves."
 STATIC_MODIFIER_NAME_oe_wfm_mod_hu_zongxian_intel:0 "Hu Zongxian's Coastal Intelligence Network"
 STATIC_MODIFIER_DESC_oe_wfm_mod_hu_zongxian_intel:0 "Deploying spies, secret parleys, and unified provincial logistics fractures rival Wokou captains before battle, funded by heavy covert stipends."
 STATIC_MODIFIER_NAME_oe_wfm_mod_coastal_fort_chain:0 "Zhejiang-Fujian Coastal Bastion Chain"
 STATIC_MODIFIER_DESC_oe_wfm_mod_coastal_fort_chain:0 "Linking fortified coastal towns and signal beacons shields fertile delta counties from sudden raids while restricting free coastal navigation."
 STATIC_MODIFIER_NAME_oe_wfm_mod_yu_dayou_fleet:0 "Admiral Yu Dayou's War Junk Armadas"
 STATIC_MODIFIER_DESC_oe_wfm_mod_yu_dayou_fleet:0 "Heavy multi-deck Fujian war junks armed with fire-arrows and cannon shatter pirate flotillas far offshore, demanding steady shipyard outlays."
 STATIC_MODIFIER_NAME_oe_wfm_mod_estuary_watch:0 "Estuary Patrols & River Guard"
 STATIC_MODIFIER_DESC_oe_wfm_mod_estuary_watch:0 "Concentrating fast patrol craft across river mouths secures inland waterways and naval morale while slowing merchant port clearance."
 STATIC_MODIFIER_NAME_oe_wfm_mod_pacific_customs:0 "Pacified Eastern Sea Customs"
 STATIC_MODIFIER_DESC_oe_wfm_mod_pacific_customs:0 "Channeling former smugglers into licensed coastal customs turns pirate havens into thriving tax-paying ports while easing fortress readiness."
 STATIC_MODIFIER_NAME_oe_wfm_mod_iron_coast_guard:0 "Permanent Southeastern Coast Guard"
 STATIC_MODIFIER_DESC_oe_wfm_mod_iron_coast_guard:0 "Maintaining permanent naval guard stations and strict harbor registries keeps piracy permanently suppressed at the cost of tight commercial supervision."
 STATIC_MODIFIER_NAME_oe_wfm_mod_river_emergency:0 "Emergency Huai-Yellow Dike Relief"
 STATIC_MODIFIER_DESC_oe_wfm_mod_river_emergency:0 "Mobilizing emergency grain relief and corvee labor stems catastrophic flooding across northern Jiangsu while diverting silver from regular tax coffers."
 STATIC_MODIFIER_NAME_oe_wfm_mod_canal_bypass:0 "Grand Canal Bypass Excavations"
 STATIC_MODIFIER_DESC_oe_wfm_mod_canal_bypass:0 "Digging fortified bypass canals keeps southern grain barges moving north around silted river reaches, though heavy corvee labor strains rural counties."
 STATIC_MODIFIER_NAME_oe_wfm_mod_pan_jixun_hydraulics:0 "Pan Jixun's Confine-Water Hydraulics"
 STATIC_MODIFIER_DESC_oe_wfm_mod_pan_jixun_hydraulics:0 "Extending Gaojia Dike and twin embankments harnesses the clear Huai to scour Yellow River silt to the sea, lifting harvests and canal commerce at steady hydraulic upkeep."
 STATIC_MODIFIER_NAME_oe_wfm_mod_multi_branch_diversion:0 "Multi-Branch Flood Diversion Works"
 STATIC_MODIFIER_DESC_oe_wfm_mod_multi_branch_diversion:0 "Spreading floodwaters across auxiliary spillways spares local peasants from harsh dike corvee, though dispersed channels require constant provincial mediation."
 STATIC_MODIFIER_NAME_oe_wfm_mod_landmark_patronage:0 "Imperial Board of Works Landmark Patronage"
 STATIC_MODIFIER_DESC_oe_wfm_mod_landmark_patronage:0 "Commissioning master stonemasons, calligraphers, and hydraulic engineers across East Asia's great historical landmarks elevates cultural prestige and craftsmanship at steady treasury cost."
 oe_wfm_bld_forbidden_city:0 "Forbidden City — Hall of Supreme Harmony"
 oe_wfm_bld_forbidden_city_desc:0 "The ceremonial heart of imperial Beijing (Dadu), where gilded roofs, marble terraces, and vermilion walls proclaim the Celestial Mandate across East Asia."
 oe_wfm_bld_porcelain_tower:0 "Porcelain Tower of Nanjing (Dabao'en Temple)"
 oe_wfm_bld_porcelain_tower_desc:0 "An octagonal nine-story pagoda clad in polychrome glazed bricks beside the Qinhuai River at Shangyuan, marveled at by merchants and envoys from across Eurasia."
 oe_wfm_bld_yuelu_academy:0 "Yuelu Academy of Changsha"
 oe_wfm_bld_yuelu_academy_desc:0 "Famed among the Four Great Academies beneath Mount Yuelu in Changsha, nurturing generations of Neo-Confucian thinkers, statesmen, and provincial scholars."
 oe_wfm_bld_dujiangyan:0 "Dujiangyan Hydraulic Weir (Guanzhou)"
 oe_wfm_bld_dujiangyan_desc:0 "Li Bing's timeless damless diversion works on the Min River at Guanzhou (Guanxian), taming floods and irrigating the rich Sichuan plain into the Land of Abundance."
 oe_wfm_bld_potala_palace:0 "Potala Palace of Lhasa"
 oe_wfm_bld_potala_palace_desc:0 "Crowning Marpo Ri above Lhasa in towering white and crimson walls, the citadel-monastery anchors Tibetan learning, pilgrimage, and high-plateau defense."
 oe_wfm_bld_confucius_temple:0 "Temple of Confucius & Kong Manor (Qufu)"
 oe_wfm_bld_confucius_temple_desc:0 "The ancestral sanctuary of Confucius in Qufu, revered by every dynasty as the ritual fountainhead of classical letters, filial order, and scholarly orthodoxy."
 oe_wfm_bld_lingqu_canal:0 "Lingqu Canal of Guilin (Xing'an)"
 oe_wfm_bld_lingqu_canal_desc:0 "Ancient contour canal at Xing'an linking the Yangtze's Xiang River with the Pearl River's Li, carrying grain barges, salt convoys, and imperial dispatches into Lingnan."
 oe_wfm_bld_jiayuguan:0 "Jiayuguan Fortress — First Pass Under Heaven"
 oe_wfm_bld_jiayuguan_desc:0 "Triple-walled western terminus of the Ming Great Wall in Suzhou (Gansu), sealing the Hexi Corridor between the Qilian snowpeaks and Gobi sands."
 oe_wfm_bld_mogao_caves:0 "Mogao Grottoes of Dunhuang (Shazhou)"
 oe_wfm_bld_mogao_caves_desc:0 "Hundreds of painted rock-cut sanctuaries and manuscript chambers overlooking the oasis of Shazhou, preserving a millennium of Silk Road art, scripture, and Eurasian exchange."
 oe_wfm_bld_quanzhou_citong:0 "Quanzhou Zaytun Port & Ashab Mosque"
 oe_wfm_bld_quanzhou_citong_desc:0 "Cosmopolitan maritime emporium at Jinjiang where granite Islamic arches, guild wharves, and Fujian ocean junks link Chinese silk and tea to the Indian Ocean."
 oe_wfm_bld_chengde_resort:0 "Chengde Mountain Resort (Rehe Palace)"
 oe_wfm_bld_chengde_resort_desc:0 "An imperial garden-palace beyond the Great Wall in Yixingzhou (Rehe), uniting Jiangnan lakes with northern steppe pavilions to host Mongol princes and Tibetan lamas."
 oe_wfm_bld_gyeongbokgung:0 "Gyeongbokgung Palace of Hanseong"
 oe_wfm_bld_gyeongbokgung_desc:0 "Principal royal palace of Joseon nestled below Mount Bugaksan in Hanseong (Namgyeong), seat of the Hall of Worthies, royal astronomy, and peninsula statecraft."
 oe_wfm_bld_thang_long:0 "Imperial Citadel of Thang Long"
 oe_wfm_bld_thang_long_desc:0 "Centuries-old citadel of the Rising Dragon guarding the Red River Delta at Thang Long, blending mandarin examination halls with formidable concentric ramparts."
 oe_wfm_bld_osaka_castle:0 "Osaka Castle & Golden Keep"
 oe_wfm_bld_osaka_castle_desc:0 "Monumental stone-walled fortress towering over the Yodo River estuary and Seto Inland Sea trade lanes, anchoring both Kinai defense and Japan's foremost rice exchange."
 oe_wfm_bld_angkor_wat:0 "Angkor Wat & Baray Reservoirs"
 oe_wfm_bld_angkor_wat_desc:0 "Lotus-towered sandstone sanctuary ringed by vast Khmer hydraulic barays at Angkor, radiating classical Southeast Asian architectural mastery and monsoon agriculture."
 oe_wfm_dec_imperial_landmarks_patronage.title:0 "Charter the Imperial Board of Works for East Asian Landmarks"
 oe_wfm_dec_imperial_landmarks_patronage.desc:0 "Commission master architects, stonemasons, and hydraulic engineers to restore and monumentally adorn East Asia's great historical landmarks under our sovereign banner. Costs #Y 150#! gold and grants 25 years of cultural and workshop patronage."
 oe_wfm_dec_imperial_landmarks_patronage.a:0 "Issue the Imperial Construction Charter"
 oe_wfm.1.t:0 "Enfeoffment of the Nine Border Princes"
 oe_wfm.1.d:0 "With Mongol horsemen still prowling beyond the northern passes, the Ming court debates entrusting the frontier marches to imperial princes. Enfeoffing the Nine Border Princes at Beiping, Taiyuan, Xi'an, and Daning places blood-loyal commanders directly along the Great Wall, yet senior ministers warn that princely retinues may one day rival the Dragon Throne itself."
 oe_wfm.1.a:0 "Enfeoff the Border Princes to guard the northern passes"
 oe_wfm.1.b:0 "Keep frontier garrisons under the Five Military Commissions"
 oe_wfm.2.t:0 "The Jianwen Imperial Reduction Crisis"
 oe_wfm.2.d:0 "Upon the passing of the founding generation, the great northern fiefs tower over provincial prefects with elite cavalry and independent courts. Imperial tutors Qi Tai and Huang Zicheng urge swift reduction of the princes before the northern marches break free, while moderate councillors counsel patient stipend buy-outs."
 oe_wfm.2.a:0 "Press swift Imperial Reduction on Qi Tai and Huang Zicheng's counsel"
 oe_wfm.2.b:0 "Offer generous princely stipends to ease the transition"
 oe_wfm.3.t:0 "The Jingnan Crossroads: Scholars or Northern Regency"
 oe_wfm.3.d:0 "The reduction edicts have ignited a climactic struggle between the Confucian civil court at Yingtian and the battle-hardened frontier armies marching south from Beiping. Across the Grand Canal and Yangtze crossings, the Ming Empire must decide whether centralizing scholars hold the throne or northern military commanders reshape the dynasty."
 oe_wfm.3.a:0 "Northern military banners prevail and reshape the Ming court"
 oe_wfm.3.b:0 "Hold the Yangtze crossings and uphold the civil scholars' court"
 oe_wfm.4.t:0 "Fang Xiaoru's Defiance and the Jianzhou Frontier"
 oe_wfm.4.d:0 "With the Jingnan storm subsiding, the victorious throne confronts two lasting tests: in the south, celebrated scholar Fang Xiaoru refuses to draft the accession edict, forcing a choice between merciful reconciliation with Jiangnan literati and uncompromising dynastic rigor; in the northeast, relocating Jianzhou Jurchen tribes along the Liaodong frontier requires durable tributary oversight."
 oe_wfm.4.a:0 "Grant clemency to Jiangnan scholars and stabilize Liaodong amicably"
 oe_wfm.4.b:0 "Enforce iron dynastic orthodoxy and tighten Jianzhou border watch"
 oe_wfm.5.t:0 "The Renxuan Reign and Provincial Grand Coordinators"
 oe_wfm.5.d:0 "After decades of grand campaigns and monumental construction, Grand Secretaries Yang Shiqi, Yang Rong, and Yang Pu—the celebrated Three Yangs—guide the throne toward administrative harmony. They propose regularizing imperial Grand Coordinators (Xunfu) to bridge the separate civil, judicial, and military commissions across the provinces."
 oe_wfm.5.a:0 "Institutionalize Provincial Grand Coordinators across the realm"
 oe_wfm.5.b:0 "Preserve the strict Hongwu separation of the Three Commissions"
 oe_wfm.6.t:0 "Renxuan Fiscal Consolidation and Maritime Readiness"
 oe_wfm.6.d:0 "Treasury ledgers reveal that repeated steppe campaigns and distant fleet expeditions have strained county granaries and Jiangnan taxpayers. Ministers urge comprehensive agrarian tax relief to foster domestic prosperity, while coastal admirals plead to preserve Longjiang's shipwright skills and sea charts rather than letting maritime power vanish."
 oe_wfm.6.a:0 "Remit agrarian levies and invest in county granaries and relief"
 oe_wfm.6.b:0 "Maintain Longjiang shipyards and coastal patrol readiness"
 oe_wfm.7.t:0 "1449 The Tumu Crisis: Shock Beyond Juyong Pass"
 oe_wfm.7.d:0 "Catastrophic dispatches thunder through Juyong Pass: an ill-prepared imperial expedition into the northern steppe has been encircled and shattered at the post-station of Tumu! With border garrisons reeling and steppe riders bearing down on the northern plains, terrified courtiers whisper of abandoning Beijing for Nanjing—until Vice Minister of War Yu Qian steps forward to denounce retreat."
 oe_wfm.7.a:0 "Stand with Yu Qian: Beijing shall never be abandoned!"
 oe_wfm.7.b:0 "Shift fiscal reserves southward while bracing the passes"
 oe_wfm.8.t:0 "Jingtai Regency and Yu Qian's Defense of Beijing"
 oe_wfm.8.d:0 "Backed by the Jingtai Emperor, Minister of War Yu Qian clears the granaries of Tongzhou, rallies provincial garrisons to Deshengmen, and reorganizes fragmented capital guards into the elite Twelve Training Camps (Tuanying). Under disciplined cannon and matchlock volleys before Beijing's nine gates, the steppe storm breaks—opening a window to modernize Ming's central armies."
 oe_wfm.8.a:0 "Establish Yu Qian's Twelve Training Camps as permanent elites"
 oe_wfm.8.b:0 "Rely on broader North Zhili and Shandong garrison levies"
 oe_wfm.9.t:0 "Shadow of the Southern Palace"
 oe_wfm.9.d:0 "Diplomacy and Beijing's resolute defense have secured the former emperor's return from steppe captivity, yet the presence of a Retired Emperor secluded within the Southern Palace casts a long political shadow over the Jingtai court. Courtiers watch anxiously as questions of filial ritual and imperial succession divide senior ministers from ambitious military men."
 oe_wfm.9.a:0 "Honor the Retired Emperor openly to heal dynastic rifts"
 oe_wfm.9.b:0 "Keep tight palace oversight to secure the Jingtai court"
 oe_wfm.10.t:0 "1457 The Duomen Coup: Storming of the Southern Gate"
 oe_wfm.10.d:0 "On a freezing winter night as Emperor Jingtai lies gravely ill, General Shi Heng, eunuch Cao Jixiang, and scholar Xu Youzhen lead armed retainers to smash open the Southern Palace gate and escort Retired Emperor Yingzong back to the Hall of Imperial Supremacy. With dawn breaking over the Forbidden City, the fate of the Tianshun Restoration—and of loyalist reformer Yu Qian—hangs on a razor's edge."
 oe_wfm.10.a:0 "The Tianshun Restoration prevails over the Forbidden City"
 oe_wfm.10.b:0 "Yu Qian's Training Camps seal the gates and foil the coup"
 oe_wfm.11.t:0 "Abolition of Palace Immolation and First Martial Examinations"
 oe_wfm.11.d:0 "Emerging from a turbulent decade of steppe war and palace intrigue, the Ming throne leaves two landmark institutional legacies: formally inaugurating triennial Imperial Martial Examinations (Wuju) to recruit literate officers versed in tactics and horsemanship, and issuing a compassionate edict forever abolishing the harsh early-Ming custom of palace funerary immolation."
 oe_wfm.11.a:0 "Institute the Triennial Imperial Martial Examinations nationwide"
 oe_wfm.11.b:0 "Proclaim the Humane Edict abolishing palace immolation forever"
 oe_wfm.12.t:0 "Shuangyu Contraband and the Wokou Storm"
 oe_wfm.12.d:0 "Decades of rigid coastal prohibitions have collided with surging East Asian silver trade. Armed maritime syndicates—blending Fujianese merchant captains like Wang Zhi with Japanese ronin—have turned offshore islands such as Shuangyu into bustling contraband forts, and raids now strike deep into Zhejiang and Jiangnan towns."
 oe_wfm.12.a:0 "Back Inspector Zhu Wan's iron crackdown on Shuangyu smugglers"
 oe_wfm.12.b:0 "Seek quiet accommodation with coastal merchant syndicates"
 oe_wfm.13.t:0 "Supreme Commander Hu Zongxian's Grand Strategy"
 oe_wfm.13.d:0 "With coastal raids escalating into full-scale campaigns across Zhejiang and South Zhili, Supreme Commander Hu Zongxian proposes a unified theater strategy: combining covert envoys and intelligence to turn rival pirate leaders against one another while coordinating regional grain, ordnance, and coastal garrisons."
 oe_wfm.13.a:0 "Fund Hu Zongxian's covert intelligence and unified command"
 oe_wfm.13.b:0 "Build an interlocking chain of coastal walled bastions first"
 oe_wfm.14.t:0 "Admiral Yu Dayou's War Junks and Southern Sweeps"
 oe_wfm.14.d:0 "While trained land infantry clears inland raiders, veteran Admiral Yu Dayou insists that the pirate scourge can only be uprooted at sea. He petitions the Ministry of War to expand squadrons of towering Fujian war junks armed with cannon and fire weapons to crush pirate armadas off Nan'ao and the Taiwan Strait."
 oe_wfm.14.a:0 "Commission Admiral Yu Dayou's heavy war-junk armadas"
 oe_wfm.14.b:0 "Concentrate agile patrol squadrons across river estuaries"
 oe_wfm.15.t:0 "Pacification of the Eastern Seas"
 oe_wfm.15.d:0 "Following decisive land and sea victories from Zhejiang to Guangdong, the great Wokou storm finally breaks. Yet seasoned provincial governors warn that unless the court settles the underlying question of licensed maritime commerce, desperate fishermen and unemployed sailors will inevitably return to piracy."
 oe_wfm.15.a:0 "Channel coastal merchants into licensed customs and peaceful trade"
 oe_wfm.15.b:0 "Maintain permanent naval guard stations and strict registries"
 oe_wfm.16.t:0 "Yellow River Captures the Huai and Grand Canal Silting"
 oe_wfm.16.d:0 "Centuries of silt have lifted the Yellow River bed above the North China Plain, sending surging muddy floods southward into the Huai River basin. Swollen waters threaten Hongze Lake, the Ming ancestral tombs at Fengyang, and the vital Grand Canal locks carrying southern grain barges north to Beijing."
 oe_wfm.16.a:0 "Dispatch emergency treasury funds to seal breaches and relieve counties"
 oe_wfm.16.b:0 "Excavate fortified Grand Canal bypass channels around the silt"
 oe_wfm.17.t:0 "Pan Jixun's Masterwork: Confine Water to Scour Silt"
 oe_wfm.17.d:0 "Four-time Director-General of River Conservancy Pan Jixun presents his celebrated treatise, A Comprehensive View of River Defense. Rejecting fragmented branch diversions that slow the current and worsen silting, he proposes raising the massive Gaojia Dike and twin embankments to 'harness the clear Huai to brush the muddy Yellow, and confine the water to scour its own silt to the sea.'"
 oe_wfm.17.a:0 "Enact Pan Jixun's Gaojia Dike and Confine-Water engineering"
 oe_wfm.17.b:0 "Favor milder multi-branch floodways to spare peasant corvee"
