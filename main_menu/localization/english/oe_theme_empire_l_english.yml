 OE_THEME_EMP_AUTH_15: "Imperial Authority is at least #Y 15#!"
 OE_THEME_PREF_1_TITLE: "Praetorian Prefecture of the East"
 oe_theme_found_prefecture_1_action: "Found All Themes in Praetorian Prefecture of the East"
 oe_theme_found_prefecture_1_action_desc: "Found themes across every eligible unoccupied province in the Praetorian Prefecture of the East using Town and Capital Hub deployment (sharply reducing food upkeep). Costs #R 5#! Imperial Authority each and stops cleanly when Authority runs out."
 oe_theme_found_pref_1_tt: "Batch-founds all eligible themes in the Praetorian Prefecture of the East for #Y 5#! Imperial Authority each."
 oe_theme_found_pref_1_none_tt: "At least one province in the Praetorian Prefecture of the East is eligible to found a theme"
 oe_theme_unlock_prefecture_1_action: "Enact Praetorian Prefecture of the East Theme Charter"
 oe_theme_unlock_prefecture_1_action_desc: "Spend #R 15#! Imperial Authority to charter imperial theme organization across the entire Praetorian Prefecture of the East (including frontier provinces), independent of other theatres."
 oe_theme_unlock_prefecture_1_action_card: "Spend #R 15#! Imperial Authority to unlock theme founding across the Praetorian Prefecture of the East."
 oe_theme_unlock_pref_1_elig_tt: "Control a key capital or campaign victory in the Praetorian Prefecture of the East and have not yet enacted this charter"
 oe_theme_unlock_pref_1_tt: "Permanently unlocks all classical provincial and frontier themes in the Praetorian Prefecture of the East."
