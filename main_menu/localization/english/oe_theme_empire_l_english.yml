 oe_theme_consolidate_exarchates_action: "Consolidate Eastern Grand Themes (E01-E10)"
 oe_theme_consolidate_exarchates_action_desc: "Consolidates the 37 fragmented medieval Eastern themes (R02-R38) along classical diocesan lines into 10 Grand Themes (E01-E10), merging armies, fleets, half their treasuries, and urban hub posts to keep a full Roman Empire lean and responsive."
 oe_theme_exarchate_unlock_tt: "Praetorian Prefectures are unlocked or at least one Eastern Exarchate group has two or more active themes"
 oe_theme_exarchate_ready_tt: "At least one Eastern Grand Theme group (E01-E10) has 2 or more active member themes ready to merge"
 oe_theme_consolidate_exarchates_tt: "Convenes the Consistorium to merge eligible Eastern themes into Grand Themes (costs #Y 5#! Imperial Authority)."
 oe_theme_empire.1.t: "Prefecture Themes Established"
 oe_theme_empire.1.d: "Imperial charters have reached the prefecture. A total of #Y [ROOT.GetCountry.MakeScope.GetVariable('oe_theme_found_pref_count').GetValue|0]#! new themes have been founded with capital seats, urban hub posts, garrisons, and Praetorian Prefecture registry complete."
 oe_theme_empire.1.a: "Charge the strategoi with their posts"
 oe_theme_empire.2.t: "Eastern Grand Theme Consolidation (E01-E10)"
 oe_theme_empire.2.desc: "As the Empire spans three continents, the small medieval themes of the Balkans and Anatolia have grown unwieldy. The Consistorium proposes merging adjacent Eastern themes into up to 10 diocesan Grand Themes (groups currently ready: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_theme_emp_exarchate_ready_count')|0]#!), preserving their armies, fleets, and hub posts while keeping imperial administration lean."
 oe_theme_empire.2.a: "Consolidate all eligible Eastern Grand Themes (E01-E10)"
 oe_theme_empire.2.a.tt: "Costs #R 5#! Imperial Authority. Merges all eligible Eastern and Illyrian theme groups into Grand Themes."
 oe_theme_empire.2.b: "Consolidate Prefecture of the East only (E01/E04/E06-E10)"
 oe_theme_empire.2.b.tt: "Costs #R 5#! Imperial Authority. Merges only the Thracian, Aegean, and Anatolian Grand Theme groups."
 oe_theme_empire.2.c: "Consolidate Prefecture of Illyricum only (E02/E03/E05)"
 oe_theme_empire.2.c.tt: "Costs #R 5#! Imperial Authority. Merges only the Macedonian, Hellas-Morea, and Moesian Grand Theme groups."
 oe_theme_empire.2.d: "Not now — retain the smaller medieval themes"
 oe_theme_empire.2.d.tt: "No Imperial Authority is spent; existing themes remain unchanged."
 oe_theme_cap_army_auto: "Imperial Army Themes (Capped)"
 AUTO_MODIFIER_NAME_oe_theme_cap_army_auto: "Imperial Army Themes (Capped)"
 AUTO_MODIFIER_DESC_oe_theme_cap_army_auto: "Monthly capped bonus from imperial army, frontier, and Latin themes (up to 15 themes), increasing national manpower and army maintenance efficiency."
 oe_theme_cap_civil_auto: "Imperial Administrative Themes (Capped)"
 AUTO_MODIFIER_NAME_oe_theme_cap_civil_auto: "Imperial Administrative Themes (Capped)"
 AUTO_MODIFIER_DESC_oe_theme_cap_civil_auto: "Monthly capped bonus from imperial administrative themes (up to 10 themes), improving food production, tax efficiency, literacy, and capital proximity propagation."
 oe_theme_cap_navy_auto: "Imperial Naval Themes (Capped)"
 AUTO_MODIFIER_NAME_oe_theme_cap_navy_auto: "Imperial Naval Themes (Capped)"
 AUTO_MODIFIER_DESC_oe_theme_cap_navy_auto: "Monthly capped bonus from imperial naval themes (up to 10 themes), boosting sailor reserves while reducing maritime presence decay and piracy."
 oe_theme_cap_frontier_auto: "Imperial Frontier Themes (Capped)"
 AUTO_MODIFIER_NAME_oe_theme_cap_frontier_auto: "Imperial Frontier Themes (Capped)"
 AUTO_MODIFIER_DESC_oe_theme_cap_frontier_auto: "Monthly capped bonus from imperial frontier march themes (up to 8 themes), improving fort maintenance efficiency and garrison capacity."
 oe_theme_cap_charter_auto: "Imperial Chartered Cities (Capped)"
 AUTO_MODIFIER_NAME_oe_theme_cap_charter_auto: "Imperial Chartered Cities (Capped)"
 AUTO_MODIFIER_DESC_oe_theme_cap_charter_auto: "Monthly capped bonus from imperial chartered commercial themes (up to 8 themes), increasing production efficiency, trade income, and merchant power."
 oe_theme_cap_latin_auto: "Imperial Latin Themes (Capped)"
 AUTO_MODIFIER_NAME_oe_theme_cap_latin_auto: "Imperial Latin Themes (Capped)"
 AUTO_MODIFIER_DESC_oe_theme_cap_latin_auto: "Monthly capped bonus from imperial Latin military themes (up to 6 themes), improving mercenary maintenance efficiency and land morale."
 oe_theme_prefecture_dipcap_auto: "Praetorian Prefecture Diplomatic Relief"
 AUTO_MODIFIER_NAME_oe_theme_prefecture_dipcap_auto: "Praetorian Prefecture Diplomatic Relief"
 AUTO_MODIFIER_DESC_oe_theme_prefecture_dipcap_auto: "Each active Praetorian Prefecture (up to 4) grants additional diplomatic capacity and a diplomatic capacity modifier to support empire-wide theme administration."
