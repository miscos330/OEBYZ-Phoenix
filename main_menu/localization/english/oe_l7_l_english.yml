l_english:
 oe_l7_ex_dec_carry_purple.title: "Take Up the Imperial Purple in Exile"
 oe_l7_ex_dec_carry_purple.desc: "With the Queen of Cities fallen, a surviving exiled Byzantine court, Trebizond, or Theodoro may formally raise the imperial purple banner and begin the road to reconquest."
 oe_l7_ex_dec_carry_purple.a: "Raise the Double-Headed Eagle in Exile"
 oe_l7_ex_dec_rally_diaspora.title: "Rally the Greek Exile Diaspora"
 oe_l7_ex_dec_rally_diaspora.desc: "Spend treasury and prestige to summon exiled Greek sailors, artisans, and light horsemen from across the Aegean, Venice, and the Black Sea, bolstering manpower and morale at the cost of burgher strain."
 oe_l7_ex_dec_rally_diaspora.a: "Muster the Greek Exile Volunteers"
 oe_l7_ex_dec_claim_reconquest.title: "Reclaim the Throne on the Bosporus"
 oe_l7_ex_dec_claim_reconquest.desc: "After bitter years in exile, our banners have retaken Constantinople! Hold the restoration ceremony in Hagia Sophia, clear exile debts, and proclaim the phoenix reborn."
 oe_l7_ex_dec_claim_reconquest.a: "Restore the Seat on the Bosporus"
 OE_L7_S1_UN: " In the City they are still quarrelling over the union."
 OE_L7_OEL7S1UN_NONE: ""
 OE_L7_S1_ADR: " The families who once moved here from Adrianoúpolis must flee once more."
 OE_L7_OEL7S1ADR_NONE: ""
 OE_L7_S3_PA: " The walls have been made good, and the envoys to the West have come back."
 OE_L7_S3_P: " The walls have been made good."
 OE_L7_S3_A: " The envoys to the West have come back."
 OE_L7_OEL7S3PREP_NONE: ""
 OE_L7_S3_OO: " The guns of Urban, the Hungarian cannon-founder, stand on the walls."
 OE_L7_S3_OT: " Outside the walls stands a great gun such as no one has ever seen."
 OE_L7_OEL7S3ORBAN_NONE: ""
 OE_L7_S3_U2: " The City quarrelled all winter over the union, and its people are divided."
 OE_L7_S3_U1: " The City still talks of the union."
 OE_L7_OEL7S3UN_NONE: ""
 OE_L7_S3_W2: " It is said that Wallachian horsemen are on the way, but no one can say whether they will come in time."
 OE_L7_S3_W1: " Wallachia promised soldiers, and nothing has been heard since."
 OE_L7_OEL7S3WAL_NONE: ""
 OE_L7_S3_S2: " The sultan will wait no longer."
 OE_L7_S3_S1: " The sultan has already waited a month."
 OE_L7_OEL7S3STALL_NONE: ""
 OE_L7_END_1: "Held: the besiegers drew off, and the City is still the empire's."
 OE_L7_END_2: "Fell: the defence failed, the City is the sultan's, and the court withdrew to [GetCountry('BYZ').GetCapital.GetName].[GetCountry('BYZ').Custom('OeL7Aft')][GetCountry('BYZ').Custom('OeL7Mor')]"
 OE_L7_END_3: "The gates opened: the empire gave up the City for the Morea and safe conduct, and the court withdrew to [GetCountry('BYZ').GetCapital.GetName].[GetCountry('BYZ').Custom('OeL7Aft')][GetCountry('BYZ').Custom('OeL7Mor')]"
 OE_L7_END_4: "Peace bought: the empire emptied its treasury and the sultan withdrew; the sultan may come again in ten years."
 OE_L7_END_5: "The City was lost in war.[GetCountry('BYZ').Custom('OeL7Aft')][GetCountry('BYZ').Custom('OeL7Mor')]"
 OE_L7_END_6: "By the end of 1480 no sultan came to besiege the City."
 OE_L7_OEL7END_NONE: ""
 OE_L7_EMP_1: " The emperor fell on the walls."
 OE_L7_EMP_2: " The emperor broke out of the City."
 OE_L7_EMP_3: " The emperor left the City as agreed."
 OE_L7_EMP_O: " The chance to hold had been #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds').GetValue|0]%#!."
 OE_L7_OEL7EMP_NONE: ""
 OE_L7_RUN_2: "The sultan's army is at the walls; the chance to hold is about #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds').GetValue|0]%#!."
 OE_L7_RUN_1: "The fortress on the strait is built; the sultan's envoy is due in about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_l7_rd_left')|0]#! months."
 OE_L7_OEL7RUN_NONE: ""
 OE_L7_S3_C1: " The Genoese captain holds the land walls."
 OE_L7_S3_C2: " The emperor holds the land walls in person."
 OE_L7_S3_C3: " Monks and townsmen have been formed into companies for the walls."
 OE_L7_OEL7S3CAP_NONE: ""
 OE_L7_S2_GIU: " Some years ago a Genoese soldier of fortune already came to offer the emperor service."
 OE_L7_OEL7S2GIU_NONE: ""
 OE_L7_S10_E2: " The ministers and clergy who escaped on the day the City fell are arriving one by one."
 OE_L7_S10_E3: " Those who left the City under the treaty have come with the treasury and the archives."
 OE_L7_S10_E5: " The City was lost in war, and those who escaped are arriving one by one."
 OE_L7_OEL7S10END_NONE: ""
 OE_L7_S12_ARR: " The last tribute is still owed."
 OE_L7_OEL7S12ARR_NONE: ""
 OE_L7_AFT_1: " The court made [GetCountry('BYZ').GetCapital.GetName] its new capital."
 OE_L7_AFT_2: " The emperor vowed to take back the City."
 OE_L7_AFT_3: " The court won the sultan's recognition and pays tribute every year."
 OE_L7_OEL7AFT_NONE: ""
 OE_L7_MOR_1: " Later the Morea was held."
 OE_L7_MOR_2: " Later the Morea was lost too, and the court moved once more."
 OE_L7_MOR_3: " Later the court gave up the Morea and crossed the sea."
 OE_L7_OEL7MOR_NONE: ""
 OE_L7_S13_ARR: " The sultan's envoy read out the unpaid tribute, year by year."
 OE_L7_OEL7S13ARR_NONE: ""
 OE_L7_S13_VOW: " The court once vowed to take back the City; now it must first hold the Morea."
 OE_L7_OEL7S13VOW_NONE: ""
 OE_L7_S14_SCH: " #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_un_scholars').GetValue|0]#! of them stayed in Italy back when the union was being debated."
 OE_L7_OEL7S14SCH_NONE: ""
 OE_L7_S14_WEST: " The West is still fairly kind to the Greeks who ended up there."
 OE_L7_OEL7S14WEST_NONE: ""
 OE_L7_S20_K2: " The two states have long been bound by marriage and alliance."
 OE_L7_S20_K1: " Trebizond has paid the empire tribute for years."
 OE_L7_S20_GE: " The imperial house once took an empress from Trebizond."
 OE_L7_OEL7S20KIN_NONE: ""
 OE_L7_S21_TIE: " Theodoro and the empire have long been in touch."
 OE_L7_OEL7S21TIE_NONE: ""
 STATIC_MODIFIER_NAME_oe_l7_braced: "The Walls Made Good"
 STATIC_MODIFIER_NAME_oe_l7_city_held: "The City Did Not Fall"
 STATIC_MODIFIER_NAME_oe_l7_pursuit: "The Pursuit"
 STATIC_MODIFIER_NAME_oe_l7_failed_siege: "The Siege Failed"
 STATIC_MODIFIER_NAME_oe_l7_vow: "The Vow to Retake the City"
 STATIC_MODIFIER_NAME_oe_l7_academy: "The School of the Greek Scholars"
 STATIC_MODIFIER_NAME_oe_l7_tre_aid: "Ships from the Empire"
 STATIC_MODIFIER_NAME_oe_l7_feo_aid: "Ships and Grain from the Empire"
 STATIC_MODIFIER_NAME_oe_l7_ex_court_exile: "The Purple Court in Exile"
 STATIC_MODIFIER_NAME_oe_l7_ex_pontic_pact: "Pontic and Highland Counter-Coalition"
 STATIC_MODIFIER_NAME_oe_l7_ex_quiet_remnant: "Quiet Preservation of the Remnant"
 STATIC_MODIFIER_NAME_oe_l7_ex_latin_debt: "Latin Reconquest Pledges"
 STATIC_MODIFIER_NAME_oe_l7_ex_orthodox_alms: "Northern Orthodox Alms"
 STATIC_MODIFIER_NAME_oe_l7_ex_proud_austerity: "Austerity of the Melted Plate"
 STATIC_MODIFIER_NAME_oe_l7_ex_stratioti_host: "Exile Stratioti and Sailors"
 STATIC_MODIFIER_NAME_oe_l7_ex_refugee_arsenal: "Arsenal of the Refugee Gunfounders"
 STATIC_MODIFIER_NAME_oe_l7_ex_mountain_holds: "Mountain Holds of the Remnant"
 STATIC_MODIFIER_NAME_oe_l7_ex_iron_resolve: "Iron Resolve Under Debt"
 STATIC_MODIFIER_NAME_oe_l7_ex_defiant_remnant: "Defiance Against Latin Creditors"
 STATIC_MODIFIER_NAME_oe_l7_ex_mortgaged_ports: "Mortgaged Customs of the Ports"
 STATIC_MODIFIER_NAME_oe_l7_ex_counter_crusade: "Counter-Crusade for the Bosporus"
 STATIC_MODIFIER_NAME_oe_l7_ex_maritime_thrust: "Aegean and Black Sea Flanking Push"
 STATIC_MODIFIER_NAME_oe_l7_ex_diaspora_levy: "Greek Diaspora Levy"
 STATIC_MODIFIER_NAME_oe_l7_ex_phoenix_reborn: "Phoenix Reborn from Exile"
 STATIC_MODIFIER_NAME_oe_l7_ex_phoenix_rebuilt: "Measured Imperial Reconstruction"
 oe_l7_b_appeal: "Byzantium asked us for help before the walls"
 oe_l7_b_gift: "Byzantium sent gifts and asked for time"
 oe_l7_b_island: "Byzantium promised the Genoese an island"
 oe_l7_b_recognised: "Byzantium asked us to recognise what it still holds"
 oe_l7_b_arrears: "Byzantium is in arrears with its tribute"
 oe_l7_b_scholars: "Byzantium pays for Greek scholars to stay with us"
 oe_l7_b_bride: "Byzantium promised us a princess"
 oe_l7_b_bride_w: "Byzantium seeks a Western prince for a princess"
 oe_l7_b_tre: "Byzantium helped us in our need"
 oe_l7_b_feo: "Byzantium sent ships and grain"
 oe_l7_b_feo_ally: "Byzantium keeps close counsel with us"
 oe_l7_b_ex_pontic: "The exiled court sought a joint front against the Ottomans"
 oe_l7_b_ex_latin: "The exiled court pledged trade concessions for reconquest aid"
 oe_l7_b_ex_orth: "The exiled court appealed to fellow Orthodox realms"
 oe_l7_b_ex_repudiate: "The exiled court repudiated its reconquest pledges"
 oe_l7.1.t: "The Fortress on the Strait"
 oe_l7.1.desc: "#F In history Mehmed II came to the throne again in 1451. The next spring the sultan began a fortress on the European shore of the strait, not far from the City, and it was finished by the end of summer. From then on every ship from the Black Sea had to pass under the sultan's guns.#!\n\nNow Sultan [GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]'s men are already measuring out the ground outside the walls. The Ottoman army is more than #Y 2.5#! times the empire's, and Adrianoúpolis and the villages outside the City are in their hands.[GetCountry('BYZ').Custom('OeL7S1Un')][GetCountry('BYZ').Custom('OeL7S1Adr')]"
 oe_l7.1.a: "Make good the walls and bring the grain in from the fields"
 oe_l7.1.a.tt: "Costs #R 3#! months of trade and tax income\nChance to hold the City #G +8%#!\nThe City gains [ShowModifier('oe_l7_braced')] for #Y 3#! years"
 oe_l7.1.b: "Send envoys to Rome and Venice to ask for help"
 oe_l7.1.b.tt: "Costs #R 1#! month of trade and tax income\nChance to hold the City #G +4%#!; another #G +4%#! while the West's will to help is at least #Y 50#! (now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!)\nThe Papal States: opinion of the empire #G +10#! for #Y 5#! years\nVenice: opinion of the empire #G +10#! for #Y 5#! years"
 oe_l7.1.c: "Send the sultan gifts and ask for more time"
 oe_l7.1.c.tt: "Costs #R 4#! months of trade and tax income\nThe sultan's envoy comes #Y 2#! years later\nThe Ottomans: opinion of the empire #G +15#! for #Y 5#! years\nSuch gifts can be sent only once"
 oe_l7.3.t: "The Sultan's Terms"
 oe_l7.3.desc: "#F In history, early in April 1453, the sultan's army came up to the land walls and the Ottoman fleet closed the sea. It is said that late in May the sultan sent word into the City: if the emperor gave up the City, the emperor might go safely to the Morea with family and goods. It is said that the emperor answered that the City was not the emperor's alone to give.#!\n\nNow Sultan [GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]'s tents cover the ground outside the walls, and the envoy waits at the palace gate for an answer. The chance to hold the City is about #G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds').GetValue|0]%#!.[GetCountry('BYZ').Custom('OeL7S3Prep')][GetCountry('BYZ').Custom('OeL7S3Cap')][GetCountry('BYZ').Custom('OeL7S3Orban')][GetCountry('BYZ').Custom('OeL7S3Un')][GetCountry('BYZ').Custom('OeL7S3Wal')][GetCountry('BYZ').Custom('OeL7S3Stall')]"
 oe_l7.3.a: "We do not give it up. The City belongs to all its people"
 oe_l7.3.a.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower\nChance to hold: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds').GetValue|0]%#!\nHeld: the City stays the empire's\nLost: the City goes to the sultan; the capital moves to Mystrás (while the Despotate of the Morea stands and Mystrás is the empire's), otherwise to the empire's most populous town; a truce of #Y 10#! years with the Ottomans\nThe outcome is known in a month"
 oe_l7.3.b: "Give up the City, for the Morea and safe conduct"
 oe_l7.3.b.tt: "The City goes to the sultan\nThe capital moves to Mystrás (while the Despotate of the Morea stands and Mystrás is the empire's), otherwise to the empire's most populous town\nA truce of #Y 10#! years with the Ottomans\nThe empire's claim to the City remains\nThe gates open in a month"
 oe_l7.3.c: "Empty the treasury to buy the sultan's withdrawal"
 oe_l7.3.c.tt: "Costs #R 9#! months of trade and tax income, and the first year's tribute (#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!)\nA peace bought from the Ottomans: prestige #R −15#!, [oe_tu_authority|e] #R −5#!, a truce of #Y 5#! years, tribute every year\nThe sultan withdraws, and may come again in #Y 10#! years, and then peace cannot be bought"
 oe_l7.3.d: "Stall for another month"
 oe_l7.3.d.tt: "In a month the sultan asks again (the chance to hold is worked out again)\nAt most #Y 2#! times"
 oe_l7.4.t: "The Twenty-Ninth of May"
 oe_l7.4.desc_w: "#F In history the City fell on the 29th of May 1453, and the emperor died fighting.#!\n\nNow: the sultan waited outside the walls for two years, and affairs in the east called the sultan away. The tents are struck; the fortress on the strait remains."
 oe_l7.4.desc_h: "#F In history the City fell on the 29th of May 1453, and the emperor died fighting.#!\n\nNow: the attackers left their ladders under the walls, and the sultan's tents were struck in a single night. The City still stands."
 oe_l7.4.desc_f: "#F On the day the City fell the emperor plunged into the press, and no one saw the emperor again. It is said that the emperor did not die but was turned to marble, and will one day return.#!\n\nNow: the City is the sultan's, and the court has withdrawn to [GetCountry('BYZ').GetCapital.GetName]."
 oe_l7.4.desc_o: "#F It is said that the sultan offered to let the emperor go to the Morea if the City was given up. In history the emperor refused.#!\n\nNow: the gates have opened, and the sultan lets the court leave as agreed. The court has withdrawn to [GetCountry('BYZ').GetCapital.GetName]."
 oe_l7.4.desc_fx: "#F In history the City fell on the 29th of May 1453, and the emperor died fighting.#!\n\nNow: the defence broke, but the handing over did not go through, and the City is still in the empire's hands for now."
 oe_l7.4.desc_ox: "#F It is said that the sultan offered to let the emperor go to the Morea if the City was given up. In history the emperor refused.#!\n\nNow: the surrender could not be carried out, and the City is still in the empire's hands for now."
 oe_l7.4.desc_x: "#F In history the City fell on the 29th of May 1453, and the emperor died fighting.#!\n\nThe news has come."
 oe_l7.4.a: "Give thanks in Hagia Sophia"
 oe_l7.4.a.tt: "The empire gains [ShowModifier('oe_l7_city_held')] for #Y 30#! years"
 oe_l7.4.b: "Sally out in pursuit"
 oe_l7.4.b.tt: "The empire gains [ShowModifier('oe_l7_city_held')] for #Y 30#! years\nThe empire gains [ShowModifier('oe_l7_pursuit')] for #Y 1#! years\nThe Ottomans gains [ShowModifier('oe_l7_failed_siege')] for #Y 10#! years"
 oe_l7.4.c: "Give thanks for the reprieve"
 oe_l7.4.d: "Use the time to repair the walls"
 oe_l7.4.d.tt: "Costs #R 2#! months of trade and tax income\nThe City gains [ShowModifier('oe_l7_braced')] for #Y 20#! years"
 oe_l7.4.e: "The emperor did not come back"
 oe_l7.4.e.tt: "The emperor fell on the walls\nThe successor's legitimacy #G +10#! (the fame of a death on the walls)"
 oe_l7.4.f: "The emperor broke out of the City"
 oe_l7.4.g: "Take away what can be carried"
 oe_l7.4.g.tt: "The treasury carried out: gold, #G +3#! months of trade and tax income"
 oe_l7.4.h: "So be it"
 oe_l7.2.t: "Help Within the Walls"
 oe_l7.2.desc: "#F It is said that in history, in the winter of 1452, the Genoese Giustiniani came to the City with a few hundred soldiers raised at Giustiniani's own cost, and the emperor gave Giustiniani the defence of the land walls. The Genoese of Galata across the water would offend neither side.#!\n\nNow the fortress on the strait stands, and in the City the stretches of wall are being given out to their defenders.[GetCountry('BYZ').Custom('OeL7S2Giu')]"
 oe_l7.2.a: "Give the land walls to the Genoese, and promise them an island for it"
 oe_l7.2.a.tt: "Costs #R 2#! months of trade and tax income\nChance to hold the City #G +8%#!\nGenoa: opinion of the empire #G +10#! for #Y 5#! years\nThe island is only a promise: no land changes hands"
 oe_l7.2.b: "The emperor holds the land walls, the Genoese the sea walls"
 oe_l7.2.b.tt: "Chance to hold the City #G +4%#!"
 oe_l7.2.c: "Enlist the monks and townsmen for the walls"
 oe_l7.2.c.tt: "Costs #R 1#! month of manpower\nChance to hold the City #G +4%#! (nothing while the City is in uproar over the union)"
 oe_l7.10.t: "The Court at [GetCountry('BYZ').GetCapital.GetName]"
 oe_l7.10.desc: "#F In history, after the City fell, the emperor's two brothers Thomas and Demetrios were still despots of the Morea. It is said that the two did not get on, and each held half of the peninsula.#!\n\nNow the court has come to [GetCountry('BYZ').GetCapital.GetName].[GetCountry('BYZ').Custom('OeL7S10End')] Governors and bishops everywhere wait to see what orders the new capital will send."
 oe_l7.10.a: "Make [GetCountry('BYZ').GetCapital.GetName] the new capital and call on every province"
 oe_l7.10.a.tt: "While the church framework runs: the standing of the patriarchate #R −2#! (the patriarch stayed in the sultan's city)"
 oe_l7.10.b: "Vow to take back the City"
 oe_l7.10.b.tt: "The empire gains [ShowModifier('oe_l7_vow')] for #Y 30#! years\nOnly a vow: no war is declared and no reason for war is gained"
 oe_l7.10.c: "Ask the sultan to recognise us first, to keep what is left"
 oe_l7.10.c.tt: "Pay the first year's tribute (#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!) and make a bought peace with the Ottomans: prestige #R −15#!, [oe_tu_authority|e] #R −5#!, a truce of #Y 5#! years, tribute every year\nIf such a peace already runs, it is renewed for #Y 5#! years for one more year's tribute; a war with the Ottomans, if any, ends as a bought peace ends it\nThe Ottomans: opinion of the empire #G +20#! for #Y 5#! years"
 oe_l7.11.t: "The Albanians Rise"
 oe_l7.11.desc: "#F It is said that in history, soon after the City fell, the Albanians of the Morea rose against the two despots; the despots called in the sultan's troops to put them down, and paid the sultan tribute every year after.#!\n\nNow the Albanian herdsmen of the Morea's hills have come down with their flocks and shut in several towns, saying that a court which lost the City has no right to tax them."
 oe_l7.11.a: "Ask the sultan's troops to put them down"
 oe_l7.11.a.tt: "Pay the first year's tribute (#R [GetCountry('BYZ').MakeScope.ScriptValue('oe_ttb_peace_amount')|0]#!) and make a bought peace with the Ottomans: prestige #R −15#!, [oe_tu_authority|e] #R −5#!, a truce of #Y 5#! years, tribute every year\nIf such a peace already runs, it is renewed for #Y 5#! years for one more year's tribute; a war with the Ottomans, if any, ends as a bought peace ends it"
 oe_l7.11.b: "Put them down with our own troops"
 oe_l7.11.b.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower"
 oe_l7.11.c: "Give them land, and let them guard the frontier for it"
 oe_l7.11.c.tt: "For #Y 10#! years resettlement costs half and cools down in #Y 12#! months (the resettlement line)"
 oe_l7.12.t: "The Sultan's Tribute"
 oe_l7.12.desc: "#F It is said that in history, after the City fell, the despots of the Morea had to send the sultan tribute every year; whenever it fell into arrears, the sultan's troops came.#!\n\nNow Sultan [GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]'s envoy has come to [GetCountry('BYZ').GetCapital.GetName] and asks the empire for its yearly tribute. Demands so far, this one included: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_n12').GetValue|0]#!.[GetCountry('BYZ').Custom('OeL7S12Arr')]"
 oe_l7.12.a: "Pay it"
 oe_l7.12.a.tt: "Costs #R 3#! months of trade and tax income\nA truce of #Y 5#! years with the Ottomans"
 oe_l7.12.b: "Fall into arrears"
 oe_l7.12.b.tt: "The Ottomans: opinion of the empire #R −20#! for #Y 5#! years\nThe sultan marks down the debt, but does not go to war for it"
 oe_l7.13.t: "The Last Despotate"
 oe_l7.13.desc: "#F It is said that in history the sultan marched into the Morea in 1458 and took the isthmus and the northern towns; in 1460 the sultan came again, and the Morea fell. It is said that Demetrios surrendered to the sultan, while Thomas crossed the sea to Corfu and later went on to Rome.#!\n\nNow Sultan [GetCountry('TUR').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]'s troops have reached the isthmus, and the Ottoman army is more than #Y 4#! times the empire's. The court is at [GetCountry('BYZ').GetCapital.GetName]. The chance to hold the Morea is about #G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds13').GetValue|0]%#!.[GetCountry('BYZ').Custom('OeL7S13Arr')][GetCountry('BYZ').Custom('OeL7S13Vow')]"
 oe_l7.13.a: "Hold the isthmus"
 oe_l7.13.a.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower\nChance to hold: #G [GetCountry('BYZ').MakeScope.GetVariable('oe_l7_odds13').GetValue|0]%#!\nHeld: the Morea stays the empire's\nLost: Every place the empire holds in the Morea goes to the sultan, and the capital moves to the empire's most populous town outside the Morea; a truce of #Y 10#! years with the Ottomans\nThe outcome is known in a month"
 oe_l7.13.b: "Pay what is owed and beg the sultan for time"
 oe_l7.13.b.tt: "Costs #R 4#! months of trade and tax income\nThe arrears are wiped out\nThe sultan's troops go back; the sultan may come again in #Y 5#! years, and then there is no more time to beg\nSuch a request can be made only once"
 oe_l7.13.c: "Give up the Morea and cross the sea"
 oe_l7.13.c.tt: "Every place the empire holds in the Morea goes to the sultan, and the capital moves to the empire's most populous town outside the Morea\nA truce of #Y 10#! years with the Ottomans\nThe treasury carried away: gold, #G +2#! months of trade and tax income\nThe fleet sails in a month"
 oe_l7.16.t: "The Fate of the Morea"
 oe_l7.16.desc_h: "#F In history the Morea fell in 1460, and with it the last Byzantine land in Greece.#!\n\nNow: the Ottomans lost many men before the isthmus, and the sultan's troops have drawn off. The Morea is still the empire's."
 oe_l7.16.desc_l: "#F In history the Morea fell in 1460, and with it the last Byzantine land in Greece.#!\n\nNow: the isthmus was lost, the towns of the Morea are the sultan's, and the court has withdrawn to [GetCountry('BYZ').GetCapital.GetName]."
 oe_l7.16.desc_c: "#F In history the Morea fell in 1460, and with it the last Byzantine land in Greece.#!\n\nNow: the court's fleet has left the Morea and come to [GetCountry('BYZ').GetCapital.GetName]. The towns of the Morea are the sultan's."
 oe_l7.16.desc_x: "#F In history the Morea fell in 1460, and with it the last Byzantine land in Greece.#!\n\nNow: the handing over of the Morea did not go through, and the empire's towns there remain for now."
 oe_l7.16.a: "Give thanks in church"
 oe_l7.16.b: "Gather those who escaped"
 oe_l7.16.c: "Settle in the new seat"
 oe_l7.16.d: "So be it"
 oe_l7.14.t: "Those Who Went to Italy"
 oe_l7.14.desc: "#F In history, around the fall of the City, many Greek scholars went to Italy and taught the old Greek books there. It is said that a cardinal of Greek birth left a lifetime's library to Venice.#!\n\nNow the court at [GetCountry('BYZ').GetCapital.GetName] has letters from Venice and Rome: the Greek scholars who ended up there are teaching the old books, and princes send their people to listen.[GetCountry('BYZ').Custom('OeL7S14Sch')][GetCountry('BYZ').Custom('OeL7S14West')]"
 oe_l7.14.a: "Pay for the scholars to stay in Venice and Rome"
 oe_l7.14.a.tt: "Venice: opinion of the empire #G +10#! for #Y 5#! years\nThe Papal States: opinion of the empire #G +10#! for #Y 5#! years"
 oe_l7.14.b: "Call the scholars home to teach"
 oe_l7.14.b.tt: "Costs #R 2#! months of trade and tax income\nThe empire gains [ShowModifier('oe_l7_academy')] for #Y 20#! years"
 oe_l7.14.c: "Let them be"
 oe_l7.15.t: "A Match in the North"
 oe_l7.15.desc: "#F It is said that in history, in 1472, Thomas's daughter Zoe was married, through the Papacy's good offices, to the Grand Prince of Moscow, and took the name Sophia. In time Moscow came to see itself as Rome's heir; one account has it that the idea of a 'Third Rome' began so.#!\n\nNow the Grand Prince of Moscow's envoys have come to [GetCountry('BYZ').GetCapital.GetName] to ask, for their prince, the hand of a princess of the imperial house who is not yet married. The Pope's legate is asking too, with a Western prince in mind."
 oe_l7.15.a: "Send the princess to Moscow"
 oe_l7.15.a.tt: "Moscow: opinion of the empire #G +30#! for #Y 10#! years\nMoscow will remember that this match came from the imperial house of Rome"
 oe_l7.15.b: "Give the princess to a Western prince"
 oe_l7.15.b.tt: "The Papal States: opinion of the empire #G +15#! for #Y 5#! years"
 oe_l7.15.c: "Keep the princess at court, unmarried"
 oe_l7.20.t: "Trebizond Asks for Help"
 oe_l7.20.desc: "#F In history, in the summer of 1461, the sultan's army surrounded Trebizond; in August the city opened its gates, and the empire of the Komnenoi came to an end.#!\n\nNow the Ottomans are attacking Trebizond, and Trebizond's envoys stand at the palace gate asking for help.[GetCountry('BYZ').Custom('OeL7S20Kin')]"
 oe_l7.20.a: "Send ships"
 oe_l7.20.a.tt: "Costs #R 2#! months of trade and tax income\nThe fleet has a #Y 60#!% chance to get there: if it does, Trebizond gains [ShowModifier('oe_l7_tre_aid')] for #Y 5#! years\nTrebizond: opinion of the empire #G +15#! for #Y 5#! years\nThe empire does not join the war, nor make peace for anyone"
 oe_l7.20.b: "Send money only"
 oe_l7.20.b.tt: "Give Trebizond #R 1#! month of trade and tax income\nTrebizond: opinion of the empire #G +15#! for #Y 5#! years"
 oe_l7.20.c: "We cannot help"
 oe_l7.23.t: "News of the Fleet"
 oe_l7.23.desc_a: "The empire's ships forced their way into the harbour of Trebizond, and the people cheered on the quays."
 oe_l7.23.desc_x: "The fleet met a storm on the Black Sea and never reached Trebizond."
 oe_l7.23.a: "Good"
 oe_l7.23.b: "A pity"
 oe_l7.21.t: "Envoys from Theodoro"
 oe_l7.21.desc: "#F In history the principality of Theodoro in the Crimean hills held out until 1475. That year the Ottomans took Caffa and then besieged the principality's hill fortress; when it fell, the principality was gone.#!\n\nNow Ottoman ships are seen along the Crimean coast. The prince of Theodoro has sent envoys across the sea to court, asking the empire not to forget these Greek-speaking brothers in the faith.[GetCountry('BYZ').Custom('OeL7S21Tie')]"
 oe_l7.21.a: "Keep close counsel with them"
 oe_l7.21.a.tt: "Theodoro: opinion of the empire #G +20#! for #Y 5#! years\nOnly close counsel: no military alliance is made, and the empire is not drawn into a war by it"
 oe_l7.21.b: "Send ships and grain"
 oe_l7.21.b.tt: "Costs #R 2#! months of trade and tax income\nTheodoro gains [ShowModifier('oe_l7_feo_aid')] for #Y 5#! years\nTheodoro: opinion of the empire #G +10#! for #Y 5#! years"
 oe_l7.21.c: "Decline politely"
 oe_l7.22.t: "The City of a Thousand Years"
 oe_l7.22.desc: "#F In history the City fell to the Ottomans on the 29th of May 1453.#!\n\nNow half of this year has gone by; the gates of the City open and close as ever, the markets are as loud as ever, and no sultan's army has ever come up to the walls. At court someone has brought out the old chronicles: the City has stood for more than a thousand years."
 oe_l7.22.a: "Commission a chronicle"
 oe_l7.22.b: "Proclaim an amnesty"
 oe_l7.50.t: "The Purple Court in Exile"
 oe_l7.50.desc_byz: "#F In history, after the City fell in 1453, the Palaiologoi held out at Mystras for seven years, the Komnenoi stood in Trebizond until 1461, and the principality of Theodoro endured in the Crimean hills until 1475. Trebizond even wed a princess to Uzun Hasan of Aq Qoyunlu in a bid to forge a Black Sea and highland front against the Ottomans.#!\n\nNow the Queen of Cities on the Bosporus is lost, and the court in exile gathers at [ROOT.GetCountry.GetCapital.GetName]. Counsellors debate whether to proclaim a vow of reconquest, rally a Pontic-Aq Qoyunlu coalition, or preserve the remnant in quiet austerity."
 oe_l7.50.desc_tre: "#F In history, after the City fell in 1453, the Palaiologoi held out at Mystras for seven years, the Komnenoi stood in Trebizond until 1461, and the principality of Theodoro endured in the Crimean hills until 1475. Trebizond even wed a princess to Uzun Hasan of Aq Qoyunlu in a bid to forge a Black Sea and highland front against the Ottomans.#!\n\nNow the millennium-old Queen of Cities has changed hands. On the eastern Black Sea, the Komnenian court at [ROOT.GetCountry.GetCapital.GetName] receives Greek nobles and soldiers fleeing across the water, urging the throne to take up the vacant Roman purple."
 oe_l7.50.desc_feo: "#F In history, after the City fell in 1453, the Palaiologoi held out at Mystras for seven years, the Komnenoi stood in Trebizond until 1461, and the principality of Theodoro endured in the Crimean hills until 1475. Trebizond even wed a princess to Uzun Hasan of Aq Qoyunlu in a bid to forge a Black Sea and highland front against the Ottomans.#!\n\nNow news of the fall on the Bosporus shakes the northern Black Sea. In the Crimean hills at [ROOT.GetCountry.GetCapital.GetName], the court of Theodoro flies the double-headed eagle as exile sailors and clergy gather, pleading for the principality to carry the imperial torch."
 oe_l7.50.desc_x: "#F In history, after the City fell in 1453, the Palaiologoi held out at Mystras for seven years, the Komnenoi stood in Trebizond until 1461, and the principality of Theodoro endured in the Crimean hills until 1475. Trebizond even wed a princess to Uzun Hasan of Aq Qoyunlu in a bid to forge a Black Sea and highland front against the Ottomans.#!\n\nNow the City is lost, and exiled soldiers and citizens gather at [ROOT.GetCountry.GetCapital.GetName], waiting for the court to set its course."
 oe_l7.50.a: "Proclaim the Imperial Court in Exile and Mobilize for Reconquest"
 oe_l7.50.a.tt: "Costs #R 2#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_court_exile')] for #Y 15#! years\nExile trade-off: heavy mobilization strains stability cost and burgher satisfaction"
 oe_l7.50.b: "Forge the Pontic and Aq Qoyunlu Counter-Coalition"
 oe_l7.50.b.tt: "Costs #R 3#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_pontic_pact')] for #Y 15#! years\nImproves opinion with Aq Qoyunlu, Trebizond, and Theodoro (where extant)\nTrade-off: coalition subsidies reduce domestic tax efficiency"
 oe_l7.50.c: "Lie Low and Preserve the Remnant"
 oe_l7.50.c.tt: "[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_quiet_remnant')] for #Y 15#! years\nTrade-off: quiet survival lowers monthly prestige"
 oe_l7.51.t: "Western and Orthodox Appeals in Exile"
 oe_l7.51.desc: "#F In history, Thomas Palaiologos carried the relic of Saint Andrew to Rome, and the last titular heir Andreas even mortgaged the imperial claim to France and Spain in desperation; meanwhile, the princes of Rus' stood as the strongest surviving Orthodox realm in the north.#!\n\nNow the treasury at [ROOT.GetCountry.GetCapital.GetName] is stretched thin, unable to rebuild fleet and artillery from remnant lands alone. Envoys lay three expedients before the council: pledge port rights to Venice and Rome, appeal to Moscow for Orthodox alms, or melt the palace plate."
 oe_l7.51.a: "Pledge Port Rights to Rome and Venice for Ships and Coin"
 oe_l7.51.a.tt: "Gains #G +3#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_latin_debt')] for #Y 15#! years\nThe Papal States: opinion of the empire #G +20#! for #Y 10#! years\nVenice: opinion of the empire #G +20#! for #Y 10#! years\nHeavy trade-off: Latin pledges cut legitimacy, clergy satisfaction, and trade income, and invite future reckoning"
 oe_l7.51.b: "Appeal to Moscow and the Orthodox Princes for Alms"
 oe_l7.51.b.tt: "[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_orthodox_alms')] for #Y 15#! years\nImproves opinion with Muscovy or Russia (where extant)\nTrade-off: lowers prestige and western diplomatic reputation"
 oe_l7.51.c: "Refuse Foreign Debts and Melt the Palace Plate"
 oe_l7.51.c.tt: "Gains #G +2#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_proud_austerity')] for #Y 12#! years\nTrade-off: strains legitimacy, noble satisfaction, and tax efficiency"
 oe_l7.52.t: "Rallying the Peloponnese and the Greek Diaspora"
 oe_l7.52.desc: "#F In history, after the fall, Peloponnesian light horsemen (Stratioti) and Aegean Greek sailors dispersed across Venice, Crete, and southern Italy, becoming coveted light cavalry and mariners, while Pontic and Crimean Greek garrisons held stubborn mountain redoubts.#!\n\nNow exiled Greek horsemen, sailors, and artisans scattered from the Aegean islands and the [Concept('oe_tu_march','marches')|e] of Thessaloniki to Black Sea ports hear that the purple still endures at [ROOT.GetCountry.GetCapital.GetName]. How shall the court rally this diaspora?"
 oe_l7.52.a: "Muster the Greek Stratioti and Exile Sailors"
 oe_l7.52.a.tt: "Costs #R 3#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_stratioti_host')] for #Y 15#! years\nTrade-off: higher army maintenance and burgher strain"
 oe_l7.52.b: "Recall Refugee Gunfounders for a Siege Arsenal"
 oe_l7.52.b.tt: "Costs #R 2#! months of trade and tax income\nCosts #R 2#! months of manpower\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_refugee_arsenal')] for #Y 15#! years\nTrade-off: draws manpower and reduces tax efficiency"
 oe_l7.52.c: "Fortify the Mountain Holds and Settle the Exiles"
 oe_l7.52.c.tt: "[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_mountain_holds')] for #Y 15#! years\nTrade-off: heavier fort upkeep and short-term stability strain"
 oe_l7.53.t: "Reckoning of the Exile Pledges"
 oe_l7.53.desc: "#F In history, as years passed without reconquest, the exiled Palaiologoi sank deep into debt until even the imperial title itself was pledged and bartered away to Western kings.#!\n\nNow years have passed since the fall and the Bosporus remains unrecovered. Venetian syndicates, Latin creditors, and restless magnates press the court at [ROOT.GetCountry.GetCapital.GetName] to settle the overdue pledges of exile."
 oe_l7.53.a: "Pay Down the Exile Debts to Keep the Banner Flying"
 oe_l7.53.a.tt: "Costs #R 4#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_iron_resolve')] for #Y 10#! years\nTrade-off: steep debt payment and lower tax efficiency"
 oe_l7.53.b: "Repudiate the Latin Pledges and Defy the Creditors"
 oe_l7.53.b.tt: "[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_defiant_remnant')] for #Y 12#! years\nVenice: opinion of the empire #R −30#! for #Y 10#! years\nThe Papal States: opinion of the empire #R −30#! for #Y 10#! years\nTrade-off: angers Venice and Rome and lowers diplomatic reputation"
 oe_l7.53.c: "Lease Port Customs to Latin Creditors for Breathing Room"
 oe_l7.53.c.tt: "[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_mortgaged_ports')] for #Y 15#! years\nTrade-off: severely cuts trade income for fifteen years"
 oe_l7.54.t: "The Counter-Crusade for the Queen of Cities"
 oe_l7.54.desc: "#F In history, Western leagues repeatedly proclaimed counter-crusades after 1453 only to dissolve in rival ambitions; only the Greek exiles kept faith with the walls on the Bosporus.#!\n\nNow the exile forces assembled at [ROOT.GetCountry.GetCapital.GetName] stand ready as scouts report the state of the strait's defenses. Commanders petition the throne to sound the counter-crusade: proclaim total mobilization for the Bosporus, or secure the maritime flanks first?"
 oe_l7.54.a: "Proclaim Total Mobilization for the Bosporus"
 oe_l7.54.a.tt: "Costs #R 3#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_counter_crusade')] for #Y 10#! years\nHeavy trade-off: severe stability shock and high army upkeep; no forced war is declared"
 oe_l7.54.b: "Secure the Aegean and Black Sea Flanks First"
 oe_l7.54.b.tt: "Costs #R 2#! months of trade and tax income\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_maritime_thrust')] for #Y 10#! years\nTrade-off: cautious flanking lowers monthly prestige slightly"
 oe_l7.55.t: "Phoenix Reborn from Exile"
 oe_l7.55.desc: "#F Legend held that on the day the City fell in 1453, the Marble Emperor did not perish, but slept beneath the Golden Gate awaiting the hour when the double-headed eagle would return to the Bosporus.#!\n\nNow the banners of [ROOT.GetCountry.GetName] [Concept('oe_tu_march','march')|e] through the Theodosian Walls and the double-headed eagle flies once more above Hagia Sophia! Through exile, debt, and bitter struggle, the purple phoenix rises from the ashes. Shall the throne restore its seat to the Queen of Cities at once, or rebuild gradually from [ROOT.GetCountry.GetCapital.GetName]?"
 oe_l7.55.a: "Re-enter Hagia Sophia and Restore the Imperial Seat"
 oe_l7.55.a.tt: "Clears all exile debt and austerity modifiers; moves the capital back to Constantinople when controlled and unbesieged\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_phoenix_reborn')] for #Y 30#! years\nTrade-off: monumental reconstruction slightly strains stability cost"
 oe_l7.55.b: "Rebuild the Ruined Capital Gradually from Our Exile Base"
 oe_l7.55.b.tt: "Clears all exile debt and austerity modifiers while keeping the current capital\n[ROOT.GetCountry.GetName] gains [ShowModifier('oe_l7_ex_phoenix_rebuilt')] for #Y 30#! years\nTrade-off: garrisoning two capitals slightly increases army upkeep"
 oe_l7.90.t: "The Last Siege: the choice takes effect"
