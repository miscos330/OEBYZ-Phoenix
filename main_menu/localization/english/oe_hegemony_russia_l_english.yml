l_english:
 OE_RW_RUSSIA: "Russia"
 OE_RW_RUSSIA_DESC: "Beyond the Black Sea ports, great rivers lead into the steppe and forests of the Rus world. Trade, grain and a shared faith will anchor Rome's northern policy."
 OE_RW_RUSSIA_OPEN: "Click the map to open Russian campaign actions"
 OE_RW_RUSSIA_ACTIONS: "Russian Campaign"
 OE_RW_RUSSIA_HINT: "Click the map to view actions; close it to return to the map."
 OE_RW_KAFFA: "Theodosia"
 OE_RW_KAFFA_OWNER: "Owner of Theodosia"
 OE_HEG_RUSSIA_ACTIONS_HINT: "Begin with Black Sea Strategy. All subsequent actions require Byzantium and its subjects at every level to own every conquerable location in Crimea."
 OE_HEG_BLACK_SEA_PLAN_REQUIRED: "Black Sea Strategy has been completed"
 OE_HEG_CRIMEA_REQUIRED: "Byzantium and its subjects at every level own all conquerable locations in Crimea; occupation alone does not count"
 OE_HEG_BOSPORUS_LAND_REQUIRED: "Byzantium directly owns at least one eligible location in the Steppes to grant to the Bosporan Kingdom"
 oe_heg_plan_black_sea: "Black Sea Strategy"
 oe_heg_plan_black_sea_desc: "Spend 1,000 Gold to bring Crimea into the Roman World and prepare further campaigns into the Rus lands."
 oe_heg_plan_black_sea_effect: "Spend #R 1,000#! Gold and add Crimea to the Roman World."
 oe_heg_black_sea_plan_done: "Completed: Black Sea Strategy"
 oe_heg_invade_russia: "Expedition into the Rus World"
 oe_heg_invade_russia_desc: "Spend 200 Gold, 20 Political Influence and 5 Stability to gain a capital-seizure casus belli against a foreign country whose capital lies in the Steppes, Ruthenia or Russia."
 oe_heg_invade_russia_effect: "Spend #R 200#! Gold, #R 20#! Political Influence and #R 5#! Stability to gain the Imperial Expedition casus belli against the chosen country for 15 years. Its war goal is taking the enemy capital."
 oe_heg_restore_bosporus: "Restore the Bosporan Kingdom"
 oe_heg_restore_bosporus_desc: "Spend 1,000 Gold and 50 Political Influence to restore the Bosporan Kingdom from direct Byzantine holdings in the Steppes. Retain Taman, Tana, Chersonesos, Lusta, Soldaia, Theodosia, Vosporo and the entire Tuapse province."
 oe_heg_restore_bosporus_effect: "Spend #R 1,000#! Gold and #R 50#! Political Influence. Grant eligible direct Byzantine land to an Orthodox, Gothic Bosporan Kingdom of the Black Sea Kingdom subject type. Begin Gothic Romanization and permanently grant the Black Sea Free Port modifier to Theodosia, Tana and Chersonesos."
 oe_heg_bosporus_restored: "Completed: Bosporan Restoration"
 OE_BOSPORUS_KINGDOM: "Bosporus"
 OE_BOSPORUS_KINGDOM_ADJ: "Bosporan"
 oe_black_sea_kingdom: "Black Sea Kingdom"
 oe_black_sea_kingdom_desc: "An autonomous kingdom sustained by the Black Sea trade and fertile steppe, supplying Rome with grain, livestock and horses while guarding the northern sea routes."
 oe_black_sea_free_port: "Black Sea Free Port"
 oe_black_sea_free_port_desc: "Imperial charters protect commerce and expand markets and warehouses, bringing grain, horses and distant goods into the Black Sea ports."
 oe_gothic_identity_movement: "Gothic Identity Movement"
 oe_gothic_identity_movement_desc: "Ancient Crimean churches and growing ports reunite the mountains, steppe and coast. Through schools, imperial law and service, Crimean communities join the Roman world under a Gothic identity. Spreads only in Byzantine or subject-owned locations with Crimean population.\n\n$OE_IDENTITY_FIXED_30Y_DESC$"

 STATIC_MODIFIER_NAME_oe_black_sea_free_port: "$oe_black_sea_free_port$"
 STATIC_MODIFIER_DESC_oe_black_sea_free_port: "$oe_black_sea_free_port_desc$"
