 oe_sit_three_feudatories: "Revolt of the Three Feudatories"
 oe_sit_three_feudatories_desc: "Commanding vast hereditary fiefs across Yunnan, Fujian, and Guangdong that drain half the imperial treasury, Wu Sangui, Geng Jingzhong, and Shang Zhixin rise in rebellion against Kangxi's revocation decree—testing the survival and centralization of the Qing Empire."
 oe_sit_three_feudatories_imperial: "Imperial Centralization Triumph"
 oe_sit_three_feudatories_imperial_desc: "Imperial Banner and Green Standard armies crush the rebellion and abolish the southern feudatories forever, inaugurating an era of centralized provincial rule."
 oe_sit_three_feudatories_autonomy: "Southern Feudatories Entrenched"
 oe_sit_three_feudatories_autonomy_desc: "Stalled imperial offensives leave the southern military satrapies entrenched across Yunnan, Fujian, and Guangdong, eroding crown authority and revenue."
 oe_sit_three_feudatories_compromise: "Negotiated Southern Pacification"
 oe_sit_three_feudatories_compromise_desc: "Balancing military pressure with generous amnesty, the court absorbs the southern provinces gradually while sparing the realm endless civil war."
