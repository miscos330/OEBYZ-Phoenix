 oe_qg2_dec_establish_grand_council.title: "Establish the Grand Council (Junjichu)"
 oe_qg2_dec_establish_grand_council.desc: "Institutionalize the Grand Council (Junjichu) beside the throne to direct imperial ministries and distant frontier governors with unmatched speed and secrecy."
 oe_qg2_dec_establish_grand_council.a: "Charter the Imperial Grand Council"
 oe_qg2_dec_establish_grand_council_tt: "Raises imperial centralization by +25, grants +5 stability, and applies the Imperial Grand Council modifier for 40 years."
 oe_qg2_dec_dzungar_expedition.title: "Launch Western Dzungar Expedition"
 oe_qg2_dec_dzungar_expedition.desc: "Build supply relay stations from Gansu through Hami and mobilize artillery-backed Banner columns to campaign across Dzungaria and Altishahr."
 oe_qg2_dec_dzungar_expedition.a: "Launch the Western Regions Campaign"
 oe_qg2_dec_dzungar_expedition_tt: "Raises frontier dominion by +20, grants +10 army tradition, and applies the Western Regions Banner & Logistics Corps modifier for 20 years."
 oe_qg2_dec_charter_canton_factories.title: "Charter the Canton Thirteen Factories"
 oe_qg2_dec_charter_canton_factories.desc: "Formally charter Canton's Thirteen Factories under imperial customs oversight to regulate foreign silver inflows for tea, silk, and porcelain exports."
 oe_qg2_dec_charter_canton_factories.a: "Charter the Thirteen Factories"
 oe_qg2_dec_charter_canton_factories_tt: "Raises maritime frontier dominion by +15, collects immediate customs silver, and grants the Canton Thirteen Factories Charter modifier for 40 years."
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_unification: "Nurhaci's Jurchen Unification"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_unification: "Unifying Jianzhou and Haixi clans around Hetu Ala ends centuries of Jurchen fragmentation, lifting tribal cohesion and heavy cavalry."
 STATIC_MODIFIER_NAME_oe_qg2_mod_seven_grievances: "Oath of the Seven Grievances"
 STATIC_MODIFIER_DESC_oe_qg2_mod_seven_grievances: "Proclaiming the Seven Grievances before Heaven steels Banner resolve, elevating land morale, siegecraft, and army tradition."
 STATIC_MODIFIER_NAME_oe_qg2_mod_mukden_palace: "Mukden Imperial Capital"
 STATIC_MODIFIER_DESC_oe_qg2_mod_mukden_palace: "Moving the throne to Mukden (Shenyang) anchors the Liaodong plain with stronger central control, legitimacy, and revenue."
 STATIC_MODIFIER_NAME_oe_qg2_mod_six_ministries_banners: "Hong Taiji's Six Ministries & Twenty-Four Banners"
 STATIC_MODIFIER_DESC_oe_qg2_mod_six_ministries_banners: "Establishing the Six Ministries alongside Manchu, Mongol, and Han Eight Banners transforms the realm into a disciplined empire."
 STATIC_MODIFIER_NAME_oe_qg2_mod_manchu_proclamation: "Imperial Proclamation of the Manchu Name"
 STATIC_MODIFIER_DESC_oe_qg2_mod_manchu_proclamation: "Ascending the imperial altar at Mukden and adopting the unified Manchu ethnonym lifts prestige, legitimacy, and cultural capacity."
 STATIC_MODIFIER_NAME_oe_qg2_mod_dorgon_pass_entry: "Dorgon's Pacification of North China"
 STATIC_MODIFIER_DESC_oe_qg2_mod_dorgon_pass_entry: "Entering Shanhaiguan with disciplined columns and mourning the late emperor accelerates northern conquest and integration."
 STATIC_MODIFIER_NAME_oe_qg2_mod_queue_enforcement: "Iron Queue Edict Enforcement"
 STATIC_MODIFIER_DESC_oe_qg2_mod_queue_enforcement: "Strict enforcement of the shaved-forehead queue enforces absolute compliance while igniting fierce southern separatism and unrest."
 STATIC_MODIFIER_NAME_oe_qg2_mod_southern_conciliation: "Jiangnan Tax Remission & Civil Conciliation"
 STATIC_MODIFIER_DESC_oe_qg2_mod_southern_conciliation: "Abolishing late-Ming surtaxes and reopening civil examinations calms Jiangnan gentry and revives postwar prosperity."
 STATIC_MODIFIER_NAME_oe_qg2_mod_halt_enclosure: "Halt of Banner Land Enclosures"
 STATIC_MODIFIER_DESC_oe_qg2_mod_halt_enclosure: "Halting forcible Banner land enclosures around the northern plain restores peasant livelihoods, grain harvests, and tax yields."
 STATIC_MODIFIER_NAME_oe_qg2_mod_oboi_regency: "Four Regents & Aristocratic Banners"
 STATIC_MODIFIER_DESC_oe_qg2_mod_oboi_regency: "Oboi and the conservative regents reassert aristocratic Banner privileges and mounted archery, constraining cabinet governance."
 STATIC_MODIFIER_NAME_oe_qg2_mod_kangxi_personal_rule: "Kangxi's Personal Rule & Oboi Ouster"
 STATIC_MODIFIER_DESC_oe_qg2_mod_kangxi_personal_rule: "Arresting Oboi without bloodshed, young Kangxi reclaims sovereign command, elevating crown power, cabinet efficiency, and legitimacy."
 STATIC_MODIFIER_NAME_oe_qg2_mod_three_feudatories_war: "Three Feudatories Southern Crisis"
 STATIC_MODIFIER_DESC_oe_qg2_mod_three_feudatories_war: "Simultaneous rebellions across Yunnan, Fujian, and Guangdong strain imperial military upkeep and fuel regional unrest."
 STATIC_MODIFIER_NAME_oe_qg2_mod_green_standard_marshals: "Green Standard Marshals & Imperial Offensive"
 STATIC_MODIFIER_DESC_oe_qg2_mod_green_standard_marshals: "Empowering capable Green Standard generals alongside imperial Banners revitalizes manpower, siegecraft, and southern momentum."
 STATIC_MODIFIER_NAME_oe_qg2_mod_feudatories_crushed: "Three Feudatories Abolished"
 STATIC_MODIFIER_DESC_oe_qg2_mod_feudatories_crushed: "Crushing the Three Feudatories permanently ends southern warlordism, lifting crown control, tax yields, and imperial cohesion."
 STATIC_MODIFIER_NAME_oe_qg2_mod_feudatories_autonomy: "Entrenched Southern Feudatories"
 STATIC_MODIFIER_DESC_oe_qg2_mod_feudatories_autonomy: "Failure to subdue the southern feudatories entrenches semi-independent military satrapies, weakening crown revenue and authority."
 STATIC_MODIFIER_NAME_oe_qg2_mod_feudatories_compromise: "Negotiated Southern Pacification"
 STATIC_MODIFIER_DESC_oe_qg2_mod_feudatories_compromise: "Gradual amnesty and phased provincial integration avert protracted devastation across southern China while restoring order."
 STATIC_MODIFIER_NAME_oe_qg2_mod_shilang_penghu: "Admiral Shi Lang's Penghu Armada"
 STATIC_MODIFIER_DESC_oe_qg2_mod_shilang_penghu: "Admiral Shi Lang's Fujian armada rides the southern monsoon to shatter rival squadrons at Penghu, securing command of the strait."
 STATIC_MODIFIER_NAME_oe_qg2_mod_taiwan_prefecture_open: "Taiwan Prefecture & Four Maritime Customs"
 STATIC_MODIFIER_DESC_oe_qg2_mod_taiwan_prefecture_open: "Erecting Taiwan Prefecture under Fujian and opening four maritime customs houses sparks a vibrant coastal trade revival."
 STATIC_MODIFIER_NAME_oe_qg2_mod_dzungar_ulan_butung: "Ulan Butung & Jao Modo Steppe Victory"
 STATIC_MODIFIER_DESC_oe_qg2_mod_dzungar_ulan_butung: "Imperial artillery shatters Galdan's camel barricade at Ulan Butung and destroys his army at Jao Modo, securing Outer Mongolia."
 STATIC_MODIFIER_NAME_oe_qg2_mod_nine_princes_intrigue: "Nine Princes Succession Intrigue"
 STATIC_MODIFIER_DESC_oe_qg2_mod_nine_princes_intrigue: "Bitter rivalry among imperial princes divides court ministries and Banner nobles into competing factions, straining stability."
 STATIC_MODIFIER_NAME_oe_qg2_mod_secret_memorials_huohao: "Secret Palace Memorials & Huohao Guigong"
 STATIC_MODIFIER_DESC_oe_qg2_mod_secret_memorials_huohao: "Confidential palace memorials expose provincial collusion while formalizing silver-melting surcharges funds honest salaries and triples reserves."
 STATIC_MODIFIER_NAME_oe_qg2_mod_grand_council_cabinet: "Imperial Grand Council (Junjichu)"
 STATIC_MODIFIER_DESC_oe_qg2_mod_grand_council_cabinet: "Operating with speed and secrecy, the Grand Council bypasses slow bureaucracy and slashes administrative distance penalties across Eurasia."
 STATIC_MODIFIER_NAME_oe_qg2_mod_lhasa_ambans: "Imperial Ambans of Tibet"
 STATIC_MODIFIER_DESC_oe_qg2_mod_lhasa_ambans: "Installing resident Imperial Ambans in Lhasa cements Tibetan stability, subject loyalty, and multi-ethnic Inner Asian stewardship."
 STATIC_MODIFIER_NAME_oe_qg2_mod_ili_xinjiang_pacified: "General of Ili & Pacification of Xinjiang"
 STATIC_MODIFIER_DESC_oe_qg2_mod_ili_xinjiang_pacified: "Establishing the General of Ili across Dzungaria and Altishahr secures Xinjiang, slashes frontier distance drag, and revives overland trade."
 STATIC_MODIFIER_NAME_oe_qg2_mod_ten_great_campaigns: "Qianlong's Ten Great Campaigns"
 STATIC_MODIFIER_DESC_oe_qg2_mod_ten_great_campaigns: "Victorious expeditions across Inner Asia and the Himalayan borderlands raise Qing prestige to its zenith at heavy maintenance cost."
 STATIC_MODIFIER_NAME_oe_qg2_mod_siku_quanshu_library: "Siku Quanshu Imperial Library"
 STATIC_MODIFIER_DESC_oe_qg2_mod_siku_quanshu_library: "Compiling 36,000 volumes of the Complete Library of the Four Treasuries across seven pavilions elevates literacy, culture, and scholarship."
 STATIC_MODIFIER_NAME_oe_qg2_mod_literary_censorate: "Imperial Literary Inquisition"
 STATIC_MODIFIER_DESC_oe_qg2_mod_literary_censorate: "Sweeping ideological censorship reinforces domestic conformity and crown power while dampening scientific inquiry and innovation."
 STATIC_MODIFIER_NAME_oe_qg2_mod_canton_factories_charter: "Canton Thirteen Factories Charter"
 STATIC_MODIFIER_DESC_oe_qg2_mod_canton_factories_charter: "Chartering Canton's Thirteen Factories channels foreign silver for tea, silk, and porcelain into booming customs and merchant wealth."
 STATIC_MODIFIER_NAME_oe_qg2_mod_macartney_scientific_exchange: "Western Envoy Scientific & Maritime Reform"
 STATIC_MODIFIER_DESC_oe_qg2_mod_macartney_scientific_exchange: "Engaging seriously with the Macartney Embassy's astronomical instruments and naval ordnance accelerates institutional growth, research, and modern warships."
 STATIC_MODIFIER_NAME_oe_qg2_mod_celestial_self_sufficiency: "Celestial Self-Sufficiency Protocol"
 STATIC_MODIFIER_DESC_oe_qg2_mod_celestial_self_sufficiency: "Reaffirming classical tributary protocol upholds celestial prestige and domestic calm while slowing exposure to industrial transformation."
 STATIC_MODIFIER_NAME_oe_qg2_mod_white_lotus_tuanlian: "White Lotus Suppression & Tuanlian Reform"
 STATIC_MODIFIER_DESC_oe_qg2_mod_white_lotus_tuanlian: "Purging grand corruption and organizing fortified county militias across Sichuan and Hubei gradually extinguishes the White Lotus rising."
 STATIC_MODIFIER_NAME_oe_qg2_mod_western_expedition_corps: "Western Regions Banner & Logistics Corps"
 STATIC_MODIFIER_DESC_oe_qg2_mod_western_expedition_corps: "Relay depots stretching from Gansu through Hami empower western expeditionary armies with rapid marches and heavy siege batteries."
 STATIC_MODIFIER_NAME_oe_qg2_mod_tf_expedition: "Banner & Green Standard Southern Offensive"
 STATIC_MODIFIER_DESC_oe_qg2_mod_tf_expedition: "Coordinated metropolitan Banners and Green Standard columns press south with heightened siegecraft and battlefield morale."
 STATIC_MODIFIER_NAME_oe_qg2_mod_tf_conciliation: "Kangxi Southern Amnesty Proclamation"
 STATIC_MODIFIER_DESC_oe_qg2_mod_tf_conciliation: "Offering royal pardon and retained rank to defecting southern officers fractures the rebel coalition and calms separatism."
 STATIC_MODIFIER_NAME_oe_qg2_mod_tf_yangtze_logistics: "Yangtze Grain & River Crossing Security"
 STATIC_MODIFIER_DESC_oe_qg2_mod_tf_yangtze_logistics: "Holding the central Yangtze crossings safeguards imperial grain barges and fortifies the riverine supply line."
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_aba_hunt: "Confederated Aba Great Hunt"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_aba_hunt: "Joint Jurchen confederation winter hunts sharpen mounted-archery coordination, tribal cohesion, and military tradition."
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_sable_exchange: "Jurchen Sable & Ginseng Exchange"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_sable_exchange: "Coordinating sable pelts, wild ginseng, and horse-market bargaining across confederated clans expands overland trade profits."
 STATIC_MODIFIER_NAME_oe_qg2_mod_jurchen_banner_oath: "Jurchen Eight-Clan Banner Oath"
 STATIC_MODIFIER_DESC_oe_qg2_mod_jurchen_banner_oath: "Confederated Jurchen clans swear a binding military oath, boosting morale, levy recovery, and manpower mobilization."
 oe_qg2.1.title: "Nurhaci Unifies the Jianzhou and Haixi Confederacies"
 oe_qg2.1.desc: "Emerging victorious from the clash of nine rival tribes at Mount Gure, Nurhaci blends swift cavalry raids with strategic marriages to unify the Jianzhou and Haixi walled towns, forging a formidable Jurchen confederation."
 oe_qg2.1.a: "Consolidate the Jurchen Clans Under Hetu Ala"
 oe_qg2.1.b: "Bind Distant Clans Through Confederated Trade Pacts"
 oe_qg2.2.title: "The Seven Grievances and Founding of the Later Jin"
 oe_qg2.2.desc: "Burning the manifesto of the Seven Grievances before Heaven outside Hetu Ala, the Khan proclaims the Later Jin dynasty and turns the united Eight Banners toward Fushun and the walled cities of Liaodong."
 oe_qg2.2.a: "Proclaim the Seven Grievances and Strike Liaodong"
 oe_qg2.2.b: "Secure Frontier Logistics Before Launching the Offensive"
 oe_qg2.3.title: "Transfer to Mukden (Shenyang) and the Imperial Palace"
 oe_qg2.3.desc: "Leaving crowded Liaoyang behind, the court transfers to strategic Shenyang (Mukden), raising the Octagonal Hall and Ten Princes Pavilions at the crossroads linking Liaoxi, Inner Mongolia, and the Korean border."
 oe_qg2.3.a: "Establish the Imperial Seat at Mukden"
 oe_qg2.3.b: "Keep Palace Works Modest and Fund Siege Foundries"
 oe_qg2.4.title: "Hong Taiji's Six Ministries and Mongol-Han Eight Banners"
 oe_qg2.4.desc: "Recognizing that tribal councils cannot rule a continental empire, Hong Taiji establishes the Six Ministries and Three Inner Academies while expanding the Eight Banners into full Manchu, Mongol, and Han divisions."
 oe_qg2.4.a: "Establish the Six Ministries and Twenty-Four Banners"
 oe_qg2.4.b: "Preserve Princely Banner Councils Alongside New Offices"
 oe_qg2.5.title: "Imperial Proclamation at Mukden and the Manchu Name"
 oe_qg2.5.desc: "Acclaimed jointly by Manchu, Mongol, and Han dignitaries at Mukden's suburban altar, Hong Taiji ascends the imperial throne and replaces old Jurchen tribal labels with the unified Manchu identity, staking a universal imperial claim."
 oe_qg2.5.a: "Proclaim Imperial Sovereignty and the Unified Manchu Name"
 oe_qg2.5.b: "Anchor the New Throne on Manchu-Mongol Martial Supremacy"
 oe_qg2.6.title: "Dorgon Enters Shanhaiguan and Pacifies North China"
 oe_qg2.6.desc: "Sweeping through Shanhaiguan into Beijing, Prince Regent Dorgon orders strict garrison discipline, conducts state obsequies for the fallen Ming sovereign, and abolishes wartime surtaxes—rapidly winning northern prefectures."
 oe_qg2.6.a: "Enforce Strict Discipline and Abolish Wartime Surtaxes"
 oe_qg2.6.b: "Press the Advance Swiftly Toward Xi'an and the Yangtze"
 oe_qg2.7.title: "The Queue Edict and Southern Conciliation Dilemma"
 oe_qg2.7.desc: "Following the crossing of the Yangtze, the regency faces a stark choice: harsh enforcement of the Manchu queue edict provokes fierce urban resistance across Jiangnan, whereas leniency, tax remission, and civil exams promise swift reconciliation."
 oe_qg2.7.a: "Pursue Southern Conciliation Through Examinations and Tax Relief"
 oe_qg2.7.b: "Enforce the Queue Edict Across All Provinces by Iron Decree"
 oe_qg2.8.title: "Shunzhi's Personal Rule and Abolition of Land Enclosures"
 oe_qg2.8.desc: "Early Banner land enclosures around Zhili displaced thousands of peasant families and hollowed out northern harvests. Assuming personal rule, the Emperor weighs an edict permanently halting enclosures and restoring rural land titles."
 oe_qg2.8.a: "Permanently Halt Banner Land Enclosures and Restore Farms"
 oe_qg2.8.b: "Compensate Displaced Farmers While Retaining Banner Estates"
 oe_qg2.9.title: "The Four Regents and Oboi's Conservative Ascendancy"
 oe_qg2.9.desc: "During the boyhood of the Kangxi Emperor, four aristocratic regents assume stewardship of the realm. Soon the formidable veteran general Oboi eclipses his colleagues, reviving conservative Banner privileges and intimidating rival ministers."
 oe_qg2.9.a: "Bide Time While Maintaining Aristocratic Banner Order"
 oe_qg2.9.b: "Quietly Cultivate Loyal Guards and Ministers for Royal Rule"
 oe_qg2.10.title: "Young Kangxi's Coup: The Ouster of Oboi"
 oe_qg2.10.desc: "Training loyal wrestling youths inside the palace halls, the sixteen-year-old Kangxi Emperor catches Oboi off guard during a private audience—arresting the overmighty regent without bloodshed and inaugurating an era of vigorous personal rule."
 oe_qg2.10.a: "Arrest Oboi Cleanly and Inaugurate Personal Imperial Rule"
 oe_qg2.10.b: "Launch a Broad Purge of Oboi's Faction Across the Banners"
 oe_qg2.11.title: "Revolt of the Three Feudatories: Wu Sangui Raises the Banner"
 oe_qg2.11.desc: "Commanding vast hereditary fiefs that devour half the empire's silver, Wu Sangui in Kunming, Geng Jingzhong in Fuzhou, and Shang Zhixin in Canton defy Kangxi's revocation decree. Yunnan erupts into open revolt as Fujian and Guangdong join the rebellion."
 oe_qg2.11.a: "Stand Firm on Revocation and Mobilize Imperial Armies"
 oe_qg2.11.b: "Hold the Yangtze Line While Secretly Splitting Fujian and Canton"
 oe_qg2.12.title: "Turning the Tide: Green Standard Marshals and Southern Amnesty"
 oe_qg2.12.desc: "When aristocratic Banner commanders stall along the Yangtze, Kangxi promotes battle-proven Han Green Standard generals to front-line command while issuing generous amnesties that bring Fujian and Guangdong back to imperial obedience."
 oe_qg2.12.a: "Elevate Green Standard Marshals to Spearhead the Offensive"
 oe_qg2.12.b: "Expand the Southern Amnesty to Absorb Defecting Garrisons"
 oe_qg2.13.title: "Fall of Kunming and Abolition of the Three Feudatories"
 oe_qg2.13.desc: "After eight grueling years of warfare, imperial columns storm Kunming and extinguish the last holdouts of the Three Feudatories. Provincial governors replace hereditary warlords across Yunnan, Fujian, and Guangdong, sealing imperial unity."
 oe_qg2.13.a: "Abolish the Feudatories Forever and Centralize the South"
 oe_qg2.13.b: "Pardon Southern Provinces and Grant Five-Year Tax Relief"
 oe_qg2.14.title: "Admiral Shi Lang and the 1683 Battle of Penghu"
 oe_qg2.14.desc: "With the mainland secure, Kangxi overrides cautious courtiers to unleash Fujian Naval Commander Shi Lang. Sailing over three hundred warships on the summer monsoon, Shi Lang smashes the Tungning fleet across seven fierce days at Penghu."
 oe_qg2.14.a: "Unleash Admiral Shi Lang to Win the Battle of Penghu"
 oe_qg2.14.b: "Offer Noble Titles to Secure a Peaceful Maritime Surrender"
 oe_qg2.15.title: "Taiwan Prefecture and the Kangxi Maritime Opening"
 oe_qg2.15.desc: "Some ministers urge abandoning Taiwan as a costly outpost, yet Shi Lang's famous memorial proves the island is the indispensable shield of four coastal provinces. Convinced, the throne erects Taiwan Prefecture and lifts coastal bans across four customs houses."
 oe_qg2.15.a: "Establish Taiwan Prefecture and Open Four Maritime Customs"
 oe_qg2.15.b: "Fortify Taiwan Naval Garrisons Under Tight Coastal Patrols"
 oe_qg2.16.title: "First Dzungar Campaigns: Ulan Butung and Jao Modo"
 oe_qg2.16.desc: "Dzungar Khan Galdan sweeps through Khalkha Mongolia and rides within striking distance of Beijing. Three times Kangxi leads armies across the Gobi: heavy cannon smash Galdan's camel walls at Ulan Butung, and an ambush at Jao Modo breaks him forever."
 oe_qg2.16.a: "Lead Imperial Columns Across the Gobi to Crush Galdan"
 oe_qg2.16.b: "Rally Khalkha Princes at Dolon Nor for Methodical Advance"
 oe_qg2.17.title: "The Nine Princes Succession Struggle"
 oe_qg2.17.desc: "Following the twice-deposed Crown Prince's disgrace, nine royal brothers form rival networks across the ministries and Eight Banners. Court intrigue paralyzes late-reign governance until the resolute Fourth Prince Yinzhen claims the succession."
 oe_qg2.17.a: "Back the Resolute Heir to Crush Princely Factionalism"
 oe_qg2.17.b: "Institute Secret Succession Decrees to Calm Royal Rivals"
 oe_qg2.18.title: "Yongzheng's Secret Palace Memorials and Huohao Guigong"
 oe_qg2.18.desc: "Confronting empty vaults and provincial collusion, the Yongzheng Emperor expands confidential palace memorials directly to the throne while converting informal silver-melting surcharges into official revenue that funds generous anti-corruption salaries."
 oe_qg2.18.a: "Enact Secret Palace Memorials and Huohao Guigong Nationwide"
 oe_qg2.18.b: "Audit Provincial Arrears Gradually with Grace Periods"
 oe_qg2.19.title: "Founding of the Grand Council (Junjichu)"
 oe_qg2.19.desc: "Born inside Longzong Gate to direct northwestern campaigns in strict secrecy, the Grand Council (Junjichu) places a lean cabinet of Manchu and Han councilors beside the throne, dispatching rapid couriers directly across the empire."
 oe_qg2.19.a: "Make the Grand Council the Permanent Executive Core"
 oe_qg2.19.b: "Limit the Grand Council to Military Affairs Alongside the Six Ministries"
 oe_qg2.20.title: "Pacification of Lhasa and the Imperial Ambans of Tibet"
 oe_qg2.20.desc: "When Dzungar raiders strike Lhasa, Qing armies march across the high Tibetan passes from Sichuan and Qinghai to expel them. Installing resident Imperial Ambans and formalizing Golden Urn stewardship anchors imperial sway over the roof of the world."
 oe_qg2.20.a: "Install Imperial Ambans in Lhasa to Secure Tibet"
 oe_qg2.20.b: "Honor Monastic Autonomy Through Lifan Yuan Diplomacy"
 oe_qg2.21.title: "Final Dzungar Campaigns and Pacification of Xinjiang"
 oe_qg2.21.desc: "Seizing the chaos of Amursana's revolt, imperial generals drive deep into the Ili valley and across the Tarim Basin to Kashgar and Turpan—ending a century of steppe rivalry and founding the General of Ili military governorship across Xinjiang."
 oe_qg2.21.a: "Establish the General of Ili and Integrate All Xinjiang"
 oe_qg2.21.b: "Garrison Urumqi and Hami While Delegating to Local Begs"
 oe_qg2.22.title: "Qianlong's Ten Great Campaigns: Zenith and Cost"
 oe_qg2.22.desc: "Across Dzungaria, Altishahr, the Jinchuan gorges, Taiwan, Burma, Dai Viet, and Nepal, Qianlong celebrates Ten Great Campaigns that carry imperial prestige to its peak—yet drain over a hundred million taels from the treasury."
 oe_qg2.22.a: "Celebrate the Ten Great Campaigns and Project Imperial Might"
 oe_qg2.22.b: "Halt Costly Expeditions to Replenish Granaries and Treasury"
 oe_qg2.23.title: "The Siku Quanshu Library and the Literary Inquisition"
 oe_qg2.23.desc: "Thousands of philologists under Ji Yun compile the 36,000-volume Complete Library of the Four Treasuries across seven imperial pavilions, yet aggressive censorship during the project threatens to stifle intellectual vitality."
 oe_qg2.23.a: "Patronize Open Scholarship and Preserve Rare Manuscripts"
 oe_qg2.23.b: "Enforce Strict Literary Censorship Alongside Compilation"
 oe_qg2.24.title: "The Canton Thirteen Factories and Global Tea-Silver Boom"
 oe_qg2.24.desc: "Along Guangzhou's Pearl River waterfront, European East India ships crowd Whampoa anchorage, pouring vast quantities of silver dollars into the licensed Thirteen Factories for Fujian tea, Jiangnan silk, and porcelain."
 oe_qg2.24.a: "Charter the Canton Thirteen Factories to Harvest Customs Silver"
 oe_qg2.24.b: "Lower Export Dues and Expand Coastal Port Commerce"
 oe_qg2.25.title: "The 1793 Macartney Embassy: Collision of Two Worlds"
 oe_qg2.25.desc: "British envoy George Macartney arrives at the Jehol summer palace bearing a planetarium, modern naval artillery models, and proposals for diplomatic and commercial opening. Standing at the crossroads of the industrial age, how will the imperial court answer?"
 oe_qg2.25.a: "Study Western Science, Ordnance, and Modern Naval Craft"
 oe_qg2.25.b: "Affirm Celestial Self-Sufficiency and Classical Protocol"
 oe_qg2.26.title: "The White Lotus Rebellion and Heshen's Reckoning"
 oe_qg2.26.desc: "Decades of unchecked corruption under grand favorite Heshen and oppressive taxes ignite the nine-year White Lotus Rebellion across the rugged Sichuan-Hubei-Shaanxi borderlands. Only purging Heshen and backing fortified local Tuanlian militias can stem the crisis."
 oe_qg2.26.a: "Purge Heshen and Organize Fortified Tuanlian Militias"
 oe_qg2.26.b: "Dispatch Metropolitan Banners to Crush the Uprising Directly"
