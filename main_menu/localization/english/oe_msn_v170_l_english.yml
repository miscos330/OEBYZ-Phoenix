 oe_msn_kon_10_brass_ivory_commerce:0 "Brass, Raffia & Pepper Prosperity"
 oe_msn_kon_10_brass_ivory_commerce_desc:0 "Promote high-value bronze artistry, woven textiles, copper, and spice exports to fill royal coffers cleanly."
 oe_msn_kon_10_brass_ivory_commerce_req_tt:0 "Hold at least 280 Gold."
 oe_msn_kon_11_equatorial_printing_courts:0 "Equatorial Academies & Printing Courts"
