 oe_msn_kil_11_monsoon_trade_network_desc:0 "Coordinate twin hubs at Kilwa and Mombasa to capture the monsoon exchange of gold, ivory, spice, and porcelain."
 oe_msn_kil_11_monsoon_trade_network_req_tt:0 "Own Kilwa Kisiwani and Mombasa with at least 15 Stability in the Age of Reformation or later."
 oe_msn_kil_12_lord_indian_ocean_rim:0 "Lord of the Indian Ocean Rim"
 oe_msn_kil_12_lord_indian_ocean_rim_desc:0 "Commanding Kilwa, Mombasa, Zanzibar, and Sofala beneath unbeatable monsoon fleets crowns the Swahili thalassocracy forever."
 oe_msn_kil_12_lord_indian_ocean_rim_req_tt:0 "Own Kilwa Kisiwani, Mombasa, Zanzibar, and Sofala with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_kon_destiny:0 "#bold #color_yellow Kongo & Benin: Sovereign Equatorial Renaissance#!#!"
