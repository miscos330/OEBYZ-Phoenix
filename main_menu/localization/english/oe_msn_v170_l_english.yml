 oe_msn_kil_05_zanzibar_pemba_straits:0 "Zanzibar & the Spice Channel"
 oe_msn_kil_05_zanzibar_pemba_straits_desc:0 "Control the island emporium of Zanzibar and mainland Bagamoyo to secure the central Swahili spice and ivory passage."
 oe_msn_kil_05_zanzibar_pemba_straits_req_tt:0 "Own Zanzibar and Bagamoyo."
 oe_msn_kil_06_mombasa_malindi_league:0 "Mombasa & Malindi Northern Union"
 oe_msn_kil_06_mombasa_malindi_league_desc:0 "Unite the formidable island citadel of Mombasa with the famed navigators of Malindi under one coastal crown."
 oe_msn_kil_06_mombasa_malindi_league_req_tt:0 "Own Mombasa and Malindi."
 oe_msn_kil_07_sofala_gold_ivory:0 "Sofala Gold & Mozambique Channel"
 oe_msn_kil_07_sofala_gold_ivory_desc:0 "Secure the storied southern gold port of Sofala together with Mozambique or Quelimane along the great southern channel."
 oe_msn_kil_07_sofala_gold_ivory_req_tt:0 "Own Sofala, own Mozambique or Quelimane, and control at least 28 Locations."
