 oe_msn_mal_12_west_african_gunpowder_empire_desc:0 "Uniting Niani, Timbuktu, and Gao beneath modern gunpowder arms, Sankore science, and limitless bullion fulfills Sundiata and Askia's grandest dream."
 oe_msn_mal_12_west_african_gunpowder_empire_req_tt:0 "Own Niani, Timbuktu, and Gao with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_kil_destiny:0 "#bold #color_yellow Kilwa & Swahili: Lord of the Monsoon Sea#!#!"
 oe_msn_kil_destiny_DESCRIPTION:0 "From Swahili Coral Cities and Sofala Gold to Armed Dhows Defying Foreign Armadas Across the Indian Ocean Rim"
 oe_msn_kil_destiny_CRITERIA_DESCRIPTION:0 "Unite the Swahili coral stone towns from Malindi and Mombasa to Zanzibar, Kilwa, and Sofala, launch cannon-armed dhows against foreign armadas, and reign supreme across the Indian Ocean rim."
 oe_msn_kil_destiny_BUTTON_TOOLTIP:0 "Embark on the Kilwa-Swahili Destiny"
 oe_msn_kil_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Kilwa and the Swahili Coast: build monsoon dhow shipyards and coral sea batteries to defy European armadas, unite Zanzibar, Mombasa, Malindi, Sofala, and the Zimbabwe gold corridor, and crown Husuni Kubwa as the radiant clearinghouse of the Indian Ocean."
 oe_msn_kil_01_swahili_coral_cities:0 "Swahili Coral Cities Anchored"
