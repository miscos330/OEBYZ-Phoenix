 oe_msn_iro_02_longhouse_confederacy_desc:0 "Bind the Keepers of the Eastern Door and the Firekeepers of Onondaga into a single unshakable federal union."
 oe_msn_iro_02_longhouse_confederacy_req_tt:0 "Form Haudenosaunee (IRO) or own both Tsikahiotsisto and Canajoharie."
 oe_msn_iro_03_flintlock_woodland_parity:0 "Fur Trade & Firearms Parity"
 oe_msn_iro_03_flintlock_woodland_parity_desc:0 "Leverage fur trade surpluses to equip Haudenosaunee Woodland Rangers with top-grade flintlocks and powder."
 oe_msn_iro_03_flintlock_woodland_parity_req_tt:0 "Hold at least 180 Gold in the Age of Discovery or later."
 oe_msn_iro_04_covenant_chain_sovereignty:0 "Covenant Chain Armed Sovereignty"
 oe_msn_iro_04_covenant_chain_sovereignty_desc:0 "Pair invincible forest infantry with adroit Covenant Chain diplomacy so every Atlantic power respects our borders."
 oe_msn_iro_04_covenant_chain_sovereignty_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_iro_05_five_nations_united:0 "Five Nations From Mohawk to Seneca"
 oe_msn_iro_05_five_nations_united_desc:0 "Gather all five ancestral council seats from the Mohawk River to the western hills of the Seneca beneath one banner."
 oe_msn_iro_05_five_nations_united_req_tt:0 "Form Haudenosaunee (IRO) or own all 5 ancestral council capitals."
 oe_msn_iro_06_mohawk_hudson_corridor:0 "Mohawk-Champlain & Ontario Gateways"
 oe_msn_iro_06_mohawk_hudson_corridor_desc:0 "Secure the strategic river-and-lake gates of Saratoga, Ticonderoga, or Oswego to command northern trade canoes."
 oe_msn_iro_06_mohawk_hudson_corridor_req_tt:0 "Own both Saratoga and Ticonderoga, or own Oswego."
 oe_msn_iro_07_niagara_huron_beaver_realm:0 "Niagara Falls & Northern Fur Lands"
 oe_msn_iro_07_niagara_huron_beaver_realm_desc:0 "Master the thunderous portage at Niagara alongside Tkaronto or Ossossane to dominate the Ontario-Huron fur trails."
 oe_msn_iro_07_niagara_huron_beaver_realm_req_tt:0 "Own Niagara, own Tkaronto or Ossossane, and control at least 30 Locations."
 oe_msn_iro_08_great_lakes_hegemony:0 "Great Lakes Hegemony"
 oe_msn_iro_08_great_lakes_hegemony_desc:0 "Project Haudenosaunee power from Niagara to the Detroit Straits, Mackinac, or Manhattan, locking North America's heartland."
 oe_msn_iro_08_great_lakes_hegemony_req_tt:0 "Own Niagara and either Detroit (Waawiiyaataanong), Mackinac, or Manhattan in the Age of Reformation or later."
 oe_msn_iro_09_wampum_council_archives:0 "Wampum Diplomatic Archives"
 oe_msn_iro_09_wampum_council_archives_desc:0 "Institutionalize sacred wampum treaty records at Onondaga, elevating Haudenosaunee statecraft across every council fire."
 oe_msn_iro_09_wampum_council_archives_req_tt:0 "Have at least 10 Stability in the Age of Renaissance or later."
 oe_msn_iro_10_fur_trade_treasury:0 "Longhouse Granaries & Fur Treasury"
 oe_msn_iro_10_fur_trade_treasury_desc:0 "Pair abundant Three-Sisters agriculture with disciplined fur trade customs to build a resilient federal treasury."
 oe_msn_iro_10_fur_trade_treasury_req_tt:0 "Hold at least 260 Gold."
 oe_msn_iro_11_federal_republic_turtle_island:0 "Constitutional Longhouse Republic"
 oe_msn_iro_11_federal_republic_turtle_island_desc:0 "Publish the Great Law of Peace alongside bilingual schools and federal courts, pioneering modern constitutional federalism."
 oe_msn_iro_11_federal_republic_turtle_island_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_iro_12_sovereign_confederacy_turtle_island:0 "Sovereign Confederacy of Turtle Island"
 oe_msn_iro_12_sovereign_confederacy_turtle_island_desc:0 "Holding Onondaga, Canajoharie, and Niagara in modern federal splendor crowns the unbroken sovereignty of Turtle Island."
 oe_msn_iro_12_sovereign_confederacy_turtle_island_req_tt:0 "Own Tsikahiotsisto, Canajoharie, and Niagara with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_may_destiny:0 "#bold #color_yellow Maya League: Second Mayan Golden Age#!#!"
 oe_msn_may_destiny_DESCRIPTION:0 "From the League of Mayapan Revival and Cenote Agronomy to Jungle Bastions, Caribbean Canoe Routes, and Mayan Renaissance"
 oe_msn_may_destiny_CRITERIA_DESCRIPTION:0 "Revive the League of Mayapan across Yucatan and Peten, master cenote agronomy and Venus astronomical science, fortify jungle citadels against conquistadors, and usher in the Second Mayan Golden Age."
 oe_msn_may_destiny_BUTTON_TOOLTIP:0 "Embark on the Maya League Destiny"
 oe_msn_may_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for the Maya League: unite Mayapan, Chichen Itza, Mani, Campeche, and Noh Peten, field Holkan noble infantry behind impregnable jungle stone citadels, command Caribbean jade and cacao canoe trade, and ignite the Second Mayan Golden Age of astronomy, medicine, and letters."
 oe_msn_may_01_league_of_mayapan_revival:0 "League of Mayapan Revival"
 oe_msn_may_01_league_of_mayapan_revival_desc:0 "Secure Mayapan, Mani, or Noh Peten under steady leadership to renew the ancient Multepal league of Maya cities."
 oe_msn_may_01_league_of_mayapan_revival_req_tt:0 "Own Mayapan, Mani, or Noh Peten with at least 5 Stability."
 oe_msn_may_02_holkan_noble_regiments:0 "Muster Holkan Noble Infantry"
 oe_msn_may_02_holkan_noble_regiments_desc:0 "Organize veteran Holkan soldiers outfitted in salt-hardened cotton armor for rapid jungle campaigns."
 oe_msn_may_02_holkan_noble_regiments_req_tt:0 "Hold at least 180 Gold and have at least 10 Stability."
 oe_msn_may_03_jungle_bastions_steel:0 "Jungle Bastions & Captured Steel"
 oe_msn_may_03_jungle_bastions_steel_desc:0 "Ring Yucatan hilltops and Peten lakes with stone bastions while forging modern steel tips and firearms for our defenders."
 oe_msn_may_03_jungle_bastions_steel_req_tt:0 "Have at least 12 Stability in the Age of Discovery or later."
 oe_msn_may_04_defy_conquistadors:0 "Jungle Bastions vs Conquistadors"
 oe_msn_may_04_defy_conquistadors_desc:0 "Hold Mayapan and Chichen Itza inviolate against every overseas expedition, proving the Mayan heartland unconquerable."
 oe_msn_may_04_defy_conquistadors_req_tt:0 "Own Mayapan and Chichen Itza with at least 15 Stability in the Age of Reformation or later."
 oe_msn_may_05_chichen_itza_mani_union:0 "Sacred Triangle: Mayapan, Chichen Itza & Mani"
 oe_msn_may_05_chichen_itza_mani_union_desc:0 "Reconcile the Cocom and Xiu heartlands alongside the sacred cenote pyramid of Chichen Itza under one united league."
 oe_msn_may_05_chichen_itza_mani_union_req_tt:0 "Own Mayapan, Chichen Itza, and Mani."
 oe_msn_may_06_puuk_champoton_coast:0 "Gulf Coast: Campeche & Champoton"
 oe_msn_may_06_puuk_champoton_coast_desc:0 "Secure the vital western ports of Kaan Peech and Chakan Putum to command Gulf salt trade and coastal defenses."
 oe_msn_may_06_puuk_champoton_coast_req_tt:0 "Own Kaan Peech and Chakan Putum."
 oe_msn_may_07_peten_tikal_lowlands:0 "Peten Basin: Noh Peten & Ancient Tikal"
 oe_msn_may_07_peten_tikal_lowlands_desc:0 "Reclaim the island fortress of Noh Peten and the towering temples of Yax Mutal (Tikal), uniting northern and southern Maya."
 oe_msn_may_07_peten_tikal_lowlands_req_tt:0 "Own Noh Peten and Yax Mutal (Tikal) and control at least 24 Locations."
 oe_msn_may_08_caribbean_jade_cacao_routes:0 "Caribbean Jade & Cacao Canoe Routes"
 oe_msn_may_08_caribbean_jade_cacao_routes_desc:0 "Control Ekab alongside Chetumal or Xicallanco to monopolize the grand maritime canoe highway wrapping the peninsula."
 oe_msn_may_08_caribbean_jade_cacao_routes_req_tt:0 "Own Ekab and either Chactemal or Xicallanco in the Age of Discovery or later."
 oe_msn_may_09_cenote_terrace_agronomy:0 "Cenote & Terrace Agronomy"
 oe_msn_may_09_cenote_terrace_agronomy_desc:0 "Restore karst cenote reservoirs, stone-walled orchards, and wetland raised fields to feed densely populated Maya metropolises."
 oe_msn_may_09_cenote_terrace_agronomy_req_tt:0 "Own Mayapan or Noh Peten in the Age of Renaissance or later."
 oe_msn_may_10_venus_almanac_observatories:0 "Venus Almanacs & Star Observatories"
 oe_msn_may_10_venus_almanac_observatories_desc:0 "Fund astronomical temples and bark-paper almanac libraries in Mayapan, preserving Maya mathematics for future centuries."
 oe_msn_may_10_venus_almanac_observatories_req_tt:0 "Own Mayapan and hold at least 260 Gold."
 oe_msn_may_11_mayan_medical_renaissance:0 "Botanical Medicine & Printed Almanacs"
 oe_msn_may_11_mayan_medical_renaissance_desc:0 "Combine Maya rainforest pharmacology with printed almanacs and public sanitation to shield our cities against epidemic shocks."
 oe_msn_may_11_mayan_medical_renaissance_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_may_12_second_mayan_golden_age:0 "The Second Mayan Golden Age"
 oe_msn_may_12_second_mayan_golden_age_desc:0 "Uniting Mayapan, Chichen Itza, and Noh Peten in unconquered brilliance inaugurates a Second Mayan Golden Age across Mesoamerica."
 oe_msn_may_12_second_mayan_golden_age_req_tt:0 "Own Mayapan, Chichen Itza, and Noh Peten with at least 18 Stability in the Age of Absolutism or later."
