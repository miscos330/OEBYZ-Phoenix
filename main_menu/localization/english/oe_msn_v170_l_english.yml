 oe_msn_mal_destiny:0 "#bold #color_yellow Mali & Songhai: Golden Empire of the Niger#!#!"
 oe_msn_mal_destiny_DESCRIPTION:0 "From the Gold of Bambuk and Sankore University to the Niger River Fleet and West African Gunpowder Hegemony"
 oe_msn_mal_destiny_CRITERIA_DESCRIPTION:0 "Secure the Bambuk goldfields, drill armored Sofa cavalry and Askia administration, unite Djenne, Timbuktu, Gao, and the Saharan salt routes, and crown a modern West African gunpowder empire."
 oe_msn_mal_destiny_BUTTON_TOOLTIP:0 "Embark on the Mali-Songhai Destiny"
 oe_msn_mal_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Mali and Songhai: harness Bambuk and Bure gold, field Sofa armored cavalry and Sahelian gunpowder regiments, master the Niger River bend from Djenne to Timbuktu, Gao, and Taghaza, and illuminate the world through Sankore University and trans-Saharan commerce."
 oe_msn_mal_01_gold_of_bambuk:0 "Gold of Bambuk & the Royal Hearth"
 oe_msn_mal_01_gold_of_bambuk_desc:0 "Alluvial goldfields of Bambuk and Bure have funded Niger kings since Sundiata's charter at Kouroukan Fouga. Securing the royal [capital|e] river bend lifts homeland [development|e], enriches treasury [gold|e], and confirms uncontested dynastic [legitimacy|e] across the savanna."
 oe_msn_mal_01_gold_of_bambuk_req_tt:0 "Own or have subjects own Niani or Gao, plus Kayes, Siguiri, or Gao, have 5 Stability, and reach 12 Development in our capital."
 oe_msn_mal_02_sofa_cavalry_corps:0 "Raise the Sofa Armored Cavalry Corps"
 oe_msn_mal_02_sofa_cavalry_corps_desc:0 "Mounted in quilted cotton barding and imported Berber mail, the royal sofa lancers form the iron strike force of the Niger empires. Forging standing [regulars|e] elevates [army_tradition|e], disciplines our savanna [army|e], and channels provincial [manpower|e] under crown banners."
 oe_msn_mal_02_sofa_cavalry_corps_req_tt:0 "Hold 180 Gold, have 10 Stability, and build a Castle or Weapon Guild (or reach 15 Army Tradition)."
 oe_msn_mal_03_askia_imperial_cabinet:0 "Askia Ministries & Standard Weights"
 oe_msn_mal_03_askia_imperial_cabinet_desc:0 "Following Askia Muhammad's administrative reforms, appointed ministers oversee river navigation, forestry, and standardized weights across every province. Professionalizing the imperial [cabinet|e] strengthens [crown_power|e], tightens provincial [control|e], and preserves orderly [stability|e]."
 oe_msn_mal_03_askia_imperial_cabinet_req_tt:0 "Have 12 Stability, reach the Age of Renaissance, and build a Counting House or Guild Hall (or reach 50% Burghers satisfaction)."
 oe_msn_mal_04_sahel_gunpowder_army:0 "Sahelian Gunpowder Vanguard"
 oe_msn_mal_04_sahel_gunpowder_army_desc:0 "Never again shall trans-Saharan arquebusiers outgun the Niger heartland as at Tondibi; royal foundries now arm sofa formations with flintlocks and field bronze. Embracing modern gunpowder [advances|e] and [institutions|e] hones [army_tradition|e] for an unbreakable Sahelian [army|e]."
 oe_msn_mal_04_sahel_gunpowder_army_req_tt:0 "Own or have subjects own Timbuktu or Gao, have 15 Stability, reach the Age of Reformation, maintain a Barracks or Armory (or 30 Army Tradition), and adopt Pike and Shot or Artillery (or 35 Army Tradition)."
 oe_msn_mal_05_djenne_inland_delta:0 "Djenne & the Fertile Inland Delta"
 oe_msn_mal_05_djenne_inland_delta_desc:0 "Seasonal floods of the Inner Niger Delta turn Djenne and Segou into an emerald granary beneath monumental mud-brick mosques. Integrating these [core|e] river cities boosts agrarian [development|e], nurtures artisan [prosperity|e], and funnels gold-dust [trade|e] northward."
 oe_msn_mal_05_djenne_inland_delta_req_tt:0 "Own or have subjects own Djenne and Segou."
 oe_msn_mal_06_timbuktu_gao_axis:0 "Twin Jewels: Timbuktu & Gao"
 oe_msn_mal_06_timbuktu_gao_axis_desc:0 "Where camel caravans meet river pirogues along the great Niger bend, Timbuktu and Gao anchor both scholarship and empire. Holding this twin [core|e] axis multiplies customs [gold|e], deepens merchant [market|e] reach, and cements royal [prestige|e] across the Sudan."
 oe_msn_mal_06_timbuktu_gao_axis_req_tt:0 "Own or have subjects own Timbuktu and Gao."
 oe_msn_mal_07_taghaza_salt_caravans:0 "Taghaza Salt Pans & Oasis Gates"
 oe_msn_mal_07_taghaza_salt_caravans_desc:0 "Slabs of rock salt hewn from Taghaza's desert pans trade weight for weight against southern gold at Walata's oasis gates. Garrisoning caravan wells extends desert [control|e], fortifies oasis [buildings|e], and safeguards the lifeblood [trade|e] of merchant [estates|e]."
 oe_msn_mal_07_taghaza_salt_caravans_req_tt:0 "Own or have subjects own Walata or Taghaza, own 40 locations, and maintain a Caravanserai or Marketplace (or earn 25 monthly trade and tax income)."
 oe_msn_mal_08_niger_river_fleet:0 "Master of the Niger River Fleet"
 oe_msn_mal_08_niger_river_fleet_desc:0 "Commanded by the Hi-Koi admiral, flotillas of planked war-canoes patrol two thousand miles of Niger currents from Kabara to the rapids of Bussa. Maintaining riverine [sailors|e] builds [navy_tradition|e], protects cargo [trade|e], and projects agile [maritime_presence|e] along the waterway."
 oe_msn_mal_08_niger_river_fleet_req_tt:0 "Own or have subjects own Timbuktu, Gao, and Djenne, reach the Age of Discovery, and build a Wharf or Trading Hub (or earn 35 monthly trade and tax income)."
 oe_msn_mal_09_sankore_university:0 "Sankore University & Timbuktu Libraries"
 oe_msn_mal_09_sankore_university_desc:0 "In Sankore, Djinguereber, and Sidi Yahya, tens of thousands of jurists and scribes copy treatises on astronomy, jurisprudence, and medicine; here books fetch higher prices than gold. Endowing campus [buildings|e] lifts [literacy|e], radiates [cultural_tradition|e], and honors scholarly [estate_satisfaction|e]."
 oe_msn_mal_09_sankore_university_req_tt:0 "Own or have subjects own Timbuktu, reach the Age of Renaissance, keep Clergy satisfaction at least 50%, and build a Madrasa, University, or Library."
 oe_msn_mal_10_gold_standard_treasury:0 "Bullion Mint & Imperial Treasury"
 oe_msn_mal_10_gold_standard_treasury_desc:0 "Remembering how Mansa Musa's unrestrained generosity depressed Cairo's bullion exchange, our treasury assayers now strike uniform mithqal coinage under strict audit. Disciplined [gold|e] reserves curb [inflation|e], reassure [estates|e], and anchor international [prestige|e]."
 oe_msn_mal_10_gold_standard_treasury_req_tt:0 "Hold 320 Gold, own or have subjects own Niani or Gao, and earn at least 30 monthly trade and tax income."
 oe_msn_mal_11_trans_saharan_hegemony:0 "Trans-Saharan Trade Hegemony"
 oe_msn_mal_11_trans_saharan_hegemony_desc:0 "Linking Kano's indigo dye pits with the western Sahara caravans gives the Niger throne mastery over both desert gold and coastal Atlantic outlets. Harnessing commercial [institutions|e] magnifies [trade|e] dominance, expands [market|e] reach, and elevates Sahelian [diplomatic_reputation|e]."
 oe_msn_mal_11_trans_saharan_hegemony_req_tt:0 "Own or have subjects own Timbuktu plus Koumbi Saleh or Kano, have 15 Stability, reach the Age of Reformation, and embrace Global Trade or Banking (or earn 55 monthly trade and tax income)."
 oe_msn_mal_12_west_african_gunpowder_empire:0 "West African Gunpowder Empire"
 oe_msn_mal_12_west_african_gunpowder_empire_desc:0 "Crowned in gold and defended by disciplined gunpowder brigades from the Senegal to Lake Chad, the united Niger empire commands respect as a global [great_power|e]. Sovereign [prosperity|e], scholarly [prestige|e], and resolute [crown_power|e] herald a West African golden century."
 oe_msn_mal_12_west_african_gunpowder_empire_req_tt:0 "Own or have subjects own Niani, Timbuktu, and Gao, have 18 Stability, reach the Age of Absolutism, reach 24 Development in our capital, and become a Great Power or earn 75 monthly trade and tax income."
 oe_msn_kil_destiny:0 "#bold #color_yellow Kilwa & Swahili: Lord of the Monsoon Sea#!#!"
 oe_msn_kil_destiny_DESCRIPTION:0 "From Swahili Coral Cities and Sofala Gold to Armed Dhows Defying Foreign Armadas Across the Indian Ocean Rim"
 oe_msn_kil_destiny_CRITERIA_DESCRIPTION:0 "Unite the Swahili coral stone towns from Malindi and Mombasa to Zanzibar, Kilwa, and Sofala, launch cannon-armed dhows against foreign armadas, and reign supreme across the Indian Ocean rim."
 oe_msn_kil_destiny_BUTTON_TOOLTIP:0 "Embark on the Kilwa-Swahili Destiny"
 oe_msn_kil_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Kilwa and the Swahili Coast: build monsoon dhow shipyards and coral sea batteries to defy European armadas, unite Zanzibar, Mombasa, Malindi, Sofala, and the Zimbabwe gold corridor, and crown Husuni Kubwa as the radiant clearinghouse of the Indian Ocean."
 oe_msn_kil_01_swahili_coral_cities:0 "Swahili Coral Cities Anchored"
 oe_msn_kil_01_swahili_coral_cities_desc:0 "Whitewashed coral-rag mosques, stone piers, and arched merchant courtyards rise above turquoise reefs from Kilwa Kisiwani to Songo Mnara. Elevating our island [capital|e] boosts coastal [development|e], secures Shirazi dynastic [legitimacy|e], and welcomes monsoon [prosperity|e]."
 oe_msn_kil_01_swahili_coral_cities_req_tt:0 "Own or have subjects own Kilwa Kisiwani and Songo Mnara (or Mombasa and Zanzibar), have 5 Stability, and reach 12 Development in our capital."
 oe_msn_kil_02_monsoon_dhow_shipyards:0 "Monsoon Dhow Shipyards"
 oe_msn_kil_02_monsoon_dhow_shipyards_desc:0 "Coir-stitched mtepe hulls and swift lateen-rigged war dhows catch the kaskazi and kusi trade winds between Oman and Madagascar. Expanding timber [buildings|e] trains veteran [sailors|e], hones [navy_tradition|e], and launches an armed Swahili [navy|e]."
 oe_msn_kil_02_monsoon_dhow_shipyards_req_tt:0 "Control at least one port, hold 180 Gold, and build a Wharf or hold at least 3 ports."
 oe_msn_kil_03_coastal_cannon_batteries:0 "Coral Sea-Wall Cannon Batteries"
 oe_msn_kil_03_coastal_cannon_batteries_desc:0 "Porous coral limestone absorbs roundshot without shattering, making reef-side bastions and iron harbor chains deadly traps for hostile squadrons. Mounting brass ordnance in every sea [fort|e] builds [army_tradition|e], sharpens [navy_tradition|e], and shields port [control|e]."
 oe_msn_kil_03_coastal_cannon_batteries_req_tt:0 "Have 12 Stability, reach the Age of Discovery, and build a Castle or Cannon Maker (or reach 20 Navy Tradition)."
 oe_msn_kil_04_defy_portuguese_armadas:0 "Defy European Armadas on the Monsoon"
 oe_msn_kil_04_defy_portuguese_armadas_desc:0 "When European carracks demand exclusive cartaz passes at gunpoint, our gun-dhows and reef batteries turn the Swahili surf into their graveyard. Mastering broadside [advances|e] and naval [institutions|e] guards our [maritime_presence|e] and proclaims unconquered [prestige|e]."
 oe_msn_kil_04_defy_portuguese_armadas_req_tt:0 "Own or have subjects own Kilwa Kisiwani, have 15 Stability, reach the Age of Reformation, build a Shipyard or Bastion (or 30 Navy Tradition), and adopt Artillery or Pike and Shot (or 35 Navy Tradition)."
 oe_msn_kil_05_zanzibar_pemba_straits:0 "Zanzibar & the Spice Channel"
 oe_msn_kil_05_zanzibar_pemba_straits_desc:0 "Sheltered channels between Unguja Island and the mainland caravan terminus of Bagamoyo link inland ivory porters with deep-water anchorages. Securing this [core|e] strait boosts island [development|e], commands coastal [trade|e], and deepens mainland [control|e]."
 oe_msn_kil_05_zanzibar_pemba_straits_req_tt:0 "Own or have subjects own Zanzibar and Bagamoyo."
 oe_msn_kil_06_mombasa_malindi_league:0 "Mombasa & Malindi Northern Union"
 oe_msn_kil_06_mombasa_malindi_league_desc:0 "Ending centuries of rivalry between Mombasa's natural island harbor and Malindi's open roadstead unites the northern Swahili stone-towns under one banner. Integrating both [core|e] ports recruits skilled [sailors|e], expands [maritime_presence|e], and elevates naval [navy_tradition|e]."
 oe_msn_kil_06_mombasa_malindi_league_req_tt:0 "Own or have subjects own Mombasa and Malindi."
 oe_msn_kil_07_sofala_gold_ivory:0 "Sofala Gold & Mozambique Channel"
 oe_msn_kil_07_sofala_gold_ivory_desc:0 "Gold dust carried down from the Mutapa highlands pours through Sofala's tidal bars alongside prime elephant tusks bound for Cambay. Anchoring this southern [core|e] enclave swells state [gold|e] customs, enriches maritime [trade|e], and drives channel [prosperity|e]."
 oe_msn_kil_07_sofala_gold_ivory_req_tt:0 "Own or have subjects own Sofala plus Mozambique or Quelimane, own 28 locations, and earn at least 25 monthly trade and tax income."
 oe_msn_kil_08_zimbabwe_gold_corridor:0 "Zimbabwe Gold & Northern Reef Rim"
 oe_msn_kil_08_zimbabwe_gold_corridor_desc:0 "From the dry-stone towers of Great Zimbabwe to Lamu's mangrove archipelago, one customs register now governs interior bullion and reef ports alike. Linking inland [market|e] stations with coastal [trade|e] multiplies crown [gold|e] and cements merchant [crown_power|e]."
 oe_msn_kil_08_zimbabwe_gold_corridor_req_tt:0 "Own or have subjects own Sofala plus Great Zimbabwe or Lamu, reach the Age of Discovery, and build a Trading Hub or Marketplace (or earn 35 monthly trade and tax income)."
 oe_msn_kil_09_husuni_kubwa_emporium:0 "Husuni Kubwa Imperial Emporium"
 oe_msn_kil_09_husuni_kubwa_emporium_desc:0 "The cliff-top palace complex of Husuni Kubwa pairs royal audience domes with vaulted warehouses stacked high with Ming porcelain and Gujarati cottons. Expanding harbor [buildings|e] rewards patrician [estate_satisfaction|e], deepens our central [market|e], and raises civic [prestige|e]."
 oe_msn_kil_09_husuni_kubwa_emporium_req_tt:0 "Own or have subjects own Kilwa Kisiwani, hold 240 Gold, and build a Marketplace or Guild Hall (or reach 55% Burghers satisfaction)."
 oe_msn_kil_10_swahili_chronicle_letters:0 "Kilwa Chronicle & Swahili Letters"
 oe_msn_kil_10_swahili_chronicle_letters_desc:0 "Composed in rhythmic Kiswahili and Arabic script, the Kilwa Chronicle and utenzi epics preserve dynastic memory across every coastal mosque. Sponsoring academic [buildings|e] raises urban [literacy|e], nurtures [cultural_tradition|e], and strengthens scholarly [religious_influence|e]."
 oe_msn_kil_10_swahili_chronicle_letters_req_tt:0 "Own or have subjects own Kilwa Kisiwani, reach the Age of Renaissance, keep Clergy satisfaction at least 50%, and build a Madrasa, Library, or University."
 oe_msn_kil_11_monsoon_trade_network:0 "Monsoon Dhow Network Across the Rim"
 oe_msn_kil_11_monsoon_trade_network_desc:0 "With factor houses in Aden, Muscat, Calicut, and Malacca, Swahili merchant syndicates settle ocean bills of exchange on the turn of every monsoon. Mastering commercial [institutions|e] magnifies [trade|e] dominance, bolsters [diplomatic_reputation|e], and secures rim-wide [maritime_presence|e]."
 oe_msn_kil_11_monsoon_trade_network_req_tt:0 "Own or have subjects own Kilwa Kisiwani and Mombasa, have 15 Stability, reach the Age of Reformation, and embrace Global Trade or Banking (or earn 55 monthly trade and tax income)."
 oe_msn_kil_12_lord_indian_ocean_rim:0 "Lord of the Indian Ocean Rim"
 oe_msn_kil_12_lord_indian_ocean_rim_desc:0 "From Cape Delgado to the Horn, every reef channel and coral emporium salutes the Swahili thalassocracy, now seated among the world's foremost [great_power|e] states. Enduring [prosperity|e], commanding [navy|e] reach, and luminous maritime [prestige|e] crown the Lord of the Monsoon."
 oe_msn_kil_12_lord_indian_ocean_rim_req_tt:0 "Own or have subjects own Kilwa Kisiwani, Mombasa, Zanzibar, and Sofala, have 18 Stability, reach the Age of Absolutism, reach 24 Development in our capital, and become a Great Power or earn 75 monthly trade and tax income."
 oe_msn_kon_destiny:0 "#bold #color_yellow Kongo & Benin: Sovereign Equatorial Renaissance#!#!"
 oe_msn_kon_destiny_DESCRIPTION:0 "From Mbanza-Kongo and Benin Bronze Guilds to Congo Basin Dominion, Anti-Slave Edicts, and Atlantic Diplomatic Parity"
 oe_msn_kon_destiny_CRITERIA_DESCRIPTION:0 "Anchor Mbanza-Kongo or Benin's bronze guilds, unify the equatorial river basins and Atlantic ports, proclaim the Anti-Slave Trade Edict, and achieve a sovereign Central-West African Renaissance."
 oe_msn_kon_destiny_BUTTON_TOOLTIP:0 "Embark on the Kongo-Benin Destiny"
 oe_msn_kon_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Kongo, Benin, and Oyo: fortify walled bronze-casting capitals and royal flintlock guards, enact the sovereign Anti-Slave Trade Edict, bind the Congo Basin and Niger Delta river corridors to Atlantic ports, and lead an Equatorial Renaissance of diplomacy, literacy, and artistry."
 oe_msn_kon_01_mbanza_benin_guilds:0 "Mbanza-Kongo & Benin Bronze Guilds"
 oe_msn_kon_01_mbanza_benin_guilds_desc:0 "Lost-wax bronze casters of Igun Street, royal iron-smelters of Mbanza-Kongo, and Oyo master weavers anchor the equatorial craft hierarchy. Elevating our royal [capital|e] drives urban [development|e], enriches artisan [estates|e], and reinforces ancestral [legitimacy|e]."
 oe_msn_kon_01_mbanza_benin_guilds_req_tt:0 "Own or have subjects own Mbanza-Kongo, Benin, or Oyo-Ile, have 5 Stability, and reach 12 Development in our capital."
 oe_msn_kon_02_bronze_wall_defenses:0 "Earthwork Ramparts & Royal Moats"
 oe_msn_kon_02_bronze_wall_defenses_desc:0 "Monumental earthen iya ramparts and deep rain-fed moats ring forest capitals for miles, turning thick rainforest approaches into formidable defensive rings. Maintaining fortified [fort|e] earthworks raises [army_tradition|e], secures heartland [control|e], and steadies domestic [stability|e]."
 oe_msn_kon_02_bronze_wall_defenses_req_tt:0 "Hold 180 Gold, have 10 Stability, and build a Castle (or reach 15 Army Tradition)."
 oe_msn_kon_03_royal_flintlock_guards:0 "Royal Flintlock Guards & Arsenals"
 oe_msn_kon_03_royal_flintlock_guards_desc:0 "Refusing to depend on foreign brokers for powder or locks, royal smithies forge local barrels and drill elite palace musketeers beside shield-bearing vanguard corps. Fielding disciplined [regulars|e] sharpens [army_tradition|e], modernizes our [army|e], and channels provincial [manpower|e]."
 oe_msn_kon_03_royal_flintlock_guards_req_tt:0 "Have 12 Stability, reach the Age of Discovery, and build an Armory or Weapon Guild (or reach 22 Army Tradition)."
 oe_msn_kon_04_anti_slave_trade_edict:0 "The Royal Anti-Slave Trade Edict"
 oe_msn_kon_04_anti_slave_trade_edict_desc:0 "Echoing King Afonso I's defiant 1526 epistles to Lisbon, the throne outlaws human trafficking across every estuary and confiscates rogue slaver vessels. Enforcing sovereign [crown_power|e] protects rural [manpower|e], lifts peasant [estate_satisfaction|e], and commands moral [prestige|e] across the Atlantic."
 oe_msn_kon_04_anti_slave_trade_edict_req_tt:0 "Have 15 Stability, reach the Age of Reformation, keep Peasants satisfaction at least 50%, and embrace Global Trade or Pike and Shot (or reach 32 Army Tradition)."
 oe_msn_kon_05_congo_niger_heartland:0 "Consolidate the Rainforest Heartland"
 oe_msn_kon_05_congo_niger_heartland_desc:0 "Uniting sacred coronation towns with the riverine provinces of the forest interior binds provincial governors directly to the court's tribute rolls. Securing our [core|e] heartland strengthens royal [control|e], cultivates domestic [prosperity|e], and deepens dynastic [stability|e]."
 oe_msn_kon_05_congo_niger_heartland_req_tt:0 "Own or have subjects own Mbanza-Kongo and Mbanza-Mbata, or Benin and Ughoton, or Oyo-Ile and Ife."
 oe_msn_kon_06_atlantic_river_ports:0 "Sovereign Atlantic River Gateways"
 oe_msn_kon_06_atlantic_river_ports_desc:0 "Holding the Congo estuary at Soyo or the lagoon mouths of Loango, Eko, and Warri ensures foreign merchants enter only through royal customs barriers. Fortifying coastal [core|e] ports recruits lagoon [sailors|e], projects Gulf [maritime_presence|e], and builds a protective [navy|e]."
 oe_msn_kon_06_atlantic_river_ports_req_tt:0 "Own or have subjects own Soyo, Loango, Eko, or Warri, and control at least one port."
 oe_msn_kon_07_equatorial_basin_dominion:0 "Congo River & Delta Trade Dominion"
 oe_msn_kon_07_equatorial_basin_dominion_desc:0 "From Luanda's nzimbu shell fisheries to the confluence markets of Idah and Calabar, river canoes carry copper ingots, palm oil, and salt deep into the interior. Taxing basin [trade|e] multiplies treasury [gold|e], deepens regional [market|e] integration, and extends inland [control|e]."
 oe_msn_kon_07_equatorial_basin_dominion_req_tt:0 "Own at least 24 locations, earn 22 monthly trade and tax income, and own or have subjects own Luanda, Mbanza-Soyo, Idah, or Calabar."
 oe_msn_kon_08_congo_basin_hegemon:0 "Hegemon of the Congo & Gulf Basins"
 oe_msn_kon_08_congo_basin_hegemon_desc:0 "Commanding the great equatorial watersheds transforms competing forest polities into a cohesive Atlantic-to-interior commonwealth. Expanding riverine [buildings|e] channels regional [trade|e] into lasting [prosperity|e] while binding tributary [subjects|e] to our central throne."
 oe_msn_kon_08_congo_basin_hegemon_req_tt:0 "Own at least 36 locations, reach the Age of Discovery, and build a Wharf or Trading Hub (or hold at least 4 ports)."
 oe_msn_kon_09_atlantic_sovereign_diplomacy:0 "Atlantic Sovereign Diplomacy"
 oe_msn_kon_09_atlantic_sovereign_diplomacy_desc:0 "Sending titled ambassadors to Lisbon, Rome, and Amsterdam on equal terms establishes our monarch as a sovereign brother to crowned heads abroad. Skilled oceanic [diplomacy|e] elevates [diplomatic_reputation|e], invites useful [institutions|e], and safeguards treaty [prestige|e]."
 oe_msn_kon_09_atlantic_sovereign_diplomacy_req_tt:0 "Have 10 Stability, reach the Age of Renaissance, and embrace Feudalism or Renaissance (or reach 16 Stability)."
 oe_msn_kon_10_brass_ivory_commerce:0 "Brass, Raffia & Pepper Prosperity"
 oe_msn_kon_10_brass_ivory_commerce_desc:0 "Finely chased brass plaques, velvet-soft raffia cloth, carved ivory saltcellars, and Benin pepper command princely sums in foreign ports. Investing in guild [buildings|e] swells export [gold|e], enriches [cultural_tradition|e], and multiplies domestic [development|e]."
 oe_msn_kon_10_brass_ivory_commerce_req_tt:0 "Hold 280 Gold and build a Marketplace or Guild Hall (or earn at least 28 monthly trade and tax income)."
 oe_msn_kon_11_equatorial_printing_courts:0 "Equatorial Academies & Printing Courts"
 oe_msn_kon_11_equatorial_printing_courts_desc:0 "Royal chanceries print Kikongo, Edo, and Yoruba legal codes alongside Latin and Portuguese treatises, training a literate bureaucracy free of foreign tutors. Expanding scholarly [buildings|e] multiplies [literacy|e], streamlines the [cabinet|e], and accelerates homegrown [advances|e]."
 oe_msn_kon_11_equatorial_printing_courts_req_tt:0 "Have 15 Stability, reach the Age of Reformation, and build a Printing Press Shop, University, or Library (or reach 20 Development in our capital)."
 oe_msn_kon_12_central_west_african_renaissance:0 "Central-West African Renaissance"
 oe_msn_kon_12_central_west_african_renaissance_desc:0 "Free of foreign subjugation, the equatorial empire shines as a sovereign Atlantic [great_power|e] whose bronze academies, royal arsenals, and clean commerce inspire an entire continent. Radiant [prosperity|e], proud [cultural_tradition|e], and sovereign [prestige|e] crown this African renaissance."
 oe_msn_kon_12_central_west_african_renaissance_req_tt:0 "Own at least 45 locations, have 18 Stability, reach the Age of Absolutism, reach 24 Development in our capital, and become a Great Power or earn 70 monthly trade and tax income."
 oe_msn_iro_destiny:0 "#bold #color_yellow Haudenosaunee: Sovereign Longhouse of Turtle Island#!#!"
 oe_msn_iro_destiny_DESCRIPTION:0 "From the Great Law of Peace and Onondaga Council Fire to Flintlock Rangers, Great Lakes Hegemony, and Constitutional Union"
 oe_msn_iro_destiny_CRITERIA_DESCRIPTION:0 "Unite the Five Nations beneath the Great Law of Peace, achieve fur-trade and flintlock parity with Woodland Rangers, master the Great Lakes portages, and establish the Sovereign Confederacy of Turtle Island."
 oe_msn_iro_destiny_BUTTON_TOOLTIP:0 "Embark on the Haudenosaunee Destiny"
 oe_msn_iro_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for the Iroquois / Haudenosaunee Confederacy: enact the Great Law of Peace, rally the Five Nations around Onondaga, arm Woodland Rangers for flintlock parity, secure Niagara and the Great Lakes fur corridors, and codify a modern sovereign federal republic on Turtle Island."
 oe_msn_iro_01_great_law_of_peace:0 "Proclaim the Great Law of Peace"
 oe_msn_iro_01_great_law_of_peace_desc:0 "Beneath the Great White Pine of Peace, the Peacemaker and Hiawatha bury war hatchets in the rushing underground stream and bind warring clans into one hearth. Upholding Kaianerehkowa [stability|e] elevates council [legitimacy|e], nurtures [capital|e] growth, and honors ancestral [prestige|e]."
 oe_msn_iro_01_great_law_of_peace_req_tt:0 "Own or have subjects own one of the Five Nations heartlands, have 5 Stability, and reach 8 Development in our capital (or 10 Stability)."
 oe_msn_iro_02_longhouse_confederacy:0 "Unite the Longhouse Confederacy"
 oe_msn_iro_02_longhouse_confederacy_desc:0 "At Onondaga's central council fire, Clan Mothers nominate fifty sachems whose unanimous voice speaks from the Eastern Door to the Western Door. Formalizing this federal [parliament|e] deepens regional [development|e], harmonizes internal [estates|e], and anchors collective [control|e]."
 oe_msn_iro_02_longhouse_confederacy_req_tt:0 "Be the Iroquois Confederacy or control Onondaga and Canajoharie, and build a Granary or Guild Hall (or reach 10 Stability)."
 oe_msn_iro_03_flintlock_woodland_parity:0 "Fur Trade & Firearms Parity"
 oe_msn_iro_03_flintlock_woodland_parity_desc:0 "Trading prime beaver pelts for rifled Dutch and English flintlocks while training village gunsmiths gives Haudenosaunee scouts lethal fire superiority in deep timber. Organizing woodland [regulars|e] lifts [army_tradition|e], sharpens our [army|e], and masters gunpowder [advances|e]."
 oe_msn_iro_03_flintlock_woodland_parity_req_tt:0 "Hold 180 Gold, reach the Age of Discovery, and build a Weapon Guild or Armory (or reach 18 Army Tradition)."
 oe_msn_iro_04_covenant_chain_sovereignty:0 "Covenant Chain Armed Sovereignty"
 oe_msn_iro_04_covenant_chain_sovereignty_desc:0 "Polishing the Silver Covenant Chain while playing rival Atlantic empires against one another keeps the Longhouse free, armed, and courted by every colonial governor. Disciplined [diplomacy|e] and modern [institutions|e] amplify [diplomatic_reputation|e] while safeguarding [crown_power|e]."
 oe_msn_iro_04_covenant_chain_sovereignty_req_tt:0 "Have 15 Stability, reach the Age of Reformation, and adopt Pike and Shot (or reach 28 Army Tradition)."
 oe_msn_iro_05_five_nations_united:0 "Five Nations From Mohawk to Seneca"
 oe_msn_iro_05_five_nations_united_desc:0 "Mohawk Keepers of the Eastern Door, Oneida, Onondaga Firekeepers, Cayuga, and Seneca Keepers of the Western Door stand shoulder to shoulder across the Finger Lakes. Uniting our [core|e] homelands swells confederate [manpower|e], lifts valley [prosperity|e], and magnifies [prestige|e]."
 oe_msn_iro_05_five_nations_united_req_tt:0 "Be the Iroquois Confederacy or own or have subjects own all five ancestral territories from Mohawk to Seneca."
 oe_msn_iro_06_mohawk_hudson_corridor:0 "Mohawk-Champlain & Ontario Gateways"
 oe_msn_iro_06_mohawk_hudson_corridor_desc:0 "Whoever holds the portages between the Mohawk River, Lake Champlain, and Lake Ontario commands the strategic highway of northeastern America. Securing these [core|e] narrows anchors frontier [fort|e] watches, gathers river [trade|e] tolls, and reinforces eastern [control|e]."
 oe_msn_iro_06_mohawk_hudson_corridor_req_tt:0 "Own or have subjects own both Saratoga and Ticonderoga, or Oswego."
 oe_msn_iro_07_niagara_huron_beaver_realm:0 "Niagara Falls & Northern Fur Lands"
 oe_msn_iro_07_niagara_huron_beaver_realm_desc:0 "Controlling the Niagara portage and the northern carrying trails of Tkaronto places the continent's richest northern fur basins under Haudenosaunee mediation. Holding this lakeside [core|e] channels pelt [trade|e] into our [market|e], enriching confederate [gold|e] coffers."
 oe_msn_iro_07_niagara_huron_beaver_realm_req_tt:0 "Own or have subjects own Niagara plus Tkaronto or Ossossane, own 30 locations, and earn at least 20 monthly trade and tax income."
 oe_msn_iro_08_great_lakes_hegemony:0 "Great Lakes Hegemony"
 oe_msn_iro_08_great_lakes_hegemony_desc:0 "From the straits of Mackinac and Detroit to the tidal mouth of the Hudson, birchbark fleets and timber sloops sail under the Hiawatha Belt. Securing continental [trade|e] hubs elevates inland [maritime_presence|e], binds allied [subjects|e], and spreads lakeshore [prosperity|e]."
 oe_msn_iro_08_great_lakes_hegemony_req_tt:0 "Own or have subjects own Niagara plus Waawiiyaataanong, Mackinac, or Manhattan, reach the Age of Reformation, and build a Trading Hub or Marketplace (or earn 35 monthly trade and tax income)."
 oe_msn_iro_09_wampum_council_archives:0 "Wampum Diplomatic Archives"
 oe_msn_iro_09_wampum_council_archives_desc:0 "Purple and white quahog wampum belts weave treaties, genealogies, and federal statutes into living memory recited aloud by trained Keepers of the Record. Guarding archive [buildings|e] enriches [cultural_tradition|e], spreads civic [literacy|e], and sharpens treaty [diplomacy|e]."
 oe_msn_iro_09_wampum_council_archives_req_tt:0 "Have 10 Stability, reach the Age of Renaissance, and build a Library or Scriptorium (or reach 15 Stability)."
 oe_msn_iro_10_fur_trade_treasury:0 "Longhouse Granaries & Fur Treasury"
 oe_msn_iro_10_fur_trade_treasury_desc:0 "Three Sisters mounds of maize, climbing beans, and squash fill bark-lined subterranean pits while regulated fur auctions fund public works across every nation. Expanding civic [buildings|e] boosts [development|e], stabilizes communal [gold|e] reserves, and sustains village [prosperity|e]."
 oe_msn_iro_10_fur_trade_treasury_req_tt:0 "Hold 260 Gold and build a Granary or Marketplace (or earn at least 22 monthly trade and tax income)."
 oe_msn_iro_11_federal_republic_turtle_island:0 "Constitutional Longhouse Republic"
 oe_msn_iro_11_federal_republic_turtle_island_desc:0 "Publishing the Great Law in bilingual print beside federal assemblies inspires constitutional thinkers across Turtle Island and beyond the sea. Uniting representative [parliament|e] checks with modern [institutions|e] lifts [literacy|e] and cements enduring constitutional [stability|e]."
 oe_msn_iro_11_federal_republic_turtle_island_req_tt:0 "Have 15 Stability, reach the Age of Reformation, embrace Printing Press or New World (or 20 Stability), and build a Printing Press Shop or University (or reach 18 Development in our capital)."
 oe_msn_iro_12_sovereign_confederacy_turtle_island:0 "Sovereign Confederacy of Turtle Island"
 oe_msn_iro_12_sovereign_confederacy_turtle_island_desc:0 "The Great Longhouse now stretches unchallenged from the Great Lakes to the Atlantic tidewaters, recognized across every foreign capital as a sovereign [great_power|e]. Free [parliament|e] concord, continental [prosperity|e], and proud [prestige|e] immortalize Turtle Island."
 oe_msn_iro_12_sovereign_confederacy_turtle_island_req_tt:0 "Own or have subjects own Onondaga, Canajoharie, and Niagara, have 18 Stability, reach the Age of Absolutism, reach 22 Development in our capital, and become a Great Power or earn 60 monthly trade and tax income."
 oe_msn_may_destiny:0 "#bold #color_yellow Maya League: Second Mayan Golden Age#!#!"
 oe_msn_may_destiny_DESCRIPTION:0 "From the League of Mayapan Revival and Cenote Agronomy to Jungle Bastions, Caribbean Canoe Routes, and Mayan Renaissance"
 oe_msn_may_destiny_CRITERIA_DESCRIPTION:0 "Revive the League of Mayapan across Yucatan and Peten, master cenote agronomy and Venus astronomical science, fortify jungle citadels against conquistadors, and usher in the Second Mayan Golden Age."
 oe_msn_may_destiny_BUTTON_TOOLTIP:0 "Embark on the Maya League Destiny"
 oe_msn_may_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for the Maya League: unite Mayapan, Chichen Itza, Mani, Campeche, and Noh Peten, field Holkan noble infantry behind impregnable jungle stone citadels, command Caribbean jade and cacao canoe trade, and ignite the Second Mayan Golden Age of astronomy, medicine, and letters."
 oe_msn_may_01_league_of_mayapan_revival:0 "League of Mayapan Revival"
 oe_msn_may_01_league_of_mayapan_revival_desc:0 "Healing the bloody feud between the Cocom and Xiu dynasties restores the multepal joint council behind Mayapan's limestone walls. Rebuilding our central [capital|e] accelerates civic [development|e], renews Yucatec [legitimacy|e], and restores peninsula-wide [stability|e]."
 oe_msn_may_01_league_of_mayapan_revival_req_tt:0 "Own or have subjects own Mayapan, Mani, or Noh Peten, have 5 Stability, and reach 12 Development in our capital."
 oe_msn_may_02_holkan_noble_regiments:0 "Muster Holkan Noble Infantry"
 oe_msn_may_02_holkan_noble_regiments_desc:0 "Clad in salt-stiffened cotton armor and commanded by veteran nacom war-captains, salaried holkan warriors replace seasonal peasant levies. Drilling standing [regulars|e] elevates [army_tradition|e], strengthens our lowland [army|e], and organizes provincial [manpower|e]."
 oe_msn_may_02_holkan_noble_regiments_req_tt:0 "Hold 180 Gold, have 10 Stability, and build a Castle or Weapon Guild (or reach 15 Army Tradition)."
 oe_msn_may_03_jungle_bastions_steel:0 "Jungle Bastions & Captured Steel"
 oe_msn_may_03_jungle_bastions_steel_desc:0 "Salvaged shipboard iron, limestone causeway redoubts, and hidden cenote supply caches turn dense karst bush into an impregnable labyrinth. Fortifying jungle [fort|e] choke points sharpens [army_tradition|e], embeds metallurgical [advances|e], and tightens frontier [control|e]."
 oe_msn_may_03_jungle_bastions_steel_req_tt:0 "Have 12 Stability, reach the Age of Discovery, and build a Castle or Armory (or reach 22 Army Tradition)."
 oe_msn_may_04_defy_conquistadors:0 "Jungle Bastions vs Conquistadors"
 oe_msn_may_04_defy_conquistadors_desc:0 "Just as Champoton once threw back steel-clad landing parties into the surf, united Mayan musketeers and karst bastions shatter every expeditionary armada. Mastering modern [institutions|e] and tactical [advances|e] vindicates our [army|e] and rings with unconquered [prestige|e]."
 oe_msn_may_04_defy_conquistadors_req_tt:0 "Own or have subjects own Mayapan and Chichen Itza, have 15 Stability, reach the Age of Reformation, and adopt Pike and Shot (or reach 32 Army Tradition)."
 oe_msn_may_05_chichen_itza_mani_union:0 "Sacred Triangle: Mayapan, Chichen Itza & Mani"
 oe_msn_may_05_chichen_itza_mani_union_desc:0 "Linking Mayapan's fortress walls with Kukulkan's stepped pyramid at Chichen Itza and the Xiu court of Mani reunites the sacred northern triangle. Integrating these [core|e] cities elevates civic [development|e], deepens ancestral [religious_influence|e], and secures northern [control|e]."
 oe_msn_may_05_chichen_itza_mani_union_req_tt:0 "Own or have subjects own Mayapan, Chichen Itza, and Mani."
 oe_msn_may_06_puuk_champoton_coast:0 "Gulf Coast: Campeche & Champoton"
 oe_msn_may_06_puuk_champoton_coast_desc:0 "The limestone coves of Campeche and the storied estuary of Champoton guard the western Gulf flank of the peninsula. Anchoring these [core|e] harbors recruits seasoned Putun [sailors|e], extends Gulf [maritime_presence|e], and builds a swift coastal [navy|e]."
 oe_msn_may_06_puuk_champoton_coast_req_tt:0 "Own or have subjects own Kaan Peech (Campeche) and Chakan Putum (Champoton), and control at least one port."
 oe_msn_may_07_peten_tikal_lowlands:0 "Peten Basin: Noh Peten & Ancient Tikal"
 oe_msn_may_07_peten_tikal_lowlands_desc:0 "Clearing white limestone sacbe roads back to the island fortress of Noh Peten and the towering temple roofs of ancient Tikal reconnects Classic heartlands with the northern league. Restoring southern [core|e] provinces boosts rainforest [prosperity|e], swells [gold|e] tribute, and crowns [prestige|e]."
 oe_msn_may_07_peten_tikal_lowlands_req_tt:0 "Own or have subjects own Noh Peten and Yax Mutal (Tikal), and own at least 24 locations."
 oe_msn_may_08_caribbean_jade_cacao_routes:0 "Caribbean Jade & Cacao Canoe Routes"
 oe_msn_may_08_caribbean_jade_cacao_routes_desc:0 "Forty-paddle cedar merchant canoes laden with Motagua jade, Soconusco cacao, and coastal sea-salt link Ekab's coral reefs from Honduras to Xicallanco. Commanding Caribbean [trade|e] multiplies port [market|e] wealth, fills treasury [gold|e], and projects reef [maritime_presence|e]."
 oe_msn_may_08_caribbean_jade_cacao_routes_req_tt:0 "Own or have subjects own Ekab plus Chactemal or Xicallanco, reach the Age of Discovery, earn 28 monthly trade and tax income, and build a Wharf or Trading Hub (or hold 4 ports)."
 oe_msn_may_09_cenote_terrace_agronomy:0 "Cenote & Terrace Agronomy"
 oe_msn_may_09_cenote_terrace_agronomy_desc:0 "Plastered chultun cisterns, raised bajo wetland fields, and forest-garden agroforestry defeat seasonal drought across the limestone shelf. Expanding hydraulic [buildings|e] elevates provincial [development|e], secures peasant [estate_satisfaction|e], and ensures abundant [prosperity|e]."
 oe_msn_may_09_cenote_terrace_agronomy_req_tt:0 "Own or have subjects own Mayapan or Noh Peten, reach the Age of Renaissance, and build a Granary or Aqueduct System (or reach 55% Peasants satisfaction)."
 oe_msn_may_10_venus_almanac_observatories:0 "Venus Almanacs & Star Observatories"
 oe_msn_may_10_venus_almanac_observatories_desc:0 "Atop circular Caracol towers, astronomer-priests calculate Venus cycles, lunar eclipses, and zero-based vigesimal tables with astonishing precision. Endowing observatory [buildings|e] lifts [literacy|e], enriches [cultural_tradition|e], and guards sacred bark-paper [advances|e]."
 oe_msn_may_10_venus_almanac_observatories_req_tt:0 "Own or have subjects own Mayapan, hold 260 Gold, and build a Temple or Library (or reach 16 Development in our capital)."
 oe_msn_may_11_mayan_medical_renaissance:0 "Botanical Medicine & Printed Almanacs"
 oe_msn_may_11_mayan_medical_renaissance_desc:0 "Refusing to let foreign plagues or bonfires erase our books, Mayan herbal clinics and bilingual presses preserve the Chilam Balam alongside new botanical pharmacology. Merging medical [buildings|e] with printed [institutions|e] protects [manpower|e] and multiplies national [literacy|e]."
 oe_msn_may_11_mayan_medical_renaissance_req_tt:0 "Have 15 Stability, reach the Age of Reformation, embrace Printing Press or New World (or 20 Stability), and build a Hospital or Printing Press Shop (or reach 20 Development in our capital)."
 oe_msn_may_12_second_mayan_golden_age:0 "The Second Mayan Golden Age"
 oe_msn_may_12_second_mayan_golden_age_desc:0 "Carved stelae of a new Baktun proclaim the Second Mayan Golden Age, as our limestone cities stand sovereign across the Caribbean as a world [great_power|e]. Flourishing [prosperity|e], unbroken [cultural_tradition|e], and sovereign [prestige|e] crown the eternal League."
 oe_msn_may_12_second_mayan_golden_age_req_tt:0 "Own or have subjects own Mayapan, Chichen Itza, and Noh Peten, have 18 Stability, reach the Age of Absolutism, reach 24 Development in our capital, and become a Great Power or earn 65 monthly trade and tax income."
