 oe_msn_mal_destiny:0 "#bold #color_yellow Mali & Songhai: Golden Empire of the Niger#!#!"
 oe_msn_mal_destiny_DESCRIPTION:0 "From the Gold of Bambuk and Sankore University to the Niger River Fleet and West African Gunpowder Hegemony"
 oe_msn_mal_destiny_CRITERIA_DESCRIPTION:0 "Secure the Bambuk goldfields, drill armored Sofa cavalry and Askia administration, unite Djenne, Timbuktu, Gao, and the Saharan salt routes, and crown a modern West African gunpowder empire."
 oe_msn_mal_destiny_BUTTON_TOOLTIP:0 "Embark on the Mali-Songhai Destiny"
 oe_msn_mal_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Mali and Songhai: harness Bambuk and Bure gold, field Sofa armored cavalry and Sahelian gunpowder regiments, master the Niger River bend from Djenne to Timbuktu, Gao, and Taghaza, and illuminate the world through Sankore University and trans-Saharan commerce."
 oe_msn_mal_01_gold_of_bambuk:0 "Gold of Bambuk & the Royal Hearth"
 oe_msn_mal_01_gold_of_bambuk_desc:0 "Anchor royal rule over Niani or Gao and secure alluvial goldfields to finance the rising Sahelian empire."
 oe_msn_mal_01_gold_of_bambuk_req_tt:0 "Own Niani or Gao, control Kayes, Siguiri, or Gao, and have at least 5 Stability."
 oe_msn_mal_02_sofa_cavalry_corps:0 "Raise the Sofa Armored Cavalry Corps"
 oe_msn_mal_02_sofa_cavalry_corps_desc:0 "Equip elite imperial horsemen with quilted armor, chainmail, and swift Sahelian chargers to awe frontier rivals."
 oe_msn_mal_02_sofa_cavalry_corps_req_tt:0 "Hold at least 180 Gold and have at least 10 Stability."
 oe_msn_mal_03_askia_imperial_cabinet:0 "Askia Ministries & Standard Weights"
 oe_msn_mal_03_askia_imperial_cabinet_desc:0 "Replace loose tributary fealty with salaried imperial inspectors, provincial courts, and standardized gold weights."
 oe_msn_mal_03_askia_imperial_cabinet_req_tt:0 "Have at least 12 Stability in the Age of Renaissance or later."
 oe_msn_mal_04_sahel_gunpowder_army:0 "Sahelian Gunpowder Vanguard"
 oe_msn_mal_04_sahel_gunpowder_army_desc:0 "Fuse domestic powder mills, imported matchlocks, and Sofa heavy cavalry to outmatch every trans-Saharan foe."
 oe_msn_mal_04_sahel_gunpowder_army_req_tt:0 "Own Timbuktu or Gao with at least 15 Stability in the Age of Reformation or later."
 oe_msn_mal_05_djenne_inland_delta:0 "Djenne & the Fertile Inland Delta"
 oe_msn_mal_05_djenne_inland_delta_desc:0 "Bring the great mud-brick commercial metropolis of Djenne and the fertile granaries of Segou under direct imperial rule."
 oe_msn_mal_05_djenne_inland_delta_req_tt:0 "Own Djenne and Segou."
 oe_msn_mal_06_timbuktu_gao_axis:0 "Twin Jewels: Timbuktu & Gao"
 oe_msn_mal_06_timbuktu_gao_axis_desc:0 "Unite the scholarly desert port of Timbuktu with the eastern imperial seat of Gao to master the entire Niger bend."
 oe_msn_mal_06_timbuktu_gao_axis_req_tt:0 "Own Timbuktu and Gao."
 oe_msn_mal_07_taghaza_salt_caravans:0 "Taghaza Salt Pans & Oasis Gates"
 oe_msn_mal_07_taghaza_salt_caravans_desc:0 "Seize the northern desert salt termini of Walata or Taghaza so every ounce of Saharan rock salt pays crown customs."
 oe_msn_mal_07_taghaza_salt_caravans_req_tt:0 "Own Walata or Taghaza and control at least 40 Locations."
 oe_msn_mal_08_niger_river_fleet:0 "Master of the Niger River Fleet"
 oe_msn_mal_08_niger_river_fleet_desc:0 "Patrol the full navigable arc from Djenne through Timbuktu to Gao with royal war canoes and fortified river depots."
 oe_msn_mal_08_niger_river_fleet_req_tt:0 "Own Timbuktu, Gao, and Djenne in the Age of Discovery or later."
 oe_msn_mal_09_sankore_university:0 "Sankore University & Timbuktu Libraries"
 oe_msn_mal_09_sankore_university_desc:0 "Patronize the scholars, astronomers, and jurists of Sankore so Timbuktu shines across Africa and the Mediterranean."
 oe_msn_mal_09_sankore_university_req_tt:0 "Own Timbuktu in the Age of Renaissance or later."
 oe_msn_mal_10_gold_standard_treasury:0 "Bullion Mint & Imperial Treasury"
