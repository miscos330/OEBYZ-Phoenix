 oe_msn_kon_11_equatorial_printing_courts_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_kon_12_central_west_african_renaissance:0 "Central-West African Renaissance"
 oe_msn_kon_12_central_west_african_renaissance_desc:0 "Ruling forty-five thriving provinces free from foreign bondage crowns the sovereign Central-West African Renaissance."
 oe_msn_kon_12_central_west_african_renaissance_req_tt:0 "Control at least 45 Locations with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_iro_destiny:0 "#bold #color_yellow Haudenosaunee: Sovereign Longhouse of Turtle Island#!#!"
