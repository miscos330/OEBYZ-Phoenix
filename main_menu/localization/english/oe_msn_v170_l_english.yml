 oe_msn_kon_06_atlantic_river_ports:0 "Sovereign Atlantic River Gateways"
 oe_msn_kon_06_atlantic_river_ports_desc:0 "Control key Atlantic estuaries—Soyo, Loango, Eko, or Warri—so all maritime trade answers to our customs commissioners."
