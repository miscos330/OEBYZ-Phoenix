 oe_msn_kon_02_bronze_wall_defenses_desc:0 "Expand concentric city ramparts, watchtowers, and fortified provincial capitals to deter raiders and rivals alike."
 oe_msn_kon_02_bronze_wall_defenses_req_tt:0 "Hold at least 180 Gold and have at least 10 Stability."
 oe_msn_kon_03_royal_flintlock_guards:0 "Royal Flintlock Guards & Arsenals"
 oe_msn_kon_03_royal_flintlock_guards_desc:0 "Form standing royal musket regiments supported by domestic ironworks so crown armies rival overseas expeditions."
 oe_msn_kon_03_royal_flintlock_guards_req_tt:0 "Have at least 12 Stability in the Age of Discovery or later."
 oe_msn_kon_04_anti_slave_trade_edict:0 "The Royal Anti-Slave Trade Edict"
 oe_msn_kon_04_anti_slave_trade_edict_desc:0 "Enforce royal inspection of every departing ship, outlawing predatory human trafficking and defending every subject's liberty."
 oe_msn_kon_04_anti_slave_trade_edict_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_kon_05_congo_niger_heartland:0 "Consolidate the Rainforest Heartland"
 oe_msn_kon_05_congo_niger_heartland_desc:0 "Unite core royal provinces—Mbanza-Kongo & Mbata, Benin & Ughoton, or Oyo-Ile & Ife—under harmonious crown administration."
