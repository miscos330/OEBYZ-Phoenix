l_english:
 oe_noble_household_retinue: "Household Retinues"
 oe_noble_household_retinue_desc: "A great house is known by the deeds of its ancestors and the armed retainers who gather beneath its banner. Let these households maintain mounted companions, guarding their patrons in peace and riding beneath the Emperor's standard in war. Their lances shall uphold #Y the honor of their house#! and strengthen the battle line of the Romans."
 oe_noble_imperial_marriages: "Kinship with the Purple"
 oe_noble_imperial_marriages_desc: "The splendor of the purple reaches beyond the palace walls. Marriage to the imperial family brings the great houses into the Emperor's kinship and secures them a place in the conduct of court affairs. Let #Y the bonds of marriage#! bind the magnates to the throne and ease the passage of imperial business."
 oe_noble_court_dignities: "Dignities of the Imperial Court"
 oe_noble_court_dignities_desc: "Within the Roman court, a ceremonial robe, a dignity and a place in procession proclaim the honor bestowed by the Emperor. Let the magnates take pride in observing its ceremonies and adorning its halls, so that foreign visitors may behold the majesty of the Empire. #Y Honor proceeds from the Emperor#!, and those who receive it shall add to Rome's splendor."
 oe_noble_family_monasteries: "Patronage of Family Monasteries"
 oe_noble_family_monasteries_desc: "The lamps of a monastery burn before its holy images and preserve the memory of its benefactors. Recognize the protection extended by great houses to the foundations they support, where churches may be repaired, monks sustained and ancestors laid to rest. Thus #Y family memory and the prayers of the Church#! are joined, and the cloister is sustained by its patrons."
 oe_noble_classical_patronage: "Patronage of Classical Learning"
 oe_noble_classical_patronage_desc: "A Roman house should be measured by more than its estates and arms. Let the nobility endow schools in their family name, receive men of letters and commission copies of ancient works, giving rhetoric, poetry and painting a home. The magnates shall adorn their reputation with #Y learning and refinement#!, sharing the expense of sustaining these talents with the Empire."
 oe_noble_frontier_fortresses: "Custody of Frontier Fortresses"
 oe_noble_frontier_fortresses_desc: "The fortresses above the passes and river crossings keep their silent watch over imperial lands. Entrust their repair, provisions and daily upkeep to local magnates, recognizing their standing in return for reliable support. #Y Custody is both an honor and a duty#!: those trusted by the Emperor must keep the walls sound and the watchfires burning."
