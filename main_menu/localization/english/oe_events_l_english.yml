l_english: 
 oe_flavor_byz.1.b: "We cannot afford to offend the Church now"
 oe_flavor_byz.2.b: "Ecclesiastical power independent of imperial power"
 oe_flavor_byz.3.b: "We cannot oppose the mainstay of the Church"
 oe_flavor_byz.1.tt: "Unlocks the Patriarchate Status Law: Eastern Orthodox Church"
 oe_flavor_byz.2.tt: "Unlocks the Patriarchate Status Law: Imperial and Ecclesiastical Power"
 oe_flavor_byz.3.tt: "Unlocks the Patriarchate Status Law: Enlightened Church"
 oe_flavor_byz.201.t: "The Flourishing of the Byzantine Silk Industry"
 oe_flavor_byz.201.d: "Byzantine silk used high-quality mulberry silk, resulting in fabrics that were fine, tough, and durable. Among them, 'Imperial Purple' was most famous: the purple dye extracted from the murex shellfish of the Mediterranean was extremely expensive, symbolizing imperial authority and sanctity. Edicts decreed that only members of the imperial family could wear purple silk. In the past, Byzantine silk was often given as diplomatic gifts to foreign monarchs or churches to solidify alliances. Charlemagne's coronation, for instance, involved receiving Byzantine purple silk. In the transit trade of the Mediterranean, precious Byzantine silk was once a major commodity. The empire's flourishing silk industry took a sharp downturn after the Crusaders sacked Constantinople in 1204. Now, with the recovery of Asia Minor, we finally have the opportunity to restore the glory of the silk industry."
 oe_flavor_byz.201.a: "Develop our advantageous industry"
 oe_flavor_byz.201.tt: "We will gain a permanent location modifier in Constantinople."
 oe_byz_system.4.t: "Rebuilding the Eastern Roman Bureaucratic System"
 oe_byz_system.4.d: "The Eastern Roman bureaucratic system was a strict hierarchical system within the Eastern Roman Empire. It originated from the Roman Empire but underwent significant development and refinement during the Eastern Roman period. The purpose of this official rank system was to manage and control the empire's administrative, military, and judicial affairs, ensuring the empire's stability and governance. The core of the Eastern Roman official rank system was granting specific powers and responsibilities to officials of different levels. These positions were appointed by the Emperor, and officials were divided into different ranks based on their status and ability. This hierarchical system was widely applied in the government institutions and military of the Eastern Roman Empire."
 oe_byz_system.4.a: "Restore Order!"
 oe_flavor_byz.5.tt: "Unlocks Law: Pronoia System"
 oe_flavor_byz.5.b: "If it works, it's fine"
 oe_flavor_byz.6.tt: "Unlocks Law: Reformed Pronoia System"
 oe_flavor_byz.6.b: "The current system is already good enough"
 oe_flavor_byz.7.t: "Rebuilding the Central Army"
 oe_flavor_byz.7.d: "After seizing Asia Minor, this important recruitment ground, we will begin to reduce dependence on foreign mercenaries and re-establish a central army to ensure the state's survival." #摆脱 translated to reduce
 oe_flavor_byz.7.a: "Enlist soldiers"
 oe_flavor_byz.202.t: "Restoring Hagia Sophia"
 oe_flavor_byz.202.d: "Hagia Sophia, our proudest masterpiece, has now fallen into disrepair. The Patriarch of Constantinople has proposed undertaking a massive restoration project to return Hagia Sophia to its full glory."
 oe_flavor_byz.202.a: "The cathedral represents the eternal empire"
 oe_flavor_byz.202.b: "The eternal empire represents the cathedral"
 oe_stopev: "This original event has been disabled"
 oe_byz_kocaeli_greek: "We will force the Turks on the Nicaean coast to convert!"
 flavor_byz.3.desc: "Western Anatolia was ruled by us for over a thousand years, populated by loyal and reliable Greeks. Although recently, due to the Turkish invasion, some Greeks were forced to wear turbans or became accomplices of the Turks. But now that the imperial army has re-established control over the Nicaean coast, it is time for our Greek brethren to throw all symbols of Turkish rule into the fire. As for the remaining Turks, they either kneel or die."
 oe_flavor_byz.301.t: "Byzantine New Year"
 oe_flavor_byz.301.d: "The Byzantine New Year followed the ancient Roman tradition of the 'fiscal year' start, a system established by Constantine the Great for taxation and administrative dating. September 1 marked the beginning of the administrative and agricultural cycle. With the Christianization of the Eastern Roman Empire, this date acquired religious significance. From 462 AD, September 1 was officially set as the start of the church liturgical year, symbolizing 'the perfect order created by God'. According to Byzantine tradition, September 1 was considered the day the world was created. Until the 18th century, Orthodox regions still used this calendar to reckon years."
 oe_flavor_byz.301.a: "Universal Celebration"
 oe_flavor_byz.10000.t: "My God"
 oe_flavor_byz.10000.d: "How did you"
 oe_flavor_byz.10000.a: "find this place?"
 oe_flavor_byz.400.t: "Sicily Descends into Chaos"
 oe_flavor_byz.400.d: "Federico III was a strong and long-reigning monarch; his death left a large power vacuum. His heir, Pietro II, was sickly and lacked his father's prestige and ability, unable to effectively control the powerful domestic aristocracy. Power quickly fell into the hands of an oligarchic group composed of several major families (the Chiaramonte, Ventimiglia, Peralta families, etc.)." #巨大的 to large
 oe_flavor_byz.400.a: "Let's see what role the mercenaries in Athens still have to play"
 oe_flavor_byz.401.t: "Neapolitan Succession Crisis"
 oe_flavor_byz.401.d: "Robert the Wise left no universally accepted heir. The controversial succession of [GetCountry('NAP').GetGovernment.GetRuler.GetName] sparked ambitions among countless Angevin relatives. Without a doubt, Naples will soon be mired in the quagmire of a succession war, unable to look east." #争夺 to ambitions
 oe_flavor_byz.401.a: "Notify the Prince of Achaea"
 oe_flavor_byz.402.t: "March on Attica"
 oe_flavor_byz.402.d: "Athens is the intellectual center of Greek civilization. We will never miss any opportunity to reclaim it. With the Kingdom of Sicily plunged into chaos due to the succession crisis, the Catalan mercenaries of the Duchy of Athens have lost their patron. Our chance to clear out these scum has arrived." #陷入混乱 to plunged into chaos
 oe_flavor_byz.402.a: "Settle the Score"
 oe_flavor_byz.402.b: "Dušan and Venice are our arch-enemies; we cannot take the risk."
 flavor_byz.19.b: "Act immediately"
 oe_flavor_byz.500.t: "The Emperor is Gravely Ill!"
 oe_flavor_byz.500.d: "A sudden stroke has struck down our Emperor, [GetCountry('BYZ').GetGovernment.GetRuler.GetName]. He now lies bedridden, barely conscious. Physicians and clergy attend him day and night; dignitaries of the court and church pray constantly for his health. But his condition shows no sign of improvement; we can only place our hopes in God."
 oe_flavor_byz.500.a: "The entire empire holds its breath"
 oe_flavor_byz.501.t: "The Will"
 oe_flavor_byz.501.d: "The Emperor has been bedridden for two full weeks. This afternoon, his spirits suddenly rallied. His previously delirious muttering turned into clear commands. The guards immediately summoned [GetCountry('BBY').GetGovernment.GetRuler.GetName], [GetCountry('BAP').GetGovernment.GetRuler.GetName], and other dignitaries of the empire to enter the Emperor's chamber one by one. Facing his old friend, the Emperor clearly expressed his decision:"
 oe_flavor_byz.501.a: "The Emperor promises [GetCountry('BBY').GetGovernment.GetRuler.GetName] the regency of the empire"
 oe_flavor_byz.501.b: "The Emperor demands [GetCountry('BBY').GetGovernment.GetRuler.GetName] submit to the center"
 oe_flavor_byz.502.t: "The Final Hour"
 oe_flavor_byz.502.d: "On June 15, 1341 AD, the Byzantine Emperor [GetCharacter('byz_andronikos_iii_palaiologos').GetName] passed away peacefully in the palace of Constantinople. His death marked the end of the Andronikos III era, when imperial order had been somewhat restored. A new era began. All eyes turned to Constantinople. John V was only nine years old. The struggle for regency power would be the empire's next focus. A regency council, composed of Empress Dowager Anna, Patriarch John XIV Kalekas, and Grand Duke Alexios Apokaukos, was formed to prevent the powerful [GetCountry('BBY').GetGovernment.GetRuler.GetName] from becoming regent."
 oe_flavor_byz.502.a: "No time to mourn for the departed..."
 oe_flavor_byz.503.t: "The Regency Council Backs Down"
 oe_flavor_byz.503.d: "Despite their aversion to Kantakouzenos, the regency council had no other viable candidates. They ultimately made a wise compromise. After reaching an agreement, Kantakouzenos was recognized as John V's guardian and the empire's regent. Whispers in the capital's streets and alleys began circulating whether this was the start of another new Byzantine dynasty."
 oe_flavor_byz.503.a: "I, Kantakouzenos, do hereby swear..."
 oe_flavor_byz.504.t: "Kantakouzenos Surrenders Command"
 oe_flavor_byz.504.d: "The regency has consolidated its position and demands that Kantakouzenos surrender his imperial command. He accepts to avoid civil war, retaining his family estates, household troops and noble status."
 oe_flavor_byz.504.a: "Long live the legitimate line"
 oe_flavor_byz.505.t: "The Civil War of the Two Johns"
 oe_flavor_byz.505.d: "While Kantakouzenos was attending to military affairs in Thrace, the regency council purged the Kantakouzenist faction in the capital. Mutual distrust thus reached its peak; any negotiations ended in failure. In September, the regency council formally declared Kantakouzenos a #bold #R public enemy of the state#!#!. Kantakouzenos had no choice but to respond by starting a civil war. On October 21, he was proclaimed emperor by his own army in Didymoteicho, Thrace, taking the name John VI."
 oe_flavor_byz.505.a: "He who has the strongest army is Basileus"
 oe_flavor_byz.301.b: "Don't bother me"
 oe_flavor_byz.301_b_tt: "You will no longer receive New Year events, but the effects will still trigger."
 rome_reconquista.200.t: "Recovering the Empire's Ancestral Lands"
 rome_reconquista.200.d: "The last large-scale Eastern Roman military campaign in Italy was almost during the time of Basil II. Afterwards, as the empire declined from its peak, Norman adventurers from the north brutally wrested Southern Italy from the empire. During the empire's absence from Italy, the Latin heretics usurped Rome, pompously directing the Christian world of the West. The northern Italian city-states gradually forgot the era of Roman rule, leaving only the lofty aqueducts as a mark that the empire had once been there." #卑鄙ly to brutally
 rome_reconquista.200.a: "March on Italy"
 rome_reconquista.201.t: "Recovering the Empire's Ancestral Lands"
 rome_reconquista.201.d: "Since the Second Punic War, Iberia was incorporated under imperial rule. The Romans were the original builders of Iberia, and it was one of the first provinces to begin the Romanization process. Even after generations of invaders—Visigoths, Berbers, Andalusians—ruled the peninsula, transforming it beyond the familiar form of classical times, destiny still guides us back to this glorious land to fulfill the sacred mission of Rome's return."
 rome_reconquista.201.a: "March on Iberia"
 rome_reconquista.202.t: "Recovering the Empire's Ancestral Lands"
 rome_reconquista.202.d: "After Carthage fell in flames and salt was sown around its ruins, North Africa had no opponent worth a serious fight, only endless desert nomads and shameless pirates. Let us eliminate these descendants of Berbers and Arabs and end our conflict with them."
 rome_reconquista.202.a: "March on Africa"
 rome_reconquista.203.t: "Recovering the Empire's Ancestral Lands"
 rome_reconquista.203.d: "These islanders' fleets might have some skill, but against the descendants of Caesar and Claudius, they stand no chance. We will systematically dismantle the stone castles built by Norman, Saxon, or Celtic nobles and re-establish a Roman province of Britain."
 rome_reconquista.203.a: "March on Britain"
 rome_reconquista.204.t: "Recovering the Empire's Ancestral Lands"
 rome_reconquista.204.d: "This land was once part of the Roman Empire. We have a sacred duty to recover it."
 rome_reconquista.204.a: "Reclaim the Lost Lands"
 rome_reconquista.205.t: "Challenge the Shield of Christ"
 rome_reconquista.205.d: "Since the Magyars arrived in Hungary in the 9th century and converted to the Latin heresy, Hungary became the most steadfast bastion of the Latin heresy in the East, blocking invasions of the Western world by Eastern powers including the Slavs, Mongols, and our own empire. If we wish to secure our rear while advancing into the Western world, Hungary is a realm we must conquer."
 rome_reconquista.205.a: "My zeal for the northern expedition burns like mountains"
 rome_reconquista.206.t: "Burning the Fleur-de-lis"
 rome_reconquista.206.d: "The Frankish kingdom was once merely an ordinary vassal under Rome, inheriting only a fraction of the legacy by exploiting our weakness, and now sits smugly in its ridiculous castles. Clearly, it needs reminding of who its suzerain is."
 rome_reconquista.206.a: "Blades clash in a flurry of blood—who cares for fame or reward?"
 rome_reconquista.207.t: "Egyptian Slaves"
 rome_reconquista.207.d: "'Mamluk' in Arabic originally means 'slave', signifying their origin as nothing but the most base and vile military slaves. Through their treacherous deeds, they seized power in Egypt, usurping the throne and acting arbitrarily. Let us use cannons to breach the walls of Aleppo and Damascus, punishing their usurpation and insurrection."
 rome_reconquista.207.a: "Dark clouds press on the city, threatening to destroy it; sunlight glints off golden armor like fish scales."
 rome_reconquista.300.t: "Restoration of Rome"
 rome_reconquista.300.d: "#Y Rome, the Eternal City, the city we have forever longed for. Over the nearly thousand long years, we have constantly replaced the components of Rome like the Ship of Theseus, in order to survive in this cruel world amidst countless challenges from powerful enemies. Returning to Rome now, everything about us has changed beyond recognition. But beneath Trajan's Column, even the toughest veterans cannot help but shed tears.#!"
 rome_reconquista.300.a: "The origin of the Empire, back in our hands."
 rome_reconquista.301.t: "Restoration of [target_location.GetName]"
 rome_reconquista.301.d: "Time may have been long enough for the local inhabitants to completely forget the memory of the empire ever existing here, but we have never forgotten. We will master the present, and thereby master the past, and the future." #重新掌握 to master
 rome_reconquista.301.a: "Rome Returns"
 rome_reconquista.310.t: "Celebration in [target_location.GetName]"
 rome_reconquista.310.d: "Constantinople is one of the longest-ruled locations in our empire. Let us properly celebrate in Constantinople."
 rome_reconquista.310.a: "A Day of Celebration"
 oe_flavor_byz.506.t: "An Opportunity to End the Palaiologos Dynasty?"
 oe_flavor_byz.506.d: "With Kantakouzenos ascending to the position of co-emperor and beginning to wield the empire's highest power, a possibility to end the Palaiologos dynasty has emerged, and this depends entirely on Kantakouzenos's own thoughts."
 oe_flavor_byz.506.a: "We do not seek to overthrow the Palaiologos dynasty"
 oe_flavor_byz.506.b: "Dynastic change has its own destined course"
rome_reconquista.3.t: "The Dream of Reconquest Shattered"
rome_reconquista.3.d: "Years of exhausting military campaigns have worn down our patience. Throughout the Eastern Roman Empire, from the common people to the imperial court, hope for restoring the empire's former borders has faded. Instead, attention has turned to developing the remaining territories."
rome_reconquista.3.a: "Though broken spears lie buried in the sand, the iron remains undimmed..."
rome_reconquista.4.t: "Promoting the Narrative of the Restoration of Rome"
rome_reconquista.4.d: "To ensure the people willingly follow us on the journey to restore Rome, we must continually reinforce the narrative of Rome's revival through propaganda, thereby gaining their allegiance to our cause."
rome_reconquista.4.a: "The Patriarchate requires the faithful to be educated."
rome_reconquista.4.b: "Require bureaucratic institutions to educate the populace."
rome_reconquista.4.c: "It's nothing but a waste of resources."
rome_reconquista.5.t: "The republican character of the Roman Empire"
rome_reconquista.5.d: "The political structure of the Eastern Roman Empire retained numerous republican attributes from the Roman era. The Basileus, whose position was theoretically still regarded as the “first citizen,” wielded supreme authority. Yet this imperial power remained subject to the challenges posed by republican ideals: if the emperor committed errors or lost popular support, his overthrow was entirely acceptable."
rome_reconquista.5.a: "We should emphasize the traditions of the Roman state."
rome_reconquista.5.b: "We should emphasize loyalty to the emperor personally."
rome_reconquista.6.t: "Pacifist monk."
rome_reconquista.6.d: "Not everyone supports our endless wars of reconquest against Gaul, Iberia, and even Britain. A monk from Mount Athos, renowned for his pacifist and isolationist views, has sparked a social movement in our nation. People on every street corner now debate and question whether it is truly necessary to restore the ancient Roman Empire's borders."
rome_reconquista.6.a: "He is the devil incarnate on earth."
rome_reconquista.6.b: "Expel him to the Russian Patriarchate"
rome_reconquista.6.c: "Interesting..."
rome_reconquista.7.t: "Suppression of dissidents."
rome_reconquista.7.d: "Within our nation's academic circles and elite strata, criticism of the policy to revive the Roman Empire has become increasingly commonplace. There have even been repeated petitions urging the Basileus to allocate resources toward benefiting the homeland rather than waging foreign wars. Given that such discourse has grown increasingly prevalent, it is imperative that we take decisive action."
rome_reconquista.7.a: "The validity of reviving Rome is beyond question."
rome_reconquista.7.b: "Let them talk."
oe_flavor_byz.1.t: "The Ottoman dream dissipates"
oe_flavor_byz.1.d: "The Dream of Osman was composed after Osman I established the principality. Through dream imagery experienced by Osman in the home of Edebali—a crescent moon piercing his chest, a giant tree shrouding the heavens, and four rivers surging forth—the epic foretold an empire spanning the Caucasus, Atlas, Taurus, and Balkan mountain ranges, along with the Tigris, Euphrates, Danube, and Nile rivers. The sheikh Edebali interpreted these visions as #R conquest of the world#! Yet under the relentless blows of the Eastern Roman Empire, Osman's dream has already dissipated."
oe_flavor_byz.1.a: "A laughable dream."
oe_flavor_byz.2.t: "Iris petals drifting down"
oe_flavor_byz.2.d: "Standing atop the walls of Paris, even the Romans—renowned for their culture—could not help but marvel at the creativity of the French people. For a thousand years after the Romans departed, they continued to cultivate this land diligently, creating magnificent cities and masterpieces of art. Let us carry on their work, ensuring this ancient and prosperous land continues to shine."
oe_flavor_byz.2.a: "Strolling along the banks of the Seine."
oe_flavor_byz.3.t: "Kingdom of Roses."
oe_flavor_byz.3.d: "Bulgaria is renowned for its roses, a tradition dating back to the 4th century BC when ancient Greeks revered the flower as sacred. The region's unique climate and soil conditions made it an ideal place for rose cultivation. This year, the flowers in the Valley of Roses continue to bloom, though the faces of those who come to admire them have changed."
oe_flavor_byz.3.a: "Roses for the Conqueror."
oe_flavor_byz.4.t: "Treasure of the Mountains."
oe_flavor_byz.4.d: "In Serbia, the shift in silver flows was the first sign of changing authority. On an ordinary afternoon, a small squad of Roman cavalry stormed into Kosovo's largest silver mine. After mere minutes of negotiation, the mine's resources became the property of the Basileus, and it began supplying silver ore to the mint in Thessaloniki."
oe_flavor_byz.4.a: "Silver must flow."
oe_flavor_byz.5.t: "Recapture Athens"
oe_flavor_byz.5.d: "The current rulers of the Duchy of Athens hail from a band of treacherous mercenaries. Sent by the Eastern Roman Emperor to conquer lands in the East, they instead engaged in nothing but plunder, pillage, and murder. When we could endure no more, they chose to rampage across Roman territories, ultimately defeating the then-Duke of Athens and seizing control of the city."
oe_flavor_byz.5.a: "Let the Catalans get lost"
oe_flavor_byz.403.t: "The Ecumenical Patriarch has passed away."
oe_flavor_byz.403.d: "Our Ecumenical Patriarch [target.GetName] has passed away. Following the solemn funeral rites, the Patriarch of Constantinople shall select a new Ecumenical Patriarch to continue presiding over the Ecumenical Patriarchate of Constantinople."
oe_flavor_byz.403.a: "Select a venerable monk from the Church of Constantinople."
oe_flavor_byz.403.b: "Select [target_character.GetName] from the Cabinet."
oe_flavor_byz.403.c: "Choose the devout monk from Mount Athos."

#=====================================
#D008_oe_fate_of_the_phoenix
#=====================================

oe_fate_of_the_phoenix.21.t: "The Eve of the Storm"
oe_fate_of_the_phoenix.21.d: "#bold As the empire falls into stagnation and weakness, more and more enemies of the empire are stirring and pressing closer, from the Balkans to Asia Minor, from land borders to coastal islands. They will seize every opportunity to tear away their share of the spoils from the empire's dwindling wealth. We must always be prepared, lest Rome falls into #R utter and irreversible ruin#!.#!"
oe_fate_of_the_phoenix.21.a: "Sheathe your sword! For all who draw the sword will die by the sword."
oe_fate_of_the_phoenix.21.tt: "Enemies of the empire will continuously harass our borders. We can increase the probability of repelling them by granting the estate privilege #Y Autonomous Militia#!. Being on friendly terms, in a truce, or completely eliminating them can prevent enemy harassment."

oe_fate_of_the_phoenix.22.t: "Powerful Nobles"
oe_fate_of_the_phoenix.22.d: "#bold The dynastic politics and aristocratic corruption of the Eastern Roman Empire have reached an unprecedented level. The emperor may not begrudge sharing power and wealth with the military elites, but the most powerful noble families have grown so strong that they can arbitrarily launch civil wars and overthrow the throne. If we cannot rein them in, the empire may soon return to internecine civil wars#!"
oe_fate_of_the_phoenix.22.a: "We must ensure the stability and supremacy of the imperial throne"
oe_fate_of_the_phoenix.22.tt: "We can choose to cooperate with the nobles or restrict their power. Noble discontent will temporarily weaken our legitimacy and military capability, while peasant discontent will harm our stability and economic capacity."

oe_fate_of_the_phoenix.23.t: "Merchants Hindered"
oe_fate_of_the_phoenix.23.d: "#bold Preventing local wealth from flowing to Constantinople is not only hindered by annoying corrupt nobles, but also by bands of robbers scattered among the forests and mountains, who mainly come from bankrupt peasants, displaced soldiers, and border nomads. Due to the ongoing instability, these people have become increasingly numerous. They rob merchants, travelers, and even officials on the roads, causing us great trouble.#!"
oe_fate_of_the_phoenix.23.a: "The wounds left by endless wars"
oe_fate_of_the_phoenix.23.tt: "Robbers will severely affect the output and control of rural areas. We need to send soldiers to the countryside to stabilize the situation."
 oe_fate_of_the_phoenix.200.t: "Turkish Ghazis Raid the Border"
 oe_fate_of_the_phoenix.200.d: "Ghazis from [oe_raid_attacker.GetName] have crossed the border near [target_location.GetName], taking livestock and grain. Villagers shelter behind their walls, while the garrison asks for men to patrol the fields and roads."
 oe_fate_of_the_phoenix.200.a: "Endure the losses for now."
 oe_fate_of_the_phoenix.200.b: "Send troops to patrol."
 oe_fate_of_the_phoenix.200.c: "The garrison has repelled the raiders!"
 oe_fate_of_the_phoenix.201.t: "Serbians Raid the Border"
 oe_fate_of_the_phoenix.201.d: "Armed Serbians have crossed the border near [target_location.GetName]. Farmers appeal for protection, and the local garrison requests men to patrol the roads and fields."
 oe_fate_of_the_phoenix.201.a: "Endure the losses for now."
 oe_fate_of_the_phoenix.201.b: "Send troops to patrol."
 oe_fate_of_the_phoenix.201.c: "The garrison has repelled the raiders!"
 oe_fate_of_the_phoenix.203.t: "Pirates Raid the Coast"
 oe_fate_of_the_phoenix.203.d: "Unidentified vessels have landed raiders near [target_location.GetName], carrying off goods and the savings of fishermen. Their sails have vanished, but troops are needed to patrol the coves and coastal settlements."
 oe_fate_of_the_phoenix.203.a: "Endure the losses for now."
 oe_fate_of_the_phoenix.203.b: "Send troops to patrol."
 oe_fate_of_the_phoenix.203.c: "The garrison has repelled the raiders!"
 oe_fate_of_the_phoenix.204.t: "Bandits Run Rampant"
 oe_fate_of_the_phoenix.204.d: "Travelers near [target_location.GetName] have been robbed, and farmers fear to take their carts onto the roads. The local authorities request patrols to drive the bandits from the surrounding countryside."
 oe_fate_of_the_phoenix.204.a: "Endure the losses for now."
 oe_fate_of_the_phoenix.204.b: "Send troops to patrol."
 oe_fate_of_the_phoenix.204.c: "The garrison has defeated the bandits!"

oe_peasants_own_theme_negative_IV: "Order of Rank"
oe_peasants_own_theme_negative_IV_desc: "The military aristocracy from the great landowning class is something that our Basileus simply cannot ignore. Taxes, the army, and land are all within their grasp. If the Basileus cooperates well with the military aristocracy, they will become a powerful fighting force for the empire; if not, they will be the empire's greatest enemy."

oe_peasants_own_theme_negative_III: "Land Aristocracy at Their Zenith"
oe_peasants_own_theme_negative_III_desc: "The military aristocracy from the great landowning class is something that our Basileus simply cannot ignore. Taxes, the army, and land are all within their grasp. If the Basileus cooperates well with the military aristocracy, they will become a powerful fighting force for the empire; if not, they will be the empire's greatest enemy."

oe_peasants_own_theme_negative_II: "Land Aristocracy Dominate the Locality"
oe_peasants_own_theme_negative_II_desc: "Powerful clans possessing vast lands are on the rise, as wealthy as a nation and in command of private armies. They remain loyal to Constantinople and are willing to stand up for the empire in times of war. The good education and military competence of these nobles will help the imperial army achieve invincible victories."

oe_peasants_own_theme_negative_I: "The Rise of Land Aristocracy"
oe_peasants_own_theme_negative_I_desc: "Powerful clans possessing vast lands are on the rise, as wealthy as a nation and in command of private armies. They remain loyal to Constantinople and are willing to stand up for the empire in times of war. The good education and military competence of these nobles will help the imperial army achieve invincible victories."

oe_peasants_own_theme_I: "The Extinction of Free Peasants"
oe_peasants_own_theme_I_desc: "The once self-governing peasant communes and landowning yeomen formed the foundation of the Eastern Roman Empire's rule. However, with the implementation of the Pronoia system, local power fell largely into the hands of the military aristocracy. The status of free peasants became so extremely unequal compared to them that more and more free farmers lost their land and became dependent peasants."

oe_peasants_own_theme_II: "Free Peasants in Peril"
oe_peasants_own_theme_II_desc: "The once self-governing peasant communes and landowning yeomen formed the foundation of the Eastern Roman Empire's rule. However, with the implementation of the Pronoia system, local power fell largely into the hands of the military aristocracy. The status of free peasants became so extremely unequal compared to them that more and more free farmers lost their land and became dependent peasants."

oe_peasants_own_theme_III: "Free Peasants Are Protected"
oe_peasants_own_theme_III_desc: "The self-governing peasant communes and landowning yeomen formed the foundation of the Eastern Roman Empire's rule. They are directly protected by the empire's laws and administrative system to ensure that their land cannot be openly seized by powerful landlords. The development of the smallholder economy has promoted the growth of our country's nascent populism, making it more difficult for our country to diversify."

oe_peasants_own_theme_IV: "Land to the Tillers"

# English coverage additions, 2026-09-24.
 oe_flavor_byz.1000.t: "The Fate of the House of Osman"
 oe_flavor_byz.1000.d: "The banners of the Ottoman beylik have fallen. Deprived of their country, its former rulers and their kin have been brought into imperial territory to await the Emperor's judgment. Some would keep them in Constantinople, treating them with courtesy under close supervision and using their influence to calm their former lands. Others insist that only exile can close this chapter."
 oe_flavor_byz.1000.a: "Treat them honorably, but keep them under close watch in Constantinople."
 oe_flavor_byz.1000.b: "Expel them from the empire."
 oe_flavor_byz.1000.a.tt: "The House of Osman moves to Byzantium and settles under supervision in Constantinople. The Conversion of the House of Osman event follows in #Y three years#!."
 phoenix_nirvana.600.d.a: "Self-governing village communities and free peasants owning their land form the foundation of imperial rule. Imperial law and administration protect them directly, preventing powerful landlords from openly seizing their fields. Peasants secure in their holdings enthusiastically support the Basileus and provide the state with dependable recruits."
 phoenix_nirvana.600.d.b: "The military aristocracy of great landowners is a power the Basileus cannot ignore. Taxes, armies and estates lie in their hands. As the representative of landed interests, the Basileus can work closely with these nobles. Their education and military experience will become a sword in the empire's hand."
 oe_byz_mission.1.t: "The Southern States"
 oe_byz_mission.1.d: "Southern Greece is scattered with Latin principalities, the legacy of mercenary betrayal and the Latin Empire. Their soldiers should not be underestimated, but their resources cannot match ours. What prevents us from sweeping through the south is the support of western powers: Naples and Sicily guarantee these states' independence, while Venice and Genoa may reinforce them should war come."
 oe_byz_mission.1.historical_info: "Several major powers guarantee the southern states, but this does not necessarily mean they will enter a full war against the empire. If we attack Athens, [GetCountry('NAP').GetName], [GetCountry('SIC').GetName], [GetCountry('VEN').GetName] and [GetCountry('GEN').GetName] will organize an expeditionary force to assist it."
 oe_byz_mission.1.a: "We must not act rashly."
 oe_byz_mission.2.t: "The Conference of Rome"
 oe_byz_mission.2.d.1: "A diplomatic mission bearing the Basileus's personal authority has arrived in Rome. As relations with the Pope remain tolerable, he has agreed to host a conference to avert conflict between East and West. The talks immediately stalled. The Neapolitans and Sicilians made a show of their strength and refused to yield, while the Venetians and Genoese demanded further commercial privileges. Their price was beyond anything our envoys could promise. The conference ended in bitterness, without a formal agreement."
 oe_byz_mission.2.d.2: "A diplomatic mission bearing the Basileus's personal authority has arrived in Rome. As relations with the Pope remain tolerable, he has agreed to host a conference to avert conflict between East and West. A stiff opening soon gave way to common ground and steady progress. Naples and Sicily, burdened by succession crises, could ill afford a major war, while Venice and Genoa chiefly sought commercial advantage. In the end, several states were persuaded to abandon their guarantees of the southern principalities."
 oe_byz_mission.2.d.3: "A diplomatic mission bearing the Basileus's personal authority has arrived in Rome. As relations with the Pope remain tolerable, he has agreed to host a conference to avert conflict between East and West. The delegates met in a friendly spirit and acknowledged imperial sovereignty, allowing negotiations to advance swiftly. The conference ended in accord. Athens now stands utterly isolated, and the political order of southern Greece is about to change."
 oe_byz_mission.2.historical_info: "#Y Western powers with an opinion of us above 0 will attend the Conference of Rome and may withdraw their support through papal mediation. Those with an opinion above 50 will certainly withdraw.#!"
 oe_byz_mission.2.a: "No state agreed to end its hostility toward the empire."
 oe_byz_mission.2.a.tt: "The talks made no progress; many states did not even attend."
 oe_byz_mission.2.b: "A significant diplomatic achievement."
 oe_byz_mission.2.b.tt.1: "[GetCountry('NAP').GetName] has withdrawn its guarantee of the southern states."
 oe_byz_mission.2.b.tt.2: "[GetCountry('SIC').GetName] has withdrawn its guarantee of the southern states."
 oe_byz_mission.2.b.tt.3: "[GetCountry('GEN').GetName] has withdrawn its guarantee of the southern states."
 oe_byz_mission.2.b.tt.4: "[GetCountry('VEN').GetName] has withdrawn its guarantee of the southern states."
 oe_byz_mission.2.c: "A diplomatic triumph for the history books!"
 oe_byz_mission.2.c.tt: "All states have withdrawn their guarantees of the southern states."
 oe_byz_mission.3.t: "The Pacification of Epirus"
 oe_byz_mission.3.d: "Most of Epirus has abandoned resistance and pledged loyalty to the imperial army and the Basileus. [GetCountry('BYZ').GetGovernment.GetRuler.GetName] has rejected [GetCountry('EPI').GetGovernment.GetRuler.GetName]'s proposal to retain Epirus as a subject realm. Roman officials will instead take direct charge of its towns, supported by imperial garrisons, incorporating Epirus fully as a province of the empire."
 oe_byz_mission.3.historical_info: "After John Orsini, ruler of Epirus, died in the 1330s, his young son Nikephoros II inherited a realm troubled by conflict among its nobles. Byzantium supported sympathetic aristocrats and undermined the ruler's authority. In 1337-1338, Andronikos III personally led an army into Epirus and besieged Arta. Internal disorder and the lack of outside aid caused resistance to collapse. Arta surrendered in early 1338, and the Despotate of Epirus was incorporated into the Byzantine Empire as a province."
 oe_byz_mission.3.a: "Conquer Epirus."
 oe_byz_mission.3.b: "Secure Epirus."
 oe_byz_mission.3.c: "Integrate Epirus."
 oe_byz_mission.4.t: "The Fate of [GetCountry('EPI').GetGovernment.GetRuler.GetName]"
 oe_byz_mission.4.d: "Political turmoil has left Epirus in confusion, and its soldiers have shown little will to resist. Our advance upon Arta was therefore swift. The ruler of Epirus, [GetCountry('EPI').GetGovernment.GetRuler.GetName], is now our prisoner. We may decide the fate of the ruler and the entire family."
 oe_byz_mission.4.a: "Let them go where they please."
 oe_byz_mission.4.b: "Bring the ruler and the family to Constantinople for their protection."
 oe_byz_mission.5.t: "The Fate of the Epirote Nobility"
 oe_byz_mission.5.d: "With their capital occupied and their ruling family captured, representatives of the Epirote nobility have requested an audience with the emperor. They hope to secure a place in the new order the empire is establishing in Epirus."
 oe_byz_mission.5.a: "They will be treated like everyone else."
 oe_byz_mission.5.b: "Perhaps we should win these elites to our side."
 oe_byz_mission.6.t: "The Parthenon"
 oe_byz_mission.6.d: "The neglected Parthenon remains the most striking building on the Acropolis. Several Italian artists have offered their skills to restore this ancient temple, proposing statues of the Greek gods to recover something of its former splendor. The Church objects. The Ecumenical Patriarch has formally protested to the Basileus, insisting that the building should instead display crosses and Christian mosaics."
 oe_byz_mission.6.a: "Let us honor the culture of ancient Greece."
 oe_byz_mission.6.b: "The will of God cannot be disregarded."
