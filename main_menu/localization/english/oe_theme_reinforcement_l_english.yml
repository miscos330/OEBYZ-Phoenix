l_english:
 oe_pillars_reinforce_theme: "Reinforce a Theme"
 oe_pillars_reinforce_theme_desc: "A muster roll is of little use without soldiers to fill it. The imperial government provides recruits, while the theme supplies their equipment.\n\nSelect a directly subordinate theme with #Y fewer than 2,000 troops#! and #Y more than 50 treasury gold#!. Byzantium spends #R 1,000 manpower#! and #R 1 Authority#!; the selected theme pays #R 50 gold#! and receives #G four theme infantry units and two theme cavalry units (light infantry category) of the current age#! in its capital. Repeatable, with eligibility checked on every use."
 OE_THEME_REINFORCEMENT_MANPOWER: "Byzantium has at least #Y 1,000 manpower#!"
 OE_THEME_REINFORCEMENT_SELECT: "Choose a Theme to Reinforce"
 OE_THEME_REINFORCEMENT_NONE: "No directly subordinate theme has fewer than 2,000 troops and more than 50 gold"
