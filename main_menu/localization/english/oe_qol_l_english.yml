# NEW 2026-11-23 v19.0 Module 19.0-C: Bilingual Localization (english, 115 keys, 100% EN/ZH parity) (oe_qol_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v190_qol_mp.py; edit the generator, not this file.
 oe_qol_human_only_tt:0 "Strictly available to human players only (never forced on AI or non-opting players)."
 oe_qol_ev_1_a_tt:0 "Enables the annual #Y Court Noble Marriage Assistant#! (up to 3 unmarried adult noble or dynastic courtiers aged 18–35 per year; never alters ruler or heir marriages)."
 oe_qol_ev_1_b_tt:0 "Enables the annual #Y Court Noble Marriage Assistant#! and immediately runs one court marriage pass now (up to 3 eligible courtiers aged 18–35)."
 oe_qol_ev_1_c_tt:0 "Turns OFF the #Y Court Noble Marriage Assistant#! cleanly; no automatic marriages will occur."
 oe_qol_ev_2_a_tt:0 "Enables #Y Elite Heir & Balanced Dynastic Tutoring#!: automatically assigns In-Depth Education to your Heir when treasury >= 250 and Balanced Education to other royal children aged 3–15, running an immediate pass now."
 oe_qol_ev_2_b_tt:0 "Enables #Y Adaptive Aptitude & Statecraft Tutoring#!: automatically selects Administrative, Diplomatic, or Military education for royal children aged 3–15 based on emerging aptitude and realm status, running an immediate pass now."
 oe_qol_ev_2_c_tt:0 "Turns OFF the #Y Royal Heir & Prince Education Assistant#! cleanly; no automatic education changes will occur."
 oe_qol_ev_5_a_tt:0 "Opts your country into the #Y MP Fair-Play & Late-Game Anti-Snowball Compact#! (smooths war exhaustion recovery, reinforces truce stability, curbs mercenary bidding, and applies progressive soft-caps above 80 and 160 locations)."
 oe_qol_ev_5_b_tt:0 "Opts your country into the #Y Fair-Play Compact#! and, if in a multiplayer session, sends a non-binding opt-in invitation to other connected human players once per year."
 oe_qol_ev_5_c_tt:0 "Opts OUT of the #Y Fair-Play & Anti-Snowball Compact#! and removes all compact modifiers immediately."
 oe_qol_dec_toggle_court_marriage_aid.title:0 "[QoL] Court Noble Marriage Assistant (Opt-In)"
 oe_qol_dec_toggle_court_marriage_aid.desc:0 "Open the optional Court Noble Marriage Assistant panel. When enabled, heralds periodically arrange marriages for unmarried adult noble and dynastic courtiers aged 18 to 35 (up to 3 per year), pairing compatible existing courtiers first and never interfering with your ruler or heir. 100% opt-in and off by default."
 oe_qol_dec_toggle_court_marriage_aid.a:0 "Configure Court Marriage Assistant"
 oe_qol_dec_toggle_court_marriage_aid_tt:0 "Opens the #Y Court Noble Marriage Assistant#! panel (Enable passive annual aid, run an immediate marriage pass, or Disable cleanly)."
 oe_qol_dec_toggle_heir_tutor_aid.title:0 "[QoL] Royal Heir & Prince Education Assistant (Opt-In)"
 oe_qol_dec_toggle_heir_tutor_aid.desc:0 "Open the optional Royal Heir & Prince Education Assistant panel. When enabled, court preceptors automatically assign optimal child education tracks whenever your heir or dynastic children aged 3 to 15 lack an assigned education. Choose between Elite/Balanced tutoring or Adaptive Statecraft tutoring, or turn off anytime."
 oe_qol_dec_toggle_heir_tutor_aid.a:0 "Configure Royal Education Assistant"
 oe_qol_dec_toggle_heir_tutor_aid_tt:0 "Opens the #Y Royal Heir & Prince Education Assistant#! panel (Enable Elite/Balanced mode, Adaptive Statecraft mode, or Disable cleanly)."
 oe_qol_dec_batch_rgo_investment.title:0 "[Macro] One-Click Batch RGO & Granary Investment"
 oe_qol_dec_batch_rgo_investment.desc:0 "Spend treasury funds proportionally (60 gold per site, up to 5 highest-profit non-maxed core RGO locations) to expand raw-material workforce capacity by +1 and lift local prosperity, while also queueing paid Granaries in eligible urban towns or cities among those sites that lack one. Subject to a 5-year cycle."
 oe_qol_dec_batch_rgo_investment.a:0 "Execute Batch RGO & Granary Macro"
 oe_qol_dec_batch_rgo_investment_tt:0 "Proportionally spends #Y 60 gold#! per eligible location (up to 5 highest-profit core RGO sites) to expand max RGO workers (+1), raise prosperity, queue needed urban Granaries, and start a 5-year #Y Imperial RGO & Granary Survey Cycle#!."
 oe_qol_dec_batch_trunk_road.title:0 "[Macro] One-Click Regional Trunk Road Connector"
 oe_qol_dec_batch_trunk_road.desc:0 "Pay a 60-gold royal survey charter plus standard paid road construction to immediately commission your highest unlocked road tier (including Imperial Roads or Railroads) linking up to 3 major high-population regional hubs, towns, or market centers to your capital and high-control road grid. Complements the continuous Imperial Road Office with a 5-year on-demand sprint."
 oe_qol_dec_batch_trunk_road.a:0 "Commission Regional Trunk Roads"
 oe_qol_dec_batch_trunk_road_tt:0 "Spends #Y 60 gold#! survey fee plus standard road costs to queue your strongest unlocked road toward up to #Y 3 major regional hubs#!, and grants a 5-year #Y Regional Trunk Road Charter Cycle#!."
 oe_qol_dec_mp_balance_compact.title:0 "[MP/Balance] Fair-Play & Late-Game Anti-Snowball Compact"
 oe_qol_dec_mp_balance_compact.desc:0 "Open the opt-in Multiplayer Fair-Play & Late-Game Anti-Snowball Compact panel. Designed for competitive multiplayer lobbies (and optional late-game self-challenge), it smooths post-war exhaustion recovery, reinforces truce stability, curbs runaway mercenary bidding, and applies progressive soft-cap dampening above 80 and 160 locations. Never forced on singleplayer."
 oe_qol_dec_mp_balance_compact.a:0 "Configure Fair-Play Balance Compact"
 oe_qol_dec_mp_balance_compact_tt:0 "Opens the #Y Fair-Play & Anti-Snowball Compact#! panel (Enact for yourself, invite fellow MP players to opt in, or withdraw cleanly)."
 oe_qol.1.title:0 "Court Noble Marriage Registry"
 oe_qol.1.desc:0 "Senior court heralds present the royal genealogy ledger. In sprawling late-game empires, junior branches of noble houses and dynastic cousins frequently remain unwed for decades simply because no sovereign has time to match every courtier manually. Enabling this purely optional assistant instructs heralds to quietly arrange up to three marriages per year for unmarried adult noble and dynastic courtiers aged 18 to 35—pairing compatible courtiers in your court first, and never touching your ruler or heir."
 oe_qol.1.a:0 "Enable Annual Court Marriage Assistant"
 oe_qol.1.b:0 "Enable Assistant & Arrange Marriages Immediately"
 oe_qol.1.c:0 "Disable Court Marriage Assistant (Manual Only)"
 oe_qol.2.title:0 "Royal Preceptors & Heir Education Bureau"
 oe_qol.2.desc:0 "The Chief Preceptor of the Palace School awaits standing instructions for the dynasty's rising generation. Rather than manually assigning tutors each time a prince, princess, or royal heir reaches school age, you may authorize the bureau to assign child education automatically each year—either investing in In-Depth Royal Tutoring for your heir with Balanced schooling for junior princes, or dynamically matching Administrative, Diplomatic, and Military tracks to each child's emerging aptitude and the realm's needs."
 oe_qol.2.a:0 "Enable Elite Heir & Balanced Dynastic Tutoring"
 oe_qol.2.b:0 "Enable Adaptive Aptitude & Statecraft Tutoring"
 oe_qol.2.c:0 "Disable Royal Education Assistant (Manual Only)"
 oe_qol.3.title:0 "Imperial RGO & Granary Survey Ledger"
 oe_qol.3.desc:0 "Treasury commissioners return from inspecting the core mining valleys, timberlands, and fertile river plains funded by your batch RGO macro. Consolidating multiple regional investments under a single royal warrant has saved months of provincial paperwork and brought new labor shifts online simultaneously. How should the Comptroller General direct the next phase of rural-urban provisioning?"
 oe_qol.3.a:0 "Standardize Provincial Granary Reserves"
 oe_qol.3.b:0 "Grant Royal Extraction Charter Incentives"
 oe_qol.4.title:0 "Dispatch from the Imperial Cartography Hall"
 oe_qol.4.desc:0 "Across the vaulted drafting tables of the Imperial Cartography Hall, royal surveyors ink fresh arterial highways linking your capital network to major regional towns and market entrepots. Rapid trunk commissioning breaks provincial isolation without forcing every rural track onto the treasury ledger at once. Shall we institutionalize a salaried Trunk Road Survey Corps or charter commercial relay tolls along the new arteries?"
 oe_qol.4.a:0 "Establish the Imperial Trunk Survey Corps"
 oe_qol.4.b:0 "Charter Inter-Market Relay Tolls"
 oe_qol.5.title:0 "Fair-Play & Late-Game Anti-Snowball Compact"
 oe_qol.5.desc:0 "Envoys and competitive campaign arbiters present an optional Fair-Play Compact tailored for multiplayer lobbies and balanced late-game rivalries. Signatories adopt smoother post-war exhaustion recovery, stronger truce stability deterrence, and gentle progressive mercenary and court soft-caps once a realm expands past 80 and 160 locations—keeping late-game coalitions and great-power wars exciting without ever forcing singleplayer campaigns."
 oe_qol.5.a:0 "Sign the Fair-Play & Anti-Snowball Compact"
 oe_qol.5.b:0 "Sign Compact & Offer Opt-In to Fellow MP Players"
 oe_qol.5.c:0 "Decline / Withdraw (Standard Uncapped Rules)"
 oe_qol.6.title:0 "Charter of Late-Game Administrative Efficiency"
 oe_qol.6.desc:0 "As your realm matures into a continental power spanning dozens of provinces, parchment dispatches and duplicated local edicts threaten to bog down the crown's ministers. Chief archivists inside the Imperial Cartography Hall propose either a sweeping centralization of Chancery Registers to maximize cabinet precision, or empowering chartered Provincial Intendants to absorb routine governance across distant regions."
 oe_qol.6.a:0 "Centralize Imperial Chancery Registers"
 oe_qol.6.b:0 "Empower Chartered Provincial Intendants"
 oe_qol.7.title:0 "The Great Imperial Urban Census"
 oe_qol.7.desc:0 "Thriving cities and manufacturing towns have outgrown medieval parish rolls, leaving both tax assessors and municipal planners guessing at true urban populations. A realm-wide urban census offers two enduring dividends: codifying transparent hearth and cadastre registers to raise fiscal yield and civic order, or pairing the census with municipal literacy schools and guild apprenticeship rolls."
 oe_qol.7.a:0 "Codify Cadastre & Urban Hearth Registers"
 oe_qol.7.b:0 "Fund Municipal Literacy & Guild Rolls"
 oe_qol.8.title:0 "Continental Postal & Courier Exchange"
 oe_qol.8.desc:0 "With trunk highways now lacing major provinces together, postmasters propose integrating isolated royal messengers into a scheduled Continental Postal Exchange. Operating timed state relay post-houses will knit frontier garrisons and foreign embassies tightly to the capital, while opening commercial packet carriages to bankers and merchants will turn every post-road into an artery of market intelligence."
 oe_qol.8.a:0 "Charter Timed State Relay Post-Houses"
 oe_qol.8.b:0 "Open Public Commercial Packet Services"
 oe_qol.9.title:0 "Sovereign Debt & Treasury Rebalance"
 oe_qol.9.desc:0 "Late-game wars, grand fortifications, and global commerce test even the wealthiest treasury's credit architecture. Royal financiers lay two modernization bills before the throne: establishing a transparent Sovereign Sinking Fund backed by customs receipts to cut interest rates and tame inflation, or launching quarterly Customs & Court Audits to maximize liquid cash flow across your empire."
 oe_qol.9.a:0 "Establish the Consolidated Sovereign Sinking Fund"
 oe_qol.9.b:0 "Enforce Quarterly Customs & Treasury Audits"
 oe_qol.10.title:0 "Concert Armistice & Balance-of-Power Protocols"
 oe_qol.10.desc:0 "Generations of continent-spanning conflicts have taught chancelleries that endless total war exhausts victors and vanquished alike. Seasoned diplomats gather to codify Concert Armistice Protocols: either ratifying formal demobilization and truce guarantees that soothe war exhaustion and penalize treaty-breakers, or backing multilateral mediation with steady armed deterrence and expanded diplomatic capacity."
 oe_qol.10.a:0 "Ratify Concert Armistice & Truce Guarantees"
 oe_qol.10.b:0 "Uphold Armed Deterrence & Diplomatic Mediation"
 STATIC_MODIFIER_NAME_oe_qol_mod_marriage_aid_active:0 "Court Noble Marriage Registry"
 STATIC_MODIFIER_DESC_oe_qol_mod_marriage_aid_active:0 "Heralds maintain an opt-in registry pairing unmarried adult noble and dynastic courtiers aged 18 to 35 each year so great houses never quietly die out."
 STATIC_MODIFIER_NAME_oe_qol_mod_tutor_aid_active:0 "Royal Preceptors & Tutor Bureau"
 STATIC_MODIFIER_DESC_oe_qol_mod_tutor_aid_active:0 "Court preceptors automatically assign your chosen education track to royal heirs and dynastic children as soon as they reach tutoring age."
 STATIC_MODIFIER_NAME_oe_qol_mod_rgo_macro_cd:0 "Imperial RGO & Granary Survey Cycle"
 STATIC_MODIFIER_DESC_oe_qol_mod_rgo_macro_cd:0 "Treasury surveyors have just dispatched a five-province raw-goods expansion and granary grant across your highest-yield core territories."
 STATIC_MODIFIER_NAME_oe_qol_mod_trunk_road_cd:0 "Regional Trunk Road Charter Cycle"
 STATIC_MODIFIER_DESC_oe_qol_mod_trunk_road_cd:0 "Royal road engineers have commissioned trunk highway links from your capital network toward major regional population and market hubs."
 STATIC_MODIFIER_NAME_oe_qol_mod_mp_fairplay_compact:0 "MP Fair-Play & Balance Compact"
 STATIC_MODIFIER_DESC_oe_qol_mod_mp_fairplay_compact:0 "Opt-in competitive lobby compact smoothing post-war exhaustion recovery, reinforcing truce stability, and curbing runaway late-game mercenary bidding."
 STATIC_MODIFIER_NAME_oe_qol_mod_mp_softcap_t1:0 "MP Anti-Snowball Soft-Cap (Tier I)"
 STATIC_MODIFIER_DESC_oe_qol_mod_mp_softcap_t1:0 "Gentle administrative and mercenary-ceiling dampening applied under the opt-in Fair-Play Compact once a great power spans 80 or more locations."
 STATIC_MODIFIER_NAME_oe_qol_mod_mp_softcap_t2:0 "MP Anti-Snowball Soft-Cap (Tier II)"
 STATIC_MODIFIER_DESC_oe_qol_mod_mp_softcap_t2:0 "Progressive late-game hegemon dampening applied under the opt-in Fair-Play Compact once an empire exceeds 160 locations, keeping coalition wars competitive."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_rgo_granary_ledger:0 "Standardized Provincial Granary Ledgers"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_rgo_granary_ledger:0 "Unified provincial harvest ledgers pair rural raw-material expansion with resilient urban granary buffers against late-game supply shocks."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_rgo_charter_output:0 "Royal Extraction Charter Incentives"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_rgo_charter_output:0 "Multi-year extraction charters reward provincial syndicates for lifting raw-material throughput and workshop supply chains."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_trunk_survey_corps:0 "Imperial Trunk Road Survey Corps"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_trunk_survey_corps:0 "Salaried royal cartographers standardize milestones, bridges, and relay gradients between the capital and provincial hubs."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_market_relay_tolls:0 "Inter-Market Relay Toll Concessions"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_market_relay_tolls:0 "Streamlined road tolls along newly connected trunk corridors accelerate caravan turnover and urban prosperity."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_admin_chancery:0 "Centralized Imperial Chancery Registers"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_admin_chancery:0 "Indexed ministerial archives and standardized decree templates streamline late-game cabinet administration across vast realms."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_provincial_intendants:0 "Chartered Provincial Intendants"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_provincial_intendants:0 "Empowered regional intendants handle routine local governance, expanding diplomatic bandwidth and fiscal remittance."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_urban_census_cadastre:0 "Imperial Cadastre & Urban Hearth Survey"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_urban_census_cadastre:0 "Accurate municipal hearth rolls close tax leakage while helping city magistrates plan granaries, waterworks, and steady urban growth."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_urban_guild_rolls:0 "Municipal Literacy & Guild Apprenticeship Rolls"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_urban_guild_rolls:0 "Urban census boards tie guild charters to elementary schools and technical apprenticeships, spurring innovation and output."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_continental_post:0 "State Relay Post-Houses"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_continental_post:0 "Timed horse-relay post-houses carry royal writs and diplomatic couriers across borders on predictable schedules."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_commercial_packets:0 "Public Commercial Packet Exchange"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_commercial_packets:0 "Opening royal courier lines to bills of exchange and commercial price bulletins knits distant markets into a vibrant trading web."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_sovereign_sinking_fund:0 "Consolidated Sovereign Sinking Fund"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_sovereign_sinking_fund:0 "Dedicated customs revenues service long-term state bonds transparently, trimming borrowing costs and anchoring price stability."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_treasury_liquidity:0 "Audited Customs & Treasury Liquidity"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_treasury_liquidity:0 "Quarterly treasury audits curb court waste and smooth tax and tariff flows across high-spend late-game campaigns."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_concert_armistice:0 "Concert Armistice & Demobilization Accord"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_concert_armistice:0 "Codified armistice guarantees ease post-war exhaustion, deter sudden truce breaches, and enhance diplomatic standing."
 STATIC_MODIFIER_NAME_oe_qol_mod_ev_concert_deterrence:0 "Concert Armed Deterrence & Mediation"
 STATIC_MODIFIER_DESC_oe_qol_mod_ev_concert_deterrence:0 "Balanced treaty guarantees pair steady domestic stability with wider diplomatic capacity for great-power arbitration."
