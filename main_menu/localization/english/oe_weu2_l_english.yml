# NEW 2026-11-22 v11.5 Worker 4 (oe_weu2_). Generated by gen_v115_western_europe.py; edit the generator, not this file.
 oe_weu2_propaganda_admiralty_house: "Admiralty and College of the East"
 oe_weu2_propaganda_admiralty_house_desc: "The admiralty, the head office of a chartered company and a college that trains envoys for distant lands, under one roof. It can be built only in Vienna, Prague, Rome, Lisbon, Paris, London, Amsterdam, Antwerp, Berlin, Dresden and Munich, one in each; in the capital it also helps the whole country. Requires the Propaganda and the Map of All Nations advance."
 oe_weu2_propaganda_admiralty_house_maint: "Upkeep"
 oe_weu2_continental_maritime_law: "The Realm by Land and Sea"
 oe_weu2_continental_maritime_law_desc: "Where the state puts its strength: the defence of the Empire, the universal Church, the route to the East, or the chartered companies."
 oe_weu2_pol_reichskreise_defense: "Defence by Imperial Circles"
 oe_weu2_pol_reichskreise_defense_desc: "The Empire is divided into circles, each raising its own quota of men and money for the common defence."
 oe_weu2_pol_propaganda_fide_missions: "The Universal Mission"
 oe_weu2_pol_propaganda_fide_missions_desc: "Missionaries to distant lands are sent and governed directly from Rome, no longer through the crowns."
 oe_weu2_pol_carreira_cartaz_network: "The India Run and the Passes"
 oe_weu2_pol_carreira_cartaz_network_desc: "Hold a few fortresses at the straits and impose passes on a whole ocean."
 oe_weu2_pol_chartered_east_india_acts: "Chartered Companies and Navigation Acts"
 oe_weu2_pol_chartered_east_india_acts_desc: "Hand the ocean trade to joint-stock chartered companies and require that our goods be carried in our own ships."
 oe_weu2_reichskammergericht_reform: "Imperial Circles and the Chamber Court"
 oe_weu2_reichskammergericht_reform_desc: "Private war among the princes is forbidden for ever; disputes go to a standing Chamber Court, and the circles carry out its judgments."
 oe_weu2_chartered_maritime_admiralty: "Admiralty and Chartered Companies"
 oe_weu2_chartered_maritime_admiralty_desc: "A standing admiralty governs the fleet, the dockyards and the officers, while chartered companies run the trade and the posts overseas."
 oe_weu2_priv_imperial_free_cities: "Charters of the Free Cities"
 oe_weu2_priv_imperial_free_cities_desc: "Confirm the self-rule of the trading cities and their networks of credit, in return for steady taxes and loans."
 oe_weu2_priv_jesuit_colleges_charter: "Charter of the Colleges"
 oe_weu2_priv_jesuit_colleges_charter_desc: "Let the order open colleges in every city, teaching grammar, mathematics and astronomy without fees."
 oe_weu2_adv_reichsreform_circles: "The Reform of the Empire"
 oe_weu2_adv_reichsreform_circles_desc: "The diet meets regularly; circles, a court and a common tax are set up."
 oe_weu2_adv_albuquerque_chokepoints: "The Three Keys"
 oe_weu2_adv_albuquerque_chokepoints_desc: "There is no need to hold a whole coast: whoever keeps a few straits commands the trade of an ocean."
 oe_weu2_adv_propaganda_fide_cartography: "The Propaganda and the Map of All Nations"
 oe_weu2_adv_propaganda_fide_cartography_desc: "Missionaries carry star charts, clocks and maps to the East and send home what they learn there. Unlocks the Admiralty and College of the East."
 oe_weu2_adv_joint_stock_line_of_battle: "Joint Stock and the Line of Battle"
 oe_weu2_adv_joint_stock_line_of_battle_desc: "Joint stock pays for more and larger ships, and the fleet fights in a single line, each ship firing its broadside in turn."
 oe_weu2_player_only_tt: "Only a player-controlled country can use this"
 oe_weu2_dec_convene_reichskreise.title: "Call Out the Imperial Circles"
 oe_weu2_dec_convene_reichskreise.desc: "Call on the circles to furnish their quotas of men and money for the common defence. Requires being at war or the year 1500; costs 150 gold and lasts 15 years."
 oe_weu2_dec_convene_reichskreise.a: "Call them out"
 oe_weu2_dec_westphalia_settlement.title: "Preside over the Peace Congress"
 oe_weu2_dec_westphalia_settlement.desc: "Hold a congress at Munster and Osnabruck to end the wars of religion. Requires the year 1600; costs 250 gold. The settlement chosen lasts 30 years."
 oe_weu2_dec_westphalia_settlement.a: "Open the congress"
 oe_weu2_dec_propaganda_fide_asia.title: "Send the Mission to Asia"
 oe_weu2_dec_propaganda_fide_asia.desc: "Send friars skilled in astronomy and the calendar to India, China and Japan. Requires a Catholic country and the year 1540; costs 200 gold and lasts 20 years. From then on the mission appears in the events of India and Japan."
 oe_weu2_dec_propaganda_fide_asia.a: "Send them"
 oe_weu2_dec_por_three_straits_cartaz.title: "Seize the Three Keys and Impose the Passes"
 oe_weu2_dec_por_three_straits_cartaz.desc: "With Goa, Malacca and Hormuz as the keys, impose passes on the Indian Ocean. Requires the sea route to India, or Goa, or the year 1510; costs 250 gold and lasts 30 years. From then on the countries of Persia and India can respond."
 oe_weu2_dec_por_three_straits_cartaz.a: "Give the order"
 oe_weu2_dec_charter_east_india_company.title: "Charter an East India Company"
 oe_weu2_dec_charter_east_india_company.desc: "Grant the monopoly of the Eastern trade to a joint-stock company and set off a wave of shipbuilding in the capital's market. Requires a port and the year 1600; costs 250 gold and lasts 20 years."
 oe_weu2_dec_charter_east_india_company.a: "Grant the charter"
 oe_weu2.1.title: "The Imperial Diet"
 oe_weu2.1.desc: "Electors, secular princes, prince-bishops, and envoys of the imperial free cities have thronged into the hall of the Imperial Diet. Amid stiff protocol and jealous rivalries, one urgent question dominates every caucus: who shall shoulder the tax burden for the defence of the Empire, and whose hand shall command its armies?"
 oe_weu2.1.a: "By circles, each choosing its own commander"
 oe_weu2.1.b: "Give it all to the emperor"
 oe_weu2.2.title: "The Rift of the Confessions"
 oe_weu2.2.desc: "A friar's theses have gone through every printing house, and princes and cities are taking sides. A council sits, adjourns and sits again, and the rift only widens."
 oe_weu2.2.a: "Stand by the old faith"
 oe_weu2.2.b: "Tolerate the new teaching"
 oe_weu2.3.title: "The Window at Prague"
 oe_weu2.3.desc: "Angry nobles have thrown two of the emperor's ministers from a window of the castle. Both leagues of the confessions are raising troops, and no one can stand aside any longer."
 oe_weu2.3.a: "Arm with the princes of our own confession"
 oe_weu2.3.b: "Stay neutral as long as we can"
 oe_weu2.4.title: "A Standing Army on Scorched Earth"
 oe_weu2.4.desc: "The war has ruined half the land. The elector concludes that mercenaries and other men's promises will never do again: the state must have a standing army of its own, even at the price of concessions to the nobles."
 oe_weu2.4.a: "Raise the standing army"
 oe_weu2.4.b: "Rebuild the country first"
 oe_weu2.5.title: "The Peace"
 oe_weu2.5.desc: "After decades of devastating confessional warfare that have laid waste to towns and harvests across the realm, weary plenipotentiaries from every warring power have finally assembled in the two designated congress cities. On the baize tables before them lie two starkly different settlements that will define the order of Europe for generations."
 oe_weu2.5.a: "Sovereign states and coexisting confessions"
 oe_weu2.5.b: "Unity under the emperor and an end to the quarrel"
 oe_weu2.6.title: "Rome Rebuilt"
 oe_weu2.6.desc: "Rome is full of scaffolding: a new basilica, a new dome, new squares. The cost is staggering, but every artist in Europe is on the road here."
 oe_weu2.6.a: "Build on"
 oe_weu2.6.b: "Within our means"
 oe_weu2.7.title: "The Friars Go East"
 oe_weu2.7.desc: "The friars have taken ship with their star charts, striking clocks and maps. Some would follow local custom, dress as scholars of the country and argue in its terms; others hold that doctrine may not yield an inch."
 oe_weu2.7.a: "Adapt to the country"
 oe_weu2.7.b: "Keep strictly to doctrine"
 oe_weu2.8.title: "The Three Keys"
 oe_weu2.8.desc: "The governor's plan is simple: Goa is the base, Malacca the eastern gate and Hormuz the western. Hold those three, and the spices of a whole ocean can travel only by our route."
 oe_weu2.8.a: "Carry it out"
 oe_weu2.8.b: "Secure the posts we already have"
 oe_weu2.9.title: "The League Strikes"
 oe_weu2.9.desc: "Resentful of maritime tolls and forced pass fees, the coastal realms of the Indian Ocean have set aside old rivalries to forge a formidable naval league. Refusing to purchase another safe-conduct, their combined fleet is massing across the monsoon harbours and has already struck several of our exposed trading factories."
 oe_weu2.9.a: "Mass the great ships and seek battle"
 oe_weu2.9.b: "Exempt some ports and divide them"
 oe_weu2.10.title: "The Bell at the Exchange"
 oe_weu2.10.desc: "The company's shares are offered to everyone, and great merchants and housemaids alike subscribe. Its fleet is bound for the Spice Islands of the East, which until now belonged to someone else."
 oe_weu2.10.a: "Back the company to the hilt"
 oe_weu2.10.b: "Demand a dividend for the treasury"
 oe_weu2.11.title: "The Navigation Act"
 oe_weu2.11.desc: "The new law says that goods may be brought into the country only in our own ships or in those of the land that produced them. It is aimed at the neighbour who carries the whole world's freight, and war will probably follow."
 oe_weu2.11.a: "Enact it and enlarge the fleet"
 oe_weu2.11.b: "Enact it, with room for exceptions"
 oe_weu2.12.title: "The Minister's Dockyards"
 oe_weu2.12.desc: "Our ambitious minister of finance has laid an audacious mercantilist grand design before the throne: state-backed royal dockyards, a permanent ocean-going navy, and a chartered East India company built in tandem. Trade, he declares forcefully before the council, is simply a ceaseless war waged without bloodshed—and one we cannot afford to lose."
 oe_weu2.12.a: "Fund his plan"
 oe_weu2.12.b: "The army comes first"
 oe_weu2.13.title: "The Purple across the Ocean"
 oe_weu2.13.desc: "Seamen bring word of a state across the ocean that calls itself the heir of Rome, with cities, harbours and a fleet. Our fishing grounds and sea lanes lie at its very door."
 oe_weu2.13.a: "Join the other sea powers to contain it"
 oe_weu2.13.b: "Trade with it first"
 oe_weu2.14.title: "The Straits to the South"
 oe_weu2.14.desc: "The peninsula and the opposite shore have fought over the strait for centuries. Whoever comes out on top holds the door between the Mediterranean and the Atlantic. On which side should our weight lie?"
 oe_weu2.14.a: "Towards the Atlantic"
 oe_weu2.14.b: "Towards the continent"
 oe_weu2.90.title: "[Readout] Western Europe"
 oe_weu2.90.desc: "v11.5 Western Europe readout (1 = yes, 0 = no):\n· This country is a protagonist #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_protagonist')|0]#!, Slot 93 has run #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_pulses')|0]#! times\n· A prince of the Empire #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_empire')|0]#!, an Atlantic power #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_atlantic')|0]#!\n· The pass system is in force #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_cartaz')|0]#!, the mission to Asia has set out #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_jesuit')|0]#!, the league against the passes exists #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_league')|0]#!\n· This country carries the vice-royalty variable #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_estado')|0]#! (1 only with the matching expansion and its decision taken), New Rome across the ocean is settled #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_weu2_v_elysia')|0]#!"
 oe_weu2.90.a: "Close"
