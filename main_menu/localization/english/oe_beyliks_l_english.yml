l_english:
 OE_BEY_UMUR_SK: "Now word has reached the capital: Umur has fallen before the harbour castle of Smyrna. The empire has lost an old friend: in the civil war it was Umur's fleet that crossed the sea to help Kantakouzenos. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_SL: "Now the league's envoys bring the news: Umur has fallen before the harbour castle of Smyrna. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_SR: "Now word has reached the capital: Umur has fallen before the harbour castle of Smyrna. In the civil war Umur's fleet crossed the sea again and again to help Kantakouzenos, and the regency counted Umur among its most dangerous enemies. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_SP: "Now word has reached the capital: Umur has fallen before the harbour castle of Smyrna. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NK: "Now word has reached the capital: Umur has died. The empire has lost an old friend: in the civil war it was Umur's fleet that crossed the sea to help Kantakouzenos. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NL: "Now the league's envoys bring the news: Umur has died. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NR: "Now word has reached the capital: Umur has died. In the civil war Umur's fleet crossed the sea again and again to help Kantakouzenos, and the regency counted Umur among its most dangerous enemies. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NP: "Now word has reached the capital: Umur has died. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_STRAIT_F: "Now the Ottomans hold the eastern shore of the straits, facing the empire's towns around Gallipoli, and Orhan's men have already wintered in Thrace. The commanders on the western shore ask for reinforcements, while some at court would rather win the Ottomans' goodwill."
 OE_BEY_STRAIT_P: "Now the Ottomans hold the eastern shore of the straits, facing the empire's towns around Gallipoli. The commanders on the western shore ask for reinforcements, while some at court would rather win the Ottomans' goodwill."
 OE_BEY_CHR_SEA_1: "Black Sea: the empire sailed with Umur."
 OE_BEY_CHR_SEA_2: "Black Sea: the empire let Umur's fleet through but sent no ships."
 OE_BEY_CHR_SEA_3: "Black Sea: the empire declined Umur's invitation."
 OE_BEY_CHR_SEA_X: "Black Sea: Umur never asked the empire."
 OE_BEY_CHR_SEA_W: "Black Sea: no news yet (from the spring of 1339)."
 OE_BEY_CHR_UMUR_1: "After Umur's death the empire renewed the friendship with the new bey."
 OE_BEY_CHR_UMUR_2: "After Umur's death the empire broke off its alliance with Aydin."
 OE_BEY_CHR_UMUR_3: "After Umur's death the empire paid no heed."
 OE_BEY_CHR_UMUR_X: "After Umur's death the empire made no gesture."
 OE_BEY_CHR_UMUR_Y: "Umur outlived the year 1365."
 OE_BEY_CHR_UMUR_D: "Umur is dead; the news is on its way."
 OE_BEY_CHR_UMUR_W: "Umur is still alive."
 OE_BEY_CHR_STR_1: "The straits: the empire strengthened the western shore."
 OE_BEY_CHR_STR_2: "The straits: the empire sent gifts to the Ottomans."
 OE_BEY_CHR_STR_3: "The straits: the empire took in the exiles of Karesi."
 OE_BEY_CHR_STR_X: "The straits: nothing came of it in those years."
 OE_BEY_CHR_STR_W: "The straits: the fate of Karesi is not yet settled."
