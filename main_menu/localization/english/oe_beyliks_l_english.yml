l_english:
 OE_BEY_UMUR_SK: "Now word has reached the capital: Umur has fallen before the harbour castle of Smyrna. The empire has lost an old friend: in the civil war it was Umur's fleet that crossed the sea to help Kantakouzenos. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_SL: "Now the league's envoys bring the news: Umur has fallen before the harbour castle of Smyrna. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_SR: "Now word has reached the capital: Umur has fallen before the harbour castle of Smyrna. In the civil war Umur's fleet crossed the sea again and again to help Kantakouzenos, and the regency counted Umur among its most dangerous enemies. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_SP: "Now word has reached the capital: Umur has fallen before the harbour castle of Smyrna. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NK: "Now word has reached the capital: Umur has died. The empire has lost an old friend: in the civil war it was Umur's fleet that crossed the sea to help Kantakouzenos. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NL: "Now the league's envoys bring the news: Umur has died. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NR: "Now word has reached the capital: Umur has died. In the civil war Umur's fleet crossed the sea again and again to help Kantakouzenos, and the regency counted Umur among its most dangerous enemies. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_UMUR_NP: "Now word has reached the capital: Umur has died. The new bey of Aydin has sent word of the death and waits to see how the empire will answer."
 OE_BEY_STRAIT_F: "Now the Ottomans hold the eastern shore of the straits, facing the empire's towns around Gallipoli, and Orhan's men have already wintered in Thrace. The commanders on the western shore ask for reinforcements, while some at court would rather win the Ottomans' goodwill."
 OE_BEY_STRAIT_P: "Now the Ottomans hold the eastern shore of the straits, facing the empire's towns around Gallipoli. The commanders on the western shore ask for reinforcements, while some at court would rather win the Ottomans' goodwill."
 OE_BEY_CHR_SEA_1: "Black Sea: the empire sailed with Umur."
 OE_BEY_CHR_SEA_2: "Black Sea: the empire let Umur's fleet through but sent no ships."
 OE_BEY_CHR_SEA_3: "Black Sea: the empire declined Umur's invitation."
 OE_BEY_CHR_SEA_X: "Black Sea: Umur never asked the empire."
 OE_BEY_CHR_SEA_W: "Black Sea: no news yet (from the spring of 1339)."
 OE_BEY_CHR_UMUR_1: "After Umur's death the empire renewed the friendship with the new bey."
 OE_BEY_CHR_UMUR_2: "After Umur's death the empire broke off its alliance with Aydin."
 OE_BEY_CHR_UMUR_3: "After Umur's death the empire paid no heed."
 OE_BEY_CHR_UMUR_X: "After Umur's death the empire made no gesture."
 OE_BEY_CHR_UMUR_Y: "Umur outlived the year 1365."
 OE_BEY_CHR_UMUR_D: "Umur is dead; the news is on its way."
 OE_BEY_CHR_UMUR_W: "Umur is still alive."
 OE_BEY_CHR_STR_1: "The straits: the empire strengthened the western shore."
 OE_BEY_CHR_STR_2: "The straits: the empire sent gifts to the Ottomans."
 OE_BEY_CHR_STR_3: "The straits: the empire took in the exiles of Karesi."
 OE_BEY_CHR_STR_X: "The straits: nothing came of it in those years."
 OE_BEY_CHR_STR_W: "The straits: the fate of Karesi is not yet settled."
 OE_BEY_PHIL_V: "Now the sultan's envoys are in the capital demanding Philadelphia. The sultan and the beys who answer to the sultan already stand at its walls; and by the terms of vassalage the emperor must march with the sultan's army as well."
 OE_BEY_PHIL_P: "Now the sultan's envoys are in the capital demanding Philadelphia. The sultan and the beys who answer to the sultan already stand at its walls, and the garrison is small."
 OE_BEY_KAR_B: "Now an envoy of Karaman has reached the capital by sea, asking whether the empire will join in holding the sultan in check. The City is still under the sultan's blockade."
 OE_BEY_KAR_P: "Now an envoy of Karaman has reached the capital by sea, asking whether the empire will join in holding the sultan in check."
 OE_BEY_GRACE_S: "Now Timur holds the sultan captive and has set free the beys who answered to the sultan: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#! of them rule on their own again. Timur has also stormed the Latins' harbour castle at Smyrna. Once more the emirates stand at the Ottomans' back."
 OE_BEY_GRACE_P: "Now Timur holds the sultan captive and has set free the beys who answered to the sultan: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#! of them rule on their own again. Once more the emirates stand at the Ottomans' back."
 OE_BEY_CHR_PHIL_1: "Philadelphia: the empire marched with the sultan and handed the city over."
 OE_BEY_CHR_PHIL_2: "Philadelphia: the empire left the city to hold out on its own."
 OE_BEY_CHR_PHIL_3: "Philadelphia: the empire paid to keep the city."
 OE_BEY_CHR_PHIL_X: "Philadelphia: the sultan never asked for the city."
 OE_BEY_CHR_PHIL_W: "Philadelphia: no news yet (from 1389)."
 OE_BEY_CHR_GRACE_1: "Timur restored #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#! of the emirates, and the empire sent envoys to win their friendship."
 OE_BEY_CHR_GRACE_2: "Timur restored #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#! of the emirates; the empire stood only with the prince it backed."
 OE_BEY_CHR_GRACE_3: "Timur restored #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#! of the emirates, and the empire sat back and watched."
 OE_BEY_CHR_GRACE_D: "Timur restored #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_rd_restored')|0]#! of the emirates."
 OE_BEY_CHR_GRACE_X: "Timur freed none of the emirates from the sultan."
 OE_BEY_CHR_GRACE_W: "Timur: no news yet."
 OE_BEY_VARNA_2: "Now an envoy of Karaman has reached the capital by sea with the bey's letters for the princes of the West, and asks the emperor to pass them on: when the armies of the West come down the Danube, Karaman will rise at the sultan's back. The empire has already promised ships to hold the Straits and a push north from the Morea; if Karaman rises as well, the sultan will be pressed from three sides."
 OE_BEY_VARNA_1: "Now an envoy of Karaman has reached the capital by sea with the bey's letters for the princes of the West, and asks the emperor to pass them on: when the armies of the West come down the Danube, Karaman will rise at the sultan's back. The empire has promised the West only a few ships; Karaman's envoy hopes it will do a little more."
 OE_BEY_VARNA_0: "Now an envoy of Karaman has reached the capital by sea with the bey's letters for the princes of the West, and asks the emperor to pass them on: when the armies of the West come down the Danube, Karaman will rise at the sultan's back. The empire is keeping its peace with the sultan; to carry Karaman's letters would be to open another road behind that peace."
 OE_BEY_VARNA_P: "Now an envoy of Karaman has reached the capital by sea with the bey's letters for the princes of the West, and asks the emperor to pass them on: when the armies of the West come down the Danube, Karaman will rise at the sultan's back. The empire has not yet declared itself to the West; whether it carries Karaman's letters is itself an answer."
 OE_BEY_CHR_WILL_1: "The bey of Germiyan left the emirate to the sultan, and Germiyan passed to the Ottomans."
 OE_BEY_CHR_WILL_X: "Germiyan did not pass to the sultan by bequest."
 OE_BEY_CHR_WILL_W: "Germiyan: no news yet (from 1428)."
 OE_BEY_CHR_PACT_2: "Karaman's compact: the empire brought the two together."
 OE_BEY_CHR_PACT_1: "Karaman's compact: the empire passed the letters on."
 OE_BEY_CHR_PACT_3: "Karaman's compact: the empire kept out of it."
 OE_BEY_CHR_PACT_X: "No envoy came from Karaman."
 OE_BEY_CHR_PACT_W: "Karaman: no news yet (from 1442)."
 game_concept_oe_tu_beylik: "Turkish Emirates"
 game_concept_oe_tu_beylik_desc: "#F After the Sultanate of Rum fell apart, Anatolia was divided among many Turkish emirates (beyliks). Around 1390 Bayezid brought the western ones under the sultan one by one; after the battle of Ankara in 1402 Timur restored the former beys.#!\n\nThe Turkish emirates here are seven: Aydin, Saruhan, Germiyan, Karaman, Menteshe, the Candarids of Kastamonu and Karesi. Each one the Ottomans bring under leaves the empire one neighbour fewer to lean on in the east.\n\n#bold Counterweight#! (#Y 0#! to #Y 7#!) is a readout: how many of the seven still exist, are not Ottoman subjects, border the Ottomans or their subjects, and hold an opinion of the empire of at least #Y 0#!. It is not stored and changes nothing; event texts quote it to show how much still stands at the sultan's back.\n\nNothing in this line opens a war: an emirate's submission is written as vassalage to the sultan, its restoration as release from it. Where a player rules an emirate or the Ottomans, the world leaves that country's choices alone."
 STATIC_MODIFIER_NAME_oe_bey_hellespont_watch: "Watch on the Hellespont"
 STATIC_MODIFIER_NAME_oe_bey_karesi_exiles: "Exiles from Karesi"
 STATIC_MODIFIER_NAME_oe_bey_latin_customs: "Customs Shared with the Latins"
 STATIC_MODIFIER_NAME_oe_bey_balat_trade: "Venetian Merchants at Balat"
 STATIC_MODIFIER_NAME_oe_bey_phil_alone: "A City Standing Alone"
 STATIC_MODIFIER_NAME_oe_bey_phil_tribute: "Tribute for the City's Safety"
 oe_bey_b_comrade: "Sailed with us"
 oe_bey_b_raided: "Raided our coasts with the fleet of Aydin"
 oe_bey_b_passage: "Let our fleet through the straits"
 oe_bey_b_snub: "Refused to sail with us"
 oe_bey_b_renewed: "Mourned our late lord and renewed the friendship"
 oe_bey_b_turned: "Broke the alliance as soon as our lord was dead"
 oe_bey_b_latin_relief: "Broke with Aydin"
 oe_bey_b_orhan_gift: "Sent rich gifts across the straits"
 oe_bey_b_refuge: "Sheltered the exiles of Karesi"
 oe_bey_bw_latin_peace: "Made the Smyrna peace with us"
 oe_bey_bw_balat: "Trades with us at Balat"
 oe_bey_b_phil_given: "Handed over Philadelphia"
 oe_bey_b_phil_defied: "Refused to give up Philadelphia"
 oe_bey_b_phil_bought: "Paid us to leave Philadelphia alone"
 oe_bey_b_kar_gold: "Sent us gold in friendship"
 oe_bey_b_kar_word: "Exchanged news with us"
 oe_bey_b_kar_plot: "Paid Karaman to stand against us"
 oe_bey_b_counterweight: "Sent envoys of friendship when we were restored"
 oe_bey_b_cold: "Kept away from us when we were restored"
 oe_bey_bw_dowry: "Bound to us by a marriage and its dowry"
 oe_bey_b_kar_1443: "Brought us and the armies of the West together"
 oe_bey_b_kar_note: "Passed our letters on"
 oe_bey_b_kar_link: "Brought Karaman and the armies of the West together"
 oe_bey.1.t: "Umur's Black Sea Cruise"
 oe_bey.1.desc: "#F In 1336 Umur sent troops to help Andronikos III recover Mytilene and Phokaia; in 1337 Umur sent two thousand men with the emperor to put down the rising in Albania. According to Turkish accounts, in 1339 and 1340 Umur's fleet followed the emperor into the Black Sea and raided the coasts around Kilia and of Wallachia.#!\n\nNow Umur's ships lie at the mouth of the straits. Umur's envoys have come to the capital asking the emperor to sail with the fleet, or at least to let it through the straits."
 oe_bey.1.a: "Sail with Umur"
 oe_bey.1.a.tt: "Costs #R 1#! month of trade and tax income\nBack from the raid, gain #G 2#! months of trade and tax income\nAydin: opinion of the empire #G +15#! for #Y 10#! years\nKilia is raided (unless a player holds it): it gains [ShowModifier('looted')] for #Y 3#! years, and its owner's opinion of the empire changes by #R −15#! for #Y 5#! years\nWallachia (if not a player): opinion of the empire #R −15#! for #Y 5#! years"
 oe_bey.1.b: "Let the fleet through the straits, but send no ships"
 oe_bey.1.b.tt: "Aydin: opinion of the empire #G +5#! for #Y 5#! years"
 oe_bey.1.c: "Decline politely"
 oe_bey.1.c.tt: "Aydin: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.2.t: "Below the Walls of Smyrna"
 oe_bey.2.desc_full: "#F Umur, bey of Aydin, was an ally of Andronikos III. In 1342 and 1343 Umur twice brought ships across the sea to help Kantakouzenos; in the autumn of 1344 the crusaders took the harbour castle of Smyrna. In the spring of 1348 Umur attacked the harbour castle of Smyrna and was killed by an arrow while climbing the walls; Umur's elder brother Khidr succeeded. That August the pope approved Khidr's treaty with the Latins: half the customs of the port went to the Latins, Christian ships could come and go freely, and the fleet of Aydin was laid up.#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_death: "#F Umur, bey of Aydin, was an ally of Andronikos III. In 1342 and 1343 Umur twice brought ships across the sea to help Kantakouzenos; in the autumn of 1344 the crusaders took the harbour castle of Smyrna. In the spring of 1348 Umur attacked the harbour castle of Smyrna and was killed by an arrow while climbing the walls; Umur's elder brother Khidr succeeded.#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_early: "#F Umur, bey of Aydin, was an ally of Andronikos III. In 1342 and 1343 Umur twice brought ships across the sea to help Kantakouzenos; in the autumn of 1344 the crusaders took the harbour castle of Smyrna.#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.a: "Send condolences and renew the friendship with the new bey"
 oe_bey.2.a.tt: "Costs #R 1#! month of trade and tax income\nAydin: opinion of the empire #G +15#! for #Y 10#! years\nThe alliance with Aydin, if any, stands"
 oe_bey.2.b: "The alliance dies with Umur"
 oe_bey.2.b.tt: "The empire's alliance with Aydin is dissolved\nThe papacy, Venice and the Knights Hospitaller: opinion of the empire #G +10#! for #Y 5#! years\nAydin: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.2.c: "Pay it no heed"
 oe_bey.2.c.tt: "The empire sends no one, and its dealings with Aydin stay as they are"
 oe_bey.3.t: "Across the Hellespont"
 oe_bey.3.desc: "#F The ruling house of Karesi fell out among itself, and one of its princes went over to Orhan and handed over Balıkesir, Bergama and Edremit. The Ottomans took over Karesi's men and ships, and so came to stand on the Dardanelles. The sources disagree on the year Karesi was annexed.#!\n\n[GetCountry('BYZ').Custom('OeBeyStraitNow')]"
 oe_bey.3.a: "Strengthen the western shore"
 oe_bey.3.a.tt: "Costs #R 2#! months of trade and tax income\nPlaces the empire holds around Gallipoli (the Dardanelles province) gain [ShowModifier('oe_bey_hellespont_watch')] for #Y 20#! years"
 oe_bey.3.b: "Send gifts to the Ottomans"
 oe_bey.3.b.tt: "Costs #R 1#! month of trade and tax income\nThe Ottomans: opinion of the empire #G +15#! for #Y 5#! years"
 oe_bey.3.c: "Take in the exiles of Karesi"
 oe_bey.3.c.tt: "The empire gains [ShowModifier('oe_bey_karesi_exiles')] for #Y 10#! years\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.4.t: "The Last City in Asia"
 oe_bey.4.desc_full: "#F Philadelphia lay with Turkish lands on every side. In earlier years it paid the poll tax to Germiyan, yet it always held to the emperor: the empire's last city in Asia Minor. In 1390 Bayezid came for the city, and Manuel, as the sultan's vassal, was made to march with the Ottoman army. When the townsfolk saw the imperial standard raised in the sultan's camp, they opened the gates.#!\n\n[GetCountry('BYZ').Custom('OeBeyPhilNow')]"
 oe_bey.4.desc_early: "#F Philadelphia lay with Turkish lands on every side. In earlier years it paid the poll tax to Germiyan, yet it always held to the emperor: the empire's last city in Asia Minor.#!\n\n[GetCountry('BYZ').Custom('OeBeyPhilNow')]"
 oe_bey.4.a: "March with the sultan and hand the city over"
 oe_bey.4.a.tt: "Philadelphia passes to the Ottomans\n[oe_tu_authority|e] #R −3#!\nThe Ottomans: opinion of the empire #G +20#! for #Y 10#! years\nWhile the empire is the sultan's vassal: the sultan's patience #G +20#!"
 oe_bey.4.b: "Let the city hold out on its own"
 oe_bey.4.b.tt: "Philadelphia gains [ShowModifier('oe_bey_phil_alone')] for #Y 10#! years\nThe Ottomans: opinion of the empire #R −30#! for #Y 10#! years\nWhile the empire is the sultan's vassal: the sultan's patience #R −30#!\nThis opens no war; whether the sultan comes for the city later is the sultan's choice"
 oe_bey.4.c: "Pay to keep the city"
 oe_bey.4.c.tt: "Costs #R 3#! months of trade and tax income\nPhiladelphia gains [ShowModifier('oe_bey_phil_tribute')] for #Y 10#! years\nThe Ottomans: opinion of the empire #R −5#! for #Y 5#! years\nWhile the empire is the sultan's vassal: the sultan's patience #R −10#!"
 oe_bey.5.t: "An Envoy from Karaman"
 oe_bey.5.desc_full: "#F Karaman, with its seat at Konya, was the strongest of the Anatolian emirates. In 1386 or 1387 (the sources differ on the year) Murad I defeated Karaman at Frenkyazısı. It is recorded that in 1396, while the sultan marched north against the crusade, Alaeddin Ali of Karaman seized Ankara and captured one of the sultan's chief commanders, and then sought peace. The sultan refused, turned back, defeated Karaman at Akçay and had Alaeddin put to death (in 1397 or 1398).#!\n\n[GetCountry('BYZ').Custom('OeBeyKarNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.5.desc_ankara: "#F Karaman, with its seat at Konya, was the strongest of the Anatolian emirates. In 1386 or 1387 (the sources differ on the year) Murad I defeated Karaman at Frenkyazısı. It is recorded that in 1396, while the sultan marched north against the crusade, Alaeddin Ali of Karaman seized Ankara and captured one of the sultan's chief commanders, and then sought peace.#!\n\n[GetCountry('BYZ').Custom('OeBeyKarNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.5.desc_early: "#F Karaman, with its seat at Konya, was the strongest of the Anatolian emirates. In 1386 or 1387 (the sources differ on the year) Murad I defeated Karaman at Frenkyazısı.#!\n\n[GetCountry('BYZ').Custom('OeBeyKarNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.5.a: "Send gold and make friends"
 oe_bey.5.a.tt: "Costs #R 2#! months of trade and tax income\nKaraman: opinion of the empire #G +20#! for #Y 10#! years\nWhile the City is blockaded: grain stores #G +10#!, city morale #G +8#!\nIf the sultan later brings Karaman to heel, the Ottomans' opinion of the empire changes by #R −15#! for #Y 10#! years"
 oe_bey.5.b: "Exchange news only"
 oe_bey.5.b.tt: "Karaman: opinion of the empire #G +5#! for #Y 5#! years\nWhile the City is blockaded: city morale #G +3#!"
 oe_bey.5.c: "Stay out of it"
 oe_bey.5.c.tt: "The empire gives no answer, and Karaman's envoy leaves empty-handed"
 oe_bey.6.t: "Timur's Grace"
 oe_bey.6.desc_full: "#F After the battle of Ankara Timur gave the lands Bayezid had taken back to their former beys. Orhan of Saruhan returned to Manisa in August 1402; Yakub of Germiyan, Ilyas of Menteshe, Mehmed of Karaman and the house of Aydin ruled again; Isfendiyar of the Candarids kept Kastamonu. The Ottoman princes were left with Bithynia and Rumelia.#!\n\n[GetCountry('BYZ').Custom('OeBeyGraceNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.6.desc_early: "#F In 1390 Bayezid subdued Aydin, Saruhan and Menteshe in a single campaign and brought Germiyan to heel; in 1391 the sultan took Kastamonu. In 1399 Yakub of Germiyan fled to Timur.#!\n\n[GetCountry('BYZ').Custom('OeBeyGraceNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.6.a: "Send envoys to the emirates and win their friendship"
 oe_bey.6.a.tt: "Costs #R 1#! month of trade and tax income\nEach restored emirate: opinion of the empire #G +20#! for #Y 10#! years\nIf the empire backs one of the Ottoman princes: our claimant's strength #G +5#!"
 oe_bey.6.b: "Stand only with the prince we back"
 oe_bey.6.b.tt: "Our claimant's strength #G +8#!\nEach restored emirate: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.6.c: "Sit back and watch"
 oe_bey.6.c.tt: "The empire takes no side; the emirates and the Ottoman princes go their own ways"
 oe_bey.7.t: "Karaman's Secret Compact"
 oe_bey.7.desc_full: "#F Karaman, restored after the battle of Ankara, remained the strongest of the Anatolian emirates. In the decades that followed it went to war with the Ottomans several times, and as often sued for peace. In 1443 and 1444, as the crusade marched into the Balkans, Ibrahim II of Karaman rose in step with it and laid waste Ankara and Kütahya. When Murad II turned back with the army, Ibrahim had to accept every one of the sultan's terms.#!\n\n[GetCountry('BYZ').Custom('OeBeyVarnaNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.7.desc_rising: "#F Karaman, restored after the battle of Ankara, remained the strongest of the Anatolian emirates. In the decades that followed it went to war with the Ottomans several times, and as often sued for peace. In 1443 and 1444, as the crusade marched into the Balkans, Ibrahim II of Karaman rose in step with it and laid waste Ankara and Kütahya.#!\n\n[GetCountry('BYZ').Custom('OeBeyVarnaNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.7.desc_early: "#F Karaman, restored after the battle of Ankara, remained the strongest of the Anatolian emirates. In the decades that followed it went to war with the Ottomans several times, and as often sued for peace.#!\n\n[GetCountry('BYZ').Custom('OeBeyVarnaNow')]\n\nThe counterweight now: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_bey_counterweight')|0]#! of the [Concept('oe_tu_beylik','Turkish emirates')|e] border the Ottomans, are not the sultan's subjects and bear the empire no ill will."
 oe_bey.7.a: "Bring the two together"
 oe_bey.7.a.tt: "Costs #R 1#! month of trade and tax income\nKaraman: opinion of the empire #G +15#! for #Y 10#! years\nKaraman rises (unless a player rules the Ottomans): Ankara and Kütahya, where the Ottomans hold them, are raided and gain [ShowModifier('looted')] for #Y 3#! years\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years\nWhen the armies of the West meet the sultan in battle: their chance #G +5%#! (not added again if Karaman is already at war with the Ottomans)"
 oe_bey.7.b: "Pass the letters on, no more"
 oe_bey.7.b.tt: "Karaman: opinion of the empire #G +5#! for #Y 5#! years\nKaraman rises (unless a player rules the Ottomans): Ankara, if the Ottomans hold it, is raided and gains [ShowModifier('looted')] for #Y 3#! years\nWhen the armies of the West meet the sultan in battle: their chance #G +5%#! (not added again if Karaman is already at war with the Ottomans)"
 oe_bey.7.c: "Keep out of it"
 oe_bey.7.c.tt: "The empire carries no letters, and Karaman's envoy leaves empty-handed"
 oe_bey.90.t: "The Turkish Emirates: worker"
