 oe_bey.1.t: "Umur's Black Sea Cruise"
 oe_bey.1.desc: "#F In 1336 Umur sent troops to help Andronikos III recover Mytilene and Phokaia; in 1337 Umur sent two thousand men with the emperor to put down the rising in Albania. According to Turkish accounts, in 1339 and 1340 Umur's fleet followed the emperor into the Black Sea and raided the coasts around Kilia and of Wallachia.#!\n\nNow Umur's ships lie at the mouth of the straits. Umur's envoys have come to the capital asking the emperor to sail with the fleet, or at least to let it through the straits."
 oe_bey.1.a: "Sail with Umur"
 oe_bey.1.a.tt: "Costs #R 1#! month of trade and tax income\nBack from the raid, gain #G 2#! months of trade and tax income\nAydin: opinion of the empire #G +15#! for #Y 10#! years\nKilia is raided (unless a player holds it): it gains [ShowModifier('looted')] for #Y 3#! years, and its owner's opinion of the empire changes by #R −15#! for #Y 5#! years\nWallachia (if not a player): opinion of the empire #R −15#! for #Y 5#! years"
 oe_bey.1.b: "Let the fleet through the straits, but send no ships"
 oe_bey.1.b.tt: "Aydin: opinion of the empire #G +5#! for #Y 5#! years"
 oe_bey.1.c: "Decline politely"
 oe_bey.1.c.tt: "Aydin: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.2.t: "Below the Walls of Smyrna"
 oe_bey.2.desc_full: "#F Umur, bey of Aydin, was an ally of Andronikos III. In 1342 and 1343 Umur twice brought ships across the sea to help Kantakouzenos; in the autumn of 1344 the crusaders took the harbour castle of Smyrna. In the spring of 1348 Umur attacked the harbour castle of Smyrna and was killed by an arrow while climbing the walls; Umur's elder brother Khidr succeeded. That August the pope approved Khidr's treaty with the Latins: half the customs of the port went to the Latins, Christian ships could come and go freely, and the fleet of Aydin was laid up.#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_death: "#F Umur, bey of Aydin, was an ally of Andronikos III. In 1342 and 1343 Umur twice brought ships across the sea to help Kantakouzenos; in the autumn of 1344 the crusaders took the harbour castle of Smyrna. In the spring of 1348 Umur attacked the harbour castle of Smyrna and was killed by an arrow while climbing the walls; Umur's elder brother Khidr succeeded.#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.desc_early: "#F Umur, bey of Aydin, was an ally of Andronikos III. In 1342 and 1343 Umur twice brought ships across the sea to help Kantakouzenos; in the autumn of 1344 the crusaders took the harbour castle of Smyrna.#!\n\n[GetCountry('BYZ').Custom('OeBeyUmurNow')]"
 oe_bey.2.a: "Send condolences and renew the friendship with the new bey"
 oe_bey.2.a.tt: "Costs #R 1#! month of trade and tax income\nAydin: opinion of the empire #G +15#! for #Y 10#! years\nThe alliance with Aydin, if any, stands"
 oe_bey.2.b: "The alliance dies with Umur"
 oe_bey.2.b.tt: "The empire's alliance with Aydin is dissolved\nThe papacy, Venice and the Knights Hospitaller: opinion of the empire #G +10#! for #Y 5#! years\nAydin: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.2.c: "Pay it no heed"
 oe_bey.2.c.tt: "The empire sends no one, and its dealings with Aydin stay as they are"
 oe_bey.3.t: "Across the Hellespont"
 oe_bey.3.desc: "#F The ruling house of Karesi fell out among itself, and one of its princes went over to Orhan and handed over Balıkesir, Bergama and Edremit. The Ottomans took over Karesi's men and ships, and so came to stand on the Dardanelles. The sources disagree on the year Karesi was annexed.#!\n\n[GetCountry('BYZ').Custom('OeBeyStraitNow')]"
 oe_bey.3.a: "Strengthen the western shore"
 oe_bey.3.a.tt: "Costs #R 2#! months of trade and tax income\nPlaces the empire holds around Gallipoli (the Dardanelles province) gain [ShowModifier('oe_bey_hellespont_watch')] for #Y 20#! years"
 oe_bey.3.b: "Send gifts to the Ottomans"
 oe_bey.3.b.tt: "Costs #R 1#! month of trade and tax income\nThe Ottomans: opinion of the empire #G +15#! for #Y 5#! years"
 oe_bey.3.c: "Take in the exiles of Karesi"
 oe_bey.3.c.tt: "The empire gains [ShowModifier('oe_bey_karesi_exiles')] for #Y 10#! years\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years"
 oe_bey.90.t: "The Turkish Emirates: worker"
