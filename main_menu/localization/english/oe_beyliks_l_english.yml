 oe_bey_b_renewed: "Mourned our late lord and renewed the friendship"
 oe_bey_b_turned: "Broke the alliance as soon as our lord was dead"
 oe_bey_b_latin_relief: "Broke with Aydin"
 oe_bey_b_orhan_gift: "Sent rich gifts across the straits"
 oe_bey_b_refuge: "Sheltered the exiles of Karesi"
