 OE_PILLARS_LAW_PURSE_REQUIRED: "The Privy Purse can cover three months of its current income."
 OE_PILLARS_LAW_PURSE_PAYMENT: "Spend #R three months of Privy Purse income#!."
 OE_PILLARS_CORPUS_REFORM_REQUIRED: "Complete the imperial reform A New Corpus Juris Civilis."
 OE_PILLARS_CORPUS_UNLOCK: "Unlocks the original Corpus Juris Civilis policy under Legal Code and New Corpus Juris Civilis under Imperial Code."
 oe_pillars_law_change_price: "Revise Imperial Law"
 oe_ir_corpus_desc: "Imperial jurists will reconcile generations of decrees, judgments and legal commentaries into a common written authority.\n\nCosts #R 50#! Imperial Authority. Unlocks the original Corpus Juris Civilis policy under Legal Code and the New Corpus Juris Civilis policy under Imperial Code. Policies are not automatically enacted."
 oe_pillars_imperial_code_law_desc: "The emperor's written laws govern official judgments and provide the foundation for imperial taxation and administration."
 oe_pillars_justinian_code_desc: "Justinian's compilation provides a common authority for provincial judgments and tax collection.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_new_corpus_desc: "Ancient codes and contemporary decrees are reconciled, bringing the law of the court and the provinces into alignment.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_citizenship_law_desc: "Who may call themselves Roman citizens determines how the empire receives new lands and their inhabitants."
 oe_pillars_exclusive_citizenship_desc: "Guard the boundaries of the existing civic community, strengthening solidarity in the army while making integration harder for newcomers.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_roman_citizenship_desc: "Roman law, language and public duties bind the empire's inhabitants, gradually making newcomers citizens of a shared homeland.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_universal_citizenship_desc: "Imperial protection should transcend language and ancestry; those who share civic duties may share the dignity of citizenship.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_land_tax_law_desc: "Regulates priority in land purchases and responsibility for unpaid land taxes."
 oe_pillars_land_preemption_desc: "Recognize the right of local magnates to purchase land first, drawing on their wealth to sustain estates and taxes while increasing their rural influence.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
 oe_pillars_allelengyon_desc: "Require wealthy landholders to cover poorer farmers' tax arrears, preserving smallholdings and protecting their owners from dependency.\n\n$OE_PILLARS_LAW_PURSE_PAYMENT$"
