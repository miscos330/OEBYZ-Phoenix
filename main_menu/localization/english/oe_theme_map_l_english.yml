 MAPMODE_OE_THEME_REGIONS: "#T $mapmode_oe_theme_regions_name$#!\nAll #Y 79#! Roman Empire and historical regions are coloured by the Four Praetorian Prefectures (Oriens amber-gold, Illyricum violet, Italy-Africa azure, Gaul emerald): bright where a theme holds jurisdiction, dark where no theme is founded yet, grey outside imperial provinces; gold stripes mark each region's seat centre."
