l_english:
 oe_sit_v47_mamluk_suez: "Mamluk Suez Canal & Red Sea Spice Hegemony"
 oe_sit_v47_mamluk_suez_desc: "Between 1485 and 1585, Portuguese Cape fleets challenge the millennia-old Red Sea spice lifeline linking Calicut and Gujarat to Cairo and Venice. Reopen the ancient Pharaonic-Mamluk Suez Canal, haul Venetian timber and bronze cannon to Suez slipways, reverse the Battle of Diu, and crown a Mediterranean-Indian Ocean Thalassocracy!"
 oe_v47_suez_out_thalassocracy: "Canal of Two Seas & Red Sea Thalassocracy"
 oe_v47_suez_out_thalassocracy_desc: "With the Bitter Lakes locks open and the Indian Ocean armada victorious, vessels sail unbroken from Alexandria to Calicut—crowning Cairo, Venice, and their monsoon partners masters of global spice."
 oe_v47_suez_out_cape_triumph: "Cape of Good Hope Spice Monopoly"
 oe_v47_suez_out_cape_triumph_desc: "Atlantic carracks choke off Red Sea spice flows and secure Lisbon's oceanic monopoly around Africa, forcing Cairo and Venice to recalibrate their Levantine economies."
 oe_v47_suez_out_dual_route: "Twin-Corridor Spice Equilibrium"
 oe_v47_suez_out_dual_route_desc: "By 1585, neither corridor achieves total monopoly: Red Sea dhows and Atlantic carracks share the Eurasian spice tide under competing port customs."
 oe_v47_suez_map_mamluk_tt: "#Y Mamluk Suez & Red Sea Axis#!: Egypt, Sinai, and Red Sea ports anchoring the canal excavation and monsoon fleet."
 oe_v47_suez_map_venice_tt: "#Y Venetian Timber & Ordnance Syndicate#!: Adriatic shipwrights supplying Dalmatian oak, bronze cannon, and Mediterranean gold."
 oe_v47_suez_map_india_tt: "#Y Indian Ocean Spice Partners#!: Gujarat, Calicut, and Malabar ports supplying pepper, teak ships, and allied squadrons."
 oe_v47_suez_map_portugal_tt: "#Y Portuguese Cape & Carreira Fleets#!: Atlantic challenger attempting to divert Asian spices around southern Africa."
 oe_v47_suez_legend_mamluk: "Mamluk Egypt & Red Sea Axis"
 oe_v47_suez_legend_venice: "Venetian Maritime & Timber Syndicate"
 oe_v47_suez_legend_india: "Gujarat, Calicut & Monsoon Allies"
 oe_v47_suez_legend_portugal: "Portuguese Cape & Carreira Challengers"
 OE_V47_SUEZ_GUI_HDR_L: "Suez Canal Excavation"
 OE_V47_SUEZ_GUI_HDR_R: "Red Sea Spice Dominion"
 OE_V47_SUEZ_GUI_CARD_TITLE: "Canal of Two Seas & the Indian Ocean Showdown"
 OE_V47_SUEZ_GUI_CARD_BODY: "Portuguese Cape fleets threaten the ancient Cairo-Venice spice lifeline. Coordinate Venetian timber convoys, excavate the Pharaonic-Mamluk Suez Canal, deploy the Red Sea Heavy Artillery Armada to Diu, and charter the Cairo Spice Bourse. Reach 85+ Canal Progress and 75+ Spice Dominion to crown the Red Sea Thalassocracy!"
 OE_V47_SUEZ_GUI_GAUGE_1: "Suez Canal Progress (85+ unlocks Canal of Two Seas)"
 OE_V47_SUEZ_GUI_GAUGE_2: "Red Sea Spice Dominion (75+ defeats Cape Monopoly; <=20 = Cape Triumph)"
 OE_V47_SUEZ_GUI_FOOTNOTE: "Data Map: Gold = Mamluk Egypt & Red Sea Axis; Teal = Venice; Emerald = Gujarat & Calicut Monsoon Partners; Crimson = Portuguese Cape Fleets."
 hint_oe_sit_v47_mamluk_suez: "[GetSituationByKey('oe_sit_v47_mamluk_suez').GetNameWithNoTooltip]"
 hint_oe_sit_v47_mamluk_suez_hint_text: "#T Overview#!\n@hint! #Y Mamluk Suez Canal & Red Sea Spice Hegemony#! activates between #Y 1485 and 1585#! when a human plays in the Egypt-Venice-Portugal-India theater (or when AI Alt-History is unleashed). Drive #Y Suez Canal Progress >= 85#! and #Y Red Sea Spice Dominion >= 75#! for the Thalassocracy ending, or push Spice Dominion <= 20 as Portugal for Cape Monopoly."
 hint_oe_sit_v47_mamluk_suez_administrative: "Excavating the Pharaonic-Mamluk Suez Canal gives the largest +14 canal leap and unlocks monthly automatic progress; pair it with the Mamluk Red Sea & Suez Admiralty government reform for sustained growth."
 hint_oe_sit_v47_mamluk_suez_diplomatic: "Chartering Venetian Timber Convoys and the Cairo-Alexandria Spice Bourse advances both meters simultaneously while empowering burgher merchants and Karimi credit syndicates."
 hint_oe_sit_v47_mamluk_suez_military: "Deploying the Red Sea Heavy Artillery Armada (+12% Galley Power, +8% Naval Morale) and contesting Bab el-Mandeb secures decisive superiority over Portuguese carracks at Diu and Socotra."
 oe_sit_v47_samarkand_renaissance: "Ulugh Beg's Samarkand Renaissance & Gunpowder Crossroads"
 oe_sit_v47_samarkand_renaissance_desc: "In 1444, astronomer-king Ulugh Beg presides over Samarkand's unmatched marble Observatory and Registan scholars. Between 1444 and 1565, outmaneuver the 1449 palace conspiracy, publish the Zij-i-Sultani star tables, fuse trigonometry with heavy artillery casting, expand Silk Road caravanserais, and crown an Early Modern Central Asian scientific-gunpowder golden age!"
 oe_v47_samarkand_out_golden_age: "Samarkand Scientific-Gunpowder Golden Age"
 oe_v47_samarkand_out_golden_age_desc: "Defying the 1449 reaction, Ulugh Beg's Observatory and Ballistics Academy turn Transoxiana into Eurasia's radiant capital of empirical astronomy, rag-paper printing, and disciplined artillery."
 oe_v47_samarkand_out_reaction: "Eclipse of the Observatory & Scholarly Diaspora"
 oe_v47_samarkand_out_reaction_desc: "Dynastic strife dims Samarkand's political unity, scattering Ali Qushji's star scholars to Constantinople, Persia, and India—where their tables still transform Eurasian science."
 oe_v47_samarkand_out_crossroads: "Enduring Gunpowder Crossroads of Asia"
 oe_v47_samarkand_out_crossroads_desc: "By 1565, Transoxiana, Persia, and Northern India stand linked by fortified caravanserais, bronze foundries, and cosmopolitan scholarship."
 oe_v47_sam_map_timurid_tt: "#Y Timurid & Transoxiana Heartland#!: Samarkand, Bukhara, and Herat spearheading the Observatory Renaissance."
 oe_v47_sam_map_persia_tt: "#Y Persia & Safavid-Turkmen Rivals#!: Iranian plateau powers contesting Khorasan, silk tolls, and gunpowder hegemony."
 oe_v47_sam_map_india_tt: "#Y Northern India & Southern Horizon#!: Delhi, Lahore, and the Khyber approaches watched eagerly from Kabul."
 oe_v47_sam_map_silkroad_tt: "#Y Steppe & Silk Road Rim#!: Kashgar and Kipchak-Chagatai borders balancing caravan prosperity and nomad raids."
 oe_v47_sam_legend_timurid: "Timurid & Transoxiana Heartland"
 oe_v47_sam_legend_persia: "Persia & Safavid-Turkmen Rivals"
 oe_v47_sam_legend_india: "Northern India & Khyber Horizon"
 oe_v47_sam_legend_silkroad: "Steppe & Silk Road Rim"
 OE_V47_SAM_GUI_HDR_L: "Samarkand Science"
 OE_V47_SAM_GUI_HDR_R: "Timurid Cohesion"
 OE_V47_SAM_GUI_CARD_TITLE: "Observatory, Artillery & the Golden Silk Road"
 OE_V47_SAM_GUI_CARD_BODY: "Ulugh Beg's Observatory stands at the pinnacle of 15th-century astronomy—yet reactionary plots and rival mirzas threaten to shatter Transoxiana. Publish the Zij-i-Sultani, found the Samarkand Artillery Academy, expand Silk Road Caravanserais, endow Registan polymaths, and ratify the Mirza Accord. Reach 85+ Science and 70+ Cohesion to crown the Golden Age!"
 OE_V47_SAM_GUI_GAUGE_1: "Samarkand Scientific Breakthrough (85+ unlocks Golden Age)"
 OE_V47_SAM_GUI_GAUGE_2: "Timurid Cohesion (70+ secures Golden Age; <=20 triggers Observatory Eclipse)"
 OE_V47_SAM_GUI_FOOTNOTE: "Data Map: Turquoise = Timurid & Transoxiana Heartland; Crimson = Persia & Safavid Rivals; Saffron Gold = Northern India Horizon; Cobalt = Steppe & Silk Road Rim."
 hint_oe_sit_v47_samarkand_renaissance: "[GetSituationByKey('oe_sit_v47_samarkand_renaissance').GetNameWithNoTooltip]"
 hint_oe_sit_v47_samarkand_renaissance_hint_text: "#T Overview#!\n@hint! #Y Ulugh Beg's Samarkand Renaissance & Gunpowder Crossroads#! activates between #Y 1444 and 1565#! when a human plays in Central Asia, Persia, or Northern India (or when AI Alt-History is unleashed). Drive #Y Samarkand Science >= 85#! and #Y Timurid Cohesion >= 70#! to unlock the Scientific-Gunpowder Golden Age!"
 hint_oe_sit_v47_samarkand_renaissance_administrative: "Publish the Zij-i-Sultani (+12 Science) and pair it with the Samarkand Academy of Sciences government reform to trigger continuous monthly scientific gains while keeping Samarkand, Bukhara, and Herat stable."
 hint_oe_sit_v47_samarkand_renaissance_diplomatic: "Convene the Timurid Mirza Accord (+13 Cohesion, +8 Subject Loyalty) and expand the Silk Road Caravanserai Network before the 1449 conspiracy or Safavid clashes drain dynastic stability."
 hint_oe_sit_v47_samarkand_renaissance_military: "Founding the Samarkand Artillery & Ballistics Academy (+12% Artillery Power, +8% Siege Ability) and adopting Wagon-Fort Ballistics lets Transoxiana shatter both Kipchak cavalry and Safavid Qizilbash."
 oe_v47_act_suez_venetian_timber_convoy: "Charter Venetian Timber & Cannon Convoys"
 oe_v47_act_suez_venetian_timber_convoy_desc: "Contract Dalmatian oak, sails, and bronze cannon from the Venetian Arsenale to be hauled overland from Alexandria and Nile barges directly to Suez shipyards."
 oe_v47_act_suez_venetian_timber_convoy_tt: "Raises Suez Canal Progress by #G +10#! and Red Sea Spice Dominion by #G +8#!, and grants #Y Venetian Timber & Bronze Convoy#! for 12 years."
 oe_v47_act_suez_dredge_pharaonic_canal: "Excavate the Pharaonic-Mamluk Suez Canal"
 oe_v47_act_suez_dredge_pharaonic_canal_desc: "Mobilize Egyptian hydraulic engineers, stonecutters, and dredging crews to reopen the ancient Nile-to-Bitter Lakes channel and cut tidal locks straight to the Gulf of Suez."
 oe_v47_act_suez_dredge_pharaonic_canal_tt: "Raises Suez Canal Progress by #G +14#!, adds #G +6#! Prestige, and grants #Y Pharaonic-Mamluk Suez Excavation#! for 14 years."
 oe_v47_act_suez_diu_artillery_armada: "Deploy Red Sea Heavy Artillery Armada"
 oe_v47_act_suez_diu_artillery_armada_desc: "Launch bronze-armed Mediterranean galleasses from Suez and Jeddah in concert with Gujarati and Calicut squadrons to break Portuguese naval blockades in the Arabian Sea."
 oe_v47_act_suez_diu_artillery_armada_tt: "Raises Red Sea Spice Dominion by #G +12#!, adds #G +6#! Navy Tradition, and grants #Y Red Sea Heavy Artillery Armada#! for 12 years."
 oe_v47_act_suez_cairo_spice_bourse: "Charter the Cairo-Alexandria Spice Bourse"
 oe_v47_act_suez_cairo_spice_bourse_desc: "Establish uniform pepper grading, Karimi credit bills, and guaranteed Mediterranean auction halls in Cairo and Alexandria to outprice Lisbon's long Cape freight."
 oe_v47_act_suez_cairo_spice_bourse_tt: "Raises Red Sea Spice Dominion by #G +10#! and Suez Canal Progress by #G +5#!, and grants #Y Cairo-Alexandria Spice Bourse#! for 12 years."
 oe_v47_act_suez_cape_blockade_counter: "Contest the Bab el-Mandeb & Monsoon Lanes"
 oe_v47_act_suez_cape_blockade_counter_desc: "Dispatch fast monsoon cruisers and fortress garrisons across Socotra, Aden, and Diu: Portugal slashes Red Sea spice flows while Red Sea allies break the Atlantic stranglehold."
 oe_v47_act_suez_cape_blockade_counter_tt: "Shifts Red Sea Spice Dominion (#R -11#! if Portugal, #G +9#! for Red Sea & Indian Ocean allies) and grants #Y Monsoon Strait Commerce Warfare#! for 12 years."
 oe_v47_act_sam_zij_sultani_tables: "Publish the Zij-i-Sultani Star Tables"
 oe_v47_act_sam_zij_sultani_tables_desc: "Commission copies of Ulugh Beg's precision sine-tangent tables and 992-star catalogue on glazed Samarkand rag paper for scholars, navigators, and court calendars across Eurasia."
 oe_v47_act_sam_zij_sultani_tables_tt: "Raises Samarkand Science by #G +12#! and Timurid Cohesion by #G +4#!, adds #G +10#! Research Progress, and grants #Y Zij-i-Sultani Astronomical Tables#! for 14 years."
 oe_v47_act_sam_artillery_academy: "Found Samarkand Artillery & Ballistics Academy"
 oe_v47_act_sam_artillery_academy_desc: "Pair Observatory mathematicians with bronze cannon founders and corned-powder chemists to forge Asia's premier siege and wagon-fort artillery corps."
 oe_v47_act_sam_artillery_academy_tt: "Raises Samarkand Science by #G +11#! and Timurid Cohesion by #G +5#!, adds #G +6#! Army Tradition, and grants #Y Samarkand Ballistics & Artillery Academy#! for 14 years."
 oe_v47_act_sam_silk_caravanserai: "Expand the Silk Road Caravanserai Network"
 oe_v47_act_sam_silk_caravanserai_desc: "Erect fortified stone inns, cisterns, and customs posts linking Samarkand, Bukhara, Herat, and Kashgar so trans-Eurasian silk and spice caravans thrive despite maritime rivals."
 oe_v47_act_sam_silk_caravanserai_tt: "Raises Timurid Cohesion by #G +9#! and Samarkand Science by #G +5#!, and grants #Y Imperial Silk Road Caravanserai Network#! for 12 years."
 oe_v47_act_sam_patronize_madrasa: "Endow the Registan & Herat Polymath Circle"
 oe_v47_act_sam_patronize_madrasa_desc: "Award imperial waqf stipends to Ali Qushji's astronomers, Persian historians, glazed-tile architects, and Bihzad-school painters across Samarkand and Herat."
 oe_v47_act_sam_patronize_madrasa_tt: "Raises Samarkand Science by #G +10#! and Timurid Cohesion by #G +6#!, adds #G +8#! Prestige, and grants #Y Registan & Herat Polymath Circle#! for 14 years."
 oe_v47_act_sam_reconcile_mirzas: "Convene the Timurid Mirza Accord"
 oe_v47_act_sam_reconcile_mirzas_desc: "Summon rival Timurid princes, Chagatai begs, and Persian viziers to Samarkand to ratify clear succession rules and forestall reactionary palace coups."
 oe_v47_act_sam_reconcile_mirzas_tt: "Raises Timurid Cohesion by #G +13#!, adds #G +5#! Stability, and grants #Y Timurid Mirza Dynastic Accord#! for 14 years."
 oe_v47_ref_mamluk_red_sea_admiralty: "Mamluk Red Sea & Suez Admiralty"
 oe_v47_ref_mamluk_red_sea_admiralty_desc: "Institutes a permanent naval diwan governing Suez canal locks, Mediterranean-Red Sea timber slipways, and monsoon heavy-artillery squadrons—transforming an equestrian sultanate into a twin-sea commercial power at steep fleet upkeep and irritation to landed amirs."
 oe_v47_ref_samarkand_observatory_court: "Samarkand Academy of Sciences"
 oe_v47_ref_samarkand_observatory_court_desc: "Elevates Ulugh Beg's Observatory and Registan Madrasa into a sovereign ministerial academy uniting spherical trigonometry, calendar astronomy, and precision artillery metallurgy—accelerating research and firepower while testing conservative clerics and palace budgets."
 oe_v47_ref_andalusian_convivencia: "Neo-Cordoban Convivencia Charter"
 oe_v47_ref_andalusian_convivencia_desc: "Restores the legendary civic pluralism of Caliphal Cordoba and Nasrid Granada across Iberia and the Maghreb, protecting Muslim, Christian, and Jewish scholars, physicians, and maritime merchants in shared guild courts while slowing religious conversion and chafing zealous clergy."
 oe_v47_ref_three_crowns_crusade_council: "Danube-Bosphorus Crusade Diet"
 oe_v47_ref_three_crowns_crusade_council_desc: "Institutionalizes a permanent joint war-diet uniting Hungarian, Polish-Lithuanian, Bohemian, and Balkan Christian estates in the spirit of a victorious Crusade of Varna—forging formidable siege discipline and coalition diplomacy at heavy army upkeep and hardened frontier intolerance."
 oe_v47_eu2.1.title: "Qansuh al-Ghuri's Red Sea War Council"
 oe_v47_eu2.1.desc: "Disturbing dispatches from Calicut, Aden, and Alexandria have reached the Citadel of Cairo: armed Portuguese carracks have rounded the Cape of Good Hope, shelling monsoon merchantmen and threatening to strangle the ancient Red Sea spice lifeline that funds both the Mamluk treasury and Venetian galleys. Sultan Qansuh al-Ghuri summons his senior amirs, Karimi guild masters, and Venetian envoys before parchment charts of the Isthmus of Suez. If Egypt merely waits behind its desert dunes, Cairo's customs houses will wither—yet by reopening the ancient Pharaonic canal and launching a heavy-gunned Red Sea armada, the twin seas could remain ours forever."
 oe_v47_eu2.1.a: "Launch the Grand Suez Canal & Red Sea Armada strategy in league with Venice."
 oe_v47_eu2.1.b: "Prioritize emergency Indian Ocean war-galleys and shore batteries at Jeddah and Aden."
 oe_v47_eu2.1.c: "Avoid reckless maritime spending and levy defensive transit tolls across Syria and Egypt."
 oe_v47_eu2.2.title: "Venetian Timber & Bronze Cannon Convoys"
 oe_v47_eu2.2.desc: "Egypt commands vast grain harvests and gold dinars, yet lacks the tall pine and oak forests required to frame heavy broadside hulls. Under cover of diplomatic secrecy in Alexandria, agents of the Venetian Senate—facing ruin if Lisbon steals the spice trade—unveil an audacious bargain: prefabricated Dalmatian timber ribs, tarred rigging, shipwrights from the famed Arsenale, and heavy cast-bronze culverins shipped to Rosetta, floated up the Nile, and carried by camel trains straight to the slipways of Suez. Yet Papal spies already whisper of Christian cannon arming a Muslim Sultanate."
 oe_v47_eu2.2.a: "Sign the Alexandria Timber-and-Ordnance Compact and expand Suez slipways immediately."
 oe_v47_eu2.2.b: "Purchase the timber and cannon outright while training native Egyptian master founders."
 oe_v47_eu2.2.c: "Refuse foreign middlemen and harvest cedar from Lebanon and Cilicia instead."
 oe_v47_eu2.3.title: "Amir Husain al-Kurdi & the Armada of Suez"
 oe_v47_eu2.3.desc: "Along the sandy quays of Suez and Jeddah, a sight never before witnessed on the Red Sea greets the dawn tide: a squadron of heavy Mediterranean-pattern war-galleys and roundships bristling with brass bow-chasers, flanked by swift Arab sambuks packed with skilled Levantine mariners and armored Mamluk marksmen. Commanded by Amir Husain al-Kurdi, the armada awaits the Sultan's final marching orders before riding the monsoon eastward toward Chaul and Diu to join the fleets of Gujarat and Calicut. Every cannonball loaded into their holds carries the fate of Mediterranean-Indian commerce."
 oe_v47_eu2.3.a: "Grant Husain full naval authority and double his gunpowder and bronze-shot reserves."
 oe_v47_eu2.3.b: "Hold half the squadron at Bab el-Mandeb to guarantee Red Sea ports stay impregnable."
 oe_v47_eu2.3.c: "Rely on swift privateering dhows to bleed Portuguese convoys without risking heavy hulls."
 oe_v47_eu2.4.title: "The Battle of Diu Reversal"
 oe_v47_eu2.4.desc: "Thunder rolls across the turquoise waters off the island fortress of Diu as the Portuguese Viceroy's cross-sailed carracks bear down on the allied Mamluk, Gujarati, and Calicut line of battle. In another timeline, divided command and short supplies doomed the allied fleet inside the harbor; today, bolstered by Venetian heavy bronze ordnance, disciplined coastal fire from Malik Ayaz's bastions, and coordinated oared flanking squadrons, the coalition stands poised to shatter the Atlantic newcomers in open water. A decisive reversal at Diu will echo from Lisbon to Cairo for a century."
 oe_v47_eu2.4.a: "Press the coordinated crossfire from shore batteries and galleasses to crush the Cape fleet!"
 oe_v47_eu2.4.b: "Seize damaged Portuguese carracks intact to study Atlantic ocean-going hull design."
 oe_v47_eu2.4.c: "Negotiate a maritime partition recognizing Goa for Lisbon and Diu-Red Sea for our coalition."
 oe_v47_eu2.5.title: "Digging the Ancient Canal of the Pharaohs"
 oe_v47_eu2.5.desc: "Surveyors riding along the arid Wadi Tumilat have uncovered the sunken limestone embankments of the ancient Canal of Pharaoh Necho, Darius, and Caliph Umar—silted over since Abbasid times yet still tracing a natural low corridor from Cairo's Pelusiac Nile branch through Lake Timsah and the Bitter Lakes to the Red Sea at Suez. Venetian hydraulic consultants and Egyptian irrigation masters present the Sultan with an epoch-making blueprint: dredge the old prism wider, face the banks with quarry stone, and let cargo hulks sail unbroken from Alexandria to Calicut."
 oe_v47_eu2.5.a: "Commit the full treasury and imperial corvee to excavate a deep ship-bearing canal."
 oe_v47_eu2.5.b: "Finance the excavation with paid artisan guilds and Venetian-Karimi toll bonds."
 oe_v47_eu2.5.c: "Build a paved Cairo-Suez stone haulage road and fortified caravan depots instead."
 oe_v47_eu2.6.title: "Hydraulic Locks of the Bitter Lakes"
 oe_v47_eu2.6.desc: "Halfway through the Suez excavation, a formidable engineering dread grips the work camps: ancient Greek geographers warned that the Red Sea stands higher than the Delta at spring tide, threatening to flood Lower Egypt's emerald fields with salt water if cut through recklessly. Yet Venetian lock-engineers fresh from Lombardy's stepped miter-gate canals demonstrate that three paired limestone locks anchored in the natural basin of the Bitter Lakes will neutralize every tidal surge while letting Nile sweet water flush the channel clean."
 oe_v47_eu2.6.a: "Construct the triple-chamber Bitter Lakes miter locks—engineering mastery for the ages!"
 oe_v47_eu2.6.b: "Dig dual seasonal lock-basins tied strictly to the annual Nile flood calendar."
 oe_v47_eu2.6.c: "Halt direct sea-cutting and operate a dry-slipway roller portage across the final dune ridge."
 oe_v47_eu2.7.title: "The Karimi Spice Guilds & Gujarati Factors"
 oe_v47_eu2.7.desc: "For decades, heavy royal pepper monopolies had starved Cairo's famed Karimi merchant dynasties—once the richest private bankers between Venice and Cambay—forcing them to hoard silver underground. Now, as Gujarati muslin magnates and Yemeni coffee brokers arrive in Suez seeking reliable credit against Portuguese disruption, the Karimi syndics petition the Sultan for a Grand Commercial Restoration: abolish arbitrary price seizures in exchange for permanent joint-stock spice convoys, marine insurance, and low-interest war loans for the Red Sea Admiralty."
 oe_v47_eu2.7.a: "Restore Karimi autonomy and charter joint Egyptian-Gujarati warehouse syndicates."
 oe_v47_eu2.7.b: "Create a mixed Crown-Karimi spice bank sharing profits equally between treasury and merchants."
 oe_v47_eu2.7.c: "Retain strict royal pepper monopolies to fund palace garrisons directly."
 oe_v47_eu2.8.title: "Boom of the Cairo-Alexandria Spice Bourse"
 oe_v47_eu2.8.desc: "Across the vaulted bazaars of Khan el-Khalili and the sunlit quays of Alexandria, a scent of Malabar black pepper, Moluccan cloves, Banda nutmeg, and Yemeni mocha fills the air as ships discharge cargoes straight from the Suez roadstead. Florentine, Ragusan, Genoese, and Venetian gold ducats cascade onto marble counting tables—for spice delivered via the Red Sea arrives six months fresher and far cheaper than storm-battered Atlantic cargoes hauled around Africa. Our ministers urge us to codify this golden boom into an enduring international bourse."
 oe_v47_eu2.8.a: "Codify open-market spice futures and standardized weight assays in Cairo and Alexandria."
 oe_v47_eu2.8.b: "Plow the sudden customs windfall directly into stone canal quays and Red Sea dockyards."
 oe_v47_eu2.8.c: "Distribute silver bonuses to royal troops and endow magnificent Cairo mosques and colleges."
 oe_v47_eu2.9.title: "Portuguese Raid on Socotra & Bab el-Mandeb"
 oe_v47_eu2.9.desc: "Alarm bells ring from the watchtowers of Aden to the Pilgrim Quay of Jeddah: a daring Portuguese squadron under Afonso de Albuquerque has struck Socotra Island and slipped into the mouth of the Bab el-Mandeb, attempting to bottle up the Red Sea from the outside and burn spice freighters bound for Suez. Though fierce crosswinds and coral reefs hamper their heavy Atlantic hulls inside the narrow sea, merchants already panic at rising freight rates. Unless we fortify the Gate of Tears and drive the raiders back into the open ocean, our Red Sea boom could suffocate."
 oe_v47_eu2.9.a: "Fortify Kamaran, Aden, and Jeddah with star-angled heavy cannon bastions and counterattack!"
 oe_v47_eu2.9.b: "Enlist Ethiopian highland scouts and Yemeni dhows to cut off Portuguese water supplies."
 oe_v47_eu2.9.c: "Reroute vulnerable cargoes temporarily through Basra and Hormuz until the raiders depart."
 oe_v47_eu2.10.title: "The Zamorin of Calicut & the Malabar Pepper Pact"
 oe_v47_eu2.10.desc: "Envoys of the Zamorin of Kozhikode—sovereign of India's richest black-pepper coast—disembark at Suez carrying carved teak chests, gold coins, and urgent diplomatic seals. Outraged by European attempts to monopolize Malabar's ancient free ports, the Zamorin proposes a permanent Monsoon Maritime Pact uniting Cairo, Venice, Gujarat, and Calicut: Malabar shipyards will supply rot-resistant teak hulls and fearless Kunjali Marakkar captains, while Egypt guarantees brass cannon, silver bullion, and safe winter anchorage inside the Red Sea."
 oe_v47_eu2.10.a: "Ratify the Malabar-Red Sea Teak & Pepper Pact and exchange permanent naval consuls."
 oe_v47_eu2.10.b: "Commission Indian teak flagship hulls built specifically for the Suez-Malabar run."
 oe_v47_eu2.10.c: "Accept commercial friendship only and avoid binding defense treaties across the ocean."
 oe_v47_eu2.11.title: "Gunpowder Modernizers Against Traditional Cavalry"
 oe_v47_eu2.11.desc: "The same cannon foundries and naval gunnery schools that revived Egypt's Red Sea fortunes have sparked a fierce political storm inside the Citadel of Cairo. Younger officers and admirals point to the disciplined matchlock and field-artillery corps rising in Anatolia and Europe, warning that traditional furusiyya lance charges alone can no longer defend Syria or the new Suez Canal. Yet proud senior Mamluk amirs slam their curved sabers on the council floor, scorning firearms as ignoble weapons that threaten their ancient equestrian supremacy."
 oe_v47_eu2.11.a: "Enact the Fifth Corps gunpowder reform—matchlocks, field cannon, and naval marines!"
 oe_v47_eu2.11.b: "Confine firearms to the Red Sea Admiralty and fortress garrisons to soothe landed amirs."
 oe_v47_eu2.11.c: "Uphold the chivalric furusiyya order and hire foreign gunners only during active campaigns."
 oe_v47_eu2.12.title: "Ceremony of the Two Seas: Red Sea Thalassocracy"
 oe_v47_eu2.12.desc: "Trumpets, kettle-drums, and thunderous bronze salutes echo across the newly cut stone quay of Suez as the final timber cofferdam parts—and Mediterranean galleasses draped in crimson, gold, and Venetian banners glide smoothly through the Bitter Lakes locks into the sunlit Red Sea. Crowds of Egyptian engineers, Karimi bankers, Venetian consuls, and Gujarati captains cheer from the embankments. What Europe only dreamed of achieving three centuries later has dawned in the Renaissance: an unbroken twin-sea thalassocracy pivoting around Cairo and Suez."
 oe_v47_eu2.12.a: "Proclaim the Canal of Two Seas open to allied fleets under imperial Suez customs!"
 oe_v47_eu2.12.b: "Establish a joint Cairo-Venice-Calicut Naval Board to patrol both seas permanently."
 oe_v47_eu2.12.c: "Fortify the locks as a royal strategic monopoly and tax every passing hull handsomely."
 oe_v47_eu2.13.title: "Ulugh Beg's Giant Marble Sextant & Zij-i-Sultani"
 oe_v47_eu2.13.desc: "Beneath the turquoise dome rising on Kuhak Hill above Samarkand, the astronomer-king Ulugh Beg descends into the subterranean marble trench of his forty-meter Fakhrī sextant. Guided by a razor-thin shaft of noon sunlight, his scholars Qadi Zada and Ali Qushji record the obliquity of the ecliptic and the exact length of the sidereal year to within a single minute—outstripping every observatory in Europe, China, and the Islamic world. Yet outside the marble walls, jealous courtiers and rigid factions mutter that a prince who gazes at stars neglects the sword."
 oe_v47_eu2.13.a: "Proclaim the Zij-i-Sultani across Eurasia and endow permanent imperial professorships!"
 oe_v47_eu2.13.b: "Apply the Observatory's trigonometry immediately to artillery rangefinding and land surveying."
 oe_v47_eu2.13.c: "Present the star tables humbly as a devotional calendar aid to disarm clerical critics."
 oe_v47_eu2.14.title: "Surviving the 1449 Conspiracy of Abd al-Latif"
 oe_v47_eu2.14.desc: "A chilling coded letter intercepted outside the gates of Samarkand reveals treason at the very heart of the throne: alienated prince Abd al-Latif has forged a dark coalition with reactionary dervishes and disgruntled Chagatai begs, plotting to ambush Ulugh Beg on the banks of the Amu Darya, seize the Registan, and smash the great Observatory to rubble. History hangs on a knife's edge—if the loyal citadel guards strike first before the conspirators rally their horsemen, Central Asia's scientific dawn will survive its darkest hour!"
 oe_v47_eu2.14.a: "Unleash the loyal Citadel Guard and royal gunners to arrest the conspirators before dawn!"
 oe_v47_eu2.14.b: "Grant Balkh as an honored frontier viceroyalty to split the rebel princes peacefully."
 oe_v47_eu2.14.c: "Concede judicial oversight of the madrasas to conservative jurists in exchange for peace."
 oe_v47_eu2.15.title: "The Compact of Samarkand & Herat Mirzas"
 oe_v47_eu2.15.desc: "Ever since Timur's passing, the curse of Turco-Mongol lateral succession has bled Transoxiana and Khorasan dry—every generation, princely brothers governing Herat, Samarkand, Shiraz, and Kabul turn their brilliant courts against one another until steppe nomads pick off the ruins. Standing beneath the gilded mosaic arches of the Gur-e-Amir, senior Persian viziers and Timurid elders propose a radical constitutional cure: establish a permanent Council of Mirzas fixing the senior throne in Samarkand while guaranteeing Herat and Kabul autonomous cultural appanages."
 oe_v47_eu2.15.a: "Ratify the Mirza Dynastic Accord—binding Samarkand, Herat, and Kabul in shared law."
 oe_v47_eu2.15.b: "Replace princely appanages with salaried Persian-Turkic provincial governors loyal only to the crown."
 oe_v47_eu2.15.c: "Preserve traditional nomadic kurultai assemblies and let martial merit decide each prince's share."
 oe_v47_eu2.16.title: "The Samarkand Artillery & Ballistics Academy"
 oe_v47_eu2.16.desc: "A revolutionary marriage of pure mathematics and bronze metallurgy is unfolding beside the Zarafshan River. Astronomers trained on Ulugh Beg's precision quadrants have joined forces with Syrian, Ottoman, and Chinese-trained foundry masters to test standardized gunpowder granulation, graduated elevation sights, and heavy siege bombards cast in single-piece molds. On the proving ground outside Samarkand, three calculated salvos bring down a simulated stone bastion from twice the customary range—proving that Central Asia's mathematicians can forge the deadliest artillery on earth."
 oe_v47_eu2.16.a: "Establish the Royal Samarkand Artillery & Ballistics Academy with full foundry funding."
 oe_v47_eu2.16.b: "Focus on light camel-mounted swivel guns (zamburaks) ideal for swift Transoxiana campaigns."
 oe_v47_eu2.16.c: "Export surplus bronze castings to neighboring courts to fill Samarkand's silver coffers."
 oe_v47_eu2.17.title: "Ali Qushji & the Planetary Motion Debate"
 oe_v47_eu2.17.desc: "Inside the tiled lecture hall of the Registan Madrasa, Ulugh Beg's brilliant pupil Ali Qushji stands before a rapt assembly of mathematicians, physicians, and visiting envoys from Constantinople, Tabriz, and Delhi. Unrolling geometric diagrams of Mercury and Earth, Qushji boldly argues that astronomy must break free from rigid Aristotelian metaphysics and rely strictly on empirical observation and mathematical proof—even demonstrating that a rotating Earth contradicts no observed phenomenon. Embracing such audacious inquiry could ignite a true scientific revolution a century ahead of Europe."
 oe_v47_eu2.17.a: "Shield Ali Qushji's empirical school by royal charter and fund open mathematical disputations!"
 oe_v47_eu2.17.b: "Circulate Qushji's treatises quietly among court astronomers and diplomatic scholars abroad."
 oe_v47_eu2.17.c: "Restrict radical planetary hypotheses to preserve orthodoxy among traditional ulema."
 oe_v47_eu2.18.title: "Stone Caravanserais of the Golden Road"
 oe_v47_eu2.18.desc: "While oceanic navigators test the coasts of Africa and India, the beating continental heart of Eurasia still pulses along the Golden Road to Samarkand. Bactrian camel trains bearing Ming porcelain, Bukharan silk, Badakhshan lapis lazuli, and Khorasan steel converge beneath the city's domed bazaars—provided bandits and feudal tolls do not bleed them dry. Imperial road inspectors present an ambitious plan to build a chain of domed stone caravanserais with vaulted cisterns, moneychangers, and state escort riders every thirty miles from Kashgar to Tabriz."
 oe_v47_eu2.18.a: "Build the full Imperial Caravanserai Network and guarantee state compensation for plundered caravans!"
 oe_v47_eu2.18.b: "Grant tax-free market quarters in Samarkand to Chinese, Indian, and Levantine merchant guilds."
 oe_v47_eu2.18.c: "Raise transit customs along the Amu Darya crossings to maximize immediate treasury revenue."
 oe_v47_eu2.19.title: "Samarkand Paper Mills & Multilingual Codices"
 oe_v47_eu2.19.desc: "Along the swift irrigation canals ringing Samarkand, dozens of waterwheels turn heavy wooden trip-hammers that pound mulberry bark and linen rags into the world's finest writing paper—silky, luminous, and prized from Cairo and Florence to Agra and Beijing. Now master papermakers and woodblock carvers propose expanding these mills into an imperial publishing district producing standardized textbooks of algebra, medicine, Persian poetry, and artillery manuals in Persian, Chagatai Turkic, and Arabic—multiplying administrative literacy across every province."
 oe_v47_eu2.19.a: "Charter the Samarkand Water-Powered Paper & Publishing Quarter for scientific codices."
 oe_v47_eu2.19.b: "Export luxury illuminated manuscripts and gilded Samarkand paper to foreign royal courts."
 oe_v47_eu2.19.c: "Keep manuscript copying inside royal chanceries to safeguard state cartographic secrets."
 oe_v47_eu2.20.title: "Steppe Horsemen vs the Wagon-Fort Artillery"
 oe_v47_eu2.20.desc: "Clouds of yellow dust rise along the northern Syr Darya frontier as vast Uzbek and Kipchak steppe confederations mass tens of thousands of swift horse archers poised to sweep down into the lush orchards of Transoxiana. Historically, traditional Timurid cavalry was outmaneuvered and broken on the open steppe—yet our Samarkand artillery scholars have studied Anatolian and Bohemian tabur wagon-forts. By chaining hundreds of reinforced gun-carts into a rolling fortress bristling with matchlocks and bronze falconets, we can turn the northern frontier into a graveyard for steppe invasions."
 oe_v47_eu2.20.a: "Deploy the Chained Wagon-Fort & Matchlock Doctrine to break the steppe storm!"
 oe_v47_eu2.20.b: "Fortify the Syr Darya river crossings and buy allied steppe clans with Samarkand silver."
 oe_v47_eu2.20.c: "Meet the nomads horse-to-horse with traditional Chagatai heavy lancers and bowmen."
 oe_v47_eu2.21.title: "Safavid Qizilbash & the Clash for Khorasan"
 oe_v47_eu2.21.desc: "Across the Iranian plateau, charismatic crimson-turbaned Qizilbash warriors and resurgent Turkmen dynasties are forging a militant new power from Tabriz to Isfahan, casting covetous eyes on the prized jewel of Herat and the silk depots of Khorasan. Religious fervor collides with gunpowder statecraft along the dry plains of Merv and Mashhad. Whether we crush the western rivals with Samarkand's superior siege parks or broker a Perso-Timurid cultural detente will redraw the entire balance of the Islamic East."
 oe_v47_eu2.21.a: "March west with our Samarkand artillery train to secure Herat and Khorasan decisively!"
 oe_v47_eu2.21.b: "Propose a Perso-Timurid Silk Concord opening safe pilgrimage and scholar exchanges."
 oe_v47_eu2.21.c: "Fortify the Amu Darya defense line and preserve our main strength for Transoxiana."
 oe_v47_eu2.22.title: "Herat's Golden Atelier & Bihzad's Workshop"
 oe_v47_eu2.22.desc: "Not since the finest days of Baghdad or Florence has a single court gathered such luminous talent: in the cypress gardens of Herat and the tiled portals of Samarkand, the master painter Kamal ud-Din Bihzad breathes lifelike individuality into every miniature, poet-statesman Ali-Shir Nava'i elevates Chagatai Turkic alongside classical Persian into a sublime literary language, and architects perfect soaring ribbed turquoise domes. Funding this twin artistic-scientific Renaissance will make our capital the cultural envy of Eurasia."
 oe_v47_eu2.22.a: "Endow the Royal Kitabkhana of Herat and Samarkand for Bihzad, Nava'i, and master architects!"
 oe_v47_eu2.22.b: "Pair the miniature artists with Observatory cartographers to craft illustrated scientific atlases."
 oe_v47_eu2.22.c: "Keep court patronage modest and channel surplus coin into frontier garrisons."
 oe_v47_eu2.23.title: "Babur's Southern Horizon: Kabul & the Khyber Pass"
 oe_v47_eu2.23.desc: "From the cool mountain gardens of Kabul, a young Timurid visionary named Zahir-ud-Din Muhammad Babur gazes down the winding gorges of the Khyber Pass toward the shimmering plains of Punjab and Hindustan. In another history, exile from Samarkand forced him southward in desperation; in this blossoming Timurid Renaissance, a unified Transoxiana armed with Samarkand bronze cannon, disciplined matchlocks, and Persian statecraft can either launch a glorious southern expansion into Delhi or forge a prosperous Trans-Himalayan trade commonwealth stretching from the Oxus to the Ganges."
 oe_v47_eu2.23.a: "Arm Babur's Kabul-Khyber Gunpowder Vanguard and project imperial might toward Hindustan!"
 oe_v47_eu2.23.b: "Turn Kabul into a grand Indo-Central Asian customs hub linking Indian calico with Silk Road silver."
 oe_v47_eu2.23.c: "Recall Babur's talents northward to strengthen Samarkand's home defenses and academy."
 oe_v47_eu2.24.title: "Meridian of Eurasia: The Samarkand Scientific Dawn"
 oe_v47_eu2.24.desc: "Envoys from Venice, Cairo, Istanbul, Agra, and Beijing gather beneath the dazzling turquoise minarets of Registan Square to witness a marvel unmatched anywhere on the globe: Ulugh Beg's surviving Observatory, expanded with brass astrolabes, precision clocks, paper presses, and a royal ballistics academy, now sets the prime meridian for maps from the Mediterranean to the Yellow Sea. What began as a lone astronomer-king's fragile dream has blossomed into an Early Modern Central Asian Renaissance uniting pure science, Silk Road commerce, and disciplined gunpowder arms."
 oe_v47_eu2.24.a: "Proclaim the Samarkand Prime Meridian & Eurasia Academy of Sciences!"
 oe_v47_eu2.24.b: "Standardize imperial gunpowder, coinage, and weights from the Oxus to the Hindu Kush."
 oe_v47_eu2.24.c: "Dispatch Samarkand scholarly embassies to Cairo, Europe, and India to spread our star tables."
