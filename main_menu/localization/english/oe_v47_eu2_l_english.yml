 STATIC_MODIFIER_DESC_oe_v47_mod_red_sea_armada: "Mediterranean-style oared galleasses mounted with heavy basilisk bow cannon patrol from Suez to Diu, projecting unmatched naval firepower at steep fleet upkeep."
