 oe_v47_mod_suez_thalassocracy: "Canal of Two Seas Thalassocracy"
 STATIC_MODIFIER_NAME_oe_v47_mod_suez_thalassocracy: "Canal of Two Seas Thalassocracy"
 STATIC_MODIFIER_DESC_oe_v47_mod_suez_thalassocracy: "Direct waterborne passage from Alexandria through the Nile and Suez to the Indian Ocean cements an unassailable Mediterranean-Monsoon commercial empire at permanent hydraulic upkeep."
 oe_v47_mod_cape_spice_monopoly: "Cape of Good Hope Spice Monopoly"
 STATIC_MODIFIER_NAME_oe_v47_mod_cape_spice_monopoly: "Cape of Good Hope Spice Monopoly"
 STATIC_MODIFIER_DESC_oe_v47_mod_cape_spice_monopoly: "Atlantic carracks rounding southern Africa divert Indian pepper away from the Red Sea, enriching Lisbon's Casa da India while stretching oceanic supply lines."
 oe_v47_mod_levant_trade_recalibration: "Levantine Customs Recalibration"
 STATIC_MODIFIER_NAME_oe_v47_mod_levant_trade_recalibration: "Levantine Customs Recalibration"
 STATIC_MODIFIER_DESC_oe_v47_mod_levant_trade_recalibration: "With oceanic spices siphoned around the Cape, Eastern Mediterranean ports refocus on overland silk, textiles, and tighter domestic fiscal discipline."
 oe_v47_mod_dual_spice_equilibrium: "Twin-Corridor Spice Equilibrium"
 STATIC_MODIFIER_NAME_oe_v47_mod_dual_spice_equilibrium: "Twin-Corridor Spice Equilibrium"
 STATIC_MODIFIER_DESC_oe_v47_mod_dual_spice_equilibrium: "Both Red Sea convoys and Atlantic carracks share the Eurasian spice tide under negotiated port tariffs, sustaining broad prosperity at tighter merchant margins."
 oe_v47_mod_karimi_guild_revival: "Revived Karimi Spice Syndicate"
 STATIC_MODIFIER_NAME_oe_v47_mod_karimi_guild_revival: "Revived Karimi Spice Syndicate"
 STATIC_MODIFIER_DESC_oe_v47_mod_karimi_guild_revival: "Restoring tax privileges and armed warehouses to Egypt's legendary Karimi merchant families revives Red Sea credit while curtailing direct crown monopolies."
 oe_v47_mod_bitter_lakes_hydraulics: "Bitter Lakes Tidal Lock Engineering"
 STATIC_MODIFIER_NAME_oe_v47_mod_bitter_lakes_hydraulics: "Bitter Lakes Tidal Lock Engineering"
 STATIC_MODIFIER_DESC_oe_v47_mod_bitter_lakes_hydraulics: "Stepped masonry sluices reconcile the Red Sea tide with the Nile flood, accelerating inland transport and provincial growth while demanding constant masonry upkeep."
 oe_v47_mod_mamluk_gunpowder_corps: "Reformed Mamluk Fifth Corps Musketeers"
 STATIC_MODIFIER_NAME_oe_v47_mod_mamluk_gunpowder_corps: "Reformed Mamluk Fifth Corps Musketeers"
 STATIC_MODIFIER_DESC_oe_v47_mod_mamluk_gunpowder_corps: "Drilling salaried arquebusiers and naval gunners alongside traditional furusiyya horsemen modernizes Egyptian arms while provoking fierce pride among conservative amirs."
 oe_v47_mod_zij_sultani_tables: "Zij-i-Sultani Astronomical Tables"
 STATIC_MODIFIER_NAME_oe_v47_mod_zij_sultani_tables: "Zij-i-Sultani Astronomical Tables"
 STATIC_MODIFIER_DESC_oe_v47_mod_zij_sultani_tables: "Ulugh Beg's trigonometric sine tables and 992-star catalogue set the Eurasian benchmark for navigation, surveying, and calendars, irritating rigid court reactionaries."
 oe_v47_mod_samarkand_artillery_academy: "Samarkand Ballistics & Artillery Academy"
 STATIC_MODIFIER_NAME_oe_v47_mod_samarkand_artillery_academy: "Samarkand Ballistics & Artillery Academy"
 STATIC_MODIFIER_DESC_oe_v47_mod_samarkand_artillery_academy: "Applying Samarkand trigonometry directly to bronze casting, gunpowder granulation, and siege elevation creates devastating artillery parks at heavy foundry expense."
 oe_v47_mod_silk_caravanserai_net: "Imperial Silk Road Caravanserai Network"
 STATIC_MODIFIER_NAME_oe_v47_mod_silk_caravanserai_net: "Imperial Silk Road Caravanserai Network"
 STATIC_MODIFIER_DESC_oe_v47_mod_silk_caravanserai_net: "Fortified stone inns spaced a day's march apart from Herat to Kashgar protect silk, porcelain, and paper caravans, enriching overland trade while taxing fortress maintenance."
 oe_v47_mod_registan_polymaths: "Registan & Herat Polymath Circle"
 STATIC_MODIFIER_NAME_oe_v47_mod_registan_polymaths: "Registan & Herat Polymath Circle"
 STATIC_MODIFIER_DESC_oe_v47_mod_registan_polymaths: "Astronomers, algebraists, architects, and Bihzad-school miniaturists flock to turquoise-tiled madrasas, radiating unmatched cultural prestige at steep court patronage cost."
 oe_v47_mod_mirza_dynastic_accord: "Timurid Mirza Dynastic Accord"
 STATIC_MODIFIER_NAME_oe_v47_mod_mirza_dynastic_accord: "Timurid Mirza Dynastic Accord"
 STATIC_MODIFIER_DESC_oe_v47_mod_mirza_dynastic_accord: "Codified appanage courts in Samarkand, Herat, and Kabul replace fratricidal succession wars with consultative councils, stabilizing the realm while moderating crown absolutism."
 oe_v47_mod_samarkand_golden_age: "Samarkand Scientific-Gunpowder Golden Age"
 STATIC_MODIFIER_NAME_oe_v47_mod_samarkand_golden_age: "Samarkand Scientific-Gunpowder Golden Age"
 STATIC_MODIFIER_DESC_oe_v47_mod_samarkand_golden_age: "Where Ulugh Beg's observatory outlives the 1449 reaction, Central Asia emerges as Eurasia's foremost nexus of precision astronomy, artillery metallurgy, and Silk Road learning, demanding vast scholarly budgets."
 oe_v47_mod_samarkand_diaspora_scholars: "Diaspora of the Samarkand Astronomers"
 STATIC_MODIFIER_NAME_oe_v47_mod_samarkand_diaspora_scholars: "Diaspora of the Samarkand Astronomers"
 STATIC_MODIFIER_DESC_oe_v47_mod_samarkand_diaspora_scholars: "Even after political strife dims Transoxiana, exiled pupils of Ali Qushji carry Samarkand star tables and algebra to courts from Anatolia to Hindustan, leaving fractured cohesion behind."
 oe_v47_mod_silk_gunpowder_crossroads: "Enduring Gunpowder Crossroads of Asia"
 STATIC_MODIFIER_NAME_oe_v47_mod_silk_gunpowder_crossroads: "Enduring Gunpowder Crossroads of Asia"
 STATIC_MODIFIER_DESC_oe_v47_mod_silk_gunpowder_crossroads: "Fortified oases, bronze foundries, and cosmopolitan caravanserais anchor the balance between Persia, Transoxiana, and Northern India under vigilant military readiness."
 oe_v47_mod_samarkand_rag_paper_mills: "Samarkand Water-Powered Paper Mills"
 STATIC_MODIFIER_NAME_oe_v47_mod_samarkand_rag_paper_mills: "Samarkand Water-Powered Paper Mills"
 STATIC_MODIFIER_DESC_oe_v47_mod_samarkand_rag_paper_mills: "Silky, glazed Samarkand rag paper feeds chanceries, astronomical codices, and Persian illumination ateliers across Eurasia, lifting literacy and production while straining guild oversight."
 oe_v47_mod_wagon_fort_ballistics: "Timurid Wagon-Fort & Matchlock Doctrine"
 STATIC_MODIFIER_NAME_oe_v47_mod_wagon_fort_ballistics: "Timurid Wagon-Fort & Matchlock Doctrine"
 STATIC_MODIFIER_DESC_oe_v47_mod_wagon_fort_ballistics: "Chained artillery carts and disciplined matchlock volleys shatter steppe shock charges on open plains, trading rapid nomadic maneuver for formidable battlefield discipline."
 oe_v47_mod_khyber_southern_expedition: "Kabul-Khyber Gunpowder Vanguard"
 STATIC_MODIFIER_NAME_oe_v47_mod_khyber_southern_expedition: "Kabul-Khyber Gunpowder Vanguard"
 STATIC_MODIFIER_DESC_oe_v47_mod_khyber_southern_expedition: "Combining Transoxiana's astronomical engineering, Ottoman-trained gunners, and swift mountain cavalry turns the Hindu Kush passes into a springboard toward Hindustan at steep logistics cost."
