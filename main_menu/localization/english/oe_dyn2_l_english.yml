 oe_dyn2.1.title: "Imperial House Ascendant"
 oe_dyn2.1.desc: "From gilded banquet halls to distant border marches, chroniclers now name our ruling dynasty among the premier sovereign houses of the age. Foreign envoys vie for marriage alliances while junior kinsmen look to the senior throne for titles and leadership."
 oe_dyn2.1.a: "Proclaim a Cross-Realm Dynastic Compact"
 oe_dyn2.1.b: "Enfeoff Cadet Branches Across the Realm"
 oe_dyn2.2.title: "Cadet Branch Ambition & House Law"
 oe_dyn2.2.desc: "As our royal family multiplies across provincial estates and court offices, ambitious cadet princes have begun contesting precedence, stipends, and appanage rights. Left unsettled, these rivalries could fracture dynastic solidarity."
 oe_dyn2.2.a: "Codify Strict Senior-Line House Statutes"
 oe_dyn2.2.b: "Grant Honored Appanage Charters in Concord"
 oe_dyn2.3.title: "Triumph of the Royal Curriculum"
 oe_dyn2.3.desc: "Before an assembly of grandees, senior tutors, and veteran generals, our heir delivered a commanding demonstration of classical statecraft and strategic discernment. The court whispers that the next reign may surpass our own."
 oe_dyn2.3.a: "Crown the Heir in Rhetoric and Statecraft"
 oe_dyn2.3.b: "Send the Heir to Command the Frontier Watch"
 oe_dyn2.4.title: "Codification of Imperial Succession"
 oe_dyn2.4.desc: "Succession crises have brought down empires richer and older than ours. Senior jurists have laid two tested imperial charters before the throne: crowning a co-emperor openly during the ruler's lifetime, or sealing the chosen heir's name in a secret golden casket until the final hour."
 oe_dyn2.4.a: "Adopt Imperial Co-Emperor Designation"
 oe_dyn2.4.b: "Institute Secret Edict Box Succession"
 oe_dyn2.4.c: "Uphold Ancestral Succession Custom"
 oe_dyn2.5.title: "Behind the Silk Curtain"
 oe_dyn2.5.desc: "With the palace balancing dynastic continuity against factional ambition, the Empress Dowager and her inner secretariat have proposed a formal Behind-the-Curtain Regency protocol to safeguard the throne whenever a minor heir ascends."
 oe_dyn2.5.a: "Sanction the Dowager's Curtain Protocol"
 oe_dyn2.5.b: "Subject Regency Acts to Grand Secretariat Audit"
 oe_dyn2.6.title: "Purple Diadem in Crisis"
 oe_dyn2.6.desc: "Remembering how minority regencies once invited civil war and foreign partition, palace elders urge establishing a standing Senior Co-Emperor Regency protocol so a seasoned imperial kinsman always stands ready to guard the purple."
 oe_dyn2.6.a: "Charter the Senior Co-Emperor Regency"
 oe_dyn2.6.b: "Bind the Regency to Senatorial Co-Guarantors"
 oe_dyn2.7.title: "Deliberations of the Imperial Privy Council"
 oe_dyn2.7.desc: "Our grand chancellors, treasurers, and marshals have drafted a formal Imperial Privy Council Regency charter, pledging collegial administration and uninterrupted tax collection whenever the crown passes through a vulnerable transition."
 oe_dyn2.7.a: "Ratify the Privy Council Regency Charter"
 oe_dyn2.7.b: "Restrict Future Regencies to Caretaker Decrees"
 oe_dyn2.8.title: "Investiture of the Double-Headed Phoenix"
 oe_dyn2.8.desc: "Beneath vaulted banners of imperial purple and burnished gold, heralds present the jeweled collars of a newly conceived chivalric brotherhood: the Order of the Double-Headed Phoenix, dedicated to valor, diplomatic honor, and imperial renewal."
 oe_dyn2.8.a: "Found the Order of the Double-Headed Phoenix"
 oe_dyn2.8.b: "Channel the Endowment into Border Citadels"
 oe_dyn2.9.title: "Banner of the Imperial Dragon Guard"
 oe_dyn2.9.desc: "Veteran commanders of the palace guard and loyal frontier banners seek imperial sanction to organize the Imperial Dragon Guard Order, granting gilded dragon tallies to the realm's bravest officers."
 oe_dyn2.9.a: "Invest the Imperial Dragon Guard Order"
 oe_dyn2.9.b: "Award the Endowment to Civil Academy Laureates"
 oe_dyn2.10.title: "Oath of the Crescent Banner"
 oe_dyn2.10.desc: "Hardened cavalry captains and renowned frontier champions have assembled before the royal pavilion, asking to swear brotherhood beneath the Order of the Crescent Banner in defense of the realm and its faith."
 oe_dyn2.10.a: "Raise the Order of the Crescent Banner"
 oe_dyn2.10.b: "Direct the Bounty to Frontier Madrasas and Waqfs"
 oe_dyn2.11.title: "Disputation of the Sacred Academies"
 oe_dyn2.11.desc: "Eminent jurists, logicians, and court philosophers have gathered in our capital's colleges to debate law, metaphysics, and moral governance. Embracing their emerging school could reshape our realm's scholarly prestige for generations."
 oe_dyn2.11.a: "Adopt and Patronize the Rising School"
 oe_dyn2.11.b: "Sponsor an Open House of Translation Instead"
 oe_dyn2.12.title: "Court Language Hegemony"
 oe_dyn2.12.desc: "Poets, chroniclers, and foreign ambassadors now treat our court tongue as the preeminent language of diplomacy and high letters. Royal grammarians ask whether to codify a gilded imperial lexicon or broaden vernacular editions across the provinces."
 oe_dyn2.12.a: "Codify the Imperial Diplomatic Lexicon"
 oe_dyn2.12.b: "Broaden Vernacular Chancery Editions"
 oe_dyn2.13.title: "Greco-Latin Cultural-Language Synthesis"
 oe_dyn2.13.desc: "Generations of Mediterranean rule, maritime commerce, and humanist exchange have intertwined Greek rhetoric with Latin legalcraft across our universities and chanceries. We stand ready to forge a unified classical synthesis or nurture plural urban canons."
 oe_dyn2.13.a: "Forge the Greco-Latin Classical Synthesis"
 oe_dyn2.13.b: "Preserve Harmonious Mediterranean Pluralism"
 oe_dyn2.14.title: "Eurasian Imperial Cultural Synthesis"
 oe_dyn2.14.desc: "Ruling across both martial banner heartlands and ancient literary provinces has forged a distinctive bilingual imperial culture. Whether uniting Manchu-Han court letters or Turko-Persian chancery elegance, the crown can now institutionalize this synthesis."
 oe_dyn2.14.a: "Institute the Bilingual Imperial Chancery"
 oe_dyn2.14.b: "Honor Dual Steppe and Sedentary Traditions"
