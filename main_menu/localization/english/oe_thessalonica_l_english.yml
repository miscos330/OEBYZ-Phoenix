l_english:
 OE_THS_ENC_YES: "#R encircled#!"
 OE_THS_ENC_NO: "#G not encircled#!"
 OE_THS_VEN_YES: "Venice could take the city over"
 OE_THS_VEN_NO: "Venice cannot take the city over"
 OE_THS_FATE_EXEC: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_c2').GetCharacter.GetName] was captured and hanged."
 OE_THS_FATE_NONE: ""
 oe_ths_city: "The Siege of Thessaloniki"
 oe_ths_city_desc: "The Ottomans have blockaded Thessaloniki. When its #bold #color_yellow Resolve#!#! reaches #Y 0#!, the city cannot hold.\n\nResolve #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#! / #Y 100#!   Months of blockade #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!   [GetCountry('BYZ').Custom('OeThsEncircled')]   [GetCountry('BYZ').Custom('OeThsVenOk')]\n\nResolve falls by #R −1#! each month, by another #R −1#! while the Ottomans hold at least #Y 2#! places around the city (an #bold #color_yellow encirclement#!#!), and rises by #G +1#! while Venetian galleys are in the harbour. If Resolve is still #Y 30#! or more when the time is up, the siege is lifted."
 oe_ths_mustafa: "The Revolt of Mustafa"
 oe_ths_mustafa_desc: "The Ottoman prince released by the empire is fighting the sultan for the throne. If the prince wins, the new sultan will give up Gallipoli and the empire pays no more tribute; if the prince loses, the sultan will come in arms.\n\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\nThe empire: [GetCountry('BYZ').Custom('OeBetBack')]; commitment #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_stake').GetValue|0]#! / #Y 3#!   Months so far: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_m').GetValue|0]#!\n\nEach month both claimants' strength rises and falls with the fighting; the sultan on the throne gains #Y +3#!; the side the empire backs gains #Y +1#! plus the commitment. The contest is decided when one reaches #Y 90#!, when only one is left, or after #Y 18#! months."
 STATIC_MODIFIER_NAME_oe_ths_second_court: "The Second Court"
 STATIC_MODIFIER_NAME_oe_ths_two_courts: "Two Courts"
 STATIC_MODIFIER_NAME_oe_ths_blockaded: "Blockaded"
 STATIC_MODIFIER_NAME_oe_ths_privileges: "Privileges of Surrender"
 STATIC_MODIFIER_NAME_oe_ths_harac: "Harac to the Sultan"
 STATIC_MODIFIER_NAME_oe_ths_harac_pay: "Thessaloniki's Tribute"
 STATIC_MODIFIER_NAME_oe_ths_custody: "Custody of an Ottoman Prince"
 STATIC_MODIFIER_NAME_oe_ths_siege_scars: "Scars of the Siege"
 STATIC_MODIFIER_NAME_oe_ths_ven_pledge: "Venetian Guarantees"
 oe_ths_defiance: "A Defiant Prince"
 oe_ths_custody_op: "Keeps the Pretender under Guard"
 oe_ths_kept_faith: "Kept Faith"
 oe_ths_handed_over: "Handed the Prince Back"
 oe_ths_handed_over_2: "Handed the Pretender Over"
 oe_ths_mus_grateful: "Helped to the Throne"
 oe_ths_mus_betrayed: "Backed a Pretender"
 oe_ths_1424_spurned: "Spurned the Peace"
 oe_ths_ven_help: "Defended a City Together"
 oe_ths_handover: "Gave Us Thessaloniki"
 oe_ths_ven_rival: "Took Thessaloniki"
 oe_ths_overture: "Friendly Overtures"
 oe_ths.1.t: "Sailing in Secret"
 oe_ths.1.desc_slighted: "#F In the autumn of 1382, after John V had made peace with the line of the eldest son, the second son Manuel, passed over for the succession, sailed in secret to Thessalonica. There Manuel set up a court of their own, ignored the emperor's orders and took up the fight against the Ottomans.#!\n\nNow the settlement has given the throne to the elder line and [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] has been passed over. Unwilling to bow to the sultan, the prince has slipped aboard a ship for Thessaloniki, and the city's notables and garrison are coming to pay their respects. A #bold #color_yellow second court#!#!, a rival to the capital, is taking shape."
 oe_ths.1.desc_threat: "#F In the autumn of 1382, after John V had made peace with the line of the eldest son, the second son Manuel, passed over for the succession, sailed in secret to Thessalonica. There Manuel set up a court of their own, ignored the emperor's orders and took up the fight against the Ottomans.#!\n\nNow the Ottomans are pressing on Macedonia and the capital only gives way. [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] will not stand by: the prince has slipped aboard a ship for Thessaloniki, and the city's notables and garrison are coming to pay their respects. A #bold #color_yellow second court#!#!, a rival to the capital, is taking shape."
 oe_ths.1.a: "Accept What Is Done"
 oe_ths.1.a.tt: "Thessaloniki gains [ShowModifier('oe_ths_second_court')] and the empire gains [ShowModifier('oe_ths_two_courts')] for as long as the second court lasts\nOnce the Ottomans reach Macedonia, the city may be besieged after about #Y 8#! months\nThe theme of Thessaloniki, if any: loyalty #G +5#!\nWhile a vassal of the sultan, the sultan's patience #R −5#!; otherwise Ottoman opinion of the empire #R −10#! for #Y 5#! years"
 oe_ths.1.b: "Call the Prince Back"
 oe_ths.1.b.tt: "The second court comes to nothing\nThe theme of Thessaloniki, if any: loyalty #R −10#!"
 oe_ths.1.c: "Fund the Prince in Secret"
 oe_ths.1.c.tt: "Costs #R 2#! months of trade and tax income\nAs accepting what is done: Thessaloniki gains [ShowModifier('oe_ths_second_court')] and the empire gains [ShowModifier('oe_ths_two_courts')]\nWhen the city is besieged, its #bold #color_yellow Resolve#!#! starts #G +10#! higher\nThe theme of Thessaloniki, if any: loyalty #G +5#!\nWhile a vassal of the sultan, the sultan's patience #R −15#!; otherwise Ottoman opinion of the empire #R −10#! for #Y 5#! years"
 oe_ths.2.t: "After Serres"
 oe_ths.2.desc: "#F In September 1383 the Ottomans took Serres and carried its people off as slaves; in October their army reached Thessalonica. The commander sent an ultimatum: surrender, or see the city sacked when it fell. Manuel called the citizens together and urged them to hold out, but many wanted to give in.#!\n\nNow an Ottoman army stands before Thessaloniki and demands that the gates be opened. [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] has called the notables and the people together; some want to fight, others to give in.\n\nThessaloniki gains [ShowModifier('oe_ths_blockaded')]. The city's will to hold out is its #bold #color_yellow Resolve#!#!, now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!: it falls by #R −1#! each month, and by another #R −1#! while the Ottomans hold at least #Y 2#! places around the city (an #bold #color_yellow encirclement#!#!). At #Y 0#! the city cannot hold; if it is still #Y 30#! or more after #Y 4#! years of blockade, the siege is lifted."
 oe_ths.2.a: "Rally the City"
 oe_ths.2.a.tt: "Resolve #G +10#!\nWhile a vassal of the sultan, the sultan's patience #R −10#!; otherwise Ottoman opinion of the empire #R −10#! for #Y 5#! years"
 oe_ths.2.b: "The Emperor Sends Money and Men"
 oe_ths.2.b.tt: "Costs #R 3#! months of trade and tax income\nResolve #G +20#!\nWhile a vassal of the sultan, the sultan's patience #R −15#!; otherwise Ottoman opinion of the empire #R −10#! for #Y 5#! years"
 oe_ths.2.c: "Urge the Prince to Treat with the Pasha"
 oe_ths.2.c.tt: "Resolve #R −15#!\nWhile a vassal of the sultan, the sultan's patience #G +10#!; otherwise the Ottomans' resentment (if any) is dropped"
 oe_ths.3.t: "Echoes from the West"
 oe_ths.3.desc_scandal: "#F Year after year of siege went by, and no relief ever reached Thessalonica.#!\n\nNow the city has sent envoys across the sea to Venice and the Pope. The empire's earlier promises of church union in the West have already stirred anger at home; raising them again will only make the clergy angrier."
 oe_ths.3.desc_plain: "#F Year after year of siege went by, and no relief ever reached Thessalonica.#!\n\nNow the city has sent envoys across the sea to Venice and the Pope."
 oe_ths.3.a: "Ask Venice for Ships"
 oe_ths.3.a.tt: "#G 50%#! chance Venice sends galleys: for #Y 12#! months Resolve #G +1#! each month, and Venice's opinion of the empire #G +10#!\n#R 50%#! chance Venice declines"
 oe_ths.3.b: "Promise the Pope Union"
 oe_ths.3.b.tt: "Resolve #G +10#!\nIf no union with Rome was ever signed: talks of union begin for #Y 5#! years; the papacy's opinion of the empire #G +5#! for #Y 5#! years"
 oe_ths.3.c: "Ask No One"
 oe_ths.3.c.tt: "No cost; the blockade goes on"
 oe_ths.4.t: "Divided Counsels"
 oe_ths.4.desc: "#F As the blockade dragged on, more and more people in the city wanted to give in.#!\n\nNow the price of bread is soaring, the notables who want to yield are canvassing for support, and the people are wavering."
 oe_ths.4.a: "Spend to Calm the People"
 oe_ths.4.a.tt: "Costs #R 1#! months of trade and tax income\nResolve #G +5#!"
 oe_ths.4.b: "Arrest the Notables Who Would Yield"
 oe_ths.4.b.tt: "Resolve #G +10#!\nThe theme of Thessaloniki, if any: loyalty #R −5#!"
 oe_ths.4.c: "Let It Be"
 oe_ths.4.c.tt: "Resolve #R −10#!"
 oe_ths.5.t: "The Gates Open"
 oe_ths.5.desc: "#F On 6 April 1387 the people of Thessalonica made Manuel leave the city; three days later the gates opened. The city kept its privileges, paid a tribute and took in a small garrison, and was not sacked.#!\n\nNow the city can hold out no longer. The notables have asked [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] to leave and are ready to agree terms with the Ottomans. At present: [GetCountry('BYZ').Custom('OeThsEncircled')]. If encircled, the city goes to the Ottomans with its privileges; if not, it stays with the empire but pays the sultan every year."
 oe_ths.5.a: "Open the Gates and Pay"
 oe_ths.5.a.tt: "If encircled: Thessaloniki goes to the Ottomans and gains [ShowModifier('oe_ths_privileges')] for #Y 20#! years\nIf not: Thessaloniki stays with the empire; the city gains [ShowModifier('oe_ths_harac')] and the empire [ShowModifier('oe_ths_harac_pay')], each for #Y 15#! years\nThe second court ends\nWhile a vassal of the sultan, the sultan's patience #G +20#!; otherwise the Ottomans' resentment (if any) is dropped"
 oe_ths.5.b: "Empty the Treasury for One More Year"
 oe_ths.5.b.tt: "Costs #R 6#! months of trade and tax income\nResolve is set to #Y 35#! and the blockade goes on for about #Y 12#! more months (once only)"
 oe_ths.6.t: "The End of the Second Court"
 oe_ths.6.desc_held: "#F In 1387 Thessalonica, with no relief in sight, opened its gates.#!\n\nNow, after four years of blockade, the city has never given in, and the Ottoman army has at last withdrawn. [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] has returned to the capital, and father and child are reconciled. The empire's prestige #G +10#!; the theme of Thessaloniki, if any: loyalty #G +5#!."
 oe_ths.6.desc_quiet: "#F After Thessalonica opened its gates in 1387, Manuel wandered the Aegean islands and was later reconciled with John V.#!\n\nNow the Ottoman army never came. After #Y 5#! years the second court has lost its reason to be, and [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] has come back to the capital, reconciled with the emperor."
 oe_ths.6.desc_gone: "#F After Thessalonica opened its gates in 1387, Manuel wandered the Aegean islands and was later reconciled with John V.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_prince').GetCharacter.GetName] is gone, the second court has fallen apart, and Thessaloniki answers to the capital again."
 oe_ths.6.desc_safe: "#F After Thessalonica opened its gates in 1387, Manuel wandered the Aegean islands and was later reconciled with John V.#!\n\nNow the Ottomans have troubles of their own, the danger outside the walls has melted away, and with it the second court; Thessaloniki answers to the capital again."
 oe_ths.6.a: "One Court Again"
 oe_ths.6.a.tt: "[ShowModifier('oe_ths_second_court')] and [ShowModifier('oe_ths_two_courts')] are removed"
 oe_ths.10.t: "A Prince Seeks Refuge"
 oe_ths.10.desc_ths: "#F Around 1416 the Ottoman prince Mustafa rose against Sultan Mehmed I, was beaten and fled to Thessalonica. The sultan demanded the fugitive; the empire agreed to keep Mustafa confined on Lemnos and received a yearly payment for it. The Ottomans called Mustafa an impostor.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_cand').GetCharacter.GetName], of the house of Osman, has fallen out with the sultan and fled with a few followers into Thessaloniki, asking for the empire's protection. The sultan's envoys are close behind, demanding the fugitive back."
 oe_ths.10.desc_city: "#F Around 1416 the Ottoman prince Mustafa rose against Sultan Mehmed I, was beaten and fled to Thessalonica. The sultan demanded the fugitive; the empire agreed to keep Mustafa confined on Lemnos and received a yearly payment for it. The Ottomans called Mustafa an impostor.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_cand').GetCharacter.GetName], of the house of Osman, has fallen out with the sultan and fled with a few followers into Constantinople, asking for the empire's protection. The sultan's envoys are close behind, demanding the fugitive back."
 oe_ths.10.a: "Keep the Prince on Lemnos"
 oe_ths.10.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_cand').GetCharacter.GetName] comes to the empire and is kept under guard\nThe empire gains [ShowModifier('oe_ths_custody')] for as long as the prince stays\nOttoman opinion of the empire #G +10#! for #Y 10#! years\nWhen the sultan changes, the empire may let the prince go to fight for the throne"
 oe_ths.10.b: "Hand the Prince Back"
 oe_ths.10.b.tt: "Ottoman opinion of the empire #G +25#! for #Y 10#! years\nThe matter ends here"
 oe_ths.10.c: "See the Prince Off with Honour"
 oe_ths.10.c.tt: "The prince leaves the empire, and the matter ends here"
 oe_ths.11.t: "The Sultan Is Dead"
 oe_ths.11.desc: "#F In May 1421 Sultan Mehmed I died and Murad II took the throne. Two parties argued at the imperial court: the co-emperor John VIII wanted to release Mustafa and back the claim in return for Gallipoli; the old emperor Manuel wanted to keep faith. John VIII's party won, and imperial ships landed Mustafa near Gallipoli.#!\n\nNow the Ottoman throne has changed hands, and the new sultan, [SCOPE.sCharacter('oe_ths_su').GetName], has just taken it. The empire still holds [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName]. Some at court would let the prince go to fight for the throne in return for Gallipoli; others would keep faith and keep the prince under guard."
 oe_ths.11.a: "Release the Prince for Gallipoli"
 oe_ths.11.a.tt: "The situation #bold #color_yellow The Revolt of Mustafa#!#! begins: [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName] fights the new sultan for the throne and the empire backs [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName] (strength #G +10#!, commitment #Y 1#!)\n[ShowModifier('oe_ths_custody')] is removed\nThe contest lasts at most #Y 18#! months; if the prince wins, the new sultan will give up Gallipoli and the empire's tribute ends"
 oe_ths.11.b: "Keep Faith and Keep the Prince"
 oe_ths.11.b.tt: "Ottoman opinion of the empire #G +25#! for #Y 10#! years\nThe prince stays under guard; any payment goes on"
 oe_ths.11.c: "Hand the Prince to the New Sultan"
 oe_ths.11.c.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_ths_pretender').GetCharacter.GetName] is handed to the Ottomans and imprisoned for #Y 10#! years\n[ShowModifier('oe_ths_custody')] is removed\nOttoman opinion of the empire #G +40#! for #Y 10#! years\nThe matter ends here"
 oe_ths.12.t: "The Keys of Gallipoli"
 oe_ths.12.desc: "#F Landed near Gallipoli by imperial ships, Mustafa took Gallipoli and Adrianople and held Rumelia. The empire sent an envoy to claim Gallipoli and was refused.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName] has a firm hold on Rumelia: strength #G +10#!. By the agreement, Gallipoli should come to the empire.\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\nThe empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 oe_ths.12.a: "Send Envoys to Claim Gallipoli"
 oe_ths.12.a.tt: "#G 30%#! chance Gallipoli is handed over\n#R 70%#! chance of a refusal, and [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]'s strength #R −5#!"
 oe_ths.12.b: "Help the Prince Win First"
 oe_ths.12.b.tt: "Costs #R 2#! months of trade and tax income\nCommitment #G +1#! (at most #Y 3#!); our side's strength #G +10#!"
 oe_ths.12.c: "Make Up with the Sultan Instead"
 oe_ths.12.c.tt: "Back [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName] instead; the commitment starts again from nothing\n[GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]'s strength #G +10#!, [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c2').GetCharacter.GetName]'s strength #Y −10#!\nOttoman opinion of the empire #G +10#! for #Y 5#! years"
 oe_ths.13.t: "By Lake Ulubat"
 oe_ths.13.desc: "#F Early in 1422 Mustafa crossed to attack Bursa and faced Murad II across Lake Ulubat. The lords of Rumelia changed sides overnight; Mustafa fled, was soon caught and was hanged.#!\n\nNow the two armies face each other across the water in Anatolia, the lords of Rumelia are wavering, and [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName]'s strength has risen.\n[GetCountry('BYZ').Custom('OeBetSt1')]\n[GetCountry('BYZ').Custom('OeBetSt2')]\nThe empire: [GetCountry('BYZ').Custom('OeBetBack')]."
 oe_ths.13.a: "Send Ships and Men"
 oe_ths.13.a.tt: "Commitment #G +1#! (at most #Y 3#!); our side's strength #G +15#!"
 oe_ths.13.b: "Send Money Only"
 oe_ths.13.b.tt: "Costs #R 2#! months of trade and tax income\nOur side's strength #G +8#!"
 oe_ths.13.c: "Pull Out and Back the Sultan"
 oe_ths.13.c.tt: "Back [GetCountry('BYZ').MakeScope.GetVariable('oe_bet_c1').GetCharacter.GetName] instead; the commitment starts again from nothing"
 oe_ths.13.d: "Watch"
 oe_ths.13.d.tt: "The contest goes on"
 oe_ths.14.t: "The End of the Mustafa Revolt"
 oe_ths.14.desc_won: "#F In the spring of 1422 Mustafa was beaten, captured and hanged; that summer Murad II laid siege to Constantinople to punish the empire.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName] has taken the sultan's throne. The empire backed the right claimant; will the new sultan keep the promise?"
 oe_ths.14.desc_turned: "#F In the spring of 1422 Mustafa was beaten, captured and hanged; that summer Murad II laid siege to Constantinople to punish the empire.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName] sits firmly on the throne. The empire changed sides in time and stands with the winner. [GetCountry('BYZ').Custom('OeThsMusFate')]"
 oe_ths.14.desc_lost: "#F In the spring of 1422 Mustafa was beaten, captured and hanged; that summer Murad II laid siege to Constantinople to punish the empire.#!\n\nNow [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName] has won the throne. The empire backed the loser, and the new sultan will not forget it. [GetCountry('BYZ').Custom('OeThsMusFate')]"
 oe_ths.14.desc_none: "#F In the spring of 1422 Mustafa was beaten, captured and hanged; that summer Murad II laid siege to Constantinople to punish the empire.#!\n\nNow both claimants are out of the race, and the contest has not ended as the empire hoped. The bet comes to nothing, and the empire owes nobody anything."
 oe_ths.14.a: "So Be It"
 oe_ths.14.a.tt: "If our prince won: in about #Y 30#! days the new sultan will come to keep the agreement\nIf we switched to the sultan in time: a #Y 10#!-year truce with the Ottomans and Ottoman opinion of the empire #G +25#!\nIf we backed the loser: in about #Y 30#! days the new sultan will come in arms\nIf no one won: the matter ends"
 oe_ths.15.t: "A Sultan Who Keeps Faith"
 oe_ths.15.desc_reneged: "#F Mustafa was beaten and killed, and the promise of Gallipoli was never kept.#!\n\nNow the new sultan, [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName], has sent envoys to thank the empire, but says not a word about Gallipoli. The empire pays the sultan no more tribute, and the two make a #Y 15#!-year truce."
 oe_ths.15.desc_given: "#F Mustafa was beaten and killed, and the promise of Gallipoli was never kept.#!\n\nNow the new sultan, [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName], has sent envoys to thank the empire: Gallipoli belongs to the empire. The empire pays the sultan no more tribute, and the two make a #Y 15#!-year truce."
 oe_ths.15.desc_plain: "#F Mustafa was beaten and killed, and the promise of Gallipoli was never kept.#!\n\nNow the new sultan, [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName], has sent envoys to thank the empire. The empire pays the sultan no more tribute, and the two make a #Y 15#!-year truce."
 oe_ths.15.a: "Accept"
 oe_ths.15.a.tt: "Ottoman opinion of the empire #G +40#! for #Y 20#! years\nA #Y 15#!-year truce with the Ottomans\n#G No more tribute to the sultan#!: any buying-peace agreement with the Ottomans ends"
 oe_ths.16.t: "An Army Before the Walls"
 oe_ths.16.desc: "#F In June 1422 Murad II besieged Constantinople to punish the empire for backing Mustafa. In August the sultan's young brother, 'Little Mustafa', rose in Anatolia and the siege was lifted; Doukas says the empire had paid for it.#!\n\nNow the new sultan, [GetCountry('BYZ').MakeScope.GetVariable('oe_ths_mus_w').GetCharacter.GetName], resents the empire for backing a rival and has brought an army to the walls of Constantinople. Ottoman opinion of the empire #R −30#! for #Y 10#! years."
 oe_ths.16.a: "Fund a Rising in the House of Osman"
 oe_ths.16.a.tt: "Costs #R 3#! months of trade and tax income\n[SCOPE.sCharacter('oe_ths_kin').GetName] rises in Anatolia: Ottoman stability #G −2.5#!\nThe siege is lifted; in about #Y 1#! year the sultan will offer terms, and mild ones"
 oe_ths.16.b: "Hold the Walls"
 oe_ths.16.b.tt: "If Constantinople has the #bold #color_yellow Theodosian Walls#!#!: stability #R −2.5#! and #R 2#! months of manpower\nIf not: stability #R −7#!, #R 4#! months of manpower, and Constantinople gains [ShowModifier('oe_ths_siege_scars')] for #Y 5#! years\nIn about #Y 1#! year the sultan will offer terms"
 oe_ths.16.c: "Pay for Peace"
 oe_ths.16.c.tt: "Costs #R 6#! months of trade and tax income\nThe siege is lifted; in about #Y 6#! months the sultan will offer terms, and mild ones"
 oe_ths.17.t: "The Peace of 1424"
 oe_ths.17.desc_mild: "#F In February 1424 John VIII made peace with Murad II: the empire paid tribute to the sultan again and gave up a number of Thracian towns, falling back roughly to its borders before 1403.#!\n\nNow the Ottoman army has gone, and the sultan's envoys bring terms: the empire pays tribute again. What the empire gave earlier has bought mild terms, and the sultan asks for no land."
 oe_ths.17.desc_harsh: "#F In February 1424 John VIII made peace with Murad II: the empire paid tribute to the sultan again and gave up a number of Thracian towns, falling back roughly to its borders before 1403.#!\n\nNow the Ottoman army has gone, and the sultan's envoys bring terms: the empire pays tribute again and gives back the towns it recovered by the Treaty of Gallipoli, except those around Thessaloniki."
 oe_ths.17.a: "Accept"
 oe_ths.17.a.tt: "Pay tribute again under a buying-peace agreement: one payment now and one every January; also prestige #R −15#!, [oe_tu_authority|e] #R −5#! and a #Y 5#!-year truce with the Ottomans (no new agreement if one is running)\nOn harsh terms: the towns recovered by the Treaty of Gallipoli outside the Thessaloniki region go back to the Ottomans"
 oe_ths.17.b: "Refuse"
 oe_ths.17.b.tt: "Ottoman opinion of the empire #R −50#! for #Y 10#! years\n#R The truce with the Ottomans ends#!\nThessaloniki may be blockaded again"
 oe_ths.20.t: "Thessaloniki Blockaded"
 oe_ths.20.desc: "#F In June 1422 the Ottoman marcher lords blockaded Thessalonica. The city begged the capital for help, and the capital sent a single general, with neither men nor money.#!\n\nNow Ottoman troops have blockaded Thessaloniki once more, and the city has sent to the capital for help.\n\nThessaloniki gains [ShowModifier('oe_ths_blockaded')]. The city's will to hold out is its #bold #color_yellow Resolve#!#!, now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!: it falls by #R −1#! each month, and by another #R −1#! while the Ottomans hold at least #Y 2#! places around the city (an #bold #color_yellow encirclement#!#!). At #Y 0#! the city cannot hold; if it is still #Y 30#! or more after #Y 5#! years of blockade, the siege is lifted. After #Y 8#! months, or once Resolve is down to #Y 25#!, Venice may be willing to take the city over."
 oe_ths.20.a: "Send a General, without Men or Money"
 oe_ths.20.a.tt: "Resolve #G +5#!"
 oe_ths.20.b: "Send Men and Money"
 oe_ths.20.b.tt: "Costs #R 3#! months of trade and tax income\nResolve #G +20#!"
 oe_ths.20.c: "Let the City Fend for Itself"
 oe_ths.20.c.tt: "Resolve #R −5#!"
 oe_ths.21.t: "Two Parties in the City"
 oe_ths.21.desc: "#F Under the blockade the rich would not pay for the common defence, and the common people rioted, demanding a settlement with the Ottomans.#!\n\nNow Thessaloniki's notables and people are split in two: one party would hold out, the other would make peace."
 oe_ths.21.a: "Make the Rich Pay for the Defence"
 oe_ths.21.a.tt: "Resolve #G +10#!"
 oe_ths.21.b: "Put Down the Rioters"
 oe_ths.21.b.tt: "Resolve #G +5#!"
 oe_ths.21.c: "Let the Peace Party Have Its Way"
 oe_ths.21.c.tt: "Resolve #R −10#!"
 oe_ths.22.t: "Offering the City to Venice"
 oe_ths.22.desc: "#F In the spring of 1423 the despot Andronikos offered the city to Venice through Negroponte, on condition that Venice respect the people's property, customs, trading rights and Orthodox church and take over the defence; the capital was probably not asked first. In September Venetian galleys sailed into the harbour.#!\n\nNow the governor of Thessaloniki reports that the Venetians are willing to take the city over and defend it. The governor did not wait for the capital's answer and has already agreed the terms.\n\nResolve #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_will_now')|0]#!; months of blockade #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ths_bm_now')|0]#!."
 oe_ths.22.a: "Give the City to Venice"
 oe_ths.22.a.tt: "Thessaloniki goes to Venice and gains [ShowModifier('oe_ths_ven_pledge')] for #Y 10#! years\nVenice's opinion of the empire #G +30#! for #Y 20#! years\nOttoman opinion of Venice #G −30#! for #Y 10#! years\nThe blockade ends"
 oe_ths.22.b: "Hold On"
 oe_ths.22.b.tt: "Costs #R 2#! months of trade and tax income\nResolve #G +15#!"
 oe_ths.22.c: "Sue the Sultan for Peace"
 oe_ths.22.c.tt: "Costs #R 6#! months of trade and tax income\n#G 60%#! chance the sultan lifts the blockade: it ends, and Ottoman opinion of the empire #G +10#! for #Y 5#! years\n#R 40%#! chance the money is wasted: Resolve #R −10#!"
 oe_ths.23.t: "The Fate of the City"
 oe_ths.23.desc_fell: "#F On 29 March 1430 Murad II stormed Thessalonica and gave it over to three days of plunder.#!\n\nNow the city's resolve is spent and the Ottomans hold the land all around it. The garrison has opened the gates, and Thessaloniki belongs to the Ottomans."
 oe_ths.23.desc_harac: "#F On 29 March 1430 Murad II stormed Thessalonica and gave it over to three days of plunder.#!\n\nNow the city's resolve is spent, but the Ottomans never closed the ring. The notables have agreed with them that the city stays with the empire and pays the sultan every year. Thessaloniki gains [ShowModifier('oe_ths_harac')] and the empire [ShowModifier('oe_ths_harac_pay')], each for #Y 15#! years."
 oe_ths.23.desc_held: "#F On 29 March 1430 Murad II stormed Thessalonica and gave it over to three days of plunder.#!\n\nNow, after five years of blockade, the city has never given in, and the Ottomans have withdrawn. The empire's prestige #G +10#!."
 oe_ths.23.a: "So It Ends"
 oe_ths.23.a.tt: "[ShowModifier('oe_ths_blockaded')] is removed; the blockade ends"
 oe_ths.24.t: "March 1430"
 oe_ths.24.desc: "#F On 29 March 1430 Murad II stormed Venetian Thessalonica and gave it over to three days of plunder. In July Venice made peace with the Ottomans and accepted the loss.#!\n\nNow the news has come: Venice held the city for some years, but Thessaloniki has fallen to the Ottomans after all."
 oe_ths.24.a: "Grievous News"
 oe_ths.24.a.tt: "News only; no effect"
 oe_ths.90.t: "(hidden) Release the prince: bet round 2"
 oe_ths.91.t: "(hidden) The city goes to Venice"
 oe_ths.92.t: "(hidden) The surrender of 1387"
 oe_ths.93.t: "(hidden) The peace of 1424"
 oe_ths.94.t: "(hidden) Take the refugee in"
 oe_ths.95.t: "(hidden) Hand the prince to the sultan"
 oe_ths.96.t: "(hidden) The Gallipoli embassy"
