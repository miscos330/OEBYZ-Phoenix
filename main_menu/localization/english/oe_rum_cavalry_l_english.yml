l_english:
 OE_HETAIREIA_CAVALRY_BARRACKS_LIMIT: "Hetaireia barracks in Rum-culture locations (shared cavalry pool)"
 OE_HETAIREIA_CAVALRY_SHARED_LIMIT_TT: "Existing Turcopole and Rum Cataphract regiments of all generations combined are below the shared barracks capacity."
 oe_rum_cataphracts_1: "Rum Mail-Clad Horsemen"
 oe_rum_cataphracts_1_desc: "Rum military households bring their horses, lances and carefully repaired mail beneath the imperial standard. They advance in close order, trusting their armor to carry them through the first volleys.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G +10%#! strength damage, #G +33%#! morale damage, #G +3#! initiative and #R −0.25#! movement speed. Uses expensive heavy cavalry recruitment and maintenance supplies.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Professional Armies#! (full chain: Professional Armies -> Pike and Shot -> Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
 oe_rum_cataphracts_2: "Rum Cataphracts"
 oe_rum_cataphracts_2_desc: "The barracks organize privately equipped horsemen into disciplined ranks. At the sound of the horn, the riders hold their pace so that lance points and hooves reach the enemy together.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G +10%#! strength damage, #G +33%#! morale damage, #G +3#! initiative and #R −0.25#! movement speed. Uses expensive heavy cavalry recruitment and maintenance supplies.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Professional Armies#!; next tier unlocks via #Y Pike and Shot#! (followed by Siege Artillery -> Military Revolution -> Levée en Masse) — upgrade directly in the army panel."
 oe_rum_cataphracts_3: "Rum Heavy Lancers"
 oe_rum_cataphracts_3_desc: "Stronger lances and tighter formations demand patience. The Rum horsemen wait until the infantry pins the enemy before committing a complete squadron to the charge.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G +10%#! strength damage, #G +33%#! morale damage, #G +3#! initiative and #R −0.25#! movement speed. Uses expensive heavy cavalry recruitment and maintenance supplies.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Pike and Shot#!; next tier unlocks via #Y Siege Artillery#! (followed by Military Revolution -> Levée en Masse) — upgrade directly in the army panel."
 oe_rum_cataphracts_4: "Rum Armored Reiters"
 oe_rum_cataphracts_4_desc: "Pistols and sabres enter the riders’ equipment. The armored horsemen fire at close range and follow with steel, placing timing and distance alongside the old virtues of courage.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G +10%#! strength damage, #G +33%#! morale damage, #G +3#! initiative and #R −0.25#! movement speed. Uses expensive heavy cavalry recruitment and maintenance supplies.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Siege Artillery#!; next tier unlocks via #Y Military Revolution#! (followed by Levée en Masse) — upgrade directly in the army panel."
 oe_rum_cataphracts_5: "Rum Cuirassiers"
 oe_rum_cataphracts_5_desc: "Heavy full armor gives way to a sturdy cuirass. The Rum squadrons retain their shock role while common drill and standardized equipment adapt their service to a changing battlefield.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G +10%#! strength damage, #G +33%#! morale damage, #G +3#! initiative and #R −0.25#! movement speed. Uses expensive heavy cavalry recruitment and maintenance supplies.\n\n#Y Era Upgrade Path:#! Unlocked by #Y Military Revolution#!; final tier unlocks via #Y Levée en Masse#! — upgrade directly in the army panel."
 oe_rum_cataphracts_6: "Rum Guard Cuirassiers"
 oe_rum_cataphracts_6_desc: "Centuries of armored cavalry service become the honor of the Guard Cuirassiers. Held for the decisive moment, they deliver a disciplined charge against the enemy’s final resistance.\n\nSpecial heavy cavalry available to Byzantium. All ages and both standard and enhanced variants of the two cavalry families share one slot per Hetaireia barracks in a directly owned Rum-culture location.\n\nCompared with ordinary heavy cavalry of the same age: #G +10%#! strength damage, #G +33%#! morale damage, #G +3#! initiative and #R −0.25#! movement speed. Uses expensive heavy cavalry recruitment and maintenance supplies.\n\n#Y Era Upgrade Path:#! Final era tier, unlocked automatically by the vanilla military advance #Y Levée en Masse#!."
