 STATIC_MODIFIER_DESC_oe_eaj_iwami_silver_mod: "Silver flows out of Iwami."
 STATIC_MODIFIER_NAME_oe_eaj_sakoku_mod: "The Closed Country"
 STATIC_MODIFIER_DESC_oe_eaj_sakoku_mod: "The seas are closed and the realm is quiet."
 STATIC_MODIFIER_NAME_oe_eaj_shuinsen_mod: "Red-Seal Voyages"
 STATIC_MODIFIER_DESC_oe_eaj_shuinsen_mod: "Red-seal ships ply the ports of the southern seas."
 STATIC_MODIFIER_NAME_oe_eaj_hwatong_mod: "The Gunpowder Office"
 STATIC_MODIFIER_DESC_oe_eaj_hwatong_mod: "An office makes powder and guns and arms the warships with them."
 STATIC_MODIFIER_NAME_oe_eaj_hunminjeongeum_mod: "The Correct Sounds for the People"
 STATIC_MODIFIER_DESC_oe_eaj_hunminjeongeum_mod: "The new alphabet is proclaimed, and common people can read and write."
 STATIC_MODIFIER_NAME_oe_eaj_hwacha_forts_mod: "Fire Carts on the Northern Frontier"
 STATIC_MODIFIER_DESC_oe_eaj_hwacha_forts_mod: "The northern forts are armed with multiple rocket carts."
 STATIC_MODIFIER_NAME_oe_eaj_turtle_fleet_mod: "The Turtle Fleet"
 STATIC_MODIFIER_DESC_oe_eaj_turtle_fleet_mod: "The fleet has new turtle ships and drills its formations."
 STATIC_MODIFIER_NAME_oe_eaj_tongsinsa_mod: "The Embassies"
 STATIC_MODIFIER_DESC_oe_eaj_tongsinsa_mod: "The two countries exchange embassies and reopen trade."
