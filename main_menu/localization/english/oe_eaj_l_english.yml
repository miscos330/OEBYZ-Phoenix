 STATIC_MODIFIER_DESC_oe_eaj_craft_synergy_mod: "The gain from fostering the shipyard or the kiln and lacquer industry."
 STATIC_MODIFIER_NAME_oe_eaj_full_ai_mod: "A Stronger East Asia"
 STATIC_MODIFIER_DESC_oe_eaj_full_ai_mod: "The bonus given by the rule Stronger Computer Rivals."
