 STATIC_MODIFIER_DESC_oe_eaj_kango_trade_mod: "Trade with the mainland under official tallies."
 STATIC_MODIFIER_NAME_oe_eaj_teppo_mod: "Guns Copied"
 STATIC_MODIFIER_DESC_oe_eaj_teppo_mod: "Our own smiths now turn out matchlocks in numbers."
