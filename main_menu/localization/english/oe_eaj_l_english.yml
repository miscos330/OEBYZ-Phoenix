# NEW 2026-11-22 v11.5 Worker 3 (oe_eaj_). Generated by gen_v115_japan_korea.py; edit the generator, not this file.
 oe_eaj_jiphyeonjeon_gunsmith_foundry: "Hall of Scholars, Gun Works and Dockyard"
 oe_eaj_jiphyeonjeon_gunsmith_foundry_desc: "A state works that puts a hall of scholars, a gunsmiths' shop and a warship yard side by side. It can be built only in Kyoto, Edo, Osaka, Sakai, Nagasaki, Hakata, Kaesong, Seoul, Dongnae and Suncheon, one in each; in the capital it also helps the whole country. Requires the Iwami Silver advance."
 oe_eaj_jiphyeonjeon_gunsmith_foundry_maint: "Upkeep"
 oe_eaj_maritime_policy_law: "The Policy of the Seas"
 oe_eaj_maritime_policy_law_desc: "Japan is ringed by the sea. Shall the country be closed, with one window left open, or shall its merchants sail far under the red seal?"
 oe_eaj_pol_sakoku_dejima: "The Closed Country"
 oe_eaj_pol_sakoku_dejima_desc: "No subject may go abroad, and foreign ships may call only at one artificial island in Nagasaki. Western learning still comes in through that window."
 oe_eaj_pol_shuinsen_pacific: "The Red-Seal Ships"
 oe_eaj_pol_shuinsen_pacific_desc: "Ships carrying the red seal sail under the shogunate's protection to the ports of the southern seas."
 oe_eaj_joseon_naval_scholarship_law: "Learning and Coastal Defence"
 oe_eaj_joseon_naval_scholarship_law_desc: "The state's energy is limited: letters, or the fleet?"
 oe_eaj_pol_hunminjeongeum_silhak: "The Correct Sounds"
 oe_eaj_pol_hunminjeongeum_silhak_desc: "Spread an alphabet anyone can learn, and have the hall of scholars print books on farming, medicine and the calendar."
 oe_eaj_pol_panokseon_naval_defense: "The Board-Roofed Fleet"
 oe_eaj_pol_panokseon_naval_defense_desc: "Build flat-bottomed two-decked warships with guns along the sides, supported by roofed turtle ships."
 oe_eaj_tenka_fubu_bakufu_reform: "Rule the Realm by Arms"
 oe_eaj_tenka_fubu_bakufu_reform_desc: "Separate soldier from farmer, disarm the countryside and survey every field; the lords' standing gun companies answer to one command."
 oe_eaj_joseon_uijeongbu_reform: "State Council and Hall of Worthies"
 oe_eaj_joseon_uijeongbu_reform_desc: "The State Council directs the six ministries, and a Hall of Worthies gathers young scholars to write and to lecture before the king."
 oe_eaj_priv_sakai_shuinsen_merchants: "Charter of the Great Merchants"
 oe_eaj_priv_sakai_shuinsen_merchants_desc: "Confirm the self-rule of the great merchants of Sakai and Hakata and let them sail under the red seal."
 oe_eaj_priv_yangban_seowon_academies: "Academies and Local Volunteers"
 oe_eaj_priv_yangban_seowon_academies_desc: "Let the gentry found private academies in the countryside free of land tax; when an enemy invades, their scholars lead the volunteer bands."
 oe_eaj_adv_hunminjeongeum_metal_type: "Metal Movable Type"
 oe_eaj_adv_hunminjeongeum_metal_type_desc: "Books printed from cast bronze type are quick to make and clear to read."
 oe_eaj_adv_tanegashima_volley_fire: "Volley Fire"
 oe_eaj_adv_tanegashima_volley_fire_desc: "The gunners form several ranks that load and fire in turn, so the fire never stops."
 oe_eaj_adv_iwami_haifuki_silver: "Iwami Silver"
 oe_eaj_adv_iwami_haifuki_silver_desc: "Cupellation draws far more silver from the ore. Unlocks the Hall of Scholars, Gun Works and Dockyard."
 oe_eaj_adv_geobukseon_hakikjin: "Turtle Ships and the Crane Wing"
 oe_eaj_adv_geobukseon_hakikjin_desc: "Roofed and spiked turtle ships break the enemy line, and the main fleet spreads like a crane's wings to close round it with its guns."
 oe_eaj_player_only_tt: "Only a player-controlled country can use this"
 oe_eaj_dec_kango_tally_compact.title: "Renew the Tally Trade"
 oe_eaj_dec_kango_tally_compact.desc: "Send envoys to settle the tally trade with the mainland court, for copper coin, raw silk and books. Costs 100 gold and lasts 15 years."
 oe_eaj_dec_kango_tally_compact.a: "Send the envoys"
 oe_eaj_dec_iwami_haifuki_boom.title: "Expand the Iwami Mines"
 oe_eaj_dec_iwami_haifuki_boom.desc: "Bring in craftsmen who know cupellation and open up the silver mountain of Iwami; with more silver, the capital's market wants more porcelain, tea and silk. Requires Iwami; costs 150 gold and lasts 20 years."
 oe_eaj_dec_iwami_haifuki_boom.a: "Expand the mines"
 oe_eaj_dec_edo_sakoku_or_shuinsen.title: "Settle at Edo and Choose a Course"
 oe_eaj_dec_edo_sakoku_or_shuinsen.desc: "Build a new capital at Edo and decide between closing the country and opening the seas. Requires Edo and the year 1580; costs 250 gold. The chosen course lasts 30 years."
 oe_eaj_dec_edo_sakoku_or_shuinsen.a: "Build it"
 oe_eaj_dec_sejong_hunminjeongeum.title: "Proclaim the Correct Sounds"
 oe_eaj_dec_sejong_hunminjeongeum.desc: "Have the Hall of Worthies devise a new alphabet and proclaim it throughout the country. Requires that the Joseon dynasty has been founded and that we hold Seoul; costs 150 gold and lasts 20 years."
 oe_eaj_dec_sejong_hunminjeongeum.a: "Proclaim it"
 oe_eaj_dec_yi_sunsin_turtle_fleet.title: "Build the Turtle Fleet"
 oe_eaj_dec_yi_sunsin_turtle_fleet.desc: "Have the southern naval stations build board-roofed warships and turtle ships at speed. Requires a port, and either that the war across the strait has begun or the Turtle Ships and the Crane Wing advance; costs 200 gold and lasts 20 years."
 oe_eaj_dec_yi_sunsin_turtle_fleet.a: "Give the order"
 oe_eaj.1.title: "The Tallies"
 oe_eaj.1.desc: "The envoys have come back with the tallies: an official ship that carries one may enter port and trade, and any ship without one is treated as a pirate. The western lords and the merchants all want a share of them."
 oe_eaj.1.a: "The shogunate keeps them all"
 oe_eaj.1.b: "Share them among the lords and temples who paid"
 oe_eaj.2.title: "The Low Overthrow the High"
 oe_eaj.2.desc: "The capital's writ does not run beyond its own walls. Governors are overthrown by their retainers, and the retainers by retainers of their own. Men of ability see their chance."
 oe_eaj.2.a: "Reform the army and raise more foot soldiers"
 oe_eaj.2.b: "Cultivate the court and our neighbours"
 oe_eaj.3.title: "The Guns Arrive"
 oe_eaj.3.desc: "A foreign ship has drifted ashore on Tanegashima in the south, and the men aboard carry a weapon that pierces armour at a hundred paces. The lord of the island has bought two at a great price and set his smiths to copy them."
 oe_eaj.3.a: "Buy them and have the smiths of Sakai make them in numbers"
 oe_eaj.3.b: "A curiosity, nothing more"
 oe_eaj.4.title: "The Tide of Silver"
 oe_eaj.4.desc: "With cupellation the mines of Iwami yield many times more silver. Foreign ships have heard of it and offer raw silk and porcelain in exchange."
 oe_eaj.4.a: "Trade the silver for goods"
 oe_eaj.4.b: "Store it in the treasury"
 oe_eaj.5.title: "The Warrior Monks of the Mountain"
 oe_eaj.5.desc: "The great temple on Mount Hiei keeps thousands of armed monks, shelters our enemies and has closed the road to the capital. The commanders ask leave to act; others warn that it must never be done."
 oe_eaj.5.a: "Burn the mountain"
 oe_eaj.5.b: "Negotiate and have them lay down their arms"
 oe_eaj.6.title: "The Southern Barbarian Ships"
 oe_eaj.6.desc: "Great black foreign ships have put in at Nagasaki, bringing powder and raw silk, and missionaries too. The local lord has already been baptised."
 oe_eaj.6.a: "Open the port to them"
 oe_eaj.6.b: "Trade, but no preaching"
 oe_eaj.7.title: "The Decision at Edo"
 oe_eaj.7.desc: "The new capital is built and the realm is at peace. Now the course of the next two hundred years must be set: close the country, or open the seas?"
 oe_eaj.7.a: "Close the country, leaving Nagasaki alone open"
 oe_eaj.7.b: "Issue red seals and let the merchants sail"
 oe_eaj.8.title: "The Gunpowder Office"
 oe_eaj.8.desc: "After years of asking foreign merchants, an official has at last learned how saltpetre is made. He asks for an office to make powder and guns and to mount them on warships against the pirates."
 oe_eaj.8.a: "Found the office and arm the ships"
 oe_eaj.8.b: "The pirates are no great danger"
 oe_eaj.9.title: "The Correct Sounds for the People"
 oe_eaj.9.desc: "The twenty-eight new letters can be learned by a clever man in a morning and by a slow one in ten days. Many ministers memorialise against them, saying people will abandon classical learning."
 oe_eaj.9.a: "Proclaim them throughout the country"
 oe_eaj.9.b: "Try them first in the palace and the offices"
 oe_eaj.10.title: "The Forts of the Northern Frontier"
 oe_eaj.10.desc: "The tribes of the north raid across the rivers again and again. The frontier commanders ask for more forts along the banks, settlers to hold the land, and the new multiple rocket carts."
 oe_eaj.10.a: "Build the forts, send settlers and issue the carts"
 oe_eaj.10.b: "Win the tribes over with gifts instead"
 oe_eaj.11.title: "War across the Strait"
 oe_eaj.11.desc: "An army and a fleet such as no one has seen are gathering across the strait. This war will decide who rules the seas of East Asia."
 oe_eaj.11.a: "Call up the whole country"
 oe_eaj.11.b: "Ready the fleet first and cut their supply by sea"
 oe_eaj.12.title: "The Crane Wing"
 oe_eaj.12.desc: "The fleet has won again and again along the south coast: the turtle ships charge into the enemy line, then the board-roofed warships spread like a crane's wings and fire their broadsides. The enemy's supply ships can no longer get through."
 oe_eaj.12.a: "Press the pursuit"
 oe_eaj.12.b: "Hold the strait"
 oe_eaj.13.title: "Thirteen Ships"
 oe_eaj.13.desc: "The fleet was almost wiped out in one defeat, and thirteen warships are left. The court means to disband it and send the men to fight on land. The admiral writes: I still have thirteen ships."
 oe_eaj.13.a: "Let him fight in the narrows"
 oe_eaj.13.b: "Ask the mainland court for help"
 oe_eaj.14.title: "A New Balance"
 oe_eaj.14.desc: "Decades have passed since the great war, and both shores have been recovering. The lord of Tsushima writes to propose that embassies be exchanged again."
 oe_eaj.14.a: "Exchange embassies"
 oe_eaj.14.b: "Keep the fleet ready all the same"
 oe_eaj.90.title: "[Readout] Japan and Korea"
 oe_eaj.90.desc: "v11.5 Japan and Korea readout (1 = yes, 0 = no):\n· This country is a protagonist #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_protagonist')|0]#!, Slot 92 has run #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_pulses')|0]#! times\n· Japanese side #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_japan')|0]#!, holds land #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_land')|0]#!, Korean side #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_korea')|0]#!, the Joseon dynasty founded #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_joseon')|0]#!\n· Holds Edo #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_edo')|0]#!, Seoul #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_seoul')|0]#!, Iwami #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_iwami')|0]#!, Tanegashima #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_tane')|0]#!\n· The war across the strait has begun #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_imjin')|0]#!, the mission to Asia has set out #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_jesuit')|0]#!, Japan's course #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_eaj_v_path')|0]#! (1 closed country, 2 red-seal ships)"
 oe_eaj.90.a: "Close"
