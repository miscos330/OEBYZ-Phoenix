 oe_s37_gal.1.t: "The Customs of Galata"
 oe_s37_gal.1.d: "Galata, on the north shore of the Golden Horn, had been home to the Genoese since 1267. In 1303 the empire fixed the bounds of the colony and forbade walls, yet the Genoese kept extending theirs. Most ships passing the straits paid their dues at Galata. Gregoras wrote that around 1348 Galata took about 200,000 hyperpyra a year in customs and Constantinople barely 30,000. In 1348 John VI lowered the dues at Constantinople, and merchant ships began to bypass Galata and unload across the Horn. The treasury was empty after the civil war, so the emperor borrowed about 50,000 hyperpyra from wealthy citizens and built nine large ships and about a hundred small ones.\n\nNow most of the empire's customs still flow into Galata. The ministers propose to lower the dues at Constantinople to win the ships back, and to build a new fleet in case the Genoese answer with force."
 oe_s37_gal.1.a: "Pay from the treasury"
 oe_s37_gal.1.a.tt: "−150 gold.\nThe dues at Constantinople are cut: we get Low Dues at Constantinople (tariff income +10%, trade advantage +5%), lasting. The Genoese of Galata (tariff income −25%, trade advantage −10%) remains; together tariff income −15%, trade advantage −5%.\n6 traditional galleys are built at Constantinople.\nGenoa's opinion of us −25 (10 years).\nIn 4 to 8 months the Genoese of Galata will answer."
 oe_s37_gal.1.b: "Force loans from the wealthy"
 oe_s37_gal.1.b.tt: "Nobles satisfaction −10%, burghers satisfaction −10%, stability −2.5.\nThe dues at Constantinople are cut: we get Low Dues at Constantinople (tariff income +10%, trade advantage +5%), lasting. The Genoese of Galata (tariff income −25%, trade advantage −10%) remains; together tariff income −15%, trade advantage −5%.\n6 traditional galleys are built at Constantinople.\nGenoa's opinion of us −25 (10 years).\nIn 4 to 8 months the Genoese of Galata will answer."
 oe_s37_gal.1.c: "Borrow from the Golden Horn Bank"
 oe_s37_gal.1.c.tt: "The Golden Horn Bank lends us 150 gold at 4% interest, to be repaid over 60 months; the money goes straight into the ships.\nThe dues at Constantinople are cut: we get Low Dues at Constantinople (tariff income +10%, trade advantage +5%), lasting. The Genoese of Galata (tariff income −25%, trade advantage −10%) remains; together tariff income −15%, trade advantage −5%.\n6 traditional galleys are built at Constantinople.\nGenoa's opinion of us −25 (10 years).\nIn 4 to 8 months the Genoese of Galata will answer."
 oe_s37_gal.1.k: "Leave the customs as they are"
 oe_s37_gal.1.k.tt: "Nothing changes; The Genoese of Galata stays. The ministers will raise it again in 5 years."
 oe_s37_gal.1.k2: "Leave the customs as they are, again"
 oe_s37_gal.1.k2.tt: "Nothing changes; The Genoese of Galata stays, and the ministers drop the matter. When Genoa and Venice go to war, there will be one more chance."
 oe_s37_gal.2.t: "The Genoese Cross the Horn"
 oe_s37_gal.2.d: "In 1348 the Genoese asked for talks, and John VI told them to pull down their new fortifications first. In August, with the emperor away in Thrace, the Genoese of Galata crossed the Horn, set fire to whatever ships they could find and attacked the sea walls and the quays. That same year they finished a tower on the hill behind Galata, then called the Tower of Christ and later the Galata Tower.\n\nNow the Genoese of Galata have struck as well. They crossed the Horn and burned the ships in the harbour; we lost [GetCountry('BYZ').MakeScope.GetVariable('oe_s37_gal_lost').GetValue|0] warships. They demand the old dues back, and they are building more walls on the hill behind their town."
 oe_s37_gal.2.a: "Build more ships and attack in spring"
 oe_s37_gal.2.a.tt: "−100 gold. 3 more traditional galleys are built at Constantinople.\nIn 5 to 7 months the fleet attacks Galata. The chance of victory is now [GetCountry('BYZ').MakeScope.ScriptValue('oe_s37_gal_win_3')|0]%: 35% base, +20% if the Megas Doux has military ability of 60 or more, −10% if below 30.\nVictory: we may abolish Galata's customs privileges, or take an indemnity and curb them. Defeat: up to 6 warships lost, navy tradition −10, prestige −10."
 oe_s37_gal.2.b: "Bombard Galata from the walls"
 oe_s37_gal.2.b.tt: "−40 gold. The fleet stays in harbour and takes no risk.\nIn 3 to 5 months the Genoese will come to make peace, but they will not give up their customs privileges."
 oe_s37_gal.2.c: "Restore the old dues and make peace"
 oe_s37_gal.2.c.tt: "Low Dues at Constantinople is lost. Genoa's anger over the dues (−25) is removed. Prestige −10.\nThe Genoese of Galata stays. When Genoa and Venice go to war, there will be one more chance."
 oe_s37_gal.3.t: "The Battle in the Golden Horn"
 oe_s37_gal.3.d1: "In March 1349 the new fleet of John VI rounded the point to cross the Horn and attack Galata. A gale sprang up; the untried crews panicked, many jumped into the sea, and the fleet broke up before it could fight. The army on the shore withdrew as well. Yet the imperial catapults had already set the wharves and warehouses of Galata on fire. Some weeks later envoys with full powers came from Genoa to make peace: Genoa paid 100,000 hyperpyra, gave up the land it had seized behind Galata and promised never to attack Constantinople again. The Genoese kept their customs privileges.\n\nNow our fleet has weathered the gale and broken into the Horn, and the wharves and warehouses of Galata are burning. The Genoese envoys have come to sue for peace, and this time they will even talk about the customs."
 oe_s37_gal.3.d2: "In March 1349 the new fleet of John VI rounded the point to cross the Horn and attack Galata. A gale sprang up; the untried crews panicked, many jumped into the sea, and the fleet broke up before it could fight. The army on the shore withdrew as well. Yet the imperial catapults had already set the wharves and warehouses of Galata on fire. Some weeks later envoys with full powers came from Genoa to make peace: Genoa paid 100,000 hyperpyra, gave up the land it had seized behind Galata and promised never to attack Constantinople again. The Genoese kept their customs privileges.\n\nNow history has repeated itself: a gale scattered our fleet, [GetCountry('BYZ').MakeScope.GetVariable('oe_s37_gal_lost').GetValue|0] warships were sunk or taken, navy tradition −10 and prestige −10. But Galata burned for weeks as well, and the Genoese envoys have come to make peace."
 oe_s37_gal.3.d: "In March 1349 the new fleet of John VI rounded the point to cross the Horn and attack Galata. A gale sprang up; the untried crews panicked, many jumped into the sea, and the fleet broke up before it could fight. The army on the shore withdrew as well. Yet the imperial catapults had already set the wharves and warehouses of Galata on fire. Some weeks later envoys with full powers came from Genoa to make peace: Genoa paid 100,000 hyperpyra, gave up the land it had seized behind Galata and promised never to attack Constantinople again. The Genoese kept their customs privileges.\n\nNow our catapults have bombarded Galata from the walls for weeks and its wharves and warehouses are burning, while our fleet stayed in harbour. The Genoese envoys have come to make peace, but they will not discuss the customs."
 oe_s37_gal.3.wa: "Abolish Galata's customs privileges"
 oe_s37_gal.3.wa.tt: "The Genoese of Galata (tariff income −25%, trade advantage −10%) is removed. Low Dues at Constantinople stays.\nPrestige +15. Genoa's anger over the dues is replaced by: Genoa's opinion of us −40 (20 years). The matter ends here."
 oe_s37_gal.3.wb: "Take the indemnity and curb the privileges"
 oe_s37_gal.3.wb.tt: "+150 gold.\nThe Genoese of Galata becomes Genoese Privileges Curbed (tariff income −15%, trade advantage −5%). Low Dues at Constantinople stays.\nGenoa's anger over the dues is replaced by: Genoa's opinion of us −10 (10 years).\nWhen Genoa and Venice go to war, there will be one more chance."
 oe_s37_gal.3.a: "Sign the peace"
 oe_s37_gal.3.a.tt: "+100 gold (Genoa's indemnity), and the Genoese leave the hill behind Galata.\nGenoa's anger over the dues (−25) is removed. The Genoese of Galata stays; Low Dues at Constantinople stays.\nWhen Genoa and Venice go to war, there will be one more chance."
 oe_s37_gal.3.b: "Refuse the money; demand the walls and a share of the customs"
 oe_s37_gal.3.b.tt: "No indemnity.\nThe Genoese of Galata becomes Genoese Privileges Curbed (tariff income −15%, trade advantage −5%). Low Dues at Constantinople stays.\nGenoa's anger over the dues is replaced by: Genoa's opinion of us −30 (20 years). Stability −2.5.\nWhen Genoa and Venice go to war, there will be one more chance."
 oe_s37_gal.4.t: "Venice Seeks an Alliance"
 oe_s37_gal.4.d: "In August 1350 Venice and Genoa went to war over the trade of the Black Sea, and a Venetian fleet attacked Galata without success. In May 1351 John VI allied with Venice: from September the empire would put 12 galleys to sea, and Venice would pay two thirds of the cost. The Genoese admiral Paganino Doria then sacked Heraclea on the Sea of Marmara, and in November Sozopolis on the Black Sea.\n\nNow Venetian envoys have come to Constantinople and propose a joint war on Genoa: the empire provides a fleet, and Venice pays two thirds of it. The Genoese of Galata still hold their customs privileges."
 oe_s37_gal.4.a: "Ally with Venice"
 oe_s37_gal.4.a.tt: "−60 gold (our third). 4 traditional galleys are built at Constantinople.\nVenice's opinion of us +25 (10 years); Genoa's opinion of us −25 (10 years).\nIn 7 to 10 months the allied fleet meets the Genoese. The chance of victory is now [GetCountry('BYZ').MakeScope.ScriptValue('oe_s37_gal_win_5')|0]%: 30% base, +15% if the Megas Doux has military ability of 60 or more, −10% if below 30, +10% if we won the battle in the Golden Horn.\nVictory: Galata's customs privileges end. Defeat: up to 4 warships lost, and Galata's privileges are restored in full.\nThe battle is fought in events; no war is declared."
 oe_s37_gal.4.b: "Stay neutral"
 oe_s37_gal.4.b.tt: "Genoa's opinion of us +10 (5 years); Venice's opinion of us −10 (5 years).\nGalata's privileges stay as they are, and the matter ends here."
 oe_s37_gal.5.t: "The Battle of the Bosporus"
 oe_s37_gal.5.d1: "On 13 February 1352 the allied fleet of Venice, Aragon and the empire, about ninety galleys, 14 of them imperial, met the sixty-odd Genoese galleys of Doria in the Bosporus. They fought through a stormy night; the allies lost more ships, and the Venetian and Aragonese fleets then sailed away. Orhan sided with the Genoese. Left alone, John VI made peace with Genoa on 6 May 1352: the empire recognised the Genoese as full owners of Galata, renewed the privileges of the Treaty of Nymphaeum and closed its ports to Venetian and Aragonese ships.\n\nNow the allied fleet has beaten the Genoese in the straits. Galata stands alone and must accept our terms."
 oe_s37_gal.5.d: "On 13 February 1352 the allied fleet of Venice, Aragon and the empire, about ninety galleys, 14 of them imperial, met the sixty-odd Genoese galleys of Doria in the Bosporus. They fought through a stormy night; the allies lost more ships, and the Venetian and Aragonese fleets then sailed away. Orhan sided with the Genoese. Left alone, John VI made peace with Genoa on 6 May 1352: the empire recognised the Genoese as full owners of Galata, renewed the privileges of the Treaty of Nymphaeum and closed its ports to Venetian and Aragonese ships.\n\nNow history has repeated itself: the allied fleet suffered heavily in the straits, the Venetians have sailed away, and we lost [GetCountry('BYZ').MakeScope.GetVariable('oe_s37_gal_lost').GetValue|0] warships. The Genoese of Galata demand that we confirm their privileges again."
 oe_s37_gal.5.wa: "Take back the customs of the straits"
 oe_s37_gal.5.wa.tt: "Galata's customs privileges end: The Genoese of Galata or Genoese Privileges Curbed is removed. Low Dues at Constantinople stays.\nPrestige +15. Venice's opinion of us +15 (10 years). Genoa's anger over the alliance is replaced by: Genoa's opinion of us −30 (20 years)."
 oe_s37_gal.5.a: "Accept Genoa's peace"
 oe_s37_gal.5.a.tt: "The Genoese of Galata (tariff income −25%, trade advantage −10%) is restored in full, and Genoese Privileges Curbed is removed. Low Dues at Constantinople stays.\nWe close our ports to Venetian ships: Venice's opinion of us −20 (10 years). Genoa's anger over the alliance (−25) is removed."
 oe_s37_gal.5.b: "Pay to keep the terms we won before"
 oe_s37_gal.5.b.tt: "−200 gold. Genoese Privileges Curbed stays.\nWe close our ports to Venetian ships: Venice's opinion of us −20 (10 years). Genoa's anger over the alliance (−25) is removed."
