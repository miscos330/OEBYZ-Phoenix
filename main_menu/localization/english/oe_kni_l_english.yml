l_english:
# NEW 2026-11-23 v22.0 Hospitaller Maritime Bastion & North-South Crusader Pact — Hospitaller Buildings, Decisions, Events, Modifiers & Mission Tree #57 (english) (oe_kni_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v220_hospitaller_pact.py; edit the generator, not this file.
 oe_kni_rhodes_sea_citadel:0 "Rhodes Colossus Harbour Citadel"
 oe_kni_rhodes_sea_citadel_desc:0 "Fortified mole-towers, chain-booms, and vaulted knightly bastions spanning the ancient harbor of Rhodes, turning the Order's island seat into an unsinkable coastal fortress and naval supply depot."
 oe_kni_rhodes_sea_citadel_maintenance:0 "Colossus Harbour Citadel Upkeep"
 oe_kni_hospitaller_arsenal:0 "Grand Arsenal of the Eight Tongues"
 oe_kni_hospitaller_arsenal_desc:0 "A disciplined galley-yard and ropewalk funded jointly by the Eight European Tongues of St. John, fitting out swift war galleys, trained oarsmen, and Christian corsair squadrons across the Aegean."
 oe_kni_hospitaller_arsenal_maintenance:0 "Eight Tongues Grand Arsenal Upkeep"
 oe_kni_dec_fortify_rhodes.title:0 "Expand the Rhodes Sea Citadel & Hospitaller Arsenal"
 oe_kni_dec_fortify_rhodes.desc:0 "Commission master military engineers from all Eight Tongues to raise the Colossus Harbour Citadel at Rhodes (or our coastal capital) with reinforced sea-walls, harbour chain-booms, and dedicated war-galley slipways."
 oe_kni_dec_fortify_rhodes.a:0 "Fortify the Colossus Harbour Bastion"
 oe_kni_dec_aegean_crusade_fleet.title:0 "Commission the Standing Aegean Galley Squadron"
 oe_kni_dec_aegean_crusade_fleet.desc:0 "Levy skilled Greek and Latin oarsmen, fit out fresh war galleys in our island arsenals, and launch a ten-year standing crusade patrol across the Aegean archipelago."
 oe_kni_dec_aegean_crusade_fleet.a:0 "Launch the Aegean War-Galley Squadron"
 oe_kni_dec_eight_tongues_tithe.title:0 "Collect the Eight European Tongues Priory Tithes"
 oe_kni_dec_eight_tongues_tithe.desc:0 "Dispatch receivers-general to our Catholic priories across Western and Central Europe to collect statutory responsions and knightly reinforcements, scaling cleanly with our prestige and Papal goodwill."
 oe_kni_dec_eight_tongues_tithe.a:0 "Collect the Priory Responsions"
 oe_kni_dec_cyprus_union.title:0 "Propose the Hospitaller-Lusignan Union of Cyprus"
 oe_kni_dec_cyprus_union.desc:0 "Unite the sea-power of Rhodes with the royal ports of Nicosia and Famagusta: draw a threatened Lusignan Cyprus under Hospitaller protection or consolidate joint rule across both islands."
 oe_kni_dec_cyprus_union.a:0 "Seal the Union of Rhodes & Cyprus"
 oe_kni_dec_proclaim_outremer.title:0 "Proclaim the Restored Kingdom of Jerusalem & Outremer"
 oe_kni_dec_proclaim_outremer.desc:0 "With the White Cross once more planted upon Jerusalem or Antioch, summon a solemn assembly of the Eight Tongues to proclaim the restoration of Outremer and decide whether to rule as a Sovereign Military Order or crowned Kingdom."
 oe_kni_dec_proclaim_outremer.a:0 "Proclaim the Restoration of Outremer"
 oe_kni_dec_black_white_cross_pact.title:0 "Seal the Black Cross & White Cross Pact"
 oe_kni_dec_black_white_cross_pact.desc:0 "Forge a historic North-South Eurasian alliance between the Knights Hospitaller of the Mediterranean and the Teutonic Order of the Baltic and Pontus-Krim, unlocking reciprocal Baltic-Mediterranean trade, shared knightly garrisons, and joint Eastern Mediterranean intervention."
 oe_kni_dec_black_white_cross_pact.a:0 "Seal the Eternal Covenant of Both Crosses"
 oe_kni_cd_aegean_fleet_tt:0 "Not on the 10-year Standing Aegean Galley Squadron cooldown."
 oe_kni_cd_eight_tongues_tithe_tt:0 "Not on the 10-year Eight Tongues Priory Tithes cooldown."
 oe_kni_can_seal_pact_tt:0 "We hold Rhodes, Jerusalem, or Antioch as a Catholic Hospitaller realm, and the Catholic Teutonic Order is active at peace with us — having either established Pontus-Krim (Kaffa/Solkhat/Qirq-Yer) or grown alongside us as a strong Catholic military order in the Age of Renaissance or later."
 oe_kni_cyprus_union_ready_tt:0 "We control Nicosia or Famagusta, or Catholic Cyprus is allied, a subject, weak, or embattled and at peace with us."
 oe_kni_dec_fortify_rhodes_tt:0 "Constructs the Rhodes Colossus Harbour Citadel immediately in Rhodes (or our coastal capital) if not yet built, boosts harbour development and prosperity, and grants 25 years of fortress and shipbuilding bonuses."
 oe_kni_dec_aegean_crusade_fleet_tt:0 "Raises a year's worth of sailors, boosts naval tradition, and grants 10 years of Aegean war-galley combat, build-cost, morale, and maritime presence bonuses."
 oe_kni_dec_eight_tongues_tithe_tt:0 "Collects capped responsion gold from European Catholic priories (120 base, scaling up to 380 with Prestige and Papal goodwill) along with manpower, sailors, and 10 years of priory tithe bonuses."
 oe_kni_dec_cyprus_union_tt:0 "Brings an independent vulnerable AI Cyprus into Hospitaller vassalage (or strengthens an existing union/alliance), grants Cypriot cores if owned, and unlocks 25 years of maritime union bonuses."
 oe_kni_dec_proclaim_outremer_tt:0 "Grants Outremer cores on held Levantine cities, 50 years of Sovereign Crown of Restored Outremer bonuses, and convenes the Jerusalem Charter assembly."
 oe_kni_dec_black_white_cross_pact_tt:0 "Seals the North-South Black Cross & White Cross Pact with the Teutonic Order, granting mutual Baltic-Mediterranean trade, knightly garrison support, diplomatic alliance (if eligible), and dispatching envoys to Marienburg."
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_rhodes_fortress:0 "Colossus Harbour Bastion Works"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_rhodes_fortress:0 "Reinforced sea-walls, harbour chain-booms, and Hospitaller slipways anchor Christian maritime defense across the Dodecanese."
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_aegean_fleet:0 "Standing Aegean War-Galley Squadron"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_aegean_fleet:0 "Permanent Hospitaller war galleys sweep the Aegean channels, lowering galley fitting costs while projecting white-cross sea power."
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_eight_tongues_tithe:0 "Eight European Tongues Priory Responsions"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_eight_tongues_tithe:0 "Coordinated responsion remittances from commanderies in Provence, Auvergne, France, Italy, Aragon, Castile, England, and Germany sustain the Convent."
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_cyprus_union:0 "Hospitaller-Lusignan Union of Cyprus"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_cyprus_union:0 "Shared command of Rhodes, Nicosia, and Famagusta welds Latin Cyprus and the Knights of St. John into a single Eastern Mediterranean maritime shield."
 STATIC_MODIFIER_NAME_oe_kni_mod_dec_outremer_crown:0 "Sovereign Crown of Restored Outremer"
 STATIC_MODIFIER_DESC_oe_kni_mod_dec_outremer_crown:0 "From Rhodes to Jerusalem and Antioch, the White Cross flies once more over the holy coast, steeling knightly discipline and sacred zeal."
 STATIC_MODIFIER_NAME_oe_kni_mod_pact_kni:0 "Black Cross & White Cross Pact (Southern Charter)"
 STATIC_MODIFIER_DESC_oe_kni_mod_pact_kni:0 "Sealed between Rhodes and Marienburg-Pontus, this North-South crusader covenant exchanges Baltic amber, timber, and knightly garrisons for Levantine trade and naval mastery."
 STATIC_MODIFIER_NAME_oe_kni_mod_pact_teu:0 "Black Cross & White Cross Pact (Northern Charter)"
 STATIC_MODIFIER_DESC_oe_kni_mod_pact_teu:0 "Sealed between the Teutonic and Hospitaller Orders, this Eurasian crusader covenant opens Mediterranean spice convoys to Baltic-Pontic merchants while reinforcing joint fortress garrisons."
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_aegean_galleys:0 "Aegean War-Galley Arsenal Standard"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_aegean_galleys:0 "Standardized Hospitaller oar-banks, reinforced rams, and swift Aegean scouting squadrons dominate narrow island straits."
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_aegean_mastery:0 "Sovereign Mastery of the Aegean Archipelago"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_aegean_mastery:0 "From Rhodes and Kos to Chios and Crete, Christian war galleys enforce undisputed mastery over every island port and sea-lane."
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_hospital_order:0 "Reformed Xenodochion & Sea-Order"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_hospital_order:0 "Clean infirmaries, quarantine lazarettos, and disciplined religious chapters guard the Order's subjects from plague while deepening devotion."
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_latin_shield:0 "Latin Shield of the Eastern Mediterranean"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_latin_shield:0 "Interlocking island citadels across Rhodes and Cyprus form an unbreakable maritime bulwark for Christendom in the Levant."
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_outremer_reborn:0 "Banner of Outremer Reborn"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_outremer_reborn:0 "The recapture of Jerusalem and Acre fulfills two centuries of Hospitaller vows, firing knightly formations with unmatched resolve."
 STATIC_MODIFIER_NAME_oe_kni_mod_msn_crusader_axis:0 "Eternal Axis of the Black & White Cross"
 STATIC_MODIFIER_DESC_oe_kni_mod_msn_crusader_axis:0 "Uniting Baltic-Pontic and Aegean-Levantine sea power under twin military orders establishes an enduring trans-Eurasian Christian bastion."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev1_a:0 "Villeneuve's Statutes of the Eight Tongues"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev1_a:0 "Grand Master Helion de Villeneuve assigns each European Tongue its own curtain wall, gatehouse, and treasury ledger on Rhodes."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev1_b:0 "Aegean Sea-Watch of St. John"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev1_b:0 "Continuous galley patrols out of Rhodes harbor check Anatolian raiders and expand Hospitaller nautical skill."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev2_a:0 "Papal Smyrna Crusade League"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev2_a:0 "Joint papal, Venetian, Cypriot, and Hospitaller squadrons storm the corsair anchorage of Smyrna beneath the banner of St. John."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev2_b:0 "Dodecanese Prize-Court & Sea Patrol"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev2_b:0 "Disciplined patrols along the Carian straits turn captured corsair hulls and maritime tolls into steady Order revenue."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev3_a:0 "Defenders of the Tower of St. Nicholas"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev3_a:0 "Granite bastions, counter-mines, and iron-willed knights shatter overwhelming siege assaults at the very mouth of Rhodes harbour."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev3_b:0 "Fireships of the Grand Master"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev3_b:0 "Blazing Hospitaller fireships and fast relief galleys smash enemy siege blockades and keep Rhodes's sea lifelines open."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev4_a:0 "Lusignan-Hospitaller Defensive Compact"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev4_a:0 "Joint garrisons in Famagusta and Nicosia bind Cyprus's royal court tightly to Hospitaller diplomacy and naval aid."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev4_b:0 "Cypriot Sugar & Commandery Estates"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev4_b:0 "Fertile Hospitaller estates around Kolossi and Cypriot export quays swell the Order's Mediterranean commercial coffers."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev5_a:0 "Caravan of the Eight Tongues Novices"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev5_a:0 "Young noble recruits from across Latin Europe flock to Rhodes to fulfill their statutory sea-caravans under the White Cross."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev5_b:0 "European Priory Endowment Treasury"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev5_b:0 "Audited estate charters across France, Italy, Iberia, and Germany channel reliable bullion and naval stores to the Levant."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev6_a:0 "Great Hospital & Maritime Lazaretto of St. John"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev6_a:0 "Silver-plate infirmaries, herbal apothecaries, and strict shipboard quarantine protect Rhodes and its subjects through pestilence."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev6_b:0 "Hospitaller Fleet Chirurgeons"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev6_b:0 "Dedicated surgeon-brothers aboard every war galley and fortress keep crews healthy, morale high, and battered ships combat-ready."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev7_a:0 "Vanguard of the Principality of Antioch"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev7_a:0 "Hospitaller siege trains and coastal landing brigades storm the Orontes gate to restore the ancient northern crusader march."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev7_b:0 "Levantine Customs of Port St. Symeon"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev7_b:0 "Restored Latin port customs at the mouth of the Orontes reconnect Aleppo's silk and spice caravans with Mediterranean shipping."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev8_a:0 "Sovereign Military Order of Jerusalem"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev8_a:0 "Declining secular crowns, the Grand Master rules the Holy City directly as a sovereign monastic-military citadel of Christendom."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev8_b:0 "Restored Crusader Kingdom of Jerusalem"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev8_b:0 "A crowned Outremer realm rises in Jerusalem with Hospitaller guardians at its core, rallying Latin courts and pilgrims from across Europe."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev9_b:0 "Baltic-Aegean Pilgrim & Merchant Charter"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev9_b:0 "Reciprocal port privileges between Rhodes and Teutonic Baltic-Pontic harbors expand long-distance Christian maritime commerce."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev10_b:0 "Marienburg-Rhodes Amber & Spice Convoy"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev10_b:0 "Escorted Hanseatic-Teutonic vessels exchange northern amber, wax, and oak timber for Levantine spices in Hospitaller ports."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev11_a:0 "Twin-Cross Levantine Crusade Offensive"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev11_a:0 "Coordinated Black Cross and White Cross squadrons strike rival sultanate strongholds from both the Black Sea approaches and the Aegean."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev11_b:0 "Twin-Cross Relief of Constantinople"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev11_b:0 "A combined Hospitaller-Teutonic maritime relief mission reinforces the Bosporus and wins lasting gratitude across Eastern Christendom."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev11_c:0 "Baltic-Pontus-Aegean Convoy Shield"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev11_c:0 "Permanent allied escort squadrons keep grain, timber, and silk flowing smoothly through the Turkish Straits and Greek archipelago."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev12_a:0 "White Cross Sea-Corso Hegemony"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev12_a:0 "Feared from Alexandria to the Dardanelles, Hospitaller war squadrons enforce unrivaled naval supremacy across the Eastern Mediterranean."
 STATIC_MODIFIER_NAME_oe_kni_mod_ev12_b:0 "Pax Maritima of St. John"
 STATIC_MODIFIER_DESC_oe_kni_mod_ev12_b:0 "Safe-conduct charters, lighthouse beacons, and Hospitaller escorts turn the Aegean and Levant into a prosperous Christian trade lake."
 oe_kni.1.title:0 "Bastion of Rhodes: Villeneuve's Reform of the Eight Tongues"
 oe_kni.1.desc:0 "Standing atop the limestone towers overlooking Rhodes's twin harbors, Grand Master Helion de Villeneuve convenes the Chapter General to divide the island's curtain walls, gatehouses, and war-galley quotas among the Eight European Tongues of St. John. With Anatolian corsair sails gathering across the narrow straits, the Order must choose whether to prioritize impregnable harbor stonework or relentless sea-watch patrols."
 oe_kni.1.a:0 "Assign Each Tongue Its Bastion & Codify the Harbour Walls"
 oe_kni.1.b:0 "Expand the Aegean Sea-Watch & Maritime Priories"
 oe_kni.2.title:0 "The Smyrna Crusade of 1344"
 oe_kni.2.desc:0 "From Avignon, the Pope proclaims a Naval League uniting the Knights Hospitaller, Venice, and Cyprus against the daring corsair beyliks of Aydin and Menteshe whose war galleys raid from Smyrna's sheltered gulf across the entire Aegean. White Cross captains wait upon the quay of Rhodes for orders to strike the Anatolian port directly or tighten the maritime blockade around the Dodecanese."
 oe_kni.2.a:0 "Lead the Papal League Assault Upon Smyrna"
 oe_kni.2.b:0 "Seal the Dodecanese Straits & Establish a Prize Court"
 oe_kni.3.title:0 "Great Siege of Rhodes Repelled"
 oe_kni.3.desc:0 "Bombards thunder across the turquoise waters as hostile invasion galleys ring Rhodes's stone moles, hurling iron shot and storming parties against the Tower of St. Nicholas and the bastions of Italy and England. Beneath smoke-blackened white-cross banners, knights, Greek townsfolk, and harbor mariners rally to hurl the besiegers back into the sea."
 oe_kni.3.a:0 "Hold the Tower of St. Nicholas to the Last Sword"
 oe_kni.3.b:0 "Shatter the Siege Blockade with Fireships & Relief Galleys"
 oe_kni.4.title:0 "The Lusignan Crisis & Hospitaller-Cyprus Bond"
 oe_kni.4.desc:0 "Facing Genoese creditors, Mamluk raiders, and bitter court factions in Nicosia and Famagusta, the Latin Kingdom of Cyprus turns toward its closest brother-in-arms across the sea. Our own Grand Commandery at Kolossi already harvests the island's richest sugar estates — giving the Knights of St. John a rare moment to bind Cyprus's royal crown and harbors permanently to Rhodes."
 oe_kni.4.a:0 "Guarantee the Lusignan Throne & Garrison Famagusta"
 oe_kni.4.b:0 "Expand the Kolossi Sugar Estates & Cypriot Port Customs"
 oe_kni.5.title:0 "Priories of the Eight European Tongues"
 oe_kni.5.desc:0 "Across Provence, Auvergne, France, Italy, Aragon, Castile, England, and Germany, hundreds of Hospitaller commanderies collect tithes, breed warhorses, and prepare young noble brothers for their statutory Mediterranean sea-caravans. Envoys from the Grand Priories ask whether Rhodes stands in greater need of fresh armored novices or silver responsion chests."
 oe_kni.5.a:0 "Summon Armored Novices for the Mediterranean Caravans"
 oe_kni.5.b:0 "Dispatch Silver Responsion Chests to Rhodes's Treasury"
 oe_kni.6.title:0 "The Great Hospital of St. John"
 oe_kni.6.desc:0 "Even as pestilence sweeps the Mediterranean ports along merchant shipping lanes, the Knights Hospitaller honor their oldest vow as servants of the sick. Inside Rhodes's vaulted stone Xenodochion, patients of every rank dine from silver plates while physician-brothers debate erecting a maritime quarantine lazaretto or deploying surgical teams directly aboard the Order's war galleys."
 oe_kni.6.a:0 "Expand the Great Xenodochion & Maritime Quarantine Lazaretto"
 oe_kni.6.b:0 "Assign Trained Chirurgeons to Every War Galley & Bastion"
 oe_kni.7.title:0 "Landing at Antioch: Gate of Northern Outremer"
 oe_kni.7.desc:0 "Across the Gulf of Alexandretta rise the craggy mountain walls of Antioch, where crusader princes and Hospitaller castellans once guarded the approaches from Anatolia to the Holy Land. Whether storming the ancient citadel or consolidating its newly won harbor at Port St. Symeon, our marshals hail the return of the White Cross to mainland Syria."
 oe_kni.7.a:0 "Raise the White Cross Over Antioch's Mountain Citadel"
 oe_kni.7.b:0 "Reopen the Levantine Silk & Spice Customs of Port St. Symeon"
 oe_kni.8.title:0 "Liberation of Jerusalem: Outremer Restored"
 oe_kni.8.desc:0 "Bells ring out across Christendom as Hospitaller banners enter the gates of Jerusalem and stand watch beside the Holy Sepulchre for the first time since the fall of Outremer. Inside the grand chapter hall, knights, prelates, and Latin barons face a fateful constitutional choice: preserve Jerusalem forever under the direct sovereign rule of the Military Order of St. John, or crown a restored Crusader Kingdom of Jerusalem."
 oe_kni.8.a:0 "Rule as the Sovereign Military Order of Jerusalem"
 oe_kni.8.b:0 "Crown the Restored Crusader Kingdom of Jerusalem (Outremer)"
 oe_kni.9.title:0 "Envoys of the Black Cross: The North-South Pact"
 oe_kni.9.desc:0 "A weather-beaten cog flying the black Teutonic cross drops anchor beneath the towers of Rhodes, bearing sealed parchment from the Grand Master at Marienburg and the northern Order's Pontic-Crimean commanderies. Recognizing that twin Catholic military orders now guard both the northern seas and the Eastern Mediterranean, the Teutonic legates propose a permanent Black Cross & White Cross Pact linking Baltic-Pontic commerce with Hospitaller sea power."
 oe_kni.9.a:0 "Ratify the Eternal Black Cross & White Cross Covenant"
 oe_kni.9.b:0 "Sign a Baltic-Aegean Commercial & Pilgrim Shipping Charter"
 oe_kni.10.title:0 "Reciprocal Charter of the Black Cross & White Cross"
 oe_kni.10.desc:0 "Hospitaller envoys clad in scarlet surcoats emblazoned with the eight-pointed white cross enter the brick-gothic halls of the Teutonic Order, presenting the ratified southern charter from Rhodes. By uniting northern amber, oak timber, and garrison knights with Mediterranean spice convoys and war galleys, the Black Cross and White Cross can forge a trans-Eurasian Christian maritime axis."
 oe_kni.10.a:0 "Seal the North-South Crusader Covenant & Exchange Garrisons"
 oe_kni.10.b:0 "Charter the Marienburg-Rhodes Amber & Spice Convoy"
 oe_kni.11.title:0 "Joint Eastern Mediterranean Crusade Intervention"
 oe_kni.11.desc:0 "With the Black Cross & White Cross Pact in full force, joint Teutonic and Hospitaller war councils meet beside Rhodes's harbor map-tables to decide how best to wield their combined Eurasian sea-power across the Eastern Mediterranean: launch a coordinated strike against Ottoman and Mamluk strongholds, rush a relief armada to shield Constantinople and the Roman Empire, or turn the Straits into an impenetrable allied trade corridor."
 oe_kni.11.a:0 "Coordinate a Twin-Cross Offensive Against Rival Sultanates"
 oe_kni.11.b:0 "Dispatch a Joint Relief Armada to Shield Constantinople"
 oe_kni.11.c:0 "Fortify the Straits & Protect Baltic-Levant Merchant Convoys"
 oe_kni.12.title:0 "Mediterranean Corsair & Trade Supremacy"
 oe_kni.12.desc:0 "From the golden harbors of Rhodes and Famagusta to the rocky headlands of the Levant, the white eight-pointed cross commands the sea-lanes of the Eastern Mediterranean. Veteran admirals and merchant syndics alike await the Grand Master's decree: maintain an aggressive permanent war-corso sweeping rival flags from every strait, or inaugurate a prosperous Pax Maritima drawing Christian trade from Venice to Marienburg."
 oe_kni.12.a:0 "Proclaim Permanent White Cross Sea-Corso Supremacy"
 oe_kni.12.b:0 "Inaugurate the Pax Maritima of St. John Across the Levant"
 oe_msn_kni_destiny:0 "White Cross of the Seas: Rhodes, Outremer & the Twin-Cross Pact"
 oe_msn_kni_destiny_DESCRIPTION:0 "Chart the destiny of the Knights of St. John from their island citadel on Rhodes across the Aegean archipelago, into union with Lusignan Cyprus, onward to Antioch and Jerusalem, and into the trans-Eurasian Black Cross & White Cross Pact."
 oe_msn_kni_destiny_CRITERIA_DESCRIPTION:0 "Play as the Knights Hospitaller (or a Kingdom of Jerusalem formed by the Knights) and hold Rhodes, Cyprus, Antioch, or Jerusalem."
 oe_msn_kni_destiny_BUTTON_TOOLTIP:0 "Embark upon the Hospitaller maritime, Outremer, and Twin-Cross Pact mission tree."
 oe_msn_kni_destiny_BUTTON_DETAILS:0 "3 cohesive branches (12 tasks): Bastion of Rhodes & Aegean Sea, Eight Tongues & Cyprus Union, and Return to Outremer & the Black Cross x White Cross Pact."
 oe_msn_kni_01_colossus_harbour:0 "Fortify the Colossus Harbour"
 oe_msn_kni_01_colossus_harbour_desc:0 "Strengthen Rhodes's harbour moles, coastal citadels, and vaulted knightly bastions so the White Cross stands unbroken at the gate of the Aegean."
 oe_msn_kni_01_colossus_harbour_req_tt:0 "Control Rhodes (or a coastal capital), have at least 5 Stability, and hold a Rhodes Sea Citadel, Castle, Coastal Fort, or at least 140 Gold."
 oe_msn_kni_02_aegean_war_galleys:0 "Muster the Aegean War Galleys"
 oe_msn_kni_02_aegean_war_galleys_desc:0 "Expand our Hospitaller dockyards and muster a razor-sharp squadron of oared war galleys capable of outfighting every rival across the Greek islands."
 oe_msn_kni_02_aegean_war_galleys_req_tt:0 "Control Rhodes or Kos, maintain a Dock, Dry Dock, Hospitaller Arsenal, or 15 Naval Tradition, and field at least 10 Ships or 18 Naval Tradition."
 oe_msn_kni_03_break_anatolian_corsairs:0 "Break the Anatolian Corsairs"
 oe_msn_kni_03_break_anatolian_corsairs_desc:0 "Strike the corsair harbors of Smyrna, Aydin, and Menteshe along the Ionian and Carian coast, or establish overwhelming Hospitaller naval superiority."
 oe_msn_kni_03_break_anatolian_corsairs_req_tt:0 "Control Smyrna, Bodrum, Milas, Marmaris, or Antalya (directly or via subject), OR hold 25 Naval Tradition and 10 Stability in the Age of Renaissance or later."
 oe_msn_kni_04_aegean_archipelago_master:0 "Master of the Aegean Archipelago"
 oe_msn_kni_04_aegean_archipelago_master_desc:0 "Secure the strategic island chain from Rhodes and Kos to Chios, Naxos, Crete, and the Ionian coast, turning the Aegean into a White Cross lake."
 oe_msn_kni_04_aegean_archipelago_master_req_tt:0 "Control Rhodes, Kos, at least one central Aegean island (Chios, Samos, Naxos, or Candia), and one coastal bastion (Smyrna, Bodrum, Candia, or Negroponte) with 12 Stability in the Age of Renaissance or later."
 oe_msn_kni_05_audit_eight_tongues:0 "Audit the Eight European Tongues"
 oe_msn_kni_05_audit_eight_tongues_desc:0 "Audit the statutes, responsion ledgers, and knightly rosters of our Eight European Tongues so Western Christendom's patronage flows cleanly to the eastern frontier."
 oe_msn_kni_05_audit_eight_tongues_req_tt:0 "Be Catholic with at least 5 Stability, and have at least 15 Prestige, 150 Gold, or 65 Devotion (as a Theocracy)."
 oe_msn_kni_06_hospital_sea_reforms:0 "Hospital & Sea-Order Reforms"
 oe_msn_kni_06_hospital_sea_reforms_desc:0 "Unite the Order's original charitable vocation with its maritime calling by modernizing Rhodes's Great Hospital, shipboard chirurgeons, and plague lazarettos."
 oe_msn_kni_06_hospital_sea_reforms_req_tt:0 "Have at least 8 Stability and either hold a Hospital, Order Stronghold, or Rhodes Sea Citadel, complete the Hospital of St. John event, or maintain 75 Devotion."
 oe_msn_kni_07_cyprus_union:0 "Union with the Kingdom of Cyprus"
 oe_msn_kni_07_cyprus_union_desc:0 "Bind Nicosia and Famagusta to our Hospitaller standard, uniting the Lusignan crown's Levantine staging ports with the knights of Rhodes."
 oe_msn_kni_07_cyprus_union_req_tt:0 "Control Nicosia and Famagusta (directly or via subject), OR enact the Cyprus Union decision while allied to or overlord of Cyprus."
 oe_msn_kni_08_latin_shield_eastmed:0 "Latin Shield of the Eastern Mediterranean"
 oe_msn_kni_08_latin_shield_eastmed_desc:0 "With fortified anchorages spanning Rhodes, Cyprus, and Crete, stand forth as the impregnable Latin maritime shield of the Eastern Mediterranean."
 oe_msn_kni_08_latin_shield_eastmed_req_tt:0 "Control Rhodes plus Nicosia, Famagusta, or Candia, hold at least 10 Locations (directly or via subjects), and have 12 Stability in the Age of Discovery or later."
 oe_msn_kni_09_smyrna_cilicia_crusade:0 "Crusade for Smyrna & Cilicia"
 oe_msn_kni_09_smyrna_cilicia_crusade_desc:0 "Establish an Anatolian or Cilician beachhead from Smyrna to Tarsus and Adana, securing the northern sea-bridge back toward Crusader Syria."
 oe_msn_kni_09_smyrna_cilicia_crusade_req_tt:0 "Control Smyrna, Adana, Tarsus, Sis, Antalya, or Iskenderun (directly or via subject), OR complete the Smyrna Crusade event with at least 15 Army Tradition."
 oe_msn_kni_10_reclaim_antioch:0 "Reclaim the Principality of Antioch"
 oe_msn_kni_10_reclaim_antioch_desc:0 "Storm the mountain-ringed walls of Antioch and its Syrian ports, restoring the great northern bastion of medieval Outremer."
 oe_msn_kni_10_reclaim_antioch_req_tt:0 "Control Antioch together with at least one neighboring port or march (Iskenderun, Latakia, Tortosa, Adana, or Tripoli) directly or via subject."
 oe_msn_kni_11_liberation_of_jerusalem:0 "Liberation of Jerusalem (Outremer Restored)"
 oe_msn_kni_11_liberation_of_jerusalem_desc:0 "Raise the White Cross above the Church of the Holy Sepulchre and the sea-walls of Acre, fulfilling the sacred dream of Outremer."
 oe_msn_kni_11_liberation_of_jerusalem_req_tt:0 "Control both Jerusalem and Acre (directly or via subject) with at least 10 Stability."
 oe_msn_kni_12_black_white_cross_pact:0 "Pact of the Black Cross & White Cross"
 oe_msn_kni_12_black_white_cross_pact_desc:0 "Crown our maritime hegemony and Outremer restoration by binding the White Cross of the Mediterranean with the Black Cross of the Baltic and Pontus — or standing alone as the supreme Crusader Sovereign of the East."
 oe_msn_kni_12_black_white_cross_pact_req_tt:0 "Have at least 15 Stability in the Age of Discovery or later, and either have sealed the Black Cross & White Cross Pact OR control Jerusalem, Rhodes, and at least 25 Locations (directly or via subjects)."
