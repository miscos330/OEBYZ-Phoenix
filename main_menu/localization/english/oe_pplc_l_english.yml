l_english:
# NEW 2026-11-22 v10.0 Worker 2 (Slot 77): Playable Poland-Lithuania Intermarium (oe_pplc_). Generated by gen_playable_plc.py.
 oe_pplc_player_only_tt:0 "Controlled by a human player leading the Poland-Lithuania Intermarium track."
 oe_pplc_b_relief_savior:0 "Gratitude for the Winged Hussar Relief"
 oe_pplc_b_warsaw_amity:0 "Warsaw Toleration & Intermarium Amity"
 oe_pplc_b_partition_defiance:0 "Defiance Against Partition Intrigues"
 oe_pplc_b_valois_vasa_court:0 "Elective Crown Court Tie"
 oe_pplc_ref_tripartite_commonwealth:0 "Tripartite Commonwealth of Hadiach"
 oe_pplc_ref_tripartite_commonwealth_desc:0 "Establishes the 1658 Treaty of Hadiach framework elevating Ruthenia alongside Poland and Lithuania as a third equal crown, integrating Orthodox nobles and the Registered Cossack Host into Commonwealth law."
 oe_pplc_ref_may_third_constitution:0 "Constitution of 3 May Commonwealth"
 oe_pplc_ref_may_third_constitution_desc:0 "Codifies Europe's first modern written constitution of 3 May 1791: permanently abolishing the Liberum Veto, instituting hereditary constitutional monarchy, majority Sejm governance, and standing-army fiscal vigor."
 oe_pplc_sejm_charter_law:0 "Commonwealth Sejm Charter Law"
 oe_pplc_sejm_charter_law_desc:0 "Defines the voting statutes, royal demesne audits, and noble privileges of the Polish-Lithuanian Sejm, steering the Commonwealth between Golden Liberty, Executionist reform, and modern majority parliamentarism."
 oe_pplc_pol_golden_liberty:0 "Golden Liberty Noble Consensualism"
 oe_pplc_pol_golden_liberty_desc:0 "Upholds Nihil Novi and noble unanimity, rewarding the szlachta with broad privileges and elite heavy cavalry service while risking parliamentary gridlock."
 oe_pplc_pol_executionist_reform:0 "Executionist Demesne Recovery"
 oe_pplc_pol_executionist_reform_desc:0 "Enforces the Executionist Movement's audit of alienated Crown estates, curbing magnate oligarchy and funding standing frontier regiments from recovered royal revenues."
 oe_pplc_pol_majority_sejm:0 "Majority-Vote Constitutional Sejm"
 oe_pplc_pol_majority_sejm_desc:0 "Replaces single-voice obstruction with majority parliamentary voting, pairing burgher representation with streamlined legislation, stability, and Enlightenment scholarship."
 oe_pplc_gdansk_grain_exchange:0 "Gdansk Vistula Grain Exchange"
 oe_pplc_gdansk_grain_exchange_desc:0 "A royal river-and-maritime grain bourse anchoring the Vistula and Intermarium corridors. Pooling rye and wheat barges from Polish, Lithuanian, and Ruthenian estates, it expands local merchant capacity, granary reserves, and trade-center clout."
 oe_pplc_gdansk_grain_exchange_maint:0 "Gdansk Vistula Grain Exchange (Upkeep)"
 oe_pplc_winged_hussars:0 "Commonwealth Winged Hussars"
 oe_pplc_winged_hussars_desc:0 "Steel-cuirassed shock lancers of the Intermarium crowned with feathered wooden wings and hollow five-meter lances. Immortalized at Kircholm (1605), they deliver Eurasia's most devastating morale and shock charge against pike-and-shot lines."
 oe_pplc_registered_cossack_dragoons:0 "Registered Cossack Dragoons"
 oe_pplc_registered_cossack_dragoons_desc:0 "Frontier horse-musketeers enrolled onto the royal register under Stefan Batory in 1578. Equally formidable scouting the Dnieper steppe or dismounting behind wagon laagers, they anchor the Commonwealth's Black Sea marches."
 oe_pplc_adv_winged_hussaria:0 "Intermarium Winged Hussaria & Cossack Doctrine"
 oe_pplc_adv_winged_hussaria_desc:0 "Codifies the shock charge of hollow-lance Winged Hussars alongside flanking Registered Cossack Dragoon firepower, unlocking both elite Commonwealth regiments and raising heavy cavalry prowess."
 STATIC_MODIFIER_NAME_oe_pplc_veto_paralysis_mod:0 "Liberum Veto Sejm Paralysis"
 STATIC_MODIFIER_DESC_oe_pplc_veto_paralysis_mod:0 "Magnate obstruction and foreign bribes invoking 'Nie pozwalam!' repeatedly shatter the Sejm, crippling legislation, stability, and Crown tax collection until curbed by Executionist reform or constitutional abolition."
 STATIC_MODIFIER_NAME_oe_pplc_jagiellon_baltic_drive_mod:0 "Jagiellonian Baltic Offensive"
 STATIC_MODIFIER_DESC_oe_pplc_jagiellon_baltic_drive_mod:0 "Building on the glory of Grunwald, Polish-Lithuanian banners muster heavy horsemen and siege trains to reclaim the Vistula estuary."
 STATIC_MODIFIER_NAME_oe_pplc_ruthenian_east_wing_mod:0 "Lithuanian-Ruthenian Eastern Consolidation"
 STATIC_MODIFIER_DESC_oe_pplc_ruthenian_east_wing_mod:0 "Consolidates fiscal governance and provincial integration from Vilnius to Kyiv across the Dnieper marches."
 STATIC_MODIFIER_NAME_oe_pplc_gdansk_free_port_mod:0 "Gdansk Royal Free-Port Charter"
 STATIC_MODIFIER_DESC_oe_pplc_gdansk_free_port_mod:0 "Grants Gdansk broad commercial autonomy as the Commonwealth's maritime grain emporium, multiplying merchant capacity and sea-trade wealth."
 STATIC_MODIFIER_NAME_oe_pplc_crown_baltic_customs_mod:0 "Crown Baltic Maritime Customs"
 STATIC_MODIFIER_DESC_oe_pplc_crown_baltic_customs_mod:0 "Places Gdansk and Malbork port tolls under direct Crown commissioners, bolstering royal control and direct customs income."
 STATIC_MODIFIER_NAME_oe_pplc_nihil_novi_compact_mod:0 "Compact of Nihil Novi (1505)"
 STATIC_MODIFIER_DESC_oe_pplc_nihil_novi_compact_mod:0 "The 1505 Constitution of Radom secures noble parliamentary consent in return for eager szlachta cavalry mobilization."
 STATIC_MODIFIER_NAME_oe_pplc_crown_towns_bulwark_mod:0 "Crown-Burgher Fiscal Counterweight"
 STATIC_MODIFIER_DESC_oe_pplc_crown_towns_bulwark_mod:0 "Leans on royal cities and burgher tax guilds to resist magnate overreach, strengthening Crown revenue and civic control."
 STATIC_MODIFIER_NAME_oe_pplc_executionist_audit_mod:0 "Executionist Royal Demesne Audit"
 STATIC_MODIFIER_DESC_oe_pplc_executionist_audit_mod:0 "Joint Crown-szlachta audits recover alienated royal estates to fund the Quarter Army and stabilize public finances."
 STATIC_MODIFIER_NAME_oe_pplc_folwark_export_boom_mod:0 "Vistula Folwark Grain Export Boom"
 STATIC_MODIFIER_DESC_oe_pplc_folwark_export_boom_mod:0 "Large noble folwark estates pour Baltic grain westward for immense trade profits at the expense of peasant liberty."
 STATIC_MODIFIER_NAME_oe_pplc_free_tenant_levy_mod:0 "Free-Tenant Vistula Grain Levy"
 STATIC_MODIFIER_DESC_oe_pplc_free_tenant_levy_mod:0 "Replaces harsh serf corvee with standardized money grain dues, nurturing balanced rural prosperity and civic growth."
 STATIC_MODIFIER_NAME_oe_pplc_warsaw_confederation_mod:0 "Warsaw Confederation of Toleration (1573)"
 STATIC_MODIFIER_DESC_oe_pplc_warsaw_confederation_mod:0 "Pledging perpetual peace among Catholic, Orthodox, and Protestant estates, the Commonwealth stands as Europe's beacon of religious toleration."
 STATIC_MODIFIER_NAME_oe_pplc_counter_reformation_zeal_mod:0 "Catholic Counter-Reformation Primacy"
 STATIC_MODIFIER_DESC_oe_pplc_counter_reformation_zeal_mod:0 "Strengthens Catholic dioceses and Jesuit colleges across the Commonwealth, lifting true-faith stability and papal influence."
 STATIC_MODIFIER_NAME_oe_pplc_registered_cossacks_mod:0 "Dnieper Registered Cossack Host"
 STATIC_MODIFIER_DESC_oe_pplc_registered_cossacks_mod:0 "Salaried Cossack regiments enrolled under royal charter patrol the steppe frontier, bolstering light cavalry and border defense."
 STATIC_MODIFIER_NAME_oe_pplc_kircholm_thunder_mod:0 "Thunder of Kircholm: Winged Hussaria"
 STATIC_MODIFIER_DESC_oe_pplc_kircholm_thunder_mod:0 "Winged Hussar banners thunder across open plains, breaking numerically superior pike-and-musket formations with unrivaled shock."
 STATIC_MODIFIER_NAME_oe_pplc_combined_hussar_dragoons_mod:0 "Combined Hussar-Dragoon Tactical Doctrine"
 STATIC_MODIFIER_DESC_oe_pplc_combined_hussar_dragoons_mod:0 "Pairs armored lancers with mobile musket dragoons, raising battlefield discipline, skirmish speed, and sustainable upkeep."
 STATIC_MODIFIER_NAME_oe_pplc_hadiach_tripartite_mod:0 "Spirit of Hadiach: Three Crowns United"
 STATIC_MODIFIER_DESC_oe_pplc_hadiach_tripartite_mod:0 "Reconciling Poland, Lithuania, and Ruthenia as equal realms heals the Dnieper rift, raising cultural capacity, manpower, and Orthodox harmony."
 STATIC_MODIFIER_NAME_oe_pplc_intermarium_corridor_mod:0 "Intermarium Baltic-Black Sea Corridor"
 STATIC_MODIFIER_DESC_oe_pplc_intermarium_corridor_mod:0 "Links Baltic ports with Black Sea estuaries across Vistula and Dnieper river lanes, enriching overland trade and prosperity."
 STATIC_MODIFIER_NAME_oe_pplc_intermarium_bastion_mod:0 "Intermarium Strategic Bastion"
 STATIC_MODIFIER_DESC_oe_pplc_intermarium_bastion_mod:0 "Fortresses and riverine supply lines from Gdansk to Cetatea Alba deter encirclement and extend campaign logistics."
 STATIC_MODIFIER_NAME_oe_pplc_education_commission_mod:0 "Commission of National Education"
 STATIC_MODIFIER_DESC_oe_pplc_education_commission_mod:0 "Europe's first ministry of public education modernizes schools and universities, accelerating literacy, research, and institutional renewal."
 STATIC_MODIFIER_NAME_oe_pplc_anti_partition_mobilization_mod:0 "Anti-Partition National Mobilization"
 STATIC_MODIFIER_DESC_oe_pplc_anti_partition_mobilization_mod:0 "Anticipating foreign partition pacts, the Commonwealth raises a hundred-thousand-strong standing army and fortifies every frontier approach."
 STATIC_MODIFIER_NAME_oe_pplc_intermarium_constitutional_hegemon_mod:0 "Constitutional Hegemon of the Intermarium (3 May 1791)"
 STATIC_MODIFIER_DESC_oe_pplc_intermarium_constitutional_hegemon_mod:0 "Having buried both the Liberum Veto and the specter of partition, the Constitutional Commonwealth stands as the premier modern power spanning Baltic to Black Sea."
 STATIC_MODIFIER_NAME_oe_pplc_savior_of_christendom_mod:0 "Winged Reliever of Christendom"
 STATIC_MODIFIER_DESC_oe_pplc_savior_of_christendom_mod:0 "'Venimus, vidimus, Deus vicit' — Commonwealth hussars riding to relieve a besieged imperial capital win lasting prestige and diplomatic majesty."
 oe_pplc_dec_executionist_audit.title:0 "Enact Executionist Royal Demesne Audit"
 oe_pplc_dec_executionist_audit.desc:0 "Backed by the middle szlachta Executionist Movement, dispatch royal auditors to reclaim alienated Crown lands (Królewszczyzny), replenishing the treasury and lowering the Sejm Liberum Veto index."
 oe_pplc_dec_executionist_audit.a:0 "Audit Alienated Crown Estates"
 oe_pplc_dec_executionist_audit_tt:0 "Lowers the Liberum Veto index by #G -15#!, replenishes royal coffers, and grants #Y 10 years#! of Executionist Royal Demesne Audit (10-year cooldown)."
 oe_pplc_dec_expand_cossack_register.title:0 "Expand the Registered Cossack Roll"
 oe_pplc_dec_expand_cossack_register.desc:0 "Continuing Stefan Batory's 1578 military charter, expand the salaried royal register of Dnieper Cossacks (up to tier 4), unlocking Registered Cossack Dragoons and strengthening the steppe frontier."
 oe_pplc_dec_expand_cossack_register.a:0 "Grant Royal Cossack Register Charters"
 oe_pplc_dec_expand_cossack_register_tt:0 "Raises Cossack Register tier by #G +1#! (max 4), improves Cossack estate satisfaction, and grants #Y 15 years#! of Dnieper Registered Cossack Host."
 oe_pplc_dec_abolish_liberum_veto.title:0 "Abolish Liberum Veto: Proclaim the 3 May Constitution"
 oe_pplc_dec_abolish_liberum_veto.desc:0 "With parliamentary obstruction tamed (Veto index <= 20) or the Enlightenment dawn of 1785 arrived, summon the Great Sejm to permanently abolish the Liberum Veto and proclaim the Constitution of 3 May."
 oe_pplc_dec_abolish_liberum_veto.a:0 "Ratify the Constitution of 3 May!"
 oe_pplc_dec_abolish_liberum_veto_tt:0 "Permanently abolishes the Liberum Veto (index reset to 0), enacts the Constitution of 3 May Commonwealth reform, and grants the permanent Constitutional Hegemon of the Intermarium modifier."
 oe_pplc.1.t:0 "The Jagiellonian Vow: Echoes of Krewo and Grunwald"
 oe_pplc.1.d:0 "The compact of Krewo and the thunder of Grunwald have redrawn the balance of eastern Europe. With Krakow and Vilnius bound in common purpose, the royal council weighs the next generation's grand strategy: press north against the Teutonic Knights for Pomerelia and the Baltic shore, or consolidate the vast Ruthenian marches first."
 oe_pplc.1.a:0 "Press North: Reclaim Pomerelia and the Vistula Estuary"
 oe_pplc.1.a.tt:0 "Grants #Y 20 years#! of Jagiellonian Baltic Offensive (heavy cavalry & siege bonus) and #G +10#! Army Tradition."
 oe_pplc.1.b:0 "Consolidate the East: Bind Vilnius and Kyiv into One Realm"
 oe_pplc.1.b.tt:0 "Grants #Y 20 years#! of Lithuanian-Ruthenian Eastern Consolidation and lowers the Veto index by #G -5#!."
 oe_pplc.2.t:0 "The Thirteen Years' War and the Golden Outlet of Gdansk"
 oe_pplc.2.d:0 "After years of struggle beside the Prussian Confederation, Malbork's brick citadel and the great harbor of Gdansk stand beneath our banners. Grain barges descending the Vistula can now sail unimpeded to the North Sea. The burghers of Gdansk petition for sweeping free-port privileges, while royal treasurers urge direct Crown customs."
 oe_pplc.2.a:0 "Grant Gdansk a Royal Free-Port Charter"
 oe_pplc.2.a.tt:0 "Grants #G +180#! gold and #Y 30 years#! of Gdansk Royal Free-Port Charter (merchant capacity & sea trade)."
 oe_pplc.2.b:0 "Establish Direct Crown Baltic Customs"
 oe_pplc.2.b.tt:0 "Lowers the Veto index by #G -8#! and grants #Y 30 years#! of Crown Baltic Maritime Customs."
 oe_pplc.3.t:0 "1505: Nihil Novi Nisi Commune Consensu"
 oe_pplc.3.d:0 "At the Sejm of Radom, delegates of the szlachta present a historic demand: 'Nothing new without the common consent' of Senate and Chamber of Deputies. Signing Nihil Novi guarantees fierce noble devotion on the battlefield, yet plants the institutional seed of parliamentary veto power."
 oe_pplc.3.a:0 "Sign Nihil Novi to Secure Full Szlachta Mobilization"
 oe_pplc.3.a.tt:0 "Raises the Liberum Veto index by #R +15#! and grants #Y 30 years#! of Compact of Nihil Novi (heavy cavalry & noble satisfaction)."
 oe_pplc.3.b:0 "Resist Magnate Coercion via Royal Towns and Treasury"
 oe_pplc.3.b.tt:0 "Lowers the Liberum Veto index by #G -10#! at the cost of noble discontent, granting #Y 25 years#! of Crown-Burgher Fiscal Counterweight."
 oe_pplc.4.t:0 "The Executionist Movement and Crown Demesne Recovery"
 oe_pplc.4.d:0 "Outraged by great magnates monopolizing royal leaseholds, the middle szlachta launch the Executionist Movement (Ruch Egzekucyjny), demanding strict enforcement of ancient statutes and the return of alienated Crown lands to fund a permanent Quarter Army."
 oe_pplc.4.a:0 "Back the Executionists and Reclaim Alienated Crown Lands"
 oe_pplc.4.a.tt:0 "Slashes the Liberum Veto index by #G -15#!, adds #G +200#! gold, and grants #Y 30 years#! of Executionist Royal Demesne Audit."
 oe_pplc.4.b:0 "Compromise with the Magnate Houses to Preserve Calm"
 oe_pplc.4.b.tt:0 "Raises the Liberum Veto index by #R +8#! in exchange for #G +8#! Stability and noble goodwill."
 oe_pplc.5.t:0 "The Price of the Vistula Folwark Granary"
 oe_pplc.5.d:0 "Surging grain demand in Amsterdam and London has turned the Vistula basin into Europe's granary. Magnates race to expand demesne folwarks using compulsory peasant labor to export rye downriver—pouring silver into manor coffers while deepening rural serfdom."
 oe_pplc.5.a:0 "Expand Magnate Folwark Estates for Export Windfalls"
 oe_pplc.5.a.tt:0 "Gains #G +300#! gold and #Y 30 years#! of Vistula Folwark Grain Export Boom, but raises Veto index by #R +8#! and lowers peasant satisfaction."
 oe_pplc.5.b:0 "Enact Free-Tenant Grain Dues for Balanced Modernization"
 oe_pplc.5.b.tt:0 "Grants #Y 30 years#! of Free-Tenant Vistula Grain Levy (prosperity, production & peasant satisfaction) and lowers Veto index by #G -5#!."
 oe_pplc.6.t:0 "The Grand Union of Lublin and 1573 Warsaw Confederation"
 oe_pplc.6.d:0 "Crowning the constitutional consolidation of Lublin while western Europe burns in wars of religion, delegates at Warsaw draft an unprecedented covenant: Catholic, Orthodox, and Protestant lords pledge perpetual religious peace so that creed shall never tear the Commonwealth apart."
 oe_pplc.6.a:0 "Ratify the Warsaw Confederation of Religious Toleration"
 oe_pplc.6.a.tt:0 "Enacts the Warsaw Toleration milestone (bridging Ecumenical Religion 2.0), granting #Y 40 years#! of Warsaw Confederation and #G +15#! Prestige."
 oe_pplc.6.b:0 "Uphold Catholic Counter-Reformation Primacy"
 oe_pplc.6.b.tt:0 "Grants #Y 30 years#! of Catholic Counter-Reformation Primacy (true-faith tolerance & conversion speed)."
 oe_pplc.7.t:0 "Free Royal Election (Wolna Elekcja) and the Henrician Articles"
 oe_pplc.7.d:0 "Tens of thousands of armed szlachta gather on the Wola plain outside Warsaw for the Free Royal Election (Wolna Elekcja), binding the next monarch to the Henrician Articles. Four factions vie for the Crown: the French Valois, Transylvanian warlord Stefan Batory, the Swedish House of Vasa, and a native Piast candidate."
 oe_pplc.7.a:0 "Elect Stefan Batory: Martial Genius and Cossack Reform"
 oe_pplc.7.a.tt:0 "Lowers Veto index by #G -5#!, raises Cossack Register #G +1#!, and grants #G +12#! Army Tradition and #G +10#! Prestige."
 oe_pplc.7.b:0 "Elect a Native Piast Sovereign: Curb Foreign Meddling"
 oe_pplc.7.b.tt:0 "Slashes Veto index by #G -12#!, granting #G +10#! Stability and bolstered royal legitimacy."
 oe_pplc.7.c:0 "Elect a French Valois Prince: Western Prestige and Amity"
 oe_pplc.7.c.tt:0 "Grants #G +20#! Prestige and warms ties with France, though concessions raise the Veto index by #R +10#!."
 oe_pplc.7.opt4:0 "Elect the House of Vasa: Baltic Ambition and Naval Drive"
 oe_pplc.7.opt4.tt:0 "Grants #G +12#! Navy Tradition and #G +120#! gold, while elevating the Veto index by #R +8#!."
 oe_pplc.8.t:0 "Batory's Reforms and the Registered Cossacks"
 oe_pplc.8.d:0 "Along the lower Dnieper, the Zaporozhian Cossacks form an untamed frontier shield against steppe raids—yet neglect could ignite rebellion. Royal reformers propose a formal Cossack Register (Reiestrovy Kozaky): royal pay, regimental banners, and lawful liberties in return for loyal frontier service."
 oe_pplc.8.a:0 "Charter and Fund the Registered Cossack Host"
 oe_pplc.8.a.tt:0 "Costs #R -100#! gold, raises Cossack Register #G +1#!, unlocks Cossack Dragoons, and grants #Y 30 years#! of Dnieper Registered Cossack Host."
 oe_pplc.8.b:0 "Save the Treasury and Leave the Frontier to Magnate Retinues"
 oe_pplc.8.b.tt:0 "Preserves gold and pleases magnates, but raises Veto index by #R +6#! and alienates the Cossack Host."
 oe_pplc.9.t:0 "Thunder of Kircholm: Zenith of the Winged Hussaria"
 oe_pplc.9.d:0 "News of Kircholm electrifies every court in Europe: a few thousand steel-armored Winged Hussars (Husaria), lances leveled and eagle feathers howling in the wind, shattered a modern pike-and-shot host three times their number in twenty minutes. The Grand Hetman urges codifying this triumph into standing doctrine."
 oe_pplc.9.a:0 "Expand Elite Heavy Winged Hussar Shock Banners"
 oe_pplc.9.a.tt:0 "Grants #Y 35 years#! of Thunder of Kircholm (+18% heavy cavalry power, morale & tradition) and #G +15#! Prestige."
 oe_pplc.9.b:0 "Adopt Combined Hussar-Dragoon Combined-Arms Doctrine"
 oe_pplc.9.b.tt:0 "Grants #Y 35 years#! of Combined Hussar-Dragoon Tactical Doctrine (discipline, light cavalry & upkeep)."
 oe_pplc.10.t:0 "The Deluge (Potop) and the 1658 Treaty of Hadiach"
 oe_pplc.10.d:0 "Tempests close in from every horizon as the Deluge (Potop) shakes the Commonwealth to its foundations. Amid the storm, Cossack Hetman Ivan Vyhovsky offers the historic Treaty of Hadiach: elevate Ruthenia as a third equal Grand Duchy alongside Poland and Lithuania, seating Orthodox metropolitans in the Senate and forging a Tripartite Commonwealth."
 oe_pplc.10.a:0 "Ratify the 1658 Treaty of Hadiach: Three Equal Crowns!"
 oe_pplc.10.a.tt:0 "Enacts the Tripartite Commonwealth of Hadiach reform, raises Cossack Register #G +2#!, and grants #Y 40 years#! of Spirit of Hadiach!"
 oe_pplc.10.b:0 "Reject Tripartite Concessions and Crush the Revolt by Steel"
 oe_pplc.10.b.tt:0 "Gains #G +10#! Army Tradition and noble support, but raises the Veto index by #R +10#! and shakes stability."
 oe_pplc.11.t:0 "'Nie Pozwalam!' — The Liberum Veto Paralysis Crisis"
 oe_pplc.11.d:0 "Chaos erupts in the Warsaw Sejm! On the brink of passing an urgent defense levy, a single deputy bribed by foreign envoys rises to shout 'Nie pozwalam!'—exploding the entire session under the abused Liberum Veto. Neighboring courts mock that Poland survives by anarchy alone; only an armed Confederation (Konfederacja) can break the deadlock."
 oe_pplc.11.a:0 "Form a Patriotic Confederation (Konfederacja) to Force Majority Vote"
 oe_pplc.11.a.tt:0 "Slashes the Liberum Veto index by #G -25#!, breaking Sejm paralysis at the price of short-term noble and stability shock."
 oe_pplc.11.b:0 "Bribe the Obstructing Magnate Faction for a Temporary Truce"
 oe_pplc.11.b.tt:0 "Spends #R -180#! gold while the Liberum Veto index worsens by #R +10#!, deepening parliamentary paralysis."
 oe_pplc.12.t:0 "Corridor of the Intermarium Complete"
 oe_pplc.12.d:0 "From Baltic harbors at Gdansk and Riga across the Vistula and Dnieper basins down to the Black Sea approaches, the Intermarium corridor stands open beneath Commonwealth banners. Timber, grain, and Levantine wares flow freely through our inland arteries, anchoring eastern Europe's geopolitical spine."
 oe_pplc.12.a:0 "Charter the Baltic-Black Sea Riverine Transit Corridor"
 oe_pplc.12.a.tt:0 "Sets the Intermarium corridor global flag, granting #Y 40 years#! of Intermarium Baltic-Black Sea Corridor and #G +20#! Prestige."
 oe_pplc.12.b:0 "Fortify the Intermarium Strategic Bastion Network"
 oe_pplc.12.b.tt:0 "Sets the Intermarium corridor global flag and grants #Y 40 years#! of Intermarium Strategic Bastion."
 oe_pplc.13.t:0 "Commission of National Education and Warsaw Enlightenment"
 oe_pplc.13.d:0 "The Enlightenment illuminates Warsaw and Krakow! Reformers propose establishing Europe's first ministry of public education—the Commission of National Education (Komisja Edukacji Narodowej)—to modernize schools, science, and civic jurisprudence alongside a Royal Cadet Corps."
 oe_pplc.13.a:0 "Found the Commission of National Education"
 oe_pplc.13.a.tt:0 "Lowers Veto index by #G -10#!, grants #G +10#! Cultural Tradition and #Y 35 years#! of Commission of National Education."
 oe_pplc.13.b:0 "Patronize the Warsaw Royal Cadet Corps & Artillery Academy"
 oe_pplc.13.b.tt:0 "Grants #G +15#! Army Tradition, research progress, and #Y 30 years#! of Combined Tactical Doctrine."
 oe_pplc.14.t:0 "Shattering the Partition Conspiracy: Shadows on Every Border"
 oe_pplc.14.d:0 "Warsaw cryptographers intercept chilling dispatches: neighboring absolutist courts are plotting a secret partition treaty to dismember the Commonwealth. Refusing to become history's victim, the Sejm must rally the nation before foreign bayonets cross the frontier."
 oe_pplc.14.a:0 "Proclaim National Mobilization and Defy Every Partitioner!"
 oe_pplc.14.a.tt:0 "Slashes Veto index by #G -15#! and grants #Y 25 years#! of Anti-Partition National Mobilization."
 oe_pplc.14.b:0 "Divide Rival Courts Through High Diplomacy and War Reserves"
 oe_pplc.14.b.tt:0 "Adds #G +200#! gold, #G +10#! Stability, and #Y 20 years#! of Intermarium Strategic Bastion."
 oe_pplc.15.t:0 "1791: Proclamation of the Constitution of 3 May"
 oe_pplc.15.d:0 "Bells ring across Warsaw as the Great Sejm rises in the Royal Castle to ratify Europe's first modern written charter—the Constitution of 3 May 1791 (Konstytucja 3 Maja). Permanently burying the Liberum Veto, it establishes hereditary constitutional kingship, separation of powers, burgher rights, and legal protection for the peasantry."
 oe_pplc.15.a:0 "Proclaim the Constitution of 3 May and Abolish Liberum Veto Forever!"
 oe_pplc.15.a.tt:0 "Permanently abolishes the Liberum Veto, enacts Constitution of 3 May Commonwealth, and grants permanent Constitutional Hegemon of the Intermarium!"
 oe_pplc.15.b:0 "Enact a Moderate Constitutional Compromise with Senate Guarantees"
 oe_pplc.15.b.tt:0 "Permanently abolishes the Liberum Veto, enacts the constitutional reform, and reconciles both nobles and burghers."
 oe_pplc.16.t:0 "Relief of Vienna or Compact with Constantinople: Crossroads of Christendom"
 oe_pplc.16.d:0 "Urgent couriers ride north from the Danube and the Bosporus as rival armies menace the great imperial capitals of the south. All Christendom watches the Vistula: should our Winged Hussars thunder south to relieve Vienna or stand beside Constantinople, the Commonwealth will claim immortal glory."
 oe_pplc.16.a:0 "'Venimus, Vidimus, Deus Vicit!' — Ride to the Relief!"
 oe_pplc.16.a.tt:0 "Grants #G +30#! Prestige, #G +12#! Army Tradition, #Y 30 years#! of Winged Reliever of Christendom, and deep goodwill with Austria/Byzantium!"
 oe_pplc.16.b:0 "Demand Danubian and Black Sea Commercial Concessions First"
 oe_pplc.16.b.tt:0 "Gains #G +220#! gold and #Y 20 years#! of Intermarium Baltic-Black Sea Corridor."
