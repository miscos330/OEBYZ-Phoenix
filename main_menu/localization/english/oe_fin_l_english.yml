 oe_fin.101.title: "Sovereign Joint-Stock Fever"
 oe_fin.101.desc: "Merchant houses and court financiers petition to charter joint-stock ventures backed by state monopolies. Subscriptions fill within hours as capital floods the exchange—promising rapid commercial growth alongside rising speculative heat."
 oe_fin.101.a: "Charter the royal joint-stock ventures under broad subscription"
 oe_fin.101.b: "Impose strict charter audits and reserve requirements"
 oe_fin.102.title: "Overseas Company Stock Boom"
 oe_fin.102.desc: "Treasure ships and chartered colonial fleets return with record spice, tea, and bullion cargoes. Share prices double on the bourse as noblemen, burghers, and clerks rush to mortgage estates for a stake in overseas trade."
 oe_fin.102.a: "Expand overseas charters and ride the dividend windfall"
 oe_fin.102.b: "Tax capital gains to fortify the treasury reserve"
 oe_fin.103.title: "Paper Credit Expansion"
 oe_fin.103.desc: "Leading bankers propose issuing bearer banknotes and negotiable treasury bills backed by future tax receipts. Paper credit promises to lubricate trade and arm our fleets faster than minting silver ever could—yet unrestrained printing invites inflation."
 oe_fin.103.a: "Authorize wide banknote circulation to fuel credit growth"
 oe_fin.103.b: "Tie every note strictly to vaulted silver and gold reserves"
 oe_fin.104.title: "Speculative Euphoria on the Exchange"
 oe_fin.104.desc: "Tulip contracts, South Sea annuities, and Mississippi land shares trade at dizzying multiples. Pamphleteers mock cautious elders while brokers leverage every ducat tenfold. Our financial advisers warn that one missed dividend could burst the mania."
 oe_fin.104.a: "Let the market soar and float crown shares at the peak"
 oe_fin.104.b: "Clamp down on leveraged futures and cool the exchange"
 oe_fin.105.title: "Margin Call Panic"
 oe_fin.105.desc: "The bubble has snapped! After a flagship overseas venture misses its quarterly dividend, stock quotations plunge before noon. Brokers hammer doors demanding margin collateral, insolvent syndicates drag down clearing banks, and sovereign bond yields spike vertically."
 oe_fin.105.a: "Declare an emergency clearing moratorium and begin stabilization"
 oe_fin.105.b: "Leave speculators to face ruin while shielding the crown purse"
 oe_fin.106.title: "Run on the Bourse"
 oe_fin.106.desc: "Before dawn, thousands of anxious depositors pack the avenues outside the stock exchange and royal discounting counters, waving paper bills and demanding hard silver. Soldiers stand uneasily at the iron gates as rumors of bankruptcy sweep the capital."
 oe_fin.106.a: "Open emergency silver payouts to calm the crowd"
 oe_fin.106.b: "Close the exchange shutters and deploy city militia"
 oe_fin.107.title: "Sovereign Default Brink"
 oe_fin.107.desc: "Compounding debt service now consumes a terrifying share of annual revenues. Foreign creditors refuse to roll over maturing war loans unless the crown pledges customs farms or enacts brutal retrenchment."
 oe_fin.107.a: "Enact emergency austerity and honor every coupon in full"
 oe_fin.107.b: "Impose a unilateral interest haircut on creditors"
 oe_fin.108.title: "Emergency Bullion Suspension"
 oe_fin.108.desc: "Drain of gold and silver coin toward foreign ports has shrunk our central vaults to dangerous lows. The treasury board debates suspending cash convertibility until trade balances recover, risking inflation to prevent complete vault exhaustion."
 oe_fin.108.a: "Suspend bullion convertibility temporarily to save the vaults"
 oe_fin.108.b: "Defend the metallic standard with emergency customs surcharges"
 oe_fin.109.title: "Central Bank Lender-of-Last-Resort"
 oe_fin.109.desc: "When healthy mercantile houses face sudden liquidity freezes, our central bank directors propose acting boldly as lender of last resort—advancing crisp liquidity against solid commercial bills at a disciplined penalty rate."
 oe_fin.109.a: "Open the discount window and rescue solvent merchant houses"
 oe_fin.109.b: "Restrict bailouts strictly to state arms and grain contractors"
 oe_fin.110.title: "Public Debt Consolidation"
 oe_fin.110.desc: "Dozens of chaotic short-term loans, tax-farm advances, and municipal IOUs burden the exchequer at mismatched rates. Treasury reformers propose converting the patchwork into unified, transparent perpetual consol bonds traded openly on the exchange."
 oe_fin.110.a: "Consolidate all obligations into unified perpetual consols"
 oe_fin.110.b: "Retire the costliest tax-farm contracts with direct treasury coin"
 oe_fin.111.title: "Sinking Fund Establishment"
 oe_fin.111.desc: "Financial statesmen present a statutory Sinking Fund dedicated exclusively to buying back sovereign debt principal on the open market each quarter—visibly anchoring bond prices and lowering borrowing costs across generations."
 oe_fin.111.a: "Endow the inviolable statutory Sinking Fund"
 oe_fin.111.b: "Keep surplus funds flexible for naval and border emergencies"
 oe_fin.112.title: "Paper Currency Credibility Crisis"
 oe_fin.112.desc: "Counterfeit notes and excessive treasury emissions have eroded confidence in paper money. Shopkeepers post twin prices—one in silver coin, a far steeper one in printed bills—threatening commercial paralysis unless confidence is restored."
 oe_fin.112.a: "Recall depreciated bills at full par and burn excess emissions"
 oe_fin.112.b: "Mandate acceptance of treasury notes by penal decree"
 oe_fin.113.title: "International Bond Syndicates"
 oe_fin.113.desc: "Cosmopolitan merchant bankers spanning Amsterdam, London, Genoa, and Constantinople offer to syndicate our sovereign bonds across international bourses, linking our fiscal credibility directly to global capital flows."
 oe_fin.113.a: "Welcome international underwriting syndicates on transparent terms"
 oe_fin.113.b: "Reserve sovereign debt exclusively for domestic estates and guilds"
 oe_fin.114.title: "War-Bond Patriotic Subscription"
 oe_fin.114.desc: "Faced with great-power tensions and rising fleet and artillery bills, ministers launch a public subscription of small-denomination patriotic war bonds. Guilds, officers, and townsfolk queue outside municipal halls to finance the realm's defense."
 oe_fin.114.a: "Open nationwide patriotic war-bond registries"
 oe_fin.114.b: "Pair the subscription with a dedicated post-war redemption tax"
 oe_fin.115.title: "Post-Crash Financial Regulation"
 oe_fin.115.desc: "In the sober aftermath of speculative excess, jurists and economists draft a comprehensive Bourse Regulation Act—mandating audited balance sheets, banning phantom bubble companies, and separating commercial deposits from risky equity underwriting."
 oe_fin.115.a: "Enact strict Bourse Regulation and public audit statutes"
 oe_fin.115.b: "Favor light-touch merchant self-regulation through the guild board"
 oe_fin.116.title: "Modern Sovereign Credit Order"
 oe_fin.116.desc: "Forged through booms, panics, and institutional discipline, our central bank, perpetual bond market, and audited treasury budget now command unmatched global trust—raising armies and industrial infrastructure at a fraction of rivals' interest cost."
 oe_fin.116.a: "Proclaim the Modern Sovereign Credit Charter"
 oe_fin.116.b: "Channel our sterling credit directly into industrial workshops and fleets"
