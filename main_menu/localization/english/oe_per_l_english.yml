 STATIC_MODIFIER_DESC_oe_per_qizilbash_oath_mod: "The horsemen of the tribes put on the twelve-gored red cap and swear to die for the order."
 STATIC_MODIFIER_NAME_oe_per_qizilbash_banner_mod: "Under the Qizilbash Banners"
 STATIC_MODIFIER_DESC_oe_per_qizilbash_banner_mod: "The army leans on the tribal banners, and the Qizilbash levies fight all the better for it."
 STATIC_MODIFIER_NAME_oe_per_ghulam_corps_mod: "The King's Own Corps"
 STATIC_MODIFIER_DESC_oe_per_ghulam_corps_mod: "The army leans on standing corps that answer to the king."
 STATIC_MODIFIER_NAME_oe_per_triad_corps_mod: "The Three Corps Founded"
 STATIC_MODIFIER_DESC_oe_per_triad_corps_mod: "The ghulams, the musketeers and the gunners have been newly raised."
 STATIC_MODIFIER_NAME_oe_per_nisf_e_jahan_mod: "Half the World"
 STATIC_MODIFIER_DESC_oe_per_nisf_e_jahan_mod: "The square, the avenue and the gardens of the new capital astonish merchants from afar."
 STATIC_MODIFIER_NAME_oe_per_gulf_reclaimed_mod: "The Gulf Reopened"
 STATIC_MODIFIER_DESC_oe_per_gulf_reclaimed_mod: "The passage at the mouth of the Gulf is in our own hands again."
