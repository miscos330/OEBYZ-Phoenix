# NEW 2026-11-22 v11.5 Worker 1 (oe_per_). Generated by gen_v115_persia.py; edit the generator, not this file.
 oe_per_isfahan_hikmat_school: "School of Isfahan"
 oe_per_isfahan_hikmat_school_desc: "The scholars of Isfahan, Mulla Sadra foremost among them, fused philosophy, mysticism and scholastic theology into one tradition."
 oe_per_samarkand_zij_school: "School of the Samarkand Tables"
 oe_per_samarkand_zij_school_desc: "Ulugh Beg built an observatory at Samarkand and gathered scholars to measure the stars; this school prizes observation and mathematics. Only the countries of Persia and Central Asia may adopt it."
 oe_per_naqsh_e_jahan_complex: "Royal Square and Caravanserai College"
 oe_per_naqsh_e_jahan_complex_desc: "A mosque, a college, a bazaar and a caravanserai around one great square. It can be built only in Isfahan, Samarkand, Herat, Tabriz, Shiraz and Qazvin, one in each; in the capital it also helps the whole country. Requires the Silk Works of Isfahan advance."
 oe_per_naqsh_e_jahan_complex_maint: "Upkeep"
 oe_per_royal_army_law: "The Army of Iran"
 oe_per_royal_army_law_desc: "On whom the king's army rests: the banners of the Qizilbash tribes, or three standing corps answering to the king alone."
 oe_per_pol_qizilbash_banners: "Qizilbash Tribal Banners"
 oe_per_pol_qizilbash_banners_desc: "The chiefs lead the horsemen of their own tribes to war and are paid in land grants. The cavalry is superb, but it obeys its chiefs."
 oe_per_pol_abbas_triad_corps: "Three Standing Corps"
 oe_per_pol_abbas_triad_corps_desc: "Ghulam guards, musketeers and gunners kept by the king himself and paid from the crown lands."
 oe_per_silk_monopoly_law: "Silk and the Trade Roads"
 oe_per_silk_monopoly_law_desc: "The raw silk of the Caspian shore is the most valuable thing this country produces. Who is to sell it?"
 oe_per_pol_khassa_silk_monopoly: "Crown Monopoly of Silk"
 oe_per_pol_khassa_silk_monopoly_desc: "The silk provinces become crown land, and raw silk may be sold only to the king's agents."
 oe_per_pol_new_julfa_guilds: "Chartered Merchant Houses"
 oe_per_pol_new_julfa_guilds_desc: "Hand the silk trade to trusted merchant houses, the Armenians above all, whose routes reach far overseas."
 oe_per_timurid_chancery_reform: "The Chancery of Letters"
 oe_per_timurid_chancery_reform_desc: "After the courts of Samarkand and Herat, entrust the records and the revenue to secretaries schooled in Persian and Turkic letters."
 oe_per_shahanshah_eranshahr_reform: "King of Kings"
 oe_per_shahanshah_eranshahr_reform_desc: "Take up again the title and ceremony of the ancient kings of Iran, ruling over many peoples and faiths."
 oe_per_priv_qizilbash_tiyul: "Qizilbash Land Grants"
 oe_per_priv_qizilbash_tiyul_desc: "Assign the revenue of the provinces to the Qizilbash chiefs as grants to keep their men. More soldiers, and a weaker crown."
 oe_per_priv_armenian_julfa_factors: "Privileges of the Silk Factors"
 oe_per_priv_armenian_julfa_factors_desc: "Let the Armenian silk merchants keep their own quarter, courts and churches, in return for handling the king's silk."
 oe_per_adv_zij_sultani: "The Sultan's Star Tables"
 oe_per_adv_zij_sultani_desc: "At the observatory of Samarkand the places of more than a thousand stars are measured anew, making the most exact tables of the age."
 oe_per_adv_chaldiran_gunpowder: "The Lesson of the Guns"
 oe_per_adv_chaldiran_gunpowder_desc: "After the horsemen were broken before wagons, cannon and matchlocks, the realm begins to cast guns and train musketeers."
 oe_per_adv_ghulam_standing_corps: "The Ghulam Corps"
 oe_per_adv_ghulam_standing_corps_desc: "Royal servants brought from the Caucasus and elsewhere, trained from boyhood and loyal to the king alone."
 oe_per_adv_isfahan_silk_factories: "The Silk Works of Isfahan"
 oe_per_adv_isfahan_silk_factories_desc: "Royal workshops, the bazaar and the caravanserais work as one. Unlocks the Royal Square and Caravanserai College."
 oe_per_player_only_tt: "Only a player-controlled country can use this"
 oe_per_dec_patronize_samarkand_herat.title: "Found an Observatory and an Atelier"
 oe_per_dec_patronize_samarkand_herat.desc: "Build an observatory at Samarkand and a court atelier at Herat. Requires one of the two cities; costs 150 gold, raises the flowering of letters by 20, and lasts 15 years."
 oe_per_dec_patronize_samarkand_herat.a: "Begin the work"
 oe_per_dec_abbas_triad_reform.title: "Raise the Three Standing Corps"
 oe_per_dec_abbas_triad_reform.desc: "Raise ghulam guards, musketeers and gunners who answer to the king alone. Requires the Lesson of the Guns advance; costs 200 gold, moves the army axis 30 towards the standing corps, and lasts 15 years."
 oe_per_dec_abbas_triad_reform.a: "Decree it"
 oe_per_dec_isfahan_nisf_e_jahan.title: "Build the New Isfahan"
 oe_per_dec_isfahan_nisf_e_jahan.desc: "Lay out the great square, the avenue of the four gardens and the royal workshops at Isfahan, and set off a fashion for silk in the capital's market. Requires Isfahan; costs 250 gold and lasts 20 years."
 oe_per_dec_isfahan_nisf_e_jahan.a: "Build it"
 oe_per_dec_hormuz_gulf_expedition.title: "Reclaim the Mouth of the Gulf"
 oe_per_dec_hormuz_gulf_expedition.desc: "Gather ships and men to take back the passage at the mouth of the Gulf. Requires a port, and either that Europeans have imposed their pass system on the Indian Ocean or that the year 1600 has come; costs 200 gold and lasts 20 years."
 oe_per_dec_hormuz_gulf_expedition.a: "Send the expedition"
 oe_per.1.title: "The Legacy of the Ilkhans"
 oe_per.1.desc: "The Ilkhanate survives in name only. Tabriz, Baghdad, Shiraz and Herat each have their own master, and every one of them claims to be the rightful heir. What shall we do?"
 oe_per.1.a: "Raise the banner of the Ilkhans"
 oe_per.1.b: "Set our own house in order first"
 oe_per.2.title: "Samarkand or Herat"
 oe_per.2.desc: "Two jewel cities rival one another for the heart of the realm: Samarkand in Transoxiana, famed for its grand madrasas and towering observatory, and Herat in Khorasan, renowned for lyrical verse, luminous ateliers, and lush gardens. With finite royal patronage, the court must decide which proud centre to favour first."
 oe_per.2.a: "Samarkand: scholars and the observatory"
 oe_per.2.b: "Herat: poets and painters"
 oe_per.3.title: "The Star Tables Completed"
 oe_per.3.desc: "After years of tireless nightly observations with monumental sextants and brass astrolabes, the scholars of our royal observatory have fixed the positions of over a thousand stars with unmatched precision. With the new astronomical tables complete at last, the court must decide whether to share this landmark treatise with scholars everywhere or reserve it for the palace."
 oe_per.3.a: "Send copies to scholars everywhere and follow the school of the tables"
 oe_per.3.b: "Keep them at court"
 oe_per.4.title: "The Court Atelier"
 oe_per.4.desc: "A young master of astonishing gift has emerged within the royal book-atelier, crafting illuminated miniatures whose jewel-bright pigments, delicate brushwork, and lifelike figures have dazzled every courtier who beheld them. The head of the workshop begs the crown to retain him in splendour and grant him apprentices to found a lasting school."
 oe_per.4.a: "Keep him in style"
 oe_per.4.b: "The usual stipend will do"
 oe_per.5.title: "The Oath of the Red Caps"
 oe_per.5.desc: "A religious order is gaining ground among the tribes of the highlands; their horsemen put on the twelve-gored red cap and swear to die for their master. They could be a splendid army, or a state within the state."
 oe_per.5.a: "Take them into our service"
 oe_per.5.b: "Keep them at a distance"
 oe_per.6.title: "The Lesson of the Guns"
 oe_per.6.desc: "Word comes from the frontier: the enemy chained their wagons and cannon into a line and fired their matchlocks in volleys, and our best horsemen could not break through. The commanders argue over what is to be done."
 oe_per.6.a: "Cast cannon and train musketeers"
 oe_per.6.b: "The horsemen are still our strength"
 oe_per.7.title: "The King and the Qizilbash"
 oe_per.7.desc: "Paid directly from the royal fisc and armed with muskets and cannon, our newly raised standing corps are rapidly taking shape. The proud Qizilbash tribal chieftains recognize at once that these loyal regiments are designed to break their military hold on the throne, and whispered conspiracies are already circulating among their camps."
 oe_per.7.a: "Take back their grants and hold them down with the new corps"
 oe_per.7.b: "Use the old and the new together"
 oe_per.8.title: "The Court Moves to Isfahan"
 oe_per.8.desc: "The new capital is finished. Polo and night markets fill the great square, and the avenue of the four gardens runs down to the long bridge over the river. Isfahan, people say, is half the world."
 oe_per.8.a: "Hold a great festival"
 oe_per.8.b: "Keep it modest"
 oe_per.9.title: "The Silk Merchants Settle"
 oe_per.9.desc: "A community of Armenian silk merchants has arrived with their families across the river from the capital, asking for land to build on and leave to run their own churches. Their routes reach from here to distant seaports."
 oe_per.9.a: "Grant the land and a charter"
 oe_per.9.b: "Let them pay their dues like anyone else"
 oe_per.10.title: "The Philosophers of Isfahan"
 oe_per.10.desc: "A great thinker has arisen in the colleges of the capital. His teaching joins the proofs of reason to the insight of the heart, and his hearers crowd the courtyard."
 oe_per.10.a: "Make it the teaching of the realm"
 oe_per.10.b: "Leave the schools to themselves"
 oe_per.11.title: "The Battle for the Gulf"
 oe_per.11.desc: "Our expeditionary troops and coastal vessels are assembled for an assault to reclaim mastery over the key entrepot of the Persian Gulf. On the eve of sailing, foreign merchant captains offer heavily gunned ships to ensure a swift capture—in exchange for a guaranteed share of the port's customs revenue once the fortress falls."
 oe_per.11.a: "Join with them and take the port"
 oe_per.11.b: "Use our own ships alone"
 oe_per.12.title: "The Crown and the Title"
 oe_per.12.desc: "With the realm swollen in territory, wealth, and martial renown, scholars and noblemen gather in the audience hall to debate the sovereign title best suited to proclaim our rise. Should the dynasty claim the sweeping Eurasian heritage of the Ilkhans, or lift once more the ancient imperial crown of Eranshahr?"
 oe_per.12.a: "The Crown of Iran"
 oe_per.12.b: "Heir to the Ilkhans"
 oe_per.13.title: "The Old Mosque of Samarra"
 oe_per.13.desc: "Beneath the iconic spiral minaret of Samarra, the vast congregational mosque raised in an earlier golden age has fallen steadily into disrepair, its brickwork cracked by centuries of wind and sun. Local elders and scholars petition the throne for funds to restore this storied landmark to its former grandeur."
 oe_per.13.a: "Pay for the repairs"
 oe_per.13.b: "The treasury cannot spare it now"
 oe_per.14.title: "South of the Hindu Kush"
 oe_per.14.desc: "Kabul rests securely under our banners, commanding the vital passes through the Hindu Kush. Just beyond those rugged defiles stretch the rich, populous plains of Hindustan, where wealthy sultanates are riven by feuds and rivalries; eager commanders urge the throne to muster for a southern campaign rather than merely guard the mountains."
 oe_per.14.a: "Make ready to look south"
 oe_per.14.b: "It is enough to hold the passes"
 oe_per.90.title: "[Readout] Persia and Central Asia"
 oe_per.90.desc: "v11.5 Persia and Central Asia readout (1 = yes, 0 = no):\n· This country is a protagonist #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_protagonist')|0]#!, Slot 90 has run #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_pulses')|0]#! times\n· Flowering of letters #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_renaissance')|0]#! (0 to 100), army axis #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_axis')|0]#! (negative = Qizilbash banners, positive = standing corps)\n· Has a Qizilbash levy advance #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_levies')|0]#!, the pass system rules the Indian Ocean #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_per_v_cartaz')|0]#!"
 oe_per.90.a: "Close"
