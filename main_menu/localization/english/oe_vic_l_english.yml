# NEW 2026-11-23 v21.0 Batch 2 True Building-Type Viceroyalties (oe_vic_, gen_v210_building_viceroys.py) — english localization (225 keys). Edit gen_v210_building_viceroys.py, not this file.
 DLD:0 "Deccan Iqta Viceroyalty"
 DLD_ADJ:0 "Deccan Viceregal"
 oe_vic_name_qutlugh_khan:0 "Qutlugh Khan"
 oe_vic_seat_dld:0 "Daulatabad Deccan Viceregal Seat"
 oe_vic_seat_dld_desc:0 "Fortified viceregal headquarters of the Deccan Iqta at Daulatabad, sustaining standing southern garrisons and tax rosters while Delhi retains direct ownership of the territory."
 DLG:0 "Gujarat Iqta Viceroyalty"
 DLG_ADJ:0 "Gujarati Viceregal"
 oe_vic_name_muqbil_gujarat:0 "Malik Muqbil"
 oe_vic_seat_dlg:0 "Khambat Gujarat Viceregal Seat"
 oe_vic_seat_dlg_desc:0 "Coastal viceregal compound of the Gujarat Iqta at Khambat, managing Indian Ocean customs and garrison musters while Delhi retains full sovereignty over the province."
 DLM:0 "Malwa Iqta Viceroyalty"
 DLM_ADJ:0 "Malwa Viceregal"
 oe_vic_name_shihab_malwa:0 "Malik Shihab al-Din"
 oe_vic_seat_dlm:0 "Dhar Malwa Viceregal Seat"
 oe_vic_seat_dlm_desc:0 "Highland viceregal headquarters of the Malwa Iqta at Dhar, guarding the central corridor between Delhi, Gujarat, and the Deccan without detaching royal lands."
 DLJ:0 "Jaunpur-Awadh Iqta Viceroyalty"
 DLJ_ADJ:0 "Jaunpur Viceregal"
 oe_vic_name_ain_ul_mulk:0 "Ain al-Mulk Multani"
 oe_vic_seat_dlj:0 "Jaunpur Eastern Viceregal Seat"
 oe_vic_seat_dlj_desc:0 "Eastern viceregal diwan at Jaunpur-Zafarabad, overseeing Gangetic grain stores and eastern march garrisons while territory remains under direct Delhi control."
 DLP:0 "Punjab-Multan Frontier Iqta"
 DLP_ADJ:0 "Multan Frontier"
 oe_vic_name_imad_ul_mulk:0 "Imad al-Mulk Sartiz"
 oe_vic_seat_dlp:0 "Multan Frontier Viceregal Seat"
 oe_vic_seat_dlp_desc:0 "Fortified northwestern frontier headquarters at Multan, maintaining cavalry patrols along the Indus marches while Delhi retains direct ownership of Punjab."
 MMD:0 "Niyabat of Damascus"
 MMD_ADJ:0 "Damascene Niyabat"
 oe_vic_name_tankiz:0 "Tankiz al-Husami"
 oe_vic_seat_mmd:0 "Damascus Niyabat Ablaq Seat"
 oe_vic_seat_mmd_desc:0 "Chief Syrian vice-regal Ablaq palace and garrison seat at Damascus, coordinating Levant armies and barid relays under Cairo's unbroken territorial sovereignty."
 MMH:0 "Niyabat of Aleppo"
 MMH_ADJ:0 "Aleppine Niyabat"
 oe_vic_name_altunbugha_aleppo:0 "Altunbugha al-Nasiri"
 oe_vic_seat_mmh:0 "Aleppo Citadel Niyabat Seat"
 oe_vic_seat_mmh_desc:0 "Northern Syrian vice-regal command inside the Citadel of Aleppo, shielding the Mamluk marches facing Anatolia and the Euphrates without detaching Cairo's land."
 MMK:0 "Niyabat of Kerak"
 MMK_ADJ:0 "Kerak Niyabat"
 oe_vic_name_bahadir_karak:0 "Bahadir al-Badri"
 oe_vic_seat_mmk:0 "Kerak Fortress Niyabat Seat"
 oe_vic_seat_mmk_desc:0 "Desert-march vice-regal citadel at Al-Karak guarding the strategic junction between Egypt, Damascus, and the Hejaz pilgrimage road."
 HNT:0 "Voivodate of Transylvania"
 HNT_ADJ:0 "Transylvanian Voivodal"
 oe_vic_name_tamas_szecsenyi:0 "Tamás Szécsényi"
 oe_vic_seat_hnt:0 "Alba Iulia Voivodal Seat"
 oe_vic_seat_hnt_desc:0 "Royal Voivode's fortress chancery at Alba Iulia (Gyulafehérvár), marshaling Transylvanian defenses and frontier noble banners while all provinces remain Crown land."
 CST:0 "Order of Santiago & Calatrava"
 CST_ADJ:0 "Castilian Orders"
 oe_vic_name_juan_nunez_prado:0 "Juan Núñez de Prado"
 oe_vic_seat_cst:0 "Calatrava Military Orders Seat"
 oe_vic_seat_cst_desc:0 "Fortified chapter house of the Castilian Military Orders at Calatrava in La Mancha, fielding elite heavy knightly retinues while Castile retains direct provincial ownership."
 CSG:0 "Adelantamiento de la Frontera"
 CSG_ADJ:0 "Andalusian Frontier"
 oe_vic_name_gonzalo_martinez:0 "Gonzalo Martínez de Oviedo"
 oe_vic_seat_csg:0 "Cordoba Frontier Adelantado Seat"
 oe_vic_seat_csg_desc:0 "Frontier Adelantamiento commandery at Cordoba watching the Granadan border and marshaling Andalusian caballeros while preserving royal sovereignty over Andalusia."
 TIG:0 "Bahr Negash of Tigray"
 TIG_ADJ:0 "Tigrayan Bahr Negash"
 oe_vic_name_degna_mikael:0 "Degna Mikael"
 oe_vic_seat_tig:0 "Aksum Bahr Negash Seat"
 oe_vic_seat_tig_desc:0 "Northern maritime viceroyalty seated at sacred Aksum, guarding Tigrayan mountain gates and Red Sea trade corridors while Ethiopia retains unbroken territorial ownership."
 oe_vic_seat_maintain:0 "Viceregal Seat Administration"
 oe_vic_seat_maintain_desc:0 "Chancery parchment, seal clerks, and garrison ledgers keeping this provincial viceroyalty headquarters in continuous operation."
 oe_dlh_iqta:0 "Iqta Viceroyalty"
 oe_dlh_iqta_desc:0 "A building-based provincial Iqta Viceroyalty chartered by the Delhi Sultanate. The governor maintains a garrison compound at the provincial seat while 100% of territorial land remains under direct royal ownership; compliant viceroys field regional forces, whereas estranged emirs erode local authority."
 LEAD_oe_dlh_iqta:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_dlh_iqta:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_dlh_iqta_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_dlh_iqta_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_vic_dlh_iqta_reform:0 "Provincial Iqta Viceroyalty"
 oe_vic_dlh_iqta_reform_desc:0 "Building-based provincial viceregal charter of the Delhi Sultanate, sustaining a standing provincial garrison from its seat compound while leaving all land in royal hands."
 oe_mam_niyabat:0 "Syrian Niyabat"
 oe_mam_niyabat_desc:0 "A building-based Syrian Niyabat viceroyalty of the Mamluk Sultanate. The Naib commands standing Mamluk garrisons and provincial administration from his citadel seat while Cairo retains direct ownership of all Levant territories."
 LEAD_oe_mam_niyabat:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_mam_niyabat:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_mam_niyabat_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_mam_niyabat_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_vic_mam_niyabat_reform:0 "Mamluk Niyabat Vice-Royalty"
 oe_vic_mam_niyabat_reform_desc:0 "Vice-regal Syrian military administration chartered by Cairo, guaranteeing standing Mamluk garrison upkeep and cavalry readiness without detaching sovereign land."
 oe_mam_sharifate:0 "Sharifate of the Two Holy Cities"
 oe_mam_sharifate_desc:0 "Hashemite Sharifate protectorate of the Two Holy Sanctuaries under Mamluk guardianship. Exempt from casual annexation and carrying minimal diplomatic burden, it bestows immense prestige, religious standing, and diplomatic honor upon the Custodian Sultan in Cairo."
 LEAD_oe_mam_sharifate:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_mam_sharifate:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_hun_voivodate:0 "Royal Voivodate"
 oe_hun_voivodate_desc:0 "A building-based Royal Voivodate appointed by the Hungarian Crown to guard Transylvania and the Carpathian passes. All lands remain under direct royal ownership, yet dynastic crisis or loss of Buda can inflame regional separatism."
 LEAD_oe_hun_voivodate:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_hun_voivodate:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_hun_voivodate_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_hun_voivodate_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_vic_hun_voivodate_reform:0 "Carpathian Voivodate Charter"
 oe_vic_hun_voivodate_reform_desc:0 "Hungarian royal frontier charter sustaining Carpathian fortress defenses and standing voivodal garrisons while keeping all provinces under direct Crown ownership."
 oe_cas_adelantado:0 "Frontier Adelantamiento"
 oe_cas_adelantado_desc:0 "A building-based Castilian Military Order or Frontier Adelantamiento guarding the Reconquista marches. Without detaching Crown provinces, it maintains elite knightly garrisons from fortified seats at Calatrava and Cordoba, wielding decisive influence during dynastic civil wars."
 LEAD_oe_cas_adelantado:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_cas_adelantado:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_cas_adelantado_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_cas_adelantado_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_vic_cas_adelantado_reform:0 "Military Order & Adelantado Charter"
 oe_vic_cas_adelantado_reform_desc:0 "Castilian military-frontier charter supporting standing heavy cavalry and fortified commanderies from regional seats while preserving direct royal land tenure."
 oe_eth_bahr_negash:0 "Bahr Negash Viceroyalty"
 oe_eth_bahr_negash_desc:0 "A building-based Bahr Negash maritime frontier viceroyalty of Solomonic Ethiopia seated in Tigray. Aksum and the northern highlands remain directly owned by the Negusa Nagast while the Bahr Negash guards Red Sea caravan approaches and frontier passes."
 LEAD_oe_eth_bahr_negash:0 "$LIST$ is a [SUBJECT_TYPE.GetName]"
 AM_oe_eth_bahr_negash:0 "[SUBJECT_TYPE.GetName] of $LIST$."
 oe_eth_bahr_negash_call_tt:0 "Can be called into offensive wars when at the Compliant loyalty tier."
 oe_eth_bahr_negash_defend_tt:0 "Automatically joins defensive wars when at the Normal or Compliant loyalty tier."
 oe_vic_eth_bahr_negash_reform:0 "Tigray Bahr Negash Mandate"
 oe_vic_eth_bahr_negash_reform_desc:0 "Imperial Ethiopian northern frontier charter securing Red Sea commercial gateways and highland garrison logistics without detaching Solomonic provinces."
 STATIC_MODIFIER_NAME_oe_vic_seat_loyal_mod:0 "Compliant Viceregal Seat"
 STATIC_MODIFIER_DESC_oe_vic_seat_loyal_mod:0 "The viceroy works hand in hand with the sovereign throne, strengthening local control, defenses, production, and regional levies."
 STATIC_MODIFIER_NAME_oe_vic_seat_restive_mod:0 "Restive Viceregal Seat"
 STATIC_MODIFIER_DESC_oe_vic_seat_restive_mod:0 "The regional governor drags his feet on imperial decrees, reducing local control and levies while stoking unrest."
 STATIC_MODIFIER_NAME_oe_vic_seat_defiant_mod:0 "Defiant Viceregal Seat"
 STATIC_MODIFIER_DESC_oe_vic_seat_defiant_mod:0 "An estranged viceroy withholds taxes and courts local strongmen, severely undermining sovereign control and levies."
 STATIC_MODIFIER_NAME_oe_vic_subj_compliant_mod:0 "Viceroyalty: Compliant Service"
 STATIC_MODIFIER_DESC_oe_vic_subj_compliant_mod:0 "This viceroyalty faithfully executes sovereign orders, keeping its standing garrisons disciplined and ready to defend the realm."
 STATIC_MODIFIER_NAME_oe_vic_subj_restive_mod:0 "Viceroyalty: Restive Autonomy"
 STATIC_MODIFIER_DESC_oe_vic_subj_restive_mod:0 "This viceroyalty grows lukewarm toward the central court, slowing administrative coordination and straining loyalty."
 STATIC_MODIFIER_NAME_oe_vic_subj_defiant_mod:0 "Viceroyalty: Defiant Entrenchment"
 STATIC_MODIFIER_DESC_oe_vic_subj_defiant_mod:0 "Entrenched local ambitions estrange this viceroyalty from the crown, crippling loyal cooperation."
 STATIC_MODIFIER_NAME_oe_vic_audit_harmonized_mod:0 "Imperial Viceroyalty Audit"
 STATIC_MODIFIER_DESC_oe_vic_audit_harmonized_mod:0 "Royal auditors inspect provincial books while granting timely stipends, bolstering viceregal loyalty, tax yield, and central control."
 STATIC_MODIFIER_NAME_oe_vic_dlh_diwan_centralized_mod:0 "Centralized Delhi Imperial Diwan"
 STATIC_MODIFIER_DESC_oe_vic_dlh_diwan_centralized_mod:0 "By recalling the autonomous Iqta viceroyalties into the royal Diwan, the Sultan commands higher tax yield, cabinet discipline, and central control."
 STATIC_MODIFIER_NAME_oe_vic_mam_cairo_supremacy_mod:0 "Supremacy of the Cairo Citadel"
 STATIC_MODIFIER_DESC_oe_vic_mam_cairo_supremacy_mod:0 "Subordinating the Syrian Niyabats directly to the Cairo Citadel concentrates elite Mamluk heavy cavalry, legitimacy, and fortress defense under the Sultan."
 STATIC_MODIFIER_NAME_oe_vic_hun_crown_diet_mod:0 "Transylvanian Crown Diet Statute"
 STATIC_MODIFIER_DESC_oe_vic_hun_crown_diet_mod:0 "A solemn royal charter binds Transylvania's estates directly to the Hungarian Crown, extinguishing separatist plots while fortifying the Carpathian ramparts."
 STATIC_MODIFIER_NAME_oe_vic_cas_royal_maestrazgo_mod:0 "Royal Maestrazgo Incorporation"
 STATIC_MODIFIER_DESC_oe_vic_cas_royal_maestrazgo_mod:0 "Incorporating the Masterships of Santiago and Calatrava and the Andalusian frontier command under the Crown channels knightly prowess and estate wealth straight to Castile."
 STATIC_MODIFIER_NAME_oe_vic_eth_redsea_customs_mod:0 "Solomonic Red Sea Royal Customs"
 STATIC_MODIFIER_DESC_oe_vic_eth_redsea_customs_mod:0 "Bringing the Bahr Negash under direct Solomonic administration lets the Emperor harvest Red Sea maritime customs and project firm highland control."
 STATIC_MODIFIER_NAME_oe_vic_dlh_deccan_charter_mod:0 "Deccan Amiran-i-Sada Charter"
 STATIC_MODIFIER_DESC_oe_vic_dlh_deccan_charter_mod:0 "Targeted fiscal concessions appease the Deccan centurions and preserve loyal southern levies at a modest cost to central tax income."
 STATIC_MODIFIER_NAME_oe_vic_dlh_gujarat_customs_mod:0 "Khambat & Malwa Customs Reform"
 STATIC_MODIFIER_DESC_oe_vic_dlh_gujarat_customs_mod:0 "Audited customs ledgers across Khambat and Dhar unlock booming Indian Ocean trade revenues while reassuring coastal merchant guilds."
 STATIC_MODIFIER_NAME_oe_vic_dlh_multan_march_mod:0 "Multan Indus Frontier Bulwark"
 STATIC_MODIFIER_DESC_oe_vic_dlh_multan_march_mod:0 "Reinforced garrisons and swift frontier horsemen along the Indus and Gangetic marches shield the Delhi Sultanate from steppe raids."
 STATIC_MODIFIER_NAME_oe_vic_mam_tankiz_regency_mod:0 "Tankiz's Syrian Stewardship"
 STATIC_MODIFIER_DESC_oe_vic_mam_tankiz_regency_mod:0 "Confirming Tankiz's seasoned administration in Damascus secures prosperous Levantine caravan arteries and loyal emir fortresses."
 STATIC_MODIFIER_NAME_oe_vic_mam_burji_garrison_mod:0 "Burji Syrian Citadel Garrisons"
 STATIC_MODIFIER_DESC_oe_vic_mam_burji_garrison_mod:0 "Reorganized Circassian heavy cavalry and disciplined fortress garrisons across Damascus, Aleppo, and Kerak harden the Mamluk war machine."
 STATIC_MODIFIER_NAME_oe_vic_mam_mahmal_prestige_mod:0 "Custodian of the Golden Mahmal"
 STATIC_MODIFIER_DESC_oe_vic_mam_mahmal_prestige_mod:0 "Dispatching the ceremonial Mahmal caravan and Egyptian grain stipends to Mecca and Medina elevates the Mamluk Sultan as supreme protector of the Holy Sanctuaries."
 STATIC_MODIFIER_NAME_oe_vic_hun_voivode_charter_mod:0 "Charter of the Transylvanian Estates"
 STATIC_MODIFIER_DESC_oe_vic_hun_voivode_charter_mod:0 "Confirmed estate privileges unite Transylvanian nobles, Szekler borderers, and Saxon burghers into a resilient mountain defense."
 STATIC_MODIFIER_NAME_oe_vic_hun_szecsenyi_passes_mod:0 "Szecsenyi Carpathian Fortress Line"
 STATIC_MODIFIER_DESC_oe_vic_hun_szecsenyi_passes_mod:0 "Stone passes and swift frontier horsemen organized from Alba Iulia turn eastern Hungary into an impenetrable rampart."
 STATIC_MODIFIER_NAME_oe_vic_cas_order_knights_mod:0 "Banner of Santiago & Calatrava"
 STATIC_MODIFIER_DESC_oe_vic_cas_order_knights_mod:0 "Confirmed commandery charters rally the armored knights of Santiago and Calatrava fiercely behind the Castilian standard."
 STATIC_MODIFIER_NAME_oe_vic_cas_frontera_caballeros_mod:0 "Andalusian Frontera Caballeros"
 STATIC_MODIFIER_DESC_oe_vic_cas_frontera_caballeros_mod:0 "Seasoned frontier caballeros and border watchtowers marshaled from Cordoba hone Castilian army tradition and southern security."
 STATIC_MODIFIER_NAME_oe_vic_eth_bahr_trade_mod:0 "Aksum-Red Sea Caravan Compact"
 STATIC_MODIFIER_DESC_oe_vic_eth_bahr_trade_mod:0 "Protected Tigrayan caravans link Solomonic highlands to Red Sea ports, expanding maritime commerce and diplomatic reach."
 STATIC_MODIFIER_NAME_oe_vic_eth_tigray_synod_mod:0 "Northern Highland Synod Pact"
 STATIC_MODIFIER_DESC_oe_vic_eth_tigray_synod_mod:0 "A solemn highland synod unites Aksumite monasteries and Tigrayan warriors in resolute defense of the Solomonic faith and frontier."
 oe_vic_dec_audit_appease.title:0 "Imperial Viceroyalty Audit & Stipend"
 oe_vic_dec_audit_appease.desc:0 "Dispatch royal auditors and timely treasury stipends to our building-type provincial viceroyalties. Regular inspections curb local embezzlement while generous pay raises every active governor's loyalty by #G +15#! and restores compliant administration across our frontier seats."
 oe_vic_dec_audit_appease.a:0 "Dispatch the Royal Auditors and Stipends"
 oe_vic_dec_dlh_recall_iqtas.title:0 "Abolish Provincial Iqta Viceroyalties"
 oe_vic_dec_dlh_recall_iqtas.desc:0 "The semi-autonomous Iqta viceroyalties at Daulatabad, Khambat, Dhar, Jaunpur, and Multan have served their purpose during imperial expansion, yet they continually tempt ambitious emirs into sedition. Recall their governors to Delhi, abolish their seat compounds, and place all provinces under the direct Royal Diwan."
 oe_vic_dec_dlh_recall_iqtas.a:0 "Recall the Governors and Centralize the Diwan"
 oe_vic_dec_mam_recall_niyabats.title:0 "Centralize the Syrian Niyabats under Cairo"
 oe_vic_dec_mam_recall_niyabats.desc:0 "For decades the mighty Naibs of Damascus, Aleppo, and Kerak have ruled Greater Syria like rival sultans, turning every palace intrigue in Cairo into a Levant rebellion. Abolish the separate Niyabat compounds and place every Syrian fortress directly under the Cairo Citadel."
 oe_vic_dec_mam_recall_niyabats.a:0 "Subordinate Greater Syria to the Cairo Citadel"
 oe_vic_dec_hun_crown_diet.title:0 "Convene the Crown Diet of Transylvania"
 oe_vic_dec_hun_crown_diet.desc:0 "Summon the Hungarian nobles, Szekler borderers, and Saxon towns of Transylvania to a solemn Crown Diet under royal presidency. By folding the Voivodate seat at Alba Iulia directly into royal governance, we permanently extinguish the danger of Transylvanian or Slavonian secession during future dynastic crises."
 oe_vic_dec_hun_crown_diet.a:0 "Enact the Royal Crown Diet Statute"
 oe_vic_dec_cas_incorporate_orders.title:0 "Incorporate the Military Orders & Adelantamiento"
 oe_vic_dec_cas_incorporate_orders.desc:0 "Following the royal design of centralized Iberian monarchy, claim the Grand Masterships of Santiago and Calatrava for the Crown and fold the Andalusian Frontier Adelantamiento at Cordoba into direct royal administration. Knightly revenues and border cavalry will answer to the King of Castile alone."
 oe_vic_dec_cas_incorporate_orders.a:0 "Assume the Royal Maestrazgo and Frontier Command"
 oe_vic_dec_eth_centralize_bahr_negash.title:0 "Subordinate the Bahr Negash to the Solomonic Crown"
 oe_vic_dec_eth_centralize_bahr_negash.desc:0 "The office of the Bahr Negash at Aksum has long guarded Ethiopia's northern gateways to the Red Sea, yet ambitious northern lords frequently skim caravan tariffs and defy imperial summons. Abolish the separate Tigrayan viceregal seat and bring northern customs directly under the Negusa Nagast."
 oe_vic_dec_eth_centralize_bahr_negash.a:0 "Bring Aksum and Red Sea Customs Under Direct Rule"
 oe_vic.1.t:0 "Rebellion of the Amiran-i-Sada in Daulatabad"
 oe_vic.1.d:0 "From the soaring granite citadel of Daulatabad come grim dispatches: the foreign military commanders known as the Amiran-i-Sada have rallied behind restless Deccan officers, protesting Delhi's heavy tax assessments and sudden recalls of trusted governors. Unless the Sultan handles the Deccan Iqta Viceroyalty with decisive statecraft, the whole south threatens to slip beyond imperial obedience."
 oe_vic.1.a:0 "Grant the Deccan commanders a fiscal charter to restore loyalty"
 oe_vic.1.b:0 "Dispatch royal cavalry to awe Daulatabad into submission"
 oe_vic.1.c:0 "Abolish the Daulatabad viceregal seat and assert direct rule"
 oe_vic.2.t:0 "Audit of the Khambat Ports and Malwa Road"
 oe_vic.2.d:0 "Treasury clerks returning from the Arabian Sea emporium of Khambat and the highland fort of Dhar report staggering discrepancies between booming textile commerce and the modest silver reaching Delhi. Both the Gujarat and Malwa Iqta viceroys insist the revenues are absorbed by coastal patrols and highway escorts, leaving the Sultan to choose between rigorous imperial audits or conciliatory local autonomy."
 oe_vic.2.a:0 "Enforce strict customs audits across Khambat and Dhar"
 oe_vic.2.b:0 "Leave local surpluses to the Gujarat and Malwa viceroys"
 oe_vic.3.t:0 "Watch on the Indus and the Eastern Gangetic March"
 oe_vic.3.d:0 "Scouts riding hard from Multan warn of steppe raiders testing the Indus crossings, while dispatches from Jaunpur confirm abundant Gangetic harvests ready to supply imperial armies. Empowering our Punjab-Multan Frontier Iqta and coordinating grain convoys through Jaunpur-Awadh could forge an unbroken military shield across northern India."
 oe_vic.3.a:0 "Fund the Multan frontier garrisons and Jaunpur granaries"
 oe_vic.3.b:0 "Requisition frontier surpluses directly for Delhi's treasury"
 oe_vic.4.t:0 "1340: The Might of Tankiz al-Husami, Viceroy of Damascus"
 oe_vic.4.d:0 "For nearly three decades Sayf al-Din Tankiz al-Husami has governed Damascus with unmatched magnificence—building mosques, canals, and palaces while commanding the devotion of Syrian emirs. Courtiers in the Cairo Citadel now whisper that Tankiz has grown too formidable to remain a mere deputy, warning that Damascus answers to him before it answers to the Sultan."
 oe_vic.4.a:0 "Arrest Tankiz, seize his treasure, and install a loyal Naib"
 oe_vic.4.b:0 "Confirm Tankiz's stewardship and honor his Syrian service"
 oe_vic.4.c:0 "Dissolve the Damascus Niyabat and rule Syria from Cairo"
 oe_vic.5.t:0 "1382: The Burji Upheaval and the Syrian Citadels"
 oe_vic.5.d:0 "As Circassian Burji emirs ascend to supreme power in Cairo, shockwaves ripple northward through Damascus, Aleppo, and the cliffside fortress of Kerak. Veteran Bahri-era governors question the new Sultan's legitimacy and muster their Mamluk households behind stone walls, forcing Cairo to decide whether to buy Syrian loyalty, crush dissent by arms, or rally loyalists around Kerak."
 oe_vic.5.a:0 "Distribute robes of honor and gold to reconcile all Syrian Naibs"
 oe_vic.5.b:0 "March north with royal Mamluks to compel unconditional obedience"
 oe_vic.5.c:0 "Anchor royalist power on the strategic citadel of Kerak"
 oe_vic.6.t:0 "The Golden Mahmal and the Two Holy Sanctuaries"
 oe_vic.6.d:0 "With the Sharifates of Mecca and Medina resting securely under Cairo's protection, the annual departure of the ceremonial Mahmal palanquin and Egyptian grain ships has become the supreme emblem of Mamluk prestige across the Islamic world. Envoys from the Hejaz await the Sultan's decree on this year's pious endowments and caravan guards."
 oe_vic.6.a:0 "Dispatch the Golden Mahmal with generous Egyptian grain stipends"
 oe_vic.6.b:0 "Trim the pilgrimage grants and retain the customs revenue in Cairo"
 oe_vic.7.t:0 "Crisis of the Transylvanian Voivodate and Crown Succession"
 oe_vic.7.d:0 "Dynastic strain in Buda has emboldened the magnates of Transylvania and the southern marches. Inside the Voivodate chancery at Alba Iulia, Hungarian lords, Szekler captains, and Saxon burghers debate whether the Crown can still defend the Carpathian realm—or whether Transylvania and Slavonia must raise their own territorial banners to survive."
 oe_vic.7.a:0 "Confirm regional estate charters and appease the Voivode"
 oe_vic.7.b:0 "Reject magnate demands and assert unconditional royal supremacy"
 oe_vic.7.c:0 "Grant territorial autonomy—awaken Transylvania and Slavonia"
 oe_vic.8.t:0 "Tamás Szécsényi and the Ramparts of Alba Iulia"
 oe_vic.8.d:0 "Voivode Tamás Szécsényi reports from Alba Iulia that the mountain passes guarding eastern Hungary require reinforced stone keeps, beacon towers, and swift light cavalry patrols. Investing alongside our Transylvanian Voivodate now will turn the Carpathian arc into an enduring bastion for the Hungarian Crown."
 oe_vic.8.a:0 "Finance Szécsényi's Carpathian fortresses and garrison patrols"
 oe_vic.8.b:0 "Divert Transylvanian mining revenues directly to Buda"
 oe_vic.9.t:0 "The Trastámara Storm and the Castilian Military Orders"
 oe_vic.9.d:0 "Civil strife and factional rivalries tear at the Castilian nobility, turning the fortified commanderies of Calatrava and the Andalusian Frontier into decisive kingmakers. The Masters of Santiago and Calatrava offer their armored lances to whichever claimant guarantees their ancient privileges, while royal counselors urge seizing their wealthy estates outright."
 oe_vic.9.a:0 "Confirm the Orders' privileges and rally their heavy knights"
 oe_vic.9.b:0 "Confiscate commandery treasuries to assert royal authority"
 oe_vic.9.c:0 "Empower the Andalusian Frontier Adelantado at Cordoba"
 oe_vic.10.t:0 "Watchtowers of the Andalusian Frontera"
 oe_vic.10.d:0 "From the Guadalquivir stronghold of Cordoba, our Adelantado de la Frontera reports constant border skirmishes, cattle raids, and reconnaissance along the Granadan hills. Chartering frontier town caballeros and funding Cordoba's garrison will sharpen Castile's martial edge, though royal treasurers remind the court that frontier truces and parias gold remain equally lucrative."
 oe_vic.10.a:0 "Fund the Cordoba Adelantamiento and frontier caballeros"
 oe_vic.10.b:0 "Prioritize parias tribute and border customs over frontier raids"
 oe_vic.11.t:0 "The Bahr Negash and the Red Sea Caravan Corridor"
 oe_vic.11.d:0 "From ancient Aksum, the Bahr Negash—Lord of the Sea—sends word that highland ivory, gold dust, and rock salt are flowing briskly toward Red Sea anchorages despite lowland banditry. Partnering with our Tigrayan viceroyalty to escort merchant trains and cultivate maritime contacts will enrich the Solomonic Empire across the Horn of Africa."
 oe_vic.11.a:0 "Sponsor the Bahr Negash caravan guard and maritime accords"
 oe_vic.11.b:0 "Levy immediate crown tolls on every northern caravan"
 oe_vic.12.t:0 "Northern Highland Synod of Aksum and Tigray"
 oe_vic.12.d:0 "Abbots of the ancient Tigrayan cliff monasteries have assembled at Aksum alongside the captains of the Bahr Negash to swear a sacred covenant defending the Solomonic faith and northern mountain passes. Granting their frontier pact imperial blessing will cement highland morale and loyalty for a generation, whereas strict central decrees risk alienating proud northern lords."
 oe_vic.12.a:0 "Bless the Aksum Highland Synod and honor the Bahr Negash"
 oe_vic.12.b:0 "Enforce direct Solomonic court supremacy over northern abbots"
