 oe_imperial_hetaireia_estate: "Imperial Hetaireia"
 oe_imperial_hetaireia_estate_desc: "Whatever their birthplace, these soldiers swear before the holy icons and serve beneath the same imperial standard. The Hetaireia enrolls Orthodox soldiers of every culture in Byzantium’s directly ruled lands, binding them through pay, service and shared faith.\n\nMembership: directly owned Orthodox soldier pops of any culture. Base satisfaction equilibrium: #Y 30%#!. Base maximum tax: #Y 30%#!. Political power per pop: #Y 5#!. Tax base coefficient: #Y 0.5#!. Country and estate modifiers still affect the final values.\nMilitary modifiers are neutral at 50% satisfaction. Each 25 percentage points above or below it adds or subtracts 1% discipline and 2.5% army morale.\nAbove 25% estate power, each additional 10 percentage points provides 0.02 monthly army tradition and reduces Crown Power by 2%."
 oe_imperial_hetaireia_service: "Hetaireia Military Rolls"
 STATIC_MODIFIER_NAME_oe_imperial_hetaireia_service: "Hetaireia Military Rolls"
 STATIC_MODIFIER_DESC_oe_imperial_hetaireia_service: "Shared faith and an oath of service bind the Empire’s soldiers of diverse origins."
