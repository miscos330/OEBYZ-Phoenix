 STATIC_MODIFIER_NAME_oe_react_mod_refugee_resettlement:0 "Organized Refugee Resettlement"
 STATIC_MODIFIER_DESC_oe_react_mod_refugee_resettlement:0 "Emergency shelters, grain doles, and guild charters absorb displaced townsfolk and artisans into the heartland."
 STATIC_MODIFIER_NAME_oe_react_mod_wartime_levies:0 "Emergency Siege Conscription"
 STATIC_MODIFIER_DESC_oe_react_mod_wartime_levies:0 "Able-bodied refugees and provincial militias are pressed straight into the defense of remaining fortresses."
 STATIC_MODIFIER_NAME_oe_react_mod_saved_archives:0 "Rescued Imperial Archives"
 STATIC_MODIFIER_DESC_oe_react_mod_saved_archives:0 "Evacuated libraries, legal codices, and gilded manuscripts preserve institutional continuity and scholarly prestige."
 STATIC_MODIFIER_NAME_oe_react_mod_emergency_mint:0 "Wartime Bullion Recoinage"
 STATIC_MODIFIER_DESC_oe_react_mod_emergency_mint:0 "Melted plate and seized bullion fund immediate military arrears at the cost of royal ceremony."
 STATIC_MODIFIER_NAME_oe_react_mod_cultural_resolve:0 "Heritage Ransom & Patronage"
 STATIC_MODIFIER_DESC_oe_react_mod_cultural_resolve:0 "Ransoming looted masterpieces rallies artists, clergy, and burghers around the dignity of the realm."
 STATIC_MODIFIER_NAME_oe_react_mod_avenging_banners:0 "Banners of Retribution"
 STATIC_MODIFIER_DESC_oe_react_mod_avenging_banners:0 "Tales of plundered sanctuaries steel soldiers and commanders to reclaim every stolen banner on the field."
 STATIC_MODIFIER_NAME_oe_react_mod_estate_accord:0 "Wartime Estate Conciliation"
 STATIC_MODIFIER_DESC_oe_react_mod_estate_accord:0 "Conceding tax audits and consultative rights steadies domestic assemblies after a shattering field defeat."
 STATIC_MODIFIER_NAME_oe_react_mod_martial_prerogative:0 "Emergency Martial Prerogative"
 STATIC_MODIFIER_DESC_oe_react_mod_martial_prerogative:0 "Overriding factional recriminations concentrates command authority in the crown and war council."
 STATIC_MODIFIER_NAME_oe_react_mod_battle_lessons:0 "Post-Defeat Tactical Reform"
 STATIC_MODIFIER_DESC_oe_react_mod_battle_lessons:0 "Surviving veterans rewrite drill manuals and modernize formations after absorbing hard battlefield lessons."
 STATIC_MODIFIER_NAME_oe_react_mod_realm_rallied:0 "Realm Rallied in Adversity"
 STATIC_MODIFIER_DESC_oe_react_mod_realm_rallied:0 "Provincial supply trains, fresh militia drafts, and steadfast fortresses halt the enemy's momentum."
 STATIC_MODIFIER_NAME_oe_react_mod_frontier_alert:0 "Frontier Beacons Lit"
 STATIC_MODIFIER_DESC_oe_react_mod_frontier_alert:0 "Early intelligence allows border fortresses to stock provisions and muster garrisons before enemy vanguards cross the line."
 STATIC_MODIFIER_NAME_oe_react_mod_wartime_envoys:0 "Emergency Diplomatic Circulars"
 STATIC_MODIFIER_DESC_oe_react_mod_wartime_envoys:0 "Envoys carry documented grievances to neutral courts, strengthening diplomatic standing as war breaks out."
 STATIC_MODIFIER_NAME_oe_react_mod_loyal_marches:0 "Paid Frontier Marches"
 STATIC_MODIFIER_DESC_oe_react_mod_loyal_marches:0 "Prompt gold stipends keep outer border commanders loyal while loyalist armies confront internal rebels."
 STATIC_MODIFIER_NAME_oe_react_mod_amnesty_decree:0 "Royal Decree of Amnesty"
 STATIC_MODIFIER_DESC_oe_react_mod_amnesty_decree:0 "Promising clemency to wavering towns shortens civil strife and hastens postwar reconciliation."
 STATIC_MODIFIER_NAME_oe_react_mod_road_corridor_boom:0 "Imperial Highway Relay Boom"
 STATIC_MODIFIER_DESC_oe_react_mod_road_corridor_boom:0 "Paved corridors, post relays, and roadside caravanserais accelerate travel, commerce, and provincial integration."
 STATIC_MODIFIER_NAME_oe_react_mod_highway_customs:0 "Standardized Road Customs"
 STATIC_MODIFIER_DESC_oe_react_mod_highway_customs:0 "Uniform bridge tolls and road customs barriers turn growing internal traffic into steady fiscal returns."
 STATIC_MODIFIER_NAME_oe_react_mod_cultural_golden_age:0 "Royal Guild of Master Artisans"
 STATIC_MODIFIER_DESC_oe_react_mod_cultural_golden_age:0 "Acclaimed paintings, treatises, and monuments draw masters from across the continent to our workshops."
 STATIC_MODIFIER_NAME_oe_react_mod_court_splendor:0 "Diplomatic Court Splendor"
 STATIC_MODIFIER_DESC_oe_react_mod_court_splendor:0 "Showcasing newly completed masterpieces elevates the crown's standing in foreign embassies and domestic courts alike."
 STATIC_MODIFIER_NAME_oe_react_mod_creditor_charter:0 "Syndicate Customs Charter"
 STATIC_MODIFIER_DESC_oe_react_mod_creditor_charter:0 "Merchant bankers refinance urgent sovereign debts in exchange for lucrative harbor and toll privileges."
 STATIC_MODIFIER_NAME_oe_react_mod_fiscal_austerity:0 "Court Austerity & Treasury Audit"
 STATIC_MODIFIER_DESC_oe_react_mod_fiscal_austerity:0 "Trimming court sinecures and auditing tax farmers curbs inflation and gradually restores creditworthiness."
 STATIC_MODIFIER_NAME_oe_react_mod_intellectual_wave:0 "Sponsored Academies & Treatises"
 STATIC_MODIFIER_DESC_oe_react_mod_intellectual_wave:0 "Printing presses, observatories, and endowed chairs broadcast new methods across universities and ministries."
 STATIC_MODIFIER_NAME_oe_react_mod_applied_innovation:0 "Applied Workshop Innovation"
 STATIC_MODIFIER_DESC_oe_react_mod_applied_innovation:0 "Guilds adapt newly embraced institutions into refined looms, foundries, and commercial accounting ledgers."
 STATIC_MODIFIER_NAME_oe_react_mod_new_age_statecraft:0 "New Era Doctrine of Statecraft"
 STATIC_MODIFIER_DESC_oe_react_mod_new_age_statecraft:0 "A solemn imperial proclamation renews administrative discipline and diplomatic ambition for the coming century."
 STATIC_MODIFIER_NAME_oe_react_mod_new_age_prosperity:0 "New Era Charter of Learning & Trade"
 STATIC_MODIFIER_DESC_oe_react_mod_new_age_prosperity:0 "Celebrating the turning of the age with open fairs and academies accelerates long-term growth across the realm."
 STATIC_MODIFIER_NAME_oe_react_mod_dynastic_prestige:0 "Splendid Dynastic Alliance"
 STATIC_MODIFIER_DESC_oe_react_mod_dynastic_prestige:0 "Cross-border royal nuptials weave noble lineages together and strengthen diplomatic trust across rival courts."
 STATIC_MODIFIER_NAME_oe_react_mod_dowry_endowment:0 "Royal Marriage Dowry Endowment"
 STATIC_MODIFIER_DESC_oe_react_mod_dowry_endowment:0 "Investing marriage settlements into crown estates and commercial bills yields steady peacetime prosperity."
 STATIC_MODIFIER_NAME_oe_react_mod_parliament_momentum:0 "Legislative Reform Momentum"
 STATIC_MODIFIER_DESC_oe_react_mod_parliament_momentum:0 "A decisive legislative victory aligns crown ministers and estate deputies behind coherent reform."
 STATIC_MODIFIER_NAME_oe_react_mod_civic_mandate:0 "Parliamentary Public Works Mandate"
 STATIC_MODIFIER_DESC_oe_react_mod_civic_mandate:0 "Approved parliamentary grants speed up roads, granaries, and municipal improvements across represented shires."
 STATIC_MODIFIER_NAME_oe_react_mod_parl_deadlock:0 "Parliamentary Deadlock"
 STATIC_MODIFIER_DESC_oe_react_mod_parl_deadlock:0 "Bitter procedural wrangling slows crown initiatives until rival factions are brought back to the table."
 STATIC_MODIFIER_NAME_oe_react_mod_coastal_patrol:0 "Anti-Piracy Coastal Patrols"
 STATIC_MODIFIER_DESC_oe_react_mod_coastal_patrol:0 "Armed patrol squadrons sweep reefs, coves, and narrows, hunting down Wokou and Barbary corsairs."
 STATIC_MODIFIER_NAME_oe_react_mod_counter_privateers:0 "Counter-Privateering Letters of Marque"
 STATIC_MODIFIER_DESC_oe_react_mod_counter_privateers:0 "Licensed sea captains raid hostile pirate lairs and rival shipping lanes under crown commission."
 STATIC_MODIFIER_NAME_oe_react_mod_port_fortifications:0 "Coastal Beacon & Harbor Defenses"
 STATIC_MODIFIER_DESC_oe_react_mod_port_fortifications:0 "Chain booms, coastal watchtowers, and harbor batteries shield merchant warehouses from sudden amphibious raids."
 STATIC_MODIFIER_NAME_oe_react_mod_sea_lanes_secured:0 "Secured Maritime Trade Lanes"
 STATIC_MODIFIER_DESC_oe_react_mod_sea_lanes_secured:0 "Shattered pirate nests restore merchant confidence, boosting customs revenue and naval mastery."
 STATIC_MODIFIER_NAME_oe_react_mod_prize_court:0 "Admiralty Prize Court Receipts"
 STATIC_MODIFIER_DESC_oe_react_mod_prize_court:0 "Captured corsair hulls and contraband cargoes enrich the admiralty and expand the merchant marine."
 STATIC_MODIFIER_NAME_oe_react_mod_free_company_contract:0 "Retained Frontier Free Company"
 STATIC_MODIFIER_DESC_oe_react_mod_free_company_contract:0 "Hardened Cossack riders and veteran free-company pikemen bolster the crown's field armies on flexible contracts."
 STATIC_MODIFIER_NAME_oe_react_mod_frontier_settlement:0 "Frontier Garrison Land Grants"
 STATIC_MODIFIER_DESC_oe_react_mod_frontier_settlement:0 "Settling roaming riders on border homesteads creates self-sustaining frontier cavalry screens."
 STATIC_MODIFIER_NAME_oe_react_mod_disciplined_levies:0 "Sovereign Levy Discipline"
 STATIC_MODIFIER_DESC_oe_react_mod_disciplined_levies:0 "Rejecting unruly mercenaries strengthens regular provincial levies and spares border villages from extortion."
 STATIC_MODIFIER_NAME_oe_react_mod_chartered_company:0 "Chartered Grand Free Company"
 STATIC_MODIFIER_DESC_oe_react_mod_chartered_company:0 "Formal royal letters-patent turn a famed mercenary host into a reliable, lower-cost strategic reserve."
 STATIC_MODIFIER_NAME_oe_react_mod_veteran_cadre:0 "Integrated Free-Company Officers"
 STATIC_MODIFIER_DESC_oe_react_mod_veteran_cadre:0 "Hiring seasoned mercenary captains as royal drillmasters sharpens cavalry screening and infantry discipline."
 oe_react_frontier_free_company:0 "Frontier Free Company"
 oe_react_dec_anti_piracy_patrol.title:0 "Commission Anti-Piracy Patrol Expedition"
 oe_react_dec_anti_piracy_patrol.desc:0 "Dispatch armed coastal patrol squadrons across neighboring sea lanes to weaken hostile privateers, protect merchant harbors, and launch a decisive anti-piracy sweep. Costs 100 gold (10-year cooldown)."
 oe_react_dec_anti_piracy_patrol.a:0 "Launch the Naval Patrol Sweep"
 oe_react_dec_anti_piracy_patrol_tt:0 "Hostile privateers operating in sea zones bordering our ports lose privateer power while our naval patrols take station."
 oe_react_dec_charter_free_company.title:0 "Charter a Frontier Free Company"
 oe_react_dec_charter_free_company.desc:0 "Contract veteran steppe horsemen and seasoned pike-and-shot free-company bands at our capital for five years of field service under royal banner. Costs 100 gold plus reduced hiring fee (10-year cooldown)."
 oe_react_dec_charter_free_company.a:0 "Seal the Free Company Contract"
 oe_react_dec_charter_free_company_tt:0 "Musters and hires a five-year Frontier Free Company of heavy infantry and light cavalry at our capital."
 oe_react.1.title:0 "Refugees from a Fallen Fortress"
 oe_react.1.desc:0 "Smoke still curls over the breached walls of our lost stronghold. Long columns of displaced burghers, weavers, and provincial families are streaming down the roads toward our capital, clutching whatever tools and heirlooms they could carry before the enemy entered the gates."
 oe_react.1.a:0 "Open the Capital Gates and Organize Resettlement"
 oe_react.1.b:0 "Conscript Every Able Hand Into the Defense"
 oe_react.2.title:0 "Evacuation of the Imperial Archives & Reliquaries"
 oe_react.2.desc:0 "As enemy siege batteries broke through the outer curtain of a great city, scholars, archivists, and priests hurried across the bridges under cover of dusk. Their carts hold gilded codices, tax cadasters, sacred icons, and boxes of treasury plate—yet escorting them safely demands funds we can ill spare."
 oe_react.2.a:0 "Escort the Scholars and Gilded Manuscripts to Safety"
 oe_react.2.b:0 "Melt the Evacuated Plate for Emergency War Coinage"
 oe_react.3.title:0 "Plundered Masterwork & Scholarly Ransom"
 oe_react.3.desc:0 "Word has reached court that an irreplaceable masterpiece from our realm has been carried off as war booty. Neutral merchants whisper that discreet ransom envoys might still recover the pride of our workshops, while army commanders insist only steel should answer sacrilege."
 oe_react.3.a:0 "Dispatch Envoys to Ransom Our Cultural Heritage"
 oe_react.3.b:0 "Vow Retribution Beneath Avenging Banners"
 oe_react.4.title:0 "Shock of Defeat in the Estates & Assembly"
 oe_react.4.desc:0 "Couriers bearing black-sealed dispatches have shaken the capital to its foundations. Following our grievous setback in the field, noble deputies and municipal magnates are demanding an immediate accounting of war finances, command appointments, and provincial levies."
 oe_react.4.a:0 "Grant Emergency Concessions to Steady the Estates"
 oe_react.4.b:0 "Invoke Martial Prerogative Over the Assembly"
 oe_react.5.title:0 "Rally the Shattered Realm"
 oe_react.5.desc:0 "Though the day was lost and thousands of banners fell in the mud, the core of our realm still stands unbroken. Veteran captains are already assembling survivors along the river crossings, debating whether to overhaul tactical drill or summon fresh provincial levies to hold the line."
 oe_react.5.a:0 "Overhaul Drill and Reform the Officer Corps"
 oe_react.5.b:0 "Call Up Provincial Militias and Supply Trains"
 oe_react.6.title:0 "Ultimatum at the Border & War Mobilization"
 oe_react.6.desc:0 "Encrypted riders from our border stations warn that hostile vanguard columns are massing just beyond the frontier markers. Formal war declarations are only hours away—giving our chancellery one brief window to light the beacons or seize the diplomatic high ground."
 oe_react.6.a:0 "Light the Beacons and Provision the Border Passes"
 oe_react.6.b:0 "Send Urgent Circulars to Foreign Courts"
 oe_react.7.title:0 "Frontier Opportunists in the Shadow of Civil War"
 oe_react.7.desc:0 "The outbreak of civil war has emboldened restless border magnates and opportunistic raiders along our outer marches. Unless the crown swiftly reassures loyal garrisons or extends a calculated amnesty, internal strife could unravel the frontier itself."
 oe_react.7.a:0 "Dispatch Emergency Stipends to Border Garrisons"
 oe_react.7.b:0 "Proclaim an Imperial Amnesty for Returning Towns"
 oe_react.8.title:0 "Grand Road Corridor & Urban Network Boom"
 oe_react.8.desc:0 "Years of relentless highway engineering and urban construction have reached a visible tipping point. Pack trains, couriers, and merchant wagons now traverse our newly connected corridors in half the former time, breathing fresh prosperity into capital and provinces alike."
 oe_react.8.a:0 "Charter Relay Stations and Caravan Inns"
 oe_react.8.b:0 "Standardize Highway Tolls and Customs Posts"
 oe_react.9.title:0 "Masterwork Unveiled: A Cultural Golden Age"
 oe_react.9.desc:0 "Nobles, scholars, and foreign envoys crowd the courtyard to behold a newly completed masterwork forged within our borders. Its fame is already traveling along trade routes, signaling to rivals and allies alike that our realm stands at the zenith of refinement."
 oe_react.9.a:0 "Endow a Royal Guild of Master Artisans"
 oe_react.9.b:0 "Display the Masterwork at Diplomatic Receptions"
 oe_react.10.title:0 "Sovereign Debt Spiral & Creditor Demands"
 oe_react.10.desc:0 "With multiple sovereign loans now stacked on the treasury ledgers, consortium bankers have requested a private audience. They offer lower interest and fresh liquidity—but only in exchange for customs privileges unless the crown enforces painful austerity."
 oe_react.10.a:0 "Grant the Banking Syndicates a Customs Charter"
 oe_react.10.b:0 "Enforce Court Austerity and Audit the Treasury"
 oe_react.11.title:0 "Intellectual Wave of the New Institution"
 oe_react.11.desc:0 "Embracing a transformative institution has ignited lively debate across academies, guildhalls, and provincial chancelleries. Translators, engineers, and merchants clamor for royal patronage to turn abstract breakthroughs into lasting national power."
 oe_react.11.a:0 "Sponsor Academies and Translated Treatises"
 oe_react.11.b:0 "Channel New Methods Into Guilds and Commerce"
 oe_react.12.title:0 "Proclamation of a New Age"
 oe_react.12.desc:0 "Chroniclers mark the passing of an old order as new maps, weapons, and ideas reshape the horizons of Eurasia and beyond. At court, ministers await a solemn proclamation defining the guiding spirit of our realm in the age now dawning."
 oe_react.12.a:0 "Proclaim an Era of Statecraft and Discipline"
 oe_react.12.b:0 "Dedicate the Coming Age to Learning and Trade"
 oe_react.13.title:0 "Royal Dowry & Dynastic Splendor"
 oe_react.13.desc:0 "The celebration of a high royal marriage has filled the capital with foreign heralds, gilded carriages, and chest upon chest of negotiated dowry settlements. Court treasurers and diplomats eagerly propose how best to turn this dynastic triumph to advantage."
 oe_react.13.a:0 "Use the Occasion to Elevate Court Diplomacy"
 oe_react.13.b:0 "Deposit the Dowry Endowment Into the Treasury"
 oe_react.14.title:0 "Momentum of Parliamentary Reform"
 oe_react.14.desc:0 "With the latest parliamentary bill carried by a decisive margin, applause echoes across the assembly benches. Reform-minded deputies urge the crown to seize this rare harmony between throne and estates to codify institutional stability or fund public works."
 oe_react.14.a:0 "Codify the Legislative Mandate and Crown Harmony"
 oe_react.14.b:0 "Direct Parliamentary Backing Into Public Works"
 oe_react.15.title:0 "Sea Raiders Along the Maritime Frontier"
 oe_react.15.desc:0 "Low-slung corsair vessels and brazen Wokou and Barbary sea raiders have been sighted slipping out of coastal fog to prey upon merchant junks, fishing fleets, and unprotected salt ports. Admiralty captains stand ready to sweep the narrows, issue counter-privateering charters, or fortify the shore."
 oe_react.15.a:0 "Outfit an Anti-Piracy Patrol Squadron"
 oe_react.15.b:0 "Issue Counter-Privateering Letters of Marque"
 oe_react.15.c:0 "Fortify Coastal Harbors and Beacon Towers"
 oe_react.16.title:0 "Anti-Piracy Expedition Sweeps the Sea Lanes"
 oe_react.16.desc:0 "Through cannon smoke and churning swells, our coastal patrol squadrons caught the raider flotillas off guard near their hidden coves. Burning corsair hulls litter the shoals, and grateful port guilds celebrate the reopening of safe maritime lanes."
 oe_react.16.a:0 "Establish Permanent Naval Escort Lanes"
 oe_react.16.b:0 "Auction Captured Raider Hulls and Prizes"
 oe_react.17.title:0 "Steppe & Frontier Free Companies Seek a Patron"
 oe_react.17.desc:0 "Hardened Cossack riders, demobilized veterans, and roaming frontier free companies have encamped outside our border forts. Their captains offer five years of fierce mercenary service under our banner—or permanent settlement on frontier lands—if our crown meets their terms."
 oe_react.17.a:0 "Sign the Contract and Muster the Free Company"
 oe_react.17.b:0 "Grant Them Frontier Land and Garrison Rights"
 oe_react.17.c:0 "Turn Them Away and Rely on Loyal Levies"
 oe_react.18.title:0 "Charter of the Grand Free Company"
 oe_react.18.desc:0 "Having proven their mettle on arduous frontier marches, the captains of our contracted Free Company request formal letters-patent. Confirming their chartered banner lowers future mercenary retainers, while recruiting their senior officers into our standing army would elevate native tactical discipline."
 oe_react.18.a:0 "Confirm Their Permanent Frontier Retainer Charter"
 oe_react.18.b:0 "Commission Their Veteran Captains Into the Standing Army"
