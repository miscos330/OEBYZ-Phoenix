 STATIC_MODIFIER_NAME_oe_ymar_indian_ocean_ties: "Zaytun Indian Ocean Network"
 STATIC_MODIFIER_DESC_oe_ymar_indian_ocean_ties: "Co-opted Zaytun merchants keep Indian Ocean lanes open for Dadu, boosting sea trade while loosening direct central control."
