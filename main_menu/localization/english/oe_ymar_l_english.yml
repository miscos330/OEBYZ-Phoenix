 oe_ymar.1.t: "Early Wokou Coastal Raids"
 oe_ymar.1.desc_x: "#F From 1350 onward, civil war in Japan loosened restraint on Kyushu sea-lords and freebooters, whose raiding fleets struck Goryeo and began probing the Yuan coast around Ningbo and Fuzhou, threatening grain convoys and ports alike.#!\n\nReports from Ningbo and Fuzhou warn of raiders off the coast, while Goryeo envoys plead for aid. Should the court fund coastal patrol stations and coordinate with Goryeo, or leave defense to local provinces?"
 oe_ymar.1.a: "Fund Coastal Patrols at Ningbo and Fuzhou"
 oe_ymar.1.a.tt: "Gain [ShowModifier('oe_ymar_coastal_patrol')] (#Y 60#! months: lower piracy at higher light-ship upkeep); Goryeo opinion #G +15#!."
 oe_ymar.1.b: "Leave Coastal Defense to Local Provinces and Goryeo"
 oe_ymar.1.b.tt: "Ningbo and Fuzhou suffer [ShowModifier('oe_ymar_wokou_raids')] (#Y 60#! months); Goryeo opinion #R −10#!; if sea transport runs, capital grain #R −15#!."
 oe_ymar.2.t: "The Quanzhou Ispah Rebellion"
 oe_ymar.2.desc_x: "#F In March 1357, commanders Saif al-Din and Amid al-Din led the Persian-Arab Ispah garrison of Quanzhou (Zaytun) in open revolt, seizing Jinjiang and pushing toward Fuzhou and Zhangzhou.#!\n\nZaytun's customs and garrison are now in Ispah hands while urgent memorials pour in from Fujian. Should Dadu appease the commanders with offices to keep trade flowing, or order a provincial siege?"
 oe_ymar.2.a: "Appease the Garrison Leaders with Titles"
 oe_ymar.2.a.tt: "Jinjiang (Quanzhou) gains [ShowModifier('oe_ymar_ispah_rule')] (#Y 60#! months: trade continues while control collapses and unrest rises); Jiangzhe loyalty #R −5#!."
 oe_ymar.2.b: "Order Provincial Forces to Besiege Quanzhou"
 oe_ymar.2.b.tt: "Jinjiang and Fuzhou suffer [ShowModifier('oe_ymar_fujian_war')] (#Y 60#! months); diverting troops lowers northern suppression momentum #R −3#!."
 oe_ymar.3.t: "Nawna's Coup and Strife in Zaytun"
 oe_ymar.3.desc_x: "#F In 1362, the Arab official Nawna killed Saif al-Din and Amid al-Din to seize Quanzhou, plunging Jinjiang, Fuzhou, and Zhangzhou into bitter sectarian and factional warfare that threatened Zaytun's survival.#!\n\nNawna now rules Quanzhou by force. Loyalist commander Chen Youding asks to [Concept('oe_tu_march','march')|e] south with Fujian levies, while Zaytun merchant elders quietly offer to undermine Nawna if imperial trade charters are spared."
 oe_ymar.3.a: "Commission Chen Youding to March on Quanzhou"
 oe_ymar.3.a.tt: "Fuzhou and Longxi (Zhangzhou) gain [ShowModifier('oe_ymar_militia_levy')] (#Y 48#! months: higher levies at prosperity cost), setting up Chen Youding's reconquest."
 oe_ymar.3.b: "Back Zaytun's Merchant Elders Against Nawna"
 oe_ymar.3.b.tt: "Spends #R 4#! months of income to win over merchant elders, sparing Zaytun's quarters for later co-option."
 oe_ymar.4.t: "Reconquest of Quanzhou: Zaytun's Fate"
 oe_ymar.4.desc_merc: "#F In 1366, loyalist general Chen Youding retook Quanzhou and ended Nawna's rule, closing a decade of bloodshed. Dadu's treatment of Zaytun's surviving foreign quarters will decide whether the Yuan keeps its gateway to the Indian Ocean.#!\n\nWith merchant elders opening the gates, Nawna has fallen and Quanzhou returns to Dadu. Provincial officers still press for a harsh purge, while the foreign syndicates ask the court to honor its pledge and reopen Indian Ocean trade."
 oe_ymar.4.desc_chen: "#F In 1366, loyalist general Chen Youding retook Quanzhou and ended Nawna's rule, closing a decade of bloodshed. Dadu's treatment of Zaytun's surviving foreign quarters will decide whether the Yuan keeps its gateway to the Indian Ocean.#!\n\nChen Youding's victory dispatches have reached Dadu. Fujian gentry demand a full purge of foreign militias to restore order, while customs officials warn that driving out foreign traders will ruin Zaytun for a generation."
 oe_ymar.4.a: "Crush the Ispah Remnants and Purge Foreign Militias"
 oe_ymar.4.a.tt: "Clears Fujian war and garrison modifiers and adds #G +5#! suppression momentum; foreign traders flee, inflicting [ShowModifier('oe_ymar_zaytun_devastated')] on Jinjiang (#Y 120#! months)."
 oe_ymar.4.b: "Co-opt Zaytun's Indian Ocean Maritime Network"
 oe_ymar.4.b.tt: "Jinjiang gains [ShowModifier('oe_ymar_zaytun_network')] and we gain [ShowModifier('oe_ymar_indian_ocean_ties')] (#Y 120#! months: strong sea trade with control and unrest trade-offs); Jiangzhe loyalty #R −5#!."
 oe_ymar.5.t: "Nanbokucho Envoys and the Wokou"
 oe_ymar.5.desc_x: "#F During Japan's Nanbokucho division, Zen monks and merchant vessels from both Kyoto and Kyushu sailed into Ningbo bearing sulfur, copper, and blades, yet coastal raiders often mingled freely with trading ships.#!\n\nJapanese monk-envoys and merchant craft have anchored off Ningbo requesting trade privileges. Should Dadu close the port until Wokou raids cease, or grant licensed tally trade to channel sea-lords into commerce?"
 oe_ymar.5.a: "Demand Suppression of Wokou Before Any Trade"
 oe_ymar.5.a.tt: "Ningbo gains [ShowModifier('oe_ymar_port_restrictions')] (#Y 60#! months: lower piracy at merchant power cost) and eases Wokou pressure."
 oe_ymar.5.b: "Allow Licensed Tally Trade at Ningbo"
 oe_ymar.5.b.tt: "Ningbo gains [ShowModifier('oe_ymar_tally_trade')] (#Y 60#! months: higher merchant power alongside mild unrest and pirate risk)."
 oe_ymar.6.t: "The Great Maritime Debate"
 oe_ymar.6.desc_x: "#F Under Kublai Khan, expanded Maritime Customs bureaus made Quanzhou, Ningbo, and Fuzhou the premier hubs of the Indian Ocean; yet late-Yuan Wokou raids and the Ispah revolt fueled fierce calls at court for a strict Sea Ban.#!\n\nWith the southeastern coast still under Dadu's banner, the Secretariat confronts a defining choice: enforce an imperial Sea Ban to quiet the coast, or revive the Maritime Customs bureaus to reclaim oceanic trade?"
 oe_ymar.6.a: "Enact the Sea Ban to Quiet the Coast"
 oe_ymar.6.a.tt: "Adopts the #bold #color_yellow Sea Ban#!#!: gains [ShowModifier('oe_ymar_sea_ban_mod')] (#Y 180#! months: curbs piracy and raises control while slashing sea trade and naval range), clears Wokou raid penalties, and closes Zaytun's foreign network."
 oe_ymar.6.b: "Revive the Imperial Maritime Customs Bureaus"
 oe_ymar.6.b.tt: "Adopts #bold #color_yellow Maritime Customs Revival#!#!: gains [ShowModifier('oe_ymar_shibosi_mod')] (#Y 180#! months: boosts sea trade, income, and naval range at higher upkeep and pirate risk); Jinjiang and Ningbo gain [ShowModifier('oe_ymar_shibosi_port')]."
 oe_ymar.7.t: "Maritime Aftermath: Smugglers and Patrols"
 oe_ymar.7.desc_ban: "#F Once maritime policy is set, its side effects quickly surface: a strict Sea Ban drives coastal folk toward smuggling, while bustling customs ports draw raiders to rich sea lanes.#!\n\nYears of the Sea Ban have squeezed coastal livelihoods around Quanzhou and Zhangzhou, fueling armed smuggling rings. Should Dadu tighten coastal interdiction, or quietly relax tribute tallies at Ningbo?"
 oe_ymar.7.desc_open: "#F Once maritime policy is set, its side effects quickly surface: a strict Sea Ban drives coastal folk toward smuggling, while bustling customs ports draw raiders to rich sea lanes.#!\n\nRevived customs bureaus have filled coastal coffers, yet heavy merchant traffic invites raiders across the East Sea. Should Dadu fund a joint East Sea Naval Patrol with Goryeo, or charter armed merchant convoys?"
 oe_ymar.7.a: "Enforce Strict Interdiction Along Fujian's Coast"
 oe_ymar.7.a.tt: "Jinjiang and Longxi gain [ShowModifier('oe_ymar_coastal_clearance')] (#Y 60#! months: less piracy and higher control at prosperity cost)."
 oe_ymar.7.b: "Quietly Allow Tribute Tallies at Ningbo"
 oe_ymar.7.b.tt: "Eases merchant discontent under the Sea Ban while keeping minimal licensed contacts open."
 oe_ymar.7.c: "Establish the East Sea Naval Patrol with Goryeo"
 oe_ymar.7.c.tt: "Suppresses early Wokou raids; gains [ShowModifier('oe_ymar_east_sea_patrol')] (#Y 120#! months: stronger trade protection at heavy-ship upkeep); Goryeo opinion #G +15#!."
 oe_ymar.7.d: "Charter Armed Merchant Convoys"
 oe_ymar.7.d.tt: "Jinjiang and Ningbo gain [ShowModifier('oe_ymar_armed_merchants')] (#Y 120#! months: better trade protection at lower max control)."
 oe_ymar.8.t: "Legacy of the Great Yuan Seas"
 oe_ymar.8.desc_open: "#F After decades of coastal crisis and policy debate, Great Yuan's maritime posture crystallizes: either building ocean-going ships to project imperial trade across the Indian Ocean, or codifying the Sea Ban to concentrate on the continental heartland.#!\n\nWith Quanzhou and Ningbo thriving, imperial shipyards submit plans for ocean-going treasure ships to sail the Southern and Indian Oceans at heavy expense, while cautious ministers favor keeping steady customs ports without grand voyages."
 oe_ymar.8.desc_ban: "#F After decades of coastal crisis and policy debate, Great Yuan's maritime posture crystallizes: either building ocean-going ships to project imperial trade across the Indian Ocean, or codifying the Sea Ban to concentrate on the continental heartland.#!\n\nYears of the Sea Ban have quieted the coast and steadied the heartland. Should the court codify the Sea Ban as permanent law, or lift it in peacetime to reopen Zaytun's customs?"
 oe_ymar.8.a: "Commission Ocean-Going Treasure Ships"
 oe_ymar.8.a.tt: "Unlocks the treasure-fleet precursor for later Silk Road diplomacy; grants lasting [ShowModifier('oe_ymar_yuan_fleet')] until Yuan falls (naval range, sea trade, diplomatic reputation, with #R +20%#! heavy-ship upkeep). Completes this line."
 oe_ymar.8.b: "Hold to Existing Customs Ports"
 oe_ymar.8.b.tt: "Grants lasting [ShowModifier('oe_ymar_steady_customs')] until Yuan falls (steady trade income with mild pirate risk). Completes this line."
 oe_ymar.8.c: "Codify the Sea Ban and Focus on the Heartland"
 oe_ymar.8.c.tt: "Grants lasting [ShowModifier('oe_ymar_codified_ban')] until Yuan falls (inland control, tax efficiency, and anti-piracy at permanent sea trade cost). Completes this line."
 oe_ymar.8.d: "Lift the Sea Ban and Reopen Zaytun in Peacetime"
 oe_ymar.8.d.tt: "Switches policy to #bold #color_yellow Maritime Customs Revival#!#!: lifts the Sea Ban for [ShowModifier('oe_ymar_shibosi_mod')] and reopens Jinjiang's customs hub. Completes this line."
 oe_ymar.20.t: "Quanzhou & Maritime Policy: choice takes effect"
