 STATIC_MODIFIER_DESC_oe_ymar_east_sea_patrol: "Regular imperial and Goryeo patrols sweep the East Sea lanes clear of raiders, protecting commerce at high heavy-ship upkeep."
 STATIC_MODIFIER_NAME_oe_ymar_yuan_fleet: "Great Yuan Ocean Fleet"
 STATIC_MODIFIER_DESC_oe_ymar_yuan_fleet: "Ocean-going imperial junks carry Dadu's banner across the Southern and Indian Oceans, expanding reach and trade at steep heavy-ship upkeep."
 STATIC_MODIFIER_NAME_oe_ymar_steady_customs: "Steady Maritime Customs"
 STATIC_MODIFIER_DESC_oe_ymar_steady_customs: "Dadu keeps the coastal customs offices running without costly grand expeditions, drawing steady revenue alongside mild piracy risk."
 STATIC_MODIFIER_NAME_oe_ymar_codified_ban: "Codified Sea Ban"
 STATIC_MODIFIER_DESC_oe_ymar_codified_ban: "Codified as standing imperial law, the Sea Ban bolsters inland tax and control while permanently curtailing sea commerce."
 STATIC_MODIFIER_NAME_oe_ymar_wokou_raids: "Early Wokou Raids"
 STATIC_MODIFIER_DESC_oe_ymar_wokou_raids: "Raiders from Kyushu strike coastal towns and shipping lanes, lowering local prosperity and maritime presence."
 STATIC_MODIFIER_NAME_oe_ymar_ispah_rule: "Ispah Garrison Domination"
 STATIC_MODIFIER_DESC_oe_ymar_ispah_rule: "Persian-Arab garrison commanders rule Quanzhou in all but name: foreign shipping persists while imperial control collapses."
 STATIC_MODIFIER_NAME_oe_ymar_fujian_war: "Fujian Coastal Warfare"
 STATIC_MODIFIER_DESC_oe_ymar_fujian_war: "Sieges and marches between provincial troops and the Ispah garrison scar Fujian's ports and drive away trade."
 STATIC_MODIFIER_NAME_oe_ymar_militia_levy: "Fujian Loyalist Levies"
 STATIC_MODIFIER_DESC_oe_ymar_militia_levy: "Local gentry raise loyalist levies under Chen Youding, swelling regional manpower while straining local prosperity."
 STATIC_MODIFIER_NAME_oe_ymar_zaytun_devastated: "Devastation of Zaytun"
 STATIC_MODIFIER_DESC_oe_ymar_zaytun_devastated: "After the brutal suppression of the Ispah faction, foreign merchant quarters lie empty and Quanzhou's commerce collapses for a decade."
 STATIC_MODIFIER_NAME_oe_ymar_zaytun_network: "Zaytun Foreign Quarters Restored"
 STATIC_MODIFIER_DESC_oe_ymar_zaytun_network: "Licensed foreign merchants rebuild Quanzhou's Indian Ocean hub, generating strong trade power alongside lingering local friction."
 STATIC_MODIFIER_NAME_oe_ymar_port_restrictions: "Ningbo Port Restrictions"
 STATIC_MODIFIER_DESC_oe_ymar_port_restrictions: "Strict screening at Ningbo deters raiders disguised as traders while curtailing local merchant power."
 STATIC_MODIFIER_NAME_oe_ymar_tally_trade: "Ningbo Tally Trade"
 STATIC_MODIFIER_DESC_oe_ymar_tally_trade: "Licensed Japanese vessels trade sulfur and blades at Ningbo, boosting merchant power while inviting smuggling and unrest."
 STATIC_MODIFIER_NAME_oe_ymar_shibosi_port: "Imperial Maritime Customs Hub"
 STATIC_MODIFIER_DESC_oe_ymar_shibosi_port: "A revived customs bureau turns the port into a booming maritime entrepot, trading higher local unrest for commercial clout."
 STATIC_MODIFIER_NAME_oe_ymar_coastal_clearance: "Strict Coastal Interdiction"
 STATIC_MODIFIER_DESC_oe_ymar_coastal_clearance: "Troops police the shoreline against illicit sailings, suppressing pirates and raising control while hurting coastal livelihoods."
 STATIC_MODIFIER_NAME_oe_ymar_armed_merchants: "Chartered Armed Convoys"
 STATIC_MODIFIER_DESC_oe_ymar_armed_merchants: "Armed merchant syndicates guard coastal trade lanes at their own expense, improving protection while weakening crown control."
