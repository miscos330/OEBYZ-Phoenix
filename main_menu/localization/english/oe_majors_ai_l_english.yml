 oe_heg_ai.90.d: "#T 12-Major AI Ecology & Dynamic Anti-Hegemon Status (Slot 67)#!\nRule 10 Mode #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_rule')|0]#! (0 Off / 1 Standard / 2 High)  Hegemon Active #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_active')|0]#!  Theater #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_theater')|0]#! (0 None / 1 Med-Europe / 2 E.Eur-Steppe / 3 Asia)\nHegemon ID #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_tag_id')|0]#! (1 BYZ / 2 ROM / 3 TUR / 4 CHI / 5 GLH / 6 MOS / 7 RUS / 8 FRA / 9 HAB / 10 CAS / 11 SPA / 12 MAM / 13 POL / 14 PLC / 15 TIM / 16 IRA / 17 DLH / 18 VIJ / 19 ENG / 20 GBR / 21 MUG / 22 BAH / 23 MNG / 24 MCH / 25 PRU / 26 SWE / 27 NED / 28 JAP / 99 Other Human)\nHegemon Size #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_size')|0]#! locs  High-Entropy Window (>=60) #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_ent_hi')|0]#!  Self Threatened #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_self_threat')|0]#!  Sim Override #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_test_force')|0]#!\nSlot 67 Last Scan Month #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_ran_m')|0]#! / Current Month #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_m_now')|0]#!\n\n#T 12 Great Powers Baseline AI Templates (0 Inactive or Human / 1 Primary / 2 Secondary or Formable / 3 Dual Active)#!\n1.BYZ/ROM:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m1')|0]#!  2.TUR:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m2')|0]#!  3.CHI:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m3')|0]#!  4.GLH:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m4')|0]#!  5.MOS/RUS:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m5')|0]#!  6.FRA:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m6')|0]#!\n7.HAB:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_rd_m7')|0]#!  8.CAS/SPA:#Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_heg_ai_r