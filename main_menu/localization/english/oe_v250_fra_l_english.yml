# NEW 2026-11-24 v25.0 Phase 4A: 1337-1460 Deep Flavor & Mechanic Packs (TUR/FRA/ENG) (oe_v250_fra_, 0 mainline slots, 0 rules, 0 vanilla overrides) — english localization for Kingdom of France (1337-1460) (143 keys). Edit gen_v250_1337_tur_fra_eng.py, not this file.
 oe_v250_fra_reform_parlement_baillis:0 "Parlement of Paris & Royal Baillis"
 oe_v250_fra_reform_parlement_baillis_desc:0 "Extends Parisian royal jurisprudence and salaried baillis into every French province, sharpening crown tax collection and provincial control while stirring noble opposition and rigidifying domestic stability."
 oe_v250_fra_reform_chivalric_appanages:0 "Valois Chivalric Appanages"
 oe_v250_fra_reform_chivalric_appanages_desc:0 "Invests royal princes and great peers with splendid ducal appanages that field Christendom's finest heavy lancers and quiet princely feuds, at the price of diminished crown centralization and lighter royal tax receipts."
 oe_v250_fra_priv_taille_exempt_nobles:0 "Taille Exemption of the Sword Nobility"
 oe_v250_fra_priv_taille_exempt_nobles_desc:0 "Excuses France's martial aristocracy from paying the direct royal taille in exchange for armored cavalry service and sharper feudal levies, shifting fiscal burdens onto peasants and swelling noble estate clout."
 oe_v250_fra_priv_gallican_liberties:0 "Gallican Liberties of the French Prelates"
 oe_v250_fra_priv_gallican_liberties_desc:0 "Shields French cathedral chapters and university masters from external papal levies, lifting scholarship, dynastic legitimacy, and clerical loyalty while strengthening domestic church estates and cooling foreign curial ties."
 oe_v250_fra_cab_chevalier_bailli:0 "Royal Bailli Fiscal & Judicial Circuit"
 oe_v250_fra_cab_chevalier_bailli_desc:0 "Sends an armed crown bailli and royal assessors through a target province to audit feudal courts, tighten local control, and boost workshop output, at the cost of noble and peasant resentment."
 oe_v250_fra_cab_chevalier_bailli_action:0 "Royal Bailli Fiscal & Judicial Circuit: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_fra_cab_chevalier_bailli_active:0 "Royal Bailli Fiscal & Judicial Circuit in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_fra_cab_chevalier_bailli_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_fra_cab_chevalier_bailli_action_progress_wordier:0 "Royal Bailli Fiscal & Judicial Circuit ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_fra_cab_chevalier_bailli_action_progress_tooltip:0 "Sends an armed crown bailli and royal assessors through a target province to audit feudal courts, tighten local control, and boost workshop output, at the cost of noble and peasant resentment."
 oe_v250_fra_cab_chevalier_bailli_select_province:0 "Select a Province for Royal Bailli Judicial Circuit"
 oe_v250_fra_cab_chevalier_bailli_no_provinces:0 "@trigger_no! No eligible provinces available for Royal Bailli Circuit."
 oe_v250_fra_cab_bureau_ordnance:0 "Royal Ordnance & Siege Train Commission"
 oe_v250_fra_cab_bureau_ordnance_desc:0 "Tasks crown treasurers and master gunners with standardizing powder magazines, wheeled field culverins, and standing company pay, elevating siege speed and army discipline at steep fiscal and upkeep costs."
 oe_v250_fra_cab_bureau_ordnance_action:0 "Royal Ordnance & Siege Train Commission"
 oe_v250_fra_cab_bureau_ordnance_active:0 "Active: Royal Ordnance & Siege Train Commission"
 oe_v250_fra_cab_bureau_ordnance_action_progress:0 "Active"
 oe_v250_fra_cab_bureau_ordnance_action_progress_wordier:0 "Royal Ordnance & Siege Train Commission (Active)"
 oe_v250_fra_cab_bureau_ordnance_action_progress_tooltip:0 "Tasks crown treasurers and master gunners with standardizing powder magazines, wheeled field culverins, and standing company pay, elevating siege speed and army discipline at steep fiscal and upkeep costs."
 oe_v250_fra_dec_reims_coronation.title:0 "Celebrate the Solemn Sacre of Reims"
 oe_v250_fra_dec_reims_coronation.desc:0 "Consecrate the Valois monarchy with the Holy Ampulla at Reims Cathedral, silencing dynastic pretenders. Costs 100 gold; boosts legitimacy, morale, and clergy favor for 25 years while expanding clerical influence and trimming direct taxes."
 oe_v250_fra_dec_reims_coronation.a:0 "Anoint the Most Christian King at Reims"
 oe_v250_fra_dec_cour_des_aides.title:0 "Establish the Parisian Cour des Aides"
 oe_v250_fra_dec_cour_des_aides.desc:0 "Create a permanent sovereign fiscal court in Paris to adjudicate salt taxes, sales aides, and extraordinary war subsidies. Available from 1355; costs 110 gold and raises taxation and cabinet skill for 25 years at the cost of commoner and merchant discontent."
 oe_v250_fra_dec_cour_des_aides.a:0 "Charter the Sovereign Fiscal Court"
 oe_v250_fra_dec_sorbonne_patronage.title:0 "Charter the Louvre Library & University of Paris"
 oe_v250_fra_dec_sorbonne_patronage.desc:0 "Commission French translations of classical statecraft and expand the Louvre manuscript library alongside the Sorbonne's colleges. Available from 1365; costs 120 gold, boosting research, institution spread, and prestige for 25 years at steady royal patronage expense."
 oe_v250_fra_dec_sorbonne_patronage.a:0 "Endow the Royal Translators and Colleges"
 oe_v250_fra_dec_compagnies_ordonnance.title:0 "Proclaim the Compagnies d'Ordonnance"
 oe_v250_fra_dec_compagnies_ordonnance.desc:0 "Replace unruly mercenary routiers with Europe's first permanent royal standing companies of heavy lancers and integrated siege artillery. Available from 1438; costs 160 gold, delivering peak discipline, heavy cavalry, and siege ability for 25 years at heavy upkeep and noble irritation."
 oe_v250_fra_dec_compagnies_ordonnance.a:0 "Muster the Royal Standing Companies"
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_reims_sacre:0 "Solemn Sacre of Reims"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_reims_sacre:0 "Anointed in Reims Cathedral, the French monarch commands sacral legitimacy and staunch battlefield morale while conceding greater prestige to the Gallican clergy."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_cour_des_aides:0 "Parisian Cour des Aides"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_cour_des_aides:0 "Central fiscal magistrates enforce uniform collection of royal aides across France, bolstering state income while drawing sharp resentment from townsfolk and villages."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_sorbonne:0 "Louvre Library & Sorbonne Patronage"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_sorbonne:0 "Royal translations and Parisian scholastic guilds turn the Seine into a beacon of learning and institutional innovation, financed out of regular tax and defense coffers."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_dec_ordonnance:0 "Compagnies d'Ordonnance"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_dec_ordonnance:0 "Permanent royal lancers and standardized gun crews outclass medieval feudal hosts across Western Europe, demanding steep year-round payrolls and eclipsing private noble banners."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev1_guyenne_confiscation:0 "Forfeiture of Guyenne"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev1_guyenne_confiscation:0 "Assertive feudal suzerainty rallies French noble cavalry and royal morale, while alarming neighboring realms and raising war readiness costs."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev1_parlement_arbitration:0 "Parlement Feudal Arbitration"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev1_parlement_arbitration:0 "Measured legal proceedings calm diplomatic waters and ease fiscal collection, though proud barons grumble at royal caution."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev2_gabelle_monopoly:0 "Royal Gabelle Salt Monopoly"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev2_gabelle_monopoly:0 "Mandatory state salt purchases fill war chests and bolster tax efficiency at the harsh cost of peasant anger and steeper stability burdens."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev2_municipal_aides:0 "Negotiated Municipal War Aides"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev2_municipal_aides:0 "Sparing villages from salt exactions fosters civic trade and merchant goodwill, while expanding burgher political leverage and slowing direct tax receipts."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev3_fabian_doctrine:0 "Du Guesclin's Fabian Doctrine"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev3_fabian_doctrine:0 "Disciplined castle defense and guerrilla counter-sieges bleed invaders dry, though noble chivalry chafes at refusing open-field duels and fort expenses climb."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev3_chivalric_shock:0 "Renewed Chivalric Plate Shock"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev3_chivalric_shock:0 "Re-equipping noble lances lifts heavy cavalry impact and morale, yet stiffens battlefield rigidity and elevates army upkeep."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev3_crossbow_mercs:0 "Contract Crossbow Companies"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev3_crossbow_mercs:0 "Seasoned Italian pavise crossbowmen add steady missile firepower and discipline, while draining royal gold and reducing domestic levy reliance."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev4_estates_oversight:0 "Estates-General Fiscal Oversight"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev4_estates_oversight:0 "Parliamentary accounting calms Paris guilds and boosts urban commerce, at the cost of sharply curtailed crown power and emboldened burgher factions."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev4_royal_defiance:0 "Crown Prerogative Over Paris"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev4_royal_defiance:0 "Crushing municipal radicalism preserves sovereign French monarchy and central control, yet chills urban trade and sours burgher loyalty."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev5_noble_suppression:0 "Suppression of the Jacquerie"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev5_noble_suppression:0 "Swift aristocratic reprisals restore feudal obedience and noble devotion while devastating rural labor output and deepening peasant bitterness."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev5_rural_amnesty:0 "Royal Rural Amnesty Charter"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev5_rural_amnesty:0 "Shielding French villagers from extortion revives farmland prosperity and rural calm, at the price of lighter short-term tax collection and angry landlords."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev6_permanent_taille:0 "Ordonnances of the Permanent Taille"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev6_permanent_taille:0 "Honest coinage and steady direct taxation fortify crown revenue and central governance, while straining provincial subjects and noble privileges."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev6_provincial_estates:0 "Provincial Estates Tax Concord"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev6_provincial_estates:0 "Respecting regional charters promotes internal peace and estate satisfaction, yet caps royal fiscal extraction and slows centralization."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev7_marmouset_ministers:0 "Marmouset Meritocratic Ministry"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev7_marmouset_ministers:0 "Professional clerks sharpen cabinet efficiency, research, and honest taxation while angering princely vassals and high aristocrats."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev7_princes_of_blood:0 "Council of the Princes of the Blood"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev7_princes_of_blood:0 "Honoring the royal dukes strengthens princely loyalty and court splendor, while siphoning crown power and treasury discipline into ducal pensions."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev8_burgundian_appeasement:0 "Burgundian Court Appeasement"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev8_burgundian_appeasement:0 "Concessions to Dijon steady eastern diplomacy and subject obedience, at the price of weakened crown authority and softer direct revenues."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev8_armagnac_centralization:0 "Armagnac Royalist Consolidation"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev8_armagnac_centralization:0 "Securing Paris under loyalist commanders bolsters crown power and warlike resolve, while provoking Burgundian fury and destabilizing estate concord."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev9_maid_orleans:0 "Banner of the Maid of Orleans"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev9_maid_orleans:0 "Electrifying popular devotion lifts French army morale, manpower volunteers, and siege determination, though conservative prelates and anxious bureaucrats fret over fervor outrunning protocol."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev9_poitiers_caution:0 "Poitiers Ecclesiastical Prudence"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev9_poitiers_caution:0 "Careful theological vetting keeps clergy and diplomatic courts reassured, yet cools the fiery patriotic surge among rank-and-file levies."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev10_arras_concord:0 "Reconciliation of Arras"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev10_arras_concord:0 "Detaching Burgundy unlocks French diplomatic dominance and internal war recovery, paid for in pledged border revenues and humbled court prestige."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev10_valois_pride:0 "Unbowed Valois Sovereignty"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev10_valois_pride:0 "Refusing territorial pledges preserves royal dignity and martial edge, while keeping Burgundy hostile and prolonging diplomatic friction."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev11_pragmatic_sanction:0 "Pragmatic Sanction of Bourges"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev11_pragmatic_sanction:0 "Keeping church revenues inside France enriches the treasury and strengthens crown authority over bishops, while straining relations with Rome and Catholic courts."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev11_papal_concordat:0 "Franco-Papal Conciliatory Concordat"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev11_papal_concordat:0 "Honoring papal fiscal claims wins Roman diplomatic favor and Catholic legitimacy, while letting church silver flow south of the Alps."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev12_bureau_artillery:0 "Bureau Brothers Siege Revolution"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev12_bureau_artillery:0 "Standardized bronze-and-iron artillery trains paired with salaried lancers shatter stone strongholds across France, imposing heavy military upkeep and fiscal strain."
 STATIC_MODIFIER_NAME_oe_v250_fra_mod_ev12_franc_archers:0 "Provincial Franc-Archers Militia"
 STATIC_MODIFIER_DESC_oe_v250_fra_mod_ev12_franc_archers:0 "Tax-exempt parish archers furnish large, economical manpower pools for home defense, yet fall short of professional standing infantry in pitched shock."
 oe_v250_fra.1.t:0 "Confiscation of Guyenne & the Valois Summons"
 oe_v250_fra.1.d:0 "Edward III of England harbors French fugitives and resists appeals from his Gascon vassals to the Parlement of Paris. Philip VI's jurists urge formally declaring the Duchy of Aquitaine forfeit to the French Crown and summoning the royal feudal host—a decisive assertion of Valois sovereignty that will ignite open war across the Channel, whereas extended legal arbitration buys time at the cost of looking hesitant before our peers."
 oe_v250_fra.1.a:0 "Declare Guyenne forfeit and summon the Valois feudal ban"
 oe_v250_fra.1.b:0 "Prolong Parlement arbitration to prepare finances quietly"
 oe_v250_fra.2.t:0 "The Gabelle Salt Tax & the Royal War Chest"
 oe_v250_fra.2.d:0 "Mounting campaign outlays and naval losses have drained the Louvre treasury. Royal treasurers propose establishing permanent state salt granaries (greniers a sel) compelling every French household to purchase taxed crown salt—the hated Gabelle. It guarantees reliable war revenue immediately, yet rural villages already reel from bad harvests; alternatively, negotiating town subsidies preserves civic peace while yielding far less silver."
 oe_v250_fra.2.a:0 "Enforce the royal Gabelle salt granaries across the realm"
 oe_v250_fra.2.b:0 "Negotiate voluntary war aides with municipal burghers instead"
 oe_v250_fra.3.t:0 "Chivalry vs Fabian Warfare After Crecy"
 oe_v250_fra.3.d:0 "Bitter defeats against massed English longbowmen and dismounted men-at-arms have shaken the French royal council. Proud magnates clamor for heavier plate armor and glorious cavalry charges to redeem French honor, while seasoned Breton captains like Bertrand du Guesclin argue for a patient Fabian strategy: refuse pitched battles on enemy ground, garrison stone castles, and starve invading chevauchees into ruin."
 oe_v250_fra.3.a:0 "Adopt du Guesclin's Fabian fortress and attrition doctrine"
 oe_v250_fra.3.b:0 "Double down on barded plate and Valois chivalric shock"
 oe_v250_fra.3.c:0 "Hire Genoese crossbow companies to screen our infantry"
 oe_v250_fra.4.t:0 "Etienne Marcel & the Estates-General of Paris"
 oe_v250_fra.4.d:0 "Shocked by war reverses and debased coinage, Provost of the Merchants Etienne Marcel leads the Parisian bourgeoisie and the Estates-General in demanding a Great Ordinance: no new taxes without estate consent, audited royal treasurers, and permanent urban oversight. Conceding constitutional oversight secures merchant loans and calmer streets, while defiant resistance protects royal sovereignty at the price of urban turmoil."
 oe_v250_fra.4.a:0 "Accept the Great Ordinance and estate fiscal oversight"
 oe_v250_fra.4.b:0 "Reject Marcel's demands and reassert undivided royal authority"
 oe_v250_fra.5.t:0 "The Jacquerie Peasant Uprising"
 oe_v250_fra.5.d:0 "Ravaged by unpaid mercenary bands and squeezed by noble ransom levies, enraged peasants across the Ile-de-France, Picardy, and Beauvaisis seize pitchforks and burn manor houses in the terrible Jacquerie. Unleashing aristocratic cavalry will stamp out the revolt rapidly and bind the nobility to the throne, whereas issuing royal amnesties and rural tax pauses may save our harvests at the risk of noble fury."
 oe_v250_fra.5.a:0 "Unleash noble cavalry to crush the Jacquerie ruthlessly"
 oe_v250_fra.5.b:0 "Issue royal amnesty and curb arbitrary manor levies"
 oe_v250_fra.6.t:0 "Charles V's Grand Ordonnances & the Permanent Taille"
 oe_v250_fra.6.d:0 "Determined never again to watch France collapse into fiscal insolvency, Charles the Wise drafts sweeping financial ordinances: stabilize the gold franc at honest bullion weight, convert emergency war hearth-taxes into a permanent royal Taille, and audit every provincial receiver. Enforcing permanent taxation gives the Crown durable war-making power, though regional estates protest the loss of their ancient consent."
 oe_v250_fra.6.a:0 "Codify sound gold coinage and the permanent royal Taille"
 oe_v250_fra.6.b:0 "Preserve provincial estate consent for lighter, gentler rule"
 oe_v250_fra.7.t:0 "The Marmousets & Crown Bureaucracy"
 oe_v250_fra.7.d:0 "Dismissing the grasping royal uncles of Berry, Anjou, and Burgundy, a circle of low-born jurists and seasoned captains—scornfully nicknamed 'les Marmousets' by high peers—proposes austere fiscal budgets, meritocratic treasury appointments, and strict royal audits. Backing the Marmousets modernizes the state at the price of furious royal dukes; restoring the princes of the blood keeps grand alliances calm while feeding court patronage."
 oe_v250_fra.7.a:0 "Empower the meritocratic Marmousets to reform the treasury"
 oe_v250_fra.7.b:0 "Share regency stewardship with the Royal Dukes of the Blood"
 oe_v250_fra.8.t:0 "The Armagnac vs Burgundian Court Feud"
 oe_v250_fra.8.d:0 "Factional rivalry between the House of Orleans-Armagnac and the mighty Dukes of Burgundy threatens to split France into warring camps right in front of English observers. Appeasing Dijon with tax exemptions and frontier lordships could prevent Burgundy from allying with London, yet rallying the Armagnac crown party to secure Paris preserves unified Valois leadership at the price of a dangerous eastern rupture."
 oe_v250_fra.8.a:0 "Appease Burgundy with frontier privileges to prevent English collusion"
 oe_v250_fra.8.b:0 "Rally the Armagnac crown party and centralize Paris"
 oe_v250_fra.9.t:0 "The Maid of Orleans & the Royal Awakening"
 oe_v250_fra.9.d:0 "From the borderlands of Lorraine rides a young peasant visionary proclaiming divine mandate to break the English grip on the Loire and escort the Dauphin to sacred coronation at Reims. Veteran captains and common soldiers thrill at her white standard, yet cautious bishops and court politicians warn that staking royal legitimacy on unorthodox visions risks ecclesiastical scandal if fortune turns."
 oe_v250_fra.9.a:0 "Embrace the Maid's banner and ignite a national awakening"
 oe_v250_fra.9.b:0 "Subject her claims to cautious Poitiers theological inquiry"
 oe_v250_fra.10.t:0 "The Congress of Arras: Detaching Burgundy"
 oe_v250_fra.10.d:0 "Papal legates convene an international peace congress at Arras, offering Charles VII a golden strategic opening: if France makes humble formal apologies for past blood feuds and pledges rich Somme border revenues to Philip the Good, Burgundy will abandon England and leave London diplomatically isolated. Yet swallowing royal pride and surrendering northern rents tastes bitter to French loyalists."
 oe_v250_fra.10.a:0 "Seal the Treaty of Arras and pay the price to isolate England"
 oe_v250_fra.10.b:0 "Refuse humiliating concessions and trust French steel alone"
 oe_v250_fra.11.t:0 "The Pragmatic Sanction of Bourges"
 oe_v250_fra.11.d:0 "Before a grand assembly of French prelates and jurists at Bourges, Charles VII considers proclaiming the Pragmatic Sanction—halting gold annates flowing to Rome, restoring free cathedral elections under royal supervision, and asserting the liberties of the Gallican Church. Retaining French ecclesiastical revenue strengthens crown finances dramatically, yet Rome will denounce the decree as an assault on papal primacy."
 oe_v250_fra.11.a:0 "Proclaim the Pragmatic Sanction and secure Gallican revenues"
 oe_v250_fra.11.b:0 "Negotiate a concordat with Rome preserving papal annates"
 oe_v250_fra.12.t:0 "The Bureau Brothers & Europe's First Standing Army"
 oe_v250_fra.12.d:0 "With Normandy and Guyenne ripe for final reconquest, master gunners Jean and Gaspard Bureau showcase iron-shot cast cannons mounted on mobile carriages alongside fifteen permanent Compagnies d'Ordonnance paid year-round by the Taille. Funding this military revolution will turn French armies into unstoppable castle-breakers, though the continuous peacetime payroll will weigh heavily on the royal budget."
 oe_v250_fra.12.a:0 "Fund the Bureau siege train and permanent standing companies"
 oe_v250_fra.12.b:0 "Expand provincial Franc-Archers militias at leaner fiscal cost"
