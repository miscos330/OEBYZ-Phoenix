l_english:
 oe_ecc_merged_reason: "Merged into the Ecumenical Patriarchate"
 OE_ECC_EMPTY: ""
 OE_ECC_ATHOS_LINE: "\n\nThe go-betweens are monks of Mount Athos, of the same school as our own patriarch."
 OE_ECC_UNION_LINE: "\n\nOne of the envoys asks quietly whether the emperor really bowed to the Pope in Rome."
 OE_ECC_TARNOVO_LINE: "\n\nEuthymius's pupils studied on Mount Athos and at the Stoudios monastery; they know the road to Constantinople."
 OE_ECC_CHR_SER_1: "Reconciled with the Serbian Church and recognised the patriarch of Peć."
 OE_ECC_CHR_SER_2: "Peć stepped down to an archbishopric and the Serbian Church came back to the Ecumenical Patriarchate."
 OE_ECC_CHR_SER_3: "Twice turned away the envoys of Peć; the schism remains."
 OE_ECC_CHR_SER_V2: "The empire no longer leads the Ecumenical Patriarchate, so the Serbian question is moot."
 OE_ECC_CHR_SER_V1: "Serbia never came to seek reconciliation."
 OE_ECC_CHR_SER_OPEN: "The Serbian question is still open."
 OE_ECC_CHR_TAR_1: "Greek bishops took over the sees of Tarnovo."
 OE_ECC_CHR_TAR_2: "The sees of Tarnovo joined the Ecumenical Patriarchate and kept the Slavonic rite."
 OE_ECC_CHR_TAR_3: "The see of Tarnovo was left standing."
 OE_ECC_CHR_TAR_V2: "The empire no longer leads the Ecumenical Patriarchate, so the Bulgarian question is moot."
 OE_ECC_CHR_TAR_SELF: "The Bulgarian Church came under the Ecumenical Patriarchate by itself."
 OE_ECC_CHR_TAR_V1: "The question of the Bulgarian sees never arose."
 OE_ECC_CHR_TAR_OPEN: "The question of the Bulgarian sees has not yet arisen."
 oe_ecc_synod: "Hold a Holy Synod"
 oe_ecc_synod_desc: "Call the Holy Synod of Constantinople to rule between the [Concept('oe_tu_church_parties','church parties')|e]. Costs #R 5#! [oe_tu_authority|e] and #R 100#! gold; once in #Y 10#! years; not during a civil war.\n\nParties: Hesychasts #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!, Rationalists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!, Unionists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!; prevailing: [GetCountry('BYZ').Custom('OeEccDom')]. The [Concept('patriarch','patriarch')|e]'s party: [GetCountry('BYZ').Custom('OeEccPatF')]. The [Concept('oe_tu_patriarchate','patriarchal standing')|e]: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_pres').GetValue|0]#!.\nSees: Rus' [GetCountry('BYZ').Custom('OeEccSee_rus')], Lithuania [GetCountry('BYZ').Custom('OeEccSee_lit')], Wallachia [GetCountry('BYZ').Custom('OeEccSee_wal')], Moldavia [GetCountry('BYZ').Custom('OeEccSee_mol')], Serbia [GetCountry('BYZ').Custom('OeEccSee_ser')], Tarnovo [GetCountry('BYZ').Custom('OeEccSee_tar')]."
 oe_ecc_synod_tt: "[oe_tu_authority|e] #R −5#!, #R −100#! gold.\nThe Holy Synod meets in Hagia Sophia; next you choose what it decides. No other synod for #Y 10#! years."
 oe_ecc_synod_card: "Call the Holy Synod to rule between the church parties."
 oe_ecc_synod_allow_live: "The church parties have formed and the empire still leads the Ecumenical Patriarchate"
 oe_ecc_synod_allow_auth: "Imperial Authority is at least 5"
 oe_ecc_synod_allow_gold: "The treasury holds at least 100 gold"
 oe_ecc_synod_allow_cd: "10 years have passed since the last Holy Synod"
 oe_ecc_synod_allow_peace: "No civil war is on"
 OE_ECC_P1: "the Hesychasts"
 OE_ECC_P2: "the Rationalists"
 OE_ECC_P3: "the Unionists"
 OE_ECC_DOM_EVEN: "none (the parties are even)"
 OE_ECC_NOT_YET: "not yet recorded"
 OE_ECC_PAT_VACANT: "vacant (the synod is choosing)"
 OE_ECC_EMP_OTHER: "another party"
 OE_ECC_SEE_0: "none"
 OE_ECC_SEE_1: "in our care"
 OE_ECC_SEE_2: "disputed"
 OE_ECC_SEE_3: "autocephalous"
 OE_ECC_SEE_4: "broken away"
 oe_ecc_name_neilos: "Neilos"
 OE_ECC_CHR_RUS_ISIDORE: "Isidore has gone to Rus'; how the Church of Rus' takes the union remains to be seen. The see of Rus': [GetCountry('BYZ').Custom('OeEccSee_rus')]; the see of Lithuania: [GetCountry('BYZ').Custom('OeEccSee_lit')]."
 OE_ECC_CHR_RUS_JONAH: "Jonah has been consecrated, and Rus' is at peace with Constantinople. The see of Rus': [GetCountry('BYZ').Custom('OeEccSee_rus')]; the see of Lithuania: [GetCountry('BYZ').Custom('OeEccSee_lit')]."
 OE_ECC_CHR_RUS_CYPRIAN: "Cyprian has been consecrated, to succeed over all Rus' in time. The see of Rus': [GetCountry('BYZ').Custom('OeEccSee_rus')]; the see of Lithuania: [GetCountry('BYZ').Custom('OeEccSee_lit')]."
 OE_ECC_CHR_RUS_RUN: "The see of Rus': [GetCountry('BYZ').Custom('OeEccSee_rus')]; the see of Lithuania: [GetCountry('BYZ').Custom('OeEccSee_lit')]."
 OE_ECC_CHR_RUS_BROKE: "The bishops of Rus' chose their metropolitan without Constantinople, and the Church of Rus' went its own way."
 OE_ECC_CHR_RUS_AUTO: "The Church of Rus' is autocephalous and still in communion with Constantinople."
 OE_ECC_CHR_RUS_KEPT: "In 1449 the Church of Rus' was still under Constantinople."
 OE_ECC_CHR_RUS_OFF: "The empire no longer leads the Ecumenical Patriarchate."
 OE_ECC_CHR_RUS_NOFW: "The empire does not lead the Ecumenical Patriarchate, so the metropolitans of Rus' are not its concern."
 OE_ECC_CHR_RUS_SELF: "The Church of Rus' has already gone its own way."
 OE_ECC_CHR_RUS_NOHOST: "No Orthodox country of Rus' is left in the Ecumenical Patriarchate."
 OE_ECC_CHR_RUS_NEVER: "The question of the metropolitans of Rus' never arose before 1449."
 OE_ECC_ALEXIUS_LINE: "\n\nMoscow's candidate is Alexius, the most respected churchman at the grand prince's court."
 oe_ecc_reconciled: "Our Churches are reconciled"
 oe_ecc_pec_humbled: "Forced our patriarch down to archbishop"
 oe_ecc_schism_kept: "Refuses to recognise our patriarch"
 oe_ecc_flock_returned: "Came back to the Ecumenical Patriarchate"
 oe_ecc_vidin_received: "Took our see under its care"
 oe_ecc_vidin_poached: "Took the see of Vidin from us"
 oe_ecc_tarnovo_respected: "Respected the see of Tarnovo"
 oe_ecc_tarnovo_absorbed: "Put Greek bishops over our Church"
 oe_ecc_slavonic_kept: "Took in our Church but kept the Slavonic rite"
 oe_ecc_union_pleased: "Constantinople leans towards union"
 oe_ecc_consecrated: "Constantinople consecrated our metropolitan"
 oe_ecc_backed: "Constantinople took our side"
 oe_ecc_slighted: "Constantinople turned down our candidate"
 oe_ecc_excommunicated: "Excommunicated by the patriarch of Constantinople"
 oe_ecc_rebuked: "Rebuked by the patriarch"
 oe_ecc_favoured: "Constantinople did right by us"
 oe_ecc_overruled: "Overruled by the synod of Constantinople"
 STATIC_MODIFIER_NAME_oe_ecc_peace_of_churches: "Peace between the Churches"
 STATIC_MODIFIER_NAME_oe_ecc_pec_returned: "Peć Returns to the Fold"
 STATIC_MODIFIER_NAME_oe_ecc_greek_bishops: "Greek Bishops"
 STATIC_MODIFIER_NAME_oe_ecc_slavonic_rite: "The Slavonic Rite"
 STATIC_MODIFIER_NAME_oe_ecc_dom_hes: "The Hesychasts Prevail"
 STATIC_MODIFIER_NAME_oe_ecc_dom_rat: "The Scholars Prevail"
 STATIC_MODIFIER_NAME_oe_ecc_dom_uni: "The Unionists Prevail"
 STATIC_MODIFIER_NAME_oe_ecc_pat_rift: "Patriarch at Odds with the Faithful"
 STATIC_MODIFIER_NAME_oe_ecc_pres_high: "Patriarch of the Nations"
 STATIC_MODIFIER_NAME_oe_ecc_pres_low: "The Patriarch Goes Unheard"
 STATIC_MODIFIER_NAME_oe_ecc_tomos: "The Tomos of the Council"
 oe_ecc.1.t: "The Envoys from Peć"
 oe_ecc.1.desc.a: "#F In 1375 Prince Lazar of Serbia sent Isaija, a monk of Mount Athos, to Constantinople. Patriarch Philotheos lifted the old anathema and recognised the Serbian Church as a patriarchate; the disputed sees in the south went back to Constantinople.#!\n\nAn embassy from [SCOPE.sCharacter('oe_ecc_envoy').GetName] has come to Hagia Sophia with a letter from the [Concept('patriarch','patriarch')|e] of Peć: lift the anathema and recognise the patriarch of Peć and the [Concept('autocephalous_patriarchate','autocephalous church')|e] there. In return, the Greek sees that Dušan took will go back to Constantinople. The Turkish danger draws closer every year, and both sides need friends.[GetCountry('BYZ').Custom('OeEccAthosLine')][GetCountry('BYZ').Custom('OeEccUnionLine')]"
 oe_ecc.1.desc.b: "#F In 1375 Prince Lazar of Serbia sent Isaija, a monk of Mount Athos, to Constantinople. Patriarch Philotheos lifted the old anathema and recognised the Serbian Church as a patriarchate; the disputed sees in the south went back to Constantinople.#!\n\nConstantinople never proclaimed an anathema in those years, but it never recognised the [Concept('patriarch','patriarch')|e] of Peć either. Now an embassy from [SCOPE.sCharacter('oe_ecc_envoy').GetName] has come to Hagia Sophia with a letter from the patriarch of Peć: recognise the patriarch of Peć and the [Concept('autocephalous_patriarchate','autocephalous church')|e] there. In return, the Greek sees that Dušan took will go back to Constantinople. The Turkish danger draws closer every year, and both sides need friends.[GetCountry('BYZ').Custom('OeEccAthosLine')][GetCountry('BYZ').Custom('OeEccUnionLine')]"
 oe_ecc.1.a: "Recognise the patriarch of Peć"
 oe_ecc.1.a.tt: "The anathema on the Serbian Church, if any, is lifted, and the grudge with it\nWe and [SCOPE.sCountry('oe_ecc_pec_lord').GetName]: opinion of each other #G +50#!\n[oe_tu_authority|e] #G +3#! (#G +5#! if we welcomed Uglješa)\nWe gain [ShowModifier('oe_ecc_peace_of_churches')] for #Y 20#! years\nIf the hesychasts are strong: clergy satisfaction #G +10%#!\n[SCOPE.sCountry('oe_ecc_pec_lord').GetName]: prestige #Y +5#!"
 oe_ecc.1.b: "Demand that Peć step down to an archbishopric"
 oe_ecc.1.b.tt: "Costs #R 5#! [oe_tu_authority|e]\nThe [Concept('autocephalous_patriarchate','autocephalous church')|e] of Peć is dissolved; its Orthodox members come under the Ecumenical Patriarchate\nOur opinion of each country that comes in #Y +25#!\nWe gain [ShowModifier('oe_ecc_pec_returned')] for #Y 20#! years\n[SCOPE.sCountry('oe_ecc_pec_lord').GetName]: opinion of us #R −30#!\n[SCOPE.sCountry('oe_ecc_pec_lord').GetName]: stability #Y −7#!"
 oe_ecc.1.c: "Withhold recognition"
 oe_ecc.1.c.tt: "[SCOPE.sCountry('oe_ecc_pec_lord').GetName]: opinion of us #R −10#!\nThey may send envoys again in #Y 10#! years (once more only)"
 oe_ecc.1.d: "Withhold recognition"
 oe_ecc.1.d.tt: "[SCOPE.sCountry('oe_ecc_pec_lord').GetName]: opinion of us #R −10#!\nThe question of the Serbian Church is laid to rest"
 oe_ecc.2.t: "Vidin's Petition"
 oe_ecc.2.desc: "#F After Ivan Sratsimir set up a separate realm at Vidin, Vidin broke with Tarnovo and its see was placed under the patriarch of Constantinople. The sources disagree on the year: 1371 or 1381.#!\n\nEnvoys of [SCOPE.sCharacter('oe_ecc_vid_ruler').GetName] have come to Constantinople: the metropolitan of Vidin will no longer take orders from Tarnovo and asks to come under the [Concept('autocephalous_patriarchate','Ecumenical Patriarchate')|e]. Tarnovo is sure to protest."
 oe_ecc.2.a: "Receive the see of Vidin"
 oe_ecc.2.a.tt: "Vidin comes under the Ecumenical Patriarchate\nOur opinion of Vidin #Y +25#!\nVidin: opinion of us #G +30#!\nBulgaria: opinion of us #R −20#!"
 oe_ecc.2.b: "Decline, out of respect for Tarnovo"
 oe_ecc.2.b.tt: "Bulgaria: opinion of us #G +20#!"
 oe_ecc.3.t: "The Empty See of Tarnovo"
 oe_ecc.3.desc.a: "#F On 17 July 1393 Tarnovo fell after a three-month siege, and Patriarch Euthymius was exiled to Thrace. The next year the Holy Synod of Constantinople sent a metropolitan to Tarnovo. For nearly five hundred years after, the Bulgarian sees answered to the Ecumenical Patriarch.#!\n\nTarnovo has fallen to the Ottomans, and the throne of the Bulgarian [Concept('patriarch','patriarch')|e] stands empty. The Holy Synod asks: who now has charge of the Bulgarian sees?[GetCountry('BYZ').Custom('OeEccTarnovoLine')]"
 oe_ecc.3.desc.b: "#F On 17 July 1393 Tarnovo fell after a three-month siege, and Patriarch Euthymius was exiled to Thrace. The next year the Holy Synod of Constantinople sent a metropolitan to Tarnovo. For nearly five hundred years after, the Bulgarian sees answered to the Ecumenical Patriarch.#!\n\nTarnovo has fallen to [SCOPE.sCountry('oe_ecc_tarnovo_owner').GetName], and the throne of the Bulgarian [Concept('patriarch','patriarch')|e] stands empty. The Holy Synod asks: who now has charge of the Bulgarian sees?[GetCountry('BYZ').Custom('OeEccTarnovoLine')]"
 oe_ecc.3.a: "Send Greek bishops under the Holy Synod"
 oe_ecc.3.a.tt: "The [Concept('autocephalous_patriarchate','autocephalous church')|e] of Tarnovo, if it still stands, is merged into the Ecumenical Patriarchate and dissolved; the Orthodox Churches of Bulgaria and Vidin come under it\nOur opinion of each country that comes in #Y +25#!\n[oe_tu_authority|e] #G +3#!\nWe gain [ShowModifier('oe_ecc_greek_bishops')] for #Y 20#! years\nBulgaria: opinion of us #R −25#! (only #R −5#! if the hesychasts are strong)"
 oe_ecc.3.b: "Merge, but keep the Slavonic rite and letters"
 oe_ecc.3.b.tt: "The [Concept('autocephalous_patriarchate','autocephalous church')|e] of Tarnovo, if it still stands, is merged into the Ecumenical Patriarchate and dissolved; the Orthodox Churches of Bulgaria and Vidin come under it\nThe money pays for Slavonic scriptoria\nOur opinion of each country that comes in #Y +25#!\n[oe_tu_authority|e] #G +1#!\nWe gain [ShowModifier('oe_ecc_slavonic_rite')] for #Y 20#! years\nBulgaria: opinion of us #R −5#!"
 oe_ecc.3.c: "Let the see of Tarnovo stand"
 oe_ecc.3.c.tt: "The [Concept('autocephalous_patriarchate','autocephalous church')|e] of Tarnovo stays as it is\nBulgaria: opinion of us #G +20#!"
 oe_ecc.21.t: "The Three Parties of the Church"
 oe_ecc.21.desc: "#F The two councils of 1341 did not settle the hesychast controversy. In the civil war Patriarch John XIV Kalekas sided with the anti-Palamites and excommunicated Palamas in 1344; the quarrel ran on until the council at Blachernae in 1351.#!\n\nOur Church is now split into [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!, Rationalists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!, Unionists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!. Prevailing: [GetCountry('BYZ').Custom('OeEccDom')]. The [Concept('patriarch','patriarch')|e]'s party: [GetCountry('BYZ').Custom('OeEccPatF')]. The [Concept('oe_tu_patriarchate','patriarchal standing')|e] of the Ecumenical Patriarchate is #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_pres').GetValue|0]#!.\n\nThe shares change every January, moved by the patriarch's party, the rulings of councils and the emperor's choices. Hold a Holy Synod in the Pillars of the Empire to see these figures at any time."
 oe_ecc.21.a: "So be it"
 oe_ecc.22.t: "The Holy Synod"
 oe_ecc.22.desc: "#F The Holy Synod of Constantinople met under the patriarch, with the metropolitans and bishops near the capital. Emperors often sent their ministers and sometimes came in person; Andronikos III presided over the council that judged Barlaam in 1341.#!\n\nThe synod meets in Hagia Sophia. The [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!, Rationalists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!, Unionists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!; prevailing: [GetCountry('BYZ').Custom('OeEccDom')]. What shall the emperor put before it?"
 oe_ecc.22.a: "Affirm the hesychasts' teaching"
 oe_ecc.22.a.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +8#!, Rationalists #Y −4#!, Unionists #Y −4#!\nClergy satisfaction #G +5%#!"
 oe_ecc.22.b: "Side with the scholars"
 oe_ecc.22.b.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y −4#!, Rationalists #Y +8#!, Unionists #Y −4#!\nClergy satisfaction #R −5%#!"
 oe_ecc.22.c: "Prepare the way for talks of union"
 oe_ecc.22.c.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y −5#!, Rationalists #Y −3#!, Unionists #Y +8#!\nThe Papal States: opinion of us #G +15#!\nClergy satisfaction #R −5%#!"
 oe_ecc.22.d: "Keep to Church business"
 oe_ecc.22.d.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!"
 oe_ecc.30.t: "The Synod's Candidates"
 oe_ecc.30.desc.a: "#F In February 1347 a council deposed Patriarch John XIV Kalekas. That May the hesychast monk Isidore succeeded.#!\n\nKalekas has withdrawn to a monastery. The Holy Synod has put forward names for the succession, and the emperor must choose one. A patriarch not of the prevailing party will find the faithful against them."
 oe_ecc.30.desc.b: "#F In 1353 Patriarch Kallistos I would not crown Matthew Kantakouzenos and left the patriarchal throne; Philotheos, who followed, crowned Matthew the next year.#!\n\nThe [Concept('patriarch','patriarch')|e] who refused the crown has withdrawn to a monastery. The Holy Synod has put forward names for the succession, and the emperor must choose one. A patriarch not of the prevailing party will find the faithful against them."
 oe_ecc.30.desc.c: "The new ruler wants another [Concept('patriarch','patriarch')|e], and the old one has withdrawn to a monastery. The Holy Synod has put forward names for the succession, and the emperor must choose one. A patriarch not of the prevailing party will find the faithful against them."
 oe_ecc.30.desc.d: "The see is vacant: the [Concept('patriarch','patriarch')|e] has withdrawn to a monastery. The Holy Synod has put forward names for the succession, and the emperor must choose one. A patriarch not of the prevailing party will find the faithful against them."
 oe_ecc.30.a: "Choose [SCOPE.sCharacter('oe_ecc_c1').GetName], a monk of Mount Athos"
 oe_ecc.30.a.tt: "[SCOPE.sCharacter('oe_ecc_c1').GetName] becomes [Concept('patriarch','patriarch')|e], of the Hesychasts\nShares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +4#!\nIf another party prevails: costs #R 3#! [oe_tu_authority|e], and [ShowModifier('oe_ecc_pat_rift')] for #Y 5#! years"
 oe_ecc.30.b: "Choose [SCOPE.sCharacter('oe_ecc_c2').GetName], a scholar of the court"
 oe_ecc.30.b.tt: "[SCOPE.sCharacter('oe_ecc_c2').GetName] becomes [Concept('patriarch','patriarch')|e], of the Rationalists\nShares of the [Concept('oe_tu_church_parties','church parties')|e]: Rationalists #Y +4#!\nIf another party prevails: costs #R 3#! [oe_tu_authority|e], and [ShowModifier('oe_ecc_pat_rift')] for #Y 5#! years"
 oe_ecc.30.c: "Choose [SCOPE.sCharacter('oe_ecc_c3').GetName], a monk who knows the Latins"
 oe_ecc.30.c.tt: "[SCOPE.sCharacter('oe_ecc_c3').GetName] becomes [Concept('patriarch','patriarch')|e], of the Unionists\nShares of the [Concept('oe_tu_church_parties','church parties')|e]: Unionists #Y +4#!\nThe Papal States: opinion of us #G +15#!\nClergy satisfaction #R −5%#!\nIf another party prevails: costs #R 5#! [oe_tu_authority|e], and [ShowModifier('oe_ecc_pat_rift')] for #Y 5#! years"
 oe_ecc.32.t: "The New Ruler and the Patriarch"
 oe_ecc.32.desc.a: "#F In February 1347 John Kantakouzenos entered Constantinople. A long-time patron of Palamas, the new emperor brought a court on the hesychasts' side.#!\n\nA new ruler is on the throne. The [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], is of [GetCountry('BYZ').Custom('OeEccPatF')]; the new ruler prefers [GetCountry('BYZ').Custom('OeEccEmpF')]. Shall the patriarch be replaced?"
 oe_ecc.32.desc.b: "#F In 1376 Andronikos IV took the capital with Genoese and Turkish help, deposed Patriarch Philotheos and set up Makarios instead.#!\n\nA new ruler is on the throne. The [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], is of [GetCountry('BYZ').Custom('OeEccPatF')]; the new ruler prefers [GetCountry('BYZ').Custom('OeEccEmpF')]. Shall the patriarch be replaced?"
 oe_ecc.32.desc.c: "#F In 1379 John V was restored and deposed Makarios, the usurper's patriarch; Neilos succeeded the next year.#!\n\nA new ruler is on the throne. The [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], is of [GetCountry('BYZ').Custom('OeEccPatF')]; the new ruler prefers [GetCountry('BYZ').Custom('OeEccEmpF')]. Shall the patriarch be replaced?"
 oe_ecc.32.desc.d: "#F In 1390 John VII briefly seized the capital, and Makarios was patriarch again for a while.#!\n\nA new ruler is on the throne. The [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], is of [GetCountry('BYZ').Custom('OeEccPatF')]; the new ruler prefers [GetCountry('BYZ').Custom('OeEccEmpF')]. Shall the patriarch be replaced?"
 oe_ecc.32.desc.e: "#F In 1402, while Manuel II was in the West seeking help, John VII, left in charge of the capital, deposed Patriarch Matthew I; Matthew was restored when the emperor came back.#!\n\nThe emperor is away in the West. Those left in charge of the capital prefer [GetCountry('BYZ').Custom('OeEccEmpF')] and want to replace the [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName] ([GetCountry('BYZ').Custom('OeEccPatF')]). Shall the patriarch be replaced?"
 oe_ecc.32.desc.f: "#F At the end of 1354 John V took back Constantinople and Kantakouzenos became a monk. Early the next year Kallistos I returned as patriarch, and Philotheos, who had crowned Matthew, left office.#!\n\nA new ruler is on the throne. The [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], is of [GetCountry('BYZ').Custom('OeEccPatF')]; the new ruler prefers [GetCountry('BYZ').Custom('OeEccEmpF')]. Shall the patriarch be replaced?"
 oe_ecc.32.desc.g: "A new ruler is on the throne. The [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], is of [GetCountry('BYZ').Custom('OeEccPatF')]; the new ruler prefers [GetCountry('BYZ').Custom('OeEccEmpF')]. Shall the patriarch be replaced?"
 oe_ecc.32.a: "Replace the patriarch with one the new ruler favours"
 oe_ecc.32.a.tt: "Clergy satisfaction #R −5%#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −2#!\n[SCOPE.sCharacter('oe_ecc_pat').GetName] withdraws to a monastery; the synod puts forward names from the party the new ruler favours and from the largest party"
 oe_ecc.32.b: "Keep the patriarch"
 oe_ecc.32.b.tt: "Clergy satisfaction #G +5%#!"
 oe_ecc.33.t: "The Patriarch Refuses the Crown"
 oe_ecc.33.desc: "#F In 1353 John VI Kantakouzenos meant to make Matthew, the emperor's son, co-emperor. Patriarch Kallistos I would not crown Matthew and gave up the throne instead; the next year the new patriarch Philotheos crowned Matthew.#!\n\nWe have proclaimed Matthew co-emperor, but the [Concept('patriarch','patriarch')|e], [SCOPE.sCharacter('oe_ecc_pat').GetName], will not perform the coronation, saying the empire already has a lawful heir. A crown without the patriarch's blessing will be called ill-gotten."
 oe_ecc.33.a: "Depose the patriarch and find another to crown Matthew"
 oe_ecc.33.a.tt: "Clergy satisfaction #R −10%#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −3#!\n[SCOPE.sCharacter('oe_ecc_pat').GetName] withdraws to a monastery; the synod puts forward a name from each party (historically, Philotheos)"
 oe_ecc.33.b: "No coronation: proclaim it by decree"
 oe_ecc.33.b.tt: "Clergy satisfaction #G +5%#!"
 oe_ecc.40.t: "The Council of February 1347"
 oe_ecc.40.desc.a: "#F Early in February 1347 the empress Anna called a council that deposed the anti-Palamite Patriarch John XIV Kalekas; days later Kantakouzenos entered the capital, and another council cleared Palamas and excommunicated Akindynos.#!\n\nThe civil war is over; the hesychast controversy is not. The [Concept('patriarch','patriarch')|e] Kalekas still holds the see, and sided with the anti-Palamites in the war. The Holy Synod waits for the emperor's word."
 oe_ecc.40.desc.b: "#F Early in February 1347 the empress Anna called a council that deposed the anti-Palamite Patriarch John XIV Kalekas; days later Kantakouzenos entered the capital, and another council cleared Palamas and excommunicated Akindynos.#!\n\nThe civil war is over; the hesychast controversy is not. The sentence against Palamas still stands, and the Holy Synod waits for the emperor's word."
 oe_ecc.40.a: "Depose Kalekas and clear Palamas's name"
 oe_ecc.40.a.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +10#!, Rationalists #Y −8#!, Unionists #Y −2#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!\nClergy satisfaction #G +5%#!\nKalekas withdraws to a monastery; the synod puts forward a name from each party (historically, the hesychast Isidore)"
 oe_ecc.40.b: "Clear Palamas's name"
 oe_ecc.40.b.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +10#!, Rationalists #Y −8#!, Unionists #Y −2#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!\nClergy satisfaction #G +5%#!"
 oe_ecc.40.c: "The patriarch stays; the teaching is argued again"
 oe_ecc.40.c.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y −2#!, Rationalists #Y +5#!, Unionists #Y −3#!\nThe scholars' dispute goes on for #Y 10#! years"
 oe_ecc.41.t: "The Council at Blachernae"
 oe_ecc.41.desc: "#F At the end of May 1351 a council met in the Blachernae palace, declared Palamas's teaching Orthodox and excommunicated its opponents; its tomos went out to the churches.#!\n\nThe [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!, Rationalists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!, Unionists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!. The emperor may have the council settle the question, or leave both sides some room."
 oe_ecc.41.a: "Issue the tomos: Palamas's teaching is Orthodox"
 oe_ecc.41.a.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +12#!, Rationalists #Y −10#!, Unionists #Y −2#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +5#!\nWe gain [ShowModifier('oe_ecc_tomos')] for #Y 10#! years"
 oe_ecc.41.b: "Leave both sides some room"
 oe_ecc.41.b.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y −2#!, Rationalists #Y +4#!, Unionists #Y −2#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −2#!"
 oe_ecc.50.t: "The See of All Rus' Falls Vacant"
 oe_ecc.50.desc: "#F In March 1353 Theognostus, Metropolitan of Kiev and all Rus', died in Moscow. Moscow put forward the monk Alexius to succeed; Alexius went to Constantinople and was consecrated Metropolitan of Kiev and all Rus' in 1354.#!\n\nThe see of Rus' stands empty. Envoys of [SCOPE.sCountry('oe_ecc_rus_host').GetName] have come to Hagia Sophia with gifts and ask us to consecrate the candidate they put forward.[GetCountry('BYZ').Custom('OeEccAlexiusLine')]\n\nThe metropolitans of Rus' have always been consecrated in Constantinople, and many of them were Greeks. The Holy Synod waits for the emperor's word."
 oe_ecc.50.a: "Consecrate the candidate of [SCOPE.sCountry('oe_ecc_rus_host').GetName]"
 oe_ecc.50.a.tt: "[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +30#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!\nThe gold is the customary consecration fee"
 oe_ecc.50.b: "Send a Greek as metropolitan"
 oe_ecc.50.b.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +5#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −25#!"
 oe_ecc.50.c: "Keep them waiting and see who offers more"
 oe_ecc.50.c.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −5#!\nThe see of Rus': disputed for #Y 5#! years, then in our care again"
 oe_ecc.51.t: "Lithuania Asks for a Metropolitan of Its Own"
 oe_ecc.51.desc.a: "#F Grand Duke Algirdas of Lithuania ruled many Orthodox subjects and would not have them answer to a metropolitan in Moscow. Around 1355 Constantinople granted the request and consecrated Roman as Metropolitan of Lithuania; a synod of 1356 confirmed both Alexius and Roman, and in 1361 their sees were divided.#!\n\nThe envoys of [SCOPE.sCountry('oe_ecc_lit').GetName] are back: the Rus' subjects of their grand duke will not obey the metropolitan on the side of [SCOPE.sCountry('oe_ecc_rus_host').GetName], and they ask for a metropolitan of Lithuania. [SCOPE.sCountry('oe_ecc_rus_host').GetName] has already sent word that Rus' can have only one metropolitan."
 oe_ecc.51.desc.b: "#F Grand Duke Algirdas of Lithuania ruled many Orthodox subjects and would not have them answer to a metropolitan in Moscow. Around 1355 Constantinople granted the request and consecrated Roman as Metropolitan of Lithuania; a synod of 1356 confirmed both Alexius and Roman, and in 1361 their sees were divided.#!\n\nEnvoys of [SCOPE.sCountry('oe_ecc_lit').GetName] have arrived: the Rus' subjects of their grand duke will not obey the metropolitan on the side of [SCOPE.sCountry('oe_ecc_rus_host').GetName], and they ask for a metropolitan of Lithuania. [SCOPE.sCountry('oe_ecc_rus_host').GetName] has already sent word that Rus' can have only one metropolitan."
 oe_ecc.51.a: "Consecrate a metropolitan for Lithuania"
 oe_ecc.51.a.tt: "The see of Lithuania: in our care\n[SCOPE.sCountry('oe_ecc_lit').GetName]: opinion of us #G +30#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −25#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_ecc.51.b: "Rus' shall have one metropolitan"
 oe_ecc.51.b.tt: "[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +15#!\n[SCOPE.sCountry('oe_ecc_lit').GetName]: opinion of us #R −25#!"
 oe_ecc.51.c: "Take the gifts and give no answer yet"
 oe_ecc.51.c.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −3#!\nThey will come again in #Y 5#! years (once more only)"
 oe_ecc.52.t: "The Consecration of Cyprian"
 oe_ecc.52.desc: "#F On 2 December 1375 Patriarch Philotheos consecrated the monk Cyprian Metropolitan of Kiev, Rus' and Lithuania, on the understanding that Cyprian would succeed Alexius over all Rus'. Moscow was furious.#!\n\n[SCOPE.sCountry('oe_ecc_lit').GetName] asks for a metropolitan and puts forward a learned monk. The Holy Synod proposes to consecrate the monk Metropolitan of Kiev, Rus' and Lithuania, to succeed the present metropolitan of [SCOPE.sCountry('oe_ecc_rus_host').GetName] over all Rus' in time, so that the Church of Rus' is one again under one metropolitan. [SCOPE.sCountry('oe_ecc_rus_host').GetName] will not be pleased."
 oe_ecc.52.a: "Consecrate Cyprian"
 oe_ecc.52.a.tt: "The see of Lithuania: in our care\nThe new metropolitan is to succeed over all Rus' in time\n[SCOPE.sCountry('oe_ecc_lit').GetName]: opinion of us #G +30#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −25#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_ecc.52.b: "Refuse: the Church of Rus' shall not be divided"
 oe_ecc.52.b.tt: "[SCOPE.sCountry('oe_ecc_lit').GetName]: opinion of us #R −25#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +15#!"
 oe_ecc.53.t: "Moscow's Candidate"
 oe_ecc.53.desc: "#F When Alexius died, Grand Prince Dmitry of Moscow would not accept Cyprian and sent a favourite, Mityai, to be consecrated in Constantinople; Mityai died outside the city in 1379. Pimen, of the same party, was consecrated in 1380, reportedly on forged letters. For ten years after, Rus' had two or three metropolitans at once.#!\n\nThe metropolitan of [SCOPE.sCountry('oe_ecc_rus_host').GetName] has died. By the agreement Cyprian should now succeed over all Rus'; but [SCOPE.sCountry('oe_ecc_rus_host').GetName] has sent an embassy to ask that its own candidate be consecrated, and the envoys have borrowed heavily in the city in their grand prince's name."
 oe_ecc.53.a: "Stand by Cyprian"
 oe_ecc.53.a.tt: "The see of Rus': disputed\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −25#!\nLithuania: opinion of us #G +10#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_ecc.53.b: "Recognise the candidate of [SCOPE.sCountry('oe_ecc_rus_host').GetName]"
 oe_ecc.53.b.tt: "The see of Rus': in our care\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +30#!\nLithuania: opinion of us #R −25#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −5#!\nThe gold is what their envoys borrowed in the grand prince's name"
 oe_ecc.53.c: "Recognise both"
 oe_ecc.53.c.tt: "The see of Rus': disputed\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −8#!"
 oe_ecc.54.t: "One Metropolitan for All Rus'"
 oe_ecc.54.desc: "#F In February 1389 Patriarch Antony IV held a synod that recognised Cyprian as the one Metropolitan of all Rus'; the next year Grand Prince Vasily I of Moscow received Cyprian.#!\n\nTwo metropolitans have contended over Rus' for years, and the bishops there do not know whom to obey. The Holy Synod asks the emperor to decide: which one shall be the one Metropolitan of all Rus'?"
 oe_ecc.54.a: "Hold a synod and recognise Cyprian over all Rus'"
 oe_ecc.54.a.tt: "The see of Rus': in our care\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +5#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −10#!\nLithuania: opinion of us #G +10#!"
 oe_ecc.54.b: "Side with [SCOPE.sCountry('oe_ecc_rus_host').GetName]"
 oe_ecc.54.b.tt: "The see of Rus': in our care\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +15#!\nLithuania: opinion of us #R −25#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −3#!"
 oe_ecc.55.t: "The Emperor's Name in the Liturgy"
 oe_ecc.55.desc: "#F Around 1393 Grand Prince Vasily I of Moscow had the emperor's name dropped from the prayers of the liturgy, saying that Rus' had a Church but no emperor. Patriarch Antony IV wrote back that Christians cannot have the Church and not have the emperor.#!\n\nWord comes from Rus': in the churches of [SCOPE.sCountry('oe_ecc_rus_host').GetName] the emperor is no longer named in the prayers. The Holy Synod asks whether the patriarch should write and make the matter plain."
 oe_ecc.55.a: "The patriarch writes: the Church cannot be without the emperor"
 oe_ecc.55.a.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −10#!"
 oe_ecc.55.b: "Let it pass"
 oe_ecc.55.b.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −5#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +10#!\nAlms asked of Rus' later bring only #Y 75%#!"
 oe_ecc.56.t: "Vytautas's Metropolitan"
 oe_ecc.56.desc: "#F In 1414 or 1415 Grand Duke Vytautas of Lithuania had the Orthodox bishops of the grand duchy elect Gregory Tsamblak metropolitan by themselves. Patriarch Euthymius II deposed and excommunicated Tsamblak, who died around 1420.#!\n\nThe bishops of [SCOPE.sCountry('oe_ecc_lit').GetName] did not wait for Constantinople and elected a metropolitan themselves; the grand duke asks us to confirm the choice. [SCOPE.sCountry('oe_ecc_rus_host').GetName] has already protested."
 oe_ecc.56.a: "Depose and excommunicate the self-made metropolitan"
 oe_ecc.56.a.tt: "The see of Lithuania: broken away for #Y 6#! years, then in our care again\n[SCOPE.sCountry('oe_ecc_lit').GetName]: opinion of us #R −50#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +10#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_ecc.56.b: "Confirm the choice after the fact"
 oe_ecc.56.b.tt: "The see of Lithuania: in our care\n[SCOPE.sCountry('oe_ecc_lit').GetName]: opinion of us #G +30#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −25#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −5#!"
 oe_ecc.57.t: "Who Goes to Rus'"
 oe_ecc.57.desc: "#F In 1436 Jonah, the candidate of the bishops of Rus', came to Constantinople, but Patriarch Joseph II had already chosen the Greek Isidore. Isidore reached Moscow in 1437 and in September left for Italy and the council on union with Rome.#!\n\nThe see of Rus' is vacant again. The candidate of [SCOPE.sCountry('oe_ecc_rus_host').GetName] waits in the city; but those who would unite with Rome have other plans: send Rus' a metropolitan who knows the Latins and favours union, and the Church of Rus' will follow. The [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_hes').GetValue|0]%#!, Rationalists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_rat').GetValue|0]%#!, Unionists #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_uni').GetValue|0]%#!."
 oe_ecc.57.a: "Send Isidore, a Unionist"
 oe_ecc.57.a.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Unionists #Y +3#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #R −25#!\nHow Rus' takes a union with Rome will depend on Isidore"
 oe_ecc.57.b: "Consecrate Jonah, the choice of Rus'"
 oe_ecc.57.b.tt: "Shares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +2#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName]: opinion of us #G +30#!"
 oe_ecc.60.t: "A Metropolitan for Wallachia"
 oe_ecc.60.desc.a: "#F In 1359 Patriarch Kallistos I set up the Metropolis of Ungrovlachia: Hyacinth, formerly Metropolitan of Vicina, moved to Argeș, the seat of the Wallachian prince, as its first metropolitan.#!\n\nThe prince of [SCOPE.sCountry('oe_ecc_wal').GetName] has sent envoys again. Vicina on the lower Danube lies deserted, and Hyacinth, its metropolitan, is willing to move to Wallachia. The prince asks for a metropolis of Wallachia's own, under the Ecumenical Patriarch."
 oe_ecc.60.desc.b: "#F In 1359 Patriarch Kallistos I set up the Metropolis of Ungrovlachia: Hyacinth, formerly Metropolitan of Vicina, moved to Argeș, the seat of the Wallachian prince, as its first metropolitan.#!\n\nThe prince of [SCOPE.sCountry('oe_ecc_wal').GetName] has sent envoys to Constantinople. Vicina on the lower Danube lies deserted, and Hyacinth, its metropolitan, is willing to move to Wallachia. The prince asks for a metropolis of Wallachia's own, under the Ecumenical Patriarch."
 oe_ecc.60.a: "Recognise Hyacinth as Metropolitan of Ungrovlachia"
 oe_ecc.60.a.tt: "The see of Wallachia: in our care\n[SCOPE.sCountry('oe_ecc_wal').GetName]: opinion of us #G +30#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!"
 oe_ecc.60.b: "Let them wait"
 oe_ecc.60.b.tt: "[SCOPE.sCountry('oe_ecc_wal').GetName]: opinion of us #R −25#!\nThey will come again in #Y 3#! years (once more only)"
 oe_ecc.60.c: "Refuse again"
 oe_ecc.60.c.tt: "[SCOPE.sCountry('oe_ecc_wal').GetName]: opinion of us #R −25#!\nThe metropolis of Wallachia will not be raised again"
 oe_ecc.61.t: "Joseph of Moldavia"
 oe_ecc.61.desc: "#F Around 1386 Moldavia made Joseph Mușat its metropolitan on its own. Constantinople would not recognise Joseph and sent a Greek, Jeremiah, whom the Moldavians drove out; Constantinople then excommunicated Moldavia.#!\n\nEnvoys of [SCOPE.sCountry('oe_ecc_mol').GetName] have come to Constantinople and ask us to recognise Joseph, the metropolitan their land chose for itself. Joseph was never consecrated by the Ecumenical Patriarch; to accept Joseph would set a precedent."
 oe_ecc.61.a: "Recognise Joseph, Moldavia's own choice"
 oe_ecc.61.a.tt: "The see of Moldavia: in our care\n[SCOPE.sCountry('oe_ecc_mol').GetName]: opinion of us #G +30#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −2#! (a precedent is set)"
 oe_ecc.61.b: "Send the Greek Jeremiah instead"
 oe_ecc.61.b.tt: "The see of Moldavia: disputed\n[SCOPE.sCountry('oe_ecc_mol').GetName]: opinion of us #R −25#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +1#!"
 oe_ecc.62.t: "Peace with the Moldavian Church"
 oe_ecc.62.desc: "#F In 1401 the Holy Synod of Constantinople lifted the excommunication of Moldavia and recognised Joseph Mușat as Metropolitan of Moldavia.#!\n\nYears of dispute with the Church of [SCOPE.sCountry('oe_ecc_mol').GetName] have changed nothing: its people still obey only Joseph. The Turks draw closer every year, and the Holy Synod asks whether it is time to make peace."
 oe_ecc.62.a: "Lift the excommunication and recognise Joseph"
 oe_ecc.62.a.tt: "The see of Moldavia: in our care\nWe and [SCOPE.sCountry('oe_ecc_mol').GetName]: opinion of each other #G +50#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +3#!"
 oe_ecc.62.b: "Keep the excommunication"
 oe_ecc.62.b.tt: "The see of Moldavia: broken away\n[SCOPE.sCountry('oe_ecc_mol').GetName]: opinion of us #R −50#!\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −3#!"
 oe_ecc.80.t: "An Appeal to Rus'"
 oe_ecc.80.desc: "#F In 1398, with the City four years under blockade, Manuel II and the patriarch wrote to Moscow for help. Moscow sent no soldiers, but Metropolitan Cyprian collected alms for Constantinople throughout Rus', and the grand prince and the people both gave.#!\n\nOttoman camps ring the walls, and the City's grain and money run low. Some propose that the patriarch write to the metropolitan of Rus' and ask for alms for Constantinople throughout [SCOPE.sCountry('oe_ecc_rus_host').GetName]. At its present [Concept('oe_tu_patriarchate','patriarchal standing')|e] the patriarchate might raise about #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ecc_alms_value')|0]#! gold."
 oe_ecc.80.a: "The patriarch writes to the metropolitan of Rus' for alms"
 oe_ecc.80.a.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #R −1#!\n[SCOPE.sCountry('oe_ecc_rus_host').GetName] decides what to give; the silver arrives in about #Y 3#! months"
 oe_ecc.80.b: "Ask nothing of the north"
 oe_ecc.81.t: "A Letter from Constantinople"
 oe_ecc.81.desc: "#F Around 1398 the emperor and the patriarch of Constantinople appealed to Moscow for help. Moscow sent no soldiers, but Metropolitan Cyprian collected alms for Constantinople throughout Rus'.#!\n\nA letter has come from the patriarch of Constantinople: the City has been blockaded by the Ottomans for years, and the emperor asks the Orthodox of Rus' for help: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_v').GetValue|0]#! gold. Our metropolitan is ready to collect alms across our lands and waits for our word."
 oe_ecc.81.a: "Give generously"
 oe_ecc.81.a.tt: "We give half and the clergy and people of our lands the rest; Constantinople receives #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_v').GetValue|0]#! gold"
 oe_ecc.81.b: "Send a token sum"
 oe_ecc.81.b.tt: "Constantinople receives #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_ecc_alms_half')|0]#! gold"
 oe_ecc.81.c: "Plead the distance"
 oe_ecc.81.c.tt: "Constantinople receives nothing\nConstantinople's [Concept('oe_tu_patriarchate','patriarchal standing')|e] #Y −2#!"
 oe_ecc.82.t: "Silver from the North"
 oe_ecc.82.desc.a: "#F Between 1398 and 1400 the clergy and people of Rus' gave silver for Constantinople; accounts of the sum differ.#!\n\nThe silver from [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_from').GetCountry.GetName] has arrived: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_got').GetValue|0]#! gold in all. The metropolitan writes that the grand prince and the clergy and people everywhere have given."
 oe_ecc.82.desc.b: "The answer from [GetCountry('BYZ').MakeScope.GetVariable('oe_ecc_alms_from').GetCountry.GetName] has come: the road is long, and they cannot help."
 oe_ecc.82.a: "Thank the grand prince in the emperor's name"
 oe_ecc.82.b: "No help will come from the north"
