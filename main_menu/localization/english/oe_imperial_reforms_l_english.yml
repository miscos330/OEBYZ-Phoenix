l_english:
 OE_PILLARS_REFORMS: "Imperial Reforms"
 OE_PILLARS_REFORMS_DESC: "Lasting institutions for a reborn empire. Review each reform's requirements, Authority cost and completion status."
 OE_IR_PENDING: "Not Yet Completed"
 OE_IR_COMPLETE: "Reform Completed"
 OE_IR_NOT_DONE: "This imperial reform has not yet been completed"
 OE_IR_OWNS_EAST: "Directly own every ownable land location in the Egypt and Anatolia regions and the Levant area."
 OE_IR_ARMY_PROGRESS: "Army Reform Progress: #Y [GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_ir_army_progress')|0]#!"
 OE_IR_SCORE_RULES: "When territory changes hands, taking a town grants #G +1#!, a city #G +2#! and a metropolis #G +3#!; winning a land battle grants #G +1#!, or #G +2#! in total if the ruler commands it personally; winning a war grants #G +3#!. Investment in armaments still grants #G 2 / 3 / 5#! points according to the chosen option. The existing rules also remain: #G +1#! each new year, #R -1#! when the ruler loses a battle, #R -10#! for losing a war, and #R -1#! when insulted. The three cumulative upgrade thresholds are #Y 100 / 500 / 3000#! points.\n\nEach successful expansion order for the three military academies adds #G 100#! points."
 oe_ir_central_modifier: "Centralization"
 oe_ir_artillery_modifier: "Imperial Artillery Organization"
 oe_ir_sea_modifier: "Our Sea"
 oe_ir_faith_modifier: "Spreading Orthodoxy"
 oe_ir_law_modifier: "Roman Law"
 oe_byz_veteran_army: "A Battle-Hardened Army"
 oe_byz_veteran_army_desc: "Long campaigns and sustained training have given the imperial army a dependable officer corps and a regular system of drill. The experience of veterans no longer disappears upon retirement; it passes to the next generation entering the barracks."
 oe_byz_phoenix_army: "The Invincible Phoenix"
 oe_byz_phoenix_army_desc: "Victory rests upon the accumulated experience of generations of soldiers. Thorough training, reliable supplies and officers capable of independent judgment allow the army beneath the phoenix banner to seize its opportunities and safeguard Rome's hard-won revival."
 oe_ir_offices: "Reorganize the Administration"
 oe_ir_offices_desc: "An emperor's edict should travel beyond the palace gates. Clarify the duties of provincial officials and recover the powers of appointment and taxation seized by local magnates, so that the administration answers to the throne once more.\n\nThe current ruler must have reigned for #Y more than ten years#!. Upgrades #Y Decayed Hierarchy#! to #Y Restored Hierarchy#! upon completion. Removes and hides #Y Local Magnates#!; monthly Authority #G +0.05#! and monthly Public Opinion #G +0.05#!.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost."
 OE_IR_AUTHORITY_50: "The Pillars of the Empire have at least #Y 50#! Authority"
 oe_ir_central: "Centralization"
 oe_ir_central_desc: "One set of institutions will bind together the empire's tax registers, courts and military commands. Only when no estate can monopolize government will the emperor be free to gather its scattered powers back into his hands.\n\nRequires #Y Reorganize the Administration#! and every estate other than the Crown must have influence below #Y 40%#!. Permanently grants Crown Power #G +10%#! and Tax Efficiency #G +5%#!.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\nUnlocks #Y Honorary Nobility#!, #Y East Roman Bureaucracy#! and #Y The Logothetes#!."
 oe_ir_expel: "Expel Foreign Powers"
 oe_ir_expel_desc: "From the castles of the Morea to the harbors of the Marmara, Rome's heartlands must return to imperial government. Foreign merchants' privileges will no longer place them above local guilds.\n\nRequires direct ownership of every location in #Y Morea, the Aegean Islands, Northern Greece, Western Anatolia and Marmara#!. Removes and hides #Y Latin Competition#!. Removes the #Y Galata Tower and Venetian Quarter#! in Constantinople, and permits expansion of the #Y New Galata Quarter and New Venetian Quarter#!.\n\nCosts #Y 20 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\nUnlocks the #Y Gold and Silver Control Act#! in Precious Metal Distribution.\n\nUnlocks #Y Build an Imperial Naval Base#! in the Mediterranean panel of Imperial Works, with an initial allowance of five projects."
 OE_IR_AUTHORITY_20: "The Pillars of the Empire have at least #Y 20#! Authority"
 oe_ir_guilds: "State Guilds"
 oe_ir_guilds_desc: "Inspect workshops, standardize their charters and place supplies, wages and quality under imperial supervision. The guilds remain in the hands of their craftsmen, but must take responsibility for the empire's prosperity.\n\nRequires #Y Expel Foreign Powers#!. Increases the Raw Material Output and Production Efficiency bonuses of the #Y State Monopoly Guilds#! privilege from #Y 2.5%#! each to #G 5%#! each and allows #G Burghers to build Resource Gathering Operations#!. The privilege must actually be held to receive these upgraded benefits.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\nUnlocks and immediately enacts #Y State Guild Control#! in Mining Law, and unlocks the #Y Revised Book of the Eparch#! in Burgher Rights."
 oe_ir_east: "Command the Eastern Trade"
 oe_ir_east_desc: "The grain ships of the Nile, the warehouses of the Levant and the trade routes of Anatolia at last fall under one system of customs and naval protection. The empire can once again determine how eastern goods reach the Mediterranean.\n\nRequires direct ownership of every ownable land location in the #Y Egypt and Anatolia regions and the Levant area#!. Lakes, impassable locations and non-ownable connectors are excluded; subject ownership does not count. Unlocks the #Y Eastern Entrepot Rights#! privilege.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\nGain permanent #Y Monopoly on Eastern Trade#!: maximum tariff #G +10%#!, import efficiency #G +2%#! and export efficiency #G +2%#!."
 oe_ir_army_1: "Army Reform I · The Roman Army Reborn"
 oe_ir_army_1_desc: "Muster rolls, pay and training are brought together once more. Rome can finally rely on an army maintained by the state, rather than entrusting every war to hastily hired mercenaries.\n\nRequires #Y 100#! cumulative Army Reform points. Replaces #Y Dependence on Mercenaries#! with #Y The Roman Army Reborn#!. Upgrading does not spend progress points.\n\nCosts #Y 20 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\n$OE_IR_ARMY_PROGRESS$\n$OE_IR_SCORE_RULES$\n\nLevy Size #R −90%#!. This restriction remains in effect throughout the army reform progression.\n\nHetaireia upgrade: retain 10% reduction to both damage types; gain #G +5#! initiative and #G +5%#! strength damage dealt."
 oe_ir_army_2: "Army Reform II · A Battle-Hardened Army"
 oe_ir_army_2_desc: "Victories and defeats no longer survive only in the memories of generals. Battle reports become lessons and veterans train recruits, making hard-earned experience a common standard throughout the army.\n\nRequires #Y Army Reform I#! and #Y 500#! cumulative points. Replaces the preceding reform with #Y A Battle-Hardened Army#!: Drill #G +5%#!, Tactics #G +0.1#!, Government Reform Capacity #G +1#!, and monthly movement toward Quality #G +0.1#!. Upgrading does not spend progress points.\n\nCosts #Y 20 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\n$OE_IR_ARMY_PROGRESS$\n$OE_IR_SCORE_RULES$\n\nLevy Size #R −90%#!. This restriction remains in effect throughout the army reform progression.\n\nHetaireia gain an additional #G +15%#! strength damage dealt. Unlock the Enact the Rum Pronoia System military edict.\n\nUnlocks the original Byzantine #Y $byz_tagmata_policy_upgraded$#! policy under $recruitment_law$. The policy may then be enacted separately."
 oe_ir_army_3: "Army Reform III · The Invincible Phoenix"
 oe_ir_army_3_desc: "The phoenix belongs not only to the banners, but to every institution that sustains the army. Officers know when to act and soldiers trust the comrades beside them. At last, the empire possesses an army capable of shaping the course of a war.\n\nRequires #Y Army Reform II#! and #Y 3000#! cumulative points. Replaces the preceding reform with #Y The Invincible Phoenix#!: Drill #G +10%#!, Tactics #G +0.1#!, Initiative #G +20%#!, War Score Efficiency #G +50%#!, Heavy Cavalry Combat Ability #G +20%#!, Artillery Combat Ability #G +20%#!, Government Reform Capacity #G +1#!, and monthly movement toward Quality #G +0.1#!. Upgrading does not spend progress points.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\n$OE_IR_ARMY_PROGRESS$\n$OE_IR_SCORE_RULES$\n\nLevy Size #R −90%#!. This restriction remains in effect throughout the army reform progression.\n\nHetaireia gain military bands and medical corps together: #G +20%#! morale damage dealt, #G +0.2#! movement speed, and another #G -10%#! to both strength and morale damage taken.\n\nExpected rivals #G -4#!."
 oe_ir_artillery: "Expand the Use of Artillery"
 oe_ir_artillery_desc: "Casting guns, preparing powder and arranging transport can no longer be separate endeavors. The empire will establish common artillery standards, train gunners and make siege firepower a permanent part of its army.\n\nRequires #Y Army Reform I#!. Permanently grants Artillery Combat Ability #G +10%#! and Artillery Bonus against Forts #G +1#!.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\n$OE_REFORM_SIEGERS_UPGRADE_TT$"
 oe_ir_sea: "Our Sea"
 oe_ir_sea_desc: "Ports renew their ties and shipyards return to work. Crewed by sailors who know the islands, straits and coastal passages, the imperial galley fleets will once more protect the sea we share.\n\nRequires #Y Expel Foreign Powers#!. Permanently grants Galley Combat Ability #G +20%#!.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost.\n\nUnlocks #Y Rhodian Sea Law#! policies under Maritime Law and Piracy Law.\n\nRaises the total allowance for #Y Build an Imperial Naval Base#! to ten projects and opens additional western Mediterranean sites."
 oe_ir_faith: "Spread Orthodoxy"
 oe_ir_faith_desc: "Repair churches, train priests in local languages and provide new parishes with books and support. The spread of faith depends on patient pastoral care, not an edict alone.\n\nRequires #Y Centralization#!. Permanently grants Pop Religious Conversion Speed #G +25%#!.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost."
 oe_ir_law: "Roman Law"
 oe_ir_law_desc: "From emperor to provincial official, from magnate to ordinary subject, disputes and judgments should follow laws that can be consulted and understood. A common system of justice gives imperial authority a firmer foundation.\n\nRequires #Y Centralization#!. Permanently grants All Estates' Satisfaction Equilibrium #G +2.5%#! and Crown Power #G +10%#!.\n\nCosts #Y 50 Authority#!. Each reform may be completed once. No Privy Purse or Public Opinion cost."
 OE_IR_GOVERNMENT_GROUP: "Imperial Authority and Law"
 OE_IR_ECONOMY_GROUP: "Territory and Industry"
 OE_IR_ARMY_GROUP: "Army and Navy"
 OE_IR_NON_CROWN_POWER_LOW: "Every estate other than the Crown has influence below #Y 40%#!."
