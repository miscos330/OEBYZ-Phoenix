 oe_hetaireia_elite_selection: "Hetaireia: Elite Selection"
 oe_hetaireia_elite_selection_desc: "Reserve the limited ranks for men suited to hold the line. Rigorous tests of fitness, discipline and cooperation turn the Hetaireia into dependable elite infantry.\n\nHetaireia heavy infantry additionally receive #G -5%#! strength damage taken and #G -5%#! morale damage taken."
 oe_hi_grant_elite_selection: "Hetaireia Privilege Update: Elite Selection"
 oe_hi_revoke_elite_selection: "Hetaireia Privilege Update: Elite Selection"
 oe_hetaireia_cultural_education: "Hetaireia: Cultural Education"
 oe_hetaireia_cultural_education_desc: "A Hetaireia soldier must learn more than the use of shield and sword. Greek and Latin reveal the laws of the empire; music and mathematics teach order and calculation; practical military study tests that learning in the field.\n\nHetaireia heavy infantry additionally receive #G +5#! initiative and #G +5%#! strength damage dealt."
 oe_hi_grant_cultural_education: "Hetaireia Privilege Update: Cultural Education"
 oe_hi_revoke_cultural_education: "Hetaireia Privilege Update: Cultural Education"
 oe_hetaireia_path_to_glory: "Hetaireia: Path to Glory"
 oe_hetaireia_path_to_glory_desc: "Let service and learning open the doors of the imperial cabinet. Selected and educated Hetaireia veterans may serve the emperor in council as well as lead their comrades beneath his standards.\n\nHetaireia heavy infantry additionally receive #G +15%#! strength damage dealt."
 oe_hi_grant_path_to_glory: "Hetaireia Privilege Update: Path to Glory"
 oe_hi_revoke_path_to_glory: "Hetaireia Privilege Update: Path to Glory"
 oe_hetaireia_military_band: "Hetaireia: Military Band"
 oe_hetaireia_military_band_desc: "Horns relay orders and drums keep the marching step. Regimental musicians coordinate movement, sustain courage in battle and carry imperial music through the garrison towns.\n\nHetaireia heavy infantry additionally receive #G +20%#! morale damage dealt and #G +0.2#! movement speed."
 oe_hi_grant_military_band: "Hetaireia Privilege Update: Military Band"
 oe_hi_revoke_military_band: "Hetaireia Privilege Update: Military Band"
 oe_hetaireia_medical_corps: "Hetaireia: Medical Corps"
 oe_hetaireia_medical_corps_desc: "Attach physicians, stretcher bearers and medicine chests to the ranks. Prompt treatment saves lives and assures soldiers that their wounded comrades will not be abandoned.\n\nHetaireia heavy infantry additionally receive #G -10%#! strength damage taken and #G -10%#! morale damage taken."
 oe_hi_grant_medical_corps: "Hetaireia Privilege Update: Medical Corps"
 oe_hi_revoke_medical_corps: "Hetaireia Privilege Update: Medical Corps"
