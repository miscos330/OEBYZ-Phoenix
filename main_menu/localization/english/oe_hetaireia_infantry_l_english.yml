l_english:
 OE_HI_BARRACKS_LIMIT: "Hetaireia Barracks"
 OE_HI_CAP_TT: "The total number of Hetaireia heavy infantry is below the limit provided by completed barracks. All eras and Army Reform tiers share this limit."
 OE_HI_REFRESH_TT: "Update Hetaireia heavy infantry to match completed Army Reforms, including existing regiments."
 oe_hetaireia_infantry_1_t0b0m0: "Hetaireia Heavy Infantry"
 oe_hetaireia_infantry_1_t0b0m0_desc: "Drawn from the imperial barracks, the Hetaireia defend the emperor's standards with close formations and firm discipline. Each completed Hetaireia Barracks provides one regiment slot, shared by all generations."
 oe_hetaireia_infantry_1_t1b0m0: "Hetaireia Heavy Infantry"
 oe_hetaireia_infantry_1_t1b0m0_desc: "Drawn from the imperial barracks, the Hetaireia defend the emperor's standards with close formations and firm discipline. Each completed Hetaireia Barracks provides one regiment slot, shared by all generations. The soldiers undergo elite selection.\n\nCurrent upgrade tier: Basic Organisation"
 oe_hetaireia_infantry_1_t2b0m0: "Hetaireia Heavy Infantry"
 oe_hetaireia_infantry_1_t2b0m0_desc: "Drawn from the imperial barracks, the Hetaireia defend the emperor's standards with close formations and firm discipline. Each completed Hetaireia Barracks provides one regiment slot, shared by all generations. The soldiers undergo elite selection. Their education encompasses Greek, Latin, music, mathematics and practical warfare.\n\nCurrent upgrade tier: Army Reform I"
