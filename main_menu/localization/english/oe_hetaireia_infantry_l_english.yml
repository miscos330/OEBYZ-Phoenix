 oe_optimatoi_1: "Optimatoi"
 oe_optimatoi_1_desc: "An army can march only as far as its supplies can follow. The Optimatoi organise pack animals, wagons and provisions to carry the stores of the empire to its frontiers. Food storage per strength increases by 1000, movement speed by 1, and strength damage taken falls by 10%. There is no special regiment limit."
