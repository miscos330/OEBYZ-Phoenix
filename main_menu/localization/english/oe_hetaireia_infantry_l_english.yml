 oe_hetaireia_infantry_1_t3b1m0: "Hetaireia Heavy Infantry"
 oe_hetaireia_infantry_1_t3b1m0_desc: "Drawn from the imperial barracks, the Hetaireia defend the emperor's standards with close formations and firm discipline. Each completed Hetaireia Barracks provides one regiment slot, shared by all generations. The soldiers undergo elite selection. Their education encompasses Greek, Latin, music, mathematics and practical warfare. A military band coordinates marches and advances."
