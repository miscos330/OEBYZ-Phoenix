 STATIC_MODIFIER_DESC_oe_bal2_crown_bicephalum_mod:0 "Old and New Rome stand reunited across the ocean, crowning a transoceanic Imperium Bicephalum of enduring prestige and loyal exarchs."
 STATIC_MODIFIER_NAME_oe_bal2_crown_eight_duhu_mod:0 "Capstone Crown: Celestial Eight-Direction Protectorates"
 STATIC_MODIFIER_DESC_oe_bal2_crown_eight_duhu_mod:0 "Eight Grand Protectorates span the cardinal seas and continents as myriad envoys pay tribute to an unbroken Celestial apex."
