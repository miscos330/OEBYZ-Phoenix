 oe_bal2.1.title:0 "1836 Cross-Wave Capstone Ceremony: [ROOT.GetCountry.Custom('OeBal2CapstoneTitle')]"
 oe_bal2.1.desc_header:0 "#T Five-Century Cross-Wave Grand Finale (1337–1836)#!\n#T Capstone Crown Conferred#!: [ROOT.GetCountry.Custom('OeBal2CapstoneTitle')]\n#T Collector Milestones#!: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_chr_col_milestone_count')|0]#! / #Y 22#!  |  #T Apex Seal#!: [ROOT.GetCountry.Custom('OeChrColApexSeal')]\n\n"
 oe_bal2.1.desc_bicephalum:0 "From the Elysian exodus across uncharted waters to the grand reunion of Old and New Rome, the double-headed eagle now spans both hemispheres. Senate and Exarchates alike acclaim the Crown of the Imperium Bicephalum."
 oe_bal2.1.desc_eight_duhu:0 "Eight Grand Protectorates anchor five continents while treasure fleets and myriad envoys converge upon the imperial court. The historiographers confer the Crown of the Celestial Eight-Direction Protectorates."
 oe_bal2.1.desc_republic:0 "Enlightenment presses, African and American renaissance axes, and the Grand Concert converge across ninety-eight completed historical threads into the Republic of All Nations. Its crown seals a universal modern dawn."
 oe_bal2.1.desc_standard:0 "Across five centuries of plague, oceanic expansion, climate crisis, industrial rise, and continental reckoning, the realm endures unbroken—its roads, masterworks, and reforms sealed forever in living history."
 oe_bal2.1.a:0 "Accept the Capstone Crown in Eternal Memory"
