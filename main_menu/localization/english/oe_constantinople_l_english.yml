l_english:
 OE_CITY_TAB: "Constantinople"
 OE_CITY_TAB_DESC: "Inspect the buildings of each district on the city map and plan new construction."
 OE_CITY_MAP_HINT: "Click a district on the map to view its special buildings and construction options."
 OE_CITY_BUILT: "Existing Buildings"
 OE_CITY_BUILDABLE: "Capital Expansion"
 OE_CITY_ADD: "+  Expand"
 OE_CITY_CLOSE: "Close"
 OE_CITY_BUILD: "Build"
 OE_CITY_NATIVE_BUILD: "Review construction costs and completion times, then commission the work. Only the owner of Constantinople holding #Y Roman Legitimacy#! may issue the order."
 OE_CITY_LEVELS: "Completed [GuiScope.SetRoot(GetLocationByKey('constantinople').MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_completed_levels')|0]  ·  Under Construction [GuiScope.SetRoot(GetLocationByKey('constantinople').MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_queued_levels')|0]"
 OE_CITY_OWNER: "City Owner: [GetLocationByKey('constantinople').GetOwner.GetName]"
 OE_CITY_WALLS: "Walls and Golden Gate"
 OE_CITY_WALLS_DESC: "The land walls and triumphal gate protect the western approaches to the capital."
 OE_CITY_BLACHERNAE: "Blachernae"
 OE_CITY_BLACHERNAE_DESC: "Palaces and government offices at the western end of the Golden Horn."
 OE_CITY_APOSTLES: "Holy Apostles District"
 OE_CITY_APOSTLES_DESC: "Churches, monasteries and waterworks surround the Church of the Holy Apostles."
 OE_CITY_MESE: "The Mese"
 OE_CITY_MESE_DESC: "The capital's main avenue links its squares, schools and workshops."
 OE_CITY_EAST: "Eastern Ceremonial Center"
 OE_CITY_EAST_DESC: "The ceremonial heart of the city, home to Hagia Sophia, the Hippodrome and the old imperial palace."
 OE_CITY_HORN: "Golden Horn Harbors"
 OE_CITY_HORN_DESC: "Trading quarters, warehouses and quays along the southern shore of the Golden Horn."
 OE_CITY_SOUTH: "Southern Harbors"
 OE_CITY_SOUTH_DESC: "Ports, shipyards and civic facilities facing the Sea of Marmara."
 OE_CITY_NORTH: "Northern Shore of the Golden Horn"
 OE_CITY_NORTH_DESC: "Across the bay, the Galata Tower watches over the waterway. Genoese and Venetian trading enclaves are also listed here."
 OE_CITY_NO_SPECIAL_PROJECTS: "This district currently has no enabled capital-specific building projects."
 oe_byz_constantinople_civic_center: "Constantinian Civic Center"
 oe_byz_constantinople_civic_center_desc: "The capital's roads, water supply and public buildings require someone to coordinate craftsmen, materials and schedules. The civic center brings together the dignitaries responsible for construction, allowing projects to proceed together rather than wait upon one another."
 oe_city_civic_maintenance: "Civic Administration of the Capital"
 OE_CITY_EXPAND: "Expand"
 OE_CITY_PREPAID_PROJECT: "Capital Expansion Appropriation"
 OE_CITY_PROJECT_SUMMARY: "Treasury: #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_price')|0]#! gold · #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_remaining')|0]#! expansions remaining"
 OE_CITY_EXPAND_DESC: "Allocate #Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_price')|0] treasury gold#! to raise this building's level cap by one and immediately queue one level, beginning construction at #Y 0 progress#!.\n\nConstantinople must have a #Y free building queue#!, be controlled by its owner and not be under siege. Construction gold will not be charged again; normal construction time and subsequent operating costs still apply.\n\n#Y [GuiScope.SetRoot(InternationalOrganizationsView.GetPlayer.MakeScope).AddScope('city_building_type',BuildingType.MakeScope).ScriptValue('oe_city_expansion_remaining')|0]#! expansions remain for this project. Queuing the work immediately uses one expansion opportunity; cancellation does not restore it."
 OE_CITY_QUEUE_STATUS: "Free Building Queues: #Y [GuiScope.SetRoot(GetLocationByKey('constantinople').MakeScope).ScriptValue('oe_city_civil_free')|0]#! / [GuiScope.SetRoot(GetLocationByKey('constantinople').MakeScope).ScriptValue('oe_city_civil_capacity')|0]"
