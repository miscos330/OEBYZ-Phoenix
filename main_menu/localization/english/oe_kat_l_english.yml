 oe_kat_dec_charter_katepanate: "Proclaim the Imperial Katepanate Charter"
 oe_kat_dec_charter_katepanate_desc: "Codify the voluntary consolidation of Diocletianic Dioceses and interior Military Themes into high-tier Imperial Katepanates, cutting diplomatic overhead while safeguarding Naval Themes and full reversibility."
 oe_kat_dec_charter_katepanate.title: "Proclaim the Imperial Katepanate Charter"
 oe_kat_dec_charter_katepanate.desc: "As the Empire expands across classical Dioceses and Prefectures, dozens of fragmented Themes strain Constantinople's diplomatic capacity. Issuing the Imperial Katepanate Charter empowers the Basileus to voluntarily merge clusters of ordinary land Themes into high-tier Katepanates—never forcing auto-mergers, protecting Naval and Hereditary Themes, and preserving the right to split them back at any moment. Costs 150 gold and 10 Imperial Authority."
 oe_kat_dec_charter_katepanate.a: "Seal the Katepanate Chrysobull"
 oe_kat_dec_charter_katepanate_tt: "Unlocks permanent voluntary #G Diocese Katepanate Consolidation#! in the Imperial Pillars panel and grants the #G Ordinance of the Katepanates#!."
 oe_kat.1.title: "Proclaiming the Office of the Katepano"
 oe_kat.1.desc: "Beneath the porphyry arches of the Magnaura, the imperial chancery unveils the golden chrysobull establishing the Office of the Katepano. Standing above ordinary regional strategoi yet bound by written recall seals, each Katepano coordinates an entire Diocese cluster of consolidated Themes—slashing Constantinople's diplomatic burden without extinguishing a single historic provincial seat."
 oe_kat.1.a: "Uphold the Sacred Majesty of Roman Law"
 oe_kat.1.b: "Inspect the Cataphracts under the New Standards"
 oe_kat.2.title: "Integrating Civilian Diocese and Military Themes"
 oe_kat.2.desc: "Across our restored Roman Dioceses, civilian vicarii of the Praetorian Consistorium now sit at the same marble table as the regional Katepanoi. Whether the Crown grants civil cadastres primacy or subordinates diocesan supply depots directly to military headquarters will define how the consolidated provinces prosper."
 oe_kat.2.a: "Bind Civil Tax Rolls and Katepanate Roads Together"
 oe_kat.2.b: "Place Diocesan Depots Under Katepanate Command"
 oe_kat.3.title: "Protecting the Imperial Naval Themes"
 oe_kat.3.desc: "As inland Themes consolidate into sweeping land Katepanates, the admirals of our Naval Themes petition the Sacred Palace: coastal shipyards, Greek-fire arsenals, and island patrols cannot wait upon inland governors. By explicit decree, every Naval Theme remains exempted from Katepanate mergers, answering directly to the imperial fleet."
 oe_kat.3.a: "Guarantee Permanent Naval Theme Autonomy"
 oe_kat.3.b: "Confirm Exemption and Levy Maritime Charter Dues"
 oe_kat.4.title: "Katepanate Revolt Containment Safeguard"
 oe_kat.4.desc: "Imperial intelligence couriers warn that one of our consolidated Katepanates has grown dangerously restive. Unlike an unchecked super-vassal, our Katepanate Charter built in a decisive circuit-breaker: by invoking pre-sealed imperial writs, we can immediately detach loyal absorbed sub-themes back into standalone classical Themes, confining any defiance strictly to the Katepano's own seat."
 oe_kat.4.a: "Invoke Containment Writs and Quarantine the Seat"
 oe_kat.4.b: "Dispatch Imperial Logothetes with 120 Gold to Appease"
 oe_kat.5.title: "The Katepanate Fiscal Dividend"
 oe_kat.5.desc: "The Logothete of the Genikon lays a thick parchment ledger before the throne: by merging fragmented provincial chanceries into streamlined Diocese Katepanates, duplicate staff stipends and overlapping supply trains have vanished. Fresh nomismata now pour into the imperial vaults alongside rising provincial control."
 oe_kat.5.a: "Channel the Surplus into the Imperial Treasury"
 oe_kat.5.b: "Reinvest in Imperial Prestige and Pillars Authority"
 oe_kat.6.title: "Reversible Return to Classical Themes"
 oe_kat.6.desc: "With imperial seals broken in open assembly, a consolidated Diocese Katepanate has been peacefully demobilized and its historic seats restored as independent classical Themes. Provincial nobles and urban senators alike marvel at a state apparatus flexible enough to expand in wartime and decentralize at the Emperor's word."
 oe_kat.6.a: "Celebrate the Flexibility of Roman Statecraft"
 oe_kat.6.b: "Reclaim Central Authority for Future Reforms"
