l_english:
 OE_RAID_TURK_DEFENDED_DESC: "The garrison at [target_location.GetName] detected the ghazis in time and drove them back across the border. The villages and roads remain secure."
 OE_RAID_SER_DEFENDED_DESC: "The garrison at [target_location.GetName] intercepted the Serbian raiders and held the crossings. The attackers withdrew without plunder."
 OE_RAID_PIRATE_DEFENDED_DESC: "A coastal watch near [target_location.GetName] raised the alarm in time. The garrison drove the pirates back to their ships before they could plunder the villages."
 OE_RAID_BANDIT_DEFENDED_DESC: "The garrison at [target_location.GetName] tracked down the bandits and secured the roads. Farmers and merchants can travel safely again."
 OE_RAID_NO_LONGER_RELEVANT: "The situation has changed; stand down."
 OE_RAID_NO_LONGER_RELEVANT_TT: "The disaster has ended or we no longer own the target location. This event has no further cost or effect."
