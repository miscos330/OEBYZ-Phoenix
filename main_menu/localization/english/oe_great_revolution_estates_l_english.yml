 oe_gr_peasants_power_law: "Commoner Power"
 oe_gr_peasants_power_law_desc: "The balance of power between the republic and the countryside, where the old imperial order of land, service and status faces the revolution."
 oe_gr_rural_resistance_policy: "Conservative Resistance"
 oe_gr_rural_resistance_policy_desc: "Landowners and village authorities withhold cooperation. Muster rolls disappear, grain carts turn back, and orders from the capital fail to reach the countryside."
 oe_gr_rural_ignorance_policy: "The Unenlightened Countryside"
 oe_gr_rural_ignorance_policy_desc: "Independent smallholders will not fight for fallen magnates, but they have yet to trust the distant capital. They guard their fields and granaries, waiting for the republic to prove itself."
 oe_gr_clergy_power_law: "Clerical Power"
 oe_gr_clergy_power_law_desc: "The republic must redefine the place of the Church in public life and government."
 oe_gr_church_noncooperation_policy: "The Church Refuses Cooperation"
 oe_gr_church_noncooperation_policy_desc: "Worship continues, but the clergy will not explain or endorse the new government’s authority. Their silence deprives republican decrees of a familiar channel of legitimacy."
 oe_gr_nobles_power_law: "Noble Power"
 oe_gr_nobles_power_law_desc: "The unresolved struggle between the old imperial aristocracy and the republic."
 oe_gr_noble_disloyalty_policy: "Magnates Refuse Allegiance"
 oe_gr_noble_disloyalty_policy_desc: "Families whose standing rested on the dynasty, landed estates and military office will not transfer their oaths to the republic. Resistance within the officer corps weakens the army."
 oe_gr_burghers_power_law: "Burgher Power"
 oe_gr_burghers_power_law_desc: "The republic turns to the guilds, merchants and civic traditions of its towns as a new political foundation."
 oe_gr_republican_bulwark_policy: "Bulwark of the Republic"
 oe_gr_republican_bulwark_policy_desc: "Burghers see the republic as a chance to participate in government. Donations, petitions and civic institutions provide its firmest support."
 STATIC_MODIFIER_NAME_oe_gr_state_machinery_failure: "The State Machinery Breaks Down"
 STATIC_MODIFIER_DESC_oe_gr_state_machinery_failure: "Officials evade responsibility while administration, revenue collection and political coordination falter. This crisis has no automatic expiry."
 STATIC_MODIFIER_NAME_oe_gr_provincial_defiance: "Provincial Defiance"
 STATIC_MODIFIER_DESC_oe_gr_provincial_defiance: "The provinces resist orders from the capital, weakening the network of governors and central control. This crisis has no automatic expiry."
 oe_great_revolution.10.t: "Rural Conservatives Strike Back"
 oe_great_revolution.10.d: "The republic’s proclamations scarcely pass the city gates before older commands intercept them. Estate stewards summon tenants; village notables warn that the capital has overthrown the order that secured every deed, obligation and social rank.\n\nMuster rolls disappear, grain carts turn back and witnesses fall silent before the tax collector. Those whose lives depend on the old arrangements need not love the court to fear its fall. Our banners have risen, but the countryside has shut its gates."
 oe_great_revolution.10.a: "Republican law must pass beyond the estate walls."
 oe_great_revolution.11.t: "Smallholders Wait and See"
 oe_great_revolution.11.d: "The countryside has not taken up arms for the emperor as the magnates hoped. Farmers who own their fields remember who once sought to reclaim their deeds; they will not shed blood for a landlord’s honor. Yet a proclamation calling them citizens has not won their trust.\n\nVillages still ask about next year’s taxes, military service and seed grain. They sow as before, but hide their savings and surplus more carefully. Before offering allegiance, they expect the republic to keep its promises."
 oe_great_revolution.11.a: "Let them see that the owners of the land are remembered."
 oe_great_revolution.12.t: "The Church Waits and Watches"
 oe_great_revolution.12.d: "Morning prayers continue, but no preacher explains how one should pray for the republic. The bishops offer cautiously worded assurances: they will counsel peace, yet cannot accept that a riot in the capital has transferred the authority of an anointed sovereign.\n\nTheir silence is harder to answer than open condemnation. The government needs parish registers, trusted messengers and voices of reassurance; instead every request awaits another council. The provisional government withdraws several ancient privileges. A familiar bridge between Church and state breaks beneath our feet."
 oe_great_revolution.12.a: "The faith remains; the old partnership does not."
 oe_great_revolution.13.t: "The Magnates Refuse Allegiance"
 oe_great_revolution.13.d: "Demands for an oath return to the capital with their seals unbroken. Some families plead illness, others leave their estates, and several proclaim that their ancestors served Roman emperors, not provisional presidents installed behind barricades.\n\nThis is more than aristocratic pride. Officers delay taking up commands, provincial officials evade responsibility, and noble clients treat republican decrees as suggestions that can wait. Withdrawing court honors cannot unravel overnight the old web of power stretching across the empire."
 oe_great_revolution.13.a: "Rome no longer belongs to a handful of families."
 oe_great_revolution.14.t: "The Burghers Rally to the Republic"
 oe_great_revolution.14.d: "Guild delegates and civic envoys fill the provisional government’s corridors. They bring food, account books and pledged silver, together with a common demand: if urban hands defended the barricades, urban voices must be heard in the council chamber.\n\nMerchants seek predictable taxes, artisans an end to privileged monopolies, and educated citizens a government that takes their new name seriously. Their hopes differ, but for now they converge on one promise: to help the republic stand upon its feet."
 oe_great_revolution.14.a: "The republic shall hear the voice of its cities."
 oe_great_revolution.15.t: "The Bureaucrats Waver"
 oe_great_revolution.15.d: "The constitution has changed; documents still circle the old offices. One tax order is returned three times: first for a missing imperial seal, then for a title that has been abolished, and finally because nobody will sign the last page. Everyone professes loyalty to Rome. Nobody volunteers to take responsibility for the republic.\n\nOfficials know the archives, roads and revenues, but cannot know whether the new government will endure. Some await the nobles, others the Church; many merely hope to leave the mistake to a successor. The machinery of state remains immense, but its gears grind through sand."
 oe_great_revolution.15.a: "The state cannot remain a document awaiting approval."
 oe_great_revolution.16.t: "The Provinces Resist the Central Government"
 oe_great_revolution.16.d: "At first the provinces merely submit their reports late. Then taxes are retained to pay local troops, dockyards refuse orders from the capital, and governors claim discretion in the name of preserving peace. The more urgently the republic commands, the more insistently its provinces demand reassurance.\n\nImperial government rested upon status, favors and personal ties. The emperor’s captivity has exposed the cracks. The provinces have not raised a common banner, but they no longer follow a common path of obedience to Constantinople. We have seized the central government; we must still regain a country."
 oe_great_revolution.16.a: "Let the provinces hear Constantinople’s authority again."
