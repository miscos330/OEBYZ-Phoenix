# NEW 2026-11-21 v9.6 Module 2: Native Religion Depth (oe_rel_). Generated by gen_v96_religion.py.
 oe_rel_hesychasm_tenet:0 "Orthodox Theology & Ecumenical Course"
 oe_rel_hesychasm_tenet_desc:0 "Sets the guiding theological and ecumenical course of the Autocephalous Patriarchate across Hesychast Orthodoxy, Unionist Dialogue, Athonite Asceticism, and Imperial Humanism."
 oe_rel_rus_church_property_tenet:0 "Rus' Monastic Estates & Liturgical Rite"
 oe_rel_rus_church_property_tenet_desc:0 "Governs the great debates of the Russian Orthodox Church over monastic estates and liturgical canons, spanning Josephite Possessors, Non-Possessors, Nikonian Reform, and the Old Believer Accord."
 oe_rel_hesychast_orthodoxy:0 "Hesychast Palamite Orthodoxy"
 oe_rel_hesychast_orthodoxy_desc:0 "Upholds the Palamite Hesychast councils of Constantinople, deepening Orthodox devotion, clerical harmony, and spiritual authority."
 oe_rel_unionist_dialogue:0 "Ecumenical Unionist Dialogue"
 oe_rel_unionist_dialogue_desc:0 "Pursues measured theological dialogue across Christendom, elevating diplomatic standing and heretic tolerance while slowing heretic conversion."
 oe_rel_athonite_asceticism:0 "Athonite Monastic Asceticism"
 oe_rel_athonite_asceticism_desc:0 "Anchors church life in the monastic network of Mount Athos, reinforcing stability efficiency, wartime resilience, and split heretic/heathen conversion at a clerical and tolerance cost."
 oe_rel_imperial_humanism:0 "Imperial Academy Humanism"
 oe_rel_imperial_humanism_desc:0 "Synthesizes classical Greek letters with Orthodox scholarship across great urban academies, accelerating literacy, cultural tradition, and research."
 oe_rel_josephite_possessors:0 "Josephite Possessors"
 oe_rel_josephite_possessors_desc:0 "Adopts the doctrine of Joseph of Volokolamsk: confirming vast monastic estates in exchange for staunch ecclesiastical backing of centralized monarchical legitimacy."
 oe_rel_non_possessors:0 "Trans-Volga Non-Possessors"
 oe_rel_non_possessors_desc:0 "Follows Nil Sorsky's Trans-Volga Elders: curbing monastic serf holdings to redirect church energies toward scholarship, literacy, and peasant welfare."
 oe_rel_nikonian_reform:0 "Nikonian Liturgical Reform"
 oe_rel_nikonian_reform_desc:0 "Aligns Russian liturgical books and rites with Greek patriarchal standards, boosting religious influence and diplomatic prestige at the cost of domestic stability friction."
 oe_rel_old_believer_accord:0 "Old Believer Frontier Accord"
 oe_rel_old_believer_accord_desc:0 "Heals liturgical division through formal toleration, channeling industrious Old Believer communities into frontier settlement and long-distance export commerce."
 oe_rel_sanjiao_synthesis_law:0 "Three Teachings Doctrinal Synthesis"
 oe_rel_sanjiao_synthesis_law_desc:0 "Defines the doctrinal synthesis emphasized across Three Teachings and Mahayana sects—selectable through the Three Teachings Grand Debate."
 oe_rel_vajrayana_patronage_law:0 "Vajrayana Imperial Preceptor Patronage"
 oe_rel_vajrayana_patronage_law_desc:0 "Establishes the patronage covenant governing Tibetan Vajrayana sects across the Sakya, Gelug, and Kagyu monastic lineages."
 oe_rel_neo_confucian_ritual:0 "Neo-Confucian Ritual & Governance"
 oe_rel_neo_confucian_ritual_desc:0 "Grounds sect scholarship in Cheng-Zhu Neo-Confucian propriety, strengthening legitimacy, cabinet administration, and upper literacy."
 oe_rel_quanzhen_harmony:0 "Quanzhen Harmony & Renewal"
 oe_rel_quanzhen_harmony_desc:0 "Channels Quanzhen Daoist synthesis to ease stability upkeep, foster steady prosperity, and promote tolerance toward heterodox currents."
 oe_rel_chan_pureland_synthesis:0 "Chan & Pure Land Synthesis"
 oe_rel_chan_pureland_synthesis_desc:0 "Unites Chan insight with Pure Land compassion to comfort the peasantry, ease war exhaustion, and enrich cultural tradition."
 oe_rel_sakya_imperial_preceptor:0 "Sakya Imperial Preceptor Lineage"
 oe_rel_sakya_imperial_preceptor_desc:0 "Continues the Phagpa Imperial Preceptor compact, reinforcing diplomatic prestige, imperial renown, and broad heathen tolerance."
 oe_rel_gelug_monastic_discipline:0 "Gelug Monastic Discipline"
 oe_rel_gelug_monastic_discipline_desc:0 "Emphasizes strict Vinaya discipline and monastic debate colleges, expanding clerical literacy, stability investment, and monthly karma."
 oe_rel_kagyu_tantric_protectors:0 "Kagyu Tantric Protectors"
 oe_rel_kagyu_tantric_protectors_desc:0 "Invokes Himalayan protector rites to fortify garrison defenses, heighten army morale, and steady forces through long campaigns."
 oe_rel_imperial_religious_policy:0 "Imperial Multi-Confessional Governance"
 oe_rel_imperial_religious_policy_desc:0 "Establishes the realm's overarching religious statecraft across the Three Teachings, the Xuanzheng Yuan, the Hui Astronomical Bureau, and Confucian monastic regulation."
 oe_rel_policy_sanjiao_balance:0 "Three Teachings Balance & Confucian Statecraft"
 oe_rel_policy_sanjiao_balance_desc:0 "Maintains Confucian statecraft at the helm while harmonizing Buddhist and Daoist orders, lifting legitimacy, literacy caps, and cabinet efficiency."
 oe_rel_policy_xuanzheng_lama:0 "Xuanzheng Yuan & Imperial Preceptor Patronage"
 oe_rel_policy_xuanzheng_lama_desc:0 "Elevates the Xuanzheng Yuan and Tibetan preceptors to harmonize plateau and steppe realms, boosting heathen tolerance, diplomatic reputation, and clergy satisfaction."
 oe_rel_policy_hui_astronomers:0 "Hui Astronomical Bureau & Semu Scholars"
 oe_rel_policy_hui_astronomers_desc:0 "Recruits Persian and Central Asian astronomers, cartographers, and jurists into imperial bureaus, accelerating research speed, export efficiency, and heathen tolerance."
 oe_rel_policy_orthodox_confucian_strict:0 "Strict Neo-Confucianism & Monastic Regulation"
 oe_rel_policy_orthodox_confucian_strict_desc:0 "Tightly regulates ordination certificates and tax-exempt temple lands, curbing clergy power while strengthening tax efficiency, cultural assimilation, and religious conversion at the cost of heathen tolerance."
