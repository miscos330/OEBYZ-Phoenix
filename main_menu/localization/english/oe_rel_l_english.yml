 STATIC_MODIFIER_DESC_oe_rel_synod_palamas_orthodoxy:0 "The Ecumenical Synod reaffirmed Palamite orthodoxy, strengthening true-faith unity and stability upkeep."
 STATIC_MODIFIER_NAME_oe_rel_synod_charity_relief:0 "Ecumenical Synod: Inter-Diocesan Relief"
