 STATIC_MODIFIER_NAME_oe_rel_synod_patriarchal_order:0 "Ecumenical Synod: Patriarchal Discipline"
 STATIC_MODIFIER_DESC_oe_rel_synod_patriarchal_order:0 "Renewed canonical order across patriarchal sees harmonizes clerical discipline and monarchical legitimacy."
 STATIC_MODIFIER_NAME_oe_rel_athonite_patronage:0 "Patronage of Mount Athos"
