 oe_asp_miaphysite_alexandrian_synod:0 "Alexandrian Patristic Synod"
 oe_asp_miaphysite_alexandrian_synod_desc:0 "Draws upon the ancient Alexandrian theological academy to foster ecumenical diplomacy and steady literacy across the realm."
 oe_asp_miaphysite_solomonic_covenant:0 "Solomonic Covenant of the Ark"
 oe_asp_miaphysite_solomonic_covenant_desc:0 "Anchors royal legitimacy in the sacred covenant of the Ark, fortifying highland citadels and dynastic authority."
 oe_asp_miaphysite_armenian_craft_guilds:0 "Armenian Craft & Merchant Guilds"
 oe_asp_miaphysite_armenian_craft_guilds_desc:0 "Leverages church-chartered Armenian artisan guilds and caravan networks to expand export efficiency and domestic production."
 oe_asp_miaphysite_desert_hermits:0 "Desert Hermit Asceticism"
 oe_asp_miaphysite_desert_hermits_desc:0 "Preserves the austere desert monasticism of Egypt and Nubia, easing stability upkeep while punishing invaders with harsh attrition."
 oe_asp_tengri_eternal_yassa:0 "Eternal Yassa of Tengri"
 oe_asp_tengri_eternal_yassa_desc:0 "Reaffirms the Great Yassa under Eternal Heaven, empowering both light and heavy cavalry while cementing horde unity."
 oe_asp_tengri_shamanic_syncretism:0 "Steppe Shamanic Syncretism"
 oe_asp_tengri_shamanic_syncretism_desc:0 "Honors the steppe custom of sheltering clerics of every creed, widening heathen tolerance and accepted-culture capacity."
 oe_asp_tengri_ordu_horsemasters:0 "Ordu Horsemasters & Steppe Remounts"
 oe_asp_tengri_ordu_horsemasters_desc:0 "Organizes seasonal royal herds and remount stations across every ordu, accelerating off-road movement and regiment reinforcement."
 oe_asp_tengri_silk_caravan_oath:0 "Steppe Silk Caravan Oath"
 oe_asp_tengri_silk_caravan_oath_desc:0 "Swears paiza safe-conduct oaths for trans-steppe merchants, extending trade range and sharpening export efficiency."
 oe_asp_jurchen_baishan_spirits:0 "Spirits of Changbai & the Black River"
 oe_asp_jurchen_baishan_spirits_desc:0 "Venerates the ancestral spirits of Mount Changbai and the Amur, fortifying frontier strongholds and stiffening land morale."
 oe_asp_jurchen_banner_hunting_rites:0 "Jurchen Great Hunt & Banner Rites"
 oe_asp_jurchen_banner_hunting_rites_desc:0 "Turns seasonal sacred hunts into live cavalry maneuvers, honing light-cavalry prowess while boosting wild game output."
 oe_rel.10.t:0 "The Ecumenical Synod Convenes"
 oe_rel.10.desc:0 "Metropolitans, abbots, and imperial theologians have assembled beneath the cathedral dome to await your decree. Their canons will guide the Orthodox realm for the next decade."
 oe_rel.10.a:0 "Reaffirm Palamite Orthodoxy and true-faith unity"
 oe_rel.10.b:0 "Launch inter-diocesan charity to restore prosperity"
 oe_rel.10.c:0 "Reform patriarchal discipline and harmonize clergy"
 oe_rel.11.t:0 "Chrysobull for Mount Athos"
 oe_rel.11.desc:0 "Imperial envoys have delivered your golden chrysobull and endowments to the twenty monasteries of Mount Athos. Bells ring across the peninsula as scriptoria pledge prayers and learned scribes to your realm."
 oe_rel.11.a:0 "May the lamps of the Holy Mountain shine upon our realm"
 oe_rel.13.t:0 "All-Rus' Ecclesiastical Mediation"
 oe_rel.13.desc:0 "Debates over monastic estates and sacred liturgy have stirred tension across the dioceses of Rus'. Under your mediation, Possessors, Trans-Volga Elders, and provincial bishops gather to forge an honorable settlement."
 oe_rel.13.a:0 "Restore conciliar harmony across clergy and peasantry"
 oe_rel.13.b:0 "Grant generous relief to provincial monasteries and villages"
 oe_rel.20.t:0 "The Three Teachings Grand Debate"
 oe_rel.20.desc:0 "Before the throne, imperial Confucians, Quanzhen Daoist patriarchs, and Buddhist masters expound their paths of governance and spiritual renewal. Your verdict will shape court policy for ten years and guide your sect's doctrinal law."
 oe_rel.20.a:0 "Honor Neo-Confucianism: elevate cabinet efficiency and righteousness"
 oe_rel.20.b:0 "Favor Quanzhen Daoism: nurture harmony and provincial prosperity"
 oe_rel.20.c:0 "Embrace Chan-Pure Land: ease war exhaustion and foster growth"
 oe_rel.21.t:0 "Consecration of the Imperial Preceptor"
 oe_rel.21.desc:0 "High lamas from the Tibetan plateau have entered the capital to perform the consecration rites of state protection. Representatives of the Sakya, Gelug, and Kagyu traditions await your royal patronage to seal the covenant with plateau and steppe realms."
 oe_rel.21.a:0 "Uphold the Sakya Preceptor lineage and honor plateau allies"
 oe_rel.21.b:0 "Sponsor Gelug monastic discipline and sacred scholarship"
 oe_rel.21.c:0 "Invoke Kagyu tantric protectors to fortify our frontiers"
 oe_rel.22.t:0 "Muslim Scholars Join the Imperial Observatory"
 oe_rel.22.desc:0 "Astronomers and jurists from along the Silk Road have arrived at court bearing astrolabes, star tables, and geographical treatises. Invite a distinguished Muslim Scholar to join the imperial observatory and academy."
 oe_rel.22.a:0 "Invite a Hanafi jurist and astronomer from Persia"
 oe_rel.22.b:0 "Invite a Maturidi rationalist scholar from the Central Plains"
 oe_rel.22.c:0 "Invite a Naqshbandi Silk Road scholar from Persia"
