 STATIC_MODIFIER_NAME_oe_rel_debate_confucian_court:0 "Grand Debate: Confucian Rectitude"
 STATIC_MODIFIER_DESC_oe_rel_debate_confucian_court:0 "Imperial patronage of Confucian statecraft following the Grand Debate sharpens cabinet administration and legitimacy."
 STATIC_MODIFIER_NAME_oe_rel_debate_daoist_court:0 "Grand Debate: Daoist Harmony"
 STATIC_MODIFIER_DESC_oe_rel_debate_daoist_court:0 "Court embrace of Daoist moderation lightens administrative strain and fosters calm provincial prosperity."
 STATIC_MODIFIER_NAME_oe_rel_debate_buddhist_court:0 "Grand Debate: Buddhist Compassion"
 STATIC_MODIFIER_DESC_oe_rel_debate_buddhist_court:0 "Imperial almsgiving and Buddhist compassion soothe wartime exhaustion and encourage steady population growth."
 STATIC_MODIFIER_NAME_oe_rel_preceptor_blessing:0 "Imperial Preceptor's Blessing"
 STATIC_MODIFIER_DESC_oe_rel_preceptor_blessing:0 "The Imperial Preceptor's consecration elevates royal prestige, deepens heathen tolerance, and binds loyal subjects."
 STATIC_MODIFIER_NAME_oe_rel_hui_observatory_buff:0 "Hui Observatory & Scholarly Patronage"
 STATIC_MODIFIER_DESC_oe_rel_hui_observatory_buff:0 "Invited Muslim astronomers and jurists enrich court observatories and academies, raising research speed and literacy."
 oe_rel_convene_ecumenical_synod:0 "Convene Ecumenical Synod"
 oe_rel_convene_ecumenical_synod_desc:0 "Summon metropolitans and theologians to deliberate doctrine, inter-diocesan relief, and patriarchal discipline."
 oe_rel_convene_ecumenical_synod_past:0 "Convened an Ecumenical Synod to set the realm's ecclesiastical course for the decade."
 oe_rel_sponsor_athonite_monasteries:0 "Patronize Mount Athos"
 oe_rel_sponsor_athonite_monasteries_desc:0 "Endow the monastic republic of Mount Athos with imperial gold, raising literacy, religious influence, and cultural tradition—with additional local benefits if you hold Mount Athos."
 oe_rel_sponsor_athonite_monasteries_past:0 "Endowed the monasteries of Mount Athos by imperial chrysobull."
 oe_rel_commission_imperial_icon:0 "Commission Imperial Sacred Icon"
 oe_rel_commission_imperial_icon_desc:0 "Commission master iconographers to craft a high-quality Orthodox sacred icon directly in your capital, enriching your treasury of sacred art."
 oe_rel_commission_imperial_icon_past:0 "Commissioned and consecrated a new imperial sacred icon in the capital."
 oe_rel_mediate_rus_schism:0 "Mediate Rus' Ecclesiastical Schism"
 oe_rel_mediate_rus_schism_desc:0 "Convene Russian bishops and elders to reconcile Possessor, Non-Possessor, and liturgical disputes, restoring clergy and peasant harmony."
 oe_rel_mediate_rus_schism_past:0 "Mediated ecclesiastical divisions across the Russian Church."
 oe_rel_sanjiao_grand_debate:0 "Convene Three Teachings Grand Debate"
 oe_rel_sanjiao_grand_debate_desc:0 "Invite Confucian scholars, Daoist masters, and Buddhist abbots to debate before the throne, setting the court's ten-year doctrinal orientation and sect synthesis law."
 oe_rel_sanjiao_grand_debate_past:0 "Convened the Three Teachings Grand Debate and proclaimed a new doctrinal orientation."
 oe_rel_imperial_preceptor_blessing:0 "Imperial Preceptor Empowerment"
 oe_rel_imperial_preceptor_blessing_desc:0 "Receive consecration from a high Tibetan preceptor, elevating imperial prestige, heathen tolerance, subject loyalty, and Vajrayana sect patronage."
 oe_rel_imperial_preceptor_blessing_past:0 "Received the Imperial Preceptor's empowerment, strengthening ties with plateau and steppe realms."
 oe_rel_hui_academy_patronage:0 "Patronize Hui Scholars & Observatory"
 oe_rel_hui_academy_patronage_desc:0 "Invite a learned Sunni Muslim scholar into court service as a native Muslim Scholar religious figure while boosting national research speed and literacy."
 oe_rel_hui_academy_patronage_past:0 "Invited an accomplished Muslim Scholar to serve in the imperial observatory and academy."
 oe_rel_preceptor_tibet_link_tt:0 "Follows Tibetan Buddhism, holds Yuan/Chinese imperial heritage, or owns, vassalizes, or allies the holder of Lhasa or Sakya"
