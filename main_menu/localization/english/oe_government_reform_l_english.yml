l_english: 
 oe_byz_badsystem_desc: "The once #bold #color_yellow glorious#!#! and efficient central bureaucracy of the Byzantine Empire is now nothing but a crumbling ruin of empty titles. #bold #R Currency devaluation, territorial shrinkage, and frequent civil wars#!#! have severely damaged our bureaucratic system. Now, the imperial government is filled with incompetent favorites and sycophants. We are becoming more and more like a Greek rump state clinging to a corner, rather than a universal empire."
 oe_byz_badsystem: "#R Decayed Hierarchy#!"
 oe_byz_goodsystem_desc: "We have successfully reorganized the Eastern Roman bureaucratic system. Now, the Emperor's will can once again be extended to all parts of the empire through loyal bureaucrats, as easily as moving one's arm."
 oe_byz_goodsystem: "Restored Hierarchy"
 oe_byz_crown_reform: "Porphyrogennetos"
 oe_byz_crown_reform_desc: "We are the Emperor of an ancient, centralized empire, inheriting the legal tradition of the Roman Empire. The dignity of our imperial house is unsurpassed."
 oe_noble_rule_area: "Local Magnates"
 oe_noble_rule_area_desc: "The continuous feudalization of Byzantium since the establishment of feudal relations in the 11th century led to the increase of local magnate power. Since the 14th century, the dynastoi appointed through the pronoia system, with the Emperor's tacit approval, have amassed wealth wildly, further exacerbating this expansion of magnate power." #膨胀 to increase, 上级首领 to dynastoi, 首领制 to pronoia system
 MODIFIER_TYPE_NAME_allow_oe_byz_build_country_gov: "Enable Administrative Headquarters"
 MODIFIER_TYPE_DESC_allow_oe_byz_build_country_gov: "Allows us to unlock the government building: Administrative Headquarters."
 unlocked_oe_peasants_own_theme_II: "Magnates Curbed"
 unlocked_oe_peasants_own_theme_III: "Themes Reformed"
 oe_byz_heavy_work: "Lord's Corvée"
 oe_byz_heavy_work_desc: "Dependent peasants no longer perform military service for the state, but instead provide heavy, unpaid labor for the local lord and serve as the lord's private manpower in local conflicts."
 oe_byz_rome_gift: "Legacy of the Roman Empire"
 oe_byz_rome_gift_desc: "Our citizens can still enjoy the world's most magnificent public facilities inherited from the imperial era. Churches, great baths, and hippodromes constitute the citizens' unique entertainment life."
 oe_byz_burgher_state_life: "Byzantine Civil Society"
 oe_byz_burgher_state_life_desc: "Byzantium possesses a long-standing, developed civil society. Although it has declined somewhat since the 13th century due to military failures and Latin competition, its ancient traditions have been preserved."
 oe_byz_peasants: "Imperial Countryside"
 oe_byz_peasants_desc: "The Byzantine Empire was an agricultural empire born from the Roman Empire. The Byzantines were not the servile and languid people described by Gibbon, nor did their history enter a regressive decline after the 2nd century. On the contrary, through determined reforms adapting to social development, the theme system, evolved from the colonate system, became the foundation for the stability and comprehensive revival of Byzantine agriculture." #复兴 to revival
 oe_byz_rural_revolution: "Revolution in Production Relations"
 oe_byz_sunday: "Statutory Sabbath"
 oe_byz_sunday_desc: "By allowing commoners to rest on the seventh day of the week, we can effectively improve the quality of the population and better their livelihoods."
 oe_byz_great_farm: "Intensive Agriculture"
 oe_byz_great_farm_desc: "Through state planning and curbing land annexation, our agriculture has become highly specialized and deeply integrated into the market economy."
 oe_noble_control_food: "Byzantine Enserfment"
 oe_noble_control_food_desc: "Since the establishment of the pronoia system, the Byzantine Empire, amidst continuous military failures, has fallen into increasingly severe enserfment. The remaining free peasants and small pronoians are in peril. To reverse this trend, we must make enormous efforts."
 oe_noble_control_food_change: "Reforms can be initiated after recovering the coast of Asia Minor and achieving stability of 70."
 oe_noble_honor: "Imperial Dignity Titles"
 oe_noble_honor_desc: "The Byzantine Empire possesses a rich and strict hierarchy of dignity titles. By maintaining this hierarchy, we can ensure that local nobles and small pronoians faithfully fulfill their obligations and fight for the state."
 oe_byz_lose_army: "Collapsed Central Army"
 oe_byz_lose_army_desc: "The central army of the Byzantine Empire was gradually abandoned amidst continuous military disasters in Asia Minor. Successive rulers increasingly preferred using foreign mercenaries over the central army."
 oe_byz_rebuild_army: "Roman Army"
 oe_byz_rebuild_army_desc: "Our country's army is a formidable force renowned throughout the Mediterranean. Having endured the perils of time, powerful enemies, and our own decline, we still live up to the name of Romans."
 oe_byz_university: "Byzantine University Recruitment System"
 oe_byz_university_desc: "We will select our officials from universities and local academic centers to ensure they possess the proper skills and abilities for their positions. This will create a talent advancement course focused on education throughout society, ensuring our talents can receive higher education." #素养 to胜任 to skills and abilities for, 通道 to course
# PAUSED:  oe_byz_bureaucrat: "Imperial Official Hierarchy System"
# PAUSED:  oe_byz_bureaucrat_desc: "The Byzantine bureaucratic system established a strict positional hierarchy, classifying officials at all levels based on the importance and responsibilities of their positions. At the central level, the Chancellor (or equivalent) was the highest administrative official, assisting the Emperor in handling state affairs. Additionally, there were various positions such as financial officials and military commanders, each with clear duties and authority." #各级 officials to officials at all levels, 职责 to responsibilities
 oe_reli_dip: "Professional Diplomatic System"
 oe_reli_dip_desc: "Our diplomatic system can properly receive delegations from all countries. Our diplomats have mastered multiple languages and understand the customs of various peoples." #Diplomats should至少 master to Our diplomats have mastered
 oe_byz_empire_sword: "The Road to the Five Patriarchates"
 oe_byz_empire_sword_desc: "Rome, Constantinople, Antioch, Jerusalem, Alexandria. We have tolerated the holy sites of the Orthodox Church falling into enemy hands for far too long. The footsteps of our infantry will march ever onward towards our holy sites, until the paths to all Five Patriarchates are trampled flat."
 oe_byz_clergy_greek_protect: "Classical Empire"
 oe_byz_clergy_greek_protect_desc: "History and culture are our country's most brilliant pearls. We possess countless ancient Greco-Roman texts from the classical era. If the empire can continue to endure, these texts will be the driving force for us to initiate a Renaissance." #have珍藏 to possess
 oe_noble_support_just: "Supporters of the Purple"
 oe_noble_support_just_desc: "The military aristocrats who supported [GetCharacter('byz_andronikos_iii_palaiologos').GetName] from the beginning of the civil war were all rewarded handsomely. After he ascended the throne, this group of military aristocrats, led by [GetCharacter('byz_john_kantakouzenos').GetName], remained the Emperor's right-hand men."
 oe_byz_clergy_different: "Hesychast Controversy"
 oe_byz_clergy_different_desc: "Due to Barlaam's attack on the 'Uncreated Light of God,' the ensuing debate has now evolved into a dispute between the rationalist/philosophical faction represented by Barlaam and the monastic/mystical faction represented by Palamas." #全面对立 to dispute
 oe_byz_clergy_internet: "Church Network"
 oe_byz_clergy_internet_desc: "This is the basic structure of our country's church. The nationwide church network firmly controls the faith of our people." #遍布全国的 to nationwide
 oe_noble_all: "#R The Three Dukes and Nine Ministers#!"
 oe_noble_all_desc: "The imperial nobles are unruly, especially now when imperial decrees are not enforced. The power of domestic magnates is particularly growing." #膨胀 to growing
 oe_noble_latin: "Fellow Soldiers of Christ"
 oe_noble_latin_desc: "Our empire lies astride the road to Jerusalem in the East, and is also Europe's foremost bulwark against the infidels. Countless zealous and devout Christian warriors are willing to travel from afar to support us." #支援 to support
 oe_byz_empire_religion: "Church-State Nexus"
 oe_byz_empire_religion_desc: "The Orthodox Church and Byzantine politics are deeply intertwined. Power-holders in the court determine church personnel appointments, and the church in turn serves as the court's mouthpiece."
 oe_byz_empire_religion_tt: "The Imperial Church Embraces the Concept of Equality"
 oe_byz_legal: "Shepherding on Behalf of Heaven"
 oe_byz_legal_desc: "Life is a creation of God. Our mission is merely to exercise rights on Earth on His behalf, that is, to shepherd the people. We must remember that people will not quietly starve when hungry, and will resist oppression even against overwhelming odds. If we neglect their right to survival, we must face their wrath." #牢记 to remember, 生存 to survival
 oe_byz_legal_tt: "After embracing the printing press, make the peasant tax rate greater than 0.75 (current tax divided by current maximum tax)."
 oe_byz_legal_ttt: "After embracing the printing press, make the burgher tax rate greater than 0.75 (current tax divided by current maximum tax)."
 oe_byz_empire_invest: "Latin Competition"
 oe_byz_empire_invest_desc: "Due to the failed governance and promises of successive governments, Latin merchants enjoy many privileges in our country's commerce, which seriously affects our economy."
 oe_byz_empire_invest_tt_I: "#R We can view the impact of Latin privileges on our economy in the laws interface.#!"
 oe_byz_burgher_invest: "Byzantine Guilds"
 oe_byz_burgher_invest_desc: "Its position between Europe, Asia and Africa allowed the Byzantine Empire to develop thriving crafts and trade. Despite repeated invasions by Germanic peoples, Slavs, Arabs and other nations, the exchange of people, goods and ideas across the three continents never ceased. These connections sustained the growth of Byzantine industry and commerce."
 oe_byz_empire_invest_tttt: "[GetEstateName('burghers_estate')] estate opinion is greater than or equal to 50%."
 oe_byz_empire_invest_tt: "All estate opinions are greater than or equal to 50%."
 oe_byz_empier_buildingplan: "Hai Xi Fu Lin"
 oe_byz_empier_buildingplan_desc: "#bold #color_yellow “Fu Lin, ancient Da Qin also, located on the Western Sea, also called Hai Xi Guo” (New Book of Tang, 221)#!#!\nWe once dominated the trade in goods between the East and Europe. Although we are now weakened by successive blows, Constantinople remains undeniably one of the final stops of the Silk Road. As long as we control this tradehub, we can claim a share of the highly profitable Eastern trade." #終點站 to final stop, 枢纽 to hub
 oe_byz_empier_money: "Hyperpyron"
 oe_byz_empier_money_desc: "Hyperpyron is the Latinized transliteration of its Greek name #bold #color_yellow νόμισμα υπέρπυρον#!#!, meaning 'highly refined' or 'super-pure' coin. Initially, its standard weight was about 4.5 grams (similar to the solidus), with extremely high purity. However, to pay for civil war costs and respond to the Turkish threat, emperors continuously 'cut corners'. By the mid-14th century, the gold content of the hyperpyron may have fallen to 50% or even lower, turning it into a silver-gold alloy coin. This led to severe inflation, domestic economic chaos, and the complete collapse of its international reputation. Foreign merchants (like Venetians and Genoese) refused to accept the debased hyperpyron, turning instead to their own stable currencies (like the Venetian ducat)." #应对 to respond to, 信誉 to reputation
 oe_byz_empier_money_bII: "Hyperpyron"
 oe_byz_empier_money_bII_desc: "Hyperpyron is the Latinized transliteration of its Greek name #bold #color_yellow νόμισμα υπέρπυρον#!#!, meaning 'highly refined' or 'super-pure' coin. Initially, its standard weight was about 4.5 grams (similar to the solidus), with extremely high purity. However, to pay for civil war costs and respond to the Turkish threat, emperors continuously 'cut corners'. By the mid-14th century, the gold content of the hyperpyron may have fallen to 50% or even lower, turning it into a silver-gold alloy coin. This led to severe inflation, domestic economic chaos, and the complete collapse of its international reputation. Foreign merchants (like Venetians and Genoese) refused to accept the debased hyperpyron, turning instead to their own stable currencies (like the Venetian ducat)."
