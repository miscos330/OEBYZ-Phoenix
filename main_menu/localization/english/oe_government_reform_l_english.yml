 oe_byz_empier_money_bIII_desc: "Hyperpyron is the Latinized transliteration of its Greek name #bold #color_yellow νόμισμα υπέρπυρον#!#!, meaning 'highly refined' or 'super-pure' coin. Initially, its standard weight was about 4.5 grams (similar to the solidus), with extremely high purity. However, to pay for civil war costs and respond to the Turkish threat, emperors continuously 'cut corners'. By the mid-14th century, the gold content of the hyperpyron may have fallen to 50% or even lower, turning it into a silver-gold alloy coin. This led to severe inflation, domestic economic chaos, and the complete collapse of its international reputation. Foreign merchants (like Venetians and Genoese) refused to accept the debased hyperpyron, turning instead to their own stable currencies (like the Venetian ducat)."
 oe_byz_empier_money_bIV: "#R Hyperpyron#!"
 oe_byz_empier_money_bIV_desc: "Hyperpyron is the Latinized transliteration of its Greek name #bold #color_yellow νόμισμα υπέρπυρον#!#!, meaning 'highly refined' or 'super-pure' coin. Initially, its standard weight was about 4.5 grams (similar to the solidus), with extremely high purity. However, to pay for civil war costs and respond to the Turkish threat, emperors continuously 'cut corners'. By the mid-14th century, the gold content of the hyperpyron may have fallen to 50% or even lower, turning it into a silver-gold alloy coin. This led to severe inflation, domestic economic chaos, and the complete collapse of its international reputation. Foreign merchants (like Venetians and Genoese) refused to accept the debased hyperpyron, turning instead to their own stable currencies (like the Venetian ducat)."
 oe_byz_empier_money_gI: "Hyperpyron"
 oe_byz_empier_money_gI_desc: "Hyperpyron is the Latinized transliteration of its Greek name #bold #color_yellow νόμισμα υπέρπυρον#!#!, meaning 'highly refined' or 'super-pure' coin. Initially, its standard weight was about 4.5 grams (similar to the solidus), with extremely high purity. However, to pay for civil war costs and respond to the Turkish threat, emperors continuously 'cut corners'. By the mid-14th century, the gold content of the hyperpyron may have fallen to 50% or even lower, turning it into a silver-gold alloy coin. This led to severe inflation, domestic economic chaos, and the complete collapse of its international reputation. Foreign merchants (like Venetians and Genoese) refused to accept the debased hyperpyron, turning instead to their own stable currencies (like the Venetian ducat)."
 oe_byz_academic_economy: "Byzantine Economic Society"
 oe_byz_academic_economy_desc: "Rich historical records and academic traditions cultivated our early understanding of economic theory. A council of several esteemed scholars will assist the ruler in managing the many accounts, expenditures, and debts."
 oe_byz_central_society: "State Monopoly Guilds"
 oe_byz_central_society_desc: "The Byzantine government guided guild production and established monopolies in key industries such as silk weaving. These arrangements brought substantial profits to the state."
 MODIFIER_TYPE_NAME_allow_oe_cabinet_catholic_fighter: "Unlocks Cabinet Action #R Fellow Soldiers of Christ#!"
 MODIFIER_TYPE_DESC_allow_oe_cabinet_catholic_fighter: "We will work to use our influence to attract Christian warriors from afar to join our just cause against the infidels." #号召 to attract
 catholic_fighter: "Fellow Soldiers of Christ"
 catholic_fighter_desc: "We will recruit Christian warriors to join our just cause." #吸收 to recruit
 catholic_fighter_active: "Call the Warriors of the Lord"
 oe_byz_catholic_fighter_ttI: "If [GetCountry('HAB').GetName]'s opinion of us is greater than 50."
 oe_byz_catholic_fighter_ttII: "If [GetCountry('HUN').GetName]'s opinion of us is greater than 50."
 oe_byz_catholic_fighter_ttIII: "If [GetCountry('FRA').GetName]'s opinion of us is greater than 50."
 oe_byz_catholic_fighter_ttIV: "If [GetCountry('ARA').GetName]'s opinion of us is greater than 50."
 oe_byz_catholic_fighter_ttV: "If [GetCountry('ENG').GetName]'s opinion of us is greater than 50."
 oe_byz_catholic_fighter_ttVI: "If [GetCountry('PAP').GetName]'s opinion of us is greater than 50."
 MODIFIER_TYPE_NAME_allow_oe_cabinet_reform_country_mine: "Unlocks Cabinet Action #G Establish State Mining Commission#!"
 MODIFIER_TYPE_DESC_allow_oe_cabinet_reform_country_mine: "Having driven out the leech-like Italians, our advisors, under the authority of [GetCountry('BYZ').GetGovernment.GetRuler.GetName], will conduct an research of all mines in the country,put away the local powers' tentacles from our precious mineral resources, and ultimately establish a mining commission."
 reform_country_mine: "Establish State Mining Commission"
 reform_country_mine_desc: "We will audit the accounts, scale, and output of all mines in the country,put away illegal occupiers, and establish a mining commission to constantly supervise mining production nationwide."
 reform_country_mine_active: "Inspecting Mines Nationwide"
 reform_country_mine_tt: "Unlocks Mining Law: #G State Mining Commission#!"
 oe_byz_reform_country_mine_over: "State Mining Commission Established"
 oe_byz_reform_country_mine_over_tt: "National mines have been audited."
 oe_byz_andronikos_iii_I: "'Star' Emperor"
 desc_oe_byz_andronikos_iii_I: "Handsome, eloquent and fond of philosophical debate and lavish banquets, Andronikos III is the capital’s star emperor. Yet his excesses exact a toll on both his body and his standing as the empire’s ruler.\n\nInitial Health: #Y 10#!. Current Health: #Y [GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_andronikos_current_health')|1]#!. Health does not decay automatically; events or actions may reduce it. At 0, The Emperor Falls Gravely Ill triggers: Byzantium loses 10 Legitimacy and Andronikos III dies."
 oe_byz_andronikos_iii_II: "Field Commander"
 desc_oe_byz_andronikos_iii_II: "Andronikos III often commanded from the front lines, even leading charges himself. He was skilled in using heavy cavalry and Turkic light cavalry. His tactical system was built around the mobility and impact of cavalry.\n\nA military trait reserved for Andronikos III; it is never acquired randomly."
 STATIC_MODIFIER_NAME_oe_byz_andronikos_iii_III: "Supporters of the Purple"
 STATIC_MODIFIER_DESC_oe_byz_andronikos_iii_III: "The military aristocrats who supported [GetCharacter('byz_andronikos_iii_palaiologos').GetName] from the beginning of the civil war were all rewarded handsomely. After he ascended the throne, this group of military aristocrats, led by [GetCharacter('byz_john_kantakouzenos').GetName], remained the Emperor's right-hand men."
 oe_byz_theme_system_subject: "Imperial Theme"
 oe_byz_theme_system_subject_desc: "This country is an Imperial Theme of [GetCountry('BYZ').GetName]. It is a civil-military organization that essentially solved the difficulties of recruitment and military funding, and also controlled the disorganized state of population movement, alleviating acute social contradictions.\n\nThe military law's maintenance, food consumption and loyalty effects are applied directly by this reform. Only maintenance support scales with Byzantium's theme military pay setting."
 oe_real_gov_reform_building_com: "Imperial Academy of Engineering"
 oe_real_gov_reform_building_com_desc: "The main duty of this institution are to construct large buildings, plan urban layouts, and organize engineering projects."
 OE_THEME_MILITARY_LAW_ACTIVE: "An Imperial Theme subject of Byzantium while the Imperial Pillars enact Governor Administration or Central Control"
 OE_THEME_CENTRAL_LAW_ACTIVE: "An Imperial Theme subject of Byzantium while the Imperial Pillars enact Central Control"
