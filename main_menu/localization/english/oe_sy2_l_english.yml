 OE_SY2_GUI_ELR_TITLE: "Act IV Nostos: Return of the Purple Eagles"
 OE_SY2_GUI_ELR_STG_L: "Nostos Campaign"
 OE_SY2_GUI_ELR_STG_R: "Grand Ending (4)"
