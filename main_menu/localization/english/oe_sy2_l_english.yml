# NEW 2026-11-23 v21.0 Step 5 / P1: 5 Strategic Goods Economic Loop Closure, Cross-Module Vertical Integration & 6 Native Situation GUIs (oe_sy2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v210_p1_synergy_gui.py; edit the generator, not this file.
 oe_sy2_steam_dockyard: "Steam Admiralty Dockyard"
 oe_sy2_steam_dockyard_desc: "An Age of Absolutism and Revolutions naval complex powered by Steam Engines, Refined Steel, and Marine Chronometers. Expands parallel ship slips, harbor suitability, and maritime presence while bridging nationwide sailor, ship-build speed, and heavy-ship upkeep bonuses."
 oe_sy2_arsenal_foundry: "Bessemer Steel Arsenal"
 oe_sy2_arsenal_foundry_desc: "An advanced heavy-ordnance arsenal unlocked in the Age of Absolutism and Revolutions. Consumes Refined Steel and Industrial Chemicals either to sustain imperial siege logistics or to cast high-pressure Bessemer cannons, reinforcing national artillery power, discipline, and siege ability."
 oe_sy2_porcelain_exchange: "Porcelain & Tea Trade Exchange"
 oe_sy2_porcelain_exchange_desc: "A chartered Age of Discovery commercial exchange pairing Export Porcelain & Tea Chests with Marine Chronometers. Multiplies local merchant power, capacity, and market access while boosting national sea-trade efficiency, burgher satisfaction, and trade income."
 oe_sy2_chemical_dye_works: "Industrial Chemical & Alkali Works"
 oe_sy2_chemical_dye_works_desc: "An Age of Reformation and Absolutism finishing plant consuming Industrial Chemicals to bleach fine cloth and press paper at factory volume while raising local textile, paper, and dye output alongside urban development."
 oe_sy2_canal_lock_authority: "Grand Canal Hydraulic Lock Authority"
 oe_sy2_canal_lock_authority_desc: "Unlocked upon owning any completed Great Intercontinental Canal (Suez, Panama, Kiel, Volga–Don, or Imperial Grand Canal). Consumes Steam Engines and Refined Steel to maximize canal market access, merchant throughput, administrative control, and capital proximity."
 oe_sy2_pm_steam_dockyard_ops: "Steam Drydock & Chronometer Fitting"
 oe_sy2_pm_steam_dockyard_ops_desc: "Powers drydock drainage pumps with steam engines, reinforces warship frames with refined steel, and calibrates marine chronometers for ocean squadrons."
 oe_sy2_pm_arsenal_foundry_maint: "Refined-Steel Arsenal & Chemical Proofing"
 oe_sy2_pm_arsenal_foundry_maint_desc: "Maintains heavy boring mills, chemical powder-proofing labs, and standardized artillery carriages for siege and field batteries."
 oe_sy2_pm_porcelain_exchange_ops: "Export Porcelain & Clipper Clearing House"
 oe_sy2_pm_porcelain_exchange_ops_desc: "Grades export porcelain-tea chests, issues chronometer-timed convoy bills of lading, and settles bullion remittances across oceanic exchanges."
 oe_sy2_pm_canal_lock_steam_ops: "Steam Dredgers & Steel Hydraulic Gates"
 oe_sy2_pm_canal_lock_steam_ops_desc: "Operates steam-driven lock pumps, Bessemer steel sluice leaves, and continuous dredging barges to keep great intercontinental canals navigable year-round."
 oe_sy2_pm_bessemer_ordnance_casting: "Bessemer Steel & Chemical-Proofed Ordnance"
 oe_sy2_pm_bessemer_ordnance_casting_desc: "Casts seamless high-pressure refined-steel artillery barrels and pairs them with chemically purified powder charges for unmatched range and siege power."
 oe_sy2_pm_alkali_fine_cloth: "Alkali-Bleached & Colorfast Fine Textiles"
 oe_sy2_pm_alkali_fine_cloth_desc: "Uses manufactured soda ash, mineral bleaches, and synthetic mordants to turn raw cotton and wool into radiant luxury drapery at factory speed."
 oe_sy2_pm_bleached_rag_paper: "Chemical-Bleached Pulp & Press Paper"
 oe_sy2_pm_bleached_rag_paper_desc: "Digests linen fiber and timber pulp with industrial alkalis and bleaches, flooding printing presses, bureaucracies, and merchant bourses with crisp paper."
 AUTO_MODIFIER_NAME_oe_sy2_auto_steam_dockyard_net: "Steam Admiralty Dockyard Network"
 AUTO_MODIFIER_DESC_oe_sy2_auto_steam_dockyard_net: "Operational Steam Admiralty Dockyards supplied with steam engines, refined steel, and marine chronometers expand sailor capacity, hasten fleet construction, and cut heavy-ship upkeep."
 AUTO_MODIFIER_NAME_oe_sy2_auto_arsenal_foundry_net: "Bessemer Steel Arsenal Logistics"
 AUTO_MODIFIER_DESC_oe_sy2_auto_arsenal_foundry_net: "Bessemer Steel Arsenals fed by refined steel and industrial chemicals equip field armies with standardized steel artillery, tighter discipline, and superior siege breaching."
 AUTO_MODIFIER_NAME_oe_sy2_auto_porcelain_exchange_net: "Porcelain & Tea Maritime Exchange Network"
 AUTO_MODIFIER_DESC_oe_sy2_auto_porcelain_exchange_net: "Chartered Porcelain & Tea Trade Exchanges paired with precision chronometers amplify national merchant power, maritime trade efficiency, burgher satisfaction, and customs revenue."
 AUTO_MODIFIER_NAME_oe_sy2_auto_chemical_dye_works_net: "Industrial Alkali & Chemical Finishing Grid"
 AUTO_MODIFIER_DESC_oe_sy2_auto_chemical_dye_works_net: "Industrial Chemical & Alkali Works raise cloth, fine drapery, and paper productivity nationwide while accelerating urban development and applied chemical research."
 AUTO_MODIFIER_NAME_oe_sy2_auto_canal_lock_authority_net: "Intercontinental Hydraulic Lock Authority"
 AUTO_MODIFIER_DESC_oe_sy2_auto_canal_lock_authority_net: "Steam-powered Hydraulic Lock Authorities along our completed Great Canals multiply maritime and overland trade throughput while projecting rapid administrative control from the capital."
 oe_sy2_refill_winter_provinces_tt: "Up to #Y 4#! strained or starving provinces receive #G +35%#! emergency food reserves."
 oe_sy2_promote_skilled_urban_pops_tt: "Up to #Y 2#! of our most developed towns or cities promote #G Peasant#! pops into skilled #G Laborers#! and #G Burghers#!."
 oe_sy2_dec_strategic_goods_consortium.title: "Charter a Strategic Goods Supply Consortium"
 oe_sy2_dec_strategic_goods_consortium.desc: "Unite domestic steelworks, chemical manufactories, porcelain-tea kilns, chronometer guilds, and steam ironworks under a single imperial clearing consortium. Boosts output of all #Y 5 Strategic Goods#! by #G +15%#!, elevates national production efficiency and trade income for #Y 25#! years, pleases Burghers, and promotes skilled urban pops. Costs #Y 250#! gold (20-year cooldown)."
 oe_sy2_dec_strategic_goods_consortium.a: "Sign the Imperial Supply Consortium Charter"
 oe_sy2_dec_hydraulic_canal_syndicate.title: "Establish an Intercontinental Canal Hydraulic Board"
 oe_sy2_dec_hydraulic_canal_syndicate.desc: "Deploy refined-steel sluice gates and steam-dredge maintenance teams across our completed Great Canals. Grants the #G Intercontinental Canal Hydraulic Board#! modifier for #Y 25#! years (+10% maritime & overland trade efficiency, +12% merchant capacity, higher control and prosperity) and develops the capital. Costs #Y 300#! gold (25-year cooldown)."
 oe_sy2_dec_hydraulic_canal_syndicate.a: "Commission the Hydraulic Lock Board"
 oe_sy2_dec_winter_granary_charter.title: "Mobilize the Imperial Winter Granary & Credit Compact"
 oe_sy2_dec_winter_granary_charter.desc: "Coordinate banking credit networks, ever-normal granaries, and steppe winter-fodder camps to blunt Little Ice Age cold snaps and harvest shortfalls. Immediately replenishes food in up to #Y 4#! strained provinces and grants #G Imperial Winter Granary & Credit Compact#! for #Y 12#! years. Costs #Y 160#! gold (10-year cooldown)."
 oe_sy2_dec_winter_granary_charter.a: "Release Emergency Granary Credits"
 oe_sy2_dec_viceroy_diet_compact.title: "Convene a Regency & Viceroyalty Constitutional Diet"
 oe_sy2_dec_viceroy_diet_compact.desc: "Summon parliamentary deputies, armed estate leaders, and provincial viceroys to reaffirm sovereign authority during regencies or feudal friction. Lowers all subjects' liberty desire by #G -12#!, steadies noble satisfaction, and grants #G Constitutional Regency & Viceroyalty Diet Accord#! for #Y 12#! years. Costs #Y 150#! gold (10-year cooldown)."
 oe_sy2_dec_viceroy_diet_compact.a: "Ratify the Imperial Diet Compact"
 STATIC_MODIFIER_NAME_oe_sy2_mod_strategic_consortium: "Imperial Strategic Goods Supply Consortium"
 STATIC_MODIFIER_DESC_oe_sy2_mod_strategic_consortium: "A chartered cartel linking steelworks, chemical plants, export kilns, horologists, and steam ironworks synchronizes supply chains across every major market."
 STATIC_MODIFIER_NAME_oe_sy2_mod_canal_hydraulic_board: "Intercontinental Canal Hydraulic Board"
 STATIC_MODIFIER_DESC_oe_sy2_mod_canal_hydraulic_board: "Centralized hydraulic engineers standardize lock tolls, steam-dredge maintenance, and merchant barge schedules across our completed great canals."
 STATIC_MODIFIER_NAME_oe_sy2_mod_winter_granary_compact: "Imperial Winter Granary & Credit Compact"
 STATIC_MODIFIER_DESC_oe_sy2_mod_winter_granary_compact: "Synchronized merchant grain credits, provincial ever-normal granaries, and herd-fodder depots shield populations from Little Ice Age harvest failures."
 STATIC_MODIFIER_NAME_oe_sy2_mod_constitutional_diet_accord: "Constitutional Regency & Viceroyalty Diet Accord"
 STATIC_MODIFIER_DESC_oe_sy2_mod_constitutional_diet_accord: "A formal compact ratified by parliament, noble estates, and regional viceroys binds provincial commands to the throne during minority rule and succession transitions."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev1_bank_granary_relief: "Bank-Backed Emergency Grain Network"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev1_bank_granary_relief: "Bills of exchange from chartered banking networks buy surplus grain from warm southern ports before frost famine can strike."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev1_crown_grain_levy: "Crown Emergency Grain Requisition"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev1_crown_grain_levy: "Imperial commissioners commandeer estate storehouses directly to keep garrison cities and capitals supplied through severe frosts."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev2_steppe_winter_camps: "Funded Steppe Winter-Camp Guardrails"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev2_steppe_winter_camps: "Protected river-valley winter camps stocked with hay and oasis grain preserve Mongol and Kipchak war-horse herds through lethal dzud freezes."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev2_border_forage_raids: "Winter Frontier Forage Expeditions"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev2_border_forage_raids: "Hard-pressed tumens ride out of frozen pastures to seize grain and silver from neighboring sedentary borderlands."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev3_celestial_granary_shield: "Restored Central Plains Ever-Normal Granaries"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev3_celestial_granary_shield: "Opened imperial granaries and silver relief drafts calm river-basin peasants, depriving rebel sects of famine recruits."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev3_marshal_grain_corvee: "Provincial Marshal Military Grain Corvee"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev3_marshal_grain_corvee: "Empowering regional military marshals to levy grain directly keeps imperial banners fed in the field at the cost of deeper aristocratic leverage."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev4_diet_regency_accord: "Parliamentary Oversight of Estate Regiments"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev4_diet_regency_accord: "Channeling noble private regiments under a sworn Crown Diet charter neutralizes factional coups while keeping aristocratic banners loyal."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev4_magnate_stipend_pact: "Magnate Private-Regiment Stipend Pact"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev4_magnate_stipend_pact: "Generous treasury stipends buy the temporary swords of magnate household regiments during a delicate regency, bolstering martial power while inflating noble clout."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev5_viceroy_diet_compact: "Imperial Council of Viceroys & Uluses"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev5_viceroy_diet_compact: "Inviting provincial viceroys, feudal peers, and ulus amirs into a sworn regency compact stabilizes far-flung dominions without bloodshed."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev5_palace_hostage_audit: "Regency Palace Hostage & Fiscal Audit"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev5_palace_hostage_audit: "Demanding heirs at court and auditing viceroyalty tax farms fills the royal treasury and tightens crown grip, though distant governors chafe."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev6_parliament_regency_shield: "Codified Parliamentary Regency Statute"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev6_parliament_regency_shield: "An enduring statutory council shields minority reigns and royal tutors from factional ambush while elevating civic trust across all estates."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev6_dynastic_co_regency: "Imperial Co-Emperor & Grand Chancellery"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev6_dynastic_co_regency: "Elevating a senior dynastic partner as co-ruler streamlines imperial cabinet decrees and projects unbroken sovereign majesty."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev7_io_industrial_league: "Multilateral Eurasian Industrial Standards"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev7_io_industrial_league: "Shared steel gauges, chemical safety standards, and steam patents across our international organization accelerate joint industrialization and skilled urbanization."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev7_national_foundry_monopoly: "Protected Crown Foundry & Chemical Monopoly"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev7_national_foundry_monopoly: "Keeping crucible formulas and chemical retorts strictly within sovereign borders maximizes domestic heavy-industry margins."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev8_maritime_meridian_standard: "Prime Meridian & Admiralty Navigation League"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev8_maritime_meridian_standard: "Synchronizing marine chronometers, sea charts, and steam coaling stations establishes undisputed oceanic reach and low-loss clipper routes."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev8_crown_clipper_charter: "Chartered Crown Porcelain-Clipper Guilds"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev8_crown_clipper_charter: "Fast chronometer-guided merchant clippers monopolize peak seasonal porcelain and tea arrivals at premier world bourses."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev9_industrial_bond_anchor: "Industrial-Collateral Sovereign Bond Anchor"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev9_industrial_bond_anchor: "Backing state credit directly against audited steelworks, dockyards, and canal tolls calms bourse panic and lowers sovereign borrowing costs."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev9_overleveraged_steam_boom: "Speculative Steam & Steel Credit Boom"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev9_overleveraged_steam_boom: "Unleashing joint-stock foundry shares supercharges factory construction across every city, though feverish credit pushes borrowing costs higher."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev10_silk_road_opportunity: "Armored Trans-Eurasian Caravan Escorts"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev10_silk_road_opportunity: "Diplomatic safe-conducts with breakaway Transoxianan and Tarim amirs capture surging overland silk and silver tolls after the Chagatai fracture."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev10_maritime_silk_pivot: "Southern Maritime Silk & Spice Diversion"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev10_maritime_silk_pivot: "When steppe wars disrupt oasis passes, merchants pivot decisively to armed convoys linking the Black Sea, Red Sea, and China Seas."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev11_indian_ocean_port_charter: "Western Indian Ocean Enclave Port Charters"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev11_indian_ocean_port_charter: "Breakaway governors in Gujarat, Deccan, and the Levant grant fortified factoria privileges, opening direct spice and calico arteries."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev11_red_sea_spice_leverage: "Red Sea & Monsoon Customs Leverage"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev11_red_sea_spice_leverage: "Neutral commercial treaties with rival emirs bypass war-torn monopolies and channel pepper, cloves, and textiles straight into our customs houses."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev12_rus_liberation_momentum: "Rus' Princely Liberation Momentum"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev12_rus_liberation_momentum: "Turmoil in Sarai emboldens Orthodox princes to withhold Tatar tribute, rally druzhina banners, and strike for full sovereignty along the Oka and Volga."
 STATIC_MODIFIER_NAME_oe_sy2_mod_ev12_rus_kremlin_revival: "White-Stone Kremlin & Volga Trade Revival"
 STATIC_MODIFIER_DESC_oe_sy2_mod_ev12_rus_kremlin_revival: "Retained tribute bullion funds white-stone citadels, river fur depots, and fortified market towns across the Rus' heartland."
 oe_sy2.1.title: "Frozen Harvests & the Granary Credit Network"
 oe_sy2.1.desc: "Killing frosts of the Little Ice Age have locked rivers in thick ice and halved autumn yields across our northern provinces. Yet our chartered banking syndicates and municipal granary houses stand ready to draw bills of exchange on southern grain ports—if the crown matches their credit guarantees rather than seizing private stores by force."
 oe_sy2.1.a: "Underwrite Banking Grain Credits Across the Realm"
 oe_sy2.1.b: "Enforce Direct Crown Grain Requisitions"
 oe_sy2.2.title: "Iron Frost on the Steppe Pastures"
 oe_sy2.2.desc: "An iron crust of freezing rain has sealed the grass beneath unbreakable ice from the Volga and Syr Darya to the Ili valleys. Clan elders of our steppe wings warn that without royal silver to fortify sheltered river-valley winter camps and purchase oasis fodder, tens of thousands of warhorses will perish before spring thaw."
 oe_sy2.2.a: "Fund Sheltered Winter-Camp Guardrails & Oasis Fodder"
 oe_sy2.2.b: "Unleash Winter Forage Raids on Sedentary Borderlands"
 oe_sy2.3.title: "Yellow River Ice & the Ever-Normal Granaries"
 oe_sy2.3.desc: "Bitter winter freezes and silt-choked river dikes have compounded unrest across the Central Plains. While millenarian agitators preach rebellion in starving market towns, treasury censors propose pairing state ever-normal granaries with merchant silver drafts to feed displaced peasants and steady provincial garrisons."
 oe_sy2.3.a: "Open Imperial Ever-Normal Granaries & Merchant Relief Drafts"
 oe_sy2.3.b: "Empower Provincial Marshals to Requisition Field Rations"
 oe_sy2.4.title: "Regency Council & the Magnate Private Regiments"
 oe_sy2.4.desc: "With the throne governed by a regency council, great magnate houses have quietly mustered their private estate regiments along the approaches to the capital. Envoys from their faction insist they assemble only to protect the royal minority—yet their captains openly demand fresh tax immunities unless parliament and the crown check their leverage."
 oe_sy2.4.a: "Bring Estate Regiments Under Crown Diet & Parliamentary Audit"
 oe_sy2.4.b: "Buy Magnate Household Captains with Treasury Stipends"
 oe_sy2.5.title: "Viceroyalties & Feudal Lords Test a Young Sovereign"
 oe_sy2.5.desc: "Sensing divided counsel at court, provincial viceroys, feudal vassals, and frontier ulus amirs have delayed their seasonal remittances and begun negotiating privately among themselves. Without a decisive show of either consultative statesmanship or palace resolve, imperial authority over the outer dominions will fray."
 oe_sy2.5.a: "Summon an Imperial Council of Viceroys & Ulus Lords"
 oe_sy2.5.b: "Enforce Palace Hostages and Viceroyalty Tax Audits"
 oe_sy2.6.title: "The Estates Guarantee the Royal Minority"
 oe_sy2.6.desc: "Drawing strength from our parliamentary institutions and classical royal education, jurists and estate deputies offer to codify a permanent regency charter—either anchoring succession inside a sworn constitutional diet or investing a seasoned dynastic co-emperor to guide the cabinet."
 oe_sy2.6.a: "Codify a Sworn Parliamentary Regency Statute"
 oe_sy2.6.b: "Invest a Senior Dynastic Co-Emperor & Chancellor"
 oe_sy2.7.title: "The Eurasian Industrial Standards Charter"
 oe_sy2.7.desc: "Delegates from fellow members of our international league marvel at the uniform Bessemer steel ingots, alkali reagents, and steam fittings emerging from our manufactories. Foreign chambers of commerce urge us to sponsor a shared industrial standards charter across the entire league, while domestic guildmasters argue for hoarding our metallurgical edge."
 oe_sy2.7.a: "Sponsor Multilateral Industrial Standards Across the League"
 oe_sy2.7.b: "Guard Crown Foundry & Chemical Secrets at Home"
 oe_sy2.8.title: "Prime Meridian & Admiralty Navigation League"
 oe_sy2.8.desc: "With gimballed marine chronometers rolling out of our instrument guilds and steam-equipped dockyards refitting ocean clippers, our admiralty stands poised to define the meridian charts of global shipping. Merchant houses clamor for exclusive tea-and-porcelain clipper charters, while naval theorists envision a standardized trans-oceanic admiralty league."
 oe_sy2.8.a: "Proclaim the Prime Meridian & Admiralty Navigation Standard"
 oe_sy2.8.b: "Charter Exclusive Crown Porcelain-Clipper Syndicates"
 oe_sy2.9.title: "Foundry Scrip, Steam Shares & Bourse Fever"
 oe_sy2.9.desc: "Speculative fever on the sovereign exchange has collided with our rapid industrial buildout. Brokers are trading leveraged scrip backed by steelworks, chemical plants, and canal concessions at dizzying multiples. Prudent central bankers urge anchoring state bonds strictly to physical strategic-goods revenue, while promoters clamor for cheap leverage to double factory construction."
 oe_sy2.9.a: "Anchor Sovereign Bonds to Audited Strategic-Goods Output"
 oe_sy2.9.b: "Unleash Leveraged Joint-Stock Foundry Expansion"
 oe_sy2.10.title: "Fracture of the Chagatai Ulus: Silk Road Realignment"
 oe_sy2.10.desc: "Dispatches from Samarkand, Almaliq, and the Black Sea ports confirm that the Chagatai Ulus has fractured between Transoxianan amirs and eastern Moghul khans. Silk caravans face shifting tolls across the Tian Shan passes—creating a golden opening for bold merchant syndicates to renegotiate overland escorts or pivot bullion into maritime silk convoys."
 oe_sy2.10.a: "Dispatch Armored Caravan Escorts & Ortogh Factors"
 oe_sy2.10.b: "Divert Bullion into Southern Maritime Silk Convoys"
 oe_sy2.11.title: "Fissures in Delhi & Cairo: The Indian Ocean Opening"
 oe_sy2.11.desc: "Internal fractures among Delhi's provincial iqta viceroys and Mamluk Syrian-Red Sea niyabats have cracked open the tightly policed spice bottlenecks of Gujarat, Aden, and Alexandria. Regional emirs eager for silver, artillery, and diplomatic recognition are courting foreign admirals and Far Seas merchant factors with lucrative port charters."
 oe_sy2.11.a: "Charter Fortified Western Indian Ocean Port Factorias"
 oe_sy2.11.b: "Strike Neutral Red Sea & Monsoon Customs Treaties"
 oe_sy2.12.title: "Cracks in Sarai: The Rus' Awakening"
 oe_sy2.12.desc: "Word rides north along the Don and Volga: civil strife and fracturing steppe wings have sapped the once-unquestioned terror of the Golden Horde. Boyars, bishops, and burghers fill our council chamber urging the Grand Prince either to withhold Tatar tribute outright and rally the Rus' banners for liberation, or to pour retained silver into white-stone kremlins and Volga trade."
 oe_sy2.12.a: "Rally the Orthodox Banners and Withhold Sarai Tribute"
 oe_sy2.12.b: "Invest Retained Tribute in White-Stone Kremlins & Volga Trade"
