l_english:
 oe_theme_usurp.1.t: "The Strategos Refuses"
 oe_theme_usurp.1.d: "The strategos of [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_recall_target').GetCountry.GetName] pleads pressing matters on the frontier and refuses the summons. The order was issued for nothing, and the court's standing suffers."
 oe_theme_usurp.1.a: "Remember this (Imperial Authority −1, that theme's loyalty -5)"
 oe_theme_usurp.2.t: "The Summons Provokes a Rising"
 oe_theme_usurp.2.d: "When the summons reached [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_recall_target').GetCountry.GetName], the strategos tore up the decree before the envoy's eyes. The camps are sharpening their blades; next month he will rise."
 oe_theme_usurp.2.a: "We should have known"
 oe_theme_usurp.3.t: "The General Enters the City"
 oe_theme_usurp.3.d: "The rebels have held Constantinople for 6 months, and at last the Senate and the Patriarch open the palace gates. The rebel general is crowned in Hagia Sophia; the old imperial house is dead or scattered. From Phokas to Skleros, the empire has seen this story many times."
 oe_theme_usurp.3.a: "A new emperor reigns (legitimacy set to 30, stability falls, every theme's loyalty reset to 50)"
 oe_theme_usurp.4.t: "A Soldiers' Coup"
 oe_theme_usurp.4.d: "While the court still quarrelled over the succession, the strategos of [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_coup_theme').GetCountry.GetName] marched into the city with his army. Before the great families could put forward their own man, the purple was on a soldier's shoulders."
 oe_theme_usurp.4.a: "The army has chosen the emperor"
 oe_theme_usurp.4.tt: "The emperor, heir and regent #R die#!; the strategos takes the throne. His theme is abolished and its army and treasury pass to the empire. Other themes' loyalty -10."
 OE_THEME_RECALL_RISK_TT: "An estranged strategos refuses 25% of the time (Imperial Authority −1, that theme's loyalty -5); a treasonous one rises 30% of the time."
 OE_THEME_UI_BTN_DISARM: "Disarm"
 OE_THEME_UI_BTN_DISARM_DESC: "Take back command: 3 Imperial Authority; half the theme's armies (rounded up) pass to the empire, current loyalty -10; the smaller army raises its loyalty target. Once per 10 years per theme."
 OE_THEME_UI_AMBITION: "#R Eyes the throne#!"
 OE_THEME_UI_AMBITION_TT: "This strategos's loyalty is below 40 and his army is among the 3 largest. When the court intrigue produces a coup, there is a 40% chance he leads it."
 OE_THEME_UI_USURP: "Rebels holding Constantinople: #R [GetCountry('BYZ').MakeScope.GetVariable('oe_theme_usurp_months').GetValue|0]#! / 6 months (at 6 the rebel general takes the throne)"
