l_english:
 oe_sit_v47_varna_crusade: "Varna Victorious: Three-Crown Balkan Crusade"
 oe_sit_v47_varna_crusade_desc: "In 1444, Poland, Hungary, and Byzantium stand inches from overturning history along the Danube and Black Sea coast. Coordinate the Jagiellon-Hunyadi-Palaiologos Three-Crown Compact, lock down the Hellespont with allied galleys, and unleash Hunyadi's war-wagons to liberate Rumelia—or rally an Ottoman Counter-Jihad to keep the crescent supreme from Edirne to Belgrade."
 oe_v47_varna_end_crusade_victory: "Varna Victorious: Liberation of the Balkans"
 oe_v47_varna_end_crusade_victory_desc: "Disciplined allied command and unbroken strait blockades overturn the disaster of 1444, breaking Ottoman dominance south of the Danube and inaugurating a Three-Crown Balkan order."
 oe_v47_varna_end_ottoman_triumph: "Crescent Over the Danube"
 oe_v47_varna_end_ottoman_triumph_desc: "Sultan Murad's counter-jihad shatters the Three-Crown coalition at the gates of Rumelia, cementing Ottoman supremacy across the Balkans for generations."
 oe_v47_varna_end_danube_stalemate: "Danubian Partition & Armed Truce"
 oe_v47_varna_end_danube_stalemate_desc: "By 1520, neither crusade nor counter-jihad has won an absolute knockout; stone fortresses and seasoned frontier armies settle into an armed Danubian balance."
 oe_v47_varna_map_crusade_tt: "#Y Three-Crown Crusade Coalition#!: Poland, Hungary, Byzantium, and Balkan/Venetian allies pressing south across the Danube."
 oe_v47_varna_map_ottoman_tt: "#Y Ottoman Rumelian Host#!: The Ottoman Sultanate and allies holding Edirne, Anatolia, and the Danubian approaches."
 oe_v47_varna_map_front_tt: "#Y Contested Balkan-Danube Theater#!: Strategic marches, river crossings, and mountain passes contested by both hosts."
 oe_v47_varna_legend_crusade: "Three-Crown Crusade Allies"
 oe_v47_varna_legend_ottoman: "Ottoman Rumelian Host"
 oe_v47_varna_legend_front: "Contested Balkan-Danube Front"
 OE_V47_VARNA_GUI_HDR_ERA: "Crusade Window"
 OE_V47_VARNA_GUI_HDR_METER: "Crusade Momentum"
 OE_V47_VARNA_GUI_CARD_TITLE: "Jagiellon, Hunyadi & Palaiologos vs. Rumelia"
 OE_V47_VARNA_GUI_CARD_BODY: "Push Crusade Momentum to +75 (or expel the Ottomans from both Varna and Edirne after 1452) for Varna Victorious, or drive Momentum to -75 as the Ottomans to seal Crescent Over the Danube. Five interactive Situation actions govern war-wagons, strait blockades, Balkan charters, and Counter-Jihad."
 OE_V47_VARNA_GUI_GAUGE_LABEL: "Crusade Momentum (-100 Ottoman <---> +100 Three-Crown)"
 OE_V47_VARNA_GUI_FOOTNOTE: "Data Map: Gold marks Three-Crown Crusade allies; Crimson marks the Ottoman Rumelian host; Steel Blue highlights contested Balkan and Carpathian marches."
 hint_oe_sit_v47_varna_crusade: "[GetSituationByKey('oe_sit_v47_varna_crusade').GetNameWithNoTooltip]"
 hint_oe_sit_v47_varna_crusade_hint_text: "#T Overview#!\n@hint! #Y Varna Victorious: Three-Crown Balkan Crusade#! unfolds between #Y 1444 and 1520#!. Coordinate #Y Poland#!, #Y Hungary#!, and #Y Byzantium#! via five Situation actions to push #Y Crusade Momentum#! toward #G +75#!—or strike back as the #Y Ottomans#! to push Momentum down to #R -75#!."
 hint_oe_sit_v47_varna_crusade_administrative: "Proclaim Balkan Liberation Charters to accelerate provincial integration and manpower across Bulgaria, Serbia, and Thrace at a modest crown-power tradeoff."
 hint_oe_sit_v47_varna_crusade_diplomatic: "Sealing the Three-Crown Compact grants a fresh Crusade Casus Belli against the Ottomans alongside +1.2 Diplomatic Reputation and +16 Crusade Momentum."
 hint_oe_sit_v47_varna_crusade_military: "Pair Danubian War-Wagons & Lancers (+10% Heavy Cavalry Power, +7% Siege Ability) with the Hellespont Galley Blockade to defeat Ottoman armies piecemeal."
 oe_sit_v47_third_rome_union: "Twin Eagles of Moscow & Constantinople"
 oe_sit_v47_third_rome_union_desc: "Princess Sophia Palaiologina's marriage into Moscow opens a grand imperial axis spanning from the Kremlin to the Bosphorus. Whether Byzantium survived to forge a living Co-Emperorship of the Northern Caesar and Basileus, OR fell and passed the imperial mantle of the Third Rome north to Moscow, unite the Twin Eagles through dynastic embassies, the Double-Headed Eagle Seal, the Black Sea Orthodox League, and a Greco-Russian Renaissance."
 oe_v47_twin_end_co_emperorship: "Twin Eagles Ascendant: Northern Caesar & Basileus"
 oe_v47_twin_end_co_emperorship_desc: "With Constantinople still standing and Twin-Eagle Cohesion above 85, Moscow and New Rome formalize an unbroken Orthodox Diarchy from the White Sea to the Aegean."
 oe_v47_twin_end_third_rome: "Moscow the Third Rome: Translatio Imperii"
 oe_v47_twin_end_third_rome_desc: "With Constantinople fallen and Twin-Eagle Cohesion above 85, Moscow solemnly assumes the purple mantle of the Third Rome, standing as the unbroken imperial shield of Orthodoxy."
 oe_v47_twin_end_separate_destinies: "Orthodox Commonwealth of North & South"
 oe_v47_twin_end_separate_destinies_desc: "By 1565, Moscow and the Greek East settle into a fraternal cultural and liturgical commonwealth while charting independent political destinies."
 oe_v47_twin_map_axis_tt: "#Y Twin-Eagle Imperial Axis#!: Muscovy, Russia, Byzantium, Trebizond, Theodoro, and sworn partners of the Palaiologan-Rurikid union."
 oe_v47_twin_map_orthodox_tt: "#Y Orthodox Commonwealth Realms#!: Eastern Orthodox lands across Rus, the Balkans, and Pontus drawn into the cultural revival."
 oe_v47_twin_map_rivals_tt: "#Y Steppe, Ottoman & Baltic Rivals#!: Neighboring empires watching the rise of the Twin-Eagle Axis with wary alarm."
 oe_v47_twin_legend_axis: "Twin-Eagle Imperial Axis (MOS/RUS/BYZ)"
 oe_v47_twin_legend_orthodox: "Orthodox Commonwealth Realms"
 oe_v47_twin_legend_rivals: "Steppe, Ottoman & Baltic Rivals"
 OE_V47_TWIN_GUI_HDR_ERA: "Imperial Axis Era"
 OE_V47_TWIN_GUI_HDR_METER: "Twin-Eagle Cohesion"
 OE_V47_TWIN_GUI_CARD_TITLE: "Sophia Palaiologina, Double-Headed Eagle & Third Rome"
 OE_V47_TWIN_GUI_CARD_BODY: "Raise Twin-Eagle Cohesion to 85+ to complete the Situation! If Byzantium survives, you unlock Twin-Eagle Co-Emperorship (Northern Caesar & Basileus); if Byzantium has fallen, you unlock Moscow the Third Rome (Translatio Imperii). Use all five actions to weave royal marriage, imperial seals, Black Sea leagues, and Kremlin scholarship."
 OE_V47_TWIN_GUI_GAUGE_LABEL: "Twin-Eagle Cohesion (85+ crowns Co-Emperorship or Third Rome)"
 OE_V47_TWIN_GUI_FOOTNOTE: "Data Map: Imperial Purple marks Twin-Eagle Axis members; Pontic Teal marks Orthodox realms; Burnt Terracotta highlights steppe, Ottoman, and Baltic rivals."
 hint_oe_sit_v47_third_rome_union: "[GetSituationByKey('oe_sit_v47_third_rome_union').GetNameWithNoTooltip]"
 hint_oe_sit_v47_third_rome_union_hint_text: "#T Overview#!\n@hint! #Y Twin Eagles of Moscow & Constantinople#! spans #Y 1460–1565#! and adapts dynamically to whether #Y Byzantium#! survived or fell! Reach #Y Twin-Eagle Cohesion 85+#! while Byzantium lives for #G Twin-Eagle Co-Emperorship#!, or after Constantinople falls for #G Moscow the Third Rome#!."
 hint_oe_sit_v47_third_rome_union_administrative: "Adopting the Double-Headed Eagle Seal (+12% Crown Power, +8% Cabinet Efficiency) pairs cleanly with Sponsoring the Greco-Russian Renaissance (+5% Research, +12% Institution Growth)."
 hint_oe_sit_v47_third_rome_union_diplomatic: "Dispatching the Palaiologina Marriage Embassy raises Diplomatic Reputation by +1.4 and unlocks the dynamic Northern Caesar vs. Third Rome investiture branch."
 hint_oe_sit_v47_third_rome_union_military: "Forging the Black Sea Orthodox League expands manpower and land-sea trade while Kremlin Stone Masters strengthen fort defense and siege cannon casting."
 oe_sit_v47_andalus_resurgent: "Al-Andalus Resurgent / New Cordoba Exile"
 oe_sit_v47_andalus_resurgent_desc: "In 1444, Nasrid Granada guards the final Muslim redoubt in Western Europe. Stand behind the Alhambra walls and rally Morocco and Mamluk Cairo across the Strait of Gibraltar to reclaim Cordoba and Seville—OR, if Iberian cannon press Granada to the brink, launch a daring Atlantic Exile Armada past West Africa to Brazil to found New Cordoba across the Sea of Darkness!"
 oe_v47_andalus_end_resurgent: "Al-Andalus Resurgent: Crescent Over Cordoba & Seville"
 oe_v47_andalus_end_resurgent_desc: "Against all odds, the Nasrid-Maghrebi-Mamluk coalition shatters the Reconquista tide, restoring Islamic rule, scholarship, and Mediterranean prosperity across southern Iberia."
 oe_v47_andalus_end_new_cordoba: "The New Cordoba Across the Sea"
 oe_v47_andalus_end_new_cordoba_desc: "Refusing extinction in Iberia, Andalusian navigators and scholars ride the Atlantic trade winds past Arguin and Cape Verde to raise a flourishing New Cordoba on the shores of Brazil."
 oe_v47_andalus_end_iberia_resolved: "Twilight of the Nasrid Frontier"
 oe_v47_andalus_end_iberia_resolved_desc: "By 1545, the decisive struggle over southern Iberia concludes, leaving behind enduring Andalusian hydraulics, silk craftsmanship, and maritime legends on both sides of the Strait."
 oe_v47_andalus_map_resurgent_tt: "#Y Al-Andalus Resurgent Camp#!: Granada, Morocco, Mamluks, and allies fighting to preserve and expand Islamic Iberia."
 oe_v47_andalus_map_reconquista_tt: "#Y Iberian Reconquista Crowns#!: Castile, Aragon, Portugal, and allies pressing the final conquest of Granada."
 oe_v47_andalus_map_exile_tt: "#Y Atlantic Exile Horizon (New Cordoba)#!: Cape Verde, West African waystations, Brazilian landfall shores, and exile voyagers."
 oe_v47_andalus_legend_resurgent: "Al-Andalus Resurgent (GRA/MOR/MAM)"
 oe_v47_andalus_legend_reconquista: "Iberian Reconquista Crowns"
 oe_v47_andalus_legend_exile: "New Cordoba Atlantic Exile Horizon"
 OE_V47_ANDALUS_GUI_HDR_ERA: "Andalusian Crossroads"
 OE_V47_ANDALUS_GUI_HDR_METER: "Andalusian Fortune"
 OE_V47_ANDALUS_GUI_CARD_TITLE: "Reconquista Reversal vs. Atlantic Exile to New Cordoba"
 OE_V47_ANDALUS_GUI_CARD_BODY: "Push Andalusian Fortune to +75 (or hold Granada, Cordoba, and Seville under Sunni banners) for Al-Andalus Resurgent! Or, if pressed to the brink, launch the Atlantic Exile Fleet to chart Cape Verde, West Africa, and Brazil and push Fortune below -65 to crown the New Cordoba Across the Sea."
 OE_V47_ANDALUS_GUI_GAUGE_LABEL: "Andalusian Fortune (-100 New Cordoba Exile <---> +100 Iberian Resurgence)"
 OE_V47_ANDALUS_GUI_FOOTNOTE: "Data Map: Emerald marks Al-Andalus & Maghreb/Mamluk allies; Warm Amber marks Iberian Reconquista crowns; Ocean Blue highlights the Atlantic Exile path to Cape Verde, West Africa, and Brazil."
 hint_oe_sit_v47_andalus_resurgent: "[GetSituationByKey('oe_sit_v47_andalus_resurgent').GetNameWithNoTooltip]"
 hint_oe_sit_v47_andalus_resurgent_hint_text: "#T Overview#!\n@hint! #Y Al-Andalus Resurgent / New Cordoba Exile#! runs from #Y 1444 to 1545#!. Two dramatic destinies await #Y Granada#!: push #Y Andalusian Fortune#! to #G +75#! (or retake Cordoba & Seville) with Moroccan & Mamluk aid, OR launch the #B Atlantic Exile Fleet#! past Cape Verde & West Africa to Brazil to found #Y New Cordoba#!."
 hint_oe_sit_v47_andalus_resurgent_administrative: "If holding Iberia, proclaim the Charter of Cordoba (+5% Research, +8% Production); if sailing into exile, combine the Atlantic Exile Fleet with Timbuktu's gold bridge."
 hint_oe_sit_v47_andalus_resurgent_diplomatic: "Rallying the Strait of Gibraltar Jihad grants a Reconquest of Andalusia Casus Belli against Castile while drawing Moroccan and Mamluk weight into Iberia."
 hint_oe_sit_v47_andalus_resurgent_military: "Fortifying the Alhambra & Vega Passes delivers +14% Fort Defense and -10% Land Attrition to bleed Castilian siege trains before counterattacking—or to buy time for the Exile Armada to sail!"
 oe_v47_act_varna_three_crown_compact: "Seal the Three-Crown Compact"
 oe_v47_act_varna_three_crown_compact_desc: "Bind Poland, Hungary, and Constantinople into a unified Balkan war council with synchronized marching orders and shared crusade war chests."
 oe_v47_act_varna_three_crown_compact_tt: "Shifts Crusade Momentum by #G +16#!, marks your realm in the #Y Three-Crown Crusade Camp#!, grants #Y Three-Crown Crusade Compact#! for 12 years, and provides a Crusade CB against the Ottomans if active."
 oe_v47_act_varna_danube_wagon_forts: "Deploy Danubian War-Wagons & Lancers"
 oe_v47_act_varna_danube_wagon_forts_desc: "Combine John Hunyadi's iron-chained Hussite wagon forts with Polish heavy lancers to anchor the Danube crossing and crush Janissary countercharges."
 oe_v47_act_varna_danube_wagon_forts_tt: "Shifts Crusade Momentum by #G +14#!, grants #G +6#! Army Tradition, and enacts #Y Danubian War-Wagon & Lancer Tactics#! for 12 years."
 oe_v47_act_varna_strait_blockade: "Seal the Hellespont & Bosphorus"
 oe_v47_act_varna_strait_blockade_desc: "Dispatch Venetian, Papal, and Byzantine war galleys to patrol the Narrows and sever Murad II's Anatolian army from Rumelia before Varna."
 oe_v47_act_varna_strait_blockade_tt: "Shifts Crusade Momentum by #G +15#!, grants #G +6#! Navy Tradition, and enacts #Y Hellespont & Bosphorus Galley Blockade#! for 12 years."
 oe_v47_act_varna_balkan_liberation_charter: "Proclaim Balkan Liberation Charters"
 oe_v47_act_varna_balkan_liberation_charter_desc: "Guarantee municipal charters and Orthodox-Catholic concord across Bulgaria, Serbia, and Thrace so liberated cities open their gates to allied columns."
 oe_v47_act_varna_balkan_liberation_charter_tt: "Shifts Crusade Momentum by #G +13#!, grants #G +4#! Stability, and enacts #Y Balkan Liberation & Autonomy Charters#! for 12 years."
 oe_v47_act_varna_ottoman_ghazi_rally: "Proclaim Rumelian Counter-Jihad"
 oe_v47_act_varna_ottoman_ghazi_rally_desc: "Force the Bosphorus under shore batteries, summon veteran Anatolian sipahis and Janissaries, and smash the Three-Crown Crusade before Edirne."
 oe_v47_act_varna_ottoman_ghazi_rally_tt: "Shifts Crusade Momentum by #R -18#! (Ottoman counter-offensive), grants #G +6#! Army Tradition, and enacts #Y Rumelian Ghazi Counter-Jihad#! for 12 years."
 oe_v47_act_twin_sophia_embassy: "Dispatch the Palaiologina Marriage Embassy"
 oe_v47_act_twin_sophia_embassy_desc: "Escort Princess Sophia Palaiologina with Greek scholars, imperial icons, and marriage treaties linking the Rurikid Kremlin directly to the Palaiologan purple."
 oe_v47_act_twin_sophia_embassy_tt: "Raises Twin-Eagle Cohesion by #G +12#!, grants #G +6#! Prestige, and enacts #Y Palaiologina Imperial Marriage Alliance#! for 12 years."
 oe_v47_act_twin_double_eagle_seal: "Adopt the Double-Headed Eagle Seal"
 oe_v47_act_twin_double_eagle_seal_desc: "Engrave the bicephalous eagle of East and West onto royal state seals, asserting sovereign imperial dignity across diplomacy and domestic law."
 oe_v47_act_twin_double_eagle_seal_tt: "Raises Twin-Eagle Cohesion by #G +13#!, grants #G +6#! Legitimacy, and enacts #Y Seal of the Double-Headed Eagle#! for 12 years."
 oe_v47_act_twin_northern_caesar: "Proclaim Northern Caesar or Third Rome"
 oe_v47_act_twin_northern_caesar_desc: "If Constantinople still flies the imperial eagle, crown Moscow as Northern Co-Emperor; if Byzantium has fallen, solemnly proclaim Moscow the Third Rome."
 oe_v47_act_twin_northern_caesar_tt: "Raises Twin-Eagle Cohesion by #G +14#!, grants #G +8#! Prestige, enacts #Y Investiture of the Northern Caesar#! for 14 years, and triggers the living-BYZ or fallen-BYZ coronation chronicle."
 oe_v47_act_twin_black_sea_league: "Forge the Black Sea Orthodox League"
 oe_v47_act_twin_black_sea_league_desc: "Connect Muscovy, Crimean Theodoro, Moldavia, and Constantinople into a Pontic defensive and commercial corridor guarding the steppe rivers and straits."
 oe_v47_act_twin_black_sea_league_tt: "Raises Twin-Eagle Cohesion by #G +11#!, grants #G +5#! Army Tradition, and enacts #Y Black Sea Orthodox Maritime League#! for 12 years."
 oe_v47_act_twin_greco_russian_renaissance: "Sponsor the Greco-Russian Renaissance"
 oe_v47_act_twin_greco_russian_renaissance_desc: "Invite Greek philologists, Athonite translators, and Renaissance stone architects to rebuild the Kremlin cathedrals and copy classical manuscripts."
 oe_v47_act_twin_greco_russian_renaissance_tt: "Raises Twin-Eagle Cohesion by #G +12#!, grants #G +10#! Research Progress, and enacts #Y Greco-Russian Cultural Renaissance#! for 14 years."
 oe_v47_act_andalus_alhambra_defiance: "Fortify the Alhambra & Vega Passes"
 oe_v47_act_andalus_alhambra_defiance_desc: "Turn the mountain passes of the Sierra Nevada and the watchtowers above Granada and Malaga into an unbroken fortress shield."
 oe_v47_act_andalus_alhambra_defiance_tt: "Shifts Andalusian Fortune by #G +14#!, grants #G +5#! Army Tradition, and enacts #Y Bastions of the Alhambra & Sierra Nevada#! for 12 years."
 oe_v47_act_andalus_gibraltar_jihad: "Rally the Strait of Gibraltar Jihad"
 oe_v47_act_andalus_gibraltar_jihad_desc: "Summon Moroccan cavalry across Gibraltar and Mamluk bronze artillery from Cairo to shatter the Christian blockade of southern Iberia."
 oe_v47_act_andalus_gibraltar_jihad_tt: "Shifts Andalusian Fortune by #G +16#!, grants #Y Strait of Gibraltar Relief Alliance#! for 12 years, and provides a Reconquest of Andalusia CB against Castile if active."
 oe_v47_act_andalus_cordoba_charter: "Proclaim the Charter of Cordoba & Seville"
 oe_v47_act_andalus_cordoba_charter_desc: "Reopen the libraries, hydraulic terraces, and silk workshops of the Guadalquivir basin to revive the intellectual splendor of Umayyad Al-Andalus."
 oe_v47_act_andalus_cordoba_charter_tt: "Shifts Andalusian Fortune by #G +16#!, grants #G +8#! Prestige, and enacts #Y Charter of the Great Mosque of Cordoba#! for 14 years."
 oe_v47_act_andalus_atlantic_exile_fleet: "Launch the Atlantic Exile Fleet (New Cordoba)"
 oe_v47_act_andalus_atlantic_exile_fleet_desc: "Load Nasrid scholars, astrolabes, and royal banners onto ocean-going caravels to chart Cape Verde, West Africa, and Brazil—founding New Cordoba beyond Iberian reach."
 oe_v47_act_andalus_atlantic_exile_fleet_tt: "Shifts Andalusian Fortune by #B -22#! (Exile Odyssey), charts #Y Cape Verde, Arguin, and coastal Brazil#!, claims an uncolonized Atlantic foothold if available, and enacts #Y Andalusian Atlantic Exile Armada#! for 15 years."
 oe_v47_act_andalus_iberia_reconquista_push: "Marshal the Reconquista Siege Train"
 oe_v47_act_andalus_iberia_reconquista_push_desc: "Cast bronze lombards, mobilize the Santa Hermandad, and drive the Nasrid frontier back toward the sea—forcing Granada into surrender or Atlantic exile."
 oe_v47_act_andalus_iberia_reconquista_push_tt: "Shifts Andalusian Fortune by #B -14#! (Reconquista pressure), grants #G +5#! Army Tradition, and enacts #Y Iberian Reconquista Siege Train#! for 12 years."
 oe_v47_eu1.1.title: "The Three Crowns Before Varna"
 oe_v47_eu1.1.desc: "In the autumn of 1444, war horns echo from Krakow and Buda down to the sea walls of Constantinople. The young King Wladyslaw of Poland and Hungary, the veteran Transylvanian commander John Hunyadi, and the Byzantine Palaiologoi stand on a razor's edge: Sultan Murad's main host is still anchored in Anatolia, and a disciplined, coordinated Balkan crusade could shatter Ottoman power across Rumelia for a century. Yet mistrust between Latin legates, Balkan Orthodox lords, and maritime Venice threatens to unravel the coalition before the Danube is even crossed."
 oe_v47_eu1.1.a: "Commit fully to the Three-Crown Crusade and levy an emergency Balkan war tithe."
 oe_v47_eu1.1.b: "Back Ottoman Rumelia and mobilize frontier ghazis to hold the Danube line."
 oe_v47_eu1.1.c: "Keep our garrisons cautious and demand ironclad border guarantees before marching."
 oe_v47_eu1.2.title: "The Jagiellon-Hunyadi-Palaiologos Compact"
 oe_v47_eu1.2.desc: "Beneath vaulted timber rafters in Buda and inside the Blachernae chancery in Constantinople, royal envoys affix crimson wax seals to a historic Three-Crown Compact. Unlike the fractured crusades of Nicopolis, the treaty establishes a single field command under John Hunyadi, binds Polish heavy cavalry to strict battle discipline, and promises Byzantium full restoration of Thrace and the Aegean coast in exchange for launching a simultaneous Peloponnesian diversion. Merchants and prelates alike whisper that Christendom has not fielded such unity in three centuries."
 oe_v47_eu1.2.a: "Ratify unified command under Hunyadi and pool royal war chests for the march."
 oe_v47_eu1.2.b: "Insist on rotating royal honors so noble pride is preserved alongside joint supply."
 oe_v47_eu1.2.c: "Secretly leak the alliance's timetable to Ottoman spies to keep both sides bled white."
 oe_v47_eu1.3.title: "Chains Across the Hellespont"
 oe_v47_eu1.3.desc: "Every strategist from Venice to Adrianople knows that the Balkan Crusade lives or dies upon a mile of blue water. In our historical memory, Genoese merchant captains were bribed with golden ducats to ferry Sultan Murad's Anatolian army across the Bosphorus while Christian galleys were blown off station. Today, Venetian war-galleys, Papal carracks, and Byzantine fire-ships patrol the Dardanelles and Bosphorus in tight interlocking squadrons, their bronze rams aimed squarely at any vessel daring to cross from Asia."
 oe_v47_eu1.3.a: "Pay Venetian and Genoese captains double retainer so not a single barge crosses from Asia."
 oe_v47_eu1.3.b: "Mount heavy shore artillery at Anadolu Hisari to blast the Christian galleys out of the narrows."
 oe_v47_eu1.3.c: "Protect commercial convoy routes first and avoid risking our flagship hulls in the current."
 oe_v47_eu1.4.title: "Wagon-Forts Along the Lower Danube"
 oe_v47_eu1.4.desc: "Timber pontoons groan beneath hoofbeats and iron-rimmed wheels as the Three-Crown host surges across the Lower Danube into northern Bulgaria. At the vanguard rolls John Hunyadi's fearsome invention perfected from the Hussite wars: hundreds of oak-planked war-wagons linked wheel-to-wheel with forged chains, bristling with hand-gonnes, crossbows, and swivel guns. Wallachian light horsemen scout ahead toward Nicopolis and Shumen while Polish bannerets tighten their saddle girths, turning every evening camp into a mobile stone castle."
 oe_v47_eu1.4.a: "Expand the war-wagon corps with Bohemian mercenaries and bronze culverins."
 oe_v47_eu1.4.b: "March lean and swift down the Black Sea road to seize Varna before winter rains fall."
 oe_v47_eu1.4.c: "Scorch the Bulgarian river plains and harass the lumbering wagons with akinji raiders."
 oe_v47_eu1.5.title: "The Black Sea Shore: Battle of Varna"
 oe_v47_eu1.5.desc: "Dawn breaks cold and salt-misty over the marshes between Lake Varna and the wooded Franga ridge. On both flanks, Hunyadi's wagon-forts and Wallachian horsemen have already shattered the Rumelian and Anatolian cavalry wings, driving Ottoman riders back in clouds of dust. Now comes the heartbeat that decided centuries in our timeline: the Sultan's Janissary square stands bristling behind ditches and stakes in the center, and King Wladyslaw's royal guards lower their lances, burning to charge straight into the palace guard before Hunyadi returns."
 oe_v47_eu1.5.a: "Hold the royal guard in iron discipline until Hunyadi's flank envelops the Janissary trench!"
 oe_v47_eu1.5.b: "Sound the Ottoman drums and spring the Janissary trench trap against the reckless royal charge!"
 oe_v47_eu1.5.c: "Order a grinding artillery duel across the marsh to preserve our knights for Edirne."
 oe_v47_eu1.6.title: "Charters of Sofia, Tarnovo & Belgrade"
 oe_v47_eu1.6.desc: "As allied banners roll through the passes of the Haemus Mountains, delegations of Bulgarian boyars, Serbian knezes, Albanian mountain captains, and Greek archons ride into camp bearing bread, salt, and ancient seals of their fallen kingdoms. They are ready to rise against Ottoman garrisons from Vidin to Skopje—yet they ask a pointed question: will the Three-Crown Crusade restore their self-governing crowns and Orthodox churches, or merely trade one imperial master in Adrianople for another in Buda or Venice?"
 oe_v47_eu1.6.a: "Swear solemn Liberation Charters guaranteeing Orthodox rites and autonomous Balkan crowns."
 oe_v47_eu1.6.b: "Place strategic passes and silver mines directly under allied royal governors."
 oe_v47_eu1.6.c: "Confirm Ottoman millet tax immunities to win wavering Balkan notables back to the Sultan."
 oe_v47_eu1.7.title: "The Anatolian Counter-Jihad"
 oe_v47_eu1.7.desc: "News of crusader horsemen watering their mounts south of the Danube sends a tremor through Bursa, Konya, and Edirne. From mountain beyliks and Anatolian timars, thousands of seasoned sipahis and volunteer ghazis answer the Sultan's green standard, swearing to die before surrendering Rumelia. Ottoman viziers melt down palace plate to cast massive bronze bombards, while swift couriers urge Karaman and Egyptian Mamluks to stand in solidarity against the northern invasion."
 oe_v47_eu1.7.a: "Unleash the full Rumelian Counter-Jihad and throw every Anatolian reserve across the straits."
 oe_v47_eu1.7.b: "Fortify the Rhodope passes and grind down the Ottoman counter-offensive behind earthworks."
 oe_v47_eu1.7.c: "Broker a winter armistice along the Maritsa River while both hosts rebuild their strength."
 oe_v47_eu1.8.title: "The Gates of Edirne & Constantinople"
 oe_v47_eu1.8.desc: "All roads in Thrace converge upon two ancient capitals separated by barely a week's march: Ottoman Edirne on the Maritsa and Roman Constantinople behind its triple Theodosian Walls. Siege engineers haul iron-hooped bombards across muddy plains while sappers tunnel beneath Roman brickwork. Whether the cross rises above Adrianople's minarets or the crescent closes forever around the Golden Horn, the siege trenches dug this season will decide which civilization commands the bridge between Europe and Asia."
 oe_v47_eu1.8.a: "Press the allied assault on Edirne and relieve Constantinople's landward encirclement!"
 oe_v47_eu1.8.b: "Turn the great bronze bombards against the Theodosian Walls to finish Byzantium once and for all."
 oe_v47_eu1.8.c: "Fortify the frontier citadels and spare the countryside from destructive winter sieges."
 oe_v47_eu1.9.title: "Council of Buda & Hagia Sophia"
 oe_v47_eu1.9.desc: "With Ottoman garrisons reeling across the Balkans, a delicate diplomatic storm erupts among the victors. Papal legates press for enforcing the Union of Florence in liberated Orthodox dioceses; Hungarian magnates claim Belgrade and Vidin as crown marches; Polish envoys eye Black Sea grain ports; and Byzantine senators insist that every Greek and Thracian province belongs by ancient law to New Rome. Only statesmanship equal to the courage shown at Varna can prevent victory from turning into fratricidal war."
 oe_v47_eu1.9.a: "Forge an equal Three-Crown settlement respecting Orthodox rites and Byzantine Thrace."
 oe_v47_eu1.9.b: "Favor Latin commercial quarters and Hungarian river castles as the price of military rescue."
 oe_v47_eu1.9.c: "Exploit the Catholic-Orthodox rift to rally discontented Balkan lords against Latin overlordship."
 oe_v47_eu1.10.title: "The Partition of Rumelia & the New Balkan Order"
 oe_v47_eu1.10.desc: "Bells toll in Krakow, Buda, Venice, and Constantinople—or war drums resound across the Danube in defiant reply. After years of wagon-fort marches, galley blockades, and fierce Balkan sieges, plenipotentiaries assemble to codify the postwar partition of Rumelia. Maps unroll across velvet tables showing liberated Bulgarian and Serbian buffer realms, restored Byzantine straits, and fortified Danubian marches, sealing a timeline where the tragedy of 1444 became Europe's grandest turning point."
 oe_v47_eu1.10.a: "Proclaim the Grand Balkan Concord and enthrone the Varna Victors in European memory!"
 oe_v47_eu1.10.b: "Reject partition and swear an unyielding vow to reconquer every lost Rumelian sanjak."
 oe_v47_eu1.10.c: "Establish demilitarized river trade zones linking the Black Sea directly to Central Europe."
 oe_v47_eu1.11.title: "Envoys of the Purple Princess"
 oe_v47_eu1.11.desc: "Across frostbound roads from the south rides an embassy bearing letters stamped with the Palaiologan bicephalous eagle. Princess Zoe—soon to be acclaimed in Rus as Sophia Palaiologina—niece of the last Byzantine sovereigns, carries the bloodline of the Caesars toward the rising Kremlin of Moscow. Whether Constantinople still stands defiant on the Bosphorus seeking a mighty northern co-emperor, or lies fallen seeking an avenging heir in the Third Rome, this match promises to forge an Orthodox imperial axis spanning from the White Sea to the Aegean."
 oe_v47_eu1.11.a: "Welcome Sophia Palaiologina with imperial honors and open the Twin-Eagle Axis."
 oe_v47_eu1.11.b: "Accept the marriage cautiously while reassuring conservative boyars of ancient Rus customs."
 oe_v47_eu1.11.c: "Keep diplomatic distance from Greek entanglements and focus strictly on domestic frontiers."
 oe_v47_eu1.12.title: "The Imperial Marriage Embassy"
 oe_v47_eu1.12.desc: "Through Baltic ports, Pskov, and Novgorod rolls Sophia Palaiologina's bridal train—wagons loaded with illuminated Greek gospel books, purple silk vestments, bronze astrolabes, and a retinue of Morean noblemen and Italian master builders. When the bells of the Dormition Cathedral ring out over the Moskva River, foreign envoys from Poland, Venice, and the Crimea watch in sober realization: Moscow is no longer an isolated forest principality paying tribute to the steppe, but a dynastic heir conversing as an equal with the emperors of Rome."
 oe_v47_eu1.12.a: "Grant Sophia's Greek retinue permanent chancery offices and royal endowments."
 oe_v47_eu1.12.b: "Blend Byzantine ceremony with Russian vernacular law so both estates take pride in the union."
 oe_v47_eu1.12.c: "Leverage the wedding dowry to fund steppe frontier forts and border cavalry."
 oe_v47_eu1.13.title: "Seal of the Double-Headed Eagle"
 oe_v47_eu1.13.desc: "In the goldsmith workshops of the Kremlin and the imperial mint of New Rome, master engravers unveil a new sovereign seal. On one side rides Saint George slaying the dragon; on the other spreads the crowned Double-Headed Eagle of the Roman Caesars, its twin heads gazing simultaneously toward Europe and Asia. Habsburg ambassadors in Vienna bristle at the audacious heraldry, yet across Orthodox lands from Kiev to Mount Athos the sight of the Twin Eagles awakens an unmistakable thrill of imperial rebirth."
 oe_v47_eu1.13.a: "Stamp the Double-Headed Eagle on every charter, treaty, and gold coin of the realm!"
 oe_v47_eu1.13.b: "Use the Double-Headed Eagle for foreign diplomacy while keeping ancient princely seals at home."
 oe_v47_eu1.13.c: "Coin silver trade bullion bearing the Twin Eagles to bind Black Sea and Baltic merchants."
 oe_v47_eu1.14.title: "Crown of the Northern Caesar (Living Byzantium)"
 oe_v47_eu1.14.desc: "Because the purple banner of New Rome still flies over the Bosphorus, history opens a breathtaking alternative to tragedy: instead of mourning a fallen empire, Constantinople and Moscow revive the ancient Tetrarchic wisdom of Diocletian and Constantine. Imperial envoys bear a golden chrysobull conferring the rank of Northern Caesar and Co-Emperor upon Moscow's sovereign, forging a living Diarchy of Twin Capitals—Constantinople guarding the Mediterranean seas, Moscow shielding the vast Eurasian steppe."
 oe_v47_eu1.14.a: "Accept the Golden Chrysobull of Co-Emperorship and swear eternal mutual defense!"
 oe_v47_eu1.14.b: "Negotiate strict legal equality between the Tsar of All Rus and the Basileus of the Romans."
 oe_v47_eu1.14.c: "Focus the compact on shared Baltic-Bosphorus customs privileges and merchant fleets."
 oe_v47_eu1.15.title: "Two Romes Have Fallen, the Third Stands"
 oe_v47_eu1.15.desc: "From the stone cells of Pskov's Eleazar Monastery comes the resounding epistle of the elder Philotheus, echoing across snow-covered cathedrals and gilded iconostases: 'Two Romes have fallen; the third stands; and a fourth there shall not be.' With Constantinople eclipsed or imperiled by conquest, Orthodox bishops, Greek exiles, and Russian chroniclers look north to the white walls of the Kremlin as the sole unbroken ark of Roman imperial law and the Eastern Church—calling upon Moscow to take up the heavy mantle of Translatio Imperii."
 oe_v47_eu1.15.a: "Proclaim Moscow the Third Rome and consecrate our dynasty as sovereign defender of Orthodoxy!"
 oe_v47_eu1.15.b: "Keep the Third Rome doctrine as a spiritual mission while forging pragmatic treaties with neighbors."
 oe_v47_eu1.15.c: "Vow not merely to inherit New Rome's title, but one day to liberate the Bosphorus by the sword."
 oe_v47_eu1.16.title: "Kremlin Stone Masters & Byzantine Ceremonial"
 oe_v47_eu1.16.desc: "Through Princess Sophia's Italian and Byzantine connections, famed Renaissance engineers such as Aristotele Fioravanti arrive in Moscow to raise red-brick fortress walls, soaring Dormition domes, and modern bronze cannon foundries. Yet in the vaulted Faceted Chamber, old boyar clans mutter bitterly against Greek court precedence, rigid throne-room hierarchy, and foreign architects supplanting traditional wooden builders—forcing the sovereign to decide how fiercely to press imperial modernization."
 oe_v47_eu1.16.a: "Give the stone masters and cannon founders full imperial backing over boyar objections."
 oe_v47_eu1.16.b: "Pair foreign engineers with native master builders and seat boyars in ceremonial honors."
 oe_v47_eu1.16.c: "Curb extravagant palace stonework and divert funds straight into cavalry regiments."
 oe_v47_eu1.17.title: "The Black Sea Orthodox League"
 oe_v47_eu1.17.desc: "Envoys from the cliffside Principality of Theodoro in Crimea, Greek merchants of Kaffa, Moldavian voivodes, and Russian fur-traders gather along the Pontic shores to forge a unified Black Sea Orthodox League. Threatened by steppe raids along the Don and hostile navies eyeing the Bosphorus, they propose pooling river galleys, grain depots, and coastal garrisons so trade and relief armies can flow unbroken from Moscow's river network straight to the harbors of Constantinople."
 oe_v47_eu1.17.a: "Charter the Black Sea Orthodox League and build fortified grain harbors from Don to Bosphorus."
 oe_v47_eu1.17.b: "Focus on Moldavian and Pontic cavalry treaties to secure the overland Balkan highway."
 oe_v47_eu1.17.c: "Sell Black Sea fur-trade charters to Venetian and Genoese factors for swift hard coin."
 oe_v47_eu1.18.title: "Synod of the Two Sees"
 oe_v47_eu1.18.desc: "Under clouds of frankincense and beeswax candlelight, metropolitans from Moscow, Novgorod, Kiev, and the Ecumenical Patriarchate convene to settle a century-old ecclesiastical tension. Since the Council of Florence, Russian churchmen have fiercely guarded their autocephalous independence, while Greek hierarchs cherish the Ecumenical Patriarch's ancient primacy of honor. Crafting a joint canonical concord—and resolving the burning dispute over monastic land wealth—will decide whether church and crown march in lockstep across the Twin-Eagle world."
 oe_v47_eu1.18.a: "Seal an equal Twin-Patriarchate Concord honoring Constantinople's primacy and Moscow's autocephaly."
 oe_v47_eu1.18.b: "Audit monastic estates and redirect surplus abbey revenues to imperial schools and armies."
 oe_v47_eu1.18.c: "Endow Athonite and Russian monasteries as spiritual bastions of liturgical scholarship."
 oe_v47_eu1.19.title: "The Greco-Russian Renaissance & Royal Library"
 oe_v47_eu1.19.desc: "Chests of parchment codices rescued from Constantinople, Mistra, and Mount Athos are unsealed inside vaulted brick chambers beneath the Kremlin—Plato, Thucydides, Byzantine military manuals, Roman civil digests, and astronomical tables lying alongside Slavonic chronicles. Athonite savant Maximus the Greek leads teams of scribes and early Cyrillic printers, turning Moscow and Constantinople into twin beacons of a distinctly Orthodox Renaissance that bridges Hellenic antiquity with early modern statecraft."
 oe_v47_eu1.19.a: "Found the Imperial Greco-Slavonic Academy and open Cyrillic-Greek printing presses!"
 oe_v47_eu1.19.b: "Prioritize translating Roman legal digests and Byzantine military treatises for our officers."
 oe_v47_eu1.19.c: "Seal the rarest imperial codices in the sovereign vault as sacred dynastic heirlooms."
 oe_v47_eu1.20.title: "Charter of the Twin Eagles"
 oe_v47_eu1.20.desc: "Decades after Princess Sophia's bridal sleigh first crossed the snowy approaches to Moscow, the Greco-Russian Imperial Axis has reshaped the geopolitical map of Eastern Europe and the Black Sea. Envoys wearing sable kaftans and imperial chlamys assemble beneath golden domes to inscribe the definitive Charter of the Twin Eagles—determining whether our age culminates in an indissoluble Diarchy of two living Roman capitals, an unchallenged Northern Third Rome, or a broad Orthodox Commonwealth of sovereign crowns."
 oe_v47_eu1.20.a: "Ratify the Eternal Charter of the Twin Eagles and bind our dynasties in perpetuity!"
 oe_v47_eu1.20.b: "Dedicate the Axis to commercial prosperity linking Novgorod, Kaffa, and the Aegean."
 oe_v47_eu1.20.c: "Preserve independent sovereign prerogatives while honoring shared Orthodox fraternity."
 oe_v47_eu1.21.title: "The Last Embers of Al-Andalus"
 oe_v47_eu1.21.desc: "From the red-stone towers of the Alhambra, the Emir of Granada gazes down across olive groves, silk terraces, and snow-crowned passes toward the encroaching banners of Castile and Aragon. Eight centuries of Islamic civilization in Iberia now hang upon this single mountain realm. Inside the Court of the Lions, viziers debate two breathtaking paths: summon Morocco and the Mamluk Sultanate across the Strait of Gibraltar to roll back the Reconquista toward Cordoba—or quietly build an ocean-going fleet to carry Andalusian learning across the Atlantic should Iberia fall."
 oe_v47_eu1.21.a: "Swear the Oath of the Alhambra: rally Morocco and Cairo to reverse the Reconquista!"
 oe_v47_eu1.21.b: "Secretly commission Malaga shipwrights and astronomers to chart an Atlantic Exile route!"
 oe_v47_eu1.21.c: "Press the Christian Reconquista or buy fragile frontier truces with Granadan silk gold."
 oe_v47_eu1.22.title: "Watchtowers of the Alhambra & Vega of Granada"
 oe_v47_eu1.22.desc: "Stone beacon towers crown every crag from Ronda and Loja to Almeria, flashing mirror signals by day and pine-resin fires by night whenever Castilian lancers cross the frontier. Below in the irrigated Vega of Granada, master hydraulic engineers and silk guilds convert peaceful orchards into an armored breadbasket capable of enduring years of blockade, while agile zenete light cavalry master the art of sudden mountain ambushes along every steep defile."
 oe_v47_eu1.22.a: "Reinforce every mountain citadel and equip frontier crossbowmen with early arquebuses."
 oe_v47_eu1.22.b: "Expand Granada's silk and paper exports through Genoese factors to finance future campaigns."
 oe_v47_eu1.22.c: "Map hidden coves near Malaga and Almeria where royal libraries could embark in an emergency."
 oe_v47_eu1.23.title: "Sails Across the Strait of Gibraltar"
 oe_v47_eu1.23.desc: "White lateen sails crowd the narrow blue channel between Tangier, Ceuta, and Algeciras as Moroccan war-galleys and Barbary xebecs slip past Iberian patrols under cover of a warm Levante mist. Aboard come Berber light horse, Rif mountain archers, grain sacks from Fez, and solemn letters pledging that Al-Andalus will not face the crowns of Spain alone. On the Rock of Gibraltar, green banners snap in the sea wind as the old bridge between Maghreb and Iberia awakens once more."
 oe_v47_eu1.23.a: "Establish a joint Granadan-Moroccan Admiralty to hold the Strait of Gibraltar permanently!"
 oe_v47_eu1.23.b: "Welcome Maghrebi cavalry while keeping Granada's throne strictly independent of Fez."
 oe_v47_eu1.23.c: "Launch an Iberian naval counter-blockade from Cadiz and Lisbon to seal the Strait shut."
 oe_v47_eu1.24.title: "The Cairo Gunpowder & Dhow Embassies"
 oe_v47_eu1.24.desc: "Answering urgent pleas dispatched from the Alhambra to Al-Azhar and the Citadel of Cairo, Mamluk envoys arrive aboard Alexandrian merchant carracks laden with saltpeter, Syrian steel, and seasoned siege gunners. In Cairo's divan, sultans and jurists warn that if Christian navies extinguish Granada, the Iberian crusade will not halt at Gibraltar—it will sweep across North Africa and into the Red Sea itself. Eastern Islamic bullion and military science now pour westward to tilt the Iberian scales."
 oe_v47_eu1.24.a: "Open a permanent Granada-Alexandria cannon foundry and Mediterranean diplomatic axis."
 oe_v47_eu1.24.b: "Channel Cairo's scholars and spice-trade gold into Granadan universities and civic stability."
 oe_v47_eu1.24.c: "Acquire Indian Ocean celestial navigation instruments from Cairo captains for Atlantic voyages."
 oe_v47_eu1.25.title: "Siege of Malaga & the Reconquista Crucible"
 oe_v47_eu1.25.desc: "Thunder rolls across the olive hills as rows of Castilian and Aragonese bronze lombards hammer the outer towers of Malaga and Loja. Unlike earlier medieval raids where mountain castles could laugh at trebuchets, gunpowder artillery now shatters ancient masonry in days, while Christian fleets tighten a ring of sail off the coast. Every commander on both sides knows this crucible will either break the Reconquista's spear upon Granadan resolve or force the Nasrid court to choose between capitulation and sailing into the unknown West."
 oe_v47_eu1.25.a: "Launch a daring nocturnal sally to spike the siege lombards and break the Malaga encirclement!"
 oe_v47_eu1.25.b: "Double the Reconquista bombardment and press the breach until the Nasrid banners fall."
 oe_v47_eu1.25.c: "Hold the harbor mole just long enough for the Exile Armada to slip past the blockade at midnight!"
 oe_v47_eu1.26.title: "The Return to Cordoba & Seville"
 oe_v47_eu1.26.desc: "Horsemen in emerald cloaks water their steeds along the broad Guadalquivir as cheering crowds line the Roman bridge into Cordoba and beneath the towering Giralda of Seville. For the first time in over two centuries, Nasrid and Maghrebi standards fly over the ancient capital of the Western Caliphate. Poets, jurists, Jewish physicians, and Christian artisans alike watch breathlessly to see whether a resurgent Al-Andalus will restore the famed Convivencia of letters and science or enforce stern martial frontier rule."
 oe_v47_eu1.26.a: "Proclaim the Charter of Cordoba—reopening libraries, academies, and tolerant guild quarters!"
 oe_v47_eu1.26.b: "Turn Seville's river shipyards into a fortress arsenal guarding the Atlantic approaches."
 oe_v47_eu1.26.c: "Levy war indemnities across the valley to fill the treasury before northern armies regroup."
 oe_v47_eu1.27.title: "Charts of the Sea of Darkness: The Exile Armada"
 oe_v47_eu1.27.desc: "By lamplight in a quiet maritime pavilion above Algeciras, Andalusian astronomers spread out brass astrolabes, portolan charts, and centuries-old accounts of Al-Idrisi's adventurers who once sailed west into the Bahr al-Zulumat—the Sea of Darkness. With Iberian pressure mounting and Portuguese caravels already probing the African coast, captains whisper an audacious plan: if Al-Andalus cannot live in peace beside Castile, let us ride the northeast trade winds past the Green Cape to found an unconquerable New Cordoba across the ocean!"
 oe_v47_eu1.27.a: "Outfit the Atlantic Exile Armada—pack libraries, craftsmen, citrus saplings, and royal banners!"
 oe_v47_eu1.27.b: "Dispatch only a small scouting squadron while keeping our main strength rooted in Iberia."
 oe_v47_eu1.27.c: "Sell our cartographers' Atlantic charts to Maghrebi traders and reinvest in home fortifications."
 oe_v47_eu1.28.title: "Landfall on the Atlantic Rim: Arguin & the Green Cape"
 oe_v47_eu1.28.desc: "After three weeks riding the brisk Canary Current southward past Saharan dunes, our caravels drop anchor off the sheltered waters of Arguin and the volcanic peaks of the Cape Verde islands. Here, a wondrous bridge opens before Andalusian navigators: inland across the Sahel shine the gold caravans of Mali and the famed libraries of Sankore in Timbuktu, whose scholars eagerly welcome exiled Granadan jurists, bookbinders, and architects—forging a West African waystation for the great ocean crossing ahead."
 oe_v47_eu1.28.a: "Found an Andalusian-Sahelian entrepot linking Cape Verde and Arguin directly to Timbuktu!"
 oe_v47_eu1.28.b: "Refit our hulls with fresh timber and water, then immediately steer southwest toward Brazil!"
 oe_v47_eu1.28.c: "Use West African gold dust profits to buy mercenaries and return to reinforce Iberia!"
 oe_v47_eu1.29.title: "Across the Sea of Darkness: Founding New Cordoba"
 oe_v47_eu1.29.desc: "Lookouts perched in the crow's nests cry 'Al-Ard! Land!' as emerald headlands, coral reefs, and palm-lined river mouths rise above the western horizon of Brazil. Stepping ashore with brass astrolabes and crimson Nasrid standards, exiles plant pomegranate and orange shoots beside coastal springs and raise the first horseshoe-arched mosque of Qurtuba al-Jadida—New Cordoba! Far beyond Castilian cannon, an Islamic maritime mini-Odyssey has forged a vibrant trans-Atlantic homeland where Al-Andalus shall never die."
 oe_v47_eu1.29.a: "Lay the royal cornerstone of New Cordoba on the Brazilian shore and welcome every Andalusian exile!"
 oe_v47_eu1.29.b: "Relocate our capital across the Atlantic if Granada is reduced to a handful of towns!"
 oe_v47_eu1.29.c: "Charter New Cordoba as a wealthy spice-and-brazilwood trade station financing Iberian wars."
 oe_v47_eu1.30.title: "Two Destinies of Al-Andalus: Caliphal Splendor or Oceanic Haven"
 oe_v47_eu1.30.desc: "Chroniclers in Fez, Toledo, Cairo, and coastal Brazil dip their reed pens into walnut ink to record one of the century's grandest reversals of fortune. The small Emirate of Granada that the world wrote off in 1444 has defied oblivion—either by rallying the Islamic Mediterranean to raise its crescent anew over Cordoba and Seville, or by riding the trade winds past West Africa to build an ocean-spanning Sultanate of New Cordoba that rewrites the entire Atlantic Age before European empires can monopolize the western sea."
 oe_v47_eu1.30.a: "Crown Al-Andalus Resurgent as the undisputed jewel of Iberia and the Western Mediterranean!"
 oe_v47_eu1.30.b: "Celebrate the Trans-Atlantic Sultanate of New Cordoba—mistress of the Green Cape and Brazil!"
 oe_v47_eu1.30.c: "Establish a pragmatic Iberian-Atlantic commercial peace so scholars and ships sail unmolested."
