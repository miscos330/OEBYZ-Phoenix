 oe_v47_eu1_mod_varna_rumelian_mastery: "Unbroken Mastery of the Balkans"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_rumelian_mastery: "Unbroken Mastery of the Balkans"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_rumelian_mastery: "Breaking the Three-Crown Crusade leaves Ottoman arms supreme from the Aegean to the Danube, drawing wary coalitions from Catholic courts."
 oe_v47_eu1_mod_varna_crusade_reckoning: "Danubian Frontier Fortification"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_crusade_reckoning: "Danubian Frontier Fortification"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_crusade_reckoning: "Hard-fought Balkan campaigns leave a belt of stone river citadels and veteran border captains at the cost of heavy garrison upkeep."
 oe_v47_eu1_mod_varna_crusader_tithe: "Emergency Crusade War Tithe"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_varna_crusader_tithe: "Emergency Crusade War Tithe"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_varna_crusader_tithe: "Special church and merchant war levies keep siege trains moving across the Balkan passes while ruffling urban burghers."
