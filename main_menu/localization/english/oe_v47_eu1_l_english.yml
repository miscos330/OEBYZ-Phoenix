 oe_v47_eu1_mod_double_eagle_seal: "Seal of the Double-Headed Eagle"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_double_eagle_seal: "Seal of the Double-Headed Eagle"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_double_eagle_seal: "Stamping the Byzantine two-headed eagle onto sovereign charters elevates autocratic authority and legal dignity, chafing regional noble privileges."
 oe_v47_eu1_mod_northern_caesar: "Investiture of the Northern Caesar"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_northern_caesar: "Investiture of the Northern Caesar"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_northern_caesar: "Formal imperial coronation rites bind sovereign legitimacy to Orthodox Rome's millennial law, demanding lavish ceremonial court outlays."
 oe_v47_eu1_mod_black_sea_league: "Black Sea Orthodox Maritime League"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_black_sea_league: "Black Sea Orthodox Maritime League"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_black_sea_league: "Coordinating Crimean, Pontic, and Muscovite convoys secures grain, furs, and pilgrims across the Euxine while stretching fleet budgets."
 oe_v47_eu1_mod_greco_russian_renaissance: "Greco-Russian Cultural Renaissance"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_greco_russian_renaissance: "Greco-Russian Cultural Renaissance"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_greco_russian_renaissance: "Byzantine refugees, Italian master masons, and Moscow iconographers spark a golden age of chronicles and stone cathedrals at fiscal cost."
 oe_v47_eu1_mod_twin_co_emperorship: "Twin-Eagle Diarchy of Moscow & Constantinople"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_twin_co_emperorship: "Twin-Eagle Diarchy of Moscow & Constantinople"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_twin_co_emperorship: "Two living Orthodox capitals stand united from the Bosphorus to the Volga, lending unmatched prestige and administrative vigor with elevated diplomatic burdens."
 oe_v47_eu1_mod_third_rome_mantle: "Mantle of the Third Rome"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_third_rome_mantle: "Mantle of the Third Rome"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_third_rome_mantle: "Inheriting Constantinople's fallen purple transforms Moscow into the sole imperial shield of Orthodoxy, fueling missionary zeal while stirring boyar resentment."
 oe_v47_eu1_mod_orthodox_commonwealth: "Orthodox Commonwealth Concord"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_orthodox_commonwealth: "Orthodox Commonwealth Concord"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_orthodox_commonwealth: "Shared liturgical books, monastic exchanges, and fraternal treaties preserve Greco-Slavic solidarity even where crowns stay politically distinct."
 oe_v47_eu1_mod_kremlin_stone_masters: "Kremlin Stone Citadel & Armory"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_kremlin_stone_masters: "Kremlin Stone Citadel & Armory"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_kremlin_stone_masters: "Italian-Byzantine fortifications and bronze cannon foundries fortify the northern capital while driving up municipal construction upkeep."
 oe_v47_eu1_mod_alhambra_defiance: "Bastions of the Alhambra & Sierra Nevada"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_alhambra_defiance: "Bastions of the Alhambra & Sierra Nevada"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_alhambra_defiance: "Reinforced mountain watchtowers, border ghazi pickets, and terraced vega granaries turn Granada into an iron redoubt at heavy upkeep."
 oe_v47_eu1_mod_gibraltar_jihad: "Strait of Gibraltar Relief Alliance"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_gibraltar_jihad: "Strait of Gibraltar Relief Alliance"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_gibraltar_jihad: "Moroccan horse-archers, Barbary corsairs, and Mamluk gunpowder specialists cross the strait to turn the Iberian tide, alarming European courts."
 oe_v47_eu1_mod_cordoba_revival: "Charter of the Great Mosque of Cordoba"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_cordoba_revival: "Charter of the Great Mosque of Cordoba"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_cordoba_revival: "Restoring Cordoba's academies, hydraulic gardens, and silk bazaars rekindles Al-Andalus's Golden Age while granting autonomy to urban guilds."
 oe_v47_eu1_mod_atlantic_exile_fleet: "Andalusian Atlantic Exile Armada"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_atlantic_exile_fleet: "Andalusian Atlantic Exile Armada"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_atlantic_exile_fleet: "Lateen caravels guided by Andalusian astrolabes chart the Green Cape, West Africa, and the western ocean beyond, straining domestic naval coffers."
 oe_v47_eu1_mod_santa_hermandad_push: "Iberian Reconquista Siege Train"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_santa_hermandad_push: "Iberian Reconquista Siege Train"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_santa_hermandad_push: "Bronze lombards, municipal brotherhoods, and crusading orders press relentless sieges across Andalusia while taxing rural peasantry."
 oe_v47_eu1_mod_andalus_caliphate_reborn: "Al-Andalus Resurgent"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_andalus_caliphate_reborn: "Al-Andalus Resurgent"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_andalus_caliphate_reborn: "Flying the Nasrid crescent once more over Cordoba and Seville establishes an Islamic intellectual and commercial beacon in Western Europe at elevated diplomatic friction."
 oe_v47_eu1_mod_new_cordoba_horizon: "Sovereigns of New Cordoba"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_new_cordoba_horizon: "Sovereigns of New Cordoba"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_new_cordoba_horizon: "Refounded across the Atlantic between West Africa and the green shores of Brazil, New Cordoba fuses Andalusian scholarship with trans-oceanic enterprise at high fleet upkeep."
 oe_v47_eu1_mod_andalus_frontier_legacy: "Heritage of the Andalusian Frontier"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_andalus_frontier_legacy: "Heritage of the Andalusian Frontier"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_andalus_frontier_legacy: "Centuries of irrigation canals, astronomy, and silk weaving enrich the Iberian-Maghreb borderlands even after the military storm subsides."
 oe_v47_eu1_mod_trans_saharan_gold_link: "Maghreb-Timbuktu Scholarly & Gold Link"
 STATIC_MODIFIER_NAME_oe_v47_eu1_mod_trans_saharan_gold_link: "Maghreb-Timbuktu Scholarly & Gold Link"
 STATIC_MODIFIER_DESC_oe_v47_eu1_mod_trans_saharan_gold_link: "Linking Andalusian exiles with Sankore scholars and West African gold caravans infuses coinage and learning while raising overland escort costs."
