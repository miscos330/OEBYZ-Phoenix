 oe_flavor_byz.1004.t: "Osmaris: Manuel the Instructor"
 oe_flavor_byz.1004.d: "(Original name: Murad I)\n\nManuel of the House of Osmaris seldom lingers at banquets. He prefers the camps outside the city, studying how a shield wall turns, how cavalry closes its ranks, and how exhausted recruits learn to hear commands again. After receiving his Christian name, he sought no exalted office. He began as an ordinary officer, drilling in the mud beside his men.\n\nAt first, others took this for a young nobleman's passing interest. Only when his soldiers could change formation cleanly and rally after a broken line did veteran commanders begin to notice him. Drawing upon frontier cavalry warfare and Roman battlefield practice, he reduced marching, encampment, and deployment to exercises that could be taught and repeated.\n\nThe recommendation now before the Emperor bears several generals' signatures. Give Manuel charge of a wider training program, they urge, and his talents need no longer serve a single small command."
 oe_flavor_byz.1004.a: "Give Manuel greater responsibility."
 oe_flavor_byz.1004.a.tt: "Authority: #G +1#!.\nGain #Y Manuel's Drill Regulations#! for #G 20 years#!: Discipline #G +5%#! and Army Morale #G +10%#!.\nIf Osmaris is already a noble house, it gains #G 50 Influence#!. Otherwise, it becomes a noble house and receives #G 1#! additional noble-house place, granted only once to this family."
 oe_flavor_byz.1004.historical_info: "Murad I, son of Orhan, ruled the Ottoman state from 1362 to 1389. He expanded Ottoman power in the Balkans, strengthened its military and administration, and died at the Battle of Kosovo in 1389. Manuel's career as an Eastern Roman instructor is an alternate-history interpretation."
 oe_flavor_byz.1005.t: "Osmaris: A Governor for Serbia"
 oe_flavor_byz.1005.d: "(Original name: Murad I)\n\nFive years have passed since Manuel's training regulations first spread beyond the capital. Officers who learned under him now drill their own commands. His ability has become more than a promise in a letter of recommendation.\n\nYet Serbia's submission has not brought order to its affairs. Garrisons, local magnates, and imperial envoys dispute each other's demands. The court needs a governor capable of turning instructions into action. Some propose reorganizing Serbia as a provincial subject and entrusting Manuel with its seal: he understands military affairs and commands the respect of soldiers.\n\nOthers fear that the new training system still needs his personal care in the capital. Between a governor's seal and the standards of the training ground, the Emperor must choose for him."
 oe_flavor_byz.1005.a: "Send Manuel to Serbia."
 oe_flavor_byz.1005.a.tt: "Serbia becomes a #Y provincial subject#!. Manuel leaves Byzantium and becomes #Y ruler of Serbia#!."
 oe_flavor_byz.1005.b: "Let him continue training soldiers in the capital."
 oe_flavor_byz.1005.b.tt: "Authority: #G +1#!. Manuel remains in Byzantium."
 oe_flavor_byz.1005.lapsed: "The appointment can no longer proceed."
 oe_flavor_byz.1005.lapsed.tt: "Manuel's circumstances or Serbia's status have changed. No appointment or reward is made."
 oe_flavor_byz.1005.historical_info: "The historical Murad I was an Ottoman ruler, not a Byzantine governor of Serbia. His expansion into the Balkans brought him into conflict with Serbian lords and culminated in the Battle of Kosovo in 1389. This event recasts that relationship as an imperial provincial appointment."
 oe_flavor_byz.1006.t: "Osmaris: The Poisoned Dagger"
 oe_flavor_byz.1006.d: "(Original name: Murad I)\n\nFive years after Manuel departed for Serbia, a courier pounds upon the palace gates in the night. The packet he carries contains neither tax accounts nor a report of victory.\n\nA Serbian petitioner approached the governor, drew a dagger from beneath his clothes, and drove it into his body. The guards seized the attacker and physicians hurried to Manuel's side, but they could not halt the poison spreading through his blood. A man who had taught countless soldiers to meet a blade in battle fell within the close confines of an audience.\n\nWith the dispatch comes a worn book of drill instructions. Its ranks of ink remain orderly. The hand that drew them will issue no further commands."
 oe_flavor_byz.1006.a: "May the Lord grant him rest."
 oe_flavor_byz.1006.a.tt: "#R Manuel is assassinated and dies.#!"
 oe_flavor_byz.1006.historical_info: "Murad I died during the Battle of Kosovo in 1389. Later traditions commonly attribute his death to a Serbian assassin, although accounts of the circumstances differ. A poisoned dagger and an imperial governorship are fictional elements of this mod's alternate history."
 STATIC_MODIFIER_NAME_oe_osmaris_manuel_drill: "Manuel's Drill Regulations"
 STATIC_MODIFIER_DESC_oe_osmaris_manuel_drill: "Manuel has reduced marching, encampment, and battlefield maneuvers to repeatable exercises, teaching soldiers to trust both their comrades and their commands."
 oe_osmaris_instructor_done: "Manuel has been appointed instructor"
 oe_osmaris_serbia_decided: "Manuel's Serbian appointment has been decided"
 oe_osmaris_sent_to_serbia: "Manuel has been sent to govern Serbia"
 oe_osmaris_assassinated: "Manuel has been assassinated"
