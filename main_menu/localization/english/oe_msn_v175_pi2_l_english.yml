 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m1:0 "Unbroken Bagrationi Mountain Shield"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m1:0 "Khevsur chainmail regiments, Sadrosho regional banners, and cliffside stone citadels turn every Caucasus pass into an invader's grave."
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m2:0 "Sovereign Bridge of Two Seas"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m2:0 "Controlling Batumi, Tbilisi, Baku, and the Iron Gate of Derbent turns the Caucasus into Eurasia's premier inter-sea crossroads."
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m3:0 "Dasturlamali & Highland Enlightenment"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m3:0 "Codified royal administration, Gelati and Etchmiadzin academies, and printed Caucasian letters elevate both governance and prestige."
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m4:0 "Second Golden Age of Tamar Eternal"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m4:0 "From the Black Sea shore to the Caspian gates, the united Caucasian realm shines as an unconquered fortress of faith, commerce, and learning."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m1:0 "Qizilbash, Ghulam & Zamburak War Machine"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m1:0 "Armored Qizilbash lancers, salaried Ghulam guards, and rapid Zamburak swivel cannon command every battlefield from Tigris to Oxus."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m2:0 "Master of the Gulf & Khorasan Gates"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m2:0 "Commanding Hormuz, Basra, Mashhad, and Herat locks both the Indian Ocean sea-lanes and the eastern Silk Road."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m3:0 "Isfahan Nisf-e Jahan & Royal Karkhaneh"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m3:0 "Tiled imperial squares, qanat gardens, and royal silk-and-carpet manufactories radiate unmatched Iranian prestige and wealth."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m4:0 "Shahanshah of Tigris, Plateau & Gulf"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m4:0 "Uniting Baghdad, Tabriz, Isfahan, and Hormuz under modern Iranian statecraft restores the grandest Eurasian empire between Rome and India."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m1:0 "Swarajya Bargir Horse & Rocket Ordnance"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m1:0 "Lightning Maratha Bargir cavalry, Sahyadri fortresses, and Deccan iron war-rockets overwhelm heavier imperial formations."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m2:0 "Twin-Coast Oceanic Arc: Surat to Sonargaon"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m2:0 "Commanding both the Arabian Sea ports of Konkan and Gujarat and the lush delta of Bengal unites India's maritime wealth."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m3:0 "Sovereign Indian Ports & Hundi Finance"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m3:0 "Autonomous shipyards, Wootz steel workshops, and Hundi banking syndicates break foreign trading-company monopolies forever."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m4:0 "Swarajya & Indian Ocean Bastion Eternal"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m4:0 "Uniting the Western Ghats, Deccan plateau, and oceanic entrepots crowns an unconquered sovereign bastion of South Asia."
 oe_msn_geo_destiny:0 "#bold #color_yellow Georgia & Caucasus: Bagrationi Shield#!#!"
 oe_msn_geo_destiny_DESCRIPTION:0 "From George V's Recovery and Khevsur Highland Castles to the Two-Seas Bridge, Dasturlamali Code, and Second Golden Age of Queen Tamar"
 oe_msn_geo_destiny_CRITERIA_DESCRIPTION:0 "Unite Kartli, Imereti, Samtskhe, Armenia, and Shirvan from the Black Sea to the Caspian, raise invincible Khevsur highland guards and fortress-monasteries against rival empires, and crown a Second Caucasian Golden Age."
 oe_msn_geo_destiny_BUTTON_TOOLTIP:0 "Embark on the Caucasus Bagrationi Destiny"
 oe_msn_geo_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Georgia, Armenia, and the Caucasus: consolidate Tbilisi, Kutaisi, Yerevan, Baku, and Derbent, command Sadrosho banners and Khevsur heavy infantry behind impregnable mountain castles, weave Black-to-Caspian silk and New Julfa trade, and usher in the Second Golden Age of Queen Tamar."
 oe_msn_geo_01_brilliant_recovery:0 "George V's Brilliant Recovery"
 oe_msn_geo_01_brilliant_recovery_desc:0 "Anchor our highland seat in Tbilisi, Kutaisi, Akhaltsikhe, Yerevan, or Baku with a steady hand to begin Caucasian reunification."
 oe_msn_geo_01_brilliant_recovery_req_tt:0 "Own Tbilisi, Kutaisi, Akhaltsikhe, Yerevan, or Baku with at least 5 Stability."
 oe_msn_geo_02_khevsur_sadrosho:0 "Sadrosho Banners & Khevsur Guard"
 oe_msn_geo_02_khevsur_sadrosho_desc:0 "Organize the territorial Sadrosho banner commands and muster chainmail-armored Khevsur highland infantry."
 oe_msn_geo_02_khevsur_sadrosho_req_tt:0 "Hold at least 180 Gold and have at least 8 Stability."
 oe_msn_geo_03_darial_fortresses:0 "Bastions of the Darial & Roki Passes"
 oe_msn_geo_03_darial_fortresses_desc:0 "Fortify the northern mountain defiles and stone watchtowers so steppe hordes and conquerors break against our crags."
 oe_msn_geo_03_darial_fortresses_req_tt:0 "Have at least 12 Stability in the Age of Renaissance or later."
 oe_msn_geo_04_defy_the_empires:0 "Defy Ottoman-Persian Partition"
 oe_msn_geo_04_defy_the_empires_desc:0 "Hold Tbilisi and Samtskhe inviolate in the gunpowder era, proving the Caucasian shield unbreakable between rival empires."
 oe_msn_geo_04_defy_the_empires_req_tt:0 "Own Tbilisi and Akhaltsikhe with at least 15 Stability in the Age of Reformation or later."
 oe_msn_geo_05_kartli_imereti_samtskhe:0 "Unite Kartli, Imereti & Samtskhe"
 oe_msn_geo_05_kartli_imereti_samtskhe_desc:0 "Heal the highland divisions by bringing Tbilisi, Kutaisi, and Akhaltsikhe back beneath one crown."
 oe_msn_geo_05_kartli_imereti_samtskhe_req_tt:0 "Own Tbilisi, Kutaisi, and Akhaltsikhe."
 oe_msn_geo_06_armenian_highlands:0 "Shield of Ararat: Yerevan, Ani & Kars"
 oe_msn_geo_06_armenian_highlands_desc:0 "Extend sovereign protection across the Armenian plateau, reclaiming Yerevan alongside ancient Ani or Kars."
 oe_msn_geo_06_armenian_highlands_req_tt:0 "Own Yerevan and either Ani or Kars."
 oe_msn_geo_07_shirvan_caspian_gates:0 "Shirvan Silk Ports & Derbent Gate"
 oe_msn_geo_07_shirvan_caspian_gates_desc:0 "March to the Caspian shore, mastering Baku's harbor alongside the silk emporium of Shamakhi or the Iron Gate of Derbent."
 oe_msn_geo_07_shirvan_caspian_gates_req_tt:0 "Own Baku, own Derbent or Shamakhi, and control at least 22 Locations."
 oe_msn_geo_08_two_seas_caucasus:0 "Sovereign Bridge of Black & Caspian Seas"
 oe_msn_geo_08_two_seas_caucasus_desc:0 "Holding Batumi, Tbilisi, and Baku turns our mountain realm into the sovereign transit bridge between two seas."
 oe_msn_geo_08_two_seas_caucasus_req_tt:0 "Own Batumi, Tbilisi, and Baku in the Age of Discovery or later."
 oe_msn_geo_09_fortress_monasteries:0 "Gelati, Gladzor & Fortress Monasteries"
 oe_msn_geo_09_fortress_monasteries_desc:0 "Restore ancient mountain monasteries and academies that shelter both sacred manuscripts and local garrisons."
 oe_msn_geo_09_fortress_monasteries_req_tt:0 "Own Tbilisi or Yerevan in the Age of Renaissance or later."
 oe_msn_geo_10_silk_wine_caravans:0 "Silk, Wine & New Julfa Merchant Houses"
 oe_msn_geo_10_silk_wine_caravans_desc:0 "Channel Caspian silk, Kakhetian wine, and Armenian commenda banking into a booming Caucasian treasury."
 oe_msn_geo_10_silk_wine_caravans_req_tt:0 "Hold at least 260 Gold."
 oe_msn_geo_11_dasturlamali_renaissance:0 "Dasturlamali Code & Caucasian Presses"
 oe_msn_geo_11_dasturlamali_renaissance_desc:0 "Publish the Dasturlamali state code alongside Georgian and Armenian printed works to modernize the realm."
 oe_msn_geo_11_dasturlamali_renaissance_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_geo_12_crown_of_queen_tamar:0 "Second Golden Age of Queen Tamar"
 oe_msn_geo_12_crown_of_queen_tamar_desc:0 "Uniting Tbilisi, Yerevan, and Baku in unconquered splendor crowns a Second Golden Age across the entire Caucasus."
 oe_msn_geo_12_crown_of_queen_tamar_req_tt:0 "Own Tbilisi, Yerevan, and Baku with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_jal_destiny:0 "#bold #color_yellow Post-Ilkhanate Persia: Heirs of Baghdad & Tabriz#!#!"
 oe_msn_jal_destiny_DESCRIPTION:0 "From Jalayirid, Turkmen & Ardabil Revival to Qizilbash Lancers, Hormuz Liberation, and Isfahan Nisf-e Jahan"
 oe_msn_jal_destiny_CRITERIA_DESCRIPTION:0 "Unite the post-Ilkhanate succession across Baghdad, Tabriz, Shiraz, Isfahan, Hormuz, and Herat, modernize Qizilbash cavalry into a gunpowder Shahanshah army, and turn Isfahan into Half the World."
 oe_msn_jal_destiny_BUTTON_TOOLTIP:0 "Embark on the Heirs of Baghdad & Tabriz Destiny"
 oe_msn_jal_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Jalayirids, Qara & Aq Qoyunlu, Muzaffarids, Injuids, Ardabil, and Persian successor realms: reunite Tigris and plateau capitals, forge Qizilbash lancers and post-Chaldiran gunpowder corps, reclaim Hormuz and Khorasan, and crown Isfahan Nisf-e Jahan."
 oe_msn_jal_01_heirs_of_the_ilkhan:0 "Heirs of Baghdad & Tabriz"
 oe_msn_jal_01_heirs_of_the_ilkhan_desc:0 "Secure a sovereign base in Baghdad, Tabriz, Shiraz, Yazd, Ardabil, or Isfahan to claim the mantle of post-Ilkhanate Iran."
 oe_msn_jal_01_heirs_of_the_ilkhan_req_tt:0 "Own Baghdad, Tabriz, Shiraz, Yazd, Ardabil, or Isfahan with at least 5 Stability."
 oe_msn_jal_02_qizilbash_banners:0 "Muster Qizilbash Heavy Lancers"
 oe_msn_jal_02_qizilbash_banners_desc:0 "Unite Turkmen horsemen and plateau nobles into disciplined heavy lancer squadrons sworn directly to our banner."
 oe_msn_jal_02_qizilbash_banners_req_tt:0 "Hold at least 180 Gold and have at least 8 Stability."
 oe_msn_jal_03_tofangchi_tupchi:0 "Beyond Chaldiran: Tofangchi & Artillery"
 oe_msn_jal_03_tofangchi_tupchi_desc:0 "Answer western gunpowder challenges by forging standing matchlock infantry and cast bronze artillery batteries."
 oe_msn_jal_03_tofangchi_tupchi_req_tt:0 "Hold at least 240 Gold in the Age of Discovery or later."
 oe_msn_jal_04_ghulam_zamburak_corps:0 "Ghulam Royal Guard & Zamburak Corps"
 oe_msn_jal_04_ghulam_zamburak_corps_desc:0 "Pair salaried Ghulam regiments with swift camel-mounted swivel guns to field Asia's premier combined-arms army."
 oe_msn_jal_04_ghulam_zamburak_corps_req_tt:0 "Control at least 35 Locations with at least 14 Stability in the Age of Reformation or later."
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan:0 "Twin Capitals: Baghdad & Tabriz"
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan_desc:0 "Bring both the Tigris jewel of Baghdad and the grand Azerbaijani metropolis of Tabriz under a single sovereign diwan."
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan_req_tt:0 "Own both Baghdad and Tabriz."
 oe_msn_jal_06_fars_isfahan_shiraz:0 "Heart of Iran: Isfahan & Shiraz"
 oe_msn_jal_06_fars_isfahan_shiraz_desc:0 "Unite central Iraq-e Ajam and historic Fars by securing the twin cultural hearts of Isfahan and Shiraz."
 oe_msn_jal_06_fars_isfahan_shiraz_req_tt:0 "Own both Isfahan and Shiraz."
 oe_msn_jal_07_hormuz_gulf_dominion:0 "Liberate Hormuz & the Gulf Seaboard"
 oe_msn_jal_07_hormuz_gulf_dominion_desc:0 "Drive foreign strongholds from the Strait of Hormuz while holding Basra or Kerman to command the Persian Gulf."
 oe_msn_jal_07_hormuz_gulf_dominion_req_tt:0 "Own Hormuz, own Basra or Kerman, and control at least 30 Locations."
 oe_msn_jal_08_khorasan_herat_mashhad:0 "Eastern Shield: Mashhad & Herat"
 oe_msn_jal_08_khorasan_herat_mashhad_desc:0 "Reclaim the eastern gateway cities of Mashhad and Herat to secure the Silk Road against steppe raids."
 oe_msn_jal_08_khorasan_herat_mashhad_req_tt:0 "Own Mashhad and Herat in the Age of Discovery or later."
 oe_msn_jal_09_baghdad_shiraz_ateliers:0 "Miniature Ateliers & Persian Letters"
 oe_msn_jal_09_baghdad_shiraz_ateliers_desc:0 "Fuse Jalayirid illumination, Shiraz poetry, and court astronomy into a dazzling Persianate renaissance."
 oe_msn_jal_09_baghdad_shiraz_ateliers_req_tt:0 "Have at least 10 Stability in the Age of Renaissance or later."
 oe_msn_jal_10_qanat_karkhaneh_silk:0 "Qanat Irrigation & Royal Karkhaneh Silk"
 oe_msn_jal_10_qanat_karkhaneh_silk_desc:0 "Restore plateau qanats and charter royal carpet and silk workshops exporting from Kashan and Gilan across Eurasia."
 oe_msn_jal_10_qanat_karkhaneh_silk_req_tt:0 "Hold at least 300 Gold."
 oe_msn_jal_11_isfahan_nisf_e_jahan:0 "Isfahan: Nisf-e Jahan (Half the World)"
 oe_msn_jal_11_isfahan_nisf_e_jahan_desc:0 "Crown Isfahan with Naqsh-e Jahan Square, tiled mosques, and bustling international caravanserais."
 oe_msn_jal_11_isfahan_nisf_e_jahan_req_tt:0 "Own Isfahan with at least 15 Stability in the Age of Reformation or later."
 oe_msn_jal_12_shahanshah_eurasia:0 "Shahanshah of Tigris, Plateau & Gulf"
 oe_msn_jal_12_shahanshah_eurasia_desc:0 "Holding Baghdad, Tabriz, Isfahan, and Hormuz in unassailable splendor crowns the supreme post-Ilkhanate empire."
 oe_msn_jal_12_shahanshah_eurasia_req_tt:0 "Own Baghdad, Tabriz, Isfahan, and Hormuz with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_mar_destiny:0 "#bold #color_yellow Deccan & Maratha Swarajya: Indian Ocean Bastion#!#!"
 oe_msn_mar_destiny_DESCRIPTION:0 "From Sahyadri Hill-Forts and Bargir Raiders to Deccan Rockets, Konkan Sea-Forts, Gujarat-Bengal Guilds, and Sovereign Oceanic Bastion"
 oe_msn_mar_destiny_CRITERIA_DESCRIPTION:0 "Unite the Deccan, Maharashtra, Konkan, Gujarat, and Bengal under Swarajya or a sovereign Deccan federation, field Bargir light horse and iron rocket-elephant brigades, and expel foreign company monopolies from Indian seas."
 oe_msn_mar_destiny_BUTTON_TOOLTIP:0 "Embark on the Deccan & Maratha Swarajya Destiny"
 oe_msn_mar_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Maratha (MHR), Deccan (DEC), Bahmanis (BAH), Bengal (BNG), Gujarat (GUJ), and their 1337 regional realms: fortify Pune, Raigarh, Daulatabad, Bijapur, and Golconda, unleash Bargir fast cavalry and rocket-elephant batteries, master Konkan, Surat, and Sonargaon, and guard Indian Ocean sovereignty."
 oe_msn_mar_01_sahyadri_swarajya:0 "Kindle the Deccan & Swarajya Flame"
 oe_msn_mar_01_sahyadri_swarajya_desc:0 "Consolidate a secure base across Maharashtra, the Deccan plateau, Gujarat, Orissa, or Bengal to launch our oceanic rise."
 oe_msn_mar_01_sahyadri_swarajya_req_tt:0 "Own Pune, Daulatabad, Bijapur, Golconda, Salagiri, Jawhar, Sonargaon, Surat, or Kataka with at least 5 Stability."
 oe_msn_mar_02_bargir_light_horse:0 "Muster Bargir Light Horse & Hill Garrisons"
 oe_msn_mar_02_bargir_light_horse_desc:0 "Mount crown-equipped Bargir fast cavalry and provision hilltop basalt fortresses for lightning Ganimi Kava warfare."
 oe_msn_mar_02_bargir_light_horse_req_tt:0 "Hold at least 180 Gold and have at least 8 Stability."
 oe_msn_mar_03_deccan_rocket_batteries:0 "Iron War-Rockets & Elephant Batteries"
 oe_msn_mar_03_deccan_rocket_batteries_desc:0 "Combine hammered-iron gunpowder rockets with armored war-elephants and bronze cannon for terrifying battlefield shock."
 oe_msn_mar_03_deccan_rocket_batteries_req_tt:0 "Hold at least 240 Gold in the Age of Discovery or later."
 oe_msn_mar_04_ashta_pradhan_command:0 "Ashta Pradhan & Deccan Combined Arms"
 oe_msn_mar_04_ashta_pradhan_command_desc:0 "Pair a disciplined eight-minister royal cabinet with swift Bargir raiders and rocket artillery across the plateau."
 oe_msn_mar_04_ashta_pradhan_command_req_tt:0 "Control at least 35 Locations with at least 14 Stability in the Age of Reformation or later."
 oe_msn_mar_05_pune_raigarh_desh:0 "Sahyadri Heartland: Pune, Raigarh & Satara"
 oe_msn_mar_05_pune_raigarh_desh_desc:0 "Master the mountain citadels of the Desh heartland, securing Pune alongside Raigarh or Satara."
 oe_msn_mar_05_pune_raigarh_desh_req_tt:0 "Own Pune and either Raigarh or Satara."
 oe_msn_mar_06_deccan_sultanates:0 "Plateau Strongholds: Bijapur & Golconda"
 oe_msn_mar_06_deccan_sultanates_desc:0 "Bring the diamond treasuries and artillery citadels of the Deccan plateau beneath one sovereign banner."
 oe_msn_mar_06_deccan_sultanates_req_tt:0 "Own Daulatabad or Bijapur, and own Golconda or Bidar."
 oe_msn_mar_07_konkan_gujarat_seaboard:0 "Konkan & Gujarat Seaboard: Goa & Surat"
 oe_msn_mar_07_konkan_gujarat_seaboard_desc:0 "Secure the Konkan naval coast alongside the grand merchant emporia of Surat or Khambat to dominate western Indian trade."
 oe_msn_mar_07_konkan_gujarat_seaboard_req_tt:0 "Own Goa, Bombay, or Dabhol, own Surat or Khambat, and control at least 30 Locations."
 oe_msn_mar_08_bengal_oceanic_arc:0 "From Arabian Sea to Bay of Bengal"
 oe_msn_mar_08_bengal_oceanic_arc_desc:0 "Extend sovereign reach across the eastern seaboard to Sonargaon, Gaur, or Kataka, unifying both flanks of the Indian Ocean."
 oe_msn_mar_08_bengal_oceanic_arc_req_tt:0 "Own Sonargaon, Gaur, or Kataka in the Age of Discovery or later."
 oe_msn_mar_09_wootz_muslin_looms:0 "Wootz Steel, Calico & Muslin Guilds"
 oe_msn_mar_09_wootz_muslin_looms_desc:0 "Nurture crucible steel smithies, chintz dye works, and muslin looms that draw global silver into our ports."
 oe_msn_mar_09_wootz_muslin_looms_req_tt:0 "Have at least 10 Stability in the Age of Renaissance or later."
 oe_msn_mar_10_hundi_monsoon_banking:0 "Hundi Banking & Konkan Sea-Forts"
 oe_msn_mar_10_hundi_monsoon_banking_desc:0 "Pair subcontinental Hundi banking credit with rock-anchored island sea-forts and coastal Gurab shipyards."
 oe_msn_mar_10_hundi_monsoon_banking_req_tt:0 "Hold at least 300 Gold."
 oe_msn_mar_11_expel_company_monopolies:0 "Break Foreign East India Monopolies"
 oe_msn_mar_11_expel_company_monopolies_desc:0 "Enforce sovereign admiralty passes and charter indigenous deep-water fleets so no European company dictates terms on Indian shores."
 oe_msn_mar_11_expel_company_monopolies_req_tt:0 "Have at least one Port and at least 15 Stability in the Age of Reformation or later."
 oe_msn_mar_12_hindavi_ocean_bastion:0 "Swarajya & Indian Ocean Bastion Eternal"
 oe_msn_mar_12_hindavi_ocean_bastion_desc:0 "Mastering the plateau citadels and Arabian-Bengal gateways crowns an unconquered sovereign bastion ruling the Indian Ocean."
 oe_msn_mar_12_hindavi_ocean_bastion_req_tt:0 "Own Pune, Golconda, or Sonargaon, own Goa or Surat, and have at least 18 Stability in the Age of Absolutism or later."
