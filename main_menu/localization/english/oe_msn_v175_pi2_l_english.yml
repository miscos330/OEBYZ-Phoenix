# NEW 2026-11-23 v17.5 Steppe Storms, Eurasian Plates & Responsive World — Module 17.5-C: v17.5 Persia, Caucasus & India Mission Trees oe_msn_45..47 (english) (oe_pi2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v175_persia_india_caucasus.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m1:0 "Unbroken Bagrationi Mountain Shield"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m1:0 "Khevsur chainmail regiments, Sadrosho regional banners, and cliffside stone citadels turn every Caucasus pass into an invader's grave."
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m2:0 "Sovereign Bridge of Two Seas"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m2:0 "Controlling Batumi, Tbilisi, Baku, and the Iron Gate of Derbent turns the Caucasus into Eurasia's premier inter-sea crossroads."
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m3:0 "Dasturlamali & Highland Enlightenment"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m3:0 "Codified royal administration, Gelati and Etchmiadzin academies, and printed Caucasian letters elevate both governance and prestige."
 STATIC_MODIFIER_NAME_oe_pi2_msn_geo_m4:0 "Second Golden Age of Tamar Eternal"
 STATIC_MODIFIER_DESC_oe_pi2_msn_geo_m4:0 "From the Black Sea shore to the Caspian gates, the united Caucasian realm shines as an unconquered fortress of faith, commerce, and learning."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m1:0 "Qizilbash, Ghulam & Zamburak War Machine"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m1:0 "Armored Qizilbash lancers, salaried Ghulam guards, and rapid Zamburak swivel cannon command every battlefield from Tigris to Oxus."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m2:0 "Master of the Gulf & Khorasan Gates"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m2:0 "Commanding Hormuz, Basra, Mashhad, and Herat locks both the Indian Ocean sea-lanes and the eastern Silk Road."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m3:0 "Isfahan Nisf-e Jahan & Royal Karkhaneh"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m3:0 "Tiled imperial squares, qanat gardens, and royal silk-and-carpet manufactories radiate unmatched Iranian prestige and wealth."
 STATIC_MODIFIER_NAME_oe_pi2_msn_jal_m4:0 "Shahanshah of Tigris, Plateau & Gulf"
 STATIC_MODIFIER_DESC_oe_pi2_msn_jal_m4:0 "Uniting Baghdad, Tabriz, Isfahan, and Hormuz under modern Iranian statecraft restores the grandest Eurasian empire between Rome and India."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m1:0 "Swarajya Bargir Horse & Rocket Ordnance"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m1:0 "Lightning Maratha Bargir cavalry, Sahyadri fortresses, and Deccan iron war-rockets overwhelm heavier imperial formations."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m2:0 "Twin-Coast Oceanic Arc: Surat to Sonargaon"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m2:0 "Commanding both the Arabian Sea ports of Konkan and Gujarat and the lush delta of Bengal unites India's maritime wealth."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m3:0 "Sovereign Indian Ports & Hundi Finance"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m3:0 "Autonomous shipyards, Wootz steel workshops, and Hundi banking syndicates break foreign trading-company monopolies forever."
 STATIC_MODIFIER_NAME_oe_pi2_msn_mar_m4:0 "Swarajya & Indian Ocean Bastion Eternal"
 STATIC_MODIFIER_DESC_oe_pi2_msn_mar_m4:0 "Uniting the Western Ghats, Deccan plateau, and oceanic entrepots crowns an unconquered sovereign bastion of South Asia."
 oe_msn_geo_destiny:0 "#bold #color_yellow Georgia & Caucasus: Bagrationi Shield#!#!"
 oe_msn_geo_destiny_DESCRIPTION:0 "From George V's Recovery and Khevsur Highland Castles to the Two-Seas Bridge, Dasturlamali Code, and Second Golden Age of Queen Tamar"
 oe_msn_geo_destiny_CRITERIA_DESCRIPTION:0 "Unite Kartli, Imereti, Samtskhe, Armenia, and Shirvan from the Black Sea to the Caspian, raise invincible Khevsur highland guards and fortress-monasteries against rival empires, and crown a Second Caucasian Golden Age."
 oe_msn_geo_destiny_BUTTON_TOOLTIP:0 "Embark on the Caucasus Bagrationi Destiny"
 oe_msn_geo_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Georgia, Armenia, and the Caucasus: consolidate Tbilisi, Kutaisi, Yerevan, Baku, and Derbent, command Sadrosho banners and Khevsur heavy infantry behind impregnable mountain castles, weave Black-to-Caspian silk and New Julfa trade, and usher in the Second Golden Age of Queen Tamar."
 oe_msn_geo_01_brilliant_recovery:0 "George V's Brilliant Recovery"
 oe_msn_geo_01_brilliant_recovery_desc:0 "Throwing off Mongol tribute as Ilkhanid power fractured, King George V the Brilliant restored royal law across the Kura valleys and rebuilt shattered mountain towns. Repairing civic [buildings|e] revives valley [development|e], deepens [stability|e], and renews Bagratid [legitimacy|e]."
 oe_msn_geo_01_brilliant_recovery_req_tt:0 "Hold Tbilisi, Kutaisi, Akhaltsikhe, Yerevan, or Baku (or via subjects), Stability >= 5, and own a Castle or Marketplace."
 oe_msn_geo_02_khevsur_sadrosho:0 "Sadrosho Banners & Khevsur Guard"
 oe_msn_geo_02_khevsur_sadrosho_desc:0 "Organizing the realm into four territorial sadrosho banners led by highland eristavis and chain-mailed Khevsur swordsmen lets Georgia mobilize swiftly whenever invaders cross the passes. Rallying noble [estates|e] marshals hardy [manpower|e], toughens our [army|e], and builds [army_tradition|e]."
 oe_msn_geo_02_khevsur_sadrosho_req_tt:0 "Gold >= 180, Stability >= 8, Weapon Guild or Castle, and Nobles Satisfaction >= 50%."
 oe_msn_geo_03_darial_fortresses:0 "Bastions of the Darial & Roki Passes"
 oe_msn_geo_03_darial_fortresses_desc:0 "From Svaneti's stone watchtowers to the iron gates of the Darial and Roki gorges, narrow alpine ravines turn every highland defile into a graveyard for steppe horsemen. Strengthening mountain [fort|e] networks with modern [advances|e] entrenches [control|e] and seasons [regulars|e]."
 oe_msn_geo_03_darial_fortresses_req_tt:0 "Age of Renaissance+, Stability >= 12, Armory or Castle, and Army Tradition >= 18 or Professional Armies."
 oe_msn_geo_04_defy_the_empires:0 "Defy Ottoman-Persian Partition"
 oe_msn_geo_04_defy_the_empires_desc:0 "When Ottoman sultans and Persian shahs signed treaties dividing the Caucasus between them, united Georgian arms refused the fate of Amasya's partition. Defending bastioned [fort|e] lines with elite [army_tradition|e] protects [crown_power|e] and commands imperial [prestige|e]."
 oe_msn_geo_04_defy_the_empires_req_tt:0 "Age of Reformation+, hold Tbilisi and Akhaltsikhe, Stability >= 15, Bastion or Barracks, and Army Tradition >= 25."
 oe_msn_geo_05_kartli_imereti_samtskhe:0 "Unite Kartli, Imereti & Samtskhe"
 oe_msn_geo_05_kartli_imereti_samtskhe_desc:0 "Too often the Likhi Mountains split Georgia into rival kingdoms of Kartli, Imereti, and princely Samtskhe, inviting foreign meddling. Uniting all three crowns into one undivided [core|e] strengthens national [control|e], heals regional [stability|e], and pools Caucasian [manpower|e]."
 oe_msn_geo_05_kartli_imereti_samtskhe_req_tt:0 "Hold Tbilisi, Kutaisi, and Akhaltsikhe (or via subjects), and Clergy Satisfaction >= 50%."
 oe_msn_geo_06_armenian_highlands:0 "Shield of Ararat: Yerevan, Ani & Kars"
 oe_msn_geo_06_armenian_highlands_desc:0 "Just as Queen Tamar's generals liberated the thousand-church city of Ani and the Aras valleys, extending our shield over Yerevan and Kars guards the southern approach to Mount Ararat. Integrating these highlands into our [core|e] bolsters [religious_influence|e], [diplomacy|e], and alpine [prosperity|e]."
 oe_msn_geo_06_armenian_highlands_req_tt:0 "Hold Yerevan and Ani or Kars (or via subjects), and Army Tradition >= 14."
 oe_msn_geo_07_shirvan_caspian_gates:0 "Shirvan Silk Ports & Derbent Gate"
 oe_msn_geo_07_shirvan_caspian_gates_desc:0 "Marching east along the Kura delta to seize Shamakhi's silk looms, Baku's naphtha port, and the ancient Sasanian walls of Derbent seals the Caspian coast. Turning Shirvan into a loyal [core|e] expands eastern [trade|e], fills royal [gold|e] chests, and secures steppe-gate [control|e]."
 oe_msn_geo_07_shirvan_caspian_gates_req_tt:0 "Hold Baku and Derbent or Shamakhi (or via subjects), 22+ locations owned or by subjects, and own a Caravanserai or Marketplace."
 oe_msn_geo_08_two_seas_caucasus:0 "Sovereign Bridge of Black & Caspian Seas"
 oe_msn_geo_08_two_seas_caucasus_desc:0 "Spanning the narrow isthmus from Black Sea ports at Batumi to Caspian wharves at Baku turns Georgia into the indispensable land bridge between Europe and Central Asia. Linking both shores deepens [maritime_presence|e], enriches our [market|e], trains [sailors|e], and lifts [navy_tradition|e]."
 oe_msn_geo_08_two_seas_caucasus_req_tt:0 "Age of Discovery+, hold Batumi, Tbilisi, and Baku, Trading Hub or Dry Dock, and own a port."
 oe_msn_geo_09_fortress_monasteries:0 "Gelati, Gladzor & Fortress Monasteries"
 oe_msn_geo_09_fortress_monasteries_desc:0 "High above wooded gorges, the fortified academies of Gelati, Vardzia, and Gladzor preserved Neoplatonic philosophy, polyphonic chant, and illuminated manuscripts through every invasion. Patronizing monastic [buildings|e] lifts [literacy|e], [religious_influence|e], and [cultural_tradition|e]."
 oe_msn_geo_09_fortress_monasteries_req_tt:0 "Age of Renaissance+, hold Tbilisi or Yerevan, Monastery or University, and Capital Development >= 16."
 oe_msn_geo_10_silk_wine_caravans:0 "Silk, Wine & New Julfa Merchant Houses"
 oe_msn_geo_10_silk_wine_caravans_desc:0 "Kakhetian qvevri vintages, Kakheti raw silk, and resourceful Armenian merchant houses linked Caucasian mountain towns with Genoa, Amsterdam, and Isfahan. Fostering overland [trade|e] through merchant [diplomacy|e] swells our [gold|e] treasury and raises burgher [estate_satisfaction|e]."
 oe_msn_geo_10_silk_wine_caravans_req_tt:0 "Gold >= 260, Silk Production Guild or Caravanserai, and Trade/Tax Income >= 25."
 oe_msn_geo_11_dasturlamali_renaissance:0 "Dasturlamali Code & Caucasian Presses"
 oe_msn_geo_11_dasturlamali_renaissance_desc:0 "King Vakhtang VI compiled the Dasturlamali administrative code and established Tbilisi's first Georgian printing press, publishing Rustaveli's epic alongside modern statutes. Pairing printed [institutions|e] with rising [literacy|e] sharpens [cabinet|e] governance and speeds [advances|e]."
 oe_msn_geo_11_dasturlamali_renaissance_req_tt:0 "Age of Reformation+, Stability >= 15, embrace Printing Press, Printing Press Shop or Library, and Capital Development >= 22."
 oe_msn_geo_12_crown_of_queen_tamar:0 "Second Golden Age of Queen Tamar"
 oe_msn_geo_12_crown_of_queen_tamar_desc:0 "From Black Sea cliffs to Caspian sands and Mount Ararat's snows, the cross-banner of Georgia flies once more over a united Caucasian realm worthy of Queen Tamar's Golden Age. Sustained by [capital|e] [prosperity|e] and proud [legitimacy|e], Tbilisi stands as a sovereign [great_power|e]."
 oe_msn_geo_12_crown_of_queen_tamar_req_tt:0 "Age of Absolutism+, hold Tbilisi, Yerevan, and Baku, Stability >= 18, Capital Development >= 26, and Great Power or Trade/Tax Income >= 95."
 oe_msn_jal_destiny:0 "#bold #color_yellow Post-Ilkhanate Persia: Heirs of Baghdad & Tabriz#!#!"
 oe_msn_jal_destiny_DESCRIPTION:0 "From Jalayirid, Turkmen & Ardabil Revival to Qizilbash Lancers, Hormuz Liberation, and Isfahan Nisf-e Jahan"
 oe_msn_jal_destiny_CRITERIA_DESCRIPTION:0 "Unite the post-Ilkhanate succession across Baghdad, Tabriz, Shiraz, Isfahan, Hormuz, and Herat, modernize Qizilbash cavalry into a gunpowder Shahanshah army, and turn Isfahan into Half the World."
 oe_msn_jal_destiny_BUTTON_TOOLTIP:0 "Embark on the Heirs of Baghdad & Tabriz Destiny"
 oe_msn_jal_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Jalayirids, Qara & Aq Qoyunlu, Muzaffarids, Injuids, Ardabil, and Persian successor realms: reunite Tigris and plateau capitals, forge Qizilbash lancers and post-Chaldiran gunpowder corps, reclaim Hormuz and Khorasan, and crown Isfahan Nisf-e Jahan."
 oe_msn_jal_01_heirs_of_the_ilkhan:0 "Heirs of Baghdad & Tabriz"
 oe_msn_jal_01_heirs_of_the_ilkhan_desc:0 "As the Ilkhanate fractures from the Tigris to Azerbaijan, claiming its storied cities anchors our [capital|e] and affirms [crown_power|e] over rival emirs. Reopening caravan inns revives [trade|e] across the plateau and restores enduring [stability|e] to the realm."
 oe_msn_jal_01_heirs_of_the_ilkhan_req_tt:0 "Hold Baghdad, Tabriz, Shiraz, Yazd, Ardabil, or Isfahan (directly or via subject), have at least 5 Stability, and own a Marketplace or Caravanserai."
 oe_msn_jal_02_qizilbash_banners:0 "Muster Qizilbash Heavy Lancers"
 oe_msn_jal_02_qizilbash_banners_desc:0 "Scarlet-turbaned Turkmen horsemen ride from Anatolia and Azerbaijan to pledge their lances under our royal banner, swelling our [manpower|e] and forging fierce [army_tradition|e]. Harmonizing tribal chiefs among the [estates|e] turns steppe devotion into disciplined shock cavalry."
 oe_msn_jal_02_qizilbash_banners_req_tt:0 "Hold at least 180 Gold and 8 Stability, own a Castle or Weapon Guild, and keep Nobles Satisfaction at least 45% (if present)."
 oe_msn_jal_03_tofangchi_tupchi:0 "Beyond Chaldiran: Tofangchi & Artillery"
 oe_msn_jal_03_tofangchi_tupchi_desc:0 "The thunder of Ottoman field guns at Chaldiran proved that courage alone cannot break ranked fire, compelling our [army|e] to drill Tofangchi musketeers and Tupchi artillerymen as salaried [regulars|e]. Embracing modern gunpowder [advances|e] elevates our [army_tradition|e] to match any rival empire."
 oe_msn_jal_03_tofangchi_tupchi_req_tt:0 "In the Age of Discovery or later, hold at least 240 Gold and 20 Army Tradition, own a Cannon Maker or Training Fields, and embrace Professional Armies or research Pike and Shot."
 oe_msn_jal_04_ghulam_zamburak_corps:0 "Ghulam Royal Guard & Zamburak Corps"
 oe_msn_jal_04_ghulam_zamburak_corps_desc:0 "Raising Caucasian Ghulam guards paid directly from the royal treasury frees [crown_power|e] from tribal factionalism and anchors our [regulars|e] alongside swift camel-mounted Zamburak swivel guns. Bastioned frontier [fort|e] chains shield the heartland and deepen internal [stability|e]."
 oe_msn_jal_04_ghulam_zamburak_corps_req_tt:0 "In the Age of Reformation or later, control at least 35 Locations, have 14 Stability and 30 Army Tradition, and own a Barracks or Bastion."
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan:0 "Twin Capitals: Baghdad & Tabriz"
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan_desc:0 "Baghdad guards the fertile alluvium of the Tigris while Tabriz commands the mountain passes of Azerbaijan, twin poles worthy of an imperial [capital|e] and proud [core|e] domain. Linking both metropolises accelerates urban [development|e] and broadcasts unmatched [prestige|e] across the Islamic world."
 oe_msn_jal_05_twin_capitals_tigris_azerbaijan_req_tt:0 "Control both Baghdad and Tabriz directly or through non-sovereign subjects."
 oe_msn_jal_06_fars_isfahan_shiraz:0 "Heart of Iran: Isfahan & Shiraz"
 oe_msn_jal_06_fars_isfahan_shiraz_desc:0 "From the rose gardens of Shiraz to the turquoise domes of Isfahan, the Persian plateau forms the enduring [core|e] of imperial [control|e] and fiscal power. Protecting oasis bazaars channels silk and spice into every [market|e], spreading civic [prosperity|e] from Fars to the Zagros."
 oe_msn_jal_06_fars_isfahan_shiraz_req_tt:0 "Control Isfahan and Shiraz (directly or via subject) and own a Madrasa or Caravanserai."
 oe_msn_jal_07_hormuz_gulf_dominion:0 "Liberate Hormuz & the Gulf Seaboard"
 oe_msn_jal_07_hormuz_gulf_dominion_desc:0 "Whoever commands the island fortress of Hormuz and the Shatt al-Arab estuary holds the key to Indian Ocean [trade|e] and collects torrents of customs [gold|e]. Stationing war dhows along the Gulf coast builds [navy_tradition|e] and secures unchallenged [maritime_presence|e] against foreign squadrons."
 oe_msn_jal_07_hormuz_gulf_dominion_req_tt:0 "Control Hormuz and either Basra or Kerman (directly or via subject), hold at least 30 Locations, and have a Port."
 oe_msn_jal_08_khorasan_herat_mashhad:0 "Eastern Shield: Mashhad & Herat"
 oe_msn_jal_08_khorasan_herat_mashhad_desc:0 "Khorasan is both the eastern shield against steppe incursions and the luminous cradle of Persianate [cultural_tradition|e]. Garrisoning Herat and Mashhad strengthens frontier [fort|e] networks, tightens [control|e] over Transoxian roads, and keeps border [subjects|e] loyal to the Shah."
 oe_msn_jal_08_khorasan_herat_mashhad_req_tt:0 "In the Age of Discovery or later, control Mashhad and Herat (directly or via subject) and own a Castle or Caravanserai."
 oe_msn_jal_09_baghdad_shiraz_ateliers:0 "Miniature Ateliers & Persian Letters"
 oe_msn_jal_09_baghdad_shiraz_ateliers_desc:0 "Master miniaturists from Baghdad, Tabriz, and Shiraz illuminate royal copies of the Shahnameh in lapis lazuli and gold leaf, crowning our [cultural_tradition|e] with immortal splendor. Endowing scriptoria and scholarly [buildings|e] raises court [literacy|e] and spreads imperial [prestige|e] from Delhi to Constantinople."
 oe_msn_jal_09_baghdad_shiraz_ateliers_req_tt:0 "In the Age of Renaissance or later, have at least 10 Stability, Capital Development 22, and own an Art School or Scriptorium."
 oe_msn_jal_10_qanat_karkhaneh_silk:0 "Qanat Irrigation & Royal Karkhaneh Silk"
 oe_msn_jal_10_qanat_karkhaneh_silk_desc:0 "Subterranean qanat channels draw snowmelt across arid basins to feed mulberry groves, while royal Karkhaneh workshops weave prized Gilan silk and knotted carpets inside specialized [buildings|e]. Steady bullion [gold|e] from Eurasian [trade|e] sustains rural [prosperity|e] across every oasis province."
 oe_msn_jal_10_qanat_karkhaneh_silk_req_tt:0 "Hold at least 300 Gold, earn 25 monthly trade and tax income, and own an Aqueduct System or Silk Production Guild."
 oe_msn_jal_11_isfahan_nisf_e_jahan:0 "Isfahan: Nisf-e Jahan (Half the World)"
 oe_msn_jal_11_isfahan_nisf_e_jahan_desc:0 "Around the vast Naqsh-e Jahan square rise tiled mosques, arched bridges, and royal bazaars that transform our [capital|e] into Half the World through monumental [development|e]. Welcoming Armenian, Indian, and European merchants enriches the [market|e] and lifts guild [estate_satisfaction|e] throughout the realm."
 oe_msn_jal_11_isfahan_nisf_e_jahan_req_tt:0 "In the Age of Reformation or later, control Isfahan (directly or via subject), have 15 Stability, Capital Development 32, an Arts Academy or University, and Burghers Satisfaction at least 50% (if present)."
 oe_msn_jal_12_shahanshah_eurasia:0 "Shahanshah of Tigris, Plateau & Gulf"
 oe_msn_jal_12_shahanshah_eurasia_desc:0 "United from the Tigris plains to the Hormuz narrows under one Shahanshah, our empire commands the central crossroads of Eurasia as an undisputed [great_power|e] of unmatched [legitimacy|e]. Modernized ministries in the royal [cabinet|e] and forward-looking [institutions|e] seal a lasting Persianate golden age."
 oe_msn_jal_12_shahanshah_eurasia_req_tt:0 "In the Age of Absolutism or later, control Baghdad, Tabriz, Isfahan, and Hormuz (directly or via subject), have 18 Stability, and be a Great Power or earn at least 90 monthly trade and tax income."
 oe_msn_mar_destiny:0 "#bold #color_yellow Deccan & Maratha Swarajya: Indian Ocean Bastion#!#!"
 oe_msn_mar_destiny_DESCRIPTION:0 "From Sahyadri Hill-Forts and Bargir Raiders to Deccan Rockets, Konkan Sea-Forts, Gujarat-Bengal Guilds, and Sovereign Oceanic Bastion"
 oe_msn_mar_destiny_CRITERIA_DESCRIPTION:0 "Unite the Deccan, Maharashtra, Konkan, Gujarat, and Bengal under Swarajya or a sovereign Deccan federation, field Bargir light horse and iron rocket-elephant brigades, and expel foreign company monopolies from Indian seas."
 oe_msn_mar_destiny_BUTTON_TOOLTIP:0 "Embark on the Deccan & Maratha Swarajya Destiny"
 oe_msn_mar_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Maratha (MHR), Deccan (DEC), Bahmanis (BAH), Bengal (BNG), Gujarat (GUJ), and their 1337 regional realms: fortify Pune, Raigarh, Daulatabad, Bijapur, and Golconda, unleash Bargir fast cavalry and rocket-elephant batteries, master Konkan, Surat, and Sonargaon, and guard Indian Ocean sovereignty."
 oe_msn_mar_01_sahyadri_swarajya:0 "Kindle the Deccan & Swarajya Flame"
 oe_msn_mar_01_sahyadri_swarajya_desc:0 "Among the misty basalt crags of the Western Ghats and the rich river basins of the Deccan, a vow of Swarajya kindles sovereign [legitimacy|e] and anchors our [capital|e]. Fortifying hilltop [fort|e] redoubts secures internal [stability|e] before the great campaigns ahead."
 oe_msn_mar_01_sahyadri_swarajya_req_tt:0 "Control Pune, Daulatabad, Bijapur, Golconda, Salagiri, Jawhar, Sonargaon, Surat, or Kataka (directly or via subject), have 5 Stability, and own a Castle or Marketplace."
 oe_msn_mar_02_bargir_light_horse:0 "Muster Bargir Light Horse & Hill Garrisons"
 oe_msn_mar_02_bargir_light_horse_desc:0 "State-mounted Bargir horsemen and Mavala hill infantry master Ganimi Kava ambush warfare, turning Deccan passes into traps that forge peerless [army_tradition|e]. Drawing hardy mountain [manpower|e] into royal pay keeps [regulars|e] swift, lean, and independent of feudal whim."
 oe_msn_mar_02_bargir_light_horse_req_tt:0 "Hold at least 180 Gold and 8 Stability, own a Weapon Guild or Castle, and keep Nobles Satisfaction at least 45% (if present)."
 oe_msn_mar_03_deccan_rocket_batteries:0 "Iron War-Rockets & Elephant Batteries"
 oe_msn_mar_03_deccan_rocket_batteries_desc:0 "Forged from high-carbon Deccan iron tubes bound to bamboo shafts and paired with elephant-drawn heavy ordnance, our war-rockets shatter cavalry charges with howling trails of flame. Turning native gunpowder [advances|e] into doctrinal fire upgrades our [army|e], sharpens [army_tradition|e], and spreads battle [prestige|e]."
 oe_msn_mar_03_deccan_rocket_batteries_req_tt:0 "In the Age of Discovery or later, hold 240 Gold and 20 Army Tradition, own a Cannon Maker or Training Fields, and embrace Professional Armies or research Pike and Shot."
 oe_msn_mar_04_ashta_pradhan_command:0 "Ashta Pradhan & Deccan Combined Arms"
 oe_msn_mar_04_ashta_pradhan_command_desc:0 "Modeled on the Ashta Pradhan council of eight salaried ministers, our central [cabinet|e] separates finance, justice, intelligence, and combined-arms command to exalt [crown_power|e]. Permanent garrisons in modern [fort|e] chains bind distant provinces into lasting [control|e]."
 oe_msn_mar_04_ashta_pradhan_command_req_tt:0 "In the Age of Reformation or later, control at least 35 Locations, have 14 Stability and 30 Army Tradition, and own a Barracks or Bastion."
 oe_msn_mar_05_pune_raigarh_desh:0 "Sahyadri Heartland: Pune, Raigarh & Satara"
 oe_msn_mar_05_pune_raigarh_desh_desc:0 "High above the Konkan cliffs stands the eagle-nest citadel of Raigarh, while Pune and Satara command the fertile Desh plateau as the unyielding [core|e] of Marathi sovereignty. Crowning the Chhatrapati in this mountain sanctuary elevates [prestige|e], stimulates urban [development|e], and rallies proud hill [estates|e]."
 oe_msn_mar_05_pune_raigarh_desh_req_tt:0 "Control Pune and either Raigarh or Satara directly or through non-sovereign subjects."
 oe_msn_mar_06_deccan_sultanates:0 "Plateau Strongholds: Bijapur & Golconda"
 oe_msn_mar_06_deccan_sultanates_desc:0 "Conquering the storied fortresses of Daulatabad, Bijapur, and diamond-famed Golconda brings the entire Deccan tableland into our [core|e] realm and floods the treasury with [gold|e]. Unifying rival plateau routes revives inland [market|e] fairs and extends firm administrative [control|e] across central India."
 oe_msn_mar_06_deccan_sultanates_req_tt:0 "Control Daulatabad or Bijapur AND Golconda or Bidar directly or through non-sovereign subjects."
 oe_msn_mar_07_konkan_gujarat_seaboard:0 "Konkan & Gujarat Seaboard: Goa & Surat"
 oe_msn_mar_07_konkan_gujarat_seaboard_desc:0 "Descending from the Ghats onto the Konkan shore and the mighty Gujarati emporium of Surat unlocks the full wealth of Arabian Sea [trade|e] and western coastal [prosperity|e]. Commissioning grab-and-gallivat coastal squadrons cultivates native [navy_tradition|e] and establishes vigilant [maritime_presence|e]."
 oe_msn_mar_07_konkan_gujarat_seaboard_req_tt:0 "Control Goa, Bombay, or Dabhol AND Surat or Khambat (directly or via subject), hold at least 30 Locations, and possess a Port."
 oe_msn_mar_08_bengal_oceanic_arc:0 "From Arabian Sea to Bay of Bengal"
 oe_msn_mar_08_bengal_oceanic_arc_desc:0 "Stretching from Surat's cotton quays to the muslin looms of Sonargaon and Orissa's delta shrines binds both Indian seas into one trans-peninsular [market|e] of astonishing [prosperity|e]. Commanding coastal harbors across two oceans draws tributary [subjects|e] into our orbit and elevates imperial [diplomacy|e]."
 oe_msn_mar_08_bengal_oceanic_arc_req_tt:0 "In the Age of Discovery or later, control Sonargaon, Gaur, or Kataka (directly or via subject) and own at least 6 Ports."
 oe_msn_mar_09_wootz_muslin_looms:0 "Wootz Steel, Calico & Muslin Guilds"
 oe_msn_mar_09_wootz_muslin_looms_desc:0 "Crucible-smelted Wootz Damascus steel from Telangana, hand-painted Deccan chintz, and gossamer Bengal muslin fill guild [buildings|e] with wares coveted from Cairo to Nagasaki. Safeguarding artisan charters yields abundant [gold|e], nourishes refined [cultural_tradition|e], and deepens urban [prosperity|e]."
 oe_msn_mar_09_wootz_muslin_looms_req_tt:0 "In the Age of Renaissance or later, have 10 Stability, Capital Development 22, and own a Fine Cloth Guild or Cloth Guild."
 oe_msn_mar_10_hundi_monsoon_banking:0 "Hundi Banking & Konkan Sea-Forts"
 oe_msn_mar_10_hundi_monsoon_banking_desc:0 "Trust-based Hundi bills of exchange settle caravan and monsoon voyages seamlessly across India while checking [inflation|e] and multiplying credit [gold|e]. Meanwhile, sea-girt Sindhudurg and Vijaydurg [fort|e] bastions shelter our crews and heighten merchant [estate_satisfaction|e]."
 oe_msn_mar_10_hundi_monsoon_banking_req_tt:0 "Hold at least 300 Gold, earn 25 monthly trade and tax income, and own a Wharf or Guild Hall."
 oe_msn_mar_11_expel_company_monopolies:0 "Break Foreign East India Monopolies"
 oe_msn_mar_11_expel_company_monopolies_desc:0 "Following Admiral Kanhoji Angre's defiant sea doctrine, our gunboats enforce sovereign passes on foreign East India companies and reclaim customs [trade|e] for Indian ports. Armed [navy|e] escorts guard coastal [sailors|e] and uphold uncompromised [maritime_presence|e] across our own littoral waters."
 oe_msn_mar_11_expel_company_monopolies_req_tt:0 "In the Age of Reformation or later, have a Port, 15 Stability, 20 Navy Tradition, a Customs House or Shipyard, and Burghers Satisfaction at least 50% (if present)."
 oe_msn_mar_12_hindavi_ocean_bastion:0 "Swarajya & Indian Ocean Bastion Eternal"
 oe_msn_mar_12_hindavi_ocean_bastion_desc:0 "From Sahyadri bastions to Surat and the Bengal estuary, Swarajya stands unbroken as an industrial and oceanic [great_power|e] that answered European empires on equal terms. Sovereign [institutions|e], proud [legitimacy|e], and thriving [development|e] crown an autonomous India that shapes global history."
 oe_msn_mar_12_hindavi_ocean_bastion_req_tt:0 "In the Age of Absolutism or later, control Pune, Golconda, or Sonargaon AND Goa or Surat (directly or via subject), have 18 Stability, and be a Great Power or earn at least 90 monthly trade and tax income."
