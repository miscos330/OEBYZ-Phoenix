l_english:
 OE_TFR_PANEL_HELP: "Set each theme's target; 0 disables it. Armies are capped at 100,000. Annual reinforcement stops below 1,000 gold."
 OE_TFR_SIZE_TT: "Current regular establishment / target. Levies are excluded. Exceeding the target does not disband units. A shortfall smaller than a full regiment is left unfilled."
 OE_TFR_SOLDIERS: "Soldiers"
 OE_TFR_SHIPS: "Ships"
 OE_TFR_COST_TT: "Each theme pays for its own annual reinforcements. Armies cycle through one light infantry, heavy infantry, light cavalry, heavy cavalry and artillery regiment; navies cycle through one heavy ship and three galleys. The next category is remembered between years. Unavailable categories are skipped.\n\nBase gold per 1,000 soldiers: light infantry 20, heavy infantry 30, light cavalry 60, heavy cavalry 100, artillery 100. Ships cost 500 gold per 1,000 crew. The relevant unit construction cost modifier applies, with a floor of 10% of base cost and at least 1 gold. Full manpower or crew is deducted. The 1,000-gold threshold and available resources are checked before each spawn. Uses available vanilla unit models."
 OE_TFR_COUNTRY: "Theme"
 OE_TFR_UNIT: "Unit"
 OE_TFR_CURRENT: "Current"
 OE_TFR_TARGET: "Target"
 OE_TFR_TARGET_TT: "Adjust the target with the arrows on the right.\nArmies: 1,000 per click; hold Shift for 10,000.\nNavies: 1 ship per click; hold Shift for 10.\nA target of 0 disables annual reinforcement."
 OE_TFR_INCREASE: "Increase target: 1,000 soldiers / 1 ship"
 OE_TFR_INCREASE_FAST: "Increase target: 10,000 soldiers / 10 ships"
 OE_TFR_DECREASE: "Decrease target: 1,000 soldiers / 1 ship"
 OE_TFR_DECREASE_FAST: "Decrease target: 10,000 soldiers / 10 ships"
