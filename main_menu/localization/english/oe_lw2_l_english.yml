l_english:
 # NEW 2026-11-23 v21.0 Module B: Laws 2.0 Overhaul (oe_lw2_) — Localization (english) (oe_lw2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v210_laws2.py; edit the generator, not this file.
 # Transition Static Modifiers
 STATIC_MODIFIER_NAME_oe_lw2_mod_crown_transition:0 "Chancery Statute Enactment"
 STATIC_MODIFIER_DESC_oe_lw2_mod_crown_transition:0 "Royal clerks and commissioners are reorganizing provincial registers to enforce a newly enacted statute of the Crown."
 STATIC_MODIFIER_NAME_oe_lw2_mod_noble_transition:0 "Aristocratic Charter Transition"
 STATIC_MODIFIER_DESC_oe_lw2_mod_noble_transition:0 "Landed magnates rally to confirm new legal privileges, bolstering muster readiness at the expense of court thrift."
 STATIC_MODIFIER_NAME_oe_lw2_mod_clergy_transition:0 "Ecclesiastical Ordinance Transition"
 STATIC_MODIFIER_DESC_oe_lw2_mod_clergy_transition:0 "Clerical courts and seminaries promulgate the new statute across parishes, strengthening orthodoxy while slowing secular innovation."
 STATIC_MODIFIER_NAME_oe_lw2_mod_burgher_transition:0 "Mercantile Charter Transition"
 STATIC_MODIFIER_DESC_oe_lw2_mod_burgher_transition:0 "Guild halls and port exchanges expand under newly codified commercial rules, drawing resentful murmurs from landed nobles."
 STATIC_MODIFIER_NAME_oe_lw2_mod_peasant_transition:0 "Agrarian Statute Transition"
 STATIC_MODIFIER_DESC_oe_lw2_mod_peasant_transition:0 "Village communes and freeholders settle into updated tenancy and labor guarantees, improving rural recovery at a temporary fiscal cost."
 STATIC_MODIFIER_NAME_oe_lw2_mod_tribal_transition:0 "Steppe & Clan Compact Transition"
 STATIC_MODIFIER_DESC_oe_lw2_mod_tribal_transition:0 "Pastoral banners and frontier clans renew their customary oaths under the revised law, trading tight administrative control for fierce cohesion."
 # Universal Age 1-6 State Codes
 oe_lw2_fiscal_budget_law:0 "Imperial Fiscal & Budget Code"
 oe_lw2_fiscal_budget_law_desc:0 "Establishes how the realm assesses land, collects customs and excises, and manages sovereign credit from medieval tax farms to modern state budgets."
 oe_lw2_pol_tax_farming:0 "Tax Farming Syndicates"
 oe_lw2_pol_tax_farming_desc:0 "Auctions regional tax collection rights to wealthy syndicates and magnates, securing predictable revenue early at the cost of weakened central oversight."
 oe_lw2_pol_cadastral_registry:0 "Cadastral Land Registry"
 oe_lw2_pol_cadastral_registry_desc:0 "Deploys imperial surveyors to compile household and land cadastres across every province—available from the outset to major bureaucratic empires and Roman, Chinese, Persian, Mamluk, and Korean courts—raising direct fiscal extraction and control while curbing aristocratic exemptions."
 oe_lw2_pol_excise_monopolies:0 "Excise & State Monopolies"
 oe_lw2_pol_excise_monopolies_desc:0 "Institutes standardized excise tariffs alongside crown monopolies on salt, iron, and spirits, capturing commercial wealth at the expense of popular contentment."
 oe_lw2_pol_public_debt_budget:0 "Public Debt & Central Budget"
 oe_lw2_pol_public_debt_budget_desc:0 "Publishes an audited annual state budget backed by funded public bonds and a central treasury, lowering borrowing costs while empowering urban creditors."
 oe_lw2_military_service_law:0 "Standing Army & Service Code"
 oe_lw2_military_service_law_desc:0 "Defines who bears arms for the state—ranging from knightly retinues and chartered mercenaries to frontier military colonists and national conscription."
 oe_lw2_pol_feudal_retinues:0 "Feudal Retinues"
 oe_lw2_pol_feudal_retinues_desc:0 "Calls upon hereditary noble households to furnish heavy horsemen and armored retainers, strengthening shock cavalry while entrenching aristocratic power."
 oe_lw2_pol_chartered_companies:0 "Chartered Free Companies"
 oe_lw2_pol_chartered_companies_desc:0 "Contracts professional mercenary captains under regulated crown charters, economizing on hired regiments at the expense of domestic manpower mobilization."
 oe_lw2_pol_frontier_colonies:0 "Frontier Military Colonies"
 oe_lw2_pol_frontier_colonies_desc:0 "Settles hereditary soldier-farmers and thematic frontier garrisons along border marches with tax-exempt plots in exchange for permanent military service—immediately available to Roman-Byzantine, Chinese, Persian, and Turkic realms—expanding manpower and fortress resilience at a modest tax cost."
 oe_lw2_pol_universal_conscription:0 "Universal Conscription Act"
 oe_lw2_pol_universal_conscription_desc:0 "Subjects able-bodied citizens to standardized national conscription and regimental drill, creating deep disciplined armies with steep upkeep and popular strain."
 oe_lw2_maritime_commerce_law:0 "Maritime & Charter Commerce Code"
 oe_lw2_maritime_commerce_law_desc:0 "Regulates staple ports, shipping lanes, oceanic trading charters, and customs barriers across coastal and long-distance maritime commerce."
 oe_lw2_pol_coastal_staple:0 "Coastal Staple Privileges"
 oe_lw2_pol_coastal_staple_desc:0 "Requires maritime cargoes to clear through designated municipal staple harbors, bolstering merchant guilds and coastal presence while conceding crown leverage."
 oe_lw2_pol_mercantilist_navigation:0 "Mercantilist Navigation Acts"
 oe_lw2_pol_mercantilist_navigation_desc:0 "Reserves domestic and colonial shipping exclusively for national hulls and crews, nurturing shipyards and sailors at the cost of foreign diplomatic friction."
 oe_lw2_pol_oceanic_chartered:0 "Oceanic Chartered Companies"
 oe_lw2_pol_oceanic_chartered_desc:0 "Grants joint-stock charters with overseas trading monopolies and private factors, extending global commercial reach while elevating merchant oligarchs."
 oe_lw2_pol_free_port_charter:0 "Free Port Commercial Charter"
 oe_lw2_pol_free_port_charter_desc:0 "Dismantles restrictive guild monopolies and opens designated entrepots to international shipping, accelerating trade volume and institutional exchange at a direct-tax cost."
 oe_lw2_judicial_code_law:0 "Judicial & Civil Code"
 oe_lw2_judicial_code_law_desc:0 "Determines the hierarchy of courts and legal doctrine across the realm, evolving from regional customary tribunals to unified statutory codes and modern civil jurisprudence."
 oe_lw2_pol_customary_courts:0 "Customary Local Courts"
 oe_lw2_pol_customary_courts_desc:0 "Upholds ancient manor, guild, and parish tribunals rooted in local custom, soothing every estate while slowing central legislative reform."
 oe_lw2_pol_codified_statutes:0 "Codified Roman-Statute Law"
 oe_lw2_pol_codified_statutes_desc:0 "Compiles a unified written code modeled on Roman jurisprudence enforced by crown jurists, sharpening legislative authority at the expense of noble judicial autonomy."
 oe_lw2_pol_administrative_courts:0 "Independent Administrative Courts"
 oe_lw2_pol_administrative_courts_desc:0 "Establishes salaried provincial tribunals that audit governors and speed royal decrees to distant districts, requiring a larger salaried bureaucracy."
 oe_lw2_pol_modern_civil_code:0 "Modern Civil Code"
 oe_lw2_pol_modern_civil_code_desc:0 "Enshrines legal equality, secure private contracts, and uniform civil procedure across all provinces, accelerating social mobility while overturning aristocratic birthrights."
 oe_lw2_press_academy_law:0 "Press, Censorship & Academy Code"
 oe_lw2_press_academy_law_desc:0 "Governs manuscript copying, licensed printing presses, learned academies, and public periodicals—balancing ideological cohesion against intellectual dynamism."
 oe_lw2_pol_monastic_scriptoria:0 "Monastic Scriptoria Control"
 oe_lw2_pol_monastic_scriptoria_desc:0 "Places manuscript copying and doctrinal vetting under monastic and clerical supervision, cementing religious harmony while slowing the spread of new institutions."
 oe_lw2_pol_royal_licensed_press:0 "Royal Licensed Printing"
 oe_lw2_pol_royal_licensed_press_desc:0 "Charters regulated royal printing houses to expand book output and scholarly treatises while reserving political censorship for the crown."
 oe_lw2_pol_scientific_academies:0 "Scientific Academies Charter"
 oe_lw2_pol_scientific_academies_desc:0 "Endows national academies of sciences, observatories, and technical journals to drive discovery and literacy, demanding sustained state patronage."
 oe_lw2_pol_free_public_press:0 "Free Public Press"
 oe_lw2_pol_free_public_press_desc:0 "Abolishes pre-publication censorship to unleash open newspapers, pamphlets, and civic debate, maximizing scholarship while testing political stability."
 oe_lw2_labor_mobility_law:0 "Labor, Tenancy & Mobility Code"
 oe_lw2_labor_mobility_law_desc:0 "Regulates rural tenure, internal migration, manufactory wages, and statutory labor rights across agrarian and industrializing societies."
 oe_lw2_pol_bound_manorial:0 "Bound Manorial Tenure"
 oe_lw2_pol_bound_manorial_desc:0 "Binds cultivators to estate manors and labor dues, boosting raw agricultural extraction and noble loyalty while suppressing migration and peasant contentment."
 oe_lw2_pol_free_copyhold:0 "Free Copyhold Peasantry"
 oe_lw2_pol_free_copyhold_desc:0 "Commutes arbitrary labor services into fixed written rents and protected copyholds, lifting harvests and rural morale despite aristocratic grumbling."
 oe_lw2_pol_enclosure_manufactory:0 "Commercial Enclosure & Manufactory Wage"
 oe_lw2_pol_enclosure_manufactory_desc:0 "Consolidates common pastures into commercial estates and channels displaced rural labor into urban manufactories, spurring industrial output at a harsh social price."
 oe_lw2_pol_statutory_labor:0 "Statutory Labor Protection"
 oe_lw2_pol_statutory_labor_desc:0 "Limits working hours, curbs abusive factory fines, and establishes civic relief funds, fostering steady prosperity and demographic growth while trimming industrial margins."
 # Civilization-Specific Regional Laws
 oe_lw2_fra_parlement_law:0 "Parlements & Royal Intendants Code"
 oe_lw2_fra_parlement_law_desc:0 "Defines the balance of power in France between the sovereign provincial Parlements, venal robe magistrates, and direct royal Intendants."
 oe_lw2_pol_fra_sovereign_parlements:0 "Remonstrance of the Parlements"
 oe_lw2_pol_fra_sovereign_parlements_desc:0 "Guarantees the provincial Parlements broad rights of judicial remonstrance, earning noble and legal loyalty while checking royal decree speed."
 oe_lw2_pol_fra_paulette_venality:0 "Paulette & Robe Magistracy"
 oe_lw2_pol_fra_paulette_venality_desc:0 "Formalizes annual fees on hereditary judicial offices, generating reliable crown revenue and building a loyal urban robe elite at some cost to efficiency."
 oe_lw2_pol_fra_royal_intendants:0 "Provincial Royal Intendants"
 oe_lw2_pol_fra_royal_intendants_desc:0 "Dispatches revocable royal Intendants directly from the council to oversee taxes, justice, and police across the generalites, overriding regional magnates."
 oe_lw2_pol_fra_council_of_state:0 "Uniform Departmental Prefects"
 oe_lw2_pol_fra_council_of_state_desc:0 "Replaces overlapping feudal jurisdictions with standardized departments and a central Council of State, maximizing administrative reach while alienating old provinces."
 oe_lw2_fra_gallican_crown_law:0 "Salic & Gallican Prerogative Code"
 oe_lw2_fra_gallican_crown_law_desc:0 "Governs the French Crown's sacred succession doctrine and the autonomy of the Gallican Church relative to external ecclesiastical authority."
 oe_lw2_pol_fra_salic_orthodoxy:0 "Most Christian King's Concord"
 oe_lw2_pol_fra_salic_orthodoxy_desc:0 "Pairs strict Salic dynastic continuity with close cooperation between crown and cathedral chapters, buttressing royal legitimacy and religious zeal."
 oe_lw2_pol_fra_pragmatic_bourges:0 "Pragmatic Sanction of Bourges"
 oe_lw2_pol_fra_pragmatic_bourges_desc:0 "Retains ecclesiastical revenues inside the kingdom and strengthens local clerical assemblies, keeping wealth domestic while chafing foreign hierarchies."
 oe_lw2_pol_fra_gallican_liberties:0 "Four Articles of Gallicanism"
 oe_lw2_pol_fra_gallican_liberties_desc:0 "Asserts sovereign royal supremacy in temporal affairs and crown nomination of bishops, strengthening central authority at the cost of clerical resentment."
 oe_lw2_eng_common_law:0 "Magna Carta & Common Law Courts"
 oe_lw2_eng_common_law_desc:0 "Shapes the English and British constitutional order—from baronial charters and royal prerogative courts to parliamentary habeas corpus and constitutional rights."
 oe_lw2_pol_eng_magna_carta_assizes:0 "Magna Carta & Circuit Assizes"
 oe_lw2_pol_eng_magna_carta_assizes_desc:0 "Binds the monarch to baronial charters and itinerant jury assizes, protecting estates and property while constraining unilateral taxation."
 oe_lw2_pol_eng_star_chamber:0 "Court of Star Chamber"
 oe_lw2_pol_eng_star_chamber_desc:0 "Empowers a swift royal prerogative court to discipline overmighty lords and speed central administration, provoking deep suspicion among parliamentarians."
 oe_lw2_pol_eng_habeas_corpus:0 "Habeas Corpus & Common Bench"
 oe_lw2_pol_eng_habeas_corpus_desc:0 "Protects subjects against arbitrary detention and secures commercial contracts in common law courts, fostering mercantile confidence and civic stability."
 oe_lw2_pol_eng_bill_of_rights:0 "Parliamentary Bill of Rights"
 oe_lw2_pol_eng_bill_of_rights_desc:0 "Establishes parliamentary supremacy over taxation and sovereign credit, slashing borrowing costs and boosting legislative capacity while curbing royal prerogative."
 oe_lw2_eng_enclosure_navy_law:0 "Timber, Enclosure & Wooden Walls"
 oe_lw2_eng_enclosure_navy_law_desc:0 "Aligns England's oak forests, wool enclosures, and maritime levies behind the defense of the narrow seas and ocean-going battle fleets."
 oe_lw2_pol_eng_royal_forests_levy:0 "Royal Forests & Yeoman Muster"
 oe_lw2_pol_eng_royal_forests_levy_desc:0 "Preserves royal hunting woodlands and yeoman archery musters, yielding sturdy rural levies and timber reserves at a modest commercial cost."
 oe_lw2_pol_eng_enclosure_shipmoney:0 "Wool Enclosure & Ship Money"
 oe_lw2_pol_eng_enclosure_shipmoney_desc:0 "Encourages profitable wool enclosures while extending coastal ship-money levies inland, funding shipyards and cloth exports at the price of rural unrest."
 oe_lw2_pol_eng_wooden_walls_act:0 "Act of the Wooden Walls"
 oe_lw2_pol_eng_wooden_walls_act_desc:0 "Dedicates state dockyards, naval timber monopolies, and permanent admiralty financing to heavy warships, commanding the waves while straining naval upkeep."
 oe_lw2_spa_indies_council_law:0 "Admiralty & Council of the Indies Code"
 oe_lw2_spa_indies_council_law_desc:0 "Governs Iberian maritime administration—from medieval Castilian and Aragonese admiralties to Age of Discovery treasure fleets, the Casa de Contratacion, and imperial free commerce."
 oe_lw2_pol_spa_royal_admiralty:0 "Castilian Royal Admiralty"
 oe_lw2_pol_spa_royal_admiralty_desc:0 "Organizes royal shipyards and coastal customs patrols along Cantabria and Andalusia, safeguarding Iberian sea lanes while granting harbor guilds steady privileges."
 oe_lw2_pol_spa_casa_contratacion:0 "Casa de Contratacion"
 oe_lw2_pol_spa_casa_contratacion_desc:0 "Channels all oceanic bullion convoys and merchant licenses through a single royal clearinghouse, maximizing treasure-fleet security and crown tariffs while curbing private initiative."
 oe_lw2_pol_spa_council_of_indies:0 "Council of the Indies"
 oe_lw2_pol_spa_council_of_indies_desc:0 "Establishes a supreme viceregal council overseeing overseas law, colonial charters, and missionary tribunals, strengthening imperial cohesion at heavy administrative cost."
 oe_lw2_pol_spa_bourbon_free_commerce:0 "Imperial Free Commerce Decree"
 oe_lw2_pol_spa_bourbon_free_commerce_desc:0 "Opens imperial trade across multiple Iberian and overseas ports under reformed intendants, reviving commercial competitiveness while undermining entrenched monopoly guilds."
 oe_lw2_spa_mesta_hermandad_law:0 "Mesta & Santa Hermandad Code"
 oe_lw2_spa_mesta_hermandad_law_desc:0 "Arbitrates between the migratory wool guild of the Mesta, the royal rural constabulary of the Santa Hermandad, and the chartered municipal Cortes."
 oe_lw2_pol_spa_mesta_pastures:0 "Privileges of the Honorable Mesta"
 oe_lw2_pol_spa_mesta_pastures_desc:0 "Protects transhumant merino sheep trails across the plateau, generating lucrative wool taxes and noble favor while encroaching on arable farmland."
 oe_lw2_pol_spa_santa_hermandad:0 "Royal Santa Hermandad"
 oe_lw2_pol_spa_santa_hermandad_desc:0 "Transforms municipal militias into a royal rural constabulary patrolling highways and suppressing banditry, boosting control and domestic order at a steady fiscal cost."
 oe_lw2_pol_spa_municipal_cortes:0 "Chartered Fueros & Municipal Cortes"
 oe_lw2_pol_spa_municipal_cortes_desc:0 "Safeguards historic town fueros, irrigation communes, and urban crafts, nurturing urban development and burgher satisfaction at the expense of central crown power."
 oe_lw2_hab_pragmatic_sanction_law:0 "Crownland Federation & Pragmatic Sanction"
 oe_lw2_hab_pragmatic_sanction_law_desc:0 "Governs the constitutional cohesion of composite Danubian and Alpine realms—balancing historic estate diets against imperial chanceries and indivisible dynastic succession."
 oe_lw2_pol_hab_hereditary_diets:0 "Autonomy of the Crownland Diets"
 oe_lw2_pol_hab_hereditary_diets_desc:0 "Honors the separate estates and charters of each constituent kingdom and duchy, expanding cultural harmony and diplomatic standing while slowing centralization."
 oe_lw2_pol_hab_aulic_chancery:0 "Aulic Council & War Chancery"
 oe_lw2_pol_hab_aulic_chancery_desc:0 "Coordinates imperial diplomacy, frontier fortresses, and joint war taxes through central Vienna-style ministries, demanding heavier court outlays."
 oe_lw2_pol_hab_pragmatic_sanction:0 "Indivisible Pragmatic Sanction"
 oe_lw2_pol_hab_pragmatic_sanction_desc:0 "Declares all hereditary crownlands legally indivisible under a single dynastic line and unified civil service, speeding integration despite aristocratic resistance."
 oe_lw2_rus_table_of_ranks_law:0 "Mestnichestvo & Table of Ranks"
 oe_lw2_rus_table_of_ranks_law_desc:0 "Regulates precedence in civil and military office across the Rus realms—from hereditary boyar pedigree registers to centralized Prikazy and Petrine meritocratic service ranks."
 oe_lw2_pol_rus_mestnichestvo:0 "Boyar Mestnichestvo"
 oe_lw2_pol_rus_mestnichestvo_desc:0 "Awards senior commands and court seats strictly by ancestral boyar lineage, securing great-house loyalty and levy turnout at the cost of administrative agility."
 oe_lw2_pol_rus_prikazy_chanceries:0 "Central Prikazy Chanceries"
 oe_lw2_pol_rus_prikazy_chanceries_desc:0 "Consolidates fiscal, military, and diplomatic records inside permanent state Prikazy staffed by salaried scribes, extending royal reach across vast steppes and forests."
 oe_lw2_pol_rus_table_of_ranks:0 "Imperial Table of Ranks"
 oe_lw2_pol_rus_table_of_ranks_desc:0 "Abolishes ancestral precedence in favor of fourteen civil and military grades earned strictly through state service, sharpening discipline and modernization despite boyar fury."
 oe_lw2_pol_rus_charter_nobility:0 "Charter to the Gentry & Towns"
 oe_lw2_pol_rus_charter_nobility_desc:0 "Grants provincial service gentry and merchant assemblies defined corporate charters, stabilizing vast imperial provinces while trading away some absolute crown leverage."
 oe_lw2_rus_serfdom_code_law:0 "Sobornoye Ulozheniye & Frontier Liberties"
 oe_lw2_rus_serfdom_code_law_desc:0 "Governs rural labor, peasant movement, and frontier Cossack settlement across the East European plain and Eurasian borderlands."
 oe_lw2_pol_rus_yuri_day_mobility:0 "St. George's Day Peasant Departure"
 oe_lw2_pol_rus_yuri_day_mobility_desc:0 "Preserves the customary autumn window permitting peasants to change landlords once dues are settled, sustaining rural contentment and harvests while limiting estate coercion."
 oe_lw2_pol_rus_cossack_frontier_charter:0 "Frontier Cossack Liberties"
 oe_lw2_pol_rus_cossack_frontier_charter_desc:0 "Grants self-governing Cossack hosts land and tax exemptions along the steppe and Siberian frontiers in return for light cavalry reconnaissance and colonization."
 oe_lw2_pol_rus_sobornoye_ulozheniye:0 "Sobornoye Ulozheniye Serfdom Code"
 oe_lw2_pol_rus_sobornoye_ulozheniye_desc:0 "Codifies permanent estate bondage to underwrite the service gentry's military obligations, boosting manpower and noble backing at a heavy price to literacy and peasant morale."
 oe_lw2_steppe_yassa_sharia_law:0 "Great Yassa & Sharia Accord"
 oe_lw2_steppe_yassa_sharia_law_desc:0 "Reconciles Chinggisid steppe customary law (the Great Yassa) with Islamic jurisprudence and sedentary Persianate chancery governance across Eurasia."
 oe_lw2_pol_steppe_great_yassa:0 "Supremacy of the Great Yassa"
 oe_lw2_pol_steppe_great_yassa_desc:0 "Enforces ancestral Chinggisid military custom and religious pluralism across the steppe banners, bolstering cavalry prowess and horde unity while alienating urban jurists."
 oe_lw2_pol_steppe_yassa_sharia_accord:0 "Yassa-Sharia Dual Jurisdiction"
 oe_lw2_pol_steppe_yassa_sharia_accord_desc:0 "Divides jurisdiction cleanly between steppe yarghu courts for military clans and qadi tribunals for oasis towns, harmonizing nomadic warriors with sedentary taxpayers."
 oe_lw2_pol_steppe_sedentary_diwan:0 "Persianate Sedentary Diwan"
 oe_lw2_pol_steppe_sedentary_diwan_desc:0 "Elevates salaried oasis bureaucrats and audited fiscal registers above nomadic custom, boosting tax yield and scholarship at the risk of tribal alienation."
 oe_lw2_steppe_ulus_pasture_law:0 "Ulus Grazing & Silk-Caravan Code"
 oe_lw2_steppe_ulus_pasture_law_desc:0 "Allocates seasonal steppe pastures, postal yam relay stations, and oasis caravanserais linking China, Transoxiana, Persia, and the Black Sea."
 oe_lw2_pol_steppe_ulus_pastures:0 "Protected Ulus Seasonal Pastures"
 oe_lw2_pol_steppe_ulus_pastures_desc:0 "Reserves open steppe corridors for hereditary herds and warhorse breeding, raising livestock and cavalry endurance while restricting urban enclosure."
 oe_lw2_pol_steppe_yam_caravan_guard:0 "Yam Relay & Ortogh Caravan Guard"
 oe_lw2_pol_steppe_yam_caravan_guard_desc:0 "Posts armed horsemen along postal yam stations and insures long-distance ortogh merchant partnerships, swelling overland trade tolls at modest upkeep cost."
 oe_lw2_pol_steppe_oasis_waqf_charter:0 "Samarkand Oasis & Waqf Charter"
 oe_lw2_pol_steppe_oasis_waqf_charter_desc:0 "Invests caravan customs into irrigated oasis agriculture, madrasas, and silk workshops, cultivating urban prosperity and scholarship while reducing pastoral autonomy."
 oe_lw2_ind_mansabdar_iqta_law:0 "Iqta & Mansabdar Service Code"
 oe_lw2_ind_mansabdar_iqta_law_desc:0 "Structures military land assignments across the Indian subcontinent—from hereditary Sultanate Iqtas and Deccan Nayaka tenures to ranked Mansabdari muster inspections."
 oe_lw2_pol_ind_hereditary_iqta:0 "Provincial Iqta Assignments"
 oe_lw2_pol_ind_hereditary_iqta_desc:0 "Assigns revenue districts to military amirs to sustain heavy cavalry squadrons locally, easing direct treasury outlay while empowering regional commanders."
 oe_lw2_pol_ind_nayaka_military_tenures:0 "Nayaka Amaram Fort Tenures"
 oe_lw2_pol_ind_nayaka_military_tenures_desc:0 "Entrusts fortified hill districts to hereditary Nayaka captains obliged to field infantry and war-elephants, boosting defensive depth and levy size."
 oe_lw2_pol_ind_mansabdar_grading:0 "Mansabdar Zat & Sawar Grading"
 oe_lw2_pol_ind_mansabdar_grading_desc:0 "Ranks every officer by numerical personal grade and mandatory branded-horse cavalry quota, delivering disciplined imperial armies at heightened administrative upkeep."
 oe_lw2_pol_ind_imperial_jagirdari:0 "Rotating Jagirdari Transfers"
 oe_lw2_pol_ind_imperial_jagirdari_desc:0 "Rotates non-hereditary revenue jagirs every few years to prevent local dynastic entrenchment, reinforcing central control and artillery parks while testing provincial stewardship."
 oe_lw2_ind_zamindar_caste_law:0 "Zamindar Land Survey & Guild Charters"
 oe_lw2_ind_zamindar_caste_law_desc:0 "Balances local Zamindar agrarian intermediaries, standardized Todar Mal Zabt revenue assessments, and mercantile Mahajan banking and textile guilds."
 oe_lw2_pol_ind_zamindar_autonomy:0 "Hereditary Zamindar Intermediaries"
 oe_lw2_pol_ind_zamindar_autonomy_desc:0 "Collects agrarian taxes through entrenched village Zamindars and local councils, preserving rural stability and noble prestige at the cost of state fiscal share."
 oe_lw2_pol_ind_mahajan_guild_charters:0 "Mahajan Banking & Textile Guilds"
 oe_lw2_pol_ind_mahajan_guild_charters_desc:0 "Recognizes merchant banking houses, hundi bills of exchange, and cotton-silk weaver guilds, driving commercial production while empowering urban financiers."
 oe_lw2_pol_ind_zabt_land_survey:0 "Zabt Ten-Year Land Survey"
 oe_lw2_pol_ind_zabt_land_survey_desc:0 "Measures cultivated acreage with standardized rods and fixes cash land taxes on ten-year harvest averages, maximizing fiscal predictability and peasant relief while curtailing Zamindar skimmed dues."
 oe_lw2_sea_mandala_tribute_law:0 "Mandala Tributary & Kingship Code"
 oe_lw2_sea_mandala_tribute_law_desc:0 "Defines how Southeast Asian monarchies radiate royal charisma across concentric tributary vassals, Sakdina manpower ranks, or direct provincial circuits."
 oe_lw2_pol_sea_mandala_circles:0 "Concentric Mandala Circles"
 oe_lw2_pol_sea_mandala_circles_desc:0 "Governs outer realms through sacred royal oaths, marriage alliances, and gold-and-silver tributary flowers, keeping subjects loyal and diplomacy flexible at a cost to direct control."
 oe_lw2_pol_sea_sakdina_ranks:0 "Sakdina Manpower & Paddy Ranks"
 oe_lw2_pol_sea_sakdina_ranks_desc:0 "Assigns every noble, official, and commoner a numerical rice-land rank linked to corvee and military service, mobilizing deep manpower and harvests while demanding heavy administrative supervision."
 oe_lw2_pol_sea_royal_provincial_circuit:0 "Direct Royal Provincial Circuits"
 oe_lw2_pol_sea_royal_provincial_circuit_desc:0 "Replaces hereditary tributary lords with appointed royal governors and codified statutory tribunals, speeding integration and revenue extraction despite regional pushback."
 oe_lw2_sea_monsoon_port_law:0 "Monsoon Entrepot & Spice-Port Code"
 oe_lw2_sea_monsoon_port_law_desc:0 "Regulates the great monsoon straits and spice harbors linking the Indian Ocean and South China Sea—from cosmopolitan Shahbandar quarters to armed royal junk monopolies."
 oe_lw2_pol_sea_shahbandar_entrepot:0 "Cosmopolitan Shahbandar Quarters"
 oe_lw2_pol_sea_shahbandar_entrepot_desc:0 "Appoints dedicated harbor-masters for Chinese, Indian, Arab, and Malay merchant communities, drawing bustling seasonal traffic and diplomatic goodwill while sharing customs with merchant guilds."
 oe_lw2_pol_sea_royal_junk_monopoly:0 "Royal Junk & Treasury Monopoly"
 oe_lw2_pol_sea_royal_junk_monopoly_desc:0 "Reserves key export cargoes—tin, pepper, sappanwood, and porcelain—for crown-owned merchant junks, filling royal coffers and strengthening fleets at private traders' expense."
 oe_lw2_pol_sea_spice_port_charter:0 "Fortified Spice-Port Charter"
 oe_lw2_pol_sea_spice_port_charter_desc:0 "Fortifies key straits entrepots with artillery batteries and licensed spice exchanges to defend sovereign trade against foreign monopolies, requiring sustained naval upkeep."
 oe_lw2_afr_caravan_crown_law:0 "Trans-Saharan & Red Sea Caravan Law"
 oe_lw2_afr_caravan_crown_law_desc:0 "Regulates Africa's great arteries of gold, salt, ivory, and scholarly pilgrimage—from desert camel escorts and Red Sea customs houses to royal mint monopolies and oceanic exchanges."
 oe_lw2_pol_afr_trans_saharan_escort:0 "Trans-Saharan Caravan Escort"
 oe_lw2_pol_afr_trans_saharan_escort_desc:0 "Contracts desert guides and oasis clans to guard gold-and-salt camel trains across arid passes, expanding overland trade and tribal harmony while conceding remote border control."
 oe_lw2_pol_afr_red_sea_customs:0 "Red Sea & Swahili Customs Houses"
 oe_lw2_pol_afr_red_sea_customs_desc:0 "Standardizes harbor customs and pilgrim duties along the Red Sea, Maghreb, and Swahili coasts, enriching state coffers and maritime links while mildly taxing merchant margins."
 oe_lw2_pol_afr_royal_salt_gold_mint:0 "Royal Gold-Dust & Bullion Standard"
 oe_lw2_pol_afr_royal_salt_gold_mint_desc:0 "Reserves pure gold nuggets for the royal treasury while circulating standardized coinage and funding scholarly academies, strengthening fiscal stability and prestige despite inflation vigilance."
 oe_lw2_pol_afr_oceanic_caravan_exchange:0 "Trans-Oceanic & Caravan Exchange"
 oe_lw2_pol_afr_oceanic_caravan_exchange_desc:0 "Links inland caravan fairs directly with Atlantic and Indian Ocean shipping under crown-protected chartered warehouses, expanding long-range commerce while strengthening urban guilds."
