l_english:
 STATIC_MODIFIER_NAME_oe_tcd_reg_q1: "New Register (Rough)"
 STATIC_MODIFIER_DESC_oe_tcd_reg_q1: "An apographeus has registered the land and the peasants here again. With the new register the officials collect the taxes with more certainty."
 STATIC_MODIFIER_NAME_oe_tcd_reg_q2: "New Register (Sound)"
 STATIC_MODIFIER_DESC_oe_tcd_reg_q2: "An apographeus has registered the land and the peasants here again. With the new register the officials collect the taxes with more certainty."
 STATIC_MODIFIER_NAME_oe_tcd_reg_q3: "New Register (Thorough)"
 STATIC_MODIFIER_DESC_oe_tcd_reg_q3: "An apographeus has registered the land and the peasants here again. With the new register the officials collect the taxes with more certainty."
 STATIC_MODIFIER_NAME_oe_tcd_flight_loc: "Runaways Hunted"
 STATIC_MODIFIER_DESC_oe_tcd_flight_loc: "Soldiers went into the hills to bring the runaway peasants back, and the villages are uneasy."
 oe_tcd_send: "Send an Apographeus"
 oe_tcd_send_desc: "Send an apographeus to a province to register its land and dependent peasants again and draw up a new register. Costs 5 Imperial Authority and 100 gold; the survey takes 24 months; once per province in 10 years. Chartered cities refuse.\nAt the start you decide how hard to press: the harder, the better the register and the more loyalty the province loses. A province under pronoia grants loses more; a house-born strategos' house loses influence.\nDuring the survey a magnate may hide land, a monastery may ask for exemption, peasants may flee. The new register takes effect by its quality (rough: finance efficiency +5, jurisdiction max control +3%, extra tribute 2%; sound: finance efficiency +10, jurisdiction max control +5%, extra tribute 3%; thorough: finance efficiency +15, jurisdiction max control +8%, extra tribute 4%): finance efficiency for 5 years, the rest for 10 years; only exarchates and despotates pay the extra tribute."
 oe_tcd_send_card: "Send an apographeus to register a province's land and peasants again, for more revenue."
 oe_tcd_send_select: "Choose a province"
 oe_tcd_send_none: "@trigger_no!No province can be surveyed (chartered cities refuse; once per province in 10 years)."
 oe_tcd_send_tt: "Imperial Authority −5, −100 gold.\nThe apographeus goes to the chosen province; the survey takes 24 months, and the province cannot be surveyed again for 10 years. Next you decide how hard to press."
 oe_tcd_allow_auth: "Imperial Authority is at least 5"
 oe_tcd_allow_gold: "The treasury holds at least 100 gold"
 oe_tcd.1.t: "The Apographeus Sets Out"
 oe_tcd.1.d: "In the fourteenth century the empire sent apographeis to register the land and the dependent peasants again, and gave every holder a register (praktikon) as the basis of the tax. The office was often held by the local governor. In November 1318 the apographeis Konstantinos Pergamenos and Georgios Pharisaios issued the praktikon of the Iviron monastery in the theme of Thessalonike. By 1321 the two had drawn up praktika for several monasteries of Mount Athos in the themes of Thessalonike and Strymon.\n\nNow the court sends an apographeus to [SCOPE.sCountry('oe_tcd_ev_theme').GetName]. He is to measure the land village by village and enter every household. The closer he looks, the better the register, and the angrier the province."
 oe_tcd.1.a: "Check every household and miss no field"
 oe_tcd.1.a.tt: "The survey takes 24 months; the register starts as thorough (3).\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty −5, counted in the loyalty target for 5 years.\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is under pronoia grants: loyalty a further −6, counted in the loyalty target for 5 years.\nIf the governor of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is house-born: the house's influence −30.\nEach month of the survey the chance of trouble is 12%."
 oe_tcd.1.b: "Survey as usual"
 oe_tcd.1.b.tt: "The survey takes 24 months; the register starts as sound (2).\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty −2, counted in the loyalty target for 5 years.\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is under pronoia grants: loyalty a further −5, counted in the loyalty target for 5 years.\nIf the governor of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is house-born: the house's influence −15.\nEach month of the survey the chance of trouble is 8%."
 oe_tcd.1.c: "Only check the old register"
 oe_tcd.1.c.tt: "The survey takes 24 months; the register starts as rough (1).\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is under pronoia grants: loyalty a further −3, counted in the loyalty target for 5 years.\nIf the governor of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is house-born: the house's influence −5.\nEach month of the survey the chance of trouble is 4%."
 oe_tcd.2.t: "Hidden Fields"
 oe_tcd.2.d1: "The apographeus measures the land first, and each household's tax is set from what he finds. Every field left out of the register is tax the holder does not pay.\n\nNow the apographeus in [SCOPE.sCountry('oe_tcd_ev_theme').GetName] has found that a local magnate has entered several of his estates under the names of his tenants and relatives, and the figures do not add up. The magnate is kin to the family of [SCOPE.sCharacter('oe_tcd_ev_ruler').GetName]."
 oe_tcd.2.d: "The apographeus measures the land first, and each household's tax is set from what he finds. Every field left out of the register is tax the holder does not pay.\n\nNow the apographeus in [SCOPE.sCountry('oe_tcd_ev_theme').GetName] has found that a local magnate has entered several of his estates under the names of his tenants and relatives, and the figures do not add up."
 oe_tcd.2.a: "Make him pay what he owes"
 oe_tcd.2.a.tt: "Register quality +1.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty −3, counted in the loyalty target for 5 years.\nIf the governor of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is house-born: the house's influence −10."
 oe_tcd.2.b: "Settle for a fine"
 oe_tcd.2.b.tt: "Register quality unchanged."
 oe_tcd.2.c: "Look the other way"
 oe_tcd.2.c.tt: "Register quality −1.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty +2, counted in the loyalty target for 5 years."
 oe_tcd.3.t: "The Monastery's Chrysobull"
 oe_tcd.3.d1: "The monasteries of Mount Athos keep the golden bulls of many emperors. These charters often grant exemption: the lands pay no tax, and no official may enter them. Between 1318 and 1321 the apographeis Pergamenos and Pharisaios registered, estate by estate, the lands and dependent peasants of the Athonite monasteries in the themes of Thessalonike and Strymon.\n\nNow an Athonite monastery with estates in [SCOPE.sCountry('oe_tcd_ev_theme').GetName] has sent an old chrysobull. It says these lands have always been exempt and the apographeus has no right to register them."
 oe_tcd.3.d: "The chrysobulls that emperors gave to monasteries often granted exemption: the lands paid no tax, and no official could enter them. Some were forged. Zographou kept a chrysobull in the name of John V, dated January 1342, that was in fact written between 1357 and 1372.\n\nNow a monastery in [SCOPE.sCountry('oe_tcd_ev_theme').GetName] has produced an old chrysobull. It says its lands have always been exempt and the apographeus has no right to register them."
 oe_tcd.3.a: "Honour the chrysobull and leave the land out"
 oe_tcd.3.a.tt: "Register quality −1."
 oe_tcd.3.b: "Register the land but keep the exemption"
 oe_tcd.3.b.tt: "The survey takes 3 months longer.\nRegister quality unchanged."
 oe_tcd.3.c: "Examine the chrysobull and tax the land"
 oe_tcd.3.c.tt: "Register quality +1."
 oe_tcd.5.t: "Peasants Flee to the Hills"
 oe_tcd.5.d: "The dependent peasants (paroikoi) on a register pay the tax it sets. Peasants who left their homes and stood on no register were called 'free' (eleutheroi) by the fisc. The freedom was only for a time: the next survey that found them entered them again as paroikoi.\n\nNow, as word spreads that the apographeus is coming, the peasants of several villages in [SCOPE.sCountry('oe_tcd_ev_theme').GetName] have driven their animals up into the hills."
 oe_tcd.5.a: "Send soldiers to bring them back"
 oe_tcd.5.a.tt: "Register quality unchanged.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty −2, counted in the loyalty target for 5 years.\nEach jurisdiction location of [SCOPE.sCountry('oe_tcd_ev_theme').GetName]: unrest +0.5 (2 years)."
 oe_tcd.5.b: "Lift the tax for those who come home"
 oe_tcd.5.b.tt: "Register quality unchanged."
 oe_tcd.5.c: "Enter the fields as deserted"
 oe_tcd.5.c.tt: "Register quality −1."
 oe_tcd.4.t: "The New Register"
 oe_tcd.4.d1: "A register records the limits and extent of a holding, and every household of dependent peasants with its family, house, animals, land and tax. From now on the taxes are levied by the new register.\n\nNow the survey of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is over. The register is thorough; almost every field is accounted for."
 oe_tcd.4.d2: "A register records the limits and extent of a holding, and every household of dependent peasants with its family, house, animals, land and tax. From now on the taxes are levied by the new register.\n\nNow the survey of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is over. The register is sound; only a few estates remain unclear."
 oe_tcd.4.d3: "A register records the limits and extent of a holding, and every household of dependent peasants with its family, house, animals, land and tax. From now on the taxes are levied by the new register.\n\nNow the survey of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is over. The register is rough; many estates are missing."
 oe_tcd.4.d: "A register records the limits and extent of a holding, and every household of dependent peasants with its family, house, animals, land and tax. From now on the taxes are levied by the new register.\n\nNow the survey of [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is over. The register is all but useless; it records less land than the old one."
 oe_tcd.4.a3: "Lodge the new register with the treasury"
 oe_tcd.4.a3.tt: "Register quality: thorough.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: finance efficiency +15 (5 years; only the newest recent office bonus counts).\nEach jurisdiction location of [SCOPE.sCountry('oe_tcd_ev_theme').GetName]: max control +8% (10 years).\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is an exarchate or despotate: it pays an extra 4% of its monthly income in tribute for 10 years."
 oe_tcd.4.a2: "Lodge the new register with the treasury"
 oe_tcd.4.a2.tt: "Register quality: sound.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: finance efficiency +10 (5 years; only the newest recent office bonus counts).\nEach jurisdiction location of [SCOPE.sCountry('oe_tcd_ev_theme').GetName]: max control +5% (10 years).\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is an exarchate or despotate: it pays an extra 3% of its monthly income in tribute for 10 years."
 oe_tcd.4.a1: "Lodge the new register with the treasury"
 oe_tcd.4.a1.tt: "Register quality: rough.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: finance efficiency +5 (5 years; only the newest recent office bonus counts).\nEach jurisdiction location of [SCOPE.sCountry('oe_tcd_ev_theme').GetName]: max control +3% (10 years).\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is an exarchate or despotate: it pays an extra 2% of its monthly income in tribute for 10 years."
 oe_tcd.4.a0: "Lodge the new register with the treasury"
 oe_tcd.4.a0.tt: "Register quality: useless.\nThe register is useless: nothing is gained."
 oe_tcd.4.b3: "Assess lightly"
 oe_tcd.4.b3.tt: "The register counts one grade lower, as sound.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: finance efficiency +10 (5 years; only the newest recent office bonus counts).\nEach jurisdiction location of [SCOPE.sCountry('oe_tcd_ev_theme').GetName]: max control +5% (10 years).\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is an exarchate or despotate: it pays an extra 3% of its monthly income in tribute for 10 years.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty +3, counted in the loyalty target for 5 years."
 oe_tcd.4.b2: "Assess lightly"
 oe_tcd.4.b2.tt: "The register counts one grade lower, as rough.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: finance efficiency +5 (5 years; only the newest recent office bonus counts).\nEach jurisdiction location of [SCOPE.sCountry('oe_tcd_ev_theme').GetName]: max control +3% (10 years).\nIf [SCOPE.sCountry('oe_tcd_ev_theme').GetName] is an exarchate or despotate: it pays an extra 2% of its monthly income in tribute for 10 years.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty +3, counted in the loyalty target for 5 years."
 oe_tcd.4.b1: "Assess lightly"
 oe_tcd.4.b1.tt: "The register counts one grade lower, as useless.\nThe register is useless: nothing is gained.\n[SCOPE.sCountry('oe_tcd_ev_theme').GetName]: loyalty +3, counted in the loyalty target for 5 years."
 oe_tcd.9.t: "Survey: register takes effect"
