l_english:
 OE_ILK_MU_1: "Musa Khan: beaten at Soghurlugh in the summer of 1337 and put to death; the Jalayirids took over that side."
 OE_ILK_MU_4: "Musa Khan: it did not happen as in history (the game did not carry it out)."
 OE_ILK_MU_3: "Musa Khan: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_MU_X: "Musa Khan: that side outlasted 1337."
 OE_ILK_MU_W: "Musa Khan: not yet (the summer of 1337)."
 OE_ILK_RD_1: "Tabriz: the Western merchants have left, and the road by Trebizond has thinned out."
 OE_ILK_RD_3: "Tabriz: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_RD_X: "Tabriz: the Western merchants stayed."
 OE_ILK_RD_W: "Tabriz: not yet (from 1340)."
 OE_ILK_SU_1: "The Sutayids: Ibrahim Shah killed Hajji Taghay, took the rule and threw off the Jalayirids."
 OE_ILK_SU_3: "The Sutayids: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_SU_X: "The Sutayids: Hajji Taghay kept the rule."
 OE_ILK_SU_W: "The Sutayids: not yet (1343)."
 OE_ILK_ER_1: "Eretna: defeated the army sent by the Chobanids at Karanbük and rules as a sovereign."
 OE_ILK_ER_3: "Eretna: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_ER_X: "Eretna: the battle of Karanbük never came."
 OE_ILK_ER_W: "Eretna: not yet (from the autumn of 1343)."
 OE_ILK_KU_1: "The Chobanids: Hasan Kuchak met a violent end."
 OE_ILK_KU_3: "The Chobanids: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_KU_X: "The Chobanids: Hasan Kuchak did not die as in history."
 OE_ILK_KU_W: "The Chobanids: not yet (from the end of 1343)."
 OE_ILK_SH_B: "The Black Sheep and the White Sheep: both have risen on the old lands of the Sutayids."
 OE_ILK_SH_A: "The White Sheep have risen on the old lands of the Sutayids."
 OE_ILK_SH_Q: "The Black Sheep have risen on the old lands of the Sutayids."
 OE_ILK_SH_X: "The Black Sheep and the White Sheep: neither has risen."
 OE_ILK_SH_W: "The Black Sheep and the White Sheep: not yet (from 1350)."
 OE_ILK_BR_1: "A bride for the White Sheep: Trebizond and the Aq Qoyunlu made a marriage, and the empire sent gifts."
 OE_ILK_BR_2: "A bride for the White Sheep: Trebizond and the Aq Qoyunlu made a marriage, against the empire's protest in the name of the Church."
 OE_ILK_BR_3: "A bride for the White Sheep: Trebizond and the Aq Qoyunlu made a marriage, and the empire let it be."
 OE_ILK_BR_0: "A bride for the White Sheep: Trebizond and the Aq Qoyunlu made a marriage."
 OE_ILK_BR_S: "A bride for the White Sheep: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_BR_X: "A bride for the White Sheep: Trebizond and the Aq Qoyunlu made no marriage."
 OE_ILK_BR_W: "A bride for the White Sheep: not yet (from 1352)."
 OE_ILK_TZ_9: "Tabriz: Jani Beg came south and put Malik Ashraf to death; the Jalayirids then took over the Chobanids, ruled from Tabriz and styled themselves sultans."
 OE_ILK_TZ_4: "Tabriz: the Jalayirids meant to take over the Chobanids, but it did not happen as in history (the game did not carry it out)."
 OE_ILK_TZ_8: "Tabriz: Jani Beg came south and put Malik Ashraf to death; the Chobanids were left leaderless."
 OE_ILK_TZ_3: "Tabriz: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_TZ_X: "Tabriz: Jani Beg never came south, and the Chobanids held on."
 OE_ILK_TZ_W: "Tabriz: not yet (from 1357)."
 OE_ILK_MS_1: "The Black Sheep: after the battle of Mush they took the Jalayirids for their overlords."
 OE_ILK_MS_2: "The Black Sheep: after the battle of Mush they bowed to the Jalayirids, and the two made a truce."
 OE_ILK_MS_3: "The Black Sheep: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_MS_X: "The Black Sheep: they never bowed to the Jalayirids."
 OE_ILK_MS_W: "The Black Sheep and the Jalayirids: not yet (from 1366)."
 OE_ILK_SK_1: "Tokhtamysh: the army of the Golden Horde came south and sacked Tabriz."
 OE_ILK_SK_3: "Tokhtamysh: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_SK_X: "Tokhtamysh: Tabriz was not sacked."
 OE_ILK_SK_W: "Tokhtamysh: not yet (from the winter of 1385)."
 OE_ILK_CA_1: "Cairo: the Jalayirid sultan fled from Timur to the sultan of Egypt."
 OE_ILK_CA_3: "Cairo: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_CA_X: "Cairo: the Jalayirid sultan never went to Cairo."
 OE_ILK_CA_W: "Cairo: not yet (from 1393)."
 OE_ILK_SV_B: "Sivas: the chief of the White Sheep killed Sultan Burhan al-Din, and Sivas bowed to the Ottoman sultan."
 OE_ILK_SV_1: "Sivas: Eretna's old lands bowed to the Ottoman sultan."
 OE_ILK_SV_4: "Sivas: the sultan's envoys came, and Sivas made a truce and friends with the Ottomans."
 OE_ILK_SV_3: "Sivas: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_SV_X: "Sivas: it never bowed to the Ottomans."
 OE_ILK_SV_W: "Sivas: not yet (from 1398)."
 OE_ILK_ST_2: "Timur's storm: Sivas or Syria was sacked; the exiled chiefs fled to the Ottomans, and Timur and the sultan fell out over them."
 OE_ILK_ST_1: "Timur's storm: Sivas or Syria was sacked."
 OE_ILK_ST_C: "Timur's storm: the exiled chiefs fled to the Ottomans, and Timur and the sultan fell out over them."
 OE_ILK_ST_X: "Timur's storm: it did not come as in history."
 OE_ILK_ST_W: "Timur's storm: not yet (from 1400)."
 OE_ILK_TI_1: "Envoys from Timur: the empire promised tribute and ships."
 OE_ILK_TI_2: "Envoys from Timur: the empire answered with a letter, and no pact."
 OE_ILK_TI_3: "Envoys from Timur: the empire told the sultan what the envoys wanted."
 OE_ILK_TI_X: "Envoys from Timur: none came to the City."
 OE_ILK_TI_W: "Envoys from Timur: not yet (from 1400)."
 OE_ILK_FE_1: "The ferries at the Straits: the empire closed the Straits."
 OE_ILK_FE_2: "The ferries at the Straits: the empire took money and ferried the Turks across."
 OE_ILK_FE_3: "The ferries at the Straits: the empire ferried only the men of the prince it backed."
 OE_ILK_FE_X: "The ferries at the Straits: the empire took no stand."
 OE_ILK_FE_W: "The ferries at the Straits: not until the sultan is beaten."
 OE_ILK_DI_L: "The White Sheep: Timur gave them Diyarbakir."
 OE_ILK_DI_F: "The White Sheep: they won Timur's favour."
 OE_ILK_DI_3: "The White Sheep: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_DI_X: "The White Sheep: Timur did not reward them."
 OE_ILK_DI_W: "The White Sheep: not until the sultan is beaten."
 OE_ILK_QA_R: "The Black Sheep: after Timur's death Qara Yusuf raised the Black Sheep again on their old lands."
 OE_ILK_QA_1: "The Black Sheep: after Timur's death they threw off the overlordship of Timur's house."
 OE_ILK_QA_4: "The Black Sheep: it did not happen as in history (the game did not carry it out)."
 OE_ILK_QA_3: "The Black Sheep: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_QA_X: "The Black Sheep: they did not come back after Timur."
 OE_ILK_QA_W: "The Black Sheep: not until after Timur's death (from 1406)."
 OE_ILK_KM_1: "Kerman: Mubariz al-Din of the Muzaffarids took over Kerman."
 OE_ILK_KM_4: "Kerman: it did not happen as in history (the game did not carry it out)."
 OE_ILK_KM_3: "Kerman: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_KM_X: "Kerman: it never fell to the Muzaffarids."
 OE_ILK_KM_W: "Kerman: not yet (from 1340)."
 OE_ILK_TG_C: "Gurgan: Togha Temur was murdered, and the Sarbadars won renown; from then on Gurgan no longer claimed the Ilkhanate."
 OE_ILK_TG_1: "Gurgan: Togha Temur was murdered, and the Sarbadars won renown."
 OE_ILK_TG_4: "Gurgan: it did not happen as in history (the game did not carry it out)."
 OE_ILK_TG_3: "Gurgan: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_TG_X: "Gurgan: Togha Temur was not murdered as in history."
 OE_ILK_TG_W: "Gurgan: not yet (from the end of 1353)."
 OE_ILK_SZ_1: "Shiraz: the Muzaffarids took over the Injuids and held Fars."
 OE_ILK_SZ_4: "Shiraz: it did not happen as in history (the game did not carry it out)."
 OE_ILK_SZ_3: "Shiraz: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_SZ_X: "Shiraz: the Injuids held on."
 OE_ILK_SZ_W: "Shiraz: not yet (from 1353)."
 OE_ILK_SJ_1: "The Muzaffarids: Shah Shoja took the throne in place of Mubariz al-Din, the father."
 OE_ILK_SJ_4: "The Muzaffarids: it did not happen as in history (the game did not carry it out)."
 OE_ILK_SJ_3: "The Muzaffarids: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_SJ_X: "The Muzaffarids: Mubariz al-Din was not put aside by the son."
 OE_ILK_SJ_W: "The Muzaffarids: not yet (from 1358)."
 OE_ILK_KH_2: "Khorasan: Timur came before Herat, and both the Kartids and the Sarbadars bowed to Timur."
 OE_ILK_KH_K: "Khorasan: Timur came before Herat, and the Kartids bowed to Timur."
 OE_ILK_KH_S: "Khorasan: the Sarbadars bowed to Timur."
 OE_ILK_KH_4: "Khorasan: it did not happen as in history (the game did not carry it out)."
 OE_ILK_KH_3: "Khorasan: it did not happen as in history (a player or the empire's side was involved)."
 OE_ILK_KH_X: "Khorasan: Timur never came before Herat."
 OE_ILK_KH_W: "Khorasan: not yet (from 1381)."
 STATIC_MODIFIER_NAME_oe_ilk_franks_gone: "The Franks Have Left"
 STATIC_MODIFIER_DESC_oe_ilk_franks_gone: "After the Ilkhanate broke apart, Western merchants were harried again and again in its lands. Genoa ordered a boycott of Tabriz, and the Italian factories stand empty."
 STATIC_MODIFIER_NAME_oe_ilk_caravans_thin: "Thin Caravans"
 STATIC_MODIFIER_DESC_oe_ilk_caravans_thin: "Fewer caravans come down from Tabriz. Since the Western merchants left Persia, less and less reaches the sea through Trebizond."
 STATIC_MODIFIER_NAME_oe_ilk_karanbuk: "The Victory of Karanbük"
 STATIC_MODIFIER_DESC_oe_ilk_karanbuk: "In the autumn of 1343 Eretna defeated the army sent by the Chobanids at Karanbük, between Sivas and Erzincan, and ruled as an independent sovereign from then on."
 STATIC_MODIFIER_NAME_oe_ilk_leaderless: "Leaderless"
 STATIC_MODIFIER_DESC_oe_ilk_leaderless: "In 1357 Jani Beg of the Golden Horde came south through Shirvan, took Tabriz and hanged Malik Ashraf of the Chobanids. The Chobanid following scattered."
 STATIC_MODIFIER_NAME_oe_ilk_tabriz_seat: "Seated at Tabriz"
 STATIC_MODIFIER_DESC_oe_ilk_tabriz_seat: "After the army of the Golden Horde went back north, Uways of the Jalayirids took Tabriz, lost it and took it again, and in the end held it for good. From then on the Jalayirids styled themselves sultans."
 STATIC_MODIFIER_NAME_oe_ilk_timur_favour: "Timur's Favour"
 STATIC_MODIFIER_DESC_oe_ilk_timur_favour: "The White Sheep stood with Timur at Ankara, and Timur rewarded them with the lands around Diyarbakir."
 STATIC_MODIFIER_NAME_oe_ilk_stranded: "Stranded in Asia"
 STATIC_MODIFIER_DESC_oe_ilk_stranded: "After the rout, Byzantine galleys closed the Straits, and the scattered Ottoman soldiers were left on the Asian shore, unable to cross back to Thrace."
 oe_ilk_b_bride_gift: "Sent gifts for our wedding"
 oe_ilk_b_bride_protest: "Protested against our marriage in the name of the Church"
 oe_ilk_b_bride_aqq: "Sent gifts for our marriage with Trebizond"
