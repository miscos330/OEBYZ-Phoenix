 oe_ilk_bw_karanbuk: "The defeat at Karanbük"
 oe_ilk_bw_bride: "The marriage between Trebizond and the Aq Qoyunlu"
 oe_ilk_b_timur_pact: "Promised us tribute and ships"
 oe_ilk_b_timur_word: "Answered our letter"
 oe_ilk_b_timur_betrayed: "Told the sultan what our envoys came for"
 oe_ilk_b_sultan_wary: "Dealt with Timur behind our back"
 oe_ilk_b_sultan_told: "Told us what Timur's envoys came for"
 oe_ilk_b_straits_shut: "Closed the Straits for us"
 oe_ilk_b_straits_tur: "Closed the Straits and left our soldiers stranded in Asia"
 oe_ilk_b_ferried: "Ferried our soldiers across the Straits"
 oe_ilk_b_ferry_anger: "Ferried the sultan's beaten soldiers across the Straits"
