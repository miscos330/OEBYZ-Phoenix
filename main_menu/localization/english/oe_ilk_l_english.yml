 oe_ilk.3.a: "Close the Straits"
 oe_ilk.3.a.tt: "Timur: opinion of the empire #G +20#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −20#! for #Y 10#! years\nSoldiers stranded in Asia: the Ottomans get [ShowModifier('oe_ilk_stranded')] for #Y 5#! years"
