 oe_ilk_bw_tabriz_sack: "The sack of Tabriz"
 oe_ilk_bw_cairo: "Cairo sheltered the exiled sultan"
 oe_ilk_bw_envoy: "Enmity between Cairo and Timur"
 oe_ilk_bw_refugees: "Sheltering Timur's enemies"
 oe_ilk_bw_mush: "Bowed after the battle of Mush"
 oe_ilk_bw_sivas: "Sivas bowed to the sultan"
 oe_ilk_bw_khorasan: "Bowed to Timur"
 oe_ilk_name_tur_ali: "Tur Ali"
 oe_ilk_name_bayram_khoja: "Bayram Khoja"
 oe_ilk_name_qara_yusuf: "Qara Yusuf"
 oe_ilk.1.t: "A Bride for the White Sheep"
 oe_ilk.1.desc_s: "#F The Turkmens of the White Sheep, the Aq Qoyunlu, had raided Trebizond for years, and in 1348 they laid siege to the city. In 1352 Emperor Alexios III gave an elder sister, Maria, in marriage to Qutlugh, son of Tur Ali, chief of the White Sheep, and so bought peace on the south-eastern border.#!\n\nNow envoys of Trebizond are in the capital: [GetCountry('TRE').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] means to give a princess in marriage to the Aq Qoyunlu and make peace with [GetCountry('AQQ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip], and asks for the empire's consent. A Christian princess given to a Muslim emir: there are already frowns at the patriarchate."
 oe_ilk.1.desc_k: "#F The Turkmens of the White Sheep, the Aq Qoyunlu, had raided Trebizond for years, and in 1348 they laid siege to the city. In 1352 Emperor Alexios III gave an elder sister, Maria, in marriage to Qutlugh, son of Tur Ali, chief of the White Sheep, and so bought peace on the south-eastern border.#!\n\nNow [GetCountry('TRE').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] writes to tell us that Trebizond will give a princess in marriage to the Aq Qoyunlu and make peace with [GetCountry('AQQ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]. A Christian princess given to a Muslim emir: there are already frowns at the patriarchate."
 oe_ilk.1.desc_x: "#F The Turkmens of the White Sheep, the Aq Qoyunlu, had raided Trebizond for years, and in 1348 they laid siege to the city. In 1352 Emperor Alexios III gave an elder sister, Maria, in marriage to Qutlugh, son of Tur Ali, chief of the White Sheep, and so bought peace on the south-eastern border.#!\n\nNow word comes from Trebizond: the court there will give a princess in marriage to the Aq Qoyunlu and make peace with [GetCountry('AQQ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]. A Christian princess given to a Muslim emir: there are already frowns at the patriarchate."
 oe_ilk.1.a: "Send wedding gifts"
 oe_ilk.1.a.tt: "Costs #R 1#! month of trade and tax income\nTrebizond: opinion of the empire #G +15#! for #Y 10#! years\nThe Aq Qoyunlu: opinion of the empire #G +10#! for #Y 10#! years"
 oe_ilk.1.b: "Protest in the name of the Church"
 oe_ilk.1.b.tt: "Trebizond: opinion of the empire #R −10#! for #Y 5#! years\nThe marriage goes ahead all the same"
 oe_ilk.1.c: "It is no concern of ours"
 oe_ilk.1.c.tt: "The empire lets the matter rest"
 oe_ilk.2.t: "Envoys from Timur"
 oe_ilk.2.desc_b_r: "#F Timur's armies have reached the east of Anatolia, and Timur has fallen out with Sultan Bayezid. It is said that Timur sent men to Constantinople to ask the emperor to make no peace with the sultan; the emperor of Trebizond was asked for troops as well.#!\n\nNow the City is still under the sultan's siege. Timur's envoys have come in by way of Pera; a friar travels with the embassy, and Timur's banner already flies on the walls of Pera. It is recorded that the sultan of the Jalayirids and the chief of the Black Sheep have fled to the Ottomans, and Timur is angry over it."
 oe_ilk.2.desc_b: "#F Timur's armies have reached the east of Anatolia, and Timur has fallen out with Sultan Bayezid. It is said that Timur sent men to Constantinople to ask the emperor to make no peace with the sultan; the emperor of Trebizond was asked for troops as well.#!\n\nNow the City is still under the sultan's siege. Timur's envoys have come in by way of Pera; a friar travels with the embassy, and Timur's banner already flies on the walls of Pera."
 oe_ilk.2.desc_v_r: "#F Timur's armies have reached the east of Anatolia, and Timur has fallen out with Sultan Bayezid. It is said that Timur sent men to Constantinople to ask the emperor to make no peace with the sultan; the emperor of Trebizond was asked for troops as well.#!\n\nNow the empire is still the sultan's vassal. Timur's envoys have slipped into the City; a friar travels with the embassy, and Timur's banner already flies on the walls of Pera. It is recorded that the sultan of the Jalayirids and the chief of the Black Sheep have fled to the Ottomans, and Timur is angry over it."
 oe_ilk.2.desc_v: "#F Timur's armies have reached the east of Anatolia, and Timur has fallen out with Sultan Bayezid. It is said that Timur sent men to Constantinople to ask the emperor to make no peace with the sultan; the emperor of Trebizond was asked for troops as well.#!\n\nNow the empire is still the sultan's vassal. Timur's envoys have slipped into the City; a friar travels with the embassy, and Timur's banner already flies on the walls of Pera."
 oe_ilk.2.desc_x_r: "#F Timur's armies have reached the east of Anatolia, and Timur has fallen out with Sultan Bayezid. It is said that Timur sent men to Constantinople to ask the emperor to make no peace with the sultan; the emperor of Trebizond was asked for troops as well.#!\n\nNow Timur's envoys are in the City and ask to be received; a friar travels with the embassy, and Timur's banner already flies on the walls of Pera. It is recorded that the sultan of the Jalayirids and the chief of the Black Sheep have fled to the Ottomans, and Timur is angry over it."
 oe_ilk.2.desc_x: "#F Timur's armies have reached the east of Anatolia, and Timur has fallen out with Sultan Bayezid. It is said that Timur sent men to Constantinople to ask the emperor to make no peace with the sultan; the emperor of Trebizond was asked for troops as well.#!\n\nNow Timur's envoys are in the City and ask to be received; a friar travels with the embassy, and Timur's banner already flies on the walls of Pera."
 oe_ilk.2.a: "Promise tribute and ships"
 oe_ilk.2.a.tt: "Timur: opinion of the empire #G +25#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −20#! for #Y 10#! years\nIf the City is under siege: its morale #G +8#!\nIf the empire is still the sultan's vassal: the sultan's patience #R −20#!\nOne day Timur will come to collect"
 oe_ilk.2.b: "A letter, but no pact"
 oe_ilk.2.b.tt: "Timur: opinion of the empire #G +10#! for #Y 5#! years\nIf the City is under siege: its morale #G +3#!"
 oe_ilk.2.c: "Tell the sultan what the envoys want"
 oe_ilk.2.c.tt: "The Ottomans: opinion of the empire #G +15#! for #Y 5#! years\nTimur: opinion of the empire #R −20#! for #Y 10#! years\nIf the empire is still the sultan's vassal: the sultan's patience #G +15#!"
 oe_ilk.3.t: "The Ferries at the Straits"
 oe_ilk.3.desc_p_b: "#F The sultan has been beaten and taken in Anatolia; the Ottoman host has broken up, and its stragglers crowd the shore of the Straits waiting for boats. It is said that Timur asked the emperor to close the Straits with the imperial galleys, and it is said too that Italian ships took money and carried the Turks across, boatload by boatload.#!\n\nThe empire promised Timur ships, and Timur's envoys have come to hold the empire to its word. The Turks on the shore beg to be taken across, and they will pay. The men of the prince we back are crowding the shore too."
 oe_ilk.3.desc_p: "#F The sultan has been beaten and taken in Anatolia; the Ottoman host has broken up, and its stragglers crowd the shore of the Straits waiting for boats. It is said that Timur asked the emperor to close the Straits with the imperial galleys, and it is said too that Italian ships took money and carried the Turks across, boatload by boatload.#!\n\nThe empire promised Timur ships, and Timur's envoys have come to hold the empire to its word. The Turks on the shore beg to be taken across, and they will pay."
