l_english:
 # NEW 2026-11-23 v22.0 Module 1: Teutonic, Livonian & Hospitaller Military Orders (oe_teu_) — english localization (138 keys) (oe_teu_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v220_teu_start_laws.py; edit the generator, not this file.
 oe_teu_law_order_rule:0 "Military Order Rule & Martial Code"
 oe_teu_law_order_rule_desc:0 "Governs how the Military Order fields its armies—from austere vows of sworn knight-brothers to European guest-crusader expeditions and brick-fortress frontier militias."
 oe_teu_pol_pure_knight_brothers:0 "Pure Knight-Brothers Rule"
 oe_teu_pol_pure_knight_brothers_desc:0 "Restricts command and shock squadrons to vowed knight-brothers bound by monastic obedience, forging unmatched heavy cavalry discipline at the cost of narrower levies."
 oe_teu_pol_preussenreisen_guests:0 "Preussenreisen Guest Knights & Mercenaries"
 oe_teu_pol_preussenreisen_guests_desc:0 "Welcomes chivalric guest-crusaders from Bohemia, Bavaria, France, and England alongside contracted free companies, lifting campaign morale and mercenary efficiency."
 oe_teu_pol_ordensburg_militia:0 "Frontier Ordensburg Militia"
 oe_teu_pol_ordensburg_militia_desc:0 "Binds chartered townsmen and free frontier farmers to garrison the Order's network of brick castles, cutting fort upkeep while expanding manpower and levies."
 oe_teu_law_kulm_ostsiedlung:0 "Kulm Law & Ostsiedlung Charter"
 oe_teu_law_kulm_ostsiedlung_desc:0 "Defines land tenure, settler privileges, and relations with native Baltic, Prussian, and island subjects across the Order's frontier domains."
 oe_teu_pol_kulm_settler_charter:0 "Kulm German Settler Charter"
 oe_teu_pol_kulm_settler_charter_desc:0 "Extends hereditary Kulm Law tenures and tax holidays to incoming settlers and village locators, accelerating assimilation, growth, and rural prosperity."
 oe_teu_pol_bilingual_cogovernance:0 "Bilingual Order-Native Co-Governance"
 oe_teu_pol_bilingual_cogovernance_desc:0 "Recognizes baptized native freemen, parish interpreters, and local elders in provincial courts, strengthening religious conversion, realm stability, and maximum control."
 oe_teu_pol_brick_commandery_estates:0 "Brick-Fortress Commandery Estates"
 oe_teu_pol_brick_commandery_estates_desc:0 "Organizes newly cleared districts directly under brick commandery castles and salaried bailiffs, boosting fort construction, control, and fiscal extraction."
 oe_teu_law_balleien_tribute:0 "European Commandery Balleien Tribute Law"
 oe_teu_law_balleien_tribute_desc:0 "Regulates how the Order draws wealth, recruits, and diplomatic backing from its distant European commanderies (Balleien and Priories) across Latin Christendom."
 oe_teu_pol_remit_treasury_tithes:0 "Remit Treasury Tithes"
 oe_teu_pol_remit_treasury_tithes_desc:0 "Directs European commandery priors to liquidate surplus estate rents into bullion drafts remitted annually to the frontier treasury."
 oe_teu_pol_conscript_volunteer_knights:0 "Conscript Volunteer Knights"
 oe_teu_pol_conscript_volunteer_knights_desc:0 "Calls younger noble sons and armed sergeants from German, French, and Italian commanderies directly to the frontier banners, bolstering manpower and siegecraft."
 oe_teu_pol_papal_imperial_prestige:0 "Papal & Imperial Prestige Mandate"
 oe_teu_pol_papal_imperial_prestige_desc:0 "Maintains influential procurators at the Roman Curia and Imperial Diet, elevating diplomatic standing, religious influence, and vassal bishopric obedience."
 oe_teu_law_hansa_league:0 "Hanseatic Cities & Prussian Estates Charter"
 oe_teu_law_hansa_league_desc:0 "Balances the Grand Master's state trade factors against the commercial liberties of Hanseatic port towns and provincial urban confederations."
 oe_teu_pol_order_trade_monopoly:0 "Order Amber & Grain Monopoly"
 oe_teu_pol_order_trade_monopoly_desc:0 "Reserves Baltic amber regalia and bulk grain exports to the Order's Great Stewards (Grossschaffer), enlarging state authority and production at the cost of burgher discontent."
 oe_teu_pol_hanseatic_profit_sharing:0 "Hanseatic Profit-Sharing Compact"
 oe_teu_pol_hanseatic_profit_sharing_desc:0 "Partners directly with Hanseatic kontors in Gdansk, Torun, Elblag, and maritime ports, amplifying sea trade efficiency, merchant power, and burgher loyalty."
 oe_teu_pol_knight_merchant_confed:0 "Knight-Merchant Confederation"
 oe_teu_pol_knight_merchant_confed_desc:0 "Admits urban magistrates and landed knights into regular provincial diets, raising burgher tax capacity, cabinet competence, and merchant throughput."
 STATIC_MODIFIER_NAME_oe_teu_balleien_tier1_mod:0 "European Commandery Network (Modest)"
 STATIC_MODIFIER_DESC_oe_teu_balleien_tier1_mod:0 "Scattered Catholic commanderies and priories across Latin Christendom remit steady stipends and recruits to support the frontier crusade."
 STATIC_MODIFIER_NAME_oe_teu_balleien_tier2_mod:0 "European Commandery Network (Established)"
 STATIC_MODIFIER_DESC_oe_teu_balleien_tier2_mod:0 "A thriving network of German, French, and Mediterranean commanderies channels reliable tithes, armored volunteers, and curial influence to the Order."
 STATIC_MODIFIER_NAME_oe_teu_balleien_tier3_mod:0 "European Commandery Network (Pan-Christian)"
 STATIC_MODIFIER_DESC_oe_teu_balleien_tier3_mod:0 "Backed by rich imperial commanderies and prestigious priories across Christendom, the Order commands abundant gold, zeal, and battle-hardened morale."
 STATIC_MODIFIER_NAME_oe_teu_law_transition_mod:0 "Chapter-General Statute Transition"
 STATIC_MODIFIER_DESC_oe_teu_law_transition_mod:0 "Commandery priors and fortress marshals are promulgating the new statute adopted at the Order's General Chapter."
 STATIC_MODIFIER_NAME_oe_teu_preussenreisen_crusade_mod:0 "Preussenreisen Guest Crusaders"
 STATIC_MODIFIER_DESC_oe_teu_preussenreisen_crusade_mod:0 "Princes, counts, and chivalric retinues from across Western Europe rally beneath the Order's banner for a seasonal campaign against its foes."
 STATIC_MODIFIER_NAME_oe_teu_kulm_charter_active_mod:0 "Kulm Law Settlement Charter"
 STATIC_MODIFIER_DESC_oe_teu_kulm_charter_active_mod:0 "New Kulm town and village charters attract industrious artisans and colonists, lifting regional prosperity, growth, and assimilation."
 STATIC_MODIFIER_NAME_oe_teu_amber_hansa_compact_mod:0 "Baltic Amber & Grain Staple Compact"
 STATIC_MODIFIER_DESC_oe_teu_amber_hansa_compact_mod:0 "Coordinated customs staples across Order ports stabilize amber and grain exports into Western European markets."
 STATIC_MODIFIER_NAME_oe_teu_preussenreisen_1337_mod:0 "1337 Royal Preussenreisen Vanguard"
 STATIC_MODIFIER_DESC_oe_teu_preussenreisen_1337_mod:0 "King John of Bohemia and Duke Henry of Bavaria ride beside the Grand Master from Marienburg, giving the Teutonic host decisive morale and siege punch."
 STATIC_MODIFIER_NAME_oe_teu_brick_ostsiedlung_mod:0 "Brick Ordensburg & Ostsiedlung Charter"
 STATIC_MODIFIER_DESC_oe_teu_brick_ostsiedlung_mod:0 "Resources diverted from lavish banquets fund kiln-fired Ordensburg bastions and planned German-Pruthenian frontier settlements."
 STATIC_MODIFIER_NAME_oe_teu_liv_northern_wing_mod:0 "Livonian Northern Wing Offensive"
 STATIC_MODIFIER_DESC_oe_teu_liv_northern_wing_mod:0 "Master Eberhard von Monheim's northern columns coordinate tightly with Marienburg to pressure Samogitia and Lithuania from the Daugava."
 STATIC_MODIFIER_NAME_oe_teu_liv_daugava_forts_mod:0 "Daugava Stone Ordensburgen Line"
 STATIC_MODIFIER_DESC_oe_teu_liv_daugava_forts_mod:0 "Reinforced stone commanderies along the Daugava and Courland anchor Livonian control and blunt enemy counter-raids."
 STATIC_MODIFIER_NAME_oe_teu_kni_war_fleet_mod:0 "Standing Aegean Galley Squadron"
 STATIC_MODIFIER_DESC_oe_teu_kni_war_fleet_mod:0 "Outfitted at Rhodes's fortified harbor, the Knights Hospitaller maintain a razor-sharp galley squadron policing the eastern Aegean sea lanes."
 STATIC_MODIFIER_NAME_oe_teu_kni_hospital_harbor_mod:0 "Rhodes Grand Hospital & Free Harbor"
 STATIC_MODIFIER_DESC_oe_teu_kni_hospital_harbor_mod:0 "Endowments to the Convent Hospital and Rhodes's bustling Levant warehouses bolster sea trade, devotion, and island fortification."
 STATIC_MODIFIER_NAME_oe_teu_kniprode_golden_age_mod:0 "Winrich von Kniprode's Table of Honor"
 STATIC_MODIFIER_DESC_oe_teu_kniprode_golden_age_mod:0 "Under the legendary Ehrentisch banquets and disciplined Marshalcy, Marienburg stands as the premier chivalric court of Northern Europe."
 STATIC_MODIFIER_NAME_oe_teu_kniprode_chancery_mod:0 "Marienburg Chancery & School Reforms"
 STATIC_MODIFIER_DESC_oe_teu_kniprode_chancery_mod:0 "Reformed cathedral schools, audited grain ledgers, and disciplined chancery clerks modernize the Order's governance."
 STATIC_MODIFIER_NAME_oe_teu_marienburg_citadel_loc_mod:0 "Marienburg High Castle (Hochschloss)"
 STATIC_MODIFIER_DESC_oe_teu_marienburg_citadel_loc_mod:0 "Europe's largest Gothic brick fortress rises above the Nogat River, radiating impenetrable defense, control, and civic pride."
 STATIC_MODIFIER_NAME_oe_teu_ordensburg_garrisons_mod:0 "Ordensburg Granary & Garrison Network"
 STATIC_MODIFIER_DESC_oe_teu_ordensburg_garrisons_mod:0 "Standardized garrison depots and brick wall works across every commandery cut fort costs and fortify border resilience."
 STATIC_MODIFIER_NAME_oe_teu_balleien_boom_treasury_mod:0 "Commandery Tithe Surplus"
 STATIC_MODIFIER_DESC_oe_teu_balleien_boom_treasury_mod:0 "Abundant harvests across imperial and Italian commanderies swell regular remittances to the frontier treasury."
 STATIC_MODIFIER_NAME_oe_teu_balleien_boom_knights_mod:0 "Commandery Volunteer Levy Surge"
 STATIC_MODIFIER_DESC_oe_teu_balleien_boom_knights_mod:0 "Fresh companies of vowed sergeants and noble volunteers march east from the European priories to replenish frontier banners."
 STATIC_MODIFIER_NAME_oe_teu_prussian_estates_compact_mod:0 "Prussian Cities & Estates Compact"
 STATIC_MODIFIER_DESC_oe_teu_prussian_estates_compact_mod:0 "Timely dialogue with Gdansk, Torun, and Elblag channels urban wealth into lawful taxes and maritime growth while averting rebellion."
 STATIC_MODIFIER_NAME_oe_teu_order_prerogative_mod:0 "Undivided Grand Master Prerogative"
 STATIC_MODIFIER_DESC_oe_teu_order_prerogative_mod:0 "Reasserting the Order's monastic sovereignty over municipal councils strengthens central command and military discipline."
 STATIC_MODIFIER_NAME_oe_teu_riga_accord_mod:0 "Accord of Daugavgriva (Riga Reconciliation)"
 STATIC_MODIFIER_DESC_oe_teu_riga_accord_mod:0 "A durable settlement between the Livonian Order, the City of Riga, and the Archbishopric secures loyal subjects and thriving Baltic commerce."
 STATIC_MODIFIER_NAME_oe_teu_livonian_hegemony_mod:0 "Livonian Garrison Supremacy"
 STATIC_MODIFIER_DESC_oe_teu_livonian_hegemony_mod:0 "Direct fortress garrisons over Riga and the bishoprics keep Livonia's war machine concentrated under the Landmeister's iron hand."
 STATIC_MODIFIER_NAME_oe_teu_kulm_charter_boom_mod:0 "Expanded Kulm Town Charters"
 STATIC_MODIFIER_DESC_oe_teu_kulm_charter_boom_mod:0 "Dozens of newly chartered market towns along the Vistula and Pregolya spur settler growth, assimilation, and artisan output."
 STATIC_MODIFIER_NAME_oe_teu_commandery_domains_mod:0 "Direct Commandery Crown Domains"
 STATIC_MODIFIER_DESC_oe_teu_commandery_domains_mod:0 "Reserving frontier clearings for the Order's own granaries and horse studs boosts fiscal receipts and control."
 STATIC_MODIFIER_NAME_oe_teu_amber_regal_monopoly_mod:0 "Samland Amber Regal Monopoly"
 STATIC_MODIFIER_DESC_oe_teu_amber_regal_monopoly_mod:0 "Strict Order patrols along the Samland coast enforce the Grand Master's exclusive amber regalia, swelling treasury coffers."
 STATIC_MODIFIER_NAME_oe_teu_amber_hanseatic_guild_mod:0 "Hanseatic Amber Guild Licensure"
 STATIC_MODIFIER_DESC_oe_teu_amber_hanseatic_guild_mod:0 "Licensing amber craftsmen in Lubeck, Bruges, and Prussian ports unlocks high-margin Baltic sea commerce and burgher goodwill."
 oe_teu_dec_summon_preussenreisen.title:0 "Summon the European Preussenreisen"
 oe_teu_dec_summon_preussenreisen.desc:0 "Send heralds across Bohemia, Bavaria, France, and the Rhineland inviting chivalric lords to ride beneath the Order's banner. Repeating every #Y 10 years#!, the summons replenishes #G +3#! manpower, #G +5#! army tradition, and grants #G 5 years#! of elite crusade morale and siege vigor."
 oe_teu_dec_summon_preussenreisen.a:0 "Proclaim the Crusade Banner Across Christendom"
 oe_teu_dec_kulm_settlement_charter.title:0 "Issue Kulm Law Settlement Charter"
 oe_teu_dec_kulm_settlement_charter.desc:0 "Charter new frontier towns and agricultural clearings under the famed legal code of Kulm. Repeating every #Y 12 years#!, this program lifts capital prosperity by #G +8%#! and grants #G 10 years#! of Ostsiedlung growth, assimilation, and fiscal expansion."
 oe_teu_dec_kulm_settlement_charter.a:0 "Seal and Promulgate the Kulm Charter"
 oe_teu_dec_collect_balleien_tithes.title:0 "Audit European Commandery Tithes"
 oe_teu_dec_collect_balleien_tithes.desc:0 "Dispatch treasury inspectors to audit our European commanderies (Balleien) and priories across Catholic Christendom. Repeating every #Y 8 years#!, the audit scales with our commandery network tier, remitting #G 65–140#! ducats and #G 1–3#! manpower while refreshing our Balleien tier bonus."
 oe_teu_dec_collect_balleien_tithes.a:0 "Collect the Audited Balleien Remittances"
 oe_teu_dec_amber_hansa_compact.title:0 "Charter the Baltic Amber & Grain Staple"
 oe_teu_dec_amber_hansa_compact.desc:0 "Coordinate the Order's commercial stewards with port guilds to standardize amber grading, grain warehouses, and Hanseatic shipping tolls. Repeating every #Y 12 years#!, this compact pleases the burghers and delivers #G 10 years#! of maritime trade and production strength."
 oe_teu_dec_amber_hansa_compact.a:0 "Ratify the Maritime Staple Compact"
 oe_teu.1.title:0 "Preussenreisen 1337: Royal Guests at Marienburg"
 oe_teu.1.desc:0 "Banners of the Lion of Bohemia and the blue-and-white lozenges of Bavaria stream across the Nogat bridge into Marienburg. King John of Luxembourg and Duke Henry XIV of Lower Bavaria have brought hundreds of armored lances, warhorses, and silver coffers to join Grand Master Dietrich von Altenburg's Baltic crusade against pagan Lithuania. Shall we muster these guest-crusaders straight into an overwhelming strike force, or channel their donations into permanent brick Ordensburgen and Ostsiedlung charters?"
 oe_teu.1.a:0 "Muster the Guest-Crusader Vanguard and Strike Lithuania!"
 oe_teu.1.b:0 "Invest in Brick Ordensburgen and Long-Term Ostsiedlung"
 oe_teu.2.title:0 "Livonian Northern Wing Mobilization"
 oe_teu.2.desc:0 "Couriers riding hard up the Courland coast bring sealed war orders from Marienburg: the Grand Master's main column prepares to cross the Nemunas, and Lithuania's northern marches lie exposed across the Daugava. Landmeister Eberhard von Monheim summons the commanders of Parnu, Cesis, and Viljandi to decide whether the Livonian branch will launch an immediate joint offensive or fortify the Daugava stone castle line."
 oe_teu.2.a:0 "March South in Concert with Marienburg"
 oe_teu.2.b:0 "Fortify the Daugava Ordensburgen Line"
 oe_teu.3.title:0 "The Hospitaller War Fleet of Rhodes"
 oe_teu.3.desc:0 "From the towers guarding Rhodes's harbor chain, Grand Master Helion de Villeneuve watches Anatolian corsair sails multiply along the Carian straits. Having cleared the Order's debts through disciplined reform of its European priories, the Convent now holds the funds to either commission a standing Aegean war-galley squadron or endow Rhodes's famed Grand Hospital and Levant entrepot."
 oe_teu.3.a:0 "Commission the Standing Aegean Galley Squadron"
 oe_teu.3.b:0 "Expand Rhodes's Grand Hospital and Commercial Harbor"
 oe_teu.4.title:0 "Golden Age of Winrich von Kniprode"
 oe_teu.4.desc:0 "A generation of disciplined administration and victorious campaigns has lifted the Teutonic Order to the zenith of its medieval renown. Chroniclers from Paris to Prague celebrate Marienburg's Table of Honor (Ehrentisch), where the bravest European knights feast beside the Grand Master, while prudent jurists urge us to invest this peak prosperity into permanent cathedral schools and chancery reforms."
 oe_teu.4.a:0 "Host the Table of Honor and Magnify the Order's Chivalry"
 oe_teu.4.b:0 "Reform Marienburg's Schools and Chancery Ledgers"
 oe_teu.5.title:0 "Completion of the Marienburg High Castle"
 oe_teu.5.desc:0 "After decades of kiln-firing millions of Prussian red bricks along the Nogat, the soaring vaults of the Marienburg Hochschloss, St. Mary's chapel, and the Grand Master's summer refectory stand complete. Never before has Northern Europe beheld so formidable a brick fortress-palace. Should we stage a solemn consecration cementing Marienburg as our eternal citadel, or funnel our remaining masons into frontier castle granaries?"
 oe_teu.5.a:0 "Consecrate the High Castle as the Eternal Seat of the Order"
 oe_teu.5.b:0 "Deploy the Masons to Frontier Ordensburg Granaries"
 oe_teu.6.title:0 "European Commandery Tithe Boom"
 oe_teu.6.desc:0 "Good harvests across Franconia, Alsace, Thuringia, and Italy have filled the coffers of our distant European commanderies (Balleien). The Landkomture send word asking whether Marienburg or Rhodes prefers direct bullion transfers for the war chest or newly equipped companies of noble volunteers dispatched directly to the front."
 oe_teu.6.a:0 "Remit Bullion Drafts Directly to the War Chest"
 oe_teu.6.b:0 "Raise Volunteer Knight Companies Across the Commanderies"
 oe_teu.7.title:0 "Petition of the Prussian Cities & Estates"
 oe_teu.7.desc:0 "Envoys from the town councils of Gdansk, Torun, and Elblag have arrived at Marienburg bearing a joint parchment sealed by their guilds and local gentry. Complaining of wartime tolls and competition from the Order's own Great Stewards, they respectfully demand consultative representation in fiscal diets. Yielding gracefully could forge a prosperous compact, whereas firm assertion of the Grand Master's sovereignty preserves undivided command."
 oe_teu.7.a:0 "Grant Consultative Charters to the Prussian Estates"
 oe_teu.7.b:0 "Uphold the Grand Master's Undivided Sovereignty"
 oe_teu.8.title:0 "Livonian-Riga Reconciliation"
 oe_teu.8.desc:0 "For half a century, bitter disputes between the Livonian Order, the wealthy Hanseatic city of Riga, and the Archbishop of Riga have invited papal legates and foreign meddling. With the Daugava frontier demanding unity, envoys from Riga offer a formal settlement confirming mutual trading privileges if we ease our fortress jurisdiction over the city."
 oe_teu.8.a:0 "Ratify the Accord of Daugavgriva with Riga"
 oe_teu.8.b:0 "Enforce Direct Order Garrison Supremacy Over Riga"
 oe_teu.9.title:0 "Expansion of the Kulm Law Town Charters"
 oe_teu.9.desc:0 "Experienced locators and settlers from Silesia, Westphalia, and Pomerania petition the Grand Master for new town charters modeled on the venerable Kulm Handfeste of 1233. Extending free municipal charters promises a surge of workshops and colonists across our frontier wilderness, though our commandery stewards prefer reserving the richest clearings as direct Order estates."
 oe_teu.9.a:0 "Grant Free Kulm Charters Across the Frontier"
 oe_teu.9.b:0 "Reserve Prime Clearings for Direct Commandery Estates"
 oe_teu.10.title:0 "The Baltic Amber Monopoly Dispute"
 oe_teu.10.desc:0 "Golden Baltic amber washed ashore along the Samland coast near Konigsberg and Elblag is prized across Europe for rosaries and fine craftsmanship. Our Amber Master (Bernsteinmeister) demands ruthless enforcement of the Order's sovereign Bernsteinregal against smuggling, whereas Hanseatic syndics from Lubeck and Bruges propose a licensed export guild paying steady customs in exchange for open wholesale supply."
 oe_teu.10.a:0 "Enforce the Samland Amber Regal Exclusively"
 oe_teu.10.b:0 "License the Lubeck and Bruges Amber Guilds"
 STATIC_MODIFIER_NAME_oe_teu_liv_viterbo_oath_mod:0 "Viterbo Oath of Brotherhood"
 STATIC_MODIFIER_DESC_oe_teu_liv_viterbo_oath_mod:0 "Bound by the 1237 Union of Viterbo, the Livonian Master governs his northern commanderies in sworn obedience to the Hochmeister in Marienburg, trading independent foreign standing for steadfast brotherhood."
