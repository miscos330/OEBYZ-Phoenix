l_english:
# Project Phoenix v36.0 WP47: Imperial Mass Vassal Directives, Theme Escheatment & Praecepta Militaria (EN)
 oe_wp47_mass_directive_cd:0 "Imperial Mass Vassal Directive Cooldown"
 oe_wp47_directive_ready_tt:0 "No Imperial Mass Vassal Directive has been issued in the last 5 years."
 oe_wp47_fleet_cd:0 "Thematic Fleet Mobilization Cooldown"
 oe_wp47_tagmata_cd:0 "Tagmata Muster Cooldown"
 oe_wp47_roads_cd:0 "Roads & Monasteries Patronage Cooldown"
 oe_wp47_fleet_not_active_tt:0 "Thematic Fleet Mobilization is not currently active."
 oe_wp47_tagmata_not_active_tt:0 "Tagmata Muster is not currently active."
 oe_wp47_roads_not_active_tt:0 "Imperial Road & Monastery Patronage is not currently active."
 oe_wp47_act_mobilize_thematic_fleet:0 "Mobilize the Thematic Fleet"
 oe_wp47_act_mobilize_thematic_fleet_desc:0 "Call upon the Aegean maritime themes and imperial shipyards to accelerate galley construction, summon sailor reserves, and sharpen fleet combat readiness for 5 years."
 oe_wp47_act_mobilize_thematic_fleet_tt:0 "Spend 75 Gold to gain 12 months of Sailors, +5 Navy Tradition, and #P Mobilized Thematic Fleet#! (+25% Ship Build Speed, +25% Sailors, +15% Galley Power, +10% Naval Morale) for 5 years."
 oe_wp47_act_muster_tagmata:0 "Muster the Imperial Tagmata"
 oe_wp47_act_muster_tagmata_desc:0 "Assemble the professional heavy cavalry regiments and palace scholae for an immediate surge in discipline, cavalry shock power, and army mobility for 5 years."
 oe_wp47_act_muster_tagmata_tt:0 "Spend 90 Gold to gain 6 months of Manpower, +5 Army Tradition, and #P Mustered Imperial Tagmata#! (+15% Heavy Cavalry Power, +5% Discipline, +8% Land Morale, +10% Army Movement Speed) for 5 years."
 oe_wp47_act_patronize_roads_monasteries:0 "Patronize Imperial Roads & Monasteries"
 oe_wp47_act_patronize_roads_monasteries_desc:0 "Endow repairs along the Via Egnatia alongside imperial chrysobulls for Mount Athos, the Monastery of Studion, and Meteora, strengthening control, prosperity, and clerical loyalty for 5 years."
 oe_wp47_act_patronize_roads_monasteries_tt:0 "Spend 100 Gold to gain +6 Prestige, +4 Legitimacy, +8% Clergy Satisfaction, regional Prosperity/Control in Constantinople, Thessalonica, Mount Athos, and Trikala (if owned), and #P Imperial Road & Monastery Patronage#! for 5 years."
 oe_wp47_bias_imperial_appeasement:0 "Imperial Conciliation Charter"
 oe_wp47_bias_loyal_strategos:0 "Appointed Imperial Strategos"
 oe_wp47_bias_confirmed_succession:0 "Confirmed Local Succession"
 oe_wp47_bias_escheat_seizure:0 "Reclaimed Heirless Theme"
 oe_wp47_escheat.1.t:0 "Escheatment of an Heirless Theme"
 oe_wp47_escheat.1.d:0 "Word has arrived at the imperial court that the ruler of [oe_wp47_escheat_subject.GetName] has passed away without leaving a recognized heir. Under ancient Roman public law, a thematic command or pronoia held from the Crown reverts to the sovereign upon the extinction of its ruling line. Our council awaits our decree: shall we absorb the territory directly into the imperial demesne, dispatch a hand-picked loyal strategos, or confirm a local aristocratic claimant in exchange for rich tribute?"
 oe_wp47_escheat.1.a:0 "Reclaim the theme directly into the Imperial Demesne"
 oe_wp47_escheat.1.a.tt:0 "Diplomatically annex [oe_wp47_escheat_subject.GetName] into our direct imperial administration at the cost of stability, noble satisfaction, and minor unease among remaining subjects."
 oe_wp47_escheat.1.b:0 "Appoint a loyal Imperial Strategos to govern in our name"
 oe_wp47_escheat.1.b.tt:0 "Preserve [oe_wp47_escheat_subject.GetName] as a fiercely loyal imperial theme with reduced liberty desire and boosted crown authority."
 oe_wp47_escheat.1.c:0 "Confirm local aristocratic succession for imperial tribute"
 oe_wp47_escheat.1.c.tt:0 "Collect 120 Gold in confirmation dues, please the nobility, and reassure every subject court across our realm."
 oe_wp47_escheat.2.t:0 "Oath of the Imperial Strategos"
 oe_wp47_escheat.2.d:0 "Having inspected the thematic registers, cavalry stables, and frontier fortresses across our tributary borderlands, our provincial strategoi have dispatched uniformed envoys to the Great Palace. Bearing sealed muster rolls and renewed oaths of allegiance, they petition the Emperor to clarify the exact boundary between imperial chancery oversight and local military jurisdiction in times of sudden invasion."
 oe_wp47_escheat.2.a:0 "Bind their commissions tightly to the Imperial Chancery"
 oe_wp47_escheat.2.b:0 "Grant them honorable frontier command discretion"
 oe_wp47_escheat.2.c:0 "Summon a proven frontier captain to serve at our court"
 oe_wp47_escheat.3.t:0 "Imperial Logothete Corruption Audit"
 oe_wp47_escheat.3.d:0 "Sharp-eyed auditors dispatched by the imperial treasury have returned from our subject themes carrying double-entry ledgers stained with erasures. Their findings expose irregular toll exemptions, concealed customs skimming, and ghost garrisons protected by provincial tax farmers and aristocratic patrons. A stern imperial reckoning will refill the crown chests and tighten fiscal obedience, yet pushing too hard risks embittering proud regional houses."
 oe_wp47_escheat.3.a:0 "Seize illicit arrears and enforce strict crown audits"
 oe_wp47_escheat.3.b:0 "Settle quietly with local archontes to keep the peace"
 oe_wp47_escheat.3.c:0 "Elevate the incorruptible chief auditor to lead fiscal reform"
 oe_wp47_escheat.4.t:0 "Petition of the Thematic Archontes"
 oe_wp47_escheat.4.d:0 "An imposing delegation of provincial archontes representing our vassals, pronoia holders, and frontier themes has arrived before the imperial Senate in ceremonial robes. Speaking in measured court Greek, they warn that relentless campaigns and stiff cadastral assessments have strained local estates, and request written imperial assurances confirming their ancient charters and customary rights across the provinces."
 oe_wp47_escheat.4.a:0 "Uphold the imperial fiscal register without exception"
 oe_wp47_escheat.4.b:0 "Grant a generous imperial charter to cement their loyalty"
 oe_wp47_escheat.4.c:0 "Draw their most persuasive spokesman into imperial service"
 oe_wp47_escheat.5.t:0 "Grand Imperial Census & Brebion"
 oe_wp47_escheat.5.d:0 "In the wake of recent thematic realignments and recovered provinces, the Imperial Chancery proposes dispatching surveying teams to compile a fresh Brebion cadastre from Thrace to the distant marches. By recording every taxable hearth, crown vineyard, and hereditary stratiotai military holding on uniform parchment rolls, the empire can sharpen both tax remittances and provincial manpower mobilization for a generation."
 oe_wp47_escheat.5.a:0 "Compile the full imperial Brebion cadastre"
 oe_wp47_escheat.5.b:0 "Prioritize registering military stratiotai plots for levies"
 oe_wp47_escheat.5.c:0 "Appoint a master cadastral surveyor to modernize the fisc"
 oe_wp47_directive_imperial_taxation:0 "Imperial Directive: Fiscal Levy"
 oe_wp47_directive_imperial_taxation_desc:0 "Issue a realm-wide fiscal decree across all eligible subjects, raising subject taxation and overlord tribute transfers for 5 years at the cost of heightened subject liberty desire. Replaces any active Imperial Subject Directive."
 oe_wp47_directive_imperial_taxation_tt:0 "All eligible subjects gain #P Imperial Fiscal Levy#! (+12% Tax Efficiency, -8 Loyalty to Overlord, +5 Liberty Desire) and our realm gains +12% Subject Income for 5 years."
 STATIC_MODIFIER_NAME_oe_wp47_dir_imperial_taxation:0 "Imperial Fiscal Levy"
 STATIC_MODIFIER_DESC_oe_wp47_dir_imperial_taxation:0 "Imperial tax assessors standardize provincial cadastres and extract elevated tribute for the sovereign treasury."
 STATIC_MODIFIER_NAME_oe_wp47_overlord_imperial_taxation:0 "Imperial Fiscal Levy (Overlord)"
 STATIC_MODIFIER_DESC_oe_wp47_overlord_imperial_taxation:0 "Standardized imperial assessments across vassals and themes channel higher tributary revenues to the capital."
 oe_wp47_directive_frontier_mobilization:0 "Imperial Directive: Frontier Mobilization"
 oe_wp47_directive_frontier_mobilization_desc:0 "Sound the war muster across all eligible subjects, accelerating manpower, levy size, levy recruitment, and battlefield discipline for 5 years. Replaces any active Imperial Subject Directive."
 oe_wp47_directive_frontier_mobilization_tt:0 "All eligible subjects gain #P Frontier Mobilization#! (+15% Manpower, +15% Levy Size, +20% Levy Recruitment Speed, +3% Discipline, -4 Loyalty to Overlord) for 5 years."
 STATIC_MODIFIER_NAME_oe_wp47_dir_frontier_mobilization:0 "Frontier Mobilization"
 STATIC_MODIFIER_DESC_oe_wp47_dir_frontier_mobilization:0 "Subject commanders muster thematic contingents and drill provincial levies for imperial campaign service."
 oe_wp47_directive_faith_mission:0 "Imperial Directive: State Faith Mission"
 oe_wp47_directive_faith_mission_desc:0 "Dispatch imperial synodal and state-faith missions across all eligible subjects, accelerating religious conversion and missionary building output for 5 years. Replaces any active Imperial Subject Directive."
 oe_wp47_directive_faith_mission_tt:0 "All eligible subjects gain #P State Faith Mission#! (+25% Pop Conversion Speed, +20% Missionary Building Effort, +5% Clergy Target Satisfaction) for 5 years."
 STATIC_MODIFIER_NAME_oe_wp47_dir_faith_mission:0 "State Faith Mission"
 STATIC_MODIFIER_DESC_oe_wp47_dir_faith_mission:0 "Imperial prelates, preachers, and endowed parishes unify provincial congregations under the state faith."
 oe_wp47_directive_cultural_integration:0 "Imperial Directive: Cultural Integration"
 oe_wp47_directive_cultural_integration_desc:0 "Coordinate civic law, court patronage, and provincial academies across all eligible subjects, accelerating cultural assimilation, monthly control, and administrative reach for 5 years. Replaces any active Imperial Subject Directive."
 oe_wp47_directive_cultural_integration_tt:0 "All eligible subjects gain #P Cultural Integration#! (+25% Pop Assimilation Speed, +0.25% Monthly Control, +10% Control Propagation) for 5 years."
 STATIC_MODIFIER_NAME_oe_wp47_dir_cultural_integration:0 "Cultural Integration"
 STATIC_MODIFIER_DESC_oe_wp47_dir_cultural_integration:0 "Provincial chanceries and schools align local elites with imperial administration and civic customs."
 oe_wp47_directive_frontier_fortification:0 "Imperial Directive: Frontier Fortification"
 oe_wp47_directive_frontier_fortification_desc:0 "Order subject engineers and frontier garrisons to reinforce bastions, expand garrison reserves, and harass besieging armies for 5 years. Replaces any active Imperial Subject Directive."
 oe_wp47_directive_frontier_fortification_tt:0 "All eligible subjects gain #P Frontier Fortification#! (+20% Fort Defense, +2% Garrison Growth, +20% Garrison Size, +0.50 Hostile Attrition) for 5 years."
 STATIC_MODIFIER_NAME_oe_wp47_dir_frontier_fortification:0 "Frontier Fortification"
 STATIC_MODIFIER_DESC_oe_wp47_dir_frontier_fortification:0 "Reinforced curtain walls, signal towers, and stocked magazines turn subject strongholds into formidable bulwarks."
 oe_wp47_directive_imperial_appeasement:0 "Imperial Directive: Conciliation & Appeasement"
 oe_wp47_directive_imperial_appeasement_desc:0 "Spend imperial gold and ceremonial prestige to distribute court honors and charters to all eligible subjects, sharply reducing liberty desire and boosting loyalty and opinion for 5 years. Replaces any active Imperial Subject Directive."
 oe_wp47_directive_imperial_appeasement_tt:0 "Spend 60 Gold and 5 Prestige. All eligible subjects lose 10 Liberty Desire, gain +25 Opinion and #P Imperial Conciliation#! (+12 Loyalty to Overlord, +5% Tax Efficiency); our realm gains +8 Subject Loyalty and +1 Diplomatic Reputation for 5 years."
 STATIC_MODIFIER_NAME_oe_wp47_dir_imperial_appeasement:0 "Imperial Conciliation"
 STATIC_MODIFIER_DESC_oe_wp47_dir_imperial_appeasement:0 "Court stipends, confirmed charters, and ceremonial dignities bind provincial rulers closely to the sovereign throne."
 STATIC_MODIFIER_NAME_oe_wp47_overlord_imperial_appeasement:0 "Imperial Conciliation (Overlord)"
 STATIC_MODIFIER_DESC_oe_wp47_overlord_imperial_appeasement:0 "Gracious diplomacy and honored charters calm restive vassals across the imperial sphere."
 oe_wp47_reform_tagmata_scholae:0 "Imperial Tagmata & Scholae Palatinae"
 oe_wp47_reform_tagmata_scholae_desc:0 "Establishes permanent, crown-paid field regiments under the Domestic of the Schools, pairing disciplined palace cadres with imperial command authority over regional themes."
 oe_wp47_reform_klibanophoroi:0 "Klibanophoroi Cataphract Corps"
 oe_wp47_reform_klibanophoroi_desc:0 "Codifies Nikephoros Phokas's blunted-wedge heavy cavalry formations, armoring both steed and lancer in lamellar steel to shatter enemy battle lines."
 oe_wp47_reform_varangian_guard:0 "Imperial Varangian Guard"
 oe_wp47_reform_varangian_guard_desc:0 "Maintains the sworn northern axe-bearing elite bound directly to the Emperor's person, deterring palace coups while anchoring imperial siege and field assaults."
 oe_wp47_reform_thematic_navy:0 "Cibyrrhaeot & Imperial Thematic Navy"
 oe_wp47_reform_thematic_navy_desc:0 "Rebuilds the maritime themes of the Aegean and southern Anatolia alongside the central imperial fleet, supporting fast dromon construction and siphon-armed galley dominance."
 STATIC_MODIFIER_NAME_oe_wp47_mod_reclaimed_theme:0 "Reclaimed Imperial Demesne"
 STATIC_MODIFIER_DESC_oe_wp47_mod_reclaimed_theme:0 "Direct imperial fiscal clerks absorb an escheated theme into the crown registers."
 STATIC_MODIFIER_NAME_oe_wp47_mod_loyal_strategos:0 "Imperial Strategos Commission"
 STATIC_MODIFIER_DESC_oe_wp47_mod_loyal_strategos:0 "A hand-picked imperial strategos governs the theme in strict fidelity to the throne."
 STATIC_MODIFIER_NAME_oe_wp47_mod_overlord_strategos_patronage:0 "Imperial Strategos Patronage"
 STATIC_MODIFIER_DESC_oe_wp47_mod_overlord_strategos_patronage:0 "Assertive appointment of loyal thematic generals strengthens crown authority across the empire."
 STATIC_MODIFIER_NAME_oe_wp47_mod_aristocratic_charter:0 "Confirmed Aristocratic Charters"
 STATIC_MODIFIER_DESC_oe_wp47_mod_aristocratic_charter:0 "Recognizing local dynastic succession calms magnates and reassures every subject court."
 STATIC_MODIFIER_NAME_oe_wp47_mod_clean_audit:0 "Logothete Fiscal Audit"
 STATIC_MODIFIER_DESC_oe_wp47_mod_clean_audit:0 "Imperial auditors root out provincial peculation and restore orderly tax remittances."
 STATIC_MODIFIER_NAME_oe_wp47_mod_imperial_census:0 "Grand Imperial Brebion Census"
 STATIC_MODIFIER_DESC_oe_wp47_mod_imperial_census:0 "Updated provincial cadastres and military land rolls sharpen recruitment and revenue collection."
 STATIC_MODIFIER_NAME_oe_wp47_mod_mobilized_thematic_fleet:0 "Mobilized Thematic Fleet"
 STATIC_MODIFIER_DESC_oe_wp47_mod_mobilized_thematic_fleet:0 "Aegean shipyards and maritime themes run day and night to arm and crew the imperial dromon squadrons."
 STATIC_MODIFIER_NAME_oe_wp47_mod_mustered_tagmata:0 "Mustered Imperial Tagmata"
 STATIC_MODIFIER_DESC_oe_wp47_mod_mustered_tagmata:0 "The heavy cavalry regiments and palace scholae ride forth at full readiness under the imperial banners."
 STATIC_MODIFIER_NAME_oe_wp47_mod_patronized_roads_monasteries:0 "Imperial Road & Monastery Patronage"
 STATIC_MODIFIER_DESC_oe_wp47_mod_patronized_roads_monasteries:0 "Imperial funding repairs the Via Egnatia milestones and endows Athos, Studion, and Meteora, uniting civil reach with spiritual legitimacy."
 STATIC_MODIFIER_NAME_oe_wp47_mod_taktika_doctrine:0 "Taktika of Emperor Leo VI"
 STATIC_MODIFIER_DESC_oe_wp47_mod_taktika_doctrine:0 "Officers study combined-arms maneuvers, disciplined encampments, and calculated counter-raids."
 STATIC_MODIFIER_NAME_oe_wp47_mod_praecepta_manual:0 "Praecepta Militaria Field Manual"
 STATIC_MODIFIER_DESC_oe_wp47_mod_praecepta_manual:0 "Nikephoros Phokas's manual drills heavy cataphract wedges alongside shielded infantry squares."
 STATIC_MODIFIER_NAME_oe_wp47_mod_greek_fire_foundry:0 "Imperial Greek Fire Foundry"
 STATIC_MODIFIER_DESC_oe_wp47_mod_greek_fire_foundry:0 "State-guarded artisans manufacture pressurized bronze siphons and incendiary naphtha for imperial dromons."
 STATIC_MODIFIER_NAME_oe_wp47_mod_varangian_oath:0 "Sworn Varangian Brotherhood"
 STATIC_MODIFIER_DESC_oe_wp47_mod_varangian_oath:0 "Fresh Nordic and Rus recruits swear fealty on the palace Gospel, fortifying the Emperor's personal retinue."
 STATIC_MODIFIER_NAME_oe_wp47_mod_via_egnatia_repaired:0 "Restored Via Egnatia Highway"
 STATIC_MODIFIER_DESC_oe_wp47_mod_via_egnatia_repaired:0 "Dressed stone paving and courier relays speed legions and trade caravans across Macedonia and Thrace."
 STATIC_MODIFIER_NAME_oe_wp47_mod_athos_chrysobull:0 "Chrysobull of Mount Athos"
 STATIC_MODIFIER_DESC_oe_wp47_mod_athos_chrysobull:0 "Imperial protection of the Athonite lavras elevates Orthodox prestige and clerical harmony."
 STATIC_MODIFIER_NAME_oe_wp47_mod_studion_scriptorium:0 "Scriptorium of the Studion"
 STATIC_MODIFIER_DESC_oe_wp47_mod_studion_scriptorium:0 "Master calligraphers preserve imperial laws, tactical treatises, and patristic manuscripts."
 STATIC_MODIFIER_NAME_oe_wp47_mod_theme_cavalry_drill:0 "Anatolian Thematic Cavalry Drill"
 STATIC_MODIFIER_DESC_oe_wp47_mod_theme_cavalry_drill:0 "Seasonal marshaling on the plateau sharpens coordination between light skirmishers and armored lancers."
 STATIC_MODIFIER_NAME_oe_wp47_mod_akritai_watchtowers:0 "Akritai Frontier Watchtowers"
 STATIC_MODIFIER_DESC_oe_wp47_mod_akritai_watchtowers:0 "Mountain borderers hold stone passes and ambush raiders before they reach the settled valleys."
 STATIC_MODIFIER_NAME_oe_wp47_mod_dromon_arsenal:0 "Cibyrrhaeot Dromon Arsenals"
 STATIC_MODIFIER_DESC_oe_wp47_mod_dromon_arsenal:0 "Standardized timber yards and oar-wright guilds expand naval construction and sailor recruitment."
 STATIC_MODIFIER_NAME_oe_wp47_mod_imperial_logothete_postal:0 "Dromos Imperial Courier Network"
 STATIC_MODIFIER_DESC_oe_wp47_mod_imperial_logothete_postal:0 "Relays of fresh horses under the Logothete of the Drome carry dispatches swiftly across provinces."
 STATIC_MODIFIER_NAME_oe_wp47_mod_meteora_sanctuary:0 "Sanctuaries of Meteora"
 STATIC_MODIFIER_DESC_oe_wp47_mod_meteora_sanctuary:0 "Imperial endowments fortify cliffside monasteries that shelter pilgrims, scholars, and Thessalian archives."
 oe_wp47_praecepta.1.t:0 "The Taktika of Emperor Leo VI"
 oe_wp47_praecepta.1.d:0 "Senior scribes in the Imperial Chancery have collated forgotten palimpsests and field reports into an updated recension of Emperor Leo VI's Taktika. Laid out before the military council in Constantinople, the treatise reconciles classical Roman camp discipline, combined-arms marches, and frontier counter-raids with the harsh realities of contemporary siegecraft and cavalry warfare. Senior generals and palace logothetes now await our ruling on how widely this doctrine shall bind the themes."
 oe_wp47_praecepta.1.a:0 "Promulgate the Taktika across every imperial command"
 oe_wp47_praecepta.1.b:0 "Emphasize frontier fortification extracts instead"
 oe_wp47_praecepta.1.c:0 "Commission a veteran tactician to lecture the officer corps"
 oe_wp47_praecepta.2.t:0 "Praecepta Militaria of Nikephoros Phokas"
 oe_wp47_praecepta.2.d:0 "Veteran officers returning from the eastern borderlands lay before the throne an illuminated recension of Nikephoros II Phokas's Praecepta Militaria. Its diagrams specify the exact twelve-rank blunted wedge of armored klibanophoroi, flanked by horse archers and anchored by a hollow square of spearmen and javelineers. Re-equipping our field forces to this demanding manual will strain the treasury, yet seasoned commanders swear it can break any rival host."
 oe_wp47_praecepta.2.a:0 "Drill the field tagmata in the Phokan wedge doctrine"
 oe_wp47_praecepta.2.b:0 "Reserve imperial funds and distribute abridged manuals"
 oe_wp47_praecepta.2.c:0 "Elevate an eastern cataphract commander to the palace staff"
 oe_wp47_praecepta.3.t:0 "The Imperial Greek Fire Siphon Foundry"
 oe_wp47_praecepta.3.d:0 "Behind triple-locked doors inside the imperial arsenal at the Golden Horn, master bronze-founders and sworn pyrotechnists have perfected reinforced piston siphons capable of hurling pressurized liquid fire far across choppy water. The formula remains a state secret guarded under pain of treason, yet expanding the workshops would require drawing skilled guildsmen into the palace vaults and testing fresh mixtures along the Bosporus."
 oe_wp47_praecepta.3.a:0 "Expand the secret foundry and arm the dromon fleet"
 oe_wp47_praecepta.3.b:0 "Keep production strictly within the palace guards"
 oe_wp47_praecepta.3.c:0 "Ennoble the chief siphon-engineer to oversee coastal batteries"
 oe_wp47_praecepta.4.t:0 "The Oath of the Varangian Axe-Bearers"
 oe_wp47_praecepta.4.d:0 "Three long-oared transports have berthed along the Golden Horn carrying seasoned Norse, Anglo-Saxon, and Rus axe-bearers seeking enrollment beneath the imperial banners. Standing tall in mail hauberks outside the Chalke Gate, their captain offers the ancient personal oath of fealty sworn upon the palace Gospel—binding their blades solely to the sovereign's person in return for barracks, silver stipends, and honorable standing at court."
 oe_wp47_praecepta.4.a:0 "Swear them into the Imperial Varangian Guard"
 oe_wp47_praecepta.4.b:0 "Assign them as seasoned drillmasters to thematic troops"
 oe_wp47_praecepta.4.c:0 "Appoint their veteran captain as imperial Akolouthos"
 oe_wp47_praecepta.5.t:0 "Restoration of the Via Egnatia"
 oe_wp47_praecepta.5.d:0 "Imperial surveyors returning from Macedonia and Thrace report that centuries of winter torrents and wagon ruts have fractured the ancient basalt paving and stone bridges of the Via Egnatia between Constantinople, Thessalonica, and the Adriatic coast. Rebuilding the highway with imperial engineers will demand heavy stone and treasury silver, yet once restored it will carry both field armies and silk caravans across the Balkans in half the time."
 oe_wp47_praecepta.5.a:0 "Commission imperial stone paving along the Via Egnatia"
 oe_wp47_praecepta.5.b:0 "Grant local merchant guilds toll rights to fund repairs"
 oe_wp47_praecepta.5.c:0 "Pair road repairs with fortified garrison staging posts"
 oe_wp47_praecepta.6.t:0 "Chrysobull of the Holy Mountain (Mount Athos)"
 oe_wp47_praecepta.6.d:0 "Robed envoys from the Protos and twenty sovereign lavras of Mount Athos have crossed the Aegean to Constantinople, carrying ancient wax-sealed charters frayed by time and raids. Kneeling before the throne, they beseech the Emperor to renew the Golden Bull confirming the Holy Mountain's monastic autonomy, coastal watchtowers, and Macedonian estates—a pious act watched closely by Orthodox princes from Serbia to Trebizond."
 oe_wp47_praecepta.6.a:0 "Seal the Golden Bull and endow the Athonite lavras"
 oe_wp47_praecepta.6.b:0 "Confirm spiritual privileges while keeping crown tax oversight"
 oe_wp47_praecepta.6.c:0 "Invite an Athonite scholar-monk to advise the imperial court"
 oe_wp47_praecepta.7.t:0 "Scriptorium of the Monastery of Studion"
 oe_wp47_praecepta.7.d:0 "Inside the venerable Monastery of St. John of Studion near the Golden Gate, master calligraphers trained in the disciplined Studite minuscule hand propose expanding their scriptorium into an imperial chancery archive. Their parchment workshops could systematically recopy Justinianic law codes, military manuals, and diplomatic treaties—preserving Roman governance from decay while spreading luminous learning across the capital's monasteries."
 oe_wp47_praecepta.7.a:0 "Patronize the Studion scriptorium and imperial archives"
 oe_wp47_praecepta.7.b:0 "Channel the monks' work toward parish liturgical books"
 oe_wp47_praecepta.7.c:0 "Recruit the senior Studite master into the Imperial Chancery"
 oe_wp47_praecepta.8.t:0 "Grand Thematic Cavalry Drill"
 oe_wp47_praecepta.8.d:0 "Under autumn banners along the plains of Bithynia and Thrace, cavalry tourmarchai from our provincial themes have gathered three thousand horsemen for seasonal maneuvers. Trumpet signals echo across the valley as light trapezitai scouts execute feigned retreats to draw mock foes onto the leveled lances of armored thematic horsemen. Our presence and patronage could turn this muster into a lasting school of mobile warfare."
 oe_wp47_praecepta.8.a:0 "Reward the top squadrons and institutionalize annual drills"
 oe_wp47_praecepta.8.b:0 "Conclude the muster swiftly to spare rural pastures"
 oe_wp47_praecepta.8.c:0 "Promote the winning tourmarches to imperial field command"
 oe_wp47_praecepta.9.t:0 "Akritai Watchtowers of the Frontier Marches"
 oe_wp47_praecepta.9.d:0 "Hereditary frontier borderers—the proud Akritai who farm and guard the mountain defiles—have sent delegates bearing weathered maps of our marches. They warn that enemy raiders exploit blind valleys where old stone watchtowers have crumbled. A concerted program of masonry grants, iron-shod signal beacons, and tax remissions for border villages would seal the passes and bleed every hostile incursion dry."
 oe_wp47_praecepta.9.a:0 "Fortify the border passes and equip the Akritai garrisons"
 oe_wp47_praecepta.9.b:0 "Grant tax remissions to border villages instead"
 oe_wp47_praecepta.9.c:0 "Commission an Akritai warden to unify frontier defenses"
 oe_wp47_praecepta.10.t:0 "Cibyrrhaeot Dromon Arsenals of the Aegean"
 oe_wp47_praecepta.10.d:0 "Master shipwrights from the maritime themes of the Aegean present scale models of standardized twin-banked dromons before the imperial admiralty. By unifying keel ribs, lateen yards, and seasoned pine depots across our royal dockyards, damaged warships could be refitted within days and fresh squadrons launched at twice the customary pace—challenging both Italian republics and eastern corsairs for mastery of the waves."
 oe_wp47_praecepta.10.a:0 "Fund the standardized imperial dromon slipways"
 oe_wp47_praecepta.10.b:0 "Lease surplus berths to coastal merchant fleets"
 oe_wp47_praecepta.10.c:0 "Appoint a seasoned Aegean admiral to lead the dockyard reform"
 oe_wp47_praecepta.11.t:0 "Logothete of the Drome & the Imperial Post"
 oe_wp47_praecepta.11.d:0 "The Logothete of the Drome—guardian of the imperial highways, couriers, and foreign intelligence—lays a sweeping blueprint before the Senate. By rebuilding relay stables every twenty miles from Thrace through Philippopolis to the Anatolian marches, imperial edicts, frontier warnings, and diplomatic cipher pouches will cross the empire at breakneck speed, binding distant provincial governors tightly to Constantinople."
 oe_wp47_praecepta.11.a:0 "Expand the imperial courier stations and relay stables"
 oe_wp47_praecepta.11.b:0 "Focus the Dromos chancery on foreign court envoys"
 oe_wp47_praecepta.11.c:0 "Elevate a sharp young secretary to modernize imperial ciphers"
 oe_wp47_praecepta.12.t:0 "Sanctuaries of Meteora & Thessalian Monasteries"
 oe_wp47_praecepta.12.d:0 "Atop sheer sandstone spires towering above the fertile plain of Thessaly, ascetic builders at Meteora have raised sky-bound monasteries reached only by rope nets and timber ladders. In turbulent years these cliffside sanctuaries shelter Greek manuscripts, local tax charters, and fleeing villagers alike. Their abbots now petition the Emperor for royal endowments and defensive charters linking spiritual devotion with Thessalian security."
 oe_wp47_praecepta.12.a:0 "Grant an imperial endowment to the Meteora sanctuaries"
 oe_wp47_praecepta.12.b:0 "Pair monastic charters with watchposts guarding the passes"
 oe_wp47_praecepta.12.c:0 "Commission Thessalian relief granaries beside the monasteries"
 oe_wp47_praecepta.13.t:0 "Imperial Field Maneuvers Review"
 oe_wp47_praecepta.13.d:0 "Eight months after our military reforms were promulgated, combined detachments of tagmata cataphracts, thematic archers, and frontier Akritai march onto the plain outside Constantinople for a grand imperial inspection. Banners snap cleanly at each trumpet call, hollow squares close without a faltering shield, and foreign envoys watching from the pavilion whisper that the Roman army of Nikephoros Phokas has risen once more."
 oe_wp47_praecepta.13.a:0 "Reward the regiments with a triumphal silver donative"
 oe_wp47_praecepta.13.b:0 "Dispatch senior instructors to train our subject themes"
 oe_wp47_praecepta.13.c:0 "Lead the final cavalry charge personally to inspire the troops"
 oe_wp47_praecepta.14.t:0 "Straits Siphon & Dromon Fleet Trial"
 oe_wp47_praecepta.14.d:0 "Beneath clear morning skies along the Marmara shore, newly launched dromons from our standardized slipways glide past the sea walls in tight crescent formation. At the admiral's crimson pennant, twin bronze prows unleash roaring arcs of liquid Greek fire onto anchored hulk targets, turning timber to blazing ash in seconds. Merchants and ambassadors lining the quays recognize that the Straits remain firmly in Roman hands."
 oe_wp47_praecepta.14.a:0 "Double naval patrols across the Aegean and Black Sea"
 oe_wp47_praecepta.14.b:0 "Open select dockyard yards to boost coastal commerce"
 oe_wp47_praecepta.14.c:0 "Honor the admiralty and shipwright guilds at the Great Palace"
 oe_wp47_praecepta.15.t:0 "Grand Inspection of the Imperial Highway & Post"
 oe_wp47_praecepta.15.d:0 "Fresh marble milestones gleam along the Via Egnatia and Balkan post roads as the first full season of upgraded imperial couriers concludes. Tax wagons roll smoothly into Thessalonica and Constantinople without bandit losses, while urgent sealed dispatches from distant marches now reach the Great Palace days ahead of former schedules. Provincial governors report rising trade dues and sharper obedience to imperial decrees."
 oe_wp47_praecepta.15.a:0 "Reinvest fresh road tolls into provincial market towns"
 oe_wp47_praecepta.15.b:0 "Channel the customs surplus straight into the imperial fisc"
 oe_wp47_praecepta.15.c:0 "Standardize imperial weights and road charters across themes"
 oe_wp47_praecepta.16.t:0 "Concord of Sanctuary, Scriptorium & Throne"
 oe_wp47_praecepta.16.d:0 "From the cliffside cells of Meteora and the ancient lavras of Mount Athos to the quiet scriptorium of Studion and the Varangian barracks beside the palace, imperial patronage has borne rich fruit. Newly illuminated legal codices grace the Senate hall, prayers for the reigning sovereign resound across every Orthodox diocese, and sworn retainers stand firm behind the throne—reminding all Christendom of New Rome's enduring majesty."
 oe_wp47_praecepta.16.a:0 "Proclaim a solemn Te Deum in Hagia Sophia"
 oe_wp47_praecepta.16.b:0 "Distribute copied law codes across every provincial court"
 oe_wp47_praecepta.16.c:0 "Endow a permanent palace circle of jurists and scholars"
