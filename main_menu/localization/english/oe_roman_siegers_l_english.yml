 oe_hetaireia_imperial_artillery: "Imperial Artillery System"
 oe_hetaireia_imperial_artillery_desc: "Unify the foundries, arsenals and artillery schools under imperial regulations. Common drill and clear engineering command bring the firepower of the empire to bear in every siege.\n\nRoman Besiegers additionally gain #G +0.1#! bombard efficiency, #G +10%#! strength damage dealt and #G +1#! initiative."
 OE_ROMAN_SIEGERS_UPGRADE_TT: "Upgrade existing Roman Besiegers to the Imperial Artillery System, retaining their current era."
 OE_ROMAN_SIEGERS_DOWNGRADE_TT: "Revert existing Roman Besiegers to their ordinary form, removing the additional bonuses from this privilege."
 OE_ORTHODOX_DEFENDER_BARRACKS: "Moesian and Triballian Barracks"
 OE_ORTHODOX_DEFENDER_CAP_TT: "The total number of Orthodox Defender Cavalry is below the number of Hetaireia Barracks in Moesian and Triballian locations. All eras share this limit."
