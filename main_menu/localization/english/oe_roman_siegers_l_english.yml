l_english:
 oe_roman_sieger_3_normal: "Roman Besiegers"
 oe_roman_sieger_3_normal_desc: "The imperial besiegers make a disciplined craft of surveying walls, preparing batteries and sustaining bombardment. Engineers calculate fields of fire, gunners measure their charges, and supply trains bring powder and shot until the fortress opens its gates to the emperor.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Siege Artillery#! (full chain: Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
