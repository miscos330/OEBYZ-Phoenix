 oe_orthodox_defender_1: "Orthodox Defender Cavalry"
 oe_orthodox_defender_1_desc: "The warriors of Bulgarian and Serbian descent inherit generations of skill in scouting and cavalry action on the flanks. The barracks of Moesia and Triballia now equip them with heavy armour, turning their courage and loyalty into a dependable shield for the imperial battle line. They muster beneath icons and standards, holding firm against the enemy.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Professional Armies#! (full chain: Professional Armies -> Pike and Shot -> Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
