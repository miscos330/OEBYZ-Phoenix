 oe_roman_sieger_3_imperial: "Roman Besiegers (Imperial System)"
 oe_roman_sieger_3_imperial_desc: "The imperial besiegers make a disciplined craft of surveying walls, preparing batteries and sustaining bombardment. Engineers calculate fields of fire, gunners measure their charges, and supply trains bring powder and shot until the fortress opens its gates to the emperor. A unified artillery system coordinates foundries, training and siege command, allowing the batteries to concentrate their fire without delay.\n\n#Y Era Upgrade Path:#! Next tier unlocks automatically via the vanilla military advance #Y Siege Artillery#! (full chain: Siege Artillery -> Military Revolution -> Levée en Masse); upgrade directly in the army panel once researched."
