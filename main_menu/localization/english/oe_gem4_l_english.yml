# NEW 2026-11-23 v19.5 Regional Gems — Module 19.5-D: Morocco & Tibet Units, Decisions, Events, Modifiers & Mission Trees #54-#55 (english) (oe_gem4_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_mor_tib.py; edit the generator, not this file.
 oe_gem4_mor_black_guard:0 "Moroccan Black Guard (Abid al-Bukhari)"
 oe_gem4_mor_black_guard_desc:0 "Disciplined standing heavy infantry sworn directly to the Moroccan Sultan upon Sahih al-Bukhari, pairing pike-and-shot volley fire with unyielding royal loyalty across desert forts and coastal bastions."
 oe_gem4_tib_plateau_cataphracts:0 "Snowland Plateau Cataphracts"
 oe_gem4_tib_plateau_cataphracts_desc:0 "Lamellar-armored Tibetan heavy cavalry mounted on hardy high-altitude plateau chargers, trained to smash enemy columns across thin-air Himalayan passes and windswept alpine basins."
 oe_gem4_dec_sijilmasa_caravan_charter.title:0 "Grant the Sijilmasa Trans-Saharan Caravan Charter"
 oe_gem4_dec_sijilmasa_caravan_charter.desc:0 "Charter royal caravan syndicates linking Fez and Marrakesh across the High Atlas passes to Sijilmasa and the Taghaza salt mines, exchanging Saharan salt and Maghreb textiles for West African gold dust under crown protection."
 oe_gem4_dec_sijilmasa_caravan_charter.a:0 "Seal the Royal Gold & Salt Charter"
 oe_gem4_dec_tea_horse_accord.title:0 "Proclaim the Imperial Tea-Horse Road Monastic Charter"
 oe_gem4_dec_tea_horse_accord.desc:0 "Unite the great monasteries, highland horse-breeders, and caravan headmen along the Chama Gudao passes under a shared exchange charter, guaranteeing steady brick-tea supplies for plateau households and royal remounts for Snowland cavalry."
 oe_gem4_dec_tea_horse_accord.a:0 "Proclaim the Tea-Horse Exchange Charter"
 STATIC_MODIFIER_NAME_oe_gem4_mod_dec_sijilmasa_charter:0 "Sijilmasa Royal Gold & Salt Charter"
 STATIC_MODIFIER_DESC_oe_gem4_mod_dec_sijilmasa_charter:0 "Armed desert escorts, uniform Atlas weigh-houses, and royal mint contracts draw West African gold dust straight into Moroccan coffers."
 STATIC_MODIFIER_NAME_oe_gem4_mod_dec_tea_horse_accord:0 "Imperial Tea-Horse Road Monastic Accord"
 STATIC_MODIFIER_DESC_oe_gem4_mod_dec_tea_horse_accord:0 "Regulated monastic relay stations along the eastern passes exchange sturdy plateau mounts and highland wool for steady shipments of brick tea and silver."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev1_a:0 "Fez Madrasa Golden Scholarship"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev1_a:0 "Renowned jurists, astronomers, and geographers flock to Fez, making our court a luminous beacon of the Islamic West."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev1_b:0 "Chancery Geographical Compendium"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev1_b:0 "Detailed itineraries of Eastern markets, ports, and diplomatic courts sharpen Moroccan merchant syndicates and envoys."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev2_a:0 "Bastions of the Strait"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev2_a:0 "Layered sea-walls, coastal beacon towers, and devoted frontier garrisons turn every northern harbor into a fortress."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev2_b:0 "Maghreb Strait Corsair Watch"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev2_b:0 "Nimble oared galleys and lateen raiders harass hostile convoys and project sovereign Moroccan power across the strait."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev3_a:0 "Maghreb Vanguard Campaigns"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev3_a:0 "Hardened Atlas cavalry and siege detachments march swiftly along the Taza corridor to assert Moroccan primacy."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev3_b:0 "Eastern Frontier Caravan Accord"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev3_b:0 "Shared wool, leather, and carpet fairs stabilize our eastern borderlands and keep tribal allies loyal to the throne."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev4_a:0 "Sous Valley Royal Sugar Monopoly"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev4_a:0 "Irrigated cane plantations and royal sugar refineries flood Atlantic ports with lucrative export bullion."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev4_b:0 "Sugar-for-Gunpowder Arsenals"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev4_b:0 "Foreign merchant ships unload barrels of gunpowder, cast bronze ordnance, and arquebuses straight into Agadir's magazines."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev5_a:0 "Wadi al-Makhazin Gunpowder Doctrine"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev5_a:0 "Battle-tested fire discipline, entrenched artillery lines, and swift flanking horsemen forge a premier early-modern army."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev5_b:0 "Triumph of the Three Kings"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev5_b:0 "Envoys from England, France, and the Porte hasten to court our sovereign while noble ransoms swell the treasury."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev6_a:0 "Splendor of El Badi Palace"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev6_a:0 "Monumental Sharifian architecture proclaims an unassailable golden age of imperial majesty and artistic genius."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev6_b:0 "Makhzen Golden Chancery"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev6_b:0 "Centralized tax rolls, trusted gold dinars, and loyal cabinet secretaries bind every province securely to the crown."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev7_a:0 "Lords of the Saharan Crossing"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev7_a:0 "Desert-hardened musketeers and camel supply trains extend Moroccan power all the way to the golden Niger Bend."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev7_b:0 "Golden Trans-Saharan Caravan Web"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev7_b:0 "Protected oasis wells and regulated bullion convoys turn trans-Saharan commerce into a peaceful river of gold."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev8_a:0 "Abid al-Bukhari Imperial Guard"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev8_a:0 "Year-round salaried training and absolute loyalty to the crown forge Morocco's fiercest standing heavy infantry."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev8_b:0 "Imperial Kasbah & Granary Network"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev8_b:0 "Interlocking garrison kasbahs and vast royal grain vaults guarantee central crown authority through famine and war."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev9_a:0 "Phagmodrupa Dzong Administration"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev9_a:0 "Appointed dzongpon governors and cliffside stone citadels knit mountain valleys into a cohesive, resilient polity."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev9_b:0 "Sakya Monastic-Noble Concord"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev9_b:0 "Honoring venerable monastic lineages preserves deep scholarly archives and secures steady cooperation from highland lords."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev10_a:0 "Chama Gudao Relay Network"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev10_a:0 "Maintained stone trails, suspension bridges, and monastic rest-houses multiply caravan throughput across eastern Tibet."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev10_b:0 "Snowland Royal Remount Pastures"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev10_b:0 "Selective breeding across high alpine meadows yields tireless warhorses immune to thin air and bitter frost."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev11_a:0 "Gelug Monastic Discipline"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev11_a:0 "Renewed monastic integrity and grand Lhasa assemblies inspire profound devotion and intellectual rigor throughout the plateau."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev11_b:0 "Snowland Ecumenical Accord"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev11_b:0 "Balanced royal patronage among Gelug, Sakya, Kagyu, and Nyingma monasteries averts sectarian strife across every valley."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev12_a:0 "Three Great Academies & Tashilhunpo"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev12_a:0 "Carved birchwood blocks print Tibetan astronomy, medicine, and philosophy for monasteries from Ladakh to the Mongol steppe."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev12_b:0 "U-Tsang Highland Barley Granaries"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev12_b:0 "Snowmelt canals and communal barley storehouses shield highland communities from harsh frosts and sustain larger armies."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev13_a:0 "Himalayan Salt Exchange Monopoly"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev13_a:0 "Regulated border fairs along Mustang, Kyirong, and Phari turn northern lake salt into dependable grain and silver."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev13_b:0 "Highland Wool & Pack-Train Guilds"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev13_b:0 "Warm highland woolens and seasoned mountain pack-drivers slash winter supply losses across the bleakest passes."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev14_a:0 "Guge Western Sanctuary Renaissance"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev14_a:0 "Radiant western murals, bronze castings, and translated treatises link western Tibet with Kashmiri and Indian scholarship."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev14_b:0 "Ngari Cliff Bastions & Gold Mints"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev14_b:0 "Cliffside watchtowers and escorted river-gold shipments make our western frontier both prosperous and unbreachable."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev15_a:0 "Cho-Yon Continental Prestige"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev15_a:0 "Revered Tibetan envoys enjoy rare honor at courts from Mongolia to Beijing and Nepal, multiplying diplomatic reach."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev15_b:0 "Steppe-Plateau Heavy Cavalry Pact"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev15_b:0 "Fusing Mongol steppe horsemanship with Tibetan lamellar armor creates a devastating highland strike force."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev16_a:0 "Potala Citadel of Marpo Ri"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev16_a:0 "Soaring above the clouds as both palace and impenetrable fortress, the Potala inspires awe across all of Asia."
 STATIC_MODIFIER_NAME_oe_gem4_mod_ev16_b:0 "Ganden Phodrang Sovereign Cabinet"
 STATIC_MODIFIER_DESC_oe_gem4_mod_ev16_b:0 "A disciplined council of monastic and lay ministers harmonizes taxation, justice, and frontier defense across the plateau."
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m1:0 "Three Kings Gunpowder & Strait Shield"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m1:0 "Disciplined Andalusian-Moroccan arquebusiers, Black Guard infantry, and fortified Strait bastions repel every overseas crusade."
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m2:0 "Unified Sovereign of the Maghreb"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m2:0 "From the Atlantic surf to Tlemcen, Kairouan, and Tunis, the entire Maghreb answers one sovereign standard."
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m3:0 "El Badi Golden Court & Sous Prosperity"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m3:0 "Marrakesh's gilded courts, Fez's madrasas, and Sous cane refineries turn Morocco into a magnet of wealth and culture."
 STATIC_MODIFIER_NAME_oe_gem4_msn_mor_m4:0 "Sheriffian Empire of the Far West Eternal"
 STATIC_MODIFIER_DESC_oe_gem4_msn_mor_m4:0 "Commanding the Strait, the united Maghreb, and the Saharan gold roads beneath invincible armies crowns Morocco forever."
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m1:0 "Snowland Cataphracts & Alpine Dzongs"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m1:0 "Lamellar-clad plateau heavy horsemen and cliffside stone dzongs render every Tibetan pass impregnable."
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m2:0 "United Three Provinces of the Snowlands"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m2:0 "U-Tsang, Ngari, Kham, and Amdo stand united under one Snowland banner, commanding every highland pass and pasture."
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m3:0 "Potala Court & Gelug Academy Radiance"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m3:0 "Monastic universities, woodblock presses, and Patron-Priest diplomacy project Tibetan learning across Inner Asia."
 STATIC_MODIFIER_NAME_oe_gem4_msn_tib_m4:0 "Roof of the World: Sovereign Mandala Eternal"
 STATIC_MODIFIER_DESC_oe_gem4_msn_tib_m4:0 "Standing unified across Lhasa, Shigatse, Toling, and Chamdo beneath Potala's golden roofs crowns an immortal highland realm."
 oe_gem4.1.title:0 "Al-Qarawiyyin Scholars & Ibn Battuta's Return"
 oe_gem4.1.desc:0 "After nearly three decades traversing Egypt, India, Java, and Great Yuan China, the renowned traveler Ibn Battuta has returned home to Fez, where Marinid scholars gather inside the carved cedar courtyards of Al-Qarawiyyin and the Bou Inania Madrasa to transcribe his Rihla and chart the wider world."
 oe_gem4.1.a:0 "Endow Al-Qarawiyyin & Compile the Great Rihla"
 oe_gem4.1.b:0 "Turn World Reports into Royal Trade & Maritime Charts"
 oe_gem4.2.title:0 "Defense of Ceuta & Tangier Across the Strait"
 oe_gem4.2.desc:0 "Armed caravels and crusading squadrons gather across the narrow waters of the Strait of Gibraltar, eyeing the strategic harbors of Ceuta, Tangier, and Tetouan. Coastal governors warn that holding the southern Pillar of Hercules demands either formidable stone bastions or a relentless corsair fleet."
 oe_gem4.2.a:0 "Fortify Ceuta, Tangier & Coastal Ghazi Garrisons"
 oe_gem4.2.b:0 "Commission Swift Strait Xebecs & Corsair Squadrons"
 oe_gem4.3.title:0 "Marinid-Zayyanid Struggle for the Maghreb"
 oe_gem4.3.desc:0 "Along the fertile corridor stretching from Oujda to Tlemcen and onward toward Tunis, rival Maghreb dynasties contest control of caravan customs, Berber tribal alliances, and leadership of the western Islamic world. Our viziers debate marching east in force or binding the border tribes through trade."
 oe_gem4.3.a:0 "Press the Moroccan Banner Eastward Toward Tlemcen"
 oe_gem4.3.b:0 "Bind Frontier Tribes via Maghreb Caravan Accords"
 oe_gem4.4.title:0 "Saadian Rise & the Sous Valley Sugar Boom"
 oe_gem4.4.desc:0 "In the sunlit valleys of Sous around Taroudant and Agadir, stone aqueducts now drive dozens of water-powered cane-sugar mills whose crystalline loaves fetch princely sums from London to Antwerp. Sharifian commanders propose trading pure Moroccan sugar directly for bronze cannon and matchlocks."
 oe_gem4.4.a:0 "Expand Royal Sous Sugar Refineries & Export Customs"
 oe_gem4.4.b:0 "Barter Refined Sugar Directly for Muskets & Cannon"
 oe_gem4.5.title:0 "Battle of the Three Kings at Wadi al-Makhazin"
 oe_gem4.5.desc:0 "On the sun-baked plain near Ksar el-Kebir, a massive European expeditionary host has collided with our Moroccan banners. Disciplined Andalusian arquebusiers, royal bronze batteries, and enveloping Berber cavalry encircle and shatter the invaders in a thunderous victory that echoes from Lisbon to Istanbul."
 oe_gem4.5.a:0 "Codify Royal Matchlock & Combined-Arms Doctrine"
 oe_gem4.5.b:0 "Leverage Victory Ransom & Diplomatic Prestige Worldwide"
 oe_gem4.6.title:0 "Ahmad al-Mansur's Golden Palace (El Badi)"
 oe_gem4.6.desc:0 "Flush with victory gold and Saharan tribute, the sovereign raises the incomparable El Badi Palace in Marrakesh: sunken orange groves, shimmering reflecting pools, Italian Carrara marble columns traded weight-for-weight in Moroccan sugar, and ceilings gleaming with gold leaf."
 oe_gem4.6.a:0 "Complete the Marble & Gold-Leaf Courts of El Badi"
 oe_gem4.6.b:0 "Anchor Palace Splendor with Royal Mint & Makhzen Reform"
 oe_gem4.7.title:0 "Trans-Saharan Expedition & Gold of the Niger"
 oe_gem4.7.desc:0 "Armed with light bronze culverins, matchlocks, and thousands of water-bearing camels, an elite column prepares to cross the unforgiving Tanezrouft dunes past Taghaza's salt pans toward Timbuktu and Gao. Counselors weigh direct military dominion against permanent Saharan merchant leagues."
 oe_gem4.7.a:0 "Launch the Gunpowder Column to Taghaza & Timbuktu"
 oe_gem4.7.b:0 "Charter Permanent Desert Caravanserais & Gold Guilds"
 oe_gem4.8.title:0 "The Black Guard of Meknes & Imperial Consolidation"
 oe_gem4.8.desc:0 "Rising behind monumental vaulted granaries, vast royal stables, and forty kilometers of rammed-earth ramparts in Meknes, a new standing imperial army — the Abid al-Bukhari, or Black Guard — swears direct fealty to the Sultan alone, ending regional factionalism and shielding Morocco's ports."
 oe_gem4.8.a:0 "Drill the Standing Abid al-Bukhari Royal Guard"
 oe_gem4.8.b:0 "Build the Kasbah Network & Royal Granaries of Meknes"
 oe_gem4.9.title:0 "Sakya Regency & the Phagmodrupa Transition"
 oe_gem4.9.desc:0 "As distant imperial patronage weakens beyond the eastern mountains, energetic Snowland lords led by the Phagmodrupa propose replacing fragmented myriarchies with centralized stone dzong fortresses, uniform native law codes, and renewed royal dignity across U and Tsang."
 oe_gem4.9.a:0 "Institute the Dzong Fortress System & Native Tibetan Law"
 oe_gem4.9.b:0 "Preserve the Sakya Monastic-Noble Consensus"
 oe_gem4.10.title:0 "Tea-Horse Caravans of the Eastern Passes"
 oe_gem4.10.desc:0 "Over dizzying rope bridges and snow-bound switchbacks linking Chamdo, Litang, and Batang to the Sichuan and Yunnan valleys, endless yak and mule trains carry prized highland horses and musk eastward in return for compressed brick tea indispensable to life on the Roof of the World."
 oe_gem4.10.a:0 "Charter Guarded Tea-Horse Relay Stations & Customs"
 oe_gem4.10.b:0 "Reserve the Finest Highland Remounts for Crown Cavalry"
 oe_gem4.11.title:0 "Tsongkhapa's Great Monastic Reform"
 oe_gem4.11.desc:0 "Inside Lhasa's ancient Jokhang Temple, the great scholar-reformer Je Tsongkhapa inaugurates the Monlam Great Prayer Festival and founds Ganden Monastery on a sunlit ridge above the Kyichu Valley, reviving rigorous monastic vows, logical debate, and spiritual discipline across Tibet."
 oe_gem4.11.a:0 "Patronize the Great Prayer Festival & Gelug Reform"
 oe_gem4.11.b:0 "Foster Ecumenical Harmony Across All Snowland Schools"
 oe_gem4.12.title:0 "Monastic Universities of Lhasa & Shigatse"
 oe_gem4.12.desc:0 "Towering whitewashed complexes at Drepung, Sera, and Tashilhunpo now house thousands of scholar-monks, woodblock sutra presses, medical colleges, and mountain granaries. Their abbots invite the throne to invest in either scholarly printing houses or terraced valley irrigation."
 oe_gem4.12.a:0 "Expand Woodblock Printing Presses & Monastic Academies"
 oe_gem4.12.b:0 "Link Monastic Granaries to U-Tsang Barley Terraces"
 oe_gem4.13.title:0 "Himalayan Salt Lakes & Yak-Wool Guilds"
 oe_gem4.13.desc:0 "Each spring, nomadic drokpa herders harvest gleaming white crystal salt from Changtang's alpine lakes and shear soft under-fleece from highland herds, leading caravans across steep Himalayan passes to exchange salt and pashmina wool for Nepalese copper, Kashmiri cloth, and lowland grain."
 oe_gem4.13.a:0 "Standardize Trans-Himalayan Salt-for-Grain Markets"
 oe_gem4.13.b:0 "Organize Nomadic Yak-Wool & High-Pass Logistics Guilds"
 oe_gem4.14.title:0 "Guge & the Western Himalayan Sanctuary"
 oe_gem4.14.desc:0 "Carved into ochre clay cliffs above the Sutlej gorge at Toling and Tsaparang, the western sanctuaries of Guge guard ancient gold-panning streams, Kashmiri trade trails, and luminous fresco halls blending Tibetan, Kashmiri, and Indian artistry at the western roof of the plateau."
 oe_gem4.14.a:0 "Patronize Toling & Tsaparang Sanctuary Art & Letters"
 oe_gem4.14.b:0 "Fortify Western Himalayan Passes & Ngari Gold Convoys"
 oe_gem4.15.title:0 "Patron-Priest Envoy to the Steppe & China"
 oe_gem4.15.desc:0 "Across the northern steppes and imperial courts to the east, Mongol khans and emperors alike send rich silk gifts seeking spiritual preceptors from Tibet under the honored Cho-Yon (Patron-Priest) bond. Wise diplomacy can turn Snowland spiritual authority into continental alliances and steppe cavalry support."
 oe_gem4.15.a:0 "Seal the Continental Patron-Priest Diplomatic Compact"
 oe_gem4.15.b:0 "Welcome Allied Steppe Riders into the Snowland Banner"
 oe_gem4.16.title:0 "Potala Palace: Crown of the Snowlands"
 oe_gem4.16.desc:0 "High atop Marpo Ri overlooking Lhasa, masons, painters, and master carpenters from every Tibetan province raise the soaring White and Red Palaces of the Potala — thirteen stories of stone ramparts, gilded roofs, and council halls uniting temporal statecraft and spiritual majesty atop the Roof of the World."
 oe_gem4.16.a:0 "Raise the White & Red Palaces of the Potala Citadel"
 oe_gem4.16.b:0 "Codify the Ganden Phodrang Snowland Cabinet"
 oe_msn_mor_destiny:0 "#bold #color_yellow Morocco: Sheriffian Empire of the Far West#!#!"
 oe_msn_mor_destiny_DESCRIPTION:0 "From Al-Qarawiyyin and the Strait Bastions to Maghreb Unification, Sous Sugar Gunpowder, Timbuktu Gold, and the Sheriffian Empire of the Far West"
 oe_msn_mor_destiny_CRITERIA_DESCRIPTION:0 "Anchor Fez and Marrakesh, fortify Ceuta, Tangier, and Salé against maritime rivals, unite the Maghreb from Tlemcen to Tunis, master Sijilmasa and the Saharan gold trail to Timbuktu, and crown a sovereign Sheriffian gunpowder empire."
 oe_msn_mor_destiny_BUTTON_TOOLTIP:0 "Embark on the Moroccan Sheriffian Destiny"
 oe_msn_mor_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Morocco and Fez: fortify the Strait of Gibraltar, drill modern Three Kings gunpowder lines and Salé corsairs; unite Atlas strongholds, Sijilmasa, Tlemcen, Tunis, and Timbuktu; and finance El Badi's golden age through Sous sugar refineries and trans-Saharan dinar mints."
 oe_msn_mor_01_qarawiyyin_fez:0 "Al-Qarawiyyin & Madrasas of Fez"
 oe_msn_mor_01_qarawiyyin_fez_desc:0 "Anchor sovereign legitimacy in Fez, endowing Al-Qarawiyyin and the Marinid madrasas to illuminate the western Islamic world."
 oe_msn_mor_01_qarawiyyin_fez_req_tt:0 "Control Fez (directly or via subject) and have at least 5 Stability."
 oe_msn_mor_02_strait_bastions:0 "Strait of Gibraltar: Ceuta & Tangier Bastions"
 oe_msn_mor_02_strait_bastions_desc:0 "Lock the southern shore of the Strait by fortifying the twin maritime gateways of Ceuta and Tangier."
 oe_msn_mor_02_strait_bastions_req_tt:0 "Control both Ceuta and Tangier (directly or via subject) with at least 8 Stability."
 oe_msn_mor_03_three_kings_arsenal:0 "Battle of the Three Kings & Gunpowder Line"
 oe_msn_mor_03_three_kings_arsenal_desc:0 "Drill disciplined pike-and-shot infantry and royal bronze batteries across Ksar el-Kebir and Marrakesh to shatter any invader."
 oe_msn_mor_03_three_kings_arsenal_req_tt:0 "Control Ksar el-Kebir and Marrakesh (directly or via subject) with at least 12 Stability in the Age of Discovery or later."
 oe_msn_mor_04_atlantic_corsairs:0 "Salé & Atlantic Corsair Defense"
 oe_msn_mor_04_atlantic_corsairs_desc:0 "Turn the twin river-mouth harbors of Salé and Rabat into a formidable ocean-going admiralty defending Morocco's Atlantic coast."
 oe_msn_mor_04_atlantic_corsairs_req_tt:0 "Control Salé and Rabat (directly or via subject), own a port, and hold at least 260 Gold in the Age of Reformation or later."
 oe_msn_mor_05_atlas_sijilmasa:0 "Atlas & Sijilmasa Trans-Saharan Gold Road"
 oe_msn_mor_05_atlas_sijilmasa_desc:0 "Bring Marrakesh and the desert caravan terminus of Sijilmasa under one royal customs house to command the northern Sahara."
 oe_msn_mor_05_atlas_sijilmasa_req_tt:0 "Control both Marrakesh and Sijilmasa (directly or via subject)."
 oe_msn_mor_06_tlemcen_maghreb:0 "March on Tlemcen & the Central Maghreb"
 oe_msn_mor_06_tlemcen_maghreb_desc:0 "Extend Moroccan banners eastward through Tlemcen and the coastal ports of Oran or Algiers to unify the central Maghreb."
 oe_msn_mor_06_tlemcen_maghreb_req_tt:0 "Control Tlemcen and either Oran or Algiers (directly or via subject)."
 oe_msn_mor_07_tunis_ifriqiya:0 "Unify the Maghreb to Tunis & Kairouan"
 oe_msn_mor_07_tunis_ifriqiya_desc:0 "Bring historic Kairouan and the great Mediterranean port of Tunis under our banner, uniting the entire Maghreb once more."
 oe_msn_mor_07_tunis_ifriqiya_req_tt:0 "Control Tunis and Kairouan (directly or via subject) and hold at least 65 Locations directly or via subjects."
 oe_msn_mor_08_timbuktu_expedition:0 "Expedition Across the Sahara to Timbuktu"
 oe_msn_mor_08_timbuktu_expedition_desc:0 "Cross the Saharan salt pans of Taghaza to secure Timbuktu or Gao on the Niger Bend, binding West African gold to Morocco."
 oe_msn_mor_08_timbuktu_expedition_req_tt:0 "Control Taghaza and either Timbuktu or Gao (directly or via subject) in the Age of Discovery or later."
 oe_msn_mor_09_sous_sugar_arsenals:0 "Saadian Sugar Mills & Sous Arsenals"
 oe_msn_mor_09_sous_sugar_arsenals_desc:0 "Harness the fertile Sous Valley at Taroudant and Agadir to build royal sugar refineries that bankroll modern arms."
 oe_msn_mor_09_sous_sugar_arsenals_req_tt:0 "Control Taroudant and Agadir (directly or via subject) and hold at least 200 Gold."
 oe_msn_mor_10_gold_caravan_mints:0 "Trans-Saharan Gold Mints & Dinar Standard"
 oe_msn_mor_10_gold_caravan_mints_desc:0 "Strike high-purity Moroccan gold dinars from Sijilmasa bullion so merchants across Mediterranean and Atlantic ports honor our coin."
 oe_msn_mor_10_gold_caravan_mints_req_tt:0 "Control Sijilmasa (directly or via subject) and hold at least 280 Gold in the Age of Renaissance or later."
 oe_msn_mor_11_el_badi_golden_court:0 "El Badi Golden Palace & Meknes Imperial Court"
 oe_msn_mor_11_el_badi_golden_court_desc:0 "Crown Marrakesh and Meknes with soaring marble courts, royal libraries, and imperial granaries worthy of a world power."
 oe_msn_mor_11_el_badi_golden_court_req_tt:0 "Control Marrakesh and Meknes (directly or via subject) with at least 15 Stability in the Age of Reformation or later."
 oe_msn_mor_12_sheriffian_empire_far_west:0 "Sheriffian Empire of the Far West"
 oe_msn_mor_12_sheriffian_empire_far_west_desc:0 "Uniting Fez, Marrakesh, Tlemcen, and Sijilmasa behind invincible armies, ocean fleets, and golden commerce fulfills Morocco's supreme destiny."
 oe_msn_mor_12_sheriffian_empire_far_west_req_tt:0 "Control Fez, Marrakesh, Tlemcen, and Sijilmasa (directly or via subject) with at least 18 Stability in the Age of Absolutism or later."
 oe_msn_tib_destiny:0 "#bold #color_yellow Tibet: Sovereign Mandala of the Roof of the World#!#!"
 oe_msn_tib_destiny_DESCRIPTION:0 "From Sakya, Lhasa, and Guge Salt Passes to Tea-Horse Caravans, Gelug Academies, Plateau Cataphracts, and the Potala Sovereign Mandala"
 oe_msn_tib_destiny_CRITERIA_DESCRIPTION:0 "Unite U-Tsang, Ngari-Guge, Kham, and Amdo under one sovereign Snowland seat, raise invincible Plateau Cataphracts and highland dzongs, command the Tea-Horse Road and Himalayan salt trade, and crown the Potala Mandala."
 oe_msn_tib_destiny_BUTTON_TOOLTIP:0 "Embark on the Roof of the World Destiny"
 oe_msn_tib_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Tibet and Guge: fortify Yarlung and Gyantse dzongs and drill Snowland Plateau Cataphracts; unite Lhasa, Shigatse, Sakya, Toling, Chamdo, and Amdo; and weave Tea-Horse Road caravans, Gelug monastic universities, and Potala Patron-Priest diplomacy into an unconquered highland empire."
 oe_msn_tib_01_sakya_lhasa_seat:0 "Sakya-to-Lhasa Monastic Seat & Jokhang"
 oe_msn_tib_01_sakya_lhasa_seat_desc:0 "Anchor sovereign authority at Sakya, Lhasa's Jokhang, or Toling to begin the renewal of the Snowlands."
 oe_msn_tib_01_sakya_lhasa_seat_req_tt:0 "Control Sakya, Lhasa, or Toling (directly or via subject) and have at least 5 Stability."
 oe_msn_tib_02_yarlung_dzongs:0 "Yarlung & Gyantse Highland Dzongs"
 oe_msn_tib_02_yarlung_dzongs_desc:0 "Fortify the strategic cliffside dzongs of Nedong and Gyantse to guard the ancestral valleys of U and Tsang."
 oe_msn_tib_02_yarlung_dzongs_req_tt:0 "Control Gyantse and Nedong (directly or via subject) with at least 8 Stability."
 oe_msn_tib_03_plateau_cataphracts:0 "Drill the Snowland Plateau Cataphracts"
 oe_msn_tib_03_plateau_cataphracts_desc:0 "Equip noble highland retainers with lamellar barding and hardy plateau steeds to dominate mountain warfare."
 oe_msn_tib_03_plateau_cataphracts_req_tt:0 "Hold at least 200 Gold with at least 12 Stability in the Age of Renaissance or later."
 oe_msn_tib_04_potala_citadel_watch:0 "Potala Citadel & High-Pass Bastions"
 oe_msn_tib_04_potala_citadel_watch_desc:0 "Crown Lhasa's Marpo Ri citadel while sealing southern Himalayan gateways at Phari against lowland incursions."
 oe_msn_tib_04_potala_citadel_watch_req_tt:0 "Control Lhasa and Phari (directly or via subject) with at least 15 Stability in the Age of Reformation or later."
 oe_msn_tib_05_utsang_grain_terraces:0 "U-Tsang & Shigatse Plateau Grain Terraces"
 oe_msn_tib_05_utsang_grain_terraces_desc:0 "Unite Lhasa, Shigatse, and Sakya across the Yarlung Tsangpo valley to expand terraced barley farming and royal granaries."
 oe_msn_tib_05_utsang_grain_terraces_req_tt:0 "Control Lhasa, Shigatse, and Sakya (directly or via subject)."
 oe_msn_tib_06_guge_salt_passes:0 "Guge & Western Himalayan Salt Passes"
 oe_msn_tib_06_guge_salt_passes_desc:0 "Secure Toling together with Purang or Leh, binding the western Himalayan salt lakes and Kashmir trade passes to our throne."
 oe_msn_tib_06_guge_salt_passes_req_tt:0 "Control Toling and either Purang or Leh (directly or via subject)."
 oe_msn_tib_07_kham_tea_horse_passes:0 "Kham & Eastern Tea-Horse Passes"
 oe_msn_tib_07_kham_tea_horse_passes_desc:0 "Control Chamdo alongside Batang, Litang, or Dartsedo to command the eastern river gorges of Kham."
 oe_msn_tib_07_kham_tea_horse_passes_req_tt:0 "Control Chamdo and at least one of Batang, Litang, or Dartsedo (directly or via subject)."
 oe_msn_tib_08_amdo_three_provinces:0 "Amdo Pastures & Unity of the Three Provinces"
 oe_msn_tib_08_amdo_three_provinces_desc:0 "Bring Chabcha and the high pastures of Jyekundo or Nangchen under our banner, uniting U-Tsang, Kham, and Amdo."
 oe_msn_tib_08_amdo_three_provinces_req_tt:0 "Control Chabcha, control Jyekundo or Nangchen, and hold at least 45 Locations (directly or via subjects) in the Age of Discovery or later."
 oe_msn_tib_09_chama_gudao_corridor:0 "Tea-Horse Road (Chama Gudao) Trade Corridor"
 oe_msn_tib_09_chama_gudao_corridor_desc:0 "Invest in mountain waystations, yak caravans, and trade charters linking Sichuan brick tea to every Tibetan market."
 oe_msn_tib_09_chama_gudao_corridor_req_tt:0 "Hold at least 200 Gold and control Lhasa, Chamdo, or Toling (directly or via subject)."
 oe_msn_tib_10_gelug_three_academies:0 "Gelug Reform & Monastic Academies (Sera, Drepung, Ganden)"
 oe_msn_tib_10_gelug_three_academies_desc:0 "Support the great monastic academies of Ganden, Drepung, and Sera so Lhasa shines as Inner Asia's supreme seat of learning."
 oe_msn_tib_10_gelug_three_academies_req_tt:0 "Control Lhasa (directly or via subject) with at least 12 Stability in the Age of Renaissance or later."
 oe_msn_tib_11_patron_priest_diplomacy:0 "Potala Citadel & Snowland Patron-Priest Diplomacy"
 oe_msn_tib_11_patron_priest_diplomacy_desc:0 "Project the prestige of Lhasa and Shigatse across the Mongol steppes, China, and the Himalayas through Cho-Yon embassies."
 oe_msn_tib_11_patron_priest_diplomacy_req_tt:0 "Control Lhasa and Shigatse (directly or via subject) with at least 15 Stability in the Age of Reformation or later."
 oe_msn_tib_12_roof_of_world_mandala:0 "Roof of the World: Sovereign Mandala"
 oe_msn_tib_12_roof_of_world_mandala_desc:0 "Holding Lhasa, Shigatse, Toling, and Chamdo in unassailable unity crowns the Sovereign Mandala atop the Roof of the World."
 oe_msn_tib_12_roof_of_world_mandala_req_tt:0 "Control Lhasa, Shigatse, Toling, and Chamdo (directly or via subject) with at least 18 Stability in the Age of Absolutism or later."
