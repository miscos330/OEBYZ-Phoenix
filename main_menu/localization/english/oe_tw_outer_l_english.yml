 oe_tw_grant_title: "Confer a Court Dignity"
 oe_tw_grant_title_desc: "Confer a court dignity on a ruler of the family of kings: the adult ruler of an imperial subject or of a Roman World member. The ruler's country thinks better of us; if it is our subject, its loyalty rises too. A country can be honoured once every 5 years.\n\nDespot: sons only, at most 2 reigning holders; prestige −20, imperial authority −8.\nSebastokrator: sons only, at most 2 reigning holders; prestige −15, imperial authority −6.\nKaisar: any rank, at most 1 reigning holder; not for a holder of the court's own Caesar; prestige −15, imperial authority −10.\nProtosebastos: any rank, at most 3 reigning holders; prestige −10, imperial authority −4.\nA ruler with a higher dignity cannot be given a lower one; a higher dignity replaces the old one. A dignity is for life and does not pass to the successor."
 oe_tw_grant_title_select: "Choose a ruler to honour"
 oe_tw_grant_title_none: "@trigger_no!No ruler can be honoured"
 oe_tw_grant_cd_tt: "This country was honoured within the last 5 years"
 oe_tw_grant_title_effect: "Choose the dignity in the following event"
 oe_tw_need_prestige_tt: "Prestige is at least 10"
 oe_tw_need_authority_tt: "Imperial authority is at least 4"
 oe_tw.1.t: "Conferring a Dignity"
 oe_tw.1.d: "The Byzantines ranked the rulers around them in a family of kings: the emperor was the father, Orthodox princes were his sons, rulers of equal standing his brothers, and the rest his friends. The emperor also conferred court dignities on foreign rulers, buying their loyalty with honour and a salary. In 1082 Alexios I made the doge of Venice protosebastos; in 1402 John VII made Stefan Lazarević of Serbia a despot in Constantinople.\n\nCandidate: [SCOPE.sCharacter('oe_tw_tr').GetName], ruler of [SCOPE.sCountry('oe_tw_tc').GetName]. Rank: [SCOPE.sCountry('oe_tw_tc').Custom('OeTwRank')]. Present dignity: [SCOPE.sCountry('oe_tw_tc').Custom('OeTwTitleName')].\n\nDespot: sons only, at most 2 reigning holders; prestige −20, imperial authority −8.\nSebastokrator: sons only, at most 2 reigning holders; prestige −15, imperial authority −6.\nKaisar: any rank, at most 1 reigning holder; not for a holder of the court's own Caesar; prestige −15, imperial authority −10.\nProtosebastos: any rank, at most 3 reigning holders; prestige −10, imperial authority −4.\nA ruler with a higher dignity cannot be given a lower one; dignities the ruler cannot receive, or that we cannot afford, are not offered."
 oe_tw.1.a: "Make the ruler Despot"
 oe_tw.1.a.tt: "Prestige −20, imperial authority −8\nThe ruler holds the dignity of despot for life (monthly prestige +0.1); a lower dignity is taken back\nThat country's opinion of us +40 (fades by 2 a year), and +10 more while this ruler reigns\nIf that country is our subject: loyalty to the overlord +15\nThat country cannot be honoured again for 5 years"
 oe_tw.1.b: "Make the ruler Sebastokrator"
 oe_tw.1.b.tt: "Prestige −15, imperial authority −6\nThe ruler holds the dignity of sebastokrator for life (monthly prestige +0.08); a lower dignity is taken back\nThat country's opinion of us +30 (fades by 2 a year), and +10 more while this ruler reigns\nIf that country is our subject: loyalty to the overlord +12\nThat country cannot be honoured again for 5 years"
 oe_tw.1.c: "Make the ruler kaisar"
 oe_tw.1.c.tt: "Prestige −15, imperial authority −10\nThe ruler holds the dignity of kaisar for life (monthly prestige +0.08); a lower dignity is taken back\nThat country's opinion of us +30 (fades by 2 a year), and +10 more while this ruler reigns\nIf that country is our subject: loyalty to the overlord +12\nThat country cannot be honoured again for 5 years"
 oe_tw.1.e: "Make the ruler Protosebastos"
 oe_tw.1.e.tt: "Prestige −10, imperial authority −4\nThe ruler holds the dignity of protosebastos for life (monthly prestige +0.05); a lower dignity is taken back\nThat country's opinion of us +25 (fades by 2 a year), and +10 more while this ruler reigns\nIf that country is our subject: loyalty to the overlord +8\nThat country cannot be honoured again for 5 years"
 oe_tw.1.f: "Not now"
 oe_tw.1.f.tt: "Nothing is spent"
 oe_tw.2.t: "A Lost Province Returns"
 oe_tw.2.d: "The empire never gives up a lost province lightly. The land register still lists its villages and what they owe; once the land is back, the emperor sends a surveyor (anagrapheus) to measure it again, count the households and write the province back into the empire's books.\n\n[GetCountry('BYZ').MakeScope.GetVariable('oe_tw_ret_count').GetValue|0] locations of [GetCountry('BYZ').Custom('OeTwRetRegion')], which broke away with a rebel theme, are in the empire's hands again.\nFervour from returned provinces this year: +[GetCountry('BYZ').MakeScope.GetVariable('oe_tw_hope_year').GetValue|0] (only during the Roman Reconquest; +1 a location, at most +5 a year)."
 oe_tw.2.a: "Restore the offices and the land register"
 oe_tw.2.a.tt: "Imperial authority +3"
 oe_tw.2.b: "Pardon those who followed the rebels"
 oe_tw.2.b.tt: "Every theme's loyalty +3, also in its loyalty target for 5 years"
 oe_tw.3.t: "A Chrysobull from Constantinople"
 oe_tw.3.d: "An envoy of the Roman emperor brings a decree sealed in gold. The emperor confers the dignity of [ROOT.GetCountry.Custom('OeTwTitleName')] on our ruler, [SCOPE.sCharacter('oe_tw_me').GetName], and sends robes of honour and a salary with it. At the court of Constantinople this gives us a nearer place in the family of kings; at our own court some are proud of it, and some fear what we now owe the emperor."
 oe_tw.3.a: "Accept the dignity"
 oe_tw.3.a.tt: "(Already in effect) Our ruler holds the dignity for life, with a little monthly prestige\nOur opinion of the Roman Empire rises\nIf we are a subject of the Roman Empire: loyalty to the overlord rises"
