 STATIC_MODIFIER_NAME_oe_tw_rank_son_mod: "Family of Kings: Son"
 STATIC_MODIFIER_DESC_oe_tw_rank_son_mod: "In the protocol of the court at Constantinople the emperor is the father of a family of kings. Orthodox princes are called his sons, the closest place in the family. Opinion between us and the Roman Empire is higher."
 STATIC_MODIFIER_NAME_oe_tw_rank_brother_mod: "Family of Kings: Brother"
 STATIC_MODIFIER_DESC_oe_tw_rank_brother_mod: "Great rulers of equal standing are called the emperor's brothers, the highest place a foreign ruler can hold in Byzantine protocol. Opinion between us and the Roman Empire is higher."
 STATIC_MODIFIER_NAME_oe_tw_rank_friend_mod: "Family of Kings: Friend"
 STATIC_MODIFIER_DESC_oe_tw_rank_friend_mod: "Other rulers are called the emperor's friends. They have a place in the family, but the furthest from the father. Opinion between us and the Roman Empire is a little higher."
 STATIC_MODIFIER_NAME_oe_tw_title_despotes: "Despot"
 STATIC_MODIFIER_DESC_oe_tw_title_despotes: "The highest dignity the Roman emperor confers, below the emperor and above all other titles. Manuel I created it in 1163 for the Hungarian prince Béla; in 1402 John VII, regent for his uncle Manuel II, conferred it on Stefan Lazarević of Serbia in Constantinople."
 STATIC_MODIFIER_NAME_oe_tw_title_sebastokrator: "Sebastokrator"
 STATIC_MODIFIER_DESC_oe_tw_title_sebastokrator: "Created by Alexios I for his elder brother Isaac around 1081, above the kaisar; second in rank once the despot was created in 1163. The Bulgarian and Serbian courts later adopted it."
 STATIC_MODIFIER_NAME_oe_tw_title_kaisar: "Kaisar (Foreign Ruler)"
 STATIC_MODIFIER_DESC_oe_tw_title_kaisar: "The ancient title of caesar became the third dignity in the twelfth century. In 705 Justinian II conferred it on Khan Tervel of Bulgaria, the best-known case of a foreign ruler made kaisar. It has nothing to do with the court's own Caesar, a candidate for the throne."
 STATIC_MODIFIER_NAME_oe_tw_title_protosebastos: "Protosebastos"
 STATIC_MODIFIER_DESC_oe_tw_title_protosebastos: "A dignity created by Alexios I. His chrysobull of 1082 made the doge of Venice protosebastos, with a yearly salary, in return for the Venetian fleet's help against the Normans."
 STATIC_MODIFIER_NAME_oe_tw_court_despotes: "Ruler Made Despot"
 STATIC_MODIFIER_DESC_oe_tw_court_despotes: "Our ruler holds the dignity of despot from the Roman emperor. If we are a subject of the Roman Empire, our loyalty to the overlord is higher."
 STATIC_MODIFIER_NAME_oe_tw_court_sebastokrator: "Ruler Made Sebastokrator"
 STATIC_MODIFIER_DESC_oe_tw_court_sebastokrator: "Our ruler holds the dignity of sebastokrator from the Roman emperor. If we are a subject of the Roman Empire, our loyalty to the overlord is higher."
 STATIC_MODIFIER_NAME_oe_tw_court_kaisar: "Ruler Made Kaisar"
 STATIC_MODIFIER_DESC_oe_tw_court_kaisar: "Our ruler holds the dignity of kaisar from the Roman emperor. If we are a subject of the Roman Empire, our loyalty to the overlord is higher."
 STATIC_MODIFIER_NAME_oe_tw_court_protosebastos: "Ruler Made Protosebastos"
 STATIC_MODIFIER_DESC_oe_tw_court_protosebastos: "Our ruler holds the dignity of protosebastos from the Roman emperor. If we are a subject of the Roman Empire, our loyalty to the overlord is higher."
