 oe_alb.1.t: "News from Savra"
 oe_alb.1.desc_dv: "#F In 1385 the house of Thopia called in the Ottomans against Balša II of Zeta; the armies met at Savra, the Zetan army was routed and Balša fell. Most of the Albanian lords then submitted to the sultan. The empire, itself paying tribute to the sultan in those years, could do nothing.#!\n\nNow the western hills have a new patron: the lords' envoys hurry between the sultan's tents and the ports of the Adriatic shore, and some have come to Constantinople. The Thopia have taken back [GetLocationByKey('durres').GetName]. The emperor, too, pays the sultan tribute, and there are voices at court that say: leave it alone."
 oe_alb.1.desc_d: "#F In 1385 the house of Thopia called in the Ottomans against Balša II of Zeta; the armies met at Savra, the Zetan army was routed and Balša fell. Most of the Albanian lords then submitted to the sultan. The empire, itself paying tribute to the sultan in those years, could do nothing.#!\n\nNow the western hills have a new patron: the lords' envoys hurry between the sultan's tents and the ports of the Adriatic shore, and some have come to Constantinople. The Thopia have taken back [GetLocationByKey('durres').GetName]."
 oe_alb.1.desc_v: "#F In 1385 the house of Thopia called in the Ottomans against Balša II of Zeta; the armies met at Savra, the Zetan army was routed and Balša fell. Most of the Albanian lords then submitted to the sultan. The empire, itself paying tribute to the sultan in those years, could do nothing.#!\n\nNow the western hills have a new patron: the lords' envoys hurry between the sultan's tents and the ports of the Adriatic shore, and some have come to Constantinople. The emperor, too, pays the sultan tribute, and there are voices at court that say: leave it alone."
 oe_alb.1.desc_x: "#F In 1385 the house of Thopia called in the Ottomans against Balša II of Zeta; the armies met at Savra, the Zetan army was routed and Balša fell. Most of the Albanian lords then submitted to the sultan. The empire, itself paying tribute to the sultan in those years, could do nothing.#!\n\nNow the western hills have a new patron: the lords' envoys hurry between the sultan's tents and the ports of the Adriatic shore, and some have come to Constantinople."
 oe_alb.1.a: "Send envoys to reassure the lords"
 oe_alb.1.a.tt: "Costs #R half a month#! of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m0_5')|0]#! gold)\nThe Albanian lords (AI, not on the empire's side): opinion of the empire #G +25#! for #Y 15#! years\nThe Ottomans: opinion of the empire #R −15#! for #Y 10#! years"
 oe_alb.1.b: "Congratulate the sultan"
 oe_alb.1.b.tt: "The Ottomans: opinion of the empire #G +20#! for #Y 10#! years\nIf the empire pays tribute to the sultan: the sultan's patience #G +5#!\nThe Albanian lords (AI, not on the empire's side): opinion of the empire #R −10#! for #Y 10#! years"
 oe_alb.1.c: "Pay no heed"
 oe_alb.1.c.tt: "The matter is left alone."
 oe_alb.2.t: "Durazzo for Sale"
 oe_alb.2.desc_x: "#F After Savra the Thopia held Durazzo again, yet the sultan's horsemen rode beneath its walls. Venice had long wanted this harbour on the Adriatic. In history the empire could make no offer.#!\n\nNow the lord of [GetLocationByKey('durres').GetName], #Y [GetLocationByKey('durres').GetOwner.GetName]#!, sends word: Venice has made an offer, but before agreeing the city would hear the Romans first. The price is #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m6')|0]#! gold, about six months of income."
 oe_alb.2.a: "Buy Durazzo"
 oe_alb.2.a.tt: "Costs #R 6#! months of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m6')|0]#! gold)\nThe money goes to the lord of [GetLocationByKey('durres').GetName]; [GetLocationByKey('durres').GetName] passes to the empire in peace (while its lord still holds it and it is not besieged; otherwise nothing is paid)\nVenice: opinion of the empire #R −30#! for #Y 10#! years\nIf Venice's trade privileges are at the second tier or higher: Venice's opinion of the empire a further #R −20#!\nVenice will not come to buy the city again"
 oe_alb.2.b: "Let Venice have it"
 oe_alb.2.b.tt: "Venice: opinion of the empire #G +20#! for #Y 10#! years\nVenice will take over the city soon after"
 oe_alb.2.c: "Urge Durazzo to hold"
 oe_alb.2.c.tt: "Costs #R 1#! month of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#! gold)\nThe lord of [GetLocationByKey('durres').GetName]: opinion of the empire #G +20#! for #Y 10#! years\nVenice's bargain must wait some ten years, and its odds are halved"
 oe_alb.3.t: "The Chiefs of Arcadia"
 oe_alb.3.desc_x: "#F In 1394-1395, it is recorded, some ten thousand Albanians came to the Isthmus of Corinth and asked the despot of the Morea to let them settle; the despot gave them homes in Arcadia, land in return for service.#!\n\nNow the newcomers of those years have built villages in the hills of Arcadia. Their chiefs ask for a charter: land and freedom from taxes, and these people will ride for the empire."
 oe_alb.3.a: "Land for service"
 oe_alb.3.a.tt: "The places in Arcadia where the Albanians settled (those still on the empire's side) gain [ShowModifier('oe_alb_stratiotai')] for #Y 30#! years\nThe theme of the Morea (if any): loyalty #G +5#!"
 oe_alb.3.b: "Pay them wages"
 oe_alb.3.b.tt: "For #Y 10#! years, every January costs #R 1#! month of income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#! gold)\nNo modifier on those places"
 oe_alb.3.c: "Refuse"
 oe_alb.3.c.tt: "The places in Arcadia where the Albanians settled (those still on the empire's side) gain [ShowModifier('oe_alb_highland_unrest')] for #Y 10#! years"
 oe_alb.4.t: "The Banner over Krujë"
 oe_alb.4.desc_x: "#F In the winter of 1443 George Kastrioti, who had served as the Ottoman sanjak-bey of Debar, left the sultan's army before Niš and is said to have taken Krujë with a forged letter of the sultan, becoming known as Skanderbeg. In history the empire was too weak to intervene in the west.#!\n\nNow envoys from the lord of [GetLocationByKey('kruje').GetName] have reached Constantinople, bringing word that the Albanian hills have risen in arms."
 oe_alb.4.a: "Send gifts and seek friendship"
 oe_alb.4.a.tt: "Costs #R 1#! month of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#! gold)\nThe lord of [GetLocationByKey('kruje').GetName]: opinion of the empire #G +40#! for #Y 15#! years\nThe Ottomans: opinion of the empire #R −20#! for #Y 10#! years\nEstablishes friendship with [GetLocationByKey('kruje').GetName] (remembered in later sieges and diplomacy)"
 oe_alb.4.b: "Urge Krujë to join the crusade"
 oe_alb.4.b.tt: "The lord of [GetLocationByKey('kruje').GetName]: opinion of the empire #G +20#! for #Y 10#! years\nShould the Varna crusade come to battle: crusade odds #G +5%#!"
 oe_alb.4.c: "Leave it alone"
 oe_alb.4.c.tt: "The Ottomans: opinion of the empire #G +10#! for #Y 10#! years"
 oe_alb.5.t: "Krujë Besieged"
 oe_alb.5.desc_x: "#F In 1450 Sultan Murad II marched in person to besiege Krujë. Supplies ran low inside the walls, relieved only by ships from the Adriatic ports. In history the empire had enough troubles at home and could send no aid.#!\n\nNow word that [GetLocationByKey('kruje').GetName] is besieged has reached Constantinople along the sea lanes, and letters from the garrison beg for relief."
 oe_alb.5.a: "Send grain and coin by sea"
 oe_alb.5.a.tt: "Costs #R 2#! months of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m2')|0]#! gold)\nThe lord of [GetLocationByKey('kruje').GetName]: opinion of the empire #G +25#! for #Y 15#! years\nThe Ottomans: opinion of the empire #R −20#! for #Y 10#! years\nOdds that [GetLocationByKey('kruje').GetName] holds the siege #G +15%#!"
 oe_alb.5.b: "Send letters and prayers only"
 oe_alb.5.b.tt: "Imperial prestige #G +5#!\nOdds that [GetLocationByKey('kruje').GetName] holds the siege #G +5%#!"
 oe_alb.5.c: "Do nothing"
 oe_alb.5.c.tt: "The matter is left alone."
 oe_alb.6.t: "A Title for the Lord of Krujë"
 oe_alb.6.desc_x: "In history Skanderbeg turned around 1451 to the pope and the king of Naples for titles and patronage, while Constantinople could offer little. Here, with the empire still standing and on friendly terms with [GetLocationByKey('kruje').GetName], envoys arrive from [GetLocationByKey('kruje').GetName] asking the emperor for a Roman [Concept('oe_tu_dignity','court dignity')|e] to strengthen the Albanian lords."
 oe_alb.6.a: "Confer the title of Despotes"
 oe_alb.6.a.tt: "Confers the dignity of Despotes on the lord of [GetLocationByKey('kruje').GetName] through court diplomacy (no subjection, no casus belli)\nThe lord of [GetLocationByKey('kruje').GetName]: opinion of the empire #G +30#! for #Y 15#! years"
 oe_alb.6.b: "Confer the title of Protosebastos"
 oe_alb.6.b.tt: "Confers the dignity of Protosebastos on the lord of [GetLocationByKey('kruje').GetName] through court diplomacy (no subjection, no casus belli)\nThe lord of [GetLocationByKey('kruje').GetName]: opinion of the empire #G +20#! for #Y 15#! years"
 oe_alb.6.c: "Politely decline"
 oe_alb.6.c.tt: "The request is declined without offence."
 oe_alb.7.t: "People from the Mountains"
 oe_alb.7.desc_x: "#F After Skanderbeg's passing and as the fighting around Krujë grew grim, many Albanians are said to have crossed the sea to southern Italy with their households and priests, while others sought shelter in Venetian strongholds in Greece.#!\n\nNow hundreds of Albanian mountain families have arrived at the empire's borders with their livestock and priests, asking for land to settle."
 oe_alb.7.a: "Settle the newcomers on imperial land"
 oe_alb.7.a.tt: "Costs #R 1#! month of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m1')|0]#! gold)\nSettles Albanian newcomers in the least populous imperial-held land in Albania, northern Greece, or the Morea"
 oe_alb.7.b: "Direct the refugees toward Italy"
 oe_alb.7.b.tt: "Venice and Naples (where alive): opinion of the empire #G +15#! for #Y 10#! years"
 oe_alb.7.c: "Turn them away"
 oe_alb.7.c.tt: "The newcomers are turned away."
 oe_alb.8.t: "The Last Appeal"
 oe_alb.8.desc_x: "With the empire restored to strength, the fame of Constantinople has reached the western mountains. Now the garrison of [GetLocationByKey('kruje').GetName] sends envoys over the passes: the Ottoman armies close in, supplies are nearly gone, and the fortress begs the Romans for aid."
 oe_alb.8.a: "Send troops and gold"
 oe_alb.8.a.tt: "Costs #R 3#! months of trade and tax income (about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_m3')|0]#! gold)\nCosts #R 3#!,000 manpower (one theme muster; no war declared)\nPostpones the fall of [GetLocationByKey('kruje').GetName] by ten years\nThe lord of [GetLocationByKey('kruje').GetName]: opinion of the empire #G +50#! for #Y 15#! years\nThe Ottomans: opinion of the empire #R −30#! for #Y 10#! years"
 oe_alb.8.b: "Invite Krujë to submit to the empire"
 oe_alb.8.b.tt: "[GetLocationByKey('kruje').GetName] passes to the empire in peace, and the former ruler enters the imperial court as a courtier (no new tag, no subject)\nThe Ottomans: opinion of the empire #R −40#! for #Y 10#! years"
 oe_alb.8.c: "We cannot help"
 oe_alb.8.c.tt: "No aid is sent."
 oe_alb.91.t: "The Fate of Durazzo"
 oe_alb.91.desc_v: "Word comes: Venice has taken over [GetLocationByKey('durres').GetName], and its former lord draws a pension."
 oe_alb.91.desc_h: "The lord of [GetLocationByKey('durres').GetName] has held the city, and the Venetian ships went home empty-handed."
 oe_alb.91.desc_x: "The matter of [GetLocationByKey('durres').GetName] has ended otherwise: the city did not pass to Venice as was said."
 oe_alb.91.a: "So be it"
 oe_alb.92.t: "Word from Krujë"
 oe_alb.92.desc_h1: "Good news arrives: [GetLocationByKey('kruje').GetName] has repulsed the Ottoman siege (hold odds were about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr1p')|0]#!%), forcing the sultan to withdraw."
 oe_alb.92.desc_f1: "Grim word arrives: [GetLocationByKey('kruje').GetName] could not hold out (hold odds were about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr1p')|0]#!%), and the fortress has fallen to the Ottomans."
 oe_alb.92.desc_h2: "Word arrives once more: [GetLocationByKey('kruje').GetName] has again beaten back the sultan's siege (hold odds were about #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr2p')|0]#!%)."
 oe_alb.92.desc_f2: "Grim word arrives: [GetLocationByKey('kruje').GetName] has fallen in the renewed siege (hold odds were about #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_alb_v_kr2p')|0]#!%), and Ottoman banners fly over the walls."
 oe_alb.92.desc_x: "Word of the fighting around [GetLocationByKey('kruje').GetName] has reached Constantinople."
 oe_alb.92.a: "So be it"
