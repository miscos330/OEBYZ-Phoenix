# NEW 2026-11-22 v13.5 Worker 2: 16 Historical & Regional Peace Treaties Library (oe_pt_ / oe_trty). Generated by gen_v135_peace_treaties.py; edit the generator, not this file.
 oe_pt_westphalian_sovereignty: "Westphalian Sovereignty & Cuius Regio"
 oe_pt_westphalian_sovereignty_desc: "Modeled on the 1648 Peace of Westphalia, this clause enshrines territorial sovereignty and the principle of cuius regio, eius religio. The victor gains 20 years of diplomatic reputation, heretic tolerance, and legislative efficiency, while the defeated suffers reduced war score efficiency alongside diminished legitimacy and religious influence."
 oe_pt_westphalian_sovereignty_entry: "Enact Westphalian Sovereignty: establish sovereign equality and confessional coexistence for 20 years"
 oe_pt_westphalian_sovereignty_entry_short: "Westphalian Sovereignty"
 oe_pt_nerchinsk_border_trade: "Nerchinsk Border & Frontier Trade Accord"
 oe_pt_nerchinsk_border_trade_desc: "Inspired by the 1689 Treaty of Nerchinsk, this accord demarcates Eurasian land frontiers by stone markers and charters regulated border markets. The victor receives 25 years of merchant capacity, frontier defense, and diplomatic standing, while the defeated gains modest stability and cross-border commerce."
 oe_pt_nerchinsk_border_trade_entry: "Sign the Nerchinsk Border Accord: demarcate frontiers and charter 25 years of overland trade"
 oe_pt_nerchinsk_border_trade_entry_short: "Nerchinsk Border Accord"
 oe_pt_kuchuk_kaynarca_straits: "Kuchuk-Kaynarca Free Passage of Straits"
 oe_pt_kuchuk_kaynarca_straits_desc: "Modeled on the 1774 Treaty of Kuchuk-Kaynarca, this clause compels a power controlling strategic maritime narrows or sound tolls to grant unrestricted merchant passage. For 25 years the victor gains maritime commercial power, merchant capacity, and prestige at the defeated guardian's expense."
 oe_pt_kuchuk_kaynarca_straits_entry: "Guarantee free commercial passage through strategic straits for 25 years"
 oe_pt_kuchuk_kaynarca_straits_entry_short: "Free Passage of Straits"
 oe_pt_mare_liberum_opening: "Mare Liberum Maritime Opening"
 oe_pt_mare_liberum_opening_desc: "Invoking Hugo Grotius's 1609 doctrine of Mare Liberum, this treaty shatters exclusive oceanic claims and opens contested sea lanes. For 20 years the victor enjoys superior trade protection, maritime merchant power, and fleet speed while the defeated loses market dominance at sea."
 oe_pt_mare_liberum_opening_entry: "Enforce Mare Liberum: break maritime exclusion and open ocean trade lanes for 20 years"
 oe_pt_mare_liberum_opening_entry_short: "Mare Liberum Opening"
 oe_pt_abolish_cartaz_monopoly: "Abolish Cartaz Maritime Monopoly"
 oe_pt_abolish_cartaz_monopoly_desc: "Abolishes the coercive Cartaz naval pass and armed customs monopoly across the monsoon waters of the Indian Ocean and Southeast Asia. For 25 years the victor gains trade center power, trade income, and ship capture chance while the defeated suffers heavy losses in maritime trade revenue."
 oe_pt_abolish_cartaz_monopoly_entry: "Dismantle the Cartaz naval pass monopoly across the Indian Ocean for 25 years"
 oe_pt_abolish_cartaz_monopoly_entry_short: "Abolish Cartaz Monopoly"
 oe_pt_restitute_masterpieces: "Restitute Plundered Masterpieces"
 oe_pt_restitute_masterpieces_desc: "Following the 1815 Vienna precedent for cultural restitution, the defeated must surrender movable masterpieces from their treasuries. Up to two non-priceless works originating in the victor's lands are physically returned to the victor's capital; otherwise, the highest-quality non-priceless masterpiece held by the defeated is transferred instead."
 oe_pt_restitute_masterpieces_entry: "Physically transfer 1 to 2 non-priceless masterpieces from the defeated to the victor's capital"
 oe_pt_restitute_masterpieces_entry_short: "Restitute Masterpieces"
 oe_pt_celestial_cefeng_investiture: "Celestial Cefeng Investiture"
 oe_pt_celestial_cefeng_investiture_desc: "Under the classical Celestial investiture ritual, the Middle Kingdom grants imperial seals and enrolls the defeated realm into the tributary order. Where eligible, the defeated becomes a tributary subject; the suzerain gains 20 years of legitimacy, subject loyalty, and prestige while the invested realm receives tributary trade privileges."
 oe_pt_celestial_cefeng_investiture_entry: "Grant Celestial investiture: establish tributary status where eligible and apply 20-year suzerain-tributary terms"
 oe_pt_celestial_cefeng_investiture_entry_short: "Celestial Cefeng"
 oe_pt_dismantle_great_hegemony: "Dismantle Great Hegemony"
 oe_pt_dismantle_great_hegemony_desc: "Forces an overbearing great power or empire to renounce hegemonic pretensions in favor of multipolar balance. The defeated loses substantial prestige immediately and endures 20 years of diplomatic and military humiliation, while the victor earns prestige, diplomatic reputation, and diplomatic capacity as guardian of the balance."
 oe_pt_dismantle_great_hegemony_entry: "Dismantle hegemonic claims: severely humble the defeated great power and empower the victor for 20 years"
 oe_pt_dismantle_great_hegemony_entry_short: "Dismantle Hegemony"
 oe_pt_colonial_factory_concession: "Chartered Factory & Treaty Port Concession"
 oe_pt_colonial_factory_concession_desc: "Following the historical precedents of Levantine capitulations, Canton factories, and Dejima concessions, the defeated grants chartered trading enclaves in its ports. The victor enjoys 25 years of expanded merchant capacity and trade revenue; the defeated faces burgher discontent yet receives faster institution diffusion."
 oe_pt_colonial_factory_concession_entry: "Establish chartered overseas factories and treaty port concessions for 25 years"
 oe_pt_colonial_factory_concession_entry_short: "Factory Concession"
 oe_pt_treaty_of_perpetual_peace: "Treaty of Perpetual Peace"
 oe_pt_treaty_of_perpetual_peace_desc: "Modeled on the 1686 Treaty of Perpetual Peace, this solemn compact concludes exhausting hostilities so both realms can recover. Both parties immediately shed war exhaustion and receive 15 years of peaceful recuperation, with additional stability investment and diplomatic standing for the victor."
 oe_pt_treaty_of_perpetual_peace_entry: "Conclude a Treaty of Perpetual Peace: reduce war exhaustion on both sides and grant 15 years of recovery"
 oe_pt_treaty_of_perpetual_peace_entry_short: "Perpetual Peace"
 oe_pt_forced_religious_toleration: "Forced Religious Toleration Edict"
 oe_pt_forced_religious_toleration_desc: "Drawing upon the Edict of Nantes and the Warsaw Confederation, this clause obliges a defeated realm of another faith to protect religious minorities and curb forced conversion. For 25 years the defeated gains high tolerance but loses conversion speed, while the victor earns religious influence and diplomatic standing."
 oe_pt_forced_religious_toleration_entry: "Compel the defeated to enact a 25-year edict of religious toleration and halt aggressive conversion"
 oe_pt_forced_religious_toleration_entry_short: "Forced Toleration"
 oe_pt_demilitarize_frontier_zone: "Demilitarize Frontier Zone"
 oe_pt_demilitarize_frontier_zone_desc: "Forces the defeated power to dismantle frontier fortifications, withdraw border garrisons, and accept a demilitarized buffer zone. For 20 years the defeated suffers weaker defenses, costlier army upkeep, and declining army tradition, while the victor gains 15 years of frontier security."
 oe_pt_demilitarize_frontier_zone_entry: "Demilitarize the frontier: weaken the defeated realm's defenses and army upkeep for 20 years"
 oe_pt_demilitarize_frontier_zone_entry_short: "Demilitarize Frontier"
 oe_pt_silk_road_caravan_immunity: "Silk Road Caravan Immunity"
 oe_pt_silk_road_caravan_immunity_desc: "Requires an inland Eurasian power along the Silk Road corridors to grant tax immunity and caravanserai protection to the victor's caravans. The victor gains 20 years of merchant capacity and trade center power, while the defeated cedes market share yet slightly pleases its own burghers."
 oe_pt_silk_road_caravan_immunity_entry: "Secure Silk Road caravan tax immunity and safe-conduct charters for 20 years"
 oe_pt_silk_road_caravan_immunity_entry_short: "Caravan Immunity"
 oe_pt_silver_indemnity_schedule: "Silver Indemnity & Bullion Schedule"
 oe_pt_silver_indemnity_schedule_desc: "Modeled on historic bullion indemnities and annual silver tributes, the defeated immediately transfers a bounded silver lump sum scaled to its economic base and suffers 15 years of reduced minting and trade receipts, funding the victor's mints and public construction."
 oe_pt_silver_indemnity_schedule_entry: "Levy a safely capped silver indemnity lump sum plus a 15-year bullion repayment schedule"
 oe_pt_silver_indemnity_schedule_entry_short: "Silver Indemnity"
 oe_pt_scholarly_manuscript_tribute: "Scholarly Manuscript & Artisan Tribute"
 oe_pt_scholarly_manuscript_tribute_desc: "Compels a learned rival possessing universities or rich collections to open its libraries and guild archives to the victor's scribes and master craftsmen. The victor gains 20 years of research, literacy, and institution growth plus a newly transcribed scientific treatise in its capital, while the defeated suffers 15 years of slower research."
 oe_pt_scholarly_manuscript_tribute_entry: "Transcribe the defeated's scholarly archives, spawning a scientific treatise in the victor's capital with 20 years of research gains"
 oe_pt_scholarly_manuscript_tribute_entry_short: "Manuscript Tribute"
 oe_pt_revoke_privateer_letters: "Revoke Privateer Letters & Anti-Piracy Pact"
 oe_pt_revoke_privateer_letters_desc: "Orders the defeated maritime power to revoke all letters of marque and submit to an international anti-piracy convention. For 20 years the defeated suffers steep penalties to privateer upkeep, hiring cost, and ship capture, while the victor enjoys fortified trade protection and anti-piracy warfare."
 oe_pt_revoke_privateer_letters_entry: "Revoke the defeated's letters of marque and enforce a 20-year anti-piracy maritime convention"
 oe_pt_revoke_privateer_letters_entry_short: "Revoke Privateers"
 oe_pt_westphalian_sovereignty_tt: "The defeated loses #N 10#! Legitimacy if applicable, and #N 15#! Religious Influence if its faith uses that mechanic."
 oe_pt_restitute_masterpieces_tt: "Physically transfers up to #P 2#! non-priceless masterpieces originating in the victor's lands back to the victor's capital; if none exist, transfers the single highest-quality non-priceless masterpiece held by the defeated."
 oe_pt_celestial_cefeng_investiture_tt: "If eligible for tributary subjugation, the defeated immediately becomes a #Y Tributary#! of the victor."
 oe_pt_silver_indemnity_schedule_tt: "The defeated pays a lump-sum silver indemnity equal to #Y 1.5x#! its economic base (safely capped between #Y 25#! and #Y 400#! ducats) to the victor."
 oe_pt_scholarly_manuscript_tribute_tt: "Within two days, the victor's capital scriptorium completes a high-quality (#P 82#!) #Y Scientific Treatise#! transcribed from the defeated's archives."
