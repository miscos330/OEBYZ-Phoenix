 oe_trty.1.t: "Triumphal Restitution of Masterpieces"
 oe_trty.1.d: "Before the wax on the peace treaty has even cooled, escorted convoys have delivered the restituted masterpieces safely into our capital. Crates of gilded scrolls, venerable codices, and rare works are unsealed before cheering crowds outside the palace gates. Courtiers and curators now await our command: shall we stage a grand public exhibition to celebrate our cultural triumph, or dedicate the royal archives to careful preservation and scholarly study?"
 oe_trty.1.a: "Hold a grand public exhibition of the returned treasures"
 oe_trty.1.b: "Catalog and restore them inside the royal academy"
 oe_trty.2.t: "The Royal Scriptorium Completes the Extracted Treatise"
 oe_trty.2.d: "Under the terms of the Manuscript and Artisan Tribute, our scribes, translators, and master craftsmen have returned from the defeated realm's universities and guild halls bearing chests of diagrams and rare notes. Working round the clock in our capital scriptorium, they have bound a high-quality Scientific Treatise that now enters our national collection as a cornerstone of inquiry."
 oe_trty.2.a: "Distribute annotated copies across our academies"
 oe_trty.2.b: "Enshrine the master volume and reward the scribes"
 oe_trty.3.t: "The Westphalian Settlement Ratified"
 oe_trty.3.d: "Within the vaulted hall of the peace congress, plenipotentiaries have affixed their seals to parchment. The ratified accord proclaims territorial sovereignty inviolable and brings confessional intervention under the restraint of public law. Henceforth, diplomacy among states shall answer to treaty charters and reason of state rather than unchecked sectarian strife."
 oe_trty.3.a: "Proclaim the new sovereign order to all courts"
 oe_trty.3.b: "Commission jurists to codify the law of nations"
 oe_trty.4.t: "Open Straits and Free Sea Lanes"
 oe_trty.4.d: "With our maritime peace clauses entering into force, restrictive toll fortresses and coercive pass officials have yielded the passage. Merchant convoys under our flag now glide through strategic straits and across monsoon sea lanes, while admirals and port syndics send dispatches hailing a new era of open commerce."
 oe_trty.4.a: "Expand naval patrols to cement our maritime renown"
 oe_trty.4.b: "Collect the first wave of tariff dividends for the treasury"
 oe_trty.5.t: "The Cefeng Investiture Charter Proclaimed"
 oe_trty.5.d: "Our imperial heralds have completed the investiture ceremony, presenting the gilded seal and patent of title to the humbled court. Having formally acknowledged our suzerainty, their envoys pledge regular tribute missions and regulated border trade as ceremonial bells resound across our capital."
 oe_trty.5.a: "Receive the court's homage and proclaim our mandate"
 oe_trty.5.b: "Dispatch return gifts and organize the tribute markets"
 oe_trty.6.t: "The Hegemon Humbled: Congress of Balance"
 oe_trty.6.d: "The formidable power that once threatened to overshadow every neighbor has finally bowed at the negotiating table and renounced its hegemonic pretensions. Envoys from courts near and far arrive with congratulations, hailing our arms and statesmanship for preserving the balance of power."
 oe_trty.6.a: "Parade the victorious standards as guarantor of balance"
 oe_trty.6.b: "Channel our triumph into domestic consolidation"
 oe_trty.7.t: "Frontier, Bullion, and Peace Accords Ratified"
 oe_trty.7.d: "With border markers set, indemnity bullion tallied, and caravan charters sealed, long-contested frontiers fall quiet at last. Exhausted regiments rotate back from the marches as merchants and caravans resume their journeys along newly secured highways."
 oe_trty.7.a: "Ease burdens on the provinces and let the realm recover"
 oe_trty.7.b: "Set aside transit dues for the central treasury"
 oe_trty.8.t: "Grand Treaty Hall: Diplomatic Ratification Dispatch"
 oe_trty.8.d: "The Grand Chancery has inscribed our diplomatic stipulations—spanning treaty port factory concessions, religious toleration edicts, frontier demilitarization, and anti-piracy conventions—into the golden registry. All sixteen historical and regional peace treaties stand ready to reshape the diplomatic order in every war to come."
 oe_trty.8.a: "Seal the golden registry in the imperial archives"
 oe_trty.8.b: "Instruct provincial governors to enforce treaty compliance"
