 STATIC_MODIFIER_NAME_oe_pt_westphalia_winner_mod: "Guarantor of Westphalian Sovereignty"
 STATIC_MODIFIER_DESC_oe_pt_westphalia_winner_mod: "As an architect of sovereign equality and confessional restraint, our state commands high diplomatic esteem and steady governance."
 STATIC_MODIFIER_NAME_oe_pt_westphalia_loser_mod: "Bound by Westphalian Terms"
 STATIC_MODIFIER_DESC_oe_pt_westphalia_loser_mod: "Compelled to accept territorial sovereignty and confessional limits, our realm faces diplomatic constraints on aggressive war demands."
 STATIC_MODIFIER_NAME_oe_pt_nerchinsk_winner_mod: "Nerchinsk Frontier Accord"
 STATIC_MODIFIER_DESC_oe_pt_nerchinsk_winner_mod: "With frontiers fixed by treaty stones and border fairs thriving, our merchants and garrisons prosper across the Eurasian marches."
 STATIC_MODIFIER_NAME_oe_pt_nerchinsk_loser_mod: "Nerchinsk Border Settlement"
 STATIC_MODIFIER_DESC_oe_pt_nerchinsk_loser_mod: "Though boundaries were fixed under treaty pressure, regulated border markets bring steady commerce and domestic calm."
 STATIC_MODIFIER_NAME_oe_pt_straits_open_winner_mod: "Guaranteed Passage of the Straits"
 STATIC_MODIFIER_DESC_oe_pt_straits_open_winner_mod: "Our merchant fleets sail unmolested through critical maritime straits, boosting overseas reach and prestige."
 STATIC_MODIFIER_NAME_oe_pt_straits_open_loser_mod: "Strait Monopoly Broken"
 STATIC_MODIFIER_DESC_oe_pt_straits_open_loser_mod: "Forced to open strategic maritime narrows to foreign shipping, our maritime revenue and prestige suffer."
 STATIC_MODIFIER_NAME_oe_pt_mare_liberum_winner_mod: "Champion of Mare Liberum"
 STATIC_MODIFIER_DESC_oe_pt_mare_liberum_winner_mod: "With the freedom of the seas codified by treaty, our squadrons and merchantmen navigate global routes with unmatched vigor."
 STATIC_MODIFIER_NAME_oe_pt_mare_liberum_loser_mod: "Closed-Sea Claim Shattered"
 STATIC_MODIFIER_DESC_oe_pt_mare_liberum_loser_mod: "Our exclusive maritime claims have been overturned by force, eroding commercial leverage across sea lanes."
 STATIC_MODIFIER_NAME_oe_pt_cartaz_broken_winner_mod: "Monsoon Sea Lanes Liberated"
 STATIC_MODIFIER_DESC_oe_pt_cartaz_broken_winner_mod: "Having broken coercive naval pass monopolies, our vessels dominate the spice emporia of the monsoon seas."
 STATIC_MODIFIER_NAME_oe_pt_cartaz_broken_loser_mod: "Cartaz System Dismantled"
 STATIC_MODIFIER_DESC_oe_pt_cartaz_broken_loser_mod: "Stripped of coercive customs passes in the Indian Ocean, our maritime trade revenues and escorts falter."
 STATIC_MODIFIER_NAME_oe_pt_restituted_pride_mod: "Restituted Masterpieces Triumph"
 STATIC_MODIFIER_DESC_oe_pt_restituted_pride_mod: "Masterpieces returned in triumph to our capital inspire scholars, artisans, and subjects across the entire realm."
 STATIC_MODIFIER_NAME_oe_pt_cefeng_suzerain_mod: "Celestial Suzerain Investiture"
 STATIC_MODIFIER_DESC_oe_pt_cefeng_suzerain_mod: "Envoys bearing tribute validate our supreme mandate, reinforcing imperial legitimacy and subject fidelity."
 STATIC_MODIFIER_NAME_oe_pt_cefeng_tributary_mod: "Invested Tributary Charter"
 STATIC_MODIFIER_DESC_oe_pt_cefeng_tributary_mod: "Holding an imperial patent of investiture opens lucrative tribute markets and cultural exchanges."
 STATIC_MODIFIER_NAME_oe_pt_balance_keeper_mod: "Guardian of Multipolar Balance"
 STATIC_MODIFIER_DESC_oe_pt_balance_keeper_mod: "By checking an overreaching great power, our chancery earns enduring trust and expanded diplomatic reach."
 STATIC_MODIFIER_NAME_oe_pt_hegemon_humbled_mod: "Hegemonic Pretensions Humbled"
 STATIC_MODIFIER_DESC_oe_pt_hegemon_humbled_mod: "Publicly forced to renounce hegemonic ambitions, our realm endures years of diplomatic scorn and curtailed expansion."
 STATIC_MODIFIER_NAME_oe_pt_factory_concession_winner_mod: "Overseas Chartered Factories"
 STATIC_MODIFIER_DESC_oe_pt_factory_concession_winner_mod: "Privileged trading enclaves established abroad channel exotic cargoes and merchant profits directly to our markets."
 STATIC_MODIFIER_NAME_oe_pt_factory_concession_loser_mod: "Treaty Port Factory Concessions"
 STATIC_MODIFIER_DESC_oe_pt_factory_concession_loser_mod: "Foreign factory concessions chafe domestic merchant guilds while accelerating the arrival of new institutions."
 STATIC_MODIFIER_NAME_oe_pt_perpetual_peace_winner_mod: "Blessings of Perpetual Peace"
 STATIC_MODIFIER_DESC_oe_pt_perpetual_peace_winner_mod: "Following a solemn peace settlement, war weariness recedes and domestic institutions recover steadily."
 STATIC_MODIFIER_NAME_oe_pt_perpetual_peace_loser_mod: "Post-War Armistice Relief"
 STATIC_MODIFIER_DESC_oe_pt_perpetual_peace_loser_mod: "With hostilities formally ended, exhaustion across provinces and armies gradually subsides."
 STATIC_MODIFIER_NAME_oe_pt_defender_toleration_winner_mod: "Protector of Confessional Minorities"
 STATIC_MODIFIER_DESC_oe_pt_defender_toleration_winner_mod: "Securing treaty safeguards for religious minorities elevates our moral stature and religious influence."
 STATIC_MODIFIER_NAME_oe_pt_forced_toleration_loser_mod: "Treaty-Mandated Religious Toleration"
 STATIC_MODIFIER_DESC_oe_pt_forced_toleration_loser_mod: "Bound by treaty edicts to tolerate minority faiths, our clergy cannot pursue aggressive conversion campaigns."
 STATIC_MODIFIER_NAME_oe_pt_secure_frontier_winner_mod: "Secured Frontier Buffer"
 STATIC_MODIFIER_DESC_oe_pt_secure_frontier_winner_mod: "With the rival border demilitarized, our garrisons fortify key approaches and hone tactical readiness."
 STATIC_MODIFIER_NAME_oe_pt_demilitarized_loser_mod: "Demilitarized Frontier Zone"
 STATIC_MODIFIER_DESC_oe_pt_demilitarized_loser_mod: "Stripped of border fortresses and restricted in garrisoning, our defenses and military upkeep suffer severely."
 STATIC_MODIFIER_NAME_oe_pt_caravan_immunity_winner_mod: "Silk Road Caravan Immunity"
 STATIC_MODIFIER_DESC_oe_pt_caravan_immunity_winner_mod: "Protected by treaty safe-conducts, our overland caravans traverse inland trade hubs free of arbitrary tolls."
 STATIC_MODIFIER_NAME_oe_pt_caravan_immunity_loser_mod: "Open Caravan Corridor Obligations"
 STATIC_MODIFIER_DESC_oe_pt_caravan_immunity_loser_mod: "Though transit dues are foregone to foreign caravans, brisk traffic brings modest satisfaction to local burghers."
 STATIC_MODIFIER_NAME_oe_pt_silver_indemnity_winner_mod: "Silver Indemnity Receipts"
 STATIC_MODIFIER_DESC_oe_pt_silver_indemnity_winner_mod: "Treaty bullion inflows bolster our mints and finance ambitious public works across the realm."
 STATIC_MODIFIER_NAME_oe_pt_silver_indemnity_loser_mod: "Silver Indemnity Drain"
 STATIC_MODIFIER_DESC_oe_pt_silver_indemnity_loser_mod: "Ongoing silver reparations drain coinage reserves and weigh upon national trade returns."
 STATIC_MODIFIER_NAME_oe_pt_manuscript_tribute_winner_mod: "Extracted Codices & Master Artisans"
 STATIC_MODIFIER_DESC_oe_pt_manuscript_tribute_winner_mod: "Transcribed manuscripts and recruited master craftsmen accelerate scholarship, literacy, and institutional progress."
 STATIC_MODIFIER_NAME_oe_pt_manuscript_tribute_loser_mod: "Scholarly Archive Drain"
 STATIC_MODIFIER_DESC_oe_pt_manuscript_tribute_loser_mod: "With cherished manuscripts copied abroad and master artisans departing, domestic research loses momentum."
 STATIC_MODIFIER_NAME_oe_pt_safe_sealanes_winner_mod: "Protected Sea Lanes Convention"
 STATIC_MODIFIER_DESC_oe_pt_safe_sealanes_winner_mod: "With hostile letters of marque abolished, our naval patrols secure commercial lanes against raiders."
 STATIC_MODIFIER_NAME_oe_pt_no_privateers_loser_mod: "Privateer Letters Revoked"
 STATIC_MODIFIER_DESC_oe_pt_no_privateers_loser_mod: "Bound by an anti-piracy convention, outfitting or maintaining privateers becomes prohibitively costly."
 oe_trty.1.t: "Triumphal Restitution of Masterpieces"
 oe_trty.1.d: "Before the wax on the peace treaty has even cooled, escorted convoys have delivered the restituted masterpieces safely into our capital. Crates of gilded scrolls, venerable codices, and rare works are unsealed before cheering crowds outside the palace gates. Courtiers and curators now await our command: shall we stage a grand public exhibition to celebrate our cultural triumph, or dedicate the royal archives to careful preservation and scholarly study?"
 oe_trty.1.a: "Hold a grand public exhibition of the returned treasures"
 oe_trty.1.b: "Catalog and restore them inside the royal academy"
 oe_trty.2.t: "The Royal Scriptorium Completes the Extracted Treatise"
 oe_trty.2.d: "Under the terms of the Manuscript and Artisan Tribute, our scribes, translators, and master craftsmen have returned from the defeated realm's universities and guild halls bearing chests of diagrams and rare notes. Working round the clock in our capital scriptorium, they have bound a high-quality Scientific Treatise that now enters our national collection as a cornerstone of inquiry."
 oe_trty.2.a: "Distribute annotated copies across our academies"
 oe_trty.2.b: "Enshrine the master volume and reward the scribes"
 oe_trty.3.t: "The Westphalian Settlement Ratified"
 oe_trty.3.d: "Within the vaulted hall of the peace congress, plenipotentiaries have affixed their seals to parchment. The ratified accord proclaims territorial sovereignty inviolable and brings confessional intervention under the restraint of public law. Henceforth, diplomacy among states shall answer to treaty charters and reason of state rather than unchecked sectarian strife."
 oe_trty.3.a: "Proclaim the new sovereign order to all courts"
 oe_trty.3.b: "Commission jurists to codify the law of nations"
 oe_trty.4.t: "Open Straits and Free Sea Lanes"
 oe_trty.4.d: "With our maritime peace clauses entering into force, restrictive toll fortresses and coercive pass officials have yielded the passage. Merchant convoys under our flag now glide through strategic straits and across monsoon sea lanes, while admirals and port syndics send dispatches hailing a new era of open commerce."
 oe_trty.4.a: "Expand naval patrols to cement our maritime renown"
 oe_trty.4.b: "Collect the first wave of tariff dividends for the treasury"
 oe_trty.5.t: "The Cefeng Investiture Charter Proclaimed"
 oe_trty.5.d: "Our imperial heralds have completed the investiture ceremony, presenting the gilded seal and patent of title to the humbled court. Having formally acknowledged our suzerainty, their envoys pledge regular tribute missions and regulated border trade as ceremonial bells resound across our capital."
 oe_trty.5.a: "Receive the court's homage and proclaim our mandate"
 oe_trty.5.b: "Dispatch return gifts and organize the tribute markets"
 oe_trty.6.t: "The Hegemon Humbled: Congress of Balance"
 oe_trty.6.d: "The formidable power that once threatened to overshadow every neighbor has finally bowed at the negotiating table and renounced its hegemonic pretensions. Envoys from courts near and far arrive with congratulations, hailing our arms and statesmanship for preserving the balance of power."
 oe_trty.6.a: "Parade the victorious standards as guarantor of balance"
 oe_trty.6.b: "Channel our triumph into domestic consolidation"
 oe_trty.7.t: "Frontier, Bullion, and Peace Accords Ratified"
 oe_trty.7.d: "With border markers set, indemnity bullion tallied, and caravan charters sealed, long-contested frontiers fall quiet at last. Exhausted regiments rotate back from the marches as merchants and caravans resume their journeys along newly secured highways."
 oe_trty.7.a: "Ease burdens on the provinces and let the realm recover"
 oe_trty.7.b: "Set aside transit dues for the central treasury"
 oe_trty.8.t: "Grand Treaty Hall: Diplomatic Ratification Dispatch"
 oe_trty.8.d: "The Grand Chancery has inscribed our diplomatic stipulations—spanning treaty port factory concessions, religious toleration edicts, frontier demilitarization, and anti-piracy conventions—into the golden registry. All sixteen historical and regional peace treaties stand ready to reshape the diplomatic order in every war to come."
 oe_trty.8.a: "Seal the golden registry in the imperial archives"
 oe_trty.8.b: "Instruct provincial governors to enforce treaty compliance"
