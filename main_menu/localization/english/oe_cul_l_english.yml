 STATIC_MODIFIER_NAME_oe_cul_eurasian_spark_mod: "Eurasian Autonomous Institution Spark"
 STATIC_MODIFIER_DESC_oe_cul_eurasian_spark_mod: "A great Eurasian metropolis has ignited an autonomous institution spark through its academies and literate burghers, lifting cultural influence and lowering embracement costs."
 STATIC_MODIFIER_NAME_oe_cul_eurasian_spark_conservative_mod: "Measured Institution Assimilation"
 STATIC_MODIFIER_DESC_oe_cul_eurasian_spark_conservative_mod: "Guides incoming innovations through established institutions, preserving estate harmony and cultural tradition while easing embracement costs."
 STATIC_MODIFIER_NAME_oe_cul_byz_synthesis_mod: "Mediterranean-Anatolian Imperial Synthesis"
 STATIC_MODIFIER_DESC_oe_cul_byz_synthesis_mod: "Byzantium-Rome weaves Mediterranean and Anatolian traditions into a revitalized imperial synthesis, lifting scholarship, tradition, and institution growth."
 STATIC_MODIFIER_NAME_oe_cul_yuan_synthesis_mod: "Great Yuan Eurasian Multi-Ethnic Synthesis"
 STATIC_MODIFIER_DESC_oe_cul_yuan_synthesis_mod: "The Great Yuan court harmonizes Mongol, Han, Jiangnan, Tibetan, and Western Region institutions, strengthening legislative power and realm cohesion."
 STATIC_MODIFIER_NAME_oe_cul_rus_synthesis_mod: "All-Rus' Eurasian Cultural Synthesis"
 STATIC_MODIFIER_DESC_oe_cul_rus_synthesis_mod: "Russia blends Rus' charters, Byzantine rite, steppe mobility, and Western engineering, propelling research vigor and rapid imperial construction."
 oe_cul_adv_byz_italian_maritime_law: "Rhodian-Venetian Maritime Law"
 oe_cul_adv_byz_italian_maritime_law_desc: "Synthesizes the Roman Rhodian Sea Law with northern Italian maritime contracts, marine underwriting, and consular courts across the Mediterranean."
 oe_cul_adv_byz_armenian_cataphracts: "Armenian Highland Cataphract Tradition"
 oe_cul_adv_byz_armenian_cataphracts_desc: "Integrates Armenian nakharar heavy cavalry discipline and highland citadel craft to fortify imperial passes and sharpen field discipline."
 oe_cul_adv_byz_slavic_theme_integration: "Balkan Slavic Theme Co-Governance"
 oe_cul_adv_byz_slavic_theme_integration_desc: "Brings Serbian and Bulgarian magnates into the imperial thematic muster and legal registers, turning the Balkans into a loyal manpower reservoir."
 oe_cul_adv_byz_levant_egypt_granary: "Nile-Syrian Irrigation & Cadastre"
 oe_cul_adv_byz_levant_egypt_granary_desc: "Adopts Egyptian nilometer assessment and Levantine canal cadastres, boosting provincial fiscal returns and steady administrative control."
 oe_cul_adv_byz_persian_chancery: "Roman-Persian Chancery & Royal Post"
 oe_cul_adv_byz_persian_chancery_desc: "Fuses Roman chancery jurisprudence with Persian divan recordkeeping and royal relay posts, expanding diplomatic reach and legislative speed."
 oe_cul_adv_byz_anatolian_akritai_synergy: "Anatolian Akritai Horse-Archer Synergy"
 oe_cul_adv_byz_anatolian_akritai_synergy_desc: "Blends imperial Akritai border defense with Anatolian mounted archery and Caucasian garrison grit, raising morale and frontier resilience."
 oe_cul_adv_byz_hellenic_humanism_bridge: "Hellenic-Latin Classical Humanism Bridge"
 oe_cul_adv_byz_hellenic_humanism_bridge_desc: "Links Greek and Latin humanist academies between Constantinople and Italian cities, accelerating scholarly research and institution growth."
 oe_cul_adv_yuan_han_cabinet_fusion: "Mongol-Han Dual Secretariat"
 oe_cul_adv_yuan_han_cabinet_fusion_desc: "Combines steppe executive decisiveness with Central Plains bureaucratic codification in a bilingual Secretariat, lifting legislative and tax efficiency."
 oe_cul_adv_yuan_jiangnan_shipwrights: "Jiangnan Fuchuan & Compass Navigation"
 oe_cul_adv_yuan_jiangnan_shipwrights_desc: "Harnesses Wu and Minnan shipwright guilds to build compartmentalized Fuchuan vessels and refine compass navigation, cutting fleet upkeep while projecting sea power."
 oe_cul_adv_yuan_tibetan_dharma_state: "Xuanzhengyuan Dharma-State & Plateau Post"
 oe_cul_adv_yuan_tibetan_dharma_state_desc: "Formalizes Xuanzhengyuan patronage and Tibetan plateau relay networks, fostering religious tolerance and steadfast loyalty across imperial dependencies."
 oe_cul_adv_yuan_persian_astronomy_math: "Huihui Astronomical Bureau & Persian Reckoning"
 oe_cul_adv_yuan_persian_astronomy_math_desc: "Unites Persian and Uyghur astronomers with ortoq mercantile accounting, advancing calendrical science and Eurasian export settlement."
 oe_cul_adv_yuan_korean_printing_gunnery: "Goryeo Movable Type & Gunpowder Rockets"
 oe_cul_adv_yuan_korean_printing_gunnery_desc: "Adopts Korean bronze movable-type printing alongside rocket ordnance craft, spreading state editions, lifting literacy, and accelerating institution growth."
 oe_cul_adv_yuan_jurchen_annan_frontier: "Jurchen Heavy Horse & Lingnan Frontier Corps"
 oe_cul_adv_yuan_jurchen_annan_frontier_desc: "Combines Jurchen armored horsemanship with southern riverine and jungle frontier formations, bolstering imperial manpower and combat discipline."
 oe_cul_adv_rus_all_rus_chancery: "All-Rus' Novgorod-Kyiv Commercial Law"
 oe_cul_adv_rus_all_rus_chancery_desc: "Unifies Novgorodian Baltic fur charters with Kyivan legal custom, streamlining export commerce and expanding cultural integration capacity."
 oe_cul_adv_rus_byzantine_nomocanon: "Byzantine Nomocanon & Imperial Rite"
 oe_cul_adv_rus_byzantine_nomocanon_desc: "Enlists Greek canonists to codify the Nomocanon and imperial court ceremonial, elevating dynastic legitimacy and Orthodox religious influence."
 oe_cul_adv_rus_steppe_cavalry_corps: "Steppe Tatar-Cossack Light Cavalry Brigade"
 oe_cul_adv_rus_steppe_cavalry_corps_desc: "Drills Volga Tatar horsemen alongside frontier Cossack hosts, imparting relentless steppe morale and deep manpower reserves."
 oe_cul_adv_rus_german_technical_quarter: "German Quarter & Western Engineering Academy"
 oe_cul_adv_rus_german_technical_quarter_desc: "Recruits German metallurgists, surveyors, and master builders in the Nemetskaya Sloboda and Baltic ports, accelerating research and construction."
 oe_cul_adv_rus_caucasus_caspian_trade: "Caucasus-Caspian Silk Route Defense"
 oe_cul_adv_rus_caucasus_caspian_trade_desc: "Partners with Georgian, Armenian, and Persian merchants and mountain garrisons to fortify the Volga-Caspian passes and expand silk exports."
 oe_cul_imperial_integration_law: "Imperial Multi-Ethnic Integration Law"
 oe_cul_imperial_integration_law_desc: "Every transcontinental empire must define how its peoples coexist: through classical assimilation, cosmopolitan inclusion, federated millet charters, or polyglot scholarly syncretism."
 oe_cul_policy_classical_assimilation: "Classical Assimilationism"
 oe_cul_policy_classical_assimilation_desc: "Channels imperial law, state schools, and literary canons to steadily assimilate frontier populations while deepening core cultural tradition."
 oe_cul_policy_imperial_cosmopolitanism: "Imperial Cosmopolitanism"
 oe_cul_policy_imperial_cosmopolitanism_desc: "Welcomes Eurasian merchants and civic elites into imperial service, expanding accepted culture capacity, calming estates, and boosting institution growth."
 oe_cul_policy_federated_millet: "Federated Millet Co-Rule"
 oe_cul_policy_federated_millet_desc: "Recognizes confessional community charters and autonomous frontier customs, securing high subject loyalty and broad religious tolerance."
 oe_cul_policy_scholarly_syncretism: "Scholarly Syncretism & Translation"
 oe_cul_policy_scholarly_syncretism_desc: "Founds imperial translation bureaus and polyglot academies spanning Greek, Arabic, Persian, Chinese, and Latin scholarship to lift literacy and research."
 oe_cul.1.t: "Oikoumene Renewed: Mediterranean & Anatolian Synthesis"
 oe_cul.1.d: "From the chanceries of Constantinople to Adriatic counting houses and Anatolian passes, the institutions forged through accepted cultures have taken root. Roman jurisprudence, Italian maritime law, Balkan thematic levies, and eastern chancery craft now reinforce a revitalized imperial order."
 oe_cul.1.a: "Enshrine the Imperial Synthesis across the realm"
 oe_cul.1.b: "Channel the new learning into state libraries and stability"
 oe_cul.2.t: "Harmony of Realms: Great Yuan Multi-Ethnic Synthesis"
 oe_cul.2.d: "Under the Secretariat at Dadu, Mongol and Han ministers govern in tandem while Jiangnan shipwrights sail the southern seas, the Xuanzhengyuan secures the plateau, and Persian astronomers work alongside Korean printers. Multi-ethnic institutional synthesis now anchors the Great Yuan Restoration."
 oe_cul.2.a: "Proclaim the Eurasian synthesis across the Great Yuan"
 oe_cul.2.b: "Enrich the imperial archives and steady the realm"
 oe_cul.3.t: "Across Steppe and Sea: All-Rus' Cultural Synthesis"
 oe_cul.3.d: "Uniting Novgorodian and Kyivan commercial charters, Byzantine canonical rites, steppe cavalry vigor, and western engineering craft, accepted-culture synthesis has transformed Rus' from northern principalities into a transcontinental empire."
 oe_cul.3.a: "Harness this Eurasian synthesis for imperial renewal"
 oe_cul.3.b: "Codify these lessons in the crown academies"
 oe_cul.20.t: "Eurasian Metropolis Ignites an Institution Spark"
 oe_cul.20.d: "No longer waiting generations for distant currents to drift from Western Europe, our great Eurasian hub has autonomously kindled a new institution through its academies, literate burghers, and bustling continental markets. Court scholars and guild masters now petition the crown to spread the spark nationwide."
 oe_cul.20.a: "Champion the new current and ease nationwide embracement"
 oe_cul.20.b: "Assimilate the spark gradually to preserve estate harmony"
