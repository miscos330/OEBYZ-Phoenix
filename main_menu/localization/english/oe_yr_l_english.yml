 oe_yr.1.t: "The Debate on Restoration"
 oe_yr.1.desc_toq1: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the Red Turbans have been put down, and the Mandate still rests with the Yuan. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_toq2: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the 'Zhizheng Restoration' after the suppression has lasted two full years. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_toq3: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the suppression has held its momentum for two years: the warlords remain, but the realm is steady. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_toq4: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the twenty-eighth Zhizheng year is past, and Dadu is still the court's capital. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai1: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the Red Turbans have been put down, and the Mandate still rests with the Yuan. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai2: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the 'Zhizheng Restoration' after the suppression has lasted two full years. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai3: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the suppression has held its momentum for two years: the warlords remain, but the realm is steady. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai4: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the twenty-eighth Zhizheng year is past, and Dadu is still the court's capital. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen1: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the Red Turbans have been put down, and the Mandate still rests with the Yuan. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen2: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the 'Zhizheng Restoration' after the suppression has lasted two full years. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen3: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the suppression has held its momentum for two years: the warlords remain, but the realm is steady. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen4: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the twenty-eighth Zhizheng year is past, and Dadu is still the court's capital. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_x: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow the court is steadier. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.a: "Han law reform: Han ministers, examinations on the classics, Han law"
 oe_yr.1.a.tt: "The road is Han law reform; it cannot be changed later.\nThe Mongol grandees are displeased.\nStage one, 'Order at Home':\n· the suppression not lost (required): while it lasts, its momentum at least #Y 50#!;\n  once it has closed, it closed with the Yuan restored or at its appointed end, and Dadu is still the capital\n· and at least two of these three:\n  — the paper money no worse than 'wearing'\n  — the capital's granary at least 'as usual'\n  — the branch secretariats' average loyalty at least #Y 40#!, with none in the lowest tier\n· held for #Y 6#! months in a row, the stage is passed (paused while the crisis of the Chinese dynasty lasts).\nOn passing: the intensity of the Mongol-Han strife #G −0.25#! (its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!), legitimacy #G +5#!.\nStrain (each month with any of these #R +1#!, without #G −1#!; at #Y 12#! the road falters, and before stage one is passed the restoration is abandoned):\n· the paper money worthless; famine in the capital\n· the suppression's momentum below #Y 35#!; the branch secretariats' average loyalty below #Y 30#!\n· Bolod Temür in power; Dadu no longer the capital; stability below #Y −10#!\nTen years on a road without passing stage one, the loss of Dadu, or a lost suppression also end it."
 oe_yr.1.b: "The ancestral way: the Mongols and the Semu, revenue, the princes, the grain fleets"
 oe_yr.1.b.tt: "The road is the ancestral way; it cannot be changed later.\nStage one, 'Order at Home':\n· the suppression not lost (required): while it lasts, its momentum at least #Y 50#!;\n  once it has closed, it closed with the Yuan restored or at its appointed end, and Dadu is still the capital\n· and at least two of these three:\n  — the paper money no worse than 'wearing'\n  — the capital's granary at least 'as usual'\n  — the branch secretariats' average loyalty at least #Y 40#!, with none in the lowest tier\n· held for #Y 6#! months in a row, the stage is passed (paused while the crisis of the Chinese dynasty lasts).\nOn passing: the intensity of the Mongol-Han strife #G −0.25#! (its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!), legitimacy #G +5#!.\nStrain (each month with any of these #R +1#!, without #G −1#!; at #Y 12#! the road falters, and before stage one is passed the restoration is abandoned):\n· the paper money worthless; famine in the capital\n· the suppression's momentum below #Y 35#!; the branch secretariats' average loyalty below #Y 30#!\n· Bolod Temür in power; Dadu no longer the capital; stability below #Y −10#!\nTen years on a road without passing stage one, the loss of Dadu, or a lost suppression also end it."
 oe_yr.1.c: "Put the debate off"
 oe_yr.1.c.tt: "The debate returns in #Y 12#! months; it can be put off at most #Y 2#! times."
 oe_yr.2.t: "Order Restored at Home"
 oe_yr.2.desc_an: "#F In the third month of the twelfth Zhizheng year (1352) an edict ordered that 'southerners of talent and learning' be employed in the Secretariat, the Bureau of Military Affairs and the Censorate, 'as under the old rule of Shizu' (History of Yuan, 42).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. Han ministers sit in the Secretariat, the lectures on the classics resume, and the reform has a beginning. The modifier of the Mongol-Han strife has long run out; its intensity still falls by #G +0.25#! (every branch secretariat's loyalty target #G +5#!), and #bold #color_yellow Order Restored at Home#!#! gives legitimacy #G +0.02#! a month (renewed each January)."
 oe_yr.2.desc_ao: "#F In the third month of the twelfth Zhizheng year (1352) an edict ordered that 'southerners of talent and learning' be employed in the Secretariat, the Bureau of Military Affairs and the Censorate, 'as under the old rule of Shizu' (History of Yuan, 42).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. Han ministers sit in the Secretariat, the lectures on the classics resume, and the reform has a beginning. The Mongol-Han strife eases: its intensity falls by #G +0.25#! and stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%; its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!."
 oe_yr.2.desc_bn: "#F Under Khubilai's rule princes of the blood held the frontiers and received fixed yearly grants, and the state lived on its revenue officials and on the grain shipped by sea (so the usual account).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. The old houses keep their places, the princes' grants are paid as usual, and the state's needs are being met. The modifier of the Mongol-Han strife has long run out; its intensity still falls by #G +0.25#! (every branch secretariat's loyalty target #G +5#!), and #bold #color_yellow Order Restored at Home#!#! gives legitimacy #G +0.02#! a month (renewed each January)."
 oe_yr.2.desc_bo: "#F Under Khubilai's rule princes of the blood held the frontiers and received fixed yearly grants, and the state lived on its revenue officials and on the grain shipped by sea (so the usual account).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. The old houses keep their places, the princes' grants are paid as usual, and the state's needs are being met. The Mongol-Han strife eases: its intensity falls by #G +0.25#! and stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%; its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!."
 oe_yr.2.desc_x: "#F Under Khubilai's rule princes of the blood held the frontiers and received fixed yearly grants, and the state lived on its revenue officials and on the grain shipped by sea (so the usual account).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. The old houses keep their places, the princes' grants are paid as usual, and the state's needs are being met. The Mongol-Han strife eases: its intensity falls by #G +0.25#! and stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%; its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!."
 oe_yr.2.a: "Well done"
 oe_yr.2.a.tt: "Stage one is passed; legitimacy #G +5#!. The next stage is still being debated at court.\nStrain is still counted each month: at #Y 12#! the road falters and may fall back behind this stage."
 oe_yr.7.t: "The Restoration Falters"
 oe_yr.7.desc_n1: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow, before the road was even firm, troubles came one after another, and the restoration has been given up."
 oe_yr.7.desc_n2: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow the road was chosen 10 years ago and its first stage never came; the restoration fades away."
 oe_yr.7.desc_n3: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow Dadu is lost, and there is no restoration to speak of."
 oe_yr.7.desc_n4: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow the Red Turban wars have ended in the court's defeat, and there is no restoration to speak of."
 oe_yr.7.desc_ah: "#F In the twentieth Zhizheng year (1360) the Chancellor of the Left Taiping resigned, pleading illness. Before that the heir apparent and the empress had sought an abdication in the heir's favour and sounded Taiping out; Taiping would not go along and lost their favour (so it is said, History of Yuan, 140).#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_ag: "#F Ministers who governed by Han law offended the grandees and seldom kept their places for long.#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_bh: "#F From the eighteenth Zhizheng year (1358) the Chancellor of the Right Chosgem and the eunuch Bak Bulhwa worked hand in glove inside and outside the palace, and bribes were taken openly (so the usual account).#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_bg: "#F A court that leans on grandees and revenue officials gathers money quickly, and resentment just as quickly.#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_x: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.a: "Dismiss the ministers of the reform to quiet the realm"
 oe_yr.7.a.tt: "Back to before stage one: the easing of the Mongol-Han strife is undone as it was made (with the modifier, while it has not run out); this line's modifiers come off.\nStrain falls to #Y 4#!; stage one's months are counted again."
 oe_yr.7.b: "Stand by them"
 oe_yr.7.b.tt: "Costs #R 3#! months of trade and tax income\nNo stage is lost; strain falls to #Y 6#!. This can be done once a stage."
 oe_yr.7.c: "So be it"
 oe_yr.7.c.tt: "The restoration ends here: the easing of the Mongol-Han strife has been undone as it was made (with the modifier, while it has not run out), and this line's modifiers are gone."
 oe_yr.20.t: "The Yuan restoration: the choice takes effect"
 oe_yr.90.t: "[TEST] The Yuan restoration: readings"
 oe_yr.90.d: "#T Line and road#!\nend [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_end')|0]  way [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_how')|0]  road [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_path')|0]  stage [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_stage')|0]  deferred [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_defer')|0]  opened [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_openm')|0]  ever passed 1 [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_ever1')|0]  why abandoned [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_why')|0]\n#T Checklist#!\nheld [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_ok')|0]  of [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_need')|0]  months held [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_hold')|0]  items R/money/grain/prov [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_items')|0]\n#T Strain#!\nstrain [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]  stood by [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_saved')|0]  signals [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_sigs')|0]\n#T Opening#!\nbase and ways [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_ways')|0]  phase-3 run [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_p3run')|0]  momentum run [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_shirun')|0]\n#T Vanilla modifiers#!\nintensity % [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]  this line's change % [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_intd100')|0]  cut bits [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_cut')|0]  modifiers and crisis [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_mods')|0]  societal value [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_sv')|0]  Han policy [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_han')|0]  literacy [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_lit')|0]  literacy at opening [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_lit0')|0]\n#T Other lines#!\nsuppression phase [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_phase')|0]  suppression end [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_y7end')|0]  momentum [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_shi')|0]  generals' sway [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_sway')|0]  Dadu [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_dadu')|0]  paper-money tier [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_yc')|0]  granary tier [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_yh')|0]  provinces' loyalty [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_prov')|0]  provinces' target [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_target')|0]  princes' loyalty [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_yw')|0]\n#T Schedule#!\nmonth [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_m')|0]  guard [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_evm')|0]  wait [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_wait')|0]  due .7 [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_d7')|0]  .2 [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_d2')|0]  .1 [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_d1')|0]  notice [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_note')|0]  last event [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_last')|0]\n(end: 1 accomplished 2 abandoned 3 the Yuan fell 4 lapsed 5 at 1400 8 off; way: 1 won 2 restoration phase 3 the hold 4 past 1368; road: 1 Han law 2 ancestral; why: 1 strain 2 ten years 3 Dadu lost 4 suppression lost; items and signals: one digit each, see the notes; Han policy: 1 employ 2 limit)"
 oe_yr.90.a: "Close"
