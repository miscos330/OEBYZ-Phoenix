 oe_yr.1.t: "The Debate on Restoration"
 oe_yr.1.desc_toq1: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the Red Turbans have been put down, and the Mandate still rests with the Yuan. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_toq2: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the 'Zhizheng Restoration' after the suppression has lasted two full years. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_toq3: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the suppression has held its momentum for two years: the warlords remain, but the realm is steady. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_toq4: "#F In the sixth year of the later Zhiyuan era (1340) Toqto'a drove out Bayan and called it 'renewal': the examinations came back, the four seasonal rites of the ancestral temple were restored, and lectures on the classics were held before the throne (History of Yuan).#!\n\nNow: the twenty-eighth Zhizheng year is past, and Dadu is still the court's capital. The chancellor Toqto'a still heads the Secretariat. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai1: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the Red Turbans have been put down, and the Mandate still rests with the Yuan. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai2: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the 'Zhizheng Restoration' after the suppression has lasted two full years. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai3: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the suppression has held its momentum for two years: the warlords remain, but the realm is steady. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_tai4: "#F In the seventeenth Zhizheng year (1357) Taiping was called to be Chancellor of the Left: a Han by birth, given a Mongol name by the throne (History of Yuan, 140).#!\n\nNow: the twenty-eighth Zhizheng year is past, and Dadu is still the court's capital. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen1: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the Red Turbans have been put down, and the Mandate still rests with the Yuan. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen2: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the 'Zhizheng Restoration' after the suppression has lasted two full years. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen3: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the suppression has held its momentum for two years: the warlords remain, but the realm is steady. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_gen4: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow: the twenty-eighth Zhizheng year is past, and Dadu is still the court's capital. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.desc_x: "#F Khubilai founded the dynasty on Han law and Mongol custom at once; for decades afterwards the court argued between 'governing by Han law' and 'keeping the ways of the ancestors' (so the usual account).#!\n\nNow the court is steadier. Some at court urge Han ministers, examinations on the classics and Han law; others would rest on the Mongols and the Semu, on the princes, on revenue and the grain fleets. Which road shall the restoration take?"
 oe_yr.1.a: "Han law reform: Han ministers, examinations on the classics, Han law"
 oe_yr.1.a.tt: "The road is Han law reform; it cannot be changed later.\nThe Mongol grandees are displeased.\nStage one, 'Order at Home':\n· the suppression not lost (required): while it lasts, its momentum at least #Y 50#!;\n  once it has closed, it closed with the Yuan restored or at its appointed end, and Dadu is still the capital\n· and at least two of these three:\n  — the paper money no worse than 'wearing'\n  — the capital's granary at least 'as usual'\n  — the branch secretariats' average loyalty at least #Y 40#!, with none in the lowest tier\n· held for #Y 6#! months in a row, the stage is passed (paused while the crisis of the Chinese dynasty lasts).\nOn passing: the intensity of the Mongol-Han strife #G −0.25#! (its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!), legitimacy #G +5#!.\nStrain (each month with any of these #R +1#!, without #G −1#!; at #Y 12#! the road falters, and before stage one is passed the restoration is abandoned):\n· the paper money worthless; famine in the capital\n· the suppression's momentum below #Y 35#!; the branch secretariats' average loyalty below #Y 30#!\n· Bolod Temür in power; Dadu no longer the capital; stability below #Y −10#!\nTen years on a road without passing stage one, the loss of Dadu, or a lost suppression also end it."
 oe_yr.1.b: "The ancestral way: the Mongols and the Semu, revenue, the princes, the grain fleets"
 oe_yr.1.b.tt: "The road is the ancestral way; it cannot be changed later.\nStage one, 'Order at Home':\n· the suppression not lost (required): while it lasts, its momentum at least #Y 50#!;\n  once it has closed, it closed with the Yuan restored or at its appointed end, and Dadu is still the capital\n· and at least two of these three:\n  — the paper money no worse than 'wearing'\n  — the capital's granary at least 'as usual'\n  — the branch secretariats' average loyalty at least #Y 40#!, with none in the lowest tier\n· held for #Y 6#! months in a row, the stage is passed (paused while the crisis of the Chinese dynasty lasts).\nOn passing: the intensity of the Mongol-Han strife #G −0.25#! (its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!), legitimacy #G +5#!.\nStrain (each month with any of these #R +1#!, without #G −1#!; at #Y 12#! the road falters, and before stage one is passed the restoration is abandoned):\n· the paper money worthless; famine in the capital\n· the suppression's momentum below #Y 35#!; the branch secretariats' average loyalty below #Y 30#!\n· Bolod Temür in power; Dadu no longer the capital; stability below #Y −10#!\nTen years on a road without passing stage one, the loss of Dadu, or a lost suppression also end it."
 oe_yr.1.c: "Put the debate off"
 oe_yr.1.c.tt: "The debate returns in #Y 12#! months; it can be put off at most #Y 2#! times."
 oe_yr.2.t: "Order Restored at Home"
 oe_yr.2.desc_an: "#F In the third month of the twelfth Zhizheng year (1352) an edict ordered that 'southerners of talent and learning' be employed in the Secretariat, the Bureau of Military Affairs and the Censorate, 'as under the old rule of Shizu' (History of Yuan, 42).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. Han ministers sit in the Secretariat, the lectures on the classics resume, and the reform has a beginning. The modifier of the Mongol-Han strife has long run out; its intensity still falls by #G +0.25#! (every branch secretariat's loyalty target #G +5#!), and #bold #color_yellow Order Restored at Home#!#! gives legitimacy #G +0.02#! a month (renewed each January)."
 oe_yr.2.desc_ao: "#F In the third month of the twelfth Zhizheng year (1352) an edict ordered that 'southerners of talent and learning' be employed in the Secretariat, the Bureau of Military Affairs and the Censorate, 'as under the old rule of Shizu' (History of Yuan, 42).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. Han ministers sit in the Secretariat, the lectures on the classics resume, and the reform has a beginning. The Mongol-Han strife eases: its intensity falls by #G +0.25#! and stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%; its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!."
 oe_yr.2.desc_bn: "#F Under Khubilai's rule princes of the blood held the frontiers and received fixed yearly grants, and the state lived on its revenue officials and on the grain shipped by sea (so the usual account).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. The old houses keep their places, the princes' grants are paid as usual, and the state's needs are being met. The modifier of the Mongol-Han strife has long run out; its intensity still falls by #G +0.25#! (every branch secretariat's loyalty target #G +5#!), and #bold #color_yellow Order Restored at Home#!#! gives legitimacy #G +0.02#! a month (renewed each January)."
 oe_yr.2.desc_bo: "#F Under Khubilai's rule princes of the blood held the frontiers and received fixed yearly grants, and the state lived on its revenue officials and on the grain shipped by sea (so the usual account).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. The old houses keep their places, the princes' grants are paid as usual, and the state's needs are being met. The Mongol-Han strife eases: its intensity falls by #G +0.25#! and stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%; its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!."
 oe_yr.2.desc_x: "#F Under Khubilai's rule princes of the blood held the frontiers and received fixed yearly grants, and the state lived on its revenue officials and on the grain shipped by sea (so the usual account).#!\n\nNow the suppression holds, and the treasury, the grain and the provinces have held for half a year: at last the court has hands free. The old houses keep their places, the princes' grants are paid as usual, and the state's needs are being met. The Mongol-Han strife eases: its intensity falls by #G +0.25#! and stands at #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%; its levy and crown-power penalties shrink with it, and every branch secretariat's loyalty target #G +5#!."
 oe_yr.2.a: "Well done"
 oe_yr.2.a.tt: "Stage one is passed; legitimacy #G +5#!. Next comes stage two.\nStage two, 'Renewal' (all held for #Y 6#! months in a row):\n· policy 'Maintain Status Quo in Han Policies'; Middle Kingdom examination law not 'Direct Appointment'\n· Sinicized societal value at least #Y 20#! towards Sinicized\n· court in order (generals' sway at most 1 and Bolod not in power, or within the purge grace period)\n· land survey completed; the paper money no worse than 'wearing'; the capital's granary at least 'as usual'.\nStage two, 'Ancestral Custom' (all held for #Y 6#! months in a row):\n· policy 'Limit the Han Powers'; princes' yearly grants not halted\n· at least #Y 3#! active princes with average loyalty at least #Y 55#!\n· court in order (generals' sway at most 1 and Bolod not in power, or within the purge grace period)\n· land survey completed; the paper money no worse than 'wearing'; the capital's granary at least 'as usual'.\nStrain is still counted each month: at #Y 12#! the road falters and may fall back a stage."
 oe_yr.3.t: "Renewal Takes Hold"
 oe_yr.3.desc_nx: "#F In the early Zhizheng years Han scholars such as Ouyang Xuan, Xu Youren and Wei Su served in the histories, rites and imperial lectures, and the literati hoped the court would return to Han governance (History of Yuan).#!\n\nWith Han officials employed, examinations on the classics in place and the land survey settled for half a year, the old administrative disarray has long lapsed; the strife intensity still falls by #G +0.25#! (province loyalty targets #G +5#!), #bold #color_yellow Civil Rule Returning#!#! grants cabinet efficiency #G +3%#!, and the cabinet action #bold #color_yellow Build Schools#!#! is unlocked. The elder minister Xu Youren still serves at court, and Wei Su of Jinxi answers the summons to the Secretariat."
 oe_yr.3.desc_nw: "#F In the early Zhizheng years Han scholars such as Ouyang Xuan, Xu Youren and Wei Su served in the histories, rites and imperial lectures, and the literati hoped the court would return to Han governance (History of Yuan).#!\n\nWith Han officials employed, examinations on the classics in place and the land survey settled for half a year, the old administrative disarray has long lapsed; the strife intensity still falls by #G +0.25#! (province loyalty targets #G +5#!), #bold #color_yellow Civil Rule Returning#!#! grants cabinet efficiency #G +3%#!, and the cabinet action #bold #color_yellow Build Schools#!#! is unlocked. Wei Su of Jinxi answers the summons to serve at court."
 oe_yr.3.desc_no: "#F In the early Zhizheng years Han scholars such as Ouyang Xuan, Xu Youren and Wei Su served in the histories, rites and imperial lectures, and the literati hoped the court would return to Han governance (History of Yuan).#!\n\nWith Han officials employed, examinations on the classics in place and the land survey settled for half a year, the old administrative disarray has long lapsed; the strife intensity still falls by #G +0.25#! (province loyalty targets #G +5#!), #bold #color_yellow Civil Rule Returning#!#! grants cabinet efficiency #G +3%#!, and the cabinet action #bold #color_yellow Build Schools#!#! is unlocked."
 oe_yr.3.desc_ox: "#F In the early Zhizheng years Han scholars such as Ouyang Xuan, Xu Youren and Wei Su served in the histories, rites and imperial lectures, and the literati hoped the court would return to Han governance (History of Yuan).#!\n\nWith Han officials employed, examinations on the classics in place and the land survey settled for half a year, #bold #color_yellow Administration in Disarray#!#! is lifted and the Mongol-Han strife falls by another #G +0.25#! (now #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%, raising branch secretariat loyalty targets by #G +5#!). The cabinet action #bold #color_yellow Build Schools#!#! is now unlocked for the inner provinces. The elder minister Xu Youren still serves at court, and Wei Su of Jinxi answers the summons to the Secretariat."
 oe_yr.3.desc_ow: "#F In the early Zhizheng years Han scholars such as Ouyang Xuan, Xu Youren and Wei Su served in the histories, rites and imperial lectures, and the literati hoped the court would return to Han governance (History of Yuan).#!\n\nWith Han officials employed, examinations on the classics in place and the land survey settled for half a year, #bold #color_yellow Administration in Disarray#!#! is lifted and the Mongol-Han strife falls by another #G +0.25#! (now #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%, raising branch secretariat loyalty targets by #G +5#!). The cabinet action #bold #color_yellow Build Schools#!#! is now unlocked for the inner provinces. Wei Su of Jinxi answers the summons to serve at court."
 oe_yr.3.desc_x: "#F In the early Zhizheng years Han scholars such as Ouyang Xuan, Xu Youren and Wei Su served in the histories, rites and imperial lectures, and the literati hoped the court would return to Han governance (History of Yuan).#!\n\nWith Han officials employed, examinations on the classics in place and the land survey settled for half a year, #bold #color_yellow Administration in Disarray#!#! is lifted and the Mongol-Han strife falls by another #G +0.25#! (now #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%, raising branch secretariat loyalty targets by #G +5#!). The cabinet action #bold #color_yellow Build Schools#!#! is now unlocked for the inner provinces."
 oe_yr.3.a: "Well done"
 oe_yr.3.a.tt: "Stage two 'Renewal' passed: cabinet action #bold #color_yellow Build Schools#!#! unlocked (inner provinces monthly literacy #G +0.05#!, pop promotion #G +0.15%#!); strife intensity #G −0.25#!; Administration in Disarray lifted (or #bold #color_yellow Civil Rule Returning#!#! if it has already expired).\nStage three, 'Restoration' (all held for #Y 12#! months in a row):\n· Han policy and examinations kept; Sinicized societal value at least #Y 40#! towards Sinicized\n· at least #Y 2#! examinations held via this route; country literacy +#Y 3#! above opening\n· the paper money at 'circulating'; the capital's granary at least 'as usual'\n· branch secretariats' average loyalty at least #Y 50#!; Celestial Authority at least #Y 50#!."
 oe_yr.4.t: "The Ancestral Way Restored"
 oe_yr.4.desc_n: "#F The Yuan rested on princes of the blood holding the marches: while yearly grants flowed and revenue and grain fleets held, the ancestral order stood firm (so the usual account).#!\n\nFor half a year the ancestral course has held: the old disarray has long lapsed, the strife intensity still falls by #G +0.25#! (province loyalty targets #G +5#!); active princes gain #G +5#! loyalty, and #bold #color_yellow Princes in Accord#!#! grants levy size #G +10%#! (renewed each January)."
 oe_yr.4.desc_x: "#F The Yuan rested on princes of the blood holding the marches: while yearly grants flowed and revenue and grain fleets held, the ancestral order stood firm (so the usual account).#!\n\nFor half a year the ancestral course has held: the princes are loyal, the grants continue, and revenue and grain are in order. #bold #color_yellow Administration in Disarray#!#! is lifted and the Mongol-Han strife falls by another #G +0.25#! (now #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_int100')|0]#!%, province loyalty targets #G +5#!); active princes gain #G +5#! loyalty, and #bold #color_yellow Princes in Accord#!#! grants levy size #G +10%#!."
 oe_yr.4.a: "Well done"
 oe_yr.4.a.tt: "Stage two 'Ancestral Custom' passed: active princes gain #G +5#! loyalty, #bold #color_yellow Princes in Accord#!#! grants levy size #G +10%#!; strife intensity #G −0.25#!; Administration in Disarray lifted.\nStage three, 'Restoration' (all held for #Y 12#! months in a row):\n· 'Limit the Han Powers' and yearly grants kept; princes' average loyalty at least #Y 65#!\n· the capital's granary at 'ample'; the paper money no worse than 'wearing'\n· branch secretariats' average loyalty at least #Y 45#!; Celestial Authority at least #Y 50#!."
 oe_yr.5.t: "Debate on the Land Survey"
 oe_yr.5.desc_a: "#F In the first Yanyou year (1314) the Grand Councillor Zhanglü proposed a land survey in Jiangzhe, Jiangxi and Henan, giving forty days to declare holdings. Harsh officials inflated assessments until unrest broke out, forcing the throne to remit the new assessments in 1315 (History of Yuan, 93).#!\n\nNow the Ministry of Revenue proposes a survey of Jiangzhe, Jiangxi and Henan-Jiangbei to equalize taxes. Shall we fund commissioners to carry out an orderly survey, or confiscate concealed lands outright to fill the treasury?"
 oe_yr.5.desc_b: "#F In the first Yanyou year (1314) the Grand Councillor Zhanglü proposed a land survey in Jiangzhe, Jiangxi and Henan, giving forty days to declare holdings. Harsh officials inflated assessments until unrest broke out, forcing the throne to remit the new assessments in 1315 (History of Yuan, 93).#!\n\nWith expenses mounting, revenue officials urge confiscating concealed estates in Jiangzhe, Jiangxi and Henan-Jiangbei to fund the state and princely grants; cautious elders cite the 1314 troubles and advise paying for a measured survey instead."
 oe_yr.5.desc_x: "#F In the first Yanyou year (1314) the Grand Councillor Zhanglü proposed a land survey in Jiangzhe, Jiangxi and Henan, giving forty days to declare holdings. Harsh officials inflated assessments until unrest broke out, forcing the throne to remit the new assessments in 1315 (History of Yuan, 93).#!\n\nNow the Ministry of Revenue proposes a survey of Jiangzhe, Jiangxi and Henan-Jiangbei to equalize taxes. Shall we fund commissioners to carry out an orderly survey, or confiscate concealed lands outright to fill the treasury?"
 oe_yr.5.a: "Dispatch commissioners to survey and equalize taxes"
 oe_yr.5.a.tt: "Costs 3 months of trade and tax income scaled by nobles' power (capped at 10 months).\nJiangzhe, Jiangxi and Henan-Jiangbei loyalty #R −2#! each; strain #R +2#!; completes the stage-two land survey requirement."
 oe_yr.5.b: "Confiscate concealed lands for the treasury"
 oe_yr.5.b.tt: "Gains #G +2#! months of trade and tax income; nobles' satisfaction drops sharply, peasants gain slightly.\nJiangzhe, Jiangxi and Henan-Jiangbei loyalty #R −5#! each; strain #R +4#!; #Y 25%#! chance that one provincial seat suffers #bold #color_yellow Unrest over Confiscated Lands#!#! (local unrest #R +0.5#! for #Y 12#! months); completes the land survey requirement."
 oe_yr.5.c: "Defer the measure"
 oe_yr.5.c.tt: "The debate returns in #Y 12#! months."
 oe_yr.6.t: "Restore Examinations on the Classics"
 oe_yr.6.desc_x: "#F In 1340 Toqto'a restored the civil examinations; even in 1351 as the Red Turbans rose, the court still examined and passed eighty-three jinshi graduates (History of Yuan, 42).#!\n\nThe court has chosen Han law reform, yet Middle Kingdom appointments still rest on direct appointment. The Ministry of Rites petitions to fund the change and restore examinations on the classics so the examination road reopens."
 oe_yr.6.a: "End direct appointment and restore examinations on the classics"
 oe_yr.6.a.tt: "Costs the standard Middle Kingdom law-change sum (from 6 months of trade and tax income, scaled by member count).\nSets the Middle Kingdom examination policy to Focus on Classics and moves societal value strongly toward Sinicized."
 oe_yr.6.b: "Put it off for now"
 oe_yr.6.b.tt: "First deferral returns in #Y 12#! months; deferring a second time closes this petition."
 oe_yr.7.t: "The Restoration Falters"
 oe_yr.7.desc_n1: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow, before the road was even firm, troubles came one after another, and the restoration has been given up."
 oe_yr.7.desc_n2: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow the road was chosen 10 years ago and its first stage never came; the restoration fades away."
 oe_yr.7.desc_n3: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow Dadu is lost, and there is no restoration to speak of."
 oe_yr.7.desc_n4: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow the Red Turban wars have ended in the court's defeat, and there is no restoration to speak of."
 oe_yr.7.desc_ah: "#F In the twentieth Zhizheng year (1360) the Chancellor of the Left Taiping resigned, pleading illness. Before that the heir apparent and the empress had sought an abdication in the heir's favour and sounded Taiping out; Taiping would not go along and lost their favour (so it is said, History of Yuan, 140).#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_ag: "#F Ministers who governed by Han law offended the grandees and seldom kept their places for long.#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_bh: "#F From the eighteenth Zhizheng year (1358) the Chancellor of the Right Chosgem and the eunuch Bak Bulhwa worked hand in glove inside and outside the palace, and bribes were taken openly (so the usual account).#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_bg: "#F A court that leans on grandees and revenue officials gathers money quickly, and resentment just as quickly.#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.desc_x: "#F In the last decades of the Yuan, plans to set the court in order were raised and dropped again and again: begun in a moment of calm, undone by the next crisis (so the usual account).#!\n\nNow the troubles come one after another (strain #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_strain')|0]#!), and some at court ask that the ministers of the reform be dismissed to quiet the realm."
 oe_yr.7.a: "Dismiss the ministers of the reform to quiet the realm"
 oe_yr.7.a.tt: "Retreat one stage: vanilla modifiers eased or removed at this stage are restored as they were (while not expired), and this stage's modifiers come off.\nStrain falls to #Y 4#!; the previous stage's months are counted again."
 oe_yr.7.b: "Stand by them"
 oe_yr.7.b.tt: "Costs #R 3#! months of trade and tax income\nNo stage is lost; strain falls to #Y 6#!. This can be done once a stage."
 oe_yr.7.c: "So be it"
 oe_yr.7.c.tt: "The restoration ends here: the easing and removal of vanilla's modifiers have been undone (while not expired), and this line's modifiers are gone."
 oe_yr.8.t: "Restoration Complete: The Zhizheng Renewal"
 oe_yr.8.desc_n: "#F When Khubilai founded the Yuan, Han institutions secured the realm; since the renewal of 1340, scholars and ministers alike had looked for the day civil governance would shine again (History of Yuan).#!\n\nFor a full year Han ministers, examinations, rising literacy, sound money, granaries, provinces and Celestial Authority have all held together. The old ills are gone, and the Yuan gains #bold #color_yellow The Zhizheng Renewal#!#! (cabinet efficiency #G +5%#!, monthly legitimacy #G +0.03#!, lasting while the dynasty stands)."
 oe_yr.8.desc_x: "#F When Khubilai founded the Yuan, Han institutions secured the realm; since the renewal of 1340, scholars and ministers alike had looked for the day civil governance would shine again (History of Yuan).#!\n\nFor a full year Han ministers, examinations, rising literacy, sound money, granaries, provinces and Celestial Authority have all held together. Both #bold #color_yellow Mongol-Han Strife#!#! and #bold #color_yellow Administration in Disarray#!#! are completely gone, and the Yuan gains the lasting modifier #bold #color_yellow The Zhizheng Renewal#!#! (cabinet efficiency #G +5%#!, monthly legitimacy #G +0.03#!, lasting while the dynasty stands)."
 oe_yr.8.a: "The Yuan is restored"
 oe_yr.8.a.tt: "The restoration route is complete: both Mongol-Han Strife and Administration in Disarray are fully removed; gains permanent #bold #color_yellow The Zhizheng Renewal#!#! (cabinet efficiency #G +5%#!, monthly legitimacy #G +0.03#!, lost only if the Yuan falls); strain is no longer counted."
 oe_yr.9.t: "Restoration Complete: The Ancestral Way"
 oe_yr.9.desc_n: "#F The steppe order rested on princely marches, steady grants and full granaries; kept unbroken, the ancestral ways could still hold both steppe and China under the Great Yuan (so the usual account).#!\n\nFor a full year the ancestral way, loyal princes, ample granaries, sound money, provinces and Celestial Authority have all held together. The old ills are gone, and the Yuan gains #bold #color_yellow Restoration of the Ancestral Way#!#! (levy size #G +10%#!, land morale #G +5%#!, lasting while the dynasty stands)."
 oe_yr.9.desc_x: "#F The steppe order rested on princely marches, steady grants and full granaries; kept unbroken, the ancestral ways could still hold both steppe and China under the Great Yuan (so the usual account).#!\n\nFor a full year the ancestral way, loyal princes, ample granaries, sound money, provinces and Celestial Authority have all held together. Both #bold #color_yellow Mongol-Han Strife#!#! and #bold #color_yellow Administration in Disarray#!#! are completely gone, and the Yuan gains #bold #color_yellow Restoration of the Ancestral Way#!#! (levy size #G +10%#!, land morale #G +5%#!, lasting while the dynasty stands)."
 oe_yr.9.a: "The Yuan is restored"
 oe_yr.9.a.tt: "The restoration route is complete: both Mongol-Han Strife and Administration in Disarray are fully removed; gains permanent #bold #color_yellow Restoration of the Ancestral Way#!#! (levy size #G +10%#!, land morale #G +5%#!, lost only if the Yuan falls); strain is no longer counted."
 oe_yr.10.t: "Hold the Imperial Examinations"
 oe_yr.10.desc_x: "#F The Yuan examinations were held every three years; in spring 1351, even with rebellions rising, the court examined eighty-three jinshi to bind the literati to the throne (History of Yuan, 42).#!\n\nThe triennial examination year has come again, and the Ministry of Rites requests an imperial examination. Only examinations held through this decree count toward stage three (currently #Y [GetCountry('CHI').MakeScope.ScriptValue('oe_yr_rd_keju')|0]#! of #Y 2#!)."
 oe_yr.10.a: "Hold the examinations"
 oe_yr.10.a.tt: "As the vanilla examination action: spends a small amount of Celestial Authority and summons a newly examined scholar; adds 1 to this route's examination count (next due in 36 months)."
 oe_yr.10.b: "Suspend this year's examinations"
 oe_yr.10.b.tt: "Spends no Celestial Authority and adds no count; the next examination falls due in 36 months."
 oe_yr.11.t: "Factions at Court"
 oe_yr.11.desc_ah: "#F In 1357 Taiping became Chancellor of the Left; friction between the Eastern Palace and the empress fed fierce factional struggles at court (so it is said, History of Yuan, 140).#!\n\nFactional rivalry between palace and Secretariat now threatens the court. Shall we spend funds to purge and secure court order for two years, seek a compromise, or lean on court favorites for immediate silver?"
 oe_yr.11.desc_ag: "#F As Han-law reforms deepen, court officials and palace favorites clash, pulling policy in opposite directions (so the usual account).#!\n\nFactional rivalry between palace and Secretariat now threatens the court. Shall we spend funds to purge and secure court order for two years, seek a compromise, or lean on court favorites for immediate silver?"
 oe_yr.11.desc_bh: "#F From 1358 the Chancellor of the Right Chosgem and the eunuch Bak Bulhwa worked hand in glove, concentrating power and intimidating officials (so the usual account).#!\n\nFavorites and grandees now dominate court business. Shall we spend funds to restore discipline for two years, seek a compromise, or let them raise emergency funds for the treasury?"
 oe_yr.11.desc_bg: "#F When grandees and palace favorites join hands to raise funds, silver comes quickly while court discipline erodes (so the usual account).#!\n\nFavorites and grandees now dominate court business. Shall we spend funds to restore discipline for two years, seek a compromise, or let them raise emergency funds for the treasury?"
 oe_yr.11.desc_x: "#F As Han-law reforms deepen, court officials and palace favorites clash, pulling policy in opposite directions (so the usual account).#!\n\nFactional rivalry between palace and Secretariat now threatens the court. Shall we spend funds to purge and secure court order for two years, seek a compromise, or lean on court favorites for immediate silver?"
 oe_yr.11.a: "Purge the court factions"
 oe_yr.11.a.tt: "Costs #R 2#! months of trade and tax income\nStrain #R +2#!; for the next #Y 24#! months, the stage-two court-order condition counts as met."
 oe_yr.11.b: "Seek a compromise at court"
 oe_yr.11.b.tt: "No gold spent and no strain added; the stage-two court-order condition is checked as normal."
 oe_yr.11.c: "Lean on favorites for emergency funds"
 oe_yr.11.c.tt: "Gains #G +2#! months of trade and tax income; strain #R +3#!; for the next #Y 12#! months, the stage-two court-order condition cannot be met."
 oe_yr.20.t: "The Yuan restoration: the choice takes effect"
