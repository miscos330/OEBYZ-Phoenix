l_english:
# NEW 2026-11-24 v25.0 Phase 4B 1337 Muscovy/Russia Deep Flavor & Mechanic Pack (oe_v250_mos_, gen_v250_1337_mos_yua.py) — english localization (179 keys). Edit gen_v250_1337_mos_yua.py, not this file.
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_yarlyk_patronage:0 "Vladimir Yarlyk & Sarai Patronage"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_yarlyk_patronage:0 "Remitting full tribute preserves the Golden Horde's yarlyk over Vladimir and strengthens princely leverage at a stiff fiscal drain."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kalita_moneybag:0 "Kalita's Moneybag Treasury"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kalita_moneybag:0 "Skimming Rus tribute silver into Moscow's treasury expands fiscal reach while provoking Horde suspicion and mild currency debasement."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_rus_tax_leniency:0 "Leniency for the Rus Towns"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_rus_tax_leniency:0 "Easing tribute quotas across northeastern Rus revives rural and urban prosperity at the cost of leaner grand-princely revenues."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_metropolitan_seat:0 "Seat of Metropolitan Peter"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_metropolitan_seat:0 "Anchoring the Metropolitanate beside the Dormition Cathedral crowns Moscow with spiritual primacy while magnifying clerical immunities."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kremlin_ramparts:0 "Borovitsky Hill Kremlin Ramparts"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kremlin_ramparts:0 "Expanding the oak-and-timber ramparts atop Borovitsky Hill hardens Moscow's citadel while straining builders and garrison upkeep."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_secular_fisc:0 "Princely Audit of Church Dues"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_secular_fisc:0 "Levying defense assessments upon cathedral estates steadies the grand-princely fisc at the price of clerical displeasure."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_sarai_embassy:0 "Golden Horde Embassy over Tver"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_sarai_embassy:0 "Lavish sable embassies along the lower Volga outmaneuver Tver at Sarai and steady vassals while draining court funds."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_western_marches:0 "Fortified Western Marches"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_western_marches:0 "Reinforcing western border forts against Tver and Lithuania steels garrison morale at heavier fort upkeep and frosty diplomacy."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_upper_volga_truce:0 "Upper Volga Princely Truce"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_upper_volga_truce:0 "A pragmatic truce along the upper Volga opens overland trade and eases domestic tension while blunting martial fervor."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_trinity_colonization:0 "Trinity Lavra Northern Colonization"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_trinity_colonization:0 "Disciples of Saint Sergius push monastic settlements deep into the northern forests, driving migration and faith while irking boyars."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_boyar_votchina_guard:0 "Protection of Boyar Votchinas"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_boyar_votchina_guard:0 "Capping monastic land grants preserves hereditary boyar votchinas and cavalry levies while enlarging aristocratic clout over clergy protests."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_sergius_concord:0 "Radonezh Frontier Concord"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_sergius_concord:0 "Crown arbitration balances monastic and lay claims in the northern woods, improving local order at a modest tax concession."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_vykhod_defiance:0 "Suspension of the Horde Vykhod"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_vykhod_defiance:0 "Withholding tribute amid Sarai's civil wars rallies Muscovite morale and levies while raising military upkeep and steppe hostility."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_steppe_arbitrage:0 "Steppe Court Arbitrage"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_steppe_arbitrage:0 "Paying token tribute to play rival khans against one another safeguards Volga caravans at the expense of martial prestige."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_heartland_hoard:0 "Heartland Granary & Workshop Reserve"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_heartland_hoard:0 "Channeling withheld silver into workshops and granaries lifts heartland output while vexing nobles who demanded war pay."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_white_stone_kremlin:0 "White-Stone Kremlin of Moscow"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_white_stone_kremlin:0 "Myachkovo limestone walls make Moscow the first stone citadel of northeastern Rus, deterring invaders at steep upkeep and tax strain."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_oka_abatis_line:0 "Oka River Frontier Bastions"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_oka_abatis_line:0 "Spreading earth-and-timber forts along the Oka crossings stiffens border defense and levies while slowing domestic construction."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_mobile_druzhina:0 "Mobile Princely Druzhina"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_mobile_druzhina:0 "Pouring funds into armored druzhina cavalry sharpens field shock while leaving urban walls more exposed to siege."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kulikovo_crusade:0 "Pan-Rus Muster for Kulikovo Field"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kulikovo_crusade:0 "Blessed by Saint Sergius, the pan-Rus host crosses the Don with steel discipline and fervor, exacting heavy upkeep and war strain."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_princely_coalition_charter:0 "Allied Rus Princes' Autonomy Charter"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_princely_coalition_charter:0 "Guaranteeing regional liberties secures loyal Rus princely banners and deep manpower reserves at a sharp cost to crown authority."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_oka_defensive_muster:0 "Cautious Defense of the Oka"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_oka_defensive_muster:0 "Holding the fortified Oka crossings preserves strongholds and treasure while dampening the offensive spirit of Rus banners."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_heartland_remission:0 "Post-Raid Tax Remission"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_heartland_remission:0 "Multi-year tax and levy remissions draw displaced families back to burned towns, restoring prosperity while pinching revenue and recruits."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_border_conscription:0 "Emergency Frontier Conscription"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_border_conscription:0 "Harsh emergency levies refill garrisons and harden border defenses at the cost of weary peasants and stalled rural recovery."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_guild_reconstruction:0 "Merchant-Financed Heartland Recovery"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_guild_reconstruction:0 "Loans from Surozh and Volga merchants rapidly revive workshops and markets while nudging inflation and burgher leverage upward."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_autocratic_primogeniture:0 "Autocratic Primogeniture"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_autocratic_primogeniture:0 "Crushing collateral appanage rivals entrenches vertical succession and central control amid bitter noble resentment and unrest."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_appanage_compact:0 "Collateral Appanage Compact"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_appanage_compact:0 "Honoring collateral princely estates ends civil bloodshed and wins aristocratic goodwill while weakening crown power and tax yield."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kasimov_auxiliaries:0 "Kasimov Tatar Service Auxiliaries"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kasimov_auxiliaries:0 "Enfeoffing loyal Tatar princes along the Oka supplies agile auxiliary horse while provoking fierce Orthodox clerical protest."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_autocephaly_1448:0 "1448 Autocephaly of the Russian Church"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_autocephaly_1448:0 "Rejecting Florence to consecrate Metropolitan Jonah independently steels Orthodox unity while cooling foreign diplomacy and western learning."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_constantinople_concord:0 "Canonical Concord with Constantinople"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_constantinople_concord:0 "Preserving canonical ties with Constantinople boosts diplomacy and Greek scholarship while unsettling fiercely independent local prelates."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_crown_church_oversight:0 "Grand Princely Oversight of the Synod"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_crown_church_oversight:0 "Tightening secular oversight over episcopal elections bolsters crown power and tax efficiency at steep clerical displeasure."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_veche_bell_silenced:0 "Silencing of Novgorod's Veche Bell"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_veche_bell_silenced:0 "Hauling off the Veche Bell and resettling Novgorodian elites cements crown control and taxation while chilling Baltic merchant trade."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_novgorod_fur_charter:0 "Novgorod Fur & Hanseatic Charter"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_novgorod_fur_charter:0 "Preserving Novgorod's merchant guilds under Muscovite customs multiplies Baltic fur revenue while conceding power to urban burghers."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_northern_fur_monopoly:0 "Crown Monopoly on Northern Furs"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_northern_fur_monopoly:0 "Directing northern sable and squirrel pelts through grand-princely factors boosts output and taxes while antagonizing private merchants."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_pomestye_ugra_triumph:0 "Pomestye Service Host & Ugra Triumph"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_pomestye_ugra_triumph:0 "Replacing hereditary boyar fiefs with pomestye service estates shatters the Tatar Yoke with disciplined cavalry at heavy social strain."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_duma_service_compromise:0 "Boyar Duma Service Compromise"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_duma_service_compromise:0 "Blending new service grants with hereditary votchinas steadies morale and domestic harmony while diluting central fiscal reform."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_ugra_gunpowder_wall:0 "Ugra River Gunpowder Batteries"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_ugra_gunpowder_wall:0 "Lining the frozen Ugra with bronze artillery and arquebusiers breaks steppe raids while raising army upkeep and narrowing mass levies."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_gosudar_all_rus:0 "Sovereign of All Rus"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_gosudar_all_rus:0 "Assuming the title Gosudar of All Rus elevates crown authority and dynastic standing while stoking noble wariness and governance friction."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_sudebnik_1497:0 "1497 Sudebnik Law Code"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_sudebnik_1497:0 "Codifying uniform Muscovite courts and St. George's Day peasant dues sharpens taxation and governance while tightening rural burdens."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_kremlin_cannon_yard:0 "Kremlin Royal Cannon Yard"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_kremlin_cannon_yard:0 "Master founders on the Neglinnaya cast bronze siege guns and fortress ordnance, lifting firepower at higher army and fort upkeep."
 STATIC_MODIFIER_NAME_oe_v250_mos_mod_northern_monasteries:0 "Chartered Northern Forest Monasteries"
 STATIC_MODIFIER_DESC_oe_v250_mos_mod_northern_monasteries:0 "Endowing northern wilderness monasteries drives conversion, assimilation, and frontier prosperity at a tangible loss in crown taxes."
 oe_v250_mos_ref_yarlyk_treasury:0 "Grand Princely Treasury & Vykhod Chancery"
 oe_v250_mos_ref_yarlyk_treasury_desc:0 "Centralizes tribute accounting, appanage purchases, and land ledgers inside Moscow's Kremlin chancery—raising cabinet efficiency, crown leverage, and tax yield at steeper court costs and boyar friction."
 oe_v250_mos_ref_pomestye_service_nobility:0 "Pomestye Service-Estate Autocracy"
 oe_v250_mos_ref_pomestye_service_nobility_desc:0 "Binds land tenure directly to lifelong mounted military service to the Sovereign—expanding manpower, heavy cavalry punch, and morale at the price of deepening serfdom and slower scholarship."
 oe_v250_mos_priv_mestnichestvo_charter:0 "Boyar Mestnichestvo Precedence Charter"
 oe_v250_mos_priv_mestnichestvo_charter_desc:0 "Upholds hereditary mestnichestvo rank precedence for Moscow's ancient boyar clans—securing aristocratic loyalty, heavy horse, and defense while enlarging noble power and clogging cabinet meritocracy."
 oe_v250_mos_priv_monastic_votchina_immunity:0 "Trans-Volga Monastic Land Immunity"
 oe_v250_mos_priv_monastic_votchina_immunity_desc:0 "Grants tax and judicial immunities to Trinity Lavra and the northern forest monasteries—accelerating colonization, assimilation, and religious standing while widening clerical power and trimming crown tax yield."
 oe_v250_mos_cab_vykhod_census:0 "Pistsovaya Kniga Cadastre & Vykhod Audit"
 oe_v250_mos_cab_vykhod_census_desc:0 "Dispatches Kremlin scribes to compile Pistsovaya Kniga land cadasters across a target province—lifting provincial control, local output, and crown tax efficiency while chafing rural taxpayers."
 oe_v250_mos_cab_vykhod_census_action:0 "Pistsovaya Kniga Cadastre & Vykhod Audit: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mos_cab_vykhod_census_active:0 "Pistsovaya Kniga Cadastre & Vykhod Audit in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_mos_cab_vykhod_census_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_vykhod_census_action_progress_wordier:0 "Pistsovaya Kniga Cadastre & Vykhod Audit ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_vykhod_census_action_progress_tooltip:0 "Dispatches Kremlin scribes to compile Pistsovaya Kniga land cadasters across a target province—lifting provincial control, local output, and crown tax efficiency while chafing rural taxpayers."
 oe_v250_mos_cab_vykhod_census_select_province:0 "Select a Province for Pistsovaya Kniga Cadastre Audit"
 oe_v250_mos_cab_vykhod_census_no_provinces:0 "@trigger_no! No eligible provinces available for Pistsovaya Kniga Audit."
 oe_v250_mos_cab_zasechnaya_abatis:0 "Zasechnaya Cherta Frontier Watch"
 oe_v250_mos_cab_zasechnaya_abatis_desc:0 "Mobilizes frontier pioneers to fell timber abatis lines and erect watchtowers across a border or fortified province—reinforcing defenses, garrisons, and manpower at higher fort upkeep and modest fiscal drag."
 oe_v250_mos_cab_zasechnaya_abatis_action:0 "Zasechnaya Cherta Frontier Watch: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mos_cab_zasechnaya_abatis_active:0 "Zasechnaya Cherta Frontier Watch in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_mos_cab_zasechnaya_abatis_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_zasechnaya_abatis_action_progress_wordier:0 "Zasechnaya Cherta Frontier Watch ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mos_cab_zasechnaya_abatis_action_progress_tooltip:0 "Mobilizes frontier pioneers to fell timber abatis lines and erect watchtowers across a border or fortified province—reinforcing defenses, garrisons, and manpower at higher fort upkeep and modest fiscal drag."
 oe_v250_mos_cab_zasechnaya_abatis_select_province:0 "Select a Border or Fortified Province for Zasechnaya Frontier Watch"
 oe_v250_mos_cab_zasechnaya_abatis_no_provinces:0 "@trigger_no! No eligible border or fortified provinces available for Zasechnaya Watch."
 oe_v250_mos_dec_sovereign_of_all_rus.title:0 "Proclaim Sovereign of All Rus"
 oe_v250_mos_dec_sovereign_of_all_rus.desc:0 "Uniting Moscow, Vladimir, and the northeastern Rus heartlands, formally claim the supreme title Gosudar of All Rus. Costs #Y 150#! gold and grants the permanent #Y Sovereign of All Rus#! modifier (boosting crown power, legitimacy, and diplomacy at a cost to noble satisfaction and stability efficiency)."
 oe_v250_mos_dec_sovereign_of_all_rus.a:0 "Proclaim the Sovereign of All Rus!"
 oe_v250_mos_dec_sudebnik_code.title:0 "Promulgate the 1497 Sudebnik Law Code"
 oe_v250_mos_dec_sudebnik_code.desc:0 "Task Kremlin jurists with compiling the first unified law code of all Rus—standardizing princely courts, fiscal fees, and St. George's Day rural movement rules. Requires the year #Y 1450#! and #Y 140#! gold; grants the permanent #Y 1497 Sudebnik Law Code#! modifier (lifting taxation, cabinet, and legislation at heavier peasant and court strain)."
 oe_v250_mos_dec_sudebnik_code.a:0 "Promulgate the Sudebnik Across All Rus"
 oe_v250_mos_dec_expand_kremlin_arsenal.title:0 "Commission the Kremlin Cannon Yard"
 oe_v250_mos_dec_expand_kremlin_arsenal.desc:0 "Commission master bronze founders along Moscow's Neglinnaya River to establish a royal cannon yard supplying siege and fortress batteries. Requires #Y 1440#!, ownership of Moscow, and #Y 180#! gold; grants the permanent #Y Kremlin Royal Cannon Yard#! modifier (raising siege ability and defense at heavier army and fort upkeep)."
 oe_v250_mos_dec_expand_kremlin_arsenal.a:0 "Fund the Kremlin Royal Cannon Yard"
 oe_v250_mos_dec_northern_monastic_grants.title:0 "Charter the Northern Forest Monasteries"
 oe_v250_mos_dec_northern_monastic_grants.desc:0 "Repeatable every #Y 15 years#!. Spend #Y 90#! gold to endow northern wilderness monasteries with salt-works and frontier charters, granting religious influence and a #Y 12#!-year #Y Chartered Northern Forest Monasteries#! modifier (boosting assimilation, conversion, and prosperity while trading away crown taxes and clerical leverage)."
 oe_v250_mos_dec_northern_monastic_grants.a:0 "Issue the Northern Monastic Charters"
 oe_v250_mos_monastic_cd_tt:0 "Have not chartered Northern Forest Monasteries within the last 15 years"
 oe_v250_mos.1.t:0 "The Vladimir Yarlyk & Horde Tax Collector"
 oe_v250_mos.1.d:0 "Holding Khan Oz Beg's yarlyk for the Grand Principality of Vladimir, Ivan I Kalita—'Moneybag'—collects the vykhod silver tribute across northeastern Rus on Sarai's behalf. As Horde envoys await the autumn remittance outside Moscow's oak walls, the council weighs three courses: send every ounce to lock in Golden Horde backing, skim silver quietly into the Kremlin's war chest to buy rival appanages, or ease quotas on Rus towns to build grassroots devotion."
 oe_v250_mos.1.a:0 "Remit the full silver tribute to secure Sarai's military backing"
 oe_v250_mos.1.b:0 "Skim tribute silver into Kalita's Moneybag to finance expansion"
 oe_v250_mos.1.c:0 "Grant selective tribute relief to win over Rus towns and villages"
 oe_v250_mos.2.t:0 "Metropolitan Peter's Seat & The Kremlin Hill"
 oe_v250_mos.2.d:0 "Ever since Metropolitan Peter moved the See of Kiev and All Rus to Moscow and was entombed inside the Dormition Cathedral, Borovitsky Hill has radiated unmatched spiritual prestige. Now the Grand Prince and Metropolitan Theognostus debate Moscow's next great outlay: lavish endowments to cement ecclesiastical legitimacy, costly timber-and-stone ramparts encircling the hill, or secular defense dues levied upon church lands to spare the treasury."
 oe_v250_mos.2.a:0 "Endow the Metropolitan Seat and Cathedral Square for spiritual legitimacy"
 oe_v250_mos.2.b:0 "Drain the treasury to raise formidable Kremlin ramparts"
 oe_v250_mos.2.c:0 "Assess fortification taxes on clerical estates to protect the fisc"
 oe_v250_mos.3.t:0 "Rivalry with Tver & The Golden Horde Embassy"
 oe_v250_mos.3.d:0 "The princes of Tver refuse to concede the Grand Princely seat of Vladimir, courting Lithuanian marital alliances with Grand Duke Algirdas while dispatching envoys down the Volga to sway Khan Janibeg at Sarai. Moscow must choose whether to outspend Tver in the Horde's court, fortify the western marches against a Lithuanian-Tverian pincer, or sign a pragmatic Upper Volga truce to keep overland caravans flowing."
 oe_v250_mos.3.a:0 "Outbid Tver with lavish sable gifts at Khan Janibeg's court"
 oe_v250_mos.3.b:0 "Fortify the western marches and drill garrisons against Tver and Lithuania"
 oe_v250_mos.3.c:0 "Broker an Upper Volga commercial truce to calm princely feuds"
 oe_v250_mos.4.t:0 "Saint Sergius of Radonezh & Trinity Lavra"
 oe_v250_mos.4.d:0 "Deep in the northern pinewoods above Moscow, Abbot Sergius of Radonezh has transformed a humble hermitage into the disciplined cenobitic Trinity Monastery. His disciples are founding daughter houses across the Trans-Volga wilderness—drawing peasant settlers northward while provoking loud complaints from boyar clans whose hereditary votchinas lose tenants and timberland to tax-exempt monastic charters."
 oe_v250_mos.4.a:0 "Charter monastic colonization of the northern forests under Saint Sergius"
 oe_v250_mos.4.b:0 "Uphold boyar votchina claims and cap monastic land acquisitions"
 oe_v250_mos.4.c:0 "Mediate a crown-supervised concord dividing northern timberlands"
 oe_v250_mos.5.t:0 "Great Troubles in Sarai: Withholding the Vykhod"
 oe_v250_mos.5.d:0 "Since Khan Berdibeg's assassination, the Golden Horde has spiraled into the Great Troubles—rival khans seizing and losing Sarai within months while warlord Mamai carves out the western steppe. Inside the Kremlin's council chamber, fiery commanders urge suspending the vykhod tribute altogether to rearm Moscow, while cooler heads advise paying nominal bribes to keep rival khans fighting or diverting withheld silver into heartland workshops."
 oe_v250_mos.5.a:0 "Suspend the vykhod tribute boldly and arm Moscow's banners"
 oe_v250_mos.5.b:0 "Pay token tribute to play Sarai's rival khans against each other"
 oe_v250_mos.5.c:0 "Quietly invest the retained silver into granaries and iron workshops"
 oe_v250_mos.6.t:0 "White-Stone Fortress of Dmitry Donskoy"
 oe_v250_mos.6.d:0 "After devastating fire gutted the wooden Kremlin, Grand Prince Dmitry faces simultaneous threats from Grand Duke Algirdas of Lithuania and steppe raiders. He proposes floating vast barges of white limestone from Myachkovo up the Moskva to raise the first stone citadel in northeastern Rus—though cautious stewards argue that spreading timber bastions across the Oka frontier or equipping mobile druzhina horse would strain the treasury less."
 oe_v250_mos.6.a:0 "Quarry Myachkovo limestone and raise the White-Stone Kremlin"
 oe_v250_mos.6.b:0 "Fortify the Oka river towns with dispersed frontier earthworks"
 oe_v250_mos.6.c:0 "Settle for earthworks and equip a hard-hitting mobile druzhina"
 oe_v250_mos.7.t:0 "The Kulikovo Field Muster"
 oe_v250_mos.7.d:0 "Warlord Mamai drives northward with steppe cavalry and Genoese infantry to break Muscovy once and for all. At Kolomna, Dmitry summons every northeastern Rus prince while Saint Sergius dispatches the warrior-monks Peresvet and Oslyabya to bless the banners. Before the decisive crossing of the Don, Moscow must choose between an all-out pan-Rus crusade, broad autonomy grants to rally wavering princes, or a cautious defensive stand along the Oka."
 oe_v250_mos.7.a:0 "Cross the Don in a pan-Rus crusade against Mamai's host"
 oe_v250_mos.7.b:0 "Grant regional autonomy charters to guarantee allied Rus banners"
 oe_v250_mos.7.c:0 "Hold the fortified Oka river crossings and wear the enemy down"
 oe_v250_mos.8.t:0 "Tokhtamysh's Raid & Rebuilding the Heartland"
 oe_v250_mos.8.d:0 "Even triumph on the Don could not spare the Oka-Volga heartland from Khan Tokhtamysh's lightning raid, which left wooden suburbs charred and granaries plundered. Surveying the blackened beams around Moscow, the council must decide whether to grant generous tax remissions so devastated towns can heal, enforce harsh emergency conscription to deter another steppe strike, or borrow heavily from merchant guilds to rebuild workshops and markets."
 oe_v250_mos.8.a:0 "Grant multi-year tax remissions to revive burned towns and farms"
 oe_v250_mos.8.b:0 "Impose emergency frontier conscription to man the southern watches"
 oe_v250_mos.8.c:0 "Borrow from Surozh and Volga merchant guilds to restore trade"
 oe_v250_mos.9.t:0 "The Muscovite Feudal War: Vasily II vs Shemyaka"
 oe_v250_mos.9.d:0 "Ambiguities in Dmitry Donskoy's testament have erupted into a ruthless dynastic war pitting vertical primogeniture (Vasily II) against collateral seniority (Yury of Zvenigorod and his sons Vasily Kosoy and Dmitry Shemyaka). The outcome will define Muscovy's constitutional future: crush the collateral appanages to forge an indivisible autocracy, compromise with the princely clans, or enlist loyal Kasimov Tatar cavalry to tip the balance."
 oe_v250_mos.9.a:0 "Crush the collateral appanage princes and entrench vertical autocracy"
 oe_v250_mos.9.b:0 "Sign an aristocratic compact guaranteeing collateral appanage rights"
 oe_v250_mos.9.c:0 "Enfeoff loyal Kasimov Tatar cavalry on the Oka to break the rebels"
 oe_v250_mos.10.t:0 "Autocephaly of the Russian Orthodox Church (1448)"
 oe_v250_mos.10.d:0 "After Metropolitan Isidore signed the Union of Florence acknowledging papal supremacy, Moscow denounced the pact as apostasy and imprisoned him. Now a synod of Rus bishops convenes inside the Dormition Cathedral, urging the Grand Prince to consecrate Bishop Jonah of Ryazan as Metropolitan of Kiev and All Rus without awaiting Constantinople's sanction—proclaiming de facto autocephaly for the Russian Orthodox Church."
 oe_v250_mos.10.a:0 "Reject Florence and proclaim an independent Moscow Metropolitanate"
 oe_v250_mos.10.b:0 "Seek canonical concord with Constantinople to preserve Greek ties"
 oe_v250_mos.10.c:0 "Assert direct grand-princely oversight over all episcopal elections"
 oe_v250_mos.11.t:0 "Novgorod's Veche Bell & The Northern Fur Trade"
 oe_v250_mos.11.d:0 "Lord Novgorod the Great commands the vast squirrel-and-sable hinterlands reaching the White Sea along with Hanseatic silver at the Peterhof Kontor, yet its oligarchic boyars court Polish-Lithuanian treaties to defend their ancient veche against Moscow's sovereignty. Whether Moscow tears down the Veche Bell and deports rival families, integrates Novgorod's merchants under crown customs, or declares a royal fur monopoly will reshape northern Rus."
 oe_v250_mos.11.a:0 "Pull down the Veche Bell and resettle Novgorodian boyars inland"
 oe_v250_mos.11.b:0 "Integrate Novgorod's merchants and preserve Hanseatic fur charters"
 oe_v250_mos.11.c:0 "Establish a direct grand-princely monopoly over northern furs"
 oe_v250_mos.12.t:0 "Pomestye Service-Estates & Great Stand on the Ugra"
 oe_v250_mos.12.d:0 "Confiscated northern and appanage estates give Ivan III the land needed to forge a loyal class of pomeshchiki—mounted service gentry whose tenures depend upon answering the Sovereign's military muster—replacing autonomous boyar votchinas. As Khan Akhmat's Great Horde confronts Moscow's artillery across the freezing Ugra River, Muscovy stands on the brink of ending two and a half centuries of the Tatar Yoke forever."
 oe_v250_mos.12.a:0 "Institute the Pomestye service nobility and break the Tatar Yoke"
 oe_v250_mos.12.b:0 "Blend Pomestye grants with Boyar votchinas in a Duma compromise"
 oe_v250_mos.12.c:0 "Pour silver into bronze artillery and arquebusiers along the Ugra"
