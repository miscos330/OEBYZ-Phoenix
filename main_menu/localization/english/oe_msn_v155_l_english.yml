 oe_msn_mlc_07_sumatra_twin_shores_req_tt:0 "Own Pasai or Banda Aceh, and own Palembang or Siak."
 oe_msn_mlc_08_straits_fortress_fleet:0 "Iron Straits Fleet: Defy Oceanic Monopolies"
 oe_msn_mlc_08_straits_fortress_fleet_desc:0 "Fortify the narrows and expand an elite war fleet capable of repelling European monopoly armadas."
 oe_msn_mlc_08_straits_fortress_fleet_req_tt:0 "Have ports and at least 20 Locations in the Age of Reformation or later."
 oe_msn_mlc_09_zheng_he_depot:0 "Zheng He's Depot: Eastern Ocean Alliance"
 oe_msn_mlc_09_zheng_he_depot_desc:0 "Maintain an imperial maritime supply depot and diplomatic embassies bridging East Asia and the southern seas."
 oe_msn_mlc_09_zheng_he_depot_req_tt:0 "Hold at least 200 Gold in the Age of Renaissance or later."
 oe_msn_mlc_10_indian_ocean_spice_mart:0 "Indian Ocean Spice & Textile Mart"
 oe_msn_mlc_10_indian_ocean_spice_mart_desc:0 "Exchange Moluccan cloves and Sumatran pepper for Indian textiles and Chinese porcelain in unrivaled volume."
 oe_msn_mlc_10_indian_ocean_spice_mart_req_tt:0 "Have at least one port and 350 Gold."
 oe_msn_mlc_11_golden_malay_letters:0 "Malay Annals & Archipelago Cultural Zenith"
 oe_msn_mlc_11_golden_malay_letters_desc:0 "Commission royal chronicles and literary works that make classical Malay the prestige tongue of maritime Southeast Asia."
 oe_msn_mlc_11_golden_malay_letters_req_tt:0 "Have at least 15 Stability in the Age of Reformation or later."
 oe_msn_mlc_12_lord_of_the_two_seas:0 "Eternal Lord of the Two Seas"
 oe_msn_mlc_12_lord_of_the_two_seas_desc:0 "Commanding the crossroads of Asia with impartial law, invincible fleets, and inexhaustible commerce crowns the Eternal Lord of the Two Seas."
 oe_msn_mlc_12_lord_of_the_two_seas_req_tt:0 "Own Malacca and either Pasai or Temasek with at least 18 Stability in the Age of Absolutism or later."
