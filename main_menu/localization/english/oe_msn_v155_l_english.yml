# NEW 2026-11-22 v15.5 Stars of East Asia — v15.5 SE Asia Mission Trees (oe_msn_30..33). Generated by gen_v155_east_se_asia.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m1:0 "Northern Passes & Giao Chi Ordnance"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m1:0 "Fortified Lang Son passes backed by rapid-firing Giao Chi arquebusiers render Dai Viet's northern frontier impregnable."
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m2:0 "Nam Tien: Red River to Mekong Corridor"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m2:0 "Stretching from Thang Long through Vijaya to Prey Nokor unites coastal harbors with the vast Mekong rice bowl."
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m3:0 "Hong Duc Code & Van Don Silk Commerce"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m3:0 "Hong Duc administration, temple examinations, and Van Don's bustling silk harbor fuel sustained prosperity and scholarship."
 STATIC_MODIFIER_NAME_oe_sea2_msn_dai_m4:0 "Eternal Sovereign of Dai Viet"
 STATIC_MODIFIER_DESC_oe_sea2_msn_dai_m4:0 "Uniting northern citadels, central ports, and the Mekong delta, Dai Viet endures as an unshakeable Southeast Asian power."
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m1:0 "Sakdina Order & Royal Elephant Corps"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m1:0 "Sakdina administrative precision paired with armored royal war elephants anchors Siamese sovereignty across Indochina."
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m2:0 "Two-Sea Hegemon of Indochina"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m2:0 "From Lan Na and Angkor to the Andaman and Gulf coasts, Ayutthaya commands mainland rivers and two-ocean trade."
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m3:0 "Celadon Kilns & Cosmopolitan Emporium"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m3:0 "Celadon exports, royal junks, and cosmopolitan foreign quarters make Ayutthaya one of the richest courts in Asia."
 STATIC_MODIFIER_NAME_oe_sea2_msn_ayu_m4:0 "Chakravartin of Eternal Siam"
 STATIC_MODIFIER_DESC_oe_sea2_msn_ayu_m4:0 "Blessed with fertile deltas, skilled diplomacy, and modern arms, the Chakravartin throne reigns supreme over mainland Southeast Asia."
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m1:0 "Palapa Oath: Jong Maritime Supremacy"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m1:0 "Teak Jong armadas and sacred mandala bonds bind island vassals firmly to Majapahit's sovereign throne."
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m2:0 "Java to Moluccas Spice Thalassocracy"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m2:0 "Controlling Sumatra, the straits, and the Moluccan spice islands restores Majapahit's oceanic supremacy across Nusantara."
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m3:0 "Nagarakretagama & Pasisir Emporia"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m3:0 "Thriving northern Java ports and classical literary patronage elevate Majapahit's commerce and cultural renown."
 STATIC_MODIFIER_NAME_oe_sea2_msn_maj_m4:0 "Eternal Sovereign of Nusantara"
 STATIC_MODIFIER_DESC_oe_sea2_msn_maj_m4:0 "From Sumatra to the Spice Islands, unrivaled Jong fleets and monsoon commerce crown Majapahit eternal sovereign of Nusantara."
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m1:0 "Straits Maritime Code & Shahbandars"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m1:0 "Impartial maritime law, four Shahbandars, and vibrant scholarship make the strait Asia's premier hub of commercial trust."
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m2:0 "Twin Shores & Straits Battle Fleet"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m2:0 "Commanding both the Malay Peninsula and Sumatra locks the strait behind fortified harbors and victorious warships."
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m3:0 "Treasure Depot & Indian Ocean Spice Mart"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m3:0 "Bridging Chinese porcelain fleets and Indian Ocean spice merchants fuels unmatched customs wealth and Malay cultural reach."
 STATIC_MODIFIER_NAME_oe_sea2_msn_mlc_m4:0 "Eternal Lord of the Two Seas"
 STATIC_MODIFIER_DESC_oe_sea2_msn_mlc_m4:0 "Master of the hinge between the Indian Ocean and South China Sea, the sultanate reigns eternal over Eurasia's vital maritime artery."
 oe_msn_dai_destiny:0 "#bold #color_yellow Dai Viet: Destiny from Red River to Mekong#!#!"
 oe_msn_dai_destiny_DESCRIPTION:0 "From Red River Dykes and Hong Duc Law to the Southern March"
 oe_msn_dai_destiny_CRITERIA_DESCRIPTION:0 "Secure Thang Long and Thanh Hoa, forge Giao Chi firearms, codify Hong Duc law, and complete Nam Tien to the Mekong."
 oe_msn_dai_destiny_BUTTON_TOOLTIP:0 "Embark on the Dai Viet Destiny"
 oe_msn_dai_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Dai Viet: fortify the Red River dykes and northern Lang Son passes with Giao Chi firearms, advance the Nam Tien southern march through Hue and Vijaya to Prey Nokor, and crown the realm with the Hong Duc Code and Van Don silk trade."
 oe_msn_dai_01_red_river_dykes:0 "Red River Dykes: Anchor Thang Long & Van Don"
 oe_msn_dai_01_red_river_dykes_desc:0 "Reinforcing the great earthen dykes of the Red River Delta protects double-cropped rice plains around our [capital|e] of Thang Long while linking river barges to Van Don harbor. Hydraulic [buildings|e] sustain steady [prosperity|e] and secure the agrarian [stability|e] of Dai Viet."
 oe_msn_dai_01_red_river_dykes_req_tt:0 "Own Thang Long and Van Don, have at least 5 Stability, and own a Granary or Aqueduct System."
 oe_msn_dai_02_lam_son_banner:0 "Lam Son Banner: Heartland of Thanh Hoa"
 oe_msn_dai_02_lam_son_banner_desc:0 "From the rugged foothills of Lam Son through Thanh Hoa and Nghe An, resilient highland communities form the martial reservoir of Vietnamese independence, supplying loyal [manpower|e] and tenacious [army_tradition|e]. Anchoring mountain [fort|e] strongholds gives our [army|e] strategic depth against any northern storm."
 oe_msn_dai_02_lam_son_banner_req_tt:0 "Control Thanh Hoa and Nghe An (directly or via subject) and own a Castle or Weapon Guild."
 oe_msn_dai_03_giao_chi_firearms:0 "Giao Chi Arquebuses: Gunpowder Arsenals"
 oe_msn_dai_03_giao_chi_firearms_desc:0 "Renowned across East Asia for their crisp breech-loading fire and long barrels, Giao Chi arquebuses and river-galley cannon turn royal arsenals into pioneers of gunpowder [advances|e]. Equipping salaried [regulars|e] with state-forged firearms sharpens [army_tradition|e] and spreads martial [prestige|e] throughout Indochina."
 oe_msn_dai_03_giao_chi_firearms_req_tt:0 "In the Age of Renaissance or later, own Thang Long, hold 220 Gold and 15 Army Tradition, own a Cannon Maker or Armory, and embrace Professional Armies or research its advance."
 oe_msn_dai_04_northern_pass_shield:0 "Lang Son Passes: The Northern Shield"
 oe_msn_dai_04_northern_pass_shield_desc:0 "Where limestone defiles funnel invasion roads through Lang Son and Chi Lang Pass, layered stone walls and ambush redoubts create an impenetrable northern [fort|e] shield. Permanent frontier [control|e] protects highland [stability|e] and keeps northern emperors content with respectful [diplomacy|e]."
 oe_msn_dai_04_northern_pass_shield_req_tt:0 "In the Age of Discovery or later, control Lang Son (directly or via subject), have 15 Stability and 22 Army Tradition, and own Training Fields or a Castle."
 oe_msn_dai_05_hue_coastal_march:0 "Hue Coastal March: Beyond Hai Van"
 oe_msn_dai_05_hue_coastal_march_desc:0 "Marching beyond the cloud-wreathed Hai Van Pass establishes Thuan Hoa along the Perfume River as our central coastal [core|e] and forward base for the Nam Tien southward advance. Settling soldier-farmers spurs regional [development|e], extends crown [control|e], and lifts our [prestige|e] along the Annamite coast."
 oe_msn_dai_05_hue_coastal_march_req_tt:0 "Control Amarendrapura (Hue / Thuan Hoa) directly or through a non-sovereign subject."
 oe_msn_dai_06_vijaya_nam_tien:0 "Nam Tien Triumph: Master Vijaya"
 oe_msn_dai_06_vijaya_nam_tien_desc:0 "Taking the brick-towered Cham capital of Vijaya fulfills Emperor Le Thanh Tong's southward vision, transforming central coastal valleys into an integrated Vietnamese [core|e]. Mastering Cham ports expands our [army_tradition|e], unlocks central [trade|e] coves, and stimulates coastal [prosperity|e]."
 oe_msn_dai_06_vijaya_nam_tien_req_tt:0 "Control Vijaya directly or through a non-sovereign subject."
 oe_msn_dai_07_panduranga_frontier:0 "Panduranga Coast & Southern Shipyards"
 oe_msn_dai_07_panduranga_frontier_desc:0 "Reaching the sunlit bays of Panduranga anchors a string of deep-water timber yards along the South China Sea, recruiting seasoned coastal [sailors|e] and expanding [navy_tradition|e]. Armed war galleys patrol every headland, strengthening our [navy|e] and asserting resolute [maritime_presence|e] along the East Sea."
 oe_msn_dai_07_panduranga_frontier_req_tt:0 "Control Panduranga (directly or via subject), hold at least 45 Locations, and own at least 5 Ports."
 oe_msn_dai_08_mekong_delta_pearl:0 "Pearl of the Mekong: Prey Nokor"
 oe_msn_dai_08_mekong_delta_pearl_desc:0 "Transforming Prey Nokor into Gia Dinh unlocks the boundless alluvial plains of the Mekong Delta, forming a southern rice granary and bustling commercial [core|e]. Canal networks speed urban [development|e], funneling delta surplus into our [market|e] and multiplying southern [prosperity|e]."
 oe_msn_dai_08_mekong_delta_pearl_req_tt:0 "In the Age of Reformation or later, control Prey Nokor (Gia Dinh / Saigon) directly or via subject and own a Shipyard or Customs House."
 oe_msn_dai_09_hong_duc_code:0 "The Hong Duc Legal Code"
 oe_msn_dai_09_hong_duc_code_desc:0 "Promulgating the progressive Hong Duc Code protects property rights, women's inheritance, and honest courts, exalting Dai Viet's [legitimacy|e] as a Realm of Manifest Civility. Juridical clarity streamlines our [cabinet|e], deepens [cultural_tradition|e], and fosters widespread [literacy|e] in both classical script and Chu Nom."
 oe_msn_dai_09_hong_duc_code_req_tt:0 "In the Age of Renaissance or later, own Thang Long, own a University or Library, and keep Nobles Satisfaction at least 50% (if present)."
 oe_msn_dai_10_van_don_silk_port:0 "Van Don Silk & Ceramic Emporium"
 oe_msn_dai_10_van_don_silk_port_desc:0 "From Chu Dau blue-and-white kilns to Tonkin mulberry looms, prized Vietnamese ceramics and raw silk sail out of Van Don and Pho Hien into regional [trade|e]. Welcoming Japanese, Chinese, and Malay vessels into our [market|e] fills the treasury with [gold|e] and enriches artisan [buildings|e]."
 oe_msn_dai_10_van_don_silk_port_req_tt:0 "Own Van Don and Thang Long, hold 300 Gold, earn 22 monthly trade and tax income, and own a Porcelain Guild or Wharf."
 oe_msn_dai_11_nha_nhac_civil_exam:0 "Temple Examinations & Nha Nhac Court"
 oe_msn_dai_11_nha_nhac_civil_exam_desc:0 "Inscribing doctoral laureates onto stone turtle stelae at the Temple of Literature while court orchestras perform stately Nha Nhac crowns our [capital|e] with enduring [cultural_tradition|e]. Meritocratic examinations elevate [crown_power|e] and raise scholarly [estate_satisfaction|e] across every prefecture."
 oe_msn_dai_11_nha_nhac_civil_exam_req_tt:0 "In the Age of Reformation or later, own Thang Long, have 15 Stability, Capital Development 30, and keep Clergy Satisfaction at least 50% (if present)."
 oe_msn_dai_12_eternal_dai_viet:0 "Eternal Dai Viet: Sovereign of the South"
 oe_msn_dai_12_eternal_dai_viet_desc:0 "Spanning from the Red River's misted peaks to the fertile Mekong mouth, a unified Dai Viet stands proudly as the Sovereign of the South and a commanding [great_power|e]. Armed with modern [institutions|e], high [development|e], and unshakable imperial [prestige|e], our mountain-and-river realm endures unconquered."
 oe_msn_dai_12_eternal_dai_viet_req_tt:0 "In the Age of Absolutism or later, control Thang Long, Vijaya, and Prey Nokor (directly or via subject), have 18 Stability, and be a Great Power or earn at least 75 monthly trade and tax income."
 oe_msn_ayu_destiny:0 "#bold #color_yellow Ayutthaya & Sukhothai: Destiny of the Chao Phraya#!#!"
 oe_msn_ayu_destiny_DESCRIPTION:0 "From Floating Rice Plains and Sakdina Law to Chakravartin Supremacy"
 oe_msn_ayu_destiny_CRITERIA_DESCRIPTION:0 "Unite Ayutthaya and Sukhothai, enact the Sakdina code, project dominance over Lan Na and Angkor, and crown a cosmopolitan maritime court."
 oe_msn_ayu_destiny_BUTTON_TOOLTIP:0 "Embark on the Ayutthaya Destiny"
 oe_msn_ayu_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Ayutthaya and Sukhothai: master the Chao Phraya rice delta, codify Sakdina governance and royal war elephant corps, project influence across Lan Na, Angkor, and two seas, and enrich the court through Sawankhalok ceramics and cosmopolitan diplomacy."
 oe_msn_ayu_01_chao_phraya_crown:0 "Chao Phraya Crown: Floating Rice Heartland"
 oe_msn_ayu_01_chao_phraya_crown_desc:0 "Surrounded by three converging rivers, the island [capital|e] of Ayutthaya harvests monsoon floods with resilient floating rice that fills royal granaries and sustains abundant [prosperity|e]. Taming the Chao Phraya floodplain anchors early [stability|e] and accelerates riverine [development|e]."
 oe_msn_ayu_01_chao_phraya_crown_req_tt:0 "Control Ayodhya or Sukhothai (directly or via subject), have 5 Stability, and own a Granary or Marketplace."
 oe_msn_ayu_02_sakdina_ministries:0 "Sakdina Civil & Military Ministries"
 oe_msn_ayu_02_sakdina_ministries_desc:0 "King Trailok's Sakdina statutes assign every prince, official, and freeman a precise rank of dignity, separating the Samuha Nayok civil administration from the Kalahom war ministry inside our [cabinet|e]. Clear hierarchy bolsters royal [crown_power|e], deepens [legitimacy|e], and balances noble [estates|e]."
 oe_msn_ayu_02_sakdina_ministries_req_tt:0 "Control Ayodhya or Lopburi (directly or via subject), have 10 Stability, and keep Nobles Satisfaction at least 50% (if present)."
 oe_msn_ayu_03_royal_white_elephants:0 "Sacred White Elephants & Armored Corps"
 oe_msn_ayu_03_royal_white_elephants_desc:0 "Auspicious white elephants housed beside the Grand Palace proclaim the monarch's sacred fortune, while armored war elephants mounting swivel guns spearhead our [army|e] alongside musketeer auxiliaries. Blending tusked shock tactics with gunpowder [advances|e] sharpens [army_tradition|e] and exalts royal [prestige|e]."
 oe_msn_ayu_03_royal_white_elephants_req_tt:0 "In the Age of Renaissance or later, hold 220 Gold and 15 Army Tradition, own an Armory or Cannon Maker, and embrace Professional Armies or research its advance."
 oe_msn_ayu_04_phrai_luang_corps:0 "Phrai Luang Standing Regiments"
 oe_msn_ayu_04_phrai_luang_corps_desc:0 "Reorganizing royal Phrai Luang crown subjects into permanent regiments backed by French- and Portuguese-trained gunners replaces irregular levies with steadfast [regulars|e]. Modern brick [fort|e] curtains guard the river islands, securing plentiful [manpower|e] and vigilant kingdom-wide [control|e]."
 oe_msn_ayu_04_phrai_luang_corps_req_tt:0 "In the Age of Reformation or later, have 15 Stability and 25 Army Tradition, and own a Barracks or Bastion."
 oe_msn_ayu_05_unite_sukhothai_lavo:0 "Unite the Chao Phraya: Ayutthaya & Sukhothai"
 oe_msn_ayu_05_unite_sukhothai_lavo_desc:0 "Joining the ancient northern kingdom of Sukhothai with the maritime heart of Ayutthaya fuses upper and lower Tai polities into one indivisible [core|e] along the Chao Phraya. Inheriting Sukhothai's alphabet and dharma kingship elevates [legitimacy|e], enriches [cultural_tradition|e], and spurs valley [development|e]."
 oe_msn_ayu_05_unite_sukhothai_lavo_req_tt:0 "Control Ayodhya and Sukhothai directly or through non-sovereign subjects."
 oe_msn_ayu_06_lanna_northern_gate:0 "Northern Gate: Bring Lan Na Into the Fold"
 oe_msn_ayu_06_lanna_northern_gate_desc:0 "Bringing Chiang Mai and the teak-clad valleys of Lan Na under our umbrella seals the northern mountain gate against Shan and Burmese incursions. Integrating northern vassal [subjects|e] strengthens upland [control|e], safeguards overland caravan [trade|e], and tempers frontier [army_tradition|e]."
 oe_msn_ayu_06_lanna_northern_gate_req_tt:0 "Control Chiang Mai directly or through a non-sovereign subject."
 oe_msn_ayu_07_angkor_lower_mekong:0 "Shadow of Angkor: Lower Mekong Ascendancy"
 oe_msn_ayu_07_angkor_lower_mekong_desc:0 "Extending sway over the carved sandstone sanctuaries of Angkor draws the lower Mekong basin into Ayutthaya's mandala, multiplying tributary [subjects|e] and regional [prestige|e]. Khmer court ritual, dance, and royal ceremony enrich our [cultural_tradition|e] and bolster eastern [diplomacy|e]."
 oe_msn_ayu_07_angkor_lower_mekong_req_tt:0 "Control Angkor (directly or via subject) and hold at least 35 Locations."
 oe_msn_ayu_08_andaman_gulf_mastery:0 "Master of Two Seas: Andaman & Gulf Trade"
 oe_msn_ayu_08_andaman_gulf_mastery_desc:0 "Controlling ports across both the Gulf of Siam and the Andaman coast lets merchants bypass the Malacca bottleneck via Tenasserim and Kra Isthmus portages, turning Siam into a two-sea [market|e]. Expanding our [navy|e] recruits skilled [sailors|e] and establishes commanding [maritime_presence|e] across both bays."
 oe_msn_ayu_08_andaman_gulf_mastery_req_tt:0 "In the Age of Reformation or later, control Pegu, Martaban, or Nakhon Si Thammarat (directly or via subject), own at least 6 Ports, and own a Port Authority or Shipyard."
 oe_msn_ayu_09_sukhothai_kilns:0 "Sawankhalok Kilns: Sukhothai Celadon Exports"
 oe_msn_ayu_09_sukhothai_kilns_desc:0 "Hundreds of riverside kilns at Si Satchanalai and Sawankhalok fire jade-glazed stoneware exported across Japan, Java, and the Philippines, turning artisan [buildings|e] into vibrant engines of [trade|e]. Export earnings bring steady [gold|e] and celebrate Tai [cultural_tradition|e] throughout maritime Asia."
 oe_msn_ayu_09_sukhothai_kilns_req_tt:0 "In the Age of Renaissance or later, control Sukhothai (directly or via subject), have Capital Development 22, and own a Porcelain Guild or Guild Hall."
 oe_msn_ayu_10_cosmopolitan_quarters:0 "Cosmopolitan Foreign Quarters of Ayutthaya"
 oe_msn_ayu_10_cosmopolitan_quarters_desc:0 "Along Ayutthaya's riverfront stand bustling quarters of Chinese, Persian, Japanese, Malay, and European merchants supervised by the Phrakhlang trade ministry, elevating royal [diplomatic_reputation|e] and agile [diplomacy|e]. Balancing foreign factories enriches the [market|e] and lifts merchant [estate_satisfaction|e]."
 oe_msn_ayu_10_cosmopolitan_quarters_req_tt:0 "Control Ayodhya (directly or via subject), hold 300 Gold, earn 22 monthly trade and tax income, and own a Wharf or Marketplace."
 oe_msn_ayu_11_golden_court_letters:0 "Golden Spires & Royal Letters"
 oe_msn_ayu_11_golden_court_letters_desc:0 "Gilded chedi spires shimmer above royal canals while King Narai's court poets compose classical verse and astronomical almanacs, crowning our [capital|e] with radiant [cultural_tradition|e]. Monastic libraries lift kingdom [literacy|e] and deepen Theravada [religious_influence|e] across mainland Southeast Asia."
 oe_msn_ayu_11_golden_court_letters_req_tt:0 "In the Age of Reformation or later, control Ayodhya (directly or via subject), have 15 Stability, Capital Development 30, and keep Clergy Satisfaction at least 50% (if present)."
 oe_msn_ayu_12_chakravartin_of_siam:0 "Chakravartin of Eternal Siam"
 oe_msn_ayu_12_chakravartin_of_siam_desc:0 "Reigning as Chakravartin from the gilded spires of Ayutthaya, Eternal Siam commands the Chao Phraya, the Isthmus, and the Mekong approaches as an undisputed [great_power|e]. Sovereign [institutions|e], dignified [diplomacy|e], and enduring [prosperity|e] safeguard Thailand's golden throne across the modern world."
 oe_msn_ayu_12_chakravartin_of_siam_req_tt:0 "In the Age of Absolutism or later, control Ayodhya and Sukhothai (directly or via subject), have 18 Stability and 45 Locations, and be a Great Power or earn at least 75 monthly trade and tax income."
 oe_msn_maj_destiny:0 "#bold #color_yellow Majapahit: Sovereign Destiny of Nusantara#!#!"
 oe_msn_maj_destiny_DESCRIPTION:0 "From the Palapa Oath and Jong Armadas to Mastery of the Spice Islands"
 oe_msn_maj_destiny_CRITERIA_DESCRIPTION:0 "Unify Java, build cetbang-armed Jong fleets, extend the mandala to Sumatra and the straits, and master the Moluccan spice trade."
 oe_msn_maj_destiny_BUTTON_TOOLTIP:0 "Embark on the Majapahit Destiny"
 oe_msn_maj_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Majapahit: fulfill Gajah Mada's Palapa Oath, arm multi-planked Jong fleets with cetbang ordnance, unify Java's Pasisir ports, restore influence over Palembang and the strait, and claim the Moluccan spice crown."
 oe_msn_maj_01_palapa_oath:0 "The Palapa Oath: Anchor Trowulan & Surabaya"
 oe_msn_maj_01_palapa_oath_desc:0 "In the brick-walled [capital|e] of Trowulan, Mahapatih Gajah Mada swears the Palapa Oath to taste no spiced ease until all Nusantara bows beneath Majapahit's Sun. Anchoring Surabaya's river port steadies internal [stability|e] and accelerates East Javanese [development|e] and maritime [trade|e]."
 oe_msn_maj_01_palapa_oath_req_tt:0 "Own Trowulan and Surabaya, have 5 Stability, and own a Wharf or Marketplace."
 oe_msn_maj_02_candi_sacred_shrines:0 "Restore the Candi Sacred Shrines"
 oe_msn_maj_02_candi_sacred_shrines_desc:0 "Restoring terracotta Candi Panataran and Shiva-Buddha sanctuaries across the volcanic slopes of East Java celebrates Bhinneka Tunggal Ika harmony and exalts sacred royal [legitimacy|e]. Patronizing priests and monumental [buildings|e] deepens [religious_influence|e] and elevates clerical [estate_satisfaction|e]."
 oe_msn_maj_02_candi_sacred_shrines_req_tt:0 "Own Trowulan, have 10 Stability, own a Temple or Monastery, and keep Clergy Satisfaction at least 50% (if present)."
 oe_msn_maj_03_cetbang_jong_armada:0 "Jong Great Ships & Cetbang Artillery"
 oe_msn_maj_03_cetbang_jong_armada_desc:0 "Towering multi-masted Javanese Jong great ships armed with breech-loading bronze Cetbang swivel cannon sweep piracy from the Java Sea and project awesome [navy|e] strength. Fusing indigenous shipbuilding with gunpowder [advances|e] sharpens [navy_tradition|e] and enforces unmatched [maritime_presence|e]."
 oe_msn_maj_03_cetbang_jong_armada_req_tt:0 "In the Age of Renaissance or later, control Surabaya (directly or via subject), hold 220 Gold and 15 Navy Tradition, own a Dock or Cannon Maker, and embrace Professional Armies or research its advance."
 oe_msn_maj_04_mandala_tributary_web:0 "Nusantara Tributary Mandala Network"
 oe_msn_maj_04_mandala_tributary_web_desc:0 "From Borneo's gold rivers to Bali, Sulawesi, and the Lesser Sundas, island rajahs send annual tribute and war prahus to the Suryamajapahit mandala, weaving loyal [subjects|e] into imperial [diplomacy|e]. Regular royal circuits deepen maritime [control|e] and magnify Nusantara's [diplomatic_reputation|e]."
 oe_msn_maj_04_mandala_tributary_web_req_tt:0 "In the Age of Reformation or later, hold 36 Locations, have at least 1 Subject or 12 Ports, and own a Shipyard or Port Authority."
 oe_msn_maj_05_unify_java_pasisir:0 "Unify Java: Demak & Sunda Kelapa"
 oe_msn_maj_05_unify_java_pasisir_desc:0 "Uniting Demak's shipyards and the pepper harbor of Sunda Kelapa brings Java's entire Pasisir northern seaboard into one consolidated imperial [core|e]. Harmonizing inland rice courts with cosmopolitan port cities accelerates [development|e], expands coastal [trade|e], and broadcasts Javanese [prestige|e]."
 oe_msn_maj_05_unify_java_pasisir_req_tt:0 "Control Demak and Sunda Kelapa directly or through non-sovereign subjects."
 oe_msn_maj_06_srivijaya_palembang:0 "Srivijaya's Heir: Secure Palembang"
 oe_msn_maj_06_srivijaya_palembang_desc:0 "Claiming Palembang along the broad Musi River inherits the ancient thalassocratic mantle of Srivijaya and establishes a Sumatran [core|e] guarding the Bangka narrows. Clearing pirate coves trains seasoned [sailors|e], builds [navy_tradition|e], and funnels pepper into our Java [market|e]."
 oe_msn_maj_06_srivijaya_palembang_req_tt:0 "Control Palembang (directly or via subject) and possess a Port."
 oe_msn_maj_07_malacca_strait_reach:0 "Command the Strait: Temasek & Malacca"
 oe_msn_maj_07_malacca_strait_reach_desc:0 "Projecting our fleets across the Singapore narrows to Temasek and Malacca locks the western gate between India and China under Javanese [maritime_presence|e]. Tolls on passing spice carracks and junks pour [gold|e] into our coffers, securing strategic [control|e] over Asia's busiest [trade|e] artery."
 oe_msn_maj_07_malacca_strait_reach_req_tt:0 "Control Temasek or Malacca (directly or via subject) and have at least 15 Navy Tradition."
 oe_msn_maj_08_moluccas_spice_crown:0 "Crown of the Moluccas: Cloves & Nutmeg"
 oe_msn_maj_08_moluccas_spice_crown_desc:0 "Volcanic Ternate, Tidore, and the nutmeg groves of Banda yield spices prized above silver in every distant court, crowning Nusantara's eastern reach with dazzling [prosperity|e] and bullion [gold|e]. Securing the Spice Islands forestalls European monopolies, enriching our [market|e] and imperial [prestige|e]."
 oe_msn_maj_08_moluccas_spice_crown_req_tt:0 "In the Age of Reformation or later, control Ternate, Tidore, or Banda (directly or via subject) and own at least 10 Ports."
 oe_msn_maj_09_nagarakretagama_chronicle:0 "Nagarakretagama & Javanese Chronicles"
 oe_msn_maj_09_nagarakretagama_chronicle_desc:0 "Inscribed on palm-leaf lontar manuscripts, Mpu Prapanca's Nagarakretagama chronicles Hayam Wuruk's royal progresses, gamelan courts, and shadow-play epics, immortalizing Javanese [cultural_tradition|e]. Royal libraries and scriptoria [buildings|e] foster Kawi and Malay [literacy|e] and spread civilized [prestige|e] throughout the archipelago."
 oe_msn_maj_09_nagarakretagama_chronicle_req_tt:0 "In the Age of Renaissance or later, own Trowulan, have Capital Development 22, and own a University or Scriptorium."
 oe_msn_maj_10_tuban_gresik_emporia:0 "Gresik & Tuban: Maritime Silk Road Emporia"
 oe_msn_maj_10_tuban_gresik_emporia_desc:0 "Where Ming porcelain, Gujarati textiles, and Moluccan cloves change hands beneath bustling bamboo cranes, Gresik and Tuban anchor the Maritime Silk Road as premier entrepots of [trade|e]. Expanding port [buildings|e] grows treasury [gold|e] and lifts coastal burgher [estate_satisfaction|e]."
 oe_msn_maj_10_tuban_gresik_emporia_req_tt:0 "Control Gresik and Tuban (directly or via subject), hold 300 Gold, earn 22 monthly trade and tax income, and own a Guild Hall or Wharf."
 oe_msn_maj_11_archipelago_free_trade:0 "Archipelago Free Trade Charter"
 oe_msn_maj_11_archipelago_free_trade_desc:0 "Enacting an Archipelago Free Trade Charter guarantees uniform coinage, fair anchorage tolls, and armed convoy protection against coercive foreign chartered companies, keeping [inflation|e] tame and our [market|e] dominant. Independent Nusantara finance sustains vigorous [trade|e] and island-wide [prosperity|e]."
 oe_msn_maj_11_archipelago_free_trade_req_tt:0 "In the Age of Reformation or later, have 15 Stability and 450 Gold, own a Customs House or Trading Hub, and keep Burghers Satisfaction at least 50% (if present)."
 oe_msn_maj_12_sovereign_of_nusantara:0 "Eternal Sovereign of Nusantara"
 oe_msn_maj_12_sovereign_of_nusantara_desc:0 "From Sumatra's pepper shores to the clove volcanoes of the Moluccas, Gajah Mada's Palapa Oath stands fulfilled as an unconquered maritime [great_power|e]. Armed with modern [institutions|e], radiant [legitimacy|e], and unchallenged [maritime_presence|e], Majapahit reigns as Eternal Sovereign of Nusantara."
 oe_msn_maj_12_sovereign_of_nusantara_req_tt:0 "In the Age of Absolutism or later, control Trowulan, Surabaya, and Sunda Kelapa (directly or via subject), have 18 Stability, and be a Great Power or earn at least 80 monthly trade and tax income."
 oe_msn_mlc_destiny:0 "#bold #color_yellow Malacca & Pasai: Destiny of the Two Seas#!#!"
 oe_msn_mlc_destiny_DESCRIPTION:0 "From Straits Maritime Law and Zheng He's Depot to Mastery of the Two Seas"
 oe_msn_mlc_destiny_CRITERIA_DESCRIPTION:0 "Command both shores of the Malacca Strait, codify maritime law, bridge East and Indian Ocean commerce, and defeat oceanic monopolies."
 oe_msn_mlc_destiny_BUTTON_TOOLTIP:0 "Embark on the Malacca Destiny"
 oe_msn_mlc_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Malacca and Pasai: anchor the monsoon entrepot, promulgate Undang-Undang Laut Melaka under four Shahbandars, unite the Malay Peninsula and Sumatra's shores, host Zheng He's treasure depot, and reign as Eternal Lord of the Two Seas."
 oe_msn_mlc_01_straits_entrepot:0 "Monsoon Entrepot: Anchor the Strait"
 oe_msn_mlc_01_straits_entrepot_desc:0 "Where the southwest and northeast monsoons meet in calm waters, founding a sheltered free port turns our [capital|e] into the natural meeting house of Indian, Arab, and Chinese [trade|e]. Low duties and safe anchorages invite rapid [development|e] and secure the young sultanate's [stability|e]."
 oe_msn_mlc_01_straits_entrepot_req_tt:0 "Control Malacca or Pasai (directly or via subject), have 5 Stability, and own a Wharf or Marketplace."
 oe_msn_mlc_02_maritime_law_code:0 "Undang-Undang Laut: Maritime Law Code"
 oe_msn_mlc_02_maritime_law_code_desc:0 "Codifying the Undang-Undang Laut Melaka defines captains' duties, salvage rules, and cargo arbitration across every sea lane, establishing exemplary [legitimacy|e] and commercial trust. Disciplined Orang Laut sea crews bolster [navy_tradition|e], safeguard our [market|e], and elevate merchant [estate_satisfaction|e]."
 oe_msn_mlc_02_maritime_law_code_req_tt:0 "Possess a Port, have at least 10 Stability, and keep Burghers Satisfaction at least 50% (if present)."
 oe_msn_mlc_03_shahbandar_quarters:0 "Four Shahbandars & Merchant Quarters"
 oe_msn_mlc_03_shahbandar_quarters_desc:0 "Appointing four Shahbandar harbormasters to oversee Gujarati, Coromandel, Javanese, and Chinese quarters streamlines customs valuation and warehouse credit inside bustling waterfront [buildings|e]. Honest brokerage multiplies [gold|e], anchors modern fiscal [institutions|e], and accelerates entrepot [prosperity|e]."
 oe_msn_mlc_03_shahbandar_quarters_req_tt:0 "In the Age of Renaissance or later, hold 220 Gold, own a Counting House or Dock, and embrace Banking or research its advance."
 oe_msn_mlc_04_islamic_scholarship:0 "Straits Jurisprudence & Scholarly Courts"
 oe_msn_mlc_04_islamic_scholarship_desc:0 "From Pasai to Malacca's royal court, jurists and Sufi teachers debate jurisprudence and commercial ethics in Jawi script, making the Straits a luminous beacon of [religious_influence|e] and urban [literacy|e]. Endowing scholarly academies deepens [cultural_tradition|e] and reinforces the Sultan's moral [crown_power|e]."
 oe_msn_mlc_04_islamic_scholarship_req_tt:0 "In the Age of Reformation or later, have 15 Stability, own a University or Madrasa, and keep Clergy Satisfaction at least 50% (if present)."
 oe_msn_mlc_05_johor_temasek_gate:0 "Gate of Temasek: Malacca & Southern Strait"
 oe_msn_mlc_05_johor_temasek_gate_desc:0 "Securing both the walled port of Malacca and the southern strait gate of Temasek unites the Johor tip into an impregnable maritime [core|e]. War lancharas gliding between islands sharpen [navy_tradition|e], extend seamless [maritime_presence|e], and spur twin-harbor [development|e]."
 oe_msn_mlc_05_johor_temasek_gate_req_tt:0 "Control Malacca and Temasek directly or through non-sovereign subjects."
 oe_msn_mlc_06_kedah_pahang_peninsula:0 "Malay Peninsula: Kedah Tin & Pahang Gold"
 oe_msn_mlc_06_kedah_pahang_peninsula_desc:0 "Unifying Kedah's northern alluvial tin valleys with Pahang's forested gold rivers gives our maritime state a rich peninsular [core|e] and vital strategic hinterland. Exporting cast tin ingots swells state [gold|e], deepens inland [control|e], and bolsters royal [prestige|e] against Siamese ambitions."
 oe_msn_mlc_06_kedah_pahang_peninsula_req_tt:0 "Control Kedah and Pahang directly or through non-sovereign subjects."
 oe_msn_mlc_07_sumatra_twin_shores:0 "Twin Shores: Master Sumatra's Pepper Coast"
 oe_msn_mlc_07_sumatra_twin_shores_desc:0 "Holding both shores of the Malacca Strait from Aceh's pepper hills to Siak and Palembang transforms the waterway into an enclosed royal lake of commanding [maritime_presence|e]. Sister Malay sultanates enter our [subjects|e] circle, unifying Sumatran [trade|e] and multiplying ocean-going [sailors|e]."
 oe_msn_mlc_07_sumatra_twin_shores_req_tt:0 "Control Pasai or Banda Aceh AND Palembang or Siak (directly or via subject) and own at least 6 Ports."
 oe_msn_mlc_08_straits_fortress_fleet:0 "Iron Straits Fleet: Defy Oceanic Monopolies"
 oe_msn_mlc_08_straits_fortress_fleet_desc:0 "Mounting heavy brass Lela cannon atop coastal [fort|e] batteries and nimble war galleys denies European armadas the fate that once befell 1511 Malacca. Our modernized [navy|e] guards monsoon convoys with fierce [navy_tradition|e], ensuring Strait sovereignty and enduring [stability|e]."
 oe_msn_mlc_08_straits_fortress_fleet_req_tt:0 "In the Age of Reformation or later, possess a Port, hold 20 Locations, have 22 Navy Tradition, and own a Shipyard or Bastion."
 oe_msn_mlc_09_zheng_he_depot:0 "Zheng He's Depot: Eastern Ocean Alliance"
 oe_msn_mlc_09_zheng_he_depot_desc:0 "Stockading Zheng He's walled Guanchang supply depot along our harbor binds Malacca to the treasure fleets of East Asia in a prestigious web of [diplomacy|e] and [diplomatic_reputation|e]. Hosting imperial envoys deters aggressive neighbors, draws silk and porcelain into our [trade|e], and lifts Malacca's [prestige|e]."
 oe_msn_mlc_09_zheng_he_depot_req_tt:0 "In the Age of Renaissance or later, hold 200 Gold and own a Dock or Marketplace."
 oe_msn_mlc_10_indian_ocean_spice_mart:0 "Indian Ocean Spice & Textile Mart"
 oe_msn_mlc_10_indian_ocean_spice_mart_desc:0 "As the old maxim boasts, whoever is lord of Malacca has his hand on the throat of Venice: Bengal cloth, Moluccan cloves, and Chinese silk all clear through our central [market|e]. Thriving entrepot [trade|e] floods the sultanate with [gold|e] and radiates cosmopolitan [prosperity|e]."
 oe_msn_mlc_10_indian_ocean_spice_mart_req_tt:0 "Possess a Port, hold 350 Gold, earn 22 monthly trade and tax income, and own a Guild Hall or Wharf."
 oe_msn_mlc_11_golden_malay_letters:0 "Malay Annals & Archipelago Cultural Zenith"
 oe_msn_mlc_11_golden_malay_letters_desc:0 "Composing the Sejarah Melayu annals and Hikayat Hang Tuah epics establishes Classical Malay as the lingua franca of diplomacy and commerce from Aceh to Ternate, crowning our [cultural_tradition|e]. Flourishing urban [literacy|e] and grand civic [buildings|e] celebrate a gilded Malay [capital|e]."
 oe_msn_mlc_11_golden_malay_letters_req_tt:0 "In the Age of Reformation or later, have 15 Stability, Capital Development 28, and own a Customs House or Arts Academy."
 oe_msn_mlc_12_lord_of_the_two_seas:0 "Eternal Lord of the Two Seas"
 oe_msn_mlc_12_lord_of_the_two_seas_desc:0 "Hinging the Indian Ocean to the South China Sea as an unbroken sovereign entrepot, our Sultanate rises as an opulent maritime [great_power|e] beyond any colonial grasp. Unrivaled [maritime_presence|e], modern commercial [institutions|e], and lasting [prestige|e] crown the Eternal Lord of the Two Seas."
 oe_msn_mlc_12_lord_of_the_two_seas_req_tt:0 "In the Age of Absolutism or later, control Malacca and either Pasai or Temasek (directly or via subject), have 18 Stability, and be a Great Power or earn at least 75 monthly trade and tax income."
