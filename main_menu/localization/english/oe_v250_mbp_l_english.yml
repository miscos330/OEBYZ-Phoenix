# NEW 2026-11-24 v25.0 Stage 2 Final 1337 Tier-2 Pack (VEN/GEN, HUN, BUR, Post-Ilkhanate Persia) (oe_v250_mbp_, 0 mainline slots, 0 rules, 0 vanilla overrides) — english localization for Stage 2 Final 1337 Tier-2 Pack (168 keys). Generated by gen_v250_1337_med_balkan_persia.py
 oe_v250_mbp_ref_maritime_senate:0 "Maritime Patrician Senate"
 oe_v250_mbp_ref_maritime_senate_desc:0 "Places state shipyards, Levantine convoy schedules, and admiralty finance directly beneath the republic's patrician councils, strengthening sea commerce, galley warfare, and maritime projection while raising land mercenary outlays and curbing rural levies."
 oe_v250_mbp_priv_patrician_arsenal:0 "Patrician Arsenal & Muda Guilds"
 oe_v250_mbp_priv_patrician_arsenal_desc:0 "Grants maritime patrician houses and shipwright guilds permanent slipway contracts and priority convoy shares, accelerating naval construction and sailor recruitment at the cost of stronger burgher dominance, reduced burgher tax ceilings, and heavier dockyard upkeep."
 oe_v250_mbp_cab_levant_convoys:0 "Organize Levantine Muda Convoys"
 oe_v250_mbp_cab_levant_convoys_desc:0 "Dispatches state-protected merchant galley convoys to Alexandria, Constantinople, Chios, and the Black Sea emporia, boosting sea trade, merchant reach, and maritime presence while demanding steady escort maintenance across naval and garrison budgets."
 oe_v250_mbp_cab_levant_convoys_action:0 "Organize Levantine Muda Convoys"
 oe_v250_mbp_cab_levant_convoys_active:0 "Active: Organize Levantine Muda Convoys"
 oe_v250_mbp_cab_levant_convoys_action_progress:0 "Active"
 oe_v250_mbp_cab_levant_convoys_action_progress_wordier:0 "Organize Levantine Muda Convoys (Active)"
 oe_v250_mbp_cab_levant_convoys_action_progress_tooltip:0 "Dispatches state-protected merchant galley convoys to Alexandria, Constantinople, Chios, and the Black Sea emporia, boosting sea trade, merchant reach, and maritime presence while demanding steady escort maintenance across naval and garrison budgets."
 oe_v250_mbp_dec_chioggia_fleet_levy.title:0 "Enact the Chioggia Fleet Levy"
 oe_v250_mbp_dec_chioggia_fleet_levy.desc:0 "Mobilize every patrician galley slipway, merchant hulk, and coastal oar-bench to forge an emergency war fleet capable of breaking a rival blockade in the Adriatic or Ligurian Sea. Costs 100 gold; strengthens galley power, naval morale, and shipbuilding for 25 years at heavy fleet upkeep and merchant resentment."
 oe_v250_mbp_dec_chioggia_fleet_levy.a:0 "Launch the Emergency War Galleys"
 oe_v250_mbp_dec_chioggia_fleet_levy_tt:0 "Develops our home shipyard capital and activates the #Y Chioggia Emergency Fleet Levy#! for 25 years."
 oe_v250_mbp.1.t:0 "The Levantine Convoys & Black Sea Rivalry"
 oe_v250_mbp.1.d:0 "From the grain quays of Kaffa and Tana to the spice fondacos of Alexandria and Chios, armed galleys of Venice and Genoa shadow one another across every choke point of the Eastern Mediterranean. Expanding the state-run Arsenal and disciplined muda convoys secures sea lanes and shipyard speed at steep naval expense and weaker land levies, whereas chartering private merchant consortia widens trading reach while ceding fiscal leverage to patrician syndicates."
 oe_v250_mbp.1.a:0 "Expand state Arsenal convoys and contest the Levant sea lanes"
 oe_v250_mbp.1.b:0 "Charter private patrician consortia across our overseas fondacos"
 oe_v250_mbp.2.t:0 "The Bosphorus Clash & Patrician Debt Syndicates"
 oe_v250_mbp.2.d:0 "Bitter naval clashes along the Bosphorus and Aegean approaches have emptied the republic's war chest, forcing the councils to decide how to finance prolonged maritime conflict. Consolidating public loans inside a patrician bond bank—modeled on the Compere of San Giorgio and the Venetian Monte Vecchio—stabilizes state credit and overseas presence at the price of handing fiscal power to creditors, while levying emergency war-galley duties arms the fleet immediately but angers shipping houses."
 oe_v250_mbp.2.a:0 "Consolidate state debt inside a patrician bond bank"
 oe_v250_mbp.2.b:0 "Levy emergency war-galley customs across every port"
 oe_v250_mbp.3.t:0 "The War of Chioggia & Lagoon Quarantine Law"
 oe_v250_mbp.3.d:0 "With hostile squadrons probing lagoon shoals and recurrent plague galleys returning from Levantine ports, the republic faces a defining test of endurance. Enforcing forty-day quarantine lazarettos alongside an all-out defensive shipyard mobilization protects urban prosperity and homeland bastions at steep upkeep and tax friction, while negotiating a mediated commercial peace restores Adriatic-Aegean traffic at the cost of tarnished martial prestige."
 oe_v250_mbp.3.a:0 "Enforce harbor lazarettos and fortify the home shipyards"
 oe_v250_mbp.3.b:0 "Ratify a mediated commercial peace and reopen sea traffic"
 oe_v250_mbp_ref_anjou_banderia:0 "Anjou Banderia & Mining Chambers"
 oe_v250_mbp_ref_anjou_banderia_desc:0 "Pairs royal Upper Hungarian gold-mining chambers with aristocratic banderia knightly banners raised by barons and prelates, strengthening heavy cavalry, mineral output, and royal revenues while magnifying magnate power and narrowing noble tax limits."
 oe_v250_mbp_priv_golden_bull_estates:0 "Golden Bull & Aviticitas Charter"
 oe_v250_mbp_priv_golden_bull_estates_desc:0 "Reaffirms the Golden Bull liberties and inalienable clan inheritance of the Hungarian nobility, expanding light frontier cavalry and realm-wide manpower while bolstering noble political clout and trimming royal estate leverage."
 oe_v250_mbp_cab_kremnica_gold_mint:0 "Kremnica Royal Mint & Urbura Survey"
 oe_v250_mbp_cab_kremnica_gold_mint_desc:0 "Dispatches royal mining chamberlains and Kremnica assayers to audit ore veins, refine gold florins, and enforce Urbura royalties in a target province, lifting mineral output, prosperity, and tax income while causing mild bullion inflation and noble friction."
 oe_v250_mbp_cab_kremnica_gold_mint_action:0 "Kremnica Royal Mint & Urbura Survey: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mbp_cab_kremnica_gold_mint_active:0 "Kremnica Royal Mint & Urbura Survey in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_mbp_cab_kremnica_gold_mint_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mbp_cab_kremnica_gold_mint_action_progress_wordier:0 "Kremnica Royal Mint & Urbura Survey ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mbp_cab_kremnica_gold_mint_action_progress_tooltip:0 "Dispatches royal mining chamberlains and Kremnica assayers to audit ore veins, refine gold florins, and enforce Urbura royalties in a target province, lifting mineral output, prosperity, and tax income while causing mild bullion inflation and noble friction."
 oe_v250_mbp_cab_kremnica_gold_mint_select_province:0 "Select a Province for the Kremnica Mint & Urbura Survey"
 oe_v250_mbp_cab_kremnica_gold_mint_no_provinces:0 "@trigger_no! No eligible provinces available for the Kremnica Mint Survey."
 oe_v250_mbp_dec_danube_border_forts.title:0 "Fortify the Danube Banate Line"
 oe_v250_mbp_dec_danube_border_forts.desc:0 "Reinforce the stone citadels, river watchtowers, and banate garrisons guarding the Iron Gates and Lower Danube approaches from Timisoara to Severin. Costs 110 gold; boosts national defense, army morale, and manpower for 25 years at steep fortress upkeep and fiscal strain."
 oe_v250_mbp_dec_danube_border_forts.a:0 "Raise the Stone Bastions Along the Danube"
 oe_v250_mbp_dec_danube_border_forts_tt:0 "Develops #Y Buda#!, raises prosperity in #Y Timisoara#!, and establishes the #Y Danube Banate Fortress Line#! for 25 years."
 oe_v250_mbp.4.t:0 "The Kremnica Gold Florin & Visegrad Fiscal Compact"
 oe_v250_mbp.4.d:0 "With rich gold veins flowing out of Kremnica and Upper Hungary, the Anjou court at Visegrad has transformed the Hungarian gold florin into Central Europe's most trusted currency. Enforcing strict royal Urbura royalties and the gate tax fills Buda's treasury and expands overland trade while chafing aristocratic landowners, whereas sharing mining chamber receipts with Carpathian magnates buys noble harmony at the price of softer royal authority."
 oe_v250_mbp.4.a:0 "Enforce royal Urbura royalties and strike pure Kremnica florins"
 oe_v250_mbp.4.b:0 "Share mining chamber profits with Carpathian magnates"
 oe_v250_mbp.5.t:0 "Louis the Great & the Dalmatian-Danubian March"
 oe_v250_mbp.5.d:0 "With the Decree of 1351 affirming uniform noble status across the Crown of Saint Stephen, King Louis's banners stand poised to contest Venetian Dalmatia and assert Hungarian suzerainty along the Lower Danube. Mobilizing royal banderia knights projects formidable shock power across the Balkan crossroads at steep army upkeep and merchant strain, while investing in Buda and Kosice's royal free towns deepens manufacturing and cabinet administration at slower frontier cavalry recruitment."
 oe_v250_mbp.5.a:0 "Muster the royal banderia for the Dalmatian and Balkan marches"
 oe_v250_mbp.5.b:0 "Codify the Law of 1351 and charter royal free towns"
 oe_v250_mbp.6.t:0 "The Order of the Dragon & the Danubian Bulwark"
 oe_v250_mbp.6.d:0 "As Ottoman raiders probe the Lower Danube and factional baronial leagues contest royal succession in Buda, the Crown stands at the threshold of a continental crusade. Founding the chivalric Order of the Dragon to rally Christian princes and garrison the southern border forts elevates discipline, defense, and European prestige at heavy military and fortress expense, whereas delegating frontier banates to powerful baronial palatines swells manpower while ceding royal leverage."
 oe_v250_mbp.6.a:0 "Found the Order of the Dragon and garrison the Danube bulwark"
 oe_v250_mbp.6.b:0 "Empower baronial palatine councils along the southern banates"
 oe_v250_mbp_ref_golden_fleece_court:0 "Court of the Golden Fleece"
 oe_v250_mbp_ref_golden_fleece_court_desc:0 "Elevates the Burgundian court at Dijon and the Low Countries into Europe's premier showcase of chivalric diplomacy, civic patronage, and ceremonial splendor—lifting prestige, diplomatic sway, and burgher goodwill at the price of lavish court spending and steeper army upkeep."
 oe_v250_mbp_priv_flemish_cloth_charters:0 "Flemish Cloth Hall & Municipal Charters"
 oe_v250_mbp_priv_flemish_cloth_charters_desc:0 "Guarantees the weaving guilds and aldermen of Flanders, Artois, and Burgundy ancient municipal liberties and cloth-staple rights, boosting manufacturing and overland trade while strengthening urban estates and trimming merchant tax ceilings."
 oe_v250_mbp_cab_dijon_chancery:0 "Dijon Chambre des Comptes & Envoys"
 oe_v250_mbp_cab_dijon_chancery_desc:0 "Coordinates Burgundian jurists, marriage envoys, and Chambre des Comptes auditors between Dijon, Paris, and the Low Countries, advancing diplomatic standing, cabinet efficiency, and cultural reach while straining court budgets and chafing traditional nobles."
 oe_v250_mbp_cab_dijon_chancery_action:0 "Dijon Chambre des Comptes & Envoys"
 oe_v250_mbp_cab_dijon_chancery_active:0 "Active: Dijon Chambre des Comptes & Envoys"
 oe_v250_mbp_cab_dijon_chancery_action_progress:0 "Active"
 oe_v250_mbp_cab_dijon_chancery_action_progress_wordier:0 "Dijon Chambre des Comptes & Envoys (Active)"
 oe_v250_mbp_cab_dijon_chancery_action_progress_tooltip:0 "Coordinates Burgundian jurists, marriage envoys, and Chambre des Comptes auditors between Dijon, Paris, and the Low Countries, advancing diplomatic standing, cabinet efficiency, and cultural reach while straining court budgets and chafing traditional nobles."
 oe_v250_mbp_dec_low_countries_union.title:0 "Proclaim the Burgundian-Low Countries Union"
 oe_v250_mbp_dec_low_countries_union.desc:0 "Bind the scattered duchies and counties from Dijon to Flanders under a shared council of state, unified coinage, and common commercial justice. Costs 110 gold; boosts manufacturing, diplomacy, and vassal loyalty for 25 years while raising court outlays and empowering burgher estates."
 oe_v250_mbp_dec_low_countries_union.a:0 "Seal the Union Charter of Burgundy & the Lowlands"
 oe_v250_mbp_dec_low_countries_union_tt:0 "Develops #Y Dijon#!, raises prosperity in #Y Beaune#! and #Y Bruges#!, and activates the #Y Burgundian-Low Countries Union#! for 25 years."
 oe_v250_mbp.7.t:0 "The Duchy of Dijon at the Franco-Imperial Crossroads"
 oe_v250_mbp.7.d:0 "Straddling the Saone between the Valois Crown of France and the imperial fiefs of Franche-Comte and Lorraine, Dijon's dukes command a pivotal diplomatic corridor. Cultivating an independent middle-kingdom posture elevates Burgundian prestige and European standing at heavier court expenses and Parisian wariness, while standing firmly as the premier martial peer of France bolsters heavy chivalry and noble loyalty at narrower diplomatic reach."
 oe_v250_mbp.7.a:0 "Cultivate autonomous Burgundian diplomacy across the Saone and Meuse"
 oe_v250_mbp.7.b:0 "Stand as the premier chivalric peerage of the French Crown"
 oe_v250_mbp.8.t:0 "Philip the Bold & the Flemish Cloth Cities"
 oe_v250_mbp.8.d:0 "Dynastic marriage ties with the County of Flanders open the rich cloth halls of Bruges, Ghent, and Lille to Burgundian statecraft—yet the proud Flemish weavers fiercely guard their municipal charters against ducal bailiffs. Wooing the cloth guilds with broad commercial accords swells manufacturing and North Sea trade while enlarging burgher power, whereas centralizing the Dijon Chambre des Comptes tightens taxes and cabinet oversight at the risk of civic unrest."
 oe_v250_mbp.8.a:0 "Confirm Flemish cloth-guild liberties and North Sea fairs"
 oe_v250_mbp.8.b:0 "Centralize tolls and ledgers under Dijon's Chambre des Comptes"
 oe_v250_mbp.9.t:0 "The Bruges Bourse & Splendor of the Golden Fleece"
 oe_v250_mbp.9.d:0 "Florentine bankers, Flemish oil painters, polyphonic choirs, and northern wool brokers now crowd the counting houses of Bruges and Antwerp beneath the banners of the Golden Fleece. Channeling this wealth into court patronage, universities, and civic refinement lifts cultural tradition, scholarship, and prosperity at steep court and military expense, whereas diverting Low Countries credit into permanent Burgundian ordinance companies forges a disciplined professional army at the price of heavier wages and burgher displeasure."
 oe_v250_mbp.9.a:0 "Patronize Flemish ateliers, scholars, and Golden Fleece pageantry"
 oe_v250_mbp.9.b:0 "Channel Low Countries credit into permanent ordinance companies"
 oe_v250_mbp_ref_persianate_diwan:0 "Persianate Diwan-i-Ala Bureaucracy"
 oe_v250_mbp_ref_persianate_diwan_desc:0 "Recruits seasoned Persian viziers, financial scribes, and jurists from Tabriz, Baghdad, Shiraz, and Isfahan to restore Ilkhanid chancery order—reviving cabinet competence, cultural tradition, and taxation while alienating autonomous tribal amirs and raising stabilization costs."
 oe_v250_mbp_priv_silk_caravanserai_waqf:0 "Silk Road Caravanserai Waqf Endowments"
 oe_v250_mbp_priv_silk_caravanserai_waqf_desc:0 "Confirms pious waqf endowments funding brick caravanserais, madrasah libraries, and qanat upkeep across the Iranian plateau, revitalizing overland silk commerce and scholarship while expanding clerical clout and reducing clerical tax ceilings."
 oe_v250_mbp_cab_tabriz_diwan_audit:0 "Tabriz Diwan Revenue & Qanat Audit"
 oe_v250_mbp_cab_tabriz_diwan_audit_desc:0 "Dispatches central Diwan auditors and hydraulic engineers to re-register land assessments and restore subterranean qanat irrigation in a target province, improving control, food harvests, and state taxation while provoking tribal and landed noble pushback."
 oe_v250_mbp_cab_tabriz_diwan_audit_action:0 "Tabriz Diwan Revenue & Qanat Audit: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_mbp_cab_tabriz_diwan_audit_active:0 "Tabriz Diwan Revenue & Qanat Audit in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_mbp_cab_tabriz_diwan_audit_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mbp_cab_tabriz_diwan_audit_action_progress_wordier:0 "Tabriz Diwan Revenue & Qanat Audit ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_mbp_cab_tabriz_diwan_audit_action_progress_tooltip:0 "Dispatches central Diwan auditors and hydraulic engineers to re-register land assessments and restore subterranean qanat irrigation in a target province, improving control, food harvests, and state taxation while provoking tribal and landed noble pushback."
 oe_v250_mbp_cab_tabriz_diwan_audit_select_province:0 "Select a Province for the Tabriz Diwan Revenue & Qanat Audit"
 oe_v250_mbp_cab_tabriz_diwan_audit_no_provinces:0 "@trigger_no! No eligible provinces available for the Tabriz Diwan Audit."
 oe_v250_mbp_dec_claim_ilkhanate_throne.title:0 "Claim the Ilkhanate Throne of Tabriz"
 oe_v250_mbp_dec_claim_ilkhanate_throne.desc:0 "Proclaim sovereign succession to the fractured Ilkhanate from the imperial seat of the Iranian plateau, striking new silver coinage and summoning provincial amirs to renew their oaths. Costs 100 gold; elevates legitimacy, crown authority, and light cavalry for 25 years while straining domestic stability and tribal loyalty."
 oe_v250_mbp_dec_claim_ilkhanate_throne.a:0 "Ascend the Imperial Diwan of the Plateau"
 oe_v250_mbp_dec_claim_ilkhanate_throne_tt:0 "Develops #Y Tabriz#!, boosts prosperity in #Y Baghdad#! and #Y Shiraz#!, and invokes #Y Heir to the Ilkhanate Throne#! for 25 years."
 oe_v250_mbp.10.t:0 "Shattered Diadem of the Ilkhans"
 oe_v250_mbp.10.d:0 "With the death of Abu Sa'id leaving no undisputed Chinggisid heir in Soltaniyeh, rival Jalayirid, Chobanid, Injuid, and Muzaffarid courts vie to knit Iraq, Azerbaijan, and Fars back together. Rebuilding the Rashidiyya-era Persian chancery restores tax ledgers and administrative order at the cost of tribal resentment and softer nomad cavalry, whereas rallying Turkic-Mongol noyans under ancestral tumen banners unleashes fierce horsemen while widening tribal power and weakening direct taxation."
 oe_v250_mbp.10.a:0 "Reassemble the Persian Diwan chancery to govern cities and revenue"
 oe_v250_mbp.10.b:0 "Rally Mongol-Turkic noyans beneath the ancestral tumen banners"
 oe_v250_mbp.11.t:0 "Tabriz, Shiraz & the Shadow of Transoxiana"
 oe_v250_mbp.11.d:0 "From the caravan gates of Khorasan to the mountain passes of Azerbaijan and Fars, tidings of relentless warlords consolidating Samarkand and Transoxiana compel every plateau ruler to choose a strategic posture. Fortifying the mountain citadels and siege arsenals hardens defense and siegecraft at steep fortress maintenance and stricter border tolls, while safeguarding open silk transit between Samarkand, Shiraz, and Tabriz enriches overland trade and prosperity at the price of looser central command and softer morale."
 oe_v250_mbp.11.a:0 "Fortify the Zagros and Khorasan citadels and siege magazines"
 oe_v250_mbp.11.b:0 "Safeguard open silk caravans across Samarkand, Shiraz, and Tabriz"
 oe_v250_mbp.12.t:0 "Persianate Renaissance of Shiraz & Isfahan"
 oe_v250_mbp.12.d:0 "Even amid dynastic storms, the tiled courtyards of Shiraz, Isfahan, Tabriz, and Samarkand shine as beacons of Persian verse, illuminated manuscripts, astronomical observatories, and master metalwork. Endowing royal studios and madrasah waqfs lifts cultural tradition, research, and urban prosperity at the cost of lavish court outlays and growing clerical weight, while subordinating city treasuries to disciplined royal garrisons builds a hard-edged army at steep wages and merchant discontent."
 oe_v250_mbp.12.a:0 "Endow royal miniature ateliers, observatories, and madrasah waqfs"
 oe_v250_mbp.12.b:0 "Channel urban revenues into disciplined royal citadel garrisons"
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_chioggia_fleet:0 "Chioggia Emergency Fleet Levy"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_chioggia_fleet:0 "Round-the-clock shipyard conscription equips decisive Mediterranean war-galley squadrons while straining maritime budgets and taxing merchant houses."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev1_muda_convoys:0 "State Muda Galley Convoys"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev1_muda_convoys:0 "Disciplined state galley convoys and Arsenal yards raise sea commerce and shipbuilding pace while drawing funds away from land levies and inflating fleet upkeep."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev1_private_consortia:0 "Overseas Patrician Consortia"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev1_private_consortia:0 "Autonomous merchant houses multiply commercial reach and treasury customs receipts while entrenching burgher political clout and lowering merchant tax ceilings."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev2_bond_syndicate:0 "Patrician Public Bond Syndicate"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev2_bond_syndicate:0 "Consolidated maritime bonds strengthen fiscal efficiency and overseas presence while shifting estate balance toward merchant creditors and away from central authority."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev2_war_customs:0 "Emergency War-Galley Customs"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev2_war_customs:0 "Wartime port surcharges sharpen galley combat and naval morale at the expense of slower sea commerce and sharp burgher discontent."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev3_lazaretto_arsenal:0 "Lazaretto Quarantine & Home Bastions"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev3_lazaretto_arsenal:0 "Systematic port quarantine and shipyard mobilization preserve homeland defenses, sailor reserves, and urban prosperity while weighing on naval maintenance and direct tax efficiency."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev3_turin_compact:0 "Turin Commercial Settlement"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev3_turin_compact:0 "Negotiated shipping lanes lift sea trade and diplomatic standing across Italy and the Danube while dulling naval fervor and hastening prestige decay."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_danube_forts:0 "Danube Banate Fortress Line"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_danube_forts:0 "Garrisoned Danubian citadels and frontier banates anchor Hungary's southern defense while demanding continuous fortress maintenance and treasury disbursements."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev4_kremnica_florin:0 "Kremnica Royal Florin Standard"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev4_kremnica_florin:0 "Trusted Anjou gold coinage lifts tax efficiency, raw ore output, and Danubian overland commerce while provoking noble resentment and raising domestic friction."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev4_carpathian_chambers:0 "Carpathian Magnate Mining Accord"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev4_carpathian_chambers:0 "Revenue-sharing across Upper Hungary calms the aristocracy and encourages provincial prosperity while expanding noble clout and narrowing crown power."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev5_anjou_banners:0 "Anjou Royal Banderia Muster"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev5_anjou_banners:0 "Armored knightly banners sharpen Hungarian heavy cavalry and battlefield morale while adding field maintenance costs and chafing urban merchants."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev5_royal_free_towns:0 "Royal Free Towns & Decree of 1351"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev5_royal_free_towns:0 "Protected guilds and codified royal justice improve production and administrative reach while entrenching noble clout and easing light cavalry drills."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev6_dragon_bulwark:0 "Order of the Dragon Danubian Bulwark"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev6_dragon_bulwark:0 "Chivalric frontier leadership bolsters army discipline, fortification defense, and diplomatic stature across Christendom at the price of steep fortress and army upkeep."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev6_palatine_banates:0 "Palatine Baronial Banates"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev6_palatine_banates:0 "Delegating border commands unlocks broad aristocratic reserves and magnate loyalty while entrenching noble dominance and diminishing royal power."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_low_countries:0 "Burgundian-Low Countries Union"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_low_countries:0 "Harmonized ducal councils knit Dijon's vineyards and the Low Countries' cloth cities together, lifting production, diplomacy, and subject loyalty at heavier court costs and wider burgher clout."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev7_lotharingian_poise:0 "Lotharingian Diplomatic Poise"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev7_lotharingian_poise:0 "Independent envoys across imperial and French courts raise Burgundian prestige and diplomatic reputation at the cost of pricier court upkeep and modest fiscal drag."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev7_valois_peerage:0 "Premier Valois Chivalric Peerage"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev7_valois_peerage:0 "Feudal alignment with Paris sharpens Burgundian heavy cavalry and calms aristocratic houses while conceding crown leverage and foreign diplomatic autonomy."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev8_flemish_guilds:0 "Flemish Cloth Guild Compact"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev8_flemish_guilds:0 "Protected loom towns drive exceptional textile production and North Sea trade while magnifying burgher estate power and lowering merchant tax ceilings."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev8_chambre_comptes:0 "Dijon Chambre des Comptes Centralization"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev8_chambre_comptes:0 "Uniform ducal auditing strengthens tax collection and cabinet competence at the cost of urban guild resentment and higher stabilization outlays."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev9_golden_fleece_splendor:0 "Splendor of the Golden Fleece"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev9_golden_fleece_splendor:0 "Unmatched Burgundian patronage elevates cultural tradition, research pace, and urban prosperity while exacting heavy court spending and military maintenance tolls."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev9_ordinance_companies:0 "Burgundian Ordinance Companies"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev9_ordinance_companies:0 "Salaried combined-arms ordinance companies raise battlefield discipline and morale at the cost of steeper army upkeep and strained merchant relations."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_dec_ilkhanate_throne:0 "Heir to the Ilkhanate Throne"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_dec_ilkhanate_throne:0 "Imperial proclamations from the former Ilkhanid capitals bolster dynastic legitimacy, central crown power, and cavalry prestige while testing restless tribal confederations and stability budgets."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev10_diwan_revival:0 "Persian Chancery Revival"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev10_diwan_revival:0 "Trained urban scribes and tax registrars restore administrative efficiency and revenue collection while estranging steppe tribal levies and softening light horsemen."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev10_noyan_tumens:0 "Noyan Tumen Warbands"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev10_noyan_tumens:0 "Mobilized steppe cavalry contingents boost light horse punch and battlefield morale while enlarging tribal autonomy and curbing central tax receipts."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev11_plateau_bastions:0 "Iranian Plateau Mountain Bastions"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev11_plateau_bastions:0 "Reinforced mountain citadels and siege workshops strengthen territorial defense and siege ability while driving up fortification upkeep and slowing caravan traffic."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev11_transoxiana_caravans:0 "Transoxiana-Tabriz Silk Transit"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev11_transoxiana_caravans:0 "Secure trans-plateau caravan accords boost overland trade and regional prosperity while easing battlefield fervor and conceding central leverage to border governors."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev12_persian_ateliers:0 "Persianate Court Ateliers & Madrasahs"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev12_persian_ateliers:0 "Flourishing artistic studios and endowed observatories elevate cultural tradition, scholarship, and prosperity while taxing court budgets and expanding clerical influence."
 STATIC_MODIFIER_NAME_oe_v250_mbp_mod_ev12_citadel_garrisons:0 "Royal Plateau Citadel Garrisons"
 STATIC_MODIFIER_DESC_oe_v250_mbp_mod_ev12_citadel_garrisons:0 "Direct requisitioning of urban revenue funds disciplined standing garrisons and wider reserves at the expense of merchant resentment and higher military upkeep."
