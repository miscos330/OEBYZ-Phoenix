 oe_byz_constantinople_constantine_suburb: "Constantinian Outer District"
 oe_byz_constantinople_constantine_suburb_desc: "Workshops, homes and yards line the roads beyond the walls. Imperial surveyors lay out streets and drains to house the workers and families drawn to the capital.\n\nRequirement: #Y $OE_CITY_REQUIRE_500K$#!. Normally up to #Y 2 expansions#!, or #Y 4#! while holding Beyond the Theodosian Walls; each costs #Y 2000 Gold#! with a base construction time of #Y 1000 days#!.\n\nEach level employs #Y 1,000 laborers#!."
 oe_city_constantine_suburb_maintenance: "Constantinian Outer District Maintenance"
 oe_city_constantine_suburb_orders: "Constantinian Outer District Expansions Used"
 oe_byz_constantinople_blachernae_suburb: "Blachernae Outer District"
 oe_byz_constantinople_blachernae_suburb_desc: "New homes and barracks spread along the roads near the palace and land walls. Soldiers settle their families close to their stations, followed by craftsmen and traders.\n\nRequirement: #Y $OE_CITY_REQUIRE_500K$#!. Normally up to #Y 2 expansions#!, or #Y 4#! while holding Beyond the Theodosian Walls; each costs #Y 2000 Gold#! with a base construction time of #Y 1000 days#!.\n\nEach level employs #Y 1,000 laborers#!."
 oe_city_blachernae_suburb_maintenance: "Blachernae Outer District Maintenance"
 oe_city_blachernae_suburb_orders: "Blachernae Outer District Expansions Used"
 oe_byz_constantinople_janissary_kitchen: "Janissary Kitchens"
 oe_byz_constantinople_janissary_kitchen_desc: "Around the regimental cauldrons, cooks distribute rations and carefully store grain and salted meat. Shared meals sustain discipline while orderly stores reduce waste.\n\nRequirement: #Y $OE_CITY_REQUIRE_RUM$#!. Up to #Y 2 expansions#!, each costing #Y 500 Gold#! with a base construction time of #Y 365 days#!."
 oe_city_janissary_kitchen_maintenance: "Janissary Kitchens Maintenance"
 oe_city_janissary_kitchen_orders: "Janissary Kitchens Expansions Used"
 oe_city_catalog_v9: "Constantinople District Building Catalogue (Version Nine)"
 oe_pillars_upgrade_metropolis: "Elevate to a Megalopolis"
 oe_pillars_upgrade_metropolis_desc: "Choose a directly Byzantine-owned city with at least 400K inhabitants. Spend 10,000 Gold to elevate it immediately to a megalopolis."
 oe_pillars_upgrade_metropolis_choose: "Choose a City with at Least 400K Inhabitants"
 oe_pillars_upgrade_metropolis_none: "No eligible city: it must be directly owned by Byzantium, have City rank and contain at least 400K inhabitants."
 oe_rights_metropolitan_planning: "Metropolitan Planning"
 oe_rights_metropolitan_planning_desc: "After the Phoenix has risen, surveys, waterworks and workshop allotments guide the growth of the empire’s great cities.\n\nByzantium only, after the Fate of the Phoenix disaster has been overcome. Requires Megalopolis rank and excludes Constantinople. Building level limit +50; Production Efficiency +2.5%."
 oe_rights_beyond_the_walls: "Beyond the Theodosian Walls"
 oe_rights_beyond_the_walls_desc: "Allow streets to stretch beyond the Theodosian Walls, drawing roads and fields into the life of the capital. New homes attract settlers, while scattered districts weaken the old defensive line.\n\nConstantinople only. Local Fort Defense -100%, Building Level Limit +100, Migration Attraction +0.1. While held, both outer districts allow two additional expansions each, for a total of four each."
 oe_metropolis_infrastructure: "Metropolitan Infrastructure"
 oe_metropolis_infrastructure_desc: "Streets, drains and public passages make room for more homes and workshops in a crowded metropolis.\n\nExclusive to Byzantium and available only in megalopolis locations. There is no base level allowance: one level per full 3 development, plus one per full 100K population, rounded down separately. Base construction time: 30 days. Each level employs 10,000 laborers and grants +10 building levels and +0.01 migration attraction.\n\nStandard monthly maintenance per level: 0.5 lumber, 0.5 stone and 0.2 tools."
 oe_byz_constantinople_aetius_cistern: "Cistern of Aetius"
 oe_byz_constantinople_aetius_cistern_desc: "Repair retaining walls, clear sediment and reconnect water channels so the capital retains a dependable supply in drought and siege.\n\nLocated in the Eastern Ceremonial Centre; built through the Constantinople expansion plan. Up to 3 expansions, each costing 5,000 Gold with a 365-day base construction time and 2,000 laborers. Each level adds 15 building levels, 0.01% population growth and 50K population capacity."
 oe_byz_constantinople_aetius_cistern_maintenance: "Cistern of Aetius Maintenance"
 oe_city_aetius_cistern_orders: "Cistern of Aetius Expansions Used"
 oe_byz_constantinople_aspar_cistern: "Cistern of Aspar"
 oe_byz_constantinople_aspar_cistern_desc: "Repair retaining walls, clear sediment and reconnect water channels so the capital retains a dependable supply in drought and siege.\n\nLocated in the Mese Avenue; built through the Constantinople expansion plan. Up to 3 expansions, each costing 5,000 Gold with a 365-day base construction time and 2,000 laborers. Each level adds 15 building levels, 0.01% population growth and 50K population capacity."
