# NEW 2026-11-22 v16.5 Module 16.5-C: Colonial Independence Contagion & Gunpowder Empires Modernization Crisis (oe_dec_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v165_finance_twilight.py; edit the generator, not this file.
 oe_sit_twilight_of_empires: "Age of Decolonization & Gunpowder Twilight"
 oe_sit_twilight_of_empires_desc: "From 1750 to 1836, transoceanic empires face cascading colonial independence contagion while ancient Eurasian gunpowder empires confront steam gunboats, unequal treaty ports, and urgent modernization. Will empires survive through reform, yield to a wave of sovereign republics, or forge a multipolar concert settlement?"
 oe_sit_twilight_of_empires_reform: "Reformist Imperial Survival"
 oe_sit_twilight_of_empires_reform_desc: "Bold dominion charters, Tanzimat edicts, and self-strengthening steam arsenals revitalize great empires, enabling them to weather revolutionary storms intact."
 oe_sit_twilight_of_empires_republics: "Wave of Sovereign Republics"
 oe_sit_twilight_of_empires_republics_desc: "Colonial independence contagion breaks open old oceanic monopolies, ushering in an assertive constellation of constitutional sovereign republics and free trade."
 oe_sit_twilight_of_empires_concert: "Multipolar Concert Settlement"
 oe_sit_twilight_of_empires_concert_desc: "Neither reactionary empire nor total upheaval triumphs alone; rival powers, reformed realms, and emancipated states stabilize inside a multipolar diplomatic concert."
