 STATIC_MODIFIER_NAME_oe_dec_mod_dominion_charter: "Colonial Dominion Autonomy Charter"
 STATIC_MODIFIER_DESC_oe_dec_mod_dominion_charter: "Granting local parliamentary charters and commercial voice to overseas dominions defuses independence contagion and preserves imperial commerce."
 STATIC_MODIFIER_NAME_oe_dec_mod_pacification_fleet: "Overseas Pacification Fleet"
 STATIC_MODIFIER_DESC_oe_dec_mod_pacification_fleet: "Expeditionary squadrons and marine garrisons enforce imperial decrees across rebellious harbors, projecting force at the risk of deeper colonial estrangement."
 STATIC_MODIFIER_NAME_oe_dec_mod_foreign_instructors: "Tanzimat & Self-Strengthening Instructors"
 STATIC_MODIFIER_DESC_oe_dec_mod_foreign_instructors: "Imported artillery engineers, staff officers, and modern drill manuals transform traditional imperial formations into disciplined modern corps."
 STATIC_MODIFIER_NAME_oe_dec_mod_treaty_port_privileges: "Gunboat Treaty Port Privileges"
 STATIC_MODIFIER_DESC_oe_dec_mod_treaty_port_privileges: "Naval squadrons stationed off distant estuaries secure low-tariff entrepots, consular courts, and lucrative long-distance trade concessions."
 STATIC_MODIFIER_NAME_oe_dec_mod_outcome_reform_survival: "Reformist Imperial Survival"
 STATIC_MODIFIER_DESC_oe_dec_mod_outcome_reform_survival: "Through timely dominion federalism and self-strengthening reforms, great empires weather the age of revolution with renewed administrative and military vigor."
 STATIC_MODIFIER_NAME_oe_dec_mod_outcome_sovereign_republics: "Wave of Sovereign Republics"
 STATIC_MODIFIER_DESC_oe_dec_mod_outcome_sovereign_republics: "An irreversible tide of colonial emancipation and constitutional assemblies reshapes ocean basins into an interlocking world of sovereign republics and free commerce."
 STATIC_MODIFIER_NAME_oe_dec_mod_outcome_concert_settlement: "Multipolar Concert Settlement"
 STATIC_MODIFIER_DESC_oe_dec_mod_outcome_concert_settlement: "Pragmatic diplomacy balances emancipated states, reformed empires, and maritime powers inside a durable multipolar treaty concert."
 STATIC_MODIFIER_NAME_oe_dec_mod_stamp_tax_friction: "Imperial Stamp & Customs Duties"
 STATIC_MODIFIER_DESC_oe_dec_mod_stamp_tax_friction: "Direct metropolitan levies on overseas legal papers and ports replenish the war-strained treasury while uniting colonial assemblies in furious protest."
 STATIC_MODIFIER_NAME_oe_dec_mod_continental_congress: "Continental Congress Mobilization"
 STATIC_MODIFIER_DESC_oe_dec_mod_continental_congress: "Delegates from restless overseas provinces coordinate boycotts, militias, and constitutional pamphlets declaring natural rights beyond imperial reach."
 STATIC_MODIFIER_NAME_oe_dec_mod_liberty_contagion: "Transoceanic Liberty Contagion"
 STATIC_MODIFIER_DESC_oe_dec_mod_liberty_contagion: "Printing presses carry revolutionary manifestos from harbor to harbor; every successful colonial defiance ignites fresh liberty fervor in neighboring viceroyalties."
 STATIC_MODIFIER_NAME_oe_dec_mod_creole_juntas: "Creole Junta Assemblies"
 STATIC_MODIFIER_DESC_oe_dec_mod_creole_juntas: "Local-born landowners, lawyers, and militia officers form provisional cabildos and juntas, asserting self-rule whenever metropolitan authority falters."
 STATIC_MODIFIER_NAME_oe_dec_mod_war_debt_fatigue: "Motherland War-Debt Exhaustion"
 STATIC_MODIFIER_DESC_oe_dec_mod_war_debt_fatigue: "Back-to-back oceanic wars leave the imperial treasury heavily leveraged and garrisons stretched thin, emboldening colonial independence movements."
 STATIC_MODIFIER_NAME_oe_dec_mod_foreign_intervention: "Rival Overseas Intervention"
 STATIC_MODIFIER_DESC_oe_dec_mod_foreign_intervention: "Foreign admirals, volunteer officers, and covert munitions convoys tip the balance of colonial rebellions into full inter-imperial maritime wars."
 STATIC_MODIFIER_NAME_oe_dec_mod_loyalist_corps: "Loyalist Provincial Corps"
 STATIC_MODIFIER_DESC_oe_dec_mod_loyalist_corps: "Royalists, frontier allies, and conservative merchants rally behind the crown banner, contesting every town hall and harbor against patriot militias."
 STATIC_MODIFIER_NAME_oe_dec_mod_sovereign_republic_charter: "Sovereign Constitutional Republic"
 STATIC_MODIFIER_DESC_oe_dec_mod_sovereign_republic_charter: "Written constitutions, citizen militias, and elected assemblies unleash fierce civic patriotism and rapid commercial enterprise."
 STATIC_MODIFIER_NAME_oe_dec_mod_free_trade_opening: "Abolition of Mercantilist Monopoly"
 STATIC_MODIFIER_DESC_oe_dec_mod_free_trade_opening: "Opening former colonial ports to neutral hulls and direct shipping lowers freight costs and multiplies customs turnover across ocean lanes."
 STATIC_MODIFIER_NAME_oe_dec_mod_postcolonial_trade_network: "Post-Colonial Commercial Realignment"
 STATIC_MODIFIER_DESC_oe_dec_mod_postcolonial_trade_network: "Even after political ties snap, shared languages, credit houses, and shipping lanes forge resilient post-colonial trade partnerships."
 STATIC_MODIFIER_NAME_oe_dec_mod_old_garrison_reaction: "Old Garrison Reactionary Resistance"
 STATIC_MODIFIER_DESC_oe_dec_mod_old_garrison_reaction: "Entrenched traditional regiments overturn cauldrons and block modern drill grounds to protect hereditary stipends and court privileges."
 STATIC_MODIFIER_NAME_oe_dec_mod_gunboat_humiliation: "Gunboat Coercion & Tariff Loss"
 STATIC_MODIFIER_DESC_oe_dec_mod_gunboat_humiliation: "Steam-driven warships anchoring off coastal forts force humiliating indemnities and fixed low tariffs that sap imperial treasury strength."
 STATIC_MODIFIER_NAME_oe_dec_mod_unequal_treaty_ports: "Extraterritorial Treaty Ports"
 STATIC_MODIFIER_DESC_oe_dec_mod_unequal_treaty_ports: "Foreign consular courts and treaty concessions undermine sovereign jurisdiction while unintentionally accelerating the inflow of modern presses and machinery."
 STATIC_MODIFIER_NAME_oe_dec_mod_steam_arsenal: "Imperial Steam Arsenal & Dockyard"
 STATIC_MODIFIER_DESC_oe_dec_mod_steam_arsenal: "State-funded arsenals and steam dockyards cast rifled breechloaders, fabricate boilers, and train a native cadre of industrial engineers."
 STATIC_MODIFIER_NAME_oe_dec_mod_tanzimat_edict: "Tanzimat & Constitutional Reform Edict"
 STATIC_MODIFIER_DESC_oe_dec_mod_tanzimat_edict: "Codified legal equality, salaried tax ministries, and modern secular schools overhaul imperial governance from capital to distant vilayet."
 STATIC_MODIFIER_NAME_oe_dec_mod_viceroy_autonomy_strain: "Provincial Viceroy Autonomy Strain"
 STATIC_MODIFIER_DESC_oe_dec_mod_viceroy_autonomy_strain: "Ambitious regional pashas, nawabs, and viceroys raise private modern regiments and withhold remittances, straining the unity of the realm."
 STATIC_MODIFIER_NAME_oe_dec_mod_silver_outflow_shock: "Silver Outflow & Contraband Tariff Shock"
 STATIC_MODIFIER_DESC_oe_dec_mod_silver_outflow_shock: "Massive contraband imports reverse centuries of bullion inflow, driving up copper-to-silver exchange rates and squeezing peasant taxpayers."
 STATIC_MODIFIER_NAME_oe_dec_mod_modern_naval_academy: "Imperial Modern Naval Academy"
 STATIC_MODIFIER_DESC_oe_dec_mod_modern_naval_academy: "Cadets master celestial navigation, steam propulsion, and ironclad gunnery, forging an officer corps capable of contesting gunboat coercion."
 STATIC_MODIFIER_NAME_oe_dec_mod_rail_telegraph_concessions: "Rail & Telegraph Trunk Network"
 STATIC_MODIFIER_DESC_oe_dec_mod_rail_telegraph_concessions: "Iron rails and copper telegraph wires compress months of courier travel into hours, accelerating troop mobilization and interior commerce."
 STATIC_MODIFIER_NAME_oe_dec_mod_palace_coup_watch: "Reformed Palace Guard Vigilance"
 STATIC_MODIFIER_DESC_oe_dec_mod_palace_coup_watch: "Loyal modernized regiments secure the palace gates and telegraph offices, foiling reactionary plots by ousted conservative cliques."
 STATIC_MODIFIER_NAME_oe_dec_mod_neo_imperial_army: "Synthesized Neo-Imperial Army"
 STATIC_MODIFIER_DESC_oe_dec_mod_neo_imperial_army: "Fusing ancestral martial esprit with rifled infantry, rapid-fire field guns, and professional general staffs creates a formidable modern land power."
 STATIC_MODIFIER_NAME_oe_dec_mod_treaty_defiance: "Revocation of Unequal Treaties"
 STATIC_MODIFIER_DESC_oe_dec_mod_treaty_defiance: "Backed by modern arsenals and diplomatic solidarity, the throne reclaims tariff autonomy and abolishes foreign extraterritorial privileges."
 STATIC_MODIFIER_NAME_oe_dec_mod_phoenix_rebirth: "Phoenix Rebirth of the Modernized Empire"
 STATIC_MODIFIER_DESC_oe_dec_mod_phoenix_rebirth: "Rather than succumbing to twilight, the ancient gunpowder empire completes its industrial, fiscal, and military synthesis—entering the new century as an unbroken peer of the world's great powers."
 STATIC_MODIFIER_NAME_oe_dec_mod_imperial_twilight: "Long Twilight of the Old Order"
 STATIC_MODIFIER_DESC_oe_dec_mod_imperial_twilight: "Stalled reforms, mounting foreign concessions, and restive provinces cast a lengthening shadow over the ancient throne's authority."
 oe_dec.1.title: "Taxation Without Representation"
 oe_dec.1.desc: "To pay off steep transoceanic defense bills, metropolitan ministers impose direct stamp duties and port tariffs across our overseas territories. Colonial merchants and assemblies erupt in protest, proclaiming that no distant parliament may tax subjects denied a seat in its chamber."
 oe_dec.1.a: "Enforce the imperial duties with customs cruisers and royal judges"
 oe_dec.1.b: "Repeal the stamp duties and invite colonial fiscal delegates"
 oe_dec.2.title: "Continental Congress Spark"
 oe_dec.2.desc: "In defiance of royal governors, elected delegates from across the overseas provinces convene a Continental Congress. Pamphlets of natural liberty circulate through every tavern and shipyard, uniting once-rival settlements behind a common banner of self-rule."
 oe_dec.2.a: "Declare the Congress seditious and mobilize loyal garrisons"
 oe_dec.2.b: "Send plenipotentiaries to negotiate a federal dominion compact"
 oe_dec.3.title: "Liberty Contagion Across Neighboring Colonies"
 oe_dec.3.desc: "News of defiant colonial congresses and revolutionary proclamations races down the trade winds! Neighboring overseas subjects across the hemisphere catch the spark—dockworkers strike, militia captains drill beneath tricolors, and liberty desire surges across every distant viceroyalty."
 oe_dec.3.a: "Quarantine revolutionary presses and reinforce coastal citadels"
 oe_dec.3.b: "Preempt contagion with swift local self-government concessions"
 oe_dec.4.title: "Creole Junta Assemblies"
 oe_dec.4.desc: "Wealthy locally born planters, jurists, and merchants chafe under metropolitan appointees shipped from the homeland. Declaring themselves the rightful guardians of provincial order, they form autonomous Creole juntas controlling municipal treasuries and militias."
 oe_dec.4.a: "Recognize Creole municipal councils inside the imperial crown"
 oe_dec.4.b: "Dissolve the juntas and appoint loyal metropolitan viceroys"
 oe_dec.5.title: "Motherland War-Debt Exhaustion"
 oe_dec.5.desc: "Decades of global maritime wars and sovereign debt servicing have stretched our treasury and naval yards to the breaking point. Colonial leaders read our bond prices in the gazettes and conclude the motherland can no longer afford endless overseas coercion."
 oe_dec.5.a: "Retrench overseas garrisons and restructure imperial finances"
 oe_dec.5.b: "Borrow heavily to keep every overseas fortress manned"
 oe_dec.6.title: "Foreign Rival Intervention"
 oe_dec.6.desc: "Rival maritime courts eye the upheaval in overseas empires with gleeful calculation. Secret agents dispatch flintlocks, field cannon, and naval volunteers to rebellious ports—seeking to fracture a rival's oceanic hegemony without fighting at home."
 oe_dec.6.a: "Deploy ocean squadrons to interdict contraband gunrunners"
 oe_dec.6.b: "Convene a maritime neutrality pact to deter rival meddling"
 oe_dec.7.title: "Loyalists vs Patriots"
 oe_dec.7.desc: "Across colonial towns and border settlements, society splits down the middle. Patriot committees seize printing houses and armories while Loyalist merchants, royal officials, and frontier allies muster provincial regiments swearing unyielding fealty to the throne."
 oe_dec.7.a: "Arm the Loyalist Provincial Corps and guarantee their estates"
 oe_dec.7.b: "Offer general amnesty to reunite polarized colonial towns"
 oe_dec.8.title: "Dominion Compromise Charter"
 oe_dec.8.desc: "Visionary jurists draft a bold Dominion Charter granting overseas territories responsible local parliaments, fiscal self-determination, and free internal trade while retaining common defense and sovereign allegiance."
 oe_dec.8.a: "Proclaim the Imperial Dominion Compromise Charter"
 oe_dec.8.b: "Insist on undivided metropolitan supremacy over every colony"
 oe_dec.9.title: "Sovereign Republic Proclamation"
 oe_dec.9.desc: "Beneath tolling bells and newly stitched banners, elected delegates proclaim a Sovereign Constitutional Republic—renouncing hereditary colonial subordination and sending shockwaves through chancelleries on both sides of the ocean."
 oe_dec.9.a: "Embrace constitutional sovereignty and citizen-militia ethos"
 oe_dec.9.b: "Channel revolutionary fervor into orderly commercial treaties"
 oe_dec.10.title: "Abolition of Mercantilist Monopoly"
 oe_dec.10.desc: "Economists and shipping magnates argue that closed colonial navigation acts have outlived their age, breeding smuggling and rebellion. Opening ports to competitive global freight promises far richer customs revenue than closed monopolies ever yielded."
 oe_dec.10.a: "Abolish exclusive navigation monopolies and embrace open shipping"
 oe_dec.10.b: "Preserve preferential imperial tariffs for chartered fleets"
 oe_dec.11.title: "Post-Colonial Trade Realignment"
 oe_dec.11.desc: "As old colonial hierarchies give way to autonomous dominions and new republics, merchant houses hurry to rewrite bills of lading, consular treaties, and credit lines—discovering that free commercial partners often buy more manufactures than coerced subjects ever did."
 oe_dec.11.a: "Seal reciprocal post-colonial commercial and banking treaties"
 oe_dec.11.b: "Focus capital on domestic industry and home-market integration"
 oe_dec.12.title: "Pan-Colonial Independence Wave"
 oe_dec.12.desc: "From Atlantic harbors to tropical archipelagos, a synchronized pan-colonial independence wave sweeps the globe. Old empires face the defining reckoning of the nineteenth century: adapt into federal partnerships or watch overseas domains break free one by one."
 oe_dec.12.a: "Navigate the wave through sovereign constitutional settlements"
 oe_dec.12.b: "Anchor remaining territories in an Imperial Commonwealth Pact"
 oe_dec.13.title: "Old Garrison Resistance vs Modernizers"
 oe_dec.13.desc: "When reformist ministers introduce European-style linear bayonets, regular pay audits, and mobile field artillery, entrenched traditional garrisons erupt in fury—denouncing modern drill as heresy against ancestral martial custom."
 oe_dec.13.a: "Confront the old garrisons and fund a disciplined New Order corps"
 oe_dec.13.b: "Placate the traditional regiments with bonus stipends"
 oe_dec.14.title: "European Military Advisory Missions"
 oe_dec.14.desc: "Veteran artillery officers, fortifications engineers, and cartographers from foreign academies offer to establish a modern Staff College and gunnery school at our capital—closing the technological gap in fire discipline and logistics."
 oe_dec.14.a: "Contract the foreign advisory mission and open a Staff College"
 oe_dec.14.b: "Translate foreign manuals quietly without admitting foreign officers"
 oe_dec.15.title: "Gunboat Diplomacy Off the Coast"
 oe_dec.15.desc: "Smoke-belching steam warships drop anchor just beyond our coastal batteries, unlimbering heavy shell guns while envoys deliver a forty-eight-hour ultimatum demanding tariff reductions and commercial indemnities."
 oe_dec.15.a: "Refuse capitulation and launch crash coastal artillery modernization"
 oe_dec.15.b: "Sign a bitter commercial truce to buy time for self-strengthening"
 oe_dec.16.title: "Treaty Port Extraterritoriality Demand"
 oe_dec.16.desc: "Foreign consuls press for permanent treaty port enclaves governed by their own commercial courts and fixed five-percent customs schedules. Accepting humiliates crown sovereignty, yet total confrontation risks immediate naval blockade."
 oe_dec.16.a: "Counter with regulated imperial customs boards and modern commercial law"
 oe_dec.16.b: "Concede limited treaty port quarters while studying foreign machinery"
 oe_dec.17.title: "Arsenal & Steam Dockyard Self-Strengthening"
 oe_dec.17.desc: "Reformist viceroys propose building imperial steam arsenals, dry docks, and iron foundries capable of casting rifled artillery and assembling gunboats domestically—breaking dependence on fickle foreign arms dealers."
 oe_dec.17.a: "Fund the Imperial Steam Arsenal and Dry-Dock Bureau"
 oe_dec.17.b: "Purchase ready-made foreign steamships to save upfront time"
 oe_dec.18.title: "Tanzimat & Imperial Constitutional Edict"
 oe_dec.18.desc: "From the imperial rose garden, the sovereign proclaims a landmark reorganization decree—replacing corrupt tax farming with salaried ministries, guaranteeing property security for all subjects, and establishing modern provincial councils."
 oe_dec.18.a: "Proclaim the full Tanzimat & Constitutional Reorganization Edict"
 oe_dec.18.b: "Limit reforms strictly to tax collection and military conscription"
 oe_dec.19.title: "Provincial Viceroy Autonomy Strain"
 oe_dec.19.desc: "Commanding locally financed armies and modern regional arsenals, powerful provincial governors begin conducting independent diplomacy and retaining customs revenues—testing whether self-strengthening serves the throne or breeds regional warlordism."
 oe_dec.19.a: "Rotate provincial commands and centralize telegraph and treasury audits"
 oe_dec.19.b: "Grant viceroys wide fiscal autonomy in exchange for nominal loyalty"
 oe_dec.20.title: "Silver Outflow & Contraband Tariff Shock"
 oe_dec.20.desc: "Foreign smuggler clippers flood coastal estuaries with illicit narcotics and untaxed factory textiles, draining millions of taels and silver akce abroad. Silver prices surge against copper coin, impoverishing rural taxpayers and hollowing provincial treasuries."
 oe_dec.20.a: "Appoint an Imperial Commissioner to seize contraband and build domestic mills"
 oe_dec.20.b: "Tax the coastal inflows to patch immediate budget shortfalls"
 oe_dec.21.title: "Imperial Modern Naval Academy"
 oe_dec.21.desc: "Recognizing that wooden galleys and coastal junks cannot deter steam frigates, the Admiralty establishes a Modern Naval Academy teaching trigonometry, steam engineering, torpedo tactics, and fleet signaling to a new generation of officers."
 oe_dec.21.a: "Charter the Imperial Naval Academy and send cadets on overseas cruises"
 oe_dec.21.b: "Focus naval funding solely on harbor mines and coastal batteries"
 oe_dec.22.title: "Rail & Telegraph Concessions"
 oe_dec.22.desc: "Iron trunk railways and electric telegraph lines promise to knit sprawling imperial provinces together as never before—moving regiments and grain across mountain passes in days. Yet foreign syndicates demand mining rights alongside construction loans."
 oe_dec.22.a: "Build state-owned imperial rail and telegraph lines with domestic capital"
 oe_dec.22.b: "Grant limited foreign rail concessions to accelerate trunk completion"
 oe_dec.23.title: "Conservative Palace Coup Risk"
 oe_dec.23.desc: "Ousted tax-farmers, reactionary court clerics, and disgruntled old-guard commanders conspire in the shadow of the palace to depose reformist ministers and burn the new constitutional decrees."
 oe_dec.23.a: "Deploy loyal modernized guards to arrest the conspirators before dawn"
 oe_dec.23.b: "Dismiss controversial reformers to appease conservative palace elders"
 oe_dec.24.title: "Synthesized Neo-Imperial Army"
 oe_dec.24.desc: "After years of arduous arsenals, staff academies, and field maneuvers, our reformed divisions parade before the capital—blending native martial heritage with rifled infantry volleys, steel breechloading cannon, and telegraph-directed logistics."
 oe_dec.24.a: "Standardize the Synthesized Neo-Imperial Army across every frontier"
 oe_dec.24.b: "Maintain an elite modern royal guard while keeping provincial levies lean"
 oe_dec.25.title: "Defying the Unequal Treaties"
 oe_dec.25.desc: "With modern steam arsenals, codified courts, and disciplined divisions backing our diplomats, the moment has arrived to demand full revision of humiliating consular capitulations and reclaim sovereign control over our customs tariffs."
 oe_dec.25.a: "Proclaim full tariff autonomy and abolish consular capitulations"
 oe_dec.25.b: "Negotiate phased tariff recovery through a multilateral conference"
 oe_dec.26.title: "Twilight or Phoenix Rebirth"
 oe_dec.26.desc: "As the final decade of the early modern era closes, history delivers its verdict upon the great gunpowder empires. Either a century of steam arsenals, constitutional law, and modern armies heralds a Phoenix Rebirth—or hesitation seals a long imperial twilight."
 oe_dec.26.a: "Ascend in Phoenix Rebirth as a modernized sovereign great power"
 oe_dec.26.b: "Preserve ancestral ceremony even as global tides sweep past"
