 oe_io3_pi_rus_ulozheniye_code:0 "Sobornoye Ulozheniye Conciliar Statute"
 oe_io3_pi_rus_ulozheniye_code_desc:0 "Adopt a comprehensive assembly code in the Zemsky Sobor uniting regional chancelleries, reinforcing provincial control, and steadying realm stability."
 oe_io3_pi_rus_siberia_fur_charter:0 "Siberian Fur & River Trade Charter"
 oe_io3_pi_rus_siberia_fur_charter_desc:0 "Grant river-corridor trading patents through the Zemsky Sobor, expanding northern fur extraction, merchant capacity, and customs receipts."
 oe_io3_pi_mam_furusiyya_iqta:0 "Majlis Furusiyya Cavalry & Iqta Review"
 oe_io3_pi_mam_furusiyya_iqta_desc:0 "Reaffirm iqta cavalry stipends and Cairo furusiyya tournament standards in the Sultanic Majlis, fortifying Mamluk heavy cavalry and troop morale."
 oe_io3_pi_mam_karimi_spice_charter:0 "Karimi Red Sea & Nile Spice Charter"
 oe_io3_pi_mam_karimi_spice_charter_desc:0 "Ratify Karimi convoy guarantees linking Suez, Cairo, and Alexandria, boosting sea-trade returns and Red Sea maritime presence."
 oe_io3_pi_eur_estates_war_subsidy:0 "Estates General Extraordinary War Subsidy"
 oe_io3_pi_eur_estates_war_subsidy_desc:0 "Secure consent of the Estates General for an extraordinary war subsidy, mobilizing manpower reserves, faster levy recovery, and disciplined field banners."
 oe_io3_pi_eur_free_fair_liberties:0 "Charter of Free Fairs & Guild Liberties"
 oe_io3_pi_eur_free_fair_liberties_desc:0 "Enshrine municipal fair franchises and guild charters through the Estates General, driving workshop output, urban prosperity, and institutional diffusion."
 oe_io3_pa_nobles_court_precedence:0 "Confirm Aristocratic Court Precedence"
 oe_io3_pa_nobles_court_precedence_simple:0 "Noble Court Precedence"
 oe_io3_pa_nobles_court_precedence_desc:0 "Great aristocratic houses ask for formal confirmation of their ceremonial precedence at court in return for decisive parliamentary support."
 oe_io3_pa_nobles_marshal_jurisdiction:0 "Grant Provincial Marshal Jurisdiction"
 oe_io3_pa_nobles_marshal_jurisdiction_simple:0 "Provincial Marshal Authority"
 oe_io3_pa_nobles_marshal_jurisdiction_desc:0 "Provincial lords offer strong parliamentary votes if entrusted with regional marshal oversight and modest noble tax relief for five years."
 oe_io3_pa_nobles_cavalry_remount:0 "Subsidize Noble Cavalry Remount Studs"
 oe_io3_pa_nobles_cavalry_remount_simple:0 "Noble Cavalry Stud Subsidy"
 oe_io3_pa_nobles_cavalry_remount_desc:0 "Aristocratic cavalrymen request a modest treasury subsidy for breeding studs, boosting light cavalry quality while delivering reliable noble votes."
 oe_io3_pa_burghers_staple_charter:0 "Protect Urban Staple Port Monopolies"
 oe_io3_pa_burghers_staple_charter_simple:0 "Urban Staple Privileges"
 oe_io3_pa_burghers_staple_charter_desc:0 "Merchant guilds pledge strong parliamentary support if the crown upholds their staple-market rights and eases burgher tax ceilings for five years."
 oe_io3_pa_burghers_bill_exchange:0 "Charter Commercial Bills of Exchange"
 oe_io3_pa_burghers_bill_exchange_simple:0 "Commercial Clearinghouse"
 oe_io3_pa_burghers_bill_exchange_desc:0 "Banking guilds seek a five-year license for urban bills of exchange, lowering credit interest at a small inflationary cost in return for burgher votes."
 oe_io3_pa_burghers_shipyard_bounty:0 "Grant Merchant Shipyard Timber Bounties"
 oe_io3_pa_burghers_shipyard_bounty_simple:0 "Shipyard Timber Bounties"
 oe_io3_pa_burghers_shipyard_bounty_desc:0 "Coastal burghers offer parliamentary backing in exchange for five-year timber bounties that speed ship construction across domestic yards."
 oe_io3_pa_clergy_canon_courts:0 "Uphold Ecclesiastical & Waqf Courts"
 oe_io3_pa_clergy_canon_courts_simple:0 "Ecclesiastical Court Charter"
 oe_io3_pa_clergy_canon_courts_desc:0 "Clerical deputies demand a five-year confirmation of religious court jurisdiction and charitable endowments in return for decisive votes."
 oe_io3_pa_clergy_cathedral_schools:0 "Fund Cathedral & Madrasa Seminaries"
 oe_io3_pa_clergy_cathedral_schools_simple:0 "Seminary & Madrasa Grant"
 oe_io3_pa_clergy_cathedral_schools_desc:0 "Religious scholars petition for a modest endowment to expand parish schools and madrasas, improving literacy while winning clerical backing."
 oe_io3_pa_clergy_pilgrimage_tolls:0 "Waive Sacred Pilgrimage Road Tolls"
 oe_io3_pa_clergy_pilgrimage_tolls_simple:0 "Pilgrimage Toll Exemption"
 oe_io3_pa_clergy_pilgrimage_tolls_desc:0 "The clergy asks to waive road tolls for pilgrims and wayside hospices for five years, soothing unrest in return for parliamentary votes."
 oe_io3_pa_peasants_commons_pasture:0 "Safeguard Village Commons & Woodlands"
 oe_io3_pa_peasants_commons_pasture_simple:0 "Village Commons Protection"
 oe_io3_pa_peasants_commons_pasture_desc:0 "Rural deputies insist on five-year legal protection for common pastures and village woodlands, raising food output and peasant votes."
 oe_io3_pa_peasants_harvest_remission:0 "Grant Lean-Year Harvest Tax Remission"
 oe_io3_pa_peasants_harvest_remission_simple:0 "Harvest Tax Remission"
 oe_io3_pa_peasants_harvest_remission_desc:0 "Peasant delegates ask for five years of lenient harvest tax collection, trading minor fiscal yield for rural calm and parliamentary backing."
 oe_io3_pa_peasants_irrigation_dikes:0 "Fund Rural Irrigation & Dike Works"
 oe_io3_pa_peasants_irrigation_dikes_simple:0 "Rural Dike Maintenance"
 oe_io3_pa_peasants_irrigation_dikes_desc:0 "Villagers offer strong parliamentary support if public labor is redirected for five years toward sluices, canals, and flood dikes."
 oe_io3_pa_tribes_autumn_hunt:0 "Patronize Great Tribal Hunt & Feasts"
 oe_io3_pa_tribes_autumn_hunt_simple:0 "Tribal Hunt & Kurultai"
 oe_io3_pa_tribes_autumn_hunt_desc:0 "Tribal elders offer enthusiastic parliamentary backing in exchange for royal patronage of the autumn hunt and frontier cavalry feasts."
 oe_io3_pa_tribes_border_grazing:0 "Guarantee Steppe Grazing Corridors"
 oe_io3_pa_tribes_border_grazing_simple:0 "Steppe Grazing Corridors"
 oe_io3_pa_tribes_border_grazing_desc:0 "Nomadic clans ask to confirm seasonal frontier grazing corridors for five years, boosting raw material herds in exchange for tribal support."
 oe_io3.1.title:0 "Celestial Assembly of the Middle Kingdom"
 oe_io3.1.desc:0 "Envoys bearing jade tallies, silk manifests, and classical editions converge upon the halls of the Middle Kingdom as a landmark multilateral charter takes effect across East Asia."
 oe_io3.1.a:0 "Host the Grand Tributary Banquet"
 oe_io3.1.b:0 "Endow the Guest Scholars' Academy"
 oe_io3.2.title:0 "Great Ecumenical Synod of the Patriarchate"
 oe_io3.2.desc:0 "Metropolitans, abbots, and royal emissaries of our Autocephalous Patriarchate affix their wax seals to a conciliar decree, pledging peace, liturgical splendor, and mutual monastic patronage."
 oe_io3.2.a:0 "Proclaim Conciliar Unity Across Dioceses"
 oe_io3.2.b:0 "Endow the Great Lavras & Scriptoria"
 oe_io3.3.title:0 "Imperial Diet of the Holy Roman Empire"
 oe_io3.3.desc:0 "Electors, imperial princes, and free-city syndics conclude a momentous vote in the Reichstag, binding the circles together under common defense and imperial fiscal registries."
 oe_io3.3.a:0 "Fortify the Imperial Circle Bastions"
 oe_io3.3.b:0 "Reform the Reichstag Chancery Ledgers"
 oe_io3.4.title:0 "Sacred Consistory of the Catholic Church"
 oe_io3.4.desc:0 "Cardinals and royal ambassadors emerge from the Apostolic Consistory bearing a newly ratified papal bull, summoning Catholic Christendom either to sacred truce or frontier defense."
 oe_io3.4.a:0 "Uphold the Sacred Truce of God"
 oe_io3.4.b:0 "Consecrate the Frontier Crusade Banners"
 oe_io3.5.title:0 "Grand Council of the Yarlik & Bakufu"
 oe_io3.5.desc:0 "Messengers ride along fortified Yam stations and archipelago sea lanes alike as a sweeping multilateral ordinance codifies tribute obligations, relay security, and warrior discipline."
 oe_io3.5.a:0 "Expand the Relay & Diplomatic Packets"
 oe_io3.5.b:0 "Enforce the Strict Martial Ordinance"
 oe_io3.6.title:0 "Grand Congress of the Eurasian Concert"
 oe_io3.6.desc:0 "Plenipotentiaries from every corner of Eurasia gather around the treaty table of the Concert, voting on commercial navigation rights and multilateral guarantees of continental equilibrium."
 oe_io3.6.a:0 "Champion Trans-Eurasian Free Navigation"
 oe_io3.6.b:0 "Guarantee the Continental Balance of Power"
 oe_io3.7.title:0 "Civilizational Parliament in Grand Session"
 oe_io3.7.desc:0 "From the marble galleries of the Senate and the yurts of the Kurultai to the halls of the Six Ministries, Divan, Sobor, Majlis, and Estates General, our realm's own native assembly convenes in full majesty."
 oe_io3.7.a:0 "Harness the Legislative Reform Momentum"
 oe_io3.7.b:0 "Direct Parliamentary Grants to Public Works"
 oe_io3.8.title:0 "Historic Estates Compact & Constitutional Accord"
 oe_io3.8.desc:0 "After spirited debate over tax charters, guild liberties, monastic courts, and frontier pastures, the realm's estates reach a landmark settlement that reshapes the balance between crown and assembly."
 oe_io3.8.a:0 "Seal the Charter of Constitutional Concord"
 oe_io3.8.b:0 "Vindicate the Crown's Legislative Prerogative"
