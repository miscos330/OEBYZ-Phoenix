l_english:
 STATIC_MODIFIER_NAME_oe_tbd_raid_loc: "Raided"
 STATIC_MODIFIER_DESC_oe_tbd_raid_loc: "Raiders crossed the border, burned the houses and drove off the animals."
 STATIC_MODIFIER_NAME_oe_tbd_raid_light_loc: "Raided (Light)"
 STATIC_MODIFIER_DESC_oe_tbd_raid_light_loc: "Raiders crossed the border, but the castle garrison held most of them off."
 STATIC_MODIFIER_NAME_oe_tbd_deserted_loc: "Empty Border Villages"
 STATIC_MODIFIER_DESC_oe_tbd_deserted_loc: "The peasants have moved inland to escape the raids, and the border villages stand half empty."
 STATIC_MODIFIER_NAME_oe_tbd_driven_loc: "Peasants Driven Back"
 STATIC_MODIFIER_DESC_oe_tbd_driven_loc: "Soldiers drove the runaway peasants back to the border villages, and the villages are uneasy."
 STATIC_MODIFIER_NAME_oe_tbd_fortified_loc: "Castles Repaired"
 STATIC_MODIFIER_DESC_oe_tbd_fortified_loc: "The castles (kastra) on the border have mended walls and more men."
 STATIC_MODIFIER_NAME_oe_tbd_fortified: "Castles Repaired"
 STATIC_MODIFIER_DESC_oe_tbd_fortified: "This march has repaired the castles on its border. Border pressure −20; raids do half the damage."
 STATIC_MODIFIER_NAME_oe_tbd_levy: "New Border Troops"
 STATIC_MODIFIER_DESC_oe_tbd_levy: "This march has raised new border troops. Border pressure −10."
 STATIC_MODIFIER_NAME_oe_tbd_hired: "Foreign Mercenaries"
 STATIC_MODIFIER_DESC_oe_tbd_hired: "This march has hired foreign mercenaries to guard the border. Border pressure −15; the mercenaries may cause trouble each year."
 oe_tbd_fortify: "Repair the Castles"
 oe_tbd_fortify_desc: "From the second half of the thirteenth century the empire was divided into small districts (katepanikia), each under a kephale who held civil and military command, often from a castle (kastron). From 1342 Stefan Dušan of Serbia took one Macedonian town after another; in September 1345 Serres fell after a long siege.\nRepair the border castles of a march. Costs 100 gold; once per march in 10 years. For 10 years: border pressure −20 and raids do half the damage; the march gets reinforcement speed +10%; its border jurisdiction locations get defence +15%.\nTo buy peace from a strong neighbour, use Buy Peace with Tribute."
 oe_tbd_levy: "Raise Border Troops"
 oe_tbd_levy_desc: "After 1261 the emperor could form the pronoia holders into army units whenever he needed their service.\nRaise border troops in a march. Costs 50 gold; once per march in 5 years. 2 theme regiments (of the current age) are raised at its seat; for 5 years border pressure −10 and the march gets manpower +10%.\nTo buy peace from a strong neighbour, use Buy Peace with Tribute."
 oe_tbd_hire: "Hire Foreign Troops"
 oe_tbd_hire_desc: "In January 1303 the Catalan Company, hired by Andronikos II against the Turkish emirates of Asia Minor, reached Constantinople. In April 1305 its leader Roger de Flor was murdered at Adrianople, and the company then ravaged Thrace for two years.\nHire foreign troops to guard the border of a march. Costs 40 gold; once per march in 5 years. For 5 years border pressure −15 and the march gets land morale +5%; each January there is a 10% chance that the mercenaries make trouble.\nTo buy peace from a strong neighbour, use Buy Peace with Tribute."
 oe_tbd_fortify_card: "Repair a march's border castles: less border pressure, raids do half the damage."
 oe_tbd_levy_card: "Raise new border troops in a march: less border pressure."
 oe_tbd_hire_card: "Hire foreign troops for a march: less border pressure, but they may cause trouble."
 oe_tbd_fortify_select: "Choose a march"
 oe_tbd_fortify_none: "@trigger_no!No march can be chosen (only marches qualify; once per march in 10 years)."
 oe_tbd_allow_fortify: "The treasury holds at least 100 gold"
 oe_tbd_levy_select: "Choose a march"
 oe_tbd_levy_none: "@trigger_no!No march can be chosen (only marches qualify; once per march in 5 years)."
 oe_tbd_allow_levy: "The treasury holds at least 50 gold"
 oe_tbd_hire_select: "Choose a march"
 oe_tbd_hire_none: "@trigger_no!No march can be chosen (only marches qualify; once per march in 5 years)."
 oe_tbd_allow_hire: "The treasury holds at least 40 gold"
 oe_tbd_fortify_tt: "−100 gold.\nThe chosen march for 10 years: border pressure −20, raids do half the damage, reinforcement speed +10%; its border jurisdiction locations defence +15%. It cannot be repaired again for 10 years."
 oe_tbd_levy_tt: "−50 gold.\n2 theme regiments are raised at the chosen march's seat; for 5 years border pressure −10, manpower +10%. No new levy there for 5 years."
 oe_tbd_hire_tt: "−40 gold.\nThe chosen march for 5 years: border pressure −15, land morale +5%; each January a 10% chance that the mercenaries make trouble. No new hire there for 5 years."
 oe_tbd_band_2: "#R Threat#!"
 oe_tbd_band_1: "#Y Threat#!"
 oe_tbd_band_0: "Threat"
 OE_TBD_CARD_TT: "Border pressure [Country.MakeScope.GetVariable('oe_tbd_pressure').GetValue|0] (0 to 100), recomputed each month from the foreign neighbours of the jurisdiction's border:\n[Country.MakeScope.GetVariable('oe_tbd_n_war').GetValue|0] at war with the empire, +40 each;\n[Country.MakeScope.GetVariable('oe_tbd_n_hostile').GetValue|0] hostile (a rival either way, or opinion of the empire at −50 or lower), +25 each;\n[Country.MakeScope.GetVariable('oe_tbd_n_strong').GetValue|0] others with a larger army than this march, +10 each;\ncastles, border troops and mercenaries −[Country.MakeScope.ScriptValue('oe_tbd_cut')|0] (castles −20, troops −10, mercenaries −15).\nFrom 40 on, each month there is a chance of pressure / 5 % of trouble: at most one in the empire a month, at most 2 per march in 12 months."
 oe_tbd.1.t: "Raid on the Border"
 oe_tbd.1.d1: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessalonica. In late 1342 or early 1343 Umur sailed up the Evros with some 300 ships and plundered Thrace for a few months.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The castle garrison held most of them off, but the villages outside the walls still suffered."
 oe_tbd.1.d2: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessalonica. In late 1342 or early 1343 Umur sailed up the Evros with some 300 ships and plundered Thrace for a few months.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border and plundered [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName], burning houses and driving off the animals."
 oe_tbd.1.d: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessalonica. In late 1342 or early 1343 Umur sailed up the Evros with some 300 ships and plundered Thrace for a few months.\n\nNow a band of raiders has crossed the border and plundered villages in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]."
 oe_tbd.1.a1: "Send relief"
 oe_tbd.1.a1.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Raided (Light) for 2 years, max control −5%, monthly prosperity −0.25%.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty −1, counted in the loyalty target for 5 years.\nThe treasury loses half a month of tax income, and one more month goes to relief."
 oe_tbd.1.b1: "Let the locals rebuild"
 oe_tbd.1.b1.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Raided for 2 years, max control −10%, monthly prosperity −0.5%.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty −3, counted in the loyalty target for 5 years.\nThe treasury loses half a month of tax income."
 oe_tbd.1.a2: "Send relief"
 oe_tbd.1.a2.tt: "The castle held most of the raiders off; the damage is halved.\nThe raid leaves no lasting damage there.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty unchanged.\nThe treasury loses a quarter of a month of tax income, and one more month goes to relief."
 oe_tbd.1.b2: "Let the locals rebuild"
 oe_tbd.1.b2.tt: "The castle held most of the raiders off; the damage is halved.\n[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Raided (Light) for 2 years, max control −5%, monthly prosperity −0.25%.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty −2, counted in the loyalty target for 5 years.\nThe treasury loses a quarter of a month of tax income."
 oe_tbd.2.t: "The Border Villages Empty"
 oe_tbd.2.d1: "Under Andronikos II the Ottoman advance in Asia Minor sent a flood of refugees into the empire's European provinces. Between 1343 and 1345 Turkish troops plundered the Thracian countryside again and again, and Constantinople ran short of food.\n\nNow, after one raid after another, the peasants of [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.d: "Under Andronikos II the Ottoman advance in Asia Minor sent a flood of refugees into the empire's European provinces. Between 1343 and 1345 Turkish troops plundered the Thracian countryside again and again, and Constantinople ran short of food.\n\nNow, after one raid after another, the peasants of the border villages of [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.a: "Let them settle inland"
 oe_tbd.2.a.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Empty Border Villages for 5 years, population growth −0.5%, max control −5%."
 oe_tbd.2.b: "Seed grain and tax relief to bring them home"
 oe_tbd.2.b.tt: "The treasury pays 2 months of tax income. The peasants return to the border villages."
 oe_tbd.2.c: "Send soldiers to drive them back"
 oe_tbd.2.c.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty −2, counted in the loyalty target for 5 years.\n[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Peasants Driven Back for 2 years, unrest +0.5."
 oe_tbd.3.t: "Men Cross the Border"
 oe_tbd.3.d1: "Momchil was a Bulgarian. Before 1341 he and his men served Andronikos III as mercenaries; later he went to Serbia to serve Stefan Dušan and gathered a company of two thousand. In 1343 Kantakouzenos gave him the governance of Merope in the Rhodopes. In the summer of 1344 he declared himself independent, with Xanthi as his seat; on 7 July 1345 he fell at Peritheorion.\n\nNow a band of soldiers from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] has crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.d: "Momchil was a Bulgarian. Before 1341 he and his men served Andronikos III as mercenaries; later he went to Serbia to serve Stefan Dušan and gathered a company of two thousand. In 1343 Kantakouzenos gave him the governance of Merope in the Rhodopes. In the summer of 1344 he declared himself independent, with Xanthi as his seat; on 7 July 1345 he fell at Peritheorion.\n\nNow a band of foreign soldiers has crossed into [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.a: "Enrol them in the army of [SCOPE.sCountry('oe_tbd_ev_theme').GetName]"
 oe_tbd.3.a.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: 1 theme regiment (of the current age) is raised at its seat."
 oe_tbd.3.b: "Send them to Constantinople"
 oe_tbd.3.b.tt: "Manpower +3 months of manpower growth."
 oe_tbd.3.c: "Turn them away"
 oe_tbd.3.c.tt: "No effect."
 oe_tbd.4.t: "Raiders Beaten Off"
 oe_tbd.4.d1: "The empire's border defence relied on castles that held an invader up until the main army arrived. From the second half of the thirteenth century each small district was under a kephale with civil and military command, often seated in a castle (kastron).\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The repaired castle shut its gates, the garrison shot from the walls, and the raiders withdrew with little to show for it."
 oe_tbd.4.d: "The empire's border defence relied on castles that held an invader up until the main army arrived. From the second half of the thirteenth century each small district was under a kephale with civil and military command, often seated in a castle (kastron).\n\nNow a band of raiders has crossed into [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The repaired castle shut its gates, and the raiders withdrew with little to show for it."
 oe_tbd.4.a: "Reward the garrison"
 oe_tbd.4.a.tt: "The treasury pays 1 month of tax income.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty +3, counted in the loyalty target for 5 years."
 oe_tbd.4.b: "Report the victory to the court"
 oe_tbd.4.b.tt: "Prestige +5."
 oe_tbd.5.t: "Mercenaries Make Trouble"
 oe_tbd.5.d: "In 1304 the Catalan Company, around Cyzicus in Asia Minor, had spent two or three times its pay and was out plundering. On 30 April 1305 its leader Roger de Flor was murdered at Adrianople, and the company then ravaged Thrace for two years.\n\nNow the foreign mercenaries hired by [SCOPE.sCountry('oe_tbd_ev_theme').GetName] complain that their pay is too small and are seizing grain in the countryside."
 oe_tbd.5.a: "Raise their pay from the treasury"
 oe_tbd.5.a.tt: "The treasury pays 2 months of tax income."
 oe_tbd.5.b: "Let [SCOPE.sCountry('oe_tbd_ev_theme').GetName] deal with it"
 oe_tbd.5.b.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty −5, counted in the loyalty target for 5 years."
 oe_tbd.5.c: "Dismiss them"
 oe_tbd.5.c.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName] loses Foreign Mercenaries: the border pressure cut of 15 ends."
 oe_tbd.9.t: "Border defence: carry out"
