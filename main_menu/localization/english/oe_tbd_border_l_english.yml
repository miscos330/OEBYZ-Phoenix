l_english:
 STATIC_MODIFIER_NAME_oe_tbd_raid_loc: "Raided"
 STATIC_MODIFIER_DESC_oe_tbd_raid_loc: "Raiders crossed the border, burned the houses and drove off the animals."
 STATIC_MODIFIER_NAME_oe_tbd_raid_light_loc: "Raided (Light)"
 STATIC_MODIFIER_DESC_oe_tbd_raid_light_loc: "Raiders crossed the border, but the castle garrison held most of them off."
 STATIC_MODIFIER_NAME_oe_tbd_deserted_loc: "Empty Border Villages"
 STATIC_MODIFIER_DESC_oe_tbd_deserted_loc: "The peasants have moved inland to escape the raids, and the border villages stand half empty."
 STATIC_MODIFIER_NAME_oe_tbd_driven_loc: "Peasants Driven Back"
 STATIC_MODIFIER_DESC_oe_tbd_driven_loc: "Soldiers drove the runaway peasants back to the border villages, and the villages are uneasy."
 STATIC_MODIFIER_NAME_oe_tbd_fortified_loc: "Castles Repaired"
 STATIC_MODIFIER_DESC_oe_tbd_fortified_loc: "The castles (kastra) on the border have mended walls and more men."
 STATIC_MODIFIER_NAME_oe_tbd_fortified: "Castles Repaired"
 STATIC_MODIFIER_DESC_oe_tbd_fortified: "This march has repaired the castles on its border. Border pressure #G −20#!; raids do half the damage."
 STATIC_MODIFIER_NAME_oe_tbd_levy: "New Border Troops"
 STATIC_MODIFIER_DESC_oe_tbd_levy: "This march has raised new border troops. Border pressure #G −10#!."
 STATIC_MODIFIER_NAME_oe_tbd_hired: "Foreign Mercenaries"
 STATIC_MODIFIER_DESC_oe_tbd_hired: "This march has hired foreign mercenaries to guard the border. Border pressure #G −15#!; the mercenaries may cause trouble each year."
 oe_tbd_fortify: "Repair the Castles"
 oe_tbd_fortify_desc: "#F From the second half of the thirteenth century the empire was divided into small districts (katepanikia), each under a kephale who held civil and military command, often from a castle (kastron). From 1342 Stefan Dušan of Serbia took one Macedonian town after another; in September 1345 Serres fell after a long siege.#!\nRepair the border castles of a [Concept('oe_tu_march','march')|e]. Costs #R 100#! gold; once per march in #Y 10#! years. For #Y 10#! years: border pressure #G −20#! and raids do half the damage; the march gets reinforcement speed #G +10%#!; its border jurisdiction locations get defence #G +15%#!.\nTo buy peace from a strong neighbour, use Buy Peace with Tribute."
 oe_tbd_levy: "Raise Border Troops"
 oe_tbd_levy_desc: "#F After 1261 the emperor could form the pronoia holders into army units whenever he needed their service.#!\nRaise border troops in a [Concept('oe_tu_march','march')|e]. Costs #R 50#! gold; once per march in #Y 5#! years. #G 2#! theme regiments (of the current age) are raised at its seat; for #Y 5#! years border pressure #G −10#! and the march gets manpower #G +10%#!.\nTo buy peace from a strong neighbour, use Buy Peace with Tribute."
 oe_tbd_hire: "Hire Foreign Troops"
 oe_tbd_hire_desc: "#F In January 1303 the Catalan Company, hired by Andronikos II against the Turkish emirates of Asia Minor, reached Constantinople. In April 1305 its leader Roger de Flor was murdered at Adrianople, and the company then ravaged Thrace for two years.#!\nHire foreign troops to guard the border of a [Concept('oe_tu_march','march')|e]. Costs #R 40#! gold; once per march in #Y 5#! years. For #Y 5#! years border pressure #G −15#! and the march gets land morale #G +5%#!; each January there is a #R 10%#! chance that the mercenaries make trouble.\nTo buy peace from a strong neighbour, use Buy Peace with Tribute."
 oe_tbd_fortify_card: "Repair a march's border castles: less border pressure, raids do half the damage."
 oe_tbd_levy_card: "Raise new border troops in a march: less border pressure."
 oe_tbd_hire_card: "Hire foreign troops for a march: less border pressure, but they may cause trouble."
 oe_tbd_fortify_select: "Choose a march"
 oe_tbd_fortify_none: "@trigger_no!No march can be chosen (only marches qualify; once per march in #Y 10#! years)."
 oe_tbd_allow_fortify: "The treasury holds at least #Y 100#! gold"
 oe_tbd_levy_select: "Choose a march"
 oe_tbd_levy_none: "@trigger_no!No march can be chosen (only marches qualify; once per march in #Y 5#! years)."
 oe_tbd_allow_levy: "The treasury holds at least #Y 50#! gold"
 oe_tbd_hire_select: "Choose a march"
 oe_tbd_hire_none: "@trigger_no!No march can be chosen (only marches qualify; once per march in #Y 5#! years)."
 oe_tbd_allow_hire: "The treasury holds at least #Y 40#! gold"
 oe_tbd_fortify_tt: "#R −100#! gold.\nThe chosen [Concept('oe_tu_march','march')|e] for #Y 10#! years: border pressure #G −20#!, raids do half the damage, reinforcement speed #G +10%#!; its border jurisdiction locations defence #G +15%#!. It cannot be repaired again for #Y 10#! years."
 oe_tbd_levy_tt: "#R −50#! gold.\n#G 2#! theme regiments are raised at the chosen [Concept('oe_tu_march','march')|e]'s seat; for #Y 5#! years border pressure #G −10#!, manpower #G +10%#!. No new levy there for #Y 5#! years."
 oe_tbd_hire_tt: "#R −40#! gold.\nThe chosen [Concept('oe_tu_march','march')|e] for #Y 5#! years: border pressure #G −15#!, land morale #G +5%#!; each January a #R 10%#! chance that the mercenaries make trouble. No new hire there for #Y 5#! years."
 oe_tbd_band_2: "#R Threat#!"
 oe_tbd_band_1: "#Y Threat#!"
 oe_tbd_band_0: "Threat"
 OE_TBD_CARD_TT: "Border pressure [Country.MakeScope.GetVariable('oe_tbd_pressure').GetValue|0] (#Y 0#! to 100), recomputed each month from the foreign neighbours of the jurisdiction's border:\n[Country.MakeScope.GetVariable('oe_tbd_n_war').GetValue|0] at war with the empire, #Y +40#! each;\n[Country.MakeScope.GetVariable('oe_tbd_n_hostile').GetValue|0] hostile (a rival either way, or opinion of the empire at #Y −50#! or lower), #Y +25#! each;\n[Country.MakeScope.GetVariable('oe_tbd_n_strong').GetValue|0] others with a larger army than this [Concept('oe_tu_march','march')|e], #Y +10#! each;\ncastles, border troops and mercenaries −[Country.MakeScope.ScriptValue('oe_tbd_cut')|0] (castles #Y −20#!, troops #Y −10#!, mercenaries #Y −15#!).\nFrom #Y 40#! on, each month there is a chance of pressure / #Y 5#! % of trouble: at most one in the empire a month, at most #Y 2#! per march in #Y 12#! months."
 oe_tbd.1.t: "Raid on the Border"
 oe_tbd.1.d1_pre: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessaloniki.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The castle garrison held most of them off, but the villages outside the walls still suffered."
 oe_tbd.1.d2_pre: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessaloniki.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border and plundered [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName], burning houses and driving off the animals."
 oe_tbd.1.d_pre: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessaloniki.\n\nNow a band of raiders has crossed the border and plundered villages in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]."
 oe_tbd.1.d1_1337: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessaloniki. In late 1342 or early 1343 Umur sailed up the Evros with some #Y 300#! ships and plundered Thrace for a few months.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The castle garrison held most of them off, but the villages outside the walls still suffered."
 oe_tbd.1.d2_1337: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessaloniki. In late 1342 or early 1343 Umur sailed up the Evros with some #Y 300#! ships and plundered Thrace for a few months.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border and plundered [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName], burning houses and driving off the animals."
 oe_tbd.1.d_1337: "In 1332 and 1333 Umur of Aydin, emir from 1334, raided across the Aegean with his fleet and struck Negroponte and the Greek mainland. Around 1334 the army of Andronikos III drove off a large Turkish raiding party near Thessaloniki. In late 1342 or early 1343 Umur sailed up the Evros with some #Y 300#! ships and plundered Thrace for a few months.\n\nNow a band of raiders has crossed the border and plundered villages in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]."
 oe_tbd.1.d1: "Along the empire's long frontiers, marcher castles and standing garrisons bore the brunt of defence, yet hostile horsemen and raiding bands still slipped across the border to strike the open villages beyond the walls.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The castle garrison held most of them off, but the villages outside the walls still suffered."
 oe_tbd.1.d2: "Along the empire's long frontiers, marcher castles and standing garrisons bore the brunt of defence, yet hostile horsemen and raiding bands still slipped across the border to strike the open villages beyond the walls.\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border and plundered [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName], burning houses and driving off the animals."
 oe_tbd.1.d: "Along the empire's long frontiers, marcher castles and standing garrisons bore the brunt of defence, yet hostile horsemen and raiding bands still slipped across the border to strike the open villages beyond the walls.\n\nNow a band of raiders has crossed the border and plundered villages in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]."
 oe_tbd.1.a1: "Send relief"
 oe_tbd.1.a1.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Raided (Light) for #Y 2#! years, max control #R −5%#!, monthly prosperity #R −0.25%#!.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty #R −1#!, counted in the loyalty target for #Y 5#! years.\nThe treasury loses half a month of tax income, and one more month goes to relief."
 oe_tbd.1.b1: "Let the locals rebuild"
 oe_tbd.1.b1.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Raided for #Y 2#! years, max control #R −10%#!, monthly prosperity #R −0.5%#!.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty #R −3#!, counted in the loyalty target for #Y 5#! years.\nThe treasury loses half a month of tax income."
 oe_tbd.1.a2: "Send relief"
 oe_tbd.1.a2.tt: "The castle held most of the raiders off; the damage is halved.\nThe raid leaves no lasting damage there.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty unchanged.\nThe treasury loses a quarter of a month of tax income, and one more month goes to relief."
 oe_tbd.1.b2: "Let the locals rebuild"
 oe_tbd.1.b2.tt: "The castle held most of the raiders off; the damage is halved.\n[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Raided (Light) for #Y 2#! years, max control #R −5%#!, monthly prosperity #R −0.25%#!.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty #R −2#!, counted in the loyalty target for #Y 5#! years.\nThe treasury loses a quarter of a month of tax income."
 oe_tbd.2.t: "The Border Villages Empty"
 oe_tbd.2.d1_pre: "Under Andronikos II the Ottoman advance in Asia Minor sent a flood of refugees into the empire's European provinces. Between 1305 and 1307 the Catalan Company, based at Gallipoli and joined by Turkish allies, plundered Thrace, and the peasants fled into the towns.\n\nNow, after one raid after another, the peasants of [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.d_pre: "Under Andronikos II the Ottoman advance in Asia Minor sent a flood of refugees into the empire's European provinces. Between 1305 and 1307 the Catalan Company, based at Gallipoli and joined by Turkish allies, plundered Thrace, and the peasants fled into the towns.\n\nNow, after one raid after another, the peasants of the border villages of [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.d1_1337: "Under Andronikos II the Ottoman advance in Asia Minor sent a flood of refugees into the empire's European provinces. Between 1343 and 1345 Turkish troops plundered the Thracian countryside again and again, and Constantinople ran short of food.\n\nNow, after one raid after another, the peasants of [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.d_1337: "Under Andronikos II the Ottoman advance in Asia Minor sent a flood of refugees into the empire's European provinces. Between 1343 and 1345 Turkish troops plundered the Thracian countryside again and again, and Constantinople ran short of food.\n\nNow, after one raid after another, the peasants of the border villages of [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.d1: "Whenever border raids come one after another, the farmers of the frontier villages can no longer work their fields in safety; once the borderland empties, both the tax rolls and the local levies of the march dwindle.\n\nNow, after one raid after another, the peasants of [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.d: "Whenever border raids come one after another, the farmers of the frontier villages can no longer work their fields in safety; once the borderland empties, both the tax rolls and the local levies of the march dwindle.\n\nNow, after one raid after another, the peasants of the border villages of [SCOPE.sCountry('oe_tbd_ev_theme').GetName] are driving their animals inland."
 oe_tbd.2.a: "Let them settle inland"
 oe_tbd.2.a.tt: "[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Empty Border Villages for #Y 5#! years, population growth #R −0.5%#!, max control #R −5%#!."
 oe_tbd.2.b: "Seed grain and tax relief to bring them home"
 oe_tbd.2.b.tt: "The treasury pays #R 2#! months of tax income. The peasants return to the border villages."
 oe_tbd.2.c: "Send soldiers to drive them back"
 oe_tbd.2.c.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty #R −2#!, counted in the loyalty target for #Y 5#! years.\n[SCOPE.sLocation('oe_tbd_ev_loc').GetName]: Peasants Driven Back for #Y 2#! years, unrest #R +0.5#!."
 oe_tbd.3.t: "Men Cross the Border"
 oe_tbd.3.d1_pre: "In 1301 some ten thousand Alans crossed the Danube with their families and asked to serve the empire. Andronikos II took them on, and the next year they marched with Michael IX into Asia Minor, but they could not hold back the Turks.\n\nNow a band of soldiers from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] has crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.d_pre: "In 1301 some ten thousand Alans crossed the Danube with their families and asked to serve the empire. Andronikos II took them on, and the next year they marched with Michael IX into Asia Minor, but they could not hold back the Turks.\n\nNow a band of foreign soldiers has crossed into [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.d1_1337: "Momchil was a Bulgarian. Before 1341 he and his men served Andronikos III as mercenaries; later he went to Serbia to serve Stefan Dušan and gathered a company of two thousand. In 1343 Kantakouzenos gave him the governance of Merope in the Rhodopes. In the summer of 1344 he declared himself independent, with Xanthi as his seat; on 7 July 1345 he fell at Peritheorion.\n\nNow a band of soldiers from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] has crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.d_1337: "Momchil was a Bulgarian. Before 1341 he and his men served Andronikos III as mercenaries; later he went to Serbia to serve Stefan Dušan and gathered a company of two thousand. In 1343 Kantakouzenos gave him the governance of Merope in the Rhodopes. In the summer of 1344 he declared himself independent, with Xanthi as his seat; on 7 July 1345 he fell at Peritheorion.\n\nNow a band of foreign soldiers has crossed into [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.d1: "From ancient times the empire's frontier commanders have received deserters and border warriors crossing from neighbouring realms, enrolling them in the march garrisons or sending them on to the imperial armies when their arms could be trusted.\n\nNow a band of soldiers from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] has crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.d: "From ancient times the empire's frontier commanders have received deserters and border warriors crossing from neighbouring realms, enrolling them in the march garrisons or sending them on to the imperial armies when their arms could be trusted.\n\nNow a band of foreign soldiers has crossed into [SCOPE.sCountry('oe_tbd_ev_theme').GetName] and offers to serve the empire."
 oe_tbd.3.a: "Enrol them in the army of [SCOPE.sCountry('oe_tbd_ev_theme').GetName]"
 oe_tbd.3.a.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: #Y 1#! theme regiment (of the current age) is raised at its seat."
 oe_tbd.3.b: "Send them to Constantinople"
 oe_tbd.3.b.tt: "Manpower #G +3#! months of manpower growth."
 oe_tbd.3.c: "Turn them away"
 oe_tbd.3.c.tt: "No effect."
 oe_tbd.4.t: "Raiders Beaten Off"
 oe_tbd.4.d1: "The empire's border defence relied on castles that held an invader up until the main army arrived. From the second half of the thirteenth century each small district was under a kephale with civil and military command, often seated in a castle (kastron).\n\nNow men from [SCOPE.sCountry('oe_tbd_ev_foe').GetName] have crossed the border into [SCOPE.sLocation('oe_tbd_ev_loc').GetName] in [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The repaired castle shut its gates, the garrison shot from the walls, and the raiders withdrew with little to show for it."
 oe_tbd.4.d: "The empire's border defence relied on castles that held an invader up until the main army arrived. From the second half of the thirteenth century each small district was under a kephale with civil and military command, often seated in a castle (kastron).\n\nNow a band of raiders has crossed into [SCOPE.sCountry('oe_tbd_ev_theme').GetName]. The repaired castle shut its gates, and the raiders withdrew with little to show for it."
 oe_tbd.4.a: "Reward the garrison"
 oe_tbd.4.a.tt: "The treasury pays #R 1#! month of tax income.\n[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty #G +3#!, counted in the loyalty target for #Y 5#! years."
 oe_tbd.4.b: "Report the victory to the court"
 oe_tbd.4.b.tt: "Prestige #G +5#!."
 oe_tbd.5.t: "Mercenaries Make Trouble"
 oe_tbd.5.d_1337: "In 1304 the Catalan Company, around Cyzicus in Asia Minor, had spent two or three times its pay and was out plundering. On 30 April 1305 its leader Roger de Flor was murdered at Adrianople, and the company then ravaged Thrace for two years.\n\nNow the foreign mercenaries hired by [SCOPE.sCountry('oe_tbd_ev_theme').GetName] complain that their pay is too small and are seizing grain in the countryside."
 oe_tbd.5.d: "Foreign mercenary companies hired to hold a march can relieve a hard-pressed frontier, yet they answer first to coin; whenever pay falls short or lags behind, they are quick to requisition grain and trouble the countryside.\n\nNow the foreign mercenaries hired by [SCOPE.sCountry('oe_tbd_ev_theme').GetName] complain that their pay is too small and are seizing grain in the countryside."
 oe_tbd.5.a: "Raise their pay from the treasury"
 oe_tbd.5.a.tt: "The treasury pays #R 2#! months of tax income."
 oe_tbd.5.b: "Let [SCOPE.sCountry('oe_tbd_ev_theme').GetName] deal with it"
 oe_tbd.5.b.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName]: loyalty #R −5#!, counted in the loyalty target for #Y 5#! years."
 oe_tbd.5.c: "Dismiss them"
 oe_tbd.5.c.tt: "[SCOPE.sCountry('oe_tbd_ev_theme').GetName] loses Foreign Mercenaries: the border pressure cut of #Y 15#! ends."
 oe_tbd.9.t: "Border defence: carry out"
