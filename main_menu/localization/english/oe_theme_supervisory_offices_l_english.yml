l_english:
 oe_theme_ordinary_supervisory_office: "Military Theme Supervisory Office"
 oe_theme_ordinary_supervisory_office_desc: "The theme's office in Constantinople maintains contact with the imperial court, oversees military rolls and supervises army training. Each theme owns its own single-level office, employing 100 nobles and consuming paper. An office is automatically removed when its owner no longer has the matching subject type."
 oe_theme_naval_supervisory_office: "Naval Theme Supervisory Office"
 oe_theme_naval_supervisory_office_desc: "The naval theme's office in Constantinople coordinates fleet rolls and naval affairs with the imperial court. Each theme owns its own single-level office, employing 100 nobles and consuming paper. An office is automatically removed when its owner no longer has the matching subject type."
 oe_theme_frontier_supervisory_office: "Frontier Theme Supervisory Office"
 oe_theme_frontier_supervisory_office_desc: "The frontier theme's office in Constantinople coordinates frontier records and fortress maintenance. Each theme owns its own single-level office, employing 100 nobles and consuming paper. An office is automatically removed when its owner no longer has the matching subject type."
 oe_theme_administrative_supervisory_office: "Administrative Theme Supervisory Office"
 oe_theme_administrative_supervisory_office_desc: "The administrative theme's office in Constantinople coordinates correspondence, roads and administrative connections. Each theme owns its own single-level office, employing 100 nobles and consuming paper. An office is automatically removed when its owner no longer has the matching subject type."
 oe_pillars_settings.1.theme_supervisory_offices: "Add Theme Supervisory Offices in Constantinople"
 OE_SETTINGS_THEME_SUPERVISORY_OFFICES_TT: "Construct a matching #Y Supervisory Office#! in Constantinople for each military, naval, frontier or administrative theme subject of Byzantium that lacks one. Each theme owns one office, with a base construction time of 3 days. Existing offices and those under construction are skipped. Applied only on selection, at no additional cost."
