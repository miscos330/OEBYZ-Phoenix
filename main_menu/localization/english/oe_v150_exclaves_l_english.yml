 OPH: "Philadelphia"
 OPH_ADJ: "Philadelphian"
 OPH_LONG: "Free City of Philadelphia"
 oe_v150_exclave_charter_decision: "Charter of the Free City of Philadelphia"
 oe_v150_exclave_charter_decision.title: "Charter of the Free City of Philadelphia"
 oe_v150_exclave_charter_decision.desc: "Cut off deep inside Anatolian Turkish Beyliks, the steadfast Greek stronghold of Philadelphia (Alasehir) has governed itself under an imperial autonomous charter since 1337. Decide whether to ratify its status as a loyal Byzantine vassal or immediately restore direct imperial rule."
 oe_v150_exclave_charter_decision_desc: "Decide in 1337 whether to confirm Philadelphia (OPH) as an autonomous vassal or reclaim direct imperial control."
 oe_v150_exclave_charter_decision.a: "Review the Charter of Philadelphia"
 oe_v150_exclave.1.t: "The Charter of Philadelphia"
 oe_v150_exclave.1.desc: "Surrounded on every side by the emirates of Saruhan, Aydin, and Germiyan, the citizens and clergy of Philadelphia (Alasehir) have kept the Roman purple flying solely through local militia and self-rule. Their envoys have slipped through Turkish lines to Constantinople bearing the city's gilded keys: shall we confirm their autonomous municipal charter as a sworn vassal of the Empire, or revoke their local privileges and bring this Anatolian outpost back under direct palace administration?"
 oe_v150_exclave.1.a: "Confirm the Autonomous Charter — Let Philadelphia Stand Watch"
 oe_v150_exclave.1.a.tt: "Confirm #Y Philadelphia#! as an autonomous vassal of the Empire, gaining #G +5#! Imperial Pillars Authority, #G +10#! Prestige, and reducing Philadelphia's Liberty Desire by #G -15#!."
 oe_v150_exclave.1.b: "Revoke the Charter — Restore Direct Imperial Rule"
 oe_v150_exclave.1.b.tt: "Immediately return #Y Philadelphia (Alasehir)#! to direct Roman imperial administration."
