l_english:
 oe_byz_fate_Basileus: "Supremacy of the Basileus"
 oe_byz_fate_Basileus_desc: "With the empire's land policy settled, it is time to remind all our subjects of the supreme authority of the Basileus."
 oe_byz_fate_Basileus_tt: "This action reorganizes the imperial government, establishes #Y Rule of the Emperor#!, and disables #Y Cooperate with the Military Aristocracy#! and #Y Protect the Free Peasantry#!."
 oe_protect_peasants: "Protect the Free Peasantry"
 oe_protect_peasants_desc: "Free peasants are the foundation of our rule. The military aristocracy has plunged the empire into civil war and rebellion too many times for us to trust it."
 oe_protect_noble: "Cooperate with the Military Aristocracy"
 oe_protect_noble_desc: "The Basileus represents the interests of the empire's elites. Closer cooperation with the military aristocracy will help us build a stronger Rome."
 won_fate_of_the_phoenix_disaster_variable: "Has ended the #Y Fate of the Phoenix#! disaster"
