 oe_lat_bw_alexandria: "Sacked Alexandria"
 game_concept_oe_tu_west_will: "Western Will to Help"
 game_concept_oe_tu_west_will_desc: "#F In July 1366 Pope Urban V wrote that help for the Greeks must wait until they returned to the Catholic Church.#!\n\nThe Western Will to Help (#Y 0#! to #Y 100#!) measures how much the Latin world is ready to do for the empire right now. It is only a reading, never stored and never drifting from month to month; it is worked out from the present state of things each time:\n#bold Base#! #Y 20#!\n#bold The Papal States'#! opinion of the empire, #Y 1#! for every #Y 5#!, at most #Y 20#! either way; #bold Venice's#! opinion, #Y 1#! for every #Y 10#!, at most #Y 10#! either way\nHalf the Unionists' share among the church factions (#Y 5#! while the church framework does not run)\nA Catholic empire #G +15#!; union with Rome: talks #G +5#!, signed #G +15#! (with reservations, or only by Basel, #G +8#!), proclaimed #G +25#!, repudiated #R −10#!\n[ShowModifier('oe_br_western_aid')] #G +5#!; Barlaam's embassy to Avignon in 1339 #G +5#!; a member of the Holy League (for #Y 10#! years after joining) #G +10#!\nThe Western Schism #R −15#!; a crusade once called against the empire (the strong route) #R −20#!\nIt decides no battle; it shows the West's mood. The crusade bull before Varna tells the empire where it stands, and later appeals and the defenders of the City will read it too."
 oe_lat.1.t: "The Cross over the Harbour Castle"
 oe_lat.1.desc_k_env: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands. On 17 January 1345 Umur fell on the allies while they were at Mass; the Latin patriarch Henry of Asti, Martino Zaccaria and Pietro Zeno were killed. It is said that Kantakouzenos told the pope's envoy of a wish to restore the union of the churches and to fight the Turks on the papacy's side.#!\n\nNow the cross still flies over the harbour castle of Smyrna, and the pope's league has sent envoys asking the empire to join. Kantakouzenos and Umur have been friends for years, and during the civil war Umur's ships crossed the sea to help; many at court are uneasy at the thought of siding with that old friend's enemies."
 oe_lat.1.desc_k_late: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands. On 17 January 1345 Umur fell on the allies while they were at Mass; the Latin patriarch Henry of Asti, Martino Zaccaria and Pietro Zeno were killed.#!\n\nNow the cross still flies over the harbour castle of Smyrna, and the pope's league has sent envoys asking the empire to join. Kantakouzenos and Umur have been friends for years, and during the civil war Umur's ships crossed the sea to help; many at court are uneasy at the thought of siding with that old friend's enemies."
 oe_lat.1.desc_k_early: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands.#!\n\nNow the cross still flies over the harbour castle of Smyrna, and the pope's league has sent envoys asking the empire to join. Kantakouzenos and Umur have been friends for years, and during the civil war Umur's ships crossed the sea to help; many at court are uneasy at the thought of siding with that old friend's enemies."
 oe_lat.1.desc_p_late: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands. On 17 January 1345 Umur fell on the allies while they were at Mass; the Latin patriarch Henry of Asti, Martino Zaccaria and Pietro Zeno were killed.#!\n\nNow the cross still flies over the harbour castle of Smyrna. During the civil war the empress-regent sent envoys to Avignon to profess loyalty to the pope and beg for help; now the pope's league has sent envoys asking the empire to join, and the West is waiting to see whether the empire meant it."
 oe_lat.1.desc_p_early: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands.#!\n\nNow the cross still flies over the harbour castle of Smyrna. During the civil war the empress-regent sent envoys to Avignon to profess loyalty to the pope and beg for help; now the pope's league has sent envoys asking the empire to join, and the West is waiting to see whether the empire meant it."
 oe_lat.1.desc_n_late: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands. On 17 January 1345 Umur fell on the allies while they were at Mass; the Latin patriarch Henry of Asti, Martino Zaccaria and Pietro Zeno were killed.#!\n\nNow the cross still flies over the harbour castle of Smyrna, and the pope's league has sent envoys asking the empire to join: give ships and money and be counted a member of the league, or stay out and perhaps keep the peace with the Turks across the water."
 oe_lat.1.desc_n_early: "#F In 1332 the empire, Venice and the Knights Hospitaller formed a league and agreed to gather twenty galleys at Negroponte the next spring. In 1334 the league's fleet beat the ships of Karesi several times off Adramyttion; only the empire's ships never came. In 1343 the pope formed a new league, with ships from Cyprus, the Knights, Venice and the papacy. In May 1344 the allies won a sea battle off Pallene, and that autumn they took the harbour castle of Smyrna at the first assault, though the citadel stayed in Turkish hands.#!\n\nNow the cross still flies over the harbour castle of Smyrna, and the pope's league has sent envoys asking the empire to join: give ships and money and be counted a member of the league, or stay out and perhaps keep the peace with the Turks across the water."
 oe_lat.1.a: "Join the league with ships and money"
 oe_lat.1.a.tt: "Costs #R 2#! months of trade and tax income\nThe papacy, Venice, the Knights Hospitaller and Cyprus: opinion of the empire #G +20#! for #Y 10#! years\nAydin: opinion of the empire #R −20#! for #Y 10#! years\nThe empire gains [ShowModifier('oe_lat_league_member')] for #Y 10#! years\nShares of the church factions: Unionists #Y +3#!"
 oe_lat.1.b: "Keep faith with the Turks"
 oe_lat.1.b.tt: "Aydin and the Ottomans: opinion of the empire #G +15#! for #Y 10#! years\nThe papacy: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.1.c: "Offend no one, and trade"
 oe_lat.1.c.tt: "Gain #G 1#! month of trade and tax income"
 oe_lat.2.t: "Word of a Crusade"
 oe_lat.2.desc_war: "#F In 1095 Pope Urban II preached the crusade at Clermont, moved in part by Emperor Alexios I's appeal to the West for help. For two centuries after that the crusaders sometimes helped the empire win back lost land, and in 1204 they stormed Constantinople itself.#!\n\nNow a crusade called by the pope is aimed at [SCOPE.sCountry('oe_lat_ct').GetName], with [SCOPE.sCountry('oe_lat_cl').GetName] in command, and the empire is already at war with [SCOPE.sCountry('oe_lat_ct').GetName]. The envoys ask whether the empire will guide the crusaders."
 oe_lat.2.desc_subject: "#F In 1095 Pope Urban II preached the crusade at Clermont, moved in part by Emperor Alexios I's appeal to the West for help. For two centuries after that the crusaders sometimes helped the empire win back lost land, and in 1204 they stormed Constantinople itself.#!\n\nNow a crusade called by the pope is aimed at [SCOPE.sCountry('oe_lat_ct').GetName], with [SCOPE.sCountry('oe_lat_cl').GetName] in command. But the empire is a subject of [SCOPE.sCountry('oe_lat_ct').GetName], and helping either side will cost it."
 oe_lat.2.desc_p2: "#F In 1095 Pope Urban II preached the crusade at Clermont, moved in part by Emperor Alexios I's appeal to the West for help. For two centuries after that the crusaders sometimes helped the empire win back lost land, and in 1204 they stormed Constantinople itself.#!\n\nNow a crusade called by the pope is at war with [SCOPE.sCountry('oe_lat_ct').GetName], with [SCOPE.sCountry('oe_lat_cl').GetName] in command. The crusaders' ships must pass the empire's straits, and their envoys ask which side the empire is on."
 oe_lat.2.desc_p1: "#F In 1095 Pope Urban II preached the crusade at Clermont, moved in part by Emperor Alexios I's appeal to the West for help. For two centuries after that the crusaders sometimes helped the empire win back lost land, and in 1204 they stormed Constantinople itself.#!\n\nNow a crusade called by the pope is gathering against [SCOPE.sCountry('oe_lat_ct').GetName]; war should come in about three years, with [SCOPE.sCountry('oe_lat_cl').GetName] in command. The crusaders' ships must pass the empire's straits, and their envoys ask which side the empire is on."
 oe_lat.2.a: "Open the ports and guide the crusaders"
 oe_lat.2.a.tt: "Costs #R 1#! month of trade and tax income\nThe papacy and [SCOPE.sCountry('oe_lat_cl').GetName]: opinion of the empire #G +15#! for #Y 10#! years\n[SCOPE.sCountry('oe_lat_ct').GetName]: opinion of the empire #R −25#! for #Y 10#! years\nFormer Roman places that members of the crusade take from the infidel may be bought back once the crusade breaks up\nIf [SCOPE.sCountry('oe_lat_ct').GetName] is the Ottomans and the empire is the sultan's vassal: the sultan's patience #R −25#!"
 oe_lat.2.b: "Stay strictly neutral"
 oe_lat.2.b.tt: "Help neither the crusade nor its enemy"
 oe_lat.2.c: "Warn the other side in secret"
 oe_lat.2.c.tt: "[SCOPE.sCountry('oe_lat_ct').GetName]: opinion of the empire #G +20#! for #Y 10#! years\nThe papacy: opinion of the empire #R −20#! for #Y 10#! years\nShares of the church factions: Hesychasts #Y +2#!"
 oe_lat.2.d: "Join the crusade"
 oe_lat.2.d.tt: "The empire joins the crusade as a Catholic realm\nFormer Roman places that members of the crusade take from the infidel may be bought back once the crusade breaks up"
 oe_lat.3.t: "What the Crusaders Left Behind"
 oe_lat.3.desc_late: "#F In 1366 the crusade of Amadeus VI of Savoy took Gallipoli and handed it to the empire the next year; John V promised 15,000 florins and in the end paid about 10,000.#!\n\nNow the crusade has broken up. [SCOPE.sCountry('oe_lat_h').GetName] holds [SCOPE.sLocation('oe_lat_loc').GetName], once the empire's; in all #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_h_n').GetValue|0]#! former Roman places taken in the crusade are in the hands of [SCOPE.sCountry('oe_lat_h').GetName]. [SCOPE.sCountry('oe_lat_h').GetName] is not at war with the empire and may be willing to talk."
 oe_lat.3.desc_early: "#F After 1204 the crusaders set up principalities on the empire's old lands, and most of them never came back to the empire.#!\n\nNow the crusade has broken up. [SCOPE.sCountry('oe_lat_h').GetName] holds [SCOPE.sLocation('oe_lat_loc').GetName], once the empire's; in all #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_h_n').GetValue|0]#! former Roman places taken in the crusade are in the hands of [SCOPE.sCountry('oe_lat_h').GetName]. [SCOPE.sCountry('oe_lat_h').GetName] is not at war with the empire and may be willing to talk."
 oe_lat.3.a: "Buy them back town by town"
 oe_lat.3.a.tt: "Starting with the place nearest the capital, each costs #R 2#! months of trade and tax income, up to #Y 3#! places, stopping when the money runs out; the places bought come to the empire\n[SCOPE.sCountry('oe_lat_h').GetName]: opinion of the empire #G +10#! for #Y 5#! years\nThe other such places held by [SCOPE.sCountry('oe_lat_h').GetName] no longer count as left behind by the crusade"
 oe_lat.3.b: "Demand them in the empire's name"
 oe_lat.3.b.tt: "A casus belli against [SCOPE.sCountry('oe_lat_h').GetName] for #Y 10#! years\n[SCOPE.sCountry('oe_lat_h').GetName]: opinion of the empire #R −15#! for #Y 10#! years\nThe other such places held by [SCOPE.sCountry('oe_lat_h').GetName] no longer count as left behind by the crusade"
 oe_lat.3.c: "Let the Latins hold them for the empire"
 oe_lat.3.c.tt: "[SCOPE.sCountry('oe_lat_h').GetName]: opinion of the empire #G +10#! for #Y 10#! years\nThe other such places held by [SCOPE.sCountry('oe_lat_h').GetName] no longer count as left behind by the crusade"
 oe_lat.5.t: "The Knights' Offer"
 oe_lat.5.desc_west: "#F Between 1395 and 1396 the despot Theodore I bought Corinth, and in 1397, unable to pay for its walls, sold it to the Knights Hospitaller; that June the Ottomans stormed Argos and carried off at least 14,000 people. In 1399 or 1400 Theodore sold the whole Despotate of the Morea to the Knights.#!\n\nNow the emperor is far away in the West seeking help, and the horsemen of [SCOPE.sCountry('oe_lat_foe').GetName] are just beyond the Isthmus. The Knights Hospitaller of Rhodes have sent word: entrust the Morea to them, and they will pay for the right to hold it and put knights in Mistra and the castles; when the danger has passed, the empire may redeem it as agreed."
 oe_lat.5.desc_plain: "#F Between 1395 and 1396 the despot Theodore I bought Corinth, and in 1397, unable to pay for its walls, sold it to the Knights Hospitaller; that June the Ottomans stormed Argos and carried off at least 14,000 people. In 1399 or 1400 Theodore sold the whole Despotate of the Morea to the Knights.#!\n\nNow the horsemen of [SCOPE.sCountry('oe_lat_foe').GetName] are just beyond the Isthmus. The Knights Hospitaller of Rhodes have sent word: entrust the Morea to them, and they will pay for the right to hold it and put knights in Mistra and the castles; when the danger has passed, the empire may redeem it as agreed."
 oe_lat.5.a: "Entrust the Morea to the Knights"
 oe_lat.5.a.tt: "Gain #G 4#! months of trade and tax income (if the Knights cannot pay that much, only what they have)\nEvery place of ours and of our subjects in the Peloponnese gains [ShowModifier('oe_lat_knights_morea')] for #Y 5#! years\nThe theme of the Peloponnese, if any: loyalty #R −10#!\nThe Knights Hospitaller: opinion of the empire #G +20#! for #Y 10#! years\nIn about #Y 4#! to #Y 12#! months the people of Mistra will have their say"
 oe_lat.5.b: "Renew only the Knights' garrison at Corinth"
 oe_lat.5.b.tt: "Gain #G 1#! month of trade and tax income\nCorinth gains [ShowModifier('oe_mo_knights_garrison')] for #Y 5#! years\nThe Knights Hospitaller: opinion of the empire #G +10#! for #Y 5#! years"
 oe_lat.5.c: "The Morea will defend itself"
 oe_lat.5.c.tt: "The Knights Hospitaller: opinion of the empire #R −10#! for #Y 5#! years\nThe theme of the Peloponnese, if any: loyalty #G +5#!"
 oe_lat.6.t: "The People of Mistra"
 oe_lat.6.desc: "#F It is said that the people and clergy of Mistra refused to be ruled by the Latins, and Theodore I had to come and calm them in person.#!\n\nNow the Knights' men are lodged in the castle of Mistra, and the townsfolk have shut their doors. The clergy say that handing the town to Latin monks means handing over the faith as well; the citizens gather in the square and demand that the order be revoked."
 oe_lat.6.a: "Heed the people and buy it back now"
 oe_lat.6.a.tt: "Costs #R 4#! months of trade and tax income\nEvery [ShowModifier('oe_lat_knights_morea')] is removed\nThe theme of the Peloponnese, if any: loyalty #G +15#!\nThe Knights Hospitaller: opinion of the empire #R −15#! for #Y 5#! years\nShares of the church factions: Hesychasts #Y +2#!"
 oe_lat.6.b: "Wait until the Turks are gone"
 oe_lat.6.b.tt: "The theme of the Peloponnese, if any: loyalty #R −5#!\nMistra gains [ShowModifier('oe_lat_mistra_unrest')] for #Y 3#! years"
 oe_lat.6.c: "Order them to receive the Knights"
 oe_lat.6.c.tt: "The theme of the Peloponnese, if any: loyalty #R −15#!\nThe Knights Hospitaller: opinion of the empire #G +10#! for #Y 5#! years"
 oe_lat.7.t: "Buying Back the Morea"
 oe_lat.7.desc_ivr: "#F After the battle of Ankara in 1402 the Ottomans fell into civil war, and around 1404 Theodore I took the despotate back from the Knights.#!\n\nNow the sultan has been crushed in the east, and the Ottoman princes are fighting over the throne. The Knights' men need no longer stay in the Morea, and by the agreement the empire may redeem it."
 oe_lat.7.desc_byd: "#F After the battle of Ankara in 1402 the Ottomans fell into civil war, and around 1404 Theodore I took the despotate back from the Knights.#!\n\nNow the blockade of the capital is over. The Knights' men need no longer stay in the Morea, and by the agreement the empire may redeem it."
 oe_lat.7.desc_plain: "#F After the battle of Ankara in 1402 the Ottomans fell into civil war, and around 1404 Theodore I took the despotate back from the Knights.#!\n\nNow the Knights have held the Morea for some years. The Knights' men need no longer stay in the Morea, and by the agreement the empire may redeem it."
 oe_lat.7.a: "Redeem it as agreed"
 oe_lat.7.a.tt: "Costs #R 3#! months of trade and tax income\nEvery [ShowModifier('oe_lat_knights_morea')] and [ShowModifier('oe_lat_mistra_unrest')] is removed\nThe Knights Hospitaller: opinion of the empire #G +10#! for #Y 10#! years"
 oe_lat.7.b: "Pay in ships and pardons"
 oe_lat.7.b.tt: "Costs #R 1#! month of trade and tax income\nEvery [ShowModifier('oe_lat_knights_morea')] and [ShowModifier('oe_lat_mistra_unrest')] is removed\nThe Knights Hospitaller: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.7.c: "Ask the Knights to stay five more years"
 oe_lat.7.c.tt: "[ShowModifier('oe_lat_knights_morea')] starts again for #Y 5#! years in every place of ours and of our subjects in the Peloponnese\nThe theme of the Peloponnese, if any: loyalty #R −10#!\nAfter five years the Knights leave of their own accord"
 oe_lat.13.t: "Rhodes Besieged"
 oe_lat.13.desc_mam: "#F In August 1444 a Mamluk fleet of 85 ships besieged Rhodes for about forty days; Grand Master Jean de Lastic held the city, with ships and supplies sent beforehand by Burgundy and the pope.#!\n\nNow the forces of [SCOPE.sCountry('oe_lat_besieger').GetName] have closed around the castle of Rhodes. The Knights have sent a fast ship to the capital asking for grain and men."
 oe_lat.13.desc_tur: "#F From May to August 1480 an Ottoman fleet of 160 ships under Mesih Pasha besieged Rhodes and could not take it; Grand Master Pierre d'Aubusson held the city.#!\n\nNow the forces of [SCOPE.sCountry('oe_lat_besieger').GetName] have closed around the castle of Rhodes. The Knights have sent a fast ship to the capital asking for grain and men."
 oe_lat.13.desc_plain: "#F Between 1306 and 1310 the Knights Hospitaller took Rhodes from the empire, and from then on fought the Turks at sea from the island.#!\n\nNow the forces of [SCOPE.sCountry('oe_lat_besieger').GetName] have closed around the castle of Rhodes. The Knights have sent a fast ship to the capital asking for grain and men."
 oe_lat.13.a: "Send grain and men to Rhodes"
 oe_lat.13.a.tt: "Costs #R 2#! months of trade and tax income; the Knights Hospitaller receive as much gold\nThe Knights Hospitaller: opinion of the empire #G +25#! for #Y 20#! years\n[SCOPE.sCountry('oe_lat_besieger').GetName]: opinion of the empire #R −20#! for #Y 10#! years\nIf [SCOPE.sCountry('oe_lat_besieger').GetName] is the Ottomans and the empire is the sultan's vassal: the sultan's patience #R −20#!"
 oe_lat.13.b: "Send one shipload of grain"
 oe_lat.13.b.tt: "Costs #R 1#! month of trade and tax income; the Knights Hospitaller receive as much gold\nThe Knights Hospitaller: opinion of the empire #G +10#! for #Y 10#! years"
 oe_lat.13.c: "Stand aside"
 oe_lat.13.c.tt: "If [SCOPE.sCountry('oe_lat_besieger').GetName] is the Ottomans and the empire is the sultan's vassal: the sultan's patience #G +5#!"
 oe_lat.4.t: "News from Alexandria"
 oe_lat.4.desc: "#F In March 1363 King Peter I of Cyprus and King John II of France vowed before the pope at Avignon to go on crusade; in 1365 Pope Urban V issued a bull approving Peter I's expedition.#!\n\nNow the Cypriots, with Venetian ships and knights from Rhodes, have sacked Alexandria and sailed off three days later laden with spoil and some five thousand captives. It is said that the Mamluk sultan means to take revenge on the Christians under Mamluk rule. The three eastern patriarchs, of Alexandria, Antioch and Jerusalem, all live under the sultan; and the trade of Alexandria has stopped."
 oe_lat.4.a: "Send envoys to Cairo to plead for the eastern Christians"
 oe_lat.4.a.tt: "Costs #R 1#! month of trade and tax income\nThe Mamluks: opinion of the empire #G +15#! for #Y 10#! years\nCyprus: opinion of the empire #R −10#! for #Y 5#! years\n[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!"
 oe_lat.4.b: "Congratulate the King of Cyprus"
 oe_lat.4.b.tt: "Cyprus: opinion of the empire #G +15#! for #Y 10#! years\nThe Mamluks: opinion of the empire #R −15#! for #Y 10#! years\nThe papacy: opinion of the empire #G +5#! for #Y 5#! years"
 oe_lat.4.c: "Let the empire's merchants fill the gap"
 oe_lat.4.c.tt: "The empire gains [ShowModifier('oe_lat_alex_trade')] for #Y 5#! years\nVenice and Genoa: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.8.t: "Smyrna Has Fallen"
 oe_lat.8.desc_t_lost: "#F In the autumn of 1344 the pope's league took the harbour castle of Smyrna at the first assault; from 1374 the Knights Hospitaller of Rhodes took over its defence.#!\n\nNow Timur's army has come before Smyrna and taken it in less than half a month. The knights escaped by ship, the Christians in the city were massacred, and Smyrna has gone to [SCOPE.sCountry('oe_lat_smy').GetName]. The Knights speak of building a new castle across the water at Halicarnassus; and the kings of the West will hear of Smyrna's fall from the empire's envoys."
 oe_lat.8.desc_t_sack: "#F In the autumn of 1344 the pope's league took the harbour castle of Smyrna at the first assault; from 1374 the Knights Hospitaller of Rhodes took over its defence.#!\n\nNow Timur's army has come before Smyrna, taken it in less than half a month and left only when nothing was left to take. The knights escaped by ship, and the Christians in the city were massacred. The Knights speak of building a new castle across the water at Halicarnassus; and the kings of the West will hear of Smyrna's fall from the empire's envoys."
 oe_lat.8.desc_t_port: "#F In the autumn of 1344 the pope's league took the harbour castle of Smyrna at the first assault; from 1374 the Knights Hospitaller of Rhodes took over its defence.#!\n\nNow Timur's army has stormed the harbour castle of Smyrna. The knights escaped by ship and the Christians left in the castle were massacred; the Latins' foothold at Smyrna, held for more than half a century, is gone. The Knights speak of building a new castle across the water at Halicarnassus; and the kings of the West will hear of Smyrna's fall from the empire's envoys."
 oe_lat.8.desc_late: "#F In the autumn of 1344 the pope's league took the harbour castle of Smyrna at the first assault; from 1374 the Knights Hospitaller of Rhodes took over its defence.#!\n\nNow the forces of [SCOPE.sCountry('oe_lat_smy').GetName] have taken Smyrna, and the Latins' foothold there is lost. Those who got out crowd the harbour, waiting for a ship to take them off."
 oe_lat.8.desc_early: "#F In the autumn of 1344 the pope's league took the harbour castle of Smyrna at the first assault, and for years after that the Latins held the port.#!\n\nNow the forces of [SCOPE.sCountry('oe_lat_smy').GetName] have taken Smyrna, and the Latins' foothold there is lost. Those who got out crowd the harbour, waiting for a ship to take them off."
 oe_lat.8.a: "Send ships for the survivors"
 oe_lat.8.a.tt: "Costs #R 1#! month of trade and tax income\nThe Knights Hospitaller: opinion of the empire #G +25#! for #Y 20#! years"
 oe_lat.8.b: "Send envoys to Timur"
 oe_lat.8.b.tt: "[GetCountry('TIM').GetName]: opinion of the empire #G +15#! for #Y 10#! years\nThe Knights Hospitaller: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.8.c: "Keep the gates shut"
 oe_lat.8.c.tt: "No ships and no envoys"
 oe_lat.9.t: "The Pope's Crusade Bull"
 oe_lat.9.desc_u_2: "#F On New Year's Day 1443 Pope Eugene IV issued a crusade bull. That autumn Wladyslaw, king of Hungary and Poland, John Hunyadi and George Brankovic of Serbia marched into the Balkans and reached the mountain passes in winter; on 12 December they were checked at Zlatitsa and fell back.#!\n\nNow the crusade the pope has called is gathering, and the armies of Hungary and Poland will move down the Danube. After the union, the West is paying its due at last. The crusaders ask the empire for ships to hold the Straits and keep the sultan's troops in Asia, and for the despots of the Morea to push north and draw the Turks away.\nThe [oe_tu_west_will|e] stands at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#! (from #Y 0#! to #Y 100#!)."
 oe_lat.9.desc_u_1: "#F On New Year's Day 1443 Pope Eugene IV issued a crusade bull.#!\n\nNow the crusade the pope has called is gathering, and the armies of Hungary and Poland will move down the Danube. After the union, the West is paying its due at last. The crusaders ask the empire for ships to hold the Straits and keep the sultan's troops in Asia, and for the despots of the Morea to push north and draw the Turks away.\nThe [oe_tu_west_will|e] stands at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#! (from #Y 0#! to #Y 100#!)."
 oe_lat.9.desc_u_0: "#F In July 1439 the Council of Florence proclaimed the union of the Eastern and Western churches; Mark of Ephesus refused to sign.#!\n\nNow the crusade the pope has called is gathering, and the armies of Hungary and Poland will move down the Danube. After the union, the West is paying its due at last. The crusaders ask the empire for ships to hold the Straits and keep the sultan's troops in Asia, and for the despots of the Morea to push north and draw the Turks away.\nThe [oe_tu_west_will|e] stands at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#! (from #Y 0#! to #Y 100#!)."
 oe_lat.9.desc_n_2: "#F On New Year's Day 1443 Pope Eugene IV issued a crusade bull. That autumn Wladyslaw, king of Hungary and Poland, John Hunyadi and George Brankovic of Serbia marched into the Balkans and reached the mountain passes in winter; on 12 December they were checked at Zlatitsa and fell back.#!\n\nNow the crusade the pope has called is gathering, and the armies of Hungary and Poland will move down the Danube. The pope's envoy says it plainly: for the West to help in earnest, union must come first. The crusaders ask the empire for ships to hold the Straits and keep the sultan's troops in Asia, and for the despots of the Morea to push north and draw the Turks away.\nThe [oe_tu_west_will|e] stands at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#! (from #Y 0#! to #Y 100#!)."
 oe_lat.9.desc_n_1: "#F On New Year's Day 1443 Pope Eugene IV issued a crusade bull.#!\n\nNow the crusade the pope has called is gathering, and the armies of Hungary and Poland will move down the Danube. The pope's envoy says it plainly: for the West to help in earnest, union must come first. The crusaders ask the empire for ships to hold the Straits and keep the sultan's troops in Asia, and for the despots of the Morea to push north and draw the Turks away.\nThe [oe_tu_west_will|e] stands at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#! (from #Y 0#! to #Y 100#!)."
 oe_lat.9.desc_n_0: "#F In July 1439 the Council of Florence proclaimed the union of the Eastern and Western churches; Mark of Ephesus refused to sign.#!\n\nNow the crusade the pope has called is gathering, and the armies of Hungary and Poland will move down the Danube. The pope's envoy says it plainly: for the West to help in earnest, union must come first. The crusaders ask the empire for ships to hold the Straits and keep the sultan's troops in Asia, and for the despots of the Morea to push north and draw the Turks away.\nThe [oe_tu_west_will|e] stands at #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#! (from #Y 0#! to #Y 100#!)."
 oe_lat.9.a: "Ships to hold the Straits, the Morea to push north"
 oe_lat.9.a.tt: "Costs #R 3#! months of trade and tax income\nHungary, the papacy and Poland: opinion of the empire #G +20#! for #Y 10#! years\nIf Athens is held by neither the empire's side nor the Ottomans: a casus belli against its holder for #Y 10#! years\nThe theme of the Peloponnese, if any: loyalty #G +5#!\nChance of stopping the sultan at the Straits #G +20%#!, the crusade's chance at the coming battle #G +10%#!\nIf the empire is the sultan's vassal: the sultan's patience #R −30#!"
 oe_lat.9.b: "Send only a few ships"
 oe_lat.9.b.tt: "Costs #R 1#! month of trade and tax income\nHungary and the papacy: opinion of the empire #G +10#! for #Y 5#! years\nChance of stopping the sultan at the Straits #G +10%#!, the crusade's chance at the coming battle #G +5%#!\nIf the empire is the sultan's vassal: the sultan's patience #R −15#!"
 oe_lat.9.c: "Keep the peace with the sultan"
 oe_lat.9.c.tt: "The Ottomans: opinion of the empire #G +15#! for #Y 5#! years\nHungary and the papacy: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.10.t: "Galleys in the Straits"
 oe_lat.10.desc_2c: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back. In August 1444 Sultan Murad II made peace with Karaman, and the Peace of Szeged with Hungary came into force; then the sultan stepped down in favour of a young son, Mehmed. It is recorded that in the autumn of that year ships of the West and of the empire tried to close the Straits.#!\n\nNow the crusaders have set out again. Ships of the papacy, Venice and Burgundy have sailed into the Dardanelles and the empire's ships watch the Bosporus. The fleets have held the Straits, and the sultan's army is stuck on the Asian side."
 oe_lat.10.desc_2b: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back. In August 1444 Sultan Murad II made peace with Karaman, and the Peace of Szeged with Hungary came into force; then the sultan stepped down in favour of a young son, Mehmed.#!\n\nNow the crusaders have set out again. Ships of the papacy, Venice and Burgundy have sailed into the Dardanelles and the empire's ships watch the Bosporus. The fleets have held the Straits, and the sultan's army is stuck on the Asian side."
 oe_lat.10.desc_2a: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back.#!\n\nNow the crusaders have set out again. Ships of the papacy, Venice and Burgundy have sailed into the Dardanelles and the empire's ships watch the Bosporus. The fleets have held the Straits, and the sultan's army is stuck on the Asian side."
 oe_lat.10.desc_1c: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back. In August 1444 Sultan Murad II made peace with Karaman, and the Peace of Szeged with Hungary came into force; then the sultan stepped down in favour of a young son, Mehmed. It is recorded that in the autumn of that year ships of the West and of the empire tried to close the Straits.#!\n\nNow the crusaders have set out again. Ships of the papacy, Venice and Burgundy have sailed into the Dardanelles and the empire's ships watch the Bosporus, to keep the sultan's army in Asia. But the sultan has crossed with the army all the same, and the crusaders do not know it."
 oe_lat.10.desc_1b: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back. In August 1444 Sultan Murad II made peace with Karaman, and the Peace of Szeged with Hungary came into force; then the sultan stepped down in favour of a young son, Mehmed.#!\n\nNow the crusaders have set out again. Ships of the papacy, Venice and Burgundy have sailed into the Dardanelles and the empire's ships watch the Bosporus, to keep the sultan's army in Asia. But the sultan has crossed with the army all the same, and the crusaders do not know it."
 oe_lat.10.desc_1a: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back.#!\n\nNow the crusaders have set out again. Ships of the papacy, Venice and Burgundy have sailed into the Dardanelles and the empire's ships watch the Bosporus, to keep the sultan's army in Asia. But the sultan has crossed with the army all the same, and the crusaders do not know it."
 oe_lat.10.a: "Prepare as usual"
 oe_lat.10.a.tt: "The crusaders fight as they are\nNews of the battle comes in about #Y 1#! month"
 oe_lat.10.b: "Send a fast ship to warn the crusaders"
 oe_lat.10.b.tt: "Costs #R 1#! month of trade and tax income\nThe crusade's chance in the battle #G +5%#!\nNews of the battle comes in about #Y 1#! month"
 oe_lat.10.c: "Ring the bells"
 oe_lat.10.c.tt: "The crusade's chance in the battle #G +20%#!\nNews of the battle comes in about #Y 1#! month"
 oe_lat.11.t: "Varna"
 oe_lat.11.desc_w_b: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back. In August 1444 Sultan Murad II made peace with Karaman, and the Peace of Szeged with Hungary came into force; then the sultan stepped down in favour of a young son, Mehmed.#!\n\nNow the crusaders have met the sultan's army at Varna by the Black Sea, and against all expectation they have won. The Ottomans have lost their nerve, and the Christians of the Balkans pass the news from town to town."
 oe_lat.11.desc_w_a: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back.#!\n\nNow the crusaders have met the sultan's army at Varna by the Black Sea, and against all expectation they have won. The Ottomans have lost their nerve, and the Christians of the Balkans pass the news from town to town."
 oe_lat.11.desc_l2_b: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back. In August 1444 Sultan Murad II made peace with Karaman, and the Peace of Szeged with Hungary came into force; then the sultan stepped down in favour of a young son, Mehmed.#!\n\nNow the crusaders have met the sultan's army at Varna by the Black Sea and have been routed. The pope's legate died in the rout, and the survivors are scattering back to the Danube. The sultan knows the empire helped the crusade and will remember it (the Ottomans' opinion of the empire #R −30#! for #Y 10#! years). The Morea's troops that marched north have had to fall back behind the Hexamilion."
 oe_lat.11.desc_l2_a: "#F In the winter of 1443 the crusaders reached the Balkan passes, were checked at Zlatitsa and fell back.#!\n\nNow the crusaders have met the sultan's army at Varna by the Black Sea and have been routed. The pope's legate died in the rout, and the survivors are scattering back to the Danube. The sultan knows the empire helped the crusade and will remember it (the Ottomans' opinion of the empire #R −30#! for #Y 10#! years). The Morea's troops that marched north have had to fall back behind the Hexamilion."
