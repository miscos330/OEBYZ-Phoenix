 OE_LAT_VA_P: "Varna: the pope never asked the empire for help."
 OE_LAT_VA_W: "Varna: not yet (from 1442)."
 OE_LAT_SW_2A: "The schism has ended with the victory of the pope raised by [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_schism_anti').GetCountry.GetName], and [GetCountry('PAP').GetName] now upholds that line."
 OE_LAT_SW_2: "The schism has ended with the victory of the other pope's side, and [GetCountry('PAP').GetName] now upholds that line."
 OE_LAT_SW_1: "The schism has ended with the line [GetCountry('PAP').GetName] upheld from the first."
 OE_LAT_SB_1: "The empire backed the right pope, and the new pope remembers that it was among the first to recognise the line."
 OE_LAT_SB_2: "The empire backed the losing pope; mending that will take rich gifts."
 OE_LAT_SB_3: "The empire backed neither pope, and now it is time to say something."
 OE_LAT_SC_R1: "Two popes: the empire backed the right one and greeted the new pope early."
 OE_LAT_SC_R2: "Two popes: the empire backed the wrong one and had to make amends."
 OE_LAT_SC_R3: "Two popes: the empire backed neither and greeted the new pope afterwards."
 OE_LAT_SC_B1: "Two popes: the empire recognised the pope of [GetCountry('PAP').GetName]."
 OE_LAT_SC_B2: "Two popes: the empire recognised the other pope."
 OE_LAT_SC_B0: "Two popes: the empire took no side."
 OE_LAT_SC_X: "Two popes: when the schism ended, the papacy was gone."
 OE_LAT_SC_S: "Two popes: the Church of the West is split, and the empire has not taken a side."
 OE_LAT_SC_W: "Two popes: the West still has one pope (after 1360 a papal election may split it)."
 OE_LAT_CN_T: "The Ottomans are no more."
 OE_LAT_CN_C: "There is a crusade under way already."
 OE_LAT_CN_R: "The Ottomans are not yet a fit target for a crusade (it must be a kingdom or an empire)."
 OE_LAT_CN_A: "The pope's authority is below 50, too low to call a crusade."
 OE_LAT_CN_Y: "The pope could call a crusade now."
 OE_LAT_CN_N: "The pope cannot call a crusade now (the age has passed, the papacy is not free, or the Papal States are at war or at truce with the Ottomans)."
 OE_LAT_WN_F: "It is said that the pope did issue a bull, but no crusade ever gathered."
 OE_LAT_WN_T: "The Ottomans are no more."
 OE_LAT_WN_R: "The Curia says the Ottomans are not yet a fit target for a crusade (it must be a kingdom or an empire)."
 OE_LAT_WN_A: "The pope's authority is below 50, too low to call a crusade."
 OE_LAT_WN_N: "The Curia says the time is not right."
 OE_LAT_AP_W: "The envoys are on their way, waiting for the pope's answer."
 OE_LAT_AP_R: "The pope's answer is on its way back."
 OE_LAT_AP_1: "Last time, the pope called a crusade."
 OE_LAT_AP_2: "Last time, the pope granted indulgences."
 OE_LAT_AP_3: "Last time, the pope asked for union first."
 OE_LAT_AP_4: "Last time, the envoys came back empty-handed."
 OE_LAT_AP_N: "The empire has not yet sent to Rome for a crusade."
