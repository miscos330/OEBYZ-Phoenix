 oe_lat.11.a: "Ring the bells in thanksgiving"
 oe_lat.11.a.tt: "[oe_tu_authority|e] #G +3#!\nThe empire gains [ShowModifier('oe_lat_varna_glory')] for #Y 10#! years"
 oe_lat.11.b: "Congratulate the sultan"
 oe_lat.11.b.tt: "The Ottomans no longer hold Varna against the empire\nThe Ottomans: opinion of the empire #G +15#! for #Y 5#! years"
 oe_lat.11.c: "Shelter the crusaders who escape"
 oe_lat.11.c.tt: "Costs #R 1#! month of trade and tax income\nHungary and Poland: opinion of the empire #G +20#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.11.d: "Stay behind the walls"
 oe_lat.11.d.tt: "Do nothing"
 oe_lat.12.t: "Before the Hexamilion"
 oe_lat.12.desc_b: "#F From 1444 the despot Constantine, with the Ottomans busy in the north, advanced into central Greece, and Duke Nerio II of Athens acknowledged the empire's overlordship. By the end of 1445 the Morea's troops had pushed on into southern Thessaly.#!\n\nNow, after Varna, the sultan's hands are free, and the army has come south with its guns to the Hexamilion. The despots behind the wall must decide: withdraw and pay, hold the wall, or submit and pay tribute."
 oe_lat.12.desc_a: "#F From 1444 the despot Constantine, with the Ottomans busy in the north, advanced into central Greece, and Duke Nerio II of Athens acknowledged the empire's overlordship.#!\n\nNow, after Varna, the sultan's hands are free, and the army has come south with its guns to the Hexamilion. The despots behind the wall must decide: withdraw and pay, hold the wall, or submit and pay tribute."
 oe_lat.12.a: "Withdraw and pay"
 oe_lat.12.a.tt: "Costs #R 3#! months of trade and tax income\nThe Ottomans no longer hold Varna against the empire\nThe Ottomans: opinion of the empire #G +10#! for #Y 5#! years\nThe casus belli on Athens from the year of the bull, if any, is given up"
 oe_lat.12.b: "Hold the wall"
 oe_lat.12.b.tt: "#G 30%#! chance the wall holds: prestige #G +10#!, [oe_tu_authority|e] #G +3#!\n#R 70%#! chance the wall falls: prestige #R −10#!, the Hexamilion torn down, the Peloponnese ravaged for #Y 5#! years, theme loyalty #R −10#!"
 oe_lat.12.c: "Submit and pay tribute"
 oe_lat.12.c.tt: "Sign a #Y 5#!-year buying-peace agreement with the Ottomans: the first year is paid now (#Y 3#! months of total income), prestige #R −15#!, [oe_tu_authority|e] #R −5#!, a truce with the Ottomans for #Y 5#! years"
 oe_lat.14.t: "The Battle at the Wall"
 oe_lat.14.desc_held: "For half a month the sultan's guns pounded the wall, and still it stood. The Ottomans have gone back with the cattle they took, and the bells of the Morea rang all night."
 oe_lat.14.desc_fell: "After two weeks the Ottoman guns broke the wall. The army poured into the Morea, and it is said that sixty thousand people were carried off."
 oe_lat.14.a: "Ring the bells in thanksgiving"
 oe_lat.14.a.tt: "[oe_tu_authority|e] #G +3#!"
 oe_lat.14.b: "Pick up the pieces"
 oe_lat.14.b.tt: "The Hexamilion is torn down\nEvery place of ours and of our subjects in the Peloponnese gains [ShowModifier('oe_mo_ravaged')] for #Y 5#! years\nThe theme of the Peloponnese, if any: loyalty #R −10#!"
 oe_lat.90.t: "The Latin World: worker"
