 oe_lat.11.a: "Ring the bells in thanksgiving"
 oe_lat.11.a.tt: "[oe_tu_authority|e] #G +3#!\nThe empire gains [ShowModifier('oe_lat_varna_glory')] for #Y 10#! years"
 oe_lat.11.b: "Congratulate the sultan"
 oe_lat.11.b.tt: "The Ottomans no longer hold Varna against the empire\nThe Ottomans: opinion of the empire #G +15#! for #Y 5#! years"
 oe_lat.11.c: "Shelter the crusaders who escape"
 oe_lat.11.c.tt: "Costs #R 1#! month of trade and tax income\nHungary and Poland: opinion of the empire #G +20#! for #Y 10#! years\nThe Ottomans: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.11.d: "Stay behind the walls"
 oe_lat.11.d.tt: "Do nothing"
 oe_lat.12.t: "Before the Hexamilion"
 oe_lat.12.desc_b: "#F From 1444 the despot Constantine, with the Ottomans busy in the north, advanced into central Greece, and Duke Nerio II of Athens acknowledged the empire's overlordship. By the end of 1445 the Morea's troops had pushed on into southern Thessaly.#!\n\nNow, after Varna, the sultan's hands are free, and the army has come south with its guns to the Hexamilion. The despots behind the wall must decide: withdraw and pay, hold the wall, or submit and pay tribute."
 oe_lat.12.desc_a: "#F From 1444 the despot Constantine, with the Ottomans busy in the north, advanced into central Greece, and Duke Nerio II of Athens acknowledged the empire's overlordship.#!\n\nNow, after Varna, the sultan's hands are free, and the army has come south with its guns to the Hexamilion. The despots behind the wall must decide: withdraw and pay, hold the wall, or submit and pay tribute."
 oe_lat.12.a: "Withdraw and pay"
 oe_lat.12.a.tt: "Costs #R 3#! months of trade and tax income\nThe Ottomans no longer hold Varna against the empire\nThe Ottomans: opinion of the empire #G +10#! for #Y 5#! years\nThe casus belli on Athens from the year of the bull, if any, is given up"
 oe_lat.12.b: "Hold the wall"
 oe_lat.12.b.tt: "#G 30%#! chance the wall holds: prestige #G +10#!, [oe_tu_authority|e] #G +3#!\n#R 70%#! chance the wall falls: prestige #R −10#!, the Hexamilion torn down, the Peloponnese ravaged for #Y 5#! years, theme loyalty #R −10#!"
 oe_lat.12.c: "Submit and pay tribute"
 oe_lat.12.c.tt: "Sign a #Y 5#!-year buying-peace agreement with the Ottomans: the first year is paid now (#Y 3#! months of total income), prestige #R −15#!, [oe_tu_authority|e] #R −5#!, a truce with the Ottomans for #Y 5#! years"
 oe_lat.14.t: "The Battle at the Wall"
 oe_lat.14.desc_held: "For half a month the sultan's guns pounded the wall, and still it stood. The Ottomans have gone back with the cattle they took, and the bells of the Morea rang all night."
 oe_lat.14.desc_fell: "After two weeks the Ottoman guns broke the wall. The army poured into the Morea, and it is said that sixty thousand people were carried off."
 oe_lat.14.a: "Ring the bells in thanksgiving"
 oe_lat.14.a.tt: "[oe_tu_authority|e] #G +3#!"
 oe_lat.14.b: "Pick up the pieces"
 oe_lat.14.b.tt: "The Hexamilion is torn down\nEvery place of ours and of our subjects in the Peloponnese gains [ShowModifier('oe_mo_ravaged')] for #Y 5#! years\nThe theme of the Peloponnese, if any: loyalty #R −10#!"
 oe_lat.90.t: "The Latin World: worker"
 oe_lat.20.t: "Two Popes"
 oe_lat.20.desc_a2: "#F In January 1377 Pope Gregory XI left Avignon and came back to Rome. In April 1378 Urban VI was elected pope in Rome; that September thirteen cardinals met at Fondi and chose Clement VII instead. From then on the West had two popes: Venice, Genoa, Florence, Hungary and England held with Rome, and France, Castile, Aragon, Scotland and Savoy with Avignon.#!\n\nNow the West has two popes again: one at [SCOPE.sLocation('oe_lat_pcap').GetName], upheld by [GetCountry('PAP').GetName], the other raised by the cardinals of [SCOPE.sCountry('oe_lat_anti').GetName]. Envoys from both have come to the capital, each asking the empire to recognise their pope. The West is busy with its own quarrel and has little thought for the East ([oe_tu_west_will|e] #R −15#! until the schism is over)."
 oe_lat.20.desc_a1: "#F In January 1377 Pope Gregory XI left Avignon and came back to Rome.#!\n\nNow the West has two popes again: one at [SCOPE.sLocation('oe_lat_pcap').GetName], upheld by [GetCountry('PAP').GetName], the other raised by the cardinals of [SCOPE.sCountry('oe_lat_anti').GetName]. Envoys from both have come to the capital, each asking the empire to recognise their pope. The West is busy with its own quarrel and has little thought for the East ([oe_tu_west_will|e] #R −15#! until the schism is over)."
 oe_lat.20.desc_a0: "#F The papacy has been at Avignon for decades, and the Romans have long waited for the pope to come back.#!\n\nNow the West has two popes again: one at [SCOPE.sLocation('oe_lat_pcap').GetName], upheld by [GetCountry('PAP').GetName], the other raised by the cardinals of [SCOPE.sCountry('oe_lat_anti').GetName]. Envoys from both have come to the capital, each asking the empire to recognise their pope. The West is busy with its own quarrel and has little thought for the East ([oe_tu_west_will|e] #R −15#! until the schism is over)."
 oe_lat.20.desc_n2: "#F In January 1377 Pope Gregory XI left Avignon and came back to Rome. In April 1378 Urban VI was elected pope in Rome; that September thirteen cardinals met at Fondi and chose Clement VII instead. From then on the West had two popes: Venice, Genoa, Florence, Hungary and England held with Rome, and France, Castile, Aragon, Scotland and Savoy with Avignon.#!\n\nNow the West has two popes again: one at [SCOPE.sLocation('oe_lat_pcap').GetName], upheld by [GetCountry('PAP').GetName], the other raised by the cardinals of other realms. Envoys from both have come to the capital, each asking the empire to recognise their pope. The West is busy with its own quarrel and has little thought for the East ([oe_tu_west_will|e] #R −15#! until the schism is over)."
 oe_lat.20.desc_n1: "#F In January 1377 Pope Gregory XI left Avignon and came back to Rome.#!\n\nNow the West has two popes again: one at [SCOPE.sLocation('oe_lat_pcap').GetName], upheld by [GetCountry('PAP').GetName], the other raised by the cardinals of other realms. Envoys from both have come to the capital, each asking the empire to recognise their pope. The West is busy with its own quarrel and has little thought for the East ([oe_tu_west_will|e] #R −15#! until the schism is over)."
 oe_lat.20.desc_n0: "#F The papacy has been at Avignon for decades, and the Romans have long waited for the pope to come back.#!\n\nNow the West has two popes again: one at [SCOPE.sLocation('oe_lat_pcap').GetName], upheld by [GetCountry('PAP').GetName], the other raised by the cardinals of other realms. Envoys from both have come to the capital, each asking the empire to recognise their pope. The West is busy with its own quarrel and has little thought for the East ([oe_tu_west_will|e] #R −15#! until the schism is over)."
 oe_lat.20.a: "Recognise the pope of [GetCountry('PAP').GetName]"
 oe_lat.20.a.tt: "[GetCountry('PAP').GetName]: opinion of the empire #G +15#! for #Y 10#! years\nThe backers of the other pope, if any: opinion of the empire #R −10#! for #Y 5#! years"
 oe_lat.20.b: "Recognise the other pope"
 oe_lat.20.b.tt: "[SCOPE.sCountry('oe_lat_anti').GetName]: opinion of the empire #G +15#! for #Y 10#! years\n[GetCountry('PAP').GetName]: opinion of the empire #R −15#! for #Y 5#! years"
 oe_lat.20.c: "Take no side"
 oe_lat.20.c.tt: "Recognise neither pope, and offend neither\nShares of the church factions: Hesychasts #Y +2#!"
 oe_lat.21.t: "One Pope Again"
 oe_lat.21.desc_3: "#F From 1378 the West had two popes, and its realms took sides. In 1409 a council at Pisa chose yet another pope, and there were three. From 1414 the Church of the West met in council at Constance; in November 1417 the council elected Martin V, and the Great Schism was over. The empire's embassy was there and saw the new pope elected.#!\n\nNow the West has one pope again. [GetCountry('BYZ').Custom('OeLatSchWin')] [GetCountry('BYZ').Custom('OeLatSchBet')] The new pope's envoy adds that the Church of the West will meet in council on the affairs of Christendom, and the Greeks may send men too."
 oe_lat.21.desc_2: "#F From 1378 the West had two popes, and its realms took sides. In 1409 a council at Pisa chose yet another pope, and there were three.#!\n\nNow the West has one pope again. [GetCountry('BYZ').Custom('OeLatSchWin')] [GetCountry('BYZ').Custom('OeLatSchBet')] The new pope's envoy adds that the Church of the West will meet in council on the affairs of Christendom, and the Greeks may send men too."
 oe_lat.21.desc_1: "#F From 1378 the West had two popes, and its realms took sides.#!\n\nNow the West has one pope again. [GetCountry('BYZ').Custom('OeLatSchWin')] [GetCountry('BYZ').Custom('OeLatSchBet')] The new pope's envoy adds that the Church of the West will meet in council on the affairs of Christendom, and the Greeks may send men too."
 oe_lat.21.desc_0: "#F For some years the Church of the West was split, each realm with a pope of its own.#!\n\nNow the West has one pope again. [GetCountry('BYZ').Custom('OeLatSchWin')] [GetCountry('BYZ').Custom('OeLatSchBet')] The new pope's envoy adds that the Church of the West will meet in council on the affairs of Christendom, and the Greeks may send men too."
 oe_lat.21.a: "Send envoys to greet the new pope"
 oe_lat.21.a.tt: "[GetCountry('PAP').GetName]: opinion of the empire #G +20#! for #Y 10#! years"
 oe_lat.21.b: "Send envoys with rich gifts to greet the new pope"
 oe_lat.21.b.tt: "Costs #R 1#! month of trade and tax income\n[GetCountry('PAP').GetName] no longer holds it against the empire that it recognised the other pope"
 oe_lat.21.c: "Send envoys to greet the new pope"
 oe_lat.21.c.tt: "[GetCountry('PAP').GetName]: opinion of the empire #G +10#! for #Y 10#! years"
 oe_lat.21.d: "Greet the pope, and send an embassy to the council"
 oe_lat.21.d.tt: "Costs #R 1#! month of trade and tax income\n[GetCountry('PAP').GetName]: opinion of the empire #G +20#! if the empire backed the right pope, #G +10#! if it backed none, for #Y 10#! years\nThe empire sends an embassy to the council of the West (made ready now, on its way from #Y 1416#! if it is earlier); the union line carries on with what the embassy does there"
 oe_lat.21.e: "Rich gifts, and an embassy to the council"
 oe_lat.21.e.tt: "Costs #R 2#! months of trade and tax income\n[GetCountry('PAP').GetName] no longer holds it against the empire that it recognised the other pope\nThe empire sends an embassy to the council of the West (made ready now, on its way from #Y 1416#! if it is earlier); the union line carries on with what the embassy does there"
 oe_lat.21.f: "Send a letter of greeting, no more"
 oe_lat.21.f.tt: "No money and no envoys"
 oe_lat.23.t: "Envoys from Constantinople"
 oe_lat.23.desc_late: "#F In July 1366 Pope Urban V wrote that help for the Greeks must wait until they returned to the Catholic Church.#!\n\nNow envoys from Constantinople have come to [SCOPE.sLocation('oe_lat_pcap').GetName] to beg the pope to call a crusade against the Ottomans.\nThe empire's standing ([oe_tu_west_will|e]): #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; the pope's authority: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_papal_auth')|0]#! (a crusade needs at least #Y 50#!). [GetCountry('BYZ').Custom('OeLatCruNow')]"
 oe_lat.23.desc_early: "#F In 1095 Emperor Alexios I appealed to the West for help, and Pope Urban II answered by preaching the first crusade.#!\n\nNow envoys from Constantinople have come to [SCOPE.sLocation('oe_lat_pcap').GetName] to beg the pope to call a crusade against the Ottomans.\nThe empire's standing ([oe_tu_west_will|e]): #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_west_will')|0]#!; the pope's authority: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_lat_papal_auth')|0]#! (a crusade needs at least #Y 50#!). [GetCountry('BYZ').Custom('OeLatCruNow')]"
 oe_lat.23.a: "Call a crusade"
 oe_lat.23.a.tt: "The pope issues a crusade bull against the Ottomans; the temporal leader is the strongest Catholic neighbour of the Ottomans (a Catholic empire, if there is no one else); in about three years the Papal States declare war under the usual rules\nIn about #Y 1#! month the envoys bring the answer back to Constantinople"
 oe_lat.23.b: "Grant indulgences to raise money for them"
 oe_lat.23.b.tt: "The empire receives as much as #Y 4#! months of its trade and tax income (paid by the Papal States while the AI rules them, at most what is in their treasury)\nIn about #Y 1#! month the envoys bring the answer back to Constantinople"
 oe_lat.23.c: "Union first, then help"
 oe_lat.23.c.tt: "The pope asks that the Eastern Church first unite with Rome\nIn about #Y 1#! month the envoys bring the answer back to Constantinople"
 oe_lat.23.d: "Nothing can be done"
 oe_lat.23.d.tt: "The envoys go home empty-handed\nIn about #Y 1#! month the envoys bring the answer back to Constantinople"
 oe_lat.22.t: "Rome's Answer"
 oe_lat.22.desc_1late: "#F In 1364 Pope Urban V issued seven bulls to raise money for the Count of Savoy's crusade; in July 1366 the pope wrote that help for the Greeks must wait until they returned to the Catholic Church.#!\n\nNow the envoys are back from the Curia: the pope has issued a crusade bull against [SCOPE.sCountry('oe_lat_ct').GetName], with [SCOPE.sCountry('oe_lat_cl').GetName] in command. In about three years the crusade will go to war. The envoys ask how the empire will play its part."
 oe_lat.22.desc_1early: "#F In 1095 Emperor Alexios I appealed to the West for help, and Pope Urban II answered by preaching the first crusade.#!\n\nNow the envoys are back from the Curia: the pope has issued a crusade bull against [SCOPE.sCountry('oe_lat_ct').GetName], with [SCOPE.sCountry('oe_lat_cl').GetName] in command. In about three years the crusade will go to war. The envoys ask how the empire will play its part."
 oe_lat.22.desc_2late: "#F In 1364 Pope Urban V issued seven bulls to raise money for the Count of Savoy's crusade; in July 1366 the pope wrote that help for the Greeks must wait until they returned to the Catholic Church.#!\n\nNow the envoys are back from the Curia: the pope would not call a crusade, but granted indulgences and raised #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_indulg').GetValue|0]#! gold for the empire."
 oe_lat.22.desc_2early: "#F In 1095 Emperor Alexios I appealed to the West for help, and Pope Urban II answered by preaching the first crusade.#!\n\nNow the envoys are back from the Curia: the pope would not call a crusade, but granted indulgences and raised #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_indulg').GetValue|0]#! gold for the empire."
 oe_lat.22.desc_3late: "#F In 1364 Pope Urban V issued seven bulls to raise money for the Count of Savoy's crusade; in July 1366 the pope wrote that help for the Greeks must wait until they returned to the Catholic Church.#!\n\nNow the envoys are back from the Curia: the pope says that help can be spoken of once the Eastern and Western churches are one. Some at court would agree; others say the faith is not a thing to trade for soldiers."
 oe_lat.22.desc_3early: "#F In 1095 Emperor Alexios I appealed to the West for help, and Pope Urban II answered by preaching the first crusade.#!\n\nNow the envoys are back from the Curia: the pope says that help can be spoken of once the Eastern and Western churches are one. Some at court would agree; others say the faith is not a thing to trade for soldiers."
 oe_lat.22.desc_4late: "#F In 1364 Pope Urban V issued seven bulls to raise money for the Count of Savoy's crusade; in July 1366 the pope wrote that help for the Greeks must wait until they returned to the Catholic Church.#!\n\nNow the envoys are back from the Curia with kind words and nothing else: the pope can do nothing for now. [GetCountry('BYZ').Custom('OeLatWhyNot')]"
 oe_lat.22.desc_4early: "#F In 1095 Emperor Alexios I appealed to the West for help, and Pope Urban II answered by preaching the first crusade.#!\n\nNow the envoys are back from the Curia with kind words and nothing else: the pope can do nothing for now. [GetCountry('BYZ').Custom('OeLatWhyNot')]"
 oe_lat.22.a: "Back the crusade in full"
 oe_lat.22.a.tt: "Costs #R 1#! month of trade and tax income\nThe papacy and [SCOPE.sCountry('oe_lat_cl').GetName]: opinion of the empire #G +15#! for #Y 10#! years\n[SCOPE.sCountry('oe_lat_ct').GetName]: opinion of the empire #R −25#! for #Y 10#! years\nFormer Roman places that members of the crusade take from the infidel may be bought back once the crusade breaks up\nIf [SCOPE.sCountry('oe_lat_ct').GetName] is the Ottomans and the empire is the sultan's vassal: the sultan's patience #R −25#!"
 oe_lat.22.b: "Wait for the West to march"
 oe_lat.22.b.tt: "The empire gives no money and no ships, and waits for the crusade to go to war"
 oe_lat.22.c: "Take the money"
 oe_lat.22.c.tt: "Gain #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_lat_indulg').GetValue|0]#! gold"
 oe_lat.22.d: "Promise to talk of union again"
 oe_lat.22.d.tt: "The union line: if there is no union yet, talks of union with Rome open for #Y 10#! years, and the council of union may come as early as #Y 1425#!\nShares of the church factions: Unionists #Y +5#!\nThe pope takes note of the empire's promise"
 oe_lat.22.e: "Do not trade the faith for help"
 oe_lat.22.e.tt: "The papacy: opinion of the empire #R −10#! for #Y 5#! years\nShares of the church factions: Hesychasts #Y +5#!"
 oe_lat.22.f: "A wasted journey"
 oe_lat.22.f.tt: "The envoys came back empty-handed"
 oe_lat.91.t: "The Latin World: the Curia's worker"
