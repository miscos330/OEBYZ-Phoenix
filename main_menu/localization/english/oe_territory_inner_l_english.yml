 oe_ti_grant_roman_law: "Grant Roman Law"
 oe_ti_grant_roman_law_desc: "Ask the [Concept('oe_tu_senate','senate')|e] to admit a province won by conquest or charter into the imperial heartland.\nConditions: a [Concept('oe_tu_march','march')|e], [Concept('oe_tu_exarchate','exarchate')|e] or [Concept('oe_tu_charter','chartered city')|e] (see [Concept('oe_tu_status','status')|e]) that was not a heartland province before; #Y 15#! years in the empire; loyalty #Y 70#! or more; the seat's dominant culture is in the Greek culture group or its dominant religion is Orthodox (the seat's dominant culture and religion stand in for 'the majority of the population'); loyalty has not fallen into the treason band in the last #Y 10#! years, and no theme revolt is under way.\nSubmitting costs #R 5#! [oe_tu_authority|e] whatever the vote. Passed: the province becomes a heartland province of heartland origin, loyalty #G +10#! (counted in the loyalty target for #Y 5#! years), Roman Reconquest hope #G +3#!. Rejected: loyalty #R −5#! (counted in the loyalty target for #Y 5#! years), and the province cannot be proposed again for #Y 5#! years.\n\n$oe_tsn_pv_4$"
 oe_ti_grant_roman_law_select: "Choose a province"
 oe_ti_grant_roman_law_none: "@trigger_no!No province qualifies. See the action description for the conditions."
 oe_ti_grant_roman_law_tt: "Costs #R 5#! [oe_tu_authority|e]. The [Concept('oe_tu_senate','senate')|e] votes on Roman law for the chosen province."
 oe_ti_grant_despotate: "Grant a Despotate"
 oe_ti_grant_despotate_desc: "Give a heartland province (not Thessalonica) to an adult member of the imperial dynasty as a despotate. The candidate must live at the imperial court and must not be the emperor, the heir, a cabinet member or a court officer.\nCosts #R 10#! [oe_tu_authority|e] and #R 10#! prestige. A despotate sends #G 5%#! of its monthly income to the treasury. When the despot is gone an adult of the same dynasty may inherit; otherwise the land returns to the empire. While the throne is unsettled a despot may covet it."
 oe_ti_grant_despotate_select: "Choose a province"
 oe_ti_grant_despotate_none: "@trigger_no!No heartland province can be granted."
 oe_ti_grant_despotate_select_char: "Choose a member of the imperial house"
 oe_ti_grant_despotate_none_char: "@trigger_no!No adult member of the imperial dynasty at court qualifies."
 oe_ti_grant_despotate_tt: "Costs #R 10#! [oe_tu_authority|e] and #R 10#! prestige. The province becomes a despotate with the chosen person as despot."
 oe_ti_recall_despot: "Recall a Despot"
 oe_ti_recall_despot_desc: "Call a despot back to the capital; the despotate becomes a heartland province again. Costs #R 5#! [oe_tu_authority|e]. The province loses #R 15#! loyalty (counted in the loyalty target for #Y 5#! years), with a #R 20%#! chance that it rises (#R 40%#! below #Y 40#! loyalty)."
 oe_ti_recall_despot_select: "Choose a despotate"
 oe_ti_recall_despot_none: "@trigger_no!The empire has no despotate."
 oe_ti_recall_despot_tt: "Costs #R 5#! [oe_tu_authority|e]. The despot returns to court and the province becomes a heartland province; loyalty #R −15#!, a #R 20%#! chance that it rises (#R 40%#! below #Y 40#! loyalty)."
 oe_ti_settle_soldiers: "Settle Soldier Families"
 oe_ti_settle_soldiers_desc: "Give land to soldier families in a [Concept('oe_tu_march','march')|e] or [Concept('oe_tu_exarchate','exarchate')|e] on the army [Concept('oe_tu_course','course')|e]. Costs #R 3#! [oe_tu_authority|e] and #R 150#! gold; the next choice decides between foreign settlers and native farmer-soldiers. The effects last #Y 20#! years, with unrest in the first #Y 5#!; once per province in #Y 30#! years."
 oe_ti_settle_soldiers_select: "Choose a province"
 oe_ti_settle_soldiers_none: "@trigger_no!No province can take settlers (an army-course march or exarchate without settlers in the last #Y 30#! years)."
 oe_ti_settle_soldiers_tt: "Opens the choice of settlers."
 oe_ti_pronoia_choice: "Grant Pronoia"
 oe_ti_pronoia_choice_tt: "Grant the province's land revenues to soldiers in return for service. Requires the [Concept('oe_tu_pronoia','pronoia')|e] system or a later pronoia policy.\nThe province and its jurisdiction gain by the current policy (Pronoia System: manpower #G +10%#!, levy size #G +10%#!; Komnenian Formalization: manpower #G +15%#!, levy size #G +15%#!; Palaeologan Hereditary Transition: manpower #G +20%#!, levy size #G +20%#!; Reformed Pronoia: manpower #G +15%#!, levy size #G +10%#!; manpower and levy size by the same amount in each jurisdiction location).\nA house-born strategos: the house gains #Y 5#! influence a year.\nAfter #Y 20#! years the grants become hereditary; taking hereditary grants back costs #R 15#! loyalty (#R 20#! under the Palaeologan hereditary transition, #R 10#! under reformed pronoia), counted in the loyalty target for #Y 5#! years.\nA managed theme is not asked after #Y 20#! years: the grants simply become hereditary (the AI empire's most common answer)."
 oe_ti.1.t: "The Front Moves"
 oe_ti.1.d: "From the seventh to the tenth century the empire guarded the passes of its eastern border with kleisourai, each under a commander of its own whose only task was to hold the passes. Wherever the front moved, the way a district was governed had to change with it.\n\nNow the jurisdiction of [SCOPE.sCountry('oe_ti_ev_theme').GetName] borders a foreign country. Some at court want it made a march and handed to a doux to be governed as a front."
 oe_ti.1.a: "Make it a march"
 oe_ti.1.a.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a [Concept('oe_tu_march','march')|e] (the status modifier changes with it, and its governor becomes a doux).\nIt is marked as of heartland origin: after #Y 5#! consecutive years without a foreign border it may become a heartland province again.\nIf [SCOPE.sCountry('oe_ti_ev_theme').GetName] follows the civil course, it changes to the army course (a march cannot follow the civil course) and cannot change course again for #Y 5#! years."
 oe_ti.1.b: "Keep it a heartland province"
 oe_ti.1.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName] gets 'Insufficient Frontier Defence': province morale #R −10%#!, reinforcement speed #R −20%#!; each jurisdiction location: garrison size #R −25%#!, defence #R −10%#!.\nIt lasts until the province becomes a [Concept('oe_tu_march','march')|e] or no longer borders a foreign country.\nNo new question for #Y 5#! years."
 oe_ti.2.t: "The Border Is Quiet"
 oe_ti.2.d: "In the tenth century the empire won back Antioch and other eastern cities and set up doukata on the new frontier to command the small border themes. Once the border had moved on, yesterday's front became today's heartland.\n\nNow [SCOPE.sCountry('oe_ti_ev_theme').GetName] has not bordered a foreign country for 5 years. It was a heartland province before."
 oe_ti.2.a: "Restore it to the heartland"
 oe_ti.2.a.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a heartland province (the status modifier changes with it)."
 oe_ti.2.b: "Keep it a march"
 oe_ti.2.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName] stays a [Concept('oe_tu_march','march')|e]. If it still has no foreign border in #Y 5#! years, the question returns."
 oe_ti.21.t: "Roman Law"
 oe_ti.21.d: "In 212 the emperor Caracalla granted Roman citizenship to every free inhabitant of the empire. Cassius Dio says it was an honour in name and a tax measure in fact, since many taxes fell only on citizens. From then on, being Roman no longer meant belonging to one city.\n\nNow the senate has resolved that the people of [SCOPE.sCountry('oe_ti_ev_theme').GetName] live under Roman law like those of the capital. [SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes part of the imperial heartland."
 oe_ti.21.a: "They are Romans now"
 oe_ti.21.a.tt: "(Already applied) [SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a heartland province of heartland origin.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #G +10#!, counted in the loyalty target for #Y 5#! years.\nRoman Reconquest hope #G +3#! (while the situation runs)."
 oe_ti.30.t: "A Despotate for the Imperial House"
 oe_ti.30.d: "In 1349 John VI Kantakouzenos gave the Morea to his son Manuel to govern. Manuel ruled from Mystras as despot, and the Morea became almost a state of its own. In 1408 Manuel II gave Thessalonica to his son Andronikos, then eight years old, with the general Leontares at his side.\n\nNow [SCOPE.sCountry('oe_ti_ev_theme').GetName] has been given to [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] of the imperial house."
 oe_ti.30.a: "May the land be well kept"
 oe_ti.30.a.tt: "(Already applied) [SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a despotate with [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] as despot.\n[oe_tu_authority|e] #R −10#!, prestige #R −10#!.\nA despotate sends #Y 5%#! of its monthly income to the treasury."
 oe_ti.31.t: "The Despotate Stands Empty"
 oe_ti.31.d1: "In 1380 Manuel Kantakouzenos, despot of the Morea, died. In 1383 Theodore of the Palaiologos family came to Mystras and took the land over. A despotate is the emperor's gift to his kin; when the despot is gone, the emperor decides who holds it next.\n\nNow the despot's seat in [SCOPE.sCountry('oe_ti_ev_theme').GetName] stands empty. [SCOPE.sCharacter('oe_ti_ev_heir').GetName] is an adult of the same family who could inherit."
 oe_ti.31.d: "In 1380 Manuel Kantakouzenos, despot of the Morea, died. In 1383 Theodore of the Palaiologos family came to Mystras and took the land over. A despotate is the emperor's gift to his kin; when the despot is gone, the emperor decides who holds it next.\n\nNow the despot's seat in [SCOPE.sCountry('oe_ti_ev_theme').GetName] stands empty, and no adult of the family is left to inherit."
 oe_ti.31.a: "Let [SCOPE.sCharacter('oe_ti_ev_heir').GetName] inherit"
 oe_ti.31.a.tt: "[SCOPE.sCharacter('oe_ti_ev_heir').GetName] becomes despot of [SCOPE.sCountry('oe_ti_ev_theme').GetName], which stays a despotate."
 oe_ti.31.b: "Take the despotate back"
 oe_ti.31.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a heartland province.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #R −10#!, counted in the loyalty target for #Y 5#! years."
 oe_ti.31.c: "The land returns to the empire"
 oe_ti.31.c.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a heartland province."
 oe_ti.32.t: "An Eye on the Throne"
 oe_ti.32.d1: "In April 1442 the despot Demetrios Palaiologos made a bargain with Sultan Murad II and attacked Constantinople with Ottoman troops, hoping to take the throne from his brother John VIII. The attack was beaten off and Demetrios was briefly imprisoned.\n\nNow the emperor is a minor and a regent governs. [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] of [SCOPE.sCountry('oe_ti_ev_theme').GetName] has agents going from house to house in the capital."
 oe_ti.32.d: "In April 1442 the despot Demetrios Palaiologos made a bargain with Sultan Murad II and attacked Constantinople with Ottoman troops, hoping to take the throne from his brother John VIII. The attack was beaten off and Demetrios was briefly imprisoned.\n\nNow the succession to the throne is in doubt. [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] of [SCOPE.sCountry('oe_ti_ev_theme').GetName] has agents going from house to house in the capital."
 oe_ti.32.a: "Reward [SCOPE.sCharacter('oe_ti_ev_ruler').GetHerHim] and ask [SCOPE.sCharacter('oe_ti_ev_ruler').GetHerHim] to stay home"
 oe_ti.32.a.tt: "#R −200#! gold\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #G +5#!, counted in the loyalty target for #Y 5#! years."
 oe_ti.32.b: "Recall the despot"
 oe_ti.32.b.tt: "[oe_tu_authority|e] #R −5#!\n[SCOPE.sCharacter('oe_ti_ev_ruler').GetName] is called back to the capital and [SCOPE.sCountry('oe_ti_ev_theme').GetName] becomes a heartland province.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #R −15#!, counted in the loyalty target for #Y 5#! years.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: a #R 20%#! chance that it rises (#R 40%#! below #Y 40#! loyalty)."
 oe_ti.32.c: "Wait and watch"
 oe_ti.32.c.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #R −10#!, counted in the loyalty target for #Y 5#! years.\nA #R 25%#! chance that [SCOPE.sCountry('oe_ti_ev_theme').GetName] rises next month."
 oe_ti.40.t: "Soldier Settlers"
 oe_ti.40.d: "In the early 1240s the Mongols drove the Cumans off the steppe. John III Vatatzes settled them in Thrace, Macedonia and Asia Minor and gave them land on condition that they serve in the army. The Cumans became light cavalry and standing troops of the empire.\n\nNow the jurisdiction of [SCOPE.sCountry('oe_ti_ev_theme').GetName] has empty land to give out."
 oe_ti.40.a: "Settle foreign soldier families"
 oe_ti.40.a.tt: "Costs #R 3#! [oe_tu_authority|e] and #R 150#! gold.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: manpower #G +15%#!, recruitment speed #G +20%#! (#Y 20#! years).\nEach jurisdiction location: population growth #G +0.2%#!, manpower #G +10%#! (#Y 20#! years); unrest #R +0.5#! (first #Y 5#! years).\nNo new settlers in [SCOPE.sCountry('oe_ti_ev_theme').GetName] for #Y 30#! years."
 oe_ti.40.b: "Bring in farmer-soldiers from the heartland"
 oe_ti.40.b.tt: "Costs #R 3#! [oe_tu_authority|e] and #R 150#! gold.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: manpower #G +10%#!, recruitment speed #G +10%#! (#Y 20#! years).\nEach jurisdiction location: assimilation speed #G +25%#!, manpower #G +5%#! (#Y 20#! years); unrest #R +0.25#! (first #Y 5#! years).\nNo new settlers in [SCOPE.sCountry('oe_ti_ev_theme').GetName] for #Y 30#! years."
 oe_ti.40.c: "Not now"
 oe_ti.40.c.tt: "Nothing changes."
 oe_ti.50.t: "Hereditary Grants"
 oe_ti.50.d: "A pronoia was at first only a grant of the taxes of some land, held at the emperor's pleasure, revocable at any time and not passed on to heirs. After Constantinople was retaken in 1261, Michael VIII let pronoiai pass to heirs, and the grants slowly became family property.\n\nNow the grants in [SCOPE.sCountry('oe_ti_ev_theme').GetName] have been held for 20 years, and their holders ask to leave them to their sons."
 oe_ti.50.a: "Make them hereditary"
 oe_ti.50.a.tt: "The grants in [SCOPE.sCountry('oe_ti_ev_theme').GetName] become hereditary: taking them back will cost #R 15#! loyalty (#R 20#! under the Palaeologan hereditary transition, #R 10#! under reformed [Concept('oe_tu_pronoia','pronoia')|e]), counted in the loyalty target for #Y 5#! years.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #G +5#!, counted in the loyalty target for #Y 5#! years.\nIf the strategos is house-born: the house gains #Y 10#! influence."
 oe_ti.50.b: "Wait ten more years"
 oe_ti.50.b.tt: "[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #R −5#!, counted in the loyalty target for #Y 5#! years.\nThe question returns in #Y 10#! years (this can be done only once)."
 oe_ti.50.c: "Take the grants back now"
 oe_ti.50.c.tt: "The finances of [SCOPE.sCountry('oe_ti_ev_theme').GetName] return to the strategos and the grants end; the officials cannot be changed for #Y 2#! years.\n[SCOPE.sCountry('oe_ti_ev_theme').GetName]: loyalty #R −5#!, counted in the loyalty target for #Y 5#! years."
 oe_ti.30.d_pre: "Irene of Montferrat, wife of Andronikos II, wanted the empire divided among her sons as appanages, as was done in the West. The emperor would not agree, and around 1303 she left the capital to live in Thessalonica.\n\nNow [SCOPE.sCountry('oe_ti_ev_theme').GetName] has been given to [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] of the imperial house."
 oe_ti.31.d1_pre: "Despot was the highest title below the emperor; from the twelfth century it went mostly to the emperor's sons and kin, and it was not hereditary. A despotate is the emperor's gift to his kin; when the despot is gone, the emperor decides who holds it next.\n\nNow the despot's seat in [SCOPE.sCountry('oe_ti_ev_theme').GetName] stands empty. [SCOPE.sCharacter('oe_ti_ev_heir').GetName] is an adult of the same family who could inherit."
 oe_ti.31.d_pre: "Despot was the highest title below the emperor; from the twelfth century it went mostly to the emperor's sons and kin, and it was not hereditary. A despotate is the emperor's gift to his kin; when the despot is gone, the emperor decides who holds it next.\n\nNow the despot's seat in [SCOPE.sCountry('oe_ti_ev_theme').GetName] stands empty, and no adult of the family is left to inherit."
 oe_ti.32.d1_pre: "From 1321 the young Andronikos III fought his grandfather Andronikos II for the throne in a civil war that stopped and started for seven years. In May 1328 he entered Constantinople by night and made the old emperor abdicate.\n\nNow the emperor is a minor and a regent governs. [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] of [SCOPE.sCountry('oe_ti_ev_theme').GetName] has agents going from house to house in the capital."
 oe_ti.32.d_pre: "From 1321 the young Andronikos III fought his grandfather Andronikos II for the throne in a civil war that stopped and started for seven years. In May 1328 he entered Constantinople by night and made the old emperor abdicate.\n\nNow the succession to the throne is in doubt. [SCOPE.sCharacter('oe_ti_ev_ruler').GetName] of [SCOPE.sCountry('oe_ti_ev_theme').GetName] has agents going from house to house in the capital."
