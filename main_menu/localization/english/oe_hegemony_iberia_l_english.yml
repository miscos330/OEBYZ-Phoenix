l_english:
 OE_HEG_END_CONTEST_REQUIRED: "Completed End the Turmoil on the Contest of Warlords page"
 OE_RW_IBERIA: "Iberia"
 OE_RW_IBERIA_DESC: "Beyond the Pillars of Hercules, ancient provinces have changed banners many times. The mountains and rivers remain on the old charts; imperial writs will once again cross the western straits."
 OE_RW_IBERIA_OPEN: "View Iberian actions"
 OE_RW_IBERIA_ACTIONS: "Iberian Actions"
 OE_RW_IBERIA_HINT: "Click the map to open its action panel here."
 OE_RW_TOLEDO: "Toledo"
 OE_RW_TOLEDO_OWNER: "Current owner of Toledo"
 OE_HEG_IBERIA_ACTIONS_HINT: "Prepare the western campaign, then acquire individual invasion claims or invade the peninsula on a grand scale. Ordinary invasion actions have a three-month cooldown."
 OE_HEG_IBERIA_PLAN_REQUIRED: "Completed Plan the Invasion of Iberia"
 OE_HEG_IBERIA_NO_ACTIVE_CAMPAIGN: "All designated opponents have ended their registered campaign wars against Byzantium"
 oe_heg_plan_iberia: "Plan the Invasion of Iberia"
 oe_heg_plan_iberia_desc: "Unroll the charts to the western sea. Scribes copy the old names of towns and harbors while quartermasters reckon the provisions needed to carry the eagle across the Mediterranean."
 oe_heg_plan_iberia_effect: "Spend 1000 treasury gold to add the Iberia region to the Roman World and unlock its actions. Once only."
 oe_heg_plan_iberia_done: "Completed: Plan the Invasion of Iberia"
 oe_heg_invade_iberia: "Invade Iberia"
 oe_heg_invade_iberia_desc: "Send sealed imperial writs to the rulers who still hold Iberian land. Their capitals have already been marked on the maps of our commanders."
 oe_heg_invade_iberia_effect: "Spend 100 treasury gold. Choose a country owning land in Iberia, excluding Byzantium and its subjects. Gain a fifteen-year casus belli to take its capital. Does not declare war. Repeatable with a three-month cooldown."
 oe_heg_mass_invade_iberia: "Mass Invasion of Iberia"
 oe_heg_mass_invade_iberia_desc: "The fleet will spread along the coast and the legions will cross the passes. Every foreign ruler whose court lies on the peninsula must now face the imperial eagle. Conquered towns will pass to Byzantium, while royal capitals await the settlement of the war."
 oe_heg_mass_invade_iberia_effect: "Spend 1000 treasury gold to declare war on every external country with its capital in Iberia, excluding Byzantium and its subjects. Already hostile targets join this campaign. In the registered wars, Byzantium and its participating subjects immediately transfer occupied noncapital Iberian locations owned by designated targets to Byzantium. Byzantium receives both ownership and control, including land occupied by its subjects. Current capitals, land outside Iberia and other war participants are excluded. The ability ends as soon as each target leaves its registered wars; later ordinary wars do not restore it. Repeatable after the campaign ends. The cost is refunded if no eligible war is entered.\n\n$OE_HEG_MASS_INVASION_BONUS_TT$"
