l_english:
 oe_byz_missions_tur_I_req_tt: "Hold Constantinople with a stable realm before looking across the straits."
 oe_byz_missions_tur_II_req_tt: "Have 300 gold in the treasury and the army at least 80% of its expected size."
 oe_byz_missions_tur_III_req_tt: "Win over at least one Turkish ruler (opinion of us 50 or more) to divide the Turks."
 oe_byz_missions_tur_IV_req_tt: "With stability at least 1 and legitimacy at least 50, the Church blesses the campaign."
 oe_byz_missions_tur_V_req_tt: "Take Bursa and gain a foothold on the Asian shore."
 oe_byz_missions_tur_VI_req_tt: "Recover Nicaea, the city of the First Council."
 oe_byz_missions_tur_VII_req_tt: "Recover Smyrna and the ports of the eastern Aegean."
 oe_byz_missions_tur_VIII_req_tt: "Take Kütahya and Bandırma to push the front to the edge of the plateau."
 oe_byz_missions_tur_IX_req_tt: "The Ottoman state no longer exists or has become a subject of the empire."
 oe_byz_missions_tur_X_req_tt: "Conquer Ankara, the gate to central Anatolia."
 oe_byz_missions_tur_XI_req_tt: "Conquer Konya, seat of Karaman."
 oe_byz_missions_tur_XII_req_tt: "Hold Kayseri with at least a quarter of its people of Greek culture."
 oe_byz_missions_tur_XIII_req_tt: "Conquer Sivas and open the road east."
 oe_byz_missions_tur_XIV_req_tt: "Hold Ankara, Konya, Sivas, Kayseri and Antalya together; Anatolia is the empire's again."
 oe_byz_missions_tur_XV_req_tt: "Bring Trebizond back under Constantinople."
 STATIC_MODIFIER_NAME_oe_tur_war_preparations: "War Preparations"
 STATIC_MODIFIER_NAME_oe_tur_archangels_blessing: "Blessing of the Archangel"
 STATIC_MODIFIER_NAME_oe_tur_anatolian_granary: "Land of Milk and Honey"
 STATIC_MODIFIER_NAME_oe_tur_cappadocian_revival: "Cappadocian Revival"
