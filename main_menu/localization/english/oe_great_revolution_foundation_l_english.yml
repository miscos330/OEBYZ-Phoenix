 oe_gr_republic_power_structure_law_desc: "With the throne displaced, Rome must answer an old question anew: in whose name should the state command?"
 oe_gr_civic_assembly_policy: "Citizens’ Assembly"
 oe_gr_civic_assembly_policy_desc: "Representatives of town and countryside deliberate together. Noble birth and ecclesiastical office confer no seats; nobles and clergy are barred from the assembly."
 oe_roman_republic: "Roman Republic"
 oe_roman_republic_desc: "A republican parliament open to burghers and commoners. Public debate, legislation and civic consent must establish the authority of the state anew."
 STATIC_MODIFIER_NAME_oe_gr_newborn_republic: "A Republic Reborn"
 STATIC_MODIFIER_DESC_oe_gr_newborn_republic: "The fall of the throne has made a new state seem possible. Hope animates the armies and offices, while strengthening the revolutionaries’ conviction that they may remake the world."
 STATIC_MODIFIER_NAME_oe_gr_chaotic_civic_assembly: "A Disorderly Citizens’ Assembly"
 STATIC_MODIFIER_DESC_oe_gr_chaotic_civic_assembly: "The delegates have found their voices before learning how to reach a common decision. Disputes over procedure, local demands and conflicting promises obstruct every motion."
 oe_great_revolution.20.t: "Preparing a New Government"
 oe_great_revolution.20.d: "The barricades still stand, but demands already cover the provisional government’s desks. The soldiers need pay, the grain merchants need guarantees, and the provinces need to know who may sign tomorrow’s orders. An emperor could be overthrown in a night; a state cannot be governed by cheers alone.\n\nGuilds and villages offer credit and labor. Three remarkably capable citizens enter the government offices, bringing administrative skill, diplomacy and military judgment in place of old courtly titles. No one yet knows where the republic will lead Rome. For now, it is enough that someone is willing to answer for tomorrow."
 oe_great_revolution.20.a: "Let Rome begin to govern itself."
 oe_great_revolution.21.t: "Establishing the Citizens’ Assembly"
 oe_great_revolution.21.d: "The doors open to representatives of town and countryside together. Artisans unfold ink-stained petitions; village delegates read demands concerning taxes and service. Those who waited outside yesterday now demand a voice in the laws of the state.\n\nNeither noble lineage nor a bishop’s staff will confer a seat. Cheers drown the presiding officer’s bell, followed by disputes over speaking rights, the length of debate and the counting of votes. Rome has an assembly of citizens at last. It has yet to learn the habits that will let them decide together."
 oe_great_revolution.21.a: "Let the citizens deliberate on the affairs of state."
 oe_great_revolution.22.t: "A Name for the New State"
 oe_great_revolution.22.d: "The new seal is ready to be engraved, yet the name of the state remains blank on its diplomatic papers. We are still Rome, but an emperor no longer speaks for Rome. Our provinces, armies and neighbors must be told what the revolution has founded.\n\nSome would proclaim a republic and its source of authority. Others favor a federation, promising a common voice to the provinces. Still others invoke an older covenant, placing the Senate beside the People of Rome. A name will not settle our arguments, but it will carry the promise we make to the world."
 oe_great_revolution.23.t: "The Founding of [ROOT.GetCountry.GetNameWithNoTooltip]"
 oe_great_revolution.23.d: "The new name is read before the assembly, then carried to the camps, ports and cities still reached by the capital’s dispatches. As the seal meets the page, the chamber falls briefly silent. The cry from the barricades has become a state that can issue laws, incur obligations and promise its people a future.\n\n[ROOT.GetCountry.GetNameWithNoTooltip] is founded. It inherits Rome’s vast lands and its unsettled grievances alike. Today’s celebration cannot remove tomorrow’s dangers, but the citizens have a name they may defend together. The revolution must now show that it can build an order as well as overthrow one."
 oe_great_revolution.23.a: "Let this name be worthy of the Roman people."
