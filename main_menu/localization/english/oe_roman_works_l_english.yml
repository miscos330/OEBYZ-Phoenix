 oe_roman_works.7.t: "Fresh Water Reaches the City"
 oe_roman_works.7.d: "Workers remove the last temporary barrier, and clean water flows into the city. Crowds no longer gather around distant wells, while the surrounding fields share the benefit."
 oe_roman_works.7.a: "This is what the empire does for its citizens."
 oe_gw_nimes_waterworks: "Imperial Aqueduct of Nîmes"
 oe_gw_nimes_waterworks_desc: "Restore the aqueduct section by section from the springs near Uzès to Nîmes. The Pont du Gard is only one part of a watercourse that must work from end to end.\n\nLocal population growth +0.01%; population capacity +250K; local maximum RGO size +25%."
