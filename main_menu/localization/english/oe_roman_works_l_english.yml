 oe_roman_works.5.t: "A New Home for the Eastern See"
 oe_roman_works.5.d: "Hymns of consecration fill the new precinct as its library and almonry open. The patriarch sends his thanks while clergy receive their first students and petitioners."
 oe_roman_works.5.a: "May learning and mercy spread from these halls."
 oe_gw_carthage_ports: "Twin Harbors of Carthage"
 oe_gw_carthage_ports_desc: "Restore the channels of ancient Carthage within Tunis and establish separate commercial and naval harbors, making this old shoreline a new imperial foothold.\n\nLocal shipbuilding speed +20%; local sailors +20%; trade capacity +10."
