 oe_roman_works.2.t: "Books Return to Alexandria"
 oe_roman_works.2.d: "The first books have been catalogued, and the pens of copyists stir in the bright halls. Scholars arrive to consult the collections; the new library has found its purpose."
 oe_roman_works.2.a: "Leave our successors more knowledge than we inherited."
 oe_gw_pharos: "Great Lighthouse of Pharos"
 oe_gw_pharos_desc: "Raise a beacon beside the ancient lighthouse site, guiding ships that now grope along the coast by memory. Its light shall proclaim our return to the sea.\n\nTrade capacity +10; local trade protection +15%."
