 oe_roman_works.3.t: "A Second Star above the Sea"
 oe_roman_works.3.d: "At dusk, the first light shines across the harbor. Returning vessels turn into the channel, their sailors cheering the long-awaited beacon."
 oe_roman_works.3.a: "From tonight, sailors will remember this light."
