 oe_roman_works.6.t: "The Twin Harbors Reopen"
 oe_roman_works.6.d: "With the ancient moles rebuilt and deep anchorages dredged clear, the twin harbours of the imperial capital reopen in full splendour. Heavily laden merchantmen unload grain and silks along the outer quays while imperial warships glide into sheltered inner drydocks, each basin serving its appointed calling behind restored breakwaters."
 oe_roman_works.6.a: "Let merchant sails and naval standards rise together."
