 oe_roman_works.1.t: "The Crowds Return"
 oe_roman_works.1.d: "The restored gates open and the tiers fill with citizens. Music and cheers rise above the streets; Rome need no longer seek its glory only among ruins."
 oe_roman_works.1.a: "This city still belongs to living Romans."
 oe_gw_alexandrian_library: "Imperial Library of Alexandria"
 oe_gw_alexandrian_library_desc: "The ancient collection cannot be recovered in full, but its work of collecting, copying and debating can begin anew in an imperial library.\n\nResearch speed +2.5%; local cultural influence +0.1."
