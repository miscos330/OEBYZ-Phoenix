 STATIC_MODIFIER_NAME_oe_el2_reunion_zeal_mod: "Transatlantic Oath of Return"
 STATIC_MODIFIER_DESC_oe_el2_reunion_zeal_mod: "With the Atlantic fog broken after a century of exile, the imperial fleet rallies to cross back toward the ancestral sea."
 STATIC_MODIFIER_NAME_oe_el2_atlantic_silk_glut_mod: "Elysian Silk Boom in the Old World"
 STATIC_MODIFIER_DESC_oe_el2_atlantic_silk_glut_mod: "Bolts of Chesapeake mulberry silk flood European markets, bringing handsome trade profits and imperial prestige."
 STATIC_MODIFIER_NAME_oe_el2_secret_roman_accord_mod: "Secret Transatlantic Eagle Accord"
 STATIC_MODIFIER_DESC_oe_el2_secret_roman_accord_mod: "The two surviving branches of the Roman Eagle exchange envoys across the ocean, upholding shared heritage and sea lanes."
 STATIC_MODIFIER_NAME_oe_el2_hesperides_fleet_mod: "Hesperides Copper-Clad Expedition Fleet"
 STATIC_MODIFIER_DESC_oe_el2_hesperides_fleet_mod: "Outfitted from mid-Atlantic staging islands, the copper-clad expeditionary fleet extends imperial range, morale, and shipbuilding speed."
 STATIC_MODIFIER_NAME_oe_el2_eastern_restoration_seat_mod: "Restored Seat of Constantinople"
 STATIC_MODIFIER_DESC_oe_el2_eastern_restoration_seat_mod: "Having returned the throne to the Golden Horn while chartering Nova Elysia as a Grand Exarchate, the empire governs both shores with renewed authority."
 STATIC_MODIFIER_NAME_oe_el2_western_seat_mod: "Western Imperial Seat of New Constantinople"
 STATIC_MODIFIER_DESC_oe_el2_western_seat_mod: "Retaining the imperial court in Nova Elysia while entrusting the Mediterranean to the Exarchate of the Orient anchors transatlantic trade and settlement."
 STATIC_MODIFIER_NAME_oe_el2_bicephalum_federation_mod: "Charter of the Twin-Capital Federation"
 STATIC_MODIFIER_DESC_oe_el2_bicephalum_federation_mod: "Constantinople and New Constantinople reign in tandem over a federated network of imperial Exarchates spanning two worlds."
 STATIC_MODIFIER_NAME_oe_el2_varangian_blood_pact_mod: "Varangian Blood Pact of Vinland"
 STATIC_MODIFIER_DESC_oe_el2_varangian_blood_pact_mod: "Nova Elysia and the Norse of Vinland renew the ancient Varangian oath, strengthening heavy infantry and northern fur and fishing trades."
 STATIC_MODIFIER_NAME_oe_el2_markland_charter_mod: "Markland Timber and Fur Charter"
 STATIC_MODIFIER_DESC_oe_el2_markland_charter_mod: "Northern timber and seasoned mariners flow south from Markland into imperial yards, speeding fleet construction and manning."
 STATIC_MODIFIER_NAME_oe_el2_laconian_phalanx_mod: "Laconian Phalanx Alliance"
 STATIC_MODIFIER_DESC_oe_el2_laconian_phalanx_mod: "Drilling alongside the Laconian legionaries of Spartania instills stern discipline and steadfast battlefield morale."
 STATIC_MODIFIER_NAME_oe_el2_obsidian_silver_accord_mod: "Accord of Silver and Obsidian"
 STATIC_MODIFIER_DESC_oe_el2_obsidian_silver_accord_mod: "Elysia, Spartania, and the Valley of Mexico turn rivalry into commerce, linking silver mines and coastal workshops."
 STATIC_MODIFIER_NAME_oe_el2_five_exarchates_council_mod: "Grand Council of the Five Exarchates"
 STATIC_MODIFIER_DESC_oe_el2_five_exarchates_council_mod: "Envoys from five American Exarchates convene in the Elysian Senate to coordinate maritime defense, commerce, and colonial loyalty."
 STATIC_MODIFIER_NAME_oe_el2_old_world_exarchates_mod: "Restored Old World Exarchate System"
 STATIC_MODIFIER_DESC_oe_el2_old_world_exarchates_mod: "Ancestral Exarchates across Thrace, Anatolia, Ravenna, and Alexandria restore Roman provincial governance to the Mediterranean."
