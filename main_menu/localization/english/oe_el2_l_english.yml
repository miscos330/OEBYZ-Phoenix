 oe_el2.1.title: "Grand Charter of the Imperial Exarchates"
 oe_el2.1.desc: "As the first Imperial Exarch receives the golden double-headed seal before the Elysian Senate, the venerable provincial institution of Justinian and Maurice is reborn beyond the Atlantic. Distant frontiers may now govern themselves while answering to the crown."
 oe_el2.1.a: "Enact the Grand Charter of Exarchates"
 oe_el2.1.a.tt: "Gain the #G Grand Charter of the Exarchates#! modifier for 25 years, boosting loyalty, diplomatic capacity, and migration."
 oe_el2.1.b: "Collect Inaugural Charter Dues for the Treasury"
 oe_el2.1.b.tt: "Immediately gain gold and prestige."
 oe_el2.2.title: "The Great Transatlantic Reunion"
 oe_el2.2.desc_tur: "Dawn mist parts along the mid-Atlantic ridge as European carracks sight Elysian copper-clad warships off the Azores. Their dispatches strike the palace in Chesapeake silent: the Ottoman crescent flies above the Theodosian Walls, and Constantinople lies beneath the Sultan's rule."
 oe_el2.2.desc_latin: "Dawn mist parts off the Azores as European vessels meet Elysian patrol ships. News from the Mediterranean stirs outrage across the Senate: the merchant banners of the Latin maritime republics fly over the Golden Horn, shadowing Constantinople once more."
 oe_el2.2.desc_roman: "Dawn mist clears off the Azores as Elysian captains exchange salutes with Old World ships. Joyful word races back to the Senate: the purple Eagle still flies over the Bosphorus. After a century apart, two branches of Rome recognize one another across the Atlantic."
 oe_el2.2.desc_celestial: "As the Atlantic fog lifts and charts to Gibraltar reopen, sailors bring an astonishing report to Chesapeake: the dragon banner of the Celestial Empire flies over the Bosphorus, for the Son of Heaven has reached Constantinople itself."
 oe_el2.2.desc_rus: "As the fog clears along the Azores sea lanes, dispatches reveal a startling transformation on the Straits: the Slavic Tsars of the north have marched to the Bosphorus under their own Double-Headed Eagle, holding Constantinople as the self-proclaimed Third Rome."
 oe_el2.2.desc_other: "Dawn mist clears along the Azores ridge as Elysian warships meet vessels from across the ocean. A century of isolation ends in an instant as charts of Lisbon, Gibraltar, Rome, and Constantinople unfold upon the imperial table."
 oe_el2.2.a: "Rekindle the Oath of Return"
 oe_el2.2.a.tt: "Gain #G Transatlantic Oath of Return#! for 25 years and unlock the #T Hesperides Forward Base#! decision."
 oe_el2.2.b: "Flood Old World Ports with Elysian Silk"
 oe_el2.2.b.tt: "Gain #G Elysian Silk Boom in the Old World#! for 20 years along with gold and prestige."
 oe_el2.2.c: "Seal a Secret Eagle Accord with Old World Byzantium"
 oe_el2.2.c.tt: "Strengthen ties with surviving Old World Byzantium and gain #G Secret Transatlantic Eagle Accord#! for 25 years."
 oe_el2.3.title: "The Hesperides Forward Base"
 oe_el2.3.desc: "No transatlantic armada can project power into the Mediterranean without a fortified mid-ocean depot. The Admiralty lays three proposals before the crown covering the Azores, Madeira, Bermuda, and Gibraltar."
 oe_el2.3.a: "Acquire a Staging Island by Diplomatic Purchase (150g unowned / 650g AI)"
 oe_el2.3.a.tt: "Peacefully settles or purchases an unowned or AI-held staging island with an immediate core (never takes human-owned land)."
 oe_el2.3.b: "Issue Raiding Commissions and Reclamation Claims"
 oe_el2.3.b.tt: "Grants Nostos reclamation claims against foreign holders of the staging islands and #G Hesperides Copper-Clad Expedition Fleet#! for 15 years."
 oe_el2.3.c: "Fortify Our Held Staging Port with Dock and Granary"
 oe_el2.3.c.tt: "Constructs a dock and granary on your held forward island (or capital) at charter cost."
 oe_el2.4.title: "Imperium Bicephalum: Partition of Two Worlds"
 oe_el2.4.desc: "From New Constantinople on the Chesapeake to the dome of Hagia Sophia on the Bosphorus, the Imperial Eagle now spans two worlds. Yet the Atlantic resists direct administration from a single palace. The Senate awaits your decree on the empire's true seat and territorial partition."
 oe_el2.4.a: "Restore Constantinople, Keep Chesapeake Crown Demesne, and Charter Exarchatus Novae Elysiae"
 oe_el2.4.a.tt: "Moves the capital to #W Constantinople#! first, #G permanently retains Chesapeake, Nansemond, and Kiskiack as Western Crown Demesne#!, and charters remaining directly owned American lands as #T Exarchatus Novae Elysiae#! while keeping existing regional Exarchates under your crown."
 oe_el2.4.b: "Remain in New Constantinople and Charter Exarchatus Orientis"
 oe_el2.4.b.tt: "Keeps the imperial seat in America, charters Old World holdings as #T Exarchatus Orientis#!, and grants permanent #G Western Imperial Seat of New Constantinople#!."
 oe_el2.4.c: "Proclaim the Twin-Capital Imperium Bicephalum Federation"
 oe_el2.4.c.tt: "Retains both Constantinople and Chesapeake with dual proximity cores, adopts #T Imperium Bicephalum#!, and grants permanent #G Charter of the Twin-Capital Federation#!."
 oe_el2.5.title: "Longships on the Northern Shore: Vinland"
 oe_el2.5.desc: "Elysian patrol ships charting the icy fjords of Newfoundland have encountered an unexpected people: Icelandic-speaking descendants of Norse voyagers sailing dragon-prowed longships out of timbered havens. At the sight of the Imperial Eagle, their elders recall the ancient Varangian Guard of Miklagard."
 oe_el2.5.a: "Welcome the Christian Kin of Vinland"
 oe_el2.5.a.tt: "Establishes warm relations with Catholic Vinland and yields a trade gift."
 oe_el2.5.b: "Honor Their Ancestral Norse Sagas"
 oe_el2.5.b.tt: "Vinland embraces the ancient #Y Norse#! faith while our captains and scholars gain naval and cultural tradition."
 oe_el2.6.title: "The Varangian Blood Pact"
 oe_el2.6.desc: "Hearing that the imperial palace has risen anew in Chesapeake, Vinlandic axemen sail south in longships to swear the ancient Varangian oath once pledged on the Bosphorus."
 oe_el2.6.a: "Swear the Varangian Blood Pact"
 oe_el2.6.a.tt: "Gain #G Varangian Blood Pact of Vinland#! for 30 years, boosting heavy infantry, army tradition, furs, and fisheries."
 oe_el2.6.b: "Decline the Oath and Expand Maritime Trade"
 oe_el2.6.b.tt: "Gain gold and prestige without military entanglement."
 oe_el2.7.title: "Exarch of the Northern Seas: Vinland"
 oe_el2.7.desc: "As Elysian convoys and stations reach the Gulf of St. Lawrence, the chieftains of Vinland weigh their future: accept the imperial seal as an Exarchate or defend their northern independence."
 oe_el2.7.a: "Invest Vinland as an Imperial Exarchate (250 Gold)"
 oe_el2.7.a.tt: "Peacefully brings Vinland under the crown as #T Exarchatus Borealis#! (Imperial Exarchate)."
 oe_el2.7.b: "Assert Imperial Sovereignty by Arms"
 oe_el2.7.b.tt: "Grants a reclamation casus belli against Vinland and increases navy tradition."
 oe_el2.7.c: "Respect Vinland's Free Crown"
 oe_el2.7.c.tt: "Strengthens friendship with Vinland and grants prestige."
 oe_el2.8.title: "Markland Timber and Fur Charter"
 oe_el2.8.desc: "Vinlandic shipwrights know the finest northern pine stands and fur grounds. The Admiralty proposes a formal Markland Charter tying northern timber directly to imperial shipyards."
 oe_el2.8.a: "Grant the Markland Charter (150 Gold)"
 oe_el2.8.a.tt: "Gain #G Markland Timber and Fur Charter#! for 30 years, boosting shipbuilding, sailors, and lumber."
 oe_el2.8.b: "Levy Standard Northern Port Dues"
 oe_el2.8.b.tt: "Collect immediate customs revenue."
 oe_el2.9.title: "Bronze Shields in the Jungle: Spartania"
 oe_el2.9.desc: "An Elysian patrol ship blown south across the Gulf of Mexico has sighted an astonishing garrison beneath the limestone cliffs of northern Yucatan: phalanxes in bronze cuirasses bearing Lambda shields, hailing our sailors in Peloponnesian Greek. They are Spartania, descendants of a storm-scattered Laconian contingent."
 oe_el2.9.a: "Salute the Lost Laconian Legionaries"
 oe_el2.9.a.tt: "Establishes warm relations with Spartania and grants army tradition and prestige."
 oe_el2.9.b: "Dispatch Forges and 100 Gold to Fortify Spartania"
 oe_el2.9.b.tt: "Aids Spartania with funds and smiths, strengthening bilateral goodwill and imperial military prestige."
 oe_el2.10.title: "The Laconian Shield-Pact"
 oe_el2.10.desc: "The Ephors of Spartania send envoys north to Chesapeake, proposing a formal martial pact uniting Laconian phalanx discipline with Elysian firepower against continental and overseas rivals."
 oe_el2.10.a: "Seal the Laconian Shield-Pact"
 oe_el2.10.a.tt: "Gain #G Laconian Phalanx Alliance#! for 25 years, enhancing discipline, army tradition, and land morale."
 oe_el2.10.b: "Exchange Military Treatises Only"
 oe_el2.10.b.tt: "Gain army tradition and prestige."
 oe_el2.11.title: "Charter the Laconian Military Exarchate"
 oe_el2.11.desc: "With storm clouds gathering across Mesoamerica, the assembly of Spartania offers to place its shields under the Elysian Emperor as a dedicated military Exarchate guarding the southern Gulf."
 oe_el2.11.a: "Invest Spartania as a Military Exarchate (250 Gold)"
 oe_el2.11.a.tt: "Peacefully charters Spartania as a loyal Imperial Exarchate while preserving its iconic name."
 oe_el2.11.b: "Honor Spartania as a Free Martial Ally"
 oe_el2.11.b.tt: "Gain prestige and army tradition."
 oe_el2.12.title: "The Spartan Phalanx and Tenochtitlan"
 oe_el2.12.desc: "Spartanian outriders have crossed the mountain passes to behold the lake-metropolis of Tenochtitlan. Obsidian-armed warriors guard its causeways; the empire must choose between a joint campaign into the Valley of Mexico or a grand commercial accord."
 oe_el2.12.a: "Launch a Joint Valley of Mexico Expedition"
 oe_el2.12.a.tt: "Grants a reclamation casus belli against the holder of Tenochtitlan and 15 years of #G Laconian Phalanx Alliance#!."
 oe_el2.12.b: "Sign the Accord of Silver and Obsidian"
 oe_el2.12.b.tt: "Improves relations with the holder of Tenochtitlan and grants #G Accord of Silver and Obsidian#! for 20 years plus gold."
 oe_el2.13.title: "[ROOT.GetCountry.GetCapital.GetName] Mulberry Silk Ergasterion"
 oe_el2.13.desc: "Master weavers who carried silkworm eggs aboard the Exodus fleet have succeeded in cultivating silk in the red mulberry groves around [ROOT.GetCountry.GetCapital.GetName]. Nova Elysia can now reel its own imperial silk and weave purple brocade for markets across the ocean."
 oe_el2.13.a: "Commission the Silk Ergasterion in the Capital (120 Gold)"
 oe_el2.13.a.tt: "Unlocks the #T Elysian Imperial Silk Ergasterion#! (two ~30% margin methods) and builds one immediately in the capital."
 oe_el2.13.b: "License the Silk Craft to Burgher Guilds"
 oe_el2.13.b.tt: "Unlocks the #T Elysian Imperial Silk Ergasterion#! across the realm and collects guild charter fees."
 oe_el2.14.title: "[ROOT.GetCountry.GetCapital.GetName] Greek-Fire Arsenal"
 oe_el2.14.desc: "Combining abundant pine tar, copper, and saltpeter with ancient incendiary craft, imperial engineers in [ROOT.GetCountry.GetCapital.GetName] unite bronze siphon ordnance and copper-sheathed shipbuilding under one coastal arsenal."
 oe_el2.14.a: "Commission the Coastal Greek-Fire Arsenal (150 Gold)"
 oe_el2.14.a.tt: "Unlocks the #T New Constantinople Greek-Fire Arsenal#! (two 30% margin methods) and builds one immediately on the coast."
 oe_el2.14.b: "Distribute Arsenal Blueprints to Provincial Yards"
 oe_el2.14.b.tt: "Unlocks the #T New Constantinople Greek-Fire Arsenal#! for construction and increases navy tradition."
 oe_el2.15.title: "Grand Council of the Five Exarchates"
 oe_el2.15.desc: "From boreal fjords and Caribbean anchorages to the great plains and Andean peaks, five or more American Exarchs gather in the purple hall of New Constantinople. Nova Elysia's continental order stands triumphant."
 oe_el2.15.a: "Establish the Permanent Grand Council of Exarchates"
 oe_el2.15.a.tt: "Gain permanent #G Grand Council of the Five Exarchates#! boosting loyalty, diplomatic capacity, trade income, and sailors."
 oe_el2.15.b: "Consolidate Maritime Revenues into the Treasury"
 oe_el2.15.b.tt: "Gain 400 gold, prestige, and 25 years of the Grand Charter modifier."
 oe_el2.16.title: "Old World Restored: Ancestral Exarchates"
 oe_el2.16.desc: "Exarchate banners rise once more over the historic cities of Thrace, Anatolia, Ravenna, and Alexandria. The exiles who once fled across the Atlantic now restore Roman provincial rule across the Mediterranean."
 oe_el2.16.a: "Promulgate the Mediterranean Exarchate Code"
 oe_el2.16.a.tt: "Gain permanent #G Restored Old World Exarchate System#! enhancing assimilation, max control, and loyalty."
 oe_el2.16.b: "Invest Mediterranean Reconstruction Dues"
 oe_el2.16.b.tt: "Gain 350 gold, cultural tradition, and 25 years of Old World Exarchate bonuses."
 oe_el2.90.title: "[Readout] Nova Elysia 2.0 Live Telemetry"
 oe_el2.90.desc: "#T Nova Elysia 2.0 Live Telemetry (Read-Only):#!\n- Active Imperial Exarchates: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_exarchate_count_val')|0]#! | Americas: #G [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_amer_exarch_count_val')|0]#! / 6 | Old World: #G [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_old_exarch_count_val')|0]#! / 4\n- Elysian Silk Ergasteria: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_silk_count_val')|0]#! | Greek-Fire Arsenals: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_arsenal_count_val')|0]#!\n- Great Reunion: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_reunion_done_val')|0]#! | Hesperides Springboard: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_springboard_done_val')|0]#! | Bicephalum Path (0/1 East/2 West/3 Twin): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_bicephalum_done_val')|0]#!\n- Vinland State (0/1 Met/2 Pact/3 Exarch): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_vinland_state_val')|0]#! | Spartania State (0/1 Met/2 Ally/3 Exarch): #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_el2_spartania_state_val')|0]#!"
 oe_el2.90.a: "Close Telemetry Ledger"
