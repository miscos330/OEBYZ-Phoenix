 oe_el2_dec_imperium_bicephalum_partition.title: "Proclaim the Imperium Bicephalum Partition"
 oe_el2_dec_imperium_bicephalum_partition.desc: "Constantinople stands once more beneath the Imperial Eagle. Convene the Senate to decide the constitutional architecture of the transatlantic empire: return the throne to the Bosphorus with a Grand Exarchate in Elysia, rule from New Constantinople with an Exarchate of the Orient, or proclaim the Twin-Capital Federation."
 oe_el2_dec_imperium_bicephalum_partition.a: "Convene the Grand Partition Council"
 oe_el2_dec_imperium_bicephalum_partition_tt: "Opens the #T Imperium Bicephalum Partition#! decree with three distinct territorial and constitutional paths."
