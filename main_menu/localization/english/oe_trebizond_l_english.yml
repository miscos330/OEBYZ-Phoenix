l_english:
 oe_tre_rebuke: "Condemned our emperor's bigamy"
 oe_tre_gifts: "Sent gifts to make peace at our court"
 oe_tre_guard: "Sent mercenaries to hold our capital"
 oe_tre_protest: "Protested against our new ruler"
 oe_tre_recognised: "Recognised our new ruler"
 oe_tre_meddling: "Secretly aided rebels against us"
 oe_tre_wedding: "Sent gifts to honour our throne"
 oe_tre_custody: "Keeps a claimant to our throne in custody for us"
 oe_tre_snub: "Slighted our request"
 oe_tre_mediation: "Mediated our dispute with Genoa"
 oe_tre_common_cause: "Made common cause with us against Genoa"
 oe_tre_genoa_foe: "Took sides against us over Trebizond"
 oe_tre_kin: "Kin of our ruling house"
 oe_tre_courtesy: "Treated us with courtesy"
 oe_tre_title_lapse: "Broke the promise of a dignity"
 STATIC_MODIFIER_NAME_oe_tre_byz_guard: "Byzantine Mercenaries"
 STATIC_MODIFIER_NAME_oe_tre_leonkastron: "Genoese Leontokastron"
 STATIC_MODIFIER_NAME_oe_tre_kinship: "Kin on the Black Sea"
 OE_TRE_RULER: "[GetCountry('TRE').GetGovernment.GetRuler.GetName]"
 OE_TRE_RULER_NONE: "—"
 OE_TRE_CW: "The court is caught up in civil war and has little to spare for distant affairs."
 OE_TRE_EMPTY_CW: ""
 OE_TRE_GAL: "We ourselves are facing the Genoese across the Golden Horn."
 OE_TRE_EMPTY_GAL: ""
 OE_TRE_E4MICH: "Michael Megas Komnenos, whom we sent, was seized by the Laz lords as soon as the ships put in, and is held at Limnia."
 OE_TRE_EMPTY_E4: ""
 OE_TRE_COURT_K: "John VI Kantakouzenos means to use the matter to bring Trebizond over to the Kantakouzenoi."
 OE_TRE_COURT: "The court is divided on the matter."
 OE_TRE_WARDS: "The prince grew up in our palace and sees us as family."
 OE_TRE_EMPTY_WARDS: ""
 OE_TRE_TIER_HIGH: "Our influence in Trebizond is great (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!): the new ruler and the great families both lean on us."
 OE_TRE_TIER_MID: "We have a voice in Trebizond (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)."
 OE_TRE_TIER_LOW: "Our influence in Trebizond is slight (#Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)."
 oe_tre.1.t: "The Princess Set Aside"
 oe_tre.1.desc: "#F In July 1339 Basil, emperor of Trebizond, openly married a mistress, Irene of Trebizond, while the empress Irene, a daughter of Andronikos III, still lived. Patriarch John XIV is said to have taken the empress's side.#!\n\nNews from Trebizond: Emperor Basil has taken the mistress as a second wife, and Your Majesty's daughter [SCOPE.sCharacter('oe_tre_irene').GetName] is shunned at court. The bigamy has caused a scandal in Trebizond and in Constantinople alike."
 oe_tre.1.desc2: "#F In July 1339 Basil, emperor of Trebizond, openly married a mistress, Irene of Trebizond, while the empress Irene, a daughter of Andronikos III, still lived. Patriarch John XIV is said to have taken the empress's side.#!\n\nNews from Trebizond: Emperor Basil has taken the mistress as a second wife, and [SCOPE.sCharacter('oe_tre_irene').GetName], a daughter of the late emperor, is shunned at court. The bigamy has caused a scandal in Trebizond and in Constantinople alike."
 oe_tre.1.a: "Have the patriarch condemn the bigamy"
 oe_tre.1.a.tt: "Trebizond: opinion of us #R −15#! (fading by #Y 3#! a year)\nOur influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.1.b: "Send gifts and urge Basil to think again"
 oe_tre.1.b.tt: "Trebizond: opinion of us #G +10#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.1.c: "Stay out of Trebizond's family affairs"
 oe_tre.1.c.tt: "Our influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.2.t: "The Empress of Trebizond"
 oe_tre.2.desc: "#F Basil died suddenly in April 1340, and people whispered that the empress had poisoned Basil. The empress Irene held the citadel while the Scholarioi held out against the new regime in the monastery of St Eugenios. The empress sent the rival, Irene of Trebizond, and Basil's two sons to Constantinople, as hostages, some historians say, or as wards.#!\n\n[SCOPE.sCharacter('oe_tre_irene').GetName] now rules Trebizond, but the great families of the city will not bow, and the #bold #color_yellow Scholarioi#!#! defy the empress openly. Basil's widow and children have arrived in the capital and been lodged in the palace."
 oe_tre.2.a: "Send mercenaries to help the empress hold the city"
 oe_tre.2.a.tt: "Trebizond gains [ShowModifier('oe_tre_byz_guard')] for #Y 24#! months\nTrebizond: opinion of us #G +15#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.2.b: "Keep the hostages and wait"
 oe_tre.2.b.tt: "Basil's widow and children stay in Constantinople"
 oe_tre.2.c: "Raise the children as princes"
 oe_tre.2.c.tt: "Our influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\nWhen the prince goes home one day, our influence in Trebizond another #G +10#!"
 oe_tre.3.t: "A Husband for the Empress"
 oe_tre.3.desc: "#F Empress Irene asked Andronikos III to choose a husband from the Byzantine nobility. The emperor was preparing the Epirus campaign and never answered; in 1341 the regents in the capital chose Basil's uncle, Michael Megas Komnenos.#!\n\nA messenger from [SCOPE.sCharacter('oe_tre_irene').GetName] has reached the palace: the empress needs a husband who can keep the great families in check, and asks Your Majesty to choose one from the nobility of the empire. But the war in Epirus presses."
 oe_tre.3.desc2: "#F Empress Irene asked Andronikos III to choose a husband from the Byzantine nobility. The emperor was preparing the Epirus campaign and never answered; in 1341 the regents in the capital chose Basil's uncle, Michael Megas Komnenos.#!\n\nA messenger from [SCOPE.sCharacter('oe_tre_irene').GetName] has reached the palace: the empress needs a husband who can keep the great families in check, and asks the court in the capital to choose one from the nobility of the empire."
 oe_tre.3.a: "Send Michael Megas Komnenos with three warships"
 oe_tre.3.a.tt: "Our influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_mich').GetName] sets out for Trebizond; whether a wedding and a throne follow depends on the city and on our influence"
 oe_tre.3.b: "Send money and guards only"
 oe_tre.3.b.tt: "Our influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\nTrebizond's [ShowModifier('oe_tre_byz_guard')] lasts #Y 12#! months longer (or is gained for #Y 12#! months)"
 oe_tre.3.c: "Leave it for now"
 oe_tre.3.c.tt: "Our influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.4.t: "Fire in the Suburbs"
 oe_tre.4.desc: "#F In July 1341 Turks burned the suburbs of Trebizond; the empress's Byzantine mercenaries fled without a fight, and plague followed. Basil's sister Anna Anachoutlou, raised up by the Laz, entered the city as empress; that same month Michael Megas Komnenos arrived with three warships and was seized the very night.#!\n\nThe suburbs of Trebizond are in flames and the city is in turmoil. [SCOPE.sCharacter('oe_tre_anna').GetName], raised up by the Laz, has entered the city as empress; [SCOPE.sCharacter('oe_tre_irene').GetName] has lost the throne and come back to Constantinople on a western ship. [GetCountry('BYZ').Custom('OeTreE4Mich')]"
 oe_tre.4.desc2: "#F In July 1341 Turks burned the suburbs of Trebizond; the empress's Byzantine mercenaries fled without a fight, and plague followed. Basil's sister Anna Anachoutlou, raised up by the Laz, entered the city as empress; that same month Michael Megas Komnenos arrived with three warships and was seized the very night.#!\n\nAfter the fire, the warships of Michael Megas Komnenos arrived, the Turks drew off, and the great families put their ambitions away. [SCOPE.sCharacter('oe_tre_irene').GetName] has married Michael, who is now emperor of Trebizond."
 oe_tre.4.desc3: "#F In July 1341 Turks burned the suburbs of Trebizond; the empress's Byzantine mercenaries fled without a fight, and plague followed. Basil's sister Anna Anachoutlou, raised up by the Laz, entered the city as empress; that same month Michael Megas Komnenos arrived with three warships and was seized the very night.#!\n\nThe fire has left Trebizond in ruins, but [SCOPE.sCharacter('oe_tre_r').GetName] still holds the throne: the one the Laz wanted to raise up is gone."
 oe_tre.4.a: "Welcome the princess home and protest to the new empress"
 oe_tre.4.a.tt: "Trebizond: opinion of us #R −20#! (fading by #Y 2#! a year)\nOur influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.4.b: "Recognise Anna"
 oe_tre.4.b.tt: "Trebizond: opinion of us #G +20#! (fading by #Y 2#! a year)\nOur influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.4.c: "Secretly support the exiled Scholarioi"
 oe_tre.4.c.tt: "Trebizond: opinion of us #R −10#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.4.d: "Send gifts of congratulation"
 oe_tre.4.d.tt: "Trebizond: opinion of us #G +20#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.4.e: "Congratulations will do"
 oe_tre.4.f: "Send help to rebuild Trebizond"
 oe_tre.4.f.tt: "Trebizond: opinion of us #G +20#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.4.g: "A letter of sympathy will do"
 oe_tre.5.t: "Envoys of the Scholarioi"
 oe_tre.5.desc: "#F In August 1342 Niketas Scholares and others came to Constantinople on a Venetian ship to fetch John, Michael's son. John hired three Genoese galleys, entered the city in September and took the throne; Anna was strangled. Historians disagree on whether the imperial court openly backed the venture.#!\n\nEnvoys of the #bold #color_yellow Scholarioi#!#! have reached the capital. They will no longer serve [SCOPE.sCharacter('oe_tre_r').GetName] and want [SCOPE.sCharacter('oe_tre_j3').GetName] to come home and take the throne of Trebizond. [GetCountry('BYZ').Custom('OeTreCw')]"
 oe_tre.5.a: "Back it openly: give ships and soldiers"
 oe_tre.5.a.tt: "Our influence in Trebizond #G +15#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_j3').GetName] is sure to take the city and the throne (in #Y 20#! days)"
 oe_tre.5.b: "Let them hire Genoese ships themselves"
 oe_tre.5.b.tt: "Our influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_j3').GetName] sets out alone; in #Y 20#! days we will know. The chance of success follows our influence in Trebizond (now #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_succ_ch')|0]%#!); failure costs #R 5#! influence"
 oe_tre.5.c: "Keep John here"
 oe_tre.5.c.tt: "Trebizond: opinion of us #G +10#! (fading by #Y 2#! a year)\nOur influence in Trebizond #R −15#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_j3').GetName] stays in the empire, a candidate for the throne of Trebizond later"
 oe_tre.6.t: "Father and Son"
 oe_tre.6.desc: "#F In May 1344 the Scholarioi released the imprisoned Michael and made Michael emperor, shutting John III in a monastery; soon Michael sent the son to Constantinople, and on to Adrianople to be kept under guard.#!\n\nTrebizond has changed hands again: the #bold #color_yellow Scholarioi#!#! released [SCOPE.sCharacter('oe_tre_mich').GetName] from Limnia and made the old man emperor, and have sent [SCOPE.sCharacter('oe_tre_j3').GetName] to Constantinople. The new emperor asks us to keep the son under guard."
 oe_tre.6.desc2: "#F In May 1344 the Scholarioi released the imprisoned Michael and made Michael emperor, shutting John III in a monastery; soon Michael sent the son to Constantinople, and on to Adrianople to be kept under guard.#!\n\nTrebizond has changed hands again: the #bold #color_yellow Scholarioi#!#! sent to the capital for [SCOPE.sCharacter('oe_tre_mich').GetName], made the old man emperor, and have sent [SCOPE.sCharacter('oe_tre_j3').GetName] to us. The new emperor asks us to keep the son under guard."
 oe_tre.6.a: "Keep John III at Adrianople, as Michael asks"
 oe_tre.6.a.tt: "Trebizond: opinion of us #G +15#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_j3').GetName] stays in the empire"
 oe_tre.6.b: "Treat John III with honour at court"
 oe_tre.6.b.tt: "Trebizond: opinion of us #R −10#! (fading by #Y 2#! a year)\n[SCOPE.sCharacter('oe_tre_j3').GetName] stays at court; if we put John III back on the throne later, our influence another #G +5#!"
 oe_tre.6.c: "Ask Michael to pay for the custody"
 oe_tre.6.c.tt: "Trebizond: opinion of us #R −5#! (fading by #Y 2#! a year)\nOur influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_j3').GetName] stays in the empire"
 oe_tre.7.t: "Genoa's Revenge"
 oe_tre.7.desc: "#F In 1348 the Genoese seized Kerasous; the next May the fleet of Caffa destroyed Trebizond's small navy and the megas doux John Kabasites fell. The peace gave Leontokastron to Genoa.#!\n\nGenoa is at war with Trebizond, and the fleet of Caffa has destroyed Trebizond's warships. Trebizond has had to give up Leontokastron outside its walls ([ShowModifier('oe_tre_leonkastron')], #Y 20#! years) and writes to us for help. [GetCountry('BYZ').Custom('OeTreGal')]"
 oe_tre.7.a: "Mediate"
 oe_tre.7.a.tt: "Trebizond's [ShowModifier('oe_tre_leonkastron')] is cut to #Y 10#! years\nTrebizond: opinion of us #G +10#! (fading by #Y 2#! a year)\nOur influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.7.b: "Make common cause with Trebizond"
 oe_tre.7.b.tt: "Trebizond: opinion of us #G +20#! (fading by #Y 2#! a year)\nGenoa: opinion of us #R −15#! (fading by #Y 1#! a year)\nOur influence in Trebizond #G +10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.7.c: "Watch from across the water"
 oe_tre.7.c.tt: "Our influence in Trebizond #R −5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)"
 oe_tre.8.t: "The Prince Raised in Constantinople"
 oe_tre.8.desc: "#F In December 1349 Basil's son John came home from Constantinople to Trebizond and was crowned in the church of St Eugenios the next January, taking the name Alexios. John VI Kantakouzenos helped to put the boy on the throne, to keep out Michael and John III, who were friends of the Palaiologoi.#!\n\n[SCOPE.sCharacter('oe_tre_cand').GetName] grew up in the capital and is now #Y [SCOPE.sCharacter('oe_tre_cand').GetAgeInYears]#!. The great families of Trebizond are tired of [SCOPE.sCharacter('oe_tre_r').GetName] and send to ask: will the empire send Basil's son home? [GetCountry('BYZ').Custom('OeTreCourt')] [GetCountry('BYZ').Custom('OeTreWards')]"
 oe_tre.8.a: "Send the prince home with a fleet and promise a bride of our family"
 oe_tre.8.a.tt: "Our influence in Trebizond #G +15#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_cand').GetName] takes the throne of Trebizond in #Y 20#! days\nA match is made: Theodora of the Kantakouzenoi while John VI reigns, otherwise a daughter of the reigning house; the wedding follows when the groom is #Y 13#!"
 oe_tre.8.b: "Let the Scholarioi take the prince home themselves"
 oe_tre.8.b.tt: "Our influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_cand').GetName] takes the throne of Trebizond in #Y 20#! days"
 oe_tre.8.c: "Put John III back on the throne instead"
 oe_tre.8.c.tt: "Our influence in Trebizond #G +5#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\nAnother #G +5#! if John III was honoured at court\n[SCOPE.sCharacter('oe_tre_j3').GetName] takes the throne of Trebizond in #Y 20#! days; [SCOPE.sCharacter('oe_tre_cand').GetName] stays in the capital"
 oe_tre.8.d: "Keep the prince here and stay out of it"
 oe_tre.8.d.tt: "Our influence in Trebizond #R −10#! (now #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_inf_v')|0]#!)\n[SCOPE.sCharacter('oe_tre_cand').GetName] stays in the capital, perhaps a card to play one day; the storyline ends here"
 oe_tre.9.t: "Crowned at St Eugenios"
 oe_tre.9.desc: "#F On 21 January 1350 Alexios III, not yet twelve, was crowned in the church of St Eugenios, with the boy's mother Irene present. The next year Theodora of the Kantakouzenoi was married to the young emperor.#!\n\n[SCOPE.sCharacter('oe_tre_alx_s').GetName] has been crowned emperor of Trebizond in the church of St Eugenios. In the [Concept('oe_tu_family','family of kings')|e], Trebizond is the empire's 'son'. [GetCountry('BYZ').Custom('OeTreTier')] How shall we treat the new emperor?"
 oe_tre.9.a: "Take Trebizond as a tributary"
 oe_tre.9.a.tt: "Trebizond has a #G [GetCountry('BYZ').MakeScope.ScriptValue('oe_tre_trib_ch')|0]%#! chance to accept becoming our tributary; the ladder of subjects takes over\nIf refused: Trebizond's opinion of us #R −10#!, and we become kin and allies instead"
 oe_tre.9.b: "Become kin and allies"
 oe_tre.9.b.tt: "Trebizond: opinion of us #G +25#! (fading by #Y 1#! a year)\nWe gain [ShowModifier('oe_tre_kinship')] for #Y 10#! years\nAn alliance with Trebizond if there is none\nIf the new emperor is still a child: a [Concept('oe_tu_dignity','dignity')|e] can be conferred at coming of age"
 oe_tre.9.c: "Confer a dignity"
 oe_tre.9.c.tt: "[SCOPE.sCharacter('oe_tre_alx_s').GetName] receives the [Concept('oe_tu_dignity','dignity')|e] of Despot if possible, else Protosebastos, paid in prestige and [oe_tu_authority|e] as usual"
 oe_tre.9.d: "Courtesies only"
 oe_tre.9.d.tt: "Trebizond: opinion of us #G +10#! (fading by #Y 2#! a year)"
 oe_tre.10.t: "The Young Emperor Comes of Age"
 oe_tre.10.desc: "#F In 1282 Michael VIII gave John II of Trebizond the title of despot, together with the hand of Michael's daughter Eudokia.#!\n\nWhen [SCOPE.sCharacter('oe_tre_alx_s').GetName] was crowned we promised a [Concept('oe_tu_dignity','dignity')|e] at coming of age. The emperor of Trebizond is now an adult."
 oe_tre.10.a: "Confer the title of Despot"
 oe_tre.10.a.tt: "[SCOPE.sCharacter('oe_tre_alx_s').GetName] receives the [Concept('oe_tu_dignity','dignity')|e] of Despot; costs #R 20#! prestige and #R 8#! [oe_tu_authority|e]"
 oe_tre.10.b: "Confer the title of Protosebastos"
 oe_tre.10.b.tt: "[SCOPE.sCharacter('oe_tre_alx_s').GetName] receives the [Concept('oe_tu_dignity','dignity')|e] of Protosebastos; costs #R 10#! prestige and #R 4#! [oe_tu_authority|e]"
 oe_tre.10.c: "Let it lapse"
 oe_tre.10.c.tt: "Trebizond: opinion of us #R −10#! (fading by #Y 2#! a year)"
 oe_tre.11.t: "Death of the Princess"
 oe_tre.11.desc: "#F Historically Irene held power for more than a year after Basil's death and, deposed in 1341, returned to Constantinople.#!\n\nGrievous news from Trebizond: the princess [SCOPE.sCharacter('oe_tre_irene').GetName] has died in a palace coup at Trebizond."
 oe_tre.11.a: "Demand that Trebizond atone"
 oe_tre.11.a.tt: "Trebizond: opinion of us #R −20#! (fading by #Y 2#! a year)\nThe storyline ends here"
 oe_tre.11.b: "Mourn the princess and let it rest"
 oe_tre.11.b.tt: "Trebizond: opinion of us #G +10#! (fading by #Y 2#! a year)\nThe storyline ends here"
