l_english:
 oe_osmaris_basil_name: "Basil"
 oe_osmaris_lightning_merchant: "the Lightning Merchant"
 oe_flavor_byz.1007.t: "Osmaris: Basil the Lightning Merchant"
 oe_flavor_byz.1007.d: "(Original name: Bayezid I)\n\nBasil of the House of Osmaris has always found the quays more interesting than the training ground. He can spend half a day among sacks of spice and bolts of cloth, listening to shipmasters debate the winds and merchants compare prices. When others discuss a city's walls, he asks first about its roads, ferries, and markets.\n\nThat curiosity has become a trading network stretching across the empire. Basil hires agents in the ports and establishes warehouses inland, linking caravans with coastal shipping. A letter from the capital can travel through familiar counting houses and waystations to the empire's farthest reaches. He insists upon punctual deliveries and accounts settled before nightfall, yet will contract a whole season's freight while others are still hesitating. His associates call him the Lightning Merchant, with equal measures of admiration and complaint.\n\nLaden wagons, crowded holds, and thickening account books now testify to his ability. His routes can bring the empire greater wealth. Whether that wealth should remain in the markets or pass first through the tax collector's hands is for the Emperor to decide."
 oe_flavor_byz.1007.a: "Encourage his trade."
 oe_flavor_byz.1007.a.tt: "Gain #Y Basil's Imperial Trade Network#! for #G 20 years#!: Selling Efficiency #G +10%#!.\n$oe_osmaris_house_reward_50_tt$\nUnlock the #Y Ottoman Company#! in the Golden Horn district of Constantinople and immediately complete #G level 1#! for free."
 oe_flavor_byz.1007.b: "Collect more taxes from this commerce."
 oe_flavor_byz.1007.b.tt: "Gain #Y Basil's Commercial Tax Agreements#! for #G 20 years#!: Burghers Maximum Tax #G +5%#!.\n$oe_osmaris_house_reward_50_tt$\nUnlock the #Y Ottoman Company#! in the Golden Horn district of Constantinople and immediately complete #G level 1#! for free."
 oe_osmaris_house_reward_50_tt: "If Osmaris is already a noble house, it gains #G 50 Influence#!. Otherwise, it becomes a noble house and receives #G 1#! additional noble-house place, granted only once to this family."
 oe_flavor_byz.1007.lapsed: "The commercial proposal can no longer proceed."
 oe_flavor_byz.1007.lapsed.tt: "Basil's circumstances or the family's status have changed. No modifier, Influence, or capacity reward is granted."
 oe_flavor_byz.1007.historical_info: "Bayezid I was born in 1354 and ruled the Ottoman state from 1389 to 1402. Known as the Thunderbolt, he expanded in the Balkans and Anatolia and defeated a crusading army at Nicopolis in 1396. Timur defeated and captured him at Ankara in 1402. This event reimagines his rapid decision-making as the talent of a Roman merchant."
 oe_flavor_byz.1008.t: "Osmaris: The Lightning Merchant's Ransom"
 oe_flavor_byz.1008.d: "(Original name: Bayezid I)\n\nSince the court endorsed Basil's commercial proposal, his warehouses and caravans have become ever more closely connected. He still refuses to remain in a counting house awaiting reports, preferring to inspect frontier trade in person. This time, however, familiar roads have led him into territory held by Timur's armies.\n\nA returning servant brings dreadful news: the caravan has been intercepted, its goods seized, and Basil taken captive. The merchant famed for swift decisions cannot now outrun his guards' blades. An envoy soon reaches the capital with a demand: a ransom equal to three months of imperial income will secure his safe return.\n\nLosses in a ledger may be repaired. A life cannot. Should the treasury open its doors for this misfortune of the House of Osmaris?"
 oe_flavor_byz.1008.a: "What a tragedy."
 oe_flavor_byz.1008.a.tt: "#R Basil dies in captivity.#!"
 oe_flavor_byz.1008.b: "We can pay the ransom."
 oe_flavor_byz.1008.b.tt: "The treasury loses #R three months of total national income#!: #R [SCOPE.GetValue('oe_osmaris_basil_ransom')|2]#! gold.\n#G Basil is released alive.#!"
 oe_flavor_byz.1008.lapsed: "This ransom demand has arrived too late."
 oe_flavor_byz.1008.lapsed.tt: "Basil no longer meets the conditions. No ransom is charged and no death is processed again."
 oe_flavor_byz.1008.historical_info: "Timur defeated and captured Bayezid I at the Battle of Ankara in 1402. Bayezid died in captivity the following year. The intercepted trading caravan and an Eastern Roman ransom securing Basil's release are alternate-history branches created for this mod."
 STATIC_MODIFIER_NAME_oe_osmaris_basil_trade_network: "Basil's Imperial Trade Network"
 STATIC_MODIFIER_DESC_oe_osmaris_basil_trade_network: "Warehouses, caravans, and coastal routes work in concert, while informed agents help goods find buyers."
 STATIC_MODIFIER_NAME_oe_osmaris_basil_customs: "Basil's Commercial Tax Agreements"
 STATIC_MODIFIER_DESC_oe_osmaris_basil_customs: "Agreements along the trading routes bring newly growing commercial wealth into the imperial tax accounts."
 oe_osmaris_basil_introduced: "Basil the Lightning Merchant has appeared"
 oe_osmaris_basil_trade_done: "Basil's commercial proposal has been decided"
 oe_osmaris_basil_capture_presented: "Basil's ransom demand has arrived"
 oe_osmaris_basil_capture_resolved: "Basil's captivity has been resolved"
 oe_osmaris_basil_can_ransom: "The treasury can afford Basil's ransom"
