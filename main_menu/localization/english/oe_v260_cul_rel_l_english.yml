l_english:
 AUTO_MODIFIER_NAME_oe_assim_tier1_civic_hub: "Civic Educational & Administrative Hub"
 AUTO_MODIFIER_DESC_oe_assim_tier1_civic_hub: "Connected roads, firm control, and urban schools or administrative halls steadily draw residents into the imperial civic culture."
 AUTO_MODIFIER_NAME_oe_assim_tier1b_metropolis_academy: "Imperial Metropolis Academy Surge"
 AUTO_MODIFIER_DESC_oe_assim_tier1b_metropolis_academy: "High-control metropolises anchored by universities or grand academies serve as flagship centers of cultural integration."
 AUTO_MODIFIER_NAME_oe_assim_tier2_port_frontier: "Maritime Entrepot or Frontier Settlement"
 AUTO_MODIFIER_DESC_oe_assim_tier2_port_frontier: "Thriving sea ports with strong market access and active frontier settlements attract migrants and accelerate cultural convergence."
 AUTO_MODIFIER_NAME_oe_assim_tier3_terrain_friction: "Distant Frontier Terrain Friction"
 AUTO_MODIFIER_DESC_oe_assim_tier3_terrain_friction: "Distant rural backcountry or unroaded rugged terrain outside the capital region slows cultural assimilation until roads and control are established."
 AUTO_MODIFIER_NAME_oe_assim_tier4_faith_unrest_drag: "Unrest & Confessional Assimilation Drag"
 AUTO_MODIFIER_DESC_oe_assim_tier4_faith_unrest_drag: "Discontented communities or unaligned faiths under weak central control resist cultural assimilation until pacified or converted."
 AUTO_MODIFIER_NAME_oe_assim_track_b_foederati_city: "Foederati Cosmopolitan Metropolis"
 AUTO_MODIFIER_DESC_oe_assim_track_b_foederati_city: "An accepted minority city safeguarded under Cosmopolitan Foederati charters yields stronger workshops, commerce, and reliable manpower."
 AUTO_MODIFIER_NAME_oe_assim_track_b_foederati_rural: "Foederati Rural Autonomy"
 AUTO_MODIFIER_DESC_oe_assim_track_b_foederati_rural: "Accepted minority villages governed under local custom lower separatism and supply steady levies while gently preserving their heritage."
 AUTO_MODIFIER_NAME_oe_assim_tier2_unitary_romanitas: "Unitary Romanitas Civic Fusion"
 AUTO_MODIFIER_DESC_oe_assim_tier2_unitary_romanitas: "Under the Constitutio Antoniniana unitary charter, provincial derived Roman communities merge rapidly into the imperial primary culture."
 AUTO_MODIFIER_NAME_oe_assim_pace_historical_auto: "Game Rule: Historical Slow Assimilation & Conversion"
 AUTO_MODIFIER_DESC_oe_assim_pace_historical_auto: "Opening game rule setting: deepens demographic inertia for cultural assimilation (-25%) and religious conversion (-20%)."
 AUTO_MODIFIER_NAME_oe_assim_pace_active_auto: "Game Rule: Active Romanization & Conversion"
 AUTO_MODIFIER_DESC_oe_assim_pace_active_auto: "Opening game rule setting: accelerates global cultural assimilation (+35%) and religious conversion (+25%)."
 oe_rome_sub_edict_conversion: "Imperial Edict of Religious Conformity"
 oe_rome_sub_edict_conversion_desc: "Spend #R 10#! [oe_tu_authority|e] to promulgate an imperial edict bringing a loyal provincialised subject into the empire's state faith. Increases the subject's liberty desire by #R +25#! and has a #Y 10-year#! cooldown."
 oe_rome_sub_edict_conversion_act: "Issue Conformity Edict to [SCOPE.sCountry('recipient').GetName]"
 oe_rome_sub_edict_conversion_effect_text: "[SCOPE.sCountry('actor').GetName] issues an imperial edict aligning [SCOPE.sCountry('recipient').GetName] with the imperial faith."
 oe_rome_sub_edict_conversion_effect_text_past: "[SCOPE.sCountry('recipient').GetName] adopted the imperial faith by imperial edict."
 oe_rome_sub_edict_conversion_auth_tt: "Pillars of the Empire holds at least #Y 10#! Imperial Authority"
 oe_rome_sub_edict_conversion_effect_tt: "Spend #R 10#! Imperial Authority, convert [SCOPE.sCountry('recipient').GetName] to our state religion, and add #R +25#! Liberty Desire."
 PROPOSE_oe_rome_sub_edict_conversion: "Promulgate an Imperial Edict of Religious Conformity for $RECIPIENT$?\n\n$INFO$"
