 ACTION_oe_rome_sub_edict_conversion_PERFORMED_ON_US_EFFECTS: "[SCOPE.sCountry('actor').GetName] has promulgated an Imperial Edict of Religious Conformity upon us, aligning our state faith with [SCOPE.sCountry('actor').GetReligion.GetName]."
