 oe_declare_victory_over_islam.b: "Proclaim a New Edict of Milan across the East."
 OE_RELIGIOUS_VICTORY_TOLERANCE_EFFECT: "Forego the missionary wave and instead grant the #Y Millet Courts & Tolerance Charter#! for #Y 30 years#! (#G +1.5#! Heathen Tolerance, #G +6%#! Tax Efficiency, #R -20%#! Heathen Conversion Speed) and #G +5#! Stability, while still unlocking the imperial reform and Mecca law options."
 oe_as2_relaunch_incomplete_movements_tt: "Clear active wave cooldowns and #G immediately re-launch#! any expired Romanization or Pentarchy movements in eligible regions that still hold at least #Y 25%#! source population."
