 WE_PERFORM_oe_rome_sub_edict_conversion_ACTION_EFFECTS: "We have promulgated an Imperial Edict of Religious Conformity, bringing [SCOPE.sCountry('recipient').GetName] into the [SCOPE.sCountry('actor').GetReligion.GetName] faith."
 WE_PERFORM_oe_rome_sub_edict_conversion_ACTION_FLAVOR: "The empire speaks with one creed."
