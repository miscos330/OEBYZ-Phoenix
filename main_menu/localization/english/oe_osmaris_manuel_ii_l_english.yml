l_english:
 oe_osmaris_manuel_ii_name: "Manuel II"
 oe_osmaris_athos_recluse: "the Athonite"
 oe_osmaris_retired: "Retired"
 oe_osmaris_retired_desc: "This character has renounced secular office and retired to a monastery on Mount Athos. They cannot serve in the cabinet, rule a country, command armies or fleets, contract a new marriage, participate in character interactions, or hold an imperial court office."
 oe_flavor_byz.1012.t: "Osmaris: Manuel II the Recluse"
 oe_flavor_byz.1012.d: "(Murad II)\n\nFrom his father Constantine, Manuel II inherited more than trading routes, property and a family seal. He inherited obligations without end. For years he settled disputes between his kin, attended to damaged merchant vessels and defended the family’s standing at court. Yet every feast brought another petitioner, and every settlement another quarrel. In time he began to envy those who could pray without thinking of accounts.\n\nNow the ledgers, the seal and the household’s affairs have been entrusted to others. He asks only for a few books, a plain robe and leave to spend his remaining years at a monastery on Mount Athos. The red banner with its golden crescent and star will remain at the family house; copying manuscripts, giving alms and prayer will carry on his forebears’ faith.\n\n“Your Majesty, I have done what I could for my family. Let me give the years that remain to God.”"
 oe_flavor_byz.1012.a: "Let the bells of the Holy Mountain lift his worldly burden."
 oe_flavor_byz.1012.a.tt: "Manuel II retires to Mount Athos and moves to its owner’s country, joins the clergy and gains the Retired trait. He relinquishes his cabinet, military and imperial court posts, and can no longer hold these offices or rule a country.\nRoman Cultural Influence #G +10#!.\nIf Osmaris is already a great house, its Influence increases by #G 50#!. Otherwise it becomes a great house and the house limit increases by #G 1#!."
 oe_flavor_byz.1012.lapsed: "Set this petition aside for now."
 oe_flavor_byz.1012.lapsed.tt: "His circumstances or the ownership of Mount Athos have changed. No retirement or rewards take effect."
 oe_flavor_byz.1012.historical_info: "The historical Murad II (1404–1451), son of Mehmed I, ruled the Ottoman state in 1421–1444 and 1446–1451. He abdicated in favour of Mehmed II in 1444 and withdrew to Manisa before returning to power. His Orthodox conversion, retirement to Mount Athos and canonization belong to this event chain’s alternate history."
 oe_flavor_byz.1013.t: "Osmaris: Saint Manuel of the Holy Mountain"
 oe_flavor_byz.1013.d: "(Murad II)\n\nA carefully written letter has arrived from Mount Athos: Manuel II has died. The monks found no hoard of silver or jewels among his belongings, only well-worn books, unfinished manuscript pages and a register of the poor he had helped.\n\nHis family remembers a patient elder who managed estates and reconciled quarrels. On the Holy Mountain he is remembered as the first man in the chapel at dawn and the last to take his portion when bread was shared. Monks and pilgrims bear witness to the same humility and charity. The Church has resolved to number him among the saints as Manuel of the Holy Mountain, the recluse who laid aside the splendour of his house.\n\nThe family’s red and gold crescent banner hangs low before his bier. The lamps before the holy icons continue to burn."
 oe_flavor_byz.1013.a: "May Saint Manuel intercede for us."
 oe_flavor_byz.1013.a.tt: "The late Manuel II is formally recognized as an Orthodox saint."
 oe_flavor_byz.1013.historical_info: "The historical Murad II died in 1451 and was buried in Bursa. He neither converted to Orthodoxy nor became an Orthodox saint; this event is an alternate-history conclusion to the Osmaris family’s integration into Roman society."
