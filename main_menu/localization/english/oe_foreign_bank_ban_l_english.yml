l_english:
 oe_pillars_ban_foreign_banks: "Exclude Foreign Banks"
 oe_pillars_ban_foreign_banks_desc: "Imperial credit and exchange must answer to imperial law. Revoke the trading rights of foreign banks within the realm and entrust their business to banks belonging to Rome and its subjects.\n\nUnlocked by #Y Regulate Banking#!. Costs #R 10 Authority#!. Immediately removes bank buildings owned by outside countries from East Rome and all tiers of its subjects, then prevents those foreign banks from constructing new banks there. Banks owned by East Rome and its subjects are protected from this action.\n\nThis action can only be taken once."
 OE_FOREIGN_BANK_BAN_NOT_DONE: "Foreign banks have not yet been excluded."
 OE_FOREIGN_BANK_BAN_AUTHORITY: "Imperial Authority is at least #Y 10#!."
 OE_FOREIGN_BANK_BAN_EFFECT: "Remove bank buildings owned by outside countries from East Rome and all tiers of its subjects, then prevent those foreign banks from constructing new banks there; preserve banks owned by East Rome and its subjects."
