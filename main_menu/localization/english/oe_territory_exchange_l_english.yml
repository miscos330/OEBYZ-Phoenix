l_english:
 oe_exchange_territory: "Exchange Territory"
 oe_exchange_territory_desc: "After completing the Invincible Phoenix imperial reform, use this action on the Empire Pillars Edicts page and choose any independent country that owns land. Offer up to 50 conquerable locations owned by Byzantium or its subjects within two levels. Request no more locations than you offer, from the target and its subjects within two levels. Requested land must border retained Byzantine or subject land, directly or through other locations received in this exchange. Edit or cancel the draft freely. Only final confirmation spends 1 Diplomat and starts a fifty-year Byzantine cooldown. All exchanged locations go directly to the two sovereigns."
 oe_territory_exchange_cooldown: "Exchange Territory"
 OE_TX_COOLDOWN_READY: "Byzantium is not on its fifty-year territory exchange cooldown"
 OE_TX_DRAFT_OPENED: "An exchange draft is ready. Add offered and requested locations on the Empire Pillars Edicts page, then confirm. Preparing the draft costs no Diplomats and starts no cooldown."
 oe_tx_add_give: "Add an Offered Location"
 oe_tx_add_give_desc: "Add one conquerable location owned by Byzantium or its subjects within two levels to the offer, up to 50. Ownership is not transferred yet."
 oe_tx_add_take: "Add a Requested Location"
 oe_tx_add_take_desc: "Choose a location from the target or its subjects within two levels. It must border retained Byzantine land or a connected requested location. Requests may not exceed offers. Select outward from the border."
 oe_tx_confirm: "Confirm Territory Exchange"
 oe_tx_confirm_desc: "Recheck ownership, counts and connectivity after the exchange. If all requirements hold, spend 1 Diplomat, transfer offered locations to the target and requested locations to Byzantium, and start a fifty-year cooldown. Failed validation spends nothing and transfers no land."
 OE_TX_CHOOSE_GIVE: "Choose a location to offer"
 OE_TX_CHOOSE_TAKE: "Choose a location for Byzantium"
 OE_TX_NO_GIVE_LOCATIONS: "@trigger_no! No eligible unselected location is available, or 50 locations are already offered."
 OE_TX_NO_TAKE_LOCATIONS: "@trigger_no! No eligible adjacent location is available, or requests already equal offers. Add more offers or select outward from the border."
 OE_TX_DRAFT_HELP: "Add offered locations, then request locations outward from the border. Confirm when ready."
 OE_TX_GIVE_COUNT: "Offer: [GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_tx_give_count_value')|0]/50"
 OE_TX_TAKE_COUNT: "Request: [GuiScope.SetRoot(GetCountry('BYZ').MakeScope).ScriptValue('oe_tx_take_count_value')|0]"
 OE_TX_ADD_GIVE: "Add Offered Land"
 OE_TX_ADD_TAKE: "Add Requested Land"
 OE_TX_REMOVE: "Undo"
 OE_TX_REFRESH: "Recheck"
 OE_TX_CANCEL: "Cancel"
 OE_TX_CONFIRM: "Confirm"
 OE_TX_INVALID: "#R The draft does not yet meet the exchange requirements.#!"
 OE_TX_READY: "#G Draft checked; confirmation will validate it again.#!"
 OE_TX_VALIDATION_TT: "Offer and request at least one location each. Offer no more than 50 and request no more than you offer. All locations must still belong to the corresponding country or subjects within two levels. Requested land must connect through this exchange to retained Byzantine or subject land. Recheck if ownership has changed while preparing."
 OE_TX_CHOOSE_PARTNER: "Choose an independent country for the exchange"
 OE_TX_NO_PARTNERS: "@trigger_no! No independent country is available. Cancel an existing draft before choosing another country."
 OE_TX_PARTNER_LABEL: "Target country:"
