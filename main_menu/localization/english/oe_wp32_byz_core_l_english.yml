 oe_wp32_chr_sees_active: "Active Metropolitan Sees"
 oe_wp32_chr_sees_active_desc: "Counts how many of the five imperial metropolitan sees—Constantinople, Thessalonica, Nicaea, Trebizond, and the Eastern Apostolic Sees—stand active under imperial protection."
 oe_wp32_chr_symphonia: "Imperial Symphonia"
 oe_wp32_chr_symphonia_desc: "Measures constitutional harmony between the Roman Emperor, the Ecumenical Patriarch, and the Permanent Holy Synod."
 oe_wp32_crisis.1.a: "Confront the Palace and Senate deadlock first."
 oe_wp32_crisis.1.b: "Engage the Patriarchal Synod before unrest spreads."
 oe_wp32_crisis.1.c: "Pour emergency gold into stabilizing frontier commands."
 oe_wp32_crisis.1.d: "Decades of vast expansion and mounting fiscal strain have snapped the delicate balance among the empire's four supreme pillars: the Palace Logothetes, the Imperial Senate, the Patriarchal Synod, and the Frontier Armies. Mutual vetoes paralyze tax rolls, clerical appointments, and troop pay alike. Unless we master at least three of the four courts through decisive crisis actions, our mighty realm risks hollowing out from within."
 oe_wp32_crisis.1.t: "Fracture of the Four Courts"
 oe_wp32_crisis.2.a: "Fund an impartial imperial arbitration panel."
 oe_wp32_crisis.2.b: "Yield ceremonial honors to break the stalemate."
 oe_wp32_crisis.2.c: "Elevate an independent imperial jurist to audit both sides."
 oe_wp32_crisis.2.d: "Palace secretaries controlling the imperial seal have abruptly struck down senatorial nominees for three wealthy provincial governorships. Outraged aristocratic magistrates have retaliated by freezing tax assessments and judicial appeals across core provinces, threatening to starve the treasury unless the throne intervenes with gold, ceremonial compromise, or an impartial jurist."
 oe_wp32_crisis.2.t: "Deadlock Between Palace and Senate"
 oe_wp32_crisis.3.a: "Reimburse the metropolitan treasuries promptly."
 oe_wp32_crisis.3.b: "Stand firm on the Emperor's sovereign necessity."
 oe_wp32_crisis.3.c: "Entrust negotiations to a conciliatory church diplomat."
 oe_wp32_crisis.3.d: "Outraged by emergency war levies laid upon monastic granaries and metropolitan endowments, senior bishops have assembled in the gallery of Hagia Sophia to issue a solemn remonstrance. Unless canonical liberties are respected, they warn that public prayers for the imperial household may cease—a grave blow to popular obedience across every Orthodox province."
 oe_wp32_crisis.3.t: "Ecclesiastical Warning from Hagia Sophia"
 oe_wp32_crisis.4.a: "Dispatch emergency silver chests to the border themes."
 oe_wp32_crisis.4.b: "Rotate senior officers to remind them who wears the purple."
 oe_wp32_crisis.4.c: "Summon the ablest loyal general to command the border audit."
 oe_wp32_crisis.4.d: "Dust-stained couriers from our distant frontier themes have delivered a blunt joint petition signed by five veteran strategoi. They complain that palace intrigue and senatorial squabbles have starved border garrisons of coin, horses, and fresh recruits—and their closing sentence carries the unmistakable iron ring of generals remembering how emperors were once raised on shields."
 oe_wp32_crisis.4.t: "Ultimatum of the Frontier Strategoi"
 oe_wp32_crisis.5.a: "One Empire, four harmonious pillars!"
 oe_wp32_crisis.5.b: "Collect reconciliation contributions to rebuild imperial reserves."
 oe_wp32_crisis.5.d: "Under the radiant vaults of Constantinople, representatives of the Palace Chancery, the Imperial Senate, the Holy Synod, and the Frontier Armies have affixed their seals to a renewed constitutional compact. Freed from years of bitter administrative deadlock, the restored Roman Empire emerges more disciplined, solvent, and unified than at any time since the Macedonian golden age."
 oe_wp32_crisis.5.t: "Concord of the Four Courts"
 oe_wp32_crisis.6.a: "Never shall the Roman crown be bought like chattel!"
 oe_wp32_crisis.6.b: "Disburse a partial treasury bribe to buy breathing room."
 oe_wp32_crisis.6.c: "Send secret couriers immediately to summon the Anatolian Themes!"
 oe_wp32_crisis.6.d: "Sensing vulnerability during a delicate succession, rogue captains of the Varangian and Palatine Guards have slammed shut the bronze doors of the Chalke Gate and surrounded the palace courtyards. Clashing battle-axes against gilded shields, they demand ruinous accession donativa—openly boasting in the shadow of ancient Rome's darkest hour that the imperial purple belongs to the highest bidder."
 oe_wp32_crisis.6.t: "The Purple Placed at Auction"
 oe_wp32_crisis.7.a: "Buy time with a measured treasury payout."
 oe_wp32_crisis.7.b: "Defy them openly and summon loyal Theme cohorts."
 oe_wp32_crisis.7.c: "Promote a loyal guard officer to split the mutineers from within."
 oe_wp32_crisis.7.d: "An armored delegation of mutinous guard officers has forced its way into the Chrysotriklinos reception hall, dropping iron scales beside the golden throne. They insist on immediate silver chests for every barracks cohort before they will unlock the palace gates or allow imperial edicts to leave the capital. Every courtiers' breath catches as they watch our reaction."
 oe_wp32_crisis.7.t: "Captains of the Chalke Demand Gold"
 oe_wp32_crisis.8.a: "Welcome our true defenders of Rome into the capital!"
 oe_wp32_crisis.8.b: "Reward the loyal Theme commander with high imperial rank."
 oe_wp32_crisis.8.d: "Word of the palace guards' insolence has swept like wildfire through the veteran Anatolian and Thracian Themes. At dawn, rank upon rank of mud-splattered provincial cataphracts and disciplined thematic infantry unfurl imperial standards outside the Theodosian Walls, their commanders sending word through the postern gate that they stand ready to restore lawful order."
 oe_wp32_crisis.8.t: "Loyal Theme Regiments Rally to the City"
 oe_wp32_crisis.9.a: "Law stands higher than the sword!"
 oe_wp32_crisis.9.b: "Drill the reformed Guard into an unmatched elite force."
 oe_wp32_crisis.9.d: "With the ringleaders of the Chalke conspiracy executed or exiled and surviving cohorts lined up unarmed before the Senate and Patriarch, every Varangian and Palatine soldier swears a binding Constitutional Oath upon the Gospels. Never again shall mercenaries presume to auction the Roman throne; imperial law stands permanently above the sword."
 oe_wp32_crisis.9.t: "The Guard Bound by Law"
 oe_wp32_dec_anatolian_beacon_chain.a: "Light the fires across Anatolia!"
 oe_wp32_dec_anatolian_beacon_chain.desc: "Constructs the synchronized eight-peak Byzantine optical beacon line from Tarsus and the Cilician frontier through Nigde, Aksaray, Konya, Emirdag, Kutahya, Nicaea, and Nicomedia to Constantinople."
 oe_wp32_dec_anatolian_beacon_chain.title: "Commission the Anatolian Beacon Chain (Phryktoria)"
 oe_wp32_dec_charter_capital_projects.a: "Summon the master builders to the Queen of Cities!"
 oe_wp32_dec_charter_capital_projects.desc: "Authorizes monumental restorations across Constantinople and Thrace: the Theodosian Walls, Anastasian Wall, Great Palace, Blachernae, Bucoleon Harbor, Chalke Gate, Basilica Cistern, and Grand Hippodrome."
 oe_wp32_dec_charter_capital_projects.title: "Charter Imperial Capital Great Projects"
 oe_wp32_dec_charter_capital_projects_tt: "Unlocks 8 Imperial Capital & Thracian Great Project monumental buildings."
 oe_wp32_dec_charter_frontier_projects.a: "Bind the Empire in stone and steel!"
 oe_wp32_dec_charter_frontier_projects.desc: "Authorizes grand provincial engineering works along Via Egnatia, Via Militaris, Via Appia, the Cilician Gates, Danubian Limes, Nisibis, Nicaea, Trebizond, and Theodosiopolis."
 oe_wp32_dec_charter_frontier_projects.title: "Charter Imperial Highways & Frontier Fortresses"
 oe_wp32_dec_charter_frontier_projects_tt: "Unlocks 9 Roman Highway & Frontier Fortress Great Project monumental buildings."
 oe_wp32_dec_charter_mediterranean_projects.a: "Restore the marvels of the Roman world!"
 oe_wp32_dec_charter_mediterranean_projects.desc: "Authorizes monumental restorations at Old Rome's Aurelian Walls, the Athenian Neoplatonic Academy, Knossos, Rhodes, the Hexamilion, Mount Athos, Syracuse, Ephesus, and Jerusalem."
 oe_wp32_dec_charter_mediterranean_projects.title: "Charter Mediterranean & Apostolic Wonders"
 oe_wp32_dec_charter_mediterranean_projects_tt: "Unlocks 9 Aegean, Italic & Apostolic Great Project monumental buildings."
 oe_wp32_dec_gregoras_chora_academy.a: "Open the doors of the Chora Academy!"
 oe_wp32_dec_gregoras_chora_academy.desc: "Endows Nikephoros Gregoras's monastic observatory and humanistic school at the Chora in Constantinople, unlocking the Chora Academy monumental building and choosing its flagship curriculum."
 oe_wp32_dec_gregoras_chora_academy.title: "Establish the Gregoras Chora Academy"
 oe_wp32_dec_host_hippodrome_games.a: "Let the chariots thunder down the spina!"
 oe_wp32_dec_host_hippodrome_games.desc: "Opens the Grand Hippodrome of Constantinople for ceremonial races between the rival Blue (Venetoi) and Green (Prasinoi) circus factions."
 oe_wp32_dec_host_hippodrome_games.title: "Host the Quadrennial Hippodrome Chariot Games"
 oe_wp32_flavor.1.a: "Pay 200 Gold in full restitution to avert an imperial war."
 oe_wp32_flavor.1.b: "Defy Constantinople! St. Mark bows to no Basileus!"
 oe_wp32_flavor.1.c: "Negotiate a reduced 120-Gold merchant settlement to close the ledger."
 oe_wp32_flavor.1.d: "Crimson-robed envoys from Constantinople have entered the Doge's Palace and unrolled a massive crimson-sealed parchment before the Venetian Great Council. Item by item, the Imperial Ledger recounts the gilded quadriga horses, sacred relics, and gold looted during the Fourth Crusade of 1204, demanding formal restitution—or warning that the Roman Empire will collect the debt by fire and steel."
 oe_wp32_flavor.1.t: "The Imperial Ledger of 1204 Arrives"
 oe_wp32_flavor.2.a: "Justice delayed two centuries is justice done at last!"
 oe_wp32_flavor.2.b: "Distribute part of the restitution to rebuild damaged shrines."
 oe_wp32_flavor.2.d: "Humbled by the resurgent might of New Rome, Venetian state galleys have sailed peacefully into the Golden Horn bearing iron-bound chests of gold ducats alongside priceless Byzantine icons and liturgical vessels plundered in 1204. As priests carry the returned relics in solemn procession into Hagia Sophia, weeping crowds line the Mese hailing justice done at last."
 oe_wp32_flavor.2.t: "Venice Pays 1204 Restitution!"
 oe_wp32_flavor.3.a: "Then the imperial fleet shall collect what diplomacy could not!"
 oe_wp32_flavor.3.b: "Commission a fiery Adriatic admiral to prepare the expedition."
 oe_wp32_flavor.3.d: "The Doge of Venice has contemptuously cast our crimson-sealed Ledger of 1204 from the Senate dais, boasting that the lagoon republic answers only to its fleets and gold. Furious indignation sweeps Constantinople from the Great Palace to the Golden Horn shipyards: every imperial Theme and dromon squadron now holds righteous warrant to collect our debt across the Adriatic."
 oe_wp32_flavor.3.t: "Venice Defies the Ledger of 1204"
 oe_wp32_flavor.4.a: "Champion astronomy, geometry, and scientific inquiry."
 oe_wp32_flavor.4.b: "Champion classical Hellenic rhetoric and Roman law."
 oe_wp32_flavor.4.c: "Endow a dual faculty under a renowned Chora master."
 oe_wp32_flavor.4.d: "Beneath the luminous frescoes and starry vaults of Chora Monastery, Constantinople's foremost polymaths—heirs to Nikephoros Gregoras and Theodore Metochites—gather to draft the founding charter of our imperial academy. Should its chairs champion mathematical astronomy and calendar reform, classical Hellenic rhetoric and Roman jurisprudence, or unite both under a hand-picked imperial rector?"
 oe_wp32_flavor.4.t: "The Didaskaleion of Nikephoros Gregoras at Chora"
 oe_wp32_flavor.5.a: "Glory to the eternal Roman Empire!"
 oe_wp32_flavor.5.b: "Scatter silver largesse along the Mese for the citizens."
 oe_wp32_flavor.5.c: "Honor a rising field officer who distinguished himself in battle."
 oe_wp32_flavor.5.d: "Laurel garlands festoon every marble column and crimson rose petals drift across the stone paving as victorious Roman legions march from the Golden Gate through the Forum of Constantine toward Hagia Sophia. Captured enemy standards dip before the Emperor while imperial chroniclers inscribe another reclaimed province into the golden roll of eternal Roman triumphs."
 oe_wp32_flavor.5.t: "Io Triumphe! Procession Along the Mese"
 oe_wp32_flavor.6.a: "Inspect the heavy cavalry ranks and reward their drill."
 oe_wp32_flavor.6.b: "Channel surplus arsenal stock into naval readiness and trade."
 oe_wp32_flavor.6.c: "Promote the chief inspector to oversee imperial war planning."
 oe_wp32_flavor.6.d: "Months after our new arsenal decrees took effect, column after column of freshly equipped Tagmata cavalry and siphon-armed naval marines parade beneath the Mangana walls. Gleaming lamellar armor catches the Marmara sun while master armorers present full inventory tallies confirming that imperial workshops have met every quota ahead of schedule."
 oe_wp32_flavor.6.t: "Armamenton & Tagmata Imperial Review"
 oe_wp32_flavor.7.a: "Enforce the assize rulings to boost crown revenues and control."
 oe_wp32_flavor.7.b: "Issue a general amnesty for minor arrears to calm the provinces."
 oe_wp32_flavor.7.c: "Appoint the senior circuit judge to the imperial cabinet."
 oe_wp32_flavor.7.d: "Having traversed mountain valleys and coastal estates across our provinces, the circuit judges of the Pronoia Land Registry return to Constantinople with sealed brass chests of updated praktika. Countless boundary quarrels between soldier-farmers, magnates, and monasteries have been adjudicated, giving the throne a rare moment to consolidate control and revenue."
 oe_wp32_flavor.7.t: "Great Assize of the Pronoia Registry"
 oe_wp32_flavor.8.a: "Lock in spring grain deliveries to swell the imperial horrea."
 oe_wp32_flavor.8.b: "Auction spring shipping licenses for maximum treasury gold."
 oe_wp32_flavor.8.c: "Enlist a shrewd Pontic merchant broker as imperial trade factor."
 oe_wp32_flavor.8.d: "As winter gales close the northern Black Sea navigation season, imperial customs officers and grain factors convene inside the Golden Horn exchange to settle the Sitonia accounts. Thanks to our earlier naval escorts and tariff policies, Constantinople's granaries stand secure while foreign maritime brokers compete eagerly for spring shipping charters."
 oe_wp32_flavor.8.t: "Reckoning of the Black Sea Grain Syndicate"
 oe_wp32_flavor.9.a: "Accept the Senate's acclamation and strengthen civic governance."
 oe_wp32_flavor.9.b: "Direct celebratory civic gifts toward public relief and reserves."
 oe_wp32_flavor.9.c: "Draw a respected senatorial orator into the imperial council."
 oe_wp32_flavor.9.d: "Word of our triumphs, grand monuments, and restored civic concord has united every estate of Constantinople in rare celebration. Inside the Magnaura Hall, senators in white chlamys robes, guild masters, and senior prelates offer formal acclamations praising a reign that has answered centuries of decline with stone, law, and imperial confidence."
 oe_wp32_flavor.9.t: "Acclamation of the Imperial Senate & People"
 oe_wp32_four_courts_crisis: "The Four Courts Crisis"
 oe_wp32_four_courts_crisis_desc: "As the restored Roman Empire stretches across vast frontiers, its four supreme pillars—the Palace Bureaucracy, the Senate, the Patriarchal Synod, and the Frontier Armies—lock horns over taxes, appointments, and imperial supremacy. Resolve at least three of the four courts through interactive crisis actions while restoring Stability and Legitimacy."
 oe_wp32_gp.1.a: "No invader shall catch the Roman East unawares!"
 oe_wp32_gp.1.b: "Pair the beacon stations with civilian courier shelters."
 oe_wp32_gp.1.c: "Appoint a veteran signal-commander to drill the watchmen."
 oe_wp32_gp.1.d: "At dusk along the jagged Taurus crest above Tarsus, watchmen touch pitch torches to the first stone cauldron; within minutes, sparks leap from Mount Argaios to Cappadocia, Iconium, Amorium, Kotyaion, Nicaea, and Mount Auxentios across the Marmara. Synchronized by water-clock codes, the restored Phryktoria optical telegraph now carries frontier alarm to the Great Palace within a single hour."
 oe_wp32_gp.1.t: "The Anatolian Beacons Are Lit!"
 oe_wp32_gp.2.a: "Constantinople endures eternal!"
 oe_wp32_gp.2.b: "Tighten civic stewardship across the capital's quarters."
 oe_wp32_gp.2.c: "Honor the master architect with a permanent court post."
 oe_wp32_gp.2.d: "To the roar of trumpets and cathedral hymns, master masons lower the final gilded marble cornice upon our newly restored monument in Constantinople. Foreign ambassadors gazing upon the towering walls, imperial halls, and marble quays whisper that New Rome has shaken off the ashes of 1204 and once more outshines every rival capital from Paris to Cairo."
 oe_wp32_gp.2.t: "Splendor of the Queen of Cities"
 oe_wp32_gp.3.a: "Let Roman wisdom illuminate the age."
 oe_wp32_gp.3.b: "Invite a brilliant Chora polymath to advise the palace."
 oe_wp32_gp.3.d: "Polished brass astrolabes, bronze armillary spheres, and freshly illuminated Greek codices now fill the quiet stone galleries of the Chora Academy and Observatory. Mathematicians, calendar reformers, and humanist jurists flock from Italy, Serbia, and Trebizond to debate celestial mechanics and classical philosophy beneath the shimmering mosaics of Constantinople."
 oe_wp32_gp.3.t: "Starlight Over the Chora Observatory"
 oe_wp32_gp.4.a: "All roads serve the Roman peace."
 oe_wp32_gp.4.b: "Collect standardized highway tolls to replenish the fisc."
 oe_wp32_gp.4.d: "Freshly dressed basalt paving stones stretch from Thessalonica and Philippopolis to the Adriatic ferries, while newly raised bastions lock the Cilician Gates, the Lower Danube, and the Upper Tigris passes. Couriers ride without delay, supply trains roll securely behind our marching legions, and provincial merchants marvel at the return of classic Roman engineering."
 oe_wp32_gp.4.t: "Highways and Iron Gates of the Empire"
 oe_wp32_gp.5.a: "Our ancestors smile upon these works."
 oe_wp32_gp.5.b: "Grant commemorative trade charters to our marble ports."
 oe_wp32_gp.5.d: "From the restored Aurelian Walls of Old Rome and the philosophical groves beneath the Athenian Acropolis to the naval citadels of Crete, Rhodes, and Syracuse, classical marble and Byzantine engineering proclaim a grand rebirth across the inland sea. Envoys from every Mediterranean shore acknowledge that the Roman world is no longer a memory, but a living empire."
 oe_wp32_gp.5.t: "Wonders of the Mediterranean Reborn"
 oe_wp32_gp.6.a: "Stand firm, eastern pillars of Rome!"
 oe_wp32_gp.6.b: "Entrust the eastern marches to a battle-tested warden."
 oe_wp32_gp.6.d: "From the lakeside double ramparts of Nicaea and the Ionian wharves of Ephesus to the cliff acropolis of Trebizond, the snow-proof walls of Theodosiopolis, and the restored rotunda of Jerusalem, stone citadels and apostolic sanctuaries now anchor our eastern horizon. Pilgrims, caravans, and frontier troops move under one imperial shield."
 oe_wp32_gp.6.t: "Eastern Bastions and Sacred Foundations"
 oe_wp32_gp_anastasian_wall: "Anastasian Long Wall of Thrace"
 oe_wp32_gp_anastasian_wall_desc: "Rebuilds Emperor Anastasius I's outer Thracian barrier from the Propontis at Selymbria to the Black Sea, shielding the suburban granaries of Constantinople."
 oe_wp32_gp_anastasian_wall_maint: "Anastasian Long Wall of Thrace Upkeep"
 oe_wp32_gp_apostolic_patriarchate: "Restored Apostolic Basilica of Jerusalem"
 oe_wp32_gp_apostolic_patriarchate_desc: "Restores the rotunda, pilgrim hospices, and patriarchal court of Jerusalem under imperial protection, crowning the Pentarchy's revival."
 oe_wp32_gp_apostolic_patriarchate_maint: "Restored Apostolic Basilica of Jerusalem Upkeep"
 oe_wp32_gp_armenian_kastron: "Armenian Highland Fortress of Theodosiopolis"
 oe_wp32_gp_armenian_kastron_desc: "Constructs snow-proof bastion walls, mountain cavalry barracks, and winter granaries on the high plateau guarding eastern Anatolia."
 oe_wp32_gp_armenian_kastron_maint: "Armenian Highland Fortress of Theodosiopolis Upkeep"
 oe_wp32_gp_athonite_lavra: "Imperial Athonite Monastic Sanctuary"
 oe_wp32_gp_athonite_lavra_desc: "Grants perpetual imperial chrysobulls, fortified sea-towers, and scriptoria to the Great Lavra and monastic republic of Mount Athos."
 oe_wp32_gp_athonite_lavra_maint: "Imperial Athonite Monastic Sanctuary Upkeep"
 oe_wp32_gp_aurelian_walls: "Aurelian Walls of Old Rome Restoration"
 oe_wp32_gp_aurelian_walls_desc: "Restores the nineteen-kilometer brick circuit and monumental gates of Emperor Aurelian, safeguarding the reclaimed Eternal City under imperial Roman administration."
 oe_wp32_gp_aurelian_walls_maint: "Aurelian Walls of Old Rome Restoration Upkeep"
 oe_wp32_gp_basilica_cistern: "Basilica Cistern & Aqueduct of Valens"
 oe_wp32_gp_basilica_cistern_desc: "Restores the 336-column subterranean reservoir and Valens masonry arches so the Queen of Cities can endure protracted sieges and sustain an expanding urban population."
 oe_wp32_gp_basilica_cistern_maint: "Basilica Cistern & Aqueduct of Valens Upkeep"
 oe_wp32_gp_blachernae_palace: "Blachernae Imperial Complex"
 oe_wp32_gp_blachernae_palace_desc: "Expands the Komnenian-Palaiologan fortified palace quarter by the Golden Horn with fortified terraces, council halls, and guarded imperial archives."
 oe_wp32_gp_blachernae_palace_maint: "Blachernae Imperial Complex Upkeep"
 oe_wp32_gp_bucoleon_harbor: "Bucoleon Palace & Imperial Quay"
 oe_wp32_gp_bucoleon_harbor_desc: "Dredges the marble sea-gate harbor beneath the Great Palace, berthing the imperial dromon squadron alongside sheltered state grain wharves."
 oe_wp32_gp_bucoleon_harbor_maint: "Bucoleon Palace & Imperial Quay Upkeep"
 oe_wp32_gp_chalke_gate: "Chalke Bronze Gate & Magnaura Hall"
 oe_wp32_gp_chalke_gate_desc: "Re-gilds the monumental bronze entrance to the imperial quarter and equips the adjoining Magnaura ceremonial hall and Scholae guard barracks."
 oe_wp32_gp_chalke_gate_maint: "Chalke Bronze Gate & Magnaura Hall Upkeep"
 oe_wp32_gp_chora_academy: "Gregoras Chora Academy & Observatory"
 oe_wp32_gp_chora_academy_desc: "Endows the monastic library and astronomical school at Chora founded in the tradition of Nikephoros Gregoras and Theodore Metochites, uniting Hellenic geometry, calendar reform, and Roman jurisprudence."
 oe_wp32_gp_chora_academy_maint: "Gregoras Chora Academy & Observatory Upkeep"
 oe_wp32_gp_cilician_gates: "Fortress of the Cilician Gates (Pylai Kilikias)"
 oe_wp32_gp_cilician_gates_desc: "Seals the narrow Taurus Mountain gorge above Tarsus with terraced casemates, toll-gates, and Akritai garrison quarters controlling every army crossing between Anatolia and Syria."
 oe_wp32_gp_cilician_gates_maint: "Fortress of the Cilician Gates (Pylai Kilikias) Upkeep"
 oe_wp32_gp_colossus_rhodos: "Lighthouse & Monument of Rhodes"
 oe_wp32_gp_colossus_rhodos_desc: "Erects a towering bronze-clad beacon and twin harbor moles at Rhodes, guiding Levantine merchantmen and imperial galleys into the Aegean."
 oe_wp32_gp_colossus_rhodos_maint: "Lighthouse & Monument of Rhodes Upkeep"
 oe_wp32_gp_danubian_limes: "Danubian Limes River Citadel"
 oe_wp32_gp_danubian_limes_desc: "Re-establishes stone river forts and patrol-barge slips along the Lower Danube crossings near Bononia, anchoring the empire's northern frontier shield."
 oe_wp32_gp_danubian_limes_maint: "Danubian Limes River Citadel Upkeep"
 oe_wp32_gp_ephesus_basilica: "Basilica of St. John & Ionian Emporium"
 oe_wp32_gp_ephesus_basilica_desc: "Restores the pilgrimage basilica and Aegean customs quay on the Ionian coast, reviving western Anatolian silk, wine, and fig exports."
 oe_wp32_gp_ephesus_basilica_maint: "Basilica of St. John & Ionian Emporium Upkeep"
 oe_wp32_gp_great_palace: "Great Palace & Chrysotriklinos Restoration"
 oe_wp32_gp_great_palace_desc: "Restores the octagonal Golden Reception Hall, mosaic peristyles, and imperial chanceries overlooking the Marmara as the ceremonial heart of Roman sovereignty."
 oe_wp32_gp_great_palace_maint: "Great Palace & Chrysotriklinos Restoration Upkeep"
 oe_wp32_gp_hexamilion_isthmus: "Hexamilion Wall of the Corinthian Isthmus"
 oe_wp32_gp_hexamilion_isthmus_desc: "Fortifies the six-mile defensive wall across the Isthmus of Corinth with artillery redoubts and naval patrol stations safeguarding the Morea."
 oe_wp32_gp_hexamilion_isthmus_maint: "Hexamilion Wall of the Corinthian Isthmus Upkeep"
 oe_wp32_gp_hippodrome_kathisma: "Grand Hippodrome & Imperial Kathisma"
 oe_wp32_gp_hippodrome_kathisma_desc: "Repairs the tiered spina, bronze quadriga podium, and imperial viewing box, reviving ceremonial acclamations and civic pageantry in Constantinople."
 oe_wp32_gp_hippodrome_kathisma_maint: "Grand Hippodrome & Imperial Kathisma Upkeep"
 oe_wp32_gp_knossos_palace: "Palace of Knossos & Cretan Admiralty"
 oe_wp32_gp_knossos_palace_desc: "Pairs the excavated Cretan royal citadel with a fortified imperial naval base at Chandax, turning Crete into an unsinkable bastion across the eastern Mediterranean."
 oe_wp32_gp_knossos_palace_maint: "Palace of Knossos & Cretan Admiralty Upkeep"
 oe_wp32_gp_neoplatonic_academy: "Revived Neoplatonic Academy of Athens"
 oe_wp32_gp_neoplatonic_academy_desc: "Reopens an imperial philosophical lyceum beneath the Acropolis dedicated to mathematics, classical letters, and Christian-Hellenic humanism."
 oe_wp32_gp_neoplatonic_academy_maint: "Revived Neoplatonic Academy of Athens Upkeep"
 oe_wp32_gp_nicaean_citadel: "Nicaean Lake Ramparts & Synod Hall"
 oe_wp32_gp_nicaean_citadel_desc: "Refortifies the double circuit of Lake Ascania and the historic hall of the Ecumenical Councils that sheltered the Roman Empire in exile."
 oe_wp32_gp_nicaean_citadel_maint: "Nicaean Lake Ramparts & Synod Hall Upkeep"
 oe_wp32_gp_nisibis_bastion: "Bastion of Nisibis (Mesopotamian Shield)"
 oe_wp32_gp_nisibis_bastion_desc: "Revives the legendary Mesopotamian frontier fortress of Nisibis with concentric mud-brick and basalt ramparts guarding the Upper Tigris approaches."
 oe_wp32_gp_nisibis_bastion_maint: "Bastion of Nisibis (Mesopotamian Shield) Upkeep"
 oe_wp32_gp_phryktoria_beacon: "Anatolian Beacon Tower (Phryktoria)"
 oe_wp32_gp_phryktoria_beacon_desc: "Part of the synchronized optical fire-telegraph chain spanning eight Anatolian peaks from the Cilician frontier to the Great Palace of Constantinople, relaying invasion warnings within a single hour."
 oe_wp32_gp_phryktoria_beacon_maint: "Anatolian Beacon Tower (Phryktoria) Upkeep"
 oe_wp32_gp_sicilian_theme_citadel: "Syracuse & Sicilian Naval Fortress"
 oe_wp32_gp_sicilian_theme_citadel_desc: "Transforms Ortygia island at Syracuse into an armored imperial dockyard projecting Roman naval supremacy across the central Mediterranean narrows."
 oe_wp32_gp_sicilian_theme_citadel_maint: "Syracuse & Sicilian Naval Fortress Upkeep"
 oe_wp32_gp_theodosian_walls: "Theodosian Triple Land Walls Restoration"
 oe_wp32_gp_theodosian_walls_desc: "Reinforces the moat, outer curtain, and ninety-six polygonal towers of the Theodosian ramparts with dressed stone vaults and artillery platforms."
 oe_wp32_gp_theodosian_walls_maint: "Theodosian Triple Land Walls Restoration Upkeep"
 oe_wp32_gp_trebizond_citadel: "Pontic Citadel & Golden-Headed Basilica"
 oe_wp32_gp_trebizond_citadel_desc: "Expands the cliffside acropolis and Black Sea silk-caravan warehouses of Trebizond, securing the empire's terminus to Persia and the Caucasus."
 oe_wp32_gp_trebizond_citadel_maint: "Pontic Citadel & Golden-Headed Basilica Upkeep"
 oe_wp32_gp_via_appia: "Via Appia Queen of Roads Restoration"
 oe_wp32_gp_via_appia_desc: "Restores the ancient basalt highway and twin terminal columns at Brundisium, reconnecting the Adriatic ferry lanes from Greece with Old Rome."
 oe_wp32_gp_via_appia_maint: "Via Appia Queen of Roads Restoration Upkeep"
 oe_wp32_gp_via_egnatia: "Via Egnatia Grand Milestone & Staging Hub"
 oe_wp32_gp_via_egnatia_desc: "Rebuilds the great paved Roman highway junction at Thessalonica linking the Adriatic ports of Dyrrhachium directly to Constantinople."
 oe_wp32_gp_via_egnatia_maint: "Via Egnatia Grand Milestone & Staging Hub Upkeep"
 oe_wp32_gp_via_militaris: "Via Militaris Imperial Highway Citadel"
 oe_wp32_gp_via_militaris_desc: "Fortifies the central Balkan highway artery at Philippopolis with courier stables, supply magazines, and stone watch-bridges toward Serdica and Singidunum."
 oe_wp32_gp_via_militaris_maint: "Via Militaris Imperial Highway Citadel Upkeep"
 oe_wp32_guard_auction_crisis: "Guard Throne Auction Crisis"
 oe_wp32_guard_auction_crisis_desc: "Sensing weakness during a fragile succession or regency, captains of the Varangian and Palatine Guards threaten to put the Roman purple up for auction unless exorbitant donativa are paid. Purge conspirators, negotiate a disciplined settlement, or bind the Guard to a Constitutional Oath."
 oe_wp32_hippodrome.1.a: "Wave the imperial handkerchief for the Blues (Venetoi)!"
 oe_wp32_hippodrome.1.b: "Wave the imperial handkerchief for the Greens (Prasinoi)!"
 oe_wp32_hippodrome.1.c: "Preside in august neutrality as father of all Romans."
 oe_wp32_hippodrome.1.d: "Sixty thousand citizens pack the sun-drenched marble tiers of the Grand Hippodrome as silk pennants ripple above the ancient Egyptian obelisk and bronze Serpent Column. Below the Imperial Kathisma, aristocratic Blues (Venetoi) and artisan-backed Greens (Prasinoi) hold their breath, waiting to see which faction's four-horse quadriga will receive the Emperor's white mappa handkerchief."
 oe_wp32_hippodrome.1.t: "The Quadrennial Imperial Chariot Games"
 oe_wp32_hippodrome.2.a: "Award the golden palm to the victorious Blues!"
 oe_wp32_hippodrome.2.b: "Invoke the joyous applause before the Imperial Senate."
 oe_wp32_hippodrome.2.c: "Bring a popular Blue faction patron into palace service."
 oe_wp32_hippodrome.2.d: "With sparks flying from bronze wheel-hubs around the sharp western turning post, the Blue quadriga sweeps past its rivals on the seventh lap to cross the chalk line first. Aristocratic boxes erupt in thunderous acclamations, silver cups clink across noble mansions, and the victorious charioteer ascends the marble steps to receive a laurel wreath directly from the Kathisma."
 oe_wp32_hippodrome.2.t: "Triumph of the Blues (Venetoi)"
 oe_wp32_hippodrome.3.a: "Celebrate the vigor of Constantinople's guilds!"
 oe_wp32_hippodrome.3.b: "Channel urban goodwill into lasting civic stability."
 oe_wp32_hippodrome.3.c: "Recruit a shrewd Green guild leader into urban finance."
 oe_wp32_hippodrome.3.d: "Carried forward by a deafening roar from the silk-weavers, shipwrights, and market guilds packing the eastern benches, the Green quadriga surges ahead down the final straight. By sunset, celebratory lanterns illuminate every workshop along the Mese, merchants pour wine in the Emperor's honor, and guild coffers brim with festival trade."
 oe_wp32_hippodrome.3.t: "Triumph of the Greens (Prasinoi)"
 oe_wp32_hippodrome.4.a: "Distribute bread, coin, and impartial magistrates to calm the crowd."
 oe_wp32_hippodrome.4.b: "Send in the city Tagmata to clear the colonnades at once."
 oe_wp32_hippodrome.4.c: "Appear personally at the Kathisma to shame both factions into peace."
 oe_wp32_hippodrome.4.d: "A violent wheel-lock near the bronze turning post sends a favored quadriga crashing into the marble parapet, igniting furious stone-throwing between Blue and Green partisans. Within minutes, brawls spill out through the arched exits toward the Augusteion colonnades; memories of the ancient Nika fires chill every senator as we decide how to restore order."
 oe_wp32_hippodrome.4.t: "Nika Echoes: Circus Factional Tumult"
 oe_wp32_hippodrome.5.a: "May the applause of New Rome echo forever!"
 oe_wp32_hippodrome.5.b: "Auction commemorative guild stalls along the Mese for gold."
 oe_wp32_hippodrome.5.d: "Unmarred by partisan brawls, the quadrennial games culminate in an unforgettable contest hailed alike by Blues and Greens. Rising as one beneath fluttering purple banners, sixty thousand voices chant ancient Greek acclamations wishing long years to the sovereign while foreign merchants marvel at the wealth, harmony, and grandeur of New Rome."
 oe_wp32_hippodrome.5.t: "Golden Charioteer & Imperial Splendor"
 oe_wp32_imperial_church_io: "Imperial Orthodox Church & Five Metropolitan Sees"
 oe_wp32_imperial_church_io_desc: "The Symphonia linking the Roman Emperor and the Ecumenical Patriarchate across the five imperial metropolitan dioceses of Constantinople, Thessalonica, Nicaea, Trebizond, and the revived Eastern Sees of Antioch and Alexandria."
 oe_wp32_imperial_church_io_list_who_tt: "$WHO$ shares communion in the Imperial Orthodox Church with $LIST$."
 oe_wp32_io.1.a: "Prioritize cataphract armor for the Tagmata."
 oe_wp32_io.1.b: "Prioritize bronze siphons and Greek fire for the fleet."
 oe_wp32_io.1.c: "Appoint a chief armorer to expand provincial fabricae."
 oe_wp32_io.1.d: "Master armorers, bowyers, and bronze siphon-smiths from across Thrace and Anatolia have assembled beneath the vaulted Mangana arsenals overlooking the Bosporus to re-charter the Imperial Armamenton. Coal smoke rises once more from the imperial forges as officers debate whether the realm's scarce steel and craftsmen should first re-armor the heavy cataphract Tagmata, arm the dromon fleet with Greek fire, or build permanent provincial fabricae."
 oe_wp32_io.1.t: "Chartering the Imperial Armamenton"
 oe_wp32_io.2.a: "Expand provincial imperial fabricae to spread the craft."
 oe_wp32_io.2.b: "License surplus civilian ironwork to enrich the fisc."
 oe_wp32_io.2.c: "Elevate the master armorer into imperial military service."
 oe_wp32_io.2.d: "Inside the roaring forges beside the Golden Horn, senior guild masters of the Imperial Armamenton have unveiled oil-quenched lamellar steel plates light enough for rapid cavalry marches yet stout enough to turn crossbow bolts, alongside pitch-sealed incendiary grenades. Foreign merchants already whisper of these marvels; how we harness this breakthrough will shape both our field armies and our imperial workshops."
 oe_wp32_io.2.t: "Master Armourers of the Golden Horn"
 oe_wp32_io.3.a: "Enforce strict apographe audits immediately."
 oe_wp32_io.3.b: "Balance noble tenure rights with steady Theme levies."
 oe_wp32_io.3.c: "Commission an incorruptible chief surveyor for the registry."
 oe_wp32_io.3.d: "Rows of clerks bent over fresh parchment rolls inside the Sekreton ton Praktikon have completed the first great imperial register of pronoia grants, monastic immunities, and rural paroikos hearths across our surviving themes. Magnate houses watch uneasily from their estates as imperial assessors prepare to weigh every knightly land grant against actual military service rendered beneath the double-headed eagle."
 oe_wp32_io.3.t: "Opening the Sekreton ton Praktikon"
 oe_wp32_io.4.a: "Uphold the imperial fisc and collect overdue dues."
 oe_wp32_io.4.b: "Restore the disputed estates to canonical monastic stewardship."
 oe_wp32_io.4.c: "Appoint a learned canon jurist to codify tenure boundaries."
 oe_wp32_io.4.d: "While imperial surveyors audited the frontier tax rolls, several powerful border magnates strode into the tribunal brandishing faded chrysobulls from earlier dynasties. They claim perpetual hereditary immunity over fertile valleys and charistikion monastic villages along the march—revenues that belong either to the imperial fisc or to the canonical monasteries stripped by lay greed."
 oe_wp32_io.4.t: "Disputed Praktika on the Frontier"
 oe_wp32_io.5.a: "Convene the Permanent Synod for domestic harmony."
 oe_wp32_io.5.b: "Endow metropolitan cathedrals and missionary seminaries."
 oe_wp32_io.5.c: "Summon an eloquent metropolitan to counsel the throne."
 oe_wp32_io.5.d: "Beneath the golden mosaic dome of Hagia Sophia, incense curls above the assembled metropolitans and imperial ministers gathered to reaffirm Justinian's sacred Symphonia between Crown and Patriarchate. Across Constantinople, Thessalonica, Nicaea, Trebizond, and the ancient apostolic dioceses of the East, the Imperial Orthodox Church prepares to anchor both spiritual orthodoxy and Roman civic loyalty."
 oe_wp32_io.5.t: "Symphonia of Crown and Patriarchate"
 oe_wp32_io.6.a: "Gloria in excelsis! The Imperial Church stands whole."
 oe_wp32_io.6.b: "Endow provincial cathedrals from Nicaea to Trebizond."
 oe_wp32_io.6.c: "Elevate a venerable Eastern prelate to the imperial council."
 oe_wp32_io.6.d: "Bronze bells peal in unbroken chorus from the Golden Horn across the Aegean and Anatolia to the Levantine coast. Bishops representing Constantinople, Thessalonica, Nicaea, Trebizond, and the reclaimed Eastern Apostolic Sees stand shoulder to shoulder beneath the imperial purple, proclaiming that the canonical communion of New Rome stands whole once more before all Christendom."
 oe_wp32_io.6.t: "The Five Metropolitan Sees Reunited"
 oe_wp32_law_armamenton_standard: "Imperial Arms Standardization"
 oe_wp32_law_armamenton_standard_desc: "Determines how the Armamenton allocates iron, leather, and skilled armorers across land and naval arsenals."
 oe_wp32_law_charistikion_reform: "Charistikion & Monastic Grants Statute"
 oe_wp32_law_charistikion_reform_desc: "Regulates lay stewardship over monastic properties and rural endowments."
 oe_wp32_law_church_symphonia: "Imperial Symphonia Concordat"
 oe_wp32_law_church_symphonia_desc: "Balances imperial prerogative against the canonical independence of the Ecumenical Patriarchate."
 oe_wp32_law_greek_fire_monopoly: "Liquid Fire Secrecy Statute"
 oe_wp32_law_greek_fire_monopoly_desc: "Governs the production and tactical deployment of the empire's guarded incendiary formula."
 oe_wp32_law_metropolitan_dioceses: "Five Metropolitan Sees Governance"
 oe_wp32_law_metropolitan_dioceses_desc: "Directs how Constantinople, Thessalonica, Nicaea, Trebizond, and the Eastern Sees deploy ecclesiastical resources."
 oe_wp32_law_pronoia_tenure: "Pronoia Tenure Statute"
 oe_wp32_law_pronoia_tenure_desc: "Defines whether military land grants remain revocable life-tenures, hereditary patrimonies, or frontier soldier commons."
