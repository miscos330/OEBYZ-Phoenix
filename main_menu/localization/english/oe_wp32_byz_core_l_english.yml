 oe_wp32_mod_venice_restitution: "1204 Restitution of the Golden Horn"
 oe_wp32_pnr_akribeia: "Cadastre Accuracy (Akribeia)"
 oe_wp32_pnr_akribeia_desc: "Reflects how thoroughly imperial surveyors have audited provincial praktika, tax rolls, and military service obligations."
 oe_wp32_pnr_gonikotes: "Hereditary Drift (Gonikotes)"
 oe_wp32_pnr_gonikotes_desc: "Measures the extent to which conditional military pronoia grants have hardened into hereditary noble patrimonies."
 oe_wp32_pol_amt_cataphract_forges: "Cataphract Klibanion Forges"
 oe_wp32_pol_amt_cataphract_forges_desc: "Prioritizes heavy lamellar armor, barding, and composite lances for imperial heavy cavalry."
 oe_wp32_pol_amt_customary: "Customary Theme Arsenals"
 oe_wp32_pol_amt_customary_desc: "Maintains traditional regional supply depots with restrained peacetime upkeep."
 oe_wp32_pol_amt_dromon_arsenals: "Imperial Dromon & Siphon Arsenals"
 oe_wp32_pol_amt_dromon_arsenals_desc: "Focuses imperial workshops on sleek twin-banked dromons and coastal dockyard crews."
 oe_wp32_pol_char_canonical: "Canonical Monastic Restitution"
 oe_wp32_pol_char_canonical_desc: "Restores abused monastic estates to canonical abbot oversight, winning clerical devotion and literacy."
 oe_wp32_pol_char_crown_audit: "Crown Cadastre Supervision"
 oe_wp32_pol_char_crown_audit_desc: "Places monastic leases under imperial auditors to recover concealed revenues and bolster state control."
 oe_wp32_pol_char_customary: "Customary Monastic Stewardship"
 oe_wp32_pol_char_customary_desc: "Leaves existing monastic leases undisturbed while encouraging steady local cultivation."
 oe_wp32_pol_chr_balanced: "Justinianic Symphonia"
 oe_wp32_pol_chr_balanced_desc: "Follows the Sixth Novella: priesthood and empire labor in harmony for public stability."
 oe_wp32_pol_chr_diocese_charities: "Philanthropia & Xenodocheia"
 oe_wp32_pol_chr_diocese_charities_desc: "Funds imperial hospices, almshouses, and urban relief across every metropolitan province."
 oe_wp32_pol_chr_diocese_missions: "Apostolic Missionary Outreach"
 oe_wp32_pol_chr_diocese_missions_desc: "Deploys Greek and Slavonic clergy from the five sees to restore Orthodoxy across recovered frontier lands."
 oe_wp32_pol_chr_diocese_tithe: "Imperial Defense Ecclesiastical Tithe"
 oe_wp32_pol_chr_diocese_tithe_desc: "Levies a structured war-chest contribution from metropolitan treasuries to fortify Christian borders."
 oe_wp32_pol_chr_imperial_oversight: "Imperial Chancery Oversight"
 oe_wp32_pol_chr_imperial_oversight_desc: "Expands palatine administrative oversight over church courts and clerical taxation."
 oe_wp32_pol_chr_synodal_autonomy: "Synodal Canonical Autonomy"
 oe_wp32_pol_chr_synodal_autonomy_desc: "Safeguards the Holy Synod's autonomous appointments and missionary zeal across the five sees."
 oe_wp32_pol_gf_naval_issue: "Fleet Siphon Deployment"
 oe_wp32_pol_gf_naval_issue_desc: "Equips imperial galley prows with pressurized bronze siphons to dominate naval engagements."
 oe_wp32_pol_gf_palace_vault: "Palace Vault Secrecy"
 oe_wp32_pol_gf_palace_vault_desc: "Reserves liquid fire for the defense of imperial fortresses and the walls of Constantinople."
 oe_wp32_pol_gf_siege_batteries: "Siege Siphon & Grenade Batteries"
 oe_wp32_pol_gf_siege_batteries_desc: "Issues incendiary pots and flame engines to assault squads and siege artillery."
 oe_wp32_pol_pnr_collective: "Frontier Soldier-Farmer Commons"
 oe_wp32_pol_pnr_collective_desc: "Allocates registered plots collectively to Akritai garrisons and free peasant communities."
 oe_wp32_pol_pnr_conditional: "Conditional Service Tenure"
 oe_wp32_pol_pnr_conditional_desc: "Every pronoia reverts to the fisc upon death or dereliction, preserving imperial control and manpower."
 oe_wp32_pol_pnr_hereditary: "Patrimonial Gonikon Dikaion"
 oe_wp32_pol_pnr_hereditary_desc: "Confirms hereditary succession for loyal noble houses, expanding noble levies and aristocratic contentment."
 oe_wp32_priv_dynatoi_angeloi: "Angeloi Palatine Ceremonial Dignity"
 oe_wp32_priv_dynatoi_angeloi_desc: "Bestows exalted sebastokrator honors and palatine court precedence upon the House of Angelos, amplifying imperial splendor and legitimacy at the cost of faction-ridden court politics."
 oe_wp32_priv_dynatoi_doukai: "Doukai Fiscal Chancery Charter"
 oe_wp32_priv_dynatoi_doukai_desc: "Entrusts senior fiscal bureaux and palace jurisprudence to the learned House of Doukas, sharpening cabinet efficiency and state collection at the price of aristocratic tax exemptions."
 oe_wp32_priv_dynatoi_kantakouzenoi: "Kantakouzenoi Thracian Estates"
 oe_wp32_priv_dynatoi_kantakouzenoi_desc: "Protects the vast Thracian grain-and-pasture domains of the House of Kantakouzenos, boosting imperial harvests and raw staples while sidelining urban merchants."
 oe_wp32_priv_dynatoi_komnenoi: "Komnenoi Martial Patronage"
 oe_wp32_priv_dynatoi_komnenoi_desc: "Grants hereditary imperial commands and Anatolian horse-breeding appanages to the House of Komnenos, bolstering cataphract quality and army tradition while expanding magnate influence."
 oe_wp32_priv_dynatoi_palaiologoi: "Palaiologoi Diplomatic Network"
 oe_wp32_priv_dynatoi_palaiologoi_desc: "Leverages the Palaiologan dynasty's marriage ties and humanist embassies across Europe and the Levant, elevating imperial prestige and diplomacy at higher court outlay."
 oe_wp32_priv_dynatoi_phokades: "Phokades Frontier Akritai Mandate"
 oe_wp32_priv_dynatoi_phokades_desc: "Confirms the Cappadocian warrior clan of Phokas as hereditary wardens of the mountain passes, swelling noble levies and fortress defense while pressing border villagers."
 oe_wp32_pronoia_registry_io: "Pronoia Land Registry"
 oe_wp32_pronoia_registry_io_desc: "The Sekreton ton Praktikon auditing military land grants, charistikion monastic endowments, and the fiscal balance between imperial crown lands and landed magnates."
 oe_wp32_pronoia_registry_io_list_who_tt: "$WHO$ belongs to the Pronoia Land Registry alongside $LIST$."
 oe_wp32_sit.1.a: "Escort the imperial grain convoys into the Golden Horn."
 oe_wp32_sit.1.b: "Tighten Bosporus customs tolls on Italian ships."
 oe_wp32_sit.1.c: "Appoint a skilled Sitonia Prefect to audit the horrea."
 oe_wp32_sit.1.d: "Square-rigged grain cogs laden deep with Crimean, Danubian, and Thracian wheat crowd the narrow current of the Bosporus, their sails bristling with Venetian and Genoese pennants alongside Roman banners. How Constantinople governs the Sitonia—whether by escorting imperial convoys, levying stiff customs tolls, or appointing a sharp grain prefect—will decide both the loaf price in our markets and our leverage over Latin republics."
 oe_wp32_sit.1.t: "The Sitonia Grain Trade Opens"
 oe_wp32_sit.2.a: "Store the surplus in Constantinople's imperial granaries."
 oe_wp32_sit.2.b: "Export licensed cargoes to Mediterranean markets for gold."
 oe_wp32_sit.2.c: "Reserve half for the horrea and expand harbor warehouses."
 oe_wp32_sit.2.d: "Timely spring rains across the northern Black Sea steppe, the Danubian flats, and the rolling plains of Thrace have yielded an extraordinary wheat harvest. Long flotillas of flat-bottomed barges now queue off the Mangana wharves waiting to unload golden grain. Our treasury clerks eye the surging Mediterranean export prices, while city prefects urge packing the imperial horrea against leaner years."
 oe_wp32_sit.2.t: "Bumper Harvest from the Pontic Plains"
 oe_wp32_sit.3.a: "The Queen of Cities shall never know hunger!"
 oe_wp32_sit.3.b: "Capitalize on Straits dominance to enrich the treasury."
 oe_wp32_sit.3.d: "Every subterranean vault and seaside horreum of Constantinople stands brimming with dry Pontic wheat, bakeries along the Mese sell abundant loaves at steady coin, and Genoese and Venetian factors wait hat-in-hand at the imperial customs house for Bosporus transit seals. Once more the Queen of Cities holds the breadbasket of the Eastern Mediterranean firmly in her imperial grasp."
 oe_wp32_sit.3.t: "Mistress of the Pontic Grain"
 oe_wp32_sit.4.a: "Record the ledgers of the Straits for posterity."
 oe_wp32_sit.4.d: "As vast Mediterranean estates recover and distant Atlantic and Levantine arteries reshape global grain markets, the fierce medieval contest over Bosporus wheat convoys gradually passes into chronicle and memory. In the Imperial Chancery, senior logothetes bind the final leather volumes of the Sitonia customs rolls, recording a decisive chapter in New Rome's economic survival."
 oe_wp32_sit.4.t: "Close of the Sitonia Era"
 oe_wp32_sit_black_sea_tariff: "Black Sea Tariff Enforcement"
 oe_wp32_sit_black_sea_tariff_desc: "Enforces imperial kommerkion customs tolls on every foreign grain vessel passing the Straits."
 oe_wp32_sit_black_sea_tariff_tt: "Raises 110 Gold and boosts trade protection, but angers Venice and Genoa and raises maritime tension."
 oe_wp32_sit_emergency_bread_dole: "Emergency Bread Dole"
 oe_wp32_sit_emergency_bread_dole_desc: "Opens the imperial horrea to distribute subsidized bread loaves across Constantinople."
 oe_wp32_sit_emergency_bread_dole_tt: "Spends 20 Granary Reserve to gain 6 Stability, 4 Legitimacy, and capital prosperity."
 oe_wp32_sit_grain_convoys: "Grain Fleet Convoys"
 oe_wp32_sit_grain_convoys_desc: "Escorts Crimean and Pontic wheat transports through the Bosporus into the Golden Horn."
 oe_wp32_sit_grain_convoys_tt: "Increases Constantinople Granary Reserve by 18 and strengthens food and maritime trade."
 oe_wp32_sit_granary: "Constantinople Granary Reserve"
 oe_wp32_sit_granary_reserve: "Constantinople Granary Reserve"
 oe_wp32_sit_granary_reserve_desc: "Purchases surplus harvest grain at wholesale prices to pack the imperial horrea."
 oe_wp32_sit_granary_reserve_tt: "Increases Constantinople Granary Reserve by 22 and eases maritime tension by 6."
 oe_wp32_sit_legend_empire: "Roman Imperial Domain"
 oe_wp32_sit_legend_latins: "Italian Grain Republics"
 oe_wp32_sit_map_empire_tt: "Imperial Straits Grain Authority"
 oe_wp32_sit_map_latin_tt: "Latin Maritime Grain Importer"
 oe_wp32_sit_need_granary_25_tt: "Constantinople Granary Reserve is at least 25."
 oe_wp32_sit_outcome_closes: "Close of the Straits Grain Era"
 oe_wp32_sit_outcome_closes_desc: "Shifts in Mediterranean trade routes or the loss of the Queen of Cities bring the Sitonia era to a close."
 oe_wp32_sit_outcome_closes_tt: "The year reaches 1460 or Constantinople is no longer held by the Roman Empire."
 oe_wp32_sit_outcome_dominion: "Dominion of the Pontic Grain"
 oe_wp32_sit_outcome_dominion_desc: "Constantinople's imperial horrea stand overflowing and the Straits trade bows to Roman authority."
 oe_wp32_sit_outcome_dominion_tt: "Byzantium holds Constantinople with at least 20 Stability and Constantinople Granary Reserve at or above 80."
 oe_wp32_sit_tension: "Black Sea Maritime Tension"
 oe_wp32_sitonia_situation: "Sitonia: The Black Sea Grain Trade"
 oe_wp32_sitonia_situation_desc: "Constantinople's survival and maritime leverage depend upon the grain fleets sailing down from the Crimea, Danube, and Thracian plains through the Bosporus Straits, contested by Venetian and Genoese merchant republics."
 oe_wp32_triumph_africa.a: "Io Triumphe! Hail the conquerors of Africa Proconsularis!"
 oe_wp32_triumph_africa.desc: "Having secured imperial dominion across Africa Proconsularis, parade the victorious legions down the Mese beneath gilded laurel arches to Hagia Sophia, honoring the triumphator and elevating Roman prestige."
 oe_wp32_triumph_africa.title: "Celebrate the Triumph of Africa Proconsularis"
 oe_wp32_triumph_anatolia.a: "Io Triumphe! Hail the conquerors of Anatolia!"
 oe_wp32_triumph_anatolia.desc: "Having secured imperial dominion across Anatolia, parade the victorious legions down the Mese beneath gilded laurel arches to Hagia Sophia, honoring the triumphator and elevating Roman prestige."
 oe_wp32_triumph_anatolia.title: "Celebrate the Triumph of Anatolia"
 oe_wp32_triumph_arabia.a: "Io Triumphe! Hail the conquerors of Arabia Petraea!"
 oe_wp32_triumph_arabia.desc: "Having secured imperial dominion across Arabia Petraea, parade the victorious legions down the Mese beneath gilded laurel arches to Hagia Sophia, honoring the triumphator and elevating Roman prestige."
 oe_wp32_triumph_arabia.title: "Celebrate the Triumph of Arabia Petraea"
 oe_wp32_triumph_armenia_caucasus.a: "Io Triumphe! Hail the conquerors of Armenia & Iberia!"
 oe_wp32_triumph_armenia_caucasus.desc: "Having secured imperial dominion across Armenia & Iberia, parade the victorious legions down the Mese beneath gilded laurel arches to Hagia Sophia, honoring the triumphator and elevating Roman prestige."
 oe_wp32_triumph_armenia_caucasus.title: "Celebrate the Triumph of Armenia & Iberia"
 oe_wp32_triumph_britannia.a: "Io Triumphe! Hail the conquerors of Britannia!"
 oe_wp32_triumph_britannia.desc: "Having secured imperial dominion across Britannia, parade the victorious legions down the Mese beneath gilded laurel arches to Hagia Sophia, honoring the triumphator and elevating Roman prestige."
 oe_wp32_triumph_britannia.title: "Celebrate the Triumph of Britannia"
 oe_wp32_triumph_carpathia.a: "Io Triumphe! Hail the conquerors of Pannonia & Carpathia!"
