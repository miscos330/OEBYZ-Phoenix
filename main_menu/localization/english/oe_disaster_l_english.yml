l_english:
 tur_sword_crisis: "The Hollowing of Anatolia"
 tur_sword_crisis_desc: "From the 1040s, Oghuz Turks arriving from Khorasan appeared on the borders of Roman Armenia and began raiding the empire's Anatolian lands. The catastrophic defeat at the #bold #color_yellow Battle of Manzikert#!#! broke the frontier in Asia Minor. Decades of civil strife after Basil II's death and the decay of the theme system had already hollowed out the interior. Nomadic groups poured in from Armenia, roaming the river valleys and abandoned countryside as largely independent bands.\nAlthough Rome has now reconquered its lost lands, the consequences of centuries of decline still haunt Anatolia. The shadows of Turkish horsemen move across the plateau, resisting our rule."
 oe_fate_of_the_phoenix: "Fate of the Phoenix"
 oe_fate_of_the_phoenix_desc: "The empire faces a #bold #R danger#!#! greater even than that of 1204, perhaps greater than any in its history. [ShowSituationName('rise_of_the_ottomans')] has consumed our vital recruiting grounds in Asia Minor, while a rising [GetCountry('SER').GetName] threatens our Balkan territories. At home, years of weakening central authority have left disorder everywhere. Yet we shall never forget that we are heirs to the great #bold #color_yellow Romans#!#! and the #bold #color_yellow [GetCountry('BYZ').GetCulture.GetName] people#!#!. Whatever darkness and suffering lie ahead, we are determined to lead [GetCountry('BYZ').GetName] toward #bold #G a future she has never imagined#!#!."
 tur_sword_crisis_end_tt: ""
