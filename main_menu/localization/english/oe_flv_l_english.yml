 desc_oe_trait_porphyrogenitus_scholar: "A purple-born sovereign steeped in classical Greek letters, Roman jurisprudence, and imperial statecraft, elevating literacy and scholarship across the realm."
 oe_trait_porphyrogenitus_scholar_die_desc: "[CHARACTER.GetSheHe|U] was revered as a purple-born scholar whose commentaries and legal learning will long endure in the imperial academies."
 oe_trait_varangian_veteran: "Varangian Guard Veteran"
 oe_trait_varangian_veteran_desc: "A battle-hardened commander forged in the ranks of the imperial axe-guard, renowned for heavy infantry staying power and calm tactical discipline."
