 oe_trait_great_yassa_keeper: "Keeper of the Great Yassa"
 oe_trait_great_yassa_keeper_desc: "A martial sovereign upholding the Great Yassa and steppe military discipline, binding the ulus together while sharpening cavalry lethality across open terrain."
 desc_oe_trait_great_yassa_keeper: "A martial sovereign upholding the Great Yassa and steppe military discipline, binding the ulus together while sharpening cavalry lethality across open terrain."
 oe_trait_great_yassa_keeper_die_desc: "[CHARACTER.GetSheHe|U] upheld the Great Yassa throughout life, remembered across the steppe for iron cavalry discipline and unyielding authority."
 oe_trait_sanjiao_sage: "Sage of the Three Teachings"
 oe_trait_sanjiao_sage_desc: "An enlightened ruler harmonizing Confucian governance, Daoist balance, and Buddhist compassion to steady the cabinet and foster multi-faith concord."
