 oe_silk_road_garrison_stance_desc: "The [subject|e] will prioritize suppressing rebels along overland corridors, securing army logistics for imperial campaigns, and reinforcing allied armies and sieges."
 oe_silk_road_garrison_stance_desc_all: "All our [subjects|e] will prioritize suppressing rebels along overland corridors, securing army logistics for imperial campaigns, and reinforcing allied armies and sieges."
 oe_insult_byz_ven_fourth_crusade: "Lagoon peddlers who looted the Fourth Crusade dare speak of honor before [COUNTRY.GetName]? One day [TARGET_COUNTRY.GetName] will return every stolen bronze horse with interest!"
 oe_insult_byz_gen_galata: "[TARGET_COUNTRY.GetAdjective] factors are nothing but greedy leeches clinging across the Golden Horn; once our purple ensigns sail, your ledger books will serve only as kindling."
 oe_insult_byz_tur_bosphorus: "Pitching a few felt tents beside the Bosphorus does not make [TARGET_COUNTRY.GetName] an equal to millennial Rome; you are merely another passing squall from the steppe!"
 oe_insult_byz_hre_false_emperor: "Frankish pretenders by the Rhine dare usurp the title of Augustus? To the Porphyry Chamber, the crown of [TARGET_COUNTRY.GetName] is little more than a tin stage prop!"
 oe_insult_byz_catholic_schism: "[TARGET_COUNTRY.GetName] strayed from the canons of the Seven Ecumenical Councils and boasts of novelty in the West; little wonder your court lacks both orthodoxy and gravitas."
 oe_insult_byz_rebel_vassal: "Do not forget who granted [TARGET_COUNTRY.GetName] its titles and bread! Should you plot against [COUNTRY.GetName], the imperial dungeons stand ready for faithless vassals."
 oe_insult_byz_greek_fire: "Kindly line up the wooden hulls of [TARGET_COUNTRY.GetName] in neat rows; our Greek-fire siphons dearly enjoy turning a crowded fleet into a single floating torch."
 oe_insult_byz_senate_decree: "The squabbling merchants of [TARGET_COUNTRY.GetName] could not pass muster as junior clerks in the Roman Senate, yet they presume to measure empires with brass scales."
 oe_insult_byz_barbarian_crown: "When your forebears wore raw hides in the forest, Roman law already illumined the Mediterranean; does a single silk cloak make [TARGET_COUNTRY.GetName] forget its origins?"
 oe_insult_byz_heathen_foe: "How many boastful heathen hosts have broken upon the triple walls of Constantinople? If [TARGET_COUNTRY.GetName] wishes to join their ghosts, our themes gladly oblige!"
 oe_insult_yuan_rebel_prince: "Oath-breakers who trample the Great Yassa and defy the Great Khan! [TARGET_COUNTRY.GetName] bolts like an unbroken colt destined to snap its spine on the steppe."
 oe_insult_yuan_southern_rebels: "Riverine warlords crouching in the marshes dare claim Heaven's Mandate? [TARGET_COUNTRY.GetName] croaks like a frog in a well before the thunder of the imperial banners!"
 oe_insult_yuan_mandate_envoy: "The envoys of [TARGET_COUNTRY.GetName] know neither tribute etiquette nor classical letters; their petitions to [COUNTRY.GetName] serve only as jest for our court heralds."
 oe_insult_yuan_timur_usurper: "An upstart warlord in Samarkand dares cast eyes upon Hexi and the Central Plains? Let [TARGET_COUNTRY.GetName] march one league east and the desert sands will swallow your bones!"
 oe_insult_yuan_korean_tribute: "[TARGET_COUNTRY.GetName] delays its seasonal tribute and hides behind hollow words; do you imagine the Yalu River shields you from imperial reckoning? Prepare your apology!"
 oe_insult_yuan_wokou_pirates: "Island raiders and sea-robbers who strike only sleeping fishing hamlets! If [TARGET_COUNTRY.GetName] shelters pirates further, our war junks will leave not a plank afloat."
 oe_insult_yuan_jiaochao_wealth: "A single customs house of our realm yields more silver than the entire treasury of [TARGET_COUNTRY.GetName]; before rattling rusty blades, learn to keep your granaries full."
 oe_insult_yuan_keshig_riders: "When our imperial Keshig loose their whistling arrows in unison, the infantry lines of [TARGET_COUNTRY.GetName] bend and snap like dry reeds in an autumn gale."
 oe_insult_yuan_yam_speed: "Our Yam post riders carry news of victory across ten provinces faster than the generals of [TARGET_COUNTRY.GetName] can even draft an order to retreat!"
 oe_insult_yuan_western_barbarians: "Distant westerners sail half the world merely to beg for our silk, porcelain, and tea; seeing [TARGET_COUNTRY.GetName] put on haughty airs is truly amusing."
 oe_insult_rus_sarai_taxmen: "Tell the rotting tax-collectors of [TARGET_COUNTRY.GetName] that they will never extort another silver coin from the Volga or Oka! Only Rus' axes and cold steel await you!"
 oe_insult_rus_polish_sejm: "The noble assembly of [TARGET_COUNTRY.GetName] squabbles like a village fair; one drunken magnate shouting veto leaves you unable even to sign a muster roll!"
 oe_insult_rus_swedish_ice: "Has [TARGET_COUNTRY.GetName] already forgotten the icy waters of the Neva? Should your sails trespass along our eastern shores again, we shall gladly refresh your memory."
 oe_insult_rus_teutonic_knights: "Iron-clad knights sank faster than millstones through the ice of Lake Peipus—how many more armored tins does [TARGET_COUNTRY.GetName] intend to feed to our lakes?"
 oe_insult_rus_third_rome_claim: "Two Romes have faltered, yet the Third stands unshaken! The hollow Latin envoys of [TARGET_COUNTRY.GetName] will never deceive the Orthodox throne with empty parchment."
 oe_insult_rus_steppe_forts: "The old age of steppe raids is over! When the riders of [TARGET_COUNTRY.GetName] hurl themselves at our abatis lines and Streltsy volleys, only splintered bows remain."
 oe_insult_rus_ottoman_black_sea: "The northern Black Sea is no private garden for [TARGET_COUNTRY.GetName]; when our double-headed eagles march south, the Bosphorus itself shall hear the bells of Rus'!"
 oe_insult_glh_wooden_palisades: "Trembling tax-paying farmers cowering behind damp wooden palisades! If [TARGET_COUNTRY.GetName] fails to deliver horses and sables on time, our hooves will level your walls."
 oe_insult_glh_steppe_tribute: "[TARGET_COUNTRY.GetName] grazes like fat sheep along the pastures of [COUNTRY.GetName]; before our tumens mount their steeds, you had best bring us your gate keys yourselves!"
 oe_insult_glh_settled_softness: "Soft city-dwellers lounging in heated parlors cannot even draw a composite bow, yet [TARGET_COUNTRY.GetName] dares bark at the eagles of the Eternal Blue Sky?"
