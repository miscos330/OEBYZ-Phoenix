 oe_flv.1.t: "Proclaiming the Roman State Style"
 oe_flv.1.d: "Imperial secretaries and masters of ceremony present gilded chancery drafts for the formal state style inscribed upon treaties, seals, and chronicles. Whether retaining the millennial Roman imperial title, proclaiming the Senate and People under a republic, or asserting ecumenical sovereignty over both capitals, the decree rests with the state."
 oe_flv.1.a: "Maintain the style of the Roman Empire"
 oe_flv.1.b: "Proclaim Senatus Populusque Romanus"
 oe_flv.1.c: "Proclaim the Ecumenical Roman Empire"
 oe_flv.1.cancel: "Retain our current style for now"
 oe_flv.2.t: "Proclaiming the Imperial Style of the Great Khan"
 oe_flv.2.d: "Ministers of the Central Secretariat and princes of the steppe gather to confirm the sovereign style stamped upon imperial edicts: Great Yuan anchored upon Dadu, the ancestral Yeke Mongghol Ulus of the steppe, or the Northern Yuan banners of the northern frontier."
 oe_flv.2.a: "Proclaim the Great Yuan"
 oe_flv.2.b: "Restore the Yeke Mongghol Ulus"
 oe_flv.2.c: "Adopt the style of Northern Yuan"
 oe_flv.2.cancel: "Retain our current style for now"
 oe_flv.3.t: "Proclaiming the State Style of Rus'"
 oe_flv.3.d: "The Kremlin chancery and Boyar Duma submit new designs for the state seal. As the lands of Rus' gather beneath one throne, shall our treaties bear the ancient title of Grand Principality of Muscovy, the unifying style of Tsardom of All Rus', or the modern dignity of the All-Russian Empire?"
 oe_flv.3.a: "Retain the Grand Principality of Muscovy"
 oe_flv.3.b: "Proclaim the Tsardom of All Rus'"
 oe_flv.3.c: "Proclaim the All-Russian Empire"
 oe_flv.3.cancel: "Retain our current style for now"
 oe_flv.10.t: "First Milestone of the Via Imperialis"
 oe_flv.10.d: "The first stretch of our stone-flagged Via Imperialis has been laid upon deep aggregate foundations, marked by inscribed milestones measured from the capital. Merchants, couriers, and thematic regiments now move swiftly in all weather as imperial authority reaches deeper into the provinces."
 oe_flv.10.a: "Raise a milestone to Roman engineering"
 oe_flv.10.b: "Reward the laborers and provincial engineers"
 oe_flv.11.t: "First Relay Line of the Yam Post Road"
 oe_flv.11.d: "Our first fortified Yam post line has opened with fresh remount corrals, fodder depots, and paiza relay tokens. Couriers ride day and night across the horizon, binding distant provinces and caravan trade tightly to the court."
 oe_flv.11.a: "Grant golden paizas to the postal households"
 oe_flv.11.b: "Stock the waystations with fresh horses and grain"
 oe_flv.12.t: "Opening of the Siberian Trakt"
 oe_flv.12.d: "The first timber-corduroyed stretch of the Siberian Trakt now links fortified waystations through forest and frost. Winter sledges and summer caravans alike press eastward with settlers, furs, and tea, binding the distant frontier to the imperial heartland."
 oe_flv.12.a: "Honor the frontier commanders who blazed the trail"
 oe_flv.12.b: "Expand waystation timber and winter stores"
