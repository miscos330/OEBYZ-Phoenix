 oe_trait_third_rome_zealot: "Defender of the Third Rome"
 oe_trait_third_rome_zealot_desc: "A devout sovereign embracing the spiritual mantle of the Third Rome, uniting crown legitimacy with fervent Orthodox mission across the frontier."
