# NEW 2026-11-24 v25.0 Batch 3 Pack A: 1337-1460 Western & Central European Majors (CAS/ARA/POR/HAB/BOH/POL/LIT) (oe_v250_wce_, 0 mainline slots, 0 rules, 0 vanilla overrides) — english localization for Western & Central European Majors (255 keys). Edit gen_v250_1337_west_central_eu.py, not this file.
 oe_v250_wce_ref_cas_ordenamiento:0 "Ordenamiento de Alcala"
 oe_v250_wce_ref_cas_ordenamiento_desc:0 "Promulgated under Alfonso XI, this royal legal hierarchy subordinates fragmented municipal fueros and seigneurial courts to the Crown and the Siete Partidas—strengthening royal authority, tax collection, and control while provoking noble resentment and domestic friction."
 oe_v250_wce_priv_cas_mesta_guild:0 "Honrado Concejo de la Mesta"
 oe_v250_wce_priv_cas_mesta_guild_desc:0 "Confirms the Castilian sheep-owning nobility's ancient right to drive merino flocks along royal canadas from Leon to Extremadura, lifting raw wool output and overland trade at the cost of agrarian peasant grievances, greater noble clout, and reduced noble tax ceilings."
 oe_v250_wce_cab_cas_santa_hermandad:0 "Santa Hermandad Road Constabulary"
 oe_v250_wce_cab_cas_santa_hermandad_desc:0 "Deploys sworn municipal Hermandad crossbowmen to patrol Castilian highways, suppress banditry, and protect wool fairs in a target province, improving control and road commerce while irritating autonomous hidalgos and adding policing costs."
 oe_v250_wce_cab_cas_santa_hermandad_action:0 "Santa Hermandad Road Constabulary: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_wce_cab_cas_santa_hermandad_active:0 "Santa Hermandad Road Constabulary in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_wce_cab_cas_santa_hermandad_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_cas_santa_hermandad_action_progress_wordier:0 "Santa Hermandad Road Constabulary ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_cas_santa_hermandad_action_progress_tooltip:0 "Deploys sworn municipal Hermandad crossbowmen to patrol Castilian highways, suppress banditry, and protect wool fairs in a target province, improving control and road commerce while irritating autonomous hidalgos and adding policing costs."
 oe_v250_wce_cab_cas_santa_hermandad_select_province:0 "Select a Province for Santa Hermandad Patrols"
 oe_v250_wce_cab_cas_santa_hermandad_no_provinces:0 "@trigger_no! No eligible provinces available for Santa Hermandad patrols."
 oe_v250_wce_dec_cas_cortes_burgos.title:0 "Convene the Cortes of Burgos & Codify the Alcabala"
 oe_v250_wce_dec_cas_cortes_burgos.desc:0 "Summon the procuradores of Burgos, Toledo, and Valladolid to regularize the royal alcabala sales levy into a dependable Crown revenue. Costs 100 gold; boosts tax efficiency, cabinet competence, and legitimacy for 25 years while chafing burgher and peasant taxpayers."
 oe_v250_wce_dec_cas_cortes_burgos.a:0 "Ratify the Burgos Cortes Fiscal Compact"
 oe_v250_wce_dec_cas_cortes_burgos_tt:0 "Codifies the royal alcabala across Castile's Cortes cities and marks the Burgos Fiscal Compact complete."
 oe_v250_wce.1.t:0 "Alfonso XI & the Ordenamiento de Alcala"
 oe_v250_wce.1.d:0 "Royal jurists gathered at Alcala de Henares have drafted a sweeping statutory code placing the King's ordinances and the Roman-inspired Siete Partidas above the patchwork of medieval local fueros. Enforcing uniform royal appellate jurisdiction will weld Castile and Leon into a formidable fiscal monarchy, yet magnates of Lara and Haro warn that overriding ancestral charters invites aristocratic defiance."
 oe_v250_wce.1.a:0 "Enforce the Ordenamiento and curb seigneurial courts"
 oe_v250_wce.1.b:0 "Confirm ancestral fueros to keep Cortes and magnates calm"
 oe_v250_wce.1.c:0 "Staff a learned Royal Audiencia with Salamanca jurists"
 oe_v250_wce.2.t:0 "The Mesta Sheepwalks & Burgos Wool Fairs"
 oe_v250_wce.2.d:0 "Merino wool shipped from Burgos and Santander to Flemish looms has become the golden artery of Castile's treasury. Yet the Honrado Concejo de la Mesta demands royal edicts forbidding towns from enclosing pastureland along the seasonal sheepwalks—pitting export bullion and aristocratic ranching directly against Segovian weavers and peasant grain fields."
 oe_v250_wce.2.a:0 "Guarantee Mesta pasture rights and expand northern wool exports"
 oe_v250_wce.2.b:0 "Curb flock enclosures to nourish Toledo and Castilian weavers"
 oe_v250_wce.3.t:0 "The Santa Hermandad & the Granada Frontier"
 oe_v250_wce.3.d:0 "Along the rugged hills of Andalusia, skirmishes with Nasrid frontier horsemen and aristocratic feuds threaten both Seville's river commerce and the Crown's authority. Municipal leagues propose expanding the Santa Hermandad into a permanent royal crossbow and siege militia funded by the towns, whereas veteran frontier captains urge negotiating lucrative parias tribute truces with Granada until our treasury swells."
 oe_v250_wce.3.a:0 "Arm the Santa Hermandad for the Andalusian frontier"
 oe_v250_wce.3.b:0 "Strike a parias tribute truce and enrich Seville's ports"
 oe_v250_wce_ref_ara_thalassocracy:0 "Consolat de Mar Thalassocracy"
 oe_v250_wce_ref_ara_thalassocracy_desc:0 "Anchors the federated realms of Aragon, Catalonia, and Valencia upon Mediterranean maritime law, overseas consulates, and permanent war galleys—elevating sea commerce and galley combat while straining naval budgets and inland feudal levies."
 oe_v250_wce_priv_ara_catalan_cortes:0 "Usatges & Catalan Commercial Charters"
 oe_v250_wce_priv_ara_catalan_cortes_desc:0 "Guarantees the Consell de Cent of Barcelona and Valencia's merchant syndicates self-governing port courts and customs liberties, expanding maritime capacity and trade efficiency while entrenching burgher autonomy and trimming royal authority."
 oe_v250_wce_cab_ara_drassanes_consuls:0 "Consolat de Mar Admiralty Courts"
 oe_v250_wce_cab_ara_drassanes_consuls_desc:0 "Dispatches Aragonese maritime consuls from Barcelona and Valencia to adjudicate shipping contracts across the Western Mediterranean, strengthening sea trade, maritime presence, and sailor recruitment at higher fleet upkeep and inland noble discontent."
 oe_v250_wce_cab_ara_drassanes_consuls_action:0 "Consolat de Mar Admiralty Courts"
 oe_v250_wce_cab_ara_drassanes_consuls_active:0 "Active: Consolat de Mar Admiralty Courts"
 oe_v250_wce_cab_ara_drassanes_consuls_action_progress:0 "Active"
 oe_v250_wce_cab_ara_drassanes_consuls_action_progress_wordier:0 "Consolat de Mar Admiralty Courts (Active)"
 oe_v250_wce_cab_ara_drassanes_consuls_action_progress_tooltip:0 "Dispatches Aragonese maritime consuls from Barcelona and Valencia to adjudicate shipping contracts across the Western Mediterranean, strengthening sea trade, maritime presence, and sailor recruitment at higher fleet upkeep and inland noble discontent."
 oe_v250_wce_dec_ara_barcelona_drassanes.title:0 "Expand the Royal Drassanes of Barcelona"
 oe_v250_wce_dec_ara_barcelona_drassanes.desc:0 "Vault the great stone slipways of Barcelona's Drassanes to build and refit thirty royal war galleys under one roof. Costs 110 gold; boosts galley combat, ship construction speed, and sailor pools for 25 years at steep dockyard upkeep."
 oe_v250_wce_dec_ara_barcelona_drassanes.a:0 "Raise the Gothic Vaults of the Drassanes"
 oe_v250_wce_dec_ara_barcelona_drassanes_tt:0 "Completes the vaulted Royal Drassanes of Barcelona and permanently enters the Crown's naval registry."
 oe_v250_wce.4.t:0 "Peter IV the Ceremonious & the Union of Aragon"
 oe_v250_wce.4.d:0 "Defiant Aragonese and Valencian barons have revived the sworn Union of Aragon, wielding the Privilege of Union to threaten deposition whenever the Crown acts without their consent. King Peter IV—nicknamed the Ceremonious—stands ready to crush the Unionists in the field and slice their charter to ribbons with his own dagger, though moderate counselors urge elevating the independent Justicia of Aragon to mediate a lasting constitutional peace."
 oe_v250_wce.4.a:0 "Smash the Unionists and slice their privilege with the royal dagger"
 oe_v250_wce.4.b:0 "Empower the Justicia of Aragon as constitutional arbiter"
 oe_v250_wce.5.t:0 "The Consolat de Mar & the Western Mediterranean"
 oe_v250_wce.5.d:0 "From Mallorca and Cagliari to Palermo and Alexandria, Catalan cogs and Valencian galleys knit together a lucrative maritime empire—yet Genoese warships and Barbary corsairs contest every sea lane. Barcelona's jurists propose promulgating an authoritative Consolat de Mar across every Aragonese port to attract neutral shipping, while veteran admirals call instead for aggressive galley squadrons and almogaver landing companies to break rival monopolies by steel."
 oe_v250_wce.5.a:0 "Standardize Consolat de Mar courts across all ports"
 oe_v250_wce.5.b:0 "Unleash royal galleys and almogaver raiders against rivals"
 oe_v250_wce.6.t:0 "The Compromiso de Caspe"
 oe_v250_wce.6.d:0 "A dynastic succession crisis threatens to tear the Crown of Aragon into warring factions across Aragon, Catalonia, and Valencia. Rather than plunge the peninsula into civil bloodshed, nine esteemed delegates—three from each constituent realm—have convened in the castle of Caspe to adjudicate the throne by canon and civil law. Honoring their legal settlement preserves federal unity and European prestige, whereas reasserting Catalan-Valencian parliamentary supremacy shields coastal liberties at the risk of sharper constitutional friction."
 oe_v250_wce.6.a:0 "Uphold the Caspe jurists' verdict to bind the three realms"
 oe_v250_wce.6.b:0 "Expand Catalan and Valencian parliamentary charters"
 oe_v250_wce_ref_por_navigation_school:0 "Atlantic Navigation School"
 oe_v250_wce_ref_por_navigation_school_desc:0 "Unites Portuguese pilots, Genoese cartographers, and Lagos caravel shipwrights under royal patronage to master open-ocean winds and currents—accelerating exploration and maritime reach at the cost of heavier naval upkeep and smaller land manpower."
 oe_v250_wce_priv_por_order_of_christ:0 "Tomar Preceptories of the Order of Christ"
 oe_v250_wce_priv_por_order_of_christ_desc:0 "Entrusts the wealthy former Templar commanderies of Tomar to the royal Order of Christ to bankroll overseas voyages and coastal fleets, lifting naval morale and expedition speed while expanding clerical influence and lowering church tax ceilings."
 oe_v250_wce_cab_por_caravel_charts:0 "Lagos Caravel & Portolan Charting"
 oe_v250_wce_cab_por_caravel_charts_desc:0 "Assigns a royal counselor to compile secret portolan charts, astrolabe tables, and lateen-rigged caravel trials in Lisbon and Lagos—widening trade reach, exploration speed, and scholarship while taxing naval upkeep and royal revenues."
 oe_v250_wce_cab_por_caravel_charts_action:0 "Lagos Caravel & Portolan Charting"
 oe_v250_wce_cab_por_caravel_charts_active:0 "Active: Lagos Caravel & Portolan Charting"
 oe_v250_wce_cab_por_caravel_charts_action_progress:0 "Active"
 oe_v250_wce_cab_por_caravel_charts_action_progress_wordier:0 "Lagos Caravel & Portolan Charting (Active)"
 oe_v250_wce_cab_por_caravel_charts_action_progress_tooltip:0 "Assigns a royal counselor to compile secret portolan charts, astrolabe tables, and lateen-rigged caravel trials in Lisbon and Lagos—widening trade reach, exploration speed, and scholarship while taxing naval upkeep and royal revenues."
 oe_v250_wce_dec_por_lisbon_arsenal.title:0 "Charter the Ribeira das Naus & Companhia das Naus"
 oe_v250_wce_dec_por_lisbon_arsenal.desc:0 "Establish royal shipyards on the Tagus alongside King Ferdinand's mutual maritime insurance exchange so Lisbon merchants can build sturdy ocean-going naus without ruin. Costs 100 gold; boosts ship construction, sea commerce, and sailors for 25 years at steeper fleet maintenance and fidalgo resentment."
 oe_v250_wce_dec_por_lisbon_arsenal.a:0 "Open the Tagus Slips and Maritime Exchange"
 oe_v250_wce_dec_por_lisbon_arsenal_tt:0 "Founds the Ribeira das Naus shipyards and maritime insurance registry along the Tagus estuary."
 oe_v250_wce.7.t:0 "Afonso IV & the Order of Christ at Tomar"
 oe_v250_wce.7.d:0 "In the aftermath of the great Iberian victory at the Rio Salado, King Afonso IV faces a strategic choice over the vast agricultural and coastal estates held by the Order of Christ at Tomar. Channeling the Order's tithes into fortified Atlantic ports and royal captains will forge a formidable maritime shield against Marinid corsairs, whereas auditing military-order privileges for the Crown treasury would strengthen inland administration and grain output at the expense of clerical resentment."
 oe_v250_wce.7.a:0 "Channel Order of Christ tithes into Atlantic coastal fleets"
 oe_v250_wce.7.b:0 "Audit military-order estates to fund inland agriculture and taxes"
 oe_v250_wce.8.t:0 "House of Aviz, Aljubarrota & the Treaty of Windsor"
 oe_v250_wce.8.d:0 "With the Burgundian line extinct and foreign claimants pressing across the border, the Cortes of Coimbra and the guilds of Lisbon have rallied behind the Master of Aviz and Constable Nuno Alvares Pereira. Fielding disciplined dismounted foot-knights and sealing the perpetual Anglo-Portuguese Treaty of Windsor will safeguard sovereign independence—even if old fidalgo houses bristling at burgher influence must be brought to heel."
 oe_v250_wce.8.a:0 "Back the House of Aviz, infantry squares, and the Windsor alliance"
 oe_v250_wce.8.b:0 "Grant conciliatory charters to reconcile the old fidalgo houses"
 oe_v250_wce.9.t:0 "The Crossing to Ceuta & the Atlantic Horizon"
 oe_v250_wce.9.d:0 "With peace secured in Iberia, royal princes and Lagos mariners look beyond Cape Saint Vincent toward Ceuta, Madeira, and the uncharted African coast. Pouring silver into Strait garrisons and oceanic caravel expeditions promises to turn the Atlantic from a barrier into Portugal's highway, though cautious ministers warn that overseas commitments drain treasury reserves needed for Lisbon and Porto's European convoys."
 oe_v250_wce.9.a:0 "Sponsor Atlantic caravels, Strait watchposts, and ocean charts"
 oe_v250_wce.9.b:0 "Focus on Lisbon-Porto coastal commerce and European convoys"
 oe_v250_wce_ref_hab_privilegium_maius:0 "Archducal Chancellery of the Privilegium Maius"
 oe_v250_wce_ref_hab_privilegium_maius_desc:0 "Elevates the House of Habsburg above ordinary imperial princes through an indivisible Archducal chancellery in Vienna—bolstering imperial diplomacy, dynastic legitimacy, and cabinet efficiency at higher ceremonial stability and military upkeep."
 oe_v250_wce_priv_hab_alpine_tolls:0 "Inner Austrian Alpine Road & Iron Guilds"
 oe_v250_wce_priv_hab_alpine_tolls_desc:0 "Grants Styrian ironmasters and Viennese staplers privileged transit across the Semmering and Alpine passes, lifting overland trade and mineral output while boosting burgher political weight and squeezing direct burgher taxes and rural estates."
 oe_v250_wce_cab_hab_alpine_customs:0 "Inner Austrian Alpine Toll Circuit"
 oe_v250_wce_cab_hab_alpine_customs_desc:0 "Dispatches an Archducal toll commissioner to audit mountain customs houses, salt roads, and iron foundries across a target province, boosting local prosperity, production, and national tax income at the price of merchant friction and administrative strain."
 oe_v250_wce_cab_hab_alpine_customs_action:0 "Inner Austrian Alpine Toll Circuit: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_wce_cab_hab_alpine_customs_active:0 "Inner Austrian Alpine Toll Circuit in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_wce_cab_hab_alpine_customs_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_hab_alpine_customs_action_progress_wordier:0 "Inner Austrian Alpine Toll Circuit ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_hab_alpine_customs_action_progress_tooltip:0 "Dispatches an Archducal toll commissioner to audit mountain customs houses, salt roads, and iron foundries across a target province, boosting local prosperity, production, and national tax income at the price of merchant friction and administrative strain."
 oe_v250_wce_cab_hab_alpine_customs_select_province:0 "Select a Province for Alpine Toll Circuit Audit"
 oe_v250_wce_cab_hab_alpine_customs_no_provinces:0 "@trigger_no! No eligible provinces available for Alpine Toll Circuit."
 oe_v250_wce_dec_hab_vienna_university.title:0 "Found the Alma Mater Rudolphina of Vienna"
 oe_v250_wce_dec_hab_vienna_university.desc:0 "Charter a grand studium generale in Vienna to rival Prague and train Habsburg diplomats, jurists, and theologians for imperial service. Costs 110 gold; enhances research, diplomatic reputation, and clerical literacy for 25 years while expanding clerical influence and trimming tax efficiency."
 oe_v250_wce_dec_hab_vienna_university.a:0 "Issue the Foundation Charter of Vienna University"
 oe_v250_wce_dec_hab_vienna_university_tt:0 "Establishes the Alma Mater Rudolphina in Vienna and enters it into Austria's dynastic annals."
 oe_v250_wce.10.t:0 "Rudolf IV & the Privilegium Maius"
 oe_v250_wce.10.d:0 "Excluded from the seven imperial electoral votes by Charles IV's Golden Bull, young Duke Rudolf IV has commissioned his Viennese chancery to produce the Privilegium Maius—an audacious parchment claiming ancient Roman and Hohenstaufen grants of the unique title Archduke of Austria, indivisible dynastic succession, and near-sovereign autonomy. Proclaiming the charter boldly will exalt Habsburg majesty at the cost of imperial suspicion, whereas quietly courting Prague and the Electors secures smoother diplomacy at slower court prestige."
 oe_v250_wce.10.a:0 "Proclaim the Archducal title and assert Viennese sovereignty"
 oe_v250_wce.10.b:0 "Negotiate quietly with Prague to win imperial recognition"
 oe_v250_wce.11.t:0 "Alpine Passes, Styrian Iron & the Neuberg Compact"
 oe_v250_wce.11.d:0 "Habsburg lands now stretch from the Danube plains of Vienna across the Styrian iron mountains toward Carinthia and the Alpine passes. Rival dynastic branches clamor for a formal partition of Inner Austria along the lines of the Treaty of Neuberg: keeping all alpine tolls and mines under a single Viennese treasury will enrich the state at the price of estate pushback, whereas devolving mountain defenses to regional cadet diets rallies fierce alpine levies while weakening central revenue."
 oe_v250_wce.11.a:0 "Centralize Styrian iron mines and Alpine tolls under Vienna"
 oe_v250_wce.11.b:0 "Grant Inner Austrian diets regional autonomy for mountain defense"
 oe_v250_wce.12.t:0 "Imperial Diplomacy & the Danubian Inheritance"
 oe_v250_wce.12.d:0 "With the Luxembourg dynasty waning, the Imperial Crown and the thrones of Bohemia and Hungary stand within Habsburg reach—not through ruinous sieges, but through marriage contracts, inheritance compacts, and tireless Viennese embassies. Committing Austria's chanceries to grand dynastic diplomacy can anchor an enduring Central European coalition, whereas skeptical commanders warn that gilded dowries starve the armored cavalry needed to hold the Danube frontier."
 oe_v250_wce.12.a:0 "Weave marriage compacts across the Empire and Danubian courts"
 oe_v250_wce.12.b:0 "Invest in Danubian forts and Austrian heavy cavalry instead"
 oe_v250_wce_ref_boh_golden_bull_crown:0 "Crown of Saint Wenceslas & Electoral Chancery"
 oe_v250_wce_ref_boh_golden_bull_crown_desc:0 "Establishes the Lands of the Bohemian Crown as an indivisible imperial electorate centered on Prague's royal chancery—boosting scholarship, electoral diplomacy, and fiscal yields while chafing independent barons and raising standing military costs."
 oe_v250_wce_priv_boh_kutna_miners:0 "Ius Regale Montanorum of Kutna Hora"
 oe_v250_wce_priv_boh_kutna_miners_desc:0 "Confirms the celebrated Bohemian mining code for Kutna Hora's silver shafts and Italian mintmasters, surging bullion minting and raw mineral output at the price of mild silver inflation, stronger mining towns, and reduced burgher tax ceilings."
 oe_v250_wce_cab_boh_kutna_assay:0 "Kutna Hora Royal Silver Assay"
 oe_v250_wce_cab_boh_kutna_assay_desc:0 "Dispatches Crown assayers from the Italian Court of Kutna Hora to inspect shafts, drainage adits, and ore smelters in a target province—boosting local mineral yield, production, and national minting at the cost of slight inflation and peasant labor strain."
 oe_v250_wce_cab_boh_kutna_assay_action:0 "Kutna Hora Royal Silver Assay: [SCOPE.sProvince('target').GetNameWithNoTooltip]"
 oe_v250_wce_cab_boh_kutna_assay_active:0 "Kutna Hora Royal Silver Assay in [SCOPE.sProvince('target').GetNameWithHighlightOnly]"
 oe_v250_wce_cab_boh_kutna_assay_action_progress:0 "[SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_boh_kutna_assay_action_progress_wordier:0 "Kutna Hora Royal Silver Assay ([SCOPE.sProvince('target').GetNameWithNoTooltip]): [SCOPE.sProvince('target').GetAverageControl|V%2]"
 oe_v250_wce_cab_boh_kutna_assay_action_progress_tooltip:0 "Dispatches Crown assayers from the Italian Court of Kutna Hora to inspect shafts, drainage adits, and ore smelters in a target province—boosting local mineral yield, production, and national minting at the cost of slight inflation and peasant labor strain."
 oe_v250_wce_cab_boh_kutna_assay_select_province:0 "Select a Province for Royal Silver & Ore Assay"
 oe_v250_wce_cab_boh_kutna_assay_no_provinces:0 "@trigger_no! No eligible provinces available for Royal Silver Assay."
 oe_v250_wce_dec_boh_new_town_prague.title:0 "Build the Stone Bridge & New Town of Prague"
 oe_v250_wce_dec_boh_new_town_prague.desc:0 "Span the Vltava with a monumental stone bridge and lay out the spacious squares and markets of Prague's New Town after Charles IV's grand urban design. Costs 120 gold; boosts realm prosperity, development, and overland commerce for 25 years while weighing on tax revenues and domestic stability costs."
 oe_v250_wce_dec_boh_new_town_prague.a:0 "Lay the Foundation Stone on the Vltava"
 oe_v250_wce_dec_boh_new_town_prague_tt:0 "Inaugurates Prague's monumental stone bridge and New Town markets under the Crown of Saint Wenceslas."
 oe_v250_wce.13.t:0 "Charles IV & the Founding of Charles University"
 oe_v250_wce.13.d:0 "With Papal bull and royal golden seal in hand, King Charles IV proposes founding the very first studium generale north of the Alps and east of the Rhine—right in the heart of Prague. Endowing the four faculties of theology, law, medicine, and arts will draw scholars from every Central European kingdom to Bohemia, though pragmatic treasurers argue the Crown's silver could instead harden border castles and royal toll roads."
 oe_v250_wce.13.a:0 "Charter Charles University as Central Europe's beacon of learning"
 oe_v250_wce.13.b:0 "Prioritize royal toll roads and frontier fortresses instead"
 oe_v250_wce.14.t:0 "Kutna Hora Silver Groschen & the Golden Bull"
 oe_v250_wce.14.d:0 "The deep silver lodes of Kutna Hora pour vast streams of Prague Groschen into Bohemia's coffers at the very moment the Golden Bull codifies the King of Bohemia as foremost secular Elector of the Empire. Preserving the legendary silver purity of the Groschen cements Prague's credit and imperial prestige across Europe, whereas pressing the shafts at maximum output floods the treasury with bullion at the risk of monetary inflation and exhausted miners."
 oe_v250_wce.14.a:0 "Guard the purity of the Prague Groschen and electoral primacy"
 oe_v250_wce.14.b:0 "Push Kutna Hora's silver shafts to maximum extraction"
 oe_v250_wce.15.t:0 "The Bohemian Estates & Wagon-Fort Warfare"
 oe_v250_wce.15.d:0 "Fiery reformist preaching in Prague's Bethlehem Chapel and bitter disputes over church wealth have convulsed the Bohemian Estates. Veteran commanders like Jan Zizka demonstrate how armored battle wagons—wagenburgs—bristling with hand-gonnes and flails can shatter imperial knightly charges, while moderate Utraquist barons urge signing the Compactata to heal the realm's confessional rift with Rome and neighboring princes."
 oe_v250_wce.15.a:0 "Adopt fortified wagenburg tactics and militant estate levies"
 oe_v250_wce.15.b:0 "Broker the Compactata compromise with moderate Utraquist barons"
 oe_v250_wce_ref_plc_statutes_union:0 "Statutes of Wislica & Grand Ducal Chancery"
 oe_v250_wce_ref_plc_statutes_union_desc:0 "Harmonizes Casimir III's royal Polish statutes with the multilingual Ruthenian-Lithuanian chancery of Vilnius—lifting cabinet competence, manpower reserves, and confessional tolerance while yielding noble tax limits and Crown leverage."
 oe_v250_wce_priv_plc_szlachta_bajorai:0 "Koszyce & Horodlo Heraldic Land Charters"
 oe_v250_wce_priv_plc_szlachta_bajorai_desc:0 "Confirms the landed szlachta and Lithuanian bajorai in shared heraldic privileges and light land taxes in return for mounted knightly banners—strengthening heavy cavalry and manpower while dramatically expanding aristocratic political clout."
 oe_v250_wce_cab_plc_frontier_starosts:0 "Royal Starosts & Eastern March Wardens"
 oe_v250_wce_cab_plc_frontier_starosts_desc:0 "Empowers Crown starosts and castle wardens along the Vistula, Nemunas, and Dnieper marches to patrol steppes and fortify river crossings—sharpening light cavalry, control, and defensive grit at higher army upkeep and magnate friction."
 oe_v250_wce_cab_plc_frontier_starosts_action:0 "Royal Starosts & Eastern March Wardens"
 oe_v250_wce_cab_plc_frontier_starosts_active:0 "Active: Royal Starosts & Eastern March Wardens"
 oe_v250_wce_cab_plc_frontier_starosts_action_progress:0 "Active"
 oe_v250_wce_cab_plc_frontier_starosts_action_progress_wordier:0 "Royal Starosts & Eastern March Wardens (Active)"
 oe_v250_wce_cab_plc_frontier_starosts_action_progress_tooltip:0 "Empowers Crown starosts and castle wardens along the Vistula, Nemunas, and Dnieper marches to patrol steppes and fortify river crossings—sharpening light cavalry, control, and defensive grit at higher army upkeep and magnate friction."
 oe_v250_wce_dec_plc_krakow_vilnius_charter.title:0 "Endow the Krakow Studium & Vilnius Trade Charter"
 oe_v250_wce_dec_plc_krakow_vilnius_charter.desc:0 "Invest royal bullion into Krakow's pioneering university chairs and Vilnius's Magdeburg merchant guildhalls to anchor law, learning, and Baltic-Black Sea trade. Costs 100 gold; boosts research, overland commerce, and realm prosperity for 25 years while trimming direct tax yields and enlarging burgher influence."
 oe_v250_wce_dec_plc_krakow_vilnius_charter.a:0 "Seal the Academic & Municipal Charters"
 oe_v250_wce_dec_plc_krakow_vilnius_charter_tt:0 "Endows Krakow's Studium Generale and the Vilnius municipal charter within the realm's royal register."
 oe_v250_wce.16.t:0 "Statutes of Wislica & the Krakow Academy"
 oe_v250_wce.16.d:0 "Across the Vistula and Nemunas, fragmented provincial customs hamper royal justice and leave frontier courts in the hands of local voivodes. Inspired by Casimir III's landmark Statutes of Wislica and plans for a royal Studium Generale in Krakow, court jurists propose codifying written statutory law and training secular crown officials—whereas powerful magnates demand wider hereditary jurisdictions in return for fielding full mounted banners."
 oe_v250_wce.16.a:0 "Codify uniform statutes and train royal jurists at the Academy"
 oe_v250_wce.16.b:0 "Confirm magnate voivode jurisdictions to swell mounted banners"
 oe_v250_wce.17.t:0 "The Gediminid Eastern Reach & Trakai Watchtowers"
 oe_v250_wce.17.d:0 "From the lake-ringed brick citadels of Trakai to the wide Ruthenian plains of the Dnieper and Galicia, our eastern borderlands bring together Catholic towns, Orthodox boyars, and Tatar steppe marches. Governing under the celebrated Gediminid maxim—preserving old customs while introducing no arbitrary innovations—will rally multi-confessional subjects to our banners, whereas entrusting the frontier to strict Latin castle garrisons hardens border defense at higher fortress costs and local friction."
 oe_v250_wce.17.a:0 "Honor Ruthenian charters and Orthodox boyars across the east"
 oe_v250_wce.17.b:0 "Fortify lake and river strongholds with strict knightly garrisons"
 oe_v250_wce.18.t:0 "Union of Krewo & the Pact of Horodlo"
 oe_v250_wce.18.d:0 "With the Teutonic Order's crusading castles pressing ever deeper along the Baltic and Pomeranian marches, Polish lords and Lithuanian boyars have forged a historic dynastic bridge through the Union of Krewo and the heraldic brotherhood of Horodlo. Adopting dozens of Lithuanian noble clans into Polish coats of arms will weld an unstoppable joint cavalry host against common foes, though staunch centralizers warn that shared noble liberties permanently erode sovereign royal prerogative."
 oe_v250_wce.18.a:0 "Seal the Krewo-Horodlo heraldic union against the Baltic threat"
 oe_v250_wce.18.b:0 "Guard an independent sovereign chancery and direct royal revenues"
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_cas_cortes:0 "Cortes of Burgos Alcabala Compact"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_cas_cortes:0 "Regularized alcabala assessments anchor Castilian finances and royal authority, though heavier market exactions weigh on townsfolk and tenant farmers."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev1_alcala_supremacy:0 "Royal Supremacy of Alcala"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev1_alcala_supremacy:0 "Uniform royal statutes tighten Crown control, administrative reach, and estate balance across Castile while angering old magnate houses and straining domestic harmony."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev1_fueros_confirmed:0 "Confirmed Castilian Fueros"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev1_fueros_confirmed:0 "Respecting traditional regional charters secures magnate cooperation and domestic tranquility at the price of softer Crown power and narrower tax revenues."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev1_salamanca_audiencia:0 "Salamanca Royal Audiencia"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev1_salamanca_audiencia:0 "University-trained letrados elevate Castilian jurisprudence, scholarship, and royal prestige, though clerical influence grows and treasury stipends rise."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev2_mesta_exports:0 "Mesta Merino Wool Supremacy"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev2_mesta_exports:0 "Protected transhumance herds flood northern ports with prized raw wool and customs silver, while squeezing domestic clothmakers and tenant croplands."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev2_castilian_looms:0 "Castilian Urban Loom Revival"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev2_castilian_looms:0 "Retaining fine wool for domestic guilds strengthens Castilian manufacturing and urban prosperity while displeasing landed Mesta magnates and curbing raw overland trade."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev3_hermandad_march:0 "Santa Hermandad Frontier Militia"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev3_hermandad_march:0 "Disciplined town-funded crossbowmen and siege engineers sharpen Castilian morale, siegecraft, and manpower at higher army upkeep and aristocratic friction."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev3_parias_truce:0 "Andalusian Parias & River Commerce"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev3_parias_truce:0 "Frontier truces and Nasrid gold channel wealth into Seville's docks and the royal exchequer, though crusading zeal cools and clergy murmur against compromise."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_ara_drassanes:0 "Royal Drassanes of Barcelona"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_ara_drassanes:0 "Covered stone shipyards along Barcelona's shore turn out rapid Aragonese galley squadrons, though timber imports and yard wages weigh heavily on the treasury."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev4_peter_dagger:0 "Peter the Dagger's Crown Authority"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev4_peter_dagger:0 "Shattering the baronial Union consolidates Aragonese royal power, military discipline, and administrative control while breeding deep noble bitterness and domestic unrest."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev4_justicia_pact:0 "Constitutional Arbitration of the Justicia"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev4_justicia_pact:0 "Institutionalizing the Justicia stabilizes Aragon's federated realms, raises legitimacy, and wins diplomatic esteem, at the cost of constrained royal power and entrenched barons."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev5_consolat_law:0 "Standardized Consolat de Mar"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev5_consolat_law:0 "Trusted maritime tribunals elevate Catalan sea commerce, naval morale, and Mediterranean presence while demanding steady fleet patrols and diverting funds from inland garrisons."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev5_almogaver_fleets:0 "Almogaver & Corsair Galley Squadrons"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev5_almogaver_fleets:0 "Fierce amphibious raids sharpen galley combat power and troop resolve, yet alarm Mediterranean courts and disrupt peaceful overland trade."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev6_caspe_verdict:0 "Legal Compact of Caspe"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev6_caspe_verdict:0 "A peaceful juridical succession reinforces Aragonese legitimacy, cabinet coordination, and foreign esteem, while embedding strong estate checks upon royal prerogative."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev6_cortes_primacy:0 "Catalan-Valencian Cortes Primacy"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev6_cortes_primacy:0 "Generous urban liberties spur craft output and burgher loyalty across the Mediterranean coast, at the price of looser royal authority and thornier realm-wide governance."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_por_ribeira:0 "Ribeira das Naus & Companhia das Naus"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_por_ribeira:0 "Insured Lisbon merchantmen and royal Tagus shipwrights turn Portugal into an Atlantic maritime hub, while dockyard wages weigh on the fleet budget and inland nobles grumble."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev7_tomar_fleets:0 "Order of Christ Maritime Shield"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev7_tomar_fleets:0 "Tomar commandery rents fund patrolling fleets and seasoned sailors along the Algarve, while deepening clerical influence and diverting direct Crown revenues."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev7_royal_audit:0 "Crown Inquiricoes Estate Audit"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev7_royal_audit:0 "Royal land inquiries reclaim misappropriated rents and raise domestic output across Coimbra and the Alentejo, yet anger both ecclesiastical orders and landed fidalgos."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev8_aviz_windsor:0 "Aviz Infantry & Windsor Compact"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev8_aviz_windsor:0 "Battle-tested defensive squares and English maritime friendship lift Portuguese morale, discipline, and diplomatic standing while alienating old magnates and raising army upkeep."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev8_fidalgo_reconciliation:0 "Fidalgo Estate Conciliation"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev8_fidalgo_reconciliation:0 "Confirming ancestral fidalgo holdings calms the countryside and lowers stability costs, yet disappoints Lisbon's merchant guilds and narrows royal centralization."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev9_atlantic_horizon:0 "Ceuta & Atlantic Exploration Initiative"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev9_atlantic_horizon:0 "Dedicated caravel yards and cartographers extend Portuguese trade range, light-ship combat, and discovery speed, demanding heavy fleet spending and direct fiscal sacrifice."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev9_european_convoys:0 "Lisbon-Porto European Convoy Trade"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev9_european_convoys:0 "Steady wine, salt, and cloth shipments to northern Europe enrich Portuguese ports and boost domestic prosperity, while dampening crusading prestige and martial ardor."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_hab_rudolphina:0 "Alma Mater Rudolphina of Vienna"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_hab_rudolphina:0 "Scholars and canonists trained in Vienna raise Austria's intellectual prestige and diplomatic finesse across the Empire, though endowed church chairs widen clerical clout."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev10_archducal_claim:0 "Archducal Sovereignty of the Privilegium Maius"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev10_archducal_claim:0 "Claiming near-electoral status elevates Habsburg legitimacy, prestige, and Crown cohesion, while provoking imperial skepticism and chafing provincial barons."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev10_imperial_compromise:0 "Imperial Conciliation Policy"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev10_imperial_compromise:0 "Patient diplomatic deference earns goodwill across the Reichstag and calms domestic estates, though the court's prestige and direct centralization advance more slowly."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev11_unified_alpine_tolls:0 "Unified Inner Austrian Toll Treasury"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev11_unified_alpine_tolls:0 "Direct Viennese wardens extract rich iron output, road tolls, and higher provincial control, while provoking aristocratic resistance and merchant irritation."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev11_alpine_militias:0 "Inner Austrian Mountain Diets & Levies"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev11_alpine_militias:0 "Empowered alpine estates fortify every pass and expand manpower pools, at the cost of decentralized royal authority and lighter central taxation."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev12_danubian_diplomacy:0 "Habsburg Imperial Marriage Network"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev12_danubian_diplomacy:0 "Lavish embassies and succession treaties elevate Austrian diplomatic stature, capacity, and vassal loyalty while straining treasury revenues and military budgets."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev12_danube_knights:0 "Danubian Heavy Cavalry & Fortresses"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev12_danube_knights:0 "Hardening river garrisons and knightly lances strengthens battlefield resilience and fortress defense while sacrificing imperial court goodwill and domestic ease."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_boh_prague_newtown:0 "Stone Bridge & New Town of Prague"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_boh_prague_newtown:0 "Prague's grand stone bridge and planned New Town draw merchants and master builders from across Central Europe, though royal construction levies strain treasury returns."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev13_charles_university:0 "Charles University of Prague"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev13_charles_university:0 "Central Europe's premier university accelerates Bohemian scholarship, urban literacy, and royal prestige while committing Crown stipends and enlarging clerical influence."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev13_bohemian_forts:0 "Bohemian Highway & Bastion Priority"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev13_bohemian_forts:0 "Channeling bullion into customs stations and ring-fortresses raises tax collection and defensive security, while slowing scholarly progress and disappointing learned clergy."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev14_prague_groschen:0 "Sound Prague Groschen & Electoral Primacy"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev14_prague_groschen:0 "Unblemished silver coinage wins Europe-wide merchant trust, diplomatic authority, and royal legitimacy while foregoing debasement windfalls and restraining noble mint liberties."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev14_silver_surge:0 "Kutna Hora Silver Extraction Surge"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev14_silver_surge:0 "Intensive deep-shaft mining swells royal minting and raw mineral output, at the cost of creeping silver inflation and harsh burdens on rural laborers."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev15_wagenburg_doctrine:0 "Bohemian Wagenburg War Doctrine"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev15_wagenburg_doctrine:0 "Interlocked armored battle wagons and zealous citizen infantry forge formidable discipline, defensive tenacity, and battlefield morale while isolating Bohemia diplomatically and alienating orthodox clergy."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev15_compactata_peace:0 "Bohemian Compactata Settlement"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev15_compactata_peace:0 "Confessional coexistence calms internal strife, wins diplomatic relief across the Empire, and fosters religious tolerance, at the price of weaker Crown authority and softer martial fervor."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_dec_plc_studium:0 "Krakow Studium & Vilnius Trade Charter"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_dec_plc_studium:0 "Royal jurists and chartered burghers revitalize Polish-Lithuanian learning, amber-grain highways, and urban prosperity while conceding municipal tax exemptions."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev16_wislica_statutes:0 "Statutes of Wislica & Royal Jurists"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev16_wislica_statutes:0 "Written statutory law and academy-trained clerks elevate cabinet efficiency, scholarship, and territorial control while provoking magnate displeasure and royal outlays."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev16_voivode_banners:0 "Magnate Voivode Cavalry Banners"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev16_voivode_banners:0 "Generous seigneurial charters summon formidable heavy horsemen and larger provincial levies, at the price of softer royal leverage and rising aristocratic clout."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev17_ruthenian_charters:0 "Gediminid Ruthenian Conciliation"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev17_ruthenian_charters:0 "Respecting local Orthodox charters secures vast eastern manpower, smooth territorial control, and confessional peace while irritating Latin prelates and trimming direct royal power."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev17_trakai_bastions:0 "Trakai & Frontier Castle Ring"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev17_trakai_bastions:0 "Brick watchtowers and veteran castle garrisons stiffen battlefield morale and defensive resilience across the Baltic-Steppe roads, though upkeep and peasant corvee burdens climb."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev18_horodlo_union:0 "Union of Krewo & Horodlo Brotherhood"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev18_horodlo_union:0 "Shared Polish-Lithuanian heraldic banners unleash surging morale, heavy cavalry dominance, and diplomatic prestige while entrenching aristocratic liberties over the throne."
 STATIC_MODIFIER_NAME_oe_v250_wce_mod_ev18_sovereign_chancery:0 "Independent Sovereign Chancery"
 STATIC_MODIFIER_DESC_oe_v250_wce_mod_ev18_sovereign_chancery:0 "Refusing sweeping noble concessions strengthens Crown authority and direct taxation, yet cools cross-border alliances and dissatisfies ambitious magnates."
