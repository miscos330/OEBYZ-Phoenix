 OE_V49_MP_GUI_HDR_ERA: "Active Span"
 OE_V49_MP_GUI_HDR_METER: "Freebooter Index"
 OE_V49_MP_GUI_CARD_TITLE: "Steel for Silver, Sails for Prize"
 OE_V49_MP_GUI_CARD_BODY: "Issue Letters of Marque, charter region-matched legendary companies (Swiss Guard, Varangians, Black Army, Cossack Sich), establish Armed Royal Chartered Companies, or unite maritime realms to co-opt and sweep freebooter coves."
 OE_V49_MP_GUI_GAUGE_LABEL: "Sovereign Order (0) <-> Freebooter Ascendancy (100)"
 OE_V49_MP_GUI_FOOTNOTE: "After 1650, reaching 92+ crowns the Golden Age of Free Companies & Corsairs; pushing down to 8 or below establishes Sovereign Admiralty & Standing Armies."
 oe_sit_v49_great_persons: "Dynamic Great Persons Court Bidding"
 oe_sit_v49_great_persons_desc: "From Belisarius and Ibn Khaldun to Leonardo da Vinci, Michelangelo, Wang Yangming, Qi Jiguang, Xu Guangqi, Isaac Newton, Voltaire, and Mozart, epoch-defining polymaths, strategists, philosophers, and artists tour royal courts across all twelve historical eras — awaiting the sovereign bold enough to outbid rivals and endow their genius."
 oe_v49_gp_end_republic_of_letters: "Universal Republic of Letters & Genius"
 oe_v49_gp_end_republic_of_letters_desc: "Generations of competitive royal patronage, endowed academies, and transnational salons have forged a lasting Republic of Letters binding East and West in shared scientific and artistic brilliance."
 oe_v49_gp_end_immortal_legacy: "Immortal Legacy of the Masters"
 oe_v49_gp_end_immortal_legacy_desc: "Though the great masters of past centuries have passed into history, their printed treatises, domes, symphonies, and academies endure as cornerstones of modern civilization."
 oe_v49_gp_map_classical_med_tt: "#Y Classical Mediterranean & Maghreb Sphere (Belisarius, Ibn Khaldun)#!"
 oe_v49_gp_map_renaissance_tt: "#Y Renaissance & Imperial Salon Heartlands (Da Vinci, Michelangelo, Mozart)#!"
 oe_v49_gp_map_east_asia_tt: "#Y East Asian Academies & Martial-Scientific Sphere (Wang Yangming, Qi Jiguang, Xu Guangqi)#!"
 oe_v49_gp_map_enlightenment_tt: "#Y Atlantic Royal Societies & Enlightenment Letters (Newton, Voltaire)#!"
 oe_v49_gp_legend_classical_med: "Classical Mediterranean (Belisarius, Ibn Khaldun)"
 oe_v49_gp_legend_renaissance: "Renaissance & Vienna (Da Vinci, Michelangelo, Mozart)"
 oe_v49_gp_legend_east_asia: "East Asian Masters (Wang Yangming, Qi Jiguang, Xu Guangqi)"
 oe_v49_gp_legend_enlightenment: "Enlightenment Societies (Isaac Newton, Voltaire)"
 OE_V49_GP_GUI_HDR_ERA: "Active Span"
 OE_V49_GP_GUI_HDR_METER: "Patronage Index"
 OE_V49_GP_GUI_CARD_TITLE: "Courts Bid for the Geniuses of History"
 OE_V49_GP_GUI_CARD_BODY: "Outbid rival courts for touring historical masters across 520-1836, endow Royal Academy Chairs, commission monumental masterworks, publish combined-arms treatises, and host transnational salons."
 OE_V49_GP_GUI_GAUGE_LABEL: "Global Republic of Letters & Court Patronage"
 OE_V49_GP_GUI_FOOTNOTE: "Each historical master appears within their authentic historical window from Belisarius (520-565) through Mozart (1775-1791). Reaching 95+ after 1785 crowns the Universal Republic of Letters."
 oe_v49_mp_act_letters_of_marque: "Issue Trans-Oceanic Letters of Marque"
 oe_v49_mp_act_letters_of_marque_desc: "Grant royal commissions to seasoned corsair and privateer captains to raid hostile shipping lanes and divide prize silver with the treasury."
 oe_v49_mp_act_letters_of_marque_tt: "Raises Freebooter Network Index by #G +8#!, grants #Y Trans-Oceanic Letters of Marque#! for 12 years, and awards #G +4#! Navy Tradition."
 oe_v49_mp_act_charter_company: "Charter Legendary Mercenary Company"
 oe_v49_mp_act_charter_company_desc: "Retain the premier contract company of your theater and era — Swiss Royal Guard, Varangian Free Company, Hungarian Black Army, Cossack Sich, or elite sea raiders."
 oe_v49_mp_act_charter_company_tt: "Raises Freebooter Network Index by #G +7#!, grants your regional & era-matched #Y Legendary Company Modifier#! for 12 years, and awards #G +4#! Army Tradition."
 oe_v49_mp_act_coopt_pirates: "Co-Opt Pirate Fleets into Royal Navy"
 oe_v49_mp_act_coopt_pirates_desc: "Extend royal pardons and admiralty commissions to notorious pirate squadrons, absorbing their fast hulls and secret reef charts into the state fleet."
 oe_v49_mp_act_coopt_pirates_tt: "Lowers Freebooter Network Index by #G -8#! (toward Sovereign Order), grants #Y Co-Opted Corsair Royal Squadron#! for 12 years, and awards #G +5#! Navy Tradition."
 oe_v49_mp_act_anti_piracy_pact: "Forge Anti-Piracy Escort League"
 oe_v49_mp_act_anti_piracy_pact_desc: "Organize multinational convoy escorts, coastal beacon chains, and shared harbor intelligence to purge corsair coves along vital sea lanes."
 oe_v49_mp_act_anti_piracy_pact_tt: "Lowers Freebooter Network Index by #G -9#! (toward Sovereign Order) and grants #Y Anti-Piracy Convoy & Escort League#! for 12 years."
 oe_v49_mp_act_cossack_charter: "Grant Frontier Free-Company Charter"
 oe_v49_mp_act_cossack_charter_desc: "Confer tax-exempt marcher autonomy upon Cossack, steppe, and borderland free companies in return for permanent border defense and swift levies."
 oe_v49_mp_act_cossack_charter_tt: "Raises Freebooter Network Index by #G +6#! and grants #Y Frontier Free-Company Autonomy Charter#! for 12 years."
 oe_v49_mp_act_royal_chartered_co: "Establish Armed Royal Chartered Company"
 oe_v49_mp_act_royal_chartered_co_desc: "Incorporate an armed joint-stock overseas merchant company authorized to raise private forts, fit out armed Indiamen, and defend distant spice and silver lanes."
 oe_v49_mp_act_royal_chartered_co_tt: "Lowers Freebooter Network Index by #G -4#!, grants #Y Armed Royal Chartered Company#! for 12 years, and awards #G +5#! Prestige."
 oe_v49_gp_act_royal_bidding: "Launch Royal Bidding for Touring Masters"
 oe_v49_gp_act_royal_bidding_desc: "Dispatch envoys bearing gilded stipends and royal letters of welcome to outbid rival courts for traveling generals, polymaths, and virtuoso artists."
 oe_v49_gp_act_royal_bidding_tt: "Raises Global Court Patronage Index by #G +7#!, grants #Y Sovereign Court Patronage Auction#! for 12 years, and awards #G +5#! Prestige."
 oe_v49_gp_act_academy_chair: "Endow Royal Academy Chief Chair"
 oe_v49_gp_act_academy_chair_desc: "Establish a permanent endowed chair in astronomy, jurisprudence, and natural philosophy to anchor visiting geniuses and accelerate national scholarship."
 oe_v49_gp_act_academy_chair_tt: "Raises Global Court Patronage Index by #G +8#! and grants #Y Endowed Royal Academy Chair#! for 12 years."
 oe_v49_gp_act_commission_masterwork: "Commission Immortal Masterwork & Chronicle"
 oe_v49_gp_act_commission_masterwork_desc: "Bankroll monumental domes, sculpted masterpieces, musical cycles, and encyclopedic chronicles that broadcast your dynasty's brilliance across continents."
 oe_v49_gp_act_commission_masterwork_tt: "Raises Global Court Patronage Index by #G +7#!, grants #Y Immortal Commissioned Masterworks#! for 12 years, and awards #G +6#! Prestige."
 oe_v49_gp_act_military_treatise: "Publish Modern Military & Ordnance Treatise"
 oe_v49_gp_act_military_treatise_desc: "Have court strategists and master gunners codify combined-arms formations, siege geometry, and firearms drills into printed manuals for every garrison."
 oe_v49_gp_act_military_treatise_tt: "Raises Global Court Patronage Index by #G +6#!, grants #Y Printed Combined-Arms Martial Treatise#! for 12 years, and awards #G +5#! Army Tradition."
 oe_v49_gp_act_grand_salon: "Host Transnational Salon of Ideas"
 oe_v49_gp_act_grand_salon_desc: "Convene envoys, philosophers, and visiting scholars from East and West in gilded palace salons to debate law, science, and arts."
 oe_v49_gp_act_grand_salon_tt: "Raises Global Court Patronage Index by #G +8#! and grants #Y Transnational Salon of Letters#! for 12 years."
 oe_v49_mp.1.title: "Proclamation of the Brethren of Nassau"
 oe_v49_mp.1.desc: "Out of the shallow coral harbors of the West Indies comes word that hundreds of mutinous sailors, unemployed privateers, and defiant quartermasters have raised black banners and declared a self-governing Brethren of the Coast. Electing their own captains and dividing Spanish and Atlantic silver by strict written articles, this floating pirate republic mocks royal governors while tempting every ambitious merchant port with cheap contraband."
 oe_v49_mp.1.a: "Grant covert asylum and sell them letters of marque against our rivals."
 oe_v49_mp.1.b: "Dispatch royal frigates to blockade the reefs and crush the republic."
 oe_v49_mp.1.c: "Quietly tax their contraband auctions through colonial prize courts."
 oe_v49_mp.2.title: "Barbary Corsair Squadrons Sweep the Sea Lanes"
 oe_v49_mp.2.desc: "Low-slung xebecs and oared galleys flying the banners of the Barbary corsair captains have struck merchant convoys at dawn, slipping effortlessly through windless calms where heavy square-rigged warships lie helpless. Coastal towns ring alarm bells from their watchtowers, merchants beg for armed escorts, and veterans whisper that only swift counter-corsairs or iron naval squadrons can match the seasoned Mediterranean raiders."
 oe_v49_mp.2.a: "Commission swift counter-corsair xebecs to raid their strongholds."
 oe_v49_mp.2.b: "Fund fortified watchtowers and permanent anti-piracy escort patrols."
 oe_v49_mp.2.c: "Negotiate maritime tribute treaties to buy safe passage for our traders."
 oe_v49_mp.3.title: "Heroic Stand of the Swiss Royal Guard"
 oe_v49_mp.3.desc: "When hostile shock troops and court conspirators lunged toward the royal pavilion under cover of smoke, our contracted Swiss Reislaufer company formed an impenetrable hedge of eighteen-foot pikes and gleaming halberds. Singing mountain hymns through musket volleys and refusing every bribe to lay down arms, the Alpine veterans held the gate until reinforcements arrived, earning awe across every court in Christendom."
 oe_v49_mp.3.a: "Double their silver stipend and renew their lifelong palace charter."
 oe_v49_mp.3.b: "Have their captains codify Swiss pike discipline for our own regulars."
 oe_v49_mp.3.c: "Reward the surviving captains with noble estates and honorary titles."
 oe_v49_mp.4.title: "Payroll Crisis of the Black Army"
 oe_v49_mp.4.desc: "Modeled on the feared standing mercenary host of the Carpathian basin, our professional Black Army banners — armored horsemen, Bohemian wagon-gunners, and veteran siege engineers — have halted outside winter quarters with banners furled. Three months of arrears remain unpaid as feudal magnates resist new war taxes, and the mercenary colonels warn calmly that unpaid steel quickly finds another sovereign employer."
 oe_v49_mp.4.a: "Strike emergency war silver and pay every mercenary banner in full."
 oe_v49_mp.4.b: "Settle arrears with frontier land charters and autonomous military colonies."
 oe_v49_mp.4.c: "Disband the costliest banners and rely on loyal crown regulars instead."
 oe_v49_mp.5.title: "Arrival of the Varangian Axe-Bearers"
 oe_v49_mp.5.desc: "Dragon-prowed longships and broad-shouldered northern warriors clad in gleaming mail have arrived at our gates bearing long-hafted Dane axes and sworn oaths of personal service. Unentangled in local noble factions and renowned from the northern fjords to the Bosphorus for ferocity in the shield-wall, these Varangian mercenaries seek a worthy patron who pays in pure gold coin and battle honors."
 oe_v49_mp.5.a: "Swear them in as the sovereign's personal Varangian Free Company."
 oe_v49_mp.5.b: "Charter their longships to patrol our coastal trade routes."
 oe_v49_mp.5.c: "Hire their veteran sergeants solely as drill instructors for native levies."
 oe_v49_mp.6.title: "Cossack Chaika Flotilla Strikes Across the Frontier"
 oe_v49_mp.6.desc: "From fortified river islands beyond the steppe frontier, hundreds of Zaporozhian Cossack warriors have launched shallow reed-sheathed chaika boats loaded with matchlocks and light swivel guns. Slipping past fortress booms at night, they have struck hostile border depots and returned singing with plunder — yet neighboring ambassadors furiously accuse our court of unleashing uncontrollable frontier freebooters."
 oe_v49_mp.6.a: "Confirm the Sich autonomy register and recruit their swift horse and boats."
 oe_v49_mp.6.b: "Grant border estate rights while binding their hetman to royal war orders."
 oe_v49_mp.6.c: "Disavow the raiders and garrison regular frontier regiments instead."
 oe_v49_mp.7.title: "Capture of the Silver Treasure Galleon"
 oe_v49_mp.7.desc: "Church bells ring across our main harbor as three battered privateer frigates tow a towering, gilded treasure galleon through the breakwater! Her hold groans with stamped silver ingots, cochineal dye, and silk bales wrested from rival sea lanes after a running two-day gunnery duel. Crowds cheer on the quayside while admiralty clerks, merchant guildmasters, and privateer captains clamor over how the crown will divide this staggering windfall."
 oe_v49_mp.7.a: "Claim the royal fifth through the Prize Court and fill the treasury."
 oe_v49_mp.7.b: "Invest the captured bullion to capitalize an Armed Royal Chartered Company."
 oe_v49_mp.7.c: "Share generous prize bounties with the crews to draw daring captains to our flag."
 oe_v49_mp.8.title: "The Rogue Captain: Royal Pardon or the Gallows?"
 oe_v49_mp.8.desc: "Iron-chained yet smiling with insolent calm, the most feared pirate commodore of the surrounding seas stands before our admiralty tribunal. He offers an audacious bargain: spare his neck and grant a King's Pardon, and he will surrender his concealed careening coves, twenty seasoned gun crews, and secret charts of every reef and convoy route. Outraged merchants demand his immediate hanging at Execution Dock."
 oe_v49_mp.8.a: "Grant a Royal Pardon and commission him as Rear-Admiral of Coast Guards."
 oe_v49_mp.8.b: "Hang him at Execution Dock in chains to prove the crown's iron law at sea."
 oe_v49_mp.8.c: "Secretly release him with fresh powder and orders to harry hostile ports."
 oe_v49_mp.9.title: "Letters of Marque Ignite Maritime Reprisals"
 oe_v49_mp.9.desc: "Our aggressive commerce-raiding commissions have provoked fierce retaliation across distant trade hubs: foreign admiralties have begun issuing counter-letters of marque against our own spice and textile hulls. Maritime insurers double their premiums overnight as dockside syndicates argue whether to escalate the shadow war at sea or establish neutral prize arbitration."
 oe_v49_mp.9.a: "Expand the privateer registry and authorize bold deep-water raids."
 oe_v49_mp.9.b: "Underwrite armed merchant convoys to protect our commercial lifeline."
 oe_v49_mp.9.c: "Open impartial Admiralty Prize Courts to restore neutral shipping confidence."
 oe_v49_mp.10.title: "Free Company Auction at the Border Fair"
 oe_v49_mp.10.desc: "Following the end of a distant continental war, battle-hardened mercenary colonels have marched three thousand disciplined pikemen, lancers, and sappers to the great border trade fair, openly auctioning their banners to the highest-paying sovereign. Rival envoys already weigh chests of florins and silver thalers at the inn tables; whoever signs these veterans gains instant battlefield steel while denying them to neighbors."
 oe_v49_mp.10.a: "Outbid every rival envoy and retain the entire legendary company."
 oe_v49_mp.10.b: "Offer frontier garrison charters instead of heavy upfront gold."
 oe_v49_mp.10.c: "Poach only their master drillmasters and artillerymen for our regular army."
 oe_v49_mp.11.title: "Armed Chartered Company Petitions for Sovereign Cannon"
 oe_v49_mp.11.desc: "The board of directors of our overseas trading syndicate has arrived in velvet cloaks bearing brass models of thirty-gun Indiamen and star-shaped coastal forts. To defend spice warehouses and bullion depots from privateers and rival fleets half a world away, they request royal license to cast private cannon, hire mercenary sepoys, and enforce monopoly navigation — promising overflowing customs dividends in return."
 oe_v49_mp.11.a: "Grant the full Armed Chartered Company patent and monopoly rights."
 oe_v49_mp.11.b: "Require company ships to serve as auxiliary royal escorts in wartime."
 oe_v49_mp.11.c: "Refuse private armies and keep all overseas trade open to crown customs."
 oe_v49_mp.12.title: "Congress of the Anti-Piracy Escort League"
 oe_v49_mp.12.desc: "Admirals and port syndics from maritime realms across the basin have convened beneath striped harbor pavilions to draft a joint charter against lawless piracy. Proposals on the table include standardized convoy lantern codes, mutual harbor refit rights for pirate-hunting squadrons, and an explicit ban on harboring rogue captains — a test of whether our court truly prizes safe sea lanes above covert raiding."
 oe_v49_mp.12.a: "Lead the Escort League and pledge our squadrons to sweep every pirate cove."
 oe_v49_mp.12.b: "Fund joint coastal lighthouses and admiralty intelligence without surrendering privateers."
 oe_v49_mp.12.c: "Quietly walk out and welcome displaced freebooters into our secret anchorages."
 oe_v49_mp.13.title: "Mutiny in the Mercenary Camp"
 oe_v49_mp.13.desc: "Drums beat a defiant roll across the river meadows where our hired foreign companies sit encamped. Enraged by clipped coinage and delayed supply wagons, mercenary sergeants have formed an elected camp council and seized the ammunition train, threatening to march on prosperous market towns unless paid in pure gold coin before sundown."
 oe_v49_mp.13.a: "Dispatch wagons of assayed gold coin immediately to restore camp order."
 oe_v49_mp.13.b: "Surround the camp with loyal crown regulars and disarm the ringleaders."
 oe_v49_mp.13.c: "Renegotiate their contract with border land plots and lower cash pay."
 oe_v49_mp.14.title: "Twilight of the Freebooters: Law of the High Seas"
 oe_v49_mp.14.desc: "Copper-sheathed ships of the line and disciplined national conscript armies are steadily squeezing the wild margins where pirate republics and wandering free companies once reigned supreme. Admiralty jurists present a landmark Maritime Code banning unlicensed privateering forever, while grizzled mercenary captains argue that flexible contract steel and daring raiders remain indispensable in an uncertain world."
 oe_v49_mp.14.a: "Proclaim the Sovereign Maritime & Standing Army Code across the realm."
 oe_v49_mp.14.b: "Absorb veteran captains into our Royal Naval Academy and officer corps."
 oe_v49_mp.14.c: "Preserve our clandestine privateer and free-company networks for future wars."
 oe_v49_gp.1.title: "Belisarius: Last of the Romans Enters Court Bidding"
 oe_v49_gp.1.desc: "A hush falls across the war council as envoys report that Flavius Belisarius — the peerless master of mobile cataphract cavalry, frugal supply lines, and lightning reconquest — is open to sovereign command! Veteran bucellarii retainers swear by his name from the Euphrates to Carthage, and rival courts already dispatch chests of solidi hoping to lure the great strategist into reshaping their armies."
 oe_v49_gp.1.a: "Outbid every rival court and appoint Belisarius Supreme Commander."
 oe_v49_gp.1.b: "Commission him to codify siege logistics and cavalry drill manuals."
 oe_v49_gp.1.c: "Honor him with a triumphal banquet while preserving treasury reserves."
 oe_v49_gp.2.title: "Ibn Khaldun Brings the Muqaddimah to Our Chancery"
 oe_v49_gp.2.desc: "Caravans from the Maghreb and Cairo bring a renowned jurist, diplomat, and historian whose sweeping treatise, the Muqaddimah, dissects the rise and decay of dynasties, the power of social cohesion, and the hidden curve linking lighter taxes to richer treasuries. Princes from Granada to Damascus bid eagerly for Ibn Khaldun's counsel; welcoming him promises unmatched clarity for our cabinet and archives."
 oe_v49_gp.2.a: "Appoint Ibn Khaldun Grand Chancellor of Archives and Statecraft."
 oe_v49_gp.2.b: "Endow a dedicated Academy Chair for his comparative history lectures."
 oe_v49_gp.2.c: "Sponsor translations of his fiscal essays for provincial tax clerks."
 oe_v49_gp.3.title: "Leonardo da Vinci Seeks a Royal Patron"
 oe_v49_gp.3.desc: "A Florentine courier unrolls mirror-script notebooks covered with astonishing diagrams: portable pontoon bridges, multi-barrelled cannon, canal locks, anatomical studies, and sketches of serene portraits glowing with subtle shadow. Leonardo da Vinci is weighing competing stipends from Milan, Florence, France, and beyond — demanding freedom to pursue both engineering marvels and luminous painting in a well-funded atelier."
 oe_v49_gp.3.a: "Win the bidding war and fund Leonardo's grand polymath atelier."
 oe_v49_gp.3.b: "Direct his genius toward fortress bastions, canals, and siege machines."
 oe_v49_gp.3.c: "Purchase copies of his mechanical codices for our royal library."
 oe_v49_gp.4.title: "Michelangelo Buonarroti: Marble, Dome & Sovereign Splendor"
 oe_v49_gp.4.desc: "Fierce, solitary, and unrivaled with chisel, fresco brush, and architectural compass alike, Michelangelo Buonarroti has finished quarrying white marble and listens closely to royal envoys competing for his next monumental commission. Whether raising a soaring capital dome, carving heroic marble statues, or laying out angled artillery bastions, his name alone guarantees centuries of awe for any patron bold enough to bear his fiery temper and princely fees."
 oe_v49_gp.4.a: "Commission a soaring capital dome, marble gallery, and star bastions."
 oe_v49_gp.4.b: "Endow a royal sculpture and architectural guild under his master plans."
 oe_v49_gp.4.c: "Acquire a single marble masterpiece for the throne room and spare the budget."
 oe_v49_gp.5.title: "Wang Yangming: Unity of Knowledge and Action"
 oe_v49_gp.5.desc: "Scholars and frontier governors alike marvel at the teachings of Wang Yangming, the brilliant philosopher-general who pairs incisive Neo-Confucian philosophy — the Unity of Knowledge and Action — with lightning counterinsurgency campaigns and lucid provincial administration. Inviting him to lecture at court and overhaul provincial governance promises both spiritual renewal and iron practical efficiency."
 oe_v49_gp.5.a: "Entrust Wang Yangming with cabinet reform and frontier pacification."
 oe_v49_gp.5.b: "Open provincial Mind-Learning academies to invigorate young officials."
 oe_v49_gp.5.c: "Print his collected dialogues while keeping conservative ritual ministries intact."
 oe_v49_gp.6.title: "Qi Jiguang Presents the Jixiao Xinshu Drill Manual"
 oe_v49_gp.6.desc: "General Qi Jiguang — celebrated victor over coastal raiders and northern cavalry alike — lays his meticulously illustrated treatise, the Jixiao Xinshu, before the throne. Rejecting empty parade-ground flourishes, he champions tightly knit twelve-man Mandarin Duck combined-arms squads pairing shields, bamboo lances, pikes, and matchlock volleys, backed by strict silver pay and watchtower fortifications."
 oe_v49_gp.6.a: "Fund Qi Jiguang's elite combined-arms regiments and frontier watchtowers."
 oe_v49_gp.6.b: "Print and distribute the Jixiao Xinshu drill manual to every garrison."
 oe_v49_gp.6.c: "Adopt his coastal signal system and award him ceremonial honors."
 oe_v49_gp.7.title: "Xu Guangqi: East-West Astronomy, Agronomy & Heavy Cannon"
 oe_v49_gp.7.desc: "Surrounded by brass armillary spheres, translated volumes of Euclid's Elements, New-World sweet-potato sprouts, and blueprints for long-range bronze artillery, the polymath scholar-minister Xu Guangqi petitions the court for a bold synthesis of Eastern and Western learning. By uniting precise calendar astronomy, famine-proof agronomy, and modern gun-founding, his bureau could lift harvest, science, and firepower in a single generation."
 oe_v49_gp.7.a: "Endow Xu Guangqi's Imperial Translation, Agronomy & Ordnance Bureau."
 oe_v49_gp.7.b: "Focus his scholars on astronomy, geometry, and our Royal Academy."
 oe_v49_gp.7.c: "Publish his agricultural manual across the provinces for famine relief."
 oe_v49_gp.8.title: "Isaac Newton: Principia and Reform of the Royal Mint"
 oe_v49_gp.8.desc: "A prism splits palace sunlight across oak desks stacked with Latin equations describing universal gravitation, planetary orbits, and the calculus of motion. Yet Isaac Newton is no idle theorist: summoned before the treasury as well as the Royal Society, he proposes milled-edge silver coinage and ruthless assay inspections to annihilate coin-clipping alongside optical tables that sharpen oceanic navigation."
 oe_v49_gp.8.a: "Appoint Newton President of the Academy and Warden of the Royal Mint."
 oe_v49_gp.8.b: "Grant him an endowed chair to train naval astronomers and engineers."
 oe_v49_gp.8.c: "Subsidize publication of his Principia across European universities."
 oe_v49_gp.9.title: "Voltaire: The Razor Wit of the Enlightenment Arrives"
 oe_v49_gp.9.desc: "Carriages jam the palace courtyard as the most celebrated — and dangerous — pen in Europe steps forth with a mocking bow. Crowned monarchs from Potsdam to St. Petersburg correspond eagerly with Voltaire, whose sparkling essays champion religious tolerance, scientific reason, and legal reform even as his satire skewers pompous courtiers and rigid censors alike. Welcoming him electrifies literacy and prestige, though orthodox estates brace for scandal."
 oe_v49_gp.9.a: "Welcome Voltaire as royal correspondent and protect his Enlightenment press."
 oe_v49_gp.9.b: "Seat him at the head of a Transnational Salon of diplomats and scholars."
 oe_v49_gp.9.c: "Applaud his tragedies politely while keeping press censorship firmly intact."
 oe_v49_gp.10.title: "Wolfgang Amadeus Mozart: Symphony of the Imperial Court"
 oe_v49_gp.10.desc: "Candlelit chandeliers shimmer over breathless ambassadors as Wolfgang Amadeus Mozart strikes the final radiant chord of a newly improvised piano concerto. Every court theater in Europe whispers his name; offering him a permanent Imperial Kapellmeister stipend and full opera orchestra would turn our capital into the undisputed musical crown of the age while charming every visiting envoy."
 oe_v49_gp.10.a: "Appoint Mozart Imperial Kapellmeister with a lavish royal orchestra."
 oe_v49_gp.10.b: "Commission a grand dynastic opera cycle celebrating our realm."
 oe_v49_gp.10.c: "Grant a generous concert purse and sponsor public music conservatories."
 oe_v49_gp.11.title: "Rival Court Poaching Bid!"
 oe_v49_gp.11.desc: "Intercepted diplomatic pouches reveal that a wealthy rival sovereign has dispatched secret envoys with double stipends, marble townhouses, and gilded medals to lure our most celebrated resident master away to a foreign academy! Courtiers clamor that losing such a luminary would be a humiliating blow to imperial prestige, while frugal treasurers grimace at the spiraling cost of keeping pace in the international bidding war."
 oe_v49_gp.11.a: "Outbid the foreign envoys at once with an unmatched royal stipend."
 oe_v49_gp.11.b: "Offer a permanent Royal Academy Chair and autonomous research grant."
 oe_v49_gp.11.c: "Permit an honorable foreign lecture tour while archiving all notebooks at home."
 oe_v49_gp.12.title: "Interdisciplinary Breakthrough at the Royal Academy"
 oe_v49_gp.12.desc: "Years of lavish patronage have borne dazzling fruit! Mathematicians, cartographers, metallurgists, and visiting polymaths working side by side inside our Royal Academy have unveiled a breakthrough uniting precision astronomical tables with improved metallurgical casting. Scholars urge immediate open publication to ignite national literacy, while generals and guild syndics each lobby to claim the discovery first."
 oe_v49_gp.12.a: "Publish the breakthrough openly across all universities and academies."
 oe_v49_gp.12.b: "Channel the metallurgical discovery directly into our arsenals and manuals."
 oe_v49_gp.12.c: "Auction royal patent licenses to merchant syndicates to refill the treasury."
 oe_v49_gp.13.title: "Unveiling of an Immortal Commissioned Masterwork"
 oe_v49_gp.13.desc: "Silk curtains part to thunderous applause as the great masterwork commissioned by our court is unveiled before foreign ambassadors, guild masters, and assembled citizens. Whether luminous architecture, illuminated world maps, or timeless musical and literary folios, its perfection proclaims that our realm leads the civilized world in taste, wealth, and daring imagination."
 oe_v49_gp.13.a: "Host a grand international exhibition to broadcast our cultural supremacy."
 oe_v49_gp.13.b: "Distribute printed folios and engravings to foreign chanceries as diplomatic gifts."
 oe_v49_gp.13.c: "Open the gallery free to citizens to foster civic pride and domestic harmony."
 oe_v49_gp.14.title: "The Grand Cross-Cultural Salon Debates"
 oe_v49_gp.14.desc: "Under vaulted palace lamps, visiting thinkers, diplomats, and strategists from distant continents clash in spirited debate over law, scientific empiricism, fiscal reform, and the true sources of national greatness. Radical scholars urge sweeping institutional openness, moderate counselors advise harmonizing innovation with ancient custom, and traditionalists warn that unchecked salon wit erodes solemn reverence."
 oe_v49_gp.14.a: "Champion bold cross-cultural inquiry and institutionalize the Grand Salon."
 oe_v49_gp.14.b: "Synthesize East-West archives into a balanced universal Republic of Letters."
 oe_v49_gp.14.c: "Uphold traditional estate orthodoxy and moderate salon publications."
