l_english:
 oe_sit_v49_mercs_and_privateers: "Legendary Mercenaries & Privateer Networks"
 oe_sit_v49_mercs_and_privateers_desc: "Across thirteen centuries from the Varangian Guard and Swiss Reislaufer to the Black Army of Hungary, Zaporozhian Cossack Sich, Barbary Corsairs, and the Brethren of Nassau, contract armies and privateer fleets sell steel and seamanship to the highest bidder while testing sovereign control over war and trade."
 oe_v49_mp_end_freebooter_age: "Golden Age of Free Companies & Corsairs"
 oe_v49_mp_end_freebooter_age_desc: "Unchecked letters of marque, frontier autonomous hosts, and elite free companies have made mercenary steel and privateer seamanship permanent pillars of global power."
 oe_v49_mp_end_sovereign_order: "Sovereign Admiralty & Standing Armies"
 oe_v49_mp_end_sovereign_order_desc: "Anti-piracy convoy leagues, royal pardons absorbing corsair captains, and disciplined state regulars have brought the wild high seas and contract battlefields under sovereign law."
 oe_v49_mp_end_twilight: "Twilight of the Old Free Companies"
 oe_v49_mp_end_twilight_desc: "Industrialized navies and national conscription close the storied era of wandering free companies and golden-age privateer republics."
 oe_v49_mp_map_caribbean_tt: "#Y Brethren of Nassau & Caribbean Privateer Basin#!"
 oe_v49_mp_map_barbary_tt: "#Y Barbary Corsair Strongholds & Mediterranean Raiding Coast#!"
 oe_v49_mp_map_swiss_tt: "#Y Swiss Reislaufer & Western European Mercenary Contracts#!"
 oe_v49_mp_map_varangian_tt: "#Y Varangian Axe-Bearer Sea Routes & Imperial Guard Sphere#!"
 oe_v49_mp_map_black_army_tt: "#Y Black Army of Hungary Standing Mercenary Heartland#!"
 oe_v49_mp_map_cossack_tt: "#Y Zaporozhian Cossack Sich & Pontic Steppe Flotillas#!"
