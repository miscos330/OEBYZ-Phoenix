 oe_syn.1.t: "Prester John Across the Red Sea: Aksum, Constantinople & Lisbon Envoys"
 oe_syn.1.d: "A diplomatic vessel bearing scarlet-cross sails glides into a coral-stone Red Sea harbor on the monsoon breeze. Aboard meet Solomonic imperial envoys from the Ethiopian highlands in white-and-gold brocade alongside ambassadors and matchlock gunsmiths from Constantinople, Rome, and Lisbon. Upon the cedar table lie illuminated Ge'ez liturgical volumes, finely inlaid arquebuses, and maritime charts—the fabled realm of Prester John has become a living trans-continental alliance."
 oe_syn.1.a: "Seal the military-theological pact, sharing gunsmiths and Red Sea charts"
 oe_syn.1.b: "Prioritize a Red Sea port trade charter for highland gold and coffee"
 oe_syn.1.chalcedon_gold_tt: "#P Chalcedon Reconciliation Golden Resonance:#! Because Chalcedonian reconciliation is already achieved, this pact ascends into the Alexandria-Constantinople-Aksum Sacred Accord for 35 years!"
 oe_syn.2.t: "World Meridian in Ink: From Timbuktu to Constantinople, Venice & Jiangnan"
 oe_syn.2.d: "An unprecedented scholarly marvel unfolds across the studies of the Old World: Saharan astronomical parchments from Timbuktu's Sankore Madrasah travel via Mediterranean and monsoon caravans to meet Istanbul's movable-type editions, Venetian Aldine octavos, and Jiangnan Wuxian and Jianyang mathematical woodblocks upon a single celestial table. For the first time, four scripts and four printing traditions collate the very same night sky."
 oe_syn.2.a: "Sponsor the polyglot collation and publish the Meridian Compendium"
 oe_syn.2.b: "License domestic presses to reprint translations and foster literacy"
 oe_syn.2.sahara_resonance_tt: "#P Saharan Scholar Caravan Resonance:#! Our completed Saharan Scholar Caravan plugs directly into Sankore's manuscript network for an additional 30-year research and cultural bonus!"
 oe_syn.3.t: "Monsoon Anti-Blockade Triangle: Kilwa, Diu & Red Sea Gunboat Dhows"
 oe_syn.3.d: "Confronted by Cartaz sea blockades and punitive tolls across the Indian Ocean, Kilwa's coral-stone harbors weave a swift counter-network with Diu and the Red Sea ports. Swahili war dhows laden with Sofala gold and ivory mount bronze swivel guns and trade secret monsoon tide charts with allied Arabian Sea squadrons, declaring that no single crown owns the trade winds."
 oe_syn.3.a: "Form joint gunboat dhow squadrons to shatter the Cartaz blockade"
 oe_syn.3.b: "Proclaim an East African-Indian Ocean free-port league to outflank monopoly"
 oe_syn.4.t: "Quito Equatorial Meridian Survey: Andean Observatory & Royal Academy"
 oe_syn.4.d: "Amid the three-thousand-meter volcanic peaks around Quito, geodetic envoys from the Royal Academies set up brass quadrants and triangulation beacons alongside Andean high-altitude astronomers steeped in solar calendars and quipu reckoning. Across cloud-swept ridges they complete the historic measurement of an equatorial meridian arc, proving Earth's oblate form in a landmark handshake of world science."
 oe_syn.4.a: "Fund the equatorial triangulation and publish the Quito Celestial Atlas"
 oe_syn.4.b: "Honor the surveying mission and disseminate its cartographic methods"
 oe_syn.5.t: "Chesapeake Grand Council & Roman Senate: Atlantic Constitutional Dialogue"
 oe_syn.5.d: "Where marble porticoes meet elm-bark longhouses beside the golden twilight of Chesapeake Bay, the enduring compact between Nova Elysia and the Five Nations sparks a historic constitutional colloquium. Holding sacred wampum belts beside a gilded Roman eagle standard, Haudenosaunee speakers and purple-bordered senators debate federal consensus under the Great Law of Peace alongside senatorial checks and balances."
 oe_syn.5.a: "Weave Great Law consensus with senatorial jurisprudence into our governance"
 oe_syn.5.b: "Guarantee Atlantic fur, maize, and ironware trade under joint treaty seals"
 oe_syn.6.t: "Iron-Curtain Longhouse: Double-Headed Eagle vs Pan-American League"
 oe_syn.6.d: "Peace fires no longer rise along the Appalachian ridges; instead, Roman frontier star forts face the war beacons of a united Haudenosaunee-Cahokian resistance league. Eagle legions press forward behind disciplined musketry while the Pan-American coalition counters with captured firearms, woodland ambushes, and ironclad confederate solidarity—reshaping the destiny of the continent in fire and steel."
 oe_syn.6.a: "Mobilize elite regiments and woodland skirmishers for continental supremacy"
 oe_syn.6.b: "Fortify river valleys with interlocking stone redoubts and palisades"
 oe_syn.7.t: "Trans-Oceanic Pharmacopoeia & Immunity: From Tenochtitlan to London & Beijing"
 oe_syn.7.d: "As Mesoamerican herbal treatises from Tenochtitlan and fever-breaking Andean cinchona bark cross the oceans and roll off printing presses in London, Constantinople, and Beijing, a quiet medical revolution saves countless lives across both hemispheres. Before the combined force of printed trans-oceanic pharmacopoeia and public quarantine, the dreaded Great Pestilence finally begins to recede."
 oe_syn.7.a: "Establish public pharmacopoeia bureaus to distribute remedies nationwide"
 oe_syn.7.b: "Publish the Global Botanical Compendium for academies and court physicians"
 oe_syn.8.t: "98/98 Collector's Milestone: The Republic of All Nations"
 oe_syn.8.d: "Bathed in golden daylight beneath a soaring neoclassical rotunda, scholars, navigators, and envoys from Europe, the Mediterranean, East Asia, Ethiopia, Timbuktu, Kilwa, Tenochtitlan, Cusco, and the Haudenosaunee longhouses gather around a monumental brass globe. All ninety-eight grand arcs converge here—not as the monologue of a single empire, but as The Republic of All Nations, where four continents illuminate one shared Enlightenment."
 oe_syn.8.a: "Inscribe the Golden Charter of the Republic of All Nations for all posterity"
