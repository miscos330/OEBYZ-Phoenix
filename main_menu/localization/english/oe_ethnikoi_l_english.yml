l_english:
 oe_ir_expand_hetaireia: "Expand the Hetaireia"
 oe_ir_expand_hetaireia_done: "Hetaireia Expansion Completed"
 oe_ir_expand_hetaireia_desc: "Revised military rolls and enlarged quarters will make room for new ranks of standing soldiers. The Empire will expand its Hetaireia barracks to accommodate them.\n\nCosts #Y 50 Authority#!. Increases the maximum level of Hetaireia Barracks by #G 1#!, from 1 to 2. Can be completed only once."
 OE_IR_EXPAND_HETAIREIA_EFFECT: "Permanently increases the maximum level of Hetaireia Barracks by #G 1#!, from #Y 1#! to #Y 2#!. Each completed level provides #G 1#! Hetaireia slot and #G 1#! independent Ethnikoi slot."
 OE_ETHNIKOI_CAP_TT: "The total number of Ethnikoi across all eras must be below the completed Hetaireia Barracks levels in directly owned locations. This pool is independent of Hetaireia heavy infantry."
 oe_ethnikoi_1: "Ethnikoi"
 oe_ethnikoi_1_desc: "Enrolled on the imperial military rolls, these light infantry support the heavy battle line with flexible formations. They scout ahead, seize key ground before the main force deploys, and swiftly fill gaps in a wavering front.\n\nInitiative #G +3#!, Strength Damage Taken #G −10%#!, Combat Speed #G +0.1#!. Each completed Hetaireia Barracks level provides #G 1#! slot shared by all Ethnikoi eras, independently of Hetaireia heavy infantry."
