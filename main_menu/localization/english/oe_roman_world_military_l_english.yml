l_english:
 oe_rw_mobilize_border: "Mobilize Frontier Forces"
 oe_rw_mobilize_border_desc: "Turkic beyliks at war may pay one month of tax and trade income for +20% army levy size for one year. Three-year cooldown. Eligible AI countries execute automatically. Paid from the national treasury; no imperial treasury, authority or public opinion cost."
 oe_rw_latin_instructors_action: "Invite Latin Military Instructors"
 oe_rw_latin_instructors_action_desc: "Roman claimants, despots and Latin principalities may pay one month of tax and trade income for +2.5% discipline for three years and a 2.5 shift toward Plural Identity. Shares a three-year cooldown with Study Roman Tactics. No imperial treasury, authority or public opinion cost."
 oe_rw_study_roman_tactics: "Study Roman Tactics"
 oe_rw_study_roman_tactics_desc: "All members may pay one month of tax and trade income for +5% army morale for three years and a 2.5 shift toward Roman Identity. Shares a three-year cooldown with Invite Latin Military Instructors. No imperial treasury, authority or public opinion cost."
 oe_rw_challenge_empire: "Openly Challenge the Empire"
 oe_rw_challenge_empire_desc: "Visible only to the strongest member without Roman legitimacy. While at peace and able to declare war on the owner of Constantinople, spend 10 prestige for a five-year casus belli to conquer its province. Mutual opinion falls by 50 and recovers yearly. Five-year cooldown. Does not immediately declare war or transfer Roman legitimacy. No gold, imperial treasury, authority or public opinion cost."
 oe_rw_border_mobilization: "Frontier Mobilization"
 oe_rw_border_mobilization_desc: "Frontier communities supply additional wartime levies."
 oe_rw_latin_instructors: "Latin Military Instructors"
 oe_rw_latin_instructors_desc: "Latin instructors train our troops."
 oe_rw_roman_tactics: "Roman Tactical Studies"
 oe_rw_roman_tactics_desc: "Roman military learning strengthens confidence in our army."
 oe_rw_imperial_challenge_opinion: "Challenged the Empire"
 oe_cb_challenge_roman_empire: "Contest the Imperial Center"
 oe_cb_challenge_roman_empire_desc: "Conquer the province of Constantinople and challenge its owner for Roman legitimacy."
 OE_RW_MONTHLY_INCOME_AFFORD: "The national treasury can cover one month of tax and trade income"
 OE_RW_MILITARY_STUDY_READY: "The shared three-year military study cooldown has ended"
