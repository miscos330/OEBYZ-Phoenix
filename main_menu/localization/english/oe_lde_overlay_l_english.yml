l_english:
 oe_lde_none: ""
 oe_lde_ctry_YHN: "The Branch Secretariat of Henan and Jiangbei was set up in 1291 with its seat at Bianliang (Kaifeng). It governed the central plain between the Yellow River and the Yangtze, across which ran the grain routes and post roads linking Dadu with the south. A branch secretariat was no fief: its chancellors and chief councillors were appointed and recalled by the court and answered to the Central Secretariat.\n\nIn 1337 Banghu of Xinyang raised an incense-burning sect in revolt, and Qingtong, the province's assistant of the left, put it down. Fourteen years later, in 1351, Liu Futong rose at Yingzhou and the Red Turbans swept the province; in 1358 they took Bianliang and made it the capital of Han Lin'er. Chaghan Temür won the city back the next year, and the Ming northern expedition of 1368 ended the province."
 oe_lde_ctry_YJZ: "The Branch Secretariat of Jiangzhe grew out of the Jianghuai secretariat founded at Yangzhou in 1276. Its seat moved to Hangzhou in 1284 and it took the name Jiangzhe in 1291, governing what is now Zhejiang, Fujian and the parts of Jiangsu and Anhui south of the Yangtze. It was the richest province of the empire: more than a third of the grain tax came from here and went north to Dadu each year by sea.\n\nThe court's lifeline was also its weak point. In 1348 Fang Guozhen took to the sea and cut the grain fleets; in 1356 Zhang Shicheng seized Pingjiang and Zhu Yuanzhang took Jiqing, and the province survived in name only. Between 1357 and 1366 Fujian was further torn by the Ispah Rebellion led in Quanzhou by the Persian commanders Saif al-Din and Nawna, until the Yuan loyalist Chen Youding pacified the province and recovered Quanzhou; Hangzhou itself changed hands several times before falling to Zhu Yuanzhang in 1366."
 oe_lde_ctry_YJX: "The Branch Secretariat of Jiangxi was set up in 1277 with its seat at Longxing (Nanchang). It governed most of what is now Jiangxi together with Guangdong, reaching the sea at Guangzhou, a great port of ocean-going ships, while the Gan River carried traffic between the far south and the Yangtze.\n\nIn 1337 Zhu Guangqing of Zengcheng rose in Guangdong and proclaimed a state called Great Jin; the province's troops put him down. After 1351 Xu Shouhui's Red Turbans broke into Jiangxi, and in 1358 Chen Youliang took Longxing. The city went over to Zhu Yuanzhang in 1362; the next year Chen besieged it for eighty-five days without success and was destroyed in the battle on Lake Poyang."
 oe_lde_ctry_YHG: "The Branch Secretariat of Huguang had its seat at Wuchang and governed what is now Hunan, Guangxi, Hainan, most of Guizhou and southern Hubei, one of the widest provinces of the Yuan. Deep in its hills lived the Yao, Zhuang and Miao under hereditary native officials, and its chief councillors were forever raising troops for campaigns against them.\n\nFrom the end of 1336 the Yao of Guangxi rose again and again, and the province's chief councillor took the field. In 1351 Xu Shouhui proclaimed himself emperor at Qishui in the neighbouring province, and his men briefly took Wuchang the next year. In 1360 Chen Youliang killed Xu and made Wuchang his capital; Zhu Yuanzhang took the city in 1364 and Huguang with it."
 oe_lde_ctry_YSX: "The Branch Secretariat of Shaanxi had its seat at Fengyuan (Xi'an; renamed from Anxi in 1312) and governed the Wei valley, northern Shaanxi, Hanzhong and eastern Gansu. Khubilai's son Manggala, Prince of Anxi, once held court here with wide powers; in 1307 his son Ananda was killed in a bid for the throne, the princely establishment was abolished and the region came directly under the province. Sichuan had been split off as a province of its own in 1286.\n\nIn 1357 a Red Turban column entered the Wei valley and was driven out by Chaghan Temür and Li Siqi. After that Li Siqi, Zhang Liangbi and other warlords held their own districts and fought each other, and the court's orders went unheeded. In 1369 Xu Da led the Ming army into Fengyuan and renamed it Xi'an."
 oe_lde_ctry_YSC: "The Branch Secretariat of Sichuan was split off from Shaanxi in 1286 with its seat at Chengdu. The Mongols and the Southern Song had fought over Sichuan for nearly half a century, and the fortress of Diaoyu at Hezhou opened its gates only in 1279. The war left barely a tenth of the households, and Sichuan was the most thinly peopled of the provinces.\n\nIn 1357 Ming Yuzhen, a general of Xu Shouhui, came up the Yangtze, took Chongqing and then Chengdu. When Chen Youliang killed Xu, Ming Yuzhen closed the passes and in 1363 proclaimed himself emperor of Great Xia at Chongqing. Two Ming armies entered Sichuan in 1371 and Xia fell."
 oe_lde_ctry_YLB: "The Branch Secretariat of Lingbei was set up in 1307 as the secretariat of Qara Qorum and renamed Lingbei in 1312. Its seat, Hening, was Karakorum, the old capital of the Mongol empire. It governed the steppe north of the Gobi, the homeland of Chinggis Khan, ringed by the pastures of the princes. The land grew too little grain, and food for the garrisons and for famine relief had to be hauled a thousand li from China.\n\nIn 1360 Alu Hui Temür, Prince of Yangdi, rose here to claim the throne and was beaten the next year. When the Ming took Dadu in 1368 the court withdrew north and the steppe became the seat of the dynasty once more; in 1388 the camp of Tögüs Temür Khan was overrun by a Ming army at Lake Buir."
 oe_lde_ctry_YLY: "The Branch Secretariat of Liaoyang was set up in 1287, the year the rising of Nayan and the eastern princes was put down. Its seat was Liaoyang, and it governed Liaodong and all the north-east as far as Nurgan at the mouth of the Amur and Sakhalin beyond the strait. Its people were Chinese, Jurchen, Khitan and Korean settlers and the fishing and hunting tribes of the rivers; the appanages of the eastern princes lay inside it.\n\nIn 1359 the Red Turbans of Guan Duo and Pan Cheng sacked Liaoyang. After the court withdrew north, Naghachu held Jinshan with some two hundred thousand followers and surrendered to the Ming only in 1387."
 oe_lde_ctry_YGU: "The Branch Secretariat of Gansu was set up in 1286 with its seat at Ganzhou (Zhangye). It governed the Hexi corridor and the old lands of the Tangut Xi Xia, the gateway to the Western Regions and the front against the Chaghadai khanate, held by strong garrisons that were fed largely from the interior. The far western end of the corridor, about Guazhou and Shazhou, was held by the Chaghadaid princes of the house of Chübei. Marco Polo says he spent a year in Ganzhou.\n\nWhile the central plain burned at the end of the Yuan, Hexi stayed fairly quiet. In 1372 the Ming general Feng Sheng led the western column out of Lanzhou, took Ganzhou and Suzhou and reached Guazhou and Shazhou, and the province came to an end."
 oe_lde_ctry_YLU: "Prince of Lu was the title of the chiefs of the Khongirad. Börte, the chief wife of Chinggis Khan, was a Khongirad, and Chinggis decreed that the daughters of her house should be empresses and its sons marry princesses; generation after generation they did, and the Khongirad became the foremost consort clan of the Yuan. They built the city of Yingchang by Lake Dalai Nur in 1270 and Quanning in 1297, both run by officials the prince appointed himself, and in 1307 their chief Diwabala was made Prince of Lu.\n\nWhen Dadu fell in 1368 the emperor Toghon Temür fled north and ended at Yingchang, where he died in 1370. The Ming general Li Wenzhong stormed the city that same year and captured the emperor's grandson Maidiribala, and the appanage was no more."
 oe_lde_ctry_YZW: "Prince of Zhao was the title of the chiefs of the Önggüd, a Turkic-speaking people of the Church of the East who had guarded the Jin frontier walls north of the Yin Mountains. About 1204 their chief Alaqush Tegin Quri joined Chinggis Khan and the two houses swore to marry into each other; from then on the Önggüd chiefs married imperial princesses. Early in the fourteenth century the chief was made Prince of Zhao, with his seat at Dening on the Black River (the ruins of Olon Süme).\n\nThe Önggüd prince Körgüz, known as Prince George, was brought over to the Roman church by John of Montecorvino and built a church in his lands; he died a captive after a defeat in the north-west in 1298. After the fall of the Yuan the Önggüd country was fought over by the Ming and the Northern Yuan, and its people scattered among the Mongol tribes."
 oe_lde_ctry_YBN: "Prince of Bin was the title of the house of Chübei, a line of Chaghadaid princes. Chübei, a son of the Chaghadaid khan Alghu, left the Chaghadai khanate in the 1270s and went over to Khubilai; from then on he and his followers held the western end of the Hexi corridor against Qaidu and Du'a. He was made Prince of Weiwu Xining in 1304 and Prince of Bin in 1307. His descendants split into several branches: the Prince of Bin as head of the house (camped about Suzhou), the Prince of Xining at Shazhou, the Prince of Su at Guazhou and the Prince of Weiwu Xining at Hami. Buyan Temür was made Prince of Bin in 1331. In Phoenix one country stands for the whole house, with its capital at Shazhou.\n\nThe house was Buddhist. In 1348 Sulaiman, Prince of Xining, set up a stele at the Mogao caves with the six-syllable mantra cut in six scripts. In 1352 Yaghan Shah, Prince of Xining, was ordered to Sichuan; the next year he and the provincial armies beat Xu Shouhui at Qishui, and he went back to Shazhou. After Dadu fell the house stayed beyond the Jiayu pass (while the Idiqut princes of Qocho in Hexi submitted to the Ming): in 1380 the Ming general Pu Ying captured Irinchin, Prince of Bin, at Chijin, and in 1391 a Ming army stormed Hami and killed Berke Temür, Prince of Bin. The Ming then set up the guards of Shazhou, Chijin Mongol and Hami here."
 oe_lde_ctry_BYT01: "Thessaloniki was the second city of the empire, 'co-reigning' with Constantinople, set at the mouth of the Vardar where the Via Egnatia crosses the Balkans. Saint Demetrios was its patron, and his October fair drew merchants from every quarter. In Phoenix it is an imperial theme: the governor holds only the seat, and the land of the district stays with the emperor.\n\nIn 1342 the Zealots, a party of sailors and commoners, drove out the nobles and ruled the city for eight years. It opened its gates to the Ottomans in 1387, came back to the empire in 1403, was handed to Venice in 1423 and was stormed by Murad II in 1430."
 oe_lde_ctry_OBY: "The Golden Horn is the deep inlet on the north side of Constantinople, for a thousand years the empire's harbour and dockyard. By the fourteenth century the Genoese of Galata on the far shore had taken most of the trade: Gregoras reports that about 1348 Galata's customs brought in some two hundred thousand gold pieces a year and Constantinople's own thirty thousand.\n\nIn Phoenix, Golden Horn is a chartered bank on the waterfront. No such house ever existed; it stands for a way the empire might have taken customs, exchange and lending back into its own hands."
 oe_lde_ctry_CSI: "Li Siqi of Luoshan raised militia against the Red Turbans together with Chaghan Temür, entered the Wei valley in 1357 and from his base at Fengxiang became the strongest warlord of Shaanxi. In 1337 Shaanxi was still a branch secretariat of the Yuan.\n\nFor years he fought Zhang Liangbi and the other generals of the region, and the court tried again and again to part them. After Chaghan's death he would not take orders from Köke Temür, and in 1367 the generals of the region made him their leader against Köke. When Xu Da entered the passes in 1369 he gave up Fengxiang, fled west to Lintao and surrendered to the Ming; he died in 1374."
 oe_lde_dyn_oe_yz_khongirad_dynasty: "The Khongirad were an old people of the eastern steppe, famed for the beauty of their daughters. Börte, chief wife of Chinggis Khan, was the daughter of the Khongirad chief Dei Sechen, and her house married into the imperial family ever after: its daughters as empresses, its sons as husbands of princesses. Chabi, empress of Khubilai, and Dagi, mother of the emperors Khaishan and Ayurbarwada, were both of this house.\n\nIts chiefs were made Prince of Jining and then Prince of Lu, with their seats at Yingchang and Quanning. After Yingchang fell in 1370 the Khongirad scattered among the Mongol tribes and later formed one of the five Inner Khalkha divisions."
 oe_lde_dyn_oe_yz_ongud_dynasty: "The ruling house of the Önggüd, who claimed descent from the Shatuo Turk Li Keyong and held to the Church of the East for generations. After Alaqush Tegin Quri joined Chinggis Khan, the men of this house married imperial princesses generation after generation and held the titles Prince of Gaotang and Prince of Zhao, keeping the country north of the Yin Mountains.\n\nThe best known of them is Körgüz, Prince George: a student of the Confucian classics with a library of ten thousand scrolls, brought over to the Roman church by John of Montecorvino, taken prisoner in 1298 and killed when he would not submit."
 oe_lde_dyn_oe_s37_kalothetos_dynasty: "The Kalothetos family came from Chios. When Andronikos III took the island back from the Genoese Zaccaria in 1329, the Chiot noble Leo Kalothetos worked for him from inside and was made its governor, which he remained until 1340. He was an old friend of John Kantakouzenos.\n\nAfter the civil war Leo governed Old Phokaia. In 1357 pirates brought Halil, the son of Orhan, to Phokaia as a captive; Leo refused to give him up, John V came in person to besiege the town and could do nothing, and the prince was freed in the end for a large sum and a high title."
 oe_lde_dyn_oe_s37_philanthropenos_dynasty: "The Philanthropenos family appears from the middle of the thirteenth century and gave the empire several generals and admirals. The most famous is Alexios the pinkernes: between 1293 and 1295 he beat the Turks again and again in the Maeander valley, his army hailed him emperor, and when the rising failed he was blinded.\n\nNearly thirty years later he was pardoned. When Philadelphia was besieged in 1324 the old blind general was sent to relieve it, and the Turkish chiefs withdrew without a fight out of respect for his name. About 1336 he was governor of Lesbos and won Mytilene back from the Genoese."
 oe_lde_dyn_oe_lgr_tocco_dynasty: "The Tocco family came from Benevento in southern Italy and rose in the service of the Angevin princes of Naples and Taranto. Historically, Robert of Taranto granted Cephalonia and Zakynthos to Leonardo I Tocco in 1357, giving the house a foothold in the Ionian Islands to which he added Lefkada and Vonitsa.\n\nHis son Carlo I entered Ioannina in 1411 and took Arta in 1416, reuniting Epirus under the Byzantine title of despot. Ottoman advances took Ioannina in 1430 and Arta in 1449, and in 1479 the Ottomans and Venice partitioned the remaining islands, driving the Tocco into exile in Italy."
 oe_lde_dyn_oe_lgr_buondelmonti_dynasty: "The Buondelmonti were an old noble house of Florence; the murder of Buondelmonte de' Buondelmonti in 1216 was remembered in the chronicles as the spark of the city's Guelph and Ghibelline feud. Through Florentine ties with Angevin Naples, the family reached into Latin Greece.\n\nHistorically, Maddalena de' Buondelmonti married Leonardo I Tocco, while her brother Esau became ruler of Ioannina in 1385 by marrying Maria Angelina, widow of Thomas Preljubović. Esau steered Ioannina between Albanian clans and Ottoman raiders until his death in 1411, when the city passed to his nephew Carlo I Tocco."
 oe_lde_dyn_oe_lgr_crispo_dynasty: "The Crispo were a Lombard family from Verona who settled in the Latin Aegean and held the island of Melos as vassals of the Sanudo dukes of the Archipelago. As the duchy weakened in the late fourteenth century, the family moved to the centre of its politics.\n\nHistorically, Francesco I Crispo overthrew and killed Duke Niccolò III dalle Carceri in 1383 and seized Naxos with Venetian acquiescence. The Crispo dukes ruled the Cyclades for nearly two centuries, paying tribute to the Ottomans from 1537 until Sultan Selim II deposed the last duke, Giacomo IV, in 1566."
 oe_lde_dyn_angelos_dynasty: "The Angelos family came from Philadelphia in Lydia, rose through marriage into the Komnenoi and held the imperial throne under Isaac II and Alexios III from 1185 to 1204. After the Fourth Crusade its Komnenos Doukas branch established the rump states of Epirus and Thessaly.\n\nIn 1337 John Angelos, a kinsman and close lieutenant of John Kantakouzenos, served as imperial pinkernes. Historically, he backed Kantakouzenos in the civil war of the 1340s and governed Thessaly and Epirus until he died in the plague of 1348."
 oe_lde_dyn_monomachos_dynasty: "The Monomachos family was an old Byzantine civil and military house recorded from the ninth century. Its most famous member, Emperor Constantine IX Monomachos (r. 1042-1055), patronised law and learning at Constantinople.\n\nIn the fourteenth century the house still supplied provincial governors. After Andronikos III recovered Thessaly around 1333 he placed Michael Senachereim Monomachos in charge with the rank of protosebastos; in 1337 Michael governed the province, which he held until his death in the early 1340s."
 oe_lde_dyn_kastrioti_dynasty: "The Kastrioti were an Albanian noble house of the highlands of Mat and Dibër in north-central Albania, rising in the late fourteenth century as regional lords around Krujë. Gjon Kastrioti held Krujë and the nearby valleys before submitting as an Ottoman vassal and sending his sons as hostages.\n\nHistorically, his son Gjergj Kastrioti—known as Skanderbeg—left the Ottoman ranks to seize Krujë in 1443 and united the Albanian lords in the League of Lezhë in 1444. For twenty-five years he held the mountain fortresses against Murad II and Mehmed II until his death in 1468."
 oe_lde_dyn_balsic_dynasty: "The Balšić were minor lords of Zeta (modern Montenegro and northern Albania) under the Nemanjić kings of Serbia. After Emperor Stefan Dušan died in 1355 and his empire broke apart, Balša I and his three sons—Stracimir, Đurađ I and Balša II—rapidly took control of Zeta and Shkodër.\n\nHistorically, the house fought Bosnia, Karl Thopia, Venice and the Ottomans across the Adriatic coast and northern Albania. Balša II fell at Savra in 1385, and in 1421 the childless Balša III left Zeta on his deathbed to his uncle, Despot Stefan Lazarević of Serbia."
 oe_lde_dyn_mrnjavcevic_dynasty: "The Mrnjavčević rose under Stefan Dušan and his son Uroš V to become the strongest Serbian magnate house in Macedonia. Historically, Vukašin Mrnjavčević was crowned co-king at Prilep in 1365 while his brother Jovan Uglješa ruled Serres as despot.\n\nIn 1371 both brothers marched east against the Ottomans and fell in the disastrous night battle on the Maritsa, opening Macedonia to Ottoman overlordship. Vukašin's son Marko kept Prilep as an Ottoman vassal until he fell at Rovine in 1395, passing into South Slavic epic as Prince Marko."
 oe_lde_dyn_dejanovic_dynasty: "The Dejanović, better known as the Dragaš family, descended from Despot Dejan, brother-in-law of Stefan Dušan, who held wide lands in eastern Macedonia around Kumanovo and Velbazhd (Kyustendil). Historically, after the Battle of the Maritsa in 1371 his sons Jovan and Konstantin Dragaš kept their principality as Ottoman vassals.\n\nKonstantin fell at Rovine in 1395. His daughter Helena Dragaš married the Byzantine emperor Manuel II Palaiologos and became the mother of John VIII and Constantine XI, the last Roman emperor, who famously bore his mother's family name, Dragases."
 oe_lde_dyn_brankovic_dynasty: "The Branković descended from Branko Mladenović, sevastokrator and governor of Ohrid under Stefan Dušan. His son Vuk Branković built a strong domain across Kosovo and Skopje, fought at Kosovo in 1389 and held out against Ottoman vassalage longer than his neighbours.\n\nHistorically, Vuk's son Đurađ Branković succeeded his uncle Stefan Lazarević as Despot of Serbia in 1427 and built the great Danube fortress of Smederevo after Belgrade returned to Hungary. Caught between Hungary and the Ottomans, the house held the despotate until Smederevo fell in 1459, and later bore the titular dignity in southern Hungary."
 oe_lde_dyn_losha_dynasty: "The Losha were an Albanian noble clan that moved south into Epirus and Aetolia during the fourteenth-century migrations, serving as soldiers and regional chiefs. Historically, after Albanian forces defeated Nikephoros II Orsini at the Battle of Achelous in 1359, Simeon Uroš recognised Peter Losha as Despot of Arta.\n\nPeter held Arta through years of border war and uneasy truces with Thomas Preljubović of Ioannina. When plague struck Arta in 1374 Peter died of it, and his lands passed to another Albanian lord, John Bua Spata."
 oe_lde_dyn_spata_dynasty: "The Spata were an Albanian noble house established in Aetolia and Acarnania in the mid-fourteenth century. Historically, after the Battle of Achelous in 1359 their chief John Bua Spata was recognised as despot of Angelokastron by Simeon Uroš.\n\nOn Peter Losha's death in 1374 John Bua Spata took Arta and became the foremost Albanian ruler in southern Epirus, defeating the Hospitallers in 1378 and holding his own against Ioannina. After his death in 1399 his kinsmen Maurice and Yaqub Spata held Arta until Carlo I Tocco took the city in 1416."
 oe_lde_dyn_preljubic_dynasty: "The Preljubić were a Serbian magnate house founded by Gregory Preljub, a general of Stefan Dušan made Caesar and governor of Thessaly from 1348 until he was killed fighting Albanians in 1356. Historically, Simeon Uroš granted Ioannina to his son Thomas Preljubović in 1366.\n\nThomas married Simeon's daughter Maria Angelina and took the title of despot, calling in Ottoman auxiliaries during bitter wars with the Albanian lords of Arta. Feared for heavy taxes and harsh rule, he was assassinated by his own guards in 1384, leaving Ioannina to Esau de' Buondelmonti."
 oe_lde_dyn_giustiniani_dynasty: "The Giustiniani of Chios were not a single bloodline but a Genoese albergo, a mercantile clan union formed in 1362 by the shareholders of the Maona of Chios and Phokaia. Historically, a private Genoese fleet seized Chios and Phokaia from Byzantium in 1346, and when Genoa could not repay the cost it ceded the islands' administration and revenues to the investors.\n\nRuling as a joint-stock lordship, the Giustiniani monopolised Chios's prized mastic resin and the alum mines of Phokaia. By paying yearly tribute to the Ottoman sultans after 1453 they kept the island for more than two centuries, until an Ottoman fleet occupied Chios in 1566."
 oe_lde_dyn_rtr_ming_zhu_dynasty: "The Zhu were the imperial house of the Ming dynasty, founded by Zhu Yuanzhang of Haozhou (Fengyang). Historically, orphaned by famine and plague in 1344, he entered a Buddhist monastery and begged on the roads before joining Guo Zixing's Red Turban rebels in 1352, rising quickly to independent command.\n\nTaking Jiqing (Nanjing) in 1356, Zhu eliminated Chen Youliang on Lake Poyang in 1363 and Zhang Shicheng at Suzhou in 1367, proclaimed the Ming dynasty in 1368 and sent Xu Da north to capture Dadu. The Zhu house ruled China for 276 years until Beijing fell in 1644."
 oe_lde_dyn_rtr_chen_dynasty: "The Chen of Great Han were the house of Chen Youliang of Mianyang in Hubei, born to a fisherman's family and once a county clerk. Historically, he joined Xu Shouhui's southern Red Turban regime and rose by daring and intrigue to command its strongest armies in Jiangxi and Huguang.\n\nIn 1360 Chen killed Xu Shouhui and proclaimed himself Emperor of Great Han at Wuchang, building towering war-junks to contest the lower Yangtze. In 1363 his vast fleet was defeated and he was killed by an arrow on Lake Poyang against Zhu Yuanzhang; his son Chen Li surrendered at Wuchang the next year."
 oe_lde_dyn_rtr_wu_zhang_dynasty: "The Zhang of Great Zhou and Wu were the house of Zhang Shicheng of Taizhou, a salt-boatman who raised a revolt with his brothers in 1353 and took Gaoyou under the title Great Zhou. Historically, he crossed the Yangtze in 1356 to seize Pingjiang (Suzhou), winning the wealthiest cities of Jiangnan.\n\nZhang briefly submitted to the Yuan in 1357 to ease pressure on his borders and styled himself Prince of Wu in 1363, keeping his lands prosperous while avoiding bold campaigns. After beating Chen Youliang, Zhu Yuanzhang turned east and stormed Suzhou in 1367; Zhang took his own life in captivity at Nanjing."
 oe_lde_dyn_rtr_xia_ming_dynasty: "The Ming of Great Xia were the house of Ming Yuzhen of Suizhou in Hubei, a local militia leader who joined Xu Shouhui's Red Turbans. Historically, he led an army up the Yangtze gorges into Sichuan in 1357, took Chongqing and Chengdu and secured the basin.\n\nRefusing to recognise Chen Youliang after Xu's murder, Ming Yuzhen closed the passes and proclaimed Great Xia at Chongqing in 1363, keeping Sichuan orderly until his death in 1366. Under his young son Ming Sheng the regime fractured; two Ming armies entered Sichuan in 1371, Ming Sheng surrendered, and the Hongwu Emperor resettled the family in Goryeo."
 oe_lde_cult_oe_roman_noble_culture: "Across the late Roman and Byzantine centuries, imperial rule rested on a civil and military governing stratum centred on Constantinople: Orthodox in faith, trained in classical Greek letters and drawn from the Balkans, Anatolia and the Caucasus, yet united in calling themselves Romans in the emperor's service.\n\nIn Phoenix, Roman Officials stands for this imperial administrative and military cadre stationed in Constantinople and the themes, distinct from local provincial populations; it is a mod category representing the imperial bureaucracy rather than a separate historical ethnic group."
 oe_lde_ctry_WHO: "The White Horde was the eastern left-wing ulus held by the descendants of Jochi's eldest son Orda from their seat at Sighnaq, commanding the eastern Kipchak steppe and the northern Syr Darya. In Phoenix's 1337 setup it begins as a Jochid ulus wing shielding the throne of Sarai.\n\nWhen the Great Troubles convulsed Sarai in the later fourteenth century, the princes of the White Horde marched west to claim the succession: Urus Khan consolidated the eastern steppe, and his kinsman Tokhtamysh seized the White Horde with Timur's backing before reuniting the Golden Horde around 1380. In the fifteenth century the old left wing broke apart into the Great Horde, the Nogais and the Kazakh Khanate."
 oe_lde_ctry_SBR: "The Ulus of Shiban was the northern appanage of the descendants of Jochi's fifth son Shiban, seated at Chimgi-Tura (near modern Tyumen) across the forest-steppe between the Urals, the Tobol and the Ob. Rich in sable and northern furs, it linked steppe trade routes to forest tribute networks; in Phoenix's 1337 setup it begins as a Jochid ulus wing paying tribute to Sarai.\n\nAs the Golden Horde fractured, the Shibanid princes broke free to found the khanates of Tyumen and Sibir in the fifteenth century, while another branch marched south into Transoxiana. Under Kuchum Khan in the late sixteenth century, the Cossack leader Yermak crossed the Urals and took Qashliq in 1582, opening the Russian advance across Siberia."
 oe_lde_ctry_KHW: "Khwarazm occupied the irrigated oasis of the lower Amu Darya around its seat at Urgench (Kunya-Urgench), guarding the caravan crossroads between the Kipchak steppe, Transoxiana and Persia. In Phoenix's 1337 setup it is governed for Sarai by the Khongirad family of Qutlugh Temür as the wealthiest commercial and craft hub of the Golden Horde.\n\nOnce the Great Troubles shook Sarai, the Khongirad lord Husayn Sufi broke away at Urgench, founding the Sufi dynasty and striking his own coinage. Between 1372 and 1388 Timur led five campaigns against Khwarazm and levelled Urgench; early in the sixteenth century Uzbek Shibanids settled the oasis and formed the Khanate of Khiva."
 oe_lde_ctry_KZN: "The land of Bulgar and Kazan commanded the confluence of the middle Volga and the Kama, a trading crossroads linking northern furs with eastern silver since the days of Volga Bulgaria. Brought into the Ulus of Jochi by the Mongol conquest, it begins in Phoenix's 1337 setup as the Tumen of Bulgar and Kazan under the Golden Horde, controlling the Volga riverways opposite the northeastern Rus' principalities.\n\nAround 1438 the ousted Golden Horde khan Ulugh Muhammad established the independent Khanate of Kazan, which contested the middle Volga with Moscow for more than a century. In 1552 Tsar Ivan IV besieged and stormed Kazan, giving Russia the whole course of the Volga and opening the road to the Urals and Siberia."
 oe_lde_ctry_ELR: "As twilight closed over the Bosporus in the fifteenth century, Roman exiles, scholars, and sailors who refused to bow to Ottoman rule sailed west across the Atlantic to raise Nova Constantinople upon Chesapeake Bay, founding the Fourth Rome of Nova Elysia.\n\nTransplanting imperial law, Greek fire, and senate traditions to the New World frontier, the exile empire builds ports and provinces across eastern North America while looking back across the ocean toward the distant Queen of Cities."
 oe_lde_dyn_megas_komnenos_dynasty: "The house of Megas Komnenos descended from Alexios and David, grandsons of the deposed Byzantine emperor Andronikos I Komnenos. As Constantinople fell to the Fourth Crusade in 1204, the brothers seized the Black Sea coast with the aid of their kinswoman Queen Tamar of Georgia and founded the Empire of Trebizond, styling themselves Grand Komnenoi to rival the Palaiologoi in Constantinople.\n\nSustained by Silk Road port revenues and diplomatic marriages, the house wed Princess Theodora (Despina Khatun) to the Aq Qoyunlu ruler Uzun Hasan in 1458 in a bid to forge an eastern coalition against the Ottomans. Mehmed II forced Trebizond to surrender in 1461 and later executed its last emperor David, yet the Grand Komnenoi remained a potent symbol of Roman legitimacy across the Pontus and the Orthodox world."
 oe_lde_dyn_komnenos_doukas_dynasty: "The house of Komnenos Doukas was the western branch of the Angeloi, who had ruled Byzantium from 1185 to 1204 and adopted the prestigious maternal names Komnenos and Doukas. After the Fourth Crusade took Constantinople, Michael I Komnenos Doukas founded the Despotate of Epirus at Arta, and his brother Theodore captured Thessaloniki in 1224 and was crowned emperor, briefly leading the Greek bid to recover the capital.\n\nDefeat by Bulgaria at Klokotnitsa in 1230 broke that momentum: Thessaloniki passed to Nicaea and the family's western lands split into the lines of Epirus and Thessaly. For nearly a century the Komnenoi Doukai navigated between Byzantium, Angevin Naples and Serbia until the Epirote male line ended in 1318 and passed to the Orsini."
 oe_lde_dyn_palaiologos_monferrato_dynasty: "The Palaiologos-Montferrat line was the northern Italian branch of the Byzantine imperial house. Emperor Andronikos II married Yolanda (Irene) of Montferrat, and after the native Aleramici male line died out in 1305, their son Theodore I Palaiologos sailed west in 1306 to inherit the March of Montferrat in Piedmont, ruling from Chivasso and Casale.\n\nThe dynasty held Montferrat for more than two centuries, balancing Genoa, Savoy and Milan while preserving its kinship and diplomatic ties with Constantinople and offering Byzantium a natural foothold in the Italian Wars. When the last marquis, Giovanni Giorgio, died without legitimate issue in 1533, Montferrat passed to the Gonzaga of Mantua."
 oe_lde_cult_oe_zaporozhian_cossack: "The Zaporozhian Cossacks took their name from the steppe marshes beyond the rapids of the lower Dnieper, formed by East Slavic freemen, frontiersmen and fugitives from serfdom. Centred on their fortified island camp, the Sich, they governed themselves through an open host assembly that elected its Hetman and officers to command both river flotillas and light cavalry.\n\nThrough the sixteenth and seventeenth centuries the Zaporozhian Host launched daring raids by shallow-draft boats across the Black Sea against Ottoman and Crimean ports while manoeuvring between Poland-Lithuania, Moscow and Crimea. Bohdan Khmelnytsky's uprising of 1648 created an autonomous Hetmanate and reshaped the politics of the eastern steppe."
 oe_lde_cult_oe_don_cossack: "The Don Cossacks grew up along the Don basin and the steppe frontier known as the Wild Fields, beginning as free armed communities of river fishers, hunters and border fighters. They settled fortified villages called stanitsas along the river, centred their host at Cherkassk and long upheld the frontier custom that the Don never surrendered fugitives.\n\nFrom the late sixteenth century the Don Host served as Moscow's chief cavalry shield against Crimean and Nogai raids, even storming the Ottoman fortress of Azov in 1637 and holding it for five years. As imperial borders pushed south, the host was folded into the Russian military system while keeping its distinct frontier martial identity."
 oe_lde_cult_oe_yaik_cossack: "The Yaik Cossacks settled along the lower Yaik River (the modern Ural) flowing into the northern Caspian, founded in the mid-sixteenth century by free Cossacks moving east from the Volga and Don. Based around Yaitsky Gorodok (Uralsk), they combined sturgeon fisheries with frontier cavalry service along the Nogai steppe and northern Caspian salt routes.\n\nFar from Moscow, the Yaik Host preserved fierce self-government and strong Old Believer sympathies, screening Russia's southeastern border yet clashing repeatedly with central authority. After the Pugachev Rebellion was crushed in 1775, Empress Catherine II renamed both the river and the host Ural to erase the memory of the revolt."
 oe_lde_cult_oe_terek_cossack: "The Terek Cossacks were the oldest Cossack frontier communities of the North Caucasus, settling the valleys of the Terek River and the Greben foothills from the late sixteenth century. Living side by side with Chechen, Kabardian and Kumyk highland clans, they alternated between border raids, alliances and cultural exchange.\n\nBlending steppe horsemanship with Caucasian mountain tactics, dress and weaponry—including the distinctive cherkeska coat—the Terek Host developed a frontier culture all its own. As Russia built the Caucasian fortified line, the Terek stanitsas anchored the vital corridor between Astrakhan and Georgia."
 oe_lde_cult_oe_siberian_cossack: "The Siberian Cossacks traced their origins to Yermak's expedition of 1581-82 across the Urals against the Khanate of Sibir. Over the next century these frontier servicemen pushed east along the Tobol, Ob and Yenisei rivers, building timber ostrogs and collecting fur tribute as Russian rule expanded across northern Asia.\n\nUnlike the early self-governing hosts of the Don or Dnieper, the Siberian Cossacks were tied closely to garrison towns and fortified lines from the start, later forming a standing host along the southern edge of western Siberia and the Kazakh steppe."
 oe_lde_cult_oe_kuban_cossack: "The Kuban Cossacks took root across the Taman Peninsula and the Kuban basin on the eastern Black Sea, guarding the approaches to the Sea of Azov and the western Caucasus. Formed chiefly from former Zaporozhian Cossacks resettled as the Black Sea Host after the Sich was dissolved in 1775, together with Caucasus Line garrisons, they united Dnieper traditions with Caucasian border warfare.\n\nCentred on Yekaterinodar, the Kuban Host farmed and defended the eastern Black Sea marches while preserving Ukrainian frontier speech, song and Caucasian cavalry dress."
 oe_lde_cult_oe_ural_cossack: "The Ural Cossacks manned the steppe frontier along the middle and upper Ural River and the southern foothills of the Urals, sharing common roots with the lower Yaik Host. After the Pugachev Rebellion ended in 1775, the imperial court formally renamed the Yaik Cossacks the Ural Host and tightened state oversight.\n\nStraddling the border of Europe and Asia, the Ural Cossacks combined river fisheries and herding with light-cavalry patrols guarding the Orenburg caravan routes and the approaches to the Central Asian steppe, long keeping their Old Believer customs."
 oe_lde_cult_oe_volga_cossack: "The Volga Cossacks began as free river boatmen and steppe horsemen along the middle and lower Volga. After Moscow conquered Kazan and Astrakhan in the sixteenth century, they operated between Saratov and Tsaritsyn, escorting river convoys, suppressing piracy and watching the crossings against Nogai and Kalmyk raids.\n\nFormally organised into the Volga Host along the Tsaritsyn Line in the eighteenth century, most of its regiments were transferred south in the 1770s to reinforce the Mozdok and Terek frontier in the North Caucasus, while the remainder merged into the Astrakhan Cossacks."
 oe_lde_cult_oe_transbaikal_cossack: "The Transbaikal Cossacks took shape after seventeenth-century Russian pioneers crossed Lake Baikal into the Selenga and Shilka valleys, blending Siberian Cossack garrisons with allied Buryat and Evenki horsemen. From frontier forts such as Nerchinsk and Selenginsk, they watched the northern Mongolian steppe and the Qing border.\n\nFollowing the Treaty of Nerchinsk in 1689 they guarded the eastern border posts and post roads, and in 1851 were organised as the Transbaikal Cossack Host—spearheading Russian expansion along the Amur as a distinctly multi-ethnic Far Eastern cavalry community."
 oe_lde_ctry_CRI: "Linking the Kipchak steppe to the Black Sea trade routes, Crimea begins in Phoenix's 1337 setup as the Crimean Tumen within the Ulus of Jochi, governed from Solkhat and facing Genoese Caffa (Gazaria) and the mountain principality of Theodoro along the coast. While Sarai stood strong it guarded the Horde's Black Sea flank; once the Great Troubles broke out, it became the base from which the Giray line and rival steppe magnates carved out an independent khanate.\n\nHaji I Giray founded the khanate. After the Ottomans took Caffa in 1475, his son Meñli I Giray accepted the sultan as overlord, then destroyed the Great Horde in 1502. From their palace at Bakhchysarai the khans sent horsemen north on raids, driving captives from Poland-Lithuania and Muscovy to the slave markets of Caffa. Khan Devlet I Giray burned Moscow in 1571, but Russia kept pushing south, and Catherine the Great annexed Crimea in 1783."
 oe_lde_ctry_QAS: "Prince of Qi was the title of the house of Jochi Qasar, the brother of Chinggis Khan famed for his archery, whose appanage lay in eastern Mongolia with pastures west of the Greater Khingan. The court paid the house a yearly grant. About 1337 the prince was Shiliemen, whom the Yuan shi records presenting horses to the court as Prince of Qi in 1352.\n\nAfter the Yuan fell, Qasar's descendants were said to form the Ming Fuyu Guard, ancestors of the Khorchin. Their Adai Khan fought the Oirats in the struggle for the Mongol throne and was killed in 1438, yet the tribe rose again with Dayan Khan to victory at Dalan Terqin in 1510. In 1624 the Khorchin became the first Mongol tribe to submit to Nurhaci, and the Manchus rewarded that early loyalty with honours. Khorchin Borjigin women became Qing empresses, among them Xiaozhuangwen, mother of the Shunzhi Emperor."
 oe_lde_ctry_HCN: "The Prince of Jinan's place was the appanage of the house of Qachiun, a brother of Chinggis Khan; the Yuan shi lists its yearly grant under that name. The house belonged to the eastern princes, with pastures around Qingzhou east of the Greater Khingan. Who headed it in 1337 the histories do not say.\n\nThe eastern princes fell with the Yuan. After the emperor Toghon Temür fled Dadu in 1368, the Ming established the Three Guards in 1389 and gave descendants of Genghis Khan's brothers command of the Taining Guard. The Oirat leader Esen later drove off most of the guards, but the Fuyu Guard held on by the Nen river. Its people, said to descend from another brother, Khasar, became ancestors of the Khorchin, who submitted to Nurhaci in 1624 and became early allies of the Manchus."
 oe_lde_ctry_OTC: "Prince of Liao was the title of the house of Temüge Otchigin, the youngest brother of Chinggis Khan; otchigin means the youngest son who keeps the family hearth. The house led the eastern princes and was never quiet: Nayan, generally held to be of this line, rose against Khubilai in 1287 and was killed, and Toqto, Prince of Liao, fell in the fighting of 1328. Yanashiri held the title after him, with his camp around Taizhou.\n\nAfter the Yuan fell, the Ming organised Mongols in the northeast into the Three Guards in 1389; princes descended from Genghis Khan's brothers commanded the Taining Guard. Most of the guards fled when the Oirat leader Esen Tayisi invaded in 1446–1448, while, by one account, the Fuyu Guard remained by the Nen River. Its Khorchin descendants submitted to Nurhaci in 1624 and gave the Qing emperors their empresses."
 oe_lde_ctry_BGT: "Prince of Guangning was the title of the house of Belgutei, half-brother of Chinggis Khan. Belgutei broke the back of the wrestler Buri Bökö, and the descendants of Chinggis honoured him as an uncle. The Yuan shi table of princes records that Alguncha was made Prince of Guangning in 1330; he held the title in 1337.\n\nAfter the Yuan court fled China in 1368, the eastern princes beyond the Khingan were caught between the Ming, who set up the Three Guards in 1389, and the Oirats to the west. A descendant of Belgutei and his people were called the Abaga, the uncle's tribe. In the late Ming their chief Dorji served Ligdan Khan of the Chahar, then moved to the Kherlen under Khalkha protection. He submitted to Qing ruler Hong Taiji in 1639; his people and a kinsman's were later organised into two banners."
 oe_lde_ctry_OGE: "Prince of Yangdi was the Yuan title of the line of Melik, a son of Ögedei. Ögedei's grandson Qaidu fought Khubilai for the steppe for decades, while this branch stood with the Yuan and was given a princely title. The Yuan shi table lists Temürchi after Tuman, Quchun and Taiping, and he held the title about 1337. In 1360 Alu Hui Temür, Prince of Yangdi, rose to claim the throne and was beaten the next year.\n\nThe house lost its lands, not the prestige of its blood. 'Ali-Sultan, a Muslim Ögedeid, briefly held the Chagatai throne; later the conqueror Timur, who could never be khan himself, ruled in the name of Soyurghatmish and, from 1388, his son Sultan Mahmud, striking coins in Sultan Mahmud's name. In Mongolia Ögedeids contended for the Northern Yuan throne, and Adai, whose line some sources trace to Ögedei, briefly reunited most Mongol tribes until the Ming-backed Oirats destroyed him in 1438."
 oe_lde_ctry_LNG: "Prince of Yunnan was the title of the Yuan princes stationed in Yunnan, first held by Khubilai's son Hügechi; some princes who held the province bore the higher title Prince of Liang. By one reference work, the prince in 1337 was Aru, made Prince of Yunnan in 1334; his brother Bolod succeeded him and was raised to Prince of Liang in 1355. The prince sat at Kunming beside the branch secretariat of Yunnan, over the general administrator of Dali and the native chiefs.\n\nWhen the Red Turban general Ming Yuzhen stormed Kunming in 1363, Duan Gong of Dali drove him out and married Agai, daughter of the last prince, Basalawarmi; by later Yunnan accounts the suspicious prince had Duan murdered two years later, though the details do not agree and the rift between the prince and the Duan seems to have been settled before long. After the Ming took China in 1368, Basalawarmi held Yunnan in allegiance to the Northern Yuan. The Hongwu Emperor sent a reported three hundred thousand men under Fu Youde and Mu Ying; in 1382 the prince drowned his wife and killed himself, and Mu Ying's troops stayed on as hereditary garrisons."
 oe_lde_ctry_SYG: "Prince of Shen was a Yuan title in Liaodong, created to govern the Korean settlers around Liaoyang and Shenyang and held by a branch of the Goryeo royal house that rivalled the kings of Goryeo. In 1337 the title belonged to Wang Go, a grandson of King Chungnyeol married to a Mongol princess, who had his eye on the throne of Goryeo.\n\nHis strength lay at the Mongol court rather than in Liaodong. Wang Ko had former King Chungseon exiled to Tibet and King Chungsuk interned, and claimed Goryeo's throne in vain in 1339; when Yuan envoys arrested King Chunghye in 1343, he briefly acted as king. His grandson Toghtua Bukha inherited the Shen title but refused the Goryeo crown in 1356. The Yuan court in Mongolia tried again to place him on the Goryeo throne in 1374, without success."
 oe_lde_ctry_WAL: "Wallachia, the Orthodox Romanian principality between the Carpathians and the Danube, spent centuries as the buffer where Hungarian and Ottoman power met. In 1337 its founder Basarab I ruled from Câmpulung, having ambushed and routed King Charles I of Hungary in the pass at Posada.\n\nMircea the Elder met the Ottomans at Rovine, and who won is told differently; in the end Wallachia had to pay the sultans tribute. Prince Vlad III, son of a knight of the Order of the Dragon and so called Dracula, impaled the sultan's envoys and in 1462 raided Mehmed II's camp by night at Târgoviște, hoping to seize the sultan. Michael the Brave briefly united Wallachia, Transylvania and Moldavia in 1600. The Porte later appointed Phanariot Greeks as princes, until Tudor Vladimirescu's rising in 1821 brought back native princes."
 oe_lde_ctry_EPI: "The Despotate of Epirus was the Greek rump of Byzantium's western coast, ruled from Arta. It began as a refuge for exiles after the Fourth Crusade. In 1337 it had submitted to the emperor under the regent Anna; in the years that followed Andronikos III brought it back into the empire and appointed Theodore Synadenos governor.\n\nImperial rule did not last. Serbian lords and Albanian clans carved the country up, and the rulers of Ioannina asked the Ottomans for help against the Albanians. The Florentine Esau Buondelmonti, captured by an Albanian chieftain in 1399, was freed after fifteen months only by a huge ransom. Carlo I Tocco reunited the towns by 1416, but the Turks took Ioannina in 1430 and Vonitsa, the last fortress, in 1479."
 oe_lde_ctry_FEO: "Theodoro, also called Gothia, was a small Greek-speaking principality in the mountains of southern Crimea, centred on the fortress of Mangup. It descended from the Byzantine theme of Cherson, left autonomous after the Mongol invasion of 1238. Its church was the metropolis of Gothia under the patriarch of Constantinople. In 1337 its princes, said to be of the Gabras house, ruled Greeks and Crimean Goths and fought the Genoese colonies over coastal harbours; how it stood with the Golden Horde the sources do not make clear.\n\nA sack around 1395, laid at different doors, did not end it; in the fifteenth century Alexios rebuilt Mangup, opened the harbour of Kalamita and in 1433-34 fought the Genoese for Cembalo; it was again a minor Black Sea power, and it outlived both Constantinople and Trebizond. Prince Stephen went to Moscow in 1391 or 1402. In 1475 Gedik Ahmed Pasha stormed Mangup and carried off the last prince."
 oe_lde_ctry_GAZ: "Gazaria was a string of Genoese trading colonies on the Black Sea, governed from Caffa in Crimea, a great market for slaves from the steppe, bought largely for Egypt. The Golden Horde captured Caffa in 1308, and by 1337 the restored port was again under Genoese control.\n\nThe colony's laws were codified in 1341 as the Liber Gazarie. The Golden Horde besieged Caffa twice between 1343 and 1347, and Genoese ships fleeing the plague carried the Black Death into the Mediterranean. The Genoese took Soldaia in 1365, the treaties of 1380-81 gave them the coast of Gothia, and peace with the Horde was made again in 1387. Genoa transferred Gazaria to the Bank of Saint George in 1453, and the Ottomans captured Caffa in 1475."
 oe_lde_ctry_SAO: "Salona was a Crusader lordship centred on a fortress town in central Greece, present-day Amfissa. Boniface of Montferrat appointed its first lord; the last French lord, Thomas III, fell at the Cephissus, and after the Catalan Company’s victory Alfonso Fadrique received the fief. In 1337 he still ruled it within the Catalan Duchy of Neopatras.\n\nIn 1379 Navarrese troops stormed nearby Thebes. Under the unpopular regent Helena Kantakouzene the townsmen opened their gates to Bayezid I in 1394, rather than endure her rule. The Despotate of the Morea sold the lordship to the Knights Hospitaller in 1404, but the Ottomans conquered it for good in 1410."
 oe_lde_ctry_ACH: "The Principality of Achaea was a Frankish crusader state in the Peloponnese, originally divided into twelve baronies, most centred on new castles, at a parliament in Andravida. In 1337 its princess was Catherine of Valois, titular Latin empress and a vassal of the Angevin kings of Naples.\n\nFrom 1381 real power lay with the Navarrese Company. In 1404 King Ladislaus of Naples sold the princely rights to Centurione II Zaccaria, lord of Arkadia. The Byzantine despots Constantine and Thomas Palaiologos overran the heartland in 1430 and forced him to marry his daughter Catherine to Thomas as heiress. When the Morea rose in 1453, his son John Asen Zaccaria was proclaimed prince, but Thomas's Turkish allies drove him out by late 1454."
 oe_lde_ctry_NEO: "Neopatria, the Catalan duchy of Neopatras in southern Thessaly, owed its title to a misreading: the Doukas rulers of Thessaly bore a family name that Westerners took for the rank of duke. When John II Doukas died childless in 1318, the Catalan Company took Neopatras the following year.\n\nIn 1337 it was ruled with Athens under Sicily, with William II as duke. Stefan Dušan overran most of its Thessalian lands in 1348, leaving the Catalans only the district around Neopatras. Squeezed by the Navarrese Company and the Florentine Nerio Acciaioli, the Catalans lost Athens in 1388 and Neopatras in 1390; the Ottomans soon took the town and the Spercheios valley."
 oe_lde_ctry_ATH: "The Duchy of Athens was a crusader state in Attica and Boeotia, ruled from Thebes. At Halmyros in 1311 the Catalan Company, refused its pay by the duke, flooded the plain before the Frankish knights' charge and destroyed them. In 1337 the duke was William of Aragon, under Sicily, and Catalan was the language of government.\n\nThe Florentine Acciaioli family took Athens between 1385 and 1388: the lower town first, the Acropolis only in 1388. The Ottomans conquered it in 1458, and Mehmed II came to see the ruins in person and admired them. The Parthenon became a mosque, and Venetian shells blew up its Turkish powder store in 1687, and Athens became the capital of independent Greece in 1834."
 oe_lde_dyn_gabras_dynasty: "The Gabras were a Byzantine aristocratic family from Chaldia, the mountainous region around Trebizond. Theodore Gabras recaptured Trebizond from the Turks in 1075 and ruled Chaldia as a virtually autonomous governor from 1081 until his death in battle in 1098; he was later venerated as a saint.\n\nConstantine Gabras held Chaldia as a quasi-independent prince from about 1126 until Emperor John II Komnenos subdued him in 1140. A Crimean branch of the family is said to have ruled the Principality of Theodoro, also called Gothia, from its cliff capital of Mangup; scholars dispute the link.\n\nPrince Stephen emigrated to Moscow with his son Gregory in 1391 or 1402; the Russian Khovrin and Golovin families claimed descent from them. The princes of Theodoro were rivals of the Genoese colonies on the coast, and how they stood with the Golden Horde is not clear from the sources; in the end the Ottomans stormed Mangup and extinguished the principality in 1475."
 oe_lde_cult_pontic_greek_culture: "The Pontic Greeks are the Greek-speaking people of Pontus, the mountainous Black Sea coast of northeastern Anatolia. Greeks founded their first colonies there around 700 BC, and the Hellenistic Kingdom of Pontus was annexed by Rome in 63 BC. Seljuk conquests in the eleventh century cut the region off from the rest of the Greek world and let the Pontic dialect develop in isolation.\n\nAfter the Fourth Crusade seized Constantinople in 1204, a branch of the Komnenos family, backed by Georgia, founded the Empire of Trebizond. In 1337 it still ruled the Pontic shore as a Byzantine successor state, enriched by Silk Road trade. Greeks of the same culture also lived across the sea in the Crimean ports, Caffa and Soldaia among them.\n\nThe empire fell to Sultan Mehmed II in 1461. Under Ottoman rule Pontic Greeks remained Orthodox merchants, miners and peasants along the coast, though communities in the remoter highlands gradually converted to Islam and adopted Turkish."
 oe_lde_ctry_GLH: "The Ulus of Jochi, or Golden Horde, was the Mongol khanate of the western steppe, ruled from Sarai on the lower Volga. In 1337 the Borjigin Özbeg Khan, who had made Islam the state religion, took tribute from Rus' princes as far as Moscow. In Phoenix's 1337 setup, Sarai presides over five Jochid wings—the Left Wing of Orda, Shiban, Khwarazm, Bulgar-Kazan and Crimea—which drift apart once turmoil strikes.\n\nFrom 1359 the Great Troubles brought a parade of rival khans. The warlord Mamai, ruling through puppets, was beaten by Grand Prince Dmitry of Moscow at Kulikovo in 1380, yet Khan Tokhtamysh reunited the Horde and burned Moscow two years later. He then turned on his patron, the conqueror Timur, who crushed him and sacked Sarai. Afterwards the Manghit kingmaker Edigu dominated the steppe for more than two decades behind puppet khans, yet could not halt the break-up. The Horde broke into the khanates of Kazan, Crimea and Astrakhan; the Great Horde withdrew from the Ugra in 1480, traditionally seen as the end of the Tatar yoke, and Crimea destroyed it in 1502."
 oe_lde_ctry_SMS: "Simsir, written Simsim in the Persian Zafarnama, was a kingdom of the Nakh peoples, ancestors of the Chechens and Ingush, in mountain gorges of the northern Caucasus. In the fourteenth century its rulers paid tribute to the Golden Horde while long remaining Christian.\n\nIts best-known prince, Gayur-khan, served the khan as envoy to the Rus cities. When the Horde fell into civil war he defeated Mamai in 1362 and made Simsir independent. He then backed Tokhtamysh, whose Nakh vanguard fought Timur on the Terek in 1395. Timur's revenge campaign that year destroyed Simsir and drove its people into the mountains, where the survivors gave up princely rule for the free clan councils of the teips."
 oe_lde_cult_nakh_culture: "The Nakh, or Vainakh, are the Northeast Caucasian peoples of the central Caucasus, ancestors of the Chechens and Ingush. Persian chroniclers called their highland clans the Durdzuks, and Georgian and Alan missionaries spread Orthodox Christianity among them in the twelfth and thirteenth centuries.\n\nIn the fourteenth century their principalities formed the kingdom of Simsim, whose Christian prince Gayur-khan defeated the warlord Mamai in 1362. His support of Tokhtamysh drew Timur's revenge: in 1395 Timur wrecked Simsim, drove its people into the mountains and planted Islam through a client ruler. Lowland churches faded and many villages reverted to pagan rites; Islam advanced again from the sixteenth and seventeenth centuries and became general in the Shafi'i form.\n\nMountain life was organized around rival teip clans with stone tower villages, bound by customary law and blood feud. From the eighteenth century they opposed the tsars' Caucasian advance."
 oe_lde_cult_ryazanian: "The Ryazanians are the East Slavic people of the middle Oka, the south-eastern frontier of Rus' where forest meets steppe. Their land emerged from the Murom-Ryazan inheritance that split from Chernigov by 1129, with fortress towns on the border with the nomadic world.\n\nIn December 1237 Batu's armies sacked and annihilated the capital, Old Ryazan, killing most of its princely house; the seat moved north to Pereyaslavl-Ryazansky, later Ryazan. Rebuilding under the Golden Horde, the princes balanced between Sarai, Moscow and the steppe. Prince Oleg Ivanovich stood aside from Kulikovo in 1380 as an ally of Mamai, and Ryazan annexed the principality of Pronsk in 1483.\n\nRyazan was finally absorbed by Vasily III in 1521 when its last prince fled to Lithuania. Its speech belonged to the southern Russian dialect belt, marked by akanye and contact with Turkic neighbours."
 oe_lde_ctry_CYP: "The Kingdom of Cyprus was the last crusader kingdom of the East, ruled by the French house of Lusignan; after the fall of Acre its port of Famagusta became the centre of European trade with Asia. In 1337 King Hugh IV ruled from Nicosia, still calling himself king of Jerusalem.\n\nHis son Peter I toured the courts of Europe to raise a crusade, and in 1365 his fleet sacked Alexandria; four years later a faction of his nobles murdered him. Genoa then seized Famagusta, and a Mamluk army invaded in 1426 and took King Janus to Cairo, leaving Cyprus a tributary of Egypt. In 1442 King John II married Helena Palaiologina, daughter of the despot of the Morea, and in 1464 James II won Famagusta back from the Genoese. Its last queen, the Venetian Catherine Cornaro, was made to hand the island to Venice in 1489, which held it until the Ottomans took Famagusta in 1571."
 oe_lde_ctry_GEO: "The Kingdom of Georgia, ruled from Tbilisi by the Bagrationi, was the Christian bastion of the Caucasus, ringed by Muslim powers. In 1337 King George V the Brilliant was shaking off the Ilkhanate's overlordship, driving out the Mongol garrisons and reuniting the realm of Queen Tamar's golden age.\n\nThe conqueror Timur shattered that revival: from 1386 his armies invaded again and again, took Tbilisi and carried King Bagrat V into captivity. The weakened kingdom split into Kartli, Kakheti and Imereti, caught between Ottomans and Safavids. Shah Abbas I ravaged Kakheti, and its dowager queen Ketevan, refusing to renounce her faith, was tortured to death at Shiraz in 1624. King Heraclius II reunited the east and accepted Russian protection in 1783, yet no Russian army came when Iran's Agha Mohammad Khan sacked Tbilisi, and Russia annexed the kingdom in 1801."
 oe_lde_ctry_HLG: "The Hüleguids were the Borjigin house of Hülegü, grandson of Genghis Khan, whose Mongols sacked Baghdad and founded the Ilkhanate over Persia and Iraq. After Ilkhan Abu Sa'id died without an heir in 1335, rival emirs raised Hüleguid puppets, and by 1337 the claimant Musa Khan, grandson of Ilkhan Baydu, had fallen back on southern Iraq.\n\nMusa had been enthroned by the emir Ali Padshah after the battle of Jaghatu, but at Qara Darra near Van the Jalayirid Hasan Buzurg routed his side. He then joined the eastern claimant Togha Temür to seize Soltaniyeh, only to be captured and killed. Arab Iraq became the heartland of the Jalayirids; Basra later passed among the Arab Al-Mughamis and the Moshasha until Shah Ismail I brought it under Safavid suzerainty in 1508."
 oe_lde_ctry_QAR: "The Qara Qoyunlu, or Black Sheep, were a Turkoman confederation that rose from around Lake Van to rule Azerbaijan, Iraq and western Iran. They had no state in 1337; in the fourteenth century their Baharlu chiefs held lands north of the lake and around Mosul, and about 1375 became vassals of the Jalayirids. In Phoenix the confederation becomes a country in the 1350s, on Sutayid land, under its chief Bayram Khwaja.\n\nTheir chief Qara Yusuf fled Timur and was jailed by the Mamluks in Damascus beside his ally, Jalayirid sultan Ahmad. Freed after Timur's death, he defeated Timur's son Miran Shah at Sardrud in 1408, where Miran Shah died, then defeated Ahmad. His son Jahan Shah, a Turkic poet writing as Haqiqi, carried the Black Sheep to their height and held Herat in 1458. In 1467 Uzun Hasan of the White Sheep surprised his army; Jahan Shah died, and the confederation soon fell."
 oe_lde_ctry_AQQ: "The Aq Qoyunlu, or White Sheep, were a Turkoman confederation that rose from eastern Anatolian pastures to rule Iran from Tabriz. In 1337 the Bayandur clan were still nomads and raiders; later, under Tur Ali, they besieged Trebizond (1348), and from 1352 their chiefs married its princesses. In Phoenix the confederation becomes a country in the early 1350s, on Sutayid land.\n\nTimur rewarded them with Amid, and Uzun Hasan, the Tall, defeated the Black Sheep at Muş in 1467, killing their ruler Jahan Shah. He captured the Timurid sultan Abu Sa'id, who was executed, and ruled from Diyar Bakr to Kerman. Having married Theodora (Despina Khatun) of Trebizond in 1458, he allied with Venice against the Ottomans, but Mehmed II broke his army at Otlukbeli in 1473. His grandsons fought over the throne, and in 1501 his maternal grandson Ismail I led the Safavid Qizilbash to rout them, seize Tabriz and proclaim himself shah."
 oe_lde_ctry_CDL: "Dali, the Bai homeland on Lake Erhai, had been a Buddhist kingdom of the Duan clan whose kings revered Acuoye Guanyin, until Kublai's armies conquered it. In 1337 Duan Guang ruled the old heartland as hereditary governor-general under Mongol rule.\n\nWhen Red Turban rebels from Sichuan took Kunming in 1363, the Mongol Prince of Liang fled, and Duan Guang's brother Duan Gong drove them out, winning the prince's daughter, Princess Agai, in marriage. By Yunnan accounts written after the Yuan, the prince came to fear his power and ordered Agai to poison him; she warned her husband, but he was lured to a bridge and murdered. The details of this story do not agree, and the quarrel between the prince and the Duan seems to have been settled through mediation before long. The Ming generals Lan Yu and Mu Ying took Dali in 1382 and carried the Duan captive to Nanjing."
 oe_lde_dyn_duan_dynasty: "The Duan were the Bai ruling house of Dali in Yunnan. Their founder Duan Siping overthrew Great Yining and established Dali in 937. After a Gao usurpation in 1094 to 1096, the restored kings largely left secular power to their Gao chief ministers and devoted themselves to Buddhism.\n\nIn 1253 Kublai Khan's army destroyed Dali; the last king Duan Xingzhi surrendered and was enfeoffed as Maharaja. The family served the Yuan as hereditary administrators. The ninth administrator Duan Guang took office in 1333 and defeated the Prince of Liang in 1343.\n\nHis brother Duan Gong saved the prince from the Red Turban invasion of 1363 and recovered Kunming; by later Yunnan accounts he was lured to his death at Tongji Bridge in 1365, though the details do not agree and the quarrel between the prince and the Duan seems to have been settled before long. In 1382 the Ming conquered Yunnan and refused the Duan chiefs' request to keep Dali as an autonomous tributary; the Hongwu Emperor scattered the clan."
 oe_lde_ctry_SRB: "The Sarbadars, whose name means head on the gallows, were a Shi'i state in western Khurasan rooted in the region around Sabzevār. In 1337 ʻAbd al-Razzaq led a revolt against the tax demands of Togha Temür's governor, killed an official and seized the town.\n\nSecular amirs sometimes shared power with a Shi'i dervish order that awaited the Twelfth Imam. ʻAbd al-Razzaq was stabbed to death by his brother Wajih al-Din Masʻud in 1338. The Sarbadars lost at Zava in 1342, where the dervish leader Hasan Juri fell, yet murdered Togha Temür in his camp in 1353. Khwaja ʻAli-yi Mu'ayyad made Shi'ism the state creed and submitted to Timur in 1381; the Sarbadars faded after Timur's death."
 oe_lde_ctry_MOS: "The Grand Principality of Moscow, a minor principality on the Moskva River, grew into the gatherer of the Russian lands. Grand Prince Ivan I, nicknamed Kalita, the moneybag, collected the Golden Horde's tribute from the other Rus' princes; by 1337 he had grown rich and drawn the Orthodox metropolitan to Moscow.\n\nHis grandson Dmitry beat a Horde army at Kulikovo in 1380 earning the name Donskoy, though Khan Tokhtamysh burned Moscow two years later. Grand Prince Ivan III married Sophia Palaiologina, niece of the last Byzantine emperor, in 1472, brought the double-headed eagle to the Muscovite court, annexed Novgorod and in 1480 faced down the Horde across the Ugra River until the khan withdrew. Italian architects rebuilt the Kremlin, the monk Philotheus of Pskov hailed Moscow in his epistles as the Third Rome, and in 1547 Ivan IV was crowned the first tsar of Russia."
 oe_lde_ctry_RUS: "Russia grew out of Moscow, a minor Rus' principality that became an empire stretching from the Baltic to the Pacific. Grand Prince Ivan I Kalita, the moneybag, collected the Golden Horde's tribute from the other Rus' princes in 1337.\n\nDmitry Donskoy beat the Tatars at Kulikovo in 1380, and Ivan III—who married Sophia Palaiologina in 1472 and adopted the double-headed eagle—faced down the khan on the Ugra in 1480, traditionally seen as the end of the yoke, after which Philotheus of Pskov hailed Moscow in his epistles as the Third Rome. Ivan the Terrible was crowned tsar and took Kazan; after his male line died out, Poles held the Kremlin before the Romanovs were chosen. Peter the Great crushed Sweden at Poltava in 1709 and built Saint Petersburg as his window on Europe. In 1812 Moscow burned under Napoleon, whose army suffered devastating losses in the retreat."
 oe_lde_ctry_IRA: "Persia, the land of Cyrus and the Sasanians, rose again as a great power under the Safavids, a dynasty sprung from a Sufi order at Ardabil. In 1337 Iran was a battlefield of Mongol emirs and local dynasties, the Ilkhanate having fallen apart on the death of Abu Sa'id.\n\nIsmail I, maternal grandson of the Aq Qoyunlu ruler Uzun Hasan, led his red-capped Qizilbash into Tabriz in 1501, proclaimed himself shah and imposed Twelver Shiism, pitting Persia against the Sunni Ottomans. Shah Abbas the Great raised Caucasian slave soldiers loyal only to him, beat back the Ottomans and ruled from Isfahan. After Afghans took Isfahan in 1722, the general Nader Shah drove them out and in 1739 crushed the Mughals at Karnal and sacked Delhi. Under the Qajars, wars with Russia ended at Turkmenchay in 1828 with the loss of Erivan."
 oe_lde_ctry_ETH: "The Ethiopian Empire was the Christian highland realm of the Horn of Africa, the land Europeans took for Prester John's kingdom, and its Solomonic emperors traced their line to Solomon and the Queen of Sheba. In 1337 Emperor Amda Seyon I had crushed the sultanate of Ifat after its ruler seized his envoy.\n\nEmperor Zara Yaqob later led the Solomonic realm to its height, reforming the church, sending envoys to the Council of Florence and European courts, appointing his daughters and nieces as provincial governors and building churches. Then Imam Ahmad Gran of Adal overran the highlands, until a Portuguese force helped Emperor Gelawdewos defeat him in 1543. Emperor Susenyos accepted Catholicism from the Jesuits, but revolts led his son Fasilides to expel them and found Gondar in 1636, a capital of stone castles. From 1769 the Era of the Princes left the emperors puppets of rival warlords."
 oe_lde_ctry_MAM: "Egypt was the heart of the Mamluk sultanate, a military state whose sultans rose from the ranks of purchased slave-soldiers. The Bahri sultan al-Nasir Muhammad was in his third and longest reign in 1337, a period often seen as the zenith of Mamluk power.\n\nThe Black Death arrived in 1347 and kept returning, devastating the farming villages. Circassian mamluks then took the throne, and in the 1420s Sultan Barsbay turned the Red Sea and Jeddah spice trade to Europe into a state monopoly and captured King Janus of Cyprus. Yet the mamluk cavalry had scorned firearms: Ottoman sultan Selim I's guns and janissaries broke them, and in 1517 the last sultan, Tuman Bay, was hanged at Cairo's Bab Zuwayla gate. Mamluk households regained power under the Ottomans until Egypt's governor Muhammad Ali lured their leaders to the Cairo Citadel in 1811 and had them slaughtered."
 oe_lde_ctry_BYZ: "The Byzantine Empire was the last remnant of Rome, a Greek Orthodox state still ruled from behind the great walls of Constantinople. In 1337 the Palaiologos emperor Andronikos III was losing Asia Minor to the Ottomans, who had taken Nicaea and would take Nicomedia that year.\n\nCivil wars between rival emperors emptied the treasury, and the Ottoman allies of John VI Kantakouzenos occupied Gallipoli in 1354 and stayed in Europe. Emperors went west to beg for help, and Manuel II was a guest in Paris and London; Timur's victory at Ankara in 1402 gave only a reprieve. Even in decline, imperial learning flourished: Gemistus Plethon revived Platonic philosophy at Mystras, Cardinal Bessarion carried Greek scholarship to Italy through the Council of Florence, and the scholar George Scholarios became Gennadios II, the first Ecumenical Patriarch under Ottoman rule. In 1453 Sultan Mehmed II brought great cannon against the walls and dragged his ships overland into the Golden Horn. Emperor Constantine XI died as the city fell, and the thousand-year empire came to an end."
 oe_lde_ctry_AAI: "Alastani was a Georgian princely domain in Javakheti, centred on a castle north of Akhalkalaki. David VIII withdrew there in 1302 after losing the throne to his brother Vakhtang III and founded a line of provincial kings, a royal title born of Georgia's fragmentation under the Mongols.\n\nIn 1337 that line still ruled the province. Andronicus, a purported son of David and grandson of the Mongol Ilkhan Abaqa, died in 1354. Andronicus's son George the Great fell fighting the Turks in 1373, ending the line of Alastani's kings. The family died out in the early fifteenth century."
 oe_lde_ctry_ERE: "The Eretnids held central and eastern Anatolia from Sivas and Kayseri as the Ilkhanate fell apart. In 1337 their founder Eretna, an Ilkhanid officer of Uyghur birth, still governed in the name of the Jalayirid ruler Hasan Buzurg.\n\nWhen rival Mongol warlords marched on him, Eretna won an unexpected victory at Karanbük in 1343, proclaimed himself sultan, and ruled so well that he was called the Beardless Prophet. His son Muhammad I could not master the emirs: he lost Ankara to the Ottoman Murad I and was murdered by his own lords at Kayseri. The judge Kadi Burhan al-Din, regent for the boy Muhammad II, seized the throne in 1381; a poet in Turkish, Persian and Arabic, he held the realm against Ottomans, Mamluks and Aq Qoyunlu for eighteen years."
 oe_lde_ctry_GRG: "Gurgan, on the Caspian shore, was the base of Togha Temür, the last serious claimant to the Ilkhanid throne. A descendant of Genghis Khan's brother Qasar and chief of the nomadic Chete, he was hailed as Ilkhan by the princes of eastern Iran, and in 1337 marched west and occupied Soltaniyeh.\n\nThe Jalayirids and Chobanids drove him back, and in his own tax lands of Khurasan rose the Sarbadars, rebels whose name meant head on the gallows. They beat his armies and killed his brother, and in 1353 their leader Yahya Karawi came to his camp as if to submit, then murdered the khan and killed members of his household. Amir Vali, a governor's son, seized Gurgan; only in 1384 did Timur restore Togha Temür's son Luqman-Padishah at Astarabad as a vassal."
 oe_lde_ctry_HCI: "The Hacıemirid beylik was a small Turkoman lordship of Chepni chiefs, ruled from Mesudiye inland of the Black Sea coast and facing the Greek empire of Trebizond. Its first bey, Bayram, broke away during the Mongol civil war of 1335–1336 and joined a failed siege of Trebizond in 1348.\n\nHis son Hacıemir took the other road and married a daughter of Emperor Basil of Trebizond in 1358. Backed by the warlord Kadi Burhan al-Din, he seized the port of Ordu in 1380, then fell out with his own son Süleyman, who took Giresun in 1397. The beylik bowed to Ottoman suzerainty, stirred again after Timur's victory at Ankara, and was annexed in 1427."
 oe_lde_ctry_IME: "Imereti lay in western Georgia around Kutaisi, ruled by a cadet branch of the Bagrationi dynasty. It became a fully separate kingdom in 1463, when Georgia broke into rival kingdoms, and for centuries it was a battleground between Georgian and Ottoman forces.\n\nCrowns changed hands so often that Archil II reigned five times and Bagrat IV four. Alexander III swore allegiance to Tsar Alexis in 1651, and Archil ended in exile in Russia. Solomon I defeated an Ottoman army at Khresili in 1757, but Solomon II, who accepted Russian suzerainty in 1804, was deposed by Russia in 1810."
 oe_lde_ctry_INJ: "The Injuids were a Persian dynasty ruling Fars from Shiraz, named for the injü, the Ilkhans' crown estates they managed. In 1337 Ghiyas al-Din Kai-Khusrau held Shiraz while Chobanids, Jalayirids and the Muzaffarids of Yazd fought over the Ilkhanate's south, a war that would kill him, his father and brothers.\n\nThe survivor, his brother Abu Ishaq, turned on his Chobanid patron and from 1343 ruled Shiraz and Isfahan alone. His Shiraz was the city of Hafez and Ubayd Zakani, and he reportedly began a building modelled on the Sasanian palace at Ctesiphon, never finished. Raids on the Muzaffarid Mubariz al-Din brought a siege of Shiraz, where a quarter's chief handed the enemy a gate key. Abu Ishaq fled to Isfahan and was captured and executed, ending the dynasty."
 oe_lde_ctry_JAL: "The Jalayirids were Jalayir Mongol nobles who, as the Ilkhanate collapsed, turned its southwestern provinces into a sultanate ruled from Baghdad. In 1337 their head Hasan Buzurg, cousin of the late Ilkhan Abu Sa'id, held power in Persia, backing puppet khans of Genghis Khan's line; he later fought the Chobanids for control.\n\nHis son Shaykh Uways led it to its height, taking Tabriz and Azerbaijan in 1360, and Baghdad and Tabriz became centres of Persian manuscript painting. Then came Timur. Sultan Ahmad, a poet and patron of painters, lost Soltaniyeh to him and fled before Timur sacked Baghdad in 1401, later landing in a Mamluk prison. Once freed, he turned on the Qara Qoyunlu, whose ruler Qara Yusuf captured and executed him in 1410. The last Jalayirids clung to southern Iraq until 1432."
 oe_lde_ctry_KRT: "The Kartids were a Sunni Tajik dynasty that held Herat and most of Khorasan for over a century, surviving as vassals of whichever power ruled Iran. In 1337, as the Ilkhanate fragmented, their malik Mu'izz-uddin Husayn allied with the Ilkhanid claimant Togha Temür and paid him tribute.\n\nHusayn used the chaos to make Herat a power of its own. He beat the rival Sarbadars at Zava in 1342, fought the Chagatai and, from 1349, ruled as an independent sultan; among those in his service was a young Timur. That former servant came back as a conqueror, taking Herat in 1381, deporting its scholars and carrying off the Kart princes. Husayn's son Pir 'Ali was executed after a revolt, and in 1396 the last Kart princes were murdered at a banquet."
 oe_lde_ctry_MZF: "The Muzaffarids were a Persianized Sunni dynasty of Arab descent who rose at Yazd to become the leading power of central Iran after the Ilkhanate fell apart. In 1337 the stern Mubariz al-Din Muhammad ruled Yazd as an effectively independent prince.\n\nHe took Kerman in 1340 and drove the Injuids from Shiraz, until his son Shah Shoja deposed and blinded him in 1358. Under Shah Shoja, himself a poet, the poet Hafez wrote his ghazals of wine and taverns in Shiraz. Timur invaded and his troops massacred Isfahan in 1387. In one tale Timur summoned Hafez to answer for a verse that would trade Samarkand and Bukhara for the mole of a Shirazi beauty. At Shiraz in 1393 Timur defeated Shah Mansur and executed most of the other princes."
 oe_lde_ctry_NAX: "Naxos was the centre of the Duchy of the Archipelago, a Venetian-founded state in the Cyclades. The adventurer Marco Sanudo arrived with eight galleys, conquered Naxos and, with his associates, other islands including Melos. In 1337 Nicholas Sanudo ruled Orthodox islanders as a Catholic lord.\n\nThe Crispo dynasty seized power in 1383. Piracy later flourished, and the duchy turned to Venice as Ottoman power rose. It became an Ottoman tributary in 1537; in 1566 Sultan Selim II deposed the last Crispo duke and appointed the diplomat Joseph Nasi as duke. The Ottomans annexed the duchy in 1579."
 oe_lde_ctry_SME: "Samtskhe was the mountain principality of the Jaqeli family in southern Georgia, ruled from Akhaltsikhe by lords with the title atabeg. In 1337 Qvarqvare held it under the Georgian crown, which had restored its authority in 1334.\n\nQvarqvare II defeated King George VIII of Georgia in 1465 and broke away. Bagrat III of Imereti captured Qvarqvare III at Murjakheti in 1535 and annexed the principality; Qvarqvare died in prison, and his son Kaikhosro II asked the Ottomans to drive the Imeretians out. Their victory at Sokhoista made Samtskhe a vassal, and after 1578 the Jaqelis adopted Islam and ruled as hereditary pashas until Russia conquered the land in 1829."
 oe_lde_ctry_SUT: "The Sutayids were a Turkish-speaking, Sunni Mongol dynasty that held Diyar Bakr for the Ilkhans from the black basalt walls of Amid, over a patchwork of Kurdish lordships. Their founder Sutay, a general of the Ilkhan Ghazan, died in 1332. In 1337 his son Hajji Taghay sided with the Jalayirids as the Ilkhanate broke apart, often fighting the Oirats.\n\nThat collapse doomed a family that lived on Mongol patronage. With Chupanid backing, Hajji Taghay's nephew Ibrahimshah murdered his uncle in 1343 and seized power, then switched sides among the rival factions until defeat near Lake Van and his death in 1350. His cousin Pir Muhammad won back lost Mosul, only to be killed by an officer. The last Sutayids fled to Eretnid lands, where they were remembered as the Barambays."
 oe_lde_ctry_TLM: "Tulam was one of the small chiefdoms of medieval western Gilan, centred on the Caspian harbour of Bandar-e Anzali on the edge of the Talish country. Its ruler Rikabzen ambushed and killed the Ilkhanid general Kutlushah in 1307 during Öljaitü's Gilan campaign, fighting alongside the men of Rasht and Shaft, yet the Mongols won only nominal overlordship and Tulam stayed in local Gilaki hands."
 oe_lde_cult_hazara_culture: "The Hazaras are the Persian-speaking people of the central Afghan highlands known as Hazarajat, formed from Mongol and Turkic military settlers of the thirteenth-century invasions merging with the older Iranian population of the mountains. Their name is commonly derived from the Persian hazar, meaning thousand, a rendering of the Mongol mingghan, the regimental unit of Genghis Khan's army.\n\nBetween the thirteenth and fifteenth centuries Turco-Mongol groups such as the Qara'unas, followed by Ilkhanid and Timurid rule, kept adding to the mix. The first clear description of them comes from Babur's memoirs in the early sixteenth century.\n\nThey adopted Shia Islam around 1600 under Safavid influence, and in the eighteenth century Hazara levies served in the armies of Ahmad Shah Durrani while the highland communities kept their own tribal organization and substantial autonomy."
 oe_lde_cult_iraqi_culture: "The Iraqis are Arabic speakers of the Mesopotamian alluvium, from Baghdad and the shrine cities of Kufa and Karbala to Basra; their Mesopotamian Arabic carries a strong Aramaic substrate, split between the older qeltu speech of northern towns and the gelet dialect of Baghdad and the south. Arab armies took the country from the Sasanians after al-Qadisiyyah in 636; Baghdad, founded in 762, was the Abbasid capital at its intellectual peak until the Mongol sack of 1258.\n\nIn 1337 the Jalayirid sultans, heirs of the fallen Ilkhanate, held Iraq until Timur's 1401 massacre at Baghdad; Turkmen followed, then the Safavids from 1508. Ottomans seized Baghdad in 1534, and the treaty of Zuhab in 1639 settled Iraq's provinces under Istanbul, though Basra long ran its own affairs.\n\nFrom 1704 Georgian Mamluks ruled Iraq in near autonomy until 1831, when the Ottomans reimposed direct rule as the Baghdad, Mosul and Basra vilayets; in 1802 Wahhabi raiders sacked Karbala, sharpening the geography of Sunni trading towns and Shia shrine cities."
 oe_lde_cult_laz_culture: "The Laz are a Kartvelian people of the southeastern Black Sea coast, whose homeland runs from Trabzon and Rize to Adjara. Their ancestors were the Colchian tribes: by the third century the Lazi had united most of Colchis into the kingdom of Lazica.\n\nAfter the Arab conquests Trebizond became their main center, and under the Empire of Trebizond, founded in 1204, Laz villagers made up much of the rural population. The Ottomans took the region in 1547 and organized it as the Lazistan sanjak of Trabzon.\n\nDuring the seventeenth century most Laz converted from Orthodox Christianity to Sunni Islam while keeping their Kartvelian tongue. Derebey valley lords ruled with little interference from Istanbul until Mahmud II crushed their revolt of 1832 to 1834. Laz society stayed organized around armed clans, famed for the horon dance and for shipbuilding and seamanship."
 oe_lde_dyn_arghunid_dynasty: "The Arghunids were the family of the Mongol amirs Arghun Aqa, his son Nawrūz and his grandson Arghun Shah, who led the Ja'un-i Qurban, a Mongol military tribe in Khorasan. After the Ilkhanate collapsed in 1335, Arghun Shah became the chief supporter and commander of the claimant Togha Temür, ruling from Nishapur over Tus, Mashhad and the Atak frontier.\n\nIn 1337 he crushed the Jalayirid-backed governor Muhammad Mulai, but the Sarbadars seized Nishapur in 1340 and forced him back to Tus. Arghun Shah died in 1345 or 1346; his son Muhammad Beg abandoned Togha Temür and allied with the Sarbadars. The tribe later submitted to Timur around 1381 and joined the failed revolt of Hajji Beg at Tus in 1389."
 oe_lde_dyn_bagrationi_dynasty: "The Bagrationi were the royal dynasty of Georgia from the early Middle Ages until the Russian conquest, and one of the oldest Christian ruling houses in Europe. Most scholars derive them from the Armenian Bagratuni family. The Georgian branch gained the Principality of Iberia in the late eighth century: Ashot I became its presiding prince in 813, Adarnase restored the Georgian kingship in 888, and Bagrat III united the Georgian lands into one kingdom early in the eleventh century. Under David IV the Builder, who retook Tbilisi from the Muslims in 1122, and Queen Tamar the Great (1184–1213), Georgia became the leading power of the Christian East, its empire reaching from the North Caucasus into northern Iran.\n\nThe Khwarezmian raid of 1225 and the Mongol invasion of 1236 ended that golden age, though George V the Brilliant, reigning in 1337, briefly restored the kingdom's strength. Timur's eight campaigns between 1386 and 1403 and the pressure of the Kara Koyunlu and Ak Koyunlu shattered its unity, and by 1491 the Bagrationi ruled three rival kingdoms, Kartli, Kakheti and Imereti, under Ottoman and Safavid suzerainty, with several kings converting to Islam. Erekle II reunited Kartli and Kakheti in 1762 and placed himself under Russian protection by the Treaty of Georgievsk of 1783, but Russia stood aside when the Qajar shah Agha Mohammad Khan sacked Tbilisi in 1795. Tsar Alexander I deposed the dynasty and annexed Kartli-Kakheti in 1801, and Imereti followed in 1810, when Solomon II was driven into exile."
 oe_lde_dyn_farumadi_dynasty: "The Fārūmādī were a notable family of Sabzevar in western Khorasan, named after the nearby town of Fārūmād; under the Ilkhans, Khwaja Taher Faryumadi and his son were patrons of the poet Pur-Baha Jami. Their best-known member, 'Ala' al-Din Muhammad Faryumadi, governed Sabzevar, Juvain and part of Nishapur for the Ilkhanid claimant Togha Temür and served as his vizier.\n\nHis harsh taxation drove the local landowner 'Abd al-Razzaq to revolt in 1337, the rising that gave birth to the Sarbadar state. 'Ala' al-Din remained Togha Temür's vizier and fought the Sarbadars until he was killed in the khan's defeat near the Atrek river on 29 July 1342."
 oe_lde_dyn_haciemirids_dynasty: "The Hacıemiroğulları, also called the Bayramoğulları, were a Turkoman beylik of the Chepni tribe on the Black Sea coast of Canik, known to Byzantine Greeks as the emirate of Chalybia. In 1335 and 1336 the first bey, Bayram, threw off Eretnid overlordship; in 1337 his newly independent realm had its capital near Mesudiye.\n\nBayram besieged Trebizond unsuccessfully in 1348. His son Hacıemir, after whom the dynasty is named, fought Trebizond before marrying the emperor's daughter Theodora in 1358; allied with Kadı Burhan al-Din, he seized Ordu and moved his capital there in 1380.\n\nCivil war between Hacıemir and his son Süleyman weakened the beylik, though Süleyman took Giresun in 1397. The dynasty accepted Ottoman suzerainty, briefly regained independence after Timur's victory at Ankara in 1402, and was annexed in 1427."
 oe_lde_dyn_hindu_dynasty: "The Hindu dynasty took its name from Shaykh 'Ali Hindu, a follower of the Ilkhanid claimant Togha Temür, who appointed him governor of Astarabad on the Caspian coast. When Togha Temür was murdered by the Sarbadars in 1353 and Astarabad was annexed, 'Ali Hindu's son Amir Vali took refuge with the neighboring Jauni Kurban tribe and then used Mazandaran as a base from which to recover the city in 1356.\n\nHe ruled Astarabad and parts of Mazandaran until 1366 and again from about 1374 to 1384, waging repeated wars against the Sarbadars and the Jalayirids and declaring for Shi'ism to win local support. His independent rule ended with the arrival of Timur, who took Astarabad in 1384."
 oe_lde_dyn_komnenos_dynasty: "The Komnenos were a Byzantine military aristocracy, traditionally traced to Komne village in Thrace; their first known member Manuel Erotikos built estates at Kastamon. Isaac I seized the throne in 1057 but abdicated two years later; the family's great age began when his nephew Alexios I became emperor in 1081 after Manzikert.\n\nAlexios, his son John II and his grandson Manuel I, who reigned until 1180, rebuilt imperial power against Normans and Turks, until Manuel's defeat at Myriokephalon in 1176 checked the recovery. Andronikos I, emperor from 1183, was killed in 1185 and the Angeloi took Constantinople; Isaac Komnenos's Cyprus regime fell to Richard I in 1191.\n\nBefore the Fourth Crusade sacked Constantinople in 1204, Alexios and David, grandsons of Andronikos I, founded the Empire of Trebizond on the Black Sea. Its Grand Komnenoi outlasted the other Byzantine successor states: Basil held the throne in 1337, from 1332; the empire fell to Mehmed II after a month's siege in 1461. Last emperor David and his family were executed in 1463."
 oe_lde_dyn_lusignan_dynasty: "The House of Lusignan began as petty lords of Lusignan castle in Poitou, traced to the early tenth century, and legend made the water-sprite Melusine its foundress. Its French branch became counts of La Marche, and Hugh X's marriage to Isabella of Angouleme added Angouleme in 1220; that line ended with Philip IV's annexation of La Marche in 1314.\n\nA younger branch meanwhile rose in the Latin East: Guy of Lusignan wore the crown of Jerusalem, and in 1192, after the Third Crusade, the family settled on Cyprus, ruling from Nicosia for nearly three centuries. In 1337 a Lusignan still ruled a prosperous island enriched by Famagusta's trade.\n\nBy marriage it inherited the Armenian kingdom of Cilicia in the mid-fourteenth century, losing it to the Mamluks in 1375. After capturing King Janus in 1426, the Mamluks made Cyprus a tributary state, and in 1489 the last queen, Catherine Cornaro, was forced to sell the island to Venice, ending the Lusignan royal line."
 oe_lde_dyn_mulai_dynasty: "The Mulai were the lords of Kuhistan, the mountain country of southern Khorasan whose chief city was Qaen. On the collapse of the Ilkhanate in 1335, 'Abd-Allah b. Mulai joined the princes of eastern Iran in accepting Togha Temür as Ilkhan, and in 1337 he and Arghun Shah withdrew their troops from the western campaign at Bistam.\n\nA kinsman, Muhammad-i Mulai, was appointed governor of Khurasan by the Jalayirid Hasan Buzurg, but Togha Temür and Arghun Shah defeated and executed him later that year. 'Abd-Allah remained Togha Temür's ally against the Sarbadars until he was killed, together with the vizier Faryumadi, in the khan's defeat of 29 July 1342."
 oe_lde_dyn_qushji_dynasty: "The Qushji were the family of Shaykh 'Ali b. 'Ali Qushji, governor of Khurasan for the Ilkhanate, seated at Esfarayen. When Ilkhan Abu Sa'id died in 1335, Shaykh 'Ali led efforts to persuade the princes of eastern Iran to accept Togha Temür, a descendant of Genghis Khan's brother Qasar, as Ilkhan.\n\nHe directed the khan's government and tax policies, which made him unpopular with the local amirs. In the spring of 1337 he accompanied Togha Temür on an expedition to western Iran, but Arghun Shah of the Ja'un-i Qurban and the lord of Kuhistan withdrew at Bistam.\n\nAfter the Jalayirid Hasan Buzurg defeated the army near Soltaniyeh, Arghun Shah seized Shaykh 'Ali during the retreat and executed him in July 1337, sending his head to the victor."
 oe_lde_dyn_tadjeddinids_dynasty: "The Tacettinoğulları, or Beylik of Taceddin, was a Turkmen principality of northern Anatolia among the Beyliks of Canik. Its founder Taceddin established himself at Niksar in the mid-fourteenth century as Seljuk and Ilkhanid authority faded.\n\nIn 1378 he married Eudokia, daughter of the Trapezuntine emperor Alexios III; he fell in battle near Ordu in 1386. His son Mahmud accepted Kadı Burhaneddin's overlordship while secretly favoring Bayezid I, and after 1398 submitted to the Ottomans.\n\nMahmud kept his lands through Timur's invasion of 1402 and the Ottoman Interregnum, but backing the rebel Küçük Mustafa cost him his life in 1423, when his own soldiers killed him. His two sons held on around Samsun and Çarşamba for a few years until the beylik was absorbed by the Ottomans around 1428."
 oe_lde_cult_oe_albanian_greek_culture: "The Albanians first appear in Byzantine histories of the eleventh century; in the later Middle Ages they spread through Epirus, Thessaly and the Peloponnese, often as soldiers and settlers of the empire and its despots.\n\nIn Phoenix this is the culture of the people of Albania once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_croatian_greek_culture: "Illyria was the Roman name of the eastern shore of the Adriatic; Byzantine historians liked to call the peoples of the western Balkans by such ancient names.\n\nIn Phoenix this is the culture of the people of the eastern Adriatic once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_egypt_greek_culture: "Egypt was governed by Greek-speaking dynasties and Roman officials for nearly a thousand years after Alexander, until the Arab conquest of the seventh century; Alexandria was a capital of Greek learning throughout.\n\nIn Phoenix this is the culture of the people of Egypt once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_english_greek_culture: "Britannia was Rome's province on the island, given up when the legions left early in the fifth century. Islanders still came east afterwards: from the eleventh century many of the Varangian Guard were Anglo-Saxons.\n\nIn Phoenix this is the culture of the people of Britain once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_french_greek_culture: "Gaul was the Roman name for the lands west of the Alps, conquered by Caesar in the first century BC. The Byzantines themselves usually called westerners Franks or Latins.\n\nIn Phoenix this is the culture of the people of Gaul once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_georgian_greek_culture: "Georgia shared the Orthodox faith with Byzantium, and its kings married into the houses of Constantinople and Trebizond; the monastery of Iviron on the Holy Mountain was founded by Georgians in the tenth century.\n\nIn Phoenix this is the culture of the people of Georgia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_iberia_greek_culture: "Under Justinian the empire held a province, Spania, on the south-eastern coast of the Iberian peninsula, from the middle of the sixth century to the 620s.\n\nIn Phoenix this is the culture of the people of the Iberian peninsula once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_latin_greek_culture: "The Byzantines called the Italians and the Catholic West Latins. Imperial rule in southern Italy lasted until Bari fell in 1071, and Greek-speaking villages survive in Calabria and Salento to this day.\n\nIn Phoenix this is the culture of the people of Italy once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_levantine_greek_culture: "Melkite means 'the king's men': the Christians of Syria, Palestine and Egypt who accepted the Council of Chalcedon and kept the emperor's faith. Under Arab rule they stayed under the Orthodox patriarchs of Antioch, Jerusalem and Alexandria.\n\nIn Phoenix this is the culture of the people of Syria and the Levant once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_tunis_greek_culture: "Africa was the Roman province around Carthage, won back from the Vandals by Belisarius in 533 and governed as the Exarchate of Carthage until the city fell to the Arabs in 698. The Arabic name Ifriqiya comes from it.\n\nIn Phoenix this is the culture of the people of North Africa around Carthage once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_bulgarian_greek_culture: "Moesia was the Roman province south of the lower Danube. Byzantine historians, writing in an antique manner, often called the Bulgarians Moesians.\n\nIn Phoenix this is the culture of the people of Bulgaria once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_kudoyr_culture: "The mountains east of the Taurus have always belonged to clan chiefs; until the seventh century the empire's eastern frontier met Persia here.\n\nIn Phoenix this is the culture of the people of the Kurdish highlands once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_mesopotamian_culture: "Mesopotamia was one of Rome's easternmost provinces; Nisibis, Dara and Edessa were frontier cities fought over with Persia again and again. The Arabs took it in the seventh century, and in the eleventh the empire for a time won Edessa back.\n\nIn Phoenix this is the culture of the people of Mesopotamia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_serbian_greek_culture: "The Triballi were an ancient Thracian people south of the Danube. Byzantine historians, in their antique manner, called the Serbs Triballians.\n\nIn Phoenix this is the culture of the people of Serbia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_arabian_greek_culture: "Rome made Arabia a province in 106, with its seat at Bostra; in the sixth century the empire relied on the Christian Ghassanid Arabs to hold the desert frontier.\n\nIn Phoenix this is the culture of the people of Arabia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_moldova_greek_culture: "Dacia was the province Trajan conquered north of the Danube, given up late in the third century. Late Byzantine historians called the Wallachians and Moldavians Dacians.\n\nIn Phoenix this is the culture of the people of Moldavia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_paeones_culture: "Paeonia was the ancient highland north of Macedon. Byzantine historians, in their antique manner, called the Hungarians Paeonians.\n\nIn Phoenix this is the culture of the people of Hungary once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_armenian_greek_culture: "The Armenians were among the empire's most important frontier peoples: from Herakleios to the Macedonian dynasty many emperors and generals came of Armenian families. Armenians who held the Chalcedonian creed and the church of Constantinople were known as Tzatoi.\n\nIn Phoenix this is the culture of the people of Armenia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_tur_greek_culture: "Rûm is the Muslim name for the Romans and their land; the Seljuk sultanate in Asia Minor took its name from it. Under Turkish rule Anatolia kept large Orthodox populations, Greek-speaking and Turkish-speaking alike.\n\nIn Phoenix this is the culture of the people of Anatolia once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_cult_oe_german_greek_culture: "Germania was the Roman name for the lands east of the Rhine, of which Rome held only the edge and only briefly. The Byzantines called the Germans Alamanoi or Nemitzoi.\n\nIn Phoenix this is the culture of the people of Germany once they have taken up Greek speech and a Roman identity under the empire; it belongs to the Greek culture group. It is not a people of history: it appears only after the empire rules the land again and local identity has turned."
 oe_lde_ctry_QING_1821: "At the accession of the Daoguang Emperor in 1820, the Great Qing Empire spanned from Sakhalin to the Pamirs and from the Outer Khingan to Taiwan, governing more than three hundred million subjects through Eight Banner garrisons, the Lifanyuan Mongol-Tibetan banners, and provincial governors-general.\n\nYet beneath the afterglow of the High Qing lay mounting strain: silver outflows from illicit opium trade drove copper-silver deflation, Grand Canal upkeep and local administration grew burdened, and industrial European maritime powers pressed against the Canton trade gate. The court stood at the threshold of an unprecedented collision between the classical tributary order and the modern world."
 oe_lde_ctry_QING_1776: "The Qianlong reign marked the apex of the High Qing golden age. Imperial campaigns subdued the Dzungars and Altishahr, anchoring Xinjiang, Mongolia, and Tibet under the Generals of Ili and Uliastai, while tax consolidation and agrarian expansion lifted China's population toward three hundred million and the Siku Quanshu monumentalized imperial scholarship.\n\nRegulated maritime trade at Canton and continental tribute networks drew global silver into Qing markets. Yet behind the Ten Great Campaigns lurked rising fiscal costs, administrative complacency, and demographic pressure—testing whether the empire could reform from a position of strength."
 oe_lde_ctry_QING_1648: "Founded in Manchuria by Nurhaci and Hong Taiji, the Great Qing entered Shanhai Pass in 1644 under Prince Regent Dorgon and enthroned the Shunzhi Emperor in Beijing. Anchored by the Eight Banners and allied Inner Mongolian leagues, the early Qing court marshaled Manchu, Mongol, and Han banner armies to contend with Southern Ming loyalists and maritime rivals.\n\nUnder the Kangxi and Yongzheng emperors, the dynasty suppressed the Three Feudatories, brought Taiwan under imperial rule, fixed the Amur frontier in the Treaty of Nerchinsk, and perfected central administration through the Grand Council, forging a durable multi-ethnic empire across East and Inner Asia."
 oe_lde_ctry_MNG_1644: "After the fall of Beijing in 1644, Ming princes and loyalist officials rallied in Nanjing, Fuzhou, Guangzhou, and Kunming under the Hongguang, Longwu, and Yongli courts—known to history as the Southern Ming. Holding the Yangtze valleys, the southwestern highlands, and coastal fleets, they sought to halt the Banner advance and mount a northern restoration.\n\nBeset by factional rivalries, warlord autonomy, and relentless Qing offensives, the loyalist regimes fought desperately along the dynasty's last frontiers. Only by uniting military command and mobilizing southern wealth could the House of Zhu hope to turn the tide."
 oe_lde_ctry_MNG_1444: "Founded in 1368 by Zhu Yuanzhang and elevated by the Yongle Emperor's northern capital at Beijing and Zheng He's treasure fleets, the Ming dynasty stood in the mid-fifteenth century as East Asia's wealthiest agrarian empire. Along the northern frontier the Nine Garrisons guarded the Great Wall against Oirat and Tatar incursions, backed by hereditary weisuo military colonies.\n\nFrom the Zhengtong era onward, steppe crises, coastal piracy, and the influx of global silver reshaped the realm, driving Single Whip fiscal reforms and a booming Jiangnan commercial economy. Balancing border defense, maritime policy, and civil bureaucracy defined the dynasty's fate."
 oe_lde_ctry_JAP_1204: "Established by Minamoto no Yoritomo as Seii Taishogun in 1192, the Kamakura Shogunate inaugurated samurai military governance in Japan. Seated in the Kanto at Kamakura, it appointed shugo constables and jito stewards across the provinces alongside the imperial court in Kyoto.\n\nAs the Minamoto shogunal line failed in the early thirteenth century, the Hojo regents assumed real power, crushing the Jokyu rebellion and repelling the Mongol invasions. Strained by unpaid samurai rewards even as Zen culture flourished, the Kamakura order faced mounting pressure from within."
 oe_lde_ctry_JAP_1648: "Victory at Sekigahara in 1600 and shogunal investiture in 1603 allowed Tokugawa Ieyasu to found the Edo Shogunate. Through the bakuhan balance of shogunal domains and over two hundred daimyo fiefs, alternate attendance (sankin-kotai), and strict samurai codes, the Tokugawa brought lasting peace after a century of civil war.\n\nFollowing the maritime restrictions of the 1630s, foreign contact narrowed to Nagasaki's Dejima, Tsushima, Satsuma, and Matsumae, while domestic stability fueled vibrant urban commerce and Genroku arts in Edo, Osaka, and Kyoto."
 oe_lde_ctry_JAP_1776: "By the late eighteenth and early nineteenth centuries, Tokugawa rule had maintained over a century and a half of domestic peace. Integrated rice markets in Osaka, bustling crafts in Edo, widespread literacy, and Dutch Learning (Rangaku) filtering through Nagasaki fostered an active intellectual and commercial society.\n\nYet stipended samurai struggled with fiscal strain and cyclical reforms while Russian, British, and American vessels appeared off Hokkaido and southern harbors, foreshadowing the maritime challenges closing in on the shogunate."
 oe_lde_ctry_KOR_1444: "Founded in 1392 by Yi Seong-gye with its capital at Hanseong, the Joseon Dynasty rebuilt Korea on Neo-Confucian statecraft, civil examinations, and Six Ministries administration while securing the Yalu and Tumen river frontiers in the north.\n\nUnder King Sejong, the creation of Hangul alongside advances in astronomy, printing, and agronomy marked a cultural zenith. Later torn by literati purges and the devastating Imjin invasions, the kingdom endured through Admiral Yi Sun-sin's naval victories and Ming relief."
 oe_lde_ctry_KOR_1648: "Recovering from the Manchu invasions and Ming-Qing transition, mid-Joseon Korea rebuilt its agrarian and fiscal foundations through the Uniform Land Tax (Daedongbeop) while maintaining formal tributary relations with Beijing and preserving Confucian orthodoxy at home.\n\nIn the eighteenth century, Kings Yeongjo and Jeongjo curbed factional strife through impartial appointments, established the Kyujanggak royal library, and oversaw a flourishing of Silhak practical scholarship and domestic commerce."
 oe_lde_ctry_KOR_1821: "In the early nineteenth century under King Sunjo, Joseon retained territorial unity and venerable scholarly institutions, but royal in-law oligarchy (sedo politics), tax abuses, and provincial unrest sapped state vitality.\n\nWhile the court upheld strict maritime seclusion, Western learning circulated quietly and foreign survey ships began probing Korean coasts, confronting the peninsula with the opening pressures of the nineteenth century."
 oe_lde_ctry_BYZ_1204: "After the Fourth Crusade sacked Constantinople in 1204, the Roman imperial line survived in exile. Theodore I Laskaris rallied displaced nobles, soldiers, and the Ecumenical Patriarchate at Nicaea in Bithynia, forging the strongest Greek successor empire in Asia Minor.\n\nHemmed in by the Latin Empire, the Seljuk Sultanate of Rum, and rival Greek courts at Epirus and Trebizond, Nicaea built a disciplined army and solvent agrarian treasury, biding its hour to reclaim the Queen of Cities."
 oe_lde_ctry_BYZ_1444: "On the eve of the 1444 Crusade of Varna, the thousand-year Roman Empire had shrunk to Constantinople, the Despotate of the Morea, and scattered Aegean holdings. Emperor John VIII and his brother Constantine stood at the brink, weighing Western crusading aid and the Union of Florence against reliance on the Theodosian Walls and Orthodox resolve.\n\nEncircled by Ottoman armies and drained by Italian maritime privileges, the last embers of the phoenix still glowed in Constantinople and Mystras—poised between historic extinction and miraculous resurgence."
 oe_lde_ctry_TUR_1444: "By the mid-fifteenth century the Ottoman realm straddled Anatolia and Rumelia from its capital at Edirne. Murad II and the young Mehmed II commanded standing Janissary infantry and provincial Timariot cavalry as the Varna Crusade converged on the Danube.\n\nOnly the capture of Constantinople would fuse the empire's European and Asian halves, clearing the path toward the Levant, Egypt, and central Europe as a transcontinental superpower."
 oe_lde_ctry_TUR_1648: "In the mid-seventeenth century the Ottoman Empire still stretched from Mesopotamia to the Maghreb and from Hungary to the Black Sea. After the draining Cretan War and palace turmoil, the Koprulu grand viziers restored fiscal discipline and revived imperial armies.\n\nThe early eighteenth-century Tulip Era brought architectural and cultural refinement to Istanbul, yet the rising military power of Habsburg Austria and Romanov Russia placed growing strain upon the empire's Danubian and Pontic frontiers."
 oe_lde_ctry_TUR_1776: "Following the 1774 Treaty of Kuchuk-Kaynarca, Ottoman dominance over the Black Sea receded and European powers began contesting the empire's fate in the Eastern Question. Provincial ayan notables grew autonomous while the old Janissary corps resisted military modernization.\n\nFrom Selim III's Nizam-i Cedid reforms to Mahmud II's sweeping centralization, the Sublime Porte struggled to modernize its army and administration amid great-power diplomacy, Balkan uprisings, and the rise of Muhammad Ali in Egypt."
 oe_lde_ctry_RUS_1648: "Emerging from the Time of Troubles under the Romanov dynasty, the Tsardom of Russia rebuilt central authority under Tsar Alexis I. The 1649 Sobornoye Ulozheniye codified imperial law while Cossack pioneers pushed across Siberia to the Pacific and the Amur frontier.\n\nIn the west, union with the Zaporozhian Host drew Russia into decisive contests with Poland-Lithuania before Peter the Great won the Baltic coast, founded Saint Petersburg, and transformed the tsardom into a European empire."
 oe_lde_ctry_RUS_1776: "Under Empress Catherine the Great, the eighteenth-century Russian Empire reached a new pinnacle of territorial and diplomatic might. From enlightened Saint Petersburg, Russia secured the Black Sea steppe and Crimea, expanded westward in the Polish partitions, and extended its fur trade to Alaska.\n\nCombining aristocratic charters with Europe's largest standing army and vast iron, timber, and grain output, Russia stood as a decisive arbiter of both the European balance and the Near East."
 oe_lde_ctry_RUS_1821: "Fresh from defeating Napoleon and marching into Paris, the Russian Empire under Tsar Alexander I towered over Eurasia as the architect of the Holy Alliance, holding Finland, Congress Poland, the Caucasus approaches, and Siberia.\n\nBeneath military triumph, however, serfdom slowed industrial transformation while young officers exposed to Western constitutional ideas grew restive—leaving the Romanov throne torn between legitimist order and domestic reform."
 oe_lde_ctry_GBR_1648: "The mid-seventeenth century forged modern Britain through constitutional upheaval and maritime ambition. Civil war, commonwealth rule, restoration, and the Glorious Revolution established parliamentary sovereignty and public credit anchored by the Bank of England.\n\nBacked by the Navigation Acts, a growing Royal Navy, and chartered posts in North America, the Caribbean, and India, Britain rapidly challenged Dutch commercial supremacy across the oceans."
 oe_lde_ctry_GBR_1776: "Triumphant after the Seven Years' War, Georgian Great Britain commanded the oceans with the Royal Navy, consolidated East India Company rule in Bengal, and ignited the early Industrial Revolution in coal, iron, and textiles.\n\nYet in 1776 rebellion erupted across the thirteen American colonies as France and Spain watched for an opening, testing the resilience of Britain's public debt, global fleet, and parliamentary empire."
 oe_lde_ctry_GBR_1821: "After Waterloo, the United Kingdom entered the era of Pax Britannica. Serving as the world's industrial workshop and financial clearinghouse, London guarded the sea lanes from Gibraltar and the Cape to Ceylon and Singapore while consolidating paramountcy across India.\n\nBooming steam industry and maritime commerce powered global reach, even as debates over parliamentary reform, Corn Laws, and urban labor reshaped British politics at home."
 oe_lde_ctry_FRA_1648: "The 1648 Peace of Westphalia launched Bourbon France toward continental primacy. Following Richelieu and Mazarin, the Sun King Louis XIV crafted the model of European absolutism at Versailles, backed by Colbert's mercantilist finance and Vauban's border fortresses.\n\nEndowed with western Europe's largest population and army, France set the continent's cultural standard even as relentless expansion provoked grand coalitions against it."
 oe_lde_ctry_FRA_1776: "In the late eighteenth century, France was the heartland of the Enlightenment, radiating philosophy and diplomacy across Europe while sustaining formidable armed forces and rich Caribbean colonies. Under Louis XVI, Versailles weighed intervening in the American war to avenge the Seven Years' War.\n\nBeneath that splendor, aristocratic tax exemptions and spiraling war debt pushed royal finances toward collapse, setting the stage for revolutionary upheaval and continental transformation."
 oe_lde_ctry_FRA_1821: "Following Napoleon's downfall, Louis XVIII restored the Bourbon monarchy under the Constitutional Charter of 1814. Reduced to its 1792 frontiers, France nevertheless preserved the Napoleonic legal code, deep economic vitality, and diplomatic agility, swiftly re-entering the Concert of Europe.\n\nNavigating fierce tensions between ultra-royalists, constitutional liberals, and Bonapartist memories, Paris sought to rebuild its weight in European and Mediterranean affairs."
 oe_lde_ctry_SPA_1648: "Even after acknowledging Dutch independence in 1648, Habsburg Spain under Philip IV ruled a global monarchy spanning Iberia, the Southern Netherlands, Milan, Naples, New Spain, Peru, and the Philippines.\n\nSilver fleets still sailed from the Americas and Golden Age arts flourished, yet decades of multi-front wars, revolts in Portugal and Catalonia, and fiscal exhaustion severely strained Madrid's hold on European hegemony."
 oe_lde_ctry_SPA_1776: "Under the Bourbon dynasty and the enlightened rule of Charles III, eighteenth-century Spain launched sweeping imperial reforms: rebuilding the Armada, reorganizing American viceroyalties, and liberalizing intra-imperial trade to revive silver and customs revenues.\n\nBound to France by the Bourbon Family Compact, Madrid looked to check British supremacy in the Caribbean and Mediterranean while tightening administration across the Atlantic."
 oe_lde_ctry_SPA_1821: "Exhausted by the Peninsular War against Napoleon, Spain faced simultaneous constitutional and imperial crisis. In 1820 a liberal pronunciamiento forced Ferdinand VII to restore the 1812 Cadiz Constitution, launching the Liberal Triennium and alarming the conservative powers of the Holy Alliance.\n\nAcross the Atlantic, independence movements swept Mexico, New Granada, and Peru, bringing three centuries of Spanish rule on the American mainland to the brink of dissolution."
 oe_lde_ctry_HAB_1648: "With imperial authority over German princes curtailed by the 1648 Peace of Westphalia, the Vienna Habsburgs turned decisively toward consolidating their hereditary domains of Austria, Bohemia, and Hungary.\n\nAfter breaking the 1683 siege of Vienna, Emperor Leopold I and Prince Eugene of Savoy reconquered the Danubian basin, transforming the Baroque monarchy into Central Europe's premier Catholic power."
 oe_lde_ctry_HAB_1776: "Guided by the enlightened reforms of Maria Theresa and Joseph II, the Habsburg Monarchy modernized its standing army, central bureaucracy, schooling, and fiscal administration to counter the rise of Prussia.\n\nHolding the imperial crown of the Holy Roman Empire, Vienna balanced rivalries across Silesia, Poland, and the Ottoman Balkans while binding its diverse peoples under centralized rule."
 oe_lde_ctry_HAB_1821: "Following the dissolution of the Holy Roman Empire in 1806, Emperor Francis I preserved Habsburg primacy as the Austrian Empire, hosting the 1815 Congress of Vienna where Chancellor Metternich crafted Europe's post-Napoleonic order.\n\nPresiding over the German Confederation and ruling Lombardy-Venetia, Vienna stood as the bulwark of conservative legitimacy while guarding against rising nationalist and constitutional currents."
 oe_lde_ctry_PRU_1776: "Crowned in 1701 and drilled into fiscal and military precision by the Soldier King Frederick William I, the Kingdom of Prussia surged into the first rank of European powers under Frederick the Great through the Silesian and Seven Years' Wars.\n\nBlending the Enlightenment court of Sanssouci with peerless infantry discipline and state bureaucracy, Berlin emerged as Vienna's formidable rival for leadership in Germany."
 oe_lde_ctry_PRU_1821: "Reborn after Jena through the Stein-Hardenberg reforms—emancipating serfs, forging the General Staff, and instituting universal conscription—Prussia helped topple Napoleon and won the rich Rhineland and northern Saxony at Vienna in 1815.\n\nSpanning East Prussian estates and western coal-and-iron basins, Berlin paired administrative efficiency with growing industrial weight, laying the foundation for German unification."
 oe_lde_ctry_IRA_1648: "In the mid-seventeenth century Safavid Persia shone from its splendid capital of Isfahan, heir to the golden age of Shah Abbas the Great. Under Abbas II, Persian silk flowed to Europe and India while royal architecture and miniature painting reached unmatched elegance.\n\nHolding the Iranian plateau under Twelver Shiism between Ottoman and Mughal rivals, the dynasty nonetheless allowed provincial armies to decay—a vulnerability that would later prove fatal."
 oe_lde_ctry_IRA_1776: "After the fall of the Safavids and the meteoric conquests of Nader Shah, Karim Khan of the Zand dynasty ruled from Shiraz under the modest title Vakil al-Ra'aya—Deputy of the People—bringing more than two decades of welcome peace and rebuilding.\n\nMarkets in Shiraz and ports on the Persian Gulf revived under his stewardship, yet the ambitious Qajar tribes of northern Iran waited for his passing to ignite a new war for the throne."
 oe_lde_ctry_IRA_1821: "United in 1796 under the Qajar dynasty with its new capital at Tehran, Persia under Fath-Ali Shah restored royal authority and courtly splendor across the Iranian plateau.\n\nYet early nineteenth-century Iran found itself caught between imperial giants: Russian advances in the Caucasus enforced the 1813 Treaty of Gulistan, while British India pressed from the Persian Gulf, forcing Tehran into an urgent struggle for survival and military reform."
 oe_lde_ctry_MUG_1648: "In the mid-seventeenth century the Mughal Empire reached its zenith under Shah Jahan and Aurangzeb, commanding the rich Indo-Gangetic plain and vast stretches of the Deccan while generating roughly a quarter of global manufactures. Delhi's Red Fort and Agra's Taj Mahal embodied its immense wealth.\n\nGoverned through the mansabdari system and Rajput alliances, the empire nevertheless strained its treasury and cohesion in grueling Deccan campaigns and succession wars."
 oe_lde_ctry_MUG_1776: "Following Aurangzeb's death in 1707 and Nader Shah's sack of Delhi in 1739, Mughal authority fractured as Bengal, Awadh, and Hyderabad became autonomous realms and the Marathas and British East India Company contested dominance across India.\n\nThough Emperor Shah Alam II still held immense legal prestige as nominal sovereign in Delhi, the Peacock Throne stood in deep twilight."
 oe_lde_ctry_MHR_1648: "In the mid-seventeenth century a formidable new power rose in the Western Ghats of the Deccan. Led by Shivaji, agile Maratha light cavalry and mountain fortresses carved out an independent Swarajya between Bijapur and the Mughal Empire.\n\nCrowned Chhatrapati in 1674 with a disciplined council of ministers and coastal navy, Shivaji forged the Marathas into India's most dynamic indigenous movement."
 oe_lde_ctry_MHR_1776: "By the later eighteenth century, the Maratha Confederacy—guided from Pune by the Peshwas alongside the great houses of Scindia, Holkar, Gaekwad, and Bhonsle—dominated central and northern India from Gujarat to the gates of Delhi.\n\nRebounding even from the catastrophic 1761 Battle of Panipat, the confederacy nonetheless faced internal rivalries and the relentless advance of the British East India Company in a decisive struggle for India."
 oe_lde_ctry_USA_1776: "On July 4, 1776, thirteen Atlantic colonies gathered in Philadelphia issued the Declaration of Independence, proclaiming the United States of America. Under George Washington, the Continental Army endured harsh campaigns against Britain until victory at Saratoga brought French and Spanish alliance.\n\nSecuring independence and adopting the federal Constitution of 1787, the young republic stood poised between Atlantic maritime commerce and a vast western frontier."
 oe_lde_ctry_USA_1821: "By 1821 the United States had doubled its territory through the Louisiana Purchase and emerged from the War of 1812 with heightened national confidence. During President James Monroe's Era of Good Feelings, canals, steamboats, and surging Atlantic exports fueled rapid growth.\n\nApproaching ten million citizens and preparing to assert hemispheric independence, the young republic nevertheless confronted deepening sectional divisions over slavery in the expanding West."
 oe_lde_ctry_MEX_1821: "After a decade of revolutionary insurgency, the 1821 Plan of Iguala united royalist commander Agustin de Iturbide and rebel leader Vicente Guerrero to end three centuries of Spanish rule and launch an independent Mexico.\n\nInheriting a vast domain stretching from Upper California and Texas to Central America along with rich silver districts, the new nation faced postwar debt, fierce constitutional divisions, and growing pressure along its northern frontier."
 oe_lde_ctry_GRE_1821: "In the spring of 1821, sparked by the secret Filiki Eteria society, revolt swept across the Peloponnese and the Aegean islands as klepht mountain fighters and merchant captains rose to end nearly four centuries of Ottoman rule.\n\nThe Greek War of Independence ignited a wave of European philhellenism and drew Britain, France, and Russia into the Eastern Question, heralding the rebirth of an independent Hellenic state."
 oe_lde_ctry_EGY_1821: "Seizing power in Cairo in 1805 and eliminating the old Mamluk beys, Muhammad Ali Pasha transformed Ottoman Egypt into the Near East's boldest modernizing state.\n\nFinancing European-style conscript armies, arsenals, and a formidable navy through state cotton monopolies, Egypt projected power into the Hejaz and Sudan while preparing to reshape the balance of the Levant and eastern Mediterranean."
 oe_lde_ctry_CSO_1204: "Following the loss of the north, the Southern Song court established its capital at Lin'an (Hangzhou), facing the Jurchen Jin across the Huai River line. Though reduced to southern China, the dynasty commanded rich Jiangnan rice basins, bustling maritime trade ports, paper currency, Neo-Confucian academies, and formidable riverine navies.\n\nIn the early thirteenth century, court factions debated launching a northern reconquest even as rising Mongol power across the steppe prepared to overturn the East Asian balance."
 oe_lde_ctry_JIN_1204: "Founded by the Jurchen Wanyan clan after toppling the Liao and Northern Song, the Great Jin ruled Manchuria and northern China from Zhongdu (Beijing). Its dual regime paired hereditary Jurchen military households with classical Chinese civil examinations and central ministries.\n\nBy the early thirteenth century, cultural splendor under Emperor Zhangzong masked growing fiscal pressure, Yellow River floods, and the gathering storm of a unified Mongolia on the northern frontier."
 oe_lde_ctry_YUA_1444: "After withdrawing north of the Gobi in 1368, the Borjigin khans upheld the imperial Yuan banner across the Mongolian steppe as the Northern Yuan. Even when khans were eclipsed by powerful Oirat or eastern Mongol taishis, steppe cavalry held the Ordos and Yin Mountains opposite the Ming Nine Garrisons.\n\nFrom Dayan Khan to Altan Khan and Ligdan Khan, Mongol lineages contested the great khanate, border horse markets, and Tibetan Buddhist patronage across the northern frontier."
 oe_lde_ctry_KOXINGA_1648: "Amid the Ming-Qing transition, Zheng Chenggong—known across the seas as Koxinga—forged a maritime loyalist stronghold along the Fujian coast at Xiamen and Kinmen, fighting under the Ming banner with a battle-hardened fleet financed by trade linking Japan and Southeast Asia.\n\nCrossing the strait in 1661 to expel the Dutch East India Company from Taiwan, the House of Zheng established the Kingdom of Tungning as the last bastion of Ming maritime resistance."
 oe_lde_ctry_JAP_1444: "Following the end of the Northern and Southern Courts, the Ashikaga Shogunate in Kyoto oversaw the cultural flowering of Muromachi Japan and official tally trade with Ming China while balancing powerful deputy houses such as the Hosokawa, Hatakeyama, and Shiba.\n\nYet shogunal holdings remained narrow beside entrenched provincial shugo daimyo; after the Kakitsu crisis and the Onin War, central control shattered and the archipelago plunged into the Sengoku age of warring states."
 oe_lde_ctry_KOR_1204: "After the military coup of 1170, the Goryeo Kingdom at Gaegyeong entered a century of martial rule. Under Choe Chung-heon, the House of Choe governed through private elite guards and administrative councils while retaining the Wang royal throne as a formal symbol.\n\nCeladon craft, Buddhist woodblock scholarship, and Yellow Sea commerce endured even as Mongol armies gathered along the northern border."
 oe_lde_ctry_TIB_1648: "In 1642 the Khoshut Mongol leader Gushi Khan unified central Tibet under the Fifth Dalai Lama's Ganden Phodrang government, rebuilding the Potala Palace at Lhasa as the spiritual and political heart of the Tibetan plateau.\n\nThrough the seventeenth to nineteenth centuries, Lhasa navigated Gelug monastic institutions, Oirat steppe intervention, and Qing imperial ambans while anchoring Buddhist learning across Inner Asia."
 oe_lde_ctry_RYU_1444: "Unified by Sho Hashi in 1429 from the castle of Shuri, the Kingdom of Ryukyu styled itself a bridge of nations across the East China Sea. Leveraging tributary access to Ming and Qing ports, Ryukyuan vessels linked Chinese silks, Japanese silver, and Southeast Asian spices.\n\nEven after Satsuma's 1609 expedition placed the islands under dual oversight, Shuri preserved its royal court, maritime customs, and diplomatic ties with Beijing."
 oe_lde_ctry_MCH_1444: "Across the forests and river valleys of Manchuria dwelt the Jianzhou, Haixi, and Wild Jurchen confederations, trading ginseng and sable furs at Ming frontier horse markets while mastering ironwork and cavalry warfare.\n\nIn the late sixteenth century Nurhaci united the Jurchen tribes under the Eight Banners military-civil organization, proclaiming the Later Jin in 1616 and launching the campaigns into Liaodong that forged the future Qing Empire."
 oe_lde_ctry_CDL_1204: "Centered on Lake Erhai beneath the Cangshan peaks, the Duan Kingdom of Dali inherited Nanzhao's southwestern realm, combining Esoteric Buddhist kingship with high-ranking Gao prime ministers and prosperous horse-and-tea trade into Song Sichuan.\n\nShielded by rugged mountain passes for three centuries, Dali maintained independent prosperity until Khubilai's Mongol armies crossed the upper Yangtze in the mid-thirteenth century."
 oe_lde_ctry_CHG_1444: "After Timurid emirs took Transoxiana, the eastern line of Chinggis Khan's second son endured across the Tianshan and Tarim Basin as Eastern Chagatai (Moghulistan). Blending steppe horsemen with Silk Road oasis towns, its khans contested the Ili valley against Timurids, Oirats, and Kazakhs.\n\nIn the sixteenth century successor branches at Yarkand and Turpan sustained Chaghadaid lineage alongside influential Sufi lodges and caravan commerce."
 oe_lde_ctry_APD_1444: "The Apardi were a Turco-Mongol tribal lineage rooted south of the Amu Darya around Sheberghan, Andkhoy, and Balkh. Integrated into the post-Timurid military aristocracy, their emirs guarded pastures, fortresses, and caravan roads linking Transoxiana, Khorasan, and the Hindu Kush passes.\n\nAcross the successive eras of Timurid princes, Uzbek Bukhara, and Durrani Afghanistan, Apardi chieftains preserved local autonomy through fortified oases and mobile frontier cavalry."
 oe_lde_ctry_OIR_1444: "The Four Oirats—confederating the Choros, Khoshut, Torghut, and Dorbet lineages—roamed the Altai and Junggar steppes of western Mongolia. In the mid-fifteenth century Toghon and Esen Taishi forged a sweeping steppe hegemony, shattering a Ming imperial expedition at the 1449 Tumu Crisis.\n\nEven after fragmentation followed Esen's death, the Oirat confederation remained a formidable military power across the western steppe and Silk Road approaches."
 oe_lde_ctry_DZUNGAR_1648: "Founded in the Ili basin by Erdeni Batur and expanded under Galdan Boshugtu Khan, the Dzungar Khanate rose as the last great nomadic empire of Inner Asia. Combining steppe cavalry with musketry, metallurgy, and Tarim oasis revenues, Dzungaria projected power into Khalkha Mongolia and Tibet.\n\nUnder Galdan, Tsewang Rabtan, and Galdan Tseren, the khanate waged a seventy-year contest with the Great Qing for supremacy over Inner Asia while guarding its northern frontier against Russian Siberia."
 oe_lde_ctry_KAZ_1444: "Born in the mid-fifteenth century when Jochid princes Kerey and Janibek led steppe clans to the Chu and Zhetysu rivers, the Kazakh Khanate united vast pastures across the Kipchak steppe. Under Kasym Khan and Tauke Khan, it codified customary law in the Jeti Jargy and contested the trading cities of the Syr Darya.\n\nBalanced between Uzbek Bukhara, the Nogais, and the expanding Dzungars, the three Kazakh hordes defended the central Eurasian heartland with mobile horse archers."
 oe_lde_ctry_KAZ_1776: "Recovering from the devastating Dzungar wars of the early eighteenth century, the Kazakh Senior, Middle, and Junior Zhuzes rallied under the statesman-warrior Ablai Khan. Hemmed in by Russian fortified steppe lines to the north, Qing Ili garrisons to the east, and Kokand to the south, the steppe faced immense geopolitical pressure.\n\nThrough deft diplomacy between Saint Petersburg and Beijing, Ablai preserved practical autonomy across the steppe while navigating the rising imperial order."
 oe_lde_ctry_UZB_1648: "Established after Muhammad Shaybani led the Uzbeks into Transoxiana, the Khanate—and later Emirate—of Bukhara ruled Samarkand and the fertile Zeravshan oasis through the Shaybanid, Janid, and Manghit dynasties. Its madrasas, bazaars, and caravan routes made Bukhara the foremost center of Islamic learning and trade in Central Asia.\n\nPositioned between Persia, Russia, Kokand, and Qing Xinjiang, Bukhara balanced desert defenses and diplomacy to guard the heart of Transoxiana."
 oe_lde_ctry_KHW_1648: "Founded in the early sixteenth century by Uzbek Shibanid princes across the irrigated lower Amu Darya oasis and later centered on Khiva, the Khanate of Khiva turned the surrounding Karakum and Kyzylkum deserts into natural moats.\n\nUnder the Arabshahid and later Qongirat dynasties, Khiva relied on canal agriculture and Turkmen desert horsemen to hold its oasis crossroads against Persian invasions and Russian steppe expeditions."
 oe_lde_ctry_CRI_1444: "Founded around 1441 by Haci I Giray upon breaking from the Golden Horde, the Crimean Khanate governed the peninsula and northern Pontic steppe from Bakhchisarai. Following the Ottoman capture of Genoese Caffa in 1475, Mengli I Giray entered a strategic alliance and vassalage with Istanbul.\n\nFielding swift steppe cavalry across the Wild Fields against Moscow and Poland-Lithuania, the Giray khans stood for generations as the northern shield and spear of the Black Sea world."
 oe_lde_ctry_CRI_1648: "In the seventeenth and eighteenth centuries, the Giray khans of Bakhchisarai commanded the Perekop fortress and Nogai steppes, intervening decisively in Cossack rebellions and Ottoman wars across Ukraine and Poland.\n\nAs modernized Russian armies and Black Sea fleets pushed south under Peter and Catherine the Great, however, Crimea's formal independence after 1774 left the khanate perilously exposed to imperial annexation."
 oe_lde_ctry_NOG_1444: "Emerging from the Manghit confederation led by the kingmaker Edigu, the Nogai Horde pastured between the lower Volga, the Ural River, and the northern Aral around Saraychik. Supplying vast herds of horses to Moscow and Crimea, Nogai mirzas acted as powerbrokers across Kazan and Astrakhan.\n\nAfter Russia annexed Astrakhan in 1556 and Kalmyks reached the Volga, the Nogais split into Greater and Lesser Hordes along the northern Caucasus and Black Sea frontiers."
 oe_lde_ctry_KALMYK_1648: "During the seventeenth century, Oirat Mongols forged two remarkable frontier realms: the Torghuts migrated west to the lower Volga to form the Buddhist Kalmyk Khanate, while the Khoshuts under Gushi Khan secured Qinghai and Tibet.\n\nKalmyk cavalry fought alongside Russia across the steppe until tightening imperial oversight spurred Ubashi Khan's epic 1771 eastward return toward the Ili valley."
 oe_lde_ctry_KHALKHA_1648: "Descending from Dayan Khan's youngest son Gersenz, the Khalkha Mongols held northern Mongolia across the Orkhon valley under the Tusheet, Sechen, and Zasagtu khans, unified spiritually around the Jebtsundamba Khutuktu.\n\nWhen Galdan's Dzungars invaded from the west, the Khalkha nobility rallied to the Qing at the 1691 Convention of Dolon Nor, retaining hereditary banners guarding the northern steppe and Kyakhta caravan routes."
 oe_lde_ctry_TIM_1444: "After Timur forged an empire from Transoxiana to Persia, his son Shah Rukh and grandson Ulugh Beg turned Herat and Samarkand into twin capitals of the Timurid Renaissance—renowned for astronomical observatories, turquoise tilework, Persian miniatures, and Chagatai literature.\n\nYet appanage rivalries fractured the realm after Shah Rukh's reign, opening Khorasan and Transoxiana to rising Qara Qoyunlu, Aq Qoyunlu, and Uzbek challengers."
 oe_lde_ctry_GLH_1444: "By the mid-fifteenth century, the once-mighty Golden Horde had fragmented into Crimea, Kazan, and Uzbek polities, leaving its core on the lower Volga around Sarai known as the Great Horde.\n\nAkhmat Khan strove to reassert Jochid suzerainty over Moscow, but the 1480 standoff on the Ugra River broke that bid, leaving the Great Horde squeezed between Muscovy, Crimea, and the Nogais."
 oe_lde_ctry_VEN_1204: "In 1204 the nonagenarian Doge Enrico Dandolo turned the Fourth Crusade into Venice's greatest maritime triumph, claiming three-eighths of the Byzantine Empire—including Crete, Negroponte, and key Aegean ports—as the foundation of the Stato da Mar.\n\nWith the winged lion of Saint Mark commanding the Adriatic and eastern Mediterranean lanes, Venetian galleys brought Levantine spice and silk riches pouring into the lagoon."
 oe_lde_ctry_VEN_1444: "In the fifteenth and sixteenth centuries La Serenissima stood at the height of its power, combining its Adriatic and Levantine island empire with a rich northern Italian Terraferma. The Venetian Arsenal pioneered standardized shipbuilding while printing presses and Renaissance workshops flourished along the canals.\n\nYet rising Ottoman sea power in the east and jealous continental coalitions in Italy increasingly tested the maritime republic on both land and sea."
 oe_lde_ctry_VEN_1648: "Though Atlantic trade had eroded its ancient spice monopoly, seventeenth- and eighteenth-century Venice fought tenaciously to defend its Mediterranean legacy—from the twenty-four-year siege of Candia to Francesco Morosini's reconquest of the Morea.\n\nBy the late eighteenth century the republic relied on cautious neutrality and cultural brilliance, even as revolutionary France and Habsburg Austria loomed over northern Italy."
 oe_lde_ctry_GEN_1444: "Anchored by its Ligurian harbor and the pioneering Bank of Saint George, the Republic of Genoa remained a linchpin of European maritime commerce and sovereign finance. After losing its Black Sea and Aegean outposts, Andrea Doria's 1528 reforms and banking ties to Habsburg Spain inaugurated the Age of the Genoese.\n\nEven after French naval bombardments and the cession of Corsica, Genoese financiers and shipowners kept the republic vital across the western Mediterranean."
 oe_lde_ctry_MLO_1444: "Commanding the fertile Lombard plain and the key Alpine passes into Italy, the Duchy of Milan flourished under the Visconti and Sforza dukes as a center of armorers, silk looms, and Renaissance patronage welcoming Leonardo da Vinci and Bramante.\n\nBecause control of Milan unlocked hegemony across the peninsula, the duchy became the prime strategic prize contested by France, Habsburg Spain, and Austria."
 oe_lde_ctry_FLO_1444: "From Cosimo de' Medici's rise in 1434, Florence blossomed into the radiant heart of the European Renaissance, uniting international banking houses with unmatched achievements in humanism, painting, and architecture.\n\nElevated to the Grand Duchy of Tuscany under the Medici and later the Habsburg-Lorraine dynasty, the state developed the free port of Livorno and pioneered Enlightenment legal reforms across northern Italy."
 oe_lde_ctry_PAP_1444: "Restored to Rome after the Western Schism, the Renaissance and Baroque Papal States spanned central Italy while directing the rebuilding of Saint Peter's Basilica and the global Counter-Reformation.\n\nThrough the eighteenth and nineteenth centuries, restored at the Congress of Vienna after Napoleonic occupation, the Papacy navigated Enlightenment challenges, conservative diplomacy, and emerging Italian nationalism."
 oe_lde_ctry_NAP_1444: "Captured by Alfonso V of Aragon in 1442, the Kingdom of Naples flourished as a Renaissance court before serving for two centuries as the strategic southern Italian anchor of Habsburg Spain.\n\nGuarding the central Mediterranean from its great bay beneath Vesuvius, Naples and Sicily linked Iberian naval power with Italian grain, silk, and maritime defense."
 oe_lde_ctry_NAP_1776: "Established as an independent Bourbon realm in 1734 and formally united in 1816 as the Kingdom of the Two Sicilies, Naples and Sicily stood as the most populous state in Italy, celebrated for royal palaces, opera, and the excavation of Pompeii.\n\nFollowing Napoleonic upheaval and the Carbonari constitutional revolt of 1820, the Bourbon monarchy leaned on Austrian conservative support while confronting simmering liberal and nationalist pressures."
 oe_lde_ctry_SAV_1444: "Long famed as the gatekeepers of the Alps, the House of Savoy shifted its capital to Turin in the sixteenth century and mastered balance-of-power diplomacy between France and the Habsburgs, winning the royal crown of Sardinia-Piedmont in 1720.\n\nEnlarged with Genoa at the 1815 Congress of Vienna, Turin commanded a disciplined army and Mediterranean port poised to anchor Italy's future unification."
 oe_lde_ctry_BAV_1444: "Ruled by the House of Wittelsbach across the upper Danube and Alpine foothills, Bavaria stood as the premier Catholic principality of southern Germany. Winning electoral dignity in the Thirty Years' War, Munich blossomed into a center of Baroque statecraft and art.\n\nElevated to a kingdom in 1806 with an early constitutional charter, Bavaria championed a Third Germany balancing Habsburg Austria and Hohenzollern Prussia."
 oe_lde_ctry_SAX_1444: "Elevated to an electorate under the House of Wettin in 1423, Saxony combined Ore Mountain silver mines, the Leipzig trade fairs, and a pivotal role as the cradle of the Protestant Reformation.\n\nAfter the Baroque splendor of Dresden and Meissen porcelain under Augustus the Strong—and heavy territorial losses to Prussia in 1815—the Kingdom of Saxony remained one of Germany's most industrious and cultured states."
 oe_lde_ctry_HAN_1648: "Consolidated by the Welf Dukes of Brunswick-Luneburg and raised to an electorate in 1692, Hanover entered a personal union with Great Britain in 1714 when Elector George Louis ascended the British throne.\n\nHome to the enlightened University of Gottingen and elevated to a kingdom in 1814, Hanover served as Britain's vital foothold in northern German politics."
 oe_lde_ctry_BRA_1444: "Granted to the House of Hohenzollern in 1415, the Electorate of Brandenburg curbed rebellious estates and tightened fiscal discipline across the sandy marches between the Elbe and the Oder.\n\nBy the early seventeenth century, dynastic inheritances in Cleves and Ducal Prussia linked Brandenburg across northern Germany, laying the territorial frame of a future great power."
 oe_lde_ctry_BRA_1648: "Emerging from the devastation of the Thirty Years' War, the Great Elector Frederick William forged Brandenburg-Prussia into a disciplined military state—building a standing army, modernizing excise revenues, welcoming Huguenot artisans, and securing full sovereignty in Ducal Prussia.\n\nVictory over Sweden at Fehrbellin in 1675 signaled Berlin's rapid rise toward royal status and northern German leadership."
 oe_lde_ctry_BOH_1444: "Forged through the Hussite Wars, the Kingdom of Bohemia boasted rich silver mines, prosperous towns, proud estates, and Charles University in Prague.\n\nBalancing Catholic and Utraquist confessions under George of Podebrady and the Jagiellonians before entering the Habsburg orbit in 1526, Bohemia remained the foremost secular electorate of the Holy Roman Empire."
 oe_lde_ctry_HUN_1444: "Guarding the Carpathian Basin and middle Danube, fifteenth-century Hungary served as Christendom's chief bulwark against Ottoman advance. Janos Hunyadi broke Mehmed II before Belgrade, while his son Matthias Corvinus fielded the standing Black Army and made Buda a shining northern center of Renaissance culture.\n\nYet magnate resistance and mounting Ottoman strength soon placed the Danubian kingdom before an existential struggle for Central Europe."
 oe_lde_ctry_SWI_1444: "Bound together by Alpine cantons and free cities, the Swiss Confederacy humbled Habsburg and Burgundian armies with disciplined pike squares before winning formal independence from the Empire in 1648.\n\nReconstituted after the Napoleonic wars with internationally guaranteed permanent neutrality in 1815, Switzerland guarded the central Alpine passes while cultivating federal self-rule, precision craft, and banking."
 oe_lde_ctry_DLH_1444: "Reeling from Timur's 1398 sack, the fifteenth-century Delhi Sultanate no longer spanned all India, yet under the Sayyid and Afghan Lodi dynasties it still commanded the strategic Doab, Punjab, and Delhi heartland.\n\nReabsorbing Jaunpur and sparring with Rajput Mewar, the Lodi sultans held northern India's premier throne until Babur's field artillery arrived at Panipat in 1526."
 oe_lde_ctry_VIJ_1444: "From its monumental capital on the Tungabhadra at Hampi, the Vijayanagara Empire governed southern India and both rich maritime coasts, reaching a golden age of temple architecture, Telugu and Sanskrit letters, and irrigation works under Krishnadevaraya.\n\nImporting Arabian warhorses through western ports to match the northern Deccan sultanates, Vijayanagara stood for two centuries as the bastion of southern Indian statecraft."
 oe_lde_ctry_BAH_1444: "Breaking free from Delhi in 1347, the Bahmani Sultanate ruled the central Deccan from Gulbarga and Bidar, blending Persian courtly arts, early Urdu literature, and Indian Ocean trade.\n\nLocked in fierce wars with Vijayanagara over the Raichur Doab while torn internally between Deccani and Westerner court factions, the realm gradually gave way to the five successor Deccan sultanates."
 oe_lde_ctry_MYS_1648: "Rising on the Karnataka plateau after Vijayanagara's decline under the Wodeyar dynasty, the Kingdom of Mysore surged in the late eighteenth century under Hyder Ali and Tipu Sultan—the Tiger of Mysore—who built European-drilled regiments, state workshops, and pioneering iron-cased war rockets.\n\nAfter four hard-fought Anglo-Mysore Wars ended at Seringapatam in 1799, a restored Wodeyar court preserved Mysore as one of southern India's best-administered princely states."
 oe_lde_ctry_HYD_1648: "Famed across the world for the diamonds of Golconda and vibrant Indo-Persian court culture, the eastern Deccan passed in 1724 under Asaf Jah I, founder of the Nizams of Hyderabad.\n\nNavigating between Maratha horsemen, Mysore, and competing French and British companies, Hyderabad endured into the nineteenth century as the wealthiest and most prominent princely state of the Deccan."
 oe_lde_ctry_BNG_1444: "Watered by the Ganges and Brahmaputra delta, Bengal flourished from the fourteenth to sixteenth centuries as an independent sultanate renowned for fine muslins, raw silk, river fleets, and cosmopolitan ports.\n\nEven after incorporation into the Mughal Empire and later autonomous rule under the Nawabs of Murshidabad, Bengal remained India's richest treasury until European company intervention transformed the province."
 oe_lde_ctry_EIC_1776: "Following the 1757 Battle of Plassey and the 1765 grant of Bengal revenue rights, the British East India Company's Bengal Presidency at Calcutta transformed a chartered merchant house into a vast territorial power.\n\nBacked by delta taxation, European-drilled sepoy armies, and maritime supply lines, Calcutta steadily overcame Mysore and the Maratha Confederacy to establish paramountcy across India."
 oe_lde_ctry_PUN_1776: "Amid the eighteenth-century contests between Mughals and Afghans, the Sikh warrior communities of Punjab organized into twelve confederated Misls centered on Amritsar to claim the Five Rivers.\n\nIn 1799 Ranjit Singh—the Lion of Punjab—seized Lahore and forged the Sikh Empire, hiring European officers to modernize his Khalsa army and securing Kashmir and Peshawar as India's last great independent kingdom."
 oe_lde_ctry_GUJ_1444: "Founded in 1407 with its capital at Ahmedabad, the Gujarat Sultanate commanded the premier Arabian Sea ports of Cambay and Surat, exporting fine cottons, indigo, and craftsmanship from East Africa to Malacca.\n\nIn the early sixteenth century Gujarat even joined Mamluk and Ottoman naval expeditions against Portuguese fleets before Emperor Akbar annexed the prosperous realm in 1573."
 oe_lde_ctry_MEW_1444: "Across the desert margins and rocky ridges of Rajputana, the Rajput kingdoms of Mewar and Marwar upheld fierce martial codes from monumental hill forts like Chittor and Jodhpur. Leaders such as Rana Kumbha, Rana Sanga, and Maharana Pratap contested hegemony with Delhi, Gujarat, and the Mughals.\n\nWhether serving as elite allies of the Mughal throne or defending ancestral autonomy, the Rajput princes remained a pillar of northern Indian politics."
 oe_lde_ctry_AYU_1444: "Founded in 1351 on a river-ringed island in the Chao Phraya plain, the Kingdom of Ayutthaya rose on abundant rice harvests and cosmopolitan maritime trade linking China, Japan, India, and Europe.\n\nCombining Khmer royal statecraft with Theravada Buddhism, monarchs such as Naresuan and Narai defended the kingdom against Burmese invasions while dispatching embassies as far as Versailles and Beijing."
 oe_lde_ctry_SIA_1776: "Rising from the 1767 sack of Ayutthaya under King Taksin at Thonburi and consolidated in 1782 when Rama I founded the Chakri Dynasty at Bangkok, Rattanakosin Siam rebuilt royal law, temples, and Chinese junk commerce.\n\nSecuring influence across Cambodia, Laos, and the Malay frontier, early Bangkok monarchs prepared Siam to navigate the approaching pressure of European colonial empires."
 oe_lde_ctry_DAI_1444: "Founded in 1428 by Le Loi at Thang Long (Hanoi), the Later Le Dynasty guided Dai Viet into a golden age of Confucian examinations, the Hong Duc legal code, and southward expansion into Champa.\n\nEven during the seventeenth- and eighteenth-century division between the northern Trinh lords and southern Nguyen lords, Vietnamese settlement pushed steadily into the Mekong Delta until the Tay Son upheaval reshaped the realm."
 oe_lde_ctry_DAI_1821: "In 1802 Gia Long defeated the Tay Son regime and united the Red River Delta, central Hue, and the Mekong Delta for the first time under the Nguyen Dynasty, naming the realm Viet Nam.\n\nUnder Emperor Minh Mang, the court at Hue enforced Neo-Confucian centralization and competed with Siam over Cambodia while guarding warily against growing French and British maritime reach."
 oe_lde_ctry_TNG_1444: "In the sixteenth century the Taungoo Dynasty under Tabinshwehti and Bayinnaung forged the largest empire in Southeast Asian history, stretching across Burma, the Shan states, Lan Na, and Ayutthaya.\n\nRestored in the seventeenth century with its capital moved inland to Ava, the Nyaungyan kings consolidated royal administration along the Irrawaddy until mid-eighteenth-century Mon revolts toppled the house."
 oe_lde_ctry_KONBAUNG_1776: "Founded in 1752 by Alaungpaya, the martial Konbaung Dynasty rapidly reunified Burma, sacked Ayutthaya in 1767, repelled Qing border expeditions, and expanded westward into Arakan, Manipur, and Assam.\n\nYet that very westward surge brought the court at Ava and Amarapura into direct collision with British East India Company ambitions along the Bengal frontier."
 oe_lde_ctry_MAJ_1444: "Though past the high noon of Hayam Wuruk and Gajah Mada, fifteenth-century Majapahit still projected Hindu-Javanese court prestige and rice-and-spice commerce across the archipelago from Trowulan.\n\nRising Muslim coastal port cities along northern Java and the thriving entrepot of Malacca increasingly challenged the aging thalassocracy's hold over Nusantara."
 oe_lde_ctry_MTM_1648: "Centered on the fertile volcanic plains of central Java, the Sultanate of Mataram reached its apex under Sultan Agung, unifying most of the island and twice besieging Dutch Batavia.\n\nEven after eighteenth-century succession wars divided the realm into the royal courts of Yogyakarta and Surakarta, Mataram's Javanese court traditions endured at the heart of the archipelago."
 oe_lde_ctry_ATJ_1444: "Guarding the vital Strait of Malacca, fifteenth-century Malacca and sixteenth- to nineteenth-century Aceh successively anchored Malay-Muslim maritime commerce. Under Sultan Iskandar Muda, Aceh fielded giant war galleys, Ottoman-trained gunners, and prized Sumatran pepper fleets, earning renown as the Verandah of Mecca.\n\nThrough centuries of Portuguese, Dutch, and British maritime rivalry, the strait sultanates fiercely defended Southeast Asia's western gateway."
 oe_lde_ctry_KHM_1444: "Relocating south from Angkor after 1431 to Phnom Penh and Longvek along the Mekong confluence, post-Angkor Cambodia evolved into a lively maritime-riverine kingdom trading with Ming China, Japan, and Europe.\n\nFrom the seventeenth century onward, however, caught between expanding Siam and southern Viet Nam, the Khmer monarchy struggled persistently to preserve its independence and ancient heritage."
 oe_lde_ctry_BEI_1648: "On the northern coast of Borneo, the Sultanate of Brunei reached a maritime golden age under Sultan Bolkiah, extending trade and suzerainty across Sulu and Manila Bay on exports of camphor and spice.\n\nThough reduced after Spanish clashes and civil war in the seventeenth century, Brunei preserved centuries of sovereign sultanate rule along the South China Sea."
 oe_lde_ctry_NSP_1648: "Built atop the former Aztec capital of Tenochtitlan, the Viceroyalty of New Spain governed Mexico, Central America, the northern borderlands, and trans-Pacific ties to the Philippines.\n\nVast silver lodes from Zacatecas and Guanajuato flowed outward via Veracruz Atlantic treasure fleets and the Acapulco-Manila galleons, powering the first truly global silver trading network."
 oe_lde_ctry_PERU_1648: "Established over the former Inca heartland with its viceregal seat at Lima, Peru commanded the legendary silver wealth of the Andes and stood for centuries as the royalist bastion of Spanish South America.\n\nBy 1821, as the liberating armies of San Martin and Bolivar converged on the coast and highlands, Peru stood at the decisive transition from viceroyalty to independent republic."
 oe_lde_ctry_COL_1776: "Anchoring the northern Andes and the Caribbean fortress of Cartagena, the Viceroyalty of New Granada guarded the Isthmus of Panama and rich gold and emerald provinces.\n\nFollowing the 1819 victory at Boyaca, Simon Bolivar united New Granada, Venezuela, and Quito into Gran Colombia, embodying the grand vision of a federated independent Spanish America."
 oe_lde_ctry_BRZ_1648: "Powered first by northeastern sugar plantations and then by the eighteenth-century Minas Gerais gold boom, Brazil became the indispensable economic core of the Portuguese Atlantic world as bandeirante expeditions pushed its borders deep inland.\n\nWhen the royal court fled Napoleon to Rio de Janeiro in 1808 and raised Brazil to a co-equal kingdom, the stage was set for Prince Regent Pedro to lead the vast realm toward imperial independence."
 oe_lde_ctry_LAP_1776: "Created in 1776 as the Viceroyalty of the Rio de la Plata, Buenos Aires swiftly grew into a major South Atlantic port for highland silver and Pampas hides.\n\nAfter the May Revolution of 1810 and formal independence in 1816, the United Provinces dispatched liberation armies across the Andes while wrestling internally between Buenos Aires unitarians and provincial federalists."
 oe_lde_ctry_INC_1444: "After Pachacuti routed the Chankas in 1438 and transformed Cusco, Tawantinsuyu—the Four United Quarters of the Inca Empire—swept across the Andes, linking millions of subjects through stone highway networks, storehouses, terrace farming, and quipu record-keeping.\n\nStanding as the largest indigenous empire in the Americas, the Sun's realm reached its dazzling highland zenith before the arrival of Spanish conquistadors."
 oe_lde_ctry_AZT_1444: "Forged in 1428 by the Triple Alliance of Tenochtitlan, Texcoco, and Tlacopan, the Mexica (Aztec) Empire dominated Mesoamerica through productive chinampa lake agriculture, elite warrior orders, and far-reaching tribute networks.\n\nAt its peak under Moctezuma I and II, island Tenochtitlan rivaled Europe's largest capitals in scale, even as resentful tributary states awaited any chance to challenge its supremacy."
 oe_lde_ctry_CAN_1776: "Shaped by the 1763 transfer of New France and the influx of Loyalist refugees during the American Revolution, British North America balanced French-speaking Lower Canada and English-speaking Upper Canada along the St. Lawrence.\n\nHaving weathered the War of 1812 intact, the northern provinces expanded timber, fur, and grain exports while laying the political groundwork for future Canadian confederation."
 oe_lde_ctry_ETH_1444: "Enthroned atop the Abyssinian highlands, Solomonic Ethiopia stood from Zara Yaqob's fifteenth-century renaissance through Fasilides's seventeenth-century stone castles at Gondar as the enduring Christian empire of the Horn of Africa.\n\nSurviving sixteenth-century Adal invasions and the decentralized Era of the Princes, highland Ethiopia kept its ancient church, royal chronicle tradition, and independence alive."
 oe_lde_ctry_MAL_1444: "Though past the unrivaled grandeur of Mansa Musa, fifteenth-century Mali still commanded the goldfields of Bambuk and Bure along the upper Niger from its capital at Niani.\n\nConfronted by Songhai's surge around Timbuktu, Tuareg raids from the Sahara, and Portuguese caravels reaching the Atlantic coast, the Mandinka empire strove to defend its venerable trade networks."
 oe_lde_ctry_SON_1444: "Under Sonni Ali and Askia Muhammad the Great, the Songhai Empire expanded outward from Gao to encompass Djenne and Timbuktu, forging the largest state in West African history.\n\nIts Sankore scholars and trans-Saharan gold and salt caravans made the Niger bend a beacon of Islamic learning and prosperity until a Moroccan musket expedition crossed the desert in 1591."
 oe_lde_ctry_MOR_1444: "Straddling the Atlas Mountains and the Strait of Gibraltar, Morocco under the Marinid, Saadian, and Alaouite dynasties remained the sole Maghrebi kingdom to stay independent of Ottoman rule. Victory over Portugal at Alcacer Quibir in 1578 and trans-Saharan ventures raised Saadian prestige to new heights.\n\nFrom the late seventeenth century, Alaouite sultans such as Moulay Ismail consolidated royal power across Fez, Meknes, and Marrakesh, guarding Europe's southwestern gateway."
 oe_lde_ctry_MAM_1444: "Ruling Egypt, Syria, the Levant, and the holy cities of Mecca and Medina from Cairo, the Burji Mamluk Sultanate drew immense wealth from Red Sea spice customs flowing toward Venice and Europe.\n\nYet even as Mamluk architecture and scholarship shone in Cairo, Portuguese sea routes around Africa and the rising gunpowder armies of the Ottomans closed in on the proud cavalry empire."
 oe_lde_ctry_OMA_1648: "After the Yaruba dynasty expelled the Portuguese from Muscat in 1650, Oman surged into an Indian Ocean maritime empire spanning Arabia and the Swahili coast—capturing Mombasa and Zanzibar and reviving regional dhow commerce.\n\nIn the early nineteenth century under Sayyid Said bin Sultan of the Al Said dynasty, clove plantations and thriving entrepots turned Muscat and Zanzibar into the premier commercial twin capitals of the western Indian Ocean."
 oe_lde_ctry_SKO_1821: "Founded through Usman dan Fodio's 1804 reform movement across the Hausa city-states and organized by his son Muhammad Bello from Sokoto and Gwandu, the Sokoto Caliphate federated more than thirty emirates across the central Sudan.\n\nAnchored by Kano's renowned textile workshops, thriving trade routes, and vibrant Islamic scholarship, Sokoto stood in 1821 as the most populous indigenous power in sub-Saharan Africa."
 oe_lde_ctry_ZAN_1444: "Perched along the Swahili coast, the Sultanate of Kilwa controlled the Sofala gold outlets and monsoon shipping lanes linking East Africa to Arabia, India, and China, famed for its coral-stone palaces, mosques, and royal coinage.\n\nWhen Portuguese fleets rounded the Cape at the close of the fifteenth century, Kilwa and its sister Swahili ports entered a long struggle over the Indian Ocean gold and ivory routes."
 oe_lde_ctry_KON_1444: "Rooted south of the lower Congo River at Mbanza Kongo, the Kingdom of Kongo presided over refined raffia-cloth, copper, and shell-currency trade. Under King Afonso I in the early sixteenth century, the Christianized court exchanged envoys directly with Lisbon and Rome.\n\nDespite civil strife and the pressures of Atlantic commerce in later centuries, Kongo retained deep political and cultural prestige across West Central Africa."
 oe_lde_ctry_TUN_1648: "Brought into the Ottoman Mediterranean sphere in the sixteenth century, Algiers and Tunis evolved under autonomous deys and Husainid beys into formidable Maghrebi maritime regencies.\n\nBalancing naval privateering, Mediterranean trade treaties, and formal ties to Istanbul, both ports confronted mounting pressure from European battle fleets by the turn of the nineteenth century."
 oe_lde_ctry_ENG_1204: "The year 1204 marked the decisive crisis of the Plantagenet Angevin Empire. King John held England and Ireland while battling Philip II of France to save Normandy, Anjou, and Aquitaine.\n\nThe loss of Normandy and heavy war taxes drove the English crown back onto its island realm and set the stage for Magna Carta in 1215 and the rise of parliamentary liberties."
 oe_lde_ctry_ENG_1444: "In 1444, as the Hundred Years' War neared its close under Henry VI, England struggled to hold Normandy, Calais, and Gascony against revitalized French armies before factional strife erupted into the Wars of the Roses.\n\nRebuilt after 1485 by the Tudors through administrative centralization, the English Reformation, and naval expansion, the realm emerged under Elizabeth I as a rising Atlantic maritime power."
 oe_lde_ctry_FRA_1204: "In 1204 King Philip II Augustus propelled Capetian France to a historic breakthrough, seizing Normandy and the Loire valleys from King John and multiplying the royal domain overnight.\n\nAs Gothic cathedrals and the University of Paris set the cultural pace of Latin Christendom, France rose under Philip and Saint Louis IX into the preeminent monarchy of medieval Europe."
 oe_lde_ctry_FRA_1444: "Revived by Joan of Arc and Charles VII's standing companies and royal artillery, Valois France in 1444 stood poised to reclaim Normandy and Gascony and bring the Hundred Years' War to a triumphant close.\n\nLouis XI then subdued great feudal rivals and Francis I embraced Renaissance splendor, establishing France as western Europe's premier kingdom even before the Wars of Religion tested its unity."
 oe_lde_ctry_CAS_1444: "Mid-fifteenth-century Iberia stood on the threshold of union: Castile commanded the broad Meseta plains, wool wealth, and Reconquista frontier spirit, while the Crown of Aragon presided over a western Mediterranean realm spanning Catalonia, Sicily, and Naples.\n\nJoined by the 1469 marriage of Isabella and Ferdinand, the Catholic Monarchs completed the conquest of Granada and sponsored Columbus in 1492, launching Spain's global empire."
 oe_lde_ctry_POR_1444: "On Europe's Atlantic edge, Avis Portugal pioneered the Age of Discovery under Prince Henry the Navigator and King Joao II, pairing caravel shipcraft with West African trade posts to unlock the Cape route.\n\nFollowing Vasco da Gama's 1498 voyage to India and Cabral's 1500 landing in Brazil, Lisbon forged history's first global maritime network from Goa and Malacca to Macau and Brazil."
 oe_lde_ctry_POR_1648: "Restoring independence from Habsburg Spain in 1640 under the House of Braganza, Portugal rebuilt its fortunes on Brazilian sugar and gold, while the Marquis of Pombal modernized Lisbon and state administration after the 1755 earthquake.\n\nFollowing the Napoleonic Wars and the royal court's return from Rio de Janeiro, early nineteenth-century Portugal wrestled with liberal constitutionalism and Brazil's impending separation."
 oe_lde_ctry_NED_1648: "Emerging from the Eighty Years' War with formal Spanish recognition in 1648, the Dutch Republic stood at the peak of its Golden Age. The Amsterdam exchange, the VOC, and its unrivaled fluyt merchant fleet dominated global finance, Baltic grain, and Asian spices.\n\nRadiant in art, science, and religious tolerance, the United Provinces defended its commercial empire through naval prowess and coalition diplomacy against England and France."
 oe_lde_ctry_NED_1821: "Created at the 1815 Congress of Vienna under King William I of Orange-Nassau, the United Kingdom of the Netherlands united the northern provinces with the former Austrian Netherlands while reclaiming the rich Dutch East Indies.\n\nPairing Dutch shipping and finance with burgeoning Belgian coal and textile industry, the new kingdom prospered economically even as religious, linguistic, and constitutional tensions grew between north and south."
 oe_lde_ctry_SWE_1648: "Forged by Gustavus Adolphus's military innovations and the triumphs of the Thirty Years' War, seventeenth-century Sweden commanded Pomerania, Livonia, and Finland in its Stormaktstiden era as master of the Baltic.\n\nBacked by copper and iron exports and disciplined conscript regiments, Stockholm projected dazzling military power until the Great Northern War pitted it against Russia, Denmark, and Poland."
 oe_lde_ctry_SWE_1776: "Following the Great Northern War, Sweden entered the parliamentary Age of Liberty and a golden age of natural science before King Gustav III restored royal initiative and patronized arts and letters.\n\nAfter losing Finland in 1809, Marshal Bernadotte ascended as Charles XIV John and forged the 1814 union with Norway, steering Scandinavia toward enduring neutrality and stability."
 oe_lde_ctry_DAN_1444: "Controlling the strategic Sound linking the North and Baltic Seas from Copenhagen since the 1397 Kalmar Union, the Danish crown governed Denmark-Norway, Iceland, and Schleswig-Holstein for centuries.\n\nEven after the Napoleonic Wars stripped away its fleet and Norway in 1814, Denmark preserved vital Sound tolls, agrarian reforms, and maritime commerce at Scandinavia's southern crossroads."
 oe_lde_ctry_POL_1444: "Joined since 1386 under the Jagiellonian dynasty and victorious over the Teutonic Order at Grunwald in 1410, Poland and Lithuania spanned from the Baltic toward the Black Sea as eastern Europe's foremost partnership.\n\nThriving on Vistula grain exports and academic renown in Krakow, the two realms navigated the Varna Crusade and Baltic wars on the road toward the formal 1569 Union of Lublin."
 oe_lde_ctry_PLC_1648: "Born of the 1569 Union of Lublin, the Polish-Lithuanian Commonwealth stood among Europe's largest realms, celebrated for Winged Hussars, noble parliamentary liberties, religious toleration, and Jan Sobieski's 1683 relief of Vienna.\n\nDevastated by the 1648 Cossack uprising and Swedish Deluge and paralyzed by the liberum veto, the Commonwealth waged a heroic final struggle for reform as Russia, Prussia, and Austria closed in to partition it."
 oe_lde_ctry_POL_1821: "Following the partitions and Napoleon's Duchy of Warsaw, the 1815 Congress of Vienna established the autonomous Kingdom of Poland in personal union with the Russian Tsar, complete with its own constitution, parliament, and army.\n\nEven as Warsaw's economy and letters revived, tightening imperial oversight fueled deep patriotic resentment among Polish officers and intellectuals."
 oe_lde_ctry_MOS_1444: "Emerging from dynastic civil war in the mid-fifteenth century, the Grand Duchy of Moscow surged under Ivan III—annexing Novgorod and Tver, marrying Byzantine princess Sophia Palaiologina, adopting the double-headed eagle, and ending Tatar tribute on the Ugra River in 1480.\n\nWith the gathering of the Rus' lands nearly complete, Moscow stood poised to proclaim the Tsardom of Russia and push down the Volga."
 oe_lde_ctry_LAT_1204: "Following the Fourth Crusade's sack of Constantinople in 1204, Baldwin of Flanders was crowned Latin Emperor in Hagia Sophia over a feudal crusader realm straddling the Bosporus.\n\nCash-strapped and reliant on Venetian sea lanes, the Latin Empire immediately faced fierce attacks from Kaloyan's Bulgaria and rival Byzantine successor courts in Nicaea and Epirus."
 oe_lde_ctry_SCO_1444: "Ruled by the House of Stuart from Edinburgh, the Kingdom of Scotland defended its independence along the northern marches through Highland resilience, Lowland burghs, and the centuries-old Auld Alliance with France.\n\nTransformed by the Scottish Reformation, the realm entered a personal union with England under James VI in 1603 before the 1707 Acts of Union forged Great Britain."
 oe_lde_ctry_BUR_1444: "Under Philip the Good in the mid-fifteenth century, the Valois Duchy of Burgundy combined its French homeland with the wealthy cloth towns of Flanders, Brabant, and Holland into Europe's most opulent court.\n\nFamed for the Order of the Golden Fleece and Flemish painting, Burgundy strove under Charles the Bold to forge a royal middle kingdom between France and the Empire."
 oe_lde_ctry_TEU_1444: "Shaken by defeat at Grunwald in 1410, the Teutonic Order still commanded formidable brick castles at Marienburg and prosperous Baltic trading ports across Prussia.\n\nFacing unrest from the Prussian Confederation and relentless Polish pressure, the knightly state withdrew to Konigsberg after the Thirteen Years' War until Grand Master Albert secularized it into Ducal Prussia in 1525."
 oe_lde_ctry_AFG_1776: "Founded in 1747 at Kandahar by Ahmad Shah Durrani after Nader Shah's death, the Durrani Empire swept from Khorasan and Kabul across the Indus into Punjab and Kashmir, shattering the Maratha army at Panipat in 1761.\n\nThough dynastic strife and the rise of Ranjit Singh's Sikh Empire trimmed its outer provinces by 1821, Kabul remained the fiercely guarded mountain crossroads between Persia, Central Asia, and India."
 oe_lde_ctry_FB_LATE_ANTIQUITY: "This realm stands amid the sweeping transformations of Late Antiquity and the early Middle Ages, where old imperial frontiers, caravan cities, and rising tribal confederations reshaped the political map.\n\nDrawing on fortified towns, local elites, and regional faith networks, its rulers navigate the shifting dawn of a new era to secure lasting sovereignty."
 oe_lde_ctry_FB_NEW_WORLD_EXILE_SETTLER: "Rooted across the Atlantic in the Americas as a settler commonwealth, overseas colonial domain, or Old-World exile polity, this realm transplants maritime commerce, codified law, and ancestral statecraft onto a vast new continent.\n\nNavigating frontier settlement, oceanic trade competition, and relations with both indigenous neighbors and distant Old-World powers, its councils, garrisons, and townsfolk are forging a new civilization in the Western Hemisphere."
 oe_lde_ctry_FB_COLONIAL_NEW_WORLD: "Rooted across the oceans along colonial frontiers, this overseas dependency is sustained by maritime ports, frontier settlements, plantation or mining commerce, and an emerging civic identity of its own.\n\nBalancing metropolitan ties, oceanic trade competition, and inland expansion, its assemblies and frontier communities chart their own course between loyalty and self-determination."
 oe_lde_ctry_FB_STEPPE_KHANATE: "This steppe khanate or Central Asian tribal confederation ranges across the Eurasian grasslands and Silk Road oasis margins, united by mobile horse archers, noble clan assemblies, seasonal pastures, and caravan customs.\n\nNavigating diplomacy and rivalry with neighboring empires and fellow hordes, its leaders balance steppe mobility with oasis trade to defend their pastures and expand their sway."
 oe_lde_ctry_FB_THEOCRACY: "This ecclesiastical principality, bishopric, or religious order unites spiritual mission with temporal governance, drawing cohesion from cathedrals, monastic estates, and clerical discipline.\n\nAmid secular rivalries and confessional upheaval, its leadership relies on moral prestige, disciplined institutions, and careful diplomacy to protect its domains and faithful."
 oe_lde_ctry_FB_REPUBLIC_FREE_CITY: "Governed by civic councils, merchant guilds, and written charters rather than hereditary kings, this republic or free city thrives on maritime ports, banking credit, and skilled craft workshops.\n\nDefending its liberties and trade routes through agile diplomacy and civic defense, the state punches well above its size in commerce, law, and urban culture."
 oe_lde_ctry_FB_EAST_ASIA: "Rooted in East Asia's intensive agriculture, scholarly and Buddhist traditions, and deep local lineages, this realm, domain, or frontier polity maintains order through castle towns, civil administration, or hereditary regional lords.\n\nNavigating shifting imperial orders, maritime trade, and powerful neighbors, its rulers cultivate domestic prosperity while watching for opportunities to expand their standing."
 oe_lde_ctry_FB_SE_ASIA: "Set at the crossroads of monsoon sea lanes and fertile tropical river valleys, this Southeast Asian mandala kingdom or maritime sultanate draws strength from rice surpluses, prized spices, riverine fleets, and cosmopolitan ports.\n\nBalancing regional rivals and arriving oceanic trading powers, its court relies on nimble diplomacy and maritime wealth to preserve local sovereignty."
 oe_lde_ctry_FB_INDIA: "Commanding fertile monsoon plains, storied hill forts, and famed textile workshops across South Asia, this princely realm or regional sultanate blends rich courtly patronage with intricate agrarian revenue networks.\n\nNavigating shifting alliances among Indian rivals and coastal trading companies, its rulers rely on martial nobility and commercial vitality to defend their heritage."
 oe_lde_ctry_FB_ISLAMIC_SULTANATE: "Anchored along caravan crossroads, irrigated oases, or strategic Mediterranean and Indian Ocean harbors, this Islamic sultanate, emirate, or beylik combines legal scholarship, bustling bazaars, and seasoned cavalry traditions.\n\nAmid rivalries among great regional empires and maritime powers, its court balances trade, fortifications, and deft diplomacy to uphold independence."
 oe_lde_ctry_FB_EUROPE_MONARCHY: "Rooted in dynastic law, fortified towns, and noble estates, this European monarchy, duchy, or principality adapts continuously to confessional shifts, balance-of-power diplomacy, and evolving military organization.\n\nOn a crowded continental stage, its rulers blend strategic marriages, fiscal reform, and timely alliances to defend ancestral titles and elevate their house."
 oe_lde_ctry_FB_AMERICAS_INDIGENOUS: "Deeply rooted in the valleys, plains, or highlands of the Americas, this indigenous polity or confederation draws vitality from time-honored agriculture, ceremonial traditions, regional exchange networks, and skilled local warriors.\n\nConfronting neighboring rivals and the sweeping challenges of colonial expansion, its chiefs and councils marshal resilience and alliances to defend ancestral lands and freedom."
 oe_lde_ctry_FB_AFRICA: "Sustained by fertile river basins, highland pastures, or vital trans-Saharan and Indian Ocean trade links, this African kingdom or state unites its people through ancestral kingship, skilled metalwork, and vibrant regional markets.\n\nAs shifting continental and maritime trade routes reshape the region, its leadership guards key corridors and resources to preserve independence and prosperity."
 oe_lde_ctry_FB_OCEANIA_SIBERIA: "Spanning the northern forests and rivers of Siberia or the island archipelagos of the Pacific, this frontier polity or seafaring community thrives through mastery of hunting, fishing, navigation, and tight-knit clan customs.\n\nAs distant fur traders, whalers, and imperial expeditions reach its horizons, the realm draws on deep local resilience to confront a changing world."
 oe_lde_ctry_FB_TRIBAL: "Bound together by kinship clans, elder councils, and fierce warrior traditions, this tribal confederation guards its freedom across rugged mountains, deserts, or frontier woods beyond easy imperial reach.\n\nWhether profiting from caravan escort and border raids or uniting under a charismatic leader into a centralized state, its clans fiercely defend their autonomy."
 oe_lde_ctry_FB_UNIVERSAL: "This sovereign realm or autonomous polity stands in its historical era upon distinctive institutions, local elites, and commercial lifelines. Whatever its scale, its leadership must weigh fiscal stability, military readiness, and shrewd diplomacy.\n\nAs the tides of history turn, the state stands at the crossroads of preserving ancestral foundations and seizing new opportunities to shape its destiny."
