l_english:
 STATIC_MODIFIER_NAME_oe_s37_galata: "The Genoese of Galata"
 STATIC_MODIFIER_DESC_oe_s37_galata: "In 1267 Michael VIII gave Galata, across the Golden Horn, to the Genoese. Most ships passing the straits pay their dues there, and the empire's customs fall far behind theirs. The customs dispute around 1348, or the reform Expel the Foreigners, can end this."
 STATIC_MODIFIER_NAME_oe_s37_frugality: "The Thrift of Andronikos III"
 STATIC_MODIFIER_DESC_oe_s37_frugality: "In these years of Andronikos III's reign the empire won back Chios (1329) and Lesbos (1336), the court kept its spending in check, and the treasury could still get by. The margin will not last: #G +15#! gold a month for #Y 24#! months after the start, ending on #Y 1 April 1339#!."
