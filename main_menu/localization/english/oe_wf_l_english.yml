l_english:
 STATIC_MODIFIER_NAME_oe_wf_era_wenzhi_mod:0 "Civil Governance Era (Jingming / Hongzhi Ideal)"
 STATIC_MODIFIER_DESC_oe_wf_era_wenzhi_mod:0 "The court elevates letters, cabinet deliberation, and civil statutes across the empire, strengthening administration and scholarship at the cost of higher military upkeep."
 STATIC_MODIFIER_NAME_oe_wf_era_wugong_mod:0 "Martial Prowess Era (Yongle / Hongwu Ideal)"
 STATIC_MODIFIER_DESC_oe_wf_era_wugong_mod:0 "Imperial banners rally frontier garrisons and military colonies under a vigorous martial reign-title, lifting army morale, manpower, and prestige while straining court outlays and peasant burdens."
 STATIC_MODIFIER_NAME_oe_wf_era_shoucheng_mod:0 "Consolidation Era (Ren-Xuan Recuperation Ideal)"
 STATIC_MODIFIER_DESC_oe_wf_era_shoucheng_mod:0 "A reign dedicated to light corvee, fiscal order, and provincial recuperation deepens treasury revenues, control, and stability while dampening military mobilization."
 STATIC_MODIFIER_NAME_oe_wf_era_zhongxing_mod:0 "Dynastic Renewal Era (Early Wanli / Longqing Ideal)"
 STATIC_MODIFIER_DESC_oe_wf_era_zhongxing_mod:0 "Proclaiming a reformist reign-title during turbulent years focuses the cabinet on restoring central control, stability, and Celestial Authority against sharp resistance from entrenched elites."
 STATIC_MODIFIER_NAME_oe_wf_era_haiyu_mod:0 "Maritime Concord Era (Longqing Opening Ideal)"
 STATIC_MODIFIER_DESC_oe_wf_era_haiyu_mod:0 "Licensed coastal ports and open diplomatic reception carry imperial prestige across the four seas, boosting maritime trade and diplomacy while displeasing conservative landed gentry."
 STATIC_MODIFIER_NAME_oe_wf_era_jubilee_mod:0 "Decennial Era Jubilee"
 STATIC_MODIFIER_DESC_oe_wf_era_jubilee_mod:0 "Ten unbroken years of peace under one auspicious reign-title crown the throne with dynastic legitimacy and cultural brilliance, sustained by lavish state banquets and archival compilations."
 STATIC_MODIFIER_NAME_oe_wf_era_steadfast_mod:0 "Steadfast Ancestral Reign-Title"
 STATIC_MODIFIER_DESC_oe_wf_era_steadfast_mod:0 "Refusing to alter the reign-title in the teeth of calamity demonstrates unyielding dynastic resolve, fortifying legitimacy and morale even as restless subjects clamor for auspicious change."
 STATIC_MODIFIER_NAME_oe_wf_era_tributary_calendar_mod:0 "Observing the Celestial Calendar"
 STATIC_MODIFIER_DESC_oe_wf_era_tributary_calendar_mod:0 "Adopting the newly proclaimed Celestial reign-title and imperial almanac honors ritual harmony across the tributary world, bolstering diplomatic standing and court legitimacy at modest ceremonial cost."
 STATIC_MODIFIER_NAME_oe_wf_cycle_stage_1_mod:0 "Mandate Cycle: Founding Vigor (Stage I)"
 STATIC_MODIFIER_DESC_oe_wf_cycle_stage_1_mod:0 "In the opening decades of dynastic rule, lean institutions and fresh victorious legitimacy propel central control and military vigor even as founding rewards strain the court purse."
 STATIC_MODIFIER_NAME_oe_wf_cycle_stage_2_mod:0 "Mandate Cycle: Mature Consolidation (Stage II)"
 STATIC_MODIFIER_DESC_oe_wf_cycle_stage_2_mod:0 "Long peace matures tax registers, letters, and social stability, yet creeping bureaucratic routine and martial complacency begin to dull the cabinet and armies."
 STATIC_MODIFIER_NAME_oe_wf_cycle_stage_3_mod:0 "Mandate Cycle: Late-Dynastic Inertia (Stage III)"
 STATIC_MODIFIER_DESC_oe_wf_cycle_stage_3_mod:0 "Generations of estate tax evasion, factional paralysis, and neglected frontiers erode treasury yields, central control, and governance unless a sweeping renewal restores the dynasty."
 STATIC_MODIFIER_NAME_oe_wf_cycle_audit_mod:0 "Censorate Audience Audits"
 STATIC_MODIFIER_DESC_oe_wf_cycle_audit_mod:0 "Strict attendance rolls and censorate inspections shake ministers out of court lethargy, reviving administration while provoking noble resentment."
 STATIC_MODIFIER_NAME_oe_wf_cycle_cadastre_mod:0 "Imperial Cadastre Resurvey"
 STATIC_MODIFIER_DESC_oe_wf_cycle_cadastre_mod:0 "Measuring concealed aristocratic estates restores equitable tax registers and relieves smallholder peasants at the price of bitter noble opposition."
 STATIC_MODIFIER_NAME_oe_wf_cycle_frontier_pay_mod:0 "Inner-Treasury Frontier Stipends"
 STATIC_MODIFIER_DESC_oe_wf_cycle_frontier_pay_mod:0 "Direct silver disbursements from the Inner Treasury clear garrison arrears and steady border morale while tightening palace finances."
 STATIC_MODIFIER_NAME_oe_wf_cycle_zhongxing_mod:0 "Grand Dynastic Restoration"
 STATIC_MODIFIER_DESC_oe_wf_cycle_zhongxing_mod:0 "Enforcing strict ministerial accountability and unified silver taxation breaks late-dynastic inertia, rejuvenating revenues, cabinet governance, and the Mandate despite intense aristocratic friction."
 STATIC_MODIFIER_NAME_oe_wf_huangen_investiture_mod:0 "Celestial Patent of Investiture"
 STATIC_MODIFIER_DESC_oe_wf_huangen_investiture_mod:0 "Bearing the Son of Heaven's golden seal and patent of investiture silences domestic challengers and elevates diplomatic prestige while binding the court to costly tributary ceremonies."
 STATIC_MODIFIER_NAME_oe_wf_huangen_relief_mod:0 "Celestial Relief & Auxiliary Convoy"
 STATIC_MODIFIER_DESC_oe_wf_huangen_relief_mod:0 "Emergency grain convoys, silver grants, and military instructors dispatched from the Celestial court shore up wartime morale and manpower while encumbering local customs with imperial commissaries."
 STATIC_MODIFIER_NAME_oe_wf_huangen_kanhe_mod:0 "Expanded Kanhe Tally Quota"
 STATIC_MODIFIER_DESC_oe_wf_huangen_kanhe_mod:0 "Additional official Kanhe trade tallies open lucrative access to imperial ports and overland fairs, enriching merchants while unsettling traditional agrarian elites."
 STATIC_MODIFIER_NAME_oe_wf_huangen_sinicize_mod:0 "Imperial Sinicization Academy Charter"
 STATIC_MODIFIER_DESC_oe_wf_huangen_sinicize_mod:0 "Sending royal students to the Imperial Academy and adopting classical law codes accelerates scholarship, literacy, and institutional adoption while eroding native aristocratic traditions."
 STATIC_MODIFIER_NAME_oe_wf_huangen_classics_mod:0 "Imperial Classics & Printing Grant"
 STATIC_MODIFIER_DESC_oe_wf_huangen_classics_mod:0 "Gifted editions of canonical histories, agronomy, and astronomy foster steady scholarly advancement with minimal cultural disruption, funded through court stipends."
 STATIC_MODIFIER_NAME_oe_wf_emperor_grace_mod:0 "Thick Rewards for Thin Tribute"
 STATIC_MODIFIER_DESC_oe_wf_emperor_grace_mod:0 "Lavish imperial gifts, gold seals, and silk bolts cement tributary devotion and Celestial prestige across East Asia at substantial expense to the palace treasury."
 STATIC_MODIFIER_NAME_oe_wf_emperor_kanhe_mod:0 "Tributary Tally Concessions"
 STATIC_MODIFIER_DESC_oe_wf_emperor_kanhe_mod:0 "Granting generous customs exemptions and tally quotas binds maritime tributaries to imperial markets, lifting sea trade and loyalty while trimming domestic customs receipts."
 STATIC_MODIFIER_NAME_oe_wf_exam_balanced_mod:0 "North-South Balanced Examination Quotas"
 STATIC_MODIFIER_DESC_oe_wf_exam_balanced_mod:0 "Apportioning palace examination quotas evenly across northern and southern provinces harmonizes scholar-gentry morale, literacy, and cabinet quality at increased stipend costs."
 STATIC_MODIFIER_NAME_oe_wf_exam_noble_mod:0 "Aristocratic Yin-Privilege Admissions"
 STATIC_MODIFIER_DESC_oe_wf_exam_noble_mod:0 "Reserving palace distinctions for prominent lineages steadies noble loyalty and dynastic prestige while dulling administrative meritocracy and scholarly inquiry."
 STATIC_MODIFIER_NAME_oe_wf_exam_practical_mod:0 "Practical Statecraft & Anti-Fraud Exams"
 STATIC_MODIFIER_DESC_oe_wf_exam_practical_mod:0 "Testing candidates on hydraulics, finance, and border defense while purging examination fraud raises administrative vigor and scholarship at the price of outraged entrenched elites."
 STATIC_MODIFIER_NAME_oe_wf_penitence_mod:0 "Imperial Penitential Edict"
 STATIC_MODIFIER_DESC_oe_wf_penitence_mod:0 "Publicly accepting Heaven's rebuke and remitting harsh exactions calms popular unrest and restores social stability while humbling royal prestige and trimming fiscal extraction."
 STATIC_MODIFIER_NAME_oe_wf_gov_diligent_mod:0 "Diligent Personal Rule"
 STATIC_MODIFIER_DESC_oe_wf_gov_diligent_mod:0 "The sovereign personally reviews every memorial and supervises the ministries, sharpening cabinet efficiency, royal power, and provincial control while exhausting court budgets and irking nobles."
 STATIC_MODIFIER_NAME_oe_wf_gov_hands_off_mod:0 "Hands-Off Cabinet Delegation"
 STATIC_MODIFIER_DESC_oe_wf_gov_hands_off_mod:0 "Entrusting daily administration to the Grand Secretariat calms the estates, saves palace outlays, and lowers stability upkeep at the cost of looser direct royal control."
 oe_wf_cab_changwei_inspect:0 "Changwei Secret Inspection"
 oe_wf_cab_changwei_inspect_desc:0 "Dispatch Eastern Depot and Embroidered Guard inspectors into a province to root out tax fraud and enforce imperial control, at the price of aristocratic, merchant, and court prestige friction."
 oe_wf_cab_changwei_inspect_action:0 "Carry out: Changwei Secret Inspection"
 oe_wf_cab_changwei_inspect_active:0 "Carrying out: Changwei Secret Inspection"
 oe_wf_cab_changwei_inspect_action_progress:0 "Changwei Secret Inspection progress"
 oe_wf_cab_changwei_inspect_action_progress_wordier:0 "Changwei Secret Inspection is under way"
 oe_wf_cab_changwei_inspect_action_progress_long_wordier:0 "Imperial investigators are auditing provincial officials and tax rolls; local control climbs steadily while estates grow wary."
 oe_wf_cab_changwei_inspect_action_progress_tooltip:0 "How far Changwei Secret Inspection has progressed"
 oe_wf_cab_changwei_inspect_select_province:0 "Choose a province for Changwei inspection"
 oe_wf_cab_changwei_inspect_no_provinces:0 "@trigger_no! No controlled province available for inspection"
 oe_wf_cab_diligent_governance:0 "Diligent Secretariat Governance"
 oe_wf_cab_diligent_governance_desc:0 "Assign a senior Grand Secretary to coordinate morning audiences, draft edicts, and supervise the Six Ministries, boosting cabinet efficiency, stability investment, and tax collection at heavier court outlay."
 oe_wf_cab_diligent_governance_action:0 "Carry out: Diligent Secretariat Governance"
 oe_wf_cab_diligent_governance_active:0 "Carrying out: Diligent Secretariat Governance"
 oe_wf_cab_diligent_governance_action_progress:0 "Diligent Secretariat Governance progress"
 oe_wf_cab_diligent_governance_action_progress_wordier:0 "Diligent Secretariat Governance is under way"
 oe_wf_cab_diligent_governance_action_progress_long_wordier:0 "The Grand Secretariat is drafting imperial rescripts and auditing ministry ledgers across the realm."
 oe_wf_cab_diligent_governance_action_progress_tooltip:0 "How far Diligent Secretariat Governance has progressed"
 oe_wf_need_huangen_25_tt:0 "@trigger_no! Requires at least #Y 25#! Royal Favor (accrued through tribute missions and loyal service)"
 oe_wf_need_huangen_30_tt:0 "@trigger_no! Requires at least #Y 30#! Royal Favor to petition for an Imperial Sinicization Charter"
 oe_wf_need_tributary_tt:0 "@trigger_no! Requires at least one loyal subject or Middle Kingdom tributary member"
 oe_wf_dec_proclaim_era_name.title:0 "Proclaim an Imperial Era Name"
 oe_wf_dec_proclaim_era_name.desc:0 "Convene the Ministry of Rites and Hanlin Academy to select an auspicious reign-title ethos for the current sovereign (15-year cooldown, once per reign). Tributaries observing our calendar also receive a mild ceremonial aura. Adapted with formal permission from the Pax Solis (Wanfang Jingming) Mod Team and rebuilt natively for EU5."
 oe_wf_dec_proclaim_era_name.a:0 "Convene the Ministry of Rites to choose an Era Name"
 oe_wf_dec_send_tribute_mission.title:0 "Dispatch a Grand Tribute Embassy"
 oe_wf_dec_send_tribute_mission.desc:0 "Send envoys bearing tribute, warhorses, or ritual homage to the Celestial capital to accumulate #Y Royal Favor#! (5-year cooldown), which can later be spent on investiture patents, emergency aid, Kanhe trade quotas, or Sinicization charters."
 oe_wf_dec_send_tribute_mission.a:0 "Dispatch the tribute mission to the Celestial capital"
 oe_wf_dec_petition_imperial_aid.title:0 "Petition the Celestial Court for Imperial Favor"
 oe_wf_dec_petition_imperial_aid.desc:0 "Expend accumulated #Y Royal Favor#! (minimum 25) to petition the Son of Heaven for a Golden Seal of Investiture, emergency silver and manpower relief, or expanded Kanhe trade tallies (8-year cooldown)."
 oe_wf_dec_petition_imperial_aid.a:0 "Submit our memorial to the Ministry of Rites"
 oe_wf_dec_petition_sinicization_charter.title:0 "Petition for an Imperial Sinicization Charter"
 oe_wf_dec_petition_sinicization_charter.desc:0 "Spend #Y 30#! Royal Favor to petition the Celestial court for admission to the Imperial Academy, canonical law codes, and printing grants—boosting research, literacy, and institutions while gently shifting society toward Sinicization (15-year cooldown)."
 oe_wf_dec_petition_sinicization_charter.a:0 "Petition for the Imperial Academy Charter"
 oe_wf_dec_bestow_royal_favor.title:0 "Bestow Grand Imperial Grace Upon Tributaries"
 oe_wf_dec_bestow_royal_favor.desc:0 "Uphold the classical maxim of generous imperial gifts in return for modest tribute: spend #Y 75#! gold to distribute golden seals, brocade, or Kanhe tallies to loyal tributaries, lifting their Royal Favor, loyalty, and Celestial Authority (10-year cooldown)."
 oe_wf_dec_bestow_royal_favor.a:0 "Dispatch imperial envoys bearing golden seals and gifts"
 oe_wf_dec_special_grace_exam.title:0 "Convene a Special Grace Palace Examination"
 oe_wf_dec_special_grace_exam.desc:0 "Hold an extraordinary imperial palace examination for #Y 60#! gold (12-year cooldown), forcing a three-way court choice among North-South regional balance, aristocratic yin-privilege quotas, or practical statecraft paired with an anti-fraud purge."
 oe_wf_dec_special_grace_exam.a:0 "Open the examination halls at the capital"
 oe_wf_dec_penitential_edict.title:0 "Issue an Imperial Penitential Edict"
 oe_wf_dec_penitential_edict.desc:0 "When stability falters, war exhaustion climbs, or late-dynastic crisis grips the realm, the sovereign may publicly accept Heaven's rebuke—sacrificing prestige and legitimacy to calm popular unrest and restore stability (15-year cooldown)."
 oe_wf_dec_penitential_edict.a:0 "Draft the Penitential Edict for proclamation"
 oe_wf_dec_toggle_governance_style.title:0 "Debate on Diligent Rule vs. Cabinet Delegation"
 oe_wf_dec_toggle_governance_style.desc:0 "Set the governing tempo of the imperial court for the next decade (10-year cooldown): either personally scrutinize memorials to maximize cabinet power and control, or delegate routine affairs to the Grand Secretariat to soothe estates and cut palace spending."
 oe_wf_dec_toggle_governance_style.a:0 "Determine the sovereign's governing style"
 oe_wf.1.t:0 "Proclaiming the Imperial Era Name"
 oe_wf.1.d:0 "Before the Altar of Heaven, scholars of the Hanlin Academy unroll five sets of classical reign-titles drawn from the grand dynastic annals—ranging from Jingming and Hongzhi's civil refinement to Yongle's martial ardor, Ren-Xuan's quiet recuperation, Longqing's open seas, or a bold title of renewal to rescue a faltering age. Which imperial ethos shall define the calendar of this reign?"
 oe_wf.1.a:0 "Civil Governance Era (Jingming / Hongzhi style): exalt letters and the cabinet"
 oe_wf.1.b:0 "Martial Prowess Era (Yongle / Hongwu style): sharpen banners and garrisons"
 oe_wf.1.c:0 "Consolidation Era (Ren-Xuan style): rest the people and mend the fisc"
 oe_wf.1.e:0 "Dynastic Renewal Era (Early Wanli / Longqing style): break stagnation and restore the Mandate"
 oe_wf.1.f:0 "Maritime Concord Era (Longqing Opening style): welcome envoys and oceanic trade"
 oe_wf.2.t:0 "Decennial Jubilee of an Auspicious Era"
 oe_wf.2.d:0 "Ten peaceful years have passed since our current reign-title was proclaimed across the empire. Granaries stand full, tributary envoys arrive on schedule, and senior academicians request permission to celebrate the decennial jubilee by engraving commemorative steles and compiling the Veritable Records of the decade."
 oe_wf.2.a:0 "Celebrate the Grand Jubilee and compile the Imperial Annals"
 oe_wf.2.b:0 "Commemorate the decade by remitting peasant grain levies"
 oe_wf.3.t:0 "Petitions to Change the Reign-Title and Avert Calamity"
 oe_wf.3.d:0 "Following hard seasons of unrest, exhausting warfare, or waning Celestial Authority, astrologers of the Imperial Observatory and senior censors memorialize the throne: ancient precedent holds that proclaiming a fresh, propitious reign-title renews Heaven's favor and calms anxious subjects. Yet staunch traditionalists argue that altering a reign-title mid-reign admits weakness."
 oe_wf.3.a:0 "Proclaim a fresh reign-title to renew auspicious fortune"
 oe_wf.3.b:0 "Keep the ancestral reign-title steadfast through the storm"
 oe_wf.10.t:0 "From Founding Vigor to Mature Consolidation"
 oe_wf.10.d:0 "Sixty years of imperial stewardship have transformed the rough military vigor of the founding generation into settled prosperity. Tax registers are orderly and academies flourish, yet veteran commanders warn that hereditary stipends and court routine are quietly dulling the edge of the armies."
 oe_wf.10.a:0 "Codify the Great Statutes and enjoy civil prosperity"
 oe_wf.10.b:0 "Fund frontier autumn drills to keep martial vigor alive"
 oe_wf.11.t:0 "Late-Dynastic Inertia Grips the Realm"
 oe_wf.11.d:0 "Decades of hidden land registries, factional deadlocks in the ministries, and mounting frontier arrears have eroded the fiscal and administrative sinews of the dynasty. Unless the court gathers the political will for a sweeping Zhang Juzheng-style overhaul, every year will tighten the vise of late-dynastic decline."
 oe_wf.11.a:0 "Acknowledge the rot and build momentum for grand reform"
 oe_wf.11.b:0 "Levy emergency surcharges to patch the treasury"
 oe_wf.12.t:0 "Court Lethargy and Unanswered Memorials"
 oe_wf.12.d:0 "Memorials from provincial governors pile up unopened in the inner palace while factional cliques trade accusations rather than clearing the administrative backlog. The Censorate begs the throne to resume strict morning audiences and enforce deadlines on every ministry."
 oe_wf.12.a:0 "Enforce strict morning audiences and Censorate audits"
 oe_wf.12.b:0 "Leave routine memorials to the Grand Secretariat cliques"
 oe_wf.13.t:0 "Noble and Imperial-Kin Land Annexation"
 oe_wf.13.d:0 "Imperial clansmen and powerful gentry houses have absorbed tens of thousands of acres under tax-exempt privileges, shifting the entire land tax burden onto struggling smallholder villages. Reformist ministers urge an immediate empire-wide cadastre resurvey."
 oe_wf.13.a:0 "Order a nationwide cadastre resurvey to curb annexation"
 oe_wf.13.b:0 "Compromise with the great houses to preserve court harmony"
 oe_wf.14.t:0 "Frontier Garrison Arrears and Restless Banners"
 oe_wf.14.d:0 "Border commanders report months of unpaid silver stipends and rotting grain shipments along the northern and western garrisons. Without direct treasury relief and quartermaster audits, frontier discipline will collapse."
 oe_wf.14.a:0 "Release Inner-Treasury silver and audit the quartermasters"
 oe_wf.14.b:0 "Let frontier commanders requisition grain locally"
 oe_wf.15.t:0 "The Grand Councillor's Renewal Opportunity"
 oe_wf.15.d:0 "Years of painful administrative audits have finally aligned a resolute Grand Councillor with a clear mandate for structural overhaul. By pairing the Performance Statute (Kao Cheng Fa) with unified silver taxation and strict frontier accountability, the dynasty can break free from late-cycle decay and win a true generation of restoration."
 oe_wf.15.a:0 "Empower the Grand Reformer to execute sweeping restoration"
 oe_wf.15.b:0 "Settle for modest treasury economies without upsetting the court"
 oe_wf.16.t:0 "Dynastic Restoration Achieved"
 oe_wf.16.d:0 "The Performance Statute has swept away sinecures, resurveyed tax rolls fill the treasury with silver, and well-paid frontier garrisons stand firm. Across the realm, chroniclers hail a genuine #Y Zhongxing Restoration#!: the dynasty sheds its late-cycle paralysis and returns to a reinvigorated Age of Consolidation!"
 oe_wf.16.a:0 "Inscribe the Zhongxing Restoration in the Imperial Annals"
 oe_wf.16.b:0 "Share the restoration bounty with loyal tributaries"
 oe_wf.20.t:0 "Grand Tribute Embassy to the Celestial Court"
 oe_wf.20.d:0 "Our envoys have arrived at the Celestial capital and await reception by the Ministry of Rites. Presenting fine regional treasures, dispatching auxiliary warhorses and levies, or offering solemn scholarly homage will each win valuable #Y Royal Favor#! from the Son of Heaven."
 oe_wf.20.a:0 "Present fine silk, porcelain, and local treasures (+18 Royal Favor)"
 oe_wf.20.b:0 "Send auxiliary warhorses and border levies (+28 Royal Favor)"
 oe_wf.20.c:0 "Offer solemn ritual homage and classical scrolls (+14 Royal Favor)"
 oe_wf.21.t:0 "Petitioning the Son of Heaven for Imperial Favor"
 oe_wf.21.d:0 "Having faithfully cultivated #Y Royal Favor#! at the Celestial court, our ambassadors now lay a formal memorial before the imperial throne. Shall we request a Golden Seal of Investiture to bolster royal legitimacy, emergency silver and manpower relief to weather war or hardship, or an expanded Kanhe trade quota for our merchants?"
 oe_wf.21.a:0 "Petition for a Golden Seal of Investiture (Costs 25 Royal Favor)"
 oe_wf.21.b:0 "Petition for Celestial Relief silver and manpower (Costs 35 Royal Favor)"
 oe_wf.21.c:0 "Petition for expanded Kanhe tally-trade quotas (Costs 30 Royal Favor)"
 oe_wf.21.e:0 "Withdraw the memorial and save our Royal Favor for later"
 oe_wf.22.t:0 "The Imperial Patent of Investiture Arrives"
 oe_wf.22.d:0 "Imperial heralds have reached our capital bearing an edict sealed in vermilion and a gilded seal of investiture recognizing our sovereign's rightful title. Nobles and neighboring courts alike take note of the Son of Heaven's explicit endorsement."
 oe_wf.22.a:0 "Receive the Golden Seal with solemn court rites"
 oe_wf.23.t:0 "Arrival of the Celestial Relief Convoy"
 oe_wf.23.d:0 "Answering our urgent memorial, imperial commissaries have arrived with chests of relief silver, reserve arms, and veteran drill instructors to reinforce our depleted ranks."
 oe_wf.23.a:0 "Distribute the imperial relief silver and muster the reinforcements"
 oe_wf.24.t:0 "Expanded Kanhe Trade Tallies Granted"
 oe_wf.24.d:0 "The Ministry of Rites has approved our petition and issued fresh numbered Kanhe tallies granting our merchant vessels and overland caravans wider access to the prosperous markets of the Middle Kingdom."
 oe_wf.24.a:0 "Issue the new Kanhe tallies to our merchant guilds"
 oe_wf.25.t:0 "Imperial Sinicization and Academy Charter"
 oe_wf.25.d:0 "The Son of Heaven has graciously approved our request to send royal scholars to the Imperial Academy and translate canonical treatises on governance, agronomy, and astronomy. Shall we embrace a deep institutional Sinicization charter, or adopt selected classics while safeguarding native aristocratic customs?"
 oe_wf.25.a:0 "Found a Royal Translation Academy and adopt imperial codes (Deep Sinicization)"
 oe_wf.25.b:0 "Focus on imperial printing, astronomy, and agronomy classics (Moderate Adoption)"
 oe_wf.26.t:0 "Bestowing Imperial Grace Across the Four Seas"
 oe_wf.26.d:0 "Envoys from tributary realms stand assembled outside the Meridian Gate. By honoring the classical principle of returning generous imperial gifts for modest tribute, we can fortify loyal vassals with golden seals and brocade, or bind maritime realms closer through liberal Kanhe customs concessions."
 oe_wf.26.a:0 "Bestow Golden Seals, silk brocade, and imperial patents"
 oe_wf.26.b:0 "Grant generous Kanhe maritime tallies and customs remissions"
 oe_wf.27.t:0 "The Son of Heaven Bestows Golden Seals and Gifts"
 oe_wf.27.d:0 "An imperial embassy bearing banners of the Son of Heaven has arrived at our court unprompted, delivering lavish brocade, official seals, and an edict praising our steadfast loyalty. Our standing in the tributary order—and our reserve of #Y Royal Favor#!—rises anew."
 oe_wf.27.a:0 "Enshrine the imperial gifts and proclaim our honored status"
 oe_wf.27.b:0 "Open our port warehouses to celebrate tributary commerce"
 oe_wf.30.t:0 "Trilemma of the Special Grace Palace Examination"
 oe_wf.30.d:0 "Thousands of candidates have assembled in the capital for the Special Grace Examination, yet the examiners present a sharp political dilemma. Southern literati dominate classical essays, risking northern alienation; great noble clans lobby for hereditary yin-privilege seats; while reformist examiners uncover bribery networks and urge replacing ornate verse with practical statecraft questions."
 oe_wf.30.a:0 "Balance North-South regional quotas to unite the realm's literati"
 oe_wf.30.b:0 "Reserve generous hereditary seats for prominent noble houses"
 oe_wf.30.c:0 "Mandate practical statecraft essays and purge exam fraud"
 oe_wf.31.t:0 "Posting the New Jinshi Graduates"
 oe_wf.31.d:0 "The balanced North-South palace rankings have been posted to widespread acclaim across the provinces. Now the Ministry of Personnel asks where the cream of the new Jinshi graduates should first be assigned."
 oe_wf.31.a:0 "Assign the new magistrates to provincial counties to steady local rule"
 oe_wf.31.b:0 "Induct the top scholars into the Hanlin Academy"
 oe_wf.32.t:0 "Censorate Remonstrance Over Aristocratic Quotas"
 oe_wf.32.d:0 "Hardly had the ink dried on the aristocratic exam roster before outspoken censors submitted joint memorials denouncing hereditary favoritism as a betrayal of impartial meritocracy."
 oe_wf.32.a:0 "Pacify the Censorate with a modest public reprimand"
 oe_wf.32.b:0 "Stand firmly behind the noble houses and silence the remonstrance"
 oe_wf.33.t:0 "Verdict of the Examination Fraud Indictment"
 oe_wf.33.d:0 "Investigators have traced leaked examination prompts directly to several prominent aristocratic households. Prosecuting the ring leaders mercilessly will bolster reformist authority and public trust, whereas quietly fining the culprits avoids a bitter noble backlash."
 oe_wf.33.a:0 "Prosecute the corrupt clans to the full rigor of the law"
 oe_wf.33.b:0 "Commute the harsh sentences into heavy silver fines"
 oe_wf.34.t:0 "The Imperial Penitential Edict"
 oe_wf.34.d:0 "In the hour of domestic distress and Heaven's warning, the sovereign steps before the Ancestral Temple to proclaim a solemn Penitential Edict—openly taking responsibility for fiscal burdens, warfare, and administrative lapses. A heartfelt self-reproach paired with tax remissions will deeply calm the realm at steep cost to imperial pride."
 oe_wf.34.a:0 "Issue a heartfelt self-reproach paired with emergency tax relief"
 oe_wf.34.b:0 "Deliver a measured ritual temple report and trim court outlays"
 oe_wf.35.t:0 "Diligent Personal Rule vs. Grand Secretariat Delegation"
 oe_wf.35.d:0 "Grand Secretaries and inner-court attendants debate how the sovereign should wield the vermilion brush over the coming decade. Diligent personal rule sharpens cabinet throughput, royal power, and provincial control at exhausting expense, while hands-off delegation to the Grand Secretariat calms the estates and lowers governance outlays at the cost of looser royal supervision."
 oe_wf.35.a:0 "Embrace Diligent Personal Rule: personally direct the ministries"
 oe_wf.35.b:0 "Adopt Hands-Off Delegation: entrust routine governance to the cabinet"
