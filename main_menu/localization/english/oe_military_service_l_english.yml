l_english:
 oe_peasants_military_service_land: "Military Service Lands"
 oe_peasants_military_service_land_desc: "Reduced land taxes bind registered farming households to military service and the provision of supplies. They retain the land that sustains their families, but must answer when the empire calls.\n\nPeasant Maximum Tax #R −10%#!; monthly movement toward Quantity #Y +0.1#!; Unit Food Consumption #G −5%#!; Manpower #G +10%#!.\n\nMutually exclusive with the other military-service privilege. If an older save already has both, only Military Service Land applies until one is revoked."
 oe_peasants_military_service_tax: "Military Service Tax"
 oe_peasants_military_service_tax_desc: "Farming households may commute part of their service obligations into a military tax, remaining in the fields while their payments sustain the standing army. Taxpayers gain greater autonomy, at the expense of the empire's available manpower.\n\nPeasant Maximum Tax #G +5%#!; Peasant Enfranchisement #G +5%#!; Manpower #R −5%#!.\n\nMutually exclusive with the other military-service privilege. If an older save already has both, only Military Service Land applies until one is revoked."
 oe_belisarius_pending_noncores: "New Belisarian Conquests"
 oe_belisarius_settlement_queued: "Belisarian Conquest Settlement Pending"
