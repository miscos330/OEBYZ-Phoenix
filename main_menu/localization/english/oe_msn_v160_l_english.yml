 STATIC_MODIFIER_NAME_oe_cne_msn_pru_m2:0 "Elbe-Oder-Vistula Northern Hegemony"
 STATIC_MODIFIER_DESC_oe_cne_msn_pru_m2:0 "Linking Magdeburg, Berlin, Stettin, Danzig, Konigsberg, and Wroclaw cements undisputed Prussian leadership in Northern Germany."
 STATIC_MODIFIER_NAME_oe_cne_msn_pru_m3:0 "General Directory & Enlightened Bureaucracy"
