# NEW 2026-11-22 v16.0 Europa Universalis & Crescent Cavalry — Module 16.0-C: v16.0 Central & North Europe Mission Trees oe_msn_35..38 (english) (oe_cne_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v160_central_north_europe.py; edit the generator, not this file.
 STATIC_MODIFIER_NAME_oe_cne_msn_boh_m1:0 "Unconquered Bohemian Wagenburg Bastion"
 STATIC_MODIFIER_DESC_oe_cne_msn_boh_m1:0 "Mobile war-wagon squares and fortified mountain passes turn Bohemia into an impenetrable Central European citadel."
 STATIC_MODIFIER_NAME_oe_cne_msn_boh_m2:0 "Premier Elector of the Bohemian Crownlands"
 STATIC_MODIFIER_DESC_oe_cne_msn_boh_m2:0 "Uniting Bohemia, Moravia, Silesia, and Lusatia elevates Prague to undisputed political leadership in the Empire."
 STATIC_MODIFIER_NAME_oe_cne_msn_boh_m3:0 "Kutna Hora Silver & Prague University"
 STATIC_MODIFIER_DESC_oe_cne_msn_boh_m3:0 "Joachimsthaler silver coinage, crystal manufactories, and Charles University scholars fuel sustained prosperity and innovation."
 STATIC_MODIFIER_NAME_oe_cne_msn_boh_m4:0 "Eternal Crown of Saint Wenceslas"
 STATIC_MODIFIER_DESC_oe_cne_msn_boh_m4:0 "Blending Hussite steel, imperial diplomacy, and dazzling silver wealth, Bohemia reigns eternal at the heart of Europe."
 STATIC_MODIFIER_NAME_oe_cne_msn_pru_m1:0 "Canton System & Potsdam Grenadier Discipline"
 STATIC_MODIFIER_DESC_oe_cne_msn_pru_m1:0 "Regimental cantons, iron ramrods, and towering Potsdam Grenadiers forge the most disciplined infantry on earth."
 STATIC_MODIFIER_NAME_oe_cne_msn_pru_m2:0 "Elbe-Oder-Vistula Northern Hegemony"
 STATIC_MODIFIER_DESC_oe_cne_msn_pru_m2:0 "Linking Magdeburg, Berlin, Stettin, Danzig, Konigsberg, and Wroclaw cements undisputed Prussian leadership in Northern Germany."
 STATIC_MODIFIER_NAME_oe_cne_msn_pru_m3:0 "General Directory & Enlightened Bureaucracy"
 STATIC_MODIFIER_DESC_oe_cne_msn_pru_m3:0 "Frugal Prussian auditors, Konigsberg scholars, and Stein-Hardenberg ministries maximize every thaler and citizen's talent."
 STATIC_MODIFIER_NAME_oe_cne_msn_pru_m4:0 "Iron Kingdom of the Black Eagle"
 STATIC_MODIFIER_DESC_oe_cne_msn_pru_m4:0 "An army with a state—unrivaled in drill, artillery, and enlightened governance—commands the destiny of Northern Europe."
 STATIC_MODIFIER_NAME_oe_cne_msn_dan_m1:0 "Royal Danish Admiralty & Kongeloven Guard"
 STATIC_MODIFIER_DESC_oe_cne_msn_dan_m1:0 "Copper-sheathed ships of the line from Holmen dockyards and loyal royal guards lock the Baltic straits tight."
 STATIC_MODIFIER_NAME_oe_cne_msn_dan_m2:0 "Kalmar Sovereign of the North & Baltic"
 STATIC_MODIFIER_DESC_oe_cne_msn_dan_m2:0 "Holding Copenhagen, Oslo, Lund, Schleswig, and Visby renders the Twin Kingdoms supreme across Northern waters."
 STATIC_MODIFIER_NAME_oe_cne_msn_dan_m3:0 "Sound Customs & Nordic Armed Neutrality"
 STATIC_MODIFIER_DESC_oe_cne_msn_dan_m3:0 "Lucrative Sound tolls, Bergen stockfish fleets, and convoyed neutral merchantmen pour silver into Copenhagen."
 STATIC_MODIFIER_NAME_oe_cne_msn_dan_m4:0 "Eternal Lord of the Two Northern Seas"
 STATIC_MODIFIER_DESC_oe_cne_msn_dan_m4:0 "From Greenland and Bergen through the Sound to Gotland, the Dannebrog flies unchallenged over Northern Europe's maritime crossroads."
 STATIC_MODIFIER_NAME_oe_cne_msn_pap_m1:0 "Pontifical Swiss Guard & Tridentine Orthodoxy"
 STATIC_MODIFIER_DESC_oe_cne_msn_pap_m1:0 "Halberdier Swiss Guards and reformed Tridentine clergy fortify the Papacy's temporal shield and spiritual authority."
 STATIC_MODIFIER_NAME_oe_cne_msn_pap_m2:0 "Patrimonium Sancti Petri & Italian Arbiter"
 STATIC_MODIFIER_DESC_oe_cne_msn_pap_m2:0 "Stretching from Rome and Ancona to Bologna and Ravenna makes the Papacy the diplomatic keystone of Italy."
 STATIC_MODIFIER_NAME_oe_cne_msn_pap_m3:0 "St. Peter's Basilica & Propaganda Fide"
 STATIC_MODIFIER_DESC_oe_cne_msn_pap_m3:0 "Vatican humanism, Michelangelo's towering dome, and global missionary orders project Roman prestige across every ocean."
 STATIC_MODIFIER_NAME_oe_cne_msn_pap_m4:0 "Eternal Keys of the Kingdom of God"
 STATIC_MODIFIER_DESC_oe_cne_msn_pap_m4:0 "Crowned in marble, faith, and sovereign Italian unity, the Eternal City shines as the unbroken spiritual beacon of Christendom."
 oe_msn_boh_destiny:0 "#bold #color_yellow Bohemia: Crown of Saint Wenceslas#!#!"
 oe_msn_boh_destiny_DESCRIPTION:0 "From Prague's Golden Bull and Hussite War Wagons to Central European Primacy"
 oe_msn_boh_destiny_CRITERIA_DESCRIPTION:0 "Anchor Prague and Kutna Hora, master Wagenburg warfare, unite Moravia, Silesia, and Lusatia, and crown Central Europe's premier silver and scholarly realm."
 oe_msn_boh_destiny_BUTTON_TOOLTIP:0 "Embark on the Bohemian Destiny"
 oe_msn_boh_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Bohemia: defend the Vltava heartland with Hussite war wagons and frontier fortresses, unite Moravia, Silesia, and Lusatia beneath the Crown of Saint Wenceslas, and enrich the realm with Charles University, Kutna Hora silver thalers, and Bohemian crystal guilds."
 oe_msn_boh_01_golden_bull_prague:0 "Golden Bull of Prague: Anchor the Vltava"
 oe_msn_boh_01_golden_bull_prague_desc:0 "Crowned by the 1356 Golden Bull as first secular Elector of the Empire, Prague spans the Vltava beneath Charles Bridge and the soaring spires of Hradcany. Anchoring our Bohemian [capital|e] fortifies royal [legitimacy|e], steadies [stability|e], and commands Imperial [prestige|e]."
 oe_msn_boh_01_golden_bull_prague_req_tt:0 "Own Prague and Plzen, have 5 Stability, 45% Nobles Satisfaction, and own a Castle."
 oe_msn_boh_02_bethlehem_chapel_reform:0 "Bethlehem Chapel: Bohemian Civic Renewal"
 oe_msn_boh_02_bethlehem_chapel_reform_desc:0 "Preaching in the vernacular beneath the timber rafters of Bethlehem Chapel, Bohemian reformers forge an ardent civic covenant uniting burghers, knights, and townsfolk. Channeling [religious_influence|e] into civic unity lifts [estate_satisfaction|e], spreads [literacy|e], and steels national [army_tradition|e]."
 oe_msn_boh_02_bethlehem_chapel_reform_req_tt:0 "Own Prague, have 10 Stability, 50% Burghers Satisfaction, and own a Cathedral or Temple."
 oe_msn_boh_03_wagenburg_war_wagons:0 "Wagenburg Arsenal: Armored War Wagons"
 oe_msn_boh_03_wagenburg_war_wagons_desc:0 "Chained wheel-to-wheel on hilltop crests, Jan Zizka's iron-shod war wagons bristle with pistaly handgonnes, houfnice howitzers, and iron-shod flails that break armored crusader charges. Standardizing mobile wagon [regulars|e] turns [gold|e] into lethal [army|e] firepower and peerless [army_tradition|e]."
 oe_msn_boh_03_wagenburg_war_wagons_req_tt:0 "Own Prague in the Age of Renaissance or later, hold 220 Gold, 18 Army Tradition, and an Armory or Cannon Maker."
 oe_msn_boh_04_unconquered_bohemian_bastion:0 "Cheb & Mountain Passes: Unconquered Bastion"
 oe_msn_boh_04_unconquered_bohemian_bastion_desc:0 "Ringed by the Ore Mountains, Sumava forests, and star-angled ramparts guarding Cheb, the Bohemian diamond stands immune to any second White Mountain. Modern [fort|e] rings and firm [institutions|e] protect provincial [control|e] while keeping our [stability|e] unshaken."
 oe_msn_boh_04_unconquered_bohemian_bastion_req_tt:0 "Own Prague and control Cheb in the Age of Reformation or later, have 15 Stability, a Bastion, and embrace Confessionalism."
 oe_msn_boh_05_moravian_margraviate:0 "Margraviate of Moravia: Brno & Olomouc"
 oe_msn_boh_05_moravian_margraviate_desc:0 "Securing Spilberk's heights above Brno and the episcopal halls of Olomouc anchors Moravia's fertile corridor linking the Vltava basin with the Danube plains. Integrating this eastern [core|e] bolsters [manpower|e], lifts regional [prosperity|e], and deepens crown [development|e]."
 oe_msn_boh_05_moravian_margraviate_req_tt:0 "Control Brno and Olomouc (directly or via subject) and have at least 20 Capital Development."
 oe_msn_boh_06_silesian_duchies:0 "Duchies of Silesia: Wroclaw & the Oder"
 oe_msn_boh_06_silesian_duchies_desc:0 "Wroclaw's Gothic cloth halls and the Oder river towns of Silesia bring booming linen looms, coal seams, and northern trade bridges into the Bohemian crown lands. Holding this rich [core|e] expands our [market|e] reach, grows [trade|e], and reinforces royal [control|e]."
 oe_msn_boh_06_silesian_duchies_req_tt:0 "Control Wroclaw and Legnica (directly or via subject) and have at least 15 Army Tradition."
 oe_msn_boh_07_lusatian_corridor:0 "Six Cities of Lusatia: Bautzen & Gorlitz"
 oe_msn_boh_07_lusatian_corridor_desc:0 "The Lusatian League of Six Cities—led by Bautzen and Gorlitz—keeps the Via Regia free of robber barons from Saxony straight into Poland. Protecting these chartered [core|e] towns rewards [estates|e], channels overland [trade|e], and amplifies royal [diplomatic_reputation|e]."
 oe_msn_boh_07_lusatian_corridor_req_tt:0 "Control Bautzen and Gorlitz, hold at least 55 locations, and own a Guild Hall."
 oe_msn_boh_08_electoral_primacy_empire:0 "Electoral Primacy Across Central Europe"
 oe_msn_boh_08_electoral_primacy_empire_desc:0 "With Bohemia, Moravia, and Silesia standing united behind Prague, German princes and foreign envoys alike recognize the Bohemian vote as the hinge of Central Europe. Masterful [diplomacy|e] and loyal [subjects|e] elevate [crown_power|e] alongside unchallenged Imperial [prestige|e]."
 oe_msn_boh_08_electoral_primacy_empire_req_tt:0 "Own Prague and control Brno and Wroclaw in the Age of Reformation or later, and have 1 subject or 32 Army Tradition."
 oe_msn_boh_09_charles_university_letters:0 "Charles University: Beacon of Central Europe"
 oe_msn_boh_09_charles_university_letters_desc:0 "Founded in 1348 as the oldest university north of the Alps, the Carolinum draws jurists, astronomers like Tycho Brahe and Kepler, and humanist poets to Prague. Flourishing academic [buildings|e] diffuse [institutions|e] and [literacy|e], raising [cultural_tradition|e] across Central Europe."
 oe_msn_boh_09_charles_university_letters_req_tt:0 "Own Prague in the Age of Renaissance or later, own a University, and embrace the Renaissance."
 oe_msn_boh_10_kutna_hora_silver_thaler:0 "Kutna Hora Silver & the Royal Thaler Mint"
 oe_msn_boh_10_kutna_hora_silver_thaler_desc:0 "From the Italian Court mint at Kutna Hora to the silver shafts of Joachimsthal that gave the world the Thaler and Dollar, Bohemian coinage anchors Central European finance. Regulated royal minting holds back [inflation|e], swells our [gold|e] coffers, and energizes [market|e] [prosperity|e]."
 oe_msn_boh_10_kutna_hora_silver_thaler_req_tt:0 "Own Prague and control Kutna Hora, hold 300 Gold, earn 22 monthly trade & tax income, and own a Marketplace."
 oe_msn_boh_11_bohemian_crystal_guilds:0 "Bohemian Crystal & Glassmaking Guilds"
 oe_msn_boh_11_bohemian_crystal_guilds_desc:0 "Using beechwood potash from border forests, Bohemian master cutters invent chalk-clear crystal that eclipses Venetian glass in every baroque court from Paris to St. Petersburg. Guild [buildings|e] drive luxury [trade|e], spur artisan [advances|e], and enrich royal [gold|e] exports."
 oe_msn_boh_11_bohemian_crystal_guilds_req_tt:0 "Own Prague in the Age of Reformation or later, have 15 Stability, earn 40 monthly income, and own a Glass Guild or Glass Workshop."
 oe_msn_boh_12_crown_of_saint_wenceslas:0 "Eternal Crown of Saint Wenceslas"
 oe_msn_boh_12_crown_of_saint_wenceslas_desc:0 "Resting unbroken on the brow of Prague, the jeweled Crown of Saint Wenceslas presides over an industrial, scholarly, and martial heartland at the crossroads of Europe. Acclaimed as a [great_power|e], Bohemia unites [legitimacy|e], [cultural_tradition|e], and [crown_power|e] for the ages."
 oe_msn_boh_12_crown_of_saint_wenceslas_req_tt:0 "Own Prague and control Brno and Wroclaw in the Age of Absolutism or later, have 18 Stability, a Star Fort or Stock Exchange, and be a Great Power or earn 70 monthly income."
 oe_msn_pru_destiny:0 "#bold #color_yellow Prussia & Brandenburg: Iron Eagle of the North#!#!"
 oe_msn_pru_destiny_DESCRIPTION:0 "From Ordensburg and the Electoral March to Potsdam Grenadiers and Silesian Victory"
 oe_msn_pru_destiny_CRITERIA_DESCRIPTION:0 "Unite Berlin and Konigsberg, master the Canton System and Potsdam Grenadiers, secure Pomerania and Silesia, and forge Europe's premier military state."
 oe_msn_pru_destiny_BUTTON_TOOLTIP:0 "Embark on the Prussian Destiny"
 oe_msn_pru_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for the Teutonic Order, Brandenburg, and Prussia: evolve from Ordensburg discipline to the Great Elector's army and Potsdam Grenadiers, connect Berlin, Konigsberg, Pomerania, and Silesia, and crown the Iron Kingdom with the General Directory and Stein-Hardenberg reforms."
 oe_msn_pru_01_eagle_of_brandenburg_prussia:0 "Black Eagle Rising: Anchor the Mark or Prussia"
 oe_msn_pru_01_eagle_of_brandenburg_prussia_desc:0 "Across the sandy heaths of Brandenburg and the brick strongholds of East Prussia, the Black Eagle subdues robber knights and welds scattered marches under firm rule. Securing our northern [capital|e] steadies [stability|e], disciplines the [estates|e], and anchors dynastic [control|e]."
 oe_msn_pru_01_eagle_of_brandenburg_prussia_req_tt:0 "Own Berlin, Malbork, or Konigsberg, have 5 Stability, 45% Nobles Satisfaction, and own a Castle."
 oe_msn_pru_02_ordensburg_drills:0 "Ordensburg Discipline & Martial Drill"
 oe_msn_pru_02_ordensburg_drills_desc:0 "Inheriting the austere monastic discipline of the Teutonic Ordensburg, our officers replace drunken feudal levies with daily cadence drill and winter musketry practice. Early barracks discipline lifts [army_tradition|e], steels our [army|e], and turns modest [manpower|e] into feared [regulars|e]."
 oe_msn_pru_02_ordensburg_drills_req_tt:0 "Have at least 10 Stability, 15 Army Tradition, and own a Weapon Guild."
 oe_msn_pru_03_great_elector_army:0 "The Great Elector's War Commissariat"
 oe_msn_pru_03_great_elector_army_desc:0 "Through the Generalkriegskommissariat, the Great Elector collects excise taxes directly into a permanent standing army that answers only to the throne, proven at Fehrbellin. Mastering modern [advances|e] unites [cabinet|e] administration, [crown_power|e], and fiscal [gold|e] behind steel."
 oe_msn_pru_03_great_elector_army_req_tt:0 "In the Age of Discovery or later, hold 240 Gold, own a Training Fields or Armory, and unlock the Pike and Shot advance."
 oe_msn_pru_04_canton_potsdam_grenadiers:0 "Canton System & Potsdam Giant Grenadiers"
 oe_msn_pru_04_canton_potsdam_grenadiers_desc:0 "The Kantonreglement ties every rural district to a named regiment while Potsdam's iron-ramrod grenadiers fire four volleys a minute and pivot effortlessly into oblique-order attack. Embracing [institutions|e] unlocks peak [army_tradition|e], sustains [manpower|e], and crowns our [regulars|e]."
 oe_msn_pru_04_canton_potsdam_grenadiers_req_tt:0 "In the Age of Absolutism or later, have 15 Stability, 40 Army Tradition, and embrace Military Revolution."
 oe_msn_pru_05_unite_berlin_konigsberg:0 "Twin Capitals: Unite Berlin & Konigsberg"
 oe_msn_pru_05_unite_berlin_konigsberg_desc:0 "Joining Berlin's electoral palace on the Spree with the royal coronation city of Konigsberg on the Pregel turns a split dynastic inheritance into a sovereign northern kingdom. Uniting both [core|e] hubs elevates [legitimacy|e], deepens [control|e], and spurs urban [development|e]."
 oe_msn_pru_05_unite_berlin_konigsberg_req_tt:0 "Control Berlin and Konigsberg (directly or via subject) and have at least 18 Capital Development."
 oe_msn_pru_06_pomeranian_baltic_corridor:0 "Baltic Corridor: Stettin & Danzig"
 oe_msn_pru_06_pomeranian_baltic_corridor_desc:0 "Securing the Oder mouth at Stettin and the Vistula gateway at Danzig removes the last corridor dividing Brandenburg from East Prussia and opens deep Baltic quays. Holding this maritime [core|e] boosts [trade|e], cultivates [navy_tradition|e], and expands northern [maritime_presence|e]."
 oe_msn_pru_06_pomeranian_baltic_corridor_req_tt:0 "Control Stettin and Gdansk (directly or via subject) and hold at least 4 ports."
 oe_msn_pru_07_conquest_of_silesia:0 "Silesian Triumph: Wroclaw & the Oder"
 oe_msn_pru_07_conquest_of_silesia_desc:0 "Won through winter marches at Mollwitz, Hohenfriedberg, and Leuthen, populous Silesia doubles Prussian tax revenues, iron ore, and textile looms overnight. Integrating this prized [core|e] swells our [gold|e] treasury, elevates [prosperity|e], and proves peerless [army|e] prestige."
 oe_msn_pru_07_conquest_of_silesia_req_tt:0 "Control Wroclaw and Glogow, hold at least 45 locations, and have 28 Army Tradition."
 oe_msn_pru_08_magdeburg_elbian_hegemony:0 "Elbian Fortress: Magdeburg & North German Primacy"
 oe_msn_pru_08_magdeburg_elbian_hegemony_desc:0 "Rebuilt from the ashes into the mightiest river fortress along the middle Elbe, Magdeburg anchors Prussian predominance across the entire North German plain. Securing this Elbian [core|e] reinforces our [fort|e] frontier, lifts [prestige|e], and commands Imperial [diplomacy|e]."
 oe_msn_pru_08_magdeburg_elbian_hegemony_req_tt:0 "Control Magdeburg, Berlin, and Konigsberg in the Age of Reformation or later, and own a Barracks or Bastion."
 oe_msn_pru_09_konigsberg_albertina:0 "Albertina University & Northern Humanism"
 oe_msn_pru_09_konigsberg_albertina_desc:0 "Chartered by Duke Albrecht in 1544, the Albertina at Konigsberg becomes the northern beacon of Lutheran scholarship, mathematics, and later Immanuel Kant's critical philosophy. Academic [buildings|e] propagate [institutions|e] and [literacy|e], raising Prussian [cultural_tradition|e] alongside martial fame."
 oe_msn_pru_09_konigsberg_albertina_req_tt:0 "Own Konigsberg or Berlin in the Age of Renaissance or later, own a University, and embrace the Renaissance."
 oe_msn_pru_10_general_directory_fisc:0 "The General Directory & Berlin War Chest"
 oe_msn_pru_10_general_directory_fisc_desc:0 "Under the General Directory, frugal monarchs live like Spartan stewards, draining the Oderbruch marshes, welcoming Huguenot artisans, and stacking silver thalers in the Berlin war chest. Frugal [cabinet|e] budgeting holds down [inflation|e], builds [gold|e], and deepens domestic [prosperity|e]."
 oe_msn_pru_10_general_directory_fisc_req_tt:0 "Own Berlin or Potsdam, hold 300 Gold, earn 25 monthly trade & tax income, and own a Marketplace."
 oe_msn_pru_11_sanssouci_stein_hardenberg:0 "Sanssouci & Stein-Hardenberg Modernization"
 oe_msn_pru_11_sanssouci_stein_hardenberg_desc:0 "From Voltaire's debates at Sanssouci to the Stein-Hardenberg edicts emancipating serfs, codifying civil law, and founding meritocratic ministries, Prussia reinvents itself from above. Enlightened reform accelerates [advances|e], raises [literacy|e], and elevates capital [development|e] and [crown_power|e]."
 oe_msn_pru_11_sanssouci_stein_hardenberg_req_tt:0 "In the Age of Absolutism or later, have 15 Stability, 28 Capital Development, and an Iron Foundry or Stock Exchange."
 oe_msn_pru_12_iron_kingdom_north:0 "Iron Kingdom of the North"
 oe_msn_pru_12_iron_kingdom_north_desc:0 "Forged from poor sand into steel, the Iron Kingdom of the North stands as Europe's fifth great pillar where every bureaucrat, scholar, and grenadier marches to one clockwork rhythm. Recognized as a [great_power|e], Prussia fuses unmatched [army|e] discipline, [cabinet|e] rigor, and [prestige|e]."
 oe_msn_pru_12_iron_kingdom_north_req_tt:0 "Control Berlin, Konigsberg, and Wroclaw in the Age of Absolutism or later, have 18 Stability, a Star Fort, and be a Great Power or have 55 Army Tradition."
 oe_msn_dan_destiny:0 "#bold #color_yellow Denmark & Norway: Sovereign of the Straits & Two Seas#!#!"
 oe_msn_dan_destiny_DESCRIPTION:0 "From Kalmar and the Sound Toll to the Royal Fleet and North Atlantic Mastery"
 oe_msn_dan_destiny_CRITERIA_DESCRIPTION:0 "Master the Sound at Copenhagen and Helsingor, unite Scania, Norway, and Schleswig, build an unrivaled Royal Navy, and lead Nordic commerce and Enlightenment."
 oe_msn_dan_destiny_BUTTON_TOOLTIP:0 "Embark on the Danish-Norwegian Destiny"
 oe_msn_dan_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Denmark and Norway: enforce the Sound Dues and build the Royal Danish Admiralty and Kongeloven guard, secure Scania, Norway, Schleswig, and Gotland, and enrich the Twin Kingdoms through North Atlantic fisheries, Sound customs, and Armed Neutrality."
 oe_msn_dan_01_crown_of_the_straits:0 "Crown of the Straits: Anchor Zealand & Oslo"
 oe_msn_dan_01_crown_of_the_straits_desc:0 "Where the Belts and the Oresund funnel every Baltic sail past Zealand's limestone cliffs, the Danish crown holds the natural turnstile between two northern seas. Anchoring our maritime [capital|e] steadies [legitimacy|e], secures coastal [control|e], and projects early [maritime_presence|e]."
 oe_msn_dan_01_crown_of_the_straits_req_tt:0 "Own Copenhagen, Roskilde, or Oslo, have 5 Stability, a port, and a Wharf."
 oe_msn_dan_02_helsingor_sound_dues:0 "Helsingor Cannon: Enforce the Sound Dues"
 oe_msn_dan_02_helsingor_sound_dues_desc:0 "Beneath the brass cannon of Kronborg Castle at Helsingor, every Hanseatic cog and Dutch fluyt lowers topsails to pay the royal Sound Dues directly into the king's purse. Fortifying the narrows turns a coastal [fort|e] into rivers of [gold|e], boosting [navy_tradition|e] and [trade|e] leverage."
 oe_msn_dan_02_helsingor_sound_dues_req_tt:0 "Own Helsingor and Copenhagen, have 10 Stability, earn 18 monthly income, and own a Castle."
 oe_msn_dan_03_royal_danish_admiralty:0 "Holmen Dockyards & Royal Admiralty"
 oe_msn_dan_03_royal_danish_admiralty_desc:0 "At Bremerholm and Nyholm, royal master shipwrights lay down oak-hulled warships manned by registered Danish and Norwegian seamen housed in Nyboder's yellow rows. Permanent naval [buildings|e] sustain a vigilant [navy|e], drill hardy [sailors|e], and elevate [navy_tradition|e]."
 oe_msn_dan_03_royal_danish_admiralty_req_tt:0 "In the Age of Renaissance or later, hold 220 Gold, 20 Navy Tradition, and own a Dock."
 oe_msn_dan_04_kongeloven_royal_guard:0 "Kongeloven & the Royal Life Guards"
 oe_msn_dan_04_kongeloven_royal_guard_desc:0 "Backed by Copenhagen's burghers and clergy after surviving siege, the 1665 Kongeloven codifies hereditary monarchy while the Royal Life Guards stand watch over Rosenborg. Embracing [institutions|e] consolidates [crown_power|e], steadies [stability|e], and sharpens royal [regulars|e]."
 oe_msn_dan_04_kongeloven_royal_guard_req_tt:0 "In the Age of Reformation or later, have 15 Stability, a Barracks or Shipyard, and embrace Confessionalism."
 oe_msn_dan_05_scanian_shore_lund:0 "Both Shores of the Sound: Lund & Malmo"
 oe_msn_dan_05_scanian_shore_lund_desc:0 "Holding Lund's ancient cathedral and Malmo's herring markets ensures both shores of the Oresund remain firmly Danish, preventing rival batteries from threatening Copenhagen. Cementing this Scanian [core|e] guarantees strait [control|e], feeds coastal [prosperity|e], and guards [trade|e]."
 oe_msn_dan_05_scanian_shore_lund_req_tt:0 "Control Lund and Malmo (directly or via subject) and hold at least 6 ports."
 oe_msn_dan_06_norwegian_fjords_bergen:0 "Fjords of Norway: Oslo & Bergen"
 oe_msn_dan_06_norwegian_fjords_bergen_desc:0 "From Akershus fortress above Oslo Fjord to Bergen's Bryggen wharves, Norway furnishes mast pine, stockfish, iron, and generations of fearless North Atlantic mariners. Uniting the twin-realm [core|e] expands our [sailors|e] reserve, deepens [maritime_presence|e], and bolsters [navy|e] reach."
 oe_msn_dan_06_norwegian_fjords_bergen_req_tt:0 "Control Oslo and Bergen (directly or via subject) and own a Fishing Village."
 oe_msn_dan_07_schleswig_lubeck_gate:0 "Jutland Gate: Schleswig & Flensburg"
 oe_msn_dan_07_schleswig_lubeck_gate_desc:0 "Securing Schleswig and Flensburg places Jutland's cattle drives, duchy ports, and the approaches to Hamburg and Lubeck under Copenhagen's watchful banner. Holding this southern [core|e] balances northern German [diplomacy|e], lifts [estate_satisfaction|e], and enriches [market|e] tolls."
 oe_msn_dan_07_schleswig_lubeck_gate_req_tt:0 "Control Schleswig and Flensburg, hold at least 65 locations, and have 50% Burghers Satisfaction."
 oe_msn_dan_08_kalmar_baltic_sovereign:0 "Visby & the Baltic: Kalmar Naval Supremacy"
 oe_msn_dan_08_kalmar_baltic_sovereign_desc:0 "From Gotland's walled citadel of Visby, Danish frigates command the central Baltic crossroads just as Queen Margaret envisioned for the Kalmar realms. Securing this island [core|e] proves unmatched [navy_tradition|e], projects [maritime_presence|e], and crowns Nordic [prestige|e]."
 oe_msn_dan_08_kalmar_baltic_sovereign_req_tt:0 "Own Copenhagen and control Visby and Oslo in the Age of Reformation or later, with at least 32 Navy Tradition."
 oe_msn_dan_09_north_atlantic_fisheries:0 "North Atlantic Fisheries & Sea Charts"
 oe_msn_dan_09_north_atlantic_fisheries_desc:0 "From Tycho Brahe's Uraniborg observatory on Hven to royal hydrographic charts guiding Iceland and Faroe fishing fleets, Nordic science turns dark northern seas into mapped highways. Embracing [institutions|e] boosts [literacy|e], sparks nautical [advances|e], and enriches [cultural_tradition|e]."
 oe_msn_dan_09_north_atlantic_fisheries_req_tt:0 "Control Bergen, Nidaros, or Aarhus in the Age of Renaissance or later, own a Counting House or University, and embrace the Renaissance."
 oe_msn_dan_10_sound_customs_treasury:0 "Rentekammer Treasury & Sound Ledgers"
 oe_msn_dan_10_sound_customs_treasury_desc:0 "Inside the Rentekammer auditing chambers, clerks tally every Baltic timber cargo, Baltic grain ship, and Asian Tranquebar vessel calling at Copenhagen's Bourse. Rigorous [cabinet|e] ledgers curb [inflation|e], multiply royal [gold|e], and nourish urban [development|e]."
 oe_msn_dan_10_sound_customs_treasury_req_tt:0 "Own Copenhagen, hold 300 Gold, have 22 Capital Development, and own a Marketplace."
 oe_msn_dan_11_nordic_armed_neutrality:0 "Nordic Law & Armed Neutrality Convoys"
 oe_msn_dan_11_nordic_armed_neutrality_desc:0 "When great powers clash across the oceans, Danish frigates escort neutral Nordic convoys under Christian V's unified law code, reaping windfall freight profits across the globe. Shrewd [diplomacy|e] and armed [navy|e] escorts boost [diplomatic_reputation|e] and keep neutral [trade|e] booming."
 oe_msn_dan_11_nordic_armed_neutrality_req_tt:0 "In the Age of Absolutism or later, have 15 Stability, earn 55 monthly income, and own a Stock Exchange or Shipyard."
 oe_msn_dan_12_eternal_lord_two_seas:0 "Eternal Lord of the Two Northern Seas"
 oe_msn_dan_12_eternal_lord_two_seas_desc:0 "From the misty fjords of Norway and the open North Atlantic to the gilded customs halls of the Sound and Visby, the Dannebrog flies unchallenged over two northern seas. Acclaimed as a [great_power|e], Denmark unites [navy|e] mastery, oceanic [trade|e], and sovereign [crown_power|e]."
 oe_msn_dan_12_eternal_lord_two_seas_req_tt:0 "Own Copenhagen and control Oslo and Lund in the Age of Absolutism or later, have 18 Stability, a Star Fort or Shipyard, and be a Great Power or earn 70 monthly income."
 oe_msn_pap_destiny:0 "#bold #color_yellow Papal States: Eternal Keys of Saint Peter#!#!"
 oe_msn_pap_destiny_DESCRIPTION:0 "From Avignon Return and the Patrimony of Saint Peter to St. Peter's Dome and the Kingdom of God"
 oe_msn_pap_destiny_CRITERIA_DESCRIPTION:0 "Restore Rome as Christendom's spiritual capital, raise the Swiss Guard and Tridentine Church, consolidate Umbria, Marche, and Romagna, and complete St. Peter's Basilica."
 oe_msn_pap_destiny_BUTTON_TOOLTIP:0 "Embark on the Papal Destiny"
 oe_msn_pap_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for the Papal States: return from Avignon, heal the Western Schism, field the Pontifical Swiss Guard and Tridentine reforms, recover Perugia, Ancona, Bologna, Ravenna, Urbino, and Ferrara, and crown the Eternal City with the Vatican Library and St. Peter's Basilica."
 oe_msn_pap_01_return_to_eternal_city:0 "Return to the Eternal City: Rome & Viterbo"
 oe_msn_pap_01_return_to_eternal_city_desc:0 "After the bitter decades of the Avignon exile, restoring the papal court to Rome and Viterbo rekindles apostolic [stability|e] along the Tiber. Rebuilding hallowed [buildings|e] in the [capital|e] draws pilgrims back and revitalizes Latin [development|e]."
 oe_msn_pap_01_return_to_eternal_city_req_tt:0 "Hold Rome and Viterbo (or via subjects), Stability >= 5, and own a Cathedral or Temple."
 oe_msn_pap_02_heal_western_schism:0 "Heal the Western Schism: One Undivided See"
 oe_msn_pap_02_heal_western_schism_desc:0 "Rival obediences in Avignon and Pisa tore Latin Christendom apart until a single Roman pontiff reclaimed undisputed [religious_influence|e]. Uniting monastic [estates|e] through skilled [diplomacy|e] restores universal [prestige|e] to the Chair of Peter."
 oe_msn_pap_02_heal_western_schism_req_tt:0 "Hold Rome (or via subjects), Stability >= 10, Clergy Satisfaction >= 55%, and own a Monastery or Scriptorium."
 oe_msn_pap_03_warrior_pope_swiss_guard:0 "Pontifical Swiss Guard & Castel Sant'Angelo"
 oe_msn_pap_03_warrior_pope_swiss_guard_desc:0 "When foreign armies marched across Italy, Julius II fortified Castel Sant'Angelo and summoned halberdiers from the Swiss cantons to guard the Vatican. Investing [gold|e] into a hardened [fort|e] and disciplined [regulars|e] forges lasting [army_tradition|e] for the Church Militant."
 oe_msn_pap_03_warrior_pope_swiss_guard_req_tt:0 "Age of Renaissance+, hold Rome, Gold >= 220, Armory or Castle, and Army Tradition >= 15 or Professional Armies."
 oe_msn_pap_04_tridentine_church_triumphant:0 "Tridentine Renewal: Church Triumphant"
 oe_msn_pap_04_tridentine_church_triumphant_desc:0 "Confronted by northern schism, the fathers at Trent codified seminary discipline, catechisms, and baroque liturgy to renew Catholic [institutions|e]. Printing orthodox decrees raises clerical [literacy|e], deepens [religious_influence|e], and anchors doctrinal [stability|e]."
 oe_msn_pap_04_tridentine_church_triumphant_req_tt:0 "Age of Reformation+, hold Rome, Stability >= 15, embrace Confessionalism, and own a University or Printing Press Shop."
 oe_msn_pap_05_umbria_marche_restored:0 "Umbria & the Marche: Perugia & Ancona"
 oe_msn_pap_05_umbria_marche_restored_desc:0 "Cardinal Albornoz proved that papal authority meant nothing while Umbrian hill communes and Adriatic ports defied Roman legates. Securing Perugia and Ancona as a loyal [core|e] extends papal [control|e] to the eastern shore and channels Levantine [trade|e] into church [prosperity|e]."
 oe_msn_pap_05_umbria_marche_restored_req_tt:0 "Hold Perugia and Ancona (or via subjects), and possess at least one port."
 oe_msn_pap_06_romagna_bologna_ravenna:0 "Romagna & Exarchate: Bologna & Ravenna"
 oe_msn_pap_06_romagna_bologna_ravenna_desc:0 "From the Bentivoglio towers of Bologna to the mosaic basilicas of Ravenna, the ancient Exarchate long resisted direct rule from Rome. Bringing Romagna under a firm [core|e] expands papal [manpower|e], fortifies northern [control|e], and sharpens [army_tradition|e]."
 oe_msn_pap_06_romagna_bologna_ravenna_req_tt:0 "Hold Bologna and Ravenna (or via subjects), and own a Castle or Marketplace."
 oe_msn_pap_07_urbino_ferrara_fiefs:0 "Ducal Fiefs Reclaimed: Urbino & Ferrara"
 oe_msn_pap_07_urbino_ferrara_fiefs_desc:0 "The Montefeltro dukes of Urbino and Este lords of Ferrara held their rich courts as papal vicars before escheating back to the Holy See. Incorporating these proud [subjects|e] into the Roman [core|e] elevates [crown_power|e] while conciliating the landed [estates|e]."
 oe_msn_pap_07_urbino_ferrara_fiefs_req_tt:0 "Hold Urbino and Ferrara (or via subjects), at least 32 locations owned or by subjects, and Nobles Satisfaction >= 50%."
 oe_msn_pap_08_arbiter_of_italy:0 "Arbiter of Italy: Patrimonium Sancti Petri"
 oe_msn_pap_08_arbiter_of_italy_desc:0 "Spanning from the Tyrrhenian shore to the Po delta, the unified Patrimonium Sancti Petri now checks every prince on the peninsula. Backed by modern [fort|e] rings and a standing [army|e], Rome speaks as an undisputed [great_power|e] with commanding [diplomatic_reputation|e]."
 oe_msn_pap_08_arbiter_of_italy_req_tt:0 "Age of Reformation+, hold Rome, Bologna, and Ancona, Bastion or Barracks, and Great Power or Trade/Tax Income >= 90."
 oe_msn_pap_09_vatican_library_humanism:0 "Vatican Library & Roman Humanism"
 oe_msn_pap_09_vatican_library_humanism_desc:0 "Nicholas V and Sixtus IV rescued Greek codices and Latin classics to open the Vatican Library to scholars from across Europe. Embracing humanist [institutions|e] and patronizing learned [buildings|e] elevates [literacy|e] and crowns Rome in [cultural_tradition|e]."
 oe_msn_pap_09_vatican_library_humanism_req_tt:0 "Age of Renaissance+, hold Rome, embrace Renaissance, and own a Library or Art School."
 oe_msn_pap_10_saint_peters_basilica:0 "Raise St. Peter's Basilica Dome"
 oe_msn_pap_10_saint_peters_basilica_desc:0 "Bramante, Raphael, and Michelangelo raised travertine piers and a soaring double dome above the apostle's tomb to awe every pilgrim entering Rome. Pouring [gold|e] into this supreme monument transforms the [capital|e], lifts urban [development|e], and magnifies papal [prestige|e]."
 oe_msn_pap_10_saint_peters_basilica_req_tt:0 "Hold Rome, Gold >= 320, Capital Development >= 22, and own a Cathedral."
 oe_msn_pap_11_propaganda_fide_missions:0 "Propaganda Fide: Global Apostolic Missions"
 oe_msn_pap_11_propaganda_fide_missions_desc:0 "With polyglot presses in Rome and missionaries sailing aboard oceanic fleets, the Sacred Congregation de Propaganda Fide carried the Gospel from Goa to Nagasaki. Blending global [diplomacy|e] with maritime [trade|e] extends [religious_influence|e] and scholarly [advances|e]."
 oe_msn_pap_11_propaganda_fide_missions_req_tt:0 "Age of Reformation+, hold Rome, Stability >= 15, Printing Press Shop or Port Authority, and 4+ ports or Trade/Tax Income >= 75."
 oe_msn_pap_12_kingdom_of_god_on_earth:0 "Eternal Keys: Kingdom of God on Earth"
 oe_msn_pap_12_kingdom_of_god_on_earth_desc:0 "Temporal sword and spiritual keys now converge in an eternal Roman monarchy revered from the Alps to the Strait of Messina. Crowned by supreme [legitimacy|e] and civic [prosperity|e], the [capital|e] stands as a [great_power|e] whose verdict shapes the destiny of Christendom."
 oe_msn_pap_12_kingdom_of_god_on_earth_req_tt:0 "Age of Absolutism+, hold Rome, Bologna, and Ravenna, Stability >= 18, Capital Development >= 30, and Great Power or 55+ locations."
