 # NEW 2026-11-23 v19.0 Module 19.0-D: AI 3.0 & Engine Testing Localization (oe_ai3_). Generated by gen_v190_ai3_tests.py.
 oe_ai3_industrial_modernizer:0 "Industrial Modernizer"
 oe_ai3_industrial_modernizer_desc:0 "This state prioritizes industrial institutions, foundry capital, and administrative reform over reckless wars, seeking technological superiority and domestic production strength."
 oe_ai3_maritime_thalassocrat:0 "Maritime Thalassocrat"
 oe_ai3_maritime_thalassocrat_desc:0 "This realm anchors its grand strategy on sea lanes, inter-oceanic choke points, and commercial fleets, preferring coastal leverage and negotiated trade concessions over costly inland conquests."
 oe_ai3_balance_of_power_arbiter:0 "Balance-of-Power Arbiter"
 oe_ai3_balance_of_power_arbiter_desc:0 "This great power vigilantly counters overmighty continental hegemons through defensive alliances, disciplined diplomacy, and restrained coalition statecraft."
 oe_ai3_silk_road_unifier:0 "Silk Road Unifier"
 oe_ai3_silk_road_unifier_desc:0 "This continental power seeks to integrate trans-Eurasian caravan corridors, tributary crossroads, and imperial relay stations into a cohesive overland commercial sphere."
 STATIC_MODIFIER_NAME_oe_ai3_mod_diplomatic_entente:0 "Defensive Counter-Entente"
 STATIC_MODIFIER_DESC_oe_ai3_mod_diplomatic_entente:0 "Coordinated chanceries and reciprocal defense assurances expand diplomatic reach while steadying border garrisons."
 STATIC_MODIFIER_NAME_oe_ai3_mod_armed_neutrality:0 "Armed Strategic Neutrality"
 STATIC_MODIFIER_DESC_oe_ai3_mod_armed_neutrality:0 "Standing aloof from entangling blocs lowers war weariness and preserves domestic stability while keeping field formations vigilant."
 STATIC_MODIFIER_NAME_oe_ai3_mod_coalition_vanguard:0 "Balance-of-Power Coalition Vanguard"
 STATIC_MODIFIER_DESC_oe_ai3_mod_coalition_vanguard:0 "Mobilizing partner courts against an overmighty hegemon stiffens morale, strengthens alliance diplomacy, and lowers war exhaustion."
 STATIC_MODIFIER_NAME_oe_ai3_mod_congress_mediator:0 "Continental Congress Mediation"
 STATIC_MODIFIER_DESC_oe_ai3_mod_congress_mediator:0 "Hosting neutral diplomatic envoys raises international standing and improves relations across rival spheres at the cost of slower martial mobilization."
 STATIC_MODIFIER_NAME_oe_ai3_mod_industrial_catchup:0 "State Industrial Catch-Up Decree"
 STATIC_MODIFIER_DESC_oe_ai3_mod_industrial_catchup:0 "Crown subsidies for foreign metallurgists, model foundries, and technical schools accelerate institutional adoption while straining near-term tax efficiency."
 STATIC_MODIFIER_NAME_oe_ai3_mod_artisan_modernization:0 "Guild Patent & Workshop Charter"
 STATIC_MODIFIER_DESC_oe_ai3_mod_artisan_modernization:0 "Empowering urban guilds to adopt new machinery raises workshop productivity and burgher confidence without overburdening the state treasury."
 STATIC_MODIFIER_NAME_oe_ai3_mod_naval_arms_surge:0 "Admiralty Slipway Expansion"
 STATIC_MODIFIER_DESC_oe_ai3_mod_naval_arms_surge:0 "Emergency drydock quotas accelerate capital-ship construction and raise naval prestige while demanding tighter maritime upkeep."
 STATIC_MODIFIER_NAME_oe_ai3_mod_convoy_doctrine:0 "Convoy Escort & Sea-Lane Doctrine"
 STATIC_MODIFIER_DESC_oe_ai3_mod_convoy_doctrine:0 "Focusing admiralty budgets on disciplined escort squadrons and maritime patrols protects sea trade and trims fleet overhead."
 STATIC_MODIFIER_NAME_oe_ai3_mod_cipher_bureau:0 "Chancellery Black Chamber"
 STATIC_MODIFIER_DESC_oe_ai3_mod_cipher_bureau:0 "Dedicated cryptographers and courier inspections fortify counter-espionage while sharpening foreign diplomatic intelligence."
 STATIC_MODIFIER_NAME_oe_ai3_mod_envoy_prestige:0 "Open Ambassadorial Protocol"
 STATIC_MODIFIER_DESC_oe_ai3_mod_envoy_prestige:0 "Permanent accredited embassies cultivate foreign goodwill and cultural stature across rival courts."
 STATIC_MODIFIER_NAME_oe_ai3_mod_silk_road_compact:0 "Eurasian Post-Station & Caravan Compact"
 STATIC_MODIFIER_DESC_oe_ai3_mod_silk_road_compact:0 "Standardized waystations and relay escorts speed imperial dispatches and expand overland commercial throughput."
 STATIC_MODIFIER_NAME_oe_ai3_mod_customs_consolidation:0 "Overland Customs & Granary Consolidation"
 STATIC_MODIFIER_DESC_oe_ai3_mod_customs_consolidation:0 "Streamlined frontier tollhouses strengthen fiscal receipts and finance durable trunk infrastructure."
 STATIC_MODIFIER_NAME_oe_ai3_mod_open_navigation_charter:0 "International Canal & Strait Navigation Charter"
 STATIC_MODIFIER_DESC_oe_ai3_mod_open_navigation_charter:0 "Transparent transit dues attract global merchant fleets to our strategic waterways, amplifying commercial reach and diplomatic prestige."
 STATIC_MODIFIER_NAME_oe_ai3_mod_chokepoint_admiralty:0 "Fortified Choke-Point Admiralty"
 STATIC_MODIFIER_DESC_oe_ai3_mod_chokepoint_admiralty:0 "Coastal batteries, naval depots, and strict customs inspection turn strategic straits and canals into impregnable bastions."
 STATIC_MODIFIER_NAME_oe_ai3_mod_concert_protocol:0 "Multipolar Arbitration Protocol"
 STATIC_MODIFIER_DESC_oe_ai3_mod_concert_protocol:0 "Institutionalized summit diplomacy stabilizes great-power borders, promotes scholarly exchange, and restrains runaway war exhaustion."
 STATIC_MODIFIER_NAME_oe_ai3_mod_sovereign_deterrence:0 "Sovereign Deterrence Readiness"
 STATIC_MODIFIER_DESC_oe_ai3_mod_sovereign_deterrence:0 "Maintaining disciplined regulars and fortified frontier lines ensures our voice commands respect in any continental crisis."
 oe_ai3.1.t:0 "Great Power Diplomatic Realignment"
 oe_ai3.1.desc:0 "Envoys arriving from across Eurasia report rapid shifts among rival chanceries. Former adversaries are exchanging secret memoranda while new alliance blocs take shape along our borders. Our council must decide whether to anchor a coordinated defensive entente or maintain armed strategic neutrality."
 oe_ai3.1.a:0 "Forge a Defensive Counter-Entente"
 oe_ai3.1.b:0 "Maintain Armed Strategic Neutrality"
 oe_ai3.2.t:0 "Balance-of-Power Counter-Coalition"
 oe_ai3.2.desc:0 "An ascendant continental hegemon now commands vast swathes of territory, threatening to overturn the multipolar equilibrium of Eurasia. Nervous sovereigns look to our capital for leadership—either to rally a resolute counter-coalition vanguard or to convene a neutral congress to restrain further aggrandizement."
 oe_ai3.2.a:0 "Lead the Balance-of-Power Vanguard"
 oe_ai3.2.b:0 "Convene a Continental Mediation Congress"
 oe_ai3.3.t:0 "Industrial Catch-Up Charter"
 oe_ai3.3.desc:0 "Reports from neighboring markets reveal booming manufactories, mechanized mills, and precision metallurgy outpacing our traditional workshops. Our ministers propose either an ambitious crown-directed catch-up decree—recruiting foreign masters at fiscal expense—or empowering urban guilds with modern patent charters."
 oe_ai3.3.a:0 "Issue the Crown Industrial Catch-Up Decree"
 oe_ai3.3.b:0 "Grant Guild Patent Modernization Charters"
 oe_ai3.4.t:0 "The Oceanic Naval Arms Race"
 oe_ai3.4.desc:0 "Rival maritime admiralties are laying down heavier warships and fortifying coaling anchorages along our vital sea lanes. Our naval board urges an immediate strategic choice: accelerate capital-ship slipways to contest blue-water supremacy, or pivot to disciplined convoy escorts and commerce protection."
 oe_ai3.4.a:0 "Authorize an Admiralty Slipway Surge"
 oe_ai3.4.b:0 "Adopt Convoy Escort & Sea-Lane Doctrine"
 oe_ai3.5.t:0 "Chancellery Cipher & Intelligence Audit"
 oe_ai3.5.desc:0 "Intercepted diplomatic pouches confirm that rival courts have penetrated courier routes across the continent. Senior secretaries recommend either establishing a permanent Black Chamber to crack foreign ciphers or elevating open resident embassies to win diplomatic trust across neighboring realms."
 oe_ai3.5.a:0 "Establish the Chancellery Black Chamber"
 oe_ai3.5.b:0 "Expand Resident Ambassadorial Protocol"
 oe_ai3.6.t:0 "Continental Silk Road Caravan Compact"
 oe_ai3.6.desc:0 "Imperial cartographers and caravan syndicates have mapped an unbroken chain of relay posts, markets, and fortified passes linking our continental provinces. By standardizing transit law we can either launch a swift post-station commercial compact or consolidate frontier tollhouses to fortify state revenues."
 oe_ai3.6.a:0 "Ratify the Post-Station & Caravan Compact"
 oe_ai3.6.b:0 "Consolidate Frontier Customs & Infrastructure"
 oe_ai3.7.t:0 "Thalassocratic Strait & Canal Council"
 oe_ai3.7.desc:0 "Controlling vital maritime narrows and grand canal junctions places global commerce within our reach. Merchant syndicates press for a predictable international navigation charter to maximize tonnage, while admirals advocate fortifying every choke point under strict naval customs authority."
 oe_ai3.7.a:0 "Proclaim an Open International Navigation Charter"
 oe_ai3.7.b:0 "Fortify the Choke-Point Admiralty"
 oe_ai3.8.t:0 "Concert of Eurasia Strategic Assessment"
 oe_ai3.8.desc:0 "In an era of dense alliances, global commodity chains, and standing armies, reckless miscalculation can engulf whole continents in ruinous conflict. Senior statesmen present two pillars for the coming decade: institutionalizing multipolar summit arbitration or perfecting disciplined sovereign deterrence."
 oe_ai3.8.a:0 "Champion the Multipolar Arbitration Protocol"
 oe_ai3.8.b:0 "Perfect Sovereign Deterrence Readiness"
