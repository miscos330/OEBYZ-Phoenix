 STATIC_MODIFIER_NAME_oe_clim_nomad_winter_herd_mod:0 "Winter Pasture & Herd Sanctuary"
 STATIC_MODIFIER_DESC_oe_clim_nomad_winter_herd_mod:0 "Seasonal migration between sheltered winter valleys and summer steppes preserves mobile herds and army rations through brutal frosts."
 STATIC_MODIFIER_NAME_oe_clim_eternal_steppe_mod:0 "Great Steppe Khanate Mastery"
 STATIC_MODIFIER_DESC_oe_clim_eternal_steppe_mod:0 "Reaffirming the mobile ordu, horse relays, and winter campaign doctrine turns frost and vast grasslands into unbeatable strategic advantages."
 STATIC_MODIFIER_NAME_oe_clim_sedentary_gunpowder_mod:0 "Sedentarized Gunpowder Realm"
 STATIC_MODIFIER_DESC_oe_clim_sedentary_gunpowder_mod:0 "Settling tribal banners into walled cities, bronze foundries, and land cadastres transforms a nomadic host into a durable gunpowder monarchy."
 STATIC_MODIFIER_NAME_oe_clim_dzud_pasture_accord_mod:0 "Shared Winter Valley Accord"
 STATIC_MODIFIER_DESC_oe_clim_dzud_pasture_accord_mod:0 "Binding clan agreements apportion sheltered river valleys during dzud blizzards, minimizing livestock losses and tribal feuds."
 STATIC_MODIFIER_NAME_oe_clim_dzud_fodder_levy_mod:0 "Emergency Imperial Fodder Reserves"
 STATIC_MODIFIER_DESC_oe_clim_dzud_fodder_levy_mod:0 "Requisitioned hay depots along the yam relay roads keep warhorses combat-ready while testing pastoral patience."
 STATIC_MODIFIER_NAME_oe_clim_ilkhan_divan_cadastre_mod:0 "Persian Divan & Horse-Tax Cadastre"
 STATIC_MODIFIER_DESC_oe_clim_ilkhan_divan_cadastre_mod:0 "Bilingual Persian viziers register irrigated oases and pastoral dues under one balanced treasury ledger."
 STATIC_MODIFIER_NAME_oe_clim_ilkhan_noyan_tumens_mod:0 "Autonomous Noyan Cavalry Tumens"
 STATIC_MODIFIER_DESC_oe_clim_ilkhan_noyan_tumens_mod:0 "Preserving traditional nomadic iqta grazing rights keeps veteran cavalry commanders fiercely loyal on every border."
 STATIC_MODIFIER_NAME_oe_clim_yuan_horse_fairs_mod:0 "Frontier Horse-and-Tea Fairs"
 STATIC_MODIFIER_DESC_oe_clim_yuan_horse_fairs_mod:0 "Regulated border fairs exchange steppe mounts and pelts for grain, cloth, and iron cookware, enriching prince and merchant alike."
 STATIC_MODIFIER_NAME_oe_clim_yuan_yam_banners_mod:0 "Fortified Yam Relay & Banner Guards"
 STATIC_MODIFIER_DESC_oe_clim_yuan_yam_banners_mod:0 "Hardened post stations and mounted scouts tie distant steppe appanages together across snowbound passes."
 STATIC_MODIFIER_NAME_oe_clim_oirat_great_code_mod:0 "Great Pastoral Code of the Steppe"
 STATIC_MODIFIER_DESC_oe_clim_oirat_great_code_mod:0 "Written Mongol-Oirat statutes standardize pasture rotation, well upkeep, and blood-price arbitration across allied tribes."
 STATIC_MODIFIER_NAME_oe_clim_oasis_caravan_tolls_mod:0 "Protected Silk Oasis Caravanserais"
 STATIC_MODIFIER_DESC_oe_clim_oasis_caravan_tolls_mod:0 "Escorted camel trains along the Tarim and Transoxian corridors turn nomadic cavalry into lucrative transit guardians."
 STATIC_MODIFIER_NAME_oe_clim_lia_tax_remission_mod:0 "Little Ice Age Famine Tax Remission"
 STATIC_MODIFIER_DESC_oe_clim_lia_tax_remission_mod:0 "Suspending winter grain levies and forgiving peasant arrears prevents rural flight and rebellion during volcanic crop failures."
 STATIC_MODIFIER_NAME_oe_clim_lia_state_stockpiles_mod:0 "Emergency Crown Grain Stockpiles"
 STATIC_MODIFIER_DESC_oe_clim_lia_state_stockpiles_mod:0 "Centralized storehouses and strict export bans preserve winter grain rations for garrisons and urban bakers."
 STATIC_MODIFIER_NAME_oe_clim_ice_sled_convoys_mod:0 "Winter Sled & Ice-Breaker Logistics"
 STATIC_MODIFIER_DESC_oe_clim_ice_sled_convoys_mod:0 "Organizing horse-drawn sled convoys and iron-shod ice cutters keeps grain and timber moving when major rivers freeze solid."
 STATIC_MODIFIER_NAME_oe_clim_frost_fair_charter_mod:0 "Frost Fair Merchant Toll Relief"
 STATIC_MODIFIER_DESC_oe_clim_frost_fair_charter_mod:0 "Suspending frozen-port wharfage and licensing winter fairs on the ice cushions burgher losses through long winters."
 STATIC_MODIFIER_NAME_oe_clim_bread_assize_mod:0 "Regulated Bread Assize & Soup Kitchens"
 STATIC_MODIFIER_DESC_oe_clim_bread_assize_mod:0 "Municipal price ceilings and public soup kitchens calm hungry urban crowds during Little Ice Age harvest shortfalls."
 STATIC_MODIFIER_NAME_oe_clim_grain_requisition_mod:0 "Martial Grain Requisition Columns"
 STATIC_MODIFIER_DESC_oe_clim_grain_requisition_mod:0 "Armed commissaries seize hoarded rural barns to feed capital garrisons, preserving military order at the price of village bitterness."
 STATIC_MODIFIER_NAME_oe_clim_granary_relief_mod:0 "Ever-Normal Granary Market Relief"
 STATIC_MODIFIER_DESC_oe_clim_granary_relief_mod:0 "State treasurers actively buy surplus grain on regional markets and haul it into famine provinces, breaking winter starvation spirals."
 STATIC_MODIFIER_NAME_oe_clim_granary_private_guild_mod:0 "Chartered Grain-Factor Syndicates"
 STATIC_MODIFIER_DESC_oe_clim_granary_private_guild_mod:0 "Contracting private merchant factors to import grain at fixed margins eases treasury strain while revitalizing regional food trade."
 STATIC_MODIFIER_NAME_oe_clim_hydraulic_dikes_mod:0 "Imperial Dikes & Terrace Reservoirs"
 STATIC_MODIFIER_DESC_oe_clim_hydraulic_dikes_mod:0 "Stone river levees, silt-trapping canals, and upland irrigation terraces shield farmland from Little Ice Age floods and droughts."
 STATIC_MODIFIER_NAME_oe_clim_winter_forestry_mod:0 "Managed Fuelwood & Peat Commons"
 STATIC_MODIFIER_DESC_oe_clim_winter_forestry_mod:0 "Protected fuelwood coppices and peat ditches keep rural hearths and ironworks running through sub-zero winters."
 STATIC_MODIFIER_NAME_oe_clim_sweet_potato_relief_mod:0 "Fujian Sweet Potato & Upland Cultivation"
 STATIC_MODIFIER_DESC_oe_clim_sweet_potato_relief_mod:0 "Hardy sweet potato vines and maize thrive on sandy hills and poor ridges where rice fails, cushioning East Asia against Little Ice Age famines."
 STATIC_MODIFIER_NAME_oe_clim_nongzheng_manual_mod:0 "Printed Agrarian Treatises & Seed Bureaus"
 STATIC_MODIFIER_DESC_oe_clim_nongzheng_manual_mod:0 "Provincial magistrates distribute woodblock farming manuals and free starter tubers, accelerating agricultural literacy and rural tax yields."
 STATIC_MODIFIER_NAME_oe_clim_potato_revolution_mod:0 "Northern Potato Agrarian Revolution"
 STATIC_MODIFIER_DESC_oe_clim_potato_revolution_mod:0 "Subterranean frost-hardy potatoes survive short cold summers and marauding armies alike, tripling caloric yield per acre across northern soils."
 STATIC_MODIFIER_NAME_oe_clim_crown_potato_estates_mod:0 "Royal Model Farms & Seed Mandates"
 STATIC_MODIFIER_DESC_oe_clim_crown_potato_estates_mod:0 "Guarded royal test plots and estate seed quotas overcome peasant suspicion and quickly integrate tubers into village crop rotations."
 STATIC_MODIFIER_NAME_oe_clim_maize_expansion_mod:0 "Maize Harvests Across Highlands & Savannas"
 STATIC_MODIFIER_DESC_oe_clim_maize_expansion_mod:0 "Fast-maturing New World maize thrives across Anatolian plateaus, Balkan valleys, Indian uplands, and African savannas, anchoring rural resilience."
 STATIC_MODIFIER_NAME_oe_clim_maize_market_surplus_mod:0 "Commercial Maize & Livestock Fattening"
 STATIC_MODIFIER_DESC_oe_clim_maize_market_surplus_mod:0 "Abundant maize fodder expands draft-animal herds and meat markets, raising rural production efficiency and regional customs revenues."
 STATIC_MODIFIER_NAME_oe_clim_agrarian_boom_smallholders_mod:0 "Smallholder Demographic Renaissance"
 STATIC_MODIFIER_DESC_oe_clim_agrarian_boom_smallholders_mod:0 "Secure household food surpluses fuel steady village expansion, land reclamation, and sustained demographic recovery after the Little Ice Age."
 STATIC_MODIFIER_NAME_oe_clim_agrarian_boom_urban_mod:0 "Agro-Commercial Urban Expansion"
 STATIC_MODIFIER_DESC_oe_clim_agrarian_boom_urban_mod:0 "Cheap staple food frees rural labor for workshops, guilds, and coastal entrepots, accelerating urbanization and scholarly patronage."
 STATIC_MODIFIER_NAME_oe_clim_pox_highland_quarantine_mod:0 "Highland Sanctuary Cordon"
 STATIC_MODIFIER_DESC_oe_clim_pox_highland_quarantine_mod:0 "Sealing mountain passes and dispersing dense valley settlements slows virgin-soil smallpox at the expense of tribute collection."
 STATIC_MODIFIER_NAME_oe_clim_pox_communal_relief_mod:0 "Communal Herbal Care & Granary Doles"
 STATIC_MODIFIER_DESC_oe_clim_pox_communal_relief_mod:0 "Organized clan nursing, clean spring water, and shared maize stores prevent secondary starvation during smallpox waves."
 STATIC_MODIFIER_NAME_oe_clim_immunity_recovery_mod:0 "Herd Immunity & Demographic Renewal"
 STATIC_MODIFIER_DESC_oe_clim_immunity_recovery_mod:0 "Generations born after the first smallpox shock carry durable immunity, allowing rebuilt towns, terraces, and alliances to flourish anew."
 STATIC_MODIFIER_NAME_oe_clim_syncretic_medicine_mod:0 "Syncretic Botanical & Inoculation Guilds"
 STATIC_MODIFIER_DESC_oe_clim_syncretic_medicine_mod:0 "Combining indigenous botanical pharmacopoeia with variolation practices builds enduring institutional resistance to Old World fevers."
 STATIC_MODIFIER_NAME_oe_clim_cholera_port_cordon_mod:0 "Maritime Quarantine & Limewash Cordon"
 STATIC_MODIFIER_DESC_oe_clim_cholera_port_cordon_mod:0 "Detaining inbound steam and sail vessels while limewashing crowded dockside tenements slows cholera along maritime corridors."
 STATIC_MODIFIER_NAME_oe_clim_cholera_municipal_wards_mod:0 "Emergency Fever Wards & Boiled-Water Edicts"
 STATIC_MODIFIER_DESC_oe_clim_cholera_municipal_wards_mod:0 "Converting warehouses into cholera infirmaries and ordering boiled drinking water steadies industrial districts without shuttering ports."
 STATIC_MODIFIER_NAME_oe_clim_sanitary_waterworks_mod:0 "Modern Sanitary Sewers & Filtered Waterworks"
 STATIC_MODIFIER_DESC_oe_clim_sanitary_waterworks_mod:0 "Brick trunk sewers, sand-filtered water mains, and epidemiological well mapping permanently break waterborne cholera cycles in industrial cities."
 STATIC_MODIFIER_NAME_oe_clim_public_health_board_mod:0 "National Board of Public Hygiene"
 STATIC_MODIFIER_DESC_oe_clim_public_health_board_mod:0 "Permanent medical inspectors, quarantine treaties, and statistical mortality registries turn crisis lessons into modern public health administration."
 STATIC_MODIFIER_NAME_oe_clim_crop_acclimatization_mod:0 "State Botanical Acclimatization Nurseries"
 STATIC_MODIFIER_DESC_oe_clim_crop_acclimatization_mod:0 "Crown nurseries test foreign seeds across coastal and mountain climates, smoothing the first decade of New World crop adoption."
 oe_clim_virgin_soil_pox:0 "Columbian Virgin-Soil Smallpox"
 oe_clim_virgin_soil_pox_desc:0 "Introduced across the Atlantic into immunologically naive populations between 1510 and 1620, Virgin-Soil Smallpox sweeps dense coastal towns and valley polities before receding behind newly acquired generational immunity."
 oe_clim_virgin_soil_pox_location_modifier:0 "Virgin-Soil Smallpox Outbreak in [location|e]"
 oe_clim_industrial_cholera:0 "19th-Century Industrial Cholera"
 oe_clim_industrial_cholera_desc:0 "Traveling along steam-era shipping lanes and crowded industrial waterfronts between 1815 and 1836, waterborne cholera devastates unsanitary ports until filtered waterworks, brick sewers, and quarantine boards break its cycle."
 oe_clim_industrial_cholera_location_modifier:0 "Industrial Cholera Outbreak in [location|e]"
 oe_clim_choose_eternal_steppe_tt:0 "We reaffirm the #Y Great Steppe Khanate#! way, retaining mobile nomadic rule with unmatched winter and cavalry mastery."
 oe_clim_sedentarize_horde_tt:0 "Our nomadic army-state transitions cleanly into a #Y Landed Gunpowder Monarchy#! with modern taxation and artillery reforms."
 oe_clim_granary_buy_food_tt:0 "State treasurers purchase real staple grain from our capital's [market|e] and haul it straight into up to #Y 4#! starving or food-stressed [provinces|e]."
 oe_clim_dec_nomad_way.title:0 "Chart the Destiny of the Steppe Host"
 oe_clim_dec_nomad_way.desc:0 "As firearms, walled citadels, and harsh winters reshape Eurasia, our army-based khanate must decide its enduring destiny: double down on the Great Steppe Khanate's cavalry and winter mastery, or sedentarize cleanly into a landed gunpowder monarchy."
 oe_clim_dec_nomad_way.a:0 "Summon the Great Kurultai of Destiny"
 oe_clim_dec_nomad_way_tt:0 "Convenes the decisive #Y Crossroads of the Steppe#! council to choose between the Eternal Steppe Khanate and a Sedentarized Gunpowder Realm."
 oe_clim_dec_granary_market_relief.title:0 "Ever-Normal Granary Market Grain Relief"
 oe_clim_dec_granary_market_relief.desc:0 "When Little Ice Age frosts or harvest shortfalls tighten food supplies, crown commissioners can enter our capital market with hard coin to buy staple grain stocks and rush relief convoys to starving provinces."
 oe_clim_dec_granary_market_relief.a:0 "Purchase Market Grain & Relieve Provinces"
 oe_clim_dec_granary_market_relief_tt:0 "Buys regional staple grain directly from our capital [market|e] and replenishes food reserves in starving [provinces|e] (10-year cooldown)."
 oe_clim_dec_adopt_new_world_crops.title:0 "Sponsor Columbian New World Crops"
 oe_clim_dec_adopt_new_world_crops.desc:0 "Hardy American tubers and grains — sweet potato, potato, and maize — thrive on rocky ridges and cold uplands where Old World cereals wither. Sponsoring state nurseries and seed distribution can shield our realm from Little Ice Age famine."
 oe_clim_dec_adopt_new_world_crops.a:0 "Fund Seed Nurseries & Agrarian Manuals"
 oe_clim_dec_adopt_new_world_crops_tt:0 "Launches regional adoption of #Y Sweet Potato, Potato, or Maize#! across our rural provinces, permanently strengthening food resilience."
 oe_clim.1.title:0 "The Great Dzud: Ice Over the Winter Pastures"
 oe_clim.1.desc:0 "An iron crust of freezing rain has locked the steppe grass beneath impenetrable ice. Without coordinated winter valleys or emergency fodder depots along the relay stations, both tribal herds and our mounted banners face starvation before spring."
 oe_clim.1.a:0 "Open sheltered crown valleys to every loyal clan"
 oe_clim.1.b:0 "Levy emergency hay reserves strictly for the warhorse banners"
 oe_clim.2.title:0 "Crossroads of the Steppe: Eternal Yassa or Gunpowder Throne?"
 oe_clim.2.desc:0 "Envoys, bronze founders, and gray-bearded noyans crowd the khan's felt pavilion. One faction urges us to remain an unconquerable mobile army-state — masters of winter mobility and swift cavalry raids. Another points to walled cities, regular land taxes, and heavy artillery, urging us to settle the horde into a permanent gunpowder monarchy."
 oe_clim.2.a:0 "Remain the Great Steppe Khanate — the saddle is our throne!"
 oe_clim.2.b:0 "Sedentarize into a Landed Gunpowder Monarchy!"
 oe_clim.3.title:0 "Heirs of the Ilkhanate: Persian Divan or Nomadic Tumen?"
 oe_clim.3.desc:0 "Across the river plains of Iraq and the highlands of Persia, our nomadic garrisons rule over ancient irrigated cities and wealthy bazaars. Blending mobile steppe hosts with Persian financial administration could turn fragile warlord domains into an enduring imperial treasury."
 oe_clim.3.a:0 "Empower Persian viziers to compile a unified oasis-and-herd cadastre"
 oe_clim.3.b:0 "Confirm the noyans' traditional iqta grazing lands and cavalry autonomy"
 oe_clim.4.title:0 "Princes of the Eastern Banners: Horse Fairs & Yam Relays"
 oe_clim.4.desc:0 "The steppe princes guarding the northern approaches control vast pastures and vital relay roads linking China, Manchuria, and Mongolia. Trade caravans clamor for border horse-and-tea markets, while frontier commanders demand stronger mounted yam stations."
 oe_clim.4.a:0 "Charter seasonal horse-and-tea fairs along the southern passes"
 oe_clim.4.b:0 "Fortify the yam post roads and expand the princely keshig scouts"
 oe_clim.5.title:0 "The Great Pastoral Code & Caravan Roads of Inner Asia"
 oe_clim.5.desc:0 "Across the Tianshan passes, the Altai meadows, and the Kipchak grasslands, rival clans dispute seasonal wells and oasis toll rights. Codifying one Great Pastoral Law — or turning our horsemen into salaried escorts for Silk Road caravans — will anchor the steppe economy for a generation."
 oe_clim.5.a:0 "Proclaim the Great Pastoral Code across all allied uluses"
 oe_clim.5.b:0 "Guarantee armed escorts and caravanserais along the oasis roads"
 oe_clim.6.title:0 "Ash in the Sun: Volcanic Winters of the Little Ice Age"
 oe_clim.6.desc:0 "A pale copper haze dims the summer sun across the hemisphere, bringing killing June frosts, failed grain harvests, and endless snowstorms. Astronomers speak of distant volcanic eruptions; provincial governors warn that empty barns and unpaid taxes threaten widespread revolt."
 oe_clim.6.a:0 "Remit winter grain taxes and grant immediate peasant relief"
 oe_clim.6.b:0 "Ban grain exports and build centralized crown winter stockpiles"
 oe_clim.7.title:0 "Frozen Rivers & Frost Fairs on the Ice"
 oe_clim.7.desc:0 "Great arterial rivers, canals, and narrow straits have frozen thick enough to bear loaded wagons. Grain barges lie trapped in river ice for months, paralyzing waterborne supply lines even as daring citizens erect winter booths across the frozen channels."
 oe_clim.7.a:0 "Organize imperial sled convoys and iron-shod ice-breaker crews"
 oe_clim.7.b:0 "Waive frozen-port wharfage and charter regulated winter frost fairs"
 oe_clim.8.title:0 "The Great Grain Crisis & Bread Riots"
 oe_clim.8.desc:0 "After consecutive frost-blighted harvests, bread prices have tripled in crowded urban quarters. Hungry crowds besiege bakeries and grain warehouses, demanding the crown either buy grain on regional markets for subsidized relief or seize hoarded estates by force."
 oe_clim.8.a:0 "Buy market grain immediately and enforce a subsidized bread assize"
 oe_clim.8.b:0 "Dispatch armed commissaries to requisition hoarded provincial grain"
 oe_clim.9.title:0 "Ever-Normal Granaries: Cross-Market Grain Procurement"
 oe_clim.9.desc:0 "Our treasury commissioners have turned paper granary statutes into real logistics: buying bulk staple grain directly on regional markets with hard silver, loading fleets and wagon trains, and pouring real food into starving provinces before famine can depopulate them."
 oe_clim.9.a:0 "Direct state procurement straight from the capital market into famine provinces"
 oe_clim.9.b:0 "License merchant grain factors to run bonded cross-regional relief convoys"
 oe_clim.10.title:0 "Hydraulic Works, Stone Dikes & Upland Reservoirs"
 oe_clim.10.desc:0 "The Little Ice Age brings erratic extremes — scorching droughts alternating with glacial meltwater floods. Engineers and agronomists propose investing heavily in stone river embankments, silt-trapping canals, and managed fuelwood commons so our heartland can weather decades of harsh climate."
 oe_clim.10.a:0 "Fund stone river dikes, drainage canals, and terraced reservoirs"
 oe_clim.10.b:0 "Establish managed fuelwood coppices and peat ditches for winter heat"
 oe_clim.11.title:0 "Golden Roots from Manila: Sweet Potato & Maize in the East"
 oe_clim.11.desc:0 "Maritime merchants returning from Luzon have smuggled hardy sweet potato vines woven inside ship ropes, alongside sacks of golden American maize. On steep coastal hills and sandy terraces where rice seedlings perish in cold droughts, these golden roots produce astonishing harvests."
 oe_clim.11.a:0 "Distribute sweet potato vines across upland villages to end famine"
 oe_clim.11.b:0 "Print imperial agrarian manuals promoting maize and crop rotation"
 oe_clim.12.title:0 "Tubers Beneath the Frost: The Northern Potato Revolution"
 oe_clim.12.desc:0 "Once dismissed as an exotic botanical curiosity, the humble Andean potato has revealed its true worth under the freezing skies of northern Eurasia. Growing safely underground out of reach of late frosts and foraging cavalry, a single acre of tubers feeds three times as many mouths as rye or oats."
 oe_clim.12.a:0 "Encourage free peasant potato cultivation across every northern shire"
 oe_clim.12.b:0 "Guard royal demonstration plots and mandate estate seed quotas"
 oe_clim.13.title:0 "Golden Cob of the Drylands: Maize Across Valleys & Savannas"
 oe_clim.13.desc:0 "From Anatolian and Balkan hillsides to the Nile, Deccan plateaus, and West African savannas, New World maize has taken root with breathtaking speed. Ripening quickly between erratic rains, its tall stalks provide both staple meal for villages and rich fodder for cattle and horses."
 oe_clim.13.a:0 "Expand smallholder maize terraces across dry and mountainous provinces"
 oe_clim.13.b:0 "Link commercial maize surpluses to livestock fattening and town markets"
 oe_clim.14.title:0 "The Columbian Agrarian Boom & Demographic Equilibrium"
 oe_clim.14.desc:0 "Decades after New World tubers and maize entered our fields, the shadow of cyclical Little Ice Age famine is lifting. Granaries stand fuller, villages are expanding into once-barren uplands, and affordable food is unlocking new waves of urban craft and commerce."
 oe_clim.14.a:0 "Protect rural smallholders and invest surplus into steady demographic growth"
 oe_clim.14.b:0 "Channel cheap food surpluses into urban workshops and port commerce"
 oe_clim.15.title:0 "The Silent Fire: Virgin-Soil Smallpox Sweeps the Americas"
 oe_clim.15.desc:0 "Carried ashore by transatlantic contact, an unfamiliar pox burns through communities that have never known Old World fevers. Whole lineages fall sick at once, threatening harvests and civic order unless chiefs and councils enforce immediate isolation and mutual aid."
 oe_clim.15.a:0 "Seal mountain passes and disperse valley towns into highland sanctuaries"
 oe_clim.15.b:0 "Organize clan herbal nursing and open communal maize stores for the sick"
 oe_clim.16.title:0 "Survivors of the Storm: Acquired Immunity & Renewal"
 oe_clim.16.desc:0 "After a bitter generation of grief, the silent fire no longer burns unchecked. Children born to survivors resist the pox far better than their grandparents could, while communities weave ancestral botanical remedies with hard-won quarantine lore to rebuild thriving towns."
 oe_clim.16.a:0 "Celebrate demographic renewal and resettle abandoned valley terraces"
 oe_clim.16.b:0 "Endow syncretic medical guilds uniting botanical lore and inoculation"
 oe_clim.17.title:0 "The Blue Death at the Wharves: Industrial Cholera"
 oe_clim.17.desc:0 "Fast merchant vessels and crowded factory waterfronts have carried a terrifying waterborne pestilence across the seas. Victims dehydrate within hours in packed tenement lanes around contaminated wells, forcing port authorities to choose between harsh maritime lockdowns and massive municipal relief."
 oe_clim.17.a:0 "Impose strict maritime quarantine and limewash dockside tenements"
 oe_clim.17.b:0 "Open emergency fever infirmaries and enforce boiled-water edicts"
 oe_clim.18.title:0 "Clean Water & Brick Sewers: Modern Sanitary Reform"
 oe_clim.18.desc:0 "Painstaking maps of cholera deaths have revealed the invisible culprit: tainted urban water pumps and open cesspools. Forward-looking engineers and physicians now present ambitious plans for filtered water mains, deep brick trunk sewers, and permanent boards of public hygiene."
 oe_clim.18.a:0 "Build modern brick trunk sewers and sand-filtered municipal waterworks"
 oe_clim.18.b:0 "Establish a permanent National Board of Public Hygiene and maritime treaties"
