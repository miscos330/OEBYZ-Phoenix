l_english:
 oe_osmaris_belisarius_name: "Belisarius"
 oe_osmaris_fatih_name: "Fatih"
 oe_osmaris_fatih_trait: "Fatih"
 oe_osmaris_fatih_trait_desc: "The Conqueror. A vision in the storm at Varna convinced him that his destiny lay beneath a military standard, far from the counting house. His army gains discipline, morale and siege ability. He can always command units; permanent lifespan and Military Ability bonuses are supplied by Fatih’s Destiny."
 STATIC_MODIFIER_NAME_oe_osmaris_fatih_personal: "Fatih’s Destiny"
 STATIC_MODIFIER_DESC_oe_osmaris_fatih_personal: "Life Expectancy increases by 45 years and Military Ability by 30, and he can always command units. These personal benefits remain active during childhood and while he holds no military command."
 oe_flavor_byz.1014.t: "Echoes of Varna"
 oe_flavor_byz.1014.d: "(Mehmed II)\n\nOn 11 November 1444, the young Belisarius rode past Varna with his family’s merchant caravan. After nightfall the sea wind rose and rain poured down. Strange fires appeared across the plain. Amid the thunder came horns and pounding hooves, and a battle seemed to return from some ancient age before his eyes.\n\nThrough the rain he could just discern Poland’s royal banner with its white eagle. Opposite it flew the familiar red standard of Osmaris, bearing a golden crescent and star. Spears clashed, while fallen riders and horses vanished into the mist. In the centre sat a commander in splendid armour, glittering with gold and silver. The face was older, but unmistakably his own.\n\nAnother flash of lightning erased the banners, the ranks and the commander. Only the caravan’s frightened cries remained. Thereafter Belisarius could scarcely bring himself to open a cargo ledger. He took that night for an omen and resolved to follow his forebear Manuel into military service.\n\n“I have seen my standard. It belongs above an army.”"
 oe_flavor_byz.1014.a: "The destined conqueror."
 oe_flavor_byz.1014.a.tt: "Belisarius gains the Fatih trait and a permanent personal modifier:\nLife Expectancy #G +45 years#! and Military Ability #G +30#!.\nAlways able to command units.\nWhile commanding an army: Discipline #G +10%#!, Army Morale #G +20%#! and Siege Ability #G +50%#!.\nIf Osmaris is already a great house, Influence increases by #G 50#!. Otherwise it becomes a great house and the house limit increases by #G 1#!."
 oe_flavor_byz.1014.lapsed: "The echoes in the storm are lost to us."
 oe_flavor_byz.1014.lapsed.tt: "The character or family’s circumstances have changed. No trait or reward is granted."
 oe_flavor_byz.1014.historical_info: "The historical Mehmed II (1432–1481), son of Murad II, twice ruled as Ottoman sultan. His capture of Constantinople in 1453 earned him the epithet Fatih, the Conqueror. Belisarius, the vision at Varna and his service to the Eastern Roman Empire are fictional elements of this alternate history."
