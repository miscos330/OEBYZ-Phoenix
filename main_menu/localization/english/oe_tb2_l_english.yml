 oe_tb2_none: "\nNo theme needs a change now."
 oe_tb2.1.t: "Set the Themes as Advised"
 oe_tb2.1.d: "These themes will change as advised:[ROOT.GetCountry.Custom('OeTb2Slot1')][ROOT.GetCountry.Custom('OeTb2Slot2')][ROOT.GetCountry.Custom('OeTb2Slot3')][ROOT.GetCountry.Custom('OeTb2Slot4')][ROOT.GetCountry.Custom('OeTb2Slot5')][ROOT.GetCountry.Custom('OeTb2Slot6')][ROOT.GetCountry.Custom('OeTb2Slot7')][ROOT.GetCountry.Custom('OeTb2Slot8')][ROOT.GetCountry.Custom('OeTb2Slot9')][ROOT.GetCountry.Custom('OeTb2Slot10')][ROOT.GetCountry.Custom('OeTb2Slot11')][ROOT.GetCountry.Custom('OeTb2Slot12')][ROOT.GetCountry.Custom('OeTb2More')]\n\nCourse changes: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_c').GetValue|0]#!, costing #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_cost_c')|0]#! [oe_tu_authority|e] (now [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_auth_now')|0]); [Concept('oe_tu_pronoia','pronoia')|e] grants: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_p').GetValue|0]#!, at no authority cost.\n\nThe advice is the AI empire's own rule: for themes whose strategos is at least 'steady' and whose course is not in its #Y 5#!-year cooldown, a [Concept('oe_tu_march','march')|e] takes the army course, a coastal heartland the naval course (naval themes at most a third of all themes), an inland heartland the civil course; when the law allows pronoia, army marches and [Concept('oe_tu_exarchate','exarchates')|e] whose finances are not run from the capital take pronoia grants. Each course change costs #R 5#! Imperial Authority; when it runs out the rest stay as they are, and the list shows only what can be paid."
 oe_tb2.1.a: "Do as advised"
 oe_tb2.1.a.tt: "The listed themes change course (#R 5#! [oe_tu_authority|e] each; no further change for #Y 5#! years) or take [Concept('oe_tu_pronoia','pronoia')|e] grants (no change to the officials for #Y 2#! years). The changes follow one by one at once."
 oe_tb2.1.b: "Leave them as they are"
 oe_tb2.2.t: "The Marches Together"
 oe_tb2.2.d: "Marches whose castles can be repaired: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_n')|0]#!, #R 100#! gold each, [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_cost')|0] gold for all;\n[Concept('oe_tu_march','marches')|e] that can raise border troops: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_n')|0]#!, #R 50#! gold each, [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_cost')|0] gold for all.\nThe treasury holds [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_gold')|0] gold.\n\nEach march gets exactly what the single military edict gives, at the same cost and cooldown. When the money runs short they are served one by one from the highest border pressure down, until it is spent."
 oe_tb2.2.fortify: "Repair the castles of every march"
 oe_tb2.2.fortify.tt: "Every [Concept('oe_tu_march','march')|e] that may is served as by Repair the Castles, #R 100#! gold each, from the highest border pressure down until the money is spent."
 oe_tb2.2.levy: "Raise border troops in every march"
 oe_tb2.2.levy.tt: "Every [Concept('oe_tu_march','march')|e] that may is served as by Raise Border Troops, #R 50#! gold each, from the highest border pressure down until the money is spent."
 oe_tb2.2.c: "Do nothing"
 oe_tb2.9.t: "Theme bulk orders: carry out"
 OE_TB2_BTN_ADVISE: "Set as Advised"
 OE_TB2_BTN_ADVISE_DESC: "Lists the themes that would change and asks before changing them. The advice is the AI empire's own rule: for themes whose strategos is at least 'steady' and whose course is not in its #Y 5#!-year cooldown, a [Concept('oe_tu_march','march')|e] takes the army course, a coastal heartland the naval course (naval themes at most a third of all themes), an inland heartland the civil course; when the law allows [Concept('oe_tu_pronoia','pronoia')|e], army marches and [Concept('oe_tu_exarchate','exarchates')|e] whose finances are not run from the capital take pronoia grants. Each course change costs #R 5#! [oe_tu_authority|e]; grants cost none. When the button is off: no theme needs a change, or authority is under #Y 5#! and no theme can take grants, or the last round is not finished."
 OE_TB2_BTN_MARCHES: "Marches Together"
 OE_TB2_BTN_MARCHES_DESC: "Repair the castles (#R 100#! gold each) or raise border troops (#R 50#! gold each) in every [Concept('oe_tu_march','march')|e] at once; the counts and the total are shown first. When the button is off: no march can be repaired or levied."
 oe_tb2_mg_btn_on: "#G Managed#!"
 oe_tb2_mg_btn_off: "Manage"
 oe_tb2_mg_st_wait: "\n\n#G Managed.#! Handled every January; nothing handled yet."
 oe_tb2_mg_st_on: "\n\n#G Managed.#! January [Country.MakeScope.GetVariable('oe_tb2_t_y').GetValue|0]: course changes #Y [Country.MakeScope.GetVariable('oe_tb2_t_c').GetValue|0]#!, grants #Y [Country.MakeScope.GetVariable('oe_tb2_t_p').GetValue|0]#!, castles repaired #Y [Country.MakeScope.GetVariable('oe_tb2_t_f').GetValue|0]#!, border troops #Y [Country.MakeScope.GetVariable('oe_tb2_t_l').GetValue|0]#!; works begun this year #Y [Country.MakeScope.GetVariable('oe_tb2_t_w').GetValue|0]#!; strategos: [Country.Custom('OeTb2MgGen')]."
 oe_tb2_mg_st_off: "\n\nNot managed."
 oe_tb2_mg_st_cd: "\n\n#R Taken back less than 12 months ago; it cannot be managed again yet.#!"
 oe_tb2_mg_st_revolt: "\n\n#R The theme is in revolt and cannot be managed.#!"
 oe_tb2_mg_g0: "no change needed"
 oe_tb2_mg_g1: "a man of a great house took over"
 oe_tb2_mg_g2: "#R due but not replaced: no great house is the emperor's ally, or it has no suitable man#!"
 oe_tb2_mg_g3: "#R due but not replaced: Imperial Authority under 8#!"
 oe_tb2_mg_g4: "#R due but not replaced: the chosen man could not take over (no authority spent)#!"
 oe_tb2_sum_year: "Managed: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_mg_n')|0]#! themes; this January #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_c').GetValue|0]#! course changes, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_p').GetValue|0]#! grants, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_g').GetValue|0]#! new strategoi, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_f').GetValue|0]#! castles, #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_l').GetValue|0]#! border levies; #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_s_w').GetValue|0]#! works begun this year."
 oe_tb2_sum_wait: "Managed: #Y [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_mg_n')|0]#! themes, handled every January."
 oe_tb2_sum_none: "Managed: none."
 OE_TB2_BTN_MANAGE: "[Country.Custom('OeTb2MgBtn')]"
 OE_TB2_BTN_MANAGE_DESC: "Managed: leave this theme to its strategos. Every January the AI empire's own rules are applied for you: a course change (the rule of Set as Advised, #R 5#! [oe_tu_authority|e] each, none while authority is under #Y 25#!); [Concept('oe_tu_pronoia','pronoia')|e] grants for army [Concept('oe_tu_march','marches')|e] and [Concept('oe_tu_exarchate','exarchates')|e] when the law allows; a strategos with loyalty under #Y 40#! and #Y 5#! years in office (not in a despotate) is replaced by a man of the great house allied to the emperor (#R 3#! Imperial Authority, none while authority is under #Y 8#!); a march with border pressure #Y 40#! has its castles repaired when the treasury holds #Y 300#! gold, and raises border troops at pressure #Y 60#! when it holds #Y 150#! (usual costs); a theme idle for #Y 12#! months starts works with its own money.\nA managed theme is no longer drawn for theme stories, regional stories or border events; 'The Front Moves' makes it a march and 'The Border Is Quiet' restores the heartland at once, as the AI empire answers them.  After 20 years of pronoia it is not asked either: the grants become hereditary, the AI empire's most common answer. Revolt warnings, usurpation, campaign summons and [oe_tu_senate|e] votes still come to you.\nPrice: military efficiency #R −5#!; once themes remit to the crown, a managed theme's share is #Y 10#! points lower (the strategos keeps a part). It can be taken back at any time; after that it cannot be managed again for #Y 12#! months.[Country.Custom('OeTb2MgState')]"
 OE_TB2_BTN_MANAGE_ALL: "Managed Themes"
 OE_TB2_BTN_MANAGE_ALL_DESC: "Manage every theme or take every one back (one at a time: the Manage button on each card). When the button is off: no theme can be managed and none is."
 OE_TB2_SUM_LINE: "[GetCountry('BYZ').Custom('OeTb2Sum')]"
 OE_TB2_SUM_TT: "Every January the AI empire's own rules are applied for you: a course change (the rule of Set as Advised, #R 5#! [oe_tu_authority|e] each, none while authority is under #Y 25#!); [Concept('oe_tu_pronoia','pronoia')|e] grants for army [Concept('oe_tu_march','marches')|e] and [Concept('oe_tu_exarchate','exarchates')|e] when the law allows; a strategos with loyalty under #Y 40#! and #Y 5#! years in office (not in a despotate) is replaced by a man of the great house allied to the emperor (#R 3#! Imperial Authority, none while authority is under #Y 8#!); a march with border pressure #Y 40#! has its castles repaired when the treasury holds #Y 300#! gold, and raises border troops at pressure #Y 60#! when it holds #Y 150#! (usual costs); a theme idle for #Y 12#! months starts works with its own money.\nA managed theme is no longer drawn for theme stories, regional stories or border events; 'The Front Moves' makes it a march and 'The Border Is Quiet' restores the heartland at once, as the AI empire answers them.  After 20 years of pronoia it is not asked either: the grants become hereditary, the AI empire's most common answer. Revolt warnings, usurpation, campaign summons and [oe_tu_senate|e] votes still come to you.\nPrice: military efficiency #R −5#!; once themes remit to the crown, a managed theme's share is #Y 10#! points lower (the strategos keeps a part). It can be taken back at any time; after that it cannot be managed again for #Y 12#! months."
 oe_tb2.3.t: "Managed Themes"
 oe_tb2.3.d: "Themes that can be managed now: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_mg_can_n')|0]#!; managed already: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_mg_n')|0]#!.\n\nEvery January the AI empire's own rules are applied for you: a course change (the rule of Set as Advised, #R 5#! [oe_tu_authority|e] each, none while authority is under #Y 25#!); [Concept('oe_tu_pronoia','pronoia')|e] grants for army [Concept('oe_tu_march','marches')|e] and [Concept('oe_tu_exarchate','exarchates')|e] when the law allows; a strategos with loyalty under #Y 40#! and #Y 5#! years in office (not in a despotate) is replaced by a man of the great house allied to the emperor (#R 3#! Imperial Authority, none while authority is under #Y 8#!); a march with border pressure #Y 40#! has its castles repaired when the treasury holds #Y 300#! gold, and raises border troops at pressure #Y 60#! when it holds #Y 150#! (usual costs); a theme idle for #Y 12#! months starts works with its own money.\nA managed theme is no longer drawn for theme stories, regional stories or border events; 'The Front Moves' makes it a march and 'The Border Is Quiet' restores the heartland at once, as the AI empire answers them.  After 20 years of pronoia it is not asked either: the grants become hereditary, the AI empire's most common answer. Revolt warnings, usurpation, campaign summons and [oe_tu_senate|e] votes still come to you.\nPrice: military efficiency #R −5#!; once themes remit to the crown, a managed theme's share is #Y 10#! points lower (the strategos keeps a part). It can be taken back at any time; after that it cannot be managed again for #Y 12#! months.\n\nUnlike Set as Advised, which is pressed once, lists the changes first and covers course and grants only, a managed theme is handled every year without asking. The rules are the AI empire's, applied only to the themes you choose."
 oe_tb2.3.a: "Manage them all"
 oe_tb2.3.a.tt: "Every theme that can be managed is: military efficiency #R −5#!, handled every January as above."
 oe_tb2.3.b: "Take them all back"
 oe_tb2.3.b.tt: "Every managed theme is taken back; none can be managed again for #Y 12#! months."
 oe_tb2.3.c: "Leave it as it is"
