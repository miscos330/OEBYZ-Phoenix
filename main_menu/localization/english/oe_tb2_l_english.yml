 oe_tb2.1.t: "Set the Themes as Advised"
 oe_tb2.1.d: "These themes will change as advised:[ROOT.GetCountry.Custom('OeTb2Slot1')][ROOT.GetCountry.Custom('OeTb2Slot2')][ROOT.GetCountry.Custom('OeTb2Slot3')][ROOT.GetCountry.Custom('OeTb2Slot4')][ROOT.GetCountry.Custom('OeTb2Slot5')][ROOT.GetCountry.Custom('OeTb2Slot6')][ROOT.GetCountry.Custom('OeTb2Slot7')][ROOT.GetCountry.Custom('OeTb2Slot8')][ROOT.GetCountry.Custom('OeTb2Slot9')][ROOT.GetCountry.Custom('OeTb2Slot10')][ROOT.GetCountry.Custom('OeTb2Slot11')][ROOT.GetCountry.Custom('OeTb2Slot12')][ROOT.GetCountry.Custom('OeTb2More')]\n\nCourse changes: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_c').GetValue|0]#!, costing #R [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_cost_c')|0]#! [oe_tu_authority|e] (now [GetCountry('BYZ').MakeScope.ScriptValue('oe_tb2_auth_now')|0]); [Concept('oe_tu_pronoia','pronoia')|e] grants: #Y [GetCountry('BYZ').MakeScope.GetVariable('oe_tb2_n_p').GetValue|0]#!, at no authority cost.\n\nThe advice is the AI empire's own rule: for themes whose strategos is at least 'steady' and whose course is not in its #Y 5#!-year cooldown, a [Concept('oe_tu_march','march')|e] takes the army course, a coastal heartland the naval course (naval themes at most a third of all themes), an inland heartland the civil course; when the law allows pronoia, army marches and [Concept('oe_tu_exarchate','exarchates')|e] whose finances are not run from the capital take pronoia grants. Each course change costs #R 5#! Imperial Authority; when it runs out the rest stay as they are, and the list shows only what can be paid."
 oe_tb2.1.a: "Do as advised"
 oe_tb2.1.a.tt: "The listed themes change course (#R 5#! [oe_tu_authority|e] each; no further change for #Y 5#! years) or take [Concept('oe_tu_pronoia','pronoia')|e] grants (no change to the officials for #Y 2#! years). The changes follow one by one at once."
 oe_tb2.1.b: "Leave them as they are"
 oe_tb2.2.t: "The Marches Together"
 oe_tb2.2.d: "Marches whose castles can be repaired: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_n')|0]#!, #R 100#! gold each, [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_fort_cost')|0] gold for all;\n[Concept('oe_tu_march','marches')|e] that can raise border troops: #Y [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_n')|0]#!, #R 50#! gold each, [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_levy_cost')|0] gold for all.\nThe treasury holds [ROOT.GetCountry.MakeScope.ScriptValue('oe_tb2_gold')|0] gold.\n\nEach march gets exactly what the single military edict gives, at the same cost and cooldown. When the money runs short they are served one by one from the highest border pressure down, until it is spent."
 oe_tb2.2.fortify: "Repair the castles of every march"
 oe_tb2.2.fortify.tt: "Every [Concept('oe_tu_march','march')|e] that may is served as by Repair the Castles, #R 100#! gold each, from the highest border pressure down until the money is spent."
 oe_tb2.2.levy: "Raise border troops in every march"
 oe_tb2.2.levy.tt: "Every [Concept('oe_tu_march','march')|e] that may is served as by Raise Border Troops, #R 50#! gold each, from the highest border pressure down until the money is spent."
 oe_tb2.2.c: "Do nothing"
 oe_tb2.9.t: "Theme bulk orders: carry out"
 OE_TB2_BTN_ADVISE: "Set as Advised"
 OE_TB2_BTN_ADVISE_DESC: "Lists the themes that would change and asks before changing them. The advice is the AI empire's own rule: for themes whose strategos is at least 'steady' and whose course is not in its #Y 5#!-year cooldown, a [Concept('oe_tu_march','march')|e] takes the army course, a coastal heartland the naval course (naval themes at most a third of all themes), an inland heartland the civil course; when the law allows [Concept('oe_tu_pronoia','pronoia')|e], army marches and [Concept('oe_tu_exarchate','exarchates')|e] whose finances are not run from the capital take pronoia grants. Each course change costs #R 5#! [oe_tu_authority|e]; grants cost none. When the button is off: no theme needs a change, or authority is under #Y 5#! and no theme can take grants, or the last round is not finished."
 OE_TB2_BTN_MARCHES: "Marches Together"
 OE_TB2_BTN_MARCHES_DESC: "Repair the castles (#R 100#! gold each) or raise border troops (#R 50#! gold each) in every [Concept('oe_tu_march','march')|e] at once; the counts and the total are shown first. When the button is off: no march can be repaired or levied."
