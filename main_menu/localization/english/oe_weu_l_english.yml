l_english:
 oe_weu_b_holy_league_hostile: "Anti-Roman Holy League Hostility"
 oe_weu_b_lily_accord: "Twin-Eagle & Lily Anti-Habsburg Accord"
 oe_weu_b_gallic_betrayal: "Betrayal of Gaul: Alpine Rupture"
 oe_weu_b_anglo_maritime: "Anglo-Byzantine Maritime Commerce Treaty"
 oe_weu_b_lowlands_credit: "Amsterdam Credit & Shipping Compact"
 oe_weu_b_ecumenical_detente: "Ecumenical Toleration Detente"
 STATIC_MODIFIER_NAME_oe_weu_atlantic_diversion: "Cape of Good Hope Crisis: Mediterranean Trade Diversion"
 STATIC_MODIFIER_DESC_oe_weu_atlantic_diversion: "Atlantic oceanic voyages around the Cape siphon spice and silk revenues away from traditional Mediterranean ports, eroding customs and merchant power until countered."
 STATIC_MODIFIER_NAME_oe_weu_western_embargo_mod: "Anti-Roman Holy League Trade Embargo"
 STATIC_MODIFIER_DESC_oe_weu_western_embargo_mod: "Western Catholic courts coordinate port embargoes and diplomatic isolation against resurgent Rome; active diplomacy with France, England, or ecumenical compromise can shatter it."
 STATIC_MODIFIER_NAME_oe_weu_crusade_pressure_mod: "Atlantic-Imperial Grand Coalition Pressure"
 STATIC_MODIFIER_DESC_oe_weu_crusade_pressure_mod: "At peak cohesion, the Western Holy League forces full imperial mobilization across land and sea, inflating upkeep and isolating Constantinople diplomatically."
 STATIC_MODIFIER_NAME_oe_weu_league_member_mod: "Anti-Roman Holy League Defense Compact"
 STATIC_MODIFIER_DESC_oe_weu_league_member_mod: "Coalition members pool garrisons and fleets to hold the Alps and Western Mediterranean, raising morale and fortifications at steep military upkeep."
 STATIC_MODIFIER_NAME_oe_weu_gallic_mobilization: "Gallic Patriotic Mobilization"
 STATIC_MODIFIER_DESC_oe_weu_gallic_mobilization: "Eastern Roman encroachment into Lyon and Gaul shatters the Lily Accord and ignites nationwide French resistance, surging morale, discipline, and levies at fiscal cost."
 STATIC_MODIFIER_NAME_oe_weu_alpine_watch_mod: "Alpine Passes Frontier Watch"
 STATIC_MODIFIER_DESC_oe_weu_alpine_watch_mod: "Fortifying Lombard passes and stationing standing legions deters Western intervention, lifting discipline and defenses while raising army maintenance."
 STATIC_MODIFIER_NAME_oe_weu_diplomatic_wedge_mod: "Western Diplomatic Wedge Network"
 STATIC_MODIFIER_DESC_oe_weu_diplomatic_wedge_mod: "Secret envoys and subsidies across Paris, London, and Amsterdam fracture Western unity, boosting diplomatic reputation and trade reach at recurring fiscal cost."
 STATIC_MODIFIER_NAME_oe_weu_lily_accord_mod: "Twin-Eagle & Lily Anti-Habsburg Accord"
 STATIC_MODIFIER_DESC_oe_weu_lily_accord_mod: "Constantinople and Paris pledge mutual restraint at the Alps and shared Mediterranean commerce against Habsburg encirclement, trading imperial prestige for diplomatic leverage."
 STATIC_MODIFIER_NAME_oe_weu_gaul_ambition_mod: "Transalpine Western Campaign Doctrine"
 STATIC_MODIFIER_DESC_oe_weu_gaul_ambition_mod: "Refusing any treaty bound at the Alps readies imperial legions to reclaim Gaul and Iberia, sharpening combat power while provoking Western hostility and steep upkeep."
 STATIC_MODIFIER_NAME_oe_weu_habsburg_containment_mod: "Vienna-Madrid Containment Axis"
 STATIC_MODIFIER_DESC_oe_weu_habsburg_containment_mod: "Vienna and Madrid coordinate Danube and Mediterranean garrisons to contain Eastern Roman expansion, raising discipline and prestige at heavier military upkeep."
 STATIC_MODIFIER_NAME_oe_weu_danube_bastion_mod: "Danube-Adriatic Dual Bastion"
 STATIC_MODIFIER_DESC_oe_weu_danube_bastion_mod: "Deep fortifications across the middle Danube and northern Italy blunt Habsburg pressure, strengthening defense and morale at higher army upkeep."
 STATIC_MODIFIER_NAME_oe_weu_anglo_maritime_mod: "Anglo-Byzantine Maritime Commerce Treaty"
 STATIC_MODIFIER_DESC_oe_weu_anglo_maritime_mod: "Mutual port charters between London and Constantinople challenge Iberian maritime monopoly, lifting trade income and naval morale alongside heavier fleet upkeep."
 STATIC_MODIFIER_NAME_oe_weu_med_corsair_check_mod: "Western Mediterranean Standing Escort Fleet"
 STATIC_MODIFIER_DESC_oe_weu_med_corsair_check_mod: "Imperial squadrons independently patrol Sicilian and Gibraltar sea-lanes, speeding shipbuilding and raising naval morale at steep maintenance cost."
 STATIC_MODIFIER_NAME_oe_weu_lowlands_arbitrage_mod: "Amsterdam Credit & Lowlands Arbitrage"
 STATIC_MODIFIER_DESC_oe_weu_lowlands_arbitrage_mod: "Lowlands shipping and bourse credit bypass Catholic embargoes and speed institution spread, trading customs revenue and clerical goodwill for commercial vitality."
 STATIC_MODIFIER_NAME_oe_weu_imperial_customs_wall: "Imperial Customs Wall & State Monopoly"
 STATIC_MODIFIER_DESC_oe_weu_imperial_customs_wall: "Retaliatory port duties tighten fiscal control and direct taxes while dampening commercial volume and frustrating burgher guilds."
 STATIC_MODIFIER_NAME_oe_weu_ecumenical_detente_mod: "Western Ecumenical Toleration Edict"
 STATIC_MODIFIER_DESC_oe_weu_ecumenical_detente_mod: "Extending liturgical toleration undercuts Western crusade rhetoric and lifts diplomacy, at the sharp price of domestic clerical discontent and stability strain."
 STATIC_MODIFIER_NAME_oe_weu_orthodox_bulwark_mod: "Bulwark of Uncompromising Orthodoxy"
 STATIC_MODIFIER_DESC_oe_weu_orthodox_bulwark_mod: "Rejecting doctrinal concessions rallies Orthodox fervor and battlefield morale while hardening diplomatic hostility across Western Christendom."
 STATIC_MODIFIER_NAME_oe_weu_silver_shock_mod: "Atlantic Silver Price Revolution"
 STATIC_MODIFIER_DESC_oe_weu_silver_shock_mod: "New World bullion flooding from Iberian ports fuels Mediterranean inflation and erodes fixed taxes even as commercial turnover rises."
 STATIC_MODIFIER_NAME_oe_weu_nomisma_stabilization_mod: "Nomisma Gold Stabilization Reform"
 STATIC_MODIFIER_DESC_oe_weu_nomisma_stabilization_mod: "Recoining pure gold nomismata and instituting treasury reserves curbs silver inflation and secures taxes at the price of tight credit for merchants."
 STATIC_MODIFIER_NAME_oe_weu_suez_transit_boom: "Mediterranean Counter-Offensive: Suez Transit Boom"
 STATIC_MODIFIER_DESC_oe_weu_suez_transit_boom: "Combining Trajan's Canal or the Silk Road Twin Phoenix with the Roman Company reclaims East-West commerce and harvests Suez transit dues, funded by heavy fleet and garrison upkeep."
 STATIC_MODIFIER_NAME_oe_weu_grand_armada_defense: "Imperial Total Defense Against the Holy League"
 STATIC_MODIFIER_DESC_oe_weu_grand_armada_defense: "Full mobilization of legions and fleets steels discipline and morale against the Grand Western Coalition at punishing military maintenance."
 STATIC_MODIFIER_NAME_oe_weu_two_seas_concert: "Concert of the Two Seas"
 STATIC_MODIFIER_DESC_oe_weu_two_seas_concert: "A negotiated equilibrium between Atlantic and Mediterranean powers anchors lasting trade and diplomatic standing while tempering unilateral expansion."
 STATIC_MODIFIER_NAME_oe_weu_mare_nostrum_hegemon: "Mare Nostrum Hegemony: Defying the Atlantic"
 STATIC_MODIFIER_DESC_oe_weu_mare_nostrum_hegemon: "Unchallenged legions and fleets compel Atlantic rivals to accept Roman mastery over Mediterranean and Suez lanes, at perpetual diplomatic and naval upkeep cost."
 STATIC_MODIFIER_NAME_oe_weu_tordesillas_boom: "Tordesillas Atlantic Shipping Monopoly"
 STATIC_MODIFIER_DESC_oe_weu_tordesillas_boom: "Oceanic carracks and Atlantic accords channel colonial spice and silver wealth homeward, expanding trade income and reach while taxing naval upkeep."
 STATIC_MODIFIER_NAME_oe_weu_suez_customs_loc: "Suez-Mediterranean Transit Customs House"
 STATIC_MODIFIER_DESC_oe_weu_suez_customs_loc: "Imperial customs halls and bullion vaults channeling Red Sea and Mediterranean cargoes into steady transit wealth."
 STATIC_MODIFIER_NAME_oe_weu_alpine_fort_loc: "Alpine-Italian Frontier Bastion"
 STATIC_MODIFIER_DESC_oe_weu_alpine_fort_loc: "Trace-italienne bastions and legion depots guarding the northern Italian passes against Holy League incursions."
 STATIC_MODIFIER_NAME_oe_weu_atlantic_entrepot_loc: "Mediterranean Oceanic Entrepot Docks"
 STATIC_MODIFIER_DESC_oe_weu_atlantic_entrepot_loc: "Deep-water drydocks and bonded warehouses refitted for oceanic galleons and Mediterranean convoy escorts."
 oe_weu_dec_franco_accord.title: "Sign the Twin-Eagle & Lily Secret Accord"
 oe_weu_dec_franco_accord.desc: "With Habsburg and Iberian powers encircling France, pledge restraint at the Alps and shared Mediterranean commerce to peel Paris out of the Anti-Roman Holy League. Warning: touching Lyon or Gaul shatters the pact immediately!"
 oe_weu_dec_franco_accord.a: "Seal the Twin-Eagle & Lily Accord"
 oe_weu_dec_anglo_maritime.title: "Sign the Anglo-Byzantine Maritime Treaty"
 oe_weu_dec_anglo_maritime.desc: "Grant mutual port charters with England or Great Britain to challenge Iberian Atlantic monopoly and peel London away from the Holy League."
 oe_weu_dec_anglo_maritime.a: "Ratify the Anglo-Byzantine Maritime Treaty"
 oe_weu_dec_ecumenical_detente.title: "Issue the Western Ecumenical Detente Edict"
 oe_weu_dec_ecumenical_detente.desc: "Extend liturgical toleration to undercut Western crusade rhetoric (stronger when backed by Ecclesia concordat or unionist dialogue), at the cost of domestic clerical resentment."
 oe_weu_dec_ecumenical_detente.a: "Promulgate the Ecumenical Detente Edict"
 oe_weu_dec_med_counteroffensive.title: "Launch the Mediterranean Trade Counter-Offensive"
 oe_weu_dec_med_counteroffensive.desc: "Leverage Trajan's Canal or the Silk Road Twin Phoenix together with the Roman Company to shatter the Cape of Good Hope diversion and harvest Suez transit gold!"
 oe_weu_dec_med_counteroffensive.a: "Unleash the Mediterranean Trade Counter-Offensive!"
 oe_weu_cab_divide_league: "Divide the Anti-Roman Holy League"
 oe_weu_cab_divide_league_desc: "Dispatches court envoys and secret agents across Paris, London, and the Lowlands to lift diplomatic reputation and merchant reach while eroding coalition unity; trade-off: lower tax and stability efficiency."
 oe_weu_cab_divide_league_action: "$oe_weu_cab_divide_league$"
 oe_weu_cab_divide_league_active: "Dividing the Anti-Roman Holy League"
 oe_weu_cab_divide_league_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('diplomatic_reputation')]"
 oe_weu_cab_divide_league_action_progress_wordier: "Divide the Anti-Roman Holy League"
 oe_weu_cab_divide_league_action_progress_long_wordier: "Divide the Anti-Roman Holy League"
 oe_weu_cab_divide_league_action_progress_tooltip: "Dispatches court envoys and secret agents across Paris, London, and the Lowlands to lift diplomatic reputation and merchant reach while eroding coalition unity; trade-off: lower tax and stability efficiency."
 oe_weu_cab_med_convoy: "Escort Mediterranean–Suez Trade Convoys"
 oe_weu_cab_med_convoy_desc: "Coordinates imperial squadrons and Company convoys across Suez and Western Mediterranean lanes, raising trade income, naval morale, and maritime presence; trade-off: higher naval and army upkeep."
 oe_weu_cab_med_convoy_action: "$oe_weu_cab_med_convoy$"
 oe_weu_cab_med_convoy_active: "Escorting Mediterranean–Suez Convoys"
 oe_weu_cab_med_convoy_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('trade_income')]"
 oe_weu_cab_med_convoy_action_progress_wordier: "Escort Mediterranean–Suez Trade Convoys"
 oe_weu_cab_med_convoy_action_progress_long_wordier: "Escort Mediterranean–Suez Trade Convoys"
 oe_weu_cab_med_convoy_action_progress_tooltip: "Coordinates imperial squadrons and Company convoys across Suez and Western Mediterranean lanes, raising trade income, naval morale, and maritime presence; trade-off: higher naval and army upkeep."
 oe_weu.1.t: "Alarm Beyond the Alps: The Anti-Roman Holy League"
 oe_weu.1.d: "As imperial standards return to Italy and western reconquest gathers pace, courts in Paris, Vienna, Toledo, Lisbon, and London sound the alarm. Envoys race across the Alps calling for an Anti-Roman Holy League of joint defense and commercial embargoes.\n\nYet Western Christendom is far from united—Habsburgs fear France, while England and the Lowlands resent Iberian monopoly. We may deploy diplomatic wedges, fortify the Alpine passes, or offer measured concessions."
 oe_weu.1.a: "Dispatch secret envoys to exploit rivalries and fracture the Holy League"
 oe_weu.1.a.tt: "Costs #R 160 gold#!; gain [ShowModifier('oe_weu_diplomatic_wedge_mod')] for #Y 25 years#! and reduce #bold #color_yellow Holy League Cohesion#!#!."
 oe_weu.1.b: "Fortify the Alpine approaches and deter the League with standing legions"
 oe_weu.1.b.tt: "Costs #R 200 gold#!, Army Tradition #G +8#!, fortifies Milan/Rome and grants [ShowModifier('oe_weu_alpine_watch_mod')] for #Y 25 years#! (hardens Western hostility)."
 oe_weu.1.c: "Proclaim diplomatic restraint at the Alps to cool Western alarm"
 oe_weu.1.c.tt: "Costs #R 120 gold#!, Prestige #R −12#!; softens Western hostility and recalculates #bold #color_yellow Holy League Level#!#!."
 oe_weu.2.t: "Charlemagne and Constantine: The Twin-Eagle & Lily Accord"
 oe_weu.2.d: "Encircled by Habsburg and Iberian power from Vienna to Madrid, the French court sends a clandestine envoy to Constantinople proposing the Twin-Eagle & Lily Accord.\n\nIf Rome pledges not to cross the Alps into Lyon or Gaul, France will break away from the Anti-Roman Holy League, share Western Mediterranean commerce, and pin down the Habsburgs—yet any future intrusion into Gaul will shatter the pact and ignite Gallic patriotic mobilization."
 oe_weu.2.a: "Sign the Twin-Eagle & Lily Accord to peel France from the Holy League"
 oe_weu.2.a.tt: "Costs #R 160 gold#!; signs bilateral accord with France, grants [ShowModifier('oe_weu_lily_accord_mod')] (#Y 35 years#!), and sharply cuts #bold #color_yellow Holy League Cohesion#!#! (breaks instantly if Gaul is touched!)."
 oe_weu.2.b: "Refuse any pledge at the Alps—Gaul remains Caesar's ancient province"
 oe_weu.2.b.tt: "Prestige #G +10#!, Army Tradition #G +6#!; gain [ShowModifier('oe_weu_gaul_ambition_mod')] for #Y 25 years#! without peeling France."
 oe_weu.3.t: "Iron Curtain of Vienna and Madrid: Habsburg Encirclement"
 oe_weu.3.d: "Alarmed by Roman advances, Vienna and the Iberian crowns of Toledo and Madrid coordinate a two-front containment axis: Imperial troops mass along the upper Danube while Iberian squadrons patrol Tyrrhenian waters.\n\nShall we fund a formidable Danube-Adriatic bastion to blunt their pincer, or rely on covert diplomacy to pry their coalition apart?"
 oe_weu.3.a: "Fund the Danube-Adriatic Dual Bastion to blunt Habsburg pressure"
 oe_weu.3.a.tt: "Costs #R 220 gold#!, Army Tradition #G +8#!; fortifies northern Italy and grants [ShowModifier('oe_weu_danube_bastion_mod')] for #Y 30 years#!."
 oe_weu.3.b: "Subsidize rival courts and electors to loosen the encirclement from within"
 oe_weu.3.b.tt: "Costs #R 150 gold#!, Prestige #R −6#!; gain [ShowModifier('oe_weu_diplomatic_wedge_mod')] for #Y 25 years#!."
 oe_weu.4.t: "Rupture of the Lily Pact: Gallic Patriotic Mobilization"
 oe_weu.4.d: "Word that imperial troops have crossed into Lyon and Gaul detonates across Paris! Outraged by the breach of the Twin-Eagle & Lily Accord, the French crown tears up the treaty, proclaims Gallic Patriotic Mobilization, and rejoins the Anti-Roman Holy League in force.\n\nWith Western cohesion surging, we must press our transalpine campaign with steel or dig in along the Alpine wall."
 oe_weu.4.a: "If the pact is dead, settle Gaul by steel under a transalpine campaign!"
 oe_weu.4.a.tt: "Lily Accord breaks; France gains [ShowModifier('oe_weu_gallic_mobilization')] (#Y 25 years#!) and League cohesion spikes. Costs #R 180 gold#!, Army Tradition #G +8#!; gain [ShowModifier('oe_weu_gaul_ambition_mod')]."
 oe_weu.4.b: "Hold the Alpine passes rather than marching deeper into France"
 oe_weu.4.b.tt: "Lily Accord breaks and France mobilizes; Prestige #R −10#!, Stability #G +4#!; gain [ShowModifier('oe_weu_alpine_watch_mod')] for #Y 20 years#!."
 oe_weu.5.t: "Tordesillas and the Cape of Good Hope Diversion"
 oe_weu.5.d: "Oceanic carracks out of Lisbon and Iberian ports now round the Cape of Good Hope laden with eastern spices and colonial silver under the Atlantic order of Tordesillas. Customs receipts in Alexandria, Venice, and Constantinople sag as commerce shifts westward.\n\nTreasury clerks warn that only a Mediterranean Trade Counter-Offensive—anchored by Trajan's Canal or the Silk Road Twin Phoenix together with the Roman Company—can permanently break the Cape diversion."
 oe_weu.5.a: "Expand Mediterranean entrepot docks and prepare for a trade counter-offensive"
 oe_weu.5.a.tt: "Suffer [ShowModifier('oe_weu_atlantic_diversion')] (#Y 40 years#!, removable via Counter-Offensive decision); costs #R 150 gold#! and upgrades imperial entrepot docks."
 oe_weu.5.b: "Erect an imperial customs wall to offset lost transit revenues"
 oe_weu.5.b.tt: "Suffer [ShowModifier('oe_weu_atlantic_diversion')] (#Y 35 years#!); costs #R 120 gold#! and grants [ShowModifier('oe_weu_imperial_customs_wall')] for #Y 25 years#!."
 oe_weu.6.t: "Thames and Golden Horn: Anglo-Byzantine Maritime Treaty"
 oe_weu.6.d: "Iberian monopoly across the Atlantic grates on London's merchants and Admiralty no less than on Constantinople. Envoys from the Thames propose an Anglo-Byzantine Maritime Commerce Treaty: reciprocal port privileges in the Levant in exchange for England breaking with the Anti-Roman Holy League and contesting Iberian sea-lanes.\n\nShall we ratify this oceanic partnership or rely solely on our own Mediterranean escort squadrons?"
 oe_weu.6.a: "Sign the Anglo-Byzantine Maritime Treaty to break Iberian monopoly"
 oe_weu.6.a.tt: "Costs #R 180 gold#!; ratifies bilateral maritime treaty with England/Britain, grants [ShowModifier('oe_weu_anglo_maritime_mod')] (#Y 35 years#!), and peels London from the Holy League."
 oe_weu.6.b: "Decline English privileges and expand our own Western Mediterranean fleet"
 oe_weu.6.b.tt: "Costs #R 200 gold#!, Navy Tradition #G +10#!; upgrades entrepot docks and grants [ShowModifier('oe_weu_med_corsair_check_mod')] for #Y 30 years#!."
 oe_weu.7.t: "Amsterdam Bourse: Lowlands Credit and Embargo"
 oe_weu.7.d: "Amsterdam and the Lowlands have risen as northern Europe's premier shipping and credit nexus. Even as Catholic leagues preach embargo, pragmatic Dutch and Lowlands merchants offer Constantinople cargo fleets, maritime insurance, and bourse credit in exchange for Levantine trading rights.\n\nEmbracing Lowlands arbitrage pierces the blockade and speeds institutions, though traditional clergy frown on foreign financiers."
 oe_weu.7.a: "Partner with Amsterdam bourse credit and Lowlands shipping to bypass the embargo"
 oe_weu.7.a.tt: "Costs #R 140 gold#!, mild Clergy anger; improves Lowlands ties and grants [ShowModifier('oe_weu_lowlands_arbitrage_mod')] for #Y 30 years#!."
 oe_weu.7.b: "Maintain imperial customs walls and keep foreign syndicates out"
 oe_weu.7.b.tt: "Costs #R 100 gold#!, mild Burghers anger; gain [ShowModifier('oe_weu_imperial_customs_wall')] for #Y 30 years#!."
 oe_weu.8.t: "Ecumenical Conciliation: Splitting the Holy League"
 oe_weu.8.d: "Much of the Anti-Roman Holy League's cohesion rests on portraying Eastern Rome as a schismatic threat to Latin Christendom. Court and Patriarchate debate whether to issue an Ecumenical Toleration Edict—especially potent if our Church policy already leans toward concordat or unionist dialogue—to undercut Western crusade fervor at the cost of domestic clerical anger."
 oe_weu.8.a: "Issue the Western Ecumenical Detente Edict to undercut League unity"
 oe_weu.8.a.tt: "Costs #R 140 gold#!, Clergy anger; gain [ShowModifier('oe_weu_ecumenical_detente_mod')] (#Y 30 years#!) and slash #bold #color_yellow Holy League Cohesion#!#! (stronger with Ecclesia concordat/unionist foundation)."
 oe_weu.8.b: "Raise the Bulwark of Orthodoxy and refuse any doctrinal compromise"
 oe_weu.8.b.tt: "Stability #G +4#!, Religious Influence #G +15#!, Clergy pleased; gain [ShowModifier('oe_weu_orthodox_bulwark_mod')] for #Y 30 years#!."
 oe_weu.9.t: "Atlantic Silver Flood and Western Sea-Lanes"
 oe_weu.9.d: "Shipments of American silver pouring through Iberian ports spill into Italian and Aegean markets, triggering a Mediterranean Price Revolution. Inflation erodes fixed tax assessments while rival squadrons clash along western sea-lanes.\n\nTreasury officials propose either a disciplined Nomisma Gold Stabilization reform to arrest inflation, or taxing the silver inflow for immediate war funds."
 oe_weu.9.a: "Enact the Nomisma Gold Stabilization reform to curb silver inflation"
 oe_weu.9.a.tt: "Costs #R 200 gold#!, Stability #R −2#!, mild Burghers anger; gain [ShowModifier('oe_weu_nomisma_stabilization_mod')] for #Y 30 years#!."
 oe_weu.9.b: "Tax the silver flood for immediate treasury bullion and accept inflation"
 oe_weu.9.b.tt: "Gain #G +180 gold#! immediately, but suffer [ShowModifier('oe_weu_silver_shock_mod')] for #Y 25 years#!."
 oe_weu.10.t: "Mediterranean Counter-Offensive: Suez & Silk Road Triumph"
 oe_weu.10.d: "Years of strategic investment now hand Constantinople the master key to break the Cape of Good Hope diversion! With Trajan's Canal or the Silk Road Twin Phoenix linked directly into the Roman Company's network, eastern spice and silk fleets no longer need the perilous southern voyage around Africa.\n\nLaunching the Mediterranean Trade Counter-Offensive erases Atlantic trade diversion and turns Suez transit into an imperial treasury engine."
 oe_weu.10.a: "Launch the Mediterranean Trade Counter-Offensive and levy Suez transit dues!"
 oe_weu.10.a.tt: "Invests #R 250 gold#! in customs infrastructure (collecting #G +350 gold#! initial transit dues), clears [ShowModifier('oe_weu_atlantic_diversion')], upgrades Suez/Alexandria customs, and grants [ShowModifier('oe_weu_suez_transit_boom')] for #Y 40 years#!."
 oe_weu.10.b: "Defer grand customs overhaul and reinforce Mediterranean escort squadrons"
 oe_weu.10.b.tt: "Costs #R 120 gold#!, Navy Tradition #G +8#!; gain [ShowModifier('oe_weu_med_corsair_check_mod')] for #Y 25 years#! (Counter-Offensive decision remains available)."
 oe_weu.11.t: "Atlantic-Imperial Grand Mobilization: League Ascendant"
 oe_weu.11.d: "War drums echo across Western Europe as the Anti-Roman Holy League escalates into a grand Atlantic-Imperial coalition. Habsburg artillery trains and Iberian armadas converge toward Italy and the western sea-lanes for a decisive reckoning.\n\nWill the Empire rally legions and fleets in total defense, or launch an emergency diplomatic offensive to bleed away League cohesion?"
 oe_weu.11.a: "Activate Imperial Total Defense and break the Holy League by force of arms!"
 oe_weu.11.a.tt: "Costs #R 280 gold#!, Army Tradition #G +12#!, Navy Tradition #G +10#!; fortifies northern Italy and grants [ShowModifier('oe_weu_grand_armada_defense')] for #Y 30 years#!."
 oe_weu.11.b: "Rush emergency subsidies and envoys to split the coalition before war erupts"
 oe_weu.11.b.tt: "Costs #R 220 gold#!, Prestige #R −10#!; eases Western hostility and grants [ShowModifier('oe_weu_diplomatic_wedge_mod')] for #Y 30 years#!."
 oe_weu.12.t: "Equilibrium of Two Seas: The Western Order Settled"
 oe_weu.12.d: "Three centuries of Alpine standoffs, covert pacts in Paris and London, and oceanic rivalry between Suez and the Cape have reached their verdict. Western powers can no longer ignore the enduring reality: New Rome stands unbroken at the maritime heart of Eurasia.\n\nAt the threshold of the modern world order, the throne must seal its western legacy—either proclaiming ironclad Mare Nostrum hegemony against the Atlantic, or ratifying a prosperous Concert of the Two Seas."
 oe_weu.12.a: "Proclaim Mare Nostrum hegemony and compel the Atlantic powers to yield"
 oe_weu.12.a.tt: "Costs #R 220 gold#!, Prestige #G +20#!; lifts embargo pressure, grants [ShowModifier('oe_weu_mare_nostrum_hegemon')] for #Y 40 years#!, and completes the line."
 oe_weu.12.b: "Ratify the Concert of the Two Seas for enduring diplomatic and commercial balance"
 oe_weu.12.b.tt: "Costs #R 180 gold#!, Stability #G +6#!; lifts embargo, softens Western ties, grants [ShowModifier('oe_weu_two_seas_concert')] for #Y 40 years#!, and completes the line."
