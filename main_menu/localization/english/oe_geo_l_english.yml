 oe_geo.5.a: "Settle on the Georgian match"
 oe_geo.5.a.tt: "Georgia: opinion of the empire #G +20#! for #Y 20#! years\nThe bridal ships will sail in nine to fifteen months"
 oe_geo.5.b: "Seek a princess of Trebizond instead"
 oe_geo.5.b.tt: "Trebizond: opinion of the empire #G +25#! for #Y 20#! years\nIf the empire already has a standing in Trebizond: influence #G +10#!\nGeorgia: opinion of the empire #R −10#! for #Y 5#! years\nThe bridal ships will sail in nine to fifteen months"
 oe_geo.5.c: "The emperor will not marry again"
 oe_geo.5.c.tt: "The matter of a bride is set aside"
 oe_geo.6.t: "The Bridal Ships"
 oe_geo.6.desc_lgs: "#F The envoy went back and forth between the courts of Trebizond and Georgia over the date and the gifts. In Georgia the groom's family paid; this time it was the bride's side that promised money. In September 1451 the envoy came home with Georgian envoys, and it was agreed to go for the bride the next spring.#!\n\nNow the times are against it: the empire is at war with the Ottomans, or the City is under siege, and the bridal ships cannot put to sea."
 oe_geo.6.desc_lgg: "#F The envoy went back and forth between the courts of Trebizond and Georgia over the date and the gifts. In Georgia the groom's family paid; this time it was the bride's side that promised money. In September 1451 the envoy came home with Georgian envoys, and it was agreed to go for the bride the next spring.#!\n\nNow the bridal ships wait in the Golden Horn, but the one on the throne can no longer take this bride: already married, or not fit to marry."
 oe_geo.6.desc_lgn: "#F The envoy went back and forth between the courts of Trebizond and Georgia over the date and the gifts. In Georgia the groom's family paid; this time it was the bride's side that promised money. In September 1451 the envoy came home with Georgian envoys, and it was agreed to go for the bride the next spring.#!\n\nNow the bridal ships wait in the Golden Horn, but at the court of [GetCountry('GEO').GetName] there is no unmarried princess of an age to make the journey."
 oe_geo.6.desc_lgr: "#F The envoy went back and forth between the courts of Trebizond and Georgia over the date and the gifts. In Georgia the groom's family paid; this time it was the bride's side that promised money. In September 1451 the envoy came home with Georgian envoys, and it was agreed to go for the bride the next spring.#!\n\nNow the bridal ships wait in the Golden Horn. At the court of [GetCountry('GEO').GetName], [GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetFirstNameWithNoTooltip] (aged [GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetAgeInYears]) is ready for the journey, waiting only for the ships of Emperor [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]. By the agreement, the king will send the gifts with the bride."
