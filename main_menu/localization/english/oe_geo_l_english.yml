 oe_geo.3.t: "The Fall of Tbilisi"
 oe_geo.3.desc_bpk: "#F The khan of the north raided northern Iran, and Timur at once marched west into the Caucasus. In late November 1386 Tbilisi fell; King Bagrat V of Georgia was taken sword in hand and brought before the conqueror together with Queen Anna and their young son. The king feigned conversion, and Timur sent troops to escort the king home; it is said that Prince George ambushed the escort, ten thousand strong and more, in a mountain pass and destroyed it, and so the king went free.#!\n\nNow the King of [GetCountry('GEO').GetName] is home again, but Tbilisi lies in ruins. Clergy who escaped have brought the news to the capital. The queen is kin whom our own embassy acknowledged. The empire itself bows to the sultan these days, and many at court would rather not stir."
