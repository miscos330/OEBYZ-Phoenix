 oe_geo.5.t: "The Envoy Goes East"
 oe_geo.5.desc_lrt: "#F In the autumn of 1449 the new emperor, Constantine XI, sent a trusted courtier, George Sphrantzes, east with clergy, nobles, musicians and soldiers, to find a bride at Trebizond or in Georgia; both of the emperor's wives had died. In February 1451 the envoy heard at Trebizond that Sultan Murad II was dead, and for a while urged a match with the sultan's widow, the Serbian princess Mara, who would not marry again. In the end the envoy chose the Georgian princess. In Georgia it was the groom's family that paid; the envoy asked for a dowry all the same, and it is said that the king agreed to give 56,000 ducats, jewels and robes, and 3,000 ducats a year besides.#!\n\nNow Emperor [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip] has not married again. Word has come from the East: the King of [GetCountry('GEO').GetName] is willing to send a princess to the capital. Some at court would rather seek a princess of Trebizond. The two courts have long been close; the match comes naturally."
