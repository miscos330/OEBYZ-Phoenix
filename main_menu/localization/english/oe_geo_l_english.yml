 oe_geo.6.a: "Bring the Georgian bride to the City"
 oe_geo.6.a.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetFirstNameWithNoTooltip] moves to Constantinople and marries Emperor [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]\nGain #G 6#! months of trade and tax income\nThe empire gains [ShowModifier('oe_geo_dowry')] for #Y 10#! years: tax efficiency #G +2%#!, monthly prestige #G +0.05#!\nGeorgia: opinion of the empire #G +30#! for #Y 20#! years\nGeorgia will remember this"
 oe_geo.6.b: "Bring the bride from Trebizond to the City"
 oe_geo.6.b.tt: "[GetCountry('BYZ').MakeScope.GetVariable('oe_geo_bride_c').GetCharacter.GetFirstNameWithNoTooltip] moves to Constantinople and marries Emperor [GetCountry('BYZ').GetGovernment.GetRuler.GetFirstNameWithNoTooltip]\nThe empire gains [ShowModifier('oe_geo_pontic_bride')] for #Y 10#! years: monthly prestige #G +0.05#!\nTrebizond: opinion of the empire #G +30#! for #Y 20#! years"
 oe_geo.6.c: "Take the gifts now and settle the date later"
