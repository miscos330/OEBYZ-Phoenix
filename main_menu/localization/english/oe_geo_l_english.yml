 oe_geo.1.t: "The Two Brotherhoods of Iviron"
 oe_geo.1.desc_a: "#F At the end of the tenth century two Georgian monks founded the monastery of Iviron on the Holy Mountain (Athos), and the kings and nobles of Georgia endowed it generation after generation. In time it held two brotherhoods, a Greek and a Georgian one; by the middle of the thirteenth century a Greek abbot already signed for the whole house.#!\n\nNow the Greek monks of the house have petitioned the patriarch to give the monastery into Greek hands and to hold the liturgy in Greek; the Georgian monks answer that Georgians built it. The King of [GetCountry('GEO').GetName] has sent to ask after the matter as well. The Holy Mountain is under the empire, and what the patriarch signs will be carried out there."
 oe_geo.1.desc_x: "#F At the end of the tenth century two Georgian monks founded the monastery of Iviron on the Holy Mountain (Athos), and the kings and nobles of Georgia endowed it generation after generation. In time it held two brotherhoods, a Greek and a Georgian one; by the middle of the thirteenth century a Greek abbot already signed for the whole house.#!\n\nNow the Greek monks of the house have petitioned the patriarch to give the monastery into Greek hands and to hold the liturgy in Greek; the Georgian monks answer that Georgians built it. The King of [GetCountry('GEO').GetName] has sent to ask after the matter as well. The Holy Mountain is no longer in the empire's hands, but its monasteries still answer to the patriarch."
 oe_geo.1.a: "Let the patriarch sign as the Greek brotherhood asks"
 oe_geo.1.a.tt: "[Concept('oe_tu_patriarchate','patriarchal standing')|e] #G +2#!\nShares of the [Concept('oe_tu_church_parties','church parties')|e]: Hesychasts #Y +2#!\nGeorgia: opinion of the empire #R −15#! for #Y 10#! years"
 oe_geo.1.b: "Let the two brotherhoods take turns, and keep the Georgian liturgy"
