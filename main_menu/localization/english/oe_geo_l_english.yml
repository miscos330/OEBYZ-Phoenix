 oe_geo.2.t: "A Kantakouzene Granddaughter in Tbilisi"
 oe_geo.2.desc_rk: "#F Anna, the eldest daughter of Emperor Alexios III of Trebizond, was born to Theodora of the house of Kantakouzenos. In the spring of 1362 an embassy from Trebizond came to Constantinople to treat for a marriage between the princess and the emperor's eldest son, and nothing came of it. In June 1367 Anna, ten years old, was married to King Bagrat V of Georgia; the Emperor of Trebizond and the bride's grandmother escorted the princess there in person. The king's first queen had also come from Trebizond, and had died of the plague the year before.#!\n\nNow news of the wedding has reached the capital: [GetCountry('GEO').GetName] and Trebizond are bound by marriage, and two royal houses of our faith on the eastern shore of the Black Sea stand together. The court of Trebizond is an old friend of ours, and something of this match reflects on the empire too. It is a happy day for the house of Kantakouzenos as well. Some at court propose to send an embassy with good wishes."
