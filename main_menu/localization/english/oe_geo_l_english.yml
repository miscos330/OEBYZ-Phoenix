 oe_geo.1.c: "Ask the King of Georgia to pay for the repairs, in return for one chapel that keeps the old rite"
 oe_geo.1.c.tt: "Gain #G 1#! month of trade and tax income\nGeorgia: opinion of the empire #G +5#! for #Y 5#! years"
 oe_geo.4.t: "The Bishop Who Would Not Sign"
 oe_geo.4.desc_it: "#F In July 1439 the council at Florence signed the decree of union. The Georgian church had sent its own men: the metropolitan of Tbilisi sat for the catholicos, but did not sign. It is said that the bishop gave away all that the mission carried and wandered off, and was found only later and sent on to Venice; another Georgian delegate showed a letter of the Patriarch of Antioch urging that no change to the Creed be accepted.#!\n\nNow the union is signed, but the churches of the East have not followed. The catholicos of [GetCountry('GEO').GetName] waits to hear what the capital has to say. The Georgian brotherhood at Iviron still worships in its own tongue, and Tbilisi remembers the empire's forbearance. The two courts have long dealt with each other; plain words will do."
