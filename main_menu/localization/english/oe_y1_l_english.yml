 oe_y1.1.t: "A Branch of the Xuanzheng Yuan"
 oe_y1.1.d: "#F In the fifth month of the third Zhiyuan year (June 1337) the Xifan of the west rose and killed Dang'ouban, son of the Prince of Zhenxi. The court set up a branch of the Xuanzheng Yuan, with Esen Temür as its commissioner, and sent it against them. The Xuanzheng Yuan, an office of the junior first rank, governed the Buddhist clergy and the lands of Tibet.#!\n\nNow news of the rising in the west has reached Dadu, and the #bold #color_yellow Xuanzheng Yuan#!#! asks: set up a branch bureau and send troops, or ask the Imperial Preceptor to calm the land?"
 oe_y1.1.a: "Set up the branch bureau and send Esen Temür"
 oe_y1.1.a.tt: "Subjects under a #bold #color_yellow Xuanzheng Yuan#!#! marker: liberty desire #G −5#!."
 oe_y1.1.b: "Ask the Imperial Preceptor and Sakya to calm the west"
 oe_y1.1.c: "Let it be"
 oe_y1.1.c.tt: "Subjects under a #bold #color_yellow Xuanzheng Yuan#!#! marker: liberty desire #R +5#!."
 oe_y1.2.t: "A New Dpon Chen at Sakya"
 oe_y1.2.d: "#F According to the historian Luciano Petech, in 1337 the Sakya dpon chen Wangchuk Pel was replaced by Sonam Pel, who held the office until 1344. The dpon chen was appointed by the emperor and governed the soldiers and people of Ü-Tsang.#!\n\nNow a new appointment from the #bold #color_yellow Xuanzheng Yuan#!#! has reached Sakya."
 oe_y1.2.a: "Obey and receive the new dpon chen"
 oe_y1.2.b: "Petition the Xuanzheng Yuan to keep the old one"
 oe_y1.3.t: "A New King Seeks Investiture"
 oe_y1.3.d1: "#F In 1339 King Chungsuk of Goryeo died. The chancellor Bayan ignored Goryeo's requests, and the Yuan court put off investing a new king. In the eighth month Jo Jeok rose for Wang Go, the Prince of Shen, and attacked the palace with more than a thousand men; the attack failed and Jo Jeok was killed. In the eleventh month Yuan envoys took King Chunghye to Dadu, and early the next year the king was handed to the Ministry of Justice. Freed after Bayan's fall, Chunghye was recognised by the court in the third month and restored.#!\n\nNow the old king is dead, the investiture has not come, and the party of the Prince of Shen is stirring.\nNote: we carry the [ShowModifier('oe_y1_zhengdong')] marker. If this king stays on the throne, the Yuan court may depose them some years from now over a petition to make Goryeo a province (in history, 1343)."
 oe_y1.3.d: "#F The King of Goryeo was also Left Grand Councillor of the Zhengdong Branch Secretariat, chose its officials and kept its revenue; a new king had to wait for investiture from the Yuan court.#!\n\nNow a new king has taken the throne and must send a memorial to the Yuan court asking for investiture.\nNote: we carry the [ShowModifier('oe_y1_zhengdong')] marker. If this king stays on the throne, the Yuan court may depose them some years from now over a petition to make Goryeo a province (in history, 1343)."
 oe_y1.3.a: "Put down the dissent and ask for investiture"
 oe_y1.3.a.tt: "While Bayan holds power at the Yuan court: the king is taken to Dadu and we get [ShowModifier('oe_y1_king_in_dadu')] (monthly legitimacy #R −0.1#!, cabinet efficiency #R −10%#!; at most #Y 18#! months, removed the month after Bayan falls). If Wang Go, the Prince of Shen, is alive, our opinion of the Shen state also changes by #Y −25#! (#Y 120#! months).\nIf Bayan no longer holds power: legitimacy #G +5#!.\nMongol influence count #R +1#! (only once vanilla's 'The Mongol Rule' has set it)."
 oe_y1.3.b: "Bribe the great men of the Yuan court"
 oe_y1.3.b.tt: "The Yuan receives the same sum.\nMongol influence count #R +1#! (only once vanilla's 'The Mongol Rule' has set it)."
 oe_y1.3.c: "Take the throne without waiting"
 oe_y1.3.c.tt: "Mongol influence count #G −2#! (only once vanilla's 'The Mongol Rule' has set it)."
 oe_y1.4.t: "Lady Gi, Second Empress"
 oe_y1.4.d: "#F Lady Gi of Goryeo had won the favour of Emperor Toghon Temür. The emperor wished to make Lady Gi empress, but the chancellor Bayan fought it. After Bayan's dismissal Shaliban asked that Lady Gi be made second empress; Lady Gi moved into the Xingsheng Palace, and the Huizheng Bureau was renamed the Zizheng Bureau.#!\n\nNow Bayan is gone, and Shaliban memorialises for Lady Gi."
 oe_y1.4.a: "Make Lady Gi second empress and rename the Huizheng Bureau"
 oe_y1.4.a.tt: "If Goryeo still carries [ShowModifier('oe_y1_zhengdong')], it gets [ShowModifier('oe_y1_ki_clan')] (loyalty to overlord #G +5#!, nobility power #Y +10%#!), renewed with the Zhengdong marker and removed with it.\nGoryeo's Mongol influence count #G +1#! (only once vanilla's 'The Mongol Rule' has set it)."
 oe_y1.4.b: "Keep to the old rule"
 oe_y1.5.t: "The Petition to Make Goryeo a Province"
 oe_y1.5.d: "#F In the eighth month of the third Zhizheng year (1343) Yi Un, Jo Ik-cheong and Gi Cheol petitioned the Yuan court to make Goryeo a regular province, calling its king greedy, lewd and lawless. The court did not; in the eleventh month envoys took the king to Dadu, and in the twelfth the king was banished to Jieyang. In the first month of the next year the deposed king died on the road, at Yueyang.#!\n\nNow the petition lies on the desk of the Central Secretariat."
 oe_y1.5.a: "No province; depose the King of Goryeo"
 oe_y1.5.a.tt: "If Goryeo has an heir: the heir takes the throne; the old king is brought to Dadu and dies #Y 2#! months later. Goryeo's opinion of us #R −30#! (#Y 120#! months), Goryeo's stability #Y −2.5#!.\nIf Goryeo has no heir: only Goryeo's legitimacy #Y −10#!.\n(The same when a player rules Goryeo.)"
 oe_y1.5.b: "Reject the petition and warn the king"
 oe_y1.6.t: "Abolishing the Judicial Office"
 oe_y1.6.d1: "#F In the fifth month of the sixteenth Zhizheng year (1356) King Gongmin had Gi Cheol and the other partisans of the Yuan put to death, abolished the Judicial Office of the Zhengdong Branch Secretariat the same month, dropped the Yuan era name and restored the old offices; in the seventh month Yu In-u took the Ssangseong Commandery. From then on the Zhengdong Branch Secretariat existed in name only.#!\n\nNow the Red Turbans are everywhere and the Yuan court has troubles of its own. Empress Gi's kin lord it over the kingdom. The Ssangseong lands were won back long ago. The king calls in trusted men to decide what to do about the Gi faction and the #bold #color_yellow Judicial Office#!#! of the #bold #color_yellow Zhengdong Branch Secretariat#!#!."
 oe_y1.6.d2: "#F In the fifth month of the sixteenth Zhizheng year (1356) King Gongmin had Gi Cheol and the other partisans of the Yuan put to death, abolished the Judicial Office of the Zhengdong Branch Secretariat the same month, dropped the Yuan era name and restored the old offices; in the seventh month Yu In-u took the Ssangseong Commandery. From then on the Zhengdong Branch Secretariat existed in name only.#!\n\nNow the Red Turbans are everywhere and the Yuan court has troubles of its own. Empress Gi's kin lord it over the kingdom. The Ssangseong lands are still in Yuan hands. The king calls in trusted men to decide what to do about the Gi faction and the #bold #color_yellow Judicial Office#!#! of the #bold #color_yellow Zhengdong Branch Secretariat#!#!."
 oe_y1.6.d3: "#F In the fifth month of the sixteenth Zhizheng year (1356) King Gongmin had Gi Cheol and the other partisans of the Yuan put to death, abolished the Judicial Office of the Zhengdong Branch Secretariat the same month, dropped the Yuan era name and restored the old offices; in the seventh month Yu In-u took the Ssangseong Commandery. From then on the Zhengdong Branch Secretariat existed in name only.#!\n\nNow the Red Turbans are everywhere and the Yuan court has troubles of its own. The Ssangseong lands were won back long ago. The king calls in trusted men to decide what to do about the partisans of the Yuan and the #bold #color_yellow Judicial Office#!#! of the #bold #color_yellow Zhengdong Branch Secretariat#!#!."
 oe_y1.6.d: "#F In the fifth month of the sixteenth Zhizheng year (1356) King Gongmin had Gi Cheol and the other partisans of the Yuan put to death, abolished the Judicial Office of the Zhengdong Branch Secretariat the same month, dropped the Yuan era name and restored the old offices; in the seventh month Yu In-u took the Ssangseong Commandery. From then on the Zhengdong Branch Secretariat existed in name only.#!\n\nNow the Red Turbans are everywhere and the Yuan court has troubles of its own. The Ssangseong lands are still in Yuan hands. The king calls in trusted men to decide what to do about the partisans of the Yuan and the #bold #color_yellow Judicial Office#!#! of the #bold #color_yellow Zhengdong Branch Secretariat#!#!."
 oe_y1.6.a: "Purge the Yuan partisans and abolish the Judicial Office"
 oe_y1.6.a.tt: "The [ShowModifier('oe_y1_zhengdong')] marker ends (and [ShowModifier('oe_y1_ki_clan')] with it).\nMongol influence count #G −3#! (only once vanilla's 'The Mongol Rule' has set it).\nUp to #Y 2#! Mongol aristocrats go back to the Yuan."
 oe_y1.6.b: "Stay loyal to the Yuan court"
 oe_y1.6.b.tt: "Mongol influence count #R +1#! (only once vanilla's 'The Mongol Rule' has set it)."
 oe_y1.20.t: "Zhengdong and Xuanzheng: the choice takes effect"
