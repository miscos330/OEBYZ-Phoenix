 STATIC_MODIFIER_NAME_oe_y1_zhengdong: "Zhengdong Branch Secretariat"
 STATIC_MODIFIER_DESC_oe_y1_zhengdong: "The King of Goryeo is also Left Grand Councillor of the Zhengdong Branch Secretariat, chooses its officials and keeps its revenue; a new king must be invested by the Yuan court."
 STATIC_MODIFIER_NAME_oe_y1_xz_utsang: "Xuanzheng Yuan: Ü-Tsang and Ngari"
 STATIC_MODIFIER_DESC_oe_y1_xz_utsang: "The Xuanzheng Yuan governs the Buddhist clergy and the lands of Tibet. The Pacification Commission of Ü-Tsang and Ngari Korsum rules Central Tibet and Ngari; the Sakya dpon chen is appointed by the emperor."
 STATIC_MODIFIER_NAME_oe_y1_xz_dokham: "Xuanzheng Yuan: Dokham"
 STATIC_MODIFIER_DESC_oe_y1_xz_dokham: "The Xuanzheng Yuan governs the Buddhist clergy and the lands of Tibet. The Pacification Commission of Dokham rules the peoples of Kham."
 STATIC_MODIFIER_NAME_oe_y1_xz_amdo: "Xuanzheng Yuan: Amdo"
 STATIC_MODIFIER_DESC_oe_y1_xz_amdo: "The Xuanzheng Yuan governs the Buddhist clergy and the lands of Tibet. The Pacification Commission of Amdo rules Amdo and the tribes of Longyou from its seat at Hezhou."
 STATIC_MODIFIER_NAME_oe_y1_ki_clan: "The Gi Consort Clan"
 STATIC_MODIFIER_DESC_oe_y1_ki_clan: "Empress Gi's kin lord it over Goryeo, and many at court attach themselves to them."
 STATIC_MODIFIER_NAME_oe_y1_king_in_dadu: "The King Held in Dadu"
 STATIC_MODIFIER_DESC_oe_y1_king_in_dadu: "The king has been taken to Dadu to await the Yuan court's judgement, and no one runs the government at home. Once Bayan falls, the king may return."
