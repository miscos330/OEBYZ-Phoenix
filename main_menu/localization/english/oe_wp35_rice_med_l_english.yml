l_english:
 # Project Phoenix v31.0 WP35: RICE Eastern Mediterranean Flavor.
 oe_wp35_rice_chios_mastic: "Charter the Chios Mastic Monopoly"
 oe_wp35_rice_chios_mastic.title: "Charter the Chios Mastic Monopoly"
 oe_wp35_rice_chios_mastic.desc: "Organize the fortified Mastichochoria villages of southern Chios into a chartered monopoly governing the prized aromatic resin sought by palaces from Cairo to Venice."
 oe_wp35_rice_chios_mastic.a: "Charter the Chios Mastic Monopoly"
 oe_wp35_rice.1.title: "Tears of Chios: The Mastic Monopoly"
 oe_wp35_rice.1.desc: "Nowhere else in the known world save the sun-baked limestone slopes of southern Chios do lentisk groves weep true translucent medicinal mastic. Inside the vaulted customs hall overlooking the harbor, Venetian factors, Genoese Maona shareholders, and elders of the fortified Mastichochoria villages lay competing charters before our commissioner, each seeking control over the island's fragrant silver-worth harvest."
 oe_wp35_rice.1.a: "Establish the Chios Maona Mastic Charter"
 oe_wp35_rice.1.b: "Share revenues with local island elders"
 oe_wp35_rice.1.c: "Recruit the chief Chios resin broker into imperial commerce"
 STATIC_MODIFIER_NAME_oe_wp35_mod_chios_mastic_monopoly: "Chios Mastic Monopoly"
 STATIC_MODIFIER_DESC_oe_wp35_mod_chios_mastic_monopoly: "Fortified Mastichochoria villages and strict export registries channel high-margin resin profits through Chios."
 STATIC_MODIFIER_NAME_oe_wp35_mod_chios_maona_guild: "Chios Maona Resin Consortium"
 STATIC_MODIFIER_DESC_oe_wp35_mod_chios_maona_guild: "Aromatic mastic exports from the Aegean enrich our commercial coffers."
 oe_wp35_rice_rhodes_commerce: "Expand Rhodes Hospitaller Commerce"
 oe_wp35_rice_rhodes_commerce.title: "Expand Rhodes Hospitaller Commerce"
 oe_wp35_rice_rhodes_commerce.desc: "Fortify the Grand Harbor of Rhodes and charter Levantine shipping leagues, turning the island citadel into an impregnable Aegean entrepot."
 oe_wp35_rice_rhodes_commerce.a: "Expand Rhodes Hospitaller Commerce"
 oe_wp35_rice.2.title: "Bulwark of the Aegean: Rhodes Grand Harbor"
 oe_wp35_rice.2.desc: "Beneath the towering limestone bastions guarding the ancient harbor entrance where the bronze Colossus once stood, merchant galleys from Venice, Genoa, Alexandria, Cyprus, and Crete ride at anchor awaiting victuals, repairs, and armed convoy escorts. Harbor captains and guild syndics now petition our throne to transform Rhodes into either a steel-ringed naval fortress or the freest transit mart in the Levant."
 oe_wp35_rice.2.a: "Fortify the harbor moles and escort convoys"
 oe_wp35_rice.2.b: "Lower transit dues to attract Levantine merchants"
 oe_wp35_rice.2.c: "Commission a veteran Rhodian galley captain for our navy"
 STATIC_MODIFIER_NAME_oe_wp35_mod_rhodes_hospitaller_port: "Rhodes Fortified Entrepot"
 STATIC_MODIFIER_DESC_oe_wp35_mod_rhodes_hospitaller_port: "Massive harbor bastions and bustling Levantine docks make Rhodes both a naval fortress and commercial nexus."
 STATIC_MODIFIER_NAME_oe_wp35_mod_rhodes_sea_patrols: "Aegean Convoy Escort League"
 STATIC_MODIFIER_DESC_oe_wp35_mod_rhodes_sea_patrols: "Seasoned Rhodian galleys protect maritime trade lanes across the Eastern Mediterranean."
 oe_wp35_rice_lesbos_gattilusi: "Sponsor Lesbos Gattilusi Patronage"
 oe_wp35_rice_lesbos_gattilusi.title: "Sponsor Lesbos Gattilusi Patronage"
 oe_wp35_rice_lesbos_gattilusi.desc: "Emulate the cultivated Gattilusi lords of Mytilene by uniting Greek classical letters with Italian Renaissance scholarship and alum commerce."
 oe_wp35_rice_lesbos_gattilusi.a: "Sponsor Lesbos Gattilusi Patronage"
 oe_wp35_rice.3.title: "The Mytilene Circle: Gattilusi Patronage"
 oe_wp35_rice.3.desc: "High inside the pine-scented citadel overlooking Mytilene's twin harbors, Greek grammarians from Constantinople sit beside Genoese humanists and Renaissance architects copying rare classical manuscripts, while down on the quays, barges loaded with Aegean olive oil, fine soap, and Anatolian alum wait for export seals. Our patronage can crown Lesbos as the shimmering intellectual bridge between East and West."
 oe_wp35_rice.3.a: "Endow a Greco-Latin humanist scriptorium"
 oe_wp35_rice.3.b: "Invest in Mytilene's alum and olive exchanges"
 oe_wp35_rice.3.c: "Invite a cosmopolitan Mytilene humanist to our royal court"
 STATIC_MODIFIER_NAME_oe_wp35_mod_lesbos_gattilusi_court: "Mytilene Gattilusi Court"
 STATIC_MODIFIER_DESC_oe_wp35_mod_lesbos_gattilusi_court: "A cosmopolitan Aegean court blending Greek learning, Italian artistry, and thriving island crafts."
 STATIC_MODIFIER_NAME_oe_wp35_mod_gattilusi_humanism: "Aegean Humanist Patronage"
 STATIC_MODIFIER_DESC_oe_wp35_mod_gattilusi_humanism: "Bridging Greek and Latin intellectual traditions elevates our realm's cultural and diplomatic renown."
 oe_wp35_rice_coptic_alexandria: "Protect Coptic Alexandrian Heritage"
 oe_wp35_rice_coptic_alexandria.title: "Protect Coptic Alexandrian Heritage"
 oe_wp35_rice_coptic_alexandria.desc: "Safeguard the ancient Coptic scriptoria, Nile desert monasteries, and experienced Alexandrian fiscal scribes whose learning spans millennia."
 oe_wp35_rice_coptic_alexandria.a: "Protect Coptic Alexandrian Heritage"
 oe_wp35_rice.4.title: "Keepers of the Nile: Coptic Alexandrian Heritage"
 oe_wp35_rice.4.desc: "From the ancient patriarchal libraries of Saint Mark in Alexandria to the fortified desert lavras of Wadi El Natrun, Coptic scholars and hereditary fiscal clerks preserve both priceless liturgical codices and millennia-old methods of measuring the Nile's floods and harvests. Extending royal protection over these learned communities promises sharper imperial accounting and tranquil harmony across Egypt's cosmopolitan ports."
 oe_wp35_rice.4.a: "Grant royal protection to Coptic monasteries and scribes"
 oe_wp35_rice.4.b: "Charter a joint Alexandrian academy of ancient texts"
 oe_wp35_rice.4.c: "Appoint the master Alexandrian fiscal clerk to our chancery"
 STATIC_MODIFIER_NAME_oe_wp35_mod_coptic_alexandria_heritage: "Coptic Alexandrian Heritage"
 STATIC_MODIFIER_DESC_oe_wp35_mod_coptic_alexandria_heritage: "Preserved Coptic libraries and cosmopolitan Nile learning boost literacy and institutional spread."
 STATIC_MODIFIER_NAME_oe_wp35_mod_alexandrian_scribes: "Alexandrian Scribe Chancery"
 STATIC_MODIFIER_DESC_oe_wp35_mod_alexandrian_scribes: "Veteran Alexandrian clerks refine state administration while promoting confessional coexistence."
 oe_wp35_rice_armenian_cilicia: "Charter the Armenian Cilician Guilds"
 oe_wp35_rice_armenian_cilicia.title: "Charter the Armenian Cilician Guilds"
 oe_wp35_rice_armenian_cilicia.desc: "Empower the master silk-weavers, metallurgists, and mountain fortress guilds of Sis, Adana, and Tarsus linking Anatolian passes to Levantine ports."
 oe_wp35_rice_armenian_cilicia.a: "Charter the Armenian Cilician Guilds"
 oe_wp35_rice.5.title: "Gates of the Taurus: Armenian Cilician Guilds"
 oe_wp35_rice.5.desc: "Beneath the craggy mountain citadel of Sis and across the irrigated plains of Adana and Tarsus, Armenian master weavers, silversmiths, and caravan syndics marshal long mule trains descending from Tabriz and Persia through the Taurus passes toward Mediterranean ports. Confirming their guild charters and protecting the highland roads will turn Cilicia into a roaring engine of silk, metallurgy, and customs revenue."
 oe_wp35_rice.5.a: "Grant guild charters and caravan protection across Cilicia"
 oe_wp35_rice.5.b: "Invest in Cilician silk looms and Tarsus warehouses"
 oe_wp35_rice.5.c: "Elevate a veteran Armenian caravan master to oversee eastern trade"
 STATIC_MODIFIER_NAME_oe_wp35_mod_cilician_armenian_guilds: "Armenian Cilician Guilds"
 STATIC_MODIFIER_DESC_oe_wp35_mod_cilician_armenian_guilds: "Skilled Armenian artisans and Taurus caravan brokers drive Cilician production and mountain defenses."
 STATIC_MODIFIER_NAME_oe_wp35_mod_armenian_silk_network: "Cilician Silk Caravan Network"
 STATIC_MODIFIER_DESC_oe_wp35_mod_armenian_silk_network: "Armenian commercial networks linking Persia, Anatolia, and the Levant enhance exports and manufactures."
 oe_wp35_rice.6.title: "Eastern Mediterranean Commercial & Cultural Dividend"
 oe_wp35_rice.6.desc: "Eight months after our eastern Mediterranean charters took hold, merchant syndics, navigators, and bilingual scholars from the Aegean islands, Alexandria, and Cilicia report surging customs receipts and brisk manuscript exchanges. Warehouses along our capital quays overflow with resin, silk, alum, and olive oil—rewarding enlightened patronage across the Levantine sea lanes."
 oe_wp35_rice.6.a: "Reinvest the customs dividend into our capital markets"
 oe_wp35_rice.6.b: "Sponsor cosmopolitan scholarship and harbor festivities"
 oe_wp35_rice.6.c: "Enlist a multilingual Levantine merchant factor at court"
