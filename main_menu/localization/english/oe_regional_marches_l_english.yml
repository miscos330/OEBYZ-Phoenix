l_english:
 OE_MARCH_GERMAN_IDENTITY_REQUIRED: "Germanic Romanization has been started; completion of the movement does not revoke eligibility"
 oe_caucasian_march_modifier: "Caucasian March"
 oe_caucasian_march_modifier_desc: "Under the protection of the march, the mountain peoples retain their traditions while sharing the duty of defending the empire."
 OE_CAUCASIAN_MARCH: "Caucasian March"
 OE_CAUCASIAN_MARCH_ADJ: "Caucasian"
 oe_found_caucasian_march.title: "Establish the Caucasian March"
 oe_found_caucasian_march.desc: "Mountain passes and coastal roads bind together many tongues and faiths. Entrust them to an imperial frontier lord, guarding the passes with fortresses and preserving concord among the peoples of the Caucasus.\n\nGrant all directly owned Byzantine conquerable locations in Tuapse province and the Caucasus region, excluding the Armenian Highlands area to the new Caucasian March. Its religion is Orthodox, its primary culture is [ShowCultureName('greek_culture')], and its subject type is Roman March. This decision can be taken only once and has no additional cost.\n\nAlso gains the permanent Caucasian March modifier: −300% Population Assimilation Speed, +10 Culture Capacity and −50% Accepted Culture Maintenance Cost. The assimilation modifier stacks with its subject-type modifier."
 oe_found_caucasian_march.a: "Let the frontier fortresses stand watch for Rome."
 OE_MARCH_CAUCASIAN_TERRITORY_REQUIRED: "Byzantium directly owns every conquerable location in Georgia; subject ownership and military occupation do not count."
 oe_caucasian_march_founded: "Established: Caucasian March"
 OE_BOHEMIAN_MARCH: "Bohemian March"
 OE_BOHEMIAN_MARCH_ADJ: "Bohemian"
 oe_found_bohemian_march.title: "Establish the Bohemian March"
 oe_found_bohemian_march.desc: "The mountain-ringed basin and the roads of Moravia can sustain a loyal imperial march. Beneath Orthodox bells and imperial law, its lords will guard the approaches to Central Europe.\n\nGrant all directly owned Byzantine conquerable locations in Bohemia and Moravia to the new Bohemian March. Its religion is Orthodox, its primary culture is [ShowCultureName('czech')], and its subject type is Roman March. This decision can be taken only once and has no additional cost."
 oe_found_bohemian_march.a: "Let the frontier fortresses stand watch for Rome."
 OE_MARCH_BOHEMIAN_TERRITORY_REQUIRED: "Byzantium directly owns every conquerable location in Bohemia; subject ownership and military occupation do not count."
 oe_bohemian_march_founded: "Established: Bohemian March"
 OE_DUTCH_MARCH: "Dutch March"
 OE_DUTCH_MARCH_ADJ: "Dutch"
 oe_found_dutch_march.title: "Establish the Dutch March"
 oe_found_dutch_march.desc: "Dykes and ports bind the North Sea coast together. As Germanic Romanization brings shared laws to towns and villages, establish a march to anchor Roman authority along these shores.\n\nGrant all directly owned Byzantine conquerable locations in Holland and Friesland to the new Dutch March. Its religion is Orthodox, its primary culture is [ShowCultureName('oe_german_greek_culture')], and its subject type is Roman March. This decision can be taken only once and has no additional cost."
 oe_found_dutch_march.a: "Let the frontier fortresses stand watch for Rome."
 OE_MARCH_DUTCH_TERRITORY_REQUIRED: "Byzantium directly owns every conquerable location in Holland; subject ownership and military occupation do not count."
 oe_dutch_march_founded: "Established: Dutch March"
 OE_UPPER_GERMAN_MARCH: "Upper Germanic March"
 OE_UPPER_GERMAN_MARCH_ADJ: "Upper Germanic"
 oe_found_upper_german_march.title: "Establish the Upper Germanic March"
 oe_found_upper_german_march.desc: "The northern principalities and trading cities are linked by roads restored under imperial rule. Retain the designated Rhine strongholds and organize the remaining lands into the Upper Germanic March, giving Roman identity a lasting foundation.\n\nGrant directly owned Byzantine conquerable locations in North Germany, excluding Wallonia, Flanders, Brabant, Holland, Friesland, the Rhineland, Mainz, Oppenheim and Worms; Bergisches Land province, Wied, Dusseldorf and Altenkirchen remain included as exceptions to the Rhineland exclusion to the new Upper Germanic March. Its religion is Orthodox, its primary culture is [ShowCultureName('oe_german_greek_culture')], and its subject type is Roman March. This decision can be taken only once and has no additional cost."
 oe_found_upper_german_march.a: "Let the frontier fortresses stand watch for Rome."
 OE_MARCH_UPPER_GERMAN_TERRITORY_REQUIRED: "Byzantium directly owns every conquerable location in the Rhineland; subject ownership and military occupation do not count."
 oe_upper_german_march_founded: "Established: Upper Germanic March"
 OE_LOWER_GERMAN_MARCH: "Lower Germanic March"
 OE_LOWER_GERMAN_MARCH_ADJ: "Lower Germanic"
 oe_found_lower_german_march.title: "Establish the Lower Germanic March"
 oe_found_lower_german_march.desc: "The towns of the Upper Rhine, the valleys of Swabia and the roads of Bavaria will stand together beneath a new march. Local order and Roman law will sustain one another and secure these northern lands.\n\nGrant all directly owned Byzantine conquerable locations in Swabia, Bavaria, Franconia and the Upper Rhine, excluding the Palatinate province except Heidelberg itself to the new Lower Germanic March. Its religion is Orthodox, its primary culture is [ShowCultureName('oe_german_greek_culture')], and its subject type is Roman March. This decision can be taken only once and has no additional cost."
 oe_found_lower_german_march.a: "Let the frontier fortresses stand watch for Rome."
 OE_MARCH_LOWER_GERMAN_TERRITORY_REQUIRED: "Byzantium directly owns every conquerable location in the Upper Rhine; subject ownership and military occupation do not count."
 oe_lower_german_march_founded: "Established: Lower Germanic March"

 MODIFIER_TYPE_NAME_oe_block_primary_culture_change: "Cannot Change Primary Culture"
 MODIFIER_TYPE_DESC_oe_block_primary_culture_change: "Imperial authority safeguards this country's primary culture, preventing voluntary changes through the Change Primary Culture action."
 OE_PRIMARY_CULTURE_CHANGE_PERMITTED: "Not prohibited from changing primary culture"
 OE_NUBIAN_MARCH: "Nubian March"
 OE_NUBIAN_MARCH_ADJ: "Nubian"
 oe_found_nubian_march.title: "Establish the Nubian March"
 oe_found_nubian_march.desc: "The cataracts of the Nile and the churches along its desert banks bear witness to the enduring faith and traditions of Nubia. Entrust these towns and fortresses to a local frontier lord, securing the southern roads for the Empire.\n\nAll directly owned Byzantine locations in the Nubia region will form the Nubian March. The new country will have Nubian primary culture and the Orthodox Catholic faith, and will be a Roman March subject of Byzantium. This decision can be taken only once."
 oe_found_nubian_march.a: "Let the upper Nile stand watch for the Empire."
 OE_NUBIAN_MARCH_TERRITORY_REQUIRED: "Byzantium directly owns at least one conquerable location in the Nubia region"
 oe_nubian_march_founded: "Nubian March established"
