# NEW 2026-11-23 v19.5 Module 19.5-B: Kingdom of Scotland & Crown of Aragon Localization (english, 240 keys) (oe_gem2_, 0 mainline slots, 0 rules, 0 vanilla overrides). Generated by gen_v195_sco_ara.py; edit the generator, not this file.
 oe_msn_sco_destiny:0 "#bold #color_yellow Kingdom of Scotland: Sovereign Crown of the North#!#!"
 oe_msn_sco_destiny_DESCRIPTION:0 "From Liberating Edinburgh and the Auld Alliance to Pacifying the Isles, St Andrews Renaissance, and the Scottish Enlightenment"
 oe_msn_sco_destiny_CRITERIA_DESCRIPTION:0 "Reunite the Lowlands from Dunfermline to Edinburgh, forge Royal Schiltron Pikemen and the Great Michael fleet, tame the Highland Isles, and lead the Scottish Enlightenment."
 oe_msn_sco_destiny_BUTTON_TOOLTIP:0 "Embark on the Kingdom of Scotland Destiny"
 oe_msn_sco_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for Scotland: liberate Edinburgh and forge the Auld Alliance, Royal Schiltron Pikemen, and the Great Michael fleet; subdue the Lordship of the Isles, Orkney, and Celtic Sea approaches; and build North Sea commerce, the University of St Andrews, and the Scottish Enlightenment."
 oe_msn_sco_01_liberate_edinburgh:0 "Liberate Edinburgh & Reunite the Lowlands"
 oe_msn_sco_01_liberate_edinburgh_desc:0 "Reclaiming Edinburgh Rock, Stirling Bridge, and the royal tombs of Dunfermline vindicates the Declaration of Arbroath and ends southern occupation. Restoring the Lowland [core|e] rebuilds royal [legitimacy|e], revives urban [development|e], and secures domestic [stability|e]."
 oe_msn_sco_01_liberate_edinburgh_req_tt:0 "Hold Edinburgh, Dunfermline, and Stirling (or via subjects), Stability >= 5, and own a Castle or Marketplace."
 oe_msn_sco_02_auld_alliance_guard:0 "The Auld Alliance & Garde Ecossaise"
 oe_msn_sco_02_auld_alliance_guard_desc:0 "Forged in 1295, the Auld Alliance bound Edinburgh and Paris in mutual defense while Scottish archers won immortal renown in the Garde Ecossaise. Leveraging continental [diplomacy|e] enhances [diplomatic_reputation|e], rewards noble [estates|e], and hones [army_tradition|e]."
 oe_msn_sco_02_auld_alliance_guard_req_tt:0 "Stability >= 8, allied to France or Gold >= 180, and Nobles Satisfaction >= 50%."
 oe_msn_sco_03_schiltron_pikemen:0 "Forge the Royal Schiltron Pikemen"
 oe_msn_sco_03_schiltron_pikemen_desc:0 "From Robert the Bruce's bristling circles at Bannockburn to continental pike squares and Mons Meg's siege guns, Scottish arms evolved into feared discipline. Combining military [advances|e] with salaried [regulars|e] and modern [buildings|e] steels the royal [army|e]."
 oe_msn_sco_03_schiltron_pikemen_req_tt:0 "Age of Renaissance+, hold Edinburgh, unlock Professional Armies, Armory or Cannon Maker, and Army Tradition >= 18."
 oe_msn_sco_04_great_michael_fleet:0 "Great Michael & the Royal Scots Navy"
 oe_msn_sco_04_great_michael_fleet_desc:0 "Felling the oak woods of Fife to launch the Great Michael at Newhaven, James IV announced Scotland's arrival as a gunpowder naval power. Equipping a royal [navy|e] with veteran [sailors|e] deepens [navy_tradition|e] and projects [maritime_presence|e] across northern waters."
 oe_msn_sco_04_great_michael_fleet_req_tt:0 "Age of Discovery+, hold Edinburgh and Glasgow, Gold >= 260, Dry Dock or Dock, and Navy Tradition >= 18."
 oe_msn_sco_05_lordship_of_the_isles:0 "Lordship of the Isles & Highland Clans"
 oe_msn_sco_05_lordship_of_the_isles_desc:0 "For generations the MacDonald Lords of the Isles ruled the Hebrides with birlinn galleys and Highland clans almost independent of Edinburgh. Folding Islay and Lewis into our [core|e] asserts [crown_power|e], widens western [control|e], and rallies proud Gaelic [manpower|e]."
 oe_msn_sco_05_lordship_of_the_isles_req_tt:0 "Hold Inverness, Islay, and Lewis (or via subjects), and own at least 4 ports."
 oe_msn_sco_06_northern_isles_marches:0 "Orkney, Shetland & the Border Marches"
 oe_msn_sco_06_northern_isles_marches_desc:0 "Redeeming Orkney and Shetland from Nordic pledge while retaking Tweedside Berwick closes both the northern sea approaches and the southern march. Anchoring each frontier [fort|e] as a Scottish [core|e] strengthens island [control|e] and safeguards cross-border [prosperity|e]."
 oe_msn_sco_06_northern_isles_marches_req_tt:0 "Hold Orkney, Berwick, and Shetland or Dumfries (or via subjects), and own a Castle or Wharf."
 oe_msn_sco_07_celtic_sea_bastion:0 "Bastion of the Irish Sea & Northumbria"
 oe_msn_sco_07_celtic_sea_bastion_desc:0 "Crossing the North Channel into Ulster or pushing south past Hadrian's ruined wall shifts the balance of the British Isles forever. Securing strategic [core|e] holdings across the Irish Sea rewards [army_tradition|e], widens [maritime_presence|e], and magnifies royal [prestige|e]."
 oe_msn_sco_07_celtic_sea_bastion_req_tt:0 "Hold Carrickfergus, Newcastle, or Carlisle, 45+ locations owned or by subjects, and Army Tradition >= 15."
 oe_msn_sco_08_caledonian_atlantic:0 "Caledonian Atlantic Destiny"
 oe_msn_sco_08_caledonian_atlantic_desc:0 "Facing the open Atlantic from the Firth of Clyde, Glasgow's merchants transformed Scotland into an oceanic carrier linking North America with Northern Europe. Embracing oceanic [institutions|e] turns Clyde [trade|e] into rising [gold|e] reserves and vibrant urban [development|e]."
 oe_msn_sco_08_caledonian_atlantic_req_tt:0 "Age of Discovery+, hold Glasgow and Edinburgh, Stability >= 12, embrace New World, and own a Trading Hub or Dry Dock."
 oe_msn_sco_09_north_sea_herring_wool:0 "North Sea Herring & Woolen Trade"
 oe_msn_sco_09_north_sea_herring_wool_desc:0 "Royal burghs along the Tay and Dee salted North Sea herring, sheared border fleece, and traded with Campvere and Danzig for Baltic timber. Growing guild [buildings|e] strengthens our northern [market|e], raises burgher [estate_satisfaction|e], and brings coastal [prosperity|e]."
 oe_msn_sco_09_north_sea_herring_wool_req_tt:0 "Hold Aberdeen and Dundee (or via subjects), Gold >= 200, Fishing Village or Cloth Guild, and Trade/Tax Income >= 18."
 oe_msn_sco_10_st_andrews_renaissance:0 "University of St Andrews & Scottish Renaissance"
 oe_msn_sco_10_st_andrews_renaissance_desc:0 "Chartered in 1413, the University of St Andrews joined Glasgow and Aberdeen to make Scotland's scholarly network rival far wealthier kingdoms. Expanding collegiate [buildings|e] lifts national [literacy|e], speeds intellectual [advances|e], and deepens [cultural_tradition|e]."
 oe_msn_sco_10_st_andrews_renaissance_req_tt:0 "Age of Renaissance+, hold St Andrews, Stability >= 10, University or Library, and Capital Development >= 16."
 oe_msn_sco_11_scottish_enlightenment:0 "Edinburgh Academies & Scottish Enlightenment"
 oe_msn_sco_11_scottish_enlightenment_desc:0 "In Edinburgh's printing houses and Glasgow's lecture halls, jurists, economists, and natural philosophers forged an intellectual revolution admired across Europe. Pairing civic [literacy|e] with vibrant [institutions|e] elevates [cabinet|e] reform and lasting [cultural_tradition|e]."
 oe_msn_sco_11_scottish_enlightenment_req_tt:0 "Age of Reformation+, hold Edinburgh and Glasgow, Stability >= 15, embrace Printing Press, and own a Printing Press Shop or Arts Academy."
 oe_msn_sco_12_sovereign_crown_north:0 "Sovereign Crown of the North"
 oe_msn_sco_12_sovereign_crown_north_desc:0 "Never subdued by conquest nor dissolved by compromise, the Crown of Scotland now commands Highland clans, Lowland burghs, and northern sea lanes alike. Supported by [capital|e] [prosperity|e] and unblemished [legitimacy|e], the Thistle rises as a peerless [great_power|e]."
 oe_msn_sco_12_sovereign_crown_north_req_tt:0 "Age of Absolutism+, hold Edinburgh, Glasgow, St Andrews, and Islay, Stability >= 18, Capital Development >= 26, and Great Power or Trade/Tax Income >= 110."
 oe_msn_ara_destiny:0 "#bold #color_yellow Crown of Aragon: Mare Nostrum of the Four Bars#!#!"
 oe_msn_ara_destiny_DESCRIPTION:0 "From the Consulate of the Sea and Drassanes Shipyards to Mallorca, Sardinia, Sicily, Naples, and Mediterranean Thalassocracy"
 oe_msn_ara_destiny_CRITERIA_DESCRIPTION:0 "Codify the Consulate of the Sea, field Almogavar Marines and royal galley fleets, unite Mallorca, Sardinia, Sicily, and Naples, and crown the Four Bars over Mare Nostrum."
 oe_msn_ara_destiny_BUTTON_TOOLTIP:0 "Embark on the Crown of Aragon Destiny"
 oe_msn_ara_destiny_BUTTON_DETAILS:0 "A twelve-task three-pillar destiny for the Crown of Aragon: codify the Consulate of the Sea, expand Barcelona's Drassanes Arsenal, and deploy Almogavar Marines; reunite Mallorca, Sardinia, Sicily, Naples, and Aegean duchies; and flourish through the Cortes, Valencia's Lonja de la Seda, and Mediterranean banking consulates."
 oe_msn_ara_01_consulate_of_the_sea:0 "Consulate of the Sea in Barcelona & Valencia"
 oe_msn_ara_01_consulate_of_the_sea_desc:0 "Codified in Barcelona and Valencia, the Llibre del Consolat de Mar became the shared admiralty law of merchants across the Western Mediterranean. Anchoring coastal [buildings|e] elevates [navy_tradition|e], stimulates maritime [trade|e], and spurs Levantine [development|e]."
 oe_msn_ara_01_consulate_of_the_sea_req_tt:0 "Hold Barcelona, Valencia, and Zaragoza (or via subjects), Stability >= 5, Wharf or Marketplace, and own a port."
 oe_msn_ara_02_royal_shipyards_drassanes:0 "Drassanes Royal Galley Arsenal"
 oe_msn_ara_02_royal_shipyards_drassanes_desc:0 "Beneath the vaulted stone naves of the Drassanes Reials, Catalan shipwrights assembled war galleys by the dozen to challenge Genoese and Angevin fleets. Funding royal [navy|e] slipways with [gold|e] multiplies trained [sailors|e] and sharpens [navy_tradition|e]."
 oe_msn_ara_02_royal_shipyards_drassanes_req_tt:0 "Hold Barcelona (or via subjects), Gold >= 180, Stability >= 8, Wharf or Guild Hall, and Navy Tradition >= 12."
 oe_msn_ara_03_almogavar_marines:0 "Desperta Ferro: Almogavar Marines"
 oe_msn_ara_03_almogavar_marines_desc:0 "Striking iron against flint with the war cry Desperta Ferro, mountain-bred Almogavar shock troops shattered armored knights from Sicily to Anatolia. Pairing military [advances|e] with salaried [regulars|e] equips our [army|e] for amphibious assault and fuels [army_tradition|e]."
 oe_msn_ara_03_almogavar_marines_req_tt:0 "Age of Renaissance+, hold Barcelona, unlock Professional Armies, Armory or Dock, and Army Tradition >= 18."
 oe_msn_ara_04_catalan_grand_duchies:0 "Catalan Grand Company & Aegean Duchies"
 oe_msn_ara_04_catalan_grand_duchies_desc:0 "Reclaiming the Catalan Company's legendary duchies of Athens and Neopatras or seizing Tunis turns the central sea into an Aragonese lake. Turning Aegean bases into a firm [core|e] extends [maritime_presence|e], elevates royal [prestige|e], and unlocks eastern [trade|e]."
 oe_msn_ara_04_catalan_grand_duchies_req_tt:0 "Age of Discovery+, hold Athens, Neopatras, or Tunis, Dry Dock or Training Fields, and Navy Tradition >= 22."
 oe_msn_ara_05_mallorca_sardinia:0 "Crown of Mallorca & Kingdom of Sardinia"
 oe_msn_ara_05_mallorca_sardinia_desc:0 "Peter the Ceremonious reabsorbed Mallorca and fought fiercely for Sardinian silver mines to forge the western island bridge toward Italy. Securing Palma and Cagliari as our [core|e] cements island [control|e], expands [maritime_presence|e], and channels sea [gold|e] home."
 oe_msn_ara_05_mallorca_sardinia_req_tt:0 "Hold Palma, Cagliari, and Oristano or Sassari (or via subjects), and own at least 6 ports."
 oe_msn_ara_06_sicilian_vespers:0 "Heirs of the Sicilian Vespers"
 oe_msn_ara_06_sicilian_vespers_desc:0 "Since the bells of the 1282 Sicilian Vespers summoned King Peter III to Palermo, the granary island has been the linchpin of Aragonese sea power. Confirming Sicily as an undivided [core|e] secures central [control|e], bolsters [navy_tradition|e], and feeds urban [prosperity|e]."
 oe_msn_ara_06_sicilian_vespers_req_tt:0 "Hold Palermo and Messina (or via subjects), and Nobles Satisfaction >= 50%."
 oe_msn_ara_07_naples_inheritance:0 "Alfonso the Magnanimous & Naples"
 oe_msn_ara_07_naples_inheritance_desc:0 "Riding through a Roman triumphal arch into Naples in 1443, Alfonso the Magnanimous united the Mezzogiorno with Barcelona's maritime commonwealth. Integrating Campania into our [core|e] multiplies southern [manpower|e], lifts Neapolitan [development|e], and crowns royal [legitimacy|e]."
 oe_msn_ara_07_naples_inheritance_req_tt:0 "Hold Naples and Gaeta, Bari, or Salerno (or via subjects), and at least 1 subject or Army Tradition >= 15."
 oe_msn_ara_08_dual_crown_or_thalassocracy:0 "Iberian Dual Crown or Sea Empire"
 oe_msn_ara_08_dual_crown_or_thalassocracy_desc:0 "Whether uniting Iberia from Toledo or eclipsing Genoa across the Ligurian and Aegean seas, Aragon now dictates the strategic destiny of Southern Europe. Governing vast [subjects|e] with rising [crown_power|e] fills our coffers with [gold|e] and proves our [great_power|e] rank."
 oe_msn_ara_08_dual_crown_or_thalassocracy_req_tt:0 "Age of Discovery+, hold Toledo, Genoa, or Athens, 95+ locations owned or by subjects, and Great Power or Trade/Tax Income >= 75."
 oe_msn_ara_09_cortes_and_fueros:0 "Cortes of Aragon, Generalitat & Fueros"
 oe_msn_ara_09_cortes_and_fueros_desc:0 "Aragon's monarchs swore before the Justicia and the Generalitat to uphold the ancient fueros of each constituent kingdom rather than rule by arbitrary decree. Honoring pactist [parliament|e] charters elevates [estate_satisfaction|e], steadies [stability|e], and aids [diplomacy|e]."
 oe_msn_ara_09_cortes_and_fueros_req_tt:0 "Hold Zaragoza and Barcelona (or via subjects), Stability >= 10, and Burghers & Nobles Satisfaction >= 50%."
 oe_msn_ara_10_lonja_de_la_seda:0 "Valencian Golden Age & Lonja de la Seda"
 oe_msn_ara_10_lonja_de_la_seda_desc:0 "Beneath the twisted Gothic columns of Valencia's Lonja de la Seda, weavers, bankers, and poets of the Valencian Golden Age celebrated honest commerce. Raising guild [buildings|e] enriches the Levantine [market|e], sustains [prosperity|e], and magnifies [cultural_tradition|e]."
 oe_msn_ara_10_lonja_de_la_seda_req_tt:0 "Age of Renaissance+, hold Valencia, Gold >= 240, Silk Production Guild or Counting House, and Capital Development >= 18."
 oe_msn_ara_11_mediterranean_consulates:0 "Mediterranean Consulates & Taula Banks"
 oe_msn_ara_11_mediterranean_consulates_desc:0 "Barcelona's Taula de Canvi pioneered public deposit banking while Aragonese consuls sat from Alexandria to Bruges arbitrating maritime credit. Combining global [institutions|e] with sound coinage curbs [inflation|e], expands [trade|e], and enhances [diplomatic_reputation|e]."
 oe_msn_ara_11_mediterranean_consulates_req_tt:0 "Age of Reformation+, hold Barcelona and Valencia, Stability >= 15, embrace Global Trade, Customs House or Port Authority, and Trade/Tax Income >= 85."
 oe_msn_ara_12_mare_nostrum_four_bars:0 "Mare Nostrum of the Four Bars"
 oe_msn_ara_12_mare_nostrum_four_bars_desc:0 "From the Pillars of Hercules to the Straits of Messina, the four crimson bars of the Senyera fly over every great emporium of the Western Sea. Sustained by [capital|e] [prosperity|e] and unmatched [maritime_presence|e], Aragon reigns as a sovereign [great_power|e]."
 oe_msn_ara_12_mare_nostrum_four_bars_req_tt:0 "Age of Absolutism+, hold Barcelona, Valencia, Palma, Palermo, and Naples, Stability >= 18, Capital Development >= 28, and Great Power or 15+ ports."
 oe_gem2_sco_schiltron_pikemen:0 "Scottish Schiltron Pikemen"
 oe_gem2_sco_schiltron_pikemen_desc:0 "Standing Renaissance heavy pike formations evolving Scotland's famed schiltron spear wall. Unlocked by Professional Armies in the Age of Renaissance, they anchor hills, highlands, and wetlands against the fiercest cavalry charges."
 oe_gem2_ara_almogavar_marines:0 "Aragonese Almogavar Marines"
 oe_gem2_ara_almogavar_marines_desc:0 "Standing Renaissance amphibious shock infantry descended from the fierce Pyrenean Almogavars. Unlocked by Professional Armies in the Age of Renaissance, they strike coastal bastions, hills, and mountains with unmatched speed and morale shock."
 oe_gem2_dec_st_andrews_charter.title:0 "Charter the University of St Andrews"
 oe_gem2_dec_st_andrews_charter.desc:0 "Available from #Y 1410#! onward while holding St Andrews: grant a permanent royal and ecclesiastical charter establishing Scotland's first university, raising literacy, research speed, and cultural tradition across the kingdom."
 oe_gem2_dec_st_andrews_charter.a:0 "Seal the Royal Charter of St Andrews"
 oe_gem2_dec_consulat_del_mar.title:0 "Promulgate the Llibre del Consolat de Mar"
 oe_gem2_dec_consulat_del_mar.desc:0 "Available from #Y 1345#! onward while holding Barcelona, Valencia, or Palma: codify the celebrated Catalan maritime code across our ports, permanently boosting maritime presence, sea trade efficiency, and merchant power."
 oe_gem2_dec_consulat_del_mar.a:0 "Enact the Book of the Consulate of the Sea"
 STATIC_MODIFIER_NAME_oe_gem2_mod_dec_st_andrews:0 "Royal Charter of St Andrews"
 STATIC_MODIFIER_DESC_oe_gem2_mod_dec_st_andrews:0 "Scotland's ancient coastal university trains generations of literate clergy, advocates, and humanist scholars."
 STATIC_MODIFIER_NAME_oe_gem2_mod_dec_consulat_mar:0 "Code of the Consulate of the Sea"
 STATIC_MODIFIER_DESC_oe_gem2_mod_dec_consulat_mar:0 "Codified Catalan maritime jurisprudence governs freight, insurance, and merchant courts across western Mediterranean ports."
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m1:0 "Royal Schiltron Pike Doctrine"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m1:0 "Drilled Renaissance pike formations combine stubborn Scottish morale with fortified highland defense."
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m2:0 "Lords of the Celtic Sea & Marches"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m2:0 "Command of the Western Isles, Northern Isles, and Irish Sea approaches secures manpower, sailors, and stone border fortresses."
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m3:0 "Athens of the North"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m3:0 "Edinburgh, Glasgow, and St Andrews illuminate Europe with Enlightenment philosophy, jurisprudence, and industrial invention."
 STATIC_MODIFIER_NAME_oe_gem2_msn_sco_m4:0 "Sovereign Crown of the North"
 STATIC_MODIFIER_DESC_oe_gem2_msn_sco_m4:0 "Standing united across Lowlands, Highlands, and Isles behind disciplined armies and Atlantic fleets crowns Scotland forever."
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m1:0 "Desperta Ferro Marine Vanguard"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m1:0 "Battle-hardened Almogavar marine corps bring ferocious mountain speed and shock power to Mediterranean campaigns."
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m2:0 "Crown of the Two Sicilies"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m2:0 "Holding Palermo and Naples under one Aragonese throne unites Mediterranean dynastic prestige with loyal overseas subjects."
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m3:0 "Catalan Mediterranean Exchange"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m3:0 "Valencian silk exchanges, Barcelona clearing banks, and Levantine consulates channel immense trade profits to the Crown."
 STATIC_MODIFIER_NAME_oe_gem2_msn_ara_m4:0 "Mare Nostrum of the Four Bars"
 STATIC_MODIFIER_DESC_oe_gem2_msn_ara_m4:0 "Sovereign over Barcelona, Valencia, Palma, Palermo, and Naples, the Crown of Aragon rules the Mediterranean unchallenged."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev1_a:0 "Edinburgh Citadel Restored"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev1_a:0 "The dramatic recovery of Edinburgh Castle anchors royal authority and defensive resolve across Lothian."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev1_b:0 "Lowland Liberator Vanguard"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev1_b:0 "Battle-hardened Lowland spearmen and border riders push relentlessly to reclaim every occupied shire."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev2_a:0 "Covenant of the Auld Alliance"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev2_a:0 "Shared continental diplomacy and seasoned Garde Ecossaise veterans elevate Scotland's standing across Christendom."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev2_b:0 "Continental Border Subsidies"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev2_b:0 "Foreign diplomatic remittances finance stone peel towers and steady Lowland border garrisons."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev3_a:0 "Crown Writ Over the Highlands"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev3_a:0 "Royal sheriffs and disciplined Lowland-Highland levies tighten Edinburgh's control across northern glens and western lochs."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev3_b:0 "Hebridean Birlinn Concord"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev3_b:0 "Conciliated western clan chiefs supply agile birlinn galley crews and loyal Highland warriors to the Scottish Crown."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev4_a:0 "St Andrews Royal Colleges"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev4_a:0 "Generous royal endowments draw masters from across Europe to train a literate Scottish clergy and chancery."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev4_b:0 "Scots Chancery Jurists"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev4_b:0 "University-trained advocates modernize royal courts, sheriffdom audits, and burgh charters throughout Scotland."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev5_a:0 "Newhaven Royal Fleet"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev5_a:0 "Purpose-built drydocks and heavy-gunned carracks make the Royal Scots Navy feared across the North Sea."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev5_b:0 "North Sea Armed Convoys"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev5_b:0 "Escorted Scottish wool, salt, and herring ships claim prime staples in Campvere, Danzig, and Bordeaux."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev6_a:0 "Highland-Lowland Cultural Concord"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev6_a:0 "Shared patronage of Scots makars, Gaelic bards, and parish education binds all Scottish estates in harmony."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev6_b:0 "Highland Broadsword & Pike Corps"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev6_b:0 "Fierce Highland shock companies paired with disciplined Lowland pikemen form a formidable Scottish field army."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev7_a:0 "Caledonian Atlantic Company"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev7_a:0 "Well-capitalized Clyde merchant fleets dominate North Atlantic tobacco, cod, and fur routes."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev7_b:0 "Darien Two-Ocean Venture"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev7_b:0 "Bold overseas colonization spurs maritime ambition and Scottish settler vigor across distant horizons."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev8_a:0 "Scottish Enlightenment Academies"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev8_a:0 "Universal parish schooling and celebrated university faculties place Scotland at the vanguard of European science and letters."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev8_b:0 "Clyde Commercial & Industrial Engine"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev8_b:0 "Joint-stock banking, precision workshops, and free-market enterprise propel Scottish productivity skyward."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev9_a:0 "Consolat de Mar Jurisprudence"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev9_a:0 "Predictable Catalan maritime arbitration lowers shipping risks and draws merchants from every Mediterranean shore."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev9_b:0 "Catalan Anti-Corsair Patrols"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev9_b:0 "Fast patrol galleys financed by port dues keep the Balearic and Sardinian sea lanes clear of raiders."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev10_a:0 "Compact of Caspe"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev10_a:0 "Lawful succession by tri-realm consensus calms regional jealousies and fortifies dynastic legitimacy."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev10_b:0 "Iberian Dynastic Chancery"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev10_b:0 "Close familial ties across the peninsula turn Aragonese diplomacy into a decisive instrument of statecraft."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev11_a:0 "Magnanimous Renaissance Court"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev11_a:0 "Patronage of Lorenzo Valla, Neapolitan scholars, and Catalan jurists radiates Aragonese prestige across Italy and Iberia."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev11_b:0 "Viceroyalty of the Two Sicilies"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev11_b:0 "Coordinated viceroys in Palermo and Naples channel grain, sailors, and tribute seamlessly to the Crown."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev12_a:0 "Reials Drassanes Mass Production"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev12_a:0 "Assembly-line Mediterranean shipbuilding fields lethal war galleys faster and more cheaply than any competitor."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev12_b:0 "Almogavar Marine Boarding Corps"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev12_b:0 "Seasoned Catalan marines excel equally at boarding enemy galleys and storming fortified coastal citadels."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev13_a:0 "Pactist Harmony of the Cortes"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev13_a:0 "Respect for regional fueros secures enthusiastic estate cooperation and rock-steady municipal bond credit."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev13_b:0 "Supreme Council of the Crown"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev13_b:0 "Centralized chancery commissioners coordinate war supply and taxation across Iberia and Italy."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev14_a:0 "Valencian Silk & Brocade Boom"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev14_a:0 "Lustrous Valencian velvets and damasks command premium prices from Naples to Antwerp."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev14_b:0 "Lonja Clearing & Credit Exchange"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev14_b:0 "Letters of exchange cleared under royal guarantee turn Aragonese cities into premier banking hubs."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev15_a:0 "Thalassocracy of the Four Bars"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev15_a:0 "Every resource of the Crown serves invincible sea power, portolan mastery, and Mediterranean commercial dominance."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev15_b:0 "Iberian Dual-Crown Imperium"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev15_b:0 "Aragonese constitutional prestige and Castilian-Italian armies project unmatched continental authority."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev16_a:0 "Sovereign of Mare Nostrum"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev16_a:0 "Unchallenged command of Mediterranean ports, trade fairs, and sea lanes crowns the Crown of Aragon in eternal glory."
 STATIC_MODIFIER_NAME_oe_gem2_mod_ev16_b:0 "Bastions of the Four Bars"
 STATIC_MODIFIER_DESC_oe_gem2_mod_ev16_b:0 "Trace-italienne harbor fortresses and disciplined artillery regiments render every Aragonese coast impregnable."
 oe_gem2.1.title:0 "The Recapture of Edinburgh Castle"
 oe_gem2.1.desc:0 "Under cover of merchant wagons hauling wine and grain, William Douglas's picked men have stormed the steep basalt crag of Edinburgh Castle! With Lothian's keystone fortress wrested back from Balliol and English occupation, King David II's cause surges across the Lowlands."
 oe_gem2.1.a:0 "Re-establish the royal seat and citadel garrison at Edinburgh"
 oe_gem2.1.b:0 "Reward the Lowland warbands and press the southern border war"
 oe_gem2.2.title:0 "Renewing the Auld Alliance"
 oe_gem2.2.desc:0 "Envoys bearing the fleurs-de-lis arrive from Paris to renew the Auld Alliance forged by John Balliol and Robert the Bruce. French gold, veteran captains, and honored commissions in the Garde Ecossaise offer Scotland a continental counterweight to southern hegemony."
 oe_gem2.2.a:0 "Swear the Treaty of Vincennes and dispatch the Garde Ecossaise"
 oe_gem2.2.b:0 "Channel French subsidies into domestic burghs and border castles"
 oe_gem2.3.title:0 "Pacifying the Lordship of the Isles"
 oe_gem2.3.desc:0 "From their galley strongholds on Islay and Skye, the MacDonald Lords of the Isles treat the Hebrides as a sovereign maritime kingdom, raiding the Moray Firth and contesting the Earldom of Ross. The Crown must decide whether to curb the western sea-lords by steel or by royal charter."
 oe_gem2.3.a:0 "Assert royal justice at Harlaw and enforce Crown shires in the Highlands"
 oe_gem2.3.b:0 "Confirm Hebridean galley privileges in return for sworn feudal service"
 oe_gem2.4.title:0 "Bulls of the University of St Andrews"
 oe_gem2.4.desc:0 "Bells ring across Fife as papal bulls confirm the founding of Scotland's first university at St Andrews! No longer must Scottish clerks, jurists, and theologians brave perilous seas to study in Paris or Oxford—a beacon of northern scholarship now shines upon our own coast."
 oe_gem2.4.a:0 "Endow royal chairs of canon law, rhetoric, and natural philosophy"
 oe_gem2.4.b:0 "Focus the curriculum on royal jurisprudence and burgh administration"
 oe_gem2.5.title:0 "Launch of James IV's Great Michael"
 oe_gem2.5.desc:0 "The oak forests of Fife have yielded a floating fortress: the Great Michael, the largest carrack in Christendom, ten feet thick in the hull and bristling with heavy bronze culverins! Anchored in the Firth of Forth, she proclaims Scotland a true Renaissance naval power."
 oe_gem2.5.a:0 "Build a permanent royal dockyard squadron around the Great Michael"
 oe_gem2.5.b:0 "Pair royal escorts with private merchant convoys to the Baltic and Flanders"
 oe_gem2.6.title:0 "Highland Renaissance & the Clan Compact"
 oe_gem2.6.desc:0 "From Gaelic harp schools and Scots Renaissance poetry at Stirling to stone tower-houses rising along the Tay and Clyde, a vivid cultural flowering bridges Lowland burghs and Highland glens. Enlightened statutes can turn clan pride into lasting national unity."
 oe_gem2.6.a:0 "Sponsor bilingual Gaelic-Scots letters and royal highland estates"
 oe_gem2.6.b:0 "Enlist Highland clan regiments alongside standing royal pike guards"
 oe_gem2.7.title:0 "The North Atlantic & Darien Charter"
 oe_gem2.7.desc:0 "Ambitious Edinburgh bankers and Glasgow shipowners present a bold charter for a Company of Scotland trading to the New World and the Indies. Backed by sober logistics and North Atlantic timber ports, Scottish enterprise may win an overseas empire—or overreach on fever-ridden isthmuses."
 oe_gem2.7.a:0 "Underwrite disciplined North Atlantic & Nova Scotia trading stations"
 oe_gem2.7.b:0 "Launch a daring tropical entrepot expedition to link two oceans"
 oe_gem2.8.title:0 "Dawn of the Scottish Enlightenment"
 oe_gem2.8.desc:0 "Following Parliament's landmark Education Act mandating a school in every parish, Scotland's four ancient universities erupt in intellectual brilliance. Across Edinburgh's clubs and Glasgow's workshops, pioneering thinkers reshape moral philosophy, commercial economics, chemistry, and steam engineering."
 oe_gem2.8.a:0 "Found the Royal Society of Edinburgh for natural and moral inquiry"
 oe_gem2.8.b:0 "Apply Enlightenment political economy to Clyde industry and banking"
 oe_gem2.9.title:0 "Llibre del Consolat de Mar"
 oe_gem2.9.desc:0 "Jurists and sea-captains of Barcelona, Valencia, and Palma have compiled the Llibre del Consolat de Mar—a comprehensive code of maritime contracts, freight insurance, salvage, and prize law. Adopted from Gibraltar to the Levant, Catalan sea law becomes the gold standard of Mediterranean trade."
 oe_gem2.9.a:0 "Promulgate the code across every Aragonese port and overseas consulate"
 oe_gem2.9.b:0 "Empower maritime consuls to levy galley-escort dues against corsairs"
 oe_gem2.10.title:0 "The Compromise of Caspe"
 oe_gem2.10.desc:0 "When the ancient House of Barcelona faced a perilous succession crisis, nine respected jurists and prelates—three each from Aragon, Catalonia, and Valencia—convened at the river town of Caspe. Rather than plunge the Crown into ruinous civil war, they resolved the succession by solemn legal ballot."
 oe_gem2.10.a:0 "Enshrine constitutional arbitration as the bedrock of the composite Crown"
 oe_gem2.10.b:0 "Use the Trastamara dynastic bridge to expand Iberian diplomatic leverage"
 oe_gem2.11.title:0 "Alfonso the Magnanimous in Naples"
 oe_gem2.11.desc:0 "Beneath a gilded Roman triumphal arch carved into the Castel Nuovo, King Alfonso the Magnanimous enters Naples in splendor! Uniting Aragon, Catalonia, Valencia, Mallorca, Sardinia, Sicily, and mainland Naples, his court draws the finest Italian humanists and Catalan captains alike."
 oe_gem2.11.a:0 "Make Castel Nuovo a radiant humanist capital of the western Mediterranean"
 oe_gem2.11.b:0 "Organize Southern Italy as an integrated viceroyalty funding imperial fleets"
 oe_gem2.12.title:0 "The Catalan Mediterranean Arsenal"
 oe_gem2.12.desc:0 "Under the soaring stone arches of Barcelona's Reials Drassanes, hundreds of shipwrights, rope-makers, and gunfounders assemble an entire fleet of war galleys simultaneously. With Mallorca's portolan charts and Almogavar marine detachments aboard, no rival navy dares contest our sea lanes."
 oe_gem2.12.a:0 "Standardize modular galley hulls and bronze bow-chasers at the Drassanes"
 oe_gem2.12.b:0 "Expand marine barracks for amphibious Almogavar boarding regiments"
 oe_gem2.13.title:0 "The Cortes of Aragon & Sworn Fueros"
 oe_gem2.13.desc:0 "As royal campaigns stretch across Italy and the Pyrenees, the Cortes of Zaragoza, the Catalan Corts, and the Justicia of Aragon remind the monarch of the ancient pactist oath: each estate pledges service and taxes so long as the Crown guards their laws and liberties."
 oe_gem2.13.a:0 "Uphold the Fueros and partner with the Generalitat on fiscal reform"
 oe_gem2.13.b:0 "Create a unified Royal Council of Aragon to streamline imperial decrees"
 oe_gem2.14.title:0 "Valencian Silk Exchange: Lonja de la Seda"
 oe_gem2.14.desc:0 "Master mason Pere Compte has raised a cathedral of commerce in the heart of Valencia: the Lonja de la Seda! Beneath its palm-vaulted Hall of Columns, silk weavers, Genoese bankers, and Levantine spice factors strike fortunes that make Valencia the wealthiest metropolis of Iberia."
 oe_gem2.14.a:0 "Charter royal silk guilds and tax-free Mediterranean fair weeks"
 oe_gem2.14.b:0 "Expand the Taula de Canvi clearing bank inside the Lonja pavilion"
 oe_gem2.15.title:0 "Union of Crowns or Mediterranean Empire"
 oe_gem2.15.desc:0 "Standing at the hinge of the Renaissance world, the Crown of Aragon faces a historic strategic choice. Shall we weld our Italian and Iberian inheritances into a continental Dual Monarchy dominating Europe, or dedicate every ducat and shipyard to an independent Mediterranean thalassocracy?"
 oe_gem2.15.a:0 "Forge a Mediterranean Thalassocracy ruled from Barcelona, Valencia, and Naples"
 oe_gem2.15.b:0 "Champion an equal Iberian Dual Monarchy projecting power across both land and sea"
 oe_gem2.16.title:0 "Four Bars Over Mare Nostrum"
 oe_gem2.16.desc:0 "From the Ebro Valley and Valencia's golden orchards across the Balearics, Sardinia, Sicily, and the Bay of Naples, the crimson-and-gold Four Bars fly over a triumphant Mediterranean commonwealth. Ships salute our consuls in every harbor while modern artillery galleons guard the straits."
 oe_gem2.16.a:0 "Proclaim the Perpetual Maritime Commonwealth of Aragon"
 oe_gem2.16.b:0 "Modernize Mediterranean coastal citadels and royal siege artillery"
