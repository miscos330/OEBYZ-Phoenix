 STATIC_MODIFIER_NAME_oe_pmam_diu_triumph_mod: "Triumph of Diu: Red Sea Spice Supremacy"
 STATIC_MODIFIER_DESC_oe_pmam_diu_triumph_mod: "Amir Husain al-Kurdi's Suez fleet, allied with Gujarat and Calicut, breaks the Portuguese Cartaz blockade at Diu—securing Cairo's spice wealth for another half-century."
 STATIC_MODIFIER_NAME_oe_pmam_diu_fiscal_shock_mod: "Post-Diu Spice Fiscal Shock"
 STATIC_MODIFIER_DESC_oe_pmam_diu_fiscal_shock_mod: "Portuguese Cartaz patrols choke the Bab el-Mandeb, slashing Red Sea customs and forcing Cairo into urgent fiscal and military overhaul."
 STATIC_MODIFIER_NAME_oe_pmam_fifth_corps_cadre_mod: "Al-Tabaqa al-Khamisa Fifth Corps"
 STATIC_MODIFIER_DESC_oe_pmam_fifth_corps_cadre_mod: "Overcoming Furusiyya aristocratic disdain for firearms, the Sultan recruits Awlad al-Nas and Cairo artisans into a standing arquebus and artillery corps."
 STATIC_MODIFIER_NAME_oe_pmam_trajan_suez_canal_mod: "Trajan-Suez Dual-Sea Canal Open"
 STATIC_MODIFIER_DESC_oe_pmam_trajan_suez_canal_mod: "Reopened under Mamluk stewardship, the Nile-Red Sea locks pass war galleys and spice cogs directly between the Mediterranean and the Indian Ocean."
 STATIC_MODIFIER_NAME_oe_pmam_suez_canal_loc_mod: "Suez Dual-Sea Lock Basin"
 STATIC_MODIFIER_DESC_oe_pmam_suez_canal_loc_mod: "Monumental canal locks and imperial drydocks linking Mediterranean and Indian Ocean traffic."
 STATIC_MODIFIER_NAME_oe_pmam_red_sea_coffee_web_mod: "Aden-Jeddah-Hormuz Spice & Coffee Web"
 STATIC_MODIFIER_DESC_oe_pmam_red_sea_coffee_web_mod: "Control of Aden, Jeddah, and Muscat funnels Indian Ocean spices and Yemeni coffee into Cairo's warehouses."
 STATIC_MODIFIER_NAME_oe_pmam_nile_shuna_granary_mod: "Nile Barrages & Imperial Shuna Granaries"
 STATIC_MODIFIER_DESC_oe_pmam_nile_shuna_granary_mod: "Nile irrigation barrages and vast royal Shuna granaries shield Egypt and the Hejaz through Little Ice Age famines and secure Mediterranean grain dominance."
 STATIC_MODIFIER_NAME_oe_pmam_salaried_army_mod: "Abolition of Iqta': Salaried Standing Army"
 STATIC_MODIFIER_DESC_oe_pmam_salaried_army_mod: "Ending three centuries of feudal Iqta' tax-farming channels land revenue straight to Cairo to fund a disciplined, salaried standing army."
 STATIC_MODIFIER_NAME_oe_pmam_nile_cotton_shipyard_mod: "Nile Cotton Manufactories & Alexandria Dockyards"
 STATIC_MODIFIER_DESC_oe_pmam_nile_cotton_shipyard_mod: "State-sponsored Delta cotton mills and modern ordnance shipyards at Alexandria spark early industrialization across the Nile."
 STATIC_MODIFIER_NAME_oe_pmam_azhar_enlightenment_mod: "Al-Azhar Renewal & Arab Enlightenment"
 STATIC_MODIFIER_DESC_oe_pmam_azhar_enlightenment_mod: "Pairing Al-Azhar's venerable scholarship with colleges of navigation, medicine, and engineering renews Cairo as a luminous center of learning."
 STATIC_MODIFIER_NAME_oe_pmam_dual_sea_sultanate_mod: "Modern Dual-Sea Sultanate of Suez & the Nile"
 STATIC_MODIFIER_DESC_oe_pmam_dual_sea_sultanate_mod: "Defying European bids for the Isthmus of Suez, a reformed standing army, modern fleet, and solvent treasury carry the Dual-Sea Sultanate into the modern era."
 STATIC_MODIFIER_NAME_oe_pmam_coptic_nile_accord_mod: "Coptic & Ethiopian Nile-Red Sea Accord"
 STATIC_MODIFIER_DESC_oe_pmam_coptic_nile_accord_mod: "Chartered protection for Egyptian Copts and trade privileges with Solomonic Ethiopia safeguard upper Nile peace and Red Sea customs."
