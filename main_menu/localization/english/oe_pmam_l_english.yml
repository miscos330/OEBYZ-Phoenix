 oe_pmam_pol_barsbay_tarh_monopoly_desc: "Enforces royal purchasing and forced quotas on pepper, cloves, and sugar—swelling crown revenue while constricting private Karimi houses."
 oe_pmam_pol_venetian_alexandria_accord: "Venetian-Alexandria Maritime Accord"
 oe_pmam_pol_venetian_alexandria_accord_desc: "Grants Alexandria tariff concessions in return for timber, iron, and naval artisans, strengthening joint Mediterranean-Red Sea shipping."
 oe_pmam_karimi_funduq: "Karimi Spice Funduq Exchange"
 oe_pmam_karimi_funduq_desc: "A fortified stone-vaulted spice exchange (Funduq) in Cairo, Alexandria, Jeddah, Aden, or Suez, uniting pepper grading, credit clearing, and Red Sea convoy dispatch."
 oe_pmam_karimi_funduq_maint: "Karimi Spice Funduq (Operations)"
 oe_pmam_fifth_corps_arquebusiers: "Fifth Corps Arquebusiers"
 oe_pmam_fifth_corps_arquebusiers_desc: "Standing arquebusier regiments of Al-Tabaqa al-Khamisa recruited from Awlad al-Nas and Cairo artisans, bringing disciplined matchlock volleys to Egypt's battlefields."
 oe_pmam_red_sea_war_galley: "Red Sea Suez War Galley"
 oe_pmam_red_sea_war_galley_desc: "Shallow-draft war galleys assembled at Suez with heavy bronze bow cannon, engineered to navigate Red Sea reefs and challenge oceanic carracks off Diu and Aden."
 oe_pmam_adv_fifth_corps: "Fifth Corps Arquebus & Suez Galley Doctrine"
 oe_pmam_adv_fifth_corps_desc: "Codifies Fifth Corps matchlock drill and Suez gun-galley construction, unlocking Fifth Corps Arquebusiers and Red Sea War Galleys."
 oe_pmam_dec_charter_karimi_guild.title: "Charter the Karimi Red Sea Spice Guild"
 oe_pmam_dec_charter_karimi_guild.desc: "Issues a royal charter safeguarding Karimi spice merchants across Jeddah, Aden, and Alexandria, lifting Karimi vitality and sea trade revenue."
 oe_pmam_dec_charter_karimi_guild.a: "Grant the Royal Karimi Guild Charter"
 oe_pmam_dec_commission_fifth_corps.title: "Commission the Fifth Corps Arquebusiers"
 oe_pmam_dec_commission_fifth_corps.desc: "Overcomes Furusiyya cavalry conservatism to expand Al-Tabaqa al-Khamisa (up to tier 4) with Awlad al-Nas and Cairo artisans armed with matchlocks and cannon."
 oe_pmam_dec_commission_fifth_corps.a: "Recruit and Drill the Fifth Corps"
 oe_pmam_dec_abolish_iqta_farming.title: "Abolish Iqta' Tax-Farming for a Salaried Army"
 oe_pmam_dec_abolish_iqta_farming.desc: "Reclaims feudal Iqta' land assignments into the Cairo treasury to pay a centralized salaried standing army, ending emir factionalism."
 oe_pmam_dec_abolish_iqta_farming.a: "Proclaim the Salaried Standing Army"
 oe_pmam.1.t: "Aftermath of al-Nasir and the Rawk al-Nasiri Cadastre Audit"
 oe_pmam.1.d: "Following the death of Sultan al-Nasir Muhammad, rival emirs in the Cairo Citadel scramble for power while encroaching upon the royal estates registered in the great Rawk al-Nasiri cadastre of 1315. The court must decide whether to appease the commanders with fresh Iqta' grants or enforce an iron fiscal audit across Egypt and Syria."
 oe_pmam.1.a: "Enforce a Strict Rawk Cadastre Audit and Reclaim Crown Lands"
 oe_pmam.1.b: "Distribute Fresh Iqta' Estates to Soothe the Emirs"
 oe_pmam.2.t: "Barquq's Coup: Bahri Dynasty or Burji Circassian Order?"
 oe_pmam.2.d: "Forty years of palace intrigue reach their climax. Barquq, leader of the Circassian mamluks quartered in the Citadel towers (Burj), challenges the hereditary Kipchak Bahri line—declaring that only an elective martial sultanate forged by battle-tested commanders can defend Egypt and Syria."
 oe_pmam.2.a: "Embrace the Burji Circassian Martial Order"
 oe_pmam.2.b: "Defend the Hereditary Bahri Sultanate"
 oe_pmam.3.t: "Abbasid Caliphate of Cairo and Custodian of the Two Sanctuaries"
 oe_pmam.3.d: "Within Cairo dwells the surviving Abbasid Caliphate, while the annual gilded Mahmal pilgrimage caravan binds Mecca and Medina to the Sultan's protection. Elevating this spiritual guardianship can project unmatched Sunni legitimacy across the Islamic world."
 oe_pmam.3.a: "Magnify the Cairo Caliphate and Two Sanctuaries Pilgrimage"
 oe_pmam.3.b: "Keep Ceremonies Modest and Reserve Gold for Frontier Pay"
 oe_pmam.4.t: "Barsbay's 1428 Spice Monopoly and the Karimi Merchants"
 oe_pmam.4.d: "To plug deficits in military payroll, fiscal advisers echo Sultan Barsbay's bold 1428 edict: impose a crown spice monopoly and forced quota (Tarh) on pepper and sugar. The Cairo treasury would swell overnight, yet squeezing the Karimi merchant houses risks driving Indian Ocean captains to rival harbors."
 oe_pmam.4.a: "Sign a Revenue-Sharing Charter with the Karimi Guilds"
 oe_pmam.4.b: "Enforce the Royal Tarh Spice Monopoly for Immediate Silver"
 oe_pmam.5.t: "Alarm in the Northern Levant: Shadow over Aleppo"
 oe_pmam.5.d: "Storm clouds gather beyond the Taurus Mountains: rising powers in Anatolia cast a lengthening shadow over Aleppo and Damascus. Syrian governors urgently ask Cairo whether to fortify the northern marches for war or offer commercial concessions for a Levantine truce."
 oe_pmam.5.a: "Fortify Aleppo and Damascus as an Unyielding Northern Bulwark"
 oe_pmam.5.b: "Negotiate a Levantine Trade Pact to Secure the Northern Flank"
 oe_pmam.6.t: "Thunder off the Cape and the Secret Venetian Timber Mission"
 oe_pmam.6.d: "Fast dhows from Aden and Calicut bring alarming news: Portuguese broadside carracks have rounded the Cape of Good Hope, imposing armed Cartaz passes and burning spice ships bound for Jeddah. Facing common ruin, secret Venetian envoys slip into Alexandria offering Dalmatian oak, bronze guns, and master shipwrights to be hauled overland to Suez—forging a clandestine Venice-Mamluk naval pact!"
 oe_pmam.6.a: "Seal the Secret Venice-Suez Timber Pact and Build the Red Sea Armada!"
 oe_pmam.6.b: "Decline Venetian Involvement and Build Alone with Levantine Cedar"
 oe_pmam.7.t: "Showdown on the Indian Ocean: The 1509 Battle of Diu"
 oe_pmam.7.d: "The Suez armada has cleared the Bab el-Mandeb! Under Amir Husain al-Kurdi, Mamluk war galleys rendezvous off Diu with Gujarat and the Zamorin of Calicut to confront the Portuguese viceroy's ocean-going fleet. Victory will break the Cartaz stranglehold and save Cairo's spice hegemony; defeat will shake the Sultanate's treasury to its foundations."
 oe_pmam.7.a: "Commit Everything off Diu to Shatter the Cartaz Blockade!"
 oe_pmam.7.b: "Hold the Narrows of Aden and Jeddah with Defensive Escort Squadrons"
 oe_pmam.8.t: "Furusiyya Pride or Arquebus? Raising Al-Tabaqa al-Khamisa"
 oe_pmam.8.d: "Proud mamluk horsemen steeped in Furusiyya chivalry despise the matchlock (Bunduqiyya) as a base weapon unworthy of knights. Yet an age of volley fire shows no mercy: the Sultan moves to bypass conservative emirs and recruit Awlad al-Nas, Turkomans, and Cairo artisans into a royal Fifth Corps (Al-Tabaqa al-Khamisa) armed with arquebuses and field cannon."
 oe_pmam.8.a: "Override Emir Objections and Raise the Fifth Corps Arquebusiers!"
 oe_pmam.8.b: "Limit Firearms to Auxiliary Siege Gunners to Placate the Emirs"
 oe_pmam.9.t: "Reopening the Trajan-Suez Dual-Sea Canal"
 oe_pmam.9.d: "Long buried beneath desert drift since Pharaoh Necho and Emperor Trajan, the ancient canal linking the Nile to the Red Sea is surveyed anew by Cairo's master engineers. With stone locks closing at Suez, galleys and spice cogs can pass directly between the Mediterranean and the Indian Ocean under the Sultan's sole command."
 oe_pmam.9.a: "Complete the Suez Dual-Sea Locks and Unite Both Oceans!"
 oe_pmam.9.b: "Upgrade the Cairo-Suez Overland Caravan Road Instead"
 oe_pmam.10.t: "Red Sea Emporium Network: Aden, Jeddah, and Muscat"
 oe_pmam.10.d: "With Aden, Jeddah, and the Arabian littoral secured under unified customs, Red Sea shipping thrives without fractured tolls. Alongside Indian pepper and Javanese cloves, aromatic Yemeni coffee takes Cairo and the Mediterranean by storm, opening a booming new pillar of royal trade."
 oe_pmam.10.a: "Unify the Aden-Jeddah-Muscat Spice and Coffee Emporia"
 oe_pmam.10.b: "Raise Export Duties on Coffee and Spices for Naval Pay"
 oe_pmam.11.t: "Nile Barrages, Imperial Shuna Granaries, and Little Ice Age Relief"
 oe_pmam.11.d: "As cold summers and failed harvests grip Eurasia, the annual flood of the Nile remains the richest breadbasket of the Mediterranean. Hydraulic engineers propose Delta barrages and expanded royal Shuna granaries to blunt Little Ice Age famine and cement Egypt's supremacy over regional grain supply."
 oe_pmam.11.a: "Build Nile Barrages and Imperial Shuna Granaries"
 oe_pmam.11.b: "Sell Surplus Nile Grain Abroad at Famine Prices"
 oe_pmam.12.t: "End of Military Tax-Farming: From Iqta' Fiefs to Salaried Corps"
 oe_pmam.12.d: "Backed by Fifth Corps musketeers and centralized customs, the Sultan strikes at the root of three centuries of factional instability. Feudal Iqta' tax-farming is abolished in favor of direct treasury collection and monthly silver pay, transforming rival mamluk households into a unified salaried standing army."
 oe_pmam.12.a: "Abolish Iqta' Forever and Establish the Salaried Standing Army!"
 oe_pmam.12.b: "Buy Out Emir Privileges with Lifetime Pensions for Smooth Reform"
 oe_pmam.13.t: "Nile Long-Staple Cotton and Modern Alexandria Shipyards"
 oe_pmam.13.d: "Experiments along the Nile Delta yield lustrous long-staple cotton eagerly sought across Europe and the Levant, while new drydocks and cannon foundries rise beside Alexandria's harbor—igniting an early modern manufacturing boom across Egypt."
 oe_pmam.13.a: "Invest in Delta Cotton Mills and Alexandria Ordnance Shipyards"
 oe_pmam.13.b: "License Cotton Manufactories to Karimi Houses for Customs Share"
 oe_pmam.14.t: "Renewal of Al-Azhar and the Arab Enlightenment"
 oe_pmam.14.d: "Millennium-old Al-Azhar stands at an intellectual crossroads. Reformist scholars and royal engineers propose pairing its revered legal and theological traditions with colleges of cartography, navigation, medicine, and printing—rekindling Cairo's voice in global science."
 oe_pmam.14.a: "Expand Al-Azhar with Navigation, Medicine, and Translation Colleges"
 oe_pmam.14.b: "Preserve Traditional Ulema Curricula and Confine Engineering to Officers"
 oe_pmam.15.t: "Guarding Suez: Defying Great-Power Designs on Egypt"
 oe_pmam.15.d: "In the late eighteenth century, European expeditionary squadrons eye Alexandria and the Isthmus of Suez as the prized shortcut to India. Yet they confront not a fractured medieval court, but a solvent, gun-armed Dual-Sea Sultanate commanding both the Nile and the Red Sea."
 oe_pmam.15.a: "Proclaim the Modern Dual-Sea Sultanate and Defy All Invaders!"
 oe_pmam.15.b: "Enforce Armed Neutrality and Levy Global Transit Tolls at Suez"
 oe_pmam.16.t: "Coptic and Ethiopian Nile-Red Sea Commercial Accord"
 oe_pmam.16.d: "Envoys from Solomonic Ethiopia arrive in Cairo bearing gold, ivory, and letters from the Coptic Patriarch of Alexandria. Chartering protection for Egyptian Copts and granting Ethiopian vessels fair berths along the Red Sea guarantees upper Nile harmony while drawing East African trade into Cairo's orbit."
 oe_pmam.16.a: "Guarantee Coptic Autonomy and Sign the Ethiopian Trade Accord"
 oe_pmam.16.b: "Maintain Standard Red Sea Tariffs Without Special Exemptions"
