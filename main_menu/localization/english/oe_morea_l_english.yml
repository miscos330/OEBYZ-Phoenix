l_english:
 oe_mo_sea_league: "Fought the Turks at sea alongside us"
 oe_mo_latin_peace: "Made peace with the Despotate of the Morea"
 oe_mo_argos_deal: "We kept out of Argos"
 oe_mo_knights_corinth: "Entrusted Corinth to the Knights"
 oe_mo_dowry: "A marriage between our houses"
 STATIC_MODIFIER_NAME_oe_mo_kephale_rule: "Under a Kephale"
 STATIC_MODIFIER_NAME_oe_mo_sea_watch: "Morean Sea Watch"
 STATIC_MODIFIER_NAME_oe_mo_mistra_walls: "New Walls of Mistra"
 STATIC_MODIFIER_NAME_oe_mo_knights_garrison: "Garrisoned by the Knights"
 STATIC_MODIFIER_NAME_oe_mo_corinth_walls: "Walls of Corinth"
 STATIC_MODIFIER_NAME_oe_mo_ravaged: "The Morea Ravaged"
 oe_mo.1.t: "The Despotate of the Morea"
 oe_mo.1.desc: "#F In 1348 John VI sent the second imperial son, Manuel Kantakouzenos, to govern the Morea. The next autumn Manuel settled at Mistra, and the empire's remaining lands in the Peloponnese became the Despotate of the Morea.#!\n\nMistra lies far from the capital; its kephalai change every year and the local magnates go their own way. Some at court propose giving the land to a member of the imperial family, who would live at Mistra as despot. The obvious choice is [SCOPE.sCharacter('oe_mo_cand').GetName]."
 oe_mo.1.a: "Create the despotate"
 oe_mo.1.a.tt: "[SCOPE.sCharacter('oe_mo_cand').GetName] becomes despot; the theme of the Peloponnese becomes a despotate ([Concept('oe_tu_status','status')|e]), founded with its seat at Mistra if there is none\nCosts #R 5#! [oe_tu_authority|e]"
 oe_mo.1.b: "Send a kephale"
 oe_mo.1.b.tt: "Every location of ours in the Peloponnese gains [ShowModifier('oe_mo_kephale_rule')] for #Y 10#! years\nCosts #R 2#! [oe_tu_authority|e]"
 oe_mo.1.c: "Leave it for now"
 oe_mo.2.t: "Latin Lords and Turkish Raiders"
 oe_mo.2.desc: "#F Manuel Kantakouzenos brought the magnates of the Morea to heel, and with Venice and the Knights Hospitaller drove off Turkish raiders at sea.#!\n\nA messenger from the despot reports that the Latin lords of Achaea are eyeing the border and Turkish ships are back off the Morean coast. The despot asks the court for a policy."
 oe_mo.2.a: "Join Venice and the Knights at sea"
 oe_mo.2.a.tt: "Venice and the Knights Hospitaller: opinion of us #G +25#!\nEvery coastal location of ours in the Peloponnese gains [ShowModifier('oe_mo_sea_watch')] for #Y 10#! years"
 oe_mo.2.b: "Make peace with Achaea"
 oe_mo.2.b.tt: "Achaea: opinion of us #G +30#!"
 oe_mo.2.c: "Strengthen Mistra"
 oe_mo.2.c.tt: "Mistra gains [ShowModifier('oe_mo_mistra_walls')] for #Y 20#! years"
 oe_mo.3.t: "The Kantakouzenoi Take Their Leave"
 oe_mo.3.desc: "#F Manuel Kantakouzenos died in 1380 and the family would not give up Mistra; only in 1383 did Theodore, son of John V, take over the Morea.#!\n\nThe seat of the despot of [SCOPE.sCountry('oe_mo_theme').GetName] is empty. The last despot came from a house other than the emperor's, and that house still holds Mistra and will not give it up lightly."
 oe_mo.3.a: "Send an imperial prince"
 oe_mo.3.a.tt: "[SCOPE.sCharacter('oe_mo_cand').GetName] becomes despot\n[SCOPE.sCountry('oe_mo_theme').GetName]: loyalty #R −15#!\n#R 20%#! chance of a rising"
 oe_mo.3.b: "Let the old house keep it"
 oe_mo.3.b.tt: "[SCOPE.sCharacter('oe_mo_heir').GetName] inherits the despotate\n[SCOPE.sCountry('oe_mo_theme').GetName]: loyalty #G +10#!"
 oe_mo.3.c: "Take it back as heartland"
 oe_mo.3.c.tt: "[SCOPE.sCountry('oe_mo_theme').GetName] stops being a despotate and becomes heartland ([Concept('oe_tu_status','status')|e])\nLoyalty #R −10#!"
 oe_mo.4.t: "Argos and Nauplia"
 oe_mo.4.desc: "#F In 1388 the last Latin lord of Argos and Nauplia died, and Theodore I, despot of the Morea, seized Argos before anyone else, only to cede the city to Venice in 1394.#!\n\nThe Argolid is now held by [SCOPE.sCountry('oe_mo_t').GetName], next to our lands in the Morea."
 oe_mo.4.a: "Claim Argos"
 oe_mo.4.a.tt: "A casus belli against [SCOPE.sCountry('oe_mo_t').GetName] for #Y 10#! years"
 oe_mo.4.b: "Let Venice have it"
 oe_mo.4.b.tt: "Venice: opinion of us #G +20#!"
 oe_mo.4.c: "Stay out"
 oe_mo.5.t: "Corinth in Trust"
 oe_mo.5.desc: "#F Around 1395 Theodore I bought Corinth but could not afford to fortify and hold it, and in 1397 sold it to the Knights Hospitaller of Rhodes.#!\n\nThe armies of [SCOPE.sCountry('oe_mo_foe').GetName] are in Greece, and Corinth is first in their path. The walls have fallen into disrepair and the garrison is too small."
 oe_mo.5.a: "Let the Knights garrison it"
 oe_mo.5.a.tt: "Corinth gains [ShowModifier('oe_mo_knights_garrison')] for #Y 7#! years\nThe Knights Hospitaller: opinion of us #G +20#!"
 oe_mo.5.b: "Fortify it ourselves"
 oe_mo.5.b.tt: "Corinth gains [ShowModifier('oe_mo_corinth_walls')] for #Y 20#! years"
 oe_mo.5.c: "Leave it be"
 oe_mo.6.t: "Rebuilding the Hexamilion"
 oe_mo.6.desc: "#F In the spring of 1415 Manuel II oversaw the rebuilding of the Hexamilion across the Isthmus of Corinth in person; it took forty days, and the heavy labour service set the magnates of the Morea grumbling.#!\n\nThe horsemen of [SCOPE.sCountry('oe_mo_foe').GetName] could cross the Isthmus of Corinth at any moment. Only ruins are left of the wall across it; to hold the Morea it has to be rebuilt."
 oe_mo.6.a: "The emperor oversees the work"
 oe_mo.6.a.tt: "The #bold #color_yellow Hexamilion#!#! is built at Corinth\nThe theme of the Peloponnese, if any: loyalty #R −10#!"
 oe_mo.6.b: "Let the despot and the locals pay"
 oe_mo.6.b.tt: "The #bold #color_yellow Hexamilion#!#! is built at Corinth\nThe theme of the Peloponnese: loyalty #R −15#!"
 oe_mo.6.c: "Do not build it"
 oe_mo.7.t: "The Wall Has Fallen"
 oe_mo.7.desc: "#F The Hexamilion was breached or pulled down again and again: in 1423, 1431 and 1446.#!\n\nThe army of [SCOPE.sCountry('oe_mo_foe').GetName] has taken Corinth. The #bold #color_yellow Hexamilion#!#! has been pulled down and enemy horsemen are plundering the Morea; every location of ours in the Peloponnese gains [ShowModifier('oe_mo_ravaged')] for #Y 5#! years."
 oe_mo.7.a: "Sue for peace"
 oe_mo.7.a.tt: "Peace can be bought with Buy Peace with Tribute in the Roman Cultural Sphere"
 oe_mo.7.b: "Call on the Moreots to hold out"
 oe_mo.8.t: "The Tocco Dowry"
 oe_mo.8.desc: "#F After the battle of the Echinades in 1427 Carlo Tocco gave up the lands in Elis; in 1428 Constantine married Tocco's niece and Glarentza came to Byzantium as the bride's dowry.#!\n\nAndravida and the land around it are held by [SCOPE.sCountry('oe_mo_t').GetName]. They are weak and willing to settle with a marriage: a member of our imperial family marries their princess and the land comes to the empire as the dowry."
 oe_mo.8.a: "Accept the match and the dowry"
 oe_mo.8.a.tt: "Andravida comes to the empire\n[SCOPE.sCountry('oe_mo_t').GetName]: opinion of us #G +30#!"
 oe_mo.8.b: "Take it by force"
 oe_mo.8.b.tt: "A casus belli against [SCOPE.sCountry('oe_mo_t').GetName] for #Y 10#! years"
 oe_mo.8.c: "Decline"
 oe_mo.9.t: "The Siege of Patras"
 oe_mo.9.desc: "#F In 1429 Constantine laid siege to Patras; the townsfolk gave in first, and the archbishop's castle held out until 1430.#!\n\nPatras is held by [SCOPE.sCountry('oe_mo_t').GetName], on the border of our lands in the Morea."
 oe_mo.9.a: "Lay siege"
 oe_mo.9.a.tt: "A casus belli against [SCOPE.sCountry('oe_mo_t').GetName] for #Y 10#! years"
 oe_mo.9.b: "Buy the city"
 oe_mo.9.b.tt: "Patras comes to the empire, and Chalandritsa too if it has the same owner"
 oe_mo.9.c: "Leave it"
 oe_mo.10.t: "The Heiress of Achaea"
 oe_mo.10.desc: "#F Centurione II Zaccaria, prince of Achaea, died in 1432; the heiress Catherine had married Thomas Palaiologos, and the principality passed to the empire.#!\n\nThe Principality of Achaea is down to a handful of castles. The prince is old and has no son, and offers the princess in marriage to a member of our imperial family; the principality would then depend on the empire."
 oe_mo.10.a: "Marry the heiress"
 oe_mo.10.a.tt: "Achaea becomes our subject in the #bold #color_yellow Roman Alliance#!#!; up the ladder of subjects it can later be [Concept('oe_tu_provincialise','made a province')|e]"
 oe_mo.10.b: "Wait for it to fall apart"
 oe_mo.11.t: "Brothers at Odds"
 oe_mo.11.desc: "#F In the 1440s the Palaiologan brothers fought over the Morea and the lands near the capital; in 1449 Thomas and Demetrios were both despots of the Morea.#!\n\nSeveral adult relatives of the emperor want a share of the Morea, and the quarrels at the despot's court have reached the capital."
 oe_mo.11.a: "Let two share it"
 oe_mo.11.a.tt: "The theme of the Morea: loyalty #R −10#!"
 oe_mo.11.b: "Call one to the capital"
 oe_mo.11.c: "Leave it to the despot"
 oe_mo.11.c.tt: "The theme of the Morea: loyalty #G +5#!"
 oe_mo.12.t: "Acclaimed at Mistra"
 oe_mo.12.desc: "#F On 6 January 1449 Constantine was acclaimed emperor at Mistra in a plain ceremony; Constantine reached Constantinople three months later.#!\n\nThe new emperor [SCOPE.sCharacter('oe_mo_emp').GetName] was at Mistra when the throne passed to them. Leave for the capital at once, or hold a ceremony at Mistra first?"
 oe_mo.12.a: "Leave for the capital at once"
 oe_mo.12.b: "Hold the ceremony at Mistra first"
